  raw: 'The Promise.race() method is best used in situations where you want to be
    able to short-circuit the completion of a number of different promises. Unlike
    Promise.any() , where you specifically want one of the promises to succeed and
    only care if all promises fail, with Promise.race() you want to know even if one
    promise fails as long as it fails before any other promise fulfills. Here are
    some situations where you may want to use Promise.race() .


    Establishing a Timeout for an Operation


    While the fetch() function has a lot of helpful functionality, one thing it doesn’t
    do is manage a timeout for a given request; a request will happily hang until
    the request completes one way or another. You can easily create a wrapper method
    to add a timeout to any request by using Promise.race() :


    1 function timeout ( milliseconds ) { 2     return new Promise (( resolve , reject
    ) => { 3         setTimeout (() => { 4             reject ( new Error ( “Request
    timed out.” )); 5         }, milliseconds ); 6     }); 7 } 8 9 function fetchWithTimeout
    (… args ) { 10     return Promise . race ([ 11         fetch (… args ), 12    
        timeout ( 5000 ) 13     ]); 14 } 15 16 const API_URL = “https://jsonplaceholder.typicode.com/users”
    ; 17 18 fetchWithTimeout ( API_URL ) 19     . then ( response => response . json
    ()) 20     . then ( users => console . log ( users )) 21     . catch ( reason
    => console . error ( reason . message ));


    The timeout() function is similar to the delay() function created earlier in this
    chapter except that it calls reject() after a delay rather than resolve() . In
    this case, the delay represents an error condition as you want to be informed
    when a request has taken longer than expected (5000 milliseconds in this example).
    The fetchWithTimeout() function then calls fetch() along with timeout() in an
    array that is passed to Promise.race() . If the call to fetch() takes longer than
    the timeout, the returned promise is rejected so you can handle the failure appropriately.


    Keep in mind that even though fetchWithTimeout() will reject if a request takes
    longer than the specified timeout, the request will not be cancelled. It will
    continue waiting for a response behind-the-scenes even though the response will
    be ignored.


    Summary


    For times when you want to monitor and respond to multiple promises at the same
    time, JavaScript provides several methods. Each method behaves slightly differently,
    but all allow you to run promises in parallel and respond to them as a group:


    Promise.all() - the returned promise is fulfilled when all of the promises are
    fulfilled, and the returned promise is rejected when any promise is rejected.


    Promise.allSettled() - the returned promise is always fulfilled with an array
    of results from the promise, and the returned promise is never rejected.


    Promise.any() - the returned promise is fulfilled when the first promise is fulfilled,
    and the returned promise is rejected when all of the promises are rejected.


    Promise.race() - the returned promise is fulfilled when the first promise to settle
    is fulfilled, and the returned promise is rejected when the first promise to settle
    is rejected.


    Each of these methods is appropriate for different use cases, and it’s up to you
    to decide which is appropriate in any situation.


    4.  Async Functions and Await Expressions


    JavaScript promises were designed to be a low-level utility that could be used
    behind-the-scenes by higher-level language features. Async functions are just
    such a higher-level language feature that makes programming with promises more
    similar to programming without promises. Instead of worry about tracking promises
    and their various handlers, async functions abstract away the promises. The end
    result is code that follows a familiar top-down sequence.


    Before getting into the details of how async functions work, it helps to understand
    how they are defined.


    I use the term “async functions” to describe functions as well as methods that
    appear on objects or classes. Whenever the term is used, you can assume what I’m
    saying also applies to asynchronous methods unless otherwise indicated.


    Defining Async Functions


    Async functions can be used anywhere synchronous functions can be used. In most
    cases, all you need to do is add the async keyword before any function or method
    definition to make it asynchronous. Here are some examples:


    1 // async function declaration 2 async function doSomething () { 3     // body
    4 } 5 6 // async arrow function 7 const doSomethingToo = async () => { 8     //
    body 9 }; 10 11 // async arrow function 12 const doSomethingElse = async a =>
    { 13     // body 14 }; 15 16 // async object method 17 const object = { 18    
    async doSomething () { 19         // body 20     } 21 }; 22 23 // async class
    method 24 class MyClass { 25     async doSomething () { 26         // body 27
        } 28 }


    The async keyword indicates that the following function or method should be made
    asynchronous. It’s important for the JavaScript engine to know ahead of time if
    a function is asynchronous because it behaves differently than a synchronous function.


    What Makes Async Functions Different


    Async functions are different from synchronous functions in four ways:


    The return value is always a promise


    Thrown errors are promise rejections


    The await expression can be used


    The for-await-of loop can be used


    These four aspects of async functions make them quite different from synchronous
    functions, so it’s worth going through each point in more detail.


    The Return Value Is Always a Promise


    You can use the return operator in async functions the same as synchronous functions.
    The difference is that async functions always return a promise regardless of the
    type of value you specify with return . If you return a number, for example, that
    number is wrapped in a promise:


    1 async function getMeaningOfLife () { 2     return 42 ; 3 } 4 5 const result
    = getMeaningOfLife (); 6 console . log ( result instanceof Promise );     // true
    7 console . log ( typeof result === “number” );     // false 8 9 result . then
    ( value => { 10     console . log ( value );                     // 42 11 });


    In this code, the getMeaningOfLife() async function returns the number 42 , but
    the return value is actually a fulfilled promise. You can then attach a fulfillment
    handler to retrieve the value. Effectively, async functions call Promise.resolve()
    behind-the-scenes to ensure a promise is always returned.


    If you pass a promise to return inside of an async function, then that promise
    is not passed through directly. Instead, the promise state and value are copied
    to a new promise and returned. Here’s an example:


    1 const promise = Promise . resolve ( 42 ); 2 3 async function getMeaningOfLife
    () { 4     return promise ; 5 } 6 7 const result = getMeaningOfLife (); 8 console
    . log ( result === promise );     // false 9 result . then ( value => { 10    
    console . log ( value );             // 42 11 });


    Here, result is not the same promise object as promise , but it does have all
    of the same internal state and so still resolves to 42 .


    If you don’t specify a return value for an async function, then the return value
    is a promise that resolves to undefined . For example:


    1 async function doSomething () { 2     // no return value 3 } 4 5 const result
    = doSomething (); 6 console . log ( result instanceof Promise ); // true 7 result
    . then ( value => { 8     console . log ( value );                 // undefined
    9 });


    The bottom line is no matter what you do inside an async function, it will always
    return a promise. That is also the case when an error is thrown.


    Thrown Errors Are Promise Rejections


    When an error is thrown in an async function, a rejected promise is returned instead
    of throwing the error outside the function. That means you cannot catch errors
    from async functions using try-catch . For example, the following will not trap
    the error:'
