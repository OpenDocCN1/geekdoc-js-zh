    \ `albums` 数据可供处理。\n\n## 创建人工延迟\n\n`Promise.all()` 的一个不常见场景是你希望延迟某些操作发生得太快。这种情况在浏览器端比在服务器端更有可能发生，因为在服务器端，你有时需要在用户操作和响应之间设置微小的延迟。例如，当从服务器获取数据时，你可能希望显示一个加载指示器，但如果响应太快，用户可能看不到加载旋转动画，从而不知道屏幕上的数据是最新的。在这种情况下，你可以引入一个人工延迟，如下所示：\n\
