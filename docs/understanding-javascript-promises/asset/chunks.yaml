    \n`Promise.all()` 的另一个常见用例是调用多个 Web 服务 API。这在 REST API 中特别为常见，因为与实体关联的种类型数据可能有其自己的端点。例如，考虑一个应用程序，每个用户都有博客文章和专辑，你可能需要在用户的个人资料中收集所有这些信息。代码可能如下：\n"
