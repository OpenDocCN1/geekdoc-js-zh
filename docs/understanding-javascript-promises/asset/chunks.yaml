  trans: "\n\n你也可以对拒绝处理器（rejection handler）执行相同的操作。当拒绝处理器被调用时，它可能会返回一个值。如果返回了，该值将用于解析链中的下一个\
    \ promise，如下所示：\n\n```javascript\nconst promise = Promise.reject(42);\npromise.catch(value\
    \ => {\n    // 拒绝处理器\n    console.error(value);      // 42\n    return value +\
    \ 1;\n}).then(value => {\n    // 成功处理处理器\n    console.log(value);        // 43\n\
    });\n```\n\n在这里，创建了一个值为 `42` 的拒绝状态 promise。该值被传递给 promise 的拒绝处理器，并在该处返回了 `value\
    \ + 1`。尽管这个返回值来自拒绝处理器，但它仍然被用于链中下一个 promise 的成功处理处理器。如果必要的话，一个 promise 的失败可以允许整个链的恢复。\n\
    \n然而，使用 `finally()` 会导致不同的行为。从状态处理器（settlement handler）返回的任何值都会被忽略，这样你就可以访问原始\
    \ promise 的值。这里有一个示例：\n\n```javascript\nconst promise = Promise.resolve(42);\n\
    promise.finally(() => {\n    // 状态处理器\n    return 43;                  // 被忽略！\n\
    }).then(value => {\n    // 成功处理处理器\n    console.log(value);        // 42\n});\n\
    ```\n\n传递给成功处理处理器的值是 `42` 而不是 `43`。状态处理器中的 return 语句被忽略，以便可以使用 `then()` 获取原始值。这是\
    \ `finally()` 返回一个状态和值复制自原始 promise 的结果结果之一。\n\n## 在 Promise 链中返回 Promise\n\n\
    从 promise 处理器返回原始类型值允许在 promise 之间传递数据，但如果你返回一个对象呢？如果该对象是一个 promise，那么会额外执行一步来确定如何继续。考虑以下示例：\n\
    \n```javascript\nconst promise1 = Promise.resolve(42);\nconst promise2 = Promise.resolve(43);\n\
    \npromise1.then(value => {\n    console.log(value);    // 42\n    return promise2;\n\
    }).then(value => {\n    console.log(value);    // 43\n});\n```\n\n在这段代码中，`promise1`\
    \ 解析为 `42`。`promise1` 的成功处理处理器返回了 `promise2`，这是一个已经处于解析状态的 promise。第二个成功处理处理器被调用，是因为\
    \ `promise2` 已经成功解析。如果 `promise2` 被拒绝，则会调用拒绝处理器（如果存在），而不是第二个成功处理处理器。\n\n关于这种模式需要识别到的重要点是，第二个成功处理处理器并没有被添加到\
    \ `promise2` 上，而是被第三个 promise 上，这使得上一个示例等同于此：\n\n```javascript\nconst promise1\
    \ = Promise.resolve(42);\nconst promise2 = Promise.resolve(43);\n\nconst promise3\
    \ = promise1.then(value => {\n    console.log(value);    // 42\n    return promise2;\n\
    });\n\npromise3.then(value => {\n    console.log(value);    // 43\n});\n```\n\n\
    在这里，很明显第二个成功处理处理器是绑定在 `promise3` 而不是 `promise2` 上。这是一个微妙但重要的区别，因为如果 `promise2`\
    \ 被拒绝，第二个成功处理处理器将不会被调用。例如：\n\n```javascript\nconst promise1 = Promise.resolve(42);\n\
    const promise2 = Promise.reject(43);\n\npromise1.then(value => {\n    console.log(value);\
    \    // 42\n    return promise2;\n}).then(value => {\n    console.log(value);\
    \    // 永远不会被调用\n});\n```\n\n在这个示例中，第二个成功处理处理器永远不会被调用，因为 `promise2` 被拒绝了。不过，你可以附加一个拒绝处理器：\n\
    \n```javascript\nconst promise1 = Promise.resolve(42);\nconst promise2 = Promise.reject(43);\n\
    \npromise1.then(value => {\n    console.log(value);    // 42\n    return promise2;\n\
    }).catch(value => {\n    console.error(value);      // 43\n});\n```\n\n在这里，拒绝处理器是因为\
    \ `promise2` 被拒绝而被调用。来自 `promise2` 的拒绝值 `43` 被传递到该拒绝处理器中。\n\n当一个操作需要多个 promise\
    \ 才能执行完成时，从成功处理处理器返回 promise 是很有用的。例如，`fetch()` 需要第二个 promise 来读取响应体。要读取 JSON\
    \ 响应体，你需要使用 `json()`，它返回另一个 promise。在不使用链式调用的情况下如下：\n\n```javascript\nconst promise1\
    \ = fetch(\"books.json\");\npromise1.then(response => {\n    promise2 = response.json();\n\
    \    promise2.then(payload => {\n        console.log(payload);\n    }).catch(reason\
    \ => {\n        console.error(reason);\n    });\n});\n```\n\n这段代码需要两个拒绝处理器来捕捉错误。从成功处理处理器返回第二个\
    \ promise 可以简化代码：\n\n```javascript\nconst promise = fetch(\"books.json\");\npromise.then(response\
    \ => {\n    return response.json();\n}).then(payload => {\n    console.log(payload);\n\
    }).catch(reason => {\n    console.error(reason);\n});\n```\n\n在这里，当接收响应时，第一个成功处理处理器被调用并返回一个读取体的\
    \ promise。你只需要在结尾处拒绝处理器来捕获沿中的错误。\n\n使用 `finally()` 从状态处理器返回 promise 也表现出与 `then()`\
    \ 或 `catch()` 不同的行为。首先，如果你从状态处理器返回一个已解析的 promise，该 promise 将被忽略而优先保留原始 promise，如示例所示：\n\
    \n```javascript\nconst promise = Promise.resolve(42);\npromise.finally(() => {\n\
    \    return Promise.resolve(44);\n}).then(value => {\n    console.log(value);\
    \    // 42\n});\n```\n\n在这个示例中，状态处理器返回了一个带有 `44` 的 promise，但返回的 promise 使用原始值\
    \ `42` 是成功解析的。\n\n然而，如果你从状态处理器返回一个被拒绝的 promise，那么返回的 promise 将采用该原因，并且返回的 promise\
    \ 将被拒绝，如下：\n\n```javascript\nconst promise = Promise.resolve(42);\npromise.finally(()\
    \ => {\n    return Promise.reject(43);\n}).catch(reason => {\n    console.error(reason);\
    \ // 43\n});\n```\n\n即使原始 promise 被拒绝，这一点仍然成立，如下所示：\n\n```javascript\nconst promise\
    \ = Promise.reject(43);\npromise.finally(() => {\n    return Promise.reject(45);\n\
    }).catch(reason => {\n    console.log(reason); // 45\n});\n```\n\n从状态处理器返回被拒绝的\
    \ promise 在功能上等同于抛出错误：返回的 promise 将根据指定的原因被拒绝。\n\n从成功处理或拒绝处理器返回 promise 不会改变 promise\
    \ 执行器的执行顺序。第一个定义的 promise 将先运行其执行器；然后运行第二个 promise 执行器，依此类推。返回 promise 仅仅是允许你对\
    \ promise 的结果定义额外的响应。你通过在成功处理处理器内部创建一个新的 promise 来推迟成功处理器的执行。例如：\n\n```javascript\n\
    const p1 = Promise.resolve(42);\np1.then(value => {\n    console.log(value); \
    \   // 42\n    // 创建一个新的 promise\n    const p2 = new Promise((resolve, reject)\
    \ => {\n        setTimeout(() => {\n            resolve(43);\n        }, 500);\n\
    \    });\n    return p2;\n}).then(value => {\n    console.log(value);    // 43\n\
    });\n```\n\n"
- fmt: "\nIn this example, a new promise is created within the fulfillment handler\
    \ for `p1`. That means the second fulfillment handler won’t execute until after\
    \ `p2` is fulfilled. The executor for `p2` is delayed by 500 milliseconds using\
    \ `setTimeout()`, but more realistically you might make a network or file system\
    \ request. This pattern is useful when you want to wait until a previous promise\
    \ has been settled before starting a new asynchronous operation.\n\n# Summary\n\
    \nMultiple promises can be chained together in a variety of ways to pass information\
    \ between them. Each call to `then()`, `catch()`, and `finally()` creates and\
    \ returns a new promise that is resolved when the preceding promise is settled.\
    \ If the promise handler returns a value, then that value becomes the value of\
    \ the newly created promise from `then()` and `catch()` (``finally()` ignores\
    \ this value); if the promise handler throws an error, then the error is caught\
    \ and the returned newly created promise is rejected using that error as the reason.\n\
    \nWhen one promise is rejected in a chain, the promises created from other chained\
    \ handlers are also rejected until the end of the chain is reached. Knowing this,\
    \ it’s recommended to attach a rejection handler at the end of each promise chain\
    \ to ensure that errors are handled correctly. Failing to catch a promise rejection\
    \ will result in a message being output to the console, an error being thrown,\
    \ or both (depending on the runtime environment).\n\nYou can return promises from\
    \ handlers, and in that case, the promise returned from the call to `then()` and\
    \ `catch()` will settle to match the settlement state and value of the promise\
    \ returned from the handler (fulfilled promises returned from `finally()` are\
    \ ignored while rejected promises are honored). You can use this to your advantage\
    \ by delaying some operations until a promise is fulfilled, then initiating and\
    \ returning a second promise to continue using the same promise chain.\n\nThis\
    \ chapter explored how to chain multiple promises together so they act more like\
    \ one promise. In this next chapter, you’ll learn how to work with multiple promises\
    \ acting in parallel.\n\n# 3. Working with Multiple Promises\n\nUp to this point,\
    \ each example in this book has dealt with responding to one promise at a time.\
    \ Sometimes, however, you’ll want to monitor the progress of multiple promises\
    \ in order to determine the next action. JavaScript provides several methods that\
    \ monitor multiple promises and respond to them in slightly different ways. All\
    \ of the methods discussed in this chapter allow multiple promises to be executed\
    \ in parallel and then responded to as a group rather than individually.\n\n##\
    \ The Promise.all() Method\n\nThe `Promise.all()` method accepts a single argument,\
    \ which is an iterable (such as an array) of promises to monitor, and returns\
    \ a promise that is resolved only when every promise in the iterable is resolved.\
    \ The returned promise is fulfilled when every promise in the iterable is fulfilled,\
    \ as in this example:\n\n```javascript\nlet promise1 = Promise.resolve(42);\n\
    let promise2 = new Promise((resolve, reject) => {\n    resolve(43);\n});\nlet\
    \ promise3 = new Promise((resolve, reject) => {\n    setTimeout(() => {\n    \
    \    resolve(44);\n    }, 100);\n});\n\nlet promise4 = Promise.all([promise1,\
    \ promise2, promise3]);\n\npromise4.then(value => {\n    console.log(Array.isArray(value));\
    \   // true\n    console.log(value[0]);               // 42\n    console.log(value[1]);\
    \               // 43\n    console.log(value[2]);               // 44\n});\n```\n\
    \nEach promise here resolves with a number. The call to `Promise.all()` creates\
    \ `promise4`, which is ultimately fulfilled when promises `promise1`, `promise2`,\
    \ and `promise3` are fulfilled. The result passed to the fulfillment handler for\
    \ `promise4` is an array containing each resolved value: `42`, `43`, and `44`.\
    \ The values are stored in the order the promises were passed to `Promise.all()`,\
    \ so you can match promise results to the promises that resolved to them.\n\n\
    If any promise passed to `Promise.all()` is rejected, the returned promise is\
    \ immediately rejected without waiting for the other promises to complete:\n\n\
    ```javascript\nlet promise1 = Promise.resolve(42);\nlet promise2 = Promise.reject(43);\n\
    let promise3 = new Promise((resolve, reject) => {\n    setTimeout(() => {\n  \
    \      resolve(44);\n    }, 100);\n});\n\nlet promise4 = Promise.all([promise1,\
    \ promise2, promise3]);\n\npromise4.catch(reason => {\n    console.log(Array.isArray(reason));\
    \ // false\n    console.log(reason);               // 43\n});\n```\n\nIn this\
    \ example, the second promise (`promise2`) is rejected with a value of `43`. The\
    \ rejection handler for `promise4` is called immediately without waiting for the\
    \ first promise.\n\n## When to Use Promise.all()\n\nYou’ll want to use `Promise.all()`\
