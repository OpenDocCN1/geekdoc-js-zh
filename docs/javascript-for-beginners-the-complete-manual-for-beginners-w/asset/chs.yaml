  \ JavaScript 中创建字符串的实例。\n\n```javascript\nvar stringname=new String(\"hello javascript\
  \ string\");\ndocument.write(stringname);\n```\n\n输出：\n`greetings javascript string`\n\
  \n## JavaScript 字符串方法\n\n我们应该查看 JavaScript 字符串方法的总结。\n\n| 方法 | 描述 |\n| :--- | :---\
