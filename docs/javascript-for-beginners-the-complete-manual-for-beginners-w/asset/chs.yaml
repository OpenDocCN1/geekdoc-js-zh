- "# JavaScript 入门指南：从零学习 JavaScript 的完整技巧与手册\n\n\n\n![](img/Image00004.jpg)\n\n\n\
  \n\n\n\n# 引言\n\n与 `C++`、`Ruby` 和 `Python` 等语言相比，JavaScript 是一种直观且容易上手的编程语言。它是一种不可否认的解释型语言，无疑可以嵌入到\
  \ `HTML` 中。它由 `Netscape Communications Corporation`、`Mozilla Foundation` 和 `ECMA\
  \ International` 创建。`Brendan Eich` 被认为是 JavaScript 编程语言的创造者。\n\n\n\n\nJavaScript\
  \ 是一种独特的 PC 编程语言。它轻量级，最常被用作网页的一部分，其执行允许客户端内容与服务器通信并创建动态页面。它是一种具有面向对象能力的解释型编程语言。\n\
  \nJavaScript 最初被设计用于“让网页活起来”。\n\n这种语言中的项目被称为脚本（contents）。它们可以直接编写在网页的 HTML 中，并在页面加载时自然地运行。\n\
  \n脚本以纯内容的形式提供并执行。它们的运行不需要额外的复杂的规划或编译。在这一方面，JavaScript 与另一种名为 `Java` 的语言完全不同。\n\n\
  JavaScript 最初被称为 `LiveScript`，但网景（Netscape）将其更名为 `JavaScript`，这可能是由于当时 `Java` 引起的热度考量。JavaScript\
  \ 在 1995 年以 `LiveScript` 的名称出现在 Netscape 2.0 中。该语言的通用核心已被植入 `Netscape`、`Internet\
  \ Explorer` 以及其他网络浏览器中。\n\n## JavaScript 有什么用途？\n\n我们在介绍中已经略微提到了这一点，但这里是 JavaScript\
  \ 主要用途的快速概述。增加网站的直观性——是的，如果你需要网站不仅仅是一个静态文本页面，你就需要编写一些 `JavaScript`。创建多功能应用——JavaScript\
  \ 不仅用于网站……它还用于制作你手机和平板电脑上的应用程序。制作基于网络浏览器的游戏——你曾直接从浏览器中玩过游戏吗？JavaScript 很可能帮助了这些游戏的运行。后端\
  \ Web 开发——毫无疑问，JavaScript 主要用于前端，但它是一种足够灵活的脚本语言，也可以用于后端架构。\n\n## 什么让 JavaScript\
  \ 变得很有趣？\n\nJavaScript 是一种灵活且强大的编程语言，被不同的网络浏览器可靠地执行。与 `HTML` 和 `CSS` 一起，它是 Web 科技的核心部分。虽然\
  \ `HTML` 负责设计，`CSS` 负责样式，但 JavaScript 为程序中的页面提供了智能。\n\nJavaScript 在使用框架时非常有价值。它有能够验证客户端输入错误的能力，并进一步节省时间。如果用户未填写某个必填字段，或者数据错误，JavaScript\
  \ 会将信息发送到服务器之前对其进行检查。同样，由于 JavaScript 是一种客户端技术，它可以在程序上执行基本的计算。程序不需要为每项任务都请求服务器时间。这在用户需要多次执行这些估算时特别有用。在这种情况下，与服务器交互花费的时间比执行实际计算要多得多。\n\
  \nJavaScript 为程序提供了更多的控制权，而不是完全依赖 Web 服务器。JavaScript 为不同的程序提供了额外功能，有助于减轻服务器负担和组织流量。由于程序解析\
  \ JavaScript，它处理了编译和兼容性问题。因此，它可以在 `Windows`、`Macintosh` 以及其他由网景支持的系统上运行。同样，也可以将其嵌入到其他内容（如\
  \ `HTML`）中以保持 JavaScript 的使用。\n\n通常在其他编程语言中，数字和对象类型是有区别的，但 JavaScript 对数字只识别一种对象类型，因此我在\
  \ Mozilla 文档中发现过：“JavaScript 中没有所谓的整数这种类型”。此外，JavaScript 中有一个“undefined”（未定义）值，这是一种模糊类型的估计，表示未初始化的值。通常在其他语言中，未初始化的值等于“invalid”或“nil”。但\
  \ JavaScript 不是。\n\n\n\n\n-   **对游客的快速反馈**：他们不需要等待页面刷新即可检查自己是否漏掉了某些输入。\n-   **扩展的直观性**：你可以制作界面在客户端鼠标悬停其上方或通过控制台启动它们时做出响应。\n\
  -   **更华丽的界面**：你可以利用 `JavaScript` 整合直观的分段和滑块等元素，为网站访客提供丰富的界面（Rich Interface）。\n\
  -   **速度**：客户端 `JavaScript` 极其快速，因为它倾向于在客户端程序内部即时运行。除非需要外部资源，否则 `JavaScript` 不受到向后端工作线程网络调用的限制。\n\
  -   **轻松性**：`JavaScript` 通常易于学习和执行。\n-   **无处不在**：`JavaScript` 应用于网络的任何地方。\n-  \
  \ **互操作性**：`JavaScript` 与不同的方言相处良好，可以应用于极其广泛领域。\n-   **工作者负载**：作为客户端，减轻了网站服务器的负担。\n\
  -   **适应性**：通过 `Node.js` 工作线程使用 `JavaScript` 有许多方法。如果你恰好使用 `Express` 引导了 `Node.js`，使用像\
  \ `MongoDB` 这样的报告数据库，并在前端为客户使用 `JavaScript`，那么可以使用 `JavaScript` 从前端到后端构建整个 `JavaScript`\
  \ 应用。\n-   **更新**：自 `ECMAScript 5`（`JavaScript` 依赖的脚本细节）以来，`ECMA International`\
  \ 致力于每年更新 `JavaScript`。到目前，我们已经在 2017 年获得了 `ES6` 的程序支持，并预计以后将支持 `ES7`。\n-   **扩展功能**：开发者可以通过组合\
  \ `JavaScript` 代码段用于如 `Greasemonkey` 等外部附加项，来扩展网站页面的实用性。\n\n## JavaScript 的缺点\n\n\
  -   **客户端安全**：由于 `JavaScript` 代码在客户端执行，漏洞和疏忽有时会被用于恶意目的。基于此，一些小组决定完全禁用 `JavaScript`。\n\
  -   **程序支持**：虽然服务器端的内容始终产生相似的输出，但在某些情况下，不同的程序会以意外的方式解析 `JavaScript` 代码。如今这些差异微乎其微，只要你在每个重要的程序中测试了内容，就不需要担心它。\n\
  -   **JavaScript 中的主要问题或缺陷**是代码对所有人都是可见的，任何人都可以看到 `JavaScript` 代码。\n-   无论快速 `JavaScript`\
  \ 解析到何种程度，`JavaScript DOM`（文档对象模型）都是适中的，并且可以与 `HTML` 实现从不快速的交付。如果错误发生在 `JavaScript`\
  \ 中，可能会停止整个网站的交付。程序对 `JavaScript` 错误非常宽容。\n-   `JavaScript` 通常被不同的程序以不同的方式进行解析。这使得阅读和编写跨程序代码变得相当复杂。\n\
  -   尽管某些 `HTML` 编辑器支持检查，但它没有像 `C/C++` 编辑器那样的编辑器那样有效。因此，设计师很难区分这些问题。这种持续的转换在数字到整数的更改中需要更长时间。这扩展了运行内容的预期时间并降低了其速度。\n\
  \n# 第二章\n\n# JavaScript 语法\n\n`JavaScript` 的语法是描述一个组织良好的 `JavaScript` 程序的决策安排。\n\
  \n`JavaScript` 标准库不包含权威标准内容输出工作（`document` 除外）。由于 `JavaScript` 主要用于现代网络浏览器内的客户端脚本编写，且几乎所有的\
  \ `Web` 程序都提供警告工作，因此警告也可以使用，但通常不被使用。\n\n`JavaScript` 的大部分语法来自 `Java`，但同时也继承自 `Awk`\
  \ 和 `Perl`，并在其对象模型框架中受到 `Self` 的一些反向影响。\n\n## 基础\n\n`JavaScript` 是大小写敏感的。构造函数的名称以大写字母开头，函数或变量名以小写字母开头并不是意外的。\n\
  \n示例：\n\n```javascript\nvar a=5;\nconsole.log(a);/5\nconsole.log(A);/抛出 ReferenceError:\
  \ A isn't defined\n```\n\n## 空格与分号\n\n与 `C` 不同，`JavaScript` 源码中的空格会直接影响语义。分号在 `JavaScript`\
  \ 中结束语句。由于“自动分号插入”（`ASI`），某些在解析时因换行而形成环绕排列的语句将被视为是完整的，就像在换行之前仅嵌入了一个分号一样。一些专家建议显式地提供语句结束的分号，因为这可以减少自动分号插入带来的意外影响。\n\
  \n这里有两个问题：五个标记既可以启动一个断言，也可以是整个断言的扩展；以及五个限制性创建，在特定位置不允许换行，可能会导致错误的解析。这五个危险标记是左括号\
  \ `(`、左中括号 `[`、切片符号 `/` 以及 `+` 和减号 `-`。在这些中，左括号在快速构造的语句示例中是正常的，左中括号有时发生，而其他的非常罕见。规范中给出的示例是：\n\
  \n```javascript\na = b + c\n(d + e).foo()\n```\n\n/视为：\n\n```javascript\na = b +\
  \ c(d + e).foo();\n```\n\n假设前面的断言以分号结束。\n\n一些人倾向于在以 `(` 或 `[` 开头的行前使用引导分号，这样该行就不会意外地与上一行合并。这被称为谨慎分号，尤其被推荐，因为这可以减少自动分号插入的意外影响。例如]：\n\
  \n```javascript\na = b + c\n;(d + e).foo()\n```\n\n/处理为：\n\n```javascript\na = b\
  \ + c(d + e).foo();\n```\n\n假设前面的断言以分号结束。\n\n有些人宁愿在以 `(` 或 `[` 开头的行前使用引导分号，这样该行就不会意外地与上一行合并。这被称为谨慎分号，尤其被推荐，因为这可以减少自动分号插入带来的意外影响。例如：\n\
  \n```javascript\na = b + c\n;(d + e).foo()\n```\n\n/处理为：\n\n```javascript\na = b\
  \ + c(d + e).foo();\n```\n\n假设前面的断言以分号结束。 (此处由于原文存在重复内容)\n\n# 第三章\n\n# JavaScript\
  \ 函数\n\n函数是一个带有（可能为空的）边界列表的正方形，通常被赋予一个名称。函数可以使用局部因子。如果你在函数中遗留返回语句，则将返回未定义（undefined）。\n\
  \n```javascript\nfunction gcd(segmentA, segmentB) {\n  var diff = segmentA - segmentB;\n\
  \  在事件 (diff == 0)\n    return segmentA;\n  return diff > 0 ? gcd(segmentB, diff)\
  \ : gcd(segmentA, - diff);\n}\n\nconsole.log(gcd(60, 40));/20\n```\n\nvar mygcd\
  \ = gcd;/mygcd 是指向与 gcd 相同函数的引用。注意没有括号 ()。\n\nconsole.log(mygcd(60, 40));/20\n\n\
  函数是五星抗议，并可能被还原到不同的因子。\n\n\n\n\n\n调用函数时提供的冲突参数（contentions）数量可能与容量定义中的冲突参数数量并不完全对应；如果定义中的具名冲突参数在调用中没有对应的协调冲突参数，则其值将变得模糊（这可以被证实为无效）。在容量内部，同样可以通过\
  \ `contentions` 对象获取到`contentions`；这允许访问所有使用列表的冲突参数（例如 `arguments[0]`、`arguments[1]`、...\
  \ `arguments[n]`），包括超出具名冲突参数数量的参数。（虽然 `contentions` 列表具有 `.length` 属性，但它完全不是 `Array`\
  \ 的实例；它不具备某些方法，例如 `.cut()`、`.sort()` 等）\n\n```javascript\nwork add7(x, y) {\n  in\
  \ the event that (!y) {\n    y = 7;\n  }\n  console.log(x + y + arguments.length);\n\
  };\n```\n`add7(3);/输出 11`\n`add7(3, 4);/输出 9`\n\n原始类型（`number`、`boolean`、`string`）按值传递。对于对象，传递的是该对象的引用。\n\
  \n```javascript\nvar obj1 = {a : 1};\nvar obj2 = {b : 2};\n\nwork foo(p) {\n  p\
  \ = obj2;/忽略了真实边界\n  p.b = arguments[1];\n}\n```\n`foo(obj1, 3);/完全没有影响 obj1。3 是多余的边界`\n\
  `console.log(obj1.a + \" + obj2.b);/组合成 1 + 3`\n\n函数可以在不同的函数内部声明，并访问外部函数的作用域因素。此外，即使在外部函数退出后，它们也会通过记住外部函数的作用域因素来执行完全终止（闭包）。\n\
  \n```javascript\nvar v = \"Top\";\nvar bar, baz;\n\nwork foo() {\n  var v = \"fud\"\
  ;\n  bar = work() { console.log(v) };\n  baz = function(x) { v = x; };\n}\nfoo();\n\
  baz(\"Fugly\");\nbar();/尽管 foo() 已经离开，但输出 Fugly（而不是 fud）。\nconsole.log(v);/输出 Top\n\
  \n# 第四章\n\n# JavaScript 变量\n\nJavaScript 变量本质上是容量区域的名称。JavaScript 中有两种类型的因素：局部变量和全局变量。\n\
  \n在声明 JavaScript 变量（也称为标识符）时有几条原则。\n\n- 名称应以字母（从头到尾）、下划线（`_`）或美元符号（$`$`开头。\n- 在第一个字母之后可以使用数字（0\
  \ 到 9），例如 `value1`。\n- JavaScript 因素对大小写敏感，例如 `x` 和 `X` 是不同的因素。\n\n## 正确的 JavaScript\
  \ 变量\n```javascript\nvar x = 10;\nvar _value=\"sonoo\";\n```\n\n## 错误的 JavaScript\
  \ 因素\n```javascript\nvar 123=30;\nvar *aa=320;\n```\n\n## JavaScript 变量示例\n\n我们应该看到\
  \ JavaScript 变量的简单示例。\n\n```html\n<script>\nvar x = 10;\nvar y = 20;\nvar z=x+y;\n\
  document.write(z);\n</script>\n```\n\n上述示例的输出\n30\n\n## JavaScript 局部变量\n\nJavaScript\
  \ 局部变量在花括号或函数内部声明。它在函数或花括号内部是可。例如：\n\n```html\n<script>\nwork abc(){\n  var x=10;//局部变量\n\
  }\n</script>\n```\n\n或者，\n\n```html\n<script>\nIf(10<13){\n  var y=20;//JavaScript\
  \ 局部变量\n}\n</script>\n```\n\n## JavaScript 全局变量\n\nJavaScript 全局变量在函数外部声明，或者通过 `window`\
  \ 对象声明。它可以从任何函数访问。\n\n让我们看看 JavaScript 中全局变量的简单示例：\n\n```html\n<script>\nvar data=200;//全局变量\n\
  work a(){\n  document.writeln(data);\n}\nwork b(){\n  document.writeln(data);\n\
  }\na();//调用 JavaScript 函数\nb();\n</script>\n```\n\n```html\nwork b(){\n  alert(value);\n\
  }\n</script>\n```\n\n## 在函数内部声明 JavaScript 全局变量\n\n要在函数内部声明 JavaScript 全局因素，你需要使用\
  \ `window` 对象。例如：\n\n`window.value=90;`\n\n现在它可以在任何函数内部被声明，并可以从任何容量访问。例如：\n\n```javascript\n\
  work m(){\n  window.value=100;//通过 window 对象声明全局变量\n} \nwork n(){ \n  alert(window.value);//从其他容量访问全局变量\
  \ \n}\n```\n\n## JavaScript 全局变量的原理\n\n当你在函数外部声明变量时，它包含在 `window` 对象内部。你也可以通过 `window`\
  \ 对象访问它。例如：\n\n```javascript\nvar value=50;\nwork a(){\n  alert(window.value);//访问全局变量\n\
  }\n```\n\n## JavaScript 数据类型\n\nJavaScript 提供了多种信息类型来存储各种类型的属性。JavaScript 中有两种信息类型。\n\
  \n- 原始信息类型\n- 非原始（引用）信息类型\n\nJavaScript 是一种强大的类型语言，意味着你不需要指定变量的类型，因为它是由 JavaScript\
  \ 引擎动态使用的。你需要使用 `var` 在这里指定信息类型。它可以持有任何类型的属性，如数字、字符串等。例如：\n\n```javascript\nvar\
  \ a=40;//持有数字\nvar b=\"Rahul\";//持有字符串\n```\n\n## JavaScript 原始信息类型\n\nJavaScript\
  \ 中有五种原始信息类型。它们如下：\n\n| 信息类型 | 描述 |\n| :--- | :--- |\n| String | 代表字符序列，例如 \"hi\"\
  \ |\n| Number | 代表数值属性，例如 100 |\n| Boolean | 代表布尔值，假或真 |\n| Undefined | 代表未定义值\n\
  | Null | 代表无效，例如完全没有值 |\n\n## JavaScript 非原始信息类型\n\n非原始信息类型如下：\n\n| 信息类型 | 描述 |\n\
  | :--- | :--- |\n| Object | 代表实例，通过实例我们可以访问成员 |\n| Array | 代表相似属性的集合 |\n| RegExp\
  \ | 代表正则表达式 |\n\n# 第五章\n\n# JavaScript 数组\n\nJavaScript 的 `Array` 类是一个全局对象，用于...\
  \ 数组是具有索引的对象的集合。\n\n## 描述\n\n数组是具有索引的对象的集合。数组是具有索引的对象的集合。数组是具有索引的对象的集合。数组是具有索引的对象的集合。数组是具有索引的对象的集合。\n\
  \n数组可以用于存储、访问、删除任何因素，并且它们是动态的。\n\n## 常用方法\n\n1. **创建一个数组**\n```javascript\nlet fruits\
  \ = []; // 创建空数组\nlet colors = [\"apple\", \"banana\"]; // 创建带元素的数组\n```\n\n2. **添加元素**\n\
  ```javascript\nfruits.push(\"orange\"); // 在末尾添加\nfruits.unshift(\"grape\"); //\
  \ 在开头添加\n```\n\n3. **删除元素**\n```javascript\nfruits.pop(); // 删除末尾元素\nfruits.shift();\
  \ // 删除开头元素\n```\n\n4. **访问元素**\n```javascript\nconsole.log(fruits[0]); // 获取第一个元素\n\
  console.log(fruits[1]); // 获取第二个元素\n```\n\n5. **修改元素**\n```javascript\nfruits[1]\
  \ = \"blueberry\"; // 修改索引 1 的元素\n```\n\n6. **遍历数组**\n```javascript\nfruits.forEach(function(item)\
  \ {\n  console.log(item);\n});\n\nfor (let fruit of fruits) {\n  console.log(fruit);\n\
  }\n```\n\n7. **查找元素**\n```javascript\nlet index = fruits.indexOf(\"banana\"); //\
  \ 查找索引\nlet exists = fruits.includes(\"apple\"); // 返回布尔\n```\n\n8. **分割数组**\n```javascript\n\
  let str = \"apple,banana,cherry\";\nlet arr = str.split(\",\"); // 字符串转数组\n```\n\
  \n\n\n\n## 10. 从文件位置删除元素\n\n```javascript\nlet vegetables = ['Cabbage', 'Turnip',\
  \ 'Radish', 'Carrot']\nconsole.log(vegetables)\n```\n`[\"Cabbage\", \"Turnip\",\
  \ \"Radish\", \"Carrot\"]`\n\n```javascript\nlet pos = 1\nlet n = 2\nlet removedItems\
  \ = vegetables.splice(pos, n)\n```\n`这是删除元素的方法，`n` 表征要移除的元素数量，从`pos` 指定的列表位置开始，并向最远边界推进。`\n\
  \n```javascript\nconsole.log(vegetables)\n```\n`[\"Cabbage\", \"Carrot\"]` (第一个簇发生了变化)\n\
  \n```javascript\nconsole.log(removedItems)\n```\n`[\"Turnip\", \"Radish\"]`\n\n\
  ## 11. 复制数组\n\n```javascript\nlet shallowCopy = fruits.slice()\n```\n`这是创建副本的方法`\
  \ `[\"Strawberry\", \"Mango\"]`\n\n## 访问数组组件\n\nJavaScript 数组是从 0 开始索引的。簇的主要组件位于列表\
  \ 0，最后一个组件位于记录索引，该索引相当于 `array.length` 属性减 1。\n\n使用无效的列表索引将返回未定义。\n\n```javascript\n\
  let arr = ['this is the primary component', 'this is the subsequent component',\
  \ 'this is the last element']\nconsole.log(arr[0])\n```\n`'this is the main component'`\n\
  \n```javascript\nconsole.log(arr[1])\n```\n`'this is the subsequent component'`\n\
  \n```javascript\nconsole.log(arr[arr.length - 1])\n```\n`'this is the last component'`\n\
  \n数组组件同样是对象的属性，就像 `toString` 是一个属性（尽管明确地说，`toString()` 是一个方法）。此后，尝试按以下方式访问簇的组件会因为属性名不符合规范而产生语法错误：\n\
  \n```javascript\nconsole.log(arr.0)\n```\n`标点符号错误`\n\nJavaScript 簇以及导致此现象的属性并没有特殊之处。以数字开头的\
  \ JavaScript 属性不能通过点表示引用，而应该使用方括号表示来获取。\n\n例如，如果你有一个名为 `3d` 属性的项目，它必须使用方括号表示来引用。\n\
  \n```javascript\nlet years = [1950, 1960, 1970, 1980, 1990, 2000, 2010]\nconsole.log(years.0)\n\
  ```\n`语言结构错误`\n\n```javascript\nconsole.log(years[0])\n```\n`工作正常`\n\n```javascript\n\
  renderer.3d.setTexture(model, 'character.png')\n```\n`语言结构错误`\n\n```javascript\n\
  renderer['3d'].setTexture(model, 'character.png')\n```\n`工作正常`\n\n在 3d 模型中，`'3d'`\
  \ 必须被引用（因为它以数字开头）。但另一方面，引用簇记录也是可行的（例如使用 `years['2']` 而不是 `years[2]`），尽管这样做是多余的。\n\
  \n`years[2]` 中的 `2` 会被 JavaScript 引擎通过隐式的 `toString` 转换转换为字符串。因此，`'2'` 和 `'02'`\
  \ 将指向 `years` 对象上的两个不同位置，且相应的模型可能是有效的：\n\n```javascript\nconsole.log(years['2']\
  \ != a long time\n```\n\n# 第六章\n\n# JavaScript 布尔值\n\n布尔值是 PC 编程语言中常用的原始数据类型。根据定义，布尔值有两个潜在的属性：真或假。\n\
  \n在 JavaScript 中，通常存在强制布尔类型转换。例如，如果你有一个检查特定表达式的 `if` 语句，该表达式将被强制转换为布尔值：\n\n```javascript\n\
  const a = 'a string';\nif (a) {\n    console.log(a);\n}\n```\n`'a string'`\n\n有几个值会被强制转换为假：\n\
  \n- `false`（目前未被实际约束，因为它本身就是假的）\n- `null`\n- `undefined`\n- `NaN`\n- `0`\n- `\"\"\
  `（空字符串）\n\n任何剩余值都将被强制转换为真。当一个值被强制转换为布尔值时，我们额外称之为“虚值”（falsy）或“真值”（truthy）。\n\n类型强制转换的一种方法是使用\
  \ `||` 和 `&&` 运算符：\n\n```javascript\nconst a = 'word';\nconst b = false;\nconst\
  \ c = true;\nconst d = 0\nconst e = 1\nconst f = 2\nconst g = null;\n\nconsole.log(a\
  \ || b);\n```\n`'word'`\n\n```javascript\nconsole.log(c || a);\n```\n`true`\n\n\
  ```javascript\nconsole.log(b || a);\n```\n`'word'`\n\n```javascript\nconsole.log(e\
  \ || f);\n```\n`1`\n\n```javascript\nconsole.log(f || e);\n```\n`2`\n\n```javascript\n\
  console.log(d || g);\n```\n`null`\n\n```javascript\nconsole.log(g || d);\n```\n\
  `0`\n\n```javascript\nconsole.log(a && c);\n```\n`true`\n\n```javascript\nconsole.log(c\
  \ && a);\n```\n`'word'`\n\n显而易见的是，`||` 运算符检查主操作数。如果它是真或真值，它会立即返回它（这就是为什么我们在第一种情况下发现发生了什么，在第二种情况下看到真）。如果它不是真或真值，它会返回后续操作数（这就是为什么我们在第三种情况下发现发生了什么）。\n\
  \n对于 `&&` 运算符，原理类似，但为了使“与”为真，两个操作数都应该是真值。因此，如果两个都是真/真值，它将始终返回后续操作数，否则它将返回假。这就是为什么在第四种情况下得到真，而在最后一种情况下发现发生了什么。\n\
  \n## 布尔对象\n\n同样存在一个 JavaScript 对象可以封装一个值。如果作为 `Boolean()` 传递的值有效，它将被转换为布尔值。\n\n\
  有任何剩余值会被强制转换为假：\n\n```javascript\nconst x = false;\nif (x) {\n    console.log(x);\n\
  }\n```\n\n\n\n\n\n我们应该来看直接创建对象的情况。\n\n```javascript\nvar emp=new Object();\nemp.id=101;\n\
  emp.name=\"Ravi Malik\";\nemp.salary=50000;\ndocument.write(emp.id+\" \"+emp.name+\"\
  \ \"+emp.salary);\n```\n\n上述模型的输出：\n`101 Ravi Malik 50000`\n\n### 3) 通过 Object 构造函数\n\
  \n在这里，你需要处理内容。可以使用这个关键字将本文中的每个内容值分配给当前对象。\n\n`this` 关键字指向当前项。\n\n下面给出了通过构造函数创建对象的示例。\n\
  \n```javascript\nwork emp(id,name,salary){\n  this.id=id;\n  this.name=name;\n \
