  \ |\n| `toLocaleUpperCase()` | 它根据宿主当前区域将给定字符串转换为大写字母。 |\n| `toString()` | 它返回一个特定项的字符串表示。\
  \ |\n| `valueOf()` | 它提供字符串对象的原始值。 |\n| `split()` | 它将字符串分割为子字符串数组，然后返回该创建的数组。 |\n\
  | `trim()` | 它处理字符串左右两侧的空白部分。 |\n\n### 1) JavaScript String charAt(index) 方法\n\n\
