  \ \"+e.name+\" \"+e.salary);\n```\n\n上述模型的输出：\n`103 Vimal Jaiswal 30000`\n\n###\
  \ JavaScript 对象中的方法定义\n\n### 我们可以在 JavaScript 对象中定义方法。然而，在定义方法之前，我们需要在能力中添加与方法同名的属性。\n\
  \n下面给出了在对象中定义方法的示例。\n\n```javascript\nwork emp(id,name,salary){\n  this.id=id;\n\
  \  this.name=name;\n  this.salary=salary;\n  this.changeSalary=changeSalary;\n \
