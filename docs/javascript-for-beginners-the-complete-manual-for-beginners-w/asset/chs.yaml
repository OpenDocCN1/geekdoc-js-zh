  \n```html\n<script>\n\nvar str=\"This is JavaTpoint site;\"\n\ndocument.write(str.split(\"\
  \ \"));/根据给定字符串分割字符串。\n\n</script>\n```\n\n# 第九章\n\n# JavaScript 数字\n\n在现今的 JavaScript\
  \ 中有两种类型的数字：\n\nJavaScript 中的标准数字由 64 位 IEEE-754 方案处理，通常被称为“双精度浮点数”。这些是我们通常使用的数字，我们将在本节中讨论它们。\n\
  \nBigInt 数字用于处理任意长度的整数。它们有时是必需的，考虑到标准数字无法超过 253 位或小于 -253。由于 bigints 几乎只在极少数特定领域中使用，我们将其作为特殊的\
  \ BigInt 使用。\n\n因此，这里我们将检查标准数字。\n\n## 处理数字的更多方法\n\n假设我们需要创建一个 10 亿。最直接的方法是：\n\n\
  ```javascript\nlet billion = 1000000000;\n```\n\n我们同样可以使用下划线 `_` 作为分隔符：\n\n```javascript\n\
  let billion = 1_000_000_000;\n```\n\n在这里，下划线 `_` 被视为“语法糖”的一部分，它让数字更具可读性。JavaScript\
  \ 引擎会直接忽略数字之间的 `_`，因此它与上面的 10 亿完全相同。\n\n在现实中，我们尽量避免编写长长的零序列。那对我们来说很没劲。我们会尝试用类似 \"\
  1bn\" 来表示 10 亿，或用 \"7.3bn\" 表示 73 亿。这种表示法对于大多数巨大的数字都是成立的。\n\n在 JavaScript 中，我们可以通过在数字后附加字母\
  \ \"e\" 并显示零的个数来缩短数字：\n\n```javascript\nlet billion = 1e9;//10 亿，从事实角度看：1 后面有 9\
  \ 个零\n\nalert( 7.3e9 );/73 亿（同于 7300000000 或 7_300_000_000）\n```\n\n在这种情况下，`e` 根据指定的零个数将数字扩大\
  \ 10 的次方。\n\n`1e3 = 1 * 1000/e3` 意味着 `*1000`\n\n`1.23e6 = 1.23 * 1000000/e6` 意味着\
  \ `*1000000`\n\n现在我们应该创建一个很小的数字。例如，1 微秒（秒的百万分之一）：\n\n```javascript\nlet ms = 0.000001;\n\
  ```\n\n考虑到上述情况，使用 \"e\" 可以很有帮助。如果我们想避免显式写出零，可以写成：\n\n```javascript\nlet ms = 1e-6;/1\
  \ 后面减去 6 个零\n```\n\n如果在 0.000001 中包含零，它们共有 6 个。所以通常是 `1e-6`。\n\n最后，\"e\" 之后的负数意味着除以\
  \ 10 的指定零个数的次方：\n\n`/ 3 除以 10 后面有 3 个零`\n\n`1e-3 = 1/1000 (=0.001)`\n\n`/ 6 除以 10\
  \ 后面有 6 个零`\n\n`1.23e-6 = 1.23/1000000 (=0.00000123)`\n\n## 十进制、二进制和八进制数\n\n十六进制数在\
  \ JavaScript 中主要用于处理颜色、编码字符以及某些其他事情。因此，通常有一种更简单的方法来处理它们：`0x` 后跟数字。\n\n例如：\n\n```javascript\n\
  alert( 0xff );/255\n\nalert( 0xFF );/255（相同的，大小写没有影响）\n```\n\n二进制和八进制结构有时也会使用，但同样使用\
  \ `0b` 和 `0o` 前缀来维护：\n\n```javascript\nlet a = 0b11111111;/相当于 255\n\nlet b = 0o377;/八进制的\
  \ 255\n\nalert( a == b );/确实，两边的数字都是 255\n```\n\n只有 3 种数字系统有这种支持。对于其他进制系统，我们必须使用\
  \ `parseInt` 方法（我们将在本节稍后看到）。\n\n### toString(base)\n\n方法 `num.toString(base)` 返回\
  \ `num` 在指定进制下的字符串表示。\n\n例如：\n\n```javascript\nlet num = 255;\n```\n\n\n\n循环提供了一种快速且基础的方式来处理重复执行的任务。JavaScript\
  \ 指南的这一部分介绍了 JavaScript 提供的各种循环解释。你可以将循环看作是游戏的机器人版本，在游戏中，你鼓励某人以一种方式走 X 步，然后以另一种方式走\
  \ Y 步。例如，“向东走五阶段”这个想法可以这样以循环的形式传递：\n\n```javascript\nfor (let step = 0; adventure\
  \ < 5; step++) {\n  // 在不同的场合运行，并对阶段 0 到 4 进行评估。\n  console.log('向东走一个阶段');\n}\n\
  ```\n\n循环有不同类型，但它们在本质上都在做完全相同的事情：它们对某个动作执行若干次。（注意，这个数字可能是 0！）\n\n不同的循环框架提供了不同的方式来处理循环起点和终点的选择。有各种条件，某种类型的循环比其他循环类型更容易处理。\n\
  \nJavaScript 中提供的循环声明有：\n\n- `for` 声明\n- `do...while` 解释\n- `while` 解释\n- 命名声明\n\
  - `break` 解释\n- `continue` 解释\n- `for...in` 解释\n- `for...of` 解释\n- `for` 声明\n\n\
  ## for 声明\n\n`for` 循环重复执行直到预定义的条件评估为假。JavaScript 的 `for` 循环类似于 Java 和 C 的 `for`\
  \ 循环。\n\n一个 `for` 声明如下：\n\n`for ([初始化表达式]; [条件表达式]; [增量表达式])`\n\n当 `for` 循环开始执行时，会发生以下操作：\n\
  \n1. 执行初始化表达式 `initialExpression`，它可以是任何内容。这个表述通常初始化一个循环计数器，无论如何强调允许任何复杂程度的断言。这个表述也可以表达组件。\n\
  2. 如果 `conditionExpression` 的评估结果为真，则执行循环体语句。如果条件评估为假，则 `for` 循环结束。（如果条件语句被完全跳过，则条件被认为是真的。）\n\
  3. 执行语句体。要执行多个语句，请使用大括号（`{ ... }`）将这些语句组合在一起。\n4. 在当前的情况下，执行更新表达式 `incrementExpression`。\n\
  5. 控制返回第 2 步。\n\n## 示例\n\n在下方的模型中，限制包含一个 `for` 声明，用于计算调查列表中被选中选项的数量（一个允许各种判断的 `<select>`\
  \ 部分）。`for` 声明报告了变量 `i` 并将其初始化为 `0`。它确保 `i` 不大于 `<select>` 部分中的选项数量，执行随后的 `if` 语句，并在每次循环后将\
  \ `i` 增。\n\n```html\n<form name=\"selectForm\">\n  <p>\n    <label for=\"musicTypes\"\
  >选择某些音乐类型，然后点击下面的按钮：</label>\n    <select id=\"musicTypes\" name=\"musicTypes\"\
  \ multiple=\"multiple\">\n      <option selected=\"selected\">R&B</option>\n   \
  \   <option>Jazz</option>\n      <option>Blues</option>\n      <option>New Age</option>\n\
  \      <option>Classical</option>\n      <option>Opera</option>\n    </select>\n\
  \  </p>\n  <p><input id=\"btn\" type=\"button\" value=\"选中了几个?\"/></p>\n</form>\n\
  ```\n\n```javascript\nfunction howMany(selectObject) {\n  let numberSelected = 0;\n\
  \  for (let i = 0; i < selectObject.options.length; i++) {\n    if (selectObject.options[i].selected)\
  \ {\n      numberSelected++;\n    }\n  }\n  return numberSelected;\n}\n\nlet btn\
  \ = document.getElementById('btn');\nbtn.addEventListener('click', function() {\n\
  \  alert('选中的选项数量：' + howMany(document.selectForm.musicTypes));\n});\n```\n\n##\
  \ do...while 解释\n\n`do...while` 解释重复执行直到预定的条件评估为假。\n\n一个 `do...while` 解释如下：\n\n\
  ```javascript\ndo {\n  // 语句\n} while (condition);\n```\n\n在检查条件之前会重复执行语句体。（要执行多个声明，请使用大括号（`{\
  \ ... }`）将这些语句封装。）\n\n如果条件为真，声明将再次执行。在每次执行完成时，都会检查条件。当条件为假时，执行停止，控制传递到 `do...while`\
  \ 之后的语句。\n\n## 示例\n\n在上面的模型中，`do` 循环至少执行一次，并一直持续直到 `i` 不小于 5。\n\n```javascript\n\
  let i = 0;\ndo {\n  i += 1;\n  console.log(i);\n} while (i < 5);\n```\n\n## while\
  \ 解释\n\n某些语句执行其声明，直到预定的条件评估为真。某些声明如下：\n\n```javascript\nwhile (condition) {\n  //\
  \ 语句\n}\n```\n\n如果条件最终结果为假，循环内部的声明停止执行，控制传递到循环之后的语句。\n\n条件测试在执行关联的语句体之前发生。如果条件返回真，则执行声明并再次尝试条件。如果条件返回假，执行停止，控制传递到\
  \ `while` 之后的语句。\n\n要执行多个声明，请使用大括号语句（`{ ... }`）。\n\n## 示例\n\n`while` 循环在 `n` 小于\
  \ 3 时执行语句：\n\n```javascript\nlet n = 0;\nlet x = 0;\nwhile (n < 3) {\n  n++;\n \
  \ x += n;\n}\n```\n\n## 命名声明\n\n命名给一个语句一个标识符，以便在程序的其他地方引用它。例如，你可以使用命名来感知循环，并随后使用\
  \ `break` 或 `continue` 解释来显示程序应该中断循环还是继续。\n\n标记声明的语言结构如下：\n\n```javascript\nmark:\n\
  \  // 语句\n```\n\n标记的评估可以是任何不是保留字的 JavaScript 标识符。与之关联的声明可以是任何语句。\n\n## 示例\n\n在上面的模型中，命名\
  \ `markLoop` 感知循环。\n\n```javascript\nmarkLoop:\nwhile (theMark === true) {\n  doSomething();\n\
  }\n```\n\n\n\n\n既然我们已经理解了 DOM 树，就可以开始获取我们的第一个 HTML 组件了。利用 JavaScript DOM 有多种方法可以实现这一点，以下是最常用的方法：\n\
  \n## 通过 ID 获取组件\n\n`getElementById()` 方法用于通过其 id 获取单个组件。让我们来看一个模型：\n\n```javascript\n\
  var title = document.getElementById('header-title');\n```\n\n在这里，我们获取 id 为 `header-title`\
  \ 的组件并将其保存到变量中。\n\n### 通过类名获取组件\n\n我们同样可以利用 `getElementsByClassName()` 技术获取多个元素，该方法返回一组组件。\n\
  \n```javascript\nvar things = document.getElementsByClassName('list-things');\n\
  ```\n\n在这里，我们获取所有类名为 `list-things` 的元素并保存到变量中。\n\n### 通过标签名获取组件\n\n我们同样可以利用 `getElementsByTagName()`\
  \ 方法通过标签名获取组件。\n\n```javascript\nvar listItems = document.getElementsByTagName('li');\n\
  ```\n\n在这里，我们获取 HTML 文档中所有的 `li` 组件并将其保存到变量中。\n\n### Queryselector\n\n`querySelector()`\
  \ 方法返回与预定义 CSS 选择器匹配的第一个组件。这意味着你可以通过 id、类、标签以及任何其他重要的 CSS 选择器获取组件。这里我简单列出几个最常用的选项。\n\
  \n**通过 id 获取：**\n\n```javascript\nvar header = document.querySelector('#header')\n\
  ```\n\n**通过类获取：**\n\n```javascript\nvar things = document.querySelector('.list-things')\n\
  ```\n\n**通过标签获取：**\n\n```javascript\nvar headings = document.querySelector('h1');\n\
  ```\n\n**获取更显式的组件：**\n\n我们同样可以 CSS 选择器获取更显式的组件。\n\n```javascript\ndocument.querySelector(\"\
  h1.heading\");\n```\n\n在这个模型中，我们同时查找标签和类，并返回通过该 CSS 选择器的主组件。\n\n### Queryselectorall\n\
  \n`querySelectorAll()` 方法与 `querySelector()` 完全不同，它实际上返回所有符合 CSS 选择器的组件。\n\n```javascript\n\
  var heading = document.querySelectorAll('h1.heading');\n```\n\n在这个模型中，我们获取所有带有 `heading`\
  \ 类的 `h1` 标签并将它们存储在一个集合中。\n\n## 修改 HTML 元素\n\nHTML DOM 允许我们通过更改其属性来改变 HTML 组件的内容和样式。\n\
  \n### 修改 HTML\n\n`innerHTML` 属性可用于更改 HTML 组件的内容。\n\n```javascript\ndocument.getElementById(\"\
  #header\").innerHTML = \"Hi World!\";\n```\n\n在这个模型中，我们获取 id 为 `header` 的组件并将内部内容设置为\
  \ \"Hi World!\"。\n\n`innerHTML` 同样可以将标签放入另一个标签中。\n\n```javascript\ndocument.getElementsByTagName(\"\
  div\").innerHTML = \"<h1>Hello World!</h1>\"\n```\n\n在这里，我们将一个 `h1` 标签放入所有现有的 `div`\
  \ 中。\n\n### 修改属性值\n\n你同样可以通过 DOM 修改属性的值。\n\n```javascript\ndocument.getElementsByTag(\"\
  img\").src = \"test.jpg\";\n```\n\n在这个模型中，我们把所有 `img` 标签的 `src` 修改为 `test.jpg`。\n\
  \n### 修改样式\n\n要更改 HTML 组件的样式，我们需要更改组件的 `style` 属性。这里有一个修改样式的语言结构：\n\n```javascript\n\
  document.getElementById(id).style.property = new style\n```\n\n现在让我们来看一个模型，我们获取一个组件并将基线改为加粗的深色线：\n\
  \n```javascript\ndocument.getElementsByTag(\"h1\").style.borderBottom = \"strong\
  \ 3px #000\";\n```\n\nCSS 属性应该使用驼峰法，而不是普通的 CSS 属性名。在这个模型中，我们使用了 `borderBottom` 而不是\
  \ `line base`。\n\n## 添加和删除组件\n\n现在我们将研究如何添加新组件和删除现有组件。\n\n### 添加组件\n\n```javascript\n\
  var div = document.createElement('div');\n```\n\n在这里我们利用 `createElement()` 技术创建一个\
  \ `div` 组件，该方法接受标签名作为参数并将其保存到变量中。之后我们只需要给它一些内容，然后将其嵌入我们的 DOM 文档中。\n\n```javascript\n\
  var newContent = document.createTextNode(\"Hello World!\");\n\ndiv.appendChild(newContent);\n\
  \ndocument.body.insertBefore(div, currentDiv);\n```\n\n在这里我们利用 `createTextNode()`\
  \ 技术创建内容，该方法接受 `String` 作为参数，然后我们将新的 `div` 组件插入到记录中现有的 `div` 之前。\n\n### 删除组件\n\n\
  ```javascript\nvar elem = document.querySelector('#header'); elem.parentNode.removeChild(elem);\n\
  ```\n\n在这里我们获取一个组件并利用 `removeChild()` 方法将其删除。\n\n### 替换组件\n\n现在我们应该研究如何替换元素。\n\n\
  ```javascript\nvar div = document.querySelector('#div');\n\nvar newDiv = document.createElement('div');\n\
  \nnewDiv.innerHTML = \"Hi World2\"\n\ndiv.parentNode.replaceChild(newDiv, div);\n\
  ```\n\n在这里我们利用 `replaceChild()` 方法替换一个组件。主要参数是新组件，后续参数是我们需要替换的组件。\n\n### 直接写入 HTML\
  \ 输出流\n\n我们同样可以利用 `write()` 方法将 HTML 语句和 JavaScript 语句直接写入 HTML 输出流。\n\n```javascript\n\
  document.write(\"<h1>Hello World!</h1><p>This is a paragraph!</p>\");\n```\n\n我们同样传递像日期对象的\
  \ JavaScript 语句。\n\n```javascript\ndocument.write(Date());\n```\n\n`write()` 方法还可以接受多个内容，这些内容将按照它们的事件顺序添加到文档中。\n\
  \nJavaScript 函数是一段旨在执行特定任务的代码块。\n\n当“某事”触发它（调用它）时，JavaScript 函数就会执行。\n\n### 模型\n\
  \n```javascript\nfunction myFunction(p1, p2) {\n  return p1 * p2;\n} // 函数返回 p1\
  \ 和 p2 的结果\n```\n\n### JavaScript 函数语法\n\nJavaScript 函数以关键字 `function` 为特征，后面跟着一个名称，然后是括号\
  \ `()`。\n\n函数名称可以包含字母、数字、下划线和美元符号（与变量相同的规则）。\n\n括号可以包含由逗号分隔的参数名称：`(parameter1, parameter2,\
  \ ...)`\n\n函数要执行的代码放在大括号 `{}` 中：\n\n```javascript\nfunction name(parameter1, parameter2,\
  \ parameter3) {\n  // 要执行的代码\n}\n```\n\n函数参数记录在函数定义的括号 `()` 内。\n\n函数参数是函数被调用时获取的属性。\n\
  \n在函数内部，参数（边界）作为局部变量使用。\n\n函数类似于其他编程语言中的过程（Procedure）或子程序（Subroutine）。\n\n### 函数调用\n\
  \n当“某事”触发（调用）函数时，函数内部的代码将执行：\n\n- 在事件发生时（例如当用户点击按钮时）\n- 从 JavaScript 代码中被调用时\n\n\
  因此（自调用）\n\n你将在本教程的后续练习中熟悉更多关于函数调用的知识。\n\n### 函数返回\n\n当 JavaScript 遇到 `return` 语句时，函数将停止执行。\n\
  \n如果函数是从断言（assertion）中调用的，JavaScript 将“返回”并执行调用语句之后的代码。\n\n函数通常会带回一个返回值。返回值会被“返回”给“调用者”：\n\
  \n### 模型\n\n计算两个数字的结果并返回结果：\n\n```javascript\nvar x = myFunction(4, 3); // 函数被调用，返回值将存储在\
  \ x 中\n\nfunction myFunction(a, b) {\n  return a * b; // 函数返回 a 和 b 的结果\n}\n```\n\
  \n`x` 中的结果将是：\n\n12\n\n### 为什么使用函数？\n\n你可以复用代码：定义一次代码并多次使用。\n\n你可以使用不同的参数多次使用相同的代码，以交付不同的结果。\n\
  \n### 模型\n\n将华氏度转换为摄氏度：\n\n```javascript\nfunction toCelsius(fahrenheit) {\n  return\
  \ (5/9) * (fahrenheit-32);\n}\n\ndocument.getElementById(\"demo\").innerHTML = toCelsius(77);\n\
  ```\n\n### `()` 运算符调用函数\n\n利用上面的模型，`toCelsius` 指的是函数对象，而 `toCelsius()` 指的是函数的结果。\n\
  \n\n\n\n\n不带 `()` 的函数调用将返回函数对象而不是函数结果。\n\n### 模型\n```javascript\nwork toCelsius(fahrenheit)\
  \ {\n  return (5/9) * (fahrenheit-32);\n}\n\ndocument.getElementById(\"demo\").innerHTML\
  \ = toCelsius;\n```\n\n### 作为变量值的函数\n函数可以像你在使用因子（factors）一样，在广泛的配方、任务和估算中使用。\n\n\
  ### 模型\n与其使用变量来存储函数返回的估算值：\n```javascript\nvar x = toCelsius(77);\nvar text = \"\
  The temperature is \" + x + \" Celsius; \"\n```\n你可以直接将函数作为变量值使用：\n```javascript\n\
  var text = \"The temperature is \" + toCelsius(77) + \" Celsius\";\n```\n在随后的教学练习中，你将获得更多关于函数的深入知识。\n\
  \n### 局部变量\n在 JavaScript 函数内部声明的因子对于该函数是**局部（LOCAL）**的。\n邻近因子必须从函数内部获取。\n\n### 模型\n\
  `/code here` 无法利用\n\n# 第十二章\n\n# JavaScript 事件\n事件是发生在你自定义框架中的活动或场合，框架为你定义了这些事件，以便你在需要时以某种方式对其做出反应。例如，如果客户端选择了网页上的某个点击点，你应该通过显示数据框来响应该活动。在篇文章中，我们将探讨一些涉及事件的重要概念，并观察它们在程序中如何工作。这并不是一次详尽的调查；而是你现阶段需要了解的内容。\n\
  \n## 事件序列\n如上所述，事件是发生在你正在修改的框架中的活动或事件——当事件发生时，框架会发出（或“触发”）一个信号或类似形式的内容，并提供一个系统，在事件发生时可以采取相应的动作（即运行某些代码）。例如，在机场，当跑道准备就绪时，会向飞行员传递一个信号。这样，飞机就可以安全起飞。\n\
  \n由于 Web 的存在，事件发生在程序窗口内部，并且通常连接到其中的某个特定元素——这可能是单个组件、一组组件、堆叠在当前标签页中的 HTML 文档，或者整个程序窗口。可以发生各种类型的事件，例如：\n\
  - 客户端选择了特定组件或将鼠标悬停在特定组件上。\n- 客户端在控制台上按了某个键。\n- 客户端调整程序窗口大小或关闭窗口。\n- 页面完成堆叠过程。\n\
  - 提交了一个表单。\n- 视频播放、停止或结束。\n- 发生了错误。\n\n你可以从这些（以及通过查看 MDN 事件引用）中总结出，有许多可以响应的事件。\n\
  \n每个可用的事件都有一个事件监听器（event controller），它是一段代码（通常是你作为软件工程师编写的 JavaScript 函数），在事件触发时运行。当这样一段代码被指定为根据某个事件运行时，我们称其为正在注册一个事件监听器。注意：事件监听器有时被称为事件听众（event\
  \ audience members）——对于我们的目的来说，它们实际上是可以交换的，尽管严格来说，它们是协作关系。听众监听事件发生，而监听器是在事件发生时运行的代码。\n\
  \n注意：Web 事件不是 JavaScript 核心语言的一部分——它们被描述为程序中包含的 API 特性。\n\n## 示例\n我们应该来看一个我们所指内容的简单示例。你已经在很多模型中见过事件和事件监听器的用法，但我们应该回顾一下以巩固理解。在下面的模型中，我们有一个唯一的\
  \ `<button>`，当它被按下时，背景色将变为任意颜色：\n\n```html\n<button>Change color</button>\n```\n\
  \nJavaScript 如下：\n```javascript\nconst btn = document.querySelector('button');\n\
  \nwork random(number) {\n  return Math.floor(Math.random() * (number+1));\n}\n\n\
  btn.onclick = work() {\n  const rndCol = 'rgb(' + random(255) + ',' + random(255)\
  \ + ',' + random(255) + ')';\n  document.body.style.backgroundColor = rndCol;\n\
  }\n```\n\n在这段代码中，我们利用 `Document.querySelector()` 函数在一个名为 `btn` 的常量中存储了点击事件的引用。我们还定义了一个接收随机数字的函数。代码的第三部分是事件监听器。`btn`\
  \ 常量指向 `<button>` 组件，这种元素有许多可以触发它的事件，相应地，也有可用的事件监听器。我们通过将 `onclick` 事件监听器属性设置为包含代码的匿名函数（该代码创建一个随机的\
  \ RGB 颜色并将 `<body>` 背景颜色等设置为该颜色），来监听点击事件的发生。\n\n这段代码会在 `<button>` 组件上触发点击事件的任何时候运行，即在客户端选择它的任何时候。\n\
  \n示例输出如下：\n\n## 它不仅仅是网页\n现在另一个值得引用的点是，事件并不是 JavaScript 特有的——大多数编程语言都具有某种事件模型，但模型的工作方式通常与\
  \ JavaScript 的方式不同。事实上，JavaScript 用于网页的事件模型与它在不同环境下的使用的 JavaScript 事件模型有所不同。\n\n\
  例如，`Node.js` 是一个极其流行的 JavaScript 运行时，它允许设计师使用 JavaScript 构建服务器端和工作端应用程序。`Node.js`\
  \ 事件模型依赖听众来监听事件以及生产者周期性地发布事件——这听起来并不特别，但代码非常独特，使用了诸如 `on()` 的函数来注册事件听众，并使用 `once()`\
  \ 注册一个运行一次后注销的事件听众。`HTTP` 接口事件文档提供了真实的模型。\n\n你同样可以使用 JavaScript 构建跨程序附加项——程序扩展——这使用了一种名为\
  \ `WebExtensions` 的技术。事件模型与 Web 事件模型相似，但又有些不同——事件听众属性使用驼峰命名法（例如，是 `onMessage` 而不是\
  \ `onmessage`），并且应该与 `addListener` 函数结合使用。\n\n在学习的现阶段，你不需要理解其他此类环境的任何内容；我们只需要说明事件可以在不同的编程环境中变化。\n\
  \n## 使用 Web 事件的方法\n有多种方法向网页添加事件监听器代码，以便其在相关事件触发时运行。在本节中，我们将介绍不同的工具，并讨论你应该使用哪种。\n\
  \n### 事件监听器属性\n这些是我们在课程期间经常看到的、用于包含事件监听器代码的属性。回到上面的模型：\n```javascript\nconst btn\
  \ = document.querySelector('button');\n\nbtn.onclick = work() {\n  const rndCol\
  \ = 'rgb(' + random(255) + ',' + random(255) + ',' + random(255) + ')';\n  document.body.style.backgroundColor\
  \ = rndCol;\n}\n```\n`onclick` 属性是当前情况下使用的事件监听器属性。它基本上是按钮上的其他可用属性之一（例如 `btn.textContent`\
  \ 或 `btn.style`），但它是一种特殊的类型——当你将其设置为某些代码时，这些代码会在事件发生在按钮上运行时。\n\n你也可以将属性属性设置为一个命名函数的名称（正如我们在“构建你自己的函数”中发现的那样）。以下代码在任何情况下有效：\n\
  ```javascript\nconst btn = document.querySelector('button');\n\nwork bgChange()\
  \ {\n  const rndCol = 'rgb(' + random(255) + ',' + random(255) + ',' + random(255)\
  \ + ')';\n  document.body.style.backgroundColor = rndCol;\n}\n\nbtn.onclick = bgChange;\n\
  ```\n\n\n\n\n有很多可用的事件监听器属性。让我们来分析一下。\n\n首先，为 `irregular tone eventhandlerproperty.html`\
  \ 创建一个附近的副本，并在程序中打开它。它只是我们目前为止所玩过的简单任意着色模型的副本。现在，尝试将 `btn.onclick` 平滑地更改为随附的各种属性，并观察模型中的结果：\n\
  \n- `btn.onfocus` 和 `btn.onblur` — 当捕获焦点和失去焦点时，着色会发生变化；尝试按 Tab 键在元素之间切换焦点，然后再次按\
  \ Tab 键移开焦点。这些通常用于在结构字段被激活时显示填充字段的信息，或者在结构字段加载了错误值时显示错误消息。\n- `btn.ondblclick` —\
  \ 当双击捕获目标时，着色会发生变化。\n- `window.onkeypress`, `window.onkeydown`, `window.onkeyup`\
  \ — 当控制台上按下按键时，着色会发生变化。`keypress` 事件指的是整个按下过程（按下后松开），而 `keydown` 和 `keyup` 分别指的是按键的按下和松开部分。注意：如果你尝试在实际捕获目标上注册此事件控制器将不起作用——我们需要将其注册在\
  \ `window` 对象上，它代表整个程序窗口。\n- `btn.onmouseover` 和 `btn.onmouseout` — 当鼠标指针悬停在捕获目标上或移出目标时，着色分别发生变化。\n\
  \n某些事件是通用的，几乎可以在任何地方使用（例如 `onclick` 控制器可以到几乎任何组件上），尽管某些事件更具体且仅在特定情况下有用（例如，仅在特定的组件上使用\
  \ `onplay` 是很好的）。\n\n# 第十三章\n\n### JavaScript Cookies\n\nCookie 是一种在服务器和客户端之间持久化的数据。网络浏览器在浏览时存储这些数据。\n\
  \n Cookie 包含通常以分号隔离的键值对形式的字符串数据。它保持客户端的状态并在所有网站页面之间记录客户端的数据。\n\n## Cookie 是如何工作的？\n\
  \n当客户端向服务器发送请求时，该请求的每一个部分都被视为由不同客户端发送的另一个请求。这样，为了识别客户端，我们需要在客户端服务器程序的响应中添加 Cookie。\n\
  \n现在，每当客户端向服务器发送请求时，Cookie 会随请求一起添加。有了 Cookie，服务器就能识别客户端。\n\n### JavaScript Cookies\n\
  \n## 如何在 JavaScript 中创建 Cookie？\n\n在 JavaScript 中，我们可以利用 `document.cookie` 属性创建、读取、刷新和删除\
  \ Cookie。\n\n使用以下语句来创建 Cookie：\n\n```javascript\ndocument.cookie=\"name=value\"\
  ;\n```\n\n### JavaScript Cookie 示例\n\n### 示例 1\n\n我们应该看一个设置和获取 Cookie 的指南。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n</head>\n<body>\n<input type=\"button\" value=\"\
  setCookie\" onclick=\"setCookie()\">\n<input type=\"button\" value=\"getCookie\"\
  \ onclick=\"getCookie()\">\n<script>\nfunction setCookie()\n{\ndocument.cookie=\"\
  username=Duke Martin\";\n}\nfunction getCookie()\n{\nif(document.cookie.length!=0)\n\
  {\nalert(document.cookie);\n}\nelse\n{\nalert(\"Cookie not accessible\");\n}\n}\n\
  </script>\n</body>\n</html>\n```\n\n### 示例 2\n\n在这里，我们独立地显示 Cookie 的键值对。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n</head>\n<body>\n<input type=\"button\" value=\"\
  setCookie\" onclick=\"setCookie()\">\n<input type=\"button\" value=\"getCookie\"\
  \ onclick=\"getCookie()\">\n<script>\nfunction setCookie()\n{\ndocument.cookie=\"\
  username=Duke Martin\";\n}\nfunction getCookie()\n{\nif(document.cookie.length!=0)\n\
  {\nvar array=document.cookie.split(\"=\");\nalert(\"Name=\"+array[0]+\" +\"Value=\"\
  +array[1]);\n}\nelse\n{\nalert(\"Cookie not accessible\");\n}\n}\n</script>\n</body>\n\
  </html>\n```\n\n### 示例 3\n\n在这个示例中，我们提供了着色决策并将选定的着色值传递给 Cookie。现在，Cookie 在程序中存储客户端的最后决定。以此类，当刷新网站页面时，客户端的最后决定将出现在屏幕上。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n</head>\n<body>\n<select id=\"color\"\
  \ onchange=\"display()\">\n<option value=\"Select Color\">选择颜色</option>\n<option\
  \ value=\"yellow\">黄色</option>\n<option value=\"green\">绿色</option>\n<option value=\"\
  red\">红色</option>\n</select>\n<script type=\"text/javascript\">\nfunction display()\n\
  {\nvar esteem = document.getElementById(\"color\").value;\nif (esteem != \"Select\
  \ Color\")\n{\ndocument.bgColor = esteem;\ndocument.cookie = \"color=\" + esteem;\n\
  }\n}\nwindow.onload = function ()\n{\nif (document.cookie.length != 0)\n{\nvar array\
  \ = document.cookie.split(\"=\");\ndocument.getElementById(\"color\").value = array[1];\n\
  document.bgColor = array[1];\n}\n}\n</script>\n</body>\n</html>\n```\n\n# 总结\n\n\
  JavaScript 是网络上的一项极佳的创新。它并不难学，而且非常灵活。它与其他网络创新技术（如 HTML 和 CSS）配合得很好，甚至可以与 Flash 等模块协作。\n"
