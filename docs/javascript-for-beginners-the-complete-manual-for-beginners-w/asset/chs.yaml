  \ | 该策略用于防止项的任何扩展。 |\n| 18 | `Object.seal()` | 该策略防止添加新属性，并将所有当前属性标记为不可配置的。 |\n\
  | 19 | `Object.setPrototypeOf()` | 该技术将预定义项的原型设置为另一个项。 |\n| 20 | `Object.values()`\
  \ | 该技术返回值的数组。 |\n\n# 第八章\n\n# JavaScript 字符串\n\nJavaScript 字符串是处理字符序列的项。\n\n在 JavaScript\
  \ 中创建字符串有两种不同的方式：\n1. 通过字符串字面量\n2. 通过字符串对象（使用 new 关键字）\n\n## 1) 通过字符串字面量\n\n字符串字面量由语句组成。使用字符串字面量创建字符串的语言结构如下：\n\
  \n```javascript\nvar stringname=\"string esteem\";\n```\n\n让我们来看创建字符串字面量的简单示例。\n\
