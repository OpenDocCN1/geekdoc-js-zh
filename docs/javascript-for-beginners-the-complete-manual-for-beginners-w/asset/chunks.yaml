    JavaScript 是一种独特的 PC 编程语言。它轻量级，最常被用作网页的一部分，其执行允许客户端内容与服务器通信并创建动态页面。它是一种具有面向对象能力的解释型编程语言。


    JavaScript 最初被设计用于“让网页活起来”。


    这种语言中的项目被称为脚本（contents）。它们可以直接编写在网页的 HTML 中，并在页面加载时自然地运行。


    脚本以纯内容的形式提供并执行。它们的运行不需要额外的复杂的规划或编译。在这一方面，JavaScript 与另一种名为 `Java` 的语言完全不同。


    JavaScript 最初被称为 `LiveScript`，但网景（Netscape）将其更名为 `JavaScript`，这可能是由于当时 `Java`
    引起的热度考量。JavaScript 在 1995 年以 `LiveScript` 的名称出现在 Netscape 2.0 中。该语言的通用核心已被植入 `Netscape`、`Internet
    Explorer` 以及其他网络浏览器中。


    ## JavaScript 有什么用途？


    我们在介绍中已经略微提到了这一点，但这里是 JavaScript 主要用途的快速概述。增加网站的直观性——是的，如果你需要网站不仅仅是一个静态文本页面，你就需要编写一些
    `JavaScript`。创建多功能应用——JavaScript 不仅用于网站……它还用于制作你手机和平板电脑上的应用程序。制作基于网络浏览器的游戏——你曾直接从浏览器中玩过游戏吗？JavaScript
    很可能帮助了这些游戏的运行。后端 Web 开发——毫无疑问，JavaScript 主要用于前端，但它是一种足够灵活的脚本语言，也可以用于后端架构。


    ## 什么让 JavaScript 变得很有趣？


    JavaScript 是一种灵活且强大的编程语言，被不同的网络浏览器可靠地执行。与 `HTML` 和 `CSS` 一起，它是 Web 科技的核心部分。虽然
    `HTML` 负责设计，`CSS` 负责样式，但 JavaScript 为程序中的页面提供了智能。


    JavaScript 在使用框架时非常有价值。它有能够验证客户端输入错误的能力，并进一步节省时间。如果用户未填写某个必填字段，或者数据错误，JavaScript
    会将信息发送到服务器之前对其进行检查。同样，由于 JavaScript 是一种客户端技术，它可以在程序上执行基本的计算。程序不需要为每项任务都请求服务器时间。这在用户需要多次执行这些估算时特别有用。在这种情况下，与服务器交互花费的时间比执行实际计算要多得多。


    JavaScript 为程序提供了更多的控制权，而不是完全依赖 Web 服务器。JavaScript 为不同的程序提供了额外功能，有助于减轻服务器负担和组织流量。由于程序解析
    JavaScript，它处理了编译和兼容性问题。因此，它可以在 `Windows`、`Macintosh` 以及其他由网景支持的系统上运行。同样，也可以将其嵌入到其他内容（如
    `HTML`）中以保持 JavaScript 的使用。


    通常在其他编程语言中，数字和对象类型是有区别的，但 JavaScript 对数字只识别一种对象类型，因此我在 Mozilla 文档中发现过：“JavaScript
    中没有所谓的整数这种类型”。此外，JavaScript 中有一个“undefined”（未定义）值，这是一种模糊类型的估计，表示未初始化的值。通常在其他语言中，未初始化的值等于“invalid”或“nil”。但
    JavaScript 不是。

