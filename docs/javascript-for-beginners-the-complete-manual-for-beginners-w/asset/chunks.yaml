    \ | 该技术返回值的数组。 |\n\n# 第八章\n\n# JavaScript 字符串\n\nJavaScript 字符串是处理字符序列的项。\n\n\
    在 JavaScript 中创建字符串有两种不同的方式：\n1. 通过字符串字面量\n2. 通过字符串对象（使用 new 关键字）\n\n### 1) 通过字符串字面量\n\
