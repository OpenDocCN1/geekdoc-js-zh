  trans: "\n\n不带 `()` 的函数调用将返回函数对象而不是函数结果。\n\n### 模型\n```javascript\nwork toCelsius(fahrenheit)\
    \ {\n  return (5/9) * (fahrenheit-32);\n}\n\ndocument.getElementById(\"demo\"\
    ).innerHTML = toCelsius;\n```\n\n### 作为变量值的函数\n函数可以像你在使用因子（factors）一样，在广泛的配方、任务和估算中使用。\n\
    \n#### 模型\n与其使用变量来存储函数返回的估算值：\n```javascript\nvar x = toCelsius(77);\nvar text\
    \ = \"The temperature is \" + x + \" Celsius; \"\n```\n你可以直接将函数作为变量值使用：\n```javascript\n\
    var text = \"The temperature is \" + toCelsius(77) + \" Celsius\";\n```\n在随后的教学练习中，你将获得更多关于函数的深入知识。\n\
    \n### 局部变量\n在 JavaScript 函数内部声明的因子对于该函数是**局部（LOCAL）**的。\n邻近因子必须从函数内部获取。\n\n####\
    \ 模型\n`/code here` 无法利用\n\n# 第十二章\n\n# JavaScript 事件\n事件是发生在你自定义框架中的活动或场合，框架为你定义了这些事件，以便你在需要时以某种方式对其做出反应。例如，如果客户端选择了网页上的某个点击点，你应该通过显示数据框来响应该活动。在篇文章中，我们将探讨一些涉及事件的重要概念，并观察它们在程序中如何工作。这并不是一次详尽的调查；而是你现阶段需要了解的内容。\n\
    \n### 事件序列\n如上所述，事件是发生在你正在修改的框架中的活动或事件——当事件发生时，框架会发出（或“触发”）一个信号或类似形式的内容，并提供一个系统，在事件发生时可以采取相应的动作（即运行某些代码）。例如，在机场，当跑道准备就绪时，会向飞行员传递一个信号。这样，飞机就可以安全起飞。\n\
    \n由于 Web 的存在，事件发生在程序窗口内部，并且通常连接到其中的某个特定元素——这可能是单个组件、一组组件、堆叠在当前标签页中的 HTML 文档，或者整个程序窗口。可以发生各种类型的事件，例如：\n\
    - 客户端选择了特定组件或将鼠标悬停在特定组件上。\n- 客户端在控制台上按了某个键。\n- 客户端调整程序窗口大小或关闭窗口。\n- 页面完成堆叠过程。\n\
    - 提交了一个表单。\n- 视频播放、停止或结束。\n- 发生了错误。\n\n你可以从这些（以及通过查看 MDN 事件引用）中总结出，有许多可以响应的事件。\n\
    \n每个可用的事件都有一个事件监听器（event controller），它是一段代码（通常是你作为软件工程师编写的 JavaScript 函数），在事件触发时运行。当这样一段代码被指定为根据某个事件运行时，我们称其为正在注册一个事件监听器。注意：事件监听器有时被称为事件听众（event\
    \ audience members）——对于我们的目的来说，它们实际上是可以交换的，尽管严格来说，它们是协作关系。听众监听事件发生，而监听器是在事件发生时运行的代码。\n\
    \n注意：Web 事件不是 JavaScript 核心语言的一部分——它们被描述为程序中包含的 API 特性。\n\n### 示例\n我们应该来看一个我们所指内容的简单示例。你已经在很多模型中见过事件和事件监听器的用法，但我们应该回顾一下以巩固理解。在下面的模型中，我们有一个唯一的\
    \ `<button>`，当它被按下时，背景色将变为任意颜色：\n\n```html\n<button>Change color</button>\n```\n\
    \nJavaScript 如下：\n```javascript\nconst btn = document.querySelector('button');\n\
    \nwork random(number) {\n  return Math.floor(Math.random() * (number+1));\n}\n\
    \nbtn.onclick = work() {\n  const rndCol = 'rgb(' + random(255) + ',' + random(255)\
    \ + ',' + random(255) + ')';\n  document.body.style.backgroundColor = rndCol;\n\
    }\n```\n\n在这段代码中，我们利用 `Document.querySelector()` 函数在一个名为 `btn` 的常量中存储了点击事件的引用。我们还定义了一个接收随机数字的函数。代码的第三部分是事件监听器。`btn`\
    \ 常量指向 `<button>` 组件，这种元素有许多可以触发它的事件，相应地，也有可用的事件监听器。我们通过将 `onclick` 事件监听器属性设置为包含代码的匿名函数（该代码创建一个随机的\
    \ RGB 颜色并将 `<body>` 背景颜色等设置为该颜色），来监听点击事件的发生。\n\n这段代码会在 `<button>` 组件上触发点击事件的任何时候运行，即在客户端选择它的任何时候。\n\
    \n示例输出如下：\n\n### 它不仅仅是网页\n现在另一个值得引用的点是，事件并不是 JavaScript 特有的——大多数编程语言都具有某种事件模型，但模型的工作方式通常与\
    \ JavaScript 的方式不同。事实上，JavaScript 用于网页的事件模型与它在不同环境下的使用的 JavaScript 事件模型有所不同。\n\
    \n例如，`Node.js` 是一个极其流行的 JavaScript 运行时，它允许设计师使用 JavaScript 构建服务器端和工作端应用程序。`Node.js`\
    \ 事件模型依赖听众来监听事件以及生产者周期性地发布事件——这听起来并不特别，但代码非常独特，使用了诸如 `on()` 的函数来注册事件听众，并使用 `once()`\
    \ 注册一个运行一次后注销的事件听众。`HTTP` 接口事件文档提供了真实的模型。\n\n你同样可以使用 JavaScript 构建跨程序附加项——程序扩展——这使用了一种名为\
    \ `WebExtensions` 的技术。事件模型与 Web 事件模型相似，但又有些不同——事件听众属性使用驼峰命名法（例如，是 `onMessage`\
    \ 而不是 `onmessage`），并且应该与 `addListener` 函数结合使用。\n\n在学习的现阶段，你不需要理解其他此类环境的任何内容；我们只需要说明事件可以在不同的编程环境中变化。\n\
    \n## 使用 Web 事件的方法\n有多种方法向网页添加事件监听器代码，以便其在相关事件触发时运行。在本节中，我们将介绍不同的工具，并讨论你应该使用哪种。\n\
    \n### 事件监听器属性\n这些是我们在课程期间经常看到的、用于包含事件监听器代码的属性。回到上面的模型：\n```javascript\nconst btn\
    \ = document.querySelector('button');\n\nbtn.onclick = work() {\n  const rndCol\
    \ = 'rgb(' + random(255) + ',' + random(255) + ',' + random(255) + ')';\n  document.body.style.backgroundColor\
    \ = rndCol;\n}\n```\n`onclick` 属性是当前情况下使用的事件监听器属性。它基本上是按钮上的其他可用属性之一（例如 `btn.textContent`\
    \ 或 `btn.style`），但它是一种特殊的类型——当你将其设置为某些代码时，这些代码会在事件发生在按钮上运行时。\n\n你也可以将属性属性设置为一个命名函数的名称（正如我们在“构建你自己的函数”中发现的那样）。以下代码在任何情况下有效：\n\
    ```javascript\nconst btn = document.querySelector('button');\n\nwork bgChange()\
    \ {\n  const rndCol = 'rgb(' + random(255) + ',' + random(255) + ',' + random(255)\
    \ + ')';\n  document.body.style.backgroundColor = rndCol;\n}\n\nbtn.onclick =\
    \ bgChange;\n```\n\n"
