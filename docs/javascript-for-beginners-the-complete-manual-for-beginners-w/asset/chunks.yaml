    \  var y=20;//JavaScript 局部变量\n}\n</script>\n```\n\n## JavaScript 全局变量\n\nJavaScript\
    \ 全局变量在函数外部声明，或者通过 `window` 对象声明。它可以从任何函数访问。\n\n让我们看看 JavaScript 中全局变量的简单示例：\n\
    \n```html\n<script>\nvar data=200;//全局变量\nwork a(){\n  document.writeln(data);\n\
    }\nwork b(){\n  document.writeln(data);\n}\na();//调用 JavaScript 函数\nb();\n</script>\n\
    ```\n\n```html\nwork b(){\n  alert(value);\n}\n</script>\n```\n\n## 在函数内部声明 JavaScript\
    \ 全局变量\n\n要在函数内部声明 JavaScript 全局因素，你需要使用 `window` 对象。例如：\n\n`window.value=90;`\n\
    \n现在它可以在任何函数内部被声明，并可以从任何容量访问。例如：\n\n```javascript\nwork m(){\n  window.value=100;//通过\
    \ window 对象声明全局变量\n} \nwork n(){ \n  alert(window.value);//从其他容量访问全局变量 \n}\n```\n\
    \n## JavaScript 全局变量的原理\n\n当你在函数外部声明变量时，它包含在 `window` 对象内部。你也可以通过 `window` 对象访问它。例如：\n\
    \n```javascript\nvar value=50;\nwork a(){\n  alert(window.value);//访问全局变量\n}\n\
    ```\n\n## JavaScript 数据类型\n\nJavaScript 提供了多种信息类型来存储各种类型的属性。JavaScript 中有两种信息类型。\n\
