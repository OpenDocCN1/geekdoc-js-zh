  trans: "\n循环提供了一种快速且基础的方式来处理重复执行的任务。JavaScript 指南的这一部分介绍了 JavaScript 提供的各种循环解释。你可以将循环看作是游戏的机器人版本，在游戏中，你鼓励某人以一种方式走\
    \ X 步，然后以另一种方式走 Y 步。例如，“向东走五阶段”这个想法可以这样以循环的形式传递：\n\n```javascript\nfor (let step\
    \ = 0; adventure < 5; step++) {\n  // 在不同的场合运行，并对阶段 0 到 4 进行评估。\n  console.log('向东走一个阶段');\n\
    }\n```\n\n循环有不同类型，但它们在本质上都在做完全相同的事情：它们对某个动作执行若干次。（注意，这个数字可能是 0！）\n\n不同的循环框架提供了不同的方式来处理循环起点和终点的选择。有各种条件，某种类型的循环比其他循环类型更容易处理。\n\
    \nJavaScript 中提供的循环声明有：\n\n- `for` 声明\n- `do...while` 解释\n- `while` 解释\n- 命名声明\n\
    - `break` 解释\n- `continue` 解释\n- `for...in` 解释\n- `for...of` 解释\n- `for` 声明\n\n\
    ### for 声明\n\n`for` 循环重复执行直到预定义的条件评估为假。JavaScript 的 `for` 循环类似于 Java 和 C 的 `for`\
    \ 循环。\n\n一个 `for` 声明如下：\n\n`for ([初始化表达式]; [条件表达式]; [增量表达式])`\n\n当 `for` 循环开始执行时，会发生以下操作：\n\
    \n1. 执行初始化表达式 `initialExpression`，它可以是任何内容。这个表述通常初始化一个循环计数器，无论如何强调允许任何复杂程度的断言。这个表述也可以表达组件。\n\
    2. 如果 `conditionExpression` 的评估结果为真，则执行循环体语句。如果条件评估为假，则 `for` 循环结束。（如果条件语句被完全跳过，则条件被认为是真的。）\n\
    3. 执行语句体。要执行多个语句，请使用大括号（`{ ... }`）将这些语句组合在一起。\n4. 在当前的情况下，执行更新表达式 `incrementExpression`。\n\
    5. 控制返回第 2 步。\n\n#### 示例\n\n在下方的模型中，限制包含一个 `for` 声明，用于计算调查列表中被选中选项的数量（一个允许各种判断的\
    \ `<select>` 部分）。`for` 声明报告了变量 `i` 并将其初始化为 `0`。它确保 `i` 不大于 `<select>` 部分中的选项数量，执行随后的\
    \ `if` 语句，并在每次循环后将 `i` 增。\n\n```html\n<form name=\"selectForm\">\n  <p>\n    <label\
    \ for=\"musicTypes\">选择某些音乐类型，然后点击下面的按钮：</label>\n    <select id=\"musicTypes\"\
    \ name=\"musicTypes\" multiple=\"multiple\">\n      <option selected=\"selected\"\
    >R&B</option>\n      <option>Jazz</option>\n      <option>Blues</option>\n   \
    \   <option>New Age</option>\n      <option>Classical</option>\n      <option>Opera</option>\n\
    \    </select>\n  </p>\n  <p><input id=\"btn\" type=\"button\" value=\"选中了几个?\"\
    /></p>\n</form>\n```\n\n```javascript\nfunction howMany(selectObject) {\n  let\
    \ numberSelected = 0;\n  for (let i = 0; i < selectObject.options.length; i++)\
    \ {\n    if (selectObject.options[i].selected) {\n      numberSelected++;\n  \
    \  }\n  }\n  return numberSelected;\n}\n\nlet btn = document.getElementById('btn');\n\
    btn.addEventListener('click', function() {\n  alert('选中的选项数量：' + howMany(document.selectForm.musicTypes));\n\
    });\n```\n\n### do...while 解释\n\n`do...while` 解释重复执行直到预定的条件评估为假。\n\n一个 `do...while`\
    \ 解释如下：\n\n```javascript\ndo {\n  // 语句\n} while (condition);\n```\n\n在检查条件之前会重复执行语句体。（要执行多个声明，请使用大括号（`{\
    \ ... }`）将这些语句封装。）\n\n如果条件为真，声明将再次执行。在每次执行完成时，都会检查条件。当条件为假时，执行停止，控制传递到 `do...while`\
    \ 之后的语句。\n\n#### 示例\n\n在上面的模型中，`do` 循环至少执行一次，并一直持续直到 `i` 不小于 5。\n\n```javascript\n\
    let i = 0;\ndo {\n  i += 1;\n  console.log(i);\n} while (i < 5);\n```\n\n### while\
    \ 解释\n\n某些语句执行其声明，直到预定的条件评估为真。某些声明如下：\n\n```javascript\nwhile (condition) {\n\
    \  // 语句\n}\n```\n\n如果条件最终结果为假，循环内部的声明停止执行，控制传递到循环之后的语句。\n\n条件测试在执行关联的语句体之前发生。如果条件返回真，则执行声明并再次尝试条件。如果条件返回假，执行停止，控制传递到\
    \ `while` 之后的语句。\n\n要执行多个声明，请使用大括号语句（`{ ... }`）。\n\n#### 示例\n\n`while` 循环在 `n`\
    \ 小于 3 时执行语句：\n\n```javascript\nlet n = 0;\nlet x = 0;\nwhile (n < 3) {\n  n++;\n\
    \  x += n;\n}\n```\n\n### 命名声明\n\n命名给一个语句一个标识符，以便在程序的其他地方引用它。例如，你可以使用命名来感知循环，并随后使用\
    \ `break` 或 `continue` 解释来显示程序应该中断循环还是继续。\n\n标记声明的语言结构如下：\n\n```javascript\nmark:\n\
    \  // 语句\n```\n\n标记的评估可以是任何不是保留字的 JavaScript 标识符。与之关联的声明可以是任何语句。\n\n#### 示例\n\n\
    在上面的模型中，命名 `markLoop` 感知循环。\n\n```javascript\nmarkLoop:\nwhile (theMark === true)\
    \ {\n  doSomething();\n}\n```\n"
