    \n这里有两个问题：五个标记既可以启动一个断言，也可以是整个断言的扩展；以及五个限制性创建，在特定位置不允许换行，可能会导致错误的解析。这五个危险标记是左括号\
    \ `(`、左中括号 `[`、切片符号 `/` 以及 `+` 和减号 `-`。在这些中，左括号在快速构造的语句示例中是正常的，左中括号有时发生，而其他的非常罕见。规范中给出的示例是：\n\
    \n```javascript\na = b + c\n(d + e).foo()\n```\n\n/视为：\n\n```javascript\na = b\
