  trans: "\n有很多可用的事件监听器属性。让我们来分析一下。\n\n首先，为 `irregular tone eventhandlerproperty.html`\
    \ 创建一个附近的副本，并在程序中打开它。它只是我们目前为止所玩过的简单任意着色模型的副本。现在，尝试将 `btn.onclick` 平滑地更改为随附的各种属性，并观察模型中的结果：\n\
    \n- `btn.onfocus` 和 `btn.onblur` — 当捕获焦点和失去焦点时，着色会发生变化；尝试按 Tab 键在元素之间切换焦点，然后再次按\
    \ Tab 键移开焦点。这些通常用于在结构字段被激活时显示填充字段的信息，或者在结构字段加载了错误值时显示错误消息。\n- `btn.ondblclick`\
    \ — 当双击捕获目标时，着色会发生变化。\n- `window.onkeypress`, `window.onkeydown`, `window.onkeyup`\
    \ — 当控制台上按下按键时，着色会发生变化。`keypress` 事件指的是整个按下过程（按下后松开），而 `keydown` 和 `keyup` 分别指的是按键的按下和松开部分。注意：如果你尝试在实际捕获目标上注册此事件控制器将不起作用——我们需要将其注册在\
    \ `window` 对象上，它代表整个程序窗口。\n- `btn.onmouseover` 和 `btn.onmouseout` — 当鼠标指针悬停在捕获目标上或移出目标时，着色分别发生变化。\n\
    \n某些事件是通用的，几乎可以在任何地方使用（例如 `onclick` 控制器可以到几乎任何组件上），尽管某些事件更具体且仅在特定情况下有用（例如，仅在特定的组件上使用\
    \ `onplay` 是很好的）。\n\n# 第十三章\n\n## JavaScript Cookies\n\nCookie 是一种在服务器和客户端之间持久化的数据。网络浏览器在浏览时存储这些数据。\n\
    \n Cookie 包含通常以分号隔离的键值对形式的字符串数据。它保持客户端的状态并在所有网站页面之间记录客户端的数据。\n\n## Cookie 是如何工作的？\n\
    \n当客户端向服务器发送请求时，该请求的每一个部分都被视为由不同客户端发送的另一个请求。这样，为了识别客户端，我们需要在客户端服务器程序的响应中添加 Cookie。\n\
    \n现在，每当客户端向服务器发送请求时，Cookie 会随请求一起添加。有了 Cookie，服务器就能识别客户端。\n\n### JavaScript Cookies\n\
    \n## 如何在 JavaScript 中创建 Cookie？\n\n在 JavaScript 中，我们可以利用 `document.cookie` 属性创建、读取、刷新和删除\
    \ Cookie。\n\n使用以下语句来创建 Cookie：\n\n```javascript\ndocument.cookie=\"name=value\"\
    ;\n```\n\n### JavaScript Cookie 示例\n\n#### 示例 1\n\n我们应该看一个设置和获取 Cookie 的指南。\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n</head>\n<body>\n<input type=\"button\"\
    \ value=\"setCookie\" onclick=\"setCookie()\">\n<input type=\"button\" value=\"\
    getCookie\" onclick=\"getCookie()\">\n<script>\nfunction setCookie()\n{\ndocument.cookie=\"\
    username=Duke Martin\";\n}\nfunction getCookie()\n{\nif(document.cookie.length!=0)\n\
    {\nalert(document.cookie);\n}\nelse\n{\nalert(\"Cookie not accessible\");\n}\n\
    }\n</script>\n</body>\n</html>\n```\n\n#### 示例 2\n\n在这里，我们独立地显示 Cookie 的键值对。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n</head>\n<body>\n<input type=\"button\"\
    \ value=\"setCookie\" onclick=\"setCookie()\">\n<input type=\"button\" value=\"\
    getCookie\" onclick=\"getCookie()\">\n<script>\nfunction setCookie()\n{\ndocument.cookie=\"\
    username=Duke Martin\";\n}\nfunction getCookie()\n{\nif(document.cookie.length!=0)\n\
    {\nvar array=document.cookie.split(\"=\");\nalert(\"Name=\"+array[0]+\" +\"Value=\"\
    +array[1]);\n}\nelse\n{\nalert(\"Cookie not accessible\");\n}\n}\n</script>\n\
    </body>\n</html>\n```\n\n#### 示例 3\n\n在这个示例中，我们提供了着色决策并将选定的着色值传递给 Cookie。现在，Cookie\
    \ 在程序中存储客户端的最后决定。以此类，当刷新网站页面时，客户端的最后决定将出现在屏幕上。\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n</head>\n<body>\n<select id=\"color\" onchange=\"display()\">\n<option\
    \ value=\"Select Color\">选择颜色</option>\n<option value=\"yellow\">黄色</option>\n\
    <option value=\"green\">绿色</option>\n<option value=\"red\">红色</option>\n</select>\n\
    <script type=\"text/javascript\">\nfunction display()\n{\nvar esteem = document.getElementById(\"\
    color\").value;\nif (esteem != \"Select Color\")\n{\ndocument.bgColor = esteem;\n\
    document.cookie = \"color=\" + esteem;\n}\n}\nwindow.onload = function ()\n{\n\
    if (document.cookie.length != 0)\n{\nvar array = document.cookie.split(\"=\");\n\
    document.getElementById(\"color\").value = array[1];\ndocument.bgColor = array[1];\n\
    }\n}\n</script>\n</body>\n</html>\n```\n\n# 总结\n\nJavaScript 是网络上的一项极佳的创新。它并不难学，而且非常灵活。它与其他网络创新技术（如\
    \ HTML 和 CSS）配合得很好，甚至可以与 Flash 等模块协作。\n"
