    \ `Web` 程序都提供警告工作，因此警告也可以使用，但通常不被使用。\n\n`JavaScript` 的大部分语法来自 `Java`，但同时也继承自 `Awk`\
    \ 和 `Perl`，并在其对象模型框架中受到 `Self` 的一些反向影响。\n\n### 基础\n\n`JavaScript` 是大小写敏感的。构造函数的名称以大写字母开头，函数或变量名以小写字母开头并不是意外的。\n\
    \n示例：\n\n```javascript\nvar a=5;\nconsole.log(a);/5\nconsole.log(A);/抛出 ReferenceError:\
