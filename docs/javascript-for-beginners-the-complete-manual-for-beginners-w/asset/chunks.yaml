    在现实中，我们尽量避免编写长长的零序列。那对我们来说很没劲。我们会尝试用类似 "1bn" 来表示 10 亿，或用 "7.3bn" 表示 73 亿。这种表示法对于大多数巨大的数字都是成立的。


