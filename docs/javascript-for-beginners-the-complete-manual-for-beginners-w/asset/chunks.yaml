  trans: "\n\n既然我们已经理解了 DOM 树，就可以开始获取我们的第一个 HTML 组件了。利用 JavaScript DOM 有多种方法可以实现这一点，以下是最常用的方法：\n\
    \n### 通过 ID 获取组件\n\n`getElementById()` 方法用于通过其 id 获取单个组件。让我们来看一个模型：\n\n```javascript\n\
    var title = document.getElementById('header-title');\n```\n\n在这里，我们获取 id 为 `header-title`\
    \ 的组件并将其保存到变量中。\n\n### 通过类名获取组件\n\n我们同样可以利用 `getElementsByClassName()` 技术获取多个元素，该方法返回一组组件。\n\
    \n```javascript\nvar things = document.getElementsByClassName('list-things');\n\
    ```\n\n在这里，我们获取所有类名为 `list-things` 的元素并保存到变量中。\n\n### 通过标签名获取组件\n\n我们同样可以利用 `getElementsByTagName()`\
    \ 方法通过标签名获取组件。\n\n```javascript\nvar listItems = document.getElementsByTagName('li');\n\
    ```\n\n在这里，我们获取 HTML 文档中所有的 `li` 组件并将其保存到变量中。\n\n### Queryselector\n\n`querySelector()`\
    \ 方法返回与预定义 CSS 选择器匹配的第一个组件。这意味着你可以通过 id、类、标签以及任何其他重要的 CSS 选择器获取组件。这里我简单列出几个最常用的选项。\n\
    \n**通过 id 获取：**\n\n```javascript\nvar header = document.querySelector('#header')\n\
    ```\n\n**通过类获取：**\n\n```javascript\nvar things = document.querySelector('.list-things')\n\
    ```\n\n**通过标签获取：**\n\n```javascript\nvar headings = document.querySelector('h1');\n\
    ```\n\n**获取更显式的组件：**\n\n我们同样可以 CSS 选择器获取更显式的组件。\n\n```javascript\ndocument.querySelector(\"\
    h1.heading\");\n```\n\n在这个模型中，我们同时查找标签和类，并返回通过该 CSS 选择器的主组件。\n\n### Queryselectorall\n\
    \n`querySelectorAll()` 方法与 `querySelector()` 完全不同，它实际上返回所有符合 CSS 选择器的组件。\n\n```javascript\n\
    var heading = document.querySelectorAll('h1.heading');\n```\n\n在这个模型中，我们获取所有带有\
    \ `heading` 类的 `h1` 标签并将它们存储在一个集合中。\n\n## 修改 HTML 元素\n\nHTML DOM 允许我们通过更改其属性来改变\
    \ HTML 组件的内容和样式。\n\n### 修改 HTML\n\n`innerHTML` 属性可用于更改 HTML 组件的内容。\n\n```javascript\n\
    document.getElementById(\"#header\").innerHTML = \"Hi World!\";\n```\n\n在这个模型中，我们获取\
    \ id 为 `header` 的组件并将内部内容设置为 \"Hi World!\"。\n\n`innerHTML` 同样可以将标签放入另一个标签中。\n\n\
    ```javascript\ndocument.getElementsByTagName(\"div\").innerHTML = \"<h1>Hello\
    \ World!</h1>\"\n```\n\n在这里，我们将一个 `h1` 标签放入所有现有的 `div` 中。\n\n### 修改属性值\n\n你同样可以通过\
    \ DOM 修改属性的值。\n\n```javascript\ndocument.getElementsByTag(\"img\").src = \"test.jpg\"\
    ;\n```\n\n在这个模型中，我们把所有 `img` 标签的 `src` 修改为 `test.jpg`。\n\n### 修改样式\n\n要更改 HTML\
    \ 组件的样式，我们需要更改组件的 `style` 属性。这里有一个修改样式的语言结构：\n\n```javascript\ndocument.getElementById(id).style.property\
    \ = new style\n```\n\n现在让我们来看一个模型，我们获取一个组件并将基线改为加粗的深色线：\n\n```javascript\ndocument.getElementsByTag(\"\
    h1\").style.borderBottom = \"strong 3px #000\";\n```\n\nCSS 属性应该使用驼峰法，而不是普通的 CSS\
    \ 属性名。在这个模型中，我们使用了 `borderBottom` 而不是 `line base`。\n\n## 添加和删除组件\n\n现在我们将研究如何添加新组件和删除现有组件。\n\
    \n### 添加组件\n\n```javascript\nvar div = document.createElement('div');\n```\n\n\
    在这里我们利用 `createElement()` 技术创建一个 `div` 组件，该方法接受标签名作为参数并将其保存到变量中。之后我们只需要给它一些内容，然后将其嵌入我们的\
    \ DOM 文档中。\n\n```javascript\nvar newContent = document.createTextNode(\"Hello\
    \ World!\");\n\ndiv.appendChild(newContent);\n\ndocument.body.insertBefore(div,\
    \ currentDiv);\n```\n\n在这里我们利用 `createTextNode()` 技术创建内容，该方法接受 `String` 作为参数，然后我们将新的\
    \ `div` 组件插入到记录中现有的 `div` 之前。\n\n### 删除组件\n\n```javascript\nvar elem = document.querySelector('#header');\
    \ elem.parentNode.removeChild(elem);\n```\n\n在这里我们获取一个组件并利用 `removeChild()` 方法将其删除。\n\
    \n### 替换组件\n\n现在我们应该研究如何替换元素。\n\n```javascript\nvar div = document.querySelector('#div');\n\
    \nvar newDiv = document.createElement('div');\n\nnewDiv.innerHTML = \"Hi World2\"\
    \n\ndiv.parentNode.replaceChild(newDiv, div);\n```\n\n在这里我们利用 `replaceChild()`\
    \ 方法替换一个组件。主要参数是新组件，后续参数是我们需要替换的组件。\n\n### 直接写入 HTML 输出流\n\n我们同样可以利用 `write()`\
    \ 方法将 HTML 语句和 JavaScript 语句直接写入 HTML 输出流。\n\n```javascript\ndocument.write(\"\
    <h1>Hello World!</h1><p>This is a paragraph!</p>\");\n```\n\n我们同样传递像日期对象的 JavaScript\
    \ 语句。\n\n```javascript\ndocument.write(Date());\n```\n\n`write()` 方法还可以接受多个内容，这些内容将按照它们的事件顺序添加到文档中。\n\
    \nJavaScript 函数是一段旨在执行特定任务的代码块。\n\n当“某事”触发它（调用它）时，JavaScript 函数就会执行。\n\n#### 模型\n\
    \n```javascript\nfunction myFunction(p1, p2) {\n  return p1 * p2;\n} // 函数返回 p1\
    \ 和 p2 的结果\n```\n\n#### JavaScript 函数语法\n\nJavaScript 函数以关键字 `function` 为特征，后面跟着一个名称，然后是括号\
    \ `()`。\n\n函数名称可以包含字母、数字、下划线和美元符号（与变量相同的规则）。\n\n括号可以包含由逗号分隔的参数名称：`(parameter1,\
    \ parameter2, ...)`\n\n函数要执行的代码放在大括号 `{}` 中：\n\n```javascript\nfunction name(parameter1,\
    \ parameter2, parameter3) {\n  // 要执行的代码\n}\n```\n\n函数参数记录在函数定义的括号 `()` 内。\n\n\
    函数参数是函数被调用时获取的属性。\n\n在函数内部，参数（边界）作为局部变量使用。\n\n函数类似于其他编程语言中的过程（Procedure）或子程序（Subroutine）。\n\
    \n#### 函数调用\n\n当“某事”触发（调用）函数时，函数内部的代码将执行：\n\n- 在事件发生时（例如当用户点击按钮时）\n- 从 JavaScript\
    \ 代码中被调用时\n\n因此（自调用）\n\n你将在本教程的后续练习中熟悉更多关于函数调用的知识。\n\n#### 函数返回\n\n当 JavaScript\
    \ 遇到 `return` 语句时，函数将停止执行。\n\n如果函数是从断言（assertion）中调用的，JavaScript 将“返回”并执行调用语句之后的代码。\n\
    \n函数通常会带回一个返回值。返回值会被“返回”给“调用者”：\n\n#### 模型\n\n计算两个数字的结果并返回结果：\n\n```javascript\n\
    var x = myFunction(4, 3); // 函数被调用，返回值将存储在 x 中\n\nfunction myFunction(a, b) {\n\
    \  return a * b; // 函数返回 a 和 b 的结果\n}\n```\n\n`x` 中的结果将是：\n\n12\n\n#### 为什么使用函数？\n\
    \n你可以复用代码：定义一次代码并多次使用。\n\n你可以使用不同的参数多次使用相同的代码，以交付不同的结果。\n\n#### 模型\n\n将华氏度转换为摄氏度：\n\
    \n```javascript\nfunction toCelsius(fahrenheit) {\n  return (5/9) * (fahrenheit-32);\n\
    }\n\ndocument.getElementById(\"demo\").innerHTML = toCelsius(77);\n```\n\n####\
    \ `()` 运算符调用函数\n\n利用上面的模型，`toCelsius` 指的是函数对象，而 `toCelsius()` 指的是函数的结果。\n\n"
