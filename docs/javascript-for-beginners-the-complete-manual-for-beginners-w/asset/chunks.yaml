    \ | `Object.freeze()` | 该策略防止现有属性被删除。 |\n| 7 | `Object.getOwnPropertyDescriptor()`\
    \ | 该策略返回预定义项特定属性的属性描述符。 |\n| 8 | `Object.getOwnPropertyDescriptors()` | 该技术返回给定项的所有自有属性描述符。\
    \ |\n| 9 | `Object.getOwnPropertyNames()` | 该策略返回找到的所有项（无论是否可枚举）。 |\n| 10 | `Object.getOwnPropertySymbols()`\
