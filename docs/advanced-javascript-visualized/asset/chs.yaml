  # NodeJS、C++、队列与服务器\n\n```\nIf someone would ask me, what is the best thing that\
  \ happens in the javascript community?, my immediate answer will be it is none other\
  \ than NodeJS!.NodeJS is an amazing javascript runtime and also a little misunderstood\
  \ tool. In this chapter, I will try to make it as easy as possible and explain the\
  \ core architecture and fundamentals of the nodejs.\n```\n\n### Node 不是什么？\n\n1.\
  \  它不是一种编程语言。\n2.  它不是用于服务器端编码的框架/工具（不像 Php）。\n3.  JavaScript 是一种编程语言，**而 Node 不是**。\n\
  \n### Node 实际上是什么？\n\n1.  它是一个底层 C++ 委托代码，通过提供 JavaScript API（即 C++ 特性的 JavaScript\
  \ 版本（**有时甚至是“C 绑定的 C++ 代码”**））供我们使用。\n2.  **它实际上是一个 C++ 程序**，将 JavaScript 代码作为字符串接收并完成所有工作！\n\
  3.  Node 是一个单一的 C++ 程序，依赖于许多其他 C++ 库，如 **libUV、V8、c-ares、OpenSSL** 等。\n4.  我们称之为\
  \ nodejs，是因为用 C++ 编写的特性通过暴露等效的 JavaScript API 供我们使用。所以，Node（C++ 特性）+ JavaScript\
  \ == NodeJS\U0001F60E。\n\n```\nNodeJS's core architecture is way more complicated\
  \ than a browser or any other environment. Not only that, on the internet 90% of\
  \ information related to nodejs are partially false or misguided\U0001F62A.\n```\n\
  \n*   我将非常循序渐进地讲解核心架构，并为你拆分各个部分，这样你就不需要再去其他地方理解了。让我们从 JavaScript 的基本示意图开始。\n\n![Image](img/Image00233.jpg)\n\
  \n*   如我们所见，我们有一个类似的模型：队列、调用栈和我们的内存空间。\n*   因为我们要在计算机上执行大量系统操作，Node 实际上使用了大量第三方\
  \ C/C++ 库来完成各种任务。\n*   我们首先需要理解两个主要组件。\n\n### V8 引擎\n\n*   V8 引擎有一个基本任务：解析 JavaScript\
  \ 并将其转换为**优化的机器码**。\n*   然而，V8 不仅仅是将我们的 JavaScript 代码转换为机器码，它做的远不止这些。它提供了事件循环的默认版本（等等，什么\U0001F928\
  ）。\n*   V8 提供给我们的默认事件循环可以被 JavaScript 运行时创建者扩展或替换。\n*   Node 实际上并没有使用 V8 的默认事件循环。Node\
  \ 使用的是 LibUV 的事件循环，而不是 V8 的！\n*   因为 V8 有一个默认的事件循环，V8 事件循环队列的骨架代码仍然存在，并且 **Promise**\
  \ 使用该队列，而不是其他任何队列。\n*   我已经移除了 V8 的 **“任务队列”**。主要原因是 Node 不使用它，甚至不关心它。Node 使用了一种稍微不同的方法来处理异步**定时器**。\n\
  *   Node 提供了 `process.nextTick()`，它被设计为始终在所有队列之前运行。\n\n![Image](img/Image00234.jpg)\n\
  \n### LibUV\n\n*   这个库是 Node 的核心。LibUV 不仅提供了事件循环，还拥有一个非常好的机制来处理大量 I/O 操作。\n*   I/O\
  \ 操作可以是任何东西，比如大量连接请求、套接字、文件系统等。\n*   LibUV 提供或有时使用许多队列，我们很快就会学习这些队列。\n*   让我们先看看结合了\
  \ **v8 和 libUV** 的心智模型图\U0001F604。\n\n![Image](img/Image00235.jpg)\n\n*   我故意在蓝色框上方留了一些空间，稍后会讲到。\n\
  *   从图中可以看到，我们有 v8 + LibUV 的队列。\n*   LibUV 有 7 个主要队列（只画了 6 个，因为 Idle 和 Prepare 合并为一行）。\n\
  \n1.  **定时器：** `setTimeout()` 和 `setInterval()`。\n2.  **待处理回调：** 想象一下，父进程是 **Nginx\
  \ 服务器**，它已经在 3000 端口上运行，而你想在 3000 端口上启动 Node 服务器。那么，它会抛出一个错误（系统错误）。所有这类系统调用或错误回调都会被放入这个队列。\n\
  3.  **Idle 和 Prepare：** 我们不与之交互。\U0001F605（两个队列画在一起，因为我们实际上不使用，LibUV 内部使用它们）\n4.\
  \  **Poll：** 所有 I/O 操作，如文件处理、客户端请求处理、套接字、加密、zlib（压缩）操作等，都通过此队列处理。\n5.  **Check：**\
  \ 用于 `setImmediate()` 回调，我们使用这个队列。\n6.  **Close：** 所有来自系统的关闭事件，如套接字关闭或清理事件，都被添加到此队列中（但为什么呢？因为这些是系统调用，而不是传入请求，所以\U0001F601\
  ）。\n\n> 默认的 libUV 和 v8 结合的心智模型并不难理解。问题是 Node 内部做的事情远不止使用这些队列，而最重要的部分是 **poll 队列**\
  \ ***\U0001F60B*** **。**\n\n*   从图中，我们可以看到一些奇怪的东西，比如**线程池**和 **Epoll/KQueue（数据结构）**，它们用于处理从\
  \ poll 队列委托过来的工作。\n*   不仅如此，我们还有**工作线程**，这也是一个不同的东西\U0001F928。\n*   在底部，我们有操作系统特性，或者你可以称之为系统的心脏\
  \ **“内核”**。\n*   在我们进一步解释所有东西如何协同工作之前，让我们先完成 Node 架构。\n\n![Image](img/Image00236.jpg)\n\
  \n*   我们知道我们将编写“JavaScript”，因此任何系统级代码都需要用 JavaScript 编写，然后委托给我们的 C++ 代码。这就是为什么我们有\
  \ **Node Core APIs**。\n*   它包含了所有核心模块的逻辑，这些逻辑用 C++ 编写，并暴露为 JavaScript API，供我们作为开发者使用。\n\
  *   **C++ Addon 和 N-API** 是我们可以使用的特殊特性或 API，用于通过 C++ 扩展 NodeJS（这需要 C/C++ 知识，所以我不会告诉你这个\U0001F605\
  ）。\n\n### Node 内部的正常执行流程\n\n**步骤 1：** 扫描整个代码，提升所有可能的变量。对未使用的引用进行垃圾回收（优化）。\n\n**步骤\
  \ 2：** 从上到下完成所有同步执行。\n\n**步骤 3：** 扫描所有异步代码的事件处理程序或回调，并将其作为未来的占位符存储在内存中。\n\n**步骤\
  \ 4：** 开始通过队列执行所有已完成的后台代码，并持续进行，直到完成所有后台任务或终止进程（事件循环\U0001F601！）\n\nNode 环境中队列的顺序如图所示。\n\
  \n1.  执行所有 `process.nextTick()` 的回调。\n2.  执行 **job queue** 中的所有 Promise。\n3.  进入\
  \ LibUV 的队列，并从右向左开始执行\n    3.1 通过 **Timer queue** 完成定时器。\n    3.2 通过 **Pending queue**\
  \ 完成系统调用的错误处理回调。\n    3.3 完成内部使用的 **Idle、Prepare queue**。\n    3.4 等待一段时间，尝试尽可能多地完成\
  \ **poll queue** 中的回调。（稍微复杂，我们稍后会深入理解）。\n    3.5 完成 **check queue**（`setImmediate`）。\n\
  \    3.6 通过 **close queue** 完成关闭回调的执行。\n\n\n\n\n\n### 步骤 5：重复循环直到 Node 进程被终止\n\n\
  现在，我们通过一个示例来理解所有内容，并深入了解每一步发生了什么。\n\n![Image](img/Image00237.jpg)\n\n> 暂时忽略 `require()`\
  \ 以及模块系统的工作原理，只关注我们的示例。另外，我特意编写了一段 JavaScript 代码，使其执行结果与代码逻辑上显示的结果完全不同，产生意想不到的输出。\n\
  \n![Image](img/Image00238.jpg)\n\n*   一开始，我们读取文本文件的内容，即 `file1.txt` 和 `file2.txt`。\n\
  *   `file1.txt` 的内容是“Hello guys 1”，`file2.txt` 的内容是“Hello guys 2”。\n\n![Image](img/Image00239.jpg)\n\
  \n*   下一条语句是非常简单的同步日志输出。\n\n![Image](img/Image00240.jpg)\n\n*   接下来，我们使用了如上所示的 `process.nextTick()`。\n\
  \n![Image](img/Image00241.jpg)\n\n*   之后，我们调用了如上所示的 `setImmediate()`。\n\n![Image](img/Image00242.jpg)\n\
  \n*   然后，我们发起两次 HTTP GET API 调用，并简单地从响应中记录 `statusMessage`。\n\n![Image](img/Image00243.jpg)\n\
  \n*   接着，我们解析了一个 `Promise`，并调用了该已解析 Promise 的 `then()`。\n\n![Image](img/Image00244.jpg)\n\
  \n*   最后，在我们的代码中，我们调用了 `setTimeout()`，其超时时间为 0 毫秒。\n\n现在，让我们开始可视化代码的执行过程，看看代码在底层是如何实际工作的\U0001F60E\
  ！\n\n![Image](img/Image00245.jpg)\n\n*   首先，我们将完成所有同步代码，在本例中包括 `console` 语句和 `Promise`\
  \ 函数构造函数（注意，这里不是已完成的 Promise 对象，只是 `Promise` 构造函数的执行）。\n\n![Image](img/Image00246.jpg)\n\
  ![Image](img/Image00247.jpg)\n\n*   这里我们返回了一个 Promise 对象，但没有将其存储在任何变量中，因此 `then()`\
  \ 的回调会立即被放入 Job Queue（任务队列），而该对象由于在内存中没有任何引用而被垃圾回收。下面我们来看一下！\n\n![Image](img/Image00248.jpg)\n\
  \n*   Promise 的工作方式在浏览器或 Node 环境中不会改变，因为两者都使用 V8 引擎，而 Promise 是 V8 引擎本身的一部分。\n\n\
  ![Image](img/Image00249.jpg)\n![Image](img/Image00250.jpg)\n\n*   如你所见，`then()`\
  \ 的回调被添加到 Job Queue 中，而 Promise 对象则被垃圾回收。接下来我们继续执行。\n*   由于 Node 提供了 `process.nextTick()`，在同步执行完成后，所有\
  \ `process.nextTick()` 的回调会被添加到一个单独的队列中，如图所示。\n*   因此，`process.nextTick()` 的回调被存储在我们队列层级中最顶层的队列中。\n\
  \n![Image](img/Image00251.jpg)\n\n*   我们继续遍历代码，并将回调存储到 Node 环境决定的各自队列中。上面，我们将一个定时器回调添加到了定时器队列中。\n\
  \n![Image](img/Image00252.jpg)\n\n*   如上所示，所有 I/O 回调都在 Poll 队列中。文件读取操作和 HTTP GET\
  \ API 调用都属于 I/O 操作。\n*   在内部，Poll 队列根据执行的操作采用不同的处理方式（稍后会看到）。\n\n![Image](img/Image00253.jpg)\n\
  \n*   最后，我们还有 `setImmediate()`，它将进入 Check 队列。\n*   Poll 队列实际上会启动后台工作，并且不参与队列调用的第一次迭代（事件循环的第一次迭代）。因此，我将其标记为灰色。\n\
  \n![Image](img/Image00254.jpg)\n\n*   现在，让我们开始执行队列。记住队列的顺序：从上到下，从右到左。\n\n![Image](img/Image00255.jpg)\n\
  ![Image](img/Image00256.jpg)\n\n接下来轮到我们的 Job Queue（Promise 队列）。\n\n![Image](img/Image00257.jpg)\n\
  ![Image](img/Image00258.jpg)\n![Image](img/Image00259.jpg)\n![Image](img/Image00260.jpg)\n\
  \n*   现在轮到我们的定时器了\U0001F603。\n\n![Image](img/Image00261.jpg)\n![Image](img/Image00262.jpg)\n\
  ![Image](img/Image00263.jpg)\n\n*   这次轮到 Poll 队列了，但 Poll 队列中有 4 个操作：2 个文件读取和 2 个\
  \ GET API 调用。因此，`libUV` 会在内部计算超时时间，判断这些操作是否能在一定时间内（通常是很短的几秒内）快速完成。如果不能，则立即转到 Check\
  \ 队列。这就是为什么我们在这里会快速转到 Check 队列中的 `setImmediate()` 回调，而不等待这 4 个操作（2 个文件读取 + 2 个 GET\
  \ API 调用）完成。\n\n![Image](img/Image00264.jpg)\n![Image](img/Image00265.jpg)\n\n*\
  \   现在，所有队列都已清空，除了 Poll 队列外，所有待处理任务都已结束。让我们看看 Poll 队列将如何执行这些任务。\n*   Poll 队列将任务分为两大类。\n\
  *   所有类似文件读取、crypto 和 zLib 的操作都通过线程池完成。\n*   线程池是一组工作线程（与 Node 默认模块提供的工作线程不同）。线程池的默认大小为\
  \ 4，但你可以通过 Node 提供的 `UV_THREADPOOL_SIZE` 全局变量覆盖该值。我在线程池中画了 4 个小方块来表示线程。\n*   一个线程可以执行一个任务，因此\
  \ 4 个线程可以同时执行 4 个任务。\n*   然而，正如我所说，文件读取、crypto 和 zLib 这类任务在设计上只在线程池中执行。因此，在我们的例子中，两个文件读取操作通过线程池完成，两个文件操作由两个独立的线程处理，而另外两个\
  \ GET API 调用则通过其他机制（如 `Epoll`/`Kqueue`）完成（稍后会看到）。\n\n![Image](img/Image00266.jpg)\n\
  \n*   如你所见，我们在两个线程中处理两个文件读取操作，当它们完成读取后，结果会返回给各自的回调。\n\n![Image](img/Image00267.jpg)\n\
  ![Image](img/Image00268.jpg)\n\n*   让我们完成这两个已完成的读取操作的执行，并运行它们的回调（因为我们不会在等待 API 调用完成时阻塞\
  \ Poll 队列）。\n\n![Image](img/Image00269.jpg)\n![Image](img/Image00270.jpg)\n\n* \
  \  很好，现在我们也完成了文件读取操作，但还有两个操作需要完成，即我们的两个 API 调用。因此，我们再次进入事件循环的下一次迭代。\n\n![Image](img/Image00271.jpg)\n\
  \n*   现在，是时候了解 `epoll`/`Kqueue` 和 Poll 队列如何协同工作了。我将解释 `epoll`，而不是其他机制，因为所有其他机制几乎相同，唯一的区别在于它们基于不同的操作系统架构。\n\
  \n#### epoll（假设我们在 Linux 上）\n\n*   它是一种自平衡的二叉树数据结构。\n*   我们将任务附加到该数据结构的节点上，并循环遍历每个任务，直到某个超时时间。\n\
  *   假设有 10 个 API 请求同时到达正在运行的 Node 进程，它们实际上都会被交给 `epoll`。\n*   在将所有请求交给 `epoll` 之前，请求会以非阻塞模式打开（这是\
  \ Linux 的一个特性，允许以非阻塞模式打开文件/处理请求，并等待它们完成，然后返回结果）。\n*   现在，在我们的假设中，我们有 10 个并发请求，我们将以非阻塞模式打开它们，并将其\
  \ ID（称为文件描述符）存储在 `epoll` 中。每个 ID 都会关联事件（这里指我们的回调函数）。\n*   通常，我们会在一段时间内循环遍历 `epoll`。假设\
  \ `epoll` 循环 2 秒，那么在这 2 秒内，10 个请求中有 4 个完成了。因此，结果会返回给 `epoll`，再从 `epoll` 返回到我们的 Poll\
  \ 队列。\n*   完成 4 个请求后，我们立即转到 Check 队列。\n*   在事件循环的下一次迭代中，假设在我们的 `epoll` 中又完成了 3 个请求（记住，我们实际上每\
  \ 2 秒循环一次 `epoll`，以检查后台工作是否完成）。这 3 个请求及其数据会返回给 Poll 队列。\n*   在下一次迭代中，假设我们完成了所有剩余的\
  \ 3 个请求，结果返回给 Poll 队列。\n\n\n\n\n通过内核特性将请求置于非阻塞模式，并借助 Epoll 数据结构处理任务，能够在不阻塞主 JavaScript\
  \ 线程、不阻塞轮询队列以及不产生新线程的情况下，实现惊人的并发能力。这正是 Node.js 如此流行且令人惊叹的原因。\n\n![Image](img/Image00272.jpg)\n\
  \n* 在我们的场景中，有两个 GET API 调用。我们将按照刚才讨论的方式通过 epoll 处理它们，并将结果返回给轮询队列。让我们完成剩余两个 API 调用的可视化展示。\n\
  \n![Image](img/Image00273.jpg)\n![Image](img/Image00274.jpg)\n![Image](img/Image00275.jpg)\n\
  \n现在，所有执行如上所述完成，所有队列变为空，因此程序将退出。朋友们，这就是 Node 实际工作的方式\U0001F60E。你通过正确的思维模型学习了复杂的\
  \ Node 架构\U0001F601。\n\n```\n注意：这里我假设 file1.txt 的读取操作在 file2.txt 之前完成，同样第一个 API\
  \ 调用在第二个 API 调用之前完成。两个文件读取操作中哪一个先完成取决于你的操作系统和处理器。API 调用也是如此。\n```\n\n现在，让我们从 Node\
  \ 的角度讨论一些令人困惑的概念，比如 `多线程`、`工作线程` 和 `多进程`。\n\n### 多进程\n\n* 我们知道，当我们启动 Node 程序时，实际上启动了一个\
  \ Node 进程，其中包含 1 个 `v8` 实例、1 个通过 `libUV` 实现的事件循环实例以及 Node API 核心层。\n* 现在，当我们使用 `child_process`\
  \ 时，我们从父进程（即我们的 Node 进程）中创建一个新的独立进程。我们可以在新创建的进程中执行任何操作。\n* 这里需要注意的重要一点是，每个新创建的进程都将拥有自己的\
  \ 1 个 `v8` 实例和 1 个通过 `libUV` 实现的事件循环实例。这就是为什么我们也可以在 `child_process` 中解析 JavaScript（如果需要的话）。\n\
  * 如果你是 Node 开发者，那么你很可能知道名为 `Cluster` 的模块，它主要用于创建正在运行的 Node 进程的一个或多个分支，并且每个进程将被放置在你的处理器的逻辑核心上！\n\
  \n让我们可视化它。\n\n![Image](img/Image00276.jpg)\n\n### 工作线程\n\n* 这是 Node 中一个独立的模块，允许你创建真正的线程，并且我们也可以在新创建的线程中运行\
  \ JavaScript 代码。\n* 每个线程将拥有自己的 `v8` 和 `libUV` 实例。\n\n![Image](img/Image00277.jpg)\n\
  \n* 工作线程可以通过通信通道与父进程的主线程通信，不仅如此，我们还可以在不同线程之间来回传递数据\U0001F60B。\n* Node 中的线程与其他编程语言的线程概念略有不同。正如我们所见，我们可以在单独的线程中运行\
  \ CPU 密集型任务，但每个线程都有自己的 `v8` 和 `libUV` 实例。因为每个线程需要 `v8` 和 `libUV` 来执行任务并解析 JavaScript\
  \ 代码，所以 Node 中的线程会消耗更多内存。\n* 因此，即使在 Node 中创建大量线程，我们也肯定会耗尽系统内存，或者使系统因资源密集型线程而过载。\n\
  * 所以，最好只在 Node 中为大型 CPU 密集型任务使用工作线程。切勿使用工作线程来服务 API 请求或提供文件服务\U0001F9D0。\n\n###\
  \ 多进程 vs 工作线程\n\n* 最好使用多进程在每个 CPU 核心上服务 Node 进程。此外，在每个 Node 进程内部，我们将拥有足够的内存和存储空间，以便可以累积多个\
  \ API 请求，随后通过轮询队列委托给 epoll 和线程池，从而为我们提供真正良好的并发能力。\n* 工作线程可用于执行 CPU 密集型任务，例如在单独的线程中计算高度复杂的数学公式，并将结果返回给父线程（即我们的\
  \ Node 主进程的线程）。\n* 我们可以结合两者的优点：创建多个 Node 进程，并为每个进程中的特定 CPU 密集型任务使用工作线程\U0001F60E\
  。\n\n### 工作线程 vs 线程池\n\n* 这很简单，线程池拥有工作线程（可以直接执行特定任务的线程），当我们执行文件 I/O、加密和 zlib 操作时，`libUV`\
  \ 会自动使用这些线程。\n* `工作线程`（Node 提供的模块）由我们创建，用于在完全不同的线程中执行特定任务。\n* 现在，`线程池` 的线程易于维护且速度快，因为它们不需要\
  \ `v8` 和 `libUV` 实例，因为线程池已经提前知道要执行的任务。\n* `工作线程` 会消耗一些资源，因此我们不会创建太多。（这里，我们不会像其他传统编程语言（如\
  \ Java）那样为每个客户端请求创建线程，因为如果那样做，会使我们的系统更加消耗资源且不稳定。这与它们的概念完全不同。对于这类目的，我们应该始终依赖 Node\
  \ 的非阻塞 I/O）。\n\n```\n我希望以上所有信息已经澄清了关于 Node.js 的所有错误假设和误解\U0001F60A。\n```\n\n###\
  \ Node 模块系统\n\n现在，在结束 Node 之旅之前，我想解释一下 Node 的模块系统是如何工作的。\n\nJavaScript 在不同的环境中运行，我们默认没有可用的原生模块系统（忽略最近出现的\
  \ ES6+ 原生模块，稍后讨论）。\n\n* 现在，当 Node.js 开发时，他们需要找出某种方式为开发者提供模块化系统，因此他们创建了自己的模块系统，称为\
  \ `commonjs`。让我们通过可视化来理解它是如何工作的。\n* 在 Node.js 中，我们项目中使用的每个 JavaScript 文件都被视为一个 `模块`，这意味着它们不仅仅是文件中的普通\
  \ JavaScript 代码，而是有一些额外的包装和内容。\n* 此外，Node.js 为我们提供了一些全局变量，这些变量对所有 `模块` 都可用。我们称它们为全局变量。其中两个变量是\
  \ `require()` 函数和 `module` 对象（注意，这里的文件 `module` 和全局关键字 `module` 是两个不同的东西\U0001F605\
  ）。\n\n让我们可视化到目前为止所学的内容。\n\n![Image](img/Image00278.jpg)\n\n* 假设，我们想要将其他文件（`file1.js`\
  \ 和 `file2.js`）的一些内容添加到我们的主文件（`main.js`）中。\n* 正如我之前所说，在运行 Node 进程时，我们默认有一些全局变量可用。因此，这里我们将需要使用其中一个变量来完成我们的需求。\n\
  * `require()` 函数在每个文件（模块）中都可使用，这意味着我也可以在 `main.js` 中使用这个辅助函数。\n* 但是 Node.js 会在所有模块（js\
  \ 文件）被另一个模块 require 之前，给它们添加一个叫做 `IIFE`（立即调用函数表达式）的东西。让我们看看。\n\n![Image](img/Image00279.jpg)\n\
  \n* 正如我们所见，在 `file1.js` 中，我们有一个简单的 `greet()` 函数，它将被 `IIFE` 函数包裹，如图所示（当然，只有当我们在另一个模块中\
  \ require `file1.js` 时才会这样）。\n* 同样，我们的 `main.js`（主模块）也会被包裹。因为当我们启动 Node 进程时，我们将从主模块开始。\n\
  \n![Image](img/Image00280.jpg)\n\n* 如果你注意到一点，包装器 `IIFE` 有一堆参数/变量可用，其中之一是 `require`。让我们看看当我们在主模块中使用\
  \ `require` 时会发生什么。\n* `require()` 函数接受文件路径作为参数来查找另一个模块。\n\n![Image](img/Image00281.jpg)\n\
  \n* 如果你尝试运行上述代码，它将抛出一个 `模块未找到` 的错误\U0001F914。\n\n![Image](img/Image00282.jpg)\n\n\
  * 但为什么呢？\n* 记住我说过每个模块都被 `IIFE` 包裹，所以当我们 require 一个模块时，我们实际上获取的是 `IIFE`，而不是模块的代码\U0001F62E\
  。让我们可视化它。\n\n![Image](img/Image00283.jpg)\n\n\n\n\n\n### CommonJS 模块系统的工作原理\n\n\
  正如我们所看到的，蓝色内容实际上就是 `require()` 所做的事情。因此，它是一个包装函数，其中的所有变量和函数都是局部作用域的。这就是为什么我们无法执行\
  \ `greet()` 函数并得到错误的原因。\n\n但那么我们是如何让它工作的呢\U0001F928？\n\n这就是我们传递给 IFEE 的 `arguments`\
  \ 发挥作用的地方。\n\n如果我们想要使用 `greet()` 函数，那么当我们在另一个模块中 require 它时，需要以某种方式将其从 IFEE 的作用域中取出。\n\
  \nNode.js 的 IFEE 通过参数为我们提供了一个 `module` 对象，并且在该 `module` 对象上有一个 `exports` 键（参见图示，IFEE\
  \ 的第三个参数）。\n\n因此，如果我使用 `module.exports` 并向其添加属性，那么当我们在另一个模块中 require 它时，它就能访问到这些属性。让我们可视化一下，因为这样更容易理解。\n\
  \n![Image](img/Image00284.jpg)\n\n从图中我们可以看到，`file1.js` 的包装器返回了 `module.exports`\
  \ 对象，并且我们已经将 `greet()` 函数附加到了 `module.exports` 对象上。\n\n现在，让我们看看在 `main.js` 中 require\
  \ 这个模块（`file1.js`）时发生了什么。\n\n![Image](img/Image00285.jpg)\n\n根据可视化，我们可以看到，如果我们提取从\
  \ IFEE 返回的任何内容，那么我们就可以通过 `module.exports` 访问 `greet` 函数，因为 `module.exports` 就是 IFEE\
  \ 返回的内容。这里我们从 IFEE 返回了内容，但没有将其存储在一个变量中以便使用。\n\n![Image](img/Image00286.jpg)\n\n\
  最后，我们可以看到，我们从 `module.exports` 返回的内容实际上被存储在一个名为 `file1_stuff` 的变量中。因为 `module.exports`\
  \ 指向 `greet` 函数，所以 `file1_stuff` 也将指向 `greet` 函数\U0001F601。\n\n朋友们，这就是 CommonJS\
  \ 模块系统在底层的工作原理！\n\n同样地，让我们也完成对 `file2.js` 的可视化\U0001F605。\n\n![Image](img/Image00287.jpg)\n\
  ![Image](img/Image00288.jpg)\n![Image](img/Image00289.jpg)\n\n我们对 `file2.js` 也做了完全相同的事情并进行了可视化。你可以看到，从文件中导出的任何内容都可以按你的意愿重命名。\n\
  \n在结束本章之前，让我告诉你一件事：`exports`（IFEE 的第一个参数）和 `module.exports` 指向同一个地方\U0001F605。\n\
  \n`exports = module.exports`\n\n因此，你可以直接使用 `exports` 关键字，而不必每次都写 `module.exports`（只需向\
  \ `exports` 对象添加键值对，不要将其重新赋值为全新的内容\U0001F605）。\n\n**这样做：** `exports.add = add`，`exports.greet\
  \ = greet`；\n\n**不要这样做：** `exports = null` 或 `exports = add` 或 `exports = greet`（如果你这样做，将会破坏默认模块系统的行为）；\n\
  \n> 最后，ES6+ 模块系统是一个真正的模块系统，它不遵循上述机制，而是原生地解析文件内容并使其可用，无需包装。\n\n```\nThat is all from\
  \ my end friends, I hope you enjoyed learning as much as I enjoyed writing this\
  \ book. I will try to add content to this book in future editions as well. All future\
  \ updates will free who has access to the first edition\U0001F60A.\n```\n\n***\n\
