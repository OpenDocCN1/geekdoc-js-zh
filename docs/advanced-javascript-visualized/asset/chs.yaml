  \n* 在 `class` 中，我们应该记住 `constructor` 方法位于其原型对象上。因此，每当我们尝试使用 `new` 关键字执行类时，都会使用原型对象中的这个\
  \ `constructor` 方法（`class` 是函数的语法糖，而函数总是有原型对象）。\n\n* 看图示，我们正在执行 `ArtistCreator`\
  \ 类的 `constructor`。\n\n![Image](img/Image00090.jpg)\n\n这里，`this` 关键字将指向由 `new` 关键字创建的新对象。\n\
  \n![Image](img/Image00091.jpg)\n\n根据下图，我们发现使用 `class` 时，我们添加了一个用于创建新对象的函数体，并将其命名为\
