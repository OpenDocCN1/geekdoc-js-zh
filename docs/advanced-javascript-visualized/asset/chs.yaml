  。\n\n* 我们称之为**原型链**，因为我们实际上是在用其他对象的原型属性（主要是函数构造函数或类的原型对象）来扩展 `__proto__`。\n\n![Image](img/Image00105.jpg)\n\
  \n```\n我知道这背后的机制太疯狂了，但这就是你需要知道的一切。\n```\n\n在结束本章之前，我们将看看 JavaScript 本身是如何使用上述机制的。\n\
  \n![Image](img/Image00106.jpg)\n\n* 如我们所见，`String` 是一个函数构造函数，它有一个原型和 `__proto__`\
  \ 对象可供我们使用。原型对象本身也有 `__proto__` 属性。\n\n\n\n\n\n* 我们在 JavaScript 中定义的每个字符串实际上都是由这个\
  \ `String` 构造函数生成的。这就是为什么你可以通过指向该原型对象（`String.prototype`）的 `__proto__` 引用来访问它的所有字符串方法。\n\
  \n![Image](img/Image00107.jpg)\n\n* 每个 JavaScript 对象实际上都源自于一个 `Object`（注意大写字母 'O'）。这是我们原型链的终点（稍后会看到）。\n\
  \n* `Object` 本身有一个原型和可用的 `__proto__` 属性。\n\n* 原型对象包含诸如 `hasOwnProperty()`、`toString()`\
  \ 等方法，这些方法你可能在日常代码中使用过。\n\n* 让我们看看 `String` 和 `Object` 之间是如何相互关联的。\n\n![Image](img/Image00108.jpg)\n\
  \n* 如你所见，`String` 的 `__proto__` 指向全局 `Object` 的原型。另外，全局 `Object` 的 `__proto__` 对象拥有\
  \ `call()`、`bind()`、`apply()` 和其他函数，但 `Object` 的 `__proto__` 的 `__proto__` 是 `this.prototype`。而最后一个\
  \ `Object` 也是一个函数构造函数，因此它也有原型对象。这里，原型的 `__proto__` 是 `null`。主要原因是 `null`，因为我们的 `__proto__`\
