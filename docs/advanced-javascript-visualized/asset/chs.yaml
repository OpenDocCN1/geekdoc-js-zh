  \ 类的执行很容易理解。现在让我们看看执行下面这行时会发生什么\U0001F928。\n\n![Image](img/Image00093.jpg)\n![Image](img/Image00094.jpg)\n\
  \n注意这里，有两个主要部分：\n1. `extends` 关键字\n2. `constructor` 内部的 `super` 关键字。\n\n#### extends\n\
  \n* `extends` 关键字在幕后将当前类（这里是我们例子中的 `Entrepreneur`）的 `__proto__` 引用设置为父类的构造函数（这里是我们例子中的\
  \ `ArtistCreator.prototype.constructor`）。\n\n* 根据图示，我们可以看到 `Entrepreneur.__proto__\
  \ = ArtistCreator.prototype.constructor`。\n\n#### super\n\n* `super` 关键字发送一个命令，调用\
  \ `Entrepreneur.__proto__` 上可用的方法。这里它指向父类（`ArtistCreator.prototype.constructor`）的\
  \ `constructor`。\n\n* 另外，`super()` 调用内部的 `this` 关键字也会创建一个空对象。让我们继续可视化。\n\n![Image](img/Image00095.jpg)\n\
  ![Image](img/Image00096.jpg)\n![Image](img/Image00097.jpg)\n![Image](img/Image00098.jpg)\n\
  \n* 执行完 `super()` 调用后，我们回到当前类（`Entrepreneur`）的 `constructor` 调用中。\n\n* 在 `Entrepreneur`\
  \ 的原型对象中，我们有它自己的 `constructor` 的引用，接下来我们将执行它。\n\n![Image](img/Image00099.jpg)\n\n\
  * 在 `Entrepreneur` 的 `constructor` 函数体内，我们向新创建的对象添加了另一个属性。\n\n![Image](img/Image00100.jpg)\n\
  ![Image](img/Image00101.jpg)\n\n现在，最后一点是新创建对象的 `__proto__` 将引用 `Entrepreneur.prototype`\
  \ 对象。见下图。\n\n![Image](img/Image00102.jpg)\n\n所以，长话短说。以下是使用 `new` 关键字调用 `Entrepreneur`\
  \ 类时逐步发生的情况：\n\n1. 从 `super()` 调用中创建一个空对象，`this` 关键字将指向我们新创建的对象。\n2. 从 `super()`\
  \ 调用中添加所有属性（参见图示/代码）。\n3. 新创建对象的 `__proto__` 指向父类的原型对象（这里是 `ArtistCreator.prototype`）。\n\
  4. 重新进入 `Entrepreneur` 的 `constructor` 后，我们向新创建的对象添加了另一个属性。\n5. 现在，因为我们在 `Entrepreneur`\
  \ 类内部，我们实际上将新创建对象的 `__proto__` 更新为 `Entrepreneur.prototype` 对象。\n6. 但这样我们就失去了父类函数的功能。因此，`extends`\
  \ 关键字帮助我们设置了新创建对象的 `__proto__` 的 `__proto__` 属性，指向 `ArtistCreator.prototype` 对象。（可以理解为\
  \ `this.prototype.__proto__ = ArtistCreator.prototype`）\n7. 最后，我们将对象返回给全局内存，并将其存储在一个名为\
  \ `entrepreneur1` 的变量中。\n8. 如果你仍然困惑，请慢慢查看图示，并再次阅读上述 7 个步骤\U0001F603。\n\n![Image](img/Image00103.jpg)\n\
