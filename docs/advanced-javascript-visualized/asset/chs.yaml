  ![Image](img/Image00085.jpg)\n\n### 我们实现了什么\U0001F914\n\n> 我们从之前的例子中学到了一个重要的东西。我们实际上能够创建动态对象，并重用其他对象和函数的现有功能（不要称之为继承\U0001F605\
