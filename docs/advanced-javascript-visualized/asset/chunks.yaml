    So in short, JavaScript will execute all synchronous code straight forward and
    all async operations are just delegated for later execution. However, All function
    references are still stored on global memory space, they are not copied to the
    task/job queue.


    ## Introduction to Event Loop


    ```

    The event loop is a simple while loop, which keeps tracks that where any work
    is pending in queue/s to be finished or not with continuously checking that whether
    callstack is ready for taking the work from the queue/s or not.

    ```


    ![Image](Image00124.jpg)


    * Now because currently our `callstack` is empty and the queue has pending tasks
    to be finished, the event loop will find it. Note that `delayedTimer` actually
    made available to `task queue` after 2000 milliseconds (which we provided time,
    after how much time it’ll become part of task queue actually!).

    * The event loop will have task only checking whether the work on queues are pending
    or not and which are those tasks.

    * The function `delayedTimer` will be pushed to the `callstack` by the environment
    and become part of normal execution😀.


    ![Image](Image00125.jpg)

    ![Image](Image00126.jpg)

    ![Image](Image00127.jpg)

    ![Image](Image00128.jpg)


    There you have my friends, this is how async code is executed in JavaScript. There
    are little more to explore still: Promises and Async Await.


    In this chapter, I will only explain promises, because async-await requires little
    more knowledge that we will discuss in upcoming chapters.


    ## Promise - An Aesthetic Async Task Resolver


    **MDN**


    ```

    The Promise object represents the eventual completion (or failure) of an asynchronous
    operation and its resulting value.

    ```


    * Of course, it’s a short and simple definition but also not explaining what the
    hell actually happening under the hood🤨!

    * Let me tell unwill the promise more simply for you with a visual example.

    * In the above example, I made a simple `sleep` function for simulating a synchronous
    blocking mechanism for given second/s. we will use this for our next example too.

    * There are 2 things different things available to us, we have a `Promise` function
    constructor (notice capital letter) and `promise object`.

    * The `Promise` is a function constructor that will create a `promise object`
    when we use a `new` keyword in front of the `Promise` constructor.

    * let’s start with an example.


    ![Image](Image00129.jpg)


    * Now in the above code, as you can see we will be going to store the returned
    object of the `Promise` function constructor in the `promiseObj` variable.

    * Note here we have made conditional `resolve` and `reject` calls based on whether
    `num > 5` or not.

    * It’s visualization time😄.


    ![Image](Image00130.jpg)

    ![Image](Image00131.jpg)

    ![Image](Image00132.jpg)


    Let’s see our code again so we don’t lose track of that code in our minds.


    ![Image](Image00133.jpg)


    * As we can see, we have the `Promise` function constructor which will be used
    to create a promise object. but before we visualize everything, let me tell you
    what we will get back after executing that `Promise` function constructor.

    * Let’s see which are properties and internal properties are given to us for the
    `promise object`.


    ![Image](Image00134.jpg)


    * As per the diagram, we can see that the promise object has the main 3 key-value
    pairs (internal and hidden properties actually).

