- fmt: "\nPutting requests in non-blocking mode via kernel's feature and handling\
    \ stuff through Epoll data structure will give amazing concurrency without blocking\
    \ main javascript thread as well as without blocking poll queue and spinning new\
    \ threads. This is the reason why nodejs is so popular and amazing.\n\n![Image](Image00272.jpg)\n\
    \n* In our case, we have 2 GET API calls. We will process them through epoll as\
    \ we just discussed and the result is given back to the poll queue. Let’s finish\
    \ our visualization of the remaining finished 2 API calls.\n\n![Image](Image00273.jpg)\n\
    ![Image](Image00274.jpg)\n![Image](Image00275.jpg)\n\nNow, our all execution has\
    \ finished as above and all queue became empty so our program will exit. That’s\
    \ all my friends this is how node actually works\U0001F60E. you learned complex\
    \ node architecture with the proper mental model\U0001F601.\n\n```\nNote: Here\
    \ I have assumed that file1.txt read operation done before file2.txt and the same\
    \ way the first API call finished before the second API call. Which operation\
    \ out of 2 files read will complete before it depends on your OS and processer.\
    \ The same goes for API calls. \n```\n\nNow let’s talk about some confusing stuff\
    \ like `multi-threading`, `worker threads`, and `multi-processing` from the node’s\
    \ perspective.\n\n## Multi-processing\n\n* We know, when we start the node program\
    \ we essentially start the node process in which we will have 1 instance of `v8`,\
    \ 1 instance of event loop via `libUV`, and node APIs core layer.\n* Now, when\
    \ we use `child_process`, we create a new separate process from the parent process\
    \ (from our node process). we can do anything in the newly created process.\n\
    * The important thing to note here, each newly created process will have its own\
    \ 1 instance of `v8`, 1 instance of event loop via `libUV` as well. That is the\
    \ reason why we can parse javascript inside `child_process` as well if we want.\n\
    * If you are a node developer then you most likely know the module called `Cluster`,\
    \ which is fundamentally used to create a fork/s of our running node process and\
    \ each process will be put in the logical core of your processor!\n\nLet’s visualize\
