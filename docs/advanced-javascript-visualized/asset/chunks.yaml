    * The second difference is, a generator function is not put in callstack, but
    it’s store in memory and put directly on the thread of execution😮!

    * The `yield` is a special type of keyword that does a lot of hidden stuff behind
    the scene. Also, it is completely different from the `return` keyword.


    ## return


    * `return` keyword immediately stops the function execution and literally allows
    you to return any value from a function.

    * The `return` keyword is mostly used to do some stuff and the result of the operation
    is usually return to the outer scope.


    ## yield


    * This is a special type of keyword and used inside the generator function.

    * `yield` keyword will not stop the execution of the generator function but it
    will suspend the execution (pause the execution) 🤨. So, we can later use the same
    suspended execution context.

    * Now, when we suspend function execution, we need some kind of mechanism to keep
    track of where exactly our execution was suspended. So, in the next iteration,
    we will able to start execution again from where it is suspended (paused).

    * We have a hidden/internal property called `[[GeneratorLocation]]` available
    on the returned iterator from the generator function.

    * `yield` keyword will suspend the execution and store the location where function
    execution is suspended in `[[GeneratorLocation]]`.


    ![Image](Image00201.jpg)


    * The reason we have `[[GeneratorLocation]]` at `VM36: 3`, because you can see
    we have called `returnNextElement.next()` 2 times. So, a 2-time value was yielded
    and the function was paused and continued. So, in the next iteration, we will
    start our execution from the 3rd line (rather at the 3rd position of yielded value).

    * If you click on `VM36:3` (`VM36` is randomly generated by the console of the
    browser), we will able to see where our last suspension of function is.


    ![Image](Image00202.jpg)


    Now, what if we have some other stuff inside the generator function? like `console.log()`
    or any other operation!


    ![Image](Image00203.jpg)


    * As you can see, it works exactly like before but now we have `[[GeneratorLocation]]`
    relative to our function definition. This means it is literally keeping track
    of line number where a function is paused!.

    * Now if we click on that `VM107:4`, we can see below where it’s paused. Again
    because we have used `returnNextElement.next()` 2 times, that is why we have paused
    after at second yielded value.


    ![Image](Image00204.jpg)


    * We still haven’t seen what actually inside the `element1` and `element2` variables😅.
    Let’s see.


    ![Image](Image00205.jpg)


    * Unlike our previous custom generator where we returned values directly, here
    we are returning an object with some key-value pairs.

    * We have `value` property itself and `done` property.

    * The `value` holds the whatever was yielded and `done` tells us is there anything
    remained of execution of paused execution function!

    * But, wait we don’t have closure here then where the hell this object is retrieved!
    let’s see.


    ![Image](Image00206.jpg)


    * As you can see we are storing yielded values and keeping them inside hidden
    property called `[[scopes]]`.

    * Now what if we run `returnNextElement.next()` one more time and see the result.


    ![Image](Image00207.jpg)


    * Now again what if we run `returnNextElement.next()` one more time and see the
    result.


    ![Image](Image00208.jpg)


    * As you can see that when we finished all yielding of values, we closed (finished)
    the function execution, and the `done` property became `true`.

    * So, long story short generators allow us to create custom iterators and we can
    use the `next()` method on our iterable to retrieve yielded values.

    * We need to explore one more thing in order to get a full idea of generators
    and iterators. Let’s look at the below example.


    ![Image](Image00209.jpg)


    The common thinking would be, we will yield `4` in the first `next()` call and
    in the second call of `next()` we will have the `newNum` variable to be `4`. So,
    the second `next()` call should yield us to `9` (`5 + 4 == 9`). Unfortunately,
