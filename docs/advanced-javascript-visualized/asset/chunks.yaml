    ```\n\n## What node is not?\n\n1.  It’s not a programming language.\n2.  It’s\
    \ not a framework/tool for server-side coding (Not like Php).\n3.  JavaScript\
    \ is a programming language, **the node is not** .\n\n## What node actually is?\n\
    \n1.  It’s a low-level c++ delegated code made available to us by making JavaScript\
    \ APIs (AKA JavaScipt version of a c++ features(**sometimes even “c” bound c++\
    \ code** )).\n2.  **It’s a literally C++ program** that takes JavaScript code\
    \ as a string and does all the work!\n3.  Node is a single c++ program, which\
    \ relies on a lot of other c++ libraries like **libUV, V8, c-ares, OpenSSL,**\
    \ etc.\n4.  We call is nodejs because c++ written features are made available\
    \ to us by exposing equivalent JavaScript APIs. so, Node(C++ features) + JavaScript\
    \ == NodeJS\U0001F60E.\n\n```\nNodeJS's core architecture is way more complicated\
    \ than a browser or any other environment. Not only that, on the internet 90%\
    \ of information related to nodejs are partially false or misguided\U0001F62A\
    .\n```\n\n*   I will try to go very gradually on the core architecture and will\
    \ split pieces for you, such that you don’t have to go anywhere to understand\
    \ anymore. Let’s start with our basic version of the javascript diagram.\n\n![Image](Image00233.jpg)\n\
    \n*   As we can see we have a similar model that we know, queues, callstack, and\
    \ our memory space.\n*   Because we are going to perform a lot of system operations\
    \ on our computer, the node actually uses a lot of third-party c/c++ libraries\
    \ which does all kinds of stuff.\n*   There are major 2 components that we should\
    \ understand first.\n\n## V8 engine\n\n*   The V8 engine has a fundamental 1 job\
    \ to perform which is to parse the JavaScript and convert it into **optimized\
    \ machine code** .\n*   However V8 just not convert our javascript code into machine\
    \ code, but it does much more than that. It provides the default version of the\
    \ event loop(wait what\U0001F928).\n*   The default event loop given to us by\
    \ v8 can be extended or replaced by javascript runtime creators.\n*   Node actually\
    \ does not use the default v8’s event loop. Node uses the event loop of LibUV’s\
    \ instead of v8!\n*   Because v8 has a default event loop, the barebone code of\
    \ v8’s event loops queue remains there and **Promise** uses that queue instead\
    \ of any other queues.\n*   I have removed the **‘Task Queue’** of v8\\. The main\
    \ reason because the node doesn’t use it or even care about it. Node uses a little\
    \ different approach to tackle asynchronous **timers** .\n*   There is `process.nextTick()`\
    \ which is provided by node and it always runs ahead of every single queue by\
    \ design.\n\n![Image](Image00234.jpg)\n\n## LibUV\n\n*   This library is the heart\
    \ of the node. LibUV does not just provide an event loop but it has a really good\
    \ mechanism to handle a lot of I/O operations.\n*   The I/O operation could be\
    \ anything like a lot of connection requests, sockets, File systems, etc.\n* \
    \  LibUV provides or sometimes uses a lot of queues which we are going to learn\
    \ soon.\n*   Let’s just see first our mental model diagram with **v8 and libUV**\
    \ combined\U0001F604.\n\n![Image](Image00235.jpg)\n\n*   I left out some space\
    \ above the blue-colored box intentionally and I will come to that.\n*   As from\
