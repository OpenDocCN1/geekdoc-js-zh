    \n## What we have achieved then\U0001F914\n\n> We have learned one big important\
    \ stuff from the previous example. We are literally able to create dynamic objects\
    \ and reuse the existing functionality of other objects and function (don’t call\
    \ this inheritance \U0001F605, here we are composing stuff not inheriting).\n\n\
    * Now, how about if ES6+ provides syntactic sugar of above\U0001F928. we actually\
    \ do and have simpler syntax to achieve the same thing as above.\n\n* Here, working\
