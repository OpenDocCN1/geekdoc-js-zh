    # 4


    # Asynchronous Execution


    ```

    JavaScript (without environment) by default is single-threaded (one task at a
    time) & synchronous (Line by line & top to bottom execution). If you think this
    is pretty bad because we can''t do multiple tasks at a time and we are blocking
    our execution until the current line finishes its execution. So, JavaScript needs
    a way to tackle this. Let''s see how.

    ```


    ## JavaScript alone is not enough!


    *   When you play cricket/football, a single most powerful player is not enough
    to win the entire match. you need to play as a team and each player’s contribution
    matters.


    *   Same way JavaScript alone is not enough, we need extra players or rather a
    team.


    *   That is where the extra “environment” comes and helps JavaScript.


    *   There is 2 famous JavaScript environment we use a lot.


    1) Browser


    2) NodeJS


    *   In this chapter I will explain only the browser environment, we will understand
    the nodejs environment in a later chapter.


    *   We have seen our “mental model” in chapter 1, but I didn’t tell you that it
    was incomplete because I didn’t want you to confuse there. It’s time to show the
    big “mental model” with the environment surrounding.


    *   Brower environment is so big which include HTML/CSS parsers, console, network
    monitoring, storages(local, Indexeddb, web SQL, etc), performance tool, etc. we
    only going to focus on how asynchronous part handle through something called “Queues”
    & “Event Loop”.


    ## JavaScript is synchronous! (Don’t Forget)


    *   Timing and resource utilization are always important in every single app or
    the real world.


    *   JavaScript is synchronous and it’s so important that a lot of people forget
    that JavaScript is just a scripting language that is meant for just making webpage
    dynamic in its early days.


    *   Ultimately JavaScript never builds for servers or complex rendering that we
    do today.


    *   But some people wanted to make javascript more flexible and powerful without
    breaking the origin of the language mindset.


    *   In 2004, Google released Gmap and it was built with fully JavaScript on the
    browser and stunned the world what potential JavaScript language has.


    *   Without doing history talk more, let’s come to the actual implementation of
    an asynchronous environment.


    *   You will see the new **Queues** part will be drawn, that is where our journey
    of asynchronous starts😁.


    *   Remember, **‘Queues’** are implemented by the browser so sometimes you see
    different output/results than the actual desired one from different browsers,
    but we will discuss what is right and what the desired approach should be. let’s
    have a sneak peek at our new mental modal!


    *   Don’t try to understand deeply, we will go through it in details soon.


    ![Image](Image00114.jpg)


    Current Extended Mental Model


    ## Callbacks: functions that are called back!


    *   Before we move further it’s important to talk about callback functions a little
    bit.


    *   Callbacks are simple functions that are invoked whenever they are called back(AKA
    whenever a particular task has been finished after that).


    *   There are 2 types of callbacks.


    1) Sync Callback/s


    2) Async Callback/s


    ### 1) Sync Callbacks


    *   Sync callbacks are called on iterators which is easy and quick to execute
    (fast operations)


    *   An example of a sync callback is given below.


    ![Image](Image00115.jpg)


    Sync callback


    ### 2) Async Callbacks


    *   Async callbacks are time-consuming tasks or error pruning functions(might
    finish a task or won’t finish it at all kind of).


    *   An example of async callbacks is given below!


    *   Don’t try to understand deeply, just an example😅. will understand shortly.


    ![Image](Image00116.jpg)


    Async callback


    *   We have extended our mental model of course, but one thing to note that our
    extended mental model is not just JavaScript. It’s JavaScript + browser APIs(Those
    queues’ function are part of the browser environment, aka setTimeout,setInterval,
    etc ).


    *   But there is one twist here, promises are more complicated more than that,
    they are part of javascript and browser both. will see that in the mental model.


    *   Currently, let’s see a simpler version mental model with queues.


    ![Image](Image00117.jpg)


    Mental Model With Queues


    ```

    Queue: It''s a simple data structure where the first in first out rule is followed(aka,
    whoever comes first will go first). Just like a movie ticket purchase line.

    ```


    ### Task Queue


    *   first of all weird thing is, task queue is actually not a queue, it is a **set**
    (in Cpp world it’s struct).


    *   Tasks are added in task queue are picked and removed it, not like a queue
    that it’s dequeued. To keep it simple let’s treat it as a normal queue(most javascript
    developers do that and will do the same)😁.


    *   **Macro Task** , is a term used sometimes for task queue.


    ### Job Queue


    *   The job queue is an actual queue where tasks are queued and dequeued. it’s
    a real queue.


    *   **Micro Task** , is a term used sometimes for job queue and but it’s called
    Job queue in ES6+ specifications.


    ## Time to understand stuff with an example!


    ![Image](Image00118.jpg)


    *   There is a sleep function which I simulated that block the function for given
    seconds. Let’s see our mental model of it, how it’s going to be executed!


    *   **setTimeout is a browser feature and it’s not a part of regular javascript.
    Waiting for the given time period and then giving the callback function back to
    the task queue is done by the browser.**


    ![Image](Image00119.jpg)


    *   Now let’s see what will happen when we finished executing the sleep function
    and try to execute it further.


    ![Image](Image00120.jpg)


    *   Also, note that we have **delayedTimer** function defined but we never called
    it. so, it’s still not part of callstack and also it’s passed as an argument to
    setTimeout.


    ![Image](Image00121.jpg)


