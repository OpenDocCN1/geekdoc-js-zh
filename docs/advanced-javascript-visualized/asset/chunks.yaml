    # JavaScript Execution Mental Model


    One thing to note, I will not draw a global thread of execution diagram but it’s
    always when we start executing our javascript code.


    Let’s see our `mental model` again how it applies to the current situation.


    ![Image](Image00003.jpg)

    *Current JavaScript Mental Model*


    Let’s further understand the below code:


    ![Image](Image00004.jpg)

    *Example 1.1*


    *   As we can see, we are declaring function (a special type of object in js)
    and giving the label `addGoal`.

    *   Note that this function declaration has 1 parameter called `count` which means
    `count` is a label for future memory space address which will be going to consume
    by this function later.

    *   Inside function definition whatever we are doing is noting that much important
    right now (will see detail when we call it).

    *   After function definition, we are actually declaring variable `storedEvaluatedValue`
    in global scope which will be return or evaluated value from `addGoal` function
    call.

    *   In case if you didn’t notice then, we are not leaving global scope or global
    thread of execution here.


    It’s time to see our `mental model` again.


    ![Image](Image00005.jpg)

    *Current JavaScript Mental Model*


    Let’s continue our understanding of code:


    *   Here is the important part comes, we are calling `addGoal()` by putting braces
    around it. As soon as we did that we create a brand new execution context (or
    local memory space for that function).

    *   Just to know that making the execution context doesn’t happen magically in
    JavaScript. Actually, when we call a function instead of putting that function
    directly into Execution Thread, we first put that function into call stack first.

    *   Remember, `stack` data structure means Last In First Out, which means if we
    put a function call on the call stack, as long as we don’t have extra function
    calls immediately afterward, we take the topmost function of the call stack &
    put it into the execution thread.


    It’s time for our `mental model` again.


    ![Image](Image00006.jpg)

    *Current JavaScript Mental Model*


    Before we move further, we need to understand the local scope as well and what
    is happening inside the local scope as well.


    ![Image](Image00007.jpg)

    *Mental Model of local function and its scope*


    *   As you can see in function execution in execution thread, does create local
    memory & we are manipulating local variable called `innerGoal` inside that call.

    *   But one thing to note, parameter `count` is also part of local memory, which
    means the parameter becomes argument only when we run function & it occupies space
    in memory only when it is used. `Placeholder` or so-called `parameters` do not
    occupy space.

    *   After the function body about to finish execution, we are returning the `innerGoal`
    variable. That is to say, the value of it has the label `innerGoal`.

    *   When we exit out of function execution, the JavaScript engine destroys the
    local function execution context. if a function returns a value then that value
    will become an evaluated value for that function otherwise it returns `undefined`
    by default.


