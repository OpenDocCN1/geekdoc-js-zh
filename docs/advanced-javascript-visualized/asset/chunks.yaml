    its functionality and also we can utilize already declared **commonFunctionalities.**
    See the below diagram we did the same for the **artist2** object as well(go through
    the mental model on your own just like we have shown above).


    ![Image](Image00045.jpg)


    *   Alright, we have created functionality that allows us to create objects whenever
    we need and reuse some of the existing functionalities as well. Now, what if javascript
    has this kind of feature available to us😋.


    *   Gladly, we do have, and that what we are going to do next. see below example
    and will understand shortly.


    ![Image](Image00046.jpg)


    *   In case you have forgotten, the function can have a prototype and __proto__
    properties available by default. same way **ArtistCreator** will also have these
    properties available to them. Let me show that diagram again. By the way, a **prototype**
    is an object and we can add any key-value pairs to it.


    ![Image](Image00047.jpg)


    *   Now what to add to that prototype object is up to us. In our example, we added
    two functions **isHuman** and **isCuriuos.**


    ![Image](Image00048.jpg)


