  trans: "\n\n*   `create` 是 `Object` 的一个方法，它有以下基本任务。\n    1.  创建一个空对象。\n    2.  由于每个对象都有\
    \ `__proto__` 属性，在创建空对象后，我们传递给 `create` 方法的任何参数，都会直接通过 `__proto__` 提供给新创建的对象。让我们看看具体是如何实现的。\n\
    \    ![Image](img/Image00036.jpg)\n    ![Image](img/Image00037.jpg)\n*   我们正在执行\
    \ `ArtistCreator` 函数，它调用了 `Object.create()` 方法，并将全局存储的 `commonFunctionality` 对象作为参数传入。\n\
    \    ![Image](img/Image00038.jpg)\n*   `Object.create()` 不仅创建了一个新的空对象，还为这个新对象的\
    \ `__proto__` 添加了一个指向全局存储的 `commonFunctionalities` 对象的引用**。** 因此，我们传递给 `create()`\
    \ 的第一个参数的所有内容，都会通过新创建对象的 `__proto__` 属性可用。让我们完成可视化。\n    ![Image](img/Image00039.jpg)\n\
    \    ![Image](img/Image00040.jpg)\n    ![Image](img/Image00041.jpg)\n    ![Image](img/Image00042.jpg)\n\
    \    ![Image](img/Image00043.jpg)\n*   如你所见，我们可以通过函数创建新对象，而且还可以反复重用这个函数。\n   \
    \ ![Image](img/Image00044.jpg)\n*   如果我们再次运行同一个函数，如上所示，我们仍然可以重用它的功能，并且还可以利用已经声明的\
    \ `commonFunctionalities`。请看下面的图示，我们对 `artist2` 对象也做了同样的操作（请像上面展示的那样，自己走一遍心智模型）。\n\
    \    ![Image](img/Image00045.jpg)\n*   好了，我们已经创建了一个功能，允许我们在需要时创建对象，并且可以重用一些现有的功能。现在，如果\
    \ JavaScript 本身就提供了这种特性，那该多好啊\U0001F60B。\n*   幸运的是，它确实有，而这正是我们接下来要做的。请看下面的示例，我们很快就会理解。\n\
    \    ![Image](img/Image00046.jpg)\n*   如果你忘记了，函数默认拥有 `prototype` 和 `__proto__`\
    \ 属性。同样地，`ArtistCreator` 也会拥有这些属性。让我再次展示那张图。顺便提一下，`prototype` 是一个对象，我们可以向它添加任意键值对。\n\
    \    ![Image](img/Image00047.jpg)\n*   现在，向 `prototype` 对象中添加什么内容由我们决定。在我们的示例中，我们添加了两个函数：`isHuman`\
    \ 和 `isCuriuos`。\n    ![Image](img/Image00048.jpg)\n*   注意，我们的示例现在也使用了 `new` 关键字。它在幕后做了大量的自动化工作。让我们看看它的图示是怎样的。\n\
    \    ![Image](img/Image00049.jpg)\n*   让我们执行下面这行代码，注意函数调用前面的 `new` 关键字。\n    ![Image](img/Image00050.jpg)\n\
    \n`new` 关键字主要做两件事。\n\n1.  它会创建一个新的**空对象**，并且这个新创建的对象会获得 `this` 引用。这意味着在函数执行过程中，`this`\
    \ 将指向由 `new` 关键字创建的新对象。\n2.  此外，函数的 `prototype` 对象（在我们的示例中是 `ArtistCreator` 函数）中的所有内容，都会指向新创建对象的\
    \ `__proto__`（当然，我们来可视化一下\U0001F605）。\n\n![Image](img/Image00051.jpg)\n\n*   每个函数对象都有两部分，我们知道，一部分是函数体，另一部分是对象部分。\n\
    *   在下面的图示中，你可以看到 `ArtistCreator` 的对象部分包含一个 `prototype` 对象和一个 `__proto__` 对象。\n\
    *   在我们的代码中，我们向 `prototype` 对象添加了两个函数：`isHuman` 和 `isCurious`。\n*   每个对象默认都拥有\
    \ `__proto__` 属性。这就是为什么 `prototype` 对象也拥有 `__proto__` 属性（这个属性指向哪里尚不清楚，但让我们先专注于代码的执行）。\n\
    \    ![Image](img/Image00052.jpg)\n*   函数的 `prototype` 对象指向新创建对象的 `__proto__`\
    \ 属性。\n*   现在，我们知道 `new` 关键字帮助我们建立了 `prototype` 对象到新创建对象的 `__proto__` 属性的引用。请看下面。\n\
    *   还有一点，函数执行已经结束，但函数的对象部分仍然保留在全局内存中。这里我们并不是复制对象，而只是设置引用。\n    ![Image](img/Image00053.jpg)\n\
    \    ![Image](img/Image00054.jpg)\n*   永远不要忘记，函数执行已经完成，但该函数的内存并不会被清除。这就是为什么带有\
    \ `prototype` 对象的 `ArtistCreator` 函数会保留在内存中。\n    ![Image](img/Image00055.jpg)\n\
    *   就是这样，我们现在能够通过函数创建对象，并且一些公共功能也可以通过 `prototype` 对象获得。\n*   现在，`artist2` 也是同样的道理，所以我就不再画那部分了（现在你可以自己可视化\U0001F60E\
    ）。\n    ![Image](img/Image00056.jpg)\n    ![Image](img/Image00057.jpg)\n*   我们使用函数创建对象，因此我们称之为“函数构造函数”。所以，这里的\
    \ `ArtistCreator` 就是构造函数。\n*   在结束上面的示例之前，让我们在浏览器控制台中输出结果。\n    ![Image](img/Image00058.jpg)\n\
    *   到目前为止一切顺利，但 ES6+ 为我们提供了新的语法糖，它可以实现与上面代码相同的功能。它只是试图模仿并简化语法。在底层，工作原理保持不变。让我们看看上面示例的等效代码。\n\
    \    ![Image](img/Image00059.jpg)\n*   `class` 关键字是在 ES6+ 中引入的，用于模仿我们之前的工作。\n\
    *   并不复杂，只是我们的 `prototype` 方法直接定义在 `class` 内部，而 `constructor` 充当函数体。\n\n> 我们已经学会了如何通过\
    \ `函数构造函数` 创建动态和自定义的对象。那么，如何扩展我们的功能，并利用现有的 `函数构造函数` 来创建另一个 `函数构造函数`，从而帮助我们继承其他特性呢？让我们通过一个示例来看一下*\U0001F601\
    *。首先，我们将采用**非类**版本的示例，然后创建等效的类版本。\n\n![Image](img/Image00060.jpg)\n\n*   如果你不理解上面的代码，不用担心，我们将逐步解释它是如何工作的。上面示例中唯一需要注意的是，我们可以将\
    \ `ArtistCreator` 的 `prototype` 函数继承到我们新创建的 `Entrepreneur` 的 `函数构造函数` 中。让我们开始可视化\U0001F60B\
    。\n    ![Image](img/Image00061.jpg)\n*   我们首先可视化上面这行代码。这将与我们刚刚展示的之前的示例类似。\n  \
    \  ![Image](img/Image00062.jpg)\n    ![Image](img/Image00063.jpg)\n    ![Image](img/Image00064.jpg)\n\
    \    ![Image](img/Image00065.jpg)\n    ![Image](img/Image00066.jpg)\n    ![Image](img/Image00067.jpg)\n\
    *   到目前为止，这与之前示例的可视化相同。现在，让我们看看运行下面代码时会发生什么。\n*   另外，我在这里跳过了第 298 到 303 行的执行，因为我不想让接下来的图示让你感到困惑。实际上，我们将在完成下面高亮行的执行后，再展示第\
    \ 298 到 303 行的图示。\n    ![Image](img/Image00068.jpg)\n*   不要忘记，即使执行结束，`ArtistCreator`\
    \ 的对象部分仍会保留在内存中，当我们再次调用 `ArtistCreator` 时，我们将使用内存中存储的引用，而不是创建它的副本。\n    ![Image](img/Image00069.jpg)\n\
    \    ![Image](img/Image00070.jpg)\n*   我们使用 `call` 关键字调用一个函数，并将 `this` 作为第一个参数传递。\n\
    \n```\ncall() 方法使用给定的 this 值和单独提供的参数来调用一个函数。\n```\n\n*   因为我们在 `Entrepreneur`\
    \ 函数前面使用了 `new` 关键字，所以我们将创建一个新的空对象，并且 `this` 关键字将指向它。然而，`Entrepreneur` 内部使用 `call()`\
    \ 方法调用了 `ArtistCreator`，并传递了新创建的对象（此时 `this` 关键字指向新创建的空对象！）。\n    ![Image](img/Image00071.jpg)\n\
    *   这里我们只是向新创建的对象添加属性。\n    ![Image](img/Image00072.jpg)\n\n"
