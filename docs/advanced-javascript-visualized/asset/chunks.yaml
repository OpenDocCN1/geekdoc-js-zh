    \nThere you have it, my friends, the most complete guide to `__proto__`, `prototype`,\
    \ and object linking\U0001F601. Enjoy the further journey with the next chapters.\n\
    \n***\n\n# Asynchronous Execution\n\nJavaScript (without environment) by default\
    \ is single-threaded (one task at a time) & synchronous (Line by line & top to\
    \ bottom execution). If you think this is pretty bad because we can't do multiple\
    \ tasks at a time and we are blocking our execution until the current line finishes\
    \ its execution. So, JavaScript needs a way to tackle this. Let's see how.\n\n\
    ## JavaScript alone is not enough!\n\n* When you play cricket/football, a single\
    \ most powerful player is not enough to win the entire match. you need to play\
    \ as a team and each player’s contribution matters.\n* Same way JavaScript alone\
    \ is not enough, we need extra players or rather a team.\n* That is where the\
    \ extra “environment” comes and helps JavaScript.\n* There is 2 famous JavaScript\
    \ environment we use a lot:\n    1. Browser\n    2. NodeJS\n\n* In this chapter\
    \ I will explain only the browser environment, we will understand the nodejs environment\
    \ in a later chapter.\n* We have seen our “mental model” in chapter 1, but I didn’t\
    \ tell you that it was incomplete because I didn’t want you to confuse there.\
    \ It’s time to show the big “mental model” with the environment surrounding.\n\
    * Brower environment is so big which include HTML/CSS parsers, console, network\
    \ monitoring, storages (`local`, `Indexeddb`, `web SQL`, etc), performance tool,\
    \ etc. we only going to focus on how asynchronous part handle through something\
    \ called “Queues” & “Event Loop”.\n\n## JavaScript is synchronous! (Don’t Forget)\n\
