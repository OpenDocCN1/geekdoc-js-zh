    is why the prototype object also has __proto__ property as well** (where this
    property will point is unknown, but let’s just focus first on our code execution).


    ![Image](Image00052.jpg)


    *   The **prototype** object of function is referring to the __proto__ property
    of a newly created object.


    *   Now, we know the **new** keyword helps us to set the reference of the prototype
    object to __proto__ property of the newly created object. see below.


    *   One more thing, we have cleared function execution but the object part of
    the function remains in global memory. Here **we are not copying objects** , but
    we are just setting the references.


    ![Image](Image00053.jpg)


    ![Image](Image00054.jpg)


    *   Never forget, function execution has been done, but a memory for that function
    will not wipe out from memory. That is why ArtistCreator function with prototype
