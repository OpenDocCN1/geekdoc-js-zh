    \ constructor. That is the reason why you can access all string methods of it\
    \ via `__proto__` reference which points to this prototype object (`String.prototype`).\n\
    \n![Image](Image00107.jpg)\n\n* Every JavaScript object literally borns from an\
    \ `Object` (notice capital ‘O’). This is the end of our chaining (will see soon).\n\
    \n* The `Object` itself has a prototype and `__proto__` property available to\
    \ it.\n\n* The prototype object has methods like `hasOwnProperty()`, `toString()`\
    \ available which you might have used in your day to day code.\n\n* Let’s see\
    \ how these `String` and `Object` has a connection with one another.\n\n![Image](Image00108.jpg)\n\
    \n* As you can see, `String`’s `__proto__` point to our global `Object`’s prototype.\
    \ One more thing our global `Object`’s `__proto__` object has `call()`, `bind()`,\
    \ `apply()` and other function but `__proto__` of `Object`’s `__proto__` is `this.prototype`.\
    \ And the last `Object` is also a function constructor so the prototype object\
    \ is available to it. Here, `__proto__` of the prototype is `null`. The main reason\
    \ is `null` because here our `__proto__` chain ends\U0001F60E.\n\n* Let’s go through\
    \ other similar objects as well.\n\n![Image](Image00109.jpg)\n![Image](Image00110.jpg)\n\
    ![Image](Image00111.jpg)\n\n`The Function` is a special type of constructor. it’s\
