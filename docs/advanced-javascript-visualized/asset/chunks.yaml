    *   we are executing the ArtistCreator function and it’s executing the Object.create()
    method with our globally stored commonFunctionality object.


    ![Image](Image00038.jpg)


    *   Object.create() not just created a new empty object but also added a __proto__
    reference to our globally stored **commonFunctionalities** object**.** so, whatever
    we passed to the create()’s first argument will available to __proto__ property
    of the newly created object. Let’s finish our visualization.


    ![Image](Image00039.jpg)


    ![Image](Image00040.jpg)


    ![Image](Image00041.jpg)


    ![Image](Image00042.jpg)


    ![Image](Image00043.jpg)


