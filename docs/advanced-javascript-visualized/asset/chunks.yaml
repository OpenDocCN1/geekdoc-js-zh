    ## Step 5: Repeat the loop until the node process gets killed


    It''s time to understand everything combined with an example and will understand
    deeply what happens in each step.


    ![Image](Image00237.jpg)


    > Ignore how the `require() and how the module system works right now and only
    focus on our example. Also, I wrote a javascript code in a way that execution
    of code will have completely different unexpected output than logically shown
    in code.


    ![Image](Image00238.jpg)


    * In our starting, we are reading the content of text files that is `file1.txt`
    and `file2.txt`.

    * `file1.txt` has ‘Hello guys 1’ and `file2.txt` has ‘Hello guys 2’ in it as content.


    ![Image](Image00239.jpg)


    * The next statement is the pretty simple synchronous log.


    ![Image](Image00240.jpg)


    * The next thing, we are using `process.nextTick()` as shown above.


    ![Image](Image00241.jpg)


    * After that, we are calling `setImmediate()` as above.


    ![Image](Image00242.jpg)


    * Then after, we are making 2 HTTP GET API calls and logging simply `statusMessage`
    from the response.


    ![Image](Image00243.jpg)


    * After that, we are just resolving `Promise` and have `then()` call of that resolved
    promise.


    ![Image](Image00244.jpg)


    * At last in our code, we have `setTimeout()` call which has 0 milliseconds timeout.


    It''s time to start our visualization of code and see how code actually works
    under the hood 😎!


    ![Image](Image00245.jpg)


    * Initially, we will complete our all synchronous code which in our case, console
    statement and `Promise` function constructor (note here, not the finished promise
    object, only `Promise` constructor execution).


    ![Image](Image00246.jpg)

    ![Image](Image00247.jpg)


    * Here we are returning a promise object but we are not storing it in any variable,
    so immediately `then()`’s callback is put into Job Queue and the object gets garbage
    collected as it has zero references in memory. let’s see it below!


    ![Image](Image00248.jpg)


    * Working of Promises does not changes in browser or node environment as both
    uses V8 and promises are part of V8 engine itself.


    ![Image](Image00249.jpg)

    ![Image](Image00250.jpg)


    * As you can see, the callback of `then()` is added to the job queue and the promise
    object gets garbage collected. The next thing we did is continued our execution.

    * As node made available `process.nextTick()`, all callback of `process.nextTick()`
    after finishing synchronous execution, we add in one separate queue as shown in
    the figure.

    * So callback of `process.nextTick()` is stored in the queue which is on our topmost
    hierarchy of queues.


    ![Image](Image00251.jpg)


    * We further go through code and store callbacks into their respective queue which
    node environment decided. In the above, we added a timer callback to the timer
    queue.


    ![Image](Image00252.jpg)


    * As we can see above, all the I/O callbacks are in the poll queue. Both files
    read operation and HTTP get API call are part of I/O operation.

    * Internally poll queue used different approaches based on what operation is performed
    on the poll queue (will see soon).


    ![Image](Image00253.jpg)


    * At last, we have `setImmediate()` which will go into the check queue.

    * The poll queue actually starts background work and does not take participation
    in the first iteration (the first iteration of the event loop) of the queues call.
    So, I have made a grey color for that.


    ![Image](Image00254.jpg)


    * Now, let’s start executing our queues. Remember the order for queues which is
    top to bottom and right to left.


    ![Image](Image00255.jpg)

    ![Image](Image00256.jpg)


    The next turn is for our job queue (promises).


    ![Image](Image00257.jpg)

    ![Image](Image00258.jpg)

    ![Image](Image00259.jpg)

    ![Image](Image00260.jpg)


    * Now the next turn is for our timers😃.


    ![Image](Image00261.jpg)

    ![Image](Image00262.jpg)

    ![Image](Image00263.jpg)


    * This time turn is for the poll queue, but the poll queue has 4 operations ->
    2 file reads and 2 GET API calls. So, internally timeout is calculated by `libUV`
    whether these operations are going to be finished quickly in a certain period
    of time (usually a very few seconds or not) or not. If not, then immediately we
    move to check queue. That is why here we are quickly going to move for `setImmediate()`’s
    callback from the check queue without waiting for 4 operations (2 file reads +
    2 GET API calls).


    ![Image](Image00264.jpg)

    ![Image](Image00265.jpg)


    * Now, all queues are empty and all pending task has finished except poll queue.
    Let’s see how the poll queue is going to perform these tasks.

    * Poll queue delegate task in major 2 categories.

    * All operations like file read, crypto and zLib are done through the Thread pool.

    * A Thread pool is a collection of worker threads. (it’s different from worker
    threads provided by node’s default module). The default size of the thread pool
    is 4 but you can overwrite using the `UV_THREADPOOL_SIZE` global variable provided
    by the node. I have drawn 4 small boxes for thread inside the thread pool.

    * One thread can perform one task, so 4 threads can perform 4 tasks simultaneously.

    * However, as I said file read, crypto, and zLib like tasks only perform in thread
    pool by design. So in our case, both files read operation is done through thread
    pool and 2 file operation handle through 2 separate threads and other 2 GET APIs
    calls are done by some other mechanism like `Epoll`/`Kqueue` (will see soon).


    ![Image](Image00266.jpg)


    * As you can see we are processing 2 file read operations in 2 threads and when
    they finish reading result is given back to respective callbacks.


    ![Image](Image00267.jpg)

    ![Image](Image00268.jpg)


    * Let’s finish the execution of the completed 2 read operations and run callbacks
    of it (Because we are not going to block the poll queue while waiting to finish
    API calls).


    ![Image](Image00269.jpg)

    ![Image](Image00270.jpg)


    * Great, now we have finished file read operations as well, but still, we have
    2 more operations to complete which are our 2 API calls. So, again we go through
    the next iteration of the event loop.


    ![Image](Image00271.jpg)


    * Now the time has come how `epoll`/`Kqueue` and poll queue work together. I will
    explain `epoll`, not other mechanisms because all other mechanisms are almost
    the same only difference is it’s based on Operating System Architecture.


    ### epoll (Assuming we are on Linux)


    * It’s a self-balancing binary tree data structure.

    * We attach task/s to a node of this data structure and loop through each task
    until some timeout.

    * Let’s assume we have 10 API requests that come to the running node process at
    the same time, all are actually given to `epoll`.

    * Before giving all requests to `epoll`, requests are opened in a non-blocking
    mode (It’s a Linux feature that allows you to open the files/fulfill requests
    in non-blocking mode and wait for them until it’s done, and then the result is
    given back).

    * Now in our assumption, we said we have 10 simultaneous requests which we are
    going to open in non-blocking mode and its id (they call it file descriptor) is
    stored in `epoll`. Each id will have events attached to it (here, our callback
    functions).

    * Generally, we loop over `epoll` for a certain time period. Let’s say `epoll`
    is looping for 2 seconds, so out of 10 requests, 4 requests are done in 2 seconds.
    So, the result of it given back to `epoll` and from `epoll` to our poll queue.

    * After finishing 4 requests, we move immediately to the check queue.

    * On the next iteration of the event loop, let’s say in our `epoll` we completed
    3 more requests (remember here we are literally looping in `epoll` for every 2
    seconds to check whether work is done or not in the background). These 3 requests
    with data given back to the poll queue.

    * On the next iteration, let’s say we fulfill all remaining 3 requests, and the
    result is given back to the poll queue.

