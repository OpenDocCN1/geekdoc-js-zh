    to the local memory of the executed function (aka memory of `createCapital`).
    But, life is not that simple man😅‼

    *   Introducing a new friend called `backpack` to rescue operation.


    ```

    A backpack is a simple memory store with strings attached to it(imagine as a real
    backpack🎒), and where these strings of the backpack will going to be attached
    is a question 🤔.

    ```


    Let’s actually visualize what actually happened when the execution of our outer
    function `createCapital` finished!


    ![Image](Image00018.jpg)


    Attached backpack to the inner function


    ![Image](Image00019.jpg)


    As you can see our backpack is nothing but a variable/s of an outer function’s
    scope, and when JavaScript sees this kind of outer scope combine with inner scope
    (outer function returning inner function), instead of wiping the memory it keeps
    those variables as internal properties of inner function!


    Also, if we want to see those internal properties then we can. Let’s see in the
    below image where those are!


    ![Image](Image00020.jpg)


    Hidden backpack


    *   As we can see above, the local scope (local memory) of the outer function
    (`createCapitial`) gets attached to the inner function’s internal key-value pair!
    (`[[Scope]]`).

    *   `[[Scope]]` key has 3 array elements and the first element is where our backpack
    memory is stored, that is to say, it’s our `Closure`.

    *   Also, the second element of that function is actually stat that, for which
    function that `Closure` is!

    *   The last element is actually our global scope which is actually available
    to every function (It’s like global closure for each function object)

    *   There you have it, my friends. this is closure with a mental model😎!

    *   We can take one example on it to understand it better. Because even if don’t
    return an inner function from the outer function, we could have closure. Let’s
    see with an example.


    ![Image](Image00021.jpg)


    *   This example is almost similar to the previous one except here we are returning
    an object instead of a function. This object however has a function in it. Let’s
    start visualizing as well.


    ![Image](Image00022.jpg)


    ![Image](Image00023.jpg)


    *   Arguments in function are also part of local memory for function execution.


    ![Image](Image00024.jpg)


    *   The function inside the object will get local memory of the outer function
    when the execution of the outer function gets destroyed. see below😁.


    ![Image](Image00025.jpg)


    ![Image](Image00026.jpg)


    ![Image](Image00027.jpg)


    *   Even without outer function, we are now able to access variables of it through
    closure as shown. Moreover, note that both **local variables and arguments** are
    made available through closure.


    ![Image](Image00028.jpg)


    *   finally, we completed our execution and the console gave the output.


