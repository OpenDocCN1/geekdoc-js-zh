    # NodeJS, C++, Queues & Servers\n\n```\nIf someone would ask me, what is the best\
    \ thing that happens in the javascript community?, my immediate answer will be\
    \ it is none other than NodeJS!.NodeJS is an amazing javascript runtime and also\
    \ a little misunderstood tool. In this chapter, I will try to make it as easy\
