    ![Image](Image00087.jpg)\n\n* Let’s start with our simple class execution for\
    \ the below line and visualize it.\n\n![Image](Image00088.jpg)\n![Image](Image00089.jpg)\n\
    \n* In `class`, we should remember that the `constructor` method is available\
    \ on its prototype object. so whenever we try to execute class with a `new` keyword\
    \ this `constructor` method from the prototype object is used (`class` is syntactic\
    \ sugar for function and function always has prototype object).\n\n* See diagram\
