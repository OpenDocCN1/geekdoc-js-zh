    简而言之，JavaScript 会直接执行所有同步代码，而所有异步操作只是被推迟到后续执行。然而，所有函数引用仍然存储在全局内存空间中，它们不会被复制到任务/作业队列中。


    ## 事件循环简介


    ```

    The event loop is a simple while loop, which keeps tracks that where any work
    is pending in queue/s to be finished or not with continuously checking that whether
    callstack is ready for taking the work from the queue/s or not.

    ```


    ![Image](img/Image00124.jpg)


    * 现在，由于当前我们的 `callstack` 为空，而队列中有待完成的任务，事件循环会找到它。请注意，`delayedTimer` 实际上是在 2000
    毫秒后（我们提供了时间，即它实际成为任务队列一部分所需的时间）才被放入 `task queue` 的。

    * 事件循环的任务只是检查队列中是否有待处理的工作，以及这些任务是什么。

    * 函数 `delayedTimer` 会被环境推送到 `callstack` 中，并成为正常执行的一部分😀。


    ![Image](img/Image00125.jpg)

