    \n在结束本章之前，让我们通过示例看一下 async-await 的简化 ES7+ 语法。\n\n![Image](img/Image00232.jpg)\n\
    \n*   如你所见，`async` 关键字的行为类似于生成器，而 `await` 关键字的行为类似于我们示例中的 `yield` 关键字。也就是说，这就是本章的底层原理和深入探讨\U0001F60A\
    。\n\n* * *\n\n# 6\n\n# NodeJS、C++、队列与服务器\n\n```\nIf someone would ask me, what\
    \ is the best thing that happens in the javascript community?, my immediate answer\
    \ will be it is none other than NodeJS!.NodeJS is an amazing javascript runtime\
    \ and also a little misunderstood tool. In this chapter, I will try to make it\
    \ as easy as possible and explain the core architecture and fundamentals of the\
    \ nodejs.\n```\n\n## Node 不是什么？\n\n1.  它不是一种编程语言。\n2.  它不是用于服务器端编码的框架/工具（不像 Php）。\n\
    3.  JavaScript 是一种编程语言，**而 Node 不是**。\n\n## Node 实际上是什么？\n\n1.  它是一个底层 C++ 委托代码，通过提供\
    \ JavaScript API（即 C++ 特性的 JavaScript 版本（**有时甚至是“C 绑定的 C++ 代码”**））供我们使用。\n2. \
    \ **它实际上是一个 C++ 程序**，将 JavaScript 代码作为字符串接收并完成所有工作！\n3.  Node 是一个单一的 C++ 程序，依赖于许多其他\
    \ C++ 库，如 **libUV、V8、c-ares、OpenSSL** 等。\n4.  我们称之为 nodejs，是因为用 C++ 编写的特性通过暴露等效的\
    \ JavaScript API 供我们使用。所以，Node（C++ 特性）+ JavaScript == NodeJS\U0001F60E。\n\n```\n\
    NodeJS's core architecture is way more complicated than a browser or any other\
    \ environment. Not only that, on the internet 90% of information related to nodejs\
    \ are partially false or misguided\U0001F62A.\n```\n\n*   我将非常循序渐进地讲解核心架构，并为你拆分各个部分，这样你就不需要再去其他地方理解了。让我们从\
    \ JavaScript 的基本示意图开始。\n\n![Image](img/Image00233.jpg)\n\n*   如我们所见，我们有一个类似的模型：队列、调用栈和我们的内存空间。\n\
    *   因为我们要在计算机上执行大量系统操作，Node 实际上使用了大量第三方 C/C++ 库来完成各种任务。\n*   我们首先需要理解两个主要组件。\n\
    \n## V8 引擎\n\n*   V8 引擎有一个基本任务：解析 JavaScript 并将其转换为**优化的机器码**。\n*   然而，V8 不仅仅是将我们的\
    \ JavaScript 代码转换为机器码，它做的远不止这些。它提供了事件循环的默认版本（等等，什么\U0001F928）。\n*   V8 提供给我们的默认事件循环可以被\
    \ JavaScript 运行时创建者扩展或替换。\n*   Node 实际上并没有使用 V8 的默认事件循环。Node 使用的是 LibUV 的事件循环，而不是\
    \ V8 的！\n*   因为 V8 有一个默认的事件循环，V8 事件循环队列的骨架代码仍然存在，并且 **Promise** 使用该队列，而不是其他任何队列。\n\
    *   我已经移除了 V8 的 **“任务队列”**。主要原因是 Node 不使用它，甚至不关心它。Node 使用了一种稍微不同的方法来处理异步**定时器**。\n\
    *   Node 提供了 `process.nextTick()`，它被设计为始终在所有队列之前运行。\n\n![Image](img/Image00234.jpg)\n\
    \n## LibUV\n\n*   这个库是 Node 的核心。LibUV 不仅提供了事件循环，还拥有一个非常好的机制来处理大量 I/O 操作。\n*  \
    \ I/O 操作可以是任何东西，比如大量连接请求、套接字、文件系统等。\n*   LibUV 提供或有时使用许多队列，我们很快就会学习这些队列。\n*  \
    \ 让我们先看看结合了 **v8 和 libUV** 的心智模型图\U0001F604。\n\n![Image](img/Image00235.jpg)\n\
    \n*   我故意在蓝色框上方留了一些空间，稍后会讲到。\n*   从图中可以看到，我们有 v8 + LibUV 的队列。\n*   LibUV 有 7 个主要队列（只画了\
    \ 6 个，因为 Idle 和 Prepare 合并为一行）。\n\n1.  **定时器：** `setTimeout()` 和 `setInterval()`。\n\
    2.  **待处理回调：** 想象一下，父进程是 **Nginx 服务器**，它已经在 3000 端口上运行，而你想在 3000 端口上启动 Node 服务器。那么，它会抛出一个错误（系统错误）。所有这类系统调用或错误回调都会被放入这个队列。\n\
    3.  **Idle 和 Prepare：** 我们不与之交互。\U0001F605（两个队列画在一起，因为我们实际上不使用，LibUV 内部使用它们）\n\
    4.  **Poll：** 所有 I/O 操作，如文件处理、客户端请求处理、套接字、加密、zlib（压缩）操作等，都通过此队列处理。\n5.  **Check：**\
    \ 用于 `setImmediate()` 回调，我们使用这个队列。\n6.  **Close：** 所有来自系统的关闭事件，如套接字关闭或清理事件，都被添加到此队列中（但为什么呢？因为这些是系统调用，而不是传入请求，所以\U0001F601\
    ）。\n\n> 默认的 libUV 和 v8 结合的心智模型并不难理解。问题是 Node 内部做的事情远不止使用这些队列，而最重要的部分是 **poll 队列**\
    \ ***\U0001F60B*** **。**\n\n*   从图中，我们可以看到一些奇怪的东西，比如**线程池**和 **Epoll/KQueue（数据结构）**，它们用于处理从\
    \ poll 队列委托过来的工作。\n*   不仅如此，我们还有**工作线程**，这也是一个不同的东西\U0001F928。\n*   在底部，我们有操作系统特性，或者你可以称之为系统的心脏\
    \ **“内核”**。\n*   在我们进一步解释所有东西如何协同工作之前，让我们先完成 Node 架构。\n\n![Image](img/Image00236.jpg)\n\
    \n*   我们知道我们将编写“JavaScript”，因此任何系统级代码都需要用 JavaScript 编写，然后委托给我们的 C++ 代码。这就是为什么我们有\
    \ **Node Core APIs**。\n*   它包含了所有核心模块的逻辑，这些逻辑用 C++ 编写，并暴露为 JavaScript API，供我们作为开发者使用。\n\
    *   **C++ Addon 和 N-API** 是我们可以使用的特殊特性或 API，用于通过 C++ 扩展 NodeJS（这需要 C/C++ 知识，所以我不会告诉你这个\U0001F605\
    ）。\n\n## Node 内部的正常执行流程\n\n**步骤 1：** 扫描整个代码，提升所有可能的变量。对未使用的引用进行垃圾回收（优化）。\n\n**步骤\
    \ 2：** 从上到下完成所有同步执行。\n\n**步骤 3：** 扫描所有异步代码的事件处理程序或回调，并将其作为未来的占位符存储在内存中。\n\n**步骤\
    \ 4：** 开始通过队列执行所有已完成的后台代码，并持续进行，直到完成所有后台任务或终止进程（事件循环\U0001F601！）\n\nNode 环境中队列的顺序如图所示。\n\
    \n1.  执行所有 `process.nextTick()` 的回调。\n2.  执行 **job queue** 中的所有 Promise。\n3. \
    \ 进入 LibUV 的队列，并从右向左开始执行\n    3.1 通过 **Timer queue** 完成定时器。\n    3.2 通过 **Pending\
    \ queue** 完成系统调用的错误处理回调。\n    3.3 完成内部使用的 **Idle、Prepare queue**。\n    3.4 等待一段时间，尝试尽可能多地完成\
    \ **poll queue** 中的回调。（稍微复杂，我们稍后会深入理解）。\n    3.5 完成 **check queue**（`setImmediate`）。\n\
    \    3.6 通过 **close queue** 完成关闭回调的执行。\n\n"
