    *   A function `createCapital` has its own local scope (environment) and inside
    that, we have `getCapital` function definition and stored.

    *   Now let’s see what happens when we finish executing `createCapital` and we
    have returned the `getCapital`.

    *   Your best guess should be, the entire body and local scope of `createCapital`
    will be destroyed and the `getCapital` function will be stored in the variable
    called `accessCapital`. Let’s look at our mental model again.


    ![Image](Image00016.jpg)


