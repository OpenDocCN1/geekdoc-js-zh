  raw: '*   The **“create”** is a method of **Object** is available to us and it has
    fundamental below task.


    1.  Create an empty object.


    2.  And because every object has __proto__ property available, after the creation
    of an empty object whatever we pass as an argument to the **“create”** method,
    will be available to this __proto__ directly to the newly created object. let’s
    see how.


    ![Image](Image00036.jpg)


