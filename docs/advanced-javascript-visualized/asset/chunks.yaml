    ## How CommonJS Module System Works


    As we can blue color content is actually what `require()` does. so, it’s wrapped
    function and all variables and function inside that are locally scoped. That’s
    is the reason why we were not able to execute the `greet()` function and got the
    error.


    But how then we are able to get this work🤨?


    That is where our `arguments` passed to IFEE are come into the picture.


    If we want to use the `greet()` function then we need to somehow take it outside
    of the IFEE scope when we require it.


    Nodejs’s IFEE has a `module` object available to us via argument and there is
    a `exports` key available to us on the `module` object (see diagram, the 3rd argument
    of IFEE).


    So, if I use a `module.exports` and add properties to it, then when we require
    that it in another module it will have access to it. let’s visualize it because
    it’ll easy to grasp.


    ![Image](Image00284.jpg)


    As we can see from the diagram wrapper of `file1.js` returns the `module.exports`
    object and we have attached the `greet()` function to the `module.exports` object.


    Now, let’s see what happens in our `main.js` where we required this module(`file1.js`).


    ![Image](Image00285.jpg)


    As per visualization, we can see if we extract whatever is returned from IFEE
    then we can get access to `greet` function via `module.exports` because `module.exports`
    is what is returned from that IFEE. Here we are returning the stuff from IFEE
    but not stored in a variable such that we can use it.


    ![Image](Image00286.jpg)


    Finally, we can see whatever we returned from `module.exports` is actually stored
    in the variable called `file1_stuff`. Because `module.exports` point to `greet`
    function, `file1_stuff` will point to `greet` function😁.


    There you have my friends how commonjs module system works under the hood!


    Same way let’s just finish our visualization for `file2.js` as well😅.


    ![Image](Image00287.jpg)

    ![Image](Image00288.jpg)

    ![Image](Image00289.jpg)


    We did exact same for `file2.js` as well and visualized. You can see whatever
    we exported from the file can be renamed as your wish as well.


    The last before I close the chapter let me tell you one thing `exports` (first
    argument of IFEE) and `module.exports` point to the same place😅.


    `exports = module.exports`


    So, you can you `exports` keyword directly instead of writing `module.exports`
    every time (just add key-value pair to `exports` object, don’t re-assign to entirely
    to new stuff😅).


    **Do this:** `exports.add = add`, `exports.greet = greet`;


    **Don’t do this:** `exports = null` or `exports = add` or `exports = greet` (If
    you do this, then it’ll break the functionality of the default module system’s
    behavior);


    > Lastly, the ES6+ module system is a real module system that doesn’t follow the
    above mechanism and natively parse the content of the file and make it available
    to us without wrapping.


