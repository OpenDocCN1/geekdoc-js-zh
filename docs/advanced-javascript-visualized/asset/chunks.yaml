    function call.


    ![Image](Image00050.jpg)


    The **new** keyword does 2 major things.


    1.  It will create a new **empty object** and a newly created object will get
    **this** reference. That means inside function execution **this** will point to
    newly created object by **new** keyword.


    2.  Moreover, whatever **prototype** object of function(**ArtistCreator** function
    in our example) has that will refer to __proto__ of newly created object(let’s
    visualize of course😅).


    ![Image](Image00051.jpg)


    *   Every function object has 2 parts as we know, one its function body, and the
    second is the object part.


    *   In the below diagram as you can see in **ArtistCreator** ’s object part has
    a prototype and __proto__ object.


    *   In our code, we added two functions to the prototype object which are **isHuman**
    and **isCurious** .


