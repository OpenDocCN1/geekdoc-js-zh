    After you specify the name of the remote machine, you can deploy and run your
    app on the remote machine by picking this option from the Visual Studio toolbar.


    > **WARNING**nTo deploy and run an app on a remote machine, you need to install
    the Remote Tools for Visual Studio 2012 on the remote machine. You can download
    the Remote Tools from the Microsoft.com website.


    # Debugging a Windows Store App


    I''m always optimistic and believe that any code that I write will run without
    error the first time that I run it. To date, that has never happened. I spend
    significant amount of time debugging code which does not what I want.


    In this section, I discuss the tools in Visual Studio which you can use to debug
    your code. I discuss how you can use the JavaScript Console window, use breakpoints,
    and use the DOM Explorer.


    # Using the Visual Studio JavaScript Console Window


    When I write JavaScript for pages used in websites, I use the JavaScript console
    window to view JavaScript errors. I also write custom messages to the console
    window using `console.log()` so I can debug my code (see Figure 1.29).'
