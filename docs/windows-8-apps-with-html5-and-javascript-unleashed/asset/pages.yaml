  md: "# CHAPTER 8 Creating Data Sources\n\nThe IndexedDB API includes both asynchronous\
    \ and synchronous methods. Currently, the only asynchronous methods are widely\
    \ supported by browsers. If you want to open a database connection, add an object\
    \ to an object store, or get a count of items in an object store, then you need\
    \ to perform these operations asynchronously.\n\n# Creating or Connecting to an\
    \ IndexedDB Database\n\nYou don't create a new IndexedDB database upfront—instead,\
    \ you create a new database when a new user first connects to your database. You\
    \ create new IndexedDB databases by handling the upgradeneeded event when attempting\
    \ to open a connection to an IndexedDB database.\n\nFor example, here's how you\
    \ would open a connection to an existing database named TasksDB when it does not\
    \ already exist:\n\n```\nvar reqOpen = window.indexedDB.open(\"TasksDB\", 2);\n\
    reqOpen.upgradeneeded = function (evt) {\n  var db = evt.target.result;\n  db.createObjectStore(\"\
    Tasks\", { keyPath: \"id\", autoIncrement: true });\n}\nreqOpen.onsuccess = function\
    \ () {\n  var db = reqOpen.result;\n  // Do something with db\n}\n```\n\nWhen\
    \ you call window.indexedDB.open(), and the database does not already exist, then\
    \ the upgradeneeded event is raised. In the code above, the upgradeneeded handler\
    \ creates a new object store named tasks. The new object store has an auto-increment\
    \ column id which acts as the primary key column.\n\nIf the database already exists\
    \ with the right version, and you call window.indexedDB.open(), then the success\
    \ event is raised. At that point, you have an open connection to the existing\
    \ database and you can start doing something useful with the database.\n\n# Adding\
    \ Objects to an Object Store\n\nYou use asynchronous methods to interact with\
    \ an IndexedDB database. For example, the following code illustrates how you would\
    \ add a new object to the tasks object store:\n\n```\nvar transaction = db.transaction(\"\
    tasks\", \"readwrite\");\nvar store = transaction.objectStore(\"tasks\");\nvar\
    \ reqAdd = store.add({\n  name: \"Feed the dog\"\n});\nreqAdd.onsuccess = function\
    \ () {\n  // Task added successfully\n}\n```"
  merge: -1
  pgno: 255
- img_proc: true
  md: "# Creating an IndexedDB Data Source\n\nThe code above creates a new read-write\
    \ database transaction, adds a new task to the tasks object store, and handles\
    \ the success event. If the new task gets added successfully, then the success\
    \ event is raised.\n\n# Getting a Count of Objects in an Object Store\n\nYou can\
    \ get a count of the objects in a particular object store by taking advantage\
    \ of the count() method. For example, you can use the following code to determine\
    \ the number of items in the tasks object store:\n\n```\nvar transaction = db.transaction(\"\
    tasks\");\nvar store = transaction.objectStore(\"tasks\");\nvar reqCount = store.count();\n\
    reqCount.onsuccess = function (evt) {\n  var count = evt.target.result;\n  console.log(count);\n\
    };\n```\n\nThe code above creates a new read-only database transaction and gets\
    \ a count of the number of objects in the tasks object store by calling the count()\
    \ method.\n\nNotice that the call to the count() method is asynchronous. You get\
    \ the count by handling the success event and reading the target.result property.\n\
    \n# Retrieving Objects from an Object Store\n\nYou retrieve objects from an object\
    \ store by opening a cursor and moving through the cursor one object at a time.\
    \ For example, the following code opens a cursor which retrieves the objects from\
    \ the tasks object store:\n\n```\nvar items = [];\nvar transaction = db.transaction(\"\
    tasks\");\nvar store = transaction.objectStore(\"tasks\");\nvar req = store.openCursor();\n\
    req.onsuccess = function (evt) {\n  var cursor = evt.target.result;\n  if (cursor)\
    \ {\n    items.push(cursor.value);\n    cursor.continue();\n  } else {\n    //\
    \ All done!\n  }\n};\n```\n\nWhen you open a cursor, and nothing goes wrong, then\
    \ the success event is raised. You can use cursor.value to get the current object.\
    \ Calling cursor.continue() moves the cursor forward and raises the success event\
    \ again.\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_256_0.png)"
  merge: -1
  pgno: 256
- img_proc: true
  md: "# CHAPTER 8 Creating Data Sources\n\nWhen you reach the end of the cursor,\
    \ then cursor will have the value null. In that case, know that you have retrieved\
    \ all of the objects from the store object.\n\n> NOTE\ncursor.continue() advances\
    \ by a single object. If you need to advance by one object, you can use cursor.advance().\n\
    \nUsing Indexes and Key Ranges\nWhen you create a database, you can create indexes\
    \ on object properties. An index enables you to efficiently retrieve objects which\
    \ match a value or range of values.\n\nHere's how you would create a tasks store\
    \ which includes an index on its dateCreated property.\n\n```\nvar reqOpen = window.indexedDB(\"\
    TasksDB\", 2);\nreqOpen.upgradeneeded = function (evt) {\n  var newDB = evt.target;\n\
    \  var store=newDB.createObjectStore(\"tasks\", { keyPath: \"id\", autoIncrement:\
    \ true });\n  store.createIndex(\"dateCreatedIndex\", \"dateCreated\");\n};\n\
    ```\n\nAfter creating an index, you can retrieve objects from an object store\
    \ by using the index with a key range. A key range represents the criteria which\
    \ an index uses to match objects in a store.\n\nWhen creating a key range, you\
    \ can specify the following properties:\n\n+   * Enables—you to retrieve only\
    \ the objects which match the supplied value.\n* lowerBound—Allows you to retrieve\
    \ all objects which have a value greater than the supplied value.\n* upperBound—Allows\
    \ you to retrieve all objects which have a value less than the supplied value.\n\
    * bound—Allows you to retrieve all objects which have a value greater than or\
    \ less than the supplied values.\n\nFor example, here is how you would retrieve\
    \ all of the tasks from the tasks store which were created before 1999:\n\n```\n\
    var items = [];\nvar transaction = db.transaction(\"tasks\");\nvar store = transaction.objectStore(\"\
    tasks\");\nvar index = store.index(\"dateCreatedIndex\");\nvar keyRange = IDBKeyRange.upperBound(new\
    \ Date(\"1/1/1999\"));\n```"
  merge: -1
