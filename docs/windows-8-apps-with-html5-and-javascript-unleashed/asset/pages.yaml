  md: "After you create the AuthenticationTokenAttribute filter action, you can use\
    \ the action filter with ASP.NET Web API controller method. For example, the GetCount()\
    \ method is decorated with the AuthenticationTokenAttribute filter like this:\n\
    \n```\n[HttpGet]\n[AuthenticationToken]\npublic int GetCount() {\n    return db.Tasks.Count();\n\
    }\n```\n\nIf you attempt to access any of the Controllers action methods without\
    \ supplying the right authentication token, the action method will return a 401\
    \ Unauthorized result. If you are running your Windows Store app using the Visual\
    \ Studio debugger, and you don't supply a valid authentication token, then you\
    \ will get the error illustrated in Figure 11.8.\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_321_0.png)\n\
    \nFIGURE 11.8 Web request with an invalid authentication token\n\n# Retrieving\
    \ the User ID\n\nThe authentication token passed to the web service includes several\
    \ bits of useful information:\n\n+   - AppID—for example, \"000000000440CF112\"\
    \n\n+   - Audience—for example, \"liveskedesk.superexpert.com\",\n\n+   - ClientIdentifier—for\
    \ example, \"ms-app:\n//S-1-15-2-375596339-949419851-1648241179-1781318319-26908715522\n\
    19935697027-21425738964\""
