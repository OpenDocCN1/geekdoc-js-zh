  md: "The following JavaScript code is used to handle the form submit event. This\
    \ code grabs the selected picture file from the input elements files collection\
    \ and displays the picture in the IMG element:\n\n```\n(function () {\n  \"use\
    \ strict\";\n\n  function initialize() {\n    var frmAdd = document.getElementById(\"\
    frmAdd\");\n\n    frmAdd.addEventListener(\"submit\", function (evt) {\n     \
    \ evt.preventDefault();\n\n      var imgPicture = document.getElementById(\"imgPicture\"\
    );\n      var inpFile = document.getElementById(\"inpFile\");\n\n      if (inpFile.files.length\
    \ > 0) {\n        // Use HTML5 File API to create object URL to refer to the photo\n\
    \        var pictureURL = URL.createObjectURL(inpFile.files[0]);\n\n        //\
    \ Show picture in IMG element\n        imgPicture.src = pictureURL;\n      }\n\
    \    });\n  }\n\n  document.addEventListener(\"DOMContentLoaded\", initialize);\n\
    })()\n```\n\n# # Creating a Rich Text Editor\n\nIf you want to create a form field\
    \ which accepts rich text—such as bold, italic, or underlined text—then you can\
    \ use the `editable` attribute. Imagine, for example, that you want to enable\
    \ a user to enter a college admissions essay. In that case, you can use the following\
    \ HTML form:\n\n```\n<form>\n  <label for=\"inpEssay\">\n    College Admissions\
    \ Essay:\n  </label>\n  <div id=\"inpEssay\" contenteditable=\"true\" class=\"\
    win-textarea richtext\"></div>\n</form>\n```"
