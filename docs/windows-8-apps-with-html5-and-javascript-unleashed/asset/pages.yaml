  md: '# CHAPTER 10

    Page Fragments and Navigation


    +   * Using the HtmlControl

    * Creating a Page Control

    * Creating Multipage Apps


    The goal of this chapter is to explain three controls: the HtmlControl, the Page
    Control, and the ControlNavigator control. All three controls enable you to display
    the contents of one HTML page in another HTML page using Ajax.


    The HtmlControl enables you to add a chunk of HTML to a page. You can use this
    control to reuse the same HTML markup in multiple places in your app.


    Creating Page Controls enables you to easily create newJS controls out of an HTML
    page, JavaScript file, and style sheet. Create a Page Control when you want to
    encapsulate both markup and behavior in a new control.


    Finally, the ControlNavigator control enables you to build single page apps which
    contain multiple pages. The ControlNavigator enables you to load Page Controls
    to simulate the experience of navigating between pages.


    # Using the HtmlControl Control


    If you want to include the same chunk of HTML in multiple pages in a Windows Store
    app, or you want to break up an existing page into more manageable parts, then
    you can use the JS HtmlControl control. This control requires you to set one option:
    a URI. You set the URI to indicate the content you want to load.


    > NOTE

    The code discussed in this section can be found in the Chapter10\Frags folder
    in the GitHub source.'
