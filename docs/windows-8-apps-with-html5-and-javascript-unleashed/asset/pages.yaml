  md: "# CHAPTER 9 App Events and States\n\nYou also can handle these other application\
    \ events which are triggered by particular events:\n\n+   - WinJS.Application.error—Triggered\
    \ by an unhandled error in your application.\n\n+   - WinJS.Application.checkpoint—Triggered\
    \ when your application is being suspended.\n\n+   - WinJS.Application.settings—Triggered\
    \ when application settings are changed.\n\nNone of these are raised unless you\
    \ call WinJS.Application.start(). The events are queued and the events are not\
    \ raised until the WinJS.Application.start() method is called.\n\nThe following\
    \ JavaScript code illustrates how you can create a handler for each of these events\
    \ and when you log them to the Visual Studio JavaScript console window:\n\n```\n\
    WinJS.Application.addEventListener(\"loaded\", function (evt) {\n  console.log(\"\
    loaded\");\n}\n```\n\n```\nWinJS.Application.addEventListener(\"activated\", function\
    \ (evt) {\n  console.log(\"activated\");\n}\n```\n\n```\nWinJS.Application.addEventListener(\"\
    ready\", function (evt) {\n  console.log(\"ready\");\n}\n```\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_267_0.png)\n\
    \nFIGURE 9.1 Logging WinJS Application events\n\n# Handling the Activated Event\n\
    \nThe activated event is raised when a Windows Store app is activated (started).\
