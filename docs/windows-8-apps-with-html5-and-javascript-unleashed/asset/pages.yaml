  md: "# Creating a Web Service Data Source\n\n```\ncomplete(count);\n}\nfunction\
    \ (xhr) {\n    console.log(\"Could not call getCount()\");\n}\n}\n\n```\n\nThe\
    \ getCount() method invokes a remote web service action named getCount() by performing\
    \ an HTTP GET request.\n\nThe remove() method invokes a remote web service action\
    \ named remove() by performing an HTTP DELETE request. The remove() method looks\
    \ like this:\n\n```\nremove: function (key) {\n    var that = this;\n    return\
    \ new WinJS.Promise(function (complete, error) {\n        var options = {\n  \
    \          url: that._url + \"/remove/\" + key,\n            type: \"DELETE\"\
    ,\n            headers: {\n                authenticationToken: that.authenticationToken\n\
    \            }\n        };\n        WinJS.xhr(options).then(\n            function\
    \ (xhr) {\n                complete();\n                function (xhr) {\n   \
    \                 console.log(\"Could not call remove()\");\n                }\n\
    \            }\n        });\n    });\n}\n\n```\n\nIn general, each method of the\
    \ web service data source delegates to a remote web service action with the same\
    \ name.\n\n# Creating the Web Service\n\nThere are several ways that you can create\
    \ a web service. Even if you restrict yourself to Microsoft technologies, you\
    \ have several options. You can create a WCF service, a WCF Data Service, an ASMX\
    \ web service, a Windows Azure Mobile Services service, or an ASP.NET Web API\
    \ service.\n\nI decided to create a web service by taking advantage of the ASP.Net\
    \ Web API. You can add a Web API controller to either an an ASP.NET Web Forms\
    \ or an ASP.NET MVC project, I"
  merge: -1
