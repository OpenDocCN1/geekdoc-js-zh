  md: '# Using the TimePicker Control


    You declare a TimePicker control like this:


    ```

    <div id="timeLunch"data-win-control="WinJS.UI.TimePicker"></div>

    ```


    > WARNING

    Don''t forget to call WinJS.UI.processAll() or the declaration of the TimePicker
    control will never get parsed and turned into a TimePicker control.


    If you prefer military time (a 24-hour clock) then you can modify the TimePicker''s
    clock property like this:


    ```

    <div id="timeLunch"data-win-control="WinJS.UI.TimePicker"\data-win-options="{

    clock: ''24HourClock''

    }\</div>

    ```


    Finally, if you want to display minutes in 15 minute increments (see Figure 4.19)
    instead of the default 1 minute increment, then you can set the minuteIncrement
    property like this:


    ```

    <div id="timeLunch"data-win-control="WinJS.UI.TimePicker"\data-win-options="{

    minuteIncrement: 15

    }\</div>

    ```


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_142_0.png)


    FIGURE 4.19 Changing the TimePicker control''s minute increment


    > NOTE

    If you have changed your computer''s regional settings to display a 24-hour clock
    instead of a 12-hour clock, then the TimePicker will default to displaying a 24-hour
    clock.'
