  md: 'Here''s a partial list of scopes:


    +   - wl.signon—Single sign-in behavior

    - wl.basic—Read access to basic profile information and contacts.

    - wl.offline access—Ability to read and update user information when a user is
    not signed in and using your app.

    - wl.birthday—Read access to user birthday.

    - wl.calendars—Read access to user calendars and events.

    - wl.calendars_update—Read and write access to user calendars and events.

    - wl.contacts_birthday—Read access to user birthday and user contacts birthdays.

    - wl.contacts_create—Write access to user contacts.

    - wl.contacts_calendars—Read access to user calendars and events calendars and
    events.

    - wl.contacts_photos—Read access to user media and media shared by other users.

    - wl.skydrive—Read access to user SkyDrive and files shared by other users.

    - wl.emails—Read access to user email addresses.

    - wl.events_create—Write access for creating events.

    - wl.messenger—Enables you to sign in to the user messenger service.

    - wl.phone_numbers—Read access to user phone numbers.

    - wl.photos—Read access to user media.

    - wl.postal_addresses—Read access to user mailing addresses.

    - wl.share—Enables you to update a user''s status message.

    - wl.skydrive—Read access to user files in SkyDrive.

    - wl.skydrive_update—Read and write access to user files in SkyDrive.

    - wl.work_profile—Read access to a user''s work and employment information.


    > NOTE

    For a complete listing of scopes, see http://msdn.microsoft.com/en-us/library/live/hh243646.aspx.


    Obviously, not all users of a Windows Store app will want to share all information
    about themselves. Your Windows Store app, therefore, must get consent to access
    the information.'
