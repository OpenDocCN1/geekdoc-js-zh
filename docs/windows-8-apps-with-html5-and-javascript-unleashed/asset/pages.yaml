    The FlipView is bound to the list of articles with the help of the dataSource
    property. You can bind a FlipView to any data source which implements the IListData
    interface. There are only two objects in the WinJS library which implement this
    interface: the WinJS.Binding.List and the WinJS.UI.StorageDataSource object.


    In the markup above, the FlipView is bound to the list of articles which is a
    WinJS.Binding.List. In particular, the FlipView is bound to the dataSource of
    the listArticles object. The dataSource returns the object which implements the
    IListDataSource.


    The FlipView control''s itemTemplate property points to a Template control with
    the id tmArticle which is declared earlier in the page. The Template control contains
    the template used to format the article displayed by the FlipView.


    > WARNING

    Make sure that you declare the Template control before the FlipView control and
    not after in the page or you will get a mysterious error and spend hours trying
    to debug it.


    > WARNING

    As always, remember to call WinJS.UI.processAll() or the FlipView won''t become
    a FlipView.


