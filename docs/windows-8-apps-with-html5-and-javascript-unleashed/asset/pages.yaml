  md: '# CHAPTER 5


    # Creating Forms


    # IN THIS CHAPTER


    +   * Using HTML5 Form Validation


    +   * Using HTML5 Input Elements


    +   * Creating a Rich Text Editor


    +   * Displaying Progress


    I assume that anyone who is reading this book is already familiar with the basics
    of HTML, but I don''t assume that you are familiar with the latest features of
    HTML5. In particular, I don''t assume that you are familiar with the changes to
    HTML forms included in the HTML5 standard.


    In the first section of this chapter, I describe how you can take advantage of
    HTML5 form validation in a Windows Store app. You learn how to use validation
    attributes—such as the `required` and `pattern` attribute—to enforce validation
    constraints.


    Next, I discuss the new features of input elements included in HTML5. You learn
    how the new HTML5 input types enable you to control the type of data entered into
    a form field.


    Finally, I talk about two other important new features of HTML5. I explain how
    you can take advantage of the `contenteditable` attribute to create input elements
    which accept rich text such as bold and italic text. I also discuss the new HTML5
    progress element.


    # Using HTML5 Form Validation


    In a Windows Store app, the easiest way to validate HTML form fields is to take
    advantage of the HTML5 validation attributes. Imagine, for example, that you want
    to create an HTML form which includes a form field for entering a social security
    number. In that case, you can use the `required` attribute to ensure that a value
    has been entered and you can use the `pattern` attribute to ensure that the value
    matches the pattern for a valid social security number.'
