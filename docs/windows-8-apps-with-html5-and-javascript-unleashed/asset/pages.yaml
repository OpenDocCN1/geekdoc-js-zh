- img_proc: true
  md: '# CHAPTER 7


    # Using the ListView Control


    This entire chapter is devoted to one control: the ListView control. This is the
    single most important control included in the WinJS library. If you need to display
    a list of items—for example, a list of movies, a list of products, a list of files,
    a list of photos—then the ListView control is the control to use.


    In this chapter, I explain how you can take advantage of all of the most important
    features of the ListView control. You learn the basics including how to select,
    sort, filter, and group items in ListView.


    I also discuss advanced features of the ListView control. In particular, you learn
    how to use the ListView control with semantic zoom to generate different representations
    of the same data. You also learn how to use the ListView control to display huge
    sets of data efficiently by enabling incremental loading of ListView items.


    # Introduction to the ListView Control


    Let''s start with the basics. You can bind a ListView to any data source that
    implements the JavaScript IListData interface. The WinJS library includes two
    objects which implement this data source:


    +   * WinJS.Binding.List—Enables you to represent a JavaScript array as a data
    source


    +   * WinJS.UI.Storage—Enables you to represent files from your computer hard
    drive as a data source. For example, you can use the WinJS.UI.Storage data source
    with the ListView control to display a list of pictures retrieved from your computer''s
    Pictures library.


    # IN THIS CHAPTER


    +   * Introduction to the ListView Control


    +   * Selecting Items in a ListView Control


    +   * Sorting Items in a ListView Control


    +   * Filtering Items in a ListView Control


    +   * Grouping Items in a ListView Control


    +   * Switching Views with Semantic Zoom


    +   * Switching ListView Template Dynamically


    +   * Loading ListView Items Incrementally'
  merge: -1
  pgno: 198
