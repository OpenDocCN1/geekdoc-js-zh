    # Switching Views with Semantic Zoom


    Semantic Zoom is a feature of Windows 8 which enables you to view data at two
    different zoom levels. For example, the Windows 8 Start screen takes advantage
    of Semantic Zoom. By default, when you open the Start screen, you view a close
    up view of your apps (see Figure 7.15). However, you can zoom out to see a more
    far away view of your apps (see Figure 7.16).


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_224_0.png)


    FIGURE 7.15 Default Start Screen'
