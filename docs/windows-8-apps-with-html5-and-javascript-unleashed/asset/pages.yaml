    # Summary


    The focus of this chapter was on creating HTML forms for Windows Store apps. In
    the first section, I explained how you can take advantage of the new form validation
    features included in HTML. You learned how to use the required and pattern attributes
    to perform basic validation and the setCustomValidity() method to perform advanced
    validation.'
