  md: "The previous code displays a model dialog when there is an error with the message\
    \ “There\nwas an error.” (See Figure 9.2).\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_269_0.png)\n\
    \nFIGURE 9.2 Displaying an error message\n\nNotice that the error handler returns\
    \ the value true. When the error handler returns true,\nt error is considered\
    \ handled and the app is not terminated. If you want to terminate\nt app after\
    \ executing your custom error handler code, then don't return true.\n\n> WARNING\n\
    If the error happens before the WinJS.application.start() method is called, then\
    \ your\ncustom error handler won't be invoked.\n\n# Deferring Events with Promises\n\
    \nWinJS.Application events are different than normal DOM events because they support\n\
    promises. You can execute an asynchronous task during a WinJS.Application event\
    \ and\ndela the next event until a promise completes.\n\nFor example, the default.js\
    \ file created when you create a new Windows Store app\nproject lays the completion\
    \ of the WinJS.Application.activated event until the asyn-\nchronous call to WinJS.UI.processAll()\
    \ completes. This ensures that all of the controls in\nt page are processed before\
    \ the splash screen is torn down.\n\nHere’s what the WinJS.Application.activated\
    \ event handler looks like in the default.js\nfile with some code removed:\n\n\
    ```\napp.onactivated = function (args) {\n    if (args.detail.kind === activation.ActivationKind.launch)\
    \ {\n        args.setPromise(WinJS.UI.processAll());\n    }\n};\n```\n\nIn the\
    \ code above, the args.setPromise() is used to execute a method which\nreturns\
    \ a promise: the processAll() method. The processAll() method executes asyn-\n\
    ously and the ready event is not raised until the processAll() method completes."
  merge: -1
  pgno: 269
- img_proc: true
  md: "# Suspending, Termating, and Resuming an App\n\n# Creating Custom Events\n\n\
    You can create and listen to custom application events. You can make up any type\
    \ of event that you please.\n\nFor example, if you are creating a game, you might\
    \ want to create a heartbeat event which is raised every second so that you can\
    \ refresh the game board. The following code demonstrates how you can create and\
    \ listen to a custom heartbeat event:\n\n```\nwindow.setInterval(function () {\n\
    \  WinJS.Application.queueEvent({ type: \"heartbeat\" });\n}, 1000);\n```\n\n\
    ```\nWinJS.Application.addEventListener(\"heartbeat\", function (evt) {\n  console.log(\"\
    heartbeat\");\n});\n```\n\n```\nWinJS.Application.start();\n```\n\nThe code above\
    \ uses the setInterval method to execute code once every second. The queueEvent\
    \ method is called to queue a custom heartbeat event.\n\nThe addEventListener\
    \ method is used to listen to the event. Every second, the message \"heartbeat\"\
    \ is written to the Visual Studio JavaScript Console.\n\nYou can supply additional\
    \ event details by supplying a detail property when queuing an event like:\n\n\
    ```\nWinJS.Application.queueEvent({\n  type: \"heartbeat\",\ndetail: { numberOfPlayers:\
    \ 12 }\n});\n```\n\n# Suspending, Terminating, and Resuming an App\n\nWhen you\
    \ are building a Windows Store app, you need to maintain the illusion that the\
    \ app is always running even when the user might be switching compulsively open\
    \ apps. Normally, you do not explicitly create a Windows Store app—instead, just\
    \ switch to a new one.\n\nIf you switch from one app to another, Windows will\
    \ suspend the app but keep the app in memory. If memory resources become low of\
    \ other running apps, Windows will quietly terminate the app in the background.\n\
    \nFrom the perspective of a user, an app should behave in the same way regardless\
    \ of whether the app was suspended or terminated. You expect the app to be in\
    \ the same state when you switch back to it—even if you don't switch back to the\
    \ app for many hours. For example, if the user was reading a particular news story,\
    \ the same story should be selected when the user switches back to the app."
  merge: -1
  pgno: 270
- img_proc: true
  md: "# Detecting When an App is Suspended and Terminated\n\nYou can detect when\
    \ an app is suspended by handling the WinJS.Application checkpoint. You should\
    \ use this event to save the state of your app, in case your app is terminated\
    \ after suspension, so you can reload the state when the app starts again.\n\n\
    There is no method within a Windows Store app to detect when an app is terminated.\
    \ In particular, there is no app terminated event. For this reason, if you need\
    \ to save the state of your app so the state can be reloaded after termination,\
    \ then you should save your app state during the checkpoint event.\n\nHere's some\
    \ sample code for handling this event:\n\n```\nWinJS.Application.addEventListener(\"\
    checkpoint\", function () {\n  // Save app state\n});\n```\n\n# Detecting the\
    \ Previous Execution State\n\nWhen a Windows Store app is activated, you can use\
    \ the previousExecutionState property to determine whether the app is being newly\
    \ launched, whether it was previously closed by the user, or whether it is coming\
    \ back after being suspended and terminated.\n\nDepending on the value of previousExecutionState,\
    \ you might want to load default values or load the previous app state. For example,\
    \ if you are creating a news app, then you probably want to load the previous\
    \ article that the user was reading. If, on the other hand, the user has never\
    \ run the app, then you might want to load a default page such as the home page.\n\
    \nHere's what the code looks like for checking the previous state:\n\n```\nWinJS.Application.addEventListener(\"\
    activated\", function (evt) {\n  var appState = Windows.ApplicationModel.Activation.ApplicationExecutionState;\n\
    \  if (evt.detail.previousExecutionState == appState.Running) {\n    // The app\
    \ has not been run in the current user session\n    // or it crashed.\n    //\
    \ Should load defaults.\n  }\n  if (evt.detail.previousExecutionState == appState.closedByUser)\
    \ {\n    // The app was closed by the user.\n    // Should load defaults.\n  }\n\
    \  if (evt.detail.previousExecutionState == appState.terminated) {\n    // The\
    \ app was suspended and terminated.\n    // Should restore previous state.\n \
    \ }\n});\n```"
  merge: -1
  pgno: 271
