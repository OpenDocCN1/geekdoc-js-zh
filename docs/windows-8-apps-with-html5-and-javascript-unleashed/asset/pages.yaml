    \ property to determine exactly how your app was activated:\n\n```\nWinJS.Application.addEventListener(\"\
    activated\", function (evt) {\n  var activationKind = Windows.ApplicationModel.Activation.ActivationKind;\n\
    \  switch (evt.detail.kind) {\n    case activationKind.launch:\n      console.log(\"\
    Launched from a tile\");\n      break;\n    case activationKind.search:\n```"
