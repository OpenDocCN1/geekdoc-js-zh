    You can create Windows Store apps with either Microsoft Studio 2012 or Microsoft
    Blend. If you need to release to the Windows Store, then I recommend using Microsoft
    Visual Studio 2012.

    In order build Windows Store apps, you must use Visual Studio on Windows 8. If
    you don''t have a dedicated Windows 8 computer, you can use a virtual machine
    Windows 8 such as VMware Player.


    Go ahead and launch Visual Studio. Next, select the menu File, New Project. On
