  md: "# Displaying Windows Dialogs\n\nSometimes, nothing beats a good old-fashioned\
    \ modal dialog. A modal dialog blocks all user interaction with your app until\
    \ the modal dialog gets its answer.\n\nModal dialogs are necessary when your app\
    \ will not work without some crucial information. For example, a Weather app cannot\
    \ display the weather without knowing your location. So it makes sense to use\
    \ a modal dialog to ask for the user's location when the app first runs.\n\nYou\
    \ can also use modal dialogs in the same situations in which you would use JavaScript\
    \ alerts when you really need to get in a user's face to convey critical warnings\
    \ or information. You should use modal dialogs sparingly.\n\n> JavaScript alerts\
    \ do not work in Windows Store apps written with JavaScript. Because I consider\
    \ JavaScript alerts to be closely related to the (deprecated) HTML blink tag,\
    \ this is a good thing.\n\nYou create modal dialogs by using the MessageBox class.\
    \ Here's how you can open a dialog with the message “Did you know that your fly\
    \ is unzipped?” (see Figure 6.12).\n\n```\nvar message = new Windows.UI.Popups.MessageBox(\n\
    \  \"Did you know that your fly is unzipped?\"\n);\nmessage.showAsync();\n```\n\
    \n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_195_0.png)\n\nFIGURE 6.12 Using a message\
    \ dialog"
  merge: -1
  pgno: 195
