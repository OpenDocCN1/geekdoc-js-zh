    progress\");\n  }\n)\n```\n\nThe WinJS.xhr() method returns a promise. The Promise\
    \ class includes a done() method which accepts three callback functions: a complete\
    \ callback, an error callback, and a progress callback:\n\nPromise.done(completeCallback,\
    \ errorCallback, progressCallback)\n\nIn the code in Listing 2.7, three anonymous\
    \ functions are passed to the done() method. Unless there is a network error,\
    \ the error function is never called. The progress function is called repeatedly\
    \ during the Ajax request. Finally, the complete callback is done when the Ajax\
    \ call completes. The complete callback displays the title of the first blog entry\
    \ retrieved (see Figure 2.4).\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_71_0.png)\n\
    \nFIGURE 2.4 Using a promise\n\n# Using then() versus done()\n\nIn the previous\
    \ section, we used the Promise object done() method to set up our complete, error,\
    \ and progress callbacks. The Promise object exposes another method which is closely\
    \ related to done(): the then() method."
