  md: "When the Game class is initialized in the game.js file, a 2-D context is retrieved\
    \ from the\nCanvas element with the following code:\n\n```\n// Setup Canvas\n\
    this._canvas = document.getElementById(\"canvas\");\nthis._ctx = this._canvas.getContext(\"\
    2d\");\n```\n\nThe 2-D context contains the graphics API for drawing on the Canvas.\
    \ For example, the\ngraphics API includes methods such as lineTo(), rect(), and\
    \ arc() for drawing lines,\nrectangles, and arcs.\n\nThe Brain Eaters game only\
    \ takes advantage of a single method of the Canvas API: the\ndrawImage() method.\
    \ The drawImage() method paints an image on the Canvas at a particular-\nlocation.\n\
    \nFor example, the player tile is rendered with the following code:\n\n```\nrenderPlayer:\
    \ function () {\n  this.drawImage(this._player.tile.image, this._player.x, this._player.y);\n\
    }\n\ndrawImage: function (image, x, y) {\n  this._ctx.drawImage(image, x * TILE_WIDTH,\
    \ y * TILE_HEIGHT);\n}\n```\n\nThe renderPlayer() method calls the drawImage()\
    \ passing an image and x and y\ncoordinates. The drawImage() method draws the\
    \ image on the Canvas by calling the 2-D\ncontext drawImage() method.\n\n> NOTE\n\
    Unfortunately, you cannot use animated GIFs with the drawImage() method.\nAccording\
    \ to the HTML5 spec \"When the drawImage() method is passed an animated\nimage\
    \ as its argument, the user agent must use the poster frame of the animation,\n\
    or, if there is no poster frame, the first frame of the animation.\" Bummer.\n\
    \n# Capturing User Interaction\n\nThe Brain Eaters game supports keyboard, mouse,\
    \ touch, and stylus interaction. If you are\nusing the keyboard, then you can\
    \ move your character using the arrow keys.\n\nThe following code is used to capture\
    \ keyboard interaction:\n\n```\ndocument.addEventListener(\"keydown\", this.movePlayerKeyboard.bind(this));\n\
    ```\n\nWhen you press a key, the movePlayerKeyboard() method is called. This method\n\
    detects the arrow key that was pressed and changes the direction of the player."
