  md: '# Prerequisites for This Book


    If you can build a website using JavaScript, HTML, and Cascading Style Sheets,
    then you have the skills that you need to read and understand this book.


    There are two software requirements for building Windows Store apps and using
    the code from this book.


    First, you must build a Windows Store app on the Windows 8 operating system. Let
    me repeat this: You must have Windows 8 installed on your computer to use the
    code from this book.


    Second, in order to use the code from this book, you need Microsoft Visual Studio
    2012. There is a free version of Visual Studio 2012—Microsoft Visual Studio 2012
    Express for Windows 8—which you can download from the Microsoft.com website.


