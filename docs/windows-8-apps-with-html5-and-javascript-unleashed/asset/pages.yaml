  md: "# Creating an IndexedDB Data Source\n\n```\nvar req = index.openCursor(keyRange);\n\
    req.onsuccess = function (evt) {\n  var cursor = evt.target.result;\n  if (cursor)\
    \ {\n    items.push(cursor.value);\n    cursor.continue();\n  } else {\n    //\
    \ All done!\n  }\n}\n```\n\nYou can also use an index when getting a count of\
    \ objects that match a particular range. For example, the following code gets\
    \ a count of the number of tasks which were created before 1999:\n\n```\nvar transaction\
    \ = db.transaction(\"tasks\");\nvar store = transaction.objectStore(\"tasks\"\
    );\nvar index = store.index(\"dateCreatedIndex\");\nvar keyRange = IDBKeyRange.upperBound(new\
    \ Date(\"1/1/1999\"));\nvar req = index.count(keyRange);\nreq.onsuccess = function\
    \ (evt) {\n  var count = evt.target.result;\n}\n```\n\n# Using the IndexedDB Data\
    \ Source\n\nThe IndexedDB data source enables you to bind a ListView control to\
    \ a collection of JavaScript objects stored in an IndexedDB database. You create\
    \ an IndexedDB data source by providing three arguments:\n\n+   * **objectName**—The\
    \ name of the object store to represent with the data source.\n* **creationOptions**—The\
    \ creationOptions determine how the IndexedDB database and object are created.\n\
    * **cursorOptions** (optional)—If you supply cursorOptions, then you can filter\
    \ the objects in the object store using a key range.\n\nFor example, here is how\
    \ you would create an instance of the IndexedDB data source which represents a\
    \ collection of movies:\n\n```\n// Create the data source options\nvar createOptions\
    \ = {\n  databaseName: \"MoviesDB\",\n  databaseVersion: 1,\n  indexNames: [\"\
    category\"]\n};\n\n```"
