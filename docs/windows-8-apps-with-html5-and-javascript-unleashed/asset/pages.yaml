  md: "# Selecting Files\n\nYou are not forced to select from the list. Using the\
    \ list attribute makes an input element work more like a combo-box than a select\
    \ list.\n\nYou can use <input type=\"file\" /> to create a picture picker. For\
    \ example, you can use <input type=\"file\" /> to enable a user to select a picture\
    \ file from their hard drive.\n\nThe following HTML page includes an <input type=\"\
    file\" /> element and a DIV element with the ID imgPicture. After you select a\
    \ picture from your hard drive, the picture appears in the img element (see Figure\
    \ 5.15).\n\n```\n<form id=\"frmAdd\">\n  <div>\n    <label>\n      Picture:\n\
    \      <input id=\"inpFile\" type=\"file\" accept=\"image/*\" />\n    </label>\n\
    \    <input type=\"submit\" />\n  </div>\n</form>\n```\n\nWhen you use the <input\
    \ type=\"file\" /> element, you can use the accept attribute to restrict the type\
    \ of files that can be uploaded. For example, in the markup above, the accept\
    \ element has the value \"image/*\" which prevents any file except image files\
    \ from being selected.\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_167_0.png)\n\
    \nFIGURE 5.15 Selecting a picture file"
