  md: "# 306 CHAPTER 11 Using the Live Connect API\n\n```\ncomplete(count);\n}\nfunction(xhr)\
    \ {\n    console.log(\"Could not call getCount()\");\n    debugger;\n}\n}\n```\n\
    \nThe important thing is that each time you call the remote web service, you need\
    \ to include the authentication token. This token identifies the user making the\
    \ remote web.\n\n# Verifying the Authentication Token in a Web Service\n\nThe\
    \ second half to getting this security process to work is to verify the authentication\
    \ token in the web service. The Windows Store app calls a Tasks service which\
    \ returns the set of tasks.\n\nThe web service is implemented using the ASP.NET\
    \ Web API. In particular, the web service is implemented as an API controller\
    \ class named TasksController. This class is written using C#.\n\nWithin the TasksController,\
    \ you need to validate the authentication token. The Windows Live team includes\
    \ a sample class for validating an authentication token as part of the Live SDK.\
    \ The name of the class is JsonToken.\n\n> NOTE\nYou can download the JsonToken\
    \ class from the Windows Live GitHub account located at https://github.com/liveservice/LiveSDK.\
    \ Look under the ASP.NET samples.\n\nListing 11.8 contains an action filter named\
    \ AuthenticationAttribute which takes advantage of the JsonToken class. This action\
    \ retrieves the authentication token from the header of a request and uses the\
    \ JsonToken class to verify the token.\n\n# LISTING 11.8 The AuthenticationAttribute\
    \ Action Filter\n\n```\nusing System;\nusing System.Collections.Generic;\nusing\
    \ System.Linq;\nusing System.Web.Configuration;\nusing JWTSample;\n\nnamespace\
    \ WebServices.Infrastructure\n    public class AuthenticationAttribute : System.Web.Http.Filters\n\
    \    [ActionFilter]\n        protected override void OnActionExecuting(System.Web.Http.Controllers.HttpContext\
    \ context)\n```"
