    \n> Sadly, you cannot pass additional parameters when using a binding converter.\
    \ It would be nice if you could pass an additional parameter, for example, which\
    \ represented the date format. However, you can't do this. Instead, you must create\
    \ separate dateShort and dateLong binding converters.\n\n# Understanding Templates\n\
    \nIf you need to display the same fragment of HTML more than one time in a page,\
    \ you should create a template. A template is a fragment of HTML which can include\
