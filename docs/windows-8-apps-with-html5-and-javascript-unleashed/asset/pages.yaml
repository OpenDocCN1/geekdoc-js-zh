  md: '# Selecting Items in a ListView Control 197


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_210_0.png)


    FIGURE 7.10 ListView items displayed in list mode.


    # Selecting Items in a ListView Control


    The ListView control includes built-in support for selecting items. By default,
    you can select a ListView item by right-clicking the item or by swiping your finger
    up on the item.


    There are three ListView events that are relevant for selecting items:


    +   - iteminvoked—Occurs when a ListView item is tapped.

    - selectionchanging—Occurs before the current selection changes.

    - selectionchanged—Occurs after the current selection changes.


    Invoking a list item is not the same as selecting it. When you select a list item,
    the selection-changed event is raised and the list appears with a checkbox. When
    you invoke an item, the iteminvoked event is raised but the item is not selected.
    Use the item-invoked event for actions other than selecting.


    There are several ListView properties which are relevant for selecting items:


    +   - selection—Gets a Win3.Selection Object which has methods for setting and
    retrieving the selected items in a ListView.

    - selectionMode—Gets or sets the selection mode. Possible values are ''none'',
    ''single'', Or ''multi''. Use the value ''multi'' is the default.

    - swipeBehavior—Gets or sets a value which determines what happens when you swipe
    your finger on a ListView item. Possible values are ''select'' and ''none''.

    - tapBehavior—Gets or sets a value which determines what happens when you click/tap
    on an item. Possible values are ''directSelect'', ''toggleSelect'', ''invokeOnly'',
    ''none''.'
