  md: "When you submit the HTML form for adding new tasks, the file data source\n\
    insertAtEnd() method is called to create the new task. If the new task is successfully\n\
    created, then the ListView control's ensureVisible() method is called to ensure\
    \ that the\nnew task is scrolled into view.\n\n> WARNING\nAlways call beginEdits()\
    \ and endEdits() when inserting, editing, or deleting data with\na data source.\
    \ If you neglect to use beginEdits() and endEdits() then you can get null\nreference\
    \ exceptions when you edit items too fast.\n\n# Creating a Web Service Data Source\n\
    \nIn this section, I discuss how you can build a web service data source. The\
    \ web service\ndata sources enable you to build a list control to manage a remote\
    \ web service. You can use\ntata source to both retrieve and modify data.\n\n\
    You can use the web service data source, for example, to retrieve a list of products\
    \ from\ncatalog of products stored in a database on a remote website. That way,\
    \ when the catalog\nproducts is updated, your Windows Store app will display the\
    \ latest products.\n\n> NOTE\nWhen working with Ajax, I strongly recommend that\
    \ you take advantage of the free\nfiddler2 tool to help debug Ajax requests. You\
    \ can download Fiddler2—which works\ngwith Windows 8—from http:// fiddler2.com.\n\
    \n> NOTE\nThe complete source code for the WebDataSource is included in the GitHub\n\
    source in a folder named WebService.\n\n# Creating the Data Source\n\nThe web\
    \ service data source uses the WinJS.xhr() method to make the Ajax calls to the\n\
    remote web service. For example, the getCount() method looks like this:\n\n```\n\
    getCount: function () {\n  var that = this;\n\n  return new WinJS.Promise(function\
    \ (complete, error) {\n    var options = {\n      url: that._url + \"/getCount\"\
    \n    };\n    return WinJS.xhr(options).then(function (xhr) {\n      var count\
    \ = JSON.parse(xhr.response);\n```"
