  md: '# 152 CHAPTER 5 Creating Forms


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_165_0.png)


    FIGURE 5.9 <input type="email" /> Touch keyboard for email


    Using <input type="email" /> also gives you automatic validation. You must enter
    a valid email address or you get the validation error message in Figure 5.10.


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_165_1.png)


    FIGURE 5.10 Validation for email


    Using <input type="url" /> creates a special input field for entering URLs. You
    get the touch keyboard in Figure 5.11 which includes special / and .com keys.


    > NOTE

    The touch keyboard only appears when you don''t have a keyboard attached to your
    machine or you explicitly open the touch keyboard.


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_165_2.png)


    FIGURE 5.11 Touch keyboard for URL


    An <input type="url" /> requires you to enter a valid URL. For example, the URL
    http://Superexpert.com and the URL ftp://Superexpert.com are valid, but the URL
    superexpert.com and the URL www.superexpert.com are not because they are not absolute
    URL (see Figure 5.12).


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_165_3.png)


    FIGURE 5.12 Validating a URL'
