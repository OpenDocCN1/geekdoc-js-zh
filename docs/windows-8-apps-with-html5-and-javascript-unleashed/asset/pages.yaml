    # NOTE


    The exact number of items loaded by the ListView depends on the number of items
    that can be displayed in a page. Notice that you use the ListView pagesToLoad
    property to specify the number of pages and not the number of items to load. The
    exact number of items loaded by the ListView depends on the width and height of
    the ListView and the width and height of the ListView items. The ListView will
    calculate the number of items it can show on the screen at a time (the page size).
    For example, if 10 items can be shown on the screen at a time, and the ListView
    pagesToLoad property is set to the value 5, then the ListView will load 70 items
    at a time (the extra 20 is for the previous and next page).


    # Summary


    This chapter was all about the ListView control. You learned how to take advantage
    of this control to display a collection of items in either a list or a grid.


    First, I explained the basic features of the control. You learned how to select,
    sort, filter, and group items in a ListView. I also discussed several advanced
    features of the control, including how to switch ListView item templates dynamically
    and how to load ListView items incrementally.


    In the next chapter, I show you how you can use a ListView control with different
    types of custom data sources including an IndexedDB data source and a Web Service
    data source.'
