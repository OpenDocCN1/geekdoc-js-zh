- img_proc: true
  md: '# What Is a Windows Store App?


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_24_0.png)


    FIGURE 1.4 The Settings charm


    When you build a Windows Store app, you don''t build your own settings menu. Instead,
    you extend the charm with your custom app settings. I discuss the details of this
    doing in Chapter 6, "Menus and Flyouts."


    **Full Screen, Snapped, and Filled**nAWindows Store app can be in three different
    view states: Full screen, snapped, and filled. The default state is full screen—the
    app takes over all of the available screen real estate.


    You can switch between the different view states by pressing the keyboard combination
    Win+(period) or by swiping from the top-edge to the left edge of the screen or
    by moving to the top-left corner and dragging down.


    > **WARNING**

    You can switch to snapped state only on a Windows device with a horizontal resolution
    of 1,366 pixels or higher. Otherwise, there is not enough screen real estate to
    see more than one app at a time.


    FIGURE 1.5 shows two Windows 8 apps on the screen at one time. The Weather app
    is in a snapped state and the Internet Explorer app in a filled state. A snapped
    app always has a horizontal resolution of 320 pixels. The filled app takes up
    the remainder of the screen real estate.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# CHAPTER 1 Building Windows Store Apps


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_25_0.png)


    FIGURE 1.5 Snapped and filled apps


    When building Windows Store apps, you need to design the app so it works in full
    screen, snapped, or filled state. At any moment, the horizontal resolution of
    your app could be dramatically changed. I discuss how to handle switching between
    different view states in Chapter 9, "App Events and States."


    # Closing a Windows Store App


    Now close a Windows Store app by moving your cursor over the x at the top-right
    of the screen. Ha! Tricked You! There is no close button in a Windows Store app
    because there is no chrome.


    > Even though it is not obvious how to close a Windows Store app, it is possible.
    You can close a Windows Store app by swiping down from the top of the screen to
    the very bottom of the screen or pressing the keyboard combination ALT+F4.


    When interacting with Windows Store apps, there is no obvious way to close an
    app. This is intentional. Instead of closing a Windows Store app, you are encouraged
    to simply switch to another running app (by swiping from the left edge of the
    screen) or launch a new app (by selecting a new app from the Start screen).


    When you design a Windows Store app, you must design the app with the knowledge
    that a user might switch back and forth to your running app at any time. In Chapter
    9, I discuss how you can gracefully resume an app after it has been suspended.'
  merge: -1
