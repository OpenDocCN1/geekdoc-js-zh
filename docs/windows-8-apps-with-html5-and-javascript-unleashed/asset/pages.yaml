  md: "```\nif (window.matchMedia(\"orientation:portrait\")).matches) {\n  console.log(\"\
    portrait\");\n} else {\n  console.log(\"landscape\");\n}\n```\n\nIf the matches\
    \ properties returns true, then the device is in portrait mode and the message\
    \ \"portrait\" is written to the Visual Studio JavaScript window. Otherwise, the\
    \ message \"landscape\" is written to the JavaScript Console window.\n\nYou can\
    \ create an event listener that triggers code whenever the results of a media\
    \ query change. For example, the following code writes a message to the JavaScript\
    \ Console when the current device is switched to Portrait mode:\n\n```\nwindow.matchMedia(\"\
    orientation:portrait\").addListener(function (mql) {\n  if (mql.matches) {\n \
    \   console.log(\"Switched to portrait\");\n  }\n}\n```\n\nBe aware that the event\
    \ listener is triggered whenever the result of the media query changes. The event\
    \ listener is triggered both when you switch from landscape to portrait and when\
    \ you switch from portrait to landscape. For this reason, you need to verify that\
    \ the matches property has the true value before writing the message.\n\n# Defining\
    \ a Viewport\n\nYou can take advantage of the @ms-viewport rule to scale content\
    \ to fit device resolutions—devices with different widths and heights—automatically.\
    \ Using the @ms-viewport rule is also valuable when you want to scale content\
    \ to fit different view states such as snapped or filled.\n\nThe @ms-viewport\
    \ rule enables you to define a viewport. A viewport determines the width and height\
    \ of the available real estate used to display content independent of the actual\
    \ screen size.\n\nFor example, the following page displays some text and a picture\
    \ of a Tesla:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>viewport</title>\n\
    </head>\n<body>\n  <h1>A fast, red Tesla</h1>\n  <img src=\"../images/tesla.jpg\"\
    \ />\n</body>\n</html>\n```"
