  md: "// Create the IndexedDB data source\nvar moviesDataSource = new DataSources.IndexedDBDataSource(\"\
    movies\", createOptions);\n\nIn the code above, the creationOptions represent\
    \ the properties of an IndexedDB database, object store, and indices. If the database\
    \ does not already exist, the IndexedDB data source creates the database.\n\n\
    Here are the properties of the creationOption object:\n\n+   * databaseName—The\
    \ name of the IndexedDB database\n* databaseVersion—The version of the IndexedDB\
    \ database\n* indexNames—An index is created for each property name in this array.\n\
    \nWhen you create an instance of the IndexedDB data source, you also have the\
    \ option of supplying a cursorOptions object. The cursorOptions object filters\
    \ the object store. Here are the properties of the cursorOptions object:\n\n+\
    \   * indexName—Create a key range using this index.\n* only—Create a key range\
    \ and only return objects which match this value.\n* lowerBound—Create a key range\
    \ and only return objects which have a value greater than this lower bound.\n\
    * upperBound—Create a key range and only return objects which have a value less\
    \ than this upper bound.\n\nFor example, here is how you would filter tasks so\
