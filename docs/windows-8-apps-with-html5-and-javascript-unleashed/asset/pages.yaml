  md: "# 126 CHAPTER 4 Using WinJS Controls\n\nYou can combine multipie format specifies\
    \ in a single format string. For example, if you want to display only the day\
    \ of the month by the day of the month and the day of the week, and not only the\
    \ year but the year and the era, then you can declare the DatePicker like this:\n\
    \n```\n<div id=\"dateBirthday\">\n  data-win-control=\"WinJS.UI.DatePicker\">\n\
    \  data-win-options=\"{\n    monthPattern: '{month.integer(2)} - {month.full}',\n\
    \    datePattern: '{day.integer(2)} dayofweek.abbreviated}',\n    yearPattern:\
    \ '{year.full} {era.abbreviated}'\n  }\"\n</div>\n```\n\nNote that the format\
    \ for the monthPattern includes a dash (-). You can throw in any extra characters\
    \ that you need within a format string (see Figure 4.15).\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_139_0.png)\n\
