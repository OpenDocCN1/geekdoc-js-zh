    In the form above, the contenteditable attribute is applied to DIV element with
    the id inEssay. The contenteditable attribute makes the content of the DIV element
    editable (see Figure 5.16).


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_169_0.png)


