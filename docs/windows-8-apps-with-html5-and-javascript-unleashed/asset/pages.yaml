  md: "decided to create an ASP.NET MVC 4 project. When creating the ASP.NET MVC 4\
    \ project, I selected the Web API project template (see Figure 8.3).\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_251_0.png)\n\
    \nFigure 8.3 Creating an ASP.NET MVC 4 project using the Web API project template\n\
    \nTo take advantage of an ASP.Net Web API service, you need to add the right routes\
    \ to the App_Start\\RouteConfig.cs file. These routes map incoming browser requests\
    \ to the correct API controller and API action.\n\nI added the following routes\
    \ to the App_Start\\RouteConfig.cs file:\n\n```\nroutes.MapHttpRoute(\n    name:\
    \ \"TasksGetCount\",\n    routeTemplate: \"api/tasks/getCount\",\n    defaults:\
    \ new { controller=\"tasks\", action=\"getCount\" }\n);\n```\n\n```\nroutes.MapHttpRoute(\n\
    \    name: \"TasksItemsFromIndex\",\n    routeTemplate: \"api/tasks/itemsFromIndex\"\
    ,\n    defaults: new { controller = \"tasks\", action = \"itemsFromIndex\" }\n\
    );\n```\n\n```\nroutes.MapHttpRoute(\n    name: \"TasksInsertAtEnd\",\n    routeTemplate:\
    \ \"api/tasks/insertAtEnd\",\n    defaults: new { controller = \"tasks\", action\
    \ = \"insertAtEnd\" }\n```"
