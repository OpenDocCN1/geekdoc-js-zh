  md: "```\nconsole.log(\"Activated from a search\");\nbreak;\ndefault:\n    console.log(\"\
    Activated for some other reason\");\n}\n});\n```\n\nThe most common way in which\
    \ a Windows Store app is activated is when a user clicks the tile for the app\
    \ in the Start screen. In that case, the ActivationKind enumeration has the value\
    \ Launch.\n\nHowever, there are other ways that a Windows Store app can be activated.\
    \ For example, an app can be activated in response to a user performing a search\
    \ from the Search charm, or in response to a user sharing something from the Share\
    \ charm, or in response to a user clicking on a file from another app like an\
    \ email app. In these cases, you can use the ActivationKind property to determine\
    \ the exact reason that the app was activated.\n\n# Handling the Error Event\n\
    \nBy default, when there is an unhandled error in a Windows Store app—an error\
    \ which is not handled within a try...catch block—the following things happen:\n\
    \n+   1. The error is logged by calling the WinJS.log() method\n\n+   2. The debugger\
    \ statement is called to break into the debugger when the app is running in Visual\
    \ Studio Debug mode.\n\n+   3. The app is terminated by calling the MSApp.terminateApp()\
    \ method.\n\nAfter the terminateApp() method is called, the user is thrown back\
    \ to the Windows Screen (violently, and without explanation).\n\nYou can handle\
    \ the application error event to provide a better user experience. For example,\
    \ here is how you can display a message to the user when an unhandled error happens:\n\
    \n```\nWinJS.Application.addEventListener(\"error\", function (evt) {\n    var\
    \ message = new Windows.UI.Popups.MessageDialog(\n        \"There was an error.\"\
    \n    );\n    message.showAsync();\n    return true;\n});\n```\n\n```\nWinJS.Application.addEventListener(\"\
    ready\", function ( ) {\n    throw new WinJS.ErrorName(\"MyError\", \"Yikes! An\
    \ Error!\");\n});\",\n```\n\n```\nWinJS.Application.start();\n```"
