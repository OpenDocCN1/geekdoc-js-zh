  md: '# Installing the Live SDK


    Don''t let the title of the website—Windows Push Notifications & Live Connect—confuse
    you; this is the right place. Follow the instructions at the website to register
    your Windows Store app. Don''t forget to follow the instructions in Step 3 for
    updating the information in your Windows Store app''s manifest.


    After you register, your client secret is displayed (see Figure 11.2). Record
    this client secret because you will need it later (use it with the web service).


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_308_0.png)


    FIGURE 11.2 Getting the client secret


    > NOTE

    I hope this goes without saying, but keep your client secret secret. I regenerated
    the one that see in the screenshot.


    You need to configure one more thing. You must enter your Redirect Domain by visiting
    the following website: https://manage.dev.live/Applications/Index.


    Click on your application name, click Edit Settings, click the API Settings tab,
    and enter a value for the Redirect Domain field. You can enter any domain that
    you please just as long as the domain has not already been taken (see Figure 11.3).


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_308_1.png)


    FIGURE 11.3 Creating the Redirect Domain


    For the purposes of the code in this chapter, I entered the Redirect Domain http://livesdkdemo.supersecret.com.'
