  md: "In the previous code, the Promise completes after 3 seconds (3000 milliseconds).\
    \ The Promise returned by the timeout() method does not support promise events.\
    \ Therefore, the only message written to the console is the message \"complete\"\
    \ after 10 seconds.\n\n# Canceling Promises\n\nSome promises, but not all, support\
    \ cancellation. When you cancel a promise, the promise's error callback is executed.\n\
    \nFor example, the code in Listing 2.12 uses the WinJS.xhr() method to perform\
    \ an Ajax request. However, immediately after the Ajax request is made, the request\
    \ is cancelled.\n\nLISTING 2.12 Canceling a Promise (promiseCancel\\promiseCancel.html)\n\
    \n```\n// Specify Ajax request options\nvar options = {\n  url: \"http://StephenWalther.com\"\
    \n};\n\n// Make the Ajax request\nvar request = WinJS.xhr(options).then(\n  function\
