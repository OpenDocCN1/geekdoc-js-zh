    # Using Media Queries


    You can take advantage of media queries in conjunction with Cascading Style Sheets
    to adapt to different view states automatically. You can use media queries to
    detect the characteristics of a device and modify the presentation of content.


    > NOTE

    Media queries is a W3C recommendation. You can use media queries not only with
    Windows Store apps, but also with normal websites. Media queries are supported
    by Google Chrome 4+, Mozilla Firefox 3.5+, Apple Safari 4+, and Microsoft Internet
    Explorer 9+-.


    Imagine, for example, that you want to display different content depending on
    the horizontal resolution of a device. In that case, you can group styles by using
    the @media rule.


    For example, the following HTML page contains three sets sets of style rules.
    One set applies to all devices, one set applies to medium resolution devices,
    and one set applies to high resolution devices:'
  merge: -1
