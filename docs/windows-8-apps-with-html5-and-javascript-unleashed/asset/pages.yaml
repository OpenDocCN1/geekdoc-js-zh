  md: '# Introduction


    If you want to build a software application and reach the largest possible market
    of customers and make the most money, then it makes sense to build a Windows 8
    app.


    Microsoft Windows is the the most popular operating system in the world. Windows
    accounts for more than 90% of the operating system market. As of June 2012, over
    600 million licenses for Windows 7 have been sold. The size of the Windows market
    dwarfs the size of every other marketplace for software applications (including
    the iPhone and Android markets).


    Now, it is true that not everyone who is using earlier versions of Windows will
    upgrade to Windows 8. But, it is fairly safe to predict that a very large number
    of people will make the jump. Microsoft CEO Steve Ballmer—admitted, not the most
    unbiased of people—predicts that than 500 million people will be using Windows
    8 by the end of 2013.


    I want to own a toilet made of solid gold, Nathan Myhrv''s jet, and a Tesla Roadster
    (orange). These are modest goals and I know that many of you reading this book
    share the same goals. The most likely way for you or me (hopefully me) to reach
    these goals is to build Windows 8 apps.


    When you build a Windows 8 app, you can sell your app right within Windows 8 itself.
    Windows 8 includes the Windows Store where you can list your app for anywhere
    between free and $999.99. You can sell a variety of different types of apps including
    productivity apps (think time trackers and contact managers) and games (think
    Angry Birds and Cut the Rope).'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Store


    Spotlight


    Games >


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_15_0.png)


    FIGURE I.1


    This book is all about building Windows Store apps that you can sell in the Windows
    Store. In particular, you learn how to build Windows Store apps using JavaScript
    and HTML5.


    Why JavaScript and HTML5? You can build Windows Store apps using other technologies
    as C# or XAML or C++, but this book focuses exclusively on building Windows Store
    apps with JavaScript and HTML5.


    The advantage of building Windows Store apps with JavaScript and HTML5 is that
    you can leverage your existing skills building websites to build Windows applications.
    If you are already comfortable programming with JavaScript, HTML, and Cascading
    Style Sheets, then you should find it easy to build Windows Store apps.


    This book covers everything you need to build Windows Store apps. You learn how
    to use the Windows Library for JavaScript (WinJS) to create Windows Store apps.
    In particular, you learn how to use WinJS controls such as the Rating, Menu, and
    ListView controls.


    You also learn how to work with the Windows Runtime. By taking advantage of the
    Windows Runtime, you can access Windows 8 functionality to do things that you
    could not normally in a pure web app, such as capture video and sound.


    By the end of this book, you will understand how to create Windows Store apps
    such as productivity and game apps. For example, in Chapter 7 and 8, you learn
    how to use the ListView control to create a simple task list app. And, in Chapter
    12, you learn how to create a simple arcade game—the Brain Eaters game.


    Read this book, build a Windows Store app, sell lots of copies, and buy a jet.'
  merge: -1
  pgno: 15
