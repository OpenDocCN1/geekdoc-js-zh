    # Retrieving Basic User Information


    There is a wealth of user information that you can retrieve from Live Connect
    including the user''s name, birthday, email addresses, and list of friends. In
    this section, I demonstrate how you can retrieve this information by taking advantage
    of the WL.api() method.

    The WL.api() method enables you to interact with the Live Connect REST API. When
    you call the WL.api(), you can supply the following options:


    +   - path—A path to a REST object.

    - method—An HTTP method as GET, POST, MOVE, COPY.

    - body—The body of the request (serialized to JSON).

    - type—Used when creating folders or albums.


    The path object is the most important option because it determines the object
    you are interacting with. For example, if you want to get the user''s photo, then
    you need to supply the path "me/picture". If you want to set a user''s status
    message, then you would use the path "me/share" (me refers to the current user).'
