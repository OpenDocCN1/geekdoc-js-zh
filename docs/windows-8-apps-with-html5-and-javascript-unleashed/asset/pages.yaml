  md: "# Filtering Items in a ListView Control\n\nYou can filter the items displayed\
    \ in a ListView by filtering the items in the data source associated with the\
    \ ListView. For example, when browsing through a large set of products, you might\
    \ want to enable a user to filter the products by only showing products which\
    \ match a filter string (See 7.13).\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_219_0.png)\n\
    \nFIGURE 7.13 Filtering a list of products\n\nYou can take an existing WinJS.Binding.List\
    \ and create a new filtered WinJS.Binding.List by calling the createFiltered()\
    \ method. This method accepts a filter function which returns either the true\
    \ value or false depending on whether an item from the original list should be\
    \ included in the new list.\n\nThe code in Listings 7.9 and 7.10 illustrates how\
    \ to use the createFiltered() method to create a keyup search form. The page in\
    \ Listing 7.9 contains an input box and a ListView control.\n\nLISTING 7.9 Filtering\
    \ a List of Products (filtering\\filtering.html)\n\n```\n<div>\n  <input id=\"\
    inputFilter\" />\n</div>\n<div id=\"tmplProduct\">\n  data-win-control=\"WinJS.Binding.Template\"\
    >\n    <div class=\"productItem\">\n      <h2>data-win-bind=\"innerText:name\"\
    ></h2>\n      Price: <span data-win-bind=\"innerText:price\"></span>\n    </div>\n\
    \  </div>\n</div>\n\n<div id=\"lvProducts\">\n  data-win-control=\"WinJS.UI.ListView\"\
    \n  data-win-options=\"{\n    itemTemplate: select('#tmplProduct')\n  }\">\n</div>\n\
    ```"
  merge: -1
