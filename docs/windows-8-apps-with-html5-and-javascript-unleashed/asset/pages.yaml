  md: 'By default, System settings—such as network and volume settings—appear at the
    bottom of the Settings window. Permission settings also appear automatically.
    Finally, if you did in fact get your Windows Store app from the Windows Store,
    then the Settings window will also include Rate and review settings.


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_189_0.png)


    FIGURE 6.9 Default settings


    You can add custom settings to the Settings window for your app. These custom
    settings can be configuration settings such as user preferences. The custom settings
    might also include information about your app, including Help and About pages.


    You create custom app settings with the help of the SettingsFlyout control. For
    each app settings section that you want to create, you create a separate HTML
    file which contains SettingsFlyout. I''ll demonstrate how this works by creating
    both About Page settings and Personal settings.


    # Creating About Page Settings


    Most apps include an About Page which provides information about the company who
    built the application. The About Page is purely informational (see Figure 6.10).'
