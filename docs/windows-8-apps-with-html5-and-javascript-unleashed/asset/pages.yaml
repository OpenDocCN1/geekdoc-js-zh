    +   - Expiration—For example, 7/31/2012 12:51:31 AM

    - expUnixTime—For example, 1343695891

    - Issuer—For example, "urn:windows:liveid"

    - UserID—For example, "ed63ad02ac2a8522d56e2fa9886998532"

    - Version—For example, 1


    The UserId property is particularly valuable because you can use the UserId to
    uniquely identify a user and associate data in a web service with that user. The
    UserId is a unique value like "ed63ad02ac2a8522d56e2fa9886998532"—unfortunately,
    it is not the user name or email address.

    The code in Listing 11.9 demonstrates how you can extract the value of the UserID
    property from an authentication token.


    # LISTING 11.9 Retrieving the User ID


    ```

    // Get the user id

    var authenticationToken = Request.Headers.GetValues("authenticationToken");

    FirstOrDefault();

    var clientSecret = WebConfigurationManager.AppSettings["CLIENT_SECRET\nvar d =
    new Dictionary<int, string>();

    var myJWT = new JsonToken(authenticationToken, d);

    var user = myJWT.Claims.UserId;

