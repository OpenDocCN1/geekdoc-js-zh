  md: "# Using the required Attribute\n\nThe following HTML form illustrates how you\
    \ can use the required attribute:\n\n```\n<form>\n  <div>\n    <label>\n     \
    \ Social Security Number:\n      <input id=\"ssn\" required />\n    </label>\n\
    \  </div>\n  <div>\n    <input type=\"submit\" />\n  </div>\n</form>\n```\n\n\
    If you submit the form above, and you do not enter a value for the ssn field,\
    \ then you get the error message depicted in Figure 5.1. The input field has a\
    \ red border surrounding it and a callout message is displayed.\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_155_0.png)\n\
    \nFIGURE 5.1 Using the required validation attribute\n\n# Using the pattern Attribute\n\
    \nYou use the pattern attribute to validate the value entered into an input field\
    \ against a regular expression pattern. For example, the following HTML form validates\
    \ the social security number against a regular expression:\n\n```\n<form>\n  <div>\n\
    \    <label>\n      Social Security Number:\n      <input id=\"ssn\"\n       \
    \ required\n        pattern=\"\\d{3}-\\d{2}-\\d{4}\"\n        title=\"###-##-####\"\
    \ />\n    </label>\n  </div>\n  <div>\n    <input type=\"submit\" />\n  </div>\n\
    </form>\n```"
