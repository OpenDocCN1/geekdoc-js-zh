  md: '# Creating Multipage Apps 287


    +   * navigate()—Enables you to navigate to a particular page (Page Control).
    You can also supply a custom object which represents the initial state of the
    page.


    And, you can use the following properties with navigation:


    +   * canGoBack—Returns true when you can navigate back.

    * canGoForward—Returns true when you can navigate forward.

    * history—Returns an object which represents all of the history entries. The history
    object has a current, backStack, and forwardState property.

    * location—Returns the URL associated with the current page.

    * state—Returns the state associated with the current page.


    Finally, the Navigation API supports the following three navigation events:


    +   * beforenavigate

    * navigating

    * navigated


    For each of these three events, you can use the event detail property to read
    the location and state properties.


    # Understanding the PageControlNavigator Control


    The PageControlNavigator control is included with the Navigation App, Grid App,
    and Split App Visual project templates—but is not included with the Blank App
    or Fixed Layout App templates. This control does two main things.


    First, the PageControlNavigator control handles the navigated event and takes
    care of loading the right Page Control in response to this event. For example,
    if you call WinJS.Navigation.navigate("/pages/somePage/somePage.html") then the
    PageControlNavigator control loads the somePage.html Page Control into the default
    html page.


    Second, this control enables or disables the back button. If WinJS.Navigation.canGoBack
    has the true value, then the back button is enabled. Otherwise, the back button
    is disabled.


    # Understanding Navigation State


    When building a multipage app with the Navigation API, you can take advantage
    of Navigation state to preserve your state as you navigate back and between pages.
    Each entry in history has a state property associated with it. You can assign
    whatever value you want to this state property.


    Imagine, for example, that you are building a simple product catalog. The app
    consists of only two pages: a home page which displays a list of categories and
    a details page which'
