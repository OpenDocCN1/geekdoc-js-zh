    };\n```\n\nThe GetCount() method returns the total number of tasks stored in the\
    \ Tasks database notice. Notice that the GetCount() method is decorated with an\
    \ [HttpGet] attribute. This attribute enables you to invoke the GetCount() method\
    \ by performing an Ajax GET request.\n\nThe Remove() controller action looks like\
    \ this:\n\n```\n[HttpDelete]\npublic bool Remove(string key)\n{\n  var id = int.Parse(key);\n\
    \  _db.Tasks.Remove(_db.Tasks.Find(id));\n  _db.SaveChanges();\n  return true;\n\
    }\n```\n\nThe Remove() controller action accepts a key argument which represents\
    \ the item to be deleted. The key must be a string argument because the WinJS\
    \ ListView/data source requires keys to be strings."
