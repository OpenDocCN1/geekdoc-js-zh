  md: '# Summary


    This chapter was all about displaying JavaScript objects in a page. In the first
    section, you learned about observables. In particular, you learned how observables
    enable you to detect when a property of a JavaScript object changes automatically.
    We also discussed how you can use the WinJS.Binding.List object to detect different
    types of changes in an array of items.


    Next, you learned how to take advantage of declarative data binding with both
    normal JavaScript objects and observable JavaScript objects to display the values
    of JavaScript properties in a page.


    Finally, I discussed how you can use WinJS templates to format and display an
    array of objects. You learned how to create templates both imperatively and declaratively.'
