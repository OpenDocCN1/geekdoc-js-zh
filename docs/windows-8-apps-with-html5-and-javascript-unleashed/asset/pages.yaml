    # # Summary\n\nIn this chapter, I focused on creating custom data sources which\
    \ you can use with the controls in the WinJS library. You learned how to derive\
    \ a new data source from the base VirtualizedDataSources class.\n\nI discussed\
    \ three custom data sources. First, I created a file data source which enables\
    \ you to store and retrieve data from your computer's file system. Next, I created\
    \ a web service data source which enables you to interact with a remote web service.\
    \ Finally, I discussed how you can create a data source which works with IndexedDB."
