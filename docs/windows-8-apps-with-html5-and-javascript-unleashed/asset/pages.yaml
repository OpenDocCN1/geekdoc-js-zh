  md: "# Using HTML5 input Elements 153\n\nYou use the <input type=\"tel\" /> element\
    \ to enter phone numbers. Because there are so many different formats for phone\
    \ numbers, this input type does not perform any validation. Instead, you can use\
    \ <input type=\"tel\" /> to display a specialized touch keyboard for telephone\
    \ numbers (see Figure 5.13).\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_166_0.png)\n\
    \nFIGURE 5.13 Entering a telephone number\n\nFinally, there is <input type=\"\
    search\" />. There is really nothing to say <input type=\"search\" /> because\
    \ this input type behaves identically to <input type=\"text\" />. There is no\
    \ keyboard and no special validation.\n\n# Entering a Value from a List of Values\n\
    \nYou can use the new HTML5 list attribute to provide an auto-complete experience\
    \ for your users. For example, the following code provides a list of three suggestions\
    \ for car make:\n\n```\n<label>\nCar Make:\n<input id=\"inpCarMake\" list=\"dlCarMakes\"\
    \ />\n<datalist id=\"dlCarMakes\">\n  <option>BMW</option>\n  <option>Ford</option>\n\
    \  <option>Tesla</option>\n</datalist>\n</label>\n```\n\nThe list attribute points\
    \ at an HTML5 datalist element which contains the list of suggestions. When you\
    \ start entering text into the input element, you get the suggestions displayed\
    \ in Figure 5.14.\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_166_1.png)\n\nFIGURE\
    \ 5.14 Getting a list of suggestions"
