  md: '# CHAPTER 6


    # Menus and Flyouts


    # IN THIS CHAPTER


    +   - Using the Flyout Control

    - Using the Menu Control

    - Using the Appbar Control

    - Configuring App Settings

    - Displaying Windows Dialogs


    This chapter focuses on the topics of flyouts, menus, tool-bars, settings, and
    dialogs. You learn how to throw options at users and get their response.


    I start by explaining how you can use the Flyout Controls to display options within
    the body of the page. You learn how to display buttons, toggles, flyouts, and
    separators with a Menu control.


    Next, I discuss the app bar. The app bar is the standard location for placing
    application commands in a Windows Store app. You learn how to create both global
    and selection commands.


    You also learn how to configure your app settings. You learn how to take advantage
    of the SettingsFlyout control to extend the standard settings displayed by the
    Settings charm.


    Finally, I show you you can create modal dialogs with the MessageDialog class.
    You learn how to create warning dialogs and Yes/No dialogs.


    # Using the Flyout Control


    You use a Flyout control to display a popup in a page. The popup disappears as
    soon as you click outside of the popup (or press the ESC key). You can use the
    Flyout control to display information, display dismissals, or gather input.


    The Flyout control supports light dismiss. When you click outside the Flyout control,
    the control disappears automatically.'
  merge: -1
  pgno: 174
- img_proc: true
  md: "A common use for flyouts is to display warnings. For example, if your app happens\
    \ to include a “Delete All Data Forever” button, then it would be a good idea\
    \ to use a flyout to warn the user before all of the user data is deleted.\n\n\
    Another common use for flyouts is for displaying forms which appear inline in\
    \ a page. For example, the page in Listing 6.1 contains a Flyout control which\
    \ enables you to select a typeface (see Figure 6.1).\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_175_0.png)\n\
