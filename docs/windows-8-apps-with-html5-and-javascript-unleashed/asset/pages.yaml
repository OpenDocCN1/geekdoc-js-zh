  md: '# CHAPTER 1


    # Building Windows Store Apps


    # What is a Windows Store

    Store App?


    In this chapter, I introduce you to the basics of building Windows Store apps.
    I start off by explaining how a Windows Store app differs from a traditional Windows
    desktop application. You learn what makes a Windows Store app a Windows Store
    app.


    Feeling fearless and bold, and hoping that you too feel fearless and bold, I guide
    you through building your Windows Store app. You learn how to take advantage of
    the features of Microsoft Visual Studio 2012 to build, run, and debug a Windows
    Store app.


    +   - What is a Windows Store App?

    - Creating Your First Windows Store App

    - Elements of a Windows Store App

    - Debugging a Windows Store App

    - Publishing to the Windows Store


    Next, we dive into a discussion of the fundamental elements of a Windows Store
    app. You learn how a Windows Store app is forged of HTML5, JavaScript, the Windows
    Library for JavaScript, and the Windows Runtime.


    Finally, we get to the money part. I explain how you can publish your Windows
    Store app to the Windows Store and start collecting those dollars.


    # What is a Windows Store App?


    I can still remember the first time that I used an iPhone. When you scroll the
    screen on an iPhone, the screen actually bounces! When you add an email to the
    trash, the email gets stuck in the trashcan! It''s as if there is a little universe
    inside an iPhone and it follows our physical laws.


    For some reason—that I have not explored and I do not completely understand—this
    illusion that there is a second universe inside my iPhone makes me happy. It makes
    interacting with an iPhone fun.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# CHAPTER 1 Building Windows Store Apps


    Now we come to Windows. Except for the dancing card thing in Windows Solitaire,
    I can''t think of anything in Windows that has ever created this same sense of
    fun. I can''t remember the last time that Windows made me laugh or brought me
    joy. With Windows Store apps, Microsoft has finally acknowledged that user experience
    matters—in a big way. The heart of Windows Store apps is a set of user experience
    principles named the Microsoft design style principles. By embracing the Microsoft
    design style principles, you can create Windows Store apps that seem more alive
    and that are plea- to use.


    # Microsoft Design Style Principles


    Microsoft design style principles is a set of user experience design principles
    developed by Microsoft in the context of building the Windows Phone, Xbox Live,
    and the (now defunct) Zune. You also also see the Microsoft design principles
    applied to Microsoft websites as Microsoft SkyDrive and the Windows Azure Portal.
    Get ready. Here are:


    +   1. Show pride in craftsmanship.

    - Devote time and energy to small things that are seen often by many.

    - Engineer the experience to be complete and polished at every stage.


    +   2. Do more with less.

    - Solve for distractions, not discoverability. Let people be immersed in what
    they love and they will explore the rest.

    - Create a clean and purposeful experience by leaving only the most relevant elements
    on screen so people can be immersed in the content.


    +   3. Be fast and fluid.

    - Let people interact directly with content, and respond to actions quickly with
    matching energy.

    - Bring life to the experience, create a sense of continuity and tell a story
    through meaningful use of motion.


    +   4. Be authentically digital.

    - Take full advantage of the digital medium. Remove physical boundaries to create
    experiences that are more efficient and effortless than reality.

    - Embrace the fact that we are pixels on a screen. Design with bold, vibrant and
    crisp colors and images that go beyond the limits of real world material.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# What Is a Windows Store App?


    # 5. Win as one.


    +   - Leverage the ecosystem and work together with other apps, devices and the
    system to complete scenarios for people.


    +   - Fit into the UI model to reduce redundancy. Take advantage of what people
    already know to provide a sense of familiarity, control, and confidence.


    > NOTE

    The Microsoft design style principles were originally known as Metro design principles.
    This list of Microsoft design style principles was taken from http://msdn.microsoft.com/en-us/library/windows/apps/hh646420
    and http://msdn.microsoft.com/en-us/library/windows/apps/hh65424.aspx.


    When I first read these principles, my initial reaction was that they seemed overly
    abstract and squishy. Exactly the type of principles which would be created by
    beter wearing user experience guys.


    But then, when I saw how the principles were applied in practice—when building
    actual Windows Store apps—I started to develop a better appreciation for these
    principles.


    Take the “Do more with less” design principle. One of the distinctive features
    of a Windows Store app is the lack of chrome. Ironically, a Windows Store app
    is a Windows app without the window. Windows Store apps are full screen apps.


    This lack of chrome makes it easier to concentrate on the content of the application.
    For example, Windows 8 includes two versions of Internet Explorer: a desktop version
    and a fully-threaded Windows 8 version which follows the Microsoft design style
    principles.


    I really prefer using the Windows 8 version of Internet Explorer over the desktop
    version. When using the Windows 8 version, all you see is the web page which is
    the point of the application in the first place.


    Or consider the “Fast and fluid”. The reason I like interacting with my iPhone
    so much is the illusion of motion and this illusion is created by the judicious
    use of animations: On an iPhone, objects bounce and wobble.


    When building a Windows Store app, you are encouraged to take advantage of animations.
    For example, use the ListView control—which we discuss in detail later in this
    book—then you animate when you add or remove items. When you add an item to a
    ListView, it not appears, it glides into place. When you remove an item, it doesn''t
    just disappear, items above and below collapse into place.


    > NOTE

    There is a technical word for when a computer app imitates physical reality. The
    word is skeuomorphism.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Common Features of Windows Store Apps


    Windows Store apps are applications that follow the Microsoft design style principles.
    Furthermore, Windows Store apps are designed to run on the Windows 8 or Windows
    RT operating system.


    All Windows Store apps have a common set of features. Let me explain these features
    by pointing them out in the context of the Windows 8 version of Internet Explorer.


    Support for Keyboard, Mouse, Touch, and Stylus


    One of the most distinctive characteristics of a Windows Store app is its over-sized
    tiles and buttons and generous use of whitespace. All of this UI responsiveness
    makes Windows Store apps friendly to fingers.


    Windows Store apps are designed to work equally when used on a touch-only tablet
    and when used on a desktop computer with a keyboard and mouse. Windows Store apps
    are designed to be gropable.


    The nice thing about how Windows 8 works is that you don''t need to put a lot
    of thought into supporting touch as a developer. As long as you stick with the
    standard WinJS controls, you get both keyboard and support for free.


    # Using the App Bar and Nav Bar


    Figure 1.1 contains a screenshot of the Windows 8 version of Internet Explorer
    with the home page of the New York Times open. Notice that the only thing that
    you see is the content of the New York Times. No toolbars, but no status bars.


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_21_0.png)


    Figure 1.1 Windows 8 Internet Explorer'
  merge: -1
