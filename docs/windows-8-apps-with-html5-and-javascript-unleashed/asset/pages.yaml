  md: '# # Windows 8 Apps with HTML5 and JavaScript UNLEASHED


    Already comfortable with JavaScript and HTML? Microsoft has just empowered you
    to build breakthrough apps for Windows ®. It''s a remarkable opportunity—and best-selling
    Microsoft development author Stephen Walther will show you how to take full advantage
    of it.


    Offering the same deep insight and practical code that has made his ASP.NET Unleashed
    the #1 ASP.NET book of all time, Walther covers everything you need to build,
    test, and distribute outstanding Windows 8 software with JavaScript and HTML5.


    Walther clarifies the unique advantages Windows 8 offers to web developers. He
    guides you through using Microsoft''s new WinJS library to develop apps for Microsoft''s
    brand-new version of Windows—you learn how to use Windows templates, controls,
    and binding—you''ll find in-depth coverage of everything from displaying data
    with a ListView to supporting SkyDrive cloud storage, creating games using IndexedDB
    and HTML5 forms.


    If you''re a developer, Windows 8 gives you many of potential users—and you already
    have the skills you''ll need to reach them. Get this by, master the tools and
    techniques you don''t already know—and go that figure have a new market!


    # Detailed information on how to...


    +   - Get your app published in the Windows Store

    - Create apps that work great with touch, keyboard, stylus, and mouse

    - Use JavaScript controls such as the Tooltip, Rating,st, and FlipView controls

    - Thoroughly master the WinJS ListView to display, sort, and filter data

    - Use HTML5 Canvas to build arcade games

    - Store data on the local file system, via remote web services, or in IndexedDB
    databases

    - Use Live Services to authenticate users, retrieve user profiles, and interact
    with SkyDrive

    - Create custom WinJS controls with Page Controls

    - Build apps that gracefully adapt to different screen resolutions and orientations

    - Take pictures from your webcam and play sounds


    **Stephen Walther**, former Senior Program Manager on the ASP.NET team, was responsible
    for the Microsoft Ajax Library and worked closely with the jQuery team. He now
    owns Superex, a software consulting and training company that builds applications
    with JavaScript, HTML5, and ASP.NET MVC for clients as Microsoft.


    Category: Programming/Windows Store Apps

    Covers: Windows Store Apps

    User Level: Intermediate-Advanced


