  md: "# Understanding Declarative Data Binding\n\n```\nvar product = {\n  name: \"\
    Tesla Roadster\",\n  price: 34,\n  photo: \"tesla.jpg\"\n};\n\nWinJS.Binding.processAll(null,\
    \ product);\n\ndocument.addEventListener(\"DOMContentLoaded\", initialize);\n\n\
    ```\n\nThere is nothing special about the product object in Listing 3.6—it is\
    \ just a plain old JavaScript object.\n\nNotice the call to WinJS.Binding.processAll()\
    \ in Listing 3.6. The declarative data binding attributes in a page are not processed\
    \ until you call this method. When you call the WinJS.Binding.processAll() method,\
    \ you must specify two parameters: the root element and the data context.\n\n\
    The root element determines which elements in a page get processed. If you pass\
    \ the null, then the entire document is parsed.\n\nThe data context contains the\
    \ data which you want to bind to the HTML attributes. In Listing 3.6, the product\
    \ object is passed to the WinJS.Binding.processAll() method as the data context.\n\
    \n> WARNING\nDon't call WinJS.Binding.processAll() until the document containing\
    \ the HTML elements has been loaded. Otherwise, there is nothing to process. In\
    \ Listing 3.6, the WinJS.Binding.processAll() method is called within a function\
    \ triggered by the DOMContentLoadedLoaded event.\n\n# Declarative Data Binding\
    \ and Observables\n\nDeclarative data binding and observables are a powerful combination.\
    \ If you use observables with data binding, then you can update the contents of\
    \ an HTML document automatically whenever you change the underlying JavaScript\
    \ objects.\n\nFor example, the HTML page in Listing 3.7 contains a SP and a BUTTON\
    \ element. The page displays the number of times the button has been clicked (see\
    \ Figure 3.6)."
