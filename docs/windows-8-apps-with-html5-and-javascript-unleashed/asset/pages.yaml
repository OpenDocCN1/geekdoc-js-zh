    both the billing and shipping address form fields. The values of all of the fields
    are assigned to an object named orders.


    > > WARNING

    Don''t forget to call WinJS.UI.processAll() or the HtmlControl will never become
    a control.


    > > NOTE

    In a Windows Store app, you can''t use a server-side #INCLUDE directive to include
    content from other files. If you want to include content, then you need to use
    an HtmlControl.


    # # Creating a Page Control


    A Page Control, as its name suggests, enables you to create a control from a page.
    A Page Control provides you with an easy method of creating custom WinJS controls.
    When you create a Page Control, you create a new WinJS control out of an HTML
    page, JavaScript file, and CSS file.


    Creating a new Page Control makes sense when you need to do more than simply add
    a chunk of HTML to a page. A Page Control enables you to encapsulate both appearance
    and behavior in a control.


    Furthermore, a Page Control has its own event lifecycle. For example, a Page Control
    has its own ready event which you can initialize the control.


    Imagine, for example, that you want to create an Alert control. When someone clicks
    the button rendered by the Alert control, a WinRT modal dialog appears which displays
    a message (see Figure 10.2). I''ll walk through each of the steps required to
    create the Alert control as a Page Control.'
  merge: -1
  pgno: 289
