  md: "# Passing an Authentication Token to a Web Service\n\nImagine that you want\
    \ to call a remote web service from your Windows Store app. For example, if you\
    \ are building a task list app, then you might want to call the remote service\
    \ to get a list of tasks associated with a remote database.\n\nHow do you authenticate\
    \ the user in the web service? You need to make sure that users cannot read each\
    \ other's tasks. Within the remote web service, you need a way to identify the\
    \ Windows Store app user who is requesting the tasks.\n\nWhen you log in using\
    \ the Live Connect API, you get an authentication token. The authentication token\
    \ includes a hash of your client secret (refer back to the section \"Registering\
    \ Your App\").\n\n> NOTE\nThe authentication token uses an open standard called\
    \ the JSON Web Token (JWT) standard. This standard is detailed at: http://tools.ietf.org/search/draft-jones-json-web-token-00.\n\
    \nYou can pass this authentication token to the remote service. Within the remote\
    \ web service, you can reproduce the hash using the client secret and verify the\
    \ authentication token.\n\nFollowing this process, you can securely identify the\
    \ user associated with a web service call. Let me walk through this process step-by-step.\n\
    \n# Sending the Authentication Token from a Windows Store App\n\nLet me start\
    \ with the Windows Store app. In Chapter 8, \"Creating Data Sources,\" I showed\
    \ how you can use a Web Service Data Source to communicate with a remote web service.\
    \ Let me use that Web Service Data Source again here.\n\nThe HTML page in List\
    \ 11.5 contains a ListControl which displays a list of tasks (see Figure 11.7).\n\
    \n# LISTING 11.5 HTML Page for Displaying a List of Tasks\n\n```\n<div id=\"tmplTask\"\
    \ data-win=\"WinJS.Binding.Template\">\n  <div class=\"taskitem\">\n    ID: <span\
    \ data-bind=\"innerText:id\"></span>\n    <br /><br />\n    Name: <span data-bind=\"\
    innerText:name\"></span>\n    <br /><br />\n    Date Created: <span data-bind=\"\
    innerText:dateCreated\"></span>\n  </div>\n</div>\n```"
  merge: -1
