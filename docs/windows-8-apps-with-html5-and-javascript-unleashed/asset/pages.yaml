- img_proc: true
  md: "# Using HTML5 Form Validation\n\nNotice that the ssn field has both a **required**\
    \ and **pattern** attribute. The **pattern** attribute\nis not triggered unless\
    \ you enter a value.\n\nNotice, furthermore, the ssn field includes a **title**\
    \ attribute. The **title** attribute\ncontains the format displayed by the pattern\
    \ error message.\n\nIf you enter an invalid social security number, then you get\
    \ the validation error message\ndisplayed in Figure 5.2.\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_156_0.png)\n\
    \nFIGURE 5.2 Using the **pattern** validation attribute\n\n> > **NOTE**\n> My\
    \ favorite site for finding regular expressions is located at http://regex.com.\n\
    \n# Performing Custom Validation\n\nIf you need to add custom validation rules\
    \ to a form element, then you can take advan-\nage the JavaScript `setCustomValidity()`\
    \ method. You can use this method to associate\na custom validation error message\
    \ with a form field.\n\nImagine, for example, that you have a complex set of rules\
    \ for validating a user name in\na user registration form. For example, you want\
    \ to ensure that the user name is a certain\nlength, unique in the database, and\
    \ does not contain special characters. This is a good\ncandidate for custom validation.\n\
    \nThe following HTML form includes a userName field:\n\n```\n<form>\n  <div>\n\
    \    <label>\n      User Name:\n      <input id=\"userName\" required />\n   \
    \ </label>\n  </div>\n  <div>\n    <input type=\"submit\" />\n  </div>\n</form>\n\
    ```"
