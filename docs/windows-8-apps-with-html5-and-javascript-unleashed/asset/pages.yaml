  md: "# Creating the Data Source Class\n\nThe easiest way to create a custom data\
    \ source is to derive a new class from the base VirtualizedDataSource class. For\
    \ example, you can use the following code to create a new data source named MyDataSources:\n\
    \n```\nvar MyDataSources = WinJS.Class.derive(\n  WinJS.UI.VirtualizedDataSource,\n\
    \  // Constructor\n  function () {\n    this._adapter = new MyDataAdapter();n\
    \    this._baseDataSourceConstructor(this._adapter);\n  }\n);\n```\n\nIn the code\
    \ above, two arguments are passed to the WinJS.Class.derive() method to create\
    \ the new DataSource class: a base class (WinJS.UI.VirtualizedDataSource) and\
    \ a constructor for the new class.\n\nIn the constructor for your derived VirtualizedDataSource\
    \ class, you call the _baseDataSourceConstructor() method with a data adapter.\
    \ The bulk of the work goes into building a custom data source goes into creating\
    \ this data adapter class.\n\n# Creating a Data Adapter\n\nYou create a data adapter\
    \ by implementing the IListDataAdapter interface. This interface has the following\
    \ methods:\n\n+   - change()\n- getCount()\n- insertAfter()\n- insertAtEnd()\n\
    - insertAtStart()\n- insertBefore()\n- itemsFromDescription()\n- itemsFromEnd()\n\
    - itemsFromIndex()\n- itemsFromKey()\n- itemsFromStart()\n- itemSignature()\n\
    - moveAfter()"
  merge: -1
  pgno: 237
- img_proc: true
  md: "# Creating Custom Data Sources\n\n+   - moveBefore())\n- moveToEnd()\n- moveToStart()\n\
    - remove())\n- setNotificationHandler()\n\nThe interface also includes the following\
    \ property:\n\n+   - compareByIdentity\n\nFortunately, you don't need to actually\
    \ implement all of these methods and properties. You can implement only the methods\
    \ that you need.\n\nFor example, if you want to create a simple, read-only, data\
    \ source, then you only need to implement the getCount() and itemsFromIndex methods.\
    \ If you want to create a more complicated, read-write, data source, then you\
    \ need to implement the change(), insertAtEnd(), and remove() methods.\n\nIn the\
    \ following sections, I describe how you can implement several of these methods\
    \ such as the getCount() and itemsFromIndex() methods.\n\n# Implementing the getCount()\
    \ Method\n\nThe getCount() should return the total number of records represented\
    \ by the data source. For example, if you are storing items in a JavaScript array,\
    \ then the getCount() method should return the length of the array:\n\n```\ngetCount:\
    \ function () {\n  return WinJS.Promise.wrap(this._arrayData.length);\n}\n```\n\
    \nThe getCount() must return a Promise. Therefore, you either need to wrap the\
    \ value in a Promise using WinJS.Promise.wrap() or you need to create a new Promise\
    \ object.\n\n# Implementing the itemsFromIndex() Method\n\nThe itemsFromIndex()\
    \ method returns a set of items from the data source. Three arguments are passed\
    \ to this method:\n\n+   - requestIndex—The index of the first item to retrieve\
    \ from the data source.\n\n+   - countBefore—The number of items before the requested\
    \ index to retrieve from the data source.\n\n+   - countAfter—The number of items\
    \ after the requested index to retrieve from the data source."
  merge: -1
  pgno: 238
- img_proc: true
  md: "The countBefore and countAfter parameters are intended to be interpreted as\
    \ hints. You can return more than the countBefore or countAfter number of items\
    \ if you wish.\n\nHere's a simple implementation of the itemsFromIndex() method.\
    \ This method returns a portion of JavaScript array.\n\n```\nfunction itemsFromIndex(requestIndex,\
    \ countBefore, countAfter) {\n  var startIndex = Math.max(0, requestIndex - countBefore);\n\
    \  var subItems = this._arrayData.slice(startIndex);\n  return WinJS.Promise.wrap(\n\
    \    items: subItems,\n    offset: requestIndex - startIndex,\n    totalCount:\
    \ this._arrayData.length\n  ));\n}\n```\n\nThe itemsFromIndex() method should\
    \ return an object that implements the IFetchResult interface. In the code above,\
    \ three properties of the IFetchResult are returned: items, offset, and totalCount.\n\
    \nThe items represents the array of items returned by the itemsFromIndex() method.\
    \ Each item in the items array must implement the IListItem interface. At the\
    \ very minimum, each item must have a key and a data property.\n\nThe offset property\
    \ represents the position of the item which corresponds to the requestIndex in\
    \ the array. If you return items before the requested index, then the offset will\
    \ be greater than 0.\n\nFinally, the totalCount property returns the total number\
    \ of items represented by the data source and not just the number of items being\
    \ returned.\n\nEach item in the items array returned by itemsFromIndex must implement\
    \ the IListItem interface. Here's a sample of the data returned from the itemsFromIndex()\
    \ method:\n\n```\n{\n  items: [\n    {key: \"1\", data: {name: \"wake up\"}},\n\
    \    {key: \"3\", data: {name: \"get out of bed\"}},\\n    {key: \"4\", data:\
    \ {name: \"drag the comb across my head\"}}\n  ],\n  offset: 0,\n  totalCount:\
    \ 30\n}\n```\n\nIn addition to items you can also implement the itemsFromDescription(),\
    \ itemsFromEnd(), itemsForKey(), or itemsFromStart() methods. Implementing these\
    \ additional methods for fetching data is optional."
  merge: -1
  pgno: 239
- img_proc: true
  md: "# Implementing the insertAtEnd() Method\n\nIf you want to support creating\
    \ new items, you should implement the insertAtEnd() method. Two arguments are\
    \ passed to this method, the key of the new item and the actual new item.\n\n\
    Here is a sample which JavaScript illustrates how you can use the insertAtEnd()\
    \ method to add a new item to a JavaScript array.\n\n```\ninsertAtEnd: function\
    \ (key, data) {\n  var newItem = {\n    key: (++this._maxKey).toString(),\n  \
    \  data: data\n  };\n  this._arrayData.push(newItem);\n  return WinJS.Promise.wrap(newItem);\n\
    }\n```\n\nTypically, you don't provide a key and you let the data source generate\
    \ the key for you. Therefore, typically, you ignore the key argument. In the code\
    \ above, the key is generated by adding one to the previously generated key and\
    \ converting the result into a string.\n\n> WARNING\nData source keys must be\
    \ strings.\n\nNotice that the insertAtEnd() method returns the new item including\
    \ its key. The method should return an object that implements the IItem interface\
    \ wrapped in a promise.\n\n# Implementing the remove() Method\n\nIf you need the\
    \ ability to delete an item from a data source, then you need to implement the\
    \ remove() method. The key of the item being removed is passed to the method and\
    \ the method returns nothing if the item is removed.\n\nHere's some sample code\
    \ which removes an item from an array:\n\n```\nremove: function (key) {\n  var\
    \ i = this._getIndexFromKey(key);\n  this._arrayData.splice(i, 1);\n  return WinJS.Promise.wrap(null);\n\
    }\n```\n\n```\n_getIndexFromKey: function (key) {\n  for (var i = 0; i < this._arrayData.length;\
    \ i++) {\n    if (this._arrayData[i].key == key) {\n      return i;\n\t\t\t}\n\
    \  }\n}\n```"
  merge: -1
  pgno: 240
- img_proc: true
  md: "# Implementing the change() Method\n\nIf you need to support editing items\
    \ in a data source, then you need to implement the change() method. Three arguments\
    \ are passed to the change() method: the key of the item being edited, the new\
    \ value of the item being edited, and the index of the item being edited.\n\n\
    Here's some sample code for implementing the change() method:\n\n```\nchange:\
    \ function (key, data, indexHint) {\n  var newItem = {\n    key: key,\n    data:\
    \ data\n  };\n  var i = this._getIndexFromKey(key);\n  this._arrayData[i] = data;\n\
    \  return new WinJS.Promise.wrap(null);\n},\n\n_getIndexFromKey: function (key)\
    \ {\n  for (var i = 0; i < this._arrayData.length; i++) {\n    if (this._arrayData[i].key\
    \ == key) {\n      return i;\n    }\n  }\n}\n\n}\n\n}\n\n}\n```\n\nNote that the\
    \ change() method returns an empty promise. The method just completes without\
    \ returning anything special.\n\n# Handling Errors\n\nIf there is an error when\
    \ inserting, removing, or changing an item, then you can return an EditObject.\
    \ You can return one of the following values:\n\n+   * WinJS.UI.EditError.canceled—Return\
    \ this error when the edit operation, for ever-reason, is canceled.\n\n+   * WinJS.UI.EditError.noResponse—Return\
    \ this error when the edit operation times out.\n\n+   * WinJS.UI.EditError.notPermitted—Return\
    \ this error when writing to a read-only data source.\n\n+   * WinJS.UI.EditError.noLongerMeaningful—Return\
    \ this error when the item has already changed."
  merge: -1
  pgno: 241
- img_proc: true
  md: "For example, when creating a read-only data source, you can create the insertAtEnd()\
    \ method like this:\n\n```\ninsertAtEnd: function (unused, data) {\n  return WinJS.Promise.wrapError(new\n\
    \  WinJS.ErrorFromName(WinJS.UI.EditError.notPermitted);\n}\n```\n\n# Implementing\
    \ the setNotificationHandler() Method\n\nThe setNotificationHandler() method enables\
    \ you to raise notifications when the status of a data source changes. You can\
    \ call any of the following methods:\n\n+   - beginNotifications()\n- changed()\n\
    - countChanged()\n- endNotifications()\n- indexChanged()\n- inserted()\n- invalidateAll()\n\
    - itemAvailable()\n- moved()\n- reload()\n- removed()\n\nYou don't need to raise\
    \ these notifications when using the standard data adapter methods such as the\
    \ insertAtEnd(), remove(), and change() methods discussed above. However, you\
    \ will need to raise these notifications when you add a custom method to your\
    \ data source.\n\nImagine, for example, that you want to add a nuke() method to\
    \ your data source. When you call the nuke() method, all of the data is removed\
    \ from your data source.\n\nHere's how you would implement the nuke() method in\
    \ the data adapter class:\n\n```\nsetNotificationHandler: function (notificationHandler)\
    \ {\n  this._notificationHandler = notificationHandler;\n},\n\nnuke: function\
    \ () {\n  this._arrayData = [];\n  this._notificationHandler.reload();\n}\n```"
  merge: -1
  pgno: 242
- img_proc: true
  md: "In the code above, the setNotificationHandler() method assigns the predefined\
    \ notificationHandler method to a variable named _notificationHandler. This makes\
    \ this predefined notificationHandler method available to all of the methods in\
    \ the data adapter.\n\nThe nuke() method, our custom method, sets the data source\
    \ array to an empty array and calls the notificationHandler reload() method. If\
    \ you don't call reload() then the ListView bound to the data source won't clear\
    \ its items.\n\nHere's how you can expose the custom nuke() method from a data\
    \ source:\n\n```\nvar MyDataSource = WinJS.Class.derive(\n  WinJS.UI.VirtualizedDataSource,\n\
    \  // Constructor\n  function(fileName) {\n    this._adapter = new MyDataAdapter();\n\
    \    this._baseDataSourceConstructor(this._adapter);\n  },\n  // Instance methods\n\
    \  {\n    nuke: function () {\n      this._adapter.nuke();\n    }\n  }\n);\n```\n\
    \nMyDataSource class in the code above includes a nuke() method. The nuke() method\
    \ simply delegates to the data adapter nuke() method.\n\n# Creating a File Data\
    \ Source\n\nIn this section, I discuss how you can create a custom file data source.\
    \ The file data source stores and retrieves data from the file system.\n\n> NOTE\n\
    The complete source code for the FileDataSource is included in the GitHub source\
    \ code in a folder named file.\n\nThe FileDataSource includes implementations\
    \ of the getCount(), itemsFromIndex(), insertAtEnd(), remove(), and change methods.\n\
    \nWhen you call either the getCount() or itemsFromIndex() methods, the FileDataSource\
    \ loads data from the file system and calls JSON.parse() to parse the data into\
    \ a JavaScript array. The FileDataSource loads data in its _ensureData() method:"
  merge: -1
  pgno: 243
- img_proc: true
  md: "```\n_ensureData: function () {\n  var that = this;\n\n  // Attempt to return\
    \ cached data\n  if (this._cachedData) {\n    return WinJS.Promise.wrap(that._cachedData);\n\
    \  }\n\n  // Otherwise, load from file\n  return new WinJS.Promise(function (complete,\
    \ error) {\n    var local = WinJS.Application.local;\n    var def = {\"MaxKey\"\
    :-1,\"items\":[]};\\n    local.readText(that._fileName, def).done(function(fileContents)\
    \ {\n      that._cachedData = JSON.parse(fileContents);\n      complete(that._cachedData);\n\
    \    });\n  });\n}\n```\n\nThe readText() method reads a file from the file system.\
    \ If the file text does not exist, then the readText() method returns the value\
    \ def instead. In either case, the result of reading the file text is converted\
    \ into a JavaScript array with the help of the JSON.parse() method.\n\nWhen you\
    \ call the insertAtEnd(), remove(), or change() methods, the FileDataSource calls\
    \ JSON.stringify() to convert the data into a string. The FileDatasource saves\
    \ the data to the file system. The FileDataSource saves the data in its _saveData()\
    \ method:\n\n```\n_saveData: function (data) {\n  this._cachedData = data;\n \
    \ var local = WinJS.Application.local;\n  var str = JSON.stringify(data);\n  return\
    \ local.writeText(this._fileName, str);\n}\n```\n\nThe _saveData() method converts\
    \ the JavaScript array into a string with the help of a call to JSON.stringify().\
    \ Next, the string is saved to the file system by calling the writeText().\n\n\
    # Using the File Data Source\n\nImagine that you want to create a simple task\
    \ list app with the file data source. You want to be able to display a list of\
    \ existing tasks and create new tasks (see Figure 8.1)."
