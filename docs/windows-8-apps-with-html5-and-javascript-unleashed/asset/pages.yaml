    \ any JavaScript array.\n\nFor example, you can perform an Ajax request against\
    \ a remote server and retrieve an array of products. You can then display the\
    \ array of products using the List data source with the ListView control.\n\n\
    > NOTE\n of using either the WinJS.Binding.List or WinJS.UI.Storage data sources,\
    \ you can create a custom data source and use it with the ListView control. You\
    \ might want to create a custom data source, if you need to display data from\
    \ IndexedDB database with a ListView control. We create several custom data sources—including\
    \ an IndexedDB data source—in the next chapter.\n\nLet's look at how you can use\
