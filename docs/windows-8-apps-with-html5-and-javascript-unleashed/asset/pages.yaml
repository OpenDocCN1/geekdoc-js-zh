    \n| selectionchanged | iteminvoked |\n|---|--|\n| 'directSelect' | yes | yes |\n\
    | 'toggleSelect' | yes | yes |\n| 'invokeOnly' | no | yes |\n| 'none' | no | no\
    \ |\n\nNotice that both 'directSelect' and 'toggleSelect' raise the selectionchanged\
    \ and iteminvoked events. The difference between these values is that 'toggleSelect'\
    \ toggles the selected item and 'directSelect' does not.\n\n# Creating a Master/Detail\
    \ View\n\nImagine, for you want to create a master/detail view with two ListView\
    \ controls. The master ListView displays product categories and the details ListView\
