    the Solution Explorer window (Figure 1.8). When you create a new Windows Store
    app, you get a default.html file (in the root of your project), a default.js file
    (in the js folder), and a default.css file (in the css folder). These three files
    are the starting point for your app.


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_27_1.png)


