  md: "# Understanding Declarative Data Binding\n\nLISTING 3.8 Using Data Binding\
    \ with an Observable (dataBindingObservables\\dataBindingObservables.html)\n\n\
    ```\nfunction () {\n  \"use strict\";\n\n  function initialize() {\n    // Create\
    \ a view model\n    var viewModel = {\n      timesClicked: 0,\n      click: function\
    \ (evt) {\n        evt.preventDefault();\n        viewModel.timesClicked++;\n\
    \    }\n  }\n\n    // Make the view model observable\n    viewModel = WinJS.Binding.as(viewModel);\n\
    \n    // Bind the view model to the document\n    WinJS.Binding.processAll(null,\
    \ viewModel);\n  }\n\ndocument.addEventListener(\"DOMContentLoaded\", initialize);\n\
    ```\n\n}();\n\nThe viewModel object in Listing 3.8 has a property named timesClicked,\
    \ which is used to track the number of times the button has been clicked. The\
    \ viewModel object also has a method named click() which is used to update the\
    \ timesClicked property.\n\nThe viewModel is converted into an observable with\
    \ the help of the WinJS.Binding.as() method. Finally, the viewModel is bound to\
    \ the page and the data-win-bind attributes are processed by calling WinJS.Binding.processAll().\n\
    \n# Capturing the Contents of an HTML Form\n\nThe WinJS library does not support\
    \ two-way data binding. Change notification is one-way. If you want to capture\
    \ the contents of an HTML form, then you need to do the work of retrieving the\
    \ values of the form elements yourself.\n\nThe page in Listing 3.9 contains an\
    \ HTML form for creating a new product. It has two INPUT elements for the product\
    \ name and price (see Figure 3.7). The form uses a single data-win-bind attribute.\
    \ The FORM element has a data-win-bind attribute which wires up a form submit\
    \ handler."
