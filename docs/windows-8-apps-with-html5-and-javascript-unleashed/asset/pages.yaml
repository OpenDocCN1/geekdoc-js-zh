  md: '# WARNING


    By default, a ListView control will try to make each of its list items into an
    observable calling the WinJS.Binding.as() method. Unfortunately, this does not
    work on WinRT objects such as the items returned by the SyndicationClient class.
    You''ll get an exception if you try to bind WinRT objects to a ListView control.


    There are two ways to get around this problem. If you look closely at the template
    in Listing 7.3, you will notice that the blog title is bound using the WinJS.Binding.oneTime()
    converter. When you use this converter, the ListView control does not attempt
    to convert the items back into observables.


    Another solution to this problem would be to copy the array of WinRT objects into
    a new JavaScript array of JavaScript objects before binding to the ListView control.
    JavaScript objects, unlike WinRT objects, are happy to be made into observables.


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_203_0.png)


    Figure 7.2 Displaying a list of blog posts


    # Using List Layout versus Grid Layout


    The ListView control supports two layouts: grid layout and list layout. The default
    layout is grid layout. When a ListView displays items in grid layout, the items
    are displayed in multiple columns. If there are too many items to fit in the ListView
    then you scroll to the right to view the additional items (see Figure 7.3).


    # NOTE


    Under the covers, grid layout uses the W3C CSS 3 Grid Layout recommendation. You
    can read the details here: http://dev.w3.org/csswg/css3-grid-layout/",'
