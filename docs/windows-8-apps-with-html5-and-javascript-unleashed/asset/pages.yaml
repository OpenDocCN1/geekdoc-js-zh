    true\" />\n<add key=\"ClientValidationEnabled\" value=\"true\" />\n<add key=\"\
    UnobtrusiveJavaScriptEnabled\" value=\"true\" />\n<add key=\"CLIENT_SECRET\" value=\"\
    bjK0Xdm479wGLp-Ed2sy-09v8jRK6Wb\" />\n</appSettings>\n```"
