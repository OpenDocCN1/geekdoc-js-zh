    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_171_1.png)


    FIGURE 5.19 Displaying an animated ring of progress indicator


    If you want to control the size of an indeterminate progress indicator, then you
    can use the win-medium or win-large classes. For example, the following page contains
