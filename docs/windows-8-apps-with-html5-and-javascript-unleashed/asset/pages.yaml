  md: '# Declaring App Capabilities


    Before we can jump into writing code, there is one other thing which we must do
    first. We are building an app that takes pictures. That is scary. Potentially,
    an app could take pictures of you without your knowledge and send the pictures
    back to an evil hacker lurking on the Internet (or Steve Ballmer sitting behind
    his desk at Microsoft).


    When your app does something scary, you must declare that your app will do this
    thing up front so the user can consent. You declare the capabilities of your app
    in your application manifest file. You can open the editor for your application
    manifest by double-clicking the package.appmanifest file in the Solution Explorer
    window.


    Click the Capabilities tab to view all of the declared capabilities of your application.
    For example, if you want your app to be able to record from the computer microphone,
    then you need to select the Microphone capability, or if you want the app to be
    able to save new photos in the user''s Pictures library, then you need to select
    the Pictures Library capability. For our app, we need to enable the Webcam capability
    so we can take pictures (Figure 1.9).


    | Application UI | Capabilities | Declarations |

    | --- | --- | --- |

    | Use this page to specify system features or devices that your app can | | |

    | Capabilities: | Description: | |

    | [ ] Documents Library | Provides access to connected webcam More information
    |

    | [ ] Enterprise Authentication | | |

    | [x] Internet (Client) | | |

    | [ ] Internet (Client & Server) | | |

    | [ ] Location | | |

    | [ ] Microphone | | |

    | [ ] Music Library | | |

    | [ ] Pictures Library | | |

    | [ ] Private Networks (Client & Server) | | |

    | [ ] Proximity | | |

    | [ ] Removable Storage | | |

    | [ ] Shared User Certificates | | |

    | [ ] Videos Library | | |

    | [x] Webcam | | |


    Figure 1.9 Enabling the capability to take pictures


    When a user first runs our app, the user will need to consent to allowing the
    app to access the Webcam (see Figure 1.10). The user only needs to consent once.'
