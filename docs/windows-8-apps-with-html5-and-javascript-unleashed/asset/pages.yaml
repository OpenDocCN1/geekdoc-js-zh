    \nFIGURE 2.2 Derived robots\n\nIn the previous code, the constructor function\
    \ for the Robot class is never called. The Roomba and the AIBO constructor functions\
    \ are called instead. However, both the Roomba and AIBO classes inherit the `sayHello()`\
    \ method from the Base class.\n\n**Using WinJS.Class.mix()**\nAs an alternative\
    \ to using the `WinJS.Class.derive()` method, you can use the `WinJS.Class.mix()`\
    \ method. This method enables you to create mixins. A mix enables you to combine\
    \ methods from multiple JavaScript objects into a single object.\n\nBehind the\
    \ scenes, the `WinJS.Class.derive()` method which we discussed in the previous\
    \ sections uses prototype inheritance and prototype inheritance has performance\
    \ drawbacks. Following a prototype chain requires processor time. Therefore, the\
    \ suggestion is that you should avoid prototype inheritance by using mixins.\n\
    \nWhen you use a mix instead of prototype inheritance, the methods and properties\
    \ are combined into a single object. You don't get a long prototype chain.\n\n\
    The `WinJS.Class.mix()` method has the following parameters:\n\n+   - constructor—a\
