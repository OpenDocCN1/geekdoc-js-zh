  md: "# Authenticating a User\n\nThe most valuable service that Live Connect provides\
    \ you is authentication. Live Connect supports something called zero-click single\
    \ sign-on.\n\nIf you log into your Windows 8 computer using your Windows Live\
    \ account, or your Windows Live Account is associated with your Windows account,\
    \ then you don't need to sign in to Windows Live when using a Windows Store app.\
    \ You never need to enter your user name or password when running a Windows Store\
    \ app.\n\nNOTE\nThe first time that the user accesses your Windows Store app,\
    \ the user does need to give permission to the Windows Store app to sign in automatically\
    \ (refer back to Figure 11.4). However, the user does not need to enter their\
    \ credentials.\n\n# Using WL.login()\n\nThere are two ways to log into Live Connect:\
    \ programmatically or declaratively. You can use the WL.login() method or use\
    \ the WL.UISign control. If you want to authenticate the user immediately after\
    \ your app starts up, then you should use the WL.login() method.\n\nFor example,\
    \ the code in Listing 11.2 illustrates how you can log in for the current user.\
    \ If everything works, then the message \"Connected\" is displayed in the page.\n\
    \nLISTING 11.2 Using the WL.login() Method\n\n```\nfunction () {\n  \"use strict\"\
    ;\n\nvar REDIRECT_DOMAIN = \"http://liveSDKDemo.Superexpert.com\";\n\nfunction\
    \ init() {\n  var REDIRECT_DOMAIN = \"http://liveSDKDemo.Superexpert.com\";\n\
    \  var spanResults = document.getElementById(\"spanResults\");\n\n  var scopes\
    \ = {\"wl.signin\"};\n  WL.init({\n    scope: scopes,\n    redirect_uri: REDIRECT_DOMAIN\n\
    \  });\n\n  WL.login().then(\n    function (loginResults) {\n      spanResults.innerText\
    \ = \"Connected\";\n    },\n    function (loginResponse) {\n```"
  merge: -1
