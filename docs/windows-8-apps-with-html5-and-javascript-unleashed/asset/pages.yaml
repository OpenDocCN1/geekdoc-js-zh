  md: "The JavaScript code in Listing 6.2 demonstrates how you can wire-up a button\
    \ so it opens a flyout. The button click handler handles the Flyout control's\
    \ show() method to display the flyout.\n\nWhen you call the show() method, you\
    \ should pass an anchor element. The anchor element defines where the Flyout will\
    \ appear in the page. In Listing 6.2, the Flyout is anchored to the button.\n\n\
    # LISTING 6.2 Displaying a Flyout (flyout\\flyout.js)\n\n```\nfunction () {\n\
    \  \"use strict\";\n\n  function initialize() {\n    WinJS.UI.processAll().done(function\
