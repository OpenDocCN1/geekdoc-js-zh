  md: '# Entering a Value from a Range of Values


    If you want to display a slider, then you can create an <input type="range" />
    element. For example, the following HTML form displays a slider which enables
    you to select a quantity of candy to buy:


    ```

    <label>

    Quantity of Candy:

    <input id="quantity"

    type="range"

    min="10"

    max="100"

    step="5"

    value="30"/>

    </label>

    ```


    The slider displays a range of values between 10 and 100 with 5 unit increments.
    The default value is set to 30 (see Figure 5.8).


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_164_0.png)


    FIGURE 5.8 Displaying a slider


    # Entering Email Addresses, URLs, Telephone Numbers, and Search Terms


    You can use the input types email, url, tel, and search to enable users to enter
    URLs, email addresses, telephone numbers, and search terms.


    If you use <input type="email"/>, and you are using the touch keyboard, then you
    get the specialized keyboard which includes @ and .com keys in Figure 5.9.


    FIGURE 5.7 Entering a number with the touch keyboard'
