  md: "# Sorting Items in a ListView Control\n\nFor example, the following code sorts\
    \ sorts a list of products in order of the product name:\n\n```\n// Create a List\
    \ of products\nvar listProducts = new WinJS.Binding([\n  { name: \"Bread\", price:\
    \ 2.20 },\n  { name: \"Cheese\", price: 1.19 },\n  { name: \"Milk\", price: 2.33\
    \ },\n  { name: \"Apples\", price: 5.20 },\n  { name: \"Steak\", price: 12.99\
    \ }\n]);\n\n// Sort the products\nvar sortedListProducts = listProducts.createSorted(function(item1,\
    \ item2) {\n  return item1.name > item2.name ? 1 : -1;\n});\n\n// Bind the list\
    \ of products to the ListView\nlvProducts.itemDataSource = sortedListProducts.dataSource;\n\
    ```\n\nThe code above uses the createSorted() method to create a new sorted data\
    \ source based on the original unsorted products data source. The ListView is\
    \ bound to the new data source instead of the original data source.\n\nIn the\
    \ code above, the products are sorted with the following sort function:\n\n```\n\
    function (item1, item2) {\n  return item1.name > item2.name ? 1 : -1;\n}\n```\n\
    \nA sort function sorts items by returning one of three possible values:\n\n+\
    \   - 0—When the two items should be sorted in the same order.\n- -1—When the\
    \ first item should be sorted before the second item.\n- 1—When the first item\
    \ should be sorted after the second item.\n\nThe sortedListData data source is\
    \ a live data source. If you add a new item to the listProducts data source, then\
    \ the new item will appear in the ListView in the right order. Changes to the\
    \ listProducts data source are picked up automatically.\n\n> NOTE\nYou can use\
    \ the same types of sort functions with the WinJS createSorted() method as you\
    \ would use with the standard JavaScript array sort() method."
  merge: -1
