  md: '# Running a Windows Store App


    Visual Studio provides you with three different options for running a Windows
    Store app:


    +   - Local Machine


    +   - Simulator


    +   - Remote Machine


    The Local Machine option runs a Windows Store app as if the app was installed
    on the local machine. The Windows Store app will run using the screen resolution
    and capabilities of your development machine (the machine running Visual Studio).


    The Simulator option runs your app in a separate window (see Figure 1.27). The
    advantage of using the simulator is that you can simulate different types of devices.
    For example, you can switch from mouse mode to basic touch mode to simulate a
    touch device such as a tablet PC. You can also switch to different screen resolutions
    to test your app at different resolutions.


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_47_0.png)


    FIGURE 1.27 Using the Visual Studio simulator


    The final option is to deploy and run your Windows Store app on a remote machine.
    Before you can run your app on a remote machine, you must first specify the remote
    machine name in the Project Property Pages window (see Figure 1.28).'
  merge: -1
  pgno: 47
