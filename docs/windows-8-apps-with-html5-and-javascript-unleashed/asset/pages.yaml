  md: '# CHAPTER 8


    # Creating Custom Data Sources


    # IN THIS CHAPTER


    +   - Creating Custom Data Sources


    +   - Creating a File Data Source


    +   - Creating a Web Service Data Source


    +   - Creating an Indexed Data Source


    The WinJS library includes two objects which you can use as data sources—the List
    and the StorageDataSource objects. If you need to use a ListView or FlipView with
    other types of data, then you need to write a custom data source.


    The goal of this chapter is to explain how you can write custom data sources.
    In this chapter, I explain how you can create three custom data sources:


    +   - FileDataSource—The file data source stores data on the local file system.


    +   - WebServiceDataSource—The web data source enables you to use a remote web
    service to retrieve and store data.


    +   - IndexedDBDataSource—The IndexedDB data source enables you to retrieve and
    store data using an IndexedDB database.


    The full source of these data sources is contained in the GitHub project for this
    book (https://github.com/StephenWalther/Windows8AppsUnleased).


    # Creating Custom Data Sources


    Let me by giving you an overview of how you can create a custom data source. In
    this section, I''ll explain how you can implement the methods of a custom data
    source which uses a JavaScript array to store data. I''ll walk through the constructor
    for this data source as well as the most important methods for this data source.
    After discussing this (overly simple) data source in this section, we''ll dive
    into building more practical data sources in later sections such as the web service
    data source and IndexedDB data source.'
