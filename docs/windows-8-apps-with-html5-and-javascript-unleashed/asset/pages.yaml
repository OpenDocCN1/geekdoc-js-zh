  md: "Notice that the Remove() method is decorated with an [HttpDelete] attribute.\
    \ The Remove() action can be invoked only with an HTTP DELETE request.\n\nThere\
    \ is one wrinkle when using non-standard HTTP methods such as the HTTP DELETE\
    \ or HTTP PUT methods. You must also add the following section to the ASP.NET\
    \ MVC application's root Web.config:\n\n```\n<system.webServer>\n  <modules runAllManagedModulesForAllRequests=\"\
    true\">\n  </modules>\n</system.webServer>\n```\n\nIf you don't add the section\
    \ above to the Web.config file, then all HTTP DELETE requests return 404 status\
    \ codes.\n\n# Using the Web Service Data Source\n\nAfter you create and configure\
    \ the remote web service, using the web service data source is straightforward.\
    \ The following code illustrates how you can create an instance of the web service\
    \ data source and bind it to a ListView control named lvTasks:\n\n```\nvar lvTasks\
    \ = document.getElementById(\"lvTasks\").winControl;\nvar tasksDataSource = new\
    \ \n  DataSources.WebServiceDataSource(\"http://localhost:51807/api/tasks\", \"\
    id\");\nlvTasks.item = tasksDataSource;\n```\n\nWhen you create an instance of\
    \ the web service data source, you must supply two arguments to the constructor:\
    \ the URL of the web service and the name of the primary key property of the data\
    \ to retrieve.\n\nThe URL http://localhost:51807/api/tasks is the address of a\
    \ local web service using port 51807. This port is generated randomly. You can\
    \ determine the port number used by opening the Project Properties dialog and\
    \ selecting the Web tab (see Figure 8.4).\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_253_0.png)\n\
    \nFIGURE 8.4 Determining the port number used by a Visual Studio project"
