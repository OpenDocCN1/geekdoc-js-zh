  md: 'The DIV element isn''t really doing anything. It is just acting as a placeholder
    for the control. It is a "host" for the DatePicker control. The data-win-control
    attribute is used to indicate the type of control that will be associated with
    the element.


    A WinJS not actually become a control until you call the WinJS.ui.processAll()
    method. This method parses an HTML document, identifies any all elements which
    include a data-win-control attribute, and generates a control for those elements.


    There is one other important requirement for WinJS controls: you must include
    references to the right JavaScript and Cascading Style Sheet files. In order to
    use any of the controls, you must add the following three references to the top
    of your HTML page:


    ```

    <link href="Microsoft.WinJS.1.0/css/ui-dark.css" rel="stylesheet" />

    <script src="Microsoft.WinJS.1.0/js/base.js"></script>

    <script src="Microsoft.WinJS.1.0/js/ui.js"></script>

    ```


    The first reference is a reference to a Cascading Style Sheet named ui-dark.css.
    The WinJS library includes two style sheets: ui-dark.css and ui-light.css. If
    you substitute the ui-light.css reference for the ui-dark.css reference, then
    you can use a light theme for all of your controls.


