  md: "# Asynchronous Programming with Promises\n\nThe then() method—just like the\
    \ done() method—enables you to set up a complete, error, and progress callback\
    \ function. Why does the then() method exist? There are two important differences\
    \ between then() and done().\n\nThe then() method, unlike the done() method, supports\
    \ chaining. If you need to chain multiple promises together, you are forced to\
    \ use the then() method. For example, the code in Listing 2.8 illustrates how\
    \ you can make an Ajax call which downloads the URL of the most recent blog entry\
    \ from my blog and then make a second Ajax call which downloads the contents of\
    \ that blog entry. The second Ajax call is not made until the first Ajax completes.\n\
    \n# LISTING 2.8 Chaining Promises (promiseChain\\promiseChain.html)\n\n```\nvar\
    \ options = {\n  url: \"http://stephenwalther.com/blog/feed\",\n  responseType:\
    \ \"document\"\n};\n```\n\n```\nWinJS.xhr(options).then(\n  function (xmlHttpRequest)\
    \ {\n    // Get link for first blog entry\n    var firstLink = xmlHttpRequest.response.querySelector(\"\
    item>link\");\n\n    // Make second Ajax request (returns a promise)\n    return\
    \ WinJS.xhr({\n      url: firstLink.textContent,\n      responseType: \"document\"\
    \n    });\n}).then(\n  function (xmlHttpRequest) {\n    // Get body of blog post\n\
    \    var postBody = xmlHttpRequest.response.querySelector(\"div.entry\");\n\n\
    \    // Write first 200 characters of blog post\n    console.log(postBody.textContent.trim().substr(0,\
    \ 200));\n  }\n});\n```\n\nIn Listing 2.8, notice that the complete function passed\
    \ to the then() method returns a second promise. Calling WinJS.xhr() returns a\
    \ new promise.\n\nIf the second promise completes successfully, then the complete\
    \ function passed to the done() method executes. This method displays the first\
    \ 200 characters of the blog entry."
  merge: -1
  pgno: 72
- img_proc: true
  md: "# CHAPTER 2 WinJS Fundamentals\n\nYou can chain together as many promises as\
    \ you need by calling().then().then().nThe last call in the chain should be a\
    \ call to done().\n\nThe second difference between then() and done() concerns\
    \ error handling. You can pass an error function to both the then() and done()\
    \ methods as the second parameter to handle errors, as a best-practice, you should\
    \ do this. But, if you don't supply an error function, then the done() method\
    \ throws an exception, but the then() method does not.\nInstead, the then() method\
    \ returns a promise in the error state.\n\nFor example, the code in Listing 2.9\
    \ performs an Ajax request with a bad URL. The request made with the then() method\
    \ does not raise an error. An error message is written to the JavaScript Console,\
    \ but of the app is not halted\n\nLISTING 2.9 done() versus then() (promiseErrors\\\
    promiseErrors.html)\n\n```\nvar options = {\n  url: \"http://BadURL\"\n};\n\n\
    WinJS.xhr(options).then(); // DOES NOT throw an exception\n\nWinJS.xhr(options).done();\
    \ // DOES throw an exception\n```\n\nIf you don't want your code to fail silently,\
    \ like the then() method in Listing 2.9, you should use done() instead of then().\
    \ If you are chaining promises, always use done()\nas the last link in the chain.\n\
    \n# Creating Promises\n\nYou can create your own promises by creating a new instance\
    \ of the Promise class. The constructor for the Promise class requires a function\
    \ which accepts three parameters: complete, error, and progress function parameter.\n\
    \nFor example, the code in Listing 2.10 illustrates how you can create a method\
    \ wait10Seconds() returns a promise. The progress function is called every second\
    \ and the complete function is not called until 10 seconds have passed:\n\nLISTING\
    \ 2.10 Creating a Promise (promiseCreate\\promiseCreate.html)\n\n```\nfunction\
    \ wait10Seconds() {\n  return new WinJS.Promise(function (complete, error, progress)\
    \ {\n    var seconds = 0;\n    var intervalId = window.setInterval(function ()\
    \ {\n      seconds++;\n      progress(seconds);\n      if (seconds > 9) {\n  \
    \      window.clearInterval(intervalId);\n        complete();\n```"
