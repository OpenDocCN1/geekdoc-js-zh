  md: '# CHAPTER 5 Creating Forms


    +   * week

    * time

    * datetime-local

    * number

    * color


    You can take advantage of these new input types to enforce validation rules. For
    example, an <input type="number"> element will accept only numerals and not other
    types of characters. And an <input type="url"> will accept only valid (absolute)
    URLs.

    You can also take advantage of these new input types to control the user interface
    for entering a value into a field. For example, an <input type="email"> /> field
    displays a specialized keyboard for entering email addresses which includes specialized
    keys such as @ and .com (see Figure 5.4).


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_161_0.png)


    FIGURE 5.4 Specialized email touch keyboard


    In this section, you learn how to take advantage of the new features of HTML5
    input elements.


    > NOTE

    As I write this, not all features of HTML5 forms are supported by IE10. In particular,
    the date, time, and color types are not supported.


    # Labeling Form Fields


    First off, you need to know the proper way to label HTML form fields. Providing
    proper labels is important for making your app accessible to users with disabilities—so
    adding labels is the right thing to do.


    There are two ways that you can use a label element to label a form element. If
    you want the label to appear right next to the form element, then you can include
    the form element inside the label''s opening and closing tags like this:


    ```

    <label>

    Title:

    <input id="inpTitle" required />

    </label>

    ```'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Using HTML5 Input Elements


    If the label is separated from the element being labeled in the page, then you
    can associate the label and the form element explicitly by using the label''s
    for attribute like this.


    ```

    <label for="inpTitle">

    Title:

    </label>

    .. Other Content ..n<input id="inpTitle" required />

    ```


    You should always label all of your form elements to make your apps more accessible
    to people with disabilities. However, if you need to provide additional hints
    about the appropriate input value for a form element, then you can take advantage
    of the new HTML5 placeholder attribute. When used in a Windows Store app, the
    placeholder attribute creates a watermark.


    For example, the following HTML form contains a field for entering a product activation
    code:


    ```

    <label>

    Activation Code:

    <input id="activationCode" size="10" placeholder="##-####-##" />

    </label>

    ```


    The form above includes a placeholder attribute which displays the text "##-####-##"
    (See Figure 5.5). As soon as you start typing a value into the field, the placeholder
    text disappears.


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_162_0.png)


    FIGURE 5.5 Using the placeholder attribute


    > NOTE

    You can use the Cascading Style Sheet :-ms-input-placeholder pseudo class to style
    the text displayed by a placeholder attribute.


    # Entering a Number


    If you want to prevent a user from entering anything except a number into an input
    field, you should use the type="number" attribute like this:


    ```

    <label>

    Favorite Number:

    <input id="inpFavNumber">

    ```'
  merge: -1
  pgno: 162
- img_proc: true
  md: '```

    type="number"

    placeholder="###" />

    </label>

    ```


    When the input type has the value number, and you enter anything which is not
    a number, the value disappears as soon as the field loses focus. This can be confusing
    to the user. So it is a good idea to include a placeholder attribute or instruction
    text indicates that the field only accepts numbers (no dollar signs, just numbers).


    You can use the min and max attributes to specify a minimum and maximum value
    for the input field like this:


    ```

    <label>

    Quantity:

    <input id="inpQuantity"

    type="number"

    placeholder="###"

    min="1"

    max="10" />

    </label>

    ```


    If you enter a number which does not fall into the specified range, a validation
    error message is displayed (see Figure 5.6).


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_163_0.png)


    FIGURE 5.6 A number out of range


    By default, you can only enter an integer value into an <input type="number" />
    field. If you want to enter a non-integer value, such as 1.5, then you need to
    modify the step attribute like this:


    ```

    <input id="inpFavNumber"

    type="number"

    step="0.5"

    placeholder="###" />

    ```


    The step attribute determines the allowable increment between numbers.


    When you use a number field in a Windows Store app, and you are using the touch
    keyboard, you get a special keyboard for entering numbers automatically (see Figure
    5.7).'
