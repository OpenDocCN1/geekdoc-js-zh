  md: "# Configuring App Settings\n\nNotice that the Add command is placed in the\
    \ global section of the app bar. You don't really need to be explicit about this—global\
    \ is the default value.\n\nThe Delete command is placed in the selection section.\
    \ Notice, furthermore, that additional CSS class name appBarSelection is associated\
    \ with the Delete command. I'll take advantage of that class in a moment to hide\
    \ and display the Delete command.\n\nHere's the JavaScript code for hiding and\
    \ displaying the app bars:\n\n```\n// Hide selection commands by default\nappBar.hideCommands(document.querySelectorAll('.appBarSelection'));\n\
    \n// When ListView item is selected, display app bar\nvTasks.addEventListener('selectionchanged',\
    \ function () {\n  if (lvTasks.selection.count() == 1) {\n    appBar.showCommands(document.querySelectorAll('.appBarSelection'));\n\
    \    appBar.show();\n  } else {\n    appBar.hideCommands(document.querySelectorAll('.appBarSelection'));\n\
    \  }\n});\n```\n\nWhen the app first starts, you want to hide the Delete command\
    \ because nothing is selected. In the code above, the hideCommands() method is\
    \ used to hide every command associated with the appBarSelection CSS class.\n\n\
    Next, the code handles the selectionchanged event raised by the ListView control.\
    \ When you select an item in the ListView (by swiping or right clicking the item)\
    \ then the selection commands are displayed with the help of the showCommands()\
    \ method.\n\nBecause the app bar is hidden by default, you might not notice the\
    \ Delete command. For that reason, the code calls the show() method to force the\
    \ app bar to be displayed. When, you select an item in the ListView, the app bar\
    \ is displayed automatically and you know that you can delete an item.\n\n> NOTE\n\
    You can force the app bar to always appear with the app bar control sticky property.\
    \ When the sticky property has the value true, then the app bar does not disappear\
    \ automatically.\n\n# Configuring App Settings\n\nWindows Store apps have a standard\
    \ location for users to configure app settings. You access app settings from the\
    \ Settings charm in the charm bar which you can open by:\n\n+   - Moving your\
    \ mouse to the bottom right of your screen\n- Swiping with your finger from the\
    \ right edge of the screen\n- Hitting the key Windows + i"
  merge: -1
  pgno: 188
