  md: '# # CHAPTER 2


    # # WinJS Fundamentals


    +   * Namespaces, Modules, and Classes

    * Asynchronous Programming with Promises

    * Retrieving DOM Elements with Query Selectors

    * Performing Ajax Calls with the xhr Function


    The goal of this chapter is to explain the features included in the base WinJS
    library. These are the features that you will use in just about any application
    that you build.


    The first part of this chapter is devoted to the topic of namespaces, modules,
    and classes. You learn the recommended patterns for organizing your JavaScript
    code.


    Next, you learn how to take advantage of the base WinJS library called *promises*.
    Promises provide you with an elegant way to perform asynchronous programming in
    your JavaScript code.


    In this chapter, you also learn how to use *Query Selectors* when working with
    the WinJS library. Query Selectors enable you to efficiently retrieve DOM elements
    from an HTML document (think jQuery selectors).


    Finally, you learn how to work with a function included in the base WinJS library
    named the `xhr()` function. The `xhr()` function enables you to perform Ajax calls—including
    cross-domain calls.


    # # Namespaces, Modules, and Classes


    When you build Windows Store apps with the WinJS library, Microsoft recommends
    that you follow particular patterns when organizing your JavaScript code. In particular,
    they recommend that you organize your code into namespaces, modules, and classes.


    By following these patterns, you can build JavaScript code which is less buggy
    and easier to maintain over time.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# Using Namespaces


    Let me start by explaining the methods in the WinJS library for defining namespaces.


    Before we do anything else, we should start by answering the questions: Why do
    we need namespaces? What function do they serve? Do they add needless complexity
    to our Windows Store apps


    After all, plenty of JavaScript libraries do just fine without introducing support
    for namespaces. For example, jQuery has no support for namespaces and jQuery is
    the most popular JavaScript library in the universe. If jQuery can do without
    namespaces, why do we need to worry about namespaces at all?


    Namespaces perform two functions in a programming language. First, namespaces
    prevent naming collisions. In other words, namespaces enable you to create more
    than one object with the same name without conflict.


    For example, imagine that two companies—company A and company B—both want to make
    a JavaScript shopping cart control and both companies want to name the ShoppingCart.
    By creating a CompanyA namespace and CompanyB namespace, both companies can create
    a ShoppingCart control: a CompanyA.ShoppingCart and a CompanyB.ShoppingCart control.


    The second function of a namespace is organization. Namespaces are used to group
    related functionality when the functionality is defined in different physical
    files. I know that all of the methods in the WinJS library related to working
    with classes can be found in the WinJS.Class namespace. Namespaces make it easier
    to understand the functionality available in a library.


    If you are building a simple JavaScript application, then you won''t have much
    reason to care about namespaces. If you need to use multiple libraries written
    by different people, then namespaces become very important.


    Using WinJS.Namespace.def()


    In the WinJS library, the most basic method of creating a namespace is to use
    the WinJS.Namespace.def() method. This method enables you to declare a namespace
    (of arbitrary depth).


    The WinJS.Namespace.def() method has the following parameters:


    +   - name—A string representing the name of the new namespace. You can add nested
    namespace by using dot notation

    - members—An optional collection of objects to add to the new namespace


    For example, the code sample in Listing 2.1 declares two new namespaces named
    CompanyA and CompanyB.Controls. Both namespaces contain a ShoppingCart object
    which has a checkout() method.'
  merge: -1
  pgno: 59
- img_proc: true
  md: "# Namespaces, Modules, and Classes\n\nLISTING 2.1 Creating namespace (namespaces\\\
    namespaces.html)\n\n```\n// Create CompanyA namespace with ShoppingCart\nWinJS.Namespace.define(\"\
    CompanyA\\nCompanyA.ShoppingCart = {\n  checkout: function () { return \"Checking\
    \ out from A\"; }\n};\n// Create CompanyB.Controls namespace with ShoppingCart\n\
    WinJS.Namespace.define(\n  \"CompanyB.Controls\",\n  {\n    ShoppingCart: {\n\
    \      checkout: function () { return \"Checking out from B\"; }\n    }\n  }\n\
    );\n// Call CompanyA ShoppingCart checkout method\nconsole.log(CompanyA.ShoppingCart.checkout());\
    \ // Writes \"Checking out from A\"\n\nCall CompanyB.Controls checkout method\n\
    console.log(CompanyB.Controls.checkout()); // Writes \"Checking out\nfrom B\"\n\
    ```\n\nIn the previous code, the CompanyA namespace is created by calling\nWinJS.Namespace.define(\"\
    CompanyA\"). Next, the ShoppingCart is added to this namespace. The namespace\
    \ is defined and an object is added to the namespace in separate lines of code.\n\
    \nA different approach is taken in the case of the CompanyB.Controls namespace.\
    \ The namespace is created and the ShoppingCart object is added to the namespace\
    \ with the following code:\n\n```\nWinJS.Namespace.define(\n  \"CompanyB.Controls\"\
    ,\n  {\n    ShoppingCart: {\n      checkout: function () { return \"Checking out\
    \ from B\"; }\n    }\n  }\n```\n\nNotice that CompanyB.Controls is a nested namespace.\
    \ The top level namespace CompanyB contains the namespace Controls. You can declare\
    \ a nested namespace using dot notation and the WinJS library handles the details\
    \ of creating one namespace within the other."
  merge: -1
  pgno: 60
- img_proc: true
  md: "After the namespaces have been defined, you can use either of the two shopping\
    \ cart controls in the same JavaScript file without conflict. You call CompanyA.ShoppingCart.checkout()\
    \ or you can call CompanyB.Controls.ShoppingCart.checkout().\n\n# Using WinJS.Namespace.defineWithParent().\n\
    \nThe WinJS.Namespace.defineWithParent() method is similar to the WinJS.Namespace.define()\
    \ method. Both methods enable you to define a new namespace. The difference is\
    \ that the defineWithParent() method enables you to add a new namespace to an\
    \ existing namespace.\n\nThe WinJS.Namespace.defineWithParent() method has the\
    \ following parameters:\n\n+   - parentNamespace—An object which represents a\
    \ parent namespace\n- name—A string representing the new namespace to add to the\
    \ parent namespace\n- members—An optional collection of objects to add to the\
    \ new namespace\n\nThe following code sample demonstrates how you can create a\
    \ root namespace CompanyA and add a Controls child namespace to the CompanyA parent\
    \ namespace:\n\n```\nWinJS.Namespace.define(\"CompanyA\");\nWinJS.Namespace.defineWithParent(CompanyA,\
    \ \"Controls\",\n{\n  ShoppingCart: {\n    checkout: function () { return \"Checking\
    \ out\"; }\n  }\n});\nconsole.log(CompanyA.Controls.ShoppingCart.checkout());\
    \ // Writes \"Checking out\"\n```\n\nOne significant advantage of using the defineWithParent()\
    \ method over the define method is the defineWithParent() method is strongly-typed.\
    \ In other words, you can use an object to represent the namespace instead of\
    \ a string. If you misspell the name of the object (CompanyA), then you get a\
    \ runtime error.\n\n# Using the Module Pattern\n\nWhen you are building a JavaScript\
    \ library, you want to be able to create public and private methods. Some methods,\
    \ the public methods, are intended to be used by consumers of your JavaScript\
    \ library. The public methods act as your library’s public API.\n\nOther methods,\
    \ the private methods, are not intended for public consumption. Instead, these\
    \ methods are internal methods required to get the library to function. You don’t\
    \ want people calling these internal methods because you might need to change\
    \ them in the future."
  merge: -1
  pgno: 61
- img_proc: true
  md: "# Namespaces, Modules, and Classes 49\n\nJavaScript does not support access\
    \ modifiers. You can't mark an object or method as public or private. Anyone gets\
    \ to call any method and anyone to interact with any object.\n\nThe only mechanism\
    \ for encapsulating (hiding) methods and objects in JavaScript is to take advantage\
    \ of functions. In JavaScript, a function determines variable scope. A JavaScript\
    \ variable either has global scope—it is available everywhere—or it has function\
    \ scope—it is available only within a function. If you want to hide an object\
    \ or method, then you need to place it within a function.\n\nFor example, the\
    \ following code contains a function named doSomething() which contains a nested\
    \ function doSomethingElse():\n\n```\nfunction doSomething() {\n  console.log(\"\
    doSomething\");\n\n  function doSomethingElse() {\n    console.log(\"doSomethingElse\"\
    );\n  }\n}\n```\n\n```\ndoSomething(); // Writes \"doSomething\"\ndoSomethingElse();\
