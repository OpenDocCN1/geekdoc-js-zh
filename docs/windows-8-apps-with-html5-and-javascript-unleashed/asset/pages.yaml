  md: "# Understanding Observables\n\n+   - removeProperty(name)—Removes a property\
    \ and notifies any listeners.\n\n+   -Property(name, value)—Updates a property\
    \ and notifies any listeners.\n\n+   - unbind(name, action)—Enables you to stop\
    \ executing a function in response to a property change.\n\n+   - updateProperty(name,\
