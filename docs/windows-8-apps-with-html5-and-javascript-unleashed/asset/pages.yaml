    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_74_0.png)\n\nFIGURE 2.5 Output of a custom\
    \ promise\n\n# Creating a Timeout Promise\n\nIn the previous section, we created\
    \ a custom Promise which uses the window.setInterval() method to complete the\
    \ promise after 10 seconds. We really did not need to create a custom promise\
    \ because the Promise class already includes a static method for returning promises\
    \ which completes after a certain interval.\n\nThe code in Listing 2.11 illustrates\
    \ how you can use the timeout() method. The timeout() method returns a promise\
    \ which completes after a certain number of milliseconds.\n\n# LISTING 2.11 A\
    \ Timeout Promise (promiseTimeout.promiseTimeout.html)\n\n```\nWinJS.Promise.timeout(3000).then(\n\
    \  function () { console.log(\"complete\") },\n  function () { console.log(\"\
    error\") },\n  function () { console.log(\"progress\") }\n);\n```"
