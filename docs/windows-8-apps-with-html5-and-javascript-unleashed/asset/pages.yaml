    \nFIGURE 6.3 Using a Menu control to display a flyout\n\n# Using the AppBar Control\n\
    \nWindows Apps have a standard location for application commands: the app bar\
    \ typically appears at the bottom of the app. However, you can also display an\
    \ app bar at both the bottom and top of an app. The app bar does not appear until\
    \ you swipe from either the bottom or top of the page or right-click when using\
    \ a mouse.\n\nFor example, 6.4 illustrates the appearance of the two app bars\
    \ in the Windows 8 version of Internet Explorer. The bottom app bars contains\
    \ the address bar for navigating to websites and the top app bar contains the\
    \ active tabs. If you click on the page, both app bars disappear and you get a\
    \ full screen experience."
