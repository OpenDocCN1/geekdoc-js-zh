    > > NOTE

    The JavaScript code contained in the Default.js file which we deleted is used
    to handle app lifecycle events such as app activation and suspension. I discuss
    these app events in detail in Chapter 9.


    There is a lot of interesting stuff happening in the JavaScript code in Listing
    1.2. Let''s walk through the code.


    First, I''ve created an init() function which is executed when the DOMContentLoaded
    event is raised. The DOMContentLoaded event is a standard DOM event which is raised
    when a browser finishes parsing an HTML document.


    I put all of my code into the init() function so the code won''t be executed until
    the DOM is ready. Otherwise, if I attempted to access any of the HTML elements
    in the page, I would get an exception because the elements would not yet exist.


    The first thing that I do within the init() method is call the WinJS.UI.processAll()
    method. This method processes all of the controls in a page. In particular, it
    converts the DIV tag with the data-win-control="WinJS.UI.AppBar" attribute into
    an actual app bar.


    Next, I set up an event handler for the Take Picture command. When you click the
    Take Picture command in the app bar, an instance of the Windows Media.CameraCaptureUI
    class is created. The CameraCapture class is an example of a Windows Runtime class.


    The CameraCaptureUI.captureFiles method displays the screen for taking a picture
    (see Figure 1.12). When you click the OK button, the done() method is called and
    the picture is displayed in the page.'
