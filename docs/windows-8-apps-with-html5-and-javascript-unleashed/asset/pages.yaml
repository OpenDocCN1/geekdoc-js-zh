- img_proc: true
  md: "# CHAPTER 5 Creating Forms\n\nThe following JavaScript code demonstrates how\
    \ you can display a validation error message when the user name is too short:\n\
    \n```\nvar userName = document.getElementById(\"userName\");\n\nuserName.addEventListener(\"\
    input\", function (evt) {\n  // User name must be more than 3 characters\n  if\
    \ (userName.value.length < 4) {\n    userName.setCustomValidity(\"User name too\
    \ short!\");\n  } else {\n    userName.setCustomValidity(\"\");\n  }\n});\n```\n\
    \nIn the code above, an event listener for the input event is created. When the\
    \ value of the input element is changed, the length of the value is checked. If\
    \ the user name is less than 4 characters, the setCustomValidity() method is used\
    \ to invalidate the input element. Otherwise, the setCustomValidity() method is\
    \ called with an empty string to clear any previous validation errors associated\
    \ with the user name element.\n\n> NOTE The input event is raised as soon as the\
    \ contents of an input element are changed. The input event differs from the change\
    \ event because the change event is not raised until after the input element loses\
    \ focus.\n\nYou must submit the form to see the validation error message. After\
    \ you submit the form, you see the error in Figure 5.3.\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_157_0.png)\n\
    \nFIGURE 5.3 Using custom validation\n\n# Customizing the Validation Error Style\n\
    \nBy default, invalid HTML forms in a form appear with a red border. For example,\
    \ if you submit an HTML form without entering a value in a required field, the\
    \ field is displayed with a red border.\n\nYou can customize the appearance of\
    \ form fields in different states of validity by using the following Cascading\
    \ Style Sheet pseudo classes:\n\n+   * valid—Applies when an input element is\
    \ valid.\n* invalid—Applies when an input element is invalid."
