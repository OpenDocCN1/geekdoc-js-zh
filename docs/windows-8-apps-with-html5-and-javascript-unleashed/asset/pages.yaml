  md: '# Composing Promises


    You can build promises out of other promises. In other words, you can compose
    promises.


    There are two static methods of the Promise class which you can use to compose
    promises: the join() method and the any() method. When you join promises, a promise
    is complete when all of the promises are complete. When you use the any() method,
    a promise is complete when any of the promises complete.


    The following code illustrates how to use the join() method. A new promise is
    created out of two timeout promises. The new promise does not complete both of
    the timeout promises complete:


    ```

    JS.Promise.join([JS.Promise.timeout(1000), JS.Promise.timeout(5000)]) .done(function
    () { console.log("join complete"); });

    ```


    The message "complete" will not be written to the JavaScript Console until both
    promises pass to the any() method complete. The message is written for 5 seconds
    (5,000 milliseconds).


    The any() method completes when any promise passes to the any() method complete:


    ```

    JS.Promise.any([JS.Promise.timeout(1000), JS.Promise.timeout(5000)]) .done(function
    () { console.log("any complete"); });

    ```


    The code above writes the message "any complete" to the JavaScript Console after
    1 second (1,000 milliseconds). The message is written to the JavaScript console
    immediately after the first promise completes and the second promise completes.


    # Retrieving DOM Elements with Query Selectors


    When you are building a Windows app with JavaScript, you need some way of easily
    retrieving elements from an HTML document. For example, you might want to retrieve
    all of the input elements which have a certain CSS class. Or, you might want to
    retrieve the one element with an id of favoritecolor.


    The standard way of retrieving elements from an HTML document is by using a selector.
    Anyone who has ever created a Cascading Style Sheet has already used selectors.
    You use selectors in Cascading Style Sheets to apply formatting rules to elements
    in a document.


    For example, the following Cascading Style Sheet rule changes the background color
    of every INPUT element with a class of .required to a document to the color red:


    ```

    input.required { background-color: red }

    ```


    "input.required" part is the selector which matches all INPUT elements with a
    class of required.'
