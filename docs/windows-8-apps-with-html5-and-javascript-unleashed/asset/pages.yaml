  md: '# Creating Your First Windows Store App


    Let’s be fearless. In this section, I guide you through building your first Windows
    Store app. Doing a Hello World app would be predictable and boring. Therefore,
    I suggest that we do something a little advanced.


    I''ll show you how you can create an app which enables you to take pictures. When
    you click the Take Picture command in the app bar, you can take a picture, and
    then the picture is displayed in the app (see Figure 1.6, which shows a picture
    of my dog Rover).


    > NOTE

    The code for the completed app can be found in the Chapter 1 folder with the name
    App1.


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_26_0.png)


    FIGURE 1.6 Your first Windows Store app


    # Creating the Visual Studio Project


    The first step is to create the Microsoft Visual Studio Project. I used Visual
    Studio 2012 to create almost all of the code samples for this book. In most cases,
    I used the free version of Visual Studio—Visual Studio 2012 Express for Windows
    8—which you can download from Microsoft.com.


    > NOTE

    In chapters in which I created a web service project, I used Visual Studio Professional
    2012 because I needed to create both a Windows Store app and an ASP.NET project
    in the same solution.'
  merge: -1
