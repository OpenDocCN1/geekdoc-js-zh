  md: '280 CHAPTER 10 Page Fragments and Navigation


    Notice that the page above refers to the alert.js JavaScript file. You must include
    a reference to your custom Page Control in any page which uses the control declaratively.


    The Alert Page Control is created declaratively in the body of the page just like
    any other standard WinJS control such as the ListView or DatePicker control.


    > WARNING

    Remember to call WinJS.UI.processAll() or your Page Controls, just like any other
    WinJS control, won''t get processed and turned into a control.


    # Creating Multipage Apps


    You can create a Windows Store app which contains multiple HTML pages and create
    links between the pages. However, Microsoft strongly discourages you from doing
    this. Instead, they encourage you to create a single page app and dynamically
    load different Page Controls which represent individual pages.


    Why does Microsoft make this recommendation? When you are building a Windows Store
    app you are not building a website (even though you are using many of the same
    technologies). Instead, you are building a Windows application.


    Users have different expectations when using a Windows application than a web
    application. In a web application, it is normal to click a link and wait (and
    wait, and wait) for another page to load. While you are waiting, the application
    freezes. When the new new page loads, you start over in a completely new context—the
    context of the new page.


    In a Windows application, this experience would be unacceptable. Microsoft Word,
    for example, never freezes when you click a button (well, hard ever). You don''t
    navigate between pages in a Windows application. Instead, you navigate content
    by opening dialogs and switching tabs.


    To create this type of Windows application experience in a Windows Store app,
    you are encouraged to create a single page app.


    # Creating a Navigation App


    The easiest way to create a single page app which contains multiple pages is to
    take advantage of the Visual Studio Navigation App project template (see Figure
    10.3). There are several differences between this template and the Blank App template.'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# Creating Multipage Apps


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_294_0.png)


    FIGURE 10.3 Creating a Navigation App


    First, the Navigation App template contains a pages folder. The pages folder contains
    all of the Page Controls which represent the pages in your application. Each Page
    Control is contained in a separate subfolder of the pages folder.


    The Navigation App includes a pages/home folder which contains a Page Control
    which represents the home page. This Page Control is loaded by default when you
    start a Navigation App.


    The Navigation App template, like the Blank App template, includes a default.html
    file. However, this file mainly acts as a shell for loading up different Page
    Controls from the pages folder. When you navigate from page to page, the content
    in the body of the default.html file is loaded with new content.


    Finally, the Navigation App template includes a WinJS scroll control which is
    not included in the Blank App template named the PageNavigator control. This control
    is located in a file named js/navigator.js. The PageNavigator control handles
    all of the details of loading the Page Controls into the default.html page.


    Let dig a little deeper into how all of this works.


    # Understanding the Navigation App default.html Page


    As I mentioned previously, the default.html page in a Navigation App is mainly
    a shell for the content contained in the Page Controls. The entire contents of
    the default.html page are contained in Listing 10.1.'
