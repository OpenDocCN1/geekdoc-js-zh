  md: "# Introduction to the ListView Control\n\n```\n<div id=\"lvProducts\"\n  data-win-control=\"\
    WinJS.UI.ListView\"\n  data-win-options=\"{\n    itemTemplate: itemTemplate='#tmplProduct',\n\
    \    layout: {type:WinJS.UI.ListView}\n  }\"></div>\n```\n\nListView items are\
    \ rendered with list layout, then the items are not actually displayed using HTML\
    \ UL and LI elements. Instead, DIV elements are rendered for each item.\n\n# Preventing\
    \ Overlapping ListView Items\n\nDisplaying items in a ListView control in grid\
    \ mode can be frustrating unless you understand the trick the ListView control\
    \ uses to display each item.\n\nConsider the ListView displayed in Figure 7.6.\
    \ This ListView displays 7 items:\nAA\nBBBBBBBB\nCC\nDD\nEE\nFF\nGG\n\nHowever,\
    \ the BBBBBBBB overlaps the FF list item in the next column. The wide B item messes\
    \ up the rendering of the ListView. This doesn’t look very nice!\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_206_0.png)\n\
    \nFIGURE 7.6 Overlapping ListView items\n\nIf you move the BBBBBBBB item to the\
    \ top of the list, then the overlapping problem goes away (Figure 7.7). All of\
    \ the items are rendered with the width of the BBBBBBBB item. However, now the\
    \ problem is every item in the ListView is the same width as the BBBBBBBB and\
    \ that looks weird."
