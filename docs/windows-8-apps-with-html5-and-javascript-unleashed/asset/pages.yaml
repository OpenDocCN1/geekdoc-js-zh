    # # Loading ListView Items Incrementally


    Imagine you want to use the ListView control to scroll through a huge catalog
    of products. For example, a product catalog which contains thousands of products.
    How can you scroll through such a large catalog of products efficiently?


    The ListView control automatically supports random access to data a source with
    thousands of items, the ListView will load and render only the subset of items
    required to display the current page and the next pages. So, instead of rendering
    thousands of items, the ListView might only need to load and render a small number
    of items.


    This works great when the data items can be loaded quickly. However, this approach
    does not work well when the data items need to be loaded across a network (from
    an Ajax call). In that case, in order to create a smooth user experience, you
    need to incrementally load the items displayed by a ListView control.


    The following properties are used to control how a ListView loads items from its
    data source:


    +   - automaticallyLoadPages—Gets or sets a Boolean value which determines whether
    the ListView control will load additional pages automatically. Additional pages
    are loaded automatically when the user scrolls beyond the number of pages specified
    by the pagesToLoadThreshold.


    +   - loadingBehavior—Gets or sets the ListView strategy for loading additional
    items. The two possible values are "randomaccess" and "incremental".


    +   - loadingState—Gets a string value which represents the loading state of the
    ListView. The two possible values are "complete" and "loading".


    +   - pagesToLoad—Gets or sets an integer which determines the number of new pages
    to load. This property is used when automaticallyLoadPages is enabled or the loadPages()
    method is called.


    +   - pagesToLoadThreshold—Gets or sets an integer value which determines when
    a new set of pages are loaded. When automaticallyLoadPages is enabled, the user
    scrolls beyond the pagesToLoadThreshold, new pages are loaded automatically.


    And you can use the following method to cause the ListView control to load more
    items manually:


    +   - loadMorePages—When loadingBehavior has the value incremental, it causes
    the ListView control to load more pages of items. The number of items loaded is
    determined by the pagesToLoad property.'
