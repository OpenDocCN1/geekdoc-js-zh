  md: "# Creating the Game Canvas\n\nNotice that the game sounds are WAV sound files.\
    \ I recorded the sound files using a program named Audacity which is a free, open-source\
    \ sound recorder and editor.\n\nThe sounds are exposed as properties of the Unleashed.Sounds\
    \ object. For example, the Yum sound is played with the following code:\n\n```\n\
    Unleashed.Sounds.yum.play();\n```\n\n> NOTE\nI created the sound files by recording\
    \ my children Jon, Ada, and Athena making zombie noises.\n\n# Creating the Game\
    \ Canvas\n\nThe game graphics are rendered using an HTML5 Canvas element. The\
    \ Canvas element is created in the play.html page like this:\n\n```\n<div\n  data-win-control=\"\
    WinJS.UI.ViewBox\">\n    <canvas id=\"canvas\" width=\"1000\" height=\"750\"></canvas>\n\
    </div>\n```\n\nNotice that the Canvas element is contained in a WinJS ViewBox\
    \ control. The ViewBox control scales the Canvas to fit the resolution of the\
    \ screen automatically. You can play the game on a 1,024px by 768px screen in\
    \ portrait mode (see Figure 12.3) and a 2,560px by 1,440 screen in landscape mode\
    \ (see Figure 12.4). The ViewBox scales the Canvas to fit the available screen\
