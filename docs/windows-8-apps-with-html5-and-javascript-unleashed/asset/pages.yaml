  md: "# CHAPTER 11 Using the Live Connect API\n\nThe Windows Live SignIn control\
    \ is created by calling the WL.ui with the following options:\n\n+   - name—The\
    \ type of control to create (signin is currently the only option).\n\n+   - element—The\
    \ DOM element to associate with the control.\n\n+   - theme—Use either the “light”\
    \ or “dark” theme.\n\n> WARNING\nIf you have already given an app sign-on permissions,\
    \ then the SignIn control won't do anything useful—it will show a Sign out button\
    \ which doesn't actually sign you out.\n\n# Authentication Events\n\nThe Live\
    \ Connect API supports the following events:\n\n+   - auth.login—Raised when a\
    \ user signs in.\n\n+   - auth.logout—Raised when a user signs out.\n\n+   - auth.sessionChange—Raised\
    \ when a user's access token is changed.\n\n+   - auth.statusChange—Raised when\
    \ a user's status has changed.\n\n+   - wl.log—Raised when an error occurs when\
    \ calling a Live service.\n\nThe following code demonstrates how you can subscribe\
    \ to the auth.login and auth.logout events and display messages:\n\n```\nvar spanResults\
    \ = document.getElementById(\"spanResults\");\n\nWL.Event.subscribe(\"auth.login\"\
    , function () {\n  spanResults.innerText = \"Signed In\";\n});\n\nWL.Event.subscribe(\"\
    auth.logout\", function () {\n  spanResults.innerText = \"Signed Out\";\n});\n\
    ```\n\nNote that you don't use单独 to listen to an event. Instead, you subscribe\
    \ to the event using the Windows Live WL.Event.subscribe() method."
