    \n```\n<!-- Flyout Control -->\n<div id=\"flyout\"\n  data-win-control=\"WinJS.UI.Flyout\"\
    >\n  <label>Select Typeface:</label>\n  <select id=\"selectTypeface\">\n    <option>Arial</option>\n\
    \    <option>Impact</option>\n    <option>Comic Sans MS</option>\n  </select>\n\
    </div>\n\n<!-- Button which opens Flyout -->\n<button id=\"btnTypeface\">Select\
    \ Typeface</button>\n```\n\n```\n<!-- The text to style -->\n<p id=\"pText\">\n\
    \  Lorem ipsum dolor sit amet, consectetur adipiscing elite\n  Maenas porttitor\
    \ cong massa. Fusce posuere, magna sed\npulvinar ultricies, purus lectus malesuada\
    \ libero, sit amet\n  commodo magna eros urna.\n</p>\n```\n\nThe page in Listing\
    \ 6.1 contains a button that opens a flyout. The flyout displays a select of typefaces.\
    \ When you select a typeface, the lorem ipsum text is modified to appear with\
