    # Declarative Data Binding and WinJS Controls


    We discuss WinJS controls in detail in the next chapter; however, I want to make
    sure that you understand that you can use declarative data binding with WinJS
    controls properties in the same way as you use declarative data binding with element
    attributes.


    The trick is to use the winControl property which is exposed by every HTML element
    as associated with a control. You can use the winControl property with the data-win-bind
    attribute.


    For example, the page in Listing 3.11 contains a WinJS Rating control (see Figure
    3.8).


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_107_0.png)


    FIGURE 3.8 Displaying an average rating with declarative data binding


