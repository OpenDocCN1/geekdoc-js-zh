  md: '# Passing App Certification


    Microsoft must review your app before it gets published to the Windows Store.
    In other words, your app must go through a certification process. Part of this
    certification process is automated and part of the certification process must
    be done by a human.


    There are many requirements for certification. Some of these requirements are
    obvious. For example, your app can''t contain programming errors that causes it
    to immediately crash. Also, your app cannot simply be a big ad for your business.


    Some of the certification requirements are not so obvious. For example, to be
    certified, your app must fully support both snapped and filled views. Your app
    cannot unexpectedly transport large amounts of data over a metered connection.


    > NOTE

    The Windows Store certification requirements are detailed at http://msdn.microsoft.com/en-us/library/windows/apps/hh694083.aspx.


    You can use the Windows App Certification Kit to run the automated certification
    tests on your app before you upload your package to the Windows Store. The easiest
    way to run the Windows Certification Kit is to select your app within Visual Studio
    by selecting the menu option Package, Store, Create App Package. The last step
    in the Create App Package enables you to launch the Windows App Certification
    Kit (see Figure 1.37).


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_54_0.png)


    FIGURE 1.37 Create App Package


    > NOTE

    The App Certification Kit is installed at the same time as you install Visual
    Studio. You can run it independently of Visual Studio by launching the Windows
    App Cert Kit from the Start screen.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# CHAPTER 1 Building Windows Store Apps


    When you run the Windows App Certification Kit, the App Certification Kit will
    launch your app and then, after your computer does crazy stuff for a while, a
    report is generated which details whether your app passes or fails (see Figure
    1.38).


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_55_0.png)


    FIGURE 1.38 A (successful) certification report generated by the Windows App Certification
    Kit


    > NOTE\If you are using Team Foundation Server, you can even integrate the Windows
    App Certification Kit into your build process. Every time you do a new build of
    your app, you can run the technical certification tests automatically.


    When your app passes all the certification requirements—after it has been approved
    by Microsoft—your app appears in the Windows Store and you can start collecting
    money. When anyone buys your app, money is added to a payout account which you
    set up on the Windows Store dashboard.


    # Summary


    The goal of this chapter was to introduce you to Windows Store apps. I started
    this chapter by providing you with an overview of the Microsoft design style principles.
    You also learned about the standard features of Windows Store apps such as the
    app bar, charms, and snapped view state.'
  merge: -1
