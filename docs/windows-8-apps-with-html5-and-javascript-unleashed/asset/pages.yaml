  md: "# Namespaces, Modules, and Classes\n\nUsing WinJS.Class.derive ()\nThe WinJS.Class.derive()\
    \ method enables you to use prototype inheritance to derive one class from another\
    \ class. The WinJS.Class.derive() method accepts the following four arguments:\n\
    \n+   - baseClass—The class to inherit from.\n- constructor—A constructor function\
    \ that can be used to initialize the new class\n- instanceMembers—New instance\
    \ properties and methods\n- staticMembers—New static properties and methods\n\n\
    Here is a basic example. In the code in Listing 2.4, three classes are defined:\
    \ Robot, Roomba, and AIB. The Robot class is the base class and the Roomba and\
    \ AIB classes derive from the Robot class.\n\n# LISTING 2.4 Deriving a Class (derive\\\
    derive.html)\n\n```\nvar Robot = WinJS.Class.define(\n  function () {\n    this.type\
    \ = \"Robot\"\n    {\n      sayHello: function () {\n        return \"My name\
    \ is \" + this.name\n        + \" and I am a \" + this.type;\n      }\n    }\n\
    \  }\n);\nvar Roomba = WinJS.Class.derive(\n  Robot,\n  function (name) {\n  \
    \  this.name = name;\n    this.type = \"Roomba\"\n  }\n);\nvar AIBO = WinJS.Class.derive(\n\
    \  Robot,\n  function (name) {\n    this.name = name;\n    this.type = \"AIBO\"\
    \n  }\n);\n// Create a Roomba\n```"
