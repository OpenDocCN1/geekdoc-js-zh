  md: "# Asynchronous Programming with Promises\n\n```\n}\n}, 1000);\n}\n\n```\n\n\
    ```\nwait10Seconds().done(\n  function () { console.log(\"complete\") },\n  function\
    \ () { console.log(\"error\") },\n  function (seconds) { console.log(\"progress:\
    \ \" + seconds) }\n);\n```\n\nAll of the work happens in the constructor function\
    \ for the promise. The window.setInterval() method is used to execute code every\
    \ second. Every second, the progress() callback method is called. If more than\
    \ 10 seconds have passed, then the complete() callback method is called and the\
