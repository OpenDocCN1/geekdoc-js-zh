  md: '# CHAPTER 3


    # Observables, Bindings,

    and Templates


    In this chapter, I explain how you can display JavaScript objects, such as a single
    product or array of products, in the pages of your Windows Store apps.


    I start by explaining observables. An observable enables you to detect when a
    JavaScript property has been changed automatically. I also explain how you can
    take advantage of the WinJS.Binding.List object to detect elements of an array
    are changed.


    Next, I focus on the topic of declarative data binding. We learn how to use both
    ordinary JavaScript objects and observable objects with declarative data binding.


    Finally, I discuss how you can display an array of objects using a WinJS template.
    A template enables you to format and display multiple JavaScript objects at a
    time.


    # Understanding Observables


    An observable is an object which can notify one or more listeners when the value
    of a property is changed.


    Observables enable you to keep your user interface and your application data in
    sync. For example, by taking advantage of observables, you can update your user
    interface automatically whenever the properties of a product change. Observables
    are the foundation of declarative binding in the WinJS library.


    > NOTE

    The WinJS library is not the first JavaScript library to include support for observables.
    For example, Backbone, Knockout, Ember, and the Microsoft Ajax Library (now part
    of the Ajax Control Toolkit) all support observables.'
