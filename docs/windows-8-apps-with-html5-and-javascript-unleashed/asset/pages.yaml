  md: "WARNING\nRedirect Domain must be a domain and not a URL. If you run out of\
    \ domain ideas, remember that you can vary the host name and remember that the\
    \ domain does does not point to anything real.\n\nNOTE\nIf you have already submitted\
    \ your app to the Windows Store, then the process of registering your app with\
    \ Live Connect is different. edit the Dashboard, edit your app and click Advanced\
    \ Features. Follow the instructions for configuring Live Connect services.\n\n\
    # Initializing the Live Connect SDK\n\nBefore you can call any of the services\
    \ available from the Live Connect API, you must first initialize your connection.\
    \ You initialize your connection by calling the WL.init() method as illustrated\
    \ in Listing 11.1.\n\nLISTING 11.1 Initializing Your Connection\n\n```\nvar REDIRECT_DOMAIN\
    \ = \"http://liveSDKDemo.Superexpert.com\";\nvar scopes = [\"WL.signin\"]\nW.init({\n\
    \  scope: scopes,\n  redirect_uri: REDIRECT_DOMAIN\n});\n\nWL.login().then(\n\
    \  function (LoginResults) {\n    // Success! Now do something...\n  },\n  function\
    \ (LoginResponse) {\n    throw WinJS.ErrorFromName(\"Failed to login!\");\n  }\n\
    );\n```\n\nThe WL.init() method in Listing 11.1 is called with two arguments:\
    \ a redirect_uri and an array of scopes. the redirect_uri must match (exactly)\
    \ the Redirect Domain that you configured in the previous section. Discuss the\
    \ array of scopes in the next section.\n\n# Specifying Scopes\n\nThe array of\
    \ scopes that you pass to the WL.init() method determines the information that\
    \ you have permission to access. There are all sorts of fun and scary information\
    \ that you can extract from a Windows Live user account including the user birthday,\
    \ email addresses, mailing address, photos, and contacts."
