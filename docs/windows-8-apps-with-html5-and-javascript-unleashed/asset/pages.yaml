- img_proc: true
  md: '# Creating a Page Control


    The alert.js JavaScript file creates the Alert control. The Alert control is created
    by calling the WinJS.Pages.define() method with the path to the alert.html file.


    When you create a Page Control, you can create an event handler for the Page Control
    ready event. This event is raised after the control has been rendered so you can
    access any elements in the alert.html file.


    In the code above, the ready handler configures a click handler for the button.
    When you click the button, a Windows.UI.Popups.MessageDialog is displayed.


    There is one other important section in the alert.js file. The following code
    executes the Alert control in the global namespace so that the control can be
    used declaratively in other HTML pages:


    ```

    WinJS.Namespace.define("MyControls", {

    Alert: Alert

    });

    ```


    Now that I have created the Alert control, I can use it in a Page. The following
    page displays a button with the label Click Here! When you click the button, the
    alert You Clicked the Button! is displayed:


    ```

    <!DOCTYPE html>

    <head>

    <meta charset="utf-8" />

    <title>Fragments</title>

    <!-- WinJS references rel="stylesheet" -->

    <link href="//Microsoft.WinJS.1.0/css/ui-dark.css" rel="stylesheet" />

    <script src="//Microsoft.WinJS.1.0/js/base.js"></script>

    <script src="//Microsoft.WinJS.1.0/js/ui.js"></script>


    <script type="text/javascript" src="pageControl.js"></script>

    <script type="text/javascript" src="pageControl/alert.js"></script>

    </head>

    <body>

    <div id="btnDelete"

    data-win-control="MyControls.Alert"

    data-win-options="{

    buttonLabel:''Click Here!",

    message:''You clicked the button!''

    }"></div>

    </body>

    </html>

    ```'
