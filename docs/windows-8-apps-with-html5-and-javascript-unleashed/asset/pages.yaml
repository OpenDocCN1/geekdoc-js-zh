  md: "# Creating an IndexedDB Data Source\n\n> NOTE\n you want to avoid building\
    \ custom web services with the ASP.NET Web API then a great alternative is to\
    \ take advantage of Windows Azure Mobile Services. Windows Azure Mobile Services\
    \ enable you to easily store and retrieve data in the Windows Azure cloud. Learn\
    \ more at https://www.windowsazure.com/en-us/develop/mobile/.\n\n# Creating an\
    \ IndexedDB Data Source\n\nThe IndexedDatabase API (IndexedDB) is a W3C recommendation\
    \ for exposing a database in the browser. The IndexedDB recommendation is supported\
    \ by Firefox 12, Chrome 19, and IE 10. And, of course, the IndexedDB recommendation\
    \ is supported by Windows Store apps.\n\nBehind the scenes, different browsers\
    \ use different databases behind the IndexedDB API. For example, Firefox uses\
    \ SQLite and IE uses SQLCE. The IndexedDB API provides a standard way to interact\
    \ with these databases across browsers and across platforms.\n\nIf you need to\
    \ store lots of data in a Windows Store app, and query subsets of the data, then\
    \ IndexedDB is a good choice. Because IndexedDB supports indexes and cursors,\
    \ you can work efficiently with large sets of data.\n\nIn this section, I discuss\
    \ how you can create an IndexedDB data source. I discuss how you can build a simple\
    \ app which enables you to filter a list of movies by category (see 8.5).\n\n\
    | Category | All |\n|---|---|\n| Id: 1 | |\n| Title: Musical |\n| Category: Sci-fi\
    \ |\n| Id: 2 | |\n| Title: Mission Plan |\n| Category: Sci-fi |\n\nFIGURE 8.5\
    \ Using the IndexedDB data source\n\n# Overview of IndexedDB\n\nAn IndexedDB database\
    \ might be different from the type of database that you normally use. An IndexedDB\
    \ database is an object-oriented database and not a relational database. Instead\
    \ of storing data in tables, you store data in object stores. An IndexedDB database\
    \ contains one or more object stores which contain a collection of JavaScript\
    \ objects."
