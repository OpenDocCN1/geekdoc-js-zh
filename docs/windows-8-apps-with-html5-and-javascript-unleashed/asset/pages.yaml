  md: '# Suspending, Terminating, and Resuming an App


    The code contains a handler for the WinJS.Application.activated event. The event.previousExecutionState
    property represents the previous state of the application All of the previous
    states are represented by the ApplicationExecutionState enumeration. Here are
    all the possible values of the ApplicationExecutionState enumeration:


    +   - notRunning—The user activates the app after installing from the Windows
    Store, rebooting the computer, logging in and out, ending the task, the app crash-ing,
    or closing the app and restarting it within 10 seconds.

    - running—The app is already running and the user activates it through a secondary
    tile or one of the activation contracts or extensions.

    - suspended—The app is suspended and the app is activated through a secondary
    tile or one of the activation contracts or extensions.

    - terminated—The app was terminated by Windows.

    - closedByUser—The app was closed by the user and not restarted for more than
    10 seconds.


    > NOTE You cannot detect whether an app is being activated after suspension. You
    can detect only when an application is activated after suspension and termination.
    The activated event is not raised for apps which get suspended without termination.


    # Testing Application State with Visual Studio


    You can use Visual Studio to test how your Windows app behaves when it is suspended,
    terminated, or resumes. When you run an app from Visual Studio, the drop-down
    in Figure 9.3 appears (it is part of the Debug Location toolbar).


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_272_0.png)


    FIGURE 9.3 Change app state options


    If you want to simulate app suspension and resumption, then you can click the
    Suspend option to suspend your application and then click the Resume option to
    resume your application again. When you click the Suspend option, the checkpoint
    event is raised. When you click the Resume option, the activated event is not
    raised (your app does not know when it was resumed after suspension).'
