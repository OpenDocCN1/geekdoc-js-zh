  md: "# CHAPTER 7 Using the ListView Control\n\n| BBBBBB | EE |\n| AA | FF |\n| CC\
    \ | GG |\n| DD | |\n\nFIGURE 7.7 Non-overlapping but super wide ListView items\n\
    \nHere’s the trick that the ListView uses to calculate the width and height of\
    \ each list item. The ListView simply calculates the width and height of the first\
    \ item and uses that width and height for every other item.\n\nBecause of the\
    \ way that the ListView control calculates the width and height of list items,\
    \ I recommend that you always be explicit about item width and height. Otherwise,\
    \ depending on the width and height of the first item, you might get overlapping\
    \ or unnecessarily wide or tall list items.\n\nSo how can you be explicit about\
    \ the width and height of your list items? When a ListView renders its items,\
    \ the items are rendered in DIV elements that look something like this:\n\n```\n\
    <div class=\"win-listview\">\n  <div class=\"win-container\" style=\"width:142px;height:54px\"\
    >\n    <div class=\"win-item\">\n      AAAA\n    </div>\n  </div>\n  <div class=\"\
    win-container\" style=\"width:142px;height:54px\">\n    <div class=\"win-item\"\
    >\n      BBBB\n    </div>\n  </div>\n  <div class=\"win-container\" style=\"width:142px;height:54px\"\
    >\n    <div class=\"win-item\">\n      CCCC\n    </div>\n  </div>\n  ... and so\
    \ on ...\n</div>\n```\n\nTo simplify things, I’ve left out several levels of nested\
    \ DIVs. But the basic idea is that a ListView renders a win-container DIV element\
    \ which contains a win-item DIV element for each list item."
  merge: -1
  pgno: 207
- img_proc: true
  md: "# Introduction to the ListView Control\n\nNotice that each win-container DIV\
    \ element has a style attribute with an explicit width\nheight. All of the win-container\
    \ DIV elements have the exact same width and height.\nThe ListView control assigns\
    \ a width and height based on the size of the first list item.\n\nBecause the\
    \ style attribute takes precedence over the win-container class attribute, any\n\
    width and height that you try to assign with the win-container class will be ignored.\n\
    \nIn grid layout mode, you could use the win-item class to provide an explicit\
    \ width and\nheight for each list item. However, using the win-item class in list\
