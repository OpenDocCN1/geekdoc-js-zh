    \ viewModel);\n\ndocument.addEventListener(\"DOMContentLoaded\", initialize);\n\
    \n}();\n```\n\n# Creating Date and Price Binding Converters\n\nI can't let you\
    \ stop reading this section until I mention how to create two other types of converters:\
    \ date and price converters. I find that I need to use date and price converters\
    \ in most Windows Store apps which I build in order to format dates and prices.\n\
    \nThe JavaScript file in Listing 3.16 contains the two converters.\n\nLISTING\
    \ 3.16 The Date and Price Converters\n\n```\n(function () {\n  \"use strict\"\
    ;\n\n  // Converts 77.8900 to $77.89\n  var price = WinJS.Binding.converter(function\
    \ (priceToConvert) {\n    return \"$\" + priceToConvert.toFixed(2);\n  });\n\n\
    \  // Converts full date to 12/25/2013\n  var shortDate = WinJS.Binding.converter(function\
    \ (dateToConvert) {\n    return dateToConvert.getMonth() + 1 +\n      \"/\" +\
    \ dateToConvert.getDate() +\n      \"/\" + dateToConvert.getFullYear();\n  });\n\
    \nWinJS.Namespace.define(\"MyBindingConverters\", {\n    price: price,\n    shortDate:\
    \ shortDate\n  });\n})();\n```\n\nWhen you add a reference to the converters to\
    \ an HTML page, you can use the date and price converters in your \"$\\$ binding\
    \ expressions, as demonstrated in Listing 3.17."
