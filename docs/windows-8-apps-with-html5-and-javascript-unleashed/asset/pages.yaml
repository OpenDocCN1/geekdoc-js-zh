  md: "# Passing an Authentication Token to a Web Service\n\n```\n// Get the Windows\
    \ Live authentication token from header\nstring authenticationToken = null;\n\
    try {\n    authenticationToken = appContext.Request.Headers.GetValues(\"authenticationToken\"\
    ).FirstOrDefault();\n} catch {\n    appContext.Response = new System.Net.Http.HttpResponseMessage(System.Net.HttpStatusCode.Unauthorized);\n\
    }\n\n// Load client secret from Web.config\nvar clientSecret = WebConfigurationManager.AppSettings[\"\
    CLIENT_SECRET\"];\nif (string.IsNullOrWhiteSpace(clientSecret)) {\n    throw new\
    \ Exception(\"Missing Client Secret for Authentication\");\n}\n\n// Validate token\n\
    var d = new Dictionary<int, string>();\nd.Add(0, clientSecret);\ntry {\n    var\
    \ myJWT = new JsonWebToken(authenticationToken, d);\n} catch {\n    app.Response\
    \ = new System.Net.Http.HttpResponseMessage(System.Net.HttpStatusCode.Unauthorized);\n\
    }\n\n```\n\nNote that the AuthenticationTokenAttribute loads the client secret\
