  md: "# Understanding Declarative Data Binding 93\n\nWhen you submit the HTML form,\
    \ the viewData.submit() method in Listing 3.10 is invoked. This method grabs the\
    \ HTML form fields and creates a new product object named productToAdd.\n\nLISTING\
    \ 3.10 Two-Way Data Binding (dataBindingTwoWay\\dataBindingTwoWay)\n\n```\n(function\
    \ () {\n  \"use strict\";\n\n  function initialize() {\n    var viewModel = {\n\
    \      submit: function (evt) {\n        // Prevent page from being posted\n \
    \       evt.preventDefault();\n\n        // Grab form field values\n        var\
    \ productToAdd = {\n          name: document.getElementById(\"productName\").value,\n\
    \          price: document.getElementById(\"productPrice\").value\n        };\n\
    \n        // TODO: Add new product to database\n      }\n    };\n\n    WinJS.Binding.processAll(null,\
    \ viewModel);\n  }\n  document.addEventListener(\"DOMContentLoaded\", initialize);\n\
    })()\n```\n\nThe page in Listing 3.9 uses a data-win-bind attribute to wire up\
    \ the form submit event handler. You might be wondering whether it would be easier\
    \ to do without the data binding and directly wire up an event handler like this:\n\
    \n```\n<form onsubmit=\"submit\">\n```\n\nWhy use declarative data binding at\
    \ all? The advantage of using declarative data binding to wire up the event handler\
    \ is that you do not need to expose the handler through a namespace. When using\
    \ declarative data binding, a handler does not need to be a public method—the\
    \ only requirement is that it be part of the data context used with the WinJS.Binding.processAll()\
    \ method."
