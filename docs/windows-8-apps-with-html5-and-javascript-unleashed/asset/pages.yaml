    The previous code includes three event handlers:


    +   - click—When you click the btnKillAlien button, the current game score goes
    up by 1.

    - checkpoint—Called when the app is suspended. This event handler stores the current
    game score in session state.

    - activated—Called when the app is activated. If the app is activated after termination,
    then the current game score is loaded from session state. Otherwise, a default
    value for the game score is assigned.


    Session state is only loaded when an app is activated after termination. Session
    state is preserved, for example, when a user explicitly closes an app or reboots
    their machine.


    > NOTE

    Behind the scenes, session state is stored in local storage in a file named _sessionState.json.
    After the checkpoint event, session state is written to this file automatically.
    When an app is activated after termination, session state is loaded from this
    file automatically.


    # Application View States


    A Windows App can be displayed in several different view states. The different
    view states determine the horizontal and vertical real estate available to your
    application.


    A well-designed Windows App will intelligently adapt to the available real estate.
    For example, if a fat app is forced to get skinny, it will hide extra content
    automatically.


    In this section, you learn about the different Windows App view states and how
    you can take advantage of media queries to adapt to different view states automatically.


    # Snapped, Filled, Portrait, and Landscape


    A Windows App can be in snapped view state, filled view state, or full screen.
    Each of these states corresponds to a different horizontal resolution. For example,
    one Windows App can be snapped to the left or right edge of the screen while a
    second Windows App fills the remainder of the screen. The first app is in a snapped
    view state and the second app is in a filled view state.


    Figure 9.4 illustrates the difference between snapped and filled view state. In
    Figure 9.4, Internet Explorer is in a filled view state and the Weather app is
    in a snapped view state.'
