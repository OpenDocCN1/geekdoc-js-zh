  md: "# CHAPTER 4\nUsing WinJS Controls\n\nMy goal in this chapter is to provide\
    \ you with an overview of the controls included in the WinJS library. I start\
    \ by explaining how you can add controls to your pages. You learn how you can\
    \ create WinJS controls both declaratively and imperatively and set options.\n\
    \nThe bulk of this chapter is devoted to descriptions and samples of how you can\
    \ use the basic controls included in the WinJS library. In this chapter, I focus\
    \ on describing how you can use the following controls:\n\n+   * Tooltip—Used\
    \ to display a popup tooltip.\n* ToggleSwitch—Used to display a toggle switch\
    \ which can be used in the same scenarios as a checkbox.\n* Rating—Used to display\
    \ and enter a user rating.\n* DatePicker—Used to enter a date.\n* TimePicker—Used\
    \ to enter a time.\n* FlipView—Used to display details for one item from a collection\
    \ of items.\n\n# Introduction to WinJS Controls\n\nYou declare a WinJS control\
    \ in a page by using the data-win-control attribute. For example, you can declare\
    \ the WinJS DatePicker control by adding the following DIV element to a page:\n\
    \n```\n<div id=\"dateBirthday\"\n  data-win-control=\"WinJS.UI.DatePicker\"></div>\n\
    ```\n\n+   IN THIS CHAPTER\n* Introduction to WinJS Controls\n* Using the tooltip\
    \ Control\n* Using the ToggleSwitch Control\n* Using the Rating Control\n* Using\
    \ the' Control\n* Using the TimePicker Control\n* Using the FlipView Control"
