  md: '# Building Windows Store Apps with Visual Studio


    This book focuses on building Windows Store Apps with Visual Studio. In this section,
    I want to devote a few pages to describing the features of Visual Studio which
    matter when building Windows Store apps. You learn how to select a project template
    for a Windows Store app, how to run a Windows Store app, and how to debug a Windows
    Store app.


    # Windows Store App Project Templates


    When you select the File, New Project menu option in Visual Studio, you can select
    from five different project templates as your starting point for your Windows
    Store apps:


    +   1. Blank App—The simplest of the templates. Contains a single default.html,
    default, css, and default.js file.

    2. Navigation App—Use this template for apps which require multiple pages.

    3. Grid App—Contains two pages. One page displays a list of items in different
    groups. The second page displays details for the item which you click.

    4. Split App—Contains two pages. One page displays a list of groups. The second
    page displays a list of items and details for one item.

    5. Fixed Layout App—Always scales an element to the same size with the same aspect
    ratio regardless of the screen resolution.


    We already used the Blank App project template when creating our first Windows
    app above. Let me discuss the other project templates in more detail.


    # Navigation App Project Template


    The Blank App template is a good template to use when building a simple, single-page
    app. If you need to support multiple pages, on the other hand, then you should
    use the Navigation App template.


    The Navigation App project template includes a single page named home. You can
    add additional pages by adding new Page Controls to the pages subfolder (see Figure
    1.16). I describe how you can create multi-page applications in detail in Chapter
