  md: "# CHAPTER 6 Menus and Flyouts\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_185_0.png)\n\
    \nThe most common app bar command is the button command. You can create a click\
    \ handler for a button command and do some action in response to clicking the\
    \ button. For example, here is how you would create a click handler for the cmdPlay\
    \ button:\n\n```\nfunction () {\n  \"use strict\";\n\n  function initialize()\
    \ {\n    WinJS.UI.Element().done(function () {\n      var cmdPlay = document.getElementById(\"\
    cmdPlay\");\n      cmdPlay.addEventListener(\"click\", function () {\n       \
    \ console.log(\"Play song\");\n      });\n    });\n  }\ndocument.addEventListener(\"\
    DOMContentLoaded\", initialize);\n}());\n```\n\nThe button command includes both\
    \ a label and icon property which you can use to control the appearance of the\
    \ button in the app bar. You can either point the icon property to a custom PNG\
    \ image or use one of the over 100 built-in icons.\n\n> NOTE\nThere is a complete\
    \ list of the built-in icons in the WinJS Ui.js library. Just open the Ui.js file\
    \ in the Solution Explorer window by expanding the References folder and do a\
    \ search for \"glyphs.\"\n\nThe toggle command displays a button which looks just\
    \ like a button command. However, when you click the button, the button toggles\
    \ between a highlighted and not highlighted state.\n\nHere's how you can use the\
    \ selected property to determine whether a toggle button is selected:"
  merge: -1
  pgno: 185
- img_proc: true
  md: "```\n(function () {\n  \"use strict\";\n\n  function initialize() {\n    WinUS.UI.processAll().done(function\
    \ () {\n\n    var cmdMute = document.getElementById(\"cmdMute\");\n    cmdMute.addEventListener(\"\
    click\", function () {\n      console.log(cmdMute.winControl.selected);\n    });\n\
    \  });\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", initialize);\n});\\\
    ();\n```\n\nThe separator command creates a vertical bar between commands so you\
    \ can group them. Use an HR element instead of a BUTTON element when creating\
    \ a separator command.\n\nFinally, the flyout command displays a Flyout control.\
    \ In Listing 6.5, the cmdAdd command displays a Flyout that contains a form for\
    \ entering the title of a new song.\n\n# Showing Contextual Commands\n\nSome app\
    \ bar commands apply to the entire app. Other app bar commands apply only when\
    \ an item is selected. For example, it might make sense to always display an Add\
    \ button in the app bar. Displaying a Delete or Edit button, on the other hand,\
    \ makes sense only when an item is selected.\n\nThe app has two built-in sections\
    \ named \"global\" and \"selection.\" By default, when you add commands to the\
    \ app bar, the commands appear in the global section. These commands appear on\
    \ the right-hand side of the app bar.\n\nYou also have the option of adding commands\
    \ to the selection section. These commands appear on the left-hand side of the\
    \ app bar. Commands in the selection section should appear only when something\
    \ is selected.\n\nImagine that you want to display a list of tasks by using a\
    \ ListView control. You want users to be able to add new tasks and delete existing\
    \ tasks. In that case, it makes sense to place the Add button in the app bar global\
    \ section and the Delete button in the app bar selection section (see Figure 6.8)."
