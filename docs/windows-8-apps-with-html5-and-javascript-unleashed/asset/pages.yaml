    # Fixed Layout App Project Template


    The Fixed Layout template is for a very specific scenario. The HTML page in this
    template includes a Viewbox control, which resizes its content to fit the available
    screen real estate while retaining the correct aspect ratio.


    Imagine, for example, that you happen to have a picture of a Tesla and the picture
    measures 800px by 484px. You want the page to fill the entire available space
    but not get distorted.


    Figure 1.24 illustrates the appearance of the picture on a device with a resolution
    of 1,024px by 768px. Notice that the picture has been scaled automatically to
    fit the available space.'
