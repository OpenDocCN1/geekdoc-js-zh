  md: "# Namespaces, Modules, and Classes\n\nBecause the calculateTax() and calculateShipDate()\
    \ functions are added to the CompanyA.Utilities namespace, you can call these\
    \ two methods outside of the self-executing function. These are the public methods\
    \ of your library which form the public API.\n\nThe calculateStateTax() and calculateFederalTax()\
    \ methods, on the other hand, are hidden within the black hole of the self-executing\
    \ function. These methods are encapsulated and can never be called outside the\
    \ scope of the self-executing function. These are the internal methods of your\
    \ library.\n\n# Using Classes\n\nUnlike other popular computer languages—such\
    \ as C# or Java—JavaScript does not have any built-in support for classes. In\
    \ JavaScript, you do not distinguish between a type (class) and an instance of\
    \ that (an object). Everything in JavaScript is an object.\n\nThe WinJS library\
    \ includes extensions to JavaScript for creating classes. These methods are used\
    \ extensively within the WinJS library itself. For example, all of the WinJS JavaScript\
    \ controls are created using these methods. In this section, we discuss how you\
    \ can define new classes by taking advantage of the methods in the WinJS library.\n\
    \nUsing WinJS.Class.define()\n\nIn the WinJS library, new JavaScript classes are\
    \ created by calling the WinJS.Class.define(). This method accepts three arguments:\n\
    \n+   - constructor—The function used to initialize the new object. If you pass\
    \ null then an empty constructor is created\n- instanceMembers—A collection of\
    \ instance properties and methods\n- staticMembers—A collection of static properties\n\
    \nThe code in Listing 2.3 demonstrates how to create a Robot class and then create\
    \ a Roomba robot object from the Robot class:\n\nLISTING 2.3 Creating a Class\
    \ (classes\\classes.define(\n\n```\nvar Robot = WinJS.Class.define(\n  function\
    \ (name, price) {\n    this.name = name;\n    this.price = price;\n  },\n  _name:\
    \ undefined,\n  _price: 0,\n  price: {\n    set: function (value) {\n      if\
    \ (value < 0) throw new Error(\"Invalid price!\");\n```"
