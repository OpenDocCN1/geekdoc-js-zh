  md: "# CHAPTER 9 App Events and States\n\nIf you want to simulate app suspension\
    \ and termination, then you can click the Suspend and shutdown button. When you\
    \ click the Suspend and shutdown button, the checkpoint event is raised and your\
    \ app stops. When you run the app again, by actually running your app in Visual\
    \ Studio, the previous execution state property will have the value terminated.\n\
    \n# Storing State with Session State\n\nIf an app is suspended, then the app does\
    \ not lose state. However, if an app is suspended and terminated, the state of\
    \ any variables will lose their values and the app will start from scratch.\n\n\
    There is a special object, the WinJS.Application.sessionState object, which you\
    \ can use to store state across app suspension. Anything you add to session state\
    \ survives until the app is activated.\n\nThe following code illustrates how you\
    \ can use session state to store the user's current score:\n\n```\n(function ()\
    \ {\n  \"use strict\";\n\n  var _gameScore;\n\n  WinJS.Application.addEventListener(\"\
    activated\", function (evt) {\n    var appState = Windows.ApplicationModel.Activation.ApplicationExecutionState;\n\
    \    if (evt.detail.previousExecutionState == appState.notRunning ||\n       \
    \ evt.detail.previousExecutionState == appState.closedByUser) {\n        // Set\
    \ default game score\n        _gameScore = 0;\n    }\n    if (evt.detail.previousExecutionState\
    \ == appState.terminated) {\n      // Load game score from session state\n   \
    \   _gameScore = WinJS.Application.sessionState.gameScore;\n    }\n  });\n\n \
    \ WinJS.Application.addEventListener(\"checkpoint\", function (evt) {\n    //\
    \ Save game score to session state\n    WinJS.Application.sessionState.gameScore\
    \ = _gameScore;\n  });\n\n  WinJS.Application.addEventListener(\"ready\", function\
    \ (evt) {\n    // Killed alien, byId\n    document.getElementById(\"btnKillAlien\"\
    ).addEventListener(\"click\", function () {\n      _gameScore++;\n    });\n});\n\
    ```"
