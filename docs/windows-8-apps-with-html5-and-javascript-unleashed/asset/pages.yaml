  md: "# Creating a Web Service Data Source\n\n239\n\n```\n);\n```\n\n```\nroutes.MapHttpRoute(\n\
    \  name: \"TasksRemove\",\n  routeTemplate: \"api/tasks/remove/{key}\",\n  defaults:\
    \ new { controller = \"tasks\", action = \"remove\" }\n);\n```\n\n```\nroutes.MapHttpRoute(\n\
    \  name: \"TasksNuke\",\n  routeTemplate: \"api/tasks/nuke\",\n  defaults: new\
    \ { controller = \"tasks\", action = \"nuke\" }\n);\n```\n\nFor example, you make\
    \ an HTTP GET request for /api/tasks/getcount, then the TasksController.GetCount()\
    \ Web API controller is invoked.\n\nThe Web API Controller is named TasksController.\
    \ It contains GetCount(), ItemsFromIndex(), InsertAtEnd(), Remove(), and Nuke()\
    \ controller actions. The controller use the Microsoft Entity Framework to interact\
