    # Publishing to the Windows Store


    One of the main motivations for building a Windows Store app is to sell your app
    in the Windows Store for either fame or profit. In this section, I discuss the
    steps you need to follow to publish your Windows app to the Windows Store.


    > NOTE

    You can distribute your app without publishing to the Windows Store by taking
    advantage of a feature called sideloading. In order to take advantage of sideloading,
    you must sign your app and configure the right group policy settings on the target
    computers. You can learn about sideloading by visiting http://technet.microsoft.com/en-us/library/hh852635.aspx.


    # Register as a Windows Developer


    Before you publish an app to the Windows Store, you must first register as a Windows
    Store developer. You can sign up at the Windows Store Dashboard on the Windows
    Dev Center.'
