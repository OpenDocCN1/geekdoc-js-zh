  md: "```\nmovePlayerKeyboard(): function (e) {\n  switch (e.keyCode) {\n    case\
    \ WinJS.Utilities.Key.upArrow:\n      this._player.direction = Unleashed.Direction.up;\n\
    \      break;\n    case WinJS.Utilities.Key.downArrow:\n      this._player.direction\
    \ = Unleashed.Direction.down;\n      break;\n    case WinJS.Utilities.Key.leftArrow:\n\
    \      this._player.direction = Unleashed.Direction.left;\n      break;\n    case\
    \ WinJS.Utilities.Key.rightArrow:\n      this._player.direction = Unleashed.Direction.right;\n\
    \      break;\n    case WinJS.Utilities.Key.space:\n      this._player.direction\
    \ = Unleashed.Direction.none;\n      break;\n  }\n}\n\n```\n\nThe movePlayerKeyboard()\
    \ method takes advantage of the WinJS.Utilities.Key enumeration to detect which\
    \ keyboard key was pressed. This enumeration contains a list of human friendly\
    \ names for the key codes so you can use WinJS.Utilities.Key.upArrow instead of\
    \ 38.\n\nIf you are using a tablet device, then you want to use touch instead\
    \ of a keyboard. In that case you touch the screen to indicate the direction in\
    \ which you want your character to move.\n\nThe following code is used to capture\
    \ the MSPoDown event. This event is raised when you press down on your mouse button,\
    \ touch the screen with your finger, or touch the screen with a stylus:\n\n```\n\
    this._canvas.addEventListener(\"PointerDown\", this.movePlayerTouch.bind(this));\n\
    ```\n\nWhen the MSPoDown event is raised, the movePlayerTouch() method is called.\
    \ This method takes care of changing the direction in which your character moves:\n\
    \n```\nmovePlayerTouch(): function (e) {\n  var playerX = this._player.x * TILE_WIDTH;\n\
    \  var playerY = this._player.y * TILE_HEIGHT;\n  var absX = Math.abs(e.offsetX\
    \ - playerX);\n  var absY = Math.abs(e.offsetY - playerY);\n}\n```"
  merge: -1
  pgno: 339
- img_proc: true
  md: "```\nif (absX > absY) {\n    if (offsetX > playerX) {\n        this._player.direction\
    \ = Unleashed.Direction.right;\n    } else {\n        this._player.direction =\
    \ Unleashed.Direction.left;\n    }\n} else {\n    if (offsetY > playerY) {\n \
    \       this._player.direction = Unleashed.Direction.down;\n    } else {\n   \
    \     this._player.direction = Unleashed.Direction.up;\n    }\n}\n},\n```\n\n\
    Depending on where you touch the screen, your character moves in different directions.\
    \ For example, if you touch the screen below your character, then your character\
    \ changes direction to move down. If you touch to the right of your character,\
    \ then your character moves to the right (see Figure 12.5).\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_340_0.png)\n\
    \nFIGURE 12.5 Touching the screen to change direction\n\n# Creating the Update\
    \ Loop\n\nThe Brain Eater game uses two loops during game play. The game executes\
    \ an update loop to update the positions of the player and the zombies. The game\
    \ also executes a render loop to render the game.\n\nThe update loop executes\
    \ every 250 milliseconds. The executeUpdateLoop() method is triggered by the following\
    \ call to the window.setInterval() method when you start a game:\n\n```\nthis._updateLoopId\
    \ = window.setInterval(this.executeUpdateLoop.bind(this,\nUPDATE_LOOP_RATE);\n\
    ```"
  merge: -1
  pgno: 340
- img_proc: true
  md: "# CHAPTER 12 Graphics and Games\n\n> NOTE\nbind() method called on the executeUpdateLoop()\
    \ method is used to bind the current instance of the Game object to the executeUpdateLoop()\
    \ method when the executeUpdateLoop() method is called. In other words, it ensures\
    \ that this variable will refer to the current instance of the Game object within\
    \ the executeUpdateLoop() method.\n\nThe UPDATE_LOOP_RATE constant has the value\
    \ 250 milliseconds. If you want the zombies to chase you, then you can reduce\
    \ this value (the game generally gets harder the lower that you make this number).\n\
    \nThe executeUpdateLoop() method looks like this:\n\n```\nexecuteUpdateLoop: function\
    \ () {\n    this.updateMonsterPositions();\n    this.updatePlayerPosition();\n\
    }\n```\n\nThis method updates the positions of the zombies and the player. For\
    \ example, the updateMonsterPositions() method moves all of the zombies in the\
    \ direction of the player.\n\nWhile updating the positions of the zombies and\
    \ the player, the update loop also checks for collisions. The update loop must\
    \ check whether there is a collision between the player and a zombie between the\
    \ player and a food pellet.\n\nFor example, the updatePlayerPosition() method\
    \ calls the following collideFood() method to detect whether the player has walked\
    \ into a food pellet:\n\n```\ncollideFood: function () {\n    for (var i = 0;\
    \ i < this.food.length; i++) {\n        var food = this.food[i];\n        if (this.player.x\
    \ === food.x && this.player.y === food.y) {\n            Unleashed.Sounds.yum.play();\n\
    \            this.food.splice(i, 1);\n        }\n    }\n\n    // If no more food\
    \ then player wins!\n    if (this.food.length === 0) {\n        this.win();\n\
    \    }\n}\n```\n\nThe collideFood() method loops through the JavaScript _food\
    \ array and checks whether the x and y position of any food pellet corresponds\
    \ to the x and y position of the"
  merge: -1
  pgno: 341
- img_proc: true
  md: "If there is a match then a “Yum!” sound is played and the food pellet is removed\
    \ from the food array using _food.splice(). If all the food is eaten, the player\
    \ wins.\n\nThe update loop does not render anything to a screen. The update loop\
    \ is responsible for the state of the game. Rendering the game is the responsibility\
    \ of the render loop.\n\n# # Creating the Render Loop\n\nThe render loop is responsible\
    \ for rendering the game board. Unlike the update loop, which is triggered by\
    \ the window.setInterval() method, the render loop is executed by calling the\
    \ requestAnimationFrame() method.\n\nThe requestAnimationFrame() method is defined\
    \ as part of the W3C Timing Control for Script-Based Animation standard. This\
    \ method was introduced specifically for the purpose of creating animations.\n\
    \nWhen you use the requestAnimationFrame() method, you don't specify how often\
    \ the screen should be rendered. Instead, let the browser determine the best frame\
    \ rate.\n\nThe idea is that the browser can do a better job than you in determining\
    \ the best frame rate. The browser can take into account all of the animations\
    \ being rendered and, therefore, all of the animations more smoothly. If the page\
    \ is not currently visible, the browser can throttle the animations and consume\
    \ CPU power.\n\nIn the Brain Eaters game, the render loop is started with the\
    \ following code:\n\n```\nthis.animationLoopId = window.requestAnimationFrame(this.executeRenderLoop.bind(this));\n\
    ```\n\nThe executeRenderLoop() method is passed to the requestAnimationFrame()\
    \ method. The executeRenderLoop() method calls it like this:\n\n```\nexecuteRenderLoop():\
    \ function () {\n  this.render();\n  this._animationLoopId = window.requestAnimationFrame(this.executeRenderLoop.bind(this));\n\
    }\n```\n\nThe executeRenderLoop() calls the render() method and then immediately\
    \ calls the window.requestAnimationFrame() method again. It is up to the window.requestAnimationFrame()\
    \ method to decide how quickly the executeRenderLoop() method gets called again.\n\
    \n> NOTE\nThewindow.requestAnimationFrame() method is similar to the window.setTimeout()\
    \ method with the crucial difference that you don't specify a timeout value. The\
    \ window.requestAnimationFrame() method figures out its own timeout value."
  merge: -1
  pgno: 342
- img_proc: true
  md: "# CHAPTER 12 Graphics and Games\n\nThe render() method is responsible for drawing\
    \ the screen and it looks like this:\n\n```\nrender: function () {\n  this.renderBoard();\n\
    \  this.renderFood();\n  this.renderMonsters();\n  this.renderPlayer();\n},\n\
    ```\n\nThe render() method draws the game board, the food pellets, the monsters,\
    \ and the player.\n\nThe renderBoard() method draws the 20 by 15 tile game board\
    \ by calling the drawImage() method for each tile in the game board. Here's what\
    \ the renderBoard() method looks like:\n\n```\nrenderBoard: function () {\n  for\
    \ (var y = 0; y < VERTICAL_TILES; y++) {\n    for (var x = 0; x < HORIZONTAL_TILES;\
    \ x++) {\n      var tile = this.getTile(x, y);\n      if (tile) {\n        this.drawImage(tile.image,\
    \ x, y);\n      } else {\n        this.drawImage(Unleashed.Tiles.background.image,\
    \ x, y);\n      }\n    }\n  }\n}\n```\n\nThe renderFood() and renderMonsters()\
    \ methods are very similar; both methods loop through an array and render each\
    \ element in the array to the screen. Here's what the renderMonsters() method\
    \ looks like:\n\n```\nrenderMonsters: function () {\n  for (var i = 0; i < this.monsters.length;\
    \ i++) {\n    var monster = this.monsters[i];\n    this.drawImage(monster.tile.image,\
    \ monster.x, monster.y);\n  }\n}\n```\n\nIn the previous code, the _monsters array\
    \ contains an array of monster objects. The drawImage() method is used to draw\
    \ each monster to the Canvas element.\n\nFinally, the renderPlayer() method renders\
    \ the player (the hero of the game) to the screen like this:"
  merge: -1
  pgno: 343
- img_proc: true
  md: "```\nrenderPlayer: function () {\n  this.drawImage(this.player.tile.image,\
    \ this.player.x, this.player.y);\n}\n```\n\n> > NOTE\nThe requestAnimationFrame()\
    \ method is defined in the Timing Control for Script-Based Animation standard\
    \ located at http://dvcs.w3.org/hg/webperf/raw-file/tip/specs/RequestAnimationFrame/Overview.html\n\
    \n# # Summary\n\nThe goal of this chapter was to create a simple game by creating\
    \ a Windows Store app. I showed you how to create image and sound files for the\
    \ game and I showed you how to render the images using the HTML5 Canvas element.\n\
    \nYou also learned how to create both an update loop and a render loop. The update\
    \ loop is used to update the positions of the monsters and player on the game\
    \ board. The render loop is used to render the game board by calling the requestAnimationFrame()\
    \ method to draw the image tiles.\n\nGood luck winning the game! If you win the\
    \ game, you get to hear my children cheer."
