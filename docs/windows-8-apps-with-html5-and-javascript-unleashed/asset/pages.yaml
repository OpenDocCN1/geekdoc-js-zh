  md: '# What Is a Windows Store App?


    In a Windows Store app, you hide all of your commands in the app bar. The app
    bar appears only when you swipe from the bottom or top of the screen or you right-click
    the screen.


    The app bar for Internet Explorer includes the address bar and buttons such as
    the back button and refresh button (see Figure 1.2).


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_22_0.png)


    FIGURE 1.2 Using the app bar and nav bar


    Notice in Figure 1.2 that there is another bar at the top of the screen. This
    bar is called the nav bar and you use it to navigate. In the case of Internet
    Explorer, the nav bar contains thumbnails of all of your browser tabs.


    # Using Charms


    If you swipe from the right edge of the screen or mouse to either of the right
    corners or press the keyboard combination Win+c, then the charms are revealed
    (see Figure 1.3).'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# CHAPTER 1 Building Windows Store Apps


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_23_0.png)


    FIGURE 1.3 Viewing charms


    Here''s a list of the standard charms:


    +   - Search—Enables you to search content in the current app and other apps.

    - Share—Enables you to share content in the current app with other apps.

    - Start—Navigates you to the Start screen.

    - Devices—Enables you to connect to a device.

    - Settings—Enables you to configure both app settings and system settings.


    These charms provide you with standard locations to place common application functionality.
    For example, all Windows Store app settings should appear in the Settings charm
    (see Figure 1.4). This makes it much easier for users to find your settings.'
  merge: -1
