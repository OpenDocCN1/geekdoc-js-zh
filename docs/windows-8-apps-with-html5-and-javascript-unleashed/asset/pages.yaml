  md: "If you want to change a property without triggering notifications, then you\
    \ should change the property by using the backingData property. The code in Listing\
    \ 3.3 illustrates how you can change the price property silently:\n\nLISTING 3.3\
    \ Bypassing Notifications (observablesBypass.observablesBypass.html)\n\n```\n\
    // Simple product object\nvar product = {\n  name: \"Milk\",\n  description: \"\
    Something to drink\",\n  price: 12.33\n}\n\n// Create observable object\nvar observableProduct\
    \ = WinJS.Binding.as(product)\n\n// Execute a function when price is changed\n\
    observableProduct.bind(\"price\", function (newValue) {\n  console.log(newValue);\n\
    });\n\n// Change the price silently\nobservableProduct.backingData.price = 5.99;\n\
    console.log(observableProduct.price); // Writes 5.99\n```\n\nThe price is changed\
    \ to 5.99 by changing the value of backingData.price. Because the observableProduct.price\
    \ property is not set directly, listeners associated with the price property are\
    \ not notified.\n\nWhen you change the value of a property by using the backingData\
    \ property, the change in the property happens synchronously. However, when you\
    \ change the value of an observable property directly, the change is always asynchronous.\n\
    \n# Working with the WinJS.Binding.List Object\n\nIf you want to be notified whenever\
