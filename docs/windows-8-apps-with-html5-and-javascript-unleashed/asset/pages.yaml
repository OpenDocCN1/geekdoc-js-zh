  md: "# LISTING 4.17 Displaying the Current Page Number with a FlipView (flipViewPageNumber\\\
    flipViewPageNumber.js)\n\n```\n(function () {\n  \"use strict\";\n\nfunction initialize()\
    \ {\n  WinJS.UI.processAll().done(function () {\n    var fvArticles = document.getElementById(\"\
    fvArticles\").winControl;\n    var divPageNumber = document.getElementById(\"\
    divPageNumber\");\n\n    // Show Page Number and Page Count\n    function updatePageNumber()\
    \ {\n      var currentPage = fvArticles.currentPage + 1;\n      fvArticles.count.done(function\
    \ (count) {\n        divPageNumber.innerHTML = \"Page \" + currentPage\n     \
    \     + \" of \" + count;\n      });\n    }\n    updatePageNumber();\n\n    //\
    \ Update Page Number when new page selected\n    fvArticles.addEventListener(\"\
    pageselected\", updatePageNumber);\n  });\n}\n\ndocument.addEventListener(\"DOMContentLoaded\"\
    , initialize);\n}());\n```\n\nThe page number and page count displayed in the\
    \ HTML page is updated with the updatePageNumber() function contained in Listing\
    \ 4.17. This function updates the divPageNumber DIV element in the page.\n\nNotice\
    \ that the FlipView count() method does not directly return a page count. Instead,\
    \ it returns a promise which returns a page count when the promise completes.\
    \ This makes the updatePageNumber() function slightly more complicated.\n\n# Creating\
    \ Custom FlipView Buttons\n\nYou might want to create custom buttons for navigating\
    \ back and forth through the items in a FlipView. The default arrows which appear\
    \ for navigating through a FlipView are subtle; they don't appear unless you hover\
    \ your mouse over the control. You might want to bang the user over the head with\
    \ more explicit navigation buttons."
