  md: '# Installing the Live SDK


    Before you can use the Live Connect API, you need to download the latest version
    of the Live SDK for Windows and Windows Phone from the Microsoft website. You
    can download the SDK from the Dev Center for Windows Store apps at http://msdn.microsoft.com/en-us/windows/apps/


    # Adding a Reference to the Live SDK


    After you download the Live SDK, you need to add a reference to the Live SDK JavaScript
    library to your Visual Studio Windows Store app project. Select the menu option
    Project, Add Reference. After picking Windows, Extensions, check the checkbox
    next to Live SDK (see Figure 11.1).


    > WARNING


    After downloading the Live SDK, you need to stop and start Visual Studio for the
    Live SDK to appear in the Reference Manager.


    ![](img/3fb402034fe87fe7c8b9c70e5eae6c75_307_0.png)


    FIGURE 11.1 Adding a reference to the Live SDK JavaScript library


    Next, expand your References, Live SDK, JS folder and drag the wl.js file onto
    your default html page. This will add the following JavaScript reference:


    ```

    <script type="text/javascript" src="/LiveSDK/js/wl.js"></script>

    ```


    # Registering Your App


    Before you can start using the Live Connect API, you must first register your
    app with Live Connect. Visit the following website: https://manage.dev.live.com/build.'
  merge: -1
  pgno: 307
