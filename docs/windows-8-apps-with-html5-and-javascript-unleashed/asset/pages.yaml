    You can use CTRL-b to make the text italic, CTRL-u to make the text underlined.


    Notice the DIV element with the contenteditable attribute has two CSS classes
    applied to it named win-textarea and richtext. The win-textarea class is included
    as part of the WinJS library and this class applies the standard Windows Store
    app styles to the editor.


    The richtext class is defined like this:


    ```

    .richtext {

    width:300px;

    height:100px;

    white-space:pre-wrap;

    }

    ```


    The HTML5 recommendation recommends that you should always use white-space:pre-wrap
    with a contenteditable DIV element, and how am I to question the wisdom of the
    editors of the HTML5 recommendation? For this reason, I always use white-space:pre-wrap
    with a contenteditable DIV.


    # Displaying Progress


    The HTML5 recommendation includes a new element named progress element which enables
    you to display a progress indicator. There are two basic types of progress indicators:
    an indeterminate and a determinate progress indicator.'
  merge: -1
  pgno: 169
- img_proc: true
  md: "You use an indeterminate progress indicator when you want to show a busy wait\
    \ indicator and you do not know how much longer a task will take. Here's how you\
    \ declare an indeterminate progress indicator:\n\n```\n<progress id=\"progress1\"\
    ></progress>\n```\n\nIn a Windows Store app, the default progress indicator displays\
    \ a set of animated dots moving horizontally (see Figure 5.17).\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_170_0.png)\n\
    \nFIGURE 5.17 Displaying indeterminate progress\n\nIf you want to display a determinate\
    \ progress indicator, then you need to supply values for the progress element's\
    \ max and value attributes. For example, here's how you would create a progress\
    \ indicator which shows progress between the values 1 and 20:\n\n```\n<progress\
    \ id=\"progress1\"\nmax=\"20\"\nvalue=\"1\">\n</progress>\n```\n\nAnd, here is\
    \ JavaScript code which updates the progress every 1 second:\n\n```\n(function\
    \ () {\n  \"use strict\";\n\n  function initialize() {\n    var progress1 = document.getElementById(\"\
    progress1\");\n    var ivProgress = setInterval(updateProgress, 1000);\n  }\n\n\
    \  function updateProgress() {\n    progress1.value = ++progress1.value;\n   \
    \ if (progress1.value === 20) {\n      window.clearInterval(ivProgress);\n   \
    \ }\n  }\n\n  document.addEventListener(\"DOMContentLoaded\", initialize);\n})();\n\
    ```\n\nDeclaring a progress element in this way gives you a traditional progress\
    \ bar (see Figure 5.18)."
