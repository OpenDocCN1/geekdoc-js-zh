    lvBlog\").winControl;\n\n      // Use WinRT SyndicationClient to get blog feed\n\
    \      var client = new Windows.Web.Syndication.SyndicationClient();\n      var\
    \ feedURI = new Windows.Foundation.Uri(\"http://stephenwalther.com/feed/\");\n\
    \      client.retrieveFeedAsync(feedURI).done(function () {\n        // Convert\
