  md: "You can customize the appearance of the dialog by supplying commands. For example,\
    \ here is how you would create a Yes/No dialog:\n\n```\n// Create dialog\nvar\
    \ message = new Windows.UI.Popups.MessageDialog(\n  \"Did you know that your fly\
    \ is unzipped?\",\n  \"Warning!\"\nn);\n```\n\n```\n// Add commands\nmessage.commands.append(new\
    \ Windows.UI.Popups.UICommand(\"&Yes\"));\nmessage.commands.append(new Windows.UI.Popups.UICommand(\"\
    &No\"));\n```\n\n```\n// Show dialog\nmessage.showAsync().done(function(answer)\
    \ {\n  if (answer.label === \"&Yes\") {\n    console.log(\"You picked yes\");\n\
    \  } else {\n    console.log(\"You picked no\");\n  }\n});\n```\n\nThe code appends\
    \ two UICommand objects to the message dialog which are labeled Yes and No (see\
    \ Figure 6.13). You can use the promise returned by the showAsync() method to\
    \ determine which of the two buttons was clicked.\n\n![](img/3fb402034fe87fe7c8b9c70e5eae6c75_196_0.png)\n\
    \nFIGURE 6.13 Yes/no dialog\n\n> NOTE That the buttons labels are \"&Yes\" and\
    \ \"&No\". The & is used to specify the keyboard shortcut for invoking the button.\
    \ You can press ALT-Y to invoke the Yes button and ALT-N to invoke the No button.\
    \ When you hold down the ALT key, the shortcuts appear with underlines."
