- img_proc: true
  md: "# NOTE\n\nAll of the scripts and style sheets referred to in the head of a\
    \ Page Control HTML file are removed from the HTML file and added to the parent\
    \ page. In other words, all of the scripts and styles are promoted up to the containing\
    \ page.\n\nThe alert.css file looks like this (not super exciting):\n\n```\nalert\
    \ {\n  background-color: red\n}\n```\n\nThe CSS file changes the background color\
    \ of the Alert button to the color red.\n\nFinally, the alert.js file looks like\
    \ this:\n\n```\n// <reference path=\"Microsoft.WinJS.1.0/js/base.js\" />\n// <reference\
    \ path=\"Microsoft.WinJS.1.0/js/ui.js\" />\n(function () {\n  \"use strict\";\n\
    \n  var Alert = WinJS.UI.Pages.define(\"myControls/alert.html\", {\n\n  ready:\
    \ function (element, options) {\n    var btn = WinJS.Utilities.query(\"button\"\
    , element);\n\n    // Set option defaults\n    options.buttonLabel = options.buttonLabel\
    \ || \"Show Alert\";\n    options.message = options.message || \"Alert!!!\";\n\
    \n    // Update button label text\n    btn[0].innerText = options.buttonLabel;\n\
    \n    // Setup click handler\n    btn.listen(\"click\", function () {\n      var\
    \ md = new Windows.UI.Popups.MessageDialog(\n        options.message\n      );\n\
    \      md.showAsync();\n    });\n  }\n});\n\nWinJS.Namespace.define(\"MyControls\"\
    , {\n  Alert: Alert\n});\n})();\n```"
