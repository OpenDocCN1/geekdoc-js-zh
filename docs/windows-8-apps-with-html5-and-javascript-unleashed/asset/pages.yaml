    \      tooltip:'Add Task',\n      type:'flyout',\n      flyout:select('#flyAdd'),\n\
    \      section:'global'\n    }\\>\n  </button>\n  <button data-win-control=\"\
    WinJS.UI.AppBarCommand\"\n    data-win-options=\"{\n      id:'cmdDelete',\n  \
    \    label:'Delete',\n      icon:'delete',\n      tooltip:'Delete Task',\n   \
    \   section:'selection',\n      extraClass:'appBarSelection'\n    }\">\n  </button>\n\
    </div>\n```"
