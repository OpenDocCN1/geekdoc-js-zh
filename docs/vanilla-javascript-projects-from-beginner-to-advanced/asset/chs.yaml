  ```\n\n列表 17‑4：main.js\n\n注意，我们可以从 JS 代码导入 CSS 样式表。\n\n接下来，我们定义了一个 `async` 函数，用于从\
  \ API 获取温度数据：\n\n```javascript\nconst getTemp = async function(lat, lon) {\n  try\
  \ {\n    const URL = 'https://api.open-meteo.com/v1/forecast?latitude='+ lat + '&longitude='\
  \ + lon + '&current=temperature_2m';\n    const response = await fetch(URL);\n \
  \   if (!response.ok) {\n      throw new Error(\"Error in network response\");\n\
  \    }\n    const temp = await response.json();\n    return temp.current.temperature_2m;\n\
  \  } catch (error) {\n    console.error(\"There has been a problem with fetch:\"\
  , error);\n    return null;\n  }\n}\n```\n\n列表 17‑5：main.js\n\n然后，我们定义了一个在用户点击地图时会被调用的\
  \ `async` 函数：\n\n```javascript\n//在地图上显示弹窗\nconst handleClickOnMap = async function(event)\
  \ {\n  var point = map.getCoordinateFromPixel(event.pixel);\n  var lonLat = toLonLat(point);\n\
  \  let temp = await getTemp(lonLat[1], lonLat[0]);\n  if (temp !== null) {\n   \
  \ content.innerHTML= '<p>You clicked here:</p><code>' + lonLat+ '</code><p>Temperature:\
  \ ' + temp + '</p>';\n  } else {\n    content.innerHTML= '<p>You clicked here:</p><code>'\
  \ + lonLat+ '</code><p>There was an error with the request</p>';\n  }\n  overlay.setPosition(point);\n\
  }\n```\n\n列表 17‑6：main.js\n\n我们从地图上的像素获取坐标，并将其转换为经、纬度值。我们使用这些值来获取特定位置的温度。然后我们构建弹窗消息并将其显示在地图上。\n\
  \n接下来，我们定义了将在应用程序中使用的 `Open Layers` 对象。我们定义了一个与实际地图对应的 `Map` 对象。我们还定义了一个 `View`\
  \ 对象，用于将地图居中并设置缩放级别。此外，我们定义了一个包含弹窗的 `Overlay` 对象：\n\n```javascript\n//用于将弹窗锚定到地图上的覆盖层\n\
  const overlay = new Overlay({\n  element: container,\n  autoPan: {\n    animation:\
  \ {\n      duration: 250,\n    },\n  },\n});\n//视图对象\nconst view = new View({\n\
  \  center: [0, 0],\n  zoom: 1,\n});\n//地图对象\nconst map = new Map({\n  target: 'map',\n\
  \  layers: [new TileLayer({source: new OSM()})],\n  overlays: [overlay],\n  view:\
  \ view\n});\n```\n\n列表 17‑7：main.js\n\n现在，我们将定义一个回调函数，当我们的应用程序从浏览器获取地理位置信息时会被调用。用户将被要求允许访问其位置。如果获得许可，则将调用此函数：\n\
  \n```javascript\n//如果我们获取了地理位置 --> 将地图居中到我们的位置\n//并显示当前温度\nconst centerToPosition\
  \ = async function(position) {\n  //在用户位置添加标记\n  var layer = new VectorLayer({\n\
  \    source: new VectorSource({\n      features: [new Feature({\n        geometry:\
  \ new Point(fromLonLat([position.coords.longitude,position.coords.latitude]))\n\
  \      })])\n    })\n  });\n  map.addLayer(layer);\n  //获取用户所在位置的温度\n  let temp\
  \ = await getTemp(position.coords.latitude,position.coords.longitude); \n\n  if\
  \ (temp !== null) {\n    content.innerHTML= '<p>Temperature: ' + temp + '</p>';\n\
  \  } else {\n    content.innerHTML= '<p>There was an error with the request</p>';\n\
  \  }\n  //在用户位置设置弹窗的位置\n  var point = fromLonLat([position.coords.longitude,position.coords.latitude]);\n\
  \  overlay.setPosition(point);\n  //创建一个带有新坐标\n//和缩放级别的视图对象\n  const newView = new\
  \ View({\n    center: fromLonLat([position.coords.longitude,position.coords.latitude]),\n\
  \    zoom: 10,\n  });\n  //更新地图到新视图\n  map.setView(newView);\n}\n```\n\n列表 17‑8：main.js\n\
  \n\n\n\n```javascript\nconst productsEl = document.querySelector('.products');\n\
  const spinnerEl = document.querySelector('.spinner-border');\nconst fetchProducts\
  \ = async (limit, skip) => {\n  const URL = `https://dummyjson.com/products/?limit=${limit}&skip=${skip}`;\n\
  \  const response = await fetch(URL);\n  if (!response.ok) {\n    throw new Error(`Error:\
  \ ${response.status}`);\n  }\n  return await response.json()\n}\n```\n列表 18‑2: script.js\n\
  \n这是一个 `async` 函数，因为它必须在 `fetch()` 操作上进行 `await`。我们的函数有两个参数，将实现分页功能：\n\n- `limit`：将获取多少个项目\n\
  - `skip`：从开始将跳过多少项目\n\n例如，使用 `limit=10` 和 `skip=50`，我们将从产品列表中的第 51 个项目开始获取 10 个项目。\n\
  \n接下来，我们定义了在页面上渲染产品信息的函数：\n\n```javascript\nconst renderProducts = (products) =>\
  \ {\n  products.forEach(product => {\n    const productEl = document.createElement('div');\n\
  \    productEl.classList.add('card');\n    productEl.style = \"width: 25rem;\"\n\
  \    productEl.innerHTML = `<img src=\"${product.thumbnail}\"class=\"card-img-top\
  \ img-thumbnail\" style=\"height:300px\"><div class=\"card-body\"><h5 class=\"card-title\"\
  >${product.title}</h5><p class=\"card-text\">${product.description}</p>`;\n    productsEl.appendChild(productEl);\n\
  \  });\n};\n```\n列表 18‑3: script.js\n\n对于返回的 JSON 数组中的每个产品，我们创建一个新的 `<div>` 元素，它具有\
  \ Bootstrap 卡样式类。在卡片内部，我们放置了产品的缩略图、标题和描述。图像直接从 DummyJSON 服务器加载；我们只需要输入 API 提供的 URL。最后，新的\
  \ `<div>` 元素被添加到产品列表 `<div>` 元素中。\n\n接下来，我们创建了一个 `async` 函数来调用前面的两个函数，但只有当有更多产品需要获取时才调用：\n\
  \n```javascript\nconst loadProducts = async (page, limit) => {\n  showSpinner();\n\
  \  try {\n    if (skip < total || total == 0) {\n      const response = await fetchProducts(page,\
  \ limit);\n      renderProducts(response.products);\n      total = response.total;\n\
  \  }\n  } catch (error) {\n    console.log(error.message);\n  }\n  hideSpinner();\n\
  };\nconst hideSpinner = () => {\n  spinnerEl.style.visibility = \"hidden\";\n};\n\
  const showSpinner = () => {\n  spinnerEl.style.visibility = \"visible\";\n};\n```\n\
  列表 18‑4: script.js\n\n来自 Web API 的响应包含 `total` 参数，表示可用产品的总数。我们将此值保存在本地变量 `total`\
  \ 中，并将其与 `skip` 参数进行比较，以确认为是否还有剩余产品可以获取。该函数在获取操作开始时显示加载器 `<div>`，并在响应在网页中显示后将其隐藏。\n\
  \n接下来，我们有一个 `handleScroll()` 函数，它在触发 `scroll` 事件时被调用：\n\n```javascript\nconst handleScroll\
  \ = () => {\n  if (timerRunning) return;\n  timerRunning = true;\n  setTimeout(()\
  \ => {\n    const docEl = document.documentElement;\n    if (docEl.scrollTop + docEl.clientHeight\
  \ >= docEl.scrollHeight - 10) {\n      skip += limit;\n      loadProducts(limit,\
  \ skip);\n    }\n    timerRunning = false;\n  }, 1000);\n};\nwindow.addEventListener('scroll',\
  \ handleScroll);\n```\n列表 18‑5: script.js\n\n当我们滚动页面时，滚动事件会被调用多次。为了避免过频繁调用 `loadProducts()`\
  \ 函数，我们将使用 `setTimeout()` 函数添加一秒钟的延迟。当回调函数运行时，它将使用 `scrollTop`、`clientHeight` 和\
  \ `scrollHeight` 属性来判断判断是否应该获取下一批产品。我们使用 `timerRunning` 布尔值来控制是调用还是跳过 `setTimeout()`。\n\
  \n最后，我们初始化使用的参数，并加载列表中的第一批产品：\n\n```javascript\nconst limit = 12;\nlet total = 0;\n\
  let skip = 0;\nvar timerRunning;\nloadProducts(limit, skip);\n```\n列表 18‑6: script.js\n\
