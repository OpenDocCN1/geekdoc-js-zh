  }\n``` |\n\n**Listing 21‑2: `masterComponent.js`**\n\n### Listing 21‑2: `masterComponent.js`\n\
  \nIn the `constructor`, we define the data that this component will handle: the\
  \ list of users and the selected user ID.\n\nIn the `setEventListeners()` function\
  \ we add an event listener for the `click` event. The event handler finds the row\
  \ that was clicked on and gets the ID of the selected user from the `data-user-id`\
  \ custom attribute. Then, it emits a custom event with the name `userSelected`,\
