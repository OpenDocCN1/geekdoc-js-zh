  \ 进行测试。\n\n## 涵盖的概念\n\n*   ES6 模块\n*   `Webpack`\n*   `Babel`\n*   `Jest`\n\n##\
  \ 建议方案\n\n我们在上一个项目中创建的 Web 应用状态良好。我们已经将各种功能分离到不同的 JS 文件中，并引入了使用 `QUnit` 测试。然而，它没有利用\
  \ JavaScript 世界引入的现代技术。\n\n更具体地说，JS 代码的加载方式会导致全局对象的创建，从而污染了应用程序的命名空间。在使用多个库时，这可能会导致对象之间的冲突。我们可以通过创建\
  \ ES6 模块来解决这个问题，模块将包含我们的代码而不创建全局对象。\n\n此外，在我们当前的项目中，我们无法利用为 `Node.js` 开发的许多库。我们现在可以使用的只有那些可以通过浏览器链接加载的库（例如\
  \ `QUnit` 或 `Bootstrap`）。为了使用 `NPM` 库，我们需要使用像 `Webpack` 或 `Vite` 这样的构建工具。\n\n通过使用\
  \ `Webpack`，我们可以将代码拆分为多个模块，而不会创建全局对象，也不必担心哪个文件先加载。此外，我们可以将这些 JS 文件打包成一个大文件，供用户的浏览器下载。\n\
  \n通过这种方式，我们还可以更高级的测试库，例如 `Jest`。\n\n# 部分 A – ES6 模块和 Webpack\n\n首先，我们必须在开发机器上安装\
  \ `Node.js`。我们可以在此处找到它：`https://nodejs.org/en`\n\n然后通过在命令提示符中输入命令开始项目初始化：\n\n```bash\n\
  npm init\n```\n\n这将创建一个新项目，由 `package.json` 文件定义。\n\n在向导中，我们提供以下答案：\n\n*   包名：`appointments`\n\
  *   入口点：`ui.js`\n*   测试命令：`jest`\n\n我们保持其他参数的默认设置。生成的 `package.json` 文件如下：\n\n```json\n\
  {\"name\": \"appointments\",\"version\": \"1.0.0\",\"description\": \"\",\"main\"\
  : \"ui.js\",\"scripts\": {\"test\": \"jest\"}}\n```\nListing 14-1: `package.json`\n\
  \n接下来，安装 `webpack` 的依赖：\n\n```bash\nnpm install webpack-cli\n```\n\n此命令会安装 `webpack`、`webpack-cli`\
  \ 和 `dev-server` 作为开发依赖。注意已创建 `node_modules` 文件夹。在 `package.json` 文件的 `scripts`\
  \ 部分添加两个项，用于运行服务器和构建：\n\n```json\n{\"name\": \"appointments\",\"version\": \"1.0.0\"\
  ,\"description\": \"\",\"main\": \"ui.js\",\"scripts\": {\"build\": \"webpack\"\
  ,\"start\": \"webpack serve\"}}\n```\nListing 14-2: `package.json`\n\n运行 `start`\
  \ 选项（npm start）会启动开发服务器并打开一个加载 `index.html` 的窗口。`build` 选项（npm run build）会创建生产就的\
  \ `bundle.js` 并将其存储在 `dist` 文件夹中。\n\n接下来，我们在根目录下创建一个名为 `webpack.config.js` 的 Webpack\
  \ 配置，内容如下：\n\n```javascript\nconst path = require('path');\nmodule.exports = {\n\
  \  \"mode\": \"development\",\n  \"entry\": \"./src/ui.js\",\n  \"output\": {\n\
  \    \"path\": path.join(__dirname, 'dist'),\n    \"filename\": \"bundle.js\"\n\
  \  },\n  \"devServer\": {\n    \"static\": path.join(__dirname, 'public'),\n   \
  \ \"devMiddleware\": {}\n  },\n  \"port\": 3000,\n  \"hot\": true\n};\n```\nListing\
  \ 14-3: `webpack.config.js`\n\n配置文件指定了入口文件（第一个运行的文件）是 `src` 文件夹中的 `ui.js`。它还指定所有\
  \ JS 文件将打包成 `dist` 文件夹中的 `bundle.js` 文件。\n\n现在，我们应该创建这两个文件夹。我们还会创建一个文件夹（`public`），`index.html`\
  \ 文件将存放在。\n\n```bash\nmkdir src\nmkdir dist\nmkdir public\n```\n\n现在，我们将 `index.html`\
  \ 文件移动到 `public` 文件夹。我们将修改 `<script>` 元素，使其现在指向我们最终通过 webpack 创建的 JS 文件。\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <link\
  \ href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css\"\
  \ rel=\"stylesheet\" integrity=\"sha384-K3K2stSC2CC3h99233R9m999999996666Y\" crossorigin=\"\
  anonymous\">\n</head>\n<body>\n  <div class=\"container\">\n    <header id=\"main-header\"\
  \ class=\"bg-info text-black p-4 m-4\">\n      <div class=\"container\">\n     \
  \   <h1 id=\"header-title\">Appointments</h1>\n      </div>\n    </header>\n   \
  \ <div class=\"row\">\n      <div class=\"col-lg-6\">\n        <div class=\"card\
  \ card-body\">\n          <!-- Content -->\n        </div>\n      </div>\n    </div>\n\
  \  </div>\n  <script src=\"bundle.js\"></script>\n</body>\n</html>\n```\n\n\n\n\n\
  \n## 预约表单结构\n\n提供的 HTML 结构定义了一个预约表单，包含 `Description`（描述）、`Date`（日期）和 `Time`（时间）字段，以及\
  \ `Save`（保存）和 `Delete`（删除）按钮。\n\n### 列表 14‑4：tests.js\n\n我们将这三个 JS 文件创建在 `src` 文件夹中。我们需要对它们进行重构，以便使用\
  \ ES6 模块：\n\n```javascript\n// ////////////////////////////////////////////////////////\
  \  辅助函数 \n\n/////////////////////////////////////////////////////\n\n// 用于比较日期的辅助函数\n\
  export const areDatesEqual = function (date1, date2) {\n  if (date1.getFullYear()\
  \ == date2.getFullYear() && date1.getMonth() == date2.getMonth() && date1.getDate()\
  \ == date2.getDate())\n    return true;\n  else\n    return false;\n}\nexport const\
  \ getDateOnlyString = function (date) {\n  return date.getFullYear() + \"-\" + (\"\
  0\" + (date.getMonth() + 1)).slice(-2) + \"-\" + (\"0\" + date.getDate()).slice(-2);\n\
  }\nexport const getDateOnly = function (date) {\n  return new Date(date.getFullYear()\
  \ + \"-\" + (\"0\" + (date.getMonth() + 1)).slice(-2) + \"-\" + (\"0\" + date.getDate()).slice(-2));\n\
  }\n```\n\n### 列表 14‑5：helpers.js\n\n在 `helpers.js` 文件中，我们在每个函数前面添加了 `export` 关键字。这意味着这些函数可以从项目中的其他\
  \ JS 文件进行 `import`。\n\n确实，在 `logic.js` 中，我们从导入这些函数开始的：\n\n```javascript\nimport\
  \ {areDatesEqual, getDateOnlyString, getDateOnly} from './helpers.js';\n```\n\n\
  ### 业务逻辑\n\n以下函数处理核心预约逻辑：\n\n```javascript\n// //////////////////////////////////////////////////\
  \  业务逻辑\n///////////////////////////////////////////////////////\n// 检查某个时间段是否已被占用\n\
  export const slotAlreadyTaken = function (state, date, time) {\n  if (state.appointments.get(date.toDateString())\
  \ !== undefined && state.appointments.get(date.toDateString()).get(time) !== undefined)\n\
  \    return true;\n  else\n    return false;\n}\n// 当用户点击保存时更新预约\nexport const updateAppointment\
  \ = function (state, newDesc, newDate, newTime) {\n  let newAppointments = new Map();\n\
  \  state.appointments.forEach((value, key) => {\n    newAppointments.set(key, new\
  \ Map());\n    state.appointments.get(key).forEach((v, k) => {\n      if (!(state.selectedDate.toDateString()\
  \ == key && state.selectedTime == k)) {\n        newAppointments.get(key).set(k,\
  \ state.appointments.get(key).get(k));\n      }\n    });\n  });\n\n  if (!newAppointments.has(newDate.toDateString()))\
  \ {\n    newAppointments.set(newDate.toDateString(), new Map());\n  }\n  newAppointments.get(newDate.toDateString()).set(newTime,\
  \ newDesc);\n  let newState = {\n    appointments: newAppointments,\n    displayedDate:\
  \ newDate,\n    selectedDesc: newDesc,\n    selectedDate: newDate,\n    selectedTime:\
  \ newTime,\n    selectedVisible: state.selectedVisible\n  };\n  return newState;\n\
  }\nexport const deleteAppointment = function (state, date, time) {\n  let newAppointments\
  \ = new Map();\n  state.appointments.forEach((value, key) => {\n    newAppointments.set(key,\
  \ new Map());\n    state.appointments.get(key).forEach((v, k) => {\n      if (!(date.toDateString()\
  \ == key && time == k)) {\n        newAppointments.get(key).set(k, state.appointments.get(key).get(k));\n\
  \      }\n    });\n  });\n\n  let newState = {\n    appointments: newAppointments,\n\
  \    displayedDate: state.displayedDate,\n    selectedDesc: \"\",\n    selectedDate:\
  \ state.selectedDate,\n    selectedTime: state.selectedTime,\n    selectedVisible:\
  \ state.selectedVisible\n  };\n  return newState;\n}\n// 用户点击某个时间段时调用\nexport const\
  \ selectSlot = function (state, newTime) {\n  let newDesc;\n  // 从 Map 中获取预约描述并显示在文本框中\n\
  \  let tmp = state.appointments.get(state.displayedDate.toDateString());\n  if (tmp\
  \ !== undefined) {\n    if (tmp.get(newTime) !== undefined) {\n      newDesc = tmp.get(newTime);\n\
  \    } else {\n      newDesc = \"\";\n    }\n  } else {\n    newDesc = \"\";\n \
  \ }\n\n  let newState = {\n    appointments: state.appointments,\n    displayedDate:\
  \ state.displayedDate,\n    selectedDesc: newDesc,\n    selectedDate: state.displayedDate,\n\
  \    selectedTime: newTime,\n    selectedVisible: true\n  };\n  return newState;\n\
  }\n// 更新 displayedDate 变量\nexport const updateDisplayedDate = function (state, newDate)\
  \ {\n  let newDisplayedDate = getDateOnly(newDate);\n  let newState = {\n    appointments:\
  \ state.appointments,\n    displayedDate: newDisplayedDate,\n    selectedDesc: state.selectedDesc,\n\
  \    selectedDate: state.selectedDate,\n    selectedTime: state.selectedTime,\n\
  \    selectedVisible: false\n  };\n  return newState;\n}\n// 增加/减少 displayedDate\n\
  export const addDaysToDate = function (state, days) {\n  let newDisplayedDate =\
  \ state.displayedDate;\n  newDisplayedDate.setDate(state.displayedDate.getDate()\
  \ + days);\n\n  let newState = {\n    appointments: state.appointments,\n    displayedDate:\
  \ newDisplayedDate,\n    selectedDesc: state.selectedDesc,\n    selectedDate: state.selectedDate,\n\
  \    selectedTime: state.selectedTime,\n    selectedVisible: false\n  };\n  return\
  \ newState;\n}\n```\n\n### 列表 14‑6：logic.js\n\n我们为逻辑函数添加了 `export` 关键字，因为它们将在 `ui.js`\
  \ 文件中使用（之后用于 Jest）。\n\n以下是包含所有导入的 `ui.js` 文件：\n\n```javascript\nimport {slotAlreadyTaken,\
  \ updateAppointment, deleteAppointment,selectSlot, updateDisplayedDate, addDaysToDate\
