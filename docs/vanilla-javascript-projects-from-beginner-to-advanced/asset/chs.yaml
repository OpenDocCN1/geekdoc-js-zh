  \ style.css\n\n首先，我们应该注意到，两个 `div`（`mainClock` 和 `settings`）都浮动在页左侧，依次排列。\n\n时钟面板使用\
  \ flexbox 对时钟显示进行垂直和水平对齐：\n```css\ndisplay:flex;\njustify-content: center;\nalign-items:\
  \ center;\n```\n\n为了将齿轮图像放置在面板右右角，我们对面板使用相对定位，对按钮使用绝对定位：\n```css\n#mainClock{\n\
