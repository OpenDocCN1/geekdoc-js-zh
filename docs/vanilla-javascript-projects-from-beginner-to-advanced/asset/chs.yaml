  \n# 16. 货币投资组合\n\n我们将创建一个货币投资组合，在其中我们可以报告我们拥有的各种货币的金额。我们的 Web 应用将使用 `fetch()` 从\
  \ Web API 获取最新的货币汇率，并以首选货币计算投资组合的总价值。\n\n![](img/image_rsrcBRF.jpg)\n\n## 涵盖的概念\n\
  \n`fetch()`\n\n*   异步编程 (`async/await`, promises)\n*   DOM 操作 (`querySelector`)\n\
  \n## 建议的解决方案\n\n为了获取货币汇率，我们将使用 Free Currency API 网站 ([`freecurrencyapi.com/`](https://freecurrencyapi.com/))，它为有限的\
  \ API 请求提供免费服务。你必须注册并获取你自己的 API Key 以在你的 RESTful 请求中使用。\n\n我们将使用两种类型的 API 请求：\n\n\
  为了获取支持的货币：\n\n`https://api.freecurrencyapi.com/v1/currencies?apikey=XXXX`\n\n为了获取货币汇率：\n\
  \n`https://api.freecurrencyapi.com/v1/latest?base_currency=baseCurrency&apikey=XXXX`\n\
  \n在这两种情况下，我们都需要提供 API Key，而在后一种情况下，我们还必须提供基础货币的三字母代码（例如：EUR、USD 等）。\n\n让我们从 `index.html`\
  \ 文件开始：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>My Portfolio</title>\n\
  \    <link href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css\"\
