  \ contains a template string that will be used to create the HTML code for this\
  \ component. Note that the selected row has the `selected-row` class applied to\
  \ it.\n\nNext, let’s see the detail component:\n\n```javascript\nclass DetailComponent\
  \ {\n  constructor() {\n    this.user = new Proxy({\n      id: '',\n      name:\
  \ '',\n      email: ''\n    }, {\n      set: (target, prop, value) => {\n      \
  \  target[prop] = value;\n        this.setFormData(this.user);\n        return true;\n\
  \      }\n    });\n  }\n  setupEventListeners() {\n    const userForm = document.getElementById('userForm');\n\
