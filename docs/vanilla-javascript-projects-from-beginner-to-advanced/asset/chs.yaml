- "# Vanilla JavaScript 项目：从初学者到高级阶\n\n\n\n![](img/image_rsrcBR2.jpg)\n\n\n\n版权所有\
  \ © 2024 Haris Tsetsekas\n\n\n# 1. 引言\n\n在开始创建我们的项目之前，讨论一下如何创建项目、如何运行项目以及如何调试项目是一个很好的主意。\n\
  \n## 开发\n\n书中的项目是使用 Visual Studio Code (`https://code.visualstudio.com/`) 开发的，这是微软提供的一个免费集成开发环境\
  \ (IDE)。我们也可以使用其他 IDE，如 Eclipse 或 WebStorm。\n\n使用 VS Code 非常简单。我们应该在驱动器中创建一个文件夹，并将所有的代码放在其中。然后我们可以从“文件”菜单中选择“打开文件夹”来打开特定文件夹。该文件夹包含的文件都将是项目的一部分。\n\
  \n## 运行\n\n对于简单的网页，只需双击 HTML 文件即可运行。网页将在默认浏览器中打开，就可以开始操作了。我们还可以为 VS Code 安装 Live\
  \ Server 扩展，它会在 VS Code 内部运行一个小型 Web 服务器。当我们学习 webpack 和 vite 时，我们将使用它们自己的服务器进行开发。\n\
  \n每个每个项目都会有关于如何运行它的详尽说明。\n\n## 调试\n\n为了调试网页，我们可以使用浏览器提供的 Web 开发工具。在 Google Chrome\
  \ 和 Mozilla Firefox 中，我们都可以通过 `Ctrl+Shift+i` 调出工具。\n\n我们可以使用开发者工具做很多事情：\n\n* 我们可以查看\
  \ HTML 文件的结构和 CSS 属性（`Elements` 标签）\n* 我们可以查看控制台中的消息（`Console` 标签）\n* 我们可以查看 JavaScript\
  \ 代码并进行调试（`Sources` 标签）\n* 我们可以查看网络请求及其内容（`Network` 标签）\n* 以及更多\n\n在 `Sources` 标签中，我们可以在\
  \ JavaScript 代码中设置断点。代码的执行会在这些点停止，然后我们可以查看变量的当前值。我们还可以通过选择 `Step Over` (`F10`) 来逐行执行代码。也可以通过\
  \ `Step Into` (`F11`) 进入函数内部。最后，我们可以通过 `Resume Execution` (`F8`) 继续执行代码（直到遇到下一个断点）。\n\
  \n![](img/image_rsrcBR3.jpg)\n\n# 2. 温度转换\n\n对于我们的第一个项目，让我们创建一个简单的 Web 应用，将温度从摄氏度转换为华氏度，反亦然：\n\
  \n# ![](img/image_rsrcBR4.jpg)\n\n## 涵盖的概念\n\n* 点击事件处理\n* 数字解析与检查\n* CSS 样式 (Flex)\n\
  \n## 建议的解决方案\n\n我们将首先在文件夹中创建一个 HTML 文件。在书中，我们将遵循将 Web 应用主 HTML 文件命名为 `index.html`\
  \ 的惯例。\n\n| ```html\n<!DOCTYPE html><<html><head><title>Temperature conversions</title><link\
  \ href=\"style.css\" rel=\"stylesheet\"></head><body><div class=\"container\"><<h1>Temperature\
  \ conversions</h1><label class=\"item\">Celsius:</label><input type=\"text\" id=\"\
  celsius\"/><label class=\"item\">Fahrenheit:</label><input type=\"text\" id=\"fahrenheit\"\
  ><button id=\"btn1\">Convert to Fahrenheit</button><button id=\"btn2\">Convert to\
  \ Celsius</button></div><script src=\"script.js\"></script></body></html>\n``` |\
  \  2‑1: index.html\n\n我们的应用程序包含两个文本输入 (`celsius`, `fahrenheit`) 和两个按钮 (`btn1`, `btn2`)。我们将通过在\
  \ JavaScript 中设置 `onclick` 属性来处理这两个按钮的 `click` 事件。\n\n| ```javascript\nconst celsiusInput\
  \ = document.getElementById('celsius');\nconst fahrenheitInput = document.getElementById('fahrenheit');\n\
  const btn1 = document.getElementById('btn1');\nconst btn2 = document.getElementById('btn2');\n\
  \nbtn1.onclick = function() {\n    const celsius = parseFloat(celsiusInput.value);\n\
  \    if (!isNaN(celsius)) {\n        fahrenheitInput.value = (celsius * 9/5) + 32;\n\
  \    }\n};\n\nbtn2.onclick = function() {\n    const fahrenheit = parseFloat(fahrenheitInput.value);\n\
  \    if (!isNaN(fahrenheit)) {\n        celsiusInput.value = (fahrenheit - 32) *\
  \ 5/9;\n    }\n};\n``` | 2‑2: script.js\n\n两个函数的操作方式相似；首先，我们获取文本元素的引用（通过 `getElementById()`）。这样，我们就能通过每个元素的\
  \ `.value` 属性获取用户在文本框输入的内容。\n\n我们需要注意 `.value` 属性是一个字符串值。因此，我们需要解析用户输入的值，以便获得计算所需的实际数值。`parseFloat()`\
  \ 函数将从字符串开始解析，直到遇到非数字字符。转换示例如下：\n\n“1234x” → 1234\n“1234x567” → 1234\n“x1234” →\
  \ NaN\n\nNaN 的意思是“不是数字”，它是指定该值不是数字的一种。我们可以使用 `isNaN()` 函数检查变量是否为数字。如果用户输入了非数字字符串，将弹出提示，且结果文本框将留空。如果提供了数字字符串，我们进行计算，并通过设置相应文本框的\
  \ `.value` 属性来显示结果。`toFixed(2)` 函数提供保留两位小数的字符串表示。\n\n最后，让我们来看 CSS 文件 (style.css)：\n\
  \n```css\n.container{\n    width: 300px; /* 这是一个 flex 容器 */\n    display: flex;\
  \ /* 项目应该按列排列 */\n    flex-direction: column; /* 项目之间的间距 */\n    gap: 10px;\n}\n\
  .item{\n    width: 100%;\n}\nh1{\n    font-size: 1.5em;\n}\n``` | 2‑3: style.css\n\
  \n\n\n\n包含文本框和按钮的 `div` 元素被分配了 `container` 类。通过将 `display` 属性设置为 `flex`，该元素将变成弹性容器。我们可以通过\
  \ `flex-direction: column` 将包含的项放在列中，还可以通过设置 `gap` 属性添加它们之间的间距。\n\n你可以在 GitHub 上找到这个项目：\n\
  \n[`github.com/htset/vanilla_javascript_projects/tree/main/temperature1`](https://github.com/htset/vanilla_javascript_projects/tree/main/temperature1)\n\
  \n# 3. 温度转换（版本 2）\n\n让我们重构温度转换应用程序，不再使用按钮来触发计算。相反，将在用户输入温度值或任一种类型时执行转换。\n\n![](img/image_rsrcBR5.jpg)\n\
  \n## 涵盖的概念\n\n* 键键事件处理\n\n## 建议的解决方案\n\n在这种方法中，我们只需要更改 HTML 文件：\n\n```html\n<!DOCTYPE\
  \ html><html><head><title>Temperature conversions</title><link href=\"style.css\"\
  \ rel=\"stylesheet\"></head><body>\n<div class=\"container\">\n<h1>Temperature conversions</h1><label\
  \ class=\"item\" for=\"celsius\">Celsius:</label><input class=\"item\" type=\"text\"\
  id=\"celsius\" onkeyup=\"c2f()\"/><label class=\"item\" for=\"fahrenheit\">Farhenheit:</label><input\
  \ class=\"item\" type=\"text\"id=\"fahrenheit\" onkeyup=\"f2c()\"/></div><script\
  \ src=\"script.js\" type=\"text/javascript\"></script></body></html>\n```\n列表 3‑1:\
  \ index.html\n\n在我们的 HTML 文件中，删除了两个触发温度转换 `click` 事件的按钮。相反，我们选择处理 `keyup` 事件，该事件在我们按下键盘按键、即在手指抬起按键后立即触发。这样，当我们输入输入温度时，转换结果就会更新。\n\
  \n对于读者来说，尝试与输入相关的另外两个事件 `keypress` 和 `keydown` 将很有趣。事实证明，这两个事件在实际字符插入文本框之前就会触发，因此我们的数字总是比实际数字后一位。因此，它们不适用于我们的目的。\n\
  \nJavaScript 和 CSS 文件将保持不变：\n\n```javascript\nfunction f2c(){\n//获取文本框元素的访问\nconst\
  \ celsiusEl = document.getElementById(\"celsius\");\nconst fahrenheitEl = document.getElementById(\"\
  fahrenheit\");\n//将文本解析为数字\nconst fahrenheit = parseFloat(fahrenheitEl.value);\n\
  //检查解析值是否确实为数字\nif(isNaN(fahrenheit)){\nalert(\"The Fahrenheit value is not correct\"\
  );\ncelsiusEl.value = \"\";\n}else{\nconst celsius = (fahrenheit - 32) * 5 / 9;\n\
  //将结果写入摄氏度文本框\ncelsiusEl.value = celsius.toFixed(2);  }\n}\nfunction c2f(){\n//获取文本框元素的访问\n\
  const celsiusEl = document.getElementById(\"celsius\");\nconst fahrenheitEl = document.getElementById(\"\
  fahrenheit\");\n//将文本解析为数字\nconst celsius = parseFloat(celsiusEl.value);\n//检查解析值是否确实为数字\n\
  if(isNaN(celsius)){\n    alert(\"The Celsius value is not correct\");\nfahrenheitEl.value\
  \ = \"\";\n}  else{\nconst fahrenheit = (celsius * 9 / 5) + 32;\n//将结果写入华氏度文本框\n\
  fahrenheitEl.value = fahrenheit.toFixed(2);}}\n```\n列表 3‑2: script.js\n\n```css\n\
  .container{width: 300px;/*这是一个弹性容器*/\ndisplay: flex;/*项应该放置在列中 */\nflex-direction:\
  \ column;/*项之间的间距 */\ngap: 10px;}.\n.item{width: 100%;}\nh1{font-size: 1.5em;}\n\
  ```\n列表 3‑3: style.css\n\n你可以在 GitHub 上找到这个项目：\n\n[`github.com/htset/vanilla_javascript_projects/tree/main/temperature2`](https://github.com/htset/vanilla_javascript_projects/tree/main/temperature2)\n\
  \n# 4. 颜色选择器\n\n我们将创建一个 Web 应用程序，户户可以使用 RGB（红-绿-蓝）十进制或十六进制数字并创建颜色。\n\n![](img/image_rsrcBR6.jpg)\n\
  \n## 涵盖的概念\n\n* 单选框处理\n* 使用 JavaScript 设置 CSS 属性\n* 使用 `addEventListener()` 函数注册事件\n\
  \n## 建议的解决方案\n\n首先，我们创建我们的 index.html 文件：\n\n```html\n<!DOCTYPE html>\n<html><head><title>Color\
  \ picker</title><link href=\"style.css\" rel=\"stylesheet\"/></head>\n<body>\n<div\
  \ class=\"container\">\n<h1>Color picker</h1>\n<div><input type=\"radio\" name=\"\
  decHex\" id=\"dec\" checked/> Decimal<input type=\"radio\" name=\"decHex\" id=\"\
  hex\"/> Hex  </div>\n<label>Red</label><input type=\"number\" id=\"red\" value=\"\
  0\"/>,\n<label>Green</label><input type=\"number\" id=\"green\" value=\"0\"/>,\n\
  <label>Blue</label><input type=\"number\" id=\"blue\" value=\"0\"/>,\n<div id=\"\
  panel\"></div>\n</div>\n<script src=\"script.js\" type=\"text/javascript\"></script></body></html>\n\
  ```\n列表 4‑1: index.html 我们使用两个单选框进行选择。注意，单选框必须具有相同的 `name` 属性；它们将是互斥。我们还添加了类型为 `number`\
  \ 的 `input` 元素来增加值。最后，我们添加了一个 `div` 将显示计算出的颜色。注意我们没有在 HTML 中声明任何处理器；我们将在下面的 JavaScript\
  \ 中完成：\n\n```javascript\n//获取元素的引用\nconst redEl = document.getElementById(\"red\"\
  );\nconst greenEl = document.getElementById(\"green\");\nconst blueEl = document.getElementById(\"\
  blue\");\nconst panelEl = document.getElementById(\"panel\");\nconst decEl = document.getElementById(\"\
  dec\");\nconst hexEl = document.getElementById(\"hex\");\n\n//计算颜色的函数\nconst calculateColor\
  \ = function(){\nlet red;\nlet green;\nlet blue;\nif(decEl.checked){//如果十进制被选中，取值\n\
  red = parseInt(redEl.value);\ngreen = parseInt(greenEl.value);\nblue = parseInt(blueEl.value);\n\
  \n}else{//如果十六进制被选中，从十六进制转换\nred = parseInt(redEl.value, 16);\ngreen = parseInt(greenEl.value,\
  \ 16);\nblue = parseInt(blueEl.value, 16);\n}\n//检查 0-255 范围\nif(red < 0 || red\
  \ > 255 || isNaN(red) || green < 0 || green > 255 || isNaN(green) || blue < 0 ||\
  \ blue > 255 || isNaN(blue)){\npanelEl.innerHTML = \"Values should lie between 0\
  \ and 255 (0 and FF)\";\npanelEl.style.backgroundColor = \"white\";\n}else{\npanelEl.innerHTML\
  \ = \"\";\n//设置背景颜色\npanelEl.style.backgroundColor = `rgb(${red}, ${green}, ${blue})`;\n\
  }}\n\n//事件处理器（单选框）\nconst toggleDecHex = function(){\nif (decEl.checked){\nredEl.value\
  \ = parseInt(redEl.value, 16);\ngreenEl.value = parseInt(greenEl.value, 16);\nblueEl.value\
  \ = parseInt(blueEl.value, 16);}\n\nelse{\nlet tmp = parseInt(redEl.value)\nredEl.value\
  \ = tmp.toString(16);\ntmp = parseInt(greenEl.value)\ngreenEl.value = tmp.toString(16);\n\
  tmp = parseInt(blueEl.value)\nblueEl.value = tmp.toString(16);\n}}\n\n//注册事件处理器\n\
  redEl.addEventListener(\"keyup\", calculateColor);\ngreenEl.addEventListener(\"\
  keyup\", calculateColor);\nblueEl.addEventListener(\"keyup\", calculateColor);\n\
  redEl.addEventListener(\"change\", calculateColor);\ngreenEl.addEventListener(\"\
  change\", calculateColor);\nblueEl.addEventListener(\"change\", calculateColor);\n\
  decEl.addEventListener(\"change\", toggleDecHex);\nhexEl.addEventListener(\"change\"\
  , toggleDecHex);\n\n//执行首次计算（所有值默认为 0）\ncalculateColor();\n```\n列表 4‑2: script.js\n\
  \n\n\n然后，我们检查所有数值是否都在 RGB 数字的 0-255 范围内。我们还会检查用户是否输入了非数值。如果一切顺利，我们将通过设置 `style.backgroundColor`\
  \ 属性来设置 `div` 元素的背景颜色。这是通过 JavaScript 操作 CSS 属性（在本例中为 `background-color`）的一个常见示例。\n\
  \n在输入错误的情况下，我们将还原为白色背景并显示错误消息。\n\n注意，我们正在使用模板字表达式（Template Literals），通过字符串插值从颜色值创建背景颜色字符串：\n\
  \n```\npanelEl.style.backgroundColor = `rgb(${red}, ${green}, ${blue})`;\n```\n\n\
  接下来，我们定义处理单选框变化事件的函数。我们确定新选的格式值（dec 或 hex），并执行必要的转换。\n\n如前提到的，事件处理是在 JS 文件中定义的。这是通过\
  \ `addEventListener()` 函数实现的。该函数在特定的元素对象上被调用，并接受两个参数：\n\n*   事件名称（例如：“change”）\n\
  *   处理事件的函数名称（例如 `calculateColor`）\n\n在注册了两种类型的事件（文本框的 `keyup` 以及文本框和单选按钮的 `change`）后，我们调用\
  \ `calculateColor()` 函数来获取默认值的颜色（所有值在 HTML 中都定义为 0）。\n\n最后，我们还应该添加一个 CSS 文件：\n\n\
  ```css\n.container{width: 300px;display: flex;flex-direction: column;justify-content:\
  \ center;align-items: center;gap: 10px;}.item{width: 100%;}h1{font-size: 1.5em;}#panel{\
  \ width: 200px; height:100px;border: 1px black solid;text-align: center;padding:\
  \ 5px;}\n```\n列表 4‑3：`style.css`\n\n与温度转换示例一样，所有元素都封装在一个 flex 容器内并列排列。\n\n你可以在 GitHub\
  \ 上找到这个项目：\n\n[`github.com/htset/vanilla_javascript_projects/tree/main/color_picker1`](https://github.com/htset/vanilla_javascript_projects/tree/main/color_picker1)\n\
  \n# 5. 颜色选择器（版本 2）\n\n我们将继续开发颜色选择器 Web 应用程序，并将文本框替换为范围控件：\n\n![](img/image_rsrcBR7.jpg)\n\
  \n## 涵盖的概念\n\n*   滑块元素（Slider elements）\n*   状态变量\n\n## 建议的解决方案\n\n首先，我们通过添加类型为\
  \ `range` 的输入元素来修改 HTML：\n\n```html\n<!DOCTYPE html>\n<html>\n<head><title>Color\
  \ picker</title><link href=\"style.css\" rel=\"stylesheet\"/></head><body><div class=\"\
  container\"><h1>Color picker</h1><<div>><input type=\"radio\" name=\"decHex\" id=\"\
  dec\" checked/> Decimal<input type=\"radio\" name=\"decHex\" id=\"hex\"/> Hex  </div><label>Red</label><div><input\
  \ type=\"range\" min=\"0\" max=\"255\" id=\"redRange\"><input type=\"text\" id=\"\
  redText\"/>  </div><label>Green</label><div><input type=\"range\" min=\"0\" max=\"\
  255\" id=\"greenRange\"><input type=\"text\" id=\"greenText\"/>  </div><label>Blue</label><div><input\
  \ type=\"range\" min=\"0\" max=\"255\" id=\"blueRange\"><input type=\"text\" id=\"\
  blueText\"/>  </div><div id=\"panel\"></div></div>\n<script src=\"script.js\" type=\"\
  text/javascript\"></script>\n</body>\n</html>\n```\n列表 5‑1：`index.html`\n\n范围输入元素在\
  \ 浏览器中显示为滑块。我们还为滑块范围定义了最小值和最大值。在滑块旁边，我们还提供了一个小的文本框来显示所选值。此外，用户可以使用该文本框输入更精确的值。\n\
  \n让我们来看相应的 JavaScript 文件：\n\n```javascript\n//获取元素的引用\nconst redRange = document.getElementById(\"\
  redRange\");\nconst greenRange = document.getElementById(\"greenRange\");\nconst\
  \ blueRange = document.getElementById(\"blueRange\");\nconst redText = document.getElementById(\"\
  redText\");\nconst greenText = document.getElementById(\"greenText\");\nconst blueText\
  \ = document.getElementById(\"blueText\");\nconst panelEl = document.getElementById(\"\
  panel\");\nconst decEl = document.getElementById(\"dec\");\nconst hexEl = document.getElementById(\"\
  hex\");\n\n// 声明并初始化变量\nlet red = 128;\nlet green = 128;\nlet blue = 128; \n\n//\
  \ 从滑块计算颜色的函数\nconst calculateColorFromRange = function(){\n    // 从滑块获取值到颜色变量\n\
  \    red = parseInt(redRange.value);\n    green = parseInt(greenRange.value);\n\
  \    blue = parseInt(blueRange.value);\n    // 更新文本框\n    if(decEl.checked){\n \
  \       redText.value = red;\n        greenText.value = green;\n        blueText.value\
  \ = blue;\n    }else{\n        redText.value = red.toString(16);\n        greenText.value\
  \ = green.toString(16);\n        blueText.value = blue.toString(16);\n    }\n  \
  \  if(red < 0 || red > 255 || green < 0 || green > 255 || blue < 0 || blue > 255){\n\
  \        panelEl.innerHTML = \"Values should be between 0-255\";\n        panelEl.style.backgroundColor\
  \ = \"white\";\n    }else{\n        panelEl.style.backgroundColor = `rgb(${red},\
  \ ${green}, ${blue})`;\n    }\n}\n\n// 从文本框计算颜色的函数\nconst calculateColorFromText\
  \ = function(){\n    // 从文本框获取值到颜色变量\n    red = parseInt(redText.value);\n    green\
  \ = parseInt(greenText.value);\n    blue = parseInt(blueText.value);\n    if(decEl.checked){\n\
  \        redText.value = red;\n        greenText.value = green;\n        blueText.value\
  \ = blue;\n    }else{\n        redText.value = red.toString(16);\n        greenText.value\
  \ = green.toString(16);\n        blueText.value = blue.toString(16);\n    }\n  \
  \  if(red < 0 || red > 255 || green < 0 || green > 255 || blue < 0 || blue > 255){\n\
  \        panelEl.innerHTML = \"Values should be between 0-255\";\n        panelEl.style.backgroundColor\
  \ = \"white\";\n    }else{\n        panelEl.style.backgroundColor = `rgb(${red},\
  \ ${green}, ${blue})`;\n    }\n    // 更新滑块\n    redRange.value = red;\n    greenRange.value\
  \ = green;\n    blueRange.value = blue;\n}\n\n// 变化处理处理（单选框）\nconst toggleToHex\
  \ = function(){\n    if(decEl.checked){\n        redText.value = red;\n        greenText.value\
  \ = green;\n        blueText.value = blue;\n    }else{\n        redText.value =\
  \ red.toString(16);\n        greenText.value = green.toString(16);\n        blueText.value\
  \ = blue.toString(16);\n    }\n}\n\n// 注册事件处理\nredText.addEventListener(\"keyup\"\
  , calculateColorFromText);\ngreenText.addEventListener(\"keyup\", calculateColorFromText);\n\
  blueText.addEventListener(\"keyup\", calculateColorFromText);\nredRange.addEventListener(\"\
  change\", calculateColorFromRange);\ngreenRange.addEventListener(\"change\", calculateColorFromRange);\n\
  blueRange.addEventListener(\"change\", calculateColorFromRange);\ndecEl.addEventListener(\"\
  change\", toggleToHex);\nhexEl.addEventListener(\"change\", toggleToHex);\n\n//\
  \ 执行首次计算\ncalculateColorFromRange();\n```\n列表 5‑2：`script.js`\n\n\n\n\n\n```css\n\
  .container{width: 300px;display: flex;flex-direction: column;justify-content: center;align-items:\
  \ center;gap: 10px;}.item{width: 100%;}h1{font-size: 1.5em;}#redRange, #blueRange,\
  \ #greenRange{width: 80%;}#redText, #blueText, #greenText{width: 10%;}#panel{width:\
  \ 200px; height:100px;border: 1px black solid;text-align: center;padding: 5px;}\n\
  ```\n列表 5-3: style.css\n\n你可以在 GitHub 上找到这个项目：[`github.com/htset/vanilla_javascript_projects/tree/main/color_picker2`](https://github.com/htset/vanilla_javascript_projects/tree/main/color_picker2)\n\
  \n# 6. 闹钟\n\n在这里，我们将创建一个显示当前时间的闹钟。通过点击设置按钮，用户将获得设置闹钟的选项。当到达闹钟时间时，时钟将显示提醒。\n\n![](img/image_rsrcBR8.jpg)\n\
  \n## 涵盖的概念\n\n- `setTimeout()` 和 `setInterval()` 函数\n- CSS 过渡与定位\n- Web 字体\n- 日期和时间处理\n\
  \n## 建议方案\n\n```html\n<!DOCTYPE html>\n<html>\n<head><title>数字时钟</title><link href=\"\
