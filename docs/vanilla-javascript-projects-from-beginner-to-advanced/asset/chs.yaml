  接下来，我们在 `item` 类上定义了一些伪类。`nth-of-type(1)` 伪类应用于列表中的第一个项目，即最左侧的第一个图标。这被用于给滑动块的左侧提供额外的外边距。\n\
  \n当鼠标指针悬停在项目上时，会应用一个变换，项目会变大 40%。此外，描述变得可见：\n\n```css\n.item:nth-of-type(1) {\n\
