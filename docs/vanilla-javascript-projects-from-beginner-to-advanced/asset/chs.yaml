  \ app = new AppComponent(users);\n``` |\n\n**Listing 21‑5: `app.js`**\n\n### Listing\
  \ 21‑5: `app.js`\n\nHere, we define the list of users as an array, and we pass it\
  \ as argument to the created `AppComponent` object. Then we attach event listeners\
  \ to the two custom events fired by the child components.\n\nThis is a very simple\
  \ example, mainly to show how the components are structured and how two-way binding\
