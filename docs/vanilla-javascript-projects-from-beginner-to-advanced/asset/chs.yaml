  \ `.gitignore` 文件。\n\n# 15. 支出追踪器\n\n让我们创建一个跟踪每月支出的应用程序。每个月的支出将在一个表格中显示。此外，我们还将创建一个饼图，显示所选月份各支出类别的总和。\n\
  \n![](img/image_rsrcBRE.jpg)\n\n## 涵盖的概念\n\n*   ES6 类\n*   Chart.js\n*   DOM 操作\n\
