  吃豆人和幽灵拥有相似的特征：最重要的是它们在迷宫中的位置。此外，它们都需要访问迷宫，以便找到它们可以移动到哪里。\n\n\n\n\n考虑到此点，我们定义了一个名为\
  \ `Entity` 的基类：\n\n```javascript\nclass Entity {\n  constructor() {\n    this.x\
  \ = 0;\n    this.y = 0;\n    this.direction = \"left\";\n    this.type = null;\n\
  \    this.game = null;\n  }\n  move(newX, newY) {\n    game.map[newX][newY].entity\
  \ = game.map[this.x][this.y].entity;\n    game.map[this.x][this.y].entity = null;\n\
  \    this.x = newX;\n    this.y = newY;\n  }\n}\n```\n列表 23-2: entity.js\n\n在这个类中，我们定义了位置（参数\
  \ `x` 和 `y`）、实体移动的方向 `direction`、它的类型 `type`（`pacman` 或 `ghost`）以及对 `Game` 对象的引用。`Entity`\
  \ 类还定义了一个名为 `move()` 的方法，用于在地图内移动实体。\n\n现在，让我们来看看程序的核心 `Game` 类：\n\n```javascript\n\
  class Block {\n  constructor(type, entity) {\n    history.type = type;\n    this.entity\
  \ = entity;\n  }\n}\nclass Game {\n  constructor() {\n    this.map = [];\n    this.sizeX\
  \ = 32;\n    this.sizeY = 28;\n    this.gameActive = true;\n    this.pacmanLocation\
  \ = null;\n    this.pointsLeft = 0;\n    this.player = [];\n    // 构建迷宫\n    for\
  \ (let i = 0; i < 32; i++) {\n      let line = matrix[i];\n      this.map[i] = [];\n\
  \      for (let j = 0; j < 28; j++) {\n        this.map[i].push(new Block());\n\
  \        this.map[i][j].entity = null;\n        if (line[j] == '.') {\n        \
  \  this.map[i][j].type = \"point\";\n          this.pointsLeft++;\n        } else\
  \ if (line[j] == '*') {\n          this.map[i][j].type = \"wall\";\n        } else\
  \ if (line[j] == ' ') {\n          this.map[i][j].type = \"empty\";\n        }\n\
  \      }\n    }\n    // 创建玩家\n    this.player.push(new PacMan(this, 23, 13));\n\
  \    this.map[23][13].entity = this.player[0];\n    this.pacmanLocation = { x: 23,\
  \ y: 13 };\n    this.player.push(new Ghost(this, 5, 5));\n    this.map[5][5].entity\
  \ = this.player[1];\n    this.player.push(new Ghost(this, 5, 20));\n    this.map[5][20].entity\
  \ = this.player[2];\n    this.player.push(new Ghost(this, 8, 5));\n    this.map[8][5].entity\
  \ = this.player[3];\n  }\n  // 更新吃豆鼠的方向\n  keyPressed(key) {\n    console.log(\"\
  Key pressed: \" + key);\n    this.player[0].direction = key;\n  }\n  // 在每一帧上执行回合\n\
  \  playRound() {\n    for (let i = 0; i < 4; i++) {\n      this.player[i].play();\n\
  \    }\n  }\n}\n```\n列表 23-3: game.js\n\n地图由 `Block` 对象组成。每个 `Block` 可以是特定的类型：\n\
  \n*   墙壁\n*   带有分空间\n*   空地\n\n实体可以移动到空地或带有分数的空间。当一个实体移动到一个方块时，`Block` 对象内部的 `entity`\
  \ 引用将指向该实体对象。此外，每个 `Entity` 都可以向某个特定方向移动。\n\n在构建 `Game` 对象期间，我们解析了一个构成迷宫文本表示的字符串数组。我们还跟踪游戏中剩余的分数（变量\
  \ `pointsLeft`）。最后，我们创建了游戏实体，并将它们放置在迷宫的初始位置。\n\n注意看新创建的实体是如何放置在地图上的。这意味着地图和实体之间存在双向关系，因为每个对象都持有对方的引用。\n\
  \n以下是用于初始化游戏地图的字符串数组：\n\n```javascript\nconst matrix = [\n  \"****************************\"\
