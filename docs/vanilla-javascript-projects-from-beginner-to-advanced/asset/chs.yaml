  \ `&#9881;` 的齿轮 符号。\n\n在设置面板上，我们放置了一个类型为 `time` 的输入元素；这使得它显示为一个时间选择元素。最后，有两个按钮用于设置和取消闹钟。\n\
  \n让我们来看 CSS 文件：\n\n```css\n#mainClock{width:300px;height:150px;background-color:\
