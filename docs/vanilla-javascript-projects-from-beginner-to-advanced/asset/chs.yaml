  列表 16‑2: script.js\n\n`fetchQuotes()` 是 `async` 的，因为在函数内部我们 `await` 了 `fetch()`。当响应完成后，我们再次\
  \ `await` 以获取响应的 JSON 内容。\n\n```javascript\nconst fetchQuotes = async (baseCurrency)\
  \ => {\n    const URL = `https://api.freecurrencyapi.com/v1/latest?base_currency=${baseCurrency}&apikey=XXXX`;\n\
  \    let json;\n    try {\n        const response = await fetch(URL);\n        json\
  \ = await response.json();\n        if (!response.ok) {\n            alert(`Error\
  \ ${response.status}: ${json.message}`);\n            return null;\n        }\n\
  \        if (json.error !== undefined) {\n            alert(`Error: ${json.info}`);\n\
  \            return null;\n        }\n    } catch (error) {\n        if (error instanceof\
  \ SyntaxError) {\n            alert(\"The returned data was invalid\");\n      \
  \  } else {\n            alert(\"There was an error with the request\");\n     \
  \   }\n        return null;\n    }\n    return json;\n};\n```\n列表 16‑3: script.js\n\
  \n注意我们使用字符串模板来创建 URL。字符串模板使用反引号（`` ``）来标记字符串的开始和结束。在字符串内部，我们可以使用表达式 `${ }` 来插值变量的值。\n\
  \n当页面加载时，调用 `loadSupportedrencies()` 函数：\n\n```javascript\nconst loadSupportedrencies\
  \ = async () => {\n    const response = await fetchCurrencies();\n    if (response\
  \ !== null) {\n        supportedCurencies = response.data;\n        Object.keys(supportedCurencies).forEach((key)\
  \ => {\n            let option = document.createElement(\"option\");\n         \
  \   option.value = key;\n            option.innerHTML = key + \"-\" + supportedCurencies[key].name;\n\
  \            baseCurrencyEl.appendChild(option);\n        });\n    } else {\n  \
  \      supportedCurencies = null;\n    }\n};\n```\n列表 16‑4: script.js\n\n该函数也是 `async`\
  \ 的，因为它 `await` 了异步函数 `fetchCurrencies()`。该函数以 JSON 对象的形式获取支持的货币并遍历其内容。在每次循环中，它创建一个新的\
