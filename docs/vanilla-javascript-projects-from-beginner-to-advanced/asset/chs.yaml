  \n提供了位置的 `latitude`（纬度）和 `longitude`（经度）值，并发送了获取地面上 2 米处温度的请求（我们还可以从这个 API 获取许多变量）。\n\
  \n在 JS 文件的开头，我们导入了 `OpenLayer` 类并获取了元素的引用：\n\n```javascript\nimport './style.css';\n\
  import { Map, View } from 'ol';\nimport TileLayer from 'ol/layer/Tile';\nimport\
