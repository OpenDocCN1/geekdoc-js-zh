  \n## 概念\n\n* 单元测试 (QUnit)\n* 多个 JS 文件的使用\n\n## 建议的解决方案\n\n我们将使用 `QUnit` (`https://qunitjs.com/`)，这是一个非常简单的测试框架，可以用于在客户端（即\
  \ Web 浏览器）以及服务器端（即 Node.js）测试 JavaScript 代码。使用 `QUnit` 非常容易；对于像我们这种情况的基于浏览器的项目进行测试，它只需要极少的配置。\n\
  \n首先，我们应该注意到，为了便于单元测试，我们将原始的 JavaScript 文件 (`script.js`) 拆分成了三个文件：\n\n* `helpers.js`（辅助函数）\n\
  * `logic.js`（业务逻辑）\n* `ui.js`（UI 代码和事件处理器）\n\n我们还更新了 `index.html` 文件以加载这三个文件：\n\n\
  ```html\n<script src=\"helpers.js\" type=\"text/javascript\"></script>\n<script\
  \ src=\"logic.js\" type=\"text/javascript\"></script>\n<script src=\"ui.js\" type=\"\
  text/javascript\"></script>\n```\n列表 13‑1: `index.html`\n\n这些脚本的加载顺序很重要。首先，我们加载辅助函数，因为它们在另外两个文件中被使用。然后我们加载业务逻辑，最后加载\
  \ UI 代码。如果我们不在开始时加载辅助函数，那么在加载另外两个脚本时，这些函数将是不可用的，因为脚本是顺序加载的。\n\n我们将使用 `QUnit` 对前两个文件进行单元测试。UI\
  \ 代码可以在功能和端到端测试中进行，在这些测试中，我们使用 Selenium、Cypress 或 Playright 等测试框架对整个 Web 应用。为了使用\
  \ `QUnit`，我们必须创建一个新的 HTML 文件，加载 `QUnit` 框架以及要测试的代码：\n\n```html\n<!DOCTYPE html>\n\
  <meta charset=\"utf-8\">\n<title>QUnit Test Suite</title>\n<link rel=\"stylesheet\"\
