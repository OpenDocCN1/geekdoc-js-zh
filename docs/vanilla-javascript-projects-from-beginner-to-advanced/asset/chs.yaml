  \n# 19. Netflix 克隆项目\n\n在本项目项目中，我们将尝试模拟 Netflix ([`www.netflix.com`](https://www.netflix.com))\
  \ 的用户界面。具体来说，我们将创建一系列电影图标，它们可以向左或向右滚动。此外，当鼠标悬停在图标上时，电影描述将平滑地弹出。\n\n![](img/image_rsrcBRJ.jpg)\n\
  \n## 涵盖的概念\n\n- CSS 过渡与变换\n- DOM 操作\n\n## 建议的解决方案\n\n我们将使用 The MovieDB ([`www.themoviedb.org`](https://www.themoviedb.org/))\
  \ 免费服务来获取电影海报和标题。成为该服务的成员后，我们可以获取 API 密钥用于 RESTful 请求。\n\n这是我们网页的 HTML 文件：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"UTF-8\">\n  <title>My Movies</title>\n\
  \  <link rel=\"stylesheet\" href=\"style.css\">\n  <script src=\"https://kit.fontawesome.com/your-key.js\"\
  \ crossorigin=\"anonymous\"></script>\n</head>\n<body>\n  <div class=\"logo\">\n\
  \    <h1>Trending Now</h1>\n  </div>\n  <div class=\"container\">\n    <!-- Movies\
  \ 将注入到此处 -->\n  </div>\n  <div id=\"spinner\" class=\"spinner-border\" style=\"\
  visibility: hidden;\"></</div>\n  <div class=\"descr-buttons\">\n    <button id=\"\
  prev\"><i class=\"fas fa-chevron-left\"></i></button>\n    <button id=\"next\"><i\
