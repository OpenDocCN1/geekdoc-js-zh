  \n现在我们准备好启动开发服务器了：\n\n```bash\nnpm start\n```\n\n结果是，开发服务器将启动，我们将打开浏览器访问 `index.html`\
  \ 文件。每当我们对一个 JS 文件进行更改时，打包器（bundler）就会再次运行，它将生成一个新的 `bundle.js` 文件并自动刷新网页。\n\n我们还可以使用以下命令创建\
  \ `bundle.js` 生产版本：\n\n```bash\nnpm build\n```\n\n生成的 `bundle.js` 文件可以在 `dist` 文件夹中找到。\n\
  \n# 部分 – 安装 Jest (以及 Babel)\n\n现在我们准备好使用 `Jest` 来测试我们的代码了。`Jest` 主要用于测试 Node.js\
  \ 代码。然而，Node.js 不支持像 `import/export` 或 `async/await` 这样的 ES6 特性。因此，为了让 `Jest` 测试我们的代码，我们需要将其转换为与\
  \ Node.js 兼容的代码。这就是 `Babel` 大派用用场的地方。\n\n我们继续安装 Babel：\n\n```bash\nnpm install --save-dev\
  \ babel-loader @babel/core @babel/preset-env\n```\n\n`webpack` 配置文件应更新如下：\n\n```javascript\n\
  const path = require('path');\nmodule.exports = \n{\n  \"mode\": \"none\",\n  \"\
  entry\": \"./src/ui.js\",\n  \"output\": {\n    \"path\": __dirname + '/dist',\n\
  \    \"filename\": \"bundle.js\"\n  },\n  \"devServer\": {\n    \"contentBase\"\
  : path.join(__dirname, 'dist')\n  },\n  \"module\": {\n    \"rules\": [\n      {\n\
  \        \"test\": /\\.js$/,\n        \"exclude\": /node_modules/,\n        \"use\"\
  : {\n          \"loader\": \"babel-loader\"\n        }\n      }\n    ]\n  }\n};\n\
  ```\n\n列表 14‑8：`webpack.js`\n\n我们还需要在根目录下创建一个 Babel 配置文件（命名为 `.babelrc`）：\n\n```json\n\
