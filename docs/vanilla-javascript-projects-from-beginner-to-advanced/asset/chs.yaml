  \ type=\"email\" id=\"userEmail\" name=\"userEmail\"value=\"${this.user.email}\"\
  ></form></div>`;\n  }\n  setFormData(user) {\n    const userIdField = document.getElementById('userId');\n\
  \    const userNameField = document.getElementById('userName');\n    const userEmailField\
  \ = document.getElementById('userEmail');\n    userIdField.value = user.id;\n  \
  \  userNameField.value = user.name;\n    userEmailField.value = user.email;\n  }\n\
  }\n``` |\n\n**Listing 21‑3: `detailComponent.js`**\n\n### Listing 21‑3: `detailComponent.js`\n\
  \nIn the `DetailComponent` class we have a form that displays the user’s data. Note\
  \ that the ID form field is `readonly`, as we do not want to have this changed.\n\
  \nThis component uses two-way binding; this means that there is a two-way connection\
  \ between the `user` object and the corresponding form fields. When the data in\
  \ the form is changed, then the object is updated. Respectively, when the `user`\
  \ object is changed, then the contents of the form fields are updated to reflect\
  \ the change.\n\nThe former is achieved by listening for the `input` event on the\
  \ form. When this event is fired, then the `user` object is updated.\n\nThe latter\
  \ is performed with the use of ES6 `Proxies`. A `Proxy` is an object that wraps\
  \ another object and traps certain operations on this object. Here, we define the\
  \ `set()` trap: when a property of the `user` object is modified, then the `set()`\
  \ trap of the `Proxy` is invoked and calls the `setFormData()` function. As a result,\
  \ the form fields are automatically updated.\n\nMoreover, when a form field is modified,\
  \ another custom event (`formChange`) is emitted, containing the modified user data.\n\
  \nNext, let’s see `AppComponent`, the top-level component that contains the other\
  \ two objects:\n\n```javascript\nclass AppComponent {\n  constructor(users) {\n\
  \    this.users = users;\n    this.masterComponent = new MasterComponent(this.users);\n\
  \    this.detailComponent = new DetailComponent();\n    this.init();\n  }\n  init()\
  \ {\n    const userForm = document.getElementById('userForm');\n    userForm.addEventListener('formChange',\
  \ (event) => {\n      const user = event.detail;\n      this.detailComponent.user.id\
  \ = user.id;\n      this.detailComponent.user.name = user.name;\n      this.detailComponent.user.email\
  \ = user.email;\n    });\n    this.masterComponent.addEventListener('userSelected',\
  \ (event) => {\n      const userId = event.detail;\n      const index = this.users.findIndex(u\
  \ => u.id === userId);\n      if (index !== -1) {\n        this.detailComponent.user.id\
  \ = this.users[index].id;\n        this.detailComponent.user.name = this.users[index].name;\n\
  \        this.detailComponent.user.email = this.users[index].email;\n      }\n \
  \   });\n  }\n  render() {\n    const appElement = document.getElementById('app');\n\
  \    appElement.innerHTML = this.masterComponent.render() + this.detailComponent.render();\n\
  \  }\n}\n``` |\n\n**Listing 21‑4: `appComponent.js`**\n\n### Listing 21‑4: `appComponent.js`\n\
  \nIn the `constructor`, `AppComponent` creates the two components and renders them\
  \ on the only `<div>` element. `AppComponent` also defines handlers for the two\
  \ custom events. In `formChange()` we get the modified user data and we update `users`\
  \ list. In `userSelected()` we get the selected user from the list and populate\
  \ the detail form.\n\nFinally, let’s see the entry point, the `app.js` file:\n\n\
