  .item:hover > .description {\n  visibility:visible;\n}\n```\n\n`description` 类最初是隐藏的。我们对\
  \ `white-space` 属性使用了 `pre-line` 值。这意味着连续的空格会被合并，并且会在需要时在换行符处断行以填充行框：\n\n```css\n\
