  overflow: hidden; /* 隐藏滚动条 */\n}\n```\n\n容器 `<div>` 采用相对定位。这将与箭头的绝对定位相结合，将它们放置在各自容器的边缘：\n\
  \n```css\n.container{\n  position:relative;\n}\n```\n\n对于两个滑动块，我们指定了一秒的过渡效果。这意味着滑动块向左或向右的移动将平滑执行。使用\
