  \n# 20. 使用 Node.js API 构建书籍列表\n\n到目前为止，我们一直在使用他人的 API。我们可以使用 Node.js 配合 `Express`\
  \ 和 `MongoDB` 创建自己的 API。我们将创建一个简单的表单，用于从数据库中添加和删除书籍。\n\n![](img/image_rsrcBRK.jpg)\n\
  \n## 涉及的概念\n\n* Node.js\n* RESTful APIs\n* MongoDB & Mongoose\n\n## 建议解决方案\n\n我们的项目将由两部分组成：使用\
  \ Node.js 的服务端和使用原生 JavaScript 的客户端。该项目将具有以下文件结构：\n\n```\nproject-root/\n|-- src/\n\
  |   |-- app.js\n|-- public/\n|   |-- index.html\n|   |-- style.css\n|   |-- script.js\n\
  |-- package.json\n|-- package-lock.json\n```\n\n在 `src` 文件夹中，我们将放置带有服务端代码的 `app.js`\
  \ 文件。`public` 文件夹将包含 `index.html` 文件以及 CSS 文件和客户端 JavaScript 代码（`script.js`）。\n\n\
  我们将首先创建一个新项目：\n\n```bash\nnpm init\n```\n\n然后，我们将从 NPM 安装必要的库：\n\n```bash\nnpm install\
  \ express body-parser mongoose --save\n```\n\n我们将使用的 `package.json` 文件如下所示：\n\n\
  ```json\n{\"name\": \"api\",\"version\": \"1.0.0\",\"description\":,\"scripts\"\
  : {\"start\": \"node app\"},\"author\":\"\",\"license\": \"ISC\",\"dependencies\"\
  : {\"body-parser\": \"¹.20.2\",\"express\": \"⁴.18.2\",\"mongoose\": \"⁸.1.1\"}}\n\
  ```\n列表 20‑1: package.json\n\n注意，我们添加了一个 `start` 脚本，它将使用 `Node` 运行 `app.js` 文件。\n\
  \n我们将使用本地 `MongoDB` 实例 ([https://www.mongodb.com/]) 作为我们的数据库。在 `MongoDB` 之上，我们将使用\
  \ `Mongoose` ([https://mongoosejs.com/])这是一个帮助我们通过创建 `schemas` 来为应用程序数据建模的库。我们可以使用这些\
  \ `schemas` 来执行验证、对数据库进行查询等操作。\n\n我们可以使用像 MongoDBCompass 这样的工具创建一个新数据库 (`books`)\
  \ 以及数据库内部的一个新集合 (`books`)。\n\n## 服务端 (Node.js)\n\n在服务端，我们将使用 `Express` 框架配合 Node.js\
  \ ([https://expressjs.com/]) 构建 RESTful API。当使用 Node.js 创建 Web 应用和 API 时，`Express`\
  \ 让我们的工作变得更简单。\n\n我们将从服务端 API 代码开始：\n\n```javascript\nconst express = require('express');\n\
  const bodyParser = require('body-parser');\nconst mongoose = require('mongoose');\n\
  const path = require('path');\nconst app = express();\nconst PORT = 3000;\napp.use(bodyParser.json());\n\
  // 从 public 目录提供静态文件\napp.use(express.static(path.join(__dirname, 'public')));\n\
  mongoose.connect('mongodb://localhost:27017/books');\n// 定义 Book 模型\nconst Book\
  \ = mongoose.model('Book', {\n    author: String,\n    title: String,\n    pages:\
  \ Number\n});\n\n// GET 所有书籍\napp.get('/api/books', async (req, res) => {\n    try\
  \ {\n        const books = await Book.find();\n        console.log(books);\n   \
  \     res.json(books);\n    } catch (error) {\n        res.status(500).json({ error:\
  \ error.message });\n    }\n});\n// 通过 ID 获取特定的书籍\napp.get('/api/books/:id', async\
  \ (req, res) => {\n    try {\n        const book = await Book.findById(req.params.id);\n\
  \        res.json(book);\n    } catch (error) {\n        res.status(404).json({\
  \ error: 'Book not found' });\n    }\n});\n// POST 一新书籍\napp.post('/api/books',\
  \ async (req, res) => {\n    const { author, title, pages } = req.body;\n    console.log(req.body);\n\
  \    try {\n        const newBook = new Book({ author, title, pages });\n      \
  \  await newBook.save();\n        console.log(newBook);\n        res.json(newBook);\n\
  \    } catch (error) {\n        res.status(400).json({ error: error.message });\n\
  \    }\n});\n// 通过 ID PUT 更新特定的书籍\napp.put('/api/books/:id', async (req, res) =>\
  \ {\n    try {\n        const updatedBook = await Book.findByIdAndUpdate(req.params.id,\
  \ req.body, { new: true });\n        res.json(updatedBook);\n    } catch (error)\
  \ {\n        res.status(404).json({ error: 'Book not found' });\n    }\n});\n```\n\
  \n\n\n\n接下来，`DELETE` 请求用于查找书籍并将其从数据库中删除：\n\n```javascript\n// DELETE a specific\
  \ book by ID\napp.delete('/api/books/:id', async (req, res) => {\n  try {\n    const\
  \ deletedBook = await Book.findByIdAndDelete(req.params.id);\n    if (!deletedBook)\
  \ {\n      return res.status(404).json({ error: 'Book not found' });\n    }\n  \
  \  res.json({ message: 'Book deleted successfully' });\n  } catch (error) {\n  \
  \  res.status(500).json({ error: error.message });\n  }  \n});\n```\n\n最后，我们创建一个最终路由来处理剩余的请求（通常是静态内容的请求）。我们还调用\
  \ `listen()` 来等待传入的请求：\n\n```javascript\n// Catch-all route to serve index.html\
  \ for any other requests\napp.get('*', (req, res) => {\n  res.sendFile(path.join(__dirname,\
  \ 'public', 'index.html'));\n});\n\napp.listen(PORT, () => {\n  console.log(`Server\
  \ is running on port ${PORT}`);\n});\n```\n\n当请求到达我们的服务器时，Express 会尝试将其与特定路由匹配，并调用相应的处理函数。\n\
  \n我们可以通过运行以下命令启动 Node 服务器：\n\n```bash\nnode app\n```\n或：\n\n```bash\nnpm start\n\
  ```\n\n我们可以使用 Postman ([`www.postman.com`](https://www.postman.com/)) 等工具来测试 API。通过\
  \ Postman，我们可以向 API 发送 RESTful 请求并检查响应。\n\n## 客户端\n\n我们将从 public 文件夹中的 `index.html`\
