    \n# 12. 预约列表（版本 2）\n\n继续预约列表项目，我们将通过分离 UI 特有代码和业务逻辑来重构 Web 应用。我们还将使用函数式编程概念采用集中状态管理功能。通过这种方式，我们的目标是让\
    \ Web 应用更容易测试。\n\n# ![](img/image_rsrcBRB.jpg)\n\n# 涵盖的概念\n\n*   函数式编程\n*   状态管理\n\
    \n# 解决方案\n\n在预约列表 Web 应用的第一版本中，我们在代码的许多地方混合了 UI 功能和业务逻辑。我们说的 UI 功能是指处理与用户交互（事件处理器）和更新用户界面（例如\
    \ `updateUI()` 函数）的代码。相反，业务逻辑是指主要执行计算的代码，在我们的案例中，即在 `appointments` 列表中插入或删除预约。\n\
    \n这两种功能的混合意味着我们的代码无法于测试。我们需要将 UI 和业务逻辑分离到不同的函数中，以便我们对业务逻辑进行测试。\n\n在版本 1 中，我们定义了一些包含应用状态的变量（例如\
