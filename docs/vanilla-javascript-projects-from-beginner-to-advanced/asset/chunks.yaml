    \ fa-thumbs-up\"></i></div><div class=\"descr-button\"><i class=\"fas fa-thumbs-down\"\
    ></i></div><div class=\"descr-button\"><i class=\"fas fa-chevron-down\"></i></div></div><div\
    \ class=\"descr-text\">` + movie.title + \"</div>\";description.classList.add(\"\
    description\");const item = document.createElement(\"div\");item.classList.add(\"\
    item\");item.appendChild(img);item.appendChild(description);return item;}// Scroll\
    \ left buttonspreviousEl.addEventListener(\"click\", slideLeft);previous2El.addEventListener(\"\
    click\", slideLeft);// Scroll right buttonsnextEl.addEventListener(\"click\",\
    \ slideRight);next2El.addEventListener(\"click\", slideRight);fetchMovies(URL1).then((data)\
    \ => {data.results.forEach((movie) => {sliderEl.appendChild(createMovieIcon(movie));});sliderMax1\
    \ = data.results.length * 250;})\n\n.catch((e) => {\n\nalert(\"the request to\
    \ the API failed\");});fetchMovies(URL2).then((data) => {data.results.forEach((movie)\
    \ => {slider2El.appendChild(createMovieIcon(movie));})sliderMax2 = data.results.length\
    \ * 250;}).catch((e) => {alert(\"the request to the API failed\");}); |\n\nListing\
    \ 19‑3: script.js\n\nFirst, we define the  fetchMovies() function that will be\
    \ user to retrieve the movie details from the API. Note that inside the  fetch()\
    \ operation we supply a header with the  Authorization property that should contain\
    \ the API key next to the  Bearer keyword.\n\nNext, we define the handlers for\
    \ the the left and right scrolling of the sliders. Inside the functions we make\
    \ some calculations about how much the slider should scroll, since we don’t want\
    \ it to scroll too much and leave empty spaces to either side.\n\nWe achieve the\
    \ scolling by modifying the CSS  translateX  property. This property defines how\
    \ much the element will shift to the left or to the right (negative values can\
    \ also be used):\n\nsliderTemp.style.transform = `translateX(${sliderPos1}px)`;\n\
    \nNext, we define the  createMovieIcon() function that returns a  <div> element\
    \ containing the movie icon, title and the respective buttons."
