  trans: "\n\n```javascript\nexport class Expense {\n  constructor(name, amount, category,\
    \ date) {\n    this.name = name;\n    this.amount = amount;\n    this.category\
    \ = category;\n    this.date = date;\n  }\n  editExpense(newAmount, newCategory,\
    \ newDate) {\n    this.amount = newAmount;\n    this.category = newCategory;\n\
    \    this.date = newDate;\n  }\n}\n```\n\n列表 15-5: expense.js\n\n注意 `Expense`\
    \ 类前面的 `export` 关键字；这使得它可以被从其他 JS 文件中导入。\n\n接下来，我们有一个类将提供开销跟踪的功能：\n\n```javascript\n\
    export class BudgetTracker {\n  constructor() {\n    this.expensesByMonth = {};\n\
    \  }\n  addExpense(expense) {\n    // monthKey 格式: '2024-01' 等。\n    const monthKey\
    \ = this.getFormattedMonthKey(expense.date);\n    if (!this.expensesByMonth[monthKey])\
    \ {\n      this.expensesByMonth[monthKey] = [];\n    }\n    this.expensesByMonth[monthKey].push(expense);\n\
    \  }\n  removeExpense(expense) {\n    const monthKey = this.getFormattedMonthKey(expense.date);\n\
    \    if (this.expensesByMonth[monthKey]) {\n      const index = this.expensesByMonth[monthKey].indexOf(expense);\n\
    \      if (index !== -1) {\n        this.expensesByMonth[monthKey].splice(index,\
    \ 1);\n      }\n    }\n  }\n  getFormattedMonthKey(date) {\n    const year = date.getFullYear();\n\
    \    const month = date.getMonth() + 1; // 月份从 0 开始\n    return `${year}-${month.toString().padStart(2,\
    \ '0')}`;\n  }\n  getExpensesForMonth(monthKey) {\n    return this.expensesByMonth[monthKey]\
    \ || [];\n  }\n  calculateTotalBudget(monthKey) {\n    const expenses = this.expensesByMonth[monthKey]\
    \ || [];\n    return expenses.reduce((total, expense) => total + expense.amount,\
    \ 0);\n  }\n}\n```\n\n列表 15-6: budgetTracker.js\n\n在类构造函数中，我们定义了包含开销对象的结构。该对象将使用格式化的日期字符串作为属性键。例如，2024\
    \ 年 1 月的开销将存储在一个数组中，该数组将存储在属性“2014-01”下。\n\n`BudgetTracker` 类提供了插入和删除开销的函数，以及获取每月开销列表的函数。此外，它还可以计算每月总支出。这是通过\
    \ `reduce()` 函数实现的：我们通过遍历开销列表，每次将开销的 `amount` 加到 `total` 变量上。\n\n注意，我们目前为止看到的这两个类都是与\
    \ UI 无关的，因为它们只包含业务逻辑，因此可以很容易地测试。\n\n接下来，我们可以检查 UI 逻辑：\n\n```javascript\nimport\
    \ { Expense } from './expense.js';\nimport { Chart } from 'chart.js/auto';\n\n\
    export class BudgetUI {\n  static ctx = document.getElementById('pieChart').getContext('2d');\n\
    \  static categories = [];\n  static expenses = [];\n  static pieChart = new Chart(this.ctx,\
    \ {\n    type: 'pie',\n    data: {\n      labels: this.categories,\n      datasets:\
    \ [{\n        data: this.expenses,\n        backgroundColor: ['rgba(255, 99, 132,\
    \ 0.7)', 'rgba(54, 162, 235, 0.7)', 'rgba(255, 206, 86, 0.7)', 'rgba(75, 192,\
    \ 192, 0.7)'],\n      }],\n    },\n  });\n\n  static renderExpenseInTable(expense)\
    \ {\n    const tableBody = document.querySelector('#expenseTable tbody');\n  \
    \  const row = tableBody.insertRow();\n    const nameCell = row.insertCell(0);\n\
    \    const amountCell = row.insertCell(1);\n    const categoryCell = row.insertCell(2);\n\
    \    const dateCell = row.insertCell(3);\n    nameCell.textContent = expense.name;\n\
    \    amountCell.textContent = `$${expense.amount.toFixed(2)}`;\n    categoryCell.textContent\
    \ = expense.category;\n    dateCell.textContent = expense.date.toISOString().split('T')[0];\n\
    \  }\n\n  static renderTable(budgetTracker, monthKey) {\n    // 清空现有表格内容\n   \
    \ const tableBody = document.querySelector('#expenseTable tbody');\n    tableBody.innerHTML\
    \ = '';\n    // 在表格中渲染开销\n    const expensesForMonth = budgetTracker.getExpensesForMonth(monthKey);\n\
    \    expensesForMonth.forEach((expense) => {\n      BudgetUI.renderExpenseInTable(expense);\n\
    \    });\n\n    // 添加包含该月总支出的最后行\n    const totalRow = tableBody.insertRow();\n\
    \    totalRow.classList.add('total-row');\n    const totalLabelCell = totalRow.insertCell(0);\n\
    \    totalLabelCell.textContent = 'Total Expenses';\n    const totalAmountCell\
    \ = totalRow.insertCell(1);\n    totalAmountCell.textContent = `$${budgetTracker.calculateTotalBudget(monthKey).toFixed(2)}`;\n\
    \  }\n\n  static renderPieChart(budgetTracker, monthKey) {\n    // 注：原文代码在此处存在逻辑重复和混乱，此处按原文结构翻译\n\
    \     = [];\n    // ... (后续代码保持原文结构不变)\n  }\n}\n```\n\n列表 15-7: budgetUI.js\n\n\
    我们使用 `BudgetUI` 类将所有与 UI 相关的函数组合。该类将只包含静态成员、函数和变量。这样，我们就不需要使用类的实例，可以直接通过类名调用函数。任何情况下，使用普通类也是可以的。\n\
    \n"
- fmt: "\nFunction `handleUserInput()` handles the submit event from the expense form.\
    \ It adds the new expense into the budget tracker and triggers the update of the\
    \ table and the chart.\n\nThe `showToast()` function creates a toast notification\
    \ and displays it at the top right of the screen. A timer is set to hide the notification\
    \ after some time.\n\nFinally, let’s see the entry point, the `app.js` file:\n\
    \n```javascript\nimport { BudgetUI } from './budgetUI.js';\nimport { BudgetTracker\
    \ } from './budgetTracker.js';\nimport Pikaday from 'pikaday';\nimport moment\
    \ from 'moment';\ndocument.addEventListener('DOMContentLoaded', function () {\n\
    \    const expenseDateInput = document.getElementById('expenseDate');\n    const\
    \ pikaday = new Pikaday({\n        field: expenseDateInput,\n        format: 'YYYY-MM-DD',\n\
    \        defaultDate: moment().toDate(),\n        //current dateset\n        defaultDate:\
    \ true,\n    });\n    const monthPickerInput = document.getElementById('monthPicker');\n\
    \    const pikadayMonthPicker = new Pikaday({\n        field: monthPickerInput,\n\
    \        format: 'YYYY-MM',\n        defaultDate: moment().toDate(),\n       \
    \ //current dateset\n        defaultDate: true,\n        yearRange: [2024, new\
    \ Date().getFullYear()],\n        showYearDropdown: true,\n        onSelect: function\
    \ () {\n            BudgetUI.changeMonth(budgetTracker);\n        },\n    });\n\
    });\nconst budgetTracker = new BudgetTracker();\nBudgetUI.handleUserInput(budgetTracker);\n\
    BudgetUI.changeMonth(budgetTracker);\n```\nListing 15‑8: app.js\n\nHere we define\
    \ two `Pikaday` objects for the two date pickers of the user interface. In the\
    \ second one we register a handler for the `select` event: `changeMonth()` will\
    \ be called when the user selects a new month.\n\nFinally, we create an instance\
    \ of the `BudgetTracker` class and we call `handleUserInput()` and `changeMonth()`\
    \ for the first time.\n\nYou can find this project in GitHub:\n\n[https://github.com/htset/vanilla_javascript_projects/tree/main/expense_tracker](https://github.com/htset/vanilla_javascript_projects/tree/main/expense_tracker)\n\
    \n# 16. Currencies portfolio\n\nWe will create a currencies portfolio, where we\
    \ can report the amounts of various currencies that we have in our possession.\
    \ Our web app will use `fetch()` to retrieve the latest currency values from a\
    \ web API and will calculate the total value of the portfolio in the preferred\
    \ currency.\n\n![](image_rsrcBRF.jpg)\n\n# Concepts covered\n\n`fetch()`\n\n*\
    \   Asynchronous programming (`async/await`, promises)\n*   DOM manipulation (`querySelector`)\n\
    \n# Proposed Solution\n\nFor the retrieval of the currency quotes we will the\
    \ Free Currency API web site ([https://freecurrencyapi.com/](https://freecurrencyapi.com/))\
    \ that provides a free service for limited API requests. You will have to sign\
    \ up and get your own API Key to use in your RESTful requests.\n\nThere are two\
    \ types of API requests that we will use:\n\nTo get the supported currencies:\n\
    \n`https://api.freecurrencyapi.com/v1/currencies?apikey=XXXX`\n\nTo get the currency\
    \ quotes:\n\n`https://api.freecurrencyapi.com/v1/latest?base_currency=baseCurrency&apikey=XXXX`\n\
    \nIn both cases, we need to supply our API key, while on the latter case we must\
    \ also provide the three-letter code for the base currency (i.e.: EUR, USD, etc.).\n\
    \nLet’s start with the `index.html` file:\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n    <title>My Portfolio</title>\n    <link href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css\"\
    \ rel=\"stylesheet\" integrity=\"sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65\"\
    \ crossorigin=\"anonymous\">\n</head>\n<body>\n    <div class=\"container\">\n\
    \        <h1>My portfolio</h1>\n        <div class=\"row border bg-secondary\"\
    >\n            <div class=\"col-md-2 m-2\"><span>Base currency:</span></div>\n\
    \            <div class=\"col-md-4 m-2\"><select class=\"baseCurrency\"></select></div>\n\
    \        </div>\n        <div class=\"row\">\n            <div class=\"col-md-2\
    \ m-2\"><div class=\"fw-bold\">Amount</div></div>\n            <div class=\"col-md-4\
    \ m-2\"><span class=\"fw-bold\">Currency</span></div>\n            <div class=\"\
    col-md-2 m-2\"><button class=\"add col-md-12\">Add line</button></div>\n     \
    \   </div>\n        <div class=\"list\"></div>\n        <div class=\"row border\
    \ bg-secondary\">\n            <div class=\"col-md-2 m-2\"><button class=\"calculate\
    \ col-md-12\">Calculate portfolio value</button></div>\n            <div class=\"\
    col-md-4 m-2\"><div class=\"result\"></div></div>\n        </div>\n    </div>\n\
    \    <script src=\"https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js\"\
    \ integrity=\"sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4\"\
    \ crossorigin=\"anonymous\"></script>\n    <script src=\"script.js\"></script>\n\
    </body>\n</html>\n```\nListing 16‑1: index.html\n\nOur HTML uses Bootstrap for\
    \ styling; let’s move on to the JavaScript. First, we define variables and then\
    \ retrieve the supported currencies:\n\n```javascript\nconst baseCurrencyEl =\
    \ document.querySelector(\".baseCurrency\");\nconst currenciesEl = document.querySelector('.list');\n\
    const addEl = document.querySelector(\".add\");\nconst calculateEl = document.querySelector(\"\
    .calculate\");\nconst resultEl = document.querySelector(\".result\");\n\nconst\
    \ fetchCurrencies = async () => {\n    const URL = `https://api.freecurrencyapi.com/v1/currencies?apikey=XXXX`;\n\
    \    let json;\n    try {\n        const response = await fetch(URL);\n      \
    \  json = await response.json();\n        if (!response.ok) {\n            alert(`Error\
    \ ${response.status}: ${json.message}`);\n            return null;\n        }\n\
    \        if (json.error !== undefined) {\n            alert(`Error: ${json.info}`);\n\
    \            return null;\n        }\n    } catch (error) {\n        if (error\
    \ instanceof SyntaxError) {\n            alert(\"The returned data was invalid\"\
    );\n        } else {\n            alert(\"There was an error with the request\"\
    );\n        }\n        return null;\n    }\n    return json;\n};\n```\nListing\
    \ 16‑2: script.js\n\nFunction `fetchCurrencies()` is `async` because inside the\
    \ function we use `await` on `fetch()`. When the response is complete, we await\
    \ one more time to get the JSON content of the response.\n\n```javascript\nconst\
    \ fetchQuotes = async (baseCurrency) => {\n    const URL = `https://api.freecurrencyapi.com/v1/latest?base_currency=${baseCurrency}&apikey=XXXX`;\n\
    \    let json;\n    try {\n        const response = await fetch(URL);\n      \
    \  json = await response.json();\n        if (!response.ok) {\n            alert(`Error\
    \ ${response.status}: ${json.message}`);\n            return null;\n        }\n\
    \        if (json.error !== undefined) {\n            alert(`Error: ${json.info}`);\n\
    \            return null;\n        }\n    } catch (error) {\n        if (error\
    \ instanceof SyntaxError) {\n            alert(\"The returned data was invalid\"\
    );\n        } else {\n            alert(\"There was an error with the request\"\
    );\n        }\n        return null;\n    }\n    return json;\n};\n```\nListing\
    \ 16‑3: script.js\n\nNote that we use a string template to create the URL. The\
    \ string template uses back quotes (`` ``) to mark the start and the end of the\
    \ string. Inside the string we can use the expression `${ }` to interpolate the\
    \ value of a variable.\n\nWhen the page loads, function `loadSupportedrencies()`\
    \ is called:\n\n```javascript\nconst loadSupportedrencies = async () => {\n  \
    \  const response = await fetchCurrencies();\n    if (response !== null) {\n \
    \       supportedCurencies = response.data;\n        Object.keys(supportedCurencies).forEach((key)\
    \ => {\n            let option = document.createElement(\"option\");\n       \
