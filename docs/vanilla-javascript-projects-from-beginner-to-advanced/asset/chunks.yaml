    # 6. Alarm clock


    Here, we will create an alarm clock that will display the current time. By pressing
    the settings button, the user is presented with the option to set an alarm. The
    clock will display an alert at the time of the alarm.


    ![](image_rsrcBR8.jpg)


    # Concepts covered


    - `setTimeout()` and `setInterval()` functions

    - CSS transitions and positioning

    - Web fonts

    - Date and time handling


    # Proposed Solution


    ```html

