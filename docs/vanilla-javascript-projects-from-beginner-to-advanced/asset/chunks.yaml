    \        <h1>My portfolio</h1>\n        <div class=\"row border bg-secondary\"\
    >\n            <div class=\"col-md-2 m-2\"><span>Base currency:</span></div></div>\n\
    \            <div class=\"col-md-4 m-2\"><select class=\"baseCurrency\"></select></div>\n\
    \        </div>\n        <div class=\"row\">\n            <div class=\"col-md-2\
    \ m-2\"><div class=\"fw-bold\">Amount</div></div>\n            <div class=\"col-md-4\
    \ m-2\"><span class=\"fw-bold\">Currency</span></div>\n            <div class=\"\
    col-md-2 m-2\"><button class=\"add col-md-12\">Add line</button></div>\n     \
    \   </div>\n        <div class=\"list\"></div>\n        <div class=\"row border\
    \ bg-secondary\">\n            <div class=\"col-md-2 m-2\"><button class=\"calculate\
    \ col-md-12\">Calculate portfolio value</button></div>\n            <div class=\"\
    col-md-4 m-2\"><div class=\"result\"></div></div>\n        </div>\n    </div>\n\
    \    <script src=\"https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js\"\
    \ integrity=\"sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65\"\
    \ crossorigin=\"anonymous\"></script>\n</body>\n</html>\n```\n（注：此处翻译由于原文中 HTML\
    \ 结构断裂，已根据逻辑对齐）\n列表 16‑2: script.js\n\n`fetchQuotes()` 是 `async` 的，因为在函数内部我们 `await`\
    \ 了 `fetch()`。当响应完成后，我们再次 `await` 以获取响应的 JSON 内容。\n\n```javascript\nconst fetchQuotes\
    \ = async (baseCurrency) => {\n    const URL = `https://api.freecurrencyapi.com/v1/latest?base_currency=${baseCurrency}&apikey=XXXX`;\n\
    \    let json;\n    try {\n        const response = await fetch(URL);\n      \
    \  json = await response.json();\n        if (!response.ok) {\n            alert(`Error\
    \ ${response.status}: ${json.message}`);\n            return null;\n        }\n\
    \        if (json.error !== undefined) {\n            alert(`Error: ${json.info}`);\n\
    \            return null;\n        }\n    } catch (error) {\n        if (error\
    \ instanceof SyntaxError) {\n            alert(\"The returned data was invalid\"\
    );\n        } else {\n            alert(\"There was an error with the request\"\
    );\n        }\n        return null;\n    }\n    return json;\n};\n```\n列表 16‑3:\
    \ script.js\n\n注意我们使用字符串模板来创建 URL。字符串模板使用反引号（`` ``）来标记字符串的开始和结束。在字符串内部，我们可以使用表达式\
    \ `${ }` 来插值变量的值。\n\n当页面加载时，调用 `loadSupportedrencies()` 函数：\n\n```javascript\n\
    const loadSupportedrencies = async () => {\n    const response = await fetchCurrencies();\n\
    \    if (response !== null) {\n        supportedCurencies = response.data;\n \
    \       Object.keys(supportedCurencies).forEach((key) => {\n            let option\
    \ = document.createElement(\"option\");\n            option.value = key;\n   \
    \         option.innerHTML = key + \"-\" + supportedCurencies[key].name;\n   \
    \         baseCurrencyEl.appendChild(option);\n        });\n    } else {\n   \
    \     supportedCurencies = null;\n    }\n};\n```\n列表 16‑4: script.js\n\n该函数也是\
    \ `async` 的，因为它 `await` 了异步函数 `fetchCurrencies()`。该函数以 JSON 对象的形式获取支持的货币并遍历其内容。在每次循环中，它创建一个新的\
    \ `<option>` 元素并将其附加到页面顶部的 `<select>` 元素中。\n"
