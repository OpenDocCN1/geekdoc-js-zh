    \  if (appointmentsInDay !== undefined) {\n    appointmentsInDay.forEach((value,\
    \ key) => {\n      if (value !== undefined) {\n        document.getElementById(\"\
    hour_\" + key).innerHTML = key + \"  \" + value;\n        document.getElementById(\"\
    hour_\" + key).classList.add(\"active\");\n      }\n    });\n  }\n  for (let i\
    \ = 0; i < 24; i++) {\n    document.getElementById(\"hour_\" + i).classList.remove(\"\
    list-group-item-dark\");\n  }\n  document.getElementById(\"hour_\" + state.selectedTime).classList.add(\"\
    list-group-item-dark\");\n}\n```\n\n列表 12‑4：script.js\n\n`createAppointmentList()`\
    \ 和 `clearAppointmentList()` 函数保持不变。`updateUI()` 函数被修改为以使用 `state` 对象来更新用户界面的各种元素（包括预约列表）。\n\
    \n接下来，我们处理事件处理器：\n\n```javascript\n// 当用户点击某个小时时调用\nconst handleClickOnHour =\
    \ function (event) {\n  state = selectSlot(state, event.target.id.substring(5,\
    \ event.target.id.length));\n  updateUI(state);\n  appointmentDescEl.focus();\n\
    }\n// 移动到下一个日期\nconst handleNext = function() {\n  state = addDaysToDate(state,\
    \ 1);\n  updateUI(state);\n}\n// 移动到上一个日期\nconst handlePrevious = function() {\n\
    \  state = addDaysToDate(state, -1);\n  updateUI(state);\n}\n// 选择新日期\nconst handleGoto\
    \ = function() {\n  let newDateTime = new Date(gotoDateEl.value);\n  state = updateDisplayedDate(state,\
    \ newDateTime);\n  updateUI(state);\n}\n\n// 保存/更新预约\nconst handleSave = function()\
    \ {\n  const newDescr = appointmentDescEl.value;\n  const dateTime = new Date(appointmentDateEl.value);\n\
    \  const newDate = getDateOnly(dateTime);\n  const newTime = appointmentTimeEl.value;\n\
    \  if (slotAlreadyTaken(state, newDate, newTime) && !(areDatesEqual(state.selectedDate,\
    \ newDate) && state.selectedTime == newTime)) {\n    // 请求用户覆盖现有条目\n    let ret\
    \ = confirm(\"目标日期时间不为空。覆盖吗？\");\n    if (ret) {\n      // 将条目插入到新位置\n      state\
    \ = updateAppointment(state, newDescr, newDate, newTime);\n      updateUI(state);\n\
    \    }\n  } else {\n    // 将条目插入到新位置\n    state = updateAppointment(state, newDescr,\
    \ newDate, newTime);\n    updateUI(state);\n  }\n}\n// 删除预约\nconst handleDelete\
    \ = function() {\n  const dateTime = new Date(appointmentDateEl.value);\n  const\
    \ date = getDateOnly(dateTime);\n  const time = parseInt(appointmentTimeEl.value);\n\
    \  state = deleteAppointment(state, date, time);\n  updateUI(state);\n}\n```\n\
    \n列表 12‑5：script.js\n\n调用事件处理器函数来处理用户生成的事件，例如移动到下一个日期或按下保存按钮。本质上，这些函数获取元素的值（例如预约描述，或所点击的时间段编号），并将它们传递给业务逻辑函数。然后，它们获取更新后的应用程序状态，并通过调用\
    \ `updateUI()` 函数来更新 UI。\n\n接下来是业务逻辑函数：\n\n```javascript\n// 检查某个时间段是否已被占用\nconst\
    \ slotAlreadyTaken = function (state, date, time) {\n  if (state.appointments.get(date.toDateString())\
    \ !== undefined && state.appointments.get(date.toDateString()).get(time) !== undefined)\
    \ {\n    return true;\n  } else {\n    return false;\n}\n// 当用户按下保存时更新预约\nconst\
    \ updateAppointment = function (state, newDesc, newDate, newTime) {\n  let newAppointments\
    \ = new Map(state.appointments);\n  if (!newAppointments.has(newDate.toDateString()))\
    \ {\n    newAppointments.set(newDate.toDateString(), new Map());\n  }\n  newAppointments.get(newDate.toDateString()).set(newTime,\
    \ newDesc);\n  return { ...state, appointments: newAppointments };\n}\n\nconst\
    \ deleteAppointment = function (state, date, time) {\n  let newAppointments =\
    \ new Map(state.appointments);\n  if (newAppointments.has(date.toDateString()))\
    \ {\n    newAppointments.get(date.toDateString()).delete(time);\n  }\n  return\
    \ { ...state, appointments: newAppointments };\n}\n// 当用户点击时间段时调用\nconst selectSlot\
    \ = function (state, newTime) {\n  let newDesc;\n  // 从 Map 中获取描述并显示\n  let tmp\
    \ = state.appointments.get(state.displayedDate.toDateString());\n  if (tmp !==\
    \ undefined) {\n    if (tmp.get(newTime) !== undefined) {\n      newDesc = tmp.get(newTime);\n\
    \    } else {\n      newDesc = \"\";\n    }\n  } else {\n    newDesc = \"\";\n\
    \  }\n  let newState = { ...state, selectedDesc: newDesc, selectedDate: state.displayedDate,\
    \ selectedTime: newTime, selectedVisible: true };\n  return newState;\n}\n// 更新\
    \ displayedDate 变量\nconst updateDisplayedDate = function(state, newDate) {\n \
    \ let newDisplayedDate = getDateOnly(newDate);\n  let newState = { ...state, displayedDate:\
    \ newDisplayedDate, selectedDesc: state.selectedDesc, selectedDate: newDate, selectedTime:\
    \ state.selectedTime, selectedVisible: false };\n  return newState;\n}\n// 增加/减少\
    \ displayedDate\nconst addDaysToDate = function(state, days) {\n  let newDisplayedDate\
    \ = new Date(state.displayedDate);\n  newDisplayedDate.setDate(state.displayedDate.getDate()\
    \ + days);\n  let newState = { ...state, displayedDate: newDisplayedDate, selectedDesc:\
    \ state.selectedDesc, selectedDate: state.selectedDate, selectedTime: state.selectedTime,\
    \ selectedVisible: false };\n  return newState;\n}\n```\n\n列表 12‑6：script.js\n\
    \n首先，注意我们更改了 appointments `Map` 的内部工作机制：现在我们使用另一个 `Map` 对象而不是数组来表示特定日期内的小小时。因此，现在\
    \ appointments `Map` 包含的是 `Map` 对象而不是数组。\n\n如前所述，这些函数的主要职责是通过应用业务逻辑规则来更新应用程序状态。遵循函数式编程的原则，我们不修改应用程序状态，而是创建一个新的状态对象。\n\
    \n例如，在 `updateAppointment()` 函数中，我们通过复制现有的 appointments `Map` 来创建一个新的 `Map`。在更新预约的情况下，我们确保将预约添加到\
    \ `Map` 中的新键下，并且不会将旧条目复制到新的 `Map` 中。\n\n"
