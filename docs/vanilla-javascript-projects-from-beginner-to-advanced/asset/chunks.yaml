    \nListing 14‑7: `ui.js`\n\nNow we are ready to start the dev server:\n\n```bash\n\
    npm start\n```\n\nAs a result, the dev server will start, and we will open the\
    \ web browser to the `index.html` file. Every time we make a change in one of\
    \ the JS files, then the bundler will run again, it will produce a new `bundle.js`\
    \ file and will reload automatically the web page.\n\nWe can also create the production\
    \ version of the `bundle.js` file with the following command:\n\n```bash\nnpm\
    \ build\n```\n\nThe resulting `bundle.js` file can be found in the `dist` folder.\n\
    \n# Part B – Installing Jest (and Babel)\n\nNow we are ready to use `Jest` to\
    \ test our code. `Jest` is mainly used for testing Node.js code. However, Node.js\
    \ does not have support for ES6 features like `import/export`, or `async/await`.\
    \ Therefore, in order to have our code tested by `Jest`, we need to transform\
    \ it into code compatible with Node.js. This is where `Babel` comes to the rescue.\n\
    \n`Babel` is a library that is used to transform code written in ES6 into a format\
    \ that is understood by older browsers or other environments, like Node.js.\n\n\
    We proceed with Babel installation:\n\n```bash\nnpm install --save-dev babel-loader\
    \ @babel/core @babel/preset-env\n```\n\nThe `webpack` config file should be updated\
    \ as follows:\n\n```javascript\nconst path = require('path');\nmodule.exports\
    \ = \n{\n  \"mode\": \"none\",\n  \"entry\": \"./src/ui.js\",\n  \"output\": {\n\
    \    \"path\": __dirname + '/dist',\n    \"filename\": \"bundle.js\"\n  },\n \
    \ \"devServer\": {\n    \"contentBase\": path.join(__dirname, 'dist')\n  },\n\
    \  \"module\": {\n    \"rules\": [\n      {\n        \"test\": /\\.js$/,\n   \
    \     \"exclude\": /node_modules/,\n        \"use\": {\n          \"loader\":\
    \ \"babel-loader\"\n        }\n      }\n    ]\n  }\n};\n```\n\nListing 14‑8: `webpack.config.js`\n\
    \nWe should also create a Babel configuration file (named `.babelrc`) in the root\
    \ folder:\n\n```json\n{\n  \"presets\": [\"@babel/preset-env\"]\n}\n```\n\nListing\
    \ 14‑9: `.babelrc`\n\nThen, we install Jest:\n\n```bash\nnpm install jest --save-dev\n\
    ```\n\nWe will create a new folder (named `tests`):\n\n```bash\nmkdir tests\n\
    ```\n\nInside this folder we will create a file (named `helpers.spec.js`) that\
    \ will contain the tests for `helper.js`:\n\n```javascript\nimport {areDatesEqual}\
    \ from '../src/helpers.js';\ndescribe(\"Helpers testing\", () => {\n  it(\"When\
    \ dates are not equal - areDatesEqual() returns false\", () => {\n    let d1 =\
    \ new Date(2023, 12, 31);\n    let d2 = new Date(2023, 12, 30);\n    expect(areDatesEqual(d1,\
    \ d2)).toBe(false);\n  });\n  it(\"When dates are equal - areDatesEqual() returns\
    \ true\", () => {\n    let d1 = new Date(2023, 12, 31);\n    let d2 = new Date(2023,\
    \ 12, 31);\n    expect(areDatesEqual(d1, d2)).toBe(true);\n  });\n});\n```\n\n\
    Listing 14‑10: `helpers.spec.js`\n\nWe can now run the tests through `npm`:\n\n\
    ```bash\nnpm test\n```\n\nHere is the result:\n\n```text\n> appointments@1.0.0\
    \ test\n> jest\nPASS tests/helpers.spec.js\nHelpers testing\n  ✓ When dates are\
    \ not equal - areDatesEqual() returns false (4 ms)\n  ✓ When dates are equal -\
    \ areDatesEqual() returns true (1 ms)\n\nTest Suites: 1 passed, 1 total\nTests:\
    \ 2 passed, 2 total\nSnapshots: 0 total\nTime: 0.941 s, estimated 1 s\nRan all\
    \ test suites.\n```\n\nLet’s now migrate the logic test cases from `QUnit` to\
    \ `Jest`. We will use the assertion style that `Jest` uses, like the following:\n\
    \n*   `expect(expression).toBe(value)`\n*   `expect(expression).toEqual(object)`\n\
    *   `expect(expression).toBeTruthy()`\n*   `expect(expression).toBeFalsy()`\n\n\
    and many others\n\n```javascript\nimport { areDatesEqual, getDateOnly } from '../src/helpers.js';\n\
