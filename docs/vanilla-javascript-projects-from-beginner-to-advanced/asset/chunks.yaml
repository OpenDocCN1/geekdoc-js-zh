  trans: "\n\n![](img/image_rsrcBR2.jpg)\n\n原生 JavaScript 项目 - 从入门到精阶\n\nISBN: 9798878051323\n\
    \n版权所有 © 2024 Haris Tsetsekas\n\n# 目录\n\n1. 引言\n2. 温度转换\n3. 温度转换（版本 2）\n4. 颜色选择器\n\
    5. 颜色选择器（版本 2）\n6. 闹钟\n7. 待事项列表\n8. 待事项列表（版本 2）\n9. 待事项列表（版本 3）\n10. 表单验证\n11.\
    \ 预约列表\n12. 预约列表（版本 2）\n13. 预约列表（版本 3）\n14. 预约列表（版本 4）\n15. 支出追踪器\n16. 外货币投资组合\n\
    17. 带有气象信息的 OpenLayer 地图\n18. 带有无限滚动的产品列表\n19. Netflix 克隆项目\n20. 基于 Node.js API\
    \ 的书籍列表\n21. 主详情表单（Angular 克隆）\n22. 主详情表单（React 克隆）\n23. 吃豆鼠游戏\n\n# 1. 引言\n\n\
    在开始创建我们的项目之前，讨论一下如何创建项目、如何运行项目以及如何调试项目是一个很好的主意。\n\n# 开发\n\n书中的项目是使用 Visual Studio\
    \ Code (`https://code.visualstudio.com/`) 开发的，这是微软提供的一个免费集成开发环境 (IDE)。我们也可以使用其他\
    \ IDE，如 Eclipse 或 WebStorm。\n\n使用 VS Code 非常简单。我们应该在驱动器中创建一个文件夹，并将所有的代码放在其中。然后我们可以从“文件”菜单中选择“打开文件夹”来打开特定文件夹。该文件夹包含的文件都将是项目的一部分。\n\
    \n# 运行\n\n对于简单的网页，只需双击 HTML 文件即可运行。网页将在默认浏览器中打开，就可以开始操作了。我们还可以为 VS Code 安装 Live\
    \ Server 扩展，它会在 VS Code 内部运行一个小型 Web 服务器。当我们学习 webpack 和 vite 时，我们将使用它们自己的服务器进行开发。\n\
    \n每个每个项目都会有关于如何运行它的详尽说明。\n\n# 调试\n\n为了调试网页，我们可以使用浏览器提供的 Web 开发工具。在 Google Chrome\
    \ 和 Mozilla Firefox 中，我们都可以通过 `Ctrl+Shift+i` 调出工具。\n\n我们可以使用开发者工具做很多事情：\n\n* 我们可以查看\
    \ HTML 文件的结构和 CSS 属性（`Elements` 标签）\n* 我们可以查看控制台中的消息（`Console` 标签）\n* 我们可以查看 JavaScript\
    \ 代码并进行调试（`Sources` 标签）\n* 我们可以查看网络请求及其内容（`Network` 标签）\n* 以及更多\n\n在 `Sources`\
    \ 标签中，我们可以在 JavaScript 代码中设置断点。代码的执行会在这些点停止，然后我们可以查看变量的当前值。我们还可以通过选择 `Step Over`\
    \ (`F10`) 来逐行执行代码。也可以通过 `Step Into` (`F11`) 进入函数内部。最后，我们可以通过 `Resume Execution`\
    \ (`F8`) 继续执行代码（直到遇到下一个断点）。\n\n![](img/image_rsrcBR3.jpg)\n\n# 2. 温度转换\n\n对于我们的第一个项目，让我们创建一个简单的\
    \ Web 应用，将温度从摄氏度转换为华氏度，反亦然：\n\n# ![](img/image_rsrcBR4.jpg)\n\n## 涵盖的概念\n\n* 点击事件处理\n\
    * 数字解析与检查\n* CSS 样式 (Flex)\n\n## 建议的解决方案\n\n我们将首先在文件夹中创建一个 HTML 文件。在书中，我们将遵循将\
    \ Web 应用主 HTML 文件命名为 `index.html` 的惯例。\n\n| ```html\n<!DOCTYPE html><<html><head><title>Temperature\
    \ conversions</title><link href=\"style.css\" rel=\"stylesheet\"></head><body><div\
    \ class=\"container\"><<h1>Temperature conversions</h1><label class=\"item\">Celsius:</label><input\
    \ type=\"text\" id=\"celsius\"/><label class=\"item\">Fahrenheit:</label><input\
    \ type=\"text\" id=\"fahrenheit\"><button id=\"btn1\">Convert to Fahrenheit</button><button\
    \ id=\"btn2\">Convert to Celsius</button></div><script src=\"script.js\"></script></body></html>\n\
    ``` |  2‑1: index.html\n\n我们的应用程序包含两个文本输入 (`celsius`, `fahrenheit`) 和两个按钮 (`btn1`,\
    \ `btn2`)。我们将通过在 JavaScript 中设置 `onclick` 属性来处理这两个按钮的 `click` 事件。\n\n| ```javascript\n\
    const celsiusInput = document.getElementById('celsius');\nconst fahrenheitInput\
    \ = document.getElementById('fahrenheit');\nconst btn1 = document.getElementById('btn1');\n\
    const btn2 = document.getElementById('btn2');\n\nbtn1.onclick = function() {\n\
    \    const celsius = parseFloat(celsiusInput.value);\n    if (!isNaN(celsius))\
    \ {\n        fahrenheitInput.value = (celsius * 9/5) + 32;\n    }\n};\n\nbtn2.onclick\
    \ = function() {\n    const fahrenheit = parseFloat(fahrenheitInput.value);\n\
    \    if (!isNaN(fahrenheit)) {\n        celsiusInput.value = (fahrenheit - 32)\
    \ * 5/9;\n    }\n};\n``` | 2‑2: script.js\n\n两个函数的操作方式相似；首先，我们获取文本元素的引用（通过 `getElementById()`）。这样，我们就能通过每个元素的\
    \ `.value` 属性获取用户在文本框输入的内容。\n\n我们需要注意 `.value` 属性是一个字符串值。因此，我们需要解析用户输入的值，以便获得计算所需的实际数值。`parseFloat()`\
    \ 函数将从字符串开始解析，直到遇到非数字字符。转换示例如下：\n\n“1234x” → 1234\n“1234x567” → 1234\n“x1234”\
    \ → NaN\n\nNaN 的意思是“不是数字”，它是指定该值不是数字的一种。我们可以使用 `isNaN()` 函数检查变量是否为数字。如果用户输入了非数字字符串，将弹出提示，且结果文本框将留空。如果提供了数字字符串，我们进行计算，并通过设置相应文本框的\
    \ `.value` 属性来显示结果。`toFixed(2)` 函数提供保留两位小数的字符串表示。\n\n最后，让我们来看 CSS 文件 (style.css)：\n\
    \n```css\n.container{\n    width: 300px; /* 这是一个 flex 容器 */\n    display: flex;\
    \ /* 项目应该按列排列 */\n    flex-direction: column; /* 项目之间的间距 */\n    gap: 10px;\n\
    }\n.item{\n    width: 100%;\n}\nh1{\n    font-size: 1.5em;\n}\n``` | 2‑3: style.css\n\
    \n"
- fmt: "\nThe `div` element that encloses the textboxes and the buttons has the `container`\
    \ class assigned to it. This element will become a flex container, by setting\
    \ the `display` property to `flex`. We can place the enclosed items in a column\
    \ with `flex-direction: column`, and we can also add spacing between them by setting\
    \ the `gap` property.\n\nYou can find this project in GitHub:\n\n[https://github.com/htset/vanilla_javascript_projects/tree/main/temperature1](https://github.com/htset/vanilla_javascript_projects/tree/main/temperature1)\n\
    \n# 3. Temperature Conversion (version 2)\n\nLet’s refactor the temperature conversion\
    \ application, so that no buttons are used to initiate the calculations. Instead,\
    \ the conversions will be performed while the user types a temperature or either\
    \ type.\n\n![](image_rsrcBR5.jpg)\n\n## Concepts covered\n\n* Key event handling\n\
    \n# Proposed Solution\n\nIn this approach, we only have to change the HTML file:\n\
    \n```html\n<!DOCTYPE html><html><head><title>Temperature conversions</title><link\
    \ href=\"style.css\" rel=\"stylesheet\"></head><body>\n<div class=\"container\"\
    >\n<h1>Temperature conversions</h1><label class=\"item\" for=\"celsius\">Celsius:</label><input\
    \ class=\"item\" type=\"text\"id=\"celsius\" onkeyup=\"c2f()\"/><label class=\"\
    item\" for=\"fahrenheit\">Farhenheit:</label><input class=\"item\" type=\"text\"\
    id=\"fahrenheit\" onkeyup=\"f2c()\"/></</div><script src=\"script.js\" type=\"\
    text/javascript\"></script></body></html>\n```\nListing 3‑1: index.html\n\nIn\
    \ our HTML file, we have removed both buttons that fired the `click` event for\
    \ the temperature conversion. Instead, we opt to handle the `keyup` event, that\
    \ is fired when we press a key in our keyboard, exactly after we lift our finger\
    \ from the button. In this way, the conversion result is updated as we are typing\
    \ the input temperature.\n\nIt would be interesting for the reader to experiment\
    \ with the other two events that are related to typing, `keypress` and `keydown`.\
    \ It turns out that those two events are fired before the actual character is\
    \ inserted into the text box, so we are always one digit behind from the actual\
    \ number. Therefore, this makes them unsuitable for our purpose.\n\nThe JavaScript\
    \ and CSS files will remain the same:\n\n```javascript\nfunction f2c(){\n//get\
    \ access to the text box elements\nconst celsiusEl = document.getElementById(\"\
    celsius\");\nconst fahrenheitEl = document.getElementById(\"fahrenheit\");\n//parse\
    \ text into number\nconst fahrenheit = parseFloat(fahrenheitEl.value);\n//check\
    \ if parsed value is indeed a number\nif(isNaN(fahrenheit)){\nalert(\"The Fahrenheit\
    \ value is not correct\");\ncelsiusEl.value = \"\";\n}else{\nconst celsius = (fahrenheit\
    \ - 32) * 5 / 9;\n//write the result into the celsius text box\ncelsiusEl.value\
    \ = celsius.toFixed(2);  }\n}\nfunction c2f(){\n//get access to the text box elements\n\
    const celsiusEl = document.getElementById(\"celsius\");\nconst fahrenheitEl =\
    \ document.getElementById(\"fahrenheit\");\n//parse text into number\nconst celsius\
    \ = parseFloat(celsiusEl.value);\n//check if parsed value is indeed a number\n\
    if(isNaN(celsius)){\n    alert(\"The Celsius value is not correct\");\nfahrenheitEl.value\
    \ = \"\";\n}  else{\nconst fahrenheit = (celsius * 9 / 5) + 32;\n//write the result\
    \ into the fahrenheit text box\nfahrenheitEl.value = fahrenheit.toFixed(2);}}\n\
    ```\nListing 3‑2: script.js\n\n```css\n.container{width: 300px;/* this is a flex\
    \ container*/\ndisplay: flex;/* items should be placed in a column */\nflex-direction:\
    \ column;/* a gap between items */\ngap: 10px;}.\n.item{width: 100%;}\nh1{font-size:\
    \ 1.5em;}\n```\nListing 3‑3: style.css\n\nYou can find this project in GitHub:\n\
    \n[https://github.com/htset/vanilla_javascript_projects/tree/main/temperature2](https://github.com/htset/vanilla_javascript_projects/tree/main/temperature2)\n\
    \n# 4. Color Picker\n\nWe will create a web application that will enable users\
    \ to play with RGB (Red-Green-Blue) decimal or hex numbers and create colors.\n\
    \n![](image_rsrcBR6.jpg)\n\n## Concepts covered\n\n* Radio box handling\n* Setting\
    \ CSS properties with JavaScript\n* Event registration with `addEventListener()`\
    \ function\n\n# Proposed Solution\n\nFirst of all, we create our index.html file:\n\
    \n```html\n<!DOCTYPE html>\n<html><head><title>Color picker</title><link href=\"\
    style.css\" rel=\"stylesheet\"/></head>\n<body>\n<div class=\"container\">\n<h1>Color\
    \ picker</h1>\n<div><input type=\"radio\" name=\"decHex\" id=\"dec\" checked/>\
    \ Decimal<input type=\"radio\" name=\"decHex\" id=\"hex\"/> Hex  </div>\n<label>Red</label><input\
    \ type=\"number\" id=\"red\" value=\"0\"/><\n<label>Green</label><input type=\"\
    number\" id=\"green\" value=\"0\"/><\n<label>Blue</label><input type=\"number\"\
    \ id=\"blue\" value=\"0\"/><\n<div id=\"panel\"></div>\n</div>\n<script src=\"\
    script.js\" type=\"text/javascript\"></script></body></html>\n```\nListing 4‑1:\
    \ index.html\n\nWe use two radio boxes for the selection. Note that both radio\
    \ boxes must have the same `name` attribute; only then will be mutually exclusive.\
    \ We also add `input` elements of type `number` to increase and decrease values.\
    \ Finally, we add a `div` that will feature the calculated color. Note that we\
    \ do not declare any handlers in the HTML; we will do it in the following JavaScript:\n\
    \n```javascript\n//get reference to elements\nconst redEl = document.getElementById(\"\
    red\");\nconst greenEl = document.getElementById(\"green\");\nconst blueEl = document.getElementById(\"\
    blue\");\nconst panelEl = document.getElementById(\"panel\");\nconst decEl = document.getElementById(\"\
    dec\");\nconst hexEl = document.getElementById(\"hex\");\n\n//function to calculate\
    \ color\nconst calculateColor = function(){\nlet red;\nlet green;\nlet blue;\n\
    if(decEl.checked){//if decimal is checked, take value\nred = parseInt(redEl.value);\n\
    green = parseInt(greenEl.value);\nblue = parseInt(blueEl.value);\n\n}else{//if\
    \ hex is checked, convert from hex\nred = parseInt(redEl.value, 16);\ngreen =\
    \ parseInt(greenEl.value, 16);\nblue = parseInt(blueEl.value, 16);\n}\n//check\
    \ for 0-255 range\nif(red < 0 || red > 255 || isNaN(red) || green < 0 || green\
    \ > 255 || isNaN(green) || blue < 0 || blue > 255 || isNaN(blue)){\npanelEl.innerHTML\
    \ = \"Values should lie between 0 and 255 (0 and FF)\";\npanelEl.style.backgroundColor\
    \ = \"white\";\n}else{\npanelEl.innerHTML = \"\";\n//set background color\npanelEl.style.backgroundColor\
    \ = `rgb(${red}, ${green}, ${blue})`;\n}}\n\n//change event handler (radio button)\n\
    const toggleDecHex = function(){\nif (decEl.checked){\nredEl.value = parseInt(redEl.value,\
    \ 16);\ngreenEl.value = parseInt(greenEl.value, 16);\nblueEl.value = parseInt(blueEl.value,\
    \ 16);}\n\nelse{\nlet tmp = parseInt(redEl.value)\nredEl.value = tmp.toString(16);\n\
    tmp = parseInt(greenEl.value)\ngreenEl.value = tmp.toString(16);\ntmp = parseInt(blueEl.value)\n\
    blueEl.value = tmp.toString(16);\n}}\n\n//register event handlers\nredEl.addEventListener(\"\
    keyup\", calculateColor);\ngreenEl.addEventListener(\"keyup\", calculateColor);\n\
    blueEl.addEventListener(\"keyup\", calculateColor);\nredEl.addEventListener(\"\
    change\", calculateColor);\ngreenEl.addEventListener(\"change\", calculateColor);\n\
    blueEl.addEventListener(\"change\", calculateColor);\ndecEl.addEventListener(\"\
    change\", toggleDecHex);\nhexEl.addEventListener(\"change\", toggleDecHex);\n\n\
    //perform first calculation (all values are 0 by default)\ncalculateColor();\n\
    ```\nListing 4‑2: script.js\n"
