    \n18.                       Product list with infinite scroll\n\nLet’s create\
    \ a web page that will load products from an API service. The products will be\
    \ fetched and displayed on the web page in batches.\n\n![](image_rsrcBRH.jpg)\n\
    \n# Concepts covered\n\n*   Pagination\n\n*   Infinite scroll\n\n*   Timers\n\n\
    # Proposed Solution\n\nIn order to test our application, we can use a dummy API\
    \ service to retrieve information and images of products in JSON. More specifically,\
    \ we will use DummyJSON ([https://dummyjson.com](https://dummyjson.com) ), which\
    \ is a free service with various interesting resources.\n\nLet’s view the HTML\
    \ file:\n\n| <!DOCTYPE html><html lang=\"en\"><head><title>My Eshop</title><link   href=\"\
    https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css\"rel=\"\
    stylesheet\"integrity=\"sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65\"\
    crossorigin=\"anonymous\"></head><body><div class=\"container\"><header class=\"\
    bg-primary text-black p-4 m-4\"><h1>My Eshop</h1></header> \n\n<div class=\"d-flex\
    \ justify-content-center m-5\">\n\n<div class=\"products row row-cols-3 g-3\"\
    ></div></div><div class=\"d-flex justify-content-center m-5\"><div class=\"spinner-border\"\
    \ role=\"status\"></div></div></div><scriptsrc=\"https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js\"\
    integrity=\"sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4\"\
    crossorigin=\"anonymous\"></script><script src=\"script.js\" type=\"text/javascript\"\
    ></script></body></html> |\n\nListing 18‑1:index.html\n\nThere are two main <div>\
    \ elements in our HTML. The first one is where the product list is going to appear\
    \ (class  products). The second one is the spinner that will be displayed during\
    \ product loading (class  spinner-border). We use Bootstrap styling, so we will\
    \ not include our own CSS file.\n\nThe JS code begins with getting the main elements’\
    \ references and defining the function to fetch data from the API service:"
