- fmt: "\nMost of the CSS code deals with the styling of the popup. We use absolute\
    \ positioning for the map and the popup. Note also, that we import the corresponding\
    \ CSS files from the Open Layers library at the top of the page.\n\nNow, let’s\
    \ examine the JS code. The temperature information is retrieved from Open Meteo\
    \ ([https://open-meteo.com](https://open-meteo.com) ), a free meteo API service.\
    \ Here, we don’t have to get an API key; we can send `GET` requests directly to\
    \ this URL:\n\n`https://api.open-meteo.com/v1/forecast?latitude=X&longitude=X&current=temperature_2m`\n\
    \nWe provide the `latitude` and the `longitude` values of the location, and we\
    \ send a request for the temperature at 2 meters from the ground (there are also\
    \ many variables that we can get from this API).\n\nAt the beginning of the JS\
    \ file, we import the `OpenLayer` classes, and we get the references of the elements:\n\
    \n```javascript\nimport './style.css';\nimport { Map, View } from 'ol';\nimport\
    \ TileLayer from 'ol/layer/Tile';\nimport OSM from 'ol/source/OSM';\nimport VectorSource\
    \ from 'ol/source/Vector.js';\nimport VectorLayer from 'ol/layer/Vector.js';\n\
    import Feature from 'ol/Feature';\nimport Point from 'ol/geom/Point';\nimport\
    \ { toLonLat, fromLonLat } from 'ol/proj';\nimport Overlay from 'ol/Overlay';\
    \ \n\nconst container = document.getElementById('popup');\nconst content = document.getElementById('popup-content');\n\
    const close = document.getElementById('popup-close');\n```\n\nListing 17‑4: main.js\n\
    \nNote that we can import the CSS stylesheet from the JS code.\n\nNext, we define\
    \ the `async` function that will fetch the temperature data from the API:\n\n\
    ```javascript\nconst getTemp = async function(lat, lon) {\n  try {\n    const\
    \ URL = 'https://api.open-meteo.com/v1/forecast?latitude='+ lat + '&longitude='\
    \ + lon + '&current=temperature_2m';\n    const response = await fetch(URL);\n\
    \    if (!response.ok) {\n      throw new Error(\"Error in network response\"\
    );\n    }\n    const temp = await response.json();\n    return temp.current.temperature_2m;\n\
    \  } catch (error) {\n    console.error(\"There has been a problem with fetch:\"\
    , error);\n    return null;\n  }\n}\n```\n\nListing 17‑5: main.js\n\nThen, we\
    \ define the `async` function that will be called when the user clicks on the\
    \ map:\n\n```javascript\n//show popup on map\nconst handleClickOnMap = async function(event)\
    \ {\n  var point = map.getCoordinateFromPixel(event.pixel);\n  var lonLat = toLonLat(point);\n\
    \  let temp = await getTemp(lonLat[1], lonLat[0]);\n  if (temp !== null) {\n \
    \   content.innerHTML= '<p>You clicked here:</p><code>' + lonLat+ '</code><p>Temperature:\
    \ ' + temp + '</p>';\n  } else {\n    content.innerHTML= '<p>You clicked here:</p><code>'\
    \ + lonLat+ '</code><p>There was an error with the request</p>';\n  }\n  overlay.setPosition(point);\n\
    }\n```\n\nListing 17‑6: main.js\n\nWe get the coordinates from the pixel on the\
    \ map, and we translate them into longitude and latitude values. We use those\
    \ values to get the temperature at the specific location. We then formulate the\
    \ popup message, and we display it on the map.\n\nNext, we define the `Open Layers`\
    \ object that we will use in our application. We define a `Map` object that corresponds\
    \ to the actual map shown. We also definea `View` object that will be used to\
    \ center the map and set the zoom level. We also define an `Overlay` object that\
    \ will contain the popup:\n\n```javascript\n//An overlay to anchor the popup to\
    \ the map.\nconst overlay = new Overlay({\n  element: container,\n  autoPan: {\n\
    \    animation: {\n      duration: 250,\n    },\n  },\n});\n//The view object\n\
    const view = new View({\n  center: [0, 0],\n  zoom: 1,\n});\n//The map object\n\
    const map = new Map({\n  target: 'map',\n  layers: [new TileLayer({source: new\
    \ OSM()})],\n  overlays: [overlay],\n  view: view\n});\n```\n\nListing 17‑7: main.js\n\
    \nNow, we will define the callback function that will be called when our application\
    \ gets geolocation information from the browser. The users will be asked to allow\
    \ access to their location. If permission is granted, then this function will\
    \ be called:\n\n```javascript\n//If we have geolocation --> we center the map\
    \ to our location\n// and we display the current temperature\nconst centerToPosition\
    \ = async function(position) {\n  //add marker on user's location\n  var layer\
    \ = new VectorLayer({\n    source: new VectorSource({\n      features: [new Feature({\n\
    \        geometry: new Point(fromLonLat([position.coords.longitude,position.coords.latitude]))\n\
    \      })])\n    })\n  });\n  map.addLayer(layer);\n  //get temperature for user's\
    \ location\n  let temp = await getTemp(position.coords.latitude,position.coords.longitude);\
    \ \n\n  if (temp !== null) {\n    content.innerHTML= '<p>Temperature: ' + temp\
    \ + '</p>';\n  } else {\n    content.innerHTML= '<p>There was an error with the\
    \ request</p>';\n  }\n  //set position of the popup on user's location\n  var\
    \ point = fromLonLat([position.coords.longitude,position.coords.latitude]);\n\
    \  overlay.setPosition(point);\n  //create a new View object with new coordinates\n\
    \  // and zoom level\n  const newView = new View({\n    center: fromLonLat([position.coords.longitude,position.coords.latitude]),\n\
    \    zoom: 10,\n  });\n  //update map to new View\n  map.setView(newView);\n}\n\
    ```\n\nListing 17‑8: main.js\n\nFirst, we create a new `VectorLayer` object that\
    \ will be used to place a marker of the user’s location on the map. Then, we get\
    \ the temperature for the user’s location, and we formulate the text for the popup.\
    \ We use the `Overlay` object to display the popup on the map. We also create\
    \ a new `View` object with a new center (the user’s location) and a higher zoom\
    \ level. We set the map’s view to our new `View` object. As a result, the map\
    \ will center and zoom on to the user’s location.\n\nFinally, we define the event\
    \ listeners for the map and the popup. We also add the startup code:\n\n```javascript\n\
    //When we click on the map\nmap.on('click', handleClickOnMap);\n//When the popup\
    \ should be closed\nclose.onclick = function () {\n  overlay.setPosition(undefined);\n\
    \  close.blur();\n  return false;\n};\n//Startup: we ask the user if geolocation\
    \ is allowed\nif (navigator.geolocation) {\n  navigator.geolocation.getCurrentPosition(centerToPosition);\n\
    }\n```\n\nListing 17‑9: main.js\n\nYou can find this project in GitHub:\n\n[https://github.com/htset/vanilla-js](https://github.com/htset/vanilla-js)\n"
