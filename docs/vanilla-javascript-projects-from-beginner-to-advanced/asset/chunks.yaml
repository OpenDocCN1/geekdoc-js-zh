    \ = key + \"-\" + supportedCurencies[key].name;baseCurrencyEl.appendChild(option);});\
    \ \n\n}\n\nelse {supportedCurencies = null;}} |\n\nListing 16‑4: script.js\n\n\
    This function is also  async because it awaits on the  async function  fetchSupportedCurrencies().\
