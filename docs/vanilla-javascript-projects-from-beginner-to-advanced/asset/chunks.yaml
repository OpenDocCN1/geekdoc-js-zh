  trans: "\n\n# 涵盖的概念\n\n*   Bootstrap 的使用\n*   添加和删除 DOM 元素\n*   箭头函数\n*   表单处理\n\
    \n# 拟解决方案\n\n一如既往，我们将从 HTML 文件开始：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\"\
    >\n<head>\n<link href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css\"\
    rel=\"stylesheet\"integrity=\"sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65\"\
    \ crossorigin=\"anonymous\">\n</head>\n<body\n  <div class=\"container\">\n  \
    \  <header class=\"bg-info text-black p-4 m-4\">\n      <h1>My Todo List</h1>\n\
    \    </header>\n    <div class=\"container\">\n      <div class=\"card card-body\"\
    >\n        <form action=\"\" id=\"form\">\n          <div class=\"row\">\n   \
    \         <div class=\"col-md-9\">\n              <input type=\"text\" class=\"\
    form-control m-2\" id=\"text\">\n            </div>\n            <div class=\"\
    col-md-3\">\n              <input type=\"submit\" class=\"form-control btn btn-success\
    \ m-2\"value=\"Add new Task\">\n            </div>\n          </div>\n       \
    \ </form>\n        <h2 class=\"title\">My Tasks</h2>\n        <ul id=\"items\"\
    \ class=\"list-group\"></ul>\n      </div>\n    </div>\n  </div>\n  <script src=\"\
    https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js\"\
    integrity=\"sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4\"\
    \ crossorigin=\"anonymous\"></script>\n  <script src=\"script.js\" type=\"text/javascript\"\
    ></script>\n</body>\n</html>\n```\n列表 8‑1：index.html\n\n# 拖放功能\n\n我们需要更新 JavaScript\
    \ 文件以为用户提供拖放功能：\n\n```javascript\nconst formEl = document.getElementById(\"form\"\
    );\nconst itemsEl = document.getElementById(\"items\");\nconst textEl = document.getElementById(\"\
    text\");\nlet draggedItem;\nconst handleSubmit = (e) => {\n  //创建一个新的 <li> 元素\n\
    \  const item = document.createElement(\"li\");\n  //在 <li> 内部添加文本节点 TextNode\n\
    \  const textnode = document.createTextNode(textEl.value);\n  item.appendChild(textnode);\n\
    \  //设置元素属性\n  item.setAttribute(\"class\", \"list-group-item\");\n  item.setAttribute(\"\
    name\", \"list\");\n  item.setAttribute(\"draggable\", \"true\");\n  //在 <li>\
    \ 中添加删除按钮\n  const button = document.createElement(\"button\");\n  button.innerHTML\
    \ = \"delete\";\n  button.style.float = \"right\";\n  button.addEventListener(\"\
    click\", deleteTodo);\n  item.appendChild(button);\n  //将 <li> 添加到 <ul> 列表中\n\
    \  itemsEl.appendChild(item);\n  //清空文本框\n  textEl.value = '';\n  //阻止表单提交\n \
    \ e.preventDefault()\n}\nconst deleteTodo = (e) => {\n  //找到按钮的父元素（即 <li> 元素）\n\
    \  //并从 DOM 中移除它\n  e.target.parentElement.remove();\n}\n//绑定事件监听器\nformEl.addEventListener(\"\
    submit\", handleSubmit);\n```\n列表 8‑2：script.js\n\n"
- fmt: "\n```javascript\n// prevent form submission\ne.preventDefault();\nconst deleteTodo\
    \ = (e) => {\n  // find the parent element of the button (--> the <li> element)\n\
    \  // and remove it from the DOM\n  e.target.parentElement.remove();\n}\n// called\
    \ when dragging starts\nconst handleDragStart = (e) => {\n  draggedItem = e.target;\n\
    \  e.dataTransfer.effectAllowed = 'move';\n  e.dataTransfer.setData('text/html',\
    \ draggedItem.innerHTML);\n}\n// called when the item is dragged over another\
    \ item\nconst handleDragOver = (e) => {\n  e.preventDefault();\n}\n// called when\
    \ the item is dropped\nconst handleDrop = (e) => {\n  e.preventDefault();\n  //\
    \ check whether it will be placed before or after the target element\n  if (e.target\
    \ !== draggedItem && e.target.classList.contains('list-group-item')) {\n    if\
    \ (e.clientY > e.target.getBoundingClientRect().top + (e.target.offsetHeight /\
    \ 2)) {\n      // drop it after the item --> i.e. before the next sibling of the\
    \ item\n      e.target.parentNode.insertBefore(draggedItem, e.target.nextSibling);\n\
    \    } else {\n      // drop it before the item\n      e.target.parentNode.insertBefore(draggedItem,\
    \ e.target);\n    }\n  }\n  draggedItem = null;\n}\n// attach event listeners\n\
    itemsEl.addEventListener(\"dragstart\", handleDragStart);\nitemsEl.addEventListener(\"\
    dragover\", handleDragOver);\nitemsEl.addEventListener(\"drop\", handleDrop);\n\
    formEl.addEventListener(\"submit\", handleSubmit);\n```\n\n#### Listing 8‑2: script.js\n\
    \nFirst of all, we should mark list items as draggable. For this, we add the `draggable`\
    \ attribute when we create a new list item:\n\n```javascript\nitem.setAttribute(\"\
    draggable\", \"true\");\n```\n\nFurthermore, in addition to the `submit` event,\
    \ we will have to handle the following events:\n\n*   `dragstart`: fired when\
    \ dragging starts\n*   `dragover`: fired when the dragged item is over the target\
    \ item\n*   `drop`: fired when the dragged item is dropped on the target item\n\
    \nWe will add event listeners for these three events by calling `addEventListener()`\
    \ on the items list element. We define three event handlers:\n\n*   `handleDragStart()`\n\
    *   `handleDragOver()`\n*   `handleDrop()`\n\nWhen dragging starts, we keep the\
    \ reference to the dragged item (`e.target`) in a variable; it will be needed\
    \ in the other functions.\n\nThe event object (`e`) contains a `dataTransfer`\
    \ object. With the `dataTransfer` object we can specify the effect that will take\
    \ place (in our case, move the item to another place). We also specify that we\
    \ are going to move HTML (i.e., the `innerHTML` value of the item).\n\nWhen the\
    \ item is moved over the list (which is a valid drop target), then the `dragover`\
    \ event is fired. In the handler function we call `e.preventDefault()`, which\
    \ enables it to receive drop events.\n\nFinally, when the item is dropped inside\
    \ the list, we first prevent the default handling of the item (the default behavious\
    \ is to open as link on drop). The argument of the handler function `handleDrop(e)`\
    \ is the actual event fired. From this event we can get the target element, i.e.\
    \ the element on which the dragged item was dropped.\n\nFirst, we make sure that\
    \ the target element is not the dragged element itself (this will happen when\
    \ the dragged element has not been moved) and that the target element is of the\
    \ `list-group-item` class (i.e. it is a list item). Then, we do some measuring,\
    \ in order to find out whether we will insert the dragged item before or after\
    \ the aforementioned list item.\n\nDepending on whether we dropped it on the top\
    \ or the bottom half of the list item, the dragged item will be inserted (with\
    \ `insertBefore()`) before the item itself or the next sibling of the item respectively.\n\
    \nYou can find this project in GitHub:\n\nhttps://github.com/htset/vanilla_javascript_projects/tree/main/todo2\n\
    \n# 9.            Todo List (version 3)\n\nIn the third part of the Todo List\
    \ saga, we will again refactor our application, by keeping the application state\
    \ (the todo entries) into an array. Moreover, the todo entries will be stored\
    \ in `localStorage`, in order to be available between application reloads.\n\n\
    ## Concepts covered\n\n*   JS array manipulation\n*   Local storage\n\n## Proposed\
    \ Solution\n\nThe application that we created in the previous chapter works pretty\
    \ well. However, it still has some shortcomings. For instance, when the web page\
    \ reloads, the tasks are lost, and we have to enter them all over again. For this\
    \ reason, we will use `localStorage` in order to store the todo entries into the\
    \ browser’s storage space and have them available, even when our web page reloads.\n\
    \nFurthermore, the application maintains our data (i.e. the todo entries) inside\
    \ the HTML, since the entries text is entered inside list item (`<li>`) elements.\
    \ This is not very efficient; for instance, if we wanted to get the text of a\
    \ specific todo entry, then we would have to use DOM manipulation and get the\
    \ `innerHTML` value of the respective list item.\n\nGiven that we also need to\
    \ store the todo entries into `localStorage`, it would be better to maintain all\
    \ the entries in an array of strings. Whenever the user adds, deletes or drags\
    \ a todo entry, then this array will be updated, and the modified array will be\
    \ used to re-render the todo list in the web page.\n\nThe HTML code of our project\
    \ will remain unchanged:\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    \  <link href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css\"\
    \ rel=\"stylesheet\">\n  <title>Todo List</title>\n</head>\n<body>\n  <div class=\"\
    container\">\n    <header class=\"bg-info text-black p-4\">\n      <h1>Todo List</h1>\n\
    \    </header>\n    <div class=\"card card-body\">\n      <form class=\"row\"\
    >\n        <div class=\"col-md-9\">\n          <input type=\"text\" class=\"form-control\
    \ m-2\" id=\"text\">\n        </div>\n        <div class=\"col-md-3\">\n     \
    \     <input type=\"submit\" class=\"btn btn-success m-2\" value=\"Add Task\"\
    >\n        </div>\n      </form>\n      <h2>My Tasks</h2>\n      <ul id=\"items\"\
    \ class=\"list-group\"></ul>\n    </div>\n  </div>\n  <script src=\"https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js\"\
    ></script>\n  <script src=\"script.js\"></script>\n</body>\n</html>\n```\n\n####\
    \ Listing 9‑1: index.html\n\nWe will have to refactor the JavaScript code:\n\n\
    ```javascript\nconst formEl = document.getElementById(\"form\");\nconst itemsEl\
    \ = document.getElementById(\"items\");\nconst textEl = document.getElementById(\"\
    text\");\nlet draggedItem, draggedItemID;\n\n// re-create unordered list based\
    \ on the array of tasks\nconst renderList = () => {\n  // first delete the existing\
    \ entries\n  itemsEl.innerHTML = '';\n  for (let id in tasks) {\n    // create\
    \ new <li> element\n    const item = document.createElement(\"li\");\n    // add\
    \ TextNode inside <li>\n    const textnode = document.createTextNode(tasks[id]);\n\
    \    item.appendChild(textnode);\n    // set element attributes\n    item.setAttribute(\"\
    class\", \"list-group-item\");\n    item.setAttribute(\"name\", \"list\");\n \
    \   item.setAttribute(\"draggable\", \"true\");\n    item.setAttribute(\"data-id\"\
    , id); // custom attribute\n    // add Delete button to <li>\n    let button =\
    \ document.createElement(\"button\");\n    button.innerHTML = \"delete\";\n  \
    \  button.style.float = \"right\";\n    button.addEventListener(\"click\", deleteTodo);\n\
    \    item.appendChild(button);\n    // add <li> to <ul> list\n    itemsEl.appendChild(item);\n\
    \  }\n}\n\nconst deleteTodo = (e) => {\n  // get the index of the element via\
    \ the data-id custom attribute\n  const targetID = e.target.parentNode.getAttribute(\"\
    data-id\");\n  // remove task from array\n  tasks.splice(targetID, 1);\n  renderList();\n\
    \  // replace modified array in local storage\n  localStorage.setItem(\"tasks\"\
    , JSON.stringify(tasks));\n}\n\n// called when dragging starts\nconst handleDragStart\
    \ = (e) => {\n  draggedItem = e.target;\n  // keep the id of the moved item in\
    \ a variable\n  draggedItemID = e.target.getAttribute(\"data-id\");\n  e.dataTransfer.effectAllowed\
    \ = 'move';\n  e.dataTransfer.setData('text/html', draggedItem.innerHTML);\n}\n\
    \n// called when the item is dragged over another item\nconst handleDragOver =\
    \ (e) => {\n  e.preventDefault();\n}\n\n// called when the item is dropped\nconst\
    \ handleDrop = (e) => {\n  e.preventDefault();\n}\n```\n"
