    The container `<div>` gets relative positioning. This will be combined with the\
    \ absolute positioning of the arrows, to place them at the edges of their respective\
    \ container:\n\n```css\n.container{\n  position:relative;\n}\n```\n\nFor the two\
    \ sliders, we specify a transition of one second. This means that the slider movement\
    \ to the left or the fight will be performed smoothly. The `white-space` property\
    \ is used to avoid wrapping of the images on a new line, but instead to be positioned\
    \ one after the other:\n\n```css\n.slider, .slider2 {\n  white-space: nowrap;\n\
    \  transition: all 1.0s ease-in-out;\n}\n```\n\nIn the CSS for the item element\
    \ (i.e. the movie icon) we get the `width` and the `height` from the variables\
    \ defined above. We also set the `display` property to `inline-block`: this will\
    \ make the icons line up. Here again, we define a `transition`; this will apply\
    \ during the appearance of the movie description:\n\n```css\n.item {\n  width:\
    \ var(--icon-width);\n  height: var(--icon-height);\n  display: inline-block;\n\
    \  position: relative;\n  color: white;\n  font-size: 0.8rem;\n  transition: all\
    \ 0.6s ease-in-out;\n  text-align: center;\n}\n```\n\nNext, we define some pseudo-classes\
    \ on the item class. The `nth-of-type(1)` pseudo-class applies to the first item\
    \ in the list, i.e. the first icon on the left. This is used to give an extra\
    \ margin to the left of the slider.\n\nWhen the mouse pointer hovers over an item,\
    \ a transformation is applied, and the item becomes 40% bigger. Moreover, the\
    \ description become visible:\n\n```css\n.item:nth-of-type(1) {\n  margin-left:\
    \ var(--arrow-width);\n}\n\n.item:hover {\n  transform: scale(1.4);\n  z-index:\
    \ 50;\n  border: 1px white solid;\n  background-color: darkgray;\n}\n\n.item:hover\
    \ > .description {\n  visibility:visible;\n}\n```\n\nThe description class is\
    \ initially hidden. We use the `pre-line` value for the `white-space` property.\
    \ This means that sequences of white space are collapsed, and lines are broken\
    \ at newline characters as necessary to fill line boxes:\n\n```css\n.description{\n\
    \  width: var(--icon-width);\n  white-space: pre-line;\n  visibility:hidden;\n\
    }\n\n.descr-text{\n  height: 40px;\n  display:block;\n  overflow: hidden;\n  padding:\
