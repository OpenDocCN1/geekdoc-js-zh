  trans: "\n大部分 CSS 代码用于处理弹窗的样式。我们对地图和弹窗使用了绝对定位。请注意，我们在页面顶部从 Open Layers 库导入了相应的 CSS\
    \ 文件。\n\n现在，让我们来看 JS 代码。温度信息是从 Open Meteo ([`open-meteo.com`](https://open-meteo.com))\
    \ 获取的，这是一个免费的气象 API 服务。在这里我们不需要获取 API 密钥；可以直接向此 URL 发送 `GET` 请求：\n\n`https://api.open-meteo.com/v1/forecast?latitude=X&longitude=X&current=temperature_2m`\n\
    \n提供了位置的 `latitude`（纬度）和 `longitude`（经度）值，并发送了获取地面上 2 米处温度的请求（我们还可以从这个 API 获取许多变量）。\n\
    \n在 JS 文件的开头，我们导入了 `OpenLayer` 类并获取了元素的引用：\n\n```javascript\nimport './style.css';\n\
    import { Map, View } from 'ol';\nimport TileLayer from 'ol/layer/Tile';\nimport\
    \ OSM from 'ol/source/OSM';\nimport VectorSource from 'ol/source/Vector.js';\n\
    import VectorLayer from 'ol/layer/Vector.js';\nimport Feature from 'ol/Feature';\n\
    import Point from 'ol/geom/Point';\nimport { toLonLat, fromLonLat } from 'ol/proj';\n\
    import Overlay from 'ol/Overlay'; \n\nconst container = document.getElementById('popup');\n\
    const content = document.getElementById('popup-content');\nconst close = document.getElementById('popup-close');\n\
    ```\n\n列表 17‑4：main.js\n\n注意，我们可以从 JS 代码导入 CSS 样式表。\n\n接下来，我们定义了一个 `async` 函数，用于从\
    \ API 获取温度数据：\n\n```javascript\nconst getTemp = async function(lat, lon) {\n \
    \ try {\n    const URL = 'https://api.open-meteo.com/v1/forecast?latitude='+ lat\
    \ + '&longitude=' + lon + '&current=temperature_2m';\n    const response = await\
    \ fetch(URL);\n    if (!response.ok) {\n      throw new Error(\"Error in network\
    \ response\");\n    }\n    const temp = await response.json();\n    return temp.current.temperature_2m;\n\
    \  } catch (error) {\n    console.error(\"There has been a problem with fetch:\"\
    , error);\n    return null;\n  }\n}\n```\n\n列表 17‑5：main.js\n\n然后，我们定义了一个在用户点击地图时会被调用的\
    \ `async` 函数：\n\n```javascript\n//在地图上显示弹窗\nconst handleClickOnMap = async function(event)\
    \ {\n  var point = map.getCoordinateFromPixel(event.pixel);\n  var lonLat = toLonLat(point);\n\
    \  let temp = await getTemp(lonLat[1], lonLat[0]);\n  if (temp !== null) {\n \
    \   content.innerHTML= '<p>You clicked here:</p><code>' + lonLat+ '</code><p>Temperature:\
    \ ' + temp + '</p>';\n  } else {\n    content.innerHTML= '<p>You clicked here:</p><code>'\
    \ + lonLat+ '</code><p>There was an error with the request</p>';\n  }\n  overlay.setPosition(point);\n\
    }\n```\n\n列表 17‑6：main.js\n\n我们从地图上的像素获取坐标，并将其转换为经、纬度值。我们使用这些值来获取特定位置的温度。然后我们构建弹窗消息并将其显示在地图上。\n\
    \n接下来，我们定义了将在应用程序中使用的 `Open Layers` 对象。我们定义了一个与实际地图对应的 `Map` 对象。我们还定义了一个 `View`\
    \ 对象，用于将地图居中并设置缩放级别。此外，我们定义了一个包含弹窗的 `Overlay` 对象：\n\n```javascript\n//用于将弹窗锚定到地图上的覆盖层\n\
    const overlay = new Overlay({\n  element: container,\n  autoPan: {\n    animation:\
    \ {\n      duration: 250,\n    },\n  },\n});\n//视图对象\nconst view = new View({\n\
    \  center: [0, 0],\n  zoom: 1,\n});\n//地图对象\nconst map = new Map({\n  target:\
    \ 'map',\n  layers: [new TileLayer({source: new OSM()})],\n  overlays: [overlay],\n\
    \  view: view\n});\n```\n\n列表 17‑7：main.js\n\n现在，我们将定义一个回调函数，当我们的应用程序从浏览器获取地理位置信息时会被调用。用户将被要求允许访问其位置。如果获得许可，则将调用此函数：\n\
    \n```javascript\n//如果我们获取了地理位置 --> 将地图居中到我们的位置\n//并显示当前温度\nconst centerToPosition\
    \ = async function(position) {\n  //在用户位置添加标记\n  var layer = new VectorLayer({\n\
    \    source: new VectorSource({\n      features: [new Feature({\n        geometry:\
    \ new Point(fromLonLat([position.coords.longitude,position.coords.latitude]))\n\
    \      })])\n    })\n  });\n  map.addLayer(layer);\n  //获取用户所在位置的温度\n  let temp\
    \ = await getTemp(position.coords.latitude,position.coords.longitude); \n\n  if\
    \ (temp !== null) {\n    content.innerHTML= '<p>Temperature: ' + temp + '</p>';\n\
    \  } else {\n    content.innerHTML= '<p>There was an error with the request</p>';\n\
    \  }\n  //在用户位置设置弹窗的位置\n  var point = fromLonLat([position.coords.longitude,position.coords.latitude]);\n\
    \  overlay.setPosition(point);\n  //创建一个带有新坐标\n//和缩放级别的视图对象\n  const newView =\
    \ new View({\n    center: fromLonLat([position.coords.longitude,position.coords.latitude]),\n\
    \    zoom: 10,\n  });\n  //更新地图到新视图\n  map.setView(newView);\n}\n```\n\n列表 17‑8：main.js\n"
- fmt: "\n```javascript\nconst productsEl = document.querySelector('.products');\n\
    const spinnerEl = document.querySelector('.spinner-border');\nconst fetchProducts\
    \ = async (limit, skip) => {\n  const URL = `https://dummyjson.com/products/?limit=${limit}&skip=${skip}`;\n\
    \  const response = await fetch(URL);\n  if (!response.ok) {\n    throw new Error(`Error:\
    \ ${response.status}`);\n  }\n  return await response.json()\n}\n```\nListing\
    \ 18‑2: script.js\n\nThis is an `async` function as it has to `await` on the `fetch()`\
    \ operation. Our function has two parameters that will enable pagination:\n\n\
    - `limit`: how many items will be fetched\n- `skip`: how many items will be skipped\
    \ from the start\n\nFor instance, with `limit=10` and `skip=50` we will fetch\
    \ 10 items starting from the 51st item in the line of products.\n\nNext, we define\
    \ the function that will render the product information on the page:\n\n```javascript\n\
    const renderProducts = (products) => {\n  products.forEach(product => {\n    const\
    \ productEl = document.createElement('div');\n    productEl.classList.add('card');\n\
    \    productEl.style = \"width: 25rem;\"\n    productEl.innerHTML = `<img src=\"\
    ${product.thumbnail}\"class=\"card-img-top img-thumbnail\" style=\"height:300px\"\
    ><div class=\"card-body\"><h5 class=\"card-title\">${product.title}</h5><p class=\"\
    card-text\">${product.description}</p>`;\n    productsEl.appendChild(productEl);\n\
    \  });\n};\n```\nListing 18‑3: script.js\n\nFor each product in the returned JSON\
    \ array, we create a new `<div>` element, that has the Bootstrap card style class.\
    \ Inside the card, we place the thumbnail image, the title, and the description\
    \ of the product. The image is loaded directly from the DummyJSON server; we just\
    \ enter its URL that is provided by the API. Finally, the new `<div>` element\
    \ is appended to the products list `<div>` element.\n\nNext, we create the `async`\
    \ function the will call the former two functions, but only when there are any\
    \ more products to fetch:\n\n```javascript\nconst loadProducts = async (page,\
    \ limit) => {\n  showSpinner();\n  try {\n    if (skip < total || total == 0)\
    \ {\n      const response = await fetchProducts(page, limit);\n      renderProducts(response.products);\n\
    \      total = response.total;\n    }\n  } catch (error) {\n    console.log(error.message);\n\
    \  }\n  hideSpinner();\n};\nconst hideSpinner = () => {\n  spinnerEl.style.visibility\
    \ = \"hidden\";\n};\nconst showSpinner = () => {\n  spinnerEl.style.visibility\
    \ = \"visible\";\n};\n```\nListing 18‑4: script.js\n\nThe response from the Web\
    \ API contains the `total` parameter, with the total amount of products available.\
    \ We will save this value in our local `total` variable and will compare it with\
    \ the `skip` parameter, to understand whether there are any products left to fetch.\
    \ This function shows the spinner `<div>` at the beginning of the fetch operation\
    \ and hides it when the response has been displayed in the web page.\n\nNext,\
    \ we have the `handleScroll()` function that is called when the `scroll` event\
    \ is emitted:\n\n```javascript\nconst handleScroll = () => {\n  if (timerRunning)\
    \ return;\n  timerRunning = true;\n  setTimeout(() => {\n    const docEl = document.documentElement;\n\
    \    if (docEl.scrollTop + docEl.clientHeight >= docEl.scrollHeight - 10) {\n\
    \      skip += limit;\n      loadProducts(limit, skip);\n    }\n    timerRunning\
    \ = false;\n  }, 1000);\n};\nwindow.addEventListener('scroll', handleScroll);\n\
    ```\nListing 18‑5: script.js\n\nThe scroll event is called many times as we are\
    \ scrolling our page. To avoid calling the `loadProducts()` function too many\
    \ times, we will add a delay of one second, with the use of the `setTimeout()`\
    \ function. When the callback function is run, it will use the `scrollTop`, `clientHeight`\
    \ and `scrollHeight` properties to figure out whether it should fetch the next\
    \ batch of products. We use the `timerRunning` boolean value to control whether\
    \ `setTimeout()` will be called or skipped.\n\nFinally, we initialize the parameters\
    \ used and we load the first batch of the products in the list:\n\n```javascript\n\
    const limit = 12;\nlet total = 0;\nlet skip = 0;\nvar timerRunning;\nloadProducts(limit,\
    \ skip);\n```\nListing 18‑6: script.js\n\nYou can find this project in GitHub:\n\
    \n[https://github.com/htset/vanilla_javascript_projects/tree/main/scroll](https://github.com/htset/vanilla_javascript_projects/tree/main/scroll)\n\
    \n# 19. Netflix clone\n\nIn this project, we will try to emulate the user interface\
    \ of Netflix ([https://www.netflix.com](https://www.netflix.com)). More specifically,\
    \ we will create rows of movie icons that can be scrolled left or right. Also,\
    \ when the mouse hovers over an icon, the movie decription will pop up in a smooth\
    \ manner.\n\n![](image_rsrcBRJ.jpg)\n\n# Concepts covered\n\n- CSS transitions\
    \ and transformations\n- DOM manipulation\n\n# Proposed Solution\n\nWe will use\
    \ The MovieDB ([https://www.themoviedb.org](https://www.themoviedb.org/)) free\
    \ service to get the posters and the titles of the movies. After we become members\
    \ of the service, we can get an API key for the RESTful requests.\n\nHere is the\
    \ HTML file of our web page:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta\
    \ charset=\"UTF-8\">\n  <title>My Movies</title>\n  <link rel=\"stylesheet\" href=\"\
    style.css\">\n  <script src=\"https://kit.fontawesome.com/your-key.js\" crossorigin=\"\
    anonymous\"></script>\n</head>\n<body>\n  <div class=\"logo\">\n    <h1>Trending\
    \ Now</h1>\n  </div>\n  <div class=\"container\">\n    <!-- Movies will be injected\
    \ here -->\n  </div>\n  <div id=\"spinner\" class=\"spinner-border\" style=\"\
    visibility: hidden;\"></div>\n  <div class=\"descr-buttons\">\n    <button id=\"\
    prev\"><i class=\"fas fa-chevron-left\"></i></button>\n    <button id=\"next\"\
    ><i class=\"fas fa-chevron-right\"></i></button>\n  </div>\n  <script src=\"script.js\"\
    ></script>\n</body>\n</html>\n```\nListing 19‑1: index.html\n\nOur HTML features\
    \ two `<div>` containers, one for trending movies and one for top-rated. We create\
    \ the arrows using Font Awesome. Let’s see now the CSS:\n\n```css\n:root {\n \
    \ --icon-width: 250px;\n  --icon-height: 200px;\n  --arrow-width: 50px;\n}\n\n\
    body {\n  background-color: black;\n  color: white;\n  overflow: hidden; /* Hide\
    \ scrollbars */\n}\n\n.logo {\n  width: var(--icon-width);\n  padding: 20px;\n\
    }\n\n.container {\n  position: relative;\n}\n\n.slider, .slider2 {\n  white-space:\
    \ nowrap;\n}\n\n.item {\n  width: var(--icon-width);\n  height: var(--icon-height);\n\
    \  display: inline-block;\n  position: relative;\n  transition: all 1.0s ease-in-out;\n\
    \  text-align: center;\n}\n\n.item:nth-type(1) {\n  margin-left: var(--arrow-width);\n\
    }\n\n.item:hover {\n  transform: scale(1.4);\n  z-index: 50;\n  border: 1px solid\
    \ white;\n  background-color: darkgray;\n}\n\n.item:hover > .description {\n \
    \ visibility: visible;\n}\n\n.description {\n  width: var(--icon-width);\n  white-space:\
    \ pre-line;\n  visibility: hidden;\n}\n\n.descr-text {\n  height: 40px;\n  display:\
    \ block;\n  overflow: hidden;\n  padding: 0 10px;\n  text-align: left;\n}\n\n\
    .descr-buttons {\n  display: flex;\n  flex-direction: row;\n  padding: 10px;\n\
