    \n在两个函数中，我们通都可以使用多种 CSS 选择器来获取我们需要的对象。例如：\n\n```javascript\nconst amount = item.querySelector(\"\
    input[type=text]\").value\n```\n\n在这里，我们在投资组合行内部搜索以获取文本类型的输入元素，该元素包含特定货币的金额。\n\
