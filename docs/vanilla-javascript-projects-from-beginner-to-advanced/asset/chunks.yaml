    # Proposed Solution\n\nWe will use `QUnit` (`https://qunitjs.com/`), a very simple\
    \ testing framework, that can be employed to test JavaScript code on the client-side\
    \ (i.e. web browser), as well as on the server-side (i.e. Node.js). It is very\
    \ easy to use `QUnit`; it requires minimal configuration for testing browser-based\
    \ projects, as in our case.\n\nFirst of all, we should note that, in order to\
    \ facilitate Unit Testing, we have broken the original JavaScript file (`script.js`)\
    \ into three files:\n\n* `helpers.js` (the helper functions)\n* `logic.js` (the\
    \ business logic)\n* `ui.js` (the UI code and the event handlers)\n\nWe have also\
    \ updated the `index.html` file to load all three files:\n\n```html\n<script src=\"\
    helpers.js\" type=\"text/javascript\"></script>\n<script src=\"logic.js\" type=\"\
    text/javascript\"></script>\n<script src=\"ui.js\" type=\"text/javascript\"></script>\n\
    ```\nListing 13‑1: `index.html`\n\nThe order that those scripts are loaded is\
    \ important. First, we load the helper functions, since they are used in the other\
    \ two files. Then we load the business logic, and at the end we load the UI code.\
    \ If we did not load the helper functions at the start, those functions would\
    \ not be available when loading the other two scripts, as the scripts are loaded\
    \ sequentially.\n\nWe will use `QUnit` to unit test the former two files. The\
    \ UI code can be tested in Functional and End-To-End tests, where we test the\
    \ web application as a whole, using testing frameworks like Selenium, Cypress\
    \ or Playright.\n\nIn order to use `QUnit`, we have to create a new HTML file\
    \ that will load the `QUnit` framework as well as the code to test:\n\n```html\n\
    <!DOCTYPE html>\n<meta charset=\"utf-8\">\n<title>QUnit Test Suite</title>\n<link\
    \ rel=\"stylesheet\" href=\"https://code.jquery.com/qunit/qunit-2.20.0.css\">\n\
    <body>\n  <div id=\"qunit\"></div>\n  <div id=\"qunit-fixture\"></div>\n  <script\
    \ src=\"https://code.jquery.com/qunit/qunit-2.20.0.js\"></script>\n  <script src=\"\
    helpers.js\" type=\"text/javascript\"></script>\n  <script src=\"logic.js\" type=\"\
    text/javascript\"></script>\n  <script src=\"tests.js\" type=\"text/javascript\"\
    ></script>\n</body>\n```\nListing 13‑2: `test_qunit.html`\n\nWe can run our tests\
