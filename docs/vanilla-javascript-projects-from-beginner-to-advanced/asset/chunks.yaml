    \ instance, the  <header> element has the following classes:\n\n<header class=\"\
    bg-info text-black p-4 m-4\">\n\nThe applied classes define the following styling:\n\
    \n*   background: “info” (light blue)\n\n*   text: black\n\n*   padding: size\
    \ 4\n\n*   margin: size 4\n\nNow, let’s examine the JS file:\n\n| const formEl\
    \ = document.getElementById(\"form\");const itemsEl = document.getElementById(\"\
    items\");const textEl = document.getElementById(\"text\");const handleSubmit =\
    \ (e) => {//create new <li> elementconst item = document.createElement(\"li\"\
