    \ We should create a folder in our drive where we will place all our code. Then\
    \ we can select Open Folder from the File menu to open the specific folder. The\
    \ files contained in this folder will all be part of the project.\n\n# Running\n\
    \nFor simple web pages, it is sufficient to double-click on the HTML file to run\
    \ it. The web page will open in the default web browser, and it will be ready\
    \ to play with. We can also install the Live Server extension for VS Code, that\
    \ runs a small web server inside VS Code. When we will learn about webpack and\
    \ vite, we will use their own servers for development.\n\nFor each project, there\
    \ will be exact instructions on how to run it.\n\n# Debugging\n\nIn order to debug\
    \ a web page, we can use the Web Development Tools that are available on the browser.\
    \ On both Google Chrome and Mozilla Firefox, we can bring forward those tools\
    \ with Ctrl+Shift+i.\n\nWe can do many things with the Developer tools:\n\n* \
    \  we can view the structure of the HTML file and the CSS properties (Elements\
    \ tab)\n\n*   we can see the messages in the console (Console tab)\n\n*   we can\
    \ see the JavaScript code and we can also debug it (Sources tab)\n\n*   we can\
    \ see the network requests and their contents (Network tab)\n\n*   and many more\n\
    \nFrom the Source tab, we can set breakpoints in the JavaScript code. The execution\
    \ of the code will stop at those points, and then we can see the current values\
    \ of the variables. We can also run the code step by step, by selecting Step Over\
    \ (F10). We can also enter inside a function with Step Into (F11). Finally, we\
    \ can continue with the execution of the code (until the next breakpoint) with\
    \ Resume Execution (F8).\n\n![](image_rsrcBR3.jpg)\n\n2.        Temperature Conversion\n\
    \nFor our first project, let’s create a simple web application that converts temperatures\
    \ from Celsius to Fahrenheit degrees and vice versa:\n\n# ![](image_rsrcBR4.jpg)\n\
    \n# Concepts covered\n\n*   Click event handling\n\n*   Number parsing and checking\n\
    \n*   CSS styling (Flex)\n\n# Proposed Solution\n\nWe will begin by creating an\
    \ HTML file in our folder. In this book, we will follow the convention of naming\
    \ the main HTML files of the web application as index.html.\n\n| <!DOCTYPE html><html><head><title>Temperature\
    \ conversions</title><link href=\"style.css\" rel=\"stylesheet\"></head><body><div\
    \ class=\"container\"><h1>Temperature conversions</h1><label class=\"item\" for=\"\
    celsius\">Celsius:</label><input class=\"item\" type=\"text\" id=\"celsius\"/><label\
    \ class=\"item\" for=\"fahrenheit\">Farhenheit:</label><input class=\"item\" type=\"\
    text\" id=\"fahrenheit\"/><button type=\"button\" class=\"item\" id=\"c2f\"onclick=\"\
    c2f()\">Convert to Fahrenheit</button><button type=\"button\" class=\"item\" id=\"\
    f2c\"onclick=\"f2c()\">Convert to Celsius</button></div><script src=\"script.js\"\
    \ type=\"text/javascript\"></script></body></html> |\n\nListing 2‑1: index.html\n\
    \nOur application consists of two text boxes (with IDs:  celsius and  fahrenheit)\
    \ and two buttons (with IDs:  c2f and  f2c). We will handle the  click event on\
    \ both buttons by setting the  onclick attribute to the corresponding handler\
    \ function:\n\n<button type=\"button\" class=\"item\" id=\"c2f\"\n\nonclick=\"\
    c2f()\">Convert to Fahrenheit</button>\n\n<button type=\"button\" class=\"item\"\
    \ id=\"f2c\"\n\nonclick=\"f2c()\">Convert to Celsius</button>  \n\nWe will implement\
    \ the two handler functions in a separate JavaScript file (named script.js). The\
    \ JavaScript file will be declared in our HTML file with the following tag:\n\n\
    <script src=\"script.js\" type=\"text/javascript\"></script>\n\nNow, let’s create\
    \ the script.js file in the same folder as the HTML file:\n\n| function f2c(){//get\
    \ access to the text box elementsconst celsiusEl = document.getElementById(\"\
    celsius\");const fahrenheitEl = document.getElementById(\"fahrenheit\");//parse\
    \ text into numberconst fahrenheit = parseFloat(fahrenheitEl.value);//check if\
    \ parsed value is indeed a numberif(isNaN(fahrenheit)){alert(\"The Fahrenheit\
    \ value is not correct\");celsiusEl.value = \"\";}else{const celsius = (fahrenheit\
    \ - 32) * 5 / 9;//write the result into the celsius text boxcelsiusEl.value =\
    \ celsius.toFixed(2);  }}function c2f(){//get access to the text box elementsconst\
    \ celsiusEl = document.getElementById(\"celsius\"); \n\nconst fahrenheitEl = document.getElementById(\"\
    fahrenheit\");\n\n//parse text into numberconst celsius = parseFloat(celsiusEl.value);//check\
    \ if parsed value is indeed a numberif(isNaN(celsius)){    alert(\"The Celsius\
    \ value is not correct\");fahrenheitEl.value = \"\";}  else{const fahrenheit =\
    \ (celsius * 9 / 5) + 32;//write the result into the fahrenheit text boxfahrenheitEl.value\
    \ = fahrenheit.toFixed(2);}} |\n\nListing 2‑2: script.js\n\nBoth functions operate\
    \ in a similar manner; first, we obtain the reference to both text input elements\
    \ (via  getElementById() function). In this way, we will be able to get access\
    \ to what the user has typed inside the text boxes, via the  .value property of\
    \ each element.\n\nWe should note that the  value property is a  string value.\
    \ Therefore, we have to parse the value typed by the user, in order to get the\
    \ actual numeric value for our calculations. The  parseFloat() function will start\
    \ from the beginning of the string value and will parse all numeric characters\
    \ until a non-numeric character is found. Example conversions:\n\n“1234x”  → 1234\n\
    \n“1234x567”  → 1234\n\n“x1234”  → NaN\n\nThe term NaN means Not a Number; it’s\
    \ a way of specifying that the value is not a number. We can check whether a variable\
    \ is a number or not with the  isNaN() function.\n\nIn the case where the user\
    \ has typed a non-numeric string, then an alert will be presented, and the result\
    \ text box will be left blank. If a numeric string is provided, then we proceed\
    \ with the calculation, and the result is presented by setting the  value property\
    \ of the corresponding text box. The  toFixed(2) function provides a string representation\
    \ of the number with two decimal points.\n\nFinally, let’s have a look at the\
    \ CSS file (style.css):\n\n| .container{width: 300px;/* this is a flex container*/display:\
    \ flex;/* items should be placed in a column */flex-direction: column;/* a gap\
    \ between items */gap: 10px;}.item{width: 100%;}h1{ \n\nfont-size: 1.5em;\n\n\
    } |\n\nListing 2‑3: style.css"
