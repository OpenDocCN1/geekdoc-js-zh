  trans: "\n\n```javascript\n// 检查它将被放置在目标元素之前还是之后\n\nif (e.target !== draggedItem\
    \ && e.target.classList.contains('list-group-item')) {\n    // 获取被拖拽项目上方列表项的 id\n\
    \    let targetId = parseInt(e.target.getAttribute(\"data-id\"));\n    // 从数组中移除被拖拽项目的\
    \ id\n    let taskText = tasks.splice(draggedItemID, 1);\n    if (e.clientY >\
    \ e.target.getBoundingClientRect().top + (e.target.offsetHeight / 2)) {\n    \
    \    if (targetId < draggedItemID) {\n            // 在插入被拖拽项目时创建新的任务数组\n     \
    \       tasks = [...tasks.slice(0, targetId + 1), taskText[0], ...tasks.slice(targetId\
    \ + 1)];\n        } else {\n            tasks = [...tasks.slice(0, targetId),\
    \ taskText[0], ...tasks.slice(targetId)];\n        }\n    } else {\n        if\
    \ (targetId < draggedItemID) {\n            tasks = [...tasks.slice(0, targetId),\
    \ taskText[0], ...tasks.slice(targetId)];\n        } else {\n            tasks\
    \ = [...tasks.slice(0, targetId - 1), taskText[0], ...tasks.slice(targetId - 1)];\n\
    \        }\n    }\n    renderList();\n    // 在本地存储中替换修改后的数组\n    localStorage.setItem(\"\
    tasks\", JSON.stringify(tasks));\n    draggedItem = null;\n}\nconst handleSubmit\
    \ = (e) => {\n    e.preventDefault();\n    // 将任务文本插入数组\n    tasks.push(text.value);\n\
    \    renderList();\n    // 在本地存储中替换修改后的数组\n    localStorage.setItem(\"tasks\"\
    , JSON.stringify(tasks));\n    // 清空文本框\n    text.value = '';\n};\n// 绑定事件监听器\n\
    itemsEl.addEventListener(\"dragstart\", handleDragStart);\nitemsEl.addEventListener(\"\
    dragover\", handleDragOver);\nitemsEl.addEventListener(\"drop\", handleDrop);\n\
    \nformEl.addEventListener(\"submit\", handleSubmit);\n// 初始化任务\ntasks = JSON.parse(localStorage.getItem(\"\
    tasks\"));\nif (tasks == undefined)\n    tasks = [];\nelse\n    renderList();\n\
    ```\n\n代码列表 9-2: script.js\n\n首先，我们应该提到，我们正在使用一个名为 `tasks` 的 JS 数组来存储待办事项字符串。让我们将代码拆解为各个函数：\n\
    \n# renderList\n\n`renderList()` 函数遍历 `tasks` 数组并构建无序列表。该代码与之前的版本几乎相同。然而，请注意，我们在每个列表项元素上应用了一个自定义属性（称为\
    \ `data-id`）。该属性将存储该项目在 `tasks` 列表中的索引号。\n\n# deleteTodo\n\n此函数在点击删除按钮时被调用。它不是通过移除列表项元素来执行\
    \ DOM 操作，而是使用 `splice()` 从 `tasks` 数组中移除相应的字符串。接下来，使用新修改的 `tasks` 数组重新渲染整个待办事项列表。\n\
    \n最后，修改后的 `tasks` 数组存储在 `localStorage` 中。为了实现这一点，我们使用 `JSON.stringify()` 函数来获取\
    \ JS 数组的 JSON 字符串表示。\n\n# handleDragStart\n\n当拖放开始时，我们也会保留被拖拽项目的 ID。我们从列表元素的 `data-id`\
    \ 自定义属性中获取此 ID。\n\n# handleDragOver\n\n此函数保持不变。\n\n# handleDrop\n\n当用户将项目放到列表中的新位置时，我们首先获取被拖拽项目落下位置元素的\
    \ ID。然后，我们从 `tasks` 数组中删除被拖拽的项目。\n\n接下来，我们使用展开运算符（`…`）创建一个新的 `tasks` 数组（替换现有）。有多种情况，取决于被拖拽项目落的位置（即列表项的上部还是下部）。\n\
    \n最后，我们通过调用 `render()` 重新渲染待办事项列表，并将修改后的数组存储在 `localStorage` 中。\n\n# handleSubmit\n\
    \n`handleSubmit()` 函数将新的待办文本推入 `tasks` 数组并调用 `render()`。它还会清空文本框。\n\n除了函数之外，我们还添加了必要的事件监听器，并在应用程序启动时检查\
    \ `localStorage` 中是否存在待办事项列表。如果是，我们解析存储的 JSON 字符串并赋值给 `tasks` 数组。如果没有任何列表，`tasks`\
    \ 变量初始化为空数组。最后，首次调用 `render()` 以在 HTML 中创建无序列表。\n\n你可以在 GitHub 上找到此项目：\n\n[`github.com/htset/vanilla_javascript_projects/tree/main/todo3`](https://github.com/htset/vanilla_javascript_projects/tree/main/todo3)\n\
    \n# 10. 表单验证\n\n在这个项目中，我们将创建一个详细的注册表单，并使用 JavaScript 执行客户端验证。\n\n表单内容应遵循以下规则：\n\
    \n*   所有数据都应输入，地址字段除外。但是，如果输入的州是科罗拉多州（Colorado），则地址也应该填写。\n*   邮政应仅由 5 个数字组成\n\
    *   用户应输入有效的电子邮件 (`xxx@xxx.xx`)\n*   电话号码格式应为 (123)456-7890、`1234567890` 或 123-456-7890\n\
    *   用户应接受服务条款\n\n点击提交按钮时，验证结果将以红色显示在元素旁。\n\n# 涵盖的概念\n\n表单处理与验证\n\n# 解决方案\n\n（注：此处\
    \ HTML 代码块不完整，已根据提供的内容进行处理）\n\n"
- fmt: "\n```html\nintegrity=\"sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4\"\
    \ncrossorigin=\"anonymous\"></script><script src=\"script.js\" type=\"text/javascript\"\
    ></script></body></html>\n```\n\n**Listing 10-1: index.html**\n\nOur registration\
    \ form contains a variety of elements:\n\n* Text boxes\n* Password text boxes\n\
    * Check boxes\n* Radio boxes\n* Drop-down list\n* Text area\n* Submit button\n\
    \nMoreover, next to each element there is a `<span>` element that will contain\
    \ the respective error message. We apply the `error` class to these elements.\n\
    \nApart from that, the HTML is pretty straightforward, so we will proceed to the\
    \ JavaScript file:\n\n```javascript\nconst fname = document.getElementById(\"\
    fname\");\nconst lname = document.getElementById(\"lname\");\nconst gender = document.getElementsByName(\"\
    gender\");\nconst zip = document.getElementById(\"zip\");\nconst state = document.getElementById(\"\
    state\");\nconst address = document.getElementById(\"address\");\nconst email\
    \ = document.getElementById(\"email\");\nconst phone = document.getElementById(\"\
    phone\");\nconst checks = document.getElementsByName(\"checks\");\nconst password\
    \ = document.getElementById(\"password\");\nconst confirm = document.getElementById(\"\
    confirm\");\nconst comments = document.getElementById(\"comments\");\nconst fnameError\
    \ = document.getElementById(\"fnameError\");\nconst lnameError = document.getElementById(\"\
    lnameError\");\nconst genderError = document.getElementsByName(\"genderError\"\
    );\nconst zipError = document.getElementById(\"zipError\");\nconst stateError\
    \ = document.getElementById(\"stateError\");\nconst addressError = document.getElementById(\"\
    addressError\");\nconst emailError = document.getElementById(\"emailError\");\n\
    const phoneError = document.getElementById(\"phoneError\");\nconst checksError\
    \ = document.getElementsByName(\"checksError\");\nconst passwordError = document.getElementById(\"\
    passwordError\");\nconst confirmError = document.getElementById(\"confirmError\"\
    );\nconst errorSpans = document.getElementsByClassName(\"error\");\n\nconst validate\
    \ = function() {\n    let result = true;\n    // remove previous errors\n    for(let\
    \ i=0; i<errorSpans.length; i++){\n    errorSpans[i].innerHTML = \"\";\n    }\n\
    \    if(fname.value == \"\"){\n        fnameError.innerHTML = \"First name is\
    \ required\";\n        result = false;\n    }\n    if(lname.value == \"\"){\n\
    \        lnameError.innerHTML = \"Last name is required\";\n        result = false;\n\
    \    }\n    let found = false;\n    for (let i = 0; i < gender.length; i++) {\n\
    \        if (gender[i].checked === true)found = true;\n    }\n    if(!found){\n\
    \        genderError.innerHTML = \"Gender is required\";\n        result = false;\n\
    \    }\n    if (zip.value == \"\") {\n        zipError.innerHTML = \"ZIP is required\"\
    ;\n        result = false;\n    } else if (zip.value.length != 5 || isNaN(zip.value))\
    \ {\n        zipError.innerHTML = \"ZIP is not correct\";\n        result = false;\n\
    \    }\n    if (state.value === \"CO\") {\n        if(address.value == \"\"){\n\
    \            addressError.innerHTML = \"Address is required for Colorado\";\n\
    \            result = false;\n        }\n    }\n    const emailRegex = /^(([^<>()[\\\
    ]\\\\.,;:\\s@\"]+(\\.[^<>()[\\]\\\\.,;:\\s@\"]+)*)|.(\".+\"))@((\\[[0-9]{1,3}\\\
    .[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\])|(([a-zA-Z\\-0-9]+\\.)+[a-zA-Z]{2,}))$/;\n\
    \    if (!email.value.match(emailRegex)){\n        emailError.innerHTML = \"Email\
    \ is not correct\";\n        result = false;\n    }\n    const phoneRegex = /^\\\
    (?(\\d{3})\\)?[- ]?(\\d{3})[- ]?(\\d{4})$/;\n    if (!phone.value.match(phoneRegex)){\n\
    \        phoneError.innerHTML = \"Phone formats: (123)456-7890, 1234567890 or\
    \ 123-456-7890\";\n        result = false;\n    }\n    if(checks[0].checked ===\
    \ false){\n        acceptError.innerHTML = \"You should agree to the terms\";\n\
    \        result = false;\n    }\n    if(password.value.length < 8){\n        passwordError.innerHTML\
    \ = \"Password should contain at least 8 characters\";\n        result = false;\n\
    \    }\n    if(confirm.value !== password.value){\n        confirmError.innerHTML\
    \ = \"Password and Confirm Password do not match\";\n        result = false;\n\
    \    }\n    return result;\n}\n```\n\n**Listing 10-2: script.js**\n\nAt the start\
    \ of the file, we get the references to all the elements in the HTML file. We\
    \ also get an array of all the error elements, which we will use to loop through\
    \ and empty the previous error messages:\n\n```javascript\nconst errorSpans =\
    \ document.getElementsByClassName(\"error\");\n```\n\nThe only function is `validate()`;\
    \ it is called when the user presses the submit button. Note the form definition\
    \ in the HTML file:\n\n```html\n<form onsubmit=\"return validate();\">\n```\n\n\
    We use this syntax so that we can prevent the submission of the form, if the `validate()`\
    \ function returns `false`.\n\nFirst of all, we empty the error spans from the\
    \ previous validation, if any:\n\n```javascript\nfor(let i=0; i<errorSpans.length;\
    \ i++){\n    errorSpans[i].innerHTML = \"\";\n}\n```\n\nThen, we check whether\
    \ the text element for the first name is empty:\n\n```javascript\nif(fname.value\
    \ == \"\"){\n    fnameError.innerHTML = \"First name is required\";\n    result\
    \ = false;\n}\n```\n\nNote the use of the `result` variable. At first it is `true`.\n\
    \nNext, we check whether the radio button is checked by getting all radio buttons\
    \ with their name:\n\n```javascript\nconst gender = document.getElementsByName(\"\
    gender\");\nlet found = false;\nfor (let i = 0; i < gender.length; i++) {\n  \
    \  if (gender[i].checked === true)found = true;\n}\nif(!found){\n    genderError.innerHTML\
    \ = \"Gender is required\";\n    result = false;\n}\n```\n\nWe also check whether\
    \ the ZIP value is not empty and that it is a string of 5 digits:\n\n```javascript\n\
    if (zip.value == \"\") {\n    zipError.innerHTML = \"ZIP is required\";\n    result\
    \ = false;\n} else if (zip.value.length != 5 || isNaN(zip.value)) {\n    zipError.innerHTML\
    \ = \"ZIP is not correct\";\n    result = false;\n}\n```\n\nWe use `isNaN()` function\
    \ to test whether the string contains only numbers. Then, we check the state value:\n\
    \n```javascript\nif (state.value === \"CO\") {\n    if(address.value == \"\"){\n\
    \        addressError.innerHTML = \"Address is required for Colorado\";\n    \
    \    result = false;\n    }\n}\n```\n\nFor the email and phone validation we will\
    \ use regular expressions (regex):\n\n```javascript\nconst emailRegex = /^(([^<>()[\\\
    ]\\\\.,;:\\s@\"]+(\\.[^<>()[\\]\\\\.,;:\\s@\"]+)*)|.(\".+\"))@((\\[[0-9]{1,3}\\\
    .[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\])|(([a-zA-Z\\-0-9]+\\.)+[a-zA-Z]{2,}))$/;\n\
    if (!email.value.match(emailRegex)){\n    emailError.innerHTML = \"Email is not\
    \ correct\";\n    result = false;\n}\n\nconst phoneRegex = /^\\(?(\\d{3})\\)?[-\
    \ ]?(\\d{3})[- ]?(\\d{4})$/;\nif (!phone.value.match(phoneRegex)){\n    phoneError.innerHTML\
    \ = \"Phone formats: (123)456-7890, 1234567890 or 123-456-7890\";\n    result\
    \ = false;\n}\n```\n\nWe get a reference to the check box elements on the page\
    \ through `getElementsByName()`. We only have to check the first one:\n\n```javascript\n\
    if(checks[0].checked === false){\n    acceptError.innerHTML = \"You should agree\
    \ to the terms\";\n    result = false;\n}\n```\n\nFinally, we check whether the\
    \ user has entered a preferred password, as well as whether the two passwords\
    \ match:\n\n```javascript\nif(password.value.length < 8){\n    passwordError.innerHTML\
    \ = \"Password should contain at least 8 characters\";\n    result = false;\n\
    }\nif(confirm.value !== password.value){\n    confirmError.innerHTML = \"Password\
    \ and Confirm Password do not match\";\n    result = false;\n}\n```\n"
