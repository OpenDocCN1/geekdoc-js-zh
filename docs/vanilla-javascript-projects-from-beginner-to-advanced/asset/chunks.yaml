  trans: "\n\n```javascript\nappointments: map,displayedDate: getDateOnly(d),selectedDesc:\
    \ \"\",selectedDate: getDateOnly(d),selectedTime: 10,selectedVisible: false};\n\
    let newState = updateAppointment(state, \"test\", d2, 7);\nassert.equal(newState.appointments.get(d2.toDateString()).get(7),\
    \ \"test\");\nassert.equal(newState.appointments.get(d.toDateString()).has(10),\
    \ false);\n```\nListing 13-5: `tests.js`\n\n在这里我们做了两个断言，一个用于测试新值是否已插入到 `appointments`\
    \ 列表中，另一个用于验证旧条目确实已从应用程序状态中删除。\n\n随后，我们测试 `deleteAppointment()` 函数。\n\n```javascript\n\
    QUnit.test('When deleting appointment - the appointment is removed', function(assert)\
    \ {\n  let d = new Date(2024, 1, 10);\n  let map = new Map();\n  let day = new\
    \ Map();\n  day.set(10, \"test\");\n  map.set(d.toDateString(), day);\n  let state\
    \ = {\n    appointments: map,\n    displayedDate: getDateOnly(d),\n    selectedDesc:\
    \ \"\",\n    selectedDate: getDateOnly(d),\n    selectedTime: 10,\n    selectedVisible:\
    \ false\n  };\n  let newState = deleteAppointment(state, d, 10);\n  assert.equal(newState.appointments.get(d.toDateString()).has(10),\
    \ false);\n});\n```\nListing 13-6: `tests.js`\n\n最后，我们测试 `selectSlot()` 函数：\n\n\
    ```javascript\nQUnit.test('When user clicks on an hour slot - the right panel\
    \ is updated', function(assert) {\n  let d = new Date(2024, 1, 10);\n  let map\
    \ = new Map();\n  let day = new Map();\n  day.set(10, \"test\");\n  map.set(d.toDateString(),\
    \ day);\n  let state = {\n    appointments: map,\n    displayedDate: getDateOnly(d),\n\
    \    selectedDesc: \"\",\n    selectedDate: getDateOnly(d),\n    selectedTime:\
    \ 8,\n    selectedVisible: false\n  };\n  let newState = selectSlot(state, 10);\n\
    \  assert.equal(newState.selectedDesc, \"test\");\n  assert.equal(areDatesEqual(newState.selectedDate,\
    \ getDateOnly(d)), true);\n  assert.equal(newState.selectedTime, 10);\n});\n```\n\
    Listing 13-7: `tests.js`\n\n所有的测试都遵循相同的模式：准备（Arrange）、执行（Act）和断言（Assert）（AAA）：首先我们准备应用程序状态，然后通过调用被测试的代码对其进行操作，最后对结果进行断言。\n\
    \n不言而喻，上述的单元测试是不够的；我们需要添加更多测试，以便确保我们的应用程序按照预期方式工作。这项任务留给读者完成。\n\n在下一个项目中，我们将使用\
    \ `Jest` 引入更高级的测试功能。\n\n你可以在 GitHub 上找到找到该项目：`https://github.com/htset/vanilla_javascript_projects/tree/main/appointments3`\n\
    \n# 14. 预约列表（版本 4）\n\n我们将重构整个 Web 应用，使其使用 `Webpack` 进行打包，使用 `Babel` 支持 ES6，并使用\
    \ `Jest` 进行测试。\n\n# 涵盖的概念\n\n*   ES6 模块\n*   `Webpack`\n*   `Babel`\n*   `Jest`\n\
    \n# 建议方案\n\n我们在上一个项目中创建的 Web 应用状态良好。我们已经将各种功能分离到不同的 JS 文件中，并引入了使用 `QUnit` 测试。然而，它没有利用\
    \ JavaScript 世界引入的现代技术。\n\n更具体地说，JS 代码的加载方式会导致全局对象的创建，从而污染了应用程序的命名空间。在使用多个库时，这可能会导致对象之间的冲突。我们可以通过创建\
    \ ES6 模块来解决这个问题，模块将包含我们的代码而不创建全局对象。\n\n此外，在我们当前的项目中，我们无法利用为 `Node.js` 开发的许多库。我们现在可以使用的只有那些可以通过浏览器链接加载的库（例如\
    \ `QUnit` 或 `Bootstrap`）。为了使用 `NPM` 库，我们需要使用像 `Webpack` 或 `Vite` 这样的构建工具。\n\n\
    通过使用 `Webpack`，我们可以将代码拆分为多个模块，而不会创建全局对象，也不必担心哪个文件先加载。此外，我们可以将这些 JS 文件打包成一个大文件，供用户的浏览器下载。\n\
    \n通过这种方式，我们还可以更高级的测试库，例如 `Jest`。\n\n# 部分 A – ES6 模块和 Webpack\n\n首先，我们必须在开发机器上安装\
    \ `Node.js`。我们可以在此处找到它：`https://nodejs.org/en`\n\n然后通过在命令提示符中输入命令开始项目初始化：\n\n\
    ```bash\nnpm init\n```\n\n这将创建一个新项目，由 `package.json` 文件定义。\n\n在向导中，我们提供以下答案：\n\
    \n*   包名：`appointments`\n*   入口点：`ui.js`\n*   测试命令：`jest`\n\n我们保持其他参数的默认设置。生成的\
    \ `package.json` 文件如下：\n\n```json\n{\"name\": \"appointments\",\"version\": \"\
    1.0.0\",\"description\": \"\",\"main\": \"ui.js\",\"scripts\": {\"test\": \"jest\"\
    }}\n```\nListing 14-1: `package.json`\n\n接下来，安装 `webpack` 的依赖：\n\n```bash\nnpm\
    \ install webpack-cli\n```\n\n此命令会安装 `webpack`、`webpack-cli` 和 `dev-server` 作为开发依赖。注意已创建\
    \ `node_modules` 文件夹。在 `package.json` 文件的 `scripts` 部分添加两个项，用于运行服务器和构建：\n\n```json\n\
    {\"name\": \"appointments\",\"version\": \"1.0.0\",\"description\": \"\",\"main\"\
    : \"ui.js\",\"scripts\": {\"build\": \"webpack\",\"start\": \"webpack serve\"\
    }}\n```\nListing 14-2: `package.json`\n\n运行 `start` 选项（npm start）会启动开发服务器并打开一个加载\
    \ `index.html` 的窗口。`build` 选项（npm run build）会创建生产就的 `bundle.js` 并将其存储在 `dist`\
    \ 文件夹中。\n\n接下来，我们在根目录下创建一个名为 `webpack.config.js` 的 Webpack 配置，内容如下：\n\n```javascript\n\
    const path = require('path');\nmodule.exports = {\n  \"mode\": \"development\"\
    ,\n  \"entry\": \"./src/ui.js\",\n  \"output\": {\n    \"path\": path.join(__dirname,\
    \ 'dist'),\n    \"filename\": \"bundle.js\"\n  },\n  \"devServer\": {\n    \"\
    static\": path.join(__dirname, 'public'),\n    \"devMiddleware\": {}\n  },\n \
    \ \"port\": 3000,\n  \"hot\": true\n};\n```\nListing 14-3: `webpack.config.js`\n\
    \n配置文件指定了入口文件（第一个运行的文件）是 `src` 文件夹中的 `ui.js`。它还指定所有 JS 文件将打包成 `dist` 文件夹中的 `bundle.js`\
    \ 文件。\n\n现在，我们应该创建这两个文件夹。我们还会创建一个文件夹（`public`），`index.html` 文件将存放在。\n\n```bash\n\
    mkdir src\nmkdir dist\nmkdir public\n```\n\n现在，我们将 `index.html` 文件移动到 `public`\
    \ 文件夹。我们将修改 `<script>` 元素，使其现在指向我们最终通过 webpack 创建的 JS 文件。\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <link href=\"\
    https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css\" rel=\"\
    stylesheet\" integrity=\"sha384-K3K2stSC2CC3h99233R9m999999996666Y\" crossorigin=\"\
    anonymous\">\n</head>\n<body>\n  <div class=\"container\">\n    <header id=\"\
    main-header\" class=\"bg-info text-black p-4 m-4\">\n      <div class=\"container\"\
    >\n        <h1 id=\"header-title\">Appointments</h1>\n      </div>\n    </header>\n\
    \    <div class=\"row\">\n      <div class=\"col-lg-6\">\n        <div class=\"\
    card card-body\">\n          <!-- Content -->\n        </div>\n      </div>\n\
    \    </div>\n  </div>\n  <script src=\"bundle.js\"></script>\n</body>\n</html>\n\
    ```\n\n"
- fmt: "\n## Appointment Form Structure\n\nThe provided HTML structure defines an\
    \ appointment form with fields for `Description`, `Date`, and `Time`, along with\
    \ `Save` and `Delete` buttons.\n\n### Listing 14‑4: tests.js\n\nWe also create\
    \ the 3 JS files into the `src` folder. We will have to refactor them so that\
    \ they are using ES6 modules:\n\n```javascript\n// ////////////////////////////////////////////////////////\
    \  Helper Functions \n\n/////////////////////////////////////////////////////\n\
    \n//helper function for date comparison\nexport const areDatesEqual = function\
    \ (date1, date2) {\n  if (date1.getFullYear() == date2.getFullYear() && date1.getMonth()\
    \ == date2.getMonth() && date1.getDate() == date2.getDate())\n    return true;\n\
    \  else\n    return false;\n}\nexport const getDateOnlyString = function (date)\
    \ {\n  return date.getFullYear() + \"-\" + (\"0\" + (date.getMonth() + 1)).slice(-2)\
    \ + \"-\" + (\"0\" + date.getDate()).slice(-2);\n}\nexport const getDateOnly =\
    \ function (date) {\n  return new Date(date.getFullYear() + \"-\" + (\"0\" + (date.getMonth()\
    \ + 1)).slice(-2) + \"-\" + (\"0\" + date.getDate()).slice(-2));\n}\n```\n\n###\
    \ Listing 14‑5: helpers.js\n\nIn the `helpers.js` file, we add the `export` keyword\
    \ in front of each function. This means that those functions will be available\
    \ for `import` from other JS files in our project.\n\nIndeed, in `logic.js`, we\
    \ start with importing those functions:\n\n```javascript\nimport {areDatesEqual,\
    \ getDateOnlyString, getDateOnly} from './helpers.js';\n```\n\n### Business Logic\n\
    \nThe following functions handle the core appointment logic:\n\n```javascript\n\
    // //////////////////////////////////////////////////  Business logic\n///////////////////////////////////////////////////////\n\
    //checks whether a time slot is already occupied\nexport const slotAlreadyTaken\
    \ = function (state, date, time) {\n  if (state.appointments.get(date.toDateString())\
    \ !== undefined && state.appointments.get(date.toDateString()).get(time) !== undefined)\n\
    \    return true;\n  else\n    return false;\n}\n//update appointment when user\
    \ presses save\nexport const updateAppointment = function (state, newDesc, newDate,\
    \ newTime) {\n  let newAppointments = new Map();\n  state.appointments.forEach((value,\
    \ key) => {\n    newAppointments.set(key, new Map());\n    state.appointments.get(key).forEach((v,\
    \ k) => {\n      if (!(state.selectedDate.toDateString() == key && state.selectedTime\
    \ == k)) {\n        newAppointments.get(key).set(k, state.appointments.get(key).get(k));\n\
    \      }\n    });\n  });\n\n  if (!newAppointments.has(newDate.toDateString()))\
    \ {\n    newAppointments.set(newDate.toDateString(), new Map());\n  }\n  newAppointments.get(newDate.toDateString()).set(newTime,\
    \ newDesc);\n  let newState = {\n    appointments: newAppointments,\n    displayedDate:\
    \ newDate,\n    selectedDesc: newDesc,\n    selectedDate: newDate,\n    selectedTime:\
    \ newTime,\n    selectedVisible: state.selectedVisible\n  };\n  return newState;\n\
    }\nexport const deleteAppointment = function (state, date, time) {\n  let newAppointments\
    \ = new Map();\n  state.appointments.forEach((value, key) => {\n    newAppointments.set(key,\
    \ new Map());\n    state.appointments.get(key).forEach((v, k) => {\n      if (!(date.toDateString()\
    \ == key && time == k)) {\n        newAppointments.get(key).set(k, state.appointments.get(key).get(k));\n\
    \      }\n    });\n  });\n\n  let newState = {\n    appointments: newAppointments,\n\
    \    displayedDate: state.displayedDate,\n    selectedDesc: \"\",\n    selectedDate:\
    \ state.selectedDate,\n    selectedTime: state.selectedTime,\n    selectedVisible:\
    \ state.selectedVisible\n  };\n  return newState;\n}\n//called when the user clicks\
    \ on a time slot\nexport const selectSlot = function (state, newTime) {\n  let\
    \ newDesc;\n  //get appmt description from Map and display it in text box\n  let\
    \ tmp = state.appointments.get(state.displayedDate.toDateString());\n  if (tmp\
    \ !== undefined) {\n    if (tmp.get(newTime) !== undefined) {\n      newDesc =\
    \ tmp.get(newTime);\n    } else {\n      newDesc = \"\";\n    }\n  } else {\n\
    \    newDesc = \"\";\n  }\n\n  let newState = {\n    appointments: state.appointments,\n\
    \    displayedDate: state.displayedDate,\n    selectedDesc: newDesc,\n    selectedDate:\
    \ state.displayedDate,\n    selectedTime: newTime,\n    selectedVisible: true\n\
    \  };\n  return newState;\n}\n//update the displayedDate variable\nexport const\
    \ updateDisplayedDate = function (state, newDate) {\n  let newDisplayedDate =\
    \ getDateOnly(newDate);\n  let newState = {\n    appointments: state.appointments,\n\
    \    displayedDate: newDisplayedDate,\n    selectedDesc: state.selectedDesc,\n\
    \    selectedDate: state.selectedDate,\n    selectedTime: state.selectedTime,\n\
    \    selectedVisible: false\n  };\n  return newState;\n}\n//increase/descrease\
    \ displayedDate\nexport const addDaysToDate = function (state, days) {\n  let\
    \ newDisplayedDate = state.displayedDate;\n  newDisplayedDate.setDate(state.displayedDate.getDate()\
    \ + days);\n\n  let newState = {\n    appointments: state.appointments,\n    displayedDate:\
    \ newDisplayedDate,\n    selectedDesc: state.selectedDesc,\n    selectedDate:\
    \ state.selectedDate,\n    selectedTime: state.selectedTime,\n    selectedVisible:\
    \ false\n  };\n  return newState;\n}\n```\n\n### Listing 14‑6: logic.js\n\nWe\
    \ also add the `export` keyword to the logic functions, as they will be used in\
    \ the `ui.js` file (but also from Jest later on).\n\nHere is the `ui.js` file,\
    \ with all the imports:\n\n```javascript\nimport {slotAlreadyTaken, updateAppointment,\
    \ deleteAppointment,selectSlot, updateDisplayedDate, addDaysToDate } from './logic.js';\n\
    import {areDatesEqual, getDateOnlyString, getDateOnly} from './helpers.js';\n\
    const displayedDateEl = document.getElementById(\"displayedDate\");\nconst previousDateEl\
    \ = document.getElementById(\"previousDate\");\nconst nextDateEl = document.getElementById(\"\
    nextDate\");\n\nconst gotoDateEl = document.getElementById(\"gotoDate\");\n\n\
    const appointmentFormEl = document.getElementById(\"appointmentForm\");\nconst\
    \ appointmentsListEl = document.getElementById(\"appointments\");\nconst appointmentDescEl\
    \ = document.getElementById(\"appointmentDesc\");\nconst appointmentDateEl = document.getElementById(\"\
    appointmentDate\");\nconst appointmentTimeEl = document.getElementById(\"appointmentTime\"\
    );\nconst saveEl = document.getElementById(\"save\");\nconst deleteEl = document.getElementById(\"\
    delete\");\n\n// //////////////////////////////////////////////////////////  UI\
    \ Functions\n///////////////////////////////////////////////////////\n//create\
    \ initial appointment list\nexport const createAppointmentList = function () {\n\
    \  for (let i = 0; i < 24; i++) {\n    //create <li> element\n    const item =\
    \ document.createElement(\"li\");\n    const textnode = document.createTextNode(i);\n\
    \    item.appendChild(textnode);\n    item.setAttribute(\"class\", \"list-group-item\"\
    );\n    item.setAttribute(\"id\", \"hour_\" + i);\n    item.addEventListener(\"\
    click\", handleClickOnHour);\n    appointmentsListEl.appendChild(item);\n    //create\
    \ <option> for hours <select> element\n    const option = document.createElement(\"\
    option\");\n\n    const textnode_option = document.createTextNode(i);\n  }\n}\n\
    ```\n"
