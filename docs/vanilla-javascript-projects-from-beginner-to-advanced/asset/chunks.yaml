    \ text boxtextEl.value = '';//prevent form submissione.preventDefault();}const\
    \ deleteTodo = (e) => {//find the parent element of the button (--> the <li> element)//and\
    \ remove it from the DOMe.target.parentElement.remove();}//attach event listenerformEl.addEventListener(\"\
    submit\", handleSubmit); |\n\nListing 7‑2: script.js\n\nAs we see at the bottom\
    \ of the file, when using forms, we should handle the  submit event. Therefore,\
    \ when the user presses the submit button, or presses the Enter button at the\
    \ keyboard, then function  handleSubmit() is called.\n\nHere, we use a different\
    \ way to declare a function, by using an arrow function. We can use the following\
    \ form:\n\nconst functionName = (arg1, arg2, ..) => { ...   };\n\nwhich is equivalent\
    \ to this:\n\nconst functionName = function(arg1, arg2, ..) { ...   };\n\nand\
    \ this:\n\nfunction functionName(arg1, arg2, ..) { ...   };\n\nIn  handleSubmit()\
    \ we first create a new list element(<li>) by using the  document.createElement()\
    \ function. Afterwards, we create a TextNode that will represent the internal\
    \ of the list element. We then append it in the list element.\n\nNext, we apply\
    \ two attributes on the list element: we set the  class and the  name of the element.\n\
    \nFurthermore, we create a button element, that will serve as the delete button.\
    \ We set the  innerHTML value to the text that should appear on the button and\
    \ we set the style of the button as  “float:right”.\n\nWhen the delete button\
    \ is pressed, the  deleteTodo() function should be invoked. This is performed\
    \ by adding an event listener on this element.\n\nThen, we append the button in\
    \ the list element, and we also append the resulting list element into the unordered\
    \ list.\n\nFinally, we call function  preventDefault() on the submit event that\
    \ was triggered; this will prevent the form from submitting to the server, in\
    \ case the  action attribute was set.\n\nNow, let’s have a look at the deleteTodo()\
    \ function. In this one-liner, we first get the element that triggered the event(e.target)\
    \ – i.e. the delete button – then we get its parent (e.target.parent) – i.e. the\
    \ list element – and then we remove the parent from its container – i.e. the list.\n\
    \nYou can find this project in GitHub:\n\n[https://github.com/htset/vanilla_javascript_projects/tree/main/todo1](https://github.com/htset/vanilla_javascript_projects/tree/main/todo1)\n\
    \n8.                       Todo List (version 2)\n\nWe will enhance the Todo List\
    \ application of the previous project, so that users will be able to rearrange\
    \ the items in the list using drag and drop.\n\n# Concepts covered\n\n*   Drag\
    \ and drop\n\n*   DOM manipulation\n\n# Proposed Solution\n\nThe index.html file\
    \ will remain unchanged:\n\n| <!DOCTYPE html><html lang=\"en\"><head><linkhref=\"\
