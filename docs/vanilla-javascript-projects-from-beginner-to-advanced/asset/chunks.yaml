    \ += scrollLength;elsesliderPos2 = 0;sliderTemp.style.transform = `translateX(${sliderPos2}px)`;}}const\
    \ createMovieIcon = (movie) => {const img = document.createElement(\"img\");img.src\
    \ = IMAGE_PATH + movie.backdrop_path;const description = document.createElement(\"\
