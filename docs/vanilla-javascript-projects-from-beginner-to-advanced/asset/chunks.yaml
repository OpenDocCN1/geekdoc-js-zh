    text/javascript\"></script>\n```\n列表 13‑1: `index.html`\n\n这些脚本的加载顺序很重要。首先，我们加载辅助函数，因为它们在另外两个文件中被使用。然后我们加载业务逻辑，最后加载\
    \ UI 代码。如果我们不在开始时加载辅助函数，那么在加载另外两个脚本时，这些函数将是不可用的，因为脚本是顺序加载的。\n\n我们将使用 `QUnit` 对前两个文件进行单元测试。UI\
    \ 代码可以在功能和端到端测试中进行，在这些测试中，我们使用 Selenium、Cypress 或 Playright 等测试框架对整个 Web 应用。为了使用\
    \ `QUnit`，我们必须创建一个新的 HTML 文件，加载 `QUnit` 框架以及要测试的代码：\n\n```html\n<!DOCTYPE html>\n\
