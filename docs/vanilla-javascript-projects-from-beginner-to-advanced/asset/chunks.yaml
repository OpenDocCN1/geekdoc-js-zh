  trans: "\n\n```javascript\nconst productsEl = document.querySelector('.products');\n\
    const spinnerEl = document.querySelector('.spinner-border');\nconst fetchProducts\
    \ = async (limit, skip) => {\n  const URL = `https://dummyjson.com/products/?limit=${limit}&skip=${skip}`;\n\
    \  const response = await fetch(URL);\n  if (!response.ok) {\n    throw new Error(`Error:\
    \ ${response.status}`);\n  }\n  return await response.json()\n}\n```\n列表 18‑2:\
    \ script.js\n\n这是一个 `async` 函数，因为它必须在 `fetch()` 操作上进行 `await`。我们的函数有两个参数，将实现分页功能：\n\
    \n- `limit`：将获取多少个项目\n- `skip`：从开始将跳过多少项目\n\n例如，使用 `limit=10` 和 `skip=50`，我们将从产品列表中的第\
    \ 51 个项目开始获取 10 个项目。\n\n接下来，我们定义了在页面上渲染产品信息的函数：\n\n```javascript\nconst renderProducts\
    \ = (products) => {\n  products.forEach(product => {\n    const productEl = document.createElement('div');\n\
    \    productEl.classList.add('card');\n    productEl.style = \"width: 25rem;\"\
    \n    productEl.innerHTML = `<img src=\"${product.thumbnail}\"class=\"card-img-top\
    \ img-thumbnail\" style=\"height:300px\"><div class=\"card-body\"><h5 class=\"\
    card-title\">${product.title}</h5><p class=\"card-text\">${product.description}</p>`;\n\
    \    productsEl.appendChild(productEl);\n  });\n};\n```\n列表 18‑3: script.js\n\n\
    对于返回的 JSON 数组中的每个产品，我们创建一个新的 `<div>` 元素，它具有 Bootstrap 卡样式类。在卡片内部，我们放置了产品的缩略图、标题和描述。图像直接从\
    \ DummyJSON 服务器加载；我们只需要输入 API 提供的 URL。最后，新的 `<div>` 元素被添加到产品列表 `<div>` 元素中。\n\n\
    接下来，我们创建了一个 `async` 函数来调用前面的两个函数，但只有当有更多产品需要获取时才调用：\n\n```javascript\nconst loadProducts\
    \ = async (page, limit) => {\n  showSpinner();\n  try {\n    if (skip < total\
    \ || total == 0) {\n      const response = await fetchProducts(page, limit);\n\
    \      renderProducts(response.products);\n      total = response.total;\n  }\n\
    \  } catch (error) {\n    console.log(error.message);\n  }\n  hideSpinner();\n\
    };\nconst hideSpinner = () => {\n  spinnerEl.style.visibility = \"hidden\";\n\
    };\nconst showSpinner = () => {\n  spinnerEl.style.visibility = \"visible\";\n\
    };\n```\n列表 18‑4: script.js\n\n来自 Web API 的响应包含 `total` 参数，表示可用产品的总数。我们将此值保存在本地变量\
    \ `total` 中，并将其与 `skip` 参数进行比较，以确认为是否还有剩余产品可以获取。该函数在获取操作开始时显示加载器 `<div>`，并在响应在网页中显示后将其隐藏。\n\
    \n接下来，我们有一个 `handleScroll()` 函数，它在触发 `scroll` 事件时被调用：\n\n```javascript\nconst\
    \ handleScroll = () => {\n  if (timerRunning) return;\n  timerRunning = true;\n\
    \  setTimeout(() => {\n    const docEl = document.documentElement;\n    if (docEl.scrollTop\
    \ + docEl.clientHeight >= docEl.scrollHeight - 10) {\n      skip += limit;\n \
    \     loadProducts(limit, skip);\n    }\n    timerRunning = false;\n  }, 1000);\n\
    };\nwindow.addEventListener('scroll', handleScroll);\n```\n列表 18‑5: script.js\n\
    \n当我们滚动页面时，滚动事件会被调用多次。为了避免过频繁调用 `loadProducts()` 函数，我们将使用 `setTimeout()` 函数添加一秒钟的延迟。当回调函数运行时，它将使用\
    \ `scrollTop`、`clientHeight` 和 `scrollHeight` 属性来判断判断是否应该获取下一批产品。我们使用 `timerRunning`\
    \ 布尔值来控制是调用还是跳过 `setTimeout()`。\n\n最后，我们初始化使用的参数，并加载列表中的第一批产品：\n\n```javascript\n\
    const limit = 12;\nlet total = 0;\nlet skip = 0;\nvar timerRunning;\nloadProducts(limit,\
    \ skip);\n```\n列表 18‑6: script.js\n\n你可以在 GitHub 上找到此项目：\n\n[`github.com/htset/vanilla_javascript_projects/tree/main/scroll`](https://github.com/htset/vanilla_javascript_projects/tree/main/scroll)\n\
    \n# 19. Netflix 克隆项目\n\n在本项目项目中，我们将尝试模拟 Netflix ([`www.netflix.com`](https://www.netflix.com))\
    \ 的用户界面。具体来说，我们将创建一系列电影图标，它们可以向左或向右滚动。此外，当鼠标悬停在图标上时，电影描述将平滑地弹出。\n\n![](img/image_rsrcBRJ.jpg)\n\
    \n# 涵盖的概念\n\n- CSS 过渡与变换\n- DOM 操作\n\n# 建议的解决方案\n\n我们将使用 The MovieDB ([`www.themoviedb.org`](https://www.themoviedb.org/))\
    \ 免费服务来获取电影海报和标题。成为该服务的成员后，我们可以获取 API 密钥用于 RESTful 请求。\n\n这是我们网页的 HTML 文件：\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"UTF-8\">\n  <title>My\
    \ Movies</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n  <script src=\"\
    https://kit.fontawesome.com/your-key.js\" crossorigin=\"anonymous\"></script>\n\
    </head>\n<body>\n  <div class=\"logo\">\n    <h1>Trending Now</h1>\n  </div>\n\
    \  <div class=\"container\">\n    <!-- Movies 将注入到此处 -->\n  </div>\n  <div id=\"\
    spinner\" class=\"spinner-border\" style=\"visibility: hidden;\"></</div>\n  <div\
    \ class=\"descr-buttons\">\n    <button id=\"prev\"><i class=\"fas fa-chevron-left\"\
    ></i></button>\n    <button id=\"next\"><i class=\"fas fa-chevron-right\"></i></button>\n\
    \  </div>\n  <script src=\"script.js\"></script>\n</body>\n</html>\n```\n列表 19‑1:\
    \ index.html\n\n我们的 HTML 包含两个 `<div>` 容器，一个用于热门电影，另一个用于高评分电影。我们使用 Font Awesome\
    \ 创建箭头。现在让我们来看 CSS：\n\n```css\n:root {\n  --icon-width: 250px;\n  --icon-height:\
    \ 200px;\n  --arrow-width: 50px;\n}\n\nbody {\n  background-color: black;\n  color:\
    \ white;\n  overflow: hidden; /* 隐藏滚动条 */\n}\n\n.logo {\n  width: var(--icon-width);\n\
