- fmt: "\nThen, we attach the event listeners to the scroll buttons and, finally,\
    \ we call function `fetchMovies()` twice, one for each URL. Since `fetchMovies()`\
    \ is asynchronous, and we are at the top level, we will use `then()` and `catch()`\
    \ to handle the `Promise`. Upon successful completion of the API request, we create\
    \ the movie items, and we append them to the respective slider.\n\nYou can find\
    \ this project in GitHub:\n[https://github.com/htset/vanilla_javascript_projects/tree/main/movies]\n\
    \n# 20. Book list with Node.js API\n\nSo far, we have worked with ther people’s\
    \ APIs. We can make our own API using Node.js with `Express` and `MongoDB`. We\
    \ will create a simple form that will be used to add and remove books from our\
    \ database.\n\n![](image_rsrcBRK.jpg)\n\n## Concepts covered\n\n* Node.js\n* RESTful\
    \ APIs\n* MongoDB & Mongoose\n\n# Proposed Solution\n\nOur project will consist\
    \ of two parts, a server-side with Node.js and a client-side with vanilla JavaScript.\
    \ The project will have the following file structure:\n\n```\nproject-root/\n\
    |-- src/\n|   |-- app.js\n|-- public/\n|   |-- index.html\n|   |-- style.css\n\
    |   |-- script.js\n|-- package.json\n|-- package-lock.json\n```\n\nIn the `src`\
    \ folder we will put file `app.js` with the server-side code. The `public` folder\
    \ will contain the `index.html` file along with the CSS file and the client-side\
    \ JavaScript code (`script.js`).\n\nWe will first create a new project:\n\n```bash\n\
    npm init\n```\n\nThen we will install the necessary libraries from NPM:\n\n```bash\n\
    npm install express body-parser mongoose --save\n```\n\nThe `package.json` file\
    \ that we will use will be like the following:\n\n```json\n{\"name\": \"api\"\
    ,\"version\": \"1.0.0\",\"description\":\",\"scripts\": {\"start\": \"node app\"\
    },\"author\":\"\",\"license\": \"ISC\",\"dependencies\": {\"body-parser\": \"\
    ^1.20.2\",\"express\": \"^4.18.2\",\"mongoose\": \"^8.1.1\"}}\n```\nListing 20‑1:\
    \ package.json\n\nNote that we have added a `start` script that will run the `app.js`\
    \ file with `Node`.\n\nWe will use a local instance of `MongoDB` ([https://www.mongodb.com/])\
    \ as our database. On top of `MongoDB`, we will use `Mongoose` ([https://mongoosejs.com/]),\
    \ a library that helps us model our application data by creating `schemas`. We\
    \ can use those `schemas` to perform validation, make queries on the database\
    \ and more.\n\nWe can use a tool like the MongoDBCompass to create a new database\
    \ (`books`) and a new collection inside the DB (`books`).\n\n# Server-side (Node.js)\n\
    \nOn the server-side, we will use the `Express` framework to build the RESTful\
    \ API with Node.js ([https://expressjs.com/]). `Express` makes our life easier\
    \ when we create web applications and APIs with Node.js.\n\nWe will start with\
    \ the server-side API code:\n\n```javascript\nconst express = require('express');\n\
    const bodyParser = require('body-parser');\nconst mongoose = require('mongoose');\n\
    const path = require('path');\nconst app = express();\nconst PORT = 3000;\napp.use(bodyParser.json());\n\
    // Serve static files from the public directory\napp.use(express.static(path.join(__dirname,\
    \ 'public')));\nmongoose.connect('mongodb://localhost:27017/books');\n// Define\
    \ a Book model\nconst Book = mongoose.model('Book', {\n    author: String,\n \
    \   title: String,\n    pages: Number\n});\n\n// GET all books\napp.get('/api/books',\
    \ async (req, res) => {\n    try {\n        const books = await Book.find();\n\
    \        console.log(books);\n        res.json(books);\n    } catch (error) {\n\
    \        res.status(500).json({ error: error.message });\n    }\n});\n// GET a\
    \ specific book by ID\napp.get('/api/books/:id', async (req, res) => {\n    try\
    \ {\n        const book = await Book.findById(req.params.id);\n        res.json(book);\n\
    \    } catch (error) {\n        res.status(404).json({ error: 'Book not found'\
    \ });\n    }\n});\n// POST a new book\napp.post('/api/books', async (req, res)\
    \ => {\n    const { author, title, pages } = req.body;\n    console.log(req.body);\n\
    \    try {\n        const newBook = new Book({ author, title, pages });\n    \
    \    await newBook.save();\n        console.log(newBook);\n        res.json(newBook);\n\
    \    } catch (error) {\n        res.status(400).json({ error: error.message });\n\
    \    }\n});\n// PUT/update a specific book by ID\napp.put('/api/books/:id', async\
    \ (req, res) => {\n    try {\n        const updatedBook = await Book.findByIdAndUpdate(req.params.id,\
    \ req.body, { new: true });\n        res.json(updatedBook);\n    } catch (error)\
    \ {\n        res.status(404).json({ error: 'Book not found' });\n    }\n});\n\
    // DELETE a specific book by ID\napp.delete('/api/books/:id', async (req, res)\
    \ => {\n    try {\n        const deletedBook = await Book.findByIdAndDelete(req.params.id);\n\
    \        if (!deletedBook) {\n            return res.status(404).json({ error:\
    \ 'Book not found' });\n        }\n        res.json(deletedBook);\n    } catch\
    \ (error) {\n        res.status(500).json({ error: error.message });\n    }\n\
    });\n// Catch-all route\napp.get('*', (req, res) => {\n    res.sendFile(path.join(__dirname,\
    \ 'index.html'));\n});\napp.listen(PORT, () => {\n    console.log(`Server running\
    \ on port ${PORT}`);\n});\n```\nListing 20‑2: app.js\n\n(Note: The provided text\
    \ contained significant repetition and fragmented code blocks at the end; the\
    \ above reconstructs the functional logic based on the provided snippets.)\n"
