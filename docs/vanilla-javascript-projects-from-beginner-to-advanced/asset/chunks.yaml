    \ folder will contain the index.html file along with the CSS file and the client-side\
    \ JavaScript code (script.js).\n\nWe will first create a new project:\n\nnpm init\n\
    \nThen we will install the necessary libraries from NPM:\n\nnpm install express\
    \ body-parser mongoose --save\n\nThe package.json file that we will use will be\
    \ like the following:\n\n| {\"name\": \"api\",\"version\": \"1.0.0\",\"description\"\
    : \"\",\"scripts\": {\"start\": \"node app\"},\"author\": \"\",\"license\": \"\
    ISC\",\"dependencies\": {\"body-parser\": \"^1.20.2\",\"express\": \"^4.18.2\"\
    ,\"mongoose\": \"^8.1.1\"}} |\n\nListing 20‑1: package.json\n\nNote that we have\
    \ added a start script that will run the app.js file with Node.\n\nWe will use\
    \ a local instance of MongoDB ([https://www.mongodb.com](https://www.mongodb.com/)\
    \ ) as our database. On top of MongoDB, we will use Mongoose ([https://mongoosejs.com](https://mongoosejs.com/)\
    \ ), a library that helps us model our application data by creating schemas. We\
    \ can use those schemas to perform validation, make queries on the database and\
    \ more.\n\nWe can use a tool like the MongoDBCompass to create new database (books)\
    \ and a new collection inside the DB (books).\n\n# Server-side (Node.js)\n\nOn\
    \ the server-side, we will use the Express framework to build the RESTful API\
    \ with Node.js ([https://expressjs.com](https://expressjs.com/) ). Express makes\
    \ our life easier when we create web applications and APIs with Node.js.\n\nWe\
    \ will start with the server-side API code:\n\n| const express = require('express');const\
    \ bodyParser = require('body-parser');const mongoose = require('mongoose');const\
    \ path = require('path');const app = express();const PORT = 3000;app.use(bodyParser.json());//\
    \ Serve static files from the public directoryapp.use(express.static(path.join(__dirname,\
    \ 'public')));mongoose.connect('mongodb://localhost:27017/books');// Define a\
    \ Book modelconst Book = mongoose.model('Book', {author: String,title: String,pages:\
    \ Number \n\n});\n\n// GET all booksapp.get('/api/books', async (req, res) =>\
    \ {try {const books = await Book.find();console.log(books);res.json(books);}catch\
    \ (error) {res.status(500).json({ error: error.message });}});// GET a specific\
    \ book by IDapp.get('/api/books/:id', async (req, res) => {try {const book = await\
    \ Book.findById(req.params.id);res.json(book);}catch (error) {res.status(404).json({\
    \ error: 'Book not found' });}});// POST a new bookapp.post('/api/books', async\
    \ (req, res) => {const { author, title, pages } = req.body;console.log(req.body);try\
    \ {const newBook = new Book({ author, title, pages });await newBook.save();\n\n\
    console.log(newBook);\n\nres.json(newBook);}catch (error) {res.status(400).json({\
    \ error: error.message });}});// PUT/update a specific book by IDapp.put('/api/books/:id',\
    \ async (req, res) => {try {const updatedBook = awaitBook.findByIdAndUpdate(req.params.id,\
    \ req.body, { new: true });res.json(updatedBook);}catch (error) {res.status(404).json({\
    \ error: 'Book not found' });}});// DELETE a specific book by IDapp.delete('/api/books/:id',\
    \ async (req, res) => {try {const deletedBook = await Book.findByIdAndDelete(req.params.id);if\
    \ (!deletedBook) {return res.status(404).json({ error: 'Book not found' });}res.json({\
    \ message: 'Book deleted successfully' });}catch (error) {res.status(500).json({\
    \ error: error.message });\n\n}  \n\n});// Catch-all route to serve index.html\
    \ for any other requestsapp.get('*', (req, res) => {res.sendFile(path.join(__dirname,\
    \ 'public', 'index.html'));});app.listen(PORT, () => {console.log(`Server is running\
    \ on port ${PORT}`);}); |\n\nListing 20‑2: app.js\n\nFirst of we create a new\
    \ instance of the Express middleware:\n\nconst app = express();\n\nThen we add\
    \ the body-parser middleware to Express. This will parse the incoming request\
    \ bodies before our handlers, available under the  req.body property.\n\napp.use(bodyParser.json());\n\
    \nThen, we specify that the static content (like our index.html file) will be\
    \ served from the public folder):\n\napp.use(express.static(path.join(__dirname,\
    \ 'public')));\n\nNext, we connect to MongoDB, and we create a Mongoose model\
    \ for the book objects:\n\nmongoose.connect('mongodb://localhost:27017/books');\n\
    \n// Define a Book model\n\nconst Book = mongoose.model('Book', {\n\nauthor: String,\n\
    \ntitle: String,\n\npages: Number\n\n});\n\nEvery book object will consist of\
    \ the book’s author, title and number of pages. With Mongoose we can also specify\
    \ the types of properties, something that can be used for validation.\n\nNext,\
    \ we define how the GET request should be handled:\n\n// GET all books\n\napp.get('/api/books',\
    \ async (req, res) => {\n\ntry {\n\nconst books = await Book.find();\n\nconsole.log(books);\n\
    \nres.json(books);\n\n}\n\ncatch (error) {\n\nres.status(500).json({ error: error.message\
    \ });\n\n}\n\n});\n\nMore specifically, the GET request to the  /api/books route\
    \ will be handled by the async arrow function defined here. In this function,\
    \ we use the Mongoose model to query the MongoDB database and get all the available\
    \ books. The resulting array sent to the client in an HTTP response containing\
    \ JSON in its body.\n\nNext, we have the route that request a book with a specific\
    \ ID:\n\n// GET a specific book by ID\n\napp.get('/api/books/:id', async (req,\
    \ res) => {\n\ntry {\n\nconst book = await Book.findById(req.params.id);\n\nres.json(book);\n\
    \n}\n\ncatch (error) {\n\nres.status(404).json({ error: 'Book not found' });\n\
    \n}\n\n});\n\nThe book ID is contained in the request parameters (req.params.id)\
    \ and is used by Mongoose to retrieve the requested book.\n\nThe POST request\
    \ is used to add new books in the database:\n\n// POST a new book\n\napp.post('/api/books',\
    \ async (req, res) => {\n\nconst { author, title, pages } = req.body;\n\nconsole.log(req.body);\n\
    \ntry {\n\nconst newBook = new Book({ author, title, pages });\n\nawait newBook.save();\n\
    \nconsole.log(newBook);\n\nres.json(newBook);\n\n}\n\ncatch (error) {\n\nres.status(400).json({\
    \ error: error.message });\n\n}\n\n});\n\nThe POST request should have the following\
    \ body structure (in JSON):\n\n{\n\n“author”: “Jules Verne”,\n\n“title”: “Twenty\
    \ Thousand Leagues Under the Seas”\n\n“pages”: 324\n\n}\n\nIn the handler function,\
    \ we retrieve the book properties from the request body, and we use them to create\
    \ a new book object with Mongoose. We then save the book in the database, and\
    \ we return the newly added book in the response body.\n\nThe PUT request is used\
    \ to update an existing book in the database.:\n\n// PUT/update a specific book\
    \ by ID\n\napp.put('/api/books/:id', async (req, res) => {\n\ntry {\n\nconst updatedBook\
    \ = await\n\nBook.findByIdAndUpdate(req.params.id, req.body, { new: true });\n\
    \nres.json(updatedBook);\n\n}\n\ncatch (error) {\n\nres.status(404).json({ error:\
    \ 'Book not found' });\n\n}\n\n});\n\nWe use the ID of the book passed in the\
    \ request parameters to find the selected book from the database and update it."
