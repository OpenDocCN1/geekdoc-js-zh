    ></div><div class=\"next2\"><i class=\"fa-solid fa-chevron-right\"></i></div></div><scriptsrc=\"\
    https://kit.fontawesome.com/cc55d42b25.js\"crossorigin=\"anonymous\"></script><script\
    \ src=\"script.js\" type=\"text/javascript\"></script></body></html> |\n\nListing\
    \ 19‑1:index.html\n\nOur HTML code features two containers, one for the currently\
