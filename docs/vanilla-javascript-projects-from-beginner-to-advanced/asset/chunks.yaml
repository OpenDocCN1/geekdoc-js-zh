    \ accordingly.\n\nFinally, let’s see the entry point, the app.js file:\n\n| const\
    \ users = [{ id: 1, name: 'John Doe', email: 'john@example.com' }, \n\n{ id: 2,\
    \ name: 'Jane Doe', email: 'jane@example.com' },\n\n{ id: 3, name: 'Bob Smith',\
    \ email: 'bob@example.com' },{ id: 4, name: 'Alice Johnson', email: 'alice@example.com'\
    \ },{ id: 5, name: 'Charlie Brown', email: 'charlie@example.com' },{ id: 6, name:\
    \ 'Eva Williams', email: 'eva@example.com' },{ id: 7, name: 'Michael Davis', email:\
    \ 'michael@example.com' },{ id: 8, name: 'Olivia Wilson', email: 'olivia@example.com'\
    \ },{ id: 9, name: 'James Miller', email: 'james@example.com' },{ id: 10, name:\
    \ 'Sophia Moore', email: 'sophia@example.com' },];const selectedUser = { id: 1,\
    \ name: 'John Doe', email: 'john@example.com' };const appComponent = AppComponent(users,\
    \ selectedUser);appComponent.render(); |\n\nListing 22‑5: app.js\n\nHere, we define\
    \ the list of users as an array, and we pass it as argument to the created  AppComponent()\
    \ function.\n\nAgain, this is a very simple example, mainly to show React uses\
    \ functions to create components and how the application state is passed from\
    \ parent to child, triggering rendering.\n\nYou can find this project in GitHub:\n\
    \n[https://github.com/htset/vanilla_javascript_projects/tree/main/reactClone](https://github.com/htset/vanilla_javascript_projects/tree/main/reactClone)\n\
    \n23.                       PacMan game\n\nIn this project, we will create a simplified\
    \ PacMan game.\n\n![](image_rsrcBRP.jpg)\n\n# Concepts covered\n\n*   Drawing\
    \ on <canvas>\n\n*   Game dynamics\n\n# Proposed Solution\n\nWe will start with\
    \ a simple HTML file:\n\n| <!DOCTYPE html><html lang=\"en\"><head><meta charset=\"\
    UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    ><style>canvas {border: 1px solid #000;}</style><title>Pacman Game</title></head><body><canvas\
    \ id=\"pacmanCanvas\" width=\"560\" height=\"640\"></canvas><script src=\"consts.js\"\
    ></script><script src=\"entity.js\"></script><script src=\"pacman.js\"></script><script\
    \ src=\"ghost.js\"></script><script src=\"game.js\"></script><script src=\"app.js\"\
    ></script></body></html> |\n\nListing 23‑1:index.html\n\nPacMan and the Ghosts\
    \ possess similar characteristics: the most important is their position in the\
    \ maze. Moreover, they both need to have access to the maze so that they can find\
    \ out where they can move to."
