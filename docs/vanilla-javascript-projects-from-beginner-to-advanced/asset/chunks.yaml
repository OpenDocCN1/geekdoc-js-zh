    \nThis function creates a new `<div>` that will be placed in the list of the portfolio\
    \ currencies. It then creates an `<input>` of type text, a `<select>` element,\
    \ and a `<button>`, that are all placed inside the aforementioned `<div>`. The\
    \ `<select>` element is filled with the supported currencies `<option>` elements,\
    \ while the button adds an event listener for the deletion of the row. The handler\
    \ function is defined inline:\n\n```javascript\ndeleteEl.addEventListener(\"click\"\
    , (e) => {\n  e.target.parentElement.parentElement.remove();\n});\n```\n\nWe get\
    \ the parent element (the `<div>` containing the specific line) of the parent\
    \ element (the `div` containing the button) of the button and we remove it from\
    \ the DOM.\n\nNext, we have the functions that calculate the portfolio:\n\n```javascript\n\
    const calculate = (num, selectedCurrency, baseCurrency, quotes) => {\n  if (selectedCurrency\
    \ !== baseCurrency) {\n    const rate = quotes.data[selectedCurrency];\n    return\
    \ num / rate;\n  }\n  return num;\n}\n\nNumber.prototype.round = function (places)\
    \ {\n  return +(Math.round(this + \"e+\" + places) + \"e-\" + places);\n}\n\n\
    const calculatePortfolio = () => {\n  if (supportedCurencies !== null) {\n   \
    \ //first get updated currency quotes\n    const baseCurrency = baseCurrencyEl.value;\n\
    \    fetchQuotes(baseCurrency).then((quotes) => {\n      if (quotes !== null)\
    \ {\n        const portfolioItemsEl = document.querySelectorAll(\".currency-row\"\
    );\n        let total = 0;\n        portfolioItemsEl.forEach((item) => {\n   \
    \       const amount = item.querySelector(\"input[type=text]\").value;\n     \
    \     const selectedCurrency = item.querySelectorAll('option:checked')[0].value;\n\
    \          let num = parseFloat(amount);\n          if (!isNaN(num)) {\n     \
    \       let calculatedAmount = calculate(num, selectedCurrency, baseCurrency,\
    \ quotes);\n            total += calculatedAmount.round(2);\n          }\n   \
    \     });\n        resultEl.innerHTML = total + \" \" + baseCurrency;\n      }\n\
    \    });\n  }\n}\n```\nListing 16-6: `script.js`\n\nThe `calculatePortfolio()`\
    \ function is called when the respective button is clicked. First it gets the\
    \ updated currency quotes for the selected base currency. Note the use of Promises\
    \ here (the `then()` function), since function `fetchQuotes()` is asynchronous.\n\
    \nInside the `then()` function of the Promise, i.e. when the Promise is resolved,\
    \ we add the code that will get all the rows of our portfolio and perform the\
    \ calculations.\n\nNote that in this project we are using an alternative way to\
    \ get the references to the DOM elements:\n\n*   `document.querySelector()`\n\
    *   `document.querySelectorAll()`\n\nIn both functions we can use a variety of\
    \ CSS selectors to get the object(s) we want. For example:\n\n```javascript\n\
    const amount = item.querySelector(\"input[type=text]\").value\n```\n\nHere, we\
    \ search inside a portfolio row to get the input element of type text, which contains\
    \ the amount of the specific currency.\n\nIn our code, we can use both types of\
    \ functions, either `querySelector`/`querySelectorAll`, or `getElementById`/`getElementsByClassName`\
    \ etc.; it depends on the occasion. In general, it is better to use `getElementById`\
    \ when we use an ID, and `querySelector`/`All` when using a class name.\n\nOne\
    \ significant difference between the two families is that `querySelectorAll` gives\
    \ us a static node list while `getElementsByClassName` gives us a live node list,\
    \ that gets updated when we add/remove elements from it.\n\nOne last note: we\
    \ create a function `round()` in the `Number` object prototype, that will round\
    \ the numbers correctly to a specific number of decimal places.\n\nFinally, here\
    \ is the startup code:\n\n```javascript\ncalculateEl.addEventListener(\"click\"\
    , calculatePortfolio)\naddEl.addEventListener(\"click\", addLine);\nlet supportedCurencies;\n\
    loadSupportedCurrencies().then(() => {\n  addLine();\n});\n```\nListing 16-7:\
    \ `script.js`\n\nYou can find this project: `https://github.com/vanilla_projects`\n\
