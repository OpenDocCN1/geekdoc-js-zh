    \ center;\n  justify-content: center;\n  width: 20px;\n  height: 20px;\n  border:\
    \ 2px solid white;\n  text-align: center;\n  font-size: 8px;\n  margin-right:\
    \ 5px;\n  border-radius: 100%;\n}\n```\n\nFinally, here is the styling for the\
