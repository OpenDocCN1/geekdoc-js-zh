    \      selectedDesc: \"\",\n      selectedDate: getDateOnly(d),\n      selectedTime:\
    \ 8,\n      selectedVisible: false\n    };\n    expect(slotAlreadyTaken(state,\
    \ d, 10)).toBeTruthy();\n  });\n  it(\"When appointment does not exist at specific\
    \ date and time - slotAlreadyTaken() returns false\", () => {\n    let d = new\
    \ Date(2024, 1, 10);\n    let map = new Map();\n    let day = new Map();\n   \
    \ day.set(10, \"test\");\n    map.set(d.toDateString(), day);\n    let state =\
    \ {\n      appointments: map,\n      displayedDate: getDateOnly(d),\n      selectedDesc:\
    \ \"\",\n      selectedDate: getDateOnly(d),\n      selectedTime: 8,\n      selectedVisible:\
    \ false\n    };\n    expect(slotAlreadyTaken(state, d, 10)).toBeFalsy();\n  });\n\
    });\n```\n"
