    \    rowEl.appendChild(divEl1);\n    rowEl.appendChild(divEl2);\n    rowEl.appendChild(divEl3);\n\
    \    currenciesEl.appendChild(rowEl);\n  }\n}\n```\n列表 16-5: `script.js`\n\n此函数创建了一个新的\
    \ `<div>`，它将被放置在投资组合货币列表中。然后，它创建了一个文本类型的 `<input>`、一个 `<select>` 元素和一个 `<button>`，它们都放置在上述\
