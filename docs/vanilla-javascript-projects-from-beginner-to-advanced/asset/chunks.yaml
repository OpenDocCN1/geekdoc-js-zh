  trans: "\n\n## 预约表单结构\n\n提供的 HTML 结构定义了一个预约表单，包含 `Description`（描述）、`Date`（日期）和 `Time`（时间）字段，以及\
    \ `Save`（保存）和 `Delete`（删除）按钮。\n\n### 列表 14‑4：tests.js\n\n我们将这三个 JS 文件创建在 `src`\
    \ 文件夹中。我们需要对它们进行重构，以便使用 ES6 模块：\n\n```javascript\n// ////////////////////////////////////////////////////////\
    \  辅助函数 \n\n/////////////////////////////////////////////////////\n\n// 用于比较日期的辅助函数\n\
    export const areDatesEqual = function (date1, date2) {\n  if (date1.getFullYear()\
    \ == date2.getFullYear() && date1.getMonth() == date2.getMonth() && date1.getDate()\
    \ == date2.getDate())\n    return true;\n  else\n    return false;\n}\nexport\
    \ const getDateOnlyString = function (date) {\n  return date.getFullYear() + \"\
    -\" + (\"0\" + (date.getMonth() + 1)).slice(-2) + \"-\" + (\"0\" + date.getDate()).slice(-2);\n\
    }\nexport const getDateOnly = function (date) {\n  return new Date(date.getFullYear()\
    \ + \"-\" + (\"0\" + (date.getMonth() + 1)).slice(-2) + \"-\" + (\"0\" + date.getDate()).slice(-2));\n\
    }\n```\n\n### 列表 14‑5：helpers.js\n\n在 `helpers.js` 文件中，我们在每个函数前面添加了 `export` 关键字。这意味着这些函数可以从项目中的其他\
    \ JS 文件进行 `import`。\n\n确实，在 `logic.js` 中，我们从导入这些函数开始的：\n\n```javascript\nimport\
    \ {areDatesEqual, getDateOnlyString, getDateOnly} from './helpers.js';\n```\n\n\
    ### 业务逻辑\n\n以下函数处理核心预约逻辑：\n\n```javascript\n// //////////////////////////////////////////////////\
    \  业务逻辑\n///////////////////////////////////////////////////////\n// 检查某个时间段是否已被占用\n\
    export const slotAlreadyTaken = function (state, date, time) {\n  if (state.appointments.get(date.toDateString())\
    \ !== undefined && state.appointments.get(date.toDateString()).get(time) !== undefined)\n\
    \    return true;\n  else\n    return false;\n}\n// 当用户点击保存时更新预约\nexport const\
    \ updateAppointment = function (state, newDesc, newDate, newTime) {\n  let newAppointments\
    \ = new Map();\n  state.appointments.forEach((value, key) => {\n    newAppointments.set(key,\
    \ new Map());\n    state.appointments.get(key).forEach((v, k) => {\n      if (!(state.selectedDate.toDateString()\
    \ == key && state.selectedTime == k)) {\n        newAppointments.get(key).set(k,\
    \ state.appointments.get(key).get(k));\n      }\n    });\n  });\n\n  if (!newAppointments.has(newDate.toDateString()))\
    \ {\n    newAppointments.set(newDate.toDateString(), new Map());\n  }\n  newAppointments.get(newDate.toDateString()).set(newTime,\
    \ newDesc);\n  let newState = {\n    appointments: newAppointments,\n    displayedDate:\
    \ newDate,\n    selectedDesc: newDesc,\n    selectedDate: newDate,\n    selectedTime:\
    \ newTime,\n    selectedVisible: state.selectedVisible\n  };\n  return newState;\n\
    }\nexport const deleteAppointment = function (state, date, time) {\n  let newAppointments\
    \ = new Map();\n  state.appointments.forEach((value, key) => {\n    newAppointments.set(key,\
    \ new Map());\n    state.appointments.get(key).forEach((v, k) => {\n      if (!(date.toDateString()\
    \ == key && time == k)) {\n        newAppointments.get(key).set(k, state.appointments.get(key).get(k));\n\
    \      }\n    });\n  });\n\n  let newState = {\n    appointments: newAppointments,\n\
    \    displayedDate: state.displayedDate,\n    selectedDesc: \"\",\n    selectedDate:\
    \ state.selectedDate,\n    selectedTime: state.selectedTime,\n    selectedVisible:\
    \ state.selectedVisible\n  };\n  return newState;\n}\n// 用户点击某个时间段时调用\nexport\
    \ const selectSlot = function (state, newTime) {\n  let newDesc;\n  // 从 Map 中获取预约描述并显示在文本框中\n\
    \  let tmp = state.appointments.get(state.displayedDate.toDateString());\n  if\
    \ (tmp !== undefined) {\n    if (tmp.get(newTime) !== undefined) {\n      newDesc\
    \ = tmp.get(newTime);\n    } else {\n      newDesc = \"\";\n    }\n  } else {\n\
    \    newDesc = \"\";\n  }\n\n  let newState = {\n    appointments: state.appointments,\n\
    \    displayedDate: state.displayedDate,\n    selectedDesc: newDesc,\n    selectedDate:\
    \ state.displayedDate,\n    selectedTime: newTime,\n    selectedVisible: true\n\
    \  };\n  return newState;\n}\n// 更新 displayedDate 变量\nexport const updateDisplayedDate\
    \ = function (state, newDate) {\n  let newDisplayedDate = getDateOnly(newDate);\n\
    \  let newState = {\n    appointments: state.appointments,\n    displayedDate:\
    \ newDisplayedDate,\n    selectedDesc: state.selectedDesc,\n    selectedDate:\
    \ state.selectedDate,\n    selectedTime: state.selectedTime,\n    selectedVisible:\
    \ false\n  };\n  return newState;\n}\n// 增加/减少 displayedDate\nexport const addDaysToDate\
    \ = function (state, days) {\n  let newDisplayedDate = state.displayedDate;\n\
    \  newDisplayedDate.setDate(state.displayedDate.getDate() + days);\n\n  let newState\
    \ = {\n    appointments: state.appointments,\n    displayedDate: newDisplayedDate,\n\
    \    selectedDesc: state.selectedDesc,\n    selectedDate: state.selectedDate,\n\
    \    selectedTime: state.selectedTime,\n    selectedVisible: false\n  };\n  return\
    \ newState;\n}\n```\n\n### 列表 14‑6：logic.js\n\n我们为逻辑函数添加了 `export` 关键字，因为它们将在\
    \ `ui.js` 文件中使用（之后用于 Jest）。\n\n以下是包含所有导入的 `ui.js` 文件：\n\n```javascript\nimport\
    \ {slotAlreadyTaken, updateAppointment, deleteAppointment,selectSlot, updateDisplayedDate,\
    \ addDaysToDate } from './logic.js';\nimport {areDatesEqual, getDateOnlyString,\
    \ getDateOnly} from './helpers.js';\nconst displayedDateEl = document.getElementById(\"\
    displayedDate\");\nconst previousDateEl = document.getElementById(\"previousDate\"\
    );\nconst nextDateEl = document.getElementById(\"nextDate\");\n\nconst gotoDateEl\
    \ = document.getElementById(\"gotoDate\");\n\nconst appointmentFormEl = document.getElementById(\"\
    appointmentForm\");\nconst appointmentsListEl = document.getElementById(\"appointments\"\
    );\nconst appointmentDescEl = document.getElementById(\"appointmentDesc\");\n\
    const appointmentDateEl = document.getElementById(\"appointmentDate\");\nconst\
    \ appointmentTimeEl = document.getElementById(\"appointmentTime\");\nconst saveEl\
    \ = document.getElementById(\"save\");\nconst deleteEl = document.getElementById(\"\
    delete\");\n\n// //////////////////////////////////////////////////////////  UI\
    \ 函数\n///////////////////////////////////////////////////////\n// 创建初始预约列表\nexport\
    \ const createAppointmentList = function () {\n  for (let i = 0; i < 24; i++)\
    \ {\n    // 创建 <li> 元素\n    const item = document.createElement(\"li\");\n   \
    \ const textnode = document.createTextNode(i);\n    item.appendChild(textnode);\n\
    \    item.setAttribute(\"class\", \"list-group-item\");\n    item.setAttribute(\"\
    id\", \"hour_\" + i);\n    item.addEventListener(\"click\", handleClickOnHour);\n\
    \    appointmentsListEl.appendChild(item);\n    // 为小时 <select> 元素创建 <option>\n\
    \    const option = document.createElement(\"option\");\n\n    const textnode_option\
    \ = document.createTextNode(i);\n  }\n}\n```\n\n"
