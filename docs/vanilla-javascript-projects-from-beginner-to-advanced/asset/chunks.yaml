    \ find this project in GitHub:\n\n[https://github.com/htset/vanilla_javascript_projects/tree/main/expense_tracker](https://github.com/htset/vanilla_javascript_projects/tree/main/expense_tracker)\n\
    \n# 16.                       Currencies portfolio\n\nWe will create a currencies\
    \ portfolio, where we can report the amounts of various currencies that we have\
    \ in our possession. Our web app will use  fetch() to retrieve the latest currency\
    \ values from a web API and will calculate the total value of the portfolio in\
    \ the preferred currency.\n\n![](image_rsrcBRF.jpg)\n\n# Concepts covered\n\n\
    fetch()\n\n*   Asynchronous programming (async/await, promises)\n\n*   DOM manipulation(querySelector)\n\
    \n# Proposed Solution\n\nFor the retrieval of the currency quotes we will the\
    \ Free Currency API web site ([https://freecurrencyapi.com/](https://freecurrencyapi.com/))\
    \ that provides a free service for limited API requests. You will have to sign\
    \ up and get your own API Key to use in your RESTful requests.\n\nThere are two\
    \ types of API requests that we will use:\n\nTo get the supported currencies:\n\
    \nhttps://api.freecurrencyapi.com/v1/currencies?apikey=XXXX\n\nTo get the currency\
    \ quotes:\n\nhttps://api.freecurrencyapi.com/v1/latest?base_currency=baseCurrency&apikey=XXXX\n\
    \nIn both cases, we need to supply our API key, while on the latter case we must\
    \ also provide the three-letter code for the base currency (i.e.: EUR, USD, etc.).\n\
    \nLet’s start with the index.html file:\n\n| <!DOCTYPE html><html><head><title>My\
    \ Portfolio</title><linkhref=\"https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css\"\
    rel=\"stylesheet\"integrity=\"sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65\"\
    crossorigin=\"anonymous\"></head><body><div class=\"container\"><h1>My portfolio</h1>\
    \ \n\n<div class=\"row border bg-secondary\">\n\n<div class=\"col-md-2 m-2\"><span>Base\
    \ currency:</span></div><div class=\"col-md-4 m-2\"><select class=\"baseCurrency\"\
    ></select></div></div><div class=\"row\"><div class=\"col-md-2 m-2\"><div class=\"\
    fw-bold\">Amount</div></div><div class=\"col-md-4 m-2\"><span class=\"fw-bold\"\
    >Currency</span></div><div class=\"col-md-2 m-2\"><button class=\"add col-md-12\"\
    >Add line</button></div></div><div class=\"list\"></div><div class=\"row border\
    \ bg-secondary\"><div class=\"col-md-2 m-2\"><button class=\"calculate col-md-12\"\
    >Calculate portfolio value</button></div><div class=\"col-md-4 m-2\"><div class=\"\
    result\"></div></div></div></div>\n\n<script\n\nsrc=\"https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js\"\
    integrity=\"sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4\"\
    crossorigin=\"anonymous\"></script><script src=\"script.js\" type=\"text/javascript\"\
    ></script></body></html> |\n\nListing 16‑1: index.html\n\nOur HTML file uses Bootstrap\
    \ for styling; we don’t use a separate CSS file.\n\nLet’s move on to the JavaScript\
    \ code. First, we define our element variables and then retrieve the supported\
    \ currencies from the web service:\n\n| const baseCurrencyEl = document.querySelector(\"\
    .baseCurrency\");const currenciesEl = document.querySelector('.list');const addEl\
    \ = document.querySelector(\".add\");const calculateEl = document.querySelector(\"\
    .calculate\");const resultEl = document.querySelector(\".result\");const fetchSupportedCurrencies\
    \ = async () => {const URL = `https://api.freecurrencyapi.com/v1/currencies?apikey=XXX`;let\
    \ json;try { \n\nconst response = await fetch(URL);\n\njson = await response.json();if\
    \ (!response.ok) {alert(`Error ${response.status}: ${json.message}`);return null;}if\
    \ (json.error !== undefined) {alert(`Error: ${json.error.info}`);return null;}}catch\
    \ (error) {if (error instanceof SyntaxError) {alert(\"The returned data was invalid\"\
    );return null;}else {alert(\"There was an error with the request\");return null;}}return\
    \ json;} |\n\nListing 16‑2: script.js\n\nFunction  fetchSupportedCurrencies()\
    \ is an  async function: that’s because inside the function we use  await to call\
    \  fetch() asynchronously.\n\nWe first use  fetch() to get the response. The \
    \ response object is a Promise; therefore, we should  await on it to complete.\
    \ When the request is complete, we await one more time to get the JSON content\
    \ of the returned response. We check the response status to see if it was successful\
    \ and, in this case, we return the parsed JSON object.\n\nNote that we are using\
    \ a try/catch exception clause to check for the cases where the data returned\
    \ is invalid or where there was an error with the request.\n\nIn the same manner,\
    \ we send a RESTful GET request to the API, to retrieve the quotes for a selected\
