  raw: "  color:white;\n\n  overflow: hidden; /* Hide scrollbars */\n\n}\n\nThe container\
    \  <div> gets relative positioning. This will be combined with the absolute positioning\
    \ of the arrows, to place them at the edges of their respective container:\n\n\
    .container{\n\n  position:relative;\n\n}\n\nFor the two sliders, we specify a\
    \ transition of one second. This means that the slider movement to the left or\
    \ the fight will be performed smoothly. The  white-space property is used to avoid\
    \ wrapping of the images on a new line, but instead to be positioned one after\
    \ the other:\n\n.slider, .slider2 {\n\n  white-space: nowrap;\n\n  transition:\
    \ all 1.0s ease-in-out;\n\n}\n\nIn the CSS for the item element (i.e. the movie\
    \ icon) we get the  width and the  height from the variables defined above. We\
    \ also set the  display property to  inline-block: this will make the icons line\
    \ up. Here again, we define a  transition; this will apply during the appearance\
    \ of the movie description:\n\n.item {\n\n  width: var(--icon-width);\n\n  height:\
    \ var(--icon-height);\n\n  display: inline-block;\n\n  position: relative;\n\n\
      color: white;\n\n  font-size: 0.8rem;\n\n  transition: all 0.6s ease-in-out;\n\
    \n  text-align: center;\n\n}\n\nNext, we define some pseudo-classes on the item\
    \ class. The  nth-of-type(1) pseudo-class applies to the first item in the list,\
    \ i.e. the first icon on the left. This is used to give an extra margin to the\
    \ left of the slider.\n\nWhen the mouse pointer hovers over an item, a transformation\
    \ is applied, and the item becomes 40% bigger. Moreover, the description become\
    \ visible:\n\n.item:nth-of-type(1) {\n\n  margin-left: var(--arrow-width);\n\n\
    }\n\n.item:hover {\n\n  transform: scale(1.4);\n\n  z-index: 50;\n\n  border:\
    \ 1px white solid;\n\n  background-color: darkgray;\n\n}\n\n.item:hover > .description\
    \ {\n\n  visibility:visible;\n\n}\n\nThe description class is initially hidden.\
    \ We use the  pre-line value for the  white-space property. This means that sequences\
    \ of white space are collapsed, and lines are broken at newline characters as\
    \ necessary to fill line boxes:\n\n.description{\n\n  width: var(--icon-width);\n\
    \n  white-space: pre-line;\n\n  visibility:hidden;\n\n}\n\n.descr-text{\n\n  height:\
    \ 40px;\n\n  display:block;\n\n  overflow: hidden;\n\n  padding: 0 10px;\n\n \
    \ text-align: left;\n\n}\n\nThe description contains small buttons, to play a\
    \ movie, like it or add it to the user’s list. Their icons are also taken from\
    \ Font Awsome. We use a flex container to position the icons in one row:\n\n.descr-buttons-container\
    \ {\n\n  display: flex;\n\n  flex-direction: row;\n\n  padding: 0 10px;\n\n}\n\
    \n.descr-button {\n\n  display: flex;\n\n  align-items: center;\n\n  justify-content:\
    \ center;\n\n  width: 20px;\n\n  height: 20px;\n\n  border: 2px solid white;\n\
    \n  text-align: center;\n\n  font-size: 8px;\n\n  margin-right: 5px;\n\n  border-radius:\
    \ 100%;\n\n}\n\nFinally, here is the styling for the next/previous buttons. Note\
    \ the  absolute position we talked about earlier. We also give a high  z-index\
    \ value to make them appear on top of the slider:\n\nimg {\n\n  width: 15rem;\n\
    \n}\n\n.previous,.previous2,\n\n.next, .next2 {\n\n  width: var(--arrow-width);\n\
    \n  height: var(--icon-height);\n\n  border-radius: 5px;\n\n  position: absolute;\n\
    \n  top: 50%;\n\n  background-color: rgba(0, 0, 0, 0.3);\n\n  outline: none;\n\
    \n  border: none;\n\n  color: white;\n\n  z-index: 100;\n\n  cursor: pointer;\n\
    \n}\n\n.next, .next2 {\n\n  right: 0;\n\n}\n\nLet’s now delve into the JavaScript\
    \ code:\n\n| const sliderEl = document.querySelector(\".slider\");const slider2El\
    \ = document.querySelector(\".slider2\");const previousEl = document.querySelector(\"\
    .previous\");const nextEl = document.querySelector(\".next\");const previous2El\
    \ = document.querySelector(\".previous2\");const next2El = document.querySelector(\"\
