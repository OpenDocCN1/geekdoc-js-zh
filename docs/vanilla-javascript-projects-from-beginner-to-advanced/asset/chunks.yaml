    \ crossorigin=\"anonymous\">\n</head>\n<body>\n    <div class=\"container\">\n\
    \        <h1>My portfolio</h1>\n        <div class=\"row border bg-secondary\"\
    >\n            <div class=\"col-md-2 m-2\"><span>Base currency:</span></div></div>\n\
    \            <div class=\"col-md-4 m-2\"><select class=\"baseCurrency\"></select></div>\n\
    \        </div>\n        <div class=\"row\">\n            <div class=\"col-md-2\
    \ m-2\"><div class=\"fw-bold\">Amount</div></div>\n            <div class=\"col-md-4\
    \ m-2\"><span class=\"fw-bold\">Currency</span></div>\n            <div class=\"\
    col-md-2 m-2\"><button class=\"add col-md-12\">Add line</button></div>\n     \
    \   </div>\n        <div class=\"list\"></div>\n        <div class=\"row border\
    \ bg-secondary\">\n            <div class=\"col-md-2 m-2\"><button class=\"calculate\
    \ col-md-12\">Calculate portfolio value</button></div>\n            <div class=\"\
    col-md-4 m-2\"><div class=\"result\"></div></div>\n        </div>\n    </div>\n\
