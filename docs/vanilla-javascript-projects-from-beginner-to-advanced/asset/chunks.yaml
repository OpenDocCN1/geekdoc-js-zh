    \n# 14. Appointments list (version 4)\n\nWe will refactor the whole web, so that\
    \ it uses `Webpack` for bundling, `Babel` for ES6 support and `Jest` for testing.\n\
    \n# Concepts covered\n\n*   ES6 modules\n* `Webpack`\n* `Babel`\n* `Jest`\n\n\
    # Proposed Solution\n\nThe web app that we created in the previous project is\
    \ in good shape. We have separated the various functionalities into different\
    \ JS files, and we have introduced testing with `QUnit`. However, it does not\
    \ take advantage of the modern technologies that have been introduced in the JavaScript\
    \ world.\n\nMore specifically, the way the JS code is loaded results in creating\
    \ global objects that pollute the application namespace. This may result in conflicts\
    \ between objects when multiple libraries are used. We can solve this issue by\
    \ creating ES6 modules that will contain our code without creating global objects.\n\
    \nMoreover, in our current project we are not able to take advantage of the many\
    \ libraries that have been developed for `Node.js`. The only libraries that we\
    \ can use right now, are those that can be loaded by the browser through a link\
    \ (like `QUnit` or `Bootstrap`). In order to use the `NPM` libraries, we will\
    \ need to use a builder utility like `Webpack` or `Vite`.\n\nBy using `Webpack`,\
    \ we can break our code into multiple modules, without creating global objects\
    \ and without worrying about which file will load first. Furthermore, we can bundle\
    \ those JS files into one big file that will be downloaded by the user’s browser.\n\
    \nIn this way, we can also use more advanced libraries for testing, such as `Jest`.\n\
    \n# Part A – ES6 modules and Webpack\n\nFirst of all, we have to install `Node.js`\
    \ in our development machine. We can find it at: `https://nodejs.org/en`\n\nWe\
    \ can then start with project initialization by typing in a command prompt:\n\n\
    ```bash\nnpm init\n```\n\nThis will create a new project, which is defined by\
    \ a `package.json` file.\n\nIn the wizard, we provide the following answers:\n\
    \n*   Package name: `appointments`\n*   Entry point: `ui.js`\n*   Test command:\
    \ `jest`\n\nWe keep the default settings for the other parameters. The resulting\
    \ `package.json` file will look like the following:\n\n```json\n{\"name\": \"\
    appointments\",\"version\": \"1.0.0\",\"description\": \"\",\"main\": \"ui.js\"\
    ,\"scripts\": {\"test\": \"jest\"},\"author\": \"\",\"license\": \"\"}\n```\n\
    Listing 14-1: `package.json`\n\nNext, we install the required dependencies for\
    \ `webpack`:\n\n```bash\nnpm install webpack-cli --save-dev\n```\n\nThis command\
    \ will install `webpack`, `webpack-cli` and `dev-server` as development dependencies.\
    \ Note the `node_modules` folder that was created. In the `package.json` file\
    \ we should add two entries in `scripts` section, one for running the server and\
    \ one to build:\n\n```json\n{\"name\": \"appointments\",\"version\": \"1.0.0\"\
    ,\"description\": \"\",\"main\": \"ui.js\",\"scripts\": {\"build\": \"webpack\"\
    ,\"start\": \"webpack serve\"},\"author\": \"\",\"license\": \"\"}\n```\nListing\
    \ 14-2: `package.json`\n\nWhen running the `start` option (`npm start`) then a\
    \ development server is launched and a new window is opened loading `index.html`.\
    \ The `build` option (`npm run build`), creates the production ready `bundle.js`\
    \ and stores it in `dist` folder.\n\nNext, we should create the Webpack configuration\
    \ file named `webpack.config.js` inside the root folder with the following content:\n\
    \n```javascript\nconst path = require('path');\nmodule.exports = {\n  \"mode\"\
    : \"development\",\n  \"entry\": \"./src/ui.js\",\n  \"output\": {\n    \"path\"\
    : path.join(__dirname, 'dist'),\n    \"filename\": \"bundle.js\"\n  },\n  \"devServer\"\
    : {\n    \"static\": path.join(__dirname, 'public'),\n    \"devMiddleware\": {}\n\
    \  },\n  \"port\": 3000,\n  \"hot\": true\n};\n```\nListing 14-3: `webpack.config.js`\n\
    \nThe configuration file says that the JavaScript entry file (the file that should\
    \ run first) is `ui.js` in `src` folder. It also says that all JS files will be\
    \ bundled in file `bundle.js`, created in `dist`.\n\nNow, we should go ahead and\
    \ create those two folders. We will also create another folder (`public`) where\
    \ our `index.html` file will reside.\n\n```bash\nmkdir src\nmkdir dist\nmkdir\
    \ public\n```\n\nNow, let’s move the `index.html` file into the `public` folder.\
    \ We will change the `<script>` elements so that they now point to the bundled\
    \ JS file we will eventually create via webpack.\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <link href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css\"\
    \ rel=\"stylesheet\" integrity=\"sha384-K3K2stSC2CC3h99233R9m99999999966666Y\"\
    \ crossorigin=\"anonymous\">\n</head>\n<body>\n  <div class=\"container\">\n \
    \   <header id=\"main-header\" class=\"bg-info text-black p-4 m-4\">\n      <div\
    \ class=\"container\">\n        <h1 id=\"header-title\">Appointments</h1>\n  \
    \    </div>\n    </header>\n    <div class=\"row\">\n      <div class=\"col-lg-6\"\
    >\n        <div class=\"card card-body\">\n          <!-- Content -->\n      \
    \  </div>\n      </div>\n    </div>\n  </div>\n  <script src=\"bundle.js\"></script>\n\
    </body>\n</html>\n```\n"
