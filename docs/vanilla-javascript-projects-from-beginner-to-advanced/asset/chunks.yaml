    \n现在我们来看 `Ghost` 的定义：\n\n```javascript\nclass Ghost extends Entity {constructor(map,\
    \ x, y) {super();this.game = map;this.type = \"ghost\";this.x = x;this.y = y;}play()\
    \ {// 可移动的相邻方块\nlet candidateBlocks = [];// 从相应的相邻方块到 pacman 的距离\nlet distanceToPacman\
    \ = [];for (let i = this.x - 1; i <= this.x + 1; i++)for (let j = this.y - 1;\
    \ j <= this.y + 1; j++) {if (i >= 0 && i < game.sizeX&& j >= 0 && j < game.sizeY&&\
    \ !(i == this.x && j == this.y)&& game.map[i][j].type != \"wall\") {candidateBlocks.push({\
    \ x: i, y: j });distanceToPacman.push(Math.sqrt(Math.pow(i - game.pacmanLocation.x,\
    \ 2)+ Math.pow(j - game.pacmanLocation.y, 2)));}}// 获取距离 pacman 最小的方块 \n\nlet\
    \ minDistIn = distanceToPacman.indexOf(Math.min(...distanceToPacman));\n\nif (game.map[candidateBlocks[minDistIn].x][candidateBlocks[minDistIn].y].entity\
    \ != null) {//只有当 pacman 在那里时才移动\nif (game.map[candidateBlocks[minDistIn].x][candidateBlocks[minDistIn].y].entity.type\
    \ == \"pacman\") {//吃掉 pacman\ngame.map[candidateBlocks[minDistIn].x][candidateBlocks[minDistIn].y].entity\
    \ = null;game.gameActive = false;this.move(candidateBlocks[minDistIn].x, candidateBlocks[minDistIn].y);}}else\
    \ {this.move(candidateBlocks[minDistIn].x, candidateBlocks[minDistIn].y);}}}\n\
    ```\n\n列表 23‑7：`ghost.js`\n\n在 `play()` 方法中，我们再次寻找用于移动的候选相邻方块。此外，我们还计算了每个候选位置到\
    \ PacMan 实体的直线距离数组。\n\n在我们计算出距离较小的方块后，Ghost 将移动到该方块，以努力接近 PacMan。Ghost 不可以移动到有另一个\
    \ Ghost 的方块中，但它可以步入 PacMan 所在的方块。在这种情况下，PacMan 会被 Ghost 捕获，游戏结束。\n\n注意游戏逻辑与 UI\
    \ 之间的分离。前者包含在 `Game`、`PacMan` 和 `Ghost` 类中，而后者可以在 `UI` 类中找到。通过这样，测试游戏的逻辑变得很容易。\n\
    \n这个游戏显然还有很多工作要做。例如，我们必须实现模式切换，即 PacMan 吞下大药丸后在短时间内开始追逐 Ghost。此类功能留给读者作为练习。\n\n"
