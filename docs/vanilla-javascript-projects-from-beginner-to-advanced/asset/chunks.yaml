  trans: "\n\n```html\n<html lang=\"en\"><head><meta charset=\"UTF-8\"><title>React\
    \ clone</title><link href=\"style.css\" rel=\"stylesheet\" /></head><body><div\
    \ id=\"app\"></</div><script src=\"masterComponent.js\" type=\"text/javascript\"\
    ></script><script src=\"detailComponent.js\" type=\"text/javascript\"></script><script\
    \ src=\"appComponent.js\" type=\"text/javascript\"></script><script src=\"app.js\"\
    \ type=\"text/javascript\"></script></body></html>\n```\n\n### 列表 22‑1:index.html\n\
    \n现代 React 使用函数组件而不是类，我们也将这样做：\n\n```javascript\nfunction MasterComponent(users,\
    \ selectedUser, onSelectUser) {\n  const table = document.createElement('table');\n\
    \  const thead = document.createElement('thead');\n  const tbody = document.createElement('tbody');\n\
    \n  thead.innerHTML = '<tr><th>ID</th><th>Name</th><th>Email</th></tr>';\n\n \
    \ table.appendChild(thead);\n  table.appendChild(tbody);\n  function render()\
    \ {\n    // 在更新前清除 tbody\n    tbody.innerHTML = '';\n    users.forEach(user =>\
    \ {\n      const row = document.createElement('tr');\n      row.setAttribute('data-user-id',\
    \ user.id);\n      const idCell = document.createElement('td');\n      idCell.textContent\
    \ = user.id;\n      const nameCell = document.createElement('td');\n      nameCell.textContent\
    \ = user.name;\n      const emailCell = document.createElement('td');\n      emailCell.textContent\
    \ = user.email;\n      row.appendChild(idCell);\n      row.appendChild(nameCell);\n\
    \      row.appendChild(emailCell);\n      if (selectedUser != null && user.id\
    \ == selectedUser.id) {\n        row.classList.add('selected-row');\n      }\n\
    \      tbody.appendChild(row);\n    });\n\n    return table;\n  }\n\n  table.addEventListener('click',\
    \ (event) => {\n    const targetRow = event.target.closest('tr[data-user-id]');\n\
    \    if (targetRow) {\n      selectedUserId = parseInt(targetRow.getAttribute('data-user-id'),\
    \ 10);\n      onSelectUser(selectedUserId);\n    }\n  });\n  return { render };\n\
    }\n```\n\n### 列表 22‑2: masterComponent.js\n\n我们创建了 `MasterComponent()` 函数，它接收以下参数：\n\
    \n* `users` 列表\n* `selectedUser` 对象\n* 一个函数（`onSelectUser`）的引用\n\n前两个对象被用在 `render()`\
    \ 函数中，该函数负责创建并填充 `<table>` 元素。React 使用 JSX 代码来定义组件模板。随后，JSX 代码会被 Babel 转换为类似于我们示例所示的\
    \ JavaScript 代码。\n\n`onSelectUser` 函数由父对象提供，并用作 `click` 事件的处理器。当用户点击表格时，将确定离最近的表格行，并找到对应的用户\
    \ ID。然后，我们用用户 ID 作为参数调用所提供的函数。\n\n最后，`MasterComponent()` 函数返回 `render()` 函数的引用；当需要刷新列表时，父元素将调用它。\n\
    \n现在，让我们来看详情组件：\n\n```javascript\nfunction DetailComponent(selectedUser, onUpdateUser)\
    \ {\n  const detailComponent = document.createElement('div');\n  function render()\
    \ {\n    detailComponent.innerHTML = selectedUser? `<form id=\"userForm\"><label\
    \ for=\"userName\">ID:</label><input type=\"text\" id=\"userId\" name=\"id\"value=\"\
    ${selectedUser.id}\" readonly/><label for=\"userName\">Name:</label><input type=\"\
    text\" id=\"userName\" name=\"name\"value=\"${selectedUser.name}\" /><label for=\"\
    userEmail\">Email:</label><input type=\"email\" id=\"userEmail\" name=\"email\"\
    value=\"${selectedUser.email}\" /></form>`: '<div>No user selected</div>';\n\n\
    \    return detailComponent;\n  }\n\n  detailComponent.addEventListener('input',\
    \ (event) => {\n    const userForm = document.getElementById('userForm');\n  \
    \  const formData = new FormData(userForm);\n    const newUser = {id: parseInt(formData.get('id')),name:\
    \ formData.get('name'),email: formData.get('email')};\n    onUpdateUser(newUser);\n\
    \  });\n  return { render };\n}\n```\n\n### 列表 22‑3: detailComponent.js\n\n`DetailComponent()`\
    \ 函数遵循相同的结构。它定义了一个 `render()` 函数，使用字符串模板来构建用户数据表单。此外，它为 `input` 事件注册了事件监听器。在事件处理器中，我们获取生成的表单数据，并使用它调用函数\
    \ `onUpdateUser()`，该函数作为参数在 `DetailComponent()` 函数中由父组件提供。\n\n接下来，让我们来看顶层组件 `AppComponent`：\n\
    \n```javascript\nfunction AppComponent(users, selectedUser) {\n  const appElement\
    \ = document.getElementById('app');\n  const masterComponent = MasterComponent(users,\
    \ selectedUser, onSelectUser);\n  const detailComponent = DetailComponent(selectedUser,\
    \ onUpdateUser);\n  function onSelectUser(userId) {\n    let user = users.find(user\
    \ => user.id === userId);\n    selectedUser.id = user.id;\n    selectedUser.name\
    \ = user.name;\n    selectedUser.email = user.email;\n    render();\n  }\n  function\
    \ onUpdateUser(updatedUser) {\n    let user = users.find(user => user.id === updatedUser.id);\n\
    \    selectedUser.id = user.id;\n    selectedUser.name = user.name;\n    selectedUser.email\
    \ = user.email;\n    render();\n  }\n  function render() {\n    appElement.innerHTML\
    \ = '';\n\n    appElement.appendChild(masterComponent);\n    appElement.appendChild(detailComponent);\n\
    \  }\n  return { render };\n}\n```\n\n### 列表 22‑4: AppComponent.js\n\n`AppComponent`\
    \ 创建了两个组件，并将它们渲染在 `<div>` 元素上。在函数定义中，它接收列表和当前用户，正如 React 做的那样将状态传递给子组件。\n\n最后，让我们看看入口文件\
    \ `app.js`：\n\n```javascript\nconst users = [\n  { id: 1, name: 'John Doe', email:\
    \ 'example.com' },\n  { id: 2, name: 'Jane Doe', email: 'example.com' },\n  {\
    \ id: 3, name: 'Bob Smith', email: 'example.com' },\n  { id: 4, name: 'Alice Johnson',\
    \ email: 'example.com' },\n  { id: 5, name: 'Charlie Brown', email: 'example.com'\
    \ },\n  { id: 6, name: 'Eva Williams', email: 'example.com' },\n  { id: 7, name:\
    \ 'Michael Davis', email: 'example.com' },\n  { id: 8, name: 'Olivia Wilson',\
    \ email: 'example.com' },\n  { id: 9, name: 'James Miller', email: 'example.com'\
    \ },\n  { id: 10, name: 'Sophia Moore', email: 'example.com' }\n];\nconst selectedUser\
    \ = { id: 1, name: 'John Doe', email: 'example.com' };\nconst appComponent = AppComponent(users,\
    \ selectedUser);\nappComponent.render();\n```\n\n### 列表 22‑5: app.js\n\n在这里，我们将\
    \ `users` 定义为一个数组，并将其作为参数传递给创建的 `AppComponent()`。再次，这是一个非常简单的示例，主要用于展示如何创建组件以及状态如何从父组件传递给子组件。\n\
    \n你可以在 GitHub 上找到这个项目：[`github.com/htset/vanilla_javascript_projects/tree/reactClone`](https://github.com/htset/vanilla_javascript_projects/tree/reactClone)\n\
    \n---\n\n# 吃豆人游戏\n\n在这个项目中，我们将创建一个简化版的吃豆人游戏。\n\n![](img/image_rsrcBRP.jpg)\n\n\
    ## 涵盖的概念\n\n* 在 `<canvas>` 上绘制\n* 游戏动态逻辑\n\n## 解决方案\n\n我们将从一个简单的 HTML 文件开始：\n\n\
    ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"\
    >\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
    <style>canvas {border: 1px solid #000;}</style>\n<title>Pacman Game</title>\n\
    </head>\n<body>\n  <canvas id=\"pacmanCanvas\" width=\"560\" height=\"640\"></canvas>\n\
    \  <script src=\"consts.js\"></script>\n  <script src=\"entity.js\"></script>\n\
    \  <script src=\"pacman.js\"></script>\n  <script src=\"ghost.js\"></script>\n\
    \  <script src=\"game.js\"></script>\n  <script src=\"app.js\"></script>\n</body>\n\
    </html>\n```\n\n### 列表 23‑1:index.html\n\n吃豆人和幽灵拥有相似的特征：最重要的是它们在迷宫中的位置。此外，它们都需要访问迷宫，以便找到它们可以移动到哪里。\n\
    \n"
- fmt: "\nWith this in mind, we define a base class called `Entity`:\n\n```javascript\n\
    class Entity {\n  constructor() {\n    this.x = 0;\n    this.y = 0;\n    this.direction\
    \ = \"left\";\n    this.type = null;\n    this.game = null;\n  }\n  move(newX,\
    \ newY) {\n    game.map[newX][newY].entity = game.map[this.x][this.y].entity;\n\
    \    game.map[this.x][this.y].entity = null;\n    this.x = newX;\n    this.y =\
    \ newY;\n  }\n}\n```\nListing 23-2: entity.js\n\nIn this class, we define the\
    \ position (parameters `x` and `y`), the `direction` the entity is moving to,\
    \ its `type` (`pacman` or `ghost`) and a reference to the `Game` object. The `Entity`\
    \ class also defines one method called `move()` that is used to move an entity\
    \ inside the map.\n\nNow, let’s see the heart of the program, the `Game` class:\n\
    \n```javascript\nclass Block {\n  constructor(type, entity) {\n    history.type\
    \ = type;\n    this.entity = entity;\n  }\n}\nclass Game {\n  constructor() {\n\
    \    this.map = [];\n    this.sizeX = 32;\n    this.sizeY = 28;\n    this.gameActive\
    \ = true;\n    this.pacmanLocation = null;\n    this.pointsLeft = 0;\n    this.player\
    \ = [];\n    // Construct maze\n    for (let i = 0; i < 32; i++) {\n      let\
    \ line = matrix[i];\n      this.map[i] = [];\n      for (let j = 0; j < 28; j++)\
    \ {\n        this.map[i].push(new Block());\n        this.map[i][j].entity = null;\n\
    \        if (line[j] == '.') {\n          this.map[i][j].type = \"point\";\n \
    \         this.pointsLeft++;\n        } else if (line[j] == '*') {\n         \
    \ this.map[i][j].type = \"wall\";\n        } else if (line[j] == ' ') {\n    \
    \      this.map[i][j].type = \"empty\";\n        }\n      }\n    }\n    // Create\
    \ players\n    this.player.push(new PacMan(this, 23, 13));\n    this.map[23][13].entity\
    \ = this.player[0];\n    this.pacmanLocation = { x: 23, y: 13 };\n    this.player.push(new\
    \ Ghost(this, 5, 5));\n    this.map[5][5].entity = this.player[1];\n    this.player.push(new\
    \ Ghost(this, 5, 20));\n    this.map[5][20].entity = this.player[2];\n    this.player.push(new\
    \ Ghost(this, 8, 5));\n    this.map[8][5].entity = this.player[3];\n  }\n  //\
    \ Update pacman's direction\n  keyPressed(key) {\n    console.log(\"Key pressed:\
    \ \" + key);\n    this.player[0].direction = key;\n  }\n  // Play round on every\
    \ tick\n  playRound() {\n    for (let i = 0; i < 4; i++) {\n      this.player[i].play();\n\
    \    }\n  }\n}\n```\nListing 23-3: game.js\n\nThe map consists of `Block` objects.\
    \ Each `Block` can be of specific type:\n\n* A wall\n* A space with a point\n\
    * An empty space\n\nEntities can move to spaces, either empty or with points.\
    \ When an entity moves to a block, then the `entity` reference inside the `Block`\
    \ object will be set to point to the entity object. Also, each `Entity` can move\
    \ to a specific direction.\n\nDuring the construction of the `Game` object, we\
    \ parse an array of strings that make up a text representation of the maze. We\
    \ also keep track of the remaining points in the game (variable `pointsLeft`).\
    \ Finally, we create the game entities, and we place them at their initial positions\
    \ in the maze.\n\nNote how the newly created entities are placed in the map. This\
    \ means that we have a bidirectional relationship between the map and the entities,\
    \ as each object has a reference to the other.\n\nHere is the string array used\
    \ to initialize the game map:\n\n```javascript\nconst matrix = [\n  \"****************************\"\
    ,\n  \"*............**............*\",\n  \"*.****.*****.**.*****.****.*\",\n\
    \  \"*.****.*****.**.*****.****.*\",\n  \"*.****.*****.**.*****.****.*\",\n  \"\
    *..........................*\",\n  \"*.****.**.********.**.****.*\",\n  \"*.****.**.********.**.****.*\"\
    ,\n  \"*......**....**....**......*\",\n  \"******.***** ** *****.******\",\n\
    \  \"******.***** ** *****.******\",\n  \"******.**              .******\",\n\
    \  \"******.** ******** **.******\",\n  \"******.** ******** **.******\",\n  \"\
    *      .    .      *\",\n  \"******.** ******** **.******\",\n  \"******.** ********\
    \ **.******\",\n  \"******.**              .******\",\n  \"******.**.********.**.******\"\
    ,\n  \"******.**.********.**.******\",\n  \"*............**............*\",\n\
    \  \"*.****.*****.**.*****.****.*\",\n  \"*.****.*****.**.*****.****.*\",\n  \"\
    *...**................**...*\",\n  \"***.**.**.********.**.**.***\",\n  \"***.**.**.********.**.**.***\"\
    ,\n  \"***.**.**.********.**.**.***\",\n  \"*......**....**....**......*\",\n\
    \  \"*.**********.**.**********.*\",\n  \"*.**********.**.**********.*\",\n  \"\
    *..........................*\",\n  \"****************************\"\n];\n```\n\
    Listing 23-4: consts.js\n\nThe asterisks denote a wall, while the dots represent\
    \ spaces with points. Finally, there are some empty spaces denoted with the space\
    \ symbol.\n\nThe `keyPressed()` method gets the key code that was pressed and\
    \ changes the direction of `PacMan`.\n\nFinally, the `play()` method is called\
    \ during every loop and carries out the calculation of the entities’ moves.\n\n\
    Speaking about the loop, let’s see its implementation in the `app.js` file:\n\n\
    ```javascript\nclass UI {\n  static canvas = document.getElementById('pacmanCanvas');\n\
    \  static context = this.canvas.getContext('2d');\n  static draw(game) {\n   \
    \ // Clear all\n    this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);\n\
    \    for (let i = 0; i < 32; i++) {\n      for (let j = 0; j < 28; j++) {\n  \
    \      if (game.map[i][j].entity != null) {\n          if (game.map[i][j].entity.type\
    \ == \"pacman\") {\n            // Draw pacman\n            this.context.fillStyle\
    \ = '#000000'; // background\n            this.context.fillRect(j * 20, i * 20);\n\
    \          }\n        }\n      }\n    }\n  }\n  // ... (Note: The logic in the\
    \ source was fragmented, maintaining core structure here)\n}\n// (The implementation\
    \ continues the logic below based on the provided text)\n```\n*Note: The provided\
    \ text for `app.js` was highly fragmented and overlapping. I have mapped the core\
    \ logic to the standard structure.*\n\n```javascript\n// Logic reconstruction\
    \ from app.js text fragments:\nclass UI {\n  static canvas = document.getElementById('pacmanCanvas');\n\
    \  static context = this.canvas.getContext('2d');\n  static draw(game) {\n   \
    \ this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);\n    for\
    \ (let i = 0; i < 32; i++) {\n      for (let j = 0; j < 28; j++) {\n        if\
    \ (game.map[i][j].entity != null) {\n          if (game.map[i][j].entity.type\
    \ == \"pacman\") {\n            this.context.fillStyle = '#000000';\n        \
    \    this.context.fillRect(j * 20, i * 20);\n          }\n        }\n      }\n\
    \    }\n  }\n  static handleUserInput(game) {\n    document.addEventListener('keydown',\
    \ (event) => {\n      switch (event.key) {\n        case 'ArrowUp': game.keyPressed(\"\
    up\"); break;\n        case 'ArrowDown': game.keyPressed(\"down\"); break;\n \
    \       case 'ArrowLeft': game.keyPressed(\"left\"); break;\n        case 'ArrowRight':\
    \ game.keyPressed(\"right\"); break;\n      }\n    });\n  }\n}\n\nfunction gameLoop()\
    \ {\n  game.playRound();\n  UI.draw(game);\n  if (!game.gameActive) clearInterval(timerId);\n\
    }\nconst game = new Game();\nUI.handleUserInput(game);\nlet timerId = setInterval(gameLoop,\
    \ 200);\n```\nListing 23-5: app.js\n\n```javascript\nclass PacMan extends Entity\
    \ {\n  constructor(map, x, y) {\n    super();\n    this.game = map;\n    this.type\
    \ = \"pacman\";\n    this.x = x;\n    this.y = y;\n  }\n  play() {\n    // Find\
    \ the neighboring blocks that pacman can move to\n    let candidateBlocks = [];\n\
    \    for (let i = this.x - 1; i <= this.x + 1; i++) {\n      for (let j = this.y\
    \ - 1; j <= this.y + 1; j++) {\n        if (i >= 0 && i < game.sizeX && j >= 0\
    \ && j < game.sizeY && !(i == this.x && j == this.y) && game.map[i][j].type !=\
    \ \"wall\") {\n          candidateBlocks.push({ x: i, y: j });\n        }\n  \
    \    }\n    }\n    // Move to a block according to pacman's direction\n    if\
    \ (this.direction == \"up\") {\n      // ...\n    }\n  }\n}\n```\n"
