    ```\n\nListing 23‑6: `pacman.js`\n\nThe important stuff lies in the implementation\
    \ of the `play()` method. First of all, we find all neighbouring blocks that PacMan\
    \ can move (those that are not a wall actually) and we put them in a list of `candidateBlocks`.\n\
    \nNext, depending on the `direction` currently selected by the user (using the\
    \ arrow buttons) we move PacMan into the respective block, if available. Moving\
    \ PacMan into a block means also updating the map with the position of PacMan,\
    \ as well the elimination of the point (if any) in this block. The latter is performed\
    \ by changing the type of the block to `empty` and by reducing by one the remaining\
    \ points in the game. If the points become zero, then the game comes to an end.\n\
    \nNow let’s move to the `Ghost` definition:\n\n```javascript\nclass Ghost extends\
    \ Entity {constructor(map, x, y) {super();this.game = map;this.type = \"ghost\"\
    ;this.x = x;this.y = y;}play() {// Neighboring block to move tolet candidateBlocks\
    \ = [];// Distance to pacman from the respective neighbor blocklet distanceToPacman\
    \ = [];for (let i = this.x - 1; i <= this.x + 1; i++)for (let j = this.y - 1;\
    \ j <= this.y + 1; j++) {if (i >= 0 && i < game.sizeX&& j >= 0 && j < game.sizeY&&\
    \ !(i == this.x && j == this.y)&& game.map[i][j].type != \"wall\") {candidateBlocks.push({\
    \ x: i, y: j });distanceToPacman.push(Math.sqrt(Math.pow(i - game.pacmanLocation.x,\
    \ 2)+ Math.pow(j - game.pacmanLocation.y, 2)));}}// Get block with the minimum\
    \ distance to pacman \n\nlet minDistIn = distanceToPacman.indexOf(Math.min(...distanceToPacman));\n\
    \nif (game.map[candidateBlocks[minDistIn].x][candidateBlocks[minDistIn].y].entity\
    \ != null) {//move only if pacman is thereif (game.map[candidateBlocks[minDistIn].x][candidateBlocks[minDistIn].y].entity.type\
    \ == \"pacman\") {//eat pacmangame.map[candidateBlocks[minDistIn].x][candidateBlocks[minDistIn].y].entity\
    \ = null;game.gameActive = false;this.move(candidateBlocks[minDistIn].x, candidateBlocks[minDistIn].y);}}else\
    \ {this.move(candidateBlocks[minDistIn].x, candidateBlocks[minDistIn].y);}}}\n\
    ```\n\nListing 23‑7: `ghost.js`\n\nIn the `play()` method, we again find the candidate\
    \ neighbouring blocks for a move. Moreover, we calculate an array of the straight-line\
    \ distances of each candidate position to the PacMan entity.\n\nAfter we have\
    \ calculated the block with the smaller distance, the Ghost will move to this\
    \ block, in an effort to get closer to PacMan. A Ghost may not move in a block\
    \ where there is another Ghost, but it can step into the block where PacMan is\
    \ located. In this case, PacMan is caught by the Ghost and the game comes to an\
    \ end.\n\nNote the separation between the game logic and the UI. The former is\
    \ included in the `Game`, `PacMan` and `Ghost` classes, while the latter can be\
    \ found in the `UI` class. In this way, it would be easy to test the logic of\
    \ the game.\n\nThis game has deively lots more to be done. For instance, we have\
    \ to implement the mode change where PacMan swallows the big pills and starts\
    \ chasing the Ghosts for a short period of time. Such functionality is left to\
    \ reader as an exercise.\n"
