    Our app consists of two main divs, one for the clock (id: `mainClock`) and one
    for the settings panel (id: `settings`). On the clock div, we also have a div
    (id: `toggleSettings`) that works as a button and that toggles the visibility
    of the settings panel. We use the Gear HTML symbol whose hex code is `&#9881;`.


    On the settings panel, we place an input element of type `time`; This will make
    it appear as a time selection element. Finally, there are two buttons for setting
    and cancelling the alarm.


