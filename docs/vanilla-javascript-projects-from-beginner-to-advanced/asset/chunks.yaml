    \ crossorigin=\"anonymous\"></script><script src=\"script.js\" type=\"text/javascript\"\
    ></script></body></html> |\n\nListing 7‑1: index.html\n\nIn order to get a nice\
    \ aesthetic result, we will be using the Bootstrap library in some of our projects.\
    \ Boostrap can be enabled by importing a CSS and a JavaScript file in the HTML,\
    \ using the  <link> and  <script> tags respectively.\n\nNote that, in the above\
    \ listing, we choose to load the library from a Content Delivery Network (CDN).\
    \ This means that when the user loads the web page, the browser will download\
    \ the two files from the CDN. As an alternative, we can download those files and\
    \ make them available through our own web server (we should not forget to update\
    \ their links in the HTML). Bootstrap 5.2.3 was the latest version at the time\
    \ of writing this book.\n\nThe user interface consists of a form element with\
    \ an input box and a submit button. When the user presses the submit button, the\
    \ form is not sent to the server (since the form  action attribute is empty).\
    \ Instead, the typed text will be entered in an unordered list below.\n\nAll elements\
    \ are enclosed in a container div. This web application does not contain any CSS\
