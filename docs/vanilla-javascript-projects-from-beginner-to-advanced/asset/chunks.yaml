    \ will pop up in a smooth manner.\n\n![](image_rsrcBRJ.jpg)\n\n# Concepts covered\n\
    \n*   CSS transitions and transformations\n\n*   DOM manipulation\n\n# Proposed\
    \ Solution\n\nWe will use The MovieDB ([https://www.themoviedb.org](https://www.themoviedb.org/)\
    \ ) free service to get the posters and the titles of the movies. After we become\
