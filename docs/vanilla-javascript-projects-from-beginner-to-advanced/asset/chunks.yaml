    \ crossorigin=\"anonymous\"></script>\n</body>\n</html>\n```\n列表 16‑1: index.html\n\
    \n我们的 HTML 使用 Bootstrap 进行样式；让我们转向 JavaScript。首先，我们定义变量并获取支持的货币：\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <title>My Portfolio</title>\n    <link href=\"\
    https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css\" rel=\"\
