    \ the effect that will take place (in our case,  move the item to another place).\
    \ We also specify that we are going to move HTML (i.e., the  innerHTML value of\
    \ the item).\n\nWhen the item is moved over the list (which is a valid drop target),\
    \ then the  dragover event is fired. In the handler function we call  e.preventDefault(),\
    \ which enables it to receive drop events.\n\nFinally, when the item is dropped\
    \ inside the list, we first prevent the default handling of the item (the default\
    \ behavious is to open as link on drop). The argument of the handler function\
    \  handleDrop(e) is the actual event fired. From this event we can get the target\
    \ element, i.e. the element on which the dragged item was dropped.\n\nFirst, we\
    \ make sure that the target element is not the dragged element itself (this will\
    \ happen when the dragged element has not been moved) and that the target element\
    \ is of the  list-group-item class (i.e. it is a list item). Then, we do some\
    \ measuring, in order to find out whether we will insert the dragged item before\
    \ or after the aforementioned list item.\n\nDepending on whether we dropped it\
    \ on the top or the bottom half of the list item, the dragged item will be inserted\
    \ (with  insertBefore()) before the item itself or the next sibling of the item\
    \ respectively.\n\nYou can find this project in GitHub:\n\n[https://github.com/htset/vanilla_javascript_projects/tree/main/todo2](https://github.com/htset/vanilla_javascript_projects/tree/main/todo2)\n\
    \n9.                       Todo List (version 3)\n\nIn the third part of the Todo\
    \ List saga, we will again refactor our application, by keeping the application\
    \ state (the todo entries) into an array. Moreover, the todo entries will be stored\
    \ in localStorage, in order to be available between application reloads.\n\n#\
    \ Concepts covered\n\n*   JS array manipulation\n\n*   Local storage\n\n# Proposed\
    \ Solution\n\nThe application that we created in the previous chapter works pretty\
    \ well. However, it still has some shortcomings. For instance, when the web page\
    \ reloads, the tasks are lost, and we have to enter them all over again. For this\
    \ reason, we will use localStorage in order to store the todo entries into the\
    \ browser’s storage space and have them available, even when our web page reloads.\n\
    \nFurthermore, the application maintains our data (i.e. the todo entries) inside\
    \ the HTML, since the entries text is entered inside list item (<li>) elements.\
    \ This is not very efficient; for instance, if we wanted to get the text of a\
    \ specific todo entry, then we would have to use DOM manipulation and get the\
    \  innerHTML value of the respective list item.\n\nGiven that we also need to\
    \ store the todo entries into localStorage, it would be better to maintain all\
    \ the entries in an array of strings. Whenever the user adds, deletes or drags\
    \ a todo entry, then this array will be updated, and the modified array will be\
    \ used to re-render the todo list in the web page.\n\nThe HTML code of our project\
    \ will remain unchanged:\n\n| <!DOCTYPE html><html lang=\"en\"><head><link href=\"\
