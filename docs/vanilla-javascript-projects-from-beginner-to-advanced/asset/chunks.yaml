    \ json;try {const response = await fetch(URL);json = await response.json();if\
    \ (!response.ok) {alert(`Error ${response.status}: ${json.message}`);return null;}if\
    \ (json.error !== undefined) {alert(`Error: ${json.error.info}`);return null;}}catch\
    \ (error) {if (error instanceof SyntaxError) {alert(\"The returned data was invalid\"\
    ); \n\nreturn null;\n\n}else {alert(\"There was an error with the request\");return\
    \ null;}}return json;} |\n\nListing 16‑3: script.js\n\nNote that we use a string\
