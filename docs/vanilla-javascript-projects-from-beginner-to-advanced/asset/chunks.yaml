    \    tasks = [];\nelse\n    renderList();\n```\n\nListing 9‑2: script.js\n\nFirst\
    \ of all, we should mention that we are using a JS array called `tasks` to store\
    \ the todo strings. Let’s break down the code into the various functions:\n\n\
    # renderList\n\nThe `renderList()` function iterates over the `tasks` array and\
    \ builds the unordered list. The code is almost the same from the previous versions.\
    \ However, note that we apply a custom attribute (called `data-id`) on each list\
    \ item element. This attribute will store the index number of the item inside\
    \ the `tasks` list.\n\n# deleteTodo\n\nThis function is called when the delete\
    \ button is clicked. Instead of performing DOM manipulation by removing the list\
    \ item element, it removes the respective string from the `tasks` array, using\
    \ `splice()`. Next, the todo list is rendered all over again, using the newly\
    \ modified `tasks` array.\n\nFinally, the modified `tasks` array is stored in\
    \ `localStorage`. To achieve this, we use the `JSON.stringify()` function in order\
    \ to get a string representation of the JS array in JSON.\n\n# handleDragStart\n\
    \nWhen drag and drop starts, we also keep the ID of the dragged item. We get this\
    \ ID from the `data-id` custom attribute of the list element.\n\n# handleDragOver\n\
    \nThis function remains unchanged.\n\n# handleDrop\n\nWhen the user drops the\
    \ item in a new place in the list, then we first get the ID of the list element\
    \ over which the dragged item was dropped. Then, we delete the dragged item from\
    \ the `tasks` array.\n\nNext, we create a new `tasks` array (in place of the existing\
    \ one) by using the spread operator(`…`). There are various cases, depending on\
    \ where the dragged item was dropped (i.e. on the upper or lower half of the list\
    \ item).\n\nFinally, we re-render the todo list by calling `render()` and we store\
    \ the modified array in the `localStorage`.\n\n# handleSubmit\n\nThe `handleSubmit()`\
    \ function pushes the new todo text into the `tasks` array and calls `render()`.\
    \ It also empties the text box.\n\nApart from the functions, we add the necessary\
    \ event listeners, and at the startup of the application, we check the `localStorage`\
    \ for the existence of a todo list. If so, we parse the stored JSON string and\
    \ we assign it to the `tasks` array. In the absence of any list, the `tasks` variable\
    \ is initialized as an empty array. Finally, `render()` is called for the first\
    \ time to create the unordered list in the HTML.\n\nYou can find this project\
    \ in GitHub:\n\n[https://github.com/htset/vanilla_javascript_projects/tree/main/todo3](https://github.com/htset/vanilla_javascript_projects/tree/main/todo3)\n\
    \n# 10. Form validation\n\nIn this project, we will create an extensive registration\
