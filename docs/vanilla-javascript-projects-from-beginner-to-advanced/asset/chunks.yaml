    \n---\n\n# PacMan game\n\nIn this project, we will create a simplified PacMan\
    \ game.\n\n![](image_rsrcBRP.jpg)\n\n## Concepts covered\n\n* Drawing on `<canvas>`\n\
    * Game dynamics\n\n## Proposed Solution\n\nWe will start with a simple HTML file:\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"\
    >\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
    <style>canvas {border: 1px solid #000;}</style>\n<title>Pacman Game</title>\n\
    </head>\n<body>\n  <canvas id=\"pacmanCanvas\" width=\"560\" height=\"640\"></canvas>\n\
    \  <script src=\"consts.js\"></script>\n  <script src=\"entity.js\"></script>\n\
    \  <script src=\"pacman.js\"></script>\n  <script src=\"ghost.js\"></script>\n\
    \  <script src=\"game.js\"></script>\n  <script src=\"app.js\"></script>\n</body>\n\
    </html>\n```\n\n### Listing 23‑1:index.html\n\nPacMan and the Ghosts possess similar\
    \ characteristics: the most important is their position in the maze. Moreover,\
    \ they both need to have access to the maze so that they can find out where they\
    \ can move to.\n"
