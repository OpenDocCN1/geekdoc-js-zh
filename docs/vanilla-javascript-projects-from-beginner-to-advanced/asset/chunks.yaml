    \ budgetTracker = new BudgetTracker();BudgetUI.handleUserInput(budgetTracker);BudgetUI.changeMonth(budgetTracker);\
    \ |\n\nListing 15‑8: app.js\n\nHere we define two Pikaday objects for the two\
