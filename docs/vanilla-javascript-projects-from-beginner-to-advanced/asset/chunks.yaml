- fmt: "\n![](image_rsrcBR2.jpg)\n\nVanilla Javascript Projects - From Beginner to\
    \ Advanced\n\nISBN: 9798878051323\n\nCopyright © 2024 by Haris Tsetsekas\n\n#\
    \ Table of Contents\n\n1. [Introduction](#part0003.xhtml_aBKS)\n2. [Temperature\
    \ Conversion](#part0004.xhtml_aBKT)\n3. [Temperature Conversion (version 2)](part0005.xhtml_aBKU)\n\
    4. [Color Picker](#part0006.xhtml_aBKV)\n5. [Color Picker (version 2)](part0007.xhtml_aBKW)\n\
    6. [Alarm clock](#part0008.xhtml_aBKX)\n7. [Todo List](#part0009.xhtml_aBKY)\n\
    8. [Todo List (version 2)](part0010.xhtml_aBKZ)\n9. [Todo List (version 3)](part0011.xhtml_aBM0)\n\
    10. [Form validation](#part0012.xhtml_aBM1)\n11. [Appointments list](#part0012.xhtml_aBM2)\n\
    12. [Appointments list (version 2)](part0012.xhtml_aBM3)\n13. [Appointments list\
    \ (version 3)](part0013.xhtml_aBM4)\n14. [Appointments list (version 4)](part0014.xhtml_aBM5)\n\
    15. [Expense tracker](#part0015.xhtml_aBM6)\n16. [Currencies portfolio](#part0015.xhtml_aBM7)\n\
    17. [OpenLayer maps with meteo information](#part0016.xhtml_aBM8)\n18. [Product\
    \ list with infinite scroll](#part0017.xhtml_aBM9)\n19. [Netflix clone](#part0018.xhtml_aBMA)\n\
    20. [Book list with Node.js API](#part0019.xhtml_aBMB)\n21. [Master-detail form\
    \ (Angular clone)](part0020.xhtml_aBMC)\n22. [Master-detail form (React clone)](part0021.xhtml_aBMD)\n\
    23. [PacMan game](part0022.xhtml_aBME)\n\n# 1. Introduction\n\nBefore embarking\
    \ on creating our projects, it would be a good idea to discuss about how to create\
    \ a project, how to run it and also how to debug it.\n\n# Development\n\nThe projects\
    \ in this book were developed using Visual Studio Code (`https://code.visualstudio.com/`),\
    \ a free Integrated Development Environment (IDE) from Microsoft. We can also\
    \ use other IDEs, such as Eclipse or WebStorm.\n\nWorking with VS Code is simple.\
    \ We should create a folder in our drive where we will place all our code. Then\
    \ we can select `Open Folder` from the File menu to open the specific folder.\
    \ The files contained in this folder will all be part of the project.\n\n# Running\n\
    \nFor simple web pages, it is sufficient to double-click on the HTML file to run\
    \ it. The web page will open in the default web browser, and it will be ready\
    \ to play with. We can also install the Live Server extension for VS Code, that\
    \ runs a small web server inside VS Code. When we will learn about webpack and\
    \ vite, we will use their own servers for development.\n\nFor each project, there\
    \ will be exact instructions on how to run it.\n\n# Debugging\n\nIn order to debug\
    \ a web page, we can use the Web Development Tools that are available on the browser.\
    \ On both Google Chrome and Mozilla Firefox, we can bring forward those tools\
    \ with `Ctrl+Shift+i`.\n\nWe can do many things with the Developer tools:\n\n\
    * we can view the structure of the HTML file and the CSS properties (`Elements`\
    \ tab)\n* we can see the messages in the console (`Console` tab)\n* we can see\
    \ the JavaScript code and we can also debug it (`Sources` tab)\n* we can see the\
    \ network requests and their contents (`Network` tab)\n* and many more\n\nFrom\
    \ the `Sources` tab, we can set breakpoints in the JavaScript code. The execution\
    \ of the code will stop at those points, and then we can see the current values\
    \ of the variables. We can also run the code step by step, by selecting `Step\
    \ Over` (`F10`). We can also enter inside a function with `Step Into` (`F11`).\
    \ Finally, we can continue with the execution of the code (until the next breakpoint)\
    \ with `Resume Execution` (`F8`).\n\n![](image_rsrcBR3.jpg)\n\n# 2. Temperature\
    \ Conversion\n\nFor our first project, let’s create a simple web application that\
    \ converts temperatures from Celsius to Fahrenheit degrees and vice versa:\n\n\
    # ![](image_rsrcBR4.jpg)\n\n## Concepts covered\n\n* Click event handling\n* Number\
    \ parsing and checking\n* CSS styling (Flex)\n\n## Proposed Solution\n\nWe will\
    \ begin by creating an HTML file in our folder. In this book, we will follow the\
    \ convention of naming the main HTML files of the web application as `index.html`.\n\
    \n| ```html\n<!DOCTYPE html><<html><head><title>Temperature conversions</title><link\
    \ href=\"style.css\" rel=\"stylesheet\"></head><body><div class=\"container\"\
    ><<h1>Temperature conversions</h1><label class=\"item\">Celsius:</label><input\
    \ type=\"text\" id=\"celsius\"/><label class=\"item\">Fahrenheit:</label><input\
    \ type=\"text\" id=\"fahrenheit\"><button id=\"btn1\">Convert to Fahrenheit</button><button\
    \ id=\"btn2\">Convert to Celsius</button></div><script src=\"script.js\"></script></body></html>\n\
    ``` | Listing 2‑1: index.html\n\nOur application consists of two text inputs (`celsius`,\
    \ `fahrenheit`) and two buttons (`btn1`, `btn2`). We will handle the `click` event\
    \ on both buttons by setting the `onclick` attribute in JavaScript.\n\n| ```javascript\n\
    const celsiusInput = document.getElementById('celsius');\nconst fahrenheitInput\
    \ = document.getElementById('fahrenheit');\nconst btn1 = document.getElementById('btn1');\n\
    const btn2 = document.getElementById('btn2');\n\nbtn1.onclick = function() {\n\
    \    const celsius = parseFloat(celsiusInput.value);\n    if (!isNaN(celsius))\
    \ {\n        fahrenheitInput.value = (celsius * 9/5) + 32;\n    }\n};\n\nbtn2.onclick\
    \ = function() {\n    const fahrenheit = parseFloat(fahrenheitInput.value);\n\
    \    if (!isNaN(fahrenheit)) {\n        celsiusInput.value = (fahrenheit - 32)\
    \ * 5/9;\n    }\n};\n``` | Listing 2‑2: script.js\n\nBoth functions operate in\
    \ a similar manner; first, we obtain the reference to both text elements (via\
    \ `getElementById()`). In this way, we will be able to get what the user has typed\
    \ inside the text boxes, via the `.value` property of each element.\n\nWe should\
    \ note that the `.value` property is a string value. Therefore, we have to parse\
    \ the value typed by the user, in order to get the actual numeric value for our\
    \ calculations. The `parseFloat()` function will start from the beginning of the\
    \ string and parse all numeric characters until a non-numeric character is found.\
    \ Example conversions:\n\n“1234x” → 1234\n“1234x567” → 1234\n“x1234” → NaN\n\n\
    The term NaN means Not a Number; it’s a way of specifying that the value is not\
    \ a number. We can check whether a variable is a number or not with the `isNaN()`\
    \ function. In the case where the user has typed a non-numeric string, then an\
    \ alert will be presented, and the result text box will be left blank. If a numeric\
    \ string is provided, then we proceed with the calculation, and the result is\
    \ presented by setting the `.value` property of the corresponding text box. The\
    \ `toFixed(2)` function provides a string representation of the number with two\
    \ decimal points.\n\nFinally, let’s have a look at the CSS file (style.css):\n\
    \n```css\n.container{\n    width: 300px; /* this is a flex container */\n    display:\
    \ flex; /* items should be placed in a column */\n    flex-direction: column;\
    \ /* a gap between items */\n    gap: 10px;\n}\n.item{\n    width: 100%;\n}\n\
    h1{\n    font-size: 1.5em;\n}\n``` | Listing 2‑3: style.css\n"
