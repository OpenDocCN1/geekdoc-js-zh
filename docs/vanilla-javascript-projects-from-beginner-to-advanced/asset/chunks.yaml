    \ 函数创建一个 toast 通知并将其显示在屏幕右上角。设置了一个定时器以便在一段时间后隐藏该通知。\n\n最后，让我们来看入口点，`app.js` 文件：\n\
    \n```javascript\nimport { BudgetUI } from './budgetUI.js';\nimport { BudgetTracker\
