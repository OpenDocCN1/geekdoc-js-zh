  trans: "\n\n```html\nintegrity=\"sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4\"\
    \ncrossorigin=\"anonymous\"></script><script src=\"script.js\" type=\"text/javascript\"\
    ></script></body></html>\n```\n\n**Listing 10-1: index.html**\n\n我们的注册表包含多种元素：\n\
    \n* 文本框\n* 密码文本框\n* 复选框\n* 单选框\n* 下拉列表\n* 文本区域\n* 提交按钮\n\n此外，每个元素旁边都有一个 `<span>`\
    \ 元素，将包含相应的错误信息。我们为这些元素应用了 `error` 类。\n\n除此之外，HTML 非常直观，我们将继续处理 JavaScript 文件：\n\
    \n```javascript\nconst fname = document.getElementById(\"fname\");\nconst lname\
    \ = document.getElementById(\"lname\");\nconst gender = document.getElementsByName(\"\
    gender\");\nconst zip = document.getElementById(\"zip\");\nconst state = document.getElementById(\"\
    state\");\nconst address = document.getElementById(\"address\");\nconst email\
    \ = document.getElementById(\"email\");\nconst phone = document.getElementById(\"\
    phone\");\nconst checks = document.getElementsByName(\"checks\");\nconst password\
    \ = document.getElementById(\"password\");\nconst confirm = document.getElementById(\"\
    confirm\");\nconst comments = document.getElementById(\"comments\");\nconst fnameError\
    \ = document.getElementById(\"fnameError\");\nconst lnameError = document.getElementById(\"\
    lnameError\");\nconst genderError = document.getElementsByName(\"genderError\"\
    );\nconst zipError = document.getElementById(\"zipError\");\nconst stateError\
    \ = document.getElementById(\"stateError\");\nconst addressError = document.getElementById(\"\
    addressError\");\nconst emailError = document.getElementById(\"emailError\");\n\
    const phoneError = document.getElementById(\"phoneError\");\nconst checksError\
    \ = document.getElementsByName(\"checksError\");\nconst passwordError = document.getElementById(\"\
    passwordError\");\nconst confirmError = document.getElementById(\"confirmError\"\
    );\nconst errorSpans = document.getElementsByClassName(\"error\");\n\nconst validate\
    \ = function() {\n    let result = true;\n    // remove previous errors\n    for(let\
    \ i=0; i<errorSpans.length; i++){\n    errorSpans[i].innerHTML = \"\";\n    }\n\
    \    if(fname.value == \"\"){\n        fnameError.innerHTML = \"First name is\
    \ required\";\n        result = false;\n    }\n    if(lname.value == \"\"){\n\
    \        lnameError.innerHTML = \"Last name is required\";\n        result = false;\n\
    \    }\n    let found = false;\n    for (let i = 0; i < gender.length; i++) {\n\
    \        if (gender[i].checked === true)found = true;\n    }\n    if(!found){\n\
    \        genderError.innerHTML = \"Gender is required\";\n        result = false;\n\
    \    }\n    if(zip.value == \"\") {\n        zipError.innerHTML = \"ZIP is required\"\
    ;\n        result = false;\n    } else if (zip.value.length != 5 || isNaN(zip.value))\
    \ {\n        zipError.innerHTML = \"ZIP is not correct\";\n        result = false;\n\
    \    }\n    if(state.value === \"CO\") {\n        if(address.value == \"\"){\n\
    \            addressError.innerHTML = \"Address is required for Colorado\";\n\
    \            result = false;\n        }\n    }\n    const emailRegex = /^(([^<>()[\\\
    ]\\\\.,;:\\s@\"]+(\\.[^<>()[\\]\\\\.,;:\\s@\"]+)*)|.(\".+\"))@((\\[[0-9]{1,3}\\\
    .[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\])|(([a-zA-Z\\-0-9]+\\.)+[a-zA-Z]{2,}))$/;\n\
    \    if (!email.value.match(emailRegex)){\n        emailError.innerHTML = \"Email\
    \ is not correct\";\n        result = false;\n    }\n    const phoneRegex = /^\\\
    (?(\\d{3})\\)?[- ]?(\\d{3})[- ]?(\\d{4})$/;\n    if (!phone.value.match(phoneRegex)){\n\
    \        phoneError.innerHTML = \"Phone formats: (123)456-7890, 1234567890 or\
    \ 123-456-7890\";\n        result = false;\n    }\n    if(checks[0].checked ===\
    \ false){\n        acceptError.innerHTML = \"You should agree to the terms\";\n\
    \        result = false;\n    }\n    if(password.value.length < 8){\n        passwordError.innerHTML\
    \ = \"Password should contain at least 8 characters\";\n        result = false;\n\
    \    }\n    if(confirm.value !== password.value){\n        confirmError.innerHTML\
    \ = \"Password and Confirm Password do not match\";\n        result = false;\n\
    \    }\n    return result;\n}\n```\n\n"
- fmt: "\n# ![](image_rsrcBRB.jpg)\n\n## Concepts covered\n\n* DOM manipulation\n\
    * Date handling\n* Maps\n\n## Proposed Solution\n\nLet’s start with the `index.html`\
    \ file:\n\n```html\n<!DOCTYPE html><html lang=\"en\"><head><link href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css\"\
    rel=\"stylesheet\"integrity=\"sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65\"\
    crossorigin=\"anonymous\"></head><body><div class=\"container\"><header id=\"\
    main-header\" class=\"bg-info text-black p-4 m-4\"><div class=\"container\"><h1\
    \ id=\"header-title\">Appointments</h1></div></header><div class=\"row\"> \n\n\
    <div class=\"col-lg-6\">\n\n<div class=\"card card-body\"><div class=\"row border\
    \ border-black p-3\"><div class=\"col-2\"><button class=\"btn btn-info w-100\"\
    \ id=\"previousDate\">&lt;</button></div><div class=\"col-8\"><h2 class=\"text-center\"\
    \ id=\"displayedDate\"></h2></div><div class=\"col-2\"><button class=\"btn btn-info\
    \ w-100\" id=\"nextDate\">&gt;</button></div></div><div class=\"row border border-black\
    \ p-3\"><div class=\"col-3\">Go to date:</div><div class=\"col-9\"><input class=\"\
    w-100\" type=\"date\" id=\"gotoDate\" /></div></div><div class=\"row\"><ul id=\"\
    appointments\" class=\"list-group\"></ul></div></div></div>\n\n<div class=\"col-lg-6\"\
    \ id=\"appointmentForm\">\n\n<div class=\"card card-body\"><div class=\"row m-1\"\
    ><div class=\"col-md-4\"><label for=\"apmnt_desc\">Description</label></div></div><div\
    \ class=\"row m-1\"><div class=\"col-md-4\"><input type=\"text\" id=\"appointmentDesc\"\
    \ /></div></div><div class=\"row m-1\"><div class=\"col-md-4\"><label for=\"appointmentDate\"\
    >Date</label></div></div><div class=\"row m-1\"><div class=\"col-md-4\"><input\
    \ type=\"date\" id=\"appointmentDate\" /></div></div><div class=\"row m-1\"><div\
    \ class=\"col-md-4\"><label for=\"appointmentTime\">Time</label></div></div><div\
    \ class=\"row m-1\"><div class=\"col-md-4\"><select id=\"appointmentTime\"></select></div></div>\n\
    \n<div class=\"row m-1\">\n\n<div class=\"col-md-4\"><button id=\"save\">Save</button><button\
    \ id=\"delete\">Delete</button></div></div></div></div></div></div></div><scriptsrc=\"\
    https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js\"\
    integrity=\"sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4\"\
    crossorigin=\"anonymous\"></script><script src=\"script.js\" type=\"text/javascript\"\
    ></script></body></html>\n```\nListing 11‑1: index.html\n\nWe divide the main\
    \ panel of the app into two equal-sized columns, with the use of Bootstrap:\n\n\
    ```html\n<div class=\"row\">\n<div class=\"col-lg-6\">\n...\n</div>\n<div class=\"\
    col-lg-6\">\n...\n</div>\n</div>\n```\n\nOn the left part, we have the currently\
    \ selected date, broken down into hour slots. The hour slots are dynamically created\
    \ as list items (`<li>`) using JavaScript, as we will se later on. We also have\
    \ buttons to move to the next or the previous date, as well as a date picker to\
    \ move to any other date.\n\nOn the right part, we will display the appointment\
    \ details. There are two cases here that happen when we click on an hour slot:\n\
    \n* If the slot already contains an appointment, then the appointment details\
    \ are loaded on the right panel. We can update the appointment details (e.g. change\
    \ the date and time, or the appointment text) and press on the save button to\
    \ update the appointment.\n* If the slot is empty, then we can enter a new appointment\
    \ by filling in the details on the right panel.\n\nAll this is performed using\
    \ JavaScript; let’s see the full code, before breaking it down to explain:\n\n\
    ```javascript\nconst displayedDateEl = document.getElementById(\"displayedDate\"\
    );const previousDateEl = document.getElementById(\"previousDate\"); \n\nconst\
    \ nextDateEl = document.getElementById(\"nextDate\");\n\nconst gotoDateEl = document.getElementById(\"\
    gotoDate\");const appointmentForm = document.getElementById(\"appointmentForm\"\
    );const appointmentsListEl = document.getElementById(\"appointments\");const appointmentDescEl\
    \ = document.getElementById(\"appointmentDesc\");const appointmentDateEl = document.getElementById(\"\
    appointmentDate\");const appointmentTimeEl = document.getElementById(\"appointmentTime\"\
    );const saveEl = document.getElementById(\"save\");const deleteEl = document.getElementById(\"\
    delete\");//create initial appointment listconst createAppointmentList = function\
    \ () {for (let i = 0; i < 24; i++) {//create <li> elementconst item = document.createElement(\"\
    li\");const text = document.createTextNode(i);item.appendChild(text);appointmentsListEl.appendChild(item);item.addEventListener(\"\
    click\", handleClickOnHour);item.setAttribute(\"id\", \"hour_\" + i);item.setAttribute(\"\
    class\", \"list-group-item\");const option = document.createElement(\"option\"\
    );const text_option = document.createTextNode(i);option.appendChild(text_option);option.setAttribute(\"\
    value\", i);appointmentTimeEl.appendChild(option);}}clear appointments from listconst\
    \ clearAppointmentsList = function () {for (let i = 0; i < 24; i++) {document.getElementById(\"\
    hour_\" + i).innerHTML = i;document.getElementById(\"hour_\" + i).classList.remove(\"\
    active\");}}//update appointments listconst updateUI = function () {displayedDateEl.innerHTML\
    \ = displayedDate;clearAppointmentsList();//get appointments for displayed datelet\
    \ appointmentsInDay = appointments.get(displayedDate);if (appointmentsInDay !==\
    \ undefined) {appointmentsInDay.forEach((value, key) => {if (value !== undefined)\
    \ {document.getElementById(\"hour_\" + key).innerHTML = key + \" \" + value;document.getElementById(\"\
    hour_\" + key).classList.add(\"active\");}}}}//called when user clicks on an hourconst\
    \ handleClickOnHour = function (event) {//remove highlight from previously selected\
    \ hourdocument.getElementById(\"hour_\" + selectedTime).classList.remove(\"list-group-item\"\
    );selectedTime = event.target.id.substring(5);appointmentForm.style.visibility\
    \ = \"visible\";//get appointment description from Map and display it in text\
    \ boxlet tmp = appointments.get(displayedDate);if (tmp !== undefined) {if (tmp[selectedTime]\
    \ !== undefined) {appointmentDescEl.value = tmp[selectedTime];selectedDesc = tmp[selectedTime];}else\
    \ {appointmentDescEl.value = \"\";}}else {appointmentDescEl.value = \"\";}//update\
    \ appointment date and time controlsappointmentDateEl.value = getDateOnlyString(displayedDate);appointmentTimeEl.value\
    \ = selectedTime;//add highlight to newly selected hourdocument.getElementById(\"\
    hour_\" + selectedTime).classList.add(\"list-group-item\");appointmentDescEl.focus();}//update\
    \ appointment when user presses saveconst updateAppointment = function (appDesc,\
    \ appDate, appTime) {if (appointments.get(appDate.toDateString()) === undefined)\
    \ {//if there is no entry in the map for this date//->we save the appointmentappointments.set(appDate.toDateString(),\
    \ new Array());appointments.get(appDate.toDateString())[appTime] = appDesc;}else{//if\
    \ there is an entry in the map for this date//->first check if the time is emptyif\
    \ (appointments.get(appDate.toDateString())[appTime] === undefined) {appointments.get(appDate.toDateString())[appTime]\
    \ = appDesc;}else{//check if it is the sameentryif (areDatesEqual(selectedDate,\
    \ appDate)&& selectedTime == appTime) {//just update description without asking\
    \ userappointments.get(appDate.toDateString())[appTime] = appDesc;\n\n}\n\nelse{//ask\
    \ user to overwrite existing entrylet ret = confirm(\"Destination date and time\
    \ not empty. Overwrite?\");if (ret) {//insert entry to new locationappointments.get(appDate.toDateString())[appTime]\
    \ = appDesc;}elsereturn;}}}if (!areDatesEqual(selectedDate, appDate) &#124;&#124;\
    \ selectedTime != appTime) {//remove entry from previous locationappointments.get(selectedDate.toDateString())[selectedTime]=\
    \ undefined;}//if we moved the appointment to another date -> go to this dateif\
    \ (!areDatesEqual(selectedDate, appDate)) {displayedDateTime = appDate;displayedDate\
    \ = appDate;updateUI();}//remove highlight from previously selected hour\n\ndocument.getElementById(\"\
    hour_\" + selectedTime)\n```\n"
