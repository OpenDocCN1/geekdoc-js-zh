  md: '# # Testing iOS WebApps


    Be a yardstick of quality. Some people aren''t used to an environment where excellence
    is expected.


    — Steve Jobs


    After seeing how to optimize our web application in the last chapter, we now approach
    the test phase. After an introduction about lifecycles and agile testing approaches,
    we will see how to organize a test, first creating a use-case and then the assets
    needed for testing it.


    We will perform a test and then learn how to evaluate it using specific kinds
    of feedback, such as design or emotional feedback, and variables, such as the
    number of used touches, the number of mistakes, and the estimated time of arrival.


    # ## Web Development Lifecycles


    In application development, we can apply two major types of lifecycles: the waterfall
    lifecycle and the iterative-incremental lifecycle. The waterfall lifecycle is
    defined as a sequential development model with clearly defined deliverables for
    every phase. In the waterfall lifecycle, there is minimal feedback from one phase
    to another.'
  merge: -1
  pgno: 418
- img_proc: true
  md: '# CHAPTER 11: Testing iOSApps


    ![](img/7621e729711898868a82bc471fc9db3b_419_0.png)


    **Figure 11–1.** The waterfall lifecycle (left) and the iterative-incremental
    lifecycle (right).


    The iterative-incremental lifecycle is defined through cycles (iterative) developed
    in a smaller portion of time (incremental). Compared to a waterfall lifecycle,
    an iterative-incremental lifecycle enables more flexibility in accommodating new
    requirements of change. Figure 11–1 presents a graphical comparison between a
    waterfall and an iterative-incremental lifecycle. In the next section, we will
    see how to approach the test phase at the end of the implementation phase.


    # Web Application Testing


    In our simplified workflow, when we exit the development phase, we enter directly
    into the test phase. Particularly in iterative lifecycles, different levels of
    testing should occur at all stages of the process. As we now understand, project
    flows can be implemented with different lifecycles according to project context
    and requirements.


    As we will also learn, every project phase is overlapped by at least one other
    phase; this is also true for the test phase.


    In our workflow, as shown in Figure 11–2, the test phase is performed after the
    implementation as shown and before the release phase. It is used to conduct tests
    on performance, accessibility, usability, and more generally, on user experience.'
  merge: -1
  pgno: 419
- img_proc: true
  md: '# CHAPTER 11: Testing iOS WebApps


    ![](img/7621e729711898868a82bc471fc9db3b_420_0.png)


    **Figure 11–2.** The project approach: simplified version with the test phase
    only at the end of the flow.


    The testing approach depends on the nature of the web site or web application.
    Generally, in accordance with the specific moment in the project flow, we can
    choose different types of tests. In the next section, we will see agile approaches
    to tests, which are more comfortable for single developers or small development
    groups.


    # # Agile Tests


    In the first step of our project flow, we work with wireframes to implement an
    early version of our contents. From the wireframes, the next step is to create
    paper prototypes to get a better idea about both the content and layout of our
    future web pages.


    The paper prototype test is the first level of useful testing to determine whether
    our design is correct in terms of user experience. This type of test is inexpensive
    because it can be prepared and performed by a single designer without any specific
    tools. Paper prototype tests can identify both user interface design and content-related
    problems.


    A paper prototype test makes it easy to determine whether the user struggles with
    our interface by looking for a specific button or trying to orient him- or herself
    during a browsing session. Paper prototype tests can also show whether our content
    is in the right place and provides the right level of information to the user.


    Paper prototype tests are performed in the design phase before moving on to the
    development phase (Figure 11–3). These tests are usually performed by the designer
    and are based on the same sketch used to define the web site or web application
    design.'
  merge: -1
  pgno: 420
- img_proc: true
  md: '# CHAPTER 11: Testing iOSApps


    ![](img/7621e729711898868a82bc471fc9db3b_421_0.png)


    **Figure 11-3.** The paper test performed between the design and the implementation
    phases of the flow.


    The second level of agile tests is the electronic prototype tests. These tests
    are performed by the designers as a final step in the design phase. Because each
    step slightly oversights the next, this type of test can be prepared by the designers
    and performed by the developers. Electronic prototypes can also be prepared and
    used by both the designer and the developer, allowing the designer introduce the
    work to the developer who will use the electronic prototypes as the starting point
    for his/her job.


    If the electronic prototype runs on a mobile device, it offers virtually the same
    experience to the user and is reliable. It can also run on a desktop machine and
    provide a good level of feedback. The difference between a real mobile scenario
    and any other electronic prototype is the environment.


    ![](img/7621e729711898868a82bc471fc9db3b_421_1.png)


    **Figure 11–4.** A real environment can dramatically change the user experience
    (Image Miss HG).


    The environment can create significant differences in laboratory tests aiming
    to evaluate a real mobile experience (Figure 11–4). The best way to approach the
    problem is to perform preliminary paper prototype tests on the design, perform
    electronic prototype tests on the functions and services, and then develop an
    alpha version of the web site or web application to test in a real environment.


    These types of tests are virtually free because paper and electronic prototypes
    have already been produced as a regular step in the design phase of the project
    workflow.'
  merge: -1
  pgno: 421
