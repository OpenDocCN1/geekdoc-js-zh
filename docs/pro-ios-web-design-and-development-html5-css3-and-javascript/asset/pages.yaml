    # # Negative Space


    In Chapter 3, we began to understand why space in your interface and layout is
    such important consideration. Users perform actions using their fingers and need
    more physical space in order to interact with your interfaces in a comfortable
    way.


    In addition, as you learned in the previous section, consider that this means
    that every part of your interface you see is in relationship with a ground. To
    us as designers, the interface or layout is in close relationship with the space
    around it. Working with this space, you can dramatically change the emotional
    effect on the user and change the level of user experience.


    For our purposes, negative space, also known as whitespace, can be generally defined
    as the area of a certain page or interface not occupied by content. For a designer,
    negative space is the space between specific items on the page and does not have
    to be white or solid in color; it might contain gradients, patterns, or background
    objects.'
  merge: -1
