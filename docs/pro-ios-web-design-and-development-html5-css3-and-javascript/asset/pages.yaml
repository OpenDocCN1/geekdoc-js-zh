    # Some Javascript Best Practices


    Generally speaking, a program language has many rules that a developer must follow
    to write clean code. These rules specify what you must write to create a valid
    code. When we approach the best practice, we switch from what we write to what
    we should write in order to create high quality code. Essentially, best practice
    aims to achieve clarity, readability, and meaning.'
