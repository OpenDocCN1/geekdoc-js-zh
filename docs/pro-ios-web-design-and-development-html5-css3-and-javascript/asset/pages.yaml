    # HTML5 Re-Definitions


    Although HTML4 elements have been brought into HTML5 essentially unchanged, several
    historically presentational ones have been given semantic meanings (Figure 7–1).
    The WC3''s HTML5 redefinition redefines the elements shown in Table 7–1.


