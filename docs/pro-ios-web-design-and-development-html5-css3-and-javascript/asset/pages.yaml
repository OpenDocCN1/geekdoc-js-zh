    # Shrink and Group


    Sometimes there is also a situation where an element or portion of content can''t
    be removed or hidden. The typical situation is when this element or portion of
    content is very important to the secondary type of user and must be accessed quickly.
    In this case, you will use the shrink and group approach. To achieve a perfect
    level of organization in your groups, a scheme has to be developed. Shrinking
    an element or portion of content could mean visually reducing its size, and in
    doing so, reducing the impact of the user''s attention. The element or portion
    of content is still available but it doesn''t have a primary role in the message
    for the user anymore.


    ![](img/7621e729711898868a82bc471fc9db3b_238_0.png)


    **Figure 6–4.** The iTunes page: Shrinking and grouping in content design


    Figure 6–4 shows how the three portions of content are too important for the general
    understanding of the page to hide or take away from the design. The solution is
    to shrink it and group it below the main image, giving the user opportunity to
    read it easily, if necessary. In the element highlighted in Figure 6–4, designers
    from Apple applied the laws of similarity, proximity, and symmetry.


    As a last point, it is important to remember that for shrinking and grouping,
    sometimes you need to add, instead of take any element or a portion of content
    in your design.'
