  md: '# 416 CHAPTER 12: Maximizing the Market for iOS WebApps


    ![](img/7621e729711898868a82bc471fc9db3b_445_0.png)


    In Chapter 4, we discussed color psychology and the relationship between colors
    and users'' moods. Along with the right choice of colors and lines, it is important
    that the web site includes the following sections:


    +   - Functionalities. This is what the Web application can do for the user, stated
    clearly and directly. Functionalities can also be presented as a preview on the
    home page, as shown in Figure 12–2.


    +   - Version history. It is important take note of all updates and new functions
    implemented in the Web application to create a background for the developers and
    a reference for the users.


    +   - Tutorials. It is important that, on the web site, the user is able to find
    a tutorial, which will help him use all the major functions and services implemented.


    +   - About. When possible, it is important to give a clear representation of
    your team. Giving credit to the entire team will help your app look even more
    professional to your users.


    +   - Support. It is important to offer support to the user for any issues that
    may arise regarding the services and functions implemented in the Web application.
    Providing good support is key for any team that wants to create customers loyalty.


    +   - Social sharing options. It is fundamental to provide a social sharing option
    in order to let the user spread the news about the Web application. From all the
    options available, the Twitter and Facebook sharing options are a must; it is
    also important to offer Facebook-like buttons.'
  merge: -1
  pgno: 445
