    might even change the presentation order.


    Once the market research has told you which portion of your content will be included
    in your iPhone version, it''s time to move on to the next step of the process.


    # Structure


    Working on the iPhone native-like version, exactly as was done with the iPad native-like
    version, we can''t change the structure that structure is the strength of the
    native-like solution. As you saw in Chapter 2, the iPhone adopts a structure called
    "iPhone Page Model."


    The structure phase aims to achieve the following goals:


    +   - Apply the Original Brand to the iPhone Page Model

    It is important to develop a connection between the compatible and the iPhone
    versions, ensuring that the brand is carried across the design.


    +   - Offer the Prioritized Path to Contents

    If we want to retain a high quality user experience, you can''t insert all your
    content in the iPhone page model. You need to prioritize the content and choose
    the most important parts to include and leave the rest exclusively for the compatible
    version.


    +   - Use an Appropriate Link Structure

    The right link enables the user to access your content in a comfortable way, even
    if there is a large quantity of information.


    +   - Provide Orientation to the User

    In a mobile context, it''s easy for the user to lose his orientation inside our
    site map, and this probability is even greater when there is a lot of content.'
  merge: -1
