    # Summary


    In this chapter, we introduced the fundamental characteristics of a WebApp. First,
    using some examples, we saw how to set up a development environment, and then
    we introduced typical web application characteristics.


    We presented the most important iOS applications for a WebApp and how to interact
    with its services, presenting all the steps necessary for emulating a native-like
    environment.


    We introduced the touch event paradigm and how to use single- and multi-touch
    events for emulating a traditional mouse browsing session. We also saw more complex
    gesture events and how to prevent them in case we need to develop custom gesture
    handling for our WebApp.'
