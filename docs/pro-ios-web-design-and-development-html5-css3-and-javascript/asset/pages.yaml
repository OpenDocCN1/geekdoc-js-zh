    # # Javascript


    So far, using the HTML5 markup language, we have built the structure of our web
    site or Web application. We have then used the CSS3 style sheet to modify its
    visual presentation. Now it''s time to work on its behavior and it''s at this
    point Javascript comes into the picture. Javascript is a complicated subject that
    is difficult to cover comprehensively here, so this section is a crash-course.


    Javascript was developed in 1995 by the Netscape team and appeared for the first
    time in Netscape 2. JavaScript''s original name was LiveScript, but in 1996, the
    Sun Java Language was a big deal at the time, so Netscape and Sun worked out an
    agreement to change its name to JavaScript. In retrospect, this was a big mistake
    JavaScript and Java have nothing to do with each other; JavaScript is not based
    on Java and it''s not a light version of Java. Calling this scripting language
    JavaScript might have served some marketing purpose, but it also created a lot
    of confusion around it.


    In 1996, Microsoft had its own version for Internet Explorer 3, which was called
    Javascript. In 1997, Netscape submitted the language to the European Computer
    Manufacturers Association (ECMA) to create an independent and official standard
    edition that was called ECMAScript (ECMA-262), although in the IT world continued
    to call it Javascript. In 1999, ECMAScript 3 was published and in 2009 came ECMAScript
    5, retrocompatible with ECMAScript 3 versions of the language. Mobile Safari partially
    supports ECMAScript 5 from iOS4.3.2 whereas almost all new features are supported
    on iOS.'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# CHAPTER 7: Web Standards for WebKit: Maximizing Mobile Safari


    Javascript is a client-side scripting language for interacting with web pages.
    Unlike other non-scripting program languages, Javascript works only inside specific
    applications (for example, web browsers such as Safari Mobile). The operating
    system (such as iOS) runs the web browser, the web browser contains a page, and
    the page contains the Javascript. We can see this principle in Figure 7–14.


    ![](img/7621e729711898868a82bc471fc9db3b_320_0.png)


    Figure 7–14. Relationship between web browser, web page, and Javascript code


    Javascript is a scripting language and is intentionally limited, which means,
    for example, that it can''t access the file system, a database, or hardware. The
    reason for this approach that Javascript is not meant to be a general-purpose
    programming language, but is designed to manipulate web pages.


    When a user opens the browser and requests a webpage from a webserver, the webserver
    sends HTML and CSS back to the browser as plain text, letting the browser take
    care of interpreting, rendering, and finally displaying the final content. As
    discussed, Javascript is a client-side language, and this means that it works
    in the same way as HTML and CSS files: the webserver sends the Javascript to the
    browser, which then interprets and runs it. We can see these steps in Figure 7–15.


    ![](img/7621e729711898868a82bc471fc9db3b_320_1.png)


    Figure 7–15. Interaction between a web browser and a web server


    The client-side approach is opposite to the server-side approach that we have
    with languages such as PHP or Ruby on Rails, which are executed on the webserver
    and whose results are delivered to the browser.'
  merge: -1
  pgno: 320
