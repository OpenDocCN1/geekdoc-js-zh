  md: 'On one hand, mobile devices such as the iPhone changed the lifestyles of many
    users and introduced them to new ways of working or simply accomplishing ordinary
    tasks. Smartphones, before any other device, were responsible for pushing the
    enormous network growth I talked about, and these devices led one of the most
    exciting technology revolutions in computer history.


    It''s certainly true that some applications, such as YouTube, run perfectly on
    small displays, such as the iPhone''s screen; other applications, such as Netflix,
    look much better on the iPad''s 9.7-inch display. This, too, will contribute to
    the growth of broadband demand for video applications.


    Larger-format video is not the only important feature of a tablet like the iPad.
    In addition to their bigger displays, tablets also have a touchscreen interface
    and portable capabilities. Before tablets, the only mobile objects capable of
    sending and receiving data from the Internet were laptops, and to use one was
    a different experience for the user.


