  md: '# Transforms


    Transforms are used to modify the geometry of objects through mathematical operations.
    This property is fundamental for emulating some of the typical iOS effects between
    pages, and is used to create interesting visual effects and animations.


    In the transform property, a list of transform functions are used as values and
    are applied in the order provided. Exactly as they are for the other CSS3 values,
    the individual transform functions are separated by white space.


    The transform property works together with the transform-origin property to set
    the point of origin from where the transition takes place.


    Available transform functions are


    +   **matrix(number, number, number, number, number, number)**nSpecifies a 2D
    transform in the form of a transformation matrix (3X3) of six values. Matrix (a,b,c,d,e,f)
    is equivalent to applying the transformation matrix [a b c d e f]


    +   **translate(translate-value, translate-value)**

    Specifies a 2D translation by the vector [tx, ty], where tx is the first translation-value
    parameter and ty is the optional translation-value parameter. If <ty> is not provided,
    ty has a zero value.


    +   **translateX(translation-value)**

    Specifies a translation by the given amount in the X direction.


    +   **translateY(translation-value)**

    Specifies a translation by the given amount in the Y direction.


    +   **scale(number, number)**

    Specifies a 2D scale operation by the [sx,sy] scaling vector described by the
    two parameters. If the second parameter is not provided, it takes a value equal
    to the first.


    +   **scaleX(number)**

    Specifies a scale operation using the [sx,1] scaling vector, where sx is given
    as the parameter.


    +   **scaleY(number)**

    Specifies a scale operation using the [1,sy] scaling vector, where sy is given
    as the parameter.


    +   **rotate(angle)**

    Specifies a 2D rotation by the angle specified in the parameter about the origin
    of the element, as defined by the transform-origin property.


    +   **skew(angle, angle)**

    Specifies a skew transform along the X and Y axes. The first angle parameter specifies
    the skew on the X axis. The second angle parameter specifies the skew on the Y
    axis. If the second parameter is not given, a value of 0 is used for the Y angle
    (for example, no skew on the Y axis).'
