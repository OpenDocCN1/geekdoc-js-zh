  md: '# Abiding by the Golden Rules of Mobile Strategy


    Mobile is a different medium and is governed by a different set of rules. But,
    once you have defined an agile Information Architecture Process, you can start
    to approach the general architectural case abiding by some golden rules.


    # Understand Users and Their Needs


    Try to understand who the users are, what they are looking for from the web site
    or web application, and where they will be physically located when they use it.


    # Design with Mobility in Mind


    I have already discussed context instances, understanding that context is crucial
    when creating any mobile product. Predicting user contexts could be difficult,
    because it is impossible to anticipate all possible circumstances that could affect
    the user experience.


    Targeting mobile users ensures that your product can be used anywhere and at any
    time. Once you have the application''s goals clearly in mind, try to picture all
    possible application scenarios, and interview potential users about their usual
    mobile application contexts.


    # Don’t Convert, Create


    Simply porting a desktop site or web application to a mobile device is a big mistake.
    We must create a new product rather than imagine it for the small screen. Creating,
    rather than converting, experiences specifically for mobile devices enables users
    to get information faster and in a more friendly fashion.


    # Keep It Simple


    If there is a rule we must never forget, it is this: iPhone and iPad are intelligent
    computers, but people want to use them in a simple way. People use Apple devices
    (often) while they are doing something else like walking, talking, listening to
    music or speech, driving (please, don’t do that!), and so on. A human being’s
    cognitive resources are limited, and if we use part of those resources using some
    other functional activity, we won’t be able to manage complex structures like
    a typical desktop user interface at the same time. Following this principle, the
    more straightforward for your application is, the better the mobile experience
    of your users will be. If you understand this key point, you also begin to appreciate
    Apple’s decision to use iOS instead of a full version of OSX on the iPad.'
  merge: -1
  pgno: 50
