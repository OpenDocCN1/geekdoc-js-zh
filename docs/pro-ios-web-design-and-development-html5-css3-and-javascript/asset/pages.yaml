    # Think Inverted


    This section''s heading doesn''t say everything, and it probably doesn''t show
    any direct relationship with the iPad. The meaning behind this title could sound
    like: continue to think simple, by an inverted way (simple) approach. This defines
    an inverted approach arises from the intermediate position of this new device,
    between a pure mobile device like the iPhone and a pure desktop like an iMac or
    a Mac Pro. The term "inverted" stands for a different approach that requires an
    opposite approach to achieve the same goals achieved with the iPhone version.


    In the iPad native-like version, it is necessary to re-factor your thinking because
    of the new concepts behind the portrait and landscape orientations. In the portrait
    mode, the device presents a one-column layout, and in landscape mode, it presents
    a two-column layout.


    ![](img/7621e729711898868a82bc471fc9db3b_233_0.png)


    Figure 6–1. The achieving process of simplicity from a desktop and mobile point
    of view


    This means that you often need to use two opposite approaches for the same content
    in order to optimize both orientations. In the two-column design offered by the
    landscape orientation, you should use the left (small) column as support for the
    main content. The left column provides orientation to the user and makes it easier
    to browse complex sites or application contents.


    In the portrait orientation, the single-column design doesn''t have this navigation
    support, and for this reason, the user must access the left column as a pop-up
    menu, using the button placed in the header. This fact suggests a second CSS file
    for modifying the main content structure, including some design elements that
    will compensate for the missing left column. Providing some navigation information
    inside'
