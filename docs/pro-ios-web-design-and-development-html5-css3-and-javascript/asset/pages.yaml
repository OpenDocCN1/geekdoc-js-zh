  md: '# ONE WEB DEFINED


    The W3C defines the concept of One Web as follows:


    One Web means making, as far as reasonable, the same information and services
    available to users irrespective of the device they are using. However, it does
    not mean exactly the same information is available in exactly the same representation
    across all devices. The context of mobile use, device capability variations, bandwidth
    issues, and mobile network capabilities all affect the representation. Furthermore,
    some services and information are more suitable for and targeted at particular
    user contexts.


    From "W3C Mobile Web Best Practice 1.0," Chapter 3


    In accordance with the W3C standards, don''t be afraid to offer different versions
    of your content, because the content''s role is to bring a message to the users;
    for this reason, focus on offering the same (optimized) message and not necessarily
    the exact content.


    ![](img/7621e729711898868a82bc471fc9db3b_36_0.png)


    **Figure 1–4. The one-web paradigm visually**


    This concept is the same used in cross-browser design; unfortunately, many designers
    still believe designing a cross-browser website means achieving the same website
    look in all of the existing browsers.


    From a content-out point of view (and not only from that standpoint, the cross-browser
    design’s primary function is to make the same message available through different
    browsers.


    > NOTE: We explain in depth the content-out approach in Chapter 2.'
