  md: '# Content-Out Approach


    Web sites are created to deliver information. In the early days of the web, design
    played no part in a web site''s existence. Today, we still see content as the
    most important part of a web site or web application, and everything must start
    from here (as shown in Figure 2-7).


    The content-out approach is a ground-up approach where the content shows the designer
    how the final layout should be. The designers use the content to set the boundary
    of their possibilities and make the whole process easier and faster.


    ![](img/7621e729711898868a82bc471fc9db3b_51_0.png)


    **Figure 2-7.** HTML W3C compliant markup (left) and its semantic markup implementation
    (right) on the Wall Street Journal and **New York Times web sites**


    The content-out approach is closely related to semantic markup. The objective
    of this technique is to mark up the structure of the web content using the appropriate
    semantic elements. The elements are used according to their meaning, not because
    of the way they appear visually.


    From top to bottom, this is a generic hierarchy of semantic meanings.


    +   1. Navigation (main)

    2. Branding area

    3. Content main'
