    # The <audio> Tag


    The <audio> tag is the other important media tag introduced in HTML5. It enables
    us to play audio files with a native audio playback within the browser. The <audio>
    tag works in the same way as the <video> tag, although its attributes are a subset
    of the <video> tag. The <audio> tag has the following structure:


    ```

    <audio src="audioName.mp3" controls autobuffer></audio>

    ```


    In this example, we use one attribute to show the audio control to the user and
    one attribute to buffer the audio file in advance. Like some of the <video> attributes,
    these are attributes that don''t have a value to specify, as shown in the following
    example:


    ```

    // //HTML5 syntax

    <audio src="audioName.mp3" controls="true"></audio>

    // HTML5 syntax

    <audio src="audioName.mp3" controls autobuffer></audio>

    ```


    If you prefer an XML-like syntax, you can specify the attribute value, but it
    isn''t necessary. All of the attributes defined for the <audio> tag are reported
    in Table 7–5.


    # Table 7–5. Audio Tag Attributes in HTML5 (Ordered Alphabetically)


    | Attribute | Description |

    | --- | --- |

    | autobuffer | Boolean value to buffer the file in advance |

    | autoplay | Boolean value to automatically play the file |

    | controls | Boolean value to display the audio controls |

    | loop | Boolean value to repeatedly play the file |

    | loopend | Defines the ending point of a loop |

