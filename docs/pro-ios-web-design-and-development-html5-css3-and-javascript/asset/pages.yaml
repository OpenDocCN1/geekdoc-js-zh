  md: '![](img/7621e729711898868a82bc471fc9db3b_450_0.png)


    If you want to submit your Web, you need to register a developer account. From
    the developer dashboard''s sidebar, you can click the Submit New App button and
    fill in the form with all the Web application''s information. You also need to
    provide an App icon, choose the correct category, and specify whether your Web
    application is designed for iPhone and/or iPad and its price.


    OpenAppMkt is a great resource for a web developer, also providing revenue handling
    at an interest rate of 80–20%. This approach is similar to that used by the App
    Store. Figure 12-6 displays the Developer tab where you can upload your Web information.


    ![](img/7621e729711898868a82bc471fc9db3b_450_1.png)


    Figure 12-7. The Add to Home function of OpenAppMkt in action.'
