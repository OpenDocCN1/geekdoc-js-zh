    White on Black (right)


    The W3C WCAG 2.0 provides guidelines to make your web site or web application
    more accessible. Unfortunately, WCAG was not written with touch screen devices
    in mind, but most concepts behind the following points are reasonably applicable
    to both the iPhone and iPad.


