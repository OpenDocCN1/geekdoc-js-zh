  md: '# iPad-Compatible Version


    In this section, you will start to work on the compatible version, and then you
    will present the native-like one, with both versions following the same process
    used for the iPhone process.


    # Create a Canvas


    Once you''ve opened Adobe Fireworks, you''ll need to create a new document, using
    File >New (N).


    ![](img/7621e729711898868a82bc471fc9db3b_249_0.png)


    Your document should have the following canvas sizes:


    +   - Width: 768 (px)

    - Height: 1024 (px)

    - Resolution: 132 (ppi)


    This can, in accordance with the iPad 9.7-inch IPS display, uses a 132-ppi resolution.
    Remember that the iPhone, with its traditional LCD 3.5 display, uses 163 p on
    the standard display, and a 326-ppi resolution on the Retina display.


    > NOTE: The IPS (in-plane switching) is an LCD technology that aligns the liquid
    crystal cells in a horizontal direction. In this method, the electrical field
    is applied through each end of the crystal, but this requires two transistors
    for each pixel instead of the single transistor needed for a standard thin-film
    LCD (TFT) display.


    While most older LCD technologies on smartphones have a 35-degree viewing angle,
    the new IPS display offers the Apple users a viewing angle of up to 180 degrees.
    This technology can be found in the Apple iMac, iPad, and in the latest iPhone
    4 with its Retina display.'
  merge: -1
  pgno: 249
