    # The Canvas Tag


    The <audio> and <video> tags are two of the most important tags in the evolution
    of HTML5, and we use these tags often in our Web Site or Web application. The
    <canvas> tag represents a huge step forward in graphic capabilities for the web,
    as it enables Web developers to build many of the same events and effects that
    native applications have had for years. In spite of the downside of a GPU overhead,
    we can use dynamic images to save bandwidth and reduce image latency.


    # HTML Canvas vs. SVG; Pixels vs. Vectors


    HTML5 Canvas and Scalable Vector Graphics (SVG) are both web technologies that
    enable us to create rich graphics in the browser, but they are fundamentally different
    from each other.


    The HTML5 specification is a Javascript API that enables us to code programmatic
    operations. Canvas, by itself, enables a web developer to define a canvas context
    object, which can be drawn. We can also insert images (for example, .png or .jpg)
    and anything else the browser is capable of loading.'
