  md: 'CHAPTER 3: Web Development for iOS Devices


    # Make a Minimum Use of DOM


    As we previously said, DOM generation is slow and expansive, so it is important
    to remember not to abuse it, or to overuse and scatter it about instead of using
    operations.


    # Always Test Any Element


    We can''t simply trust any data that come in. An example of how to avoid this
    is to test data that get into our function as to its format using typeof, or to
    test availability of DOM elements before altering or using them.


    # Use JavaScript only to Add Behaviors


    While writing your JavaScript code, it is hard keep track of the quality of the
    HTML we produce. We know in any case that JavaScript aims to implement behaviors
    in our web site or WebApp, and for this reason, if we find ourselves creating
    lots of HTML in JavaScript, we might be doing something wrong.


    # Develop Code for Humans First


    As good as, at points in the development process we always optimize our code.
    It is important to remember that live code is done for machines, and development
    code is done for humans, so we don''t want to optimize prematurely and punish
    ourselves or the other developers who have to take over from us.


    # Browser Support for Standards: WebKit and Safari


    When developing web sites or WebApps for the iPhone and iPad, the browser represents
    the foundation of all our projects. The Apple browser was developed over the WebKit
    browser engine, and uses web standards like:


    +   - HTML, HTML4, XHTML, XHTML-MP


    +   - CSS, CSS2


    +   - JavaScript


    +   - AJAX


    +   - SVG


    +   - Other technologies for text, video, audio, etc.


    Think of Safari as being like your best friend (and maybe it is, since you will
    spend time in front of this browser than with all your real friends); the better
    you know it, the less you will have problems with it.'
  merge: -1
