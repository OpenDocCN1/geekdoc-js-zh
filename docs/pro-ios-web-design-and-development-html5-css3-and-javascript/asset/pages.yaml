  md: '![](img/7621e729711898868a82bc471fc9db3b_213_0.png)


    Once you have sketched your idea using pen and pencil and redesigned it using
    a stencil, you are ready to compose your view using a tool. In the next section,
    you will see how to use a tool to transform your original sketch into the final
    design using Adobe Fireworks.


    # Design Using Tools


    When the idea is clear in your mind, move to the second step of the process, which
    is designing a version of your views using tools. For our project, we chose Balsamiq
    Mockups (we inserted links to the appropriate web pages at the end of the chapter
    for all the other tools used in this program).


    Balsamiq is a zenware program, meaning it helps you get “in the zone” and stay
    there. Balsamiq is the perfect program for the second step of the interface design
    process (Figure 5–4).


    > NOTE: Zenware means zen software that helps you get focused, achieve the ultra-productive
    state known as flow, and stay there. The goal of zenware is to disappear, supporting
    you when you need it but staying out of your way as much as possible. You should
    forget the software is at all.


    This program offers almost the same speed and rough feel like sketching with a
    pencil, but with the advantage of the digital medium. For example, enlarging containers
    is just a drag operation, rearranging elements doesn’t require starting over,
    and your wireframes will be clear enough that you’ll be able to make sense of
    tomorrow.'
