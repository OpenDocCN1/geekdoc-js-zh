    # Reading Pattern Guideline


    So far, we have presented the F and Z paths, the most common user reading patterns.
    We saw how, in some cases, it can be useful to change these patterns in order
    to achieve specific goals.


    Eye-tracking studies have revealed valuable information about how people read
    and interact with websites and web applications. What we can learn from these
    studies are some tactics to optimize our interfaces.


    These tactics are summarized as follows:


    +   - Logo in the Top-Left Positions Work Best

    As we in the first part of this section, the user has been trained over the years
    to look in the upper left part of a page for specific kinds of information, as
    brand logos. Only famous brands, well-known throughout the world and recognized
    immediately by the user, have the option to break this rule.


    +   - Tagline under the Logo Improves General Page Understanding

    This is related to the previous point. When the user looks at the logo, a tagline
    underneath him a better understanding of the logo and a better chance of understanding
    the content, and will be less likelihood of leaving the page.


    +   - Navigation at the Top of the Page Works Best

    As primary navigation, a horizontal navigation bar works better than a vertical
    one on the side.'
