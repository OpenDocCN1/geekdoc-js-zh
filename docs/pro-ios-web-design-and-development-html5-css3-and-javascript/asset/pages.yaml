  md: 'What you do, to an even greater extent than you did in the iPad native-like
    version, is to prioritize your content for the native-like structure. This time,
    only the most crucial elements of the content will be available to the user. A
    link to the desktop version guides him/her to the other parts if needed.


    > NOTE: We always try to avoid deep mobile sites (mobile) user can easily lose
    his orientation. For some reason, you have no choice, it is important to use an
    appropriate navigation structure and to show clearly the navigation path using
    a breadcrumb or other technique as described in the Chapter 2.


    Starting from top to bottom, we find the Branding area (Figure 4–43, number 1)
    and inside this area, we design the breadcrumb in order to provide orientation
    to the user. Semantically speaking, the Branding area also contains the part below,
    called the “hero image”(Figure 4–41, number 2). The hero image visually represents
    the main message of the page and changes to one of the other images each time
    user loads the page. In this case, you have three hero images available.


    ![](img/7621e729711898868a82bc471fc9db3b_204_0.png)


    Below the Branding area, you design the Content area, adopting edge-to-edge navigation
    (Figure 4–41, number 3) with three basic options. Because the iPhone version is
    loaded automatically, you need to give the user ability to switch back to the
    compatible version, or if he/she needs it, direct access to the support page.
    In case the user needs to enter the store, he can touch the first link and the
    store homepage will load.


    > NOTE: In modern web design, you always try to avoid intro pages but in this
    case we keep the structure of the original design that offers a big visual message
    using an introductory page.


    At the end of the page, you have the Site Information part. You use the same approach
    used by Apple in mobile pages, like MobileMe with a minimalist approach, inserting
    only the Apple logo without any kind of supplementary information.'
