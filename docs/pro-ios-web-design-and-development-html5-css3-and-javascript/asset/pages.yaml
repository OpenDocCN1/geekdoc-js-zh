    According to this three-way scheme, some of the terms that are used to describe
    colors are:


    +   * Hue

    The actual color of an object. Green is a hue, as are red, yellow, blue, purple,
    and so on.

    * Intensity

    The brightness or dullness of a color. Adding white or black to a color lowers
    its intensity. An intense and highly saturated color has a high chroma.

    * Saturation

    The degree of purity of a hue. Pure hues are highly saturated. When gray is added
    the color, a color has a high chroma. Adding shades of gray to a hue becomes desaturated.

    * Chroma

    The purity of a hue in relation to gray. When there is no shade of gray in a color,
    a color has a high chroma. Adding reduces its chroma.

    * Luminance

    The measure of the amount of light reflected from a color. Adding white to a hue
    makes it lighter and increases its value or luminance. Consequently, adding black
    makes it darker and lowers the value or luminance.

    * Tone

    The result of adding gray to a hue. Shades and tints are tones at the extremes.

    * Shade

    The result of adding black to a hue to produce a darker hue.

    * Tint

    The result of adding white to a hue to produce a lighter hue.


    In Figure 4–21, you can observe the Munsell color scheme and see how value, hue,
    and chroma work together.'
