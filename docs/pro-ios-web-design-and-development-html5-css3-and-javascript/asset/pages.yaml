  md: '# Organize Levels


    Your design will be deployed on a few levels. For this reason, the first thing
    to do is to create some folders to organize your assets and keep your environment
    clean. Using a semantic approach, create the following folders.


    +   - iOS ui

    - Branding Area

    - Content Area

    - Info Area

    - Background

    - Templates


    ![](img/7621e729711898868a82bc471fc9db3b_220_0.png)


    Figure 5–12. Adobe Fireworks: a semantic structure for the asset''s folders.


    The first folder, called “iOS ui", will contain the Status Bar and the Bottom
    Bar. The next folders –Branding, Content, and Info Area—will contain the WebApp.
    Below these folders, create two levels called “Background” and “Templates.\ Inside
    the Branding, Content, and Info Area, add two more folders, called “Text” and
    another called “Icon."'
