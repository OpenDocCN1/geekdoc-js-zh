    Next, we see how to manipulate canvas objects.


    # Manipulate Canvas Objects


    Besides the possibility to draw some complex shapes, canvas also provides some
    advanced operations to transform, scale, or rotate canvas objects. In Table 7–14
    and 7–15, we can see the methods used for these advanced operations.


    **Table 7–14.** The HTML Canvas: Advanced Methods and Operations


    | Method | Description |

    | --- | --- |

    | translate(x,y) | Moves the origin by the amounts of x,y |

    | scale(x,y) | Scales drawing operation by multiplies x |

    | rotate(angle) | Rotates subsequent drawing operations by angle |


    In addition to the built-in transforms in Table 7–14, we can also define our transformation
    using the two methods in Table 7–15.


    **Table 7–15.** The HTML Canvas Custom Transformation Methods


    | Method | Description |

    | --- | --- |

    | transform(a,b,c,d,e,f) | Adds the given transform to the current one |

    | setTransform(a,b,c,d,e,f) | Sets the current transform to the given amounts
    |


    Canvas also has a setting for the default compositing method that determines how
    new content is drawn onto the canvas surface. We have 12 different compositing
    methods listed in Table 7–16.


    **Table 7–16.** The HTML Canvas Compositing Methods


    | Method | Description |

    | --- | --- |

    | source-over | Adds the shape on top of the existing content. |

    | source-in | Shape is drawn only where both shapes overlap. |

    | source-out | Shape is drawn only where two shapes don''t overlap. |

    | source-atop | Shape is drawn only where there is overlap in the content. |

    | lighter | Color values determine color of overlapping shapes. |

    | xor | Shapes are transparent where both overlap. |'
