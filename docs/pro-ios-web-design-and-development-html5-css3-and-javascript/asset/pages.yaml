    # Complex Shapes


    We have seen how to draw simple shapes and now we draw shapes with more complexity,
    as paths. A path is a set of points, like a straight line is a set of points in
    mathematics.


    A path can be either open or closed; a closed path has an end point that is the
    same as the start point. A context can have one and only one current path. In
    Table 7–11, we can see the methods that operate on a type of path called *arc*.
    Arcs are curves that are a portion of a circle; a circle is considered a 360-degree
    arc.


    Table 7–11. The HTML Canvas Arc Methods


    | Method | Description |

    | --- | --- |

    | beginPath() | Begins a new set of path-drawing operations. |

    | arc(x,y,r,sA,eA,cC) | Adds an arc to the current path. The arc starts at x,y
    with a radius of r, a starting angle of sA and an ending angle of eA. The aC is
    false if the arc is clockwise. |

    | arcTo(x1,y1,x2,y2,r) | Adds an arc to the current path that starts at the current
    position. The arc has a radius of r. |

    | closePath() | Closes the current drawing path. |


    Note: Angles are in radians.'
