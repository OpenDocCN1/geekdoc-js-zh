  md: "We want to prevent this behavior because links used in a WebApp are typically\
    \ dedicated to internal navigation, and we want to prevent the user from using\
    \ it and going outside it. If this rule is set to none, the user can hold any\
    \ link or image as long as he/she without getting the default Safari behavior.\n\
    \n# Native Scrolling Emulation\n\nOne of the most important features available\
    \ from iOS5 (beta2) is support for the new CSS rule for overflow-scrolling. Until\
    \ now, there was a noticeable difference in momentum scrolling between a native\
    \ app and scrolling a native-like WebApp. This behavior was an obstacle for those\
    \ who wanted to emulate the native look-and-feel of iOS applications.\n\nThis\
    \ new rule provides a native way to scroll content inside a fixed size (width\
    \ and height) HTML element—instance, the main <div>—and to reduce or eliminate\
    \ the GPU overhead caused by the implementation of custom scrolling. An implementation\
    \ of this rules:\n\n```\n.scrollableElement {\n  overflow-y: scroll;\n  -webkit-overflow-scrolling:\
    \ touch;\n}\n```\n\nThe position—and overflow—scroll rules will change the layouts\
    \ we are designed on iPhone, taking another important step forward in the native\
    \ look-and-feel emulation process.\n\n# iOS Service Interaction\n\nService interaction\
    \ is one of the drawbacks of developing web applications instead of native applications.\
    \ Previously, we introduced the pros and cons of this choice; in this section,\
    \ we will focus only on what we can do and how we can achieve it.\n\nA WebApp\
    \ is likely to interact with the most important, and most used, services provided\
    \ by iOS: Phone, Mail, SMS, and Maps. This type of user interaction is made using\
    \ the <a> tag, with every other ordinary link in our web page, and has the following\
    \ structure:\n\n```\n<a href=\"protocolServiceScheme:protocolParameter>linkName</a>\n\
    ```\n\nIn the next section, we will see how to implement these special types of\
    \ links for an extra level of interaction to our WebApp.\n\n# The Phone Application\n\
    \nWe can add a link to the Phone application using the following link syntax:\n\
    <a href=\"tel:1-305-555-5555\">Call 1-305-555-5555</a>"
