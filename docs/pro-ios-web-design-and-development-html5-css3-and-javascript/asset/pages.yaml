  md: '# CHAPTER 3: Web Development for iOS Devices


    ![](img/7621e729711898868a82bc471fc9db3b_97_0.png)


    Figure 3–13. A Dedicated WebApp: The use of Spaces in the Gmail page is iPad Oriented.


    These sites and applications are marked using HTML5, CSS3, and offer user interaction
    through JavaScript, but use these standards in a very basic way without supporting
    the latest features offered by the WebKit browsing engine, and offering hardware
