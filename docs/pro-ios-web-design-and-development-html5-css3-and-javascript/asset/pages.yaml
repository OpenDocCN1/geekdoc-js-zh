  md: '# # Chapter 8


    # # Native iOS Environment Development


    > > My goal wasn''t to die the richest man in the cemetery. It was to go to bed
    at night saying, we''ve done something wonderful.


    - Steve Jobs


    In this chapter, we will see how to work in an iOS environment, how to emulate
    it in our WebApp, and how to optimize its use.


    First, we will set up an environment for testing our work on a local network.
    Next, we will introduce a viewport and see how we can optimize it for developing
    full-screen WebApps. We will explain how to create a spring board icon, as in
    native applications, and how to customize a startup image.


    We will specify the JavaScript code for redirecting a user from a desktop to our
    iPhone WebApp and from our iPhone WebApp to a desktop, and explain how to emulate
    native link and design element behavior once a user has approached our WebApp.


    We will also see how to interact with iPhone features, such as phone, mail, and
    GPS, and how to handle user gesture interaction and device orientation change.


    # ## Setting up the Environment


    Before placing a WebApp on a public, live web server, it is better to work in
    a private environment, using a server on a desktop computer. This configuration
    will make the development and testing phases easier.'
