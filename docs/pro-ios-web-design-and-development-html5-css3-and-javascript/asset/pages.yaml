  md: '# CHAPTER 4: User Interface Design for iOS Devices


    ![](img/7621e729711898868a82bc471fc9db3b_157_0.png)


    Figure 4-6. Law of Proximity in two-column design.


    The Law of Similarity states that elements in the perceptive field are perceived
    as part of the same entity based on its geometry, color, or dimension. You can
    use this to create consistency in design between non-proximal elements.


    ![](img/7621e729711898868a82bc471fc9db3b_157_1.png)


    Figure 4-7. Law of Similarity in Site menu and in products detail.


    The Law of Continuity states that elements in the perceptive field are perceived
    as joined into a single entity with a pattern and a direction. You can use this
    to create and add visual patterns and connections to the design.


    ![](img/7621e729711898868a82bc471fc9db3b_157_2.png)


    Figure 4-8. Law of Continuity in cover flow design.'
