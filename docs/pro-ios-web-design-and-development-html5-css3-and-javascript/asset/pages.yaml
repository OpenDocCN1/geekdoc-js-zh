- img_proc: true
  md: 'The Law of Closure states that some kinds of elements in the perceptive field
    are perceived as a certain form, even if some visual information is missing. We
    can use this rule to create visual forms or elements into design which physically
    it not possible. In Figure 4–9, you can see how all corners are physically opened
    (red circles in Figure 4–9), but the mind, using the Law of Closure, fills this
    information gap and perceives continuative lines (and forms).


    ![](img/7621e729711898868a82bc471fc9db3b_158_0.png)


    Figure 4–9. Law of Closure in layout design.


    The Law of Common Fate states that elements with the same direction in the perceptive
    field are perceived as a single moving entity. You can use this rule to create
    movement and add direction to the design.


    ![](img/7621e729711898868a82bc471fc9db3b_158_1.png)


    Figure 4–10. Law of Common Fate in spotlight design.


    The Law of Figure Ground Relationship states that Elements in the perceptive field
    are perceived as the union of its form with its background. You can use this rule
    to create connection between single elements, create dominance, and add contrast
    to design.'
