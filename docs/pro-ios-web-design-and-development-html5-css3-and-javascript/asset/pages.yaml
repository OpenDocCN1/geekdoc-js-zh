  md: '# From Desktop to Mobile


    The history of computing has had five main cycles according to Morgan Stanley
    (shown in Figure 1–1): mainframe computing (1960s), micro computing (1970s), personal
    computing (1980s), desktop Internet computing (1990s), and mobile Internet computing
    (2000s). Looking at the mobile Internet computing era, you can identify the reasons
    for this evolution.


    ![](img/7621e729711898868a82bc471fc9db3b_31_0.png)


    **Figure 1–1.** Technology cycles in computing history


    First, the new touch screen increases the interface’s usability while reducing
    the frustration of mobile web browsing. Second is the incredible evolution of
    social networks such as Facebook and Twitter. Third are the new VoIP services
    that stand as attractive alternatives to traditional 2G and 3G cellular communication,
    which has been the new cheap data plans local ISPs have offered in the last few
    years.


    The iPhone is at the center of this process because it catalyzed these three factors
    (pioneering some of them) and as you can see from Figure 1–2, it has gained and
    maintained its dominant position on the market month after month. This is another
    good reason for starting to design and develop for the iPhone and iPad today.
    The time invested learning a language such as Objective-C (for native applications)
    or web standards (for web applications) is surely worth the effort in a short
    period of time.'
