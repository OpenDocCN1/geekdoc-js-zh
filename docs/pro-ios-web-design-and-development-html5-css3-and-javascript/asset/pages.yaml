  md: '# A Mobile-Oriented Approach


    Design and development for mobile devices requires a small change of paradigm;
    technologies involved are different, user interfaces are different, and even environmental
    conditions are different because most of the time, your applications and services
    are used outdoors and not in a quiet comfortable room.


    Despite that, the only suggestion that you always need to keep in mind is common
    and obvious: Try to walk in the shoes of mobile users and everything will be fine.


    In Part II of this book, we work with iPhone and iPad; for now, we show you some
    general points to remember in approaching the mobile-oriented paradigm for touch.


    # Mobile-Oriented Guidelines


    To work with the issues that mobile site design presents and to get a result that
    is as user-friendly and useful as your standard site, some creative problem-solving
    skills are required, including:


    +   - Understanding the hardware and software available

    - Giving the user the feeling of visiting the standard site

    - Giving the user the option to visit the standard site

    - Designing for both portrait and landscape views

    - Including only important content from your standard site

    - Prioritizing your content for a linear user experience

    - Optimizing your navigation for fingers

    - Optimizing your code to reduce bandwidth usage

    - Minimizing the use of images to reduce bandwidth usage

    - Ensuring your redirects work properly

    - Testing, testing, and testing!


    Your goal as designer and developer is to build One Web, where the same information
    is available and optimized for different devices, as detailed in Figure 1–4.'
