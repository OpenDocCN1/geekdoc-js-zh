  md: '# CHAPTER 5: iPhone UI Design: Think Simple


    In our design project flow, we used the view we created for “The Store” home page
    in designing two other views, “The Store” shop page and “The Store” shop iPhone
    page. We encourage you to implement this reuse approach in all your future projects.


    ![](img/7621e729711898868a82bc471fc9db3b_228_0.png)


    Figure 5–19. “The Store” use case: the three iPhone views.


    In our process, we reused the view we designed for “The Store” home page to design
    two more views. This helped give a more tangible feeling about the final WebApp
    would look like. The other views we designed are “The Store” shop, “Shop” page,
    and “The Store” shop iPhone page.


    Looking at Figure 5–19, you can see a few small differences between the home page
    and the other two pages. This is because we wanted to create dominance in the
    home page using a bigger Hero Content page based on an image carousel. Achieving
    this result was possible thanks to the only three text entries in the Main Menu.
    In this way, both the Hero Content Area and the Main Menu are in the Visible Area
    and do not require users to scroll.


    ![](img/7621e729711898868a82bc471fc9db3b_228_1.png)


