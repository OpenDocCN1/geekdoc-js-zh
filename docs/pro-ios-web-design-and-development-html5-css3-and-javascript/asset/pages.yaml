  md: '# CHAPTER 11: Testing iOS WebApps


    ![](img/7621e729711898868a82bc471fc9db3b_428_0.png)


    **Figure 11–9.** One-to-one relationship between two textual entries and two paper
    prototypes.


    Each paper prototype represents a view of a specific moment in the test in the
    same way frame is a view of a specific moment in a movie clip. Paper prototypes
    always use some colors for reducing the gap in between the perception of a simple
    piece of paper and a real image of a fully working device. A good approach is
    to use the Pantone Color Chart if you use a graphic program for choosing colors
    and design of your papers, or a Pantone pen if you use a handmade approach.


    # # Electronic Prototype


    Electronic prototypes are designed and developed as the last step before jumping
    into the implementation phase. As long as you haven''t skipped this phase you
    should have an electronic prototype ready for the test phase.


    Generally, an electronic prototype doesn''t offer 100% of the functionality that
    the final release provides; the goal of this test is to perform checks in order
    to prevent errors and their propagation in the implementation phase.


    Nevertheless, in a web context, the electronic prototype is based on the same
    technology as the final release (HTML5, CSS3, and JavaScript), so this type of
    prototype is very close to the final product that will be released (and is shown
    in Figure 11–10).'
