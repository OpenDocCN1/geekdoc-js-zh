  md: '# Maximizing the Market for iOS WebApps


    > Talent wins games, but teamwork and intelligence wins championships.


    Michael Jordan


    In this chapter, you will learn how to promote a WebApp. You will see how using
    some specific approaches can help guarantee that the WebApp has good visibility,
    even before it''s released on the net.


    We will talk about Beta Tester invitations and about press releases; you will
    see the benefits of creating a web site for the WebApp and how to create awareness
    using video social networks, such as YouTube.


    We will also show you how to submit the WebApp to the Apple WebApp Portal and
    what other options the net offers in addition to the official Apple portal. Finally,
    we will discuss monetizing your WebApp and services you can use for doing so.


    # Use Your Mobile Strategy


    Previously, in Chapter 2, we worked on a mobile strategy and discussed how this
    strategy is important in order to achieve goals and mitigate mistakes, ultimately
    creating a successful project. The keys to a winning marketing plan is knowing
    exactly what your Web application has to offer and the profile of your potential
    users. This is why the mobile strategy elaborated in the early phase of your project
    becomes crucial at this point.


    Using the information gathered while developing your mobile strategy, you are
    able to better market your Web application, targeting a specific range of user
    profiles. Chapter 12 introduces some of the best approaches for doing this.'
  merge: -1
  pgno: 442
- img_proc: true
  md: '# How to Promote Your WebApp


    Assuming that your mobile site is on track and you know the range of user profiles
    you want to target, you can consider how to promote your WebApp. As you will see
    in the following sections, various techniques can be used in order to reach a
    wider range of potential users.


    These techniques can change according to the state of development of the Web applications.
    In the early phase of release, Beta Innovations for both tests and introducing
    the Web application to a small number of important users. As shown in Figure 12–1,
    once the Web application is ready, you can design a Web site to create an identity
    and/or create a YouTube channel where you can insert tutorials about the most
    important features.


    ![](img/7621e729711898868a82bc471fc9db3b_443_0.png)


    Figure 12–1. A WordPress theme to promote native and WebApps (source: image from
    Templating).


    At this point, the Web application is ready to be released to the press on Apple-oriented
    blogs and inserted in some major WebApp portals where you can gain visibility
    among potential users. Once the Web application is live on the major WebApp portals,
    it''s time to use the viral nature of social networks to create positive hype
    around your Web application.


    # Use Beta Iteration Tests


    The first step in your marketing plan begins even before the Web application is
    released. After the alpha tests are performed internally by the designers and
    developers, the Web application enters the beta test phase where real users test
    it in their own environments.'
  merge: -1
  pgno: 443
- img_proc: true
  md: '# CHAPTER 12: Maximizing the Market for iOS WebApps


    The Beta Invitation Phase involves a small group of users, chosen for their profile
    and potential connections with other users. This kind of user is chosen because
    he/she represents a significant profile for testing the Web application; he/she
    also has important connections with potential users that are not reachable through
    other channels of communication.


    In your Web application, it would be a good idea to create an account in advance
    for the Beta Tester and send this and other information to the user before he/she
    approaches the Web application. This will create a more comfortable environment
    for the tester and will help him contextualize all the services and functions,
    decreasing his learning curve.


    A good choice for a Beta Tester could be a designer or a developer from another
    team, a user involved in a specific business who can spread the word about the
    Web application, or an important blogger or journalist. A testimonial to this
    strategy is Walter S. Mossberg, an American journalist and technology columnist
    for The Wall Street Journal, who always receives a version of the latest device
    from Apple before it is actually released to every Apple Store. In reality, the
    role Mossberg plays in the equation is more like a Beta Reviewer than a Beta Tester,
    the concept behind the Apple strategy is the same.


    # Use Press Releases


    The press is the first link for all types of news, and digital news is no exception.
    It''s important to distribute press releases during your launch to Apple-oriented
    blogs on the net. You must be sure to provide a complete description and screenshots
    of crucial functions for your MyApp, making sure that details are not left in
    the hands of the blogger.


    # Create a Web Web Site


    Creating a site or Web application means spreading word of its identity over the
    Internet, being indexed by search engines, and representing a point of support
    for every potential user. Many designers and developers overlook this step in
    both native and Web application processes, which is a serious mistake. A web site
    is one of the best communication channels for every type of application.


    When designing a web site, it is important that you keep the identity of your
    Web application and the primary user''s target profile in mind so that you are
    not pursuing your personal design tastes. In this phase, the choice of colors
    and the type of lines that will be used in the design are crucial. Creating an
    aggressive design for primarily female Web application might work against you
    in your promotional campaign.'
  merge: -1
  pgno: 444
