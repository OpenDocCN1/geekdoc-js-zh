    role is played by Breadcrumbs that link to many other (relevant) pages. On the
    other hand, an internal link is a link that, instead of pointing to a different
    web page, points to the web page itself.


    # Images


    Search engines see web pages as text pages, which means they don’t understand
    images. Images have a fundamental role in our web sites and WebApps because human
    beings understand images better than text. For this reason, we never avoid images
    in our projects.


    The point here is to rely on images when we need to give meaning to the web page.
    For example, don’t insert text messages in our images, as calls-to-action or important
    titles. The role of the image is to support the content with a different, and
    possibly more powerful, series of symbols which readers can interpret.


