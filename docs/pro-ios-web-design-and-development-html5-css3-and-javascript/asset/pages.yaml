  md: '# CHAPTER 11: Testing iOSWebApps


    Once we introduce the order to the user, we show him the first and initial page
    view (Figure 11–11), represented by “Page 01” in Figure 11–9 as we saw earlier.
    We ask the user to voice his thoughts during his experience and for every action
    he performs. The tester records all comments describing the user experience.


    ![](img/7621e729711898868a82bc471fc9db3b_431_0.png)


    Figure 11–12. Paper prototype test: the textual description used to describe the
    paper test.


    The user interacts with the paper prototype while the role of the tester is to
    replace the paper view with one relative to the user’s action. In our example,
    if the user touches the Support link, the tester replaces the paper represented
    by Page 01 with the new landing paper view represented by Page 02, as in Figure
    11–13.


    ![](img/7621e729711898868a82bc471fc9db3b_431_1.png)


    Figure 11–13. Paper prototype test: tester changes the paper views (Image Samuel
    Mann).


    In the optimum case, the prototype test will finish when the user is able to achieve
    his task, and in the worst case, when he quits. In any case, the tester must record
    the user’s experience, describing how the user achieved a task or why he failed.'
  merge: -1
