    # # What Is an Interface?


    As designers, you are familiar with the concept of *user interface*, but there
    are many kinds of interfaces all around us. Anytime we have an object we want
    to control or interact with, there is some kind of *interface* between this object
    and ourselves. The interface gives us a simple method to achieve our goal.


    > **DEFINITION:** Interface

    Point of Interaction between two systems.'
