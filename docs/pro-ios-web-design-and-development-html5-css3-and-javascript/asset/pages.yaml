    # Multi-touch Events


    In contrast, there are two-finger touch events, not as often used in a browsing
    session, but equally important in order to provide a solid level of user experience.
    Table 8–6 shows the two-finger touch events.


    Table 8–6. Standard DOM Event Classes for Recognizing iOS Two-finger Touch-based
    Events.


    | Description | Finger Gesture | Mouse Event |

    | --- | --- | --- |

    | User pinches a design element in or out | Double (separate) touch | (None) |

    | User touches a non-scrollable element and pans the display | Double (separate)
    touch | mousewheel |

    | User touches a scrollable element and pans the display | Double (separate) touch
    | onscroll |


    Two of the three two-finger touch actions represented in Table 8–6 are visually
    represented using flow charts in Figure 8–10.'
