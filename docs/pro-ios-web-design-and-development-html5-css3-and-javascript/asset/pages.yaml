  md: '# 5. Perform test session.


    We need to run the test to verify the use-case requirements.


    # 6. Debrief test.


    We need to debrief the test with the user and with the observers.


    # 7. Evaluate test.


    We need to evaluate the test according to the use-case requirements.


    # 8. Create findings and recommendations.


    We need to provide findings and recommendations that will drive designers and
    developers to improve the project.


    These eight steps require us to choose the users according to the application
    profile. However, we don''t know how many users we need in order to gather reliable
    data for the test. We answer this question in the following section.


    # How Usability Problems Affect Users


    We can define a problem as something that is difficult to deal with, solve, or
    overcome. Testing a project usually means finding something can represent a problem
    for the user.


    If we choose the "right" user for our use-case, even a single user test will give
    us reliable information to improve our project. However, no matter how "right"
    one user can be, their voice will still remain in the crowd. The risk that a user
    performed a certain action by accident or was influenced by personal un-representative
    contexts is too high to create an entire test based on a single piece of user
    feedback.


    The logical conclusion might be to add as many users as possible to discover as
    many problems as possible. While this approach may look like the right one, it
    is not. Those who have some probability and statistic know that there is a value
    that represents the best ratio between effort and result and behind this the result
    is minimal with the effort. For this reason, choosing a large group of users will
    not be the best approach to the problem.


    It''s best to choose a smaller group as a sample size to discover as many problems
    as possible. This path brings us to Jim Lewis, who published a study in 1982 that
    how binomial distribution can be used to model the sample size. This study was
    supported by Robert Virzi in 1992. Virzi found that 80% of usability problems
    are found by the first four to five users and that severe problems are more likely
    to be discovered by the first few users.'
