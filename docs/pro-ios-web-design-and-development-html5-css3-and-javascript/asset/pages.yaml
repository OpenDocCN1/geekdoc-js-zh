    # SDK Development Model


    In 2002, Apple launched Mac OS X, and at that time it made a complete suite of
    application development tools available to every user of the Macintosh. Since
    the appearance of OS X version 10.3, called Panther, those tools have been presented
    as parts of an integrated development environment called Xcode. All OS applications
