  md: '# Heat Map Tests


    Another type of test that is easy and inexpensive to set up and perform is the
    heat map pseudo test. We use the prefix "pseudo" because the real heat map test
    requires tools for eye-tracking that most development teams don''t have (Figure
    11–5).


    As a workaround for this lack of technology, we can use one of the online services
    (for example, Feng-GUI) offered by companies that use heuristic algorithms as
    a replacement for real eye-tracking. These heuristic algorithms are usually accurate
    and, along with their usability and accessibility, provide good feedback.


    Typically, the process for using an online heat map service is standard and includes
    the following steps:


    +   1. Register an account for the heat map service.


    +   2. Insert the absolute path or upload a print-screen of the web page.


    +   3. Download the heat map in an image format.


    Some services are similar to Google analytics and offer a script to insert into
    web pages. While logged into our account, we can check the web page statistics
    and see the heat maps. This type of service should be considered accurate because
    we can analyze the web page over over time with real users.


    ![](img/7621e729711898868a82bc471fc9db3b_422_0.png)


    **Figure 11–5.** The eye-tracking test (left) and the corresponding heat map (right).


    We introduced the heat maps technique in Chapter 4 to analyze reading patterns
    to show the basics of a good design and what can negatively influence the user
    experience. The point is that heat maps can reveal a design mistake and give early
    feedback during the design phase. By watching a heat map, we can determine if
    the user’s attention might be hijacked by some unwanted design element. By using
    a heat'
  merge: -1
  pgno: 422
- img_proc: true
  md: '# CHAPTER 11: Testing iOS webpages


    map, we can test our design element hierarchy and check whether the reading pattern
    correctly follows the content.


    We should also note that a heat map is less informative in a small display context
    such as the iPhone, compared to the 9.7-inch context of an iPad. Despite this
    shortcoming, a heat map still offers important information about our design to
    prevent design-error propagation in the project flow.


    # Organizing a Test


    Every detail of every test must be planned and organized in order to produce reliable
    feedback. The agile approach we chose is based on *artifact recycling*, allowing
    us to work on ideas and assets that we used for previous workflow phases. The
    artifact recycling approach contributes to keeping the preparation phase as lean
    as possible. In the following sections, we will see how to plan and create use-cases
    and how to perform a test.


    # Creating Use-Cases


    The main thing to remember is that paper prototypes (shown in Figure 11–6) are
    design oriented and work best in design tests, which means they provide more reliable
    feedback on design details. Electronic prototypes can also give feedback on design
    details, which they implement at specific levels of some or all of the functions
    and services offered by the web site or application, they are mostly used to collect
    feedback about functions and services.


    ![](img/7621e729711898868a82bc471fc9db3b_423_0.png)


    **Figure 11–6. Developing paper views for use-cases (Image Resenfeld Media).'
  merge: -1
  pgno: 423
- img_proc: true
  md: 'The first step in the preparation phase is to create a use-case. When working
    on a web site or application, we can picture a browsing session with specific
    user action path. Perhaps we want to test the contact page is easily reachable
    or whether a specific service is useful. Imagination and experience are your best
    friends in this phase.


    Typically, use-cases are used in combination with use-case diagrams to better
    understand the project requirements in the analysis phase. In this test, this
    combination still offers the best results because the diagram can be seen as a
    graphic summary of the use-case, providing an idea of "who does what" and "who
    interacts with what", while the description provides a better understanding of
    the individual steps involved in the interaction between the actor (user) and
    the system (user interface, server, and so on).


    # Creating a Typical Use-Case


    Now we are facing a fork in the road because designers and developers typically
    possess different background knowledge and use different tools. Not all designers
    know UML, whereas almost all developers know this modeling language; it is used
    in almost every object-oriented project.


    For those who don''t know this book, the UML-text case approach covers everything
    one needs to present and organize a test; familiarity with the tools offered by
    UML will definitely help in both the analysis and test phases of the project flow.


    UML is beyond the scope of this book. However, in this chapter, we will present
    two ways to represent a use-case: textually and visually. In this section, we
    will present the textual way to represent a UML use-case, while in the next section
    we will do visually, using diagrams.


    > NOTE: UML stands for Unified Modeling Language and is a standardized, general-purpose
    modeling language used in software engineering. UML includes various types of
    visual models, but for our purposes, we present only two of them:


    Textual use-case

    Use-case diagram


    A simple book that can introduce you in simple terms to all the tools offered
    by the Unified Modeling Language is UML Distilled, by Mike Fowler.


    For more information, visit http://martinfowler.com/books.


    When working with this, we usually represent a use-case using both textual and
    graphical tools. If you work as a single designer or developer, you can choose
    which tool you prefer, assuming that you have every aspect and detail of your
    project clearly in mind.'
  merge: -1
  pgno: 424
- img_proc: true
  md: 'CHAPTER 11: Testing iOS WebApps


    The easiest and most intuitive to create a use-case is the textual way. The first
    step is to write the header for your use-case, choosing the title that corresponds
    to the user''s task, the level of detail, the actor, and the device, which identifies
    the context. "The Main Successful Scenario" is the title of our use-case. The
    second step is to define the *scenario* by writing the body of our use-case in
    a numbered sequence of steps, where the *actor* (user) performs a number of actions
    to achieve his or her goals. Every step represents an interaction between the
    system (user interface, server, and so on) and the actor (user). The following
    is an example of a textual use-case taken from our Apple Store use-case.


    # Call the Apple Store Support


    **Level:** Sea level (a.k.a. User goal level)


    **Actor:** User


    **Device:** iPhone


    +   1. The user browses the menu by selecting the Support link.

    2. The user browses the menu by selecting the Contact Us link.

    3. The user browses the menu by selecting the "1-800-275-2273" link.

    4. The device asks for confirmation of the call to the number "1-800-275-2273."

    5. The user makes a call to Support.


    In a use-case, there are five different levels of detail, shown from top to bottom
    in the following list:


    +   1. Cloud level (Summary goal)

    2. Kite level (Summary goal)

    3. Sea level (User goal level)

    4. Fish level (Sub-functional goal)

    5. Clam level (Sub-functional goal)


    We can work on a different level of detail by setting a different level, as shown
    in the following example:


    # Call Support


    **Level:** Kite level


    **Actor:** User


    **Device:** iPhone


    +   1. The user goes to the Contact page.

    2. The user clicks the Support number.'
  merge: -1
  pgno: 425
- img_proc: true
  md: 'CHAPTER 11: Testing iOS WebApps


    +   3. The device asks for confirmation.


    +   4. The user calls Support.


    ![](img/7621e729711898868a82bc471fc9db3b_426_0.png)


    In the first phase of our project flow, called analysis, the textual use-case
    was employed to identify the requirements of our project, but it can now be re-used
    in the test phase to compare the expected behavior from the textual use-case with
    the real user’s behavior from the prototype test. Each entry in our textual use-case
    should match the actions performed by the user to complete the task. Figure 11–7
    illustrates the use-case called “Call the Support.".


    # # Creating a Use-Case Diagram


    A use-case diagram is a visual representation of the system boundary and its interactions
    with the external world. Those who interact with the system from the external
    world are the actors. An actor can be either a user or another system.


    The system is represented by a square or rectangle that shows the system boundaries.
    Every use-case is represented as an oval that encompasses the name of the use-case.
    The actor is represented by a stylized human, with an identity below it.


    The use-case diagram uses a factorization approach'
  merge: -1
  pgno: 426
- img_proc: true
  md: 'CHAPTER 11: Testing iOSApps


    ![](img/7621e729711898868a82bc471fc9db3b_427_0.png)


    **Figure 11–8.** Use-case: comparison between the diagram and the textual description.


    In our example, the Contact Support use-case includes another use-case called
    "Make a Call.". If we refer to the Sea Level Detail of the textual description,
    the Contact Support use-case represents points 1 and 2, whereas the Make a Call
    use-case represents points 3, 4, and 5. In the Kite Level Detail, only point 1
    belongs to the Contact Support use-case whereas points 2, 3, and 4 belong to the
    Make a Call use-case.


    Use-case diagrams play a functional role in the test phase through organization
    and offering a visual reference to each test.


    # Creating the Assets


    When the textual use-case and the use-case diagram are ready, we can begin to
    work on the test assets. We need to prepare two different types of assets: one
    type for the paper prototype and one type for the electronic prototype.


    # Paper Prototype


    Paper prototypes are directly inspired by, or even recycled from, the paper prototype
    used in the design phase. Basically, we need to design a paper prototype for each
    step of our use-case, which means that paper prototypes and numbered points from
    the textual description have a one-to-one relationship, as illustrated in Figure
    11–9.'
