  md: '# Headline Must Grab Attention in Less than 1 Second


    You need to grab the user attention in a fast way and get to the point instantly.


    # Headlines Draw User''s Eyes before Pictures Do


    If you use a strong headline, you can dominate any other influence, even from
    images. In Figure 4-27, you can see how the headline "iPod Touch" has been reduced
    to a light weight compared with the image in order to avoid interfering with it.


    # Pure Reading Patterns Are Appropriate Only "Above the Fold"


    Today, scrolling a page is not the source of frustration and confusion it was
    in the 90s. With a touch-screen device, the user is able to scroll down a page
    faster than he/she ever could with a mouse. This means that reading patterns "below
    the fold" have become more unpredictable. If your design works because of certain
    eye movement patterns on the part of the user, you must be sure that every important
    element of your design is in the first visible part of your WebApp where the user
    "reads" using a higher degree of focus on the content.


    # User Scans Only the First Words of a Headline


    This means that long headlines don''t work well. In these cases, the user scans
    the first few before deciding whether to continue reading. For this reason, it''s
    important to front-load the headlines with the most interesting and provocative
    words.


    # People Scan the Left Side of a List of Headlines


    This is related to the previous point. When presented with a list of headlines
    or links, the user will scan down the left side of the list, looking at the first
    couple of words, to find something he/she is interested in. The user will not
    necessarily read each line from beginning to end. For the same reason we discussed
    before, you need to insert the most-catching words up front.


    # Bigger Font Size Improves the User Experience


    If the user is not forced to zoom in and out, his/her level of frustration decreases
    and, inversely, the user experience is improved. Implementing this approach with
    an iPhone is not always possible when designing an iPad-compatible WebApp, this
    is an important requirement to remember.


    # Short Paragraphs Encourage Reading


    Big blocks of type look imposing and difficult to read. For this reason, it''s
    better to organize the content into a flow of ideas rather than large, distinct
    paragraphs.'
