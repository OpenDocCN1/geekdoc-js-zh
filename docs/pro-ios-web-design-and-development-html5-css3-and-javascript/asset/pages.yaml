  md: '# Aesthetic


    When we work on a mobile version of a site like the Apple Store with a strong
    brand and a lot of sexy visual appeal and great design, the aesthetic phase becomes
    the easiest part of job. In these cases, what we need to do is keep the look-and-feel
    of the desktop site and adapt it for the smaller screen without running it.


    The (layout) rules in a native-like version are even more strict than those in
    the iPad version. Here there is little room for fancy design but the laws of perception
    still exist to offer your user a better visual hierarchy and a pleasant look.


    ![](img/7621e729711898868a82bc471fc9db3b_205_0.png)


    Figure 4-42. The iPhone native-like(re)design of our Apple Store use-case.


    The Branding area keeps the style of the Sidebar Main Header (Figure 4-35, number
    4) designed for the iPad compatible version with the breadcrumb sitting below
    that. We always insert the hero image in the Branding area. Below that, we apply
    the same style to the Content area.


    Usually, designers don''t use much space to display an image in an iPhone version
    because the limited available room in a 3.5-inch device is often perceived as
    a problem to solve instead of an opportunity. With this re)design, we want to
    break this rule and we are happy to report that the latest (native) application
    called Apple Store and developed by Apple uses this same approach.


    # Interaction


    If the Aesthetic phase is limited by the strict layout rules of the native-like
    structure, the same rules make it much easier to work on the Interaction phase
    because they offer some standard structures that have been specially developed
    to enable the user to have a comfortable interaction with the mobile device.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '![](img/7621e729711898868a82bc471fc9db3b_206_0.png)


    Exactly as we did for the iPad version, we just need to test the right offered
    by the native-like environment. If the user touches a link intending to access
    a specific piece of information and is successful, this means that your interface
    works correctly and you did a good job. If this doesn’t work, you can inserting
    different interface parts, as you might with pieces in a jigsaw puzzle, until
    everything works correctly (at least inside the test context) and you have created
    a semantically correct structure.


    # Deliverable


    At the end of the process, if you created compatible iPad and iPhone versions
    in your project, you might have the option of sending all the deliverables together
    to the developer team but this is possible only when working on small projects.
    For a larger project, and where possible, it is always preferable to create some
    sort of parallel workflow between the different parts of the team.


    # Tools for User Interface Design


    Tools used in this chapter are both application and web application types. Table
    4-3 lists some of the useful tools that you can use for designing your next user
    interfaces.'
