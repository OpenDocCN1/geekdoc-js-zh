    # Another Step Forward: UMTS Device


    The third-generation (3G) systems promised faster communications services, including
    voice, fax, Internet anytime and anywhere, with seamless global roaming. 3G technologies
    were an answer to the International Telecommunications Union''s IMT-2000 specification
    and were originally supposed to be a single, unified, worldwide standard, but
    in practice the 3G world has been split into three camps: UMTS, CDMA2000, and
    TD-CDMA.


    > NOTE: The UMTS standards are as follows:

    - **UMTS**: Based on W-CDMA technology, it is the solution generally preferred
    by countries using GSM, centered in Europe. UMTS is managed by the 3GPP organization
    also responsible for GSM, GPRS, and EDGE.


    +   - **CDMA2000**: -CDMA2000: Based on an outgrowth of the earlier 2G CDMA standard
    IS-95. CDMA2000''s primary owners are centered outside the GSM zone in the Americas,
    Japan, and Korea. It is managed by 3GPP, which is separate and independent from
    UMTS''s 3GPP.

    - **TD-CDMA**: This technology is being developed in the People''s Republic of
    China by the companies Datang and Siemens.


    The first (pre-commercial) 3G network was developed in Japan in 2001 and supported
    144 Kbits of bandwidth with high-speed movement (e.g., vehicles), 384 Kbits (e.g.,
    campus), and 2 Mbits for stationary use (e.g., in-building).'
