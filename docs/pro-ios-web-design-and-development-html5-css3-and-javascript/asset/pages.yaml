    In Figure 6–2, you can see how the main target user is not distracted from the
    message behind the design, but the advanced user is also satisfied with all of
    the specifics; note that this type of strategy works well because the advanced
    user is not frustrated when looking for content, due to the fact that they don''t
    have to scan a web site or web'
