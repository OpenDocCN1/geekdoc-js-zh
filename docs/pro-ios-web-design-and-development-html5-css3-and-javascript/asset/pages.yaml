  md: '# HTML Canvas


    # Advantages


    +   - High 2D drawing performance

    - Constant performance level on fixed canvas dimensions

    - Option of saving the resulting images as png or jpg


    # Disadvantages


    +   - No DOM nodes for drawn elements

    - No animation API

    - Poor text-rendering capabilities


    # SVG (Scalable Vector Graphics)


    # Advantages


    +   - Resolution independent

    - Built-in animation support

    - Full control of each element using SVG DOM API


    # Disadvantages


    +   - Introduce (DOM) rendering latency


    In terms of practice implementations, the bottom line is that, other than in HTML
    Canvas+SVG approach (as in applications where we can render raster graphics dynamically
    using canvas and animate them with (SVG), HTML Canvas should be used to generate
    raster graphics. SVG, on the other hand, should be used for resolution-independent
    user interfaces and highly interactive animations.


    # The Canvas Element


    The HTML Canvas element provides web pages with a place (a canvas) where, using
    Javascript code, a Web developer can draw free-form graphics of all kinds, such
    as lines, shapes, images, and even texts on-the-fly. The downside is that once
    we draw something in the <canvas>, they become part of the page''s DOM and the
    Javascript engine forgets them.


    A web page can have more than one <canvas>, and these can overlap and be used
    beside other standards like SVG. When we draw an object in the <canvas>, the coordinate
    system starts at the upper left, with increasing value of x going from left to
    right and increasing value of y from top to bottom, as shown in Figure 7–2.'
