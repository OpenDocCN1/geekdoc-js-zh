  md: '# CHAPTER 3: Web Development for iOS Devices


    NOTE: Until all the CSS modules reach recommended status, every browser vendor
    has the faculty to decide how to implement those properties. For this reason,
    a proprietary prefix is placed in front of every property.


    The point of vendor-specific prefixes is to let other rendering engines know that
    the property can be safely ignored without creating an error, and at the same
    time the developer know that those properties are experimental and not fully supported,
    even if planned by the W3C.


    Once CSS has been completely defined, supported, and officially becomes a Web
    Standard, all these prefixes will be removed.


    An example is:


    ```

    border-radius: 3px;

    -webkit-border-radius: 3px; (WebKit-based Browser implementation)

    -moz-border-radius: 3px; (Gecko-based Browser implementation)

    ```


    Safari (and other webkit based browsers) have supported border-radius with the
    -webkit-prefix version 3 (no longer needed from version 5 onward).


    At present, when working with desktop web sites and WebApps, we need to specify
    the same property several times, at least once for each of the most common browsers,
    in order to achieve a minimum level of CSS property accessibility.


    > NOTE: In our Apple devices context, the only thing we need to do is take care
    of WebKit CSS implementation, because we will only use WebKit-based browsers like
    Safari.


    # Border Radius


    Achieving rounded borders using CSS2 coding can be tricky, and as we well know,
    iOS has rounded borders everywhere. Numerous methods are available, but none is
    terribly straightforward. This requires us to use additional markup and to create
    individual images for each border.


    Using CSS, creating a rounded border is incredibly fast and easy. As shown in
    the Table 3-4, we can apply this property to all corners or to individual corners,
    and width and color are easily altered.


    The CSS syntax is:


    ```

    -webkit-border-radius: <length>;

    ```'
