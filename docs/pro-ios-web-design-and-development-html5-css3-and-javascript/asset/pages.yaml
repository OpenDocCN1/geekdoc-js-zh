    # # New Technology, New Usability, and New Opportunity


    When the first iPhone was launched in 2007, the mobile community benefited from
    a device that was able to provide a new browsing experience. Before 2007, surfing
    on a cellular phone or any other mobile device wasn''t nearly as pleasant as it
    is today. As a result, the mobile market began to grow with incredible speed,
    and even four years later, it’s still growing rapidly.


    In 2007, the only way to develop software for Apple’s new device was to write
    applications, but many countries weren’t ready for this type of revolution. With
    the exception of the HTML5 cache feature, all web applications are, to some degree,
    dependent on Internet access, and many countries weren’t able to offer inexpensive
    24/7 contracts to satisfy users’ new requirements, thereby limiting the device’s
    enormous potential.


    In 2008, Apple released its first SDK, and the second-generation iPhone. At the
    same time, the iPhone app store opened its doors to thousands and thousands of
    native applications. These new applications brought new patterns for old tasks,
    offering a new and improved level of user experience. The enhanced usability of
    these applications changed user habits and created new habits, taking the iPhone
    where no cellular or mobile device had been before.


    The revolution had begun but until 2010, when Apple introduced the iPad. The last
    barrier represented by the iPhone’s small 3.5-inch display was finally overcome.
    The new 9.7-inch, multitouch display of the iPad boosted the level of user experience,
    setting a new standard for browsing the net. It was able to hit markets that the
    iPhone, because of its small display, had been unable to reach.


    The iPad revolution is visible every day. Doctors, professors, lawyers, and musicians,
    as well as companies such as airline companies and car factories, have incorporated
    the'
  merge: -1
  pgno: 458
- img_proc: true
  md: 'new tablet into their daily activities or retail products, increasing the quality
    of their jobs and creating new types of activities.


    The new and improved level of usability and user experience makes it possible—the
    first time in the history of computers—to bring electronic devices to all categories
    of users, even those that previously previously unreachable. One category is children.
    For them, using a multitouch-based interface is more natural compared to using
    mouse-based interface. This enables tablets to be used early on, for many types
    of school activities in which, for cognitive and logical reasons, using a PC would
    be impractical, as shown in Figure 13–2.


    ![](img/7621e729711898868a82bc471fc9db3b_459_0.png)


    Figure 13-2. The new opportunities offered by a multitouch-technology device (image
    source: the LMUIALA School of Education)


    Another category is that of older users—people who have never used a PC before
    in their lives or struggle to use it. I''m sure that you can come up with an example
    of a parent who has been unable to surf the net before getting his hands on an
    iPad and who immediately afterward started surfing with no problem. My mother
    was one such person. She had never been able to use a PC, and now she surfs the
    net like a geek, watching news channels on YouTube, checking weather forecasts,
    and reading the local newspaper.


    However, the multitouch revolution is far from complete, and in keeping with this
    revolution, the next step in this process will occur when these small mobile devices
    encourage the creation of larger touchscreen-based systems, which will ultimately
    enter our work and home environments. The computer-saturated future that we have
    become accustomed to seeing in sci-fi movies and television series is perhaps
    not so far away as we might think.


    # How the Multitouch-Screen Revolution Will Change Next-Generation Computing


    The world is in the middle of a mobile network revolution. In this revolution,
    we can identify two distinct forces: smartphones and tablets. This conclusion
    might seem obvious, but its implications are deeper than you might think.'
