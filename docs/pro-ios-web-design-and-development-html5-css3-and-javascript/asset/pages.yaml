    where sx is given as the parameter.


    +   - scaleY(number) specifies a scale operation using the [1, sy] scaling vector,
    where sy is given as the parameter.


    +   - rotate(angle) specifies a 2D rotation by the angle specified in the parameter
    about the origin of the element, as defined by the transform-origin property.


    +   - skew(angle, angle) specifies a skew transformation along the X and Y axes.
