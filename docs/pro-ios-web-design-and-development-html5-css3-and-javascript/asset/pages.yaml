    # # Summary


    In this chapter we worked on optimization. In the beginning of the chapter, we
    established the proper way to work on performance-oriented optimization by first
    explaining how to write and produce good images and then learning how to compress
    our WebApp.


    In the second part of the chapter we worked on usability optimization and introduced
    two types of approaches and tests also standardized in UML (Unified Modeling Language).
    We also saw problems really affect our users and how to choose the right user
    sample for our purposes.


    The third part of the chapter dealt with offline applications, and we saw how
    to use the Manifest File to cache single or multiple files of our WebApp.


    In the final section we worked on a search engine oriented optimization which
    we first introduced the concept behind the Mobile SEO and then introduced an anatomy
    of a search engine. We ended by working on the part of our web pages that needs
    to be optimized to make it search engine friendly.


    We also introduced the concept behind the famous Google algorithm and we saw how
    a tool like Google Analytics can help us to gather important information that
    can be used to plan the right mobile strategy and make important decisions on
    our WebApp.'
