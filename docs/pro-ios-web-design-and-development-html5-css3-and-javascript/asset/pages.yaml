  md: '# CHAPTER 10: Optimizing iOS WebApps


    # 367


    ![](img/7621e729711898868a82bc471fc9db3b_396_0.png)


    **Figure 10-4.** The CSS Sprite techniques used for Design Checkbox in the iWebKit
    Framework


    To use the CSS Sprite technique, we first group two or more images into a single
    background image, then we set by CSS the single image width and height, and finally
    we adjust the background position using the CSS margin rule to display the portion
    necessary. With this approach we can use a single background image and display
    several different graphics (single images) with it, thereby saving server requests
    and speeding up page load times.


    ```

    /* from framework style.css stylesheet */

    input[type="checkbox"] {

    width: 94px;

    height: 27px;

    background: url(''../images/checkbox.png'');

    -webkit-appearance: none;

    border: 0;

    float: right;

    margin: 8px 4px 0 0;

    }

    ```


    ```

    input[type="checkbox\]:checked {

    background-position: 0 27px;

    ```


    The CSS background rule shows every image from the coordinates 0px, 0px; this
    guarantees that if we set a height of 27px, the OFF state would showed by default.
    In this case, the Sprite technique shows the ON state with an offset of 27px,
    demonstrated by the second CSS rule.


    If we use many images for our user interface, the CSS Sprite technique can help
    to reduce the global loading time of our web pages and avoid the typical white
    flash of the traditional rollover technique. Because the image loading time is
    larger than the rendering time, using a traditional rollover technique creates
    a white flash every time the browser loads the image for the first time.'
