    # # Summary


    In this chapter, we introduced the concepts behind frameworks and we saw how a
    framework approach and structure in the development phase gives useful building
    blocks to the developer.


    In the second part, we examined the web development model, its pros and cons,
    and four different ways to approach WebApp development. We also analyzed what
    the difference for the user of a WebApp, comparing native and WebApp user (and
    developer) experiences. Webkit and Safari were introduced, and we presented the
    typical device limitations and constraints and introduced the inside cross-platform
    concept.


    In the third and last part of this chapter, we looked at the SDK development model,
    introducing Xtools, Objective-C and the Cocoaa Touch framework. By illustrating
    the native application life cycle, we also saw how the use of other open source
    tools like PhoneGap allows us to develop a native application starting from a
    WebApp that was developed using web standards.'
