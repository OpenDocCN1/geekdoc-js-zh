  md: '+   **Community (optional).** It is important to provide a place where developers
    can meet each other, share, and grow together. This option is only for open source
    projects where developers work from different places without the opportunity to
    meet face to face.


    +   **Blog (optional).** It is important to update the development status of the
    Web application. An active blog gives a positive image to the users, and acts
    as good support, helping to create return customers.


    The best examples of application web sites are from those dedicated to native
    iOS applications because the need to sell behind a native iOS applications developers
    to adopt this technique before comparing iOS developers; a good example is provided
    by the Twitterific web app site, as shown in Figure 12–2. The benefits are the
