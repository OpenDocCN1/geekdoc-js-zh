  md: 'the main content, you will be able to reduce the access to the left column
    through the

    pop-up menu, and increase the quality of the user experience.


    In the iPad-compatible version, re-factoring is necessary because you will need
    to apply some rules from the mobile (touch)

    environment in order to optimize the user touch experience. Desktop and mobile
    rules,

    before the iPad lived and were alive in two separate worlds. In this kind of

    design, you will merge two types of approaches, like the desktop and the mobile

    one, using a common background that is based on the simplicity concept. Before
    the

    iPad came out, these two types of approaches pointed in opposite directions.


    As can be learned from the chaos theory, sometimes making things requires

    more complex procedures in the design phase. As you will see in the next section,

    sometime you will need to add features to reduce complexity and make a patternnsnspler.


    # Inverted Simplicity


    How can you use simplicity to point in a direction, in order to achieve your design
    goals,

    which point in the opposite direction? Examples of this concept are prioritizing
    the

    content (mobile approach), keeping a desktop-like structure (desktop approach),
    or

    presenting the content with a desktop structure (desktop approach) and a mobile-

    orient structure (mobile approach). Each case is an example of two forces that
    point

    in opposite directions.


    Now you will see, one more time, how the simplicity concept will be a fundamentally

    common factor between apparently different things, and you will see that your
    design

    gools influence these opposite forces to point in the same direction.


    > NOTE: The simplicity theory is a cognitive theory that seeks to explain the
    attractiveness of some

    kind of human-environment interaction with human minds. This theory claims that
    interesting

    situations appear simpler than expected to the observer. A well-known implementation
    of this

    theory is Ockham''s razor (from the name of the English logician and theologian,
    and Francis

    friar, William of Ockham).


    From a cognitive perspective, simplicity is the property of a domain that requires
    very little

    information to be exhaustively described. The opposite of simplicity is complexity.


    The Google home page is the perfect example of inverted simplicity—how to present
    a

    very complex thing in a very easy way. Marissa Mayer, vice president of Search

    Products and User Experience at Google said,"Google has the functionality of a
    really

    complicated Swiss army knife, but the home page is simple, elegant, and can slip
    in

    your pocket."'
