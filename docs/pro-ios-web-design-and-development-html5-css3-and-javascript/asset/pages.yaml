    # Next-Generation User Experience with Touchscreen and Multitouch Technology


    The key term in the title of this section is “user experience." Multitouch technology
    brings to everyone—private users and professional developers alike—new benefits
    and opportunities. The impact of this type of technology has been so great that
    we may think of it as a revolution in the history of electronics. Figure 13-1
    shows some examples of new application environments available on multitouch devices.


    At first glance, the basis of this revolution seems to be multitouch-screen technology,
    but as you previously learned in this book, everything happens in the user''s
    mind. From this point of view, a touchscreen is merely a trigger, not the event.
    The event is the change in the user''s experience.


    This improved level of user experience comes from the new multitouch paradigm,
    where the mobile user is able to utilize through the development of multitouch-screen
    technology. This advancement has fundamentally changed the relationship between
    the environment and the user. This is the evolutionary chain of the new multitouch
    user experience.'
