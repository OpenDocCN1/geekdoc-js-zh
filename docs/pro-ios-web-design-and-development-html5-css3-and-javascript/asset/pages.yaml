  md: '# Chapter 10


    # # Optimizing iOS WebApps


    > "Perfection is achieved not when there is nothing more to add, but when there
    is nothing more to take away."


    — Antoine de Saint-Exupéry


    This chapter is about web optimization and search engine optimization (SEO). First
    we talk about iPhone and iPad compatibility, and then we show how to optimize
    the performance of a WebApp. We also suggest some rules for optimizing the code,
    reducing HTTP requests, and minimizing DOM access.


    We demonstrate how to compress a WebApp, optimize its usability, and make it capable
    of working offline. Finally we look at a mobile SEO approach to WebApps, analyzing
    first the anatomy of a search engine and then exploring how to implement a search
    engine oriented design. We also look at the principles behind the Google algorithm
    and some useful mobile SEO tools.


    # ## iPad and iPhone Compatibility


    Beside the fact that the user experience is totally different between iPhone and
    iPad users, most of the concepts behind good optimization are common to both devices.


    Some of these concepts are implemented in different ways in order to optimize
    specific aspects of the device, whereas others are equally applied in order to
    increase the level of user experience.


    # ## Performance Optimization


    Optimizing the performance of our WebApp is not a development approach that we
    can perform only at the end of our project workflow. It is something that, exactly
    as for the test phase, is applied for for the duration of the project. Obviously,
    at the end of the Development Phase we apply some optimization techniques to our
    WebApp, but it is'
  merge: -1
  pgno: 390
- img_proc: true
  md: '# CHAPTER 10: Optimizing iOS WebApps


    most efficient to incorporate some good habits from the beginning in order to
    reduce mistakes and shorten the overall development time (See Figure 10–1).


    ![](img/7621e729711898868a82bc471fc9db3b_391_0.png)


    Figure 10-1. Optimization best practice applied along the whole workflow process


    When we optimize our pages, it is important to know what can be optimized. For
    those who know the Vilfredo Pareto Principle, you also know that 80% of the consequences
    come from 20% of the causes, which means that it will be hard to get positive
    results without knowing exactly what to target with our optimization process.


    Coming up we’ll look at some of the best practices, presented as rules, in order
    to clearly present a pragmatic approach to a performance optimization process
    applicable to our WebApp.


    # Code Optimization


    Code optimization is the first step of any type of optimization technique because
    everything is based on code—everything is coded in our web pages. Good code can
    save bandwidth, reduce rendering delay, and improve the page’s readability and
    maintainability overtime.


    The following are some best practices to keep in mind when writing any type of
    code in our WebApp.


    # Rule 1: Use Web Standards Complaint Code


    Use HTML5, CSS, and JavaScript compliant code. Besides clean HTML5 syntax, this
    also means inserting your style sheet in the <head> part of the page and (except
    the link'
  merge: -1
  pgno: 391
- img_proc: true
  md: '# CHAPTER 10: Optimizing iOS WebApps


    to the iWebKit Framework the JavaScript in the bottom of our web pages. This is
    because style sheets in the top of the page significantly speed up the loading
    time. On the other hand, insert the JavaScript in the bottom of the web page so
    the JavaScript code does not HTTP requests. This is because when JavaScript is
    downloading, the browser will not start any other resource downloads, even if
    the resource is on a different hostname.


    > NOTE: An alternative to this rule is to insert the Desktop-Mobile Redirect JavaScript
    code at the top of the page. We can do that because in this case it is more important
    to execute the script than render and load the web page.


    This rule helps the parser work faster and helps reduce the overall rendering
    delay.


    # Rule 2: Write Slim Code


    Write slim code. Remove unnecessary or redundant parts of the code and avoid using
    tab and space where it is not strictly necessary. Don''t use CSS expressions if
    you can achieve the same result with other techniques. CSS rules are evaluated
    more frequently than we can imagine and negatively affect the performance of our
    web page.


    > NOTE: In our use-case, for illustration purposes, we overwrite many CSS rules
    in order to present both the original iWebKit Framework and our use-case custom
    code. In a real project, keep the number of overwritten CSS rules to a minimum.


    Short and meaningful names for comments and CSS ID and class or JavaScript variables
    and functions. Don''t hesitate to adopt XHTML syntax, if you like to write XHTML
    code, and use CSS rules to a good level of factorization inside your style sheet.
    Use Gzip compression or minify HTML5, CSS, and JavaScript code, but always remember
    to store an uncompressed version for development purpose in the project.


    This rule reduces the overall weight of our web page and, by default, the rendering
    and loading delays.


    # Rule 3: Reduce HTTP Requests


    It is important to always keep one eye on the number of imported resources (images
    included). More files imported into our web page equals more rendering and loading
    latency from the browser. Minimizing the number of HTTP requests speeds up the
    web page time. With this in mind, it may be a good idea to consider adding HTTP
    caching to our web pages.


    HTTP caching, also known as web cache, is based on good principles, but it is
    almost unusable in Apple Safari because of its specification limits. The following
    list summarizes some of the main limits of HTTP caching:'
  merge: -1
  pgno: 392
- img_proc: true
  md: '+   Single resource must be less than 15kB (non-compressed)

    Web pages designed for iPhones should reduce the size of each component to 15KB
    (25KB before iOS) or less for optimal caching behavior. The iPhone is able to
    cache 105 15KB components. Attempting to cache one more file results in removing
    an existing one from the cache.


    +   Cached resources must be less than 1.5MB

    Although the iPhone is able to cache multiple components, the maximum cache limit
    for multiple components is around 1.5MB (500KB before iOS). Maximum bytes available
    in the cache are around 105 * 15 = 1575KB.


    +   Powering off the device clears the HTTP cache

    If the user needs to perform a hard reset, components in the cache will be lost.
    The reason is that, on the iPhone, Safari allocates memory from the system memory
    to create cache components but does not save the cache components in persistent
    storage.


    +   Closing the tab clears the HTTP cache

    Closing all tabs except the blank one and closing Safari clears the cache.


    We can see from a development point of view that this type of cache is unreliable
    because it is cleared too often and can''t cache the majority of the resources
    in a modern web page. Even the most compressed JavaScript Framework or CSS are
    a struggle to get under 15K, and none of the images used in almost every WebApp
    are under this limit. The offline features provided by HTML5 are a better option
    for our goals, and we introduce them later in this chapter.


    ![](img/7621e729711898868a82bc471fc9db3b_393_0.png)


    The best reason for following this rule, besides reducing the rendering time of
    our web pages, is that the HTTP/1.1 protocol specifies that a browser can download
    only two resources in parallel per hostname, as shown in Figure 10–2.'
  merge: -1
  pgno: 393
- img_proc: true
  md: '# CHAPTER 10: Optimizing iOS WebApps


    A workaround for this sort of bottleneck is to spread our external resources over
    multiple hostnames. Lastly we can''t forget to avoid all HTTP redirects in our
    web pages. The HTTP redirect is accomplished using the 301 or 302 status code,
    and in both cases it adds a delay to the average page loading time, thereby decreasing
    the quality of user experience.


    This rule reduces the loading time by reducing the communications delays between
    the client side and server side.


    # Rule 4: Combine CSS and JavaScript Files


    This rule must take into account the project''s complexity, but the basic idea
    is that we combine all our CSS rules and JavaScript code into one single file
    instead of having multiple files. This will reduce the HTTP header''s weight and
    the latency of imported multiple resources in our web pages due to TCP slow starts,
    as shown in Figure 10–3.


    A side effect of this approach is that we are forced to update larger files, even
    for small code updates; however, this is often a path that brings more positive
    effects than negative.


    ![](img/7621e729711898868a82bc471fc9db3b_394_0.png)


    Figure 10-3. Transfer latency time: comparison between single and multiple JavaScript
    files


    # Rule 5: Minimize DOM


    In our project, the hard work is done by the framework, but we still need to write
    JavaScript code to accomplish some of the project requirements. In this case,
    the rule is simple: minimize the DOM access and the number of DOM objects.'
  merge: -1
  pgno: 394
- img_proc: true
  md: 'This rule will reduce the web page loading time and user experience delays
    every time the web page runs a JavaScript.


    # Image Optimization


    An important step in the Optimization Phase is image optimization. Image optimization
    is another example of a good habit that doesn''t contain any great secret. Simply
    put, optimizing the images of our WebApp can dramatically improve the performance
    of our web pages by making them lighter and reducing loading delays.


    The following are some best practices to keep in mind when we work on our WebApp’s
    images.


    # Rule 6: Optimize Color Depth


    After we design an image, we need to optimize its weight by exporting it using
    the right image format. If it''s a photo, we need to use a good compression ratio
    in JPG format. If it''s a user interface image, it is important to check the number
    of colors used. If we use fewer 256 colors, we can export it in PNG8. In most
    cases, exporting in PNG8 renders a smaller image than exporting as a 256-color
    GIF. Using similar colors also helps to keep the color count and the image weight
    low.


    We should also stress that exporting images using a graphic program like Adobe
    Photoshop, Fireworks, or Gimp will add unwanted metadata that will increase the
    image weight. We can see the metadata imposed on an image in Fireworks by accessing
    the Metadata Panel and browsing File > Info (T) or using ⌊F.


    A workaround is to optimize our images using a program like PNGOut that will make
    them as slim as possible.


    This rule reduces the web page loading time and increases the level of user experience.


    # Rule 7: Use CSS Sprites


    The word "sprite" might remind you of the''80s, when people played all day with
    Commodore 64 or ZX Spectrum games. Because in computer science everything that
    is old sooner or later will become again, web developers adopted the idea behind
    the old Sprite management and brought it to the CSS world. Number of the following
    Figure (10–4) for an example.'
