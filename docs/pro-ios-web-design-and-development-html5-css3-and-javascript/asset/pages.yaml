  md: '# Name convention


    A name for a variable, a function, or an object should be meaningful and be in
    camelcase with the first letter in lowercase. The object''s name should start
    with an uppercase letter.


    # Brace style


    The dominant style in Javascript is the most traditional style from C-based languages.
    If we have an if or a statement, the curly braces opens on the same line as the
    keyword (if, while, and so on), and the code is indented in the block and closed
    curly braced in a line itself.


    # Function declaration


    When we declare a function, we should always define it before any attempt to call
    it and we should always use curly braces to define a block even if there is only
    one statement after the keyword (if, while, and so on).


    # Syntax


    Always use semicolons to end of a statement and always use the keyword "var" when
    declaring a variable.


    For more information on this subject, use a search engine and search for Javascript
    style guidelines. There are guidelines written by individuals from Mozilla, Yahoo,
    and Google.


    # Resource on Web Standards


    In Table 7–50, we have the official resource about the three web standards presented
    in this chapter. If you are new to one or more of these technologies, continue
    to build your web standard foundations using the following official sources.


    **Table 7–50.** Tools Used to Design iPhone and iPad User Interfaces


    | Name | URL |

    | --- | --- |

    | HTML5 | http://dev.w3.org/html5/spec/ |

    | CSS | www.w3.org/TR/CSS/ |

    | Javascript | https://developer.mozilla.org/en/JavascriptJavascript |'
