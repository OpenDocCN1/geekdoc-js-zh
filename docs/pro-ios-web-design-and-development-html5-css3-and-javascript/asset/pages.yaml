  md: '# Google Analytics


    After registering a Google account, we are able to log in to the Google analytics
    page located at http://www.google.com/analytics. Once logged in, we are able to
    add our WebApp from the Google Analytics Control Panel in few steps.


    At this point, it is important to create and add a Sitemap to our WebApp in order
    to be sure that every URL is discovered by the Google''s normal crawling process.
    The Sitemap can also be used to provide metadata to Google about specific types
    of content like images, videos, news, and so on.


    The last step before the data from our project is collected by Google Analytics
    is to add a snippet of code from the Control Panel to our web pages before the
    head closing tag. Information is collected and visualized using a few different
    Dashboard views. We have a Dashboard where all the information is visualized together
    for a glance at all the information at once, but we can also switch minimizing
    information in a single view. Some of these views are as follows:


    +   - Content Overview


    +   - Pageview Display


    +   - Visits View


    +   - Bounce Rate View


    +   - Traffic Sources View


    +   - Referring Sites View


    +   - Search Engine View


    It is important to remember that data are not collected in real time, and the
    statistics aren’t available until midnight PST of each day. Google Analytics also
    takes a few hours to fully update all the statistics entries. In our web pages
    we are able to generate more than a million page views per month, it is useful
    to remind you that the free service offered by Google Analytics, there exists
    a Premium version of the service available for larger sites.


