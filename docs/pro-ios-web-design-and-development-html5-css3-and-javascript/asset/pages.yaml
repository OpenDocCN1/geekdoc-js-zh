    # Application Compressing


    Safari supports GZIP compression (RFC 1952), so compressing some of the resources
    of our WebApp is often a good idea as this will result in an increase in the level
    of user experience. We can decide when to compress our HTML5 documents, CSS3 style
    sheets, or JavaScript code, whereas we don’t want to compress images or PDF files
    because these are already compressed. Compressing images or PDF files adds CPU
    overhead and potentially increases the file size.


    From the server, in order to use GZIP-compressed resources in our WebApp, the
    server must be configured to provide compressed resources when requested. From
    the other side the client must be able to support this type of files.


    The Request/Respond process represented in Figure 10–4 can be resumed in the following
    three steps:


    +   - Client


    Connect to the server


    Send a request with GZIP support: “accept-Encoding: gzip”


    +   - Server


    Acknowledge GZIP support


    Compress resource with Gzip algorithm'
