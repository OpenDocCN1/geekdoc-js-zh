    # # Operators


    Every statement we write always involves at least one operation: assigning a value,
    moving data from one place to another, and adding and subtracting a few examples.
    In order to perform operations, we need operators.


    The most common operators are the arithmetic ones but we also have logic operators,
    assignment operators, Boolean operators, and many others. We can group these operators
    into six functional categories, as follows:


    +   ### Assignment

    Assigns a value to its left operand based on the value of its right operand.


    +   ### Logical

    Returns a logical value based on the logical operator.


    +   ### Comparison

    Returns a logical value based on the comparison operator.


    +   ### Combinational

    Returns a result without affecting either operand, including string and mathematical
    operators.


    +   ### Bitwise

    Returns a number value based on its operands treated as a sequence of 32-bit value.


    +   ### Other Types

    Operators that don''t fall into standard groups include the Comma Operator (),
    Dot Operator (.), Conditional Operator (?), Delete Operator (delete), New Operator
    (new), In Operator (in), Typeof Operator (typeof), Instanceof Operator (instanceof),
    and the Void Operator (void).


    In general, operators require one or more operands as values and an output, following
    a simple (mathematical) expression example:

    "operand" "operator" "operand" "operator" "output"

    90 + 10 = 100


    Table 7–41 lists some of the most common Javascript operators.'
