  md: '# Search Engine Database


    Search engine databases contain multiple data points about each stored URL. These
    data could be arranged in many different ways and every search engine has its
    own way to accomplish this job. How every search engine arranges these types of
    data is a closely guarded secret; an example is the PageRank method used by.


    # Search Engine Algorithm


    Search Engine Algorithm is the heart of every search engine, which is the part
    that makes everything works. This algorithm evaluates one or more inputs (words
    inserted by the user in the search engine interface) and generates an output and
    searches the database where URLs and keywords are stored. This algorithm, which
    can be catalogued as a Problem Solver Algorithm, is composed of multiple algorithms
    that analyze different web site parts. Every search engine has its own implementation
    of this algorithm.


    #  Engine Result Page (SERP)


    The Search Engine Result Page, besides the search engine interface, is the only
    part that is visible to the user. This page is a collection of links catalogued
    in a specific order by the Search Engine Algorithm.


    In the following section, we see how to design and implement our web pages in
    order to be more search engine friendly.


    # Search Engine Oriented Design


    Optimizing our web page for a search engine is important from the early phases
    of our project workflow. A search engine oriented design is a title that stands
    for an approach used during our Design Phase. Let''s take a look at the steps
    of the Design Phase.


    # Domain Title


    The first step of any SEO approach starts before we can open our graphic program
    or editor code. Choosing the wrong domain can ruin all the future efforts to gain
    a good positioning on our search. Despite the crucial moment of this step, the
    solution is simple: insert the primary keyword in the domain name.


    ```

    http://iphone.store.com /* iPhone Third Level Domain Name */

    ```


    This is an example of the hypothetical name of our “The Store” use-case. Inserting
    the primary keyword in the domain name guarantees that our WebApp will be stored
    using a word that will be used as primary keyword in the next steps of the SEO
    Optimization Phase.'
