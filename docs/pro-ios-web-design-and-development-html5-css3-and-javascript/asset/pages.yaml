    In order to improve your interface and layout design in this example, you need
    to analyze the current amount and appropriateness of negative space, and then
    decide which areas have too much of it and which areas have too little. In the
    case of the Apple website (Figure 4–14), you can see how lots of solid passive
    negative space can create a classy, elegant, and upscale vibe.


