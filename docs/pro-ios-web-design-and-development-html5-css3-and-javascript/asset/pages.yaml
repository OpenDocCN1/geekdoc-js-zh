  md: '# CHAPTER 2: Agile Project Building for iOS Devices


    +   4. Supplementary content


    +   5. Navigation (supplementary)


    +   6. Site information


    > NOTE: The semantic approach is part of the "Web Content Accessibility Guidelines
    2.0" (WCAG20) published by the W3C "Web Accessibility Initiative" (WAI) to support
    the development of more accessible web content.


    Here are some steps that we use each time we employ the content-out approach.


    +   1. Define the content.


    +   2. Convert the content to HTML.


    +   3. Use semantic markup to set content hierarchies.


    +   4. Use gray box wireframe to allocate layout space and proportion.


    +   5. Design and style the layout.


    In other words, in constructing the webpage, all content must be produced and
    converted to HTML5 before markup, wireframe, or CSS3 styling takes place. Once
    you have put all our content into an unstyled webpage, you''re free to go ahead
    in the process and think about which kind of design might best fit your content.


