    HTML and CSS and the recent worldwide network upgrades, things are markedly different.


    Although differences between Native Apps and WebApps still exist, the tea leaves
    seem to show that in the future this gap will be narrowed to some extent. In May
    2010, at the I/O Developer Conference, Google announced that Android-based WebApps
    will have access to local hardware capabilities (motion sensor, camera and Google''s
    voice recognition). Now, this fact facts that once Android WebApps are able to
    access hardware features, iOS WebApps will not wait very long to follow the same
    path and fill this last gap between WebApps and Native Apps


    While we''re waiting for this exciting day, meanwhile we need to make a thorough
    study of our project in order to clearly understand its needs and be able to choose
    the right approach to achieve the project''s goals.


    Essentially, a WebApp is a better option when:


    +   1. We need to update our content frequently.

    2. We don''t need any of the Apple Store features.

    3. We don''t need especially fast graphic performance.

    4. We are not dependent on native functionality.

    5. We are not dependent on running our app in the background.

    6. We are not dependent on sending (push) notifications.


    If our application is not a Game, doesn''t need the Camera, GPS, Accelerometer,
    Multimedia sound/graphics, heavy videos, or complete offline access, then it''s
    probably a good idea to write a WebApp. An example of a good WebApp is the Gmail
    WebApp for iPad shown in 3-9.


    Native applications are certainly supposed to be faster because we can define
    our caching strategies, our network services, and our event/threading model. Native
    applications are also under control of the user, who decides what to install,
    update, and uninstall. The only part that involves networking is the process of
    getting the installation package. WebApps are instead under control of the server,
    which could eventually go off-line, in which case updates would have to be initiated
    and implemented by the application''s creator.'
