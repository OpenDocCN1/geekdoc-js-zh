  md: 'CHAPTER 12: Maximizing the Market for iOS WebApps


    GoogleSense offers the opportunity to insert and display targeted ads in your
    content and earn money from them. The service works on mobile and desktop platforms,
    having a specific section for Web applications. After registering an account on
    GoogleSense, you need to add a snippet of code to your Web application, as in
    Google Analytics. GoogleSense also offers the ability to customize mobile ads
    to best match the look and feel of your Web application design.


    PayPal is a well-known and widely used platform. You can use PayPal donations
    for your Web application in order to raise funds from it. In this case, it is
    a good idea to add the Donate button to both the application site and the Web
    application. PayPal is an effective income generator if your Web application is
