  md: "# Animation\n\nAnimation, similar to transition, modifies properties over time.\
    \ Using the transition property, we achieve a one-way effect from one value to\
    \ another. This kind of property is useful for emulating iOS page transitions\
    \ or creating Flash-Like animations.\n\n\nUsing the animation property, we can\
    \ provide any number of intermediate values that are not necessarily linear, achieving\
    \ fairly complex animations. These intermediate values are called keyframes and\
    \ are the foundation of all animation processes.\n\n> NOTE: A key frame in animation\
    \ and filmmaking is a drawing that defines the starting and ending points of any\
    \ smooth transition. They are called \"frames\" because their position in time\
    \ is measured in frames on a strip of film. A sequence of keyframes defines which\
    \ the viewer will see, whereas the position of the keyframes on the film, video,\
    \ or animation timeline defines the timing of the movement.\n\nThe animation property\
    \ in CSS is shown in Table 3–22 and the CSS syntax is:\n\n```\nanimation-name:\
