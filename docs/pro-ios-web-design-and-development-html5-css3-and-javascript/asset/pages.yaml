  md: '# Preface


    > “A journey of a thousand miles begins with a single step …”


    —Lao-Tzu


    # Mobile Device Evolution


    These are the exciting times for those who live and work with technology every
    day, whether they are young people who have been using technology since birth,
    or, like many others, have had to adapt to it.


    It is an exciting moment in recent years there is no other example of technology
    that has changed our lives so dramatically as has the evolution of the mobile
    device.


    Since knowing the past you''ll be more prepared to understand the present and
    help create the future, in this book we will precede our discussion of how to
    get with a short history of smartphones, with our beloved iPhone or iPad in hand.


    # Humble Beginnings: The Early Mobile Web


    Everything started in 1908, when Nathan B. Stubblefield of Murray, Kentucky was
    issued the first USpatent for a wireless telephone.


    Forty years later, the zero generation (0G) of mobile phones was introduced. Mostly
    used as car phones, which were meant to connect mobile users in cars to the fixed
    public telephone network.


    The zero generation was not officially categorized as mobile device technology
    since it did not support the automatic change of channel frequency during calls
    (Handover), which would allow the user to move from one cell (the present-day
    radio base station covered area) to another.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '![](img/7621e729711898868a82bc471fc9db3b_16_0.png)


    **Figure 1.** *The zerogeneration: Mobile car phone (1960s)*


    In the 1960s, a new full-duplex VHF/UHF radio system launched by Bell Systems,
    and subsequently improved by AT&T, called "Improved Mobile Telephone Service"
    (IMTS), brought many improvements, such as direct dialing rather than connection
    through an operator, and higher bandwidth.

    nThe first-generation (1G) cellular systems, developed between the late 1960s
    and the early 1970s, were analog, and still based on IMTS technology. The systems
    were "cellular" because coverage areas were split into smaller hexagonal areas
    called "cells," each of which were served by a low-power transmitter and receiver.


    > NOTE: A cellular system is a radio network made up of a number of radio cells,
    each served by at least one fixed-location transceiver (device that is both a
    transmitter and receiver) known as a base station. These cells cover different
    areas and combine to provide radio transmission over a wider range than that of
    one cell.


    The simple structure of the cellular mobile-radio network consists of the following:


    +   - PSTN: Public switched telephone network

    - HLR: Home location register

    - MSC: Mobile switching center

    - VLR: Visitor location register

    - RBS: Radio base station'
  merge: -1
  pgno: 16
- img_proc: true
  md: '![](img/7621e729711898868a82bc471fc9db3b_17_0.png)


    **Figure 2.** The common (and simple) PCS (Personal Communication Service) network
    architecture


    The 1G analog systems for mobile communications saw two key improvements during
    1970s: the invention of the microprocessor, and the digitization of the control
    link between the mobile phone and the cell site.


    > NOTE: A microprocessor incorporates all or most of the functions of a computer''s
    central processing unit (CPU) on a single integrated circuit (IC or microchip).


    In 1973 Dr. Martin Cooper at Motorola invented the first modern portable handset.
    Legend has that his first call was to rival Joel Engel, head of research at Bell
    Labs, giving him the news about how the competition between them had turned out.


    The first commercial cellular phone was launched by Motorola only ten years later
    in 1983 and called DynaTAC. This brick-like phone had a weight of 28 ounces (0.8Kg)
    and a price of “only” $4,000.


    > HISTORICAL NOTE: Martin Cooper, the inventor of world''s first cellular phone,
    the DynaTAC, had the first idea from watching Captain James T. Kirk talk over
    his communicator in the famous Star Trek TV series in the 1960s.


    In today''s world, talking on the go seems normal, but back in the early 1960s
    when Star Trek was first, most people''s phones worked with cords.


    # Expanding Mobile’s Reach: GSM Device


    The second generation (2G) digital cellular systems were first developed at the
    end of the 1980s. These systems digitized not only the control link but also the
    voice signal.


    The new systems provided better quality and higher capacity at a lower cost to
    consumers. GSM (Global System for Mobile Communication, originally Groupe Special
    Mobile) was the first commercially operated digital system using TDMA protocol
    (time division multiple access) for its channel access method.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'NOTE: A channel access method allows several terminals connected to the same
    multi-point

    transmission medium to transmit over and receive to share its capacity.


    Fundamental forms of channel access schemes are as follows:


    +   - FDMA: Frequency division multiple access

    - TDMA: Time division multiple access

    - CDMA: Code division multiple access

    - SDMA: Space division multiple access


    GSM networks pioneered low-cost implementation of the "Short Message Service"
    (SMS),

    also known as text messaging, which has been supported on other mobile phones
    as

    well. The GSM standard also includes a worldwide emergency telephone number

    feature for each of their versions. Common emergency numbers are 112, 999, and

    911.


    In the 1990s, with the new way of transmitting information, a new generation of
    small

    100-200 handheld devices started replacing the brick-sized phones. This change
    was made

    possible thanks to technological advancements that included smaller batteries
    and more energy-

    efficient electronics. The 1990s were the glory years of Motorola, its infamous
    MicroTAC

    phone, which was released in 1989 and remained a status symbol for almost a decade.


    In 1997, the GSM system was extended with a packet data capability by the GPRS

    (general packet radio service), and in 1999 with a higher-speed data transmission
    protocol

    called EDGE (Enhanced Data Rates for GSM Evolution). Those two new versions of
    GSM protocol

    were introduced at 2.6 and 2.75 kbps, respectively.


    In the same year, Nokia launched 7110, the first terminal with WAP (Wireless Application

