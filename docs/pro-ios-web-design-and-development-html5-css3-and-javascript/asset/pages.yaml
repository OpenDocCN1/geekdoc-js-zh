  md: '# Create Separate Groups of Content


    You can use passive negative space to separate different groups or areas of information,
    less space to separate similar groups, and more space to separate groups that
    are more different. You also create sub-grouping by the way you configure the
    quantity of space you use.


    Typically, this technique uses both a margin and a padding value on the elements.
    In Figure 4–15, you can see how the right amount of passive negative space creates
    separate groups of content, where each piece of content is composed of an image
    and a textual description.


    ![](img/7621e729711898868a82bc471fc9db3b_162_0.png)


    **Figure 4–15. The use of negative space to create groups of content and eliminate
    visual tension.


    # Eliminate Visual Tension


    When a shape is not balanced with other shapes, it suffers aesthetically and the
    user’s cognitive reaction to this unbalanced relationship is a visual tension.
    Look at Figure 4–16 (and compare it with Figure 4–15) and pay attention where
    your eyes automatically go when you look at these shapes.'
