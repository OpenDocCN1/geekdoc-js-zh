  md: '# CHAPTER 4: User Interface Design for iOS Devices


    # Deliverables


    When the interaction phase is complete, we need to prepare deliverables for the
    next phase in the process: the implementation. If you are working by yourselves,
    deliverables are useful if you only need to get back on the project months after
    it is released, so that you can remember at a glance important points about your
    design. When you work in a team, you must be sure that your deliverables "talk
    for us" and show your design clearly, avoiding any possible doubt in the developer''s
    mind.


    As previously explained, you produce three kinds of deliverables: a design composition,
    a design style guide, and an electronic prototype. The design composition, as
    the name implies, shows the composition of your design, and the design style guide
    shows, templates, how to apply your design to various types of pages. If you have
    an important message to pass on, you can also analyze, explain, or highlight a
    specific part of your design, adding notes and description. The electronic prototype
    shows how the design works in an interactive way. The same prototype is used by
    you and the developer for the startup phase of implementation.


    # iPad Native-Like User Interface Design


    Designing an iPad version of your website and web application is not as important
    because you are creating the iPhone version. If the compatible version has a touch-screen
    optimized structure and offers a high quality user experience, it''s most important
    to focus your energy on designing an iPhone version of your content.


    The iPad’s browsing capabilities enables the user to do so with a high level of
    user experience through any desktop content. Nevertheless, developing a native-like
    experience for an iPad user should be your first priority. A native-like structure
    always offers a higher level of user experience.


    You will be seeing many iPad native-like WebApps in the near future, so we suggest
    that you do not omit this option, but make sure to include it in your project
    roadmap.


    # Research


    When you perform the research phase for the compatible version, we are working
    on all planned versions simultaneously. This is because we reuse our research
    results for our other iPad versions and later for the iPhone research step. In
    this way, we optimize the budget, saving money and time, and amortize a fixed
    cost in our process.


    Market research tells us which portion of our content to insert in our iPad version
    and which is better left exclusively for the compatible version.'
