  md: '+   More Negative Space Between Paragraph Helps to Focus User Attention


    If a user is searching for your content, having "enough" space between paragraphs
    will suggest a landing point, emphasizing the first line of the following paragraph.


    +   Multimedia Works Better than Text for Unfamiliar or Conceptual Information


    +   Call-to-Action Buttons at the End of the Reading Pattern Best


    The natural position for a call-to-action button is at the end of a reading pattern.
    The button could be placed at the end of the content and/or at the end of a single
    paragraph.


    +   Strong Visual Hierarchy can Influence User Reading Pattern


    By adding some weight and dynamics with an image or a headline, we change the
    structure of a reading pattern,


    Most of these tactics work in both a desktop and mouse context and a touch-screen
    and finger context because the user is not a variable but a constant in this equation.
    What is a variable are the hardware interfaces that the user uses to interact
    with the software interfaces. In the next paragraphs, we will see how this slightly
    changes the user experience in certain cases.


    It is also important, perhaps, to continue designing using these conventions and
    habits in order to offer a smooth transition between a desktop PC–user experience
    and the new touch-screen user experience. The passage of time and natural human
    evolution do the rest. Now, we are ready to look at the user interface design
    process.


    # The User Interface Design Process


    This process involves some steps that you have already seen in Chapter 2. You
    start the process by planning the interface. You sketch its structure and the
    level and type of interaction that happen between the user and the interface.
    You create the aesthetic of the interface, and finally produce a deliverable for
    the development phase. If you remember the Information Architecture Process presented
    in the Chapter 2, you will go smoothly through the following phases.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# Research


    The research phase is too often misunderstood and overlooked; sometimes because
    we are working with a small budget and sometimes just because it is less tangible
    than other phases in the process.


    Despite that, the fact is that without good research, you can''t truly understand
    the requirements of your interface, or have an idea of what your competitors in
    the market have done before. Even worse, you won''t have a clear idea of what
    will be the level and type of interaction you want from your interface.


    As you previously saw in Chapter 2, the information that is collected in this
    phase is fundamentally important for the final result, and an error at this point
    dramatically impacts the entire process.


    # Structure


    Designing the structure of your interfaces, you need to consider two cases:


    +   - **Active Interface**n  Interface based on active links—for example, Navigation
    Bar

    - **Passive Interface**n  Interface based on passive negative space—for example,
    page layout


    You start by designing the passive interfaces using the negative space concept
    to choose which areas will be filled with a portion of your content and will be
    left blank. As you now know, negative areas are important in our layout for cognitive
    and interactive reasons.


    Once you define the negative and positive space of your layout, you start designing
    the active interface and sketching its content structure. The tools you use are
    flow chart and then a site map to plan the active interface''s content.


    In keeping with our content-out approach, once you have a clear idea about the
    interface''s content, you start to organize your visual structure. The visual
    structure is sketched using wireframes and paper prototypes.


    # Aesthetic


    Once you know the structure of your interfaces, you can take a deep breath and
    keeping in mind the rules of perception, enjoy the next step: designing your interface''s
    aesthetic. This is usually the most satisfying part of the process for every designer.
    For this step, you use your preferred graphic design program. In the following
    section, we assume that you''re going to use Adobe Fireworks, but the choice is
    up to you. It''s important to remember that working on the aesthetic part of your
    interfaces means working on both design style and typography.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Interaction


    Once the interfaces are structured and designed to your aesthetic satisfaction,
    you need to work on their interaction with the user. For this phase, use sequence
    diagrams for developing the use-cases, and electronic prototypes to test them
    in a real environment. If you need to develop a simple use-case for your interfaces
    that doesn’t have a complex context, and you just to have an idea of “what the
    user will do,” you can use use-case diagrams, saving both time and effort. Working
    on the interface’s interaction means working on navigation elements, form elements,
    audio and video elements, and passive interfaces based on negative space.


    # Deliverables


    When the artistic part of your design work is finished, you need to produce deliverables
    for the next phase of development. To accomplish this last step of the process,
    you work on the design composition, electronic prototype, and style guide.


    # Design Composition


    Design composition is the artwork that shows the entire interface, composed of
    active and passive interfaces. This deliverable is also used to show the client''s
    project''s status because it serves as a picture of what will eventually be your
    WebApp.


    # Electronic Prototypes


    An electronic prototypes is an interactive version of our design based on HTML5,
    CSS3, and Javascript. We have several frameworks available on the Internet that
    can help us to develop our electronic prototype without wasting time. In the last
    paragraph of this chapter, you will find the tools used in the interface design
    process.


    # Style Guides


    By designing style guides, you ensure that the brand will be carried through the
    next phase of development. Style guides are like page templates where the designer
    shows how certain sections of the design can be applied to a page, regardless
    of the variable content.


    If you are an independent designer and developer working by yourself, you can
    skip some of these deliverables, such as design composition or electronic prototypes,
    but we still suggest that you produce some style guides just in case you need
    to go back to your project at some point in the future. Style guides help you
    avoid mistakes that might happen because you forget the message, the style, or
    other details of your project.'
  merge: -1
  pgno: 188
