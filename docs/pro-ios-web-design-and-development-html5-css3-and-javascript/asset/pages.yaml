    Now draw a rectangle 320 x 480 px. This rectangle will be the basic background
    color for your canvas, but more importantly, it will be used to align the canvas
    object with the Align function. The new rectangle is drawn inside the Background
    folder to be under the iOS interface assets of the iOS folder.


    > NOTE: The Align function is a relative function. We can''t just select an object
    and look for the Align function because it will be unavailable. Being a relative
    function in this environment means you need to pass two or more objects to the
    function to align. This is necessary because the function will align "something"
    to "something else."


