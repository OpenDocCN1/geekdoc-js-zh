  md: '# CHAPTER 2: User Interface Design for iOS Devices


    ![](img/7621e729711898868a82bc471fc9db3b_191_0.png)


    Figure 4-30. The three-columns layout structure used by Amazon.


    From a logical point of view, the three-column layout might seem like a good choice
    because it allows us to isolate three different kinds of content. In a blog, there
    is usually a menu or assorted links related to the website in the left column,
    and various kinds of advertisements in the one on the right.


    In recent years, many blogs have converted their structure to a more functional
    and usable two-column layout, but the same thing hasn''t happened to the majority
    of online sites. With the two-column layout, we usually have the main menu and
    other links related to the left column, and the shopping cart with promotional
    banners in the right column.


    We can summarize the pros of three-column layout as the following:


    +   - Symmetry Can Be Pleasing

    - Three Columns Offer Three Different Content Areas

    - Centered Main Content Helps the User to Focus on It


    The following are cons of the three-column layout:


    +   - Symmetry Works Against Visual Content Hierarchy

    - Symmetry Consumes More Cognitive Resources from the User'
