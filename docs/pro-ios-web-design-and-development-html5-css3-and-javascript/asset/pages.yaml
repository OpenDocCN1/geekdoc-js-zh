  md: '# Full-Screen Mode Application


    The first and major aesthetic difference between a native application and a WebApp
    is the presence of the Safari URL bar in the latter. Working with Safari and its
    engine, WebKit provides a measure of control over this situation.


    ![](img/7621e729711898868a82bc471fc9db3b_352_0.png)


    Figure 8-3: Comparison between a native application (left) and a WebApp (right)
    in non-WebApp-mode.


    Using the apple-mobile-web-app metatag, you can specify the browser to hide the
    URL bar, providing a native-like look and feel to the user.


    ```

    <meta name="apple-mobile-web-app-capable" content="yes" />

    ```


    The full-screen mode will work only if the web page is launched from a link in
    the springboard. We will see how to add a web page to the iPhone or iPad springboard
    in the next section.


    The iPhone and iPad status bar is fixed, and we are unable to hide it. Despite
    fact, we can change it using the following methodology:


    ```

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"
    />

    ```


    | Name | Description |

    | --- | --- |

    | default (gray) | Set the default (gray) background. Content is displayed below
    the status bar. |

    | black | Set a black background. Content is displayed below the status bar. |

    | black-translucent | Set a black translucent background. Content is displayed
    on the entire screen partially obscured. |'
  merge: -1
  pgno: 352
- img_proc: true
  md: 'This metatag works only if the full-screen mode metatag is previously declared;
    otherwise it will be ignored by the browser. The best approach is always to choose
    the Status Bar style according to the application color palette, but if you want
    to increase the visible area, the only option is to use the black-translucent
    version. The default Status Bar style in the springboard is set to black-translucent
    from iOS4 onwards.


    # Adding the Springboard Icon


    The second difference between a native application and a WebApp is that a native
    application is launched from the home screen, also known as a springboard. We
    can replicate this sort of native pattern by designing a customized icon and adding
    a web page shortcut to the springboard, and then launch the page directly from
    there.


    The customized springboard icon has some specific characteristics; some are a
    “must,” while others are a “should,” and can be considered best practices.


    +   - Measure: 57 x 57 px (iPhone 2G, 3G, 3GS)

    - Measure: 114 x 114 px (iPhone 4 or required)

    - Measure: 72 x 72 px (iPad, iPad2) (required)

    - Corners: 90 Degree

    - Style: No Shine or Gloss

    - Name: apple-touch-icon.png

    - Name: apple-touch-icon-precomposed

    - Format: Portable Network Graphic (PNG) (required)

    - Location: Root Directory (required)


    If we want to prevent Safari from adding effects like gloss and shine to our icon,
    we need to use the name apple-touch-icon-precomposed.png.


    When the custom image is ready, we can link it to the web page using the following
    metatag:


    ```

    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    ```


    Even if, in theory, it is possible to use different springboard icons for different
    pages, it is strongly recommended that you use only one image for all your web
    pages—one WebApp, one springboard icon.'
  merge: -1
