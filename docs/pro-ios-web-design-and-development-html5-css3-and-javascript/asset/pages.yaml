    # Rule 8: Use CSS Instead of Images


    This rule may sound strange, but because the image optimization process aims to
    reduce the weight of images globally, use CSS rules every time it possible instead
    of bitmap images.


    # CSS TEXT EXERCISE


    In "The Store" use-case, we design the Breadcrumb Bar using a few images. Implement
    the CSS technique to speed up the rendering time even more.


    +   - Use text images for all the Breadcrumb links.

    - Align the House Icon with the Breadcrumb text.


    Compare the rendering time of both the Sprite and CSS approaches.


    We need to use CSS rules for everything involved in our user interface and insert
    images only in rare cases. If we must use an image for a user interface, it must
    have its color depth optimized. If we need to insert many images we need to insert
    these images into CSS Sprites. We should also use CSS rules for each small design
    detail such as borders, backgrounds, or gradients.


    This rule reduces the web page loading time and user experience delays every time
    the web page runs JavaScript.


    # Rule 9: Never Scale Images


    Always use images with appropriate dimensions according to the device viewport
    or design element width and height. It is never a good idea to rely on Safari
    to scale an image for the right fit. The only exception to this rule is when we
    need to insert an image inside a single device WebApp (only for iPhone or iPad).
    In this case inserting an image'
