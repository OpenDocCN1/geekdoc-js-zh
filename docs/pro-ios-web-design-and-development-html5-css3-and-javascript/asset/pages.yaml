  md: '# From Domestic to Ubiquitous Computing and Ambient Intelligence


    Domestic and house automation are two aspects of a singular new type of connection
    between mobile devices and a user''s environment, a connection that has resulted
    in what is called "ubiquitous computing." What exactly is ubiquitous computing?


    In 1991, Marc Weiss, in his seminal paper "The Computer for the 21st Century,"
    noted that "The most profound technologies are those that disappear. They weave
    themselves into the fabric of everyday life until they are indistinguishable from
    it." That''s the core concept behind ubiquitous computing.


    The decade of the ''80s was that of the microprocessor, symbolized by the personal
    computer. It was the decade when we actually built our computers. The decade of
    the ''90s was that of networks and communication, the decade when people connected
    computers together. It was symbolized by the World Wide Web. The decade of the
    ''00s was the decade when personal computers turned into small devices and became
    portable. It was symbolized first by the laptop and then by the smartphone. In
    the present decade, computers are everywhere, they are connected everywhere, and
    are embedded everywhere. Every part of the world has become connected to the network,
    searchable through the network, and usable by us. This project is called vrFlora
    and was presented at the UComp Conference. Figure 13–4 shows an example of ubiquitous
    computing. It shows an adaptive response suitable to a user''s situation.


    ![](img/7621e729711898868a82bc471fc9db3b_461_0.png)


    Figure 13–4. The project vrFlora at the UComp conference (image source: Sejin
    Oh)


    The ubiquitous computing era arrived at the moment we realized that the computer
    had become invisible. In this era, people are no longer "users" in the strict
    meaning of the word but are "subjects." The user becomes the moment that a person
    and computer switch from having a one-way relationship to having a two-way relationship.
    In other words, subjects are used by technology in the same way they use themselves.
    A subject can walk down a street and interact with the touch interface of his
    or her smartphone connected to a GPS satellite; simultaneously, he or she can
    be watched by'
  merge: -1
  pgno: 461
- img_proc: true
  md: '# CHAPTER 13: Looking Beyond the Mobile Web to Ubiquitous Computing


    # 433


    the video interface of a surveillance camera can be monitored through the sensor
    interface of a biometric system.


    An example of a primitive implementation of ubiquitous computing can be seen in
    augmented-reality applications that can be run on the iPhone and the iPad (see
    Figures 13–5 and 13–6). These AR applications have taken the first step toward
    a new paradigm of user experience, but the stream of data that produce still flows
    in one direction: from the object to the user.


    ![](img/7621e729711898868a82bc471fc9db3b_462_0.png)


    **Figure 13–5.** An implementation of augmented reality (image Earthmine)


    As computers become smaller and as their parallel processing increases exponentially,
    ubiquitous computing will bring about a new type of environment, one capable of
    interacting with a subject in both directions, sensing and retrieving data and
    also implementing what is called “ambient intelligence.” When the bridge between
    the Wide Web and its users (subjects) is completed, the computing world will enter
    into a new era.


    Today, we can do with many mobile devices, both smartphones and tablets, to build
    a little piece of that future. The web is the link between every device involved
    in the “ubiquitous paradigm,” and this brings exciting opportunities for every
    designer and developer because the sky is the limit when it comes to ubiquitous
    computing.


    Remember, “... the people who are crazy enough to think they can change the world
    are the ones who do.”'
  merge: -1
