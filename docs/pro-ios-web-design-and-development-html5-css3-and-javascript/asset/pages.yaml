  md: '# Make the Code Understandable


    This first point is pretty easy to explain: choose easy to understand and short
    names for variables and functions. Is always a good practice to describe a value
    with your variable or function name.


    # Do Not Use Global Variables


    Using global variables is usually a terrible idea because we run the risk of our
    code being overwritten by any other JavaScript that is added to the page ours.


    # Use a Strict Coding Style


    We must always use valid code. In general, browsers are very forgiving JavaScript
    parsers, but using a lax coding style will hurt us when we shift to another environment
    or hand our project over to another developer. The JavaScript Validator will help
    us achieve validity.


    > NOTE: In difference to HTML and CSS, W3C doesn''t offer any official Validator
    Service for our JavaScript code, fortunately Douglas Crockford, the founder of
    JSON and JSMin, has created JSLint a JavaScript Verifier.

    JSLint is available at: www.jslint.com/


    # Comment the Code as Much as Needed


    It''s important to remember that no matter how good your code is, still it never
    explains itself. Using commenting our code, it''s also important to avoid "line
    comment". Using /* is much safer, because it doesn''t cause errors when a line
    break is removed.


    # Do Not Use Mixed Technologies


    We can use JavaScript in many contexts, such as calculation, conversion, access
    outside resources (Ajax), and to define the behavior of an interface (event handling).
    For anything else, it''s a good idea to stick with the technology we already have
    to do the job.


    A good example would be if we were to try to change the presentation using JavaScript.
    That''s really a bad approach, because people shouldn''t have to change the JavaScript
    code to change a presentation''s look-and-feel. All of the frameworks we''ll be
    putting this principle into practice. It lets us use many customized user interface
    components without writing a single line of JavaScript code.'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Use Shortcut Notation


    Using shortcut notation, we can keep our code snappy and easier to read, once
    we become familiar enough with it.


    # Modularize the Code


    Keeping the code modularized and specialized is always a time saving practice
    for a developer. Especially when we are beginners we have a tendency to write
    single functions to achieve all of our (behavior) goals. Unfortunately, as we
    start extending our code, we have the risk of writing the same code in several
    functions. In order to avoid this, it is important to use smaller, generic helper
    functions that fulfill one specific task.


    # Allow Progressive Enhancement


    In writing code, we must use JavaScript only to achieve specific behaviors. In
    any other cases we must use other standards like HTML and CSS. The point here
    is to avoid a lot of JavaScript-dependent code. Developing in this way we will
    provide progressive enhancement and a first level of optimization, because DOM
    generation is slow and expansive.


    > DEFINITION: Progressive enhancement is a strategy for web design that emphasizes
    accessibility... Progressive enhancement uses web technologies in a layered fashion
    that allows everyone to access the basic content and functionality of a web page,
    more advanced browser software or experience an enhanced version of the page.

    (source Wikipedia)


    # Allow for Maintenance and Customization


    All the things that are likely to change in our code should not be scattered throughout
    the code. A good practice is to put these bits of code into a configuration object
    and make it public, so that maintenance and customization will be easier to achieve.


    # Do Not Code Nesting Loops


    Nesting loops inside loops is always a bad idea, because it means taking care
    of several iterator variables. We can achieve the same result in a cleaner way
    using specialized tool methods.


    # Optimize the Loops


    In JavaScript, loops can get terribly slow, most of the time because of bad coding.
    A good guideline is to always keep computation-heavy code outside of loops.'
  merge: -1
