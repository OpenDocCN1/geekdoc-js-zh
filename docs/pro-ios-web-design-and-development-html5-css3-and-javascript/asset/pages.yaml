  md: '# Decide if removing the element could increase the global design value:

    You need to be sure that removing the element will not disrupt the design.


    When you remove an element, it is always because you saw it as a part of a puzzle,
    and you decided to remove it. If you do not see its global meaning in the design,
    you''ll never have a chance to increase the global value of your design.


    # Hide and Shape


    Sometimes it is possible to remove elements or sub-elements from your design.
    What you can do in this case is hide these elements, in order to focus the (limited)
    cognitive resources only on the most important parts and keep these elements available
    for a secondary type of user.


    It''s important to remember your secondary users, but you don''t want to confuse
    or distract your target user from the main design message. A good example of this
    concept is the structure of the product pages of the Apple Store web site. The
    message is nice and clean in the main product page, but there is a toolbar on
    the top of each product for letting the advanced user have access to the hardware
    specifics.


