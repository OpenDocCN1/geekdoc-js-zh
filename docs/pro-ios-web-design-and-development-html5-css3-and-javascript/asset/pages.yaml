  md: 'As you can see from the last code example, the HTTP convention says to use
    the “?” character (?subject=...) for the first attribute and use the “&” for the
    other follower attributes (&body=).


    # # The SMS Application


    We can add a link to the SMS application using the following link syntax:


    ```

    <a href="sms:1-305-555-5555">1-305-555-5555/</a>

    ```


    The SMS scheme will tell Safari to open the SMS application. Unlike the Mail application,
    with the sms scheme, we can''t add text.


    The target phone number is an optional parameter, and if we want to open the SMS
    application with a blank page, we can use the following syntax:


    ```

    <a href="sms:\Launch the SMS Application/</a>

    ```


    As For the phone, if the SMS application is not installed on the device, as in
    the case of the iPad and iPod, you will get a message notification when touching
    this type of link.


    ```

    <a href="sms:1-305-555-5555" onclick="return (navigator.userAgent.indexOf(''iPhone'')!=-1)>1-305-555-5555/</a>

    ```


    The preceding code performs the same check used with the tel protocol in order
    to prevent iPod users from accessing a baseband-based service.


    # # The Maps Application


    You can add a link to the Maps application using the following link syntax:


    ```

    <a href="http://maps.google.com/maps?q=cupertino">Cupertino/</a>

    ```


    The Maps application doesn''t have its own maps scheme, and the map link is specified
    using a regular HTTP protocol syntax. Safari routes the request to the Google
    server at maps.google.com and then opens its HTTP response using the Maps application.


    With the Mail application, we can combine parameters to provide more information
    to the Maps application using the “?” character. The following example shows one
    case in Tuscany, Italy:


    ```

    <a href="maps.google.com/maps?q=via+dell+olmo+50,E&+livorno,+italy=(Andrea+Picchi%27+Office%27&z=7">Andrea+Picchi%27+Office/</a>

    ```


    The “?” character is used for passing a phrase composed of multiple words, while
    the rounded parentheses are used for creating a label. The “t” parameter is used
    for specifying a hybrid map with the “h” value, and the “z” setting the zoom level
    at 7.


    The Google Maps application has a list of parameters, the Maps application doesn''t
    support them all. The Google Maps parameters supported by iOS are shown in Table
    8–4.'
