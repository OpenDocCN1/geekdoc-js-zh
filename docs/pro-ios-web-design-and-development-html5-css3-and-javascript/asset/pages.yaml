    Now everything is in place, because our application looks to the resource list
    in the Manifest File to understand whether the Manifest File needs to be updated
    or not, we need to use JavaScript if we want to force this update process.


    > NOTE: We can make a change in the Manifest File by using a single line in the
    file. This generates an update from our WebApp next time the Manifest File is
    checked. The JavaScript approach is recommended because it provides more possibilities
    to the developer. If a failure occurs while downloading the manifest file (parent
    file or a resource specified in the cache manifest), the entire download/update
    process fails.


    We can access the cache using the `window.applicationCache` JavaScript object
    and update it in three steps using the `update()` and `swapCache()` methods:


    +   1. Test whether the (old) cache is ready to be updated.

    2. Update the (new) cache.

    3. Swap the old cache with the updated cache.


    In Table 10–1 we can see the three items used for the cache update process


    | Name | Description |

    |---|---| |

    | window.applicationCache.status | Check whether the cache is ready to be updated
    |

    | update() | Update the cache |

    | swapCache() | Swap the old cache with the updated cache |


    When we check the applicationCache object using the status property, we observe
    different returns according to the cache status. Table 10–2 shows the possible
    value returned by the status property.'
