    # User Experience (UX)


    User experience is a broad topic and pervades many areas of our web (and native)
    applications. On top of that, we can identify a major area where those differences
    between native and WebApps are remarkable: the application controls.


    In a native application, the user can change many of his application''s settings
    and in this way we have some of control over the user experience. In mathematical
    terms, he can define a few subsets of the user experience. This is impossible
    in a WebApp because, apart creating option pages that emulate the look and feel
    of native option pages, the only options we can interact with the Mobile Safari
    Settings. Those settings will not modify the user experience, because the browser
    and the WebApp are two different entities. In other words, the settings you can
    change in Mobile Safari are not the WebApp’s settings.'
