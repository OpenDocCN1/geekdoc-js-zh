    # Keyframes


    Keyframes are used to specify the values for animating properties at various points
    during the animation. The keyframes specify the behavior of one cycle of the animation;
    the animation may iterate one or more times.


    Keyframes are specified using a specialized CSS at-rule. A @keyframes rule consists
    of the keyword @keyframes, followed by the identifier-name that gives a name for
    the animation, followed by a set of style rules.


    The CSS grammar for the keyframes rule is:


    ```

    keyframes-rule: ''@keyframes'' IDENT ''{ keyframes-blocks ''}'';

    keyframes-blocks: [ keyframe-selectors block ];

    keyframe-selectors: [ ''from'' | ''to'' | PERCENTAGE ] [ '','' [ ''from'' | ''to''
    | PERCENTAGE ] ];

