    # ## iPad User Interface


    The iPad runs the same operating system as the iPhone (iOS); therefore, we have
    pretty much the same user interface look and feel. The iPad user interface is
    still composed of two logical parts, but with a difference in the following.


    +   - Native User Interface (NUI)

    - Visible area


    Once again, the NUI and the visible area take up the entire available screen area,
    but this time from top to bottom. The iPad’s screen area is composed of three
    different parts.


    +   - Status Bar (part of NUI)

    - URL Bar (part of NUI)

    - Visible area


    > **NOTE:** Some native applications like YouTube or iTunes use a Bottom Bar,
    as we saw in the iOS UI. This Bottom Bar is 48px height and is used to offer advanced
    options to the user.


    The NUI consists of all those elements that appear either the top or the bottom
    of an iPhone page. As designers and developers for Apple devices, we are interested
    in the Safari Web Browser Interface because our web site and web application will
    be rendered inside this application.


    Even on the iPad, we have different types of NUI used on the various native or
    web applications, but for the Mobile Safari Web Browser, there are just two (the
    third is optional), as summarized in Table 2–3.'
