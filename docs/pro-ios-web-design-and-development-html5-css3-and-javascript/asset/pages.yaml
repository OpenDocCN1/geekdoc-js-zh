  md: '# CHAPTER 3: Web Development for iOS Devices


    # Gradients


    A gradient is a browser-generated image specified entirely in CSS, which consists
    of smooth fades between several colors. Gradients are specified using the -webkit-gradient
    function and can be passed in place of an image URL. There are two types of gradients,
    linear and radial. You can specify in-between color values, called color stops,
    and the gradient function interpolates the color values between them.


    The function you use to create a color stop is called color-stop. You pass this
    function as a parameter to the -webkit-gradient function to specify the start,
    intermediate, and end colors in both a linear and a radial gradient. The colors
    between the specified color stops are interpolated, as shown in Table 3.6 and
    Figure 3–22.


    The CSS syntax is:


    ```

    -webkit-gradient (<gradient-line> <color-stop> <color-stop> <color-stop> <color-stop>
    );

    -webkit-gradient (<gradient-line> <color-stop> <color-stop> <color-stop> <color-stop>
    );

