  md: '# Electronic Prototype


    After learning as much possible from the paper prototype tests, we are ready to
    perform the electronic variation called the electronic prototype test (see Figure
    11–14). The test procedure remains the same; what changes is the level of user
    experience and the possibility for the tester to test functions and services that
    have not yet been implemented in the paper prototype test phase.


    The electronic test can be performed using a desktop computer, which is the case
    if you use the Fireworks Plugin. You will generally want to use a browser with
    a mobile user agent as a test environment.


    ![](img/7621e729711898868a82bc471fc9db3b_432_0.png)


    **Figure 11–14.** Electronic prototype test: textual description for driving the
    electronic test.


    Of course, because a website or application typically shares the same technology
    used to develop electronic prototypes, a better version of this test could run
    directly inside the mobile device. In this case, we can have an electronic prototype
    that offers different levels of functionality or service from -0% to -100%.


    An electronic prototype is used only to test the design and level of feedback
    but provide almost none of the functions and services comparable to a paper prototype.
    A prototype that provides most of the available functions and services produces
    a level of feedback comparable to the release version.


    In both desktop and mobile versions of the electronic prototype test, the tester
    plays the same role that he played in the paper prototype test, except that he
    does not manually change the views during the test. The tester assigns the user
    certain tasks to accomplish while recording notes about the user’s experience.'
  merge: -1
  pgno: 432
- img_proc: true
  md: '# Evaluating a Test


    Once all the prototype tests are complete, we need to work on our gathered data
    and feedback to evaluate the test. It is important to remember that a test''s
    feedback is only as reliable as the test model. This means that your prototype
    must simulate or represent the final release as much as possible.


    The problem is that, in this context, where a short-circuit is obvious, we need
    to use prototype tests that look like the final release in order to get reliable
    feedback. However, we did perform prototype tests to understand how to design
    the final release and/or to verify that the actual design is correct before implementing
    the final release (see Figure 11–15). The bottom line is that a test is just a
    test, and reliability is based on tests performed on incomplete prototypes.


    ![](img/7621e729711898868a82bc471fc9db3b_433_0.png)


    This fact is more apparent in a paper prototype test where paper seldom represents
    a real user interface and where poor color details interact in different ways
    with the cognitive perception that is the foundation of every user''s experience.
    These are things related to the visceral level of design—one of the three levels
    of design (along with behavioral and affective) that Donald Norman explains in
    Emotional Design. Failure to create a link with the visceral level of design results
    in failure to anticipate the real user experience because it dismisses the effect
    of, or emotional response, that a prototype can elicit in a user in a particular
    context.


    > NOTE: Donald Norman is an academic in the field of cognitive science, design,
    and usability engineering and a co-founder and consultant with the Nielsen Norman
    Group.


    For more information, visit http://www.jnd.org/books.html.'
  merge: -1
  pgno: 433
- img_proc: true
  md: '# CHAPTER 11: Testing iOS WebApps


    In contrast, the electronic prototype shares the same technology with the final
    release, so the test and the feedback will be more accurate. The percentage of
    accuracy can change according to the number of functions and services implemented
    in the prototype.


    # Variables and Feedback to Evaluate


    Generally speaking, a test can have a structure from very simple to very complex.
    Complex tests return rich and accurate feedback but also require resources and
    effort that are often beyond the scope of a small development team, let alone
    a single designer or developer.


    Continuing with the agile approach, we use several variables and types of feedback
    in order to get a clear idea of what level of experience our design, functions,
    and services can trigger in the user’s mind.


    # Number of Touches


    The first variable to manage the number of touches required by a user to accomplish
    a task. The number of touches is defined by the shortest path touch (SPT) from
    the starting point to the ending point of the content tree. The beginning point
    can be our home page or another page somewhere in the content tree for performing
    a more specific task. Figure 11–16 shows the steps necessary for the Call Support
    use-case. The path looks simple, but the simplified content tree represented by
    Figure 11–16 doesn’t represent the internal links between web pages.


    ![](img/7621e729711898868a82bc471fc9db3b_434_0.png)


    Figure 11–16. The number of touches used to accomplish the Call Support task.


    The SPT algorithm is used in other complex areas, but in our use-case the same
    concept is easily implemented by counting on the site map or content tree the
    number of touches needed to accomplish the task. The number of touches is reported
    by the tester in the use-case paper description as a reference.'
  merge: -1
  pgno: 434
- img_proc: true
  md: '# Number of Mistakes


    The second variable is the number of mistakes that the user makes while trying
    to accomplish his or her task. There are two categories of mistakes:


    +   - **Touch error.** When the user touches the wrong link (Figure 11–17).

    - **Touch misidentification.** When the user touches a non-touchable area (Figure
    11–17 right).


    When a user touches a wrong link, this means that he or she touched a link that
    brought him or away from the ending point and the link doesn''t belong to the
    shortest path of the task. This type or mistake can either be the fault of the
    user or the design.


    The tester needs to determine whether the design is correct and the user made
    a mistake triggered by the environment or some other cause, or whether the wrong
    design triggered the user''s mistake.


    ![](img/7621e729711898868a82bc471fc9db3b_435_0.png)


    It is different when the user touches a non-touchable area thinking that he/she
    touched a link. In 99% of these cases, the mistake was triggered by a design error.
    Design errors could mean a context with a lack of user orientation, or just a
    wrong user interface design. In any case, this type of mistake calls our attention
    to some detail that we apparently overlooked in the design phase.


    # Estimated Time of Arrival


    The third variable is the *estimated time of arrival* (ETA) (Figure 11–18), the
    time that the user needs in order to accomplish the task. The ETA is calculated
    against the tester, who knows the content tree and is able to pass the task.'
  merge: -1
  pgno: 435
- img_proc: true
  md: 'Usually, the shortest path time is used as the lower-bound for the test, as
    taken by the experienced tester. The lower-bound defines the optimum, a standard
    that in practice is almost never matched by the user during a test. The closer
    the user is to this estimated time, the better he or she can accomplish the task
    and (presumably) the higher level of user experience.


    ![](img/7621e729711898868a82bc471fc9db3b_436_0.png)


    **Figure 11–18. Call Support use-case: calculating the estimated time of arrival
    (ETA).**


    The ETA is reported in the use-case paper description as a reference for the tester.


    # # Collecting Feedback


    In addition to these three variables, there are three types of feedback that the
    tester can collect from the user’s comments.


    # # Design Feedback


    The first type of feedback is *design feedback* about the quality of the user
    interface. In the design part of this book, we learned that, in the touch-oriented
    world, every part of the design is an interface that collects feedback about every
    design element. Figure 11–19 illustrates two different emotional feedbacks for
    the same user interface.'
  merge: -1
  pgno: 436
- img_proc: true
  md: '# CHAPTER 11: Testing iOS WebApps


    ![](img/7621e729711898868a82bc471fc9db3b_437_0.png)


    Figure 11–19. Call Support usecase: two different design feedbacks for the same
    interface.


    Although this type of feedback can be useful in the paper prototype to indicate
    the correctness of our design, it has more weight if gathered during the electronic
    prototype test because the implemented interface is almost the same as the release
    version and the information contains more useful details.


    # Expectation Feedback


    The second type of feedback is expectation feedback about the design and service
    expectations of the user. This type of feedback is gathered every time the user
    lands on a web page that doesn''t match his expectation or touches a link thinking
    that it represents a different service from the one implemented. Figure 11–20
    shows what can happen when a user has a different mental representation of the
    landing page behind a link.


    ![](img/7621e729711898868a82bc471fc9db3b_437_1.png)


    Figure 11–20. Buy an iPhone Dock use-case: the expectation doesn''t match the
    design in the landing page.


    The weight of this type of feedback is almost the same on both paper and electronic
    prototype tests. These tests are useful for understanding how semantically our
    design, functions, and services are represented in the user''s mind and whether
    this meaning corresponds to our original plans.'
  merge: -1
  pgno: 437
- img_proc: true
  md: '# Emotional Feedback


    The last type of feedback is emotional feedback about the inner feelings of the
    user during the test session. This type of feedback has more weight for the electronic
    prototype test session and isn''t even gathered in the paper prototype test session.


    Emotional feedback is triggered by two types of stimuli. One is absolute and triggered
    by colors, design elements, and everything involved in the identity of the project.
    In Figure 11–21, this stimulus is represented by the iPhone.


    The other type of feedback is relative and involves the environment and the changes
    that this type of stimulus triggers in the user’s inner world, as shown in Figure
    11–21. The word “environment” refers to everything belonging to the physical world
    (except the mobile device) outside of the human user.


    ![](img/7621e729711898868a82bc471fc9db3b_438_0.png)


    This type of feedback can give important information about the user’s inner world
    during the test. This type of feeling is important as part of the global communication
    that comes from our web site or application. In order to test a relative stimulus,
    such as the environment, we need to implement an electronic prototype directly
    on the mobile device and go outside, allowing the user interface to find the real
    world.


    # Evaluation Techniques


    Evaluating a test can be difficult, especially when working with a large amount
    of data and a wide-ranging project. We can apply statistical methods from a discipline
    called descriptive statistics to obtain reliable values. After performing a prototype
    test, we no longer need this type of approach, and an agile method can still provide
    reliable values without involving heavy calculations and complex mathematical
    skills.'
  merge: -1
  pgno: 438
- img_proc: true
  md: '# Test Variable Evaluation


    The simpler way to evaluate the variables in the prototype test is to count the
    number of occurrences of each variable and compare it to the number of occurrences
    in the actual test. In UML, the entity used to estimate (or represent) the expected
    value from a use-case test is called Oracle. In our test, the Oracle is represented
    by a set of variable values represented by natural numbers.


    In our prototype tests, there are three natural numbers to represent three types
    of variables: one for the number of touches, one for the number of mistakes, and
    one for the time of arrival.


    The simplest method is to set a lower-bound for each variable that has been matched
    to the test. Figure 11–22 shows a textual representation of the variable values
    in the use-case textual description. In our example, we set these values equal
    to the passed test (the user is four touches away from the Support link), which
    means the test will be either passed or failed.


    ![](img/7621e729711898868a82bc471fc9db3b_439_0.png)


    Figure 11–22. A textual use-case with notes about the variable values.


    Once we set the minimum value for each variable, we need to set the variable''s
    *modal* operator for the test. Variable modal operators set a verb for each variable
    showing how the expectation value should match. Generally, only a few modal operators
    are used. We use two for our purpose: "must" and "should."


    The modal operator shows whether a variable''s *value* must be matched or *should*
    be matched in order to pass the test. We present only a simple example of a prototype
    test: for more complex projects and tests, its a good idea to add a certain level
    of matching for each variable.


    Our use-case test can be passed by performing four touches, with no touch mistakes.
    The "should" attribute of the ETA variable says that the value of this variable
    is not a "must" for passing the test. In some cases, a more reliable result can
    be achieved'
  merge: -1
  pgno: 439
- img_proc: true
  md: 'by including some sub-set of passed cases, setting a percentage to match for
    each variable.


    # Test Feedback Evaluation


    When working with variables, the most important thing is to know how to set them.
    After this difficult part is done, all that is left to compare the data. This
    approach is more technical but doesn''t require a great deal of skill or experience
    from the tester.


    A completely different scenario is the feedback evaluation. This is because we
    will not have a number with which to compare and our experience will play a fundamental
    role. For this reason, we can introduce any experimental method or technique to
    evaluate the feedbacks, as long as we specify the procedure..


    ![](img/7621e729711898868a82bc471fc9db3b_440_0.png)


    **Figure 11-23.** The use-case notes with the user feedbacks


    Collect the three types of feedback. Figure 11-23 shows an example of how we can
    note the user feedback. When everything is in place, we need to remember that
    every feedback has weight. The weight of a feedback is its inner value in relationship
    to the context. A user might report confusion with our interface, the level of
    stress in a specific context might be the result of decreased cognitive resources,
    or these patterns might have been conditioned by another application or some ambient
    variables. For this reason, the tester''s experience and practice are needed to
    gather reliable information from the user''s feedback.'
  merge: -1
