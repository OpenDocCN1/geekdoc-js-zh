  md: "# HTML5 Media\n\nWeb standards such as XHTML, CSS, and Javascript provide us\
    \ everything we need to publish text and images and they add interaction to our\
    \ projects. The problem comes when we are working with audio and video. In order\
    \ to insert audio and video contents, we used to rely on external plug-ins like\
    \ Adobe Flash. HTML5 fills this gap by introducing new tags to embed audio and\
    \ video without requiring external plug-ins.\n\n# The Video Tag\n\nThe new <video>\
    \ tag is by far the most famous tag in the HTML5 list, because of the well-known\
    \ controversy between Apple and Adobe about Flash technology support. It enables\
    \ us to play a video in our web site or web application directly in the browser.\
    \ This feature is valid only for the desktop browser. In an iPhone or iPad environment,\
    \ the video is not a real embedded video because it does not play in the browser.\n\
    \niOS always launches the built-in media player, which occupies the full screen,\
    \ where the user can use the Done button to return to the web site or web application.\
    \ The <video> tag structure used for the TV Ads of our \"The Store\" use-case\
