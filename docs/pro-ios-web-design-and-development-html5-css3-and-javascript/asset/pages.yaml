    probably a good idea to write a WebApp. Now, we can resume our previous discussion,
    compiling two easy-to-read lists with some important pros and cons of WebApps,
    which we will go on to discuss.


    Some pros of WebApps are:


    +   - Objective-C skills are not required

    - Apple development program subscription is not required

    - Developing on a Mac running OSX is not required

    - Web standards are reusable in other development areas

    - Development life cycle is fast

    - Bug fixing is in real time

    - An enterprise WebApp doesn''t require an enterprise license

    - A Web don''t require Download and Installation

    - WebApps are accessible to Apple and non-Apple devices

    - WebApps will run on every device (mobile or desktop) with a browser

    - WebApps are packable in native app with tools like PhoneGap

    - We don''t have to share our revenue with Apple


    Some cons of WebApps are:


    +   - In some heavy contexts, WebApps are slower than native apps

    - Some sophisticated UI effects are difficult to achieve

    - Data stored in the file systems are not accessible

    - Some hardware features are not required

    - A personal payment system is required if we want to charge for the app


    Some of these points are very relevant. I love Objective-C, I enjoy programming
    and like the native approach paradigm, by using the WDM, many creative web designers
    and developers will be able to reuse their (web standards) skills and start to
    work on iPhone and iPad in no time.'
