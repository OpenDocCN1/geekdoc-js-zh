  md: '# Keyframes


    Keyframes are used to specify the values for animating properties at various points
    during the animation. The keyframes specify the behavior of one cycle of the animation;
    the animation might trigger one or more times.


    Keyframes are specified using a specialized CSS at-rule. A @keyframes rule consists
    of the keyword "keyframes", followed by the identifier "animation-name" that gives
    a name for the animation, followed by a set of style rules.


    The CSS grammar for this rule is the following:

    keyframes-rule: ''@keyframes'' IDENT ''{keyframes-blocks}'';

    keyframes-blocks: [ keyframe-selectors selector ]

    keyframes-selectors: [ ''from'' | ''to'' | PERCENTAGE ] [ '','', ''['' ''from''
    | ''to'' | PERCENTAGE ] ];


    # Reflections


    Other CSS3 property is typically Apple-style as the reflection property. Reflection
    is used on every product presentation in the Apple store, and combined with the
    use of negative space, it is a valuable tool for achieving clean design.


    > NOTE: As we saw analyzing the Laws of Perceptions, negative space, in art, is
    the space around and between the subject(s) of an image.


    > Negative space is most evident when the space around a subject, and not the
    subject itself, forms an interesting or artistically relevant shape. This space
    is occasionally used as an artistic effect of the "real" subject of an image.
    The use of negative space is a key element of artistic composition and visual
    design.


    The reflection property is composed of three arguments or values in order to achieve
    the final effect. The first argument sets the direction of the reflection. The
    second argument specifies the offset of the reflection. The third argument is
    a mask applied to the reflection passed using the gradient property.


    Table 7–38 shows the CSS Level 3 reflection property. The CSS syntax is the following:

    -webkit-box-reflect: <direction> <offset> <mask-box-image>;'
