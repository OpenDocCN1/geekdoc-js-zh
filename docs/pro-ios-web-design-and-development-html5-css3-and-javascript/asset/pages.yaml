  md: '# CHAPTER 12: Maximizing the Market for iOS WebApps


    Figure 12–7, shows that the OpenAppMkt has applied the best practice of inserting
    the reminder “Add to Home Screen” into the WebApp for both iPad and iPhone users,
    increasing the native-like experience.


    ![](img/7621e729711898868a82bc471fc9db3b_451_0.png)


    Figure 12–6. The web hub site eHub is a constantly updated resource for Web applications.


    Another good WebApp portal is eHub (see Figure 12–8), available at http://emilychang.com/ehub/
    . This portal hosts desktop projects as well as mobile applications and generates
    a large amount of Internet traffic.


    # Use the Virality of Social Networks


    Building a web site is a fundamental step for the marketing plan of a Web application;
    adding a blog is also a good way to update users about bug fixes and new features.
    Social networks offer a perfect platform for various types of promotion, from
    personal to business.


    Subscribing to a social network gives you the opportunity to post any type of
    update. It is even faster than a blog and gives you the opportunity to find and
    create new important relationships, as shown in Figure 12–9. In this respect,
    not all social networks are equal; for example, platforms such as Twitter and
    LinkedIn (which are alike to import tweets inside a personal home page) are more
    business-oriented than Facebook. However, it is important to optimize any communication
    channel available.'
  merge: -1
  pgno: 451
- img_proc: true
  md: '# CHAPTER 12: Maximizing the Market for iOS Apps


    # 423


    ![](img/7621e729711898868a82bc471fc9db3b_452_0.png)


    **Figure 12–9.** An example of social network interconnection (source: image from
    Labrow Market).


    Speaking of general Web projects, the first step might be to create a LinkedIn
    account. LinkedIn is a business-oriented social network platform and is the best
    channel for creating important links with designers, developers, and professional
    teams around the world. A LinkedIn profile is complete and offers a great opportunity
    to show your knowledge and experience, also offering the ability to send invitations
    to your e-mail contacts and to import your Twitter Timeline and your SlideShare
    Presentations, creating a powerful connection with many of your channels.


    The second step might be to create a Twitter account. The account can be personal
    or dedicated to the Web application. Twitter is a creative micro-blogging social
    network platform. That, in addition to users, many professional designers and
    developers use it to share news and updates on their projects. With its post limit
    of 140 characters, Twitter is perfect for short and fast project updates. Your
    personal Twitter home page can be customized by modifying the background image
    and the color palette of the theme to match any personal identity.


    The third step might be to create a Facebook page for your App. Facebook is the
    least business-oriented of these three networks because the percentage of people
    who use Facebook for professional purposes is minimal compared with Twitter and,
    especially, LinkedIn. Nevertheless, the smart use of Facebook might enable you
    to reach new potential users—who are not already big App users or are returning
    customers. In this phase, it''s also important to bear in mind that different
    projects have different requirements and priorities. Choose the right social network
    to reach your target user profile.'
  merge: -1
