  md: '# Page Title


    The HTML page title is one of the most important tags to optimize. The page title
    displays as the first line in the SERP, and it''s the most meaningful source for
    our WebApp. A good page title is short and includes the main keyword or keywords
    that identify our page.


    ```

    <title>The Store</title>

    Page Title /* * Store Index

    <title>The Store (U.S.)</title> /* * US Home Page Title */

    <title>The Store (U.S.) | Contact Us</title> /* * Contacts Page Title */

    ```


    We must use a unique title for each page and every title must include the name
    of the WebApp. The code shows three examples for the “Store” use-case.


    # Meta Tags


    There was a time when meta tags were the holy grail of SEO, but nowadays the situation
    changed due to the abuse of this tag by webmasters. An important tag to optimize
    is the description meta tag. A search engine like Google uses this tag to display
    a description of our web page as the second and (if the text is long enough) in
    the SERP. A good description tag includes our keyword (or keywords) and is informative.
    The following code is an example from the “Store” use-case.


    ```

    <meta name="description" content="Apple creates iPod and iTunes,É Mac laptop and
    desktop computers, the OS operating system, and thé revolutionary iPhone and iPad."
    /> /* * Store Index Description Metatag */

    ```


    Another important meta tag is the keyword tag: it''s not fundamental but it''s
    still important. As we can see from the following code, in “The Store” use-case
    the choice is easy because a big brand like Apple needs only one keyword: Apple.
    In other projects, those that have one keyword works fine; don''t abuse it.


    ```

    <meta name="Keywords" content="Apple" /> /* * Store Index Page Keywords Metatag
    */

    ```


    Keywords must match the words and phrases that potential visitors will use when
    searching for your site.


    # Content


    Content is important to optimize our web pages. In the end, what users are looking
