  md: 'corresponding to three types of different behaviors according to the WebApp
    requirements:


    +   - CACHE MANIFEST

    This is the Cache Manifest header.


    +   - CACHE

    Resources are always loaded from the cache, even in online mode.


    +   - NETWORK

    Resources are always loaded from the server, even if the file is listed under
    the CACHE header. This is an exception to the CACHE rule.


    +   - FALLBACK

    Resources are used as replacements for other resources that fail to load or incompletely.


    If we list the resources right after the "CACHE MANIFEST" declaration header without
    specifying any of the three types of (sub) headers, the default CACHE type will
    be applied to all the listed resources. A typical cache manifest file looks like
    the following code:


    ```

    CACHE MANIFEST

    CACHE

    # Comment on Cache Rule Files

    file01

    file02

    fileN

    NETWORK

    # Comment on Network Rule Files

    file01

    file02

    fileN

    FALLBACK

    # Comment on Cache Rule Rules

    file01

    file02

    fileN

    ```


    Below the header we can also insert comments using the prefix "#". This feature
    is often used to mark the cache version, modify the Manifest File, and force an
    update of the cache. The following code shows the Manifest File of "Store" use-case.
    If we need to cache an entire folder, like in "Store" use-case, we can simply
    insert the absolute folder path and all the files will be added by default to
    the cache manifest whitelist.


    ```

    CACHE MANIFEST

    # WebApp Images inside the pic folder

    http://www.thestore.com/images

    # WebApp Images inside the images folder

    http://www.thestore.com/images

    ```


    In this code we use an absolute path, but a relative path is also allowed; it''s
    totally up to you. After creating the Manifest File, we need to save it using
    the extension ".manifest".'
