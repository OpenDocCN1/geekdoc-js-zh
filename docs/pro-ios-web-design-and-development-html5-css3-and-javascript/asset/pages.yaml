  md: '# Chapter 5


    # # iPhone UI Design: Think Simple


    > “Less is more..."

    — Ludwig Mies van der Rohe


    This chapter is all about user interface design for the iPhone. We will first
    introduce the basic concept for designing that interface, which is “think simple”
    and will then look at iPhone users’ experiences and the nature of users’ limitations.


    After this brief introduction, we will explore the anatomy of sketching using
    freehand sketching techniques and explain how to mock up a user interface with
    some useful tools, such as Balsamiq. We will explore Balsamiq’s interface and
    show how to optimize it.


    Next, we will jump directly into Adobe Fireworks and explain how to design a user
    interface by pixel. When designing a user interface, you need to control every
    pixel of all the elements. Adobe Fireworks provides better tools and interfaces
    for working with pixels enables you to keep the user interface elements under
    constant control and modify them more easily than with Adobe Photoshop. Adobe
    Fireworks also offers a better export tool compared to Photoshop, allowing you
    to better optimize the weight of each graphic element. Everything you design in
    this book can also be achieved using Adobe Photoshop, so free to use it if you
    prefer.


    In the last part, we will show you how to reuse your design to create a user case
    and provide a visual representation of the user experience.


    # ## User Interface Sketching


    In Chapter 4, you learned about the interface design process and saw an iPhone
    version of “The Store” use case. Chapter 4 focused on the interface design principles
    used to design an amazing touch interface.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# CHAPTER 5: iPhone UI Design: Think Simple


    In this chapter and the next, we will explain in detail how we designed our touch-optimized
    interface. We will also go through the whole creativity process from the sketch
    to the final product.


    # Think Simple


    Less is often more. Therefore, "think simple" is the leitmotif of our iPhone design
    and development activities. In previous chapters, we built the foundation to understand
    why the "think simple" concept is the right approach to optimize the mobile experience
    on a small device like the iPhone.


    > NOTE: A leitmotif is a musical term referring to a recurring theme associated
    with a particular idea. By extension, the word has also been used in other contexts
    to mean any sort of recurring theme, practice, or idea.


    In the next paragraphs, we discuss the main points behind the "think simple" concept,
    thus tying together what you learned in the previous chapters.


    # The iPhone is an On-the-Go Device


    For the majority of users, the iPhone is used on the go. If you are at home or
    work and have a desktop, notebook, or tablet, you will probably not use the iPhone.


    This probability is even greater since the iPad was released. Before the iPad,
    it was likely someone who needed to use a mobile service would use the iPhone.
    However, this has changed now that millions of iPads have been sold.


    To use an iPhone on the go, users require resources with a simple structure that
    allow the device to function in various contexts.


    # The Essence of the iPhone Page Model


    The iPhone page model is the basic structure of all our works. It is a linear
    and simple structure and works perfectly with the iPhone. However, it doesn''t
    allow designers and developers to present content in a more detailed way.


    The linear flow of the contented with the iPhone is perfect for a mobile context
    and it is important to stick with this concept without trying to add any techniques
    used with desktops or tablets. Even the multitasking feature introduced in iOS4
    the page model, which enabled users to use multiple applications, although just
    one page at a time.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# iPhone Limitations


    The iPhone is based on a 3.5–inch display and no matter how brilliantly designed
    or developed a WebApp, the amount of screen estate remains the same. Even the
    retina display has the same dimensions and user interface proportions inside the
    visible area are the same. This means that, despite better readability of the
    user-interface elements, the level of user experience remains the same.


    We also need to remember that, despite the fact iPhone revolutionized the user
    experience and the paradigm behind browsing the mobile web, it still remains a
    small phone optimized for mobile content that has limited hardware features. For
    example, the new touch keyboard was a huge improvement over the qwerty used in
    the old smartphones because it can change following the application needs and
    can be used in portrait and landscape modes. However, with a 3.5-inch display,
    it will always be limited to a subset of possible cases.


    # The Nature of Users'' Cognitive Resources


    Everything in this world is finite and most things are accessible in a limited
    way. This is just the way things are. In our mobile context, the screen dimension
    is limited, as is the available bandwidth, the services offered, and the RAM.
    Thus, users'' cognitive resources are limited.


    Because user experience is born and develops in the brain, users'' cognitive resources
    affect their iPhone experiences. It is important to be aware of this. Limited
    cognitive resources imply the user interface must be optimized in a simple way
    and we realize that some contexts require more cognitive resources than others.


    > In the end, the best we can do is never forget the words of Leonardo da Vinci:
    "Simplicity is the last signification."


    # Anatomy of Sketching


    Sketching might appear to be an easy part of the whole design process. You take
    a pen and a piece of paper and you''re done. After all, you don''t have to paint
    the Sistine Chapel! However, nothing could be further from the truth. Sketching
    a view, as it is called in native development, means syncing your hand with the
    creative part of your mind. For this reason, a simple thing like sketching requires
    years of practice.


    HISTORICAL NOTE: The first example of modern sketching dated back to the first
    half of the fifteenth century in Siena by Mariano di Jacobi detto Taccola produced
    a set of four volumes on civil and military technology called De Ingenis.'
  merge: -1
  pgno: 210
- img_proc: true
  md: 'Fortunately for us, sketching a view is simpler than other kinds of engineering
    or architectural sketching; however, the foundations are the same. Before sketching
    a use case, you must keep the following points in mind.


    +   - **Quick**nA sketch must aim to give only an impression.

    - **Direct**nA sketch uses simple and clear wording.

    - **Minimal**nA sketch includes only what is required to communicate the message.

    - **Freedom**nA sketch gives a sense of openness because it is composed of instinctual
    lines instead of tight, precise lines.

    - **Grouped**nA sketch makes sense in contexts created by other sketches.

    - **Suggest**nA sketch doesn''t explicitly state something, but explores a concept
    that suggests a design and development path.


    Now that you have a better idea of what a sketch means, the first step is to sketch
    your ideas using pen and paper. This is an important step because your mind is
    better connected to your hand than your mouse.


    In the sketching phase, you will:


    +   1. do some freehand sketching on white paper,

    2. create logical connections between sketches, and

    3. redesign your freehand sketches using a stencil.


    Figure 5-1 shows three iPhone views sketched on paper. For these sketches, we
    used a handmade wood stencil with 1:1 dimensions. As you might notice, a standard
    X box was used to represent all the images. This is a standard practice for wireframe
    design but is also recommended for sketching in order to focus solely on representing
    the page structure. More information regarding the best practices for sketching
    a user interface will follow in chapter 6 when we detail the iPad use case.


    When starting a project from scratch, creating logical connections between views
    will help you clarify your ideas and contextualize your design. It is a good idea
    to print all the views, post them on a wall, and discuss your ideas with others.'
  merge: -1
