  md: '# # Web Standards for WebKit: Maximizing Mobile Safari


    > "It''s not just what it looks like and feels like.. Design is how it works."
    — Steve Jobs


    In this rather long chapter, we talk about web standards from a mobile Safari
    point of view. In the first part, we introduce HTML5, its markup syntax, its new
    tags, and how it has redefined some tags from HTML4. We discuss the semantics
    of HTML5 and the <video> and <audio> tags. We also introduce the <canvas> tag,
    and at the end of this section, we show a live example of a slideshow implemented
    in the “Store” use case.


    In the second part, we look at CSS Level3, its new properties, and its syntax.
    We enumerate all of the values that can be used with these new properties.


    In the last part of the chapter, we discuss Javascript''s fundamentals: its syntax,
    statements, functions, and methods. We also look at the Browser Object Model (BOM)
    and the Document Object Model (DOM), and we show how you can use these to change
    a webpage dynamically.


    NOTE: This chapter covers the basics of each technology area, so if you are confident
    in HTML5, CSS3, and Javascript, feel free to skip to the next chapter, or to the
    relevant section in this chapter, for a refresher on those areas in which you
    are rusty.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Comparing iPhone and iPad for Web Presentation


    As discussed previously, the iPhone and iPad are two different devices. One common
    denominator between these two devices is their HTML5 semantic structure.


    What is different in these two devices is how they present the content represented
    in our projects by two different CSS3 style sheets and Javascript behavior. The
    iPhone is based on a Page Model Paradigm, whereas the iPad is based on a Block
    Model Paradigm, or a Multiple Page Model Paradigm.


    In this chapter, we look at how the web standards play a common role hidden behind
    these differences and how to use them to develop better web sites and web applications.


    # HTML5


    The physicist Tim Berners-Lee developed the Hypertext Markup Language (HTML) in
    1989 while he was working at Organisation Européenne pour la Recherche Nuclaire
    (CERN).


    In 1991, HTML was mentioned publicly for the first time and in 1995, it reached
    the 2.0 version passed through the 3.2 and 4.0 versions in 1997 and reached the
    well known 4.0.1 version in 1999. Work on HTML5 started in 2004 and will reach
    the status of "proposed recommendation" version, which is scheduled for 2022.


    The 2022 date might sound too away for designers and developers, but we can focus
    ourselves on what we can do with this language today. In 2012, HTML5 will reach
    the status of candidate recommendation, which means that some of the most interesting
    features such as audio, video, and canvas tags, web workers, geolocation, application
    caches, and the HTML5 semantic caches are currently available and can be used.


    We introduce application caches in Chapter 10, but the following sections introduce
    the foundation of this new web standard.


    # HTML5 Markup Syntax


    A markup language is designed for the processing, definition, and presentation
    of text; the codes used to specify the formatting are called tags. HTML5 defines
    an HTML markup syntax that is compatible with HTML4 and XHTML1; most of HTML4.0.1
    has survived in HTML5.


    HTML5 is designed to be the successor to HTML4 and aims to improve interoperability
    and reduce development costs by making precise rules on how to handle all HTML
    elements, and for the first time for a markup language, on how to recover from
    errors. Error handling is not as important for web designers and web developers
    as it is for browser makers and testers.'
