  md: '# Prefixes


    +   * Text Effects

    * Hyperlink Presentation

    * Speech Module


    > NOTE: CSS3 is still a “work in progress” project, and you can have a look at
    the complete list of modules here: www.w3.org/Style/CSS/current-work.


    The main impact of CSS3 is the capability to achieve the current design features
    in a much easier way and to use new selectors and properties to introduce new
    design features, such as animation or gradients effects.


    Now we see some of the most common properties that are found in every iPhone and
    iPad framework available to design and develop for iPhone and iPad. We master
    these properties in Chapter 8 when we expand on our frameworks.


    Until all of the CSS3 modules reach recommended status, every browser vendor has
    the faculty to decide how to implement these properties. For this reason, a proprietary
    prefix is placed in front of every property.


    The point of vendor-specific prefixes is to let other rendering engines know that
    the property can be safely ignored without creating an error. At the same time,
    it lets the developer know that those properties are experimental and not fully
    supported, even if planned by the W3C.


    Once CSS3 has been completely defined, supported, and officially becomes a Web
    Standard, all of these prefixes will be removed.


    An example is the following:


    ```

    border-radius: 3px;

    -webkit-border-radius: 3px; (Webkit-based Browser implementation)

    -moz-border-radius: 3px; (Gecko-based Browser implementation)

    ```


    At present, working with desktop websites and web applications, we need to specify
    the same property several times, at least once for each of the most common browsers,
    in order to achieve a minimum level of CSS3 properties accessibility.


    In our Apple devices context, we need to take care of WebKit CSS3 implementation,
    because we use only WebKit-based browsers like Safari.'
