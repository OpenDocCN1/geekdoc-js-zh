- img_proc: true
  md: 'with a different pattern and then switch to a Z pattern before returning again
    to the original one.


    # The F-Shaped Pattern


    The F reading pattern is typically composed of two horizontal stripes followed
    by a vertical stripe. The F can also stand for fast, because this is the typical
    pattern used by a user in a hurry-mode.


    This pattern is composed of three eye movements:


    +   1. The user reads in a horizontal movement across the upper part of the content
    area. This element forms the F’s top bar.


    +   2. The user then moves down the page bit and begins to read across in a shorter
    second horizontal movement. This element forms the F’s lower bar.


    +   3. The user scans the content’s left side in a vertical movement. This element
    forms the F’s vertical stem.


    In this mode, the user’s reading patterns are not always composed of exactly three
    parts and are not always like the letter F, but we can easily recognize the pattern
    even in its different variations.


    ![](img/7621e729711898868a82bc471fc9db3b_180_0.png)


    Anyone familiar with object-oriented programming can see that the F reading pattern
    is like the super-class and that different user behaviors are like different implementations
    of the super class.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Implications of the F-Shaped Pattern


    The implications of the F pattern show how important it is to follow a guideline
    in the design phase in order to optimize the user experience. These implications
    are as follows:


    +   - User Won’t Read the Content thoroughly in a Word-by-Word Manner


    Exhaustive reading is rare, especially during Internet research. Some users might
    read a larger portion of your contents but most won’t.


    +   - Most Important Information Must Be Stated in the First Two Paragraphs


    That’s the only way to have some hope that the user will actually read the content.
    Reading more of the first paragraph probably will drive the user deeper into the
    content.


    +   - Begin Paragraphs with Information-Carrying Words


    This is because the stem of the “F” pattern will have less chance of grabbing
    the user’s attention than the top bar. In this part of the pattern, the user reads
    only the first words of the pattern.


    +   - Insert the Most Important Links of the User Interface on the Left Side


    The F pattern decreases the user attention from left-to-right; links on the far
    right part of the user interface are less likely to be noticed.


    An important factor concerning the reading pattern is that it might also be influenced
    by the browsing context. If a user looks for something that contains numbers,
    a price for example, the F pattern could be transformed into an “E” or a “Comb”
    pattern.


    # Images in Reading Patterns


    Images are a powerful tool of web design. By using the correct image, you can
