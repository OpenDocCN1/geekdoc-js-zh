  md: '# CHAPTER 10: Optimizing iOS WebApps


    ![](img/7621e729711898868a82bc471fc9db3b_403_0.png)


    Figure 10–7. Usability problems: different groups could discover different types
    of problems


    The problem of selecting a sample size seems to be solved because four to five
    users should be the right number for our test session. Even the Nielsen studies
    in early 1990s confirmed this size. Unfortunately, problems don’t uniformly affect
    users, as Woolrych and Cockerton in their studies in 2001. This means that a simple
    estimate of problem frequency with the binomial distribution is misleading.


    For this reason, the best approach we can choose for a medium to large project
    is to set a few-to-four users in order to represent different category of users,
    as shown in Figure 10–7, and discover as many problems as possible. In practice
    we need to perform a test with a group, fix the discovered problems, and then
    re-perform the test with another group. Probability and statistic studies on usability
    problems are long and complex, by simplifying the conclusions (as in Figure 10–8)
    we can see that with an average number of 18 users we can discover 85% of the
    problems. This is supported by Jakob Nielsen and Thomas Landauer in their speech
    “A mathematical model of the finding of usability problems,” at the Proceedings
    of ACM INTERCHI Conference (Amsterdam, The Netherlands).


    ![](img/7621e729711898868a82bc471fc9db3b_403_1.png)


