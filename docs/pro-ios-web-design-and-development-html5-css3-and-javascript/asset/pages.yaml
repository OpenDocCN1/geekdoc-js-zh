- img_proc: true
  md: '# CHAPTER 10: Optimizing iOSWebApps


    +   - d: Dampening Factor: The probability that, on each page, a random surfer
    will request another random page. Nominally this value is set to 0.85 and could
    be between 0 and 1.


    Let''s assume a small universe of web pages with the following relationship, as
    also shown in Figure 10–11.


    +   - Page A: Doesn''t link any page

    - Page B: Link to page A and page C

    - Page C: Link to page A

    - Page D: Link to page A, page B, and page C


    With a universe of four web pages, the initial approximation value of the PageRank
    would be evenly divided between these four web pages and is 0.25 (0.25 * 4 = 1).
    Assuming a damping factor of 0.85 for each page provides the following equation:


    ```

    PR(A) = (1-d) + d(PR(B)/2 + PR(C)/1 + PR(D)/3)

    PR(A) = (0.15) + 0.85(0.25/2 + 0.25/1 + 0.25/3)

    PR(A) = (0.15) + 0.85(0.125 + 0.250 + 0.083)

    PR(A) = (0.15) + 0.85(0.458)

    PR(A) = (0.15) + 0.3893

    PR(A) = 0.5393

    ```


    In Figure 10–11 we can see the calculation of the PageRank value from our example
    using a mathematical notation.


    ![](img/7621e729711898868a82bc471fc9db3b_413_0.png)


    Figure 10–11. The Google page rank algorithm: web B, C, D add their PageRank value
    to web A


    Figure 10–12 shows the same concept in which web page A receives a Page Rank value
    according to the PageRank value of each other web page that is linked to it.'
  merge: -1
