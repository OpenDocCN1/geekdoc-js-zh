  md: 'Once we grab an element, we can use two different types of elements to achieve
    our goal: one for getting an attribute and one for setting an attribute. In Table
    7–48, we can see these methods.


    # Table 7–48. Javascript Setter and Getter Attribute Methods


    | Property | Description |

    | --- | --- |

    | getAttribute() | Returns the attribute name |

    | setAttribute() | Sets the specified attribute name at the specified attribute
    value |


    When we want to get an attribute, we pass the name of the attribute to the method
    in string format surrounded by double quotes. When we want to set an attribute
    we pass the name of the attribute and the value of the attribute, always in string
    format surrounded by double quotes. The syntax is the following:


    ```

    elementName.getAttribute("align");

    elementName.setAttribute("align", "left");

    ```


    So far we have changed only the attribute of an element but sometimes we might
    need to change not only the attribute, but also the content of element. The best
    way is by creating it manually and inserting individual DOM nodes in the document,
    which changes the page on the fly. The process requires two steps:


    +   1. Create the element.

    2. Add the element to the document.


    In the next example, we add an entry to our edgeMenu or in other words we add
    a `<li>` element to the `<ul>` unordered list that we used for our menu.


    ```

    var edgeMenu = document.createElement("li");

    edgeMenu.appendChild(newEdgeMenu);

    ```


    After we create and append a new node to the edgeMenu, we might need to add text
    to it. We can do this using the following syntax:


    ```

    var menuText = document.createTextNode("Watch TV Ads");

    newEdgeElement.appendChild(newMenuText);

    ```


    So far, we used two new methods to create nodes, and in Table 7–49, we can see
    some useful methods for manipulating the DOM tree structure.'
