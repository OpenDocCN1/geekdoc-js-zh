  md: '# CHAPTER 3: Web Development for iOS Devices


    In the following pages, you will find two tables, one with the new tags in HTML,
    and one with all the <video> tag attributes, to use as a small standard reference.


    As shown in Figure 3-18, HTML, CSS and JavaScript are used to achieve the following
    goals:


    +   - HTML: Page structure (semantic terms)

    - CSS: Page presentation (aesthetic terms)

    - JavaScript: Page behavior (in user-interaction terms)


    # HTML: Introducing the New Features


    HTML is designed to be the successor to HTML4 and aims to improve interoperability
    and reduce development costs by making precise rules on how to handle all HTML
    elements


    Behind that, HTML also allows developers to create cross-platform design through
    expressing the content more semantically. An example is the group of new tags
    like <header>, <nav>, <section>, <aside>, and <footer> that make the content machine-readable
    and make it easier for the mobile browser and search engine to treat content properly.


    Some of the new features in HTML are also functions for embedding audio, video,
    graphic, client-side data storage, and interactive documents. Five of the most
    exciting features introduced with HTML are:


    +   - Web Workers

    Allows hyper-threading for web browser (supported by iOS5). Separate background
    threads are used to do processing without affecting the performance of a webpage.
    This is an important feature when we develop WebApps and (often) when we rely
    on heavy script to perform functions.


    +   - Video Element

    Embed video without having to rely on third-party (often proprietary) plugins
    or codecs (which are not available on Apple mobile devices). Now embedding and
    manipulating a video is as easy as embedding and controlling an image.


    +   - Canvas

    Allows us to render graphics and images on the fly. In certain situations in our
    mobile context, saving bandwidth by using a canvas instead of an image is extremely
    advantageous.'
