- img_proc: true
  md: "Every time the orientationchange event occurs, the updateOrientation method\
    \ is invoked and the displayed string inside the <div id=\"output\\> element is\
    \ updated.\n\n# Orientation Change Media Query\n\nWorking with the orientationchange\
    \ event is a solid way to implement any kind of switch based on device orientation,\
    \ but it is not the only way. The orientationchange event also offers options\
    \ to a developer, but in some contexts, we can accomplish something similar without\
    \ using JavaScript. In this case, we will describe how to use a media query.\n\
    \nA media query is a media type composed of one or more expressions that check\
    \ one or conditions of certain media features. The concept is the same as the\
    \ one used with the orientationchange; what will change the language used and\
    \ its syntax.\n\nThe UIKit framework used for the Apple Store uses the same approach.\
    \ The following small piece of code shows one example from this framework style.css\
    \ file.\n\n```\n@media screen and (max-width: 320px) {\n  #topbar {\n    height:\
    \ 44px;\n  }\n  #title {\n    line-height: 44px;\n    font-size: 16px;\n  }\n\
    }\n```\n\nAs previously mentioned, it is always considered best practice to develop\
    \ three different versions of the WebApp for iPhone, iPad, and the desktop PC\
    \ hardware and software characteristics—or least one mobile version for the iPhone\
    \ and one compatible version for both the iPad and the desktop PC. In addition,\
    \ the next example shows a general case where we need to handle CSS style sheets\
    \ for the same web page.\n\n```\n@media screen and (device-width: 320px) and (orientation:\
    \ portrait) {\n  /* CSS Rules for iPhone 2G, 3G, 3GS in Portrait Orientation */\n\
    }\n```\n\n```\n@media screen and (device-width: 480px) and (orientation: landscape)\
    \ {\n  /* CSS Rules for iPhone 2G, 3G, 3GS in Landscape Orientation */\n}\n```\n\
    \n```\n@media screen and (device-width: 480px) and (orientation: portrait) {\n\
    \  /* CSS Rules for iPhone4 in Portrait Orientation */\n}\n```\n\n```\n@media\
    \ screen and (device-width: 960px) and (orientation: landscape) {\n  /* CSS Rules\
    \ for iPhone4 in Landscape Orientation */\n}\n```\n\n```\n@media screen and (device-width:\
    \ 768px) and (orientation: portrait) {\n  /* CSS Rules for iPad in portrait orientation\
    \ */\n}\n```"
  merge: -1
  pgno: 371
- img_proc: true
  md: "```\n}\n\n@media only screen and (device-width: 1024px) and (orientation: landscape)\
    \ {\n  /* CSS Rules for iPad in Landscape Orientation */\n}\n@media only screen\
    \ and (device-width: 980px) {\n  /* CSS Rules for Fixed Width Desktop and iPad\
    \ Compatible Version */\n}\n```\n\nThe Retina display and its 480 × 960 px display\
    \ resolution slightly complicated the media query code for the iPhone case, forcing\
    \ us to add two more cases. Before the Retina display, we always used the min-device-width\
    \ and max-device-width for targeting the iPhone 320 × 480 px resolution.\n\nNowadays,\
    \ it is no longer possible to use this option because when there is a value of\
    \ \"480\" for the device-width property, there is no way of knowing whether it\
    \ is an old iPhone 2G, 3G, or 3GS in landscape orientation or the new iPhone4\
    \ in portrait orientation. Moreover, we added the portrait and landscape test\
    \ to the media query, creating two new cases for identifying the iPhone model\
    \ when the \"device-width\" is set to 480 px.\n\n# Expand a Framework for iOS\n\
    \nFrameworks are the Holy Grail for a developer; they reduce development times,\
    \ offering all the tools needed for building a web page. A framework offers the\
    \ building blocks needed to design and develop our project requirements.\n\nBecause\
    \ perfection isn't possible, sometimes a framework doesn't match all of our needs.\
    \ In these cases, we are unable to design and develop our specific project requirements\
    \ with the building blocks offered by our framework. When we face such a situation,\
    \ the only solution is to expand the framework, adding and developing what we\
    \ need.\n\nThe iWebKit framework contains many files in the root directory; focus\
    \ on the following:\n\n+   - css: // style sheet directory\n- images: // web images\n\
    - index.html: // index web page\n- javascript: // js framework\n- thumbs: // web\
    \ page images\n\nWhen we develop a project, we need to look for updates, which\
    \ include both framework functionality and project specifics. Because newer versions\
    \ of the framework could be released from its developer at any time, we must maintain,\
    \ as much as possible, the original framework structure.\n\nIf the framework update\
    \ does not dramatically change its core functions and its folders and structure,\
    \ we will easily be able to update our WebApp. Not changing the"
  merge: -1
  pgno: 372
- img_proc: true
  md: "original framework files and structure will allow us to upload the entire framework,\
    \ just overriding a few files and directories.\n\nHere is a practical example\
    \ of what will happen when we start to design the Apple Store use case. The context\
    \ will be the following: \n\n+   - Problem: Implement the Apple Store use case.\n\
    \n+   - Solution: Emulate the native application behavior using the framework\
    \ building blocks for designing the web page structure. Expand the framework when\
    \ we need to add or design something that is not provided or supported by the\
    \ framework templates.\n\nThe iWebKit framework provides some templates, but the\
    \ “Store” is totally different from all of them. For reason, we will need to expand\
    \ our framework. What we will do is use the same frames offered by the framework\
    \ (keeping the framework directory untouched) and, instead of modifying the original\
    \ framework files, we will add what we need (remaining for a future framework\
    \ update). Despite that, the downside of this approach will be that overwriting\
    \ many rules instead of replacing them will add more code to the framework and\
    \ more HTTP requests from our WebApp. The right approach will be dictated by the\
    \ WebApp context.\n\n![](img/7621e729711898868a82bc471fc9db3b_373_0.png)\n\nWe\
    \ will work on the HTML5 structure, and save the new document in the root with\
    \ all the other pages. Subsequently, we will start to design the layout, working\
    \ on a CSS style sheet that we'll save in the \"css\" folder. In addition, we\
    \ will save all the additional images for the layout design in the \"pics\" folder.\n\
    \n+   - topbar (pre-defined customized)\n\n+   - title (pre-defined customized)\n\
    \n+   - breadcrumb (designed from sketch)"
