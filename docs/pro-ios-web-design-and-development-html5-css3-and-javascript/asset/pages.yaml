    # Usability Optimization


    Usability is a fundamental necessity of our project, and it is always a good idea
    to test usability arriving at the end of the project flow. Testing our work during
    a certain phase in the project flow can tell us we match the project requirement
    and give us a feedback on the achieved level of usability.


    In Chapter 2, we saw that an error can be propagated through the project flow
    and how its cost increases with its propagation. A good phase of testing eliminates,
    or at least mitigates, this cause-effect process.


    ![](img/7621e729711898868a82bc471fc9db3b_400_0.png)


    Figure 10–6. The usability optimization: tests scheduled on each project flow''s
    phase


    We can perform our usability optimization at different levels in every step of
    our project flow, and we can do it again at the end of the project flow before
    the final release of our WebApp. Following our diverse approach, we can schedule
    different types of tests'
