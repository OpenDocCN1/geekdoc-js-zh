  md: '# Summary


    This chapter discussed how to maximize the market for Web applications by showing
    that the Web application market is not comparable to the native app market because
    of the App Store paradigm.


    In the first part of this chapter, we introduced how mobile strategy developed
    in the early phase of a project can be useful for launching a promotional campaign
    and a marketing strategy for your projects.


    In the second part of this chapter, we presented several approaches for achieving
    your marketing goals. We used (VIP) Beta Testers to test and promote an application,
    and then we created a web site to introduce the Web application to search engines
    and the Internet. After creating a web site, we created a YouTube channel to promote
    the application and provide video support to import video tutorials to the web
    site.


    In the third part of this chapter, once the main structure around our Web application
    was built, we submitted it to the Apple MyApp portal as well as other portals,
    such as the OpenAppM. We also saw how portals like OpenAppMkt can help us raise
    income with the paradigm used with native applications in the App Store.


    In the fourth part of this chapter, we used the virality of social networks to
    disseminate information about our Web application to specific types of users on
    LinkedIn and Twitter and to various types of users on Facebook.


    In the last part of this chapter, we presented two methods for monetizing our
    Web application. The ADSense Service can provide developers with a good average
    income. We also saw how the PayPal Service works better with Web applications
    that solve important problems and generate a feeling of gratitude in the user,
    prompting him/her to make a donation.'
