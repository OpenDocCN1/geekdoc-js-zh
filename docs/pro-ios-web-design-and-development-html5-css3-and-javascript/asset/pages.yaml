    In the previous chapter, we laid out the main points of how to set up an iOS environment,
    and in this chapter, we see how to implement some of these same aspects in our
    “The Store” use case.


    First we see how to implement the iPhone page model and WebApp mode using metatags.
    In the second part, we see step by step how to implement the native-like interface
    of our use case. Each new element is presented using a top-down approach, always
    showing the code used for implementing the element.


