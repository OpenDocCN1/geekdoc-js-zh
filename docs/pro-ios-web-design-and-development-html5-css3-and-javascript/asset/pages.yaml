- img_proc: true
  md: "measured via hardware inside the accelerometer. Besides notifying that an orientation\
    \ change has occurred, iOS also maintains a special “orientation” property in\
    \ the window object with the four values shown in Table 8–10.\n\n# Table 8–10.\
    \ The Orientation Values Returned by the “Orientation” Object.\n\n| Value | Description\
    \ |\n|---|---|\n| 0 | Portrait view |\n| 90 | Landscape view (turned counterclockwise)\
    \ |\n| 180 | Portrait view (flipped over) |\n| -90 | Landscape view (turned clockwise)\
    \ |\n\n* Currently supported only by iPad, not iPhone\n\nThe orientation value\
    \ inside the window object always reflects the current device orientation. The\
    \ following code adds an orientation handler to the <body> and implements the\
    \ updateOrientation JavaScript function to display the current orientation.\n\n\
    ```\n<!DOCTYPE HTML>\n<head>\n<title>Orientation Change Test</title>\n<script\
    \ type=\"text/javascript\" language=\"javascript\">\nfunction updateOrientation()\
    \ {\n  var displayString = \"Orientation : \";\n  switch(window.orientation) {\n\
    \    case: 0\n      displayString += \"Portrait\"\n      break;\n    case: 90\n\
    \      displayString += \"Landscape (left, screen turned counterclockwise)\"\n\
    \      break;\n    case: 180\n      displayString += \"Portrait (upside-down portrait)\"\
    \n      break;\n    case: -90\n      displayString += \"Landscape (right, screen\
    \ turned clockwise)\"\n      break;\n  }\n  document.getElementById(\"output\"\
    ).innerHTML = displayString;\n}\n</script>\n</head>\n<body onload=\"updateOrientation();\"\
    >\n<div id=\"output\"></div>\n</body>\n</html>\n```"
  merge: -1
