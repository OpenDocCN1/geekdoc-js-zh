  md: '# Touch Events and Gesture Interactions


    Previously, we saw that a mouse pointer is not a finger and how different it is
    to design fingers instead of a mouse pointer. Here, we need to do another paradigm
    switch, exactly as we did for the pointing concept.


    Users employ gestures for browsing web pages and emulate behaviors that they formerly
    used with a mouse. For this reason, finger actions and gestures have to emulate
    mouse events. Before the touch era, every event on a web page was triggered by
    a mouse button; button rollover, drop-down menus, and simple links are just a
    few examples of this type of interaction.


    However, the flow of events generated by finger actions is not the same as generated
    by a mouse pointer, and a finger event flow is generated by one or more finger
    touches, depending on whether the selected element is touchable, non-touchable,
    or scrollable.


    > NOTE: Whenever we use the word "touchable," we refer to a "clickable" design
    element like a link, a drop-down menu, or whatever element triggers a standard
    mouse event inside the web page structure.


    If a finger touches a non-touchable design element, events are generated or added
    to the gesture event flow. For this reason, when designing for iOS, we need to
    switch from a "mouse-oriented paradigm" to a more appropriate "touchable-oriented
    design paradigm"


    # Touch Event Paradigm: Touch Is Not a Click


    A touchable element is defined by a design element associated with an event handler.
    Using the mouse-based web paradigm, we could define it as a clickable element.


    Single-finger user actions, two-finger user actions, and more complex gestures
    are built on top of the WebKit engine we use by Safari Mobile. The WebKit engine
    plays a major role in this game, providing touch support similar to the gesture
    support built into the native iOS SDK. These types of events are triggered by
    the event time your finger or fingers touch the capacitive display of an iOS-based
    device.


    The single- and multi-touch events emulate classic mouse navigation, triggering
    mouserelated events, while gesture events are captured in addition to the mouse-emulating
    events, providing an extra level of interaction and possibilities. The WebKit
    engine and the capacitive display support three types of events:


    +   - **Single-touch events**: Composed of one single touch at a time on the capacitive
    display, this type of event is comparable to 99% of mouse-based actions. We will
    see these events in Table 8–5.'
  merge: -1
  pgno: 363
- img_proc: true
  md: '* Multi-touch events: Composed of two or more touches on different parts of
    the display. We will see these events in Table 8–6.


    * Gesture events: Composed of one or more touch events plus a specific movement
    of the finger or fingers on the capacitive display; gesture events are implementable
    using seven DOM (Document Object Model) event classes, which are shown in Table
    8–7.


    #  Single-touch Events


    All the basic and browsing-related mouse events are typically triggered by one
    or two finger touches and are listed in Table 8–5 and 8–6.


    **Table 8–5. Standard DOM Event Classes for Recognizing iOS Single-finger Touch-based
    Events.**


    | Description | Finger Gesture | Mouse Event |

    |---|---|---|

    | User touches a non-touchable element | Single touch | (None) |

    | User touches a non-touchable element and an info bubble appears | Single touch
    | (None) |

    | User touches a scrollable element and pans the display | Single touch | onscroll
    |

    | User touches a touchable element | Single touch | mouseover mousemove mouseout
    |

    | User touches a touchable element and the content changes | Single touch | mouseover
    mousemove mouseout mousedown mouseclick |

    | User touches and holds a touchable element | Single touch | (None) |

    | User zooms in or out on a design element | Double touch | onscroll |


    Three of the five single-finger touch actions represented in Table 8–5 are visually
    represented using flow charts in Figure 8–9.'
