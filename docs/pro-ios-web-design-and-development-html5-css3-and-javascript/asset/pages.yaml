  md: '# CHAPTER 10: Optimizing iOS WebApps


    according to the level of detail of the project. Figure 10–6 shows a type of approach
    that begins with the Paper Prototype Test and the Electronic Prototype Test and
    schedules a live test on a mobile device for the Pre-Release Test Phase.


    Compared to a simple web site, a WebApp needs a more accurate phase of testing,
    so we encourage you to never overlook this phase. Even if you work on a simple
    project, experience will tell you how hard or soft your project will need to be
    tested.


    We have two types of usability testing depending on the subjects involved.


    +   **Usability inspection**

    Typically performed by an evaluator that is not the designer or the developer
    and has no involvement with the project. Usability inspection should be performed
    from the early phase of design. An example of usability inspection is the Cognitive
    Walkthrough, in which the evaluator simulates the user''s problem-solving process
    for a specific task.


    +   **Usability test**

    Typically performed by the designer or the developer on a user. Usability tests
    are performed in the Design Phase, Implementation Phase, and Release Phase using
    different types of tests. An example of usability test is the Prototype Test where
    the designer or developer tests the multiple user aspect of the design, including
    services and specific functions.


    The Cognitive Walkthrough is an inexpensive form of test; however, although this
    approach is used more in software development than web development, the Prototype
    Test is a valid option for our mobile device and development context. For this
    reason, we present the Prototype Tests in Chapter 11, in which we see in detail
    how to organize, perform, and evaluate the test.


    For now it is important to introduce the anatomy of a usability test as well as
    a few more important concepts. A usability test, like a Prototype Test, is structured
    by the following steps:


    +   **Choose testing environment.**

    We need to choose the test environment according to the type of prototype test
    we choose to perform and the project requirements.


    +   **Create use-case.**

    We need to create a use-case that will define a task for the user that will verify
    one or more use-case requirements from the project requirements.


    +   **Prepare test assets.**

    We need to prepare and re-use the assets that we will use to perform the test.


    +   **Select users.**

    We need to choose the right user according to the use-case requirements.'
