    # # Offline WebApp


    In this book we always focus on emulating the native application environment and
    behavior with our web pages. It''s obvious that our web pages are dependent on
    Internet access in order to provide any kind of service, but they are also dependent
    on the Internet in order to retrieve the various design elements of the web page
    itself.


    Using the HTML5 Offline feature, we can address this issue by storing any type
    of resource inside the cache of our WebApp. The files that to be cached are declared
    in a file called Manifest File. Once the files are cached, Safari looks for the
    Manifest File before beginning any server-side processing while avoiding downloading
    files previously downloaded and stored.


    > NOTE: Safari evaluates the content of the Manifest File to determine whether
    or not to update it. The file date or any other attribute will not be evaluated
    as used to see in an HTTP Conditional GET Request. If we want to update an archive,
    we can do it via JavaScript.


    The application cache persists between browser sessions, which means that a previously
    cached resource can be viewed or continue to work without any network support
    or if the iOS is in Airplane Mode.


    # # The Manifest File


    A manifest file is a simple text file hosted on the application''s web server
    that lists all the static resources that need to be downloaded and cached by our
    WebApp. A Manifest File is composed by two main parts and one optional part:


    +   - Cache Manifest Declaration

    - Cache Manifest URL List

    - Cache Types Declaration (not required)


    The WebView framework doesn''t use any Manifest File because from the 5.04 version
    replaced most of its interface images with a CSS3 approach. Despite that, from
    our use-case it is important to cache at least all the product''s images and provide
    the users offline access to the catalogue.


    The Manifest File should begin with the uppercase prefix “CACHE MANIFEST.\. Below
    that we can define, always using an uppercase prefix, three (sub) section headers'
