  md: "# Adding Javascript to a Webpage\n\nThe Javascript code is embedded on a webpage\
    \ using the <script> element. In the CSS rules, a piece of Javascript code can\
    \ be inserted using two approaches:\n\n# Inline\n\nThe code is written directly\
    \ in the HTML document.\n\n# Imported\n\nIn this book, we use inline Javascript\
    \ for demonstration purposes, but for most real projects, importing the Javascript\
    \ code is considered to be a good practice. In the following two examples, we\
    \ start with the first program in any programming language, the Hello, World!\
    \ program.\n\n```\n<html>\n<head>\n<title>Javascript Test</title>\n</head>\n<body>\n\
    \  <h1>Javascript Test Page</h1>\n  <script>\n    alert(\"Hello, world!\");\n\
    \  </script>\n</body>\n</html>\n```\n\nThe previous Javascript code shows the\
    \ inline technique in which the code is inserted inline between the two <script>\
    \ tags.\n\n```\n<head>\n<link href=\"css/style.css\" rel=\"stylesheet\" media=\"\
    screen\" type=\"text/css\" />\n<script src=\"Javascript/hello.js\"></script>\n\
    <title>Javascript Test Page</title>\n</head>\n```\n\nThe previous code shows the\
    \ imported technique, where the code is imported using the src attribute.\n\n\
    At this point, we might ask ourselves, \"Where do we insert the Javascript code?\"\
    \ The browser reads and interprets all the code from top to bottom, meaning that\
    \ Javascript is interpreted and run as soon as the browser has read it. This means\
    \ that, according to the position of the code in the webpage, Javascript can cause\
    \ page rendering delays, slowing all of our pages down. In addition, it's considered\
    \ a good practice to insert the Javascript code at the bottom part of the <body>\
    \ section, just before the closing </body> tag, as shown in the previous Hello\
    \ World example."
  merge: -1
