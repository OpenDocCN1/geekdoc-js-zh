  md: '# 326

    CHAPTER 8: Native iOS Environment Development


    This kind of image must have some have specific dimensions based on the principle
    that we need to cut off from the image 20 px of space used by the status bar.
    The startup image is typically a portrait image, in PNG format, and has exactly
    the following measurements:


    +   - 320 × 460 px (iPhone 2G, 3G, 3GS)

    - 480 × 940 px (iPhone4)

    - 768 × 1024 px (iPad, iPad2)


    Once we have our startup image, we need to link it using the following metag:

    <link rel="apple-touch-image" href="startup-image.png">


    As for the storyboard icon, if we link it the metag, the startup image does not
    need to be placed in the root directory; however, this is considered best practice.


    # Application Redirecting


    When we develop a native-like WebApp for iOS, our optimized mobile version is,
    most of time, not the first choice in terms of availability for the user.


    The first thing that will happen in 99% of cases when a user comes to our index
    web page is that the server sends the web client desktop version. In addition,
    we need to know when a user is browsing from a mobile device in order to redirect
    him to the specific mobile version of our content.


    We can achieve this using one of two techniques: JavaScript or CSS. These are
    not the only solutions available; we can achieve the same result very efficiently
    from the server (Apache or PHP, for instance), but in this text we focusing on
    standards in a broader sense. For this reason, we will only show HTML, CSS, and
    JavaScript solutions.


    ```

    <link rel="stylesheet" media="all and (min-width: 480px)\ href="iphone.css">

    <link rel="stylesheet" media="all and (min-width: 481px) and (max-device-width:
    1024px) and (orientation:portrait)\ href="ipad-portrait.css">

    <link rel="stylesheet" media="all and (min-width: 481px) and (max-device-width:
    1024px) and (orientation:landscape)\ href="ipad-landscape.css">

    <link rel="stylesheet" media="all and (min-width: 1025px)\ href="ipad-landscape.css">

    ```


