  md: '# CHAPTER 4: User Interface Design for iOS Devices


    In reality, the phrase “reading pattern” is appropriate because users don’t actually
    read pages, they scan them. They skim them looking for words or phrases that catch
    their eye. Now the question is: why do users do this? We can suggest several answers.


    +   * User Is Usually in a Hurry


    The user browsing the web is motivated by the desire to save time, because he
    knows the answer is somewhere nearby and his objective is to discover where he
    needs to look.


    +   * User Knows He/She Doesn’t Need to Read Everything


    The user knows that most of he/she will be interested in only a portion of the
    content offered by a page. For this reason, the user will only look for relevant
    bits of content and ignore all other parts that he/she deems irrelevant.


    +   * User Has Learned to Scan Other Media in the Past


    The user, in past experiences with magazines, newspapers, or books, has learned
    to scan content in order to find the parts they’re interested in.


    > NOTE: Reading patterns vary according to the different reading-directions adopted
    by different cultures. It is important to remember that what we discuss in this
    section applies only to right-to-left cultures.


    Despite the fact that users scan content instead of reading it, in the world of
    left-to-right readers, we can still isolate reading patterns. These patterns are
    highly influenced by images that appear in the content but the interesting thing
    is that, of using a micro or macro linear pattern, the users tend to read using
    “F” or a “Z” pattern on our WebApp. This means that we have two major approaches
    to content, both based on conventions that the user has adopted during 10 or 20
    years or more of content browsing.


    Users have been trained to pay attention to certain spots because that’s where
    the important information resides. For this reason, it is important to remember
    if we deviate from these conventional patterns in designing our interfaces, we
    do so at our peril.


    # The Z-Shaped Pattern


    The Z reading pattern is the typical pattern that comes to mind when we think
    about reading web content. Typically, we start from the left-top position where
    the logo is situated, and then drop down to the content’s first paragraph, where
    we start the Z movement.


    If the user is satisfied with the content after he reads the first line of the
    paragraph, he will continue reading and jump to the next line of the same paragraph.'
  merge: -1
  pgno: 178
- img_proc: true
  md: '![](img/7621e729711898868a82bc471fc9db3b_179_0.png)


    The story changes when, after having read the first line of the paragraph, the
    user decides that the content is not what he was looking for. In this case, the
    user will jump directly to the first line of the next paragraph or the next portion
    of content.


    This changes the height of each Z sub-pattern and the number of Z sub-patterns
    that compose the overall Z reading pattern. In Figure 4–27, we can see how the
    Z pattern changes depending on whether the user is interested in the first line
    of a paragraph.


    # Implications of the Z-Shaped Pattern


    The Z pattern is closely related to the classic reading pattern from hard-copy
    newspapers, magazines, or journals, and shares the same implications:


    +   - **User Can Jump from One Paragraph to Another**

    If the user is not interested in the first line of the paragraph, he will jump
    to the first line of the next paragraph or the next group of content.

    - **User Will Always Look in the Left-Bottom Part of the Pattern**

    The designer can be assured that the user will look at a certain part of the content,
    and can make use of this information by placing important call-to-action buttons
    in this zone.


    The Z pattern is more common in non-expert users or more generally when a user
    finds interesting content. Despite the fact that its generally not the most common
    pattern, it is important to keep it in mind because the user will tend to switch
    to this kind of pattern every time he/she finds an interesting bit of content.
    This means that a user can start'
  merge: -1
