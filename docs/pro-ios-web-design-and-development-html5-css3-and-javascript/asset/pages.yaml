  md: '# Four Different Approaches to a WebApp


    When we develop a site for a WebApp that can run in a browser, we can choose from
    four different approaches. All of these 4 kinds of WebApps are written using the
    same web standards, such as HTML4, HTML4, CSS2, CSS3, and JavaScript (version
    features from 1.7 and 1.8), but the quality of the user experience is offered
    different for each level.


    # Level 1: Compatible


    This is the ground-level approach to development and aims to provide a fully compatible
    structure with Apple''s mobile devices. This kind of structure is marked up using
    HTML4 and CSS2 and is based on blocks, in order to be easily navigable and zoomable,
    as shown in Figure 3-11. Nevertheless, it''s still touch-oriented for mobile devices.


    ![](img/7621e729711898868a82bc471fc9db3b_95_0.png)


    Figure 3-11. A Compatible web: The Official W3C Web site doesn''t have an Optimized
    Layout for iPad.


    This level of approach also has to avoid non-supported technologies like Flash,
    Java, and other plug-ins, and really doesn''t do anything specifically aimed at
    iPhone or iPad users. The main goal here is to make sure that no barriers are
    placed to prevent a satisfactory browsing experience.


    Every online W3C standard WebApp doesn''t use non-supported technologies in this
    first category.'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# Level 2: Optimized


    The second level of support for Apple devices is meant to provide a basic level
    of mobile user experience. This means that the layout is desktop-oriented and
    although the web site or WebApp is marked up using HTML5, CSS3, and offers user
    interaction using JavaScript, it uses them in a very basic way, and won''t support
    the latest features offered by WebKit browsing engine. Neither does it provide
    any hardware interaction like GPS geolocation, or one touch SMS and phone calls.
    Figure 3–12 shows an example of an optimized WebApp.


    ![](img/7621e729711898868a82bc471fc9db3b_96_0.png)


    Figure 3–12. Optimized Web Site: The TED site uses the HTML <video> tag in its
    Pages.


    Every web site or WebApp should be in this category at least <video>, particularly
    if there is an active redirect to a dedicated or native resource. The iPad-ready
    web sites promoted on the official Apple web site are in this second category.


    # Level 3: Dedicated


    The main difference in this third level of support is the tailored viewport dimension.
    This is the first step into a real mobile user experience. However, although these
    web sites and WebApps are tailored for iPhone or iPad viewing, they do not seek
    to emulate the native iOS user interface. Figure 3–13 shows an example of a dedicated
    WebApp.'
  merge: -1
  pgno: 96
