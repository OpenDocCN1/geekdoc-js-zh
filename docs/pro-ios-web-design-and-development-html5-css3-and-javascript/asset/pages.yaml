  md: '# Objective-C Language


    Objective-C is an object-oriented language with a dynamic class system built as
    a superset over the standard C language. This language is built on top of Cocoa
    (Mac OS X) and Cocoa Touch (iOS) frameworks.


    Objective-C also introduced a garbage collector optimized for multi-core Macs,
    but as iOS developers, we can forget about this feature because, on iOS, we must
    manually optimize our memory usage.


    # Cocoa Touch Framework


    The Cocoa Touch framework drives all of the iOS applications and shares many proven
    patterns found on the Mac, but it is built with a special focus on touch-based
    interfaces and optimization.


    The Cocoa Touch framework is composed of the following parts:


    +   - Foundation framework

    - UIKit framework

    - Collection of frameworks


    # Foundation Framework


    The Foundation framework is a layer that abstracts many of the underlying operative
    system elements, such as primitive types, bundle management, file operations,
    and networking, from the user interface objects in UIKit that we''ll introduce
    next. This framework is the gateway to everything not explicitly part of the user
    interface, and defines a base layer of Objective-C classes.


    In addition to providing a set of useful primitive object classes, it introduces
    several paradigms that define functionality not covered by the Objective-C language.
    The Foundation framework is designed with these goals in mind:


    +   - Provide a small set of basic utility classes

    - Make software development easier by introducing consistent conventions for things
    such as deallocation

    - Support Unicode strings, object persistence, and object distribution.

    - Provide a level of OS independence to enhance portability


    The Foundation framework includes the root object class, classes representing
    basic data types such as strings and byte arrays, collection classes for storing
    other objects, classes representing system information such as dates, and classes
    representing communication ports.'
