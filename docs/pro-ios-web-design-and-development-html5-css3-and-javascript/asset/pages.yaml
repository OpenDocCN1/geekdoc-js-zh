    # Animation


    Animation, similar to transition, modifies properties over time. Using the transition
    property, we achieve a one-way effect from one value to another; this kind of
    property is useful for page transition, but has a limited value for building any
    kind of visual effect.


    Using the Animation property, we can provide any number of intermediate values
    that are not necessarily linear, to achieve complex animations. These intermediate
    values are called *keyframes* and are the foundation of all animation processes.


    > NOTE: keyframe in animation and filmmaking is a drawing that defines the starting
    and ending points of any smooth transition. They are called "frames" because their
    position in time is measured in frames on a strip of film. A sequence of keyframes
    which images the viewer will see, whereas the position of the keyframes on the
    film, video, or animation timeline defines the timing of the movement.'
