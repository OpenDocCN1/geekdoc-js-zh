    In the next paragraph, we will see how important it is for a design to also provide
    the first line of user interface: the fingers.


    # A Finger is not a Mouse: The Importance of being Finger-Friendly


    The first thing we need to master as iPhone or iPad developers (but also as general
    touch-devices developers), is that a finger is not a mouse. This is important
    to keep in mind for several reasons.


    When we browse a webpage with our mouse, we move a pointer over the page. The
    pointer is few pixels wide and just one or two pixels wide at the top. Looking
    at it from a finger perspective, we can have a tiny finger with timers, and a
    big user with fat fingers. Most users will be in the middle, but almost all will
    be unable to use their finger to tap a typical link from a desktop webpage. It
    doesn''t matter what kind of link we are talking about it, a finger-friendly link
    is unacceptable in any kind of touch design, as shown in Figure 3-33.


    ![](img/7621e729711898868a82bc471fc9db3b_139_0.png)


    Figure 3-33. Links are Completely Finger-Unfriendly using the Zoom Function.


    Now, I can hear you saying, Thank God we have the Zoom! You are right, but our
    golden rule regarding mobile UX is that everything be easily accessible with a
    minimal number of actions. On touch devices, we must design links with a minimum
    height of 30px. With a link height 30px, and the use of the right amount of non-touchable
    space between links, you can assume that almost all of your users will be to tap
    the link and use the interface.


    Another important aspect is that finger input does not always correspond to mouse
    input. A mouse has a left and a right button, a scroll in the middle, and it can
    move quickly to place where the user wants to go.'
