  md: '# CHAPTER 6: Native iOS Environment Development


    # 337


    ![](img/7621e729711898868a82bc471fc9db3b_366_0.png)


    **Figure 8–10. Comparing overtime two-finger actions (flowcharts from official
    Safari reference).


    # Gesture Events


    A gesture could be composed of single- or multi-finger movements on the display.
    The single- and multi-touch actions are so far more related to mouse events and
    emulate the mouse-oriented browsing session. Beside the great increase in user
    experience, this is just one side of the touch era—the retrocompatible one. What
    really makes the difference is the gesture support provided by Safari and Apple
    iOS and offered by the iPhone 3.5-inch and the iPad 9.7-inch capacitive display.


    **Table 8–7.** Standard DOM Event Classes for Recognizing iOS Gesture Touch-based
    Events.


    | Name | Description |

    | touchstart | When a finger touches the display |

    | touchmove | When a finger moves across the display |

    | touchend | When a finger leaves the display |

    | touchcancel | When the system cancels a touch event |

    | gesturestart | When two or more fingers touch the display |

    | gesturechange | When two or more fingers move during a gesture on the display
    |

    | gestureend | When one or no finger touches the display touches the display |


    A gesture is composed of one or more finger movements, and a gesture event is
    a collection of touches triggered by these single or multiple finger movements.
    Table 8–7 shows the touch and gesture events involved in this context.'
  merge: -1
  pgno: 366
- img_proc: true
  md: '# CHAPTER 8: Native iOS Environment Development


    In order to use touch or gesture events, we need to convert them into individual
    touches. This can be achieved using the object properties of every event. Every
    event is an object and every object has properties. Using the properties of the
    object shown in Table 8-8, we can reach every single touch inside a gesture event.


    **Table 8-8. Event Object Properties: Accessing Single-Touch Objects Inside a
    Gesture Event.**


    | Name | Description |

    | --- | --- |

    | touches | Array with all the touches on a web page |

    | changedTouches | Array with the recent changed touches on a web page |

    | targetTouches | Array with all the current touches for a design element |

    | target | The design element that generated the touch event |


    Because event objects produce standard arrays, we can use JavaScript array functions
    and syntax to access these properties. This means that if we reach the array with
    all the touch objects on the web page, we can use the following JavaScript syntax:


    event.touches;


    If we want to access the first touch object on the web page, we can use the following
    JavaScript syntax:


    event.touches[0];


    We know that we need to access single-touch objects for manipulating gesture events,
    but what next? Just as every event object has its properties, every touch object
    has its properties.


    **Table 8-9. Touch Object Properties: Accessing Single-touch Properties Inside
    a Touch Object.**


    | Name | Description |

    | --- | --- |

    | identifier | Unique identifying number for the touch event |

    | clientX | X coordinates of the touch object relative to the viewport |

    | clientY | Y coordinates of the touch object relative to the viewport |

    | screenX | X coordinates of the touch object relative to the screen |

    | screenY | Y coordinates of the touch object relative to the screen |

    | pageX | X coordinates of the touch object relative to the web page |

    | pageY | Y coordinates of the touch object relative to the web page |

    | scale | Multiplier of the default (1.0) pinch in or out value |

    | rotate | Finger rotation value of a gesture |'
