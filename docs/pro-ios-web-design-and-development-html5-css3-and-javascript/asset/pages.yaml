    # # Monetizing a WebApp


    It is not as easy to monetize a Web application as it is a native application
    because you can''t rely on App Store support. The App Store assumes the responsibility
    of selling your native application. The application promotion is just a plus;
    the App Store offers good visibility of almost all Apps submitted to it. The music
    changes when it is necessary to raise income from a Web application that needs
    to be promoted from zero.


    In addition to the opportunities offered by portals like OpenAppMkt, the two best
    ways to raise income are through Google AdSense and PayPal donations.


    ![](img/7621e729711898868a82bc471fc9db3b_453_1.png)


    Figure 12–11. The Google AdSense Registration page on iPad.'
  merge: -1
