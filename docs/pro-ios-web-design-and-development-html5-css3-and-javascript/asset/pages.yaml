    As we might notice, we applied the same process that we used in our mobile information
    architecture process. In fact, the interface design process is a micro-cycle inside
    the mobile information architecture process and is based on the same pattern.


    In the next section, we implement the interface design process, and we design
    an iPhone and iPad compatible layout for a WebApp.


    # # iPhone and iPad Compatible Interface Design


    For a WebApp to be iPhone and iPad compatible, it must satisfy the first level
    of Apple device compatibility. As you saw in the Chapter 3, to be iPhone and iPad
    ready doesn''t mean having an HTML5 and CSS3 compliant layout; it means it is
    designed in a touch-screen oriented way.


    From the standpoint of iPhone development, this problem is less important because,
    although Safari Mobile has revolutionized the mobile browsing experience in the
    past three years, a real native-like layout is needed in order to let the user
    experience optimized level of interaction with the WebApp. For this reason, if
    a WebApp is not touch-screen optimized for the iPhone, it''s not such a bad thing.
    The compatible version'
