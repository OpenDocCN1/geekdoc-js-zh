    # Reuse Design


    Reuse is an important word in the design and development world. Using generally
    saves time and effort, providing a solid and tested base for projects. This practice
    is more useful in native development, where reusable code is a fundamental part
    of the process; even a small piece of tested code can save developers a lot of.
    Design patterns share the same paradigm with code or design reuse practices, where
    we identify problems or requirements and provide a solution or code/design/pattern.'
