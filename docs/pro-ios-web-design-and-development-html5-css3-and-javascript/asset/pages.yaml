    When data is stored in memory, we can access it with its two basic operations
    called read and write. Using the read operation we can retrieve the value of a
    variable stored in the memory, whereas by using write we can update the value
    of a variable.


    In Javascript, we create a variable using the reserved word "var" followed by
    the name of the variable and then the semicolon. The following examples show some
    variable declarations. We must remember that Javascript is case sensitive.'
