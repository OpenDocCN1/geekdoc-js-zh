  md: '# CHAPTER 4: User Interface Design for iOS Devices


    > DEFINITION: User interface

    Visual part of a computer application or operating system through which a user
    interacts with a computer or software.


    With a device like the iPhone or the iPad, we have two kinds of interfaces, as
    shown in Figure 4–3:


    +   - Software interface

    - Hardware interface


    iOS offers us different software interfaces, and each different iPhone view has
    its own particular type. An address book style view uses the typical list approach
    interface with edge-to-edge links, the About Us style view might see a rounded
    approach.


    ![](img/7621e729711898868a82bc471fc9db3b_153_0.png)


    **Figure 4–3.** The types of iPhone’s interfaces: software interface (left) and
    hardware interface (right).


    Beneath the software, we have a more primitive layer of interaction offered by
    the hardware interfaces. These software and hardware interfaces enable the user
    to interact with every aspect of the device. Using the hardware interface shown
    in Table 4–1, you can adjust the mic and speaker volume, turn the device on and
    off, and with the touch-screen, use all the software interfaces offered by the
    operating system.


    **Table 4–1 Examples of Hardware Interface Interaction.**n

    | Goal | Interface | Feedback |

    |---|---|---|

    | Adjust the volume up or down | External buttons | Pop up box |

    | Put in sleep mode the display | External button | Click FX |'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'When we use any kind of mobile software on iOS devices, we also use the touch
    screen to perform the interaction. The display in our touch-screen context is
    also a hardware interface. This is an important point because it leads us straight
    to a new kind of paradigm that we have never seen before with the classic desktop
    or with the old mobile phone approach: everything is an interface.


    # Everything Is an Interface


    What do we mean by this? With these words, we refer to iOS, in which every part
    of your software becomes an interface because of its touch-screen capabilities.
    In this chapter, we see how to design every WebApp part that is technically touching
    and not just the "classic interface" used in the past by the desktop paradigm.


    Using the touch screen, you can zoom in out, pinch, scroll, and do other gestures.
    These gestures enable the user to interact with all objects contained in the entire
    viewport—in other words, with all visible parts of our WebApp. Figure 4–4 shows
    how, with a touch-screen device, even the content must be treated as an interface,
    which is a passive interface in itself.


    ![](img/7621e729711898868a82bc471fc9db3b_154_0.png)


    In the classic navigation paradigm, when you use a mouse or a stick in older mobile
    phones), you typically point to or choose only linkable parts of a WebApp. Nobody
    attempts to click in a *dead-zone* with the expectation that some action will
    occur.


    > NOTE: The word dead-zone refers to a non-clickable zone inside the layout. Because
    it’s non-clickable, a dead-zone part of a layout doesn’t offer any level of interaction
    to the user.


    Once you have understood this important concept, you can appreciate that every
    part of your interface, and every part of your WebApp, needs to be designed with
    care.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# CHAPTER 4: User Interface Design for iOS Devices


    From now on, we will use active interface for the touchable or clickable part
    of our interface, and we will use passive interface for the merely touchable (zoomable)
    parts of our layout. Remember that the active interface is based on software capability
    (links) and the passive interface is based on hardware capability (touch-screen
    display). In Figure 4–4, you can see the active and passive interfaces in an iPhone
    and iPad "compatible" website.


    As designers, being aware of this concept dramatically improves your design skills
    and raises the level of user experience offered by your project.


    The new touch paradigm also changes the requirements of your interfaces and layouts,
    so the question now is, how should you design your touch interface and layout
    with this in mind?


    Your touch interface and layout design is based on:


    +   - A Cognitive Use of Colors

    Moods obtained using color reinforces the brand message.


    +   - A New Visual Hierarchy

    Prioritizing interfaces and layouts, optimizing for touch-screen devices.


    +   - A New Touch-Screen Reading Pattern Structure

    Optimizing the touch-screen UX in both native-like and compatible projects.


    +   - A Cognitive Use of Passive and Active Negative Space

    Both active and negative spaces are based on the laws of perception.


    Now that you know the tools to use, the question is, “What do you want to achieve
    these tools?”


    In designing your interface and layout, you should strive for:


    +   - Unity

    Create harmony between the interface and the layout elements.


    +   - Balance

    Create a visual equilibrium using the interface and the layout elements.


    +   - Hierarchy

    Prioritize the interface and the layout elements.


    +   - Dominance

    Create focal points on the interface and the layout elements.


    All of these are important to understand as concepts. But being aware of them,
    recognizing them, and using them in your design is another matter altogether and
    requires practice.'
