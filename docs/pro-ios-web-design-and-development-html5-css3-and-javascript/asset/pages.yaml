  md: '# Javascript Structure


    Javascript is an interpreted language, as opposed to compiled, another type of
    language. Compiled languages need to be run through a special program called a
    compiler that converts the code we write into machine code that can be run by
    the CPU that''s controlled by the operating system. As we have seen, we don''t
    need to do with Javascript; using the browser, we simply make a request to the
    webserver that sends back to the browser the plain text version of the Javascript
    code that the browser interprets and runs.


    Javascript is also case sensitive, meaning that the following pieces of code are
    different from each other in Javascript:


    ```

    alert("Hello World!"); // correct Javascript syntax

    alert("Hello World!"); // incorrect Javascript syntax

    ```


    A Javascript statement is typically written on one line and finish with a semicolon,
    as shown in the previous example. The semicolon has the same role as the full
    stop or period in English. When we have a long statement, we can promote readability
    by splitting it into multiple lines, using the semicolon only at the end of the
    statement.


    Javascript is case sensitive but space insensitive, meaning that it doesn''t care
    about blank space between different pieces of the language. The following statements
