  md: '# CHAPTER 7: Web Standards for WebKit: Maximizing Mobile Safari


    Those who have used XHTML know that XHTML forced us to use HTML syntax, quotes
    on all the attributes, closed tags, and lowercase case. Everything is valid code
    in HTML5: uppercase, lowercase, quotes, no self-closing tags or not, and so on.
    This attitude brings us back to the ''90s, before XHTML 1.0, this non-rule produced
    the worst HTML code ever since Berners-Lee turned on his first server in 1990.


    As you might understand, we don''t like the looseness of the HTML5 syntax and
    encouraging an XHTML-like clean style to HTML5—even if you work in a team where
    consistency is important at every level.


    A new approach in HTML5 embraces the deprecated element. In past HTML versions,
    the designer or developer was advised not to use deprecated elements in code and
    browsers didn''t include deprecated elements in their specifications. Because
    HTML5 aims to be backwards compatible, instead of declaring an element as deprecated
    and deleting it from its specification, it declares it as obsolete, maintaining
    the rendering element rules in its specification. We can define this type of approach
    as user-friendly or user experience oriented, from HTML5 on, if an HTML5 browser
    encounters an obsolete element, it is still able to render and offer a higher
    level of user experience.


    We can also notice that in many areas, the new HTML5 syntax is simplicity driven.
    The doctype declaration is a good example of this attitude. We compare the iWebKit
    Framework 5.0.4 XHTML and the new HTML5 doctype declaration in the following:


    ```

    <-- XHTML Doctype --

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.0 Strict//EN"

    http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

    ```


    ```

    <-- HTML Doctype --

    <!DOCTYPE html>

    ```


    We can see how the doctype declaration is simpler. This approach also simplifies
    the character encoding declaration, where the charset is the only attribute necessary
    to specify UTF-8 encoding. The new example shows the new HTML5 character encoding
    declaration compared with the old (and still allowed) HTML4.0.1 used for the iWebKit
    Framework 5.0.4.


    ```

    <-- XHTML Doctype --

    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" /> /

    ```


    ```

    <-- HTML Doctype --

    <meta charset="UTF-8">

    ```


    This evolution also brings about a change in the syntax of the most representative
    tag in the whole history—the one that turned into hypertext: the <a> tag. The
    (X)HTML specifies the <a> tag as an inline element, forcing us to use multiple
    tags every time we need to create a headline. In HTML5, the <a> tag is still an
    inline tag with the difference that, in HTML5, nesting block level elements are
    no longer invalid.


    The following code is an example of the <a> tag in (X)HTML and HTML5.'
