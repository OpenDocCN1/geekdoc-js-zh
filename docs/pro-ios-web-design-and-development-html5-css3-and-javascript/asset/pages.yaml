    On the other hand, SVG is an XML-based vector graphics format. SVG content can
    be static or it can be dynamic, interactive, and animated. With SVG, we can do
    more than simple vector graphics and animations; we can develop highly interactive
    WebApps with scripting, advanced animation, and filters.


    SVG is still in the process of being optimized for even closer integration with
    HTML and CSS in the browser. SVG 1.1 is a W3C Recommendation and is, at the time
    of writing, the most recent version of the full specification. Besides SVG 1.1,
    we have SVG Tiny 1.2 (www.w3.org/TR/SVG112/), which is also a W3C Recommendation
    that targets mobile devices. We can follow the SVG roadmap at www.w3.org/Graphics/SVG/WG/wiki/Roadmap.


    The HTML Canvas and SVG also represent a good alternative to Adobe Flash on iOS
    devices. For this reason, we hope that the future web, based on open HTML5 standards,
    will fully accommodate SVG.


    # HTML Canvas and SVG Comparison


    At first glance, Canvas and SVG appear to be different techniques that achieve
    the same thing; however, several important differences exist between the two.
    Table 7–7 shows some of these.


    **Table 7–7. Differences between HTML Canvas and SVG


    | HTML Canvas | SVG |

    | --- | --- |

    | Drawing is done with pixels | Drawing is done with vectors |

    | Elements are drawn programmatically | Elements are part of page’s DOM |

    | High performance for pixel-based operations | High accessibility because of
    XML syntax foundation |

    | Animation is not built in | Animation and effects are built-in |


    HTML Canvas and SVG are not mutually exclusive, and we can find good ways to use
    them together in the same web page (for example, canvas as background with SVG
    on top); we can draw SVG on canvas or vice versa. Here’s a list of some of the
    advantages and disadvantages of HTML Canvas and SVG.'
