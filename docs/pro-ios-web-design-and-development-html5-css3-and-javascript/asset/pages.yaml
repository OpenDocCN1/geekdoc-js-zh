    In this level of approach, we have all the iPhone and iPad dedicated (mobile)
    versions of a WebApp.


    # Level 4: Native-Like


    The native-like approach provides the highest level of mobile user experience
    and aims to emulate native iOS user interface, providing a direct integration
    with device services, including Phone, Messages, Mail, Contacts, Maps, and geolocation
    service through GPS or GSM triangulation. Figure 3–14 shows an example of a native-like
    WebApp.'
