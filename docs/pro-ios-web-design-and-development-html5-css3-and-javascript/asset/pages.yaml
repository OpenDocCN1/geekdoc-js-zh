    # Spotlight an Element


    You can use passive negative space to spotlight an important element of your interface
    or layout. A classic example is placing the logo far from the navigation bar (or
    vice-versa). In this way, you give the element the space it needs to be noticed
    by the user.


    With these techniques, a margin value is typically used between the spotlighted
    element and the rest of the element''s design.'
