    tool.


    In this section, we will give a brief introduction to this paradigm and its components,
    even if this book is about web development models, it''s good for a developer
    to have a 360-degree perspective on the Apple development world.


    # Apple’s Objective-C, Cocoa Touch, and Xtools Model


    The Xtools IDE, Cocoa Touch Framework, and the Objective-C language comprise the
    trinity of every iOS developer. Everything starts from here.


    # Xcode IDE


    When we talk about Xtools, in 99% of situations we''re referring to the Xcode
    IDE, to the Interface builder, and to the iPhone/iPad Simulator.


    Xcode is an IDE. With this tool, we can also manage all of our testing devices,
    and automatically package into iPhone/iPad applications with the proper certificates,
    and install applications on the iPhone/iPad itself.


    The remote debugger function can also connect to the device in real-time, managing
    breakpoints as the application is controlled on the device and providing a good
    tool for real-time testing.


    # The iPhone/iPad Simulator


    The iPhone/iPad simulator runs our application in the much same way as an actual
    iPhone/iPad device. This tool is every developer’s best friend in the first phase
