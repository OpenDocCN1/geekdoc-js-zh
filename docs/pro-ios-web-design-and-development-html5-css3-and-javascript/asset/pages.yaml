  md: '# Working with DOM


    DOM works in terms of nodes, for us the main question: is the node unique or not
    we can grab one of these nodes? The key consideration is whether the node is unique
    or not therefore whether or has an ID. If the element we are after has a unique
    ID, we can use''s probably the most important method of the DOM:


    ```

    document.getElementById("elementId");

    ```


    The way we use this method is to combine with a variable declaration that stores
    the returned element as shown in the next example.


    ```

    var myElement = document.getElementById("edgeMenu");

    ```


    In this case, the method returns the unordered list for the previous example in
    Figure 7–26. Table 7–47 can see three of the most useful methods defined by the
    DOM.


    Table 7–47. Javascript Most Used Methods


    | Property | Description |

    | --- | --- |

    | getElementById() | Returns the first element with the specified id |

    | getElementsByName() | Returns the first element with the specified name |

    | getElementsByTagName() | Returns the first element with the specified tagName
    |


    If we use the getElementsByTagName we can grab a set of elements with just one
    method call. In this situation, Javascript creates an array and inserts all the
    returned elements. The syntax for the getElementsByTagName is the following, and
    this code returns all the <li> elements in the documents.


    ```

    var myLists = document.getElementsByTagName("li");

    myLists[3]; // return the fourth links in position three inside the array

    ```


    In our example we use the getElementById getElementsByTagName methods on the object
    document, but we use them on all the object''s objects. In the next we don''t
    want to grab all the links in the document but only the links in a specific menu.


    ```

    var myEdgeMenu = document.getElementById("edgeMenu");

    var edgeMenuLinks = myEdgeMenu.getElementsByTagName("li");

    ```


    First, we get the edgeMenu element using its ID and call the getElementsByTagName()
    on this node. The result is that the method returns only the <li> elements of
    the edgeMenu.


    The next question is: what can we do if we want not to simply grab a node, but
    also change it? When we write HTML code, we can change an element modifying its
    attribute or attributes, sometimes adding one or more attributes. Examples are
    changing the src attribute of an image or a link in a <div> or list.'
