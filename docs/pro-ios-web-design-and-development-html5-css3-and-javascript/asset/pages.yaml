  md: '# Apple''s Mobile Hardware


    One of the key points that you find in this book is that "the hardware is not
    as important; the user experience is the real killer application." Despite that,
    having a deep knowledge of the hardware you use in your project is fundamental
    and required for designing and developing quality works.


    Often people ask for guidance in designing a web site or a web application to
    be compatible with different models of the same device and the answer is always
    the same: If you design a web site, optimize your work for the oldest device because
    a website is a general resource and you need to guarantee to the users the availability
    of its functions.


    If you design an iOS web application, you need to guarantee that a set of functions
    is available from the oldest device to the newest one and that a subset of those
    functions is optimized only for the newest device. A reasonable ratio might be
    30 percent to 70 percent with 70 percent of functions made available to all device
    models.


