    \ his fancy touch and gesture support. For example, to prevent scrolling on an\
    \ element in iOS 2.0, implement the touchmove and touchstart event handlers as\
    \ follows:\n\n```\nfunction touchMove(event) {\n  // prevent scrolling on this\
    \ element\n  event.preventDefault();\n}\n```\n\nSimilarly, we can prevent pinch\
    \ open and pinch close gestures, implementing gesturestart and gesturechange event\
    \ handlers as follows:\n\n```\nfunction gestureChange(event) {\n  // disable browser\
    \ zoom in and out\n  event.preventDefault();\n}\n```\n\nIf we implement the function\
    \ for the touchmove and touchstart event handlers, we will prevent scrolling in\
    \ our WebApp, while if we implement it for gesturestart and gesturechange, we\
