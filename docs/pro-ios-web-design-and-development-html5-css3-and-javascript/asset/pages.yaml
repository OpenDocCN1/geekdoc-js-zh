  md: '# Tools for User Interface Design


    The tools used in this chapter are physical tools and software applications.

    Table 5–1 lists some useful tools you can use to design your next user interface.


    Table 5–1. Tools used to design iPhone and iPad interfaces.


    | Name | Tool | URL | Operating System |

    | --- | --- | --- | --- |

    | UI Stencil | | www.uistencil.com/ | --- |

    | Balsamiq Mockups | Application | http://www.balsamiq.com/ | OSX/Win/Linux |

    | Adobe Fireworks | Application | http://www.adobe.com/products/fireworks.html
    | OSX/Win |

    | Adobe Photoshop | Application | http://www.adobe.com/products/photoshop.html
    | OSX/Win |

    | Gimp OSX | Application | http://gimp.lisanet.de/ | OSX |

    | Gimp | Application | http://www.gimp.org/ | Linux |


    # Summary


    In the first part of this chapter, we analyzed the interface design process and
    discussed the anatomy of sketching and the “think simple” paradigm. We discussed
    how the iPhone limitations, the iPhone page model, and users’ cognitive resources
    influence design style and explained how all these elements are the source of
    the “think simple” design paradigm.


    In the second part, we explained how to improve a basic sketch made with pen and
    paper using a tool like Balsamiq Mockups. We explained that you can start to create
    some content and interface connections to create an initial visual representation
    of the concept design.


    In the third part of this chapter, we told you how to design a user interface
    using Adobe Fireworks. We approached the process step-by-step, from the creation
    of a new canvas to the interface design. At the end of the process, we introduced
    the idea of reusing your design to create two more views or pages and we suggested
    making a visual representation of the interface-content relationship as a deliverable
    for the implementation phase.'
