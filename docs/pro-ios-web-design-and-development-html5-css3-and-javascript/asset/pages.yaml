  md: '# User Interface Design for iOS Devices


    > “Simplicity is the ultimate sophistication”—Leonardo da Vinci


    The user interface design phase is one of the most important stages of your entire
    project. The user interface is the foundation of everything in your WebApp: content,
    functions, and all types of services are all accessed through the elements that
    compose your user interface.


    In this chapter, we define what an interface is inside a touch-screen ecosystem.
    We explore the concept of positive and negative space as it comes into play in
    the user interface design phase and see how the rule of perceptions helps us to
    conceptualize our interface design in our minds.


    We discuss color psychology theory, suggesting how you can combine colors in an
    effective and pleasing way, and look at how colors affect the user’s mood. Then
    we examine user reading patterns and see how you can influence them with your
    interface design.


    In the last part of this chapter, we examine the user interface design process
    through all phases and then we implement it in three different projects: one compatible
    with iPad, with a native-like structure specific to iPad, and one with a native-like
    structure only for the iPhone.


