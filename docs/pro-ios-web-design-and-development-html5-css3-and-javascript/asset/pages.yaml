  md: '![](img/7621e729711898868a82bc471fc9db3b_164_0.png)


    # Create Dominance


    You can use the passive negative space to create element dominance inside your
    interface or layout. Generally, you achieve element dominance using negative space
    combined with other techniques, but a nice and easy trick to achieve it is to
    let an element eat another element''s negative space. An element that does this
    tends to stand out, and this technique works even more effectively if the layout
    or interface elements are equally spaced.


    Typically, this technique uses a negative margin value between the dominant element
    and the adjacent elements. You can achieve the same visual effect without using
    any margin value and working on the element''s perspective and position, as shown
    in Figure 4–18.'
