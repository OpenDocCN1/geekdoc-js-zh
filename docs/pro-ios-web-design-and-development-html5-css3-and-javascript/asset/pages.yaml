  md: 'Using this syntax, Safari will automatically create a phone link on your web
    page. The Phone application is not installed on the device, as in the iPad and
    iPod, we will get a warning message when touching this type of link.


    Another good practice is to check the iPhone agent in order to prevent this type
    of error. Checking the iPhone agent filters access to the service, allowing only
    iPhone users with phone capability. The following code performs this type of check
    using the JavaScript "onclick" handler:


    ```

    <a href="tel:1-305-555-5555" onclick="return navigator.userAgent.indexOf(''iPhone'')!=-1">1-305-555-5555</a>

    ```


    IOS provides only partial support to the RFC 2086 protocol. This means that the
    number contains special characters like "*" or "#, the device will not call the
    number. This happens because IOS, for security reasons, doesn''t implement all
    the special characters in the tel scheme.


    IOS number detection is by default; sometimes you don''t want numbers to be interpreted
    as phone numbers. In this case, switch off the IOS number detection, adding the
    following metatag in the <head> section, telling the iPhone to ignore it.


    ```

    <meta name="format-detection" content="phone:no">

    ```


    It''s important to note that if a phone number is inside an <a> link, it will
    continue to be displayed as a phone link.


    # The Mail Application


    You can add a link to the Mail application using the following link syntax:


    ```

    <a href="mailto:info@andreapicchi.it">Andrea Piccchi</a>

    ```


    Safari will automatically create a link to the Mail application that will be opened
    in a window. You can also embed text directly in the e-mail form that will be
    opened by the link using the following syntax:


    ```

    <a href="mailto:info@andreapicchi.it?subject=Book%20Feedback&body=Keep%20up%27the%20Good%20work!">Send
    a Feedback to Andrea Piccchi</a>

    ```


    The IOS implements the mail scheme specified in RFC 236 and allows you to some
    optional attributes, as shown in Table 8–3.


    **Table 8–3.** Optional Attributes Supported by IOS.


    | Name | Syntax |

    |---|---|

    | Body Message | body=messageText |

    | Subject Message | subject=subjectText |

    | Multiple Recipients | mailto=emailAddress1,emailAddress2,emailAddressN |

    | CC Recipient | cc=emailAddress |

    | BCC Recipient | bcc=emailAddress |'
