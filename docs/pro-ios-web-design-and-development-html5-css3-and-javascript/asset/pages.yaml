    # # Summary


    In this chapter, we introduced the interface design process. You saw that designing
    for a touch device means having a different approach to the interface design concept
    because of the zoom function that every device offers to the user, so that everything
    becomes Touchable and everything becomes an interface.


    We introduced a new concept, defining what active and passive interfaces are in
    a touch-screen design process, and learning how we can use them for optimizing
    the structure inside our WebApp.


    Following this approach, we also explored the use of active and passive negative
    space, the foundation of color psychology, and how colors affect users'' moods.


    We introduced the visual hierarchy concept, the most common user reading patterns,
    and discussed how to use a strong visual hierarchy to influence these patterns
    and achieve specific goals in your design.


    In the second part, we worked on the design using a compatible Apple Store use-case.
    We presented the use of negative space and touch-oriented typography to optimize
    the user experience of a desktop-based website for Apple’s tablet and its 9.7-inch
    display. In the third part, we used the same approach but oriented to an iPad
    native version of our Apple Store use-case. Always following the same interface
    design process, we designed an iPhone version of the Apple Store website in the
    fourth part.'
  merge: -1
