  md: '# Structure


    When you work on the native-like version of your site or application, you can''t
    redesign the structure as you previously did in the compatible version. The compatible
    version was focused on improving the structure in order to offer a finger-friendly
    experience. Here, the emphasis is on how to prioritize the content with respect
    to the native-like structure.


    How to prioritize your content is a choice that relies on market research and
    is not up to the designer. When the research phase has determined which part of
    the content to include and which parts to leave for the desktop version, only
    then can you start to organize the native-like layout.


    Compared with an iPhone native-like version, the iPad native-like version can
