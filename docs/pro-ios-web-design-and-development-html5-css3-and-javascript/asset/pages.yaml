  md: 'designers and developers use the viewport metatag for letting the web page
    fit the width of the device; the viewport metatag properties can be seen in Table
    8–1.


    In order to achieve this, a constant device-width needs to be used. The following
    example shows a typical viewport metatag for a WebApp with two meta-keys: name
    and content.


    ```

    <meta name="viewport" content="width=device-width; initial-scale=1.0; maximum-scale=1.0;
    user-scalable=no;/>

    ```


    This meta-key content has multiple properties separated by a comma. The constant
    device-width refers to the width of the device that browses the page. This means
    that the value will change from device to device, as shown in the following example:


    +   - width=768 (device-width in px for iPad on)

    - width=480 (device-width in px for iPhone 4)

    - width=320 (device-width in px for iPhone 2G, 2G, 3GS)


    You can also decide to match the device height instead of its width using the
    constant device-height.


    The other property, initial-scale, sets the initial zoom on the web page once
    it is loaded. The default value of 1 sets the page to the iPhone display resolution.


    The last property, user-scalable, sets the capability for the user to zoom in
    or out using a pinch gesture on the screen. When it is set to no, no zooming is
    allowed. The user scalability property should be set to no for every native iPhone
    and iPad WebApp, while it should be set to yes on iPad-compatible projects.


    Table 8-1. Viewport Metatag Properties.


    | Name | Default Value | Min Value | Max Value |

    |---|---|---||}{

    | width | 980 | 200 | 10000 |

    | height | Calculated | 223 | 10000 |

    | initial-scale | Fit to Screen | Minimum Scale | Maximum Scale |

    | user-scalable | Yes | -- | -- |

    | minimum-scale | 0.25 | >0 | 10 |

    | maximum-scale | 1.6 | >0 | 10 |


    As a final note, remember that the viewport metatag will not in any way affect
    the rendering of desktop web pages.'
  merge: -1
