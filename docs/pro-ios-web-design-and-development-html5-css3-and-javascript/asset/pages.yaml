  md: '# Rounded Borders


    Achieving rounded borders using CSS2 coding is not a simple task. As we well know,
    iOS has rounded borders everywhere. Numerous methods are available to create CSS
    rounded borders, but these require additional markup and individual images for
    each border.


    Using CSS3, creating a rounded border is incredibly fast and easy. We can apply
    this property to one or to all corners, or to individual corners. Table 7–18 shows
    the CSS Level 3 rounded border property.


    The CSS syntax is the following:

    -webkit-border-radius: <length>;


    **Table 7–18. The CSS Level 3 Rounded Border Property**


    | Name | border-radius |

    | Value: | [ length | percentage ] |

    | Initial: | [0] |

    | Applies to: | all elements |

    | inherited: | no |


    # Border Images


    Border images are one of the most useful additions; note that all of the big buttons
    that slide from the bottom on the iPhone can also be designed with this property.
    CSS3 has the capability to repeat or stretch a border image as you choose. Table
    7–19 shows the CSS Level 3 border image property.


    The CSS syntax is the following:

    -webkit-border-image: <source> <slice> <width> <outset> <repeat>;'
