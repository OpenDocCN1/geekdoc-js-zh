  md: 'CHAPTER 4: User Interface Design for iOS Devices


    **DEFINITION:** Negative space

    The space around between the subject or subjects of an image. The negative space
    might be most evident when the surrounding space, and not the subject itself,
    forms an interesting or artistically relevant space. The use of negative space
    is a key element of artistic composition.


    Designing a webpage or a user interface involves taking diverse objects and arranging
    them in a logical, functional, and attractive manner. The key concept to remember
    is that the attractiveness of your interface goes well beyond the design elements
    you use; you must also take into account the aesthetic quality of the negative
    space surrounding those elements.


    The physical space occupied by each element is in relation to all the other items
    on the page. This physical space has its own rules. These rules, from the simple
    to the complex, depend on context. They all share the same key-point: they are
    subject to the influence of negative space.


    ![](img/7621e729711898868a82bc471fc9db3b_160_0.png)


    **Figure 4-13.** An example of perfect use of negative space in logo design (image
    Richard Fonteneau).


    The first thing you need to learn is how to see negative space in your interface
    or layout. What you must do is retain your brain to look not only at the content,
    but also at the inverse of the content. If you think of an element as the combination
    of an item and the space around the item itself, your brain, using a process called
    the Law of Figure Ground, combines both the item and the negative space around
    it in order to represent the element.


    Even though you are now familiar with the concept behind negative space, deciding
    on the right amount of negative space for your design requires a great deal of
    visual sensitivity and skill. Basically, the right amount of negative space is
    dictated by three factors:


    +   - **Mood You Want to Obtain**n(a portfolio website needs more space than an
    online magazine)


    +   - **Quantity of Information to Be Delivered**n(because negative space is expensive)


    +   - **Medium You Are Designing for**n(iPhone, iPad, desktop PC, Printer, and
    so on, might require different amounts)'
