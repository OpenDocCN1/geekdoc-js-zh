    The next step is to link the Manifest File in our web pages using the `<html>`
    tag using the attribute manifest="cache-iphone.manifest" as shown in the following
    code:


    ```

    ```html manifest="cache-iphone.manifest"```

    ```


    The Manifest File must be served using the "text/cache-manifest" MIME type, so
    the last step is to add the "text/cache-manifest" content type inside an `.htaccess`
    file, which is in turn placed inside the web root directory. If it''s not done
