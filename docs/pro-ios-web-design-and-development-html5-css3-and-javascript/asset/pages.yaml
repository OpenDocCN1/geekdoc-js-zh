    # ## Improve Reading Experience and Understanding


    You can use passive negative space to improve the user''s reading experience and
    understanding on-the-go. When the user attempts to operate a mobile device on-the-go,
    he/she is always struggling to understand its content because of the circumstances
    and distractions of the busy real world. Achieving the goal of a good reading
    experience and user comprehension is equally important on both the iPhone and
    the iPad, but, because its screen is so much smaller, it is especially important
    to maintain a high quality user experience on the iPhone.


    Typically, this technique manipulates not only the size of the characters, but
    also passive negative space through the use of line-height, word-space, and letter-space
    value between words and characters. In Figure 4–19, you can see how the use of
    the line-height property increases readability of the text and gives you more
    breathing room in the layout.'
