  md: "The example below will produce an animation that moves an element from (0,\
    \ 0) to (100px, 100px) over five seconds and repeats itself nine times (for a\
    \ total of ten iterations). Note that we didn't use all the properties listed\
    \ above because we didn't need them to achieve this particular effect.\n\n# Reflections\n\
    \nNo other CSS property is so typically Apple-style as the reflection property.\
    \ Reflection is used on every product presentation in the Apple store and combined\
    \ with the use of negative space, it is a valuable tool for achieving clean design.\n\
    \n> NOTE: Negative space, in art, is the space around and between the subject(s)\
    \ of an image. Negative space may be most evident when the space around a subject,\
    \ and not the subject itself, forms an interesting or artist relevant shape, and\
    \ such space is occasionally used to artistic effect as the \"real\" subject of\
    \ an image. The use of negative space is a key element of artistic composition\
    \ and visual design.\n\nThe box-reflection is composed of 3 arguments or values\
    \ in order to achieve the final effect. The first argument sets the direction\
    \ of the reflection. The second argument specifies the offset of the reflection.\
    \ The third argument is a mask applied to the reflection and passing using a property\
