    # # Anatomy of a Search Engine


    There is much more behind the minimal user interface of a search engine like Google.
    Unfortunately we can''t know every detail of how a search engine works because
    this is proprietary information. In spite of this fact, every search engine is
    composed of a few known parts that, in a general way, can help us to understand
    how they work.


    +   - Crawlers, Spiders, and Robots


    Crawlers, spiders, and robots are programs that crawl the web in search of web
    pages to index in a database. Google is an example of a crawler-based search engine,
    and its crawler scans the web collecting information about every URL.


    +   - User Interface (UI)


    User interface is where the user writes his query. The minimal user interface
    offered by Google is just one example of the front-end of every search engine.'
