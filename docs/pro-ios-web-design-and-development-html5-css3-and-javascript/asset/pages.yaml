    The most famous behavior difference between Safari and Mobile Safari is the position:
    fixed issue (supported only from IOS on). This may become a problem when we want
    to insert some kind of UI element, like a fixed footer (or header), in the bottom
    (or upper) part or our web site or WebApp. In this case, if the user scrolls up
    and down the page does the UI element.


    In order to understand what and why this happens, we need to remember that what
    we see on the iPhone (and in some cases on the iPad) is just viewport into the
    full HTML page.


    > NOTE: The viewport area in a desktop context is the visible portion of a 2D
    area, which is larger than the visualization screen.


    It''s like having an open book in front of us, and in our hands a piece of paper
    with a square hole of 320x416 pixels cut out of the inside. Once we want to read
    the page we need to move the book''s surface, the 320x416 square hole (the viewport)
    around and position it over the words we want to read. This is exactly what the
    Mobile Safari viewport does, and as we flick and scroll, we are moving the viewport
    around the web site behind while it stays static. The Figure 3–32 below, shows
    exactly this principle.'
