    # JavaScript: Introducing Best Practices.


    Browser-based development is the predominant platform for JavaScript, and usually
    it’s executed in the context of a webpage. One of the considerations when writing
    JavaScript for iPhone or iPad is the abysmal performance offered by these devices,
    illustrated in Figure 3–30.


    ![](img/7621e729711898868a82bc471fc9db3b_132_0.png)


    Figure 3–30. JavaScript Performance Comparison between Mac OS X (left) and iOS
    (right)


    In these cases, following best practices for high-performance code becomes more
    important. The following will present some best practice principles that will
    help us to develop a cleaner and faster code in our iPhone and iPad web sites
    and WebApps.'
