    # # Summary


    In this chapter, we saw the importance of planning a testing phase and how this
    phase can be performed along the entire project flow—not just at the end of the
    process.


    We began by showing how heat maps are a reliable source of feedback for the designer
    and developer. We then introduced paper and electronic prototypes. We saw how
    these two types of tests help the tester gather different types of feedback.


    We discussed how to organize a test by applying artifact recycling from the previous
    steps of the process flow. We saw how to create a test and a use-case using different
    levels of detail. We saw UML notations, introducing the use-case textual description
    and the use-case diagram.


    We saw how to perform a test with paper and electronic prototypes. We saw how
    to create and recycle the assets, and that the electronic prototype was performed
    in the early phase of the design at the end of the design phase before passing
    on to the implementation phase.


    We also saw that the electronic prototype, because it shares the same technology
    with the web site or application, can be used to test the project outside the
    office in a real-world scenario.


    Finally, we saw how to evaluate a test and the variables of feedback involved
    in this process. We presented three types of variables (number of touches, number
    of mistakes, and estimated time of arrival) and three types of feedback (design,
    expectation, and emotional feedback) used in the evaluation.'
