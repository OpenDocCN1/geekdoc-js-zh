    ></video>\n</div>\n```\n\nThe controls attribute tells the browser it has to show\
    \ the video controls, and the poster attribute is an image used as a placeholder\
    \ for the video. Not only is it a good practice to always add the control attribute\
    \ to the <video> tag, it must be remembered that Safari Mobile ignores the control\
    \ attribute. Controls are always visible, and the true/false attribute is not\
    \ required (even on Safari Desktop). Another important behavior to remember about\
    \ the <video> tag is that the autoplay attribute is ignored by Safari on iOS.\n\
    \nThe <video> tag can be styled through CSS like every other HTML5 element. In\
    \ the example we use only four attributes, but this new tag has many other attributes\
