  md: 'On a desktop site map, you might decide to choose either a wide or a deep site
    map in order to answer a specific web site need, as show in Figure 2–9. In a mobile
    site map, you have only one choice: the wide site map. This occurs because the
    user experience is totally different from that of the desktop, and everything
    should be reachable in 2 to 4 linear maps.


    ![](img/7621e729711898868a82bc471fc9db3b_54_0.png)


    **Figure 2–9.** Visual comparison between wide (the structure on the left) and
    deep site (the structure on the right) map


    Imagine using your iPhone to browse a page with the structures represented in
    Figure 2–10, in which both structures have three links in the primary level of
    navigation. By browsing the wide structure and choosing link number 1, you have
    a 100% chance of choosing the right path for our information. By browsing the
    deep structure and choosing link number 3, you have only a 33% chance of choosing
    the right path, and your chance drops to 25% if you choose link number 1.


    Now, how many links you might face in a typical web site. How much risk is there
    of the user making a wrong choice? If users sitting at their desktop computer
    go down the wrong path, in a glance they can see how to return to the primary
    navigation level. But with an iPhone, this is not the right way to find peace
    in your (binary) life.


    In this phase, you build the foundation of user experience by testing, at a basic
    level, which kinds of interactions the user will have with the web site or web
    application.


    > NOTE: We can define interaction in user experience as a kind of action that
    occurs between a human and a human interface every time the human uses the interface
    in order to achieve a goal or get a resource.


    By working on the content architecture representing your site map structure, you
    also start to work (even if indirectly) on the user experience.


