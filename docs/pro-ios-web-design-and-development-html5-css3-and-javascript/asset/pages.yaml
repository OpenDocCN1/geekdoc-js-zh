    \ {\n  /* Handler Javascript Code Here */\n}\n\nfunction gestureEnd(event) {\n\
    \  /* Handler Javascript Code Here */\n}\n```\n\nIn the next section, we will\
    \ see a special type of gesture event: a gesture that doesn't interact with the\
    \ capacitive display but with the whole device. This gesture is the well-known\
    \ and widely used device orientation change.\n\n# Orientation Change Event\n\n\
    With the iPhone, and even more with the iPad, users change the orientation of\
