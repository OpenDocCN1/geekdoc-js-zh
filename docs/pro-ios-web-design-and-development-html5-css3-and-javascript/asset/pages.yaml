  md: '# What is a Framework and How is it Structured?


    A framework in computer programming is an abstraction that allows common code
    that provides generic functionality to be overridden or customized by user code
    to provide more specific functionality.


    A framework has these specific features:


    +   - Control

    nThe overall program''s flow of control is not dictated by the caller, but by
    the framework.


    +   - Behavior

    A framework has a default behavior. This default behavior must be a useful behavior
    and not a series of no-ops (No Operation Performed).


    +   - Extensibility

    A framework is extendible by the user through selective overriding or customized
    by user code that provides specific functionality.


    +   - Modifiability

    The framework is not allowed to be modified. The user can extend the framework,
    but not modify its code.


    In our context, WebApp framework is software that is designed to support the development
    of dynamic web sites or WebApps. This kind of framework allows to alleviate the
    overhead associated with common activities performed in web development, and to
    promote code reuse.


    The frameworks proposed share the same structure and provide 3 kinds of resources:


    +   - HTML Templates (page-name.html)

    The Templates are presented as examples; all we need to do is use these as our
    starting point and customize those pages according to our needs.


    +   - CSS File (file-name.css)

    The CSS file defines the page, Apple native-like layout and all the Tags used
    in the HTML pages.


    +   - JavaScript File (file-name.js)

    The JavaScript file defines the native-like behavior used in all HTML pages


    The changes from one framework to another will be the project (documents) structure,
    how the files are organized, and the CSS class names or the JavaScript function
    names'
