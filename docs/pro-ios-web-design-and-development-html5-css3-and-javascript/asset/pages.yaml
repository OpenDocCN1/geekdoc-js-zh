    # # Summary


    In the first part of this chapter, you analyzed the interface design process,
    and presented the anatomy of sketching and the “think simple” paradigm. The iPhone’s
    limitations, the iPhone’s page model, and how cognitive resources influence your
    design style were all discussed. How all three of these elements are the foundation
    of the “think simple” design paradigm was also discussed.


    In the second part of this chapter, the Balsamiq Mockups were used to improve
    the basic sketch with pen and paper. The content, an interface connection, and
    the first visual representation of the concept design were all created.


    In the third part of this chapter, Adobe Fireworks was used to design a user interface.
    This process was approached step-by-step, from the creation of a new canvas to
    the interface design. At the end of the chapter, design reuse for creating two
    more views or pages from the presented home page was introduced, and a visual
    representation of the interface-content relationship as a deliverable for the
    implementation phase was also introduced.'
