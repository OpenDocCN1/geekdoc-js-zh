    # Designing with Adobe Fireworks


    After using a tool as Balsamiq to compose a mockup from your sketch, it’s time
    to enter the third phase of the process and switch to a graphic program like Adobe
    Photoshop or Fireworks to work on the aesthetic aspect. Adobe Photoshop is probably
    the best graphic program for manipulating bitmaps, but if you work on a WebApp
    design using many vector shapes and to control, move, transform, or modify pixels,
    Fireworks is the best option.


    Adobe Fireworks is much more web-oriented than Photoshop. A good example of this
    is the property tool, located in the lower left corner of the interface. The property
    tool provides constant feedback to the designer about the X and Y coordinates
    of an element and its dimensions in pixels. The Property box is useful during
    the user interface design process. Another example is the export tool; the Fireworks
    optimization algorithm'
