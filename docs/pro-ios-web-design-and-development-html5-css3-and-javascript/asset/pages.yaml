    is bold text |

    | <em> | Emphasis | Span of text with emphatic stress |

    | <strong> | Strong emphasis | Span of text with strong importance |


    # HTML5 Semantics


    Besides the new syntax rules introduced so far, the most notable feature embraces
    the tag''s semantic. HTML5 has a natural semantic-oriented attitude and enables
    developers to create cross-platform design through expressing the content more
    semantically. To achieve this, HTML5 introduces new tags, such as `<header>`,
    `<nav>`, `<section>`, `<aside>`, and `<footer>`, to structure our web site or
    web application and render the content more machine-readable and therefore make
    it easier for the mobile browser and search engine to treat content properly.'
