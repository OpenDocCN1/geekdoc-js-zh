  md: '# Key Points of the Simplicity-Complexity Paradox


    So far, you have seen that by applying these three fundamental concepts you can
    reduce complexity and increase simplicity in your design. You can also see that,
    in a mobile context, simplicity is deeply related to a high quality of user experience.


    The important fact is that simplicity is naturally related to complexity, and
    are just two different expressions of the same event that happens in ours. For
    this reason, it is totally futile trying to eliminate complexity using simplicity
    because, as the chaos theory suggests about the simplicity-complexity paradox,
    complex patterns contain simpler patterns within them that are reflections of
    more complex patterns.


    A few important points:


    +   - Simplicity can''t eliminate complexity: Using the simplicity concept, you
    can''t eliminate complexity from your design; simplicity needs complexity to stand
    out in our minds.


    +   - Simplicity can drive you to complexity: Removing, hiding, or shrinking the
    wrong element in your design increases the global-level complexity.


    +   - Simplicity is subjective: Simplicity is a perception and has its origin
    in the user''s mind. You can''t assume that every user will perceive the same
    level of simplicity in your design.


    Now, it''s time to go to the practical part and start to analyze the compatible
    and native-like iPad versions of your Apple Store use case.


    # Sketching the UI


    In this section, you will learn how to apply the three simplicity principles to
    your compatible and native-like versions. Starting from the iPad-compatible version,
    you can see the relationship between the sketch and the final design composition
    in Figure 6–5. When working on this version, besides the fact of being finger-friendly
    and optimizing the structure for an effort-free user experience, the design approach
    is not so far from the one you use for a desktop version.


    Apply the Remove and Prioritize principle, by removing the Special Deals box and
    the Financing option. Despite that, the most important step is removing the layout
    dominance over the content.


    The user needs more cognitive resources in his browsing experience if he needs
    to look for important information in two opposite places. As you well know, the
    cognitive resources are limited, if the navigation structure takes away too many
    resources from the user, a small quantity will remain available to the user for
    understanding the content. This will decrease the level of user experience.'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'As a result of this step, you will prioritize the main content over the content
    structure and some navigation elements over others.


    ![](img/7621e729711898868a82bc471fc9db3b_240_0.png)


    Figure 6–5. The iTunes page: Shrinking and grouping in content design


    You should apply the Hide and Shape principle, hiding the Software box and the
    Gift Cards from the Popular Accessories box. These boxes will be hidden but still
    accessible with one touch from the Popular Accessories box, using one of the "more.."
    links. You should also hide some of the iPhone and iPad top sellers items; the
    box will show random items from the top ten, and the complete top ten is available
    using the "more.." link at the bottom of the list.


    You should apply the Hide and Group principle, merging and hiding the two side
    bars into one bigger bar. Merging the two columns will group the navigation elements,
    and as result, you will group the user focus into (only) one zone of your layout.
    More than any design improvements, it is the level of user experience that really
    changes.


    Analyzing the native-like iPad version of your use case in Figure 6–6, you can
    see how the design approach is much more mobile-oriented compared to the previous
    compatible version.


    This time, because of the limited screen estate available, compared to a desktop
    monitor, you will apply the Remove and Prioritize principle in a more aggressive
    way.'
