    # The Rules of Perception in User Interface Design


    The rules of perception are fundamental for every kind of designer. These rules
    are the filters that are used for interactions in life and are the foundation
    of our experiences. The role of these rules is to interpret and integrate single
    stimulus from the external environment into a single formative content.


    When designing interfaces for your Apple device, it is important to be aware of
    these rules in order to achieve specific goals with your design. Sometimes, you
    may want to transmit passion, energy, simplicity, or just be minimal. The rules
    of perception help you to achieve better results in terms of quality and make
    the whole process even easier.


    The Law of Proximity states that proximal elements in the perceptive field are
    perceived as a single entity. You can use this rule to create semantically-based
    groups or entities to the design.'
