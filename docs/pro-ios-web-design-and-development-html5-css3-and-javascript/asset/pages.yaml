    Before starting to sketch out an iPad case, in the next section, you will see
    how to apply simplicity to your design, and apply some of the rules behind this
    concept.


    # Remove and Prioritize


    "Remove" sounds easy, but think about it—how you will know what to take away from
    your design? This is the main question that every designer will feel when trying
    to achieve simplicity. This question triggers three main fears


    +   - Fear of missing something: Designers fear that removing elements from the
    design will decrease the probability of the user finding what he needs. Designers
    struggling with this fear add content without applying any sort of content prioritizing.


    +   - Fear of being misunderstood: Designers fear that removing elements from
    the design will decrease the probability of the user understanding the content''s
    message. Designers struggling with this fear add technical information or many
    instructions where they are not strictly necessary.


    +   - Fear of failure: Designers fear that removing elements from the design will
    increase the probability of failure. Designers struggling with this fear rely
    on the quantity of information instead of the quality.


    Overcoming these fears is important for a designer. Through the simplicity concept,
    you can reduce the noise in your web site or web application, and this fact will
    make useful content or features more prominent. This is a fundamental concept
    behind every great (simple) design.


    The next question is how you will know when you have made something as simple
    as possible? Unfortunately, there isn''t an answer for that; your experience will
    help you the most, besides a good phase of testing. In your interface design process,
    good guidelines should be as follows


    +   - Understand the core of a design element: See the element globally in the
    web site or web application context.'
