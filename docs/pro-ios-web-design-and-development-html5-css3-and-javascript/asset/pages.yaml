  md: '# Defining Viewport


    The viewport is the rectangular area that the user sees when looking at the iPhone
    or iPad display, represents an important concept in the world of web design. The
    viewport dimensions are defined by two values: device-width and device-height.
    As we learned in previous chapters, different models of the iPhone have different
    display resolutions; nevertheless device-width and device-height values are set
    by default at the same value for all iPhone models. In both portrait and landscape
    modes, there will be a 320 x 480 px viewport area. This approach ensures that,
    even with double-pixel resolution, the ratio between viewport elements remains
    unchanged, as shown in Figure 8-2, ensuring that existing iPhone WebApps continue
    to function as expected.


    ```

    <meta name="viewport" content="width=640"/>

    ```


    Even if it''s not indicated by the code just shown, you can still have "full 100%
    real pixels" on Retina display devices.


    ![](img/7621e729711898868a82bc471fc9db3b_350_0.png)


    Figure 8-2. The iPhone viewport and its sections in non-WebApp (left) and WebApp
    mode (right).


    The default value for the viewport is set to a width of 980 px; this value is
    the reason a compatible WebApp with a fixed-width structure should be set as 980
    px wide. In addition, when the viewport tag is not present, Safari loads the page
    as a 980 px-wide page and shrinks it to the viewport. This is equal to the following
    metatag declaration:


    ```

    <meta name="viewport" content="width=980;user-scalable=1;"/>

    ```


    Having a 980 px default value means that the old iPhone models will scale down
    by a factor of approximately 3.06:1 or 2.04:1, while the iPhone4 will scale down
    by a factor of 2.04:1 or 1.02:1. Furthermore, the best option for iPhone and iPad
    web'
