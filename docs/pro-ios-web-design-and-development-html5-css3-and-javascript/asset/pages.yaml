    # Redefining Mobile''s Reach: The Next-Generation Protocols


    The fourth-generation(4G) system is a successor to 3G Internet and aims to provide
    a wide range of data rates to ultra-broadband (gigabit speed) Internet access
    to mobile as well as stationary users.

    The name of this new project is LTE (Long Term Evolution) and is a set of enhancements
    to the UMTS (Universal Mobile Telecommunications Systems) architecture.

    The LTE specification provides peak rates of at least 100 Mbits and an uplink
    of at least 50 Mbps with a RTT (round-trip time) of less than 10ms.

    But beyond these numbers, the most important point of the LTE draft is the “Persuasive
    Network”, an amorphous concept where the user can be simultaneously connected
    to several wireless access technologies and can seamlessly move between them (vertical
    handover). The access technologies can be Wi-Fi, UMTS, EDGE, or any other future
    access technology.'
