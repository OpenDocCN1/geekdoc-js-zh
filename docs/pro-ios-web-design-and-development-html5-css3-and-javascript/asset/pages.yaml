    between MWBP (Mobile Web Best Practice) and WBP (Web Best Practice), because most
    cases have similar obstacles and solutions. Two of the most important needs that
    mobile accessibility addresses are visual and audio needs.


    > NOTE: On December 11, 2008, the WAI (Web Accessibility Initiative) released
    WCAG 2.0 as a recommendation. WCAG consists of a set of guidelines on making content
    accessible, primarily for disabled users, but also for highly limited ones like
    phones and smartphones.


    Addressing (at least) video and audio needs will make your web site or web application
    accessible to most of your potential users, as be seen in Figure 2–16. But unfortunately,
    this is not always easy to achieve and sometimes well-known and successful products
    have at least some amount of accessibility.


