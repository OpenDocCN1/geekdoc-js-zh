  md: "# CHAPTER 8: Native iOS Environment Development\n\nIn this case, if we want\
    \ to know the exact coordinates of the first touch object on the web page, we\
    \ can use the following JavaScript syntax:\n\nOnce we access a single-touch object,\
    \ we can use its properties, shown in Table 8–9, for creating every type of gesture\
    \ interaction.\nCombining JavaScript code and CSS properties, we can create custom\
    \ touch handling support. Every time we write custom touch handling support, a\
    \ good practice is to disable the default Safari behavior. This will be the subject\
    \ of the next section.\n\n# Native and Customized Touch Event Handler\n\nIn the\
    \ previous section, we said that the most used event inside a typical browsing\
    \ session is the event related to mouse behavior emulation. Some of these well-known\
    \ activities are one-finger panning, zoom pinching and unpinching, and touch-and-hold.\
    \ We also said that the DOM events supported by Safari Mobile and related to this\
    \ type of activity are natively handled by the Apple iOS and are provided for\
    \ free.\n\nBesides these natively supported events, sometimes a project requires\
    \ a way to customize multi-touch and gesture events. In this case, we can turn\
