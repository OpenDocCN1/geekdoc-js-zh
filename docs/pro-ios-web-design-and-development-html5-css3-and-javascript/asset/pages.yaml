    # Variables


    Working with programming languages means also keeping track of many pieces of
    different types of data. For this purpose, every program language has variables.
    A variable is a container that abstracts a piece of physical memory that physically
    stores the data. In Figure 7–18, we can see how we might picture the physical
    memory in a linear form.


