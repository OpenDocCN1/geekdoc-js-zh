    image can waste space in your layout, confusing the user, and breaking his reading
    pattern without a constructive purpose.


    What can really catch the user’s attention and draw him to an image? According
    to the latest research from the Norman Nielsen Group, the images users choose
    to look at have the following characteristics:


    +   - High Contrast and High Quality


    Crisp and colorful.'
