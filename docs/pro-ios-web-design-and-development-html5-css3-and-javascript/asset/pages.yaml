    # BOM (Browser Object Model)


    The Browser Object Model (BOM) describes methods and interfaces for working with
    the browser. The browser itself is an object and can be accessed from its top
    to the bottom bar by referencing the top-level object window. From the top-level
    object window, we can access important information contained in other (sub) objects
    such as the following:


    +   - **Navigator**

    Contains information about the browser engine type or version.


    +   - **Location**

    Holds the current URL displayed in the browser.


    +   - **History**

