    For this reason, modeling the context instances with care is a key factor in our
    project. Making a mistake and forgetting a specific instance can cost "1" in the
    analysis phase, but the same mistake will cost "10" in the design phase and "100"
    in the development phase.


    Forgetting an instance’s context results is a relatively small mistake in the
    analysis phase, because we can always take a pen and add an entry to our context
    instances checklist. Designing a user interface using incomplete information from
    the analysis phase means designing an interface that might never match all the
