    # The Canvas State


    Each context we draw in a canvas maintains a drawing state. The drawing state
    is accessible and manageable using some specific methods.


    This state is saved on a stack of saved states. This means that we can save a
    state by inserting it on top of the canvas and restore a state by popping off
    the last state on the stack and restoring it.


    The drawing state, also called the canvas state, keeps track of several values
    from different properties and attributes such as the following:'
