  md: '# Links


    A web page without links is like a lost island in the ocean; it is there, but
    almost no one knows that it exists or if they do, how to reach it. The role of
    a link is to connect our web page with other relevant information, both internal
    and external to the web page itself. Another reason why links are important is
    that links have a great value on the final weight of our WebApp SEO score. More
    precisely, inbound and outbound links have a "weight" whereas internal links serve
    only a better "crawl" of the site.


    Google with its famous algorithm, developed by Larry Page and Sergey Bring in
    1998 and patented by Stanford University, was the first to assign dynamic and
    different values to inbound and outbound links in a web page. The real specifics
    of the Google page rank algorithm are unknown because it is one of the closed
    secrets of the company; despite that, some details are known.


    # The Google PageRank Concept


    The probability that a random user visits a web page is called its PageRank. The
    Google PageRank concept uses Google''s global link structure to determine an individual
    page''s value. The PageRank gives an approximation of a page''s importance and
    quality.


    The algorithm that implements this concept interprets a link from web page A to
    web page B as a vote, for web page A, for web page B. The Google PageRank Algorithm
    looks at more than the sheer volume of votes or links a page receives and analyzes
    the page that casts the vote. Votes cast by web pages that have a high PageRank
    value because they are themselves important or are favorably viewed as "established
    firms" in the Web community weigh more heavily and help to make other pages established
    as well.


    # The Google PageRank Algorithm Concept


    The PageRank value of web page A is given as follows:


    PR(A) = (1-d) + d(PR(T1)/C(T1) + ... + PR(Tn)/C(Tn)


    Here, the PageRank given by an outbound link equals the PageRank score PR(Ti)
    divided by the (normalized) number of outbound links C(Ti).


    +   - **PR(A):** PageRank value of page A

    - **PR(T1):** PageRank value of page 1 pointing to page A

    - **C(T1):** Number of links off page 1, which points to page A

    - **PR(Tn):** PageRank value of page n pointing to page A

    - **C(Tn):** Number of links off page n, which points to page A'
  merge: -1
