  \n在本章中，你将学习标准库提供的用于字符串处理的方法。然后我们将转向正则表达式，它让你能够找到匹配模式的字符串。在介绍正则表达式的语法和 JavaScript\
  \ 特有的特殊之处后，你将看到如何使用 API 来查找和替换匹配项。\n\n### 6.1 字符串与代码点序列之间的转换\n\n字符串是 Unicode 代码点（code\
  \ points）的序列。每个代码点都是 0 到 `0x10FFFF` 之间的整数。`String` 类的 `fromCodePoint` 方法根据代码点参数组装字符串：\n\
  \n点击此处查看代码图像\n\n```javascript\nlet str = String.fromCodePoint(0x48, 0x69, 0x20,\
  \ 0x1F10, 0x21) // 'Hi'\n```\n\n如果代码点在数组中，使用展开运算符：\n\n点击此处查看代码图像\n\n```javascript\n\
  let codePoints = [0x48, 0x69, 0x20, 0x1F10, 0x21]\nstr = String.fromCodePoint(...codePoints)\n\
  ```\n\n相反，你可以将字符串转换为代码点数组：\n\n点击此处查看代码图像\n\n```javascript\nlet characters = [...str]\
  \ // ['H', 'i', ' ', '!']\n```\n\n结果是一个字符串数组，每个字符串包含一个代码点。你可以获取整数形式的这些点：\n\n点击此处查看代码图像\n\
  \n```javascript\ncodePoints = [...str].map(c => c.codePointAt(0))\n```\n\n![图像](img/caution.jpg)\
  \ 注意\n\nJavaScript 将字符串存储为 UTF-16 序列。每个代码点是 0 到 `0x10FFFF` 之间的整数。`String` 类的 `fromCodePoint`\
  \ 方法根据代码点参数组装字符串：\n\n点击此处查看代码图像\n\n```javascript\nlet str = String.fromCodePoint(0x48,\
  \ 0x69, 0x20, 0x1F10, 0x21) // 'Hi'\n```\n\n如果代码点在数组中，使用展开运算符：\n\n点击此处查看代码图像\n\n\
  ```javascript\nlet codePoints = [0x48, 0x69, 0x20, 0x1F10, 0x21]\nstr = String.fromCodePoint(...codePoints)\n\
  ```\n\n相反，你可以将字符串转换为代码点数组：\n\n点击此处查看代码图像\n\n```javascript\nlet characters = [...str]\
  \ // ['H', 'i', ' ', '!']\n```\n\n结果是一个字符串数组，每个字符串包含一个代码点。你可以获取整数形式的这些点：\n\n点击此处查看代码图像\n\
  \n```javascript\ncodePoints = [...str].map(c => c.codePointAt(0))\n```\n\n![图像](img/caution.jpg)\
  \ 注意\n\nJavaScript 将字符串存储为 UTF-16 序列。每个代码点是 0 到 `0x10FFFF` 之间的整数。`String` 类的 `fromCodePoint`\
