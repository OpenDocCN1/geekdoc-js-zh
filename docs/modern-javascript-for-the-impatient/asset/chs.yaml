  \ = Node.from('Adam',\n      Node.from('Cain', Node.from('Enoch')),\n      Node.from('Abel'),\n\
  \      Node.from('Seth', Node.from('Enos')))\n    console.log(myTree.depth())\n\
  \    ```\n\n\n\n\n发生了什么？为什么？\n\n12. 当然，上一个练习中的问题可以通过不使用继承，或者将所有类放在一个模块中来轻松地避免。在更大的系统中，这些替代方案可能是不可行的。在本次练习中，请将每个类保持在它自己的模块中，并提供一个名为\
  \ `tree.mjs` 的外层模块来重新导出所有三个模块。在所有模块中，都从 `'./tree.mjs'` 导入，而不是各个模块。为什么这能解决问题呢？\n\n\
  # 第 11 章 元编程\n\n## 本章主题\n\n- 11.1 Symbols（符号）\n- 11.2 使用 Symbol 属性进行自定义\n- 11.3\
  \ 属性描述\n- 11.4 遍历属性\n- 11.5 测试单个属性\n- 11.6 保护对象\n- 11.7 创建或更新对象\n- 11.8 访问和更新原型链\n\
  - 11.9 克隆对象\n- 11.10 函数属性\n- 11.11 绑定参数和调用方法\n- 11.12 Proxies（代理）\n- 11.13 `Reflect`\
  \ 类\n- 11.14 代理不变性\n- 练习\n\n本章深入探讨了高级 API，你可以使用这些 API 创建具有非标准行为的对象并编写与通用对象协作的代码。\n\
  \n我们首先查看符号，这是除字符串外唯一可用作对象属性名的类型。通过使用具有某些“已知”符号的定义属性，你可以自定义某些方法的行为。我们将详细介绍对象属性。属性可以拥有描述符，你将学习如何分析、创建和更新具有适当描述符的属性。作为一个应用，我们将遍历一个用于深拷贝的健壮函数。然后我们转向函数对象和方法，用于绑定参数和使用给定参数调用函数。最后，你将看到代理如何拦截操作对象的每一个方面。我们将详细研究两个应用：监控对象访问和动态创建属性。\n\
  \n### 11.1 Symbols\n\n正如你在整本书中看到的，JavaScript 对象的键是 `String` 类型的。然而，使用字符串作为键具有某些局限性。现代\
  \ JavaScript 提供了另一种可以用作对象键的类型——`Symbol` 类型。符号是唯一的。像这样创建一个符号：\n\n```\nconst sym =\
  \ Symbol('label')\n```\n\n如果你创建第二个符号\n\n```javascript\nconst sym2 = Symbol('label')\n\
  ```\n\n那么 `sym !== sym2`。这是符号的主要优势。如果你想要有一个保证是唯一的字符串键，你可能会添加一个计数器、时间戳或随机数，但仍然担心这是否足够。你不能使用\
  \ `new` 来创建符号：\n\n```javascript\nnew Symbol('label')\n```\n\n由于符号不是字符串，你不能对符号键使用点表示法。相反，请使用括号运算符：\n\
  \n```javascript\nlet obj = { [sym]: value }\nobj[sym] = newValue\n```\n\n如果你想给现有的对象（例如\
  \ DOM 节点）附加某些属性，使用字符串键不是一个好主意：节点目前没有名为 `outcome` 的键，但未来可能会有。但符号是完全安全的：\n\n```javascript\n\
  let outcomeSymbol = Symbol('outcome')\nnode[outcomeSymbol] = 'success'\n```\n\n\
  注意，你需要将符号保存在变量或对象中，以便在需要时可以使用。例如，`Symbol` 类在 `Symbol.iterator` 和 `Symbol.species`\
  \ 字段中拥有“已知”符号，我们将在下一节中学习它们。如果你需要在“领域”（例如不同的 iframe 或 web worker）之间共享符号，可以使用全局注册表。要创建或检索之前创建的全局符号，请调用\
  \ `Symbol.for` 方法。提供一个应该是全局唯一的键：\n\n```javascript\nlet sym3 = Symbol.for('com.horstmann.outcome')\n\
  ```\n\n当 `typeof` 运算符应用于符号时，它会产生字符串 `'symbol'`。\n\n### 11.2 使用 Symbol 属性进行自定义\n\n\
  Symbol 属性用于 JavaScript API 中以自定义类的行为。`Symbol` 类为此目的定义了若干“已知”常量，如表 11-1 所示。接小节将详细检查其中三个。\n\
  \n| Symbol | 描述 |\n| --- | --- |\n| `toStringTag` | 自定义 `Object` 类的 `toString` 方法——参见第\
  \ 11.2.1 节 |\n| `toPrimitive` | 自定义到原始类型的转换——参见第 11.2.2 节 |\n| `species` | 用于创建结果集合的构造函数，被\
  \ `map` 和 `filter` 等方法使用——参见第 11.2.3 节 |\n| `iterator`, `asyncIterator` | 定义迭代器（第\
  \ 9 章）和异步迭代器（第 10 章） |\n| `hasInstance` | 自定义 `instanceof` 的行为：```javascript\\nclass\
  \ Iterable {\\n  static Symbol.hasInstance {\\n    return Symbol.iterator in obj\\\
  n  }\\n}\\n[1, 2, 3] instanceof Iterable\\``` |\n| `match`, `matchAll`, `replace`,\
  \ `search`, `split` | 从同名的 `String` 方法中调用。对于 `RegExp` 以外的对象重新定义——参见练习 2。 |\n| `isConcatSpreadable`\
  \ | 用于 `Array` 的 `concat` 方法：```javascript\\nconst a = [1, 2]\\nconst b = [3, 4]\\\
  na[Symbol.isConcatSpreadable] = false\\n[].concat(a, b) => [[1, 2], 3, 4]\\``` |\n\
  \n**表 11-1**知符号\n\n#### 11.2.1 自定义 `toString`\n\n你可以更改 `Object` 类的 `toString` 方法的行为。默认情况下，它产生\
  \ `'[object Object]'`。但如果对象具有键为 `toStringTag` 的属性，则使用该属性值代替 `Object`。例如：\n\n```javascript\n\
  const harry = { name: 'Harry Smith', salary: 100000 }\nharry[Symbol.toStringTag]\
  \ = 'Employee'\nconsole.log(harry.toString()) // 现在 toString 产生 '[object Employee]'\n\
  ```\n\n定义类时，你可以在构造函数中设置该属性：\n\n```javascript\nclass Employee {\n  constructor(name,\
  \ salary) {\n    this[Symbol.toStringTag] = 'Employee'\n    ...\n  }\n  ...\n}\n\
  ```\n\n或者你可以提供一个 getter 方法，使用如下特殊语法：\n\n```javascript\nclass Employee {\n  ...\n\
  \  get [Symbol.toStringTag]() { return JSON.stringify(this) }\n}\n```\n\n重点已知符号为自定义\
  \ API 方法的行为提供了钩子。\n\n#### 11.2.2 控制类型转换\n\n如果重写 `valueOf` 方法不够，`Symbol.toPrimitive`\
  \ 符号提供了对原始类型转换的额外控制。考虑这个表示百分比的类：\n\n```javascript\nclass Percent {\n  constructor(rate)\
  \ { this.rate = rate }\n  toString() { return `${this.rate}%` }\n  valueOf() { return\
  \ this.rate * 0.01 }\n}\n```\n\n现在考虑：\n\n```javascript\nconst result = new Percent(99.44)\n\
  console.log('Result: ' + result) // 打印 Result: 0.9944\n```\n\n\n\n\n\n为什么不是 `'99.44%'`？`+`\
  \ 运算符在可用时会使用 `valueOf` 方法。解决办法是添加一个键为 `Symbol.toPrimitive` 的方法：\n\n点击此处查看图片\n\n\
  ```javascript\nSymbol.toPrimitive {\n  if (hint === 'number') return this.rate *\
  \ 0.01\n  else return `${this.rate}%`\n}\n```\n\n`hint` 参数是：\n\n*   在使用非 `+` 和比较的算术运算时为\
  \ `'number'`\n*   在使用 `` ` ${. . .} ` `` 或 `String(. . .)` 时为 `'string'`\n*   在使用\
  \ `+` 或 `==` 时为 `'default'`\n\n在实践中，这种机制的用处有限，因为 `hint` 没有给你提供足够的信息。你真正想要的是另一个操作数的类型——请参见\
  \ 练习 1。\n\n#### 11.2.3 Species（种类）\n\n默认情况下，`Array` 方法 `map` 会产生与它接收到相同的集合：\n\n\
  点击此处查看图片\n\n```javascript\nclass MyArray extends Array {}\n\nlet myValues = new\
  \ MyArray(1, 2, 7, 9)\nmyValues.map(x => x * x) // 产生一个 MyArray\n```\n\n这并不总是合适的。假设我们有一个扩展\
  \ `Array` 的类 `Range`，用于描述一个整数范围。\n\n点击此处查看图片\n\n```javascript\nclass Range extends\
  \ Array {\n  constructor(start, end) {\n    super()\n    for (let i = 0; i < end\
  \ - start; i++)\n      this[i] = start + i\n  }\n}\n```\n\n范围的转换通常不是范围：\n\n点击此处查看图片\n\
  \n```javascript\nconst myRange = new Range(10, 99)\nmyRange.map(x => x * x) // 不应该是一个\
  \ Range\n```\n\n此类集合类可以通过 `Symbol.species` 属性的值来指定不同的构造函数：\n\n点击此处查看图片\n\n```javascript\n\
  class Range extends Array {\n  . . .\n  static get [Symbol.species]() { return Array\
  \ }\n}\n```\n\n该构造函数会被创建新数组的 `Array` 方法使用：`map`、`filter`、`flat`、`flatMap`、`subarray`、`slice`、`splice`\
  \ 和 `concat`。\n\n### 11.3 属性属性在本节及后续章节，我们将检查 `Object` 类的所有函数和方法，这些方法汇总在 表 11-2 中。\n\
  \n| 名称 | 描述 |\n| --- | --- |\n| **函数** | |\n| ```javascript defineProperty(obj,\
  \ name, descriptor) defineProperties(obj, { name1: descriptor1, . . . }) ``` | 定义一个或多个属性描述符\
  \ |\n| ```javascript getOwnPropertyDescriptor(obj, name) getOwnPropertyDescriptors(obj)\
  \ getOwnPropertyNames(obj) getOwnPropertySymbols(obj) ``` | 获取对象的一个或所有非继承描述符，或仅获取它们的字符串名称/符号\
  \ |\n| ```javascript keys(obj) values(obj) entries(obj) ``` | 获取自有可枚举属性的名称、值和 `[``name``,`\
  \ `value``]` 对 |\n| ```javascript preventExtensions(obj) seal(obj) freeze(obj) ```\
  \ | 禁止修改原型和添加属性；同时也禁止删除属性和配置；以及禁止修改属性 |\n| ```javascript isExtensible(obj) isSealed(obj)\
  \ isFrozen(obj) ``` | 检查 `obj` 是否被前一行中的某一个函数所保护 |\n| ```javascript create(prototype,\
  \ { name1: descriptor1, . . . }) fromEntries([[name1, value1], . . .]) ``` | 创建一个给定属性的新对象\
  \ |\n| ```javascript assign(target, source1, source2, . . .) ``` | 从源将所有可枚举自有属性拷贝到目标。请使用展开运算符代替。\
  \ |\n| ```javascript getPrototypeOf(obj) setPrototypeOf(obj, proto) ``` | 获取或设置原型\
  \ |\n| **方法** | |\n| ```javascript hasOwnProperty(stringOrSymbol) propertyIsEnumerable(stringOrSymbol)\
  \ ``` | 如果对象具有给定属性或它是可枚举的，则返回 `true` |\n| `isPrototypeOf(other)` | 检查此对象是否为另一个对象的原型\
  \ |\n\n**表 11-2** 对象函数和方法\n\n让我们仔细观察对象属性的操作。JavaScript 对象的每个属性都有三个*属性*：\n\n1.  `enumerable`:当为\
  \ `true` 时，该属性在 `for in` 循环中会被访问。\n2.  `writable`:当为 `true` 时，属性值可以被更新。\n3.  `configurable`:当为\
  \ `true` 时，属性可以被删除且其属性可以被修改。\n\n当你在对象面量或通过赋值设置属性时，所有三个属性都会被设置为 `true`。\n\n\n\n\n\
  ```javascript\n{ name:\n  {\n    value: 'James Bond',\n    writable: true,\n   \
  \ enumerable: true,\n    configurable: true\n  },\n  lastName: {\n    get: [Function:\
  \ get],\n    set: [Function: set],\n    enumerable: false,\n    configurable: false\n\
  \  }\n  .\n}\n```\n\n该函数命名为 `getOwnPropertyDescriptors`，因为它只产出对象自身定义的属性，而不产生从原型链中继承的属性。\n\
  \n![Images](img/tip.jpg) 提示\n\n`Object.getOwnPropertyDescriptors` 非常有用，可以用来“监视”对象，因为它列出了所有属性，包括那些不可枚举的属性——参阅练习\
  \ 9。\n\n如果你不想想要 `Object.getOwnPropertyDescriptors` 产生的海量信息，可以调用 `Object.getOwnPropertyNames(obj)`\
  \ 或 `Object.getOwnPropertySymbols(obj)` 来获取所有字符串值或符号值的属性键（无论是否可枚举），然后查找你感兴趣的属性描述符。\n\
  \n最后，还有 `Object.keys`、`Object.values` 和 `Object.entries` 函数，它们产出自身枚举属性的名称、值和 `[name,\
  \ value]` 对。这些与你在第 7 章中看到的 `Map` 类的 `keys`、`values` 和 `entries` 方法相似。然而，它们不是方法，且产出的是数组而不是迭代器。\n\
  \n点击此处查看代码图像\n\n```javascript\nconst obj = { name: 'Fred', age: 42 }\nObject.entries(obj)\
  \ // [['name', 'Fred'], ['age', 42]]\n```\n\n你可以通过这个循环来遍历属性：\n\n点击此处查看代码图像\n\n```javascript\n\
  for (let [key, value] of Object.entries(obj))\n  console.log(key, value)\n```\n\n\
  ### 11.5 测试单个属性\n\n以下条件\n\n```javascript\nstringOrSymbol in obj\n```\n\n检查属性是否存在于对象中或其原型链中。\n\
  \n为什么不简单地检查 `obj[stringOrSymbol] !== undefined` 呢？`in` 运算符对于值为 `undefined` 的属性会返回\
  \ `true`。给定对象：\n\n点击此处查看代码图像\n\n```javascript\nconst harry = { name: 'Harry', partner:\
  \ undefined }\n```\n\n条件 `'partner' in harry` 的结果为 `true`。\n\n有时你可能不想查找原型链。要检查一个对象本身是否具有给定名称的属性，请调用\n\
  \n点击此处查看代码图像\n\n```javascript\nobj.hasOwnProperty(stringOrSymbol)\n```\n\n要测试枚举属性是否存在，请调用\n\
  \n点击此处查看代码图像\n\n```javascript\nobj.propertyIsEnumerable(stringOrSymbol)\n```\n\n\
  注意，使用这些方法有一个潜在的缺点。对象可以重写这些方法并对其属性撒谎。在这方面，使用 `in` 运算符和如 `Object.getOwnPropertyDescriptior`\
  \ 等函数更安全。\n\n### 11.6 保护对象\n\n`Object` 类有三个函数，可以按不同程度保护对象：\n\n1. `Object.preventExtensions(obj)`：不能添加自身属性，且原型无法更改。\n\
  2. `Object.seal(obj)`：此外，属性不能被删除或重新配置。\n3. `Object.freeze(obj)`：此外，属性不能被设置。\n\n\
  这三个函数都返回被保护的对象。例如，你可以这样构造并冻结一个对象：\n\n点击此处查看代码图像\n\n```javascript\nconst frozen =\
  \ Object.freeze({ . . . })\n```\n\n注意，这些保护仅在严格模式下生效。\n\n即使是冻结也不会让对象完全不可变，因为属性值可能是可变的：\n\
  \n点击此处查看代码图像\n\n```javascript\nconst fred = Object.freeze({ name: 'Fred', luckyNumbers:\
  \ [17, 29] })\nfred.luckyNumbers[0] = 13 // OK—luckyNumbers 没有被冻结\n```\n\n如果你想要完全的不可变性，你需要递归地冻结所有依赖对象——参阅练习\
  \ 8。\n\n要检查对象是否已通过这些函数之一进行了保护，请调用 `Object.isExtensible(obj)`、`Object.isSealed(obj)`\
  \ 或 `Object.isFrozen(obj)`。\n\n### 11.7 创建或更新对象\n\n`Object.create` 函数让你对创建新对象拥有完全控制。指定原型以及所有属性的名称和描述符：\n\
  \n点击此处查看代码图像\n\n```javascript\nconst obj = Object.create(proto, propertiesWithDescriptors)\n\
  ```\n\n在这里，`propertiesWithDescriptors` 是一个对象，其键是属性名，值是描述符，如第 11.4 节，“第 11.4 节”所示。\n\
  \n最后，`Object.keys`、`Object.values` 和 `Object.entries` 函数产出自身枚举属性的名称、值和 `[name, value]`\
  \ 对。这些与你在第 7 章中看到的 `Map` 类的 `keys`、`values` 和 `entries` 方法相似。然而，它们不是方法，且产出的是数组而不是迭代器。\n\
  \n点击此处查看代码图像\n\n```javascript\nconst obj = { name: 'Fred', age: 42 }\nObject.entries(obj)\
  \ // [['name', 'Fred'], ['age', 42]]\n```\n\n你可以通过这个循环来遍历属性：\n\n点击此处查看代码图像\n\n```javascript\n\
  for (let [key, value] of Object.entries(obj))\n  console.log(key, value)\n```\n\n\
  ### 11.8 访问和更新原型\n\n正如你所知的，原型链是 JavaScript 中的一个核心概念。如果你使用 `class` 和 `extends` 关键字，原型链会自动建立。在本节中，你将学习如何手动管理它。\n\
  \n获取对象的原型（即内部 `[[Prototype]]` 槽的值），请调用：\n\n点击此处查看代码图像\n\n```javascript\nconst proto\
  \ = Object.getPrototypeOf(obj)\n```\n\n例如，当你有一个通过 `new` 运算符创建的类实例时：\n\n点击此处查看代码图像\n\
  \n```javascript\nconst obj = new ClassName(args)\n```\n\n那么 `Object.getPrototypeOf(obj)`\
  \ 就是 `ClassName.prototype`。但你可以通过调用以下方法设置任何对象的原型：\n\n点击此处查看代码图像\n\n```javascript\n\
  Object.setPrototypeOf(obj, proto)\n```\n\n我们在第 4 章引入 `new` 运算符之前简要提到过这一点。\n\n然而，更改现有对象的原型对于\
  \ JavaScript 虚拟机来说是一个缓慢的操作，因为它们推测地假设对象原型不会改变。如果你需要创建一个带有自定义原型的对象，最好使用第 11.7 节中的\
  \ `Object.create` 方法。\n\n如果 `proto` 在 `obj` 的原型链中，`proto.isPrototypeOf(obj)` 返回\
  \ `true`。除非你设置了特殊的原型，否则你可以使用 `instanceof` 运算符：`obj instanceof ClassName` 等同于 `ClassName.prototype.isPrototypeOf(obj)`。\n\
  \n注意：与其他所有原型对象不同，`Array.prototype` 实际上是一个数组！\n\n### 11.9 克隆对象\n\n作为前几节材料的应用，让我们开发一个可以对对象进行深拷贝或“克隆”的函数。\n\
  \n一种简单的方法利用展开运算符：\n\n```javascript\nconst cloned = { ...original } // 通常情况下不是真正的克隆\n\
  ```\n\n然而，这只复制了枚举属性。而且对原型未做任何处理。\n\n我们可以复制原型和所有属性：\n\n\n\n\n\n```javascript\nconst\
  \ cloned = Object.create(Object.getPrototypeOf(original),\n  Object.getOwnPropertyDescriptors(original))\
  \ // 更好，但仍然是浅拷贝\n```\n\n现在克隆对象与原始对象具有相同的原型和属性，所有的属性描述都被忠实地复制了。\n\n但拷贝仍然是浅的。可变的属性值没有被克隆。为了理解浅拷贝的问题，请考虑这个对象：\n\
  \n点击此处查看代码图片\n\n```javascript\nconst original = { radius: 10, center: { x: 20, y:\
  \ 30 } }\n```\n\n那么 `original.center` 和 `clone.center` 指向同一个对象，正如图 11-1 所示。修改 `original`\
  \ 也会修改 `clone`：\n\n点击此处查看代码图片\n\n```javascript\noriginal.center.x = 40 // clone.center.x\
  \ 也发生了改变\n```\n\n![Images](img/pg233_Image_646.jpg)\n\n**图 11-1** 浅拷贝\n\n解决办法是递归地克隆所有值：\n\
  \n点击此处查看代码图片\n\n```javascript\nconst clone = obj => {\n  if (typeof obj !== 'object'\
  \ || Object.isFrozen(obj)) return obj\n  const props = Object.getOwnPropertyDescriptors(obj)\n\
  \  let result = Object.create(Object.getPrototypeOf(obj), props)\n  for (const prop\
  \ in props)\n    result[prop] = clone(obj[prop])\n  return result\n}\n```\n\n然而，当存在循环引用时，这个版本会失效。\n\
  \n考虑两个互相彼此最好的朋友的人（见图 11-2）：\n\n点击此处查看代码图片\n\n```javascript\nconst fred = { name:\
  \ 'Fred' }\nconst barney = { name: 'Barney' }\nfred.bestFriend = barney\nbarney.bestFriend\
  \ = fred\n```\n\n![Images](img/pg234_Image_651.jpg)\n\n**图 11-2** 循环引用\n\n现在假设我们递归地克隆\
  \ `fred`。结果是一个新对象\n\n点击此处查看代码图片\n\n```javascript\ncloned = { name: 'Fred', bestFriend:\
  \ clone(barney) }\n```\n\n`clone(barney)` 做了什么？它创建了一个对象 `{ name: 'Barney', bestFriend:\
  \ clone(fred) }`。但这是不对的。我们陷入了无限递归。即使我们没有这样做，也会得到一个结构错误的对象。我们期望得到一个对象使得：\n\n点击此处查看代码图片\n\
  \n```javascript\ncloned.bestFriend === cloned\n```\n\n我们需要完善这个递归过程。如果一个对象已经被克隆，就不要再次克隆它。相反，使用指向现有克隆对象的引用。可以通过一个从原始对象到克隆对象的\
  \ map 来实现。当遇到之前未克隆的对象时，将原始对象和克隆对象的引用添加到 map 中。当对象已经克隆时，直接查找克隆对象。\n\n点击此处查看代码图片\n\
  \n```javascript\nconst clone = (obj, cloneRegistry = new Map()) => {\n  if (typeof\
  \ obj !== 'object' || Object.isFrozen(obj)) return obj\n  if (cloneRegistry.has(obj))\
  \ return cloneRegistry.get(obj)\n  const props = Object.getOwnPropertyDescriptors(obj)\n\
  \  let result = Object.create(Object.getPrototypeOf(obj), props)\n  cloneRegistry.set(obj,\
  \ result)\n  for (const prop in props)\n    result[prop] = clone(obj[prop], cloneRegistry)\n\
  \  return result\n}\n```\n\n这已经非常接近完美的 `clone` 函数了。然而，它对数组不起作用。调用 `clone([1, 2,\
  \ 3])` 会产生一个原型为 `Array.prototype` 的类数组对象。但是，它并不是数组，`Array.isArray` 返回 `false`。\n\
  \n解决办法是使用 `Array.from` 拷贝数组，而不是 `Object.create`。这里是最终版本：\n\n点击此处查看代码图片\n\n```javascript\n\
  const clone = (obj, cloneRegistry = new Map()) => {\n  if (typeof obj !== 'object'\
  \ || Object.isFrozen(obj)) return obj\n  if (cloneRegistry.has(obj)) return cloneRegistry.get(obj)\n\
  \  const props = Object.getOwnPropertyDescriptors(obj)\n  let result = Array.isArray(obj)\
  \ ? Array.from(obj) : Object.create(Object.getPrototypeOf(obj), props)\n  cloneRegistry.set(obj,\
  \ result)\n  for (const prop in props)\n    result[prop] = clone(obj[prop], cloneRegistry)\n\
  \  return result\n}\n```\n\n### 11.10 函数属性\n\n现在我们已经讨论了 `Object` 类的方法，让我们转向函数对象。每个作为\
  \ `Function` 类实例的函数都具有三个不可枚举的属性：\n\n- `name`：定义函数时的名称，或者对于匿名函数，赋值给该函数的变量名（见练习 14）\n\
  - `length`：参数的数量，不包括剩余参数（rest argument）\n- `prototype`：一个旨在填充原型属性的对象\n\n记住，在 JavaScript\
  \ 中，函数和构造函数之间没有区别。即使在严格模式下，每个函数都可以用 `new` 调用。因此，每个函数都有一个 `prototype` 对象。\n\n让我们更仔细地观察函数的\
  \ `prototype` 对象。它没有可枚举属性，并且有一个不可枚举的属性 `constructor`，它指向构造构造函数——见图 11-3。例如，假设我们定义了一个\
  \ `class Employee`。构造函数 `Employee` 像任何函数一样，有一个 `prototype` 属性，并且：\n\n点击此处查看代码图片\n\
  \n```javascript\nEmployee.prototype.constructor === Employee\n```\n\n任何对象都从原型继承\
  \ `constructor` 属性。因此，你可以这样获取对象的类名：\n\n```javascript\nobj.constructor.name\n```\n\
  \n![Images](img/pg235_Image_655.jpg)\n\n**图 11-3** 构造函数属性\n\n![Images](img/note.jpg)\
  \ 注意\n\n在构造函数内部，看起来很奇怪的表达式 `new.target` 结果为构造该对象的函数。你可以使用这个表达式来判断一个对象是否作为子类的实例构造的，这可能有某些用——见练习\
  \ 11。你也可以判断函数是否在没有 `new` 的情况下被调用。在这种情况下，`new.target === undefined`。\n\n### 11.11\
  \ 绑定参数和调用方法\n\n给定一个函数，`bind` 方法产生一个不同的函数，该函数锁定了初始参数：\n\n点击此处查看代码图片\n\n```javascript\n\
  const multiply = (x, y) => x * y\nconst triple = multiply.bind(null, 3)\ntriple(14)\
  \ //  42，或者 multiply(3, 14)\n```\n\n由于 `multiply` 的一个参数被 `bind` 方法锁定了，结果是一个只有一个参数的函数\
  \ `triple`。\n\n`bind` 方法的第一个参数是 `this` 参数的绑定。这是一个例子：\n\n点击此处查看代码图片\n\n```javascript\n\
  const isPet = Array.prototype.includes.bind(['cat', 'dog', 'fish'])\n```\n\n你可以用\
  \ `bind` 将方法转换为函数：\n\n点击此处查看代码图片\n\n```javascript\nbutton.onclick = this.handleClick.bind(this)\n\
  ```\n\n在这些情况下都不需要使用 `bind`。你可以定义一个显式函数：\n\n点击此处查看代码图片\n\n```javascript\nconst triple\
  \ = y => multiply(3, y)\nconst isPet = x => ['cat', 'dog', 'fish'].includes(x)\n\
  button.onclick = (...args) => this.handleClick(...args)\n```\n\n`call` 方法与 `bind`\
  \ 相似。然而，所有参数都是提供的，并且函数或方法被立即调用。例如：\n\n点击此处查看代码图片\n\n```javascript\nlet answer =\
  \ multiply.call(null, 6, 7)\nlet uppercased = String.prototype.toUpperCase.call('Hello')\n\
  ```\n\n当然，直接调用 `multiply(6, 7)` 或 `'Hello'.toUpperCase()` 会简单得多。\n\n然而，有一种情况直接调用函数是不起的。考虑这个例子：\n\
  \n点击此处查看代码图片\n\n```javascript\nconst spacedOut = Array.prototype.join.call('Hello',\
  \ ' ') // 'H e l l o'\n```\n\n我们不能调用\n\n```\n'Hello'.join(' ')\n```\n\n\n\n\n\n\
  ```javascript\n因为 `join` 不是 `String` 类的方法。它是 `Array` 类的一个方法，恰好可以处理字符串。\n\n最后，`apply`\
  \ 类似于 `call`，但除 `this` 以外的参数位于一个数组（或类数组对象）中：\n\n点击此处查看代码图像\n\n```javascript\nString.prototype.substring.apply('Hello',\
  \ [1, 4]) // 'ell'\n```\n\n如果你需要将存储在变量 `f` 中的任意函数应用到任意参数，使用表达式 `f(...args)` 比使用\
  \ `f.apply(null, args)` 更简单。但如果变量 `f` 持有一个方法，那么你就别无选择。你不能调用 `obj.f(...args)`，而必须使用\
  \ `f.apply(obj, args)`。\n\n![Images](img/note.jpg) 注意\n\n在 JavaScript 拥有 `super`\
  \ 关键字之前，你必须使用 `bind`、`call` 或 `apply` 来调用父类构造函数——参见练习 16。\n\n### 11.12 代理 (Proxies)\n\
  \n代理（proxy）是一个对用户而言看起来像对象的实体，但它会拦截属性访问、原型访问和方法调用。当这些操作被拦截时，可以执行任意工作。\n\n例如，一个 ORM（对象关系映射器）可能支持如下方法名：\n\
  \n点击此处查看代码图像\n\n```javascript\nconst result = orm.findEmployeeById(42)\n```\n\n\
  其中 `Employee` 匹配数据库表。但如果没有匹配的表，该方法将产生错误。\n\n在这里，`orm` 是一个代理对象，它拦截所有方法调用。当使用一个名为\
  \ `find...ById` 的方法进行调用时，拦截代码从方法名中提取表名并执行数据库查询。\n\n这是一个强大的概念，可以用于实现非常动态且强大的效果。示例包括：\n\
  \n*   自动对属性访问或变异进行日志记录\n*   控制属性访问，例如对敏感数据进行验证或保护\n*   动态属性，例如 DOM 元素或数据库列\n*  \
  \ 使远程调用看起来像本地调用一样\n\n要构造一个代理，需要提供两个对象：\n\n*   `target` 是我们想要控制的操作的对象。\n*   `handler`\
  \ 是一个带有陷阱函数（trap functions）的对象，这些函数在代理被操纵时会被调用。\n\n共有三个可能的陷阱函数，见表 11-3。\n\n让我们从一个简单的示例开始，我们对对象\
  \ `obj` 的属性读取和写入进行记录。在 handler 中，我们设置了两个陷阱函数。\n\n点击此处查看代码图像\n\n```javascript\nconst\
  \ obj = { name: 'Harry Smith', salary: 100000 }\nconst logHandler = {\n  get(target,\
  \ key, receiver) {\n    const result = target[key]\n    console.log(`get ${key.toString()}\
  \ as ${result}`)\n    return result\n  },\n  set(target, key, value, receiver) {\n\
  \    console.log(`set ${key.toString()} to ${value}`)\n    target[key] = value\n\
  \    return true\n  }\n}\nconst proxy = new Proxy(obj, logHandler)\n```\n\n在 `get`\
  \ 和 `set` 函数中，`target` 参数是代理的目标对象（这里是 `obj`）。`receiver` 是被访问属性的对象。即 `proxy` 对象，除非它在另一个对象的原型链链中。\n\
  \n现在，我们必须将代理（而不是原始对象）传递给任何我们想要监控的代码。\n\n假设有人更改了工资：\n\n```javascript\nproxy.salary\
  \ = 200000\n```\n\n然后会生成一条消息：\n\n```\nset salary to 200000\n```\n\n未被捕获的操作将传递给 target。在我们的示例中，调用\n\
  \n```javascript\ndelete proxy.salary\n```\n\n将从 target 中删除 `salary` 字段。\n\n| 名称\
  \ | 描述 |\n| --- | --- |\n| `get(target, key, receiver)` | `receiver[key]`, `receiver.key`\
  \ |\n| `set(target, key, value, receiver)` | `receiver[key] = value`, `receiver.key\
  \ = value` |\n| `deleteProperty(target, key)` | `delete proxy[key]`, `delete proxy.key`\
  \ |\n| `has(target, key)` | `key in target` |\n| `getPrototypeOf(target)` | `Object.getPrototypeOf(proxy)`\
  \ |\n| `setPrototypeOf(target, proto)` | `Object.setPrototypeOf(proxy, proto)` |\n\
  | `isExtensible(target)` | `Object.isExtensible(proxy)` |\n| `preventExtensions(target)`\
  \ | `Object.preventExtensions(proxy)` |\n| `getOwnPropertyDescriptor(target, key)`\
  \ | `Object.getOwnPropertyDescriptor(proxy, key)`, `Object.keys(proxy)` |\n| `ownKeys(target)`\
  \ | `Object.keys(proxy)`, `Object.getOwnProperty(`Names`|Symbols`)(proxy)` |\n|\
  \ `defineProperty(target, key, descriptor)` | `Object.defineProperty(proxy, key,\
  \ descriptor)` |\n| `apply(target, thisArg, args)` | `thisArg.proxy(...args)`, `proxy(...args)`\
  \ |\n| `construct(target, args, newTarget)` | `new proxy(...args)` |\n\n### 11.13\
  \ `Reflect` 类\n\n`Reflect` 类实现了表 11-3 中的十三个陷阱函数。你可以调用 `Reflect` 函数而不是手动实现操作：\n\n\
  点击此处查看代码图像\n\n```javascript\nconst logHandler = {\n  get(target, key, receiver)\
  \ {\n    const result = target[key]\n    console.log(`get ${key.toString()} as ${result}`)\n\
  \    return result\n  },\n  set(target, key, value, receiver) {\n    console.log(`set\
  \ ${key.toString()} to ${value}`)\n    target[key] = value\n    return true\n  }\n\
  }\n```\n\n如果你对默认行为满意，请参见练习 24 的示例。现在假设我们想记录*所有*可能的操作。注意，每个 handler 的代码看起来都相同，除了函数名外。与其编写许多相同的\
  \ handler 函数，你可以写一个拦截函数名的第二个代理：\n\n点击此处查看代码图像\n\n```javascript\nconst getHandler\
  \ = {\n  get(target, key, receiver) {\n    return (...args) => {\n      console.log(`Trapping\
  \ ${trapKey}`)\n      return ReflecttrapKey\n    }\n  }\n}\nconst logEverythingHandler\
  \ = new Proxy({}, getHandler)\nconst proxy = new Proxy(obj, logEverythingHandler)\n\
  ```\n\n为了理解发生了什么，让我们来看一个具体的场景。\n\n1.  代理用户设置一个属性：\n\n    ```javascript\n    proxy.name\
  \ = 'Fred'\n    ```\n\n2.  调用 `logEverythingHandler` 的相应方法：\n\n    点击此处查看代码图像\n\n\
  \    ```javascript\n    logEverythingHandler.set(obj, 'name', 'Fred', proxy)\n \
  \   ```\n\n3.  为了执行此调用，虚拟机必须定位 `logEverythingHandler` 的 `set` 方法。\n\n4.  由于 `logEverythingHandler`\
  \ 自身身是一个代理，该代理 handler 的 `get` 方法被调用：\n\n    点击此处查看代码图像\n\n    ```javascript\n \
  \   getHandler.get({}, 'set', logEverythingHandler)\n    ```\n\n5.  该调用返回一个函数\n\n\
  \    点击此处查看代码图像\n\n    ```javascript\n    (...args) => { console.log(`Trapping set`);\
  \ return Reflect.set(...args) }\n    ```\n\n\n\n\n作为 `logEverythingHandler.set`\
  \ 的值。\n\n6. 现在，第 2 步中启动的函数调用可以继续执行。该函数使用参数 `(obj, 'name', 'Fred', proxy)` 被调用。\n\
  \n7. 控制台打印了一条消息，随后是调用：\n\n点击此处查看代码图像\n\n```\nReflect.set(obj, 'name', 'Fred', proxy)\n\
  ```\n\n8. 此调用会导致 `obj.name` 被设置为 `'Fred'`。\n\n如果你想记录到陷阱函数（trap functions）的参数（包括目标和代理），必须非常小心以避免无限递归。实现这一点的一种方法是维护一个按名称打印已知对象的映射，而不是调用\
  \ `toString`，因为后者会触发额外的陷阱调用。\n\n点击此处查看代码图像\n\n```javascript\nconst knownObjects\
  \ = new WeakMap()\n\nconst stringify = x => {\n  if (knownObjects.has(x))\n    return\
  \ knownObjects.get(x)\n  else\n    return JSON.stringify(x)\n}\n\nconst logEverything\
  \ = (name, obj) => {\n  knownObjects.set(obj, name)\n  const getHandler = {\n  \
  \  get(target, trapKey, receiver) {\n      return (...args) => {\n        console.log(`Trapping\
  \ ${trapKey}(${args.map(stringify)})`)\n        return ReflecttrapKey;\n      }\n\
  \    }\n  }\n  const result = new Proxy(obj, new Proxy({}, getHandler))\n  knownObjects.set(result,\
  \ `proxy of ${name}`)\n  return result\n}\n```\n\n现在你可以调用：\n\n点击此处查看代码图像\n\n```javascript\n\
  const fred = { name: 'Fred' }\nconst proxyOfFred = logEverything('fred', fred)\n\
  proxyOfFred.age = 42\n```\n\n你将看到以下日志语句：\n\n点击此处查看代码图像\n\n```\nTrapping set(fred,age,42,proxy\
  \ of fred)\nTrapping getOwnPropertyDescriptor(fred,age)\nTrapping defineProperty(fred,\"\
  age\",{\"value\":42,\n  \"writable\":true,\"enumerable\":true,\"configurable\":true})\n\
  ```\n\n`Reflect` 类设计用于与代理配合使用，但它的三个方法单独使用时也很有用，因为它们比经典的对应方法更方便：\n\n1. `Reflect.deleteProperty`\
  \ 返回一个 `boolean` 值，告知删除是否成功。`delete` 运算符则不会。\n2. `Reflect.defineProperty` 返回一个 `boolean`\
  \ 表示定义是否成功。`Object.defineProperty` 在失败时会抛出异常。\n3. `Reflect.apply(f, thisArg, args)`\
  \ 保证调用 `Function.prototype.apply`，但 `f.apply(thisArg, args)` 可能不会，因为 `apply` 属性可以被重新定义。\n\
  \n### 11.14 代理不变性 (Proxy Invariants)\n\n当你实现代理操作时，虚拟机会检查这些操作是否产生了无意义的值。例如：\n\n*\
  \ `construct` 必须返回一个对象。\n* `getOwnPropertyDescriptor` 必须返回一个描述符对象或 `undefined`。\n\
  * `getPrototypeOf` 必须返回一个对象或 `null`。\n\n此外，虚拟机会对代理操作执行一致性检查。代理必须尊重其目标的某些方面，包括：\n\
  \n* 目标的不可写属性\n* 目标的不可配置属性\n* 不可扩展的目标对象\n\nECMAScript 规范描述了代理必须满足的“不变性”。例如，对代理的 `get`\
  \ 操作的描述包含了这一要求：“如果目标对象的属性是一个不可写、不可配置的自有数据属性，则（通过 `get` 报告的）该属性的值必须与相应目标对象属性的值相同。”\n\
  \n同样，如果目标属性是不可配置的，那么 `has` 就无法隐藏它。如果目标是不可扩展的，那么 `getPrototypeOf` 操作必须产生真实的原型，且 `has`\
  \ 和 `getOwnPropertyDescriptor` 必须报告真实的属性。\n\n当代理在不添加任何自身属性的情况下增强现有对象时，这些不变性是有意义的。遗憾的是，它们迫使我们对代理添加的属性进行“撒谎”。考虑一个存储范围值的类数组对象，例如\
  \ 10 到 99 之间的整数。没有必要存储这些值，我们可以动态计算它们。这正是代理所擅长的。这里有一个创建此类范围代理的函数：\n\n点击此处查看代码图像\n\
  \n```javascript\nconst createRange = (start, end) => {\n  const isIndex = key =>\n\
  \    typeof key === 'string' && /^[0-9]+$/.test(key) && parseInt(key) < end - start\n\
  \  return new Proxy({}, {\n    get: (target, key, receiver) => {\n      if (isIndex(key))\
  \ {\n        return start + parseInt(key)\n      } else {\n        return Reflect.get(target,\
  \ key, receiver)\n      }\n    }\n  })\n}\n```\n\n`get` 陷阱按需产生范围值：\n\n点击此处查看代码图像\n\
  \n```javascript\nconst range = createRange(10, 100)\nconsole.log(range[10]) // 20\n\
  ```\n\n然而，我们还无法对键进行迭代：\n\n点击此处查看代码图像\n\n```javascript\nconsole.log(Object.keys(range))\
  \ // []\n```\n\n这并不意外。我们首先需要定义 `ownKeys` 陷阱：\n\n点击此处查看代码图像\n\n```javascript\nownKeys:\
  \ target => {\n  const result = Reflect.ownKeys(target)\n  for (let i = 0; i < end\
  \ - start; i++)\n    result.push(String(i))\n  return result\n}\n```\n\n遗憾的是，即使在处理器中添加了\
  \ `ownKeys` 陷阱，`Object.keys(range)` 仍然返回空数组。\n\n为了修复这个问题，我们需要为索引属性提供属性描述符：\n\n点击此处查看代码图像\n\
  \n```javascript\ngetOwnPropertyDescriptor: (target, key) => {\n  if (isIndex(key))\
  \ {\n    return {\n      value: start + Number(key),\n      writable: false,\n \
  \     enumerable: true,\n      configurable: true // 这并不是我们真正想要的\n      }\n  } else\
  \ {\n    return Reflect.getOwnPropertyDescriptor(target, key)\n  }\n}\n```\n\n\n\
  \n现在 `Object.keys` 返回一个包含从 `'10'` 到 `'99'` 的数组。然而，这里有一个美中：索引属性必须是可配置的（configurable）。否则，就会触发不变性规则。你无法报告一个目标对象中原本不存在的不可配置属性。（我们的目标是一个空对象）。我们实际上并不希望索引属性是可配置的，但我们无能为力。如果我们想禁止删除或重新配置索引属性，则需要提供额外的拦截器（traps）——参见练习\
  \ 27。\n\n如你所见，在代理（proxies）中实现动态属性并非一项容易的事。尽可能地将属性设置在代理目标对象（target）中。例如，范围代理应该拥有一个\
  \ `length` 属性和一个 `toString` 方法。只需将这些属性添加到目标对象，而不要在拦截器中处理它们即可——参见练习 28。\n\n### 练习\n\
