  \ 本章主题\n\n- 12.1 可迭代值\n- 12.2 实现可迭代对象\n- 12.3 可关闭的迭代器\n- 12.4 生成器\n- 12.5 嵌套 yield\n\
  - 12.6 作为消费者的生成器\n- 12.7 生成器与异步处理\n- 12.8 异步生成器与迭代器\n- 12.9 练习\n\n在本章中，你将学习实现用于\
  \ `for of` 循环和数组展开的迭代器。你将在自己的代码中使用迭代器。\n\n实现迭代器可能有点麻烦，但生成器极大简化了任务。生成器是一个可以产生多个值的函数，在产生每个值后挂起并在请求下一个值时恢复。生成器也是无回调异步编程的构建块。\n\
  \n本章内容属于高级。\n\n### 12.1 可迭代值\n\nJavaScript 中可迭代值最重要的用法是 `for of` 循环。例如，数组是可迭代的。循环\n\
  \n```javascript\nfor (const element of [1, 2, 7, 9])\n```\n\n遍历给定数组的元素。字符串也是可迭代的，循环\n\
  \n```javascript\nfor (const ch of 'Hello')\n```\n\n遍历给定字符串的代码点。\n\n以下值是可迭代的：\n\n\
  - 数组和字符串\n- Set 和 map\n- 数组、类型数组、set 和 map 的 `keys`、`values` 和 `entries` 方法返回的对象（但不包括\
  \ `Object`）\n- DOM 数据结构，例如 `document.querySelectorAll('div')` 返回的对象\n\n通常，如果一个值具有键为\
  \ `Symbol.iterator` 的方法且该方法产生迭代器对象，则它是可迭代的：\n\n点击此处查看代码图像\n\n```javascript\nconst\
  \ helloIter = 'Hello'[Symbol.iterator]()\n```\n\n迭代器对象有一个 `next` 方法，返回一个包含下一个值和迭代是否结束指示的对象：\n\
  \n点击此处查看代码图像\n\n```javascript\nhelloIter.next() // 返回 { value: 'H', done: false\
  \ }\n\nhelloIter.next() // 返回 { value: 'e', done: false }\n\n. . .\n\nhelloIter.next()\
  \ // 返回 { value: 'o', done: false }\n\nhelloIter.next() // 返回 { value: undefined,\
  \ done: true }\n```\n\n在循环中\n\n```javascript\nfor (const v of iterable)\n```\n\n\
  \n\n\n通过调用 `iterable[Symbol.iterator]()` 获取迭代器对象。该对象的 `next` 方法在每次循环迭代中都会被调用。每次调用，它都会产生一个对象\
  \ `{ value: . . ., done: . . . }`。只要 `done` 为 `false`，变量 `v` 就会被设置为对象的 `value` 属性。一旦\
  \ `done` 为 `true`，`for of` 循环就会退出。\n\n以下是 JavaScript 中可迭代对象（iterables）使用的场景列表：\n\
  \n- 如前所述，在循环 `for (const v of iterable)` 中\n- 在数组展开中：`[...iterable]`\n- 在数组解构中：`[first,\
  \ second, third] = iterable`\n- 使用函数 `Array.from(iterable)`\n- 使用 set 和 map 构造函数：`new\
  \ Set(iterable)`\n- 使用在在本章稍后将看到的 `yield*` 指令\n- 在任何程序员利用调用 `iterable[Symbol.iterable]()`\
  \ 返回的函数所构建的迭代器的地方\n\n### 12.2 实现可迭代对象\n\n在本节中，你将看到如何创建可以出现在 `for of` 循环、数组展开等处的可迭代对象。\n\
  \n最好的方法先通过一个具体的示例。让我们来实现一个可迭代的 `Range` 类，它的迭代器产生两个给定边界之间的值。\n\n点击此处查看代码图像\n\n```javascript\n\
  class Range {\n  constructor(start, end) {\n    this.start = start\n    this.end\
  \ = end\n  }\n  . . .\n}\n```\n\n如果我们有一个 `Range` 实例，它应该可以在 `for of` 循环中运行：\n\n点击此处查看代码图像\n\
  \n```javascript\nfor (const element of new Range(10, 20))\n  console.log(element)\
  \ // 打印 10 11 . . . 19\n```\n\n可迭代对象必须有一个名为 `Symbol.iterator` 的方法。由于该方法名不是字符串，它被括在括号中：\n\
  \n点击此处查看代码图像\n\n```javascript\nclass Range {\n  . . .\n  [Symbol.iterator]() { .\
  \ . . }\n}\n```\n\n该方法返回一个带有 `next` 方法的对象。我们定义了第二个类来产生这些对象。\n\n点击此处查看代码图像\n\n```javascript\n\
  class RangeIterator {\n  constructor(current, last) {\n    this.current = current\n\
  \    this.last = last\n  }\n  next() { . . . }\n}\n\nclass Range {\n  . . .\n  [Symbol.iterator]()\
  \ { return new RangeIterator(this.start, this.end) }\n}\n```\n\n`next` 方法返回形式为 `{\
  \ value: . . ., done: . . . }` 的对象，如下：\n\n点击此处查看代码图像\n\n```javascript\nnext() {\n\
  \  . . .\n  if (. . .) {\n    return { value: some value, done: false }\n  } else\
  \ {\n    return { value: undefined, done: true }\n  }\n}\n```\n\n如果你愿意，可以省略 `done:\
  \ false` 和 `value: undefined`。\n\n在我们示例中：\n\n点击此处查看代码图像\n\n```javascript\nclass\
  \ RangeIterator {\n  . . .\n  next() {\n    if (this.current < this.last) {\n  \
  \    const result = { value: this.current }\n      this.current++\n      return\
  \ result\n    } else {\n      return { done: true }\n    }\n  }\n}\n```\n\n通过显式地定义两个类，变得显而易见的是`Symbol.iterator`\
  \ 方法产生一个带有 `next` 方法的不同类的实例。\n\n或者，你可以动态创建迭代器对象：\n\n点击此处查看代码图像\n\n```javascript\n\
  class Range {\n  constructor(start, end) {\n    this.start = start\n    this.end\
  \ = end\n  }\n  [Symbol.iterator]() {\n    let current = this.start\n    let last\
  \ = this.end\n    return {\n      next() {\n        if (current < last) {\n    \
  \      const result = { value: current }\n          current++\n          return\
  \ result\n        } else {\n          return { done: true }\n        }\n      }\n\
  \    }\n  }\n}\n```\n\n`Symbol.iterator` 方法产生一个带有 `next` 方法的对象，该对象产生 `{ value: current\
  \ }` 和 `{ done: true }` 对象。\n\n这种方式更紧凑，但可能没有那么易读。\n\n### 12.3 可关闭的迭代器\n\n如果一个迭代器对象有一个名为\
