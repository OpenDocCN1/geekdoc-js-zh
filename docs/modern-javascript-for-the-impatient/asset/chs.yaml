  \ 和 `y`）的比较函数。如果 `x` 应该在 `y` 之前，该函数返回负整数；如果 `x` 和 `y` 不区分，则返回零；如果 `x` 应该在 `y` 之后，则返回正整数。使用箭头函数编写调用，来排序：\n\
  \n    * 按降序排列正整数数组\n    * 按年龄升序排列人员数组\n    * 按长度升序排列字符串数组\n\n5. 使用第 3.7 节“硬对象](#ch03.xhtml_ch03lev1sec7)”（第\
