  \ 1。）\n\n    点击此处查看代码图片\n\n    ```javascript\n    const myFirstCounter = constructCounter(0,\
  \ 2)\n    console.log(myFirstCounter.count()) // 0\n    console.log(myFirstCounter.count())\
  \ // 2\n    ```\n\n6. 一位程序员认为“命名参数在 JavaScript 中几乎已经实现，但顺序仍然具有优先级”，并在浏览器控制台中给出了以下“证据”：\n\
  \n    点击此处查看代码图片\n\n    ```javascript\n    function f(a=1, b=2){ console.log(`a=${a},\
  \ b=${b}`) }\n    f() // a=1, b=2\n    f(a=5) // a=5, b=2\n    f(a=7, b=10) // a=7,\
  \ b=10\n    f(b=10, a=7) // 需要顺序：a=10, b=7\n    ```\n\n    实际上发生了什么？（提示：这与命名参数无关。尝试在严格模式下运行。）\n\
  \n7. 编写一个函数 `average`，使用剩余参数（rest parameter）计算任意数字序列的平均值。\n\n8. 将字符串参数传递给剩余参数 `...str`\
  \ 时会发生什么？想出一个实用的例子来利用你的观察。\n\n9. 完成第 3.13 节“用解构模拟命名参数](#ch03.xhtml_ch03lev1sec13)”（第\
  \ 66 页）中的 `mkString` 函数。\n\n10. 古老的 `var` 关键字与闭包的交互并不良好。考虑这个例子：\n\n    点击此处查看代码图片\n\
  \n    ```javascript\n    for (var i = 0; i < 10; i++) {\n      setTimeout(() =>\
  \ console.log(i), 1000 * i)\n    }\n    ```\n\n    这段代码打印了什么？为什么？（提示：变量 `i` 的作用域是什么？）你可以对代码做什么简单的修改来打印数字\
  \ 0 到 9？\n\n11. 考虑这个 `fac` 的声明：\n\n    点击此处查看代码图片\n\n    ```javascript\n    const\
  \ fac = n > 1 ? n * fac(n - 1) : 1\n    ```\n\n    为什么这是有效的？\n\n12. 在松散（非严格模式）下，函数可以在块中声明，它们会被提升。尝试一下以下代码：\n\
  \n    点击此处查看代码图片\n\n    ```javascript\n    if (Math.random() < 0.5) {\n      say('Hello')\n\
  \      function say(greeting) { console.log(`${greeting}`) }\n    }\n    say('Goodbye')\n\
  \    ```\n\n    结果是什么？`say` 的作用域是什么？\n\n13. 实现一个 `average` 函数，如果任何参数不是数字，则抛出异常。\n\
  \n14. 有程序员对 `try`/`catch`/`finally` 感到困惑，因为有太多路径。展示如何使用这三者。\n\n## 第 4 章 面对象编程\n\n\
  ![Images](img/Images.jpg)\n\n### 本内容\n\n- 1. 方法\n- 2. 原型\n- 3. 构造函数\n- 4. 类语法\n\
  - 5. Getter 和 Setter\n- 6. 实例字段与私有方法\n- 7. 静态方法与字段\n- 8. 子类\n- 9. 重写方法\n- 10. 子类构造\n\
  - 11. 类表达式\n- 12. `this` 引用\n- 13. 练习题\n\n众所周知，JavaScript 拥有对象，但它们看起来不像你在面向对象编程语言中看到的对象。在\
  \ JavaScript 对象中，所有属性都是公开的，并且它们似乎属于 `Object` 之外的任何类。并不清楚如何拥有方法、类或继承。\n\n你可以在 JavaScript\
  \ 中*可以*拥有所有这些，本章将向你展示如何实现。\n\n### 4.1 方法\n\nJavaScript 与大多数面向对象编程语言不同，它让你无需预先声明类就可以操作对象。你已经看到过如何产生对象：\n\
  \n点击此处查看代码图片\n\n```javascript\nlet harry = { name: 'Harry Smith', salary: 90000\
  \ }\n```\n\n\n\n\n```\nharry = {\n  name: 'Harry Smith',\n  salary: 90000,\n  raiseSalary:\
  \ function(percent) {\n    this.salary *= 1 + percent / 100\n  }\n}\n```\n\n现在我们可以使用熟悉的点符号法来增加员工的工资：\n\
  \n```\nharry.raiseSalary(10)\n```\n\n注意，`raiseSalary` 是在 `harry` 对象中声明的函数。该函数看起来像一个普通函数，但有一个不同之处：在函数体内，我们引用了\
  \ `this.salary`。当函数被调用时，`this` 指向点操作符左侧的对象。\n\n声明方法有一种简写语法。只需省略冒号和 `function` 关键字即可：\n\
  \n点击此处查看代码图片\n\n```\nharry = {\n  name: 'Harry Smith',\n  salary: 90000,\n  raiseSalary(percent)\
  \ {\n    this.salary *= 1 + percent / 100\n  }\n}\n```\n\n这看起来类似于 Java 或 C++ 中的方法声明，但它只是函数值属性属性的“语法糖”。\n\
  \n![Images](img/caution.jpg) 注意\n\n`this` 引用仅在用 `function` 声明的函数或省略 `function` 的简写语法中有效，*不适用于*箭头函数。更多细节请参阅第\
  \ 4.12 节，“`this` 引用](#ch04.xhtml_ch04lev1sec12)”（第 92 页）。\n\n### 4.2 原型 (Prototypes)\n\
  \n假设你有许多与前一节类似的员工对象。那么你需要为每个对象创建一个 `raiseSalary` 属性。你可以编写一个工厂函数来自动化该任务：\n\n点击此处查看代码图片\n\
  \n```\nfunction createEmployee(name, salary) {\n  return {\n    name: name,\n  \
  \  salary: salary,\n    raiseSalary: function(percent) {\n      this.salary *= 1\
  \ + percent / 100\n    }\n  }\n}\n```\n\n尽管如此，每个员工对象都有自己的 `raiseSalary` 属性，尽管属性值对所有员工都是同一个函数（参见图\
  \ 4-1）。如果所有员工能够共享一个函数，将会更好。\n\n![Images](img/pg79_Image_235.jpg)\n\n**图 4-1**  \
  \   具有重复方法的对象\n\n这就是*原型*派用用场。原型收集了多个对象共有的属性。这里有一个持有共享方法的原型对象：\n\n点击此处查看代码图片\n\n\
  ```\nconst employeePrototype = {\n  raiseSalary: function(percent) {\n    this.salary\
  \ *= 1 + percent / 100\n  }\n}\n```\n\n在创建员工对象时，我们设置了它的原型。原型是对象的“内部槽位”（internal\
  \ slot）。这是 ECMAScript 语言规范中使用的术语，用于表示一种在内部被处理而不作为属性暴露给 JavaScript 程序员的对象属性。你可以使用\
  \ `Object.getPrototypeOf` 和 `Object.setPrototypeOf` 方法来读写 [[Property]] 内部槽位（规范规范中的称呼）。此函数创建一个员工对象并设置其原型：\n\
  \n点击此处查看代码图片\n\n```\nfunction createEmployee(name, salary) {\n  const result = {\
  \ name, salary }\n  Object.setPrototypeOf(result, employeePrototype)\n  return result\n\
  }\n```\n\n图 4-2 显示了创建多个共享相同原型的员工对象的结果。在图中，原型槽位表示为 [[Prototype]]，正如 ECMAScript 规范中所示。\n\
  \n![Images](img/pg80_Image_238.jpg)\n\n**图 4-2**     具有相同原型的对象\n\n![Images](img/caution.jpg)\
  \ 注意\n\n在许多 JavaScript 实现中，你可以通过 `obj.__proto__` 访问对象的原型。这并不是标准符号，你应该使用 `Object.getPrototypeOf`\
  \ 和 `Object.setPrototypeOf` 方法。\n\n现在考虑一个方法调用：\n\n```\nharry.raiseSalary(5)\n```\n\
  \n在查找 `harry.raiseSalary` 时，`harry` 对象本身没有找到匹配项。因此，在原型中搜索属性。由于 `harry.`[[Prototype]]\
  \ 拥有 `raiseSalary` 属性，它的值就是 `harry.raiseSalary` 的值。\n\n正如你在本章后面部分看到的，原型是可以链的。如果原型没有某个属性，则会查找它的原型，直到原型链结束。\n\
  \n原型查找机制是完全通用的。在这里，我们用它来查找方法，但它适用于任何属性。如果从对象中没有找到属性，则会搜索原型链，第一个匹配项即为属性值。\n\n原型查找是一个简单的概念，但在\
  \ JavaScript 中非常重要。原型用于实现类和继承，并在对象实例化后修改它们的行为。\n\n![Images](img/caution.jpg) 注意\n\
  \n`this` 引用仅在用 `function` 声明的函数或省略 `function` 的简写语法中有效，*不适用于*箭头函数。更多细节请参阅第 4.12\
  \ 节，“`this` 引用](#ch04.xhtml_ch04lev1sec12)”（第 92 页）。\n\n### 4.3 构造函数 (Constructors)\n\
  \n假设你有许多与前一节类似的员工对象。那么你需要为每个对象创建一个 `raiseSalary` 属性。你可以编写一个工厂函数来自动化该任务：\n\n```\n\
  function createEmployee(name, salary) {\n  return {\n    name: name,\n    salary:\
  \ salary,\n    raiseSalary: function(percent) {\n      this.salary *= 1 + percent\
  \ / 100\n    }\n  }\n}\n```\n\n尽管如此，每个员工对象都有自己的 `raiseSalary` 属性，尽管属性值对所有员工都是同一个函数（参见图\
  \ 4-1）。如果所有员工能够共享一个函数，将会更好。\n\n![Images](img/pg79_Image_235.jpg)\n\n**图 4-1**  \
  \   具有重复方法的对象\n\n这就是*原型*派用用场。原型收集了多个对象共有的属性。这里有一个持有共享方法的原型对象：\n\n点击此处查看代码图片\n\n\
  ```\nconst employeePrototype = {\n  raiseSalary: function(percent) {\n    this.salary\
  \ *= 1 + percent / 100\n  }\n}\n```\n\n在创建员工对象时，我们设置了它的原型。原型是对象的“内部槽位”。这是 ECMAScript\
  \ 语言规范中使用的术语，用于表示一种在内部被处理而不作为属性暴露给 JavaScript 程序员的对象属性。你可以使用 `Object.getPrototypeOf`\
  \ 和 `Object.setPrototypeOf` 方法来读写 [[Property]] 内部槽位（规范中的称呼）。此函数创建一个员工对象并设置其原型：\n\
  \n点击此处查看代码图片\n\n```\nfunction createEmployee(name, salary) {\n  const result = {\
  \ name, salary }\n  Object.setPrototypeOf(result, employeePrototype)\n  return result\n\
  }\n```\n\n图 4-2 显示了创建多个共享相同原型的员工对象的结果。在图中，原型槽位表示为 [[Prototype]]，正如 ECMAScript 规范中所示。\n\
  \n![Images](img/pg80_Image_238.jpg)\n\n**图 4-2**     具有相同原型的对象\n\n![Images](img/caution.jpg)\
  \ 注意\n\n在许多 JavaScript 实现中，你可以通过 `obj.__proto__` 访问对象的原型。这并不是标准符号，你应该使用 `Object.getPrototypeOf`\
  \ 和 `Object.setPrototypeOf` 方法。\n\n现在考虑一个方法调用：\n\n```\nharry.raiseSalary(5)\n```\n\
  \n在查找 `harry.raiseSalary` 时，`harry` 对象本身没有找到匹配项。因此，在原型中搜索属性。由于 `harry.`[[Prototype]]\
  \ 拥有 `raiseSalary` 属性，它的值就是 `harry.raiseSalary` 的值。\n\n正如你在本章后面部分看到的，原型是可以链的。如果原型没有某个属性，则会查找它的原型，直到原型链结束。\n\
  \n原型查找机制是完全通用的。在这里，我们用它来查找方法，但它适用于任何属性。如果从对象中没有找到属性，则会搜索原型链，第一个匹配项即为属性值。\n\n原型查找是一个简单的概念，但在\
  \ JavaScript 中非常重要。原型用于实现类和继承，并在对象实例化后修改它们的行为。\n\n![Images](img/caution.jpg) 注意\n\
  \n`this` 引用仅在用 `function` 声明的函数或省略 `function` 的简写语法中有效，*不适用于*箭头函数。更多细节请参阅第 4.12\
  \ 节，“`this` 引用](#ch04.xhtml_ch04lev1sec12)”（第 92 页）。\n\n\n\n\n\n正如你在图 4-3 中所示，`Employee.prototype`\
  \ 对象的原型是 `Object.prototype` 对象，它提供了 `toString` 方法以及其他一些方法。\n\n所有这些魔法的结果是，`new` 运算符看起来就像在\
  \ Java、`C#` 或 `C++` 中的构造函数调用。然而，`Employee` 并不是一个类。它只是一个函数。\n\n话虽如此，什么是类呢？在教科书定义中，类是一组具有相同行为（由方法提供）的对象。通过\
  \ `new Employee(. . .)` 获取的所有对象都具有相同的方法集。在 JavaScript 中，构造函数等同于基于类的编程语言中的类。\n\n\
  你可能不需要经常担心传统类与 JavaScript 基于原型的系统之间的区别。正如你将在下一节看到的，现代 JavaScript 语法紧密遵循基于类的语言的约定。然而，每隔一段时间，你都应该提醒自己：JavaScript\
  \ 的 `class` 不仅仅是一个构造函数，而共同行为是通过原型实现的。\n\n### 4.4 类语法\n\n如今，JavaScript 拥有一种类语法，它以熟悉的格式将构造函数和原型方法封装在一起。以下是上一节示例的类语法：\n\
  \n点击此处查看代码图像\n\n```javascript\nclass Employee {\n\n  constructor(name, salary) {\n\
  \    this.name = name\n    this.salary = salary\n  }\n\n  raiseSalary(percent) {\n\
  \    this.salary *= 1 + percent / 100\n  }\n}\n```\n\n这种语法的执行效果与上一节`完全`相同。它仍然没有实际的类。在背后，`class`\
  \ 声明仅仅声明了一个构造函数 `Employee`。`constructor` 关键字声明了 `Employee` 构造函数的体。`raiseSalary`\
  \ 方法被添加到了 `Employee.prototype` 上。\n\n与上一节一样，你通过使用 `new` 运算符调用构造函数来构造对象：\n\n点击此处查看代码图像\n\
  \n```javascript\nconst harry = new Employee('Harry Smith', 90000)\n```\n\n![Images](img/note.jpg)\
  \ Note\n\n正如前面的章节提到的，`constructor` 不应该返回任何值。然而，如果它返回了值，它会被忽略，且 `new` 表达式仍然返回新创建的对象。\n\
  \n你应该绝对使用 `class` 语法。（这是前言中的黄金法则 #4。）这种语法正确处理了许多你不想手动管理的琐碎细节。只需意识到 JavaScript 的\
  \ `class` 只是构造函数以及一个持有方法的原型对象的语法糖即可。\n\n![Images](img/note.jpg) Note\n\n一个类最多有一个\
  \ `constructor`。\n\n如果你在声明类时没有写 `constructor`，它会自动获得一个体为空的构造函数。\n\n![Images](img/caution.jpg)\
  \ Caution\n\n与对象字面量不同，在 `class` 声明中，你不需要用逗号来分隔方法的声明。\n\n![Images](img/note.jpg)\
  \ Note\n\n类与函数不同，类不会被提升（hoisted）。你需要在实例化之前声明类。\n\n![Images](img/note.jpg) Note\n\
  \n类的体在严格模式下执行。\n\n### 4.5 Getter 和 Setter\n\n![Images](img/queen.jpg)\n\n`getter`（访问器）是一个没有参数且使用\
  \ `get` 关键字声明的方法：\n\n点击此处查看代码图像\n\n```javascript\nclass Person {\n  constructor(last,\
  \ first) {\n    this.last = last;\n    this.first = first\n  }\n  get fullName()\
  \ { return \\`${this.last}, \\${this.first}\\`; }\n}\n```\n\n你不需要带括号就可以调用 getter，就好像访问属性值一样：\n\
  \n点击此处查看代码图像\n\n```javascript\nconst harry = new Person('Smith', 'Harry')\nconst\
  \ harrysName = harry.fullName // 'Smith, Harry'\n```\n\n`harry` 对象并没有 `fullName`\
  \ 属性，但 getter 方法被调用了。你可以认为 getter 为一个动态计算的属性。\n\n你还可以提供一个 `setter`（赋值器），即带有一个参数的方法：\n\
  \n点击此处查看代码图像\n\n```javascript\nclass Person {\n  . . .\n  set fullName(value) {\n\
  \    const parts = value.split(/,\\s*/)\n    this.last = parts[0]\n    this.first\
  \ = parts[1]\n  }\n}\n```\n\n当给 `fullName` 赋值时，setter 会被调用：\n\n```javascript\nharry.fullName\
  \ = 'Smith, Harold'\n```\n\n当你提供 getters 和 setters 时，你类的用户会有在使用属性的错觉，但你控制了属性值以及任何修改这些值的尝试。\n\
  \n### 4.6 实例字段和私有方法\n\n![Images](img/queen.jpg)\n\n你可以在构造函数或任何方法通过给 `this.propertyName`\
  \ 赋值来动态设置对象属性。这些属性的工作方式与基于类的语言中的实例字段相同。\n\n点击此处查看代码图像\n\n```javascript\nclass BankAccount\
  \ {\n  constructor() { this.balance = 0 }\n  deposit(amount) { this.balance += amount\
  \ }\n}\n```\n\n2020 年初，静态字段的类语法处于第 3 阶段：\n\n```javascript\nclass BankAccount {\n\
  \  static OVERDRAFT_FEE = 30\n  . . .\n  withdraw(amount) {\n    if (this.balance\
  \ < amount) {\n      this.balance -= BankAccount.OVERDRAFT_FEE\n    }\n\n    . .\
  \ .\n  }\n}\n```\n\n如果字段名称以 `#` 开头，则该字段是私有的（`private`）。\n\n```javascript\nclass\
  \ BankAccount {\n  #balance = 0\n  deposit(amount) { this.#balance += amount }\n\
  \  . . .\n}\n```\n\n\n\n\n\n面向对象编程中的一个核心概念是继承。类为它的实例指定了行为。你可以为一个给定的类（称为父类）创建一个子类，子类的实例在某些方面的行为与众不同，同时从父类中继承其他行为。\n\
  \n一个标准的教学示例是继承层次结构，其中包含父类 `Employee`（员工）和一个子类 `Manager`（经理）。员工被预期在领取薪水的同时完成其分配的任务，而经理如果确实完成了他们应该做的工作，则可以在基本工资的基础上获得奖金。\n\
  \n在 JavaScript 中，与 Java 一样，你使用 `extends` 关键字来表示 `Employee` 和 `Manager` 类之间的这种关系：\n\
  \n点击此处查看代码图像\n\n```javascript\nclass Employee {\n\n  constructor(name, salary) {\
  \ . . . }\n\n  raiseSalary(percent) { . . . }\n\n  . . .\n\n}\n\nclass Manager extends\
  \ Employee {\n\n  getSalary() { return this.salary + this.bonus }\n\n  . . .\n\n\
  }\n```\n\n在后台，建立了一个原型链——参见图 4-4。`Manager.prototype` 的原型被设置为 `Employee.prototype`。这样，任何未在子类中声明的方法都将在父类中查找。\n\
  \n![Images](img/pg88_Image_260.jpg)\n\n**图 4-4** 用于继承的原型链\n\n例如，你可以对一个经理对象调用 `raiseSalary`：\n\
  \n点击此处查看代码图像\n\n```javascript\nconst boss = new Manager(. . .)\n\nboss.raiseSalary(10)\
  \ // 调用 Employee.prototype.raiseSalary\n```\n\n在 `extends` 语法出现之前，JavaScript 程序员必须自己建立这样的原型链。\n\
  \n`instanceof` 运算符用于检查对象是否属于某个类或其一个子类。从技术上讲，该运算符会访问对象的原型链，并检查它是否包含给定构造函数的原型。例如，\n\
  \n```javascript\nboss instanceof Employee\n```\n\n结果为 `true`，因为 `Employee.prototype`\
  \ 在 `boss` 的原型链中。\n\n![Images](img/note.jpg) Note\n\n在 Java 中， `extends` 关键字用于扩展一个固定类。在\
  \ JavaScript 中，`extends` 更加动态。`extends` 的右侧可以是任何产生函数的表达式（或为 `null` 以产生一个不继承 `Object`\
  \ 的类）。第 4.11 节 “类表达式”（第 91 页 Note\n\n在 Java 和 C++ 中，通常定义抽象父类或接口，以便你可以调用将在子类中定义的方法。在\
  \ JavaScript 中，对方法的应用没有编译时，因此不需要抽象方法。\n\n例如，假设你模拟了员工和承包商，并需要从这两个类的对象获取薪水。在静态类型语言中，你会引入一个带有抽象\
  \ `getSalary` 方法的 `Salaried` 父类或接口。在 JavaScript 中，你只需调用 `person.getSalary()`。\n\n\
  ### 4.9 方法重写\n\n假设父类和子类都有 `getSalary` 方法：\n\n点击此处查看代码图像\n\n```javascript\nclass\
  \ Employee {\n\n  . . .\n\n  getSalary() { return this.salary }\n}\n\nclass Manager\
  \ extends Employee {\n\n  . . .\n\n  getSalary() { return this.salary + this.bonus\
  \ }\n}\n```\n\n现在考虑一个方法调用：\n\n点击此处查看代码图像\n\n```javascript\nconst empl = . . .\n\n\
  const salary = empl.getSalary()\n```\n\n如果 `empl` 是一个普通员工的引用，则会调用 `Employee.prototype.getSalary`\
  \ 方法。另一方面，如果 `empl` 指向一个经理，则调用 `Manager.prototype.getSalary` 方法。这种现象——被调用的方法取决于所引用的实际对象——被称为“多态”（polymorphism）。在\
  \ JavaScript 中，多态是原型链查找的简单结果。\n\n在这种情况下，我们说 `Manager` 类中的 `getSalary` 方法**重写**了\
  \ `Employee` 类的 `getSalary` 方法。\n\n有时，你想从子类调用父类方法。例如：\n\n点击此处查看代码图像\n\n```javascript\n\
  class Manager extends Employee {\n\n  . . .\n\n  getSalary() { return super.getSalary()\
  \ + this.bonus }\n}\n```\n\n在方法中，`super` 会从声明该方法的原型对象的父级开始查找。在我们的示例中，`super.getSalary`\
  \ 的调用跳过了 `Manager.prototype`，这很好，因为否则会导致无限递归。相反，调用的是 `Employee.prototype` 中的 `getSalary`\
  \ 方法。\n\n![Images](img/note.jpg) Note\n\n在本节中，我们使用 `getSalary` 方法作为方法重写的示例。你也可以重写\
  \ getter 和 setter：\n\n点击此处查看代码图像\n\n```javascript\nclass Manager extends Employee\
  \ {\n\n  . . .\n\n  getSalary() { return super.salary\n}\n```\n\n### 4.10 子类构造\n\
  \n在子类构造函数中，你**必须**调用父类。使用 `super(...)` 就像在 Java 中一样。在括号内放置你想传递给父类的参数：\n\n点击此处查看代码图像\n\
  \n```javascript\nclass Manager extends Employee {\n\n  constructor(name, salary,\
  \ bonus) {\n    super(name, salary) // 调用父类\n\n    this.bonus = bonus // 之后这样是有效的\n\
  \  }\n```\n\n然而，如果你不提供子类构造函数，会自动提供一个。该提供的构造函数会将所有参数传递给父类。\n\n点击此处查看代码图像\n\n```javascript\n\
  class Manager extends Employee {\n\n  // 没有构造函数\n\n  getSalary() { . . . }\n}\n\n\
  const boss = new Manager('Mary Lee', 180000) // 调用 Employee 构造函数\n```\n\n在 `extends`\
  \ 和 `super` 关键字添加到 JavaScript 之前，实现一个调用父类的子类要困难得多。这种过程——需要 第 11 章 Note\n\n正如你所知的，JavaScript\
  \ 并没有真正的类。类只是一个构造函数。子类是一个调用父类构造函数的构造函数。\n\n### 4.11 类表达式\n\n![Images](img/cat.jpg)\n\
  \n你可以声明匿名类，就像声明匿名函数一样：\n\n点击此处查看代码图像\n\n```javascript\nconst Employee = class {\n\
  \  constructor(name, salary) {\n    this.name = name\n    this.salary = salary\n\
  \  }\n\n  raiseSalary(percent) {\n    this.salary *= 1 + percent / 100\n  }\n}\n\
  ```\n\n记得 `class` 生成一个构造函数。该函数现在存储在变量 `Employee` 中。在这个示例中，它与命名类表示法 `class Employee\
  \ { . . . }` 相比没有优势。\n\n这是一个更有用的应用。你可以提供方法将某种功能“混合”到现有类中：\n\n点击此处查看代码图像\n\n```javascript\n\
  const withToString = base =>\n  class extends base {\n    toString() {\n      let\
  \ result = '{'\n      for (const key in this) {\n        if (result !== '{') result\
  \ += ', '\n        result += `${key}=${this[key]}`\n      }\n      return result\
  \ + '}'\n    }\n  }\n```\n\n用一个类（即构造函数）调用此函数，以获得一个增强后的类：\n\n\n\n\n\n```javascript\n\
  const PrettyPrintingEmployee = withToString(Employee) // 一个新类\n\ne = new PrettyPrintingEmployee('Harry\
  \ Smith', 90000) // 新类的一个实例\n\nconsole.log(e.toString())\n\n  // 输出 {name=Harry\
  \ Smith, salary=90000},而不是 [object Object]\n```\n\n### 4.12 `this` 引用\n\n![Images](img/joker.jpg-ch04_images.xhtml_ch04pr36)\n\
  \n在这个“疯狂帽顶”章节中，我们将更仔细地观察 `this` 引用。如果你只在构造函数、方法和箭头函数中使用 `this`，而不在具名函数内部使用它，那么你可以安全地跳过这一节。\n\
  \n为了了解 `this` 在什么情况下会产生麻烦，首先考虑 `new` 运算符。如果不使用 `new` 直接调用构造函数会发生什么？如果你进行了如下的调用：\n\
  \n点击此处查看代码图像\n\n```javascript\nlet e = Employee('Harry Smith', 90000) // 忘记使用 new\n\
  ```\n\n在严格模式下，变量 `this` 将被设置为 `undefined`。\n\n幸运的是，这个问题只可能于旧式的构造函数声明中。如果你使用 `class`\
  \ 语法，在不使用 `new` 的情况下调用构造函数是非法的。\n\n![Images](img/caution.jpg) 注意\n\n如果你不使用 `class`\
  \ 语法，可以声明构造函数，使其能够兼顾两种职能：无论是否使用 `new` 都能工作。一个例子是 `Number` 函数：\n\n点击此处查看代码图像\n\n\
  ```javascript\nconst price = Number('19.95')\n\n  // 解析字符串并返回一个原始数字，而不是对象\n\nconst\
  \ aZeroUnlikeAnyOther = new Number(0)\n\n  // 构建一个新对象\n```\n\n在现代 JavaScript 使用中，不通过\
  \ `new` 调用构造函数并不常见。\n\n这里是另一个潜在问题。可以在没有对象的情况下调用方法。在这种情况下，`this` 是 `undefined`：\n\
  \n点击此处查看代码图像\n\n```javascript\nconst doLater = (what, arg) => { setTimeout(() =>\
  \ what(arg), 1000) }\n\ndoLater(BankAccount.prototype.deposit, 500) // \n```\n\n\
  当表达式 `what(arg)` 在一秒后求值时，`deposit` 方法被调用。由于 `this` 是 `undefined`，方法在访问 `this.balance`\
  \ 时失败。\n\n如果你想向特定账户存款，只需提供该账户：\n\n点击此处查看代码图像\n\n```javascript\ndoLater(amount =>\
  \ harrysAccount.deposit(amount), 500)\n```\n\n接下来，考虑嵌套函数。在用 `function` 关键字声明的嵌套函数内部，`this`\
  \ 是 `undefined`。当你在回调函数中使用 `this` 时，可能会遇到麻烦：\n\n点击此处查看代码图像\n\n```javascript\nclass\
  \ BankAccount {\n\n  . . .\n\n  spreadTheWealth(accounts) {\n\n    accounts.forEach(function(account)\
  \ {\n\n      account.deposit(this.balance / accounts.length)\n\n        // 错误——在嵌套函数内部\
  \ this 是 undefined\n\n    })\n\n    this.balance = 0\n\n  }\n\n}\n```\n\n在这里，`this.balance`\
  \ *并不指代*银行账户的余额。因为它发生在嵌套函数中，所以它是 `undefined`。\n\n最好的解决办法是对回调函数使用箭头函数：\n\n点击此处查看代码图像\n\
  \n```javascript\nclass BankAccount {\n\n  . . .\n\n  spreadTheWealth(accounts) {\n\
  \n    accounts.forEach(account => {\n\n      account.deposit(this.balance / accounts.length)\
  \ // this 被正确绑定了\n\n    })\n\n    this.balance = 0\n\n  }\n}\n```\n\n在箭头函数中，`this`\
  \ 静态绑定到箭头函数外部 `this` 所指代的任何内容——在示例中，绑定到调用 `spreadTheWealth` 方法的 `BankAccount` 对象。\n\
  \n![Images](img/note.jpg) 注意\n\n在箭头函数出现之前，JavaScript 程序员使用了一种折中方案——他们用 `this` 初始化了另一个变量：\n\
  \n点击此处查看代码图像\n\n```javascript\nspreadTheWealth(accounts) {\n\n   const that = this\n\
  \n   accounts.forEach(function(account) {\n\n     account.deposit(that.balance /\
  \ accounts.length)\n\n  })\n\n  this.balance = 0\n}\n```\n\n这里有一个晦涩的例子。任何方法调用 `obj.method(args)`\
  \ 也可以写成 `obj'method'`。由于因此，如果你进行调用 `objindex`，且 `obj[index]` 是一个函数，那么 `this` 被设置为\
  \ `obj`，即使肉眼看不到点运算符。\n\n让我们构造这样一种情况，使用一个回调函数数组：\n\n点击此处查看代码图像\n\n```javascript\n\
  class BankAccount {\n\n  constructor() {\n    this.balance = 0\n\n    this.observers\
  \ = []\n  }\n\n  addObserver(f) {\n    this.observers.push(f)\n  }\n\n  notifyObservers()\
  \ {\n    for (let i = 0; i < this.observers.length; i++) {\n      this.observers[i]()\n\
  \    }\n  }\n\n  deposit(amount) {\n    this.balance += amount\n  }\n}\n```\n\n\
  现在假设你有一个账户：\n\n```javascript\nconst acct = new BankAccount()\n```\n\n你添加了一个观察者：\n\
  \n点击此处查看代码图像\n\n```javascript\nclass UserInterface {\n\n  log(message) {\n    console.log(message)\n\
