  \n在本节中，我们将看到一些特殊的特征。\n\n`^` 锚点匹配字符串的开头，而 `$` 锚点匹配结尾：\n\n点击此处查看代码图片\n\n```\n'abc'.test(/^a/)\
  \ // true\n'abc'.test(/c$/) // true\n'abc'.test(/^a$/) // false\n```\n\n字符类 `[]`\
  \ 匹配括号内的任何字符：\n\n点击此处查看代码图片\n\n```\n'abc'.test(/[aeiou]/) // true\n'abc'.test(/[bd]/)\
  \ // false\n```\n\n点 `.` 匹配除换行符外的任何单个字符：\n\n点击此处查看代码图片\n\n```\n'abc'.test(/b/) //\
  \ true\n'abc'.test(/d/) // false\n```\n\n量符 `*`、`+` 和 `?` 指定前一个元素匹配的次数：\n\n点击此处查看代码图片\n\
  \n```\n'a'.test(/a*) // true\n'a'.test(/a+) // true\n'a'.test(/a?) // true\n```\n\
  \n量符 `{n}`、`{n,}` 和 `{n,m}` 指定更精确的匹配次数：\n\n点击此处查看代码图片\n\n```\n'aa'.test(/a{2}) //\
  \ true\n'aaa'.test(/a{2,}) // true\n'aaaa'.test(/a{2,3}) // true\n```\n\n管道符 `|`\
  \ 匹配管道之前或之后的表达式：\n\n点击此处查看代码图片\n\n```\n'abc'.test(/a|d/) // true\n'abc'.test(/d|e/)\
  \ // false\n```\n\n单词边界 `\\b` 匹配单词字符与非单词字符之间的位置：\n\n点击此处查看代码图片\n\n```\n'abc'.test(/\\\
  babc/) // true\n'abc'.test(/c\\b/) // true\n```\n\n简写类 `\\d` 匹配任何数字，`\\D` 匹配任何非数字：\n\
  \n点击此处查看代码图片\n\n```\n'abc123'.test(/\\d/) // true\n'abc'.test(/\\D/) // true\n```\n\
  \n简写类 `\\w` 匹配任何单词字符，`\\W` 匹配任何非单词字符：\n\n点击此处查看代码图片\n\n```\n'a1_'.test(/\\w/) //\
  \ true\n'a1'.test(/\\W/) // true\n```\n\n简写类 `\\s` 匹配任何空白字符，`\\S` 匹配任何非空白字符：\n\n\
  点击此处查看代码图片\n\n```\n' a '.test(/\\s/) // true\n'a'.test(/\\S/) // true\n```\n\n\n\
  \n\n4. 编写一个函数，接受一个字符串并返回所有子字符串的数组。注意那些用两个 UTF-16 代码单元编码的字符。\n\n5. 在一个更完美的世界里，所有的字符串方法应该接受计算\
