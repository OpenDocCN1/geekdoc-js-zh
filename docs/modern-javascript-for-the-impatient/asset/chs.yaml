  \n### 8.8 杂项区域特性\n\n![Images](img/cat.jpg)\n\n在现代浏览器中，`navigator.languages` 属性是一个用户偏好语言标记的数组，按偏好程度从高到低排序。值\
  \ `navigator.language` 是最偏好的语言标记，等于 `navigator.languages[0]`。浏览器通常使用主机操作系统的区域设置，除非用户个性化了浏览器的语言设置。\n\
  \n你可以将 `navigator.languages` 作为你在前面几节中看到的各种区域敏感方法和构造函数的区域参数。\n\n`Intl.getCanonicalLocales`\
  \ 接受一个区域标记或一个区域标记数组，并返回一个清理过的标记数组，去除了重复项。\n\n在前述节描述的每个格式化器类都有 `supportedLocalesOf`\
  \ 方法。传递一个区域标记或区域标记数组。不支持的标记会被丢弃，支持的标记会被归一化。例如，假设你的浏览器 `Intl.NumberFormat` 类不支持威尔士语，则调用调用：\n\
  \n点击此处查看代码图片\n\n```\nIntl.NumberFormat.supportedLocalesOf(['cy', 'en-uk'])\n```\n\
  \n返回 `['en-UK']`。\n\n当你向区域敏感方法传递区域选择数组时，由浏览器来寻找匹配偏好的最佳可用区域。所有区域特定的函数都支持 `localeMatcher`\
  \ 选项来设置匹配算法。该选项有两个值：\n\n*   `'lookup'` 使用 ECMA-402 中指定的标准算法。\n*   `'best fit'`（默认值）允许\
  \ JavaScript 运行时找到更好的匹配。\n\n到目前，常见的 JavaScript 运行时使用标准算法，因此此选项不需要担心。\n\n![Images](img/note.jpg)\
  \ 笔记\n\n如果你想向用户提供区域选择，你需要能够用用户能理解的语言显示该选择。一个阶段 3 的提案定义了一个类 `Intl.DisplayNames` 来用于此目的。以下是几个用法示例：\n\
  \n点击此处查看代码图片\n\n```\nconst regionNames = new Intl.DisplayNames(['fr'], { type: 'region'\
  \ })\n\nconst languageNames = new Intl.DisplayNames(['fr'], { type: 'language' })\n\
  \nconst currencyNames = new Intl.DisplayNames(['zh-Hans'],\n\n  { type: 'currency'\
  \ })\n\nregionNames.of('US') // 'États-Unis'\n\nlanguageNames.of('fr') // 'Français'\n\
  \ncurrencyNames.of('USD') // '美元'\n```\n\n要获取更多关于国际化对象属性的信息，请调用 `resolvedOptions`\
  \ 方法。例如，给定以下排序器对象：\n\n点击此处查看代码图片\n\n```\nconst collator = new Intl.Collator('en-US-u-kn-true',\
  \ { sensitivity: 'base' })\n```\n\n则调用\n\n```\ncollator.resolvedOptions()\n```\n\
  \n返回对象：\n\n点击此处查看代码图片\n\n```\n{\n  locale: 'en-US',\n\n  usage: 'sort',\n  sensitivity:\
  \ 'base',\n  ignorePunctuation: false,\n  numeric: true,\n  caseFirst: 'false',\n\
  \  collation: 'default'\n}\n```\n\n![Images](img/note.jpg) 笔记\n\n一个阶段 3 的提案是 `Intl.Locale`\
