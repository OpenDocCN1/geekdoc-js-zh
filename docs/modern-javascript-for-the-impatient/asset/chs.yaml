  \ 1000)\n```\n\n## 第 5 章 数字与日期\n\n![Images](img/squirrel.jpg)\n\n### 本章内容\n- 5.1\
  \ 字面量\n- 5.2 数字格式化\n- 5.3 数字解析\n- 5.4 数字函数和常量\n- 5.5 数学函数和常量\n- 5.6 整数\n- 5.7 构建日期\n\
  - 5.8 日期函数和方法\n- 5.9 日期格式化\n- 练习在这个简短的章节中，我们将查看处理数字和大整数的 JavaScript API。然后我们将处理与日期的操作。正如你所看到的，日期可以转换为数字——毫秒数。这种转换实际上很有用，它是我们将这两个主题组合在一起的理由。\n\
  \n### 5.1 字面量\n所有的 JavaScript 数字都是 IEEE 754 浮点标准中的“双精度”值，其二进制表示占用八字节。整数字面量可以用十进制、十六进制或二进制写出：\n\
  \n```javascript\n42\n0xA\n0o52\n0b101010\n```\n\n![Images](img/note.jpg) 注意，严格模式下不允许带有前零且没有\
  \ `o` 的旧八进制表示法（如 `052`）。浮点字面量可以使用指数计数法：\n\n```javascript\n4.2e-3\n```\n\n字母 `e`、`x`、`b`\
  \ 可以小写或大写：`4.2E-3` 或 `0X2A` 都是的![Images](img/note.jpg) 注意 C++ 和 Java 允许十六进制浮点字面量，如\
  \ `0x1.0p-10` = $2^{-10}$ = 0.000976565。JavaScript 不支持这种表示。数字字面量中的划线是 2020 年的一个阶段\
  \ 3 提案。你可以在数字之间的任何位置放置划线以使数字更易读。划线仅供人类读者阅读——在解析数字时会被移除。例如，点击此处查看代码图片\n\n```javascript\n\
  const speedOfLight = 299_792_458 // 等于 299792458\n```\n\n全局变量 `Infinity` 和 `NaN`\
  \ 表示“无穷”和“不是数字”的值。例如，`1 / 0` 是 `Infinity`，`0 / 0` 是 `NaN`。\n\n### 5.2 数字格式化\n要在\
  \ 2 到 36 之间的给定数字基格式化整数，使用 `toString` 方法：点击此处查看代码图片\n\n```javascript\nconst n = 3735928559\n\
  n.toString(16) // 'deadbeef'\nn.toString(8) // '33653337357'\nn.toString(2) // '11011110101011011011111011101111'\n\
  ```\n\n你还可以将浮点数格式化为非 10 进制：点击此处查看代码图片\n\n```javascript\nconst almostPi = 3.14\n\
  almostPi.toString(16) // 3.23d0a3d70a3e\n```\n\n`toFixed` 方法以指定的小数点后位数将浮点数格式化为固定格式。调用\
  \ `x.toExponential(p)` 使用指数格式，小数点前有一位，小数点后 $p-1$ 位，而 `x.toPrecision(p)` 显示 `p` 位有效数字：点击此处查看代码图片\n\
  \n```javascript\nconst x = 1 / 600 // 0.0016666666666666668\nx.toFixed(4) // '0.0017'\n\
  x.toExponential(4) // '1.667e-3'\nx.toPrecision(4) // '0.001667'\n```\n\n`toPrecision`\
  \ 方法会在可能会产生过多有效数字或零时切换到指数格式——参见练习 3。\n\n\n\n\nJavaScript 标准库中没有等同于 C 语言 `printf`\
  \ 函数的函数，但有一些第三方实现，例如 [`https://github.com/alexei/sprintf.js`](https://github.com/alexei/sprintf.js)。\n\
  \n`console.log` 方法支持 `printf` 风格的占位符 `%d`、`%f`、`%s`，不支持宽度、填充或精度修饰符。\n\n### 5.3 数字解析\n\
  \n在第一章中，你看到了如何解析包含数字的字符串：\n\n点击此处查看代码图片\n\n```\nconst notQuickPi = parseFloat('3.14')\
  \ // 数字 3.14\n\nconst evenLessPi = parseInt('3') // 整数 3\n```\n\n这些函数会忽略空白前缀和非数字后缀。例如，`parseInt('\
  \ 3A')` 的结果也是 `3`。\n\n如果在可选空白后没有数字，则结果为 `NaN`。例如，`parseInt(' A3')` 的结果是 `NaN`。\n\
  \n`parseInt` 函数接受十六进制表示法：`parseInt('0x3A')` 的结果是 `58`。\n\n有时你只想接受那些真正代表 JavaScript\
  \ 格式十进制数的字符串，且没有前空格或后缀。在这种情况下，最好的办法是使用正则表达式：\n\n点击此处查看代码图片\n\n```\nconst intRegex\
  \ = /^[+-]?[0-9]+$/\n\nif (intRegex.test(str)) value = parseInt(str)\n```\n\n对于浮点数，正则表达式更为复杂：\n\
  \n点击此处查看代码图片\n\n```\nconst floatRegex = /^[+-]?((0|[1-9][0-9]*)(\\.[0-9]*)?|\\.[0-9]+)([eE][+-]?[0-9]+)?$/\n\
  \nif (floatRegex.test(str)) value = parseFloat(str)\n```\n\n关于正则表达式的更多信息，请参阅第六章。\n\
  \n![Images](img/caution.jpg) 注意\n\n互联网上充斥着几乎准确的识别 JavaScript 数字字符串的配方，但细节决定成败。上述正则表达式精确接受\
  \ JavaScript 标准中的十进制数字字面量，前面可选带有符号。然而，它们不支持嵌入的下划线（例如 `1_000_000`）。\n\n要解析非 10 进制的整数，请作为第二个参数提供\
  \ 2 到 36 之间的进制。\n\n点击此处查看代码图片\n\n```\nparseInt('deadbeef', 16) // 3735928559\n```\n\
  \n### 5.4 数字函数与常量\n\n`Number.parseInt` 和 `Number.parseFloat` 函数与全局的 `parseInt` 和\
  \ `parseFloat` 函数相同。\n\n调用 `Number.isNaN(x)` 检查 `x` 是否为 `NaN`，这是一个特殊的“不是数字”的值。（你不能检查\
  \ `x === NaN`，因为任何两个 `NaN` 值都被认为是不相等的。）\n\n要检查值 `x` 是否为 `Infinity`、`-Infinity` 或\
  \ `NaN` 以外的数字，请调用 `Number.isFinite(x)`。\n\n![Images](img/caution.jpg) 注意\n\n不要使用全局的\
  \ `isNaN` 和 `isFinite` 函数——它们会先转换非数字参数，这不会产生有用的结果：\n\n点击此处查看代码图片\n\n```\nisNaN('Hello')\
  \ // true\n\nisFinite([0]) // true\n```\n\n静态方法 `Number.isInteger` 和 `Number.isSafeInteger`\
  \ 检查参数是否为整数，或者是在不会发生舍入的安全范围内的整数。\n\n该范围从 `Number.MIN_SAFE_INTEGER` (−2⁵³ + 1 或 `−9,007,199,254,740,991`）到\
  \ `Number.MAX_SAFE_INTEGER`（2⁵³ − 1 或 `9,007,199,254,740,991`）。\n\n最大的数字是 `Number.MAX_VALUE`（(2\
  \ − 2^(−52)) × 2¹⁰²³ 或约 1.8 × 10³⁰⁸）。最小的正数是 `Number.MIN_VALUE` (2^(−1074) 或约 5 ×\
  \ 10^(−324)。`Number.EPSILON` (2^(−52) 或约 2.2 × 10^(−16)) 是 1 和下一个大于 1 的可表示数字之间的差距。\n\
  \n最后，`Number.NaN`、`Number.POSITIVE_INFINITY` 和 `Number.NEGATIVE_INFINITY` 与全局的 `NaN`、`Infinity`\
  \ 和 `-Infinity`相同。如果你担心有人定义名为 `NaN` 和 `Infinity` 的局部变量，可以使用这些值。\n\n表 5-1 显示了 `Number`\
  \ 类最有用的特性。\n\n| 名称 | 描述 |\n| --- | --- |\n| **函数** | |\n| `isNaN(x)` | 如果 `x` 是\
  \ `NaN` 则为 `true`。注意你不能使用 `x === NaN`，因为 `x === NaN` 为假。 |\n| `isFinite(x)` | 如果\
  \ `x` 是有限的则为 `true`。 |\n| `isInteger(x)` | 如果 `x` 是整数则为 `true`。 |\n| **方法** | |\n\
  | `toString(base)` | 以指定进制的字符串表示。 |\n| `toFixed(digits)` | 带有指定小数位数的字符串。 |\n| `toExponential(digits)`\
  \ | 科学计数法格式的字符串。 |\n| **常量** | |\n| `NaN` | 不是数字。 |\n| `POSITIVE_INFINITY` | 正无穷。\
  \ |\n| `NEGATIVE_INFINITY` | 负无穷。 |\n| `MIN_SAFE_INTEGER` | 最小安全整数。 |\n| `MAX_SAFE_INTEGER`\
  \ | 最大安全整数。 |\n| `MIN_VALUE` | 最小的正数数值。 |\n| `MAX_VALUE` | 最大数值。 |\n| `EPSILON`\
  \ | 1 和下一个可表示数字之间的差值。 |\n\n\n\n\n\n当 `typeof` 运算符应用于大整数时，它会返回 `'bigint'`。\n\n算术运算符会将大整数组合成一个新的大整数结果：\n\
  \n\n\n点击此处查看代码图片\n\n```javascript\nlet result = 8159152832478977343456112695961158942720000000000n\
  \ * BigInt(41)\n// Sets result to 334525266131638071081700620534407516651520000000000n\n\
  ```\n\n![Images](img/caution.jpg) 注意\n\n你不能使用算术运算符将大整数与另一种类型的值组合。例如，`8159152832478977343456112695961158942720000000000n\
  \ * 41` 是错误的。\n\n在组合大整数值时，`/` 运算符会产生一个大整数结果并舍弃余数。例如，`100n / 3n` 等于 `33n`。\n\n`BigInt`\
  \ 类有两个相当技术性的函数。调用 `BigInt.asIntN(bits, n)` 和 `BigInt.asUintN(bits, n)` 将 `n` 模 `2^(bits)`\
  \ 缩小到区间 `[−2^(bits − 1) . . . 2^(bits − 1) − 1]` 或 `[0 . . . 2^(bits) − 1]`。\n\n\
  ### 5.7 构建日期\n\n### 时间概念\n在介绍 JavaScript 日期 API 之前，让我们回顾关于测量地球时间的几个概念。\n\n从历史上看，基本时间单位——秒——源于地球绕其自轴的旋转。旋转一周有\
  \ 24 小时或 `24 × 60 × 60 = 86400` 秒，因此精确定义秒似乎仅仅是一个天文学测量的问题。遗憾的是，地球会轻微晃动，需要更精确的定义。1967\
  \ 年，根据铯-133 原子的内在属性，得出了与历史定义相匹配的新秒定义。从那时起，原子钟网络维持着官方时间。\n\n官方计时员经常将绝对时间与地球旋转进行同步。起初，官方秒（seconds）会进行细微调整，但从\
  \ 1972 年开始，根据需要偶尔插入“闰秒”（在理论上，有时可能需要删除一个秒，但这种情况尚未发生）。显然，闰秒是一个麻烦，许多计算机系统转而使用“平滑”处理，即在闰秒出现之前人为地减慢或加速时间，以保持每天\
  \ `86,400` 秒。这之所以有效，是因为计算机的本地时间并不精确，且计算机用于与外部时间服务进行同步。\n\n由于全球各地的人们都希望午夜对应于大致在夜中间的一个点，因此存在不同的本地时间。但为了比较时间，需要一个共同的参考点。出于历史原因，这个点是经过格林尼治皇家天文台的午线时间（不考虑夏令时）。这种时间被称为“协调世界时”，简称\
  \ `UTC`。这个缩写是上述英语和法语“Temps Universel Coordiné”之间的折中方案，其特点是在两种语言中都是错误的。\n\n### 纪元（Epoch）\n\
  在计算机中表示时间时，有一个固定的起点来向前或向后计数非常方便。这就是“纪元”：1970 年 1 月 1 日星期四 `UTC` 午夜。\n\n在 JavaScript\
  \ 中，时间是从纪元开始计算的平滑毫秒，有效范围为正反方向 `±100,000,000` 天。\n\nJavaScript 使用标准的 ISO 8601 格式表示时间点：`YYYY-MM-DDH:mm:ss.sssZ`，其中年份为四位，月、日、小时、分钟和秒均为两位，毫秒为三位。字母\
  \ `T` 分隔日期和小时，`Z` 后缀表示相对于 `UTC` 的零偏移。\n\n例如，纪元是：\n\n```javascript\n1970-01-01T00:00:00.000Z\n\
  ```\n\n![Images](img/note.jpg) 注意\n\n你可能在想，这种格式如何处理距离纪元 100,000,000 天（接近 274,000\
  \ 年）的日期。那么“公元”之前的日期又是怎样的呢？\n\n对于这些日期，年份用六位数字并带符号来指定，如 `±YYYYYY`。最大的有效 JavaScript\
  \ 日期是：\n\n```javascript\n+275760-09-13T00:00:00.000Z\n```\n\n`0001` 年之前的年份是 `0000`，再之前的年份是\
  \ `-000001`。\n\n### Date 类\n在 JavaScript 中，时间点由 `Date` 类的实例表示。将该类命名为 `Time` 将会是一个极佳的主意。请参见表\
  \ 5-3 `Date` 的常用构造函数、函数和方法。\n\n| 名称 | 描述 |\n| :--- | :--- |\n| **构造函数** | |\n| `new\
  \ Date()` | 构建当前时间。 |\n| `new Date(isoString)` | 根据 ISO 8601 字符串构建 `Date`，例如 `'1969-07-20T20:17:40.000Z'`。\
  \ |\n| `new Date(millisecondsFromEpoch)` | 根据毫秒数构建 `Date`。 |\n| `new Date(year,\
  \ zeroBasedMonth, day, hours, minutes, seconds, milliseconds)` | 在你的本地时区内构建 `Date`。\
  \ |\n| **方法** | |\n| `getTime()` | 返回从纪元开始的毫秒数。 |\n| `toISOString()` | 返回 ISO 8601\
  \ 字符串。 |\n| `toLocaleString(locale, options)` | 返回可读字符串。 |\n| `toLocaleDateString(locale,\
  \ options)` | 返回可读的日期。 |\n| `toLocaleTimeString(locale, options)` | 返回可读的时间。 |\n\
  | `getUTCFullYear()` | 返回 UTC 年。 |\n| `getUTCMonth()` | 返回 UTC 月（0-11）。 |\n| `getUTCDate()`\
  \ | 返回 UTC 月中的几。 |\n| `getUTCHours()` | 返回 UTC 小时（0-23）。 |\n| `getUTCMinutes()`\
  \ | 返回 UTC 分钟（0-59）。 |\n| `getUTCSeconds()` | 返回 UTC 秒（0-59）。 |\n| `getUTCMilliseconds()`\
  \ | 返回 UTC 毫秒。 |\n| `getUTCDay()` | 返回 UTC 星期几（0-6）。 |\n\n\n\n\n\n```javascript\n\
  new Date(1970, 0 /* January */, 1, 0, 0, 0, 0, 0) // 注意—本地时区\n```\n\n我得到：\n\n```\n\
  1969-12-30T23:00:00.000Z\n```\n\n当你尝试它时，可能会得到不同的结果，具体取决于你的时区。\n\n![Images](img/caution.jpg)\
  \ 注意\n\n如果你为 `zeroBasedMonth`、`day`、`hours` 等提供了超出范围的值，日期会被静默调整。例如，`new Date(2019,\
  \ 13, -2)` 对应的是 2020 年 1 月 29 日。\n\n### 5.8 日期函数与方法\n\n![Images](img/queen.jpg)\n\
  \n`Date` 类有三个静态函数：\n\n* `Date.UTC(year, zeroBasedMonth, day, hours, minutes, seconds,\
  \ milliseconds)`\n* `Date.parse(dateString)`\n* `Date.now()`\n\n`UTC` 函数与带有多个参数的构造函数类似，但它产生的是\
  \ UTC 日期。\n\n`parse` 函数解析 ISO 8601 字符串，根据实现的不同，它也可能接受其他格式（参见练习 17）。\n\n`Date.now()`\
  \ 生成当前的日期和时间。\n\n![Images](img/caution.jpg) 注意\n\n遗憾的是，所有三个函数产生的都是自 Epoch 的毫秒数，*而不是*\
  \ `Date` 对象。\n\n要实际从 UTC 组件构建一个日期，请调用：\n\n点击查看代码图像\n\n```javascript\nconst deadline\
  \ = new Date(Date.UTC(2020, 0 /* January */, 31))\n```\n\n`Date` 类具有 Java 风格的 getter\
  \ 和 setter 方法，例如 `getHours`/`setHours`，而不是 JavaScript 的 `get`/`set` 方法。\n\n要获取 `Date`\
  \ 对象的组件，请调用方法 `getUTCFullYear`、`getUTCMonth`（于 `0` 到 `11` 之间）、`getUTCDate`（于 `1`\
  \ 到 `31` 之间）、`getUTCHours`（于 `0` 到 `23` 之间）、`getUTCMinutes`、`getUTCSeconds`、`getUTCMilliseconds`。\n\
  \n不带 `UTC` 方法（即 `getFullYear`、`getMonth`、`getDate` 等）产生本地时间的相同信息。除非你需要向用户显示本地时间，否则你可能不需要它们。如果你确实显示了本地时间，应该使用第\
  \ 5.9 节中描述的日期格式化方法，“日期格式化](#ch05.xhtml_ch05lev1sec9)”（第 110 页）。\n\n`getUTCDay` 方法产生\
  \ `0`（星期日）到 `6`（星期六）之间的星期几：\n\n点击查看代码图像\n\n```javascript\nconst epoch = new Date('1970-01-01T00:00:00.000Z')\n\
  \nepoch.getUTCDay() // 4 (星期四)\n\nepoch.getDay() // 3, 4, 或 5，取决于何时以及何地调用\n```\n\
  \n![Images](img/note.jpg) 提示\n\n过时的 `getYear` 方法产生两位数的年份。显然，当 JavaScript 在 1995\
  \ 年创建时，没有人能预料到两位年份可能会出现问题。\n\nJavaScript 复制了 Java 拥有可变 `Date` 对象的错误，并通过为每个时间单位设置\
  \ setter 使其变得更糟——参见练习 16。这些 setter 会静默调整到下一个有效日期：\n\n点击查看代码图像\n\n```javascript\n\
  const appointment = new Date('2020-05-31T00:00:00.000Z')\n\nappointment.setUTCMonth(5\
  \ /* June */) // appointment 现在是 7 月 1 日\n```\n\n### 5.9 日期格式化\n\n![Images](img/queen.jpg)\n\
  \n`toString`、`toDateString`、`toTimeString` 和 `toUTCString` 方法产生“人类可读”的字符串，但其格式对人类并不特别友好：\n\
  \n点击查看代码图像\n\n```javascript\n'Sun Jul 20 1969 21:17:40 GMT+0100 (Mitteleuropäische\
  \ Sommerzeit)'\n\n'Sun Jul 20 1969'\n\n'21:17:40 GMT+0100  (Mitteleuropäische Sommerzeit)'\n\
  \n'Sun, 20 Jul 1969 20:17:40 GMT'\n```\n\n注意，时区（但不是星期几或月份名称）出现在用户的本地设置中。\n\n要实际向人类用户展示日期和时间，请使用\
  \ `toLocaleString`、`toLocaleDateString` 或 `toLocaleTimeString` 方法，它们可以格式化日期和时间、仅日期部分或仅时间部分。格式使用用户当前本地语言的规则或\n\
  \n点击查看代码图像\n\n```javascript\nmoonlanding.toLocaleString() // '7/20/1969'\n```\n\n\
  格式使用用户当前本地语言的规则或\n\n点击查看代码图像\n\n```javascript\nmoonlanding.toLocaleDateString(\n\
  \  'en-US', { year: 'numeric', month: 'long', day: 'numeric' }) // 'July 20, 1969'\n\
  ```\n\n格式使用用户当前本地语言的规则或\n\n点击查看代码图像\n\n```javascript\nmoonlanding.toISOString()\
  \ // '1969-07-20T20:17:40.000Z'\n```\n\n格式使用用户当前本地语言的规则或\n\n点击查看代码图像\n\n```javascript\n\
  moonlanding.toISOString() // '1969-07-20T20:17:40.000Z'\n```\n\n格式使用用户当前本地语言的规则或\n\
  \n点击查看代码图像\n\n```javascript\nmoonlanding.toISOString() // '1969-07-20T20:17:40.000Z'\n\
  ```\n\n\n\n\n\n点击此处查看代码图像\n\n```javascript\nconst deadline = new Date(Date.UTC(2020,\
  \ 0 /* 一月 */, 31))\n```\n\n结果是什么？\n\n点击此处查看代码图像\n\n```javascript\ndeadline.setUTCMonth(1\
  \ /* 二月 */)\n\ndeadline.setUTCDate(1)\n```\n\n是否应该始终在调用 `setUTCMonth` 之前调用 `setUTCDate`？请举出一个这种方法不起的例子。\n\
