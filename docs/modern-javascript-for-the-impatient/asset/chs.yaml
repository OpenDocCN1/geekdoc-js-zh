  \n'March 14, 2020'\n\n'14 March 2020'\n\n'2020-03-14'\n\n'2020-03-14 '\n```\n\n\
  令人害怕的是，在 Node.js 13.11.0 版本中，最后两个字符串会产生**不同的**日期。\n\n## 第 6 章：字符串与正则表达式\n\n![图像](img/squirrel.jpg)\n\
