  \ 节“正则表达式的字符串方法”（第 133 页](#ch06.xhtml_page_133)）。\n\n![Images](img/caution.jpg)\
  \ 注意\n\n使用空分隔符调用 `str.split('')`会将字符串拆分为每个包含 16 位代码单元的字符串，如果 `str` 包含 `\\u{FFFF}`\
  \ 以上的字符，这将是没用的。请改用 `[...str]`。\n\n### 6.3 其他字符串方法\n\n在本节中，你将找到 `String` 类的各种杂方法。由于\
  \ JavaScript 中的字符串是不可变的，因此没有任何字符串方法会改变给定字符串的内容。它们都将返回一个包含结果的新字符串。\n\n`repeat` 方法产生一个重复指定次数的字符串：\n\
  \n点击此处查看代码图像\n\n```\nconst repeated = 'ho '.repeat(3) // 'ho ho ho '\n```\n\n`trim`、`trimStart`\
  \ 和 `trimEnd` 方法产生移除开头和结尾空白的字符串，或者仅移除开头或结尾空白。空白字符包括空格字符、不换行空格 `\\u{00A0}`、换行、制表符和其他\
  \ 21 个具有 Unicode 字符属性 `White_Space` 的字符。\n\n`padStart` 和 `padEnd` 方法的作用相反——它们添加空格字符直到字符串达到最小长度：\n\
  \n点击此处查看代码图像\n\n```\nlet padded = 'Hello'.padStart(10) // '     Hello', 添加了五个空格\n\
  ```\n\n你也可以提供你自己的填充字符串：\n\n点击此处查看代码图像\n\n```\npadded = 'Hello'.padStart(10, '=-')\
  \ // =-=-=Hello\n```\n\n![Images](img/caution.jpg) 注意\n\n第一个参数是填充后字符串的字节长度。如果你的填充字符串包含需要两个字节的字符，你可能会得到一个格式错误的字符串：\n\
  \n点击此处查看代码图像\n\n```\npadded = 'Hello'.padStart(10, '')\n\n  // 填充了两个心和一个不匹配的代码单元\n\
  ```\n\n`toUpperCase` 和 `toLowerCase` 方法产生一个所有字符都转换为大写或小写的字符串。\n\n点击此处查看代码图像\n\n\
  ```\nlet uppercased = 'Straße'.toUpperCase() // 'STRASSE'\n```\n\n如你所见，`toUpperCase`\
  \ 方法意识到德语字符 `'ß'` 的大写是字符串 `'SS'`。\n\n注意 `toLowerCase` 不会恢复原始字符串：\n\n点击此处查看代码图像\n\
  \n```\nlet lowercased = uppercased.toLowerCase() // 'strasse'\n```\n\n![Images](img/note.jpg)\
  \ 注意\n\n字符串操作（如转换为大写和小小写）可能取决于用户的语言偏好。请参见第 8 章了解 `toLocaleUpperCase`、`toLocaleLowerCase`、`localeCompare`\
  \ 和 `normalize` 方法，这些方法在本地化你的应用程序时非常有用。\n\n![Images](img/note.jpg) 注意\n\n参见第 6.12\
  \ 节“正则表达式的字符串方法”（第 133 页](#ch06.xhtml_page_133)），适用于正则表达式的字符串方法 `match`、`matchAll`、`search`\
  \ 和 `replace`。\n\n`concat` 方法将字符串与任意数量转换为字符串的参数连接起来。\n\n点击此处查看代码图像\n\n```\nconst\
  \ n = 7\n\nlet concatenated = 'agent'.concat(' ', n) // 'agent 7'\n```\n\n你可以使用模板字符串或\
  \ `Array` 类的 `join` 方法实现相同的效果：\n\n点击此处查看代码图像\n\n```\nconcatenated = `agent ${n}`\n\
  \nconcatenated = ['agent', ' ', n].join('')\n```\n\n表 6-1 显示了 `String` 类最有用的特性。\n\
  \n| 名称 | 描述 |\n\n| --- | --- |\n| **函数** | |\n| `fromCodePoint(codePoints...)` |\
  \ 产生由给定代码点组成的字符串 |\n| **方法** | |\n| `startsWith(s)`, `endsWith(s)`, `includes(s)`\
  \ | 如果字符串以 `s` 开头或以 `s` 结尾，或包含子串 `s`，则返回 `true` |\n| `indexOf(s, start)`, `lastIndexOf(s,\
  \ start)` | 从索引 `start`（默认为 0）开始 `s` 第一次或最后一次出现的索引 |\n| `slice(start, end)` | 索引在\
  \ `start`(包含）和 `end`(不包含）之间的代码单元子字符串。负索引从字符串末尾计算。`end` 默认为字符串长度。 |\n| `repeat(n)`\
  \ | 该字符串重复 `n` 次 |\n| `trim()`, `trimStart()`, `trimEnd()` | 移除开头、结尾或仅移除开头或结尾空白的字符串\
  \ |\n| `padStart(minLength, padString)`, `padEnd(minLength, padString)` | 在开头或结尾填充直到字符串达到\
  \ `minLength` |\n| `toLowerCase()`, `toUpperCase()` | 产生一个所有字符转换为小写或大写的字符串 |\n|\
  \ `split(separator, maxParts)` | 通过移除分隔符 `separator` 获取部分数组，最多包含 `maxParts` |\n\
  | `search(target)` | `target` 第一次出现的索引 |\n| `replace(target, replacement)` | 替换\
  \ `target` 第一次匹配的字符串。如果 `target` 是全局的，则替换所有匹配 |\n| `match(regex)` | 如果 `regex` 是全局的，返回数组；如果没有匹配则返回\
  \ `null`；否则返回结果 |\n| `matchAll(regex)` | 返回可迭代对象，具有 `index`（匹配索引）和 `groups`（映射组名到匹配的对象）属性\
  \ |\n\n最后，还有全局函数可以将组件（或更广泛地说，使用 `mailto` 或 `tel` 等方案的 URI）转换为“URL 编码”格式。这种格式使用了互联网创建时认为是“安全的”字符。假设你需要翻译一种语言。你可能会构造这样的\
  \ URL：\n\n```\nconst phrase = 'à coté de'\n\nconst prefix = 'https://www.linguee.fr/anglais/traduction'\n\
  \nconst suffix = '.html'\n\nconst url = prefix + encodeURIComponent(phrase) + suffix\n\
  ```\n\n短语被编码为 `'%C3%A0%20cot%C3%A9%20de'`，这是字符转换为 UTF-8 并每个字节转换为两个十六进制数字 `%hh` 的结果。只保留了“安全字符”\
  \ A-Z a-z 0-9 ! ' ) * _ ~\n\n特殊情况下，如果你需要编码整个 URI，请使用 `encodeURI` 函数。它还会保留在 URI 中具有特殊含义的字符\
  \ # & + / : = ? @\n\n### 6.4 标签字符串\n\n![Images](img/cat.jpg)\n\n在第 1 章中，你看到了模板字符串——带有嵌入表达式的字符串：\n\
  \n点击此处查看代码图像\n\n```\nconst person = { name: 'Harry', age: 42 }\n\nmessage = `Next\
  \ year, ${person.name} will be ${person.age + 1}.`\n```\n\n模板字符串将嵌入表达式的值插入模板字符串中。在这个示例中，嵌入表达式\
  \ `person.name` 和 `person.age + 1` 被计算、转换为字符串并与周围的字符串片段拼接。结果是字符串\n\n```\n'Next year,\
  \ Harry will be 43.'\n```\n\n你可以通过标签函数自定义模板字符串的行为。作为一个示例，我们将编写一个标签函数 `strong` 来产生一个\
  \ HTML 字符串，并高亮嵌入的值。调用如下\n\n点击此处查看代码图像\n\n```\nstrong`Next year, ${person.name} will\
  \ be ${person.age + 1}.`\n```\n\n\n\n\n将产生一个 HTML 字符串\n\n点击此处查看代码图像\n\n```\n'Next\
  \ year, <strong>Harry</strong> will be <strong>43</strong>.'\n```\n\n标签函数的调用会带有嵌入表达式周围的字面量字符串片段，随后是表达式的值。在我们的示例中，片段是\
  \ `'Next year, '`、`' will be '` 和 `'.'`，值是 `'Harry'` 和 `43`。标签函数将这些部分组合在一起。如果返回值不是字符串，则会被转换为字符串。\n\
  \n这里是 `strong` 标签函数的实现：\n\n点击此处查看代码图像\n\n```javascript\nconst strong = (fragments,\
  \ ...values) => {\n\n  let result = fragments[0]\n\n   for (let i = 0; i < values.length;\
  \ i++)\n\n    result += `<strong>${values[i]}</strong>${fragments[i + 1]}`\n\n \
  \ return result\n\n}\n```\n\n当处理模板字符串时\n\n点击此处查看代码图像\n\n```javascript\nstrong`Next\
  \ year, ${person.name} will be ${person.age + 1}.`\n```\n\n`strong` 函数的调用方式如下：\n\
  \n点击此处查看代码图像\n\n```javascript\nstrong(['Next year, ', ' will be ', '.'], 'Harry',\
  \ 43)\n```\n\n注意，所有的字符串片段都被放入一个数组中，而表达式的值是作为单独参数传递的。`strong` 函数使用展开运算符将它们全部收集到第二个数组中。\n\
  \n还要注意，片段的数量总是比表达式的值多一个。\n\n这种机制是无限灵活的。你可以将其用于 HTML 模板、数字格式化、国际化等。\n\n### 6.5 原始模板字面量\
  \ (Raw Template Literals)\n\n![Images](img/cat.jpg)\n\n如果你在模板字面量前加上 `String.raw`，反斜杠将不再是转义字符：\n\
  \n```javascript\npath = String.raw`c:\\users\\nate`\n```\n\n在这里，`\\u` 不表示 Unicode\
  \ 转义，`\\n` 也不会转换为换行符。\n\n![Images](img/caution.jpg) 注意\n\n即使在原始模式下，你不能在反引号中包含任意字符串。你仍然需要转义所有的\
  \ `` ` `` 字符、`{` 之前的 `$` 以及 `` ` `` 和 `{` 之前的 `\\`。\n\n不过这并没有完全解释 `String.raw` 是如何工作的。标签函数可以访问模板字符串片段的“原始”形式，在那种形式中，反斜杠组合（如\
  \ `\\u` 和 `\\n`）失去了特殊含义。\n\n假设我们想处理带有希腊字母的字符串。我们遵循数学公式的 LATEX 标记语言约定。在该语言中，符号以反斜杠开头。因此，原始字符串非常有吸引——用户希望写\
  \ `\\nu` 和 `\\upsilon`，而不是 `\\\\nu` 和 `\\\\upsilon`。这是一个我们想要能够处理的字符串示例：\n\n```javascript\n\
  greek`\\nu=${factor}\\upsilon`\n```\n\n与任何标签模板字符串一样，我们需要定义一个函数：\n\n点击此处查看代码图像\n\n\
  ```javascript\nconst greek = (fragments, ...values) => {\n\n  const substitutions\
  \ = { alpha: 'α', . . ., nu: 'ν',  . . . }\n\n  const substitute = str => str.replace(/\\\
  \\[a-z]+/g,\n\n    match => substitutions[match.slice(1)])\n\n  let result = substitute(fragments.raw[0])\n\
  \n  for (let i = 0; i < values.length; i++)\n\n    result += values[i] + substitute(fragments.raw[i\
  \ + 1])\n\n  return result\n\n}\n```\n\n你通过标签函数第一个参数的 `raw` 属性访问原始字符串片段。`fragments.raw`\
  \ 的值是一个带有未处理反斜杠的字符串片段数组。\n\n在前面的标签模板字面量中，`fragments.raw` 是包含两个字符串的数组。第一个字符串是 `\\\
  nu=`，第二个字符串是 `\\upsilon`。\n\n```\n${nu\\upsilon{\n```\n\n包含了三个反斜杠。第二个字符串有两个字符：\n\
  \n```\n}}\n```\n\n注意以下内容：\n\n* `\\nu` 中的 `\\n` 不会被转换为换行符。\n* `\\upsilon` 中的 `\\\
  u` 不会被解释为 Unicode 转义。事实上，它在语法上是不正确的。出于这个原因，`fragments[1]` 无法解析并被设置为 `undefined`。\n\
  * `${factor}` 是一个嵌入表达式。它的值被传递给标签函数。\n\n`greek` 函数使用了正则表达式替换，这在 第 6.13 节 “更多关于正则替换”\
  \ (第 135 页) 中有详细解释。以反斜杠开头的标识符被替换为相应的替换值，例如 `\\nu` 变为 ν。\n\n### 6.6 正表达式 (Regular\
  \ Expressions)\n\n![Images](img/queen.jpg)\n\n正则表达式指定字符串模式。当你需要定位匹配特定模式的字符串时，可以使用它们。\n\
  \n\n\n\n| `\\u`hhhh, `\\x`hh | 给定十六进制值的 UTF-16 编码单元 | `\\xA0` |\n| `\\f`, `\\n`,\
  \ `\\r`, `\\t`, `\\v` | 换页 (`\\x0C`), 换行 (`\\x0A`), 回车 (`\\x0D`), 制表符 (`\\x09`),\
  \ 制表符 (`\\x0B`) | `\\n` |\n| `\\c`L, 其中 L 在 `[A-Za-z]` 中 |  L 对应的控制字符 | `\\cH` 是\
  \ Ctrl-H 或退格符 (`\\x08`) |\n| `\\`c, 其中 c 不在 `[0-9BDPSWbcdfknprstv]` 中 | 字符 c | `\\\
  \\` |\n\n### 字符类\n\n| `[`C[1]C[2]. . .`]`, 其中 C[i] 是字符、范围 `c`-`d` 或字符类 | 由 `C[1]`、`C[2]`、.\
  \ . . 表示的任何字符 | `[0-9+-]` |\n| `[^`. . .`]` | 字符类的补集 | `[^\\d\\s]` |\n| `\\p{`BooleanProperty`}`\
  \ `\\p{`Property`=`Value`}` `\\P{`. . .`}` | Unicode 属性（参见 第 6.9 节）；其补集（需要 `unicode`\
  \ 标志） | `\\p{L}` 是 Unicode 字母 |\n| `\\d`, `\\D` | 数字 `[0-9]`；其补集 | `\\d+` 是数字序列\
  \ |\n| `\\w`, `\\W` | 单词字符 `[a-zA-Z0-9_]`；其补集 | |\n| `\\s`, `\\S` | 来自 `[\\t\\n\\\
  v\\f\\r \\xA0]` 的空格或额外的 18 个 Unicode 空格字符；等同于 `\\p{White_Space}` | `\\s*,\\s*` 是由可选空白字符围绕的逗号\
  \ |\n\n### 序列与分支\n\n| XY | 来自 `X` 的任意字符串，后跟来自 `Y` 的任意字符串 | `[1-9][0-9]*` 是不带前零的正数\
  \ |\n| X`&#124;`Y | 来自 `X` 或 `Y` 的任意字符串 | http&#124;ftp` |\n\n### 分组\n\n| `(`X`)`\
  \ | 将 X 的匹配捕获到组——参见 第 6.11 节 | `'([^']*)'` 捕获引号内的文本 |\n| `\\`n | 匹配第 n 组 | `(['\"\
  ]).*\\1` 匹配 `'Fred'` 或 `\"Fred\"` 但不是 `'Fred'` |\n| `(?<`name`>`X`)` | 以给定名称捕获 X\
  \ 的匹配 | `'(?<qty>[0-9]+)'` 捕获名称为 `qty` 的匹配 |\n| `\\k<`name`>` | 给定名称的组 | `\\k<qty>`\
  \ 匹配名为 `qty` 的组 |\n| `(?:`X`)` | 使用括号但不捕获 X | 在 `(?:http&#124;ftp)://(.*)` 中，`://`\
  \ 之后的匹配是 `\\1` |\n| 其他 `(?`. . .`)` | 参见 第 6.14 节 | |\n\n### 量词\n\n| X`?` | 可选的\
  \ X | `\\+?` 是可选的 + 号 |\n| X`*`, X`+` | 0 次或多次 X，1 次或多次 X | `[1-9][0-9]+` 是大于等于\
  \ 10 的整数 |\n| X`{`n`}`, X`{`n`,}`, X`{`m`,`n`}` | n 次 X，至少 n 次 X，m 到 n 次 X 之间 |\
  \ `[0-9]{4,6}` 是四到六位数字 |\n| X`*?` 或 X`+?` | 懒婪量词，在尝试更长匹配之前尝试最短匹配 | `.*(<.+?>).*`\
  \ 捕获角括号包含的最短序列 |\n\n### 边界匹配\n\n| `^ $` | 输入的开始、结束（如果设置了 `multiline` 标志，则是行的开始、结束）\
  \ | `^JavaScript$` 匹配输入或行 `JavaScript` |\n| `\\b`, `\\B` | 单词边界，非单词边界 | `\\bJava\\\
  B` 匹配 `JavaScript` 但不是 `Java code` |\n\n**表 6-2** 正则表达式语法\n\n### 6.7 正则表达式字面量\n\n\
  ![Images](img/queen.jpg)\n\n正则表达式字面量由斜杠分隔：\n\n点击此处查看代码图片\n\n```javascript\nconst\
  \ timeRegex = /^([1-9]|1[0-2]):[0-9]{2} [ap]m$/\n```\n\n正则表达式字面量是 `RegExp` 类的实例。\n\
  \n当 `typeof` 运算符应用于正则表达式时，产生结果为 `'object'`。\n\n在正则表达式字面量内部，使用反斜杠转义在正则表达式中具有特殊含义的字符，例如\
  \ `.` 和 `+` 字符：\n\n点击此处查看代码图片\n\n```javascript\nconst fractionalNumberRegex = /[0-9]+\\\
  .[0-9]*/```\n在这里，转义后的 `.` 意味着字面点。\n\n在正则表达式中，还需要转义正斜杠，以免其被解释为字面量的结束。要将正则表达式字符串转换为\
  \ `RegExp` 对象，使用 `RegExp` 函数，无论是否使用 `new`：\n\n点击此处查看代码图片\n\n```javascript\nconst\
  \ fractionalNumberRegex = new RegExp('[0-9]+\\.[0-9]*')\n```\n注意字符串中的反斜杠必须转义。\n\n\
  ### 6.8 标志\n\n![Images](img/queen.jpg)\n\n标志修改正则表达式的行为。例子是 `i` 标志。正则表达式\n\n```javascript\n\
  /[A-Z]+\\.com/i\n```\n匹配 `COM`。你也可以在构造函数中设置标志：\n\n```javascript\nconst regex = new\
  \ RegExp(/[A-Z]+\\.com/, 'i')\n```\n\n查找 `RegExp` 对象的标志值，可以使用 `flags` 属性，它产生所有标志的字符串。每个标志还有一个布尔属性：\n\
  \n点击此处查看代码图片\n\n```javascript\nregex.flags // 'i'\nregex.ignoreCase // true\n```\n\
  \nJavaScript 支持六个标志，见表 6-3。\n\n| 单字母 | 属性名称 | 描述 |\n| --- | --- | --- |\n| `i` |\
  \ `ignoreCase` | 不区分大小写的匹配 |\n| `m` | `multiline` | `^`, `$` 匹配行的首尾 |\n| `s` | `dotAll`\
  \ | `.` 匹配换行符 |\n| `u` | `unicode` | 匹配 Unicode 字符而非单元——参见第 6.9 节 |\n| `g` | `global`\
  \ | 查找所有匹配——参见第 10 节 |\n| `y` | `sticky` | 必须从 `regex.lastIndex` 开始匹配 |\n\n**表 6-3**\
  \ 正则表达式标志\n\n`m` 或 `multiline` 标志改变锚点 `^` 和 `$`。默认情况下，它们匹配整个字符串的开始和结束。在多行模式下，它们匹配行的开始和结束。例如，\n\
  \n```javascript\n/^[0-9]+/m\n```\n匹配行头的数字。使用 `s` 或 `dotAll` 标志，`.` 模式匹配换行符。如果没有，`.`\
  \ 匹配任何非换行字符。可以使用多个标志。以下正则表达式匹配每行开头的大写或小写字母：\n\n```javascript\n/^[A-Z]/im\n```\n\n\
  ### 6.9 正则表达式与 Unicode\n\n![Images](img/queen.jpg)\n\n由于历史原因，正则表达式处理 UTF-16 编码单元而非\
  \ Unicode 字符。例如，`.` 模式匹配单个 UTF-16 单元。例如，字符串\n\n```javascript\n'Hello '\n```\n不匹配正则表达式\n\
  \n```javascript\n/Hello .$/\n```\n![bcircle.jpg) 字符是用两个单元编码的。解决方法是使用 `u` 或 `unicode`\
  \ 标志：\n\n```javascript\n/Hello .$/u\n```\n使用 `u` 标志，`.` 模式匹配单个 Unicode 字符，无论其在 UTF-16\
  \ 中如何编码。如果你需要保持源文件为 ASCII，可以将 Unicode 代码点嵌入正则表达式，使用 `\\u{ }` 语法：\n\n```javascript\n\
  /[A-Za-z]+ \\u{1F10}/u\n```\n\n![Images](img/caution.jpg) 注意\n\n没有 `u` 标志，`/\\u{1F10}/`\
  \ 匹配字符串 `'u{1F10}'`。处理国际文本时，应避免使用 `[A-Za-z]` 等模式表示字母。这些模式不会匹配其他语言的字母。可以使用 `\\p{Property}`，其中\
  \ Property 是布尔 Unicode 属性的名称。例如，`\\p{L}` 表示 Unicode 字母。正则表达式\n\n```javascript\n\
  /Hello, \\p{L}+!/u\n```\n匹配\n\n```\n'Hello, あれ!'\n```\n\n以及\n\n```\n'Hello, !'\n\
  ```\n\n表 6-4 显示了其他常见布尔属性的名称。对于值不是布尔值的 Unicode 属性，使用语法 `\\p{Property}=Value}`。例如，正则表达式\n\
  \n```javascript\n/p{Script=Han}+/u\n```\n匹配任何连续的汉字。使用大写的 `\\P` 补集：`\\P{L}` 匹配任何非字母的字符。\n\
  \n| 名称 | 描述 |\n| --- | --- |\n| `L` | 字母 |\n| `Lu` | 大写字母 |\n| `Ll` | 小写字母 |\n|\
  \ `Nd` | 十进制数字 |\n| `P` | 标点 |\n| `S` | 符号 |\n| `White_Space` | 空白，等同于 `\\s` |\n\
  | `Emoji` | Emoji 字符、修饰符或组件 |\n\n\n\n\n\n如果字符串包含给定正则表达式的匹配项，则 `test` 方法返回 `true`：\n\
  \n```\n/[0-9]+/.test('agent 007') // true\n```\n\n要测试整个字符串是否匹配，你的正则表达式必须使用开始和结束锚点：\n\
  \n```\n/^[0-9]+$/.test('agent 007') // false\n```\n\n`exec` 方法返回一个包含第一个匹配的子表达式的数组；如果没有匹配项，则返回\
  \ `null`。\n\n例如，\n\n```\n/[0-9]+/.exec('agents 007 and 008')\n```\n\n返回一个包含字符串 `'007'`\
  \ 的数组。（正如你将在接下来的节中将看到的，该数组也可以包含分组匹配项。）\n\n此外，`exec` 返回的数组有两个属性：\n\n*   `index` 是子表达式的索引\n\
  *   `input` 是传递给 `exec` 的参数\n\n换句话说，上一次调用 `exec` 返回的数组实际上是：\n\n点击此处查看代码图片\n\n```\n\
  ['007', index: 7, input: 'agents 007 and 008']\n```\n\n要匹配多个子表达式，请使用 `g` 或 `global`\
  \ 标记：\n\n```javascript\nlet digits = /[0-9]+/g\n```\n\n现在每次调用 `exec` 都会返回一个新的匹配项：\n\
  \n点击此处查看代码图片\n\n```\nresult = digits.exec('agents 007 and 008') // ['007', index:\
  \ 7, . . .]\n\nresult = digits.exec('agents 007 and 008') // ['008', index: 15,\
  \ . . .]\n\nresult = digits.exec('agents 007 and 008') // null\n```\n\n为了使此机制生效，`RegExp`\
  \ 对象有一个 `lastIndex` 属性，在每次成功执行 `exec` 调用后，该属性会被设置为匹配项后的第一个索引。下一次调用 `exec` 将从 `lastIndex`处开始匹配。当构造正则表达式或匹配失败时，`lastIndex`\
  \ 属性被设置为零。\n\n你也可以设置 `lastIndex` 属性来跳过字符串的一部分。\n\n使用 `y` 或 `sticky` 标记时，匹配必须恰好从\
  \ `lastIndex` 开始：\n\n点击此处查看代码图片\n\n```\ndigits = /[0-9]+/y\n\ndigits.lastIndex =\
  \ 5\n\nresult = digits.exec('agents 007 and 008') // null\n\ndigits.lastIndex =\
  \ 8\n\nresult = digits.exec('agents 007 and 008') // ['07', index: 8, . . .]\n```\n\
  \n![Images](img/note.jpg) 注意\n\n如果你只是简单地想要所有匹配子串的数组，请使用 `String` 类的 `match` 方法，而不是反复调用\
  \ `exec`——参见第 6.12 节，“带有正则表达式的字符串方法](#ch06.xhtml_ch06lev1sec12)”（第 133 页](#ch06.xhtml_page_133)）。\n\
  \n\n\n\n设置了全局标志（global flag）后，`match` 仅返回一个匹配项数组，这通常正是你需要的：\n\n点击此处查看代码图片\n\n```\n\
  'agents 007 and 008'.match(/[0-9]+/g) // ['007', '008']\n```\n\n如果没有匹配项，`String.match`\
  \ 方法将返回 `null`。\n\n![Images](img/note.jpg) 注意\n\n`RegExp.exec` 和 `String.match`\
  \ 是 ECMAScript 标准库中唯一返回 `null` 来表示无结果的方法。\n\n如果你正在进行全局搜索并希望获取所有匹配结果，而不是反复调用 `exec`，你可能会喜欢\
  \ `String` 类的 `matchAll` 方法（该方法目前是一个阶段 3 提案）。它返回一个包含所有匹配结果的可迭代器。假设你想查找正则表达式的所有匹配项：\n\
  \n点击此处查看代码图片\n\n```\nlet time = /([1-9]|1[0-2]):([0-5][0-9])([ap]m)/g\n```\n\n循环\n\
  \n点击此处查看代码图片\n\n```\nfor (const [, hours, minutes, period] of input.matchAll(time))\
  \ {\n\n  . . .\n\n}\n```\n\n遍历所有的匹配结果，使用解构赋值将 `hours`、`minutes` 和 `period` 设置为分组匹配项。初始的逗号忽略了整个匹配表达式。\n\
  \n`matchAll` 方法惰性地产生匹配项。如果有许多匹配项但只检查其中几个，它是高效的。\n\n`search` 方法返回第一个匹配项的索引，如果没有找到匹配项则返回\
  \ `-1`：\n\n点击此处查看代码图片\n\n```\nlet index = 'agents 007 and 008'.search(/[0-9]+/)\
  \ // 返回索引 7\n```\n\n`replace` 方法将正则表达式的第一个匹配项替换为替换字符串。要替换所有匹配项，请设置全局标志：\n\n点击此处查看代码图片\n\
  \n```\nlet replacement = 'agents 007 and 008'.replace(/[0-9]/g, '?')\n\n  // 'agents\
  \ ??? and ???'\n```\n\n![Images](img/note.jpg) 注意\n\n`split` 方法可以接受正则表达式作为参数。例如，\n\
  \n```\nstr.split(/\\s*,\\s*/)\n```\n\n根据可选空白周围的逗号对 `str` 进行分割。\n\n### 6.13 更多关于正则替换\n\
  \n![Images](img/cat.jpg)\n\n在本节中，我们将更地查看 `String` 类的 `replace` 方法。\n\n替换字符串参数可以包含以\
  \ `$` 开头的模式，其处理方式如表 6-6\n\n```\n'hello'.replace(/[aeiou]/g, '$&$&$&') // 'heeellooo'\n\
  ```\n\n最有用的模式是分组模式。在这里，我们使用分组来匹配每行中人的姓和名，并交换它们的位置：\n\n点击此处查看代码图片\n\n```\nlet names\
  \ = 'Harry Smith\\nSally Lin'\n\nlet flipped = names.replace(\n  /^([A-Z][a-z]+)\
  \ ([A-Z][a-z]+)/gm, \"$2, $1\")\n\n  // 'Smith, Harry\\nLin, Sally'\n```\n\n如果 `$`\
  \ 符号后的数字大于正则表达式中分组的数量，则该模式将原样插入：\n\n点击此处查看代码图片\n\n```\nlet replacement = 'Blackwell\
  \ Toaster $29.95'.replace('\\$29', '$19')\n\n  // 'Blackwell Toaster $19.95'—没有第\
  \ 19 组\n```\n\n你也可以使用命名分组：\n\n点击此处查看代码图片\n\n```\nflipped = names.replace(/^(?<first>[A-Z][a-z]+)\
  \ (?<last>[A-Z][a-z]+)$/gm,\n  \"$<last>, $<first>\")\n```\n\n对于更复杂的替换，你可以提供一个函数而不是替换字符串。函数接收以下参数：\n\
  \n* 正则表达式匹配的字符串\n* 所有分组的匹配项\n* 匹配的偏移量\n* 整个字符串\n\n在示例中，我们只处理分组匹配：\n\n点击此处查看代码图片\n\
  \n```\nfor (const [, hours, minutes, period] of input.matchAll(time)) {\n  console.log(`${hours}:${minutes}\
  \ ${period}`);\n}\n```\n\n`matchAll` 方法惰性地产生匹配项。如果有许多匹配项但只检查其中几个，它是高效的。\n\n`search`\
  \ 方法返回第一个匹配项的索引，如果没有找到匹配项则返回 `-1`：\n\n点击此处查看代码图片\n\n```\nlet index = 'agents 007\
  \ and 008'.search(/[0-9]+/) // 返回索引 7\n```\n\n`replace` 方法将正则表达式的第一个匹配项替换为替换字符串。要替换所有匹配项，请设置全局标志：\n\
  \n点击此处查看代码图片\n\n```\nlet replacement = 'agents 007 and 008'.replace(/[0-9]/g, '?')\n\
  \n  // 'agents ??? and ???'\n```\n\n![Images](img/note.jpg) 注意\n\n`split` 方法可以接受正则表达式作为参数。例如，\n\
  \n```\nstr.split(/\\s*,\\s*/)\n```\n\n根据可选空白周围的逗号对 `str` 进行分割。\n\n### 6.13 更多关于正则替换\n\
  \n![Images](img/cat.jpg)\n\n在本节中，我们将更深入地查看 `String` 类的 `replace` 方法。\n\n替换字符串参数可以包含以\
  \ `$` 开头的模式，其处理方式如表 6-6 所示。\n\n| 模式 | 说明 |\n| --- | --- |\n| `` $ ``, `$''` | 匹配字符串之前或之后的部分\
  \ |\n| `$&` | 匹配字符串 |\n| `$``n` | 第 n 个分组 |\n| `$<``name``>` | 给定命名的分组 |\n| `$$`\
  \ | 美元符号 |\n\n**表 6-6** 替换字符串模式\n\n例如，以下替换会将每个元音重复三次：\n\n点击此处查看代码图片\n\n```\n'hello'.replace(/[aeiou]/g,\
  \ '$&$&$&') // 'heeellooo'\n```\n\n最有用的模式是分组模式。在这里，我们使用分组来匹配每行中人的姓和名，并交换它们的位置：\n\
  \n点击此处查看代码图片\n\n```\nlet names = 'Harry Smith\\nSally Lin'\n\nlet flipped = names.replace(\n\
  \  /^([A-Z][a-z]+) ([A-Z][a-z]+)/gm, \"$2, $1\")\n\n  // 'Smith, Harry\\nLin, Sally'\n\
  ```\n\n如果 `$` 符号后的数字大于正则表达式中分组的数量，则该模式将原样插入：\n\n点击此处查看代码图片\n\n```\nlet replacement\
  \ = 'Blackwell Toaster $29.95'.replace('\\$29', '$19')\n\n  // 'Blackwell Toaster\
  \ $19.95'—没有第 19 组\n```\n\n你也可以使用命名分组：\n\n点击此处查看代码图片\n\n```\nflipped = names.replace(/^(?<first>[A-Z][a-z]+)\
