  - 7.2 `length` 属性和索引属性\n- 7.3 删除和添加元素\n- 7.4 其他数组变异器\n- 7.5 生成元素\n- 7.6 查找元素\n-\
  \ 7.7 访问所有元素\n- 7.8 稀疏数组\n- 7.9 归约\n- 7.10 映射 (Maps\n- 7.11 集合 (Sets\n- 7.12 弱映射和弱集合\
  \ (Weak Maps and Sets\n- 7.13 类型数组 (Typed Arrays\n- 7.14 数组缓冲区 (Array Buffers\n\
  - 练习题\n\n每当你学习一种新的编程语言时，你总是想知道如何存储数据。对于顺序数据，传统的选择数据结构是谦逊的数组。在本章中，你将学习 JavaScript\
  \ API 提供的各种数组方法。然后我们将转向类型数组和数组缓冲区——用于高效处理二进制数据块的高级结构。与 Java 或 C++ 不同，JavaScript\
  \ 没有提供丰富的数据结构，但我们在章节末尾讨论了简单的 map 和 set 类。\n\n### 7.1 构建数组\n\n你已经知道如何用给定的元素序列构造数组——只需写一个字面量即可：\n\
  \n点击此处查看代码图像\n\n```javascript\nconst names = ['Peter', 'Paul', 'Mary']\n```\n\n\
  以下是构造一个包含一万个元素的空数组的方法，所有元素初始都为 `undefined`：\n\n```javascript\nconst bigEmptyArray\
  \ = []\nbigEmptyArray.length = 10000\n```\n\n在数组字面量中，你可以放置任何*可迭代对象*的展开。数组和字符串、你将在本章后面看到的\
  \ set 和 map，以及来自 DOM API 的 `NodeList` 和 `HTMLCollection` 都是可迭代的。例如，这里是形成一个包含两个迭代对象\
  \ `a` 和 `b` 元素的数组的方法：\n\n```javascript\nconst elements = [...a, ...b]\n```\n\n正如你在第\
  \ 9 章 中看到的，可迭代对象具有相当复杂的结构。`Array.from` 方法从更简单的*类数组*（array-like）对象中收集元素。类数组对象是一个具有名为\
  \ `'length'` 的整数值属性，以及具有名为 `'0'`、`'1'`、`'2'` 等属性的的对象。当然，数组是类数组的，但 DOM API 的某些方法产生的不是数组的类数组对象。这时你可以调用\
  \ `Array.from(arrayLike)` 将元素放入数组中。\n\n点击此处查看代码图像\n\n```javascript\nconst arrayLike\
  \ = {length: 3, '0': 'Peter', '1': 'Paul', '2': 'Mary'}\nconst elements = Array.from(arrayLike)\n\
  // elements is ['Peter', 'Paul', 'Mary']\n// Array.isArray(arrayLike) is false\n\
  ```\n\n`Array.from` 方法接受一个可选的第二个参数，该函数会在从 0 到 `length − 1` 的所有索引值上被调用，传递元素（如果元素缺失则为\
  \ `undefined`）和索引。函数的结果收集到一个数组中。例如，\n\n点击此处查看代码图像\n\n```javascript\nconst squares\
  \ = Array.from({ length: 5 }, (element, index) => index * index)\n// [0, 1, 4, 9,\
  \ 16]\n```\n\n![Images](img/caution.jpg) 注意\n\n有一个构造函数用于构造给定元素的数组，你可以带或不带 `new`\
  \ 调用它：\n\n点击此处查看代码图像\n\n```javascript\nnames = new Array('Peter', 'Paul', 'Mary')\n\
  names = Array('Peter', 'Paul', 'Mary')\n```\n\n但它有一个陷阱。为 `new Array` 或 `Array` 传递单个数字参数会有完全不同的效果。单个参数表示数组的长度：\n\
  \n点击此处查看代码图像\n\n```javascript\nnumbers = new Array(10000)\n```\n\n结果是一个长度为 10000\
  \ 但没有元素的数组！\n\n我建议远离 `Array` 构造函数并使用数组字面量：\n\n点击此处查看代码图像\n\n```javascript\nnames\
  \ = ['Peter', 'Paul', 'Mary']\nnumbers = [10000]\n```\n\n![Images](img/note.jpg)\
  \ 注意\n\n工厂函数 `Array.of` 不存在 `Array` 构造函数的问题：\n\n点击此处查看代码图像\n\n```javascript\nnames\
  \ = Array.of('Peter', 'Paul', 'Mary')\nlittleArray = Array.of(10000) // 一个长度为 1\
  \ 的数组，等同于 [10000]\n```\n\n\n\n\n\n但它与数组字面量相比也没有任何优势。（练习 2 显示了 `of` 方法的一种微妙且不常见的用例。）\n\
  \n### 7.2 `length` 属性和索引属性\n\n每个数组都有一个 `'length'` 属性，其值是 0 到 $2^{32} - 1$ 之间的整数。数值为非负整数的属性被称为\
  \ `索引属性`（index properties）。例如，数组\n\n点击此处查看代码图像\n\n```javascript\nconst names = ['Peter',\
  \ 'Paul', 'Mary']\n```\n\n是一个具有 `'length'` 属性（值为 `3`）和索引属性 `'0'`、`'1'`、`'2'` 的对象。记住，属性键始终是字符串。\n\
  \n长度始终比最高索引大 1：\n\n点击此处查看代码图像\n\n```javascript\nconst someNames = [ , 'Smith', ,\
  \ 'Jones'] // someNumbers.length is 4\n```\n\n当给索引属性赋值时，长度会调整：\n\n点击此处查看代码图像\n\n\
  ```javascript\nsomeNames[5] = 'Miller' // Now someNames has length 6\n```\n\n你可以手动调整长度：\n\
  \n点击此处查看代码图像\n\n```javascript\nsomeNames.length = 100\n```\n\n如果减小了长度，任何索引大于或等于新长度的元素将被删除。\n\
  \n点击此处查看代码图像\n\n```javascript\nsomeNames.length = 4 // someNames[4] and beyond are\
  \ deleted\n```\n\n数组并不要求在 0 到 `length` - 1 之间的每个索引都拥有索引属性。ECMAScript 标准使用 `缺失元素`（missing\
  \ elements）一词来描述索引序列中的空隙。\n\n要检查某个元素是否缺失，你可以使用 `in` 运算符：\n\n点击此处查看代码图像\n\n```javascript\n\
  '2' in someNames // false—no property '2'\n3 in someNames // true; there is a property\
  \ '3'\n  // 注意左侧的操作数会被转换为字符串\n```\n\n![Images](img/note.jpg) 注意\n\n数组可以拥有不是索引属性的属性。这有时被用于向数组附加其他信息。例如，`RegExp`\
  \ 类的 `exec` 方法会产生一个匹配数组，并带有额外的 `index` 和 `input` 属性。\n\n点击此处查看代码图像\n\n```javascript\n\
  /([1-9]|1[0-2]):([0-5][0-9])([ap]m)/.exec('12:15pm')\n  // ['12:15pm', '12', '15',\
  \ 'pm', index: 0, input: '12:15pm']\n```\n\n![Images](img/caution.jpg) 注意\n\n包含负数的字符串（例如\
  \ `'-1'`）是一个有效属性，但它不是索引属性。\n\n点击此处查看代码图像\n\n```javascript\nconst squares = [0, 1,\
  \ 4, 9]\nsquares[-1] = 1 // [ 0, 1, 4, 9, '-1': 1 ]\n```\n\n### 7.3 删除和添加元素\n\n\
  以下调用：\n\n点击此处查看代码图像\n\n```javascript\nlet arr = [0, 1, 4, 9, 16, 25]\nconst deletedElement\
  \ = arr.pop() // arr is now [0, 1, 4, 9, 16]\nconst newLength = arr.push(x) // arr\
  \ is now [0, 1, 4, 9, 16, x]\n```\n\n在数组末尾删除或添加元素，并调整长度。\n\n![Images](img/note.jpg)\
  \ 注意\n\n与其调用 `pop` 和 `push`，你可以写：\n\n点击此处查看代码图像\n\n```javascript\narr.length--\n\
  arr[arr.length] = x\n```\n\n我更喜欢 `pop` 和 `push`，因为它们能更好地表达意图。\n\n要删除或添加初始元素，请调用：\n\
  \n点击此处查看代码图像\n\n```javascript\narr = [0, 1, 4, 9, 16, 25]\nconst deletedElement\
  \ = arr.shift() // arr is now [1, 4, 9, 16, 25]\nconst newLength = arr.unshift(x)\
  \ // arr is now [x, 1, 4, 9, 16, 25]\n```\n\n`push` 和 `unshift` 方法可以一次添加任意数量的元素：\n\
  \n点击此处查看代码图像\n\n```javascript\narr = [9]\narr.push(16, 25) // 16, 25 are appended;\
  \ arr is now [9, 16, 25]\narr.unshift(0, 1, 4) // 0, 1, 4 are prepended; arr is\
  \ now [0, 1, 4, 9, 16, 25]\n```\n\n使用 `splice` 方法在中间删除或添加元素：\n\n点击此处查看代码图像\n\n```javascript\n\
  const deletedElements = arr.splice(start, deleteCount, x1, x2...)\n```\n\n首先，从 `start`\
  \ 处删除 `deleteCount` 个元素。然后从 `start` 处插入提供的元素。\n\n点击此处查看代码图像\n\n```javascript\narr\
  \ = [0, 1, 24, 36]\nconst start = 2\n//  替换 arr[start] 和 arr[start + 1]\narr.splice(start,\
  \ 2, 16, 25) // arr is now [0, 1, 16, 25, 36]\n// 在索引 start 处添加元素\narr.splice(start,\
  \ 0, 4, 9) // arr is now [0, 1, 4, 9, 24, 36]\n// 删除索引 start 及之后的所有元素\narr.splice(start)\
  \ // arr is now [0, 1]\n```\n\n如果 `start` 是负数，则从数组的*末尾*计数（即通过加上 `arr.length` 计算）。\n\
  \n点击此处查看代码图像\n\n```javascript\narr = [0, 1, 4, 16]\narr.splice(-1, 1, 9) // arr\
  \ is now [0, 1, 4, 9]\n```\n\n`splice` 方法返回被删除元素的数组。\n\n点击此处查看代码图像\n\n```javascript\n\
  arr = [1, 4, 9, 16]\nconst spliced = arr.splice(1, 2) // spliced is [4, 9], arr\
  \ is [1, 16]\n```\n\n### 7.4 其他变异方法\n\n在本节中，你将看到删除和添加元素之外的 `Array` 类变异方法。\n\n`fill`\
  \ 方法用新值覆盖现有元素：\n\n```javascript\narr.fill(value, start, end)\n```\n\n`copyWithin`\
  \ 方法使用数组中的其他元素覆盖现有元素：\n\n点击此处查看代码图像\n\n```javascript\narr.copyWithin(targetIndex,\
  \ start, end)\n```\n\n在这两个方法中，`start` 默认认为 `0`，`end` 默认为 `arr.length`。如果 `start`、`end`\
  \ 或 `targetIndex` 为负数，它们从数组的末尾计数。\n\n是一些示例：\n\n点击此处查看代码图像\n\n```javascript\nlet\
  \ arr = [0, 1, 4, 9, 16, 25]\narr.copyWithin(0, 1) // arr is now [1, 4, 9, 16, 25,\
  \ 25]\narr.copyWithin(1) // arr is now [1, 1, 4, 9, 16, 25]\narr.fill(7, 3, -1)\
  \ // arr is now [1, 1, 4, 7, 7, 25]\n```\n\n`arr.reverse()` 原地反转 `arr`：\n\n点击此处查看代码图像\n\
  \n```javascript\narr = [0, 1, 4, 9, 16, 25]\narr.reverse() // arr is now [25, 16,\
  \ 9, 4, 1, 0]\n```\n\n调用：\n\n```javascript\narr.sort(comparisonFunction)\n```\n\n\
  原地排序 `arr`。比较函数比较两个元素 `x`, `y` 并返回：\n\n*   如果 `x` 应该在 `y` 之前，返回一个负数\n*   如果 `x`\
  \ 应该在 `y` 之后，返回一个正数\n*   如果它们不可区分，返回 `0`\n\n例如，以下是如何对数字数组进行排序的方法：\n\n点击此处查看代码图像\n\
  \n```javascript\narr = [0, 1, 16, 25, 4, 9]\narr.sort((x, y) => x - y) // arr is\
  \ now [0, 1, 4, 9, 16, 25]\n```\n\n![Images](img/caution.jpg) 注意\n\n如果未提供比较函数，`sort`\
  \ 方法会将元素转换为字符串并对其进行比较——参见练习 5。对于数字来说，这可能是世界上糟糕的比较函数：\n\n点击此处查看代码图像\n\n```javascript\n\
  arr = [0, 1, 4, 9, 16, 25]\narr.sort() // arr is now [0, 1, 16, 25, 4, 9]\n```\n\
  \n\n\n\n\n`Array` 类中最有方法汇总在 表 7-1 中。\n\n| 名称 | 描述 |\n| --- | --- |\n| **函数** | |\n\
  | `from(arraylike, f)` | 从任何具有 `'length'`、`'0'`、`'1'` 等属性的对象创建数组。如果存在函数 `f`，则将其应用于每个元素。\
  \ |\n| **变异方法** | |\n| `pop()`, `shift()` | 移除并返回最后一个元素 |\n| `push(value)`, `unshift(value)`\
  \ | 在此数组末尾或开头添加 `value` 并返回新长度 |\n| `fill(value, start, end)` | 用 `value` 覆盖给定范围。对于此方法及后续方法，除非另有，否则适用以下规则：如果\
  \ `start` 或 `end` 为负数，则从数组末尾开始计数。范围包含 `start` 但不包含 `end`。`start` 和 `end` 的默认值分别为\
  \ `0` 和数组长度。该方法返回此数组。 |\n| `copyWithin(targetIndex, start, end)` | 将给定范围复制到目标索引\
  \ |\n| `reverse()` | 反转此数组的元素 |\n| `sort(comparisonFunction)` | 排序此数组 |\n| `splice(start,\
  \ deleteCount, values...)` | 移除并返回索引 `start` 处的 `deleteCount` 个元素，然后在 `start` 处插入给定值\
  \ |\n| **非变异方法** | |\n| `slice(start, end)` | 返回给定范围内的元素 |\n| `includes(target,\
  \ start)`, `firstIndex(target, start)`, `lastIndex(target, start)` | 如果数组在索引 `start`\
  \ 处或之后包含 `target`，这些方法返回 `true` 或索引；否则返回 `false` 或 `-1` |\n| `flat(k)` | 返回数组的元素，将任何维度\
  \ ≤`k` 的数组替换为其元素。`k` 的默认值为 `1`。 |\n| `map(f)`, `flatMap(f)`, `forEach(f)` | 在每个元素上调用给定函数，并返回结果数组、平坦后的结果或\
  \ `undefined` |\n| `filter(f)` | 返回所有 `f` 返回真值（truish）结果的元素 |\n| `findIndex(f)`,\
  \ `find(f)` | 返回第一个使 `f` 返回真值的元素的索引或值。函数 `f` 被调用时有三个参数：元素、索引和数组。 |\n| `every(f)`,\
  \ `some(f)` | 如果 `f` 对每个元素或至少一个元素返回真值，则返回 `true` |\n| `join(separator)` | 返回一个字符串，由所有元素转为字符串并用指定的分隔符（默认为\
  \ `','`）分隔组成 |\n\n**表 7-1** `Array` 类的有用函数和方法\n\n对于人类语言中的字符串进行排序，`localeCompare`\
  \ 方法是一个很好的选择：\n\n点击此处查看代码图像\n\n```javascript\nconst titles = . . .\n\ntitles.sort((s,\
  \ t) => s.localeCompare(t))\n```\n\n第 8 章 提供了更多关于基于区域的比较的信息。\n\n![Images](img/note.jpg)\
  \ 注意\n\n自 2019 年起，`sort` 方法保证是**稳定**的。也就是说，不可区分元素的顺序不会被破坏。例如，假设你有一组之前按日期排序的消息序列。如果你现在按发送者对其进行排序，那么具有相同发送者的消息将继续保持按日期排序。\n\
  \n### 7.5 产生元素\n\n从现在开始引入的所有方法都不会修改它们操作的数组。\n\n以下方法会产生包含现有数组元素的新数组。\n\n调用\n\n```javascript\n\
  arr.slice(start, end)\n```\n\n会产生一个包含给定范围内元素的数组。`start` 索引默认为 `0`，`end` 认为 `arr.length`。\n\
  \n`arr.slice()` 等同于 `[...arr]`。\n\n`flat` 方法可以平坦多维数组。默认值是平坦一层。\n\n```javascript\n\
  [[1, 2], [3, 4]].flat()\n```\n\n产生数组\n\n```javascript\n[1, 2, 3, 4]\n```\n\n在具有超过两个维度的数组的罕见情况下，你可以指定想要平坦的层数。这是一个从三维到一维的平坦：\n\
  \n点击此处查看代码图像\n\n```javascript\n[[[1, 2], [3, 4]], [[5, 6], [7, 8]]].flat(2) // [1,\
  \ 2, 3, 4, 5, 6, 7, 8]\n```\n\n调用\n\n```javascript\narr.concat(arg1, arg2, . . .)\n\
  ```\n\n会产生一个以 `arr` 开头的数组，并在其后附加参数。然而，有一个特殊：数组参数会被平坦。\n\n点击此处查看代码图像\n\n```javascript\n\
  const arr = [1, 2]\nconst arr2 = [5, 6]\nconst result = arr.concat(3, 4)\n```\n\n\
  自 2019 年起，`sort` 方法保证是稳定的。也就是说，不可区分元素的顺序不会被破坏。例如，假设你有一组之前按日期排序的消息序列。如果你现在按发送者对其进行排序，那么具有相同发送者的消息将继续保持按日期排序。\n\
  \n### 7.6 查找元素\n\n以下调用检查数组中是否包含特定值。\n\n点击此处查看代码图像\n\n```javascript\nconst found\
  \ = arr.includes(target, start) // true 或 false\nconst firstIndex = arr.indexOf(target,\
  \ start) // 首次索引或 -1\nconst lastIndex = arr.lastIndexOf(target, start) // 最后一次索引或\
  \ -1\n```\n\ntarget 使用 `===` 进行严格匹配。搜索从 `start` 开始。如果 `start` 为负数，则从数组末尾开始。如果省略\
  \ `start`，则默认为 `0`。\n\n如果你想查找满足条件的值，调用以下方法之一：\n\n```javascript\nconst firstIndex\
  \ = arr.findIndex(conditionFunction)\nconst firstElement = arr.find(conditionFunction)\n\
  ```\n\n例如，这里是如何找到数组中的第一个负数：\n\n```javascript\nconst firstNegative = arr.find(x =>\
  \ x < 0)\n```\n\n对于本节的后续方法，条件函数接收三个参数：\n\n- 数组元素\n- 索引\n- 整个数组\n\n```javascript\n\
  arr.every(conditionFunction)\narr.some(conditionFunction)\n```\n\n如果 `conditionFunction(element,\
  \ index, arr)` 对每个元素或至少一个元素返回 `true`，则返回 `true`。\n\n例如：\n\n```javascript\nconst\
  \ atLeastOneNegative = arr.some(x => x < 0)\n```\n\n`filter` 方法产生所有条件的值：\n\n```javascript\n\
  const negatives = [-1, 7, 2, -9].filter(x => x < 0) // [-1, -9]\n```\n\n### 7.7\
  \ 访问所有元素\n\n要访问数组的所有元素，可以使用 `for of` 循环顺序访问所有元素，或者使用 `for in` 循环访问所有的索引值。\n\n```javascript\n\
  for (const e of arr) {\n  // 对元素 e 执行某些操作\n}\n\nfor (const i in arr) {\n  // 对索引\
  \ i 和元素 arr[i] 执行某些操作\n}\n```\n\n\n\n\n\n![Images](img/note.jpg) 笔记\n\n`for of`\
  \ 循环会查找从 0 到 `length` − 1 之间所有索引值的元素，对于缺失的元素会产生 `undefined`。相比之下，`for in` 循环只访问存在的键。\n\
  \n换句话说，`for in` 循环将数组视为一个对象，而 `for of` 循环将数组视为一个可迭代对象。（正如你在第 12 章中看到的，可迭代对象是没有间隙的值序列。）\n\
  \n如果你想同时访问索引值和元素，请使用 `entries` 方法返回的迭代器。它会产生长度为 2 的数组，包含每个索引和元素。此循环使用了 `entries`\
  \ 方法、`for of` 循环和解构赋值：\n\n点击此处查看代码图像\n\n```\nfor (const [index, element] of arr.entries())\
  \ {\n   console.log(index, element)\n}\n```\n\n![Images](img/note.jpg) 笔记\n\n`entries`\
  \ 方法为所有 JavaScript 数据结构（包括数组）定义。存在对应的 `keys` 和 `values` 方法，它们产生产生集合中键和值的迭代器。这些对于处理通用集合非常有用。如果你知道自己正在处理一个数组，就不需要它们。\n\
  \n调用 `arr.forEach(f)` 会为每个元素调用 `f(element, index, arr)`，跳过缺失的元素。此调用\n\n点击此处查看代码图像\n\
  \n```\narr.forEach((element, index) => console.log(index, element))\n```\n\n等同于\n\
  \n点击此处查看代码图像\n\n```\nfor (const index in arr) console.log(index, arr[index])\n```\n\
  \n与其为每个元素指定一个操作，往往转换元素并收集结果更好。调用 `arr.map(f)` 会产生一个包含所有由 `f(arr[index], index, arr)`\
  \ 返回值的数组：\n\n点击此处查看代码图像\n\n```\n[1, 7, 2, 9].map(x => x * x) // [1, 49, 4, 81]\n\
  [1, 7, 2, 9].map((x, i) => x * 10 ** i) // [1, 70, 200, 9000]\n```\n\n考虑一个返回值数组的函数：\n\
  \n点击此处查看代码图像\n\n```\nfunction roots(x) {\n  if (x < 0) {\n    return [] // 无根\n\
  \  } else if (x === 0) {\n    return [0] // 单根\n  } else {\n    return [Math.sqrt(x),\
  \ -Math.sqrt(x)] // 两个根\n  }\n}\n```\n\n当你将此函数映射到输入数组时，你会得到一个包含数组值答案的数组：\n\n点击此处查看代码图像\n\
  \n```\n[-1, 0, 1, 4].map(roots) // [[], [0], [1, -1], [2, -2]]\n```\n\n如果你想展平结果，可以调用\
  \ `map` 后再调用 `flat`，或者调用 `flatMap`，后者效率更高：\n\n点击此处查看代码图像\n\n```\n[-1, 0, 1, 4].flatMap(roots)\
  \ // [0, 1, -1, 2, -2]\n```\n\n最后，调用 `arr.join(separator)` 将所有元素转换为字符串并用给定的分隔符连接它们。默认分隔符是\
  \ `','`。\n\n点击此处查看代码图像\n\n```\n[1,2,3,[4,5]].join(' and ') // '1 and 2 and 3 and\
  \ 4,5'\n```\n\n![Images](img/note.jpg) 笔记\n\n`forEach`, `map`, `filter`, `find`,\
  \ `findIndex`, `some` 和 `every` 方法（但不包括 `sort` 或 `reduce`），以及 `from` 函数，在函数参数之后接收一个可选参数：\n\
  \n点击此处查看代码图像\n\n```\narr.forEach(f, thisArg)\n```\n\n`thisArg` 参数将成为 `f` 的 `this`\
  \ 参数。也就是说，\n\n点击此处查看代码图像\n\n```\nthisArg.f(arr[index], index, arr)\n```\n\n会对每个索引进行调用。\n\
  \n只有当你传递一个方法而不是函数时，才需要 `thisArg` 参数。练习 4 展示了你如何避免这种情况。\n\n### 7.8 稀疏数组\n\n![Images](img/cat.jpg)\n\
  \n包含一个或多个缺失元素的数组被称为 `sparse`（稀疏）。稀疏数组可能出现在四种情况：\n\n1. **数组字面量中的缺失元素**：\n   点击此处查看代码图像\n\
  \   ```\n   const someNumbers = [ , 2, 9]\n   ```\n2. **在长度之外添加元素**：\n   点击此处查看代码图像\n\
  \   ```\n   someNumbers[100] = 0 // 无属性\n   ```\n3. **增加长度**：\n   点击此处查看代码图像\n \
  \  ```\n   const bigEmptyArray = []\n   bigEmptyArray.length = 100 // 无索引\n   ```\n\
  4. **删除元素**：\n   点击此处查看代码图像\n   ```\n   delete someNumbers[1] // 无索引\n   ```\n\n\
  数组中的大多数方法都会跳过缺失元素。例如，`[ , 2, 9].forEach(f)` 仅调用 `f` 两次。正如你在构建数组中看到的，`Array.from()`\
  \ 是一个例外：`[ , 2, 9].Array.from()` 会产生 `undefined`。\n\n`filter`, `flat` 和 `flatMap`\
  \ 会跳过缺失元素。一种从数组中消除缺失元素的简单方法是使用接收所有元素的 `filter`：\n\n点击此处查看代码图像\n\n```\n[ , 2, 9].filter(x\
  \ => true) // [2, 9]\n```\n\n`join` 方法会将缺失元素转换为字符串：`[ , 2, 9].join(' ')` 产生 `undefined`。\n\
  \n大多数方法都会保留缺失元素的位置。例如，`for (const index in arr) console.log(index, arr[index])`。然而，`sort`\
  \ 方法会将缺失元素放在末尾：\n\n点击此处查看代码图像\n\n```\nlet someNumbers = [ , 2, 9]\nsomeNumbers.sort((x,\
  \ y) => y - x) // 9\n```\n\n（敏锐的读者可能注意到有四个逗号。最后一个逗号是结尾的。如果它不存在，那么前面的逗号将是 `undefined`。）\n\
  \n`[ , 2, 9].forEach(f)` 仅调用 `f` 两次\n\n### 7.9 归约\n\n![Images](img/cat.jpg)\n\n\
  本节讨论了从数组元素计算值的通用机制。这种机制非常优雅，但坦率地说，并非必要——可以使用简单的循环实现相同的效果。如果你觉得它感兴趣，可以跳过本节。\n\n`map`\
  \ 方法将一元函数应用于集合的所有元素。我们在本节讨论的 `reduce` 和 `reduceRight` 方法通过二元操作组合元素。调用 `arr.reduce(op)`\
  \ 以如下方式应用于连续元素：\n\n点击此处查看代码图像\n\n```\n .\n            .\n           .\n        \
  \  op\n         /  \\\n        op   arr[3]\n       /  \\\n      op   arr[2]\n  \
  \   /  \\\narr[0]  arr[1]\n```\n\n例如，这里是计算数组元素和：\n\n点击此处查看代码图像\n\n```\nconst arr\
  \ = [1, 7, 2, 9]\nconst result = arr.reduce((x, y) => x + y) // ((1 + 7) + 2) +\
  \ 9\n```\n\n这是一个更有的归约，从数字数组中计算十进制数值：\n\n点击此处查看代码图像\n\n```\n[1, 7, 2, 9].reduce((x,\
  \ y) => 10 * x + y) // 1729\n```\n\n此树状图显示了中间结果：\n\n点击此处查看代码图像\n\n```\n 1729\n \
  \          /   \\\n         172    9\n        /   \\\n      17     2\n     /  \\\
  \n    1    7\n```\n\n\n\n\n在大多数情况下，使用除数组第一个元素之外的初始值开始计算是有用的。`arr.reduce(op, init)`\
  \ 的计算如下：\n\n点击此处查看代码图片\n\n```\n.\n.\n.\n        op\n       /  \\\n      op   arr[2]\n\
  \     /  \\\n    op   arr[1]\n   /  \\\ninit   arr[0]\n```\n\n与不带初始值的 `reduce` 树形图相比，这个图更具规律。所有数组元素都在树的右侧。每次操作都会将一个累加值（从初始值开始）和一个数组元素结合。\n\
  \n例如，\n\n点击此处查看代码图片\n\n```\n[1, 7, 2, 9].reduce((accum, current) => accum - current,\
  \ 0)\n```\n\n结果为：\n\n```\n0 − 1 − 7 − 2 − 9 = −19\n```\n\n如果没有初始值，结果将是 `1 − 7 −\
  \ 2 − 9`，这并不是所有元素的差值。\n\n当数组为空时，返回初始值。例如，如果你定义了：\n\n点击此处查看代码图片\n\n```\nconst sum\
  \ = arr => arr.reduce((accum, current) => accum + current, 0)\n```\n\n那么空数组之和为 `0`。在没有初始值的情况下还原空数组会抛出异常。\n\
  \n回调函数实际上接收四个参数：\n\n*   累加值\n*   当前数组元素\n*   当前元素的索引\n*   整个数组\n\n在这个示例中，我们收集了所有符合条件的元素的位置：\n\
  \n点击此处查看代码图片\n\n```\nfunction findAll(arr, condition) {\n  return arr.reduce((accum,\
  \ current, currentIndex) =>\n    condition(current) ? [...accum, currentIndex] :\
  \ accum, [])\n}\n\nconst odds = findAll([1, 7, 2, 9], x => x % 2 !== 0)\n  // [0,\
  \ 1, 3], 所有奇数元素的位置\n```\n\n`reduceRight` 方法从数组末尾开始，按反序访问元素。\n\n点击此处查看代码图片\n\n```\n\
  \ op\n                   /  \\\n                  .    arr[0]\n                \
  \ .\n                .\n               /\n              op\n             /  \\\n\
  \            op   arr[n-2]\n           /  \\\n        init   arr[n-1]\n```\n\n例如，\n\
  \n点击此处查看代码图片\n\n```\n[1, 2, 3, 4].reduceRight((x, y) => [x, y], [])\n```\n\n结果为：\n\
  \n```\n[[[[[], 4], 3], 2], 1]\n```\n\n![Images](img/note.jpg) 注意\n\nJavaScript 中的右向还原类似于\
  \ Lisp 类语言中的右折叠（right fold），但操作数的顺序是反的。\n\n还原可以用来代替循环。例如，假设我们想要统计字符串中字母出现的频率。一种方法是访问每个字母并更新一个对象。\n\
  \n点击此处查看代码图片\n\n```\nconst freq = {}\n\nfor (const c of 'Mississippi') {\n  if (c\
  \ in freq) {\n    freq[c]++\n  } else {\n    freq[c] = 1\n  }\n}\n```\n\n这里另一种思考这种问题的方法。在每一步中，将频率映射和新遇到的字母结合，产生一个新的频率映射。这就是还原：\n\
  \n点击此处查看代码图片\n\n```\n .\n               .\n              .\n             op\n  \
  \          /  \\\n           op   's'\n          /  \\\n         op   'i'\n    \
  \    /  \\\nempty map  'M'\n```\n\n什么是 `op`？左操作数是部分填充的频率映射，右操作数是新字母。结果是增强后的映射。它成为下一次调用\
  \ `op` 的输入，最后，结果是一个包含所有计数的映射。代码如下：\n\n点击此处查看代码图片\n\n```\n[...'Mississippi'].reduce(\n\
  \  (freq, c) => ({ ...freq, [c]: (c in freq ? freq[c] + 1 : 1) }),\n  {})\n```\n\
  \n在还原函数中，创建了一个新对象，从 `freq` 对象的拷贝开始。然后，与键 `c` 关联的值设置为前一个值加 1（如果有），或者设置为 `1`。\n\n\
  注意，在这种方法中，没有状态被变异。在每一步中，都会计算出一个新对象。\n\n可以将任何循环替换为`reduce` 的调用。将循环中更新的所有变量放入一个对象中，并定义一个实现循环中一步的操作，产生一个带有更新变量的新对象。我并不是说这总是好主意。\n\
  \n### 7.10 Maps\n\nJavaScript 提供了一个 `Map` 类，它是键值对的集合。与对象不同，`Map` 记得元素的顺序。\n\n* \
  \  对象的键必须是字符串或符号，但 `Map` 的键可以是任何类型。\n*   你可以通过 `size` 属性找到元素的数量。\n\n要构造 map，你可以提供迭代器：\n\
  \n点击此处查看代码图片\n\n```\nconst weekdays = new Map(\n  [\"Mon\", 0], [\"Tue\", 1], [\"\
  Wed\", 2], [\"Thu\", 3], [\"Fri\", 4], [\"Sat\", 5]\n)\n```\n\n或者你可以构造一个空 map 稍后添加：\n\
  \n点击此处查看代码图片\n\n```\nconst emptyMap = new Map()\n```\n\nAPI 非常直观。`set` 方法添加元素并返回\
  \ map 以链式调用：\n\n点击此处查看代码图片\n\n```\nmap.set(key, value).set(key2, value2)\n```\n\n\
  要移除一个元素，调用：\n\n点击此处查看代码图片\n\n```\nmap.delete(key) // 如果键存在返回 true，否则返回 false\n```\n\
  \n`clear` 方法移除所有元素。\n\n要测试某个键是否存在，调用：\n\n点击此处查看代码图片\n\n```\nif (map.has(key)) .\
  \ . .\n```\n\n使用 `get` 获取键的值：\n\n点击此处查看代码图片\n\n```\nconst value = map.get(key) //\
  \ 如果键不存在则返回 undefined\n```\n\nMap 是迭代的，产生 `[key, value]` 对。因此，你可以轻松地通过 `for of`\
  \ 循环访问所有元素：\n\n```\nfor (const [key, value] of map) {\n  console.log(key, value)\n\
  }\n```\n\n或者，使用 `forEach` 方法：\n\n点击此处查看代码图片\n\n```\nmap.forEach((value, key) =>\
  \ {\n  console.log(key, value)\n})\n```\n\nMap 按插入顺序遍历。考虑这个 map：\n\n点击此处查看代码图片\n\
  \n```\nconst weekdays = new Map([['Mon', 0], ['Tue', 1], . . ., ['Sun', 6]])\n```\n\
  \n`for of` 循环和 `forEach` 方法都会尊重你插入元素的顺序。\n\n![Images](img/note.jpg) 注意\n\n在 Java\
  \ 中，你会使用 `LinkedHashMap` 按插入顺序访问元素。在 JavaScript 中，跟踪插入顺序是自动的。\n\n![Images](img/note.jpg)\
  \ 注意\n\nMap 与所有的 JavaScript 集合一样，拥有 `keys`、`values` 和 `entries` 方法，产生键、值和键值对的迭代器。如果你只想遍历键，可以使用循环：\n\
  \n```\nfor (const key of map.keys()) . . .\n```\n\n\n\n\n在 `Java` 和 `C++` 等编程语言中，你可以选择哈希表（hash\
  \ maps）或树映射（tree maps），并且必须自己编写哈希函数或比较函数。在 `JavaScript` 中，你总是获得一个哈希表，并且无法选择哈希函数。\n\
  \nJavaScript `Map` 的哈希函数与*键等等性*兼容：`===`，但所有的 `NaN` 都相等。哈希值是从原始类型值或对象引用派生的。\n\n如果你的键是字符串或数字，或者你乐意通过身份标识来比较键，那么就是没问题的。例如，你可以使用\
  \ map 将值与 DOM 节点关联。这比直接在节点对象上添加属性要好。\n\n当你使用其他对象作为键时，必须小心。不同的对象是不同的键，即使它们的值相同：\n\
  \n点击此处查看代码图片\n\n```\nconst map = new Map()\n\nconst key1 = new Date('1970-01-01T00:00:00.000Z')\n\
  \nconst key2 = new Date('1970-01-01T00:00:00.000Z')\n\nmap.set(key1, 'Hello')\n\n\
  map.set(key2, 'Epoch') // 现在 map 有两个条\n```\n\n如果这不是你想要的，请考虑选择不同的键，例如示例中的日期字符串。\n\
  \n### 7.11 Sets 集合\n\n`Set` 是一种收集不重复元素的数据结构。\n\n通过如下方式构造集合：\n\n点击此处查看代码图片\n\n```\n\
  const emptySet = new Set()\n\nconst setWithElements = new Set(iterable)\n```\n\n\
  其中 `iterable` 产生元素。\n\n与 map 一样，`size` 属性产生元素的数量。\n\n集合的 API 比 map 的还要简单：\n\n点击此处查看代码图片\n\
  \n```\nset.add(x)\n  // 如果不存在则添加 x 并返回 set 以进行链式调用\n\nset.delete(x)\n  // 如果 x 存在，则删除\
  \ x 并返回 true，否则返回 false\n\nset.has(x) // 如果 x 存在则返回 true\n\nset.clear() // 删除所有元素\n\
  ```\n\n要访问集合的所有元素，你可以使用 `for of` 循环：\n\n点击此处查看代码图片\n\n```\nfor (const value of set)\
  \ {\n  console.log(value)\n}\n```\n\n或者，你可以使用 `forEach` 方法：\n\n点击此处查看代码图片\n\n```\n\
  set.forEach(value => {\n  console.log(value)\n})\n```\n\n就像 map 一样，集合会记住插入顺序。例如，假设你按顺序添加了周几名称：\n\
  \n点击此处查看代码图片\n\n```\nconst weekdays = new Set(['Mon', 'Tue', 'Wed', 'Thu', 'Fri',\
  \ 'Sat', 'Sun'])\n```\n\n然后 `for of` 循环和 `forEach` 方法将按此顺序遍历元素。\n\n![Images](img/note.jpg)\
  \ 注意\n\n集合被视为一个 `[value, value]` 对的映射。`keys` 和 `values` 方法都会产生一个关于值的迭代器，而 `entries`\
  \ 方法产生一个关于 `[value, value]` 对的迭代器。当你处理已知的集合时，这些方法都没有用处。它们是用于处理泛型集合的代码。\n\n与 map\
  \ 一样，集合被实现为具有预定义哈希函数的哈希表。如果集合元素是相同的原始类型值或相同的对象引用，则它们被认为是相同的。此外，`NaN` 值彼此相等。\n\n\
  ### 7.12 Weak Maps and Sets 弱引用映射与集合（弱引用集合）\n\n![Images](img/cat.jpg)\n\nJavaScript\
  \ map 和集合的一个重要用例是将属性附加到 DOM 节点。假设我们要对某些节点进行分类，以表示成功、进行中或错误。我们可以直接将属性附加到节点：\n\n```\n\
  node.outcome = 'success'\n```\n\n这通常运行得良好，但有点脆弱。DOM 节点有许多属性，如果其他人或未来版本的 DOM API\
  \ 使用了相同的属性，就会出现麻烦。\n\n使用 map 会更健壮：\n\n点击此处查看代码图片\n\n```\nconst outcome = new Map()\n\
  . . .\noutcome.set(node, 'success')\n```\n\nDOM 节点来来去去。如果某个节点不再被需要，它应该被垃圾回收。然而，如果节点引用存在于\
  \ `outcome` map 中，该引用将保持节点对象存活。\n\n这就是*weak maps*（弱映射）的作用所在。如果弱 map 中的键是对象的唯一引用，那么该对象就不会被垃圾回收器保持存活。\n\
  \n只需使用弱 map 来收集属性：\n\n```\nconst outcome = new WeakMap()\n```\n\n弱 map 没有遍历方法，map\
  \ 对象不是可迭代的。唯一的方法是 `set`、`delete`、`has` 和 `get`。对于设置属性和检查给定对象的属性来说足够了。\n\n如果你要监控的属性是二进制的，你可以使用\
  \ `WeakSet`。\n\n### 7.13 Typed Arrays 类型数组\n\n![Images](img/cat.jpg)\n\nJavaScript\
  \ 数组存储数字的序列。如果你想高效地存储数字，可以使用*类型数组*。以下是类型：\n\n点击此处查看代码图片\n\n```\n`Int8Array`\n`Uint8Array`\n\
  `Uint8ClampedArray`\n`Int16Array`\n`Uint16Array`\n`Int32Array`\n`Uint32Array`\n\
  `Float32Array`\n`Float64Array`\n```\n\n`Int8Array` 存储 -128 到 127 的有符号整数。`Uint8Array`\
  \ 存储 0 到 255 的无符号整数。`Uint8ClampedArray` 存储 8 位无符号整数但会将值限制在 0 或 255。`Int16Array`\
  \ 存储 -32768 到 32767 的有符号整数。`Uint16Array` 存储 0 到 65535 的无符号整数。`Int32Array` 存储 -2147483648\
  \ 到 2147483647 的有符号整数。`Uint32Array` 存储 0 到 4294967295 的无符号整数。`Float32Array` 存储 32\
  \ 位浮点数。`Float64Array` 存储 64 位浮点数。\n\n与普通数组不同，类型数组具有不可更改的长度。你可以通过向构造函数传递长度或可迭代对象来创建它们：点击此处查看代码图片\n\
  \n```\nconst iarr = new Int8Array(10)\nconst iarr = new Int8Array([1, 2, 3])\n```\n\
  \n向 0 到 `length`-1 之间的整数索引赋值没有效果。然而，与普通数组一样，你可以设置其他属性：点击此处查看代码图片\n\n```\nfarr[-1]\
  \ = 2 // 没有效果\nfarr[0.5] = 1.4121 // 没有效果\nfarr.lucky = true // 设置 lucky 属性\n```\n\
  \n向整数元素赋值数字时，任何小数部分都会丢弃。然后数字会被截断以适应整数范围。考虑这个示例：点击此处查看代码图片\n\n```\niarr[0] = 40000.25\
  \ // 将 iarr[0] 设置为 -25536\n```\n\n只使用整数部分。由于 `40000` 无法放入 32 位整数范围，因此取了最后的 32 位，这些位正好代表\
  \ -25536。\n\n这种截断过程的一个例外是 `Uint8ClampedArray`，它会将范围值设置为 0 或 255，并将非整数舍入到最近整数。\n\n\
  与数组一样，有一个 `from` 函数可以接收任何可迭代对象，并带有可选的映射函数：点击此处查看代码图片\n\n```\nconst uarr = Uint32Array.from(farr,\
  \ x => 1 / x)\n  // 一个元素为 [1, 2, 4, 8, 16, 32] 的 Uint32Array\n```\n\n\n\n本书的配套代码包含一个示例程序，当你点击画布时，画布内容会变为反色——参见图\
  \ 7-1。\n\n点击此处查看代码图像\n\n```javascript\ncanvas.addEventListener('click', event =>\
  \ {\n  for (let i = 0; i < rgba.length; i++) {\n    if (i % 4 != 3) rgba[i] = 255\
  \ - rgba[i]\n  }\n  ctx.putImageData(imgdata, 0, 0)\n})\n```\n\n![Images](img/pg162_Image_463.jpg)\n\
  \n图 7-1 点击时画布内容会变为反色\n\n类型数组（Typed arrays）拥有普通数组的所有方法，但例外：\n\n*   `push`, `pop`,\
  \ `shift`, `unshift`——你不能更改类型数组的大小\n*   `flat`, `flatMap`——类型数组不能包含数组\n*   `concat`——请使用\
  \ `set` 代替\n\n普通数组有两个方法是类型数组不具备的。`set` 方法根据偏移量从数组或类型数组拷贝值：\n\n点击此处查看代码图像\n\n```javascript\n\
  targetTypedArray.set(source, offset)\n```\n\n默认情况下，`offset` 为零。源数据必须完全放入目标。如果 `offset`\
  \ 和源长度超过了目标长度，则会抛出 `RangeError`。（这意味着你不能使用此方法来移动类型数组的元素。）\n\n`subarray` 方法产生一个元素子范围的视图：\n\
  \n点击此处查看代码图像\n\n```javascript\nconst sub = iarr.subarray(16, 32)\n```\n\n如果省略，则结束索引为数组的长度，起始索引为零。\n\
  \n这看起来与 `slice` 方法完全相同，但存在一个重要的区别。数组和子数组共享相同的元素。修改其中任何一个，其变化都会反映在另一个上。\n\n点击此处查看代码图像\n\
  \n```javascript\nsub[0] = 1024 // 现在 iarr[16] 也是 1024\n```\n\n### 7.14 Array Buffers\n\
  \n![Images](img/cat.jpg)\n\n*数组缓冲区*（array buffer）是一个连续的字节序列，可以存储来自文件、数据流、图像等的数据。类型数组的数据也存储在数组缓冲区中。\n\
  \n许多 Web API（包括 `File API`、`XMLHttpRequest` 和 `WebSockets`）都会产生数组缓冲区。你也可以根据指定的字节数构造一个数组缓冲区：\n\
  \n点击此处查看代码图像\n\n```javascript\nconst buf = new ArrayBuffer(1024 * 2)\n```\n\n通常，数组缓冲区中的二进制数据具有复杂的结构，例如图像或声音文件。此时使用\
  \ `DataView` 来查看内部数据：\n\n```javascript\nconst view = new DataView(buf)\n```\n\n\
  使用 `DataView` 方法 `getInt8`, `getInt16`, `getInt32`, `getUInt8`, `getUInt16`, `getUInt32`,\
  \ `getFloat32`, `getFloat64` 在给定偏移量处读取值：\n\n点击此处查看代码图像\n\n```javascript\nconst littleEndian\
  \ = true // 大端序字节序用 false 或省略\nconst value = view.getUint32(offset, littleEndian)\n\
  ```\n\n使用 `set` 方法写入数据：\n\n点击此处查看代码图像\n\n```javascript\nview.setUint32(offset, newValue,\
  \ littleEndian)\n```\n\n![Images](img/note.jpg) 注意\n\n将二进制数据以字节序列形式存储有两种方式，被称为“大端序”（big-endian）和“小端序”（little-endian）。考虑\
  \ 16 位值 `0x2122`。在大端序方式下，高位字节在前：`0x21` 紧随其 `0x22`。小端序则是相反的：`0x22 0x21`。\n\n大多数现代处理器都是小端序，但许多常见的文件格式（如\
  \ PNG 和 JPEG）使用大端序。\n\n“大端序”和“小端序”这两个术语本身非常合理，但实际上是借自《格列列夫游记》中的一段讽刺文字。\n\n类型数组的缓冲区始终使用宿主平台的端序。如果整个缓冲区数据是一个数组，且你知道端序与宿主平台匹配，你可以从缓冲区内容构造一个类型数组：\n\
  \n点击此处查看代码图像\n\n```javascript\nconst arr = new Uint16Array(buf) // 一个包含 1024 个 Uint16\
  \ 的数组，由 buf 支持\n```\n\n### 练习\n\n1. 实现一个与 `Array` 类 `from` 方法功能完全相同的函数。仔细注意缺失的元素。对于键的数值大于等于\
  \ `length` 属性的对象会发生什么？对于非索引属性的属性又如何？\n\n2. `Array.of` 方法的设计用于一个非常特定的用例：作为“收集器”传递给一个产生值序列并发送到某处的函数——例如打印、求和或收集到数组中。实现这样一个函数：\n\
  \n```javascript\nmapCollect(values, f, collector)\n```\n\n该函数应对所有值应用 `f`，然后将结果发送给\
  \ `collector`，`collector` 是一个具有可变参数的函数。返回 `collector` 的结果。\n\n解释在这种情况下使用 `Array.of`\
  \ 比 `Array`（即 `(...elements) => new Array(...elements)`）的优势。\n\n3. 数组可以具有值为负整数的属性，例如\
  \ `'-1'`。它们会影响 `length` 吗？如何按顺序遍历它们？\n\n4. 搜索“JavaScript forEach thisArg”查找解释 `forEach`\
  \ 方法 `thisArg` 参数的博客。在不使用 `thisArg` 参数的情况下重写这些示例。如果你发现如下调用：\n\n点击此处查看代码图像\n\n```javascript\n\
  arr.forEach(function() { . . . this.something() . . . }, thisArg)\n```\n\n其中 `thisArg`\
  \ 是 `this`，则将函数替换为箭头函数。否则，将内部的 `this` 替换为 `thisArg` 的值。如果调用形式为：\n\n```javascript\n\
  arr.forEach(method, thisArg)\n```\n\n\n\n\n\n```javascript\nuse an arrow function\
  \ invoking `thisArg.method(. . .)`. 你你能想出任何需要 `thisArg` 的情况吗？\n```\n\n5. 如果你不在 `Array`\
  \ 类的 `sort` 方法中提供比较函数，那么元素将转换为字符串并按 UTF-16 代码单元进行词序比较。为什么这是一个极糟糕的主意呢？请构造一些整数数组或对象数组，使得排序结果毫无用处。那么对于\
  \ `\\u{FFFF}` 之上的字符又是怎样的？\n\n6. 假设有一个表示消息的对象，具有日期和发送者属性。先按日期排序消息数组，再按发送者排序。验证 `sort`\
  \ 方法是稳定的：第二次排序后，具有相同发送者的消息仍然保持按日期排序。\n\n7. 假设有一个表示人的对象，具有名（first name）和姓（last name）属性。提供一个比较函数，先比较姓，然后用名来打破平局。\n\
  \n8. 实现一个比较函数，根据字符串的 Unicode 代码点（code points）而非 UTF-16 代码单元来比较两个字符串。\n\n9. 编写一个函数，返回数组中目标值的所有位置。例如，`indexOf(arr,\
  \ 0)` 返回所有 `arr[i]` 为零的数组索引值 `i`。使用 `map` 和 `filter`。\n\n10. 编写一个函数，返回给定函数为 `true`\
  \ 的所有位置。例如，`indexOf(arr, x => x > 0)` 返回所有 `arr[i]` 为正数的数组索引值 `i`。\n\n11. 使用 `reduce`\
  \ 计算数组的极差（即最大值与最小值之间的差值）。\n\n12. 给定一个函数数组 `[f[1], f[2], ..., f[n]]`，使用 `reduceRight`\
  \ 获取复合函数 `x => f1...))`。\n\n13. 为集合实现 `map`, `filter`, `forEach`, `some`, `every`\
  \ 函数。\n\n14. 实现 `union(set1, set2)`, `intersection(set1, set2)`, `difference(set1,\
  \ set2)`，返回并集、交集或差集，且不修改参数。\n\n15. 编写一个函数，从对象构造 `Map`，这样你就可以方便地构造如 `toMap({ Monday:\
  \ 1, Tuesday: 2, ... })` 这样的映射。\n\n16. 假设你使用一个键为 `{x:..., y:...}` 格式点对象的 `Map`。当你执行类似\
  \ `map.get({ x: 0, y: 0 })` 的查询时会出现什么问题？你可以做什么来克服？\n\n17. 证明弱集合（weak sets）确实如预期那样工作。带有\
  \ `--expose-gc` 标志启动 Node.js。调用 `process.memoryUsage()` 查看堆使用了多少内存。分配一个对象：\n\n点击此处查看代码图片\n\
  \n```javascript\nlet fred = { name: 'Fred', image: new Int8Array(1024*1024) }\n\
  ```\n\n验证堆使用量已增加约一兆字节。将 `fred` 设置为 `null`，调用 `global.gc()` 运行垃圾收集，并检查对象是否被回收。现在重复操作，将对象插入一个弱集合中。验证弱集合允许对象被回收。用普通集合重复操作，并证明对象不会被回收。\n\
  \n18. 编写一个函数来查找宿主平台的字节序（endianness）。使用数组缓冲区并同时将其作为数据视图（data view）和类型数组（typed array）进行查看。\n\
  \n## 第 8 章 国际化\n\n![Images](img/queen.jpg)\n\n## 本章主题\n\n- 8.1 区域化概念\n- 8.2 指定区域化\n\
  - 8.3 数字格式化\n- 8.4 日期时间的本地化\n- 8.5 排序\n- 8.6 其他本地敏感字符串方法\n- 8.7 复数规则与列表\n- 8.8 其他本地化特征\n\
  - 练习\n\n世界上很大，希望那里的许多居民会对你的软件感兴趣。有些程序员认为，使应用程序国际化唯一需要做的就是支持 Unicode 并翻译用户界面中的消息。然而，正如你将看到的，程序的国际化远比这复杂得多。日期、时间、货币，甚至数字在世界不同部分的格式化方式不同。在本章中，你将学习如何使用\
  \ JavaScript 的国际化功能，使你的程序能够以符合用户理解的方式展示和接收信息，无论他们身在何处。\n\n### 8.1 区域化概念\n\n当你观察一个适配于国际观众的应用程序时，最明显的区别是语言。但还有许多细微的差异；例如，数字在不同国家的格式化不同。数字\
  \ `123,456.78` 对于德国用户来说应该显示为 `123.456,78`——也就是说，小数点和小号分隔符的作用反过来了。在其他区域设置中，用户倾向于使用不同的数字。这里是相同的泰语数字：`๑๒୩，๔５๖.๗๘`。\n\
  \n日期的显示上也有类似的差异。在美国，日期的格式为月/日/年；德国使用不那么怪异的日/月/年顺序；而在中国，使用的是更符合的年/月/日。因此，美国的日期 `3/22/61`\
  \ 对德国用户应该呈现为 `22.03.1961`。如果显式写出月份，语言的差异会变得更加明显。英语的 `March 22, 1961` 在德语中应呈现为 `22.\
  \ März 1961`，在中文中应呈现为 `1961 年 3 月 22 日`。\n\n\n\n\n中文。\n\n`locale`（区域设置）指定了用户的语言和位置，允许格式化程序考虑用户的偏好。以下章节将向你展示如何指定\
  \ locale 以及如何控制 JavaScript 程序的 locale 设置。\n\n### 8.2 指定区域设置\n\n一个 locale 由多五个组成部分组成：\n\
  \n1. 语言，由两个或三个小写字母指定，例如 `en`（英语）、`de`（德语）或 `zh`（中文）。表 8-1 显示了常用代码。\n2. 可选的脚本（字体），由四个字母组成且首字母大写，例如\
  \ `Latn`（拉丁字母）、`Cyrl`（西里尔字母）或 `Hans`（简体中文）。这非常有用，因为某些语言（如塞尔维亚语）使用拉丁或西里尔字母编写，而某些中文读者更倾向于繁体字而非简体字。\n\
  3. 可选的国家或地区，由两个大写字母或三个数字指定，例如 `US`（美国）或 `CH`（瑞士）。表 8-2 显示了常用代码。\n4. 可选的变体（variant）。变体现在很少使用。挪威语曾有一个“新挪威语”（Nynorsk）变体，但现在用不同的语言代码\
  \ `nn` 表示。曾经用于日本皇历和泰国数字的变体现在通过扩展来表示（见下文）。\n5. 可选的扩展（extension）。扩展描述了对日历（如日本历）、数字（泰国数字而非西方数字）等的本地偏好。Unicode\
  \ 标准规定了其中一些扩展。这些扩展以 `u-` 开头，后跟着一个两个字母的代码，指定该扩展处理的是日历（`ca`）、数字（`nu`）等。例如，扩展 `u-nu-thai`\
  \ 表示使用泰国数字。其他扩展完全任意，并以 `x-` 开头，例如 `x-java`。\n\n| 语言 | 代码 | 语言 | 代码 |\n| --- | ---\
  \ | --- | --- |\n| 中文 | `zh` | 日语 | `ja` |\n| 丹麦语 | `da` | 韩语 | `ko` |\n| 荷兰语 |\
  \ `du` | 挪威语 | `no` |\n| 英语 | `en` | 葡萄语 | `pt` |\n| 法语 | `fr` | 西班牙语 | `es` |\n\
  | 芬兰语 | `fi` | 瑞典语 | `sv` |\n| 意大利语 | `it` | 土耳其语 | `tr` |\n\n**表 8-1** 常用语言代码\n\
  \n| 国家 | 代码 | 国家 | 代码 |\n| --- | --- | --- | --- |\n| 奥地利 | `AT` | 日本 | `JP` |\n\
  | 比时 | `BE` | 韩国 | `KR` |\n| 加拿大 | `CA` | 荷兰 | `NL` |\n| 中国 | `CN` | 挪威 | `NO` |\n\
  | 丹麦 | `DK` | 葡萄牙 | `PT` |\n| 芬兰 | `FI` | 西班牙 | `ES` |\n| 德国 | `DE` | 瑞典 | `SE`\
  \ |\n| 英国 | `GB` | 瑞士 | `CH` |\n| 希腊 | `GR` | 台湾 | `TW` |\n| 爱尔兰 | `IE` | 土耳其 |\
  \ `TR` |\n| 意大利 | `IT` | 美国 | `US` |\n\n**表 8-2** 常用国家代码\n\nlocale 的规则制定在互联网工程任务组的“最佳实践”备忘录\
  \ BCP 47 中（`http://tools.ietf.org/html/bcp47`](http://tools.ietf.org/html/bcp47)）。你可以在更易读的摘要中找到\
  \ [`www.w3.org/International/articles/language-tags`](http://www.w3.org/International/articles/language-tags)。\n\
  \n![Images](img/note.jpg) 注意\n\n语言和国家的代码看起来有些随机，因为其中某些源自本地语言。德语在德语里是 Deutsch，中文在中文里是\
  \ zhongwen——因此 `de` 和 `zh`。瑞士是 `CH`，源自瑞士联邦的拉丁术语 `Confoederatio Helvetica`。\n\nlocale\
  \ 由标签（tags）描述——即 locale 元素的连字符字符串，例如 `'en-US'`。\n\n在德国，你会使用 locale `'de-DE'`。瑞士有四种官方语言（德语、法语、意大利语和罗什语）。瑞士的德语者会想要使用\
  \ locale `'de-CH'`。此 locale 使用德语的规则，但货币值用瑞士法表示而非欧元。\n\n将 locale 标签传递给区域敏感函数。例如：\n\
  \n点击此处查看代码\n\n```javascript\nconst newYearsEve = new Date(1999, 11, 31, 23, 59)\n\
  \nnewYearsEve.toLocaleString('de') // 返回字符串 '31.12.1999 23:59:00'\n```\n\n与其提供单个\
  \ locale 标签，你也可以提供一个优先级递减的数组：`['de-CH', 'de', 'en']`。有了这样的 locale 标签数组，区域敏感方法在无法支持首选\
  \ locale 时可以使用回退 locale。\n\n可以在跟随 locale 标签的对象字中指定附加选项：\n\n点击此处查看代码\n\n```javascript\n\
  newYearsEve.toLocaleString('de', { timeZone: 'Asia/Tokyo' })\n  // 在给定时区下看到的日期，例如\
  \ '1.1.2000, 07:59:00'\n```\n\n如果你省略了 locale 和选项，将使用默认 locale 且不带选项。对于带有选项的默认 locale，你可以提供一个空的\
  \ locale 标签数组：\n\n点击此处查看代码\n\n```javascript\nnewYearsEve.toLocaleString([], { timeZone:\
  \ 'Asia/Tokyo' })\n```\n\n![Images](img/note.jpg) 注意\n\n`toLocaleString` 方法定义在 `Object`\
  \ 类中。你可以在任何类中覆盖它——参见练习 1。\n\n### 8.3 格式化数字\n\n要格式化数字，调用 `Number` 方法的 `toLocaleString`\
  \ 方法并将 locale 标签作为参数传递：\n\n点击此处查看代码\n\n```javascript\nlet number = 123456.78\n\n\
  let result = number.toLocaleString('de') // '123,456.78'\n```\n\n或者，你可以构造一个 `Intl.NumberFormat`\
  \ 类的实例并调用它的 `format` 方法：\n\n点击此处查看代码\n\n```javascript\nlet formatter = new Intl.NumberFormat('de')\n\
  \nresult = formatter.format(number) // '123,456.78'\n```\n\n在一种罕见的情况下，你需要进一步分析此类结果，`formatToParts`\
  \ 方法会产生一个包含部分的数组。例如，`formatter.formatToParts(number)` 是以下数组：\n\n点击此处查看代码\n\n```javascript\n\
  [ { type: 'integer', value: '123' },\n  { type: 'group', value: ',' },\n  { type:\
  \ 'integer', value: '456' },\n  { type: 'decimal', value: '.' },\n  { type: 'fraction',\
  \ value: '78' } ]\n```\n\n对于任何区域特定的方法，你想知道支持哪些 locale 扩展和选项。表 8-3 显示了 `Number` 类\
  \ `toLocaleString` 方法和 `Intl.NumberFormat` 类 `format` 方法的这些信息。\n\n记得 locale 扩展以\
  \ `u` 前缀。`format` 方法识别 `u-nu` 扩展，例如：\n\n点击此处查看代码\n\n```javascript\nnumber.toLocaleString('th-u-nu-thai')\n\
  \nnew Intl.NumberFormat('th-u-nu-thai').format(number)\n  // 均返回 '๑๒๓,๔５๖.๗８'\n\
  ```\n\n选项作为跟随 locale 标签的第二个参数提供\n\n点击此处查看代码\n\n```javascript\nnumber.toLocaleString('de',\
  \ { style: 'currency', currency: 'EUR' })\n\nformatter = new Intl.NumberFormat('de',\
  \ { style: 'currency', currency: 'EUR' })\n\nformatter.format(number)\n  // 均返回\
  \ '123.456,78 €'\n```\n\n\n\n如你所见，如果你需要反复执行复杂的格式化，构建一个格式化对象是有意义的。\n\n练习 2 要求你探索各种选项。\n\
  \n![Images](img/note.jpg) 注意\n\n阶段 3 的提案为测量单位（`'299,792,458 m/s'`）、科学计数法（`'6.022E23'`）和紧凑小数（`'8.1\
  \ billion'`）增加了更多格式选项。\n\n![Images](img/caution.jpg) 注意\n\n遗憾的是，目前还没有标准方法来解析带有分组分隔符或\
  \ 0−9 以外数字的本地化数字。\n\n| 名称 | 值 |\n| --- | --- |\n| **区域标记扩展** | |\n| `nu` (数字计数)\
  \ | `latn`, `arab`, `thai`, . . . |\n| **选项** | |\n| `style` | `decimal`（默认），`currency`,\
  \ `percent` |\n| `currency` | ISO 4217 货币代码，如 `USD` 或 `EUR`。货币样式必需的。 |\n| `currencyDisplay`\
  \ | `symbol` (€, 默认），`code` (EUR), `name` (Euro) |\n| `useGrouping` | `true`（默认）使用分组分隔符\
  \ |\n| `minimumIntegerDigits`, `minimumFractionDigits`, `maximumFractionDigits`,\
  \ `minimumSignificantDigits`, `maximumSignificantDigits` | 小数分隔符前后数字的限制，或总位数 |\n\
  \n**表 8-3** 为数字配置 `toLocaleString` 和 `Intl.NumberFormat` 构造函数\n\n## 8.4 日期和时间的本地化\n\
  \n在格式化日期和时间时，有很多取决于本地区域的问题：\n\n1. 月份和星日的名称应该用本地语言显示。\n2. 年、月、日的顺序会有本地偏好。\n3. 格里高历可能不是表达日期的本地偏好。\n\
  4. 必须考虑所在地的时区。\n\n在接下来的章节中，你将看到如何本地化 `Date` 对象、日期范围和相对日期（例如“3 天后”）。\n\n#### 8.4.1\
  \ 格式化 `Date` 对象\n\n给定一个 `Date` 对象，你可以格式化其日期部分、时间部分或两者：\n\n点击此处查看代码图片\n\n```\nconst\
  \ newYearsEve = new Date(1999, 11, 31, 23, 59)\n\nnewYearsEve.toLocaleDateString('de')\
  \ // '31.12.1999'\n\nnewYearsEve.toLocaleTimeString('de') // '23:59:00'\n\nnewYearsEve.toLocaleString('de')\
  \ // '31.12.1999, 23:59:00'\n```\n\n与数字格式化一样，你也可以为指定的区域构建一个格式化器并调用其 `format` 方法：\n\
  \n点击此处查看代码图片\n\n```\nconst germanDateTimeFormatter = new Intl.DateTimeFormat('de')\n\
  \ngermanDateTimeFormatter.format(newYearsEve) // '31.12.1999'\n```\n\n你可以提供选项来控制每个部分的格式化方式：\n\
  \n点击此处查看代码图片\n\n```\nnewYearsEve.toLocaleDateString('en', {\n  year: 'numeric',\n\
  \  month: 'short',\n  day: 'numeric',\n}) // 'Dec 31, 1999'\n\nnew Intl.DateTimeFormat('de',\
  \ {\n  hour: 'numeric',\n  minute: '2-digit'\n}).format(newYearsEve) // '23:59'\n\
  ```\n\n然而，这种方法既繁琐又不符合逻辑。毕竟，每个部分的格式，甚至包含哪些部分，都是特定的区域偏好。ECMAScript 规范规定了一个复杂的算法，用于将请求的格式与给定区域的合理格式进行匹配，并提供了一个\
  \ `formatMatcher` 选项在规范算法和可能更好的算法之间进行选择。这种复杂性应该让他们意识到他们走错了路。现在有一个阶段 3 的提案来修复这个混乱局面。你可以指定你想要的日期和时间部分的样式（`full`、`long`、`medium`\
  \ 或 `short`）。然后格式化器会为该区域选择合适的字段和格式：\n\n点击此处查看代码图片\n\n```\nnewYearsEve.toLocaleDateString('en',\
  \ { dateStyle: 'medium' })\n  // 'Dec 31, 1999'\n\nnewYearsEve.toLocaleDateString('de',\
  \ { dateStyle: 'medium' })\n  // '31.12.1999'\n```\n\n表 8-4 显示了所有的区域标记扩展和选项。\n\n\
  | 名称 | 值 |\n| --- | --- |\n| **区域标记扩展** | |\n| `nu` (数字计数) | `latn`, `arab`, `thai`\
  \ |\n| `ca` (日历) | `gregory`, `hebrew`, `buddhist`, . . . |\n| `hc` (小时周期) | `h11`,\
  \ `h12` |\n| **选项** | |\n| `timeZone` | `UTC`, `Europe/Berlin`, . . |\n| `dateStyle`,\
  \ `timeStyle` | `full`, `long`, `medium`, `short` |\n| `hour12` | `true`, `false`\
  \ |\n| `numeric` | `always`, `auto` |\n| `style` | `long`, `short`, `narrow` |\n\
  | `formatMatcher` | `standard`, `best` |\n| `calendar` | `gregory`, `hebrew`, `buddhist`,\
  \ . . . |\n| `era` | `long`, `short`, `narrow` |\n| `timeZone` | `long`, `short`,\
  \ `narrow` |\n| `timeName` | `long`, `short`, `narrow` |\n| `dayName` | `long`,\
  \ `short`, `narrow` |\n| `monthName` | `long`, `short`, `narrow` |\n| `weekdayName`\
  \ | `long`, `short`, `narrow` |\n| `hourCycle` | `h11`, `h12` |\n\n#### 8.4.2 范围\n\
  \n`Intl.DateTimeFormat` 的 `formatRange` 方法将两个日期之间的范围格式化为：\n\n```javascript\nconst\
  \ range = new Intl.DateTimeFormat('en', { dateStyle: 'long' });\nrange.formatRange(new\
  \ Date(2023, 0, 1), new Date(2023, 0, 7));\n// \"Jan 1, 2023 – Jan 7, 2023\"\n```\n\
  \n#### 8.4.3 相对时间\n\n`Intl.RelativeTimeFormat` 的 `format` 方法产生如“昨天”或“3 小时后”的表达式：\n\
  \n```javascript\nconst rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto'\
  \ });\nrtf.format(-1, 'day'); // \"yesterday\"\nrtf.format(3, 'hour'); // \"in 3\
  \ hours\"\n```\n\n### 8.4.4 格式化为部分\n\n与数字格式化一样，`Intl.DateTimeFormat` 和 `Intl.RelativeTimeFormat`\
  \ 类拥有 `formatToParts` 方法，产生描述结果每个部分的数组。这里有几个示例：\n\n调用\n\n```javascript\nnew Intl.RelativeTimeFormat('fr').formatToParts(3,\
  \ 'hour')\n```\n\n返回数组：\n\n```javascript\n[\n  { type: 'literal', value: 'dans '\
  \ },\n  { type: 'integer', value: '3', unit: 'hour' },\n  { type: 'literal', value:\
  \ ' heures'}\n]\n```\n\n调用\n\n```javascript\nnew Intl.DateTimeFormat('en', {\n \
  \ dateStyle: 'long',\n  timeStyle: 'short'\n}).formatToParts(newYearsEve)\n```\n\
  \n产生一个包含十一项的数组，描述 `'December 31, 1999 at 11:59 PM'` 字符串的部分，即：\n\n```javascript\n\
  { type: 'month', value: 'December' },\n{ type: 'literal', value: ' ' },\n{ type:\
  \ 'day', value: '31' },\n```\n\n等等。\n\n### 8.5 排序\n\n在 JavaScript 中，你可以使用 `<`、`<=`、`>`\
  \ 和 `>=` 运算符比较字符串。遗憾的是，在与用户交互时，这些运算符并不好用，即使在英语中也是如此。例如，以下五个字符串根据 `<` 运算符排序：\n\n\
  ```\n\nAthens\nZulu\nable\nzebra\nÅngström\n```\n\n对于字典排序，你会希望考虑大写和小写的字母等价性，并且音符号不应该是重要的。对于英语使用者来说，示例单词列表应该排序为\n\
  \n```\n\nable\n```\n\n\n\nÅngström\nAthens\nzebra\nZulu\n\n然而，这种顺序对于瑞典用户来说是不可接受的。在瑞典语中，字母\
  \ `Å` 与字母 `A` 不同，它的排序位置在字母 `Z` **之后**！这意味着，瑞典用户希望单词按以下方式排序：\n\n```\nable\nAthens\n\
  zebra\nZulu\nÅngström\n```\n\n每当你需要对用户提供的字符串进行排序时，都应该使用感知区域的比较（locale-aware comparison）。\n\
  \n最简单的方法是使用 `String` 类的 `localeCompare` 方法。将 locale 作为第二个参数传递：\n\n点击此处查看代码\n\n```\n\
  const words = ['Alpha', 'Ångström', 'Zulu', 'able', 'zebra']\n\nwords.sort((x, y)\
  \ => x.localeCompare(y, 'en'))\n\n  // words is now ['able', 'Alpha', 'Ångström',\
  \ 'zebra', 'Zulu']\n```\n\n或者，你可以构造一个 collator 对象：\n\n点击此处查看代码\n\n```\nconst swedishCollator\
  \ = new Intl.Collator('sv')\n```\n\n然后将 collator 的 `compare` 函数传递给 `Array.sort`\
  \ 方法：\n\n点击此处查看代码\n\n```\nwords.sort(swedishCollator.compare)\n\n  // words is now\
  \ ['able', 'Alpha', 'zebra', 'Zulu', 'Ångström']\n```\n\n表 8-5 显示了 `localeCompare`\
  \ 方法和 `Intl.Collator` 构造函数支持的扩展和选项。\n\n一个实用的扩展是数字排序（numeric sort），其中数字子串按升序排序：\n\
  \n点击此处查看代码\n\n```\nconst parts = ['part1', 'part10', 'part2', 'part9']\n\nparts.sort((x,\
  \ y) => x.localeCompare(y, 'en-u-kn-true'))\n\n  // Now parts is ['part1', 'part2',\
  \ 'part9', 'part10']\n```\n\n其他许多构造的用途有限。例如，在德语电话簿中（但不是字典中），`Ö` 被认为与 `Oe` 相同。以下调用不会修改给定的数组：\n\
  \n点击此处查看代码\n\n```\n['Österreich', 'Offenbach'].sort((x, y) => x.localeCompare(y,\
  \ 'de-u-co-phonebk'))\n```\n\n| 名称 | 值 |\n| --- | --- |\n| **Locale Tag 扩展** | |\n\
  | `co` (排序) | `phonebook`, `phonetic`, `reformed`, `pinyin`, . . . |\n| `kn` (数字排序)\
  \ | `true` (`'1'` < `'2'` < `'10'`), `false` (默认) |\n| `kf` (大小优先) | `upper`, `lower`,\
  \ `false` (默认) |\n| **选项** | |\n| `sensitivity` | `base` (a = A = Å), `accent` (a\
  \ = A ≠ Å), `case` (a ≠ A = Å), `variant` (a, A, Å 都不同；默认) |\n| `ignorePunctuation`\
  \ | `true`, `false` (默认) |\n| `numeric`, `caseFirst` | `true`, `false` (默认)—参见上文的\
  \ `kn`, `kf` |\n| `usage` | `sort` (用于排序，默认), `search` (用于搜索，仅考虑相等性) |\n\n**表 8-5**\
  \ 使用 `localeCompare` 和 `Intl.Collator` 构造函数的字符串排序\n\n### 8.6 其他感知区域敏感的字符串方法\n\n\
