  \ ISO 216 纸张尺寸。世界上只有三个国家尚未正式采用公制单位：利比利亚、缅甸和美国。\n\n# 第 9 章 异步编程\n\n![Images](img/queen.jpg)\n\
  \n## 本章主题\n\n- 9.1 JavaScript 中的并发任务\n- 9.2 创建 Promise\n- 9.3 立即就绪的 Promise\n- 9.4\
  \ 获取 Promise 结果\n- 9.5 Promise 链\n- 9.6 拒绝处理\n- 9.7 执行多个 Promise\n- 9.8 竞速多个 Promise\n\
  - 9.9 异步函数\n- 9.10 异步返回值\n- 9.11 并发 await\n- 9.12 异步函数中的异常\n- 练习题\n\n在本章中，你将学习如何协调必须在未来某个时间点执行的任务。我们从深入研究\
  \ Promise（承诺）的概念开始。Promise 正如其名所示：一个在未来某个时间点产生结果的动作，除非它因异常而终止。正如你将看到的，Promise 可以按顺序执行，也可以并行执行。\n\
  \nPromise 的一个缺点是你需要使用方法调用来组合它们。`async`/`await` 结构为你提供了许多更愉悦的语法。你编写使用常规控制流的代码，编译器会将你的代码翻译成\
  \ Promise 链。\n\n理想情况下，你可以跳过 Promise 直接使用 `async`/`await` 语法。然而，我认为，如果在不知道该语法在背后做了什么的情况下，要理解其复杂性和局限性将是一个不小的挑战。\n\
  \n我们以对异步生成器和迭代器的讨论结束本章。除了本章最后一节外，其他部分应该是中级 JavaScript 开发者的必读内容，因为异步处理在 Web 应用程序中无处不在。\n\
  \n### 9.1 JavaScript 中的并发任务\n\n当一个程序管理多个具有重叠时间线的活动时，该程序就是“并发”的。Java 或 C++ 中的并发程序使用多个执行线程。当处理器具有多个核心时，这些线程会真正以并行方式运行。但这里存在一个问题——程序员必须小心保护数据，以确保当不同线程同时更新值时不会发生数据损坏。\n\
  \n相比之下，JavaScript 程序运行在单线程中。特别是，一旦函数开始，它将在你的程序的任何其他部分开始运行之前运行完毕。这是好事。你知道没有其他代码会损坏你的函数正在使用的数据。在函数返回之前，没有其他代码会尝试读取任何数据。在函数内部，你可以随心所欲地修改程序的变量，只要在函数返回之前完成清理工作即可。你永远不需要担心互斥（mut）或死锁（deadlocks）。\n\
  \n单线程的问题是显而易见的：如果程序需要等待某事的发生——最常见的是等待来自互联网的数据——它就无法执行其他事情。因此，JavaScript 中的耗时操作总是异步的。你指定你想要什么，并提供在数据可用或发生错误时调用的回调函数。当前函数继续执行，以便完成其他工作。\n\
  \n让我们来看一个简单的示例：加载图像。以下函数通过给定的 URL 加载图像并附加到给定的 DOM 元素：\n\n点击此处查看代码图片\n\n```\nconst\
  \ addImage = (url, element) => {\n  const request = new XMLHttpRequest()\n  request.open('GET',\
  \ url)\n  request.responseType = 'blob'\n  request.addEventListener('load', () =>\
  \ {\n    if (request.status == 200) {\n      const blob = new Blob([request.response],\
  \ { type: 'image/png' })\n      const img = document.createElement('img')\n    \
  \  img.src = URL.createObjectURL(blob)\n      element.appendChild(img)\n    } else\
  \ {\n      console.log(`${request.status}: ${request.statusText}`)\n    }\n  })\n\
  \  request.addEventListener('error', event => console.log('Network error'))\n  request.send()\n\
  }\n```\n\n`XMLHttpRequest` API 的细节并不重要，除了一个关键事实：图像数据在回调函数（`load` 事件监听器）中处理。\n\n\
  如果你调用 `addImage`，它会立即返回。图像会在数据加载后添加到 DOM。\n\n考虑这个示例，我们加载了四张图片（取自花牌——参见 [`en.wikipedia.org/wiki/Hanafuda`](https://en.wikipedia.org/wiki/Hanafuda)）：\n\
  \n```\nconst imgdiv = document.getElementById('images')\n\naddImage('hanafuda/1-1.png',\
  \ imgdiv)\naddImage('hanafuda/1-2.png', imgdiv)\naddImage('hanafuda/1-3.png', imgdiv)\n\
  addImage('hanafuda/1-4.png', imgdiv)\n```\n\n四个 `addImage` 调用都会立即返回。当图像数据到达时，就会调用回调并添加图像。注意，你不需要担心并发回调导致损坏。回调永远不会交织。它们在单线程中一个接一个运行。然而，它们可以以任何顺序出现。如果你多次加载带有此程序的网页，图像顺序可能会发生变化——参见图\
  \ 9-1。\n\n\n\n\n\n```\n然后将你的浏览器指向诸如 [`http://localhost:4000/images.html`](http://localhost:4000/images.html)\
  \ 的 URL。\n\n![Images](img/pg187_Image_513.jpg)\n\n**图 9-1** 图像可能会无序加载\n\n在加载图像时，处理无序到达是相当容易的——参见练习\
  \ 1。但请考虑一种更复杂的情况。假设你需要读取远程数据，然后根据接收到的数据读取更多数据。例如，一个网页可能包含你想要加载的图像的 URL。\n\n在这种情况下，你需要异步读取该网页，并使用一个回调函数（callback）扫描内容以查找图像\
  \ URL。然后，必须异步获取该图像，并使用另一个回调函数将图像添加到指定的地点。每次获取操作都需要进行错误处理，这导致了更多的回调。经过几层处理，这种编程风格就会变成“回调地狱”（callback\
  \ hell）——即深度嵌套的、且成功和失败路径难以理解的回调。\n\n在接下来的章节中，你将学习 `promises` 如何让你在不使用嵌套回调的情况下组合异步任务。\n\
  \nPromise（承诺）是一个对象，它承诺最终会产生一个结果（如果顺利的话）。结果可能不会立即可用，如果发生错误，它可能永远不会可用。\n\n这听起来并不很有前景，但正如你很快就会看到的，使用\
  \ promise 链式处理完成和错误操作比使用回调要容易得多。\n\n### 9.2 创建 Promise\n\n在节节和下一节中，你将看到如何创建 promise。这有点技术性，而且你很少需要自己去实现它。更常见的情况是调用返回\
  \ promise 的库函数。在实际需要自己构建 promise 之前，可以随意跳过这些章节。\n\n![Images](img/note.jpg) 注意\n\n\
  产生 promise 的 API 典型示例是所有现代浏览器都支持的 `Fetch API`。该调用：\n\n点击此处查看代码图像\n\n```\nfetch('https://horstmann.com/javascript-impatient/hanafuda/index.html')\n\
  ```\n\n返回一个 promise，当 HTTP 请求的结果可用时，它将产生响应。\n\n`Promise` 构造函数接受一个参数，该参数是一个带有两个参数的函数：分别用于成功和失败结果的处理程序。这个函数被称为“执行函数”（executor\
  \ function）。\n\n点击此处查看代码图像\n\n```\nconst myPromise = new Promise((resolve, reject)\
  \ => {\n  // 执行函数的函数体\n})\n```\n\n在执行函数的函数体内，你启动了产生所需结果的任务。一旦结果可用，你将其将其传递给 `resolve`\
  \ 处理程序。或者，如果你知道不会有结果，则带上原因调用 `reject` 处理程序。当工作异步完成时，这些处理程序将在某个回调中调用。\n\n以下是该过程的轮\
  \ outline：\n\n点击此处查看代码图像\n\n```\nconst myPromise = new Promise((resolve, reject)\
  \ => {\n  const callback = (args) => {\n    . . .\n\n    if (success) resolve(result)\
  \ else reject(reason)\n  }\n  invokeTask(callback)\n})\n```\n\n让我们在最简单的案例中应用它：在延迟后交付结果。该函数产生一个\
  \ promise 来实现这一点：\n\n点击此处查看代码图像\n\n```\nconst produceAfterDelay = (result, delay)\
  \ => {\n  return new Promise((resolve, reject) => {\n    const callback = () =>\
  \ resolve(result)\n    setTimeout(callback, delay)\n  })\n}\n```\n\n在传递给构造函数的执行函数中，我们调用\
  \ `setTimeout` 并传入一个回调和给定的延迟。当延迟通过后，回调将被调用。在回调中，我们将结果传递给 `resolve` 处理程序。我们不需要担心错误，`reject`\
  \ 处理程序未被使用。\n\n这是一个更复杂的函数，它产生一个结果为图像的 promise：\n\n点击此处查看代码图像\n\n```\nconst loadImage\
  \ = url => {\n  return new Promise((resolve, reject) => {\n    const request = new\
  \ XMLHttpRequest()\n    const callback = () => {\n      if (request.status == 200)\
  \ {\n        const blob = new Blob([request.response], { type: 'image/png' })\n\
  \        const img = document.createElement('img')\n        img.src = URL.createObjectURL(blob)\n\
  \        resolve(img)\n      } else {\n        reject(Error(`${request.status}:\
  \ ${request.statusText}`))\n      }\n    }\n    request.open('GET', url)\n    request.responseType\
  \ = 'blob'\n    request.addEventListener('load', callback)\n    request.addEventListener('error',\
  \ event => reject(Error('Network error')));\n    request.send()\n  })\n}\n```\n\n\
  执行函数配置了一个 `XMLHttpRequest` 对象并发送它。在收到响应后，回调产生图像并调用 `resolve` 处理程序将其传递出去。如果发生错误，它将传递给\
  \ `reject` 处理程序。\n\n让我们慢动作观察一个 promise 的控制流。\n\n1. 调用 `Promise` 构造函数。\n2. 调用执行函数。\n\
  3. 执行函数启动异步任务。\n4. 执行函数返回。\n5. 现在 promise 处于 `pending`（等待中）状态。\n6. 异步任务完成。\n7. 回调被调用。\n\
  8. 回调调用 `resolve` 或 `reject`，promise 变为 `fulfilled`（已完成）或 `rejected`（已拒绝）状态。\n9.\
  \ 在任何情况下，promise 现在都已稳定（settled）。\n\n![Images](img/note.jpg) 注意\n\n控制流最后一步的一种变体。你可以向\
  \ `resolve` 传递 promise。那么当前的 promise 被解析但未完成。它保持为 `pending`。确保在任务回调中始终调用 `resolve`\
  \ 或 `reject`，否则 promise 永远不会稳定。这意味着你需要注意回调中的异常。在 `loadImage` 示例中，我仔细检查了代码以确保没有抛出异常。然而，如果在执行函数抛出异常，构造函数将返回。\n\
  \n### 9.3 立即稳定的 Promise\n\n`Promise.resolve(value)` 调用创建一个立即以给定值完成的 promise。这对于返回\
  \ promise 的方法非常有用，在某些情况下答案是立即可用的：\n\n点击此处查看代码图像\n\n```\nconst loadImage = url =>\
  \ {\n  if (url === undefined) return Promise.resolve(brokenImage)\n  . . .\n}\n\
  ```\n\n如果你有一个可能是 promise 也可能是普通值，`Promise.resolve(value)` 的结果肯定会将其转换为 promise。如果该值已经是\
  \ promise，则会直接返回。\n\n![Images](img/note.jpg) 注意\n\n为了与早于标准 ECMcript promise 的库兼容，`Promise.resolve`\
  \ 方法对“通”（thenable）对象提供了特殊处理——即具有 `then` 方法的对象。`then` 方法将带有一个解析处理程序和一个拒绝处理程序被调用，并返回一个在两个处理程序中任一被调用时就会稳定的\
  \ promise——参见练习 6。\n\n`Promise.reject(error)` 调用产生一个立即被给定错误拒绝的 promise。\n\n当产生 promise\
  \ 的函数失败时使用：\n\n点击此处查看代码图像\n\n```\nconst loadImage = url => {\n  if (url === undefined)\
  \ {\n    return Promise.reject(Error('No URL'))\n  } else {\n```\n\n\n\n\n\n```javascript\n\
  return new Promise(. . .)\n}\n\n}\n```\n\n### 9.4 获取 Promise 结果\n\n现在你已经知道了如何构建一个\
  \ promise，你将想要获取它的结果。你不需要等待 promise 就绪（settle）。相反，你提供了一些操作，在 promise 就绪后处理结果或错误。这些操作将在调度它们的函数的执行完毕*之后*的某个点执行。\n\
  \n使用 `then` 方法来指定在 promise 解析（resolved）后应该执行的操作。该操作是一个消耗结果的函数。\n\n点击此处查看代码图片\n\n\
  ```javascript\nconst promise1 = produceAfterDelay(42, 1000)\n\npromise1.then(console.log)\
  \ // 准备好后记录值\n\nconst promise2 = loadImage('hanafuda/1-1.png')\n\npromise2.then(img\
  \ => imgdiv.appendChild(img)) // 准备好后添加图片\n```\n\n![Images](img/note.jpg) Note\n\
  \n`then` 方法是从 promise 获取结果的唯一方法。\n\n你将在 第 9.6 节 中的“拒绝处理”（第 194 页）中看到如何处理被拒绝的 promise。\n\
  \n![Images](img/caution.jpg) Caution\n\n当你使用不同的 URL 尝试 `loadImage` 或 `fetch` 函数时，可能会遇到“跨源”错误。浏览器内部的\
  \ JavaScript 引擎不允许 JavaScript 代码查看来自第三方主机请求的结果，除非这些主机同意访问是安全的并设置了响应头。遗憾的是，很少有网站费此精力。你可以从\
  \ [`https://horstmann.com/javascript-impatient`](https://horstmann.com/javascript-impatient)\
  \ 或（在我写这段文字时）[`https://developer.mozilla.org`](https://developer.mozilla.org) 以及\
  \ [`https://aws.random.cat/meow`](https://aws.random.cat/meow) 获取 URL。如果你想尝试其他网站，可以使用\
  \ CORS 代理或浏览器插件来绕过浏览检查。\n\n### 9.5 Promise 链\n\n在上一节中，你看到了如何获取 promise 的结果。现在我们处理一个更有趣的情况，即\
  \ promise 的结果被传递给另一个异步任务。\n\n如果你传递给 `then` 的操作产生另一个 promise，那么结果就是那个 promise。要处理它的结果，请再次调用\
  \ `then` 方法。\n\n这是一个示例。我们加载一张图片，然后是加载另一张：\n\n点击此处查看代码图片\n\n```javascript\nconst\
  \ promise1 = loadImage('hanafuda/1-1.png')\n\nconst promise2 = promise1.then(img\
  \ => {\n  imgdiv.appendChild(img)\n  return loadImage('hanafuda/1-2.png') // 另一个\
  \ promise\n})\n\npromise2.then(img => {\n  imgdiv.appendChild(img)\n})\n```\n\n\
  不需要将每个 promise 保存在独立的变量中。通常情况下，人们将 promise 链处理为一条“流水线”。\n\n点击此处查看代码图片\n\n```javascript\n\
  loadImage('hanafuda/1-1.png')\n  .then(img => {\n    imgdiv.appendChild(img)\n \
  \   return loadImage('hanafuda/1-2.png')\n  })\n  .then(img => imgdiv.appendChild(img))\n\
  ```\n\n![Images](img/note.jpg) Note\n\n使用 Fetch API，你需要链式调用 promise 来读取网页内容：\n\n\
  点击此处查看代码图片\n\n```javascript\nfetch('https://developer.mozilla.org')\n  .then(response\
  \ => response.text())\n  .then(console.log)\n```\n\n`fetch` 函数返回一个产生响应的 promise，而\
  \ `text` 方法又产生另一个产生页面文本内容的 promise。\n\n你可以交替同步和异步任务：\n\n点击此处查看代码图片\n\n```javascript\n\
  loadImage('hanafuda/1-1.png')\n  .then(img => imgdiv.appendChild(img)) // 同步\n \
  \ .then(() => loadImage('hanafuda/1-2.png')) // 异步\n  .then(img => imgdiv.appendChild(img))\
  \ // 同步\n```\n\n从技术上讲，如果 `then` 操作产生的值不是 promise，则 `then` 方法将返回一个立即解析的 promise。这允许通过另一个\
  \ `then` 方法进行进一步链式调用。\n\n![Images](img/tip.jpg) Tip\n\n你可以通过从一个立即解析的 promise 开始，让\
  \ promise 流水线更加对称：\n\n点击此处查看代码图片\n\n```javascript\nPromise.resolve()\n  .then(()\
  \ => loadImage('hanafuda/1-1.png'))\n  .then(img => imgdiv.appendChild(img))\n \
  \ .then(() => loadImage('hanafuda/1-2.png'))\n  .then(img => imgdiv.appendChild(img))\n\
  ```\n\n前面的示例显示了如何组合固定数量的任务。你可以通过以下方式构建任意长度的任务流水线：\n\n点击此处查看代码图片\n\n```javascript\n\
  let p = Promise.resolve()\nfor (let i = 1; i <= n; i++) {\n  p = p.then(() => loadImage(`hanafuda/${i}.png`))\n\
  \    .then(img => imgdiv.appendChild(img))\n}\n```\n\n![Images](img/caution.jpg)\
  \ Caution\n\n如果 `then` 的参数不是函数，该参数将被丢弃！以下是错误的：\n\n点击此处查看代码图片\n\n```javascript\n\
  loadImage('hanafuda/1-1.png')\n  .then(img => imgdiv.appendChild(img))\n  .then('hanafuda/1-2.png')\n\
  ```\n\n在这里，`then` 返回一个具有与 `p` 相同结果的 promise。如果你用非函数调用 `p.then(arg)`，请注意第二次调用 `loadImage`\
  \ 会立即发生，而无需等待第一个 promise 就绪。\n\n### 9.6 拒绝处理\n\n在上一节中，你看到了如何顺序执行多个异步任务。我们关注的是所有任务都成功的“顺利”场景。处理错误路径会极大地增加程序逻辑。Promise\
  \ 让在流水线中传播错误变得相当容易。\n\n在调用 `then` 方法时可以提供一个拒绝处理器：\n\n点击此处查看代码图片\n\n```javascript\n\
  loadImage(url)\n  .then(\n    img => { // Promise 就绪\n      imgdiv.appendChild(img)\n\
  \    },\n    reason => { // Promise 被拒绝\n      console.log({reason})\n      imgdiv.appendChild(brokenImage)\n\
  \    })\n```\n\n然而，通常使用 `catch` 方法更好：\n\n点击此处查看代码图片\n\n```javascript\nloadImage(url)\n\
  \  .then(\n    img => { // Promise 就绪\n      imgdiv.appendChild(img)\n    })\n \
  \ .catch(\n    reason => { // 之前的 promise 被拒绝\n      console.log({reason})\n   \
  \   imgdiv.appendChild(brokenImage)\n    })\n```\n\n这样，解析处理器中的错误也会捕获。\n\n`catch`\
  \ 方法根据处理器参数的返回值、返回的 promise 或抛出的异常产生一个新的 promise。如果处理器返回时没有抛出异常，那么生成的 promise 将是解析的，你可以继续执行流水线。\n\
  \n通常，流水线有一个拒绝处理器，当任何任务失败时都会被调用：\n\n点击此处查看代码图片\n\n```javascript\nPromise.resolve()\n\
  \  .then(() => loadImage('hanafuda/1-1.png'))\n  .then(img => imgdiv.appendChild(img))\n\
  \  .then(() => loadImage('hanafuda/1-2.png'))\n  .then(img => imgdiv.appendChild(img))\n\
  \  .catch(reason => console.log({reason}))\n```\n\n\n\n\n\n如果 `then` 动作抛出异常，`then`\
  \ 方法将产生一个被拒绝的 promise（rejected promise）。在另一个 `then` 上链一个被拒绝的 promise 只会传播该拒绝的 promise。因此，末尾的\
  \ `catch` 处理器将处理流水线中任何阶段的拒绝。\n\n`finally` 方法无论 promise 是否已就绪（settled），都会调用处理程序。该处理器没有参数，因为它的目的是清理，而不是分析\
  \ promise 的结果。`finally` 方法返回的 promise 与被调用的 promise 具有相同的结局，因此它可以被包含在流水线：\n\n点击此处查看代码图像\n\
  \n```\nPromise.resolve()\n  .then(() => loadImage('hanafuda/1-1.png'))\n  .then(img\
  \ => imgdiv.appendChild(img))\n  .finally(() => { doCleanup(. . .) })\n  .catch(reason\
  \ => console.log({reason}))\n```\n\n### 9.7 执行多个 Promise\n\n当你有多个 promise 并且希望它们都解析（resolved）时，可以将它们放入数组或任何可迭代对象中，并调用\
  \ `Promise.all(iterable)`。你将获得一个 promise，当可迭代对象中的所有 promise 都解析后，该 promise 解析。组合后的\
  \ promise 的值是所有 promise 结果的可迭代对象，顺序与 promise 本身的顺序相同。\n\n这为我们提供了一种加载系列图像并按顺序它们的简单方法：\n\
  \n点击此处查看代码图像\n\n```\nconst promises = [\n  loadImage('hanafuda/1-1.png'),\n  loadImage('hanafuda/1-2.png'),\n\
  \  loadImage('hanafuda/1-3.png'),\n  loadImage('hanafuda/1-4.png')]\nPromise.all(promises)\n\
  \  .then(images => { for (const img of images) imgdiv.appendChild(img) })\n```\n\
  \n`Promise.all` 实际上并没有并行运行任务。所有任务都在单线程中按顺序执行。然而，它们调度的顺序是不可预测的。例如，在加载加载示例中，你不知道哪张图片的数据先到达。\n\
  \n正如前面提到的，`Promise.all` 返回一个针对可迭代对象的 promise。该可迭代对象包含各个 promise 的结果，且顺序正确，无论获取结果的顺序如何。\n\
  \n在之前的示例代码中，当所有图像加载完成后，`then` 方法被调用，并从 `images` 可迭代对象按正确顺序添加它们。\n\n如果你传递给 `Promise.all`\
  \ 的可迭代对象包含非 promise 对象，它们会被简单的包含在结果可迭代对象中。\n\n如果任何 promise 被拒绝，则 `Promise.all` 将产生一个被拒绝的\
  \ promise，其错误是第一个被拒绝 promise 的错误。\n\n如果你需要对拒绝进行更细粒度的控制，请使用 `Promise.allSettled`\
  \ 方法。它产生一个针对可迭代对象的 promise，其元素是如下所示形式的对象：\n\n点击此处查看代码图像\n\n```\n{ status: 'fulfilled',\
  \ value: result }\n```\n\n或\n\n点击此处查看代码图像\n\n```\n{ status: 'rejected', reason:\
  \ exception }\n```\n\n练习 8 展示了如何处理结果。\n\n### 9.8 多个 Promise 的竞赛\n\n有时，你想并行执行任务，但想在第一个任务完成时立即停止。一个典型的例子是搜索，你对第一个结果就感到满意。`Promise.race(iterable)`\
  \ 运行可迭代对象中的 promise，直到其中一个就绪。该 promise 决定了竞赛的结果。\n\n![Images](img/caution.jpg) 注意\n\
  \n如果可迭代对象包含非 promise 对象，则其中某一个将将是竞赛的结果。如果可迭代对象为空，则 `Promise.race(iterable)` 永远不会就绪。\n\
  \n被拒绝的 promise 可能会赢得竞赛。在这种情况下，尽管其中一个 promise 可能会产生结果，所有其他 promise 也会被放弃。一个更有用的方法\
  \ `Promise.any` 目前是阶段 3 候选方案。\n\n`Promise.any` 方法持续运行，直到其中一个任务解析。在所有 promise 都被拒绝的不幸情况下，生成的\
  \ promise 将被 `AggregateError` 拒绝，该错误收集了所有的拒绝原因。\n\n点击此处查看代码图像\n\n```\nPromise.any(promises)\n\
  \  .then(result => . . .) // 处理第一个就绪 promise 的结果\n  .catch(error => . . .) // 没有一个\
  \ promise 就绪\n```\n\n### 9.9 异步函数\n\n你刚刚看到了如何使用 `then` 和 `catch` 方法构建 promise 流水线，以及如何使用\
  \ `Promise.all` 和 `Promise.any` 并发执行系列 promise。然而，这种编程风格并不十分方便。与其使用熟悉的语句序列和控制流，你需要通过方法调用来设置流水线。\n\
  \n`await`/async` 语法让处理 promise 变得更加自然。\n\n该表达式\n\n```\nlet value = await promise\n\
  ```\n\n会等待 promise 就绪并产生其值。\n\n但等一下……我们在本章开头不是学过在 JavaScript 函数中持续等待是一个糟糕的主意吗？事实上确实如此，而且你不能在普通函数中使用\
  \ `await`。`await` 操作符只能出现在函数中。`await` 操作符只能出现在标记有 `async` 的函数中：\n\n```\nasync (url,\
  \ element) {\n```\n\n```\nconst img = await loadImage(url)\n```\n\n编译器转换了 `async`\
  \ 函数的代码，使得 `await` 之后的任何步骤在 promise 就绪后执行。例如，`putImage` 函数等同于：\n\n```\nconst putImage\
  \ = (url, element) => {\n  loadImage(url).then(img => element.appendChild(img))\n\
  }\n```\n\n多个 `await` 是允许的：\n\n```\nconst putImages = async (url1, url2, element)\
  \ => {\n  const img1 = await loadImage(url1)\n  element.appendChild(img1)\n  const\
  \ img2 = await loadImage(url2)\n  element.appendChild(img2)\n}\n```\n\n循环也是可以：\n\
  \n```\nconst putImages = async (urls, element) => {\n  for (url of urls) {\n   \
  \ const img = await loadImage(url)\n    element.appendChild(img)\n  }\n}\n```\n\n\
  从这些示例可以看出，编译器在背后做的重写并不简单。\n\n![Images](img/caution.jpg) 注意\n\n如果在调用 `async` 函数时忘记\
  \ `await` 关键字，函数会被调用并返回一个 promise，但该 promise 会停在那里什么都不做。考虑这个场景，它改编自许多博客：\n\n点击此处查看代码图像\n\
  \n```\nconst putImages = async (urls, element) => {\n  for (url of urls)\n    putImage(url,\
  \ element) // 错误——异步 putImage 没有 await\n}\n```\n\n这个函数产生并遗忘了 `Promise` 对象，然后返回 `Promise.resolve(undefined)`。如果一切顺利，图像将按某种顺序添加。如果发生异常，将无人捕获它。\n\
  \n你可以将 `async` 关键字应用于以下场景：\n\n-   箭头函数：\n    点击此处查看代码图像\n    ```\n    async url\
  \ => { . . }\n    async (url, params) => { . . }\n    ```\n-   方法：\n    点击此处查看代码图像\n\
  \    ```\n    class ImageLoader {\n      async load(url) { . . }\n    }\n    ```\n\
  -   命名函数和匿名函数：\n    点击此处查看代码图像\n    ```\n    async function loadImage(url) { . .\
  \ }\n    async function(url) { . . }\n    ```\n-   对象字面量方法：\n    点击此处查看代码图像\n  \
  \  ```\n    obj = {\n      async loadImage(url) { . . . },\n      . . .\n    }\n\
  \    ```\n\n\n\n\n![Images](img/note.jpg) 注意\n\n在所有情况下，结果函数都是一个 `AsyncFunction`\
  \ 实例，而不是 `Function`，尽管 `typeof` 仍然报告为 `'function'`。\n\n### 9.10 异步返回值\n\n一个 `async`\
  \ 函数看起来好像返回了一个值，但它总是返回一个 promise（期言）。这里有一个示例。URL [`https://aws.random.cat/meow`](https://aws.random.cat/meow)\
  \ 提供随机猫咪图片的位置，返回一个 JSON 对象，例如 `{ file: 'https://purr.objects-us-east-1.dream.io/i/mDh7a.jpg'\
  \ }`。\n\n使用 `Fetch API`，我们可以这样获取内容的 promise：\n\n点击此处查看代码图片\n\n```javascript\nconst\
  \ result = await fetch('https://aws.random.cat/meow')\n\nconst imageJSON = await\
  \ result.json()\n```\n\n第二个 `await` 是必要的，因为在 `Fetch API` 中，JSON 处理是异步的——调用 `result.json()`\
  \ 会产生另一个 promise。\n\n现在我们准备好写一个返回猫咪图片 URL 的函数了：\n\n点击此处查看代码图片\n\n```javascript\n\
  const getCatImageURL = async () => {\n  const result = await fetch('https://aws.random.cat/meow')\n\
  \  const imageJSON = await result.json()\n  return imageJSON.file\n}\n```\n\n当然，该函数必须被标记为\
  \ `async`，因为它使用了 `await` 操作符。\n\n该函数看起来返回了一个字符串。`await` 操作符的作用是让你处理值，而不是 promise。但当你离开一个\
  \ `async` 函数时，这种幻象就结束了。在 `return` 语句中出现的值总是变成一个 promise。\n\n你可以用 `async` 函数做些什么？由于它返回一个\
  \ promise，你可以通过调用 `then` 来获取结果：\n\n点击此处查看代码图片\n\n```javascript\ngetCatImageURL()\n\
  \  .then(url => loadImage(url))\n  .then(img => imgdiv.appendChild(img))\n```\n\n\
  或者你可以用 `await` 操作符获取结果：\n\n点击此处查看代码图片\n\n```javascript\nconst url = await getCatImageURL()\n\
  const img = await loadImage(url)\nimgdiv.appendChild(img)\n```\n\n后者看起来更漂亮，但它必须在另一个\
  \ `async` 函数中执行。正如你所见，一旦你进入了 `async` 世界，就很难离开。\n\n考虑这个 `async` 函数的最后一行：\n\n点击此处查看代码图片\n\
  \n```javascript\nconst loadCatImage = async () => {\n  const result = await fetch('https://aws.random.cat/meow')\n\
  \  const imageJSON = await result.json()\n  return await loadImage(imageJSON.file)\n\
  }\n```\n\n你可以省略最后一个 `await` 操作符：\n\n点击此处查看代码图片\n\n```javascript\nconst loadCatImage\
  \ = async () => {\n  const result = await fetch('https://aws.random.cat/meow')\n\
  \  const imageJSON = await result.json()\n  return loadImage(imageJSON.file)\n}\n\
  ```\n\n无论哪种方法，这种方法都返回一个由 `loadImage` 调用异步产生的图片 promise。\n\n我发现第一个版本更容易理解，因为 `async`/`await`\
  \ 语法一致地隐藏了所有 promise。\n\n![Images](img/caution.jpg) 注意\n\n在 `try`/catch` 语句内部，`return\
  \ await promise` 和 `return promise` 之间存在细微的——参见练习 11。在这里，你不想丢掉 `await` 操作符。\n\n\
  如果一个 `async` 函数在从未调用 `await` 之前返回了一个值，该值会被封装在一个已解析的 promise 中：\n\n点击此处查看代码图片\n\n\
  ```javascript\nconst getJSONProperty = async (url, key) => {\n  if (url === undefined)\
  \ return null\n  // 实际上返回 Promise.resolve(null)\n  const result = await fetch(url)\n\
  \  const json = await result.json()\n  return json[key]\n}\n```\n\n![Images](img/note.jpg)\
  \ 注意\n\n本节的 `async` 函数在未来返回一个单一值。在第 12 章中，你将看到 `async` 迭代器如何在未来产生一个值序列。这里有一个产生整数范围的示例，它们之间有给定的延迟。\n\
  \n点击此处查看代码图片\n\n```javascript\nasync function* range(start, end, delay) {\n  for\
  \ (let current = start; current < end; current++) {\n    yield await produceAfterDelay(current,\
  \ delay)\n  }\n}\n```\n\n不要担心这个“异步生成器函数”的语法。你可能不会实现一个，但你可能会使用库提供的。你可以使用 `for await\
  \ of` 循环来获取结果：\n\n点击此处查看代码图片\n\n```javascript\nfor await (const value of range(0,\
  \ 10, 1000)) {\n  console.log(value)\n}\n```\n\n这个循环必须在 `async` 函数内部，因为它在等待所有值。\n\
  \n### 9.11 并发等待\n\n连续的 `await` 调用是一个接一个执行的：\n\n点击此处查看代码图片\n\n```javascript\nconst\
  \ img1 = await loadImage(url)\nconst img2 = await loadCatImage() // 只在第一个图像加载后开始\n\
  ```\n\n并发加载图片会更高效。你需要使用 `Promise.all`：\n\n点击此处查看代码图片\n\n```javascript\nconst [img1,\
  \ img2] = await Promise.all([loadImage(url), loadCatImage()])\n```\n\n为了理解这个表达式，仅仅理解\
  \ `async`/await` 语法是不够的。你真的需要了解 promise。\n\n`Promise.all` 的参数是 promise 的迭代器。在这里，`loadImage`\
  \ 函数返回一个 promise，而 `loadCatImage` 是一个隐式返回 promise 的 `async` 函数。\n\n`Promise.all`\
  \ 方法返回一个 promise，所以我们可以对其调用 `await`。promise 的结果是一个我们可以解构的数组。\n\n如果你不懂底层发生了什么，很容易犯错。考虑这条语句：\n\
  \n点击此处查看代码图片\n\n```javascript\nconst [img1, img2] = Promise.all([await loadImage(url),\
  \ await loadCatImage()])\n// ——仍然是顺序的\n```\n\n语句可以编译并运行。但它并没有并发加载图像。`await loadImage(url)`\
  \ 调用完成后才会启动 `await loadCatImage()`。\n\n### 9.12 异步函数中的异常\n\n在 `async` 函数中抛出异常会产生一个拒绝的（rejected）promise。\n\
  \n点击此处查看代码图片\n\n```javascript\nconst getAnimalImageURL = async type => {\n  if (type\
  \ === 'cat') {\n    return getJSONProperty('https://aws.random.cat/meow', 'file')\n\
  \  } else if (type === 'dog') {\n    return getJSONProperty('https://dog.ceo/api/breeds/image/random',\
  \ 'message')\n  } else {\n    throw Error('bad type') // 异步函数返回拒绝的 promise\n  }\n\
  }\n```\n\n相反，当 `await` 操作符接收到一个拒绝的 promise 时，它会抛出一个异常。以下函数捕获了来自 `await` 操作符的异常：\n\
  \n点击此处查看代码图片\n\n```javascript\nconst getAnimalImage = async type => {\n  try {\n\
  \    const url = await getAnimalImageURL(type)\n    return loadImage(url)\n  } catch\
  \ {\n    return brokenImage\n  }\n}\n```\n\n\n\n你不必将每一个 `await` 都封装在 `try`/`catch`\
  \ 语句中，但你需要为 `async` 函数设计某种错误处理策略。也许你的顶层 `async` 函数捕获了所有的异步异常，或者你通过文档说明调用者必须对返回的\
  \ promise 调用 `catch`。\n\n在 Node.js 中，当 promise 在顶层被拒绝（rejected）时，会出现一个严重的警告，指出未来版本的\
  \ Node.js 可能会终止进程——请参见练习 12。\n\n### 练习\n\n1. 第 9.1 节 中的示例程序“JavaScript 中的并发任务”（第\
