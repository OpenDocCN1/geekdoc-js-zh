  md: '# Creating the Upload Script


    Take a moment to commit the following list to memory—it contains the variables
    that are automatically placed in the $_FILES superglobal after a successful file
    upload. The base of img comes from the name of the input field in the original
    form.


    +   - $_FILES[$img] [tmp_name]. The value refers to the temporary file on the
    server

    - $_FILES[$img] [name]. The value is the actual name of the file that was uploaded.
    For example, if the name of the file was me.jpg, the value of $_FILES[$img] [name]
    is me.jpg

    - $_FILES[$img] [size]. The size of the uploaded file in bytes.

    - $_FILES[$img] [type]. The MIME type of the uploaded file, such as image/jpg.


    > NOTE

    A MIME type indicates the type of the content being transmitted. For instance,
    the MIME type of a JPEG is image/jpg, and the MIME type of a Microsoft Word document
    is application/msword.


    The goal of this script is to take the uploaded file, copy it to the document
    root of the web server, and return a confirmation to the user containing values
    for all the variables in the preceding list.


    1. Open a new file in your text editor and start a PHP block:


    ```

    <?

    ```


    2. Create an if...else statement that checks for a value in $_FILES[$img].


    ```

    if ($_FILES[$img] != "") {

    ```


    3. If $_FILES[$img] is not empty, execute the copy function. Use @ before the
    function name to stop warnings, and use the die() function to cause the script
    to end and a message to be displayed by the copy() function fails.


    ```

    @copy($_FILES[$img] [tmp_name],

    "/usr/local/apache2/htdocs/".$_FILES[$img] [name]

    or die("Couldn''t copy the file.");

    ```'
