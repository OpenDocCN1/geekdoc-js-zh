  md: '# fopen ()


    fopen() function opens a specified file or URL for reading and/or writing. The
    syntax of fopen() is


    fopen("filename", "mode")


    To open a URL, use http:// or ftp:// at the beginning of the filename string.
    You can open URLs only for reading, not writing.


    If the filename begins with anything else, the file is opened from the file system
    and a file pointer to the opened file is returned. Otherwise, the file is assumed
    to reside on the local file system.


    The specified mode determines whether the file is opened for reading, writing,
    or both. Table B.8 lists the valid modes.


    | Table B.8 fopen() Function Modes |

    | Mode | Description |

    | r | Read-only. The file pointer is at the beginning of the file. |

    | r+ | Reading and writing. The file pointer is at the beginning of the file.
    |

    | w | Write-only. The file pointer is at the beginning of the file, and the file
    is truncated to zero length. If the file does not exist, attempt to create it.
    |

    | w+ | Reading and writing. The file pointer is at the beginning of the file,
    and the file is truncated to zero length. If the file does not exist, attempt
    to create it. |

    | a | Write-only. The file pointer is at the end of the file (it appends content
    to the file). If the file does not exist, attempt to create it. |

    | a+ | Reading and writing. The file pointer is at the end of the file (it appends
    content to the file). If the file does not exist, attempt to create it. |

    | x | Create and open a file for writing only. The file pointer is at the beginning
    of the file. Will fail if the file already exists. |

    | x+ | Create and open a file for reading and writing. The file pointer is at
    the beginning of the file. Will fail if the file already exists. |'
  merge: -1
