    With this change, the warning is suppressed, and only the message from the die()
    function is displayed. This is a meaningful error message from the mysql_error()
    function.


    If you can keep nasty errors and warnings to a minimum, it will make the overall
    user experience much more pleasant if your database decides to render itself unavailable
    during peak web-serving hours.'
