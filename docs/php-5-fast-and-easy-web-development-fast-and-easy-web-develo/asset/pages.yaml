  md: "# USING FUNCTIONS IN YOUR CODE 497\n\nInstead, imagine a function called db_connect(),\
    \ which contains your database\nconnection and selection code:\n\n```\nfunction\
    \ db_connect() {\n    $connection = @mysql_connect(\"localhost\", \"spike\", \"\
    9sj7En4\")\n    or die(mysql_error());\n    $db = @mysql_select_db($db_name, $connection)\n\
    \    or die(mysql_error());\n}\n```\n\nInstead of typing those two lines over\
    \ and over in every script, imagine simply\ntyping this:\n\n```\ndb_connect();\n\
    ```\n\nIf your host name, username, password, or database name change, you have\
    \ to\nchange this information in only one place—the db_connect() function code.\
    \ Now\nt only trick is where to put this function. Obviously, if you are creating\
    \ a function\nin order to reuse the code within it, you don't want the function\
    \ to be part of the\nscript. Instead, you place the function in its own file (or\
    \ a file containing other\nfunctions) and use include() or require() to pull the\
    \ information into your script\nas appropriate.\n\n# Using include() and require()\n\
    \nThe include() and require() functions do essentially the same thing: When called,\n\
    t code in the included file becomes part of the script calling it. From that point\n\
    forward, anything in the included file can be used in the script calling it.\n\
    \nThe difference between include() and require() pops up when the file to be\n\
    included cannot be opened. This occurs because of incorrect permissions, or\n\
    perhaps the file isn't in the location specified. When a failure occurs using\
    \ include(),\nyou get a warning, but the code continues to execute as best it\
    \ can, which is to say,\nnot well if it needs a function that's in some other\
    \ file! When require() cannot\nfind or open the file, you will get a fatal error\
    \ and PHP will stop processing the code\naltogether."
