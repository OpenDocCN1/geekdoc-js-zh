  md: '# APPENDIX E: USING SQLITE


    > NOTE

    In this example, the date() function formats the value of stored in the

    date_added field. You can learn more about the numerous formatting options

    for the date() function in Appendix B, "Basic PHP Language Reference,\nand in
    the PHP manual at http://www.php.net/date.


    4. The echo statement inside the while loop to:


    ```

    echo record ID# sid: $last_name, $first_name ($email)

    added on $date_added<br>";

    ```


    Save this file as sqlite.php and place it in the document root of your

    browser. Access the script at http://127.0.0.1/sqlite7.php to issue these SQLite

    commands and display the output. You should see something like this figure,

    including the formatted version of the date-stamp stored in the SQLite table.


    ![](img/be897bd1bfd4dab38767db24da2a794b_552_0.png)


    As you can see, virtually anything

    y can do with MySQL, you can

    do (with a little elbow grease in

    some instances) with SQLite. If

    y find yourself without a

    database server, nothing should

    keep you from utilizing this new

    feature of PHP 5.'
