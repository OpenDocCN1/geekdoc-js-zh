  md: '# ucfirst()


    The ucfirst() function changes the first alphabetic character in a string to an
    uppercase character. Its syntax is


    ```

    ucfirst(string);

    ```


    # ucwords()


    The ucwords() function changes the first letter of each word in a string to uppercase.
    Its syntax is


    ```

    ucwords(string);

    ```


    # Variable Functions


    The two basic variable functions, isset() and unset(), help you manage your variables
    within the scope of an application.


    The isset() function determines whether a variable exists. The unset() function
    explicitly destroys the named variable. Here is the syntax of each:


    ```

    isset(var);

    ```


    ```

    unset(var);

    ```


    The isset() function returns true if the variable exists and false if it does
    not.'
