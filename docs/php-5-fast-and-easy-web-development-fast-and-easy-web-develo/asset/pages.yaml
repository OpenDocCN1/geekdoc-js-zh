  md: '# How PHP Is Parsed


    So you have a file, and in that file you have some HTML and some PHP code. This
    is how it all works, assuming a PHP document with an extension of .php.


    > NOTE The file extension does not have to be .php, but it does have to be an
    extension that Apache understands should be parsed as PHP, which you learned in
    Chapter 2, "Installing Apache."


    +   1. The web browser requests a document with a .php extension.

    2. The web server says, "Hey! Someone wants a PHP file, which means this is a
    file that needs to be parsed," and sends the request on to the PHP parser.

    3. The PHP parser finds the requested file and scans it for PHP code.

    4. When the PHP parser finds PHP code, it executes that and places the resulting
    output (if any) into the place in the file formerly occupied by the code.

    5. This new output file is sent back to the web server.

    6. The web server sends it along to the web browser.

    7. The web browser displays the output.


    Because the PHP code is parsed on the server, this method of code execution is
    called server-side code. When code is executed in a browser, such as JavaScript,
    it is called client-side code.


    To combine PHP code with HTML, the PHP code must be set apart from the HTML. In
    the next section, you''ll learn how this is done, using PHP start and end tags.


    # PHP Start and End Tags


    The PHP parser recognizes a few types of PHP start and end tags. It will attempt
    to execute anything between these tags, so it had better be valid code!'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'Study Table 4.1 to learn the three main sets of start and end tags recognized
    by the PHP parser.


    | Table 4.1 Basic PHP Start and End Tags |

    | Opening Tag | Closing Tag |

    | --- | --- |

    | <?php | ?> |

    | <?? | ?>> |

    | <script language="php"> | </script> |


    Next, you''ll use all three sets of tags in a script, which I promise execute
    without errors.


    Open a new file in your text editor.


    +   1. Open a new file in your text editor.

    2. Type the following code, which uses the first tag type:

    ```php

    <?php

    echo "<P>This is a test using the first tag type.</P>";

    ?>

    ```

    3. Type the following code, which uses the second tag type:

    ```php

    <?php

    echo "<P>This is a test using the second tag type.</P>";

    ?>

    ```

    4. Type the following code, which uses the third tag type:

    ```php

    <script language="php">

    echo "<P>This is a test using the third tag type.</P>";

    </script>

    ```'
