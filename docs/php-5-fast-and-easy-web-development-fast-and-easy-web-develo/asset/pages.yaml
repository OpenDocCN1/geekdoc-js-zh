    You can see by this output that the values you assigned to the variables $intVar,
    $floatVar, and $string were the values printed to the screen. In the next section,
    you''ll learn how to use operators to change the values of your variables.


    # Local and Global Variables


    Variables can be local or global, the difference having to do with their definition
    and use by the programmer, and where they appear in the context of the scripts
    you are creating. The variables described in the previous section, and for the
    majority of this book, are local variables.


    When you write PHP scripts that use variables, those variables can be used only
    by the script in which they live. Scripts cannot magically reach inside other
    scripts and use the variables created and defined there—unless you say so and
    purposely link them together. When you do just that, such as when you create your
    own functions (blocks of reusable code that perform a particular task), you will
    define the shared variables as global. That is, you will define them as able to
    be accessed by other scripts and functions, as needed.'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'You can learn about creating your own functions, and using global as well as
    local variables, in Appendix C, "Writing Your Own Functions and Objects." For
    now, just understand that there are two variable scopes—local and global—that
    come into play as you write more advanced scripts.


    # Pre-Defined Variables


    In all PHP scripts, a set of pre-defined variables is available to you. You might
    have seen some of these variables in the output of the `phpinfo()` function, if
    you scrolled and read through the entire results page. Some of these pre-defined
    variables are called `superglobals`, meaning that they are always present and
    available to all of your scripts, without any intervention by you, the programmer.


    Please study the following list of superglobals, because they will be used exclusively
    throughout this book. Each of these superglobals is actually an array of variables.
    Don''t worry about fully understanding this concept now, because it will be explained
    as you move through the book.


    +   - `$_GET` contains any variables provided to a script through the GET method.

    - `$_POST` contains any variables provided to a script through the POST method.

    - `$_COOKIE` contains any variables provided to a script through a cookie.

    - `$_FILES` contains any variables provided to a script through file uploads.

    - `$_ENV` contains any variables provided to a script as part of the server environment.

    - `$_SESSION` contains any variables that are registered in a session.


    # Using Constants


    A constant is an identifier for a value that cannot change during the course of
    a script. Once a constant has a value, it remains through the constant''s execution
    lifetime. Constants can be user-defined, or you can use some of the predefined
    constants that PHP always has available. Unlike simple variables, constants do
    not have a dollar sign before their names, and they are usually uppercase to show
    their difference from scalar variables. Next, you''ll test the user-defined type.'
