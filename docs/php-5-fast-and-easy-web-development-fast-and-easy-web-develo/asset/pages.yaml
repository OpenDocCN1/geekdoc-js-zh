  md: '# 17 Session Basics


    Sessions are like cookies on steroids. Using sessions, you can maintain user-specific
    information without setting multiple cookies, or even using a database. In this
    chapter, you learn how to:


    +   - Start a session

    - Add a variable to the $_SESSION superglobal

    - Enable a per-user access count

    - Maintain user preferences throughout multiple pages'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# Before You Begin... php.ini


    Before you start working with sessions, check a value in your php.ini file. Look
    for this section of text and read it carefully:


    +   - Argument passed to save_handler. In the case of files, this is the path

    - where data files are stored. Note: Windows users have to change this

    - variable in order to use PHP''s session functions

    [much more explanatory text skipped]

    session.save_path = /tmp


    What the text in the php.ini file says, essentially, that you must modify the
    value of session.save_path so that the file can be written to a directory that
    exists. The change primarily affects Windows users, and the modification is simple.


    Enter a directory name after the = for session.save_path. For example, my php.ini
    file on Windows contains this:


    ```

    session.save_path = c:\temp

    ```


    After making the change, restart Apache so that the change takes effect. If you
    are using Linux/Unix, /tmp is a standard directory, and you can leave this alone
    unless you want to change it for some compelling reason.


    # What''s a Session?


    In terms of time, a session is the amount of time during which a user visits a
    site. In the programming world, a session is kind of like a big blob that can
    hold all sorts of variables and values.


    +   - This blob has an identification string, such as 940f8b05a40d5119c030c9c774ead9.

    - This identification string is automatically sent to the user when a session
    is initiated, in a cookie called PHPSESSID (accessible via $_COOKIE[PHPSESSID]).

    - On the server side, a matching temporary file is created with the same name
    (940f8b05a40d5119c030c9c774ead9).'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# Understanding Session Variables


    In the temporary session file on the web server, session variables (and their
    values) are stored. Because these values and variables are not kept in a database,
    no additional system resources are required to connect to and extract information
    from additional database tables. You can access session variables through the
    $_SESSION superglobal.


    For example, a temporary session file might contain the following:


    ```

    count[s:7:"76\];

    valid[s:7:"yes"];

    ```


    In this example, count and valid are the names of the session variables, and 76
    and yes are their respective values. However, to out the variable in the session,
    you must first explicitly add it to the $_SESSION superglobal. Once it is added,
    you can extract the value (using $_SESSION[count] or $_SESSION[valid], in this
    example).


    When you attempt to retrieve a session variable, the sequence goes something like
    this (say you''re trying to get the value of $_SESSION[count]);


    +   1. The PHP parser gets the value of $_COOKIE[PHPSESSID] from the user cookie.

    2. The PHP parser finds a matching temporary session file.

    3. Inside the session file, the PHP parser looks for count and then finds its
    value (say, 76).

    4. $_SESSION[count] is equal to 76.


    Next, you start your own per-user counter script using a session.


    # Starting a Session


    Starting a session is a snap. You just call the session_start() function, and
    PHP takes care of the rest, sending the cookie and creating the temporary file.'
  merge: -1
  pgno: 301
- img_proc: true
  md: '1. Open a new file in your text editor and start a PHP block, and then call
    the session_start() function:


    ```

    <?nsession_start();?>

    ```


    > NOTE The session_start() function actually performs several important tasks.
    First, it determines whether a session has been started for the current user,
    and it starts one if necessary. It also alerts the PHP engine that session variables
    and other session-related functions will be used within the specific script.


    Because of the dual purpose of session_start(), use it at the beginning of all
    session-related scripts.


    2. Create a string to hold a message, and then close the PHP block:


    ```

    $msg = "started a session...";?>

    ```


    3. Type the following HTML:


    ```

    <HTML><HEAD><TITLE>Start a Session</TITLE></HEAD><BODY>

    ```


    4. Display the message string:


    ```

    <? echo "\$msg"; ?>

    ```


    5. Add some more HTML so that the document is valid:


    ```

    </BODY></HTML>

    ```


    6. Save the file with the name session.php, and place this file in the document
    root of your web server.


    7. Open your web browser and type http://127.0.0.1/session.php.'
