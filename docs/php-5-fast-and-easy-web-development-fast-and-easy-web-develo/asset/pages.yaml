  md: '# Date and Time Functions


    The PHP date and time functions let you easily format timestamps for use in database
    queries and calendar functions, as well as for simply printing the date on an
    order form receipt.


    # date()


    The date() function returns the current server timestamp, formatted according
    to a given set of parameters. Its syntax is


    ```

    date(format, [timestamp]);

    ```


    If the timestamp parameter is not provided, the current timestamp is assumed.
    Table B.7 shows the available formats.


    # checkdate()


    The checkdate() function validates a given date. Successful validation means that
    the date is between 0 and 32767, the month is between 1 and 12, and the proper
    number of days is in each month (leap years are accounted for). Its syntax is


    ```

    checkdate(month, day, year);

    ```


    # mktime()


    The mktime() function returns the Unix timestamp as a long integer (in the format
    of seconds since the Epoch, or January 1, 1970) for a given date. Thus, the use
    of mktime() is to format dates in preparation for mathematical functions and date
    validation. Its syntax is


    ```

    mktime(hour, minute, second, month, day, year);

    ```


    # time() and microtime()


    The time() function returns the current system time, measured in seconds since
    the Epoch. The syntax of time() is simply


    ```

    time();

    ```'
