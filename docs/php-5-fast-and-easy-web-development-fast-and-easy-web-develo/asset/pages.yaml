  md: '# Working with fopen() and fclose()


    Before you jump headfirst into working with files, you need to learn a bit about
    the fopen() function, which is used to open files. This function requires a filename
    and mode, and it returns a file pointer. The file pointer provides information
    about the file and is used as a reference.


    The filename is the full path to the file you want to create or open, and the
    mode can be any of the modes listed in Table 9.1.


    | Mode | Usage |

    | --- | --- |

    | r | Opens an existing file and reads data from it. The file pointer is placed
    at the beginning of the file. |

    | r+ | Opens an existing file for reading or writing. The file pointer is placed
    at the beginning of the file. |

    | w | Opens a file for writing. If a file with that name does not exist, the function
    creates a new file. If the file exists, the function deletes all existing contents
    and places the file pointer at the beginning of the file. |

    | w+ | Opens a file for reading and writing. If a file with that name does not
    exist, the function creates a new file. If the file exists, the function deletes
    all existing content and places the file pointer at the beginning of the file.
    |

    | a | Opens a file for writing. If a file with that name does not exist, the function
    creates a new file. If the file exists, the function places the file pointer at
    the end of the file. |

    | a+ | Opens a file for reading and writing. If a file with that name does not
    exist, the function attempts to create a new file. If the file exists, the function
    places the file pointer at the end of the file. |


    # Creating a New File


    Compared to the first section of this chapter, this next task is a piece of cake.
    The goal is simply to create a new, empty file in a specified location.'
