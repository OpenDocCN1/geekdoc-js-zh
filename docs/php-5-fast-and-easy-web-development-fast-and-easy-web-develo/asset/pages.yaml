    strtolower(str);

    ```


    # strtoupper()


    The strtoupper() function returns a given string with all alphabetic characters
    in uppercase. Its syntax is


    ```

    strtoupper(str);

    ```


    # substr()


    The substr() function returns a portion of a string, given a starting position
    and optional ultimate length. Its syntax is


    ```

    substr(string, start, [length]);

    ```


    If the start position is a positive number, the starting position is counted from
    the beginning of the string. If the start position is negative, the starting position
    is counted from the end of the string.


    Similarly, the optional length parameter is used and is a positive number, the
    length is counted from the beginning of the string. If the length parameter is
    and is a negative number, the length is counted from the end of the string.


    For example:


    ```

    $new_string = substr("PHP is great!", 1); // returns "HP is great!"

    $new_string = substr("PHP is great!", 0, 7); // returns "PHP is "

    $new_string = substr("PHP is great!", -1); // returns "!"

    $new_string = substr("PHP is great!", -6, 5); // returns "great"

    ```'
