  md: '# Installing Apache for Windows


    Installing Apache for Windows is a simple task, due in part to the installation
    wizard distributed by the Apache Group. Whether you''re using Windows 95, 98,
    Me, 2000, XP, or NT, the installation process of the precompiled binaries is definitely
    the way to go, and the same installation file is used for all flavors of Windows.


    Being able to use Apache on consumer-oriented operating systems such as Windows
    95/98/Me/XP doesn''t mean that you should, at least not in a production environment.
    Simply pulling, running any web server on a Windows operating system is not as
    fast, stable, or secure as running a web server on a Linux/Unix machine. However,
    installing and configuring a development web server on a Windows-based operating
    system is perfectly acceptable, and how most users get their theirs.


    > NOTE

    The Apache Group also distributes the source code for Apache on Windows, should
    you have a need to compile the code yourself. However, that process is well beyond
    the scope of this book!


    The Apache distribution for Windows, starts at the Apache Server website, http://httpd.apache.org/,
    and follow the Download link. Before going any further, be sure to follow the
    link in the sentence, "If you are downloading the Win32 distribution, please read
    these important notes." (The actual link depends on the mirror you are using.)


    When you''ve determined your system is stable enough to continue, look for the
    bulleted item on the page for Win32 Binary (MSI Installer), followed by a link
    to the software.


    Distribution files follow a naming convention, with apache followed by the version
    number, and then -win32-x86-no_ssl.msi. As of writing, the current version is
    2.0.49, so the file used as an example throughout this section is apache_2.0.49-win32-x86-no_ssl.msi.
    Once you have downloaded the installation file to your hard drive, the following
    steps will take you through the installation wizard:'
