  md: "# Adding Error Checking to the Script\n\nThe plan is to use the global variable\
    \ $_SERVER[PHP_SELF], which has a value of the script's current name. So really,\
    \ $_SERVER[PHP_SELF] will have a value of allinline_form.php in this instance.\
    \ When you use $_SERVER[PHP_SELF] as a form action, you're saying, \"When the\
    \ submit button is clicked, reload this script and do something,\"\" instead of,\
    \ \"When the submit button is clicked, find another script and do something.\"\
    \n\nNow that you have a shell of a script, think about what this all-in-one script\
    \ must do:\n\n+   * Display the form\n* Submit the form\n* Check for errors\n\
    * Print error messages without sending the form\n* Send the form if no errors\
    \ are found\n\nMake a few modifications to the script to help it determine which\
    \ actions you should take. Inside the $form_block variable, before the HTML code\
    \ for the submit button, add this line:\n\n```\n<INPUT type=\"hidden\" name=\"\
    \\op\" value=\"\\ds\">\n```\n\nThis line creates a hidden variable $_POST[op],\
    \ which has a value of ds. The \"op\" stands for \"operation,\" and \"ds\" stands\
    \ for \"do something.\" I made these names up, they have nothing to do with any\
    \ programming language. You can call whatever you want, as long as you understand\
    \ what they do (which you'll see).\n\nThe $_POST[op] variable is present only\
    \ if the form has been submitted. So if the value of $_POST[op] is not ds, the\
    \ user hasn't seen the form. If the user hasn't seen the form, you need to show\
    \ it, so add the following if...else statement before the end of the PHP block:\n\
    \n```\nif ($_POST[op] != \"ds\") {\n    // they need to see the form\n    echo\
