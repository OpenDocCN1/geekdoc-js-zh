  md: '# 454 APPENDIX A: ADDITIONAL CONFIGURATION OPTIONS


    This line tells PHP to include support for MySQL and to build a dynamic module.

    Many other extensions and other configurations are available to you, many of which
    you''ll never use (I know I don''t). Table A.2 lists some of the more popular
    extensions in case you want to fiddle with your installation. However, for a complete
    list of extensions, configuration options, and more, you can use the following
    command at your shell prompt when in the PHP source directory:


    ```

    ./configure --help

    ```


    This will list all available configuration options.


    Remember, because PHP is an Apache dynamic module, you don''t have to recompile
    Apache when making changes to PHP!


    | Table A.2 Some Available Extensions |

    | Extension | Description |

    | --disable-all | Disable all extensions enabled by default. |

    | --disable-libxml | Disable libXML support. |

    | --with-openssl[DIR] | Include OpenSSL support (requires OpenSSL >= 0.9.6). |

    | --with-zlib[DIR] | Include ZLIB support (requires zlib >= 1.0.9). |

    | --enable-bcmath | Enable bc style precision math functions. |

    | --with-curl[DIR] | Include CURL support. |

    | --enable-dbase | Enable the bundled base library. |

    | --disable-dom | Disable new DOM support. |

    | --enable-ftp | Enable FTP support. |

    | --with-gd[DIR] | Include GD support where DIR is GD install prefix. |

    | --with-jpeg-dir[DIR] | GD: Set the path to libjpeg install prefix. |

    | --with-png-dir[DIR] | GD: Set the path to libpng install prefix. |

    | --with-zlib-dir[DIR] | GD: Set the path to libz install prefix. |

    | --with-xpm-dir[DIR] | GD: Set the path to libXpm install prefix. |

    | --with-ttf[DIR] | GD: Include FreeType 1.x support. |

    | --with-freetype-dir[DIR] | GD: Set the path to FreeType 2 install prefix.'
