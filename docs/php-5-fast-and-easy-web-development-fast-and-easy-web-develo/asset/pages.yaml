  md: '# Getting Variables from Forms


    HTML forms contain at least the following elements:


    +   - A method

    - An action

    - A submit button


    In your HTML code, the first line of a form looks something like this:


    ```

    <FORM METHOD="post" ACTION="yourscript.php">

    ```


    When you click on a submit button in an HTML form, variables are sent to the script
    specified by the ACTION via the specified METHOD. The method can be either POST
    or GET. Variables passed from a form to a PHP script are placed in the superglobal
    called $_POST or $_GET, depending on the form method. In the next section, you
    see how this works, by creating an HTML form and accompanying PHP script that
    performs calculations depending on the form input.


    # Creating a Calculation Form


    In this section, you''ll create the front end to a calculation script. This form
    will contain two input fields and a radio button to select the calculation type.


    +   1. Open a new file in your text editor.

    2. Type the following HTML:


    ```

    <HTML>

    <HEAD>

    <TITLE>Calculation Form</TITLE>

    </HEAD>

    <BODY>

    ```


    +   3. Begin your form. Assume that the method is POST and the action is a script
    called calculate.php:


    ```

    <FORM METHOD="post" ACTION="calculate.php">

    ```'
  merge: -1
  pgno: 108
- img_proc: true
