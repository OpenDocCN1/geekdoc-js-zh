  md: '# INSTALLING PHP FOR WINDOWS 39


    > NOTE

    If you change the installation directory name, be sure to substitute your new
    directory name in the remaining instructions in this chapter.


    +   1. Using Windows Explorer (or whatever method you prefer for moving your file
    system), go to the C: \php directory.


    +   2. Rename the .php.ini-dist file to php.ini and move this file to C:\WINDOWS\,
    or C:\WINNT\, or wherever you usually put *.ini files.


    +   3. Move php5ts.dll to C:\WINDOWS\SYSTEM, or C:\WINDOWS\SYSTEM\, or wherever
    you put your *.dll files.


    To get a basic version of PHP working with Apache, you''ll need to make a few
    minor modifications to the Apache configuration file.


    # Configuring Apache to Use PHP


    You can install PHP as a CGI binary or as an Apache module. The current recommendation
    by the PHP Group (and me) is to use the module version, because it offers greater
    performance and some additional functionality. However, you might encounter some
    conflicts with advanced functionality when using the module, depending on your
    particular operating system. Additionally, using the CGI version instead of the
    module version will allow you to create virtual hosts, each with its own PHP CGI
    executable, therefore allowing PHP to run as a named user instead of the default
    Apache process owner.


    If you would like to install the CGI version, please read the installation information
    in the PHP manual at http://www.php.net/manual/. In the next section, learn to
    install the module version of PHP for the Apache 2 server.


    # The Apache Module Version of PHP


    To configure Apache to use the module version, you have to move one piece of PHP
    and also make a few modifications to the Apache configuration file, the httpd.conf
    file, located in the conf directory within the Apache installation directory.'
