  md: '# CHAPTER 2: INSTALLING APACHE


    Once the appropriate modifications are made to the httpd.conf file, Apache is
    ready to run on your machine. In the next section, you start and connect to Apache.


    # Starting and Connecting to Apache


    There''s a handy utility in the bin directory within your Apache installation
    directory called apachectl. It allows you to issue start, stop, and restart commands.
    We use this utility to start Apache for the first time.


    +   1. To get to the Apache installation directory, type cd /usr/local/apache2
    and press Enter.


    +   2. Type .bin/apachectl start and press Enter.


    You should see a message: httpd started. If you do not see this message, you have
    an error somewhere in your configuration file, and the error message will tell
    you where to look.


    To stop Apache, you can type .bin/apachectl stop and press Enter. For now, keep
    it running, as the next step is to connect to the server via a web browser, and
    this would not be a good time to shut it down.


    With Apache running, you can connect to the server via your web browser of choice.
    The URL will be whatever you used as ServerName—an actual name or IP, or the localhost
    name or IP.


    > NOTE

    Remember, only you can connect to your web server using 127.0.0.1 or the name
    localhost. This book assumes that you''ll be using 127.0.0.1 as the ServerName,
    so if you are not, just substitute your machine name for 127.0.0.1 in the examples.'
  merge: -1
  pgno: 56
