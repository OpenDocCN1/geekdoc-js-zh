  md: '# Additional Configuration Options


    The installation instructions at the beginning of this book detailed a simple
    configuration of PHP. If you feel like venturing out on your own by adding additional
    extensions (on Windows) or recompiling PHP (on Linux), this appendix gives you
    a brief rundown of some of your options. PHP can be as powerful or as streamlined
    as you want it to be, but a general rule of thumb is only to add functionality
    that you really need. For example, if you have no plans for connecting to an Oracle
    database, you do not need to enable support for the Oracle functions. But PHP
    is very extendable, meaning you can add functionality whenever you want—like if
    your company decides to buy an Oracle license!'
  merge: -1
