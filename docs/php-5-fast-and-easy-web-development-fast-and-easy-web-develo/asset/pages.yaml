- img_proc: true
  md: '# Windows Extensions


    Basic functionality is already built into PHP binary distributions for Windows,
    including:


    +   * Regular expression support

    * Dynamic library support

    * Internal sendmail support

    * Perl-compatible regular expression support

    * ODBC support

    * Session support

    * XML support

    * MySQL support


    and much more!


    To get additional functionality, you must use additional extensions (.dll files),
    40 of which are included with the distribution. Some of the more popular extensions
    are listed in Table A.1.


    To turn an extension "on", you must modify your php.ini file.


    +   ### Open php.ini in a text editor and find the following lines:


    ```

    ; Directory in which the loadable extensions (modules) reside.

    extension_dir = ./

    ```


    +   ### Change the second line so that it points to the directory containing your
    extensions, as such


    ```

    extension_dir = /php/extensions

    ```


    +   ### Next, find a section that starts like this:


    ```

    ;Windows Extensions

    ```


    +   ### For each extension you want to use, take away the semicolon before the
    name of the file in the list.'
  merge: -1
  pgno: 474
