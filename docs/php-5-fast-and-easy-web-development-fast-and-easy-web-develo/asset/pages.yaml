    # HTTP Environment Variables


    When a web browser makes a request of a web server, it sends along with the list
    of extra variables. These are called environment variables. These can be very
    useful for displaying dynamic content or authorizing users.


    The phpinfo() function displays a wealth of information about your web software
    and the version of PHP you are running, in addition to the basic HTTP environment.
    Let''s see what you have.


    +   1. Open a new file in your text editor.


    +   2. Type the following line of PHP code:


    <?php phpinfo(); ?>


    +   3. Save the file with the name phpinfo.php, and place this file in the document
    root of your web server.


    +   4. Open your web browser and type http://127.0.0.1/phpinfo.php.'
