- img_proc: true
  md: "In this case, you call the multiplier() function and then use the name of your\
    \ variable in the echo statement, because it's not returned directly from your\
    \ function. For example, using the modified function, the following code will\
    \ print the number 40 to your screen:\n\n```\nmultiplier(5);\necho $answer;\n\
    ```\n\nIf you had not declared $answer as a global variable, the result would\
    \ have been a blank screen.\n\n> NOTE\nSome use thought to determine which variables\
    \ you really want to make globally apply to your scripts. Each time you declare\
    \ something global, you must employ additional programming constraints in order\
    \ to maintain the integrity of the data. In other words, you have to be careful\
    \ and watch what you do. If you have declared a variable as global, but you use\
    \ a variable of the same name in another part of your script, you will overwrite\
    \ one or the other. A good rule of thumb is to keep a handle on your global variables,\
    \ and keep them local to the procedures that directly use them.\n\n# Using Functions\
    \ in Your Code\n\nSo far, you've learned the basic structure of a user-defined\
    \ function, but not how it fits within your own scripts. In the case of the multiplier()\
    \ function, it does seem awfully time-consuming to create a script like the following\
    \ just to print a number on the screen:\n\n```\n<<?nfunction multiplier($num)\
