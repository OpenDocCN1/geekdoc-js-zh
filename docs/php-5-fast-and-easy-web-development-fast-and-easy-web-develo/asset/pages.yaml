  md: '# Creating the my_contacts Table


    It''s time to create the my_contacts table, complete with one primary key and
    auto-incrementing field!


    +   1. Open your web browser and type http://127.0.0.1/show_createtable.html.


    +   2. In the Table Name field, type my_contacts.


    +   3. In the Number of Fields field, type 12.


    +   4. Click on the Go to Step 2 button.


    ![](img/be897bd1bfd4dab38767db24da2a794b_334_0.png)


    You will see a form with 12 rows, corresponding to the 12 fields you want to create
    in the my_contacts table. Populate the fields in these next steps:


    +   1. In the first row, type id for the Field Name, select int from the Field
    Type drop-down menu, check the box for Primary Key, and check the box for Auto-Increment.


    +   2. In the second row, type f_name, select varchar from the Field Type drop-down
    menu, and specify a Field Length of 75.


    +   3. In the third row, type i_name for the Field Name, select varchar from the
    Field Type drop-down menu, and specify a Field Length of 75.


    +   4. In the fourth row, type address1 for the Field Name, select varchar from
    the Field Type drop-down menu, and specify a Field Length of 100.'
