  md: '# DEVELOPING THE MAILING MECHANISM 413


    You should have a nicely formatted newsletter in your mailbox!


    ![](img/be897bd1bfd4dab38767db24da2a794b_435_0.png)


    # Troubleshooting Your Mailing List Mechanism


    If you receive an error such as "Warning: Can''t connect", you must make sure
    you modified the value of SMTP in your php.ini file. This topic is covered in
    Chapter 8, "Sending E-Mail," and is a simple fix.


    Another problem when using this type of mailing mechanism is that the script will
    time out eventually, if your list is long enough. This is one of the reasons not
    to use this type of mechanism for sending newsletters to large lists of recipients.
    Because all this script does execute the mail() function numerous times, it does
    not take into account the queuing factors in real mailing list software, which
    are designed to ease the burden on your outgoing mail server.


    To get around a problem with the script timing out, you can reset the timer within
    the execution of the script. Essentially, by inserting the following line within
    your while loop, you are setting the timer to 0 before each call to the mail()
    function:


    ```

    set_time_limit(0);

    ```'
