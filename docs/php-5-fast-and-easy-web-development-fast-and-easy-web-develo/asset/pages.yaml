  md: '# 478 APPENDIX B: BASIC PHP LANGUAGE REFERENCE


    > NOTE


    This information bears repeating: Do not attempt to send information of any sort
    to the browser before sending a header(). You can perform any sort of

    database manipulations or other calculations before the header(), but you

    cannot print anything to the screen—not even a newline character.


    For example, to use the header() function to redirect a user to a new location,
    use this code:


    ```

