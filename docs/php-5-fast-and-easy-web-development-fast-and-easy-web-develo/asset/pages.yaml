  md: '# CHAPTER 1: INSTALLING AND CONFIGURING MYSQL


    # Various MySQL Distributions


    The most popular distribution of MySQL is the open source version from MySQL AB.
    However, there are also commercial versions of MySQL, as well as distributions
    of MySQL bundled with application software. a solution is available for you on
    all platforms—any Unix-like operating system, as well as on Windows 95/98/NT/2000/XP/2003.
    This chapter assumes you''re using the MySQL installation files from the MySQL
    website.


    If you are using MySQL as part of a web-hosting package through an Internet provider,
    you don''t have to worry about downloading and installing the application in this
    chapter. Instead, you just need to work with your ISP to get your username and
    password. In all cases, your ISP will be running the MySQL distribution from MySQL
    AB. There''s no harm in setting up MySQL on a development machine, if you have
    one available (your own workstation fits bill), just to better understand the
    process. And that, if you have a Linux workstation or server, MySQL was likely
    included on your OS distribution CDs as an installation option, and perhaps you
    even installed it already. In case, you should check the MySQL website to compare
    the version numbers, and download a newer version if one is available.


    The installation instructions in this chapter are based on the MySQL version 4.0.x,
    distributed by MySQL AB.


    > NOTE

    If you are using MySQL at your ISP and they are still using a 3.23.x version,
    don''t worry—you will be able to use all of the database-related examples in this
    book.


