  md: '# Introduction


    If you would have told me four years ago that this book would be so popular as
    warrant a third edition, I would have laughed at you. But the style of this book,
    and its contents, has proven to be quite suitable for the beginning PHP programmer.
    The Fast & Easy Web Development style is a step-by-step, learn-by-example path
    to learning a new programming language with pictures included! Unlike the verbose
    text-only chapters found in most programming books, the Fast & Easy Development
    style appeals to users who are new to PHP, and especially to programming in general.


    This third edition takes into account feedback received from the first two editions,
    but holds true to the original content structure and path to learning. For example,
    the first three chapters are dedicated to Apache, MySQL, and PHP up and running
    on your Windows or Linux machine. You might be surprised at how simple it is,
    and how quickly you''ll be up and running because you need all three technologies
    to be working in order to continue with the lessons.


    In this edition, some chapters have been added to provide additional projects
    for practicing your new skills, and also to account for new elements present in
    version 5 of PHP. After completing this book, you will have a strong foundation
    in the basics of web-based technologies and application design, and will be prepared
    to learn more advanced topics and programming methodologies. However, before jumping
    into all that, take a moment to familiarize yourself with PHP and why it is such
    a wonderful language to learn and use.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# xvi INTRODUCTION


    # What Is PHP?


    Its official name is PHP: Hypertext Preprocessor, and it is a server-side scripting
    language. When your web browser accesses a URL, it is making a request to a web
    server. When you request a PHP page, something like http://www.yourcompany.com/home.php,
    the web server wakes up the PHP parsing engine and says, "Hey! You''ve got to
    do something before I send a result back to this person''s browser.\ Then, the
    PHP parsing engine runs through the PHP code found home.php, and returns the resulting
    output. This output is passed back to the web server as part of the HTML code
    in the document, which in turn is passed to your browser, which displays it to
    you.


    # A Brief History of PHP


    In 1994, an incredibly forward-thinking man named Rasmus Lerdorf developed a set
    of tools that used a parsing engine to interpret a few macros here and there.
    They were not extravagant: a guest book, a counter, and some other "home page"
    elements that were cool when the web was in its infancy. He eventually combined
    these tools with a free interpretation (FI) package he had written, some database
    support, and released what was known as PHP/FI.


    Then, in the spirit of Open Source software development, developers all over the
    world began contributing to PHP/FI. By 1997, more than 50,000 websites were using
    PHP/FI to accomplish different tasks—connecting to a database, displaying dynamic
    content, and so on.


    At that point, the development process really started becoming a team effort.
    With primary assistance from developers Zeev Sasaki and Andi Gutmans, the version
    3.0 parser was created. The final release of PHP 3.0 occurred in June of 1998,
    when it was upgraded to include support for multiple platforms (it''s not just
    Linux anymore!) and web servers, numerous databases, and SNMP (Simple Network
    Management Protocol) and IMAP (Internet Message Access Protocol). Then, the birth
    of PHP 4.0 occurred. No small version change, PHP 4.0 marked a complete rethinking
    of the PHP core and a rewrite of the internals of the scripting language itself.
    The PHP development team and Zend Technologies produced a remarkable product with
    nearly a 50-fold performance improvement over version 3.0, with a long list of
    new and useful features.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'As if that weren''t enough, PHP 5 has been in the works since PHP 4 was released,
    culminating in what we have today: an even faster, feature-rich programming language
    suitable for procedural or object-oriented scripts, which warrants a place in
    the enterprise.


    # What Does PHP Do?


    PHP does anything you want, except sit on its head and spin. Actually, with a
    little on-the-fly image manipulation and Dynamic HTML, it could probably do that,
    too.


    According to the PHP manual, "The goal of the language is to allow developers
    to write dynamically generated pages quickly."


    Here are some common uses of PHP, all of which are part of what you''ll learn
    in this book:


    +   - Perform system functions: create, open, read from, write to, and close files
    on your system; execute system commands; create directories; and modify permissions.

    - Gather data from forms: save the data to a file, send data via e-mail, and return
    manipulated data to the user.

    - Access databases and generate content on-the-fly, or create a web interface
    for adding, deleting, and modifying elements within your database.

    - Set cookies and access cookie variables.

    - Start sessions and use session variables and objects.

    - Restrict access to sections of your website.

    - Create images on-the-fly.

    - Encrypt data.


    These are just basic, everyday uses. PHP also includes support for integrating
    with Java servlets, XML, and a myriad of other higher-level functions. The possibilities
    are literally endless.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Why PHP 5?


    It''s natural that languages continue to develop, and PHP 5 has done just that—its
    changes represent the next step in the growth and development of the language.
    There was nothing fundamentally wrong with PHP 4, and in fact the vast majority
    of this book can be used on servers running PHP 4 and not PHP 5. The changes in
    PHP 5 revolve around high-level aspects of the language, namely the object model.


    If you are coming to PHP from another programming languages, especially a highly
    structured, specifically object-oriented language, the crossover to a flexible,
    procedural language that happens to handle object-oriented programming can be
    frustrating. But, the ease of use and robustness is one of the reasons programmers
    are drawn to PHP in the first place—the learning curve isn''t steep, and it gets
    the job done.


    However, this also presents a marketing problem for PHP users working in an enterprise
    setting. Some Powers That Might not think PHP is suitable for enterprise-level
    application development, because it is not a time-tested, structured, object-oriented
    programming language as C or even Java. There might not be the time or opportunity
    for a developer to convince his managers otherwise by showing examples of PHP
    and C or Java performing the same tasks—if you can, with the same level of structure,
    security, reusability, and exception-handling.


    From these and other problems came the development path for PHP 5, the main purposes
    of which were to improve the object model, instill a sense of programming discipline,
    and specifically design a version of PHP that meets the needs of object-oriented
    developers and allows them to interface with Java, .NET, and other enterprise-level
    frameworks.


    But beginning users—likely the primary audience of this book—will not face objects,
    classes, .NET or XML-integration their first day on the job. These users simply
    want a fast, flexible language they can use to create basic, dynamic websites,
    and PHP 5 still meets that needs. Although PHP 5 contains an enhanced internal
    scripting engine and a vastly object-oriented framework, the PHP Group and Zend
    Technologies recognize and appreciate the roots of PHP and the core group of users
    who have made it so pervasive. As with PHP 4, PHP 5 does not force you to use
    the elements of the language you don''t need.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# INTRODUCTION


    # Overview of Changes in PHP 5


    Because this book does not provide lessons in programming PHP from an object-oriented
    view, this section will not go into detail and show examples of the object model
    changes in PHP 5. For that, I highly recommend Harry Fuecks'' article ''PHP 5:
    Coming Soon to a Webserver Near You,'' at http://www.sitepoint.com/article/1192/.
    This article contains an outstanding dissection of the object-related changes
    in PHP 5, and how to implement them.


    A few other features are part of PHP 5, including the appearance of the SQLite,
    an embedded database engine. This is not all at meant to replace a robust database
    like MySQL, PostgreSQL, or Oracle. Instead, this simple, speedy little database
    can store database files in files and memory and would be good for something like
    storing session data and application configuration information—simple SERTS and
    SELECTS. Although this book uses MySQL as its database of choice, you can learn
    more about SQLite in Appendix E, "SQLite"


    Another change is in the XML area. PHP 4 used several third-party libraries to
    control XML parsing and rendering, thus there was no single stable and reliable
    XML rendering and parsing mechanism. PHP 5 provides one XML library, Gnome''s
    libxml, as the foundation for the DOM extension. This library is very fast and
    full-featured, and thus a solid foundation on which to rebuild the XML functionality
    in PHP. You will learn more about working with XML in PHP 5 in Chapter 25, "Working
    with XML."


    # Backwards Compatibility with PHP 4


    The changelog and PHP manual always indicate when a new implementation causes
    problems in previous versions, so at least read the changelog thoroughly if not
    the manual entries for your favorite functions. However, the vast majority of
    PHP 5 focuses on additional functionality rather than completely replacing existing
    elements. If you have learned PHP using PHP 4, you might find that none of your
    scripts require a rewrite.


    Requiring a rewrite and rewriting scripts for the sake of utilizing new functionality
    are completely different—you might want to rewrite to take advantage of new object-oriented
    functionality, but you might not have to. If your code is primarily procedural
    (as with the scripts in this book), there''s a better than 95% chance that no
    rewrites will be necessary.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'Similarly, if you cannot install PHP on your own machine for development or
    product purposes, as outlined in Chapter 3, "Installing PHP," and must use PHP
    4, do not fret. Anything ever taught in this book that doesn''t work in PHP 4
    is indicated as such.


    # Is PHP Right for You?


    You only can decide if PHP should be your language of choice, whether you''re
    developing sites for personal or commercial use on a small or large scale. I can
    only tell you that in the commercial realm, I''ve worked with all the popular
    server-side scripting languages—Active Server Pages (ASP), ColdFusion, JavaScript
    Pages (JSP), Perl, and PHP—on numerous platforms and various web servers, with
    varying degrees of success. PHP is the right choice for me: it''s flexible, fast,
    and simple in its requirements, yet powerful in its output.


    Before deciding whether to use PHP in a large-scale or commercial environment,
    consider your answers to these questions:


    +   - Can you with absolute certainty that you will always use the same web server
    hardware and software? If not, look for something cross-platform that is available
    for all types of web servers: PHP.

    - Will you always have the exact development team comprised entirely of ASP (or
    Java Server Pages or ColdFusion) developers? Or will you use whoever is available,
    necessitating a language that is easy to learn and syntactically similar to C
    and Perl? If you have reason to believe that your ASP or JSP or ColdFusion developers
    might drop off the face of the earth, don''t use those tools—use PHP.

    - Are memory and server load an issue? If so, don''t use bloated third-party software
    that leaks precious memory—use PHP.


    Here''s the bottom line: PHP is simple, just so try it! If you like it, continue
    using it.


    It''s Open Source, so improve it. Join a mailing list and help others. If you
    don''t like it, you''re only out the money for this book, and the software can
    be uninstalled without rendering your machine completely inoperable.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# INTRODUCTION


    # Who Should Read This Book?


    This book is designed for individuals who possess a general understanding of the
    concepts of working in a Web-based development environment, be it Linux/Unix or
    Windows. Installation and configuration related chapters assume that you have
    familiarity with your operating system and the basic methods of building on Linux/Unix
    systems or installing (on Windows systems) software.


    Chapters discussing how to program with PHP, which make up the bulk of the book,
    assume no previous knowledge of the language. However, if you have experience
    with other programming languages such as C or Perl, you will find these lessons
    to be quite simple. Similarly, if you have worked with other databases such as
    Oracle or Microsoft SQL Server, you will have a good foundation for working through
    the MySQL-related chapters.


    The only real requirement before reading this book is that you understand static
    web content creation with HTML. If you are just starting out in the world of web
    development, you will still be able to use this book, but you should consider
    working through an HTML tutorial first. If you are comfortable creating basic
    documents and uploading them to your web server, you will be fine.


    # How This Book Is Organized


    This book is divided into eight parts, corresponding to particular topic groups.
    The chapters within each part build on the information found in before it:


    +   - Part I, "Getting Started," walks you through the installation and configuration
    of MySQL, Apache, and PHP. You''ll need to complete the lessons in Part I before
    moving on, unless you already have access to a working installation of these technologies.


    +   - Part II, "The Absolute Basics of Coding in PHP," teaches you the basics
    of the PHP language, starting with variables and the core structure of the language.
    The numerous hands-on examples will get you in the habit of writing code, uploading
    it, and testing the results.


    +   - Part III, "Start with the Simple Stuff," builds on the basics learned in
    the previous chapters, and helps you to create multi-part scripts and display
    dynamic content, among other things.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# xxii INTRODUCTION


    +   - Part IV, "Getting to Know Your MySQL Database," introduces you to the concept
    of working with databases in general and MySQL in particular, and shows you how
    to create PHP scripts to communicate with MySQL and perform various tasks.


    +   - Part V, "User Authentication and Tracking," shows you how to use PHP to
    restrict access to your applications, and how to set cookies and work with user
    sessions, including the storage of user preferences.


    +   - Part VI, "Creating Your Own Contact Management System," contains several
    chapters which you walk through the design and creation of a specific type of
    application, in this case a contact management system, also known as a web-based
    address book.


    +   - Part VII, "Additional Project Examples," contains chapters devoted to other
    popular types of projects, such as managing a mailing list, creating custom reports,
    and working with XML.


    +   - Part VIII, "Appendices," contains several handy references for the PHP and
    SQL languages, as well as other information including how to use SQLite and where
    to go to find help and additional tutorials.


    # Conventions Used in This Book


    This book uses different typefaces to differentiate code and plain English, and
    also to help you identify important concepts. Throughout the lessons, code, commands,
    and text you type or see on-screen appear in a `monospaced typeface`. New terms
    appear in *italics* at the point in the text where they are defined.


    # More Stuff


    Any errata and additional information for this and my other books can be found
    at http://www.thickbook.com/. At this site, you can download all the code samples
    in this book, and you will be alerted to any printing errors.'
