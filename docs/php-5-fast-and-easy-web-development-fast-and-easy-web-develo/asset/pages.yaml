  md: '# CHAPTER 17: SESSION BASICS


    In the next section, you handle more than just an access counter—you set and display
    user preferences during a user session.


    ![](img/be897bd1bfd4dab38767db24da2a794b_306_0.png)


    # Managing User Preferences with Sessions


    Moving beyond the simple access counter, you can use sessions to manage your users''
    preferences when they visit your site. In this three-step example, you''ll start
    a session, ask a user for her font family and base font size preferences, display
    those preferences on subsequent pages, and allow the user to change her mind and
    reset the values.


    # Starting a Session and Registering Defaults


