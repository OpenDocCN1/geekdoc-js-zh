- img_proc: true
  md: '| Table D.7 The instructors Table

    | Field Name | Description |

    |---|---|

    | InstructorID | Unique ID of an instructor |

    | InstructorName | Name of the instructor |

    | InstructorNotes | Any notes regarding the instructor |


    The third normal form is usually adequate for removing redundancy allowing for
    flexibility and growth. Next, you normalize the my_contacts table, used previously
    in this book.


    # # Normalizing the my_contacts Table


    In the original my_contacts table, there''s not a lot of repeating information,
    but there very easily could if you expanded this to be an actual address book.
    In an address book, people usually have contact information for home and work,
    multiple phone methods (land line, cell phone, and so on), and even multiple e-mail
    addresses. It would make much more sense to break all of those elements out into
    separate tables and attach the information to people through a primary key. Table
    D.8 shows the original my_contacts table as reference.


    Now identify the different areas for which different tables will exist: address,
    phone, and e-mail are adequate for this example. Tables D.9, D.10, and D.11 show
    the fields for these new tables.'
