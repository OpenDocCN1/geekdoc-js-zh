- img_proc: true
  md: "# 498 APPENDIX C: WRITING YOUR OWN FUNCTIONS AND OBJECTS\n\nIncluded files\
    \ look just like any other PHP files, starting with an opening PHP tag and ending\
    \ with a closing PHP tag. For example, suppose you have a file called myfunctions.php,\
    \ containing the following code:\n\n```\n<?\n/* The multiplier() function multiplies\
    \ a number by 5 and returns it */\nfunction multiplier($num) {\n    $answer =\
    \ $num * 5;\n    return $answer;\n}\n\n/* The db_connect() function connects to\
    \ my database. */\nfunction db_connect() {\n    $connection = mysql_connect(\"\
    localhost\", \"spike\", \"9sj7En4\");\n    or die(mysql_error());\n    $db = mysql_select_db($db_name,\
    \ $connection)\n    or die(mysql_error());\n}\n?>\n```\n\nThen, your actual PHP\
    \ script, which needs to connect to a database, you would have the following:\n\
    \n```\n<?//include the file that has the function you need\ninclude(\"/path/to/myfunctions.php\"\
    );\n\n//call a function\ndb_connect();\n\n//now you can do things like issue queries\
    \ and get results\n?>\n```\n\nObviously, this is a very simple example of using\
    \ included files as function libraries, but you probably can already see the benefits!\
    \ Anywhere you have repetitive code, think about using your own function to replace\
    \ it. You can have multiple files of function libraries named appropriately for\
    \ their tasks. You can easily optimize your code when you go through the exercise\
    \ of determining where functions can be used. Try it yourself—there is plenty\
    \ of repetitive code used in this book, which you can quickly turn into your own\
    \ tightly wound application!"
