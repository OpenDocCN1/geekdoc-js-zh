- img_proc: true
  md: '# What Are Cookies?


    Cookies are pieces of text that are sent to a user''s web browser. Cookies can
    help you create shopping carts, user communities, and personalized sites. It''s
    not recommended that you store sensitive data in a cookie, but you can store a
    unique identification string that will match a user with data held securely in
    a database.


    The shopping example. Suppose you assign an identification variable to a user
    so that you can track what he does when she visits your site. First, the user
    logs in, and you send a cookie with variables designed to say, "This is Joe, and
    Joe is allowed to be here." While Joe is surfing around your site, you can say,
    "Hello, Joe!" on each and every page. If Joe clicks through your catalog and chooses
    14 items to buy, you can keep track of these items and display them all in a bunch
    when Joe goes to the checkout area.


    # Setting Cookies


    Before you start setting cookies, determine how you will use them and at what
    point you will set them. Whatever cookies you decide to set, remember that you
    absolutely must set a cookie before sending any other content to the browser,
    because a cookie is actually part of the header information.


    If you heed this warning, you won''t spend hours wondering why you''re getting
    "Cannot add header information" errors. This sample code does just that.


    ![](img/be897bd1bfd4dab38767db24da2a794b_286_0.png)'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'It produces the error shown in the following figure.


    Anytime you see this error, assume you''ve sent something to the web browser before
    its time. This can include white space, a line break, or text you can actually
    see.


    ![](img/be897bd1bfd4dab38767db24da2a794b_287_0.png)


    Warning headers already sent in /usr/local/apache2/htdocs/test/badcookie.php


    # # Bad Cookie


    The setcookie() function, used to set one cookie at a time, expects six arguments:


    +   * Name. Holds the name of the variable that is kept in the global $_COOKIE
    and is accessible in subsequent scripts.

    * Value. The value of the variable passed in the name


    +   * Expiration. Sets a specific time at the cookie value is no longer accessible.
    Cookies without a specific expiration time expire when the web browser closes.

    * Path. Determines for which directories the cookie is valid. If a single slash
    is in the path parameter, the cookie is valid for all files on the web server.
    If a specific directory is named, cookie is valid only for pages within that directory.

    * Domain. Cookies are valid only for the host and domain that set them. If no
    domain is specified, the default value is the host name of the server that generated
    the cookie. The domain parameter must have at least two periods in the string
    order to be valid.

    * Security. If the security parameter is 1, the cookie will only be transmitted
    via HTTPS, which is to say, over a secure web server.


    This next line is an example of a cookie called id with value of 5ds808992jjs2.
    This particular cookie expires in four hours (the current time plus 14,000 seconds),
    and is valid for any page below the document root on them yourdomain.com.


    ```

    setcookie("id", "5ds808992jjs2", time()+14000, "/*", "yourdomain.com");

    ```'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'In the next section, I''ll give you a cheat sheet for common values of time.
    You''ll move into using cookie variables.


    # Counting Time


    If you want to specify an expiration date or time, the easiest way is to tell
    PHP to count forward for you, and then place a value in the expiration slot within
    the setcookie() function. This value should be a Unix integer (the number of seconds
    since January 1, 1970), which you can get using the time() function with additional
    seconds added to it.


    Setting an expiration date on your cookies builds in some assurances of the validity
    of your users. If you set your cookie without a time limit, it will automatically
    expire when the users close their browsers. This is useful when users are sharing
    computers; you don''t want the next user to have all the access afforded by the
    previous user''s cookie. Similarly, you might want to set a cookie for 15 minutes,
    if you are building an online store that allows you to receive a discount on everything
    purchased in the first 15 minutes of your users'' visits.


    Table 16.1 shows some common uses of time()+n within the setcookie() function.


    | Table 16.1 | Common Times |

    |---|---|

    | Value | Definition |

    | time()+60 | One minute from the current time |

    | time()+900 | 15 minutes from the current time |

    | time()+1800 | 30 minutes from the current time |

    | time()+3600 | One hour from the current time |

    | time()+14400 | Four hours from the current time |

    | time()+43200 | 12 hours from the current time |

    | time()+86400 | 24 hours from the current time |

    | time()+259200 | Three days from the current time |

    | time()+604800 | One week from the current time |

    | time()+2592000 | 30 days from the current time |'
