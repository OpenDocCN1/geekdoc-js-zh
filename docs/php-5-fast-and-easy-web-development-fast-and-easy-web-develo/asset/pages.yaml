    Now that you have a working SQLite database, you can move on to creating tables
    and issuing queries.


    # Creating a Table and Storing Data with SQLite


    When you created tables using MySQL (and in fact when you create a table in any
    relational database system), you specifically defined the field types and lengths.
    For example, you might have defined a field name that was a 25-character varchar
    field, or a field called start_date that was a datetime field. SQLite is loosely
    typed, meaning the contents of all fields, regardless of what type they actually
    are, are stored as strings. Thus, SQLite does not require to define your fields
    when you create a table, and if you do, they will be ignored.


    In the next example, you will create a table that holds first names, last names,
    and e-addresses, and populates the table with a few records:


    +   1. Open a new file in your text editor and start a PHP block:


    ```

    <?>

    ```


    +   2. Use the sqlite_open() function to open the database previously created:


    ```

    $db = sqlite_open("../test.db") or die(sqlite_error_string($db));

    ```


    +   3. Use the sqlite_query() function to issue a table-creation command:


    ```

    sqlite_query($db, "CREATE TABLE my_friends (first_name, last_name, email");

    ```'
