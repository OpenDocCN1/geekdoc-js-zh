    # # Defining the my_contacts Table


    Take a moment to think about the kinds of things you''d want in a contact management
    system: names, addresses, telephone numbers of all sorts, e-mail addresses, and
    maybe even the person''s birthday.


    I thought about what I wanted for my own table, which I''ve decided to call my_contacts.
    This information appears in Table 18.1.'
