    That is some kind of nasty response! At least it tells you exactly what is wrong,
    and several times over: user buffy couldn''t connect to MySQL. You can suppress
    one of the ugly warnings and just go with the message from the die() function
    by placing a @ before the mysql_connect() function. Try it.


    +   1. Add a @ before the mysql_connect() function, keeping the username:


    ```

    $connection = @mysql_connect("localhost", "buffy", "98j7En4") or die(mysql_error());

