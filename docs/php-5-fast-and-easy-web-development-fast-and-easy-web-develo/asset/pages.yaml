- img_proc: true
  md: '# Planning and Creating the Administration Menu


    Not only will you be able to view data within your system, you''ll be able to
    add, modify, and delete contacts. A menu would be good idea—one that provides
    links to all your action scripts, and that adds some authentication to the mix
    so that you can only see the data. Now create all in one script!


    +   1. Open a new file in your text editor and start a PHP block. Then, start
    a session, or continue a session if it currently exists:


    ```

    <?

    session_start();

    ```


    +   2. Start an _if_else block that checks for the value of the $_POST[op] variable,
    which will be a hidden variable in the login form you will soon create:


    ```

    if ($_POST[op] == "ds") {

    ```


    +   3. If the value of $_POST[username] is ds, the user has completed the form.
    Start another _if_else block that checks the validity of the username and password
    entered by the user:


    ```

    if ($_POST[username] != "admin") || ($_POST[password] != "abc123") {

    ```


    > NOTE

    You can use any username and password you want. This script is hard-coded to check
    that the username is admin and that the password is abc123.


    +   4. If either the username or password is incorrect, create a variable called
    $msg to hold an error message:


    ```

    $msg = "<p<font color=\#FF000><strong>Bad Login - Try Again!</strong></font></p>";

    ```


    +   5. Create a variable $show_form, and give it a value of yes. This value will
    be checked later in the script to determine what to display:


    ```

    $show_form = "yes";

    ```'
