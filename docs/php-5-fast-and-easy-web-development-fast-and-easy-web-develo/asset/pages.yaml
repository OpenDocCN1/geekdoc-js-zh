    # NOTE


    This information will differ, not only from machine to machine, but also from
    platform and version to version. Your results will vary, but the overall template
    is the same.


    As you scroll down, look for a section titled Environment. In the next sections,
    you''ll learn how to use two environment variables found here: REMOTE_ADDR and
    HTTP_USER_AGENT. For an explanation of some of the other HTTP environment variables
    shown in phpinfo() output, visit http://hohoo.ncaa.uiuc.edu/cgi/env.html.


    # Retrieving and Using REMOTE_ADDR


    By default, environment variables are available to PHP scripts as $VAR_NAME. For
    example, the REMOTE_ADDR environment variable is already contained as $REMOTE_ADDR.
    However, to be absolutely sure that you''re reading the correct value, you can
    use the getenv() function to assign a value to a variable of your choice.


    The REMOTE_ADDR environment variable contains the IP address of the machine making
    the request. Let''s get the value of your REMOTE_ADDR.'
