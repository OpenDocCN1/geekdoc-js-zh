  md: '# CHAPTER 12: CREATING A DATABASE TABLE


    | Data Type | Definition |

    | --- | --- |

    | ENUM | enumeration (list). When defining an ENUM, you are creating a list of
    items from which the value must be selected (or it can be NULL). For example,
    if you wanted your field to contain "A" or "B" or "C", you would define your enum
    as ENUM (''A'', ''B'', ''C'') and only those values (NULL) could ever populate
    that field. ENUMs can have 65535 different values. |


    # Defining Your Fields


    The overall goal of this chapter is to create a table to hold data from your own
    personal music collection. Take a moment to think about the kinds of things you''d
    want to know: the title and artist, obviously, and maybe the record label, the
    date it was acquired, and your own personal notes regarding the recording. I thought
    about what I wanted for my own table, which I''ve decided to call my_music, as
    shown in Table 12.2.


    | Field Name | Description |

    | --- | --- |

    | id | Creates a unique ID number for the entry |

    | format | Is it a CD, cassette, or even an LP? |

    | title | The title of the recording |

    | artist_fn | The artist''s first name |

    | artist_ln | The artist''s last name or the name of the group |

    | rec_label | The record label |

    | my_notes | My own thoughts about the recording |

    | date_acq | Date acquired |


    In the next section, you create a sequence of forms that will take your table
    information and send it to your MySQL database. In the first step, you submit
    the name of the table and the number of fields you want to include. The second
    step will display additional form fields so that you can define the properties
    of your'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'table columns. A third step will send the request to MySQL, verify that the
    table was created, and display a "Success! message.


    # The Importance of Unique Fields


    Using unique ID numbers not only helps help you keep track of your data, but also
    down the road, helps you attempt to establish relationships between multiple tables.
    The my_music table, there will be an ID field. Using this field as the unique
    field, instead of the title field, will allow you to have two recordings in your
    table that have the same name. For example, if you own the album Strange Fire
    by the Indigo Girls, you could have two entries in your table: one for the version
    released in 1987, and one for the version-reissued in 1989 (just trust me on that).


    Without a unique identifier, you would have to pick only one to put in your table,
    and your table wouldn''t be very accurate. I hope this simple example conveys
    the importance of having a unique identifier in each record in your table. The
    usage of the unique identifier will become more apparent throughout the remainder
    of this book, as you create database-driven elements.


    # A Two-Step Form Sequence


    A two-step form sequence for creating a database table might seem overkill. After
    all, you saw a basic table-creation SQL statement in Chapter 1, when you created
    test_table:


    ```

    create table test_table (test_id int, test_note text);

    ```


    When using a PHP script to create a table, all you''re doing is sending the exact
    same query to MySQL. However, you can tie a pretty ribbon around the process (creating
    a form-based interface) and call it an administrative interface!


    In the process of creating the administrative interface, you''ll start with an
    HTML form, and create a PHP script that takes information from that form and dynamically
    creates another form. Finally, you''ll create a script that sends the actual SQL
    query.'
