    +   Get the year (1000 through 9999) from a date field using the YEAR() function.
    The syntax is

    SELECT YEAR([date]) FROM [yourTableName];


    # Using the show Command


    There are several types of SHOW commands, which will produce output to help you
    administer MySQL database. The usual method for executing these commands is through
    the MySQL Monitor, the command-line interface to MySQL, which you used in Chapter
    1, "Installing and Configuring MySQL."


    The basic show commands are SHOW DATABASES and SHOW TABLES, which simply display
    the names of the databases and tables on your server. If you use the SHOW CREATE
    TABLE command, it shows you the exact SQL statement used to create the specified
    table.


    If you need to know the structure of the table but don''t necessarily need the
    SQL command to create it, you can use the SHOW COLUMNS command:


    ```

    mysql> SHOW COLUMNS FROM [testTable];

    ```


    | Field | Type | Null | Key | Default | Extra |

    |---|---|---|---|---|---||

    | id | int(11) | | PRI | NULL | auto_increment |

    | testField | varchar(75) | YES | | NULL | |'
