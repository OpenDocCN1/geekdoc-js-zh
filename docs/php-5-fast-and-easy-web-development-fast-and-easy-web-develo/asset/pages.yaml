  md: '# A Note About Apache Log Files


    The Apache web server automatically logs specific information regarding user accesses
    and errors. These log files are found in the logs directory. A file called access.log
    handles the accesses, and the error.log file handles errors.


    The default for the access log looks something like the following (this was taken
    from my own log):


    ```

    127.0.0.1 [22/Feb/2004:05:27:10] GET /show_creatable.html HTTP/1.1" 304 -

    127.0.0.1 [22/Feb/2004:05:27:46] POST /do_showfielddef.php HTTP/1.1" 200 2402

    127.0.0.1 [22/Feb/2004:05:28:49] POST /do_creatable.php HTTP/1.1" 200 185

    127.0.0.1 [22/Feb/2004:05:43:33] GET /manage.php HTTP/1.1" 200 562

    ```


    This looks rather cystic, I know. You can set the format in your httpd.conf file
    like so:


    ```

    LogFormat "%h %l %u %t \"r\ %s %b"

    ```


    In this case, the format maps to the descriptions listed in Table 24.1.


    | Table 24.1 Apache Log File Settings |

    | Symbol | Description |

    | --- | --- |

    | %h | Remote host name of the machine making the request, or IP if <br>HostnameLookup
    = off |

    | %l | Remote log name (usually empty) |

    | %u | URL path requested by the user |

    | %t | Time of access |

    | %"r" | First line of request, inside quotation marks |

    | %s | Status of the request |

    | %b | Number of bytes sent, excluding headers |'
