  md: '# Using SQLite


    In Appendix D, "Database Normalization and SQL Reference," you learned about the
    importance of a normalized database and potential problems with the flat file.
    However, there are many instances in which your PHP applications might only need
    a single database table, and there''s nothing wrong with that. For instance, suppose
    you''re just archiving the content of simple contact forms set through your website,
    as a backup in case the e-mailed versions never arrive. This simple table might
    have real fields for name, e-mail address, comments, and date sent—no real need
    to normalize that!


    If you find yourself in a development situation without a database and some mandate
    that you must not install one, PHP 5 introduces another option into the mix—the
    capability to utilize SQLite, which is a flat file database with an SQL-based
    interface.'
  merge: -1
  pgno: 543
- img_proc: true
  md: '# Examples of SQLite in Action


    > NOTE\ SQLite is enabled by default in PHP 5. For detailed information beyond
    what''s covered in this appendix, please visit the SQLite website at http://www.sqlite.org/,
    or search the PHP manual section for SQLite at http://www.php.net/sqlite/.


    To use SQLite, you must still have a fundamental understanding of how databases,
    tables, and fields work together, and SQL syntax itself. Everything you have learned
    in this book is still viable with regards to the process of connecting to a database,
    issuing queries, and obtaining results—except that you learned to use the MySQL-specific
    functions for sending commands to the MySQL server. SQLite has its own set of
    functions that you use to perform the same types of tasks.


    This section steps through some of the basic in working with databases, using
    the SQLite version of things. Before doing anything, you must create a database:


    +   1. Open a new file in your text editor and start a PHP block:


    2. Use the sql_open() function to open a database called test.db level up from
    the document root—do not worry that it has not been created yet, because this
    function will create the file if it does not already exist. The sql_error_string()
    function will display any error message if the command fails:


    $db = sql_open("./test.db") or die(sql_error_string());


    > NOTE

    nYou might notice that no username or password is used to create or open a SQLite
    database. This is true, because the SQLite database is technically just a plain
    file, with no requirements for access other than the capability to read and write
    to the directory in you are placing the file.'
