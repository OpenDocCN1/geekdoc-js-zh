    # File System Functions


    The built-in file system functions can be very powerful tools—weapons, if used
    incorrectly. Be very careful when using file system functions, especially if you
    have PHP configured to run as root or some system-wide user. For example, a PHP
    script to issue an rm -R command while at the root level of your directory structure
    would be a very bad thing.


    # chmod(), chgrp(), and chown()


    Like the commands of the same name, the chmod(), chgrp(), and chown() functions
    modify the permissions, group, and owner of a directory or file. Here is the syntax
    of these functions:


    ```

    chmod("filename", mode);

    chgrp("filename", newgroup);

    chown("filename", newcomer);

    ```


    In order to change permissions, groups, and owners, the PHP user must be the owner
    of the file, or the permissions must already be set to allow such changes by that
    user.


    # copy()


    The copy() function works much like the cp shell command: It needs a filename
    and a destination in order to copy a file. The syntax of copy() is


    ```

    copy("source filename", "destination");

    ```


    The PHP user must have permission to write into the destination directory, or
    the copy() function will fail.'
