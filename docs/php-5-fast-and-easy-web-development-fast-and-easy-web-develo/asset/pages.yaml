- img_proc: true
  md: '# Why Authenticate Anyone?


    When initially developing a website, you might want to restrict access to certain
    members of your development team. If your corporate website contains sensitive
    financial data, you might want to restrict your financial statements to a particular
    list of investors. Or maybe you just don''t want people poking around your personal
    things.


    A common type of user authentication is database-driven, in which usernames and
    passwords are kept in a database table and accessed via a login form and script.
    In the next section, you create this database table and add some users to it.


    # Creating the User Table


    In Chapter 12, "Creating a Database Table," you followed a two-step table-creation
    process. You can use that same process to create the authorized users table.


    +   1. Open your web browser to http://127.0.0.1/show_createtable.html.

    2. In the Table Name field, type auth_users.

    3. In the Number of Fields field, type 4.

    4. Click on the Go to Step 2 button. You should see a form with four rows, corresponding
    to the four fields that will be the auth_users table.

    5. In the first row, type f_name for the Field Name, select varchar from the Field
    Type drop-down menu, and specify a Field Length of 50. This field will hold the
    user''s name.

    6. In the second row, type 1_name for the Field Name, select varchar from the
    Field Type drop-down menu, and specify a Field Length of 50. This field will hold
    the user''s last name.

    7. In the third row, type username for the Field Name, select varchar from the
    Field Type drop-down menu, and specify a Field Length of 25. This field will hold
    the user''s username.'
