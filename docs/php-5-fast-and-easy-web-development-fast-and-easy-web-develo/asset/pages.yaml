  md: 'wanted to use that concept, but instead of formatting the content into HTML
    and sending it to a browser, he wanted to format it for plain text and save it
    to a text file. No problem—you just add a few methods and properties, and away
    you go. Finally, the client comes back and says he really wants the data to be
    formatted and sent as an e-mail—and then, what the heck, why not create XML-formatted
    files as well?


    If you separate the compilation and storage classes from the formatting classes—one
    for each of the various delivery methods (HTML, text, e-mail, and XML)—you essentially
    have a parent-child relationship. Consider the parent class to be the one that
    holds the compilation and storage methods. The formatting classes are the children—they
    inherit the information from the parent and output the result based on their own
    functionality.


    In no way has this brief appendix covered all the aspects of object-oriented programming—universities
    teach entire series of courses devoted to this topic. However, you did learn how
    to create classes and instantiate objects from them, how to create and access
    the properties and methods of a class, how to build new classes, and how to inherit
    features from parent classes. You should now be able to pick up book on object-oriented
    programming and not feel completely lost.'
