  md: '# EXAMPLES OF SQLITE IN ACTION 529


    2. Change the table-creation command to:


    ```

    sqlite_query($db, "CREATE TABLE my_friends3

    (id INTEGER PRIMARY KEY, first_name, last_name, email,

    date_added");

    ```


    3. Change the record-insertion commands to:


    ```

    sqlite_query($db, "INSERT INTO my_friends3

    (first_name, last_name, email, date_added) VALUES

    (''John'', ''Smith'', ''john@smith.com'', ''''.time()'')

    sqlite_query($db, "INSERT INTO my_friends3

    (first_name, last_name, email, date_added) VALUES

    (''Jane'', ''Doe'', ''jane@doe.com'', ''''.time()'')

    sqlite_query($db, "INSERT INTO my_friends3

    (first_name, last_name, email, date_added) VALUES

    (''Julie'', ''Meloni'', ''julie@thickbook.com'', ''''.time()'')",

    ```


    Save this file as sqlite6.php and place it in the document root of your web browser.
    Access the script at http://127.0.0.1/sqlite6.php to issue these SQLite commands.
    Again, there will be no output if this script is successful. You will see a message
    only if the script fails to perform one or more of the commands.


    If this script did the trick, modify the sqlite5.php script to retrieve, and print
    the values in the date_added field:


    +   1. Open sqlite5.php in your text editor.


    +   2. Change the name of the table in the query, and order the records by ID:

    $r = sqlite_query($db, "SELECT * FROM my_friends ORDER BY id ASC");


    +   3. Add the following inside the while loop, after the line that defines the
    value of $email:


    ```

    $date_added = date("*l, M d Y, h:i A", $record[date_added]);

    ```'
