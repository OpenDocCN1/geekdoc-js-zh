    +   2. Change the value of ServerName to something, if it''s not already.


    +   3. Save the file.


    The ServerName modification is the most important change you''ll make to your
    Apache configuration file, because the ServerName isn''t correct, you won''t be
    able to connect to Apache. As it states in the configuration file itself, "You
    cannot just invent host names and how they work." If you do not know your full
    machine name, you can use an IP address. If you have a static IP number (that
    is, one that does not change), a dial-up connection that does not assign a static
    IP (that is, your IP number changes each time you connect to your Internet service
    provider), you will have to change the IP number in httpd.conf each time you dial
    up.


    > TIP

    The ServerName changes described are relevant only if you want people from the
    outside world to be able to connect to your new web server. If you are the only
    person who will be accessing the server, you can use the IP number 127.0.0.1,
    which is recognized by machines as the local loop-back address, also known as
    localhost. You can use either the word localhost or the IP number 127.0.0.1 as
    ServerName in httpd.conf. The IP number will probably work out, because Windows
    machines do not automatically know that localhost equals 127.0.0.1.


    The appropriate modifications are made to the httpd.conf file, Apache is ready
    to run on your machine. In the next section, you start and connect to Apache.'
