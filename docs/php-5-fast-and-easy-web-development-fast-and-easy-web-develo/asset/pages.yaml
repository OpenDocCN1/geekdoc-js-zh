  md: 'This block contains three elements: the command (echo), the string (<P><em>Hello
    World! I''m using PHP!</em></P>), and the instruction terminator ();


    Familiarize yourself now with echo, because it will likely be your most often-used
    command. The echo statement is used to output information—in this case, to print
    this HTML:


    ```

    <P><em>Hello World! I''m using PHP!</em></P>

    ```


    The next section discusses a common error, with the hope that you''ll be able
    to avoid it.


    # The Importance of the Instruction Terminator


    The instruction terminator, also known as the semicolon (;), is absolutely required
    at the end of commands. The instruction terminator tells the PHP parser, "I''m
    done with this command, try the next one.


    If you do not end commands with a semicolon, the PHP parser will become confused,
    and your code will display errors. These next steps show you how these errors
    come about and,, more importantly, how to fix them.


    +   1. Open a new file in your text editor.


    +   2. Type the following HTML:


    ```

    <HTML>

    <HEAD>

    <TITLE>Making an Error</TITLE>

    </HEAD>

    <BODY>

    ```


    +   3. Type the following PHP code:


    ```

    <?

    echo "<P>I am trying to produce an error</P>

    echo "<P>Was I successful?</P>";

    ?>

    ```'
  merge: -1
  pgno: 77
- img_proc: true
  md: '4. Add some more HTML so that the document is valid:


    ```

    </body>

    </html>

    ```


    5. Save the file with the name errorscript.php.


    6. Place this file in the document root of your web server.


    7. Open your web browser and type http://127.0.0.1/errorscript.php.


    ![](img/be897bd1bfd4dab38767db24da2a794b_78_0.png)


    What nasty error! The error message says that the error is on line 8. Take a look
    at lines 7 and 8 of the script:


    echo "P>I am trying to produce an error</P>

    echo "P>Was I successful?</P>;


    Line 7 does not have an instruction terminator, and line 8 starts a new command.
    The PHP parser doesn''t like this, and it tells you so that by producing the parse
    error.


    This error is easy to fix:


    +   1. Open the errorscript.php file.


    +   2. On line 7, add the instruction terminator (;) to the end of the line:


    ```

    echo "<P>I am trying to produce an error</P>"

    ```'
