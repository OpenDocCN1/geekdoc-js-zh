  md: '# Displaying Browser-Specific HTML


    In the previous chapter, you learned to retrieve and print the HTTP_USER_AGENT
    variable to the screen. In this chapter, you do something a bit more interesting
    with the value of HTTP_USER_AGENT, and that''s printing browser-specific HTML.


    However, having seen some of the possible values of HTTP_USER_AGENT in the last
    chapter, you can imagine that there are hundreds of slightly different values.
    It''s time to learn some basic pattern matching.


    You''ll use the preg_match() function to perform this task. This function needs
    two arguments: what you''re looking for, and where you''re looking:


    ```

    preg_match("/[what you''re looking for]/", "[where you''re looking looking]");

    ```


    This function returns a value of true or false, which you can use in an if...else
    block to do whatever you want. The goal of the first script is to determine whether
    a browser is Microsoft Internet Explorer, Netscape, or something else.


    In the value of HTTP_USER_AGENT, Netscape uses the string Mozilla to identify
    itself. Unfortunately, the value of HTTP_USER_AGENT for Microsoft Internet Explorer
    also uses Mozilla to show that it''s compatible. Luckily, it also uses the string
    MSIE, so you can search for that. If the value of HTTP_USER_AGENT doesn''t contain
    either Mozilla or MSIE, chances are very good that it''s not one of those browsers.


    +   Open a new file in your text editor and start a PHP block, and use getenv()
    to place the value of HTTP_USER_AGENT in a variable called $agent:


    ```

    ?

    $agent = getenv("HTTP_USER_AGENT");

    ```


    +   Start an if...else statement to find which of the preg_match() functions is,
    starting with the search for MSIE:


    ```

    if (preg_match("/MSIE/i", "$agent")) {

    $result = "You are using Microsoft Internet Explorer.";

    }

    ```'
