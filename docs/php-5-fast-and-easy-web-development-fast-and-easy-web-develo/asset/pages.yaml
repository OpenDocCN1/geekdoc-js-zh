  md: '# Registering and Modifying Session Variables


    The goal of this script is to register a variable and change its value during
    the course of your session.


    +   1. Open a new file in your text editor, start a PHP block, and call the session_start()
    function:


    ```

    <??

    session_start();

    ```


    +   2. Register a variable called count:

    session_register(''count'');


    > NOTE

    Now, for as long as this session exists, a variable called $_SESSION[count] will
    be available. Currently, the variable has no value.


    +   3. Increment the value of $_SESSION[count] to account for the current access:

    $_SESSION[count]++


    +   4. Create a string to hold a message, including the value of $_SESSION[count]:

    $msg = "<P>You''ve been here $_SESSION[count] times. Thanks!</p>";


    +   5. Close the PHP block and type the following HTML:


    ```

    ?>

    <HTML>

    <HEAD>

    <TITLE>Count Me!</TITLE>

    </HEAD>

    <BODY>

    ```


    +   6. Display the message string:

    <? echo "$msg"; ?>'
