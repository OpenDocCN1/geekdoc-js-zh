  md: '# A Simple Feedback Form


    A simple feedback form usually contains fields for the respondent''s name and
    e-mail address, and a text area for some sort of message. In this section, you
    create two files: one for the feedback form, and one for the PHP script to process
    the form, send the mail, and return a response to the browser.


    # Creating the Feedback Form


    In this section, you create the first half of the form/script combo—the feedback
    form itself, often referred to as the front-end form.


    +   1. Open a new file in your text editor.


    +   2. Type the following HTML:


    ```

    <HTML>

    <HEAD>

    <TITLE>Simple Feedback Form</TITLE>

    </HEAD>

    <body>

    ```


    +   3. Begin your form. Assume that the method is POST and the action is a script
    called send_simpleform.php:


    ```

    <FORM METHOD="POST" ACTION="send_simpleform.php">

    ```


    +   4. Create an input field for the user''s name with a text label:


    ```

    <P><strong>Your Name:</strong><br>

    <INPUT type="text" NAME="sender_name" SIZE=30></P>

    ```


    +   5. Create an input field for the user''s e-mail address with a text label:


    ```

    <P><strong>Your E-Mail Address:</strong><br>

    <INPUT type="text" NAME="sender_email" SIZE=30></P>

    ```


    +   6. Create a text area to hold the message with a text label:


    ```

    <P><strong>Message:</strong><br>

    <TEXTAREA NAME="message" COLS=30 ROWS=5 WRAP=virtual</TEXTAREA></P>

    ```'
  merge: -1
  pgno: 142
