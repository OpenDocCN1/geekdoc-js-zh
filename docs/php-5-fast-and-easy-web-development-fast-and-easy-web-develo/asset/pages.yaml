  md: '# Redirecting to a New Location


    Redirecting a user to a new location means that your script has sent an HTTP header
    to the browser, indicating a new location. HTTP headers of any kind (authentication,
    redirection, cookies, and so on) must be sent to the browser before anything else,
    including white space, line breaks, and any characters.


    Although you''ve already used the header() function to redirect the user in the
    case of an incomplete form, in the next section you create a specific redirection
    menu. The goal is to have the users select a new location from a drop-down menu
    and then the script automatically send them there.


    # Creating a Redirection Form


    In this section, you''ll create the front end to a redirection script. This form
    will contain a drop-down list of names of various websites. The value for each
    option is the website''s URL.


    +   1. Open a new file in your text editor and type the following HTML:


    ```

    <HTML>

    <HEAD>

    <TITLE> Redirection Menu</TITLE>

    </HEAD>

    <BODY>

    ```


    +   2. Begin your form. Assume that the method is POST and the action is a script
    called do_redirect.php:


    ```

    <FORM METHOD="post" ACTION="do_redirect.php">

    ```


    +   3. Add this drop-down list:


    ```

    <P>Send me to:

    <SELECT name="location">-- Select One --</SELECT>

    <OPTION value="http://www.thickbook.com/">thickbook.com</OPTION>

    <OPTION value="http://www.i2i.com/">i2i Interactive</OPTION>

    <OPTION value="http://www.php.net/">PHP Technologies</OPTION>

    <OPTION value="http://www.zend.com/">Zend Technologies</OPTION>

    </SELECT>

    ```'
