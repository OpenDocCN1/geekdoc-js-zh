- img_proc: true
  md: '# Planning for Your Tables


    Creating a table is easy—it''s the planning that takes some brainpower. To create
    a simple table, you only need to give it a name. But that would make for a boring
    table, because it wouldn''t contain any columns (fields) and couldn''t hold any
    data. So besides the name, you should know the number of fields and the types
    of fields you want to have in your table.


    # Basic MySQL Data Types


    All fields in a table are given a particular data type definition. The data type
    defines the type of data that''s allowed in the field. With some data type definitions,
    you must also define the maximum length you want to allow in the field, but others
    are assumed to have one specific length for their particular type.


    It''s very important to define fields appropriately. For example, if you have
    a field to hold the name of a recording, and it''s a 50-character varchar field,
    yet you try to stuff a 100-character string into the field, your string will truncate
    at 50 characters.


    Not only is it important to define the fields correctly so that the data fits
    inside the fields, but if you define a field with an incorrect SQL syntax, the
    table won''t be created, period. For example, if you want to use the data type
    for a field, you cannot specify a length: it''s automatically assumed to have
    a particular length.


    Table 12.1 shows some of the more common types that you will use. For a complete
    list, please read the MySQL manual.


    | Table 12.1 Some MySQL Data Types |

    | Data Type | Definition |

    | --- | --- |

    | TINYINT | A very small integer that can be signed or unsigned. If signed, the
    allowable range is from –128 to 127. If unsigned, the allowable range is from
    0 to 255. |

    | SMALLINT | A small integer that can be signed or unsigned. If signed, the allowable
    range is from –32768 to 32767. If unsigned, the allowable range is from 0 to 65535.
    |

    | | continued |'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# PLANNING FOR YOUR TABLES 201


    | Data Type | Definition |

    |---|---|

    | MEDIUMINT | A medium-sized integer that can be signed or unsigned. If signed,
    the allowable range is - 8388608 to 8388607. If unsigned, the allowable range
    is from 0 to 16777215. |

    | INT | A normal-sized integer that can be signed or unsigned. If signed, the
    allowable range is - 2147483648 to 2147483647. If unsigned, the allowable range
    is from 0 to 4294967295. |

    | BIGINT | A large integer that can be signed or unsigned. If signed, the allowable
    range is - 9223372036854775808 to 18446744073709551615. If unsigned, the allowable
    range is from to |

    | FLOAT | A floating point number that cannot be unsigned. You can define the
    display length (M) and the number of decimals (D). This is not required and will
    default to 10,2, where 2 is the number of decimals. Decimal precision can go to
    24 places for a FLOAT. |

    | DATE | A date in YYYY-MM-DD format, between 1000-01-01 and 9999-12-31. For example,
    December 30th, 1973 would be stored as 1973-12-30. |

    | DATETIME | A date in YYYY-MM-DD format, between 1000-01-01 and 9999-12-31, plus
    hour and minute information in HH:MM:SS format. For example, 12 AM on December
    30th, 1973 would be stored as 1973-12-30 00:01:00. |

    | TIMESTAMP | A timestamp between midnight, January 1, 1970 and sometime in 2037.
    You can define multiple lengths to the TIMESTAMP field, which directly correlates
    to what is stored in. The default length for TIMESTAMP is 14, which stores YYYYMMDDHHMMSS.
    This looks like the DATETIME format, without the hyphens between numbers; 3:30
    in the afternoon on December 30th, 1973 would be stored as 19731230153000. Other
    definitions of TIMESTAMP are 12 (YYYYMMDDHHMMSS), 8 (YYYYMMDD), and 6 (YYYYMMDD).
    |

    | CHAR | A fixed-length string between 1 and 255 characters in length, right-padded
    with spaces to the specified length when stored. Defining a length is not required,
    but the default is 1. |

    | VARCHAR | A variable-length string between 1 and 255 characters in length. You
    must define a length when creating a VARCHAR field. |

    | BLOB or TEXT | A field with a maximum length of 65535 bytes. LOBS are "Binary
    Large Objects" and are used to store large amounts of binary data, such as images
    or other types of files. Fields defined as TEXT also hold large amounts of data;
    the difference is that text sorts and comparisons of amounts on stored data are
    case sensitive on BLOBs and case insensitive to TEXT fields. You do not specify
    a length with BLOB or TEXT continued'
