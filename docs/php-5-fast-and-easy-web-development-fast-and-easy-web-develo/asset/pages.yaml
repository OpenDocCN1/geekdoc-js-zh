    Here are two very important rules to keep in mind for creating valid XML documents:


    +   - XML is case-sensitive, <Book> and <book> are different elements.

    - All XML tags must be properly closed, XML tags must be properly nested, and
    no overlapping tags are allowed.


    Put the messages.xml file (or one like it) in the document root of your web server
