    recompile PHP without having to recompile Apache as well. For example, you''ll
    be doing in this section is configuring PHP for MySQL support. If you decide you
    want additional options later in the game, such as image-creation functions or
    additional encryption functions, you''ll only have to change the configuration
    command for PHP, recompile the module, and restart Apache. No additional changes
    will be needed for the Apache installation, because one module file replaces another.


    To download the PHP source distribution, visit the Downloads page at the PHP website:
    http://www.php.net/downloads.php.


