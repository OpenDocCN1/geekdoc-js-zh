  md: '# Working with Objects


    Occasionally in this book, I''ve mentioned "object-oriented programming" in reference
    to a more complex type of programming, beyond the procedural scripts on which
    this book is based. An object is sort of a theoretical box of things—variables,
    functions, and so forth—that exists in a templated structure like a class. Although
    it''s easy to visualize a simple variable, such as `$color`, with a value of red,
    or an array `rainbow` with three or four elements inside it, some people have
    a difficult time visualizing objects.


    For now, try to think of an object like a little box with inputs and outputs on
    either side. The input mechanisms are called *methods*, and methods have *properties*.
    Throughout this section, you''ll take a look at how classes, methods, and properties
    all work together to produce various outputs. This will give you a good picture
    of what object-oriented programming is all about, should you want to go that route
    when building your applications. To learnt more on the topic, check the PHP manual
    chapter called "Classes and Objects" at http://www.php.net/manual/en/language.oop.php.


    An object has a structure, called a class. In a class, a set of characteristics
    is defined. For example, say that you have created a *house* class. In the *house*
    class, you have architectural type, square footage, and color characteristics.
    Each *house* object uses all of the characteristics, but they are initialized
    to different values, such as ranch, 1500, and white aluminum siding, or condominium,
    786, and tan stucco.


    Because classes are so tightly but self-contained and independent of one another,
    they can be reused from one application to another. For example, suppose you write
    some text-formatting classes on one project and decide you can use that class
    in another project. Because a class is just a set of characteristics, you can
    pick up the code and use it in the second project, reaching into it with methods
    specific to the second application, but using the workings of the existing code
    to achieve new results.


    # Creating an Object


    Creating an object is quite simple; you simply declare it to be in existence'
