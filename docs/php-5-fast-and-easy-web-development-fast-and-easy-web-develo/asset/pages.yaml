  md: '# Database Normalization and SQL Reference


    The database tables used in this book were designed for simplicity''s sake, to
    help you understand the basic interaction between PHP and MySQL. These are not
    "normalized" databases. "Normalization" is a word you''ll hear a lot when you
    begin to create detailed database-driven applications, and it requires a different
    type of thought—thinking in relational terms before seeing the relationships in
    front of you. In this appendix, you learn the basics of database normalization,
    along with some key elements of the SQL language.'
  merge: -1
  pgno: 527
- img_proc: true
  md: '# Understanding Database Normalization


    Database normalization is essentially a set of rules that allows you to organize
    your database in such a way that your tables are related, where appropriate, and
    flexible for future growth and relationships. The sets of rules used in normalization
    are called normal forms. If your database design follows the first set of rules,
    it''s considered in the first normal form. If the first three rules of normalization
    are followed, your database is said to be in the third normal form. This appendix
    goes through the normal forms, using the concept of students and courses in a
    school, and shows how to normalize the my_contacts table used previously in the
    book.


    # Applying the Normal Forms


    Before explaining the first normal form, let''s start with something that needs
    to be normalized. In the case of a database, a flat table is a prime example of
    something needing to be normalized. A flat table is a spreadsheet with many columns
    of data. In a flat table, there are no relationships between multiple tables,
    as all the data you could possibly want is right there in single flat table. This
    scenario is not the most efficient design and will consume more physical space
    on your hard drive than a set of normalized databases.


    If you have a table that holds student and course information for a school. You
    might have the following fields in your flat table, as shown in Table D.1.


    | Table D.1 The Student and Courses Table |

    | Field Name | Description |

    | StudentID | Name of the student |

    | CourseID | ID of the first course taken by the student |

    | CourseDescription1 | Description of the first course taken by the student |

    | CourseInstructor1 | Instructor of the first course taken by the student |

    | CourseID2 | ID of the second course taken by the student |

    | CourseDescription2 | Description of the second course taken by the student |

    | CourseInstructor2 | Instructor of the second course taken by the student |'
  merge: -1
  pgno: 528
- img_proc: true
  md: "You might then repeat CourseID, CourseDescription, and CourseInstructor columns\
    \ many more times to account for all the classes a student can take during their\
    \ academic career. Although redundant, this is the method used when creating a\
    \ single flat table to store information. Eliminating this redundancy is the first\
    \ step in database normalization, so next you'll take this flat table to first\
    \ normal form. If your table remained in its flat format, you could have a lot\
    \ of unclaimed space and a lot of space being used unnecessarily—not an efficient\
    \ design!\n\n# Taking a Table to First Normal Form\n\nThe main rules for the first\
    \ normal form are as follows:\n\n+   - Eliminate repeating information\n- Create\
    \ separate tables for related data\n\nAt the flat table design, with its many\
    \ repeated sets of fields for students and courses, you can identify students\
    \ and courses as its two distinct topics. Taking the student and courses flat\
    \ table to the first normal form would mean that you create two tables: one for\
    \ students (call it students) and one for students plus courses (call it students_courses).\
    \ You can see the new table designs in Tables D.2 and D.3.\n\n| Table D.2 The\
    \ students Table |\n| Field Name | Description |\n| StudentID | A unique ID for\
    \ the student. This new field is now a primary key. |\n| ColumnName | Name of\
    \ the student. |\n\n| Table D.3 The students_courses Table |\n| Field Name | Description\
    \ |\n| StudentID | Unique ID of the student, matching an entry in the students\
    \ table. |\n CourseID | ID of the course being taken by the student. |\n CourseDescription\
    \ | Description of the course taken by the student. |\n CourseInstructor | Instructor\
    \ of the course taken by the student. |"
  merge: -1
  pgno: 529
- img_proc: true
  md: 'Your two new tables represent a one-to-many relationship of one student to
    many courses. Students can take as many courses as they want, and are not limited
    to the number of CourseID/CourseDescription/CourseInstructor groupings exist in
    the flat table.


    You still have some work to do, and the next step is to put these tables into
    second normal form.


    # Taking Tables to Second Normal Form


    The basic rule for the second normal form is


    +   No non-key attributes depend on a portion of the primary key


    In plain English, this means that if fields in your table are not entirely related
    to a primary key, you have to keep working on them. In the students and courses
    example, this means breaking out the courses into their own table so that the
    original flat table is just a table full of unique students.


    CourseID, CourseDesc, and CourseInstructor can become a table called courses with
    a primary key of CourseID. The students_courses table should just contain two
    fields: StudentID and CourseID. You can see the new table designs in Tables D.4
    and D.5.


    | Table D.4 The courses Table |

    | Field Name | Description |

    | --- | --- |

    | CourseID | Unique ID of the course |

    | CourseDescription | Description of the course |

    | CourseInstructor | Instructor of the course |'
  merge: -1
  pgno: 530
- img_proc: true
  md: '# UNDERSTANDING DATABASE NORMALIZATION 509


    | Table D.5 The New students_courses Table |

    | Field Name | Description |

    | StudentID | Unique ID of the student, matching an entry in the students table.
    |

    | CourseID | Unique ID of the course being taken, matching an entry in the courses
    table. |


    Believe it or not, you can go even further with this example, to the third normal
    form.


    # Taking Tables to Third Normal Form


    The rule for the third normal form is


    +   - No attributes depend on other non-key attributes


    This rule simply means that you need to look at your tables and determine whether
    more fields exist that can be broken down further and aren''t dependent on a key.
    Usually, an instructor will teach more than one class. However, the CourseInstructor
    field in the courses table is not a key of any sort. So if you break out this
    information and create a separate table for the sake of efficiency and maintenance,
    that''s the third normal form. Take a look at the new courses table, and the instructors
    table, in Tables D.6 and D.7.


    | Table D.6 The courses Table |

    | Field Name | Description |

    | CourseID | Unique ID of a course |

    | CourseDescription | Description of the course |

    | CourseInstructorID | ID of the instructor, matching an entry in the instructors
    table |'
  merge: -1
