  md: "# Using Cookie Variables\n\nThere's an element to using cookies that most people\
    \ forget about until they spend a few hours trying to debug something that isn't\
    \ even wrong (I've done this). When a web browser accepts a cookie, you can't\
    \ extract its value until the next HTTP request is.\n\nIn other words, if you\
    \ set a cookie name with a value of Julie on page 1, you can't extract that value\
    \ until the user reaches page 2 (or page 5 or page 28—just some other page that\
    \ isn't the page on which the cookie is initially set).\n\n# Using Cookies with\
    \ Authentication\n\nIn the authentication script in the previous chapter, you\
    \ had a login form and a results page. However, the authentication was valid only\
    \ for the result page because it dynamically displayed the secret content (in\
    \ this case, Congratulations message!). If you want to require authentication\
    \ for a series of static pages, you have to make some minor adjustments.\n\n+\
    \   1. do_autuser.php in your text editor.\n\n+   2. Scroll down to the if_else\
    \ block that deals with the result of the authentication. Add a block that sets\
    \ a cookie:\n\n```\nif ($num != 0) {\n  $cookie_name = \"auth\";\n  $cookie_value\
    \ = \"ok\";\n  $cookie_expire = \"0\";\n  $cookie_domain = \"127.0.0.1\";\n  setcookie($cookie_name,\
    \ $cookie_value, $cookie_expire,\n  \"/\", $cookie_domain, 0);\n```\n\n> NOTE\n\
    setcookie() function will send a cookie called auth with a value of ok. It will\
    \ expire at the end of the browser session and will be valid for all directories\
    \ on 127.0.0.1. Use your own domain name if appropriate."
