- img_proc: true
  md: '# A Brief Word About Mailing List Software


    Several very good mailing list applications are available to send mail to large
    numbers of e-mail addresses. The type of system you''ll build in this chapter
    be used only for small lists of less than a few hundred e-mail addresses.


    The system described in this chapter was born from my own laziness one day, when
    I didn''t want to download and install any third-party software. I just made some
    simple files that performed a task. That''s the beauty of PHP: It''s such a simple
    language that sometimes it''s easier to write a few scripts to download or install
    something. However, when your mailing list grows large enough, please move to
    a more robust mailing list application that''s a bit easier on your outgoing mail
    server, and also on you, the administrator.


    # Developing a Subscription Mechanism


    Before you can start sending to a mailing list, you need to build up that subscriber
    base. A simple subscribe/unsubscribe script will take care of that! All this script
    does is add or delete records in a MySQL database table, called subscribers, which
    you''ll create in the next section.


    # Creating the subscribers Table


    My subscribers table has three fields, as shown in Table 23.1. You can have as
    many or as few fields as you want.


    | Table 23.1 Fields for the subscribers Table |

    | Field Name | Description |

    | id | A primary key that holds the subscriber''s auto-incrementing ID number
    |

    | email_addr | Holds the subscriber''s e-mail address |

    | date_added | The date the user subscribed |'
