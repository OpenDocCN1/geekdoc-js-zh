    # Configuring Apache on Windows


    To run a basic installation of Apache, the only changes you need to make are to
    the server name, which you might already have done during the installation wizard.
    However, if you entered dummy information for the server name, or to modify any
    other part of the basic configuration, now is the time to do so.


    The master configuration file for Apache is called httpd.conf, and it lives in
    the conf directory, within the Apache installation directory. So if your installation
    directory is C:\Program Files\Group\Apache2\, the httpd.conf file will be in C:\Program
    Files\Apache\Group\Apache2\conf\.


    Again with the handy shortcut, you can quickly access this file by selecting Program
    Files, Apache HTTP Server 2.0.49, Configure Apache Server, Edit the Apache httpd.conf
    Configuration File from the Windows Start menu. This shortcut is the same as opening
    a text editor and navigating to the file location. To modify the basic configuration,
    primarily the server name, look for a heading called Section 2: ''Main'' server
