  md: '# Basic PHP Language Reference


    This appendix is nowhere near as comprehensive as the PHP manual (found at http://www.php.net/manual/),
    which contains descriptions of every PHP function that exists, user-submitted
    comments and code samples. Instead, this appendix serves as a basic, or "essential"
    reference—it contains the elements of PHP that (in my opinion) you''t live without.
    The PHP development team and all of the documentation contributors have done a
    wonderful job with the entire PHP manual, and there''s no need to reinvent the
    wheel. However, because this appendix touches on only a small percentage of all
    there is to know about PHP, please check the PHP manual before asking a question
    on one of the PHP mailing lists.'
  merge: -1
  pgno: 479
- img_proc: true
  md: '> NOTE

    In all of these examples, when something like string or int appears in a function,
    it is a placeholder for your own string or integer.


    # PHP Start and End Tags


    To combine PHP code with HTML, the PHP code must be escaped, or set apart, from
    the HTML. The PHP engine will consider anything within the tag pairs shown in
    Table B.1 to be PHP code.


    | Opening Tag | Closing Tag |

    | --- | --- |

    | <?php | ?> |

    | <? | ?> |

    | <script language="php"> | </script> |


    # Variables


    You create variables to represent data. For instance, the following variable holds
    a value for sales tax:


    ```

    $sales_tax = 0.0875;

    ```


    This variable holds a SQL statement:


    ```

    $sql = "SELECT * FROM MY_TABLE";

    ```


    You can refer to the values of other variables when determining the value of a
    new variable:


    ```

    $tax_total = $sales_tax * $sub_total;

    ```'
  merge: -1
  pgno: 480
- img_proc: true
  md: 'The following are true of variable names:


    +   - They begin with a dollar sign ($).

    - They cannot begin with a numeric character.

    - They can contain numbers and the underscore character (_).

    - They are case-sensitive.


    Here are some common variable types:


    +   - floats

    - integers

    - strings


    These types are determined by PHP, based on the context in which they appear.


    # Floats


    Each of the following variables is a float, or floating-point number. Floats are
    also known as numbers with decimal points.


    ```

    $a = 1.552;

    $b = 0.964;

    $sales_tax = 0.875;

    ```


    # Integers


    Integers are positive or negative whole numbers, zero, or numbers without decimal
    points. Each of the following variables is an integer:


    ```

    $a = 15;

    $b = -521;

    ```


    # Strings


    A series of characters grouped within double quotation marks is considered a string:'
  merge: -1
  pgno: 481
- img_proc: true
  md: '# APPENDIX B: BASIC PHP LANGUAGE REFERENCE


    ```

    $a = "I am a string";

    $b = "<p>This book is <strong>cool</strong></p>";

    ```


    You can also reference other variables within your string, which will be replaced

    when your script is executed. For example:


    ```

    $num = 57; // an integer

    $my_string = "I read this book $num times!"; // a string

    ```


    When you run the script, $my_string becomes "I read this book 57 times!"


    # Variables from HTML Forms


    Depending on the method of your HTML form (GET or POST), the variables will be
    part

    of the $_POST or $_GET superglobal associative array. The name of the input field
    will

    come the name of the variable. For example, when a form is sent using the POST

    method, the following input produces the variable $_POST[first_name]:


    ```

    <input type="text" name="first_name" size="20">

    ```


    If the method of this form were GET, this variable would be $_GET[first_name].


    # Variables from Cookies


    Like variables from forms, variables are kept in a superglobal

    associative array called $_COOKIE. If you set a cookie user with a value of Joe

    Smith, like so


    ```

    SetCookie("user", "Joe Smith", time(+3600));

    ```


    a variable user is placed in $_COOKIE, with a value of Joe Smith. You then

    refer to $_COOKIE[user] to get that value.


    # Environment Variables


    When a web browser makes a request of a web server, it sends along with the

    request of extra variables called environment variables. They can be very

    useful for displaying dynamic content or authorizing users.'
  merge: -1
  pgno: 482
- img_proc: true
  md: 'By default, environment variables are available to PHP scripts as $VAR_NAME.
    However, to be absolutely sure that you''re reading the correct value, you can
    use getenv() function to assign a value to a variable of your choice. There are
    some common environment variables.


    REMOTE_ADDR gets the IP address of the machine making the request. For example:


    ```

    $remote_address = getenv("REMOTE_ADDR");

    echo "Your IP address is $remote_address";

    ```


    HTTP_USER_AGENT gets the browser type, browser version, language encoding, and
    platform. For example:


    ```

    $browser_type = getenv("HTTP_USER_AGENT");

    echo "You are using $browser_type";

    ```


    For a list of HTTP environment variables and their descriptions, visit http://hohoo
    ncsa.uiuc.edu/cgi/env.html.


    # Arrays


    Simply put, arrays are sets of variables that are contained as a group. In the
    following example, $fave_colors is an array that contains strings representing
    array elements. In this case, the array elements (0 to 3) are names of colors:


    ```

    $fave_colors[0] = "red";

    $fave_colors[1] = "blue";

    $fave_colors[2] = "black";

    $fave_colors[3] = "white";

    ```


    Array elements are counted with 0 as the first position in the numerical index.


    # Operators


    An operator is a symbol that represents a specific action. For example, the +
    arithmetic operator adds two values, and the = assignment operator assigns a value
    to a variable.'
  merge: -1
  pgno: 483
- img_proc: true
  md: '# Arithmetic Operators


    Arithmetic operators bear a striking resemblance to simple math, as shown in Table
    B.2.


    | Operator | Example | Action |

    | --- | --- | --- |

    | + | $b = $a + 3; | Adds values together |

    | - | $b = $a - 3; | Subracts values |

    | * | $b = $a * 3; | Multiplies values |

    | / | $b = $a / 3; | Divides values |

    | % | $b = $a % 3; | Returns the modulus, or remainder |


    # Assignment Operators


    The = is the basic assignment operator:


    $a = 124; // the value of $a is 124


    Other assignment operators are shown in Table B.3.


    | Operator | Example | Action |

    | --- | --- | --- |

    | += | $a += 3; | Changes the value of a variable to the current value plus the
    value on the right side |

    | -= | $a -= 3; | Changes the value of the variable to the current value minus
    the value on the right side |

    | = | $a .= "string"; | Concatenates (adds on to) the value on the right side
    with the current value |'
  merge: -1
  pgno: 484
- img_proc: true
  md: '# Comparison Operators


    It should come as no surprise that comparison operators compare two values. A
    value of true or false is returned by the comparison. The comparison operators
    are shown in Table B.4.


    | Operator | Definition |

    | --- | --- |

    | == | Equal to |

    | != | Not equal to |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |


    # Increment/Decrement Operators


    The increment/decrement operators do just what their name implies: add or subtract
    from a variable (see Table B.5).


    | Operator | Usage | Definition |

    | --- | --- | --- |

    | ++$a | Pre-increment | Increments by 1 and returns $a |

    | $++ | Post-increment | Returns $a and then increments $a by 1 |

    | --a | Pre-decrement | Decrements by 1 and returns $a |

    | $-- | Post-decrement | Returns $a and then decrements $a by 1 |'
  merge: -1
  pgno: 485
- img_proc: true
  md: '# Logical Operators


    Logical operators allow your script to determine the status of conditions, and
    in the context of your if...else or while statements, execute certain code based
    on which conditions are true and which are false (see Table B.6).


    | Table B.6 Logical Operators |

    | Operator | Example | Result |

    | --- | --- | --- |

    | ! | !a | TRUE if $a is not true |

    | && | $a && $b | TRUE if both $a and $b are true |

    | || | $a || $b | TRUE if either $a or $b is true |


    # Control Structures


    Programs are essentially a series of statements. Control structures, as their
    name implies, control how those statements are executed. They''re usually built
    around a series of conditions, such as "If the sky is blue, go outside and play."
    In this example, the condition is "If the sky is blue and the statement is "go
    outside and play."


    Control structures utilize curly braces {} to separate the groups of statements
    from the remainder of the program. Examples of common control structures follow;
    memorizing them will make your life much easier.


    # if...else if...else


    The if...else...else construct executes a statement based on the value of the
    expression being tested. In the following if statement, the expression being tested
    is "$a is equal to 10."'
  merge: -1
  pgno: 486
- img_proc: true
  md: "```\nif ($a == \"10\") {\n    // execute some code\n}\n```\n\nAfter $a is evaluated,\
    \ if it is found to have a value of 10 (that is, if the condition is true), the\
    \ code inside the curly braces will execute. If $a is found to be something other\
    \ than 10 (if the condition is false), the code will be ignored, and the program\
    \ will continue.\n\nTo offer an alternative series of statements, should $a not\
    \ have a value of 10, add an else statement to the structure to execute a section\
    \ of code when the condition is false:\n\n```\nif ($a == \"10\") {\n    echo \"\
    a equals 10\";\n} else {\n    echo \"a does not equal 10\";\n}\n```\n\nThe else\
    \ (or one word: elseif) statement can be added to the structure to evaluate an\
    \ alternative expression before heading to the final else statement. For example,\
    \ the following structure first evaluates whether $a is equal to 10. If that condition\
    \ is false, the else statement is evaluated. If it is found to be true, the code\
    \ within its curly braces executes. Otherwise, the program continues to the final\
    \ else statement:\n\n```\nif ($a == \"10\") {\n    echo \"a equals 10\";\n} else\
    \ ($b == \"8\") {\n    echo \"b equals 8\";\n} else {\n    echo \"a does not equal\
    \ 10 and b does not equal 8.\";\n}\n```\n\nYou can use if statements alone or\
    \ as part of an if...else or if...else if...else statement. Whichever you choose,\
    \ you will find this structure to be an invaluable element in your programs!"
  merge: -1
  pgno: 487
- img_proc: true
  md: "# while\n\nUnlike the if_else if_else structure, in which each expression is\
    \ evaluated once and the action is performed based on its value of true or false,\
    \ the while statement continues to loop until an expression is false. In other\
    \ words, the while loop continues while the expression is true.\n\nFor example,\
    \ in the following while loop, the value of $a is printed on the screen and is\
    \ incremented by 1 as long as the value of $a is less than or equal to 3:\n\n\
    ```\n$a = 0 // set a starting point\nwhile ($a <= \"3\") {\n  echo \"$a equals<br>\"\
    ;\n  $a++;\n}\n```\n\n# for\n\nWhile while loops, for loops evaluate the set of\
    \ conditional expressions at the beginning of each loop. Here is the syntax of\
    \ the for loop:\n\n```\nfor (expr1, expr2; expr3) {\n  // code to execute\n}\n\
    ```\n\nAt the beginning of each loop, the first expression is evaluated, followed\
    \ by the second expression. If the second expression is true, the loop continues\
    \ by executing the code and then evaluating the third expression. If the second\
    \ expression is false, the loop does not continue, and the third expression is\
    \ never evaluated.\n\nTake the counting example used in the while loop, and rewrite\
    \ it using a for loop:\n\n```\nfor ($a = 0; $a <= \"3\"; $a++) {\n  echo \"$a\
    \ equals<br>\";\n}\n```"
  merge: -1
  pgno: 488
- img_proc: true
  md: '# Built-In Functions


    All of the following functions are part of the numerous functions that make up
    the PHP language. These really are just a small number of the PHP functions; they
    are the ones I use on a regular basis. Depending on the types of things you''ll
    be doing with PHP, you might not need more functions, but please visit the PHP
    manual at http://www.php.net/manual/ and familiarize yourself with what is available.


    # Array Functions


    Numerous functions are available for use with arrays. Only a few are noted here—those
    that I find absolutely essential, and those that form a foundation of knowledge
    for working with arrays.


    # array()


    The array() function allows you to manually assign values to an array. Here is
    the syntax of the array() function:


    ```

    $array_name = array("val1", "val2", "val3", ...);

    ```


    # array_push()


    The array_push() function allows you to add one or more elements to the end of
    an existing array. Its syntax is


    ```

    array_push($array_name, "element 1", "element 2", ...);

    ```


    # array_pop()


    The array_pop() function allows you to take (pop) off the last element of an existing
    array. Its syntax is


    ```

    array_pop($array_name);

    ```'
  merge: -1
  pgno: 489
- img_proc: true
  md: '# array_unshift()


    The array_unshift() function allows you to add elements to the beginning of an
    existing array. Its syntax is


    ```

    array_unshift($array_name, "element 1", "element 2", ...);

    ```


    # array_shift()


    The array_shift() function allows you to take (pop) off the first element of an
    existing array. Its syntax is


    ```

    array_shift($array_name);

    ```


    # array_merge()


    The array_merge() function allows you to combine two or more existing arrays.
    Its syntax is


    ```

    array_merge($array1, $array2, ...);

    ```


    # array_keys()


    The array_keys() function returns an array of all the key names in an existing
    array. Its syntax is


    ```

    array_keys($array_name);

    ```


    # array_values()


    The array_values() function returns an array of all the values in an existing
    array. Its syntax is


    ```

    array_values($array_name);

    ```'
  merge: -1
  pgno: 490
- img_proc: true
  md: "# count ()\n\nThe count() function counts the number of elements in a variable.\
    \ It's normally used to count the number of elements in an array, because any\
    \ variable that is an array has only one element—itself.\n\nIn the following example,\
    \ $a is assigned a value equal to the number of elements in the $colors array:\n\
    \n$a = count($colors);\n\nIf $colors contains the values blue, black, red, and\
    \ green, $a will be assigned a value of 4.\n\n# each() and list()\n\nThe each()\
    \ and list() functions usually appear together, in the context of stepping through\
    \ an array and returning its keys and values. Here is the syntax for these functions:\n\
    \n```\neach(arrayname);\nlist(val, val2, val3, ...);\n```\n\nFor example, when\
    \ you submit an HTML form via the GET method, each key/value pair is paired in\
    \ the global variable $_GET. If your input fields are named first_name and last_name\
