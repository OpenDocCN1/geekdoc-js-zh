  md: '> NOTE

    You can log elements such as the user agent (web browser) within the Apache access
    log.


    Although many log analysis packages are available to purchase or download, the
    all-encompassing Apache access log might be overkill for simple tasks. This chapter
    shows you more methods of tracking specific accesses and actions, which have more
    relevance to you than "all access, all information, all the time."


    # Simple Access Counting with MySQL


    To capture access information for specific subsections of your website, or even
    the main page, you can create a simple database table and accompanying PHP code
    snippet.


    Using the now-familiar process of table creation, first you you''ll create a simple
    database table to hold all your access records.


    # Creating the Database Table


    In this example, you will log four elements: page name, page description, agent,
    and date accessed. First, create the database table.


    +   1. Open your web browser and type http://127.0.0.1/show_creatabtable.html.

    2. In the Table Name field, type `page_track`.

