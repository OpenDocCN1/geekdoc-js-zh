  md: '# GETTING VARIABLES FROM FORMS 89


    # Creating the Calculation Script


    According to the form action in calculate_form.html, you need a script called
    calculate.php. The goal of this script is to accept the two values ($_POST[val1]
    and $_POST[val2]) and perform a calculation depending on the value of $_POST[calc].


    +   1. Open a new file in your text editor.


    +   2. Start a PHP block and prepare an if statement that checks for the presence
    of the three variables:


    ```

    <?

    if ($_POST[val1] == "") || ($_POST[val2] == "") || ($_POST[calc] =="") {

    // more code goes here

    }

    ```


    This statement says, "If any of these three variables do not have a value, do
    something else."


    +   3. Replace the "more code goes here" with the following two lines:


    ```

    header("Location: calculate_form.html");

    exit;

    ```


    ![](img/be897bd1bfd4dab38767db24da2a794b_111_0.png)


    The first of these two lines outputs a header statement—in this case, one that
    sends the browser back to the calculation form. The second line causes the script
    to exit. So, if any of the three required variables do not have a value, this
    action will occur.'
