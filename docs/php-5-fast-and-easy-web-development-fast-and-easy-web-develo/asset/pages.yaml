    # Basic MySQL Reference


    In this section, you''ll take a very brief glance at the Structured Query Language

    (SQL), as well as some basic functions you can use with MySQL to make

    development a lot easier. See the MySQL manual at http://www.mysql.com/ for a

    com list of MySQL functions and language elements, or for a good

    introduction to using MySQL, pick up my book Teach Yourself MySQL in 24 Hours.


    > NOTE

    Throughout this appendix, anything inside brackets should be considered

    placeholder text. For example, you would replace [yourDBName] with your

    actual database name in the command.


    In the sections addressing MySQL-related functions, realize that these are specific

    to MySQL and are not available in other databases such as Oracle, Microsoft SQL

    Servers, or even SQLite (which you''ll learn about in Appendix E). However, the

    basic elements of SQL are common to SQL-aware databases.


    # Creating or Dropping a Database


    Starting with something simple, you can use the SQL CREATE command to create a

    new database. The syntax is


    ```

    CREATE DATABASE [yourDBName];

    ```


    When you create a database with this command, you''re really just creating a

    directory to hold the files that make up the tables in the database.


    To delete an entire database from the system, use the DROP command:


    ```

    DROP DATABASE [yourDBName];

    ```'
  merge: -1
  pgno: 535
- img_proc: true
  md: 'Be extremely careful when using the DROP command, because once you delete the
    database, all of the tables are removed as well


    # Creating or Dropping a Table


    You can also use the SQL CREATE command to create a table within the current database.
    The syntax is


    ```

    CREATE TABLE [yourTableName] ([fieldName1 [type],

    [fieldName2] [type], ...] [options]

    ```


    To delete a table from the current database, use the DROP command:


    ```

    DROP TABLE [yourTableName];

    ```


    Be extremely careful when using the DROP command, because once you drop the tables,
    they''re gone!


    # Altering a Table


    The SQL ALTER command gives you the opportunity to modify elements of a particular
    table, such as renaming columns, changing the type of a column, deleting columns,
    and so on. Following are some common uses:


    +   * To add a column to a table, use this:

    ALTER TABLE [yourTableName] ADD [newColumn] [fieldDefinition]


    +   * To delete a column from a table, use this:

    ALTER TABLE [yourTableName] DROP [columnName]


    +   * To change a column from one type to another, use this:

    ALTER TABLE [yourTableName] CHANGE [columnName] [newfieldDefinition]


    +   * To make a unique column in your table, use this:

    ALTER TABLE [yourTableName] ADD UNIQUE ([columnName])


    +   * To index a column in your table, use this:

    ALTER TABLE [yourTableName] ADD INDEX [columnName] ([columnName])'
  merge: -1
  pgno: 536
- img_proc: true
  md: 'Using the ALTER command alleviates the need to delete an entire table and re-create
    it just because you spelled a field name incorrectly or made some minor mistake.


    # Inserting, Updating, or Replacing within a Table


    The SQL INSERT and REPLACE commands populate tables one record at a time. The
    syntax of INSERT is


    ```

    INSERT INTO [yourTableName] ([fieldName1], [fieldName2], ...)

    VALUES (''value of fieldName1''), ''value of fieldName2'');

    ```


    When inserting records, sure to separate your strings with single quotes or double
    quotes. If you use single quotes around your strings and the data you are adding
    apostrophes, avoid errors by escaping the apostrophe (\'') within the INSERT statement.
    Similarly, if you use double quotes around your strings and you want to include
    double quotes as part of the data, escape them (") within your INSERT statement.


    Here is an example of a string where escaping is necessary:


    O''Grady said "Wow"


    If you enclose your strings in double quotes, the INSERT statement would look
    like this:


    ```

    INSERT INTO table_name (column_name) VALUES ("O''Grady said "Wow\''");

    ```


    If you enclose your strings in single quotes instead, the INSERT statement would
    look like this:


    ```

    INSERT INTO table_name (column_name) VALUES (''\O''Grady "Wow''");

    ```


    The REPLACE statement has the same syntax and requirements as the INSERT statement.
    The only difference is that you use REPLACE to overwrite a record in a table when
    the replacement is based on a unique value:


    ```

    REPLACE INTO [yourTableName] ([fieldName1], [fieldName2], ...)

    VALUES (''value of fieldName1''), ''value of fieldName2'');

    ```'
  merge: -1
  pgno: 537
- img_proc: true
  md: 'The UPDATE command modifies parts of a record without replacing the entire
    record. To update an entire column in a table with the same new value, use this:


    ```

    UPDATE [yourTableName] SET [fieldName] = ''[new value]'';

    ```


    If you want to update only specific rows, use a WHERE clause:


    ```

    UPDATE [yourTableName] SET [fieldName] = ''[new value''] WHERE [some expression];

    ```


    UPDATE can be a very powerful SQL command. For example, you can perform string
    functions and mathematical functions on existing records and use the UPDATE command
    to modify their values.


    # Deleting from a Table


    Like the SQL DROP command, using DELETE without paying attention to what you''re
    doing can have horrible consequences in a production environment. Once you drop
    a table or delete a record, it''s gone forever. Don''t be afraid—just be careful.
    To delete all the contents of a table, use the following:


    ```

    DELETE FROM [yourTableName];

    ```


    If you want to delete only specific rows, use a WHERE clause:


    ```

    DELETE FROM [yourTableName] WHERE [some expression];

    ```


    If you''re going to start deleting records, be sure you have a backup, just in
    case something goes wrong. Everyone screws up once—and hopefully never again.


    # Selecting from a Table


    When creating database-driven websites, the SQL SELECT command will likely be
    the most often-used command in your arsenal. The SELECT command causes certain
    records in your table to be chosen, based on criteria that you define. Here is
    the basic syntax of SELECT:


    ```

    SELECT [field names] FROM [table name]

    WHERE [some expression]

    ORDER BY [field names];

    ```'
  merge: -1
  pgno: 538
- img_proc: true
  md: 'To select all the records in a table, use this:


    ```

    SELECT * FROM [yourTableName];

    ```


    To select just the entries in a given column of a table, use this:


    ```

    SELECT [columnName] FROM [yourTableName];

    ```


    To select all the records in a table and have them returned in a particular order,
    for example, if you have a data field for record entries an expression for ORDER
    BY. and you want to see all the record entries ordered by newest to oldest, use
    this:


    ```

    SELECT * FROM [yourTableName] ORDER BY [dateField] DESC;

    ```


    DESC stands for "descending". To view from oldest to newest, use ASC for "ascending".
    ASC is the default order.


    You can perform mathematical and string functions within SQL statements (specific
    to your database), thereby using SELECT to do more than just echo existing data.
    Some examples follow.


    # A Few MySQL-Specific String Functions


    This list contains only a few of the many string-related functions listed in the
    MySQL manual. Visit http://www.mysql.com/doc/ and check out the entire manual
    for more information.


    +   * You can concatenate values using the CONCAT() function. The syntax is SELECT
    CONCAT([field1],[field2],...) AS [newName] FROM [yourTableName];


    +   * Convert your results to lowercase using the LOWER() function. The syntax
    is SELECT LOWER([field1],[field2],...) FROM [yourTableName];


    +   * Convert your results to uppercase using the UPPER() function. The syntax
    is SELECT UPPER([field1],[field2],...) FROM [yourTableName];'
  merge: -1
  pgno: 539
- img_proc: true
  md: '# APPENDIX D: DATABASE NORMALIZATION AND SQL REFERENCE


    # A Few MySQL-Specific Date and Time Functions


    This list contains only few of the many date and time-related functions listed
    in the MySQL manual. Visit http://www.mysql.com/doc/ and check out the entire
    manual for more information.


    +   Get the day of the week (1 = Sunday, 2 = Monday, ...) from a date field using
    the DAYOFWEEK() function. The syntax is

    SELECT DAYOFWEEK([date]) FROM [TableName]


    +   Get the weekday (0 = Monday, 1 = Tuesday, ...) from a date field using the
    WEEKDAY() function. The syntax is

    SELECT WEEKDAY([date]) FROM [TableName]


    > NOTE

    The difference between the DAYOFWEEK() and WEEKDAY() functions is the starting
    point of the week. When you''re getting the day of the week, the week starts at
    Day 1, which is Sunday. When you''re getting the weekday (or "work week"), the
    week starts at Day 0, which is Monday.


    +   Get the day of the month (1 through 31) from a date field using the DAYOFMONTH()
    function. The syntax is

    SELECT DAYOFMONTH([date]) FROM [TableName]


    +   Get the day of the year (1 through 366) from a date field using the DAYOFYEAR()
    function. The syntax is

    SELECT DAYOFYEAR([date]) FROM [TableName]


    +   Get the month (1 through 12) from a date field using the MONTH() function.
    The syntax is

    SELECT MONTH([date]) FROM [TableName]


    +   Get the month name (January, February, ...) from a date field using the MONTHNAME()
    function. The syntax is

    SELECT MONTHNAME([date]) FROM [TableName]'
