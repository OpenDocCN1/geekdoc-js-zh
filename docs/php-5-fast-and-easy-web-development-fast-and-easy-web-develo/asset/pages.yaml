  md: '# Starting and Connecting to Apache


    To start the Apache server, select Program Files, Apache HTTP Server 2.0.49, Control
    Apache Server, Start from the Windows Start menu. This will launch a console window,
    which will then close. Apache will be running in the background.


    With your web server running, you can connect to the server via your web browser
    of choice. The URL will be whatever you used as ServerName—an actual name or IP,
    localhost, or 127.0.0.1.


    # NOTE


    > Remember, only you can connect to your web server using 127.0.0.1 or the name
    localhost. This book assumes that you will be using 127.0.0.1 as the ServerName,
    so if you are not just, substitute your machine name for 127.0.0.1 in the examples.


    To test your installation, open your web browser, type http://127.0.0.1/ in the
    location bar, and Press Enter. You should see a default web page.


    ![](img/be897bd1bfd4dab38767db24da2a794b_51_0.png)


    This default start page comes from the htdocs directory within your Apache installation
    directory. You can go into that directory and delete all the default files if
    you want to, or leave them. They''re not hurting, but you''ll eventually be filling
    the htdocs directory with your own files and subdirectories, so you might want
    to delete them now for the sake of good housekeeping.'
  merge: -1
