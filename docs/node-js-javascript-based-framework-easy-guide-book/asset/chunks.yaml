    # Chapter 4- Asynchronous Flow Control using Promise


    A promise is an object which represents the result of a function call which is
    asynchronous. In some communities, they are referred to as “futures.” In NodeJS,
    there are numerous CommonJS promises, and these will be explored in this chapter
    of the book.


    They were once based on EventEmitters as part of the Node framework. This is what
    they looked like:


    var promise = fs.stat("test");


    promise.addListener("success", function (value) {


        // ok


    })


    promise.addListener("error", function (err) {


        //the error


    });


    With this style, more allocations were needed than was  necessary. Political issues
    with these also arose since there was no fulfillment of all the contracts advocating
    the use of promises. Due to this, the people had to do away with this style of
    using promises, and then adopt a new way in which callbacks are used. These can
    be used as shown in the code given below:


    fs.stat("test", function (err, value) {


        if (err) {


            // the error


        } else {


            // ok


        }


    });


    Terminologies


    There are numerous terminologies which are associated with the use of promises.
    These are discussed below:


    *   Fulfillment: callbacks are called with the value once a successful promise
    has been fulfilled. If registration of more callbacks is done in the future, all
    will be called by use of the same value. Fulfillment means the process of asynchronous
    analog for returning a particular value.


    *   Rejection: when it is impossible for a promise to be fulfilled, the promise
    is “rejected,” and this invokes the errbacks which are waiting and remembers the
    error which was rejected for the future errbacks which are attached. It represents
    the asynchronous analog in which throwing an exception is done.


    *   Progressback: this is a function which has been executed so as to show that
    progress has been made towards the resolution of a promise.


    *   Callback: this is a function which has been executed once a promise has been
    fulfilled with a value.


    *   Resolution: this is a promise which has been resolved, and then it makes progress
    towards a fulfillment or a rejection. Resolving of a promise can only be done
    once, and this can be done with a promise instead of a fulfillment or a rejection.


    *   Errback: this is a function which has been executed if a promise has been
    rejected, with an exception.


    The CommonJS promises for Node can be implemented in two main ways. These are
    discussed below:


    Q Library


    The NPM command can be used for installation of this library as shown below:


    npm install q


    It can then be used as follows in the nodeJS program:


    var q = require(''q'');


    [Promised-IO](https://github.com/kriszyp/promised-io)


    Again, the NPM command can be used for installation of this as shown below:


    npm install promised-io


    According to or depending on the version that you are using, include it by use
    of the following command:


    var q = require(''promised-io/lib/promise''); // <=v2.3


    var q = require(''promised-io/promise''); // >=v2.4


    Note that the two are compatible with each other, and are able to use the promises
    of each other, which means that you can use the one that you want, depending on
    your preference. However, they provide different helper functions outside of our
    basic functions which are responsible for the creation and consumption of promises.


    On the client side, this should be as follows:


    $.when($.get(...))


    .then(function(value) {


        console.log(''successful!'')


    }, function(error) {


        console.log('' A rejection'');


    });


    The resolving of a promise is done only once. This means that it can either be
    resolved or rejected. It also means that an individual errback or callback can
    only be resolved once. Once a promise has been resolved with a value, it will
    always remember the fulfillment. Once a future callback has been attached to the
    promise, the value which was resolved previously will be used for its execution.
    The same case applies to errbacks. If a rejection of a callback occurs and then
    an errback is attached after that, the rejected value will then be used for its
    execution. The behavior of promises will be the same, regardless of whether they
    are resolved or they will be resolved in the future.


    Thenables


    This is another name for promises in commonJS. The name was derived from the methods
    which were available on the promise. The method was responsible for the purpose
    of attaching callbacks, errbacks, and progressbacks. This is shown in the example
    given below:


    promise.then(function() {


      // callback will be executed on a successful promise resolution


    }, function() {


      // errback will be executed on a rejection


    }, function() {


      // progressback will be executed if the promise has a progress to report


    });


    When


    This is a function which assists in attaching listeners to an object. In this
    case, one is not sure of whether the object is a promise or not. Methods are expected
    to return a direct value or a promise object, and this is the importance of using
    this function. In the case of a return of a promised value, then the “then” method
    will not be available. If the function “then” is not used in the promise object,
    the method “when” will take over so as to ensure that it behaves well by making
    sure that the calling of callbacks is done in separate events and not more than
    once. This is shown in the example given below:


    when(myPromise, function() {


      // callback to be executed on a successful promise resolution or if myPromise
    is not a promise but just a value


    }, function() {


      // errback to be executed on a rejection


    }, function() {


      // progressback to be executed if the promise has a progress to report


    });


    Bubbling


    Once a value has been returned by a callback, it is bubbled up the chain of promises.
    The same case applies for rejections. With this, the handling of rejections can
    be done at a higher level than the function which had called our promise-returning
    function which has been rejected. Also, APIs which are promise-based will be able
    to compose responses for successes and rejections by changing of the error or
    the bubble which has been bubbled. Consider the example given below for ease of
    understanding:


    function performAsync() {


      return asyncHelper().then(function(value) {


        // perform an extra processing on the value


        return value; <-- becoming the resolution of the returned promise by the performAsync
    function


      });


    }


    performAsync().then(function(value) {


      console.log(''resolved'', value);


    }, function(error) {


      // this will receive rejections from the performAsync or  be bubbled from the
    asyncHelper


      console.log(''error'', error);


    });


    Using Deferred Helper to create Promises


    A Deferred  is an object which can be used for creation and manipulation of promises.
    It has a promise property with that which it can use for referencing the property
    that it is managing. The promise is resolved or rejected by the use of the “reject”
    or “resolve” methods. A value or a promise can be passed to the “resolve” method. 
    If a value is passed to this method, then the promise will be fulfilled. If a
    promise is passed, then the resolution of that promise will be forwarded to this.
    Note that resolving of a promise can only be done once.


    Reject is just a method which will accept a reason for the rejection. In most
    cases, the rejection is of a string type, but it can be of any type. In the case
    of Deferred, the promise is rejected with a rejection reason. Consider the code
    given below whih shows how this can be done:


    function performAsync() {


      var deferred = q.defer();


      setTimeout(function() {


        deferred.resolve(''hello there'');


      }, 500);


      return deferred.promise;


    }


    performAsync().then(function(value) {


      console.log(''Promise has been Resolved!'', value);


    });'
