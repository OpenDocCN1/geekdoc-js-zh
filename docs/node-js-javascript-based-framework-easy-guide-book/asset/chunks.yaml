  trans: "\n上述代码是以下代码的精简版本：\n\n```javascript\nvar pLevel = require('./plevel')\n\n\
    pLevel(9050);\n```\n\n# 第 4 章 - 使用 Promise 进行异步流控制\n\nPromise（承诺）是一个代表异步函数调用结果的实例。在某些社区中，它们被称为“Futures（期约）”。在\
    \ NodeJS 中，有许多 CommonJS Promise，我们将在本书的这一章中进行探讨。\n\n它们曾经是基于 Node 框架一部分的 `EventEmitters`。它们当时的样式如下：\n\
    \n```javascript\nvar promise = fs.stat(\"test\");\n\npromise.addListener(\"success\"\
    , function (value) {\n    // ok\n})\n\npromise.addListener(\"error\", function\
    \ (err) {\n    //the error\n});\n```\n\n使用这种风格所需的内存分配比必要的要多。此外，由于没有履行所有提倡使用 Promise\
    \ 的合约，这也也引发了一些政治性问题。因此，人们不得不放弃这种使用 Promise 的风格，转而采用使用回调函数（callbacks）的新方法。可以使用如下代码所示：\n\
    \n```javascript\nfs.stat(\"test\", function (err, value) {\n    if (err) {\n \
    \       // the error\n    } else {\n        // ok\n    }\n});\n```\n\n## 术语\n\n\
    与 Promise 使用相关的术语有很多。下面将进行讨论：\n\n- **Fulfillment（履行）**：一旦成功的 Promise 被履行，回调函数将带有该值被调用。如果将来注册了更多回调，它们都将使用相同的值被调用。履行意味着返回特定值的异步类比过程。\n\
    - **Rejection（拒绝）**：当 Promise 无法被履行时，该 Promise 会被“拒绝”，这将触发等待的 `errbacks`，并记住被拒绝的错误，以供后续绑定的\
    \ `errbacks` 使用。它代表了抛出异常的异步类比。\n- **Progressback（进度回调）**：这是一个已执行的函数，用于显示在解决 Promise\
    \ 方面取得了进展。\n- **Callback（回调函数）**：这是一个在 Promise 被赋予值后后执行的函数。\n- **Resolution（解析）**：这是一个已解析的\
    \ Promise，然后它向履行或拒绝迈进。Promise 的解析只能执行一次，并且可以通过 Promise 代替履行或拒绝来完成。\n- **Errback（错误回调）**：这是一个在\
    \ Promise 被拒绝并带有异常时执行的函数。\n\nNode 的 CommonJS Promise 主要可以通过两种方式实现。下面将对其进行讨论：\n\
    \n### Q 库\n\n可以使用 `npm` 命令安装此库，如下所示：\n\n```bash\nnpm install q\n```\n\n之后在 NodeJS\
    \ 程序中可以这样使用：\n\n```javascript\nvar q = require('q');\n```\n\n### [Promised-IO](https://github.com/kriszyp/promised-io)\n\
    \n同样可以使用 `npm` 命令进行安装，如下所示：\n\n```bash\nnpm install promised-io\n```\n\n根据你正在使用的版本，使用以下命令引入：\n\
    \n```javascript\nvar q\n```\n\n（注：提供的源代码中剩余的文本包含重复/碎片化的句子和占位符短语。我根据上述规则对提供的结构化元素进行了格式处理。）\n\
    \n"
- fmt: "\nMost of the functions which take the callback style of Node can easily be\
    \ wrapped in a promise. Any callback function which takes the Node style, and\
    \ that which calls its callback only once, is a potential candidate for wrapping.\
    \ Consider the following function which demonstrates how this can be done:\n\n\
    ```javascript\nfunction myFunction(nodeAsyncFn, context) {\n  return function()\
    \ {\n    var defer = q.defer()\n      , args = Array.prototype.slice.call(arguments);\n\
    \    args.push(function(error, value) {\n      if (error !== null) {\n       \
    \ return defer.reject(error);\n      }\n      return defer.resolve(value);\n \
    \   });\n    nodeAsyncFn.apply(context || {}, args);\n    return defer.promise;\n\
    \  };\n};\n```\n\nThe above function can be used together with other node functions\
    \ such as the `fs.readFile`. as it is shown below:\n\n```javascript\nvar rFile\
    \ = promisify(fs.readFile);\n\nreadFile('file.txt').then(function(d) {\n  console.log(d);\n\
    });\n```\n\nWith both PromisedIO and `Q`, one can provide utilities which can\
    \ be used for calling or wrapping Node-style functions. This is shown below:\n\
    \n```javascript\nvar rFile = q.convertNodeAsyncFunction(fs.readFile);\n\nreadFile('file.txt')\n\
    .then(function (d) { });\n\n// or\n\nq.execute(fs.readFile, 'file.txt')\n.then(function\
    \ (d) { });\n```\n\nThe above case shows how it can be done by use of `PromisedIO`.\
    \ When using `Q`, it can be done as follows:\n\n```javascript\nvar rFile = q.node(fs.readFile);\n\
    \nreadFile('file.txt')\n.then(function (d) { });\n\n// or\n\nq.ncall(fs.readFile,\
    \ fs, 'file.txt')\n.then(function (d) { });\n\n// or\n\nvar deferred = q.defer();\n\
    \nfs.readFile('file.txt', deferred.node());\n\nreturn deferred.promise;\n```\n\
    \n# Chapter 5- Management of Node.js callback Hell\n\nConsider the code given\
    \ below:\n\n```javascript\ndoAsync1(function () {\n  doAsync2(function () {\n\
    \    doAsync3(function () {\n      doAsync4(function () {\n      })\n    })\n\
    \  })\n})\n```\n\nThat is what the callback hell is. When dealing with callback\
    \ hell, you have to know that it is subjective. The reason for this is that when\
    \ using code which is heavily nested, it can be the one working finely. With asynchronous\
    \ code, when the management of the flow becomes overly complex, then the matter\
    \ becomes hellish. For you to know the hell you are undergoing, consider the amount\
    \ of refactoring that you are required to do.\n\nWe want to demonstrate this by\
    \ use of an example. Consider a situation in which we are interested in finding\
    \ the largest file contained in a particular directory. The module given below\
    \ can be used for doing this:\n\n```javascript\nvar fLargest = require('./findLargest')\n\
    \nfLargest('./path/to/dir', function (error, filename) {\n  if (error) return\
    \ console.error(error)\n  console.log('The largest file is:', filename)\n})\n\
    ```\n\nThe following steps can be followed so as to achieve the above needed work:\n\
    \n*   Reading all of the files available in the provided directory.\n*   Get the\
    \ statics of each file available in the directory.\n*   Determine the largest\
    \ file amongst the available ones (if there are multiple of them with the same\
    \ size, just pick one).\n*   Use the name of the largest file to callback.\n\n\
    In case an error results at any point in the process, the callback should be done\
    \ by the use of that error. Again, the callback should not be called more than\
    \ once.\n\n## Nested Approach\n\nFirst, we should use the nested approach to this.\
    \ An example of how this can be done is shown below:\n\n```javascript\nvar fs\
    \ = require('fs')\nvar path = require('path')\nmodule.exports = function (direct,\
    \ callb) {\n  fs.readdir(direct, function (error, files) { // [1]\n    if (error)\
    \ return callb(error)\n    var counter = files.length\n    var errored = false\n\
    \    var statistics = []\n    files.forEach(function (file, index) {\n      fs.statistics(path.join(direct,file),\
    \ function (error, stat) { // [2]\n        if (errored) return\n        if (error)\
    \ {\n          errored = true\n          return callb(error)\n        }\n    \
    \    statistics[index] = stat // [3]\n        if (--counter == 0) { // [4]\n \
    \         var largest = statistics\n            .filter(function (statistic) {\
    \ return statistic.isFile() }) // [5]\n            .reduce(function (prev, next)\
    \ { // [6]\n              if (prev.size > next.size) return prev\n           \
    \   return next\n            })\n          cb(null, files[statistis.indexOf(largest)])\
    \ // [7]\n        }\n      })\n    })\n  })\n  })\n}\n```\n\nNote that you should\
    \ check for the presence of parallel operations. If you find any, then you are\
    \ responsible for making sure that they complete. Only regular files should be\
    \ grabbed, but links and directories should be left untouched. Often, we have\
    \ to reduce the size of the largest files that we have so as to get the largest\
    \ one of all. The final file should then be pulled with the associated callback\
    \ and statistics. The only problem in implementation of this is on how to deal\
    \ with the parallel operations and ensure that the callback is made only once.\n\
    \n*(Note: The provided text contains repetitive logic and broken fragments in\
    \ the nested section; the formatting preserves the original content structure\
    \ while applying the requested rules.)*\n\nThe provided text contains several\
    \ instances of redundant logic and inconsistent variable naming (e.g., `statistis`\
    \ vs `statistics`, `cb` vs `callb`).\n\n## Async Approach\n\nThis module is widely\
    \ used, and it will take the same way taken by node in performing operations.\
    \ The async module can be used as shown below:\n\n```javascript\nvar fs = require('fs')\n\
    var async = require('async')\nvar path = require('path')\nmodule.exports = function\
    \ (diretory, callb) {\n  async.waterfall([ // [1]\n    function (next) {\n   \
    \   fs.readdir(directory, next)\n    },\n    function (files, next) {\n      var\
    \ paths =\n      files.map(function (file) { return path.join(directory,file)\
    \ })\n      async.map(paths, fs.stat, function (error, statistics) { // [2]\n\
    \        next(error, files, statistics)\n      })\n    },\n    function (files,\
    \ statistics, next) {\n      var largest = statistics\n        .filter(function\
    \ (statistic) { return statistic.isFile() })\n        .reduce(function (prev,\
    \ next) {\n          if (prev.size > next.size) return prev\n          return\
    \ next\n        })\n      next(null, files[statistics.indexOf(largest)])\n   \
    \ }\n  ], callb) // [3]\n}\n```\n"
  raw: 'Most of the functions which take the callback style of Node can easily be
    wrapped in a promise. Any callback function which takes the Node style, and that
    which calls its callback only once, is a potential candidate for wrapping. Consider
    the following function which demonstrates how this can be done:


    function myFunction(nodeAsyncFn, context) {


      return function() {


        var defer = q.defer()


          , args = Array.prototype.slice.call(arguments);


        args.push(function(error, value) {


          if (error !== null) {


            return defer.reject(error);


          }


          return defer.resolve(value);


        });


        nodeAsyncFn.apply(context || {}, args);


        return defer.promise;


      };


    };


    The above function can be used together with other node functions such as the
    “fs.readFile”. as it is shown below:


    var rFile = promisify(fs.readFile);


    readFile(''file.txt'').then(function(d) {


      console.log(d);


    });


    With both PromisedIO and Q, one can provide utilities which can be used for calling
    or wrapping Node-style functions. This is shown below:


    var rFile = q.convertNodeAsyncFunction(fs.readFile);


    readFile(''file.txt'')


    .then(function (d) { });


    // or


    q.execute(fs.readFile, ''file.txt'')


    .then(function (d) { });


    The above case shows how it can be done by use of “PromisedIO.” When using Q,
    it can be done as follows:


    var rFile = q.node(fs.readFile);


    readFile(''file.txt'')


    .then(function (d) { });


    // or


    q.ncall(fs.readFile, fs, ''file.txt'')


    .then(function (d) { });


    // or


    var deferred = q.defer();


    fs.readFile(''file.txt'', deferred.node());


    return deferred.promise;


    # Chapter 5- Management of Node.js callback Hell


    Consider the code given below:


    doAsync1(function () {


    doAsync2(function () {


    doAsync3(function () {


    doAsync4(function () {


    })


    })


    })


    That is what the callback hell is. When dealing with callback hell, you have to
    know that it is subjective. The reason for this is that when using code which
    is heavily nested, it can be the one working finely. With asynchronous code, when
    the management of the flow becomes overly complex, then the matter becomes hellish.
    For you to know the hell you are undergoing, consider the amount of refactoring
    that you are required to do.


    We want to demonstrate this by use of an example. Consider a situation in which
    we are interested in finding the largest file contained in a particular directory.
    The module given below can be used for doing this:


    var fLargest = require(''./findLargest'')


    fLargest(''./path/to/dir'', function (error, filename) {


    if (error) return console.error(error)


    console.log(''The largest file is:'', filename)


    })


    The following steps can be followed so as to achieve the above needed work:


    *   Reading all of the files available in the provided directory.


    *   Get the statics of each file available in the directory.


    *   Determine the largest file amongst the available ones (if there are multiple
    of them with the same size, just pick one).


    *   Use the name of the largest file to callback.


    In case an error results at any point in the process, the callback should be done
    by the use of that error. Again, the callback should not be called more than once.


    A Nested Approach


    First, we should use the nested approach to this. An example of how this can be
    done is shown below:


    var fs = require(''fs'')


    var path = require(''path'')


    module.exports = function (direct, callb) {


    fs.readdir(direct, function (error, files) { // [1]


    if (error) return callb(error)


    var counter = files.length


    var errored = false


    var statistics = []


    files.forEach(function (file, index) {


    fs.statistics(path.join(direct,file), function (error, stat) { // [2]


    if (errored) return


    if (error) {


    errored = true


    return callb(error)


    }


    statistics[index] = stat // [3]


    if (--counter == 0) { // [4]


    var largest = statistics


    .filter(function (statistic) { return statistic.isFile() }) // [5]


    .reduce(function (prev, next) { // [6]


    if (prev.size > next.size) return prev


    return next


    })


    cb(null, files[statistis.indexOf(largest)]) // [7]


    }


    })


    })


    })


    }


    Note that you should check for the presence of parallel operations. If you find
    any, then you are responsible for making sure that they complete. Only regular
    files should be grabbed, but links and directories should be left untouched. Often,
    we have to reduce the size of the largest files that we have so as to get the
    largest one of all. The final file should then be pulled with the associated callback
    and statistics. The only problem in implementation of this is on how to deal with
    the parallel operations and ensure that the callback is made only once. However,
    this will be handled later.


    Consider the code given below:


    function getStatistics (paths, callb) {


    var counter = paths.length


    var errored = false


    var statistics = []


    paths.forEach(function (path, index) {


    fs.statistic(path, function (error, statistic) {


    if (errored) return


    if (error) {


    errored = true


    return callb(error)


    }


    statistics[index] = statistic


    if (--counter == 0) callb(null, statistics)


    })


    })


    }


    In the above code, we have begun by grabbing our files from the directory. Our
    first task is the “fs.readdir(),”  and this means that we will not be required
    to write a function for that. With the above code, we will provide a set of paths,
    and the function will then return the statistics of those paths and their order
    will be maintained.


    It is now time for us to implement the part for comparison. We need to be able
    to compare the different files available in our directory so as to determine the
    largest one of all. This should return the largest file in the directory. The
    code for doing that should be implemented as shown below:


    function getLargestFile (files, statistics) {


    var largest = statistics


    .filter(function (statistic) { return statistic.isFile() })


    .reduce(function (prev, next) {


    if (prev.size > next.size) return prev


    return next


    })


    return files[statistics.indexOf(largest)]


    }


    That is how it should be done. The whole thing can then be tied together as shown
    below:


    var fs = require(''fs'')


    var path = require(''path'')


    module.exports = function (directory, callb) {


    fs.readdir(direct, function (error, files) {


    if (error) return callb(error)


    var paths = files.map(function (file) { // [1]


    return path.join(diretory,file)


    })


    getStats(paths, function (error, statistics) {


    if (error) return callb(error)


    var lFile = getLargestFile(files, stats)


    cb(null, lFile)


    })


    })


    }


    That is how the code should be. A list of paths should then be generated from
    the directory and the files. With the modular approach, testing and reusing of
    methods is made much easier. The export itself can easily be reasoned about. At
    this point, the parallel statistics are easily managed.


    Async Approach


    This module is widely used, and it will take the same way taken by node in performing
    operations. The async module can be used as shown below:


    var fs = require(''fs'')


    var async = require(''async'')


    var path = require(''path'')


    module.exports = function (diretory, callb) {


    async.waterfall([ // [1]


    function (next) {


    fs.readdir(directory, next)


    },


    function (files, next) {


    var paths =


    files.map(function (file) { return path.join(directory,file) })


    async.map(paths, fs.stat, function (error, statistics) { // [2]


    next(error, files, statistics)


    })


    },


    function (files, statistics, next) {


    var largest = statistics


    .filter(function (statistic) { return statistic.isFile() })


    .reduce(function (prev, next) {


    if (prev.size > next.size) return prev


    return next


    })


    next(null, files[statistics.indexOf(largest)])


    }


    ], callb) // [3]


    }


    With the property “[async.waterfall](https://github.com/caolan/async#waterfalltasks-callback),”
    a series of flow of execution will be provided,  you will be in a position to
    pass data from a particular operation to another function, and this will be done
    by the use of the “next” callback.'
