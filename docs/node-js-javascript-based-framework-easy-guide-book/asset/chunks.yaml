  trans: "\n\n`then` 应该被视为一个函数，可以用于解包（unwrapping）promise，以揭示异步操作发生了什么。避免将其仅仅视为一个只接受\
    \ `onFulfilled` 和 `onRejected` 两个回调函数的函数。只要你能访问它，就可以通过使用 `then` 来解包它。\n\n### Promise\
    \ 的嵌套与链式调用\n\n`then` 方法可以返回一个 promise。如下所示：\n\n```javascript\nvar p1 = readFile()\n\
    \nvar p2 = p1.then(readAnotherFile, console.error)\n```\n\n该 promise 仅代表其可能指定的\
    \ `onRejected` 和 `onFulfilled` 句器的返回值。请注意，我们可能只有一个解析（resolution），而该 promise 将代理任何被调用的解析，如所示所示：\n\
    \n```javascript\nvar p1 = readFile()\n\nvar p2 = p1.then(function (data) {\n \
    \ return readAnotherFile() // 如果 readFile 运行成功，让我们读取 readAnotherFile\n}, function\
    \ (error) {\n  console.error(error) // 如果 readFile 运行失败，让我们记录它，但我们仍然会读取 readAnotherFile\n\
    \  return readAnotherFile()\n})\n\np2.then(console.log, console.error) // readAnotherFile\
    \ 的结果\n```\n\n注意 `then` 返回一个 promise，这表明 promise 可以进行链式调用，以避免回调地狱。如下所示：\n\n```javascript\n\
    readFile()\n  .then(readOtherFile)\n  .then(performSomethingElse)\n  .then(...)\n\
    ```\n\n如果你需要保持一个闭包（closure），可以像下面这样嵌套 promise：\n\n```javascript\nreadFile()\n\
    \  .then(function (d) {\n    return readOtherFile().then(function () {\n     \
    \ // 对 `data` 执行某些操作\n    })\n  })\n```\n\n### 同步函数与 Promise\n\n有多种方法可以使用 promise\
    \ 进行同步函数的建模。其中一个示例是使用 `return` 函数来调用另一个函数。在我们之前的示例中，我们一直在使用 `readAnotherFile()`\
    \ 函数来指示在 `readFile` 函数之后要执行什么。\n\n一旦你返回了一个 promise，一旦同步操作完成，下一个 `then` 就会收到信号。也可以返回其他类型的的值，下一个\
    \ `onFulfilled` 将将该值作为参数传递给它。如下所示：\n\n```javascript\nreadFile()\n  .then(function\
    \ (buffer) {\n    return JSON.parse(buffer.toString())\n  })\n  .then(function\
    \ (data) {\n    // 对 `data` 执行某些操作\n  })\n```\n\n这就是这种实现方法。\n\n### Promise 与错误处理\n\
    \n除了 `return` 关键字外，还可以使用其他关键字如 `throw` 和 `try/catch`，它们在处理错误和异常时非常有用。这展示了 promise\
    \ 在 Node 中是多么强大。我们希望同步这种实现方式。考虑以下这段同步代码的情况：\n\n```javascript\ntry {\n  doThis()\n\
    \  doThat()\n} catch (error) {\n  console.error(error)\n}\n```\n\n通过上面的示例，`doThis()`\
    \ 和 `doThat()` 函数将返回错误。我们的目标是捕获并记录此错误。通过 `try/catch` 块，可以将许多操作组合在一起。这意味着可以很大程度上避免对我们的每个操作进行显式错误处理的过程。这可以通过\
    \ promise 异步完成。如下所示：\n\n```javascript\ndoThisAsync()\n  .then(doOtherAsync)\n\
    \  .then(null, console.error)\n```\n\n如果函数 `doThisAsync` 运行失败，promise 将被拒绝，链中带有\
    \ `onRejected` 句器的下一个 `then` 将被调用。在我们的示例中，这个函数是 `console.error`。注意，就像 `try/catch`\
    \ 块一样，这个函数将永远不会被调用。这就是我们所证明的程度，因为使用原始回调时，我们每一步都在显式地处理错误。当抛出异常时（无论是隐式的还是显式的），只要它来自\
    \ `then` 回调，它将由 promise 处理。一个示例如下所示：\n\n```javascript\ndoThisAsync()\n  .then(function\
    \ (d) {\n    d.test.baz = 'bar' // 因为 test 未定义，将抛出 ReferenceError\n  })\n  .then(null,\
    \ console.error)\n```\n\n产生了一个错误。在上述情况下抛出的 `ReferenceError` 将由链中的下一个 `onRejected`\
    \ 句器处理。上述方法也适用于显式流程。一个示例如下所示：\n\n```javascript\ndoThisAsync()\n  .then(function\
    \ (d) {\n    if (!d.baz) throw new Error('预期那里应该有一个 baz')\n  })\n  .then(null,\
    \ console.error)\n```\n\n如你所知，promise 的工作方式与 `try/catch` 块相同。通过该块，可以掩盖错误而无需显式地处理它。一个示例如下所示：\n\
    \n```javascript\ntry {\n  throw new Error('永远不会意识到这件事发生了')\n} catch (ex) {}\n\
    ```\n\n同样的情况也适用于 promise，如下所示：\n\n```javascript\nreadFile()\n  .then(function\
    \ (d) {\n    throw new Error('永远不会意识到这件事发生了')\n  })\n```\n\n为了暴露被掩盖的错误，我们应该使用\
    \ `.then(null, onRejected)` 子句来结束 promise 链。一个示例如下所示：\n\n```javascript\nreadFile()\n\
    \  .then(function (d) {\n    throw new Error('现在我意识到这件事发生了')\n  })\n  .then(null,\
    \ console.error)\n```\n\n有些库有其他机制来暴露被掩盖的错误。一个很好的例子是 `Q` 模块，它为我们提供了名为 `done` 的方法，可以向上抛出错误。\n\
    \n### 回调转换为 Promise\n\n你可能不知道 promise 是如何生成的。创建 promise 的 API 规范并没有在 `Promise/A+`\
    \ 中完成，因为对于互操作性这不是必要的。这表明 promise 库的实现总是不同的。\n\n注意，在 Node 核心异步函数中，无法返回 promise。然而，通过使用\
    \ `Q` 模块，我们可以实现这一点。如下所示：\n\n```javascript\nvar fs_rFile = Q.denodeify(fs.readFile)\n\
    var p = fs_rFile('file.txt')\np.then(console.log, console.error)\n```\n\n通过 `Q`，提供了许多辅助函数用于适配环境，使其能够感知\
    \ promise。\n\n### 原始 Promise 的创建\n\n你可以使用 `Q.defer` 来创建原始 promise。假设我们想让 `fs.readFile`\
    \ 感知 promise。如下所示：\n\n```javascript\nfunction fs_rFile (file, encoding) {\n  var\
    \ deferred = Q.defer()\n  fs.readFile(file, encoding, function (error, data) {\n\
    \    if (error) deferred.reject(error) // 以 `error` 为原因拒绝 promise\n    else deferred.resolve(data)\
    \ // 以 `data` 为值解析 promise\n  })\n  return deferred.promise // 返回 promise\n}\n\
    ```\n\n`fs_rFile('file.txt').then(console.log, console.error)`\n\n人们还可以创建同时支持\
    \ API 和回调的 API。你现在知道如何将回调代码转换为 promise 代码了。可以开发提供回调和 promise 接口的 API。一个示例是我们希望将\
    \ `fs.readFile` 转换为支持 promise 和回调的 API。这可以很容易完成。下面的代码演示了在 Node 中如何实现：\n\n```javascript\n\
    function fs_rFile (file, encoding, callback) {\n  var deferred = Q.defer()\n \
    \ fs.readFile(function (error, d) {\n    if (error) deferred.reject(error) //\
    \ 以 `error` 为原因拒绝 promise\n    else deferred.resolve(d) // 以 `d` 为值解析 promise\n\
    \  })\n  return deferred.promise.nodeify(callback) // 返回 promise\n}\n```\n\n一旦提供了回调，在\
    \ promise 解析或拒绝后，将使用标准的 Node 参数风格调用它。标准的 Node 风格参数格式为 `(err, result)`。一个示例如下所示：\n\
    \n```javascript\nfs_rFile('file.txt', 'utf8', function (error, data) {\n  // ...\n\
    })\n```\n"
- fmt: "\nPromises can also be used for the purpose of performing parallel operations.\
    \ You are now aware of how sequential asynchronous operations operate in Node.JS.\
    \ When using the `Q` module so as to deal with parallel operations, we use the\
    \ method `Q.all`. This method usually takes in an array of promises, but then\
    \ it returns a new promise which it creates. Once all of the necessary operations\
    \ have been completed in a successful manner, then the new promise will be completed.\
    \ In case single or multiple operations fail or run unsuccessfully, then the new\
    \ promise will be rejected. An example of this is shown below:\n\n```javascript\n\
    var aPromise = Q.all([ fs_rFile('myfile1.txt'), fs_readFile('myfile2.txt') ])\n\
    \naPromise.then(console.log, console.error)\n```\n\nThat is how it can be done.\
    \ You should also be aware that the functionality of promises mimics that of functions.\
    \ A function always has a single return value. With promises, there is much consistency\
    \ with the asynchronous parts. For the purpose of spreading results into multiple\
    \ arguments, one can use the `[Q.spread](https://github.com/kriskowal/q#combination)`.\n\
    \n# Chapter 7- Execution of Multiple Instances in a Single Process\n\nThere is\
    \ a frequent request for Node to be integrated with other applications. An example\
    \ is when we need to integrate it with the other event loops and support multiple\
    \ execution contexts for the Node. When we talk of the same context, we mean the\
    \ ability to have multiple instances of Node existing peacefully in the same application.\n\
    \nCurrently, with Node `v0.12`, multiple execution contexts can be used within\
    \ the same event loop. The Node internals should also be made aware of the presence\
    \ of multiple execution contexts. Consider the example given below, showing how\
    \ this can be done:\n\n```javascript\nfunction myconnect() {\n  this.write('GET\
    \ / HTTP/1.1\\r\\n' +\n  'Host: strongloop.com\\r\\n' +\n  '\\r\\n');\n  this.pipe(process.stdout);\n\
    }\n\nrequire('net').connect(80, 'strongloop.com', myconnect);\n```\n\nWhen looked\
    \ at execution-wise, it will be as follows:\n\n```\n<enter VM>\nconnect(80, 'strongloop.com');\
    \ // kernel reporting EINPROGRESS here\n<leave VM>\n<wait for the TCP handshake\
    \ to complete>\n<enter VM>\nmyconnect();\n<leave vm>\n```\n\nThe execution context\
    \ can change between our calls to the vm. This is why the function `connect()`\
    \ has to remember the current context and the call to `myconnect()` should restore\
