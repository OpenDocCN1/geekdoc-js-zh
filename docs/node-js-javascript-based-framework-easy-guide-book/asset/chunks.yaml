    # Chapter 9- Event Loop Monitoring


    With the event loop in Node, we are given the capability of handling highly concurrent
    requests while at the same time running the requests which are single-threaded.
    The processing is delegated to the operating system itself, and this is done via
    the POSIXD interface as the new callbacks and events are still being handled.


    Blocking an event loop


    When this is done in a Node application, it can lead to catastrophic effects.
    We will demonstrate how the blocking can be done by external events.


    With a function call, blocking is said to have occurred when the flow of the current
    execution of the thread waits until we have the function finished before being
    executed. Most people see the “I/O” as blocking. An example is when you are calling
    the function “socket.read().” The program will have to wait for our call to end
    so as to continue. This is what you may need to perform with a return value.


    Note that in Node, a function calling a CPU work will always block. Consider the
    fibonacci function shown  below, which will block the execution of the thread
    as per current since it needs to use the CPU. Here is the function:


    function fibonacci (j) {


    if (j < 2)


    return 1;


    else


    return fibonacci(j-2) + fibonacci(j-1);


    }


    In Node, we do not create servers for Fibonacci. However, sometimes, the Node
    becomes CPU bound. Consider the example given below:


    function requestHandler(request, response) {


    var body = request.rawBody; // has the POST body


    try {


    var json = JSON.parse(body);


    response.end(json.user.username);


    }


    catch(ex) {


    response.end("FAIL");


    }


    }


    With the above example, the body of the request will be taken and then parsed
    on. The flow of this should run very well until one has executed a file which
    is worth 15MB. When the call “JSON.parse()” has been executed on 15MB file, the
    processing will take around 1.5 seconds.


    For those who are in need of monitoring concurrent connections, you can use the
    “[StrongLoop Arc](https://strongloop.com/node-js/build-deploy-and-scale/).” It
    will also enable you to monitor the throughput of your Node applications that
    you have created.


    # Conclusion


    It can be concluded that NodeJS is a very useful and very powerful library which
    provides an assist in the development of web applications. The framework is well
    known for its apps, which are highly scalable in terms of size and performance.
    This is why it is highly used in the development of network applications in which
    high scalability is needed.


    The framework is event-driven and asynchronous, and was built on top of the JavaScript
    engine for Chrome. JavaScript developers and experts usually find it easy for
    them to learn how to use the Node since they are loosely related. In fact, Node
    is based on JavaScript since it is one of its available libraries.


    In Node, your programs will not be forced to wait for certain operations to be
    completed. As you wait for the response to be available to you, you can continue
    in performing other tasks. This is because Node is a non-blocking JavaScript blocking
    and can support concurrent operations to be executed. Most of you are aware of
    the concept of buffering of data in which it is stored in a type of memory named
    buffer for quick and easy access. In Node, this type of memory or the process
    is not supported at all. What happens is that the data is provided or output to
    the user in the form of chunk-by-chunk.


    The framework has great features, which explains the reason behind its increased
    popularity among web developers. When compared to related frameworks or the ones
    which can supplement it, it is more popular. An example of such a framework is
    the Ruby on rails. The framework has numerous modules which can be used for the
    purpose of accomplishing different tasks in one’s app. It will be good for you
    to learn how to use this framework so as to get assistance in your process of
    development. This book is an excellent guide for you.'
