- fmt: "\nThe `then` should be seen as a function which can be used for unwrapping\
    \ a promise so as to reveal what had taken place in the asynchronous operation.\
    \ Avoid seeing it as a function which takes only two callbacks which include `onFulfilled`\
    \ and `onRejected`. One can unwrap it by use of `then`, provided you have access\
    \ into it.\n\n### Nesting and Chaining Promises\n\nThe method `then` can be used\
    \ for the purpose of returning a promise. This is shown below:\n\n```javascript\n\
    var p1 = readFile()\n\nvar p2 = p1.then(readAnotherFile, console.error)\n```\n\
    \nThe promise just represents the return value for its own `onRejected` and `onFulfilled`\
    \ handlers in case they had been specified. Note that it is possible for us to\
    \ have only one resolution, and the promise will proxy any resolution which has\
    \ been called as shown below:\n\n```javascript\nvar p1 = readFile()\n\nvar p2\
    \ = p1.then(function (data) {\n  return readAnotherFile() // if readFile runs\
    \ successfully, let us readAnotherFile\n}, function (error) {\n  console.error(error)\
    \ // if readFile runs unsuccessfully, let us log it but we will still readAnotherFile\n\
    \  return readAnotherFile()\n})\n\np2.then(console.log, console.error) // the\
    \ product of readAnotherFile\n```\n\nNote that `then` returns a promise, and this\
    \ indicates that the promises can be chained for the purpose of avoiding the callback\
    \ hell. This is shown below:\n\n```javascript\nreadFile()\n  .then(readOtherFile)\n\
    \  .then(performSomethingElse)\n  .then(...)\n```\n\nIf there is a need for you\
    \ to keep alive a closure, the promises can be nested as shown below:\n\n```javascript\n\
    readFile()\n  .then(function (d) {\n    return readOtherFile().then(function ()\
    \ {\n      // perform something with the `data`\n    })\n  })\n```\n\n### Synchronous\
    \ Functions and Promises\n\nThere are a number of ways that promises can be used\
    \ for the modeling of synchronous functions. An example of this is when we use\
    \ the `return` function so as to call another function. In our previous examples,\
    \ we have been using the function `readAnotherFile()` so as to signal what comes\
    \ next after the function `readFile`.\n\nOnce you have returned a promise, the\
    \ next `then` will be signaled once the synchronous operation has been completed.\
    \ Any value of another type can also be returned, and the next `onFulfilled` will\
    \ have a value as an argument passed to it. This is shown below:\n\n```javascript\n\
    readFile()\n  .then(function (buffer) {\n    return JSON.parse(buffer.toString())\n\
    \  })\n  .then(function (data) {\n    // doing something with the `data`\n  })\n\
    ```\n\nThat is how it can be done.\n\n### Promises and Error Handling\n\nOther\
    \ than the `return` keyword, one can use the other keywords such as `throw` and\
    \ `try/catch`, which are very useful when it comes to error and exception handling.\
    \ This shows how powerful promises are in Node. We want to synchronize how this\
    \ can be done. Consider a situation in which we have the following piece of synchronous\
    \ code:\n\n```javascript\ntry {\n  doThis()\n  doThat()\n} catch (error) {\n \
    \ console.error(error)\n}\n```\n\nWith the above example, the functions `doThis()`\
    \ and `doThat()` will return errors. Our aim is to catch and then log this error.\
    \ With the `try/catch` block, so many operations can be grouped. This means that\
    \ the process of handling errors explicitly for each of the operation we have\
    \ can be greatly avoided. This can be done asynchronously with the use of promises.\
    \ This is shown below:\n\n```javascript\ndoThisAsync()\n  .then(doOtherAsync)\n\
    \  .then(null, console.error)\n```\n\nIn case the function `doThisAsync` runs\
    \ unsuccessfully, the promise will be rejected and the next then in the chain\
    \ which has the handler for `onRejected` will be called. In our example, this\
    \ is the function `console.error`. Note that just as it is the case with the block\
    \ `try/catch`, this function will never be called. That is how much we have proved\
    \ since with the raw callbacks, we were handling the errors explicitly at each\
    \ step. When an exception has been thrown, whether it is either implicit or explicit,\
    \ it will be handled by the promise if it is from the `then` callback. An example\
    \ of this is shown below:\n\n```javascript\ndoThisAsync()\n  .then(function (d)\
    \ {\n    d.test.baz = 'bar' // throwing a ReferenceError as test is not defined\n\
    \  })\n  .then(null, console.error)\n```\n\nAn error has resulted. The `ReferenceError`\
    \ which is raised in the above case will be handled by the `onRejected` handler\
    \ which is next in the chain. The above can also work for an explicit flow. An\
    \ example of this is shown below:\n\n```javascript\ndoThisAsync()\n  .then(function\
    \ (d) {\n    if (!d.baz) throw new Error('A baz was expected to be there')\n \
    \ })\n  .then(null, console.error)\n```\n\nAs you are aware, promises work in\
    \ the same way as `try/catch` block does. With this block, one can mask an error\
    \ without having to handle it explicitly. An example of this is shown below:\n\
    \n```javascript\ntry {\n  throw new Error('never will realize this has happened')\n\
    } catch (ex) {}\n```\n\nThe same case applies to promises as shown below:\n\n\
    ```javascript\nreadFile()\n  .then(function (d) {\n    throw new Error('never\
    \ will realize this has happened')\n  })\n```\n\nFor us to expose the errors which\
    \ have been masked, we should use the clause `.then(null, onRejected)` so as to\
    \ end the promise chain. An example of this is shown below:\n\n```javascript\n\
    readFile()\n  .then(function (d) {\n    throw new Error('now I realize this had\
    \ happened')\n  })\n  .then(null, console.error)\n```\n\nThere are libraries which\
    \ have other mechanisms for how masked errors can be exposed. A good example is\
    \ the `Q` module, which provides us with the method named `done` which can be\
    \ used for rethrowing the error upstream.\n\n### Conversion of callbacks to promises\n\
    \nYou may not know how promises are generated. The specification of the API for\
    \ the creation of a promise is not done in the `Promise/A+` since this is not\
    \ necessary for interoperability. This is an indication that the implementation\
    \ of promise libraries always vary.\n\nNote that with the Node core asynchronous\
    \ functions, promises cannot be returned. However, by use of the `Q` module, we\
    \ can make this one possible. This can be done as shown below:\n\n```javascript\n\
    var fs_rFile = Q.denodeify(fs.readFile)\nvar p = fs_rFile('file.txt')\np.then(console.log,\
    \ console.error)\n```\n\nWith `Q`, a number of helper functions are provided for\
    \ adaptation of Node and other environments so that they can be aware of promises.\n\
    \n### Creation of Raw Promises\n\nYou can use `Q.defer` for the purpose of the\
    \ creation of raw promises. Suppose that we want to make `fs.readFile` be promise-aware\
    \ by wrapping it. This can be done as shown below:\n\n```javascript\nfunction\
    \ fs_rFile (file, encoding) {\n  var deferred = Q.defer()\n  fs.readFile(file,\
    \ encoding, function (error, data) {\n    if (error) deferred.reject(error) //\
    \ rejecting the promise with `error` as the reason\n    else deferred.resolve(d)\
    \ // fulfilling the promise with the `d` as the value\n  })\n  return deferred.promise\
    \ // the promise will be returned\n}\n```\n\n`fs_rFile('file.txt').then(console.log,\
    \ console.error)`\n\nOne can also make APIs which can support both APIs and callbacks.\
    \ You are now aware of how a callback code can be turned into a promise code.\
    \ APIs can be developed which can be used for provision of an interface for both\
    \ callback and promise. An example is when we want to turn the `fs.readFile` into\
    \ an API which can support both promises and callbacks. This can easily be done.\
    \ The code given below demonstrates how this can be done in Node:\n\n```javascript\n\
    function fs_rFile (file, encoding, callback) {\n  var deferred = Q.defer()\n \
    \ fs.readFile(function (error, d) {\n    if (error) deferred.reject(error) //\
    \ rejecting the promise with `error` as the reason\n    else deferred.resolve(d)\
    \ // fulfilling the promise with the `d` as the value\n  })\n  return deferred.promise.nodeify(callback)\
    \ // the promise will be returned\n}\n```\n\nOnce a callback has been provided,\
    \ the standard Node arguments style is used for calling it once the promise has\
    \ been resolved or rejected. The standard Node style arguments are of the form\
    \ `(err, result)`. An example of this is shown below:\n\n```javascript\nfs_rFile('file.txt',\
    \ 'utf8', function (error, data) {\n  // ...\n})\n```\n"
  raw: 'The “then” should be seen as a function which can be used for unwrapping a
    promise so as to reveal what had taken place in the asynchronous operation. Avoid
    seeing it as a function which takes only two callbacks which include “onFulfilled”
    and “onRejected.”  One can unwrap it by use of “then,” provided you have access
    into it.


    Nesting and Chaining Promises


    The method “then” can be used for the purpose of returning a promise. This is
    shown below:


    var p1 = readFile()


    var p2 = p1.then(readAnotherFile, console.error)


    The promise just represents the return value for its own “onRejected” and “onFulfilled”
    handlers in case they had been specified.  Note that it is possible for us to
    have only one resolution, and the promise will proxy any resolution which has
    been called as shown below:


    var p1 = readFile()


    var p2 = p1.then(function (data) {


    return readAnotherFile() // if readFile runs successfully, let us readAnotherFile


    }, function (error) {


    console.error(error) // if readFile runs unsuccessfully, let us log it but we
    will still readAnotherFile


    return readAnotherFile()


    })


    p2.then(console.log, console.error) // the product of readAnotherFile


    Note that “then” returns a promise, and this indicates that the promises can be
    chained for the purpose of avoiding the callback hell. This is shown below:


    readFile()


    .then(readOtherFile)


    .then(performSomethingElse)


    .then(...)


    If there is a need for you to keep alive a closure, the promises can be nested
    as shown below:


    readFile()


    .then(function (d) {


    return readOtherFile().then(function () {


    // perform something with the `data`


    })


    })


    Synchronous Functions and Promises


    There are a number of ways that promises can be used for the modeling of synchronous
    functions. An example of this is when we use the “return” function so as to call
    another function. In our previous examples, we have been using the function “readAnotherFile()”
    so as to signal what comes next after the function “readFile.”


    Once you have returned a promise, the next “then” will be signaled once the synchronous
    operation has been completed. Any value of another type can also be returned,
    and the next “onFulfilled” will have a value as an argument passed to it. This
    is shown below:


    readFile()


    .then(function (buffer) {


    return JSON.parse(buffer.toString())


    })


    .then(function (data) {


    // doing something with the `data`


    })


    That is how it can be done.


    Promises and Error Handling


    Other than the “return” keyword, one can use the other keywords such as “throw”
    and “try/catch,” which are very useful when it comes to error and exception handling.
    This shows how powerful promises are in Node. We want to synchronize how this
    can be done. Consider a situation in which we have the following piece of synchronous
    code:


    try {


        doThis()


        doThat()


    } catch (error) {


        console.error(error)


    }


    With the above example, the functions “doThis()” and “doThat()” will return errors.
    Our aim is to catch and then log this error. With the “try/catch” block, so many
    operations can be grouped. This means that the process of handling errors explicitly
    for each of the operation we have can be greatly avoided. This can be done asynchronously
    with the use of promises. This is shown below:


    doThisAsync()


    .then(doOtherAsync)


    .then(null, console.error)


    In case the function “doThisAsync” runs unsuccessfully, the promise will be rejected
    and the next then in the chain which has the handler for “onRejected” will be
    called. In our example, this is the function “console.error.” Note that just as
    it is the case with the block “try/catch,”  this function will never be called.
    That is how much we have proved since with the raw callbacks, we were handling
    the errors explicitly at each step. When an exception has been thrown, whether
    it is either implicit or explicit, it will be handled by the promise if it is
    from the “then” callback. An example of this is shown below:


    doThisAsync()


    .then(function (d) {


          d.test.baz = ''bar'' // throwing a ReferenceError as test is not defined


    })


    .then(null, console.error)


    An error has resulted. The “ReferenceError” which is raised in the above case
    will be handled by the “onRejected” handler which is next in the chain. The above
    can also work for an explicit flow.


    An example of this is shown below:


    doThisAsync()


    .then(function (d) {


         if (!d.baz) throw new Error(''A baz was expected to be there'')


    })


    .then(null, console.error)


    As you are aware, promises work in the same way as “try/catch” block does. With
    this block, one can mask an error without having to handle it explicitly. An example
    of this is shown below:


    try {


         throw new Error(''never will realize this has happened'')


    } catch (ex) {}


    The same case applies to promises as shown below:


    readFile()


    .then(function (d) {


          throw new Error(''never will realize this has happened'')


    })


    For us to expose the errors which have been masked, we should use the clause “.then(null,
    onRejected)” so as to end the promise chain. An example of this is shown below:


    readFile()


    .then(function (d) {


          throw new Error(''now I realize this had happened'')


    })


    .then(null, console.error)


    There are libraries which have other mechanisms for how masked errors can be exposed.
    A good example is the “Q” module, which provides us with the method named “done”
    which can be used for rethrowing the error upstream.


    Conversion of callbacks to promises


    You may not know how promises are generated. The specification of the API for
    the creation of a promise is not done in the “Promise/A+” since this is not necessary
    for interoperability. This is an indication that the implementation of promise
    libraries always vary.


    Note that with the Node core asynchronous functions, promises cannot be returned.
    However, by use of the Q module, we can make this one possible. This can be done
    as shown below:


    var fs_rFile = Q.denodeify(fs.readFile)


    var p = fs_rFile(''file.txt'')


    p.then(console.log, console.error)


    With Q, a number of helper functions are provided for adaptation of Node and other
    environments so that they can be aware of promises.


    Creation of Raw Promises


    You can use “Q.defer” for the purpose of the creation of raw promises. Suppose
    that we want to make “fs.readFile” be promise-aware by wrapping it. This can be
    done as shown below:


    function fs_rFile (file, encoding) {


         var deferred = Q.defer()


    fs.readFile(file, encoding, function (error, data) {


    if (error) deferred.reject(error) // rejecting the promise with `error` as the
    reason


    else deferred.resolve(d) // fulfilling the promise with the `d` as the value


    })


    return deferred.promise // the promise will be returned


    }


    fs_rFile(''file.txt'').then(console.log, console.error)


    One can also make APIs which can support both APIs and callbacks. You are now
    aware of how a callback code can be turned into a promise code. APIs can be developed
    which can be used for provision of an interface for both callback and promise.
    An example is when we want to turn the “fs.readFile” into an API which can support
    both promises and callbacks. This can easily be done. The code given below demonstrates
    how this can be done in Node:


    function fs_rFile (file, encoding, callback) {


    var deferred = Q.defer()


    fs.readFile(function (error, d) {


    if (error) deferred.reject(error) // rejecting the promise with the `error` as
    the reason


    else deferred.resolve(d) // fulfilling the promise with the`d` as the value


    })


    return deferred.promise.nodeify(callback) // the promise will be returned


    }


    Once a callback has been provided, the standard Node arguments style is used for
    calling it once the promise has been resolved or rejected. The standard Node style
    arguments are of the form (err, result). An example of this is shown below:


    fs_rFile(''file.txt'', ''utf8'', function (error, data) {


    // ...


    })'
