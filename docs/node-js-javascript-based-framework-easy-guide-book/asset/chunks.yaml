  trans: "\n\n大多数采用 Node 回调风格的函数都可以轻松地封装在 promise 中。任何接收 Node 风格回调且仅调用一次回调的回调函数，都是封装的候选对象。考虑下面的函数，它演示了如何实现这一操作：\n\
    \n```javascript\nfunction myFunction(nodeAsyncFn, context) {\n  return function()\
    \ {\n    var defer = q.defer()\n      , args = Array.prototype.slice.call(arguments);\n\
    \    args.push(function(error, value) {\n      if (error !== null) {\n       \
    \ return defer.reject(error);\n      }\n      return defer.resolve(value);\n \
    \   });\n    nodeAsyncFn.apply(context || {}, args);\n    return defer.promise;\n\
    \  };\n};\n```\n\n上面的函数可以与其他 Node 函数（如 `fs.readFile`）一起使用，如下所示：\n\n```javascript\n\
    var rFile = promisify(fs.readFile);\n\nreadFile('file.txt').then(function(d) {\n\
    \  console.log(d);\n});\n```\n\n通过 PromisedIO 和 `Q`，可以提供用于调用或包装 Node 风格函数的工具函数。如下所示：\n\
    \n```javascript\nvar rFile = q.convertNodeAsyncFunction(fs.readFile);\n\nreadFile('file.txt')\n\
    .then(function (d) { });\n\n// 或者\n\nq.execute(fs.readFile, 'file.txt')\n.then(function\
    \ (d) { });\n```\n\n上面的案例展示了如何使用 `PromisedIO` 来。当使用 `Q` 时，可以如下所示操作：\n\n```javascript\n\
    var rFile = q.node(fs.readFile);\n\nreadFile('file.txt')\n.then(function (d) {\
    \ });\n\n// 或者\n\nq.ncall(fs.readFile, fs, 'file.txt')\n.then(function (d) { });\n\
    \n// 或者\n\nvar deferred = q.defer();\n\nfs.readFile('file.txt', deferred.node());\n\
    \nreturn deferred.promise;\n```\n\n# 第 5 章 - 管理 Node.js 回调地狱 (callback Hell)\n\
    \n考虑下面的代码：\n\n```javascript\ndoAsync1(function () {\n  doAsync2(function () {\n\
    \    doAsync3(function () {\n      doAsync4(function () {\n      })\n    })\n\
    \  })\n})\n```\n\n这就是回调地狱。。在处理回调地狱时，你必须知道它是主观的。其原因在于，当使用深度嵌套的代码时，它可能运行得良好。在异步代码中，当流程管理变得过于复杂时，问题就会变得像地狱一样。为了让你知道自己正在经历怎样的地狱，请考虑你需要进行的重构工作。\n\
    \n我们想通过一个示例来演示这一点。考虑一种情况：我们感兴趣查找特定目录中最大的文件。下面提供的模块可以用于此操作：\n\n```javascript\n\
    var fLargest = require('./findLargest')\n\nfLargest('./path/to/dir', function\
    \ (error, filename) {\n  if (error) return console.error(error)\n  console.log('The\
    \ largest file is:', filename)\n})\n```\n\n可以遵循以下步骤来实现上述所需工作：\n\n*   读取提供目录中的所有可用文件。\n\
    *   获取目录中每个可用文件的状态 (statics)。\n*   在可用文件中确定最大的文件（如果有多个大小相同的文件，只需任选其一）。\n*   使用最大文件的名称进行回调。\n\
    \n如果在过程中的任何点产生错误，应通过该错误完成回调。同样，回调不应调用超过一次。\n\n## 嵌套方法\n\n首先，我们应该使用嵌套方法来处理。下面是一个如何实现此点的示例：\n\
    \n```javascript\nvar fs = require('fs')\nvar path = require('path')\nmodule.exports\
    \ = function (direct, callb) {\n  fs.readdir(direct, function (error, files) {\
    \ // [1]\n    if (error) return callb(error)\n    var counter = files.length\n\
    \    var errored = false\n    var statistics = []\n    files.forEach(function\
    \ (file, index) {\n      fs.stat(path.join(direct,file), function (error, stat)\
    \ { // [2]\n        if (errored) return\n        if (error) {\n          errored\
    \ = true\n          return callb(error)\n        }\n        statistics[index]\
    \ = stat // [3]\n        if (--counter == 0) { // [4]\n          var largest =\
    \ statistics\n            .filter(function (statistic) { return statistic.isFile()\
    \ }) // [5]\n            .reduce(function (prev, next) { // [6]\n            \
    \  if (prev.size > next.size) return prev\n              return next\n       \
    \     })\n          callb(null, files[statistics.indexOf(largest)]) // [7]\n \
    \       }\n      })\n    })\n  })\n}\n```\n\n## 异步方法\n\n该模块被广泛使用，它将采取 node 执行操作时采取的方式。async\
    \ 模块可以如下所示的使用：\n\n```javascript\nvar fs = require('fs')\nvar async = require('async')\n\
    var path = require('path')\nmodule.exports = function (diretory, callb) {\n  async.waterfall([\
    \ // [1]\n    function (next) {\n      fs.readdir(directory, next)\n    },\n \
    \   function (files, next) {\n      var paths =\n      files.map(function (file)\
    \ { return path.join(directory,file) })\n      async.map(paths, fs.stat, function\
    \ (error, statistics) { // [2]\n        next(error, files, statistics)\n     \
    \ })\n    },\n    function (files, statistics, next) {\n      var largest = statistics\n\
    \        .filter(function (statistic) { return statistic.isFile() })\n       \
    \ .reduce(function (prev, next) {\n          if (prev.size > next.size) return\
    \ prev\n          return next\n        })\n      next(null, files[statistics.indexOf(largest)])\n\
    \    }\n  ], callb) // [3]\n}\n```\n\n"
- fmt: '

    With the function `async.map(https://github.com/caolan/async#maparr-iterator-callback)`,
    we will be in a position to run `fs.stat` in parallel, and these will call back
    with an array having the results. You have also spotted the function `callb`.
    This will be called in case an error occurs along the way, or once the last step
    has been completed. The calling will be done only once.


    With the `async` module, there will be a guarantee that only one of the callbacks
    will be fired. It is also good in propagation of errors and management of parallelism
    on our behalf.


    A promises approach


    With promises in NodeJS, one is provided with functional programming and error
    handling perks. I know you are wondering how that can achieve any use of promises.
    Let us use the `Q` module so as to show how this can be implemented. This is shown
    below:


    ```javascript

    var fs = require(''fs'')


    var path = require(''path'')


    var Q = require(''q'')


    var fs_readdirectory = Q.denodeify(fs.readdir) // [1]


    var fs_statistic = Q.denodeify(fs.statistic)


    module.exports = function (directory) {


    return fs_readdir(directory)

    .then(function (files) {


    var promises = files.map(function (file) {


    return fs_stat(path.join(directory,file))


    })


    return Q.all(promises).then(function (statistics) { // [2]


    return [files, statistics] // [3]


    })


    })

    .then(function (data) { // [4]


    var files = data[0]


    var statistics = data[1]


    var largest = statistics

    .filter(function (statistic) { return statistic.isFile() })

    .reduce(function (prev, next) {


    if (prev.size > next.size) return prev

    return next

    })


    return files[statistics.indexOf(largest)]

    })

    }

    ```


    Note that the core functionality of Node is not aware of promise, but we can make
    it to be so. The statistics alls will be run in parallel by the `Q.all`, and the
    order of the resulting array will be maintained. Our aim is to pass our files
    and the statistics to our `next` function, and this will be the last thing to
    be returned. Note that any of the exceptions which will be thrown inside the promise
    object will be caught, unlike what we have had in our previous examples. The API
    for the client will also be modified so that it becomes promise centric. This
    is shown below:


    ```javascript

    var fLargest = require(''./findLargest'')


    fLargest(''./path/to/directory'')

    .then(function (fname) {


    console.log(''The largest file is:'', fname)

    })

    .catch(console.error)

    ```


    From the design shown above, you don’t have to expose a promise interface in this
    case. With most promise libraries, a mechanism is provided on which we can expose
    a style for the nodeback.


    A generators approach


    Generators are just lightweight co-routines which can be used in JavaScript. With
    these, one can use the `yield` keyword so as to suspend and then resume a particular
    function. The functions for generators make use of a special syntax which looks
    like `function*()`. Asynchronous operations can also be suspended and resumed
    by use of objects such as the thunks or promises, and this can lead to asynchronous
    code which looks as if it is synchronous. A thunk is just a function which will
    return a callback other than calling it. The callback in this case will have a
    similar signature to the typical nodeback function, meaning that the error will
    form the first argument.


    We need to create an example which will demonstrate how generators can be used
    for the purpose of asynchronous flow control. This is how it can be done:


    ```javascript

    var c = require(''co'')


    var thunk = require(''thunkify'')


    var fs = require(''fs'')


    var path = require(''path'')


    var readdirectory = thunk(fs.readdirectory) [1]


    var statistic = thunk(fs.statistic)


    module.exports = c(function* (directory) { // [2]


    var files = yield readdiretory(directory) // [3]


    var statistics = yield files.map(function (myfile) { // [4]


    return statistic(path.join(diretory,file))

    })


    var largest = statistics

    .filter(function (statistic) { return statistic.isFile() })

    .reduce(function (prev, next) {


    if (prev.size > next.size) return prev

    return next

    })


    return files[statistics.indexOf(largest)] // [5]

    })

    ```


    The Node core functionality is not aware of thunk, but we should make it be so.
    With the variable `c`, we will take a generator function in which we will be in
    a position to use the `yield` keyword so as to suspend it. The generator function
    will be suspended until the `readdiretory` has been returned. The value which
    results from this will then be returned from the `files` variable. The variable
    `c` can also handle arrays which a set of parallel operations will perform. The
    resulting array whose order is maintained will be assigned to the variable `statistics`.
    It is after this that the final result will be returned.


    This generator function can also be consumed using the same callback API which
    we had specified at the beginning of this chapter. With the `c`, appropriate error
    handling mechanisms will be implemented and any resulting errors including exceptions
    raised will be passed to our callback function. Around the statement for yield,
    generators allow us to use the common `try/catch` block or statement for the purpose
    of handling errors and exceptions. This is shown in the example given below:


    ```javascript

    try {


    var files = yield readdirectory(directory)


    } catch (error) {


    console.error(''something went wrong while reading the directory'')

    }

    ```


    Co provides us with a mechanism on how arrays, nested generators, objects, promises,
    and others can be handled. Other generator modules are also coming as they are
    under implementation. With the `Q` module, there is a method named `Q.async(https://github.com/kriskowal/q/wiki/API-Reference#qasyncgeneratorfunction)`
    which will behave in a similar to the co which uses generators.


    Wrapping up


    There are methods which can help you get control over how your application flows.
    The generator idea is one of the available ways how this can be done. With the
    modular approach, one can apply it to whichever flow libraries that they are using.
    Examples of flow libraries include the async, promises, and generators.


    # Chapter 6- Promise Methods


    With most promise objects, we usually have the static counterparts in the main
    objet which is `Q`, and this usually accepts either a promise or a non-promise
    object and a fulfilled promise will then be created first. With all others, you
    will have static counterparts which will be named similarly to the promise object.


    With some methods, the used names should be the same as the keywords which are
    reserved in JavaScript. Examples of these include the `try`, `catch`, and `finally`.
    With this, a very clear parallel between the asynchronous promise operations and
    the standard synchronous language constructs will be shown.


    Main promise methods


    #### promise.then(onFulfilled, onRejected, onProgress)


    This is just the `then` method having some additional progress handler.


    Callbacks to promises


    Consider the asynchronous Node callback shown below:


    ```javascript

    readFile(function (error, data) {


    if (error) return console.error(error)


    console.log(data)

    })

    ```


    In case the function `readFile` has returned to us a promise, then we could have
    done this:


    ```javascript

    var p = readFile()


    p.then(console.log, console.error)

    ```


    When you look at it shallowly, you will see that we have changed only the aesthetic.
    However, at this moment, we have a value which can be used for representation
    of the asynchronous operation which is the promise. The promise can then be passed
    around, and any person having access to the promise will be able to consume it
    by use of `then`, independent of whether or not the asynchronous operation has
    completed. We are somehow guaranteed that our asynchronous operation will not
    change since the promise will be resolved for only once, meaning that it can either
    be fulfilled or rejected.

