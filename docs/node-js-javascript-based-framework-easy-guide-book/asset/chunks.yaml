  trans: "\nPromises 也可以用于执行并行操作。你现在已经了解了 Node.JS 中顺序异步操作是如何运行的。当使用 `Q` 模块来处理并行操作时，我们使用\
    \ `Q.all` 方法。该方法通常接收一个 promise 数组，然后返回一个它创建的新的 promise。一旦所有必要的操作都成功完成，这个新的 promise\
    \ 就会完成完成。如果单个或多个操作失败或运行不成功，则新的 promise 将被拒绝。下面是一个示例：\n\n```javascript\nvar aPromise\
    \ = Q.all([ fs_rFile('myfile1.txt'), fs_readFile('myfile2.txt') ])\n\naPromise.then(console.log,\
    \ console.error)\n```\n\n这就是实现方法。你还应该意识到，promise 的功能模拟了函数。函数始终有一个返回值。而使用 promise，在异步部分具有高度的一致性。为了将结果扩展到多个参数中，可以使用\
    \ `[Q.spread](https://github.com/kriskowal/q#combination)`。\n\n# 第 7 章- 单进程中执行多个实例\n\
    \nNode 经常被要求集成到其他应用程序中。例如，当我们需要将它与其他事件循环集成，并为 Node 支持多个执行上下文时。当我们谈论同一个上下文时，我们的意思是能够在同一个应用程序中和平存在多个\
    \ Node 实例的能力。\n\n目前，使用 Node `v0.12`，可以在同一个事件循环中使用多个执行上下文。Node 内部也应该意识到多个执行上下文的存在。考虑下面提供的示例，它展示了如何实现：\n\
    \n```javascript\nfunction myconnect() {\n  this.write('GET / HTTP/1.1\\r\\n' +\n\
    \  'Host: strongloop.com\\r\\n' +\n  '\\r\\n');\n  this.pipe(process.stdout);\n\
    }\n\nrequire('net').connect(80, 'strongloop.com', myconnect);\n```\n\n从执行角度来看，过程如下：\n\
    \n```\n<enter VM>\nconnect(80, 'strongloop.com'); // 内核在此报告 EINPROGRESS\n<leave\
    \ VM>\n<等待 TCP 握手完成>\n<enter VM>\nmyconnect();\n<leave vm>\n```\n\n执行上下文可以在我们对\
    \ vm 的调用之间发生变化。这就是为什么 `connect()` 函数必须记住当前上下文，而对 `myconnect()` 的调用应该恢复它的原因。如果你未能做到这一点，你可能会发现很难追踪你程序中任何存在的\
    \ bug。\n\n然而，在 Node 中，这会被自动处理。这意味着你不需要担心这个问题。\n\n对于那些需要插件作者且你需要制作插件的人，请注意上下文，可以如下所示进行：\n\
    \n*   不要使用 `NODE_MODULE()`，而是使用 `NODE_MODULE_CONTEXT_AWARE()`。之前：\n\n```cpp\n\
    void Initialize(v8::Handle<v8::Object> exports) {\n  // ...\n}\nNODE_MODULE(test,\
    \ Initialize)\n```\n\n之后，按照如下方式操作：\n\n```cpp\nvoid Initialize(v8::Handle<v8::Object>\
    \ exports,\n  v8::Handle<v8::Value> module,\n  v8::Handle<v8::Context> context)\
    \ {\n  // ...\n}\n```\n\n执行上下文可以在我们对 vm 的调用之间发生变化。这就是为什么 `connect()` 函数必须记住当前上下文，而对\
    \ `myconnect()` 的调用应该恢复它的原因。如果你未能做到这一点，你可能会发现很难追踪你程序中任何存在的 bug。\n\n`[Q.spread](https://github.com/kriskowal/q#combination)`\
    \ 用于将结果扩展到多个参数中。\n"
- fmt: "\nSecond, when the `update` method is being called from the code, the setting\
    \ of the flag can be done in the options object as shown below:\n\n```javascript\n\
    User.updateAll(\n  { name: 'Joel' },\n  { '$rename': { name: 'fname' }},\n  {\
    \ allowExtendedOperators: true }\n);\n```\n\n# Chapter 9- Event Loop Monitoring\n\
    \nWith the event loop in Node, we are given the capability of handling highly\
    \ concurrent requests while at the same time running the requests which are single-threaded.\
    \ The processing is delegated to the operating system itself, and this is done\
    \ via the POSIX interface as the new callbacks and events are still being handled.\n\
    \n## Blocking an event loop\n\nWhen this is done in a Node application, it can\
    \ lead to catastrophic effects. We will demonstrate how the blocking can be done\
    \ by external events.\n\nWith a function call, blocking is said to have occurred\
    \ when the flow of the current execution of the thread waits until we have the\
    \ function finished before being executed. Most people see the “I/O” as blocking.\
    \ An example is when you are calling the function `socket.read()`. The program\
    \ will have to wait for our call to end so as to continue. This is what you may\
    \ need to perform with a return value.\n\nNote that in Node, a function calling\
    \ a CPU work will always block. Consider the `fibonacci` function shown below,\
    \ which will block the execution of the thread as per current since it needs to\
    \ use the CPU. Here is the function:\n\n```javascript\nfunction fibonacci (j)\
    \ {\n  if (j < 2)\n    return 1;\n  else\n    return fibonacci(j-2) + fibonacci(j-1);\n\
    }\n```\n\nIn Node, we do not create servers for Fibonacci. However, sometimes,\
    \ the Node becomes CPU bound. Consider the example given below:\n\n```javascript\n\
    function requestHandler(request, response) {\n  var body = request.rawBody; //\
    \ has the POST body\n  try {\n    var json = JSON.parse(body);\n    response.end(json.user.username);\n\
    \  }\n  catch(ex) {\n    response.end(\"FAIL\");\n  }\n}\n```\n\nWith the above\
    \ example, the body of the request will be taken and then parsed on. The flow\
    \ of this should run very well until one has executed a file which is worth 15MB.\
    \ When the call `JSON.parse()` has been executed on 15MB file, the processing\
    \ will take around 1.5 seconds.\n\nFor those who are in need of monitoring concurrent\
    \ connections, you can use the [StrongLoop Arc](https://strongloop.com/node-js/build-deploy-and-scale/).\
    \ It will also enable you to monitor the throughput of your Node applications\
    \ that you have created.\n\n# Conclusion\n\nIt can be concluded that NodeJS is\
    \ a very useful and very powerful library which provides an assist in the development\
    \ of web applications. The framework is well known for its apps, which are highly\
    \ scalable in terms of size and performance. This is why it is highly used in\
    \ the development of network applications in which high scalability is needed.\n\
    \nThe framework is event-driven and asynchronous, and was built on top of the\
    \ JavaScript engine for Chrome. JavaScript developers and experts usually find\
    \ it easy for them to learn how to use the Node since they are loosely related.\
    \ In fact, Node is based on JavaScript since it is one of its available libraries.\n\
    \nIn Node, your programs will not be forced to wait for certain operations to\
    \ be completed. As you wait for the response to be available to you, you can continue\
    \ in performing other tasks. This is because Node is a non-blocking JavaScript\
    \ blocking and can support concurrent operations to be executed. Most of you are\
    \ aware of the concept of buffering of data in which it is stored in a type of\
    \ memory named buffer for quick and easy access. In Node, this type of memory\
    \ or the process is not supported at all. What happens is that the data is provided\
    \ or output to the user in the form of chunk-by-chunk.\n\nThe framework has great\
    \ features, which explains the reason behind its increased popularity among web\
    \ developers. When compared to related frameworks or the ones which can supplement\
    \ it, it is more popular. An example of such a framework is the Ruby on rails.\
    \ The framework has numerous modules which can be used for the purpose of accomplishing\
    \ different tasks in one’s app. It will be good for you to learn how to use this\
    \ framework so as to get assistance in your process of development. This book\
    \ is an excellent guide for you.\n"
