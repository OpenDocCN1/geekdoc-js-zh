  trans: '

    通过 `async.map(https://github.com/caolan/async#maparr-iterator-callback)` 函数，我们能够并行运行
    `fs.stat`，这些操作将通过一个包含结果的数组进行回调。你还注意到了 `callb` 函数。当过程中发生错误或最后一步完成后，该函数将被调用。且该调用只会执行一次。


    使用 `async` 模块，可以保证只有一个回调函数会被触发。它在错误传播和代表我们管理并行性方面也很有用。


    一种基于 Promise（承诺）的方法


    在 NodeJS 中使用 Promise，可以获得函数式编程和错误处理方面的优势。我知道你可能在好奇如何实现任何 Promise 的用途。让我们使用 `Q`
    模块来展示如何实现它。如下所示：


    ```javascript

    var fs = require(''fs'')


    var path = require(''path'')


    var Q = require(''q'')


    var fs_readdirectory = Q.denodeify(fs.readdir) // [1]


    var fs_statistic = Q.denodeify(fs.statistic)


    module.exports = function (directory) {


    return fs_readdir(directory)

    .then(function (files) {


    var promises = files.map(function (file) {


    return fs_stat(path.join(directory,file))


    })


    return Q.all(promises).then(function (statistics) { // [2]


    return [files, statistics] // [3]


    })


    })

    .then(function (data) { // [4]


    var files = data[0]


    var statistics = data[1]


    var largest = statistics

    .filter(function (statistic) { return statistic.isFile() })

    .reduce(function (prev, next) {


    if (prev.size > next.size) return prev

    return next

    })


    return files[statistics.indexOf(largest)]

    })

    }

    ```


    注意，Node 的核心功能并不感知 Promise，但我们可以让它感知。所有的统计操作都将通过 `Q.all` 并行运行，并且结果数组的顺序将保持。我们的目标是将文件和统计信息传递给我们的
    `next` 函数，这将是最后返回的内容。注意，在 Promise 对象内部抛出的任何异常都将被捕获，这与我们之前的示例不同。客户端的 API 也将被修改，以变得以
    Promise 为中心。如下所示：


    ```javascript

    var fLargest = require(''./findLargest'')


    fLargest(''./path/to/directory'')

    .then(function (fname) {


    console.log(''The largest file is:'', fname)

    })

    .catch(console.error)

    ```


    从上面的设计中可以看出，在这种情况下你不需要暴露一个 Promise 接口。对于大多数 Promise 库，都提供了一种机制，让我们能够暴露一种 Node
    回调风格。


    一种基于生成器（Generators）的方法


    生成器只是在 JavaScript 中使用的轻量级协程。通过这些，人们可以使用 `yield` 关键字来挂起然后恢复特定的函数。生成器函数使用一种看起来像
    `function*()` 的特殊语法。异步操作也可以通过使用 thunk（unk）或 Promise 等对象被挂起和恢复，这可以导致看起来像同步代码的异步代码。Thunk
    只是一个函数，它在被调用时会返回一个回调函数。在这种情况下，回调的签名与典型的 Node 回调函数相似，这意味着错误将作为第一个参数。


    我们需要创建一个示例，演示如何将生成器用于异步流控制。实现方法如下：


    ```javascript

    var c = require(''co'')


    var thunk = require(''thunkify'')


    var fs = require(''fs'')


    var path = require(''path'')


    var readdirectory = thunk(fs.readdirectory) [1]


    var statistic = thunk(fs.statistic)


    module.exports = c(function* (directory) { // [2]


    var files = yield readdiretory(directory) // [3]


    var statistics = yield files.map(function (myfile) { // [4]


    return statistic(path.join(diretory,file))

    })


    var largest = statistics

    .filter(function (statistic) { return statistic.isFile() })

    .reduce(function (prev, next) {


    if (prev.size > next.size) return prev

    return next

    })


    return files[statistics.indexOf(largest)] // [5]

    })

    ```


    Node 核心功能并不感知 thunk，但我们应该让它感知。通过变量 `c`，我们将接收一个生成器函数，其中可以使用 `yield` 关键字来挂起它。生成器函数将一直挂起直到
    `readdiretory` 返回。由此产生的结果将从 `files` 变量返回。变量 `c` 还可以处理一组并行操作将执行的数组。顺序保持的结果数组将赋值给变量
    `statistics`。在此之后，将返回最终结果。


    该生成器函数也可以使用我们在本章开头指定的相同回调 API 进行消费。通过 `c`，将实现适当错误处理机制，任何产生的错误（包括抛出的异常）都将传递给我们的回调函数。在
    `yield` 语句周围，生成器允许我们使用常用的 `try/catch` 块或语句来处理错误和异常。底部的示例所示：


    ```javascript

    try {


    var files = yield readdirectory(directory)


    } catch (error) {


    console.error(''something went wrong while reading the directory'')

    }

    ```


    Co 为我们提供了一种如何处理数组、嵌套生成器、对象、Promise 等的机制。其他生成器模块也随着实现不断出现。通过 `Q` 模块，有一个名为 `Q.async(https://github.com/kriskowal/q/wiki/API-Reference#qasyncgeneratorfunction)`
    的方法，其行为与使用生成器的 `co` 类似。


    总结


    有很多方法可以帮助你控制应用程序的流转。生成器思想是实现此点的可用方法之一。通过模块化方法，人们可以应用于他们正在使用的任何流控制库。流控制库的示例包括 async、promises
    和 generators。


    # 第 6 章 - Promise 方法


    对于大多数 Promise 对象，我们通常在主对象 `Q` 中有其静态对应方法，该方法通常接受 Promise 对象或非 Promise 对象，然后会先创建一个已就绪（fulfilled）的
    Promise。对于其他所有，你将拥有与 Promise 对象命名类似的静态对应方法。


    对于某些方法，使用的名称与 JavaScript 中的保留关键字相同。这些示例包括 `try`、`catch` 和 `finally`。通过这种，将展示异步
    Promise 操作与标准语言构造之间的清晰并行关系。


    主要的 Promise 方法


    #### promise.then(onFulfilled, onRejected, onProgress)


    这只是带有额外进度处理器的 `then` 方法。


    回调转 Promise


    考虑下面的异步 Node 回调：


    ```javascript

    readFile(function (error, data) {


    if (error) return console.error(error)


    console.log(data)

    })

    ```


    如果 `readFile` 函数向我们返回了一个 Promise，那么我们可以这样做：


    ```javascript

    var p = readFile()


    p.then(console.log, console.error)

    ```


    当你浅层地观察时，你会发现我们只改变了外观。然而，在此时我们拥有了一个可以用于表示异步操作的值，即 Promise。该 Promise 然后可以被传递，任何访问该
    Promise 的人无论异步操作是否完成，都可以通过 `then` 来消费它。我们以某种方式保证了异步操作不会改变，因为 Promise 只会被解析一次，这意味着它要么被就绪（fulfilled），要么被拒绝（rejected）。

