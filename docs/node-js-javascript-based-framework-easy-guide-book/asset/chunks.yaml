    \ available bugs in your program.\n\n`[Q.spread](https://github.com/kriskowal/q#combination)`\
    \ is used for spreading results into multiple arguments.\n"
  raw: 'Promises can also be used for the purpose of performing parallel operations.
    You are now aware of how sequential asynchronous operations operate in Node.JS.
    When using the Q module so as to deal with parallel operations, we use the method
    “Q.all.” This method usually takes in an array of promises, but then it returns
    a new promise which it creates. Once all of the necessary operations have been
    completed in a successful manner, then the new promise will be completed. In case
    single or multiple operations fail or run unsuccessfully, then the new promise
    will be rejected. An example of this is shown below:


    var aPromise = Q.all([ fs_rFile(''myfile1.txt''), fs_readFile(''myfile2.txt'')
    ])


    aPromise.then(console.log, console.error)


    That is how it can be done. You should also be aware that the functionality of
    promises mimics that of functions. A function always has a single return value.
    With promises, there is much consistency with the asynchronous parts. For the
    purpose of spreading results into multiple arguments, one can use the “[Q.spread](https://github.com/kriskowal/q#combination).”


    # Chapter 7- Execution of Multiple Instances in a Single Process


    There is a frequent request for Node to be integrated with other applications.
    An example is when we need to integrate it with the other event loops and support
    multiple execution contexts for the Node. When we talk of the same context, we
    mean the ability to have multiple instances of Node existing peacefully in the
    same application.


    Currently, with Node v0.12, multiple execution contexts can be used within the
    same event loop. The Node internals should also be made aware of the presence
    of multiple execution contexts. Consider the example given below, showing how
    this can be done:


    function myconnect() {


    this.write(''GET / HTTP/1.1\r\n'' +


    ''Host: strongloop.com\r\n'' +


    ''\r\n'');


    this.pipe(process.stdout);


    }


    require(''net'').connect(80, ''strongloop.com'', myconnect);


    When looked at execution-wise, it will be as follows:


    <enter VM>


    connect(80, ''strongloop.com''); // kernel reporting EINPROGRESS here


    <leave VM>


    <wait for the TCP handshake to complete>


    <enter VM>


    myconnect();


    <leave vm>


    The execution context can change between our calls to the vm. This is why the
    function “connect()” has to remember the current context and the call to “myconnect()”
    should restore it. If you fail to do this, you might find it really hard for you
    to track any available bugs in your program.


    However, with Node, this is automatically taken care of. This means that you don’t
    have to worry about it.


    For those who need an add-on author and you need to make the addon, be aware of
    context, it can be done as follows:


    * Instead of NODE_MODULE(), use the NODE_MODULE_CONTEXT_AWARE(). Before:


    void Initialize(v8::Handle<v8::Object> exports) {


    // ...


    }


    NODE_MODULE(test, Initialize)


    For after, do it as follows:


    void Initialize(v8::Handle<v8::Object> exports,


    v8::Handle<v8::Value> module,


    v8::Handle<v8::Context> context) {


    // ...


    }


    NODE_MODULE_CONTEXT_AWARE(test, Initialize);


    The context-aware initialize will be called once for each context which has been
    created by the embedder. There exists no per-context cleanup context. The function
    “[node::AtExit()](https://github.com/joyent/node/blob/15de8c2/src/node.h#L320)”
    is currently a per-process event, but we need it to fill up the above role. The
    global variables can also be turned into per-context properties.


    # Chapter 8- [LoopBack Node.js Framework](https://strongloop.com/strongblog/whats-new-in-the-loopback-node-js-framework-july-august-2015/)


    The LoopBack is just an open-source project which can welcome contributions.


    Loopback-component-explorer


    The loopback-explorer was renamed to “loopback-component-explorer.” The reason
    behind this is that it is now a full-fledged loopback component. The version 2.0.0
    of the module was released, which has two breaking changes.


    Since it is a loopback component, it can be loaded and configured via the “server/component-config.json”
    as shown below:


    // server/component-config.json


    {


    "loopback-component-explorer": {


    "mountPath": "/explorer"


    }


    }


    For the migration from the 1.x version range to be simplified, a middleware should
    be provided, and this should be mountable in any Express application in the same
    way. An example of this is shown below:


    var explorer = require(''loopback-component-explorer'');


    // v1.x - will not work anymore


    application.use(''/explorer'', explorer(applicTION, options));


    // v2.x


    application.use(''/explorer'', explorer.routes(application, options));


    Note that the use of “component-config.json” so as to load components is a new
    feature. Its documentation is expected to be released very soon.


    Loopback core


    With all the user models and the methods for applications, the promise-based invocation
    can be supported,   as well as the callback-based calls. Methods which are related
    to replication such as the “PersistedModel.replicate” can also support promises.


    A filter which is method-based can also be specified for the middleware. Consider
    the example given below, which shows some specified limits for the middleware
    to get   only the requests. Here is the code for the example:


    // server/middleware.json


    {


    "auth": {


    "my-middleware": {


    "methods": ["GET"],


    "params": ["argument1", "argument2"],


    "enabled": true


    }


    }


    }


    A wrapper has also been implemented around the middleware errorhandler for express.
    The wrapper will add a configuration option for excluding error stack traces from
    the HTTP responses. Consider the typical configuration shown below for disabling
    the stack traces when it is being executed in a production environment. Here is
    the example:


    // server/middleware.json


    {


    "final:after": {


    "loopback#errorHandler": {}


    }


    }


    // server/middleware.production.json


    {


    "final:after": {


    "loopback#errorHandler": {


    "params": {


    "includeStack": false


    }


    }


    }


    }


    The loopback-datasource-juggler


    A support for assisting when querying embedded models was added together with
    the array values for MongoDB whenever the memory connector is being used. Consider
    the example given below, which shows the new querying capabilities introduced
    in Node:


    // common/models/file.json


    {


    "properties": {


    "name": "string",


    "sons": ["string"],


    "friends": [{ "name": "string" }]


    }


    }


    If you are in need of finding the people who have a son named “John,” then the
    following query can be used:


    File.find({ where: { son: "John" } })


    That is how the query can be written. Suppose you are in need of finding the people
    who have a friend with the name “Joel.” The query can be formulated as shown below:


    File.find({ where: { "friends.name": "Joel" } })


    The support for the query “RegExp” was also introduced and supported for use in
    queries.


    Consider a situation in which you want a person whose name starts with a particular
    letter, such as “N.” The query for this can be formulated as shown below:


    File.find({ where: { regexp: /^N/ } })


    That is how the query should be formulated. If more than one person has a name
    starting with the letter “N,” then all of them will be shown in the output or
    the result after executing the query.


    Other than the memory connector, there are some other connectors which are supported
    by the operator “RegExp.” These include the following:


    *   PostgreSQL


    *   MongoDB


    *   MySQL


    *   MS SQL


    Lastly, in all the model-discovery methods, support for promises was added. 


    The loopback-connector-mongodb


    The flag “allowExtendedOperators” was recently implemented. When this flag has
    been enabled, the data for update operations will include the MongoDB operators
    such as the “$rename.”


    There are two ways  how this flag can be enabled.


    First, if the file for the model definition has the property “settings.mongodb.allowExtendedOperators”
    having been set to “true” as shown in the example given below:


    {


    "name": "MyModel",


    "settings": {


    "mongodb": {


    "allowExtendedOperators": true'
