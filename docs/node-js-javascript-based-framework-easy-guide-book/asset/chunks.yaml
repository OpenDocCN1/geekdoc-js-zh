    # Introduction


    NodeJS is a very useful framework. It can assist you in the development of network
    applications which are highly scalable. It is also good for web development. If
    you are a JavaScript expert, then it will be easy for you to learn Node. This
    book has simplified the process of learning Node.JS.


    # Chapter 1- A Brief Overview


    NodeJS was developed for the purpose of helping programmers in the development
    of network applications which are scalable. It is an event-driven and asynchronous
    framework which was built on top of the JavaScript engine for Chrome. For you
    to master how to use it well, you should be good in JavaScript. It is good for
    the development of web applications. Due to its non-blocking mode of operation,
    the programs are not forced to wait for the others to be executed, but a callback
    is just made. As you wait for a response in Node, you are allowed to continue
    with performing other tasks. All of the Node libraries have been designed so that
    they can operate in a non-blocking mode.


    The data for a node application is not buffered at all in the memory. Instead,
    this data is output by means of chunk-by-chunk. Due to its features, it has demonstrated
    a great difference between it and other related frameworks and hence its increasing
    popularity.


    # Chapter 2- Management of Module Dependencies


    Some applications are very dependent on the number of NPM modules that are to
    be used. These can then be specified in the file “package.json” as shown below:


    "dependencies": {


          "express": "2.3.12",


          "jade": ">= 0.0.1",


          "redis":   "0.6.0"


    }


    Once you have done that,  every time that you need your project to be  fresh,
    the dependencies will have to be sorted out as shown below:


    $ npm install


    With this, one is allowed to either specify a specific version of the module or
    the minimum module that they need to use. This can be done by using the symbol
    “>=” so as to prefix the number.


    Sometimes, you might have some dependencies which are related to development.
    You may not want to have these dependencies in the production, and these can be
    specified by the use of the property “devDependencies.” This is shown in the example
    given below:


    "devDependencies": {


           "vows": ">= 0.4.x"


    }


    Our production by the use of “npm install –production” will make sure that the
    dependency is not installed. If you are working on a private module, the property
    “private": true” can be added to the file “package.json” so that the module is
    not accidentally published to the NPM registry.


    For those who are in need of hosting their module in a private git repository,
    but who still have a need for it to be bundled as a dependency in the project,
    this can be done as follows:


    "dependencies": {


        "secret-module": "git+ssh://git@github.com:username/secret-repo.git#v2.3"


    }


    The last part shown above having the URL has been used to specify the tag which
    is to be used. A branch name or a commit hash can also be specified.


    # Chapter 3- Require and Exports


    Consider a NodeJS file having the content given below:


    var p = 10;


    var addP = function(value) {


        return value + p;


    };


    When we are in  another file, it will be impossible for us to access the variable
    “p” or the function “addP.” However, the reason behind this is not the use of
    the keyword “var.” Note that a module is the fundamental building block of a file
    in NodeJS, and it is used for mapping to the file directly. In the above module,
    everything has been made private. However, when programming in Node, we don’t
    want things to be accessible or visible only in the current file but from other
    files.


    Before we can explore how a particular module can be exposed, it will be good
    for us to know how a particular module is loaded. The “require” function is used
    in this case. It is used for the purpose of loading a particular module, and the
    return value for this has to be assigned to a particular variable. This is shown
    below:


    var myVar = require(''./misc'');


    If our module is not intended to expose anything to the other modules or files,
    then the above will not be very important or useful. For the things to be exposed,
    we use “module.exports,” and anything that we need to expose will be exposed.
    This is shown in the code given below:


    var p = 8;


    var addP = function(value) {


        return value + p;


    };


    module.exports.p = p;


    module.exports.addP = addP;


    The module which has been loaded can then be used as shown below:


    var myVar = require(''./misc'');


    console.log("Addition of %d to 10 will gives us %d", myVar.p, myVar.addP(10));


    Alternatively, the contents of a module can be exposed as shown below:


    var MyUser = function(name, email) {


        this.name = name;


        this.email = email;


    };


    module.exports = MyUser;


    As shown above, the difference may seem to be very minor, but at the same time
    very important. The exportation of the user has been done indirectly without having
    to perform any indirection. The difference between:


    module.exports.MyUser = MyUser;


    //v.s


    module.exports = MyUser;


    is just about the use as shown below:


    var myuser = require(''./user'');


    var user = new user.User();


    //v.s


    var user = new user();


    It will not matter  whether your module is just a container having exported modules
    or not. The two can be mixed within the module, but the resulting API may not
    be good at all.


    You should also consider what is to happen in case the function is exported. This
    is shown in the code given below:


    var pLevel = function(level) {


    return level > 9000 ? "it is over 9000!!!" : level;


    };


    module.exports = pLevel;


    Whenever the above function is required, the return value will be the actual function.
    That means that we can do the following:


    require(''./plevel'')(9050);'
