  \  }, 5000); // 每 5 秒更新一次\n}\n\nwindow.onload = updateData;\n</script>\n</head>\n\
  <body>\n<h1>实时数据: <span id=\"liveData\"></span></h1>\n</body>\n</html>\n```\n\n\
  ### live_data.php (服务器端脚本):\n\nphp 代码\n\n```php\n<?php\necho json_encode([\"value\"\
  \ => date(\"H:i:s\")]);\n?>\n```\n\n\n\n\n\n# php 代码\n\n```php\n<?php\n\n//  模拟实时数据更新\n\
  \n$data = ['value' => rand(1, 100)];  //  生成随机值\n\necho json_encode($data);  //\
  \ 以 JSON 格式返回实时数据\n\n?>\n```\n\n示例演示了如何使用 AJAX 定隔在网页上更新实时数据。JavaScript 函数 `updateData`\
  \ 使用 `setInterval` 每 5 秒从服务器端 PHP 脚本（`live_data.php`）获取更新的数据，并将其显示在网页上。\n\n## AJAX\
  \ 示例 9：无限滚动\n\n### HTML\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>无限滚动</title>\n\
  <style>\n#content {\nheight:  200px;\noverflow-y:  scroll;\n}\n</style>\n<script>\n\
  let page  =  1;\nfunction loadMoreContent()  {\nlet content  =  document.getElementById('content');\n\
  let scrollHeight  =  content.scrollHeight;\nlet scrollTop  =  content.scrollTop;\n\
  let offsetHeight  =  content.offsetHeight;\nif (scrollHeight  -  scrollTop  ===\
  \  offsetHeight)  {\nfetch(`content.php?page=${page}`)\n.then(response => response.text())\n\
  .then(data => {\ncontent.innerHTML +=  data;\npage++;\n})\n.catch(error => console.error('Error:',\
  \ error));\n}\n}\nwindow.onscroll =  loadMoreContent;\n</script>\n</head>\n<body>\n\
  <div id=\"content\" onscroll=\"loadMoreContent()\">\n<!--  初始加载的内容  -->\n</div>\n\
  </body>\n</html>\n```\n\n### content.php (提供内容的服务器端脚本)\n\n```php\n<?php\n\n$page\
  \ =  $_GET['page'];  //  获取页码\n$limit =  10;  //  每页项目数\n$start = ($page -  1) *\
  \  $limit;  //  计算起始索引\n//  根据页码和限制获取内容\n//  示例：  $results  =  fetchDataFromDatabase($start,\
  \ $limit);\n//  生成示例内容用于演示\n$results =  range($start +  1, $start +  $limit);\n\
  foreach ($results as $result)  {\necho \"<p>项目 $result</p>\";\n}\n\n?>\n```\n\n\
  此示例演示了使用 AJAX 实现的无限滚动功能。当用户向下滚动页面时，`loadMoreContent` 函数会检测用户何时到达内容区域的底部，并触发 AJAX\
  \ 请求从服务器端 PHP 脚本（`content.php`）获取更多内容，然后这些内容会被动态添加到网页上的现有内容中。\n\n这些额外的示例展示了 AJAX\
  \ 的不同功能，例如实时数据更新和在网页上实现无限滚动行为，证明了如何使用 AJAX 在不刷新页面的情况下动态获取并显示数据。\n\n## AJAX 示例 10：带进度条的文件上传\n\
  \n### HTML\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>带进度的文件上传</title>\n\
  <script>\nfunction uploadFile()  {\nlet fileInput  =  document.getElementById('fileInput');\n\
  let file  =  fileInput.files[0];\nlet formData  =  new FormData();\nformData.append('file',\
