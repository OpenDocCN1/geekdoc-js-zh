  xhr.upload.onprogress =  function(e)  {\nif (e.lengthComputable)  {\nlet percentComplete\
  \  = (e.loaded / e.total) * 100;\ndocument.getElementById('progressBar').style.width\
  \ =  percentComplete  +  '%';\n}\n};\nxhr.onload =  function()  {\nif (xhr.status\
  \ ===  200)  {\nalert('文件上传成功！');\n} else {\nalert('文件上传失败。');\n}\n};\nxhr.send(formData);\n\
  }\n</script>\n</head>\n<body>\n<input type=\"file\" id=\"fileInput\">\n<button onclick=\"\
  uploadFile()\">上传</button>\n<div id=\"progressBarContainer\">\n<div id=\"progressBar\"\
  ></div>\n</div>\n</body>\n</html>\n```\n\n### upload.php (文件上传的服务器端脚本)\n\n```php\n\
  <?php\n\nif ($_SERVER['REQUEST_METHOD'] ===  'POST' && isset($_FILES['file'])) \
  \ {\n$targetDir =  'uploads/';\n$targetFile =  $targetDir .  basename($_FILES['file']['name']);\n\
  if (move_uploaded_file($_FILES['file']['tmp_name'], $targetFile))  {\necho '文件上传成功！';\n\
  } else {\necho '文件上传失败。';\n}\n}\n\n?>\n```\n\n此示例演示了带有进度条的 AJAX 文件上传功能。当用户选择文件并点击“上传”按钮时，文件将通过\
  \ `XMLHttpRequest` 异步上传到服务器。进度条会直观地显示上传进度。\n\n## AJAX 示例 11：动态显示时间\n\n### HTML\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>动态显示时间</title>\n<script>\nfunction\
  \ displayTime()  {\nlet timeDisplay  =  document.getElementById('timeDisplay');\n\
  setInterval(() => {\nfetch('getTime.php')\n.then(response => response.text())\n\
  .then(data => {\ntimeDisplay.innerHTML =  data;\n})\n.catch(error => console.error('Error:',\
  \ error));\n}, 1000);\n\ndisplayTime();\n</script>\n</head>\n<body>\n<h1 id=\"timeDisplay\"\
  ></h1>\n</body>\n</html>\n```\n\n### getTime.php (提供时间的服务器端脚本)\n\n```php\n<?php\n\
  echo date(\"H:i:s\");\n?>\n```\n\n此示例演示了如何使用 AJAX 动态显示当前时间。JavaScript 中的 `setInterval`\
  \ 函数每秒从 `getTime.php` 获取当前时间，并更新 `timeDisplay` 元素的内容，无需刷新页面。\n\n\n\n\n\n```json\n\
  { \"city\": \"London\" }\n```\n\n## JSON 数组\n\nJSON 数组是封装在方括号 `[]` 中的有序值列表。这些值可以是任何\
  \ JSON 数据类型。\n\n### JSON 数组示例：\n\n```json\n[\"apple\", \"banana\", \"orange\"]\n\
  ```\n\n## JSON Server\n\n在 Web 开发中，JSON 常用于在服务器和网络客户端之间传输数据。服务器经常通过 API 以 JSON 格式提供数据。\n\
  \n### 来自服务器的 JSON 数据示例：\n\n```json\n//  从服务器 API 端点接收\n{\n  \"id\": 1,\n  \"title\"\
  : \"Sample Post\",\n  \"content\": \"这是一篇示例性正文内容。\"\n}\n```\n\n## JSON PHP\n\n在\
  \ PHP 中，可以使用 `json_encode()` 和 `json_decode()` 函数分别对 JSON 数据进行编码和解码，以实现数据与 JSON\
  \ 格式之间的转换。\n\n### 在 PHP 中编码和解码 JSON 的示例：\n\n```php\n//  将 PHP 数组编码为 JSON\n$data\
  \ = array(\"name\"=> \"Peter\", \"age\"=> 28);\n$jsonData = json_encode($data);\n\
  \n//  将 JSON 解码为 PHP 数组\n$jsonString = '{\"name\": \"Alice\", \"age\": 30}';\n$decodedData\
  \ = json_decode($jsonString, true);\n```\n\n## JSON HTML\n\nJSON 数据可以用于 HTML，通过\
  \ JavaScript 在网页上动态生成内容。\n\n### 在 HTML 中使用 JSON 数据的示例：\n\n```html\n<ul id=\"userList\"\
  ></ul>\n<script>\nconst users = [\n  { \"name\": \"John\", \"age\": 25 },\n  { \"\
  name\": \"Alice\", \"age\": 30 },\n  { \"name\": \"Bob\", \"age\": 28 }\n];\nconst\
  \ userList = document.getElementById(\"userList\");\nusers.forEach(user => {\n \
  \ let listItem = document.createElement(\"li\");\n  listItem.textContent = `${user.name}\
  \ - ${user.age} years old`;\n  userList.appendChild(listItem);\n});\n</script>\n\
  ```\n\n## JSON JSONP\n\nJSONP（带有填充的 JSON）是 Web 开发中用于从不同域请求 JSON 数据的技术，以绕过同源策略限制。\n\
  \n### JSONP 请求示例：\n\n```javascript\nfunction handleData(data) {\n  console.log(data);\n\
  }\nlet script = document.createElement('script');\nscript.src = 'https://example.com/data?callback=handleData';\n\
  document.head.appendChild(script);\n```\n\n本综合指南详细介绍了 JSON（JavaScript 对象表示），包括介绍、与\
  \ XML 的比较、数据类型、解析、字符串化、JSON 对象和数组、以及在 PHP、HTML 和 JSONP 等服务器端技术中使用 JSON，并为每个主题提供了了示例和解释。由于其简单性、易用性以及广泛的支持，JSON\
  \ 在 Web 开发的数据交换中起着至关重要的作用。\n\n### 1. 创建 JSON 对象：\n\n```javascript\nlet person =\
  \ {\n  \"name\": \"John\",\n  \"age\": 30,\n  \"city\": \"New York\"\n};\n```\n\n\
  ### 2. 访问 JSON 对象属性：\n\n```javascript\nconsole.log(person.name); //  输出: John\n\
  console.log(person.age); //  输出: 30\n```\n\n### 3. 嵌套 JSON 对象：\n\n```javascript\n\
  let employee = {\n  \"name\": \"Alice\",\n  \"position\": \"Engineer\",\n  \"contact\"\
  : {\n    \"email\": \"alice@example.com\",\n    \"phone\": \"123-456-7890\"\n  }\n\
  };\n```\n\n### 4. 对象 JSON 数组：\n\n```javascript\nlet books = [\n  { \"title\": \"\
