  \  }\n});\n```\n\n### 13. 获取属性值:\n\n### JavaScript:\n\n```javascript\nlet linkHref\
  \ = document.getElementById(\"myLink\").getAttribute(\"href\");\n```\n\n### jQuery:\n\
  \n```javascript\nlet linkHref = $(\"#myLink\").attr(\"href\");\n```\n\n### 14. 设置属性值:\n\
  \n### JavaScript:\n\n```javascript\ndocument.getElementById(\"myImage\").setAttribute(\"\
  src\", \"new_image.jpg\");\n```\n\n### jQuery:\n\n```javascript\n$(\"#myImage\"\
  ).attr(\"src\", \"new_image.jpg\");\n```\n\n### 15. 获取表单值:\n\n### JavaScript:\n\n\
  ```javascript\nlet inputValue = document.getElementById(\"myInput\").value;\n```\n\
  \n### jQuery:\n\n```javascript\nlet inputValue = $(\"#myInput\").val();\n```\n\n\
  ### 16. 检查选框状态:\n\n### JavaScript:\n\n```javascript\nlet isChecked = document.getElementById(\"\
  myCheckbox\").checked;\n```\n\n### jQuery:\n\n```javascript\nlet isChecked = $(\"\
