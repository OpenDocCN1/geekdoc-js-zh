  \ 获取第一个匹配元素\n\n```javascript\nlet users = [\n  { id: 1, name: 'Alice' },\n  { id:\
  \ 2, name: 'Bob' },\n  { id: 3, name: 'Charlie' }\n];\nlet user = users.find(user\
  \ => user.id === 2);  // 输出: { id: 2, name: 'Bob' }\n```\n\n### 高级功能\n\n#### 5.\
  \ 生成器函数 (Generator Function)\n\n```javascript\nfunction* generatorFunction() {\n\
