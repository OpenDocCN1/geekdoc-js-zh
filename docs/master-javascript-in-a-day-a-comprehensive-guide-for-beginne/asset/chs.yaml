  xhr.open(\"POST\", \"saveData\", true);\nxhr.setRequestHeader(\"Content-Type\",\
  \ \"application/json\");\nxhr.send(JSON.stringify({ name: \"John\", age: 30 }));\n\
  ```\n\n### jQuery:\n\n```javascript\n$.ajax({\n  url: \"saveData\",\n  method: \"\
