  \ animal);\ndog.makeSound();  // 输出: 'Animal sound'\n```\n\n### 高级数组操作\n\n#### 3.\
  \ 使用 `Set` 获取唯一值\n\n```javascript\nlet numbers = [1, 2, 2, 3, 4, 4, 5];\nlet uniqueNumbers\
