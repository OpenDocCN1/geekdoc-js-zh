  >加载内容</button>\n<div id=\"dynamicContent\"></div>\n</body>\n</html>\n```\n\n###\
  \ content.html (示例内容):\n\nhtml 代码\n\n```html\n<h2>欢迎来到动态内容</h2>\n<p>此内容是使用 AJAX\
  \ 动态加载的。</p>\n```\n\n此示例演示了一个简单的按钮，该按钮触发 AJAX 请求以从外部 HTML 文件加载内容，并将其显示在网页上，而无需刷新整个页面。\n\
  \n### AJAX 示例 4：使用 AJAX 提交表单\n\n### HTML:\n\nhtml 代码\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<title>AJAX 表单提交</title>\n<script>\nfunction submitForm() {\n  let\
  \ formData = new FormData(document.getElementById(\"myForm\"));\n  let xhttp = new\
  \ XMLHttpRequest();\n  xhttp.onreadystatechange = function() {\n    if (this.readyState\
  \ == 4 && this.status == 200) {\n      document.getElementById(\"response\").innerHTML\
  \ = this.responseText;\n    }\n  };\n  xhttp.open(\"POST\", \"processForm.php\"\
  , true);\n  xhttp.send(formData);\n}\n</script>\n</head>\n<body>\n<form id=\"myForm\"\
  >\n<input type=\"text\" name=\"username\" placeholder=\"用户名\">\n<input type=\"password\"\
  \ name=\"password\" placeholder=\"密码\">\n<button type=\"button\" onclick=\"submitForm()\"\
  >提交</button>\n</form>\n<div id=\"response\"></div>\n</body>\n</html>\n```\n\n###\
  \ processForm.php (服务器端处理):\n\nphp 代码\n\n```php\n<?php\n\nif ($_SERVER[\"REQUEST_METHOD\"\
  ] == \"POST\") {\n  $username = $_POST[\"username\"];\n  $password = $_POST[\"password\"\
  ];\n  // 执行验证或数据库操作\n  echo \"表单已由 $username 成功提交!\";\n} else {\n  echo \"无效请求！\"\
  ;\n}\n\n?>\n```\n\n此示例演示了如何使用 AJAX 提交表单。当表单提交时，数据会被异步发送到服务器端的 `PHP` 脚本进行处理。服务器的响应将显示在网页上，无需刷新整个页面。\n\
  \n### AJAX 示例 5：获取 JSON 数据\n\n### JavaScript:\n\njavascript 代码\n\n```javascript\n\
  fetch('data.json')\n  .then(response => response.json())\n  .then(data => {\n  \
