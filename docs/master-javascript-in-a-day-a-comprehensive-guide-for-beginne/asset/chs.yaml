  \ 文件中被解析并填充画廊。\n\n### AJAX 示例 7：自动补全搜索\n\n### HTML:\n\nhtml 代码\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<title>AJAX 自动补全</title>\n<script>\nfunction search() {\n\
  \  let query = document.getElementById(\"searchInput\").value;\n  let xhttp = new\
  \ XMLHttpRequest();\n  xhttp.onreadystatechange = function() {\n    if (this.readyState\
  \ == 4 && this.status == 200) {\n      let data = JSON.parse(this.responseText);\n\
  \      let results = document.getElementById(\"searchResults\");\n      results.innerHTML\
  \ = '';\n      data.forEach(item => {\n        let listItem = document.createElement(\"\
  li\");\n        listItem.textContent = item.name;\n        results.appendChild(listItem);\n\
  \      });\n    }\n  };\n  xhttp.open(\"GET\", `search.php?q=${query}`, true);\n\
  \  xhttp.send();\n}\n</script>\n</head>\n<body>\n<input type=\"text\" id=\"searchInput\"\
  \ onkeyup=\"search()\" placeholder=\"搜索...\">\n<ul id=\"searchResults\"></ul>\n\
  </body>\n</html>\n```\n\n### search.php (服务器端脚本):\n\nphp 代码\n\n```php\n<?php\n$searchTerm\
  \ = $_GET['q']; // 获取查询词\n// 根据查询执行数据搜索\n$results = [\n  [\"name\" => \"结果 1\"],\n\
  \  [\"name\" => \"结果 2\"]\n]; // 根据需要添加更多结果\n\necho json_encode($results); // 以\
  \ JSON 格式返回\n\n?>\n```\n\n此示例演示了使用 AJAX 的自动补全功能。当用户在搜索输入框中输入时，会向服务器端 `PHP` 脚本（`search.php`）发送\
  \ AJAX 请求，该脚本处理查询并返回 JSON 格式的匹配结果，随后将其作为自动补全建议显示。\n\n### AJAX 示例 8：实时数据更新\n\n###\
  \ HTML:\n\nhtml 代码\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>实时数据更新</title>\n\
  <script>\nfunction updateData() {\n  setInterval(() => {\n    fetch('live_data.php')\n\
