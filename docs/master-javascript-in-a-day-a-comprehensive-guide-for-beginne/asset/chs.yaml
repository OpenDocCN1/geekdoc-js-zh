  : \"home\", \"address\": \"123 Main St\" },\n    { \"type\": \"work\", \"address\"\
  : \"456 Ave\" }\n  ]\n};\nlet complexString = JSON.stringify(complexObj);\nlet parsedObj\
  \ = JSON.parse(complexString);\n```\n\n### 11. 过滤 JSON 数组：\n\n```javascript\nlet\
  \ employees = [\n  { \"name\": \"John\", \"department\": \"IT\" },\n  { \"name\"\
  : \"Alice\", \"department\": \"HR\" },\n  { \"name\": \"Bob\", \"department\": \"\
  HR\" }\n];\nlet hrEmployees = employees.filter(employee => employee.department ===HR\"\
  );\nconsole.log(hrEmployees);\n```\n\n### 12. 更新 JSON 对象：\n\n```javascript\nlet\
  \ product = { \"name\": \"Chair\", \"price\": 50 };\nproduct.price = 60;\nconsole.log(product);\n\
  ```\n\n### 13. 从 JSON 对象中删除属性：\n\n```javascript\nlet data = { \"name\": \"Kate\"\
  , \"age\": 25 };\ndelete data.age;\nconsole.log(data);\n```\n\n### 14. 使用 JSON 进行存储：\n\
  \n```javascript\nlet userData = { \"username\": \"user23\", \"email\": \"user@example.com\"\
  \ };\nlocalStorage.setItem('userData', JSON.stringify(userData));\nlet storedData\
  \ = JSON.parse(localStorage.getItem('userData'));\nconsole.log(storedData.email);\n\
  ```\n\n### 15. 处理日期字符串：\n\n```javascript\nlet jsonData = { \"date\": \"2023-12-31T08:00:00Z\"\
  \ };\nlet date = new Date(jsonData.date);\nconsole.log(date.toDateString());\n```\n\
  \n### 16. 在异步函数中使用 JSON：\n\n```javascript\nasync function fetchData() {\n  try {\n\
  \    let response = await fetch('data.json');\n    let data = await response.json();\n\
  \    console.log(data);\n  } catch (error) {\n    console.error('Error:', error);\n\
  \  }\n}\nfetchData();\n```\n\n### 17. 带有自定义函数的 JSON 序列化：\n\n```javascript\nlet obj\
  \ = {\n  \"name\": \"Joe\",\n  \"birthday\": new Date('1990-01-15T00:00:00Z'),\n\
  \  toJson: function() {\n    return `{ \"name\": \"${this.name}\", \"birthday\"\
  : \"${this.birthday.toISOString()}\"}`;\n  }\n};\nlet jsonString = obj.toJson();\n\
  console.log(jsonString);\n```\n\n### 18. 使用 Axios 获取 API JSON 数据：\n\n```javascript\n\
  axios.get('https://api.example.com/data')\n.then(response => console.log(response.data))\n\
  .catch(error => console.error('Error:', error));\n```\n\n### 19. 合并 JSON 对象：\n\n\
  ```javascript\nlet obj1 = { \"name\": \"Tom\", \"age\": 30 };\nlet obj2 = { \"city\"\
  : \"Paris\", \"country\": \"France\" };\nlet mergedObj = { ...obj1, ...obj2 };\n\
  console.log(mergedObj);\n```\n\n### 20. 将 JSON 数据映射到另一种结构：\n\n```javascript\nlet\
  \ data = [\n  { \"id\": 1, \"name\": \"Item 1\" },\n  { \"id\": 2, \"name\": \"\
  Item 2\" },\n  { \"id\": 3, \"name\": \"Item 3\" }\n];\nlet mappedData = data.map(item\
  \ => ({ itemId: item.id, itemName: item.name }));\nconsole.log(mappedData);\n```\n\
  \n这些示例展示了 JavaScript 中使用 JSON 的不同方面，包括创建、操作、解析以及在各种场景下处理 JSON 数据。\n\n\n\n\n\nJavaScript\
  \ 和 jQuery 都是 Web 开发中强大的工具。JavaScript 是一种编程语言，而 jQuery 是使用 JavaScript 构建的一个库。理解它们区别、功能和使用场景对于开发者来说至关重要。\n\
  \n## JavaScript 概述\n\nJavaScript 是一种多功能的编程语言，主要用于增强网页的交互性。它是 Web 开发的核心技术，能够实现动态内容更新、用户交互以及处理客户端各项功能。\n\
  \n### JavaScript 功能示例：\n\n```javascript\n//  JavaScript code to change text color\
  \ on button click\n\nfunction changeColor() {\n  document.getElementById(\"text\"\
  ).style.color = \"blue\";\n}\n```\n\nJavaScript 提供了原生方法和 API 来与文档对象模型 (DOM) 交互并操作\
  \ HTML 元素，允许开发者创建动态 Web 应用。\n\n## jQuery 概述\n\n另一方面，jQuery 是一个快速、轻量级的 JavaScript\
  \ 库，旨在简化客户端脚本和 DOM 操作过程。它抽象了 JavaScript 的许多复杂性，并为常见任务提供了简洁的语法。\n\n### jQuery 功能示例：\n\
  \n```javascript\n//  jQuery code to change text color on button click\n\n$(\"#text\"\
  ).css(\"color\", \"blue\");\n```\n\njQuery 简化了常见的 JavaScript 任务，如事件处理、动画、AJAX 请求和\
  \ DOM 操作，与原生 JavaScript 相比提供了更简洁的语法。\n\n## JavaScript 和 jQuery 的区别\n\n### 1. 语法：\n\
  \n* JavaScript：使用语言提供的原生语法和方法。\n* jQuery：为常见任务提供了简单的语法和简洁的方法，使代码更短更具可读性。\n\n###\
  \ 2. DOM 操作：\n\n* JavaScript：使用 `getElementById` 和 `querySelector` 等方法提供直接的 DOM\
  \ 操作。\n* jQuery：通过 `$()` 等方法简化 DOM 遍历和操作，允许更轻松地选择和修改元素。\n\n### 3. 浏览器兼容性：\n\n* JavaScript：适用于所有现代浏览器，但处理跨浏览器兼容性可能需要额外的代码。\n\
  * jQuery：开箱即跨浏览器兼容性，减少了显式兼容性处理的需求。\n\n### 4. 学习曲线：\n\n* JavaScript：需要理解核心语言概念，对初学者来说学习曲线可能更陡峭。\n\
  * jQuery：由于其简洁的语法和对复杂 JavaScript 操作的抽象，学习曲线更简单。\n\n## jQuery 选择器\n\njQuery 提供了强大的选择器，允许开发者高效地定位和操作\
  \ HTML 元素。\n\n### jQuery 选择器示例：\n\n```javascript\n//  Selecting elements with class\
  \ 'example'\n\n$(\".example\").css(\"font-size\", \"16px\");\n\n//  Selecting all\
  \ <p> elements inside <div> with ID 'content'\n\n$(\"#content p\").addClass(\"highlight\"\
  );\n```\n\njQuery 选择器类似于 CSS 选择器，允许开发者根据 ID、类、属性、元素类型等定位元素。\n\n## jQuery HTML 操作\n\
  \njQuery 通过提供插入、删除和修改 HTML 元素及其内容的方法，简化了 HTML 内容的操纵。\n\n### jQuery HTML 操作示例：\n\n\
  ```javascript\n//  Appending a new <li> element to an unordered list\n\n$(\"ul\"\
  ).append(\"<li>New Item</li>\");\n\n//  Changing text content inside a <div> element\n\
  \n$(\"#content\").text(\"Updated content\");\n```\n\n通过 jQuery 的 `append`、`html`、`text`\
  \ 和 `remove` 等方法，开发者可以高效地即时修改 HTML 内容。\n\n## jQuery CSS 操作\n\njQuery 促进了 CSS 操作，允许动态更改元素样式。\n\
  \n### jQuery CSS 操作示例：\n\n```javascript\n//  Changing the background color of an\
  \ element\n\n$(\"#box\").css(\"background-color\", \"#f2fff2\");\n\n//  Toggling\
  \ a CSS class on an element\n\n$(\"#toggleBtn\").click(function() {\n  $(\"#content\"\
  ).toggleClass(\"active\");\n});\n```\n\njQuery 的 `css`、`addClass`、`removeClass`\
  \ 和 `toggleClass` 方法简化了应用、移除和切换 CSS 样式。\n\n## jQuery DOM 遍历\n\njQuery 简化了 DOM 遍历，允许在元素及其在\
  \ DOM 中的关系之间轻松导航。\n\n### jQuery DOM 遍历示例：\n\n```javascript\n//  Finding the next\
  \ sibling element\n\n$(\"#current\").next().addClass(\"highlight\");\n\n//  Traversing\
  \ up the DOM to find parent elements\n\n$(\"a\").closest(\"div\").addClass(\"parent-div\"\
  );\n```\n\n使用 `next`、`prev`、`find`、`closest` 和 `siblings` 等方法，jQuery 提供了在 DOM 内导航和操作元素的有效方法。\n\
  \n## 结论\n\nJavaScript 和 jQuery 在 Web 开发中各有优势和用场景。JavaScript 是基础语言，提供了构建复杂应用程序的广泛能力。jQuery\
  \ 作为构建在 JavaScript 之上的库，简化了常见任务（特别是 DOM 操作），提供了更简洁的语法。\n\n对于现代开发，由于 Web 标准的进步，JavaScript\
  \ 的原生功能通常更青青，而 jQuery 在旧项目或需要考虑与旧浏览器兼容性时仍然适用。理解 JavaScript 和 jQuery 能让开发者能够根据任务选择正确的工具，并构建健壮、交互式的\
  \ Web 应用。\n\n## 各种示例中的 JavaScript 和 jQuery：\n\n### 1. 通过 ID 选择元素：\n\n#### JavaScript:\n\
  ```javascript\nlet element = document.getElementById(\"myElement\");\nelement.style.color\
  \ = \"blue\";\n```\n\n#### jQuery:\n```javascript\n$(\"#myElement\").css(\"color\"\
  , \"blue\");\n```\n\n### 2. 通过类选择多个元素：\n\n#### JavaScript:\n```javascript\nlet elements\
  \ = document.getElementsByClassName(\"myClass\");\nfor (let i = 0; i < elements.length;\
  \ i++) {\n  elements[i].style.fontWeight = \"bold\";\n}\n```\n\n#### jQuery:\n```javascript\n\
  $(\".myClass\").css(\"font-weight\", \"bold\");\n```\n\n### 3. 添加事件监听器：\n\n####\
  \ JavaScript:\n```javascript\ndocument.getElementById(\"myButton\").addEventListener(\"\
  click\", function() {\n  alert(\"Button clicked!\");\n});\n```\n\n#### jQuery:\n\
  ```javascript\n$(\"#myButton\").on(\"click\", function() {\n  alert(\"Button clicked!\"\
  );\n});\n```\n\n### 4. 就绪绪：\n\n#### JavaScript:\n```javascript\ndocument.addEventListener(\"\
  DOMContentLoaded\", function() {\n  //  Code to execute when DOM is ready\n});\n\
  ```\n\n#### jQuery:\n```javascript\n$(document).ready(function() {\n  //  Code to\
  \ execute when DOM is ready\n});\n```\n\n### 5. 创建新元素：\n\n#### JavaScript:\n```javascript\n\
  let newElement = document.createElement(\"div\");\nnewElement.textContent = \"New\
  \ Content\";\ndocument.body.appendChild(newElement);\n```\n\n#### jQuery:\n```javascript\n\
  $(\"body\").append(\"<div>New Content</div>\");\n```\n\n### 6. 移除一个元素：\n\n#### JavaScript:\n\
  ```javascript\nlet elementToRemove = document.getElementById(\"toBeRemoved\");\n\
  elementToRemove.parentNode.removeChild(elementToRemove);\n```\n\n#### jQuery:\n\
  ```javascript\n$(\"#toBeRemoved\").remove();\n```\n\n### 7. 操作 CSS 类：\n\n#### JavaScript:\n\
  ```javascript\ndocument.getElementById(\"myDiv\").classList.add(\"active\");\n```\n\
  \n#### jQuery:\n```javascript\n$(\"#myDiv\").addClass(\"active\");\n```\n\n### 8.\
  \ 修改文本内容：\n\n#### JavaScript:\n```javascript\ndocument.getElementById(\"mySpan\"\
  ).textContent = \"Updated Text\";\n```\n\n#### jQuery:\n```javascript\n$(\"#mySpan\"\
  ).text(\"Updated Text\");\n```\n\n### 9. 隐藏一个元素：\n\n#### JavaScript:\n```javascript\n\
  document.getElementById(\"toHide\").style.display = \"none\";\n```\n\n#### jQuery:\n\
  ```javascript\n$(\"#toHide\").hide();\n```\n\n### 10. 渐入元素：\n\n#### JavaScript:\n\
  ```javascript\nlet elementToFade = document.getElementById(\"toFade\");\nelementToFade.style.opacity\
  \ = 0;\nelementToFade.style.transition = \"opacity 1s\";\nelementToFade.style.opacity\
  \ = 1;\n```\n\n#### jQuery:\n```javascript\n$(\"#toFade\").fadeIn(1000);\n```\n\n\
  ### 11. AJAX GET 请求：\n\n#### JavaScript:\n```javascript\nlet xhr = new XMLHttpRequest();\n\
  xhr.onreadystatechange = function() {\n};\n```\n\n\n\n\n\n```javascript\nif (this.readyState\
  \ === 4 && this.status === 200) {\n  console.log(this.responseText);\n}\n};\n\n\
  xhr.open(\"GET\", \"data.txt\", true);\n\nxhr.send();\n```\n\n### jQuery:\n\n```javascript\n\
  $.get(\"data.txt\", function(data) {\n  console.log(data);\n});\n```\n\n### 12.\
