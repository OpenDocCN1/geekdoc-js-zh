    # JavaScript Statements


    JavaScript statements are individual commands or instructions that the browser
    executes.  They form the logic of a program and can be simple or complex.


    ## Examples of JavaScript Statements:


    ### 1.  Variable Declaration:


    javascript code


    let x;  //  Declaring a variable ''x''


    ### 2.  Conditional Statement:


    javascript code


    if (x  ===  5)  {


    //  Executed if x is equal to 5


    console.log(''x is 5'');


    } else {


    //  Executed if x is not equal to 5


    console.log(''x is not 5'');


    }


    ### 3.  Loops:


    javascript code


    for (let i  =  0; i < 5; i++)  {


    //  Executed 5 times


    console.log(i);


    }


    # JavaScript Syntax


    JavaScript syntax refers to the rules that define the structure of valid JavaScript
    code.  It includes rules for writing statements, variables, and functions in a
    way that the interpreter or browser can understand.


    ## Examples of JavaScript Syntax:


    ### 1.  Function Definition:


    javascript code


    function greet(name)  {


    return ''Hello, '' +  name  +  ''!'';


    }


    ### 2.  Object Literal:


    javascript code


    const person  =  {


    firstName:  ''John'',


    lastName:  ''Doe'',


    age:  30


    };


    ### 3.  Array Declaration:


    javascript code


    const numbers  = [1, 2, 3, 4, 5];


    # JavaScript Comments


    Comments in JavaScript are used to add explanatory notes within the code.  They
    are ignored by the interpreter and are only meant for human readers.


    ## Examples of JavaScript Comments:


    ### 1.  Single Line Comment:


    javascript code


    //  This is a single line comment


    ### 2.  Multi-line Comment:


    javascript code


    /*


    This is a


    multi-line comment


    */


    ### 3.  Commenting Out Code:


    javascript code


    //  This code won''t be executed


    //  const x  =  10;


