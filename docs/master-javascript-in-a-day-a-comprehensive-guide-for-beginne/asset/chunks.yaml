    let greet = (name) => {


    return ''Hello, '' +  name  +  ''!'';


    };


    # JS Classes


    Classes in JavaScript provide a way to create objects using a blueprint.


    ## Examples of JS Classes:


    ### Class Declaration:


    javascript code


    class Person {


    constructor(name)  {


    this.name =  name;


    }


