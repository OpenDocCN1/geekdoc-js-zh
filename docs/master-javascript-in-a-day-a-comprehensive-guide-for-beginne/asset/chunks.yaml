    ```\n\n### Bitwise OR Operator:\n\n```javascript\nlet result  = 5 | 3;  // Output:\
    \ 7\n```\n\n# JS RegExp\n\nRegular expressions in JavaScript are used for pattern\
    \ matching within strings.\n\n## Examples of JS RegExp:\n\n### Creating a Regular\
    \ Expression:\n\n```javascript\nlet pattern  = /hello/i;  // Case-insensitive\
    \ 'hello'\n```\n\n### Testing a String with RegExp:\n\n```javascript\nlet str\
    \  = 'Hello, World!';\nconsole.log(pattern.test(str));  // Output: true\n```\n\
    \n# JS Precedence\n\nOperator precedence in JavaScript determines the order of\
    \ operations in an expression.\n\n## Examples of JS Precedence:\n\n### Arithmetic\
    \ Precedence:\n\n```javascript\nlet result  = 5 + 3 * 2;  // Output: 11 (Multiplication\
    \ has higher precedence)\n```\n\n# JS Errors\n\nErrors in JavaScript can be generated\
    \ when an incorrect code is encountered during execution.\n\n## Examples of JS\
    \ Errors:\n\n### Syntax Error:\n\n```javascript\nlet x  = 10\n```\nThis will throw\
    \ a syntax error due to the missing semicolon.\n\n### Reference Error:\n\n```javascript\n\
    console.log(undefinedVariable);\n```\nThis will throw a reference error as `undefinedVariable`\
    \ is not defined.\n\n# JS Scope\n\nScope in JavaScript defines the visibility\
    \ and accessibility of variables.\n\n## Examples of JS Scope:\n\n### Global Scope:\n\
    \n```javascript\nlet globalVar  = 'I am global';\nfunction test() {\n  console.log(globalVar);\
    \  // Accessible inside function\n}\nconsole.log(globalVar);  // Accessible outside\
    \ function\n```\n\n# JS Hoisting\n\nHoisting in JavaScript allows variables and\
    \ functions to be used before they are declared.\n\n## Examples of JS Hoisting:\n\
    \n### Variable Hoisting:\n\n```javascript\nconsole.log(myVar);  // Outputs: undefined\n\
    var myVar  = 10;\n```\n\n### Function Hoisting:\n\n```javascript\nsayHello();\
    \  // Outputs: 'Hello'\nfunction sayHello() {\n  console.log('Hello');\n}\n```\n\
    \n# JS Strict Mode\n\nStrict mode in JavaScript enforces stricter rules and better\
    \ error handling.\n\n## Examples of JS Strict Mode:\n\n### Enabling Strict Mode:\n\
    \n```javascript\n'use strict';\n```\n\n### Using Strict Mode Inside a Function:\n\
    \n```javascript\nfunction myFunction() {\n  'use strict';\n  // Strict mode only\
    \ applies inside this function\n}\n```\n\n# JS this Keyword\n\nThe `this` keyword\
    \ in JavaScript refers to the object it belongs to.\n\n## Examples of JS this\
    \ Keyword:\n\n### Using `this` in an Object:\n\n```javascript\nlet person  = {\n\
    \  name: 'Alice',\n  greet: function() {\n    console.log('Hello, my name is '\
    \ + this.name);\n  }\n};\nperson.greet();  // Outputs: 'Hello, my name is Alice'\n\
    ```\n\n# JS Arrow Function\n\nArrow functions in JavaScript provide a concise\
    \ syntax for writing functions.\n\n## Examples of JS Arrow Function:\n\n### Basic\
    \ Arrow Function:\n\n```javascript\nlet multiply = (a, b) => a * b;\n```\n\n###\
    \ Arrow Function with Multiple Lines:\n\n```javascript\nlet greet = (name) =>\
    \ {\n  return 'Hello, ' + name;\n};\n```\n\n# JS Classes\n\nClasses in JavaScript\
    \ provide a way to create objects using templates.\n\n## Examples of JS Classes:\n\
    \n### Class Declaration:\n\n```javascript\nclass Person {\n  constructor(name)\
    \ {\n    this.name = name;\n  }\n  greet() {\n    console.log('Hello, my name\
    \ is ' + this.name);\n  }\n}\nlet alice = new Person('Alice');\nalice.greet();\
    \  // Outputs: 'Hello, my name is Alice'\n```\n\n# JS Modules\n\nModules in JavaScript\
    \ allow splitting code into separate files.\n\n## Examples of JS Modules:\n\n\
    ### Exporting a Module:\n\n```javascript\nexport function greet(name) {\n  console.log('Hello,\
    \ ' + name);\n}\n```\n\n### Importing a Module:\n\n```javascript\nimport { greet\
    \ } from './Module.js';\ngreet('Alice');\n```\n\n# JS JSON\n\nJSON (JavaScript\
    \ Object Notation) is a lightweight format for storing and transporting data.\n\
    \n## Examples of JS JSON:\n\n### Parsing JSON:\n\n```javascript\nlet jsonStr =\
    \ '{\"name\": \"Alice\", \"age\": 30}';\nlet obj = JSON.parse(jsonStr);\n```\n\
    \n### Stringify Object to JSON:\n\n```javascript\nlet obj = { name: 'Alice', age:\
    \ 30 };\nlet json = JSON.stringify(obj);\n```\n\n# JS Debugging\n\nDebugging in\
    \ JavaScript involves identifying and fixing errors or issues.\n\n## Examples\
    \ of JS Debugging:\n\n### Using `console.log()` for Debugging:\n\n```javascript\n\
    let x = 5;\nconsole.log(x);\n```\n\n### Using Browser Tools:\n\nInspect elements,\
