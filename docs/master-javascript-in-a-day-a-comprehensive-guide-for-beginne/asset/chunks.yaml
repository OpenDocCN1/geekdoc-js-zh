    inputField.addEventListener('change', (event) => {\n  console.log(`输入值变为: ${event.target.value}`);\n\
    });\n```\n\n## 表单验证与提交\n\n### 3. 实时密码强度检查\n\n```javascript\nconst passwordField\
    \ = document.getElementById('password');\nconst strengthIndicator = document.getElementById('passwordStrength');\n\
