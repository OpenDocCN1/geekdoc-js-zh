    Node.js 是一个 JavaScript 运行时环境，允许在浏览器之外执行 JavaScript。你可以从[官方网站](https://nodejs.org/)
    下载 Node.js 并进行安装，它将附带 Node 软件包管理器 (`npm`)。这对于在本地运行 JavaScript 程序和管理依赖非常有用。


    ### 3. 安装 Visual Studio Code 扩展


    * `JavaScript (ES6) Code Snippets`：为 JavaScript 开发提供方便的代码片段。在 VS Code 的扩展选项页中搜索并安装它。

    * `Prettier` - 代码格式化工具：根据预定义规则自动格式化你的代码。这是可选的，但强烈建议使用。


    ### 4. 创建一个 JavaScript 项目


    * 打开 Visual Studio Code。

    * 为你的项目创建一个新文件夹，或者打开一个现有文件夹。

    * 在文件夹内创建一个扩展名为 `.js` 的新 JavaScript 文件。在资源资源管理器面板中右键点击 > 新建文件 > `script.js`。


    ### 5. 编写和运行 JavaScript 代码


    * 在 `script.js` 文件中编写你的 JavaScript 代码。

    * 要运行 JavaScript 代码，打开 Visual Studio Code 中的集成终端（`Terminal > New Terminal`），导航到项目目录，并使用
    Node.js 运行 JavaScript 文件。例如：


    ```bash

    node script.js

    ```

    * 如果要在浏览器中执行 JavaScript 代码，请创建一个 HTML 文件（`index.html`），并使用 `<script>` 标签其中链接你的
    JavaScript 文件。在优好的浏览器中打开该 HTML 文件即可。


    ### 6. 调试 JavaScript


    * Visual Studio Code 拥有强大的内置调试器。你可以在代码中设置断点、检查变量并逐行步进代码执行。

    * 要使用调试器，可以通过点击代码行号旁侧的间隙来添加断点。然后，以调试模式运行你的 JavaScript 代码（点击左侧边栏中的调试图标）。


    ### 结论


    这就是使用 Visual Studio Code 开始编写 JavaScript 代码的基础配置。请记住，JavaScript 开发通常涉及 Web 开发，你需要在
    HTML/CSS 文件中编写 JavaScript 代码。对于基于 Web 的开发，你通常使用 VS Code 来管理整个项目结构。


    此外，对于更高级的开发或大型项目，使用如 `Webpack` 这样的模块打包器或如 `Gulp` 这样的任务运行器可能会进一步增强你的开发环境。


