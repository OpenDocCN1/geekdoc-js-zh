    \ function fetchData() {\n  let data = await fetch('https://api.example.com/data');\n\
    \  let jsonData = await data.json();\n  return jsonData;\n}\n\nfetchData().then(data\
    \ => console.log(data));\n```\n\n### DOM 操作\n\n## 17. 创建元素并追加到 DOM\n\n```javascript\n\
    let newElement = document.createElement('div');\nnewElement.textContent = '新元素';\n\
    document.body.appendChild(newElement);\n```\n\n## 18. 给按钮点击添加监听器\n\n```javascript\n\
    let button = document.getElementById('myButton');\nbutton.addEventListener('click',\
    \ () => {\n  console.log('按钮被点击了！');\n});\n```\n\n### 正则表达式\n\n## 19. 正则表达式测试\n\
    \n```javascript\nlet pattern = /\\d+/;\nlet isMatch = pattern.test('Hello 123');\
    \  // 输出: true\n```\n\n## 20. 使用正则替换字符串\n\n```javascript\nlet str = 'Hello 123';\n\
    let replaced = str.replace(/\\d+/, '456');  // 输出: 'Hello 456'\n```\n\n这些示例涵盖了\
    \ JavaScript 的多种功能，包括基础操作、字符串/数组操作、函数、对象、循环、错误处理、异步操作、DOM 操作以及正则表达式。\n\n### 高级函数\n\
    \n## 1. 闭包示例\n\n```javascript\nfunction outerFunction(outerValue) {\n  return\
    \ function(innerValue) {\n    return outerValue + innerValue;\n  };\n}\n\nlet\
    \ addFive = outerFunction(5);\nlet result = addFive(3);  // 输出: 8\n```\n\n## 2.\
    \ 柯里化示例\n\n```javascript\nfunction multiply(a) {\n  return function(b) {\n   \
    \ return a * b;\n  };\n}\n\nlet multiplyByTwo = multiply(2);\nlet product = multiplyByTwo(5);\
    \  // 输出: 10\n```\n\n### 高级数组操作\n\n## 3. 使用 Reduce 求数组和\n\n```javascript\nlet\
    \ numbers = [1, 2, 3, 4, 5];\nlet sum = numbers.reduce((acc, curr) => acc + curr,\
    \ 0);  // 输出: 15\n```\n\n## 4. 结合使用 Filter 和 Map\n\n```javascript\nlet numbers\
    \ = [1, 2, 3, 4, 5];\nlet filteredAndDoubled = numbers.filter(num => num % 2 ===\
    \ 0).map(num => num * 2);  // 输出: [4, 8]\n```\n\n### 高级对象操作\n\n## 5. 带有默认值的对象解构\n\
    \n```javascript\nlet person = { name: 'Alice' };\nlet { name, age = 30 } = person;\n\
    ```\n\n## 6. 计算属性名\n\n```javascript\nlet key = 'dynamicKey';\nlet obj = { [key]:\
    \ 'value' };  // { dynamicKey: 'value' }\n```\n\n### 高级循环与迭代\n\n## 7. 用于对象的 For...In\
    \ 循环\n\n```javascript\nlet obj = { a: 1, b: 2, c: 3 };\nfor (let key in obj) {\n\
    \  console.log(key, obj[key]);\n}\n```\n\n## 8. 对可迭代对象使用 For...Of\n\n```javascript\n\
    let iterable = ['a', 'b', 'c'];\nfor (let value of iterable) {\n  console.log(value);\n\
    }\n```\n\n### Promise 和 Async/Await\n\n## 9. Promise 链\n\n```javascript\nfunction\
    \ asyncFunction() {\n  return new Promise((resolve, reject) => {\n    setTimeout(()\
    \ => {\n      resolve('第一部分完成');\n    }, 1000);\n  });\n}\n\nasyncFunction()\n\
    .then(result => {\n  console.log(result);\n  return '第二部分完成';\n})\n.then(result\
    \ => console.log(result));\n```\n\n## 10. 带有错误处理的 Async/Await\n\n```javascript\n\
    function fetchData() {\n  return new Promise((resolve, reject) => {\n    setTimeout(()\
    \ => {\n      reject('获取失败');\n    }, 1000);\n  });\n}\n\nasync function start()\
