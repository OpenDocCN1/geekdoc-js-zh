    These examples demonstrate how to create basic graphics, charts, and visualizations
    using different JavaScript libraries such as `Canvas`, `Plotly`, `Chart.js`, `Google
    Charts`, and `D3.js`. They serve as a starting point for building more complex
    and customized graphical representations in web applications.


    ### Basic Examples:


    #### 1. Convert Celsius to Fahrenheit

    ```javascript

    function celsiusToFahrenheit(celsius)  {

    return (celsius  *  9 /  5) +  32;

    }

    let tempInFahrenheit  =  celsiusToFahrenheit(25);  // Output:  77

    ```


    #### 2. Calculate Area of a Circle

    ```javascript

    function calculateCircleArea(radius)  {

    return Math.PI *  radius  *  radius;

    }

    let area  =  calculateCircleArea(5);  // Output: ~78.54

    ```


    ### String Manipulation:


    #### 3. Reverse a String

    ```javascript

    function reverseString(str)  {

    return str.split('''').reverse().join('''');

    }

    let reversed  =  reverseString(''hello'');  // Output: ''olleh''

    ```


    #### 4. Check for Palindrome

    ```javascript

    function isPalindrome(str)  {

    return str  ===  str.split('''').reverse().join('''');

    }

    let checkPalindrome  =  isPalindrome(''madam'');  // Output: true

    ```


    ### Array Manipulation:


    #### 5. Find Maximum Number in Array

    ```javascript

    let numbers  = [5, 8, 3, 12, 6];

    let maxNumber  =  Math.max(...numbers);  // Output: 12

    ```


    #### 6. Sort Array of Objects by Property

    ```javascript

    let products  = [

    { name:  ''Laptop'', price:  800 },

    { name:  ''Phone'', price:  600 },

    { name:  ''Tablet'', price:  300 }

    ];

    products.sort((a, b) =>a.price - b.price);

    ```


    ### Functions:


    #### 7. Higher-Order Function - Map

    ```javascript

    let numbers  = [1, 2, 3];

    let doubled  =  numbers.map(num => num  *  2);  // Output: [2, 4, 6]

    ```


    #### 8. Immediately Invoked Function Expression (IIFE)

    ```javascript

    (function()  {

    console.log(''IIFE executed.'');

    })();

    ```


    ### Object Manipulation:


    #### 9. Object Destructuring

    ```javascript

    let person  =  { name:  ''Alice'', age:  30 };

    let { name, age }  =  person;

    ```


    #### 10. Merge Objects

    ```javascript

    let obj1  =  { a:  1, b:  2 };

    let obj2  =  { c:  3, d:  4 };

    let mergedObj  =  { ...obj1, ...obj2 };

    ```


