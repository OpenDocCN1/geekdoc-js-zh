    \ 10. 用于简洁函数定义的箭头函数\n\n```javascript\nconst sum = (a, b) => a + b;\n\nconsole.log(sum(2,\
    \ 3));  // 输出: 5\n```\n\n这些 JavaScript 代码段深入探讨了高级函数操作、数组操作、对象方法、Promise 以及 async/await\
    \ 功能，以及如对象解构和箭头函数等 ES6+ 特性。\n\n## 高级函数与操作\n\n### 1. IIFE（立即执行函数表达式）\n\n```javascript\n\
    (function() {\nconst localVar = 'Local variable';\nconsole.log(localVar);\n})();\n\
    ```\n\n```javascript\n\n### 2. 返回多个值的函数\n\n```javascript\nfunction calculateValues(x,\
    \ y) {\n  return [x + y, x * y, x / y];\n}\nconst [sum, product, division] = calculateValues(10,\
    \ 5);\nconsole.log(sum, product, division);  // 输出: 15 50 2\n```\n\n## 高级数组操作\n\
    \n### 3. 使用 Array.map() 进行转换\n\n```javascript\nconst numbers = [1, 2, 3, 4, 5];\n\
    const doubledNumbers = numbers.map(num => num * 2);  // 输出: [2, 4, 6, 8, 10]\n\
    ```\n\n### 4. 使用 Array.find() 获取第一个匹配的元素\n\n```javascript\nconst users = [\n \
    \ { id: 1, name: 'Alice' },\n  { id: 2, name: 'Bob' },\n  { id: 3, name: 'Charlie'\
    \ }\n];\nconst user = users.find(user => user.id === 2);\nconsole.log(user); \
    \ // 输出: { id: 2, name: 'Bob' }\n```\n\n## 高级对象操作\n\n### 5. 使用 Object.freeze()\
    \ 防止对象修改\n\n```javascript\nconst obj = { prop: 'value' };\nObject.freeze(obj);\n\
    obj.prop = 'new value';  // 由于对象冻结，此更改不会生效\n```\n\n### 6. 使用 Object.values() 获取对象值\n\
    \n```javascript\nconst obj = { a: 1, b: 2, c: 3 };\nconst values = Object.values(obj);\
    \  // 输出: [1, 2, 3]\n```\n\n## 高级 Promise 和 Async/Await\n\n### 7. 使用 .then() 和\
    \ .catch() 的 Promise 链\n\n```javascript\nasync function fetchData() {\n  return\
    \ fetch('https://api.example.com/data')\n    .then(response => response.json())\n\
    \    .catch(error => console.error('获取数据出错:', error));\n}\n```\n\n### 8. 带有错误处理的\
    \ Async 函数\n\n```javascript\nasync function fetchData() {\n  try {\n    const\
    \ response = await fetch('https://api.example.com/data');\n    const data = await\
    \ response.json();\n    console.log(data);\n  } catch (error) {\n    console.error('获取数据出错:',\
    \ error);\n  }\n}\n```\n\n## ES6+ 特性\n\n### 9. 用于对象属性的可链\n\n```javascript\nconst\
    \ user = { profile: { email: 'user@example.com' } };\nconst userEmail = user?.profile?.email;\
    \  // 输出: 'user@example.com'\n```\n\n### 10. 用于清理任务的 Promise.finally()\n\n```javascript\n\
    fetch('https://api.example.com/data')\n  .then(response => response.json())\n\
    \  .finally(() => console.log('数据获取完成'));  // 无论成功或拒绝都会执行\n```\n\n这些 JavaScript\
    \ 代码段探索了高级函数操作、数组操作、对象方法、Promise 以及 async/await 功能，以及如可选链和 promise finally 等 ES6+\
    \ 特性。\n\n## 高级 DOM 操作\n\n### 1. 创建并追加 DOM 元素\n\n```javascript\n// 创建一个新的段落元素\n\
    const paragraph = document.createElement('p');\nparagraph.textContent = '这是一个新段落';\n\
    // 将段落添加到 id 为 'container' 的现有元素中\nconst container = document.getElementById('container');\n\
    container.appendChild(paragraph);\n```\n\n### 2. 添加事件监听器\n\n```javascript\nconst\
    \ button = document.getElementById('myButton');\nbutton.addEventListener('click',\
    \ () => {\n  console.log('按钮被点击');\n});\n```\n\n## DOM 遍历与操作\n\n### 3. 查询元素并修改样式\n\
    \n```javascript\n// 选择所有类为 'box' 的元素并更改其背景颜色\nconst boxes = document.querySelectorAll('.box');\n\
    boxes.forEach(box => {\n  box.style.backgroundColor = 'lightblue';\n});\n```\n\
    \n### 4. 从 DOM 中移除元素\n\n```javascript\nconst elementToRemove = document.getElementById('elementToRemove');\n\
    if (elementToRemove) {\n  elementToRemove.remove();\n}\n```\n\n## 高级事件处理\n\n###\
    \ 5. 使用事件冒泡委托事件\n\n```javascript\nconst list = document.getElementById('myList');\n\
    list.addEventListener('click', (event) => {\n  if (event.target.tagName === 'LI')\
    \ {\n    console.log(`点击了列表项: ${event.target.textContent}`);\n  }\n});\n```\n\n\
    ### 6. 创建并派发自定义事件\n\n```javascript\nconst customEvent = new CustomEvent('customEvent',\
    \ { detail: 'some data' });\ndocument.dispatchEvent(customEvent);\n```\n\n## DOM\
    \ 操作\n\n### 7. 修改元素的内部内容\n\n```javascript\nconst element = document.getElementById('myElement');\n\
