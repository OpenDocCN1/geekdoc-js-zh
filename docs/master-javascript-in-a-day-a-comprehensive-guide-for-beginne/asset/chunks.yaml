    const form = document.getElementById('myForm');\nconst formData = new FormData(form);\n\
    const value = formData.get('inputFieldName');\nconsole.log(`提交了 ${value}`);\n\
    ```\n\n## 输入事件处理\n\n### 1. 用于字符数的输入事件\n\n```javascript\nconst inputField = document.getElementById('textInput');\n\
