    # 对象访问器


    JavaScript 对象中的访问器提供了获取和设置对象属性值的方法。


    ## 对象访问器示例：


    ### 使用 Getter（get 器）和 Setter（set 器）：


    ```javascript

    let user  = {

    firstName: ''John'',

    lastName: ''Doe'',

    get fullName() {

    return this.firstName + '' '' + this.lastName;

    },

