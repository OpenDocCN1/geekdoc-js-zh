    # JS 函数


    JavaScript 中的函数是可重用的代码块，在调用时执行特定任务。


    ## 函数定义：


    ### 函数声明：


    ```javascript

    function greet() {

    return ''Hello!'';

    }

    ```


    ### 函数表达式：


    ```javascript

    let greet  = function() {

    return ''Hello!'';

    };

    ```


    ### 箭头函数：


    ```javascript

    let greet = () => {

    return ''Hello!'';

    };

    ```


    # 函数参数


    函数参数是函数将接收值的占位符。


    ## 函数参数示例：


    ### 单个参数：


    ```javascript

    function greet(name) {

    return ''Hello, '' + name;

    }

    ```


    ### 多个参数：


    ```javascript

    function sum(a, b) {

    return a + b;

    }

    ```


    # 函数调用


    函数调用意味着执行函数以运行代码。


    ## 函数调用示例：


    ### 调用函数：


    ```javascript

    greet();

    ```


    ### 带参数调用：


    ```javascript

    sum(5, 3);

    ```


    # 函数 Call


    JavaScript 中的 `call()` 方法允许使用指定的 `this` 值调用函数。


    ## 函数 Call 示例：


    ### 使用 `call()`：


    ```javascript

    function greet(name) {

    return ''Hello, '' + name;

    }


    let person  = { name: ''Alice'' };

    greet.call(person);

    ```


    # 函数 Apply


    JavaScript 中的 `apply()` 方法允许使用指定的 `this` 值和数组形式提供的参数调用函数。


    ## 函数 Apply 示例：


    ### 使用 `apply()`：


    ```javascript

    function greet(name) {

    return ''Hello, '' + name;

    }

    let person  = { name: ''Bob'' };

    let args = [''Bob''];

    greet.apply(person, args);

    ```


    # 函数 Bind


    JavaScript 中的 `bind()` 方法创建一个新函数，当调用时，`this` 被设置为指定的值。


    ## 函数 Bind 示例：


    ### 使用 `bind()`：


    ```javascript

    function greet(name) {

    return ''Hello, '' + name;

    }

    let person  = { name: ''Charlie'' };

    let newGreet = greet.bind(person);

    newGreet();

    ```


