    # JavaScript 语句


    JavaScript 语句是浏览器执行的单个命令或指令。它们构成了程序的逻辑，可以是可以简单的也可以复杂的。


    ## JavaScript 语句示例：


    ### 1. 变量声明：


    ```javascript

    let x; // 声明一个变量 ''x''

    ```


    ### 2. 条件语句：


    ```javascript

    if (x === 5) {

    // 如果 x 等于 5

    console.log(''x is 5'');

    } else {

    // 如果 x 不等于 5

    console.log(''x is not 5'');

    }

    ```


    ### 3. 循环：


    ```javascript

    for (let i = 0; i < 5; i++) {

    // 执行 5 次

    console.log(i);

    }

    ```


    # JavaScript 语法


    JavaScript 语法是指定义有效 JavaScript 代码结构的规则。它规定了以解释器或浏览器理解的方式编写语句、变量和函数。


    ## JavaScript 语法示例：


    ### 1. 函数定义：


    ```javascript

    function greet(name) {

    return ''Hello, '' + name + ''!'';

    }

    ```


    ### 2. 对象字面量：


    ```javascript

    const person = {

    firstName: ''John'',

    lastName: ''Doe'',

    age: 30

    };

    ```


    ### 3. 数组声明：


    ```javascript

    const numbers = [1, 2, 3, 4, 5];

    ```


