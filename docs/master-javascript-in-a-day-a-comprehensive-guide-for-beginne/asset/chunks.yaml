    # JS JSON


    JSON (JavaScript Object Notation)  is a lightweight data interchange format that
    is easy for humans to read and write and easy for machines to parse and generate.  It
    is commonly used to transmit data between a server and a web application.


    ## JSON Intro


    JSON serves as a language-independent data format derived from JavaScript object
    literals.  It''s widely used for data exchange between web servers and web clients.


    ### Example of JSON Data:


    json code


    {


    "name": "John Doe",


    "age": 30,


    "email": "john@example.com",


    "isStudent": false,


    "address": {


    "street": "123 Main St",


    "city": "Anytown"


    },


    "hobbies": ["reading", "coding", "traveling"]


    }


    ## JSON Syntax


    JSON syntax is derived from JavaScript object notation, consisting of key-value
    pairs enclosed in curly braces  {}, and values can be strings, numbers, objects,
    arrays, booleans, or null.


    ### Example of JSON Syntax:


    json code


    {


    "key1": "value1",


    "key2": 123,


    "key3": true,


    "key4": null,


    "key5": {


    "nestedKey": "nestedValue"


    },


    "key6": ["arrayValue1", "arrayValue2"]


    }


    ## JSON vs XML


    JSON and XML are both used for data interchange, but JSON is generally more lightweight
    and easier to read and parse than XML.


    ### Example Comparison between JSON and XML:


    json code


    //  JSON


    {


    "name": "John",


    "age": 25,


    "city": "New York"


    }


    xml code


    <!--  XML  -->


    <user>


    <name>John</name>


    <age>25</age>


    <city>New York</city>


    </user>


    ## JSON Data Types


    JSON supports several data types:  strings, numbers, booleans, objects, arrays,
    null.


    ### Example of Different Data Types in JSON:


    json code


    {


    "string": "Hello, World!",


    "number": 42,


    "boolean": true,


    "nullValue": null,


    "object": { "key": "value" },


    "array": [1, 2, 3]


    }


    ## JSON Parse


    JSON.parse() is a method in JavaScript used to parse JSON data into a JavaScript
    object.


    ### Example of JSON Parsing:


    javascript code


    let jsonString  =  ''{"name": "Alice", "age":  28}'';


    let jsonObj  =  JSON.parse(jsonString);


    console.log(jsonObj.name);  //  Output:  Alice


    ## JSON Stringify


    JSON.stringify() is a method in JavaScript used to convert a JavaScript object
    into a JSON string.


    ### Example of JSON Stringification:


    javascript code


    let obj  =  { name: "Bob", age:  30 };


    let jsonString  =  JSON.stringify(obj);


    console.log(jsonString);  //  Output: {"name":"Bob","age":30}


