    \  // 输出: 5e-324\n```\n\n本综合指南涵盖了 JavaScript 的各个方面，包括算术运算、赋值、数据类型、函数、对象、事件、字符串、字符串方法、字符串搜索、字符串模板、数字、BigInt、数字方法和数字属性，为每个主题提供了示例和解释。\n\
    \n# JS 数组 (Arrays)\n\nJavaScript 中的数组用于在单个变量中存储多个值。\n\n## JS 数组示例：\n\n### 声明：\n\
    \n```javascript\nlet numbers  = [1, 2, 3, 4, 5];  // 数字数组\nlet fruits  = ['apple',\
    \ 'banana', 'orange'];  // 字符串数组\n```\n\n### 访问元素：\n\n```javascript\nconsole.log(fruits[0]);\
    \  // 输出: 'apple'\n```\n\n### 修改元素：\n\n```javascript\nfruits[1] = 'grapes';  //\
    \ 将 'banana' 改为 'grapes'\n```\n\n# JS 数组方法\n\nJavaScript 提供了各种方法来高效地操作数组。\n\n\
    ## JS 数组方法示例：\n\n### `push()` 方法：\n\n```javascript\nfruits.push('melon');  //\
    \ 在数组末尾添加 'melon'\n```\n\n### `pop()` 方法：\n\n```javascript\nlet removedFruit \
    \ = fruits.pop();  // 并返回最后一个元素 ('melon')\n```\n\n### `splice()` 方法：\n\n```javascript\n\
    numbers.splice(2, 1);  // 删除索引为 2 处的 1 个元素（删除 '3'）\n```\n\n# JS 数组排序\n\nJavaScript\
    \ 提供了以各种方式排序数组的方法。\n\n## JS 数组排序示例：\n\n### 数字排序：\n\n```javascript\nnumbers.sort((a,\
    \ b) => a  - b);  // 升序\n```\n\n### 字符串排序：\n\n```javascript\nfruits.sort();  //\
    \ 字母顺序\n```\n\n# JS 数组迭代\n\n数组迭代涉及遍历数组以对每个元素执行操作。\n\n## JS 数组迭代示例：\n\n### `forEach()`\
    \ 方法：\n\n```javascript\nnumbers.forEach(number => {\n  console.log(number);\n\
    });\n```\n\n### `map()` 方法：\n\n```javascript\nlet doubledNumbers  = numbers.map(number\
    \ => number  *  2);\n```\n\n# JS 数组常量 (Const)\n\n用 `const` 声明的数组不能重新赋值，但它们的元素可以被修改。\n\
    \n## JS 数组常量示例：\n\n```javascript\nconst weekdays  = ['Monday', 'Tuesday', 'Wednesday'];\n\
    weekdays[1] = 'Thursday';  // 允许修改元素\n// weekdays  = ['Monday', 'Thursday', 'Wednesday'];\
    \   这会导致错误\n```\n\n# JS 日期 (Dates)\n\nJavaScript 提供了一个 `Date` 对象来处理日期时间。\n\n##\
    \ JS 日期示例：\n\n### 创建日期对象：\n\n```javascript\nlet currentDate  = new Date();  //\
    \ 当前日期时间\n```\n\n### 创建特定日期：\n\n```javascript\nlet specificDate  = new Date('2023-12-31');\
    \  // 2023 年 12 月 31 日\n```\n\n# JS 日期格式\n\nJavaScript 中的日期格式涉及将日期转换为不同的格式。\n\n\
    ## JS 日期格式示例：\n\n### 格式化字符串：\n\n```javascript\nlet dateString  = specificDate.toDateString();\
    \  // 转换为人类可读的字符串\n```\n\n### 格式化为本地字符串：\n\n```javascript\nlet localeString  =\
    \ specificDate.toLocaleString();  // 转换为本地日期时间字符串\n```\n\n# JS 日期获取方法 (Get)\n\n\
    JavaScript `Date` 对象提供了各种方法来获取特定的日期组件。\n\n## JS 日期获取方法示例：\n\n### `getFullYear()`\
    \ 方法：\n\n```javascript\nlet year  = specificDate.getFullYear();  // 获取年份 (2023)\n\
    ```\n\n### `getMonth()` 方法：\n\n```javascript\nlet month  = specificDate.getMonth();\
    \  // 获取月份 (12 月为 11)\n```\n\n# JS 日期设置方法 (Set)\n\nJavaScript `Date` 对象也有设置特定日期组件的方法。\n\
    \n## JS 日期设置方法示例：\n\n### `setFullYear()` 方法：\n\n```javascript\nspecificDate.setFullYear(2024);\
    \  // 将年份设置为 2024\n```\n\n### `setMonth()` 方法：\n\n```javascript\nspecificDate.setMonth(0);\
    \  // 将月份设置为 1 月（索引 0）\n```\n\n# JS 数学 (Math)\n\nJavaScript `Math` 对象提供了数学常量和函数。\n\
    \n## JS 数学示例：\n\n### `Math.PI` 属性：\n\n```javascript\nlet piValue  = Math.PI; \
    \ // PI 的值 (3.141592653589793)\n```\n\n### `Math.sqrt()` 方法：\n\n```javascript\n\
    let squareRoot  = Math.sqrt(25);  // 25 的平方根 (5)\n```\n\n# JS 随机 (Random)\n\n\
    JavaScript `Math.random()` 生成伪随机数。\n\n## JS 随机示例：\n\n### 生成随机数：\n\n```javascript\n\
    let randomNumber  = Math.random();  // 0 到 1 之间的随机数\n```\n\n### 生成随机整数：\n\n```javascript\n\
    let randomInteger  = Math.floor(Math.random() * 10);  // 0 到 9 之间的随机整数\n```\n\n\
    # JS 布尔值 (Booleans)\n\nJavaScript 中的布尔值表示真或假值。\n\n## JS 布尔值示例：\n\n### 声明：\n\n\
    ```javascript\nlet isTrue  = true;\nlet isFalse  = false;\n```\n\n### 比较：\n\n\
    ```javascript\nlet greaterThan  = 5 > 3;  // true\nlet equalTo  = 5 === 3;\n```\n\
    \n# JS 比较 (Comparisons)\n\nJavaScript 提供了各种运算符来比较值。\n\n## JS 比较示例：\n\n### `==`\
    \ 运算符：\n\n```javascript\nlet greaterThan  = 5 > 3;  // true\n```\n\n### `===`\
    \ 运算符：\n\n```javascript\nlet equalTo  = 5 === 3;\n```\n\n# JS If Else \n\n`if...else`\
    \ 语句在条件为真时执行代码块。\n\n## JS If Else 示例：\n\n### 基础 `if...else`：\n\n```javascript\n\
    let num  = 10;\nif (num > 0) {\n  console.log('Number is positive');\n} else {\n\
    \  console.log('Number is negative');\n}\n```\n\n### 嵌套 `if...else`：\n\n```javascript\n\
    let x  = 5;\nif (x > 0) {\n  console.log('x is positive');\n} else if (x < 0)\
    \ {\n  console.log('x is negative');\n} else {\n  console.log('x is zero');\n\
    }\n```\n\n# JS Switch\n\n`switch` 语句根据不同条件执行操作。\n\n## JS Switch 示例：\n\n### 基础\
    \ `switch`：\n\n```javascript\nlet day  = 2;\nswitch (day) {\n  case 1:\n    console.log('Monday');\n\
    \    break;\n  case 2:\n    console.log('Tuesday');\n    break;\n  default:\n\
    \    console.log('Other day');\n}\n```\n\n# JS For 循环\n\nJavaScript 中的 `for` 循环在指定条件为假之前重复执行代码块。\n\
    \n## JS For 循环示例：\n\n### 基础 `for` 循环：\n\n```javascript\nfor (let i  = 0; i < 5;\
    \ i++) {\n  console.log(i);\n}\n```\n\n### 遍历数组元素：\n\n```javascript\nlet arr \
    \ = ['apple', 'banana', 'orange'];\nfor (let i  = 0; i < arr.length; i++) {\n\
    \  console.log(arr[i]);\n}\n```\n\n# JS For In 循环\n\n`for...in` 循环在 JavaScript\
    \ 中遍历对象的可枚举属性。\n\n## JS For In 循环示例：\n\n### 遍历对象属性：\n\n```javascript\nlet person\
    \  = {\n  name:  'Alice',\n  age:  30,\n  gender:  'female'\n};\nfor (let prop\
    \ in person) {\n  console.log(prop + ': ' + person[prop]);\n}\n```\n\n# JS For\
    \ Of 循环\n\n`for...of` 循环在 JavaScript 中遍历迭代对象（如数组、字符串等）。\n\n## JS For Of 循环示例：\n\
    \n### 遍历数组元素：\n\n```javascript\nlet numbers  = [1, 2, 3, 4, 5];\nfor (let num\
    \ of numbers) {\n  console.log(num);\n}\n```\n\n# JS While 循环\n\n`while` 循环在指定条件为真时执行代码块。\n\
    \n## JS While 循环示例：\n\n### 基础 `while` 循环：\n\n```javascript\nlet count  = 0;\n\
    while (count < 5) {\n  console.log(count);\n  count++;\n}\n```\n\n# JS Break 语句\n\
    \n`break` 语句在 JavaScript 中终止当前循环或 switch 语句。\n\n## JS Break 示例：\n\n### 在循环中使用\
    \ `break`：\n\n```javascript\nfor (let i  = 0; i < 10; i++) {\n  if (i  === 5)\
    \ {\n    break;\n  }\n  console.log(i);\n}\n```\n\n# JS 可迭代对象 (Iterables)\n\n\
    JavaScript 中的迭代对象可以使用循环遍历的对象。\n\n## JS 可迭代对象示例：\n\n### 使用 `for...of` 使用迭代对象：\n\
    \n```javascript\nlet iterable  = [10, 20, 30];\n```\n\n"
