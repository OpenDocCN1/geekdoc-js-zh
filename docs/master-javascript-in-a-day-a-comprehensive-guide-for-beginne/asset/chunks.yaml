    \n```javascript\nlet strNumber  = '10';\nlet num  = parseInt(strNumber);\n```\n\
    \n### Number to String:\n\n```javascript\nlet number  = 15;\nlet str  = number.toString();\n\
    ```\n\n# JS Bitwise\n\nBitwise operators in JavaScript perform operations on the\
