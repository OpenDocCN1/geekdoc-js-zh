    这些 JavaScript 代码段演示了输入事件处理、表单验证、基于输入变化的实时 UI 更新，以及 HTML 表单中高级的输入处理技术（如输入掩码和范围输入处理）。


    ## DOM 对象的创建与操作


    1. 创建并添加新的图像元素：


    ```javascript

    const image  =  document.createElement(''img'');

    image.src =  ''path/to/image.jpg'';

    image.alt =  ''Image Description'';

    const container  =  document.getElementById(''imageContainer'');

    container.appendChild(image);

    ```


    2. 向 Select 元素中添加新选项：


    ```javascript

    const select  =  document.getElementById(''mySelect'');

    const option  =  document.createElement(''option'');

    option.value =  ''value1'';

    option.text =  ''Option Text'';

    select.appendChild(option);

    ```


    ## 高级对象操作


    3. 为 HTML 元素设置自定义属性：


    ```javascript

    const element  =  document.getElementById(''myElement'');

    element.setAttribute(''data-custom'', ''customValue'');

    ```


    4. 从元素中移除特定属性：


    ```javascript

    const element  =  document.getElementById(''myElement'');

    element.removeAttribute(''data-custom'');

    ```


    ## 为 HTML 对象设置样式


    5. 修改元素的 CSS 属性：


    ```javascript

    const element  =  document.getElementById(''myElement'');

    element.style.backgroundColor =  ''blue'';

    element.style.color =  ''white'';

    ```


    6. 添加和移除 CSS 类：


    ```javascript

    const element  =  document.getElementById(''myElement'');

    element.classList.add(''newClass'');

    element.classList.remove(''oldClass'');

    ```


    ## 事件处理与交互


    7. 创建并处理鼠标悬停效果：


    ```javascript

    const element  =  document.getElementById(''myElement'');

    element.addEventListener(''mouseenter'',  () => {

    element.style.backgroundColor =  ''red'';

    });

    element.addEventListener(''mouseleave'',  () => {

    element.style.backgroundColor =  ''blue'';

    });

    ```


    8. 通过代码触发点击事件：


    ```javascript

    const button  =  document.getElementById(''myButton'');

    button.click();  // 在按钮元素上触发点击事件

    ```


    ## 高级内容操作


    9. 使用 InnerHTML 设置 HTML 内容：


    ```javascript

    const element  =  document.getElementById(''myElement'');

    element.innerHTML =  ''<strong>New HTML Content</strong>'';

    ```


    10. 向元素中添加文本节点：


    ```javascript

    const element  =  document.getElementById(''myElement'');

    const textNode  =  document.createTextNode(''Text Content'');

    element.appendChild(textNode);

    ```


    这些 JavaScript 代码段演示了创建、操作和与 HTML 对象交互的高技术，包括 DOM 创建、对象操作、样式设置、事件处理和内容操作。


    ## 事件处理


    1. 键盘事件处理 - 按按下：


    ```javascript

    document.addEventListener(''keypress'', (event) => {

    console.log(`Key pressed:  ${event.key}`);

    });

    ```


    2. 处理焦点事件 - 输入聚焦与失焦：


    ```javascript

    const inputField  =  document.getElementById(''myInput'');

    inputField.addEventListener(''focus'',  () => {

    console.log(''Input field focused'');

    });

    inputField.addEventListener(''blur'',  () => {

    console.log(''Input field blurred'');

    });

    ```


    ## 事件委托与冒泡


    3. 使用点击事件进行事件委托：


    ```javascript

    const list  =  document.getElementById(''myList'');

    list.addEventListener(''click'', (event) => {

    if (event.target.tagName ===  ''LI'') {

    console.log(`Clicked on list item:  ${event.target.textContent}`);

    }

    });

    ```


    4. 事件冒泡 - 父元素上的点击事件：


    ```javascript

    const parent  =  document.getElementById(''parentElement'');

    parent.addEventListener(''click'', (event) => {

    console.log(`Clicked on parent element`);

    });

    ```


    ## 与文档事件


    5. 窗口加载事件：


    ```javascript

    window.addEventListener(''load'',  () => {

    console.log(''Page fully loaded'');

    });

    ```


    6. 文档就绪事件 (DOMContentLoaded)：


    ```javascript

    document.addEventListener(''DOMContentLoaded'',  () => {

    console.log(''DOM fully loaded and parsed'');

    });

    ```


    ## 表单事件


    7. 表单提交与阻止默认行为：


    ```javascript

    const form  =  document.getElementById(''myForm'');

    form.addEventListener(''submit'', (event) => {

    event.preventDefault();

    console.log(''Form submitted'');

    // 执行表单数据处理或验证

    });

    ```


    8. 用于实时验证的输入事件：


    ```javascript

    const emailField  =  document.getElementById(''email'');

    emailField.addEventListener(''input'',  () => {

    if (!emailField.validity.valid) {

    emailField.setCustomValidity(''Enter a valid email address'');

    } else {

    emailField.setCustomValidity('''');

    }

    });

    ```


    这些 JavaScript 代码段展示了各种事件处理技术，包括键盘事件、聚焦与模糊事件、事件委托、冒泡、窗口和文档事件，以及用于提交和输入验证的表单事件。


    ## 浏览器对象模型 (BOM) 操作


    1. 打开新浏览器窗口：


    ```javascript

    const openWindowButton  =  document.getElementById(''openWindowButton'');

    openWindowButton.addEventListener(''click'',  () => {

    window.open(''https://example.com'', ''_blank'', ''width=500,height=500'');

    });

    ```


    2. 关闭浏览器窗口：


    ```javascript

    const closeWindowButton  =  document.getElementById(''closeWindowButton'');

    closeWindowButton.addEventListener(''click'',  () => {

    window.close();

    });

    ```


    ## Navigator 对象


    3. 访问浏览器信息：


    ```javascript

    console.log(`Browser name:  ${navigator.appName}`);

    console.log(`Browser version:  ${navigator.appVersion}`);

    console.log(`User Agent:  ${navigator.userAgent}`);

    console.log(`Language:  ${navigator.language}`);

    ```


    4. 检查地理定位可用性：


    ```javascript

    if (''geolocation'' in navigator) {

    console.log(''Geolocation is supported'');

    } else {

    console.log(''Geolocation is not supported'');

    }

    ```


    ## Location 对象操作


    5. 跳转到另一个页面：


    ```javascript

    function redirectToPage() {

    window.location.href =  ''https://example.com'';

    }

    ```


    6. 访问当前 URL 信息：


    ```javascript

    console.log(`Current URL:  ${window.location.href}`);

    console.log(`Hostname:  ${window.location.hostname}`);

    console.log(`Protocol:  ${window.location.protocol}`);

    console.log(`Pathname:  ${window.location.pathname}`);

    ```


    ## Screen 对象属性


    7. 获取屏幕尺寸：


    ```javascript

    console.log(`Screen width:  ${window.screen.width}`);

    console.log(`Screen height:  ${window.screen.height}`);

    ```


    8. 进入全屏模式：


    ```javascript

    const fullScreenButton  =  document.getElementById(''fullScreenButton'');

    fullScreenButton.addEventListener(''click'',  () => {

    if (document.fullscreenEnabled) {

    document.documentElement.requestFullscreen();

    }

    });

    ```


    这些 JavaScript 代码段展示了使用浏览器对象模型 (BOM) 操作浏览器、navigator 和 location 对象、屏幕属性、打开/关闭窗口、浏览器信息、地理定位可用性、URL
    操作以及全屏功能。


    ### 安装 JavaScript


    JavaScript 是一种在浏览器中运行的解释型编程语言。由于它不是一个需要安装的独立实体，你不需要安装 JavaScript 本身；你在支持其执行的环境中使用
    JavaScript，例如 浏览器和服务器端平台 Node.js。


    ### 为 Visual Studio Code 配置 JavaScript 开发


    ### 1. 下载并安装 Visual Studio Code：


    访问 [Visual Studio Code 网站](https://code.visual.com/) 下载适用于你操作系统的安装程序。运行安装程序并按照安装说明进行。


    ### 2. 安装 Node.js（可选但推荐用于开发）：


    '
- fmt: '

    Node.js is a JavaScript runtime environment that allows executing JavaScript outside
    a web browser. You can download Node.js from the [official website](https://nodejs.org/),
    install it, and it will include the Node Package Manager (`npm`) with it. This
    is useful for running JavaScript programs locally and managing dependencies.


    ### 3. Install Visual Studio Code Extensions


    * `JavaScript (ES6) Code Snippets`: Provides handy code snippets for JavaScript
    development. Search for it in the Extensions tab in VS Code and install it.

    * `Prettier` - Code formatter: For auto-formatting your code according to predefined
    rules. It''s optional but highly recommended.


    ### 4. Create a JavaScript Project


    * Open Visual Studio Code.

    * Create a new folder for your project or open an existing one.

    * Inside the folder, create a new JavaScript file with the `.js` extension. Right-click
    in the Explorer panel > New File > `script.js`.


    ### 5. Writing and Running JavaScript Code


    * Write your JavaScript code in the `script.js` file.

    * To run JavaScript code, open the integrated terminal in Visual Studio Code (`Terminal
    > New Terminal`), navigate to your project directory, and run the JavaScript file
    using Node.js. For example:


    ```bash

    node script.js

    ```

    * To execute JavaScript code in a browser, create an HTML file (`index.html`)
    and link your JavaScript file in it using the `<script>` tag. Open the HTML file
    in your preferred web browser.


    ### 6. Debugging JavaScript


    * Visual Studio Code has a powerful built-in debugger. You can set breakpoints
    in your code, inspect variables, and step through your code execution line by
    line.

    * To use the debugger, add breakpoints by clicking in the margin next to your
    code line numbers. Then, run your JavaScript code in debug mode (click the Debug
    icon in the left sidebar).


    ### Conclusion


    That''s a basic setup to start coding in JavaScript with Visual Studio Code. Remember,
    JavaScript development often involves web development, where you''ll need to write
    JavaScript code within HTML/CSS files. For web-based development, you''d generally
    use VS Code to manage the entire project structure.


    Additionally, for more advanced development or working on larger projects, using
    a module bundler like `Webpack` or a task runner like `Gulp` might be beneficial
    to enhance your development environment further.

