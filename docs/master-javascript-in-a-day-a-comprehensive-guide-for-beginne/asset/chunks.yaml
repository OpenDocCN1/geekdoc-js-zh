    \ 5);  // Output: 'number'\nconsole.log(typeof 'Hello');  // Output: 'string'\n\
    console.log(typeof true);  // Output: 'boolean'\n```\n\n# JS Type Conversion\n\
    \nType conversion in JavaScript involves converting values from one data type\
