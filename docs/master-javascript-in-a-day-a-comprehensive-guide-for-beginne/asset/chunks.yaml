    ```javascript

    let mySet  = new Set();

    mySet.add(1);

    mySet.add(2);

    mySet.add(3);

    ```


    ### 检查 Set 成员：


    ```javascript

    console.log(mySet.has(2));  // 输出: true

    ```


    # 对象 Map


    JavaScript 中的 Map 是键值对集合，键可以是任何类型。


    ## 对象 Map 示例：


