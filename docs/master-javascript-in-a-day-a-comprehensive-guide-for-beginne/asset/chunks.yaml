    \n## 12. 事件委托\n\n```javascript\nlet button = document.getElementById('myButton');\n\
    button.addEventListener('click', () => {\n  console.log('按钮被点击了！');\n});\n```\n\
    \n## 13. 模板字符串\n\n```javascript\nlet name = 'Alice';\nlet message = `Hello, ${name}!`;\n\
    ```\n\n## 14. 展开运算符\n\n```javascript\nlet arr = [1, 2, 3];\nlet newArr = [...arr,\
    \ 4, 5];\n```\n\n## 15. 抛出错误\n\n```javascript\nfunction validateNumber(num) {\n\
    \  if (typeof num !== 'number') {\n    throw new Error('无效数字');\n  }\n}\n\ntry\
    \ {\n  validateNumber('abc');\n} catch (error) {\n  console.error(error.message);\n\
    }\n```\n\n## 16. 正则表达式\n\n```javascript\nlet emailPattern = /^[^\\@]+@[^\\@]+\\\
    .[^\\@]+$/;\nlet isValidEmail = emailPattern.test('test@example.com'); // true\n\
    ```\n\n这些示例深入探讨了 JavaScript 的高级功能。\n"
- fmt: "\n```\ntryCatchFinally();\n```\n\n## 10. Custom Error Class\n\n```javascript\n\
    class CustomError extends Error {\n  constructor(message) {\n    super(message);\n\
    \    this.name = this.constructor.name;\n  }\n}\n\nthrow new CustomError('Custom\
    \ error message');\n```\n\nThese additional code snippets expand on various JavaScript\
    \ concepts such as higher-order functions, array methods, object manipulation,\
    \ advanced loops, error handling, and new features like optional chaining and\
    \ `async/await`.\n\n### Advanced Object Manipulation\n\n#### 1. `Object.defineProperty`\
    \ for Property Definition\n\n```javascript\nlet obj = {};\nObject.defineProperty(obj,\
    \ 'fullName', {\n  value: 'Alice Smith',\n  writable: false,\n  configurable:\
    \ true\n});\n```\n\n#### 2. `Object.setPrototypeOf` for Setting Prototype\n\n\
    ```javascript\nlet animal = {\n  makeSound() {\n    console.log('Animal sound');\n\
    \  }\n};\nlet dog = {};\nObject.setPrototypeOf(dog, animal);\ndog.makeSound();\
    \  // Output: 'Animal sound'\n```\n\n### Advanced Array Manipulation\n\n#### 3.\
    \ Using `Set` to Get Unique Values\n\n```javascript\nlet numbers = [1, 2, 2, 3,\
    \ 4, 4, 5];\nlet uniqueNumbers = [...new Set(numbers)];  // Output: [1, 2, 3,\
    \ 4, 5]\n```\n\n#### 4. `Array.find` to Get First Matching Element\n\n```javascript\n\
    let users = [\n  { id: 1, name: 'Alice' },\n  { id: 2, name: 'Bob' },\n  { id:\
    \ 3, name: 'Charlie' }\n];\nlet user = users.find(user => user.id === 2);  //\
    \ Output: { id: 2, name: 'Bob' }\n```\n\n### Advanced Functionality\n\n#### 5.\
    \ Generator Function\n\n```javascript\nfunction* generatorFunction() {\n  yield\
    \ 1;\n  yield 2;\n  yield 3;\n}\nlet generator = generatorFunction();\nconsole.log(generator.next().value);\
    \  // Output: 1\nconsole.log(generator.next().value);  // Output: 2\n```\n\n####\
    \ 6. Async Generator Function\n\n```javascript\nasync function* asyncGenerator()\
    \ {\n  yield 'First';\n  await new Promise(resolve => setTimeout(resolve, 1000));\n\
    \  yield 'Second';\n}\n(async () => {\n  for await (let item of asyncGenerator())\
    \ {\n    console.log(item);  // Output: 'First' after 0ms, 'Second' after 1000ms\n\
    \  }\n})();\n```\n\n### Advanced Error Handling\n\n#### 7. Handling Rejected Promises\
    \ with `catch`\n\n```javascript\nPromise.reject('Error message')\n  .catch(error\
    \ => console.error('Caught error:', error));\n```\n\n#### 8. Handling Multiple\
    \ Promises with `Promise.all`\n\n```javascript\nlet promise1 = Promise.resolve('First');\n\
    let promise2 = Promise.resolve('Second');\nPromise.all([promise1, promise2])\n\
    \  .then(values => console.log(values));  // Output: ['First', 'Second']\n```\n\
    \n### ES6+ Features\n\n#### 9. Destructuring Nested Objects\n\n```javascript\n\
    let user = {\n  id: 1,\n  details: {\n    name: 'Alice',\n    age: 30\n  }\n};\n\
    let { details: { name, age } } = user;\n```\n\n#### 10. `BigInt` Data Type\n\n\
    ```javascript\nconst bigNumber = BigInt(Number.MAX_SAFE_INTEGER) + BigInt(1);\
    \  // BigInt: 9007199254740992n + 1n\n```\n\nThese code snippets expand on JavaScript\
    \ functionalities like object manipulation, array methods, generator functions,\
    \ async operations, error handling with promises, and ES6+ features like destructuring\
    \ and `BigInt` data type.\n\n### Advanced Functions and Operations\n\n#### 1.\
    \ Memoization using Closure\n\n```javascript\nfunction memoize(fn) {\n  const\
    \ cache = {};\n  return function(...args) {\n    const key = JSON.stringify(args);\n\
    \    if (cache[key]) {\n      return cache[key];\n    }\n    const result = fn.apply(this,\
    \ args);\n    cache[key] = result;\n    return result;\n  };\n}\n\nfunction factorial(n)\
    \ {\n  if (n === 0 || n === 1) {\n    return 1;\n  }\n  return n * factorial(n\
    \ - 1);\n}\nconst memoizedFactorial = memoize(factorial);\n```\n\n#### 2. Function\
    \ Composition\n\n```javascript\nconst add = x => x + 5;\nconst multiply = x =>\
    \ x * 2;\nconst compose = (...fns) => x => fns.reduceRight((acc, fn) => fn(acc),\
    \ x);\nconst addAndMultiply = compose(multiply, add);\n```\n\n### Advanced Array\
    \ Manipulation\n\n#### 3. Using `Flat` to Flatten Nested Arrays\n\n```javascript\n\
    let nestedArr = [1, [2, [3, 4], 5], 6];\nlet flattenedArr = nestedArr.flat(Infinity);\
    \  // Output: [1, 2, 3, 4, 5, 6]\n```\n\n#### 4. Using `Some` and `Every` Methods\n\
    \n```javascript\nlet numbers = [2, 4, 6, 7];\nlet allEven = numbers.every(num\
    \ => num % 2 === 0);  // false\nlet hasOdd = numbers.some(num => num % 2 !== 0);\
    \  // true\n```\n*(Note: The original text had some fragmented logic in section\
    \ 4, I have cleaned the logic to reflect standard JS usage while maintaining the\
    \ core intent.)*\n"
