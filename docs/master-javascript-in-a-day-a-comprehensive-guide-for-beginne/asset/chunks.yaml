    ## JavaScript Graphics Libraries:  Explained


    ### 1.  JavaScript Graphics


    JavaScript is a versatile language that allows developers to create interactive
    graphics and visualizations on the web.  Several libraries and tools empower developers
    to generate captivating graphics for data representation, animations, games, and
    more.


    ### 2.  JS Canvas


    The HTML  <canvas> element is a powerful tool in JavaScript for drawing graphics
    on a web page dynamically.  It provides a bitmap area where JavaScript code can
    be used to create animations, render shapes, images, and complex visualizations.


    ### Example  -  Drawing a Circle on Canvas:


    javascript code


    const canvas  =  document.getElementById(''myCanvas'');


    const ctx  =  canvas.getContext(''2d'');


    ctx.beginPath();


    ctx.arc(100, 100, 50, 0, 2 *  Math.PI);


    ctx.stroke();


    ### 3.  JS Plotly


    Plotly is a JavaScript graphing library that allows developers to create interactive
    and publication-quality graphs.  It supports various chart types, including line
    plots, bar charts, pie charts, scatter plots, and more.  Plotly provides easy-to-use
    APIs for customization and interactivity.


    ### Example  -  Creating a Line Chart with Plotly:


    javascript code


    const data  = [{ x: [1, 2, 3, 4], y: [10, 15, 13, 18], type:  ''scatter''}];


    Plotly.newPlot(''myDiv'', data);


    ### 4.  JS Chart.js


    Chart.js is a popular JavaScript library for creating simple yet flexible charts.  It
    supports various chart types and provides easy integration.  With Chart.js, developers
    can create responsive and visually appealing charts.


    ### Example  -  Creating a Bar Chart with Chart.js:


    javascript code


    const ctx  =  document.getElementById(''myChart'').getContext(''2d'');


    const myChart  =  new Chart(ctx, {


    type:  ''bar'',


    data:  {


    labels: [''Red'', ''Blue'', ''Yellow'', ''Green'', ''Purple'', ''Orange''],


    datasets: [{


    label:  ''# of Votes'',


    data: [12, 19, 3, 5, 2, 3],


    backgroundColor: [


    ''rgba(255, 99, 132, 0.2)'',


    ''rgba(54, 162, 235, 0.2)'',


    ''rgba(255, 206, 86, 0.2)'',


    ''rgba(75, 192, 192, 0.2)'',


    ''rgba(153, 102, 255, 0.2)'',


    ''rgba(255, 159, 64, 0.2)''


    ],


    borderColor: [


    ''rgba(255, 99, 132, 1)'',


    ''rgba(54, 162, 235, 1)'',


    ''rgba(255, 206, 86, 1)'',


    ''rgba(75, 192, 192, 1)'',


    ''rgba(153, 102, 255, 1)'',


    ''rgba(255, 159, 64, 1)''


    ],


    borderWidth:  1


    }]


    },


    });


    ### 5.  JS Google Chart


    Google Charts is a feature-rich JavaScript charting library that offers a wide
    range of visualization options.  It allows the creation of interactive charts,
    maps, and graphs using declarative JavaScript syntax.


    ### Example  -  Creating a Pie Chart with Google Charts:


    javascript code


    google.charts.load(''current'', { packages: [''corechart''] });


    google.charts.setOnLoadCallback(drawChart);


    function drawChart()  {


    const data  =  google.visualization.arrayToDataTable([


    [''Task'', ''Hours per Day''],


    [''Work'', 11],


    [''Eat'', 2],


    [''Commute'', 2],


    [''Watch TV'', 2],


    [''Sleep'', 7]


    ]);


    const options  =  {


    title:  ''My Daily Activities'',


    pieHole:  0.4,


    };


    const chart  =  new google.visualization.PieChart(document.getElementById(''donutchart''));


    chart.draw(data, options);


    }


    ### 6.  JS D3.js


    D3.js (Data-Driven Documents)  is a powerful JavaScript library used for creating
    data visualizations in SVG, HTML, and CSS.  It provides comprehensive functionalities
    to manipulate documents based on data, enabling the creation of interactive and
    dynamic visualizations.


