  trans: "\nJavaScript 类中的静态方法是在类本身上调用的，而不是在类的实例上调用。\n\n## 类静态示例：\n\n### 添加静态方法：\n\
    \n```javascript\nclass Calculator {\n  static add(a, b) {\n    return a + b;\n\
    \  }\n}\n\nlet result = Calculator.add(5, 3);\nconsole.log(result);  // 输出: 8\n\
    ```\n\n# JS 异步\n\nJavaScript 中的异步编程涉及处理不会立即执行的操作。\n\n## JS 回调函数 (Callbacks)\n\n\
    JavaScript 中的回调函数是作为参数传递给另一个并在稍后执行的函数。\n\n### 回调函数示例：\n\n```javascript\nfunction\
    \ fetchData(callback) {\n  setTimeout(() => {\n    let data = 'Some data';\n \
    \   callback(data);\n  }, 2000);\n}\n\nfunction processData(data) {\n  console.log('Data\
    \ received: ' + data);\n}\n\nfetchData(processData);  // 2 秒后输出：'Data received:\
    \ Some data'\n```\n\n## JS 异步\n\nJavaScript 中的异步操作允许代码的非阻塞执行。\n\n### 异步示例：\n\n\
    ```javascript\nconsole.log('Start');\nsetTimeout(() => {\n  console.log('Inside\
    \ setTimeout');\n}, 2000);\nconsole.log('End');\n// 输出：'Start', 'End', 'Inside\
    \ setTimeout' (2 秒后)\n```\n\n# JS Promise\n\nJavaScript 中的 Promise 代表一个可能尚未可用的值，但它将在将来解析（resolve）或拒绝（reject）。\n\
    \n## Promise 示例：\n\n### 创建一个 Promise：\n\n```javascript\nlet myPromise = new Promise((resolve,\
    \ reject) => {\n  setTimeout(() => {\n    resolve('Promise resolved');\n  }, 2000);\n\
    });\n\nmyPromise.then((result) => {\n  console.log(result);  // 2 秒后输出：'Promise\
    \ resolved'\n});\n```\n\n# JS Async/Await\n\nJavaScript 中的 async/await 提供了一种使用\
    \ promise 编写异步代码的更同步的方式。\n\n## Async/Await 示例：\n\n### 使用 Async/Await：\n\n```javascript\n\
    async function fetchData() {\n  return new Promise((resolve) => {\n    setTimeout(()\
    \ => {\n      resolve('Data fetched');\n    }, 2000);\n  });\n}\n\nasync function\
    \ processData() {\n  let data = await fetchData();\n  console.log(data);  // 2\
    \ 秒后输出：'Data fetched'\n}\n\nprocessData();\n```\n\n这份综合指南涵盖了 JavaScript 类，包括类的介绍、继承和静态方法，以及异步编程概念（如回调、异步操作、promise\
    \ 和 async/await），并对每个概念都提供了示例和解释。\n\n# JS HTML DOM\n\nJavaScript 通过文档对象模型 (DOM)\
    \ 与 HTML 文档交互，将文档表示为树形结构。\n\n## DOM 简介：\n\n### 通过 ID 访问元素：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <h1 id=\"heading\">Welcome to the DOM</h1>\n  <script>\n\
    \    let element = document.getElementById(\"heading\");\n    console.log(element.innerHTML);\
    \  // 输出：'Welcome to the DOM'\n  </script>\n</body>\n</html>\n```\n\n## DOM 方法\n\
    \nDOM 方法提供了操作 HTML 元素的多种方式。\n\n### 更改元素内容：\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n  <p id=\"demo\">This is a paragraph.</p>\n  <script>\n    document.getElementById(\"\
    demo\").innerHTML = \"This is a new paragraph.\";\n  </script>\n</body>\n</html>\n\
    ```\n\n## DOM 文档\n\n`document` 对象代表整个 HTML 文档。\n\n### 访问文档属性：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <script>\n    console.log(document.title);  // 输出：Document\
    \ title\n    console.log(document.URL);  // 输出：Document URL\n  </script>\n</body>\n\
    </html>\n```\n\n## DOM 元素\n\nDOM 中的元素代表 HTML 标签。\n\n### 更改元素样式：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <p id=\"demo\">This is a paragraph.</p>\n  <script>\n\
    \    let element = document.getElementById(\"demo\");\n    element.style.color\
    \ = \"red\";\n    element.style.fontSize = \"20px\";\n  </script>\n</body>\n</html>\n\
    ```\n\n## DOM HTML\n\nDOM HTML 包含处理 HTML 内容的属性。\n\n### 更改 HTML 属性：\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <img id=\"myImage\" src=\"image.jpg\">\n  <script>\n\
    \    let image = document.getElementById(\"myImage\");\n    image.src = \"new_image.jpg\"\
    ;\n  </script>\n</body>\n</html>\n```\n\n## DOM 表单\n\nDOM 允许操作 HTML 表单。\n\n###\
    \ 访问表单元素：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <form id=\"myForm\">\n\
    \    <input type=\"text\" id=\"username\" name=\"username\">\n    <input type=\"\
    submit\" value=\"Submit\">\n  </form>\n  <script>\n    let form = document.getElementById(\"\
    myForm\");\n    let username = form.elements[\"username\"].value;\n  </script>\n\
    </body>\n</html>\n```\n\n## DOM CSS\n\nDOM CSS 允许操作 CSS 样式。\n\n### 更改 CSS 类：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p id=\"demo\">This is a paragraph.</p>\n\
    \  <script>\n    let element = document.getElementById(\"demo\");\n    element.classList.add(\"\
    new\");\n  </script>\n</body>\n</html>\n```\n\n## DOM 动画\n\nDOM 支持简单的动画。\n\n###\
    \ 元素动画：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <div id=\"box\" style=\"\
    width:100px;height:100px;background-color:red;position:relative;\"></div>\n  <script>\n\
    \    let elem = document.getElementById(\"box\");\n    let pos = 0;\n    let id\
    \ = setInterval(() => {\n      if (pos == 350) {\n        clearInterval(id);\n\
    \      } else {\n        pos++;\n        elem.style.top = pos + 'px';\n      }\n\
    \    }, 10);\n  </script>\n</body>\n</html>\n```\n\n## DOM 事件\n\nDOM 中的事件代表用户的交互。\n\
    \n### 点击事件：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <button id=\"myButton\"\
    >Click me</button>\n  <script>\n    document.getElementById(\"myButton\").addEventListener(\"\
    click\", () => {\n      alert(\"Button clicked\");\n    });\n  </script>\n</body>\n\
    </html>\n```\n\n## DOM 事件监听\n\n`addEventListener` 方法用于为元素绑定事件。\n\n### 悬停事件处理：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <div id=\"myDiv\">Mouse over me</div>\n\
    \  <script>\n    document.getElementById(\"myDiv\").addEventListener(\"mouseover\"\
    , () => {\n      alert(\"Mouse over\");\n    });\n  </script>\n</body>\n</html>\n\
    ```\n\n## DOM 导航\n\nDOM 允许在元素之间导航。\n\n### 遍历子元素：\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n  <ul id=\"myList\">\n    <li>Item 1</li>\n    <li>Item 2</li>\n\
    \    <li>Item 3</li>\n  </ul>\n  <script>\n    let list = document.getElementById(\"\
    myList\");\n    let items = list.getElementsByTagName(\"li\");\n    console.log(items.length);\
    \ // 3\n  </script>\n</body>\n</html>\n```\n\n## DOM 节点\n\n节点是 DOM 中的基础构建块。\n\n\
    ### 创建新节点：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <div id=\"myDiv\"></div>\n\
    \  <script>\n    let node = document.createElement(\"p\");\n    let textNode =\
    \ document.createTextNode(\"New paragraph\");\n    node.appendChild(textNode);\n\
    \    document.getElementById(\"myDiv\").appendChild(node);\n  </script>\n</body>\n\
    </html>\n```\n\n## DOM 集合\n\nDOM 中的集合是 HTML 元素的数组。\n\n### 访问集合元素：\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <p>点击按钮获取集合的长度。</p>\n  <button onclick=\"getLength()\"\
    >Get Collection Length</button>\n  <script>\n    function getLength() {\n    \
    \  let elements = document.links;\n      alert(\"Number of links: \" + elements.length);\n\
    \    }\n  </script>\n</body>\n</html>\n```\n\n## DOM 节点列表\n\nDOM 中的节点列表与集合相似，包含节点或元素。\n\
    \n### 访问节点列表元素：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p id=\"demo\"\
    >This is a paragraph.</p>\n  <script>\n    let nodeList = document.querySelectorAll(\"\
    #demo\");\n    console.log(nodeList[0].innerHTML); // 输出：'This is a paragraph.'\n\
    \  </script>\n</body>\n</html>\n```\n\n这份综合指南涵盖了 JavaScript HTML DOM，包括 DOM 介绍、方法、文档、元素、HTML、表单、CSS、动画、事件、事件监听、导航、节点、集合和节点列表，并对每个主题都提供了示例和解释。\n\
    \n# JS 浏览器 BOM\n\n浏览器对象模型 (BOM) 代表浏览器窗口及其组件。\n\n## JS Window\n"
- fmt: "\nThe `window` object is the global object in a browser's JavaScript environment.\n\
    \n### Accessing Window Properties:\n\n```javascript\nconsole.log(window.innerHeight);\
    \  // Output: Inner height of the window\nconsole.log(window.innerWidth);  //\
    \ Output: Inner width of the window\n```\n\n# JS Screen\n\nThe `screen` object\
    \ represents the screen of a device.\n\n### Accessing Screen Properties:\n\n```javascript\n\
    console.log(screen.width);  // Output: Screen width in pixels\nconsole.log(screen.height);\
    \  // Output: Screen height in pixels\n```\n\n# JS Location\n\nThe `location`\
    \ object contains information about the current URL.\n\n### Accessing Location\
    \ Information:\n\n```javascript\nconsole.log(location.href);  // Output: Full\
    \ URL of the current page\nconsole.log(location.hostname);  // Output: Hostname\
    \ of the current URL\n```\n\n# JS History\n\nThe `history` object contains the\
    \ browsing history of the window.\n\n### Accessing History Methods:\n\n```javascript\n\
    history.back();  // Go back to the previous page\nhistory.forward();  // Go forward\
    \ to the next page\n```\n\n# JS Navigator\n\nThe `navigator` object contains information\
    \ about the browser.\n\n### Accessing Navigator Properties:\n\n```javascript\n\
    console.log(navigator.userAgent);  // Output: User-Agent header of the browser\n\
    console.log(navigator.platform);  // Output: Platform of the browser\n```\n\n\
    # JS Popup Alert\n\nPopup alerts in JavaScript display messages to users.\n\n\
    ### Displaying an Alert:\n\n```javascript\nalert(\"This is an alert message\"\
    );\n```\n\n# JS Timing\n\nJavaScript's timing functions allow scheduling of code\
    \ execution.\n\n### Using `setTimeout()`:\n\n```javascript\nsetTimeout(() => {\n\
    \  console.log(\"Delayed message\");\n}, 2000);  // Execute after 2 seconds\n\
    ```\n\n### Using `setInterval()`:\n\n```javascript\nsetInterval(() => {\n  console.log(\"\
    Repeated message\");\n}, 3000);  // Execute every 3 seconds\n```\n\n# JS Cookies\n\
    \nCookies in JavaScript store small pieces of information on the client's machine.\n\
    \n### Setting a Cookie:\n\n```javascript\ndocument.cookie = \"username=John Doe;\
    \ expires=Thu, 18 Dec 2023 12:00:00 UTC; path=/\";\n```\n\n### Accessing a Cookie:\n\
    \n```javascript\nlet username =  document.cookie.split(';')[0].split('=')[1];\n\
    console.log(username);  // Output: 'John Doe'\n```\n\nThis comprehensive guide\
    \ covers JavaScript's Browser Object Model (BOM), including the window object,\
    \ screen, location, history, navigator, popup alerts, timing functions, and cookies,\
    \ with examples and explanations for each concept.\n\n# JS Web APIs\n\nWeb APIs\
    \ are sets of tools and interfaces provided by web browsers to interact with various\
    \ functionalities of the browser or device.\n\n## Web API Intro\n\nWeb APIs enable\
    \ web developers to access various browser features and functionalities.\n\n###\
    \ Accessing the Web API:\n\n```javascript\n// Example: Using the Geolocation API\n\
    if (\"geolocation\" in navigator) {\n  navigator.geolocation.getCurrentPosition((position)\
    \ => {\n    console.log(\"Latitude: \", position.coords.latitude);\n    console.log(\"\
    Longitude: \", position.coords.longitude);\n  });\n}\n```\n\n## Web Forms API\n\
    \nThe Web Forms API provides methods and properties to manipulate HTML form elements.\n\
    \n### Accessing Form Elements:\n\n```javascript\nlet form =  document.getElementById(\"\
    myForm\");\nlet inputField =  form.elements[\"username\"];\nconsole.log(inputField.value);\n\
    ```\n\n## Web History API\n\nThe Web History API allows manipulation of the browser's\
    \ history.\n\n### Changing Browser History:\n\n```javascript\nwindow.history.pushState({\
    \ page: 1 }, \"Title\", \"?page=1\");\n```\n\n## Web Storage API\n\nThe Web Storage\
    \ API provides methods to store data in the browser.\n\n### Using `localStorage`:\n\
    \n```javascript\nlocalStorage.setItem(\"key\", \"value\");\nlet data =  localStorage.getItem(\"\
    key\");\n```\n\n## Web Worker API\n\nThe Web Worker API enables running scripts\
    \ in the background to handle time-consuming tasks without blocking the UI.\n\n\
    ### Creating a Web Worker:\n\n```javascript\n// worker.js\nself.onmessage = function\
    \ (event) {\n  console.log(\"Message received from the main script:\", event.data);\n\
    \  self.postMessage(\"Message from worker\");\n};\n\n// main.js\nlet worker =\
    \  new Worker(\"worker.js\");\nworker.onmessage = function (event) {\n  console.log(\"\
    Message received from worker:\", event.data);\n};\nworker.postMessage(\"Message\
    \ from main\");\n```\n\n## Web Fetch API\n\nThe Fetch API provides a way to make\
    \ HTTP requests.\n\n### Making a GET Request:\n\n```javascript\nfetch(\"https://api.example.com/data\"\
    )\n  .then((response) => response.json())\n  .then((data) => console.log(data))\n\
    \  .catch((error) => console.log(\"Error:\", error));\n```\n\n## Web Geolocation\
    \ API\n\nThe Geolocation API retrieves geographical information about the user's\
    \ device.\n\n### Getting User's Location:\n\n```javascript\nnavigator.geolocation.getCurrentPosition((position)\
    \ => {\n  console.log(\"Latitude: \", position.coords.latitude);\n  console.log(\"\
    Longitude: \", position.coords.longitude);\n});\n```\n\nThis comprehensive guide\
    \ covers various Web APIs in JavaScript, including an introduction to Web APIs,\
    \ Web Forms API, Web History API, Web Storage API, Web Worker API, Web Fetch API,\
