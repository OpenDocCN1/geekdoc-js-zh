    \ = [\n  { id: 1, name: 'Alice' },\n  { id: 2, name: 'Bob' },\n  { id: 3, name:\
    \ 'Charlie' }\n];\nlet user = users.find(user => user.id === 2);  // 输出: { id:\
    \ 2, name: 'Bob' }\n```\n\n### 高级功能\n\n#### 5. 生成器函数 (Generator Function)\n\n\
    ```javascript\nfunction* generatorFunction() {\n  yield 1;\n  yield 2;\n  yield\
    \ 3;\n}\nlet generator = generatorFunction();\nconsole.log(generator.next().value);\
    \  // 输出: 1\nconsole.log(generator.next().value);  // 输出: 2\n```\n\n#### 6. 异步生成器函数\
    \ (Async Generator Function)\n\n```javascript\nasync function* asyncGenerator()\
    \ {\n  yield 'First';\n  await new Promise(resolve => setTimeout(resolve, 1000));\n\
    \  yield 'Second';\n}\n(async () => {\n  for await (let item of asyncGenerator())\
    \ {\n    console.log(item);  // 输出: 0ms 后输出 'First', 1000ms 后输出 'Second'\n  }\n\
    })();\n```\n\n### 高级错误处理\n\n#### 7. 使用 `catch` 处理被拒绝的 Promise\n\n```javascript\n\
