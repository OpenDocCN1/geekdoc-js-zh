    console.log(result);  //  Output:  8


    # JS Async


    Asynchronous programming in JavaScript involves handling operations that don''t
    execute immediately.


    ## JS Callbacks


    Callbacks in JavaScript are functions passed as arguments to another function
    to be executed later.


    ### Callbacks Example:


    javascript code


    function fetchData(callback)  {


    setTimeout(() => {


    let data  =  ''Some data'';


    callback(data);


    }, 2000);


    }


    function processData(data)  {


    console.log(''Data received:  '' +  data);


    }


    fetchData(processData);  //  Output after 2 seconds:  ''Data received:  Some data''


    ## JS Asynchronous


    Asynchronous operations in JavaScript allow non-blocking execution of code.


    ### Asynchronous Example:


    javascript code


    console.log(''Start'');


    setTimeout(() => {


    console.log(''Inside setTimeout'');


    }, 2000);


    console.log(''End'');


    //  Output:  ''Start'', ''End'', ''Inside setTimeout'' (After 2 seconds)


    # JS Promises


    Promises in JavaScript represent a value that might not be available yet but will
    resolve or reject in the future.


    ## Promises Example:


    ### Creating a Promise:


    javascript code


    let myPromise  =  new Promise((resolve, reject) => {


    setTimeout(() => {


    resolve(''Promise resolved'');


    }, 2000);


    });


    myPromise.then((result) => {


    console.log(result);  //  Output after 2 seconds:  ''Promise resolved''


    });


    # JS Async/Await


    Async/await in JavaScript provides a more synchronous way to write asynchronous
    code using promises.


    ## Async/Await Example:


    ### Using Async/Await:


    javascript code


    async function fetchData()  {


    return new Promise((resolve) => {


    setTimeout(() => {


    resolve(''Data fetched'');


    }, 2000);


    });


    }


    async function processData()  {


    let data  =  await fetchData();


    console.log(data);  //  Output after 2 seconds:  ''Data fetched''


    }


    processData();


    This comprehensive guide covers JavaScript classes, including an introduction
    to classes, inheritance, and static methods, as well as asynchronous programming
    concepts such as callbacks, asynchronous operations, promises, and async/await,
    with examples and explanations for each concept.


    # JS HTML DOM


    JavaScript interacts with HTML documents through the Document Object Model (DOM),
    representing the document as a tree structure.


    ## DOM Intro:


    ### Accessing an Element by ID:


    html code


    <!DOCTYPE html>


    <html>


    <body>


    <h1 id="heading">Welcome to the DOM</h1>


    <script>


    let element  =  document.getElementById("heading");


    console.log(element.innerHTML);  //  Output:  ''Welcome to the DOM''


    </script>


    </body>


    </html>


    ## DOM Methods


    DOM methods provide various ways to manipulate HTML elements.


    ### Changing Element Content:


    html code


    <!DOCTYPE html>


    <html>


    <body>


    <p id="demo">This is a paragraph.</p>


    <script>


    document.getElementById("demo").innerHTML = "This is a new paragraph.";


    </script>


    </body>


    </html>


    ## DOM Document


    The  document object represents the entire HTML document.


    ### Accessing Document Properties:


    html code


    <!DOCTYPE html>


    <html>


    <body>


    <script>


    console.log(document.title);  //  Output:  Document title


    console.log(document.URL);  //  Output:  Document URL


    </script>


    </body>


    </html>


    ## DOM Elements


    Elements in the DOM represent HTML tags.


    ### Changing Element Styles:


    html code


    <!DOCTYPE html>


    <html>


    <body>


    <p id="demo">This is a paragraph.</p>


    <script>


    let element  =  document.getElementById("demo");


    element.style.color = "red";


    element.style.fontSize = "20px";


    </script>


    </body>


    </html>


    ## DOM HTML


    The DOM HTML includes properties that deal with the HTML content.


    ### Changing HTML Attributes:


    html code


    <!DOCTYPE html>


    <html>


    <body>


    <img id="myImage" src="image.jpg">


    <script>


    let image  =  document.getElementById("myImage");


    image.src = "new_image.jpg";


    </script>


    </body>


    </html>


    ## DOM Forms


    The DOM allows manipulation of HTML forms.


    ### Accessing Form Elements:


    html code


    <!DOCTYPE html>


    <html>


    <body>


    <form id="myForm">


    <input type="text" id="username" name="username">


    <input type="submit" value="Submit">


    </form>


    <script>


    let form  =  document.getElementById("myForm");


    let username  =  form.elements["username"].value;


    </script>


    </body>


    </html>


    ## DOM CSS


    The DOM CSS allows manipulation of CSS styles.


    ### Changing CSS Classes:


    html code


    <!DOCTYPE html>


    <html>


    <body>


    <p id="demo">This is a paragraph.</p>


    <script>


    let element  =  document.getElementById("demo");


    element.classList.add("new-class");


    </script>


    </body>


    </html>


    ## DOM Animations


    The DOM supports creating simple animations.


    ### Animating an Element:


    html code


    <!DOCTYPE html>


    <html>


    <body>


    <div id="box" style="width:100px;height:100px;background-color:red;position:relative;"></div>


    <script>


    let elem  =  document.getElementById("box");


    let pos  =  0;


    let id  =  setInterval(frame, 10);


    function frame()  {


    if (pos  ==  350)  {


    clearInterval(id);


    } else {


    pos++;


    elem.style.top =  pos  +  ''px'';


    elem.style.left =  pos  +  ''px'';


    }


    }


    </script>


    </body>


    </html>


    ## DOM Events


    Events in the DOM represent interactions by users or by the browser.


    ### Click Event Handling:


    html code


    <!DOCTYPE html>


    <html>


    <body>


    <button id="myButton">Click me</button>


    <script>


    document.getElementById("myButton").addEventListener("click", function()  {


    alert("Button clicked");


    });


    </script>


    </body>


    </html>


    ## DOM Event Listener


    The  addEventListener method is used to attach an event to an element.


    ### Mouseover Event Handling:


    html code


    <!DOCTYPE html>


    <html>


    <body>


    <div id="myDiv">Mouse over me</div>


    <script>


    document.getElementById("myDiv").addEventListener("mouseover", function()  {


    alert("Mouse over event triggered");


    });


    </script>


    </body>


    </html>


    ## DOM Navigation


    The DOM allows navigation between elements.


    ### Traversing Child Elements:


    html code


    <!DOCTYPE html>


    <html>


    <body>


    <ul id="myList">


    <li>Item 1</li>


    <li>Item 2</li>


    <li>Item 3</li>


    </ul>


    <script>


    let list  =  document.getElementById("myList");


    let items  =  list.getElementsByTagName("li");


    console.log(items.length);  //  Output:  3


    </script>


    </body>


    </html>


    ## DOM Nodes


    Nodes are the fundamental building blocks in the DOM.


    ### Creating a New Node:


    html code


    <!DOCTYPE html>


    <html>


    <body>


    <div id="myDiv"></div>


    <script>


    let node  =  document.createElement("p");


    let textNode  =  document.createTextNode("New paragraph");


    node.appendChild(textNode);


    document.getElementById("myDiv").appendChild(node);


    </script>


    </body>


    </html>


    ## DOM Collections


    Collections in the DOM are arrays of HTML elements.


    ### Accessing Collection Elements:


    html code


    <!DOCTYPE html>


    <html>


    <body>


    <p>Click the button to get the collection length.</p>


    <button onclick="getLength()">Get Collection Length</button>


    <script>


    function getLength()  {


    let elements  =  document.links;


    alert("Number of links: " +  elements.length);


    }


    </script>


    </body>


    </html>


    ## DOM Node Lists


    Node lists in the DOM are similar to collections and contain nodes or elements.


    ### Accessing Node List Elements:


    html code


    <!DOCTYPE html>


    <html>


    <body>


    <p id="demo">This is a paragraph.</p>


    <script>


    let nodeList  =  document.querySelectorAll("#demo");


    console.log(nodeList[0].innerHTML);  //  Output:  ''This is a paragraph.''


    </script>


    </body>


    </html>


    This comprehensive guide covers JavaScript''s HTML DOM, including an introduction
    to the DOM, methods, document, elements, HTML, forms, CSS, animations, events,
    event listeners, navigation, nodes, collections, and node lists, with examples
    and explanations for each topic.


    # JS Browser BOM


    The Browser Object Model (BOM)  in JavaScript represents the browser window and
    its components.


