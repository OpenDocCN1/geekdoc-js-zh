    \ \"city\": \"Paris\", \"country\": \"France\" };\nlet mergedObj = { ...obj1,\
    \ ...obj2 };\nconsole.log(mergedObj);\n```\n\n### 20. 将 JSON 数据映射到另一种结构：\n\n```javascript\n\
    let data = [\n  { \"id\": 1, \"name\": \"Item 1\" },\n  { \"id\": 2, \"name\"\
    : \"Item 2\" },\n  { \"id\": 3, \"name\": \"Item 3\" }\n];\nlet mappedData = data.map(item\
    \ => ({ itemId: item.id, itemName: item.name }));\nconsole.log(mappedData);\n\
    ```\n\n这些示例展示了 JavaScript 中使用 JSON 的不同方面，包括创建、操作、解析以及在各种场景下处理 JSON 数据。\n\n"
- fmt: "\nJavaScript and jQuery are both powerful tools used in web development. JavaScript\
    \ is a programming language, while jQuery is a library built with JavaScript.\
    \ Understanding their differences, capabilities, and usage scenarios is crucial\
    \ for developers.\n\n## JavaScript Overview\n\nJavaScript is a versatile programming\
    \ language primarily used for enhancing interactivity on web pages. It's a core\
    \ technology in web development, enabling dynamic content updates, user interactions,\
    \ and handling client-side functionalities.\n\n### Example of JavaScript Functionality:\n\
    \n```javascript\n//  JavaScript code to change text color on button click\n\n\
    function changeColor() {\n  document.getElementById(\"text\").style.color = \"\
    blue\";\n}\n```\n\nJavaScript offers native methods and APIs to interact with\
    \ the Document Object Model (DOM) and manipulate HTML elements, enabling developers\
    \ to create dynamic web applications.\n\n## jQuery Overview\n\njQuery, on the\
    \ other hand, is a fast, lightweight JavaScript library designed to simplify the\
    \ process of client-side scripting and DOM manipulation. It abstracts many complexities\
    \ of JavaScript and provides a concise syntax for common tasks.\n\n### Example\
    \ of jQuery Functionality:\n\n```javascript\n//  jQuery code to change text color\
    \ on button click\n\n$(\"#text\").css(\"color\", \"blue\");\n```\n\njQuery simplifies\
    \ common JavaScript tasks, such as event handling, animations, AJAX requests,\
    \ and DOM manipulation, offering a more concise syntax compared to native JavaScript.\n\
    \n## Differences Between JavaScript and jQuery\n\n### 1. Syntax:\n\n* JavaScript:\
    \ Uses native syntax and methods provided by the language.\n* jQuery: Offers a\
    \ simpler syntax and concise methods for common tasks, making code shorter and\
    \ more readable.\n\n### 2. DOM Manipulation:\n\n* JavaScript: Provides direct\
    \ DOM manipulation using methods like `getElementById` and `querySelector`.\n\
    * jQuery: Simplifies DOM traversal and manipulation with methods like `$()`, allowing\
    \ easier element selection and modification.\n\n### 3. Browser Compatibility:\n\
    \n* JavaScript: Works across all modern browsers, but handling cross-browser compatibility\
    \ may require additional code.\n* jQuery: Provides cross-browser compatibility\
    \ out-of-the-box, reducing the need for explicit compatibility handling.\n\n###\
    \ 4. Learning Curve:\n\n* JavaScript: Requires understanding core language concepts,\
    \ which might have a steeper learning curve for beginners.\n* jQuery: Offers a\
    \ simpler learning curve due to its concise syntax and abstraction of complex\
    \ JavaScript operations.\n\n## jQuery Selectors\n\njQuery provides powerful selectors\
    \ that allow developers to efficiently target and manipulate HTML elements.\n\n\
    ### Example of jQuery Selectors:\n\n```javascript\n//  Selecting elements with\
    \ class 'example'\n\n$(\".example\").css(\"font-size\", \"16px\");\n\n//  Selecting\
    \ all <p> elements inside <div> with ID 'content'\n\n$(\"#content p\").addClass(\"\
    highlight\");\n```\n\njQuery selectors, similar to CSS selectors, enable developers\
    \ to target elements based on IDs, classes, attributes, element types, and more.\n\
    \n## jQuery HTML Manipulation\n\njQuery simplifies HTML content manipulation by\
    \ providing methods to insert, remove, and modify HTML elements and their content.\n\
    \n### Example of jQuery HTML Manipulation:\n\n```javascript\n//  Appending a new\
    \ <li> element to an unordered list\n\n$(\"ul\").append(\"<li>New Item</li>\"\
    );\n\n//  Changing text content inside a <div> element\n\n$(\"#content\").text(\"\
    Updated content\");\n```\n\nWith jQuery's methods like `append`, `html`, `text`,\
    \ and `remove`, developers can efficiently modify HTML content on the fly.\n\n\
    ## jQuery CSS Manipulation\n\njQuery facilitates CSS manipulation, allowing changes\
    \ to element styles dynamically.\n\n### Example of jQuery CSS Manipulation:\n\n\
    ```javascript\n//  Changing the background color of an element\n\n$(\"#box\").css(\"\
    background-color\", \"#f2fff2\");\n\n//  Toggling a CSS class on an element\n\n\
    $(\"#toggleBtn\").click(function() {\n  $(\"#content\").toggleClass(\"active\"\
    );\n});\n```\n\njQuery's `css`, `addClass`, `removeClass`, and `toggleClass` methods\
    \ simplify applying, removing, and toggling CSS styles.\n\n## jQuery DOM Traversal\n\
    \njQuery simplifies DOM traversal, enabling easy navigation between elements and\
    \ their relationships within the DOM.\n\n### Example of jQuery DOM Traversal:\n\
    \n```javascript\n//  Finding the next sibling element\n\n$(\"#current\").next().addClass(\"\
    highlight\");\n\n//  Traversing up the DOM to find parent elements\n\n$(\"a\"\
    ).closest(\"div\").addClass(\"parent-div\");\n```\n\nUsing methods like `next`,\
    \ `prev`, `find`, `closest`, and `siblings`, jQuery provides efficient ways to\
    \ navigate and manipulate elements within the DOM.\n\n## Conclusion\n\nJavaScript\
    \ and jQuery each have their strengths and use cases in web development. JavaScript\
    \ is the foundation language that provides extensive capabilities for building\
    \ complex applications. jQuery, as a library built on JavaScript, simplifies common\
    \ tasks, particularly DOM manipulation, offering a more concise syntax.\n\nFor\
    \ modern development, JavaScript's native features are often preferred due to\
    \ advancements in web standards, while jQuery remains relevant for legacy projects\
    \ or when compatibility with older browsers is a concern. Understanding both JavaScript\
    \ and jQuery empowers developers to choose the right tool for the job and build\
    \ robust, interactive web applications.\n\n## JavaScript and jQuery in various\
    \ Examples:\n\n### 1. Selecting an Element by ID:\n\n#### JavaScript:\n```javascript\n\
    let element = document.getElementById(\"myElement\");\nelement.style.color = \"\
    blue\";\n```\n\n#### jQuery:\n```javascript\n$(\"#myElement\").css(\"color\",\
    \ \"blue\");\n```\n\n### 2. Selecting Multiple Elements by Class:\n\n#### JavaScript:\n\
    ```javascript\nlet elements = document.getElementsByClassName(\"myClass\");\n\
    for (let i = 0; i < elements.length; i++) {\n  elements[i].style.fontWeight =\
    \ \"bold\";\n}\n```\n\n#### jQuery:\n```javascript\n$(\".myClass\").css(\"font-weight\"\
    , \"bold\");\n```\n\n### 3. Adding Event Listeners:\n\n#### JavaScript:\n```javascript\n\
    document.getElementById(\"myButton\").addEventListener(\"click\", function() {\n\
    \  alert(\"Button clicked!\");\n});\n```\n\n#### jQuery:\n```javascript\n$(\"\
    #myButton\").on(\"click\", function() {\n  alert(\"Button clicked!\");\n});\n\
    ```\n\n### 4. Handling Ready Event:\n\n#### JavaScript:\n```javascript\ndocument.addEventListener(\"\
    DOMContentLoaded\", function() {\n  //  Code to execute when DOM is ready\n});\n\
    ```\n\n#### jQuery:\n```javascript\n$(document).ready(function() {\n  //  Code\
    \ to execute when DOM is ready\n});\n```\n\n### 5. Creating a New Element:\n\n\
    #### JavaScript:\n```javascript\nlet newElement = document.createElement(\"div\"\
    );\nnewElement.textContent = \"New Content\";\ndocument.body.appendChild(newElement);\n\
    ```\n\n#### jQuery:\n```javascript\n$(\"body\").append(\"<div>New Content</div>\"\
    );\n```\n\n### 6. Removing an Element:\n\n#### JavaScript:\n```javascript\nlet\
    \ elementToRemove = document.getElementById(\"toBeRemoved\");\nelementToRemove.parentNode.removeChild(elementToRemove);\n\
    ```\n\n#### jQuery:\n```javascript\n$(\"#toBeRemoved\").remove();\n```\n\n###\
    \ 7. Manipulating CSS Class:\n\n#### JavaScript:\n```javascript\ndocument.getElementById(\"\
    myDiv\").classList.add(\"active\");\n```\n\n#### jQuery:\n```javascript\n$(\"\
    #myDiv\").addClass(\"active\");\n```\n\n### 8. Changing Text Content:\n\n####\
    \ JavaScript:\n```javascript\ndocument.getElementById(\"mySpan\").textContent\
    \ = \"Updated Text\";\n```\n\n#### jQuery:\n```javascript\n$(\"#mySpan\").text(\"\
    Updated Text\");\n```\n\n### 9. Hiding an Element:\n\n#### JavaScript:\n```javascript\n\
    document.getElementById(\"toHide\").style.display = \"none\";\n```\n\n#### jQuery:\n\
    ```javascript\n$(\"#toHide\").hide();\n```\n\n### 10. Fading In an Element:\n\n\
    #### JavaScript:\n```javascript\nlet elementToFade = document.getElementById(\"\
    toFade\");\nelementToFade.style.opacity = 0;\nelementToFade.style.transition =\
    \ \"opacity 1s\";\nelementToFade.style.opacity = 1;\n```\n\n#### jQuery:\n```javascript\n\
    $(\"#toFade\").fadeIn(1000);\n```\n\n### 11. AJAX GET Request:\n\n#### JavaScript:\n\
    ```javascript\nlet xhr = new XMLHttpRequest();\nxhr.onreadystatechange = function()\
    \ {\n};\n```\n"
  raw: 'JavaScript and jQuery are both powerful tools used in web development.  JavaScript
    is a programming language, while jQuery is a library built with JavaScript.  Understanding
    their differences, capabilities, and usage scenarios is crucial for developers.


    ## JavaScript Overview


    JavaScript is a versatile programming language primarily used for enhancing interactivity
    on web pages.  It''s a core technology in web development, enabling dynamic content
    updates, user interactions, and handling client-side functionalities.


    ### Example of JavaScript Functionality:


    javascript code


    //  JavaScript code to change text color on button click


    function changeColor()  {


    document.getElementById("text").style.color = "blue";


    }


    JavaScript offers native methods and APIs to interact with the Document Object
    Model (DOM)  and manipulate HTML elements, enabling developers to create dynamic
    web applications.


    ## jQuery Overview


    jQuery, on the other hand, is a fast, lightweight JavaScript library designed
    to simplify the process of client-side scripting and DOM manipulation.  It abstracts
    many complexities of JavaScript and provides a concise syntax for common tasks.


    ### Example of jQuery Functionality:


    javascript code


    //  jQuery code to change text color on button click


    $("#text").css("color",  "blue");


    jQuery simplifies common JavaScript tasks, such as event handling, animations,
    AJAX requests, and DOM manipulation, offering a more concise syntax compared to
    native JavaScript.


    ## Differences Between JavaScript and jQuery


    ### 1.  Syntax:


    *   JavaScript:  Uses native syntax and methods provided by the language.


    *   jQuery:  Offers a simpler syntax and concise methods for common tasks, making
    code shorter and more readable.


    ### 2.  DOM Manipulation:


    *   JavaScript:  Provides direct DOM manipulation using methods like  getElementById
    and  querySelector.


    *   jQuery:  Simplifies DOM traversal and manipulation with methods like $(),
    allowing easier element selection and modification.


    ### 3.  Browser Compatibility:


    *   JavaScript:  Works across all modern browsers, but handling cross-browser
    compatibility may require additional code.


    *   jQuery:  Provides cross-browser compatibility out-of-the-box, reducing the
    need for explicit compatibility handling.


    ### 4.  Learning Curve:


    *   JavaScript:  Requires understanding core language concepts, which might have
    a steeper learning curve for beginners.


    *   jQuery:  Offers a simpler learning curve due to its concise syntax and abstraction
    of complex JavaScript operations.


    ## jQuery Selectors


    jQuery provides powerful selectors that allow developers to efficiently target
    and manipulate HTML elements.


    ### Example of jQuery Selectors:


    javascript code


    //  Selecting elements with class ''example''


    $(".example").css("font-size",  "16px");


    //  Selecting all <p> elements inside <div> with ID ''content''


    $("#content p").addClass("highlight");


    jQuery selectors, similar to CSS selectors, enable developers to target elements
    based on IDs, classes, attributes, element types, and more.


    ## jQuery HTML Manipulation


    jQuery simplifies HTML content manipulation by providing methods to insert, remove,
    and modify HTML elements and their content.


    ### Example of jQuery HTML Manipulation:


    javascript code


    //  Appending a new <li> element to an unordered list


    $("ul").append("<li>New Item</li>");


    //  Changing text content inside a <div> element


    $("#content").text("Updated content");


    With jQuery''s methods like  append,  html,  text, and  remove, developers can
    efficiently modify HTML content on the fly.


    ## jQuery CSS Manipulation


    jQuery facilitates CSS manipulation, allowing changes to element styles dynamically.


    ### Example of jQuery CSS Manipulation:


    javascript code


    //  Changing the background color of an element


    $("#box").css("background-color",  "#f2f2f2");


    //  Toggling a CSS class on an element


    $("#toggleBtn").click(function()  {


    $("#content").toggleClass("active");


    });


    jQuery''s  css,  addClass,  removeClass, and  toggleClass methods simplify applying,
    removing, and toggling CSS styles.


    ## jQuery DOM Traversal


    jQuery simplifies DOM traversal, enabling easy navigation between elements and
    their relationships within the DOM.


    ### Example of jQuery DOM Traversal:


    javascript code


    //  Finding the next sibling element


    $("#current").next().addClass("highlight");


    //  Traversing up the DOM to find parent elements


    $("a").closest("div").addClass("parent-div");


    Using methods like  next,  prev,  find,  closest, and  siblings, jQuery provides
    efficient ways to navigate and manipulate elements within the DOM.


    ## Conclusion


    JavaScript and jQuery each have their strengths and use cases in web development.  JavaScript
    is the foundation language that provides extensive capabilities for building complex
    applications.  jQuery, as a library built on JavaScript, simplifies common tasks,
    particularly DOM manipulation, offering a more concise syntax.


    For modern development, JavaScript''s native features are often preferred due
    to advancements in web standards, while jQuery remains relevant for legacy projects
    or when compatibility with older browsers is a concern.  Understanding both JavaScript
    and jQuery empowers developers to choose the right tool for the job and build
    robust, interactive web applications.


