    # JS Functions


    Functions in JavaScript are reusable blocks of code that perform a specific task
    when called.


    ## Function Definitions:


    ### Function Declaration:


    ```javascript

    function greet() {

    return ''Hello!'';

    }

    ```


    ### Function Expression:


    ```javascript

    let greet  = function() {

    return ''Hello!'';

    };

    ```


    ### Arrow Function:


    ```javascript

    let greet = () => {

    return ''Hello!'';

    };

    ```


    # Function Parameters


    Function parameters are placeholders for values a function will receive.


    ## Function Parameters Examples:


    ### Single Parameter:


    ```javascript

    function greet(name) {

    return ''Hello, '' + name;

    }

    ```


    ### Multiple Parameters:


    ```javascript

    function sum(a, b) {

    return a + b;

    }

    ```


    # Function Invocation


    Function invocation means calling a function to execute its code.


    ## Function Invocation Examples:


    ### Calling a Function:


    ```javascript

    greet();

    ```


    ### Calling with arguments:


    ```javascript

    sum(5, 3);

    ```


    # Function Call


    The `call()` method in JavaScript allows a function to be called with a specified
    `this` value and arguments.


    ## Function Call Examples:


    ### Using `call()`:


    ```javascript

    function greet(name) {

    return ''Hello, '' + name;

    }


    let person  = { name: ''Alice'' };

    greet.call(person);

    ```


    # Function Apply


    The `apply()` method in JavaScript allows a function to be called with a specified
    `this` value and arguments provided as an array.


    ## Function Apply Examples:


    ### Using `apply()`:


    ```javascript

    function greet(name) {

    return ''Hello, '' + name;

    }

    let person  = { name: ''Bob'' };

    let args = [''Bob''];

    greet.apply(person, args);

    ```


    # Function Bind


    The `bind()` method in JavaScript creates a new function that, when called, has
    `this` set to a specified value.


    ## Function Bind Examples:


    ### Using `bind()`:


    ```javascript

    function greet(name) {

    return ''Hello, '' + name;

    }

    let person  = { name: ''Charlie'' };

    let newGreet = greet.bind(person);

    newGreet();

    ```


