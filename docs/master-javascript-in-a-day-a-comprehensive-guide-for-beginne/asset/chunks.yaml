    ## JSON Arrays


    JSON arrays are ordered lists of values enclosed in square brackets  [].  The
    values can be of any JSON data type.


    ### Example of a JSON Array:


    json code


    ["apple", "banana", "orange"]


    ## JSON Server


    JSON is commonly used to transfer data between a server and a web client in web
    development.  Servers often provide data in JSON format through APIs.


    ### Example of JSON Data from a Server:


    json code


    //  Received from a server API endpoint


    {


    "id": 1,


    "title": "Sample Post",


    "content": "This is a sample post content."


    }


    ## JSON PHP


    In PHP, JSON data can be encoded and decoded using  json_encode() and  json_decode()
    functions respectively, to convert data to and from JSON format.


    ### Example of Encoding and Decoding JSON in PHP:


    php code


    //  Encoding PHP array to JSON


    $data =  array("name"=>  "Peter",  "age"=> 28);


    $jsonData =  json_encode($data);


    //  Decoding JSON to PHP array


    $jsonString =  ''{"name": "Alice", "age":  30}'';


    $decodedData =  json_decode($jsonString, true);


    ## JSON HTML


    JSON data can be used in HTML to dynamically generate content on webpages using
    JavaScript.


    ### Example of Using JSON Data in HTML:


    html code


    <ul id="userList"></ul>


    <script>


    const users  = [


    {  "name": "John",  "age":  25 },


    {  "name": "Alice",  "age":  30 },


    {  "name": "Bob",  "age":  28 }


    ];


    const userList  =  document.getElementById("userList");


    users.forEach(user => {


    let listItem  =  document.createElement("li");


    listItem.textContent =  `${user.name} -  ${user.age} years old`;


    userList.appendChild(listItem);


    });


    </script>


    ## JSON JSONP


    JSONP (JSON with Padding)  is a technique for requesting JSON data from a different
    domain in web development to bypass the same-origin policy limitations.


    ### Example of JSONP Request:


    javascript code


    function handleData(data)  {


    console.log(data);


    }


    let script  =  document.createElement(''script'');


    script.src =  ''https://example.com/data?callback=handleData'';


    document.head.appendChild(script);


    This comprehensive guide covers JSON (JavaScript Object Notation)  in detail,
    including an introduction, syntax, comparison with XML, data types, parsing, stringifying,
    JSON objects and arrays, working with JSON in server-side technologies like PHP,
    HTML, and JSONP, with examples and explanations for each topic.  JSON plays a
    crucial role in data interchange in web development due to its simplicity, ease
    of use, and widespread support.


    ### 1.  Creating a JSON Object:


    javascript code


    let person  =  {


    "name": "John",


    "age":  30,


    "city": "New York"


    };


    ### 2.  Accessing JSON Object Properties:


    javascript code


    console.log(person.name);  //  Output:  John


    console.log(person.age);  //  Output:  30


    ### 3.  Nested JSON Objects:


    javascript code


    let employee  =  {


    "name": "Alice",


    "position": "Engineer",


    "contact":  {


    "email": "alice@example.com",


    "phone": "123-456-7890"


    }


    };


    ### 4.  JSON Array of Objects:


    javascript code


    let books  = [


    {  "title": "Book 1",  "author": "Author 1" },


    {  "title": "Book 2",  "author": "Author 2" },


    {  "title": "Book 3",  "author": "Author 3" }


    ];


    ### 5.  Converting JSON to String:


    javascript code


    let jsonString  =  JSON.stringify(person);


    console.log(jsonString);  //  Output: {"name":"John","age":30,"city":"New York"}


    ### 6.  Parsing JSON String to Object:


    javascript code


    let jsonObject  =  JSON.parse(''{"name":"Alice","age":25,"city":"London"}'');


    console.log(jsonObject.name);  //  Output:  Alice


    ### 7.  Fetching JSON Data from URL (using Fetch API):


    javascript code


    fetch(''data.json'')


    .then(response => response.json())


    .then(data => console.log(data))


    .catch(error => console.error(''Error:'', error));


    ### 8.  Displaying JSON Data Dynamically in HTML:


    javascript code


    let jsonData  =  {  "name": "Bob",  "age":  28 };


    let displayDiv  =  document.getElementById(''jsonDataDisplay'');


    displayDiv.innerHTML =  `<p>Name:  ${jsonData.name}</p><p>Age:  ${jsonData.age}</p>`;


    ### 9.  Handling JSON Data in Forms:


    javascript code


    let form  =  document.getElementById(''myForm'');


    form.addEventListener(''submit'', function(event)  {


    event.preventDefault();


    let formData  =  new FormData(form);


    let jsonObject  =  {};


    formData.forEach((value, key) => {


    jsonObject[key] =  value;


    });


    console.log(jsonObject);


    });


    ### 10.  Stringifying and Parsing a More Complex Object:


    javascript code


    let complexObj  =  {


    "name": "Sam",


    "age":  35,


    "addresses": [


    {  "type": "home",  "address": "123 Main St" },


    {  "type": "work",  "address": "456 Business Ave" }


    ]


    };


    let complexString  =  JSON.stringify(complexObj);


    let parsedObj  =  JSON.parse(complexString);


    console.log(parsedObj.addresses[0].address);  //  Output:  123 Main St


    ### 11.  Filtering JSON Array Data:


    javascript code


    let employees  = [


    {  "name": "John",  "department": "HR" },


    {  "name": "Alice",  "department": "IT" },


    {  "name": "Bob",  "department": "HR" }


    ];


    let hrEmployees  =  employees.filter(employee => employee.department === "HR");


    console.log(hrEmployees);  //  Output: [{ "name": "John", "department": "HR"  },
    { "name": "Bob", "department": "HR" }]


    ### 12.  Updating JSON Object Properties:


    javascript code


    let product  =  {  "name": "Chair",  "price":  50 };


    product.price =  60;


    console.log(product);  //  Output:  { "name": "Chair", "price":  60 }


    ### 13.  Removing a Property from JSON Object:


    javascript code


    let data  =  {  "name": "Kate",  "age":  25 };


    delete data.age;


    console.log(data);  //  Output:  { "name": "Kate"  }


    ### 14.  Using JSON with Local Storage:


    javascript code


    let userData  =  {  "username": "user123",  "email": "user@example.com" };


    localStorage.setItem(''userData'', JSON.stringify(userData));


    let storedData  =  JSON.parse(localStorage.getItem(''userData''));


    console.log(storedData.email);  //  Output:  user@example.com


    ### 15.  Handling JSON Date Strings:


    javascript code


    let jsonData  =  {  "date": "2023-12-31T08:00:00Z" };


    let date  =  new Date(jsonData.date);


    console.log(date.toDateString());  //  Output:  Fri Dec 31 2023


    ### 16.  Using JSON in Asynchronous Functions:


    javascript code


    async function fetchData()  {


    try {


    let response  =  await fetch(''data.json'');


    let data  =  await response.json();


    console.log(data);


    } catch (error)  {


    console.error(''Error:'', error);


    }


    }


    fetchData();


    ### 17.  JSON Serialization with Custom Functions:


    javascript code


    let obj  =  {


    "name": "Joe",


    "birthday":  new Date(''1990-01-15T00:00:00Z''),


    "toJson":  function()  {


    return `{ "name": "${this.name}", "birthday": "${this.birthday.toISOString()}"  }`;


    }


    };


    let jsonString  =  obj.toJson();


    console.log(jsonString);  //  Output:  { "name": "Joe", "birthday": "1990-01-15T00:00:00.000Z"  }


    ### 18.  Handling JSON Data from an API (Using Axios):


    javascript code


    axios.get(''https://api.example.com/data'')


    .then(response => console.log(response.data))


    .catch(error => console.error(''Error:'', error));


    ### 19.  Merging JSON Objects:


    javascript code


    let obj1  =  {  "name": "Tom",  "age":  30 };


    let obj2  =  {  "city": "Paris",  "country": "France" };


    let mergedObj  =  {  ...obj1,  ...obj2 };


    console.log(mergedObj);  //  Output:  { "name": "Tom", "age":  30, "city": "Paris",
    "country": "France"  }


    ### 20.  Mapping JSON Data to Another Structure:


    javascript code


    let data  = [


    {  "id":  1,  "name": "Item 1" },


    {  "id":  2,  "name": "Item 2" },


    {  "id":  3,  "name": "Item 3" }


    ];


    let mappedData  =  data.map(item => ({ itemId:  item.id, itemName:  item.name}));


    console.log(mappedData);


    //  Output: [{ "itemId":  1, "itemName": "Item 1"  }, { "itemId":  2, "itemName":
    "Item 2"  }, { "itemId":  3, "itemName": "Item 3" }]


    These examples showcase different aspects of using JSON in JavaScript, including
    creating, manipulating, parsing, and working with JSON data in various scenarios.


