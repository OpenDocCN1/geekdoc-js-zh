    ## Object Constructors Examples:


    ### Using Constructor Functions:


    javascript code


    function Person(name, age)  {


    this.name =  name;


    this.age =  age;


    this.greet =  function()  {


    return ''Hello, my name is '' +  this.name;


    };


    }


    let newPerson  =  new Person(''Bob'', 25);


    console.log(newPerson.greet());  //  Output:  ''Hello, my name is Bob''


    # Object Prototypes


    Prototypes in JavaScript are a mechanism to share properties and methods between
    objects.


    ## Object Prototypes Examples:


    ### Adding Methods to the Prototype:


    javascript code


    Person.prototype.info =  function()  {


    return ''Name:  '' +  this.name +  '', Age:  '' +  this.age;


    };


    console.log(newPerson.info());  //  Output:  ''Name:  Bob, Age:  25''


    # Object Iterables


    Iterables in JavaScript are objects that can be iterated using loops.


    ## Object Iterables Examples:


    ### Using  for...in Loop:


    javascript code


    for (let key in person)  {


    console.log(key  +  '':  '' +  person[key]);


    }


    ### Using  Object.keys():


    javascript code


    let keys  =  Object.keys(person);  //  Get an array of object keys


    # Object Sets


    Sets in JavaScript are collections of unique values.


    ## Object Sets Examples:


    ### Creating a Set:


    javascript code


    let mySet  =  new Set();


    mySet.add(1);


    mySet.add(2);


    mySet.add(3);


    ### Checking Set Membership:


    javascript code


    console.log(mySet.has(2));  //  Output:  true


    # Object Maps


    Maps in JavaScript are collections of key-value pairs where keys can be any type.


    ## Object Maps Examples:


    ### Creating a Map:


    javascript code


    let myMap  =  new Map();


    myMap.set(''key1'', ''value1'');


    myMap.set(''key2'', ''value2'');


    ### Getting Values from a Map:


    javascript code


    console.log(myMap.get(''key1''));  //  Output:  ''value1''


    # Object Reference


    In JavaScript, objects are stored and passed by reference.


    ## Object Reference Examples:


    ### Referencing an Object:


    javascript code


    let object1  =  { name:  ''John'' };


    let object2  =  object1;  //  object2 points to the same object as object1


    ### Changing Object through Reference:


    javascript code


    object2.name =  ''Alice'';


    console.log(object1.name);  //  Output:  ''Alice''


    This comprehensive guide covers various aspects of JavaScript objects, including
    definitions, properties, methods, display, accessors, constructors, prototypes,
    iterables, sets, maps, and object references, with examples and explanations for
    each concept.


    # JS Functions


    Functions in JavaScript are reusable blocks of code that perform a specific task
    when called.


    ## Function Definitions:


    ### Function Declaration:


    javascript code


    function greet()  {


    return ''Hello!'';


    }


    ### Function Expression:


    javascript code


    let greet  =  function()  {


    return ''Hello!'';


    };


    ### Arrow Function:


    javascript code


    let greet = () => {


    return ''Hello!'';


    };


    # Function Parameters


    Function parameters are placeholders for values that a function will receive when
    it''s called.


    ## Function Parameters Examples:


    ### Single Parameter:


    javascript code


    function greet(name)  {


    return ''Hello, '' +  name  +  ''!'';


    }


    ### Multiple Parameters:


    javascript code


    function sum(a, b)  {


    return a  +  b;


    }


    # Function Invocation


    Function invocation means calling a function to execute its code.


    ## Function Invocation Examples:


    ### Calling a Function:


    javascript code


    greet();  //  Function call


    let result  =  sum(5, 3);  //  Function call with arguments


    # Function Call


    The  call() method in JavaScript allows a function to be called with a specified  this
    value and arguments provided individually.


    ## Function Call Examples:


    ### Using  call():


    javascript code


    function greet()  {


    return ''Hello, '' +  this.name +  ''!'';


    }


    let person  =  { name:  ''Alice'' };


    let message  =  greet.call(person);


    # Function Apply


    The  apply() method in JavaScript allows a function to be called with a specified  this
    value and arguments provided as an array.


    ## Function Apply Examples:


    ### Using  apply():


    javascript code


    function greet()  {


    return ''Hello, '' +  this.name +  ''!'';


    }


    let person  =  { name:  ''Bob'' };


    let args  = [];


    let message  =  greet.apply(person, args);


    # Function Bind


    The  bind() method in JavaScript creates a new function that, when called, has
    its  this keyword set to a specified value.


    ## Function Bind Examples:


    ### Using  bind():


    javascript code


    function greet()  {


    return ''Hello, '' +  this.name +  ''!'';


    }


    let person  =  { name:  ''Charlie'' };


    let newGreet  =  greet.bind(person);


    let message  =  newGreet();


    # Function Closures


    Closures in JavaScript are functions that retain access to variables in the scope
    where they were defined.


    ## Function Closures Examples:


    ### Closure Example:


    javascript code


    function outerFunction()  {


    let outerVariable  =  ''I am from the outer function'';


    function innerFunction()  {


    console.log(outerVariable);


    }


    return innerFunction;


    }


    let closure  =  outerFunction();


    closure();  //  Output:  ''I am from the outer function''


    This comprehensive guide covers various aspects of JavaScript functions, including
    definitions, parameters, invocation, call, apply, bind, and closures, with examples
    and explanations for each concept.


    # JS Classes


    Classes in JavaScript provide a way to create objects using a blueprint.


    ## Class Intro:


    ### Class Declaration:


    javascript code


    class Animal {


    constructor(name, age)  {


    this.name =  name;


    this.age =  age;


    }


    sound()  {


    return ''Animal sound'';


    }


    }


    ### Creating Instances:


    javascript code


    let dog  =  new Animal(''Buddy'', 3);


    console.log(dog.sound());  //  Output:  ''Animal sound''


    # Class Inheritance


    Inheritance in JavaScript classes allows a subclass to inherit properties and
    methods from a superclass.


    ## Class Inheritance Example:


    ### Extending a Class:


    javascript code


    class Dog extends Animal {


    constructor(name, age, breed)  {


    super(name, age);


    this.breed =  breed;


    }


    sound()  {


    return ''Woof!'';


    }


    }


    ### Using Inherited Methods:


    javascript code


    let puppy  =  new Dog(''Max'', 1, ''Labrador'');


    console.log(puppy.sound());  //  Output:  ''Woof!''


