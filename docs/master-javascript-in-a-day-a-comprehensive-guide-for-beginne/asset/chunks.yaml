    alice.greet();  //  Outputs:  ''Hello, my name is Alice''


    # JS Modules


    Modules in JavaScript allow splitting code into separate files or modules for
    better organization.


    ## Examples of JS Modules:


    ### Exporting a Module:


    javascript code


    //  Module.js


    export function greet(name)  {


    console.log(''Hello, '' +  name  +  ''!'');


    }


    ### Importing a Module:


    javascript code


    //  Main.js


    import { greet } from ''./Module.js'';


    greet(''Alice'');  //  Outputs:  ''Hello, Alice!''


