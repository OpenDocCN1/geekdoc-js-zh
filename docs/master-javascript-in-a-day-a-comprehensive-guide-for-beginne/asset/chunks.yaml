  trans: "\n\nJavaScript 中的变量用于存储数据值。它们可以持有各种类型的数据，如数字、字符串、对象等。\n\n## JavaScript 变量示例：\n\
    \n### 1. 声明和赋值变量：\n\n```javascript\nlet age = 25;  // 声明 'age' 并赋值为 25\n```\n\n\
    ### 2. 字符串变量：\n\n```javascript\nlet name = 'Alice';  // 一个存储字符串值的变量\n```\n\n###\
    \ 3. 对象变量：\n\n```javascript\nlet person = { name: 'Bob', age: 30 };  // 一个存储对象的变量\n\
    ```\n\n# JavaScript let\n\n`let` 关键字用于在 JavaScript 中声明变量。它允许在需要时对声明的变量重新赋值新值。\n\
    \n## JavaScript 中 let 的示例：\n\n```javascript\nlet x = 5;\nx = 10;  // 为 'x' 重新赋值值\n\
    ```\n\n# JavaScript const\n\n`const` 关键字用于在 JavaScript 中声明常量。一旦赋值，`const` 的值就不能更改。\n\
    \n## JavaScript 中 const 的示例：\n\n```javascript\nconst PI = 3.14159;  // 声明常量 PI\n\
    // PI = 3;  // 这将报错，因为不允许重新赋值\n```\n\n# JavaScript 运算符\n\nJavaScript 运算符是用于对操作数执行操作的符号，例如算术运算、赋值、比较、逻辑操作等。\n\
    \n## JavaScript 运算符示例：\n\n### 1. 算术运算符：\n\n```javascript\nlet a = 10;\nlet b =\
    \ 5;\nlet sum = a + b;  // 加法\nlet difference = a - b;  // 减法\nlet product = a\
    \ * b;  // 乘法\nlet quotient = a / b;  // 除法\n```\n\n### 2. 比较运算符：\n\n```javascript\n\
    let x = 5;\nlet y = 10;\nconsole.log(x === y);  // 等于检查\nconsole.log(x !== y);\
    \  // 不等于检查\nconsole.log(x > y);  // 大\nconsole.log(x < y);  // 小\n```\n\n###\
    \ 3. 逻辑运算符：\n\n```javascript\nlet p = true;\nlet q = false;\nconsole.log(p &&\
    \ q);  // 逻辑与\nconsole.log(p || q);  // 逻辑或\nconsole.log(!p);  // 逻辑非\n```\n\n\
    本综合指南涵盖了 JavaScript 语句、语法、注释、变量（`let` 和 `const`）以及运算符的各个方面，提供了示例和解释辅助理解。\n\n#\
    \ JS 算术\n\nJavaScript 提供了算术运算符对数字进行数学计算。\n\n## JS 算术示例：\n\n### 加法：\n\n```javascript\n\
    let sum = 5 + 3;  // sum = 8\n```\n\n### 减法：\n\n```javascript\nlet difference\
    \ = 10 - 4;  // difference = 6\n```\n\n### 乘法：\n\n```javascript\nlet product =\
    \ 6 * 7;  // product = 42\n```\n\n### 除法：\n\n```javascript\nlet quotient = 20\
    \ / 5;  // quotient = 4\n```\n\n### 取模（余数）：\n\n```javascript\nlet remainder =\
    \ 15 % 4;  // remainder = 3\n```\n\n# JS 赋值\n\n在 JavaScript 中，赋值运算符（`=`）用于向变量赋值。\n\
    \n## JS 赋值示例：\n\n### 给变量赋值：\n\n```javascript\nlet x = 10;  // 将值 10 赋值给变量 'x'\n\
    ```\n\n### 给表达式的结果赋值：\n\n```javascript\nlet y = x + 5;  // 将表达式的结果赋值给 'y'\n```\n\
    \n# JS 数据类型\n\nJavaScript 拥有几种数据类型，定义了它可以处理的值的种类。\n\n## JS 数据类型示例：\n\n### 原始值数据类型：\n\
    \n- 数字：`let num = 10;`\n- 字符串：`let text = 'Hello';`\n- 布尔值：`let isTrue = true;`\n\
    - 未定义：`let value;`\n- 空：`let emptyValue = null;`\n\n### 复杂数据类型：\n\n- 对象：`let person\
    \ = { name: 'Alice', age: 25 };`\n- 数组：`let numbers = [1, 2, 3, 4, 5];`\n\n# JS\
    \ 函数\n\nJavaScript 中的函数是可重用的代码块，调用时会执行特定任务。\n\n## JS 函数示例：\n\n### 函数声明：\n\n```javascript\n\
    function greet(name) {\n  return 'Hello, ' + name + '!';\n}\n```\n\n### 函数调用：\n\
    \n```javascript\nlet message = greet('John');  // message = 'Hello, John!'\n```\n\
    \n### 箭头函数：\n\n```javascript\nconst multiply = (a, b) => a * b;\nlet result =\
    \ multiply(5, 3);  // result = 15\n```\n\n# JS 对象\n\nJavaScript 中的对象是包含命名值（属性和方法）容器。\n\
    \n## JS 对象示例：\n\n### 对象声明：\n\n```javascript\nlet person = {\n  name: 'Alice',\n\
    \  age: 30,\n  greet: function() {\n};\n```\n\n### 访问属性：\n\n```javascript\nperson.name;\n\
    ```\n\n### 调用方法：\n\n```javascript\nperson.greet();\n```\n\n# JS 事件\n\nJavaScript\
    \ 事件是用户与页面交互时发生的动作。\n\n## JS 事件示例：\n\n### 点击事件：\n\n```javascript\ndocument.addEventListener('click',\
    \ function() {\n```\n\n### 输入事件：\n\n```javascript\ndocument.addEventListener('input',\
    \ function() {\n```\n\n# JS 字符串\n\n字符串是用在单引号或双引号内的字符序列。\n\n## JS 字符串示例：\n\n###\
    \ 声明字符串：\n\n```javascript\nlet name = 'Alice';\n```\n\n### 字符串拼接：\n\n```javascript\n\
    let message = 'Hello, ' + name;  // message = 'Hello, Alice'\n```\n\n# JS 字符串模板\n\
    \n模板字符串允许在字符串中嵌入表达式和变量。\n\n## 字符串模板示例：\n\n### 基础模板：\n\n```javascript\nlet name\
    \ = 'Alice';\nlet message = `Hello, ${name}`;  // message = 'Hello, Alice!'\n\
    ```\n\n### 多行模板：\n\n```javascript\nlet multiLineMessage = `\n这是一条\n消息`;\n```\n\
    \n# JS 数字\n\nJavaScript 使用 `number` 类型处理数值数据。\n\n## JS 数字示例：\n\n### 整数：\n\n```javascript\n\
    let integerNumber = 42;\n```\n\n### 小数：\n\n```javascript\nlet decimalNumber =\
    \ 3.14;\n```\n\n### 科学计数法：\n\n```javascript\nlet scientificNumber = 2e3;  // scientificNumber\
    \ = 2000\n```\n\n# JS BigInt\n\nBigInt 是 JavaScript 中的一种数值类型，可以表示任意精度的整数。\n\n\
    ## BigInt 示例：\n\n### 创建 BigInt：\n\n```javascript\nlet bigNumber = 123456789012345678901234567890n;\n\
    ```\n\n### 使用 BigInt 进行运算：\n\n```javascript\nlet bigSum = bigNumber + 1n;\n```\n\
    \n# JS 数字方法\n\nJavaScript 提供了对数字操作和处理的方法。\n\n## 数字方法示例：\n\n### toFixed() 方法：\n\
    \n```javascript\nlet number = 3.14159;\nlet roundedNumber = number.toFixed(2);\
    \  // roundedNumber = '3.14'\n```\n\n### parseInt() 方法：\n\n```javascript\nlet\
    \ stringNumber = '42';\nlet parsedNumber = parseInt(stringNumber);  // parsedNumber\
    \ = 42\n```\n\n# JS 数字属性\n\nJavaScript 有一些与数字相关的内置属性。\n\n## 数字属性示例：\n\n### Number.MAX_VALUE\
    \ 属性：\n\n```javascript\nconsole.log(Number.MAX_VALUE);  // 输出: 1.7976931348623157e+308\n\
    ```\n\n"
- fmt: "\n### `Number.MIN_VALUE` Property:\n\n```javascript\nconsole.log(Number.MIN_VALUE);\
    \  // Output: 5e-324\n```\n\nThis comprehensive guide covers various aspects of\
    \ JavaScript, including arithmetic operations, assignment, data types, functions,\
    \ objects, events, strings, string methods, string search, string templates, numbers,\
    \ BigInt, number methods, and number properties, providing examples and explanations\
    \ for each topic.\n\n# JS Arrays\n\nArrays in JavaScript are used to store multiple\
    \ values in a single variable.\n\n## Examples of JS Arrays:\n\n### Declaration:\n\
    \n```javascript\nlet numbers  = [1, 2, 3, 4, 5];  // Array of numbers\nlet fruits\
    \  = ['apple', 'banana', 'orange'];  // Array of strings\n```\n\n### Accessing\
    \ Elements:\n\n```javascript\nconsole.log(fruits[0]);  // Output: 'apple'\n```\n\
    \n### Modifying Elements:\n\n```javascript\nfruits[1] = 'grapes';  // Changing\
    \ 'banana' to 'grapes'\n```\n\n# JS Array Methods\n\nJavaScript provides various\
    \ methods to manipulate arrays efficiently.\n\n## Examples of JS Array Methods:\n\
    \n### `push()` Method:\n\n```javascript\nfruits.push('melon');  // Adds 'melon'\
    \ to the end of the array\n```\n\n### `pop()` Method:\n\n```javascript\nlet removedFruit\
    \  = fruits.pop();  // Removes and returns the last element ('melon')\n```\n\n\
    ### `splice()` Method:\n\n```javascript\nnumbers.splice(2, 1);  // Removes 1 element\
    \ at index 2 (removes '3')\n```\n\n# JS Array Sort\n\nJavaScript offers methods\
    \ to sort arrays in various ways.\n\n## Examples of JS Array Sort:\n\n### Sorting\
    \ Numbers:\n\n```javascript\nnumbers.sort((a, b) => a  - b);  // Ascending order\n\
    ```\n\n### Sorting Strings:\n\n```javascript\nfruits.sort();  // Alphabetical\
    \ order\n```\n\n# JS Array Iteration\n\nArray iteration involves looping through\
    \ arrays to perform operations on each element.\n\n## Examples of JS Array Iteration:\n\
    \n### `forEach()` Method:\n\n```javascript\nnumbers.forEach(number => {\n  console.log(number);\n\
    });\n```\n\n### `map()` Method:\n\n```javascript\nlet doubledNumbers  = numbers.map(number\
    \ => number  *  2);\n```\n\n# JS Array Const\n\nArrays declared with `const` can't\
    \ be reassigned but their elements can be modified.\n\n## Examples of JS Array\
    \ Const:\n\n```javascript\nconst weekdays  = ['Monday', 'Tuesday', 'Wednesday'];\n\
    weekdays[1] = 'Thursday';  // Modifying an element is allowed\n// weekdays  =\
    \ ['Monday', 'Thursday', 'Wednesday'];  // This will throw an error\n```\n\n#\
    \ JS Dates\n\nJavaScript provides a `Date` object to work with dates and times.\n\
    \n## Examples of JS Dates:\n\n### Creating a Date Object:\n\n```javascript\nlet\
    \ currentDate  = new Date();  // Current date and time\n```\n\n### Creating a\
    \ Specific Date:\n\n```javascript\nlet specificDate  = new Date('2023-12-31');\
    \  // December 31, 2023\n```\n\n# JS Date Formats\n\nDate formatting in JavaScript\
    \ involves converting dates to different formats.\n\n## Examples of JS Date Formats:\n\
    \n### Formatting to String:\n\n```javascript\nlet dateString  = specificDate.toDateString();\
    \  // Convert to a human-readable string\n```\n\n### Formatting to Locale String:\n\
    \n```javascript\nlet localeString  = specificDate.toLocaleString();  // Convert\
    \ to local date and time string\n```\n\n# JS Date Get Methods\n\nJavaScript `Date`\
    \ object provides various methods to retrieve specific date components.\n\n##\
    \ Examples of JS Date Get Methods:\n\n### `getFullYear()` Method:\n\n```javascript\n\
    let year  = specificDate.getFullYear();  // Get the year (2023)\n```\n\n### `getMonth()`\
    \ Method:\n\n```javascript\nlet month  = specificDate.getMonth();  // Get the\
    \ month (11 for December)\n```\n\n# JS Date Set Methods\n\nJavaScript `Date` object\
    \ also has methods to set specific date components.\n\n## Examples of JS Date\
    \ Set Methods:\n\n### `setFullYear()` Method:\n\n```javascript\nspecificDate.setFullYear(2024);\
    \  // Set the year to 2024\n```\n\n### `setMonth()` Method:\n\n```javascript\n\
    specificDate.setMonth(0);  // Set the month to January (0 index)\n```\n\n# JS\
    \ Math\n\nJavaScript `Math` object provides mathematical constants and functions.\n\
    \n## Examples of JS Math:\n\n### `Math.PI` Property:\n\n```javascript\nlet piValue\
    \  = Math.PI;  // Value of PI (3.141592653589793)\n```\n\n### `Math.sqrt()` Method:\n\
    \n```javascript\nlet squareRoot  = Math.sqrt(25);  // Square root of 25 (5)\n\
    ```\n\n# JS Random\n\nJavaScript `Math.random()` generates pseudo-random numbers.\n\
    \n## Examples of JS Random:\n\n### Generating Random Number:\n\n```javascript\n\
    let randomNumber  = Math.random();  // Random number between 0 and 1\n```\n\n\
    ### Generating Random Integer:\n\n```javascript\nlet randomInteger  = Math.floor(Math.random()\
    \ * 10);  // Random integer between 0 and 9\n```\n\n# JS Booleans\n\nBooleans\
    \ in JavaScript represent true or false values.\n\n## Examples of JS Booleans:\n\
    \n### Declaration:\n\n```javascript\nlet isTrue  = true;\nlet isFalse  = false;\n\
    ```\n\n### Comparison:\n\n```javascript\nlet greaterThan  = 5 > 3;  // true\n\
    let equalTo  = 5 === 3;\n```\n\n# JS Comparisons\n\nJavaScript provides various\
    \ operators to compare values.\n\n## Examples of JS Comparisons:\n\n### `==` Operator:\n\
    \n```javascript\nlet greaterThan  = 5 > 3;  // true\n```\n\n### `===` Operator:\n\
    \n```javascript\nlet equalTo  = 5 === 3;\n```\n\n# JS If Else\n\nThe `if...else`\
    \ statement executes a block of code if a condition is true.\n\n## Examples of\
    \ JS If Else:\n\n### Basic `if...else`:\n\n```javascript\nlet num  = 10;\nif (num\
    \ > 0) {\n  console.log('Number is positive');\n} else {\n  console.log('Number\
    \ is negative');\n}\n```\n\n### Nested `if...else`:\n\n```javascript\nlet x  =\
    \ 5;\nif (x > 0) {\n  console.log('x is positive');\n} else if (x < 0) {\n  console.log('x\
    \ is negative');\n} else {\n  console.log('x is zero');\n}\n```\n\n# JS Switch\n\
    \nThe `switch` statement executes different actions based on different conditions.\n\
    \n## Examples of JS Switch:\n\n### Basic `switch`:\n\n```javascript\nlet day \
    \ = 2;\nswitch (day) {\n  case 1:\n    console.log('Monday');\n    break;\n  case\
    \ 2:\n    console.log('Tuesday');\n    break;\n  default:\n    console.log('Other\
    \ day');\n}\n```\n\n# JS Loop For\n\nThe `for` loop in JavaScript repeatedly executes\
    \ a block of code until a specified condition is false.\n\n## Examples of JS Loop\
    \ For:\n\n### Basic `for` Loop:\n\n```javascript\nfor (let i  = 0; i < 5; i++)\
    \ {\n  console.log(i);\n}\n```\n\n### Looping Array Elements:\n\n```javascript\n\
    let arr  = ['apple', 'banana', 'orange'];\nfor (let i  = 0; i < arr.length; i++)\
    \ {\n  console.log(arr[i]);\n}\n```\n\n# JS Loop For In\n\nThe `for...in` loop\
    \ in JavaScript iterates over the enumerable properties of an object.\n\n## Examples\
    \ of JS Loop In:\n\n### Iterating Object Properties:\n\n```javascript\nlet person\
    \  = {\n  name:  'Alice',\n  age:  30,\n  gender:  'female'\n};\nfor (let prop\
    \ in person) {\n  console.log(prop + ': ' + person[prop]);\n}\n```\n\n# JS Loop\
    \ For Of\n\nThe `for...of` loop in JavaScript iterates over iterable objects such\
    \ as arrays, strings, etc.\n\n## Examples of JS Loop Of:\n\n### Iterating Over\
    \ Array Elements:\n\n```javascript\nlet numbers  = [1, 2, 3, 4, 5];\nfor (let\
    \ num of numbers) {\n  console.log(num);\n}\n```\n\n# JS Loop While\n\nThe `while`\
    \ loop in JavaScript executes a block of code while a specified condition is true.\n\
    \n## Examples of JS Loop While:\n\n### Basic `while` Loop:\n\n```javascript\n\
    let count  = 0;\nwhile (count < 5) {\n  console.log(count);\n  count++;\n}\n```\n\
    \n# JS Break\n\nThe `break` statement in JavaScript terminates the current loop\
    \ or switch statement.\n\n## Examples of JS Break:\n\n### Using `break` in a Loop:\n\
    \n```javascript\nfor (let i  = 0; i < 10; i++) {\n  if (i  === 5) {\n    break;\n\
    \  }\n  console.log(i);\n}\n```\n\n# JS Iterables\n\nIterables in JavaScript are\
    \ objects that can be iterated over using loops.\n\n## Examples of JS Iterables:\n\
    \n### Using Iterables with `for...of`:\n\n```javascript\nlet iterable  = [10,\
    \ 20, 30];\n```\n"
