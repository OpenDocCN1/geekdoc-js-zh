    \n# Cross-browser compliancy\n\nIn order for Web pages to display as desired it\
    \ is sometimes necessary to identify the Document Object Model (DOM) which browser\
    \ supports.\n\nRelease 4.0 of both Netscape and Internet Explorer added support\
