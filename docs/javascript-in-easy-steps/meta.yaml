    \ alert(\"NN 4 DOM\");\nelse alert(\"This is a really old browser\");\n```\ndom-test.js\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_94_2.png)\n\n# Platform check\n\nThe\
    \ performance of a Web page may be affected by the operating system on which the\
    \ browser is running due to some lack of support. ActiveX controls are one way\
    \ to create features. For example, a Web browser running on a Linux platform will\
    \ not support ActiveX controls. So any Web page containing an ActiveX control\
    \ will not perform as intended.\n\nPlatform-specific scripting can be achieved\
    \ in a similar manner to that used for browser-specific scripting, with the navigator.platform\
    \ property. This property contains a short string representing the user’s operating\
    \ system and can be read to accommodate any platform limitations. The example\
    \ below writes out the navigator.platform value:\n\n```javascript\n// get the\
    \ operating system\nvar os = navigator.platform;\ndocument.write(\"Operating system\
    \ is \" + os);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_95_0.png)\n\n\
