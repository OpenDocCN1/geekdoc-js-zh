    # 索引


    # 介绍 JavaScript


    欢迎来到 JavaScript 世界。本章介绍了 JavaScript 语言并说明了如何向 HTML 文档添加 JavaScript。列出了所有的 JavaScript
    语言关键字，并解释了函数和变量的基本要素。


    - 导言 | 8

    - 在 HTML 中引入 JavaScript | 9

    - Hello World | 10

    - 语法规则 | 11

    - 关键字 | 12

    - 变量 | 13

    - 数据类型 | 14

    - 转义序列 | 15

    - 函数 | 16

    - 函数参数 | 17

    - 多个函数 | 18

    - 变量作用域 | 19

    - 多参数 | 20


    # 导言


    JavaScript 是一种解释型编程语言，其解释器嵌入在 Web 浏览器软件中，例如 Microsoft Internet Explorer 和 Netscape
    Navigator。


    这意味着 Web 文档中包含的脚本在加载到浏览器窗口时即可被浏览器的 JavaScript 引擎读取。


    ![](img/d78298d3338ec680a024bbc83e78b297_9_0.png)


    通过这种方式，可以使 Web 文档响应用户的操作，并执行动态视觉效果。


    JavaScript 不应与 Sun Microsystems 的名为 Java 的编译型编程语言混淆，尽管两者某些相似之处，但它们是完全不同的语言。


