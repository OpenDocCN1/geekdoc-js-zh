  md: '# Numbers from strings


    A number can be extracted from the beginning of a string with the parseInt() and
    parseFloat() methods.


    The parseInt() method parses the string and returns the integer value that is
    located. The parseFloat() method works in the same way but returns a floating
    number.


    If the parser finds any non-numeric character before returning a number then it
    will return the special NaN value that is used to denote "Not-a-Number".


    This example demonstrates both parseFloat() and parseInt() methods and illustrates
    the JavaScript isNaN() function testing for a NaN value:


    ```

    // create a string beginning with a number

    var str = "66.6% PASS RATE";


    // extract the initial integer value

    var res = "Integer: " + parseInt(str);


    // extract the initial float value

    res += "\nFloat: " + parseFloat(str);


    // create a string beginning with a letter

    var badstr = "PASS RATE 66.6%";


    // attempt to extract an initial integer value

    res += "\nNon-numeric : " + parseInt(badstr);

    res += "\nFound : ";

    res += isNaN(badstr) ? "Character": "Number"

    alert(res);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_85_0.png)


    The NaN value cannot be tested with the == operator.


    ![](img/d78298d3338ec680a024bbc83e78b297_85_1.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_85_2.png)'
