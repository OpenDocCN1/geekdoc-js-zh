  md: "# # The switch statement\n\nConditional branching using the if-else statement\
    \ may be more efficiently performed using a switch statement when a test expression\
    \ evaluates the value of just one variable.\n\nThe switch statement works in an\
    \ unusual way – first it evaluates a given expression, then it seeks a label to\
    \ match the resulting value. The code associated with the label will be executed,\
    \ or if no match is made, the switch statement will execute any default code.\n\
    \nThe JavaScript case keyword is used to denote a label and the default keyword\
    \ denotes the default code.\n\nAll label code must be terminated by a break statement\
    \ using the JavaScript break keyword.\n\nThe labels may be numbers, strings, or\
    \ booleans but must all be of the same type, like in this example that uses number\
    \ types:\n\n![](img/d78298d3338ec680a024bbc83e78b297_36_0.png)\n\nFor more detail\
    \ on the break statement see page 40.\n\n```\nvar num = 2;\n\nswitch(num) {\n\
    \  // is the number 1 ?n  case 1 : alert(\"This is case 1\"); break;\n\n  // is\
    \ the number 2 ?n  case 2 : alert(\"This is case 2\"); break;\n\n  // is the number\
    \ 3 ?n  case 3 : alert(\"This is case 3\"); break;\n\n  // if none of those numbers\
    \ do this...\n  default : alert(\"This is default code\");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_36_1.png)\n\
    \nswitch.js\n\n![](img/d78298d3338ec680a024bbc83e78b297_36_2.png)\n\nOmitting\
    \ the ending break keywords will allow execution of all other code in the switch\
    \ statement.\n\n![](img/d78298d3338ec680a024bbc83e78b297_36_3.png)\n\n3. Making\
    \ statements | 35"
  merge: -1
