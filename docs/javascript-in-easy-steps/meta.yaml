  md: "The Unload event occurs whenever the browser unloads a document from a new\
    \ window, or frame, usually when the user navigates to a new URL.\n\nThe unload\
    \ event-handler may call a final JavaScript function to be run just before the\
    \ document unloads. When a frames page is unloaded the onunload event-handler\
    \ of each frame may call a final function.\n\nThe unload event-handler is useful\
    \ to save the final state of data on that page in a cookie or by submission to\
    \ the server.\n\nIt is also used to open new pop-up windows containing further\
    \ information that the user may find useful.\n\nThe example below illustrates\
    \ the use of the unload event-handler to open a new pop-up window:\n\n```\n//\
    \ a function to react to the UNLOAD EVENT\nfunction leaving() {\n  // open a HTML\
    \ document in a pop-up window\n  var win = window.open(\"finally.html\", \"\"\
    ,\n  \"top=50,left=50,width=300,height=100\") );\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_152_0.png)\n\
    \n```\n// specify the unload event-handler\nwindow.onunload = leaving;\n```\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_152_1.png)\n\n| Unload Event | | | |\n\
    |---|---|---|---||\n| File Edit View Favorites Tools Help |\n| Go to | And finally...\
    \ We're sorry to see you go - Visit a similar site ?"
