  md: "# # Rollover\n\nIf an image has been named in the HTML code, assigning a value\
    \ to the <img> tag's id attribute, it may also be addressed by this name in JavaScript.\
    \ The syntax is document.images.imgname – so an image click is addressed as document.images.click.\n\
    \nAssigning a new value to the src property of an image causes the browser to\
    \ replace the image. Typically this is seen in rollovers – when the cursor is\
    \ over an image it is replaced by a second image, the original image is returned\
    \ when the cursor moves away. The <img> tag must include an onmouseover attribute\
    \ and an onmouseout attribute to create a rollover effect, like:\n\n```\n<img\
    \ id=\"click\" src=\"off.gif\" alt=\"\"\n  onmouseover=\"swap(1)\" onmouseout=\"\
    swap(0)\" />\n```\n\nThese attributes call the JavaScript image-swapping function\
    \ whenever the onmouseover or onmouseout events occur:\n\n![](img/d78298d3338ec680a024bbc83e78b297_118_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_118_1.png)\n\n```\nfunction swap(n)\n\
    \  if (n == 0)document.images.click.src = \"off.gif\";\n  if (n == 1)document.images.click.src\
    \ = \"over.gif\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_118_2.png)\n\
    \n| Rollover Example |\n| File Edit View Favorites Tools Help |\n| Click Here\
