  md: '# Focus


    The Focus event occurs when the user clicks on a form element or on a window to
    direct the browser''s focus.


    The onfocus event-handler can call a JavaScript function when the focus is received.


    A HTML onfocus attribute can be added to form elements to specify a function to
    execute when it receives focus, like...


    ```

    <input type="text" name="txt1"

    value="Enter quantity here" onfocus="wipe(this)"

    <input type="text" name="txt2"

    value="Enter data here" onfocus="wipe(this)">

    ```


    In the example below, the text inputs initially display the strings assigned to
    their value attributes.


    When the user clicks each text input it receives focus so the wipe(this) function
    assigns an empty string to its value attribute. This clears the displayed text
    and places the cursor in the appropriate position ready for the user to input
    text into that field.


    ```

    // a function to clear a text input

    function wipe(obj ) {


    // clear the form field

    obj.value=""

    // reset the focus

    obj.focus();

    }

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_153_0.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_153_1.png)


    | Focus Event |

    |---||

    | File | Edit | View | Favorites | Tools | Help |

    | Quantity: | I |

    | Description: | Enter data here | |

    | Done | Local intranet |


    ![](img/d78298d3338ec680a024bbc83e78b297_153_2.png)


