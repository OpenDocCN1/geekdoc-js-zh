  - "[PAGE 105]\n\n# Pop-up window\n\nOne of the most useful browser features provided\
    \ by JavaScript is the ability to open a second browser window displaying another\
    \ URL Web page.\n\nThis is possible using the window.open() method which takes\
    \ three arguments to specify the URL to load in the pop-up window, a name for\
    \ the pop-up and its desired dimensional features.\n\nThese pop-up windows are\
    \ invariably smaller than the original window and have many uses including the\
