    \ of the main layer and the menu layers:\n\n```\n// Netscape/Mozilla capture events\
    \ instruction\nif (navigator.appName == \"Netscape\")nwindow.captureEvents(Event.MOUSEMOVE);\n\
    \n// specify the onmousemove event-handler...\ndocument.onmousemove = track;\n\
    \n// get the menu layer objects\nvar m1 = document.getElementById(\"menu_1\");\n\
    var m2 = document.getElementById(\"menu_2\");\nvar m3 = document.getElementById(\"\
    menu_3\");\n\n// a function to react to the MOUSEMOVE event\n// and to dynamically\
    \ hide menu layers\nfunction track(e) {\n  // get the current x.y coordinates\n\
    \  var x = (document.all) ? e.pageX;\n  var y = (document.all) ? e.pageY;\n\n\
    \  // hide 1 if out of bounds\n  if (x<60 || y<53) m1.style.visibility = \"hidden\"\
    ;\n  // hide 2 if out of bounds\n  if (x<70 || x>130 || y<53) m2.style.visibility\
    \ = \"hidden\";\n  // hide 3 if out of bounds\n  if (x<140 || x>200 || y<53) m3.style.visibility\
    \ = \"hidden\";\n}\n\n// a function to reveal a menu layer\nfunction reveal(menu)\
    \ {\n  if (menu == 1) m1.style.visibility = \"visible\";\n  if (menu == 2) m2.style.visibility\
    \ = \"visible\";\n  if (menu == 3) m3.style.visibility = \"visible\";\n}\n```\n\
