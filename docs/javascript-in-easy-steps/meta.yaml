  - "[PAGE 147]\n\n# # Mouse down and mouse up\n\nA MouseDown event occurs when the\
    \ user presses a mouse button and a MouseUp event occurs when it is released.\n\
    \nTypically these are used together so that a single mouse click will use two\
    \ event-handlers, like this:\n\n```\n<input type = \"button\" value = \"Light\
    \ Switch\"\nonmousedown = \"light(1)\" onmouseup = \"light(0)\">\n```\n\nThis\
    \ example swaps an image and changes when the cursor is over the image and a mouse\
    \ is pressed. It reverts to their original state when the button is released:\n\
    \n```\n// a function to react to MOUSEDOWN and MOUSEUP events\nfunction light(n)\n\
    {\n  if ( n == 1 ) {\n    document.images.bulb.src = \"bulbon.gif\";\n    document.forms.f.txt.value\
    \ = \"Button is Down\";\n  }\n  if ( n == 0 ) {\n    document.images.bulb.src\
    \ = \"bulboff.gif\";\n    document.forms.f.txt.value = \"Button is Up\";\n  }\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_147_0.png)\n\n**HOT TIP** The\
    \ document, link, image and button HTML elements support attributes for mouseup\
    \ and mousedown.\n\n![](img/d78298d3338ec680a024bbc83e78b297_147_1.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_147_2.png)"
  - "[PAGE 148]\n\n# Mouse buttons\n\nJavaScript can determine which mouse button\
    \ has been pressed by examining properties of the MouseDown event.\n\nWith Internet\
    \ Explorer the left mouse button stores an integer value of 1 in the event.button\
    \ property, the right mouse button stores an integer value of 2 and the center\
    \ button, if present, stores an integer value of 3.\n\nHere this property is used\
    \ to inhibit the Internet Explorer context menu that normally appears when the\
    \ right mouse button is pressed by the user:\n\n```\n// store a default message\n\
    var msg = \"Right-Click Context Menu Is Disabled\";\n// a function to stop the\
    \ IE context menu\nfunction stopmenu(e)\n{\n  // for Internet Explorer browsers\n\
    \  if(navigator.appName == \"Microsoft Internet Explorer\"\n  && ( event.button\
    \ == 2 || event.button == 3 ))\n{\n    alert( msg );\n    return false;\n  }\n\
    }\n// specify the onmousedown event-handler\ndocument.onmousedown = stopmenu;\n\
    ```\n\n![](img/d78298d3338ec680a024bbc83e78b297_148_0.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_148_1.png)"
- md: "\n## Key down and key up\n\nA KeyDown event occurs when the user presses a\
    \ keyboard button and a KeyError event occurs when it is released. Typically these\
    \ are used together so that a single key depression will use two event-handlers.\n\
    \nThis example swaps an image and changes the value of a text box when a keyboard\
    \ key is pressed but reverts both to their original state when the key button\
    \ is released:\n\n```javascript\n// Netscape/Mozilla capture events instruction\n\
    if (navigator.name == \"Netscape\") {\n    window.captureEvents(Event.KEYDOWN,\
    \ Event.KEYUP);\n}\n\n// a function to react to KEYDOWN events\nfunction isdown()\
    \ {\n    document.images.bulb.src = \"bulbon.gif\";\n    document.forms.f.txt.value\
    \ = \"Key is Down\";\n}\n\n// a function to react to KEYUP events\nfunction isup()\
    \ {\n    document.images.bulb.src = \"bulffoff.gif\";\n    document.forms.f.txt.value\
    \ = \"Key is Up\";\n}\n\n// define the event-handlers\ndocument.onkeydown = isdown;\n\
    document.onkeyup = isup;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_149_0.png)\n\
    \nNotice how the first lines of this script capture both KeyDown and KeyUp events\
    \ for Netscape/Mozilla browsers.\n\n![](img/d78298d3338ec680a024bbc83e78b297_149_1.png)\n\
    \n| KeyUp and KeyDown | |\n| File | Edit | View | Favorites |\n|---|---|---|---|\n\
    | | | | |\n| Key is Down | | | |\n\n| KeyUp and KeyDown | |\n| File | Edit | View\
    \ | Favorites |\n|---|---|---|---|\n| | | | |\n| Key is Up | | | |\n\n## Key codes\n\
    \nThe KeyDown event can also be used to get the Unicode character code number\
    \ of a key depression.\n\nThis example looks for the Y and N character codes,\
    \ in both upper and lower case, then branches the script according to the value.\n\
    \n```javascript\n// Netscape/Mozilla capture events instruction\nif (navigator.appName\
    \ == \"Netscape\")\nwindow.captureEvents ( Event.KEYDOWN );\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_150_0.png)\n\
    \n```javascript\nfunction showkey(e) {\n  var msg = \"\", fwd = \"Y pressed\"\
    ;\n```\n\n```javascript\n// check key codes in Netscape/Mozilla browsers\nif(navigator.appName\
    \ == \"Netscape\") {\n  if(e.which == 89 || e.which == 121 ) msg = fwd;\n  if(e.which\
    \ == 78 || e.which == 110) msg = hlt;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_150_1.png)\n\
    \nUnicode values for common characters are the same as ASCII codes so in this\
    \ Y=89, N=78 y=121 and n=110.\n\n```javascript\n// check key codes in Internet\
    \ Explorer\nif(navigator.appName == \"Microsoft Internet Explorer\") {\n  if(event.keyCode==88\
    \ || event.keyCode==121)msg = fwd;\n  if(event.keyCode==78 || event.keyCode==110)msg\
    \ = hlt;\n```\n\n```javascript\n// display the appropriate message\nif(msg !=\
    \ \"\") alert(msg);\n```\n\n```javascript\n// define the event-handler\ndocument.onkeydown=showkey;\n\
    ```\n\n![](img/d78298d3338ec680a024bbc83e78b297_150_2.png)\n\n## Load\n\nThe Load\
    \ event does not occur until all the HTML elements on a Web page have completely\
    \ loaded. This means that the onload event-handler will only run after all the\
    \ elements are present.\n\nIf JavaScript is to modify elements of the document\
    \ <body> section those elements must be loaded to avoid receiving a script error.\n\
    \nTypically the onload event-handler will call a JavaScript function, often named\
    \ init(), that will initialize a number of values.\n\nThis example sets the HTML\
    \ page colors, then it assigns a value to a variable which it subsequently assigns\
    \ to a text box:\n\n![](img/d78298d3338ec680a024bbc83e78b297_151_0.png)\n\n```javascript\n\
    // a function to react to the LOAD event\nfunction init() {\n  // set foreground\
    \ and background colors\n  document.bgColor = \"orange\";\n  document.fgColor\
    \ = \"blue\";\n\n  // store a string then display it in a form field\n  var str\
    \ = \"The Page is Loaded\";\n  document.forms.f.txt.value = str;\n\n  // specify\
    \ the onload event-handler\n  window.onload = init;\n}\n```\n\nA HTML event-handler\
    \ assigned to the onload attribute of the <body> tag would replace that assigned\
    \ in the script.\n\n![](img/d78298d3338ec680a024bbc83e78b297_151_1.png)\n\nThe\
    \ Unload event occurs whenever the browser unloads a document from a new window,\
    \ or frame, usually when the user navigates to a new URL. The unload event-handler\
    \ may call a JavaScript function to run just before the document unloads. When\
    \ a frame is unloaded the onload event-handler may call a final function. The\
    \ unload event-handler is useful to save the final state of data on that page\
    \ in a cookie or by submission to the server. It is also used to open new pop-up\
    \ windows containing further information that the user may find.\n\nThe example\
    \ below illustrates the use of the unload-handler to open a new pop-up window:\n\
    \n```javascript\n// a function to react to UNLOAD\nfunction leaving() {\n  //\
    \ open a HTML document in a pop-up window\n  var win = window.open(\"finally.html\"\
    , \"\",\n  \"top=50,left=50,width=300,height=100\");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_152_0.png)\n\
    \n```javascript\n// specify the unload event-handler\nwindow.onunload = leaving;\n\
    ```\n\n![](img/d78298d3338ec680a024bbc83e78b297_152_1.png)\n\n| Unload Event |\
    \ | |\n|---|---|---|\n| File Edit View Favorites Help | | |\n| Go to We're sorry\
    \ to see you | Visit a similar site |\n\n## Focus\n\nThe Focus event occurs when\
    \ the user clicks on form element or window to direct the browser's focus. The\
    \ onfocus event-handler can call a JavaScript function when the focus is received.\
    \ A HTML onfocus attribute can be added to form elements to specify a function\
    \ when it receives focus, like:\n\n```html\n<input type=\"text\" name=\"txt1\"\
    \ value=\"Enter quantity here\" onfocus=\"wipe(this)\">\n<input type=\"text\"\
    \ name=\"txt2\" value=\"Enter data here\" onfocus=\"wipe(this)\">\n```\n\nIn the\
    \ example below, the text inputs initially display the strings assigned to their\
    \ value attributes. When the user clicks each input it receives focus so the wipe(this)\
    \ function assigns an empty string to its value attribute. This clears the displayed\
    \ text and places the cursor in the appropriate position ready for the user to\
    \ input text into that field.\n\n```javascript\n// a function to clear a text\
    \ input\nfunction wipe(obj) {\n  // clear the form field\n  obj.value=\"\";\n\
    \  // reset the focus\n  obj.focus();\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_153_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_153_1.png)\n\n| Focus Event | | | |\
    \ | |\n|---|---|---|---|---|---|\n| File | Edit | View | Favorites | Tools | Help\
    \ |\n| Quantity: | I | | | | |\n| Description: | Enter data here | | | | |\n|\
    \ Done | Local intranet | | | | |\n\n## Blur\n\nA Blur event occurs when the browser’s\
    \ focus moves away from a form element, or a window, and the onblur event-handler\
    \ may then call a JavaScript function. The blur() method of a form element is\
    \ useful to prevent user input for text boxes that must be read-only. A blur()\
    \ method can be called from the HTML autofocus attribute of the read-only element,\
    \ like this:\n\n```html\n<input type=\"text\" size=\"30\" value=\"This field is\
    \ read-only\" autofocus=\"blur(this)\">\n```\n\nIn the following example the user\
    \ is reminded that the text box they just left should receive some input:\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_154_0.png)\n\n```javascript\n// a function\
    \ to examine a passed string argument\nfunction is_entry(val) {\n  // if the text\
    \ field is empty\n  if (val == \"\")\n  // ...display a message\n  alert(\"Please\
    \ enter data \");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_154_1.png)\n\
    \nUsing the window.blur() method will typically minimize the window.\n\n![](img/d78298d3338ec680a024bbc83e78b297_154_2.png)\n\
    \n## Change\n\nThe Change event occurs when the value of a text input is changed\
    \ or when the user selects an item in an options list. The onchange event-handler\
    \ can call a JavaScript function to execute some code whenever the Change occurs.\n\
    \nThe example below sets the initial selected option to Green then assigns an\
    \ event-handler that displays the associated value in a text box when the selection\
    \ is changed:\n\n```javascript\n// a function to set the selected item in a list\n\
    function init() {\n  document.forms.f.s.options[1].selected = true;\n  // specify\
    \ an onchange event-handler\n  document.forms.f.s.onchange = show_selected;\n\
    }\n\n// a function to display the selected list item\nfunction show_selected()\
    \ {\n  document.forms.f.txt.value = document.forms.f.s.options[document.forms.f.s.selectedIndex].value;\n\
    }\n\n// specify the onload event-handler\nwindow.onload = init;\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_155_0.png)\n\
    \n| Change Event | | |\n|---|---|---|\n| File Edit View Favorites Tools Help |\
    \ | |\n| Red | Red | |\n| Green | | |\n| Blue | | |\n| Done | Local intranet |\
    \ |\n"
  mdcn: "\n\n## 按键按下与释放\n\n当用户按下键盘按键时，会触发 KeyDown 事件；当释放按键时会触发 KeyError 事件。通常这些事件会配合使用，使得单次按键动作会触发两个事件处理器。\n\
    \n此示例在按下按键时切换图像并更改文本框的值，在释放按键时则将两者都恢复到初始状态：\n\n```javascript\n// Netscape/Mozilla\
    \ 捕获事件指令\nif (navigator.name == \"Netscape\") {\n    window.captureEvents(Event.KEYDOWN,\
    \ Event.KEYUP);\n}\n\n// 响应 KEYDOWN 事件的函数\nfunction isdown() {\n    document.images.bulb.src\
    \ = \"bulbon.gif\";\n    document.forms.f.txt.value = \"Key is Down\";\n}\n\n\
    // 响应 KEYUP 事件的函数\nfunction isup() {\n    document.images.bulb.src = \"bulffoff.gif\"\
    ;\n    document.forms.f.txt.value = \"Key is Up\";\n}\n\n// 定义事件处理器\ndocument.onkeydown\
    \ = isdown;\ndocument.onkeyup = isup;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_149_0.png)\n\
    \n注意此脚本的前几行如何为 Netscape/Mozilla 浏览器捕获了 KeyDown 和 KeyUp 事件。\n\n![](img/d78298d3338ec680a024bbc83e78b297_149_1.png)\n\
    \n| 释放与按下 | | |\n| 文件 | 编辑 | 视图 | 收藏 |\n|---|---|---|---|\n| | | | |\n| 键已按下 |\
    \ | | |\n\n| 释放与按下 | | |\n| 文件 | 编辑 | 视图 | 收藏 |\n|---|---|---|---|\n| | | | |\n\
    | 键已释放 | | | |\n\n## 键码\n\nKeyDown 事件也可以用于获取按键按下时的 Unicode 字符编码。\n\n此示例查找 Y 和\
    \ N 字符的大小写编码，然后根据值对脚本进行分支处理。\n\n```javascript\n// Netscape/Mozilla 捕获事件指令\nif\
    \ (navigator.appName == \"Netscape\")\nwindow.captureEvents ( Event.KEYDOWN );\n\
    ```\n\n![](img/d78298d3338ec680a024bbc83e78b297_150_0.png)\n\n```javascript\n\
    function showkey(e) {\n  var msg = \"\", fwd = \"Y pressed\";\n```\n\n```javascript\n\
    // 在 Netscape/Mozilla 浏览器中检查键码\nif(navigator.appName == \"Netscape\") {\n  if(e.which\
    \ == 89 || e.which == 121 ) msg = fwd;\n  if(e.which == 78 || e.which == 110)\
    \ msg = hlt;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_150_1.png)\n\n常用字符的\
    \ Unicode 值与 ASCII 码相同，因此 Y=89，N=78，y=121  n=110。\n\n```javascript\n// 在 Internet\
    \ Explorer 中检查键码\nif(navigator.appName == \"Microsoft Internet Explorer\") {\n\
    \  if(event.keyCode==88 || event.keyCode==121)msg = fwd;\n  if(event.keyCode==78\
    \ || event.keyCode==110)msg = hlt;\n```\n\n```javascript\n// 显示恰当的消息\nif(msg !=\
    \ \"\") alert(msg);\n```\n\n```javascript\n// 定义事件处理器\ndocument.onkeydown=showkey;\n\
    ```\n\n![](img/d78298d3338ec680a024bbc83e78b297_150_2.png)\n\n## 加载 (Load)\n\n\
    直到 Web 页面上的所有 HTML 元素完全加载后，Load 事件才会发生。这意味着 onload 事件处理器将在所有元素存在后才会运行。\n\n如果用\
    \ JavaScript 修改文档 `<body>` 部分的元素，这些元素必须已经加载，以避免接收脚本错误。\n\n通常，onload 事件处理器会调用一个\
    \ JavaScript 函数（通常命名为 `init()`），该函数会初始化多个值。\n\n此示例设置了 HTML 页面颜色，然后给变量赋值一个值，随后将该值赋值给文本框：\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_151_0.png)\n\n```javascript\n// 响应\
    \ LOAD 事件的函数\nfunction init() {\n  // 设置前景和背景颜色\n  document.bgColor = \"orange\"\
    ;\n  document.fgColor = \"blue\";\n\n  // 存储字符串并在表单字段中显示\n  var str = \"The Page\
    \ is Loaded\";\n  document.forms.f.txt.value = str;\n\n  // 指定 onload 事件处理器\n\
    \  window.onload = init;\n}\n```\n\n位于 `<body>` 标签 `onload` 属性的 HTML 事件处理器将替换脚本中已赋值的内容。\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_151_1.png)\n\n当浏览器从新窗口或框架中卸载文档时，Unload\
    \ 事件就会发生，通常是在用户导航到新 URL 时。unload 事件处理器可以在文档卸载之前运行一个 JavaScript 函数。当框架被卸载时，onload\
    \ 事件处理器可能会调用一个最终函数。unload 事件处理器用于将该页面数据的最终状态保存到 cookie 中或通过提交到服务器。它还用于打开包含用户可能感兴趣的进一步信息的弹出窗口。\n\
    \n下面的示例说明了如何使用 unload 处理器打开新的弹出窗口：\n\n```javascript\n// 响应 UNLOAD 的函数\nfunction\
    \ leaving() {\n  // 在弹出窗口中打开 HTML 文档\n  var win = window.open(\"finally.html\"\
    , \"\",\n  \"top=50,left=50,width=300,height=100\");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_152_0.png)\n\
    \n```javascript\n// 指定 unload 事件处理器\nwindow.onunload = leaving;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_152_1.png)\n\
    \n| 卸载事件 | | | |\n|---|---|---|---|\n| 文件 编辑 视图 收藏 帮助 | | | |\n| 我们遗憾看到您离开 | 访问类似网站\
    \ | | |\n\n## 焦点 (Focus)\n\n当用户点击表单元素或窗口引导浏览器焦点时，会发生 Focus 事件。onfocus 事件处理器在接收焦点时可以调用\
    \ JavaScript 函数。可以在表单元素上添加 HTML `onfocus` 属性，以便在接收焦点时指定函数，例如：\n\n```html\n<input\
    \ type=\"text\" name=\"txt1\" value=\"Enter quantity here\" onfocus=\"wipe(this)\"\
    >\n<input type=\"text\" name=\"txt2\" value=\"Enter data here\" onfocus=\"wipe(this)\"\
    >\n```\n\n在下面的示例中，文本输入最初显示赋值给 `value` 属性的字符串。当用户点击每个输入框时，它获得焦点，`wipe(this)` 函数为其\
    \ `value` 属性分配一个空字符串。这清除了显示的文本并将光标置在适当的位置，准备供用户输入。显示选定列表项的值：\n\n```javascript\n\
    // 清空文本输入的函数\nfunction wipe(obj) {\n  // 清空表单\n  obj.value=\"\";\n  // 重置焦点\n\
    \  obj.focus();\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_153_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_153_1.png)\n\n| 焦点事件 | | | | |\n|---|---|---|---|---|\n\
    | 文件 编辑 视图 收藏 帮助 | | | | |\n| 数量: | | | | |\n| 描述: | 输入数据 | | | |\n| 完成 | | |\
    \ | |\n\n## 失焦 (Blur)\n\n当焦点离开表单元素或窗口时会发生 Blur 事件，onblur 事件处理器可以调用 JavaScript\
    \ 函数。表单元素的 `blur()` 方法用于不允许用户输入的文本框。可以从 HTML `autofocus` 属性调用它，例如：\n\n```html\n\
    <input type=\"text\" size=\"30\" value=\"This field is read-only\" autofocus=\"\
    blur(this)\">\n```\n\n在以下示例中，用户被提醒他们离开的文本框应该接收输入：\n\n```javascript\n// 检查传递的字符串参数的函数\n\
    function is_entry(val) {\n  // 如果字段为空\n  if (val == \"\")\n  // ...显示消息\n  alert(\"\
    Please enter data \");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_154_0.png)\n\
    \n使用 `window.blur()` 方法通常会最小化窗口。\n\n## 更改\n\n当文本输入的值发生变化或用户在选项列表中选择项目时，会发生 Change\
    \ 事件。onchange 事件处理器可以在更改发生时调用 JavaScript 函数来执行某些代码。\n\n下面的示例将初始选项设置为绿色，然后分配一个处理器，在选择更改时将关联的值显示在文本框中：\n\
    \n```javascript\n// 设置列表中选中项目的函数\nfunction init() {\n  document.forms.f.s.options[1].selected\
    \ = true;\n  // 指定 onchange 事件处理器\n  document.forms.f.s.onchange = show_selected;\n\
    }\n\n// 显示选定列表项的函数\nfunction show_selected() {\n  document.forms.f.txt.value =\
    \ document.forms.f.s.options[document.forms.f.s.selectedIndex].value;\n}\n\n//\
    \ 指定 onload 事件处理器\nwindow.onload = init;\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_155_0.png)\n\
    \n| 更改事件 | | |\n|---|---|---|\n| 文件 编辑 视图 收藏 工具 帮助 | | |\n| 红色 | 红色 | |\n| 绿色\
    \ | | |\n| 蓝色 | | |\n| 完成 | 本地网络 | |\n\n"
