    \n> HOT TIP The substr() method will invariably be easiest to use.\n\n![](img/d78298d3338ec680a024bbc83e78b297_82_1.png)\n\
    \n7. Working with strings | 81\n\n# Convert to string\n\nIt is possible to manually\
    \ call the JavaScript function that is used to convert other data types to strings\
    \ by calling the object.toString() method.\n\nThis is an essential JavaScript\
    \ function and will always try to return a string representation of the object\
