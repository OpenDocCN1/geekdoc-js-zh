  md: "# Mouse over\n\nA MouseOver event occurs when the user places the cursor over\
    \ an object on a Web page.\n\nThe anchor <a> element can specify an event-handler\
    \ for the MouseOver event by assigning a JavaScript function call to the HTML\
    \ onmouseover attribute, like this:\n\n```\n<a href=\"target.html\" onmouseover=\"\
    do_mouseover()\"></a>\n```\n\nMost frequently the event-handler will perform an\
    \ image swap as a rollover effect but any statements may be executed.\n\nThe example\
    \ below assigns string value to an input text box when the cursor is placed over\
    \ an image:\n\n```\n// a function to react to the MOUSEOVER event\nfunction do_mouseover()\
    \ {\n\n  // display a message in a form field\n  document.forms.f.txt.value =\
    \ \"Mouse is Over the link\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_145_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_145_1.png)"
  merge: -1
