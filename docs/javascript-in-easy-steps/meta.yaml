  md: '# # Including JavaScript in HTML


    In order to include JavaScript in a Web document a script block can be defined
    within the HTML code.


    The script block may be defined anywhere within the HTML code although the usual
    place is inside the head section of the document, between the <head> and </head>
    tags.


    When a browser loads a document it reads (parses) the code sequentially. So placing
    the script block in the head of the document ensures that the JavaScript code
    is parsed before the rest of the HTML code and document''s body content.


    A script block looks like this :


    ```

    <script type = "text/javascript">

    </script>

    ```


    The actual code could be added between the HTML <script> and </script> tags.


    Alternatively, JavaScript code may be separated from the HTML code by writing
    all the JavaScript code inside a JavaScript file. This is simply a text document,
    that is saved with a .js file extension, and contains no HTML tags whatsoever.


    The script reference should still be placed in the document head section with
    an added src attribute pointing the browser to the URL of the JavaScript file,
    like this example:


    ```

    <script type = "text/javascript" src = "mycode.js">

    </script>

    ```


    Notice that the <script> closing tag is still required.


    ![](img/d78298d3338ec680a024bbc83e78b297_10_0.png)


    This is a better method than writing the code in a script block within the HTML
    document as it makes the code easier to maintain, avoids conflicts between JavaScript
    and XML, and allows the JavaScript code to be accessible to several HTML documents.


    All the JavaScript examples listed in this book are JavaScript files that are
    named as their HTML counterpart. For instance, hello.html calls upon the JavaScript
    code in hello.js.'
  merge: -1
  pgno: 10
- img_proc: true
  md: "# # Hello World\n\nTo make a JavaScript alert dialog box appear is just a matter\
    \ of calling the intrinsic JavaScript alert() function, like this:\n\n```\nalert(\"\
    Hello World\");\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_11_0.png)\n\n\
    This script can now be included in an HTML document by adding a <script> element\
    \ specifying its type and URL address:\n\n```\n<head>\n  <title>Hello World</title>\n\
    \  <script type=\"text/javascript\" src=\"hello-alert.js\"></script>\n</head>\n\
    ```\n\n![](img/d78298d3338ec680a024bbc83e78b297_11_1.png)\n\nWhen this document\
    \ is loaded into the Web browser engines the instructions contained in the JavaScript\
    \ code.\n\n> ![This same method of including JavaScript files in a HTML document\
    \ is used by all the examples in this book.]\n\nIn this case, the JavaScript code\
    \ causes the browser to open an alert() dialog box bearing the message contained\
    \ within the quotation marks inside the brackets.\n\n![](img/d78298d3338ec680a024bbc83e78b297_11_2.png)\n\
    \nThe quotation marks inside the brackets do not actually appear as part of the\
    \ message because they are just used by JavaScript to denote a string of characters\
    \ that is the text content of the message itself.\n\n![](img/d78298d3338ec680a024bbc83e78b297_11_3.png)\n\
    \nAll text strings in JavaScript are contained in this way."
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Syntax rules


    Notice that there is a semi-colon character at the end of the JavaScript statement
    on the facing page to comply with the required JavaScript language syntax rules.


    This must be added at the end of every JavaScript statement – in the same way
    that a period is used to terminate a sentence in the English language syntax rules.


    Most importantly, JavaScript is a case-sensitive language where "ALERT", "Alert"
    and "alert" are seen as three different words.


    All JavaScript keywords are in lowercase only using ALERT("Hello World") or Alert("Hello
    World") in the previous code example would not call the JavaScript alert() function.


    ![](img/d78298d3338ec680a024bbc83e78b297_12_0.png)


    Spaces, tabs and new lines are collectively known as whitespace and are completely
    ignored by JavaScript so the code may be formatted and indented to make its appearance
    more easily human-readable.


    It is often useful to add comments to JavaScript code as explanation. The parser
    sees any text between // and the end of that line as a single-line comment, which
    it ignores. Also any text, on one or more lines, between /* and */ is ignored.


    ![](img/d78298d3338ec680a024bbc83e78b297_12_1.png)


    ```

    /* Here is an introduction

    // to this script code that

    // uses a multi-line comment */


    // This is a single-line comment


    // Display a greeting

    alert("Hello World\ );

    ```


    Excessive commenting is best avoided – this can dramatically increase the size
    of a JavaScript file.'
  merge: -1
