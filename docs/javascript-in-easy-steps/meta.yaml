- md: "\n# String length\n\nA string in JavaScript is simply zero or more characters\
    \ enclosed within quotes, so these are all strings:\n\n```javascript\nvar str1\
    \ = \"My First String\";\nvar str2 = \"\";\nvar str3 = \"2\";\nvar str4 = \"null\"\
    ;\n```\n\nThe empty quotes in str2 define the variable as being a string type\
    \ regardless of the empty string value. The numeric value assigned to str3 is\
    \ automatically converted to a string type when enclosed in quotes and the JavaScript\
    \ null keyword is just a string literal enclosed by quotes.\n\n![](img/d78298d3338ec680a024bbc83e78b297_77_0.png)\n\
    \nEssentially a string is a collection of characters, each character containing\
    \ its own data, just like elements in a defined array.\n\nIt is logical to regard\
    \ a string as an array of characters and apply array characteristics when using\
    \ strings.\n\nThe example below parallels the array.length property with the string.length\
    \ property:\n\n```javascript\n// create and initialize a string variable\nvar\
    \ a = \"JavaScript Strings\";\n// display the length of the string\nalert(\"String\
    \ length is \" + a.length);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_77_1.png)\n\
    \n# Characters in strings\n\nStrings are just arrays where each element is a character\
    \ and can be referenced in the same way as regular array elements.\n\nSo just\
    \ like arrays the first character is element 0 (zero).\n\nThe characters can be\
    \ found using the string.charAt() method which takes the element index number\
    \ as its position.\n\nThe example below reads the characters in a string and makes\
    \ changes according to the character found:\n\n```javascript\n// create and initialize\
    \ two string variables\nvar str = \"linger in\", newstr = \"\"\n\n// get the first\
    \ and last letters of the string variable\nvar a = \"First letter : \" + str.charAt(0);\n\
    var z = \"Final letter : \" + str.charAt(str.length - 1 );\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_78_0.png)\n\
    \n```javascript\n// loop through each character and copy into newstr\n// unless\
    \ it's an i - 0; then copy an into newstr\nfor(var i = 0; i < str.length; i++)\
    \ {\n    if (str.charAt(i) != \"i\") newstr += str.charAt(i);\n    else newstr\
    \ += \"\"\n}\n```\n\n```javascript\n// display newstr and the first and last letters\
    \ of string\nvar result = \"STRING\\n\\n\";\nresult += \"New string : \" + newstr\
    \ + \"\\n\";\nalert(result + a + \"\\n\" + z );\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_78_1.png)\n\
    \n[JavaScript Application]\nSTRINGS \nNew string : longer on\nFirst letter : l\n\
