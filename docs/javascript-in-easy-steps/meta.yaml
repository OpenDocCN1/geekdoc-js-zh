  md: "# Using with statements\n\nThe JavaScript with keyword is used to reference\
    \ object properties without needing to add the object name before each property\
    \ name.\n\n![](img/d78298d3338ec680a024bbc83e78b297_43_0.png)\n\nThis is most\
    \ useful when writing JavaScript applications to produce dynamic effects as these\
    \ scripts often refer to document objects\n\nSee Chapter 10 for more about document\
    \ objects and properties.\n\nFor example, every Web page contains a document object\
    \ that in turn has a forms property to reference forms on the Web page. Forms\
    \ can be referenced by the value assigned to their id attribute. Individual form\
    \ fields can be referenced by the value assigned to their name attribute and JavaScript\
    \ can set their values.\n\n![](img/d78298d3338ec680a024bbc83e78b297_43_1.png)\n\
    \nIn this example the script sets user and city fields of an order form:\n\n<script>\
    \ element that includes the JavaScript file must appear after the form in the\
    \ HTML file - so that the form fields created before the script tries to set their\
    \ values.\n\n```\ndocument.forms.order.user.value = \"Mike\";\ndocument.forms.order.city.value\
    \ = \"New York\";\n```\n\nThese assignments can be expressed more clearly using\
    \ a with statement like this:\n\n```\n// set values for user and city fields of\
    \ the order form\nwith(document.forms.order)\n{\n  user.value = \"Mike\";\n  city.value\
    \ = \"New York\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_43_2.png)\n\
    \nwith js"
