    182 | JavaScript in easy steps"
  - '[PAGE 184]


    # Generate an order number


    The final page that appears in the order process contains all details of the customer''s
    order for the user to confirm before submitting the order form.


    These details are dynamically written by JavaScript with data retrieved from the
    hidden form m in the menu frame.


    It is useful to allocate a unique number to the customer''s order for identification
    purposes.


    The JavaScript on the confirmation page first generates this number, stores it
    in the hidden form m in the menu frame.


    Typically a Date object can provide an order number using parts of the current
    time concatenated into a single number.


    In this script the order number will comprise the final number in the year followed
    by the month number, then the hour, and second:


    ```

    // variables for the form objects

    var m = parent.frames.menu.document.forms.m;

    var f = document.forms.f;


    // generate a time-derived order number

    var d = new Date();

    var yr = (d.getFullYear()).toString();

    yr = yr.charAt(3);

    var mo = (d.getMonth()).toString();

    var hr = (d.getHours()).toString();

    var mn = (d.getMinutes()).toString();

    var sc = (d.getSeconds()).toString();

    var on = yr + mo + hr + mn + sc;

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_184_0.png)


    confirm.js

    (part of)


    ![](img/d78298d3338ec680a024bbc83e78b297_184_1.png)


    BEWARE It is unlikely possible that two different customers could generate the
    order number at exactly the time.


    ```

    // store the order number with the other order data

    m.ordernumber.value = enum;

    ```


    The script continues on the next page to dynamically write content using the hidden
    form m to state the order number, customer name and account number.


    Items required for the order and their quantity are listed only for those items
    where the user has made an entry.'
