  md: '# Scrolling layer


    Where the previous example modified the left property of a layer object''s style,
    this example manipulates the layer''s top property to move a layer higher or lower
    on the Y axis.


    This example moves a <div> that has an id of chopper: the layer contains a simple
    helicopter image.


    HTML code adds rollover hyperlinks that call JavaScript functions but have a void
    target.


    When the user places the cursor over the hyperlink "Soar" a timer function increments
    the value of the top property so the layer moves vertically higher in the window.


    Placing the cursor over the hyperlink "Sink" has the opposite effect and lowers
    the layer vertically in the window.


    In each case the timer function is cancelled when the cursor moves away from the
    hyperlink and the movement of the layer is discontinued.


    ![](img/d78298d3338ec680a024bbc83e78b297_171_0.png)


    Keeping the cursor over the "Soar" link will cause the image to go off the top
    of the window. A conditional limiter could be added to prevent this.


    | Scrolling Layer |

    | File Edit View Favorites Tools Help |

    | Soar Sink |

    | javascript:// // Local intranet |'
