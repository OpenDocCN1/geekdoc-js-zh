  md: "# Pop-up window\n\nOne of the most useful browser features provided by JavaScript\
    \ is the ability to open a second browser window displaying another URL Web page.\n\
    \nThis is possible using the window.open() method which takes three arguments\
    \ to specify the URL to load in the pop-up window, a name for the pop-up and its\
    \ desired dimensional features.\n\nThese pop-up windows are invariably smaller\
    \ than the original window and have many uses including the display of thumbnail-sized\
    \ images.\n\nThe example below opens a secondary pop-up window following complete\
    \ loading of the first window:\n\n```\n // a function to open a pop-up window\n\
    function popup() {\n  window.open(\"popup-2.html\", \"\",\n  \"top=40,left=40,width=250,height=100\"\
    );\n}\n\n// set the onload object\nwindow.onload = popup;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_105_0.png)\n\
    \n> HOT TIP The second argument must be an empty string if no name is being given\
    \ to the pop-up window.\n\n![](img/d78298d3338ec680a024bbc83e78b297_105_1.png)"
  merge: -1
  pgno: 105
- img_proc: true
  md: "# Pop-up features\n\nThe third argument to the window.open() method may specify\
    \ many the features to be included in the new window from the list in the following\
    \ table:\n\n| Feature | Description |\n| --- | --- |\n| directories | Adds the\
    \ links bar |\n| height | Sets the height in pixels of the document area |\n|\
    \ left | The X co-ordinate of the window on the screen |\n| location | Adds the\
    \ address bar |\n| menubar | Adds the standard menu bar |\n| resizable | Permits\
    \ the window to be resized |\n| scrollbars | Enables scrollbars when needed |\n\
    | status | Adds the address bar |\n| toolbar | Adds the button bar with back &\
    \ forward buttons |\n| top | The Y co-ordinate of the window on the screen |\n\
    | width | Sets the width in pixels of the document area |\n\n![](img/d78298d3338ec680a024bbc83e78b297_106_0.png)\n\
    \nThe dimension features of top, left, width and height need to state a pixel\
    \ value like the example on the facing page. All the other features can have a\
    \ value of yes or no but if the feature appears in the argument a value is assumed\
    \ – so it need to be specified.\n\nFor example, to add a status bar to the code\
    \ on the facing page just requires the addition of status to the features list:\n\
    \n```\n// a function to open a pop-up window with a status bar\npopup1() {\n \
    \ window.open(\"popup-2.html\", \"\",\n  \"top=40,left=40,width=250,height=100,status=\"\
    );\nn}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_106_1.png)"
  merge: -1
