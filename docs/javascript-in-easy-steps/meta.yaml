  md: "# Submit\n\nThe **Submit** event occurs when the user pushes a submit button\
    \ in a form. The `onsubmit` event-handler may call a function to carry out validation\
    \ before submission.\n\nIf the `onsubmit` event-handler returns `false`, for instance\
    \ when form validation fails, the form data will not be sent.\n\nThis example\
    \ performs basic email address validation and provides the user with an `alert()`\
    \ message if validation fails. The function is called by the HTML **onsummit**\
    \ attribute of the `<form>`.\n\n![](img/d78298d3338ec680a024bbc83e78b297_157_0.png)\n\
    \n```\n// a function to validate basic email address format\nfunction validation()\n\
    {\n  // seek an @ character in the address\n  if(document.forms.email.value.indexOf(\"\
    @\") == -1)\n    // if absent display a message\n    alert(\"Email address is\
    \ absent or incorrect\");\n    // ...and do not submit the form\n    return false;\n\
    }\n```\n\nThe onsubmit event-handler is not invoked by use of `form.submit()`\
    \ method in JavaScript.\n\n| Submit Event |\n| File Edit View Favorites Tools\
    \ Help |\n| Enter your email address: user_a_domain.com [Submit] |\n| Microsoft\
    \ Internet Explorer |\n| ![ Email address is absent or incorrect |\n| [OK] |\n\
    | Done Local intranet |"
  merge: -1
  pgno: 157
- img_proc: true
  md: "# Abort\n\nInternet Explorer allows an event-handler to be specified for the\
    \ Abort event that occurs when the user cancels the download of an image — usually\
    \ by pushing the stop on the browser toolbar. the onabort event-handler may call\
    \ a JavaScript function when an image download is cancelled.\n\nTo identify the\
    \ image a name must be given to its id attribute in the HTML <img> element, like\
    \ this...\n\n```\n<img id=\"big-pic\" src=\"bigpic.jpg\" alt=\"/>\n```\n\nAn event-handler\
    \ can then be assigned to that's onabort property. In the example below the event-handler\
    \ directly creates an alert() message confirming that the download is cancelled:\n\
    \n```\n// for Internet Explorer only set an event-handler\nif(document.all)\\\
    document.getElementById(\"big-pic\").onabort = abort_msg;\n\n// a function to\
    \ display a confirmation message\nfunction abort_msg() {\n  alert(\"Image Download\
    \ Has Been Aborted \");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_158_0.png)\n\
    \nThe <script> element that includes this script must appear in the HTML <img>\
    \ element — an event-handler can't be set until the image object exists.\n\n![](img/d78298d3338ec680a024bbc83e78b297_158_1.png)\n\
    \nThis feature is useful to switch the image source to a low-resolution version.\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_158_2.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_158_3.png)"
  merge: -1
  pgno: 158
- img_proc: true
  md: "# Resize\n\nThe **Resize** event occurs when a browser window is re-sized by\
    \ the user and the **onresize** event-handler can execute a function to make the\
    \ page appropriate for the new window size.\n\nThis is most useful to reposition\
    \ DHTML page components as illustrated in the following example. This creates\
    \ a centered `<div>` element with the `id` of `lyr` which will be re-centered\
    \ when window is re-resized:\n\n```\n// a function to center a <div> element\n\
    function set_pos() {\n    var width;\n    // get the window width\n    if(navigator.appName\
    \ == \"Netscape\")\n        width = innerWidth; // for Netscape/Mozilla\n    else\n\
    \        width = document.body.clientWidth; // for IE\n\n    var left_pos = parseInt(width\
    \ / 2) - 50;\n    \n    // set the left position of the <div> element\n    document.getElementById('lyr').style.left=(left_pos+\"\
    px\");\n\n    // specify the onresize event-handler\n    window.onresize=set_pos;\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_159_0.png)\n\nThis `<div>`\
    \ is initially centered by calling the **set_pos()** function from the `<body>`\
    \ attribute of the HTML-element.\n\n![](img/d78298d3338ec680a024bbc83e78b297_159_1.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_159_2.png)\n\n158 | JavaScript in easy\
    \ steps"
