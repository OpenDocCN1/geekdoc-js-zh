- img_proc: true
  md: '# Getting date and time


    Date and time is often used in JavaScript to customize the performance of a Web
    page. For example, a script might welcome the user with a greeting appropriate
    to current time:


    ![](img/d78298d3338ec680a024bbc83e78b297_55_0.png)


    ```

    [JavaScript Application]

    Good Afternoon

    Welcome to the Acme website

    OK

    ```


    The date and time that is used in JavaScript is taken from the calendar in the
    host system that is running application in which the script is loaded.


    To access the system clock information the script must first create a Date object.


    This is achieved in the same manner in which an Array object is created, using
    the JavaScript new keyword, but now with the JavaScript Date() constructor function.
    The example creates and displays a new Date object:


    ```

    // create a new Date object

    var now = new Date();


    // display the Date object''s date and time information

    alert(now);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_55_1.png)


    ```

    [JavaScript Application]

    Thu Mar 31 2005 16:31:06 GMT+0100 (GMT Daylight Time)

    OK

    ```'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Date information


    The Date object has special methods that may be used to retrieve individual parts
    of the date information.


    Some methods return the date information as an index number that needs to be converted
    by the script.


    The Date.getDate() method returns the day of the week as an index value from 0
    (Sunday) to 6 (Saturday).


    Also the Date.getMonth() method returns the month of the year as an index value
    from 0 (January) to 11 (December).


    The example below illustrates the Date object methods and uses two arrays to display
    the day and month names:


    ![](img/d78298d3338ec680a024bbc83e78b297_56_0.png)


    ```

    // create an array of day names

    var days = new Array("Sun", "Mon", "Tue", "Wed", "Thur", "Fri", "Sat");

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_56_1.png)


    ```

    // create an array of month names

    var months = new Array("Jan", "Feb", "Mar", "Apr", "May", "Jul", "Aug", "Sep",
    "Oct", "Nov", "Dec");

    ```


    ```

    // create a new Date object

    var now = new Date();

    var yy = now.getFullYear(); // yy += 2000; // adjust year for Netscape

    var mm = now.getMonth(); // get the month number\ // convert month number to name

    var dd = now.getDate(); // get day number in the month

    var dy = now.getDay(); // get day number in the week

    dy = days[dy]; // convert day number to name

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_56_2.png)


    ```

    // display the extracted day and date information

    alert(" + dy + "/" + mm + "/" + dd + " "" + yy + ");

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_56_3.png)'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# # Time information


    The Date object has special methods to access the information that it contains.
    The example below gets the current hours, minutes, seconds and milliseconds from
    the host clock and displays a welcome message appropriate for the time of day:


    ```

    // create a new Date object

    var now = new Date();


    // extract the time information

    var hh = now.getHours();

    var mn = now.getMinutes();

    var ss = now.getSeconds();

    var ms = now.getMilliseconds();


    // default welcome message

    var hi = "Good Morning";


    // welcome message if after noon

    if( hh > 11 ) hi = "Good Afternoon";


    // welcome message if after 6 p.m.

    if( hh > 17 ) hi = "Good Evening";


    // display welcome message and the current time

    var tim = hi + "\n";

    tim += "Hours: " +hh + "\n";

    tim += "Minutes: " +mn + "\n";

    tim += "Seconds: " +ss + "." +ms;

    alert(tim);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_57_0.png)


    The hours are returned as numbers 0~23 in 24-hour format.


    ![](img/d78298d3338ec680a024bbc83e78b297_57_1.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_57_2.png)'
  merge: -1
  pgno: 57
- img_proc: true
  md: "# Current time\n\nThe JavaScript Date.getTime() method can be used to compare\
    \ two date objects numerically.\n\nThe method returns a number that is the difference\
    \ in milliseconds between the date object value and midnight on January 1, 1970\
    \ (sometimes referred to as “the epoch”).\n\nThe example below creates a Date\
    \ object both before and after running a loop, then compares the values returned\
    \ by the Date.getTime() method to calculate the actual time taken to execute the\
    \ loop:\n\n```\n// create a new Date object then get the current time\nvar start\
    \ = new Date();\nvar msec1 = start.getTime();\n\n// run a loop counting up to\
    \ 250,000\nvar num = 0;\nfor(var i = 0; i < 250000; i++) {\n    num++;\n}\n```\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_58_0.png)\n\nAdjust the number that\
    \ the loop counts up according to your browser and platform.\n\n```\n// get another\
    \ Date object and get the time now\nvar stop = new Date();\nvar msec2 = stop.getTime();\n\
    ```\n\n```\n// subtract the start time from the stop time\n// discover the amount\
    \ of time between the two points\nvar diff = ( msec2 - msec1 ) / 1000;\n```\n\n\
    ```\n// display the elapsed time\nalert(\"Time elapsed: \" +diff+\" seconds\"\
    );\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_58_1.png)\n\nDate and time\
    \ | 57"
  merge: -1
