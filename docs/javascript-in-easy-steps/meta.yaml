    >链接 #2</a>\n```\n\n此示例包含了内联代码和函数调用。当用户点击相应的超链接时，都会执行：\n\n```javascript\n//一个显示简单消息的函数\n\
    function respond() {\n  alert(\"JavaScript code\");\n}\n```\n\n让锚点没有 target javascript://，这样\
