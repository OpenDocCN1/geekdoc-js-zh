  md: "# Reset\n\nThe **Reset** event occurs when the user pushes a form's reset button\
    \ or when JavaScript executes the `form.reset()` method.\n\nThe **onreset** event-handler\
    \ may call a JavaScript function when the Reset event occurs.\n\nIn this example\
    \ there are two HTML forms, named **f1** and **f2**. The first form contains three\
    \ radio buttons and a reset button. An event-handler is assigned to the HTML **onreset**\
    \ attribute in the first `<form>` tag. When the reset button is pressed the value\
    \ of the second radio button is changed and its value is displayed in a text box\
    \ in the second form.\n\n```\n// a function to set the value of a radio button\n\
    function show_value() {\n  // set the value\n  document.forms.f1.r[0].value =\
    \ \"Salmon\";\n  // display the set value\n  document.forms.f2.txt.value =\\n\
    \  document.forms.f1.r[0].value;\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_156_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_156_1.png)\n\nThe first radio button\
    \ could be checked with JavaScript by assigning the property `document.forms.f1.r[0].checked`.\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_156_2.png)\n\n12. Event-handlers |\
    \ 155"
  merge: -1
  pgno: 156
