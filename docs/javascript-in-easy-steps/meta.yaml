    \ Each of the words can then be referenced using the index number of the split\
    \ array like any other array.\n\nThe example below illustrates this use of the\
    \ string.split() method with another instance where items may use a pipe character\
    \ as the delimiter:\n\n```javascript\n// create and initialize a string\nvar str\
    \ = \"JavaScript in easy steps\";\n\n// split words into array delimited by a\
