  - "[PAGE 159]\n\n# Resize\n\nThe **Resize** event occurs when a browser window is\
    \ re-sized by the user and the **onresize** event-handler can execute a function\
    \ to make the page appropriate for the new window size.\n\nThis is most useful\
    \ to reposition DHTML page components as illustrated in the following example.\
    \ This creates a centered `<div>` element with the `id` of `lyr` which will be\
    \ re-centered when window is re-resized:\n\n```\n// a function to center a <div>\
    \ element\nfunction set_pos() {\n    var width;\n    // get the window width\n\
    \    if(navigator.appName == \"Netscape\")\n        width = innerWidth; // for\
    \ Netscape/Mozilla\n    else\n        width = document.body.clientWidth; // for\
    \ IE\n\n    var left_pos = parseInt(width / 2) - 50;\n    \n    // set the left\
    \ position of the <div> element\n    document.getElementById('lyr').style.left=(left_pos+\"\
    px\");\n\n    // specify the onresize event-handler\n    window.onresize=set_pos;\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_159_0.png)\n\nThis `<div>`\
    \ is initially centered by calling the **set_pos()** function from the `<body>`\
    \ attribute of the HTML-element.\n\n![](img/d78298d3338ec680a024bbc83e78b297_159_1.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_159_2.png)\n\n158 | JavaScript in easy\
