  - '[PAGE 71]


    # Forcing floats


    As an alternative to using the Math.round() method detailed on the previous page
    the script may require that the float be selectively forced to the nearest integer,
    above or below.


    JavaScript provides the Math.ceil() method to force rounding up to the nearest
    integer and the Math.floor() method rounds to the nearest integer down.


    The example below illustrates both methods in action with both positive and negative
    values:


    ```

    var a = 7.5;

    var a1 = "a1 " + Math.ceil(a);

    var a2 = "a2 " + Math.floor(a);

    var b = -7.5;

    var b1 = "b1 " + Math.ceil(b);

    var b2 = "b2 " + Math.floor(b);

    var rup = "ROUNDING UP\n" + a1 + "\n" + b1 + "\n";

    var rdn = "ROUNDING DOWN\n" + a2 + "\n" + b2+";

    alert( rup + rdn );

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_71_0.png)


    Rounding up of negative values returns the nearest integer towards zero.


    ![](img/d78298d3338ec680a024bbc83e78b297_71_1.png)'
  - '[PAGE 72]


    # Comparing numbers


    The Math object has two methods allowing comparison of two numbers with a return
    of the higher or lower value.


    Math.max() accepts the two values for comparison as arguments and will return
    the higher of the two values.


    The Math.min() method works in precisely the same way returns the lower of the
    two values.


    In the example below the Math.pow() method is used to create square and cube values
    that are then compared with Math.max() and Math.min().


    The Math.pow() method requires two arguments to specify the power by which to
    raise that number:


    ```

    var sq = Math.pow( 5, 2 );

    var cb = Math.pow( 3, 3 )

    var hi = "Round up : " + Math.max( sq, cb );

    var lo = "Round Down : " + Math.min(sq, cb );

    var ng = "Round Negative Up : " + Math.max( -5, -4.75 );

    alert("MAXMIN\n\n" + hi + "\n" + lo + "\n" + ng);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_72_0.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_72_1.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_72_2.png)'
  - '[PAGE 73]


    # Random generator


    Random numbers can be generated using the Math.random() method to return a floating-point
    value between 0.0 and 1.0. This method can be used to create a series of random
    number selections, like a lottery draw, and is popular for producing random effects
    within Web pages.


    Multiplying the random number will specify a wider range so, for example, a multiplier
    of 10 will create a random number now between 0.0 and 10.0.


    To make the randomly generated number more useful it is generally best to round
    up the returned float so that the range will become two integer values.


    The Math.ceil() method will be used to round the random number up to an integer
    between 1 and 10.


    The code below illustrates this example:


    ```

    // get a random number from 0.0 to 1.0

    var rand1 = Math.random();

    // multiply by 10 to make it between 0.0 and 10

    var rand2 = rand1 * 10;

    // round it up to make it between 1 and 10

    var rand3 = Math.ceil(rand3);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_73_0.png)


    random.js


    ```

    // add each part to a string

    var str = "Random float [rand1]: " + rand1 + "\n";

    str += "Specify range [rand2]: " + rand2 + "\n";

    str += "Random integer [rand3]: " + rand3;

    ```


    ```

    // display the string

    alert(str);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_73_1.png)


    The individual steps are shown here with the rand variables can be combined as:


    Math.ceil(Math.random()*10)


    ![](img/d78298d3338ec680a024bbc83e78b297_73_2.png)'
