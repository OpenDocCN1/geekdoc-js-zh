- md: "\n# DOM hierarchy\n\nthe browser Document Object Model (DOM) is a collection\
    \ of objects in a Web browser that can be addressed by JavaScript to influence\
    \ the performance of a HTML document.\n\n![](img/d78298d3338ec680a024bbc83e78b297_91_0.png)\n\
    \nThese objects follow a strict hierarchy where the window object is the very\
    \ top level. Because window is the top level \"root\" object it can be omitted\
    \ in the address syntax. For instance, window.document.bgColor property, which\
    \ stores the value of the window's background color, can be addressed simply by\
    \ document.bgColor.\n\nSeveral of the DOM objects have properties that contain\
    \ an array of elements in that Web page. For example, document.images[], the images[]\
    \ array is a property of the document object that will store the URL of each image\
    \ contained on that Web page. The URL of the first image in the HTML code is stored\
    \ in the array at document.images[0], then the URL of successive images are stored\
    \ at incrementing array element numbers.\n\nThe set_bg() function in the example\
    \ below is called from the onload attribute of the HTML <body> tag to assign a\
    \ value to the document.bgColor after the document has been loaded. This sets\
    \ the background color of the document to the specified value.\n\n![](img/d78298d3338ec680a024bbc83e78b297_91_1.png)\n\
    \n```javascript\n// function to set the document background color\nfunction set_bg()\
