- md: "\n# Pop-up window\n\nOne of the most useful browser features provided by JavaScript\
    \ is the ability to open a second browser window displaying another URL Web page.\n\
    \nThis is possible using the window.open() method which takes three arguments\
    \ to specify the URL to load in the pop-up window, a name for the pop-up and its\
    \ desired dimensional features.\n\nThese pop-up windows are invariably smaller\
    \ than the original window and have many uses including the display of thumbnail-sized\
    \ images.\n\nThe example below opens a secondary pop-up window following complete\
    \ loading of the first window:\n\n```javascript\n // a function to open a pop-up\
    \ window\nfunction popup() {\n  window.open(\"popup-2.html\", \"\",\n  \"top=40,left=40,width=250,height=100\"\
    );\n}\n\n// set the onload object\nwindow.onload = popup;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_105_0.png)\n\
    \n> HOT TIP The second argument must be an empty string if no name is being given\
    \ to the pop-up window.\n\n![](img/d78298d3338ec680a024bbc83e78b297_105_1.png)\n\
    \n# Pop-up features\n\nThe third argument to the window.open() method may specify\
    \ many the features to be included in the new window from the list in the following\
    \ table:\n\n| Feature | Description |\n| --- | --- |\n| directories | Adds the\
    \ links bar |\n| height | Sets the height in pixels of the document area |\n|\
    \ left | The X co-ordinate of the window on the screen |\n| location | Adds the\
    \ address bar |\n| menubar | Adds the standard menu bar |\n| resizable | Permits\
    \ the window to be resized |\n| scrollbars | Enables scrollbars when needed |\n\
    | status | Adds the address bar |\n| toolbar | Adds the button bar with back &\
    \ forward buttons |\n| top | The Y co-ordinate of the window on the screen |\n\
    | width | Sets the width in pixels of the document area |\n\n![](img/d78298d3338ec680a024bbc83e78b297_106_0.png)\n\
    \nThe dimension features of top, left, width and height need to state a pixel\
    \ value like the example on the facing page. All the other features can have a\
    \ value of yes or no but if the feature appears in the argument a value is assumed\
    \ – so it need to be specified.\n\nFor example, to add a status bar to the code\
    \ on the facing page just requires the addition of status to the features list:\n\
    \n```javascript\n// a function to open a pop-up window with a status bar\nfunction\
    \ popup1() {\n  window.open(\"popup-2.html\", \"\",\n  \"top=40,left=40,width=250,height=100,status=\"\
    );\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_106_1.png)\n\n# Close pop-up\n\
    \nA window can close itself simply by calling the window.close() method by closing\
    \ a pop-up window requires a little more effort.\n\nThe initial call to the window.open()\
    \ method should be assigned to a variable to create a window object. This new\
    \ object inherits the window.close() method which can close the pop-up.\n\nThis\
    \ example verifies the existence of the pop-up window before closing it when the\
    \ user exits the main window...\n\n```javascript\n// create a variable to store\
    \ a window object\nvar popwindow;\n\n// a function to open a pop-up window\nfunction\
    \ popup() {\n  popwindow = window.open(\"popup-2.html\", \"\", \"top=40,left=40,width=250,height=100,menubar,status\"\
    );\n}\n\n// a function to close a pop-up window\nfunction close_popup() {\n  if(popwindow\
    \ != null ) popwindow.close();\n}\n\n// set the onload and unload objects\nwindow.onload\
    \ = popup;\nwindow.onunload = close_popup;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_107_0.png)\n\
    \nThis pop-up page is the same as in the example on page 104 - JavaScript has\
    \ added status bar and menu bar features to this window.\n\n![](img/d78298d3338ec680a024bbc83e78b297_107_1.png)\n\
    \n![](img/d78298d3338ec680a024_107_2.png)\n\n# Get size\n\nIt is sometimes useful\
    \ to have JavaScript get the user's screen resolution with the width and height\
    \ properties of the window.screen object Because a window may not be maximized\
    \ to the full size it is also helpful to determine the actual width of the window.\n\
    \nThe availHeight and availWidth properties of window.screen contain the size\
    \ excluding task bars.\n\nThe Netscape and Internet Explorer document object models\
    \ have different ways of storing inner window dimensions so browser-specific scripting\
    \ is needed.\n\n![](img/d78298d3338ec680a024bbc83e78b297_108_0.png)\n\nIn the\
    \ example below window dimensions are retrieved by the appropriate object for\
    \ each browser. The function is called by the onload attribute of the HTML <body>\
    \ tag to ensure that the window has been created dimensions.\n\n```javascript\n\
    function get_sizes() {\n  var win_w, win_h, scr_w, scr_h, res, in;\n  if(document.body.clientWidth)\
    \ // IE and Opera\n    win_w = document.body.clientWidth;\n    win_h = document.body.clientHeight;\n\
    \  } else if(window.innerWidth) // Netscape and Mozilla\n    win_w = innerWidth;\
    \ win_h = innerHeight;\n  }\n  scr_w = screen.width; scr_h = screen.height; //\
    \ screen\n  // display the size\n  res = \"Resolution: \" + scr_w + \"x\" + scr_h;\n\
    \  in = \"Inner window: \" + win_w + \"x\" + win_h;\n  if(win_w == null) alert(res\
    \ + \"\\n\" + in);\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_108_1.png)\n\
    \nYou can call the window.print() method to print the document in the browser\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_108_2.png)\n\n# 9. Window properties\n\
    \n# Frames array\n\nThe window.frames object contains an array of all the frames\
    \ in a window which has been defined in the HTML <frameset> tags. JavaScript can\
    \ address these from any frame using the parent.window.frames[]\n\nIndividual\
    \ frames can be addressed using their index number in the array, or by the value\
    \ assigned to the name in the HTML <frame> tag. So a frame named \"main\" can\
    \ be addressed from another frame as parent.window.frames[\"main\"], or more simply\
    \ as parent.window.frames.main.\n\nThe script below is included in HTML document.\
    \ The total number of frames in that document reads each of their names from the\
    \ parent frame-holder:\n\n```javascript\n// find the total number of frames\n\
    var framenums = \"No. frames :\"\n    + parent.window.frames.length;\n\n// retrieve\
    \ the name of each frame\nvar framenames+= \"\\nFrame 1 : \"\n    + parent.window.frames[0].name;\n\
    framenames+= \"\\nFrame 2 : \"\n    + parent.window.frames[1].name;\nframenames+=\
    \ \"\\nFrame 3 : \"\n    + parent.window.frames[2].name;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_109_0.png)\n\
    \n> HOT TIP Always HTML elements to be used by JavaScript to produce code that\
    \ is more comprehensible.\n\n```javascript\nalert( framenums + framenames );\n\
    ```\n\n![](img/d78298d3338ec680a024bbc83e78b297_109_1.png)\n\n# Frame objects\n\
    \nThe example on the facing page allows access to different frames within a framed\
    \ window and because the browser DOM is hierarchical that means that the objects\
    \ and properties within any frame are also accessible.\n\nThe script can assign\
    \ values to these object properties and use their methods just as with an unframed\
    \ object.\n\nTypically a navigation frame on the left side of the window will\
    \ have navigation buttons which, when pushed, will assign new URL locations to\
    \ a main frame on the right side of the screen.\n\nThis example adds a further\
    \ function to the code listed on the opposite page. This is called from the HTML\
    \ onclick attribute of the button to write text in the Banner frame and to change\
    \ the location of the Page frame:\n\n```javascript\nfunction next() {\n  // load\
    \ another page into the Page frame\n  parent.frames.Page.window.location = \"\
    nextpage.html\";\n\n  // write text into the Banner frame\n  parent.frames.Banner.window.document.write(\"\
    Frame 2 - Written by Frame 1\");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_110_1.png)\n\
    \n# Error handling\n\nA custom error-handling function may be assigned to the\
    \ window.onerror object to deal with runtime errors.\n\nWhen the browser meets\
    \ an error it looks for an error-handler in the script but, if none is found,\
    \ it will handle the error itself by opening the browser error dialog box.\n\n\
    Once the error has been noticed a true value is returned to the browser to indicate\
    \ that the error has been dealt with.\n\n![](img/d78298d3338ec680a024bbc83e78b297_111_0.png)\n\
    \nTo avoid error dialogs a custom error-handler function need only return true\
    \ when an error is encountered.\n\nIdeally the browser will pass three arguments\
    \ to the error-handler containing information on the nature of the error, the\
    \ URL of the file that contains the error, and the actual line number in file\
    \ where the error exists.\n\nIn the example below each piece of error information\
    \ passed to the error-handling function by the browser is displayed for the user:\n\
    \n```javascript\n// declare an error-handling function\nwindow.onerror = errorhandler;\n\
    \n// define the error-handling function\nfunction errorhandler(msg, url, ln) {\n\
    \  alert(\"Error: \"+msg+\"\\nIn File: \"+url+\\nAt Line: \"+ln);\n  return true;\
    \ // tell the browser it's been handled\n}\n\n// This is a deliberate mistake\n\
    document.form[theMistake].value = \"myButton\";\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_111_1.png)\n"
  mdcn: "\n\n# 弹出窗口\n\nJavaScript 提供的实用浏览器功能之一是打开第二个浏览器窗口来显示另一个 URL 网页。\n\n这可以通过使用\
    \ `window.open()` 方法实现，该方法接受三个参数，用于指定在弹出窗口中加载的 URL、弹出窗口的名称以及所需的尺寸特征。\n\n这些弹出窗口通常比原始窗口小，并且有许多用途，包括显示缩略图大小的图像。\n\
    \n下面的示例在第一个窗口完全加载后打开一个二级弹出窗口：\n\n```javascript\n // 一个打开弹出窗口的函数\nfunction popup()\
    \ {\n  window.open(\"popup-2.html\", \"\",\n  \"top=40,left=40,width=250,height=100\"\
    );\n}\n\n// 设置 onload 对象\nwindow.onload = popup;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_105_0.png)\n\
    \n> 热门提示：如果不给弹出窗口指定名称，则第二个参数必须为空字符串。\n\n![](img/d78298d3338ec680a024bbc83e78b297_105_1.png)\n\
    \n# 弹出特征\n\n`window.open()` 方法的第三个参数可以指定包含在新窗口中的许多特征，具体如下表所示：\n\n| 特征 | 说明 |\n\
    | --- | --- |\n| directories | 添加链接栏 |\n| height | 设置文档区域的高度（像素） |\n| left | 窗口在屏幕上的\
    \ X 坐标 |\n| location | 添加地址栏 |\n| menubar | 添加标准菜单栏 |\n| resizable | 允许调整窗口大小\
    \ |\n| scrollbars | 需要时启用滚动条 |\n| status | 添加状态栏 |\n| toolbar | 添加带有后退和前进按钮的工具栏\
    \ |\n| top | 窗口在屏幕上的 Y 坐标 |\n| width | 设置文档区域的宽度（像素） |\n\n![](img/d78298d3338ec680a024bbc83e78b297_106_0.png)\n\
    \n`top`、`left`、`width` 和 `height` 尺寸特征需要像对应页示例那样指定像素值。所有其他特征的值可以是 `yes` 或 `no`，但如果特征出现在参数中，则假设该值有效——因此需要对其指定。\n\
    \n例如，要在对应页的代码中添加状态栏，只需在特征列表中添加 `status` 即可：\n\n```javascript\n// 一个打开带状态栏弹出窗口的函数\n\
    function popup1() {\n  window.open(\"popup-2.html\", \"\",\n  \"top=40,left=40,width=250,height=100,status=\"\
    );\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_106_1.png)\n\n# 关闭弹出窗口\n\
    \n窗口可以通过简单调用 `window.close()` 方法自关闭，但关闭弹出窗口需要多一点努力。\n\n初始调用 `window.open()` 方法应赋值给一个变量以创建一个窗口对象。这个新对象继承了\
    \ `window.close()` 方法，从而可以关闭弹出窗口。\n\n此示例在用户退出主窗口之前验证弹出窗口是否存在……\n\n```javascript\n\
    // 创建一个变量来存储窗口对象\nvar popwindow;\n\n// 一个打开弹出窗口的函数\nfunction popup() {\n  popwindow\
    \ = window.open(\"popup-2.html\", \"\", \"top=40,left=40,width=250,height=100,menubar,status\"\
    );\n}\n\n// 一个关闭弹出窗口的函数\nfunction close_popup() {\n  if(popwindow != null ) popwindow.close();\n\
    }\n\n// 设置 onload 和 unload 对象\nwindow.onload = popup;\nwindow.onunload = close_popup;\n\
    ```\n\n![](img/d78298d3338ec680a024bbc83e78b297_107_0.png)\n\n此弹出页面与第104页的示例相同——JavaScript\
    \ 为此窗口添加了状态栏和菜单栏特征。\n\n![](img/d78298d3338ec680a024bbc83e78b297_107_1.png)\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_107_2.png)\n\n# 获取尺寸\n\n有时让 JavaScript\
    \ 通过 `window.screen` 对象的 `width` 和 `height` 属性获取用户的屏幕分辨率是有用的。因为窗口可能没有最大化化，所以确定窗口的实际宽度也有帮助。\n\
    \n`window.screen` 的 `availHeight` 和 `availWidth` 属性包含排除任务栏的大小。\n\nNetscape 和 Internet\
    \ Explorer 的文档对象模型存储内部窗口尺寸的方法不同，因此需要特定浏览器的脚本。\n\n![](img/d78298d3338ec680a024bbc83e78b297_108_0.png)\n\
    \n在下面的示例中，通过相应的对象获取窗口尺寸。该函数由 HTML `<body>` 标签的 `onload` 属性调用，以确保窗口已创建。\n\n```javascript\n\
    function get_sizes() {\n  var win_w, win_h, scr_w, scr_h, res, in;\n  if(document.body.clientWidth)\
    \ // IE 和 Opera\n    win_w = document.body.clientWidth;\n    win_h = document.body.clientHeight;\n\
    \  } else if(window.innerWidth) // Netscape 和 Mozilla\n    win_w = innerWidth;\
    \ win_h = innerHeight;\n  }\n  scr_w = screen.width; scr_h = screen.height; //\
    \ screen\n  // 显示尺寸\n  res = \"Resolution: \" + scr_w + \"x\" + scr_h;\n  in =\
    \ \"Inner window: \" + win_w + \"x\" + win_h;\n  if(win_w == null) alert(res +\
    \ \"\\n\" + in);\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_108_1.png)你可以调用\
    \ `window.print()` 方法在浏览器中打印文档![](img/d78298d3338ec680a024bbc83e78b297_108_2.png)\n\
    \n9. 窗口属性\n\n# Frames 数组\n\n`window.frames` 对象包含了在 HTML `<frameset>` 标签中定义的所有帧的数组。JavaScript\
    \ 可以 `parent.window.frames[]` 从任何帧访问这些帧。\n\n单个帧可以使用数组中的索引或通过分配给 HTML `<frame>`\
    \ 标签的名称来访问。因此，名为 \"main\" 的帧可以从另一个帧通过 `parent.window.frames[\"main\"]` 访问。\n\n\
    包含在 HTML 文档中的脚本从父帧读取每个帧的名称：\n\n```javascript\n// 查找帧的总数\nvar framenums = \"No.\
    \ frames :\"\n    + parent.window.frames.length;\n\n// 获取每个帧的名字\nvar framenames+=\
    \ \"\\nFrame 1 : \"\n    + parent.window.frames[0].name;\nframenames+= \"\\nFrame\
    \ 2 : \"\n    + parent.window.frames[1].name;\nframenames+= \"\\nFrame 3 : \"\n\
    \    + parent.window.frames[2].name;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_109_0.png)\n\
    \n> 热门提示：始终使用 HTML 元素供 JavaScript 使用，以产生更易读的代码。\n\n```javascript\nalert( framenums\
    \ + framenames );\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_109_1.png)\n\
    \n# Frame 对象\n\n对应页的示例允许访问带帧窗口内的不同帧，由于浏览器 DOM 是分层的，这意味着任何帧内的对象和属性也是可访问的。\n\n脚本可以像处理框架对象一样为这些对象属性赋值并使用它们的方法。\n\
    \n通常，窗口左侧的导航帧会有导航按钮，点击后会将 URL 位置分配给屏幕右侧的主帧。\n\n此示例在相反页的代码中增加了一个函数。通过按钮的 HTML `onclick`\
    \ 属性调用，在 Banner 帧中写入文本并更改 Page 帧的位置：\n\n```javascript\nfunction next() {\n  //\
    \ 将另一个页面加载到 Page 帧\n  parent.frames.Page.window.location = \"nextpage.html\";\n\
    \n  // 向 Banner 帧写入文本\n  parent.frames.Banner.window.document.write(\"Frame 2\
    \ - Written by Frame 1\");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_110_1.png)\n\
    \n# 错误处理\n\n可以将自定义的错误处理函数分配给 `window.onerror` 对象以处理运行时错误。\n\n当浏览器遇到错误时，它会在脚本中寻找错误处理器，但如果没有找到，它将通过打开浏览器错误对话框自行处理错误。\n\
    \n一旦检测到错误，就会向浏览器返回一个 `true` 值表示错误已处理。\n\n![](img/d78298d3338ec680a024bbc83e78b297_111_0.png)\n\
    \n为了避免错误对话框，自定义的错误处理器只需要在遇到错误时返回 `true`。\n\n理想情况下，浏览器将向错误处理器传递三个参数，包含错误性质的信息、包含错误的文件\
    \ URL 以及错误所在文件的实际行号。\n\n在下面的示例中，浏览器传递给错误处理函数的每个错误错误信息都会显示给用户：\n\n```javascript\n\
    // 声明错误处理函数\nwindow.onerror = errorhandler;\n\n// 定义错误处理函数\nfunction errorhandler(msg,\
    \ url, ln) {\n  alert(\"Error: \"+msg+\"\\nIn File: \"+url+\"\\nAt Line: \"+ln);\n\
    \  return true; // 告诉浏览器已处理\n}\n\n// 这是一个故意的错误\ndocument.form[theMistake].value\
    \ = \"myButton\";\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_111_1.png)\n\
    \n"
