    and illustrates how to add JavaScript to a HTML document. The JavaScript language
    keywords are all listed and the essentials of functions and variables are explained.


    # Covers


    +   - Introduction | 8

    - Including JavaScript in HTML | 9

    - Hello World | 10

    - Syntax rules | 11

    - Keywords | 12

    - Variables | 13

    - Data types | 14

    - Escape sequences | 15

    - Functions | 16

    - Function arguments | 17

    - Multiple functions | 18

    - Variable scope | 19

    - Multiple arguments | 20'
