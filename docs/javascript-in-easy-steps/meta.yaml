  md: "# Submit the order\n\n// a function to copy values from a hidden form in\n\
    // another frame into a local hidden form\n// then submit the local form to the\
    \ server\n\n```\nfunction send_order() {\n  // copy the values from form m to\
    \ form f\n  f.customer.value = m.customer.value;\n  f.accountnum.value = m.accountnum.value;\n\
    \  f.ordernum.value = m.ordernum.value;\n  f.ball.value = m.ball.value;\n  f.hop.value\
    \ = m.hop.value;\n  f.cone.value = m.cone.value;\n\n  // submit form f to the\
    \ server\n  f.submit();\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_186_0.png)\n\
    \nIn this example the action attribute of the <form> element specifies that this\
    \ form data should be processed by a CGI script called parser.cgi. This server-side\
    \ script simply sends an HTML Web page back to the browser listing all the form\
    \ data keys that it has retrieved.\n\n![](img/d78298d3338ec680a024bbc83e78b297_186_1.png)\n\
    \n> This routine could simply have the hidden form m in the menu frame\n- the\
    \ response from the server would then appeared in that frame.\n\n14. JavaScript\
    \ in e-commerce | 185"
