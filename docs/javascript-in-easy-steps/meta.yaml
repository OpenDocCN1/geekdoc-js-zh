  md: '# Setting date and time


    The JavaScript code may manipulate the Date information

    using a variety of Date.set() methods.


    These mirror the range of Date.get() methods that are used to

    ext parts of the Date object information but are used instead to

    set new values.


    In the example below the initial Date object values are stored in the

    orig named orig. Then the various Date.set() methods

    apply new values to the Date object information:


    ```

    // create a new Date object

    var now = new Date();


    // store the original date and time information

    var orig = "Original \n" + now.toString() + "\n\n";n

    // set new date and time details

    now.setDate(21);

    now.setMonth(1);

    now.setHours(12);

    now.setMinutes(30);

    now.setSeconds(15);

    now.setFullYear(2005);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_61_0.png)


    > HOT TIP

    The toString()

    method used here

    returns the string

    value of JavaScript

    objects and has

    uses.


    ```

    // store the modified date and time information

    var mod = "Modified :\n" + now;


    // display original and modified date and times

    alert(orig + mod);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_61_1.png)'
  merge: -1
