  - "[PAGE 118]\n\n# # Rollover\n\nIf an image has been named in the HTML code, assigning\
    \ a value to the <img> tag's id attribute, it may also be addressed by this name\
    \ in JavaScript. The syntax is document.images.imgname – so an image click is\
    \ addressed as document.images.click.\n\nAssigning a new value to the src property\
    \ of an image causes the browser to replace the image. Typically this is seen\
    \ in rollovers – when the cursor is over an image it is replaced by a second image,\
    \ the original image is returned when the cursor moves away. The <img> tag must\
    \ include an onmouseover attribute and an onmouseout attribute to create a rollover\
    \ effect, like:\n\n```\n<img id=\"click\" src=\"off.gif\" alt=\"\"\n  onmouseover=\"\
    swap(1)\" onmouseout=\"swap(0)\" />\n```\n\nThese attributes call the JavaScript\
    \ image-swapping function whenever the onmouseover or onmouseout events occur:\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_118_0.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_118_1.png)\n\
    \n```\nfunction swap(n)\n  if (n == 0)document.images.click.src = \"off.gif\"\
    ;\n  if (n == 1)document.images.click.src = \"over.gif\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_118_2.png)\n\
    \n| Rollover Example |\n| File Edit View Favorites Tools Help |\n| Click Here\
    \ |\n| Done Local intranet |\n\n| Rollover Example |\n| File Edit View Favorites\
    \ Tools Help |\n| Click Here |\n| Done Local intranet |\n\n10. Document properties\
    \ | 117"
- md: "\n## Dynamic content\n\nThe window.document.open() method opens a new HTML\
    \ document that can be written to using the familiar method window.document.write()\
    \ to create dynamic content.\n\n![](img/d78298d3338ec680a024bbc83e78b297_119_0.png)\n\
    \nPass an empty string as the URL argument to open an empty window.\n\nWhen the\
    \ content has been written the document stream should be closed by the window.document.close()\
    \ method.\n\nThe example below builds on the pop-up window in the last chapter\
    \ by writing the content from JavaScript instead of simply loading an existing\
    \ HTML document:\n\n![](img/d78298d3338ec680a024bbc83e78b297_119_1.png)\n\n```javascript\n\
    // a function to create a dynamic popup window\nfunction popup() {\n  // create\
    \ the popup window\n  var popwindow = \n    window.open(\"\",*\",top=40,left=30,width=250,height=125);\n\
    \  // open the pop-up window HTML document\n  popwindow.document.open();\n  //\
    \ write content in the pop-up window\n  popwindow.document.write(\"<title>Pop-up</title>\"\
    );\n  popwindow.document.write(\"<Dynamic Pop-up Page<br/>\");\n  popwindow.document.write(\"\
    <img src='dex.gif' alt=''>\");\n  // remember to finally close the HTML document\n\
    \  popwindow.document.close();\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_119_2.png)\n\
    \nRemember to use single quotes inside double quotes.\n\n![](img/d78298d3338ec680a024bbc83e78b297_119_3.png)\n\
    \n118 | JavaScript in easy steps\n\n## Last modified\n\nThe window.lastModified\
    \ object can provide date and time information of when a Web page was last updated.\
    \ This data is usually supplied to document.lastModified from the HTTP file header\
    \ that is sent by the Web server. In some instances the Web server may omit this\
    \ information so document.lastModified will, in those cases, return zero.\n\n\
    Typically this data is used to indicate how recently a Web page has been updated\
    \ by the user knows how current the information on that page may be. Usually this\
    \ information is displayed at the bottom of a page in a smaller font than the\
    \ page text.\n\nThe example that follows first tests that a date has been supplied\
    \ to document.lastModified then writes the data into the HTML document:\n\n```javascript\n\
    // check that there is a lastModified\nif( Date.parse(document.lastModified )\
    \ != 0 ) {\n  // if so, write a message stating that date is\n  document.write(\n\
    \    \"Page last updated: \" + document.lastModified + );\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_120_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_120_1.png)\n\nThe <script> block to\
    \ include this script code would normally be situated at very end of the HTML\
    \ document <body> section.\n\n| Last-Modified Example | |\n| :--- |\n| File |\
    \ Edit | View | Tools | Help |\n| PERL is a general-purpose programming language\
    \ invented in 1987 by Larry Wall. Practical Enquiry and Reporting Language (PERL)\
    \ has one million users worldwide, and is the principal language for server-side\
    \ scripting. It is, for many, the preferred language for World Wide development.\
    \ |\n| Page last updated: 04/06/2005 12:52:53 |\n| Done | Local intranet |\n\n\
    ## XYZ coordinates\n\nPhysical position of content in a display window can be\
    \ referred to using coordinates called X, Y and Z.\n\nThe X coordinate specifies\
    \ the distance in pixels from the extreme left edge of the window.\n\nThe Y coordinate\
    \ specifies the distance in pixels from the extreme top edge of the window.\n\n\
    The Z coordinate specifies the stacked position, by index number, of layers above\
    \ the bottom window level:\n\n![](img/d78298d3338ec680a024bbc83e78b297_121_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_121_1.png)\n\nThe X coordinate at the\
    \ left edge of the window is zero and the Y coordinate at the top edge of the\
    \ window is also zero.\n\nA position where X=50 and Y=30 would pinpoint a location\
    \ 50 pixels from the left edge and 30 pixels from the top edge.\n\nThe Z coordinate\
    \ of the bottom window level has an index value of zero. Layers may be placed\
    \ over this level, like transparent sheets, and are given unique Z-index values.\n\
    \nA window may have many layers but the top layer will always have the highest\
    \ Z-index value. Each successive layer below that will have a decreasing lower\
    \ Z-index value.\n\n## Dynamic layers\n\nJavaScript can create layers dynamically\
    \ by writing the necessary HTML code and stylesheet rules in the body section\
    \ of the HTML document. This allows control over the position and appearance of\
    \ each layer.\n\nMost importantly, if layers overlap their stacking order can\
    \ be determined by the value assigned to their z-index – higher the number, the\
    \ higher the layer will be in the stack. The example below emulates the illustration\
    \ on the opposite page by dynamically creating two overlapping layers. The second\
    \ (yellow) layer is higher in the stack than the first (purple) layer. If their\
    \ z-index values were reversed, layer 1 was 20 and layer 2 was 10, the purple\
    \ layer would overlap the yellow layer.\n\n![](img/d78298d3338ec680a024bbc83e78b297_122_0.png)\n\
    \n```javascript\n// write a layer at z-index 10\ndocument.write(\"<div id='layer1'\
    \ style='position:absolute; top:20px; left:20px; width:80px; height:80px; background-color:purple;\
    \ color:white; z-index:10; border:1px solid black'>Layer #1</div>\");\n```\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_122_1.png)\n\n```javascript\n// write\
    \ a layer at z-index 20\ndocument.write(\"<div id='layer2' style='position:absolute;\
    \ top:40px; left:40px; width:80px; height:80px; background-color:yellow; z-index:20;\
    \ border:1px solid black'>Layer #2</div>\");\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_122_2.png)\n\
    \n10. Document properties | 121\n\n## Transparent layers\n\nUnless specified otherwise,\
    \ a layer will usually be created with the same background as the document body\
    \ – so will appear to be transparent. Alternatively it can be explicitly set to\
    \ be transparent by setting its background-color to transparent.\n\nThe transparency\
    \ of layers is particularly important when they contain images of irregular shapes\
    \ that have transparent parts. On a transparent layer these images appear to simply\
    \ float over the document background. Several images can appear in proximity,\
    \ even when their layers overlap, by allocating their z-index values to determine\
    \ their stacking order.\n\nThe script below creates two layers – but only one\
    \ is transparent to illustrate the difference in how each image appears.\n\n```javascript\n\
