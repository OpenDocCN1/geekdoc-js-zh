  md: '# Clear form


    The reset() method of a form object will reset all the values within the form
    and update the inputs to their original state – just as if the user had pushed
    a reset button. Careful use should be made of the reset() method to avoid the
    need for the user to input data repeatedly.


    ![](img/d78298d3338ec680a024bbc83e78b297_138_0.png)


    The example below uses the javascript: protocol to call the intrinsic JavaScript
    reset() function. This allows the user to click an image to reset the form, rather
    than a traditional reset button. Some pieces of JavaScript can be inserted into
    an HTML document this – without the need for any other script:


    ![](img/d78298d3338ec680a024bbc83e78b297_138_1.png)


    ```

    <form id="f" method="post" action="">

    <p>

    <input type="checkbox" name="chk1" value="fun"/>

    Fun JavaScript<br/>

    <input type="checkbox" name="chk2" value="great"/>

    Great JavaScript<br/>

    <input type="checkbox" name="chk3" value="easy"/>

    Easy JavaScript<br/>

    <img src="reset.gif" alt="">

    onclick="javascript:document.forms.reset()"/>

    </p>

    </form>

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_138_2.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_138_3.png)'
