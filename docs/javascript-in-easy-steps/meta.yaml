    \n## Logical operators\n\nThe three logical operators that can be used in JavaScript\
    \ are listed in the table below:\n\n| Operator | Operation |\n| --- | --- |\n\
    | && | Logical AND |\n| || | Logical OR |\n| ! | Logical NOT |\n\nThe logical\
    \ operators are used with operands that have the boolean values of true or false\
    \ – values that can convert to true or false.\n\nThe logical && operator will\
    \ evaluate two operands and return true only if both operands themselves are true.\
    \ Otherwise the && operator will return false.\n\nThis is typically used in conditional\
    \ branching where the direction of a JavaScript application is determined by testing\
    \ two conditions. If both conditions are satisfied the script will go in a certain\
    \ direction otherwise the script will take a different direction.\n\n![](img/d78298d3338ec680a024bbc83e78b297_25_0.png)\n\
    \nUnlike the && operator that needs both operands the || operator will evaluate\
    \ its two operands and return true if either of the operands itself returns true.\
    \ If neither operand returns true then || will return false. This is useful in\
    \ a JavaScript application to perform a certain action if either of one test conditions\
    \ has met.\n\nThe third logical operator ! is a unary operator that is used before\
    \ a single operand. It returns the inverse value of the given operand, so if the\
    \ variable a had a value of true then a would have a value of false. It is useful\
    \ in JavaScript applications to toggle the value of a variable in successive loop\
    \ iterations with a statement a=!!. This will ensure that on each pass the value\
    \ is changed, like flickering a light switch on and off.\n\n## Logical examples\n\
    \n```javascript\nvar a = true , b = false;\nvar test1 = ( a && a ); // test both\
    \ operands for true\nvar test2 = ( a && b );\nvar test3 = ( b && b );\nvar test4\
    \ = ( a || b ); // test either operand for true\nvar test5 = ( a || b );\nvar\
    \ test6 = ( b || b );\nvar test7 = !a ; var test8 = !b; // invert value\nvar result\
    \ = \"AND \\n\";\nresult += \"1: \" +test1 + \" 2: \" +test2 + \" 3: \" + test3;\n\
    result += \"\\nOR\\n\";\nresult += \"4: \" +test4+ \" 5: \" +test5+ \" 6: \" +test6;\n\
    result += \"\\nNOT\\n7: \" +test7+ \" 8: \" + test8;\nalert( result );\n```\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_26_0.png)\n\nUse the \\n new line escape,\
    \ and spaces to format the displayed output string\n\n![](img/d78298d3338ec680a024bbc83e78b297_26_1.png)\n\
    \nAND\n1: true 2: false 3: false\nOR\n4: true 5: true 6: false\nNOT\n7: false\
    \ 8: true\n\n## Assignment operators\n\nThe operators are commonly used in JavaScript\
    \ to assign values are all listed in the table below. All except the simple =\
    \ assign operator is a shorthand form of a longer expression so each equivalent\
    \ is also given for clarity.\n\n| Operator | Example | Equivalent |\n| ---|---||---|\n\
    | = | a = b | a = b |\n| += | a += b | a = (a + b) |\n| -= | a -= b | a = (a -\
    \ b) |\n| *= | a *= b | a = (a * b) |\n| /= | a /= b | a = (a / b) |\n| %= | a\
    \ %= b | a = (a % b) |\n\n![](img/d78298d3338ec680a024bbc83e78b297_27_0.png)\n\
    \nIt is important to think of the = operator as meaning \"assign\" rather than\
    \ \"equals\" to avoid confusion with the == equality operator.\n\nIn the example\
    \ the variable a is assigned the value that is contained in the variable name\
    \ b to become its new value.\n\nThe += operator is most useful and has been used\
    \ in earlier examples to add a second string to an existing string. In the table\
    \ example the += operator adds the value contained in variable a to the value\
    \ contained in the variable name b then assigns the result to become the new value\
    \ contained in variable a.\n\nAll other operators in the table work in the same\
    \ way – making the arithmetical operation between the two values first, then assigning\
    \ the result to the first variable to become its new value.\n\n## Assignment examples\n\
    \n```javascript\nvar a = \"JavaScript\", b = \"Code\"; // assign string values\n\
    a += b; // concatenate strings and assign to a\nvar c = 8, d = 4; // assign integer\
    \ values\nc += d; // add numbers and assign result to c\nvar e = 7.5, f = 2.5;\
    \ // assign float values\ne -= f; // subtract f from e\nvar g = 8, h = 4; // assign\
    \ integer values\ng *= h; // multiply g and h\nvar i = 8, j = 4; // assign integer\
    \ values\ni /= j; // divide i by j\nvar k = 8, l = 4; // assign integer values\n\
    k %= l; // remainder k by l\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_28_0.png)\n\
    \n## Comparison operators\n\nThe operators commonly used in JavaScript to compare\
    \ two values are all listed in the table below:\n\n| Operator | Test |\n| ---\
    \ | --- |\n| == | Equality |\n| != | Inequality |\n| > | Greater than |\n| < |\
    \ Less than |\n| >= | Greater than or equal |\n| <= | Less than or equal |\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_29_0.png)\n\nThe == operator compares\
    \ two operands and will return true if both are equal. Conversely the != operator\
    \ returns true if the operands are not equal.\n\nThe > operator compares two operands\
    \ and will return true if the first is greater than the second.\n\nThe < operator\
    \ compares two operands and will return true if the first is less than the second.\n\
    \nThe >= operator will return true if the first is greater than or equal to the\
    \ second.\n\nThe <= operator will return true if the first is less than or equal\
    \ to the second.\n\n## Comparison examples\n\n```javascript\n // compare string\
    \ values\nvar teststrings1 = (\"JavaScript\" == \"JavaScript\" );\nvar teststrings2\
    \ = (\"JavaScript\" == \"javascript\" );\n\n// compare numeric values\nvar testnumbers1\
    \ = ( 1.785 == 1.785 );\nvar testnumbers2 = ( 5 != 5 );\n\n// compare boolean\
    \ values\nvar testbooleans1 = ( true == true );\nvar testbooleans2 = ( false !=\
    \ false );\nvar testleshan1 = ( 100 < 200 );\nvar testleshan2 = ( 100 < 100 );\n\
    var testleshan_equal = ( 100 <= 100 );\nvar testgreaterthan = ( -1 > 1 );\nvar\
    \ a = 8, b = 8.0, testvariables1 = ( a == b );\nvar c = null, d = null, testvariables2\
