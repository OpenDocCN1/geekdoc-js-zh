  md: '# Capture mouse


    It is extremely useful to know the whereabouts of the cursor when dealing with
    JavaScript in DHTML scripting.


    Whenever the user moves the cursor a MouseMove event occurs and this can be captured
    by JavaScript for use with an onmousemove event-handler.


    The example below gives a useful way of determining x,y screen coordinates when
    developing DHTML scripts.


    The first script statement in this example is to trap mouse movements in Netscape
    – capitalization must be exactly correct.


    The MouseMove event is captured, the onmousemove event-handler dynamically displays
    the cursor''s x,y coordinates in a form field named txt:


    ![](img/d78298d3338ec680a024bbc83e78b297_144_0.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_144_1.png)


    ```

    // Netscape/Mozilla capture events instruction

    if (navigator.appName == "Netscape"

    window.captureEvents(Event.MOUSEMOVE);

    ```


    ```

    // a function to react to the MOUSEMOVE event

    function track(e)

    var x = (document.all) ? event.x : e.pageX;

    var y = (document.all) ? event.y : e.pageY;

    document.forms.f.txt.value = "X: "+x+" Y: "+y;


    ```


    The document.all property is found in Internet Explorer but not Netscape/Mozilla
    browsers – it can be useful to apply browser-specific code.


    ![](img/d78298d3338ec680a024bbc83e78b297_144_2.png)


    ```

    // specify the onmousemove event-handler

    document.onmousemove=track;

    ```


    The Netscape and Internet Explorer DOM use different object names for the cursor''s
    x,y position.


    ![](img/d78298d3338ec680a024bbc83e78b297_144_3.png)


    | MouseMove Event |

    | File Edit Favorites Tools Help |

    | 200 Y: 60 |

    | Done Local intranet |'
