  md: "# Password boxes\n\nA HTML password <input> is simply a text box that displays\
    \ asterisks in place of the actual characters.\n\nThis example converts the string\
    \ input by the user, into a password field named **pwd1**, to lowercase and assign\
    \ the string to a variable.\n\nIf the variable string matches the correct password\
    \ then the browser will load the first page of the website – but it will display\
    \ an `alert()` dialog message if the string does not match.\n\n![](img/d78298d3338ec680a024bbc83e78b297_130_0.png)\n\
    \n```\n// a function to validate a password entry\nfunction validate()\n{\n  //\
    \ convert the input to lowercase\n  var entry = document.forms.f.pwd1.value.toLowerCase();\n\
    \  // relocate the browser if the input is correct\n  if (entry == \"admin\")\
    \    window.location = \"page1.html\";\n  else {\n    // display a message if\
    \ the input is incorrect\n    alert(\"Password incorrect - Please retry...\");\n\
    \    document.forms.f.pwd1.value = \"\";\n  }\n}\n```\n\nThe final line in this\
    \ script will clear the password box after the user clicks the alert **OK** button,\
    \ to be ready for another entry.\n\n| Password Field |\n| File | Edit | View |\
    \ Favorites | Tools | Help |\n|---|---|---|---|---|---||\n| | | | | | Validate\
    \ |\n| Microsoft Internet Explorer Password incorrect - Please retry... OK |\n\
    | Done | Local intranet |"
  merge: -1
