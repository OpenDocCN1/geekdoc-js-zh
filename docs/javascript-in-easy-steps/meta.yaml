  - "[PAGE 126]\n\n# Form elements\n\nThe window.document.forms[].elements object\
    \ contains an array of all the elements within form indexed by the order in which\
    \ they appear in the HTML code. With a name f for instance, document.forms.f.elements[0]\
    \ addresses the first element that appears in that form.\n\nIf the name attribute\
    \ of the element has been assigned a value then the element can be addressed by\
    \ name. So the element btn1 in this form f can simply be addressed as document.forms.f.btn1...\n\
    \n```\n<form id=\"f\" method=\"post\" action=\"\">\n  <input type=\"button\" name=\"\
    btn1\" value=\"Click Me\"\n  onclick=\"alert('Hi I am a button')\"/>\n</form>\n\
    ```\n\nOther attributes are accessible as properties of element - as illustrated\
    \ by this example:\n\n```\nfunction element_info() {\n  // get the element type\n\
    \  var msg = \"Element Type: \"+document.forms.f.btn1.type;\n  // get the element\
    \ value\n  msg += \"\\nElement Value: \"+document.forms.f.btn1.value;\n  // get\
    \ the element onclick\n  msg += \"\\nElement Onclick: \"+document.forms.f.btn1.onclick;\n\
    \  alert(msg);\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_126_0.png)\n\
    \nUnless stated otherwise, all the functions in this chapter are called from the\
    \ HTML <body> tag's onload attribute - a form field cannot be created before it\
    \ is hidden\n\n![](img/d78298d3338ec680a024bbc83e78b297_126_1.png)"
  - "[PAGE 127]\n\n# Click buttons\n\nValues assigned in the HTML code may be reassigned\
    \ by JavaScript so that a button will perform a different action.\n\nIn the example\
    \ below a HTML onclick attribute specifies that the first() function will be called\
    \ when the button is pushed:\n\n```\n<form id=\"f\" method=\"post\" action=\"\"\
    >\n<input type=\"button\" name=\"btn1\" value=\"Click Me\"\nonclick=\"first()\"\
    ></form>\n```\n\nThe first() function assigns a string to a variable, then specifies\
    \ a new event-handler function called second() to the button's onclick attribute.\
    \ Subsequently pushing the button will call the second() function and execute\
    \ the statement contains.\n\n![](img/d78298d3338ec680a024bbc83e78b297_127_0.png)\n\
    \n```\n// create a global variable\nvar msg;\n\n// a function to store an initial\
    \ message\nfunction first() {\n  msg = \"This message was left by the first function\"\
    ;\n  // assign another function to the button\n  document.forms.f.btn1.onclick\
    \ = second;\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_127_1.png)\n\n\
    When assigning event-handler functions only assign the name without any brackets.\n\
    \n```\n// a function to store a second message and display both\nfunction second()\
    \ {\n  msg += \"\\nHi, I\\m the second function\";\n  alert(msg);\n}\n```\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_127_2.png)"
  - "[PAGE 128]\n\n# Toggle value\n\nIt is useful to change the label that is displayed\
    \ on a button by its value attribute if that button performs dual actions.\n\n\
    In the following example a button calls a stopgo() function to start or stop a\
    \ counter. The counter increments an integer variable at I-second intervals and\
    \ displays the count in the window's status bar.\n\nThe button label normally\
    \ reads Start but changes to Stop if the timer count() function is running.\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_128_0.png)\n\n```\nvar running = false,\
    \ num = -1, tim; // create globals\nfunction count() { // counter function\n\t\
    if(running) {\n\tnum++;\n\twindow.status = \"Seconds elapsed: \" + num;\n\ttim\
    \ = setTimeout(\"count()\", 1000);\n} else {\n\tnum = -1;clearTimeout(tim);\\\
    \ } // or halt\n}\nfunction stopgo() { // control function\n\trunning = !running;\
    \ // toggle counter\n\tcount();\n\tdocument.forms.btn1.value = (running)? \"Stop\"\
    \ : \"Start\"; // change the label\n}\n```\n\ntoggle.js\n\n![](img/d78298d3338ec680a024bbc83e78b297_128_1.png)\n\
    \nThe num variable is initialized at -1 so that when first incremented the counter\
    \ will start zero.\n\n![](img/d78298d3338ec680a024bbc83e78b297_128_2.png)\n\n\
    The I operator is used here to change the boolean variable to the opposite of\
    \ its current value.\n\n![](img/d78298d3338ec680a024bbc83e78b297_128_3.png)"
