  md: "# Time zones\n\nJavaScript can determine which time zone the user is in using\
    \ the Date.getTimezoneOffset() method.\n\nThe method gets the local time from\
    \ the Date object then compares it to the UTC time. The return value is the difference\
    \ stated in minutes because some countries have time zones at other regular one-hour\
    \ intervals.\n\nIn the example below the Date.getTimezoneOffset() method decides\
    \ in which U.S. time zone, if any, the user is located:\n\n```\n// create a new\
    \ Date object\nvar now = new Date();\n\n// get the number of minutes offset from\
    \ UTC\nvar offset = now.getTimezoneOffset();\n\n// create an empty variable\n\
    var msg;\n\n// assign an appropriate message\nswitch(offset) {\n  case 240 : msg\
    \ = \"East Coast\"; break;\n  case 300 : msg = \"Central\"; break;\n  case 360\
    \ : msg = \"Mountain\"; break;\n  case 420 : msg = \"Pacific\"; break;\n  default\
    \ : msg = \"all\";\n}\n\n// display the message\nalert(\"Welcome to \" +msg+ \"\
    \ visitors.\");\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_60_0.png)\n\n\
    This method can easily be used to redirect users to a local Web page too.\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_60_1.png)\n\nA bug in some Netscape browsers\
    \ does not report the correct offset.\n\n![](img/d78298d3338ec680a024bbc83e78b297_60_2.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_60_3.png)\n\n5. Date and time | 59"
