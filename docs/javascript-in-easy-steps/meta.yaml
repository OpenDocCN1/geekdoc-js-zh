  md: "# Blur\n\nA Blur event occurs when the browser’s focus moves away from a form\
    \ element, or a window, and the onblur event-handler may then call a JavaScript\
    \ function.\n\nThe blur() method of a form element is useful to prevent user input\
    \ for text boxes that must be read-only.\n\nA blur() method can be called from\
    \ the HTML autofocus attribute of the read-only element, like this...\n\n```\n\
    <input type=\"text\" size=\"30\"\nvalue=\"This field is read-only\" autofocus=\"\
    blur(this)\">\n```\n\nIn the following example the user is reminded that the text\
    \ box they just left should receive some input:\n\n![](img/d78298d3338ec680a024bbc83e78b297_154_0.png)\n\
    \n```\n// a function to examine a passed string argument\nfunction is_entry( val\
    \ )\n(\n  // if the text field is empty\n  if ( val == \"\")\n  // ...display\
    \ a message\n  alert(\"Please enter data \");\n)\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_154_1.png)\n\
    \nUsing the window.blur() method will typically minimize the window.\n\n![](img/d78298d3338ec680a024bbc83e78b297_154_2.png)\n\
    \n12. Event-handlers | 153"
  merge: -1
