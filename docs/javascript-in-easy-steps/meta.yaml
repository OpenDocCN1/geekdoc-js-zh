- md: "\n## Change case\n\nThe string character case may be changed using the string.toUpperCase()\
    \ or string.toLowerCase() methods to force all the characters to become a common\
    \ case.\n\nThese methods are useful when comparing user input to ensure that the\
    \ character format agrees with the comparison format.\n\nIn the following example\
    \ the function is called when the user clicks the button by assigning the function\
    \ name to the onclick attribute of the button's HTML element, like this:\n\n![](img/d78298d3338ec680a024bbc83e78b297_84_0.png)\n\
    \n```html\n<input type=\"button\" value=\"Check Input\" onclick=\"check_input()\"\
    >\n```\n\nThe string.toLowerCase() method converts the uppercase entry in the\
    \ text field for comparison with a lowercase string value.\n\n```javascript\n\
    function check_input() {\n  // get user input from text field in form id of f\n\
    \  var entry = document.forms.f.textfield.value;\n\n  // compare input and display\
    \ an appropriate message\n  if(entry.toLowerCase() == \"castle\") alert(\"Accepted\"\
    );\n  else alert(\"Refused\");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_84_1.png)\n\
    \nSee page 125 for fuller details on referencing form elements.\n\n![](img/d78298d3338ec680a024bbc83e78b297_84_2.png)\n\
    \n| Convert to Lower Case |\n| :--- |\n| File Edit View Favorites Tools Help |\n\
    | CASTLE | Check Input |\n| Microsoft Internet Explorer | |\n| Accepted | |\n\
    | OK | |\n| Done Local intranet | |\n\n## Numbers from strings\n\nA number can\
    \ be extracted from the beginning of a string with the parseInt() and parseFloat()\
    \ methods.\n\nThe parseInt() method parses the string and returns the integer\
    \ value that is located. The parseFloat() method works in the same way but returns\
    \ a floating number.\n\nIf the parser finds any non-numeric character before returning\
    \ a number then it will return the special NaN value that is used to denote \"\
    Not-a-Number\".\n\nThis example demonstrates both parseFloat() and parseInt()\
    \ methods and illustrates the JavaScript isNaN() function testing for a NaN value:\n\
    \n```javascript\n// create a string beginning with a number\nvar str = \"66.6%\
    \ PASS RATE\";\n\n// extract the initial integer value\nvar res = \"Integer: \"\
    \ + parseInt(str);\n\n// extract the initial float value\nres += \"\\nFloat: \"\
    \ + parseFloat(str);\n\n// create a string beginning with a letter\nvar badstr\
    \ = \"PASS RATE 66.6%\";\n\n// attempt to extract an initial integer value\nres\
    \ += \"\\nNon-numeric : \" + parseInt(badstr);\nres += \"\\nFound : \";\nres +=\
    \ isNaN(badstr) ? \"Character\": \"Number\"\nalert(res);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_85_0.png)\n\
    \nThe NaN value cannot be tested with the == operator.\n\n![](img/d78298d3338ec680a024bbc83e78b297_85_1.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_85_2.png)\n\n## Variables in strings\n\
    \nThe JavaScript eval() function accepts an argument string containing JavaScript\
    \ code which it evaluates, then returns the resulting value.\n\nIf the code string\
    \ contains statements they will be executed by the eval() function, then the final\
    \ value will be returned.\n\nWhile this function is a powerful feature of the\
    \ JavaScript language it is often used to introduce variable values into a string.\n\
    \nIn the example below the script assigns a string value to be displayed in a\
    \ text input within a form that has the id of f. The HTML <input> element has\
    \ been named textField.\n\n<script> element to include this JavaScript must appear\
    \ in the HTML document after the form elements - so that the text field is created\
    \ before the script assign a value to it.\n\nThe text box and the display string\
    \ are stored in variables that are evaluated by the eval() function.\n\n![](img/d78298d3338ec680a024bbc83e78b297_86_0.png)\n\
    \n```javascript\n// store the text input name\nvar inputname = \"textField\"\n\
    // store the string to assign\nvar inputtext = \"JavaScript Text\"\n\n// evaluate\
    \ the asignation expression\neval(\"document.forms.f.\"+inputname+\".value=\"\
    +inputtext);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_86_1.png)\n\nRemember\
    \ to escape the quotes inside a string to avoid error messages.\n\n![](img/d78298d3338ec680a024bbc83e78b297_86_2.png)\n\
    \nNow the string is displayed in the text field because the expression evaluates\
    \ to:\n\n```javascript\ndocument.forms.f.textField.value = \"JavaScript Text\"\
    ;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_86_3.png)\n\n## Encoding strings\n\
    \nAll characters have a Unicode representation that can be returned for each individual\
    \ character in a string with the string.charCodeAt() method. This method requires\
    \ the index of the character within the string as its argument.\n\nConversely\
    \ characters can be extracted using the JavaScript String.fromCharCode() function\
    \ that takes the Unicode numerical value as its argument.\n\nThe example below\
    \ first loops through a string and makes a comma delimited string of its Unicode\
    \ values. An array of these numerical values is created for the loop to return\
    \ the character for each number:\n\n```javascript\n// create and initialize three\
    \ strings\nvar str = \"Code\", enc = \"\", unc = \"\";\n\n// get the Unicode numbers,\
    \ comma delimited\nfor(var i = 0; i < str.length; i++) {\n  enc += str.charCodeAt(i)\
    \ + \",\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_87_0.png)\n\n```javascript\n\
    // split the list of numbers into array\nvar ss = enc.split(\",\");\n```\n\n```javascript\n\
    // convert the Unicode values back to characters\nfor(var i = 0; i < ss.length;\
    \ i++) {\n  unc += String.fromCharCode(ss[i]);\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_87_1.png)\n\
    \nNotice that fromCharCode() function is a property of the String constructor\
    \ and is not object method.\n\n```javascript\nalert(\"Encoded: \" + enc + \"\\\
    nUnencoded: \" + unc);\n```\n\nJavaScript Application:\nEncoded: 67,111,100,101,32,70,110,\n\
    Unencoded: Code\n\n## Addressing objects\n\nFollowing on the JavaScript foundation\
    \ this chapter starts to explore how scripts may communicate with various aspects\
    \ of Web page using the Document Object Model (DOM).\n\n- Object constructor |\
    \ 88\n- Property inheritance | 89\n- DOM hierarchy | 90\n- Revealing page objects\
    \ | 91\n- Browser ID | 92\n- Cross-browser compliance | 93\n- Platform check |\
    \ 94\n- Plugins information | 95\n- Java detection | 96\n\n## Object constructor\n\
    \nThe JavaScript syntax to address object properties and methods uses the object\
    \ name followed by a period then the property name.\n\nFor instance, array.length\
    \ addresses the length property of the array.\n\n![](img/d78298d3338ec680a024bbc83e78b297_89_0.png)\n\
    \nPrevious example code in this book used intrinsic JavaScript objects with pre-defined\
    \ properties and methods. New custom objects can easily be created though the\
    \ JavaScript new keyword with the Object() constructor. Properties may then be\
    \ allocated to the new custom object by declaring a property name and assigning\
    \ a value to it.\n\nThe example below creates a new object called car and gives\
    \ it three properties with assigned values:\n\n![](img/d78298d3338ec680a024bbc83e78b297_89_1.png)\n\
    \n```javascript\n// create a new car object\nvar car = new Object();\n\n// create\
    \ and initialize maker property\ncar.maker = \"Porsche\";\n\n// create and initialize\
    \ a model property\ncar.model = \"Boxster\";\n\n// create and initialize a color\
    \ property\ncar.color = \"Red\";\n\n// display all the car property values\nalert(car.color\
    \ + \" \" + car.maker + \" \" + car.model);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_89_2.png)\n\
    \n## Property inheritance\n\nFurther flexibility can be added to the example on\
    \ the facing page by assigning the newly created custom object to a property of\
    \ another custom object. In this case the properties and values of the assigned\
    \ object are inherited by the property of the second custom object.\n\nThe inherited\
    \ properties are addressed by adding a period and the inherited property name\
    \ after the property address to which they have been assigned. It is helpful to\
    \ understand this relationship when dealing with objects and properties in Web\
    \ pages.\n\nThe following example demonstrates how a new object is assigned to\
    \ a property of a custom object and how the inherited properties may be addressed:\n\
    \n```javascript\n// create a new object with assigned property values\nvar suv\
    \ = new Object();\nsuv.badge = \"Explorer\";\nsuv.type = \"4X4\";\nsuv.doors =\
    \ 4;\nsuv.color = \"Red\";\nsuv.engine = \"4.0 liters\";\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_90_0.png)\n\
    \nAn object must have first been created in the script before it can be assigned\
    \ to another object's property.\n\n![](img/d78298d3338ec680a024bbc83e78b297_90_1.png)\n\
    \n```javascript\n// create another object that inherits from the first\nvar car\
    \ = new Object();\ncar.marker = \"Ford\";\ncar.model = suv;\n```\n\n```javascript\n\
    // display unique value and inherited property values\nalert(car.marker + \" \"\
    \ + car.model.badge + \" \" + car.model.type);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_90_2.png)\n"
  mdcn: "\n\n## 字符大小写转换\n\n可以使用 `string.toUpperCase()` 或 `string.toLowerCase()` 方法更改字符串字符的大小写，以强制所有字符转换为统一的大小写。\n\
    \n这些方法在比较用户输入时非常有用，可以确保字符格式与比较格式保持一致。\n\n在以下示例中，当用户点击按钮时，通过将函数名赋值给按钮 HTML 元素的\
    \ `onclick` 属性来调用该函数，如下所示：\n\n![](img/d78298d3338ec680a024bbc83e78b297_84_0.png)\n\
    \n```html\n<input type=\"button\" value=\"Check Input\" onclick=\"check_input()\"\
    >\n```\n\n`string.toLowerCase()` 方法将文本框中的大写输入转换为小写字符串值，以便与小写字符串进行比较。\n\n```javascript\n\
    function check_input() {\n  // 从 id 为 f 的表单获取用户输入\n  var entry = document.forms.f.textfield.value;\n\
    \n  // 比较输入并显示适当的消息\n  if(entry.toLowerCase() == \"castle\") alert(\"Accepted\"\
    );\n  else alert(\"Refused\");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_84_1.png)\n\
    \n请参第 125 页有关引用表单元素的更多细节。\n\n![](img/d78298d3338ec680a024bbc83e78b297_84_2.png)\n\
    \n| 转换为小写 |\n| :--- |\n| 文件 编辑 视图 收藏 工具 帮助 |\n| CASTLE | Check Input |\n| Microsoft\
    \ Internet Explorer | |\n| Accepted | |\n| OK | |\n| Done 本地局域网 |\n\n## 字符串中的数字\n\
    \n可以使用 `parseInt()` 和 `parseFloat()` 方法从字符串的开头提取数字。\n\n`parseInt()` 方法解析字符串并返回找到的整数值。`parseFloat()`\
    \ 方法的工作相同，但返回的是浮点数。\n\n如果解析器在返回数字之前发现任何非数字字符，它将返回特殊的 `NaN` 值，用于表示“不是数字”（Not-a-Number）。\n\
    \n此示例演示了 `parseFloat()` 和 `parseInt()` 方法，并说明了 JavaScript `isNaN()` 函数如何测试 `NaN`\
    \ 值：\n\n```javascript\n// 创建一个数字开头的字符串\nvar str = \"66.6% PASS RATE\";\n\n// 提取初始整数值\n\
