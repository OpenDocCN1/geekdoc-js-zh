  - '[PAGE 67]


    # Math constants


    The intrinsic JavaScript Math object contains a number of standard mathematical
    constant values for easy reference.


    Uppercase is always used to refer to the constant values which are all listed
    in the following table:


    ![](img/d78298d3338ec680a024bbc83e78b297_67_0.png)


    | Math.E | The constant e of the natural logarithm with a value of approximately
    2.71828 |

    | Math.LN2 | The natural logarithm of 2 approximately 0.6931471805599458263 |

    | Math.LN10 | The natural logarithm of 10 approximately 2.3025850299405911 |

    | Math.LOG2E | The base-2 logarithm of e approximately 1.44269504088963387 |

    | Math.LOG10E | The base-10 logarithm of e approximately 0.4342944819032518677
    |

    | Math.PI | The constant pi approximately 3.14159265358979 |

    | Math.SQRT1_2 | The reciprocal of the square root of 2 approximately 0.707106781186542
    |

    | Math.SQRT2 | The square root of 2 with a value of approximately 1.41421356237095
    |


    The Math constants can be used anywhere within a script.


    Most of the Math constants are used only in JavaScript applications that have
    a particular mathematical purpose but the full list is given above for completeness.


    The Math.PI constant creates interesting possibilities with dynamic effects. The
    following example script dynamically rotates a layer named dl:'
