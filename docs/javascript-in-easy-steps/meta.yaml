    # Arithmetical operators


    The arithmetical operators commonly used in JavaScript are listed in the table
    below with the operations they perform:


    | Operator | Operation |

    | + | Addition (and concatenates strings) |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

    | % | Modulus |

    | ++ | Increment |

    | -- | Decrement |


    Notice that the + operator has two types of operation depending on the given operands.
    It will add together two numeric values and give the result of the addition. It
    will also join two string values and return the concatenated string, as in the
    example on the facing page.


    ![](img/d78298d3338ec680a024bbc83e78b297_23_0.png)


    The % modulus operator will divide the first given number by the second number
    and return the remainder of the operation. This is most useful to determine if
    a number has an odd or even value.


    The ++ increment and -- decrement operators alter the given value by 1 and returning
    the new value. These are most commonly used to count iterations


    All the other operators act as you would expect but care should be taken to bracket
    expressions where more than one operator is being used to clarify the operations:


    ```

    a = b * c - d % e / f; // This is unclear

    a = (b * c) - ((d % e) / f); // This is clearer

    ```'
