  - "[PAGE 65]\n\n# JavaScript clock\n\nUtilizing the Date object along with a timer\
    \ to create a display that updates every second to produce a clock.\n\nThe example\
    \ below displays the local time dynamically in an HTML form input named clock\
    \ – the form id is simply named f:\n\n```\nfunction tick() {\n  // create a new\
    \ Date object\n  var now = new Date();\n\n  // extract the current hours, minutes\
    \ and seconds\n  var hh = now.getHours();\n  var mn = now.getMinutes();\n  var\
    \ ss = now.getSeconds();\n\n  // ensure each component has two digits\n  if(hh\
    \ <= 9) hh = \"0\" + hh;\n  if(mn <= 9) mn = \"0\" + mn;\n  if(ss <= 9) ss = \"\
    0\" + ss;\n\n  // assign the current time string to the form field\n  document.forms.f.clock.value\
    \ = hh + \":\" + mn + \":\" + ss;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_65_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_65_1.png)\n\nThe clock needs to be\
    \ started by calling the tick() function from the onload attribute of the HTML\
    \ <body> tag - <body onload=\"tick()\"> This ensures that the form has before\
    \ JavaScript to assign the time to its clock form field.\n\n// set the interval\
    \ to one second\nwindow.setTimeout(\"tick()\", 1000);\n\n![](img/d78298d3338ec680a024bbc83e78b297_65_2.png)"
