    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_143_1.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_143_2.png)"
  - '[PAGE 144]


    # Capture mouse


    It is extremely useful to know the whereabouts of the cursor when dealing with
    JavaScript in DHTML scripting.


    Whenever the user moves the cursor a MouseMove event occurs and this can be captured
    by JavaScript for use with an onmousemove event-handler.


    The example below gives a useful way of determining x,y screen coordinates when
    developing DHTML scripts.


    The first script statement in this example is to trap mouse movements in Netscape
    – capitalization must be exactly correct.


    The MouseMove event is captured, the onmousemove event-handler dynamically displays
    the cursor''s x,y coordinates in a form field named txt:


    ![](img/d78298d3338ec680a024bbc83e78b297_144_0.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_144_1.png)


    ```

    // Netscape/Mozilla capture events instruction

    if (navigator.appName == "Netscape"

    window.captureEvents(Event.MOUSEMOVE);

    ```


    ```

    // a function to react to the MOUSEMOVE event

    function track(e)

    var x = (document.all) ? event.x : e.pageX;

    var y = (document.all) ? event.y : e.pageY;

    document.forms.f.txt.value = "X: "+x+" Y: "+y;


    ```


    The document.all property is found in Internet Explorer but not Netscape/Mozilla
    browsers – it can be useful to apply browser-specific code.


    ![](img/d78298d3338ec680a024bbc83e78b297_144_2.png)


    ```

    // specify the onmousemove event-handler

    document.onmousemove=track;

    ```


    The Netscape and Internet Explorer DOM use different object names for the cursor''s
    x,y position.


    ![](img/d78298d3338ec680a024bbc83e78b297_144_3.png)


    | MouseMove Event |

    | File Edit Favorites Tools Help |

    | 200 Y: 60 |

    | Done Local intranet |'
  - "[PAGE 145]\n\n# Mouse over\n\nA MouseOver event occurs when the user places the\
    \ cursor over an object on a Web page.\n\nThe anchor <a> element can specify an\
    \ event-handler for the MouseOver event by assigning a JavaScript function call\
    \ to the HTML onmouseover attribute, like this:\n\n```\n<a href=\"target.html\"\
    \ onmouseover=\"do_mouseover()\"></a>\n```\n\nMost frequently the event-handler\
    \ will perform an image swap as a rollover effect but any statements may be executed.\n\
    \nThe example below assigns string value to an input text box when the cursor\
    \ is placed over an image:\n\n```\n// a function to react to the MOUSEOVER event\n\
    function do_mouseover() {\n\n  // display a message in a form field\n  document.forms.f.txt.value\
    \ = \"Mouse is Over the link\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_145_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_145_1.png)"
  - "[PAGE 146]\n\n# Mouse out\n\nA MouseOut event occurs when the user moves the\
    \ cursor away from a HTML hyperlink on a Web page.\n\nThe anchor <a> element can\
    \ specify for the MouseOut event by assigning a JavaScript function call to the\
    \ HTML onmouseout attribute, like this:\n\n```\n<a href=\"target.html\" onmouseout=\"\
    do_mouseout()\"\nonmouseover=\"do_mouseover()\">\n```\n\nMost frequently event-handler\
    \ will perform an image swap to return an image to its original state in a rollover.\n\
    \nThe following example builds on the previous example by adding an onmouseout\
    \ event-handler to change the value of a text box when the cursor moves off the\
    \ link:\n\n```\n// a function to react to the MOUSEOUT event\nfunction do_mouseout()\n\
    {\n    document.forms.f.txt.value = \"Mouse is Off the link\";\n}\n```\n\n```\n\
    // a function to react to the MOUSEOVER event\nfunction do_mouseover()\n```\n\n\
