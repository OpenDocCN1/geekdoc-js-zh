    /* Here is an introduction

    // to this script code that

    // uses a multi-line comment */


    // This is a single-line comment


    // Display a greeting

    alert("Hello World\ );

    ```


    Excessive commenting is best avoided – this can dramatically increase the size
    of a JavaScript file.'
  - '[PAGE 13]


    # Keywords


    The following table contains the keywords that are part of the JavaScript language
    syntax. These may not be used when choosing identifier names for variables, functions
    or labels:


    | break | do | function | null | typeof |

    |---|---|---|---|--|

    | case | else | | return | var |

    | continue | export | import | switch | void |

    | default | false | in | this | while |

    | delete | for | new | true | with |


    ![](img/d78298d3338ec680a024bbc83e78b297_13_0.png)


    Additionally, JavaScript reserves all the words listed in the table below for
    possible future inclusion into the JavaScript syntax – so these too may not be
    used as identifier names. Although this may seem to be a lot of words to avoid
    it is seldom a real problem – it''s just a point to remember.


    | abstract | debugger | goto | package | synchronized |

    |---|---|---|---|--|

    | boolean | double | implements | private | throw |

    | byte | enum | instanceof | protected | throws |

    | catch | extends | int | public | transient |

    | char | final | interface | short | try |

    | class | finally | long | static | |

    | const | float | native | super |'
  - '[PAGE 14]


    # Variables


    A variable is a place in which to store data for manipulation within a JavaScript
    program.


    Naming variables any letter, digit and the underscore character may be used but
    the variable name may not begin with a digit. These are all valid variable names:


    Choose meaningful names for variables to the script easier to read later.


    ![](img/d78298d3338ec680a024bbc83e78b297_14_0.png)


    abc

    my_first_variable

    var13


    Create a new variable using the JavaScript var keyword:


    ![](img/d78298d3338ec680a024bbc83e78b297_14_1.png)


    ```

    // create a variable and assign a string to it

    var message = "My First JavaScript Variable";


    // display the value stored in the variable

    alert( message );

    ```


    The string is stored inside the variable named message.


    The variable name is used in the call to the JavaScript alert() function that
    opens an alert dialog box displaying the string that is stored in the message
    variable.


    ![](img/d78298d3338ec680a024bbc83e78b297_14_2.png)'
  - '[PAGE 15]


    # Data types


    JavaScript is a loosely typed language so its variables store numbers, text strings
    or boolean values (ie. true or false).


    This is unlike other programming languages such as C++ and Java that need to declare
    variables of a specific data type and can only then store data of the declared
    type.


    ```

    // initialize a number variable

    var a = 0.06;


    // initialize a string

    var b = "JavaScript in easy steps";


    // initialize a boolean variable

    var c = false;

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_15_0.png)


    ```

    // display the data type of each variable

    alert(typeof a + "\n" + typeof b + "\n" + typeof c);

    ```


    The example above creates variables with initial values of the three different
    data types supported by JavaScript.


    ![](img/d78298d3338ec680a024bbc83e78b297_15_1.png)


    These three values are first passed to the alert() function, then the JavaScript
    keyword typeof is used to return their data types for display in the alert dialog
    box below.


    The code "\n" inside the brackets just displays the output for each value on a
    new line in the alert dialog box.


    |JavaScript Application|

    number

    string

    boolean

    [OK]'
  - '[PAGE 16]


    # Escape sequences


    When a character in a string is preceded by the \backslash character there is
    a special effect on the character immediately following the backslash. This is
    known as an escape sequence as it allows the character to escape recognition as
    part of the JavaScript syntax.


    The table below lists more escape sequences:


    ![](img/d78298d3338ec680a024bbc83e78b297_16_0.png)


    | | Backspace |

    |---|---|

    | \b | Form feed |

    | \n | New line |

    | \r | Carriage return |

    | \'' | Single quote |

    | " | Double quote |

    | \ | Single backslash character |


    The escape sequence " is useful to incorporate quotation marks within a string
    without the string itself becoming terminated, and as in this example:


    ```

    // display the string with escaped quotes

    alert("We all say "JavaScript is great!" \);

    escapes.js

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_16_1.png)'
- md: "\n# Functions\n\nA function is a piece of JavaScript code that can be executed\
    \ once or many times by the JavaScript application. Functions and variables form\
    \ the basis of all JavaScript programming.\n\nThis is how a function looks:\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_17_0.png)\n\n```javascript\n// a function\
    \ to display a message in an alert dialog\nfunction call_alert() {\n  alert(\"\
    My First JavaScript Function\");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_17_1.png)\n\
    \nAlways try to give meaningful names to functions and variables.\n\nCreate a\
    \ new function using the JavaScript function keyword followed by a given identifier\
    \ name. The name must be unique within the script and adhere to the same naming\
    \ conventions that apply to the naming of variables:\n\nThe name is always followed\
    \ by a pair of plain brackets, then pair of curly brackets containing the code\
    \ to be executed.\n\nIn the example, the function has been named call_alert()\
    \ and the code to be executed will call the JavaScript alert() function to display\
    \ alert() dialog box containing a message.\n\n![](img/d78298d3338ec680a024bbc83e78b297_17_2.png)\n\
    \nRemember to include the plain brackets when referring to a function.\n\nThe\
    \ function can be called from anywhere in the JavaScript file or in the HTML document\
    \ to execute the statement that it contains.\n\nFor instance, the onload attribute\
    \ of the HTML <body> tag can be used to call the function when the document is\
    \ loaded into the browser, like:\n\n```html\n<body onload = \"call_alert()\">\n\
    ```\n\n![](img/d78298d3338ec680a024bbc83e78b297_17_3.png)\n\n# Function arguments\n\
    \nThe plain brackets that follow the name of all functions may be used to contain\
    \ data for use in the code to be executed. Just as the brackets of the JavaScript\
    \ alert() function contain the string to be displayed in the alert() dialog box\
    \ it creates.\n\nThe data contained within the brackets is known as the function\
    \ “argument”.\n\nIn the example below the function call passes a string text to\
    \ the argument named str in the call_alert() function for use in the code that\
    \ is to be executed:\n\n```javascript\n// a function to display the value of a\
    \ passed argument\nfunction call_alert( str )\n{\n    alert( str);\n}\n```\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_18_0.png)\n\nIt is important to note\
    \ that string contained inside the call to this double quotes used to contain\
    \ the entire call:\n\n```html\n<body onload = \"call_alert('Passed Value')\">\n\
    ```\n\nUsing double quotes for both would mean that the onload attribute value\
    \ would be \"call_alert(\" because the string is terminated by the double quote.\
    \ This would create a browser error and the function would not be executed.\n\n\
    The use of single and double quotes in this manner appears throughout JavaScript\
    \ programming in several ways.\n\n![](img/d78298d3338ec680a024bbc83e78b297_18_1.png)\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_18_2.png)\n\n# Multiple functions\n\n\
    JavaScript functions may call other functions during the execution of their code\
    \ in just the same way that the previous examples called the JavaScript alert()\
    \ function.\n\nThe following example demonstrates the use of multiple functions\
    \ to manipulate and display an integer argument:\n\n![](img/d78298d3338ec680a024bbc83e78b297_19_0.png)\n\
    \n```javascript\n// a function to call a second function\n// and display a returned\
    \ result\nfunction call_alert( num )\n{\n  var new_number = make_double( num );\n\
    \  alert(\" The Value Is \" + new_number );\n}\n\n// a function to double a_value\n\
    // and return the result to the caller\nfunction make_double( num )\n{\n  var\
    \ double_num = num + num;\n  return double_num;\n}\n```\n\nThe argument value\
    \ is passed from the caller to the make_double() function via the call_alert()\
    \ function:\n\n```html\n<body onload = \"call_alert( 4 )\">\n```\n\nThe value\
    \ is manipulated by the new_number in the call_alert() function using the JavaScript\
    \ keyword. Finally the alert() function is called to display the new_number.\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_19_1.png)\n![](img/d78298d3338ec680a024bbc83e78b297_19_2.png)\n\
    \n# Variable scope\n\nThe variables used in the example on the facing page are\
    \ both declared inside a function so they are called local variables. Local variables\
    \ can only be used by the function in which they are declared.\n\nConversely,\
    \ global variables are declared outside functions and can be accessed by any function\
    \ in the document.\n\n```javascript\n// create a global variable\nvar stored_num;\n\
    \n// a function to call a second function\n// and display a returned result\n\
    function call_alert( num ) {\n  stored_num = num;\n  make_triple();\n  alert(\"\
    The Value Is \" + stored_num );\n}\n\n// a function to double a value\n// and\
    \ return the result to the caller\nfunction make_triple() {\n  stored_num = stored_num\
    \ + stored_num;\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_20_0.png)\n\
    \nHOT TIP: All variables may simply be declared without being initialized with\
    \ a value. This example passes the argument value to a global variable:\n\n```html\n\
    <body onload = \"call_alert( 5 )\">\n```\n\nThe second function duplicates the\
    \ value of the global variable before calling alert() to display the value.\n\n\
    # Multiple arguments\n\nJavaScript functions may contain multiple arguments if\
    \ they are separated by a comma. The number of arguments defined when the function\
    \ is declared must be exactly matched by the number of arguments contained in\
    \ any call to that function.\n\nThis example declares a function containing three\
    \ arguments – so any call to it must contain three argument values:\n\n```javascript\n\
    // create three variables\nvar a, b, c;\n\n// a function to display three concatenated\
    \ arguments\nfunction call_alert(str1, str2, str3) {\n  a = str1;\n  b = str2;\n\
    \  c = str3;\n  alert(a + b + c);\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_21_0.png)\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_21_1.png)\n\nThe var keyword can be used\
    \ to declare multiple variables by separating the variable names with a comma.\
    \ The caller passes three strings to the function although the value of the second\
    \ string is merely a space:\n\n```html\n<body onload = \"call_alert('Great', '',\
    \ 'JavaScript')\">\n```\n\nThe function assigns the argument values to three global\
    \ variables and then calls alert() to display the values as a single concatenated\
    \ string.\n\n![](img/d78298d3338ec680a024bbc83e78b297_21_2.png)\n\n# Performing\
    \ operations\n\nAll the common JavaScript operators are detailed in this chapter\
    \ which illustrates by example how to perform arithmetical operations, how to\
    \ assign values and how to make comparisons. The logical operators are explained\
    \ and demonstrated too, along with the conditional operator.\n\n# Covers\n\n-\
    \ Arithmetical operators | 22\n- Arithmetical examples | 23\n- Logical operators\
    \ | 24\n- Logical examples | 25\n- Assignment operators | 26\n- Assignment examples\
    \ | 27\n- Comparison operators | 28\n- Comparison examples | 29\n- Conditional\
    \ operator | 30\n\n![](img/d78298d3338ec680a024bbc83e78b297_22_0.png)\n\n# Arithmetical\
    \ operators\n\nThe arithmetical operators commonly used in JavaScript are listed\
    \ in the table below with the operations they perform:\n\n| Operator | Operation\
    \ |\n| :--- | :--- |\n| + | Addition (and concatenates strings) |\n| - | Subtraction\
    \ |\n| * | Multiplication |\n| / | Division |\n| % | Modulus |\n| ++ | Increment\
    \ |\n| -- | Decrement |\n\nNotice that the + operator has two types of operation\
    \ depending on the given operands. It will add together two numeric values and\
    \ give the result of the addition. It will also join two string values and return\
    \ the concatenated string, as in the example on the facing page.\n\n![](img/d78298d3338ec680a024bbc83e78b297_23_0.png)\n\
    \nThe % modulus operator will divide the first given number by the second number\
    \ and return the remainder of the operation. This is most useful to determine\
    \ if a number has an odd or even value.\n\nThe ++ increment and -- decrement operators\
    \ alter the given value by 1 and returning the new value. These are most commonly\
    \ used to count iterations.\n"
  mdcn: "\n\n# 函数\n\n函数是一段 JavaScript 代码，可以被 JavaScript 应用执行一次或多次。函数和变量是所有 JavaScript\
    \ 编程的基础。\n\n函数的格式如下所示：\n\n![](img/d78298d3338ec680a024bbc83e78b297_17_0.png)\n\
    \n```javascript\n// 一个用于在告警对话框中显示消息的函数\nfunction call_alert() {\n  alert(\"My\
    \ First JavaScript Function\");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_17_1.png)\n\
    \n始终尝试给函数和变量赋予有意义的名字。\n\n使用 JavaScript 的 `function` 关键字后跟定的标识符名称来创建一个新函数。该名称在脚本中必须是唯一的，并遵循与变量命名相同的命名规范：\n\
    \n名称后面总是跟着一对圆括号，然后是一对包含要执行代码的大括号。\n\n在示例中，函数被命名为 `call_alert()`，要执行的代码将调用 JavaScript\
    \ 的 `alert()` 函数，以显示包含消息的 `alert()` 对话框。\n\n![](img/d78298d3338ec680a024bbc83e78b297_17_2.png)\n\
    \n在引用函数时，记得包含圆括号。\n\n可以在 JavaScript 文件或 HTML 文档的任何地方调用函数，以执行它包含的语句。\n\n例如，HTML\
    \ `<body>` 标签的 `onload` 属性可以在文档加载到浏览器时调用该函数，如下：\n\n```html\n<body onload = \"\
    call_alert()\">\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_17_3.png)\n\n\
    # 函数参数\n\n所有函数名称后的圆括号可用于包含供执行代码使用的数据。正如 JavaScript `alert()` 函数的括号包含了其所创建的 `alert()`\
    \ 对话框中要显示的字符串。\n\n括号内包含的数据被称为函数“参数”（argument）。\n\n在下面的示例中，函数调用将一个字符串文本传递给 `call_alert()`\
    \ 函数中名为 `str` 的参数，用于要执行的代码：\n\n```javascript\n// 一个用于显示传递的参数值的函数\nfunction call_alert(\
    \ str )\n{\n    alert( str);\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_18_0.png)\n\
    \n需要注意的是，在此调用中双引号内的字符串本用于包含整个调用：\n\n```html\n<body onload = \"call_alert('Passed\
    \ Value')\">\n```\n\n对两处都使用双引号将意味着 `onload` 属性的值将为 `\"call_alert(\"`，因为字符串被双引号终止了。这将导致浏览器错误且函数将不会执行。\n\
    \n单引号和双引号的这种用法在 JavaScript 编程中以多种方式出现。\n\n![](img/d78298d3338ec680a024bbc83e78b297_18_1.png)\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_18_2.png)\n\n# 多多个函数\n\nJavaScript 函数在执行代码期间可以调用其他函数，就就像之前的示例调用\
    \ JavaScript `alert()` 函数一样。\n\n下面的示例演示了如何使用多个函数来处理和显示整数参数：\n\n![](img/d78298d3338ec680a024bbc83e78b297_19_0.png)\n\
    \n```javascript\n// 一个调用第二个函数并显示返回结果函数\nfunction call_alert( num )\n{\n  var new_number\
    \ = make_double( num );\n  alert(\" Value Is \" + new_number );\n}\n\n// 一个将值翻倍并将结果返回给调用者的函数\n\
    function make_double( num )\n{\n  var double_num = num + num;\n  return double_num;\n\
    }\n```\n\n参数通过 `call_alert()` 函数从调用者传递给 `make_double()` 函数：\n\n```html\n<body\
    \ onload = \"call_alert( 4 )\">\n```\n\n值在 `call_alert()` 函数中使用 `new_number` 进行处理。最后调用\
    \ `alert()` 函数来显示该值。\n\n![](img/d78298d3338ec680a024bbc83e78b297_19_1.png)\n![](img/d78298d3338ec680a024bbc83e78b297_19_2.png)\n\
    \n# 变量范围\n\n上一页示例中使用的变量函数内部声明，因此它们被称为局部变量。局部变量只能由定义的函数使用。\n\n相反，全局变量在函数外部声明，可以被文档中的任何函数访问。\n\
    \n```javascript\n// 创建全局变量\nvar stored_num;\n\n// 一个调用第二个函数并显示返回结果函数\nfunction\
    \ call_alert( num ) {\n  stored_num = num;\n  make_triple();\n  alert(\"Value\
    \ Is \" + stored_num );\n}\n\n// 一个将值翻倍并将结果返回给调用者的函数\nfunction make_triple() {\n\
    \  stored_num = stored_num + stored_num;\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_20_0.png)\n\
    \n热提示：所有变量都可以简单地声明而不初始化值。此示例将参数值传递给全局变量：\n\n```html\n<body onload = \"call_alert(\
    \ 5 )\">\n```\n\n第二个函数在调用 `alert()` 显示之前复制了全局变量的值。\n\n# 多个参数\n\n如果 JavaScript\
    \ 函数用逗号分隔，则包含多个参数。声明函数时的参数数量必须与对该函数的任何调用中的参数数量完全匹配。\n\n此示例声明了一个包含三个参数的函数——因此对它的调用必须包含三个参数值：\n\
    \n```javascript\n// 创建三个变量\nvar a, b, c;\n\n// 一个显示三个连接参数的函数\nfunction call_alert(str1,\
    \ str2, str3) {\n  a = str1;\n  b = str2;\n  c = str3;\n  alert(a + b + c);\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_21_0.png)\n![](img/d78298d3338ec680a024bbc83e78b297_21_1.png)\n\
    \n`var` 关键字可以通过逗号分隔变量名来声明多个变量。调用者向函数传递了三个字符串，尽管第二个字符串仅是一个空格：\n\n```html\n<body\
    \ onload = \"call_alert('Great', '', 'JavaScript')\">\n```\n\n函数将参数值分配给三个全局变量，然后调用\
    \ `alert()` 将值显示为单个连接字符串。\n\n![](img/d78298d3338ec680a024bbc83e78b297_21_2.png)\n\
    \n# 执行操作\n\n本章详细介绍了常用的 JavaScript 运算符，通过示例说明了如何进行算术运算、如何赋值以及如何进行比较。同时也解释并演示了条件运算符。\n\
    \n# 目录\n\n- 算术运算符 | 22\n- 算术示例 | 23\n- 逻辑运算符 | 24\n- 逻辑示例 | 25\n- 赋值运算符 | 26\n\
    - 赋值示例 | 27\n- 比较运算符 | 28\n- 比较示例 | 29\n- 条件运算符 | 30\n\n![](img/d78298d3338ec680a024bbc83e78b297_22_0.png)\n\
    \n# 算术运算符\n\nJavaScript 中常用的算术运算符列在下表中，并带有它们执行的操作：\n\n| 运算符 | 操作 |\n| :--- | :---\
    \ |\n| + | 加法（并连接字符串） |\n| - | 减法 |\n| * | 乘法 |\n| / | 除法 |\n| % | 取模 |\n| ++\
    \ | 递增 |\n| -- | 递减 |\n\n注意 `+` 运算符根据给定的操作数有两种操作类型。它将两个数值值相加并给出加法结果。它还将合并两个字符串值并返回连接后的字符串，如上一页的示例所示。\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_23_0.png)\n\n"
