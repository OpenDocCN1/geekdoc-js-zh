  md: "# Using the system clock\n\nWhen a JavaScript is needed to create an action\
    \ repeatedly in a Web browser the system clock can be used with the JavaScript\
    \ setTimeout() method of the window object.\n\nThe window.setTimeout() method\
    \ can run a function after a specified interval. Two arguments are required stating\
    \ name of the function to call and the required interval time in milliseconds.\
    \ This method is often used at the end of a function to call the same function\
    \ recursively, following a set delay.\n\n![](img/d78298d3338ec680a024bbc83e78b297_63_0.png)\n\
    \nMany uses can be found for this method in creating dynamic effects. For instance,\
    \ in slideshow scripts where the function displays successive images at given\
    \ intervals.\n\nThe example here uses the window.setTimeout() method to display\
    \ an alert() box at 10 second intervals:\n\n```\n// create and initialize a counter\
    \ variable\nvar num = 0;\n\n// a recursive function to display a message\nfunction\
    \ timeout() {\n  // increment the counter\n  num++;\n  // display the message\n\
    \  alert(\"This is 10-Second Message No: \" + num );\n  // set the interval before\
    \ calling this function again\n  window.setTimeout(\"timeout()\", 10000);\n}\n\
    \n// call the function to start the routine\ntimeout();\n```\n\n[JavaScript Application]\n\
    This is 10-Second Message No: 3\n[OK]"
  merge: -1
  pgno: 63
- img_proc: true
  md: "# Cancelling the timer\n\nThe unfortunate viewer of the site containing the\
    \ JavaScript on the previous page would doubtless feel aggrieved at the constant\
    \ alert box messages. It may be better to show the message only a couple of times\
    \ then calling the timeout() function.\n\nThe window.setTimeout() method can be\
    \ cancelled easily using the window.clearTimeout() method.\n\nIn order to clear\
    \ the timer correctly it is necessary to assign the original window.setTimeout()\
    \ call to a variable - so that variable can be passed as the window.clearTimeout()\
    \ call argument.\n\nThe following example displays a message twice, then displays\
    \ a final message when the timer is cleared:\n\n```\n// create a counter variable\
    \ and a timer variable\nvar num = 0, tim;\n\nfunction timeout() {\n  num++;\n\
    \  if (num == 3) {\n    alert(\"OK - I told you twice\");\n    window.clearTimeout(\
    \ tim); // cancel the timer\n  }\n  else {\n    alert(\"This is 10-Second Message\
    \ No : \" + num);\n    tim = window.setTimeout( \"timeout()\", , 10000);\n  }\n\
    }\n\ntimeout();\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_64_0.png)\n\n\
    The variable name tim is often used to name the timer variable.\n\n![](img/d78298d3338ec680a024bbc83e78b297_64_1.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_64_2.png)\n\n5. Date and time | 63"
