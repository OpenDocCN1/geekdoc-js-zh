    \ other programming languages such as C++ and Java that need to declare variables\
    \ of a specific data type and can only then store data of the declared type.\n\
    \n```\n// initialize a number variable\nvar a = 0.06;\n\n// initialize a string\n\
    var b = \"JavaScript in easy steps\";\n\n// initialize a boolean variable\nvar\
