    \ 的 `<div>` 元素的值来访问这些属性。\n\n```javascript\n//一个显示 <div>样式属性的函数\nfunction get_styles()\
    \ {\n  var obj = document.getElementById(\"lyr\");\n  var str = \"ID: \" + obj.id;\n\
    \  str += \"\\nTop: \" + obj.style.top;\n  str += \"\\nLeft: \" + obj.style.left;\n\
    \  str += \"\\nZ-Index: \" + obj.style.zIndex;\n  str += \"\\nVisibility: \" +\
