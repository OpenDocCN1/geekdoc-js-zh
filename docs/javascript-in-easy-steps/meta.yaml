  - "[PAGE 158]\n\n# Abort\n\nInternet Explorer allows an event-handler to be specified\
    \ for the Abort event that occurs when the user cancels the download of an image\
    \ — usually by pushing the stop on the browser toolbar. the onabort event-handler\
    \ may call a JavaScript function when an image download is cancelled.\n\nTo identify\
    \ the image a name must be given to its id attribute in the HTML <img> element,\
    \ like this...\n\n```\n<img id=\"big-pic\" src=\"bigpic.jpg\" alt=\"/>\n```\n\n\
    An event-handler can then be assigned to that's onabort property. In the example\
    \ below the event-handler directly creates an alert() message confirming that\
    \ the download is cancelled:\n\n```\n// for Internet Explorer only set an event-handler\n\
    if(document.all)\\document.getElementById(\"big-pic\").onabort = abort_msg;\n\n\
    // a function to display a confirmation message\nfunction abort_msg() {\n  alert(\"\
    Image Download Has Been Aborted \");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_158_0.png)\n\
    \nThe <script> element that includes this script must appear in the HTML <img>\
    \ element — an event-handler can't be set until the image object exists.\n\n![](img/d78298d3338ec680a024bbc83e78b297_158_1.png)\n\
    \nThis feature is useful to switch the image source to a low-resolution version.\n\
