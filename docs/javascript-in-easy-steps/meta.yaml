  md: '# Platform check


    The performance of a Web page may be affected by the operating system on which
    the browser is running due to some lack of support for the page content.


    ActiveX controls are one way to create interface features on Web documents.


    For example, a Web browser running on a Linux platform will not support Microsoft
    ActiveX controls. So any Web page containing an ActiveX control will not be performed
    as intended by that platform.


    Platform-specific scripting can be achieved, in a similar manner to that used
    for browser-specific scripting, with the **navigator.platform** property.


    This property contains a short string representing the user’s operating system
    and can be read to branch the script to accommodate any platform limitations.


    The example below writes out the navigator.platform value:


    ```

    // get the operating system type

    var os = navigator.platform;

    document.write("Operating system is " + os);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_95_0.png)


    The document.write() method is useful to have JavaScript write content the page
    dynamically - it can write HTML tags too.


    ![](img/d78298d3338ec680a024bbc83e78b297_95_1.png)


