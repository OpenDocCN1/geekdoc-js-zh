  - '[PAGE 80]


    # Search a string


    JavaScript can search a string to find a character or substring passed the argument
    to the string.indexOf() method.


    If a match is made the method returns the starting position of the first occurrence
    of the matched character or substring within the searched string.


    In the event that no match is found the string.indexOf() method returns a value
    of -1.


    The following example uses the string.indexOf() method to seek a dot and @ character
    within an email address string to perform a simple format validation:


    ```

    // create an initialize string to search

    var str = "mailme@domain.com";

    // seek, @ dot and # characters within the string

    var att = str.indexOf("@");

    var dot = str.indexOf(".");

    var hsh = str.indexOf("#");

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_80_0.png)


    An optional second argument may specify the position from which to start the search.


    ![](img/d78298d3338ec680a024bbc83e78b297_80_1.png)


    ```

    // make valid only if an @ and a dot are found

    var fmt = ((att != -1)&&(dot != -1)) "valid":"invalid";

    // display the results of the search

    var res = "Format is " +fmt;

    res += "\n0at @ " +att;

    res += "\n0Dot at " +dot;

    res += "\n0nHash is " +hsh;

    alert(res);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_80_2.png)'
  - '[PAGE 81]


    # Separate words


    The contents of a string may be separated using the JavaScript string.split()
    method.


    A single argument should specify a common character for a delimiter at which points
    the string will be separated. Most commonly this can be a single space character
    so that a phrase with normal spacing will be separated into an array of single
    words.


    Each of the words can then be referenced using the index number of the split string
    array, like any other array.


    The example below illustrates this use of the string.split() method with another
    instance where items in a database may use a pipe character as the delimiter:


    ```

    // create and initialize a string variable

    var str = "JavaScript in easy steps"


    // split words into array elements delimited by a space

    var ss = str.split(" ");


    // create and initialize another string variable

    var bk = "JavaScript in easy steps|Mike McGrath";


    // split words into array elements delimited by a pipe

    var bks = bk.split("|");


    // display some split elements

    var res = "Topic : " + ss[0];

    res += "\nTitle : " + bks[0];

    res += "\nAuthor : " + bks[1];

    nalert(res);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_81_0.png)


    Data is often stored as a comma-delimited string


    ![](img/d78298d3338ec680a024bbc83e78b297_81_1.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_81_2.png)'
  - '[PAGE 82]


    # Substrings


    A substring may be extracted from an existing string using the string.substring()
    method which must have two arguments to specify the start and end positions of
    the required substring within the main string.


    The character at the start argument position will be the first character in the
    returned substring. The last character in the substring will be the character
    preceding the end argument position.


    An alternative way to extract a substring from a string is available with the
    string.substr() method which also requires two arguments. While the first argument
    again specifies the start position of the substring the second will specify the
    length of the substring to be returned.


    The example below demonstrates both substring methods:


    ```

    // create and initialize a string variable

    var str = "JavaScript in easy steps";

    // get two substrings with the substring method

    var sub1 = str.substring(14,19) + str.substring(0,11);

    // get two substrings with the substr method

    var sub2 = str.substr(14,5) + str.substr(0,10);

    // display all the substrings

    var res = "Substring method : " +sub1;

    res += "\nSubstr method : " +sub2;

    alert(res);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_82_0.png)


    > HOT TIP The substr() method will invariably be easiest to use.


    ![](img/d78298d3338ec680a024bbc83e78b297_82_1.png)


    7. Working with strings | 81'
  - '[PAGE 83]


    # Convert to string


    It is possible to manually call the JavaScript function that is used to convert
    other data types to strings by calling the object.toString() method.


    This is an essential JavaScript function and will always try to return a string
    representation of the object that is being queried, even if it is not itself a
    string.


    In this example there is firstly a straightforward addition of two integers, followed
    by a concatenation of a string with an integer where the integer is converted
    to a string value.


    Finally the object.toString() method is demonstrated with a different data type
    to illustrate that the generated output will reveal the object type.


    ```

    // create an integer variable and add another integer

    var num = 9;

    var nostr = num + 9;

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_83_0.png)


    ```

    // create a version of the num integer variable

    // then concatenate a second value to it

    var adstr = num.toString() + 9;

    ```


    ```

    // create a new Image object

    var img = new Image();

    ```


    ```

    // display string values of the variables

    var res = "No strings : " + nostr;

    res += "\nAdded strings : " + adstr;

    res += "\nImage : " + img.toString()";

    alert(res);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_83_1.png)


