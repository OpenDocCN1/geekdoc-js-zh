  - "[PAGE 120]\n\n# Last modified\n\nThe window.lastModified object can provide date\
    \ and time information of when a Web page was last updated. This data is usually\
    \ supplied to document.lastModified from the HTTP file header that is sent by\
    \ the Web server. In some instances the Web server may omit this information so\
    \ document.lastModified will, in those cases, return zero.\n\nTypically this data\
    \ is used to indicate how recently a Web page has been updated by the user knows\
    \ how current the information on that page may be. Usually this information is\
    \ displayed at the bottom of a page in a smaller font than the page text.\n\n\
    The example that follows first tests that a date has been supplied to document.lastModified\
    \ then writes the data into the HTML document:\n\n```\n// check that there is\
    \ a lastModified\nif( Date.parse(document.lastModified ) != 0 ) {\n// if so, write\
    \ a message stating that date is\ndocument.write(\n  \"Page last updated: \" +\
    \ document.lastModified + \\);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_120_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_120_1.png)\n\nThe <script> block to\
