  - "[PAGE 39]\n\n# While loops\n\nAnother loop uses the JavaScript **while** keyword\
    \ followed by an expression to be evaluated for a boolean value.\n\nIf the evaluation\
    \ returns `true` then the code in the statement block will be executed. After\
    \ the code has executed the test expression will again be evaluated and the loop\
    \ will continue until evaluation returns `false`.\n\n![](img/d78298d3338ec680a024bbc83e78b297_39_0.png)\n\
    \nThe statement block must feature code that will affect the expression in order\
    \ to change the evaluation result to return **false** – otherwise an infinite\
    \ loop will be created.\n\nIt is important to note that if the test expression\
    \ returns **false** it is first evaluated then the code in the statement block\
    \ is never executed.\n\nThis example decrements a variable value on each iteration\
    \ of the loop. The counter increments until it reaches 10 when the evaluation\
    \ returns `false` and the loop ends.\n\n![](img/d78298d3338ec680a024bbc83e78b297_39_1.png)\n\
    \n```\nvar i = 0, num = 50;\n\n// loop until the counter hits 10\nwhile(i < 10)\n\
    {\n  num--;\n  i++;\n}\n\n// display the final counter and number values\nalert(\"\
    Loop stopped at \" + i + \"\\num is now \" + num);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_39_2.png)"
  - "[PAGE 40]\n\n# The do - while loop\n\nThe JavaScript **do** keyword is used to\
    \ denote the start of a **do-while** loop and is followed by a statement block\
    \ containing the code to be executed by the loop.\n\nThe statement code is followed\
    \ by the JavaScript **while** keyword and an expression to be evaluated for a\
    \ boolean value of **true** or false.\n\nIf the evaluation returns **true** the\
    \ loop restarts at the **do** keyword and will continue until the evaluation returns\
    \ **false**.\n\nIt is important to note that, unlike the simple **while** loop,\
    \ the statement code will always be executed at least once by the **do-while**\
    \ loop because the test expression is not encountered until the end of the loop.\n\
    \nThe following example will never loop because the counter value is incremented\
    \ to 1 in the first execution of the statement code so the first test evaluation\
    \ will return **false**:\n\n```\nvar i = 0, num = 50;\n\n// loop until the counter\
    \ hits 1\ndo {\n  num--;\n  i++;\n} while(i < 1);\n\n// display the final counter\
    \ and number values\nalert(\"Loop stopped at \" + i + \"\\nnum is now \" + num);\n\
    ```\n\n![](img/d78298d3338ec680a024bbc83e78b297_40_0.png)\n\nA **while** loop\
    \ is often more suitable than a **do-while** loop.\n\n![](img/d78298d3338ec680a024bbc83e78b297_40_1.png)\n\
    \n3. Making statements | 39"
