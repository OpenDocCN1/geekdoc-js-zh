  - '[PAGE 138]


    # Clear form


    The reset() method of a form object will reset all the values within the form
    and update the inputs to their original state – just as if the user had pushed
    a reset button. Careful use should be made of the reset() method to avoid the
    need for the user to input data repeatedly.


    ![](img/d78298d3338ec680a024bbc83e78b297_138_0.png)


    The example below uses the javascript: protocol to call the intrinsic JavaScript
    reset() function. This allows the user to click an image to reset the form, rather
    than a traditional reset button. Some pieces of JavaScript can be inserted into
    an HTML document this – without the need for any other script:


    ![](img/d78298d3338ec680a024bbc83e78b297_138_1.png)


    ```

    <form id="f" method="post" action="">

    <p>

    <input type="checkbox" name="chk1" value="fun"/>

    Fun JavaScript<br/>

    <input type="checkbox" name="chk2" value="great"/>

    Great JavaScript<br/>

    <input type="checkbox" name="chk3" value="easy"/>

    Easy JavaScript<br/>

    <img src="reset.gif" alt="">

    onclick="javascript:document.forms.reset()"/>

    </p>

    </form>

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_138_2.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_138_3.png)'
  - '[PAGE 139]


    # Send form


    When a form is submitted to the server the values assigned to the name and value
    attributes of each form element are sent as name=value pairs.


    The submit() method of the form object can be used to send the form to the server
    in exactly the same way as if the user pushed a HTML submit button.


    ![](img/d78298d3338ec680a024bbc83e78b297_139_0.png)


    The example below uses the javascript: protocol to call the intrinsic JavaScript
    submit() function. This allows the user to click an image to submit a form, rather
    than a traditional submit button.


    ![](img/d78298d3338ec680a024bbc83e78b297_139_1.png)


    ```

    <form id="f" method="post" action="search.cgi">

    <p>

    <input type="checkbox" name="chk1" value="fun"/>

    Fun JavaScript<br/>

    <input type="checkbox" name="chk2" value="great"/>

    Great JavaScript<br/>

    <input type="checkbox" name="chk3" value="easy"/>

    Easy JavaScript<br/>

    <img src="submit.gif" alt=""

    onclick="javascript:document.forms.f.submit()"/>

    </p>

    </form>

    ```


    | Submit Form |

    | File | Edit | View | Favorites | Tools | Help |

    |---|---|---|---|---|---||

    | [ ] Fun JavaScript |

    | [ ] Great JavaScript |

    | [ ] Easy JavaScript |

    | Submit |

    | Done Local intranet'
  - "[PAGE 140]\n\n# Amend form\n\nThe onSubmit property of a form object can be used\
    \ to execute a JavaScript function just before the form data is sent to the server.\
    \ This may be when the user pushes an HTML submit button, when the form is sent\
    \ with the form object's submit() method.\n\nThe function will be executed then\
    \ the form will be submitted to the server. Usefully, this allows JavaScript to\
    \ amend the form so that the name=value pairs can be better used by a receiving\
    \ CGI script.\n\nIn the example below the HTML onSubmit attribute of the <form>\
    \ add_zeros() function just before the form data is sent to the server. This function\
    \ ensures any empty text input element gets a zero value assigned to it:\n\n![](img/d78298d3338ec680a024bbc83e78b297_140_0.png)\n\
    \n```\n// a function to assign zeros to empty text fields\nfunction add_zeros()\
    \ {\n  if(txt1.value == \"\") txt1.value = \"0\";\n  if(txt2.value == \"\") txt2.value\
    \ = \"0\";\n  if(txt3.value == \"\") txt3.value = \"0\";\n}\n```\n\nThe CGI script\
    \ acknowledges the name fields and the zero values:\n\n![](img/d78298d3338ec680a024bbc83e78b297_140_1.png)\n\
    \nCGI Parser Output\nFile Edit View Favorites Tools Help\nOutput:\n- Key: txt1\
    \ - Value: 100\n- Key: txt2 - Value: 0\n- Key: txt3 - Value: 0\nDone\nLocal intranet"
- md: "## Email address validation\n\nThe value of form elements may be validated\
    \ for correct format before the form is submitted.\n\nIn the following example\
    \ JavaScript tests the format of a text input string for the presence of @ and\
    \ dot characters will only submit the form if the email address validation passes:\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_141_0.png)\n\n```javascript\n// a function\
    \ to validate an email address\nfunction send_if_valid() {\n  if(document.forms.f.email.value.indexOf(\"\
    @\") == -1 )\n    fail(\"No '@' in address\");\n  else {\n    var adr = document.forms.f.email.value.split(\"\
    \");\n    if(adr[0].length < 1) fail(\"User address absent\");\n    else if(adr[1].indexOf(\"\
    .\") == -1) fail(\"No dot\");\n    else if(adr[1].length < 3) fail(\"Domain incorrect\"\
    );\n    else document.forms.f.submit();\n  }\n}\n\n// a function to display an\
    \ error message\nfunction fail(msg) {\n  alert(\"Email Address Error:\\n\" + msg);\n\
    }\n```\n\n- **HOT TIP**: The function send_if_valid() is called from the HTML\
    \ onclick attribute of the button in this example.\n\n![](img/d78298d3338ec680a024bbc83e78b297_141_1.png)\n\
    \n## Event-handlers\n\nUser actions, such as a key depression or a mouse click,\
    \ create events that JavaScript can use to interact with the user. This chapter\
    \ describes common events and illustrates how they are used by a JavaScript event-handler.\n\
    \n## Covers\n\n| Topic | Page |\n| :--- | :--- |\n| Mouse click | 142 |\n| Capture\
    \ mouse | 143 |\n| Mouse over and mouse out | 144 |\n| Mouse down and mouse up\
    \ | 146 |\n| Mouse buttons | 147 |\n| Key down and key up | 148 |\n| Key codes\
    \ | 149 |\n| Load and unload | 150 |\n| Focus and blur | 152 |\n| Change | 154\
    \ |\n| Reset | 155 |\n| Submit | 156 |\n| Abort | 157 |\n| Resize | 158 |\n\n\
    ## Chapter Twelve\n\n## Mouse click\n\nThe most common interactive event is the\
    \ Click event created when a user clicks the left-hand mouse button while the\
    \ cursor is over a form button in a Web document.\n\nAn onclick event-handler\
    \ is normally assigned in the button's HTML <input> tag with the HTML onclick\
    \ attribute.\n\nTypically the value assigned to the onclick attribute will be\
    \ call to a JavaScript function that will execute statements. For instance...\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_143_0.png)\n\n```html\n<input type=\"\
    button\" value=\"Do Click\" onclick=\"do_click('JavaScript in easy steps')\"/>\n\
    ```\n\nThis simple example calls a JavaScript function when the user clicks on\
    \ a button and passes a string argument for use by the called function:\n\n```javascript\n\
    // a function to react to the CLICK event\nfunction do_click( str )\n{\n    //\
    \ display the passed string argument\n    alert(str);\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_143_1.png)\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_143_2.png)\n\n## Capture mouse\n\nIt\
    \ is extremely useful to know the whereabouts of the cursor when dealing with\
    \ JavaScript in DHTML scripting.\n\nWhenever the user moves the cursor a MouseMove\
    \ event occurs and this can be captured by JavaScript for use with an onmousemove\
    \ event-handler.\n\nThe example below gives a useful way of determining x,y screen\
    \ coordinates when developing DHTML scripts.\n\nThe first script statement in\
    \ this example is to trap mouse movements in Netscape – capitalization must be\
    \ exactly correct.\n\nThe MouseMove event is captured, the onmousemove event-handler\
    \ dynamically displays the cursor's x,y coordinates in a form field named txt:\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_144_0.png)\n![](img/d78298d3338ec680a024bbc83e78b297_144_1.png)\n\
    \n```javascript\n// Netscape/Mozilla capture events instruction\nif (navigator.appName\
    \ == \"Netscape\")\n  window.captureEvents(Event.MOUSEMOVE);\n```\n\n```javascript\n\
    // a function to react to the MOUSEMOVE event\nfunction track(e) {\n  var x =\
    \ (document.all) ? event.x : e.pageX;\n  var y = (document.all) ? event.y : e.pageY;\n\
    \  document.forms.f.txt.value = \"X: \"+x+\" Y: \"+y;\n}\n```\n\nThe document.all\
    \ property is found in Internet Explorer but not Netscape/Mozilla browsers – it\
    \ can be useful to apply browser-specific code.\n\n![](img/d78298d3338ec680a024bbc83e78b297_144_2.png)\n\
    \n```javascript\n// specify the onmousemove event\ndocument.onmousemove=track;\n\
    ```\n\nThe Netscape and Internet Explorer use different object names for the cursor's\
    \ x,y position.\n\n![](img/d78298d3338ec680a024bbc83e78b297_144_3.png)\n\n| MouseMove\
    \ Event | File Edit | Help |\n| :--- | :--- | :--- |\n| Done Local | 200 | Y:\
    \ 60 |\n\n## Mouse over\n\nA MouseOver event occurs when the user places the cursor\
    \ over an object on a Web page.\n\nThe anchor element can specify an event-handler\
    \ for the MouseOver event by assigning a JavaScript function call to the HTML\
    \ onmouseover, like this:\n\n```html\n<a href=\"target.html\" onmouseover=\"do_mouseover()\"\
    ></a>\n```\n\nFrequently the event-handler will perform an image swap as a rollover\
    \ effect but any statements may be executed.\n\nThe example below assigns value\
    \ to an input text box when the cursor is placed over an image:\n\n```javascript\n\
    // a function to react to the MOUSEOVER event\nfunction do_mouseover() {\n  //\
    \ display a message in a form field\n  document.forms.f.txt.value = \"Mouse is\
    \ Over the link\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_145_0.png)\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_145_1.png)\n\n## Mouse out\n\nA MouseOut\
    \ event occurs when the user moves the cursor away from a hyperlink on a Web page.\n\
    \nThe anchor element can specify the MouseOut event by assigning a JavaScript\
    \ function call to the HTML onmouseout, like this:\n\n```html\n<a href=\"target.html\"\
    \ onmouseout=\"do_mouseout()\" onmouseover=\"do_mouseover()\">\n```\n\nFrequently\
    \ the event-handler will perform an image swap to return an image to its original\
    \ state in a rollover. The following example builds on the previous example by\
    \ adding an onmouseout event-handler to change the value of a text box when the\
    \ cursor moves off the link:\n\n```javascript\n// a function to react to the MOUSEOUT\
    \ event\nfunction do_mouseout() {\n    document.forms.f.txt.value = \"Mouse is\
    \ Off the link\";\n}\n```\n\n```javascript\n// a function to react to the MOUSEOVER\
    \ event\nfunction do_mouseover() {\n    document.forms.f.txt.value = \"Mouse is\
    \ Over the link\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_146_0.png)\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_146_1.png)\n\nThis illustration shows\
    \ the text field after the cursor has moved over the image.\n\n![](img/d78298d3338ec680a024bbc83e78b297_146_2.png)\n\
    \n## Mouse down and mouse up\n\nA MouseDown event occurs when the user presses\
    \ a mouse button and a MouseUp event occurs when it is released.\n\nTypically\
    \ these are used together so that a single mouse click will use two event-handlers,\
    \ like this:\n\n```html\n<input type=\"button\" value=\"Light Switch\" onmousedown=\"\
    light(1)\" onmouseup=\"light(0)\">\n```\n\nThis example swaps an image and changes\
    \ when the cursor is over the image and a mouse is pressed. It reverts to its\
    \ state when the button is released:\n\n```javascript\n// a function to react\
    \ to MOUSEDOWN and MOUSEUP events\nfunction light(n) {\n  if ( n == 1 ) {\n  \
    \  document.images.bulb.src = \"bulbon.gif\";\n    document.forms.f.txt.value\
    \ = \"Button is Down\";\n  }\n  if ( n == 0 ) {\n    document.images.bulb.src\
    \ = \"bulboff.gif\";\n    document.forms.f.txt.value = \"Button is Up\";\n  }\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_147_0.png)\n\n**HOT TIP**:\
    \ The document, link, image and button HTML elements support attributes for mouseup\
    \ and mousedown.\n\n![](img/d78298d3338ec680a024bbc83e78b297_147_1.png)\n![](img/d78298d3338ec680a024bbc83e78b297_147_2.png)\n\
    \n## Mouse buttons\n\nJavaScript can determine which mouse button has been pressed\
    \ by examining properties of the MouseDown event.\n\nWith Internet Explorer the\
    \ left mouse button stores an integer value of 1 in the event.button property,\
    \ the right mouse button stores an integer value of 2 and the center button, if\
    \ present, stores an integer value of 3.\n\nHere this property is used to inhibit\
    \ the Internet Explorer context menu that normally appears when the right mouse\
    \ button is pressed by the user:\n\n```javascript\n// store a default message\n\
    var msg = \"Right-Click Context Menu Is Disabled\";\n// a function to stop the\
    \ IE context menu\nfunction stopmenu(e) {\n  // for Internet Explorer browsers\n\
    \  if(navigator.appName == \"Microsoft Internet Explorer\"\n  && ( event.button\
    \ == 2 || event.button == 3 )) {\n    alert( msg );\n    return false;\n  }\n\
    }\n// specify the onmousedown event-handler\ndocument.onmousedown = stopmenu;\n\
    ```\n\n![](img/d78298d3338ec680a024bbc83e78b297_148_0.png)\n![](img/d78298d3338ec680a024bbc83e78b297_148_1.png)\n"
  mdcn: "\n## 电子邮件地址验证\n\n在提交表单之前，可以对表单元素的值进行格式正确性验证。\n\n在以下示例中，JavaScript 测试文本输入字符串的格式是否包含\
    \ `@` 和 `.` 字符，只有在电子邮件地址验证通过时才会提交表单：\n\n![](img/d78298d3338ec680a024bbc83e78b297_141_0.png)\n\
    \n```javascript\n// 用于验证电子邮件地址的函数\nfunction send_if_valid() {\n  if(document.forms.f.email.value.indexOf(\"\
    @\") == -1 )\n    fail(\"No '@' in address\");\n  else {\n    var adr = document.forms.f.email.value.split(\"\
    \");\n    if(adr[0].length < 1) fail(\"User address absent\");\n    else if(adr[1].indexOf(\"\
    .\") == -1) fail(\"No dot\");\n    else if(adr[1].length < 3) fail(\"Domain incorrect\"\
    );\n    else document.forms.f.submit();\n  }\n}\n\n// 用于显示错误信息的函数\nfunction fail(msg)\
    \ {\n  alert(\"Email Address Error:\\n\" + msg);\n}\n```\n\n- **热提示**：函数 `send_if_valid()`\
    \ 在此示例是从按钮的 HTML `onclick` 属性中调用的。\n\n![](img/d78298d3338ec680a024bbc83e78b297_141_1.png)\n\
    \n## 事件处理器\n\n用户操作（如按下按键或点击鼠标）会创建 JavaScript 用于与用户交互的事件。本章描述了常见事件，并说明了如何通过 JavaScript\
    \ 事件处理器使用它们。\n\n## 目录\n\n| 主题 | 页码 |\n| :--- | :--- |\n| 鼠标点击 | 142 |\n| 捕获鼠标\
    \ | 143 |\n| 鼠标悬入和鼠标移出 | 144 |\n| 鼠标按下和鼠标释放 | 146 |\n| 鼠标按钮 | 147 |\n| 按键按下和按键释放\
    \ | 148 |\n| 键码 | 149 |\n| 加载和卸载 | 150 |\n| 聚焦和模糊 | 152 |\n| 改变 | 154 |\n| 重置\
    \ | 155 |\n| 提交 | 156 |\n| 取消 | 157 |\n| 调整大小 | 158 |\n\n## 第十二章\n\n## 鼠标点击\n\n\
    最常见的交互事件是用户在 Web 文档中鼠标悬停在表单按钮上时点击鼠标左键创建的 Click 事件。\n\n`onclick` 事件处理器通常在按钮的 HTML\
    \ `<input>` 标签中通过 HTML `onclick` 属性分配。\n\n通常，分配给 `onclick` 属性的值将是调用一个执行语句的 JavaScript\
    \ 函数。例如...\n\n![](img/d78298d3338ec680a024bbc83e78b297_143_0.png)\n\n```html\n\
    <input type=\"button\" value=\"Do Click\" onclick=\"do_click('JavaScript in easy\
    \ steps')\"/>\n```\n\n这个简单的示例在用户点击按钮时调用 JavaScript 函数，并传递一个字符串参数供被调函数使用：\n\n```javascript\n\
    // 用于响应 CLICK 事件的函数\nfunction do_click( str )\n{\n    // 显示传递的字符串参数\n    alert(str);\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_143_1.png)\n![](img/d78298d3338ec680a024bbc83e78b297_143_2.png)\n\
    \n## 捕获鼠标\n\n在 DHTML 脚本中处理 JavaScript 时，知道光标的位置是非常有用的。\n\n每当用户移动光标，就会发生 MouseMove\
    \ 事件，该事件可以被 JavaScript 捕获并用于 `onmousemove` 事件处理器。\n\n下面的示例提供了在开发 DHTML 脚本时确定 x,y\
    \ 屏幕坐标的有用方法。\n\n此示例中的第一个脚本语句是在 Netscape 中捕获鼠标移动——大小写必须完全正确。\n\nMouseMove 事件被捕获后，`onmousemove`\
    \ 事件处理器在名为 `txt` 的表单字段中动态显示光标的 x,y 坐标：\n\n![](img/d78298d3338ec680a024bbc83e78b297_144_0.png)\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_144_1.png)\n\n```javascript\n// Netscape/Mozilla\
    \ 捕获事件指令\nif (navigator.appName == \"Netscape\")\n  window.captureEvents(Event.MOUSEMOVE);\n\
    ```\n\n```javascript\n// 用于响应 MOUSEMOVE 事件的函数\nfunction track(e) {\n  var x =\
    \ (document.all) ? event.x : e.pageX;\n  var y = (document.all) ? event.y : e.pageY;\n\
    \  document.forms.f.txt.value = \"X: \"+x+\" Y: \"+y;\n}\n```\n\n`document.all`\
    \ 属性存在于 Internet Explorer 中 Netscape/Mozilla 浏览器中不存在——这对于应用特定浏览器代码可能有用。\n\n![](img/d78298d3338ec680a024bbc83e78b297_144_2.png)\n\
    \n```javascript\n// 指定 onmousemove 事件\ndocument.onmousemove=track;\n```\n\nNetscape\
    \ 和 Internet Explorer 对光标的 x,y 位置使用不同的对象名称。\n\n![](img/d78298d3338ec680a024bbc83e78b297_144_3.png)\n\
    \n| MouseMove 事件 | 文件编辑 | 帮助 |\n| :--- | :--- | :--- |\n| 完成本地 | 200 | Y: 60 |\n\
    \n## 鼠标悬入\n\n当用户将光标置于 Web 页面上的对象上时，会发生 MouseOver 事件。\n\n锚元素可以通过将 JavaScript 函数调用分配给\
    \ HTML `onmouseover` 为 MouseOver 事件指定事件处理器，如下：\n\n```html\n<a href=\"target.html\"\
    \ onmouseover=\"do_mouseover()\"></a>\n```\n\n通常，事件处理器会执行图像切换作为翻滚效果，但也可以执行任何语句。\n\
    \n下面的示例在光标悬停在输入文本框上时为其赋值：\n\n```javascript\n// 用于响应 MOUSEOVER 事件的函数\nfunction\
    \ do_mouseover() {\n  document.forms.f.txt.value = \"Mouse Over\";\n}\n```\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_145_0.png)\n![](img/d78298d3338ec680a024bbc83e78b297_145_1.png)\n\
    \n## 鼠标移出\n\n当用户离开 Web 页面上的对象时，会发生 MouseOut 事件。\n\n元素可以通过将 JavaScript 函数调用分配给\
    \ HTML `onmouseout` 为 MouseOut 事件指定事件处理器，如下：\n\n```html\n<a href=\"target.html\"\
    \ onmouseout=\"do_mouseout()\">\n```\n\n通常，事件处理器会在光标离开图像时执行图像切换以恢复到初始状态。以下示例在光标移出图像时为\
    \ `onmouseout` 赋值：\n\n```javascript\n// 用于响应 MOUSEOUT 事件的函数\nfunction do_mouseout()\
    \ {\n  document.forms.f.txt.value = \"Mouse Out\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_146_0.png)\n\
    \n## 按键按下和按键释放\n\nMouseDown 事件在用户按下鼠标键时发生，MouseUp 事件在释放时发生。\n\n通常将它们结合使用，以便单个鼠标点击可以使用两个事件处理器，如下：\n\
    \n```html\n<input type=\"button\" value=\"Light Switch\" onmousedown=\"light(1)\"\
    \ onmouseup=\"light(0)\">\n```\n\n此示例在光标按下图像时切换图像并在释放按钮时恢复其状态：\n\n```javascript\n\
    // 用于响应 MOUSEDOWN 和 MOUSEUP 事件的函数\nfunction light(n) {\n  if ( n == 1 ) {\n  \
    \  document.images.bulb.src = \"bulbon.gif\";\n    document.forms.f.txt.value\
    \ = \"Button is Down\";\n  }\n  if ( n == 0 ) {\n    document.images.bulb.src\
    \ = \"bulboff.gif\";\n    document.forms.f.txt.value = \"Button is Up\";\n  }\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_147_0.png)\n\n**热提示**：document、link、image\
    \ 和 button HTML 元素支持 `mouseup` 和 `mousedown` 属性。\n\n![](img/d78298d3338ec680a024bbc83e78b297_147_1.png)\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_147_2.png)\n\n## 鼠标按钮\n\nJavaScript 可以通过检查\
    \ MouseDown 事件的属性确定按了哪个鼠标按钮。\n\n在 Internet Explorer 中，左鼠标键在 `event.button` 属性中存储值为\
    \ 1，右鼠标键存储值为 2，中间键（如果存在）存储值为 3。\n\n此处使用该属性来阻止用户按下右鼠标键时通常会出现的 Internet Explorer\
    \ 菜单：\n\n```javascript\n// 存储默认消息\nvar msg = \"Right-Click Context Menu Is Disabled\"\
    ;\n// 用于停止 IE 菜单的函数\nfunction stopmenu(e) {\n  // 针对 Internet Explorer 浏览器\n \
    \ if(navigator.appName == \"Microsoft Internet Explorer\"\n  && ( event.button\
    \ == 2 || event.button == 3 )) {\n    alert( msg );\n    return false;\n  }\n\
    }\n// 指定 onmousedown 事件处理器\ndocument.onmousedown = stopmenu;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_148_0.png)\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_148_1.png)\n"
