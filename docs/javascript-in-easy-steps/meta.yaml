    \ res = \"Topic : \" + ss[0];\nres += \"\\nTitle : \" + bks[0];\nres += \"\\nAuthor\
    \ : \" + bks[1];\nalert(res);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_81_0.png)\n\
    \nData is often stored as a comma-delimited string\n\n![](img/d78298d3338ec680a024bbc83e78b297_81_1.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_81_2.png)\n\n# Substrings\n\nA substring\
    \ may be extracted from an existing string using the string.substring() method\
    \ which must have two arguments to specify the start and end positions of the\
    \ required substring within the main string.\n\nThe character at the start argument\
    \ position will be the first character in the returned substring. The last character\
    \ in the substring will be the character preceding the end argument position.\n\
    \nAn alternative way to extract a substring from a string is available with the\
    \ string.substr() method which also requires two arguments. While the first argument\
    \ specifies the start position of the substring the second will specify the length\
    \ of the substring to be returned.\n\nThe example below demonstrates both substring\
    \ methods:\n\n```javascript\n// create and initialize a string variable\nvar str\
    \ = \"JavaScript in easy steps\";\n// get two substrings with the substring method\n\
    var sub1 = str.substring(14,19) + str.substring(0,11);\n// get two substrings\
