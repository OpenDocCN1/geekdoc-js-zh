    \n![](img/d78298d3338ec680a024bbc83e78b297_19_2.png)"
  - "[PAGE 20]\n\n# Variable scope\n\nThe variables used in the example on the facing\
    \ page are both declared inside a function so they are called local variables.\
    \ Local variables can only be used by the function in which they are declared.\n\
    \nConversely, global variables are declared outside functions and can be accessed\
    \ by any function in the same document.\n\n```\n// create a global variable\n\
    var stored_num;\n\n// a function to call a second function\n// and display a returned\
    \ result\nfunction call_alert( num ) {\n  stored_num = num;\n  make_triple();\n\
    \  alert(\"The Value Is \" + stored_num );\n}\n\n// a function to double a value\n\
    // and return the result to the caller\nfunction make_triple() {\n  stored_num\
    \ = stored_num + stored_num + stored_num;\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_20_0.png)\n\
    \n> HOT TIP All variables may simply be declared without being initialized with\
    \ a value.\n\nThis example passes the argument value to a global variable:\n\n\
    ```\n<body onload = \"call_alert( 5 )\">\n```\n\nThe second function duplicates\
    \ the value of the global variable before calling alert() to display the new value.\n\
    \n[JavaScript Application] The Value Is 15 [OK]]\n\n1. Introducing JavaScript\
