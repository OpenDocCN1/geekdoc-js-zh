  md: '# If - else statements


    The JavaScript else keyword can be used with an if statement to provide alternative
    code to execute, in the event that the test expression returns false.


    This is known as conditional branching and has this syntax:


    ```

    if (test expression) do-this; or-else-do-this;

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_35_0.png)


    Several expressions may be tested until a true value is found when the code following
    the true expression will be executed. It is important to note any further code
    contained in the if-else statement is ignored.


    So in the following example code after the call to the alert() function by the
    third test will be executed:


    ```

    var num = 2, bool = false;

    // is the number 1 and the boolean value true ?

    if(num == 1 && bool == 1) alert("TEST1 bool: " + bool);

    else

    // is the number 2 and the boolean value true ?

    if(num == 2 && bool == 1) alert("TEST2 bool: " + bool);

    else

    // is the number 2 and the boolean value false ?

    if(num == 2 && bool == 0) alert("TEST3 bool: " + bool);

    else

    // is the number 3 and the boolean value false ?

    if(num == 3 && bool == 0) alert("TEST4 bool: " + bool);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_35_1.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_35_2.png)


    |JavaScript Application|\ TEST3 bool: false

    OK


    34 | JavaScript in easy steps'
