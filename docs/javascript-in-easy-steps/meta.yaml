  md: '# Pop-up layers


    This example builds on the earlier visibility toggle by using multiple layers
    which have their visibility toggled by an image map.


    When the cursor is placed over an image map hyperlink, the JavaScript function
    will display the appropriate layer but will hide that layer when the cursor moves
    off the link.


    Both layers are created in the HTML code with their visibility style property
    set to hidden – so they are not initially visible. Placing the cursor over an
    active area of the image causes the mouseover event to call the talk() function.
    The function passes a string argument to identify which active area is the caller.
    This determines which layer object is to be manipulated.


    The talk() function sets the visibility style of the appropriate layer object
    to visible – so it becomes visible. Moving the cursor over active area causes
    the mouseout event to call the hush() function, again passing a string argument
    identifier. This once sets the visibility style of the appropriate layer object
    to hidden – so it becomes invisible again.


    This type of dynamic script can be used to create great effect with navigation
    menu item rollovers.


    ![](img/d78298d3338ec680a024bbc83e78b297_173_0.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_173_1.png)'
