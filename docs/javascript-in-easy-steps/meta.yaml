  - "[PAGE 165]\n\n# Dynamic content\n\nJavaScript can write content on a layer without\
    \ affecting the contents elsewhere on the page.\n\nThe position of the layer will\
    \ remain unaltered but the height of the layer will be automatically increased\
    \ if the content will not fit into the existing layer size.\n\nAlso text will\
    \ automatically wrap intelligently at the layer border words will not be split.\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_165_0.png)\n\nThe JavaScript example\
    \ for this feature will create a layer, then dynamically the user-entered text\
    \ onto the layer when the user pushes the push button.\n\n![](img/d78298d3338ec680a024bbc83e78b297_165_1.png)\n\
    \n```\n// create a <div> layer\ndocument.write(\"<div id='lyr' style='position:absolute;top:90px;left:10px;width:200px;height:10px;z-index:10;background-color:orange'></div>\"\
    );\n\n// a function to write a user-entered string on a layer\nfunction write_entry()\
    \ {\n  // get the string entry\n  var str = document.forms.f.txt.value;\n\n  //\
    \ reference the layer by id\n  var obj = document.getElementById(\"lyr\");\n\n\
    \  // open the layer document\n  obj.document.open();\n\n  // write the string\n\
    \  obj.document.write(str);\n\n  // close the layer document\n  obj.document.close();\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_165_2.png)\n\nThe illustrations\
    \ on the facing page demonstrate the effect of this script when the user enters\
    \ a string into the text field then clicks the push button."
