  md: '# Variables


    A variable is a place in which to store data for manipulation within a JavaScript
    program.


    Naming variables any letter, digit and the underscore character may be used but
    the variable name may not begin with a digit. These are all valid variable names:


    Choose meaningful names for variables to the script easier to read later.


    ![](img/d78298d3338ec680a024bbc83e78b297_14_0.png)


    abc

    my_first_variable

    var13


    Create a new variable using the JavaScript var keyword:


    ![](img/d78298d3338ec680a024bbc83e78b297_14_1.png)


    ```

    // create a variable and assign a string to it

    var message = "My First JavaScript Variable";


    // display the value stored in the variable

    alert( message );

    ```


    The string is stored inside the variable named message.


    The variable name is used in the call to the JavaScript alert() function that
    opens an alert dialog box displaying the string that is stored in the message
    variable.


