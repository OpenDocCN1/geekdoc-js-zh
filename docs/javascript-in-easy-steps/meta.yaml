  md: "# # Mouse down and mouse up\n\nA MouseDown event occurs when the user presses\
    \ a mouse button and a MouseUp event occurs when it is released.\n\nTypically\
    \ these are used together so that a single mouse click will use two event-handlers,\
    \ like this:\n\n```\n<input type = \"button\" value = \"Light Switch\"\nonmousedown\
    \ = \"light(1)\" onmouseup = \"light(0)\">\n```\n\nThis example swaps an image\
    \ and changes when the cursor is over the image and a mouse is pressed. It reverts\
    \ to their original state when the button is released:\n\n```\n// a function to\
    \ react to MOUSEDOWN and MOUSEUP events\nfunction light(n)\n{\n  if ( n == 1 )\
    \ {\n    document.images.bulb.src = \"bulbon.gif\";\n    document.forms.f.txt.value\
    \ = \"Button is Down\";\n  }\n  if ( n == 0 ) {\n    document.images.bulb.src\
    \ = \"bulboff.gif\";\n    document.forms.f.txt.value = \"Button is Up\";\n  }\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_147_0.png)\n\n**HOT TIP** The\
    \ document, link, image and button HTML elements support attributes for mouseup\
    \ and mousedown.\n\n![](img/d78298d3338ec680a024bbc83e78b297_147_1.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_147_2.png)"
  merge: -1
  pgno: 147
- img_proc: true
  md: "# Mouse buttons\n\nJavaScript can determine which mouse button has been pressed\
    \ by examining properties of the MouseDown event.\n\nWith Internet Explorer the\
    \ left mouse button stores an integer value of 1 in the event.button property,\
    \ the right mouse button stores an integer value of 2 and the center button, if\
    \ present, stores an integer value of 3.\n\nHere this property is used to inhibit\
    \ the Internet Explorer context menu that normally appears when the right mouse\
    \ button is pressed by the user:\n\n```\n// store a default message\nvar msg =\
    \ \"Right-Click Context Menu Is Disabled\";\n// a function to stop the IE context\
    \ menu\nfunction stopmenu(e)\n{\n  // for Internet Explorer browsers\n  if(navigator.appName\
    \ == \"Microsoft Internet Explorer\"\n  && ( event.button == 2 || event.button\
    \ == 3 ))\n{\n    alert( msg );\n    return false;\n  }\n}\n// specify the onmousedown\
    \ event-handler\ndocument.onmousedown = stopmenu;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_148_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_148_1.png)"
  merge: -1
  pgno: 148
- img_proc: true
  md: "# Key down and key up\n\nA KeyDown event occurs when the user presses a keyboard\
    \ button and a KeyError event occurs when it is released. Typically these are\
    \ used together so that a single key depression will use two event-handlers.\n\
    \nThis example swaps an image and changes the value of a text box when a keyboard\
    \ key is pressed but reverts both to their original state when the key button\
    \ is released:\n\n```\n// Netscape/Mozilla capture events instruction\nif (navigator.name\
    \ == \"Netscape\") {\n    window.captureEvents(Event.KEYDOWN, Event.KEYUP);\n\
    }\n\n// a function to react to KEYDOWN events\nfunction isdown() {\n    document.images.bulb.src\
    \ = \"bulbon.gif\";\n    document.forms.f.txt.value = \"Key is Down\";\n}\n\n\
    // a function to react to KEYUP events\nfunction isup() {\n    document.images.bulb.src\
    \ = \"bulffoff.gif\";\n    document.forms.f.txt.value = \"Key is Up\";\n}\n\n\
    // define the event-handlers\ndocument.onkeydown = isdown;\ndocument.onkeyup =\
    \ isup;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_149_0.png)\n\nNotice\
    \ how the first lines of this script capture both KeyDown and KeyUp events for\
    \ Netscape/Mozilla browsers.\n\n![](img/d78298d3338ec680a024bbc83e78b297_149_1.png)\n\
    \n| KeyUp and KeyDown |\n| File | Edit | View | Favorites |\n|---|---|---|---|n|\
    \ | | | |\n| Key is Down |\n\n| KeyUp and KeyDown |\n| File | Edit | View | Favorites\
    \ |\n|---|---|---|---|n| | | | |\n| Key is Up |\n\n48 | JavaScript in easy steps"
