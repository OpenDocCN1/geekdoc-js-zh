    \ to open a pop-up window\nfunction popup() {\n  window.open(\"popup-2.html\"\
    , \"\",\n  \"top=40,left=40,width=250,height=100\");\n}\n\n// set the onload object\n\
    window.onload = popup;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_105_0.png)\n\
    \n> HOT TIP The second argument must be an empty string if no name is being given\
    \ to the pop-up window.\n\n![](img/d78298d3338ec680a024bbc83e78b297_105_1.png)"
  - "[PAGE 106]\n\n# Pop-up features\n\nThe third argument to the window.open() method\
    \ may specify many the features to be included in the new window from the list\
    \ in the following table:\n\n| Feature | Description |\n| --- | --- |\n| directories\
    \ | Adds the links bar |\n| height | Sets the height in pixels of the document\
    \ area |\n| left | The X co-ordinate of the window on the screen |\n| location\
    \ | Adds the address bar |\n| menubar | Adds the standard menu bar |\n| resizable\
    \ | Permits the window to be resized |\n| scrollbars | Enables scrollbars when\
    \ needed |\n| status | Adds the address bar |\n| toolbar | Adds the button bar\
    \ with back & forward buttons |\n| top | The Y co-ordinate of the window on the\
    \ screen |\n| width | Sets the width in pixels of the document area |\n\n![](img/d78298d3338ec680a024bbc83e78b297_106_0.png)\n\
    \nThe dimension features of top, left, width and height need to state a pixel\
    \ value like the example on the facing page. All the other features can have a\
    \ value of yes or no but if the feature appears in the argument a value is assumed\
    \ – so it need to be specified.\n\nFor example, to add a status bar to the code\
    \ on the facing page just requires the addition of status to the features list:\n\
    \n```\n// a function to open a pop-up window with a status bar\npopup1() {\n \
    \ window.open(\"popup-2.html\", \"\",\n  \"top=40,left=40,width=250,height=100,status=\"\
    );\nn}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_106_1.png)"
  - "[PAGE 107]\n\n# Close pop-up\n\nA window can close itself simply by calling the\
    \ window.close() method by closing a pop-up window requires a little more effort.\n\
    \nThe initial call to the window.open() method should be assigned to a variable\
    \ to create a window object. This new object inherits the window.close() method\
    \ which can close the pop-up.\n\nThis example verifies the existence of the pop-up\
    \ window before closing it when the user exits the main window...\n\n```\n// create\
    \ a variable to store a window object\nvar popwindow;\n\n// a function to open\
    \ a pop-up window\nfunction popup() {\n  popwindow = window.open(\"popup-2.html\"\
    , \"\", \"top=40,left=40,width=250,height=100,menubar,status\");\n}\n\n// a function\
    \ to close a pop-up window\nfunction close_popup() {\n  if(popwindow != null )\
    \ popwindow.close();\n}\n\n// set the onload and unload objects\nwindow.onload\
    \ = popup;\nwindow.onunload = close_popup;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_107_0.png)\n\
    \nThis pop-up page is the same as in the example on page 104 - JavaScript has\
    \ added status bar and menu bar features to this window.\n\n![](img/d78298d3338ec680a024bbc83e78b297_107_1.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_107_2.png)\n\nJavaScript in easy steps"
  - "[PAGE 108]\n\n# Get size\n\nIt is sometimes useful to have JavaScript get the\
    \ user's screen resolution with the width and height properties of the window.screen\
    \ object Because a window may not be maximized to the full size it is also helpful\
    \ to determine the actual width of the window.\n\nThe availHeight and availWidth\
    \ properties of window.screen contain the size excluding task bars.\n\nThe Netscape\
    \ and Internet Explorer document object models have different ways of storing\
    \ inner window dimensions so browser-specific scripting is needed.\n\n![](img/d78298d3338ec680a024bbc83e78b297_108_0.png)\n\
    \nIn the example below window dimensions are retrieved by the appropriate object\
    \ for each browser. The function is called by the onload attribute of the HTML\
    \ <body> tag to ensure that the window has been created seeking its dimensions.\n\
    \n```\nfunction get_sizes() {\n  var win_w, win_h, scr_w, scr_h, res, in;\n  if(document.body.clientWidth)\
    \ // IE and Opera\n    win_w = document.body.clientWidth;\n    win_h = document.body.clientHeight;\n\
    \  }\n  else if(window.innerWidth) // Netscape and Mozilla\n    win_w = innerWidth;\
    \ win_h = innerHeight;\n  }\n  scr_w = screen.width; scr_h = screen.height; //\
    \ screen\n  // display the size information\n  res = \"Resolution: \" + scr_w\
    \ + \"x\" + scr_h;\n  in = \"Inner window: \" + win_w + \"x\" + win_h;\n  if(win_w\
    \ == null) alert(res + \"\\n\" + in);\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_108_1.png)\n\
    \nYou can call the window.print() method to print the document in the browser\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_108_2.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_108_3.png)\n\
    \n9. Window properties"
  - "[PAGE 109]\n\n# Frames array\n\nThe window.frames object contains an array of\
    \ all the frames in a window which has been defined in the HTML <frameset> tags.\n\
    \nJavaScript can address these from within any frame using the parent.window.frames[]\
    \ syntax.\n\nIndividual frames can be addressed using their index number in the\
    \ array, or by the value assigned to the name attribute in the HTML <frame> tag.\
    \ So a frame named \"main\" can be addressed from another frame as parent.window.frames[\"\
    main\"], or more simply as parent.window.frames.main.\n\nThe script below is included\
    \ in a HTML document. The total number of frames in that document reads each of\
    \ their names from the parent frame-holder document:\n\n```\n// find the total\
    \ number of frames\nvar framenums = \"No. frames :\"\n    + parent.window.frames.length;\n\
    \n// retrieve the name of each frame\nvar framenames+= \"\\nFrame 1 : \"\n   \
    \ + parent.window.frames[0].name;\nframenames+= \"\\nFrame 2 : \"\n    + parent.window.frames[1].name;\n\
    framenames+= \"\\nFrame 3 : \"\n    + parent.window.frames[2].name;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_109_0.png)\n\
    \n> HOT TIP\nAlways HTML elements to be used by JavaScript to produce code that\
    \ is more comprehensible.\n\n```\nalert( framenums + framenames );\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_109_1.png)\n\
    \n108 | JavaScript in easy steps"
  - "[PAGE 110]\n\n# Frame objects\n\nThe example on the facing page allows access\
    \ to different frames within a framed window and because the browser DOM is hierarchical\
    \ that means that the objects and properties within any frame are also accessible.\n\
    \nThe script can assign values to these object properties and use their methods\
    \ just as with an unframed object.\n\nTypically a navigation frame on the left\
    \ side of the window will have navigation buttons which, when pushed, will assign\
    \ new URL locations to a main frame on the right side of the screen.\n\nThis example\
    \ adds a further function to the code listed on the opposite page. This is called\
    \ from the HTML onclick attribute of the button to write text in the Banner frame\
    \ and to change the location of the Page frame:\n\n![](img/d78298d3338ec680a024bbc83e78b297_110_0.png)\n\
    \n```\nfunction next() {\n  // load another page into the Page frame\n  parent.frames.Page.window.location\
    \ = \"nextpage.html\";\n\n  // write text into the Banner frame\n  parent.frames.Banner.window.document.write(\"\
    Frame 2 - Written by Frame 1\");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_110_1.png)"
  - "[PAGE 111]\n\n# Error handling\n\nA custom error-handling function may be assigned\
    \ to the window.onerror object to deal with runtime errors.\n\nWhen the browser\
    \ meets an error it looks for an error-handler in the script but, if none is found,\
    \ it will handle the error itself by opening the browser error dialog box.\n\n\
    Once the error has been noticed a true value is returned to the browser to indicate\
    \ that the error has been dealt with.\n\n![](img/d78298d3338ec680a024bbc83e78b297_111_0.png)\n\
    \nTo avoid error dialogs a custom error-handler function need only return true\
    \ when an error is encountered.\n\nIdeally the browser will pass three arguments\
    \ to the error-handler containing information on the nature of the error, the\
    \ URL of the file that contains the error, and the actual line number in file\
    \ where the error exists.\n\nIn the example below each piece of error information\
    \ passed to the error-handling function by the browser is displayed for the user:\n\
    \n```\n// declare an error-handling function\nwindow.onerror = errorhandler;\n\
    \n// define the error-handling function\nfunction errorhandler(msg, url, ln) {\n\
    \  alert(\"Error: \"+msg+\\nIn File: \"+url+\\nAt Line: \"+ln);\\n  return true;\
    \ // tell the browser it's been handled\n}\n\n// This is a deliberate mistake\n\
    document.form[theMistake].value = \"myButton\";\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_111_1.png)"
- md: "\n# Document properties\n\nThis chapter illustrates properties and methods\
    \ of the window.document object. Image-swapping rollovers are demonstrated and\
    \ cookies are explained. There is also an overview of how layers are used in JavaScript.\n\
    \n## Covers\n\n- Set colors | 112\n- JavaScript creates | 113\n- Set cookie |\
    \ 114\n- Get cookie | 115\n- Images array | 116\n- Rollover | 117\n- Dynamic content\
    \ | 118\n- Last modified | 119\n- XYZ coordinates | 120\n- Dynamic layers | 121\n\
    - Transparent layers | 122\n\n## Set colors\n\nThe properties and methods of the\
    \ window.document object enable a Web page document to be changed at runtime.\
    \ Using JavaScript to assign new values to properties of the window.document object\
    \ causes the Web browser to update the appearance of the Web page in line with\
    \ the new values.\n\nThe window.part of the address may be omitted as window is\
    \ the top DOM object.\n\nIn this can be simply illustrated by assigning new values\
    \ to the document.bgColor and document.fgColor properties to change the background\
    \ and foreground colors of a page:\n\nIn this example the set_colors() function\
    \ is called from the HTML onclick attribute of the button when the user pushes\
    \ it:\n\n![](img/d78298d3338ec680a024bbc83e78b297_113_0.png)\n\n```javascript\n\
    // a function to set the colors of the page\nfunction set_colors() {\n  window.document.bgColor\
    \ = \"red\";\n  window.document.fgColor = \"yellow\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_113_1.png)\n\
    \n| Set Colors | | | | | |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| File\
    \ | Edit | View | Favorites | Tools | Help |\n| JavaScript in easy steps | | |\
    \ | | |\n| Change Colors | | | | | |\n| Done | Local intranet | | | | |\n\nNotice\
    \ the capitalization of both bgColor and fgColor.\n\n![](img/d78298d3338ec680a024bbc83e78b297_113_2.png)\n\
    \n| Set Colors | | | | | | |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| File\
    \ | Edit | View | Favorites | Tools | Help |\n| JavaScript in easy steps | | |\
    \ | | |\n| Change Colors | | | | | |\n| Done | Local intranet | | | | |\n\n12\
    \ | JavaScript in easy steps\n\n## JavaScript creates\n\nThe write() method of\
    \ the window.document object is a tremendously powerful feature that allows JavaScript\
    \ to create content dynamically when loading a Web page.\n\nThe method takes a\
    \ single string argument containing the content to be written into the page and\
    \ may include HTML tags to format the content.\n\nTypically the document.write()\
    \ method appears within a script in the <body> section of an HTML document and\
    \ will write selected content following a conditional test.\n\n![](img/d78298d3338ec680a024bbc83e78b297_114_0.png)\n\
    \nIt should be noted that calling this method at runtime will cause the specified\
    \ content to be written into a new blank document so replacing the current page.\n\
    \nVariable values may also be concatenated with a string argument in order to\
    \ introduce a variable value into the content of a Web page.\n\nThis example first\
    \ generates a random number tests to determine if the number is odd or even. Selected\
    \ content is added to the page depending on the result of this test:\n\n```javascript\n\
    // get a random integer between 1 - 100\nvar n = Math.ceil(Math.random() * 100);\n\
    // determine whether the number is odd or even\nvar ntype = ( n % 2 == 0 ) ? \"\
    Even\" : \"Odd\";\n// write a description of the number\ndocument.write(\"<h1>Number\
    \ \" +n+\\ \" is \" +ntype+\"</h1>\");\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_114_1.png)\n\
    \n| Write Content |\n| :--- |\n| File Edit View Favorites Tools Help |\n| Number\
    \ 87 is Odd |\n\n## Set cookie\n\nCookies are tiny files that can be written by\
    \ JavaScript to store small amounts of data on the local hard drive. There are\
    \ limitations to the use of cookies that restrict their size to 4 kilobytes and\
    \ Web browsers are not required to retain more than 20 cookies per Web server.\
    \ A typical cookie may often retain user data for access pages or on subsequent\
    \ visits to a website.\n\n![](img/d78298d3338ec680a024bbc83e78b297_115_0.png)\n\
    \nEscape the values to include spaces, commas and semicolons. The cookie data\
    \ is held in the window.document.cookie object as a name=value pair – the value\
    \ may not contain any semicolons, commas or whitespace. Multiple name=value pairs\
    \ may be stored by making further assignments to the document.cookie object.\n\
    \nThe life-span of a cookie is limited to the length of the browser session unless\
    \ an expiry date is specified when the cookie is first set.\n\nExpiration is assigned\
    \ to a key named expires by amending the Date object to the desired future date.\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_115_1.png)\n\nA cookie may be deleted\
    \ by setting an expiry date before the real date. Dates of expiry should be expressed\
    \ in GMT format by converting the Date object using Date.toGMTString().\n\nThe\
    \ calculation in the example below multiplies the days, hours, minutes and milliseconds\
    \ to increment a Date object by 1 week.\n\nThis example stores the user’s name\
    \ and account number in a cookie with a life-span of 7 days:\n\n![](img/d78298d3338ec680a024bbc83e78b297_115_2.png)\n\
    \n```javascript\n// the data to be stored in the cookie\nvar user_account = \"\
    Mike McGrath, 00456\";\n\n// create a new Date\nvar expiry = new Date();\n\n//\
    \ set the expiry for 7 days\nexpiry.setTime(expiry.getTime() + (7*24*60*60*1000));\n\
    \n// create the cookie\ndocument.cookie = \"cookieata=\"+escape(user_account)+\"\
    expires=\"+expiry.toGMTString()+\";\n```\nset-cookie.js\n\n## Get cookie\n\nIf\
    \ a cookie is set the document.cookie object will return true so JavaScript can\
    \ test for the presence of cookies. When a cookie is located the document.cookie\
    \ object returns the stored string. Parts of the data may be retrieved from the\
    \ stored string using the string manipulation methods covered earlier.\n\nWhen\
    \ the script below runs it seeks the cookie set by the previous example, then\
    \ it extracts the data values to write customized content:\n\n![](img/d78298d3338ec680a024bbc83e78b297_116_0.png)\n\
    \n```javascript\n// find any cookies\nif (document.cookie) {\n  // unescape the\
    \ cookie data\n  var cookieata = unescape(document.cookie);\n  // split the name=value\
    \ pairs\n  var userdata = cookieata.split(\"=\");\n  // if the cookie is called\
    \ cookieata\n  if (userdata[0] == \"cookieata\") {\n    // split the comma delimited\
    \ values\n    var data = userdata[1].split(\",\");\n    var username = data[0];\n\
    \    var useracct = data[1];\n  }\n  // write out the data retrieved from the\
    \ cookie\n  document.write(\"Welcome \" + username + \"<br/>\");\n  document.write(\"\
    Account number: \" + useracct + \".\");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_116_1.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_116_2.png)\n\n| Get Cookie | | | |\
    \ | |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| File | Edit | View | Favorites\
    \ | Tools | Help |\n| Welcome Mike McGrath | | | | | |\n| Account number: 00456.\
    \ | | | | | |\n| Done | Local intranet | | | | |\n\n## Images array\n\nThe window.document.images[]\
    \ object is an array of all image objects contained within a Web page – in the\
    \ order in which the HTML code added them to the page. So the first listed image\
    \ is allocated to the first array element and can be addressed as document.images[0].\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_117_0.png)\n\nAlways give images a\
    \ name with the HTML id. In this example the name assigned to the HTML id attribute\
    \ and the src URL can be accessed for each image along with the total length of\
    \ the document.images:\n\n![](img/d78298d3338ec680a024bbc83e78b297_117_1.png)\n\
    \nThe images array elements are only available after the browser has loaded the\
    \ page.\n\n![](img/d78298d3338ec680a024bbc83e78b297_117_2.png)\n\n```javascript\n\
    // a function to get images information\nfunction image_info() {\n  var msg =\
    \ \"Total Images : \" + document.images.length;\n  msg += \"\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_117_3.png)\n\
    \nimages.js\n\n![](img/d78298d3338ec680a024bbc83e78b297_117_4.png)\n\nThis example\
    \ assumes these images appear in the HTML code sequentially from left to right\
    \ – but this may always be the case.\n\n![](img/d78298d3338ec680a024bbc83e78b297_117_5.png)\n\
    \n116 | JavaScript in easy steps\n\n## Rollover\n\nIf an image has been named\
    \ in the HTML code, assigning a value to the <img> tag's id attribute, it may\
    \ also be addressed by this name in JavaScript. The syntax is document.images.imgname\
    \ – so an image click is addressed as document.images.click.\n\nAssigning a new\
    \ value to the src property of an image causes the browser to replace the image.\
    \ Typically this is seen in rollovers – when the cursor is over an image it is\
    \ replaced by a second image, the original image is returned when the cursor moves\
    \ away. The <img> tag must include an onmouseover attribute and an onmouseout\
    \ attribute to create a rollover effect, like:\n\n```html\n<img id=\"click\" src=\"\
    off.gif\" alt=\"\"\n  onmouseover=\"swap(1)\" onmouseout=\"swap(0)\" />\n```\n\
    \nThese attributes call the JavaScript image-swapping function whenever the onmouseover\
    \ or onmouseout events occur:\n\n![](img/d78298d3338ec680a024bbc83e78b297_118_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_118_1.png)\n\n```javascript\nfunction\
    \ swap(n) {\n  if (n == 0)document.images.click.src = \"off.gif\";\n  if (n ==\
    \ 1)document.images.click.src = \"over.gif\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_118_2.png)\n\
    \n| Rollover Example | | | | | | |\n| :--- | :--- | :--- | :--- | :--- | :---\
    \ |\n| File | Edit | View | Favorites | Tools | Help |\n| Click Here | | | | |\
    \ | |\n| Done | Local intranet | | | | | |\n\n| Rollover Example | | | | | | |\n\
    | :--- | :--- | :--- | :--- | :--- | :--- |\n| File | Edit | View | Favorites\
    \ | Tools | Help |\n| Click Here | | | | | | |\n| Done | Local intranet | | |\
    \ | |\n"
  mdcn: "\n\n# 文档属性\n\n本章说明了 `window.document` 对象的属性和方法。文中演示了图像切换滚动效果（rollovers）并解释了\
    \ cookie。此外还概述了如何在 JavaScript 中使用图层。\n\n## 目录\n\n- 设置颜色 | 112\n- JavaScript 创建\
    \ | 113\n- 设置 cookie | 114\n- 获取 cookie | 115\n- 图像数组 | 116\n- 滚动效果 | 117\n- 动态内容\
    \ | 118\n- 最后修改时间 | 119\n- XYZ 坐标 | 120\n- 动态图层 | 121\n- 透明图层 | 122\n\n## 设置颜色\n\
    \n`window.document` 对象的属性和方法允许在运行时更改 Web 页面文档。使用 JavaScript 为 `window.document`\
    \ 对象的属性分配新值，会导致 Web 浏览器根据新值更新 Web 页面的外观。\n\n地址中的 `window.part` 可以省略，因为 `window`\
    \ 是顶层 DOM 对象。\n\n这可以通过给 `document.bgColor` 和 `document.fgColor` 属性分配新值来简单演示，从而更改页面的背景和前景颜色：\n\
    \n在此示例中，当用户点击按钮时，会从 HTML 的 `onclick` 属性调用 `set_colors()` 函数：\n\n![](img/d78298d3338ec680a024bbc83e78b297_113_0.png)\n\
    \n```javascript\n// 一个设置页面颜色的函数\nfunction set_colors() {\n  window.document.bgColor\
    \ = \"red\";\n  window.document.fgColor = \"yellow\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_113_1.png)\n\
    \n| 设置颜色 | | | | | | |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 文件 | 编辑\
    \ | 视图 | 收藏 | 工具 | 帮助 |\n| JavaScript 快速入门 | | | | | | |\n| 更改颜色 | | | | | | |\n\
    | 完成 | 本地局域网 | | | | | |\n\n注意 `bgColor` 和 `fgColor` 的大小写。\n\n![](img/d78298d3338ec680a024bbc83e78b297_113_2.png)\n\
    \n| 设置颜色 | | | | | | | |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n\
    | 文件 | 编辑 | 视图 | 收藏 | 工具 | 帮助 |\n| JavaScript 快速入门 | | | | | | |\n| 更改颜色 | | |\
    \ | | | |\n| 完成 | 本地局域网 | | | | | |\n\n12 | JavaScript 快速入门\n\n## JavaScript 创建\n\
    \n`window.document` 对象的 `write()` 方法是一个极其强大的功能，允许 JavaScript 在加载 Web 页面时动态创建内容。\n\
    \n该方法接受一个字符串参数，包含要写入页的内容，并可以包含用于格式化内容的 HTML 标签。\n\n通常，`document.write()` 方法出现在\
    \ HTML 文档 `<body>` 部分的脚本中，并在通过条件测试后写入选定的内容。\n\n![](img/d78298d3338ec680a024bbc83e78b297_114_0.png)\n\
    \n应该注意的是，在运行时调用此方法会导致指定的内容写入一个新的空白文档，从而替换当前页面。\n\n变量值也可以与字符串参数拼接，以便将变量值引入 Web\
    \ 页面的内容中。\n\n此示例首先生成一个随机数测试，以确定该数字是奇数还是偶数。根据测试结果将选定的内容添加到页面：\n\n```javascript\n\
    // 获取 1 - 100 之间的随机整数\nvar n = Math.ceil(Math.random() * 100);\n// 判断数字是奇数还是偶数\n\
    var ntype = ( n % 2 == 0 ) ? \"Even\" : \"Odd\";\n// 写入数字的描述\ndocument.write(\"\
    <h1>Number \" +n+\\ \" is \" +ntype+\"</h1>\");\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_114_1.png)\n\
    \n| 写入内容 |\n| :--- |\n| 文件 编辑 视图 收藏 工具 帮助 |\n| 数字 87 是奇数 |\n\n## 设置 cookie\n\n\
    Cookies 是微小文件，可以通过 JavaScript 写入，以便在本地硬盘上存储少量数据。Cookie 的使用具有限制，将其大小限制在 4 千字节，且\
    \ Web 浏览器不被要求为每个 Web 服务器保留超过 20 个 cookie。典型的 cookie 经常可以保留用户访问页面或后续访问网站时的用户数据。\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_115_0.png)\n\n对值进行转义以包含空格、逗号和分号。cookie\
    \ 数据以 `name=value` 对的形式存储在 `window.document.cookie` 对象中——通过对 `document.cookie`\
    \ 对象进行进一步赋值，可以存储多个 `name=value` 对。\n\ncookie 的寿命受限于浏览器会话长度，除非在首次设置 cookie 时指定了过期日期。\n\
    \n通过修改 `Date` 对象到指定的未来日期，可以为名为 `expires` 的键分配过期时间。\n\n![](img/d78298d3338ec680a024bbc83e78b297_115_1.png)\n\
    \n可以通过设置早于过期日期来删除 cookie。过期日期应通过 `Date.toGMTString()` 以 GMT 格式表示。\n\n下方示例中的计算通过将天、小时、分钟和毫秒乘以\
    \ `Date` 对象增加了一周。\n\n此示例将用户的姓名和账号存储在有效期为 7 天的 cookie 中：\n\n![](img/d78298d3338ec680a024bbc83e78b297_115_2.png)\n\
    \n```javascript\n// 存储在 cookie 中的数据\nvar user_account = \"Mike McGrath, 00456\"\
    ;\n\n// 创建日期\nvar expiry = new Date();\n\n// 设置 7 天后过期\nexpiry.setTime(expiry.getTime()\
    \ + (7*24*60*60*1000));\n\n// 创建 cookie\ndocument.cookie = \"cookieata=\"+escape(user_account)+\"\
    expires=\"+expiry.toGMTString()+\";\n```\nset-cookie.js\n\n## 获取 cookie\n\n如果设置了\
    \ cookie，`document.cookie` 对象将返回 true，因此 JavaScript 可以测试 cookie 是否存在。当找到 cookie\
    \ 时，`document.cookie` 对象返回存储的字符串。可以使用字符串处理方法从字符串中获取数据。\n\n当下面的脚本运行时，它寻找上一个示例设置的\
    \ cookie，然后提取数据写入自定义内容：\n\n![](img/d78298d3338ec680a024bbc83e78b297_116_0.png)\n\
    \n```javascript\n// 查找任何 cookie\nif (document.cookie) {\n  // 转义 cookie 数据\n \
    \ var cookieata = unescape(document.cookie);\n  // 分割 name=value 对\n  var userdata\
    \ = cookieata.split(\"=\");\n  // 如果 cookie 是 cookieata\n  if (userdata[0] ==\
    \ \"cookieata\") {\n    // 按逗号分割值\n    var data = userdata[1].split(\",\");\n\
    \    var username = data[0];\n    var useracct = data[1];\n  }\n  // 写入从 cookie\
    \ 获取的数据\n  document.write(\"Welcome \" + username + \"<br/>\");\n  document.write(\"\
    Account number: \" + useracct + \".\");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_116_1.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_116_2.png)\n\n| 获取 Cookie | | | | |\
    \ |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 文件 | 编辑 | 视图 | 收藏 | 工具 | 帮助\
    \ |\n| 欢迎 Mike McGrath | | | | | |\n| 账号: 00456. | | | | | |\n| 完成 | 本地局域网 | |\
    \ | | |\n\n## 图像数组\n\n`window.document.images[]` 对象是 Web 页内所有图像对象的数组——按照 HTML\
    \ 代码将它们添加到页面的顺序。因此，列表出的图像分配给数组第一个元素，可以通过 `document.images[0]` 访问。\n\n![](img/d78298d3338ec680a024bbc83e78b297_117_0.png)\n\
    \n始终为图像提供一个 HTML id 名称。在此示例中，可以访问每个图像分配给 HTML id 属性的名称和 `src` URL，以及 `document.images`\
    \ 的总长度：\n\n![](img/d78298d3338ec680a024bbc83e78b297_117_1.png)\n\n图像数组元素仅在浏览器加载页面后可用。\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_117_2.png)\n\n```javascript\n// 获取图像信息的函数\n\
    function image_info() {\n  var msg = \"Total Images : \" + document.images.length;\n\
    \  msg += \"\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_117_3.png)\n\
    \nimages.js\n\n![](img/d78298d3338ec680a024bbc83e78b297_117_4.png)\n\n此示例假设这些图像在\
    \ HTML 代码中从左到右顺序出现——但情况可能总是如此。\n\n![](img/d78298d3338ec680a024bbc83e78b297_117_5.png)\n\
    \n116 | JavaScript 快速入门\n\n## 滚动效果\n\n如果图像在 HTML 代码中已命名（通过给 `<img>` 标签的 `id` 属性赋值），则在\
    \ JavaScript 中也可以通过此名称访问。语法为 `document.images.imgname` —— 因此图像点击被访问为 `document.images.click`。\n\
    \n为图像的 `src` 属性分配新值会导致浏览器替换图像。这通常出现在滚动效果中——当鼠标悬停在图像上时，它会被第二张图像替换；当移开时返回原始图像。`<img>`\
    \ 标签必须包含 `onmouseover` 属性和 `onmouseout` 属性来创建滚动效果，例如：\n\n```html\n<img id=\"click\"\
    \ src=\"off.gif\" alt=\"\"\n  onmouseover=\"swap(1)\" onmouseout=\"swap(0)\" />\n\
    ```\n\n这些属性每当 `onmouseover` 或 `onmouseout` 事件发生时调用 JavaScript 图像切换函数：\n\n![](img/d78298d3338ec680a024bbc83e78b297_118_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_118_1.png)\n\n```javascript\nfunction\
    \ swap(n) {\n  if (n == 0)document.images.click.src = \"off.gif\";\n  if (n ==\
    \ 1)document.images.click.src = \"over.gif\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_118_2.png)\n\
    \n| 滚动效果 | | | | | | |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 文件 | 编辑\
    \ | 视图 | 收藏 | 工具 | 帮助 |\n| 欢迎 Mike McGrath | | | | | | |\n| 账号: 00456. | | | |\
    \ | | |\n| 完成 | 本地局域网 | | | | | |\n\n"
