  md: "# Checkboxes\n\nUnlike radio buttons a checkbox operates independently from\
    \ other checkboxes and so all checkboxes should be uniquely named by their name\
    \ attribute in the HTML code.\n\nEach checkbox creates a document.form object\
    \ with its given name and, like a radio button, has a checked property.\n\nIn\
    \ the following example the HTML onclick attribute calls the JavaScript function\
    \ that sets the checked property of three checkboxes:\n\n![](img/d78298d3338ec680a024bbc83e78b297_133_0.png)\n\
    \n```\n// a function to check three checkboxes\nfunction checkall() {\n // in\
    \ the form named f\nwith(document.forms){\n // check checkboxes named chk1, chk2\
    \ and chk3\nchk1.checked = true;\nchk2.checked = true;\nchk3.checked = true;\n\
    }}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_133_1.png)\n\nOnly those checkboxes\
    \ that are checked will have their name=valuenpairs sent to the server on submission\
    \ of the form.\n\n![](img/d78298d3338ec680a024bbc83e78b297_133_2.png)"
  merge: -1
  pgno: 133
