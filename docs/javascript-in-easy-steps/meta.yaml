  md: '# Confirm


    The alert() function that is used extensively in the code examples given throughout
    this book is actually a method of the top-level window object, so may be correctly
    addressed as window.alert().


    The window.confirm() method is the first of two other window methods that produce
    dialog boxes when called.


    It is used to get user confirmation from a dialog box containing an OK button
    that returns true to the script and a Cancel button that returns false to the
    script.


    A single argument should be passed to the method as a text string containing the
    question for the user to confirm.


    This example demonstrates the window.confirm() method performing conditional branching
    to determine which message string to write – depending upon which button the user
    pushes in the dialog box:


    ```

    // create a variable to store a dialog response

    var ask = confirm("Do you wish to proceed ?");

    ```


    ```

    // create a variable to store a reply

    var msg;

    ```


    ```

    // assign an appropriate reply message

    if(ask) msg = "OK button was pushed";

    else msg = "Cancel button was pushed";

    ```


    ```

    // display the reply message

    document.write(msg );

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_99_0.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_99_1.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_99_2.png)'
