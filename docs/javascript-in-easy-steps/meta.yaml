    \  // relocate the browser if the input is correct\n  if (entry == \"admin\")\
    \    window.location = \"page1.html\";\n  else {\n    // display a message if\
    \ the input is incorrect\n    alert(\"Password incorrect - Please retry...\");\n\
    \    document.forms.f.pwd1.value = \"\";\n  }\n}\n```\n\nThe final line in this\
    \ script will clear the password box after the user clicks the alert **OK** button,\
    \ to be ready for another entry.\n\n| Password Field |\n| File | Edit | View |\
    \ Favorites | Tools | Help |\n|---|---|---|---|---|---||\n| | | | | | Validate\
    \ |\n| Microsoft Internet Explorer Password incorrect - Please retry... OK |\n\
    | Done | Local intranet |"
  - "[PAGE 131]\n\n# Radio buttons\n\nA group of radio buttons that will only allow\
    \ one of the group to be checked at any time should all have the same name assigned\
    \ to their name attribute in the HTML <input> tag.\n\nIn the browser DOM the radio\
    \ button group creates a document.form object with that given name.\n\nThis object\
    \ contains an array of all the radio buttons in the group, indexed in the order\
    \ in which they appear in the HTML code.\n\nJavaScript can address each radio\
    \ button using the array name and index number. In the example below JavaScript\
    \ checks the second radio button displays both radio values in a text box:\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_131_0.png)\n\n```\n// a function to get\
    \ radio group information\nfunction radio_info() {\n  // select the second radio\
    \ button\n  document.forms.f.radl[1].checked = true;\n\n  // get both radio values\n\
    \  var msg = \"1st Radio Value: \"\n  + document.forms.f.radl[0].value;\n  msg\
    \ += \" 2nd Radio Value: \"\n  + document.forms.f.radl[1].value = msg;\n}\n```\n\
    \nOnly checked radio buttons have their name=value pair sent when the form is\
    \ submitted.\n\n![](img/d78298d3338ec680a024bbc83e78b297_131_1.png)\n\n| Radio\
    \ Buttons |\n| File Edit View Favorites Tools Help |\n| 1st Radio Value: Coffee\
    \ 2nd Radio Value, Tea |\n| [ Get Radio Info ] |\n| Done Local intranet |"
  - "[PAGE 132]\n\n# # Radio polling\n\nThe important feature of a radio button is\
    \ whether it is checked or not. This can be ascertained from the radio button's\
    \ **checked** property that will return a boolean **true** if the radio is checked\
    \ or a boolean **false** if it is unchecked.\n\nJavaScript can loop through all\
    \ the radio button array elements to test for a **true checked** property, then\
    \ use the value assigned to the radio button that is checked.\n\nIn the example\
    \ below the function is called from the HTML **onclick** attribute of the push\
    \ button form `<input>`. This loops through the elements of the radio button array\
    \ to discover which button, if any, is checked. When a button has been checked\
    \ its associated value is used by the script to apply a new background color to\
    \ the page.\n\n```\n// a function to discover which radio button is selected\n\
    function radio_poll() {\n  // loop through all radio buttons\n  for(var i=0; i\
    \ < document.forms.frad.length; i++) {\n    // if the radio is selected, use its\
    \ value\n    if(document.forms.frad[i].checked ) {\n      document.bgColor=document.forms.frad[i].value;\n\
    \    }\n  }\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_132_0.png)\n\n\
    > In JavaScript `((checked))` is shorthand for `((checked==true))`\n\n![](img/d78298d3338ec680a024bbc83e78b297_132_1.png)"
- md: "\n## Checkboxes\n\nUnlike radio buttons a checkbox operates independently from\
    \ other checkboxes and so all checkboxes should be uniquely named by their name\
    \ attribute in the HTML code.\n\nEach checkbox creates a document.form object\
    \ with its given name and, like a radio button, has a checked property.\n\nIn\
    \ the following example the HTML onclick attribute calls the JavaScript function\
    \ that sets the checked property of three checkboxes:\n\n![](img/d78298d3338ec680a024bbc83e78b297_133_0.png)\n\
    \n```javascript\n// a function to check three checkboxes\nfunction checkall()\
    \ {\n // in the form named f\n  with(document.forms){\n     // check checkboxes\
    \ named chk1, chk2 and chk3\n    chk1.checked = true;\n    chk2.checked = true;\n\
    \    chk3.checked = true;\n  }\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_133_1.png)\n\
    \nOnly those checkboxes that are checked will have their name=value pairs sent\
    \ to the server on submission of the form.\n\n![](img/d78298d3338ec680a024bbc83e78b297_133_2.png)\n\
    \n## Checkbox polling\n\nThe checked property of a checkbox object is most important\
    \ and JavaScript may test for checked checkboxes then use their associated values.\n\
    \nThe example below tests the checked property of all checkboxes and assigns the\
    \ value of those that are checked to a string variable for display in an alert()\
    \ dialog box:\n\n```javascript\n// a function to discover which checkboxes are\
    \ selected\nfunction checkbox_poll() {\n  // create a string for the results\n\
    \  var str = \"Color choice is \";\n\n  // loop through all checkboxes\n  for(\
    \ var i=1; i<4; i++) {\n    // if the checkbox is selected, add its value\n  \
    \  if(eval(\"document.forms.f.chk\"+i+\".checked\"))\n      str += eval(\"document.forms.f.chk\"\
    +i+\".value\");\n  }\n  // display the results\n  alert(str);\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_134_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_134_1.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_134_2.png)\n\
    \n## Option lists\n\nThe <option> items in a HTML <select> list have a text property\
    \ for each displayed string label and an associated value property. These are\
    \ equivalent to the HTML name and value attributes of each <option> element in\
    \ the <select> list.\n\nThis name=value pair is sent to the server when the form\
    \ is submitted.\n\nAll menu items are stored in the <select> object's options[]\
    \ array and both the text name label and its associated value may be dynamically\
    \ written by JavaScript.\n\nThis example dynamically sets the label name and the\
    \ associated value of three option items in a drop-down list. The form has the\
    \ simple id of f and the <select> element has the id of menu.\n\n![](img/d78298d3338ec680a024bbc83e78b297_135_0.png)\n\
    \n```javascript\n// a function to set the name and values of list options\nfunction\
    \ set_options() {\n  with(document.forms.f.menu) {\n    options[0].text = \"One\"\
    ; options[0].value = \"1\";\n    options[1].text = \"Two\"; options[1].value =\
    \ \"2\";\n    options[2].text = \"Three\"; options[2].value = \"3\";\n  }\n}\n\
    ```\n\nThe [options] elements must be initially created by the HTML code.\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_135_1.png)\n\n| Options |\n| --- |\n\
    | One |\n| Two |\n| Three |\n\n## Selected index\n\nAn options[] array has a property\
    \ called selectedIndex that contains the index number of the item currently selected.\n\
    \nJavaScript can most retrieve the value of the current selection for dynamic\
    \ effects.\n\nThis extracts the value of the current selection for display in\
    \ a text box. The form has the id of f and the <select> element has the id of\
    \ city. The function is called by the onclick attribute of the button when the\
    \ user clicks it.\n\n![](img/d78298d3338ec680a024bbc83e78b297_136_0.png)\n\n```javascript\n\
    // a function to get the selected item in a list\nfunction get_selected() {\n\
    \  // a variable to store the selected index number\n  var pick = document.forms.f.city.selectedIndex;\n\
    \n  // assign the value of the selected element\n  // to a text field with the\
    \ id of txt1\n  document.forms.f.txt1.value =\n    document.forms.f.city.options[pick].value;\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_136_1.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_136_2.png)\n\
    \n## Text areas\n\nA HTML <textarea> element is rather like a large scrolling\
    \ text box whose value can be read and written by JavaScript.\n\nThe example below\
    \ writes content to a text area by assigning a string to its value property when\
    \ the document is loaded.\n\nThe function to assign the string is designated as\
    \ the document’s onload event handler by the script.\n\nCare is needed when using\
    \ this approach – if the script is included in the <head> section of the HTML\
    \ document an onload attribute in the <body> tag may overwrite it.\n\n```javascript\n\
    // a function to write text content in a text area\nfunction write_text() {\n\
    \    // assign a string to the textarea field\n    document.forms.f.textarea.value\
    \ = \"This is some text content.\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_137_0.png)\n"
  mdcn: "\n\n## 复选框\n\n与单选按钮不同，复选框的操作与其他复选框独立，因此所有复选框都应该通过其 HTML 代码中的 `name` 属性进行唯一命名。\n\
    \n每个复选框都会创建一个带有给定名称的 `document.form` 对象，并且像单选按钮一样具有一个 `checked` 属性。\n\n在下面的示例中，HTML\
    \ 的 `onclick` 属性调用了 JavaScript 函数来设置三个复选框的 `checked` 属性：\n\n![](img/d78298d3338ec680a024bbc83e78b297_133_0.png)\n\
    \n```javascript\n// 选中三个复选框的函数\nfunction checkall() {\n // 在名称为 f 的表单中\n  with(document.forms){\n\
    \     // 选中名为 chk1, chk2 和 chk3 的复选框\n    chk1.checked = true;\n    chk2.checked\
    \ = true;\n    chk3.checked = true;\n  }\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_133_1.png)\n\
    \n只有被选中的复选框，其 `name=value` 对才会在提交表单时发送到服务器。\n\n![](img/d78298d3338ec680a024bbc83e78b297_133_2.png)\n\
    \n## 复选框轮\n\n复选框对象的 `checked` 属性最重要的，JavaScript 可能会测试被选中的复选框，然后使用它们关联的值。\n\n下面的示例测试所有复选框的\
    \ `checked` 属性，并将选中的值赋值给字符串变量，以便在 `alert()` 对话框中显示：\n\n```javascript\n// 发现哪些复选框被选中的函数\n\
    function checkbox_poll() {\n  // 创建用于结果的字符串\n  var str = \"颜色选择是 \";\n\n  // 遍历所有复选框\n\
    \  for( var i=1; i<4; i++) {\n    // 如果复选框被选中，则添加它的值\n    if(eval(\"document.forms.f.chk\"\
    +i+\".checked\"))\n      str += eval(\"document.forms.f.chk\"+i+\".value\");\n\
    \  }\n  // 显示结果\n  alert(str);\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_134_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_134_1.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_134_2.png)\n\
    \n## 选项列表\n\nHTML `<select>` 列表中的 `<option>` 项目具有用于每个显示字符串标签的 `text` 属性，以及一个关联的\
    \ `value` 属性。这些等同于 `<select>` 列表中每个 `<option>` 元素的 HTML `name` 和 `value` 属性。\n\
    \n当提交表单时，这个 `name=value` 对会被发送到服务器。\n\n所有的菜单项都存储在 `<select>` 对象的 `options[]` 数组中，文本名称标签及其关联的值都可以由\
    \ JavaScript 动态写入。\n\n此示例动态设置了下拉列表中三个选项项目的标签名称和关联值。表单具有简单的 id `f`，`<select>` 元素具有\
    \ id `menu`。\n\n![](img/d78298d3338ec680a024bbc83e78b297_135_0.png)\n\n```javascript\n\
    // 设置列表选项名称和值的函数\nfunction set_options() {\n  with(document.forms.f.menu) {\n\
    \    options[0].text = \"One\"; options[0].value = \"1\";\n    options[1].text\
    \ = \"Two\"; options[1].value = \"2\";\n    options[2].text = \"Three\"; options[2].value\
    \ = \"3\";\n  }\n}\n```\n\n`[options]` 元素必须由 HTML 代码初始创建。\n\n![](img/d78298d3338ec680a024bbc83e78b297_135_1.png)\n\
    \n| Options |\n| --- |\n| One |\n| Two |\n| Three |\n\n##  索引\n\n`options[]` 数组具有一个名为\
    \ `selectedIndex` 的属性，它包含当前选中项目的索引数字。\n\nJavaScript 经常获取当前选择的值以实现动态效果。\n\n这提取当前选择的值并显示在文本框中。表单具有\
    \ id `f`，`<select>` 元素具有 id `city`。该函数在用户点击按钮时通过按钮的 `onclick` 属性被调用。\n\n![](img/d78298d3338ec680a024bbc83e78b297_136_0.png)\n\
    \n```javascript\n// 获取列表中选中项目的函数\nfunction get_selected() {\n  // 用于存储选中索引数字的变量\n\
    \  var pick = document.forms.f.city.selectedIndex;\n\n  // 将选中元素的值赋值\n  // 给 id\
    \ 为 txt1 的文本字段\n  document.forms.f.txt1.value =\n    document.forms.f.city.options[pick].value;\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_136_1.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_136_2.png)\n\
    \n## 文本区域\n\nHTML `<textarea>` 元素类似于一个大型滚动文本框，其值可以通过 JavaScript 读取和写入。\n\n下面的示例在文档加载时通过向其\
    \ `value` 属性赋值字符串向文本区域写入内容。\n\n赋值字符串的函数被脚本指定为文档的 `onload` 事件处理器。\n\n使用这种方法时需要小心——如果脚本包含在\
    \ HTML 文档的 `<head>` 部分，`<body>` 标签中的 `onload` 属性可能会覆盖它。\n\n```javascript\n// 在文本区域写入文本内容的函数\n\
    function write_text() {\n    // 给文本区域字段赋值字符串\n    document.forms.f.textarea.value\
    \ = \"This is some text content.\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_137_0.png)\n\
    \n"
