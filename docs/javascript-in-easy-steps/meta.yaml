  md: '# Transparent layers


    Unless specified otherwise, a layer will usually be created with the same background
    as the document body – so will appear to be transparent. Alternatively it can
    be explicitly set to be transparent by setting its background-color property to
    transparent.


    The transparency of layers is particularly important when they contain GIF images
    of irregular shapes that have transparent parts. On a transparent layer these
    images appear to simply float over the document background. Several images can
    appear in proximity, even when their layers overlap, by allocating their z-index
    values to determine their stacking order.


    The script below creates two layers – but only one is transparent to illustrate
    the difference in how each image appears.


    ```

    // create a transparent_layer

    document.write("<div id=''transparent-layer''

    style=''position: absolute; top:20px; left:230px;

    width:75px; height:110px; background-color:transparent><img src=''deedee.gif''
    alt=''''></div>")


    // create a white layer

    document.write("<div id=''transparent-layer''

    style=''position: absolute; top:20px; left:315px;

    width:75px; height:110px; background-color:white''><img src=''deedee.gif'' alt=''''>")

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_123_0.png)


    The image used in this example is in the GIF format and has its green color set
    to this: The image actually looks like this:


    ![](img/d78298d3338ec680a024bbc83e78b297_123_1.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_123_2.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_123_3.png)


