  md: '# Plugins information



    On Netscape/Mozilla browsers JavaScript can be used to discover information about
    any plugins that are installed in the browser with the **navigator.plugins** array.


    Each plugin that is installed in a Netscape/Mozilla browser is added as an element
    in the **navigator.plugins** array. For instance, if the Macromedia Shockwave
    plugin is installed there is a **navigator.plugins["Shockwave Flash"]** element.


    The plugin element has a **name** property, storing the name and version of this
    plugin, and a **description** property that contains information about the plugin.


    In the following example the JavaScript code first checks that the **navigator.appName**
    is Netscape before displaying the **name** and **description** of the first plugin
    in the **navigator.plugins** array:


    ```

    // for Netscape/Mozilla browsers only

    if(navigator.appName == "Netscape") {

    // for the first plugin element

    with(navigator.plugins[0]) {

    // display its name and description

    document.write("<html>") +name+ "</html>";

    document.write("<p>" +description+ "</p>");

    }

    ```


