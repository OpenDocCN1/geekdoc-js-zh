  - "[PAGE 36]\n\n# # The switch statement\n\nConditional branching using the if-else\
    \ statement may be more efficiently performed using a switch statement when a\
    \ test expression evaluates the value of just one variable.\n\nThe switch statement\
    \ works in an unusual way – first it evaluates a given expression, then it seeks\
    \ a label to match the resulting value. The code associated with the label will\
    \ be executed, or if no match is made, the switch statement will execute any default\
    \ code.\n\nThe JavaScript case keyword is used to denote a label and the default\
    \ keyword denotes the default code.\n\nAll label code must be terminated by a\
    \ break statement using the JavaScript break keyword.\n\nThe labels may be numbers,\
    \ strings, or booleans but must all be of the same type, like in this example\
    \ that uses number types:\n\n![](img/d78298d3338ec680a024bbc83e78b297_36_0.png)\n\
    \nFor more detail on the break statement see page 40.\n\n```\nvar num = 2;\n\n\
    switch(num) {\n  // is the number 1 ?n  case 1 : alert(\"This is case 1\"); break;\n\
    \n  // is the number 2 ?n  case 2 : alert(\"This is case 2\"); break;\n\n  //\
    \ is the number 3 ?n  case 3 : alert(\"This is case 3\"); break;\n\n  // if none\
    \ of those numbers do this...\n  default : alert(\"This is default code\");\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_36_1.png)\n\nswitch.js\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_36_2.png)\n\nOmitting the ending break\
    \ keywords will allow execution of all other code in the switch statement.\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_36_3.png)\n\n3. Making statements | 35"
  - "[PAGE 37]\n\n# For loops\n\nThe for loop is probably the most frequently used\
    \ type of loop in JavaScript and has this syntax:\n\n```\nfor ( initializer ,\
    \ test , increment ) statements;\n```\n\nThe initializer is used to set the start\
    \ value for the counter of the number of loop iterations. A variable may be declared\
    \ here for this purpose and it is traditional to name it i.\n\nAt each pass of\
    \ the loop a boolean condition is tested and the next iteration of the loop will\
    \ only run if the condition returns true. If the test returns false then the loop\
    \ will end.\n\nWith every iteration the counter is incremented then the loop will\
    \ execute the code in the statement. Multiple statements can be executed if they\
    \ are contained by curly braces in a statement.\n\nThe following example makes\
    \ five iterations and changes the assigned value of two variables at each pass:\n\
    \n```\nvar a = 0, b = 0;\n// initialize counter at zero then loop until it hits\
    \ 5\nfor ( var i = 0; i < 5; i++) {\n  // increment variable values on each iteration\n\
    \  a += 10; b += 5;\n}\n// display the final values after the loop ends\nalert(\"\
    FOR LOOP\\nA is \" + a + \"... B is \" + b);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_37_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_37_1.png)\n\nA loop can also count\
    \ down -- decrementing the counter at each iteration.\n\n![](img/d78298d3338ec680a024bbc83e78b297_37_2.png)"
  - "[PAGE 38]\n\n# The for - in loop\n\nThe for-in loop has a special use to enumerate\
    \ all the variables or properties contained within an object.\n\nThis loop is\
    \ seldom in regular JavaScript but is included here because it can reveal the\
    \ properties available for manipulation within a Web browser.\n\nThe following\
    \ example reveals a tantalizing glimpse of the properties available within the\
    \ window object of the Microsoft Internet Explorer 6.0 Web browser:\n\n```\nvar\
    \ i = 0; a = \"\";\n\n// list all properties in a variable\nfor ( property in\
    \ window ) {\n  a += property + \"...\";\n}\n\n// display the window properties\
    \ list\nalert( a );\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_38_0.png)\n\
    \nThe properties revealed will vary for each browser and version.\n\n![](img/d78298d3338ec680a024bbc83e78b297_38_1.png)\n\
    \nThe properties revealed with this script are part of the Document Object Model\
    \ (DOM) that is described in chapter 8.\n\n| Microsoft Internet Explorer |nonbeforeonload...afterprint...\n\
    top...location...\nparent...offscreenBuffering...\niframe...onerror...\nclipboardData...onresize...\n\
    defaultStatus...onblur...\nwindow...onload...\nscroll...scrollTo...\nonfocus...Option...\n\
    length...self...\nrames...\nclientInformation...external...\nscreensleft...opener...\n\
    unload...document...\nclosed...history...\nImage...navigator...\nstatus...onhelp...\n\
    name... | OK\n\n3. Making statements | 37"
- md: "\n## While loops\n\nAnother loop uses the JavaScript **while** keyword followed\
    \ by an expression to be evaluated for a boolean de-boolean value.\n\nIf the evaluation\
    \ returns `true` then the code in the statement block will be executed. After\
    \ the code has executed the test expression will again be evaluated and the loop\
    \ will continue until evaluation returns `false`.\n\n![](img/d78298d3338ec680a024bbc83e78b297_39_0.png)\n\
    \nThe statement block must feature code that will affect the expression in order\
    \ to change the evaluation result to return **false** – otherwise an infinite\
    \ loop will be created.\n\nIt is important to note that if the test expression\
    \ returns **false** it is first evaluated then the code in the statement block\
    \ is never executed.\n\nThis example decrements a variable value on each iteration\
    \ of the loop. The counter increments until it reaches 10 when the evaluation\
    \ returns `false` and the loop ends.\n\n![](img/d78298d3338ec680a024bbc83e78b297_39_1.png)\n\
    \n```\nvar i = 0, num = 50;\n\n// loop until the counter hits 10\nwhile(i < 10)\n\
    {\n  num--;\n  i++;\n}\n\n// display the final counter and number values\nalert(\"\
    Loop stopped at \" + i + \"\\num is now \" + num);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_39_2.png)\n\
    \n## The do - while loop\n\nThe JavaScript **do** keyword is used to denote the\
    \ start of a **do-while** loop and is followed by a statement block containing\
    \ the code to be executed by the loop.\n\nThe statement code is followed by the\
    \ JavaScript **while** keyword and an expression to be evaluated for a boolean\
    \ value of **true** or false.\n\nIf the evaluation returns **true** the loop restarts\
    \ at the **do** keyword and will continue until the evaluation returns **false**.\n\
    \nIt is important to note that, unlike the simple **while** loop, the statement\
    \ code will always be executed at least once by the **do-while** loop because\
    \ the test expression is not encountered until the end of the loop.\n\nThe following\
    \ example will never loop because the counter value is incremented to 1 in the\
    \ first execution of the statement code so the first test evaluation will return\
    \ **false**:\n\n```\nvar i = 0, num = 50;\n\n// loop until the counter hits 1\n\
    do {\n  num--;\n  i++;\n} while(i < 1);\n\n// display the final counter and number\
    \ values\nalert(\"Loop stopped at \" + i + \"\\nnum is now \" + num);\n```\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_40_0.png)\n\nA **while** loop is often\
    \ more suitable than a **do-while** loop.\n\n![](img/d78298d3338ec680a024bbc83e78b297_40_1.png)\n\
    \n3. Making statements | 39\n\n## Break statement\n\nThe JavaScript break keyword\
    \ is used to terminate the execution of a loop prematurely.\n\nThe break keyword\
    \ is situated inside the statement block containing the code that the loop should\
    \ execute and is preceded by a conditional test.\n\nWhen the test condition is\
    \ met the break statement immediately terminates the loop and no further iterations\
    \ are made.\n\nNotice in the alert() output below that the counter value is still\
    \ three because the increment in the final iteration is not applied\n\nIn the\
    \ following example the conditional test will return true when the counter value\
    \ reaches three:\n\n```\nvar i = 0;\n// loop until the counter hits 6\nwhile(i\
    \ < 6 )\n{\n  if( i == 3 ) break;\n  i++;\n}\n// display the final counter value\n\
    alert(\"BREAK\\n\\nLoop stopped at \" + i);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_41_0.png)\n\
    \nThe break keyword is also used as a terminator with a switch statement.\n\n\
    | JavaScript Application |\n| :--- |\n| BREAK |\n| Loop stopped at 3 |\n| [OK]\
    \ |\n\n## Continue statement\n\nThe JavaScript continue keyword is used to break\
    \ the current iteration of a loop.\n\nJust like the break keyword the continue\
    \ keyword is situated inside the statement block containing the code that loop\
    \ should execute, preceded by a conditional test.\n\nWhen the test condition is\
    \ met the continue immediately stops the current iteration of the loop, but further\
    \ iterations are made until the loop ends.\n\nIn the example below the test condition\
    \ is met when the counter value reaches 3 so the string concatenation that iteration\
    \ is applied but the loop continues on:\n\n```\nvar i = 0, str = \"\";\n// loop\
    \ until the counter hits 5\nwhile(i < 5)\n{\n  i++;\n  if (i == 3)continue;\n\
    \  str += i + \" \";\n}\n\n// display final counter value and all series numbers\n\
    alert(\"CONTINUE\\nLoop stopped:\");\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_42_0.png)\n\
    \nThe loop counter should be incremented before the continue is tested to avoid\
    \ creating an infinite loop.\n\n3. Making statements\n\n## Using with statements\n\
    \nThe JavaScript with keyword is used to reference object properties without needing\
    \ to add the object name before each property name.\n\n![](img/d78298d3338ec680a024bbc83e78b297_43_0.png)\n\
    \nThis is most useful when writing JavaScript applications to produce dynamic\
    \ effects as these scripts often refer to document objects\n\nSee Chapter 10 for\
    \ more about document objects and properties.\n\nFor example, every Web page contains\
    \ a document object that in turn has a forms property to reference forms on the\
    \ Web page. Forms can be referenced by the value assigned to their id attribute.\
    \ Individual form fields can be referenced by the value assigned to their name\
    \ attribute and JavaScript can set their values.\n\n![](img/d78298d3338ec680a024bbc83e78b297_43_1.png)\n\
    \nIn this example the script sets user and city fields of an order form:\n\n<script>\
    \ element that includes the JavaScript file must appear after the form in the\
    \ HTML file - so that the form fields created before the script tries to set their\
    \ values.\n\n```\ndocument.forms.order.user.value = \"Mike\";\ndocument.forms.order.city.value\
    \ = \"New York\";\n```\n\nThese assignments can be expressed more clearly using\
    \ a with statement like this:\n\n```\n// set values for user and city fields of\
    \ the order form\nwith(document.forms.order)\n{\n  user.value = \"Mike\";\n  city.value\
    \ = \"New York\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_43_2.png)\n\
    \nwith js\n\n## Using arrays\n\nThis chapter deals exclusively with the topic\
    \ of arrays and illustrates by example what they are and how to use them. The\
    \ examples include a practical use of arrays to preload images into a Web browser.\n\
    \n## Covers\n\n- Creating arrays | 44\n- Array elements | 45\n- elements loop\
    \ | 46\n- Adding more elements | 47\n- String of elements | 48\n- Reverse element\
    \ | 49\n- Sub-arrays | 50\n- Arrange elements | 51\n- Preloader array | 52\n\n\
    ## Creating arrays\n\nAn array is like a variable that can contain multiple values\
    \ – unlike regular variable that may contain a single value.\n\nAn array is given\
    \ status using the `new` keyword along with the `Array()` constructor.\n\n```\n\
    // create a new array\nvar a = new Array();\n\n// assign values to the\na[0] =\
    \ \"First\"\na[1] = \"JavaScript\"\na[2] = \"Array\";\n```\n\nThe array values\
    \ can now be used just like variables.\n\n![](img/d78298d3338ec680a024bbc83e78b297_45_0.png)\n\
    \nFor small arrays it is often more convenient to initialize the array as arguments\
    \ in the `Array()` constructor. This is illustrated in the example below creates\
    \ three arrays:\n\n```\n// create and initialize three arrays\nvar a = new Array(\"\
    Jan\", \"Feb\", \"Mar\");\nvar b = new Array(\"21\", \"22\", \"23\");\nvar c =\
    \ new Array(\"2003\", \"2004\", \"2005\");\n```\n\n```\n// concatenate and display\
    \ an element from each array\nalert(a[0] + b[1] + c[2]);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_45_1.png)\n\
    \n## Array elements\n\nEach value held in an array is called an array element.\n\
    \nWhen a variable is given array status using the `Array()` constructor it also\
    \ gets properties and methods that can be used to manipulate the elements in the\
    \ array.\n\n![](img/d78298d3338ec680a024bbc83e78b297_46_0.png)\n\nOne of the most\
    \ useful these is the length property that may be used to report the number of\
    \ elements that the array currently contains.\n\nThe syntax to use a property\
    \ or method just takes a period and the name onto the object. So array.length\
    \ references the length property of the array.\n\nNotice that an array containing\
    \ three values will have a length of 3, because indexing starts at zero the last\
    \ element in the array will have an index number of only 2.\n\nThe example below\
    \ demonstrates this point:\n\n![](img/d78298d3338ec680a024bbc83e78b297_46_1.png)\n\
    \n```\n// create a new array\nvar a = new Array();\na[0] = \"JAVASCRIPT\";\na[1]\
    \ = \"ARRAY\";\na[2] = \"LENGTH\";\n\n// get the array length\nvar arraysize =\
    \ a.length;\n\n// display each array element and the array length\nalert(a[0]+a[1]+\"\
    \\n\"+arraysize)\n```\n\n| JavaScript Application |\n| :--- |\n| JAVASCRIPT ARRAY\
    \ LENGTH |\n| No.of elements is 3 |\n| [OK] |\n\n4. Using arrays | 45\n"
  mdcn: "\n\n## while 循环 (While loops)\n\n另一种循环使用了 JavaScript 的 **while** 关键字，后面跟着一个用于评估以获取布尔值的表达式。\n\
    \n如果评估结果为 `true`，则语句块中的代码将被执行。在代码执行后，测试表达式将再次被评估，循环将持续进行直到评估结果返回 `false`。\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_39_0.png)\n\n语句块必须包含能够影响表达式的代码，以便将评估结果改为返回\
    \ **false**——否则将导致无限循环。\n\n需要注意的是，如果测试表达式返回 **false**，则它会先进行评估，然后语句块中的代码将永远不会执行。\n\
    \n此示例在循环的每次迭代中减少变量的值。计数器不断增加直到达到 10，此时评估返回 `false`，循环结束。\n\n![](img/d78298d3338ec680a024bbc83e78b297_39_1.png)\n\
    \n```\nvar i = 0, num = 50;\n\n// 循环直到计数器达到 10\nwhile(i < 10)\n{\n  num--;\n \
    \ i++;\n}\n\n// 显示最终的计数器和数值\nalert(\"Loop stopped at \" + i + \"\\num is now \"\
    \ + num);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_39_2.png)\n\n## do\
    \ - while 循环 (The do - while loop)\n\nJavaScript 的 **do** 关键字用于表示 **do-while**\
    \ 循环的开始，后面跟着一个包含循环要执行代码的语句块。\n\n语句代码之后是 JavaScript 的 **while** 关键字和一个用于评估布尔值 **true**\
    \ 或 **false** 的表达式。\n\n如果评估结果返回 **true**，循环将在 **do** 关键字处重新开始，并持续到评估返回 **false**\
    \ 为止。\n\n需要注意的是，与简单的 **while** 循环不同，**do-while** 循环至少会执行一次语句代码，因为在循环结束之前不会遇到测试表达式。\n\
    \n以下示例将永远不会循环，因为计数器值在语句代码的第一次执行中增加到了 1，因此第一次评估将返回 **false**：\n\n```\nvar i = 0,\
    \ num = 50;\n\n// 循环直到计数器达到 1\ndo {\n  num--;\n  i++;\n} while(i < 1);\n\n// 显示最终的计数器和数值\n\
    alert(\"Loop stopped at \" + i + \"\\nnum is now \" + num);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_40_0.png)\n\
    \n**while** 循环通常比 **do-while** 循环更合适。\n\n![](img/d78298d3338ec680a024bbc83e78b297_40_1.png)\n\
    \n3. 制作语句 | 39\n\n## break 语句 (Break statement)\n\nJavaScript 的 break 关键字用于提前终止循环的执行。\n\
    \nbreak 关键字位于包含循环应执行代码的语句块内部，并在前面有一个条件测试。\n\n当满足测试条件时，break 语句立即终止循环，不再进行进一步的迭代。\n\
    \n注意下方的 alert() 输出，计数器值仍然是三，因为最后一次迭代中的增加没有被应用。\n\n在以下示例中，当计数器值达到三时，条件测试将返回 true：\n\
    \n```\nvar i = 0;\n// 循环直到计数器达到 6\nwhile(i < 6 )\n{\n  if( i == 3 ) break;\n \
    \ i++;\n}\n// 显示最终的计数器值\nalert(\"BREAK\\n\\nLoop stopped at \" + i);\n```\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_41_0.png)\n\nbreak 关键字也用作 switch 语句的终止符。\n\
    \n| JavaScript 应用 |\n| :--- |\n| BREAK |\n| Loop stopped at 3 |\n| [OK] |\n\n\
    ## continue 语句 (Continue statement)\n\nJavaScript 的 continue 关键字用于中断循环的当前迭代。\n\
    \n与 break 关键字一样，continue 关键字位于包含循环应执行代码的语句块内部，并在前面有一个条件测试。\n\n当满足测试条件时，continue\
    \ 会立即停止循环的当前迭代，但在循环结束之前还会进行后续迭代。\n\n在下面的示例中，当计数器值达到 3 时满足测试条件，因此该迭代应用了字符串拼接，但循环将继续进行：\n\
    \n```\nvar i = 0, str = \"\";\n// 循环直到计数器达到 5\nwhile(i < 5)\n{\n  if(i == 3) continue;\n\
    \  str += i;\n}\n\n// 显示最终的计数器和字符串\nalert(\"Loop stopped at \" + i + \"\\nstr\
    \ is \" + str);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_42_0.png)\n\n\
    \            \n\n3. 制作语句 (Making statements)\n\n## 使用 with 语句 (Using with statements)\n\
    \nwith 关键字用于在测试 with 之前引用对象。\n\n![](img/d78298d3338ec680a024bbc83e78b297_43_0.png)\n\
    \nwith 语句通常用于在不需要指定对象名称的情况下访问其属性。\n\n![](img/d78298d338ec680a024bbc83e78b297_43_1.png)\n\
    \n## 数组 (Arrays)\n\n数组允许你存储多个值并在一个变量中引用它们。\n\n- 数组创建 | 44\n- 数组的元素 | 45\n- 数组的循环\
    \ | 46\n- 数组数组 | 47\n- 数组属性 | 48\n- 数组方法 | 49\n- 数组索引 | 50\n- 数组长度 | 51\n- 数组创建\
    \ | 52\n\n## 创建数组 (Creating arrays)\n\n使用 `Array` 关键字可以创建一个包含多个值的数组。\n\n```\n\
    // 创建新数组\nvar a = new Array();\n\n// 赋值\na[0] = \"First\";\na[1] = \"JavaScript\"\
    ;\na[2] = \"Array\";\n```\n\n使用 `Array()` 构造函数可以一次性初始化数组元素。\n\n```javascript\n\
    // 创建并初始化数组\nvar a = new Array(\"Jan\", \"Feb\", \"Mar\");\nvar b = new Array(\"\
    21\", \"22\", \"23\");\nvar c = new Array(\"2003\", \"2004\", \"2005\");\n\n//\
    \ 拼接并显示数组元素\nalert(a[0] + b[1] + c[2]);\n```\n\n## 数组元素 (Array elements)\n\n数组中的每个值都称为数组元素。\n\
    \n当一个变量通过 `Array()` 构造函数赋予状态时，它也获得了用于操作元素的属性和方法。\n\n![](img/d78298d3338ec680a024bbc83e78b297_46_0.png)\n\
    \n这些属性中最实用的是 `length` ，它可以报告数组当前包含的元素数量。\n\n使用属性或方法的语法只需要在对象名称后加上点和名称。因此，`array.length`\
    \ 引用数组的长度。\n\n注意，包含三个值的数组长度为 3，因为索引从 0 开始，数组中的最后一个元素的索引号仅为 2。\n\n下面的示例演示了这一点：\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_46_1.png)\n\n```javascript\n// 创建新数组\n\
    var a = new Array();\na[0] = \"JavaScript\";\na[1] = \"ARRAY\";\na[2] = \"LENGTH\"\
    ;\n\n// 获取数组长度\nvar arraysize = a.length;\n\n// 显示每个数组元素和数组长度\nalert(a[0] + a[1]\
    \ + \"\\n\" + arraysize);\n```\n\n"
