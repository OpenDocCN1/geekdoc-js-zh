  md: '# Cross-browser compliancy


    In order for Web pages to display as desired it is sometimes necessary to identify
    the Document Object Model (DOM) which that browser supports.


    Release 4.0 of both Netscape and Internet Explorer browsers added DOM support
    for dynamic HTML (DHTML). For this purpose Netscape introduced the document.layers
    property and Microsoft introduced the document.all property.


    More recently, release 6.0 of Netscape and 5.0 of Internet Explorer introduced
    support for a DOM devised by the World Wide Web Consortium (W3C). Crucially, this
    added a method called document.getElementById() that can be used to reference
    a HTML element on a page by the name assigned to its id attribute. For instance,
    document.all and document.getElementById("") could be used to reference a HTML
    element with an id value of "pic". For example, <img id="pic" src="pic.gif" alt="Fascinating
    Picture/">


    As Web browsers are free software the overwhelming majority of browsers now support
    the W3C DOM.


    ![](img/d78298d3338ec680a024bbc83e78b297_94_0.png)


    It is convenient to test for the existence document.layers and document.getElementsByById()
    to discover which DOM is supported by the browser:


    ![](img/d78298d3338ec680a024bbc83e78b297_94_1.png)


    ```

    // cross-browser DOM test

    if(document.getElementById) alert("W3C DOM Supported");

    else

    if (document.all) alert("MSIE 4 DOM Supported");

    else

    if (document.layers) alert("NN 4 DOM Supported");

    else alert("This is a really old Web browser");

    ```


    dom-test.js


    ![](img/d78298d3338ec680a024bbc83e78b297_94_2.png)'
  merge: -1
