- md: "\n## Math methods\n\nThe JavaScript Math object has many methods – all of them\
    \ are listed in the table below:\n\n| Method | Description |\n| :--- | :--- |\n\
    | Math.abs() | return an absolute value |\n| Math.acos() | return an arc cosine\
    \ |\n| Math.asin() | return an arc sine |\n| Math.atan() | return an arc tangent\
    \ |\n| Math.atan2() | return an angle from an X-axis to a point |\n| Math.ceil()\
    \ | round a number up |\n| Math.cos() | return a cosine value |\n| Math.exp()\
    \ | return an exponent of constant e |\n| Math.floor() | round a number down |\n\
    | Math.log() | return a natural logarithm |\n| Math.max() | return the larger\
    \ of two numbers |\n| Math.min() | return the smaller of two numbers |\n| Math.pow()\
    \ | return the power value |\n| Math.random() | return a random number |\n| Math.round()\
    \ | round to the nearest integer |\n| Math.sin() | return a sine value |\n| Math.sqrt()\
    \ | return the square root |\n| Math.tan() | return a tangent value |\n\n> HOT\
    \ TIP Math.random() has many uses in Web pages to provide varied page content.\n\
    \nThe Math methods most commonly used from the above list are examined in more\
    \ detail on the following pages.\n\n## Rounding floats\n\nThe Math.round() method\
    \ in JavaScript is useful both to round floating-point numbers to the nearest\
    \ integer and convert floating-point numbers to shorter rounded versions. Commonly\
    \ this will be to reduce a long floating-point number to two decimal places.\n\
    \nIf the floating point value given as the method argument is exactly halfway\
    \ between two integers the method will round up to the nearest integer.\n\nThe\
    \ example given below illustrates the way that the Math.round() method handles\
    \ rounding of positive and negative halfway values and shows how it may be used\
    \ to convert a long floating-point number to just two places:\n\n```javascript\n\
    var a = 7.5;\na = Math.round(a);\na = \"Rounded Positive : \"+a+\"\\n\";\n\nvar\
    \ b = -7.5;\nb = Math.round(b);\nb = \"Rounded Negative : \"+b+\"\\n\";\n\nvar\
    \ c = 3.7646368467915;\nc = c * 100; // take it up two places\nc = Math.round(c);\
    \ // do the round\nc /= 100; // take it back down 2 places\nc = \"Commuted Long\
    \ Float : \"+c+\";\";\nalert(a+b+c);\n```\n\n## Forcing floats\n\nAs an alternative\
    \ to using the Math.round() method detailed on the previous page the script may\
    \ require that the float be selectively forced to the nearest integer, above or\
    \ below.\n\nJavaScript provides the Math.ceil() method to force rounding up to\
    \ the nearest integer and the Math.floor() method rounds to the nearest integer\
    \ down.\n\nThe example below illustrates both methods in action with both positive\
    \ and negative values:\n\n```javascript\nvar a = 7.5;\nvar a1 = \"a1 \" + Math.ceil(a);\n\
    var a2 = \"a2 \" + Math.floor(a);\nvar b = -7.5;\nvar b1 = \"b1 \" + Math.ceil(b);\n\
    var b2 = \"b2 \" + Math.floor(b);\nvar rup = \"ROUNDING UP\\n\" + a1 + \"\\n\"\
    \ + b1 + \"\\n\";\nvar rdn = \"ROUNDING DOWN\\n\" + a2 + \"\\n\" + b2+\";\";\n\
    alert( rup + rdn );\n```\n\nRounding up of negative values returns the nearest\
    \ integer towards zero.\n\n## Comparing numbers\n\nThe Math object has two methods\
    \ allowing comparison of two numbers with a return of the higher or lower value.\n\
    \nMath.max() accepts the two values for comparison as arguments and will return\
    \ the higher of the two values.\n\nThe Math.min() method works in precisely the\
    \ same way returns the lower of the two values.\n\nIn the example below the Math.pow()\
    \ method is used to create square and cube values that are then compared with\
    \ Math.max() and Math.min().\n\nThe Math.pow() method requires two arguments to\
    \ specify the power by which to raise that number:\n\n```javascript\nvar sq =\
    \ Math.pow( 5, 2 );\nvar cb = Math.pow( 3, 3 );\nvar hi = \"Round up : \" + Math.max(\
    \ sq, cb );\nvar lo = \"Round Down : \" + Math.min(sq, cb );\nvar ng = \"Round\
    \ Negative Up : \" + Math.max( -5, -4 );\nalert(\"MAX\\n\" + hi + \"\\n\" + lo\
    \ + \"\\n\" + ng);\n```\n\n## Random generator\n\nRandom numbers can be generated\
    \ using the Math.random() method to return a floating-point value between 0.0\
    \ and 1.0. This method can be used to create a series of random selections, like\
    \ a lottery draw, and is popular for producing random effects within Web pages.\n\
    \nMultiplying the random number will specify a wider range, for example, a multiplier\
    \ of 10 will create a random number between 0.0 and 10. To make the randomly generated\
    \ number more useful is generally best to round up the float so that the range\
    \ will become integer values. The Math.ceil() method will be used to round the\
    \ random number up to an integer between 1 and 10. The code below illustrates\
    \ this:\n\n```javascript\n// get a random number from 0.0 to 1.0\nvar rand1 =\
    \ Math.random();\n// multiply by 10 to make it between 0.0 and 10\nvar rand2 =\
    \ rand1 * 10;\n// round it up to make it between 1 and 10\nvar rand3 = Math.ceil(rand2);\n\
    \n// add each part to a string\nvar str = \"Random float [rand1]: \" + rand1 +\
    \ \"\\n\";\nstr += \"Specify range [rand2]: \" + rand2 + \"\\n\";\nstr += \"Random\
    \ integer [rand3]: \" + rand3;\n\n// display the string\nalert(str);\n```\n\n\
    The individual steps are shown here with the rand variables combined as: Math.ceil(Math.random()*10)\n\
    \n## Lottery picker\n\nThis example uses Math.random() to generate a series of\
    \ six random numbers within the range of 1 to 49 which can be used as selections\
    \ in the national British lottery:\n\n```javascript\n// create variables\nvar\
    \ i, rand, temp, str;\n\n// create a new array of 50 elements\nvar nums = new\
    \ Array(50);\n\n// fill elements 1-49 with numbers 1-49\nfor(i = 1; i < 50; i++)\
    \ nums[i] = i;\n\n// algorithm to randomize these numbers\nfor(i = 1; i < 50;\
    \ i++) {\n  rand = Math.ceil(Math.random() * 49);\n  temp = nums[i];\n  nums[i]\
    \ = nums[rand];\n  nums[rand] = temp;\n}\n\n// add the first six elements to a\
    \ string\nstr = \"Your six lucky numbers are:\\n\\n\";\nfor(i = 1; i < 7; i++)\
    \ {\n  str += nums[i];\n  if(i != 6) str += \" - \";\n}\n\n// display the string\n\
    alert(str);\n```\n\n## Random images\n\nThe Math.random() method is used in the\
    \ following example to randomly select one of six images to be displayed in a\
    \ Web page. The JavaScript displays an image, for an HTML <img> tag with an id\
    \ of pic. The image is determined by the code each time the page is loaded, and\
    \ the script is executed.\n\nIt is important to remember that the <script> element\
    \ to include this JavaScript must appear in the body of the HTML document after\
    \ the <img> tag. Otherwise the code will be unable to find any element with an\
    \ id of pic – so it will be unable to assign the randomly selected image.\n\n\
    ```javascript\n// create a new array and assign random images to 6 elements\n\
    var pix = new Array;\npix[0] = \"pic0.gif\";\npix[1] = \"pic1.gif\";\npix[2] =\
    \ \"pic2.gif\";\npix[3] = \"pic3.gif\";\npix[4] = \"pic4.gif\";\npix[5] = \"pic5.gif\"\
    ;\n```\n\nDocument properties and methods are fully explained in Chapter 10.\n\
    \n```javascript\n// get a random integer between 0 and 5\nvar rand = Math.floor(Math.random()\
    \ * 6);\n\n// assign random image to the HTML <img> tag of pic id\ndocument.getElementById(\"\
    pic\").src = pix[rand];\n```\n\nUse this script to randomly display banners on\
    \ a Web page.\n\n## Working with strings\n\nThis chapter explains string characteristics\
    \ and demonstrates by example how text strings may be manipulated with JavaScript\
    \ code.\n\n## Covers\n\n- String length | 76\n- Characters in strings | 77\n-\
    \ Join strings | 78\n- Search a string | 79\n- Separate words | 80\n- Substrings\
    \ | 81\n- Convert to string | 82\n- Change case | 83\n- Numbers from strings |\
    \ 84\n- Variables in strings | 85\n- Encoding strings | 86\n"
  mdcn: "\n\n## 数学方法\n\nJavaScript `Math` 对象有许多方法 – 它们都列在下表中：\n\n| 方法 | 描述 |\n| :---\
    \ | :--- |\n| Math.abs() | 返回绝对值 |\n| Math.acos() | 返回反余弦 |\n| Math.asin() | 返回反正弦\
    \ |\n| Math.atan() | 返回反正切 |\n| Math.atan2() | 返回从 X 轴到某点的角度 |\n| Math.ceil()\
    \ | 向上取整 |\n| Math.cos() | 返回余弦值 |\n| Math.exp() | 返回常数 e 的幂 |\n| Math.floor()\
    \ | 向下取整 |\n| Math.log() | 返回自然对数 |\n| Math.max() | 返回两个数中较大的一个 |\n| Math.min()\
    \ | 返回两个数中较小的一个 |\n| Math.pow() | 返回幂的值 |\n| Math.random() | 返回一个随机数 |\n| Math.round()\
    \ | 四舍五入到最近的整数 |\n| Math.sin() | 返回正弦值 |\n| Math.sqrt() | 返回平方根 |\n| Math.tan()\
    \ | 返回正切值 |\n\n> **热点提示** `Math.random()` 在网页中有许多用途，用于提供多样化的页面内容。\n\n上述列表中常用的\
    \ Math 方法将在接后的页面中进行详细介绍。\n\n## 浮点数舍入\n\nJavaScript 中的 `Math.round()` 方法既可以将浮点数四舍五入到最近的整数，也可以将浮点数转换为更短的舍入版本。通常这会将一个长浮点数减少到两位小数。\n\
    \n如果作为方法参数的浮点值恰好位于两个整数的中间，该方法将向上舍入到最近的整数。\n\n下面的示例说明了 `Math.round()` 方法如何处理正负半数值的舍入，并展示了如何使用它将长浮点数转换为仅两位小数：\n\
    \n```javascript\nvar a = 7.5;\na = Math.round(a);\na = \"Rounded Positive : \"\
    +a+\"\\n\";\n\nvar b = -7.5;\nb = Math.round(b);\nb = \"Rounded Negative : \"\
    +b+\"\\n\";\n\nvar c = 3.7646368467915;\nc = c * 100; // 保留两位小数\nc = Math.round(c);\
    \ // 执行舍入\nc /= 100; // 恢复到两位小数\nc = \"Commuted Long Float : \"+c+\";\";\nalert(a+b+c);\n\
    ```\n\n## 强制处理浮点数\n\n作为上一页详细的 `Math.round()` 方法的替代方案，脚本可能需要将浮点数选择性地强制转换为最近的整数（向上或向下）。\n\
    \nJavaScript 提供了 `Math.ceil()` 方法来强制向上取整到最近的整数，而 `Math.floor()` 方法则向下取整到最近的整数。\n\
    \n下面的示例展示了这两个方法在处理正负值时的用法：\n\n```javascript\nvar a = 7.5;\nvar a1 = \"a1 \" +\
    \ Math.ceil(a);\nvar a2 = \"a2 \" + Math.floor(a);\nvar b = -7.5;\nvar b1 = \"\
    b1 \" + Math.ceil(b);\nvar b2 = \"b2 \" + Math.floor(b);\nvar rup = \"ROUNDING\
    \ UP\\n\" + a1 + \"\\n\" + b1 + \"\\n\";\nvar rdn = \"ROUNDING DOWN\\n\" + a2\
    \ + \"\\n\" + b2+\";\";\nalert( rup + rdn );\n```\n\n负值的向上取入会返回向零方向靠近的最近整数。\n\n\
    ## 比较数字\n\n`Math` 对象有两个方法允许比较两个数字，并返回其中较大或较小的值。\n\n`Math.max()` 接受两个待比较的值作为参数，并将将返回这两个值中较大的一个。\n\
    \n`Math.min()` 方法的工作方式完全相同，返回两个值中较小的一个。\n\n在下面的示例中，使用 `Math.pow()` 方法创建平方和立方值，然后与\
    \ `Math.max()` 和 `Math.min()` 进行比较。\n\n`Math.pow()` 方法需要两个参数来指定该数字的幂次：\n\n```javascript\n\
    var sq = Math.pow( 5, 2 );\nvar cb = Math.pow( 3, 3 );\nvar hi = \"Round up :\
    \ \" + Math.max( sq, cb );\nvar lo = \"Round Down : \" + Math.min(sq, cb );\n\
    var ng = \"Round Negative Up : \" + Math.max( -5, -4 );\nalert(\"MAX\\n\" + hi\
    \ + \"\\n\" + lo + \"\\n\" + ng);\n```\n\n## 随机生成器\n\n可以使用 `Math.random()` 方法生成随机数，返回一个\
    \ 0.0 到 1.0 之间的浮点值。该方法可以用于创建一系列随机选择（如抽票），并且在网页中产生随机效果非常流行。\n\n通过乘以随机数可以指定更宽的范围，例如，乘以\
    \ 10 将创建一个 0.0 到 10 之间的随机数。为了让生成的随机数更有用，最好是将浮点数向上取整，使范围变为整数值。使用 `Math.ceil()`\
    \ 方法可以将随机数向上取整为 1 到 10 之间的整数。下面的代码演示了这一点：\n\n```javascript\n// 获取一个 0.0 到 1.0\
    \ 之间的随机数\nvar rand1 = Math.random();\n// 乘以 10 使其处于 0.0 到 10 之间\nvar rand2 = rand1\
    \ * 10;\n// 向上取整使其变为 1 到 10 之间的整数\nvar rand3 = Math.ceil(rand2);\n\n// 将结果添加到字符串\n\
    var str = \"Random float [rand1]: \" + rand1 + \"\\n\";\nstr += \"Specify range\
    \ [rand2]: \" + rand2 + \"\\n\";\nstr += \"Random integer [rand3]: \" + rand3;\n\
    \n// 显示字符串\nalert(str);\n```\n\n## 随机选择器\n\n此示例使用 `Math.random()` 生成 1 到 49 之间的系列随机数字，可以用于彩票抽奖。以下是随机化\
    \ 1 到 49 的数字：\n\n```javascript\n// 创建变量\nvar i, rand, temp, str;\n\n// 创建一个包含\
    \ 50 个元素的数组\nvar nums = new Array(50);\n\n// 用 1 到 49 的数字填充 1 到 49 的元素\nfor(i\
    \ = 1; i < 50; i++) {\n  rand = Math.ceil(Math.random() * 49);\n  temp = nums[i];\n\
    \  nums[rand] = temp;\n  nums[rand] = i;\n}\n\n// 将前六个数字添加到字符串\nstr = \"Your lucky\
    \ numbers are:\\n\\n\";\nfor(i = 1; i < 7; i++) {\n  str += nums[i];\n  if(i !=\
    \ 6) str += \" - \";\n}\n\n// 显示字符串\nalert(str);\n```\n\n## 随机图片\n\n下面的示例使用 `Math.random()`\
    \ 方法选择六张图片之一显示在网页中。具有 id `pic` 的 HTML `<img>` 标签会在每次页面加载时由代码决定图片并执行脚本。\n\n请记住，包含此\
    \ JavaScript 的 `<script>` 元素必须出现在 HTML 文档中 `<img>` 标签之后。否则代码将无法找到 id 为 `pic` 的元素——从而无法分配随机图片。\n\
    \n```javascript\n// 创建新数组并为 6 个元素分配随机图片\nvar pix = new Array;\npix[0] = \"pic0.gif\"\
    ;\npix[1] = \"pic1.gif\";\npix[2] = \"pic2.gif\";\npix[3] = \"pic3.gif\";\npix[4]\
    \ = \"pic4.gif\";\npix[5] = \"pic5.gif\";\n```\n\n文档属性和方法将在第 10 章中详细解释。\n\n```javascript\n\
    // 获取一个 0 到 5 之间的随机整数\nvar rand = Math.floor(Math.random() * 6);\n\n// 将随机图片分配给\
    \ id 为 pic 的 HTML img 标签\ndocument.getElementById(\"pic\").src = pix[rand];\n\
    ```\n\n使用此脚本可以在网页上随机显示横幅。\n\n## 处理字符串\n\n本章解释了字符串特性，并通过示例演示了如何使用 JavaScript 代码处理文本字符串。\n\
    \n## \n\n- 字符串长度 | 76\n- 字符串中的字符 | 77\n- 连接字符串 | 78\n- 搜索字符串 | 79\n- 分割单词 | 80\n\
    - 子字符串 | 81\n- 转换为字符串 | 82\n- 更改大小写 | 83\n- 从字符串提取数字 | 84\n- 字符串中的变量 | 85\n- 字符串编码\
    \ | 86\n\n"
