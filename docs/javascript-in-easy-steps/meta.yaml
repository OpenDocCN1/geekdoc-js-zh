  - '[PAGE 121]


    # XYZ coordinates


    Physical position of content in a display window can be referred to using coordinates
    called X, Y and Z.


    The X coordinate specifies the distance in pixels from the extreme left edge of
    the window.


    The Y coordinate specifies the distance in pixels from the extreme top edge of
    the window.


    The Z coordinate specifies the stacked position, by index number, of layers above
    the bottom window level:


    ![](img/d78298d3338ec680a024bbc83e78b297_121_0.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_121_1.png)


    The X coordinate at the left edge of the window is zero and the Y coordinate at
    the top edge of the window is also zero.


    A position where X=50 and Y=30 would pinpoint a location 50 pixels from the left
    edge and 30 pixels from the top edge.


    The Z coordinate of the bottom window level has an index value of zero. Layers
    may be placed over this level, like transparent sheets, and are given unique Z-index
    values.


    A window may have many layers but the top layer will always have the highest Z-index
    value. Each successive layer below that will have a decreasing lower Z-index value.'
  - '[PAGE 122]


    # Dynamic layers


    JavaScript can create layers dynamically by writing the necessary HTML code and
    stylesheet rules in the body section of the HTML document. This allows control
    over the position and appearance of each layer.


    Most importantly, if layers overlap each other their stacking order can be determined
    by the value assigned to their z-index property – the higher the number, the higher
    the layer will be in the stack.


    The example below emulates the illustration on the opposite page by dynamically
    creating two overlapping layers. The second (yellow) layer is higher in the stack
    than the first (purple) layer. If their z-index values were reversed, layer 1
    was 20 and layer 2 was 10, the purple layer would overlap the yellow layer.


    ![](img/d78298d3338ec680a024bbc83e78b297_122_0.png)


    ```

    // write a layer at z-index 10

    document.write("<div id=''layer1''\nstyle=''position:absolute; top:20px; left:20px;

    width:80px; height:80px; background-color:purple;

    color:white; z-index:10; border:1px solid black''>\nLayer #1</</div>");

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_122_1.png)


    ```

    // write a layer at z-index 20

    document.write("<div id=''layer2''\nstyle=''position:absolute; top:40px; left:40px;

    width:80px; height:80px; background-color:yellow;

    z-index:20; border:1px solid black''>Layer #2</</div>");

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_122_2.png)


    10. Document properties | 121'
  - '[PAGE 123]


    # Transparent layers


    Unless specified otherwise, a layer will usually be created with the same background
    as the document body – so will appear to be transparent. Alternatively it can
    be explicitly set to be transparent by setting its background-color property to
    transparent.


    The transparency of layers is particularly important when they contain GIF images
    of irregular shapes that have transparent parts. On a transparent layer these
    images appear to simply float over the document background. Several images can
    appear in proximity, even when their layers overlap, by allocating their z-index
    values to determine their stacking order.


    The script below creates two layers – but only one is transparent to illustrate
    the difference in how each image appears.


    ```

    // create a transparent_layer

    document.write("<div id=''transparent-layer''

    style=''position: absolute; top:20px; left:230px;

    width:75px; height:110px; background-color:transparent><img src=''deedee.gif''
    alt=''''></div>")


    // create a white layer

    document.write("<div id=''transparent-layer''

    style=''position: absolute; top:20px; left:315px;

    width:75px; height:110px; background-color:white''><img src=''deedee.gif'' alt=''''>")

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_123_0.png)


    The image used in this example is in the GIF format and has its green color set
