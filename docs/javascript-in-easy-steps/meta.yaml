  - "[PAGE 113]\n\n# Set colors\n\nThe properties and methods of the window.document\
    \ object enable a Web page document to be changed at runtime. Using JavaScript\
    \ to assign new values to properties of the window.document object causes the\
    \ Web browser to update the appearance of the Web page in line with the new values.\n\
    \nThe window.part of the address may be omitted as window is the top DOM object.\n\
    \nIn this can be simply illustrated by assigning new values to the document.bgColor\
    \ and document.fgColor properties to change the background and foreground colors\
    \ of a page:\n\nIn this example the set_colors() function is called from the HTML\
    \ onclick attribute of the button when the user pushes it:\n\n![](img/d78298d3338ec680a024bbc83e78b297_113_0.png)\n\
    \n```\n// a function to set the colors of the page\nfunction set_colors() {\n\
    \  window.document.bgColor = \"red\";\n  window.document.fgColor = \"yellow\"\
    ;\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_113_1.png)\n\n| Set Colors\
    \ |\n| File | Edit | View | Favorites | Tools | Help |\n| JavaScript in easy steps\
    \ |\n| Change Colors |\n| Done | Local intranet |\n\nNotice the capitalization\
    \ of both bgColor and fgColor.\n\n![](img/d78298d3338ec680a024bbc83e78b297_113_2.png)\n\
    \n| Set Colors |\n| File | Edit | View | Favorites | Tools | Help |\n| JavaScript\
    \ in easy steps |\n| Change Colors |\n| Done | Local intranet |\n\n12 | JavaScript\
    \ in easy steps"
  - '[PAGE 114]


    # JavaScript creates


    The write() method of the window.document object is a tremendously powerful feature
    that allows JavaScript to create content dynamically when loading a Web page.


    The method takes a single string argument containing the content to be written
    into the page and may include HTML tags to format the content.


    Typically the document.write() method appears within a script in the <body> section
    of an HTML document and will write selected content following a conditional test.


    ![](img/d78298d3338ec680a024bbc83e78b297_114_0.png)


    It should be noted that calling this method at runtime will cause the specified
    content to be written into a new blank document so replacing the current page.


    Variable values may also be concatenated with a string argument in order to introduce
    a variable value into the content of a Web page.


    This example first generates a random number tests to determine if the number
    is odd or even. Selected content is added to the page depending on the result
    of this test:


    ```

    // get a random integer between 1 - 100

    var n = Math.ceil(Math.random() * 100);

    // determine whether the number is odd or even

    var ntype = ( n % 2 == 0 ) ? "Even" : "Odd";

    // write a description of the number

    document.write("<h1>Number " +n+\ " is " +ntype+"</h1>");

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_114_1.png)


    | Write Content |

    |---|

    | File Edit View Favorites Tools Help |

    | Number 87 is Odd |'
  - "[PAGE 115]\n\n# Set cookie\n\nCookies are tiny files that can be written by JavaScript\
    \ to store small amounts of data on the local hard drive. There are limitations\
    \ to the use of cookies that restrict their size to 4 kilobytes and Web browsers\
    \ are not required to retain more than 20 cookies per Web server. A typical cookie\
    \ may often retain user data for access pages or on subsequent visits to a website.\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_115_0.png)\n\nEscape the values to\
    \ include spaces, commas and semicolons. The cookie data is held in the window.document.cookie\
    \ object as a name=value pair – the value may not contain any semicolons, commas\
    \ or whitespace. Multiple name=value pairs may be stored by making further assignments\
    \ to the document.cookie object.\n\nThe life-span of a cookie is limited to the\
    \ length of the browser session unless an expiry date is specified when the cookie\
    \ is first set.\n\nExpiration is assigned to a key named expires by amending the\
    \ Date object to the desired future date.\n\n![](img/d78298d3338ec680a024bbc83e78b297_115_1.png)\n\
    \nA cookie may be deleted by setting an expiry date before the real current date.\
    \ Dates of expiry should be expressed in GMT string format by converting the Date\
    \ object using the Date.toGMTString().\n\nThe calculation in the example below\
    \ multiplies the days, hours, minutes, seconds and milliseconds to increment a\
    \ Date object by 1 week.\n\nThis example stores the user’s name and account number\
    \ in a cookie with a life-span of 7 days:\n\n![](img/d78298d3338ec680a024bbc83e78b297_115_2.png)\n\
    \n```\n// the data to be stored in the cookie\nvar user_account = \"Mike McGrath,\
    \ 0004566\";\n\n// create a new Date object\nvar expiry = new Date();\n\n// set\
    \ the expiry for 7 days time\nexpiry.setTime( expiry.getTime() + (7*24*60*1000));\n\
    \n// create the cookie\ndocument.cookie = \"cookiedata=escape(user_account)\"\
    ;\n + \"expires=\" +expiry.toGMTString() + \"; \";\n```\n\nset-cookie.js"
