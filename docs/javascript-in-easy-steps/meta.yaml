  md: "# Mouse click\n\nThe most common interactive event is the Click event created\
    \ when a user clicks the left-hand mouse button while the cursor is over a form\
    \ button in a Web document.\n\nAn onclick event-handler is normally assigned in\
    \ the button's HTML &lt;input&gt; tag with the HTML onclick attribute.\n\nTypically\
    \ the value assigned to the onclick attribute will be call to a JavaScript function\
    \ that will execute statements. For instance...\n\n![](img/d78298d3338ec680a024bbc83e78b297_143_0.png)\n\
    \n```\n<input type=\"button\" value=\"Do Click\"\nonclick=\"do_click('JavaScript\
    \ in easy steps')\"/>\n```\n\nThis simple example calls a JavaScript function\
    \ when the user clicks on a button and passes a string argument for use by the\
    \ called function:\n\n```\n// a function to react to the CLICK event\nfunction\
    \ do_click( str )\n{\n    // display the passed string argument\nalert(str);\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_143_1.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_143_2.png)"
