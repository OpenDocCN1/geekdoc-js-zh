  - "[PAGE 161]\n\n# JavaScript: protocol\n\nThe javascript protocol may be assigned\
    \ to the href attribute in a HTML <a> anchor element to make a JavaScript function\
    \ the target of a hyperlink.\n\nThe name of the function should follow the protocol\
    \ specify to identify the script code to be executed, or short pieces of code\
    \ can be included in-line after the specifier, like this:\n\n```\n<a href=\"javascript:alert('In-line\
    \ code')\">Link #1</a>\n<a href=\"javascript:respond()\">Link #2</a>\n```\n\n\
    This example contains both in-line code and a function call. Each will execute\
    \ when the user clicks the relevant hyperlink:\n\n```\n// a function to display\
    \ a simple message\nfunction respond() {\n  alert(\"JavaScript code\");\n}\n```\n\
    \nTo make an anchor that has no target use javascript:// so that other attributes\
    \ like onmouseover can still be used.\n\n![](img/d78298d3338ec680a024bbc83e78b297_161_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_161_1.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_161_2.png)"
  - "[PAGE 162]\n\n# Layer attributes\n\nProbably the most important style attributes\
    \ of a <div> element to be used in DHTML are id, top, left, z-index, visibility,\
    \ color and background-color.\n\nThese style can be dynamically changed by assigning\
    \ new values to them with JavaScript.\n\nThis example demonstrates how to access\
    \ each of these attributes by listing the values of a <div> element called lyr.\n\
    \n```\n// a function to display the style attributes of a <div>\nfunction get_styles()\
    \ {\n  var obj = document.getElementById(\"lyr\");\n  var str = \"ID: \" + obj.id;\n\
    \  str += \"\\nInTop: \" + obj.style.top;\nn  str += \"\\nInLeft: \" + obj.style.left;\n\
    n  str += \"\\nZ-Index: \" + obj.style.zIndex;\nn  str += \"\\nVisibility: \"\
    \ + obj.style.visibility;\nn  str += \"\\nBackground: \" + obj.style.backgroundColor;\n\
    n  str += \"\\nForeground: \" + obj.style.color;\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_162_0.png)\n\
    \nThe CSS z-index style is referenced in JavaScript by the term z-index. Also\
    \ the CSS background-color style is referenced in JavaScript by the term backgroundColor.\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_162_1.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_162_2.png)"
  - "[PAGE 163]\n\n# Toggle visibility\n\nHaving determined how to access layer styles\
    \ with JavaScript it's easy to have some fun with them by letting the JavaScript\
    \ code dynamically change their values.\n\nFor example, changing the visibility\
    \ style value to hidden will cause a layer to disappear from view.\n\nConversely\
    \ a layer initially created with a visibility style value of hidden can be revealed\
    \ by changing that value to visible.\n\nThe following script toggles the visibility\
    \ of a single layer with onmouseover and mouseout event-handlers, like this:\n\
    \n```\n<a href=\"javascript://\" onmouseover=\"show_apple\"\nonmouseout=\"hide_apple()\"\
    >Apple Link</a>\n```\n\nThis script could easily toggle several layers for even\
    \ greater effect:\n\n![](img/d78298d3338ec680a024bbc83e78b297_163_0.png)\n\n```\n\
    // a function to reveal a layer\nfunction show_apple() {\n  // reference the layer\
    \ by id\n  var obj = getElementById(\"lyr\");\n  // show the layer\n  obj.style.visibility\
    \ = \"visible\";\n}\n\n// a function to hide a layer\nfunction hide_apple() {\n\
    \  // reference the layer by id\n  var obj = getElementById(\"lyr\");\n  // hide\
    \ the layer\n  obj.style.visibility = \"hidden\";\n}\n```\n\nThe illustrations\
    \ on the opposite page demonstrate the effect of this script when the user places\
    \ the cursor over, and off, the hyperlink."
- md: "\n...cont'd\n\nApple Link\n\nApple, Link\n\nThe javascript: protocol specifier\
    \ will appear in the status bar in place of a target url address.\n\n# Dynamic\
    \ content\n\nJavaScript can write content on a layer without affecting the contents\
    \ elsewhere on the page.\n\nThe position of the layer will remain unaltered but\
    \ the height of the layer will be automatically increased if the content will\
    \ not fit into the existing layer size.\n\nAlso text will automatically wrap intelligently\
    \ at the layer border; words will not be split.\n\nThe JavaScript example for\
    \ this feature will create a layer, then dynamically the user-entered text onto\
    \ the layer when the user pushes the push button.\n\n```javascript\n// create\
    \ a <div> layer\ndocument.write(\"<div id='lyr' style='position:absolute;top:90px;left:10px;width:200px;height:10px;z-index:10;background-color:orange\"\
    ></div>\");\n\n// a function to write a user-entered string on a layer\nfunction\
    \ write_entry() {\n  // get the string entry\n  var str = document.forms.f.txt.value;\n\
    \n  // reference the layer by id\n  var obj = document.getElementById(\"lyr\"\
    );\n\n  // open the layer document\n  obj.document.open();\n\n  // write the string\n\
    \  obj.document.write(str);\n\n  // close the layer document\n  obj.document.close();\n\
    }\n```\n\nThe illustrations on the facing page demonstrate the effect of this\
    \ script when the user enters a string into the text field then clicks the push\
    \ button.\n\n...cont'd\n\n# Slide show\n\nJavaScript can rotate images to create\
    \ an automatic slide show that will update the current image after a predetermined\
    \ interval.\n\nIn this script a preload routine first downloads all the images\
    \ into the browser's cache to be readily available for display.\n\nRotation speed\
    \ in milliseconds is specified by the value assigned to the variable named pause.\n\
    \nThe variable named n is a counter that is incremented by the rotate() timer\
    \ function and used to display the image at that index number in the imgs[] array.\n\
    \nIt is important that all the images should have the same dimensions and be small\
    \ file sizes to avoid download delays.\n\n```javascript\n// store an interval\
    \ in a variable\nvar pause = 3000;\n// create and initialize a counter\nvar n\
    \ = 0;\n// create an array of image file names\nvar imgs = new Array(\"butterfly.gif\"\
    , \"globe.gif\", \"fish.gif\", \"clock.gif\");\n\n// preload all the images\n\
    var preload = new Array();\nfor(var i = 1; i < imgs.length; i++) {\n  preload[i]\
    \ = new Image();\n  preload[i].src = imgs[i];\n}\n\n// a function to display each\
    \ image for the set interval\nfunction rotate() {\n  document.images.pic.src =\
    \ imgs[n];\n  ( n == (imgs.length - 1 )) ? n = 0 : n++;\n  setTimeout(\"rotate()\"\
    , pause);\n}\n\n// specify the onload event-handler\nwindow.onload = rotate;\n\
    ```\nslide-show.js\n\nSimply adding more filenames to the imgs[] array will extend\
    \ the slide without further coding.\n\nThe HTML code used with the JavaScript\
    \ slide assigns the name pic to the original image so the script may address the\
    \ image object as document.images.pic:\n\n```html\n<img name=\"pic\" src=\"butterfly.gif\"\
    \ width=\"150\" height=\"150\"/>\n```\n\nEnsure that all images are the actual\
    \ size to be displayed so that the browser does not need to resize them.\n\n#\
    \ Tacking layer\n\nThe left coordinate of a layer object's style can be modified\
    \ by JavaScript to reposition the layer along the X axis.\n\nThe following example\
    \ moves a <div> layer that has an id of boat. This contains a sailboat image just\
    \ the left edge of the window. A timer function sails the boat across the window.\n\
    \nWhen the boat disappears off the right edge of the window JavaScript swaps the\
    \ image for a preloaded version of the sailboat image facing the opposite direction.\
    \ The script then sails it back across the screen from right to left.\n\nWhen\
    \ the boat disappears off the left edge of the window image reverts to the original\
    \ version that proceeds to sail to right and the boat continues to tack back and\
    \ forth.\n\nThe go_right variable determines the direction of travel. It is initially\
    \ set to true but it is reversed at each extreme.\n\nThe ext variable stores the\
    \ width of the window according to the browser running the script.\n\nThe set_sail()\
    \ function is initially called from the script to start the routine then is called\
    \ recursively from inside the function. Use an animated GIF with this script to\
    \ create even exciting results.\n\n```javascript\n// preload the swap image\n\
    var preload = new Image(); preload.src = \"sail_1.gif\";\n// set the initial direction\
    \ to right\nvar go_right = true;\n```\n\nThis script must be included in the <body>\
    \ section of the HTML document - after the <div> element is created.\n\n```javascript\n\
    // a function to move a <div> across the page\nfunction set_sail() {\n    // get\
    \ the div object\n    var obj = document.getElementById(\"boat\");\n    \n   \
    \ // get the window width\n    var ext;\n    if(document.body.clientWidth) ext\
    \ = document.body.clientWidth;\n    if(window.innerWidth) ext = window.innerWidth;\n\
    \n    // move by 1 pixel in set direction\n    if(go_right ) {\n        obj.style.left\
    \ = (parseInt(obj.style.left)+1)+\"px\";\n    } else {\n        obj.style.left\
    \ = (parseInt(obj.style.left)-1)+\"px\";\n    }\n\n    // change direction at\
    \ the right extreme\n    if(parseInt(obj.style.left ) >= ( ext + 5 )) {\n    \
    \    go_right=false;\n        document.images.boat_image.src = \"sail_1.gif\"\
    ;\n    }\n\n    // change direction at the left extreme\n    if(parseInt(obj.style.left)\
    \ <= -75) {\n        go_right = true;\n        document.boat_image.src = \"sail_1.gif\"\
    ;\n    }\n\n    // set the interval to call this function\n    window.setTimeout(\"\
    set_sail()\", 50);\n}\n\n// start the routine\nset_sail();\n```\n\nThe positional\
    \ pixel values have \"px\" tacked on the end (e.g. left=\"70px\") so the parseInt()\
    \ method is needed to extract the integer part for manipulation.\n\n# Scrolling\
    \ layer\n\nWhere the previous example modified the left property of a layer object's\
    \ style, this example manipulates the layer's top property to move a layer higher\
    \ or lower on the Y axis.\n\nThis example moves a <div> that has an id of chopper:\
    \ the layer contains a simple helicopter image.\n\nHTML code adds rollover hyperlinks\
    \ that call JavaScript functions but have a void target.\n\nWhen the user places\
    \ the cursor over the hyperlink \"Soar\" a timer function increments the value\
    \ of the top property so the layer moves vertically higher in the window.\n\n\
    Placing the cursor over the hyperlink \"Sink\" has the opposite effect and lowers\
    \ the layer vertically in the window.\n\nIn each case the timer function is cancelled\
    \ when the cursor moves away from the hyperlink and the movement of the layer\
    \ is discontinued.\n\n| Scrolling Layer |\n| File Edit View Favorites Tools Help\
    \ |\n| Soar Sink |\n| javascript:// // Local intranet |\n"
  mdcn: "\n\n...续\n\nApple 链接\n\nApple, Link\n\n`javascript:` 协议标识符将出现在状态栏中，取代目标 URL\
    \ 地址。\n\n# 动态内容\n\nJavaScript 可以在层上写入内容，而不影响页面其他地方的内容。\n\n层的位置将保持不变，但如果内容无法适应现有的层尺寸，层的高度将自动增加。\n\
    \n此外，文本将在层边界处进行智能自动换行；单词不会被拆分。\n\n此功能的 JavaScript 示例将创建一个层，然后当用户按下按钮时，动态地将用户输入的文本绘制到该层上。\n\
    \n```javascript\n// 创建一个 <div> 层\ndocument.write(\"<div id='lyr' style='position:absolute;top:90px;left:10px;width:200px;height:10px;z-index:10;background-color:orange\"\
    ></div>\");\n\n// 一个在层上写入用户输入字符串的函数\nfunction write_entry() {\n  // 获取输入的字符串\n\
    \  var str = document.forms.f.txt.value;\n\n  // 通过 id 引用层\n  var obj = document.getElementById(\"\
    lyr\");\n\n  // 打开层文档\n  obj.document.open();\n\n  // 写入字符串\n  obj.document.write(str);\n\
    \n  // 关闭层文档\n  obj.document.close();\n}\n```\n\n对面上的插图演示了用户在文本字段中输入字符串并点击按钮时，该脚本的效果。\n\
    \n...续\n\n# 幻灯片\n\nJavaScript 可以旋转图像以创建自动幻灯片，它会在预定间隔后更新当前图像。\n\n在此脚本中，一个预加载程序首先将所有图像下载到浏览器缓存中，以便随时显示。\n\
    \n以毫秒为单位的旋转速度通过赋值给变量 `pause` 来指定。\n\n变量 `n` 是计数器，由 `rotate()` 定时函数递增，并用于显示 `imgs[]`\
    \ 数组中该索引处的图像。\n\n所有图像应该具有相同的尺寸且文件大小较小，这样可以避免下载延迟。\n\n```javascript\n// 在变量中存储间隔\n\
    var pause = 3000;\n// 创建并初始化计数器\nvar n = 0;\n// 创建图像文件名数组\nvar imgs = new Array(\"\
    butterfly.gif\", \"globe.gif\", \"fish.gif\", \"clock.gif\");\n\n// 预加载所有图像\n\
    var preload = new Array();\nfor(var i = 1; i < imgs.length; i++) {\n  preload[i]\
    \ = new Image();\n  preload[i].src = imgs[i];\n}\n\n//set间隔显示每张图像的函数\nfunction\
    \ rotate() {\n  document.images.pic.src = imgs[n];\n  ( n == (imgs.length - 1\
    \ )) ? n = 0 : n++;\n  setTimeout(\"rotate()\", pause);\n}\n\n// 指定 onload 事件处理器\n\
    window.onload = rotate;\n```\nslide-show.js\n\n只需向 `imgs[]` 数组中添加更多文件名即可扩展幻灯片，无需进一步编码。\n\
    \n配合 JavaScript 幻灯片使用的 HTML 代码为原始图像分配名称 `pic`，以便脚本可以通过 `document.images.pic` 访问图像对象：\n\
    \n```html\n<img name=\"pic\" src=\"butterfly.gif\" width=\"150\" height=\"150\"\
    />\n```\n\n确保所有图像均为显示所需的实际尺寸，这样浏览器就不需要对其调整大小。\n\n# 调头层 (Tacking layer)\n\n层对象样式的左坐标可以通过\
    \ JavaScript 进行修改，以便沿 X 轴重新定位层。\n\n以下示例移动了一个 id 为 `boat` 的 `<div>` 层。该层包含一艘帆船图像，正位于窗口的左边缘。一个定时函数让帆船横跨窗口。\n\
    \n当帆船从窗口右侧边缘消失时，JavaScript 将图像替换为预加载的、朝向相反的帆船图像。然后脚本让它从右向左再次穿过屏幕。\n\n当帆船从窗口左侧边缘消失时，图像恢复为原始版本，并继续向右侧航行，帆船继续往回反复调头。\n\
    \n`go_right` 变量决定移动方向。它初始设置为 `true`，但在每个极端位置处都会反转。\n\n`ext` 变量根据运行脚本的浏览器存储窗口宽度。\n\
    \n`set_sail()` 函数最初从脚本中调用以启动程序，然后在函数内部被递归调用。使用此脚本配合动画 GIF，可以创建出更令人兴奋的结果。\n\n```javascript\n\
    // 预加载切换图像\nvar preload = new Image(); preload.src = \"sail_1.gif\";\n// 设置初始方向为右\n\
    var go_right = true;\n```\n\n此脚本必须包含在 HTML 文档的 `<body>` 部分——在创建 `<div>` 元素之后。\n\
    \n```javascript\n// 一个让 <div> 跨越页移动的函数\nfunction set_sail() {\n    // 获取 div 对象\n\
    \    var obj = document.getElementById(\"boat\");\n    \n    // 获取窗口宽度\n    var\
    \ ext;\n    if(document.body.clientWidth) ext = document.body.clientWidth;\n \
    \   if(window.innerWidth) ext = window.innerWidth;\n\n    // 按设定方向移动 1 像素\n  \
    \  if(go_right ) {\n        obj.style.left = (parseInt(obj.style.left)+1)+\"px\"\
    ;\n    } else {\n        obj.style.left = (parseInt(obj.style.left)-1)+\"px\"\
    ;\n    }\n\n    // 在右边界处改变方向\n    if(parseInt(obj.style.left ) >= ( ext + 5 ))\
    \ {\n        go_right=false;\n        document.images.boat_image.src = \"sail_1.gif\"\
    ;\n    }\n\n    // 在左边界处改变方向\n    if(parseInt(obj.style.left) <= -75) {\n    \
    \    go_right = true;\n        document.boat_image.src = \"sail_1.gif\";\n   \
    \ }\n\n    // 设置调用此函数的间隔\n    window.setTimeout(\"set_sail()\", 50);\n}\n\n//\
    \ 启动程序\nset_sail();\n```\n\n位置像素值末尾附加了 \"px\"（例如 left=\"70px\"），因此需要使用 `parseInt()`\
    \ 方法提取整数部分进行操作。\n\n# 滚动层\n\n上一个示例修改了层对象样式的 `left` 属性，而本示例则通过操纵层的 `top` 属性来使层在\
    \ Y 轴上向上或向下移动。\n\n此示例移动了一个 id 为 `chopper` 的 `<div>`：该层包含一个简单的直升机图像。\n\nHTML 代码添加了悬停超链接，这些链接调用\
