  - "[PAGE 157]\n\n# Submit\n\nThe **Submit** event occurs when the user pushes a\
    \ submit button in a form. The `onsubmit` event-handler may call a function to\
    \ carry out validation before submission.\n\nIf the `onsubmit` event-handler returns\
    \ `false`, for instance when form validation fails, the form data will not be\
    \ sent.\n\nThis example performs basic email address validation and provides the\
    \ user with an `alert()` message if validation fails. The function is called by\
    \ the HTML **onsummit** attribute of the `<form>`.\n\n![](img/d78298d3338ec680a024bbc83e78b297_157_0.png)\n\
    \n```\n// a function to validate basic email address format\nfunction validation()\n\
    {\n  // seek an @ character in the address\n  if(document.forms.email.value.indexOf(\"\
    @\") == -1)\n    // if absent display a message\n    alert(\"Email address is\
    \ absent or incorrect\");\n    // ...and do not submit the form\n    return false;\n\
    }\n```\n\nThe onsubmit event-handler is not invoked by use of `form.submit()`\
    \ method in JavaScript.\n\n| Submit Event |\n| File Edit View Favorites Tools\
    \ Help |\n| Enter your email address: user_a_domain.com [Submit] |\n| Microsoft\
