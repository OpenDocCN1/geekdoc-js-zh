  mdcn: "\n\n# 在 HTML 中引入 JavaScript\n\n为了在 Web 文档中引入 JavaScript，可以在 HTML 代码中定义一个脚本块（script\
    \ block）。\n\n脚本块可以定义在 HTML 代码的任何位置，尽管通常位于文档的 `head` 部分，即在 `<head>` 和 `</head>`\
    \ 标签之间。\n\n当浏览器加载文档时，它会按顺序读取（解析）代码。因此，将脚本块放在文档的 `head` 中可以确保 JavaScript 代码在其他\
    \ HTML 代码和文档 `body` 内容之前被解析。\n\n脚本块的样式所示：\n\n``` even<script type = \"text/javascript\"\
    >\n</script>\n```\n\n实际代码可以添加在 HTML `<script>` 和 `</script>` 标签之间。\n\n或者，也可以将所有\
    \ JavaScript 代码写在一个 JavaScript 文件中，将 JavaScript 代码与 HTML 代码分离。这仅仅是一个文本文件，以 `.js`\
    \ 扩展名保存，且不包含任何 HTML 标签。\n\n脚本引用仍应放置在文档的 `head` 部分，并添加 `src` 属性以引导浏览器指向 JavaScript\
    \ 文件的 URL，如例所示：\n\n```\n<script type = \"text/javascript\" src = \"mycode.js\"\
    >\n</script>\n```\n\n注意，仍然需要 `<script>` 闭合标签。\n\n![](img/d78298d3338ec680a024bbc83e78b297_10_0.png)\n\
    \n这种方法比在 HTML 文档的脚本块中编写代码更好，因为它使代码更容易维护，避免了 JavaScript 与 XML 之间的冲突，并允许 JavaScript\
    \ 代码被多个 HTML 文档访问。\n\n书中列出的所有 JavaScript 示例都是与其对应的 HTML 文件同命名的 JavaScript 文件。例如，`hello.html`\
    \ 调用了 `hello.js` 中的 JavaScript 代码。\n\n## Hello World\n\n要显示 JavaScript alert 对话框只需调用内置的\
    \ JavaScript `alert()` 函数，如下所示：\n\n```\nalert(\"Hello World\");\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_11_0.png)\n\
    \n现在可以通过添加指定其类型和 URL 地址的 `<script>` 元素将此脚本包含在 HTML 文档中：\n\n```html\n<head>\n \
    \ <title>Hello World</title>\n  <script type=\"text/javascript\" src=\"hello-alert.js\"\
    ></script>\n</head>\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_11_1.png)\n\
    \n当此文档加载到 Web 浏览器引擎时，会执行 JavaScript 代码中包含的指令。\n\n> [书中所有的示例都使用了这种在 HTML 文档中引入\
    \ JavaScript 文件的方法。]\n\n在这种情况下，JavaScript 代码会导致浏览器打开一个 `alert()` 对话框，带有括号内引号内包含的消息。\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_11_2.png)\n\n括号内的双引号实际上不会作为消息的一部分出现，因为它们仅被\
    \ JavaScript 用来表示字符字符串，该字符串即消息本身的文本内容。\n\n![](img/d78298d3338ec680a024bbc83e78b297_11_3.png)\n\
    \nJavaScript 中所有的文本字符串都是以此方式包含的。\n\n## 语法规则\n\n注意，对应页 JavaScript 语句末尾有一个分号，以符合所需的\
    \ JavaScript 语言语法规则。\n\n这必须添加到每个 JavaScript 语句的末尾——就像在英语语法规则中使用句号来结束句子一样。\n\n\
    最重要的是，JavaScript 是一种区分大小写的语言，其中 \"ALERT\"、\"Alert\" 和 \"alert\" 被视为三个不同的单词。\n\n\
    所有的 JavaScript 关键字均为小写，因此在之前的代码示例中使用 `ALERT(\"Hello World\")` 或 `Alert(\"Hello\
    \ World\")` 将无法调用 JavaScript `alert()` 函数。\n\n![](img/d78298d3338ec680a024bbc83e78b297_12_0.png)\n\
    \n空格、制表符和换行统称为空白字符，JavaScript 会完全忽略它们，因此可以对代码进行格式化和缩进，使其更易于人类阅读。\n\n在 JavaScript\
    \ 代码中添加注释作为解释通常很有用。解析器会将 `//` 到该行末尾之间的任何文本视为单行注释，并会忽略它。同样，`/*` 和 `*/` 之间的任何文本（无论多少行）都会被忽略。\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_12_1.png)\n\n```\n/* 这里是关于\n// 代码的介绍\n\
    // 使用了多行注释 */\n\n// 这是一个单行注释\n\n// 显示问候\nalert(\"Hello World\");\n```\n\n最好避免使用过多的注释——这会大幅增加\
    \ JavaScript 文件的大小。\n\n## 关键字\n\n下表包含了 JavaScript 语言的一部分的关键字。在为变量、函数或标签选择标识符名称时不能使用这些关键字：\n\
    \n| break | do | function | null | typeof |\n|---|---|---|---|---|\n| case | else\
    \ | return | var |\n| continue | export | import | switch | void |\n| default\
    \ | false | in | this | while |\n| delete | for | new | true | with |\n\n![](img/d78298d3338ec680a024bbc83e78b297_13_0.png)\n\
    \n此外，JavaScript 保留了下表中列出的所有单词，以便可能包含在 JavaScript 语法中——因此这些不能作为标识符名称。虽然需要避免的单词看起来很多，但这是一个真实的问题——这只是需要记住的一点。\n\
    \n| abstract | debugger | goto | package | synchronized |\n|---|---|---|---|---|\n\
    | boolean | double | implements | private | throw |\n| byte | enum | instanceof\
    \ | protected | throws |\n| catch | extends | int | public | transient |\n| char\
    \ | final | interface | short | try |\n| class | finally | long | static |\n|\
    \ const | float | native | super |\n\n## 变量\n\n变量是 JavaScript 程序中存储数据以进行操作的地方。\n\
    \n可以使用字母、数字和下划线字符，但变量名不能以数字开头。为变量选择有意义的名称使脚本更易读。\n\n![](img/d78298d3338ec680a024bbc83e78b297_14_0.png)\n\
    \nabc\nmy_variable\n\n使用 JavaScript 关键字创建一个新变量：\n\n![](img/d78298d3338ec680a024bbc83e78b297_14_1.png)\n\
    \n```javascript\n// 创建变量并赋值\nvar message = \"My First Variable\";\n\n// 显示变量中的值\n\
    alert( message );\n```\n\n字符串存储在名为 message 的变量中。调用 `alert()` 函数显示该变量。\n\n![](img/d78298d3338ec680a024bbc83e78b297_14_2.png)\n\
    \n## 数据类型\n\nJavaScript 是一种弱类型语言，因此变量可以存储数字、字符串或布尔值（例如 true 或 false）。这不像 C++ 和\
    \ Java 等编程语言，它们需要声明特定类型的变量才能存储相应类型的数据。\n\n```javascript\n// 初始化数字变量\nvar a = 0.6;\n\
    \n// 初始化字符串\nvar b = \"JavaScript in easy steps\";\n\n// 初始化布尔变量\nvar c = false;\n\
    ```\n\n![](img/d78298d3338ec680a024bbc83e78b297_15_0.png)\n\n```javascript\n//\
    \ 显示每个变量的数据类型\nalert(typeof a + \"\\n\" + typeof b + \"\\n\" + typeof c);\n```\n\
    \n上面的示例创建了 JavaScript 支持的三种不同类型的变量。\n\n![](img/d78298d3338ec680a024bbc83e78b297_15_1.png)\n\
    \n这三个值首先传递给 `alert()` 函数，然后使用 JavaScript 关键字 `typeof` 返回它们的数据类型，显示在下面的 alert 对话框中。括号内的代码\
    \ `\"\\n\"` 在 alert 对话框中换行显示每个值。\n\n| JavaScript 应用 |\n|---|\n| number |\n| string\
    \ |\n| boolean |\n\n## 转义序列\n\n当字符串中的字符前面有一个斜杠字符时，紧随斜杠的字符产生特殊影响。这被称为转义序列，因为它允许该字符避免被识别为\
    \ JavaScript 语法的一部分。\n\n下表列出了更多的转义序列：\n\n![](img/d78298d3338ec680a024bbc83e78b297_16_0.png)\n\
    \n| | 退格 |\n|---|---|\n| \\b | 分页符 |\n| \\n | 换行 |\n| \\r | 回车 |\n| \\' | 单引号\
    \ |\n| \" | 双引号 |\n| \\ | 单斜杠字符 |\n\n转义序列 `\\\"` 有助于在字符串内部包含双引号，而不会导致字符串本身终止，如例所示：\n\
    \n```javascript\n// 显示带有转义引号的字符串\nalert(\"We all say \\\"JavaScript is great!\\\
    \"\" );\n```\nescapes.js\n\n![](img/d78298d3338ec680a024bbc83e78b297_16_1.png)\n\
    \n"
