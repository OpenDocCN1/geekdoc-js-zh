    \ is simply a text document, that is saved with a .js file extension, and contains\
    \ no HTML tags whatsoever.\n\nThe script reference should still be placed in the\
    \ document head section with an added src attribute pointing the browser to the\
    \ URL of the JavaScript file, like this example:\n\n```\n<script type = \"text/javascript\"\
    \ src = \"mycode.js\">\n</script>\n```\n\nNotice that the <script> closing tag\
    \ is still required.\n\n![](img/d78298d3338ec680a024bbc83e78b297_10_0.png)\n\n\
    This is a better method than writing the code in a script block within the HTML\
