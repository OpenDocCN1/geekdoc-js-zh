  - '[PAGE 181]


    # The products page


    The example in this chapter follows the development of an on-line order that starts
    with a page from which the user may select quantities of items to order.


    The page is framed with a left-hand panel named menu and a right-hand larger frame
    named main.


    ![](img/d78298d3338ec680a024bbc83e78b297_181_0.png)


    Typically the menu frame will remain constantly displayed while the main frame
    will display different pages as the user navigates around the site.


    A button is added at the bottom of the form that will advance the user to the
    next stage of the order process.


    In the form, depicted below, the user has entered quantity requirement for some
    of the illustrated products:


    ![](img/d78298d3338ec680a024bbc83e78b297_181_1.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_181_2.png)


    The frame-holder document for this example is named e-commerce.html. It displays
    menu.html in the menu frame and (initially) products.html in the main frame as
    shown above.'
  - "[PAGE 182]\n\n# # A hidden form\n\nThe page in the menu frame contains a hidden\
    \ form named m (for memory) that will retain the order data while the pages in\
    \ the main frame are changed.\n\n![](img/d78298d3338ec680a024bbc83e78b297_182_0.png)\n\
    \nIt consists of input items that mirror those of the form named f on the product\
    \ page together with inputs for customer name, account number and order number.\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_182_1.png)\n\n```\n<-- a form to store\
    \ order data --\n<form id=\"m\" action=\"\" method=\"post\">\n<input type=\"hidden\"\
    \ name=\"customer\" value=\"\"/>\n<input type=\"hidden\" name=\"accountname\"\
    \ value=\"\"/>\n<input type=\"hidden\" name=\"ordernum\" value=\"\"/>\n<input\
    \ type=\"hidden\" name=\"ball\" value=\"\"/>\n<input type=\"hidden\" name=\"hoop\"\
    \ value=\"\"/>\n<input type=\"hidden\" name=\"cone\" value=\"\"/>\n</form>\n```\n\
    \nThe onclick attribute of the button on the products page calls a JavaScript\
    \ function that fills the values of the hidden form m with the values entered\
    \ by the user into the products page f. It then loads a new page into the main\
    \ frame.\n\n![](img/d78298d3338ec680a024bbc83e78b297_182_2.png)\n\n```\n// a function\
    \ to store values in a form in another frame\nfunction populate() {\n  // variables\
    \ for the form objects\n  var m = parent.frames.menu.document.forms.m;\n  var\
    \ f = document.forms.f;\n\n  // copy the values\n  m.ball.value = f.ball.value;\n\
    \  m.hoop.value = f.hoop.value;\n  m.cone.value = f.cone.value;\n\n  // load a\
    \ new page into this frame\n  window.location = \"customer.html\";\n}\n```"
  - "[PAGE 183]\n\n# Get the customer details\n\nThe next page in the main frame,\
    \ customer.html, requests the customer's name and account number.\n\nWhen the\
    \ user clicks the button on its page its onclick calls JavaScript function to\
    \ store the user input. It copies the values of the form inputs to the identically-named\
    \ hidden inputs in the memory form m in the menu frame.\n\n![](img/d78298d3338ec680a024bbc83e78b297_183_0.png)\n\
    \n```\n// a function to store values in a form in another frame\nfunction populate()\
    \ {\n  // variables for the form objects\n  var m = parent.frames.menu.document.forms.m;\n\
    \  var f = document.forms.f;\n\n  // copy the values\n  m.customer.value = f.customer.value;\n\
    \  m.accountnumber.value = f.accountnumber.value;\n\n  // load another page in\
    \ this frame\n  window.location = \"confirm.html\";\n}\n```\n\nAdd validation\
    \ routines to check that the user has made valid entries.\n\n![](img/d78298d3338ec680a024bbc83e78b297_183_1.png)\n\
