    \ | | | | |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| File | Edit | View\
    \ | Favorites | Tools | Help |\n| Operating system is Win32 | | | | | |\n| Done\
    \ | Local intranet | | | | |\n\n# Plugins information\n\nOn Netscape/Mozilla browsers\
    \ JavaScript can be used to discover information about any plugins that are installed\
