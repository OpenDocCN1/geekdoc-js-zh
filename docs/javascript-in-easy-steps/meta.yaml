  md: "# Break statement\n\nThe JavaScript break keyword is used to terminate the\
    \ execution of a loop prematurely.\n\nThe break keyword is situated inside the\
    \ statement block containing the code that the loop should execute and is preceded\
    \ by a conditional test.\n\nWhen the test condition is met the break statement\
    \ immediately terminates the loop and no further iterations are made.\n\nNotice\
    \ in the alert() output below that the counter value is still three because the\
    \ increment in the final iteration is not applied\n\nIn the following example\
    \ the conditional test will return true when the counter value reaches three:\n\
    \n```\nvar i = 0;\n// loop until the counter hits 6\nwhile(i < 6 )\n{\n  if( i\
    \ == 3 ) break;\n  i++;\n}\n// display the final counter value\nalert(\"BREAK\\\
    n\\nLoop stopped at \" + i\\);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_41_0.png)\n\
    \nThe break keyword is also used as a terminator with a switch statement.\n\n\
    |JavaScript Application |\nBREAK\nLoop stopped at 3\n[OK]"
  merge: -1
  pgno: 41
- img_proc: true
  md: "# Continue statement\n\nThe JavaScript continue keyword is used to break the\
    \ current\niteration of a loop.\n\nJust like the break keyword the continue keyword\
    \ is situated inside\nthe statement block containing the code that loop should\n\
    execute, preceded by a conditional test.\n\nWhen the test condition is met the\
    \ continue immediately\nstops the current iteration of the loop, but further iterations\
    \ are\nmade until until the loop ends.\n\nIn the example below the test condition\
    \ is met when the counter\nvalue reaches so the string concatenation that iteration\
    \ is\napplied but the loop continues on:\n\n```\nvar i = 0, str = \"\";\n// loop\
    \ until the counter hits 5\nwhile(i < 5)\n{\n  i++;\n  if (i == 3)continue;\n\
    \  str += i + \" \";\n}\n\n// display final counter value and all series numbers\n\
    alert(\"CONTINUE\\nLoop stopped:\"\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_42_0.png)\n\
    \nThe loop counter should be\nincremented before the\ncontinue is tested to avoid\n\
    creating an infinite loop.\n\n3. Making statements"
