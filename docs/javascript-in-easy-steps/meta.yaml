  mdcn: "\n\n## 动态内容\n\n`window.document.open()` 方法打开一个新的 HTML 文档，可以使用熟悉的 `window.document.write()`\
    \ 方法向其写入内容以创建动态内容。\n\n![](img/d78298d3338ec680a024bbc83e78b297_119_0.png)\n\n\
    将空字符串作为 URL 参数传递给 `open` 可以打开一个空窗口。\n\n内容写入完成后，应该通过 `window.document.close()`\
    \ 方法关闭文档流。\n\n下面的示例在上一章弹出窗口的基础上，通过从 JavaScript 写入内容而不是简单地加载现有的 HTML 文档：\n\n![](img/d78298d3338ec680a024bbc83e78b297_119_1.png)\n\
    \n```javascript\n// 用于创建一个动态弹出窗口的函数\nfunction popup() {\n  // 创建弹出窗口\n  var popwindow\
    \ = \n    window.open(\"\",*\",top=40,left=30,width=250,height=125);\n  // 打开弹出窗口的\
    \ HTML 文档\n  popwindow.document.open();\n  // 在弹出窗口中写入内容\n  popwindow.document.write(\"\
    <title>Pop-up</title>\");\n  popwindow.document.write(\"<Dynamic Pop-up Page<br/>\"\
    );\n  popwindow.document.write(\"<img src='dex.gif' alt=''>\");\n  // 记得最后关闭 HTML\
    \ 文档\n  popwindow.document.close();\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_119_2.png)\n\
    \n记住在双引号内使用单引号。\n\n![](img/d78298d3338ec680a024bbc83e78b297_119_3.png)\n\n118\
    \ | 快速上手 JavaScript\n\n## 最后修改\n\n`window.lastModified` 对象可以提供 Web 页面最后更新的日期和时间。这些数据通常由\
    \ Web 服务器发送的 HTTP 文件头提供 `document.lastModified`。在某些情况下，Web 服务器可能会省略此信息，因此 `document.lastModified`\
    \ 在这些情况下将返回零。\n\n通常，此数据用于指示用户最近更新 Web 页面的时间，让用户知道页面上的信息有多新。通常这些信息显示在页面底部，字体比页面正文小。\n\
    \n接接的示例首先测试 `document.lastModified` 是否提供了日期，然后将数据写入 HTML 文档：\n\n```javascript\n\
    // 检查是否存在 lastModified\nif( Date.parse(document.lastModified ) != 0 ) {\n  //\
    \ 如果存在，则写入一条说明该日期的消息\n  document.write(\n    \"Page last updated: \" + document.lastModified\
    \ + );\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_120_0.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_120_1.png)\n\
    \n包含此脚本代码的 `<script>` 块通常位于 HTML 文档 `<body>` 部分的最末尾。\n\n| 最后修改示例 | |\n| :--- |\
    \ :--- |\n| 文件 | 编辑 | 视图 | 工具 | 帮助 |\n| PERL 是一种由 Larry Wall 在 1987 年发明的通用编程语言。实用实用查询和报告语言\
    \ (PERL) 在全球范围内有一百万用户，是服务器端脚本的主要语言。对于许多人来说，它是 Web 开发的首选语言。 |\n| 页面最后更新于：04/06/2005\
    \ 12:52:53 |\n| 完成 | 本地域网 |\n\n## XYZ 坐标\n\n显示窗口中内容的物理位置可以使用称为 X、Y 和 Z 的坐标来引用。\n\
    \nX 坐标指定了距离窗口最左边缘的像素距离。\n\nY 坐标指定了距离窗口最顶边缘的像素距离。\n\nZ 坐标通过索引号指定了底部窗口层级之上层的堆叠位置：\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_121_0.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_121_1.png)\n\
    \n窗口左边缘的 X 坐标为零，窗口顶边缘的 Y 坐标也为零。\n\nX=50  Y=30 的位置将指向距离左边缘 50 像素、距离顶边缘 30 像素的位置。\n\
    \n底部窗口层的 Z 坐标索引值为零。层可以放置在该层之上，就像透明胶片一样，并被赋予唯一的 Z-index 值。\n\n一个窗口可能有许多层，但顶层始终具有最高的\
    \ Z-index 值。其下方的每个后续层将具有递减的较低 Z-index 值。\n\n## 动态层\n\nJavaScript 可以通过在 HTML 文档的\
    \ body 部分编写必要的 HTML 代码和样式表规则来动态创建层。这允许控制每一层的位置和外观。\n\n最重要的是，如果层发生重叠，它们的堆叠顺序可以由分配给它们的\
    \ z-index 值来决定——数字越大，图层在堆栈中的位置越高。下面的示例通过动态创建两个重叠层来模拟相反页面的插图。第二个（黄色）层在堆栈中的位置高于第一个（紫色）层。如果它们的\
    \ z-index 值反过来，层 1 为 20 而层 2 为 10，则紫色层将覆盖黄色层。\n\n![](img/d78298d3338ec680a024bbc83e78b297_122_0.png)\n\
    \n```javascript\n// 在 z-index 10 处写入层\ndocument.write(\"<div id='layer1' style='position:absolute;\
    \ top:20px; left:20px; width:80px; height:80px; background-color:purple; color:white;\
    \ z-index:10; border:1px solid black'>Layer #1</div>\");\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_122_1.png)\n\
    \n```javascript\n// 在 z-index 20 处写入层\ndocument.write(\"<div id='layer2' style='position:absolute;\
    \ top:40px; left:40px; width:80px; height:80px; background-color:yellow; z-index:20;\
    \ border:1px solid black'>Layer #2</div>\");\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_122_2.png)\n\
    \n## 透明层\n\nJavaScript 可以通过在 HTML 文档的 body 部分编写必要的 HTML 代码和样式表规则来动态创建层。这允许控制每一层的位置和外观。\n\
    \n最重要的是，如果层发生重叠，它们的堆叠顺序可以由分配给它们的 z-index 值来决定——数字越大，图层在堆栈中的位置越高。下面的示例通过动态创建两个重叠层来模拟相反页面的插图。第二个（黄色）层在堆栈中的位置高于第一个（紫色）层。如果它们的\
    \ z-index 值反过来，层 1 为 20 而层 2 为 10，则紫色层将覆盖黄色层。\n\n![](img/d78298d3338ec680a024bbc83e78b297_121.png)\n\
    \n除非另有指定，否则层将具有与文档相同的背景。或者可以通过设置其背景为透明来显式设置。透明层在这些层重叠时尤为重要。\n\n```javascript\n\
    // 写入一个透明层\ndocument.write(\"<div id='transparent-layer' style='position:absolute;\
    \ top:20px; left:20px; width:80px; height:80px; background-color:transparent;\
    \ z-index:10; border:1px solid black'>Layer #1</div>\");\n```\n\n"
