  md: "# Amend form\n\nThe onSubmit property of a form object can be used to execute\
    \ a JavaScript function just before the form data is sent to the server. This\
    \ may be when the user pushes an HTML submit button, when the form is sent with\
    \ the form object's submit() method.\n\nThe function will be executed then the\
    \ form will be submitted to the server. Usefully, this allows JavaScript to amend\
    \ the form so that the name=value pairs can be better used by a receiving CGI\
    \ script.\n\nIn the example below the HTML onSubmit attribute of the <form> add_zeros()\
    \ function just before the form data is sent to the server. This function ensures\
    \ any empty text input element gets a zero value assigned to it:\n\n![](img/d78298d3338ec680a024bbc83e78b297_140_0.png)\n\
    \n```\n// a function to assign zeros to empty text fields\nfunction add_zeros()\
    \ {\n  if(txt1.value == \"\") txt1.value = \"0\";\n  if(txt2.value == \"\") txt2.value\
    \ = \"0\";\n  if(txt3.value == \"\") txt3.value = \"0\";\n}\n```\n\nThe CGI script\
    \ acknowledges the name fields and the zero values:\n\n![](img/d78298d3338ec680a024bbc83e78b297_140_1.png)\n\
    \nCGI Parser Output\nFile Edit View Favorites Tools Help\nOutput:\n- Key: txt1\
    \ - Value: 100\n- Key: txt2 - Value: 0\n- Key: txt3 - Value: 0\nDone\nLocal intranet"
  merge: -1
  pgno: 140
- img_proc: true
  md: "# # Email address validation\n\nThe value of form elements may be validated\
    \ for correct format before the form is submitted.\n\nIn the following example\
    \ JavaScript tests the format of a text input string for the presence of @ and\
    \ dot characters will only submit the form if the email address validation passes:\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_141_0.png)\n\n```\n// a function to\
    \ validate an email address\nfunction send_if_valid() {\n  if(document.forms.f.email.value.indexOf(\"\
    @\") == -1 )\n    fail(\"No '@' in address\");\n  else {\n    var adr = document.forms.f.email.value.split(\"\
    \");\n    if(adr[0].length < 1) fail(\"User address absent\");\n    else if(adr[1].indexOf(\"\
    .\") == -1) fail(\"No dot\");\n    else if(adr[1].length < 3) fail(\"Domain incorrect\"\
    );\n    else document.forms.f.submit();\n  }\n}\n\n// a function to display an\
    \ error message\nfunction fail(msg) {\n  alert(\"Email Address Error:\\n\" + msg);\n\
    }\n```\n\n+   HOT TIP The function send_if_valid() is called from the HTML onclick\
    \ attribute of the button in this example.\n\n![](img/d78298d3338ec680a024bbc83e78b297_141_1.png)"
  merge: -1
