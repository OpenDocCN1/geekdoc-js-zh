  - "[PAGE 149]\n\n# Key down and key up\n\nA KeyDown event occurs when the user presses\
    \ a keyboard button and a KeyError event occurs when it is released. Typically\
    \ these are used together so that a single key depression will use two event-handlers.\n\
    \nThis example swaps an image and changes the value of a text box when a keyboard\
    \ key is pressed but reverts both to their original state when the key button\
    \ is released:\n\n```\n// Netscape/Mozilla capture events instruction\nif (navigator.name\
    \ == \"Netscape\") {\n    window.captureEvents(Event.KEYDOWN, Event.KEYUP);\n\
    }\n\n// a function to react to KEYDOWN events\nfunction isdown() {\n    document.images.bulb.src\
    \ = \"bulbon.gif\";\n    document.forms.f.txt.value = \"Key is Down\";\n}\n\n\
    // a function to react to KEYUP events\nfunction isup() {\n    document.images.bulb.src\
    \ = \"bulffoff.gif\";\n    document.forms.f.txt.value = \"Key is Up\";\n}\n\n\
    // define the event-handlers\ndocument.onkeydown = isdown;\ndocument.onkeyup =\
    \ isup;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_149_0.png)\n\nNotice\
    \ how the first lines of this script capture both KeyDown and KeyUp events for\
    \ Netscape/Mozilla browsers.\n\n![](img/d78298d3338ec680a024bbc83e78b297_149_1.png)\n\
    \n| KeyUp and KeyDown |\n| File | Edit | View | Favorites |\n|---|---|---|---|n|\
    \ | | | |\n| Key is Down |\n\n| KeyUp and KeyDown |\n| File | Edit | View | Favorites\
    \ |\n|---|---|---|---|n| | | | |\n| Key is Up |\n\n48 | JavaScript in easy steps"
  - "[PAGE 150]\n\n# Key codes\n\nThe KeyDown event can also be used to get the Unicode\
    \ character code number of a key depression.\n\nThis example looks for the Y and\
    \ N character codes, in both upper and lower case, then branches the script according\
    \ to the value.\n\n```\n// Netscape/Mozilla capture events instruction\nif (navigator.appName\
    \ == \"Netscape\")\nwindow.captureEvents ( Event.KEYDOWN );\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_150_0.png)\n\
    \n```\nfunction showkey(e) {\n  var msg = \"\", fwd = \"Y pressed\";\n```\n\n\
    ```\n// check key codes in Netscape/Mozilla browsers\nif(navigator.appName ==\
    \ \"Netscape\") {\n  if(e.which == 89 || e.which == 121 ) msg = fwd;\n  if(e.which\
    \ == 78 || e.which == 110) msg = hlt;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_150_1.png)\n\
    \nUnicode values for common characters are the same as ASCII codes so in this\
    \ Y=89, N=78 y=121 and n=110.\n\n```\n// check key codes in Internet Explorer\n\
    if(navigator.appName == \"Microsoft Internet Explorer\") {\n  if(event.keyCode==88\
    \ || event.keyCode==121)msg = fwd;\n  if(event.keyCode==78 || event.keyCode==110)msg\
    \ = hlt;\n```\n\n```\n// display the appropriate message\nif(msg != \"\") alert(msg);\n\
    ```\n\n```\n// define the event-handler\ndocument.onkeydown=showkey;\n```\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_150_2.png)"
  - "[PAGE 151]\n\n# Load\n\nThe Load event does not occur until all the HTML elements\
    \ on a Web page have completely loaded. This means that the onload event-handler\
    \ will only run after all the elements are present.\n\nIf JavaScript is to modify\
    \ elements of the document <body> section those elements must be loaded to avoid\
    \ receiving a script error.\n\nTypically the onload event-handler will call a\
    \ JavaScript function, often named init(), that will initialize a number of values.\n\
    \nThis example sets the HTML page colors, then it assigns a value to a variable\
    \ which it subsequently assigns to a text box:\n\n![](img/d78298d3338ec680a024bbc83e78b297_151_0.png)\n\
    \n```\n// a function to react to the LOAD event\nfunction init() {\n  // set foreground\
    \ and background colors\n  document.bgColor = \"orange\";n  document.fgColor =\
    \ \"blue\";\n\n  // store a string then display it in a form field\n  var str\
    \ = \"The Page is Loaded\";\n  document.forms.f.txt.value = str;\n\n  // specify\
    \ the onload event-handler\n  window.onload = init;\n```\n\nA HTML event-handler\
    \ assigned to the onload attribute of the <body> tag would replace that assigned\
    \ in the script.\n\n![](img/d78298d3338ec680a024bbc83e78b297_151_1.png)"
  - "[PAGE 152]\n\nThe Unload event occurs whenever the browser unloads a document\
    \ from a new window, or frame, usually when the user navigates to a new URL.\n\
    \nThe unload event-handler may call a final JavaScript function to be run just\
    \ before the document unloads. When a frames page is unloaded the onunload event-handler\
    \ of each frame may call a final function.\n\nThe unload event-handler is useful\
    \ to save the final state of data on that page in a cookie or by submission to\
    \ the server.\n\nIt is also used to open new pop-up windows containing further\
    \ information that the user may find useful.\n\nThe example below illustrates\
    \ the use of the unload event-handler to open a new pop-up window:\n\n```\n//\
    \ a function to react to the UNLOAD EVENT\nfunction leaving() {\n  // open a HTML\
    \ document in a pop-up window\n  var win = window.open(\"finally.html\", \"\"\
    ,\n  \"top=50,left=50,width=300,height=100\") );\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_152_0.png)\n\
    \n```\n// specify the unload event-handler\nwindow.onunload = leaving;\n```\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_152_1.png)\n\n| Unload Event | | | |\n\
    |---|---|---|---||\n| File Edit View Favorites Tools Help |\n| Go to | And finally...\
    \ We're sorry to see you go - Visit a similar site ?"
  - '[PAGE 153]


    # Focus


    The Focus event occurs when the user clicks on a form element or on a window to
    direct the browser''s focus.


    The onfocus event-handler can call a JavaScript function when the focus is received.


    A HTML onfocus attribute can be added to form elements to specify a function to
    execute when it receives focus, like...


    ```

    <input type="text" name="txt1"

    value="Enter quantity here" onfocus="wipe(this)"

    <input type="text" name="txt2"

    value="Enter data here" onfocus="wipe(this)">

    ```


    In the example below, the text inputs initially display the strings assigned to
    their value attributes.


    When the user clicks each text input it receives focus so the wipe(this) function
    assigns an empty string to its value attribute. This clears the displayed text
    and places the cursor in the appropriate position ready for the user to input
    text into that field.


    ```

    // a function to clear a text input

    function wipe(obj ) {


    // clear the form field

    obj.value=""

    // reset the focus

    obj.focus();

    }

    ```


