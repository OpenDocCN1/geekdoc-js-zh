  md: "# Mouse out\n\nA MouseOut event occurs when the user moves the cursor away\
    \ from a HTML hyperlink on a Web page.\n\nThe anchor <a> element can specify for\
    \ the MouseOut event by assigning a JavaScript function call to the HTML onmouseout\
    \ attribute, like this:\n\n```\n<a href=\"target.html\" onmouseout=\"do_mouseout()\"\
    \nonmouseover=\"do_mouseover()\">\n```\n\nMost frequently event-handler will perform\
    \ an image swap to return an image to its original state in a rollover.\n\nThe\
    \ following example builds on the previous example by adding an onmouseout event-handler\
    \ to change the value of a text box when the cursor moves off the link:\n\n```\n\
    // a function to react to the MOUSEOUT event\nfunction do_mouseout()\n{\n    document.forms.f.txt.value\
    \ = \"Mouse is Off the link\";\n}\n```\n\n```\n// a function to react to the MOUSEOVER\
    \ event\nfunction do_mouseover()\n```\n\n```\n{\n    document.forms.f.txt.value\
    \ = \"Mouse is Over the link\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_146_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_146_1.png)\n\nThis illustration shows\
    \ the text field after the cursor has moved over the image.\n\n![](img/d78298d3338ec680a024bbc83e78b297_146_2.png)"
