    # Assignment operators


    The operators are commonly used in JavaScript to assign values are all listed
    in the table below. All except the simple = assign operator is a shorthand form
    of a longer expression so each equivalent is also given for clarity.


    | Operator | Example | Equivalent |

    |---|---|---|\| = | a = b | a = b |

    | += | a += b | a = (a + b) |

    | -= | a -= b | a = (a - b) |

    | *= | a *= b | a = (a * b) |

    | /= | a /= b | a = (a / b) |

    | %= | a %= b | a = (a % b) |


    ![](img/d78298d3338ec680a024bbc83e78b297_27_0.png)


    It is important to think of the = operator as meaning "assign" rather than "equals"
    to avoid confusion with the == equality operator.


    In the example the variable a is assigned the value that is contained in the variable
    name b to become its new value.


    The += operator is most useful and has been used in earlier examples to add a
    second string to an existing string. In the table example the += operator adds
    the value contained in variable a to the value contained in the variable name
    b then assigns the result to become the new value contained in variable a.


    All other operators in the table work in the same way – making the arithmetical
    operation between the two values first, then assigning the result to the first
    variable to become its new value.'
