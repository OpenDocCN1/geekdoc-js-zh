    }\n\n//一个隐藏层的函数\nfunction hide_apple() {\n  //通过 id 引用层\n  var obj = getElementById(\"\
    lyr\");\n  // 隐藏层\n  obj.style.visibility = \"hidden\";\n}\n```\n\n[/content]\
