  md: "# Click buttons\n\nValues assigned in the HTML code may be reassigned by JavaScript\
    \ so that a button will perform a different action.\n\nIn the example below a\
    \ HTML onclick attribute specifies that the first() function will be called when\
    \ the button is pushed:\n\n```\n<form id=\"f\" method=\"post\" action=\"\">\n\
    <input type=\"button\" name=\"btn1\" value=\"Click Me\"\nonclick=\"first()\"></form>\n\
    ```\n\nThe first() function assigns a string to a variable, then specifies a new\
    \ event-handler function called second() to the button's onclick attribute. Subsequently\
    \ pushing the button will call the second() function and execute the statement\
    \ contains.\n\n![](img/d78298d3338ec680a024bbc83e78b297_127_0.png)\n\n```\n//\
    \ create a global variable\nvar msg;\n\n// a function to store an initial message\n\
    function first() {\n  msg = \"This message was left by the first function\";\n\
    \  // assign another function to the button\n  document.forms.f.btn1.onclick =\
    \ second;\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_127_1.png)\n\nWhen\
    \ assigning event-handler functions only assign the name without any brackets.\n\
    \n```\n// a function to store a second message and display both\nfunction second()\
    \ {\n  msg += \"\\nHi, I\\m the second function\";\n  alert(msg);\n}\n```\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_127_2.png)"
  merge: -1
  pgno: 127
