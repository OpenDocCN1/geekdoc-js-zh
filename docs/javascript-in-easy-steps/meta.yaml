  - "[PAGE 50]\n\n# Reverse element order\n\nArrays can be used to contain a file\
    \ name or complete URL address in each element or with dynamic features in Web\
    \ pages.\n\nOne such popular use is JavaScript slide shows that rotate series\
    \ of images with specified interval between each one.\n\n![](img/d78298d3338ec680a024bbc83e78b297_50_0.png)\n\
    \nAn array is used to hold the URL of each image in its elements so that the script\
    \ can easily reference them by array index.\n\nIf the slide show is required to\
    \ reverse after displaying the final image, rather than start over the first image,\
    \ this can be achieved by reversing the element order inside the array.\n\nThe\
    \ following example creates an initial array of just three images whose order\
    \ will be reversed after the final image displays and the rev variable is set\
    \ to true:\n\n```\n// create a new array of image URLs\nvar imgs = new Array(\"\
    img1.gif\",\"img2.gif\",\"img3.gif\");\n\n// create a control variable\nvar rev\
    \ = false;\n\n// when the slideshow displays the final image\n...reverse the order\n\
    rev = true;\n\nif(rev == true) {\n  imgs.reverse();\n}\n\n// display the reversed\
    \ element order\nalert(imgs.join(\" - \")));\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_50_1.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_50_2.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_50_3.png)\n\
