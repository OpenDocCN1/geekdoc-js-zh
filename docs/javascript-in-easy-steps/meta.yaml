  mdcn: "\n\n# 条件运算符\n\nJavaScript 程序员最喜爱的比较运算符可能是条件运算符。它首先评估一个表达式以得到真或假值，然后根据评估结果执行两个给定语句中的其中一个。\n\
    \n条件运算符的语法如下：\n\n```\n(测试表达式) ? 如果为真则执行此操作 : 如果为假则执行此操作 ;\n```\n\n该运算符通常用于在执行完浏览器识别程序后，运行针对特定\
    \ Web 浏览器的脚本函数。下面的示例根据浏览器类型显示欢迎消息：\n\n```javascript\n// 判断是否为 Internet Explorer\
    \ 浏览器\nvar is_ie = browser_id();\n```\n\n```javascript\n// 显示相应的问候\n( is_ie )\
    \ ? greet_ie() : greet_other();\n```\n\n更多关于浏览器识别请参阅第 92 页。\n\n| Microsoft Internet\
    \ Explorer |\n| :--- |\n| 欢迎使用 Internet Explorer 用户 |\n| 好 |\n\n| JavaScript 应用程序\
    \ |\n| :--- |\n| 欢迎访问我们的网站 |\n| 好 |\n\nconditional.js（部分）\n\n# 语句\n\n语句在 JavaScript\
    \ 中用于推进 JavaScript 应用程序的执行。它们可以在代码中定义循环，也可以是待求值的简单术语。本章将检查条件测试和不同类型的循环，并附带用法示例。\n\
    \n# 目录\n\n- 条件 if | 32\n- If - prompt 示例 | 33\n- If - else 语句 | 34\n- switch 语句\
    \ | 35\n- For 循环 | 36\n- for - in 循环 | 37\n- While 循环 | 38\n- do - while 循环 |\
    \ 39\n- Break 语句 | 40\n- Continue 语句 | 41\n- 使用 with 语句 | 42\n\n## 第三章\n\n# 条件\
    \ if\n\n`if` 关键字用于执行基础的 JavaScript 条件测试，以评估表达式以得到布尔值。评估后的语句仅在表达式返回真时才会执行。`if`\
    \ 语句的语法如下：\n\n```\nif (测试表达式) 如果为真时执行的语句;\n```\n\n如果将语句包含在大括号内形成语句块，则要执行的代码可以包含多个语句。\n\
    \n在下面的示例中，待测试的表达式使用模运算运算符来确定名为 `num` 的变量的值是否能被 2 整除。该语句包含两个语句——一个给变量赋值字符串值，另一个调用一个\
    \ JavaScript 函数。\n\n```javascript\n// 创建变量\nvar msg, num;\nnum = 7;\n// 测试数字是否不能被\
    \ 2 整除\nif ( num % 2 != 0 )\n{\n  msg = num + \" 是一个奇数。\";\n  alert( msg);\n}\n\
    ```\n\n# If - prompt 示例\n\n此示例调用了 JavaScript 的 `prompt()` 函数，该函数需要调用者提供两个参数。第一个参数是要显示的消息，第二个参数是输入框中的默认值——在本例中为空字符串。\n\
    \n用户输入被赋值给 `username` 变量，如果字符串仍然为空，则通过 `alert()` 函数显示。\n\n```javascript\n// 初始化一个值为\
    \ null 的变量\nvar username = null;\n\nif ( username == null) {\n    // 询问用户其键名\n\
    \    username = prompt(\"请输入您的姓名\", \"\");\n    // .. 或者通过姓名问候用户\n    if ( username\
    \ != \"\" ) alert(\"欢迎 \" + username);\n}\n```\n\n**注意** `prompt` 对话框打开时输入框为空，但此处显示是在用户输入后。\n\
    \n# If - else 语句\n\nJavaScript 的 `else` 关键字可以与 `if` 语句配合使用，在测试表达式返回假时提供备用执行代码。\n\
    \n这被称为条件分支，其语法如下：\n\n```\nif (测试表达式) 执行此操作; 或者 否则则执行此操作;\n```\n\n可以一直测试多个表达式，直到找到真值，此时紧接着真表达式后的代码将执行执行。需要注意的是，`if-else`\
    \ 语句中包含的任何进一步后续代码都会被忽略。\n\n因此，在接下来的示例代码中，在第三次测试调用 `alert()` 函数后将执行以下内容：\n\n```javascript\n\
    var num = 2, bool = false;\n// 如果数字为 1 且布尔值为真\nif(num == 1 && bool) alert(\"TEST1\
    \ bool: \" + bool);\nelse\n// 如果数字为 2 且布值为真\nif(num == 2 && bool) alert(\"TEST2\
    \ bool: \" + bool);\nelse\n// 如果数字为 2 且布值为假\nif(num == 2 && 0) alert(\"TEST3 bool:\
    \ \" + bool);\nelse\n// 如果数字为 3 且布值为假\nif(num == 3 && 0) alert(\"TEST4 bool: \"\
    \ + bool);\n```\n\n| JavaScript 应用程序 | JavaScript 快速入门步骤 |\n| :--- | :--- |\n\
    | TEST3 bool: false | 34 |\n\n# switch 语句\n\n当测试表达式评估一个变量的值时，使用 `switch` 语句可能比\
    \ `if-else` 语句执行条件分支更高效。`switch` 语句的工作方式很独特——它首先评估一个给定的表达式，然后寻找匹配结果结果的标签。与标签关联的代码将被执行，或者如果没有找到匹配项，`switch`\
    \ 语句将执行任何默认操作。\n\n`case` 关键字用于标记标签，`default` 关键字表示默认代码。所有标签代码必须由 `break` 语句终止。标签可以是数字、字符串或布尔值，但类型必须相同，就像本示例使用数字一样：\n\
    \n```javascript\nvar num = 2;\n\nswitch(num) {\n  // 如果数字是 1\n  case 1:\n  //\
    \ 如果数字是 2\n  case 2 : alert(\"case 2\"); break;\n  // 如果数字是 3\n  case 3 : alert(\"\
    case 3\"); break;\n  // 默认情况\n  default : alert(\"default\");\n}\n```\n\n省略 `break`\
    \ 关键字将允许执行其他代码执行。\n\n# For 循环\n\n`for` 循环可能是 JavaScript 中最常用的循环类型，其语法如下：\n\n```\n\
    for ( 初始化 , 测试 , 递增 ) 语句;\n```\n\n初始化用于设置计数器的起始值，通常在此声明一个变量并命名为 `i`。\n\n在循环的每次迭代中都会测试布尔条件，只有当条件返回真时才会运行。如果测试返回假，循环结束。\n\
    \n在每次迭代中计数器都会增加，然后执行语句。如果语句包含在大括号内，可以执行多个语句。\n\n下面的示例进行了五次迭代，并在每次迭代更改变量的值：\n\n\
    ```javascript\nvar a = 0, b = 0;\n// 初始化计数器为零，循环直到达到 5\nfor ( var i = 0; i < 5;\
    \ i++) {\n  // 每次迭代增加变量值\n  a += 10; b += 5;\n}\n// 循环结束后显示最终值\nalert(\"FOR LOOP\\\
    nA is \" + a + \"... B is \" + b);\n```\n\n循环也可以通过递减计数器向下计数。\n\n# for-in 循环\n\n\
    `for-in` 循环有一个特殊用途，用于枚举对象包含的所有变量或属性。这种循环在常规 JavaScript 中很少使用，但包含在此是因为它可以揭示 Web\
    \ 浏览器中可用的属性。\n\n下面的示例展示了 Microsoft Internet Explorer 6.0 浏览器 `window` 对象中可用属性的预览：\n\
    \n```javascript\nvar i = 0; a = \"\";\n\n// 在变量中列出所有属性\nfor ( property in window\
    \ ) {\n  a += property + \"...\";\n}\n\n// 显示窗口属性列表\nalert( a );\n```\n\n显示的属性随每个浏览器和版本而异。通过此脚本显示的属性属于第\
    \ 8 章描述的文档对象模型 (DOM)。\n\n"
