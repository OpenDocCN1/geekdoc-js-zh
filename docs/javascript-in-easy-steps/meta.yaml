  md: "# Functions\n\nA function is a piece of JavaScript code that can be executed\
    \ once or many times by the JavaScript application. Functions and variables form\
    \ the basis of all JavaScript programming.\n\nThis is how a function looks:\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_17_0.png)\n\n```\n// a function to display\
    \ a message in an alert dialog\nfunction call_alert() {\n  alert(\"My First JavaScript\
    \ Function\");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_17_1.png)\n\
    \nAlways try to give meaningful names to functions and variables.\n\nCreate a\
    \ new function using the JavaScript function keyword followed by a given identifier\
    \ name. The name must be unique within the script and adhere to the same naming\
    \ conventions that apply to the naming of variables:\n\nThe name is always followed\
    \ by a pair of plain brackets, then pair of curly brackets containing the code\
    \ to be executed.\n\nIn the example, the function has been named call_alert()\
    \ and the code to be executed will call the JavaScript alert() function to display\
    \ alert() dialog box containing a message.\n\n![](img/d78298d3338ec680a024bbc83e78b297_17_2.png)\n\
    \nRemember to include the plain brackets when referring to a function.\n\nThe\
    \ function can be called from anywhere in the JavaScript file or in the HTML document\
    \ to execute the statement that it contains.\n\nFor instance, the onload attribute\
    \ of the HTML <body> tag can be used to call the function when the document is\
    \ loaded into the browser, like:\n\n```\n<body onload = \"call_alert()\">\n```\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_17_3.png)"
