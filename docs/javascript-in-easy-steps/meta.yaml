    \ 138\n- Amend form | 139\n- Email address validation | 140\n\n![](img/d78298d3338ec680a024bbc83e78b297_124_0.png)\n\
    \n## The form object\n\nThe window.document.forms object contains an array of\
    \ all the forms in a HTML document, indexed in the order in which they appear\
    \ in the HTML code.\n\nFor instance, window.document.forms[0] addresses the first\
    \ form to appear in the HTML code of a Web page.\n\nThe id attribute of the <form>\
    \ element has been assigned a value then the form can be addressed by name. So\
    \ a form f can simply be addressed as document.forms.f.\n\nAll other attributes\
    \ in the <form> tag are also accessible as properties of that form object. For\
    \ instance, with this...\n\n```html\n<form id=\"f\" method=\"post\" action=\"\
    mailto:a@b.com\"\nenctype=\"text/plain\">\n```\n\n...the following JavaScript\
