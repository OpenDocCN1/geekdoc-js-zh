    # Join strings


    The + operator is used to concatenate strings and is widely used in the example
    code given throughout this book.


    A new string is created that consists of the first string followed immediately
    by the second string.


    The example below concatenates a number of variable values into a single string,
    irrespective of the original data type – because JavaScript performs automatic
    data conversion:


    ```

    // create and initialize an integer variable

    var num = 99;


    // create and initialize a float variable

    var flt = 98.6;


    // create and initialize a boolean variable

    var bool = true;


    // create and initialize several string variables

    var str1 = "Although ";

    var str2 = " F is cited as \body temperature\";

    var str3 = "nthe";

    var str4 = " range is from about 97 to ";

    var str5 = "F.";


    // display the concatenated string

    alert(str1 +flt +str3 +bool +str4 +num +str5 );

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_79_0.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_79_1.png)


