  md: '# JavaScript creates


    The write() method of the window.document object is a tremendously powerful feature
    that allows JavaScript to create content dynamically when loading a Web page.


    The method takes a single string argument containing the content to be written
    into the page and may include HTML tags to format the content.


    Typically the document.write() method appears within a script in the <body> section
    of an HTML document and will write selected content following a conditional test.


    ![](img/d78298d3338ec680a024bbc83e78b297_114_0.png)


    It should be noted that calling this method at runtime will cause the specified
    content to be written into a new blank document so replacing the current page.


    Variable values may also be concatenated with a string argument in order to introduce
    a variable value into the content of a Web page.


    This example first generates a random number tests to determine if the number
    is odd or even. Selected content is added to the page depending on the result
    of this test:


    ```

    // get a random integer between 1 - 100

    var n = Math.ceil(Math.random() * 100);

    // determine whether the number is odd or even

    var ntype = ( n % 2 == 0 ) ? "Even" : "Odd";

    // write a description of the number

    document.write("<h1>Number " +n+\ " is " +ntype+"</h1>");

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_114_1.png)


    | Write Content |

    |---|

    | File Edit View Favorites Tools Help |

    | Number 87 is Odd |'
