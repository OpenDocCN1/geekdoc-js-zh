  - "[PAGE 154]\n\n# Blur\n\nA Blur event occurs when the browser’s focus moves away\
    \ from a form element, or a window, and the onblur event-handler may then call\
    \ a JavaScript function.\n\nThe blur() method of a form element is useful to prevent\
    \ user input for text boxes that must be read-only.\n\nA blur() method can be\
    \ called from the HTML autofocus attribute of the read-only element, like this...\n\
    \n```\n<input type=\"text\" size=\"30\"\nvalue=\"This field is read-only\" autofocus=\"\
    blur(this)\">\n```\n\nIn the following example the user is reminded that the text\
    \ box they just left should receive some input:\n\n![](img/d78298d3338ec680a024bbc83e78b297_154_0.png)\n\
    \n```\n// a function to examine a passed string argument\nfunction is_entry( val\
    \ )\n(\n  // if the text field is empty\n  if ( val == \"\")\n  // ...display\
    \ a message\n  alert(\"Please enter data \");\n)\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_154_1.png)\n\
    \nUsing the window.blur() method will typically minimize the window.\n\n![](img/d78298d3338ec680a024bbc83e78b297_154_2.png)\n\
    \n12. Event-handlers | 153"
  - "[PAGE 155]\n\n# Change\n\nThe Change event occurs when the value of a text input\
    \ is changed or when the user selects an item in an options list.\n\nThe onchange\
    \ event-handler can call a JavaScript function to execute some code whenever the\
    \ Change occurs.\n\nThe example below sets the initial selected option to Green\
    \ then assigns an event-handler that displays the associated value in a text box\
    \ when the selection is changed:\n\n```\n// a function to set the selected item\
    \ in a list\nfunction init() {\n  document.forms.f.s.options[1].selected = true;\n\
    \  // specify an onchange event-handler\n  document.forms.f.s.onchange = show_selected;\n\
    }\n\n// a function to display the selected list item\nfunction show_selected()\
    \ {\n  document.forms.f.txt.value = document.forms.f.s.options[document.forms.f.s.selectedIndex].value;\n\
    }\n\n// specify the onload event-handler\nwindow.onload = init;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_155_0.png)\n\
    \n| Change Event |\n| File Edit View Favorites Tools Help |\n| Red | Red |\n|\
    \ Green |\n| Blue |\n| Done | Local intranet |"
- md: "\n# Reset\n\nThe **Reset** event occurs when the user pushes a form's reset\
    \ button or when JavaScript executes the `form.reset()` method.\n\nThe **onreset**\
    \ event-handler may call a JavaScript function when the Reset event occurs.\n\n\
    In this example there are two HTML forms, named **f1** and **f2**. The first form\
    \ contains three radio buttons and a reset button. An event-handler is assigned\
    \ to the HTML **onreset** attribute in the first `<form>` tag. When the reset\
    \ button is pressed the value of the second radio button is changed and its value\
    \ is displayed in a text box in the second form.\n\n```javascript\n// a function\
    \ to set the value of a radio button\nfunction show_value() {\n  // set the value\n\
    \  document.forms.f1.r[0].value = \"Salmon\";\n  // display the set value\n  document.forms.f2.txt.value\
    \ = document.forms.f1.r[0].value;\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_156_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_156_1.png)\n\nThe first radio button\
    \ could be checked with JavaScript by assigning the property `document.forms.f1.r[0].checked`.\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_156_2.png)\n\n# Submit\n\nThe **Submit**\
    \ event occurs when the user pushes a submit button in a form. The `onsubmit`\
    \ event-handler may call a function to carry out validation before submission.\n\
    \nIf the `onsubmit` event-handler returns `false`, for instance when form validation\
    \ fails, the form data will not be sent.\n\nThis example performs basic email\
    \ address validation and provides the user with an `alert()` message if validation\
    \ fails. The function is called by the HTML **onsubmit** attribute of the `<form>`.\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_157_0.png)\n\n```javascript\n// a function\
    \ to validate basic email address format\nfunction validation()\n{\n  // seek\
    \ an @ character in the address\n  if(document.forms.email.value.indexOf(\"@\"\
    ) == -1)\n    // if absent display a message\n    alert(\"Email address is absent\
    \ or incorrect\");\n    // ...and do not submit the form\n    return false;\n\
    }\n```\n\nThe onsubmit event-handler is not invoked by use of `form.submit()`\
    \ method in JavaScript.\n\n| Submit Event |\n| :--- |\n| File Edit View Favorites\
    \ Tools Help |\n| Enter your email address: user_a@domain.com [Submit] |\n| Microsoft\
    \ Internet Explorer |\n| ![ Email address is absent or incorrect |] |\n| [OK]\
    \ |\n| Done Local intranet |\n\n# Abort\n\nInternet Explorer allows an event-handler\
    \ to be specified for the Abort event that occurs when the user cancels the download\
    \ of an image — usually by pushing the stop on the browser toolbar. the onabort\
    \ event-handler may call a JavaScript function when an image download is cancelled.\n\
    \nTo identify the image a name must be given to its id attribute in the HTML `<img>`\
    \ element, like this...\n\n```html\n<img id=\"big-pic\" src=\"bigpic.jpg\" alt=\"\
    \" />\n```\n\nAn event-handler can then be assigned to that's onabort property.\
    \ In the example below the event-handler directly creates an alert() message confirming\
    \ that the download is cancelled:\n\n```javascript\n// for Internet Explorer only\
    \ set an event-handler\nif(document.all)\\document.getElementById(\"big-pic\"\
    ).onabort = abort_msg;\n\n// a function to display a confirmation message\nfunction\
    \ abort_msg() {\n  alert(\"Image Download Has Been Aborted \");\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_158_0.png)\n\
    \nThe `<script>` element that includes this script must appear in the HTML `<img>`\
    \ element — an event-handler can't be set until the image object exists.\n\n![](img/d78298d3338ec680a024bbc83e78b297_158_1.png)\n\
    \nThis feature is useful to switch the image source to a low-resolution version.\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_158_2.png)\n\n# Resize\n\nThe **Resize**\
    \ event occurs when a browser window is re-sized by the user and the **onresize**\
    \ event-handler can execute a function to make the page appropriate for the new\
    \ window size.\n\nThis is most useful to reposition DHTML page components as illustrated\
    \ in the following example. This creates a centered `<div>` element with the `id`\
    \ of `lyr` which will be re-centered when window is re-resized:\n\n```javascript\n\
    // a function to center a <div> element\nfunction set_pos() {\n    var width;\n\
    \    // get the window width\n    if(navigator.appName == \"Netscape\")\n    \
    \    width = innerWidth; // for Netscape\n    else\n        width = document.body.clientWidth;\
    \ // for IE\n\n    var left_pos = parseInt(width / 2) - 50;\n    \n    // set\
    \ the left position of the <div>\n    document.getElementById('lyr').style.left\
    \ = (left_pos+\"px\");\n\n    // specify the onresize event-handler\n    window.onresize\
    \ = set_pos;\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_159_0.png)\n\n\
    This `<div>` is initially centered by calling the **set_pos()** function from\
    \ the `<body>` attribute of the HTML element.\n\n![](img/d78298d3338ec680a024bbc83e78b297_159_1.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_159_2.png)\n\n# JavaScript in DHTML\n\
    \nThis chapter describes the use of JavaScript to control and manipulate components\
    \ of an HTML document. The many examples illustrate how position, content and\
    \ visibility can all be dynamically changed to create an interactive Web page.\n\
    \n## Covers\n- JavaScript: protocol | 160\n- Layer attributes | 161\n- Toggle\
    \ visibility | 162\n- Dynamic content | 164\n- Slide show | 166\n- Tracking layer\
    \ | 168\n- Scrolling layer | 170\n- Pop-up layers | 172\n- Dynamic menu | 174\n\
    - Fresh options | 176\n- DOM reference | 178\n\n# JavaScript: protocol\n\nThe\
    \ javascript protocol may be assigned to the href attribute in an HTML <a> anchor\
    \ element to make a JavaScript function the target of a hyperlink. The name of\
    \ the function should follow the protocol to identify the script code to be executed,\
    \ or short pieces of code can be included inline after the specifier, like:\n\n\
    ```html\n<a href=\"javascript:alert('inline code')\">Link #1</a>\n<a href=\"javascript:respond()\"\
    >Link #2</a>\n```\n\nThis example contains both inline code and a function call.\
    \ Each executes when the user clicks the relevant hyperlink:\n\n```javascript\n\
    // a function to display a simple message\nfunction respond() {\n  alert(\"JavaScript\
    \ code\");\n}\n```\n\nTo make an anchor that has no target use javascript:// so\
    \ that other attributes like onmouseover can still be used.\n\n![](img/d78298d3338ec680a024bbc83e78b297_161_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_161_1.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_161_2.png)\n\
    \n# Layer attributes\n\nProbably the most important style attributes of a `<div>`\
    \ element to be used in DHTML are id, top, left, z-index, visibility, color and\
    \ background-color.\n\nThese styles can be dynamically changed by assigning new\
    \ values to them with JavaScript.\n\nThis example demonstrates how to access each\
    \ of these attributes by listing the values of a `<div>` element called lyr.\n\
    \n```javascript\n// a function to display the style attributes of a <div>\nfunction\
    \ get_styles() {\n  var obj = document.getElementById(\"lyr\");\n  var str = \"\
    ID: \" + obj.id;\n  str += \"\\nTop: \" + obj.style.top;\n  str += \"\\nLeft:\
    \ \" + obj.style.left;\n  str += \"\\nZ-Index: \" + obj.style.zIndex;\n  str +=\
    \ \"\\nVisibility: \" + obj.style.visibility;\n  str += \"\\nBackground: \" +\
    \ obj.style.backgroundColor;\n  str += \"\\nForeground: \" + obj.style.color;\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_162_0.png)\n\nThe CSS z-index\
    \ style is referenced in JavaScript by the term z-index. Also the CSS background-color\
    \ style is referenced in JavaScript by the term backgroundColor.\n\n![](img/d78298d3338ec680a024bbc83e78b297_162_1.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_162_2.png)\n\n# Toggle visibility\n\
    \nHaving determined how to access layer styles with JavaScript it's easy to have\
    \ some fun with them by letting the JavaScript code dynamically change their values.\n\
    \nFor example, changing the visibility style value to hidden will cause a layer\
    \ to disappear from view.\n\nConversely a layer initially created with a visibility\
    \ style value of hidden can be revealed by changing that value to visible.\n\n\
    The following script toggles the visibility of a single layer with onmouseover\
    \ and mouseout event-handlers, like this:\n\n```html\n<a href=\"javascript://\"\
    \ onmouseover=\"show_apple\"\nonmouseout=\"hide_apple()\">Apple Link</a>\n```\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_163_0.png)\n\n```javascript\n// a function\
    \ to reveal a layer\nfunction show_apple() {\n  // reference the layer by id\n\
    \  var obj = getElementById(\"lyr\");\n  // show the layer\n  obj.style.visibility\
    \ = \"visible\";\n}\n\n// a function to hide a layer\nfunction hide_apple() {\n\
    \  // reference the layer by id\n  var obj = getElementById(\"lyr\");\n  // hide\
    \ the layer\n  obj.style.visibility = \"hidden\";\n}\n```\n"
  mdcn: "\n\n# 重置 (Reset)\n\n当用户点击表单的重置按钮或 JavaScript 执行 `form.reset()` 方法时，会触发 **Reset**\
    \ 事件。\n\n**onreset** 事件处理程序可以在 Reset 事件发生时调用 JavaScript 函数。\n\n在这个示例中，有两个 HTML\
    \ 表单，分别命名为 **f1** 和 **f2**。第一个表单包含三个单选按钮和一个重置按钮。在第一个 `<form>` 标签的 HTML **onreset**\
    \ 属性中分配了一个事件处理程序。当按下重置按钮时，第二个单选按钮的值会被改变，其值将显示在第二个表单的文本框中。\n\n```javascript\n//一个用于设置单选按钮值的函数\n\
    function show_value() {\n  // 设置值\n  document.forms.f1.r[0].value = \"Salmon\"\
    ;\n  // 显示设置的值\n  document.forms.f2.txt.value = document.forms.f1.r[0].value;\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_156_0.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_156_1.png)\n\
    \n可以通过给属性 `document.forms.f1.r[0].checked` 赋值用 JavaScript JavaScript 第一个单选按钮。\n\
