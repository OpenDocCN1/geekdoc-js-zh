  md: '# Get cookie


    If a cookie is set the document.cookie object will return true so JavaScript can
    test for the presence of cookies. When a cookie is located the document.cookie
    object returns the stored data string. Parts of the data may be retrieved from
    the stored string using the regular string manipulation methods covered earlier
    in this chapter.


    When the script below runs it first seeks the cookie set by the previous example
    on the opposite page, then it extracts the data values to write customized dynamic
    content:


    ![](img/d78298d3338ec680a024bbc83e78b297_116_0.png)


    ```

    // find any cookies

    if (document.cookie)

    // unescape the cookie data

    var cookiedata = unescape(document.cookie);

    // split the name=value pairs

    var userdata = cookiedata.split("=");

    // if the cookie is called cookiedata

    if (userdata[0] == "cookiedata") {

    // split the comma delimited values

    var data = userdata[1].split(",");\nvar username = data[0];

    var useracct = data[1];

    }

    // write out the data retrieved from the cookie

    document.write("Welcome " + username + "<br/>");\ndocument.write("Account number:
    " + useracct + ".");

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_116_1.png)


