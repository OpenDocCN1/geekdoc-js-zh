    \ do - while loop | 39\n- Break statement | 40\n- Continue statement | 41\n- Using\
    \ with statements | 42\n\n## ## Chapter Three\n\n# Conditional if\n\nif keyword\
    \ is used to perform the basic conditional JavaScript test to evaluate an expression\
    \ for a boolean value. The statement following the evaluation will only be executed\
    \ when the expression returns true. The syntax for the if statement looks like\
    \ this:\n\n```\nif (test expression) statement-to-execute-when-true;\n```\n\n\
    The code to be executed may contain multiple statements if they are enclosed within\
    \ curly braces to form a statement block.\n\nIn the example below the expression\
    \ to be tested uses the modulus operator to determine if the value contained in\
    \ the variable called num is exactly divisible by 2. The statement has two statements\
    \ — one to assign a string value to a variable and another to call a JavaScript\
    \ function.\n\n```javascript\n// create variables\nvar msg, num;\nnum = 7;\n//\
    \ test if the number is not exactly divisible by 2\nif ( num % 2 != 0 )\n{\n \
    \ msg = num + \" is an odd number.\";\n  alert( msg);\n}\n```\n\n# If - prompt\
    \ example\n\nThis example calls the JavaScript prompt() function which needs two\
    \ arguments to be supplied by the caller. The first argument is the message to\
    \ be displayed and the second is a default entry in the input field – in this\
    \ case an empty string.\n\nThe user input is assigned to the username variable\
    \ and is displayed by the alert() function if the string is not still empty.\n\
    \n```javascript\n// initialize a variable with a null value\nvar username = null;\n\
    \nif ( username == null) {\n    // ask the user for their name\n    username =\
    \ prompt(\"Please Enter Your Name\", \"\");\n    // .. or greet the user by name\n\
    \    if ( username != \"\" ) alert(\"Welcome \" + username);\n}\n```\n\nBEWARE\
    \ The prompt dialog will open with an empty input field but is shown here following\
    \ user input.\n\n# If - else statements\n\nThe JavaScript else keyword can be\
    \ used with an if statement to provide alternative code to execute, in the event\
    \ that the test expression returns false.\n\nThis is known as conditional branching\
    \ and has this syntax:\n\n```\nif (test expression) do-this; or-else-do-this;\n\
    ```\n\nSeveral expressions may be tested until a true value is found when the\
    \ code following the true expression will be executed. It is important to note\
    \ any further code contained in the if-else statement is ignored.\n\nSo in the\
    \ following example code after the call to the alert() function by the third test\
    \ will be executed:\n\n```javascript\nvar num = 2, bool = false;\n// is the number\
    \ 1 and the boolean value true\nif(num == 1 && bool) alert(\"TEST1 bool: \" +\
    \ bool);\nelse\n// is the number 2 and the boolean value true\nif(num == 2 &&\
    \ bool) alert(\"TEST2 bool: \" + bool);\nelse\n// is the number 2 and the boolean\
    \ value false\nif(num == 2 && 0) alert(\"TEST3 bool: \" + bool);\nelse\n// is\
    \ the number 3 and the boolean value false\nif(num == 3 && 0) alert(\"TEST4 bool:\
    \ \" + bool);\n```\n\n| JavaScript Application | JavaScript in easy steps |\n\
    | :--- | :--- |\n| TEST3 bool: false | 34 |\n\n# The switch statement\n\nConditional\
    \ branching using the if-else statement may be more efficiently performed using\
    \ a switch statement when a test expression evaluates the value of one variable.\
    \ The switch statement works in unusual way – first it evaluates a given expression,\
    \ then it seeks a label to match the resulting value. The code associated with\
    \ the label will be executed, or if no match is made, the switch statement will\
    \ execute any default.\n\nThe case keyword is used to denote a label and the default\
    \ keyword denotes the default code. All label code must be terminated by a break\
    \ statement. The labels may be numbers, strings, or booleans but must all of the\
    \ same type, like in this example that uses numbers:\n\n```javascript\nvar num\
    \ = 2;\n\nswitch(num) {\n  // is the number 1\n  case 1 : alert(\"This is case\
    \ 1: \" + bool); break;\n  // is the number 2\n  case 2 : alert(\"This is case\
    \ 2: \" + bool); break;\n  // is the number 3\n  case 3 : alert(\"This is case\
    \ 3: \" + bool); break;\n  // if none of those numbers...\n  default : alert(\"\
    This is default code\");\n}\n```\n\nOmitting the ending break keywords will allow\
    \ execution of all other code in the switch statement.\n\n# For loops\n\nThe for\
    \ loop is probably the most used type of loop in JavaScript and has this syntax:\n\
    \n```\nfor ( initializer , test , increment ) statements;\n```\n\nThe initializer\
    \ is used to set the start value for the counter of the number of iterations.\
    \ A variable may be declared here for this purpose and is traditional to name\
    \ it i.\n\nAt each pass of the loop a boolean condition is tested and the next\
    \ iteration of the loop will only run if the condition returns true. If the test\
    \ returns false the loop will end.\n\nWith every iteration the counter is incremented\
    \ then the loop will execute the code in the statement. Multiple statements can\
    \ be executed if they are contained by curly braces in a statement.\n\nThe following\
    \ example makes five iterations and changes the assigned value of two variables\
    \ at each pass:\n\n```javascript\nvar a = 0, b = 0;\n// initialize counter at\
    \ zero then loop until it hits 5\nfor ( var i = 0; i < 5; i++) {\n  // increment\
    \ variable values on each iteration\n  a += 10; b += 5;\n}\n// display the final\
    \ values after the loop ends\nalert(\"FOR LOOP\\nA is \" + a + \"... B is \" +\
    \ b);\n```\n\nA loop can also count down decrementing the counter at each iteration.\n\
    \n# The for-in loop\n\nThe for-in loop has a special use to enumerate all the\
    \ variables or properties contained within an object. This loop is seldom in regular\
    \ JavaScript but is included here because it can reveal the properties available\
    \ for manipulation within a Web browser.\n\nThe following example reveals a tantalizing\
