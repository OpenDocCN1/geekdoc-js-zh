- md: "\n## Form elements\n\nThe window.document.forms[].elements object contains\
    \ an array of all the elements within form indexed by the order in which they\
    \ appear in the HTML code. With a name f for instance, document.forms.f.elements[0]\
    \ addresses the first element that appears in that form.\n\nIf the name attribute\
    \ of the element has been assigned a value then the element can be addressed by\
    \ name. So the element btn1 in this form f can simply be addressed as document.forms.f.btn1...\n\
    \n```html\n<form id=\"f\" method=\"post\" action=\"\">\n  <input type=\"button\"\
    \ name=\"btn1\" value=\"Click Me\"\n  onclick=\"alert('Hi I am a button')\"/>\n\
    </form>\n```\n\nOther attributes are accessible as properties of element - as\
    \ illustrated by this example:\n\n```javascript\nfunction element_info() {\n \
    \ // get the element type\n  var msg = \"Element Type: \"+document.forms.f.btn1.type;\n\
    \  // get the element value\n  msg += \"\\nElement Value: \"+document.forms.f.btn1.value;\n\
    \  // get the element onclick\n  msg += \"\\nElement Onclick: \"+document.forms.f.btn1.onclick;\n\
    \  alert(msg);\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_126_0.png)\n\
    \nUnless stated otherwise, all the functions in this chapter are called from the\
    \ HTML <body> tag's onload attribute - a form field cannot be created before it\
    \ is hidden\n\n![](img/d78298d3338ec680a024bbc83e78b297_126_1.png)\n\n## Click\
    \ buttons\n\nValues assigned in the HTML code may be reassigned by JavaScript\
    \ so that a button will perform a different action.\n\nIn the example below a\
    \ HTML onclick attribute specifies that the first() function will be called when\
    \ the button is pushed:\n\n```html\n<form id=\"f\" method=\"post\" action=\"\"\
    >\n<input type=\"button\" name=\"btn1\" value=\"Click Me\"\nonclick=\"first()\"\
    ></form>\n```\n\nThe first() function assigns a string to a variable, then specifies\
    \ a new event-handler function called second() to the button's onclick attribute.\
    \ Subsequently pushing the button will call the second() function and execute\
    \ the statement contains.\n\n![](img/d78298d3338ec680a024bbc83e78b297_127_0.png)\n\
    \n```javascript\n// create a global variable\nvar msg;\n\n// a function to store\
    \ an initial message\nfunction first() {\n  msg = \"This message was left by the\
    \ first function\";\n  // assign another function to the button\n  document.forms.f.btn1.onclick\
    \ = second;\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_127_1.png)\n\n\
    When assigning event-handler functions only assign the name without any brackets.\n\
    \n```javascript\n// a function to store a second message and display both\nfunction\
    \ second() {\n  msg += \"\\nHi, I'm the second function\";\n  alert(msg);\n}\n\
    ```\n\n![](img/d78298d3338ec680a024bbc83e78b297_127_2.png)\n\n## Toggle value\n\
    \nIt is useful to change the label that is displayed on a button by its value\
    \ attribute if that button performs dual actions.\n\nIn the following example\
    \ a button calls a stopgo() function to start or stop a counter. The counter increments\
    \ an integer variable at 1-second intervals and displays the count in the window's\
    \ status bar.\n\nThe button label normally reads Start but changes to Stop if\
    \ the timer count() function is running.\n\n![](img/d78298d3338ec680a024bbc83e78b297_128_0.png)\n\
    \n```javascript\nvar running = false, num = -1, tim; // create globals\nfunction\
    \ count() { // counter function\n\tif(running) {\n\tnum++;\n\twindow.status =\
    \ \"Seconds elapsed: \" + num;\n\ttim = setTimeout(\"count()\", 1000);\n} else\
    \ {\n\tnum = -1;clearTimeout(tim); } // or halt\n}\nfunction stopgo() { // control\
    \ function\n\trunning = !running; // toggle counter\n\tdocument.forms.btn1.value\
    \ = (running)? \"Stop\" : \"Start\"; // change the label\n}\n```\n\ntoggle.js\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_128_1.png)\n\nThe num variable is initialized\
    \ at -1 so that when first incremented the counter will start zero.\n\n![](img/d78298d3338ec680a024bbc83e78b297_128_2.png)\n\
    \nThe ! operator is used here to change the boolean variable to the opposite of\
    \ its current value.\n\n![](img/d78298d3338ec680a024bbc83e78b297_128_3.png)\n\n\
    ## Text boxes\n\nThe text displayed in HTML text <input> is easily changed by\
    \ JavaScript simply assigning a new string to the value of that element.\n\nHistorically,\
    \ text boxes were restricted to display text in just one font but modern browsers\
    \ allow a choice of font, size and color.\n\nThe example below displays a string\
    \ in a text box and adds characteristics for font, foreground-color and background-color:\n\
    \n```javascript\n// a function to set the text in a form field\nfunction set_text()\
    \ {\n    // for text txt1 in form f\n    with(document.forms.f.txt1)\n\n    //\
    \ set the text value\n    value = \"JavaScript easy\";\n\n    // set the style\n\
    \    style.fontFamily = \"comic sans\";\n    style.fontSize = \"16pt\";\n    style.color\
    \ = \"yellow\";\n    style.backgroundColor = \"red\";\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_129_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_129_1.png)\n\n## Password boxes\n\n\
    A HTML password <input> is simply a text box that displays asterisks in place\
    \ of actual characters.\n\nThis example converts the string input by the user\
    \ into a password field named **pwd1**, to lowercase and assigns the string to\
    \ a variable.\n\nIf the variable string matches the correct password then the\
    \ browser will load the first page but it will display an `alert()` dialog message\
    \ if the string does not.\n\n![](img/d78298d3338ec680a024bbc83e78b297_130_0.png)\n\
    \n```javascript\n// a function to validate a password entry\nfunction validate()\
    \ {\n  // convert the input to lowercase\n  var entry = document.forms.f.pwd1.value.toLowerCase();\n\
    \  // relocate the browser if the input is correct\n  if (entry == \"admin\")\
    \ window.location = \"page1.html\";\n  else {\n    // display a message if input\
    \ is incorrect\n    alert(\"Password incorrect - Please retry...\");\n    document.forms.f.pwd1.value\
    \ = \"\";\n  }\n}\n```\n\nThe final line in this script will clear the password\
    \ box after the user clicks the **OK** button, to be ready for another entry.\n\
    \n| Password Field | File | Edit | View | Help |\n| :--- | :--- | :--- | :---\
    \ | :--- |\n| | | | | Validate |\n| Microsoft Internet | Password incorrect -\
    \ Please retry... OK | | | |\n| Done | Local intranet | | |\n\n## Radio buttons\n\
    \nA group of radio buttons that will only allow one of the group to be checked\
    \ at any time should have the same name assigned to their name attribute in the\
    \ HTML <input> tag.\n\nIn the browser DOM the radio button group creates a document.form\
    \ object with that name. This object contains an array of all the radio buttons\
    \ in the group, indexed in the order in which they appear in the HTML code.\n\n\
    JavaScript can address each radio button using the array name and index number.\
    \ In the example below JavaScript checks the second radio button and displays\
    \ both values in a text box:\n\n![](img/d78298d3338ec680a024bbc83e78b297_131_0.png)\n\
    \n```javascript\n// a function to get radio group information\nfunction radio_info()\
    \ {\n  // select the second radio button\n  document.forms.f.radl[1].checked =\
    \ true;\n\n  // get both radio values\n  var msg = \"1st Radio Value: \"\n  +\
    \ document.forms.f.radl[0].value;\n  msg += \"2nd Radio Value: \"\n  + document.forms.f.radl[1].value\
    \ = msg;\n}\n```\n\nOnly checked radio buttons have their name=value pair sent\
    \ when the form is submitted.\n\n![](img/d78298d3338ec680a024bbc83e78b297_131_1.png)\n\
    \n| Radio Buttons | File | Edit | View | Tools | Help |\n| :--- | :--- | :---\
    \ | :--- | :--- | :--- |\n| 1st Radio Value: Coffee | 2nd Radio Value, Tea | [\
    \ Get Radio Info ] | Done | Local intranet | |\n\n## Radio polling\n\nThe important\
    \ feature of a radio button is whether it is checked or not. This can be ascertained\
    \ from the radio button's **checked** property that will return a boolean **true**\
    \ if the radio is checked or a boolean **false** if it is unchecked.\n\nJavaScript\
    \ can loop through all the radio button array elements to test for a **true checked**\
    \ property, then use the value assigned to the radio button that is checked.\n\
    \nIn the example below the function is called from the HTML **onclick** attribute\
    \ of the push button form `<input>`. This loops through the elements of the radio\
    \ button array to discover which button, if any, is checked. When a button has\
    \ been checked its associated value is used by the script to apply a new background\
    \ color to the page.\n\n```javascript\n// a function to discover which radio button\
    \ is selected\nfunction radio_poll() {\n  // loop through all radio buttons\n\
    \  for(var i=0; i < document.forms.frad.length; i++) {\n    // if the radio is\
    \ selected, use its value\n    if(document.forms.frad[i].checked ) {\n      document.bgColor=document.forms.frad[i].value;\n\
    \    }\n  }\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_132_0.png)\n\n\
    > In JavaScript `((checked))` is shorthand for `((checked==true))`\n\n![](img/d78298d3338ec680a024bbc83e78b297_132_1.png)\n"
  mdcn: "\n\n## 表单元素\n\n`window.document.forms[].elements` 对象包含表单内所有元素的数组，这些元素按照它们在\
    \ HTML 代码中出现的顺序进行索引。例如，通过名称 `f`，`document.forms.f.elements[0]` 指向该表单中出现的第一个元素。\n\
    \n如果元素的 `name` 属性已分配了值，则可以通过名称访问该元素。因此，此表单 `f` 中的元素 `btn1` 可以简单地通过 `document.forms.f.btn1...`\
    \ 来访问……\n\n```html\n<form id=\"f\" method=\"post\" action=\"\">\n  <input type=\"\
    button\" name=\"btn1\" value=\"Click Me\"\n  onclick=\"alert('Hi I am a button')\"\
    />\n</form>\n```\n\n其他属性可以作为元素的属性访问——如下例所示：\n\n```javascript\nfunction element_info()\
    \ {\n  // 获取元素类型\n  var msg = \"Element Type: \"+document.forms.f.btn1.type;\n\
    \  // 获取元素值\n  msg += \"\\nElement Value: \"+document.forms.f.btn1.value;\n  //\
    \ 获取元素的 onclick 事件\n  msg += \"\\nElement Onclick: \"+document.forms.f.btn1.onclick;\n\
    \  alert(msg);\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_126_0.png)\n\
    \n除非另有说明，本章中的所有函数都是从 HTML `<body>` 标签的 `onload` 属性调用的——表单字段在隐藏之前无法创建。\n\n![](img/d78298d3338ec680a024bbc83e78b297_126_1.png)\n\
    \n## 点击按钮\n\nHTML 代码中分配的值可能被 JavaScript 重新分配，以便按钮能够执行不同的操作。\n\n在下面的示例中，HTML 的\
    \ `onclick` 属性指定在按下按钮时调用 `first()` 函数：\n\n```html\n<form id=\"f\" method=\"post\"\
    \ action=\"\">\n<input type=\"button\" name=\"btn1\" value=\"Click Me\"\nonclick=\"\
    first()\"></form>\n```\n\n`first()` 函数将一个字符串赋值给变量，然后为按钮的 `onclick` 属性指定一个名为 `second()`\
    \ 的新事件处理函数。随后按下按钮将调用 `second()` 函数并执行其中包含的语句。\n\n![](img/d78298d3338ec680a024bbc83e78b297_127_0.png)\n\
    \n```javascript\n// 创建一个全局变量\nvar msg;\n\n// 用于存储初始消息的函数\nfunction first() {\n\
    \  msg = \"This message was left by the first function\";\n  // 给按钮分配另一个函数\n \
    \ document.forms.f.btn1.onclick = second;\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_127_1.png)\n\
    \n在分配事件处理函数时，只分配名称，不要带带任何括号。\n\n```javascript\n// 用于存储第二个消息并显示两者的函数\nfunction\
    \ second() {\n  msg += \"\\nHi, I'm the second function\";\n  alert(msg);\n}\n\
    ```\n\n![](img/d78298d3338ec680a024bbc83e78b297_127_2.png)\n\n## 切换值\n\n如果一个按钮执行双重操作，通过其\
    \ `value` 属性更改按钮上显示的标签是非常有用的。\n\n在接下来的示例中，按钮调用 `stopgo()` 函数来启动或停止计数器。计数器每隔 1\
    \ 秒增加一次整数变量，并在窗口的状态栏中显示计数。\n\n按钮标签通常显示为“Start”（开始），但如果计时器 `count()` 函数正在运行，它将变变为“Stop”（停止）。\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_128_0.png)\n\n```javascript\nvar running\
    \ = false, num = -1, tim; // 创建全局变量\nfunction count() { // 计数器函数\n\tif(running)\
    \ {\n\tnum++;\n\twindow.status = \"Seconds elapsed: \" + num;\n\ttim = setTimeout(\"\
    count()\", 1000);\n} else {\n\tnum = -1;clearTimeout(tim); } // 或者停止\n}\nfunction\
    \ stopgo() { // 控制函数\n\trunning = !running; // 切换计数器\n\tdocument.forms.btn1.value\
    \ = (running)? \"Stop\" : \"Start\"; // 更改标签\n}\n```\n\ntoggle.js\n\n![](img/d78298d3338ec680a024bbc83e78b297_128_1.png)\n\
    \n`num` 变量初始化为 -1，这样在第一次增加时，计数器将从零开始。\n\n![](img/d78298d3338ec680a024bbc83e78b297_128_2.png)\n\
    \n这里使用 `!` 运算符将布尔变量更改为其当前值的反值。\n\n![](img/d78298d3338ec680a024bbc83e78b297_128_3.png)\n\
    \n## 文本框\n\nHTML 文本 `<input>` 中显示的文本很容易通过 JavaScript 为该元素的 `value` 赋值一个新字符串来更改。\n\
    \n从历史上看，文本框被限制为只显示一种字体，但现代浏览器允许选择字体、大小和颜色。\n\n下面的示例在文本框中显示一个字符串，并添加了字体、前景色颜色和背景色的特征：\n\
    \n```javascript\n// 用于设置表单字段中文本的函数\nfunction set_text() {\n    // 针对表单 f 中的文本\
    \ txt1\n    with(document.forms.f.txt1)\n\n    // 设置文本值\n    value = \"JavaScript\
    \ easy\";\n\n    // 设置样式\n    style.fontFamily = \"comic sans\";\n    style.fontSize\
    \ = \"16pt\";\n    style.color = \"yellow\";\n    style.backgroundColor = \"red\"\
    ;\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_129_0.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_129_1.png)\n\
    \n## 密码框\n\nHTML 文本 `<input>` 中显示的文本很容易通过 JavaScript 简单地为该元素的 `value` 赋值一个新字符串来更改。\n\
    \n密码框 `<input>` 是一个显示星号的文本框，通过 `name` 属性进行访问。\n\nJavaScript 将用户的输入转换为字符串到名为 `pwd1`\
    \ 的字段。\n\n如果字符串匹配密码，浏览器将加载该页面，否则将显示一个 `alert()` 对话框。\n\n![](img/d78298d3338ec680a024bbc83e78b297_130.png)\n\
    \n```javascript\n// 用于验证密码的函数\nfunction validate() {\n  // 将输入转换为小写\n  var entry\
    \ = document.forms.f.pwd1.value.toLowerCase();\n  // 如果正确\n  if (entry == \"admin\"\
    ) window.location = \"page1\";\n  else {\n    // 如果错误，显示提示\n    alert(\"Password\
    \ incorrect...\");\n    document.forms.f.pwd1 = \"\";\n  }\n}\n```\n\n脚本的最后一行在用户点击\
    \ **OK** 按钮后清除密码框。\n\n此表单提交时发送选中的按钮。\n\n| 密码字段 | 编辑 | 视图 |\n| :--- | :--- | :---\
    \ |\n| | | |\n| 密码错误 -... | | |\n| 完成 | |\n\n## 单选按钮\n\n单选按钮组允许任何时间只有一个按钮被选中，这些按钮具有相同的\
    \ `name` 属性。\n\n在浏览器中，该单选按钮组按照它们在 HTML 中出现的顺序创建一个数组。\n\nJavaScript 可以通过名称和索引访问每个单选按钮。下面的示例检查了第二个单选按钮并显示两个值：\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_131.png)\n\n```javascript\n// 获取单选按钮信息的函数\n\
    function radio_info() {\n  // 选择第二个单选按钮\n  document.forms.f.radl[1].checked =\
    \ true;\n\n  // 获取两个按钮的值\n  var msg = \"1st Radio Value: \"\n  + document.forms.f.radl[0].value;\n\
    \  msg += \"2nd Radio Value: \"\n  + document.forms.f.radl[1].value;\n}\n```\n\
    \n只有选中的单选按钮在表单提交时才会发送其 `name=value` 对。\n\n![](img/d78298d3338ec680a024bbc83e78b297_131_1.png)\n\
    \n| 单选按钮 | 文件 | 编辑 | 工具 | 帮助 |\n| :--- | :--- | :--- | :--- | :--- |\n| 第一值：咖啡\
    \ | 第二值：茶 | 获取按钮信息 | 完成 | |\n\n## 轮询\n\n单选按钮重要的特性是它是否被选中。这可以通过单选按钮的 `checked`\
    \ 属性确定，该属性在按钮被选中时返回布尔值 `true`，在未选中时返回布尔值 `false`。\n\nJavaScript 可以遍历所有的单选按钮数组元素来测试\
    \ `true` 检查属性，然后使用被选中按钮的值。\n\n在下面的示例中，该函数是从推送按钮 `<input>` 的 `onclick` 属性调用的。它遍历单选按钮数组的元素，以发现哪个按钮被选中。当按钮被选中后，脚本使用其关联的值为页面应用新的背景颜色。\n\
    \n```javascript\n// 发现哪个单选按钮被选中的函数\nfunction radio_poll() {\n  // 遍历所有单选按钮\n \
    \ for(var i=0; i < document.forms.frad.length; i++) {\n    // 如果单选按钮，使用其值\n  \
    \  if(document.forms.frad[i].checked ) {\n      document.bgColor=document.forms.frad[i].value;\n\
    \    }\n  }\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_132_0.png)\n\n\
    > 在 JavaScript 中 `((checked))` 是 `((checked==true))` 的简写\n\n![](img/d78298d3338ec680a024bbc83e78b297_132_1.png)\n\
    \n"
