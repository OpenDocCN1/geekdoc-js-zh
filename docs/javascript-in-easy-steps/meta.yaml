  md: "# Text boxes\n\nThe text displayed in a HTML text &lt;input&gt; is easily changed\
    \ by JavaScript simply by assigning a new string to the value property of that\
    \ form element.\n\nHistorically, text boxes were restricted to display text in\
    \ just one fixed font but modern browsers allow a choice of font, size and color.\n\
    \nThe example below displays a string in a text box and adds characteristics for\
    \ font, foreground-color and background-color:\n\n```\n// a function to set the\
    \ text in a form field\nfunction set_text()\n{\n    // for text field txt1 in\
    \ form f\n    with(document.forms.f.txt1)\n\n    // set the text value\n    value\
    \ = \"JavaScript in easy steps\";\n\n    // set the style characteristics\n  \
    \  style.fontFamily = \"comic sans ms\";\n    style.fontSize = \"16pt\"\n    style.color\
    \ = \"yellow\";\n    style.backgroundColor=\"red\"\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_129_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_129_1.png)"
  merge: -1
