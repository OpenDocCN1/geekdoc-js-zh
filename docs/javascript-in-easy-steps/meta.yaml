  md: "# Multiple functions\n\nJavaScript functions may call other functions during\
    \ the execution of their code in just the same way that the previous examples\
    \ called the JavaScript alert() function.\n\nThe following example demonstrates\
    \ the use of multiple functions to manipulate and display an integer argument:\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_19_0.png)\n\n```\n// a function to\
    \ call a second function\n// and display a returned result\nfunction call_alert(\
    \ num )\n{\n  var new_number = make_double( num );\n  alert(\" The Value Is \"\
    \ + new_number );\n}\n\n// a function to double a_value\n// and return the result\
    \ to the caller\nfunction make_double( num )\n{\n  var double_num = num + num;\n\
    \  return double_num;\n}\n```\n\nThe argument value is passed from the caller\
    \ to the make_double() function via the call_alert() function:\n\n```\n<body onload\
    \ = \"call_alert( 4 )\">\n```\n\nThe value is manipulated by the new_number variable\
    \ in the call_alert() function using the JavaScript return keyword. Finally the\
    \ alert() function is called to display the new_number variable.\n\n![](img/d78298d3338ec680a024bbc83e78b297_19_1.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_19_2.png)"
