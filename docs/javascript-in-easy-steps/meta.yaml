  - '[PAGE 45]


    # Creating arrays


    An array is like a variable that can contain multiple values – unlike a regular
    variable that may only contain a single value.


    A variable is given array status using the JavaScript `new` keyword along with
    the JavaScript `Array()` constructor function.


    Multiple data values can be assigned to the array using the array name together
    with an index number, starting at zero, placed inside square brackets, like in
    this example:


    ```

    // create a new array

    var a = new Array();


    // assign values to the first three array elements

    a[0] = "First"

    a[1] = "JavaScript"

    a[2] = "Array";

    ```


    The array values can now be used just like regular variables.


    ![](img/d78298d3338ec680a024bbc83e78b297_45_0.png)


    For small arrays it is often more convenient to initialize the array values as
    arguments in the `Array()` constructor. This is illustrated in the example below
    creates three arrays:


    ```

    // create and initialize three new arrays

    var a = new Array("Jan", "Feb", "Mar");

    var b = new Array("21", "22", "23");

    var c = new Array("2003", "2004", "2005");

    ```


    ```

    // concatenate and display an element from each array

    alert(a[0] + b[1] + c[2]);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_45_1.png)


    44 | JavaScript in easy steps'
  - '[PAGE 46]


    # Array elements


    Each value held in an array is called an array element.


    When a variable is given array status using the new Array() constructor it also
    gets properties and methods that can be used to manipulate the elements in the
    array.


    ![](img/d78298d3338ec680a024bbc83e78b297_46_0.png)


    One of the most useful these is the length property that may be used to report
    the number of elements that the array currently contains.


    The syntax to use a property or method just takes a period and the name onto the
    object. So array.length references the length property of the array object.


    Notice that an array containing three values will have a length of 3, because
    indexing starts at zero the last element in the array will have an index number
    of only 2.


    The example below demonstrates this point:


    ![](img/d78298d3338ec680a024bbc83e78b297_46_1.png)


    ```

    // create a new array

    var a = new Array();

    a[0] = "JAVASCRIPT";

    a[1] = "ARRAY";

    a[2] = "LENGTH";


    // get the array length

    var arraysize = a.length;


    // display each array element and the array length

    alert(a[0]+a[1]+"\n"+arraysize)

    ```


    Optionally the Array() may take an argument to specify the array elements to create,
    such as:

    var a = new Array(8);


    [JavaScript Application]

    JAVASCRIPT ARRAY LENGTH

    No.of elements is 3

