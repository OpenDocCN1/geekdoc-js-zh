  md: "# Fill elements loop\n\nAll types of loops can be used to easily fill the elements\
    \ of an array with a large number of data values. This is one of the major attractions\
    \ of arrays and it is achieved with very little code.\n\nThe example below first\
    \ creates an array, then on each iteration, the for loop fills each of the array\
    \ elements with a string value to is added to the current counter value.\n\nEach\
    \ element value is concatenated in the variable named str before finally displaying\
    \ in the alert() dialog box:\n\n```\nvar str = \"FILL ELEMENTS LOOP\\n\\n\";\n\
    \n// create a new array\nvar arr = new Array();\n\n// fill eight array elements\n\
    for(var i i = 0; i < 8; i ++)\n{\n  arr[ i ] = \"Number is \" + i + \"\\n\";\n\
    \  str += arr[ i];\n}\n\n// display the value stored in each array element\nalert(str);\n\
    ```\n\n![](img/d78298d3338ec680a024bbc83e78b297_47_0.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_47_1.png)"
