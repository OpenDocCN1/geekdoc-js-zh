  md: '# Search a string


    JavaScript can search a string to find a character or substring passed the argument
    to the string.indexOf() method.


    If a match is made the method returns the starting position of the first occurrence
    of the matched character or substring within the searched string.


    In the event that no match is found the string.indexOf() method returns a value
    of -1.


    The following example uses the string.indexOf() method to seek a dot and @ character
    within an email address string to perform a simple format validation:


    ```

    // create an initialize string to search

    var str = "mailme@domain.com";

    // seek, @ dot and # characters within the string

    var att = str.indexOf("@");

    var dot = str.indexOf(".");

    var hsh = str.indexOf("#");

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_80_0.png)


    An optional second argument may specify the position from which to start the search.


    ![](img/d78298d3338ec680a024bbc83e78b297_80_1.png)


    ```

    // make valid only if an @ and a dot are found

    var fmt = ((att != -1)&&(dot != -1)) "valid":"invalid";

    // display the results of the search

    var res = "Format is " +fmt;

    res += "\n0at @ " +att;

    res += "\n0Dot at " +dot;

    res += "\n0nHash is " +hsh;

    alert(res);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_80_2.png)'
