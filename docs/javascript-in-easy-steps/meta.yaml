    Notice that the capitalization should also match to make strings equal.\n\n![](img/d78298d3338ec680a024bbc83e78b297_30_1.png)\n\
    \nnull is a JavaScript keyword meaning there is no value.\n\n![](img/d78298d3338ec680a024bbc83e78b297_30_2.png)\n\
    \nThe results are displayed using the alert() function, before, but that part\
    \ of the code has been omitted to save space.\n\n![](img/d78298d3338ec680a024bbc83e78b297_30_3.png)\n"
  mdcn: "\n[content]\n\n## 算术示例\n\n```javascript\nvar addnum = 20 + 30; // 加法\nvar\
    \ addstr = \"I love \" + \"JavaScript\"; // 拼接\nvar sub = 35.75 - 28.25; // 减法\n\
    var mul = 8 * 50; // 乘法\nvar mod = 65 % 2; // 取模\nvar inc = 5; ++inc; // 递增\n\
    var dec = 5; dec = --dec; // 递减\nvar result = \"Addnum is \" + addnum + \"\\n\"\
    ;\nresult += \"Addstr is \" + addstr + \"\\n\";\nresult += \"Sub is \" + sub +\
    \ \"\\n\";\nresult += \"Mul is \" + mul + \"\\n\";\nresult += \"Mod is \" + mod\
    \ + \"\\n\";\nresult += \"Inc is \" + inc + \"\\n\";\nresult += \"Dec is \" +\
    \ dec + \"\\n\";\n\nalert( result );\n```\n\n自增和自减运算符也可以用操作数之后。注意，在这些情况下，它们会执行操作，但只返回未处理前的值。\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_24_0.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_24_1.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_24_2.png)\n\n## 逻辑运算符\n\nJavaScript\
    \ 中可以使用的三个逻辑运算符如表所示：\n\n| 运算符 | 操作 |\n| --- | --- |\n| && | 逻辑与 |\n| || | 逻辑或\
    \ |\n| ! | 逻辑非 |\n\n逻辑运算符用于具有布尔值 true 或 false 的操作数——即可以转换为 true 或 false 的值。\n\n\
    逻辑 `&&` 运算符将评估两个操作数，并且只有当两个操作数本身都为 true 时，才会返回 true。否则，`&&` 运算符将返回 false。\n\n\
    这通常用于条件分支，其中 JavaScript 程序的方向通过测试两个条件来确定。如果两个条件都满足，脚本将进入某个方向，否则脚本将进入另一个方向。\n\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_25_0.png)\n\n与需要两个操作数的 `&&` 运算符不同，`||`\
    \ 运算符评估它的两个操作数，如果其中一个操作数本身返回 true，则返回 true。如果两个操作数都没有返回 true，则 `||` 将返回 false。这在\
    \ JavaScript 应用中很有，可以在满足任一测试条件时执行特定操作。\n\n第三个逻辑运算符 `!` 是一个一元运算符，用在单个操作数之前。它返回给定操作数的反值，因此，如果变量\
    \ `a` 的值为 true，那么 `a` 的值将变为 false。在 JavaScript 应用中，它可以使用语句 `a=!!` 在连续的循环迭代中切换变量的值。这将确保在每次通过时值都会发生变化，就像闪烁灯开关一样。\n\
    \n## 逻辑示例\n\n```javascript\nvar a = true , b = false;\nvar test1 = ( a && a );\
    \ // 测试两个操作数是否为 true\nvar test2 = ( a && b );\nvar test3 = ( b && b );\nvar test4\
    \ = ( a || b ); // 测试任一操作数是否为 true\nvar test5 = ( a || b );\nvar test6 = ( b ||\
    \ b );\nvar test7 = !a ; var test8 = !b; // 反转值\nvar result = \"AND \\n\";\nresult\
    \ += \"1: \" +test1 + \" 2: \" +test2 + \" 3: \" + test3;\nresult += \"\\nOR\\\
    n\";\nresult += \"4: \" +test4+ \" 5: \" +test5+ \" 6: \" + test6;\nresult +=\
    \ \"\\nNOT\\n7: \" +test7+ \" 8: \" + test8;\nalert( result );\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_26_0.png)\n\
    \n使用 `\\n` 新行转义字符和空格来格式化显示的输出字符串\n\n![](img/d78298d3338ec680a024bbc83e78b297_26_1.png)\n\
    \nAND\n1: true 2: false 3: false\nOR\n4: true 5: true 6: false\nNOT\n7: false\
    \ 8: true\n\n## 赋值运算符\n\nJavaScript 中常用于赋值的运算符如表所示。除了简单的 `=` 赋值运算符外，所有运算符都是较长表达式的简写形式，因此为了清晰起见，也给出了等价形式。\n\
    \n| 运算符 | 示例 | 等价 |\n| ---|---||---|\n| = | a = b | a = b |\n| += | a += b | a\
    \ = (a + b) |\n| -= | a -= b | a = (a - b) |\n| *= | a *= b | a = (a * b) |\n\
    | /= | a /= b | a = (a / b) |\n| %= | a %= b | a = (a % b) |\n\n![](img/d78298d3338ec680a024bbc83e78b297_27_0.png)\n\
    \n将 `=` 运算符理解为“赋值”而不是“等于”很重要，以避免与 `==` 相等运算符混淆。\n\n在示例中，变量 `a` 被赋值为变量名 `b` 所包含的值，从而成为它的新值。\n\
    \n`+=` 运算符最有用，并在之前的示例中使用过来向现有字符串添加第二个字符串。在表格示例中，`+=` 运算符将变量 `a` 中包含的值加到变量名 `b`\
    \ 的的值上，然后将结果赋值为变量 `a` 中包含的新值。\n\n表中的所有其他运算符工作原理相同——先在两个值之间进行算术运算，然后将结果赋值给第一个变量作为它的新值。\n\
    \n## 赋值示例\n\n```javascript\nvar a = \"JavaScript\", b = \"Code\"; // 赋值字符串值\n\
    a += b; // 拼接字符串并赋值给 a\nvar c = 8, d = 4; // 赋值整数值\nc += d; // 数字相加并将结果赋值给 c\n\
    var e = 7.5, f = 2.5; // 赋值浮点值\ne -= f; // 从 e 中减去 f\nvar g = 8, h = 4; // 赋值整数\n\
    g *= h; // g 乘以 h\nvar i = 8, j = 4; // 赋值整数\ni /= j; // i 除以 j\nvar k = 8, l\
    \ = 4; // 赋值整数\nk %= l; // k 取模 l\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_28_0)\n\
    \n## 比较运算符\n\nJavaScript 中常用于比较两个值的运算符如下：\n\n| 运算符 | 测试 |\n| --- | --- |\n| ==\
    \ | 等于 |\n| != | 不等于 |\n| > | 大于 |\n| < | 小于 |\n| >= | 大于等于 |\n| <= | 小于等于 |\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_29_0.png)\n\n`==` 运算符比较两个操作数，如果它们相等则返回\
    \ true。相反，`!=` 运算符在操作数不相等时返回 true。\n\n`>` 运算符比较两个操作数，如果第一个大于第二个则返回 true。\n\n`<`\
    \ 运算符比较两个操作数，如果第一个小于第二个则返回 true。\n\n`>=` 运算符如果第一个大于或等于第二个则返回 true。\n\n`<=` 运算符如果第一个小于或等于第二个则返回\
    \ true。\n\n## 比较示例\n\n```javascript\n // 比较字符串值\nvar teststrings1 = (\"JavaScript\"\
    \ == \"JavaScript\" );\nvar teststrings2 = (\"JavaScript\" == \"javascript\" );\n\
    \n// 比较数值值\nvar testnumbers1 = ( 1.785 == 1.785 );\nvar testnumbers2 = ( 5 !=\
    \ 5 );\n\n// 比较布尔值\nvar testbooleans1 = ( true == true );\nvar testbooleans2 =\
    \ ( false != false );\nvar testleshan1 = ( 100 < 200 );\nvar testleshan2 = ( 100\
    \ < 100 );\nvar testleshan_equal = ( 100 <= 100 );\nvar testgreaterthan = ( -1\
    \ > 1 );\nvar a = 8, b = 8.0, testvariables1 = ( a == b );\nvar c = null, d =\
    \ null, testvariables2 = ( c == d );\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_30_0.png)\n\
    \n注意大小写也必须匹配使字符串相等。\n\n![](img/d78298d3338ec680a024bbc83e78b297_30_1.png)\n\n\
    `null` 是 JavaScript 关键字，意味着没有值。\n\n![](img/d78298d3338ec680a024bbc83e78b297_30_2.png)\n\
    \n结果以前使用 `alert()` 函数显示，但现在那部分代码已省略以节省空间。\n\n[/content]\n"
