  md: "# Load\n\nThe Load event does not occur until all the HTML elements on a Web\
    \ page have completely loaded. This means that the onload event-handler will only\
    \ run after all the elements are present.\n\nIf JavaScript is to modify elements\
    \ of the document <body> section those elements must be loaded to avoid receiving\
    \ a script error.\n\nTypically the onload event-handler will call a JavaScript\
    \ function, often named init(), that will initialize a number of values.\n\nThis\
    \ example sets the HTML page colors, then it assigns a value to a variable which\
    \ it subsequently assigns to a text box:\n\n![](img/d78298d3338ec680a024bbc83e78b297_151_0.png)\n\
    \n```\n// a function to react to the LOAD event\nfunction init() {\n  // set foreground\
    \ and background colors\n  document.bgColor = \"orange\";n  document.fgColor =\
    \ \"blue\";\n\n  // store a string then display it in a form field\n  var str\
    \ = \"The Page is Loaded\";\n  document.forms.f.txt.value = str;\n\n  // specify\
    \ the onload event-handler\n  window.onload = init;\n```\n\nA HTML event-handler\
    \ assigned to the onload attribute of the <body> tag would replace that assigned\
    \ in the script.\n\n![](img/d78298d3338ec680a024bbc83e78b297_151_1.png)"
  merge: -1
  pgno: 151
