    if (str.charAt(i) != "i") newstr += str.charAt(i);

    else newstr += ""

    ```


    ```

    // display newstr and the first and last letters of string

    var result = "STRING\n\n";

    result += "New string : " + newstr + "\n";

    alert(result + a + "\n" + z );

