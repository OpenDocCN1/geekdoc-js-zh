  md: "# Close pop-up\n\nA window can close itself simply by calling the window.close()\
    \ method by closing a pop-up window requires a little more effort.\n\nThe initial\
    \ call to the window.open() method should be assigned to a variable to create\
    \ a window object. This new object inherits the window.close() method which can\
    \ close the pop-up.\n\nThis example verifies the existence of the pop-up window\
    \ before closing it when the user exits the main window...\n\n```\n// create a\
    \ variable to store a window object\nvar popwindow;\n\n// a function to open a\
    \ pop-up window\nfunction popup() {\n  popwindow = window.open(\"popup-2.html\"\
    , \"\", \"top=40,left=40,width=250,height=100,menubar,status\");\n}\n\n// a function\
    \ to close a pop-up window\nfunction close_popup() {\n  if(popwindow != null )\
    \ popwindow.close();\n}\n\n// set the onload and unload objects\nwindow.onload\
    \ = popup;\nwindow.onunload = close_popup;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_107_0.png)\n\
    \nThis pop-up page is the same as in the example on page 104 - JavaScript has\
