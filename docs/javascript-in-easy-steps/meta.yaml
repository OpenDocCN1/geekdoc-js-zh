  - "[PAGE 117]\n\n# Images array\n\nThe window.document.images[] object is an array\
    \ of all image objects contained within a Web page – in the order in which the\
    \ HTML code added them to the page. So the first listed image is allocated to\
    \ the first array element and can be addressed as document.images[0].\n\n![](img/d78298d3338ec680a024bbc83e78b297_117_0.png)\n\
    \nAlways give images a name with the HTML id\n\nIn this example the name assigned\
    \ to the HTML id attribute and the src URL can be accessed for each image along\
    \ with the total length of the document.images:\n\n![](img/d78298d3338ec680a024bbc83e78b297_117_1.png)\n\
    \nThe images array elements are only available after the browser has loaded the\
    \ page.\n\n![](img/d78298d3338ec680a024bbc83e78b297_117_2.png)\n\n```\n// a function\
