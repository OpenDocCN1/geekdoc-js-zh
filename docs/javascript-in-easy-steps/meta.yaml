  md: "# Preloader array\n\nRollover images in Web pages use a JavaScript effect to\
    \ swap the original image for a replacement when the user places the cursor over\
    \ the image.\n\nIn order for this effect to work smoothly, without any download\
    \ delay, the required replacement image must be already loaded into the browser\
    \ cache.\n\nOne way to do this is to use a JavaScript preload routine that forces\
    \ the browser to download the image by creating new Image() objects that use the\
    \ swap images as their source.\n\n![](img/d78298d3338ec680a024bbc83e78b297_53_0.png)\n\
    \n```\n// create an array of the URLs of all images that are to\n// appear in\
    \ the slideshow\nvar pics = new Array(\"pic1.gif\", \"pic2.gif\", \"pic3.gif\"\
    );\n\n// create new empty array\nvar preload = new Array();\n\n// insert a new\
    \ Image object into each empty\n// then assign each image URL to the Image objects\n\
    for(var i = 0; i < pics.length; i++) {\n  preload[i] = new Image();\n  preload[i].src\
    \ = pics[i];\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_53_1.png)\n\n\
    A preload array is used with the slide show script example on page 66.\n\nThe\
    \ script example uses arrays to preload swap images to be ready when the rollover\
    \ effect is activated.\n\nThe first array contains the URL of each image file.\n\
    \nFor each element in the pics array the for loop creates a corresponding element\
    \ in the preload array.\n\nEach of the preload elements is assigned a new Image()\
    \ object, then the image URLs are assigned to their src property. This forces\
    \ the browser to download each image file into its cache – ready to be displayed\
    \ without delay."
