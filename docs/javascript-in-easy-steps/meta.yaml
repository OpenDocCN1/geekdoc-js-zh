    \ hidden 将导致层从视图中消失。\n\n相反，初始创建时可见性样式值为 hidden 的层可以通过将该值改为 visible 来显示。\n\n以下脚本使用\
    \ onmouseover 和 mouseout 事件处理程序切换单个层的可见性，如下：\n\n```html\n<a href=\"javascript://\"\
