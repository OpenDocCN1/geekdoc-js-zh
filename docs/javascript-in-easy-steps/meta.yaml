    \ Washington Done | | | |\n\n## 13. JavaScript in HTML\n\n## DOM reference\n\n\
    The chart below illustrates the important parts of the Document Object Model (DOM)\
    \ to explain how the objects in a Web page are related. Those marked with an *\
    \ are specific to Microsoft Internet Explorer and are not found in other browsers.\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_179_0.png)\n\n## JavaScript in e-commerce\n\
    \nThis final chapter shows how some of the earlier examples may be applied to\
    \ e-commerce applications and illustrates how frames can store data for later\
    \ use in other frames.\n\n## Covers\n\n- The products page | 180\n- A hidden form\
    \ | 181\n- Get the customer details | 182\n- Generate an order number | 183\n\
    - Confirm the order | 184\n- Submit the order | 185\n- What next ? | 186\n\n##\
    \ The products page\n\nThe example in this chapter follows the development of\
    \ an on-line order that starts with a page from which the user may select quantities\
    \ of items to order.\n\nThe page is framed with a left-hand panel named menu and\
    \ a right-hand larger frame named main.\n\n![](img/d78298d3338ec680a024bbc83e78b297_181_0.png)\n\
    \nTypically the menu frame will remain constantly displayed while the main frame\
    \ will display different pages as the user navigates around the site.\n\nA button\
    \ is added at the bottom of the form that will advance the user to the next stage\
    \ of the order process.\n\nIn the form, depicted below, the user has entered quantity\
    \ requirement for some of the illustrated products:\n\n![](img/d78298d3338ec680a024bbc83e78b297_181_1.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_181_2.png)\n\nThe frame-holder document\
    \ for this example is named e-commerce.html. It displays menu.html in the menu\
    \ frame and (initially) products.html in the main frame as shown above.\n\n##\
    \ A hidden form\n\nThe page in the menu frame contains a hidden form named m (for\
    \ memory) that will retain the order data while the pages in the main frame are\
    \ changed.\n\n![](img/d78298d3338ec680a024bbc83e78b297_182_0.png)\n\nIt consists\
    \ of input items that mirror those of the form named f on the product page together\
    \ with inputs for customer name, account number and order number.\n\n![](img/d78298d3338ec680a024bbc83e78b297_182_1.png)\n\
    \n```html\n<-- a form to store order data --\n<form id=\"m\" action=\"\" method=\"\
    post\">\n<input type=\"hidden\" name=\"customer\" value=\"\"/>\n<input type=\"\
    hidden\" name=\"accountname\" value=\"\"/>\n<input type=\"hidden\" name=\"ordernum\"\
    \ value=\"\"/>\n<input type=\"hidden\" name=\"ball\" value=\"\"/>\n<input type=\"\
    hidden\" name=\"hoop\" value=\"\"/>\n<input type=\"hidden\" name=\"cone\" value=\"\
    \"/>\n</form>\n```\n\nThe onclick attribute of the button on the products page\
    \ calls a JavaScript function that fills the values of the hidden form m with\
    \ the values entered by the user into the products page f. It then loads a new\
    \ page into the main frame.\n\n![](img/d78298d3338ec680a024bbc83e78b297_182_2.png)\n\
    \n```javascript\n// a function to store values in a form in another frame\nfunction\
    \ populate() {\n  // variables for the form\n  var m = parent.frames.menu.document.forms.m;\n\
    \  var f = document.forms.f;\n\n  // copy the values\n  m.ball.value = f.ball.value;\n\
    \  m.hoop.value = f.hoop.value;\n  m.cone.value = f.cone.value;\n\n  // load a\
    \ new page into this frame\n  window.location = \"customer.html\";\n}\n```\n\n\
    ## Get the customer details\n\nThe next page in the main frame, customer.html,\
    \ requests the customer's name and account number.\n\nWhen the user clicks the\
    \ button on its page its onclick calls JavaScript function to store the input.\
    \ It copies the values of the form inputs to identically-named hidden inputs in\
    \ the memory frame.\n\n![](img/d78298d3338ec680a024bbc83e78b297_183_0.png)\n\n\
    ```javascript\n// a function to store values in a form in another frame\nfunction\
    \ populate() {\n  // variables for the form\n  var m = parent.frames.menu.document.forms.m;\n\
    \  var f = document.forms.f;\n\n  // copy the values\n  m.customer.value = f.customer.value;\n\
    \  m.accountnumber.value = f.accountnumber.value;\n\n  // load another page in\
    \ this frame\n  window.location = \"confirm.html\";\n}\n```\n\nAdd validation\
    \ routines to check that the user has made entries.\n\n![](img/d78298d3338ec680a024bbc83e78b297_183_1.png)\n\
    \n| E-commerce Example | |\n| :--- | :--- |\n| File Edit View Favorites | |\n\
    | Menu Please Enter Your Details... | |\n| Customer Name: John Smith | |\n| Products\
    \ | |\n| Account Number: 12345 | |\n| Confirm This Order | |\n| Done | |\n\n##\
    \ JavaScript in easy steps\n\n## Generate an order number\n\nThe final page that\
    \ appears in the order process contains all details of the customer's order for\
    \ the user to confirm before submitting the order.\n\nThese details are dynamically\
    \ written by JavaScript with data retrieved from the hidden form m in the menu\
    \ frame. It is useful to allocate a unique number to the customer's order for\
    \ identification purposes. The JavaScript on the confirmation page generates this\
    \ number, stores it in the hidden form m in the menu frame. Typically a Date object\
    \ can provide an order number using parts of the current time concatenated into\
    \ a single number. In this script the order number will comprise the final number\
    \ in the year followed by the month number, then the hour, and second:\n\n```javascript\n\
    // variables for the form\nvar m = parent.frames.menu.document.forms.m;\nvar f\
    \ = document.forms.f;\n\n// generate a time-derived order number\nvar d = new\
    \ Date();\nvar yr = (d.getFullYear()).toString();\nyr = yr.charAt(3);\nvar mo\
    \ = (d.getMonth()).toString();\nvar hr = (d.getHours()).toString();\nvar mn =\
    \ (d.getMinutes()).toString();\nvar sc = (d.getSeconds()).toString();\nvar on\
    \ = yr + mo + hr + mn + sc;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_184_0.png)\n\
    \nconfirm.js (part of)\n\n![](img/d78298d3338ec680a024bbc83e78b297_184_1.png)\n\
    \nBEWARE It is unlikely that two different customers could generate the order\
    \ number at exactly the time.\n\n```javascript\n// store the order number with\
    \ the other order data\nm.ordernumber.value = on;\n```\n\nThe script continues\
    \ on the next page to dynamically write content using the hidden form m to state\
    \ the order number, customer name and account number. Items required for the order\
    \ and their quantity are listed only for those items where the user has made an\
    \ entry.\n\n## Confirm the order\n\n```javascript\n// write out the generated\
    \ order number\ndocument.write(\"Order No. \" + m.ordernum.value);\n\n// write\
    \ out the customer details\ndocument.write(\"<br/>For \" + m.customer.value);\n\
    document.write(\"<br/>Account No. \" + m.accountnum.value);\n\n// write out any\
    \ ordered products\ndocument.write(\"<br/>\");\nif (m.ball.value != \"\")\ndocument.write(\"\
    \" + m.ball.value+\" Balls @ $7.99 each<br/>\");\nif (m.hop.value != \"\")\ndocument.write(\"\
    \" + m.hop.value+\" Hoops @ $3.99 each<br/>\");\nif (m.cone.value != \"\")\ndocument.write(\"\
    \" + m.cone.value+\" Cones @ $5.99 each<br/>\");\n```\n\nconfirm.js (cont'd)\n\
    \nInclude this script in the body of the HTML document at the point where the\
    \ details are to appear.\n\nAdd a feature to navigate back to the order page so\
    \ the user can amend the order if required.\n\n![](img/d78298d3338ec680a024bbc83e78b297_185_0.png)\n\
    \nThe confirm.html document contains a further hidden form with the id of f that\
    \ exactly mirrors the hidden m in the menu frame. When the user clicks the button\
    \ on its page its onclick attribute calls a JavaScript function that copies all\
    \ the values from m to form f, then it submits f to the server.\n"
