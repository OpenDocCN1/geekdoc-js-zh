- md: "\n## Setting date and time\n\nThe JavaScript code may manipulate the Date information\n\
    using a variety of Date.set() methods.\n\nThese mirror the range of Date.get()\
    \ methods that are used to\nextract parts of the Date object information but are\
    \ used instead to\nset new values.\n\nIn the example below the initial Date object\
    \ values are stored in the\norig named orig. Then the various Date.set() methods\n\
    apply new values to the Date object information:\n\n```javascript\n// create a\
    \ new Date object\nvar now = new Date();\n\n// store the original date and time\
    \ information\nvar orig = \"Original \\n\" + now.toString() + \"\\n\\n\";\n//\
    \ set new date and time details\nnow.setDate(21);\nnow.setMonth(1);\nnow.setHours(12);\n\
    now.setMinutes(30);\nnow.setSeconds(15);\nnow.setFullYear(2005);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_61_0.png)\n\
    \n> HOT TIP\n> The toString()\n> method used here\n> returns the string\n> value\
    \ of JavaScript\n> objects and has\n> uses.\n\n```javascript\n// store the modified\
    \ date and time information\nvar mod = \"Modified :\\n\" + now;\n\n// display\
    \ original and modified date and times\nalert(orig + mod);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_61_1.png)\n\
    \n## Date strings\n\nIn many instances the Date object information must be converted\
    \ into a string in order to store or use that information.\n\nThe Date.toString()\
    \ method on the facing page does this but it is preferable to store this information\
    \ in standard UTC time.\n\nJavaScript provides the Date.toGMTString() method that\
    \ both converts the information to a string and converts it to the GMT zone.\n\
    \nUsing this method of storing date information avoids time confusion and is commonly\
    \ used as the standard when setting the life span of cookie files.\n\n![](img/d78298d3338ec680a024bbc83e78b297_62_0.png)\n\
    \nThis simple example illustrates the Date.toGMTString() method performing its\
    \ conversions in a browser in Tokyo, Japan:\n\n```javascript\n// create a new\
    \ Date object\nvar now = new Date();\n\n// store local time\nvar jpn = \"Tokyo\
    \ Time:\\n\" +now.toString() + \"\\n\\n\"\n\n// store GMT time\nvar gmt = \"UTC\
    \ Time:\\n\" + now.toGMTString();\n\n// display local time and GMT time\nalert(jpn\
    \ + gmt);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_62_1.png)\n![](img/d78298d3338ec680a024bbc83e78b297_62_2.png)\n\
    \n5. Date and time | 61\n\n## Using the system clock\n\nWhen a JavaScript is needed\
    \ to create an action repeatedly in a Web browser the system clock can be used\
    \ with the JavaScript setTimeout() method of the window object.\n\nThe window.setTimeout()\
    \ method can run a function after a specified interval. Two arguments are required\
    \ stating name of the function to call and the required interval time in milliseconds.\
    \ This method is often used at the end of a function to call the same function\
    \ recursively, following a set delay.\n\n![](img/d78298d3338ec680a024bbc83e78b297_63_0.png)\n\
    \nMany uses can be found for this method in creating dynamic effects. For instance,\
    \ in slideshow scripts where the function displays successive images at given\
    \ intervals.\n\nThe example here uses the window.setTimeout() method to display\
    \ an alert() box at 10 second intervals:\n\n```javascript\n// create and initialize\
    \ a counter variable\nvar num = 0;\n\n// a recursive function to display a message\n\
    function timeout() {\n  // increment the counter\n  num++;\n  // display the message\n\
    \  alert(\"This is 10-Second Message No: \" + num );\n  // set the interval before\
    \ calling this function again\n  window.setTimeout(\"timeout()\", 10000);\n}\n\
    \n// call the function to start the routine\ntimeout();\n```\n\n[JavaScript Application]\n\
    This is 10-Second Message No: 3\n[OK]\n\n## Cancelling the timer\n\nThe unfortunate\
    \ viewer of the site containing the JavaScript on the previous page would doubtless\
    \ feel aggrieved at the constant alert box messages. It may be better to show\
    \ the message only a couple of times then calling the timeout() function.\n\n\
    The window.setTimeout() method can be cancelled easily using the window.clearTimeout()\
    \ method.\n\nIn order to clear the timer correctly it is necessary to assign the\
    \ original window.setTimeout() call to a variable - so that variable can be passed\
    \ as the window.clearTimeout() call argument.\n\nThe following example displays\
    \ a message twice, then displays a final message when the timer is cleared:\n\n\
    ```javascript\n// create a counter variable and a timer variable\nvar num = 0,\
    \ tim;\n\nfunction timeout() {\n  num++;\n  if (num == 3) {\n    alert(\"OK -\
    \ I told you twice\");\n    window.clearTimeout( tim); // cancel the timer\n \
    \ }\n  else {\n    alert(\"This is 10-Second Message No: \" + num);\n    tim =\
    \ window.setTimeout(\"timeout()\", 10000);\n  }\n}\ntimeout();\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_64_0.png)\n\
    The variable tim often used to name the timer.\n\n![](img/d78298d3338ec680a024bbc83e78b297_64_1.png)\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_64_2.png)\n\n5. Date and time | 63\n\n\
    ## JavaScript clock\n\nUtilizing the Date object along with a timer to create\
    \ a display that updates every second to produce a clock. The example below displays\
    \ the local time dynamically in an HTML form named clock with id f:\n\n```javascript\n\
    function tick() {\n  // create a new Date object\n  var now = new Date();\n\n\
    \  // extract the current hours, minutes and seconds\n  var hh = now.getHours();\n\
    \  var mn = now.getMinutes();\n  var ss = now.getSeconds();\n\n  // ensure each\
    \ component has two digits\n  if(hh <= 9) hh = \"0\" + hh;\n  if(mn <= 9) mn =\
    \ \"0\" + mn;\n  if(ss <= 9) ss = \"0\" + ss;\n\n  // assign the current time\
    \ to the form field\n  document.forms.f.value = hh + \":\" + mn + \":\" + ss;\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_65_0.png)\n![](img/d78298d3338ec680a024bbc83e78b297_65_1.png)\n\
    \nThe clock needs to be started by calling the tick() function from the onload\
    \ attribute of the HTML <body> tag - <body onload=\"tick()\"> This ensures that\
    \ the form has JavaScript to assign the time to its clock field.\n\n// set the\
    \ interval to one second\nwindow.setTimeout(\"tick()\", 1000);\n\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_65_2.png)\n\
    \n## Doing mathematics\n\nThis chapter is devoted to the Math object and describes\
    \ the constant values and methods that are available to perform mathematical calculations.\
    \ The subject of random number generation is covered and illustrated with a practical\
    \ example.\n\n- Math constants | 66\n- Using pi | 67\n- Math methods | 68\n- Rounding\
    \ floats | 69\n- Forcing floats | 70\n- Comparing numbers | 71\n- Random generator\
    \ | 72\n- Lottery picker | 73\n- Random images | 74\n\n![](img/d78298d3338ec680a024bbc83e78b297_66_0.png)\n\
    \n## Math constants\n\nThe intrinsic JavaScript Math object contains a number\
    \ of standard constant values for easy reference.\n\nUppercase is always used\
    \ to refer to the constant values which are all listed in the following table:\n\
    \n| Constant | Description |\n| :--- | :--- |\n| Math.E | The constant e of the\
    \ natural logarithm with a value of approximately 2.71828 |\n| Math.LN2 | The\
    \ natural logarithm of 2 approximately 0.6931471805599458263 |\n| Math.LN10 |\
    \ The natural logarithm of 10 approximately 2.3025850299405911 |\n| Math.LOG2E\
    \ | The base-2 logarithm of e approximately 1.44269504088963387 |\n| Math.LOG10E\
    \ | The base-10 logarithm of e approximately 0.4342944819032518677 |\n| Math.PI\
    \ | The constant pi approximately 3.14159265358979 |\n| Math.SQRT1_2 | The reciprocal\
    \ of the square root of 2 approximately 0.707106781186542 |\n| Math.SQRT2 | The\
    \ square root of 2 with a value of approximately 1.41421356237095 |\n\nThe Math\
    \ constants can be used anywhere within a script.\n\nMost of the Math constants\
    \ are used only in JavaScript applications that have a particular mathematical\
    \ purpose but the full list is given above for completeness.\n\nThe Math.PI constant\
    \ creates interesting possibilities with dynamic effects. The following example\
    \ script dynamically rotates a layer named div:\n\n## Using pi\n\n```javascript\n\
    // global variable to store position\nvar pos = 0;\n\n// function to rotate a\
    \ div with id of \"d1\"\nfunction spin() {\n  // get the div's style object\n\
    \  var obj_style = document.getElementById(\"d1\").style;\n  // stored radius\
    \ and x,y offsets\n  var radius = 40;\n  var x_offset = 50;\n  var y_offset =\
    \ 50;\n  // increment to the new position\n  pos += 10;\n  // use Math to calculate\
    \ the new x,y coordinates\n  x = radius * Math.cos(pos * Math.PI/180 );\n  y =\
    \ radius * Math.sin(pos * Math.PI/180 );\n  // add the x,y offsets\n  x += x_offset;\n\
    \  // move the div to its new coordinates\n  obj_style.left = x + \"px\";\n  obj_style.top\
    \ = y + \"px\";\n  // set the interval to call this function\n  setTimeout(\"\
    spin()\", 100);\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_68_0.png)\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_68_1.png)\n![](img/d78298d3338ec680a024bbc83e78b297_68_2.png)\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_68_3.png)\n\nDoing mathematics | 67\n"
  mdcn: "\n\n## 设置日期和时间\n\nJavaScript 代码可以使用多种 `Date.set()` 方法来操作日期信息。\n\n这些方法与 `Date.get()`\
    \ 方法相对应，后者用于提取 Date 对象的某些信息，而前者则被用于设置新值。\n\n在下面的示例中，初始的 Date 对象值被存储在名为 `orig`\
    \ 的变量中。然后，各种 `Date.set()` 方法会将新值应用到日期对象上：\n\n```javascript\n// 创建一个新的 Date 对象\n\
    var now = new Date();\n\n// 存储原始日期和时间信息\nvar orig = \"Original \\n\" + now.toString()\
    \ + \"\\n\\n\";\n// 设置新的日期和时间细节\nnow.setDate(21);\nnow.setMonth(1);\nnow.setHours(12);\n\
    now.setMinutes(30);\nnow.setSeconds(15);\nnow.setFullYear(2005);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_61_0.png)\n\
    \n> 小贴士\n> 此处使用的\n> toString()\n> 方法返回 JavaScript\n> 对象的字符串值\n> 并具有\n> 许多用途\n\n\
    ```javascript\n// 存储修改后的日期和时间信息\nvar mod = \"Modified :\\n\" + now;\n\n// 显示原始和修改后的日期时间\n\
    alert(orig + mod);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_61_1.png)\n\
    \n## 日期字符串\n\n在许多情况下，必须将 Date 对象的信息转换为字符串以便存储或使用。\n\n上一面的 `Date.toString()` 方法可以做到这一点，但最好将这些信息存储为标准的\
    \ UTC 时间。\n\nJavaScript 提供了 `Date.toGMTString()` 方法，它既可以将信息转换为字符串，将其转换为 GMT 时区。\n\
    \n使用这种方法存储日期信息可以避免时间混乱，并且在设置 cookie 文件的有效期时通常被视为标准。\n\n![](img/d78298d3338ec680a024bbc83e78b297_62_0.png)\n\
    \n这个简单的示例说明了 `Date.toGMTString()` 方法在日本东京的浏览器中执行转换：\n\n```javascript\n// 创建一个新的\
    \ Date 对象\nvar now = new Date();\n\n// 存储本地时间\nvar jpn = \"Tokyo Time:\\n\" +now.toString()\
    \ + \"\\n\\n\"\n\n// 存储 GMT 时间\nvar gmt = \"UTC Time:\\n\" + now.toGMTString();\n\
    \n// 显示本地时间和 GMT 时间\nalert(jpn + gmt);\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_62_1.png)\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_62_2.png)\n\n5. 日期和时间 | 61\n\n## 使用系统时钟\n\
    \n当需要 JavaScript 在 Web 浏览器中重复创建动作时，可以使用系统时钟配合 window 对象的 JavaScript `setTimeout()`\
    \ 方法。\n\n`window.setTimeout()` 方法可以在指定的间隔后运行函数。它需要两个参数：指定要调用的函数名称以及以毫秒为单位所需的间隔时间。该方法通常用于函数的末尾，在设置的延迟后递归地调用同一个函数。\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_63_0.png)\n\n该方法在创建动态效果方面有很多用途。例如，在幻灯片脚本中，函数按给定的间隔显示连续的图像。\n\
    \n此处的示例使用 `window.setTimeout()` 方法每隔 10 秒显示一次 `alert()` 框：\n\n```javascript\n\
    // 创建并初始化计数变量\nvar num = 0;\n\n// 用于显示消息的递归函数\nfunction timeout() {\n  // 递增计数\n\
    \  num++;\n  // 显示消息\n  alert(\"This is 10-Second Message No: \" + num );\n  //\
    \ 在再次调用此函数之前设置间隔\n  window.setTimeout(\"timeout()\", 10000);\n}\n\n// 调用函数启动程序\n\
    timeout();\n```\n\n[JavaScript 应用]\n这是第 10 秒的消息编号：3\n[确定]\n\n## 取消计时器\n\n上一页包含\
    \ JavaScript 的网站的不幸读者无疑会由于不断弹出的 alert 框消息感到恼恼。可能只显示几次消息然后调用 `timeout()` 函数会更好。\n\
    \n可以使用 `window.clearTimeout()` 方法轻松地取消 `window.setTimeout()` 方法。\n\n为了正确清除计时器，有必要将原始的\
    \ `window.setTimeout()` 调用赋值给一个变量——这样该变量就可以作为 `window.clearTimeout()` 调用的参数传递。\n\
    \n下面的示例显示两次消息，然后在计时器清除时显示最后一条消息：\n\n```javascript\n// 创建计数变量和计时器变量\nvar num =\
    \ 0, tim;\n\nfunction timeout() {\n  num++;\n  if (num == 3) {\n    alert(\"OK\
    \ - I told you twice\");\n    window.clearTimeout( tim); // 取消计时器\n  }\n  else\
    \ {\n    alert(\"This is 10-Second Message No: \" + num);\n    tim = window.setTimeout(\"\
    timeout()\", 10000);\n  }\n}\ntimeout();\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_64_0.png)\
    \ 变量 `tim` 常用于命名计时器。\n\n![](img/d78298d3338ec680a024bbc83e78b297_64_1.png)\n![](img/d78298d3338ec680a024bbc83e78b297_64_2.png)\n\
    \n5. 日期和时间 | 63\n\n## JavaScript 钟\n\n利用 Date 对象配合计时器创建一个每秒更新一次显示。下面的示例在 id 为\
    \ `f` 的 HTML 表单中动态显示本地时间：\n\n```javascript\nfunction tick() {\n  // 创建一个新的 Date\
    \ 对象\n  var now = new Date();\n\n  // 提取当前的时、分、秒\n  var hh = now.getHours();\n\
    \  var mn = now.getMinutes();\n  var ss = now.getSeconds();\n\n  // 确保每个组件都是两位数\n\
    \  if(hh <= 9) hh = \"0\" + hh;\n  if(mn <= 9) mn = \"0\" + mn;\n  if(ss <= 9)\
    \ ss = \"0\" + ss;\n\n  // 将当前时间赋值给表单字段\n  document.forms.f.value = hh + \":\"\
    \ + mn + \":\" + ss;\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_65_0.png)\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_65_1.png) 钟需要通过 HTML `<body>` 标签的 `onload`\
    \ 属性调用 `tick()` 函数来启动——这确保了表单通过 JavaScript 将时间赋值给其字段。\n\n// 设置间隔为一秒\nwindow.setTimeout(\"\
    tick()\", 1000);\n\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_65_2.png)\n\
    \n## 数学运算\n\n本章介绍 `Math` 对象，并描述了用于执行数学计算的常量值和方法。随机数生成主题通过实际示例进行了说明。\n\n- Math\
    \ 常量 | 66\n- 使用 pi | 67\n- Math 方法 | 68\n- 浮点数舍入 | 69\n- 强制浮点数 | 70\n- 数字比较 |\
    \ 71\n- 随机生成器 | 72\n- 彩票选择器 | 73\n- 随机图像 | 74\n\n![](img/d78298d3338ec680a024bbc83e78b297_66_0.png)\n\
    \n## Math 常量\n\n内置的 JavaScript Math 对象包含了标准常量值以便引用。\n\n大写字母始终引用表中列出的常量值：\n\n|\
    \ 常量 | 说明 |\n| :--- | :--- |\n| Math.E | 自然对数 e，值约为 2.71828 |\n| Math.LN2 | 2\
    \ 的自然对数，约为 0.6931471805599458263 |\n| Math.LN10 | 10 的自然对数，约为 2.3025850299405911\
    \ |\n| Math.LOG2E | e 的底数为 2 的对数，约为 1.44269504088963387 |\n| Math.LOG10E | e 的底数为\
    \ 10 的对数，约为 0.4342944819032518677 |\n| Math.PI | 常量 pi，约为 3.14159265358979 |\n\
    | Math.SQRT1_2 | 2 的平方根的倒数，约为 0.707106781186542 |\n| Math.SQRT2 | 2 的平方根，值约为 1.41421356237095\
    \ |\n\nMath 常可以在脚本中的任何地方使用。\n\n大部分常量用于具有特定数学目的的 JavaScript 应用，但为了完整性，上面提供了完整列表。\n\
    \n`Math.PI` 常量通过动态效果创造了有趣的可能性。下面的示例脚本动态地旋转名为 `div` 的层：\n\n## 使用 pi\n\n```javascript\n\
    // 存储位置的全局变量\nvar pos = 0;\n\n// 旋转 id 为 \"d1\" 的 div 的函数\nfunction spin() {\n\
    \  // 获取 div 的样式对象\n  var obj_style = document.getElementById(\"d1\").style;\n\
    \  // 存储半径和 x,y 偏移\n  var radius = 40;\n  var x_offset = 50;\n  var y_offset =\
    \ 50;\n  // 增加新位置\n  pos += 10;\n  // 使用 Math 计算新的 x,y 坐标\n  x = radius * Math.cos(pos\
    \ * Math.PI/180 );\n  y = radius * Math.sin(pos * Math.PI/180 );\n  // 加上 x,y\
    \ 偏移\n  x += x_offset;\n  // 将 div 移动到新坐标\n  obj_style.left = x + \"px\";\n  obj_style.top\
    \ = y + \"px\";\n  // 设置调用此函数的间隔\n  setTimeout(\"spin()\", 100);\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_68_0.png)\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_68_1.png)\n![](img/d78298d3338ec680a024bbc83e78b297_68_2.png)\n\
    ![](img/d78298d3338ec680a024bbc83e78b297_68_3.png)\n\n"
