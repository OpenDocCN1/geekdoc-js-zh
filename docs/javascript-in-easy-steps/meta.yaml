  - "[PAGE 33]\n\n# Conditional if\n\nif keyword is used to perform the basic conditional\
    \ JavaScript test to evaluate an expression for a boolean value. The statement\
    \ following the evaluation will only be executed when the expression returns true.\
    \ The syntax for the if statement looks like this:\n\n```\nif (test expression)\
    \ statement-to-execute-when-true;\n```\n\nThe code to be executed may contain\
    \ multiple statements if they are enclosed within curly braces to form a statement\
    \ block.\n\nIn the example below the expression to be tested uses the modulus\
    \ operator to determine if the value contained in the variable called num is exactly\
    \ divisible by 2. The statement has two statements — one to assign a string value\
    \ to a variable and another to call a JavaScript function.\n\n```\n// create variables\n\
    var msg, num;\n = 7;\n// test if the number is not exactly divisible by 2\nif\
    \ ( num % 2 != 0 )\n{\n  msg = num + \" is an odd number.\";\n  alert( msg);\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_33_0.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_33_1.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_33_2.png)"
  - "[PAGE 34]\n\n# If - prompt example\n\nThis example calls the JavaScript prompt()\
    \ function which needs two arguments to be supplied by the caller. The first argument\
    \ is the message to be displayed and the second is a default entry in the input\
    \ field – in this case an empty string.\n\nThe user input is assigned to the username\
    \ variable and is displayed by the alert() function if the string is not still\
    \ empty.\n\n```\n// initialize a variable with a null value\nvar username = null;\n\
    \nif ( username == null) {\n    // ask the user for their name\n    username =\
    \ prompt(\"Please Enter Your Name\", \"\");\n    // .. or greet the user by name\n\
    \    if ( username != \"\" ) alert(\"Welcome \" + username);\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_34_0.png)\n\
    \nBEWARE The prompt dialog will open with an empty input field but is shown here\
    \ following user input.\n\n![](img/d78298d3338ec680a024bbc83e78b297_34_1.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_34_2.png)"
  - '[PAGE 35]


    # If - else statements


    The JavaScript else keyword can be used with an if statement to provide alternative
    code to execute, in the event that the test expression returns false.


    This is known as conditional branching and has this syntax:


    ```

    if (test expression) do-this; or-else-do-this;

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_35_0.png)


    Several expressions may be tested until a true value is found when the code following
    the true expression will be executed. It is important to note any further code
    contained in the if-else statement is ignored.


    So in the following example code after the call to the alert() function by the
    third test will be executed:


    ```

    var num = 2, bool = false;

    // is the number 1 and the boolean value true ?

    if(num == 1 && bool == 1) alert("TEST1 bool: " + bool);

    else

    // is the number 2 and the boolean value true ?

    if(num == 2 && bool == 1) alert("TEST2 bool: " + bool);

    else

    // is the number 2 and the boolean value false ?

    if(num == 2 && bool == 0) alert("TEST3 bool: " + bool);

    else

    // is the number 3 and the boolean value false ?

    if(num == 3 && bool == 0) alert("TEST4 bool: " + bool);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_35_1.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_35_2.png)


    |JavaScript Application|\ TEST3 bool: false

    OK


