  md: "# # Adding more elements\n\nAdditional elements can be added to an array, without\
    \ specifying an actual index number, by using the array.length property to find\
    \ the next available empty element.\n\nBecause the array.length value exceeds\
    \ the last index number by one it will always specify the next free element when\
    \ it is used as the index number – between the square brackets.\n\nThe example\
    \ below illustrates this assigning the integer 4 to the next free element in the\
    \ array named a.\n\nThe b array elements are initialized, then the for loop successively\
    \ assigns the b element values to each free element in the a array.\n\nFinally\
    \ all array elements are displayed by the alert() function in concatenated format\
    \ by the array.concat() method.\n\n```\nvar a = new Array(1, 2, 3 );\n\n// insert\
    \ an integer into the next empty element\na[a.length] = 4;                   \
    \   // a.length is 3\n\nvar b = new Array(5, 6, 7);\n\n// copy each b value into\
    \ the empty elements\nfor(var i = 0; i < b.length; i++) {\n  a[a.length] = b[i];\n\
    }\n\n// display all element values\nalert( a.concat() ));\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_48_0.png)\n\
    \nThe method array.concat() will display all the elements in an array, separated\
    \ by commas.\n\n![](img/d78298d3338ec680a024bbc83e78b297_48_1.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_48_2.png)"
