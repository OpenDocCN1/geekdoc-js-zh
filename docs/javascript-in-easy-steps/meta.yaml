    \ useful when the page contains a large number of graphics that may take a while\
    \ to download. If these images are used by the script it is essential that they\
    \ finish downloading before the script starts to run.\n\n![](img/d78298d3338ec680a024bbc83e78b297_103_0.png)\n\
    \nThe HTML onload attribute, that may optionally be included in the HTML <body>\
    \ tag, can also set the window.onload object - so care is needed to avoid overwriting\
    \ one with the other.\n\nThis is again the case with the window.onunload object\
    \ and the HTML <body> tag's attribute which can both specify a function to call\
    \ when the user navigates to a new location.\n\nTypically window.onunload calls\
    \ a function that creates a pop-up when the user leaves a website.\n\nThis example\
    \ displays a simple alert() dialog message when the user exits the page:\n\n```\n\
    // a function to display an exit message\nfunction goodbye() {\n  alert(\"Thanks\
    \ - Come back soon\");\n}\n\n// specify the onunload event-handler\nwindow.onunload\
    \ = goodbye;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_103_1.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_103_2.png)\n\
    \n|JavaScript Application| Thanks for calling - Come back soon | OK |"
  - '[PAGE 104]


    # Status


    The window.status object can be used to display a message in the status bar of
    the browser window until another feature in the displayed document sets a new
    status bar message, or the status bar is returned to its default state.


    A default message to display can be specified with the window.defaultStatus object.


    ![](img/d78298d3338ec680a024bbc83e78b297_104_0.png)


    Discover more about [onmouseover](https://www.w3schools.com/dom/dom_onmouseover.asp)
    and other examples in Chapter 12.


    To display a message when the user places the cursor over a hyperlink the HTML
    mouseover attribute should specify the message to display. It must also return
    true to prevent the link URL appearing in the status bar as it would do normally.


    This example, using JavaScript within HTML tags, specifies a default message and
    adds an onmouseover attribute to the link. This displays another message while
    the cursor rests over the link:


    ```

    <body onload="window.defaultStatus = ''Status Demo">

    <p><a href="nextpage.html" onmouseover="window.status=''Click Here'';return true">

    Hypertext Link</a></a></p>

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_104_1.png)


    | Status Messages | File Edit View Favorites Tools Help |

    | Hypertext Link | |

    | Status Demo | Local intranet |


    | Status Messages | File Edit View Favorites Tools Help |

    | Hypertext Link | |

    | Click Here | Local intranet |


