    \n## DOM 引用\n\n下表说明了文档对象模型 (DOM) 的重要部分，用以解释网页中对象之间的关系。带有 ** 标记标记的内容是 Microsoft\
    \ Internet Explorer 特有的，在其他浏览器中找不到。\n\n![](img/d78298d3338ec680a024bbc83e78b297_179_0.png)\n\
    \n## 电子商务中的 JavaScript\n\n最后一章展示了较早的一些示例如何应用于电子商务应用程序，并说明了框架（frames）如何存储数据以供以后在其他框架中使用。\n\
    \n## 目录内容\n\n- 产品页面 | 180\n- 一个隐藏表单 | 181\n- 获取客户详情 | 182\n- 生成订单号 | 183\n- 确认订单\
    \ | 184\n- 提交订单 | 185\n- 接下来做什么？ | 186\n\n## 产品页面\n\n本章中的示例遵循了在线订单的开发，从一个页面开始，用户可以在该页面选择要订购商品数量。\n\
    \n页面由两个框架组成：左侧是名为 menu 的侧边栏，右侧是名为 main 的较大框架。\n\n![](img/d78298d3338ec680a024bbc83e78b297_181_0.png)\n\
    \n通常，menu 框架将保持持续显示，而 main 框架会在用户在网站中导航时显示不同的页面。\n\n表单底部添加了一个按钮，将引导用户进入订单流程的下一个阶段。\n\
    \n在下所示的表单中，用户已为某些示例产品输入了数量需求：\n\n![](img/d78298d3338ec680a024bbc83e78b297_181_1.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_181_2.png)\n\n此示例的框架容器文档名为 e-commerce.html。如上所示，它在\
    \ menu 框架中显示 menu.html，在 main 框架中（初始）显示 products.html。\n\n## 一个隐藏表单\n\nmenu 框架页面包含一个名为\
    \ m（代表 memory）的隐藏表单，当 main 框架中的页面切换时，它将保留订单数据。\n\n![](img/d78298d3338ec680a024bbc83e78b297_182_0.png)\n\
    \n它由输入项组成，这些项与产品页面上名为 f 的表单镜像，并包含了客户姓名、账号和订单号的输入。\n\n![](img/d78298d3338ec680a024bbc83e78b297_182_1.png)\n\
    \n```html\n<-- 用于存储订单数据的表单 -->\n<form id=\"m\" action=\"\" method=\"post\">\n\
    <input type=\"hidden\" name=\"customer\" value=\"\"/>\n<input type=\"hidden\"\
    \ name=\"accountname\" value=\"\"/>\n<input type=\"hidden\" name=\"ordernum\"\
    \ value=\"\"/>\n<input type=\"hidden\" name=\"ball\" value=\"\"/>\n<input type=\"\
    hidden\" name=\"hoop\" value=\"\"/>\n<input type=\"hidden\" name=\"cone\" value=\"\
    \"/>\n</form>\n```\n\n产品页面上按钮的 onclick 属性调用一个 JavaScript 函数，将用户在产品页面 f 中输入的值填充到隐藏表单\
    \ m 中。然后它会在 main 框架中加载一个新页面。\n\n![](img/d78298d3338ec680a024bbc83e78b297_182_2.png)\n\
    \n```javascript\n// 在另一个框架的表单中存储值的函数\nfunction populate() {\n  // 表单的变量\n  var\
    \ m = parent.frames.menu.document.forms.m;\n  var f = document.forms.f;\n\n  //\
    \ 复制值\n  m.ball.value = f.ball.value;\n  m.hoop.value = f.hoop.value;\n  m.cone.value\
    \ = f.cone.value;\n\n  // 在此框架加载新页面\n  window.location = \"customer.html\";\n\
    }\n```\n\n## 获取客户详情\n\nmain 框架中的下一页 customer.html 请求姓名和账号。当用户点击页面上的按钮时，其 onclick\
    \ 调用 JavaScript 函数存储输入。它将表单的值复制到 memory 框架中同名的隐藏输入中。\n\n![](img/d78298d3338ec680a024bbc83e7b297_183_0.png)\n\
    \n```javascript\n// 在另一个框架的表单中存储值的函数\nfunction populate() {\n  // 表单的变量\n  var\
    \ m = parent.frames.menu.document.forms.m;\n  var f = document.forms.f;\n\n  //\
    \ 复制值\n  m.customer.value = f.customer.value;\n  m.accountnumber.value = f.accountnumber.value;\n\
    \n  // 在此框架加载另一个页面\n  window.location = \"confirm.html\";\n}\n```\n\n添加验证程序以检查用户是否已输入。\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_183_1.png)\n\n| 电子商务示例 |\n| :--- |\n\
    | 文件 编辑 查看 收藏 |\n| 菜单 请输入您的详情... |\n| 客户姓名: John Smith |\n| 产品 |\n| 账号: 12345\
    \ |\n| 确认此订单 |\n| 完成 |\n\n## 简单步骤中的 JavaScript\n\n## 生成订单号\n\n出现在订单流程中的最后一个页面包含客户订单的所有详情，供用户在提交订单前确认。\n\
    \n这些详情通过 JavaScript 从 menu 框架中的隐藏表单 m 获取数据并动态写入。这为客户订单分配唯一编号是有用的。确认页面上的 JavaScript\
    \ 生成此数字并将其存储在 menu 框架的隐藏表单 m 中。通常，Date 对象可以使用当前时间的组合作为单个数字来提供订单号。在本脚本中，订单号将由年份、月份、小时和秒组成：\n\
    \n```javascript\n// 表单变量\nvar m = parent.frames.menu.document.forms.m;\nvar f\
    \ = document.forms.f;\n\n// 生成基于时间的订单号\nvar d = new Date();\nvar yr = (d.getFullYear()).toString();\n\
    yr = yr.charAt(3);\nvar mo = (d.getMonth()).toString();\nvar hr = (d.getHours()).toString();\n\
