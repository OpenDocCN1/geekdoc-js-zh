  md: "# Conditional if\n\nif keyword is used to perform the basic conditional JavaScript\
    \ test to evaluate an expression for a boolean value. The statement following\
    \ the evaluation will only be executed when the expression returns true. The syntax\
    \ for the if statement looks like this:\n\n```\nif (test expression) statement-to-execute-when-true;\n\
    ```\n\nThe code to be executed may contain multiple statements if they are enclosed\
    \ within curly braces to form a statement block.\n\nIn the example below the expression\
    \ to be tested uses the modulus operator to determine if the value contained in\
    \ the variable called num is exactly divisible by 2. The statement has two statements\
    \ — one to assign a string value to a variable and another to call a JavaScript\
    \ function.\n\n```\n// create variables\nvar msg, num;\n = 7;\n// test if the\
    \ number is not exactly divisible by 2\nif ( num % 2 != 0 )\n{\n  msg = num +\
