  md: '# Prompt


    The window.prompt() method is used to get keyboard input from the user through
    a dialog box containing a textfield together with OK and Cancel buttons.


    Two string arguments are required by the window.prompt() method to specify a message
    to display and a default text value. The second argument should be an empty string
    if no default textfield value is needed by the script.


    The dialog box returns the value of the textfield when the user presses the OK
    button. This example takes the user input to personalize the page:


    ```

    // request the user to enter their name

    var user = prompt("Please enter your name...", "");


    // provide a default name if field is left blank

    if(user == null || user == "") user = "visitor";


    // display a message with the user name

    document.write("Hi "+user+",, welcome to this page");

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_100_0.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_100_1.png)'
  merge: -1
  pgno: 100
