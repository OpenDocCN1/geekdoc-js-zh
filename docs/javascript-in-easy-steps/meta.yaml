  md: '# Object constructor


    The JavaScript syntax to address object properties and methods uses the object
    name followed by a period then the property name.


    For instance, array.length addresses the length property of the array object.


    ![](img/d78298d3338ec680a024bbc83e78b297_89_0.png)


    Previous example code in this book used intrinsic JavaScript objects with pre-defined
    properties and methods.


    New custom objects can easily be created though using the JavaScript new keyword
    with the Object() constructor.


    Properties may then be allocated to the new custom object by declaring a property
    name and assigning a value to it.


    The example below creates a new object called car and then gives it three properties
    with assigned values:


    ![](img/d78298d3338ec680a024bbc83e78b297_89_1.png)


    ```

    ``` // create a new car object

    var car = new Object();


    // create and initialize a maker property

    car.maker = "Porsche";


    // create and initialize a model property

    car.model = "Boxster";


    // create and initialize a color property

    car.color = "Red";


    // display all the car property values

