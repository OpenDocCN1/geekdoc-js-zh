  md: '# Conditional operator


    The JavaScript coder''s favorite comparison operator is probably the conditional
    operator. This first evaluates an expression for a true or false value then executes
    one of two given statements, depending on the result of the evaluation.


    The conditional operator has this syntax:


    ```

    (test expression) ? if-true-do-this : if-false-do-this ;

    ```


    This operator can often be used to run script functions that are dedicated to
    a particular Web browser following a browser-identification routine. The example
    below is to display a welcome message determined by browser type:


    ```

    // Is the browser Internet Explorer \

    var is_ie = browser_id();`

    ```


    ```

    // Display appropriate greeting \

    ( is_ie ) ? greet_ie() : greet_other();

    ```


