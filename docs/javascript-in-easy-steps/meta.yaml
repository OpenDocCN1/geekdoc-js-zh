  md: '# Introduction


    JavaScript is an interpreted programming language whose interpreter is embedded
    inside Web browser software, such as Microsoft Internet Explorer and Netscape
    Navigator.


    This means that script contained in Web documents can be read by the browser''s
    JavaScript engine whenever the document is loaded into the browser window.


    ![](img/d78298d3338ec680a024bbc83e78b297_9_0.png)


    In this way, Web documents can be made to respond to the user''s actions and to
    perform dynamic visual effects.


    JavaScript should not be confused with the compiled programming language called
    Java from Sun Microsystems, although bearing some resemblance, is a completely
    different language.


    JavaScript appeared in December 1995 and was initially called LiveScript, although
    the name was soon changed for marketing reasons.


    The JavaScript language contains many impressive features but for security reasons
    it cannot read or write files, with the exception of cookie files that store a
    small amount of data.


    This book is concerned with the core and client-side features of JavaScript that
    are most useful in the creation of interactive Web pages.


    It is important to learn the basics – so the mechanics of the language are covered
    first in chapters that explain, by example, to write JavaScript programs.


    Then the browser Document Object Model (DOM) is introduced to illustrate how Web
    pages contain objects with properties that can be manipulated by JavaScript.


    JavaScript with knowledge of the DOM allows the creation of powerful Dynamic HTML
    (DHTML) effects.


    The final part of this book contains examples of JavaScript in to create popular
    DHTML effects, together with full source code that can be used on any Web page.'
  merge: -1
  pgno: 9
