    \ keyword can be used to declare multiple variables by separating the variable\
    \ names with a comma.\n\nThe caller passes three strings to the function although\
    \ the value of the second string is merely a space:\n\n```\n<body onload = \"\
    call_alert('Great', '', 'JavaScript')\">\n```\n\nThe function assigns the argument\
    \ values to three global variables and then calls alert() to display the global\
    \ values as a single concatenated string.\n\n![](img/d78298d3338ec680a024bbc83e78b297_21_2.png)\n\
