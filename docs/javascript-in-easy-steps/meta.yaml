- md: "\n# Conditional operator\n\nThe JavaScript coder's favorite comparison operator\
    \ is probably the conditional operator. This first evaluates an expression for\
    \ a true or false value then executes one of two given statements, depending on\
    \ the result of the evaluation.\n\nThe conditional operator has this syntax:\n\
    \n```\n(test expression) ? if-true-do-this : if-false-do-this ;\n```\n\nThis operator\
    \ can often be used to run script functions that are dedicated to a particular\
    \ Web browser following a browser-identification routine. The example below is\
