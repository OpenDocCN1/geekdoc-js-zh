  md: "# Layer attributes\n\nProbably the most important style attributes of a <div>\
    \ element to be used in DHTML are id, top, left, z-index, visibility, color and\
    \ background-color.\n\nThese style can be dynamically changed by assigning new\
    \ values to them with JavaScript.\n\nThis example demonstrates how to access each\
    \ of these attributes by listing the values of a <div> element called lyr.\n\n\
    ```\n// a function to display the style attributes of a <div>\nfunction get_styles()\
    \ {\n  var obj = document.getElementById(\"lyr\");\n  var str = \"ID: \" + obj.id;\n\
    \  str += \"\\nInTop: \" + obj.style.top;\nn  str += \"\\nInLeft: \" + obj.style.left;\n\
    n  str += \"\\nZ-Index: \" + obj.style.zIndex;\nn  str += \"\\nVisibility: \"\
    \ + obj.style.visibility;\nn  str += \"\\nBackground: \" + obj.style.backgroundColor;\n\
    n  str += \"\\nForeground: \" + obj.style.color;\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_162_0.png)\n\
    \nThe CSS z-index style is referenced in JavaScript by the term z-index. Also\
    \ the CSS background-color style is referenced in JavaScript by the term backgroundColor.\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_162_1.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_162_2.png)"
  merge: -1
  pgno: 162
- img_proc: true
  md: "# Toggle visibility\n\nHaving determined how to access layer styles with JavaScript\
    \ it's easy to have some fun with them by letting the JavaScript code dynamically\
    \ change their values.\n\nFor example, changing the visibility style value to\
    \ hidden will cause a layer to disappear from view.\n\nConversely a layer initially\
    \ created with a visibility style value of hidden can be revealed by changing\
    \ that value to visible.\n\nThe following script toggles the visibility of a single\
    \ layer with onmouseover and mouseout event-handlers, like this:\n\n```\n<a href=\"\
    javascript://\" onmouseover=\"show_apple\"\nonmouseout=\"hide_apple()\">Apple\
    \ Link</a>\n```\n\nThis script could easily toggle several layers for even greater\
    \ effect:\n\n![](img/d78298d3338ec680a024bbc83e78b297_163_0.png)\n\n```\n// a\
    \ function to reveal a layer\nfunction show_apple() {\n  // reference the layer\
    \ by id\n  var obj = getElementById(\"lyr\");\n  // show the layer\n  obj.style.visibility\
    \ = \"visible\";\n}\n\n// a function to hide a layer\nfunction hide_apple() {\n\
    \  // reference the layer by id\n  var obj = getElementById(\"lyr\");\n  // hide\
    \ the layer\n  obj.style.visibility = \"hidden\";\n}\n```\n\nThe illustrations\
    \ on the opposite page demonstrate the effect of this script when the user places\
    \ the cursor over, and off, the hyperlink."
