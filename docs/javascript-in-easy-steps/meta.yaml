  md: "# JavaScript: protocol\n\nThe javascript protocol may be assigned to the href\
    \ attribute in a HTML <a> anchor element to make a JavaScript function the target\
    \ of a hyperlink.\n\nThe name of the function should follow the protocol specify\
    \ to identify the script code to be executed, or short pieces of code can be included\
    \ in-line after the specifier, like this:\n\n```\n<a href=\"javascript:alert('In-line\
    \ code')\">Link #1</a>\n<a href=\"javascript:respond()\">Link #2</a>\n```\n\n\
    This example contains both in-line code and a function call. Each will execute\
    \ when the user clicks the relevant hyperlink:\n\n```\n// a function to display\
    \ a simple message\nfunction respond() {\n  alert(\"JavaScript code\");\n}\n```\n\
    \nTo make an anchor that has no target use javascript:// so that other attributes\
    \ like onmouseover can still be used.\n\n![](img/d78298d3338ec680a024bbc83e78b297_161_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_161_1.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_161_2.png)"
