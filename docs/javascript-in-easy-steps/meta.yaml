- md: "\n## Java detection\n\nA browser can be assessed to discover if Java is enabled\
    \ using the navigator.javaEnabled() method. This returns a boolean value of true\
    \ or false, depending on the result.\n\nThe navigator.javaEnabled() method can\
    \ be used to determine if a page containing a Java applet should be loaded, or\
    \ if an alternative non-Java page should be loaded instead – as seen in this example:\n\
    \n```javascript\n// test if Java is enabled in the browser\nif ( navigator.javaEnabled())\
    \ {\n    window.location = \"javapage.html\"; // if true go here\n} else {\n \
    \   window.location = \"nojavapage.html\"; // else go here\n}\n```\n\nwindow.location\
    \ stores the URL of the current page – assigning it a new URL will load that page\
    \ in the browser. See page 100 for more about this property.\n\n## Window properties\n\
    \nThis chapter demonstrates properties and methods of the window object. Creating\
    \ pop-up windows is illustrated and the use of framed pages is also discussed\
    \ with examples of how to address objects in other frames.\n\n## Covers\n\n- Confirm\
    \ | 98\n- Prompt | 99\n- Location | 100\n- History | 101\n- Onload | 102\n- Status\
    \ | 103\n- Pop-up window | 104\n- Pop-up features | 105\n- Close pop-up | 106\n\
    - Get size | 107\n- Frames array | 108\n- Frame objects | 109\n- Error handling\
    \ | 110\n\n## Chapter Nine\n\n## Confirm\n\nThe alert() function that is used\
    \ extensively in the code examples given throughout this book is actually a method\
    \ of the top-level window object, so may be correctly addressed as window.alert().\n\
    \nThe window.confirm() method is the first of two other window methods that produce\
    \ dialog boxes when called.\n\nIt is used to get user confirmation from a dialog\
    \ box containing an OK button that returns true to the script and a Cancel button\
    \ that returns false to the script.\n\nA single argument should be passed to the\
    \ method as a text string containing the question for the user to confirm.\n\n\
    This example demonstrates the window.confirm() method performing conditional branching\
    \ to determine which message string to write – depending upon which button the\
    \ user pushes in the dialog box:\n\n```javascript\n// create a variable to store\
    \ a dialog response\nvar ask = confirm(\"Do you wish to proceed ?\");\n```\n\n\
    ```javascript\n// create a variable to store a reply\nvar msg;\n```\n\n```javascript\n\
    // assign an appropriate reply message\nif(ask) msg = \"OK button was pushed\"\
    ;\nelse msg = \"Cancel button was pushed\";\n```\n\n```javascript\n// display\
    \ the reply message\ndocument.write(msg );\n```\n\n## Prompt\n\nThe window.prompt()\
    \ method is used to get keyboard input from the user through a dialog box containing\
    \ a textfield together with OK and Cancel buttons.\n\nTwo string arguments are\
    \ required by the window.prompt() method to specify a message to display and a\
    \ default text value. The second argument should be an empty string if no default\
    \ textfield value is needed by the script.\n\nThe dialog box returns the value\
    \ of the textfield when the user presses the OK button. This example takes the\
    \ user input to personalize the page:\n\n```javascript\n// request the user to\
    \ enter their name\nvar user = prompt(\"Please enter your name...\", \"\");\n\n\
    // provide a default name if field is left blank\nif(user == null || user == \"\
    \") user = \"visitor\";\n\n// display a message with the user name\ndocument.write(\"\
    Hi \"+user+\",, welcome to this page\");\n```\n\n## Location\n\nThe window.location\
    \ object contains the full URL address of the document that is currently loaded\
    \ in the browser.\n\nIt stores the actual full URL in the window.location.href\
    \ property and assigning a new value to this, or to the window.location object\
    \ itself, will load the specified URL into the browser.\n\nA typical URL address\
    \ may comprise these parts:\nprotocol: // host / pathname hash\n\nEach part of\
    \ the URL address stored in the window.location object may be addressed individually\
    \ using the appropriate location – as demonstrated in this example:\n\n```javascript\n\
    // assign each part of the current location\nvar locn = \"Href: \" + location.href;\n\
    var prot = \"Protocol: \" + location.protocol;\nvar host = \"Host: \" + location.host;\n\
    var path = \"Path: \" + location.pathname;\nvar hash = \"Hash: \" + location.hash;\n\
    \n// display the variable values\nalert(locn + \"\\n\" + prot + \"\\n\" + host\
    \ + \"\\n\" + path + \"\\n\" + hash);\n```\n\n> **TIP**: Assigning a new value\
    \ to location.hash can move the browser to the given location.\n\n| JavaScript\
    \ Application |\n| :--- |\n| Href: http://localhost/location.html#top |\n| Protocol:\
    \ http |\n| Host: localhost |\n| Path: /location.html |\n| Hash: #top |\n\n##\
    \ History\n\nThe window.history property contains an array of the URL addresses\
    \ visited during a session. For security reasons these are not directly readable\
    \ but they are used to navigate back to pages.\n\nThe back() and forward() methods\
    \ of the window.history object emulate the browser's Back and Forward buttons.\n\
    \nMore flexible navigation is provided by the window.history.go() method that\
    \ takes a single argument to specify the location by relative position. For instance,\
    \ an argument of -1 will revisit the previous page and a value of -2 opens the\
    \ page before it.\n\nIn a similar manner window.history.go(1) goes forward to\
    \ the next page in the history array of visited URLs. Calling window.history.go(0)\
    \ causes the browser to reload the current document. The function in the example\
    \ returns the user to the previous page. In this case the function is called from\
    \ the onclick attribute of a button input in the HTML document.\n\n```javascript\n\
    // a function to load the previous page\nfunction go_back() {\n  window.history.go(-1);\n\
    }\n```\n\n## Unload\n\nThe window.onload object may be used to specify the name\
    \ of a function to be called immediately after a document has completely loaded\
    \ in a browser. Typically this initializing function is named init() and is often\
    \ used to set number of values within the script.\n\nIt is especially useful when\
    \ the page contains a large number of graphics that may take a while to download.\
    \ If these images are used by the script it is essential that they finish downloading\
    \ before the script starts to run.\n\nThe HTML onload attribute, that may be included\
    \ in the HTML <body> tag, can also set the window.onload object - so care is needed\
    \ to avoid overwriting one with the other.\n\nThis is again the case with the\
    \ window.onunload object and the HTML <body> tag's attribute which can both specify\
    \ a function to call when the user navigates to a new location. Typically window.onunload\
    \ calls a function that creates a pop-up when the user leaves a website.\n\nThis\
    \ example displays a simple alert() dialog message when the user exits the page:\n\
    \n```javascript\n// a function to display an exit message\nfunction goodbye()\
    \ {\n  alert(\"Thanks - Come back soon\");\n}\n\n// specify the onunload event-handler\n\
    window.onunload = goodbye;\n```\n\n| JavaScript Application |\n| :--- |\n| Thanks\
    \ for calling - Come back soon |\n\n## Status\n\nThe window.status object can\
    \ be used to display a message in the status bar of the browser window until another\
    \ feature in the displayed document sets a new status bar message, or the status\
    \ bar is returned to its default state.\n\nA default message to display can be\
    \ specified with the window.defaultStatus object.\n\nDiscover more about [onmouseover](https://www.w3schools.com/dom/dom_onmouseover.asp)\
    \ and other examples in Chapter 12.\n\nTo display a message when the user places\
    \ the cursor over a hyperlink the HTML mouseover attribute should specify the\
    \ message to display. It must also return true to prevent the link URL appearing\
    \ in the status bar as it would do normally.\n\nThis example, using JavaScript\
    \ within HTML tags, specifies a default message and adds an onmouseover attribute\
    \ to the link. This displays another message while the cursor rests over the link:\n\
    \n```html\n<body onload=\"window.defaultStatus = 'Status Demo\">\n<p><a href=\"\
    nextpage.html\" onmouseover=\"window.status='Click Here';return true\">\nHypertext\
    \ Link</a></a></p>\n```\n"
  mdcn: "\n\n## Java 检测\n\n可以使用 `navigator.javaEnabled()` 方法对浏览器进行评估，以发现是否已启用 Java。该方法返回一个\
    \ true 或 false 的布尔值，取决于检测结果。\n\n`navigator.javaEnabled()` 方法用于用于是否应该加载包含 Java\
    \ applet 的页面，或者应该加载替代的非 Java 页面——例如所示：\n\n```javascript\n// 测试浏览器中是否启用了 Java\n\
    if ( navigator.javaEnabled()) {\n    window.location = \"javapage.html\"; // 如果为真跳转此处\n\
    } else {\n    window.location = \"nojavapage.html\"; // 否则跳转此处\n}\n```\n\n`window.location`\
    \ 存储当前页面的 URL —— 为其分配新 URL 将在浏览器中加载该页面。关于此属性的更多信息请参阅第 100 页。\n\n## Window 属性\n\
    \n本章演示了 window 对象的属性和方法。文中介绍了如何创建弹出窗口，并讨论了框架页的使用，同时给出了如何访问其他框架中对象的示例。\n\n## 目录\n\
    \n- Confirm（确认） | 98\n- Prompt（提示） | 99\n- Location（位置） | 100\n- History（历史） |\
    \ 101\n- Onload（加载完成） | 102\n- Status（状态） | 103\n- Pop-up window（弹出窗口） | 104\n\
    - Pop-up features（弹出功能） | 105\n- Close pop-up（关闭弹出） | 106\n- Get size（获取大小） |\
    \ 107\n- Frames array（框架数组） | 108\n- Frame objects（框架对象） | 109\n- Error handling（错误处理）\
    \ | 110\n\n## 第九章\n\n## Confirm\n\n在书中示例中广泛使用的 `alert()` 函数实际上是顶层 window 对象的一个方法，因此可以正确地调用为\
    \ `window.alert()`。\n\n`window.confirm()` 方法是另外两个窗口方法中的第一个，调用时会产生对话框。\n\n它用于从对话框中获取用户确认，对话框中包含一个\
    \ OK 按钮（向脚本返回 true）和一个 Cancel 按钮（向脚本返回 false）。\n\n应向该方法传递单个字符串参数作为参数，该字符串包含供用户确认的问题。\n\
    \n此示例演示了 `window.confirm()` 方法执行条件分支，以确定要写入哪个消息字符串——取决于用户在对话框中按了哪个按钮：\n\n```javascript\n\
    // 创建一个变量来存储对话响应\nvar ask = confirm(\"您确定要继续吗？\");\n```\n\n```javascript\n// 创建一个变量来存储回复\n\
    var msg;\n```\n\n```javascript\n// 分配相应的回复消息\nif(ask) msg = \"点击了 OK 按钮\";\nelse\
    \ msg = \"点击了取消 按钮\";\n```\n\n```javascript\n// 显示回复消息\ndocument.write(msg );\n\
    ```\n\n## Prompt\n\n`window.prompt()` 方法通过包含文本字段以及 OK 和取消按钮的对话框，从用户处获取键盘输入。\n\n\
    `window.prompt()` 方法需要两个字符串参数来指定要显示的消息和默认文本值。如果脚本不需要默认文本字段值，则第二个参数应为空字符串。\n\n\
    当用户按下 OK 按钮时，对话框会返回文本字段的值。此示例获取用户输入以个性化页面：\n\n```javascript\n// 请求用户输入其姓名\nvar\
    \ user = prompt(\"请输入您的姓名...\", \"\");\n\n// 如果字段留空，则提供默认名称\nif(user == null ||\
    \ user == \"\") user = \"visitor\";\n\n// 显示带有用户名的消息\ndocument.write(\"你好 \"+user+\"\
    ,,欢迎来到本页面\");\n```\n\n## Location\n\n`window.location` 对象包含当前在浏览器中加载的文档的完整 URL\
    \ 地址。\n\n它在 `window.location.href` 属性中存储实际的完整 URL，为其分配新值或为 `window.location` 对象本身赋值会将指定的\
    \ URL 加载到浏览器中。\n\n典型的 URL 地址可能包含这些部分：\nprotocol: // host / pathname hash\n\n存储在\
    \ `window.location` 对象中的 URL 地址的每个部分可以使用相应的 location 单独访问——如此示例所示：\n\n```javascript\n\
    // 分配当前位置的每个部分\nvar locn = \"Href: \" + location.href;\nvar prot = \"Protocol:\
    \ \" + location.protocol;\nvar host = \"Host: \" + location.host;\nvar path =\
    \ \"Path: \" + location.pathname;\nvar hash = \"Hash: \" + location.hash;\n\n\
    // 显示变量值\nalert(locn + \"\\n\" + prot + \"\\n\" + host + \"\\n\" + path + \"\\\
    n\" + hash);\n```\n\n> **提示**：为 `location.hash` 分配新值可以将浏览器移动到指定位置。\n\n| JavaScript\
    \ 应用 |\n| :--- |\n| Href: http://localhost/location.html#top |\n| Protocol: http\
    \ |\n| Host: localhost |\n| Path: /location.html |\n| Hash: #top |\n\n## History\n\
    \n`window.history` 属性包含一个会话期间访问过的 URL 地址数组。出于安全考虑，这些地址无法直接读取，但它们被用于导航回之前的页面。\n\
    \n`window.history` 对象的 `back()` 和 `forward()` 方法模拟了浏览器的后退和前进按钮。\n\n`window.history.go()`\
    \ 方法提供了更灵活的导航，它接受一个参数来通过相对位置指定位置。例如，参数为 -1 将重新访问上一个页面，值 -2 将打开它之前的页面。\n\n同样，`window.history.go(1)`\
    \ 会到访问 URL 历史数组中的下一页。调用 `window.history.go(0)` 会导致浏览器重新加载当前文档。示例中的函数将用户返回到之前的页面。\n\
    \n```javascript\n// 返回上一页的函数\nfunction go_back() {\n  window.history.go(-1);\n\
    }\n```\n\n## Unload\n\n`window.onload` 对象可能用于指定文档在浏览器中完全加载后调用的函数。通常此初始化函数命名为 `init()`，常用于设置脚本设置值。\n\
    \n当页面包含可能需要时间下载的图形时，它特别有用。如果脚本使用了这些图像，则必须确保在脚本运行之前完成下载。\n\n包含在 HTML `<body>` 标签中的\
    \ `onload` 属性也可以设置 `window.onload` 对象——因此需要避免相互覆盖。\n\n`window.onunload` 对象和 HTML\
    \ `<body>` 标签的属性情况也是如此，它们都可以指定当用户导航到新位置时调用的函数。通常 `window.onunload` 在用户离开网站时调用创建一个弹出窗口的函数。\n\
    \n此示例在用户退出时显示简单的 `alert()` 对话消息：\n\n```javascript\n// 显示退出消息的函数\nfunction goodbye()\
    \ {\n  alert(\"感谢-欢迎光临\");\n}\n\n// 指定 onunload 事件处理器\nwindow.onunload = goodbye;\n\
    ```\n\n| JavaScript 应用 |\n| :--- |\n| 感谢访问-欢迎光临 |\n\n## Status\n\n`window.status`\
    \ 对象可用于在浏览器窗口的状态栏显示消息，直到显示文档中的其他功能设置了新的状态栏消息，或者状态栏恢复默认状态。\n\n可以使用 `window.defaultStatus`\
    \ 对象指定要显示的默认消息。\n\n在第十二章中了解更多关于 [onmouseover](https://www.w3schools.com/dom/dom_onmouseover.asp)\
    \ 的其他示例。\n\n要在用户将鼠标悬停在超链接上时显示消息，HTML mouseover 属性应指定要显示的消息。它必须返回 true 以防止链接 URL\
    \ 像通常那样出现在状态栏中。\n\n此示例在 HTML 标签内使用 JavaScript 指定了默认消息，并为链接添加了 `onmouseover` 属性。当光标停留在链接上时显示另一个消息：\n\
    \n```html\n<body onload=\"window.defaultStatus = 'Status Demo\">\n<p><a href=\"\
    nextpage.html\" onmouseover=\"window.status='点击此处';return true\">\n超文本链接</a></a></p>\n\
    ```\n\n"
