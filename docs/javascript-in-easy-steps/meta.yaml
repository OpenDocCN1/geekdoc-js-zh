  md: "# Error handling\n\nA custom error-handling function may be assigned to the\
    \ window.onerror object to deal with runtime errors.\n\nWhen the browser meets\
    \ an error it looks for an error-handler in the script but, if none is found,\
    \ it will handle the error itself by opening the browser error dialog box.\n\n\
    Once the error has been noticed a true value is returned to the browser to indicate\
    \ that the error has been dealt with.\n\n![](img/d78298d3338ec680a024bbc83e78b297_111_0.png)\n\
    \nTo avoid error dialogs a custom error-handler function need only return true\
    \ when an error is encountered.\n\nIdeally the browser will pass three arguments\
    \ to the error-handler containing information on the nature of the error, the\
    \ URL of the file that contains the error, and the actual line number in file\
    \ where the error exists.\n\nIn the example below each piece of error information\
    \ passed to the error-handling function by the browser is displayed for the user:\n\
    \n```\n// declare an error-handling function\nwindow.onerror = errorhandler;\n\
    \n// define the error-handling function\nfunction errorhandler(msg, url, ln) {\n\
    \  alert(\"Error: \"+msg+\\nIn File: \"+url+\\nAt Line: \"+ln);\\n  return true;\
    \ // tell the browser it's been handled\n}\n\n// This is a deliberate mistake\n\
    document.form[theMistake].value = \"myButton\";\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_111_1.png)"
