  - "[PAGE 186]\n\n# Submit the order\n\n// a function to copy values from a hidden\
    \ form in\n// another frame into a local hidden form\n// then submit the local\
    \ form to the server\n\n```\nfunction send_order() {\n  // copy the values from\
    \ form m to form f\n  f.customer.value = m.customer.value;\n  f.accountnum.value\
    \ = m.accountnum.value;\n  f.ordernum.value = m.ordernum.value;\n  f.ball.value\
    \ = m.ball.value;\n  f.hop.value = m.hop.value;\n  f.cone.value = m.cone.value;\n\
    \n  // submit form f to the server\n  f.submit();\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_186_0.png)\n\
    \nIn this example the action attribute of the <form> element specifies that this\
    \ form data should be processed by a CGI script called parser.cgi. This server-side\
    \ script simply sends an HTML Web page back to the browser listing all the form\
    \ data keys that it has retrieved.\n\n![](img/d78298d3338ec680a024bbc83e78b297_186_1.png)\n\
    \n> This routine could simply have the hidden form m in the menu frame\n- the\
    \ response from the server would then appeared in that frame.\n\n14. JavaScript\
    \ in e-commerce | 185"
  - '[PAGE 187]


    # What next ?


    The future looks bright for JavaScript with the introduction of the SVG file format
    to display Scalable Vector Graphics.


    This file format stores vector graphic information in text format within an XML
    document.


    File sizes of SVG images are very small compared to GIF and JPG images and have
    the advantage that the image can be scaled-up without increasing file size.


    Also most importantly the elements of the image can be manipulated by JavaScript
    to create animation and interactive effects.


    ![](img/d78298d3338ec680a024bbc83e78b297_187_0.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_187_1.png)


    Jasc Software, creators of Paint Shop Pro, have a program called WebDraw that
    create vector graphics as SVG images available from their website at http://www.jasc.com.


    Modern versions of Adobe Illustrator support SVG and include an Interactivity
    Palette to create dynamic SVG with JavaScript.


    Adobe have also created the PC browser plug-in to support the SVG format which
    can be automatically installed on browsers without SVG capability and is freely
    available at http://www.adobe.com/svg/viewer/install/.


    The further extension of the browser DOM together with these exciting developments
    in SVG should ensure that JavaScript will continue adding magic to future websites.'
