    \  obj.style.top = (parseInt(obj.style.top)-1)+\"px\";\n\n  // set the interval\
    \ at which to call this function\n  timer = window.setTimeout(\"soar\", 50);\n\
    }\n\n// a function to move a <div> layer down the page\nfunction sink() {\n  //\
    \ get the div object\n  var obj = document.getElementById('chopper');\n\n  //\
    \ move down by 1 pixel\n  obj.style.top = (parseInt(obj.style.top)+1)+\"px\";\n\
    \n  // set the interval at which to call this function\n  timer = window.setTimeout(\"\
    sink\", 50);\n}\n\n// a function to cancel the timer\nfunction stop() {\n  clearTimeout(timer);\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_172_0.png)\n\n![](img/d78298d3338ec680a024bbc83e78b297_172_1.png)\n\
    \nThe parseInt() method is needed to extract the layer's top value.\n\n![](img/d78298d3338ec680a024bbc83e78b297_172_2.png)\n\
    \nThe timer delay from 50 to adjust the speed of scroll.\n\nAnd the HTML code\
    \ for the rollovers looks like this:\n\n```html\n<a href=\"javascript://\" onmouseover=\"\
    soar()\" onmouseout=\"stop()\">Soar</a>\n\n<a href=\"javascript://\" onmouseover=\"\
    sink()\" onmouseout=\"stop()\">Sink</a>\n```\n\n# Pop-up layers\n\nThis example\
    \ builds on the earlier visibility toggle by using multiple layers which have\
    \ their visibility toggled by an image map.\n\nWhen the cursor is placed over\
    \ an image map hyperlink, the JavaScript function will display the appropriate\
    \ layer but will hide that layer when the cursor moves off the link.\n\nBoth layers\
    \ are created in the HTML code with their visibility style property set to hidden\
    \ – so they are not initially visible. Placing the cursor over an active area\
    \ of the image causes the mouseover event to call the talk() function. The function\
    \ passes a string argument to identify which active area is the caller. This determines\
    \ which layer object is to be manipulated.\n\nThe talk() function sets the visibility\
    \ style of the appropriate layer object to visible – so it becomes visible. Moving\
    \ the cursor over active area causes the mouseout event to call the hush() function,\
    \ again passing a string argument identifier. This once sets the visibility style\
    \ of the appropriate layer object to hidden – so it becomes invisible again.\n\
    \nThis type of dynamic script can be used to create great effect with navigation\
    \ menu item rollovers.\n\n![](img/d78298d3338ec680a024bbc83e78b297_173_0.png)\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_173_1.png)\n\n# ...cont'd\n\n```javascript\n\
    // a function to toggle visibility on\nfunction talk(str)\n{\n  // a variable\
    \ to store the object\n  var obj;\n\n  // get the appropriate div layer\n  if(str\
    \ == \"sal\") obj = document.getElementById(\"sal\")\n  if(str == \"har\") obj\
    \ = document.getElementById(\"har\")\n\n  // show the layer\n  obj.style.visibility\
    \ = \"visible\";\n}\n\n// a function to toggle visibility off\nfunction hash(str)\n\
    {\n  // a variable to store the object\n  var obj;\n\n  // get the appropriate\
    \ div layer\n  if(str == \"sal\") obj = document.getElementById(\"sal\")\n  if(str\
    \ == \"har\") obj = document.getElementById(\"har\")\n\n  // hide the layer\n\
    \  obj.style.visibility = \"hidden\"\n}\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_174_0.png)\n\
    \nMake the layers' z-index values different if the layers overlap.\n\n![](img/d78298d3338ec680a024bbc83e78b297_174_1.png)\n\
    \nAvoid creating adjacent areas - always leave a small gap to allow time for mouseout\
    \ events to fire before starting another mouseover. The events in this example\
