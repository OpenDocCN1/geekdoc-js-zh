  md: "# Text areas\n\nA HTML <textarea> element is rather like a large scrolling\
    \ text box whose value can be read and written by JavaScript.\n\nThe example below\
    \ writes content to a text area by assigning a string to its value property the\
    \ document is loaded.\n\nThe function to assign the string is designated as the\
    \ document’s onload event handler by the script.\n\nCare is needed when using\
    \ this approach – if the script is included in the <head> section of the HTML\
    \ document an onload attribute in the <body> tag may overwrite it.\n\n```\n//\
    \ a function to write text content in a text area\nfunction write_text() {\n \
    \   // assign a string to the textarea field\n    document.forms.f.textarea.value\
    \ = \"Computers in the\nfuture may perhaps only weigh 1.5 tons. (Popular\nMechanics\
    \ forecasting the development of computer\ntechnology, 1949)\";\n}\n\n// define\
    \ the onload function\nwindow.onload = write_text;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_137_0.png)\n\
    \nIt is often best to call onload functions using the onload attribute of the\
    \ <body> element.\n\n![](img/d78298d3338ec680a024bbc83e78b297_137_1.png)\n\n|\
    \ File Edit View Tools Help |\n|---|---|---|---|--|\n| Computers in the future\
    \ may perhaps only weigh 1.5 tons. (Popular Mechanics forecasting the development\
    \ of computer technology, 1949) |\n\n136 | JavaScript in easy steps"
