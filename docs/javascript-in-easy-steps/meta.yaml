  md: "# Function arguments\n\nThe plain brackets that follow the name of all functions\
    \ may be used to contain data for use in the code to be executed. Just as the\
    \ brackets of the JavaScript alert() function contain the string to be displayed\
    \ in the alert() dialog box it creates.\n\nThe data contained within the brackets\
    \ is known as the function “argument”.\n\nIn the example below the function call\
    \ passes a string text to the argument named str in the call_alert() function\
    \ for use in the code that is to be executed:\n\n```\n// a function to display\
    \ the value of a passed argument\nfunction call_alert( str )\n{\n    alert( str);\n\
    }\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_18_0.png)\n\nIt is important\
    \ to note that string contained inside the call to this double quotes used to\
    \ contain the entire call:\n\n```\n<body onload = \"call_alert(' 'Passed Value')\"\
    >\n```\n\nUsing double quotes for both would mean that the onload attribute value\
    \ would be \"call_alert(\" because the string is terminated by the double quote.\
    \ This would create a browser error and the function would not be executed.\n\n\
    The use of single and double quotes in this manner appears throughout JavaScript\
    \ programming in several ways.\n\n![](img/d78298d3338ec680a024bbc83e78b297_18_1.png)\n\
