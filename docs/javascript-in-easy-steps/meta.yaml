  md: "# Toggle value\n\nIt is useful to change the label that is displayed on a button\
    \ by its value attribute if that button performs dual actions.\n\nIn the following\
    \ example a button calls a stopgo() function to start or stop a counter. The counter\
    \ increments an integer variable at I-second intervals and displays the count\
    \ in the window's status bar.\n\nThe button label normally reads Start but changes\
    \ to Stop if the timer count() function is running.\n\n![](img/d78298d3338ec680a024bbc83e78b297_128_0.png)\n\
    \n```\nvar running = false, num = -1, tim; // create globals\nfunction count()\
    \ { // counter function\n\tif(running) {\n\tnum++;\n\twindow.status = \"Seconds\
    \ elapsed: \" + num;\n\ttim = setTimeout(\"count()\", 1000);\n} else {\n\tnum\
    \ = -1;clearTimeout(tim);\\ } // or halt\n}\nfunction stopgo() { // control function\n\
    \trunning = !running; // toggle counter\n\tcount();\n\tdocument.forms.btn1.value\
    \ = (running)? \"Stop\" : \"Start\"; // change the label\n}\n```\n\ntoggle.js\n\
    \n![](img/d78298d3338ec680a024bbc83e78b297_128_1.png)\n\nThe num variable is initialized\
    \ at -1 so that when first incremented the counter will start zero.\n\n![](img/d78298d3338ec680a024bbc83e78b297_128_2.png)\n\
    \nThe I operator is used here to change the boolean variable to the opposite of\
    \ its current value.\n\n![](img/d78298d3338ec680a024bbc83e78b297_128_3.png)"
  merge: -1
  pgno: 128
