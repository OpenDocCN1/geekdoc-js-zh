    # Property inheritance


    Further flexibility can be added to the example on the facing page by assigning
    the newly created custom object to a property of another custom object.


    In this case the properties and values of the assigned object are inherited by
    the property of the second custom object.


    The inherited properties are addressed by adding a period and the inherited property
    name after the property address to which they have been assigned.


    It is helpful to understand this relationship when dealing with objects and properties
    in Web pages.


    The following example demonstrates how a new object is assigned to a property
    of a custom object and how the inherited properties may be addressed:


    ```

    // create a new object with assigned property values

    var suv = new Object();

    suv.badge = "Explorer"

    suv.type = "4X4"

    suv.doors = 4

    suv.color = "Red"

    suv.engine = "4.0 liters",

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_90_0.png)


    An object must have first been created in the script before it can be assigned
    to another object''s property.


    ![](img/d78298d3338ec680a024bbc83e78b297_90_1.png)


    ```

    // create another object that inherits from the first

    var car = new Object();

    car.marker = "Ford"

    car.model = suv;

    ```


    ```

    // display unique value and inherited property values

    alert(car.marker + " " + car.model.badge + " " + car.model.type);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_90_2.png)


