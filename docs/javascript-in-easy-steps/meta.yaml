    # Numbers from strings


    A number can be extracted from the beginning of a string with the parseInt() and
    parseFloat() methods.


    The parseInt() method parses the string and returns the integer value that is
    located. The parseFloat() method works in the same way but returns a floating
    number.


    If the parser finds any non-numeric character before returning a number then it
    will return the special NaN value that is used to denote "Not-a-Number".


    This example demonstrates both parseFloat() and parseInt() methods and illustrates
    the JavaScript isNaN() function testing for a NaN value:


    ```

    // create a string beginning with a number

    var str = "66.6% PASS RATE";


    // extract the initial integer value

    var res = "Integer: " + parseInt(str);


    // extract the initial float value

    res += "\nFloat: " + parseFloat(str);


    // create a string beginning with a letter

    var badstr = "PASS RATE 66.6%";


    // attempt to extract an initial integer value

    res += "\nNon-numeric : " + parseInt(badstr);

    res += "\nFound : ";

    res += isNaN(badstr) ? "Character": "Number"

    alert(res);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_85_0.png)


    The NaN value cannot be tested with the == operator.


    ![](img/d78298d3338ec680a024bbc83e78b297_85_1.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_85_2.png)'
  - '[PAGE 86]


    # Variables in strings


    The JavaScript eval() function accepts an argument string containing JavaScript
    code which it evaluates, then returns the resulting value.


    If the code string contains statements they will be executed by the eval() function,
    then the final value will be returned.


    While this function is a powerful feature of the JavaScript language it is often
    used to introduce variable values into a string.


    In the example below the script assigns a string value to be displayed in a text
    input within a form that has the id of f. The HTML <input> element has been named
    textField.


    <script> element to include this JavaScript must appear in the HTML document after
    the form elements - so that the text field is created before the script assign
    a value to it.


    The text box and the display string are stored in variables that are evaluated
    by the eval() function.


    ![](img/d78298d3338ec680a024bbc83e78b297_86_0.png)


    ```

    // store the text input name

    var inputname = "textField"

    // store the string to assign

    var inputtext = "JavaScript Text"


    // evaluate the asignation expression

    eval("document.forms.f."+inputname+".value=\+inputtext);

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_86_1.png)


    Remember to escape the quotes inside a string to avoid error messages.


    ![](img/d78298d3338ec680a024bbc83e78b297_86_2.png)


    Now the string is displayed in the text field because the expression evaluates
    to:


    ```

    document.forms.f.textField.value = "JavaScript Text";

    ```


    ![](img/d78298d3338ec680a024bbc83e78b297_86_3.png)'
