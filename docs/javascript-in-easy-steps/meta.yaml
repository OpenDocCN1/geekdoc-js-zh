  md: "# Radio buttons\n\nA group of radio buttons that will only allow one of the\
    \ group to be checked at any time should all have the same name assigned to their\
    \ name attribute in the HTML <input> tag.\n\nIn the browser DOM the radio button\
    \ group creates a document.form object with that given name.\n\nThis object contains\
    \ an array of all the radio buttons in the group, indexed in the order in which\
    \ they appear in the HTML code.\n\nJavaScript can address each radio button using\
    \ the array name and index number. In the example below JavaScript checks the\
    \ second radio button displays both radio values in a text box:\n\n![](img/d78298d3338ec680a024bbc83e78b297_131_0.png)\n\
    \n```\n// a function to get radio group information\nfunction radio_info() {\n\
    \  // select the second radio button\n  document.forms.f.radl[1].checked = true;\n\
    \n  // get both radio values\n  var msg = \"1st Radio Value: \"\n  + document.forms.f.radl[0].value;\n\
    \  msg += \" 2nd Radio Value: \"\n  + document.forms.f.radl[1].value = msg;\n\
    }\n```\n\nOnly checked radio buttons have their name=value pair sent when the\
    \ form is submitted.\n\n![](img/d78298d3338ec680a024bbc83e78b297_131_1.png)\n\n\
    | Radio Buttons |\n| File Edit View Favorites Tools Help |\n| 1st Radio Value:\
    \ Coffee 2nd Radio Value, Tea |\n| [ Get Radio Info ] |\n| Done Local intranet\
    \ |"
  merge: -1
  pgno: 131
