  md: "# Option lists\n\nThe <option> items in a HTML <select> list have a text property\
    \ for each displayed string label and an associated value property. These are\
    \ equivalent to the HTML name and value attributes of each <option> element in\
    \ the <select> list.\n\nThis name=value pair is sent to the server when the form\
    \ is submitted.\n\nAll menu items are stored in the <select> object's options[]\
    \ array and both the text name label and its associated value may be dynamically\
    \ written by JavaScript.\n\nThis example dynamically sets the label name and the\
    \ associated value of three option items in a drop-down list. The form has the\
    \ simple id of f and the <select> element has the id of menu.\n\n![](img/d78298d3338ec680a024bbc83e78b297_135_0.png)\n\
    \n```\n// a function to set the name and values of list options\nfunction set_options()\
    \ {\n  with(document.forms.f.menu) {\n    options[0].text = \"One\"; options[0].value\
    \ = \"1\";\n    options[1].text = \"Two\"; options[1].value = \"2\";\n    options[2].text\
    \ = \"Three\"; options[2].value = \"3\";\n  }\n}\n```\n\nThe [options] elements\
    \ must be initially created by the HTML code.\n\n![](img/d78298d3338ec680a024bbc83e78b297_135_1.png)\n\
    \n| Options |\n| --- |\n| One |\n| Two |\n| Three |\n\n134 | JavaScript in easy\
    \ steps"
