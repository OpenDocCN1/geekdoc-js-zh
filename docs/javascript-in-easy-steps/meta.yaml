  md: '# Characters in strings


    Strings are just arrays where each element is a character and can be referenced
    in the same way as regular array elements.


    So just like arrays the first character is element 0 (zero).


    The characters can be found using the string.charAt() method which takes the element
    index number as its所在.


    The example below reads the characters in a string and makes changes according
    to the character found:


    ```

    // create and initialize two string variables

    var str = "linger in", newstr = ""


    // get the first and last letters of the string variable

    var a = "First letter : " + str.charAt(0);

    var z = "Final letter : " + str.charAt(str.length - 1 );

