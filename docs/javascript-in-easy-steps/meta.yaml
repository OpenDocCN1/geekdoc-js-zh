    \ onmouseout=\"talk('har')\" onmouseover=\"hash('har')\">\n```\n\n# 动态菜单\n\n此示例使用鼠标坐标来切换菜单图层的可见性，并使用样式表来指定主图层和菜单图层的特征：\n\
    \n```javascript\n// Netscape/Mozilla 捕获事件指令\nif (navigator.appName == \"Netscape\"\
    ) window.captureEvents(Event.MOUSEMOVE);\n\n// 指定 onmousemove 事件处理器...\ndocument.onmousemove\
    \ = track;\n\n// 获取菜单图层对象\nvar m1 = document.getElementById(\"menu_1\");\nvar\
    \ m2 = document.getElementById(\"menu_2\");\nvar m3 = document.getElementById(\"\
    menu_3\");\n\n// 响应 MOUSEMOVE 事件的函数\n// 并动态隐藏菜单图层\nfunction track(e) {\n  // 获取菜单图层对象\n\
    \  var x = e.pageX;\n  var y = e.pageY;\n\n  // 隐藏图层 1\n  if (x < 60 || y < 53)\
    \ m1.style.visibility = \"hidden\";\n  // 隐藏图层 2\n  if (x < 70 || x < 130 || y\
    \ < 53) m2.style.visibility = \"hidden\";\n  // 隐藏图层 3\n  if (x < 140 || x < 200\
    \ || y < 53) m3.style.visibility = \"hidden\";\n}\n\n// 显示菜单图层的函数\nfunction reveal(menu)\
    \ {\n  if (menu == 1) m1.style.visibility = \"visible\";\n  if (menu == 2) m2.style.visibility\
    \ = \"visible\";\n  if (menu == 3) m3.style.visibility = \"visible\";\n}\n```\n"
