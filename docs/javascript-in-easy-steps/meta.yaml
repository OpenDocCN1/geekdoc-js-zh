  - '[PAGE 169]


    # Tacking layer


    The left coordinate of a layer object''s style can be modified by JavaScript to
    reposition the layer along the X axis.


    The following example moves a <div> layer that has an id of boat. This contains
    a sailboat image just outside the left edge of the window. A timer function sails
    the boat across the window.


    When the boat disappears off the right edge of the window JavaScript swaps the
    image for a pre-loaded version of the sailboat image facing in the opposite direction.
    The script then sails it back across the screen from right to left.


    When the boat disappears off the left edge of the window image reverts to the
    original version that proceeds to sail left to right and the boat continues to
    tack back and forth.


    The go_right variable determines the direction of travel. It''s initially set
    to true but it is reversed at each extreme point.


    The ext variable stores the width of the window according to the type of browser
    running the script.


    The set_sail() function is initially called from the script to start the routine
    then is called recursively from inside the function.


    Use an animated GIF image with this script to create even exciting results.


    ![](img/d78298d3338ec680a024bbc83e78b297_169_0.png)


    ![](img/d78298d3338ec680a024bbc83e78b297_169_1.png)'
  - "[PAGE 170]\n\n# cont'd\n\n```\n// preload the swap image\nvar preload = new Image();\
    \ preload.src = \"sail_1.gif\";\n// set the initial direction to right\nvar go_right\
    \ = true;\n```\n\n![](img/d78298d3338ec680a024bbc83e78b297_170_0.png)\n\nThis\
    \ script must be included in the <body> section of the HTML document - after the\
    \ <div> element is created.\n\ntackjs\n\n```\n// a function to move a <div> across\
    \ the page\nfunction set_sail() {\n    // get the div object\n    var obj = document.getElementById(\"\
    boat\");\n    \n    // get the window width\n    var ext;\n    if(document.body.clientWidth)\
    \ ext = \n        document.body.clientWidth;\n    if(window.innerWidth) ext =\
    \ window.innerWidth;\n\n    // move by 1 pixel in set direction\n    if(go_right\
    \ ) {\n        obj.style.left = (parseInt(obj.style.left)+1)+\"px\";\n    } else\
    \ {\n        obj.style.left = (parseInt(obj.style.left)-1)+\"px\";\n    }\n\n\
    \    // change direction at the right extreme\n    if(parseInt(obj.style.left\
    \ ) >= ( ext + 5 )) {\n        go_right=false;\n        document.images.boat_image.src\
    \ = \"sail_1.gif\";\n    }\n\n    // change direction at the left extreme\n  \
    \  if(parseInt(obj.style.left) <= -75) {\n        go_right = true;\n        document.boat_image.src\
    \ = \"sail_1.gif\";\n    }\n\n    // set the interval to call this function\n\
    \    window.setTimeout(\"set_sail()\", 50);\n}\n\n// start the routine\nset_sail();\n\
    ```\n\n![](img/d78298d3338ec680a024bbc83e78b297_170_1.png)\n\nThe positional pixel\
    \ values have \"px\" tacked on the end (e.g. left=\"70px\") so the parseInt()\
    \ method is needed to extract the integer part for manipulation.\n\n13. JavaScript\
    \ in DHTML | 169"
