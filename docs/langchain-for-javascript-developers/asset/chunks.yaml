  trans: "\n\n请注意，`LangChain` 目前正处于快速发展阶段，随着版本的迭代，某些代码可能会过时。我正努力保持书籍的更新，但如果由于某种原因导致代码报错，退回到这些版本号可能是明智之举。\n\
    \n一旦设置好依赖项，我们将使用 `React` 创建应用程序的前端。\n\n将以下代码插入 `src/App.js`：\n\n```javascript\n\
    // code/story-generator/src/app/page.js\n\nexport default function Home() {\n\
    \  const onSubmitHandler = async (event)=> {\n    event.preventDefault()\n   \
    \ const subject = event.target.subject.value\n    console.log(subject)\n  }\n\n\
    \  return (\n    <>\n      <h1>The Story Maker</h1>\n      <em>此应用使用 GPT 模型来为儿童生成故事。</em>\n\
    \      <form onSubmit={onSubmitHandler}>\n        <label htmlFor=\"subject\">故事的主题:</label>\n\
    \        <input name='subject' placeholder='subject...' />\n        <button>Ask\
    \ AI Model</button>\n      </form>\n    </>\n  )\n}\n```\n\n在此阶段并没有特别显著的特点。它只是一个\
    \ React UI，从文本输入框获取故事主题并将其打印到控制台。\n\n我们将通过在终端中执行以下命令来启动应用：`npm run dev`\n\n这将生成以下输出：\n\
    \n目前，如果用户输入主题，将不会生成故事，因为我们还没有将应用与 `OpenAI` 集成。我们将在下一章解决这个问题。\n\n### 2.3 OpenAI\
    \ ChatGPT 模型的 API key\n\n要使用 OpenAI 的 `ChatGPT` 模型，你需要一个 API key。该 API 是基于订阅制的，可以通过以下\
    \ URL 生成密钥：`https://platform.openai.com/api-keys`\n\n你可以为账户充值最小金额。例如，编写本书中的所有用例花费了我少于\
    \ 2 美元。\n\n一旦生成了 API key，返回 `Next.js` 项目并将其粘贴到 `.env` 文件中：\n\n```env\n// code/story-generator/.env\n\
    OPENAI_API_KEY='sk-1234567890B2tT4HT3BlbkFJXkATN1arB9DXABkRQ1uj'\n```\n\n此密钥将仅用于我们应用程序的后端部分。要在\
    \ `code/story-generator/src/app/api/route.js` 文件中访问 API key，我们可以写如下代码：\n\n```javascript\n\
    // code/story-generator/src/app/api/route.js\nconsole.log( process.env.OPENAI_API_KEY\
    \ )\n```\n\n密钥稍会被传递给 `LangChain` 模型对象的构造函数。这一步骤将是本书后续章节中每个代码示例的默认流程。\n\n[如果你不想使用\
    \ API key，可以查看此列表](https://js.langchain.com/docs/modules/model_io/models/)，了解\
    \ `LangChain` 支持的 LLM 并选择一个免费模型。你甚至可以使用免费的 `HuggingFace` token 来避开 `OpenAI` API。\n\
    \n### 2.4. 使用 ChatOpenAI LangChain 模型\n\n让我们通过建立与 `OpenAI` LLM 的连接来继续。在应用后端的 `src/app/api/route.js`\
    \ 文件添加以下代码：\n\n```javascript\n// code/story-generator/src/app/api/route.js\nimport\
    \ { ChatOpenAI } from \"@langchain/openai\"\n\nconst model = new ChatOpenAI({\n\
    \  openAIApiKey: process.env.OPENAI_API_KEY,\n  temperature: 0.9\n})\n\nexport\
    \ async function POST(req) {\n  const { subject } = await req.json()\n  const\
    \ gptResponse = await model.invoke(subject)\n  return Response.json({data: gptResponse})\n\
    }\n```\n\n要与 `OpenAI` 建立连接，创建一个 `ChatOpenAI` 对象的实例实例。在其构造函数中，我们定义了以下内容：设置为 `0.9`\
    \ 的 `temperature` 参数；以及上一节获取的 API key。\n\n你可能对这个 `temperature` 参数好奇，对吧？`temperature`\
    \ 参数影响模型的想象力。增加它会产生更具创造性的输出，而降低它则会让响应更贴实、更事实。坚持事实可以减少模型潜在的不准确性或幻觉。\n\n选择合适的 `temperature`\
    \ 取决于任务。对于脑风暴吸引人的故事标题，较高的温度更为理想。对于准确性至关重要的任务（如总结法律文件），较低的温度更好。\n\n设置好 `temperature`\
    \ 后，现在让我们更新应用的前端：\n\n```javascript\n// code/story-generator/src/app/page.js\n\
    export default function Home() {\n  const onSubmitHandler = async (event) => {\n\
    \    event.preventDefault()\n    const subject = event.target.subject.value\n\
    \    // 使用 subject 调用 LLM\n  }\n  // ...\n}\n```\n\n设置好温度后……“艾莎是《冰雪奇缘》的主角角。她是阿伦德尔的女王，拥有创造冰雪的魔法能力。”\n\
    \n请注意，你的答案可能会有些不同。与经典方式相反，LLM 可以对相同的输入给出不同的输出。例如，请求如：“给我讲一个关于猫的故事标题。”\n\n### 2.5.\
    \ 提示词模板 (Prompt templates)\n\n你很快会发现提示词需要重复输入，例如“给我讲一个关于”后面跟着主题。这种冗余可以通过模板解决，我们稍后探讨。\n\
    \n在进入下一章之前，让我们对应用进行一个小调整。使用状态变量在 UI 中显示 LLM 给出的故事标题。\n\n```javascript\n// code/story-generator/src/app/page.js\n\
    'use client'\nimport { useState } from \"react\"\n\nexport default function Home()\
    \ {\n  const [storyTitle, setStoryTitle] = useState()\n  const onSubmitHandler\
    \ = async (e) => {\n    e.preventDefault()\n    const subject = e.target.subject.value\n\
    \    const response = await fetch('api', {\n      method: \"POST\",\n      body:\
    \ JSON.stringify({ subject })\n    })\n    const { data } = await response.json()\n\
    \    setStoryTitle(data)\n  }\n\n  return (\n    <>\n      <h1>The Story Maker</h1>\n\
    \      <em>此应用使用 GPT 模型来为儿童生成故事。</em>\n      <form onSubmit={onSubmitHandler}>\n\
    \        <label htmlFor=\"subject\">故事的主题:</label>\n        <input name='subject'\
    \ placeholder='subject...' />\n        <button>Ask AI Model</button>\n      </form>\n\
    \      {/* 在 UI 中显示故事标题 */}\n      <p>{ storyTitle }</p>\n    </>\n  )\n}\n```\n\
    \n这就是更改后 UI 将呈现的样子：\n\n现在让我们回到本章的核心内容：提示词模板。语言模型使用文本作为输入。这些文本被称为提示词（prompt）。不过，它不仅仅是一个固定的字符串。通常情况下，它是模板、示例和用户添加内容的混合。\n\
    \n通过模板，我们可以简化提示词流程，确保用户不需要每次请求都重复输入相同的前缀。\n\n对于我们特定的用例，提示词模板看起来如下：\n\n`Tell me\
    \ a story title about {subject}` 我们是我们需要做的机会都在后端：\n\n```javascript\n// code/story-generator/src/app/api/route.js\n\
    import { ChatOpenAI } from \"@langchain/openai\"\n// 我们将使用 PromptTemplate 来避免重复\n\
    ```\n\n"
- fmt: "\n```javascript\nimport { PromptTemplate } from \"@langchain/core/prompts\"\
    \n\nconst model = new ChatOpenAI({\n  openAIApiKey: process.env.OPENAI_API_KEY,\n\
    \  temperature: 0.9\n})\n\n// establishing the general format of the template\n\
    const prompt = new PromptTemplate({\n  inputVariables: [\"subject\"],\n  template:\
    \ \"Tell me a story title about {subject}\"\n})\n\nexport async function POST(req)\
    \ {\n  const { subject } = await req.json()\n  // passing down the { subject }\
    \ parameter\n  const formattedPrompt = await prompt.format({\n    subject\n  })\n\
    \n  const gptResponse = await model.invoke(formattedPrompt)\n  return Response.json({data:\
    \ gptResponse.content})\n}\n```\n\nNo. 26 / 120\n\n![](index-27_1.png)\n\nThe\
    \ default format of writing prompt templates is the F-String format, popular in\
    \ Python. If you want to use the more familiar double curly braces JavaScript\
    \ Mustache format you can have:\n\n```javascript\nconst prompt = PromptTemplate.fromTemplate(\n\
    \  inputVariables: [\"subject\"],\n  template: \"Tell me a story title about {{subject}}\"\
    ,\n  {\n    templateFormat: \"mustache\"\n  }\n)\n```\n\nIf you want to read more\
    \ you can take a look at the [quick start guide](https://js.langchain.com/docs/modules/model_io/prompts/quick_start/)\
    \ from the documentation.\n\nNo. 27 / 120\n\n![](index-28_1.png)\n\n## 2.6. Chains\n\
    \nChains refer to sequences of calls - whether to an LLM, a tool, or a data preprocessing\
    \ step.\n\nThey are a vital core concept of LangChain and can be seen as short\
    \ programs written around LLMs to execute complex tasks.\n\nSpeaking of chains,\
    \ here's a fun fact about LangChain's logo: The parrot and a chain link were inspired\
    \ by people calling LLMs \"stochastic parrots\". These models can mimic human\
    \ writing but don't truly understand what they're saying. This library aims to\
    \ \"chain\" these \"parrots\" together to produce more meaningful and useful outputs.\n\
    \nThe output of one link from the chain becomes the input for the next link.\n\
    \nLet's say we need to create an article for a magazine. We wil follow these steps:\n\
    \n1. Use ChatGPT to generate the article title.\n2. Pass this title to a local\
    \ LLM to compose the actual article, utilizing internal documents.\n3. Pass the\
    \ article to Midjourney, another LLM, to generate images for the article.\n\n\
    No. 28 / 120\n\n![](index-29_1.png)\n![](index-29_2.png)\n![](index-29_3.png)\n\
    ![](index-29_4.png)\n\nLet's see how to add a chain to our backend code:\n\n```javascript\n\
    import { ChatOpenAI } from \"@langchain/openai\"\nimport { PromptTemplate } from\
    \ \"@langchain/core/prompts\"\n\n// using the LLMChain; maybe the most straightforward\
    \ chain\nimport { LLMChain } from \"langchain/chains\"\n\nconst model = new ChatOpenAI({\n\
    \  openAIApiKey: process.env.OPENAI_API_KEY,\n  temperature: 0.9\n})\n\nconst\
    \ prompt = new PromptTemplate({\n  inputVariables: [\"subject\"],\n  template:\
    \ \"Tell me a story title about {subject}\"\n})\n\n// a chain that links the model,\
    \ the prompt and the verbose option\nconst chain = new LLMChain({\n  llm: model,\n\
    \  prompt,\n  // use verbose to debug the chain\n  verbose: true\n})\n\nexport\
    \ async function POST(req) {\n  const { subject } = await req.json()\n  // invoking\
    \ the chain\n  const gptResponse = await chain.invoke({subject})\n  return Response.json({data:\
    \ gptResponse.text})\n}\n```\n\nNo. 29 / 120\n\n![](index-30_1.png)\n\nYou may\
    \ encounter some examples online that utilize the `chain.call()` method instead\
    \ of `chain.invoke()`. Please note that `.call()` is deprecated and wil be removed.\n\
    \nThe `verbose: true` option is optional. If enabled, it wil provide additional\
    \ details about the chain in the backend console. This information includes:\n\
    \n- the input and output for each step of the chain\n- how long each step took\n\
    - the `tokenUsage` variable\n\nThis last point is important because we pay to\
    \ use the LLM's API with tokens. On average, 100 words are roughly 130 tokens.\
    \ A helpful tool for managing tokens is the [OpenAI Tokenizer](https://platform.openai.com/tokenizer).\
    \ The `tokenUsage` is divided into how much the input prompt used and how much\
    \ the actual response used:\n\n```json\n\"llmOutput\": {\n  \"tokenUsage\": {\n\
    \    \"completionTokens\": 14,\n    \"promptTokens\": 14,\n    \"totalTokens\"\
    : 28\n  }\n}\n```\n\nIn the frontend code, we wil simply replace the text input\
    \ with a select box to facilitate data entry:\n\n```javascript\nexport default\
    \ function Home() {\n// the rest remains the same\n// ...\nreturn (\n  <>\n  \
    \  <h1>The Story Maker</h1>\n    <em>This app uses a GPT Model to generate a story\
    \ for```\n    // ... (UI code)\n![](index-31_1.png)\n![](index-31_2.png)\n![](index-31_3.png)\n\
    ![](index-31_4.png)\n![](index-31_5.png)\n![](index-31_6.png)\n    <select name=\"\
    subject\">\n      <option value=\"cats\">Cats</option>\n      <option value=\"\
    unicorns\">Unicorns</option>\n      <option value=\"elfs\">Elfs</option>\n   \
    \ </select>\n    <button>Ask AI</button>\n  </>\n)\n}\n```\n\nNo. 30 / 120\n\n\
    ## 2.7. LCEL - LangChain Expression Language\n\nLangChain Expression Language,\
    \ or LCEL, provides a simpler way to chain multiple nodes. In short, using LCEL,\
    \ we can replace other classes, such as `LLMChain`, with the `.pipe()` method.\
    \ Let's take another look at:\n\n```javascript\nconst model = new ChatOpenAI({\n\
    \  openAIApiKey: process.env.OPENAI_API_KEY,\n  temperature: 0.9\n})\n\nconst\
    \ prompt = new PromptTemplate({\n  inputVariables: [\"subject\"],\n  template:\
    \ \"Tell me a story title about {subject}\"\n})\n\n// BEFORE\nconst chain = new\
    \ LLMChain({\n  llm: model,\n  prompt,\n})\nawait chain.invoke({subject})\n\n\
    // AFTER\nconst chain = prompt.pipe(model)\nawait chain.invoke({subject})\n```\n\
    \nThe key element of LCEL is `RunnableInterface`. It ensures that the nodes in\
    \ a chain have a common pattern. LCEL standardizes communication and enables easy\
    \ swapping of components within the LangChain framework. Al the components are\
    \ modular. If something needs to be changed, only that part has to be replaced\
    \ rather than the entire pipeline. Many of the examples in this book wil be made\
    \ using LCEL.\n\nNo. 31 / 120This concludes our first smal app with JavaScript,\
    \ LangChain, and ChatGPT.\n\nWe have learned how to:\n\n- bootstrap and connect\
    \ a web app app to an LLM.\n- utilize LangChain's prompt templates to prevent\
    \ repetition and create our first chain.\n"
