    # 1. 引言


    ## 1.1. 获取书籍更新和代码示例


    要获取书籍的最新版本，请通过邮件 `daniel@js-craft.io` 订阅我们的列表。我努力保持书籍的更新。为了获取最新内容，请确保订阅 `daniel@js-craft.io`。


    ## 1.2. 关于作者


    你好，我是 Daniel，一名软件开发者和教育者。我一直喜欢教学。我相信教育是改进软件的关键。


    你可以在这里找到我：


    - GitHub: `github.com/daniel-nastase`

    - Twitter: `twitter.com/danielnastase`

    - Mastodon: `mastodon.social/@danielnastase`

    - YouTube: `youtube.com/danielnastase`


    ## 1.3. 本书是如何产生的


    我第一次写计算机程序是 26 年前，当时朋友向我展示了 ChatGPT。它感觉就像魔法一样。但这一次我知道它是如何工作的。


    于是，我进入了“学习 AI 如何工作”的兔子洞。天哪，这是一个非常深的洞。我正尝试从零开始构建和训练。一段时间后，我唯一的项目是一个[纯神经网络](https://github.com/daniel-nastase/Pure-neural-network)。该模型用于识别手绘形状是否为数字。


    一段时间后我放弃了。面对所有不同的架构、神经元、训练数据集、反向传播或梯度下降，这对我那平庸的大脑来说太复杂了。


    因此，我回到了我作为 Web 开发者的日常工作中。但在脑海深处，我仍然觉得应该关注 AI。因此决定再次尝试 AI。但这次是从更实用的角度出发。


    ## 1.4. 什么是 LangChain


    LangChain 是一个旨在简化集成大语言模型（LLM）应用程序创建的框架。


    LangChain 在一个框架中提供了所有的 AI 集成构建块。它提供了一个模块化、灵活且可扩展的架构。


    你可以将 LangChain 看作 AI 生态系统中几乎所有内容的胶水层。


    '
- fmt: "\nBy learning `LangChain`, you wil gain a deep understanding of the structure,\
    \ workflows, and practices of AI Engineering.\n\nSome use cases for `LangChain`\
    \ include:\n\n- LLMs are trained on human-written unstructured text. While this\
    \ works well for human interactions, it may not work well for sending unformatted\
    \ text to an API. APIs instead of structured data like `JSON`.\n- `LangChain`\
    \ can format the input and output in LLM interactions.\n- LLMs are stateless.\
    \ They don't remember who you are or what you said a few seconds ago. `LangChain`\
    \ provides support for both long-term and short-term memory.\n- LLMs can be slow.\
    \ `LangChain` can stream responses as they are generated, providing fast feedback\
    \ to the user.\n- LLMs have cutoff dates. For example, GPT-3.5 does not have training\
    \ data after 2021. GPT-4 does not know anything after 2023. With LangChain, we\
    \ can create and manage AI Agents that go online, search for information, and\
    \ use tools to parse that information.\n- We can chain multiple LLMs together.\
    \ For example, we can generate an article with Google's Gemini and then pass the\
    \ text to Midjourney to generate images for that article.\n- LLMs lack access\
    \ to internal documents. We can use Retrieval-Augmented Generation (`RAG`) to\
    \ provide extra context to a model, allowing it to interact with users based on\
    \ an organization's rules and knowledge. `LangChain` has a great toolset for RAG\
    \ operations.\n- `LangChain` abstracts operations like the ones above, making\
    \ it easy to swap components as needed. Want to use a different LLM because it's\
    \ better or cheaper? Want to change the vector database to store embeddings? `LangChain`\
    \ has you covered.\n- `LangChain` standardizes common patterns when working with\
    \ LLMs. While it is possible to create any app without `LangChain`, it simplifies\
    \ the process and is much better than manual prompting.\n- If you want to delve\
    \ deeper into the subject, I recommend listening to the episode with Harrison\
    \ Chase, the founder of `LangChain`, from the excellent Latent Space podcast.\n\
    \n## 1.5 Overview of this book\n\nIn this book, we go on a fun, hands-on, and\
    \ pragmatic journey to learning `LangChain`. Every main chapter has an associated\
    \ example application that gradually evolves during that chapter. Each step introduces\
    \ a few new `LangChain` concepts in a manageable way without overwhelming you.\
    \ The book is purposefully broken down into short chapters, each focusing on different\
    \ topics.\n\n- **Chapter 1**: We wil use a `Story Generator` app to introduce\
    \ the basics of `LangChain`. We wil connect to the first LLM, and use prompt templates\
    \ and chains. We wil delve deeper into templates, template composition, and more.\n\
    - **Chapter 2**: After the basic setup in `Chapter 1`, this chapter wil introduce\
    \ the concept of streaming. Using the same `Story Generator` app, we wil stream\
    \ responses from the LLMs to improve the user experience.\n- **Chapter 3**: One\
    \ challenge with LLMs is that they give responses in an unstructured format, as\
    \ they were trained on human-intelligible text. In this chapter, we wil study\
    \ output parsers by making a `Trivia Game` from scratch using `ChatGPT`.\n- **Chapter\
    \ 4**: The memory module enables LLM memory for `LangChain` apps. We can remember\
    \ past conversations and responses in the current session similar to how `ChatGPT`\
    \ does it. In this chapter, we wil build a `Fact Wiki` application.\n- **Chapter\
    \ 5**: One of the key features of `LangChain` is its support for `RAG` - Retrieval\
    \ Augmented Generation. In this chapter, we wil build a `Chat Bot` app that answers\
    \ questions based on external context. We wil see how to provide data from sources\
    \ like PDFs or online documents, what embeddings are, and how vector data stores\
    \ work.\n- **Chapter 6**: More flexible and versatile compared to chains, AI agents\
    \ help you build complex solutions and enable access to third-party tools such\
    \ as Google search and math calculators. They can make decisions on the appropriate\
    \ tool to use in a given situation.\n\nFrom building a `Story Generator` to creating\
    \ a `Trivia Game` and a real `Chat Bot application`, each chapter gradually expands\
    \ your understanding. By the end, we wil have explored streaming, output parsing,\
    \ memory modules, AI agents, and RAG capabilities, empowering you to develop complex\
    \ solutions.\n\n## 1.6 Requirements and how to use this book\n\n`LangChain` offers\
    \ implementations in both `JavaScript` and `Python`. Throughout this book, our\
    \ focus wil be on `JavaScript`.\n\nYou'll find that you learn best by coding along\
    \ with the examples provided in the book. My suggestion is to initially go through\
    \ each chapter, absorbing the content to grasp the concepts. Then, during a second\
    \ pass, code along as you progress.\n\nWe'll utilize a combination of `LangChain`,\
    \ `React`, and `Next.js`. While a basic understanding of `React` is expected,\
    \ you need not be an expert. For setting up `Next.js`, the simplest approach is\
    \ to utilize the `create-next-app` utility.\n\nIn most instances, our work wil\
    \ be confined to just 2 files:\n- `src/app/page.js` - handling the frontend; its\
    \ primary function is to display information and data.\n- `src/app/api/route.js`\
    \ - managing the backend; this file wil handle the API interactions with the LLM.\n\
    \nThe examples wil progress in a step-by-step iterative manner. Each modification\
    \ wil be denoted by the `+` sign, with the path of the modified file provided\
    \ for reference. For instance:\n\n```javascript\n// src/app/page.js - path of\
    \ the updated file\n\n// add the PromptTemplate to avoid repetition - file change\n\
    import { PromptTemplate } from \"@langchain/core/prompts\"\n\n// make a new ChatGPT\
    \ model - file change\nconst model = new ChatGPT({\n  openApiKey: process.env.OPENAI_API_KEY,\n\
    \  temperature: 0.9\n})\n```\n\nPlease note that `LangChain` is currently undergoing\
