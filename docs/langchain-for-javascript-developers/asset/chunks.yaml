  trans: "\n\n在下一章节中，我们将扩展此应用程序以生成实际的故事正文并集成数据流。\n\n# 3. LangChain 中的流\n\n## 3.1 简介与项目设置\n\
    \n大语言模型（LLM）生成某些答案可能需要很长时间。例如，当你要求模型编写像诗或总结文档之类的复杂回复时。\n\n考虑到 LLM 的工作方式，我们不需要等待整个回答完成。你是否注意到当你向\
    \ ChatGPT 提问时，你会看到那种“打字机效果”，即每个单词逐渐出现在屏幕上？\n\n大语言模型的推理方式并不像人类。它不是先构建一个完整的回答，然后进行解释。它也不会将答案映射到知识图谱或类似的结构。它只是一次向答案添加一个\
    \ token（标记）。\n\n这非常棒，因为我们可以利用这种流式行为，在有新信息要展示给用户时立即更新 UI。\n\n回到故事生成器示例，假设我们想创建一个名为《银色精灵的秘密》的故事。与其等待整个故事生成，我们可以在故事编写的同时对其进行流式传输：\n\
    \n从前以前\n\n...\n\n...\n\n从前，在一个神秘的森林里\n\n...\n\n...\n\n从前，在一个深藏于山中的神秘森林里\n\n...\n\
    \n...\n\n从前，在一个深藏于山中的神秘森林里，住着一个银色精灵族。\n\n在本章中，我们将实现流式功能。这是应用程序 UI 最终的样式：\n\n##\
    \ 3.2 项目重构\n\n在继续之前，我们首先需要对项目进行重构。\n\n在前端，我们将执行以下操作：\n\n1. 一旦我们有了故事标题，我们将将其作为按钮显示，文本为`告诉我关于\
    \ <<这里是故事名称>>的故事`\n2. 当按下此按钮时，我们将调用后端，传递故事名称并打印响应\n\n代码代码将如下所示：\n\n```javascript\n\
    // code/streaming/src/app/page.js\n\n'use client'\n\nimport { useState } from\
    \ \"react\"\n\nexport default function Home() {\n\n  const [storyTitle, setStoryTitle]\
    \ = useState()\n\n  //! 为 storyBody 准备的新状态变量\n\n  const [storyBody, setStoryBody]\
    \ = useState()\n\n  const onSubmitHandler = async (e)=> {\n    e.preventDefault()\n\
    \    const subject = e.target.subject.value\n    const response = await fetch('api',\
    \ {\n      method: \"POST\",\n      body: JSON.stringify({ subject })\n    })\n\
    \n    const { data } = await response.json()\n    setStoryTitle(data)\n  }\n\n\
    \  //! 点击开始故事按钮时调用此方法 const startStoryStream = async ()=> {\n    //! 重置故事正文，调用后端\n\
    \    // 并在故事正文中显示响应\n    setStoryBody('')\n    const response = await fetch('api',\
    \ {\n      method: \"POST\",\n      body: JSON.stringify({ storyTitle })\n   \
    \ })\n\n    const { data } = await response.json()\n    setStoryBody(data)\n \
    \ }\n\n  return (\n    <>\n      <h1>\" 故事制造者</h1>\n      <em>此应用使用 GPT 模型为孩子们生成故事。</em>\n\
    \      <form onSubmit={onSubmitHandler}>\n        故事的主题：\n        <select name=\"\
    subject\">\n          <option value=\"cats\">$ 猫</option>\n          <option value=\"\
    unicorns\">\" 独角兽</option>\n          <option value=\"elfs\">% •♀ 精灵</option>\n\
    \        </select>\n        <button># 询问 AI 模型</button>\n      </form>\n     \
    \ {/* ! 如果有故事标题，则显示\n      开始故事按钮和故事正文 */}\n      {storyTitle && <div>\n     \
    \   <button onClick={startStoryStream}>\n          告诉我关于 {storyTitle}的故事\n   \
    \     </button>\n        <p>{storyBody}</p>\n      </>}\n    </>\n  )\n}\n```\n\
    \n在后端，我们将添加这些更改：\n\n添加一个 `makeStoryTitle()` 方法，它包含之前所有的逻辑；添加一个 `streamStory()`\
    \ 方法。我们稍后将使用此方法来实现流机制。目前，它将返回一些静态文本。\n\n检查来自前端的请求是请求故事标题还是故事正文。调用上述两个方法之一。\n\n\
    后端代码将如下：\n\n```javascript\nimport { ChatOpenAI } from \"@langchain/openai\"\n\
    import { PromptTemplate } from \"@langchain/core/prompts\"\n//! 我们将使用 NextResponse\
    \ 来发送故事正文 import { NextResponse } from \"next/server\"\n//! 所有的之前的逻辑都在这里\n\nconst\
    \ makeStoryTitle = async (subject)=> {\n  const model = new ChatOpenAI({\n   \
    \ openAIApiKey: process.env.OPENAI_API_KEY,\n    temperature: 0.9\n  })\n  const\
    \ prompt = new PromptTemplate({\n    inputVariables: [ \"subject\"],\n    template:\
    \ \"告诉我一个关于 {subject}的故事标题\",\n  })\n  const chain = prompt.pipe(model)\n  return\
    \ await chain.invoke({subject})\n}\n\n//! 我们稍后会更新这里以添加流式传输 const streamStory =\
    \ async (storyTitle)=> {\n  return new NextResponse(\n    JSON.stringify( { data:\
    \ \"故事从这里开始...\"}\n  ),\n  { headers: { 'content-type': 'application/json' },\n\
    \  )\n}\n\nexport async function POST(req) {\n  const { subject, storyTitle }\
    \ = await req.json()\n  //! 如果请求有 storyTitle 则返回 streamStory()\n  if (storyTitle)\
    \ {\n    return streamStory(storyTitle)\n  }\n  //! 如果没有 storyTitle 则返回\n  const\
    \ gptResponse = await makeStoryTitle(subject)\n  return Response.json({data:gptResponse})\n\
    }\n```\n\n## 3.3 流式响应\n\n在某些情况下，AI 模型可能需要几秒钟来生成完整的提示响应。这比应用程序感觉流畅的 200-300 毫秒阈值慢。\n\
    \n为了让应用程序感觉流畅，我们需要显示中间进度并分块流式输出，一旦块可用立即产生。并不是所有模型都支持流式传输，因此请确保你使用的模型支持此功能。\n\n\
    是时候为我们的故事生成器应用添加流式功能了。注意，这不是单一的请求-响应交互。它更像是一个持续对话。前端将不断请求新的 LLM 响应块并更新结果，而后端将返回响应块并指示流何时结束。\n\
    \n我们将从后端开始。更改将在上一步中定义的 `streamStory()` 方法中完成：\n\n```javascript\n// code/streaming/src/app/route.js\n\
    // 其他部分保持不变\n\n// ...\n\nconst streamStory = async (storyTitle)=> {\n  const encoder\
    \ = new TextEncoder()\n  const stream = new TransformStream()\n  const writer\
    \ = stream.writable.getWriter()\n  const model = new ChatOpenAI({\n    openAIApiKey:\
    \ process.env.OPENAI_API_KEY,\n    temperature: 0.9,\n    streaming: true,\n \
    \   callbacks: [{\n      handleLLMNewToken: async (token) => {\n        await\
    \ writer.ready\n        await writer.write(encoder.encode(`${token}`))\n     \
    \ },\n      handleLLMEnd: async () => {\n        await writer.ready\n        await\
    \ writer.close()\n      }\n    }]\n  })\n  const prompt = new PromptTemplate({\n\
    \    inputVariables: [ \"storyTitle\" ],\n    template: \"告诉我一个标题为 {storyTitle}的故事\"\
    \n  })\n  const chain = prompt.pipe(model)\n  chain.invoke({storyTitle})\n  return\
    \ new NextResponse(stream.readable, {\n    headers: { \"Content-Type\": \"text/event-stream\"\
    \ }\n  })\n}\n```\n\n"
