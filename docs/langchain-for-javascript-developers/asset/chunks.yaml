    \nWith these final UI changes, we can watch the story unfold as it's generated\
    \ by the LLM: If you want to take a more in-depth look at this topic the LangChain\
    \ [documentation has a nice](https://js.langchain.com/docs/modules/chains/foundational/llm_chain#cancelling-a-running-llmchain)\
    \ [guide about streaming,](https://js.langchain.com/docs/expression_language/streaming)\
    \ [including this part on how](https://js.langchain.com/docs/modules/chains/foundational/llm_chain#cancelling-a-running-llmchain)\
    \ [to stop the streaming process if the response is not as you intended.](https://js.langchain.com/docs/modules/chains/foundational/llm_chain#cancelling-a-running-llmchain)\n\
    \nNo. 45 / 120\n\n# 4. Output\n## `parsers`\n\nNo. 46 / 120\n\n## 4.1. Introduction\n\
    \nAlright, let's dive into the nitty-gritty of output parsers in LangChain.\n\n\
    Why do we need them? Well, when working with LLMs, you wil realize the response\
    \ may not be the same if you ask the same question twice. Also, the format of\
    \ the output can vary as well.\n\nFor example, if we ask for the recipe for a\
    \ dish, sometimes the LLM wil return `Ingredients` as the first step, sometimes\
    \ `Preparations`. This is normal as LLMs are generative, not deterministic. This\
    \ variability may be fine for a human reader, but it becomes problematic if we\
    \ want an API endpoint to process those responses.\n\nAnd when you change the\
    \ type of underlying LLM model it wil only get worse.\n\nThink of output parsers\
    \ as your formatting sidekicks. They can:\n1. tweak your prompt by adding things\
    \ such as prefixes or suffixes to steer the output in a certain direction. Want\
    \ a JavaScript array? Want a simple string or JSON nested structure? LangChain's\
    \ output parsers got you covered;\n2. after the output is ready, a JavaScript\
    \ function may step in to tidy things up. This function might even use other LLMs\
    \ to polish the output into the perfect format.\n\nNo. 47 / 120\n\n![](index-48_1.png)\n\
    \n## 4.2. Example setup\n\nLangChain has several pre-defined output parsers that\
    \ can be used directly. We wil use some of them in the following example.\n\n\
    You were tasked with making a trivia game using ChatGPT. The user wil ask for\
    \ a trivia question with four possible answers. Only one of these answers is correct.\
    \ Once a possible answer is clicked, a popup indicating whether the answer is\
    \ correct or incorrect wil be displayed. At any time, the user wil be able to\
    \ ask for a new question.\n\nThis is how the final version of the app wil look:\
    \ We wil start from a very simple state.\n\nOn the backend, we wil make an OpenAI\
    \ model and ask it for a trivia question:\n\n```javascript\n// code/trivia-game/src/app/api/route.js\n\
    \nimport { ChatOpenAI } from \"@langchain/openai\"\nimport { PromptTemplate }\
    \ from \"@langchain/core/prompts\"\n\nconst model = new ChatOpenAI({\n  openAIApiKey:\
    \ process.env.OPENAI_API_KEY,\n})\n```\n\nNo. 48 / 120\n\n```javascript\nconst\
    \ prompt = PromptTemplate.fromTemplate(\n  `Ask me a trivia question about geography.`\n\
    )\n\nconst chain = prompt.pipe(model)\n\nexport async function GET() {\n  const\
    \ gptResponse = await chain.invoke()\n  return Response.json({question: gptResponse.text})\n\
    }\n```\n\nNotice that this time we are using a `GET` request since we don't need\
    \ to send any request body. We just need to get a question back.\n\nOn the frontend,\
    \ we have a simple button that makes the cal to the backend. Using a React state\
    \ variable, the question is displayed once we get the response:\n\n```javascript\n\
    // code/trivia-game/src/app/page.js\n\nimport { ChatOpenAI } from \"@langchain/openai\"\
    \nimport { PromptTemplate } from \"@langchain/core/prompts\"\n\nconst model =\
    \ new ChatOpenAI({\n  openAIApiKey: process.env.OPENAI_API_KEY\n})\n\nconst prompt\
    \ = PromptTemplate.fromTemplate(\n  `Ask me a trivia question about geography.`\n\
    )\n\nconst chain = new prompt.pipe(model)\n\nexport async function GET() {\n \
    \ const gptResponse = await chain.invoke()\n  return Response.json({question:\
    \ gptResponse.text})\n}\n```\n\nNo. 49 / 120\n\n```javascript\nconst chain = new\
    \ prompt.pipe(model)\n\nexport async function GET() {\n  const gptResponse = await\
    \ chain.invoke()\n  return Response.json({question: gptResponse.text})\n}\n```\n\
    \nNo. 50 / 120\n\n![](index-50_1.png)\n\n## 4.3. StringOutputParser\n\nThe [`StringOutputParser`](https://js.langchain.com/docs/modules/output_parsers/string)\
    \ takes the model output and converts it into a simple string. This is maybe the\
    \ easiest-to-use parser. Let's take a look at what actual looks like:\n\n```javascript\n\
    const prompt = PromptTemplate.fromTemplate(\n  `Ask me a trivia question about\
    \ geography.`\n)\n\nconst chain = prompt.pipe(model)\n\nconst gptResponse = await\
    \ chain.invoke()\n\nconsole.log(gptResponse)\n```\n\nIf we print `gptResponse`,\
    \ it wil look like this:\n```json\n{text: \"What is the capital of France?\"}\n\
    ```\n\nHowever, if we use another type of model, such as `Llama` (made by Meta)\
    \ or `Claude` (made by Anthropic), the structure can be different. This means\
    \ the line that extracts the `.text` property may fail:\n\n```javascript\nreturn\
    \ Response.json({question: gptResponse.text})\n```\n\nNotice that after we add\
    \ an output parser to the chain, we don't need to manual y parse the `.text` property:\n\
    \n```javascript\n// before using the parser\nreturn Response.json({question: gptResponse.text})\n\
    \n// after adding the output parser to the chain\nreturn Response.json({question})\n\
    ```\n\nThis is how the project looks in the code:\n\n```javascript\n// code/trivia-game/src/app/api/route.js\n\
    \nimport { ChatOpenAI } from \"@langchain/openai\"\nimport { PromptTemplate }\
    \ from \"@langchain/core/prompts\"\n//! importing the parser\nimport { StringOutputParser}\
    \ from \"@langchain/core/output_parsers\"\n\nconst model = new ChatOpenAI({\n\
    \  openAIApiKey: process.env.OPENAI_API_KEY\n})\n\n//! making the prompt and invoking\
    \ the chain\nconst makeQuestion = async ()=> {\n  const prompt = PromptTemplate.fromTemplate(\n\
    \    `Ask me a trivia question about geography.`\n  )\n  //! adding the parser\
    \ to the LCEL chain so that we get\n//! just a simple string output instead of\
    \ an object\n  const chain = prompt\n    .pipe(model)\n    .pipe(new StringOutputParser())\n\
    \n  return await chain.invoke()\n}\n\nexport async function GET() {\n  //! extracted\
    \ the make question part into its method\n  const question = await makeQuestion()\n\
    \  return Response.json({question})\n}\n```\n\nNo. 51 / 120\n\n![](index-52_1.png)\n\
    ![](index-52_2.png)\n![](index-52_3.png)\n![](index-52_4.png)\n\n![](index-52_5.png)\n\
