    ^0.1.19\"\n```\n"
  raw: 'By learning LangChain, you wil gain a deep understanding of the structure,
    workflows, and practices of AI Engineering.


    Some use cases for LangChain include:


    LLMs are trained on human-written unstructured text. While this works well for
    human interactions, it may not work well for sending unformatted text to an API.
    APIs instead of structured data like JSON.


    LangChain can format the input and output in LLM interactions.


    LLMs are stateless. They don''t remember who you are or what you said a few seconds
    ago. LangChain provides support for both long-term and short-term memory.


    LLMs can be slow. LangChain can stream responses as they are generated, providing
    fast feedback to the user.


    LLMs have knowledge cutoff dates. For example, GPT 3.5 does not have training
    data after 2021\. And GPT-4o does not know anything after Oct 2023\. With LangChain,
    we can create and manage AI Agents that go online, search for information, and
    use tools to parse that information.


    We can chain multiple LLMs together. For example, we can generate an article with
    Google''s Gemini model and then pass the text to Midjourney to generate images
    for that article.


    No. 9 / 120


    LLMs lack access to internal organization documents. We can use Retrieval-Augmented
    Generation (RAG) to provide extra context to a model, al owing it to interact
    with users based on an organization''s rules and knowledge. LangChain has a great
    toolset for RAG operations.


    LangChain standardizes operations like the ones above, making it easy to swap
    components as needed. Want to use a different LLM because it''s better or cheaper?
    Want to change the vector database to store the RAG


    embeddings? No problem, LangChain has you covered.


    LangChain abstracts and standardizes common patterns when working with LLMs. Remember
    the old days with browser incompatibilities? Then jQuery appeared. This is what
    LangChain aims to do for LLM integration.


    While it is possible to create any app without LangChain, it simplifies the process
    to a great extent and is much better than manual prompting.


    If you want to delve deeper into the subject, I recommend listening to the


    [episode with Harrison Chase, the founder of LangChain](https://www.latent.space/p/langchain)
    from the excellent Latent Space podcast.


    No. 10 / 120


    **1.5\. Overview of this book**


    In this book, we email on a fun, hands-on, and pragmatic journey to learning LangChain.
    Every main chapter has an associated example application that gradual y evolves
    during that chapter. Each step introduces a few new LangChain core concepts in
    a manageable way without overwhelming you.


    The book is purposeful y broken down into short chapters, each focusing on different
    topics.


    Here is how the main chapters and example applications are structured: **Chapter
    1**: We wil use a Story Generator for Kids app to introduce the basics of LangChain.
    We wil connect to the first LLM, and use prompt templates and chains. We wil delve
    deeper into partial templates, template composition, and more.


    **Chapter 2**: After the basic setup in Chapter 1, this chapter wil introduce
    the concept of streaming. Using the same app, Story Generator for Kids, we wil
    stream long responses from the LLMs to improve the user experience.


    **Chapter 3**: One chal enge with LLMs is that they give responses in an unstructured
    format, as they were trained on human-intelligible text. In this chapter, we wil
    study output parsers by making a ful Trivia Game from scratch using ChatGPT.


    **Chapter 4**: The memory module enables LLM memory for LangChain apps. We can
    remember past conversations and responses in the current session similar to how
    ChatGPT does it. In this chapter, we wil build a Tea Facts Wiki application.


    **Chapter 5**: One of the key features of LangChain is its support for RAG -


    Retrieval Augmented Generation. In this chapter, we wil build a Chat Bot app that
    answers questions based on external context. We wil see how to provide data from
    sources like PDFs or online documents, what embeddings are, and how vector data
    stores work.


    No. 11 / 120


    **Chapter 6**: More flexible and versatile compared to chains, AI agents help
    you build complex solutions and enable access to third-party tools such as Google
    search and math calculators. They can make decisions on the appropriate tool to
    use in a given situation.


    From building a Story Generator to creating a Trivia Game and a real Chat Bot
    application, each chapter gradual y expands your understanding. By the end, we
    wil have explored streaming, output parsing, memory modules, AI agents, and RAG
    capabilities, empowering you to develop complex solutions.


    Get ready to embark on an enriching journey into the world of LangChain development.


