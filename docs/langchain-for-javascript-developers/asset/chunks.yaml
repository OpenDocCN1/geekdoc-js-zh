    The default format of writing prompt templates is the F-String format, popular
    in Python. If you want to use the more familiar double curly braces JavaScript
    Mustache format you can have:


    const prompt = PromptTemplate.fromTemplate(


    inputVariables: [ "subject"],


    template: "Tell me a story title about {{subject}}",


    {


    templateFormat: "mustache"


    }


    )


    If you want to read more you can take a look at th[e quick start guide](https://js.langchain.com/docs/modules/model_io/prompts/quick_start/)
    from the documentation.


    No. 27 / 120


    ![](index-28_1.png)


    **2.6\. Chains**


    Chains refer to sequences of cal s - whether to an LLM, a tool, or a data preprocessing
    step.


    They are a vital core concept of LangChain and can be seen as short programs written
    around LLMs to execute complex tasks.


    Speaking of chains, here''s a fun fact about LangChain''s logo: The parrot and
    a chain link were inspired by people cal ing LLMs "stochastic parrots". These
    models can mimic human writing but don''t truly understand what they''re saying.
    This library aims to "chain" these "parrots" together to produce more meaningful
    and useful outputs.


    The output of one link from the chain becomes the input for the next link.


    Let''s say we need to create an article for a magazine. We wil follow these steps:


    1\. Use ChatGPT to generate the article title.


    2\. Pass this title to a local LLM to compose the actual article, utilizing internal
    documents.


    No. 28 / 120


    ![](index-29_1.png)


    ![](index-29_2.png)


    ![](index-29_3.png)


    ![](index-29_4.png)


    !


    !


    !


    !


    3\. Pass the article to Midjourney, another LLM, to generate images for the article.


    Let''s see how to add a chain to our backend code:


    import { ChatOpenAI } from "@langchain/openai"


    import { PromptTemplate } from "@langchain/core/prompts"


    //


    using the LLMChain; maybe the most straightforward chain import { LLMChain } from
    "langchain/chains"


    const model = new ChatOpenAI({


    openAIApiKey: process.env.OPENAI_API_KEY,


    temperature: 0.9


    })


    const prompt = new PromptTemplate({


    inputVariables: [ "subject"],


    template: "Tell me a story title about {subject}"


    })


    //


    a chain that links the model, the prompt and the verbose option


    const chain = new LLMChain({


    llm: model,


    prompt,


    //


    use verbose to debug the chain


    verbose: true


    })


    export async function POST(req) {


    const { subject } = await req.json()


    //


    invoking the chain


    const gptResponse = await chain.invoke({subject})


    return Response.json({data: gptResponse.text})


    }


    No. 29 / 120


    ![](index-30_1.png)


    You may encounter some examples online that utilize the chain.call() method instead
    of chain.invoke() . Please note that .call() is deprecated and wil be removed.


    The verbose: true option is optional. If enabled, it wil provide additional details
    about the chain in the backend console. This information includes: the input and
    output for each step of the chain


    how long each step took


    the tokenUsage variable


    This last point is important because we pay to use the LLM''s API with tokens.


    On average, 100 words are roughly 130 tokens. A helpful tool for managing tokens
    is the [OpenAI Tokenizer](https://platform.openai.com/tokenizer). The tokenUsage
    is divided into how much the input prompt used and how much the actual response
    used:


    "llmOutput": {


    "tokenUsage": {


    "completionTokens": 14,


    "promptTokens": 14,


    "totalTokens": 28


    }


    }


    In the frontend code, we wil simply replace the text input with a select box to
    facilitate data entry:


    export default function Home() {


