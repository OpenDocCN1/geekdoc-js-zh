    \n```\n[\n  x, // 对象有多大\n  y // 对象有多快\n]\n```\n\n嵌入空间的每个轴也被称为维度（dimension）或特征（feature）。\n\
    \n记住，这种表示是非常简化的。通常情况下，每个条目都有更多维度，从几十到几千个不等，取决于数据的复杂性和细粒度。\n\n给定一组维度，相似的对象会被分在一起，允许我们在虚拟空间或其他任何数据类型中映射单词或相似特征的语义含义。\n\
