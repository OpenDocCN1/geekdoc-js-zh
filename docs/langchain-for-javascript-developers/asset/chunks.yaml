  trans: "\n```javascript\nimport { PromptTemplate } from \"@langchain/core/prompts\"\
    \n\nconst model = new ChatOpenAI({\n  openAIApiKey: process.env.OPENAI_API_KEY,\n\
    \  temperature: 0.9\n})\n\n// establishing the general format of the template\n\
    const prompt = new PromptTemplate({\n  inputVariables: [\"subject\"],\n  template:\
    \ \"Tell me a story title about {subject}\"\n})\n\nexport async function POST(req)\
    \ {\n  const { subject } = await req.json()\n  // passing down the { subject }\
    \ parameter\n  const formattedPrompt = await prompt.format({\n    subject\n  })\n\
    \n  const gptResponse = await model.invoke(formattedPrompt)\n  return Response.json({data:\
    \ gptResponse.content})\n}\n```\n\nNo. 26 / 120\n\n![](img/index-27_1.png)\n\n\
    编写 prompt template 的默认格式是 F-String 格式，它在 Python 中非常流行。如果你想使用更熟悉的双大括号 JavaScript\
    \ Mustache 格式，可以使用：\n\n```javascript\nconst prompt = PromptTemplate.fromTemplate(\n\
    \  inputVariables: [\"subject\"],\n  template: \"Tell me a story title about {{subject}}\"\
    ,\n  {\n    templateFormat: \"mustache\"\n  }\n)\n```\n\n如果你想了解更多，可以查看文档中的[快速上手指南](https://js.langchain.com/docs/modules/model_io/prompts/quick_start/)。\n\
    \nNo. 27 / 120\n\n![](img/index-28_1.png)\n\n## 2.6. Chains (链)\n\nChains（链）指的是调用的序列——无论是调用\
    \ LLM、工具还是数据预处理步骤。\n\n它们是 LangChain 中至关的核心概念，可以看作围绕 LLMs 编写的用于执行复杂任务的短程序。\n\n\
    提到链，这里有一个关于 LangChain Logo 的趣闻：鹦鹉和链条的灵感源于人们将 LLM 称为“随机鹦鹉”（stochastic parrots）。这些模型可以模仿人类的写作，但并不真正理解它们在说什么。这个库旨在将这些“鹦鹉”“链”在一起，产生更有意义且实用的输出。\n\
    \n链中上一个环节的输出将成为下一个环节的输入。\n\n假设我们需要为一本杂志创作一篇文章。我们将遵循以下步骤：\n\n1. 使用 ChatGPT 生成文章标题。\n\
    2. 将此标题传递给本地 LLM，利用内部文档编写正文。\n3. 将文章传递给 Midjourney（另一个 LLM），为文章生成图像。\n\nNo. 28\
    \ / 120\n\n![](img/index-29_1.png)\n![](img/index-29_2.png)\n![](img/index-29_3.png)\n\
    ![](img/index-29_4.png)\n\n让我们看看如何向我们的后端代码添加一个链：\n\n```javascript\nimport { ChatOpenAI\
    \ } from \"@langchain/openai\"\nimport { PromptTemplate } from \"@langchain/core/prompts\"\
    \n\n// 使用 LLMChain; 可能是最简单的链\nimport { LLMChain } from \"langchain/chains\"\n\n\
    const model = new ChatOpenAI({\n  openAIApiKey: process.env.OPENAI_API_KEY,\n\
    \  temperature: 0.9\n})\n\nconst prompt = new PromptTemplate({\n  inputVariables:\
    \ [\"subject\"],\n  template: \"Tell me a story title about {subject}\"\n})\n\n\
    // 一个链接模型、提示 和 verbose 选项的链\nconst chain = new LLMChain({\n  llm: model,\n  prompt,\n\
    \  // 使用 verbose 来调试链\n  verbose: true\n})\n\nexport async function POST(req)\
    \ {\n  const { subject } = await req.json()\n  // 调用链\n  const gptResponse = await\
    \ chain.invoke({subject})\n  return Response.json({data: gptResponse.text})\n\
    }\n```\n\nNo. 29 / 120\n\n![](img/index-30_1.png)\n\n你可能会在网上看到使用 `chain.call()`\
    \ 方法而不是 `chain.invoke()` 的示例。请注意，`.call()` 已弃用并将移除。\n\n`verbose: true` 选项是可选的。如果启用，它将在后端控制台中提供关于链的更多详细信息。这些信息包括：\n\
    \n- 链中每一步的输入和输出\n- 每一步花费了多久\n- `tokenUsage` 变量\n\n最后这一点很重要，因为我们通过 token 支付 LLM\
    \ API 的费用。平均而言，100 个单词大约相当于 130 个 token。一个管理 token 的有用工具是 [OpenAI Tokenizer](https://platform.openai.com/tokenizer)。`tokenUsage`\
    \ 分为输入 prompt 使用了多少以及实际响应使用了多少：\n\n```json\n\"llmOutput\": {\n  \"tokenUsage\"\
    : {\n    \"completionTokens\": 14,\n    \"promptTokens\": 14,\n    \"totalTokens\"\
    : 28\n  }\n}\n```\n\n在前端代码中，我们将简单地将文本输入替换为选择框以方便数据输入：\n\n```javascript\nexport\
    \ default function Home() {\n// 其余部分保持不变\n// ...\nreturn (\n  <>\n    <h1>故事生成器</h1>\n\
    \    <em>此应用使用 GPT 模型来生成故事...```\n    // ... (UI 代码)\n![](img/index-31_1.png)\n\
    ![](img/index-31_2.png)\n![](img/index-31_3.png)\n![](img/index-31_4.png)\n![](img/index-31_5.png)\n\
    ![](img/index-31_6.png)\n    <select name=\"subject\">\n      <option value=\"\
    cats\">猫</option>\n      <option value=\"unicorns\">独角兽</option>\n      <option\
    \ value=\"elfs\">精灵</option>\n    </select>\n    <button>询问 AI</button>\n  </>\n\
    )\n}\n```\n\nNo. 30 / 120\n\n## 2.7. LCEL - LangChain 语言\n\nLangChain 语言（简称 LCEL）提供了一种更简单的方法来链接多个节点。简而言之，使用\
    \ LCEL，我们可以用 `.pipe()` 方法替换其他类（如 `LLMChain`）。让我们再次查看：\n\n```javascript\nconst\
    \ model = new ChatOpenAI({\n  openAIApiKey: process.env.OPENAI_API_KEY,\n  temperature:\
    \ 0.9\n})\n\nconst prompt = new PromptTemplate({\n  inputVariables: [\"subject\"\
    ],\n  template: \"Tell me a story title about {subject}\"\n})\n\n// 之前\nconst\
    \ chain = new LLMChain({\n  llm: model,\n  prompt,\n})\nawait chain.invoke({subject})\n\
    \n// 之后\nconst chain = prompt.pipe(model)\nawait chain.invoke({subject})\n```\n\
    \nLCEL 的核心元素是 `RunnableInterface`。它确保链中的节点具有通用模式。LCEL 标准化了通信并允许在 LangChain 框架内轻松切换组件。所有的组件都是模块化的。如果需要更改某些内容，只需替换该部分而不是整个流水线。本书中的许多示例将使用\
    \ LCEL 制作。\n\nNo. 31 / 120 这标志着我们使用 JavaScript、LangChain 和 ChatGPT 的第一个小应用的结束。\n\
    \n我们学会了如何：\n\n- 初始化并连接 Web 应用到 LLM。\n- 利用 LangChain 的 prompt 模板防止重复并创建我们的第一个链。\n\
    \n"
- fmt: "\nIn the next chapter, we wil expand this application to generate the actual\
    \ story body and integrate data streams.\n\n# 3. Streams in LangChain\n\n## 3.1\
    \ Introduction and project setup\n\nSome answers may take a lot of time to be\
    \ generated by an LLM. For instance, if you request the model to craft a complex\
    \ response like a poem or summarize a document.\n\nGiven the way LLMs work, we\
    \ don't have to wait for the ful answer to be complete. Have you noticed that\
    \ when you ask ChatGPT something you wil see that typewriter effect, wherein each\
    \ word appears gradual y on the screen?\n\nA Large Language Model does not reason\
    \ like a human. It does not first build the ful response and then explain it.\
    \ Nor does it map the answer to a knowledge graph or something similar. It just\
    \ adds one token at a time to the answer.\n\nThis is great because we can use\
    \ this streaming behavior to update the UI as soon as we have new info to show\
    \ to the user.\n\nReturning to the story generator example, let's say we want\
    \ to make a story named `The Secret of the Silver Elves`. Instead of waiting for\
    \ the ful story to be generated, we can stream the story while it is written:\n\
    \nOnce upon a time\n\n...\n\n...\n\nOnce upon a time, in a mystical forest\n\n\
    ...\n\n...\n\nOnce upon a time, in a mystical forest hidden deep within the mountains\n\
    \n...\n\n...\n\nOnce upon a time, in a mystical forest hidden deep within the\
    \ mountains, there lived a clan of silver elves.\n\nIn this chapter, we wil implement\
    \ the streaming feature. This is how the UI of the app wil look like at the end:\n\
    \n## 3.2 Project refactor\n\nBefore we move forward, we first need to do a bit\
    \ of refactoring to our project.\n\nOn the frontend, we wil do the following:\n\
    \n1. once we have a title for the story, we wil display it as a button with the\
    \ text `Tell me the story of <<story name here>>`\n2. when this button is pressed,\
    \ we wil make a cal to the backend, pass in the story name and print the response\n\
    \nThis is how the code wil look like:\n\n```javascript\n// code/streaming/src/app/page.js\n\
    \n'use client'\n\nimport { useState } from \"react\"\n\nexport default function\
    \ Home() {\n\n  const [storyTitle, setStoryTitle] = useState()\n\n  //! a new\
    \ state variable for the storyBody\n\n  const [storyBody, setStoryBody] = useState()\n\
    \n  const onSubmitHandler = async (e)=> {\n    e.preventDefault()\n    const subject\
    \ = e.target.subject.value\n    const response = await fetch('api', {\n      method:\
    \ \"POST\",\n      body: JSON.stringify({ subject })\n    })\n\n    const { data\
    \ } = await response.json()\n    setStoryTitle(data)\n  }\n\n  //! call this method\
    \ when the start story button is pressed const startStoryStream = async ()=> {\n\
    \    //! reset the story body, call the backend\n    // and display the response\
    \ in the story body\n    setStoryBody('')\n    const response = await fetch('api',\
    \ {\n      method: \"POST\",\n      body: JSON.stringify({ storyTitle })\n   \
    \ })\n\n    const { data } = await response.json()\n    setStoryBody(data)\n \
    \ }\n\n  return (\n    <>\n      <h1>\" The Story Maker</h1>\n      <em>This app\
    \ uses a GPT Model to generate a story for kids.</em>\n      <form onSubmit={onSubmitHandler}>\n\
    \        Main subject of the story:\n        <select name=\"subject\">\n     \
    \     <option value=\"cats\">$ Cats</option>\n          <option value=\"unicorns\"\
    >\" Unicorns</option>\n          <option value=\"elfs\">% •♀ Elfs</option>\n \
    \       </select>\n        <button># Ask AI Model</button>\n      </form>\n  \
    \    {/* ! if we have the story title show\n      the start story button and the\
    \ story body */}\n      {storyTitle && <div>\n        <button onClick={startStoryStream}>\n\
    \          Tell me the story of {storyTitle}\n        </button>\n        <p>{storyBody}</p>\n\
    \      </div>}\n    </>\n  )\n}\n```\n\nOn the backend, we wil add these changes:\n\
    \nadd a `makeStoryTitle()` method that wil contain al the previous logic add a\
    \ `streamStory()` method. We wil later use this method to implement the streaming\
    \ mechanism. For the time being, it wil return some static text.\n\ncheck if the\
    \ request from the frontend is asking for a story title or for the story body.\
    \ Cal one of the above methods.\n\nHere is how the backend code wil look:\n\n\
    ```javascript\nimport { ChatOpenAI } from \"@langchain/openai\"\nimport { PromptTemplate\
    \ } from \"@langchain/core/prompts\"\n//! we will use the NextResponse to send\
    \ the story body import { NextResponse } from \"next/server\"\n//! all the previous\
    \ logic goes in here\n\nconst makeStoryTitle = async (subject)=> {\n  const model\
    \ = new ChatOpenAI({\n    openAIApiKey: process.env.OPENAI_API_KEY,\n    temperature:\
    \ 0.9\n  })\n  const prompt = new PromptTemplate({\n    inputVariables: [ \"subject\"\
    ],\n    template: \"Tell me a story title about {subject}\",\n  })\n  const chain\
    \ = prompt.pipe(model)\n  return await chain.invoke({subject})\n}\n\n//! we will\
    \ later update this to add the streaming const streamStory = async (storyTitle)=>\
    \ {\n  return new NextResponse(\n    JSON.stringify( { data: \"And here the story\
    \ begins...\"}\n  ),\n  { headers: { 'content-type': 'application/json' },\n \
    \ )\n}\n\nexport async function POST(req) {\n  const { subject, storyTitle } =\
    \ await req.json()\n  //! if the request has a storyTitle then return streamStory()\n\
    \  if (storyTitle) {\n    return streamStory(storyTitle)\n  }\n  //! if we don't\
    \ have a storyTitle return one\n  const gptResponse = await makeStoryTitle(subject)\n\
    \  return Response.json({data:gptResponse})\n}\n```\n\n## 3.3 Streaming the response\n\
    \nIn some cases, AI models can take seconds to generate a complete response to\
    \ a prompt. This is slower than the ~200-300 ms threshold at which an app feels\
    \ responsive.\n\nTo make the app feel responsive we need to show intermediate\
    \ progress and stream the final output in chunks, yielding each chunk as soon\
    \ as it is available. Not al models support streaming, so be sure to check if\
    \ the model you use supports this feature.\n\nIt's time to add the streaming feature\
    \ to our story generator app. Note that this wil not be a single request-response\
    \ interaction. It wil be more like an ongoing chat. The frontend wil keep requesting\
    \ new LLM response chunks and update the ongoing result, while the backend sends\
    \ back response chunks and indicates when the stream is finished.\n\nWe wil start\
    \ with the backend. Al the changes wil be made in the `streamStory()` method we\
    \ have defined during the previous step:\n\n```javascript\n// code/streaming/src/app/api/route.js\n\
    // the rest remains the same\n\n// ...\n\nconst streamStory = async (storyTitle)=>\
    \ {\n  const encoder = new TextEncoder()\n  const stream = new TransformStream()\n\
    \  const writer = stream.writable.getWriter()\n  const model = new ChatOpenAI({\n\
    \    openAIApiKey: process.env.OPENAI_API_KEY,\n    temperature: 0.9,\n    streaming:\
    \ true,\n    callbacks: [{\n      handleLLMNewToken: async (token) => {\n    \
    \    await writer.ready\n        await writer.write(encoder.encode(`${token}`))\n\
    \      },\n      handleLLMEnd: async () => {\n        await writer.ready\n   \
    \     await writer.close()\n      }\n    }]\n  })\n  const prompt = new PromptTemplate({\n\
    \    inputVariables: [ \"storyTitle\" ],\n    template: \"Tell me story titled\
    \ {storyTitle}\"\n  })\n  const chain = prompt.pipe(model)\n  chain.invoke({storyTitle})\n\
    \  return new NextResponse(stream.readable, {\n    headers: { \"Content-Type\"\
    : \"text/event-stream\" }\n  })\n}\n```\n"
