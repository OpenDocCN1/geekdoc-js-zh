  trans: "\n\n上下文长度（Context length）指的是模型一次能够处理的最大单词数。你可以将其视为模型的内存或注意力跨度。这是像 `ChatGPT`\
    \ 和 `Llama` 等基于 Transformer 的模型中预设的特性。\n\n以下是一些流行的大语言模型（LLMs）的默认上下文长度：扩展上下文不会重新训练模型；在此过程中权重将保持不变。\n\
    \n前端部分将保持不变。我们只需传入问题并显示答案即可。\n\n第 90 / 120\n\n![](img/index-91_1.png)\n\n让我们测试一下。再次问它“LangSmith\
    \ 是什么？”，而现在我们将从我们刚刚创建的本地文档中获得答案：第 91 / 120\n\n## 6.4. RAG 过程的组件\n\n让我们来看一下 RAG\
    \ 过程中涉及的各种组件类型：\n\n1. `Document Loaders`（文档加载器） - 将这些看作你的数据收集器。它们抓取外部信息并将其加载，无论是旧的\
    \ `.txt` 文件、网页文本，甚至是 YouTube 视频字幕。\n\n2. `Transformers`（转换器） - 你已经加载了文档，但有时它们需要进行一些微调以完美适配你的应用。`LangChain`\
    \ 预制的转换器可以帮助你调整文档。一个基础示例是使用转换器将一个大文档拆分成较小的片段，以适应你模型的上下文窗口。\n\n3. `Embeddings`（嵌入）\
