  trans: "\n\nNo. 80 / 120\n\n## 6.1. 引言\n\n让我们来聊一个在使用 LLM 时非常重要的话题：`RAG`，它代表“检索增强生成”（Retrieval\
    \ Augmented Generation）。\n\n`RAG` 是通过引用训练数据源之外的知识库来优化 LLM 输出的过程。\n\n例如，`ChatGPT\
    \ 3.5 Turbo` 的知识截止日期是 2021 年 9 月。这意味着，在没有外部帮助的情况下，模型将不知道此日期之后发生了什么。\n\n但如果我们需要处理关于\
    \ `LangSmith` 的信息呢？它是由与 `LangChain` 同一家公司开发的工具。这个新工具是在 2023 年发布的，晚于知识截止日期。\n\n\
    或者，如果我们需要创建一个机器人，让它引用组织的一些内部文档来提供客户支持呢？\n\n这就是 `RAG` 大显身手的地方。通过使用 `RAG`，你可以将 `CSV`\
    \ 文件、视频、`PDFs` 等外部数据源连接到 LLM 并提供外部上下文。\n\n关于 `RAG` 的几点考量：\n\n- `RAG` 不会重新训练模型。它不会更新神经网络的权重。它只是为模型提供了更多的参考信息。\n\
    - 在下一章中，我们将讨论到 `AI Agents`。虽然 `AI Agents` 可以搜索外部信息，但它们速度更慢、成本更高，并且可能提供不可靠的输出。`AI\
    \ Agents` 适用于复杂情况以及可以使用各种工具解决的非线性 if-then-else 案例。\n- 通过 `RAG`，你可以提前执行知识检索过程，并为\
    \ `Q&A` 等场景提供快速解决方案。\n\n### 但为什么 `RAG` 如此重要？\n\nNo. 81 / 120\n\nLLM 的训练成本非常高。**非常高**！例如，来自\
    \ `Meta` 的 `Llama 2` 模型使用了 6000 个 `GPUs` 运行了 12 天。训练成本大约为 200 万美元。在绝大多数情况下，你并不想从零开始训练模型。\n\
    \n然而，随着每一分钟的过去，都会产生新的信息/知识。让模型与新信息同步是一场持续的竞赛。\n\n即使是微调也需要花费大量时间。\n\n其他选择是什么？使用\
    \ `RAG` 只为我们的 LLM 提供我们所需的知识片段。\n\n`RAG` 节省了时间和金钱，因为不需要训练。\n\nNo. 82 / 120\n\n\
    ![](img/index-83_1.png)\n\n## 6.2. 示例设置\n\n我们将通过构建以下示例来探索如何连接 LLM 与外部文档：\n\n在最终版本中，我们的应用将执行以下操作：\n\
    - 读取外部数据源\n- 从文本中提取嵌入（embeddings）\n- 将上一步的嵌入存储在本地向量数据库中\n- 根据这些信息回答问题\n\n这将是应用的数据流：\n\
    \nNo. 83 / 120\n\n![](img/index-84_1.png)\n\n以下是初始的前端设置。我们发送一个问题并打印响应：\n\n```javascript\n\
    // code/rag/src/app/page.js\n\n'use client'\n\nimport { useState } from \"react\"\
    \n\nexport default function Home() {\n  const [answer, setAnswer] = useState()\n\
    \n  const askQuestion = async (e)=> {\n    e.preventDefault()\n    const question\
    \ = e.target.question.value\n    const response = await fetch('api', {\n     \
    \ method: \"POST\",\n      body: JSON.stringify({question})\n    })\n```\n\nNo.\
    \ 84 / 120\n\n![](img/index-85_1.png)\n\n```javascript\n    const {data} = await\
    \ response.json()\n    setAnswer(data)\n  }\n\n  return (<>\n    <h1>文档机器人</h>\n\
    \    <form onSubmit={askQuestion} >\n      <input name=\"question\" />\n     \
    \ <button>提问机器人</button>\n    </form>\n    <p>{answer}</p>\n  </>)\n  )\n}\n```\n\
    \n而在后端，我们使用 `GPT` 模型来回答问题：\n\n```javascript\n// code/rag/src/app/api/route.js\n\
    \nimport { ChatOpenAI } from \"@langchain/openai\"\nimport { ChatPromptTemplate\
    \ } from \"@langchain/core/prompts\"\nimport { LLMChain } from \"langchain/chains\"\
    \n\nconst model = new ChatOpenAI({\n  openAIApiKey: process.env.OPENAI_API_KEY\n\
    })\n\nconst prompt = ChatPromptTemplate.fromTemplate(\n`回答用户的问题：\n  问题: {input}`\n\
    )\n\nconst chain = new LLMChain({\n  llm: model,\n  prompt\n})\n\nexport async\
    \ function POST(req) {\n  const { question } = await req.json()\n  const data\
    \ = await chain.invoke({\n```\n\nNo. 85 / 120\n\n![](img/index-86_1.png)\n\n```javascript\n\
    \    input: question\n  })\n  return Response.json({data: data.text})\n}\n```\n\
    \n这就是应用的初始设置外观：\n\n虽然这在处理简单问题时如预期运行，但当我们询问其训练数据之外的话题时，模型的局限性就会显现出来。\n\n例如，如果我们询问\
    \ `LangSmith`（一个用于部署和监控 `LLM` 应用的平台），它将给出类似下面的通用回答：No. 86 / 120\n\n![](img/index-87_1.png)\n\
    \n你可能会尝试使用较新的模型。例如，尝试使用 `gpt-4` 模型，它的数据截止到 2023 年 10 月。\n\n因此，是时候引入 `RAG` 来为模型添加新信息并克服它的局限性了。检索增强生成！\n\
    \nNo. 87 / 120\n\n![](img/index-88_1.png)\n\n![](img/index-88_2.png)\n\n![](img/index-88_3.png)\n\
    \n## 6.3. 使用本地文档\n\n使用 `LangChain` 扩展 LLM 上文的方法之一是使用本地文档。在这个示例中，我们使用了简单的文本，但也可以拥有\
    \ `PDF`、`CSV` 和其他类型的文件。我们甚至可以包含视频和音频，这些包含大量信息。让我们看看这一切在后端是如何整合的：\n\n```javascript\n\
    // code/rag/src/app/api/route.js\n\nimport { ChatOpenAI } from \"@langchain/openai\"\
    \nimport { ChatPromptTemplate } from \"@langchain/core/prompts\"\n// 我们需要这个来创建本地文档\n\
    import { Document } from \"@langchain/core/documents\"\n// createStuffDocumentsChain\
    \ 替换了 LLMChain\nimport { createStuffDocumentsChain } from \"langchain/chains/combine_documents\"\
    \n\nconst model = new ChatOpenAI({\n  openAIApiKey: process.env.OPENAI_API_KEY,\n\
    \  // 零温度，没有额外创造力\n  temperature: 0\n})\n\n// 将额外的上下文添加到 prompt\nconst prompt\
    \ = ChatPromptTemplate.fromTemplate(\n`根据以下上下文回答用户的问题：\n{context}\n问题: {input}`\n\
    )\n\n// 手动创建文档\nconst documentA = new Document({\n  pageContent: `LangSmith 是一个用于开发、协作、测试、部署和监控\
    \ LLM 应用的统一 DevOps 平台。`\n})\n\nconst documentB = new Document({\n  pageContent:\
    \ `LangSmith 于 2023 年 7 月首次封闭发布。`\n})\n\n// 更新链类型\nconst chain = await createStuffDocumentsChain({\n\
    \  llm: model,\n  prompt,\n})\n\nexport async function POST(req) {\n  const {\
    \ question } = await req.json()\n  // 将文档数组作为上下文\n  const data = await chain.invoke({\n\
    \    input: question,\n    context: [documentA, documentB]\n  })\n  return Response.json({data})\n\
    }\n```\n\nNo. 89 / 120\n\n![](img/index-90_1.png)\n\n注意，使用 `createStuffDocumentsChain()`\
    \ 创建的链在调用 `invoke()` 方法时期望接收一个 `context` 变量。\n\n未这样做会导致以下错误：`Error: Prompt must\
    \ include a context variable`\n\n"
- fmt: "\nContext length refers to the maximum number of words a model can handle\
    \ at once. Think of it as the model's memory or attention span. This is a predetermined\
    \ feature in transformer-based models such as `ChatGPT` and `Llama`.\n\nBelow\
    \ are the default context lengths of some popular LLMs: Expanding the context\
    \ does not retrain the model; the weights remain unchanged in this process.\n\n\
    The frontend wil remain the same. We simply pass in the question and display the\
    \ answer.\n\nNo. 90 / 120\n\n![](index-91_1.png)\n\nLet's test it out. Wil ask\
    \ it again What is LangSmith? and wil now get an answer from the local documents\
    \ we have just created: No. 91 / 120\n\n## 6.4. Components of the RAG process\n\
    \nLet's take a look at the different component types involved in the RAG process:\n\
    \n1. `Document Loaders` - think of these as your data gatherers. They pul in external\
    \ info and load it up, whether it's plain old `.txt` files, web page text, or\
    \ even YouTube video transcripts.\n\n2. `Transformers` - you've got your docs\
    \ loaded, but sometimes they need a little makeover to fit your app just right.\
    \ `LangChain`'s pre-made transformers help you tweak the docs. A basic example\
    \ can be to use a transformer to break down a big document into smaller segments\
    \ that fit within your model's contextual window.\n\n3. `Embeddings` - this is\
    \ al about turning data into vectors. The `Embeddings` class is your go-to for\
    \ working with embedding models like the ones from `OpenAI`, `Meta`, or those\
    \ on `Hugging Face`. Think of text embeddings as a way to represent text or data\
    \ in a vector space, making stuff like semantic search faster.\n\n4. `Vector Databases`\
    \ - time to stash the text embeddings we have generated in the previous step.\
    \ These specialized databases are built to store and fetch vector data efficiently.\
    \ They make semantic searches easy and quick. We can pul up the most relevant\
    \ text in a snap. We'll dive deeper into vector databases later on.\n\n5. `Retrievers`\
    \ - last but not least, meet your info-fetching sidekick: the retrievers. Unlike\
    \ vector stores that just hold onto data, a retriever goes out and fetches the\
    \ docs you need. While some retrievers might use vector stores, there are al kinds\
    \ of retrievers tailored for specific tasks.\n\nNo. 92 / 120\n\n## 6.5. Vectors,\
    \ Embeddings and Vector databases\n\nBefore we continue, we need to make a short\
    \ detour and discuss some fundamental concepts involved in the RAG process.\n\n\
    We wil start with vectors. A vector is simply an array of numbers.\n\n```\n//\
    \ this is how a vector looks like\nlet vec = [2.5, 1.3, 7.0, 9.2]\n```\n\nWhat's\
    \ cool about vectors is that they can represent more complex objects like words,\
    \ sentences, audio files, or even images in a high-dimensional space cal ed an\
    \ embedding.\n\nFor example, let's take the following entries: `snail`, `plane`,\
    \ `speed train` and `turtle`.\n\nWe can store these entries in a two-dimensional\
    \ embedding space based on:\n- how big they are\n- how fast they are\n\nA visual\
    \ representation might look like this:\n\nNo. 93 / 120\n\n![](index-94_1.png)\n\
    \nEach point is a vector with the following format:\n\n```\n[\n  x, // how big\
    \ is the object\n  y // how fast is the object\n]\n```\n\nEach axis of an embedding\
    \ space is also known as a dimension or a feature.\n\nKeep in mind that this representation\
    \ is very simplified. In general, each entry has many more dimensions, ranging\
    \ from tens to thousands, depending on the complexity and granularity of the data.\n\
    \nGiven a set of dimensions, similar objects are grouped together, allowing us\
    \ to map the semantic meaning of words or similar features in virtual y any other\
    \ data type.\n\nUsing these embeddings we can do stuff such as recommendation\
    \ systems, search engines and even text generation like the one in `ChatGPT`.\n\
    \nNo. 94 / 120\n\nBut once we have our vector entries mapped to the dimensions\
    \ of the embeddings, where do we store them? And how can we query them quickly?\n\
    \nWell, that's where vector databases come in. In a classic relational database,\
    \ we have rows and columns; in a vector database, we have arrays of numbers (vectors)\
    \ grouped together based on similarity.\n\nOrganizing data this way alows us to\
    \ make similar queries with ultra-low latency.\n\nWe can easily retrieve the distance\
    \ between these entries. This makes semantic search faster as we can easily relate\
    \ between different concepts based on one or multiple dimensions.\n\nSome of the\
    \ main vector databases we can use today:\n- [Chroma](https://www.trychroma.com/)\n\
    - [Pinecone](https://www.pinecone.io/)\n- [Weaviate](https://weaviate.io/)\n-\
    \ [Redis Vector Database](https://redis.io/solutions/vector-search/)\n\nNo. 95\
    \ / 120\n\n![](index-96_1.png)\n\n## 6.6. Using CheerioWebBaseLoader and MemoryVectorStore\n\
    \nIn the previous example, we used just the document loaders and the retriever.\
    \ Now, it's time to expand our example and put the other RAG components to work.\n\
    \nWe want to add the following features to the app:\n- read a given URL provided\
    \ by the user\n- load the content of the page from the URL\n- create embeddings\
    \ and store the results in the local vector database\n- retrive and answer questions\
    \ from the new data\n\nThis is how the final example wil look like:\n\nWe'll start\
    \ with the frontend. We wil add a new button that asks for a URL and sends it\
    \ to the backend:\n\n```javascript\n// code/rag/src/app/page.js\n'use client'\n\
    \nimport { useState } from \"react\"\n\nexport default function Home() {\n  const\
    \ [answer, setAnswer] = useState()\n  //! add a new state variable\n  const [docStatus,\
    \ setDocStatus] = useState(false)\n\n  const askQuestion = async (e)=> {\n   \
    \ e.preventDefault()\n    const question = e.target.question.value\n    const\
    \ response = await fetch('api', {\n      method: \"POST\",\n      body: JSON.stringify({question})\n\
    \    })\n    const {data} = await response.json()\n    setAnswer(data)\n  }\n\n\
    \  //! ask for the URL, pass it to the backend, update the docStatus\n  const\
    \ loadUrl = async (e)=> {\n    const url = prompt(\"Please enter the URL for the\
    \ document context:\")\n    const response = await fetch('api', {\n      method:\
    \ \"POST\",\n      body: JSON.stringify({url})\n    })\n    const { loaded } =\
    \ await response.json()\n    setDocStatus(loaded ? `Loaded: ${url}` : false)\n\
    \  }\n\n  return (\n    <>\n      <h1>Documents chatbot</h1>\n      {/* ask for\
    \ the URL and show the docStatus */}\n      <p>\n        <button onClick={loadUrl}>Load\
    \ URL</button>\n        {docStatus}\n      </p>\n      <form onSubmit={askQuestion}>\n\
    \        <input name=\"question\" />\n        {/* disabled until we have a doc\
    \ status */}\n        <button disabled={!docStatus}>Ask chatbot</button>\n   \
    \   </form>\n      <p>{answer}</p>\n    </>\n  )\n}\n```\n\nNo. 96 / 120\n\n![](index-97_1.png)\n\
    ![](index-97_2.png)\n![](index-97_3.png)\n![](index-97_4.png)\n![](index-97_5.png)\n\
    \nBy default, the ask-question form wil be disabled. Once the backend finishes\
    \ loading the data from the URL it wil enable the question form: The main difference\
    \ is in the backend, where the model answers the question.\n\nFirst, we will need\
