    How many years have passed since Brazil won the World Cup?\" required the use\
    \ of both `Wikipedia` and `Calculator` tools. With this option, we can monitor\
    \ No. 116 / 120 if the agent is using the correct tools for the job.\n\n## 7.4.\
    \ Recap\n\nAgents and tool use in general, are key concepts of `LangChain`.\n\n\
    At a high level agents involve using a LLM and asking it to reason about which\
    \ actions to take and then executing those actions. Often this is done in a loop\
    \ that repeats until the LLM decides it has reached the objectives, or there are\
    \ no other actions it can take.\n\nThe tools are representations of actions a\
    \ language model can take, along with the functions that implement those actions.\n\
    \nAgents and tools are combined with an agent executor. This agent executor is\
    \ essential y a loop that runs to cal an LLM to figure out what tool the agent\
    \ should try to use next unless it has reached its objective.\n\nAgents are constructed\
    \ based on prompts, as you may have noticed from the code:\n\n```javascript\n\
    const prompt = await pull(\"hwchase17/react\")\nconst agent = await createReactAgent({\n\
    \  llm: model,\n  tools,\n  prompt\n})\n```\n\nThere are many different agent\
    \ types. You can see the five main types of agents available at this moment on\
    \ [this page](https://js.langchain.com/docs/modules/agents/agent_types/): No.\
    \ 118 / 120\n\n![](index-119_1.png)\n\nSome are good for local models, some are\
    \ good for the newest OpenAI models, some support paral el function cal ing, and\
    \ some support conversational history. Others are great for using simple tools\
    \ and single inputs because of their general prompting strategies.\n\nWhen discussing\
    \ AI agents, please note that there are many other topics, concepts, techniques,\
