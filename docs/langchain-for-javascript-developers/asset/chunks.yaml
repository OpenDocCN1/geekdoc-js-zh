    \ there might be brief periods where method names or import statements are not\
    \ aligned with the latest version. For support, feel free to reach out via email\
    \ at `daniel@js-craft.io`.\n\n## 2 Models, Prompts and Chains\n\n### 2.1 Introduction\n\
    \nIt's now time to create our first app using `LangChain` and `JavaScript`. You\
