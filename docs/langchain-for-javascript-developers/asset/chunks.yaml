- fmt: "\n# 5. Chat memory\n\n## 5.1 Introduction and project setup\n\nThe chat memory\
    \ feature allows a Large Language Model (LLM) to remember previous interactions\
    \ with the user. Conversational memory is how a chatbot can respond to multiple\
    \ queries in a chat-like manner. Without it, every query would be treated as a\
    \ single input. Follow-up questions only make sense when they reference previous\
    \ questions and answers. For example, if I just say to an LLM `Explain in detail`\
    \ it wil ask for more context.\n\nBy default, LLMs are stateless. Each incoming\
    \ query is processed independently of other interactions. The only thing that\
    \ exists for a stateless entity is the current input and nothing else.\n\nYou\
    \ are working with a tea shop and have been tasked to make a GPT-powered app that\
    \ provides users with interesting facts about tea. Below is a picture of what\
    \ the final version of the app should look like:\n\n![](index-69_1.png)\n\nWe\
    \ wil start with the following setup.\n\nOn the frontend, we have a button that\
    \ makes a POST request to the API and prints out the answer:\n\n```javascript\n\
    // code/tea-wiki/src/app/page.js\n'use client'\nimport { useState } from \"react\"\
    \n\nexport default function Home() {\n  const [answer, setAnswer] = useState()\n\
    \n  const tellFact = async ()=> {\n    const response = await fetch('api', {\n\
    \      method: \"POST\"\n    })\n    const { data } = await response.json()\n\
    \    setAnswer(data)\n  }\n\n  return (\n    <>\n      <h1>+ Tea Facts</h1>\n\
    \      <button onClick={tellFact}>\n        Tell a fact about my favourite drink\n\
    \      </button>\n      <div>{answer}</div>\n    </>\n  )\n}\n```\n\nWhile on\
    \ the backend, we return the answer given by a GPT model to the prompt `Tell me\
    \ a fact about my favorite drink`:\n\n```javascript\n// code/tea-wiki/src/app/api/route.js\n\
    import { ChatOpenAI } from \"@langchain/openai\"\nimport { ChatPromptTemplate\
    \ } from \"@langchain/core/prompts\"\nimport { StringOutputParser } from \"@langchain/core/output_parsers\"\
    \n\nconst model = new ChatOpenAI({\n  openAIApiKey: process.env.OPENAI_API_KEY,\n\
    \  temperature: 0.9,\n})\n\nconst prompt = ChatPromptTemplate.fromMessages([\n\
    \  [\"human\", \"{input}\"]\n])\n```\n"
  raw: 'While CommaSeparatedListOutputParser or StringOutputParser are great tools
    for simpler direct responses, when we have to deal with more complex outputs,
    we wil need other types of parsers such as [StructuredOutputParser](https://api.js.langchain.com/classes/langchain_output_parsers.StructuredOutputParser.html)


    or [JsonOutputParser.](https://api.js.langchain.com/classes/langchain_core_output_parsers.JsonOutputParser.html)


    For our smal trivia app, a big improvement wil be to receive the output in the
    following format:


    {


    question: ''question text here'',


    answers: [


    ''foo'',


    ''bar'',


    ''qux'',


    ''baz'',


    ],


    correct: 2 // ''qux'' is correct


    }


    To achieve this, we wil use a StructuredOutputParser with a Zod schema.


    The reason for this is that StructuredOutputParser is more versatile and covers
    more use cases than the JsonOutputParser .


    [Zod](https://zod.dev/) is a schema validation library for defining complex data
    structures.


    Let''s see how adding a StructuredOutputParser wil change our backend code:


    // code/trivia-game/src/app/api/route.js


    import { ChatOpenAI } from "@langchain/openai"


    import { PromptTemplate } from "@langchain/core/prompts"


    No. 62 / 120


    ![](index-63_1.png)


    ![](index-63_2.png)


    ![](index-63_3.png)


    ![](index-63_4.png)


    ![](index-63_5.png)


    ![](index-63_6.png)


    //! remove imports of StringOutputParser &


    CommaSeparatedListOutputParser


    //! we will need this one to build a new chain structure import { RunnableSequence
    } from "@langchain/core/runnables"


    //! adding the StructuredOutputParser to replace the other parsers


    import { StructuredOutputParser } from


    "langchain/output_parsers"


    //! we will use the Zod schema to define the types of returned data


    import { z } from "zod"


    const model = new ChatOpenAI({


    openAIApiKey: process.env.OPENAI_API_KEY,


    temperature: 0.9


    })


    //! Zod is used to define if a field is a string, number, array etc


    const parser = StructuredOutputParser.fromZodSchema(


    z.object({


    question: z.string().describe(


    `tell me a random geography trivia question`


    ),


    answers: z


    .array(z.string())


    .describe(`


    give 4 possible answers, in a random order,


    out of which only one is true.`


    ),


    correctIndex: z.number().describe(


    `the number of the correct answer, zero indexed`


    ),


    })


    )


    //! define a new chain with RunnableSequence


    const chain = RunnableSequence.from([


    No. 63 / 120


    ![](index-64_1.png)


    ![](index-64_2.png)


    ![](index-64_3.png)


    ![](index-64_4.png)


    PromptTemplate.fromTemplate(


    Ànswer the user question as best as possible.\n


    {format_instructions}`


    ),


    model,


    parser,


    ])


    //! using the StructuredOutputParser we can now wrap all the


    //! data into one single structure


    const makeQuestionAndAnswers = async () => {


    //! returning a JSON the defined structure


    return await chain.invoke({


    format_instructions: parser.getFormatInstructions(),


    })


    }


    export async function GET() {


    //! makeQuestion() & makePossbileAnswers() are merged in one function


    const data = await makeQuestionAndAnswers()


    return Response.json({data})


    }


    Even though it looks like we have made a lot of changes, if we remove the new
    line comments, you wil notice that our code is simpler now.


    From the LLM, we are returning a single JSON structure that contains al the info
    our app needs.


    Also, the makeQuestion() and makePossibleAnswers() methods are now merged into
    a single cal , making the app a bit faster.


    With these changes added, we can now indicate if the user clicked a correct or
    incorrect answer.


    Let''s see the changes in the frontend:


    // code/trivia-game/src/app/page.js


    No. 64 / 120


    ![](index-65_1.png)


    ![](index-65_2.png)


    ![](index-65_3.png)


    ![](index-65_4.png)


    ![](index-65_5.png)


    ![](index-65_6.png)


    ![](index-65_7.png)


    ''use client''


    import { useState } from "react"


    export default function Home() {


    const [question, setQuestion] = useState()


    const [answers, setAnswers] = useState([])


    //! adding a third state var to store the correct answer const [correctIndex,
    setCorrectIndex] = useState()


    const getTriviaQuestion = async ()=> {


    const response = await fetch(''api'')


    const { data } = await response.json()


    setQuestion(data.question)


    setAnswers(data.answers)


    //! once we have the correct answer index update the state setCorrectIndex(data.correctIndex)


    }


    //! use the correct answer index to see if the right answer was picked


    const checkAnswer = async (selectedIndex) => {


    (correctIndex === selectedIndex) ?


    alert('') Correct!''):


    alert(''( Try again!'')


    }


    return (<>


    <h1>'' Geography trivia</h1>


    <button onClick={getTriviaQuestion}>


    Ask me a geography question


    </button>


    <p>{question}</p>


    {/*! onClick check if the user answered correctly */}


    {answers.map((answ, i) =>


    <button key={i}


    onClick={() => checkAnswer(i)}>


    {answ}


    No. 65 / 120


    ![](index-66_1.png)


    ![](index-66_2.png)


    </button>


    )}


    </>)


    }


    Nothing too special here. We have added a click listener to each answer button
    and we wil check if the index of that clicked button matches the index of the
    correct answer.


    And this is how the final version of the UI wil look like: Note that even if newer
    models such as ChatGpt 4 can do part of this data manipulation out of the box,
    they are more expensive to use. Therefore we can leverage output parsers to save
    costs and also define a very clear output format, thus reducing unexpected behavior.


    Our final app is just a bit over 80 lines of code. Both backend and frontend.


    We''re talking about a ful y functional trivia game with an endless stream of
