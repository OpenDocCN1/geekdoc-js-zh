    \ it wil not help: No. 74 / 120\n\n![](index-75_1.png)\n\n```javascript\n//! changing\
    \ the promt will not fix the duplication\nconst response = await chain.invoke({\n\
    \  input: `Tell me a fact about my favorite drink.\n  Do not repeat any of the\
    \ previous facts.`,\n  chat_history: chatHistory\n})\n```\n\nRemember that the\
    \ LLMs are stateless — meaning each incoming query is processed independently\
    \ of other interactions. For a stateless model, the only thing that exists is\
    \ the current input. Nothing else.\n\nThis happens because we only provided the\
    \ initial message ( My favorite drink is tea. ). We also need to update the message\
    \ history as the conversation evolves.\n\nNo. 75 / 120\n\n## 5.3. Full conversation\
    \ history\n\nIf you take a look at how we store the conversation history, it's\
    \ just a plain JavaScript array.\n\nThis means that we can easily add messages\
    \ by pushing new items to the array:\n\n`HumanMessage` from the user side, `AIMessage`\
    \ from the model, the conversation wil look something like this:\n\n```javascript\n\
    chatHistory = [\n  new HumanMessage(`My favorite drink is tea.`)\n]\n```\n\nFor\
    \ this step there wil be no changes to the frontend.\n\nHere is how the ful code\
