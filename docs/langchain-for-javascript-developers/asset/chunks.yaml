    # 1. Introduction


    ## 1.1. Getting Book Updates and Code Examples


    To receive the latest versions of the book, subscribe to our mailing list by emailing
    `daniel@js-craft.io`. I strive to keep my book with the latest updates. In order
    to access the latest, make sure to subscribe to `daniel@js-craft.io`.


    ## 1.2. About the author


    Hi there, I’m Daniel, a software developer and educator. I''ve always enjoyed
    teaching. I believe that education is the key to better software.


    You can find me also on:


    - GitHub: `github.com/daniel-nastase`

    - Twitter: `twitter.com/danielnastase`

    - Mastodon: `mastodon.social/@danielnastase`

    - YouTube: `youtube.com/danielnastase`


    ## 1.3. How this book came to be


    The first time I wrote a computer program was 26 years ago when a friend showed
    me ChatGPT. It felt like some magic. But this time I understood how to work.


    So, I went down the "learn how AI works" rabbit hole. And oh boy, this was a deep
    one. I was trying to build and train from scratch. After some time, my only project
    was a [pure neural network](https://github.com/daniel-nastase/Pure-neural-network).
    The model was trained to detect if a hand-drawn shape was a digit.


    I gave up after some time. With al the different architectures, neurons, training
    data sets, backpropagation, or gradient descent. It was too much for my mediocre
    brain.


    Therefore I went back to my normal job as a web developer. But in the background
    of my mind was still the feeling that I should pay attention to AI. Therefore
    decided to give AI another shot. But this time from a more practical angle.


    ## 1.4. What is LangChain


    LangChain is a framework designed to simplify the creation of applications that
    integrate Large Language Models (LLMs).


    LangChain provides al the AI integration building blocks in one framework. It
    offers a modular, flexible, and scalable architecture that is easy to maintain.


    You can see LangChain as the glue layer for almost everything in the AI ecosystem.

