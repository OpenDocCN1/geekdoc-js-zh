    **5.1\. Introduction and project setup**


    The chat memory feature al ows a Large Language Model (LLM) to remember previous
    interactions with the user.


    Conversational memory is how a chatbot can respond to multiple queries in a chat-like
    manner. Without it, every query would be treated as a single independent input
    without considering past interactions.


    Follow-up questions only make sense when they reference the previous questions
    and answers. For example, if I just say to an LLM Explain in detail it wil ask
    for more context. But if I first tell the same LLM How the speed of light was
    calculated followed by Explain in detail I wil get a coherent answer.


    By default, LLMs are stateless. Each incoming query is processed independently
    of other interactions. The only thing that exists for a stateless entity is the
    current input and nothing else.


    You are working with a tea shop and have been tasked to make a GPT-powered app
    that provides users with interesting facts about tea. Below is a picture of what
    the final version of the app should look like: No. 68 / 120


