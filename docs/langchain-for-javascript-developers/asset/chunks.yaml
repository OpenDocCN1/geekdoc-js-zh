    **4. Output**


    **parsers**


    No. 46 / 120


    **4.1. Introduction**


    Alright, let''s dive into the nitty-gritty of output parsers in LangChain.


    Why do we need them? Well, when working with LLMs, you wil realize the response
    may not be the same if you ask the same question twice. Also, the format of the
    output can vary as well.


    For example, if we ask for the recipe for a dish, sometimes the LLM wil return
    Ingredients as the first step, sometimes Preparations. This is normal as LLMs
    are generative, not deterministic. This variability may be fine for a human reader,
    but it becomes problematic if we want an API endpoint to process those responses.


    And when you change the type of underlying LLM model it wil only get worse.


    Think of output parsers as your formatting sidekicks. They can: 1. tweak your
    prompt by adding things such as prefixes or suffixes to steer the output in a
    certain direction. Want a JavaScript array? Want a simple string or JSON nested
    structure? LangChain''s output parsers got you covered;


    2\. after the output is ready, a JavaScript function may step in to tidy things
    up. This function might even use other LLMs to polish the output into the perfect
    format.


    No. 47 / 120


    ![](index-48_1.png)


    **4.2\. Example setup**


    LangChain has several pre-defined output parsers that can be used directly.


    We wil use some of them in the following example.


    You were tasked with making a trivia game using ChatGPT. The user wil ask for
    a trivia question with four possible answers. Only one of these answers is correct.
    Once a possible answer is clicked, a popup indicating whether the answer is correct
    or incorrect wil be displayed. At any time, the user wil be able to ask for a
    new question.


    This is how the final version of the app wil look: We wil start from a very simple
    state.


    On the backend, we wil make an OpenAI model and ask it for a trivia question:


    // code/trivia-game/src/app/api/route.js


    import { ChatOpenAI } from "@langchain/openai"


    import { PromptTemplate } from "@langchain/core/prompts"


    const model = new ChatOpenAI({


    openAIApiKey: process.env.OPENAI_API_KEY,


    })


    No. 48 / 120


    const prompt = PromptTemplate.fromTemplate(


    Àsk me a trivia question about geography.`


    )


    const chain = prompt.pipe(model)


    export async function GET() {


    const gptResponse = await chain.invoke()


    return Response.json({question: gptResponse.text})


    }


    Notice that this time we are using a GET request since we don''t need to send
    any request body. We just need to get a question back.


    On the frontend, we have a simple button that makes the cal to the backend. Using
    a React state variable, the question is displayed once we get the response:


    // code/trivia-game/src/app/page.js


    import { ChatOpenAI } from "@langchain/openai"


    import { PromptTemplate } from "@langchain/core/prompts"


    const model = new ChatOpenAI({


    openAIApiKey: process.env.OPENAI_API_KEY


    })


    const prompt = PromptTemplate.fromTemplate(


    Àsk me a trivia question about geography.`


    )


    const chain = new prompt.pipe(model)


    export async function GET() {


    const gptResponse = await chain.invoke()


    return Response.json({question: gptResponse.text})


