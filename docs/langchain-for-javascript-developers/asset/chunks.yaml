  trans: "\n通过学习 `LangChain`，你将对 AI  way 的结构、工作流和实践有深入的理解。\n\n`LangChain` 的一些用例包括：\n\
    \n- LLM 是在人类编写的非结构化文本上训练的。虽然这对人类交互效果良好，但对于将未格式化的文本发送到 API 可能效果并不佳。API 需要的是类似 `JSON`\
    \ 的结构化数据。\n- `LangChain` 可以格式化 LLM 交互中的输入和输出。\n- LLM 是无状态的。它们不会记得你是谁或你几秒前说了什么。`LangChain`\
    \ 提供对长期和短期记忆的支持。\n- LLM 速度可能慢。`LangChain` 可以在响应生成时进行流式传输，为用户提供快速反馈。\n- LLM 有截止日期。例如，GPT-3.5\
    \ 没有 2021 年之后的训练数据。GPT-4 不知道 2023 年之后的任何信息。通过 LangChain，我们可以创建并管理 AI 代理（Agents），让它们上线、搜索信息并使用工具解析这些信息。\n\
    - 我们可以将多个 LLM 链起来。例如，我们可以使用 Google 的 Gemini 生成文章，然后将文本传递给 Midjourney 为该文章生成图像。\n\
    - LLM 缺乏对内部文档的访问。我们可以使用检索增强生成（`RAG`）为模型提供额外的上下文，使其根据组织的规则和知识与用户交互。`LangChain`\
    \ 拥有一非常强大的 RAG 操作工具集。\n- `LangChain` 抽象了上述操作，方便根据需要更换组件。想因为更好或更便宜而使用不同的 LLM 吗？想更改向量数据库来存储嵌入？`LangChain`\
    \ 都能为你解决。\n- `LangChain` 标准化了与 LLM 工作时的通用模式。虽然可以在不使用 `LangChain` 的情况下创建任何应用，但它简化了过程并比手动提示（prompting）好得多。\n\
    - 如果你想深入研究这个主题，我建议收听 Latent Space 播客中关于 `LangChain` 创始人 Harrison Chase 的那集节目。\n\
    \n## 1.5 本书概述\n\n在本书中，我们将开启一段有趣、实战且务实的 `LangChain` 学习之旅。每个主章节都有一个关联的示例应用程序，该程序会在章节期间逐渐演进。每一步都以易于理解的方式引入新的\
    \ `LangChain` 概念，而不会让你感到压力。本书被刻意分为短小的章节，每章关注不同的主题。\n\n- **第 1 章**：我们将使用一个“故事生成器”（Story\
    \ Generator）应用介绍 `LangChain` 的基础。我们将连接第一个 LLM，并使用提示模板（prompt templates）和链（chains）。我们将深入研究模板、模板组合等内容。\n\
    - **第 2 章**：在第 1 章的基础设置之后，本章将引入流式传输（streaming）的概念。使用同一个“故事生成器”应用，我们将流式传输 LL 的响应以改进用户体验。\n\
    - **第 3 章**：LLM 的挑战之一是它们以非结构化的格式给出响应，因为它们是在人类理解的文本上训练的。在本章中，我们将通过使用 `ChatGPT`\
    \ 从零创建一个问答游戏（Trivia Game）来学习输出解析器（output parsers）。\n- **第 4 章**：记忆模块为 `LangChain`\
    \ 应用提供了 LLM 记忆。我们可以像 `ChatGPT` 那样记住当前会话中的过去对话和响应。在本章中，我们将构建一个“事实百科全”（Fact Wiki）应用。\n\
    - **第 5 章**：`LangChain` 的关键特性之一是支持 `RAG` - 检索增强生成。在本章中，我们将构建一个根据外部上下文回答问题的聊天机器人（Chat\
    \ Bot）应用。我们将看到如何从 PDF 或在线文档等来源提供数据、什么是嵌入（embeddings）以及向量数据库是如何工作的。\n- **第 6 章**：与链相比，AI\
    \ 代理（AI agents）更加灵活和多功能，它们帮助你构建复杂的解决方案，并允许访问 Google 搜索和数学计算器等第三方工具。它们可以在给定情况下决定使用什么适当的工具。\n\
    \n从构建“故事生成器”到创建“问答游戏”以及真实的“聊天机器人应用”，每一章都会逐渐扩展你的理解。到结束时，我们将探索流式传输、输出解析、记忆模块、AI\
    \ 代理和 RAG 能力，赋予你开发复杂解决方案的能力。\n\n## 1.6 要求以及如何使用本书\n\n`LangChain` 提供了 `JavaScript`\
    \ 和 `Python` 两种实现。在本书中，我们的重点放在 `JavaScript` 上。\n\n你会发现，通过跟随书中提供的示例进行编码学习效果最好。我的建议是最初通读每一章，吸收内容以掌握概念。然后在第二遍时，随着进度进行编码。\n\
    \n我们将结合使用 `LangChain`、`React` 和 `Next.js`。虽然要求你对 `React` 有基础了解，但不需要成为专家。设置 `Next.js`\
    \ 的最简单方法是利用 `create-next-app` 工具。\n\n在大多数情况下，我们的工作将仅限于两个文件：\n- `src/app/page.js`\
    \ - 处理前端；其主要功能是显示信息和数据。\n- `src/app/api/route.js` - 管理后端；此文件将处理与 LLM 的 API 交互。\n\
    \n示例将以逐步迭代的方式进行。每次修改将用 `+` 符号标记，并提供修改文件的路径以供参考。例如：\n\n```javascript\n// src/app/page.js\
    \ - 更新文件的路径\n\n// 添加 PromptTemplate 以避免重复 - 文件更改\nimport { PromptTemplate } from\
    \ \"@langchain/core\"\n\n// 创建一个新的 ChatGPT 模型 - 文件更改\nconst model = new ChatGPT({\n\
    \  openApiKey: process.env.OPENAI_API_KEY,\n  temperature: 0.9\n})\n```\n\n请注意，`LangChain`\
    \ 目前正在经历开发且变化迅速。虽然我会努力频繁更新本书，但可能会出现短暂的方法名称或导入语句与最新版本不匹配的情况。如需帮助，请随时通过邮件联系 `daniel@js-craft.io`。\n\
    \n## 2 模型、提示与链\n\n### 2.1 介绍\n\n现在是使用 `LangChain` 和 `JavaScript` 创建我们的第一个应用了。你被分配创建一个名为“故事制作器”（Story\
    \ Maker）的应用。该应用将为儿童故事生成标题。这是应用程序的 UI 样式：\n\n例如，如果我们指定一个独角兽为主角的故事，应用程序将生成这样的故事标题：\n\
    \n“独角兽的魔法冒险”\n\n### 2.2 开始\n\n最简单的方法是使用 `create-next-app` 工具。一旦安装了它，创建一个名为 `story-generator`\
    \ 的项目：\n\n`yarn create next-app`\n\n或者，你可以使用代码示例中的起始代码。只需在示例文件夹内运行 `npm install`。\n\
    \n我们需要安装几个 npm 依赖项：`LangChain` 和 `OpenAI`。进入项目根目录，并在终端中执行以下命令：\n\n```bash\nnpm\
    \ i langchain @langchain/openai\n```\n\n在编写本书时，这些是安装模块的当前版本：\n\n```json\n{\n \
    \ \"@langchain/openai\": \"⁰.0.14\",\n  \"langchain\": \"⁰.1.19\"\n}\n```\n"
- fmt: "\nPlease note that `LangChain` is currently undergoing rapid development,\
    \ and as it progresses, certain parts of the code may become obsolete. I'm striving\
    \ to keep the book updated, but if, for any reason, something breaks, it might\
    \ be wise to revert to these version numbers.\n\nOnce the dependencies are set\
    \ up, we'l proceed to create the frontend of our app using `React`.\n\nInsert\
    \ the following code into `src/App.js`:\n\n```javascript\n// code/story-generator/src/app/page.js\n\
    \nexport default function Home() {\n  const onSubmitHandler = async (event)=>\
    \ {\n    event.preventDefault()\n    const subject = event.target.subject.value\n\
    \    console.log(subject)\n  }\n\n  return (\n    <>\n      <h1>The Story Maker</h1>\n\
    \      <em>This app uses a GPT Model to generate a story for kids.</em>\n    \
    \  <form onSubmit={onSubmitHandler}>\n        <label htmlFor=\"subject\">Main\
    \ subject of the story:</label>\n        <input name='subject' placeholder='subject...'\
    \ />\n        <button>Ask AI Model</button>\n      </form>\n    </>\n  )\n}\n\
    ```\n\nNothing particularly remarkable at this stage. It's just a React UI that\
    \ fetches the subject of the story from a text input and logs it to the console.\n\
    \nWe'l launch our app by executing the following command in the terminal: `npm\
    \ run dev`\n\nThis wil generate the following output:\n\nCurrently, if the user\
    \ enters a subject, no story wil be generated as we haven't yet integrated the\
    \ app with `OpenAI`. We'll address this in the next chapter.\n\n### 2.3. The API\
    \ key for the OpenAI ChatGPT model\n\nTo use OpenAI's `ChatGPT` model, you wil\
    \ need an API key. The API is subscription-based and the key can be generated\
    \ from the following URL: `https://platform.openai.com/api-keys`\n\nYou can top\
    \ up your account with the minimum value. For example, writing al the examples\
    \ in this book cost me under 2 USD.\n\nOnce you've generated your API key, return\
    \ to the `Next.js` project and paste it into the `.env` file:\n\n```env\n// code/story-generator/.env\n\
    OPENAI_API_KEY='sk-1234567890B2tT4HT3BlbkFJXkATN1arB9DXABkRQ1uj'\n```\n\nThis\
    \ key wil be used only in the backend part of our app. To access the API key in\
    \ the `code/story-generator/src/app/api/route.js` file we can write the following:\n\
    \n```javascript\n// code/story-generator/src/app/api/route.js\nconsole.log( process.env.OPENAI_API_KEY\
    \ )\n```\n\nThe key wil be later passed to the `LangChain` model object constructor.\
    \ This step wil be the default procedure for each of the code examples in the\
    \ following chapters of this book.\n\n[If you don’t wish to use an API key, you\
    \ can check out this list](https://js.langchain.com/docs/modules/model_io/models/)\
    \ with the LLMs supported by `LangChain` and pick up a free model. You can even\
    \ use a free `HuggingFace` token to avoid the `OpenAI` API.\n\n### 2.4. Using\
    \ the ChatOpenAI LangChain model\n\nLet's move forward by establishing a connection\
    \ to `OpenAI`'s LLM. Add the following code to the backend of the app, in the\
    \ `src/app/api/route.js` file:\n\n```javascript\n// code/story-generator/src/app/api/route.js\n\
    import { ChatOpenAI } from \"@langchain/openai\"\n\nconst model = new ChatOpenAI({\n\
    \  openAIApiKey: process.env.OPENAI_API_KEY,\n  temperature: 0.9\n})\n\nexport\
    \ async function POST(req) {\n  const { subject } = await req.json()\n  const\
    \ gptResponse = await model.invoke(subject)\n  return Response.json({data: gptResponse})\n\
    }\n```\n\nTo initiate a connection with `OpenAI`, we create a new instance of\
    \ the `ChatOpenAI` object. Within its constructor, we define the following: a\
    \ `temperature` parameter, set to `0.9`; the API key obtained from the preceding\
    \ subchapter.\n\nYou might be curious about this `temperature` parameter, right?\
    \ The `temperature` parameter affects how imaginative our model gets. Increasing\
    \ it results in more creative outputs while lowering it keeps responses more grounded\
    \ and factual. Sticking to facts reduces potential inaccuracies or hal ucinations\
    \ from the model.\n\nChoosing the right `temperature` depends on the task. For\
    \ brainstorming catchy story titles, a higher temperature is preferable. For tasks\
    \ where accuracy is key like summarizing a legal document, a lower temperature\
    \ is better.\n\nWith our `temperature` set, let's now update the frontend of our\
    \ app:\n\n```javascript\n// code/story-generator/src/app/page.js\nexport default\
    \ function Home() {\n  const onSubmitHandler = async (event) => {\n    event.preventDefault()\n\
    \    const subject = event.target.subject.value\n    // call the LLM with the\
    \ subject\n  }\n  // ...\n}\n```\n\nWith our temperature set... \"Elsa is the\
    \ protagonist of Frozen. She is the queen of Arendelle and possesses the magical\
    \ ability to create ice and snow.\"\n\nPlease note that your answer may be a bit\
    \ different. Opposite to the classic way, an LLM can give different output to\
    \ the same input. For example, requesting like: \"Tell me a story title about\
    \ cats.\"\n\n### 2.5. Prompt templates\n\nYou'll soon notice that the prompt requires\
    \ repetitive input, such as \"Tell me a story title about\" followed by the main\
    \ subject. This redundancy can be addressed using templates, which we'll explore\
    \ next.\n\nBefore we move to the next chapter let's add a smal tweak to our app.\
    \ display the story title given by the LLM in the UI using a state variable.\n\
    \n```javascript\n// code/story-generator/src/app/page.js\n'use client'\nimport\
    \ { useState } from \"react\"\n\nexport default function Home() {\n  const [storyTitle,\
    \ setStoryTitle] = useState()\n  const onSubmitHandler = async (e) => {\n    e.preventDefault()\n\
    \    const subject = e.target.subject.value\n    const response = await fetch('api',\
    \ {\n      method: \"POST\",\n      body: JSON.stringify({ subject })\n    })\n\
    \    const { data } = await response.json()\n    setStoryTitle(data)\n  }\n\n\
    \  return (\n    <>\n      <h1>The Story Maker</h1>\n      <em>This app uses a\
    \ GPT Model to generate a story for kids.</em>\n      <form onSubmit={onSubmitHandler}>\n\
    \        <label htmlFor=\"subject\">Main subject of the story:</label>\n     \
    \   <input name='subject' placeholder='subject...' />\n        <button>Ask AI\
    \ Model</button>\n      </form>\n      {/* display the story title in the UI */}\n\
    \      <p>{ storyTitle }</p>\n    </>\n  )\n}\n```\n\nAnd this is how the UI wil\
    \ look after the change:\n\nLet's now get back to the main content of this chapter:\
    \ prompt templates. Language models use text as input. That text is cal ed a prompt.\
    \ It's not just a fixed string, though. Usual y, it's a mix of a template, examples,\
    \ and what the user adds.\n\nWith templates, we can streamline the prompting process,\
