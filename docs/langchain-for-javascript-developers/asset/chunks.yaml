  trans: "\n\n“2024 年超级碗决赛的冠军是谁？”另一方面，“自从巴西赢得世界杯以来已经过了多少年了？”这个问题需要同时使用 `Wikipedia`\
    \ 和 `Calculator` 工具。通过此选项，我们可以监控智能体是否正在为任务使用正确的工具（第 116 / 120 页）。\n\n## 7.4. 总结\n\
    \n代理（Agents）和工具使用通常是 `LangChain` 的核心概念。\n\n从高层面上来说，代理涉及使用 LLM 并让它推理应该采取哪些操作，然后执行这些操作。这通常在一个循环中完成，直到\
    \ LLM 认为它已经实现了目标，或者没有其他可以的操作。\n\n工具是语言模型可以采取的操作表示，以及实现这些操作的函数。\n\n代理和工具与代理执行器（agent\
    \ executor）结合使用。这个代理执行器通过一个循环运行，调用 LLM 来确定代理下一步应该尝试使用哪个工具，除非它已经达到了目标。\n\n代理是基于提示（prompts）构建的，正如你从代码中注意到的：\n\
    \n```javascript\nconst prompt = await pull(\"hwchase17/react\")\nconst agent =\
    \ await createReactAgent({\n  llm: model,\n  tools,\n  prompt\n})\n```\n\n有许多类型的代理。你可以在[此页面](https://js.langchain.com/docs/modules/agents/agent_types/)查看目前可用的五种主要代理类型（第\
    \ 118 / 120 页）。\n\n![](img/index-119_1.png)\n\n有些适用于本地模型，有些适用于最新的 OpenAI 模型，有些支持并行函数调用（paral\
    \ el function cal ing），有些支持对话历史。由于其通用的提示词策略，其他代理非常适合使用简单工具和单一输入。\n\n在讨论 AI 代理（AI\
    \ agents）时，请注意还有许多其他主题、概念、技术、提示词和功能。我们在本章中讨论的只是该主题非常简要的介绍（第 119 / 120 页）。\n\n\
