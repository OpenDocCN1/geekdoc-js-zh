    \ AI 智能体。\n\n在这种情况下，我们将使用带有 `chat_history` 的 `MessagesPlaceholder` 来告知提示词它不是无状态的，并且有一个历史。\n\
    \nNo. 72 / 120\n\n![](img/index-73_1.png)\n\n![](img/index-73_2.png)\n\n![](img/index-73_3.png)\n\
    \n`chatHistory` 只是一个简单的数组，我们可以在其中存储带有 `HumanMessage` 和 `AIMessage` 对象的对话历史。最后，这些对象的内容仅由简单的字符串加上一些额外的格式组成。\n\
    \n通过这些更改，模型现在将知道我们最喜欢的饮料是茶茶：太棒了！向前迈了一步！\n\n然而，我们现在面临另一个问题。让我们看看在请求多个事实后会发生什么。\n\
    \n为了实现存储之前的实，我们只需要更改前端。我们将跟踪并显示模型给出的所有之前的响应：\n\n```javascript\n// code/tea-wiki/src/app/page.js\n\
    'use client'\nimport { useState } from \"react\"\nexport default function Home()\
    \ {\n  //! 将答案替换为事实数组\n  const [facts, setFacts] = useState([])\n  const tellFact\
    \ = async ()=> {\n    const response = await fetch('api', {\n      method: \"\
    POST\"\n    })\n    const { data } = await response.json()\n    //! 将新事实添加到数组\n\
    \    setFacts([data, ...facts])\n  }\n  return (\n    <>\n      <h1>+ 茶的知识</h1>\n\
    \      <button onClick={tellFact}>\n        告诉我关于我最喜欢的饮料的事实\n      </button>\n\
    \      <ul>\n        {\n          //! 显示数组\n          facts.map( (fact,i) => <li\
    \ key={i}>{fact}</li>)\n        }\n      </ul>\n    </>\n  )\n}\n```\n\n模型一直在返回同样的几个旧事实，就像一个老爷爷不断一遍又一遍复述同样的故事一样。\n\
    \n我们可以尝试更新提示词，但这将没有帮助：No. 74 / 120\n\n![](img/index-75_1.png)\n\n```javascript\n\
    //! 更改提示词无法解决重复问题\nconst response = await chain.invoke({\n  input: `Tell me a\
    \ fact about my favorite drink.\n  Do not repeat any of the previous facts.`,\n\
    \  chat_history: chatHistory\n})\n```\n\n记住，LLM 是无状态的——这意味着每个传入的查询都是独立于与其他交互处理的。对于无状态模型，唯一存在的是当前输入。其他一无所有。\n\
    \n之所以这样做是因为我们只提供了初始消息（My favorite drink is tea.）。我们还需要随着对话的演进来更新消息历史。\n\nNo. 75\
    \ / 120\n\n## 5.3. 完整的对话历史\n\n如果你查看对话历史，它就是一个简单的 JavaScript 数组。这意味着我们可以通过向数组推送新项来轻松添加消息：来自用户端的\
    \ `HumanMessage`，来自模型的 `AIMessage`，对话看起来像这样：\n\n```javascript\nchatHistory = [\n\
    \  new HumanMessage(`My favorite drink is tea.`)\n]\n```\n\n对于这一步，前端不需要更改。\n\n\
    这是后端的完整代码：\n\n```javascript\nimport { ChatOpenAI } from \"@langchain/openai\"\n\
    import { ChatPromptTemplate } from \"@langchain/core/prompts\"\nimport { StringOutputParser\
    \ } from \"@langchain/core/output_parsers\"\n//! 导入 AIMessage 类以存储模型提供的响应\nimport\
    \ { HumanMessage, AIMessage } from \"@langchain/core/messages\"\nimport { MessagesPlaceholder\
    \ } from \"@langchain/core/prompts\"\n\nconst model = new ChatOpenAI({\n  openAIApiKey:\
    \ process.env.OPENAI_API_KEY,\n  temperature: 0.9,\n})\n\nconst prompt = ChatPromptTemplate.fromMessages([\n\
    \  new MessagesPlaceholder(\"chat_history\"),\n  [\"human\", \"{input}\"]\n])\n\
    \nconst outputParser = new StringOutputParser()\nconst chain = prompt.pipe(model).pipe(outputParser)\n\
    export async function POST() {\n  //! 更新提示词\n  const question = `Tell me a fact\
    \ about my favorite drink.\n  Do not repeat any of the previous facts.`\n  //!\
    \ 将用户发送的消息添加到历史中\n  chatHistory.push(new HumanMessage(question))\n  const fact\
    \ = await chain.invoke({\n    input: question,\n    chat_history: chatHistory\n\
    \  })\n  //! 存储每个事实以便 LLM 知道不要重复\n  chatHistory.push(new AIMessage(fact))\n  return\
    \ Response.json({data: fact})\n}\n```\n\n每当用户发送一个新问题时，我们将其封装在 `HumanMessage` 对象中并推送。更重要的是，我们将关于茶的每个事实推送到\
    \ `AIMessage` 对象中。\n\n这将允许 LLM 避免重复自己。\n\n这就是我们应用程序最终版本的样子：得益于更新后的对话历史，这里不再有重复。\n\
    \nNo. 78 / 120\n\n![](img/index-79_1.png)\n\n作为一个最后的想法，记住我们可以在 `invoke()` 方法中使用\
    \ `sessionId` 配置参数来管理不同主题的多个对话线程：\n\n```javascript\n{\n  configurable: {\n   \
    \ sessionId: \"id_value_here\"\n  }\n}\n```\n\nOpenAI ChatGPT 网页应用的操作方式：\n\n你可以在这里阅读更多详细信息：\n\
    \n[`js.langchain.com/docs/use_cases/chatbots/memory_management/`](https://js.langchain.com/docs/use_cases/chatbots/memory_management/)\n\
    \n[/content]\n\n## 6. RAG /\n\n### 与文档对话\n\n"
- fmt: "\nNo. 80 / 120\n\n## 6.1. Introduction\n\nLet's talk about a very important\
    \ topic in working with LLMs: `RAG`, which stands for Retrieval Augmented Generation.\n\
    \n`RAG` is the process of optimizing the output of an LLM by referencing a knowledge\
    \ base outside of its training data sources.\n\nFor example, the knowledge cutoff\
    \ date for `ChatGPT 3.5 Turbo` is September 2021. This means that, without external\
    \ help, the model wil know what happened after this date.\n\nBut what if we need\
    \ to work with information about `LangSmith`, a tool developed by the same company\
    \ as `LangChain`? This new tool was released in 2023, after the knowledge cutoff\
    \ date.\n\nOr what if we need to make a chatbot that references some internal\
    \ documents of an organization to provide customer support?\n\nThis is where `RAG`\
    \ comes in. Using `RAG` you can connect external data sources like `CSV` files,\
    \ videos, `PDFs`, etc. to an LLM and provide external context.\n\nA few considerations\
    \ about `RAG`:\n\n- `RAG` does not retrain the model. It does not update the weights\
    \ of the neuronal network. It just provides more information for the model to\
    \ reference.\n- in the next chapter, we wil talk about `AI Agents`. Although `AI\
    \ Agents` can search for external info, they are slower, more expensive, and can\
    \ provide unreliable outputs. `AI Agents` are good for complex situations and\
    \ if-then-else nonlinear cases that can be solved using various tools.\n- With\
    \ `RAG`, you can perform the knowledge retrieval process upfront and deliver fast\
    \ solutions for scenarios such as `Q&A`.\n\n### But why is `RAG` so important?\n\
    \nNo. 81 / 120\n\nLLM training costs a lot. Like a LOT! For example, the `Llama\
    \ 2` model from `Meta`, was trained using 6000 `GPUs`, running for 12 days. The\
    \ training had a cost of about 2 million USD. In the vast majority of cases, you\
    \ don't want to train your model from scratch.\n\nHowever, with every passing\
    \ minute, there is some information/knowledge that is getting generated. Keeping\
    \ a model updated with new information is a constant race.\n\nEven fine-tuning\
    \ takes a lot of time.\n\nWhat’s the other option? Use `RAG` to provide just the\
    \ slice of knowledge we need for our LLM.\n\n`RAG` saves both time and money,\
    \ as no training is required.\n\nNo. 82 / 120\n\n![](index-83_1.png)\n\n## 6.2.\
    \ Example setup\n\nWe wil explore how to connect an LLM with external documents\
    \ by building the following example:\n\nIn its final version, our app wil know\
    \ to do the following:\n- read an external data source\n- extract the embeddings\
    \ from the text\n- store the embeddings from the previous step in a local vector\
    \ databases\n- answer questions based on this information\n\nThis wil be the data\
    \ flow of the app:\n\nNo. 83 / 120\n\n![](index-84_1.png)\n\nBelow is the initial\
    \ frontend setup. We send a question and print out the response:\n\n```javascript\n\
    // code/rag/src/app/page.js\n\n'use client'\n\nimport { useState } from \"react\"\
    \n\nexport default function Home() {\n  const [answer, setAnswer] = useState()\n\
    \n  const askQuestion = async (e)=> {\n    e.preventDefault()\n    const question\
    \ = e.target.question.value\n    const response = await fetch('api', {\n     \
    \ method: \"POST\",\n      body: JSON.stringify({question})\n    })\n```\n\nNo.\
    \ 84 / 120\n\n![](index-85_1.png)\n\n```javascript\n    const {data} = await response.json()\n\
    \    setAnswer(data)\n  }\n\n  return (<>\n    <h1>, Documents chatbot</h1>\n\
    \    <form onSubmit={askQuestion} >\n      <input name=\"question\" />\n     \
    \ <button>Ask chatbot</button>\n    </form>\n    <p>{answer}</p>\n  </>)\n  )\n\
    }\n```\n\nWhile on the backend we use a `GPT` model to answer the question:\n\n\
    ```javascript\n// code/rag/src/app/api/route.js\n\nimport { ChatOpenAI } from\
    \ \"@langchain/openai\"\nimport { ChatPromptTemplate } from \"@langchain/core/prompts\"\
    \nimport { LLMChain } from \"langchain/chains\"\n\nconst model = new ChatOpenAI({\n\
    \  openAIApiKey: process.env.OPENAI_API_KEY\n})\n\nconst prompt = ChatPromptTemplate.fromTemplate(\n\
    `Ànswer the user's question:\n  Question: {input}`\n)\n\nconst chain = new LLMChain({\n\
    \  llm: model,\n  prompt\n})\n\nexport async function POST(req) {\n  const { question\
    \ } = await req.json()\n  const data = await chain.invoke({\n```\n\nNo. 85 / 120\n\
    \n![](index-86_1.png)\n\n```javascript\n    input: question\n  })\n  return Response.json({data:\
    \ data.text})\n}\n```\n\nThis is how the initial setup of the app looks:\n\nWhile\
    \ this works as expected for simple questions, the limits of the model become\
    \ visible when we ask about topics outside its training data.\n\nFor example,\
    \ if we ask about `LangSmith`, a platform for deploying and monitoring `LLM` applications,\
    \ it wil give general answers like the one below: No. 86 / 120\n\n![](index-87_1.png)\n\
    \nYou may say that we could try to use a newer model. For example, we could try\
    \ to use a `gpt-4o` model, which has its training data up to October 2023.\n\n\
    Most likely, it wil know something about `LangSmith`. However, the core problem\
    \ wil remain: we wil always play catch-up with the cutoff date of the models.\n\
    \nTherefore, it's time to bring in the Retrieval Augmented Generation!\n\nWe can\
    \ use `RAG` to add new information to the model and overcome its limitations.\
    \ This information can be: ownafter the cutoff date of the model\noutside the\
    \ domain of the initial training\nSo, let's explain to our model what LangSmith\
    \ is.\n\nNo. 87 / 120\n\n![](index-88_1.png) \n\n![](index-88_2.png)\n\n![](index-88_3.png)\n\
    \n## 6.3. Using local documents\n\nOne of the easiest ways to expand the context\
    \ of an LLM with `LangChain` is by using local documents. We can create smal pieces\
    \ of information and feed them to the LLM:\n\nIn this example, we have used simple\
    \ text, but we can also have local `PDFs`, `CSVs`, and other types of files. We\
    \ can even include videos and audio, which can contain a larger quantity of information.\
    \ Let's see how al of this comes together in backend:\n\n```javascript\n// code/rag/src/app/api/route.js\n\
    \nimport { ChatOpenAI } from \"@langchain/openai\"\nimport { ChatPromptTemplate\
    \ } from \"@langchain/core/prompts\"\n// we need this one to create local documents\n\
    import { Document } from \"@langchain/core/documents\"\n// createStuffDocumentsChain\
    \ replaces LLMChain\nimport { createStuffDocumentsChain } from \"langchain/chains/combine_documents\"\
    \n\nconst model = new ChatOpenAI({\n  openAIApiKey: process.env.OPENAI_API_KEY,\n\
    \  // zero temperature, no extra creativity\n  temperature: 0\n})\n\n// adding\
    \ the extra context to the prompt\nconst prompt = ChatPromptTemplate.fromTemplate(\n\
    `Ànswer the user's question from the following context:\n{context}\nQuestion:\
    \ {input}`\n)\n\n// manually create documents\nconst documentA = new Document({\n\
    \  pageContent: `LangSmith is a unified DevOps platform for developing, collaborating,\
    \ testing, deploying, and monitoring\nLLM applications.`\n})\n\nconst documentB\
    \ = new Document({\n  pageContent: `LangSmith was first launched in closed beta\
    \ in July 2023`\n})\n\n// updating the chain type\nconst chain = await createStuffDocumentsChain({\n\
    \  llm: model,\n  prompt,\n})\n\nexport async function POST(req) {\n  const {\
    \ question } = await req.json()\n  // pass the documents array as the context\n\
    \  const data = await chain.invoke({\n    input: question,\n    context: [documentA,\
    \ documentB]\n  })\n  return Response.json({data})\n}\n```\n\nNo. 89 / 120\n\n\
    ![](index-90_1.png)\n\nNote that a chain made with `createStuffDocumentsChain()`\
    \ expects to receive a `context` variable when you are calling its `invoke()`\
    \ method.\n\nFailing to do so wil result in the following error: `Error: Prompt\
    \ must include a context variable`\n\nThe `createStuffDocumentsChain()` takes\
    \ a list of documents and formats them al into a prompt, then passes that prompt\
    \ to an LLM. It passes ALL documents, so you should make sure it fits within the\
    \ context length of the LLM you are using.\n"
