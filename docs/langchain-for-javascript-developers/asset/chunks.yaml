    **4.3\. StringOutputParser**


    The output parsers from LangChain.js are meant to convert the AI responses into
    common structures, like JSON, Arrays, String, and more.


    The [StringOutputParser](https://js.langchain.com/docs/modules/model_io/output_parsers/types/string)
    takes the model''s output and converts it into a simple string. This one is maybe
    the easiest-to-use parser.


    Let''s take a look at what an actual response from a ChatGPT cal looks like: const
    prompt = PromptTemplate.fromTemplate(


    Àsk me a trivia question about geography.`


    )


    const chain = prompt.pipe(model)


    const gptResponse = await chain.invoke()


    console.log(gptResponse)


    If we print the gptResponse constant, it wil look like this: This is the structure
    that comes from a ChatGPT model without any added output parsers.


    However, if we use another type of model, such as Llama (made by Meta) or Claude
    (made by Anthropic), the structure can be different. Each model may provide the
    answer wrapped in a different structure.


    This means the line that extracts the final string response may fail because the
    text property might not exist:


    No. 51 / 120


    ![](index-52_1.png)


    ![](index-52_2.png)


    ![](index-52_3.png)


    ![](index-52_4.png)


    ![](index-52_5.png)


    question: gptResponse.text


    In the end, we need just a simple string containing the question.


    This is where the StringOutputParser comes into play. You can add the parser to
    the chain, and it wil ensure the various response types from different LLMs are
    transformed into a simple string.


    Let''s see how this looks in the code:


    // code/trivia-game/src/app/api/route.js


    import { ChatOpenAI } from "@langchain/openai"


    import { PromptTemplate } from "@langchain/core/prompts"


    //! importing the parser


    import { StringOutputParser} from


    "@langchain/core/output_parsers"


    const model = new ChatOpenAI({


    openAIApiKey: process.env.OPENAI_API_KEY


    })


    //! making the prompt and invoking the chain


    const makeQuestion = async ()=> {


    const prompt = PromptTemplate.fromTemplate(


    Àsk me a trivia question about geography.`


    )


    //! adding the parser to the LCEL chain so that we get


    //! just a simple string output instead of an object const chain = prompt


    .pipe(model)


    .pipe(new StringOutputParser())


    return await chain.invoke()


    }


    export async function GET() {


    //! extracted the make question part into its method const question = await makeQuestion()


    No. 52 / 120


    return Response.json({question})


    }


    Remember that in a chain, we can set up multiple consecutive operations, including
    output parsers.


    Notice that after we add an output parser to the chain, we don''t need to manual
    y parse the .text property:


    // before using the parser


    return Response.json({question: gptResponse.text})


    // after adding the output parser to the chain


    return Response.json({question})


    This wil work even if we change the model type.


    Next, let''s see how we can use another type of parser to create an array of responses.


