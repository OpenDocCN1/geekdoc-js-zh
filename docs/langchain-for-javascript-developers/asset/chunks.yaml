  trans: "\n\n```javascript\nexport async function POST(req) {\n  const { question\
    \ } = await req.json()\n  const data = await chain.invoke({\n    question\n  })\n\
    \  return Response.json({data})\n}\n```\n\n我们应用的初始版本似乎运行得非常顺畅。例如，如果我们让它讲一个冷笑话，一切都能按预期工作。\n\
    \n![](img/agents-joke.png)\n\n但如果我们问它“2024 年超级碗赛冠军是谁？”，训练数据集的局限性就开始显现出来。由于该模型的训练数据只包含截至\
    \ 2023 年 10 月的内容，它并不知道答案。\n\n![](img/agents-limit-2023.png)\n\n## 7.2. 创建一个智能体\
    \ (Agent)\n\n是时候创建我们的第一个智能体了。为了克服训练数据集带来的局限性，我们将赋予聊天机器人进行在线研究的选项。\n\n为了完成工作，智能体需要访问特定的工具，例如\
    \ Google 或维基百科搜索能力。通过将 GPT 模型与这些工具结合，智能体可以确定实现目标所需的行动。\n\n如果我们查看工具（Tools）文档，可以看到所有可用选项的列表\
    \ [`js.langchain.com/docs/integrations/tools/`](https://js.langchain.com/docs/integrations/tools/)。\n\
    \n![](img/agents-docs-tools.png)\n\n虽然加载所有可用工具可能很有诱力，但为智能体配备必要的工具至关重要。提供过多的选项可能会导致以下一种或多种情况：\n\
    \n- 智能体选择了不合适的工具\n- API 调用成本更高；智能体将使用更多 token，增加网络延迟\n\n对于我们的用例，我们将为智能体配备 2 个工具：一个维基百科搜索工具和一个数学计算器。\n\
    \n```javascript\nconst wikipediaQuery = new WikipediaQueryRun({topKResults: 1})\n\
    const calculator = new Calculator()\nconst tools = [wikipediaQuery, calculator]\n\
    ```\n\n请注意，对于 `Calculator` 工具，你需要安装 `@langchain/community` 包：\n\n```bash\nnpm\
    \ install @langchain/community\n```\n\n![](img/index-111_1.png)\n![](img/index-111_2.png)\n\
    ![](img/index-111_3.png)\n\n等等，什么！？给 AI 模型配数学计算器？嗯，因为神经网络是通过估算来工作的，它们并不擅长数学。它们有极小的概率会在基础数学运算上出错。因此，使用基础数学工具进行这些操作更安全、更快。\n\
    \n此工具集将传递给 AI 智能体。如文档所示，每种智能体类型都有独特的用途：[`js.langchain.com/docs/modules/agents/agent_types/`](https://js.langchain.com/docs/modules/agents/agent_types/)。例如，结构化对话（Structured\
    \ Chat）针对多次交互进行了优化。\n\n我们将采用 `ReAct Agent`，它是最多功能的行动智能体。顺便提一下，`ReAct Agent` 与\
    \ JavaScript React 框架无关。\n\n后端的完整代码看起来如下：\n\n```javascript\n// code/agents/src/app/page.js\n\
    import { ChatOpenAI } from \"@langchain/openai\"\nimport { WikipediaQueryRun }\
    \ from \"@langchain/community/tools/wikipedia_query_run\"\nimport { createReactAgent,\
    \ AgentExecutor } from \"langchain/agents\"\nimport { Calculator } from \"@langchain/community/tools/calculator\"\
    \nimport { pull } from \"langchain/hub\"\n\nconst model = new ChatOpenAI({\n \
    \ modelName: \"gpt-4o\",\n  openAIApiKey: process.env.OPENAI_API_KEY\n})\n\n//\
    \ ! 为智能体制作工具箱\n// ! 记得运行 'npm install @langchain/community'\nconst wikipediaQuery\
    \ = new WikipediaQueryRun({topKResults: 1}) \nconst calculator = new Calculator()\n\
    const tools = [wikipediaQuery, calculator]\n\n// ! 获取代理规则集\nconst prompt = await\
    \ pull(\"hwchase17/react\")\n```\n\n![](img/index-112_1.png)\n\n// ! 定义 Agent\
    \ 和 AgentExecutor\nconst agent = await createReactAgent({\n  llm: model,\n  tools,\n\
    \  prompt\n})\n\nconst agentExecutor = new AgentExecutor({\n  agent,\n  tools\n\
    })\n\nexport async function POST(req) {\n  const { question } = await req.json()\n\
    \  const response = await agentExecutor.invoke({\n    input: question\n  })\n\
    \  return Response.json({data: response, prompt})\n}\n```\n\n```javascript\n//\
    \ code/agents/src/app/page.js\n'use client'\nimport { useState } from \"react\"\
    \n\nexport default function Home() {\n  const [data, setData] = useState();\n\
    \  const onSubmitHandler = async (e) => {\n    e.preventDefault();\n    const\
    \ question = e.target.question.value;\n    if (question) {\n      const response\
    \ = await fetch(\"api\", {\n        method: \"POST\",\n        body: JSON.stringify({\n\
    \          question,\n        }),\n      });\n      const { data } = await response.json();\n\
    \      setData(data);\n    }\n  };\n\n  return (\n    <>\n      <h1>研究型智能体</h1>\n\
    \      <form onSubmit={onSubmitHandler}>\n        <input name=\"question\" />\n\
    \        <button>提问</button>\n      </form>\n      {data && (\n        <div>\n\
    \          <p>❓ 问题: {data.input}</p>\n          <p># 答案: {data.output}</p>\n \
    \       </div>\n      )}\n    </>\n  );\n}\n```\n\n![](img/index-113_1.png)\n\
    ![](img/index-113_2.png)\n![](img/index-113_3.png)\n\n在此刻，如果我们问智能体“2024 年超级碗冠军是谁？”，它将能够使用工具进行搜索\
    \ img/agents-answer.png)\n\n## 7.3. 监控智能体\n\n智能体非常强大，但也有成本。幸运的是，我们有几种方法可以控制智能体的行为。让我们更新后端以增强监控：\n\
    \n```javascript\n// code/agents/src/api/route.js\nconst agentExecutor = new AgentExecutor({\n\
    \  agent,\n  tools,\n  verbose: true,\n  returnIntermediateSteps: true,\n  maxIterations:\
    \ 4,\n})\n```\n\n对应的前端代码：\n\n```javascript\n// code/agents/src/app/page.js\n{data\
    \ && (\n  <div>\n    <p>❓ 问题: {data.input}</p>\n    <p># 答案: {data.output}</p>\n\
    \    <p>使用的工具: {data.intermediateSteps.map(step => step.action.tool)}</p>\n  </div>\n\
    )}\n```\n\n![](img/index-114_1.png)\n![](img/index-114_2.png)\n![](img/index-114_3.png)\n\
    ![](img/index-114_4.png)\n\n首先，`maxIterations` 选项限制了智能体寻找解决方案的次数。这是一个加速响应并确保我们不会陷入无限循环的好选项。与之前的用例一样，`verbose`\
    \ 选项会在后端控制台中得出结果的推理过程。例如，当询问“PI 的两倍是多少？”时，它会打印类似的内容：\n\n[chain/start] [1:chain:AgentExecutor\
    \ > 18:chain:ReactAgent > 22:prompt:PromptTemplate] Entering Chain run with input:\
    \ {\n\n\"input\": \"What is the double of PI?\",\n\"steps\": [\n\n{\n\n\"action\"\
    : {\n\"tool\": \"wikipedia-api\",\n\"toolInput\": \"PI\",\n\"log\": \"PI 是可以在维基百科上找到的数学常数\\\
    nAction: wikipedia-api\\nAction Input: PI\"\n},\n\n{\n\"action\": {\n\"tool\"\
    : \"calculator\",\n\"toolInput\": \"2*3.14159\",\n\"log\": \"我知道 PI 大约等于 3.14159，所以我可以计算它的两倍\\\
    nAction: calculator\\nAction Input: 2*3.14159\"\n}\n}\n\n],\n\n],\n\n\"content\"\
    : \"I now know the final answer\\nFinal Answer: 6.28318\"\n\n}\n\n第三个选项 `returnIntermediateSteps`（[文档链接](https://js.langchain.com/docs/modules/agents/how_to/max_iterations/)）在这里会打印智能体使用的工具及其顺序。例如，维基百科工具就已经足够回答问题了。\n\
    \n"
