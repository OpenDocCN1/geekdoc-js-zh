    **1.2\. About the author**


    Hi there, friend! I’m Daniel, a software developer and educator.


    I like computers. I try to make them like me back. More than computers I like
    humans. I think every person has value, intelligence, and good inside. I believe
    that education is the key to building a better, stable, and richer world.


    I used to work at companies such as Skil share, Tradeshift and ING, where I had
    a chance to be exposed to completely different types of frontend development in
    various teams.


    Over the past five years, I''ve been writing articles on [js-craft.io](https://www.js-craft.io/)
    about JavaScript, CSS, and other software development topics.


    I''ve always enjoyed teaching, holding both in-class and online classes, and being
    involved in tech education startups.


    You can always reach me a[t daniel@js-craft.io,](mailto:daniel@js-craft.io) and
    read more about me at


    [https://www.js-craft.io/about/](https://www.js-craft.io/about/).


    You can find me also on:


    GitHub: [github.com/daniel-jscraft](https://github.com/daniel-jscraft)


    Twitter: [@js_craft_hq](https://twitter.com/js_craft_hq)


    Mastdotodn: [@daniel_js_craft](https://mastodon.social/@daniel_js_craft)


    YouTube: [@js-craftacademy6740](https://www.youtube.com/@js-craftacademy6740)


    No. 6 / 120


    **1.3\. How this book came to be**


    The first time I wrote a computer program was 26 years ago, in Turbo Pascal.


    To someone who did not know how to code it felt like casting spells. But I understood
    how spells were made. If - then - else statements, functions, variables. This
    was how you make spells.


    The only time I''ve had again this feeling was in 2022 when a friend showed me
    ChatGPT. It felt like some mystical magic. But this time I was not the one who
    was writing the spells. I did not truly understand how that ''AI thing'' was made;
    you couldn''t create it with just the programming I was used to.


    So, I went down to the "learn how AI works" rabbit hole. And oh boy, this was
    a deep one. I was trying to understand this thing from the ground up.


    I was trying to build and train my models from scratch. After some time, my only
    practical project was a [pure JavaScript neuronal network.](https://github.com/daniel-jscraft/Pure-js-neural-network)
    The model was written from scratch and could be trained to detect if a hand-drawn
    shape was a digit.


    I gave up after some time. With al the different architectures, bias neurons,
    training data sets, backpropagation, or gradient descent. It was too much for
    my mediocre brain. The AI thing was a bit more logical and less mystical but I
    was far away from being able to use the new learnings practical y.


    Therefore I went back to my normal job as a web developer. But in the background
    of my mind was stil the feeling that I should stil pay attention to AI. There
    was something there.


    After a while, I was listening to an episode of the excellen[t Latent Space](https://www.latent.space/podcast)


    podcast. I was following [Swan Swyx Wang,](https://www.swyx.io/) the co-founder
    of this podcast from the time he has speaking about React (the JavaScript framework
    not ReAct prompting).


    No. 7 / 120


    In that episode, Swyx mentioned something about LangChain. This LangChain framework
    was made for integrating AI models with "traditional"


    apps. I realized that I did not ful y understand al the inner mechanics of databases,
    or operating systems, but I was using them. Therefore decided to give AI another
    shot. But this time from a more practical angle.


    One book later I can now say that I love LangChain for al it taught me about how
    Large Language Models (LLMs for short) work. The abstractions, the mental models,
    and the use cases of this framework wil teach you a lot about AI models and how
    to use them in conjunction with JavaScript-powered apps.


    LangChain can be seen as the orchestrator that connects nearly everything in the
    AI-Webapp integration system. This makes it an excellent gateway for understanding
    how al the components work together.


    So, let''s learn!


