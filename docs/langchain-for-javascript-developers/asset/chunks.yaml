    **6.1. Introduction**


    Let''s talk about a very important topic in working with LLMs: RAG, which stands
    for Retrieval Augmented Generation.


    RAG is the process of optimizing the output of an LLM by referencing a knowledge
    base outside of its training data sources.


    For example, the knowledge cutoff date for ChatGPT 3.5 Turbo is September 2021\.
    This means that, without external help, the model wil not know what happened after
    this date.


    But what if we need to work with information about LangSmith, a tool developed
    by the same company as LangChain? This new tool was released in 2023, after the
    knowledge cutoff date.


    Or what if we need to make a chatbot that references some internal documents of
    an organization to provide customer support?


    This is where RAG comes in. Using RAG you can connect external data sources like
    CSV files, videos, PDFs, etc. to an LLM and provide external context.


    A few considerations about RAG:


    RAG does not retrain the model. It does not update the weights of the neuronal
    network. It just provides more information for the model to reference.


