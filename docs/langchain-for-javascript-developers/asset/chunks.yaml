    No. 54 / 120\n\n![](index-55_1.png)\n![](index-55_2.png)\n![](index-55_3.png)\n\
    \nFor situations like these, LangChain can help us with the [CommaSeparatedListOutputParser](https://api.js.langchain.com/classes/langchain_core_output_parsers.CommaSeparatedListOutputParser.html).\n\
    \nThe `CommaSeparatedListOutputParser` takes a complex answer given by an LLM\
    \ and reformats it as a standard array of strings. For example, the `AIMessage`\
    \ from the above example wil become:\n\n```javascript\n[\n  'North America',\n\
    \  'Africa',\n  'Australia',\n  'Asia'\n]\n```\n\nMuch, much cleaner! Let's see\
    \ how our backend code wil look after we add this `CommaSeparatedListOutputParser`\
    \ to handle the possible answers for the question:\n\n```javascript\n// code/trivia-game/src/app/api/route.js\n\
    \nimport { ChatOpenAI } from \"@langchain/openai\"\nimport { PromptTemplate }\
    \ from \"@langchain/core/prompts\"\nimport { StringOutputParser } from \"@langchain/core/output_parsers\"\
    \n//! import the CommaSeparatedListOutputParser\nimport { CommaSeparatedListOutputParser\
    \ } from \"@langchain/core/output_parsers\"\n\nconst model = new ChatOpenAI({\n\
    \  openAIApiKey: process.env.OPENAI_API_KEY,\n  //! increase the model temperature\n\
    \  temperature: 0.9\n})\n\n//! ask the model for possible answers\nconst makePossibileAnswers\
    \ = async (question) => {\n\n// No. 55 / 120\n![](index-56_1.png)\n![](index-56_2.png)\n\
    \nconst prompt = PromptTemplate.fromTemplate(\n  `Give 4 possible answers for\
    \ {question}, separated by commas,\n  3 false and 1 correct, in a random order.`\n\
    )\n\n//! apply the CommaSeparatedListOutputParser to the chain\nconst chain =\
    \ prompt\n  .pipe(model)\n  .pipe(new CommaSeparatedListOutputParser())\n\nreturn\
    \ await chain.invoke({question: question})\n}\n\nconst makeQuestion = async ()=>\
    \ {\n  const prompt = PromptTemplate.fromTemplate(\n    `Ask me a trivia question\
    \ about geography.`\n  )\n  const chain = prompt\n    .pipe(model)\n    .pipe(new\
    \ StringOutputParser())\n  return await chain.invoke()\n}\n\nexport async function\
    \ GET() {\n  const question = await makeQuestion()\n  //! once we have the question\
    \ fetch some possible answers\n  const answers = await makePossibileAnswers(question)\n\
    \  return Response.json({question, answers})\n}\n```\n\nNote that we have increased\
    \ the temperature of the model, given that it wil need to be creative when generating\
    \ the possible answers.\n\nWhile you may be tempted to use the [JavaScript `split()`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/split)\
    \ method, think again! What wil happen if we change the LLM and the structure\
    \ of the response changes? This is why LangChain is so powerful! It standardizes\
    \ the way we interact with AI models.\n\nNo. 56 / 120\n\n![](index-57_1.png)\n\
    ![](index-57_2.png)\n![](index-57_3.png)\n![](index-57_4.png)\n\nAt this point,\
