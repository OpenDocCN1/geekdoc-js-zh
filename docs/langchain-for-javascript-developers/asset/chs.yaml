  \  // 并在故事正文中显示响应\n    setStoryBody('')\n    const response = await fetch('api',\
  \ {\n      method: \"POST\",\n      body: JSON.stringify({ storyTitle })\n    })\n\
  \n    const { data } = await response.json()\n    setStoryBody(data)\n  }\n\n  return\
