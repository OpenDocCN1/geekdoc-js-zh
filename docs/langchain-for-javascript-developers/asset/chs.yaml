  \ LangChain 中输出解析器的细节。\n\n我们为什么需要它们？嗯，在与 LLM 交互时，你会发现如果你两次问同一个问题，响应可能不同。此外，输出的格式也可能变化。\n\
  \n例如，如果我们请求某个菜的食谱，有时 LLM 会返回 `Ingredients`（食材）作为第一步，有时则返回 `Preparations`（准备工作）。这是正常的，因为\
  \ LLM 是生成性的，而不是确定性的。这种变性对于人类读者来说可能没问题，但如果我们想让 API 端点来处理这些响应，就会出现问题。\n\n而且当你更改底层\
  \ LLM 模型类型时，情况会变得糟糕。\n\n将输出解析器想象成你的格式化助手。它们可以：\n1. 通过添加前缀或后缀等内容来调整你的提示词（prompt），将输出引导至特定方向。想要\
  \ JavaScript 数组吗？想要简单的字符串或 JSON 嵌套结构吗？LangChain 的输出解析器都能搞定；\n2. 在输出准备好后，一个 JavaScript\
  \ 函数可能会介入进行清理。该函数甚至可以使用其他 LLM 将输出润色为完美的格式。\n\n第 47 / 120 页\n\n![](img/index-48_1.png)\n\
