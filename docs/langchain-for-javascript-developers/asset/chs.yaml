  \ favorite drink is tea.）。我们还需要随着对话的演进来更新消息历史。\n\nNo. 75 / 120\n\n## 5.3. 完整的对话历史\n\
  \n如果你查看对话历史，它就是一个简单的 JavaScript 数组。这意味着我们可以通过向数组推送新项来轻松添加消息：来自用户端的 `HumanMessage`，来自模型的\
  \ `AIMessage`，对话看起来像这样：\n\n```javascript\nchatHistory = [\n  new HumanMessage(`My\
  \ favorite drink is tea.`)\n]\n```\n\n对于这一步，前端不需要更改。\n\n这是后端的完整代码：\n\n```javascript\n\
  import { ChatOpenAI } from \"@langchain/openai\"\nimport { ChatPromptTemplate }\
  \ from \"@langchain/core/prompts\"\nimport { StringOutputParser } from \"@langchain/core/output_parsers\"\
  \n//! 导入 AIMessage 类以存储模型提供的响应\nimport { HumanMessage, AIMessage } from \"@langchain/core/messages\"\
  \nimport { MessagesPlaceholder } from \"@langchain/core/prompts\"\n\nconst model\
  \ = new ChatOpenAI({\n  openAIApiKey: process.env.OPENAI_API_KEY,\n  temperature:\
  \ 0.9,\n})\n\nconst prompt = ChatPromptTemplate.fromMessages([\n  new MessagesPlaceholder(\"\
  chat_history\"),\n  [\"human\", \"{input}\"]\n])\n\nconst outputParser = new StringOutputParser()\n\
  const chain = prompt.pipe(model).pipe(outputParser)\nexport async function POST()\
  \ {\n  //! 更新提示词\n  const question = `Tell me a fact about my favorite drink.\n\
  \  Do not repeat any of the previous facts.`\n  //! 将用户发送的消息添加到历史中\n  chatHistory.push(new\
  \ HumanMessage(question))\n  const fact = await chain.invoke({\n    input: question,\n\
  \    chat_history: chatHistory\n  })\n  //! 存储每个事实以便 LLM 知道不要重复\n  chatHistory.push(new\
  \ AIMessage(fact))\n  return Response.json({data: fact})\n}\n```\n\n每当用户发送一个新问题时，我们将其封装在\
  \ `HumanMessage` 对象中并推送。更重要的是，我们将关于茶的每个事实推送到 `AIMessage` 对象中。\n\n这将允许 LLM 避免重复自己。\n\
  \n这就是我们应用程序最终版本的样子：得益于更新后的对话历史，这里不再有重复。\n\nNo. 78 / 120\n\n![](img/index-79_1.png)\n\
  \n作为一个最后的想法，记住我们可以在 `invoke()` 方法中使用 `sessionId` 配置参数来管理不同主题的多个对话线程：\n\n```javascript\n\
  {\n  configurable: {\n    sessionId: \"id_value_here\"\n  }\n}\n```\n\nOpenAI ChatGPT\
  \ 网页应用的操作方式：\n\n你可以在这里阅读更多详细信息：\n\n[`js.langchain.com/docs/use_cases/chatbots/memory_management/`](https://js.langchain.com/docs/use_cases/chatbots/memory_management/)\n\
  \n[/content]\n\n## 6. RAG /\n\n### 与文档对话\n\n\n\n\n\nNo. 80 / 120\n\n## 6.1. 引言\n\
  \n让我们来聊一个在使用 LLM 时非常重要的话题：`RAG`，它代表“检索增强生成”（Retrieval Augmented Generation）。\n\n\
  `RAG` 是通过引用训练数据源之外的知识库来优化 LLM 输出的过程。\n\n例如，`ChatGPT 3.5 Turbo` 的知识截止日期是 2021 年 9\
  \ 月。这意味着，在没有外部帮助的情况下，模型将不知道此日期之后发生了什么。\n\n但如果我们需要处理关于 `LangSmith` 的信息呢？它是由与 `LangChain`\
  \ 同一家公司开发的工具。这个新工具是在 2023 年发布的，晚于知识截止日期。\n\n或者，如果我们需要创建一个机器人，让它引用组织的一些内部文档来提供客户支持呢？\n\
  \n这就是 `RAG` 大显身手的地方。通过使用 `RAG`，你可以将 `CSV` 文件、视频、`PDFs` 等外部数据源连接到 LLM 并提供外部上下文。\n\
  \n关于 `RAG` 的几点考量：\n\n- `RAG` 不会重新训练模型。它不会更新神经网络的权重。它只是为模型提供了更多的参考信息。\n- 在下一章中，我们将讨论到\
  \ `AI Agents`。虽然 `AI Agents` 可以搜索外部信息，但它们速度更慢、成本更高，并且可能提供不可靠的输出。`AI Agents` 适用于复杂情况以及可以使用各种工具解决的非线性\
  \ if-then-else 案例。\n- 通过 `RAG`，你可以提前执行知识检索过程，并为 `Q&A` 等场景提供快速解决方案。\n\n### 但为什么 `RAG`\
  \ 如此重要？\n\nNo. 81 / 120\n\nLLM 的训练成本非常高。**非常高**！例如，来自 `Meta` 的 `Llama 2` 模型使用了 6000\
  \ 个 `GPUs` 运行了 12 天。训练成本大约为 200 万美元。在绝大多数情况下，你并不想从零开始训练模型。\n\n然而，随着每一分钟的过去，都会产生新的信息/知识。让模型与新信息同步是一场持续的竞赛。\n\
  \n即使是微调也需要花费大量时间。\n\n其他选择是什么？使用 `RAG` 只为我们的 LLM 提供我们所需的知识片段。\n\n`RAG` 节省了时间和金钱，因为不需要训练。\n\
