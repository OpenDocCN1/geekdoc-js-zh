  \ - 庞大的上下文是非常调试的。\n\nNo. 103 / 120\n\n# Agents\nNo. 104 / 120\n\n### 7.1 简介与项目设置\n\
  \n到目前，我们查看了链（chains）。代理（Agents）的区别在于，我们只需要给它们一个目标，它们就会尝试采取行动。与环境交互并做出决策更符合我们对智能的定义。\n\
  \n我们的任务是创建一个帮助记者研究新文章的工具。在本章结束时，我们将构建一个能够从用户读取问题并使用代理进行回答的应用程序。\n\nNo. 105 / 120\n\
  \n我们将从以下状态开始：在前端，让用户输入问题并提交到服务器。当响应到达时，我们将显示内容。\n\n```javascript\n// code/agents/src/app/page.js\n\
  \"use client\";\n\nimport { useState } from \"react\";\n\nexport default function\
  \ Home() {\n  const [data, setData] = useState();\n\n  const onSubmitHandler = async\
  \ (e) => {\n    e.preventDefault();\n    const question = e.target.question.value;\n\
  \    if (question) {\n      const response = await fetch(\"api\", {\n        method:\
  \ \"POST\",\n        body: JSON.stringify({\n          question,\n        }),\n\
  \      });\n      const { data } = await response.json();\n      setData(data);\n\
  \    }\n  };\n\n  return (\n    <>\n      <h1>1 • 文章研究代理</h1>\n      <form onSubmit={onSubmitHandler}>\n\
  \        <input name=\"question\" />\n        <button>提问</button>\n      </form>\n\
  \      <p>{data?.text}</p>\n    </>\n  );\n}\n```\n\nNo. 106 / 120\n![](img/index-107_1.png)\n\
  \n在后端，我们将让 GPT-4 Omni 模型询问用户输入的问题。\n\n```javascript\n// code/agents/src/app/api/route.js\n\
  import { ChatOpenAI } from \"@langchain/openai\"\nimport { PromptTemplate } from\
  \ \"@langchain/core/prompts\"\nimport { StringOutputParser } from \"@langchain/core/output_parsers\"\
  \n\nconst model = new ChatOpenAI({\n  modelName: \"gpt-4o\",\n  openAIApiKey: process.env.OPENAI_API_KEY,\n\
  })\n\nconst prompt = new PromptTemplate({\n  inputVariables: [\"question\"],\n \
  \ template: \"Answer the user {question}\",\n})\n\nconst chain = prompt\n  .pipe(model)\n\
  \  .pipe(new StringOutputParser())\n```\n\n\n\n\n\n```javascript\nexport async function\
  \ POST(req) {\n  const { question } = await req.json()\n  const data = await chain.invoke({\n\
  \    question\n  })\n  return Response.json({data})\n}\n```\n\n我们应用的初始版本似乎运行得非常顺畅。例如，如果我们让它讲一个冷笑话，一切都能按预期工作。\n\
  \n![](img/agents-joke.png)\n\n但如果我们问它“2024 年超级碗赛冠军是谁？”，训练数据集的局限性就开始显现出来。由于该模型的训练数据只包含截至\
  \ 2023 年 10 月的内容，它并不知道答案。\n\n![](img/agents-limit-2023.png)\n\n## 7.2. 创建一个智能体 (Agent)\n\
  \n是时候创建我们的第一个智能体了。为了克服训练数据集带来的局限性，我们将赋予聊天机器人进行在线研究的选项。\n\n为了完成工作，智能体需要访问特定的工具，例如\
  \ Google 或维基百科搜索能力。通过将 GPT 模型与这些工具结合，智能体可以确定实现目标所需的行动。\n\n如果我们查看工具（Tools）文档，可以看到所有可用选项的列表\
  \ [`js.langchain.com/docs/integrations/tools/`](https://js.langchain.com/docs/integrations/tools/)。\n\
  \n![](img/agents-docs-tools.png)\n\n虽然加载所有可用工具可能很有诱力，但为智能体配备必要的工具至关重要。提供过多的选项可能会导致以下一种或多种情况：\n\
  \n- 智能体选择了不合适的工具\n- API 调用成本更高；智能体将使用更多 token，增加网络延迟\n\n对于我们的用例，我们将为智能体配备 2 个工具：一个维基百科搜索工具和一个数学计算器。\n\
  \n```javascript\nconst wikipediaQuery = new WikipediaQueryRun({topKResults: 1})\n\
  const calculator = new Calculator()\nconst tools = [wikipediaQuery, calculator]\n\
  ```\n\n请注意，对于 `Calculator` 工具，你需要安装 `@langchain/community` 包：\n\n```bash\nnpm install\
  \ @langchain/community\n```\n\n![](img/index-111_1.png)\n![](img/index-111_2.png)\n\
  ![](img/index-111_3.png)\n\n等等，什么！？给 AI 模型配数学计算器？嗯，因为神经网络是通过估算来工作的，它们并不擅长数学。它们有极小的概率会在基础数学运算上出错。因此，使用基础数学工具进行这些操作更安全、更快。\n\
  \n此工具集将传递给 AI 智能体。如文档所示，每种智能体类型都有独特的用途：[`js.langchain.com/docs/modules/agents/agent_types/`](https://js.langchain.com/docs/modules/agents/agent_types/)。例如，结构化对话（Structured\
  \ Chat）针对多次交互进行了优化。\n\n我们将采用 `ReAct Agent`，它是最多功能的行动智能体。顺便提一下，`ReAct Agent` 与 JavaScript\
  \ React 框架无关。\n\n后端的完整代码看起来如下：\n\n```javascript\n// code/agents/src/app/page.js\n\
  import { ChatOpenAI } from \"@langchain/openai\"\nimport { WikipediaQueryRun } from\
  \ \"@langchain/community/tools/wikipedia_query_run\"\nimport { createReactAgent,\
  \ AgentExecutor } from \"langchain/agents\"\nimport { Calculator } from \"@langchain/community/tools/calculator\"\
  \nimport { pull } from \"langchain/hub\"\n\nconst model = new ChatOpenAI({\n  modelName:\
  \ \"gpt-4o\",\n  openAIApiKey: process.env.OPENAI_API_KEY\n})\n\n// ! 为智能体制作工具箱\n\
  // ! 记得运行 'npm install @langchain/community'\nconst wikipediaQuery = new WikipediaQueryRun({topKResults:\
  \ 1}) \nconst calculator = new Calculator()\nconst tools = [wikipediaQuery, calculator]\n\
  \n// ! 获取代理规则集\nconst prompt = await pull(\"hwchase17/react\")\n```\n\n![](img/index-112_1.png)\n\
  \n// ! 定义 Agent 和 AgentExecutor\nconst agent = await createReactAgent({\n  llm:\
  \ model,\n  tools,\n  prompt\n})\n\nconst agentExecutor = new AgentExecutor({\n\
  \  agent,\n  tools\n})\n\nexport async function POST(req) {\n  const { question\
  \ } = await req.json()\n  const response = await agentExecutor.invoke({\n    input:\
  \ question\n  })\n  return Response.json({data: response, prompt})\n}\n```\n\n```javascript\n\
  // code/agents/src/app/page.js\n'use client'\nimport { useState } from \"react\"\
  \n\nexport default function Home() {\n  const [data, setData] = useState();\n  const\
  \ onSubmitHandler = async (e) => {\n    e.preventDefault();\n    const question\
  \ = e.target.question.value;\n    if (question) {\n      const response = await\
  \ fetch(\"api\", {\n        method: \"POST\",\n        body: JSON.stringify({\n\
  \          question,\n        }),\n      });\n      const { data } = await response.json();\n\
  \      setData(data);\n    }\n  };\n\n  return (\n    <>\n      <h1>研究型智能体</h1>\n\
  \      <form onSubmit={onSubmitHandler}>\n        <input name=\"question\" />\n\
  \        <button>提问</button>\n      </form>\n      {data && (\n        <div>\n \
  \         <p>❓ 问题: {data.input}</p>\n          <p># 答案: {data.output}</p>\n    \
  \    </div>\n      )}\n    </>\n  );\n}\n```\n\n![](img/index-113_1.png)\n![](img/index-113_2.png)\n\
  ![](img/index-113_3.png)\n\n在此刻，如果我们问智能体“2024 年超级碗冠军是谁？”，它将能够使用工具进行搜索 img/agents-answer.png)\n\
  \n## 7.3. 监控智能体\n\n智能体非常强大，但也有成本。幸运的是，我们有几种方法可以控制智能体的行为。让我们更新后端以增强监控：\n\n```javascript\n\
  // code/agents/src/api/route.js\nconst agentExecutor = new AgentExecutor({\n  agent,\n\
  \  tools,\n  verbose: true,\n  returnIntermediateSteps: true,\n  maxIterations:\
  \ 4,\n})\n```\n\n对应的前端代码：\n\n```javascript\n// code/agents/src/app/page.js\n{data\
  \ && (\n  <div>\n    <p>❓ 问题: {data.input}</p>\n    <p># 答案: {data.output}</p>\n\
  \    <p>使用的工具: {data.intermediateSteps.map(step => step.action.tool)}</p>\n  </div>\n\
  )}\n```\n\n![](img/index-114_1.png)\n![](img/index-114_2.png)\n![](img/index-114_3.png)\n\
  ![](img/index-114_4.png)\n\n首先，`maxIterations` 选项限制了智能体寻找解决方案的次数。这是一个加速响应并确保我们不会陷入无限循环的好选项。与之前的用例一样，`verbose`\
  \ 选项会在后端控制台中得出结果的推理过程。例如，当询问“PI 的两倍是多少？”时，它会打印类似的内容：\n\n[chain/start] [1:chain:AgentExecutor\
  \ > 18:chain:ReactAgent > 22:prompt:PromptTemplate] Entering Chain run with input:\
  \ {\n\n\"input\": \"What is the double of PI?\",\n\"steps\": [\n\n{\n\n\"action\"\
  : {\n\"tool\": \"wikipedia-api\",\n\"toolInput\": \"PI\",\n\"log\": \"PI 是可以在维基百科上找到的数学常数\\\
  nAction: wikipedia-api\\nAction Input: PI\"\n},\n\n{\n\"action\": {\n\"tool\": \"\
  calculator\",\n\"toolInput\": \"2*3.14159\",\n\"log\": \"我知道 PI 大约等于 3.14159，所以我可以计算它的两倍\\\
  nAction: calculator\\nAction Input: 2*3.14159\"\n}\n}\n\n],\n\n],\n\n\"content\"\
  : \"I now know the final answer\\nFinal Answer: 6.28318\"\n\n}\n\n第三个选项 `returnIntermediateSteps`（[文档链接](https://js.langchain.com/docs/modules/agents/how_to/max_iterations/)）在这里会打印智能体使用的工具及其顺序。例如，维基百科工具就已经足够回答问题了。\n\
  \n\n\n\n\n“2024 年超级碗决赛的冠军是谁？”另一方面，“自从巴西赢得世界杯以来已经过了多少年了？”这个问题需要同时使用 `Wikipedia` 和\
  \ `Calculator` 工具。通过此选项，我们可以监控智能体是否正在为任务使用正确的工具（第 116 / 120 页）。\n\n## 7.4. 总结\n\n\
  代理（Agents）和工具使用通常是 `LangChain` 的核心概念。\n\n从高层面上来说，代理涉及使用 LLM 并让它推理应该采取哪些操作，然后执行这些操作。这通常在一个循环中完成，直到\
  \ LLM 认为它已经实现了目标，或者没有其他可以的操作。\n\n工具是语言模型可以采取的操作表示，以及实现这些操作的函数。\n\n代理和工具与代理执行器（agent\
  \ executor）结合使用。这个代理执行器通过一个循环运行，调用 LLM 来确定代理下一步应该尝试使用哪个工具，除非它已经达到了目标。\n\n代理是基于提示（prompts）构建的，正如你从代码中注意到的：\n\
  \n```javascript\nconst prompt = await pull(\"hwchase17/react\")\nconst agent = await\
  \ createReactAgent({\n  llm: model,\n  tools,\n  prompt\n})\n```\n\n有许多类型的代理。你可以在[此页面](https://js.langchain.com/docs/modules/agents/agent_types/)查看目前可用的五种主要代理类型（第\
  \ 118 / 120 页）。\n\n![](img/index-119_1.png)\n\n有些适用于本地模型，有些适用于最新的 OpenAI 模型，有些支持并行函数调用（paral\
  \ el function cal ing），有些支持对话历史。由于其通用的提示词策略，其他代理非常适合使用简单工具和单一输入。\n\n在讨论 AI 代理（AI\
  \ agents）时，请注意还有许多其他主题、概念、技术、提示词和功能。我们在本章中讨论的只是该主题非常简要的介绍（第 119 / 120 页）。\n\n##\
