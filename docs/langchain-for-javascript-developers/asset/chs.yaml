  \n## 7.5. 结语 (#index_split_000.html_p120)\n\n# 1. 引言\n\n## 1.1. 获取书籍更新和代码示例\n\n\
  要获取书籍的最新版本，请通过邮件 `daniel@js-craft.io` 订阅我们的列表。我努力保持书籍的更新。为了获取最新内容，请确保订阅 `daniel@js-craft.io`。\n\
  \n## 1.2. 关于作者\n\n你好，我是 Daniel，一名软件开发者和教育者。我一直喜欢教学。我相信教育是改进软件的关键。\n\n你可以在这里找到我：\n\
  \n- GitHub: `github.com/daniel-nastase`\n- Twitter: `twitter.com/danielnastase`\n\
  - Mastodon: `mastodon.social/@danielnastase`\n- YouTube: `youtube.com/danielnastase`\n\
  \n## 1.3. 本书是如何产生的\n\n我第一次写计算机程序是 26 年前，当时朋友向我展示了 ChatGPT。它感觉就像魔法一样。但这一次我知道它是如何工作的。\n\
  \n于是，我进入了“学习 AI 如何工作”的兔子洞。天哪，这是一个非常深的洞。我正尝试从零开始构建和训练。一段时间后，我唯一的项目是一个[纯神经网络](https://github.com/daniel-nastase/Pure-neural-network)。该模型用于识别手绘形状是否为数字。\n\
  \n一段时间后我放弃了。面对所有不同的架构、神经元、训练数据集、反向传播或梯度下降，这对我那平庸的大脑来说太复杂了。\n\n因此，我回到了我作为 Web 开发者的日常工作中。但在脑海深处，我仍然觉得应该关注\
  \ AI。因此决定再次尝试 AI。但这次是从更实用的角度出发。\n\n## 1.4. 什么是 LangChain\n\nLangChain 是一个旨在简化集成大语言模型（LLM）应用程序创建的框架。\n\
  \nLangChain 在一个框架中提供了所有的 AI 集成构建块。它提供了一个模块化、灵活且可扩展的架构。\n\n你可以将 LangChain 看作 AI 生态系统中几乎所有内容的胶水层。\n\
  \n\n\n\n通过学习 `LangChain`，你将对 AI  way 的结构、工作流和实践有深入的理解。\n\n`LangChain` 的一些用例包括：\n\
  \n- LLM 是在人类编写的非结构化文本上训练的。虽然这对人类交互效果良好，但对于将未格式化的文本发送到 API 可能效果并不佳。API 需要的是类似 `JSON`\
  \ 的结构化数据。\n- `LangChain` 可以格式化 LLM 交互中的输入和输出。\n- LLM 是无状态的。它们不会记得你是谁或你几秒前说了什么。`LangChain`\
  \ 提供对长期和短期记忆的支持。\n- LLM 速度可能慢。`LangChain` 可以在响应生成时进行流式传输，为用户提供快速反馈。\n- LLM 有截止日期。例如，GPT-3.5\
  \ 没有 2021 年之后的训练数据。GPT-4 不知道 2023 年之后的任何信息。通过 LangChain，我们可以创建并管理 AI 代理（Agents），让它们上线、搜索信息并使用工具解析这些信息。\n\
  - 我们可以将多个 LLM 链起来。例如，我们可以使用 Google 的 Gemini 生成文章，然后将文本传递给 Midjourney 为该文章生成图像。\n\
  - LLM 缺乏对内部文档的访问。我们可以使用检索增强生成（`RAG`）为模型提供额外的上下文，使其根据组织的规则和知识与用户交互。`LangChain` 拥有一非常强大的\
  \ RAG 操作工具集。\n- `LangChain` 抽象了上述操作，方便根据需要更换组件。想因为更好或更便宜而使用不同的 LLM 吗？想更改向量数据库来存储嵌入？`LangChain`\
  \ 都能为你解决。\n- `LangChain` 标准化了与 LLM 工作时的通用模式。虽然可以在不使用 `LangChain` 的情况下创建任何应用，但它简化了过程并比手动提示（prompting）好得多。\n\
  - 如果你想深入研究这个主题，我建议收听 Latent Space 播客中关于 `LangChain` 创始人 Harrison Chase 的那集节目。\n\n\
  ## 1.5 本书概述\n\n在本书中，我们将开启一段有趣、实战且务实的 `LangChain` 学习之旅。每个主章节都有一个关联的示例应用程序，该程序会在章节期间逐渐演进。每一步都以易于理解的方式引入新的\
  \ `LangChain` 概念，而不会让你感到压力。本书被刻意分为短小的章节，每章关注不同的主题。\n\n- **第 1 章**：我们将使用一个“故事生成器”（Story\
  \ Generator）应用介绍 `LangChain` 的基础。我们将连接第一个 LLM，并使用提示模板（prompt templates）和链（chains）。我们将深入研究模板、模板组合等内容。\n\
  - **第 2 章**：在第 1 章的基础设置之后，本章将引入流式传输（streaming）的概念。使用同一个“故事生成器”应用，我们将流式传输 LL 的响应以改进用户体验。\n\
  - **第 3 章**：LLM 的挑战之一是它们以非结构化的格式给出响应，因为它们是在人类理解的文本上训练的。在本章中，我们将通过使用 `ChatGPT` 从零创建一个问答游戏（Trivia\
  \ Game）来学习输出解析器（output parsers）。\n- **第 4 章**：记忆模块为 `LangChain` 应用提供了 LLM 记忆。我们可以像\
  \ `ChatGPT` 那样记住当前会话中的过去对话和响应。在本章中，我们将构建一个“事实百科全”（Fact Wiki）应用。\n- **第 5 章**：`LangChain`\
  \ 的关键特性之一是支持 `RAG` - 检索增强生成。在本章中，我们将构建一个根据外部上下文回答问题的聊天机器人（Chat Bot）应用。我们将看到如何从 PDF\
  \ 或在线文档等来源提供数据、什么是嵌入（embeddings）以及向量数据库是如何工作的。\n- **第 6 章**：与链相比，AI 代理（AI agents）更加灵活和多功能，它们帮助你构建复杂的解决方案，并允许访问\
  \ Google 搜索和数学计算器等第三方工具。它们可以在给定情况下决定使用什么适当的工具。\n\n从构建“故事生成器”到创建“问答游戏”以及真实的“聊天机器人应用”，每一章都会逐渐扩展你的理解。到结束时，我们将探索流式传输、输出解析、记忆模块、AI\
  \ 代理和 RAG 能力，赋予你开发复杂解决方案的能力。\n\n## 1.6 要求以及如何使用本书\n\n`LangChain` 提供了 `JavaScript`\
  \ 和 `Python` 两种实现。在本书中，我们的重点放在 `JavaScript` 上。\n\n你会发现，通过跟随书中提供的示例进行编码学习效果最好。我的建议是最初通读每一章，吸收内容以掌握概念。然后在第二遍时，随着进度进行编码。\n\
  \n我们将结合使用 `LangChain`、`React` 和 `Next.js`。虽然要求你对 `React` 有基础了解，但不需要成为专家。设置 `Next.js`\
  \ 的最简单方法是利用 `create-next-app` 工具。\n\n在大多数情况下，我们的工作将仅限于两个文件：\n- `src/app/page.js`\
  \ - 处理前端；其主要功能是显示信息和数据。\n- `src/app/api/route.js` - 管理后端；此文件将处理与 LLM 的 API 交互。\n\
  \n示例将以逐步迭代的方式进行。每次修改将用 `+` 符号标记，并提供修改文件的路径以供参考。例如：\n\n```javascript\n// src/app/page.js\
  \ - 更新文件的路径\n\n// 添加 PromptTemplate 以避免重复 - 文件更改\nimport { PromptTemplate } from\
  \ \"@langchain/core\"\n\n// 创建一个新的 ChatGPT 模型 - 文件更改\nconst model = new ChatGPT({\n\
  \  openApiKey: process.env.OPENAI_API_KEY,\n  temperature: 0.9\n})\n```\n\n请注意，`LangChain`\
  \ 目前正在经历开发且变化迅速。虽然我会努力频繁更新本书，但可能会出现短暂的方法名称或导入语句与最新版本不匹配的情况。如需帮助，请随时通过邮件联系 `daniel@js-craft.io`。\n\
  \n## 2 模型、提示与链\n\n### 2.1 介绍\n\n现在是使用 `LangChain` 和 `JavaScript` 创建我们的第一个应用了。你被分配创建一个名为“故事制作器”（Story\
  \ Maker）的应用。该应用将为儿童故事生成标题。这是应用程序的 UI 样式：\n\n例如，如果我们指定一个独角兽为主角的故事，应用程序将生成这样的故事标题：\n\
  \n“独角兽的魔法冒险”\n\n### 2.2 开始\n\n最简单的方法是使用 `create-next-app` 工具。一旦安装了它，创建一个名为 `story-generator`\
  \ 的项目：\n\n`yarn create next-app`\n\n或者，你可以使用代码示例中的起始代码。只需在示例文件夹内运行 `npm install`。\n\
  \n我们需要安装几个 npm 依赖项：`LangChain` 和 `OpenAI`。进入项目根目录，并在终端中执行以下命令：\n\n```bash\nnpm i\
  \ langchain @langchain/openai\n```\n\n在编写本书时，这些是安装模块的当前版本：\n\n```json\n{\n  \"@langchain/openai\"\
  : \"⁰.0.14\",\n  \"langchain\": \"⁰.1.19\"\n}\n```\n\n\n\n\n请注意，`LangChain` 目前正处于快速发展阶段，随着版本的迭代，某些代码可能会过时。我正努力保持书籍的更新，但如果由于某种原因导致代码报错，退回到这些版本号可能是明智之举。\n\
  \n一旦设置好依赖项，我们将使用 `React` 创建应用程序的前端。\n\n将以下代码插入 `src/App.js`：\n\n```javascript\n\
  // code/story-generator/src/app/page.js\n\nexport default function Home() {\n  const\
  \ onSubmitHandler = async (event)=> {\n    event.preventDefault()\n    const subject\
  \ = event.target.subject.value\n    console.log(subject)\n  }\n\n  return (\n  \
  \  <>\n      <h1>The Story Maker</h1>\n      <em>此应用使用 GPT 模型来为儿童生成故事。</em>\n  \
  \    <form onSubmit={onSubmitHandler}>\n        <label htmlFor=\"subject\">故事的主题:</label>\n\
  \        <input name='subject' placeholder='subject...' />\n        <button>Ask\
  \ AI Model</button>\n      </form>\n    </>\n  )\n}\n```\n\n在此阶段并没有特别显著的特点。它只是一个\
  \ React UI，从文本输入框获取故事主题并将其打印到控制台。\n\n我们将通过在终端中执行以下命令来启动应用：`npm run dev`\n\n这将生成以下输出：\n\
  \n目前，如果用户输入主题，将不会生成故事，因为我们还没有将应用与 `OpenAI` 集成。我们将在下一章解决这个问题。\n\n### 2.3 OpenAI ChatGPT\
  \ 模型的 API key\n\n要使用 OpenAI 的 `ChatGPT` 模型，你需要一个 API key。该 API 是基于订阅制的，可以通过以下 URL\
  \ 生成密钥：`https://platform.openai.com/api-keys`\n\n你可以为账户充值最小金额。例如，编写本书中的所有用例花费了我少于\
  \ 2 美元。\n\n一旦生成了 API key，返回 `Next.js` 项目并将其粘贴到 `.env` 文件中：\n\n```env\n// code/story-generator/.env\n\
  OPENAI_API_KEY='sk-1234567890B2tT4HT3BlbkFJXkATN1arB9DXABkRQ1uj'\n```\n\n此密钥将仅用于我们应用程序的后端部分。要在\
  \ `code/story-generator/src/app/api/route.js` 文件中访问 API key，我们可以写如下代码：\n\n```javascript\n\
  // code/story-generator/src/app/api/route.js\nconsole.log( process.env.OPENAI_API_KEY\
  \ )\n```\n\n密钥稍会被传递给 `LangChain` 模型对象的构造函数。这一步骤将是本书后续章节中每个代码示例的默认流程。\n\n[如果你不想使用\
  \ API key，可以查看此列表](https://js.langchain.com/docs/modules/model_io/models/)，了解 `LangChain`\
  \ 支持的 LLM 并选择一个免费模型。你甚至可以使用免费的 `HuggingFace` token 来避开 `OpenAI` API。\n\n## 2.4.\
  \ 使用 ChatOpenAI LangChain 模型\n\n让我们通过建立与 `OpenAI` LLM 的连接来继续。在应用后端的 `src/app/api/route.js`\
  \ 文件添加以下代码：\n\n```javascript\n// code/story-generator/src/app/api/route.js\nimport\
  \ { ChatOpenAI } from \"@langchain/openai\"\n\nconst model = new ChatOpenAI({\n\
  \  openAIApiKey: process.env.OPENAI_API_KEY,\n  temperature: 0.9\n})\n\nexport async\
  \ function POST(req) {\n  const { subject } = await req.json()\n  const gptResponse\
  \ = await model.invoke(subject)\n  return Response.json({data: gptResponse})\n}\n\
  ```\n\n要与 `OpenAI` 建立连接，创建一个 `ChatOpenAI` 对象的实例实例。在其构造函数中，我们定义了以下内容：设置为 `0.9` 的\
  \ `temperature` 参数；以及上一节获取的 API key。\n\n你可能对这个 `temperature` 参数好奇，对吧？`temperature`\
  \ 参数影响模型的想象力。增加它会产生更具创造性的输出，而降低它则会让响应更贴实、更事实。坚持事实可以减少模型潜在的不准确性或幻觉。\n\n选择合适的 `temperature`\
  \ 取决于任务。对于脑风暴吸引人的故事标题，较高的温度更为理想。对于准确性至关重要的任务（如总结法律文件），较低的温度更好。\n\n设置好 `temperature`\
  \ 后，现在让我们更新应用的前端：\n\n```javascript\n// code/story-generator/src/app/page.js\nexport\
  \ default function Home() {\n  const onSubmitHandler = async (event) => {\n    event.preventDefault()\n\
  \    const subject = event.target.subject.value\n    // 使用 subject 调用 LLM\n  }\n\
  \  // ...\n}\n```\n\n设置好温度后……“艾莎是《冰雪奇缘》的主角角。她是阿伦德尔的女王，拥有创造冰雪的魔法能力。”\n\n请注意，你的答案可能会有些不同。与经典方式相反，LLM\
  \ 可以对相同的输入给出不同的输出。例如，请求如：“给我讲一个关于猫的故事标题。”\n\n### 2.5. 提示词模板 (Prompt templates)\n\
  \n你很快会发现提示词需要重复输入，例如“给我讲一个关于”后面跟着主题。这种冗余可以通过模板解决，我们稍后探讨。\n\n在进入下一章之前，让我们对应用进行一个小调整。使用状态变量在\
  \ UI 中显示 LLM 给出的故事标题。\n\n```javascript\n// code/story-generator/src/app/page.js\n\
  'use client'\nimport { useState } from \"react\"\n\nexport default function Home()\
  \ {\n  const [storyTitle, setStoryTitle] = useState()\n  const onSubmitHandler =\
  \ async (e) => {\n    e.preventDefault()\n    const subject = e.target.subject.value\n\
  \    const response = await fetch('api', {\n      method: \"POST\",\n      body:\
  \ JSON.stringify({ subject })\n    })\n    const { data } = await response.json()\n\
  \    setStoryTitle(data)\n  }\n\n  return (\n    <>\n      <h1>The Story Maker</h1>\n\
  \      <em>此应用使用 GPT 模型来为儿童生成故事。</em>\n      <form onSubmit={onSubmitHandler}>\n\
  \        <label htmlFor=\"subject\">故事的主题:</label>\n        <input name='subject'\
  \ placeholder='subject...' />\n        <button>Ask AI Model</button>\n      </form>\n\
  \      {/* 在 UI 中显示故事标题 */}\n      <p>{ storyTitle }</p>\n    </>\n  )\n}\n```\n\
  \n这就是更改后 UI 将呈现的样子：\n\n现在让我们回到本章的核心内容：提示词模板。语言模型使用文本作为输入。这些文本被称为提示词（prompt）。不过，它不仅仅是一个固定的字符串。通常情况下，它是模板、示例和用户添加内容的混合。\n\
  \n通过模板，我们可以简化提示词流程，确保用户不需要每次请求都重复输入相同的前缀。\n\n对于我们特定的用例，提示词模板看起来如下：\n\n`Tell me a\
  \ story title about {subject}` 我们是我们需要做的机会都在后端：\n\n```javascript\n// code/story-generator/src/app/api/route.js\n\
  import { ChatOpenAI } from \"@langchain/openai\"\n// 我们将使用 PromptTemplate 来避免重复\n\
  ```\n\n\n\n\n```javascript\nimport { PromptTemplate } from \"@langchain/core/prompts\"\
