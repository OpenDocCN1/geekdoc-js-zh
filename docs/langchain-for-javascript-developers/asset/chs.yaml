  \ 接收模型输出并将其转换为简单的字符串。这是最易使用的解析器。让我们看看实际样子：\n\n```javascript\nconst prompt = PromptTemplate.fromTemplate(\n\
  \  `问我一个关于地理的问答问题.`\n)\n\nconst chain = prompt.pipe(model)\n\nconst gptResponse\
  \ = await chain.invoke()\n\nconsole.log(gptResponse)\n```\n\n如果我们打印 `gptResponse`，它看起来像：\n\
