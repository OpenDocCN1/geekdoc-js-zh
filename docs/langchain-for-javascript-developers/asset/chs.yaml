  \  return Response.json({data:gptResponse})\n}\n```\n\n## 3.3 流式响应\n\n在某些情况下，AI\
  \ 模型可能需要几秒钟来生成完整的提示响应。这比应用程序感觉流畅的 200-300 毫秒阈值慢。\n\n为了让应用程序感觉流畅，我们需要显示中间进度并分块流式输出，一旦块可用立即产生。并不是所有模型都支持流式传输，因此请确保你使用的模型支持此功能。\n\
  \n是时候为我们的故事生成器应用添加流式功能了。注意，这不是单一的请求-响应交互。它更像是一个持续对话。前端将不断请求新的 LLM 响应块并更新结果，而后端将返回响应块并指示流何时结束。\n\
  \n我们将从后端开始。更改将在上一步中定义的 `streamStory()` 方法中完成：\n\n```javascript\n// code/streaming/src/app/route.js\n\
  // 其他部分保持不变\n\n// ...\n\nconst streamStory = async (storyTitle)=> {\n  const encoder\
  \ = new TextEncoder()\n  const stream = new TransformStream()\n  const writer =\
  \ stream.writable.getWriter()\n  const model = new ChatOpenAI({\n    openAIApiKey:\
  \ process.env.OPENAI_API_KEY,\n    temperature: 0.9,\n    streaming: true,\n   \
  \ callbacks: [{\n      handleLLMNewToken: async (token) => {\n        await writer.ready\n\
  \        await writer.write(encoder.encode(`${token}`))\n      },\n      handleLLMEnd:\
  \ async () => {\n        await writer.ready\n        await writer.close()\n    \
  \  }\n    }]\n  })\n  const prompt = new PromptTemplate({\n    inputVariables: [\
  \ \"storyTitle\" ],\n    template: \"告诉我一个标题为 {storyTitle}的故事\"\n  })\n  const chain\
  \ = prompt.pipe(model)\n  chain.invoke({storyTitle})\n  return new NextResponse(stream.readable,\
  \ {\n    headers: { \"Content-Type\": \"text/event-stream\" }\n  })\n}\n```\n\n\n\
  \n\n此外，在前端，我们将修改单个方法：`startStoryStream()`：\n\n```javascript\n// code/streaming/src/app/page.js\n\
  \n// 其他部分保持不变\n\n// ...\n\nconst startStoryStream = async ()=> {\n  setStoryBody('')\n\
  \  const response = await fetch('api', {\n    method: \"POST\",\n    body: JSON.stringify({\
  \ storyTitle })\n  })\n  //! reader 将充当数据通信“管道”\n  const reader = response.body.getReader()\n\
  \  const decoder = new TextDecoder()\n  //! 在我们不断接收新的响应块时保持连接\n  while (true) {\n\
  \    const { value, done } = await reader.read()\n    if (done) break\n    const\
  \ chunkValue = decoder.decode(value)\n    //! 向 React 状态字符串值追加文本的方法\n    setStoryBody(prev\
  \ => prev + chunkValue)\n  }\n}\n\n// 其他部分保持不变\n// ...\n```\n\n第 44 / 120 页\n\n\
