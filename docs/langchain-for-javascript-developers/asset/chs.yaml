  \ 2.7. LCEL - LangChain 语言\n\nLangChain 语言（简称 LCEL）提供了一种更简单的方法来链接多个节点。简而言之，使用 LCEL，我们可以用\
  \ `.pipe()` 方法替换其他类（如 `LLMChain`）。让我们再次查看：\n\n```javascript\nconst model = new ChatOpenAI({\n\
  \  openAIApiKey: process.env.OPENAI_API_KEY,\n  temperature: 0.9\n})\n\nconst prompt\
  \ = new PromptTemplate({\n  inputVariables: [\"subject\"],\n  template: \"Tell me\
  \ a story title about {subject}\"\n})\n\n// 之前\nconst chain = new LLMChain({\n \
  \ llm: model,\n  prompt,\n})\nawait chain.invoke({subject})\n\n// 之后\nconst chain\
  \ = prompt.pipe(model)\nawait chain.invoke({subject})\n```\n\nLCEL 的核心元素是 `RunnableInterface`。它确保链中的节点具有通用模式。LCEL\
  \ 标准化了通信并允许在 LangChain 框架内轻松切换组件。所有的组件都是模块化的。如果需要更改某些内容，只需替换该部分而不是整个流水线。本书中的许多示例将使用\
  \ LCEL 制作。\n\nNo. 31 / 120 这标志着我们使用 JavaScript、LangChain 和 ChatGPT 的第一个小应用的结束。\n\
  \n我们学会了如何：\n\n- 初始化并连接 Web 应用到 LLM。\n- 利用 LangChain 的 prompt 模板防止重复并创建我们的第一个链。\n\
  \n\n\n\n\n在下一章节中，我们将扩展此应用程序以生成实际的故事正文并集成数据流。\n\n# 3. LangChain 中的流\n\n## 3.1 简介与项目设置\n\
  \n大语言模型（LLM）生成某些答案可能需要很长时间。例如，当你要求模型编写像诗或总结文档之类的复杂回复时。\n\n考虑到 LLM 的工作方式，我们不需要等待整个回答完成。你是否注意到当你向\
  \ ChatGPT 提问时，你会看到那种“打字机效果”，即每个单词逐渐出现在屏幕上？\n\n大语言模型的推理方式并不像人类。它不是先构建一个完整的回答，然后进行解释。它也不会将答案映射到知识图谱或类似的结构。它只是一次向答案添加一个\
  \ token（标记）。\n\n这非常棒，因为我们可以利用这种流式行为，在有新信息要展示给用户时立即更新 UI。\n\n回到故事生成器示例，假设我们想创建一个名为《银色精灵的秘密》的故事。与其等待整个故事生成，我们可以在故事编写的同时对其进行流式传输：\n\
  \n从前以前\n\n...\n\n...\n\n从前，在一个神秘的森林里\n\n...\n\n...\n\n从前，在一个深藏于山中的神秘森林里\n\n...\n\
  \n...\n\n从前，在一个深藏于山中的神秘森林里，住着一个银色精灵族。\n\n在本章中，我们将实现流式功能。这是应用程序 UI 最终的样式：\n\n## 3.2\
  \ 项目重构\n\n在继续之前，我们首先需要对项目进行重构。\n\n在前端，我们将执行以下操作：\n\n1. 一旦我们有了故事标题，我们将将其作为按钮显示，文本为`告诉我关于\
  \ <<这里是故事名称>>的故事`\n2. 当按下此按钮时，我们将调用后端，传递故事名称并打印响应\n\n代码代码将如下所示：\n\n```javascript\n\
  // code/streaming/src/app/page.js\n\n'use client'\n\nimport { useState } from \"\
