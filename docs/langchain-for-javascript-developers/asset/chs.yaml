  \ = prompt\n    .pipe(model)\n    .pipe(new StringOutputParser())\n\n  return await\
  \ chain.invoke()\n}\n\nexport async function GET() {\n  //! 将制作问题的部分提取到方法中\n  const\
  \ question = await makeQuestion()\n  return Response.json({question})\n}\n```\n\n\
