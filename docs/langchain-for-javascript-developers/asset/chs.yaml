  \n对话内存功能允许大语言模型（LLM）记住之前与用户的交互内容。对话内存是聊天机器人能够以对话方式响应多个查询的关键。如果没有它，每个查询都将被视为单个输入。只有当追问引用之前的问题和答案时，追问才才有意义。例如，如果我只对\
  \ LLM 说 `Explain in detail`（详细解释），它会要求更多上下文。\n\n默认情况下，LLM 是无状态的。每个传入的查询都是与其他交互独立处理的。对于无状态实体来说，唯一存在的是当前输入，别无其他。\n\
  \n你正在为一家茶馆工作，被指派创建一个 GPT 驱动的应用程序，为用户提供关于茶的趣知识。以下是应用程序最终版本的预览：\n\n![](img/index-69_1.png)\n\
  \n我们将从以下设置开始。\n\n在前端，我们有一个按钮，它向 API 发送 POST 请求并打印答案：\n\n```javascript\n// code/tea-wiki/src/app/page.js\n\
  'use client'\nimport { useState } from \"react\"\n\nexport default function Home()\
  \ {\n  const [answer, setAnswer] = useState()\n\n  const tellFact = async ()=> {\n\
  \    const response = await fetch('api', {\n      method: \"POST\"\n    })\n   \
