    : {\n    \"@type\": \"Person\",\n    \"name\": \"John Doe\"\n  },\n  \"datePublished\"\
    : \"2023-01-15\",\n  \"description\": \"A mouthwatering pancake recipe.\",\n \
    \ \"image\": \"https://example.com/pancakes.jpg\",\n  \"recipeIngredient\": [\n\
