    \ parent\"\n```\n\n在示例 6 中，我们将 `child` 的 `__proto__` 属性设置为 `parent`。\n\n### 使用原型创建对象\n\
    \n我们可以使用构造函数或类来创建共享原型的对象。\n\n```javascript\n// 示例 7: 使用原型创建对象（使用构造函数）\n\nfunction\
