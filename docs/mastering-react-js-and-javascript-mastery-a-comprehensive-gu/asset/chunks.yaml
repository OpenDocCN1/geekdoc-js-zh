    \ (\n    <Router>\n      <div>\n        <nav>\n          <ul>\n            <li>\n\
    \              <Link to=\"/\">Home</Link>\n            </li>\n            {users.map((user)\
    \ => (\n              <li key={user.id}>\n                <Link to={`/user/${user.id}`}>{user.name}</Link>\n\
    \              </li>\n            ))}\n          </ul>\n        </nav>\n     \
    \   <Route path=\"/\" exact component={Home} />\n        <Route path=\"/user/:id\"\
