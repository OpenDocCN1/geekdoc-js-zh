    In this component, we check if the `tasks` array has items. If it does, we render
    the list of tasks; otherwise, we display a message indicating that there are no
    tasks to show.


    ## Advanced List Operations


    Working with lists in React often involves more than just rendering. You may also
    need to perform operations like filtering, sorting, and updating lists dynamically.
    Here are some advanced list operations in React:


    ### Filtering a List


    Filtering a list involves displaying only the items that meet certain criteria.
    You can use JavaScript''s `filter` method to filter an array of data and then
    render the filtered list.


    ```jsx


    class FilteredListExample extends React.Component {


    render() {


    const users = [


    { id: 1, name: ''Alice'', isAdmin: true },


    { id: 2, name: ''Bob'', isAdmin: false },


    { id: 3, name: ''Charlie'', isAdmin: true },


    { id: 4, name: ''David'',


    isAdmin: false },


    ];


    const adminUsers = users.filter((user) => user.isAdmin);


    const userList = adminUsers.map((user) => (


    <li key={user.id}>{user.name}</li>


    ));


    return (


    <div>


    <ul>{userList}</ul>


    </div>


    );


    }


    }


    ```


    In this example, we filter the `users` array to get only the admin users and then
    render the list of admin users.


    ### Sorting a List


    Sorting a list involves arranging the items in a specific order, such as alphabetically
    or by a certain attribute. You can use JavaScript''s `sort` method to sort an
    array of data and then render the sorted list.


    ```jsx


    class SortedListExample extends React.Component {


    render() {


    const names = [''Alice'', ''David'', ''Charlie'', ''Bob''];


    const sortedNames = names.slice().sort();


    const nameList = sortedNames.map((name, index) => (


    <li key={index}>{name}</li>


    ));


    return (


    <div>


    <ul>{nameList}</ul>


    </div>


    );


    }


    }


    ```


    In this example, we create a copy of the `names` array using `slice()` to avoid
    mutating the original array, then sort the copy alphabetically before rendering
    it.


    ### Updating Lists Dynamically


    Updating a list dynamically involves adding, removing, or modifying items within
    a list. To update a list in React, you typically use state to store the list data
    and update the state when changes occur. React will then re-render the component
    with the updated list.


    Here''s an example where you can add new tasks to a list:


    ```jsx


    class DynamicListExample extends React.Component {


    constructor(props) {


    super(props);


    this.state = {


    tasks: [],


    newTask: '''',


    };


    }


    handleInputChange = (event) => {


    this.setState({ newTask: event.target.value });


    };


    addTask = () => {


    const { tasks, newTask } = this.state;


    if (newTask.trim() !== '''') {


    this.setState({


    tasks: [...tasks, { id: Date.now(), title: newTask }],


    newTask: '''',


    });


    }


    };


    render() {


    const { tasks, newTask } = this.state;


    const taskList = tasks.map((task) => (


    <li key={task.id}>{task.title}</li>


    ));


    return (


    <div>


    <div>


    <input


    type="text"


    placeholder="Enter a new task"


    value={newTask}


    onChange={this.handleInputChange}


    />


    <button onClick={this.addTask}>Add Task</button>


    </div>


    {tasks.length > 0 ? (


    <ul>{taskList}</ul>


    ) : (


    <p>No tasks to display.</p>


    )}


    </div>


    );


    }


    }


    ```


    In this example, we maintain a `tasks` array in the component''s state. When the
    user enters a new task and clicks the "Add Task" button, we add the task to the
    `tasks` array by updating the state. React then re-renders the component with
    the updated list.


    ## Conclusion and Best Practices


    Conditional rendering and working with lists are fundamental skills in React for
    creating dynamic and data-driven user interfaces. Here are some best practices
    to keep in mind:


    1\. **Use Keys for List Items**: When rendering lists, always assign unique keys
    to list items to help React efficiently update and reorder elements.'
