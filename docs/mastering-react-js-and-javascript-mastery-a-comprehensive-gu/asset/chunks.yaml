    # # Chapter 5: Objects and Prototypes


    In Chapter 4, we explored functions and scope, which are essential building blocks
    of JavaScript programming. Now, we will delve into objects and prototypes, another
    fundamental aspect of JavaScript. Objects allow us to group related data and functions
    together, providing a more organized way to represent real-world entities. Prototypes
    enable object inheritance, facilitating code reusability and maintaining a clear
    structure. Understanding objects and prototypes is crucial for becoming a proficient
    JavaScript developer. Let''s dive in and explore the world of objects and prototypes!


    ## Objects: Bundling Data and Functions


    In JavaScript, objects are composite data types that allow us to represent entities
    with properties (data) and methods (functions) associated with them. Objects provide
    an excellent way to organize related data and behavior together, making the code
    more structured and readable.


    ### Object Literals:


    The simplest way to create an object is by using object literals, denoted by curly
    braces `{}`.


    ```javascript


    // Example 1: Object literal


    const person = {


    name: "John Doe",


    age: 30,


    occupation: "Software Engineer",


    greet: function() {


    console.log("Hello, I am " + this.name);


    }


    };


    ```


    In Example 1, we define an object `person` with properties `name`, `age`, and
    `occupation`, along with a method `greet()` that prints a greeting.


    ### Accessing Object Properties:


    We can access object properties using dot notation or square brackets notation.


    ```javascript


    // Example 2: Accessing object properties


    console.log(person.name); // Output: "John Doe"


    console.log(person["age"]); // Output: 30


    ```


    In Example 2, we access the `name` property using dot notation and the `age` property
    using square brackets notation.


    ### Adding and Modifying Object Properties:


    We can add new properties or modify existing properties of an object at runtime.


    ```javascript


    // Example 3: Adding and modifying object properties


    person.location = "New York";


    person.age = 31;


    console.log(person); // Output: { name: ''John Doe'', age: 31, occupation: ''Software
    Engineer'', greet: [Function] }


    ```


    In Example 3, we add the `location` property and modify the `age` property of
    the `person` object.


    ### Object Methods:


    Objects can also contain methods, which are functions associated with the object.


    ```javascript


    // Example 4: Object methods


    person.sayHello = function() {


    console.log("Hello, I am " + this.name);


    };


    person.sayHello(); // Output: "Hello, I am John Doe"


    ```


    In Example 4, we add a new method `sayHello()` to the `person` object and call
    it to print a greeting.


    ## Prototypes: Inheriting and Sharing Behavior


    Prototypes play a significant role in JavaScript''s object-oriented nature. They
    allow objects to inherit properties and methods from other objects, enabling code
    reusability and a clear inheritance structure.


    ### Prototype Chain:


    Every object in JavaScript has a prototype, which is another object from which
    it inherits properties and methods. This forms a chain of prototypes, known as
    the prototype chain.


    ```javascript


    // Example 5: Prototype chain


    const parent = {


    parentProp: "I am from parent"


    };


    const child = {


    childProp: "I am from child"


    };


    Object.setPrototypeOf(child, parent);


    console.log(child.childProp); // Output: "I am from child"


    console.log(child.parentProp); // Output: "I am from parent"


    ```


    In Example 5, we create two objects, `parent` and `child`. By using `Object.setPrototypeOf()`,
    we set the prototype of `child` to `parent`, forming a prototype chain. Now, `child`
    can access properties from `parent`.


    ### The `__proto__` Property:


    Each object in JavaScript has a `__proto__` property that points to its prototype.


    ```javascript


    // Example 6: The __proto__ property


    const parent = {


    parentProp: "I am from parent"


    };


    const child = {


    childProp: "I am from child"


    };


    child.__proto__ = parent;


    console.log(child.childProp); // Output: "I am from child"


    console.log(child.parentProp); // Output: "I am from parent"


    ```


    In Example 6, we set the `__proto__` property of `child` to `parent`, creating
    the prototype chain.


    ### Creating Objects with Prototypes:


    We can create objects with a shared prototype using constructors or classes.


    ```javascript


    // Example 7: Creating objects with prototypes (using constructors)


    function Person(name, age) {


    this.name = name;


    this.age = age;


    }


    Person.prototype.sayHello = function() {


    console.log("Hello, I am " + this.name);


    };


    const john = new Person("John Doe", 30);


    john.sayHello(); // Output: "Hello, I am John Doe"


    ```


    In Example 7, we define a constructor function `Person` to create `Person` objects.
    We add a method `sayHello()` to the prototype of `Person`, which can be accessed
    by all `Person` objects.


    ### ES6 Classes:


    With the introduction of ES6, JavaScript provides a more intuitive way to create
    objects with shared prototypes using classes.


    ```javascript


    // Example 8: Creating objects with prototypes (using classes)


    class Animal {


    constructor(name) {


    this.name = name;


    }


    makeSound() {


    console.log(this.name + " makes a sound");


    }


    }


    const cat = new Animal("Cat");


    cat.makeSound(); // Output: "Cat makes a sound"


    ```


    In Example 8, we define a class `Animal` with a constructor and a method `makeSound()`.
    We then create an object `cat` based on this class.


    ### Inheritance with Prototypes:


    We can achieve inheritance by setting the prototype of one object to be another
    object, creating a parent-child relationship.


    ```javascript


    // Example 9: Inheritance with prototypes


    function Shape() {}


    Shape.prototype.draw = function() {


    return "Drawing a shape";


    };


    function Circle(radius) {


    this.radius = radius;


    }


    Circle.prototype = Object.create(Shape.prototype);


    Circle.prototype.constructor = Circle;


    Circle.prototype.draw = function() {


    return "Drawing a circle with radius " + this.radius;


    };


    const circle = new Circle(5);


    console.log(circle.draw()); // Output: "Drawing a circle with radius 5"'
