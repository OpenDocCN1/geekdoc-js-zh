    { id: 1, name: ''Alice'' },


    { id: 2, name: ''Bob'' },


    { id: 3, name: ''Charlie'' },


    { id: 4, name: ''David'' },


    ];


    const userList = users.map((user) => (


    <li key={user.id}>{user.name}</li>


    ));


    return (


    <div>


    <ul>{userList}</ul>


    </div>


    );


    }


    }


    ```


    In this updated example, we use the `id` property of each user object as the key
    for the list items, ensuring a stable and unique identifier for each item.


    ### Conditional Rendering of Lists


    Conditional rendering and list rendering often go hand in hand when building dynamic
    interfaces. You may need to conditionally display a list of items based on certain
    conditions. Here''s an example where we render a list of tasks only if there are
    tasks to display:


    ```jsx


    class ConditionalListRenderingExample extends React.Component {


    render() {


    const tasks = this.props.tasks;


    return (


    <div>


    {tasks.length > 0 ? (


    <ul>


    {tasks.map((task) => (


    <li key={task.id}>{task.title}</li>


    ))}


    </ul>


    ) : (


    <p>No tasks to display.</p>


    )}


    </div>


    );


    }


    }


