    \  i++;\n} while (i < 5);\n```\n\n在示例 17 中，`do...while` 循环至少执行一次大括号内的代码，因为条件是在第一次迭代后检查的。\n\
    \n### break 和 continue 语句\n\n`break` 语句允许在满足特定条件时提前退出循环。`continue` 语句允许你跳过当前迭代的剩余部分并进入下次迭代。\n\
    \n```javascript\n// Example 18: Using the break and continue statements\n\nfor\
    \ (let i = 1; i <= 10; i++) {\n  if (i === 5) {\n    break;\n  }\n  if (i ===\
    \ 3) {\n    continue;\n  }\n  console.log(i);\n}\n```\n"
