    \ 数组中每个元素的平方。\n\n### 过滤数组元素：\n\n- `filter()`：创建一个新数组，其中包含通过提供函数实现的测试的元素。\n\n```javascript\n\
    // Example 17: 过滤数组元素\n\nconst numbers = [1, 2, 3, 4, 5];\n\nconst evenNumbers\
    \ = numbers.filter((num) => num % 2 === 0);\n\nconsole.log(evenNumbers); // 输出:\
    \ [2, 4]\n```\n\n在示例 17 中，我们使用 `filter()` 创建了一个新数组，其中只包含 `numbers` 数组中的偶数。\n\n\
    ### 减少数组元素：\n\n- `reduce()`：在数组的每个元素上执行还原器函数，结果是一个单一输出值。\n\n```javascript\n//\
    \ Example 18: 减少数组元素\n\nconst numbers = [1, 2, 3, 4, 5];\n\nconst sum = numbers.reduce((acc,\
    \ num) => acc + num, 0);\n\nconsole.log(sum); // 输出: 15\n```\n\n在示例 18 中，我们使用\
    \ `reduce()` 计算 `numbers` 数组中所有元素的总和。\n\n## 结论：\n\n在本章中，我们探索了 JavaScript 中的数组和数组方法。数组是元素的集合，可以存储不同的数据类型，为处理项目列表提供了一种通灵活的方法。我们学习了如何创建数组、访问和修改其元素，以及使用循环对其进行迭代。此外，我们还探索了各种数组方法，包括添加和删除元素、搜索元素、切片数组、合并数组、映射和过滤数组元素以及减少数组元素。\n\
    \n数组和数组方法是 JavaScript 中强大的工具，允许我们高效地处理和操作数据。通过数组，我们可以将数据组织成结构化的列表，使处理项目集合变得更容易。数组方法使我们能够在数组上执行复杂操作并转换数据以满足我们的特定需求。\n\
    \n# 第 7 章：DOM 操作与事件\n\n在第 6 章中，我们探索了数组和数组方法，这让我们能够有效地处理数据集合。现在，我们将深入研究 JavaScript\
    \ 中的 DOM（文档对象模型）操作和事件。DOM 是 HTML 和 XML 文档的编程接口，将 Web 页面的结构表示为对象树。JavaScript 允许我们操作\
    \ DOM，使网页具有动态性和交互性。理解 DOM 操作和处理事件对于构建交互式且响应式的 Web 应用程序至关重要。让我们深入探索 DOM 操作和事件的世界吧！\n\
    \n## DOM：文档对象模型\n\n文档对象模型 (DOM) 是 HTML 和 XML 文档的编程接口，提供了网页的结构化表示。DOM 将网页上的元素表示为对象，允许我们使用\
    \ JavaScript 访问、修改和操作它们。\n\n### 访问 DOM 元素：\n\n我们可以使用 JavaScript 提供的各种方法访问 DOM\
    \ 元素，例如 `getElementById()`、`getElementsByClassName()`、`getElementsByTagName()`\
    \ 和 `querySelector()`。\n\n```html\n<!-- 示例 HTML -->\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>DOM 操作</title>\n</head>\n<body>\n<h1 id=\"title\">欢迎来到 DOM 操作！</h1>\n\
    <p class=\"content\">这是一个段落。</p>\n<ul>\n<li>项目 1</li>\n<li>项目 2</li>\n<li>项目 3</li>\n\
    </ul>\n</body>\n</html>\n```\n\n```javascript\n// 示例 JavaScript\nconst titleElement\
    \ = document.getElementById(\"title\");\nconst contentElements = document.getElementsByClassName(\"\
    content\");\nconst liElements = document.getElementsByTagName(\"li\");\nconst\
    \ firstLiElement = document.querySelector(\"li\");\n```\n\n在上面的示例中，我们使用不同的 DOM\
    \ 方法通过 ID `\"title\"`、类名 `\"content\"`、标签名 `\"li\"` 以及第一个 `\"li\"` 元素访问了 DOM 元素。\n\
    \n### 修改 DOM 元素：\n\n一旦我们访问了 DOM 元素，就可以使用 JavaScript 修改它们的属性、特征值和内容。\n\n```javascript\n\
    // 示例 JavaScript\ntitleElement.innerHTML = \"新标题\";\ncontentElements[0].style.color\
    \ = \"red\";\nliElements[2].textContent = \"已更新的项目 3\";\nfirstLiElement.classList.add(\"\
    active\");\n```\n\n在上面的示例中，我们修改了各种 DOM 元素的 `innerHTML`、`style.color`、`textContent`\
    \ 和 `classList` 属性。\n\n## 处理事件：\n\n事件发生在 Web 页面上的动作，例如点击按钮、悬停在元素上或提交表单。JavaScript\
    \ 允许我们处理这些事件并在事件发生时执行特定代码。\n\n### 事件监听器：\n\n我们可以为 DOM 元素添加事件监听器以监听特定事件并执行相应的函数。\n\
    \n```html\n<!-- 示例 HTML -->\n<button id=\"btn\">点击我</button>\n```\n\n```javascript\n\
    // 示例 JavaScript\nconst buttonElement = document.getElementById(\"btn\");\nbuttonElement.addEventListener(\"\
    click\", function() {\nconsole.log(\"按钮被点击了!\");\n});\n```\n\n在上面的示例中，我们为按钮元素添加了点击事件监听器，当按钮被点击时，就会执行指定的函数。\n\
    \n### 常见 DOM 事件：\n\n有很多事件可以处理 Web 上的不同交互：\n\n- `click`：当点击元素时发生。\n- `mouseover`：当鼠标悬在元素上时发生。\n\
    - `mouseout`：鼠标离开元素时发生。\n- `keyup`：当释放按键时发生。\n- `submit`：当提交表单时发生。\n- `change`：当输入元素的值改变时发生。\n\
    \n```javascript\n// 示例 JavaScript\nconst inputElement = document.getElementById(\"\
    input\");\ninputElement.addEventListener(\"change\", function() {\nconsole.log(\"\
    输入已改变!\");\n});\n```\n\n在上面的示例中，我们为输入元素添加了 `change` 事件监听器。\n\n### 事件传播：冒泡与捕获\n\
    \nDOM 中的事件遵循一个被称为事件传播的过程，它包括两个阶段：捕获和冒泡。在捕获阶段，事件在到达目标元素之前在祖先元素触发。在冒泡阶段，事件在目标元素上触发并传播到其祖先元素。\n\
    \n```html\n<!-- 示例 HTML -->\n<div id=\"outer\">\n<div id=\"inner\">\n点击我\n</div>\n\
    </div>\n```\n\n```javascript\n// 示例 JavaScript\nconst outerElement = document.getElementById(\"\
    outer\");\nconst innerElement = document.getElementById(\"inner\");\n\nouterElement.addEventListener(\"\
    click\", function() {\nconsole.log(\"外部被点击了!\");\n}, true);\n\ninnerElement.addEventListener(\"\
    click\", function() {\nconsole.log(\"内部被点击了!\");\n});\n```\n\n在上面的示例中，我们有两个嵌套的\
    \ `div` 元素。我们为两个元素都添加了点击事件监听器，外部元素在捕获阶段监听（`useCapture` 设置为 `true`）。当我们点击内部元素时，输出将是：\n\
    \n```\n外部被点击了!\n内部被点击了!\n```\n\n### 事件委托：\n\n事件委托是一种技术，我们在父元素上添加单个事件监听器来处理其子元素的事件。当我们动态添加元素或有大量元素时，这种方法非常有用。\n\
    \n```html\n<!-- 示例 HTML -->\n<ul id=\"list\">\n<li>项目 1</li>\n<li>项目 2</li>\n\
    <li>项目 3</li>\n</ul>\n```\n\n```javascript\n// 示例 JavaScript\nconst listElement\
    \ = document.getElementById(\"list\");\n\nlistElement.addEventListener(\"click\"\
    , function(event) {\n  if (event.target.tagName === \"LI\") {\n    console.log(\"\
    项目被点击:\", event.target.textContent);\n  }\n});\n```\n\n在上面的示例中，我们为 `ul` 元素（父元素）添加了点击事件监听器。当我们点击任何\
    \ `li` 元素（子元素）时，输出将是：\n\n```\n项目被点击：项目 1\n项目被点击：项目 2\n项目被点击：项目 3\n```\n\n"
