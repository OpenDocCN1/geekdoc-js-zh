    greetUser(\"Alice\"); // 输出: \"Hello, Alice!\"\n```\n\n在示例 3 中，我们定义了一个名为 `greetUser()`\
    \ 函数，它接受一个 `name` 参数并打印个性化的问候。\n\n### 返回语句：\n\n函数还可以使用 `return` 语句产生输出。`return`\
    \ 语句指定了函数应该返回的值。\n\n```javascript\n// 示例 4：带有返回语句的函数\nfunction add(a, b) {\n \
    \ return a + b;\n}\n\nlet sum = add(3, 5);\nconsole.log(sum); // 输出: 8\n```\n\n\
    在示例 4 中，`add()` 函数接收两个参数 `a` 和 `b`，并返回它们的和。\n\n### 匿名函数（函数表达式）：\n\n函数可以不带定义并赋值给变量。这些被称为匿名函数或函数表达式。\n\
    \n```javascript\n// 示例 5：匿名函数\nconst multiply = function(a, b) {\n  return a *\
