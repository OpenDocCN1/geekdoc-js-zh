    \ \" + i);\n}\n```\n\n在示例 15 中，`for` 循环执行大括号内的代码五次，因为 `i` 从 1 开始，每次迭代增加 1，直到达到\
    \ 5。\n\n### while 循环\n\n当你想要重复执行代码块直到特定条件变为假时，使用 `while` 循环。\n\n```javascript\n\
    // Example 16: Using the while loop\n\nlet count = 0;\n\nwhile (count < 5) {\n\
    \  console.log(\"Count: \" + count);\n  count++;\n}\n```\n\n在示例 16 中，`while` 循环执行大括号内的代码，直到\
