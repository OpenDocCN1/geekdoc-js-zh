    <p>Email: {submittedData.email}</p>


    </div>


    )}


    </div>


    );


    }


    }


    export default SimpleForm;


    ```


    In this updated code:


    - We added an `errors` state object to store validation errors for the `name`
    and `email` fields.


    - The `validateField` method is called whenever the user types in an input field.
    It validates the input based on the field name and updates the `errors` state
