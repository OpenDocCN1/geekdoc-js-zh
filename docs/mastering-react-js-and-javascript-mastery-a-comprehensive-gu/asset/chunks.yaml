    };\n\nconst Home = () => <h2>Home Page</h2>;\n\nconst Dashboard = () => <h2>Dashboard\
    \ (Protected)</h2>;\n\nconst Login = ({ setIsAuthenticated }) => {\n  const handleLogin\
