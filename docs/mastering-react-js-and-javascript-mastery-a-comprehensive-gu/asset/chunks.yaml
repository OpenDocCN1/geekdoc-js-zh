    \ = \"I am a block-scoped variable\";\n  console.log(blockVar);\n}\n// console.log(blockVar);\
    \ // ReferenceError: blockVar is not defined\n```\n\n在示例 10 中，变量 `blockVar` 声明在块内部，它仅在该块内可访问。\n\
    \n### 函数作用域 (var)：\n\n用 `var` 声明的变量具有函数作用域，这意味着它们在声明它们的整个函数范围内都是可用的。\n\n```javascript\n\
    // 示例 11：函数作用域 (var)\nfunction myFunction() {\n  if (true) {\n    var functionVar\
