  trans: "\n\n1. **Node.js 和 npm**: React 依赖 `Node.js` 和 `npm`（Node 包管理器）进行包管理。你可以从官方网站\
    \ (https://nodejs.org/) 下载并安装 `Node.js`。`npm` 与 `Node.js` 一起安装。\n\n2. **编辑器或 IDE**:\
    \ 你需要一个文本编辑器或集成开发环境（IDE）来编写 React 代码。流行的选择包括 `Visual Studio Code`、`Sublime Text`\
    \ 和 `WebStorm`。\n\n3. **JavaScript 基础知识**: React 基于 `JavaScript` 构建的，因此深入理解 `JavaScript`\
    \ 基础至关重要。\n\n在确认这些前提条件后，让我们开始设置你的 React 开发环境。\n\n## Create React App：快速上手\n\n\
    设置 React 开发环境最快、最方便的方法是使用 Create React App。Create React App 是由 Facebook 开发的一个命令行工具，它可以创建一个带有预配置开发环境的全新\
    \ React 项目。它简化了设置过程，并为你的 React 应用程序提供了坚实的基础。\n\n### 第一步：安装\n\n要开始使用 Create React\
    \ App，请打开你的终端或命令行提示符并运行以下命令：\n\n```shell\nnpx create-react-app my-react-app\n\
    ```\n\n将 `my-react-app` 替换为你想要给项目命的名字。此命令会在指定名称目录中初始化一个新的 React 项目。\n\n### 第二步：项目结构\n\
    \n安装过程完成后，使用 `cd` 命令进入你的项目文件夹。你会发现 Create React App 生成了包含以下文件和文件夹的项目结构：\n\n- `node_modules`:\
    \ 此文件夹包含所有的项目依赖项。\n- `public`: 此文件夹存放应用程序的公共资源，包括作为入口点的 HTML 文件。\n- `src`: `src`\
    \ 文件夹是你花费时间编写代码的地方。它包含了你 React 应用程序的源代码。\n- `package.json`: 此文件列出了项目的依赖项、脚本和其他元数据。\n\
    - `README.md`: 一个包含你项目信息的 readme 文件。\n- 其他配置文件和文件夹。\n\n### 第三步：启动开发服务器\n\n项目设置好后，你就可以启动开发服务器了。在终端中，进入项目目录并运行以下命令：\n\
    \n```shell\nnpm start\n```\n\n此命令将启动开发服务器并在浏览器中打开你的 React 应用程序。你对代码的任何更改都会触发浏览器中应用程序的自动刷新，让你能够实时查看更新。\n\
    \n## 探索 Create React App\n\n现在你的 React 项目已经运行起来了，让我们探索一下 Create React App 的一些功能和工具。\n\
    \n### 开发服务器\n\nCreate React App 包含一个提供热重载（hot reloading）的开发服务器。这意味着当你更改代码时，服务器会自动刷新浏览器中的应用程序。这一功能极大地加快了开发进程。\n\
    \n### ESLint 集成\n\nCreate React App 预配置了 `ESLint`。`ESLint` 是一个静态代码分析工具，帮助你维护一致的代码质量并遵循最佳实践。它会在你的编辑器中突出任何代码问题或样式违规。\n\
    \n### Babel 配置\n\n`Babel` 是一个 JavaScript 编译器，允许你在代码中使用最新的 ECMAScript 特性。Create\
    \ React App 配置了 `Babel` 以与 React 无缝协作，因此你可以编写现代 JavaScript 而无需担心兼容性问题。\n\n###\
    \ CSS Modules\n\n为了给 React 组件设置样式，Create React App 开箱即支持 `CSS Modules`。`CSS Modules`\
    \ 提供了作用域 CSS，防止样式溢出到应用程序的其他部分。这使得在大型项目中管理样式变得更加容易。\n\n### 测试设置\n\nCreate React\
    \ App 包含了使用 `Jest`（流行的 JavaScript 测试框架）和 `React Testing Library` 的测试设置。你可以为组件编写单元测试和集成测试，以确保在进行更改时功能保持完好。\n\
    \n### 生产环境构建\n\n当你准备好将 React 应用程序部署到生产环境时，Create React App 提供了一种构建优化后的生产包的简单方法。你可以使用以下命令创建应用程序的生产就绪构建：\n\
    \n```shell\nnpm run build\n```\n\n此命令会生成一个 `build` 文件夹，其中包含优化并压缩后的资产，准备好部署到 Web\
    \ 服务器或托管平台。\n\n## 自定义你的环境\n\n虽然 Create React App 提供了一个极佳的起点，但你可能会发现项目可能需要自定义配置或额外工具。幸运的是，Create\
    \ React App 允许轻松弹出（eject）。\n\n### 弹出（Ejecting）\n\n从 Create React App 中弹出意味着你正在对项目的配置进行完全控制。这是一个单向操作，因此请确保你理解其影响。要执行弹出，运行以下命令：\n\
    \n```shell\nnpm run eject\n```\n\n弹出后，你将拥有 Create React App 使用的所有配置文件和依赖项。这赋予了你根据需要添加、修改或删除配置的灵活性。\n\
    \n记住，弹出操作应谨慎进行，因为它会增加项目的复杂性并可能需要更多的手动维护。\n\n## 附加工具和扩展\n\n为了进一步增强你的 React 开发环境，考虑为你的编辑器或\
    \ IDE 安装额外的工具和扩展。以下是一些流行的选择：\n\n1. **Visual Studio Code**: 如果你正在使用 `Visual Studio\
    \ Code`，可以安装如“ESLint”（用于代码检查）、“Prettier”（用于代码格式化）和“React Snippets”（用于高效的 React\
    \ 代码自动补全）。\n2. **React Developer Tools**: 此浏览器扩展适用于 Chrome 和 Firefox。它允许你检查组件层级、查看组件状态并实时跟踪组件更新。\n\
    3. **Redux DevTools**: 如果你计划在 React 应用中使用 `Redux` 进行状态管理，`Redux DevTools` 扩展是不可或少的。它提供了应用程序状态和操作的全视图。\n\
    \n## 总结\n\n恭喜！你已成功使用 Create React App 设置了 React 开发环境。在配置良好的环境下，你准备好开始构建 React\
    \ Web 应用了。无论是个人项目还是团队协作，开发环境都是你的基石。\n\n# 第 3 章：创建你的第一个 React 组件\n\n现在你的开发环境已经运行起来了，是时候进入\
    \ React 的核心：创建组件。在本章中，我们将引导你从零开始构建第一个 React 组件。我们将涵盖从理解 React 组件的解构到将其渲染到应用程序中的所需内容。在本章结束时，你将牢牢掌握\
    \ React 组件的工作原理，并准备好构建动态界面。\n\n## 理解 React 组件的解构\n\n在开始创建 React 组件之前，让我们拆解构成组件的要素要素。从核心上说，React\
    \ 组件是一个 JavaScript 函数或类，它返回一段 `JSX`（JavaScript XML）代码。`JSX` 是一种语法扩展，允许你在 JavaScript\
    \ 文件中编写类似 HTML 的代码。\n\n### 函数组件\n\n函数组件是最简单的一种 React 组件。它们是 JavaScript 函数，接收一组可选的名为\
    \ `props`（属性的缩写）的输入，并返回一个 React 。以下是函数组件的基本结构：\n\n```jsx\nfunction MyComponent(props)\
    \ {\n  return (\n    // JSX 代码写在这里\n  );\n}\n```\n\n"
- fmt: "\nIn this example, `MyComponent` is a functional component that can accept\
    \ `props` as input and return JSX code representing the component's UI. Functional\
    \ components are ideal for simple UI elements and are a great starting point for\
    \ beginners.\n\n## Class Components\n\nClass components are another type of React\
    \ component that provides more advanced features and capabilities. They are JavaScript\
    \ classes that extend the `React.Component` class. Class components have their\
    \ own state and can define lifecycle methods for handling component events. Here's\
    \ the basic structure of a class component:\n\n```jsx\nclass MyComponent extends\
    \ React.Component {\n  constructor(props) {\n    super(props);\n    this.state\
    \ = {\n      // Initialize component state here\n    };\n  }\n  render() {\n \
    \   return (\n      // JSX code goes here\n    );\n  }\n}\n```\n\nIn this example,\
    \ `MyComponent` is a class component that can manage its state using `this.state`\
    \ and define a `render` method to return JSX code for rendering the component's\
    \ UI. Class components are suitable for more complex UI elements and offer greater\
    \ control over component behavior.\n\n## Creating Your First Functional Component\n\
    \nLet's start by creating your very first React component: a functional component\
    \ called `HelloWorld`. This component will display a simple \"Hello, React!\"\
    \ message. Follow these steps to create and render your component.\n\n### Step\
    \ 1: Create a New Component File\n\nIn your React project folder, navigate to\
    \ the `src` directory. Inside this directory, create a new file called `HelloWorld.js`.\
    \ This file will contain your `HelloWorld` component.\n\n### Step 2: Define the\
    \ Functional Component\n\nOpen the `HelloWorld.js` file in your text editor or\
    \ IDE. Define the `HelloWorld` functional component as follows:\n\n```jsx\nimport\
    \ React from 'react';\nfunction HelloWorld() {\n  return <h1>Hello, React!</h1>;\n\
    }\nexport default HelloWorld;\n```\n\nIn this code:\n- We import the `React` library,\
    \ which is necessary for creating React components.\n- We define the `HelloWorld`\
    \ functional component, which returns a JSX element containing an `<h1>` heading\
    \ with the text \"Hello, React!\"\n- Finally, we export the `HelloWorld` component\
    \ to make it available for use in other parts of your application.\n\n### Step\
    \ 3: Render the Component\n\nNow that you've defined your `HelloWorld` component,\
    \ it's time to render it in your application. Open the `src/App.js` file, which\
    \ is the main component of your Create React App project.\n\nIn the `src/App.js`\
    \ file, import the `HelloWorld` component at the top of the file:\n\n```jsx\n\
    import HelloWorld from './HelloWorld';\n```\n\nNow, you can use the `HelloWorld`\
    \ component within the `App` component's `render` method. Replace the existing\
    \ JSX code in the `App` component's `render` method with the following:\n\n```jsx\n\
    function App() {\n  return (\n    <div className=\"App\">\n      <HelloWorld />\n\
    \    </div>\n  );\n}\n```\n\nHere's what's happening in this code:\n- We import\
    \ the `HelloWorld` component we created earlier.\n- Inside the `App` component's\
    \ `render` method, we include the `HelloWorld` component, effectively rendering\
    \ it within the `App` component's UI.\n\n### Step 4: View Your Component\n\nSave\
    \ the changes you made to the `src/App.js` file. If your development server is\
    \ not running, start it by running the following command in your terminal within\
    \ your project directory:\n\n```shell\nnpm start\n```\n\nThis command will launch\
    \ the development server and open your React application in a web browser. You\
    \ should see your \"Hello, React!\" message displayed on the web page.\n\nCongratulations!\
    \ You've created and successfully rendered your first React component. You've\
    \ taken your first step into the world of building dynamic user interfaces with\
    \ React.\n\n## Working with Props\n\nProps (short for properties) are a fundamental\
    \ concept in React that allows you to pass data from a parent component to a child\
    \ component. Props enable you to make your components dynamic by customizing their\
    \ behavior and appearance based on external data.\n\n### Passing Props to a Component\n\
    \nLet's enhance our `HelloWorld` component by passing a prop to it. We'll create\
    \ a new functional component called `Greet` that takes a prop for the name to\
    \ greet. Follow these steps to pass props to a component.\n\n### Step 1: Create\
    \ a New Component File\n\nIn your `src` directory, create a new file called `Greet.js`.\
    \ This file will contain your `Greet` component.\n\n### Step 2: Define the Functional\
    \ Component\n\nOpen the `Greet.js` file and define the `Greet` functional component\
    \ as follows:\n\n```jsx\nimport React from 'react';\nfunction Greet(props) {\n\
    \  return <h1>Hello, {props.name}!</h1>;\n}\nexport default Greet;\n```\n\nIn\
    \ this code:\n- We define the `Greet` functional component, which accepts a single\
    \ prop called `name`.\n- Inside the component's JSX, we use curly braces `{props.name}`\
    \ to interpolate the value of the `name` prop into the message.\n\n### Step 3:\
    \ Render the Component with Props\n\nNow, let's render the `Greet` component with\
    \ a prop value. Open the `src/App.js` file again and import the `Greet` component\
    \ at the top of the file:\n\n```jsx\nimport Greet from './Greet';\n```\n\nNext,\
    \ update the `App` component's `render` method to include the `Greet` component\
    \ with a `name` prop:\n\n```jsx\nfunction App() {\n  return (\n    <div className=\"\
    App\">\n      <Greet name=\"React Enthusiast\" />\n    </div>\n  );\n}\n```\n\n\
    In this code:\n- We import the `Greet` component.\n- Inside the `App` component's\
    \ `render` method, we include the `Greet` component, passing the `name` prop.\n\
    \n### Step 4: View Your Component with Props\n\nSave the changes you made to the\
    \ `src/App.js` file. If your development server is running, you should see the\
    \ message \"React Enthusiast!\".\n\n## Using State in a Class Component\n\nState\
    \ is a crucial concept in React that allows components to manage and maintain\
    \ their data. While functional components are excellent for presenting UI based\
    \ on props, class components can also manage internal state. In this section,\
    \ we'll create a class component `Counter` to explore how to use state.\n\n###\
    \ Step 1: Create a New Component File\n\nIn your `src` directory, create a new\
    \ file called `Counter.js`. This file will contain your `Counter` component.\n\
    \n### Step 2: Define the Class Component\n\nOpen the `Counter.js` file and define\
    \ the `Counter` class component as follows:\n\n```jsx\nimport React, { Component\
    \ } from 'react';\nclass Counter extends Component {\n  constructor(props) {\n\
    \    super(props);\n    this.state = {\n      count: 0,\n    };\n  }\n  render()\
    \ {\n    return (\n      <div>\n        <p>Count: {this.state.count}</p>\n   \
    \     <button onClick={this.incrementCount}>Increment</button>\n      </div>\n\
    \    );\n  }\n  incrementCount = () => {\n    this.setState({ count: this.state.count\
    \ + 1 });\n  }\n}\nexport default Counter;\n```\n\nIn this code:\n- We import\
    \ `React` and `Component` from 'react'.\n- We define the `Counter` class component,\
    \ which includes a `constructor` method to initialize its state with a `count`\
    \ property set to 0.\n- In the `render` method, we display the current count using\
    \ `{this.state.count}` and provide a button with an `onClick` event handler.\n\
    - The `incrementCount` method is defined to update the component's state when\
    \ the button is clicked. It uses `this.setState` to increment the `count` property.\n\
    \n### Step 3: Render the Class Component\n\nNow, let's render the `Counter` class\
    \ component in your `src/App.js` file. Import the `Counter` component at the top\
    \ of the file:\n\n```jsx\nimport Counter from './Counter';\n```\n\nNext, include\
    \ the `Counter` component within the `App` component's `render` method:\n\n```jsx\n\
    function App() {\n  return (\n    <div className=\"App\">\n      <Counter />\n\
    \    </div>\n  );\n}\n```\n\n### Step 4: View Your Class Component\n\nSave the\
    \ changes you made to the `src/App.js` file and ensure your development server\
    \ is running with `npm start`.\n"
  raw: 'In this example, `MyComponent` is a functional component that can accept `props`
    as input and return JSX code representing the component''s UI. Functional components
    are ideal for simple UI elements and are a great starting point for beginners.


    ### Class Components


    Class components are another type of React component that provides more advanced
    features and capabilities. They are JavaScript classes that extend the `React.Component`
    class. Class components have their own state and can define lifecycle methods
    for handling component events. Here''s the basic structure of a class component:


    ```jsx


    class MyComponent extends React.Component {


    constructor(props) {


    super(props);


    this.state = {


    // Initialize component state here


    };


    }


    render() {


    return (


    // JSX code goes here


    );


    }


    }


    ```


    In this example, `MyComponent` is a class component that can manage its state
    using `this.state` and define a `render` method to return JSX code for rendering
    the component''s UI. Class components are suitable for more complex UI elements
    and offer greater control over component behavior.


    ## Creating Your First Functional Component


    Let''s start by creating your very first React component: a functional component
    called `HelloWorld`. This component will display a simple "Hello, React!" message.
    Follow these steps to create and render your component.


    ### Step 1: Create a New Component File


    In your React project folder, navigate to the `src` directory. Inside this directory,
    create a new file called `HelloWorld.js`. This file will contain your `HelloWorld`
    component.


    ### Step 2: Define the Functional Component


    Open the `HelloWorld.js` file in your text editor or IDE. Define the `HelloWorld`
    functional component as follows:


    ```jsx


    import React from ''react'';


    function HelloWorld() {


    return <h1>Hello, React!</h1>;


    }


    export default HelloWorld;


    ```


    In this code:


    - We import the `React` library, which is necessary for creating React components.


    - We define the `HelloWorld` functional component, which returns a JSX element
    containing an `<h1>` heading with the text "Hello, React!"


    - Finally, we export the `HelloWorld` component to make it available for use in
    other parts of your application.


    ### Step 3: Render the Component


    Now that you''ve defined your `HelloWorld` component, it''s time to render it
    in your application. Open the `src/App.js` file, which is the main component of
    your Create React App project.


    In the `src/App.js` file, import the `HelloWorld` component at the top of the
    file:


    ```jsx


    import HelloWorld from ''./HelloWorld'';


    ```


    Now, you can use the `HelloWorld` component within the `App` component''s `render`
    method. Replace the existing JSX code in the `App` component''s `render` method
    with the following:


    ```jsx


    function App() {


    return (


    <div className="App">


    <HelloWorld />


    </div>


    );


    }


    ```


    Here''s what''s happening in this code:


    - We import the `HelloWorld` component we created earlier.


    - Inside the `App` component''s `render` method, we include the `HelloWorld` component,
    effectively rendering it within the `App` component''s UI.


    ### Step 4: View Your Component


    Save the changes you made to the `src/App.js` file. If your development server
    is not running, start it by running the following command in your terminal within
    your project directory:


    ```shell


    npm start


    ```


    This command will launch the development server and open your React application
    in a web browser. You should see your "Hello, React!" message displayed on the
    web page.


    Congratulations! You''ve created and successfully rendered your first React component.
    You''ve taken your first step into the world of building dynamic user interfaces
    with React.


    ## Working with Props


    Props (short for properties) are a fundamental concept in React that allows you
    to pass data from a parent component to a child component. Props enable you to
    make your components dynamic by customizing their behavior and appearance based
    on external data.


    ### Passing Props to a Component


    Let''s enhance our `HelloWorld` component by passing a prop to it. We''ll create
    a new functional component called `Greet` that takes a prop for the name to greet.
    Follow these steps to pass props to a component:


    ### Step 1: Create a New Component File


    In your `src` directory, create a new file called `Greet.js`. This file will contain
    your `Greet` component.


    ### Step 2: Define the Functional Component


    Open the `Greet.js` file and define the `Greet` functional component as follows:


    ```jsx


    import React from ''react'';


    function Greet(props) {


    return <h1>Hello, {props.name}!</h1>;


    }


    export default Greet;


    ```


    In this code:


    - We define the `Greet` functional component, which accepts a single prop called
    `name`.


    - Inside the component''s JSX, we use curly braces `{props.name}` to interpolate
    the value of the `name` prop into the message.


    ### Step 3: Render the Component with Props


    Now, let''s render the `Greet` component with a prop value. Open the `src/App.js`
    file again and import the `Greet` component at the top of the file:


    ```jsx


    import Greet from ''./Greet'';


    ```


    Next, update the `App` component''s `render` method to include the `Greet` component
    with a `name` prop:


    ```jsx


    function App() {


    return (


    <div className="App">


    <Greet name="React Enthusiast" />


    </div>


    );


    }


    ```


    In this code:


    - We import the `Greet` component.


    - We include the `Greet` component within the `App` component''s JSX, passing
    a `name` prop with the value "React Enthusiast."


    ### Step 4: View Your Component with Props


    Save the changes you made to the `src/App.js` file, and make sure your development
    server is running with `npm start


    `.


    When you view your React application in the web browser, you should see the message
    "Hello, React Enthusiast!" displayed on the page. The `name` prop you passed to
    the `Greet` component is dynamically inserted into the message.


    ## Using State in a Class Component


    State is a crucial concept in React that allows components to manage and maintain
    their data. While functional components are excellent for presenting UI based
    on props, class components can also manage internal state. In this section, we''ll
    create a class component called `Counter` to explore how to use state.


    ### Step 1: Create a New Component File


    In your `src` directory, create a new file called `Counter.js`. This file will
    contain your `Counter` class component.


    ### Step 2: Define the Class Component


    Open the `Counter.js` file and define the `Counter` class component as follows:


    ```jsx


    import React, { Component } from ''react'';


    class Counter extends Component {


    constructor(props) {


    super(props);


    this.state = {


    count: 0,


    };


    }


    render() {


    return (


    <div>


    <p>Count: {this.state.count}</p>


    <button onClick={this.incrementCount}>Increment</button>


    </div>


    );


    }


    incrementCount = () => {


    this.setState({ count: this.state.count + 1 });


    };


    }


    export default Counter;


    ```


    In this code:


    - We import `React` and `Component` from ''react''.


    - We define the `Counter` class component, which includes a `constructor` method
    to initialize its state with a `count` property set to 0.


    - In the `render` method, we display the current count using `{this.state.count}`
    and provide a button with an `onClick` event handler.


    - The `incrementCount` method is defined to update the component''s state when
    the button is clicked. It uses `this.setState` to increment the `count` property.


    ### Step 3: Render the Class Component


    Now, let''s render the `Counter` class component in your `src/App.js` file. Import
    the `Counter` component at the top of the file:


    ```jsx


    import Counter from ''./Counter'';


    ```


    Next, include the `Counter` component within the `App` component''s `render` method:


    ```jsx


    function App() {


    return (


    <div className="App">


    <Counter />


    </div>


    );


    }


    ```


    ### Step 4: View Your Class Component


    Save the changes you made to the `src/App.js` file and ensure your development
    server is running with `npm start`.'
