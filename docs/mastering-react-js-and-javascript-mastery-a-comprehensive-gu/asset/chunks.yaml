    \ route parameters to determine which user's profile to display. The `match.params`\
    \ object contains the route parameters.\n- We iterate over the `users` array and\
    \ create links to each user's profile using their IDs in the URL.\n- The `Route`\
    \ component with the path `/user/:id` captures the user's ID as a route parameter.\n\
    - When a user clicks a link, the `UserProfile` component is rendered with the\
    \ appropriate user data.\n\n## Nested Routes and Layouts\n\nReact Router allows\
    \ you to create nested routes, enabling more complex navigation structures. You\
    \ can use this feature to create layouts that are consistent across multiple views\
    \ while changing the content dynamically.\n\n### Nested Routes Example\n\nLet's\
    \ create an example of nested routes to illustrate how they work. We'll have a\
    \ layout with a header and sidebar that remains consistent across different sections\
    \ of an app, while the content changes based on the selected route.\n\n```jsx\n\
    // src/App.js\n\nimport React from 'react';\n\nimport { BrowserRouter as Router,\
    \ Route, Link } from 'react-router-dom';\n\n// Components for different views\n\
    \nconst Home = () => <h2>Home Page</h2>;\n\nconst About = () => <h2>About Page</h2>;\n\
    const Contact = () => <h2>Contact Page</h2>;\n\n// Sidebar component\n\nconst\
    \ Sidebar = () => (\n  <nav>\n    <ul>\n      <li>\n        <Link to=\"/app/home\"\
    >Home</Link>\n      </li>\n      <li>\n        <Link to=\"/app/about\">About</Link>\n\
    \      </li>\n      <li>\n        <Link to=\"/app/contact\">Contact</Link>\n \
    \     </li>\n    </ul>\n  </nav>\n);\n\n// Layout component\n\nconst Layout =\
    \ ({ children }) => (\n  <div>\n    <header>\n      <h1>My App</h1>\n    </header>\n\
    \    <div className=\"content\">\n      <Sidebar />\n      <main>{children}</main>\n\
    \    </div>\n  </div>\n);\n\nfunction App() {\n  return (\n    <Router>\n    \
    \  <Route\n        path=\"/app\"\n        render={({ match }) => (\n         \
    \ <Layout>\n            <Route path={`${match.url}/home`} component={Home} />\n\
    \            <Route path={`${match.url}/about`} component={About} />\n       \
    \     <Route path={`${match.url}/contact`} component={Contact} />\n          </Layout>\n\
    \        )}\n      />\n    </Router>\n  );\n}\n\nexport default App;\n```\n\n\
    In this example:\n- We have three views: Home, About, and Contact.\n- We use the\
    \ `Sidebar` component to provide navigation.\n- We use the `Layout` component\
    \ to provide a consistent header and structure.\n- The `Route` component with\
    \ the `render` prop uses `match.url` to build nested paths dynamically.\n\n##\
    \ Programmatic Navigation\n\nIn addition to using `Link` components, you can also\
    \ perform navigation in response to user events. Here's an example of how to use:\n\
    \n```jsx\nimport React from 'react';\n\nimport { BrowserRouter as Router, Route,\
    \ Link } from 'react-router-dom';\n\nconst Home = () => <h2>Home Page</h2>;\n\n\
    const About = ({ history }) => {\n  const navigateToHome = () => {\n    history.push('/');\n\
    \  };\n  return (\n    <div>\n      <h2>About Page</h2>\n      <button onClick={navigateToHome}>Go\
    \ to Home</button>\n    </div>\n  );\n};\n\nfunction App() {\n  return (\n   \
    \ <Router>\n      <div>\n        <nav>\n          <ul>\n            <li>\n   \
    \           <Link to=\"/\">Home</Link>\n            </li>\n            <li>\n\
    \              <Link to=\"/about\">About</Link>\n            </li>\n         \
    \ </ul>\n        </nav>\n        <Route path=\"/\" exact component={Home} />\n\
    \        <Route path=\"/about\" render={(props) => <About {...props} />} />\n\
    \      </div>\n    </Router>\n  );\n}\n\nexport default App;\n```\n\nIn this example:\n\
    - We use the `history` object that React Router provides as a prop.\n- Inside\
    \ the `About` component, we define `navigateToHome` which uses `history.push('/')`\
    \ to navigate to the home page.\n- We have a button in the `About` component that\
    \ triggers `navigateToHome`.\n\n## Protected Routes and Authentication\n\nIn real-world\
    \ applications, you often need to protect certain routes to ensure that only authenticated\
    \ users can access them. React Router allows you to implement protected routes\
    \ easily.\n\nHere's an example of how to create a protected route:\n\n```jsx\n\
    import React, { useState } from 'react';\n\nimport { BrowserRouter as Router,\
    \ Route, Link, Redirect } from 'react-router-dom';\n\n// Dummy authentication\
