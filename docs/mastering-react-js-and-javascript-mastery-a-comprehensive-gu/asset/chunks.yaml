    # 6. `Symbol`：在 ECMAScript 6 (ES6) 中引入，symbol 是唯一且不可变的数据类型，通常用作对象的属性键。例如：


    ```javascript

    const id = Symbol(''unique identifier'');

    ```


    原始数据类型按值传递的，这意味着当将一个原始值赋值给变量或将其作为参数传递给函数时，会创建一个该值的副本。对变量或参数进行的任何更改都不会影响原始值。


    ## 引用数据类型


    引用数据类型是更复杂且可变的数据类型，它们持有指向存储其值的内存位置的引用。JavaScript 中有主要的引用数据类型：


    1. `Object`：表示键值对或属性的集合。对象可以存储各种数据类型，甚至是其他对象。例如：


    ```javascript

    let person = {

    name: ''Alice'',

    age: 30,

    isStudent: false

    };

    ```


    2. `Array`：表示类似列表元素集合。数组可以存储多个值，并且可以使用从 0 开始的索引访问每个值。例如：


    ```javascript

    let fruits = [''apple'', ''banana'', ''orange''];

    ```


    3. `Function`：表示执行特定任务的可重用代码块。函数是 JavaScript 的基础，因为它们实现了代码的模块化和可重用。例如：


    ```javascript

    function add(a, b) {

    return a + b;

    }

    ```


    引用数据类型按引用传递的，这意味着当你将引用值（如对象或数组）赋值给变量或将其作为参数传递给函数时，你实际上赋值的是指向存储该值的内存位置的指针。因此，对变量或参数进行的更改可能会影响原始值，因为它们都指向同一个内存位置。


    ## JavaScript 中的变量


    变量在任何编程语言中都是至关重要的，因为它们允许我们存储和操作数据。在 JavaScript 中，变量作为占位符来持有不同类型的值。要声明变量，我们使用 `var`、`let`
    或 `const` 关键字，后跟变量名。以下是每种方法的简要说明：


    ### `var` 关键字（旧方法）


    在旧版本的 JavaScript 中，通常使用 `var` 关键字来声明变量。然而，它具有一些局限性，例如提升和作用作用域的问题。提升是一种行为，在代码执行期间，变量声明会被移动到其作用域的顶部，这可能会导致意想不到的结果。


    ```javascript

    // 示例 1：使用 var 声明变量

    var age = 25;

    console.log(age); // 输出: 25

    ```


    ### `let` 和 `const` 关键字（现代方法）


    随着 2015 年 ECMAScript 6 (ES6) 的引入，增加了两个新关键字 `let` 和 `const` 用于声明变量。这些关键字提供了块级作用域，解决了
    `var` 的作用域问题。


    ```javascript

    // 示例 2：使用 let 和 const 声明变量

    let name = ''John Doe'';

    const PI = 3.14;

    console.log(name); // 输出: John Doe

    console.log(PI); // 输出: 3.14

    ```


    在示例 2 中，我们使用 `let` 声明变量 `name`，使用 `const` 声明常量 `PI`。用 `let` 声明的变量的值可以更改，而用 `const`
    声明的常量的值在整个程序执行期间保持不变。


    ### 变量命名规则


    在 JavaScript 中为变量命名时，请遵循以下规则：


    - 变量名不能以数字开头。

    - 变量名只能包含字母、数字、下划线 (_) 或美元符号 ($)。

    - 变量名区分大小写，这意味着 `age`、`Age` 和 `AGE` 被视为不同的变量。

    - 避免使用保留关键字（例如 `let`、`if`、`else`、`function` 等）作为变量名。


    ### 为变量赋值


    你可以使用赋值运算符 (`=`) 为变量赋值。这会将运算符右侧的值赋值给运算符左侧的变量。


    ```javascript

    // 示例 3：为变量赋值

    let x = 10;

    let y = 20;

    console.log(x); // 输出: 10

    console.log(y); // 输出: 20

    ```


    ### 重新赋值变量


    用 `let` 声明的变量可以重新赋予新值，而用 `const` 声明的变量不能重新赋值。尝试重新给 `const` 变量赋值会导致错误。


    ```javascript

    // 示例 4：使用 let 重新赋值变量

    let count = 5;

    count = 10;

    console.log(count); // 输出: 10


    // 示例 5：尝试重新给 const 变量赋值（将报错）

    const PI = 3.14;

    PI = 3.14159; // TypeError: Assignment to constant variable.

    ```


    ### 变量作用域


    作用域是指变量在代码不同部分的可见性或可访问性。在 JavaScript 中，主要有两种类型的作用域：全局作用域和局部作用域。


    #### 全局作用域


    在任何函数或块之外声明的变量具有全局作用域，这意味着可以从代码的任何地方访问，包括函数和块内部。


    ```javascript

    // 示例 6：全局作用域

    let globalVar = ''I am a global variable'';

    function myFunction() {

    console.log(globalVar); // 输出: I am a global variable

    }

    myFunction();

    ```


    在示例 6 中，变量 `globalVar` 具有全局作用域。


    #### 局部作用域


    在函数或块内部声明的变量具有局部作用域，这意味着它们只能在该函数或块内部被访问。


    ```javascript

    // 示例 7：局部作用域

    function myFunction() {

    let localVar = ''I am a local variable'';

    console.log(localVar); // 输出: I am a local variable

    }

    myFunction();

    // console.log(localVar); // ReferenceError: localVar is not defined

    ```


    在示例 7 中，`localVar` 具有局部作用域。


    ### 提升


    提升是在代码执行期间将变量声明移动到其作用域顶部的行为。这意味着你可以在变量之前之前它而不会报错。


    ```javascript

    // 示例 8：提升

    console.log(name); // 输出: undefined

    var name = ''John Doe'';

    console.log(name); // 输出: John Doe

    ```


    在示例 8 中，第一个 `console.log` 输出 `undefined` 是因为 `name` 被提升了。


    ### 常量


    使用 `const` 关键字声明的常量是在赋值后无法更改的变量。它们具有块作用域，与用 `let` 声明的变量一样，但是不可变的。


    ```javascript

    // 示例 9：使用常量

    const PI = 3.14;

    console.log(PI); // 输出: 3.14

    // 尝试重新赋值常量（将报错）

    PI = 3.14159; // TypeError: Assignment to constant variable.

    ```


    在示例 9 中，`PI` 是一个值为 `3.14` 的常量。任何重新给 `PI` 赋值的尝试都会导致 `TypeError`。


    ## 使用变量的最佳实践


    为了编写整洁且易维护的代码，在使用变量时请遵循以下最佳实践：


    1. 使用描述性名称：为变量选择能够传达其目的和内容的名称。

    2. 在在使用之前声明：始终在使用变量之前声明它们以避免与提升的问题。

    3. 对常量使用 `const`：对于值不会改变的变量，优先使用 `const`。

    4. 对可变变量使用 `let`：对于程序执行过程中可能会改变的变量使用 `let`。

    5. 避免全局变量：减少全局变量的使用，以防止意外副作用并保持代码的模块化。

    6. 初始化变量：在声明变量时为它们设置默认值，以避免意外行为。


