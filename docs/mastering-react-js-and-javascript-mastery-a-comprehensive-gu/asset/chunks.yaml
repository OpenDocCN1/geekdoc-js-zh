    \nimport { BrowserRouter as Router, Route, Link } from 'react-router-dom';\n\n\
    // Dummy user data\n\nconst users = [\n  { id: 1, name: 'Alice' },\n  { id: 2,\
    \ name: 'Bob' },\n  { id: 3, name: 'Charlie' },\n];\n\n// User profile component\n\
    \nconst UserProfile = ({ match }) => {\n  const { id } = match.params;\n  const\
