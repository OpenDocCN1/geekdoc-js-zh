    \ \"Hello, I am John Doe\"\n```\n\n在示例 4 中，我们为 `person` 对象添加了一个新方法 `sayHello()`\
    \ 并调用它来打印问候。\n\n## 原型：继承与共享行为\n\n原型在 JavaScript 的面向对象特性中起着重要作用。它们允许对象继承，促进了代码重用并保持了清晰的结构。\n\
    \n### 原型链\n\nJavaScript 中的每个对象都有一个原型，可以从中继承属性和方法。这种原型关系形成了一个链，被称为原型链。\n\n```javascript\n\
    // 示例 5: 原型链\n\nconst parent = {\n  parentProp: \"I am from parent\"\n};\nconst\
    \ child = {\n  childProp: \"I am from child\"\n};\nObject.setPrototypeOf(child,\
    \ parent);\nconsole.log(child.childProp); // 输出: \"I am from child\"\nconsole.log(child.parentProp);\
    \ // 输出: \"I am from parent\"\n```\n\n在示例 5 中，我们创建了对象 `parent` 和 `child`。通过使用\
    \ `Object.setPrototypeOf()`，我们将 `child` 的原型设置为 `parent`，形成了原型链。\n\n### `__proto__`\
    \ 属性\n\nJavaScript 中的每个对象都有一个指向其原型的 `__proto__`。\n\n```javascript\n// 示例 6: __proto__\
