    ### c. Component Composition


    React encourages component composition, where components can be nested within
    each other to create more complex UIs.


    ```jsx


    // Example 8: Component Composition


    function Greeting(props) {


    return <h1>Hello, {props.name}!</h1>;


    }


    function App() {


    return (


    <div>


    <Greeting name="John" />


    <Greeting name="Jane" />


    </div>


    );


    }


    ```


    In the above example, we use component composition to render two greetings in
    the `App` component.


    ## 5\. Handling Events in React


    React allows us to handle events, such as button clicks or form submissions, using
    event handlers.


    ```jsx


    // Example 9: Handling Events


    function Counter() {


    const [count, setCount] = useState(0);


    const increment = () => {


    setCount(count + 1);


    };


    return (


    <div>


    <p>Count: {count}</p>


    <button onClick={increment}>Increment</button>


    </div>


    );


    }


    ```


    In the above example, we use the `onClick` event handler to increment the count
    when the button is clicked.


    ## 6\. Working with Forms in React


    React provides a straightforward way to handle form inputs and manage form state.


    ```jsx


    // Example 10: Working with Forms


    function LoginForm() {


    const [username, setUsername] = useState('''');


    const [password, setPassword] = useState('''');


    const handleUsernameChange = (event) => {


    setUsername(event.target.value);


    };


    const handlePasswordChange = (event) => {


    setPassword(event.target.value);


    };


    const handleSubmit = (event) => {


    event.preventDefault();


    // Submit form data to the server


    };


    return (


    <form onSubmit={handleSubmit}>


    <input


    type="text"


    value={username}


    onChange={handleUsernameChange}


    placeholder="Username"


    />


    <input


    type="password"


    value={password}


    onChange={handlePasswordChange}


    placeholder="Password"


    />


    <button type="submit">Login</button>


    </form>


    );


    }


    ```


    In the above example, we create a login form with controlled inputs that handle
    changes in the username and password fields.


    ## 7\. Working with Lists and Keys


    React provides efficient ways to work with lists of data, such as rendering dynamic
    lists and adding unique keys to elements for improved performance.


    ```jsx


    // Example 11: Working with Lists and Keys


    function UserList() {


    const users = [''John'', ''Jane'', ''Bob''];


    return (


    <ul>


    {users.map((user) => (


    <li key={user}>{user}</li>


    ))}


    </ul>


    );


    }


    ```


    In the above example, we use the `map` method to render a list of users with unique
    keys.


    ## 8\. Styling in React


    React allows us to style components using CSS or inline styles.


    ```jsx


    // Example 12: Styling in React


    function StyledComponent() {


    const styles = {


    color: ''blue'',


    fontSize: ''20px'',


    fontWeight: ''bold'',


    };


    return <div style={styles}>Styled Component</div>;


    }


    ```


    In the above example, we use inline styles to style the `StyledComponent`.


    ## 9\. State Management with React Context


    React Context provides a way to pass data down the component tree without the
    need for prop drilling.


    ```jsx


    // Example 13: State Management with React Context


    const ThemeContext = React.createContext(''light'');


    function ThemedButton() {


    const theme = useContext(ThemeContext);


    return <button style={{ background: theme }}>Themed Button</button>;


    }


    ```


    In the above example, we use React Context to pass the theme down the component
    tree.


    ## Conclusion


    In this chapter, we explored React, a powerful frontend library for building user
    interfaces. We learned about its key concepts, including components, JSX, state,
    props, and the virtual DOM. React''s component-based architecture and declarative
    nature make it an excellent choice for building interactive and scalable web applications.


    As you continue your journey as a frontend developer, practice building applications
    with React to gain hands-on experience and improve your skills. React''s popularity
    and active community ensure that it will remain a prominent tool in the frontend
    development landscape for years to come.


    # # Chapter 13: Frontend Frameworks: Angular


    In Chapter 12, we explored React, a powerful JavaScript library for building user
    interfaces. Now, let''s delve into another popular frontend framework: Angular.
    Developed and maintained by Google, Angular is a comprehensive framework that
    simplifies the process of building dynamic and scalable web applications. Angular
    follows a component-based architecture and provides a rich set of features for
    managing data, handling routing, and interacting with APIs. In this chapter, we
    will explore Angular, its key concepts, and how to build robust and feature-rich
    web applications using this frontend framework.


    ## 1\. What is Angular?


    Angular is an open-source frontend framework for building single-page applications
    (SPAs) and dynamic web applications. It provides a complete solution for frontend
    development, including data binding, component-based architecture, dependency
    injection, and much more. Angular is written in TypeScript, a superset of JavaScript,
    which adds static typing and other features to enhance the development experience.


    ## 2\. Key Concepts of Angular


    To understand Angular, let''s explore its key concepts:


    ### a. Modules


    In Angular, modules are used to organize the application into logical blocks.
    A module is a container for related components, services, and other application
    features. Each Angular application has at least one root module, which is the
    entry point of the application.


    ```typescript


    // Example 1: Creating a Module


    import { NgModule } from ''@angular/core'';


    @NgModule({


    declarations: [/* Components and Directives */],


    imports: [/* Other Modules */],


    providers: [/* Services */],


    bootstrap: [/* Root Component */]


    })


    export class AppModule { }


    ```


    In the above example, we define an Angular module with its metadata, including
    the components, directives, modules, services, and the root component to bootstrap
    the application.


    ### b. Components


    Components are the building blocks of Angular applications. Each component is
    responsible for a specific section of the user interface and its associated behavior.
    Components can be reused throughout the application and communicate with other
    components using inputs and outputs.


    ```typescript


    // Example 2: Creating a Component


    import { Component } from ''@angular/core'';


    @Component({


    selector: ''app-greeting'',


    template: ''<h1>Hello, {{ name }}!</h1>'',


    })


    export class GreetingComponent {


    name = ''John'';


    }


    ```


    In the above example, we define a simple Angular component called `GreetingComponent`,
    which displays a greeting message.


    ### c. Templates


    Templates define the UI of an Angular component. They use Angular''s template
    syntax, which is similar to HTML, to render dynamic content and data.


    ```html


    <!-- Example 3: Using Templates in Component -->


    <h1>Hello, {{ name }}!</h1>


    ```


    In the above example, we use a template in the `GreetingComponent` to display
    the greeting message with the dynamic `name` property.


    ### d. Data Binding


    Data binding in Angular allows us to synchronize data between the component and
    the template. There are four types of data binding:


    - Interpolation: Binding data from the component to the template using double
    curly braces `{{ }}`.


    - Property Binding: Binding data from the component to a DOM property.


    - Event Binding: Binding events from the template to the component.


    - Two-Way Binding: Combining property and event binding to create a two-way data
    binding between the component and the template.


    ```typescript


    // Example 4: Using Data Binding


    @Component({


    selector: ''app-counter'',


    template: `


    <p>Count: {{ count }}</p>


    <button (click)="increment()">Increment</button>


    `,


    })


    export class CounterComponent {


    count = 0;


    increment() {


    this.count++;


    }


