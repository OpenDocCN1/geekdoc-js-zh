  trans: "\n\n控制流允许我们控制程序中语句执行的顺序。条件语句帮助我们根据某些条件做出决策，并相应执行不同的代码块。\n\n### if 语句\n\n\
    `if` 语句是一种基础的条件语句，允许我们在给定条件为真时执行一段代码。\n\n```javascript\n// Example 10: Using the\
    \ if statement\n\nlet age = 25;\n\nif (age >= 18) {\n  console.log(\"You are an\
    \ adult.\");\n}\n```\n\n在示例 10 中，代码检查 `age` 是否大于或等于 18。如果条件为真，它会打印“You are an\
    \ adult.”\n\n### else 语句\n\n`else` 语句与 `if` 语句配合使用。它允许我们在 `if` 条件为假时指定一个备选的代码块进行执行。\n\
    \n```javascript\n// Example 11: Using the else statement\n\nlet age = 15;\n\n\
    if (age >= 18) {\n  console.log(\"You are an adult.\");\n} else {\n  console.log(\"\
    You are a minor.\");\n}\n```\n\n在示例 11 中，代码检查 `age` 是否大于或等于 18。如果条件为真，它会打印“You\
    \ are an adult.”；否则，它会打印“You are a minor.”\n\n### else if 语句\n\n当需要顺序检查多个条件时，可以使用\
    \ `else if` 语句。它提供了一组替代条件，在之前的 `if` 和 `else` 条件为假时进行测试。\n\n```javascript\n// Example\
    \ 12: Using the else if statement\n\nlet time = 14;\n\nif (time < 12) {\n  console.log(\"\
    Good morning!\");\n} else if (time < 18) {\n  console.log(\"Good afternoon!\"\
    );\n} else {\n  console.log(\"Good evening!\");\n}\n```\n\n在示例 12 中，代码检查 `time`\
    \ 的值并根据一天中的时间打印不同的问候语。\n\n### 嵌套 if 语句\n\n你可以将条件语句嵌套在一起，以创建复杂的决策逻辑。\n\n```javascript\n\
    // Example 13: Using nested if statements\n\nlet age = 25;\nlet isStudent = true;\n\
    \nif (age >= 18) {\n  if (isStudent) {\n    console.log(\"You are an adult student.\"\
    );\n  } else {\n    console.log(\"You are an adult.\");\n  }\n} else {\n  console.log(\"\
    You are a minor.\");\n}\n```\n\n在示例 13 中，代码检查 `age` 是否大于或等于 18，然后检查该人员是否为学生。\n\
    \n### 三元运算符 (?)\n\n三元运算符提供了一种编写简单 if-else 语句的简写方式。\n\n```javascript\n// Example\
    \ 14: Using the ternary operator\n\nlet age = 25;\nlet message = age >= 18 ? \"\
    You are an adult.\" : \"You are a minor.\";\nconsole.log(message); // Output:\
    \ You are an adult.\n```\n\n在示例 14 中，三元运算符检查 `age` 是否大于或等于 18。如果为真，它将“You are\
    \ an adult.” 赋值给变量 `message`；否则，它将“You are a minor.” 赋值。\n\n## 循环：使用 JavaScript\
    \ 进行迭代\n\n循环提供了一种重复执行代码块的方法，直到满足特定条件。JavaScript 中有几种类型的循环，但最常用的是 `for` 循环和 `while`\
    \ 循环。\n\n### for 循环\n\n当你知道想要执行的精确次数时，`for` 循环非常有用。\n\n```javascript\n// Example\
