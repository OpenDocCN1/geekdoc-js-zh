    Handling form submissions is a common task in web development. React simplifies
    this process by allowing you to create controlled form elements and manage their
    state. Let''s create a simple form that allows users to submit their names.


    ### Step 1: Create a New Component


    In your React project, create a new file called `NameForm.js`. This-this file
    will contain the `NameForm` component.


    ### Step 2: Define the Component


    Open the `NameForm.js` file and define the `NameForm` component as follows:


    ```jsx

    import React, { Component } from ''react'';


    class NameForm extends Component {

    constructor(props) {

    super(props);

    this.state = {

    name: '''',

    submittedName: '''',

    };

    }


    handleNameChange = (event) => {

    this.setState({ name: event.target.value });

    };


    handleSubmit = (event) => {

    event.preventDefault();

    this.setState({ submittedName: this.state.name });

    };


    render() {

    return (

    <div>

    <p>Submitted Name: {this.state.submittedName}</p>

    <form onSubmit={this.handleSubmit}>

    <label>

    Enter your name:

    <input

    type="text"

    value={this.state.name}

    onChange={this.handleNameChange}

    />

    </label>

    <button type="submit">Submit</button>

    </form>

    </div>

    );

    }

    }

    export default NameForm;

    ```


    In this code:

    - We define the `NameForm` class component, which has two state properties: `name`
    (for user input) and `submittedName` (to display the submitted name).

    - The `handleNameChange` method updates the `name` state whenever the user types
    in the input field.

    - The `handleSubmit` method prevents the default form submission behavior, updates
    the `submittedName` state with the current value of `name`, and displays the submitted
    name.

    - In the `render` method, we display the submitted name and create a controlled
    form element. The input field''s value is bound to the `name` state, and the `onChange`
    event is used to call `handleNameChange` when the user types.


    ### Step 3: Use the Component


    To use the `NameForm` component, import it in another component (e.g., `App.js`)
    and render it. Here''s an example of how to use it:


    ```jsx

    import React from ''react'';

    import NameForm from ''./NameForm'';


    function App() {

    return (

    <div className="App">

    <NameForm />

    </div>

    );

    }

    export default App;

    ```


    Now, when you view your React application, you''ll see a form where you can enter
    your name and submit it. The submitted name will be displayed on the page.


    ## Handling Conditional Rendering


    Conditional rendering in React involves showing or hiding elements based on certain
    conditions or user interactions. It allows you to create dynamic user interfaces
    that respond to different states and events. Let''s explore how to handle conditional
    rendering with a practical example.


    ### Step 1: Create a New Component


    In your React project, create a new file called `Greeting.js`. This file will
    contain the `Greeting` component.


    ### Step 2: Define the Component


    Open the `Greeting.js` file and define the `Greeting` component as follows:


    ```jsx

    import React, { Component } from ''react'';


    class Greeting extends Component {

    constructor(props) {

    super(props);

    this.state = {

    isUserLoggedIn: false,

    };

    }


    toggleUserLogin = () => {

    this.setState((prevState) => ({

    isUserLoggedIn: !prevState.isUserLoggedIn,

    }));

    };


    render() {

    const { isUserLoggedIn } = this.state;

    return (

    <div>

    <button onClick={this.toggleUserLogin}>

    {isUserLoggedIn ? ''Logout'' : ''Login''}

    </button>

    {isUserLoggedIn ? (

    <p>Welcome, User! You are logged in.</p>

    ) : (

    <p>Please log in to access your account.</p>

    )}

    </div>

    );

    }

    }

    export default Greeting;

    ```


    In this code:

    - We define the `Greeting` class component, which has a `isUserLoggedIn` state
    property to track whether the user is logged in.

    - The `toggleUserLogin` method toggles the `isUserLoggedIn` state when the button
    is clicked.

    - In the `render` method, we conditionally render a greeting message based on
    the `isUserLoggedIn` state. If the user is logged in, we display a welcome message;
    otherwise, we prompt the user to log in.


    ### Step 3: Use the Component


    To use the `Greeting` component, import it in another component (e.g., `App.js`)
    and render it. Here''s an example of how to use it:


    ```jsx

    import React from ''react'';

    import Greeting from ''./Greeting'';


    function App() {

    return (

    <div className="App">

    <Greeting />

    </div>

    );

    }

    export default App;

    ```


    Now, when you view your React application, you''ll see a "Login" button. Clicking
    the button will toggle the greeting message between "Welcome, User! You are logged
    in." and "Please log in to access your account."


    ## Conclusion and Best Practices


    In this chapter, you''ve learned how to handle events and user input in React
    components. You''ve explored event handling for common scenarios like button clicks,
    form submissions, and conditional rendering. Here are some best practices to keep
    in mind:


    1. **Use Synthetic Events**: React wraps native browser events to ensure consistent
    behavior across browsers.

    2. **Prevent Default**: When handling form submissions, use `event.preventDefault()`
    to stop the page from reloading.

    3. **Update State**: Use `setState` to update component properties, which triggers
    a re-render.

    4. **Conditional Rendering**: Use logical operators or ternary operators to display
    different elements based on state.

    5. **Controlled Components**: Ensure input values are bound to the state for a
    single source of truth.

