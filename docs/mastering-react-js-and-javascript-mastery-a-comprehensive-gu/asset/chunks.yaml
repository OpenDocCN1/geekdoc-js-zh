    \ JavaScript 开发者至关重要。让我们进入对象和原型的世界吧！\n\n## 对象：封装数据与函数\n\n在 JavaScript 中，对象是复合数据类型，允许我们表示具有属性（数据）和关联方法（函数）的实体。对象提供了一种组织相关数据和行为的极佳方式，使代码更加结构化且易读。\n\
    \n### 对象字面量\n\n创建对象的简单方法是使用对象字面量，用大括号 `{}` 表示。\n\n```javascript\n// 示例 1: 对象字面量\n\
