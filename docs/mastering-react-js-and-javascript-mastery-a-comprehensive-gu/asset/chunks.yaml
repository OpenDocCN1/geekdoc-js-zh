    # 第 12 章：前端框架：React


    在快速发展的 Web 开发世界中，前端框架在简化构建现代交互式用户界面的方面起着至关重要的作用。在这些框架中，React 作为最流行和最广泛的 Web 应用库之一脱而出。React
    由 Facebook 开发并维护，由于其简单性、可重用性和性能，在 Web 开发社区中获得了巨大的关注。在本章中，我们将探索 React、它的核心概念，以及如何使用这个强大的前端库构建健壮动态的
    Web 应用。


    ## 1. 什么是 React？


    React 是一个用于构建用户界面的开源 JavaScript 库。它由 Facebook 的工程师 Jordan Walke 创建，并于 2011 年首次部署在
    Facebook 的新闻中。React 允许开发者构建复用的 UI 组件并高效管理 Web 应用的状态。它遵循基于组件的架构，使得复杂应用程序更易维护和扩展。


    ## 2. React 的核心概念


    为了更好地理解 React，让我们探索它的核心概念：


    ### a. 组件 (Components)


    组件是 React 应用的构建块。组件是自包含且复用的 UI 部分，可以组合形成 Web 应用的用户界面。组件可以是基于函数的，也可以基于类的。


    ```jsx

    // Example 1: 函数组件


    function Greeting(props) {

    return <h1>Hello, {props.name}!</h1>;

    }


    // Example 2: 类组件


    class Greeting extends React.Component {

    render() {

    return <h1>Hello, {this.props.name}!</h1>;

    }

    }

    }

    ```


    在上面的示例中，我们定义了一个显示问候信息的函数组件和一个基于类的组件。


    ### b. JSX (JavaScript XML)


    JSX 是 React 中使用的 JavaScript 语法扩展，用于描述 UI 应该什么样。它允许开发者在 JavaScript 中编写类似 HTML 的代码，使创建
    UI 组件变得简单。


    ```jsx

    // Example 3: 使用 JSX


    function Greeting(props) {

    return <h1>Hello, {props.name}!</h1>;

    }

    ```


    在上面的示例中，我们使用 JSX 创建了一个显示问候信息的组件。


    ### c. 状态 (State) 和  (Props)


    State 和 props 是 React 中的两个基本概念。


    - 状态 (State)：状态代表组件的内部数据。它可以随时间发生变化，并由组件本身管理。为了处理状态，我们在函数组件中使用 `useState` 钩，或在类组件中使用
    `setState` 方法。


    ```jsx

    // Example 4: 在函数组件中使用状态


    import React, { useState } from ''react'';


    function Counter() {

    const [count, setCount] = useState(0);


    const increment = () => {

    setCount(count + 1);

    };


    return (

    <div>

    <p>Count: {count}</p>

    <button onClick={increment}>Increment</button>

    </div>

    );

    }

    ```


    - Props：Props（属性的缩写）用于从父组件向子组件传递传递数据。Props 是只读的，不能被子组件修改。


    ```jsx

    // Example 5: 使用 Props


    function Greeting(props) {

    return <h1>Hello, {props.name}!</h1>;

    }


    function App() {

    return <Greeting name="John" />;

    }

    ```


    在上面的示例中，我们使用状态和 props 管理内部数据。


    ### d. 虚拟 DOM (Virtual DOM)


    React 使用虚拟 DOM 来优化 UI 更新。虚拟 DOM 是实际 DOM 的轻量级副本，React 将其与真实 DOM 进行比较以确定更新所需的所需的更改次数。


    ## 3. 设置 React 项目


    要开始构建 React 应用，我们需要使用 Create React App 等工具设置项目，或使用 Webpack 和 Babel 等工具手动配置构建系统。


