    \ `multiply`，然后使用参数 `2` 和 `4` 调用该函数。\n\n### 箭头函数 (ES6)：\n\n箭头函数为定义函数提供了更短的语法，对于单行代码特别有用。它们使用\
    \ `=>` 语法。\n\n```javascript\n// 示例 6：箭头函数\nconst square = (x) => x * x;\nconsole.log(square(3));\
    \ // 输出: 9\n```\n\n在示例 6 中，我们定义了一个箭头函数 `square`，它接受参数 `x` 并返回其平方。\n\n## 作用域：理解变量的可访问性\n\
    \nJavaScript 中的作用域定义了变量在代码不同部分的可性和可访问性。理解作用域对于避免意外的副作用以及编写整洁且无 Bug 代码至关重要。JavaScript\
    \ 有两种主要的作用域：全局作用域和局部作用域。\n\n### 全局作用域：\n\n在任何函数或块外部声明的变量具有全局作用域，它们可以在代码的任何地方被访问。\n\
    \n```javascript\n// 示例 7：全局作用域\nlet globalVar = \"I am a global variable\";\n\n\
    function myFunction() {\n  console.log(globalVar);\n}\n\nmyFunction(); // 输出:\
    \ \"I am a global variable\"\n```\n\n在示例 7 中，变量 `globalVar` 具有全局作用域，我们可以在 `myFunction`\
    \ 函数内部访问它。\n\n### 局部作用域：\n\n在函数或块内部声明的变量具有局部作用域，这意味着它们仅在该特定函数或块内可用\n\n```javascript\n\
    // 示例 8：局部作用域\nfunction myFunction() {\n  let localVar = \"I am a local variable\"\
    ;\n  console.log(localVar);\n}\n\nmyFunction(); // 输出: \"I am a local variable\"\
