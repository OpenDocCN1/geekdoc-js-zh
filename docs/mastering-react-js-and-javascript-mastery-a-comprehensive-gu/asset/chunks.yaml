    Congratulations! You''ve just executed your first JavaScript program successfully.
    Now, let''s explore more about variables and data types in JavaScript.


    ## Variables and Data Types


    Variables are fundamental in any programming language, as they allow us to store
    and manipulate data. In JavaScript, variables can hold different types of data,
    such as numbers, strings, booleans, arrays, objects, and more. Before using a
    variable, it must be declared using the `var`, `let`, or `const` keyword.


    ### 1\. `var` Keyword (Legacy Approach):


    In older versions of JavaScript, the `var` keyword was commonly used to declare
    variables. However, it has some limitations, such as hoisting and scope-related
    issues.


    ```javascript


    // Example 2: Using var to declare a variable


    var message = "Welcome to JavaScript!";


    console.log(message); // Output: Welcome to JavaScript!


    ```


    ### 2\. `let` and `const` Keywords (Modern Approach):


    With the introduction of ECMAScript 6 (ES6) in 2015, two new keywords, `let` and
    `const`, were added to declare variables. These keywords offer block-scoping,
    which addresses the scope-related problems of `var`.


    ```javascript


    // Example 3: Using let and const to declare variables


    let count = 5;


    const PI = 3.14;


    console.log(count); // Output: 5


    console.log(PI); // Output: 3.14


    ```


    In Example 3, we use `let` to declare a variable `count` and `const` to declare
    a constant `PI`. The value of a variable declared with `let` can be changed, while
    the value of a constant declared with `const` remains fixed throughout the program
    execution.


    ### Data Types in JavaScript:


    JavaScript has several built-in data types, each serving different purposes. The
    primary data types in JavaScript are:


    1\. **Number:** Represents numeric values, both integers and floating-point numbers.


    2\. **String:** Represents textual data, enclosed in single ('''') or double ("")
    quotes.


    3\. **Boolean:** Represents a logical value, either `true` or `false`.


    4\. **Null:** Represents an intentional absence of any value.


    5\. **Undefined:** Represents a declared variable with no assigned value.


    6\. **Object:** Represents a collection of key-value pairs or complex data structures.


    7\. **Array:** Represents a list-like collection of elements.


    8\. **Function:** Represents reusable blocks of code that perform a specific task.


    Let''s see some examples of working with different data types in JavaScript:


    ```javascript


    // Example 4: Working with different data


    types


    let age = 25; // Number


    let name = "John Doe"; // String


    let isStudent = true; // Boolean


    let car = null; // Null


    let city; // Undefined


    let person = {


    name: "Alice",


    age: 30,


    isStudent: false


    }; // Object


    let fruits = ["apple", "banana", "orange"]; // Array


    function add(a, b) {


    return a + b;


    } // Function


    console.log(age); // Output: 25


    console.log(name); // Output: John Doe


    console.log(isStudent); // Output: true


    console.log(car); // Output: null


    console.log(city); // Output: undefined


    console.log(person); // Output: { name: ''Alice'', age: 30, isStudent: false }


    console.log(fruits); // Output: [ ''apple'', ''banana'', ''orange'' ]


    console.log(add(5, 10)); // Output: 15


    ```


    In Example 4, we declare variables of different data types and demonstrate how
    to access and use them. As you can see, JavaScript is a loosely typed language,
    meaning you don''t need to specify the data type explicitly when declaring a variable.
    The data type is determined based on the value assigned to the variable.


    ## Operators and Expressions


    In JavaScript, operators are symbols used to perform operations on values. Expressions
    are combinations of values, variables, and operators that result in a single value.


    ### Arithmetic Operators:


    Arithmetic operators perform basic mathematical operations on numeric values.
    The most common arithmetic operators in JavaScript are:


    1\. **Addition (+):** Adds two values together.


    2\. **Subtraction (-):** Subtracts the second value from the first.


    3\. **Multiplication (*):** Multiplies two values.


    4\. **Division (/):** Divides the first value by the second.


    5\. **Modulus (%):** Returns the remainder of the division.


    Let''s look at some examples:


    ```javascript


    // Example 5: Using arithmetic operators


    let a = 10;


    let b = 5;


    console.log(a + b); // Output: 15


    console.log(a - b); // Output: 5


    console.log(a * b); // Output: 50


    console.log(a / b); // Output: 2


    console.log(a % b); // Output: 0


    ```


    ### Assignment Operators:


    Assignment operators are used to assign values to variables. The most common assignment
    operator is the equals sign (=).


    ```javascript


    // Example 6: Using assignment operator


    let x = 10;


    let y = 20;


    x = y;


    console.log(x); // Output: 20


    ```


    In Example 6, we assign the value of `y` to the variable `x` using the assignment
    operator (=).


    ### Comparison Operators:


    Comparison operators are used to compare two values and return a Boolean value
    (true or false) based on the comparison''s result.


    1\. **Equal to (==):** Checks if two values are equal, irrespective of their data
    types.


    2\. **Not equal to (!=):** Checks if two values are not equal.


    3\. **Strict equal to (===):** Checks if two values are equal and have the same
    data type.


    4\. **Strict not equal to (!==):** Checks if two values are not equal or have
    different data types.


    5\. **Greater than (>):** Checks if the value on the left is greater than the
    value on the right.


    6\. **Less than (<):** Checks if the value on the left is less than the value
    on the right.


    7\. **Greater than or equal to (>=):** Checks if the value on the left is greater
    than or equal to the value on the right.


    8\. **Less than or equal to (<=):** Checks if the value on the left is less than
    or equal to the value on the right.


    Let''s explore some examples:


    ```javascript


    // Example 7: Using comparison operators


    let num1 = 10;


    let num2 = 5;


    console.log(num1 == num2); // Output: false


    console.log(num1 != num2); // Output: true


    console.log(num1 === num2); // Output: false


    console.log(num1 !== num2); // Output: true


    console.log(num1 > num2); // Output: true


    console.log(num1 < num2); // Output: false


    console.log(num1 >= num2); // Output: true


    console.log(num1 <= num2); // Output: false


    ```


    ### Logical Operators:


    Logical operators are used to combine multiple conditions and return a Boolean
    value based on the result.


    1\. **Logical AND (&&):** Returns true if both conditions are true.


    2\. **Logical OR (||):** Returns true if at least one of the conditions is true.


    3\. **Logical NOT (!):** Reverses the result, turning true to false and false
    to true.


    Let''s see some examples:


    ```javascript


    // Example 8: Using logical operators


    let age = 25;


    let isStudent = true;


    console.log(age >= 18 && isStudent); // Output: true (Both conditions are true)


    console.log(age < 18 || isStudent); // Output: true (At least one condition is
    true)


    console.log(!isStudent); // Output: false (Reversing true to false)


    ```


    ### String Concatenation:


    In JavaScript, you can concatenate (combine) strings using the `+` operator.


    ```javascript


    // Example 9: String concatenation


    let firstName = "John";


    let lastName = "Doe";


    let fullName = firstName + " " + lastName;


    console.log(fullName); // Output: John Doe


    ```


    In Example 9, we concatenate the `firstName`, a space, and the `lastName` to create
    the `fullName` variable.


