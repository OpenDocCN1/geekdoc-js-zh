    - We define the `Greeting` class component, which has a `isUserLoggedIn` state
    property to track whether the user is logged in.


    - The `toggleUserLogin` method toggles the `isUserLoggedIn` state when the button
    is clicked.


    - In the `render` method, we conditionally render a greeting message based on
    the `isUserLoggedIn` state. If the user is logged in, we display a welcome message;
    otherwise, we prompt the user to log in.


    ### Step 3: Use the Component


    To use the `Greeting` component, import it in another component (e.g., `App.js`)
    and render it. Here''s an example of how to use it:


    ```jsx


    import React from ''react'';


    import Greeting from ''./Greeting'';


    function App() {


    return (


    <div className="App">


    <Greeting />


    </div>


    );


    }


    export default App;


    ```


    Now, when you view your React application, you''ll see a "Login" button. Clicking
    the button will toggle the greeting message between "Welcome, User! You are logged
    in." and "Please log in to access your account."


    ## Conclusion and Best Practices


    In this chapter, you''ve learned how to handle events and user input in React
    components. You''ve explored event handling for common scenarios like button clicks,
    form submissions, and conditional rendering. Here are some best practices to keep
    in mind:


    1\. **Use Synthetic Events**: React''s synthetic event system provides consistent
    event handling across browsers. Always use React''s event handling, such as `onClick`
    and `onChange`, rather than native DOM events.


    2\. **Prevent Default**: When handling events like form submissions, call `event.preventDefault()`
    to prevent the default browser behavior. This allows you to handle the submission
    with custom logic.


    3\. **Update State**: Event handlers often involve updating component state. Use
    `setState` to update state properties and trigger re-renders.


    4\. **Conditional Rendering**: Conditional rendering is powerful for displaying
    content based on different states or user interactions. Use conditional rendering
    to create dynamic user interfaces.


    5\. **Controlled Components**: For form elements, create controlled components
    by binding their values to state properties. This ensures that the component reflects
    the current state of the input.


    As you continue to build React applications, event handling and user input will
    be fundamental to creating interactive and responsive user interfaces. Experiment
    with different event types and scenarios to become proficient in React''s event
    handling capabilities.


    # # Chapter 6: Conditional Rendering and Lists


    Conditional rendering and working with lists are essential skills when building
    dynamic and data-driven user interfaces in React. In this chapter, we will explore
    how to conditionally render components based on certain conditions and how to
    efficiently render and manipulate lists of data in React applications.


    ## Conditional Rendering in React


    Conditional rendering involves displaying or hiding components or content based
    on specific conditions or user interactions. React provides several ways to implement
    conditional rendering, enabling you to create dynamic and responsive user interfaces.


    ### Using Conditional Statements


    One of the simplest ways to conditionally render content in React is by using
    JavaScript''s conditional statements within the component''s `render` method.
    For example, you can use the `if` statement to conditionally render different
    components or elements:


    ```jsx


    class ConditionalRenderingExample extends React.Component {


    render() {


    const isLoggedIn = this.props.isLoggedIn;


    if (isLoggedIn) {


    return <LoggedInComponent />;


    } else {


    return <LoggedOutComponent />;


    }


    }


    }


    ```


    In this example, the `LoggedInComponent` is rendered if the `isLoggedIn` prop
    is `true`, and the `LoggedOutComponent` is rendered if it''s `false`.


    ### Using the Ternary Operator


    A concise way to perform conditional rendering is by using the ternary operator
    (`? :`). It allows you to conditionally choose between two expressions. Here''s
    how you can use it for conditional rendering:


    ```jsx


    class ConditionalRenderingExample extends React.Component {


    render() {


    const isLoggedIn = this.props.isLoggedIn;


    return (


    <div>


    {isLoggedIn ? <LoggedInComponent /> : <LoggedOutComponent />}


    </div>


    );


    }


    }


    ```'
