    # Chapter 12: Frontend Frameworks: React


    In the rapidly evolving world of web development, frontend frameworks play a vital
    role in simplifying the process of building modern and interactive user interfaces.
    Among these frameworks, React stands out as one of the most popular and widely
    used libraries for building web applications. Developed and maintained by Facebook,
    React has gained tremendous traction in the web development community due to its
    simplicity, reusability, and performance. In this chapter, we will explore React,
    its key concepts, and how to build robust and dynamic web applications using this
    powerful frontend library.


    ## 1. What is React?


    React is an open-source JavaScript library for building user interfaces. It was
    created by Jordan Walke, a software engineer at Facebook, and was first deployed
    on Facebook''s newsfeed in 2011. React allows developers to build reusable UI
    components and manage the state of web applications efficiently. It follows a
    component-based architecture, making it easier to maintain and scale complex applications.


    ## 2. Key Concepts of React


    To understand React better, let''s explore its key concepts:


    ### a. Components


    Components are the building blocks of React applications. A component is a self-contained
    and reusable piece of UI that can be composed to form the user interface of a
    web application. Components can be either functional or class-based.


    ```jsx

    // Example 1: Functional Component


    function Greeting(props) {

    return <h1>Hello, {props.name}!</h1>;

    }


    // Example 2: Class-based Component


    class Greeting extends React.Component {

    render() {

    return <h1>Hello, {this.props.name}!</h1>;

    }

    }

    }

    ```


    In the above examples, we define a functional component and a class-based component
    that display a greeting message.


    ### b. JSX (JavaScript XML)


    JSX is a syntax extension for JavaScript used in React to describe what the UI
    should look like. It allows developers to write HTML-like code within JavaScript,
    making it easier to create UI components.


    ```jsx

    // Example 3: Using JSX


    function Greeting(props) {

    return <h1>Hello, {props.name}!</h1>;

    }

    ```


    In the above example, we use JSX to create a component that displays a greeting
    message.


    ### c. State and Props


    State and props are two fundamental concepts in React.


    - State: State represents the internal data of a component. It can change over
    time and is managed by the component itself. To handle state, we use the `useState`
    hook in functional components or the `setState` method in class-based components.


    ```jsx

    // Example 4: Using State in Functional Component


    import React, { useState } from ''react'';


    function Counter() {

    const [count, setCount] = useState(0);


    const increment = () => {

    setCount(count + 1);

    };


    return (

    <div>

    <p>Count: {count}</p>

    <button onClick={increment}>Increment</button>

    </div>

    );

    }

    ```


    - Props: Props (short for properties) are used to pass data from a parent component
    to a child component. Props are read-only and cannot be modified by the child
    component.


    ```jsx

    // Example 5: Using Props


    function Greeting(props) {

    return <h1>Hello, {props.name}!</h1>;

    }


    function App() {

    return <Greeting name="John" />;

    }

    ```


    In the above examples, we use state and props to manage internal data and pass
    data to child components.


    ### d. Virtual DOM


    React uses a virtual DOM (Document Object Model) to optimize UI updates. The virtual
    DOM is a lightweight copy of the actual DOM, and React compares it with the real
    DOM to determine the minimum number of changes required for an update, improving
    performance.


    ## 3. Setting Up a React Project


    To start building a React application, we need to set up a project using tools
    like Create App or manually configure a build system with tools like Webpack and
    Babel.


    ### Create React App


    Create React App is a popular tool for creating React applications with a pre-configured
    build system.


    ```bash

    npx create-react-app my-app

    cd my-app

    npm start

    ```


    In the above example, we use Create React App to set up a new React project named
    "my-app" and start the development server.


    ## 4. Working with React Components


    Once the project is set up, we can start building React components to create the
    user interface.


    ### a. Functional Components


    Functional components are simple functions that take props as input and return
    JSX elements as output.


    ```jsx

    // Example 6: Functional Component


    function Greeting(props) {

    return <h1>Hello, {props.name}!</h1>;

    }

    ```


    ### b. Class-based Components


    Class-based components are ES6 classes that extend `React.Component`. They have
    more features, such as state and lifecycle methods.


    ```jsx

    // Example 7: Class-based Component


    class Greeting extends React.Component {

    render() {

    return <h1>Hello, {this.props.name}!</h1>;

    }

    }

    }

