  trans: "\n\n在第 2 章中，我们对 JavaScript 中的数据类型和变量有了深入的理解。现在，是时候探索如何使用条件语句和循环来控制代码流。控制流允许我们根据某些条件做出决策并执行特定的代码块，而循环提供了一种重复执行任务直到满足条件的机制。通过掌握控制流和循环，你将释放\
    \ JavaScript 的全部潜力，并能够构建更动态、更交互的应用程序。让我们开始吧！\n\n## 条件语句：代码中的决策制定\n\n条件语句允许我们在代码中创建决策逻辑。根据条件的真值（truthiness），会执行特定的代码块。JavaScript\
    \ 提供了三种类型的条件语句：`if`、`if...else` 和 `switch`。\n\n### `if` 语句：\n\n`if` 语句是条件语句的最基本形式。当指定的条件求值为\
    \ `true` 时，它会执行代码块。\n\n```javascript\n// 示例 1: 使用 if 语句\n\nlet age = 25;\n\nif\
    \ (age >= 18) {\n  console.log(\"You are an adult.\");\n}\n```\n\n在示例 1 中，代码检查\
    \ `age` 是否大于或等于 18。如果为真，打印 \"You are an adult.\"。\n\n### `if...else` 语句：\n\n`if...else`\
    \ 语句允许我们在条件为 `true` 时执行一个代码块，在为 `false` 时执行另一个代码块。\n\n```javascript\n// 示例 2:\
    \ 使用 if...else 语句 \n\nlet isRaining = true;\n\nif (isRaining) {\n  console.log(\"\
    It's raining. Don't forget your umbrella!\");\n} else {\n  console.log(\"No rain.\
    \ Have a great day!\");\n}\n```\n\n在示例 2 中，代码检查 `isRaining` 是否为 `true`。如果是，它打印\
    \ \"It's raining. Don't forget your umbrella!\"；否则，它打印 \"No rain. Have a great\
    \ day!\"。\n\n### `else if` 语句：\n\n`else if` 语句允许我们在决策过程中添加多个条件。\n\n```javascript\n\
    // 示例 3: 使用 else if 语句 \n\nlet time = 14;\n\nif (time < 12) {\n  console.log(\"\
    Good morning!\");\n} else if (time < 18) {\n  console.log(\"Good afternoon!\"\
    );\n} else {\n  console.log(\"Good evening!\");\n}\n```\n\n在示例 3 中，代码检查 `time`\
    \ 的值并根据一天中的时间打印不同的问候语。\n\n### `switch` 语句：\n\n`switch` 语句提供了处理多种条件的备用方法。\n\n```javascript\n\
    // 示例 4: 使用 switch 语句 \n\nlet day = \"Monday\";\n\nswitch (day) {\n  case \"Monday\"\
    :\n    console.log(\"It's the beginning of the week.\");\n    break;\n  case \"\
    Friday\":\n    console.log(\"It's almost the weekend!\");\n    break;\n  default:\n\
    \    console.log(\"It's a regular day.\");\n}\n```\n\n在示例 4 中，代码检查 `day` 的值并根据星期几打印不同的消息。\n\
    \n## 循环：重复执行代码执行\n\n在在编程中至关重要，因为它们允许我们重复执行代码块直到满足特定条件。JavaScript 提供了几种类型的循环，包括\
    \ `for` 循环、`while` 循环、`do...while` 循环和 `for...of` 循环。\n\n### `for` 循环：\n\n`for`\
    \ 循环在你知道想要执行的精确迭代次数时是最理想的。\n\n```javascript\n// 示例 5: 使用 for 循环 \n\nfor (let i\
    \ = 1; i <= 5; i++) {\n  console.log(\"Iteration: \" + i);\n}\n```\n\n在示例 5 中，`for`\
    \ 循环执行大括号内的代码五次，因为 `i` 从 1 开始，在每次迭代中增加 1，直到达到 5。\n\n### `while` 循环：\n\n`while`\
    \ 循环用于在你想要重复代码块直到特定条件变为 `false` 时。\n\n```javascript\n// 示例 6: 使用 while 循环 \n\n\
    let count = 0;\n\nwhile (count < 5) {\n  console.log(\"Count: \" + count);\n \
    \ count++;\n}\n```\n\n在示例 6 中，`while` 循环执行大括号内的代码，直到 `count` 变成 5，因为它在每次迭代中增加\
    \ 1。\n\n### `do...while` 循环：\n\n`do...while` 循环与 `while` 循环类似，但它确保在检查条件之前，循环块中的代码至少执行一次。\n\
    \n```javascript\n// 示例 7: 使用 do...while 循环 \n\nlet i = 0;\n\ndo {\n  console.log(\"\
    Value of i: \" + i);\n  i++;\n} while (i < 5);\n```\n\n在示例 7 中，`do...while` 循环至少执行一次大括号内的代码，因为条件是在第一次迭代后检查的。\n\
    \n### `for...of` 循环：\n\n`for...of` 循环用于遍历可迭代对象的元素，例如数组和字符串。\n\n```javascript\n\
    // 示例 8: 使用 for...of 循环 \n\nlet fruits = [\"apple\", \"banana\", \"orange\"];\n\
    \nfor (let fruit of fruits) {\n  console.log(fruit);\n}\n```\n\n在示例 8 中，`for...of`\
    \ 循环遍历 `fruits` 数组。\n\n### `break` 和 `continue` 语句：\n\n`break` 语句允许在满足特定条件时提前退出循环。`continue`\
    \ 语句允许跳过当前迭代的剩余部分并进入下次迭代。\n\n```javascript\n// 示例 9: 使用 break 和 continue 语句 \n\
    \nfor (let i = 1; i <= 10; i++) {\n  if (i === 5) {\n    break; // 当 i 为 5 时退出循环\n\
    \  }\n  if (i === 3) {\n    continue; // 当 i 为 3 时跳过本次迭代后续代码\n  }\n  console.log(\"\
    Value of i: \" + i);\n}\n```\n\n## 控制流实践\n\n现在我们理解了条件语句和循环，让我们探索一些它们的实际示例。\n\n\
    ### 示例 10：寻找偶数\n\n让我们编写一个寻找 1 到 10 之间偶数的程序。\n\n```javascript\n// 示例 10: 寻找偶数 \n\
    \nfor (let i = 1; i <= 10; i++) {\n  if (i % 2 === 0) {\n    console.log(i + \"\
    \ is an even number.\");\n  }\n}\n```\n\n输出：\n```\n2 is an even number.\n4 is\
    \ an even number.\n6 is an even number.\n8 is an even number.\n10 is an even number.\n\
    ```\n\n在示例 10 中，`for` 循环从 1 迭代到 10，`if` 语句检查 `i` 是否为偶数（即是否能被 2 整除）。\n\n### 示例\
    \ 11：数字之和\n\n让我们编写一个计算 1 到 100 数字之和的程序。\n\n```javascript\n// 示例 11: 数字之和 \n\n\
    let sum = 0;\n\nfor (let i = 1; i <= 100; i++) {\n  sum += i;\n}\n\nconsole.log(\"\
    The sum of numbers from 1 to 100 is: \" + sum);\n```\n\n输出：\n```\nThe sum of numbers\
