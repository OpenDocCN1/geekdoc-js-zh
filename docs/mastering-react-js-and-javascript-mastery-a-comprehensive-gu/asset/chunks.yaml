    \ Doe\"\n```\n\n在示例 7 中，我们使用构造函数 `Person` 来创建 `Person` 对象。我们在 `Person` 的原型上添加了\
    \ `sayHello()` 方法，所有 `Person` 对象都可以访问它。\n\n```javascript\n// 示例 8: 使用原型创建对象（使用类）\n\
