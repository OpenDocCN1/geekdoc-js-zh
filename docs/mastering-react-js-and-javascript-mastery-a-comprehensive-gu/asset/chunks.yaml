    # 6. `Symbol`: Introduced in ECMAScript 6 (ES6), symbols are unique and immutable
    data types often used as property keys in objects. For example:


    ```javascript

    const id = Symbol(''unique identifier'');

    ```


    Primitive data types are passed by value, meaning that when you assign a primitive
    value to a variable or pass it as an argument to a function, a copy of the value
    is created. Any changes made to the variable or the argument do not affect the
    original value.


    ## Reference Data Types


    Reference data types are more complex and mutable data types that hold references
    to memory locations where their values are stored. There are three primary reference
    data types in JavaScript:


    1. `Object`: Represents a collection of key-value pairs or properties. Objects
    can store various data types and even other objects. For example:


    ```javascript

    let person = {

    name: ''Alice'',

    age: 30,

    isStudent: false

    };

    ```


    2. `Array`: Represents a list-like collection of elements. Arrays can store multiple
    values, and each value is accessible using an index starting from 0. For example:


    ```javascript

    let fruits = [''apple'', ''banana'', ''orange''];

    ```


    3. `Function`: Represents reusable blocks of code that perform a specific task.
    Functions are fundamental in JavaScript as they enable code modularity and reusability.
    For example:


    ```javascript

    function add(a, b) {

    return a + b;

    }

    ```


    Reference data types are passed by reference, meaning that when you assign a reference
    value (such as an object or an array) to a variable or pass it as an argument
    to a function, you are actually assigning a pointer to the memory location where
    the value is stored. As a result, changes made to the variable or the argument
    can affect the original value since they both point to the same memory location.


    ## Variables in JavaScript


    Variables are essential in any programming language as they allow us to store
    and manipulate data. In JavaScript, variables serve as placeholders to hold different
    types of values. To declare a variable, we use the `var`, `let`, or `const` keyword,
    followed by the variable name. Here''s a brief explanation of each:


    ### `var` Keyword (Legacy Approach)


    In older versions of JavaScript, the `var` keyword was commonly used to declare
    variables. However, it has some limitations, such as hoisting and scope-related
    issues. Hoisting is a behavior where variable declarations are moved to the top
    of their scope during the code execution, which might lead to unexpected results.


    ```javascript

    // Example 1: Using var to declare a variable

    var age = 25;

    console.log(age); // Output: 25

    ```


    ### `let` and `const` Keywords (Modern Approach)


    With the introduction of ECMAScript 6 (ES6) in 2015, two new keywords, `let` and
    `const`, were added to declare variables. These keywords provide block-scoping,
    which addresses the scope-related problems of `var`.


    ```javascript

    // Example 2: Using let and const to declare variables

    let name = ''John Doe'';

    const PI = 3.14;

    console.log(name); // Output: John Doe

    console.log(PI); // Output: 3.14

    ```


    In Example 2, we use `let` to declare a variable `name` and `const` to declare
    a constant `PI`. The value of a variable declared with `let` can be changed, while
    the value of a constant declared with `const` remains fixed throughout the program
    execution.


    ### Rules for Naming Variables


    When naming variables in JavaScript, adhere to the following rules:


    - Variable names cannot start with a number.

    - Variable names can only contain letters, numbers, underscores (_), or dollar
    signs ($).

    - Variable names are case-sensitive, meaning `age`, `Age`, and `AGE` are considered
    different variables.

    - Avoid using reserved keywords (e.g., `let`, `if`, `else`, `function`, etc.)
    as variable names.


    ### Assigning Values to Variables


    You can assign values to variables using the assignment operator (`=`). This assigns
    the value on the right-hand side of the operator to the variable on the left-hand
    side.


    ```javascript

    // Example 3: Assigning values to variables

    let x = 10;

    let y = 20;

    console.log(x); // Output: 10

    console.log(y); // Output: 20

    ```


    ### Reassigning Variables


    Variables declared with `let` can be reassigned new values, while variables declared
    with `const` cannot be reassigned. Attempting to reassign a `const` variable will
    result in an error.


    ```javascript

    // Example 4: Reassigning variables with let

    let count = 5;

    count = 10;

    console.log(count); // Output: 10


    // Example 5: Attempting to reassign a const variable (will throw an error)

    const PI = 3.14;

    PI = 3.14159; // TypeError: Assignment to constant variable.

    ```


    ### Variable Scope


    Scope refers to the visibility or accessibility of variables within different
    parts of the code. In JavaScript, there are two main types of scope: global scope
    and local scope.


    #### Global Scope


    Variables declared outside any function or block have global scope, which means
    they can be accessed from anywhere within the code, including inside functions
    and blocks.


    ```javascript

    // Example 6: Global scope

    let globalVar = ''I am a global variable'';

    function myFunction() {

    console.log(globalVar); // Output: I am a global variable

    }

    myFunction();

    ```


    In Example 6, the variable `globalVar` has global scope.


    #### Local Scope


    Variables declared inside a function or block have local scope, which means they
    are only accessible within that function or block.


    ```javascript

    // Example 7: Local scope

    function myFunction() {

    let localVar = ''I am a local variable'';

    console.log(localVar); // Output: I am a local variable

    }

    myFunction();

    // console.log(localVar); // ReferenceError: localVar is not defined

    ```


    In Example 7, the variable `localVar` has local scope.


    ### Hoisting


    Hoisting is a behavior where variable declarations are moved to the top of their
    scope during the code execution. This means that you can use a variable before
    it is declared without causing an error.


    ```javascript

    // Example 8: Hoisting

    console.log(name); // Output: undefined

    var name = ''John Doe'';

    console.log(name); // Output: John Doe

    ```


    In Example 8, the first `console.log` statement outputs `undefined` because `name`
    is hoisted to the top, but its assignment (`name = ''John Doe''`) is not.


    ### Constants


    Constants, declared using the `const` keyword, are variables whose values cannot
    be changed once assigned. They have block scope, like variables declared with
    `let`, but are immutable.


    ```javascript

    // Example 9: Using constants

    const PI = 3.14;

    console.log(PI); // Output: 3.14

    // Attempting to reassign a constant (will throw an error)

    PI = 3.14159; // TypeError: Assignment to constant variable.

    ```


    In Example 9, `PI` is a constant with a value of `3.14`. Any attempt to reassign
    a new value to `PI` will result in a `TypeError`.


    ## Best Practices for Using Variables


    To write clean and maintainable code, follow these best practices when using variables:


    1. Use Descriptive Names: Choose meaningful names for variables that convey their
    purpose and content.

    2. Declare Variables Before Use: Always declare variables before using them to
    avoid hoisting-related issues.

    3. Use `const` for Constants: Prefer using `const` for variables whose values
    won''t change.

    4. Use `let` for Mutable Variables: Use `let` for variables that might change
    during the program execution.

    5. Avoid Global Variables: Minimize the use of global variables to prevent unintended
    side effects and maintain code modularity.

    6. Initialize Variables: Initialize variables with default values when declaring
    them to avoid unexpected behaviors.

