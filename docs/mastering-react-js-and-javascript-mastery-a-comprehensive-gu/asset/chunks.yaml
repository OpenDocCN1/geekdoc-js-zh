    - The `Route` component with the path `/user/:id` captures the user''s ID as a
    route parameter.


    - When a user clicks a link, the `UserProfile` component is rendered with the
    appropriate user data.


    ## Nested Routes and Layouts


    React Router allows you to create nested routes, enabling more complex navigation
    structures. You can use this feature to create layouts that are consistent across
    multiple views while changing the content dynamically.


    ### Nested Routes Example


    Let''s create an example of nested routes to illustrate how they work. We''ll
    have a layout with a header and sidebar that remains consistent across different
    sections of an app, while the content changes based on the selected route.


    ```jsx


    // src/App.js


    import React from ''react'';


    import { BrowserRouter as Router, Route, Link } from ''react-router-dom'';


    // Components for different views


    const Home = () => <h2>Home Page</h2>;


    const About = () => <h2>About Page</h2>;


    const Contact = () => <h2>Contact Page</h2>;


    // Sidebar component


    const Sidebar = () => (


    <nav>


    <ul>


    <li>


    <Link to="/app/home">Home</Link>


    </li>


    <li>


    <Link to="/app/about">About</Link>


    </li>


    <li>


    <Link


    to="/app/contact">Contact</Link>


    </li>


    </ul>


    </nav>


    );


    // Layout component


    const Layout = ({ children }) => (


    <div>


    <header>


    <h1>My App</h1>


    </header>


    <div className="content">


    <Sidebar />


    <main>{children}</main>


    </div>


    </div>


    );


    function App() {


    return (


    <Router>


    <Route


    path="/app"


    render={({ match }) => (


    <Layout>


    <Route path={`${match.url}/home`} component={Home} />


    <Route path={`${match.url}/about`} component={About} />


    <Route path={`${match.url}/contact`} component={Contact} />


    </Layout>


    )}


    />


    </Router>


    );


    }


    export default App;


    ```


    In this example:


    - We have three views: Home, About, and Contact, each represented by a component.


    - We create a `Sidebar` component that contains navigation links to these views.


    - We create a `Layout` component that includes a header and a sidebar. The `children`
    prop represents the content that will be displayed within the layout.


    - Within the `App` component, we set up nested routes under the path `/app`. These
    nested routes render the appropriate view components within the `Layout`.


    With this setup, we have a consistent layout for our app, with a changing content
    area based on the selected route.


    ## Programmatic Navigation


    In addition to using `Link` components for navigation, you can also perform programmatic
    navigation in response to user actions or other events.


    React Router provides a `history` object that allows you to navigate programmatically.
    Here''s an example of how to use it:


    ```jsx


    import React from ''react'';


    import { BrowserRouter as Router, Route, Link } from ''react-router-dom'';


    const Home = () => (


    <div>


    <h2>Home Page</h2>


    <button onClick={() => navigateToAbout()}>Go to About</button>


    </div>


    );


    const About = ({ history }) => {


    const navigateToHome = () => {


    history.push(''/''); // Navigate to the home page


    };


    return (


    <div>


    <h2>About Page</h2>


    <button onClick={navigateToHome}>Go to Home</button>


    </div>


    );


    };


    function App() {


    return (


    <Router>


    <div>


    <nav>


    <ul>


    <li>


    <Link to="/">Home</Link>


    </li>


    <li>


    <Link to="/about">About</Link>


    </li>


    </ul>


    </nav>


    <Route path="/" exact component={Home} />


    <Route path="/about" component={About} />


    </div>


    </Router>


    );


    }


    export default App;


    ```


    In this example:


    - We use the `history` object that React Router provides as a prop to the `About`
    component.


    - Inside the `About` component, we define a `navigateToHome` function that uses
    `history.push(''/'')` to navigate to the home page.


    - We also have a button in the `Home` component that triggers the `navigateToAbout`
    function to navigate to the about page.


    With programmatic navigation, you can control the flow of your application based
    on user interactions or other events.


    ## Protected Routes and Authentication


    In real-world applications, you often need to protect certain routes to ensure
    that only authenticated users can access them. React Router allows you to implement
    protected routes easily.


    Here''s an example of how to create a protected route:


    ```jsx


    import React, { useState } from ''react'';


    import { BrowserRouter as Router, Route, Link, Redirect } from ''react-router-dom'';


    // Dummy authentication function


    const isAuthenticated = () => {


    // Check if the user is authenticated (e.g., by verifying a token)


    return localStorage.getItem(''token'') !== null;


    };


    const Home = () => <h2>Home Page</h2>;


    const Dashboard = () => <h2>Dashboard (Protected)</h2>;


    const Login = ({ setIsAuthenticated }) => {


    const handleLogin = () => {


    // Simulate a successful login


    localStorage.setItem(''token'', ''myAuthToken'');


    setIsAuthenticated(true);


    };


    return (


    <div>


    <h2>Login Page</h2>


    <button onClick={handleLogin}>Log In</button>


    </div>


    );


    };


    function App() {


    const [isAuthenticated, setIsAuthenticated] = useState(false);


    return (


    <Router>


    <div>


    <nav>


    <ul>


    <li>


    <Link to="/">Home</Link>


    </li>


    <li>


    <Link to="/dashboard">Dashboard</Link>


    </li>


    <li>


    <Link to="/login">Login</Link>


    </li>


    </ul>


    </nav>


    <Route path="/" exact component={Home} />


    <Route path="/login" render={() => <Login setIsAuthenticated={setIsAuthenticated}
    />} />


    <Route


    path="/dashboard"


    render={() =>


    isAuthenticated ? <Dashboard /> : <Redirect to="/login" />


    }


    />


    </div>


    </Router>


    );


    }


    export default App;


    ```


