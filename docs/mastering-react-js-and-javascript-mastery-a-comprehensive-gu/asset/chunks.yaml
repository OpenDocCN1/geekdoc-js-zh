    ## Lists and Rendering Multiple Elements


    Lists are a fundamental part of many applications, and React provides the means
    to efficiently render and manipulate lists of data. Whether you''re rendering
    a list of items, generating dynamic navigation menus, or displaying user-generated
    content, understanding how to work with lists in React is crucial.


    ### Rendering a List of Items


    To render a list of items in React, you typically map over an array of data and
    create React elements for each item. Let''s consider an example where we have
    an array of names and want to render them in a list:


    ```jsx


    class ListRenderingExample extends React.Component {


    render() {


    const names = [''Alice'', ''Bob'', ''Charlie'', ''David''];


    const nameList = names.map((name, index) => (


    <li key={index}>{name}</li>


    ));


