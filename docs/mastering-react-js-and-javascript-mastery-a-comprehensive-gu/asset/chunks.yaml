    # # Chapter 4: Functions and Scope


    In Chapter 3, we explored control flow and loops, which allow us to make decisions
    and repeat code execution. Now, we''ll dive into functions, a fundamental concept
    in JavaScript. Functions are blocks of code that can be defined and executed multiple
    times. They play a crucial role in organizing and reusing code, making it more
    modular and maintainable. Additionally, we''ll discuss scope, which defines the
    accessibility of variables within different parts of the code. Understanding functions
    and scope is essential for becoming a proficient JavaScript developer. Let''s
    get started!


    ## Functions: Reusable Blocks of Code


    A function is a reusable block of code designed to perform a specific task or
    calculation. Functions help break down complex problems into smaller, manageable
    pieces, making the code more organized and easier to maintain.


    ### Defining Functions:


    To define a function, we use the `function` keyword, followed by the function
    name, a pair of parentheses, and a pair of curly braces that contain the function''s
    code.


    ```javascript


    // Example 1: Defining a function


    function greet() {


    console.log("Hello, world!");


    }


    ```


    In Example 1, we define a function named `greet()` that prints "Hello, world!"
    when called.


    ### Calling Functions:


    To execute a function and perform the actions defined inside it, we call the function
    by its name followed by a pair of parentheses.


    ```javascript


    // Example 2: Calling a function


    greet(); // Output: "Hello, world!"


    ```


    In Example 2, we call the `greet()` function, which then prints "Hello, world!"
    to the console.


    ### Function Parameters:


    Functions can take inputs called parameters, which allow them to work with different
    data values.


    ```javascript


    // Example 3: Function with parameters


    function greetUser(name) {


    console.log("Hello, " + name + "!");


    }


    greetUser("John"); // Output: "Hello, John!"


    greetUser("Alice"); // Output: "Hello, Alice!"


    ```


    In Example 3, we define a function `greetUser()` that takes a `name` parameter
    and prints a personalized greeting.


    ### Return Statement:


    Functions can also produce outputs using the `return` statement. The `return`
    statement specifies the value the function should return.


    ```javascript


    // Example 4: Function with a return statement


    function add(a, b) {


    return a + b;


    }


    let sum = add(3, 5);


    console.log(sum); // Output: 8


    ```


    In Example 4, the `add()` function takes two parameters `a` and `b`, and it returns
    their sum.


    ### Anonymous Functions (Function Expressions):


    Functions can be defined without a name and assigned to variables. These are known
    as anonymous functions or function expressions.


    ```javascript


    // Example 5: Anonymous function


    const multiply = function(a, b) {


    return a * b;


    };


    console.log(multiply(2, 4)); // Output: 8


    ```


    In Example 5, we assign an anonymous function to the variable `multiply` and then
    call the function with arguments `2` and `4`.


    ### Arrow Functions (ES6):


    Arrow functions provide a shorter syntax for defining functions, especially useful
    for one-liners. They use the `=>` syntax.


    ```javascript


    // Example 6: Arrow function


    const square = (x) => x * x;


    console.log(square(3)); // Output: 9


    ```


    In Example 6, we define an arrow function `square` that takes a parameter `x`
    and returns its square.


    ## Scope: Understanding Variable Accessibility


    Scope in JavaScript defines the visibility and accessibility of variables within
    different parts of the code. Understanding scope is essential to avoid unintended
    side effects and to write clean and bug-free code. JavaScript has two main types
    of scope: global scope and local scope.


    ### Global Scope:


    Variables declared outside any function or block have global scope, making them
    accessible from anywhere in the code.


    ```javascript


    // Example 7: Global scope


    let globalVar = "I am a global variable";


    function myFunction() {


    console.log(globalVar);


    }


    myFunction(); // Output: "I am a global variable"


    ```


    In Example 7, the variable `globalVar` has global scope, and we can access it
    from within the `myFunction` function.


    ### Local Scope:


    Variables declared inside a function or block have local scope, meaning they are
    only accessible within that specific function or block.


    ```javascript


    // Example 8: Local scope


    function myFunction() {


    let localVar = "I am a local variable";


    console.log(localVar);


    }


    myFunction(); // Output: "I am a local variable"


    // console.log(localVar); // ReferenceError: localVar is not defined


    ```


    In Example 8, the variable `localVar` has local scope and can only be accessed
    from within the `myFunction` function. Attempting to access it outside the function
    will result in a `ReferenceError`.


    ### Nested Scope:


    Functions can be defined inside other functions, creating nested scopes.


    ```javascript


    // Example 9: Nested scope


    function outerFunction() {


    let outerVar = "I am from outer function";


    function innerFunction() {


    let innerVar = "I am from inner function";


    console.log(outerVar + " and " + innerVar);


    }


    innerFunction();


    }


    outerFunction(); // Output: "I am from outer function and I am from inner function"


    ```


    In Example 9, the `outerFunction` has a local variable `outerVar`, and inside
    it, we define the `innerFunction`, which has its own local variable `innerVar`.
    The inner function can access both `outerVar` and `innerVar`.


    ### Block Scope (let and const):


    With the introduction of `let` and `const` in ES6, block scope was introduced
    to solve the issues with `var` hoisting. Variables declared with `let` and `const`
    have block scope, making them accessible only within the block where they are
    declared.


    ```javascript


    // Example 10: Block scope


    {


    let blockVar = "I am a block-scoped variable";


    console.log(blockVar);


    }


    // console.log(blockVar); // ReferenceError: blockVar is not defined


    ```


    In Example 10, the variable `blockVar` is declared inside a block, and it is only
    accessible within that block.


    ### Function Scope (var):


    Variables declared with `var` have function scope, meaning they are accessible
    within the entire function where they are declared.


    ```javascript


    // Example 11: Function scope (var)


    function myFunction() {


    if (true) {


    var functionVar = "I am a function-scoped variable";


    }


    console.log(functionVar);


    }


    myFunction(); // Output: "I am a function-scoped variable"


    // console.log(functionVar); // ReferenceError: functionVar is not defined


    ```


    In Example


    11, the variable `functionVar` is declared inside the function and is accessible
    within the entire function, even if it''s declared inside a block.


    ## Function Scope and Closure:


    JavaScript supports closures, which allow functions to "remember" the variables
    in their lexical scope, even when they are executed outside that scope.


    ```javascript


    // Example 12: Function scope and closure


    function outerFunction() {


    let outerVar = "I am from outer function";


    function innerFunction() {


    console.log(outerVar);


    }


    return innerFunction;


    }


    const closureFunction = outerFunction();


    closureFunction(); // Output: "I am from outer function"'
