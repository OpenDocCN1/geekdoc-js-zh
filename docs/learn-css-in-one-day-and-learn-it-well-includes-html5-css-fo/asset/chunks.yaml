- fmt: "\n## 7. Modify the CSS property `text-align` and observe what happens to the\
    \ sample text. By default, the text in this paragraph is left aligned. Now try\
    \ each of the following:\n\n(a) `text-align: justify;`\n\n(b) `text-align: right;`\n\
    \n(c) `text-align: center;`\n\n## 8. Modify the CSS property `text-decoration`\
    \ and observe what happens to the sample text. Try\n\n(a) `text-decoration: underline;`\n\
    \n(b) `text-decoration: overline;`\n\n(c) `text-decoration: line-through;`\n\n\
    ## 9. Modify the CSS property `letter-spacing` and observe what happens to the\
    \ sample text. Try\n\n(a) `letter-spacing: 5px;`\n\n(b) `letter-spacing: -5px;`\n\
    \n## 10. Change `letter-spacing` back to `0px`. Modify the CSS property `word-spacing`\
    \ and observe what happens to the sample text. Try\n\n(a) `word-spacing: 10px;`\n\
    \n(b) `word-spacing: -20px;`\n\n## 11. Change `word-spacing` back to `0px`. Modify\
    \ the CSS property `line-height` and observe what happens to the sample text.\
    \ Try\n\n(a) `line-height: 2;`\n\n(b) `line-height: 25px;`\n\n(c) `line-height:\
    \ 30%;`\n\n# Chapter 9: Lists, Links and Navigation Bars\n\nIn this chapter, we’ll\
    \ be looking at CSS properties for styling hyperlinks and lists. In addition,\
    \ we’ll combine both concepts and discuss how to create navigation bars commonly\
    \ seen on web pages. Ready? Let’s first start with CSS list.\n\n### CSS Lists\n\
    \nRecall that in HTML, we can create two different types of list: ordered list\
    \ and unordered list? We can style these lists using CSS list properties.\n\n\
    #### list-style-type\n\nThe `list-style-type` property allows you to set list\
    \ item markers for your lists. List item markers refer to those bullets/numbers/letters\
    \ on the left of each list item.\n\nFor ordered lists, we can specify the type\
    \ of numbers or letters we want to use as markers. For instance, if we want to\
    \ use roman numbers (e.g. i, ii, iii) as item markers, we can write `list-style-type:\
    \ lower-roman;`.\n\nOther commonly used markers include:\n\n- `decimal` (this\
    \ is the default),\n- `decimal-leading-zero` (number with a leading zero, e.g.\
    \ 01, 02..),\n- `lower-alpha` (e.g. a, b, c..),\n- `lower-greek` (e.g. α, β, γ..),\n\
    - `upper-alpha` (e.g. A, B, C..) and\n- `upper-roman` (e.g. I, II, III…).\n\n\
    For unordered list, you can specify the shape that you want to use as the bullet.\
    \ The default marker is a `disc` (a filled circle). You can change that to either\
    \ a `square` or a `circle`.\n\nIn addition, you can also choose not to use any\
    \ item marker for your list. To do that, you write `list-style-type: none;`. This\
    \ is commonly done when creating navigation bars.\n\nExamples:\n\n- `list-style-type:\
    \ lower-roman;`\n- `list-style-type: circle;`\n- `list-style-type: none;`\n\n\
    #### list-style-image\n\nIf you do not fancy any of the provided list styles,\
    \ you can choose to use an image as the list item marker. To do that, you use\
    \ the `list-style-image` property to specify the url of the image to use.\n\n\
    Examples:\n\n- `list-style-image: url(‘myMarker.gif’);`\n\n#### list-style-position\n\
    \nThe `list-style-position` property is used to specify whether the list item\
    \ markers should appear inside or outside the content flow. There are two acceptable\
    \ values: `inside` and `outside`.\n\nBy default, list items are displayed with\
    \ a certain amount of indentation. If `list-style-position` is set to `inside`,\
    \ the list item markers are displayed after the indentation. The indentation is\
    \ represented by the left edge of the boxes in the image below. If `list-style-position`\
    \ is set to `outside`, the markers are displayed before the indentation. ![](images/00004.jpg)\n\
    \nIn other words, `list-style-position: inside` will result in more indentation\
    \ than `list-style-position: outside`. The default position is `outside`.\n\n\
    Examples:\n\n- `list-style-position: outside;`\n\n#### list-style\n\n`list-style`\
    \ is a shorthand property for setting all the list properties (i.e. `list-style-type`,\
    \ `list-style-position` and `list-style-image`) in one declaration. If any value\
    \ is missing, the default value for the missing property will be used.\n\nExamples:\n\
    \n- `list-style: square inside url(\"myMarker.gif\");`\n\n### CSS Links\n\nHyperlinks\
    \ can be styled using any of the CSS properties discussed in previous chapters.\
    \ You can style the background color using the `background-color` property. This\
    \ will give the link a highlighted appearance. You can also use the text and font\
    \ properties covered in Chapter 8 to change the font size, font style, text color,\
    \ text decoration etc.\n\nIn addition, we can choose to style hyperlinks based\
    \ on the state. Links can be in four states:\n\n- `link` (an unvisited link)\n\
    - `visited` (a visited link)\n- `hover` (when the user mouses over it)\n- `active`\
    \ (when the link is clicked)\n\nTo specify the state, we write:\n\n```css\na:link\
    \ { ... }\na:visited { ... }\na:hover { ... }\na:active { ... }\n```\n\n### Navigation\
    \ Bars\n\nNavigation bars are commonly created as an unordered list. Let’s try\
    \ our own menu.\n\n```html\n<ul>\n  <li><a href=\"home.html\">Home</a></li>\n\
    \  <li><a href=\"html.html\">HTML Tutorial</a></li>\n  <li><a href=\"csst.html\"\
    >CSS Tutorial</a></li>\n  <li><a href=\"javascript.html\">Javascript Tutorial</a></li>\n\
    </ul>\n```\n\nNext, we need to remove the bullet from the list.\n\n```css\nul\
    \ {\n  list-style-type: none;\n}\n```\n\nNow, we have to style the hyperlinks.\n\
    \n```css\na {\n  display: block;\n  width: 160px;\n  text-align: center;\n  text-decoration:\
    \ none;\n  background-color: #0000FF;\n}\n\na:link {\n  color: #0000FF;\n}\n\n\
    a:visited {\n  color: #00FF00;\n}\n\na:hover {\n  color: #FFFF00;\n}\n\na:active\
    \ {\n  color: #FF00FF;\n}\n```\n\nFinally, if we want the navigation bar to be\
    \ a horizontal bar, we need to float the list items.\n\n```css\nli {\n  float:\
    \ left;\n}\n```\n\nThere you go! We’ve just created a simple horizontal navigation\
    \ bar. The source code for this navigation bar is given as part of the exercise.\
    \ Play around with it and try to make it visually appealing. You can also specify\
    \ different styles for the four link states.\n"
