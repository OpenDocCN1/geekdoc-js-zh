    \ highlighted in yellow right?\n\n> 11. Next, we’ll narrow down our selection\
    \ based on HTML attributes. Try selecting the link with `href=\"http://www.learncodingfast.com\"\
    `. The correct way to do this is with square brackets as follows:\n\n> \n\n> `a[hr``ef=”`[`http://www.learncodingfast.com`](http://www.learncodingfast.com/)`”]`\n\
    \n> \n\n> Try it. Only the first link will have a yellow background now.\n\n>\
    \ 12. Next, we’ll use the pseudo-class selector to change the background color\
    \ of all link elements when we hover over them. Try changing\n\n> \n\n> `a[``href=”`[`http://www.learncodingfast.com`](http://www.learncodingfast.com/)`”]`\n\
    \n> \n\n> to\n\n>  \n\n> `a:hover`\n\n> \n\n> Save the file and refresh the browser.\
    \ Notice that nothing is selected? Now hover your mouse over any of the hyperlinks\
    \ and observe what happens.\n\n> 13. Next, let’s try to select the second child\
    \ element of the `div` element. You do that by changing the selector to\n\n> \n\
    \n> `p:nth-child(2)`\n\n> 14. Now, let’s try selecting the first letter of all\
    \ `<p>` elements. You use the pseudo-element `first-letter` to do that. Change\
    \ the selector to\n\n> \n\n> `p::first-letter`\n\n> 15. Next, let’s look at what\
    \ happens when an element has more than one classes. Change the selector back\
    \ to `.myClassPara` and add the following CSS code just before the `</style>`\
    \ tag.\n\n> \n\n> `.mySecondClassPara {`\n\n> `       text-decoration: underline;`\n\
    \n> `}`\n\n> \n\n> Notice which paragraph is both yellow in background AND underlined.\
    \ This is because that paragraph has two classes: `myClassPara` and `mySecondClassPara`.\
    \ Therefore, both rules apply to it.\n\n> 16. Finally, let’s try adding an exclamation\
    \ mark to the end of all `<p>` elements. We’ll use the `after` pseudo-element\
