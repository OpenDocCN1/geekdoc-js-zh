    \ \n\n> `p::after{`\n\n> `       content: “!”;`\n\n> `}`\n\nChapter 4: CSS Box\
    \ Model\n\nSo far, we’ve covered the basics of HTML and CSS. In this chapter,\
    \ we’ll start to do some actual CSS coding. Specifically, we’ll learn about the\
    \ CSS box model and look at how we can modify the look and feel of a box in CSS.\n\
    \nWhat is the CSS Box Model\n\nAll elements in CSS are treated as boxes. CSS boxes\
