  trans: "\n\n如果这些段落包含在 `div` 框之后的 HTML 文档中，我们将得到下面的图。这些段落将仅仅“挤入”任何可用的空间。\n\n![](img/00006.jpg)\n\
    \n如果你不希望发生这种情况，可以使用 `clear: both` 属性来清除浮动。要这样做，请在 CSS 声明中添加以下内容：\n\n```css\n.clearFloat\
    \ { clear: both; }\n```\n\n要使用此类，我们将其添加到第一个 `<p>` 标签中：\n\n```html\n<p class=\"\
    clearFloat\">这是某段未浮动的文本。</p>\n```\n\n你只需要在第一个 `<p>` 标签上添加 `clearFloat` 类。一旦清除了浮动，文本将不再环绕这些框布局。\n\
    \n这就是 CSS 中定位和浮动的的工作原理精要。我强烈建议你尝试本章节的练习题，以更好地理解这两个概念。\n\n## 练习 5\n\n从 [`learncodingfast.com/css`](http://learncodingfast.com/css)\
    \ 下载此练习的源代码并解压文件。该练习的源代码可以在 `Chapter 5 - Positioning and Floating` 文件夹中找到。\n\n\
    ### 练习 5.1\n\n> 1. 在浏览器和文本编辑器中同时打开 `Chapter 5 - Positioning.html` 文件。\n\n> 2.\
    \ 为 `#box1` 和 `#box2` 的 CSS 声明添加规则 `position: static;`，并观察两个框的位置发生了什么变化。\n\n>\n\
    > 没有任何变化，对吧？那是因为所有 HTML 元素默认都使用 `static` 定位。\n\n> 3. 从 `#box1` 和 `#box2` 的 CSS\
    \ 声明中移除规则 `position: static;`。在 `#box2` 的 CSS 声明中添加以下几行。\n\n```css\nposition:\
    \ relative;\ntop: 50px;\nleft: 70px;\n```\n\n> 观察第二个框的位置发生了什么变化。 3. 它现在距离顶部 50px，距离其正常位置左侧\
    \ 70px。\n\n> 尝试对 `top` 和 `left` 属性使用不同的值，观察 `box2` 位置发生的变化。也尝试使用负值。你也可以尝试使用 `right`\
    \ 和 `bottom` 属性。\n\n> 4. 现在将 `#box2` 的 CSS 声明改回\n\n```css\nposition: relative;\n\
    top: 50px;\nleft: 70px;\n```\n\n> 注意到文本被红色框部分遮挡了吗？\n\n> 如果你想让文本出现在红色框前面，请在 `p`\
    \ 的 CSS 声明中添加以下几行。\n\n```css\nposition: relative;\nz-index: 2;\n```\n\n> 你可以将位置设置为\
    \ `relative`、`absolute` 或 `fixed`。只要不是 `static` 即可。\n\n> 接下来，为 `#box2` 的 CSS 声明添加行\
    \ `z-index: 1;`。刷新页面。现在文本应该在红色框前面了，因为文本的 `z-index` 大于红色框的 `z-index`。\n\n> 如果你想让红色框反出现在文本前面，只需将\
    \ `#box2` 的 `z-index` 改为大于 2 的值即可。\n\n> 5. 现在，将 `#box1` 的高度改为 `5000px`，并将 `#box2`\
    \ 的定位改为 `fixed`（`position: fixed;`）。\n\n> 滚动页面。 5. 红色框没有移动，因为它现在使用了固定定位。\n\n>\
    \ 6. 将 `#box2` 的定位改回 `relative`，并将 `#box1` 的高度改回 `100px`。在文件底部的 HTML 代码中的 `<p>`\
    \ 标签之前添加以下行。\n\n```html\n<div id=\"box3\"></div>\n```\n\n现在添加以下 CSS 声明来样式化 `box3`。\n\
    \n```css\n#box3 {\n  position: absolute;\n  top: 50px;\n  left: 150px;\n  background-color:\
    \ yellow;\n  width: 50px;\n  height: 50px;\n  padding: 20px;\n  border: 5px dotted\
    \ black;\n  margin: 10px;\n}\n```\n\n> `box3` 使用 `absolute` 定位，由于它不是任何 `<div>`\
    \ 元素的子元素，因此它是相对于页面定位的。也就是说，它距离页面顶部 50px，距离左侧 150px。\n\n> 7. 现在将三个框的 `<div>` 代码改为以下内容：\n\
    \n```html\n<div id=\"box1\"> </div>\n<div id=\"box2\">\n    <div id=\"box3\"></div>\n\
    </div>\n```\n\n> `box3` 现在是 `box2` 的子元素。因此，它是相对于 `box2` 定位的。\n\n### 练习 5.2\n\n\
    > 1. 在浏览器和文本编辑器中同时打开 `Chapter 5 - Positioning.html` 文件。\n\n> 2. 为 `#box1` 和 `#box2`\
    \ 的 CSS 声明添加规则 `position: static;`，并观察两个框的位置发生了什么变化。\n\n> 3. 从 `#box1` 和 `#box2`\
    \ 的 CSS 声明中移除规则 `position: static;`。在 `#box2` 的 CSS 声明中添加以下几行。\n\n> 4. 现在将 `#box2`\
    \ 的 CSS 声明改回 `position: relative; top: 50px; left: 70px;`。注意到文本被红色框部分遮挡了吗？\n\n\
    > 5. 如果你想让文本出现在红色框前面，请在 `p` 的 CSS 声明中添加以下行：`position: relative; z-index: 2;`。\n\
    \n> 6. 接下来，为 `#box2` 的 CSS 声明添加行 `z-index: 1;`。刷新页面。现在文本应该在红色框前面了，因为文本的 `z-index`\
    \ 大于红色框的 `z-index`。\n\n> 7. 如果你想让红色框反出现在文本前面，只需将 `#box2` 的 `z-index` 改为大于 2 的值即可。\n\
    \n> 8. 现在，将 `#box1` 的高度改为 `5000px`，并将 `#box2` 的定位改为 `fixed`（`position: fixed;`）。\n\
    \n> 9. 滚动页面。红色框没有移动，因为它现在使用了固定定位。\n\n> 10. 将 `#box2` 的定位改回 `relative`，并将 `#box1`\
    \ 的高度改回 `100px`。在文件底部的 HTML 代码中的 `<p>` 标签之前添加以下行：`<div id=\"box3\"></div>`。\n\n\
    > 11. 现在添加以下 CSS 声明来样式化 `box3`。`box3` 使用 `absolute` 定位，由于它不是任何 `<div>` 元素的子元素，因此它是相对于页面定位的。\n\
    \n> 12. 现在将三个框的 `<div>` 代码改为嵌套结构。`box3` 现在是 `box2` 的子元素。因此，它是相对于 `box2` 定位的。\n\
    \n"
- fmt: "\n> Nothing changes right? The yellow box is declared as an inline element.\
    \ Hence it will only take up as much width and height as it needs. In fact, you\
    \ can remove the height and width properties and nothing will change.\n\n> 3.\
    \ Now change the display property of `#displaydemo` from `display: inline;` to\
    \ `display: block;`. What happens?\n\n> The yellow box is now displayed as a block\
    \ element. It starts and ends with a new line. If you have declared its width\
    \ and height, the width and height will be the values you specified. If you have\
    \ not specified its width and height, the yellow box will occupy the full width\
    \ of the page. It will take up as much height as it needs.\n\n> 4. Try changing\
    \ the height and width in the CSS declaration for `#displaydemo`. Observe what\
    \ happens.\n\n> 5. Now, let’s move on to the `visibility` property. Change the\
    \ CSS declaration of `#magic` from `display: inline;` to `visibility: hidden;`.\
    \ Observe what happens to the word 'magic' in the blue sentence.\n\n> 6. Next,\
    \ change the CSS declaration of `#magic` from `visibility: hidden;` to `display:\
    \ none;`. Observe what happens.\n\n# Chapter 7: Background\n\nIn this chapter,\
    \ we’ll learn how to change the background properties of an element. These properties\
    \ include changing its background color and background image.\n\nFor a start,\
    \ let us first look at how to change the background color.\n\n## Background Color\n\
    \nTo declare the background color of an element, we use the `background-color`\
    \ property. Similar to how we specify the border color of our CSS boxes, we can\
    \ declare the background color of an element using one of three notations: color\
    \ name, rgb notation or hexadecimal notation.\n\nExamples:\n\n```\nbackground-color:\
    \ green;\nbackground-color: rgb(0, 255, 0);\nbackground-color: #00FF00;\n```\n\
    \n## Background Image\n\nIf you find it plain to just use color as the background\
    \ of an element, you can choose to use an image. CSS allows us great flexibility\
    \ in how we want the image to be displayed.\n\n### background-image\n\nTo use\
    \ an image as the background, we specify the URL to the image using the `background-image`\
    \ property.\n\nExample:\n\n```\nbackground-image: url(“image1.jpg”);\n```\n\n\
    ### background-repeat\n\nBy default, the background image is placed at the top-left\
    \ corner of the element, and repeated both vertically and horizontally. If you\
    \ do not want the background image to be repeated, you can use the `background-repeat`\
    \ property to change it. The following list shows some commonly used values for\
    \ the `background-repeat` property:\n\n- `repeat`: This is the default. Image\
    \ will be repeated horizontally and vertically.\n- `repeat-x`: Image will only\
    \ be repeated horizontally.\n- `repeat-y`: Image will only be repeated vertically.\n\
    - `no-repeat`: Image will not be repeated.\n\nExample:\n\n```\nbackground-repeat:\
    \ repeat-x;\n```\n\n### background-attachment\n\nThe `background-attachment` property\
    \ specifies whether the background image should be fixed or scroll with the page.\
    \ The two commonly used values are `fixed` and `scroll`. The default is `scroll`.\
    \ Try the exercise at the end of this chapter to see how this works.\n\nExample:\n\
    \n```\nbackground-attachment: scroll;\n```\n\n### background-position\n\nThe `background-position`\
    \ property is very useful if you want to specify which area of the background\
    \ image you want to display.\n\nSuppose you have an element with width and height\
    \ 100px each. If the background image that you use has width 200px and height\
    \ 300px, only a portion of the background image will be displayed as the image\
    \ is larger than the size of the element.\n\n![](images/00009.jpg)\n\nFor instance,\
    \ if you use the image above (200px by 300px) as the background image of a 100px\
    \ by 100px element, only Area A (top left) will be displayed by default. What\
    \ if you want to display Area F instead? To do that, you need to change the value\
    \ of the `background-position` property.\n\nThe most common way to specify the\
    \ `background-position` value is to use pixels. The syntax is:\n\n```\nbackground-position:\
    \ xpos ypos;\n```\n\nTo understand how this syntax works, let’s imagine a piece\
    \ of cardboard with a 100px by 100px hole in the middle. This hole in the cardboard\
    \ represents the HTML element. Now imagine your background image is underneath\
    \ that cardboard. By default, the image will be aligned such that Area A is shown\
    \ through the hole in the cardboard. If you want to display Area F instead, you\
    \ have to shift the image (not the cardboard) 100px to the left and 200px up.\
    \ To achieve this with CSS, you write:\n\n```\nbackground-position: -100px -200px;\n\
    ```\n\nThe first number (`-100px`) shifts the image horizontally. If this number\
    \ is positive, the image is shifted to the right. If negative, it is shifted to\
    \ the left.\n\nThe second number (`-200px`) shifts the image vertically. If this\
    \ number is positive, the image is shifted down. If negative, it is shifted up\
    \ up.\n\nThe best way to understand this concept is to try the exercises for this\
    \ Chapter. I strongly encourage you to do them before moving on to Chapter 8.\n\
    \n## Exercise 7\n\nDownload the source code for this exercise from [http://learncodingfast.com/css](http://learncodingfast.com/css)\
    \ and unzip the file. The source code for this exercise can be found in the Chapter.\n\
    \n### Exercise 7.1\n\n1. Download the source code for this exercise from [http://learncodingfast.com/css](http://learncodingfast.com/css)\
    \ and unzip the file. The source code for this exercise can be found in the Chapter.\n\
    2. Open the `7 - Background.html` file in your browser. Notice what happens as\
    \ you scroll.\n3. In the `body` element, change `background-attachment: fixed;`\
    \ to `background-attachment: scroll;`. Notice what happens to the logo.\n4. Next,\
    \ change `background-repeat: repeat;` to:\n   - (a) `repeat-x;`\n   - (b) `no-repeat;`\n\
    \   - (c) `repeat-y;`\n   Notice what happens in each case.\n5. Next, change `background-color:\
    \ white;` to `background-color: #0000FF;`. This should change the background color\
    \ of the page.\n6. Finally, we are going to look at the `backgroundposition` property.\
    \ The image used in this example is ‘backgroundposition.png’ stored in the same\
    \ folder. Have a look at the image before proceeding.\n7. Notice that when `background-position`\
    \ is set to `0 0` (the default), area A is displayed. Changing the `background-position`\
    \ property will shift the background image with reference to area A.\n8. In the\
    \ CSS CSS for `#box1`, change `background-position: 0 0;` to:\n   - (a) `background-position:\
    \ -100px 0;`\n   - (b) `background-position: 100px 0;`\n   - (c) `background-position:\
    \ 0 -100px;`\n   - (d) `background-position: 0 100px;`\n   - (e) `background-position:\
    \ -100px -100px;`\nTry to figure out which area you’ll get.\n\n# Chapter 8: Text\
    \ and Font\n\nText and font properties in CSS are used to format the appearance\
    \ of words and text on a webpage. The `font` property is concerned with how the\
    \ characters look, such as whether they are ‘fat’ or ‘thin’, ‘big’ or ‘small’,\
    \ and what font type to use. The `text` property is used to style everything else.\
    \ In this chapter, we’ll be covering the `text` and `font` properties commonly\
    \ used.\n\n## Font Properties\n\nfont-family\n\nThe `font-family` property is\
    \ used to set the font type.\n"
