  trans: "\n\n> 刷新浏览器。什么都没有变化吧？那是因为 `list-style-position: outside;` 是默认值。现在将 `list-style-position:\
    \ outside;` 改为 `list-style-position: inside;`。你会发现无序列表向右稍微移动了（即缩进变大了）。\n\n> 5.\
    \ 移除 `ul` 的 `list-style-type` 属性，并改用以下属性：\n\n> (a) `list-style-image: url(\"myMarker.gif\"\
    );`\n\n> 观察“Cars Unordered List”发生了什么变化。\n\n> 6. 现在让我们来看看如何为超链接样式。尝试在指定的选择器中添加以下规则：\n\
    \n> (a) 在 `a:link{}` 中添加 `color: green;`，并观察“Click Me”链接发生了什么变化。\n\n> (b) 在 `a:active{}`\
    \ 中添加 `font-size: 2em;` 并点击该链接。\n\n> (c) 在 `a:hover{}` 中添加 `background-color:\
    \ red;` 并将鼠标悬停在链接上。\n\n## 练习 9.2\n\n1. 在浏览器和文本编辑器中同时打开 `Chapter 9 - Navigation\
    \ Bar.html` 文件。\n2. 此页面展示了如何使用列表和链接的 CSS 规则创建一个水平导航栏的示例。书中解释了这些步骤。学习代码并尝试修改 CSS\
    \ 声明以改进此导航栏的设计。\n\n## 第 10 章：表格\n\nHTML 表格默认看起来并不好看。然而，通过一些简单的 CSS 样式，我们可以轻松地将其转换为精美的表格。在本章中，我们将学习如何实现。\n\
    \n### 边框、内边距和外边距\n\n我们将的第一组属性是 `border`、`padding` 和 `margin`。还记得我们在讨论 CSS 盒模型时提到过这些属性吗？HTML\
    \ 表格（<table>`）和单元格（`<th>` 和 `<td>`）遵循与其他 CSS 元素相同的盒模型，因此可以使用这些属性进行样式设置。\n\n请参考下面的图（“Table\
    \ Margin”和“Table Padding”字样是为了参考添加的，实际表格中并不存在）。\n\n![](img/00014.jpg)\n\n该表格的\
    \ CSS 规则如下：\n\n```css\ntable {\n  border: dashed 1px black;\n  padding: 50px;\n\
    \  margin: 60px;\n}\n\nth {\n  border: solid 1px black;\n  padding: 30px;\n  text-align:\
    \ center;\n}\n\ntd {\n  border: solid 1px black;\n  padding: 20px;\n}\n```\n\n\
    虚线是表格的边框。虚线框周围的空间是表格的外边距（margin，声明为 60px），虚线框内部的空间是它的内边距（padding，50px）。\n\n第一行（Firstname,\
    \ Lastname, Age）使用 `<th>` 标签定义为表格表头。“Firstname”、“Lastname”和“Age”单词周围的空间是 `<th>`\
    \ 元素的内边距（30px）。\n\n第二行、第三行和第四行使用 `<td>` 标签定义。“Derek”、“Aaron”和“31”等单词周围的空间是 `<td>`\
    \ 元素的内边距（20px）。\n\n`<th>` 和 `<td>` 元素没有声明外边距，因为外边距会被表格单元格忽略。因此，我们无法指定单元格之间的间距。默认情况下，单个表格单元格之间会有一个小的间隙。此外，即使你将表格内边距设置为\
    \ 0px，表格边框（虚线）与单元格边框（实线）之间也存在间隙。如果你只需要一个边框，必须使用 `border-collapse` 属性：\n\n```css\n\
    border-collapse: collapse;\n```\n\n在本章的练习中，我们将有机会尝试各种 `border`、`padding` 和 `margin`\
    \ 属性。现在，让我们来看下一个属性。\n\n### 高和宽\n\n表格的宽高度可以使用 `width` 和 `height` 属性设置。值通常以像素或百分比的形式给出。例如，下面的代码将表格宽度设置为父元素的\
    \ 100%，高度设置为 500px。\n\n```css\ntable {\n  width: 100%;\n  height: 500px;\n}\n\
    ```\n\n你也可以在 `tr`、`th` 或 `td` 级别上使用 `height` 属性。例如，如果你想让表头行的高度为 100px，可以写道：\n\n\
    ```css\nth {\n  height: 100px;\n}\n```\n\n此外，你可以在表格单元格级别设置 `width` 属性（即针对 `td`\
    \ 和 `th` 元素）。如果你想让表格单元格的宽度为 200px，可以写道：\n\n```css\nth {\n  width: 200px;\n}\n\
    ```\n\n如果你想对单独列设置样式，可以使用 `id`/`class` 属性。例如，如果你有如下表格结构：\n\n```html\n<table>\n\
    \  <tr>\n    <th id=\"firstColumn\">Firstname</th>\n    <th class=\"secondColumn\"\
    >Lastname</th>\n  </tr>\n  <tr>\n    <td>Derek</td>\n    <td>Aaron</td>\n  </tr>\n\
    </table>\n```\n\n如果你只需要一个边框，就必须使用 `border-collapse` 属性：\n\n```css\nborder-collapse:\
    \ collapse;\n```\n\n### 文本对齐\n\n表格单元格内的文本可以使用 `text-align` 属性进行水平对齐，并使用 `vertical-align`\
    \ 属性进行垂直对齐。例如：\n\n```css\ntd {\n  text-align: center;\n  vertical-align: top;\n\
    }\n```\n\n### 背景、字体和文本\n\n还可以使用第 7 章涵盖的背景、字体和文本设置样式。例如：\n\n```css\nth {\n  background-color:\
    \ #f2f2f2;\n  font-weight: bold;\n}\n```\n\n### nth-child 选择器\n\n有时当我们有一个非常大的表格时，很难阅读。提高可读性的一种方法是使用\
    \ `nth-child()` 选择器为交替行上色。\n\n```css\ntr:nth-child(even) {\n  background-color:\
    \ lightgray;\n}\n\ntr:nth-child(odd) {\n  background-color: white;\n}\n```\n"
