    \ as the background, we specify the URL to the image using the `background-image`\
    \ property.\n\nExample:\n\n`background-image: url(“image1.jpg”);`\n\nbackground-repeat\n\
    \nBy default, the background image is placed at the top-left corner of the element,\
    \ and repeated both vertically and horizontally. If you do not want the background\
    \ image to be repeated, you can use the `background-repeat` property to change\
    \ it. The following list shows some commonly used values for the `background-repeat`\
    \ property:\n\n`repeat`\n\nThis is the default. Image will be repeated horizontally\
    \ and vertically.\n\n`repeat-x`\n\nImage will only be repeated horizontally.\n\
    \n`repeat-y`\n\nImage will only be repeated vertically.\n\n`no-repeat`\n\nImage\
    \ will not be repeated.\n\nExample:\n\n`background-repeat: repeat-x;`\n\nbackground-attachment\n\
    \nThe `background-attachment` property specifies whether the background image\
    \ should be fixed or scroll with the page. The two commonly used values are `fixed`\
    \ and `scroll`. The default is `scroll`. Try the exercise at the end of this chapter\
    \ to see how this works.\n\nExample:\n\n`background-attachment: scroll;`\n\nbackground-position\n\
    \nThe `background-position` property is very useful if you want to specify which\
    \ area of the background image you want to display.\n\nSuppose you have an element\
    \ with width and height 100px each. If the background image that you use has width\
    \ 200px and height 300px, only a portion of the background image will be displayed\
    \ as the image is larger than the size of the element.\n\n![](images/00009.jpg)\n\
    \nFor instance, if you use the image above (200px by 300px) as the background\
    \ image of a 100px by 100px element, only Area A (top left) will be displayed\
    \ by default. What if you want to display Area F instead? To do that, you need\
    \ to change the value of the `background-position` property.\n\nThe most common\
    \ way to specify the `background-position` value is to use pixels. The syntax\
    \ is:\n\n`background-position: xpos ypos;`\n\nTo understand how this syntax works,\
    \ let’s imagine a piece of cardboard with a 100px by 100px hole in the middle.\
    \ This hole in the cardboard represents the HTML element. Now imagine your background\
    \ image is underneath that cardboard. By default, the image will be aligned such\
    \ that Area A is shown through the hole in the cardboard. If you want to display\
    \ Area F instead, you have to shift the image (not the cardboard) 100px to the\
    \ left and 200px up. To achieve this with CSS, you write:\n\n`background-position:\
    \ -100px -200px;`\n\nThe first number (-100px) shifts the image horizontally.\
    \ If this number is positive, the image is shifted to the right. If negative,\
    \ it is shifted to the left.\n\nThe second number (-200px) shifts the image vertically.\
    \ If this number is positive, the image is shifted down. If negative, it is shifted\
    \ up.\n\nThe best way to understand this concept is to try the exercises for this\
    \ Chapter. I strongly encourage you to do them before moving on to Chapter 8.\n\
    \nExercise 7\n\nDownload the source code for this exercise from [http://learncodingfast.com/css](http://learncodingfast.com/css)\
    \ and unzip the file. The source code for this exercise can be found in the Chapter\
    \ 7 - Background folder.\n\nExercise 7.1\n\n> 1. Open the file Chapter 7 - Background.html\
    \ concurrently in your browser and text editor.\n\n> 2. Scroll the page in your\
    \ browser window. The Learn Coding Fast logo is set as the background for the\
    \ `body` element. Notice what happens to the logo as you scroll.\n\n> \n\n> Now\
    \ in the CSS declaration for `body`, change `background-attachment: fixed;` to\
    \ `background-attachment: scroll;`. Refresh and scroll the page. Notice what happens.\n\
    \n> 3. Next, change `background-repeat: repeat-x;` in the `body` CSS rules to\
    \ each of the following and notice what happens to the background logo.\n\n> \n\
    \n> (a) `background-repeat: repeat;`\n\n> (b) `background-repeat: no-repeat;`\n\
    \n> (c) `background-repeat: repeat-y;`\n\n> \n\n> Notice what happens in each\
    \ case.\n\n> 4. Next, change `background-color: white;` to `background-color:\
    \ #0000FF;`. This should change the background color of the page to blue.\n\n\
    > 5. Finally, we are going to look at the `background-position` property. We’ll\
    \ be modifying the rules for `#box1` in the examples that follow. The image used\
    \ in this example is ‘backgroundposition.png’ stored in the same folder. Have\
    \ a look at the image before proceeding.\n\n> \n\n> Notice that when `background-position`\
    \ is set to `0 0` (the default), area A is displayed. Changing the `background-position`\
    \ property will shift the background image with reference to area A.\n\n> \n\n\
    > In the source code CSS declaration for `#box1`, change `background-position:\
    \ 0 0;` to\n\n> \n\n> (a) `background-position: -100px 0;`\n\n> This shifts the\
    \ background image 100px to the left. As the default area shown is Area A, after\
    \ shifting 100px to the left, you should get Area B.\n\n> \n\n> (b) `background-position:\
    \ 100px 0;`\n\n> This shifts the background image 100px to the right. As the `background-repeat`\
    \ property is set to `no-repeat`, no image will be displayed. This is because\
    \ the background image has shifted out of the boundaries of `box1`.\n\n> \n\n\
    > (c) `background-position: 0 -100px;`\n\n> This shifts the background image 100px\
    \ up. You should get Area C.\n\n> \n\n> (d) `background-position: 0 100px;`\n\n\
    > This shifts the background image 100px down. No image will be displayed as the\
    \ background image has shifted out of the boundaries of `box1`.\n\n> \n\n> (e)\
    \ `background-position: -100px -100px;`\n\n> Try to figure out which area you’ll\
    \ get.\n\nChapter 8: Text and Font\n\nText and font properties in CSS are used\
    \ to format the appearance of words and text on a webpage. The `font` property\
    \ is concerned with how the characters look, such as whether they are ‘fat’ or\
    \ ‘thin’, ‘big’ or ‘small’, and what font type to use. The `text` property is\
    \ used to style everything else. In this chapter, we’ll be covering the `text`\
    \ and `font` properties commonly used.\n\nFont Properties\n\nfont-family\n\nThe\
    \ `font-family` property is used to set the font type."
