    字体类型主要三大类：衬线字体、无衬线字体和等宽字体。


    衬线字体（Serif）在字符的末端有一个小装饰线。例如“Times New Roman”和 Georgia。


    无衬线字体（San Serif）字符的末端没有装饰线。例如 Arial 和 Verdana。


    等宽字体（Monospace）所有字符都使用相同的空间。例如，字母‘i’的宽度与字母‘a’相同。等宽字体的示例包括“Courier New”和“Lucida
    Console”。


    在指定 `font-family` 属性时，你应该始终包含多个字体名称，这样如果浏览器不支持第一个字体，它就会尝试下一个字体，直到找到它支持的字体为止。从更具体的字体（如“Times
    New Roman”）开始，并以通用字体族结束。如果字体名称包含多个单词，应使用引号。


    示例：


    ```css

    font-family: "Times New Roman", Times, serif;

    ```


    ## font-size


    `font-size` 属性设置文本的大小。字体大小可以使用像素 (px)、em、百分比 (%) 或使用关键字来设置。


    ### 使用 px


    大多数浏览器使用的默认字体大小是 16 像素。如果你想让网站显示不同的字体大小，可以这样指定：`font-size: 20px;`。


    ### 使用 em


    一个 em 等于当前的字体大小。如果该元素是另一个元素的子元素，则当前字体大小是父元素的字体大小。如果该元素不是任何元素的子元素，则当前字体大小是浏览器的默认字体大小。如上述，大多数浏览器使用的默认字体大小为
    16px。因此，默认情况下 `1em = 16px`。


    然而，可以通过更改浏览器设置来更改默认字体大小。例如，要更改 Firefox 的默认字体大小，点击菜单按钮（右侧的三条横线按钮），选择“选项”（Options），最后选择“内容”选项卡。然后你可以在“字体与颜色”部分下更改当前字体大小。


    如果用户将默认字体设置为 20px，`1em` 变为 20px。如果你想让字体大小变为当前字体大小的 1.5 倍，只需编写 `1.5em`。em 是大多数开发者使用的首选单位大小，因为默认字体大小可以由用户自定义。


    ### 使用百分比


    百分比类似于 em。`200%` 仅意味着当前字体大小的 2 倍。因此，`200% = 2em`。


    ### 使用关键字


    指定字体大小的最后方法是使用关键字。常用的关键字有 `xx-small`、`x-small`、`small`、`medium`（默认值）、`large`、`x-large`
    和 `xx-large`。


    示例：


    ```css

    font-size: 40px;

    font-size: 1.5em;

    font-size: 120%;

    font-size: large;

    ```


    ## font-style


    `font-style` 属性用于指定斜体文本。两个常用值是 `normal` 和 `italic`。normal 显示不斜体的文本，而 italic 以斜体显示文本。


    示例：


    ```css

    font-style: italic;

    ```


    ## font-weight


    `font-weight` 属性是 `font-style` 的对应属性。`font-style` 用于指定斜体文本，而 `font-weight` 用于指定加粗文本。常用的值包括
    `normal`、`bold`、`bolder` 和 `lighter`。或者，你也可以使用 100 的倍数数字指定字符的粗细，从 100（最细）到 900（最粗）。400
    是正常粗细，700 等于粗。


    然而，注意大多数网络浏览器只支持 `normal` 和 `bold` 字体权重。在这种情况下，100-500 对应 `normal`，而 600 及以上对应
    `bold`。


    示例：


    ```css

    font-weight: bold;

    font-weight: 300;

    ```


    ## Text Properties


    CSS `text` 属性允许你设置与文本字体相关的属性。常用属性包括文本颜色、文本对齐、文本装饰、字间距、词间距行高。


    ### color


    CSS `color` 属性指定文本的颜色。与我们在第 4 章中学习的 `border-color` 属性类似，文本颜色可以通过三种方式之一指定：使用颜色名称、RGB
    值或十六进制值。


    示例：


    ```css

    color: blue;

    color: #00ff00;

    color: rgb(255,0,0);

    ```


    ### text-alignment


    `text-alignment` 属性允许我们指定文本是居中、左对齐、右对齐还是两端对齐。常用的值有 `left`、`right`、`center` 和 `justify`。


    示例：


    ```css

    text-align: center;

    ```


    ### text-decoration


    `text-decoration` 属性主要用于指定文本是否带有装饰。常用的值有 `none`（即：普通文本，无装饰）、`underline`（下划线）、`overline`（文本上方的线）和
    `line-through`（文本删除线）。


    此属性通常用于移除链接的下划线。默认情况下，大多数浏览器将以蓝色并带下划线显示链接。你可以使用代码 `text-decoration: none;` 来移除下划线。


    示例：


    ```css

    text-decoration: none;

    ```


    ### letter-spacing


    字间距用于增加或减少字符之间的间距。


    ### word-spacing


    词间距用于增加或减少单词之间的间距。


    ### line-height


    行高用于设置文本行之间的垂直距离。


