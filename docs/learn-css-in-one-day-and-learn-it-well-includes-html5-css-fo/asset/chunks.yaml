  trans: "\n\n> 没有任何变化，对吧？黄色框被声明为内联元素。因此，它只会占据它所需的宽度和高度。事实上，你可以移除高度和宽度属性，且什么都不会改变。\n\
    \n> 3. 现在将 `#displaydemo` 的 `display` 属性从 `display: inline;` 改为 `display: block;`。发生了什么？\n\
    \n> 黄色框现在以块级元素的形式显示。它会在新行开始并结束。如果你声明了它的宽度和高度，宽度和高度将是你你指定的值。如果你没有指定宽度和高度，黄色框将占据页面的整个宽度。它将占据它所需的高度。\n\
    \n> 4. 尝试更改 CSS 中针对 `#displaydemo` 声明的高度和宽度。观察发生了什么。\n\n> 5. 现在，让我们来看 `visibility`\
    \ 属性。将 `#magic` 的 CSS 声明从 `display: inline;` 改为 `visibility: hidden;`。观察蓝色句子中“magic”一词发生了什么。\n\
    \n> 6. 接下来，将 `#magic` 的 CSS 声明从 `visibility: hidden;` 改为 `display: none;`。观察发生了什么。\n\
    \n# 第 7 章：背景\n\n在本章中，我们将学习如何更改元素的背景属性。这些属性包括更改其背景颜色和背景图像。\n\n首先，让我们先看看如何更改背景颜色。\n\
    \n## 背景颜色\n\n要声明元素的背景颜色，我们使用 `background-color` 属性。类似于指定 CSS 框的边框颜色，我们可以使用三种表示法之一声明元素的背景颜色：颜色名称、rgb\
    \ 表示法或十六进制表示法。\n\n示例：\n\n```\nbackground-color: green;\nbackground-color: rgb(0,\
    \ 255, 0);\nbackground-color: #00FF00;\n```\n\n## 背景图像\n\n如果你觉得仅使用颜色作为元素的背景太单调，你可以选择使用图像。CSS\
    \ 允许我们在图像显示上具有极大的灵活性。\n\n### background-image\n\n要使用图像作为背景，我们使用 `background-image`\
    \ 属性指定图片的 URL。\n\n示例：\n\n```\nbackground-image: url(“image1.jpg”);\n```\n\n###\
    \ background-repeat\n\n默认情况下，背景图像位于元素的左上角，并在水平和垂直方向上重复。如果你不希望背景图像重复，可以使用 `background-repeat`\
    \ 属性进行更改。以下列表显示了 `background-repeat` 属性的一些常用值：\n\n- `repeat`: 默认值。图像将在水平和垂直方向上重复。\n\
    - `repeat-x`: 图像仅在水平方向重复。\n- `repeat-y`: 图像仅在垂直方向重复。\n- `no-repeat`: 图像不重复。\n\n\
    示例：\n\n```\nbackground-repeat: repeat-x;\n```\n\n### background-attachment\n\n\
    `background-attachment` 属性指定背景图像应该是固定还是随页面滚动。两个常用的值是 `fixed` 和 `scroll`。默认值是 `scroll`。尝试本章末尾的练习来看看它是如何工作的。\n\
    \n示例：\n\n```\nbackground-attachment: scroll;\n```\n\n### background-position\n\
    \n如果你想指定显示背景图像的哪个区域，`background-position` 属性非常有用。\n\n假设你有一个宽度和高度均为 100px 的元素。如果你使用的背景图像宽度为\
    \ 200px，高度为 300px，那么由于图像大于元素的大小，只有背景图像的一部分会被显示。\n\n![](img/00009.jpg)\n\n例如，如果你使用上面的图像（200px\
    \ x 300px）作为 100px x 100px 元素的背景图像，默认只会显示区域 A（左上角）。如果你想显示区域 F 呢？要实现，你需要更改 `background-position`\
    \ 属性的值。\n\n指定 `background-position` 值的最常用方法是使用像素。语法为：\n\n```\nbackground-position:\
    \ xpos ypos;\n```\n\n为了理解这种语法如何工作，让我们想象一块中间有一个 100px x 100px 孔洞的纸板。纸板上的这个孔代表 HTML\
    \ 元素。现在想象你的背景图像在纸板下方。默认情况下，图像将对齐，使得区域 A 通过纸板上的孔显示。如果你想显示区域 F，你必须将图像（而不是纸板）向左移动\
    \ 100px 并向上移动 200px。用 CSS 实现这一点，你需要写：\n\n```\nbackground-position: -100px -200px;\n\
    ```\n\n第一个数字（`-100px`）水平移动图像。如果这个数字是正数，图像向右移动。如果是负数，则向左移动。\n\n第二个数字（`-200px`）垂直移动图像。如果这个数字是正数，图像向下移动。如果是负数，则向上移动。\n\
    \n理解这个概念的最佳方法是尝试本章的练习。我强烈建议你在进入第 8 章之前完成这些练习。\n\n## 练习 7\n\n从 [`learncodingfast.com/css`](http://learncodingfast.com/css)\
    \ 下载此练习的源代码并解压文件。此练习的源代码可以在章节找到。\n\n### 练习 7.1\n\n1. 从 [`learncodingfast.com/css`](http://learncodingfast.com/css)\
    \ 下载此练习的源代码并解压文件。此练习的源代码可以在章节找到。\n2. 在浏览器中打开 `7 - Background.html` 文件。注意滚动时发生了什么。\n\
    3. 在 `body` 元素中，将 `background-attachment: fixed;` 改为 `background-attachment: scroll;`。注意标志发生了什么。\n\
    4. 接下来，将 `background-repeat: repeat;` 改为：\n   - (a) `repeat-x;`\n   - (b) `no-repeat;`\n\
    \   - (c) `repeat-y;`\n   注意每种情况下发生了什么。\n5. 接下来，将 `background-color: white;` 改为\
    \ `background-color: #0000FF;`。这应该改变页面的背景颜色。\n6. 最后，我们将查看 `backgroundposition`\
    \ 属性。此示例使用的图像是存储在相同文件夹中的‘backgroundposition.png’。在继续之前看一眼图像。\n7. 注意当 `background-position`\
    \ 设置为 `0 0`（默认值）时，显示区域 A。更改 `background-position` 属性将相对于区域 A 移动背景图像。\n8. 在 `#box1`\
    \ 的 CSS 中，将 `background-position: 0 0;` 改为：\n   - (a) `background-position: -100px\
    \ 0;`\n   - (b) `background-position: 100px 0;`\n   - (c) `background-position:\
    \ 0 -100px;`\n   - (d) `background-position: 0 100px;`\n   - (e) `background-position:\
    \ -100px -100px;`\n   尝试弄清楚你会得到哪个区域。\n\n# 第 8 章：文本和字体\n\nCSS 中的文本和字体属性用于格式化网页上单词和文本的外观。`font`\
    \ 属性涉及字符的外观，例如它们是“粗”还是“细”、“大”还是“小”，以及使用哪种字体。`text` 属性用于样式化所有其他内容。在本章中，我们将涵盖常用的\
    \ `text` 和 `font` 属性。\n\n## 字体属性\n\nfont-family\n\n`font-family` 属性用于设置字体类型。\n\
    \n"
- fmt: '

    There are three main categories of font types: serif, san serif and monospace.


    Serif fonts have a small line at the end of some characters. Examples include
    “Times New Roman” and Georgia.


    San Serif fonts do not have lines at the end of characters. Examples include Arial
    and Verdana.


    Monospace fonts use the same amount of space for all characters. For instance,
    the letter ‘i’ has the same width as the letter ‘a’. Examples of monospace fonts
    include “Courier New” and “Lucida Console”.


    When specifying the `font-family` property, you should always include several
    font names so that if the browser does not support the first font, it can try
    the next font until it finds one that it supports. Start with a more specific
    font (such as “Times New Roman”) and end with a generic font family. If the font
    name is more than one word, quotation marks should be used.


    Example:


    ```css

    font-family: "Times New Roman", Times, serif;

    ```


    ## font-size


    The `font-size` property sets the size of the text. Font size can be set with
    pixels (px), em, percentage (%) or by using keywords.


    ### Using px


    The default font size used on most browsers is 16 pixels. If you want your site
    to display with a different font size, you can specify it like this: `font-size:
    20px;`.


    ### Using em


    An em is is equal to the current font size. If the element is the child of another
    element, the current font size is the font size of the parent element. If the
    element is not a child of any element, the current font size is the browser’s
    default font size. As mentioned above, the default font size used on most browsers
    is 16px. Hence by default `1em = 16px`.


    However, this default font size can be changed by changing the browser’s setting.
    For instance, to change the default font size on Firefox, click on the menu button
    (the right most button with three horizontal lines), select “Options’ and finally
    select the “Content’ tab. You can then change the current font size under the
    ‘Fonts & Colors’ section.


    If the user sets the default font size to 20px, `1em` becomes 20px. If you want
    the font size to be 1.5 times the current font size, you simply write `1.5em`.
    The em is the prefered unit size used by most developers as the default font size
    can be customised by the user.


    ### Using Percentage


    Percentage is similar to em. `200%` simply means 2 times the current font size.
    Hence, `200% = 2em`.


    ### Using Keywords


    The final way to specify font size is to use keywords. Commonly used keywords
    are `xx-small`, `x-small`, `small`, `medium` (this is the default), `large`, `x-large`
    and `xx-large`.


    Examples:


    ```css

    font-size: 40px;

    font-size: 1.5em;

    font-size: 120%;

    font-size: large;

    ```


    ## font-style


    The `font-style` property is used to specify italic text. The two common values
    are `normal` and `italic`. Normal will display text with no italic while italic
    displays text in italic.


    Example:


    ```css

    font-style: italic;

    ```


    ## font-weight


    The `font-weight` property is the counterpart of `font-style`. While `font-style`
    is used to specify italic text, `font-weight` is used to specify bold text. Commonly
    used values include `normal`, `bold`, `bolder` and `lighter`. Alternatively, you
    can also specify the thickness of the characters using numbers in multiples of
    100, from 100 (thinnest) to 900 (thickest). 400 is the normal thickness, and 700
    is the same as bold.


    However, note that most web browsers only support `normal` and `bold` font weights.
    In that case, 100-500 correspond to `normal` while 600 and above correspond to
    `bold`.


    Examples:


    ```css

    font-weight: bold;

    font-weight: 300;

    ```


    ## Text Properties


    CSS `text` properties allow you to set properties that are not related to the
    font of the text. Common properties include text color, text alignment, text decoration,
    letter spacing, word spacing and line height.


    ### color


    The CSS `color` property specifies the color of the text. Similar to what we learned
    in Chapter 4 regarding the `border-color` property, text color can be specified
    in one of three ways: using a color name, a RGB value or a hex value.


    Examples:


    ```css

    color: blue;

    color: #00ff00;

    color: rgb(255,0,0);

    ```


    ### text-alignment


    The `text-alignment` property allows us to specify whether we want text to be
    centered, or aligned to the left or right, or justified. The commonly used values
    are `left`, `right`, `center` and `justify`.


    Example:


    ```css

    text-align: center;

    ```


    ### text-decoration


    The `text-decoration` property is mainly used to specify whether the text should
    be decorated with a line. The commonly used values are `none` (i.e. just normal
    text, no decoration), `underline`, `overline` (a line above the text) and `line-through`
    (a line through the text).


    This property is commonly used to remove underlines from hyperlinks. By default,
    most browsers will display hyperlinks in blue, with an underline. You can use
    the code `text-decoration: none;` to remove underlines.


    Example:


    ```css

    text-decoration: none;

    ```


    ### letter-spacing


    Letter spacing is used to increase or decrease the spacing between characters.


    ### word-spacing


    Word spacing is used to increase or decrease the spacing between words.


    ### line-height


    Line height is used to set the vertical distance between lines of text.

