  trans: "\n\n![](img/00011.jpg)\n\n粗黑线是边框（border）。边界内部是内边距（padding）和实际内容。边界外部是框的外边距（margin）。内边距、边框和外边距的厚度都可以\
    \ CSS 修改。为了理解这个盒模型是如何工作的，让我们分析下面的代码。你可以在 [`learncodingfast.com/css`](http://learncodingfast.com/css)\
    \ 下载这段代码。\n\n```html\n<!doctype html>\n<html\n<head><title>Chapter 4 - CSS Box\
    \ Model</title>\n<style type=\"text/css\">\n#box1 {\n  margin: 20px;\n  padding:\
    \ 10px;\n  border: 5px solid black;\n  width: 100px;\n  height: 100px;\n  text-align:\
    \ justify;\n  float: left;\n}\n#box2 {\n  margin: 20px;\n  padding: 50px;\n  border:\
    \ 5px solid black;\n  width: 100px;\n  height: 100px;\n  text-align: justify;\n\
    \  float: left;\n}\n</style></head>\n<body>\n<div id=\"box1\">Learn CSS in One\
    \ Day and Learn It Well. CSS is easy.</div>>\n<div id=\"box2\">Learn CSS in One\
    \ Day and Learn It Well. CSS is easy.</div>>\n<p>skajd fhadlc vkas j cnl ka jshvn\
    \ aclaks jdclkasjd ckasj cnkas djvcn ksa mc nlkasd jn skajd fhadlc vkas j cnl\
    \ ka jshvn aclaks jdclkasjd ckasj cnkas djvcn ksa mc nlkasd jn skajd fhadlc vkas\
    \ j cnl ka jshvn aclaks jdclkasjd ckasj cnkas djvcn ksa mc nlkasd jn</p>\n</body>\n\
    </html>\n```\n\n如果你运行这段代码，你将得到下面的框。框旁边和下方的乱码文本是为了显示外边距（margin）。\n\n![](img/00003.jpg)\n\
    \n这段代码定义了两个宽度和高度均为 100 像素的框。这个宽度和高度仅指内容区域的尺寸。\n\n第一个框（`box1`）内容区域周围有 10 像素（px）的内边距。在内边距周围，它有一个\
    \ 5px 的黑色实线边框。`box1` 的总宽度（包括边框）为 100（内容区域）+ 10*2（两侧内边距）+ 5*2（两侧边框）=130 px。高度也是如此。\n\
    \n第二个框（`box2`）有 50px 的内边距。尽管 `box2` 比 `box1` 大得多，但请注意文字“Learn CSS in One Day and\
    \ Learn It Well. CSS is easy.” 仍然占据相同的区域？这是因为内容区域是由宽度和高度属性决定的，而不是内边距。`box2` 的总宽度为\
    \ 100+50*2+5*2 = 210px。它的高度也是 210px。\n\n在边框外部，两个框都有 20px 的外边距。注意乱码文本和框之间有一些空间吗？那就是外边距。\n\
    \n尝试稍微修改代码，更改宽度、height、padding、margin 和 border 属性的值。观察每项变化影响了哪些部分。你会注意到宽度和高度影响内容区域。外边距影响边框外部的区域，而内边距影响内部的区域。边框理当然是框的边界。我们将在接下来详细介绍这些每一个属性。\n\
    \n## 宽度和高度属性\n\nCSS 框的 `width` 和 `height` 属性指定了内容区域的尺寸（不包括内边距、边框和外边距）。值通常以像素或百分比给出。例如，示例中的代码将\
    \ `box1` 和 `box2` 的宽度和高度都设置为 100px。你也可以将宽度设置为 80%。此时框的内容区域将占据页面宽度的 80%。最后，你可以将高度和宽度设置为\
    \ `auto`。在这种情况下，浏览器将根据显示框内内容所需的空间自动计算这些值。\n\n## Overflow 溢出属性\n\n有时，内容区域的宽度和高度可能太小，无法容纳框内的内容。默认情况下，内容将溢出框外并与其他内容重叠。这将导致网页格式非常糟糕。如果你不希望发生这种情况，可以使用\
    \ `overflow` 属性。下面的图显示了使用 `overflow` 属性的不同值（`visible`、`hidden`、`scroll` 和 `auto`）如何显示内容。\n\
    \n![](img/00001.jpg)\n\n## Padding 和 Margin 属性\n\n内边距和外边距都是透明的。因此，我们无法改变它们的颜色。但我们可以指定它们的宽度。指定宽度最常用的单位是像素。如果你希望外边距为\
    \ 10 像素，可以写 `margin: 10px;`。10 和 px 之间不应有空格。\n\n下面的示例显示了指定外边距宽度的四种不同语法。内边距也一样。只需将属性名从\
    \ `margin` 更改为 `padding`。\n\n语法 1\n```css\nmargin: 25px;\n```\n语法 2\n```css\n\
    margin: 25px 50px;\n```\n语法 3\n```css\nmargin-top: 25px;\n```\n语法 4\n```css\n\
    margin: 25px 50px 60px 10px;\n```\n\n"
- fmt: "\nIn addition to using the RGB notation, you can also use the hexadecimal\
    \ notation, which uses 6 digits to represent color. The first two numbers represent\
    \ the hexadecimal value for the intensity of ‘red’, the next two represent ‘green’\
    \ and the last two represent ‘blue’. Often a color tool is used to generate these\
    \ hexadecimal values. Check out the site [http://instant-eyedropper.com/](http://instant-eyedropper.com/)\
    \ for one such free tool.\n\nAlternatively, you can go to [http://html-color-codes.info/](http://html-color-codes.info/)\
    \ where there’s a color chart for you to select the color that you want. Click\
    \ on it and you’ll be given the corresponding hexadecimal value.\n\n### Examples\n\
    \n```css\nborder-color: rgb(255, 0, 0);\n```\nwill set all borders to red.\n\n\
    ```css\nborder-color: red green;\n```\nwill set the top and bottom borders to\
    \ red and the left and right borders to green.\n\n```css\nborder-top-color: #12005F;\n\
    ```\nwill set the top border to #12005F.\n\n### border-style\n\nTo set border\
    \ style, you use the property `border-style`. The acceptable values are: `none`,\
    \ `dotted`, `dashed`, `solid`, `double`, `groove`, `ridge`, `inset` and `outset`.\
    \ For instance, if you write\n\n```css\nborder-style: solid dotted;\n```\nthe\
    \ top and bottom border will be solid while the left and right will be dotted.\
    \ If you want to set the style individually, you can write\n\n```css\nborder-top-style:\
    \ solid;\n```\n\n```css\nborder-left-style: dotted;\n```\n\n### border-radius\n\
    \nThe `border-radius` property is used to create borders with rounded corners.\
    \ The value is normally given in pixel or percentage.\n\nBorder radius can be\
    \ set individually for the four corners. The four corners are `top-left`, `top-right`,\
    \ `bottom-right` and `bottom-left`.\n\n### Examples\n\n```css\nborder-radius:\
    \ 5px;\n```\nsets the border radii of all corners to 5px.\n\n```css\nborder-radius:\
    \ 10px 20px;\n```\nsets the top-left and bottom-right (i.e. the two corners diagonally\
    \ opposite each other) radii to 10px and the top-right and bottom-left radii to\
    \ 20px.\n\n```css\nborder-radius: 25px 5px 0 50px;\n```\nsets the values of the\
    \ individual corners, starting from the top-left corner and continuing in a clockwise\
    \ direction.\n\n```css\nborder-top-left-radius: 10px;\n```\nsets the top-left\
    \ border radius to 10px.\n\nIf the element has width and height of 100px, padding\
    \ of 20px and border width of 50 px (total width and total height = 100 + 20*2\
    \ + 50*2 = 240px), setting the border radius to 120px (240 divided by 2) will\
    \ give you a circle instead of a square.\n\n### Border Shorthand\n\nThe `border`\
    \ property is a shorthand for specifying border width, style and color in one\
    \ line, instead of doing it separately. Simply write\n\n```css\nborder: 5px solid\
    \ green;\n```\nThe values are for width (5px), style (solid) and color (green)\
    \ respectively. Border radius is not included in this shorthand.\n\n### Exercise\
    \ 4\n\nDownload the source code for this exercise from [http://learncodingfast.com/css](http://learncodingfast.com/css)\
    \ and unzip the file. The source code for this exercise can be found in Chapter\
    \ 4 - CSS Model.\n\n### Exercise 4.1\n\n1. Open the file `Chapter 4 - CSS Model.html`\
    \ concurrently in your browser and text editor.\n2. Resize your browser window\
    \ and observe how gibberish text flows around the box.\n3. Modify the CSS declaration\
    \ for `box1` by changing `width: 100px;` and `height: 100px;` to each of the following:\n\
    \   - (a) `width: 200px; height: 200px;`\n   - (b) `width: 60%;`\n   - (c) `height:\
    \ auto; width: auto;`\n   Save the file in the text editor and refresh the page.\
    \ Notice what happens to `box1` in each case.\n4. Now change the width and height\
    \ of `box1` back to 100px and change the text between the tags `<div id=\"box1\"\
    >...</div>` to: “Learn CSS in One Day and It Well. This example shows what happens\
    \ when text overflows the dimension of the box.” Next, add each of the following\
    \ to the CSS declaration of `box1` and notice what happens in each case:\n   -\
    \ (a) `overflow: visible;`\n   - (b) `overflow: hidden;`\n   - (c) `overflow:\
    \ scroll;`\n   - (d) `overflow: auto;`\n5. Modify the CSS declaration for `box1`\
    \ by changing `margin: 20px;` to each of the following and notice what happens\
    \ to the space around `box1`:\n   - (a) `margin: 50px;`\n   - (b) `margin: -50px;`\n\
    \   - (c) `margin: 25px 200px;`\n   - (d) `margin: 25px 50px 60px 10px;`\n6. Remove\
    \ the margin rules for `box1` and add the 4 lines below:\n   ```css\n   margin-top:\
    \ 25px;\n   margin-right: 50px;\n   margin-bottom: 60px;\n   margin-left: 10px;\n\
    \   ```\n   Notice any changes to `box1`? There should be no change as this is\
    \ the same as 5(d) above.\n7. Remove the margin rules for `box1` and add the line\
    \ below:\n   ```css\n   margin: 0 auto;\n   ```\n   Next, change the width of\
    \ `box1` to 80%. Finally, remove the line `float: left;`. Notice what happens\
    \ (We’ll explain what `float` does in the next chapter). `box1` is now center-aligned.\n\
    8. Now, let’s work on `box2`. Modify the CSS declaration for `box2` by changing\
    \ `padding: 50px;` to each of the following and notice what happens inside `box2`:\n\
    \   - (a) `padding: 25px;`\n   - (b) `padding: -10px;`\n   - (c) `padding: 25px\
    \ 50px;`\n   - (d) `padding: 25px 50px 60px 10px;`\n   8(b) will not work as paddings\
    \ cannot have negative values. You’ll end up with a padding of 0 pixel.\n9. Remove\
    \ the padding rules for `box2` and add the 4 lines below:\n   ```css\n   padding-top:\
    \ 25px;\n   padding-right: 50px;\n   padding-bottom: 60px;\n   padding-left: 10px;\n\
    \   ```\n   Notice any changes to `box2`? There should be no change as this is\
    \ the same as 8(d) above.\n10. Now let's change the border style for `box2`. Remove\
    \ the line `border: 5px solid black;` from the CSS declaration of `box2` and add\
    \ each of the following. Notice what happens to the border in each case:\n   \
    \ - (a) `border-style: solid dotted;`\n    - (b) `border-style: none double groove;`\n\
    \    - (c) `border-style: inset;`\n    - (d) `border-style: outset;`\n11. Next,\
    \ remove the `border-style` rule for `box2` and add the following:\n    ```css\n\
    \    border-top-style: dotted;\n    border-left-style: double;\n    ```\n12. Now\
    \ remove the rules from part 11 and change border style to solid (`border-style:\
    \ solid;`). add each of the following rules. Notice what happens to `box2` in\
    \ each case:\n    - (a) `border-width: 25px;`\n    - (b) `border-width: 25px thin;`\n\
    \    - (c) `border-top-width: 30px;`\n13. Now we are going to change the border\
    \ color for `box2`. Try adding each of the following rules:\n    - (a) `border-color:\
    \ rgb(255, 0, 0);`\n    - (b) `border-color: red green;`\n    - (c) `border-top-color:\
    \ #12FF5F;`\n14. Next, we'll try the border shorthand. Remove all the border properties\
    \ for `box2`. Add the following:\n    ```css\n    border: 5px solid green;\n \
    \   ```\n15. Now, let’s try the `border-radius` property. Try each of the following:\n\
    \    - (a) `border-radius: 20px;`\n    - (b) `border-radius: 10px 20px;`\n   \
    \ - (c) `border-radius: 25px 5px 0 50px;`\n    - (d) `border-top-left-radius:\
    \ 10px;`\n"
