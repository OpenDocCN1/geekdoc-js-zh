  trans: "\n\n## 7. 修改 CSS 属性 `text-align` 并观察示例文本的变化。默认情况下，此段的文字是左对齐的。现在尝试每一项：\n\n\
    (a) `text-align: justify;`\n\n(b) `text-align: right;`\n\n(c) `text-align: center;`\n\
    \n## 8. 修改 CSS 属性 `text-decoration` 并观察示例文本的变化。尝试：\n\n(a) `text-decoration: underline;`\n\
    \n(b) `text-decoration: overline;`\n\n(c) `text-decoration: line-through;`\n\n\
    ## 9. 修改 CSS 属性 `letter-spacing` 并观察示例文本的变化。尝试：\n\n(a) `letter-spacing: 5px;`\n\
    \n(b) `letter-spacing: -5px;`\n\n## 10. 将 `letter-spacing` 改回 `0px`。修改 CSS 属性\
    \ `word-spacing` 并观察示例文本的变化。尝试：\n\n(a) `word-spacing: 10px;`\n\n(b) `word-spacing:\
    \ -20px;`\n\n## 11. 将 `word-spacing` 改回 `0px`。修改 CSS 属性 `line-height` 并观察示例文本的变化。尝试：\n\
    \n(a) `line-height: 2;`\n\n(b) `line-height: 25px;`\n\n(c) `line-height: 30%;`\n\
    \n# 第 9 章：列表、链接与导航栏\n\n在本章中，我们将学习用于样式化链接和列表的 CSS 属性。此外，我们还将结合这两个概念，讨论如何创建网页上常见的导航栏。准备好了吗？让我们从\
    \ CSS 列表开始。\n\n### CSS 列表\n\n回想在 HTML 中，我们可以创建两种类型的列表：有序列表和无序列表。我们可以使用 CSS 列表属性对这些列表进行样式化。\n\
    \n#### list-style-type\n\n`list-style-type` 属性允许为列表设置列表项目标记。列表项目标记是指每个列表项目左侧的那些符号/数字/字母。\n\
    \n对于有序列表，我们可以指定想要作为标记的数字或字母类型。例如，如果我们想使用罗马数字（例如 i, ii, iii）作为项目标记，可以写 `list-style-type:\
    \ lower-roman;`。\n\n其他常用的标记包括：\n\n- `decimal`（这是默认值），\n- `decimal-leading-zero`（带有前导零的数字，例如\
    \ 01, 02..），\n- `lower-alpha`（例如 a, b, c..），\n- `lower-greek`（例如 α, β, γ..），\n\
    - `upper-alpha`（例如 A, B, C..）以及\n`upper-roman`（例如 I, II, III…）。\n\n对于无序列表，你可以指定想要作为符号的形状。默认标记是\
    \ `disc`（实心圆）。你可以将其更改为 `square`（正方形）或 `circle`（空心圆）。\n\n此外，还可以选择不为列表使用任何项目标记。要这样做，你需要写\
    \ `list-style-type: none;`。这在创建导航栏时非常常见。\n\n示例：\n\n- `list-style-type: lower-roman;`\n\
    - `list-style-type: circle;`\n- `list-style-type: none;`\n\n#### list-style-image\n\
    \n如果你不喜欢提供的任何列表样式，可以选择使用图像作为列表项目标记。要这样做，你可以使用 `list-style-image` 属性来指定使用的图像 URL。\n\
    \n示例：\n\n- `list-style-image: url(‘myMarker.gif’);`\n\n#### list-style-position\n\
    \n`list-style-position` 属性用于指定列表项目标记应该出现在内容流内部还是外部。有两个接受的值：`inside` 和 `outside`。\n\
    \n默认情况下，列表项目带有一定程度的缩进。如果 `list-style-position` 设置为 `inside`，则列表项目标记将在缩进后显示。缩进由下方图中框框的左边缘表示。如果\
    \ `list-style-position` 设置为 `outside`，则标记将在缩进之前显示![](img/00004.jpg)\n\n换句话说，`list-style-position:\
    \ inside` 导致的缩进比 `list-style-position: outside` 更多。默认位置是 `outside`。\n\n示例：\n\n\
    - `list-style-position: outside;`\n\n#### list-style\n\n`list-style` 是一个简写属性，用于在一条声明中设置所有列表属性（即\
    \ `list-style-type`、`list-style-position` 和 `list-style-image`）。如果缺少任何值，将使用该缺失属性的默认值。\n\
    \n示例：\n\n- `list-style: square inside url(\"myMarker.gif\");`\n\n### CSS 链接\n\n\
    链接可以使用之前章节中讨论过的任何 CSS 属性进行样式化。你可以使用 `background-color` 属性设置背景颜色，这将为链接提供高亮显示效果。你还可以使用第\
    \ 8 章涵盖的文本和字体属性来更改字体大小、字体样式、文本颜色、文本装饰等。\n\n此外，我们可以根据状态对链接进行样式化。链接可以处于四种状态：\n\n\
    - `link`（未访问的链接）\n- `visited`（已访问的链接）\n- `hover`（当鼠标悬停在其上方时）\n- `active`（当点击点击时）\n\
    \n要指定状态，我们写：\n\n```css\na:link { ... }\na:visited { ... }\na:hover { ... }\na:active\
    \ { ... }\n```\n\n### 导航栏\n\n导航栏通常作为无序列表创建。让我们尝试制作自己的菜单。\n\n```html\n<ul>\n  <li><a\
    \ href=\"home.html\">首页</a></li>\n  <li><a href=\"html.html\">HTML 教程</a></li>\n\
    \  <li><a href=\"csst.html\">CSS 教程</a></li>\n  <li><a href=\"javascript.html\"\
    >Javascript 教程</a></li>\n</ul>\n```\n\n接下来，我们需要移除列表的项目符号。\n\n```css\nul {\n  list-style-type:\
    \ none;\n}\n```\n\n现在，我们必须对链接进行样式化。\n\n```css\na {\n  display: block;\n  width:\
    \ 160px;\n  text-align: center;\n  text-decoration: none;\n  background-color:\
    \ #0000FF;\n}\n\na:link {\n  color: #0000FF;\n}\n\na:visited {\n  color: #00FF00;\n\
    }\n\na:hover {\n  color: #FFFF00;\n}\n\na:active {\n  color: #FF00FF;\n}\n```\n\
    \n最后，如果我们想让导航栏成为水平条，我们需要让列表项目浮动（float）。\n\n```css\nli {\n  float: left;\n}\n```\n\
    \n搞定！我们刚刚创建了一个简单的水平导航栏。该导航栏的源代码已作为练习的一部分给出。尝试一下并让它在视觉上更有吸引力。你还可以为四种链接状态指定不同的样式。\n\
    \n"
- fmt: "\n> Refresh the browser. Nothing changes right? That is because `list-style-position:\
    \ outside;` is the default. Now change `list-style-position: outside;` to `list-style-position:\
    \ inside;`. You’ll notice that the unordered list is shifted slightly to the right\
    \ (i.e. there’s more indentation).\n\n> 5. Remove the `list-style-type` property\
    \ for `ul` and add the following instead:\n\n> (a) `list-style-image: url(\"myMarker.gif\"\
    );`\n\n> Observe what happens to the 'Cars Unordered List'.\n\n> 6. Now let’s\
    \ look at how to style hyperlinks. Try adding the following rules to the stated\
    \ selector:\n\n> (a) Add `color: green;` to `a:link{}` and observe what happens\
    \ to the ‘Click Me’ link.\n\n> (b) Add `font-size: 2em;` to `a:active{}` and click\
    \ on the link.\n\n> (c) Add `background-color: red;` to `a:hover{}` and hover\
    \ your mouse over the link.\n\n## Exercise 9.2\n\n1. Open the file `Chapter 9\
    \ - Navigation Bar.html` concurrently in your browser and text editor.\n2. This\
    \ page shows an example of how a horizontal navigation bar can be created using\
    \ CSS rules for lists and links. The steps are explained in the book. Study the\
    \ code and try modifying the CSS declaration to improve the design of this navigation\
    \ bar.\n\n## Chapter 10: Tables\n\nHTML tables are ugly looking by default. However,\
    \ with some simple CSS styling, we can easily convert them into gorgeous looking\
    \ tables. In this chapter, we’ll look at how to do that.\n\n### Border, Padding\
    \ and Margin\n\nThe first set of properties we’ll be looking at is the `border`,\
    \ `padding` and `margin` properties. Recall we talked about these properties when\
    \ discussing the CSS box model? HTML tables (`<table>`) and table cells (`<th>`\
    \ and `<td>`) follow the same box model as other CSS elements and can therefore\
    \ be styled using these properties.\n\nTo understand how this work, refer to the\
    \ diagram below (the words ‘Table Margin’ and ‘Table Padding’ are added for reference\
    \ and do not exist on the actual table).\n\n![](images/00014.jpg)\n\nThe CSS rules\
    \ for this table are as follows:\n\n```css\ntable {\n  border: dashed 1px black;\n\
    \  padding: 50px;\n  margin: 60px;\n}\n\nth {\n  border: solid 1px black;\n  padding:\
    \ 30px;\n  text-align: center;\n}\n\ntd {\n  border: solid 1px black;\n  padding:\
    \ 20px;\n}\n```\n\nThe dotted line is the table’s border. Space surrounding the\
    \ dotted border is the table’s margin (declared to be 60px) and space within the\
    \ dotted border is its padding (50px).\n\nThe first row (Firstname, Lastname,\
    \ Age) is defined as the table heading using the `<th>` tag. Space surrounding\
    \ the words ‘Firstname’, ‘Lastname’ and ‘Age’ is the padding for the `<th>` element\
    \ (30px).\n\nThe second, third and fourth row is defined using the `<td>` tag.\
    \ Space surrounding words like ‘Derek’, ‘Aaron’ and ‘31’ is the padding for the\
    \ `<td>` element (20px).\n\nNo margins are declared for the `<th>` and `<td>`\
    \ elements as margins are ignored for table cells. Hence, we cannot specify the\
    \ spacing between the cells. By default, there’ll be a small gap between individual\
    \ table cells. In addition, there’s also a gap between the table’s border (the\
    \ dotted line) and the borders of the cells (the solid lines) even if you set\
    \ table padding to 0px. If you only want one border, you have to use the `border-collapse`\
    \ property:\n\n```css\nborder-collapse: collapse;\n```\n\nWe’ll have a chance\
    \ to play around with the `border`, `padding` and `margin` properties when we\
    \ do the exercise for this chapter. For now, let’s move on to the next property.\n\
    \n### Height and Width\n\nThe width and height of a table can be set using the\
    \ `width` and `height` properties. The values are normally given in pixels or\
    \ as a percentage. For instance, the code below sets the table width to be 100%\
    \ of the parent element and the height to be 500px.\n\n```css\ntable {\n  width:\
    \ 100%;\n  height: 500px;\n}\n```\n\nYou can also use the height property at the\
    \ `tr`, `th` or `td` level. For instance, if you want the table header row to\
    \ have a height of 100px, you can write:\n\n```css\nth {\n  height: 100px;\n}\n\
    ```\n\nIn addition, you can set the width property at the table cell level (i.e.\
    \ for the `td` and `th` elements). If you want the table cells to have a width\
    \ of 200px, you can write:\n\n```css\nth {\n  width: 200px;\n}\n```\n\nIf you\
    \ want to style individual columns, you can use the `id`/`class` attribute to\
    \ do it. For instance if you have the table structure:\n\n```html\n<table>\n \
    \ <tr>\n    <th id=\"firstColumn\">Firstname</th>\n    <th class=\"secondColumn\"\
    >Lastname</th>\n  </tr>\n  <tr>\n    <td>Derek</td>\n    <td>Aaron</td>\n  </tr>\n\
    </table>\n```\n\nIf you only want one border, you have to use the `border-collapse`\
    \ property:\n\n```css\nborder-collapse: collapse;\n```\n\n### Text Alignment\n\
    \nText within table cells can be aligned horizontally using the `text-align` property\
    \ and vertically using the `vertical-align` property. For instance:\n\n```css\n\
    td {\n  text-align: center;\n  vertical-align: top;\n}\n```\n\n### Background,\
    \ Font and Text\n\nTables can also be styled using background, font and text covered\
    \ in Chapter 7. For instance:\n\n```css\nth {\n  background-color: #f2f2f2;\n\
    \  font-weight: bold;\n}\n```\n\n### nth-child Selector\n\nSometimes when we have\
    \ a very large table, it may be difficult to read. One way to improve readability\
    \ is to color alternating rows with the `nth-child()` selector.\n\n```css\ntr:nth-child(even)\
    \ {\n  background-color: lightgray;\n}\n\ntr:nth-child(odd) {\n  background-color:\
    \ white;\n}\n```\n"
