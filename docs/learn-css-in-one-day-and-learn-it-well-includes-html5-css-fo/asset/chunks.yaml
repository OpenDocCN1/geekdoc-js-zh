    ## Preface


    This book is written to help you learn CSS FAST and learn it WELL.


    The book does not assume any prior background in coding. If you are an absolute
    beginner, you''ll find that this book explains complex concepts in an easy to
    understand manner. If you are an experienced coder but new to CSS, this book will
    provide you with enough depth to start coding in CSS immediately.


    All examples and images in the book are carefully chosen to demonstrate each concept
    so that you can gain a deeper understand of the language. Each CSS chapter also
    comes with an exercise at the end of the chapter. The exercises are designed to
    help you further strengthen your understanding. The source code for all the exercises
    can be found in the appendix at the end of the book.


    In addition, as Richard Branson puts it: "The best way of learning about anything
    is by doing". This book comes with an additional bonus project where you’ll be
    guided through the coding of a webpage entirely from scratch. The project uses
    concepts covered in the book and gives you a chance to see how it all ties together.


    You can download the bonus project and the source code for all the exercises at


    [http://www.learncodingfast.com/css](http://www.learncodingfast.com/css).


