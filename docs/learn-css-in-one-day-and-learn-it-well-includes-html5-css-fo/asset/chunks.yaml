    # 第 1 章：引言


    欢迎来到 CSS 的世界。非常荣幸也感谢你选择这本书。在我们共同开启这段学习之旅之前，让我们先定义什么是 CSS。


    CSS 代表级联样式表（Cascading Stylesheet），用于网站的样式设置和设计。它是 Web 程序员创建网站时使用的多种语言之一。其他网页语言包括
    HTML、Javascript 和 PHP 等（仅列举几个）。


    HTML 关注网站的内容和结构。由于没有内容的网站存在是毫无意义的，因此对于任何对网页编程感兴趣的人来说，了解 HTML 是至关重要的。本书将首先从介绍 HTML
    开始，涵盖你可能需要了解的一些 HTML 基础知识。虽然这些内容并非无一不包，但它足够你完成大部分必要的 HTML 任务。如果你已经熟悉 HTML，可以随时跳到第
    3 章。


    ## 工具


    在我们开始编写 HTML 和 CSS 页面之前，让我们先看一些推荐用于网页编程的工具。


    在最基础的层，你只需要一个网页浏览器（例如 Internet Explorer、Chrome、Safari、Firefox）和一个文本编辑器（例如记事本）就可以开始编写网站代码。然而，除非你属于认为真正的程序员不应该使用任何编程辅助工具的流派，否则我强烈建议使用一些在线免费工具来让你的编码生活更轻松。


    最推荐的工具之一是提供语法高亮的高级文本编辑器。语法高亮意味着编辑器会根据文本用途用不同的颜色显示文本。例如，编辑器可以使用红色表示关键字，蓝色表示注释，绿色表示变量。这个简单的功能将使你的代码变得更容易阅读和调试。如果你使用的是
    Windows 机器，我建议使用 Notepad++ ([`notepad-plus-plus.org/`](http://notepad-plus-plus.org/))。对于
    Mac，我建议使用 TextWrangler ([`www.barebones.com/products/textwrangler/`](http://www.barebones.com/products/textwrangler/))。两者都是免费的。


    ### 打开 .HTML 文件


    .HTML 文件有两种打开方式。一种方法是通过双击文件在网页浏览器中打开，这用于查看页面。另一种方法是在文本编辑器中打开进行编辑。要这样做，首先启动你的文本编辑器，然后在编辑器内部打开文件。


    在处理 HTML 文件时，我建议你同时在浏览器和文本编辑器中打开文件，并将两个窗口并排排列。这样，你就可以在编辑器中编辑代码，保存，然后移动到浏览器，刷新页面并立即检查对代码所做更改的效果。在完成第
    3 章到第 10 章的练习时，请遵循此步骤。


    # 第 2 章：HTML 基础


    现在我们已经介绍了网页编程的基础，让我们开始学习一些实际的 HTML 代码。在本章中，我们将涵盖 HTML 的核心内容。如果你熟悉 HTML，可以跳过本章直接进入第
    3 章。


    对于初次接触 HTML 的同学，让我们开始吧。


    ## 什么是 HTML


    HTML 代表超文本标记语言（Hypertext Markup Language），是 Web 程序员用于向网页添加内容的语言。标记语言简单来说是一种用于注释文档的语言，用以解释文本的不同部分是什么以及它们应该如何呈现。例如，我们可以使用
    HTML 来指定内容应该以列表形式还是表格形式呈现。目前的 HTML 版本是 HTML5。


    HTML 最棒的一点是网页的源代码对所有人免费开放。这使得我们很容易通过研究其他网页的代码来学习 HTML。在 Windows 上查看网页源代码，只需在页面任何地方点击右键，并选择“查看源代码”（或其他类似的选项，取决于你使用的浏览器，例如“查看页面源代码”）。如果你使用的是
    Mac，点击菜单栏中的“查看”，选择“开发工具”，然后选择“查看源代码”。


    你看到的大部分源代码看起来会非常复杂，特别是如果你没有任何 HTML 基础知识。不用担心。很快，你就能自己写出这些“复杂”的代码了。


    为了更好地理解 HTML5 的工作原理，让我们从检查 HTML 文档的基本结构开始。


    ### HTML 页面的基本结构


    下面是一个基础 HTML 文档的示例。我在每一行旁边添加了数字。


    ```

    1 <!doctype html>

    2 <html>

    3 <head>

    4 <title>My HTML Page</title>

    5 </head>

    6 <body>

    7 <p>This is just text</p>

    8 <img src="image.jpg" alt="some image">

    9 </body>

    10 </html>

    ```


    从上面的代码可以看出，HTML 使用了许多标签，例如 `<head>` 和 `<body>`。


    #### Doctype


    在第 1 行，`<!doctype html>` 标签告诉浏览器此文档使用的是 HTML5。如果你检查旧页面的源代码，可能会看到类似 `<!DOCTYPE
    HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">`
    的内容。这意味着它们使用的是其他版本，如 HTML4.01。


    插入 开始和结束标签


    在第 2 行，`<html>` 标签告诉浏览器 HTML 代码从这里开始。HTML 中的大多数标签都有对应的结束标签。`<html>` 标签的结束标签位于第
    10 行。它在 `html` 单词之前有一个额外的斜杠 (/)。


    注意，HTML 中的并非所有标签都有结束标签。例如，用于向网页添加图像的 `<img>` 标签就没有结束标签。通常，当我们需要告诉浏览器标签的效果应该何时结束时，就需要一个结束标签。例如，如果我们想在
    HTML 中将某些文本加粗，我们可以写道：


    `This text is <strong>important</strong>, but this text is not.`


    我们将得到：This text is important, but this text is not.


    `<strong>` 标签和 `</<strong>` 标签告诉浏览器加粗效果从何时开始以及何时结束。相比之下，不需要告诉浏览器插入的图像应该何时结束。


    #### head 元素


    在第 3 行，我们是 `head` 元素的开始。


    从广义上说，一个 HTML 文档由两个主要元素组成：`head` 元素和 `body` 元素。


    `head` 元素提供了关于文档的一信息，包括元数据、标题以及附加资源的链接。它从第 3 行的 `<head>` 标签开始，到第 5 行的 `</head>`
    标签结束。在 `<head>...</head>` 标签之间，我们封装了其他提供文档所有这些后台信息的标签。


    在示例中，我们只在 `head` 元素中包含了关于标题的信息。`<title>` 元素（第 4 行）显示浏览器应该在标题栏或页面标签页上显示的标题。在这种情况下，将显示文本“My
    First HTML Page”。我们将在后的章节中介绍更多在 `head` 元素内部使用的标签。


    ### body 元素


