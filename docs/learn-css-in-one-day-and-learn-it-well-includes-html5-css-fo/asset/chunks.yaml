    \ syntaxes as margins and paddings.\n\nborder-color\n\nTo set border color, you\
    \ use the property `border-color`. The value of this property can be set by specifying\
    \ a predefined color name, such as `green`, `red` and `yellow` etc. A total of\
    \ 140 such names are defined in CSS. The site [http://www.w3schools.com/cssref/css_colornames.asp](http://www.w3schools.com/cssref/css_colornames.asp)\
    \ gives a complete list of these names. In addition, you can also set the color\
    \ to transparent, by writing `border-color: transparent;`.\n\nAnother method to\
    \ specify border color is to use the RGB notation (e.g. `rgb(0,255,0)`). All web\
    \ colors are represented by three primary colors: Red, Green and Blue. If you\
    \ write `rgb(0, 255, 0)`, it means you want the second color (i.e. green) to have\
    \ an intensity of 255 (the maximum intensity), and the first and third colors\
    \ (red and blue respectively) to have an intensity of 0 (the least). This will\
    \ simply give you the color green.\n"
