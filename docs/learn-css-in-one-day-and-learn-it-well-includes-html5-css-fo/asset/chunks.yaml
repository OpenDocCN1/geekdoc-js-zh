  trans: "\n\n在 HTML 文档的后续，你有以下 HTML 代码，其中包含一条内联 CSS 规则：\n\n```html\n<p style=”font-size:\
    \ 30px;>Some text</p>\n```\n\n你认为哪种规则将应用于“Some text”这些单词上？\n\n正确答案是内联规则。这是因为在其他相等的情况下，最后声明的规则优先级最高。由于内联\
    \ CSS 是在 HTML 代码内部声明的，它的声明顺序晚于在 `head` 部分中声明的嵌入式 CSS。因此，将应用 30px 的字体大小。\n\n##\
    \ 显示不一致\n\n在处理 CSS 时需要解决的另一个问题是跨浏览器的显示不一致问题。你可能会发现你的网站在不同的浏览器中看起来略有（或极度）不同。大多数显示问题倾向于旧版本的\
    \ Internet Explorer，尽管问题也可能发生在其他浏览器中（尤其是移动浏览器）。\n\n显示不一致的发生的原因是不同的浏览器使用不同的布局引擎来解释网站的\
    \ CSS 代码。例如，`Safari` 和 `Chrome` 使用 `WebKit` 引擎，而 `Firefox` 使用 `Gecko` 引擎。一个引擎计算和显示页面的方式可能与另一个引擎不同。例如，`Internet\
    \ Explorer` 使用的引擎 `Trident` 会为某些页面设计自动加宽页面像素宽度。这可能导致侧边栏因宽度不足而被推到底部。\n\n另一个导致显示不一致的问题是对某些\
    \ CSS 属性缺乏通用支持。某些属性并不是所有浏览器都支持。你可以访问 [`www.caniuse.com`](http://www.caniuse.com/)\
    \ 网站来检查你正在开发的浏览器是否支持特定的 CSS 属性。\n\n有时，只有当我们为 CSS 规则添加前缀时，特定的浏览器才支持某个 CSS 属性。这对于\
    \ CSS3 中的新属性尤其如此。一个例子是 CSS 中的 `column-count` 属性。该属性将元素分成多个列。例如，我们可以通过编写 `column-count:\
    \ 3` 将一个 `div` 元素分为三列。\n\n旧版本的 `Firefox`、`Chrome`、`Safari` 和 `Opera` 不支持此属性。为了让该属性在这些浏览器上生效，你必须将其三个三个声明：\n\
    \n```css\n-webkit-column-count: 3;\n-moz-column-count: 3;\ncolumn-count: 3;\n\
    ```\n\n而不是简单的\n\n```css\ncolumn-count: 3;\n```\n\n`-webkit-` 前缀增加了对旧版本 `Chrome`、`Safari`\
    \ 和 `Opera` 的支持，而 `-moz-` 前缀增加了对 `Firefox` 的支持。此外，我们还有 `-ms-` 前缀增加了对 `Internet\
    \ Explorer` 的支持。\n\n在创建网站时，在各种浏览器上进行测试是有用的，以确保没有内容损坏。修复“损坏”显示的方法取决于导致问题的原因。如果你真的卡住了，我建议在\
    \ [`stackoverflow.com`](http://stackoverflow.com/) 上搜索或发布问题，这是一个非常有用的程序员在线社区。\n\
    \n## 注释\n\n本章最后介绍的是注释。在 CSS 中，我们使用 `/*...*/` 符号向代码中添加注释。例如所示：\n\n```css\n/*\n\
    下面的规则是注释。\np {\n    background-color: black;\n    font-size: 20px;\n    color:\
    \ white;\n}\n*/\n```\n\n`/*` 和 `*/` 符号之间的所有内容会被浏览器忽略。\n\n## 练习 3\n\n从 [`learncodingfast.com/css`](http://learncodingfast.com/css)\
    \ 下载此练习的源代码并解压文件。此练习的源代码可以在“Chapter 3 - Basics of CSS”文件夹中找到。\n\n### 练习 3.1\n\n\
    > 1. 在你的浏览器和文本编辑器中同时打开 `Chapter 3 - Basics of CSS.html` 文件。\n> 2. 首先，在文本编辑器的源代码中寻找以下行：\n\
    ```css\np {\nbackground-color: yellow;\n}\n```\n这选取了所有的 `<p>` 元素并将它们的背景颜色设置为黄色。“This\
    \ is some text in the div element.” 这一行没有被选中，因为它不在任何 `<p>...</p>` 标签之内。\n> 3.\
    \ 现在，让我们尝试将规则从\n```css\np {\nbackground-color: yellow;\n}\n```\n改为\n```css\nP\
    \ {\nBackground-coloR: YELLOW;\n}\n```\n在你的文本编辑器中保存文件并刷新浏览器。注意看没有发生变化？这是因为在大多数情况下\
    \ CSS 是不区分大小写的。\n> 4. 现在，让我们尝试选择不同的 HTML 元素，并观察哪些元素最终变成了黄色背景。对于下方的每一项，只需将 HTML\
    \ 文件第 6 行的选择器更改为所需的选择器即可。\n> 首先，让我们选取 `class = \"myClassPara\"` 的元素。要做到这一点，将 CSS\
    \ 规则中的 `p` 选择器改为 `.myClassPara`。在编辑器中保存文件并刷新浏览器中的页面。注意现在哪个段落被选中了。\n> 5. 现在将选择器改为\
    \ `.myclasspara`。注意现在什么都没有被选中？那是因为 CSS 在选取类和 id 时是区分大小写的。\n> 6. 接下来，让我们选取 `id\
    \ = \"myIDPara\"` 的元素。尝试自己做一下。\n> 明白了吗？\n> 将 `.myClassPara` 改为 `#myIDPara`。注意现在哪个段落被选中了。\n\
    > 7. 现在，将 `#myIDPara` 改为 `#myidpara`。注意什么都没有被选中？那是因为 CSS 在选取类和 id 时是区分大小写的。\n\
    > 8. 接下来，让我们选取 `id = \"myIDPara\"` 的元素。尝试自己做一下。\n> 明白了吗？\n> 将 `.myClassPara` 改为\
    \ `#myIDPara`。注意现在哪个段落被选中了。\n> 9. 现在，将 `#myIDPara` 改为 `#myidpara`。注意什么都没有被选中？那是因为\
    \ CSS 在选取类和 id 时是区分大小写的。\n\n## 第 4 章：CSS 盒模型\n\n到目前，我们已经涵盖了 HTML 和 CSS 的基础。在本章中，我们将开始进行实际的\
    \ CSS 编码。具体来说，我们将学习 CSS 盒模型，并研究如何修改 CSS 盒的外观。\n\n### 什么是 CSS 盒模型\n\nCSS 中的所有元素都被视为盒子。CSS\
    \ 盒子由外边距、边框、内边距和实际内容组成，如下所示。\n\n"
