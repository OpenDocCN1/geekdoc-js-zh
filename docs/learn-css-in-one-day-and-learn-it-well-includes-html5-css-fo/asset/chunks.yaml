    \ and observe what happens to the positions of the two boxes.\n\n> \n\n> Nothing\
    \ changes right? That's because all HTML elements are positioned using `static`\
    \ positioning by default.\n\n> 3. Remove the rule `position: static;` from the\
    \ CSS declaration for `#box1` and `#box2`. Add the following lines to the CSS\
    \ declaration of #`box2`.\n\n> \n\n> `position: relative;`\n\n> `top: 50px;`\n\
    \n> `left: 70px;`\n\n> \n\n> Observe what happens to the position of the second\
    \ box. 3\\. It is now 50px from the top and 10px from the left of its normal position.\n\
    \n> \n\n> Play around with different values for the `top` and `left` properties\
    \ and see what happens to the position of `box2`. Try negative values as well.\
    \ You can also try using the `right` and `bottom` properties.\n\n> 4. Now change\
    \ the CSS declaration of #`box2` back to\n\n> \n\n> `position: relative;`\n\n\
    > `top: 50px;`\n\n> `left: 70px;`\n\n> \n\n> Notice that the text is partially\
    \ hidden by the red box?\n\n> \n\n> If you want the text to appear in front of\
    \ the red box, add the following lines to the CSS declaration of `p`.\n\n> \n\n\
    > `position: relative;`\n\n> `z-index: 2;`\n\n> \n\n> You can set the position\
    \ to either `relative`, `absolute` or `fixed`. It does not matter as long as it\
    \ is not `static`.\n\n> \n\n> Next, add the line `z-index: 1;` to the CSS declaration\
    \ of `#box2`. Refresh the page. The text should now be in front of the red box\
    \ since the `z-index` of the text is greater than the `z-index` of the red box..\n\
    \n> \n\n> If you want the red box to be in front of the text instead, just change\
    \ the `z-index` of `#box2` to a value greater than 2.\n\n> 5. Now, change the\
    \ height of `#box1` to `5000px` and the positioning of `#box2` to `fixed` (`position:\
    \ fixed;`).\n\n> \n\n> Scroll the page. 5\\. The red box does not move as it uses\
    \ fixed positioning now.\n\n> 6. Change the positioning for `#box2` back to `relative`\
    \ and the height of `#box1` back to `100px`. Add the following line just before\
    \ the `<p>` tag in the HTML code at the bottom of the file.\n\n> \n\n> `<div id=\"\
    box3\"></div>`\n\n> \n\n> Now add the following CSS declaration to style `box3`.\n\
    \n> `#box3 {`\n\n> `   position: absolute;`\n\n> `   top: 50px;`\n\n> `   left:\
    \ 150px;`\n\n> `   background-color: yellow;`\n\n> `   width: 50px;`\n\n> `  \
    \ height: 50px;`\n\n> `   padding: 20px;`\n\n> `   border: 5px dotted black;`\n\
    \n> `   margin: 10px;`\n\n> `}`\n\n> \n\n> `box3` uses `absolute` positioning\
    \ and since it is not a child element of any `<div>` elements, it is positioned\
    \ relative to the page. That is, it is positioned 50px from the top of the page\
    \ and 150px from the left.\n\n> 7. Now change the `<div>` code for the three boxes\
    \ to the following:\n\n> \n\n> `<div id=\"box1\"> </div>`\n\n> `<div id=\"box2\"\
    >`\n\n> `       <div id=\"box3\"></div>`\n\n> `</div>`\n\n> \n\n> `box3` is now\
    \ a child element of `box2`. Therefore it is positioned 50px down from the top\
    \ and 150px right from the left side of `box2` as it is now positioned relative\
    \ to `box2`.\n\nExercise 5.2\n\n> 1. Open the file Chapter 5 - Floating.html concurrently\
    \ in your browser and text editor.\n\n> 2. Resize your browser-window to see what\
    \ happens when the `<div>` elements do not have enough room.\n\n> 3. Modify the\
    \ CSS declaration for `div` by changing `float: left;` to `float: right;`. Observe\
    \ what happens to the positions of the boxes.\n\n> 4. Now change the rule back\
    \ to `float: left;` and add the code below to the HTML code, just above the `</body>`\
    \ tag.\n\n> \n\n> `<p>This is some text that is not floated.</p>`\n\n> `<p>This\
    \ is more text that is not floated.</p>`\n\n> `<p>This is yet more text that is\
    \ not floated.</p>`\n\n> \n\n> Refresh the page and observe where the text is.\
    \ Resize the browser window to see what happens when the width of the page is\
    \ narrow.\n\n> 5. Next, add the code\n\n> \n\n> `.clearFloat { clear: both; }`\n\
    \n> \n\n> to the CSS declaration just above the `</style>` tag.\n\n> \n\n> Change\
    \ the first `<p>` tag to `<p class=\"clearFloat\">` and observe what happens.\n\
    \nChapter 6: Display and Visibility\n\nCongratulations. You have now learned a\
    \ fair bit of CSS. In fact, we have covered most of the important concepts in\
    \ CSS, including the CSS box model and the idea of floating and positioning. In\
    \ this chapter, we’ll look at how to pull a disappearing act in CSS.\n\nThat’s\
    \ right. CSS has not one, but two, properties that allow us to remove or hide\
    \ an element. These two properties are the `display` and `visibility` properties.\n\
    \nDisplay\n\nThe CSS `display` property is used to modify how an element is displayed.\
    \ There are three commonly used values: `none`, `inline` and `block`.\n\nThe first\
    \ value ‘`none`’ makes an element disappear. The page will be displayed as if\
    \ the element is not there.\n\nThe second value ‘`inline`’ causes an element to\
    \ be displayed as an inline element. We briefly talked about inline elements in\
    \ Chapter 2 when discussing the difference between `<div>` and `<span>`. Recall\
    \ that an inline element does not start and end with a new line. Another characteristic\
    \ of an inline element is that it will only take up as much height and width as\
    \ it needs. Hence, there is no point specifying the height and width of an inline\
    \ element.\n\nIn contrast, a block element starts and ends with a new line and\
    \ its height and width can be changed. If you want an element to be displayed\
    \ as a block element, you use the ‘`block`’ value.\n\nExample:\n\n`display: none;`\n\
    \nVisibility\n\nThe CSS `visibility` property is used to hide an element. You\
    \ do that by writing `visibility: hidden;`.\n\nThe difference between `visibility:\
    \ hidden` and `display: none` is that for the former, the element is hidden but\
    \ still takes up space. Using the `visibility` property is just like wearing an\
    \ invisible cloak. The element is still there, even though you can’t see it.\n\
    \nIn contrast, when you use `display: none`, the element is essentially removed\
    \ from the page and the page will display as if the element does not exist at\
    \ all.\n\nFor instance, suppose the two properties are applied to the word “magic”\
    \ in the sentence “This is just like magic. You can make words disappear.” below:\n\
    \nFor `visibility: hidden;` you’ll get\n\n“This is just like          . You can\
    \ make words disappear.”\n\nFor `display: none;` you’ll get\n\n“This is just like\
    \ . You can make words disappear.”\n\nExercise 6\n\nDownload the source code for\
    \ this exercise from [http://learncodingfast.com/css](http://learncodingfast.com/css)\
    \ and unzip the file. The source code for this exercise can be found in the Chapter\
    \ 6 - Display and Visibility folder.\n\nExercise 6.1\n\n> 1. Open the file Chapter\
    \ 6 - Display and Visibility.html concurrently in your browser and text editor.\n\
    \n> 2. Change the height and width in the CSS declaration for `#displaydemo`.\
    \ Observe what happens to the yellow box.\n\n> "
