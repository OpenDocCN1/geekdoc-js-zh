    We can select the first letter (T) by writing


    `p::first-letter { … }`


    Note that a double colon is used in this case. Another pseudo-element is the `first-line`
    element. This will select the first line of the text.


    Finally, we can use the `before` and `after` pseudo-elements to insert content
    before, or after, the content of an element. For instance, if we want to add an
    exclamation mark after all `H1` elements, we can write


    `h1::after {`


    `content: “!”;`


    `}`


    This will automatically append an exclamation mark after all `H1` elements. If
    we have the following HTML code


    `<h1>This is a heading</h1>`


    we’ll get


    `This is a heading!`


    Case Insensitivity


    For the most part, CSS selectors and rules are case-insensitive. Hence, you can
    either write


    `div {`


    `       Background-color: GREEN;`


    `}`


    or


    `DIV {`


    `       background-coloR: green;`


    `}`


    Both will work equally well. The only exception to this case-insensitivity is
    when selecting classes and ids.


    If we have


    `<div id= “myID”>Some text</div>`


    `div#myID` will select the above element while `div#MYID` will not.


    Order of Precedence


    Now that we’ve learnt how to select elements, let us move on to a very important
    concept in CSS: order of precedence.


    As mentioned earlier, we can apply CSS code to our website in three different
    ways. It is common for a programmer to use more than one way to apply CSS code
    to a site. For instance, a website may have CSS rules defined in an external file
    AND some additional CSS rules embedded within its `<style>...</style>` tags. This
    may result in more than one rule being applied to the same element. One of the
    most frustrating experience about working with CSS, especially when you are first
    starting out, is when you try to apply a css style to an element and the page
    simply seems to ignore your rule. Most of the time, this is due to the order of
    precedence. Specifically, this happens when more than one rule applies to the
    same element, and another rule has a higher precedence than the one you are specifying.


    Three principles control which CSS rule has a higher precedence.


    Principle 1: The more specific the selector, the higher the precedence


    We won’t go into details about how to calculate the specificity of a selector.
    The main point to remember is that an `id` is considered to be more specific than
    a `class`, and a `class` more specific than an element. Let’s consider the code
    below:


    `div { font-size: 10px; }`


    `#myId { font-size: 12px; }`


    `.myClass { font-size: 14px; }`


    `<div id=”myId” class=”myClass”>Some text</div>`


    Since the `<div>` element has `class=”myClass”` and `id=”myId”`, all three rules
    `div`, `#myId` and `.myClass` will apply to the `<div>` element. However, as `id`
    has the highest precedence, `“Some text”` will be displayed with a font size of
    12px.


    In addition, another point to note about specificity is that the more detailed
    your selector, the higher the precedence. For instance, `div#myId` has a higher
    precedence than `#myId`. This is because `div#myId` is considered to be more detailed
    as it tells us that `myId` is an `id` of the `div` element. In the sample code
    below, the color yellow will be applied.


    `div { color: red; }`


    `div#myId { color: yellow; }`


    `#myId { color: blue; }`


    `.myClass { color: green; }`


    `<div id=”myId” class=”myClass”>Some text</div>`


    Principle 2: If no style is specified, elements inherit styles from their parent
    container


    A child element is an element which lies entirely within the start and end tags
    of another element. For instance, in the code below, `<p>` is a child element
    of the `<body>` element. Since the font size of `<p>` is not defined, it’ll inherit
    this property from the `<body>` element for which the property is defined.


    `body {`


    `       font-size: 1.5em;`


    `}`


    `<body>`


    `       <p>Some text</p>`


    `</body>`


    If the `font-size` property is also not defined for the `<body>` element, the
    browser’s default font size will be used.


    Principle 3: All else being equal, the last declared rule wins


    Suppose you have the following CSS declaration in your HTML `<head>` element.


    `<head>`


    `<style>`


    `       p { font-size: 20px; }`


    `</style>`


    `</head>`'
