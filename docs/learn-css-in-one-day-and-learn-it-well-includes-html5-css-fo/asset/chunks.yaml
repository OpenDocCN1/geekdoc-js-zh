    \ 25px 5px 0 50px;`\n\nsets the values of the individual corners, starting from\
    \ the top-left corner and continuing in a clockwise direction.\n\n`border-top-left-radius:\
    \ 10px;`\n\nsets the top-left border radius to 10px.\n\nIf the element has width\
    \ and height of 100px, padding of 20px and border width of 50 px (total width\
    \ and total height = 100 + 20*2 + 50*2 = 240px), setting the border radius to\
    \ 120px (240 divided by 2) will give you a circle instead of a square.\n\nBorder\
    \ Shorthand\n\nThe `border` property is a shorthand for specifying border width,\
    \ style and color in one line, instead of doing it separately. Simply write\n\n\
    `border: 5px solid green;`\n\nThe values are for width (5px), style (solid) and\
    \ color (green) respectively. Border radius is not included in this shorthand.\n\
    \nExercise 4\n\nDownload the source code for this exercise from [http://learncodingfast.com/css](http://learncodingfast.com/css)\
    \ and unzip the file. The source code for this exercise can be found in the Chapter\
    \ 4 - CSS Box Model folder.\n\nExercise 4.1\n\n> 1. Open the file Chapter 4 -\
    \ CSS Box Model.html concurrently in your browser and text editor.\n\n> 2. Resize\
    \ your browser window and observe how the gibberish text flows around the bigger\
    \ box.\n\n> 3. Modify the CSS declaration for `box1` by changing `width: 100px;`\
    \ and `height: 100px;` to each of the following:\n\n> \n\n> (a) `width: 200px;\
    \ height: 200px;`\n\n> (b) `width: 60%;`\n\n> (c) `height: auto; width: auto;`\n\
    \n> \n\n> Save the file in the text editor and refresh the page in the browser.\
    \ Notice what happens to `box1` in each case.\n\n> 4. Now change the width and\
    \ height of `box1` back to 100px and change the text between the tags `<div id=\"\
    box1\">...</div>` to:\n\n> \n\n> “Learn CSS in One Day and Learn It Well. This\
    \ example shows what happens when text overflows the dimension of the box.”\n\n\
    > \n\n> Next, add each of the following to the CSS declaration of `box1` and notice\
    \ what happens in each case:\n\n> \n\n> (a) `overflow: visible;`\n\n> (b) `overflow:\
    \ hidden;`\n\n> (c) `overflow: scroll;`\n\n> (d) `overflow: auto;`\n\n> 5. Modify\
    \ the CSS declaration for `box1` by changing `margin: 20px;` to each of the following\
    \ and notice what happens to the space around `box1` in each case:\n\n>  \n\n\
    > (a) `margin: 50px;`\n\n> (b) `margin: -50px;`\n\n> (c) `margin: 25px 200px;`\n\
    \n> (d) `margin: 25px 50px 60px 10px;`\n\n> 6. Remove the margin rules for `box1`\
    \ and add the 4 lines below:\n\n> \n\n> `margin-top: 25px;`\n\n> `margin-right:\
    \ 50px;`\n\n> `margin-bottom: 60px;`\n\n> `margin-left: 10px;`\n\n> \n\n> Notice\
    \ any changes to `box1`? There should be no change as this is the same as 5(d)\
    \ above.\n\n> 7. Remove the margin rules for `box1` and add the line below:\n\n\
    > \n\n> `margin: 0 auto;`\n\n> \n\n> Next, change the width of `box1` to 80%.\
    \ Finally, remove the line `float: left;`. Notice what happens. (We’ll explain\
    \ what `float` does in the next chapter). `box1` is now center-aligned.\n\n> 8.\
    \ Now, let’s work on `box2`. Modify the CSS declaration for `box2` by changing\
    \ `padding: 50px;` to each of the following and notice what happens inside `box2`.\n\
    \n> \n\n> (a) `padding: 25px;`\n\n> (b) `padding: -10px;` (refer to note below)\n\
    \n> (c) `padding: 25px 50px;`\n\n> (d) `padding: 25px 50px 60px 10px;`\n\n> \n\
    \n> 8(b) will not work as paddings cannot have negative values. You’ll just end\
    \ up with a padding of 0 pixel.\n\n> 9. Remove the padding rules for `box2` and\
    \ add the 4 lines below:\n\n> \n\n> `padding-top: 25px;`\n\n> `padding-right:\
    \ 50px;`\n\n> `padding-bottom: 60px;`\n\n> `padding-left: 10px;`\n\n> \n\n> Notice\
    \ any changes to `box2`? There should be no change as this is the same as 8(d)\
    \ above.\n\n> 10. Now let's change the border style for `box2`. Remove the line\
    \ `border: 5px solid black;` from the CSS declaration of `box2` and add each of\
    \ the following. Notice what happens to the border in each case:\n\n> \n\n> (a)\
    \ `border-style: solid dotted;`\n\n> (b) `border-style: none dashed double groove;`\n\
    \n> (c) `border-style: inset;`\n\n> (d) `border-style: outset;`\n\n> 11. Next,\
    \ remove the `border-style` rule for `box2` and add the following:\n\n> \n\n>\
    \ `border-top-style: dotted;`\n\n> `border-left-style: double;`\n\n> 12. Now remove\
    \ the rules from part 11 and change border style to solid (`border-style: solid;`)\n\
    \n> \n\n> Next add each of the following rules. Notice what happens to `box2`\
    \ in each case.\n\n> \n\n> (a) `border-width: 25px;`\n\n> (b) `border-width: 25px\
    \ thin;`\n\n> (c) `border-top-width: 30px;`\n\n> 13. Now we are going to change\
    \ the border color for `box2`. Try adding each of the following rules:\n\n> \n\
    \n> (a) `border-color: rgb(255, 0, 0);`\n\n> (b) `border-color: red green;`\n\n\
    > (c) `border-top-color: #12FF5F;`\n\n> 14. Next, we'll try the border shorthand.\
    \ Remove all the border properties for `box2`. Add the following:\n\n> \n\n> `border:\
    \ 5px solid green;`\n\n> 15. Now, let’s try the `border-radius` property. Try\
    \ each of the following:\n\n> \n\n> (a) `border-radius: 20px;`\n\n> (b) `border-radius:\
    \ 10px 20px;`\n\n> (c) `border-radius: 25px 5px 0 50px;`\n\n> (d) `border-top-left-radius:\
    \ 10px;`\n\n> 16. Finally, let’s try to create a circle. First, change the width\
    \ and height of `box2` to 100px, padding to 20px and the property\n\n> \n\n> `border:\
    \ 5px solid green;`\n\n> \n\n> to\n\n>  \n\n> `border: 50px solid green;`.\n\n\
    > \n\n> Now, remove all previous rules for border radius and add the following\
    \ rule:\n\n> \n\n> `border-radius: 120px;`\n\n> \n\n> You end up with a circle\
    \ right? That’s because the border radius is half of the total height (and width)\
    \ of `box2`.\n\nChapter 5: Positioning and Floating\n\nNow that we understand\
    \ the CSS box model, let’s look at how to use CSS to specify the arrangement of\
    \ these boxes on our web pages. In this chapter, we’ll be looking at two of the\
    \ most important concepts in CSS: positioning and floating. Together, these two\
    \ properties handle the layout of our web pages.\n\nPositioning\n\nThe CSS positioning\
    \ property allows you to position an element and specify which element should\
    \ be on top in case of an overlap."
