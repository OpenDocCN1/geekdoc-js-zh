    # Chapter 1: Introduction


    Welcome to the world of CSS. I am so glad and honoured that you picked up this
    book. Before we embark on this learning journey together, let us first define
    what is CSS.


    CSS stands for Cascading Stylesheet and is used for the styling and design of
    a website. It is one of the many languages a web programmer uses to create a website.
    Other web languages include HTML, Javascript and PHP, just to name a few.


    HTML is concerned with the content and structure of a website. As a website’s
    existence is meaningless without content, knowing HTML is essential for anyone
    interested in web programming. This book will first start with an introduction
    to HTML, covering some of the essential basics you need to know about HTML. While
    this coverage is by no means comprehensive, it should be enough for you to perform
    most of the HTML tasks necessary. If you are familiar with HTML, feel free to
    skip to Chapter 3.


    ## Tools of the Trade


    Before we start coding our HTML and CSS pages, let us first look at some of the
    recommended tools for doing web programming.


    At the most basic level, you only need a web browser (e.g. Internet Explorer,
    Chrome, Safari, Firefox) and a text editor (e.g. Notepad) to start coding websites.
    However, unless you belong to the school of thought that real programmers shouldn’t
    use any programming aid, I strongly encourage you to use some of the free tools
    available online to make your coding life easier.


    One of the most recommended tool is an advanced text editor that offers syntax
    highlighting. Syntax highlighting means the editor will display text in different
    colors depending on the purpose of the text. For instance, the editor may use
    red color for keywords, blue for comments and green for variables. This simple
    feature will make your code much easier to read and debug. If you are on a Windows
    machine, I suggest Notepad++ ([http://notepad-plus-plus.org/](http://notepad-plus-plus.org/)).
    For Mac, I suggest TextWrangler ([http://www.barebones.com/products/textwrangler/](http://www.barebones.com/products/textwrangler/)).
    Both are free to use.


    ### Opening a .HTML File


    An .HTML file can be opened in two ways. One way is to open it in a web browser
    by double clicking on the file. This is for viewing the page. Another way is to
    open it in a text-editor for editing. To do that, first launch your text-editor
    and then open the file from within the editor.


    When working with HTML files, I suggest you open the file in your browser and
    text-editor concurrently and arrange the two windows so that they are side-by-side.
    That way, you can edit the code on your editor, save it, and then move over to
    your browser, refresh the page and immediately check the effects of the changes
    you made to the code. Follow this procedure when working on the exercises from
    Chapters 3 to 10.


    # Chapter 2: Basics of HTML


    Now that we’ve covered a basic introduction to web programming, let’s start learning
    some actual HTML code. In this chapter, we’ll be covering the essentials of HTML.
    If you are familiar with HTML, you can skip the chapter and go ahead to Chapter
    3.


    For those of you who are new to HTML, let’s get started.


    ## What is HTML


    HTML stands for Hypertext Markup Language and is a language used by web programmers
    to add content to a web page. A markup language is simply a language for annotating
    a document to explain what different sections of the text are and how they should
    be presented. For instance, we can use HTML to specify whether the content should
    be presented as a list or in table form. The current HTML version is HTML5.


    The nicest thing about HTML is that the source code of a web page is free for
    all to view. This makes it easy for us to learn HTML by studying the codes of
    other web pages. To view the source code of a web page on Windows, simply right-click
    anywhere on the page and select “View Source” (or something similar, such as “View
    Page Source”, depending on the browser you use). If you are on Mac, click on “View”
    in the menu bar, select “Developer” and then select “View Source”.


    Most of the source code that you view will look very complicated, especially if
    you have no prior knowledge in HTML. Don’t worry about that. Soon, you’ll be able
    to write such ‘complicated’ codes yourself.


    To get a better understanding of how HTML5 works, let’s start by examining the
    basic structure of a HTML document.


    ### Basic Structure of a HTML Page


    An example of a basic HTML document is shown below. I’ve added numbers beside
    each line.


    ```

    1 <!doctype html>

    2 <html>

    3 <head>

    4 <title>My HTML Page</title>

    5 </head>

    6 <body>

    7 <p>This is just text</p>

    8 <img src="image.jpg" alt="some image">

    9 </body>

    10 </html>

    ```


    As you can see from the code above, HTML uses a lot of tags such as `<head>` and
    `<body>`.


    #### Doctype


    On line 1, the `<!doctype html>` tag tells the browser that this document uses
    HTML5. If you check the source of older pages, you may see something like `<!DOCTYPE
    HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">`.
    This means they are using other versions such as HTML4.01.


    #### Start and End Tags


    On line 2, the `<html>` tag tells the browser that the HTML code starts here.
    Most tags in HTML have a corresponding end tag. The end tag for the `<html>` tag
    is found on line 10\. It has an additional slash (/) before the word `html`.


    Note that not all tags in HTML have end tags. For instance, the `<img>` tag, which
    is used to add images to our webpage does not have an end tag. Generally, there
    is a need for an end tag when we need to let the browser where the effect of the
    tag should end. For instance, if we want to bold some text in HTML, we can write


    `This text is <strong>important</strong>, but this text is not.`


    We’ll get This text is important, but this text is not.


    The `<strong>` tag and the `</strong>` tag tell the browser where the bold effect
    should start and where it should end. In contrast, there is no need to tell the
    browser where an inserted image should end.


    #### The Head Element


    On line 3, we have the start of the `head` element.


    In the broadest sense, a HTML document is made up of two main elements, the `head`
    and the `body` elements.


    The `head` element provides general information about the document, including
    its meta data, title and links to additional resources. It starts with the `<head>`
    tag on line 3 and ends with the `</head>` tag on line 5\. Within the `<head>...</head>`
    tags, we enclose other tags that provide all these behind-the-scene information
    about the document.


    In our example, we only included information about the title in our `head` element.
    The `title` element (on line 4) shows the title that the browser should display
    on its title bar or on the page''s tab. In this case, the text “My First HTML
    Page” will be displayed. We’ll cover more tags that are used within the `head`
    element in a later section.


    ### The Body Element

