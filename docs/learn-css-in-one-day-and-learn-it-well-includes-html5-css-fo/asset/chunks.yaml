    Now that we understand how HTML works, let us look at the `head` element in detail.


    As mentioned above, the `head` element provides general information about the
    document, such as its metadata, title and links to external resources. Let’s look
    at some of the tags within the `head` element.


    <meta>


    The `<meta>` tag is included within the `<head>…</head>` tags and is used to provide
    additional information about the website to the browser, search engines or other
    web services. These information will not be displayed on the page itself. The
    `<meta>` tag does not have an end tag.


    One common use of the `<meta>` tag is to provide keywords for search engines.
    An example is:


    `<meta name="keywords" content="HTML, CSS, Learn in One Day">`


    You may notice that this tag is a lot longer than the tags we discussed earlier.
    This is because the `<meta>` tag has two attributes, `name` and `content`.


    `name` is used to specify the type of information the tag contains (keywords in
    this case), while `content` is used to specify the content of the information.


    You can also give a description of your website using the `name=description` attribute.
    An example is:


    `<meta name="description" content=”This is my first Website. It teaches you how
    to use HTML and CSS">`


    Another common use of the `<meta>` tag is to use it to specify how the browser
    should control the page zoom level and dimensions. This is done using the `name=viewport`
    attribute. For instance, you can write


    `<meta name="viewport" content="width=300, initial-scale=1">`


    `width=300` sets the width of the viewport to be equals to 300 pixels. One pixel,
    px, is equal to one dot on the computer screen.


    When you set the viewport to 300px and you have an image that is, say, 500 pixels
    wide, you will only see a portion of the image as the image’s width is larger
    than the width of the viewport. To see the rest of the image, you have to scroll
    the page. In contrast, if you set the viewport to 500px, the entire image will
    be shown without any scrolling needed. If you set the viewport to 1000px, the
    entire image will be shown too, but it’ll be smaller and occupy only half the
    width of the screen.


    `initial-scale=1` sets the initial zoom level (1x in this case) of the page when
    it is first loaded by the browser.


    If you are interested in finding out more about how the viewport works, you can
    check out [https://developer.apple.com/library/ios/documentation/AppleApplications/Reference/SafariWebContent/UsingtheViewport/UsingtheViewport.html](https://developer.apple.com/library/ios/documentation/AppleApplications/Reference/SafariWebContent/UsingtheViewport/UsingtheViewport.html)


    <title>...</title>


    The `<title>` tag is used for defining the title that the browser should display
    on its title bar or on the page''s tab.


    <style>...</style>


    The `<style>` tag is used to add internal CSS code to our HTML document. We’ll
    learn how to do that in Chapter 3.


    Example:


    `<style type=”text/css”>`


    `body {`


    `  …`


    `}`


    `</style>`


    <link>


    The `<link>` tag is used to link to an external resource, most commonly used to
    link to an external CSS stylesheet. It does not require an end tag.


    Example:


    `<link rel="stylesheet" type="text/css" href="mystyle.css">`


    The `rel` and `type` attributes simply tell the browser that you are linking to
    a CSS stylesheet. You do not need to modify them. The only attribute that you
    need to modify is the `href` attribute. This attribute is used to state the path
    of the CSS file.


    How to Write Paths to External Files


    The path of any external file always starts from the current folder of the HTML
    document. Suppose we have five folders: ‘User’, ‘Documents’, ‘MyWebsite’, ‘MyCSS’
    and ‘MoreCSS’ with the following structure:


    User > Documents > MyWebsite > MyCSS > MoreCSS


    That is, the ‘User’ folder contains the ‘Documents’ folder, which in turn contains
    the ‘MyWebsite’ folder. Within the ‘MyWesbite’ folder, we have the ‘MyCSS’ folder,
    which contains the ‘MoreCSS’ folder.


    If you are working on a HTML file in ‘MyWebsite’ and you want to link to ‘mystyle.css’
    in the SAME folder, you simply write `href = “mystyle.css”`.


    However, if ‘mystyle.css’ is in the ‘MyCSS’ folder (one level down), you have
    to write `href = “MyCSS/mystyle.css”`. If it is in ‘MoreCSS’ (two levels down),
    you have to write `href = “MyCSS/MoreCSS/mystyle.css`”


    If ‘mystyle.css’ is in the ‘Documents’ folder (one level up), you have to use
    ../ to move one level up. You write `href = “../mystyle.css”`. If it is in the
    ‘User’ folder, you have to move two levels up. You write `href = “../../mystyle.css”`.


    Elements Within the Body Element


    Now that we’ve covered the elements within the `head` element,  let us move on
    to the `body` element.


    Elements for Adding Content to the Page


    First, let us discuss some commonly used elements for adding content to our webpage.
    These tags are enclosed within the `<body>...</body>` tags.


    <p>... </p>


    This is the paragraph tag and is used to add text to a page. Any content within
    the two tags will be displayed as a paragraph. By default, most browsers will
    add a line before and after a paragraph.


    Example:


    `<p>This is a paragraph</p>`


    <img>


    This `<img>` tag is for adding images to your webpage. It requires you to provide
    some additional information like the location of the image, its height and width
    etc. Commonly used attributes of the `<img>` tag include:


    `src`:


    Stands for “source” and is used to state the path of the image. The `src` attribute
    must be provided.


    `height`:


    For specifying the desired display height of the image


    `width`:


    For specifying the desired display width of the image


    `alt`:


    Stands for “alternate” and is used to specify the text to display if the image
    fails to load.


    Example:


    `<img src=”images/myImage.jpg” height=”100px” width=”100px” alt=”My Image”>`


    This will insert the image “myImage.jpg” onto the webpage. The image will be scaled
    to a size of 100px by 100px. If the image fails to load, the text “My Image” will
    be displayed instead.


    <a>...</a>


    The `<a>` tag is used to insert a hyperlink. The most important attribute for
    the `<a>` tag is `href` which is used to specify the URL of the page the link
    goes to.


    Example:


    `<a href=”http://www.google.com”>Click here to go to Google</a>`


    Output:


    [Click here to go to Google](http://www.google.com/)


    Clicking on the link will bring you to the Google website.


    <h1>...</h1> to <h6>...</h6>


    The `<h1>` to `<h6>` tags are heading tags and are used to define HTML headings.
    `<h1>` is the most important heading and `<h6>` is the least important. Text within
    heading tags are normally displayed with a larger font size on the browser, with
    `h1` having the largest font size and `h6` having the smallest.


    Example:


    `<h1>This is the most important heading.</h1>`


    `<h2>This is the second most important heading.</h2>`


    Output:


    This is the most important heading.


    This is the second most important heading.


    <ol>...</ol> and <li>...</li>'
