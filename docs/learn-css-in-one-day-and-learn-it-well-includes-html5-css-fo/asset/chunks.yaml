  trans: "\n\n另一个常用的字符实体是不换行空格（`&nbsp;`）。不换行空格实体用于显示连续的空格。在默认情况下，HTML 不识别连续的空格。如果你在\
    \ HTML 代码中写 5 个空格，浏览器会移除其中的 4 个并只显示一个空格。例如，如果你写\n\n`“There are 5 spaces      here”`\n\
    \n浏览器将将其显示为\n\n`“There are 5 spaces here”。\n\n如果你想显示多个空格，你需要写\n\n`“There are 5\
    \ spaces &nbsp;&nbsp;&nbsp;&nbsp;here”`。\n\n# 第 3 章：CSS 基础\n\n现在我们已经涵盖了大量的 HTML，让我们转向\
    \ CSS。CSS 代表级联样式表（Cascading Stylesheet），正如其名所示，CSS 的核心在于样式设计以及让你的网站看起来非常精美。\n\n\
    CSS 的最新版本是 `CSS3`。与之前的 CSS 版本（即 `CSS1` 和 `CSS2.1`）不同，`CSS3` 将语言分成了不同的模块，以便每个模块可以以不同的速度独立开发。每个模块都添加了新功能，或者扩展了之前在\
    \ `CSS2.1` 中定义的功能能力。本质上，`CSS3` 只是 `CSS2.1` 的扩展。\n\n本书涵盖了 `CSS2.1` 的核心属性，以及 `CSS3`\
    \ 中引入的几个新属性。一旦你掌握了核心属性，你就可以毫无问题地转向 `CSS3` 中新添加的高级属性。这些高级属性允许对你的网站进行更奇幻的样式设计，例如添加过渡和动画。\n\
    \n在本章中，我们将介绍 CSS 的基础，包括它的语法和优先级。然而，在进入 CSS 语法之前，让我们先学习如何向我们的网站添加 CSS 规则。\n\n##\
    \ 应用 CSS 代码\n\n有三种方法可以将 CSS 代码应用到我们的网站中。\n\n第一种是链接到外部文件。这是推荐的方法。要进行链接，你需要将 CSS\
    \ 规则写在一个单独的文本文件中并将其保存为 `.css` 扩展名。在 HTML 代码中添加规则的语法为\n\n```\n<link rel=\"stylesheet\"\
    \ type=\"text/css\" href=\"style.css\">\n```\n\n你将将 `<link>` 标签添加到 `head` 元素中，位于\
    \ `<head>...</head>` 标签之间。前两个属性 `rel` 和 `type  告诉这是一个 CSS 样式表。你不需要修改它们。最后一个属性\
    \ `href` 是你指定要链接的 CSS 文件路径的地方。CSS 文件仅仅是一个包含 CSS 规则的文件，不包含任何 HTML 标签。下例所示。如果代码对你来说意义不大不要担心，我们很快就会讲解。\n\
    \n```\nbody {\n    margin: 0;\n    background-color: green;\n}\n```\n\n将此代码保存为“style.css”，并与\
    \ `.html` 文件放在同一个文件夹中。然后你可以使用上面的 `<link>` 标签将此 CSS 文件链接到你的 HTML 文件。\n\n第二种向我们的网站添加\
    \ CSS 规则的方法是将代码直接嵌入到 HTML 源代码中，位于 `head` 元素内。这是通过 `<style>` 标签实现的。下例所示。\n\n```html\n\
    <head>\n<style>\ndiv {\n    color: blue;\n    width: 100px;\n    height: 200px;\n\
    }\n</style>\n</head>\n```\n\n最后一种方法是使用内联 CSS。内联 CSS 是在你想要应用它的元素的起始标签中，使用 `style`\
    \ 属性指定的。每个规则以分号（`;`）结束。示例如下：\n\n```\n<div style=\"text-decoration:underline; color:blue;\"\
    >Some text</div>\n```\n\n在这三种方法中，链接是首选方法。链接将 HTML 内容与样式规则分离，使其更易维护。当我们需要对多个页面应用相同的\
    \ CSS 规则时，它也非常有用。相反，嵌入式 CSS 通常用于适用于页面的规则。当你需要将一个规则应用于一个元素，或者当你想覆盖应用于同一元素的其他 CSS\
    \ 规则时，内联 CSS 非常方便。这是因为内联 CSS 的优先级高于使用其他两种方法添加的 CSS。我们稍后会讨论优先级。然而，内联 CSS 将样式与内容混合在一起，应该尽可能避免。\n\
    \n## CSS 规则的语法\n\n现在我们已经知道如何将 CSS 规则应用到 HTML 中，让我们学习实际的 CSS 代码。学习 CSS 的第一件事是它的语法，它相对非常直观。语法是：\n\
    \n`selector { property : value; property : value; }`\n\n例如，如果你想为 `<div>` 标签内部的内容设置样式，你可以这样写规则：\n\
    \n```\ndiv {\n    background-color: green;\n    font-size: 12px;\n}\n```\n\n第一个单词\
    \ `div` 是选择器。它告诉浏览器大括号 `{ }` 内部的规则适用于所有带有 `<div>` 标签的元素。在大括号内部，你写所有的声明。你首先声明你想要设置的属性（在第一个声明中是\
    \ `background-color`），紧接着是一个冒号（`:`）。然后，你给出你想要的值（在这种情况下是 `green`）。最后，你用分号（`;`）结束每个声明。\n\
    \n在 CSS 中，缩进和换行并不重要。你也可以这样写你的声明：\n\n```\ndiv { background-color: green; font-size:\
    \ 12px; }\n```\n\n非常直观，对吧？太棒了！让我们继续...\n\n## 选择元素\n\n在上面的示例中，大括号中声明的规则将适用于所有带有\
    \ `<div>` 标签的元素。然而，在大多数情况下，我们希望有所变化。假设你想让一个 `<div>` 元素具有 `12px` 的字体大小，而另一个具有 `14px`\
    \ 的字体大小。你会如何做呢？\n\n### 选择类和 ID\n\n基本上有两种方法。第一种是使用 `id` 属性。在你的 HTML 文档中，不再仅仅使用\
    \ `<div>` 标签，你可以给它添加一个 `id` 属性。例如，你可以写：\n\n```html\n<div id=\"para1\">Some text.</div\n\
    <div id=\"para2\">More text.</div>\n```\n\n在我们的 CSS 代码中，我们可以通过在 `id` 名称前添加 `#`\
    \ 号来选择相应的 `id`。示例所示：\n\n```css\ndiv {\n    background-color: green;\n}\n#para1\
    \ {\n    font-size: 12px;\n}\n#para2 {\n    font-size: 14px;\n}\n```\n\n第一条规则适用于所有带有\
    \ `<div>` 标签的元素。第二条规则仅适用于 `id=\"para1\"` 的元素。第三条规则仅适用于 `id=\"para2\"` 的元素。\n\n\
    除了选择器 `#para1` 之外，你也可以写得更具体，比如 `div#para1`，在 `#` 号前后都不留空格。这两种方法将选择同一个元素，但第二种方法具有更高的优先级（稍后详细介绍）。\n\
    \n注意，`id` 在页面内应该是唯一的。不允许有两个 `<div id=\"para1\">` 标签。一个 `<div id=\"para1\">` 和一个\
    \ `<p id=\"para1\">` 标签也是不允许的，因为它们具有相同的 `id`。即使你有两个具有相同 `id` 的元素，你的 HTML 和 CSS\
    \ 代码也可以工作，但当你开始在网站上使用 JavaScript 或其他脚本语言时就会出现问题。如果你需要对两个不同的元素应用相同的 CSS 规则，可以使用\
    \ `class`。`class` 类似于 `id`，区别在于 `class` 不需要是唯一的。此外，`id` 的优先级高于 `class`。\n\n现在，让我们考虑以下代码：\n\
    \n```html\n<div class=\"myclass1\">Some text.</div\n<p class=\"myclass1\">More\
    \ text.</p>\n<div>Yet more text.</div>\n```\n\n如果你想选择所有的 `<div>` 元素（即第一个和第三个元素），你写：\n\
    \n```css\ndiv { ... }\n```\n\n如果你想选择所有 `class=\"myclass1\"` 的元素（即第一个和第二个元素），你在\
    \ `class` 名称前添加一个点（`.`），如下：\n\n```css\n.myclass1 { ... }\n```\n\n如果你只想选择 `class=\"\
    myclass1\"` 的 `<p>` 标签（即第二个元素），你写：\n\n```css\np.myclass1 { ... }\n```\n\n点的前后不应该留空格。\n\
    \n"
- fmt: "\nAn element can have more than one classes. Multiple classes are separated\
    \ with a space in the HTML attribute. For instance, the `div` below has two classes:\
    \ `myclass1` and `myclass2`.\n\n```html\n<div class=\"myclass1 myclass2\">\n…\n\
    </div>\n```\n\nIf we have the following CSS code,\n\n```css\n.myclass1 { … }\n\
    .myclass2 { … }\n```\n\nthe rules for both `myclass1` and `myclass2` will apply\
    \ to the above `<div>` element.\n\n# More Selectors\n\nIn addition to selecting\
    \ an element by `id` and `class`, CSS offers a large variety of ways to specify\
    \ the elements that we want to select.\n\n## Selecting Multiple Elements\n\nFor\
    \ instance, we can select multiple elements at one go. If we want to select the\
    \ `<div>`, `<p>` and `<ul>` elements, we write:\n\n```css\ndiv, p, ul { … }\n\
    ```\n\n## Selecting Child Elements\n\nIf we want to select all the `<p>` elements\
    \ inside `<div>` elements, we write:\n\n```css\ndiv p { … }\n```\n\nNote that\
    \ there is no comma between `div` and `p`. In this case, the CSS rules will only\
    \ apply to `<p>` elements that are inside `<div>` elements. For instance, if we\
    \ have the HTML structure below, the rules will apply to ‘I am a paragraph inside\
    \ div’ and not to ‘I am a stand-alone paragraph’.\n\n```html\n<div>\n    <p>I\
    \ am a paragraph inside div</p>\n</div>\n<p>I am a stand-alone paragraph</p>\n\
    ```\n\nThe first paragraph ‘I am a paragraph inside div’ is called a child element\
    \ of the `<div>` tag as its start and end tags (`<p>` and `</p>`) lie entirely\
    \ within the `<div>...</div>` tags.\n\n## Selecting by Attribute\n\nYou can also\
    \ select an element based on its attribute. If you want to select all hyperlinks\
    \ that link to `http://www.learncodingfast.com/`, you write:\n\n```css\na[href=\"\
    http://www.learncodingfast.com\"] { … }\n```\n\nThere should be no space before\
    \ the square bracket. If you have the following HTML code, only the first link\
    \ will be selected.\n\n```html\n<a href=\"http://www.learncodingfast.com/\">Learn\
    \ Coding Fast</a>\n<a href=\"http://www.google.com/\">Google</a>\n```\n\n## Selecting\
    \ Pseudo-classes\n\nAnother commonly used selector is the pseudo-class selector.\
    \ A pseudo-class refers to a special state of an element. The most common pseudo-classes\
    \ are those for the `<a>...</a>` element. A hyperlink can be in one of four states:\n\
    \n- `link` (an unvisited link)\n- `visited` (a visited link)\n- `hover` (when\
    \ the user mouses over it), or\n- `active` (when the link is clicked).\n\nWe can\
    \ select a hyperlink based on the state it is in. For instance, to select the\
    \ hover state, we write:\n\n```css\na:hover { … }\n```\n\nThe keyword `hover`\
    \ is added to the back of the `a` selector using a colon (`:`), with no spaces\
    \ before and after the colon. We’ll come back to the concept of selecting and\
    \ styling different states of a hyperlink in Chapter 9.\n\nIn addition to selecting\
    \ different states of a hyperlink, we can also use pseudo-classes to select child\
    \ elements. Suppose we have a `<div>` element with three `<p>` child elements:\n\
    \n```html\n<div>\n    <p>I am the first child</p>\n    <p>I am the second child</p>\n\
    \    <p>I am the third child</p>\n</div>\n```\n\nWe can use the `first-child`\
    \ pseudo-class to select the first `<p>` element. We can also use the `last-child`\
    \ selector to select the last child or the `nth-child(n)` selector to select the\
    \ nth child. For instance, if we write:\n\n```css\np:nth-child(2) { … }\n```\n\
    \nwe’ll be selecting the paragraph ‘I am the second child’ because of the number\
    \ ‘2’ in the parenthesis `()`.\n\n## Selecting Pseudo-elements\n\nIn addition\
    \ to pseudo-classes, CSS also has the concept of pseudo-elements. A pseudo-element\
    \ refers to a specified part of an element, such as the first letter or the first\
    \ line of an element.\n\nFor instance, if we have the following `<p>` element:\n\
    \n```html\n<p>This is some text.</p>\n```\n\nWe can select the first letter (T)\
    \ by writing:\n\n```css\np::first-letter { … }\n```\n\nNote that a double colon\
    \ is used in this case. Another pseudo-element is the `first-line` element. This\
    \ will select the first line of the text.\n\nFinally, we can use the `before`\
    \ and `after` pseudo-elements to insert content before, or after, the content\
    \ of an element. For instance, if we want to add an exclamation mark after all\
    \ `<h1>` elements, we can write:\n\n```css\nh1::after {\n    content: \"!\";\n\
    }\n```\n\nThis will automatically append an exclamation mark after all `<h1>`\
    \ elements. If we have the following HTML code:\n\n```html\n<h1>This is a heading</h1>\n\
    ```\n\n# Case Insensitivity\n\nFor the most part, selectors are case-insensitive.\
    \ However, the only exception is `id` and `class` names in some contexts (Wait,\
    \ based on the text provided: \"For the most part, selectors are case-insensitive\"\
    ). Actually, the text provided is a bit fragmented here, but I will preserve the\
    \ core message.\n\n# Order of Precedence\n\nNow that we’ve learned how to select,\
    \ let us move on to a very important concept: order of precedence. Three principles\
    \ control which rule applies.\n\n## Principle 1: The more specific the selector,\
    \ the higher the precedence\n\nWe won’t go into details about how to calculate\
    \ specificity. The main point to remember is that `id` is considered more specific\
    \ than `class`, and `class` more specific than an element. Let’s consider the\
    \ code below:\n\n```css\ndiv { font-size: 10px; }\n#myId { font-size: 12px; }\n\
    .myClass { font-size: 14px; }\n```\n```html\n<div id=\"myId\" class=\"myClass\"\
    >Some text</div>\n```\n\nSince the `<div>` element has `class=\"myClass\"` and\
    \ `id=\"myId\"`, all three rules `div`, `#myId` and `.myClass` apply. However,\
    \ as `id` has the highest precedence, “Some text” will be displayed with 12px.\n\
    \nIn addition, another point about specificity is that the more detailed your\
    \ selector, the higher precedence. For instance, `div#myId` has a higher precedence\
    \ than `#myId`. This is because `div#myId` is more detailed as it tells us `myId`\
    \ is an `id` of the `div` element. In the sample code below, the color yellow\
    \ will be applied.\n\n```css\ndiv { color: red; }\ndiv#myId { color: yellow; }\n\
    #myId { color: blue; }\n.myClass { color: green; }\n```\n\n## Principle 2: If\
    \ no style is specified, elements inherit styles from parent container\n\nA child\
    \ element is an element which lies entirely within the start and end tags of another\
    \ element. For instance, in the code below, `<p>` is a child element of the `<body>`\
    \ element. Since the font size of `<p>` is not defined, it’ll inherit this property\
    \ from the `<body>` element for which the property is defined.\n\n```css\nbody\
    \ {\n    font-size: 1.5em;\n}\n```\n```html\n<body>\n    <p>Some text</p>\n</body>\n\
    ```\n\nIf the `font-size` property is also not defined for the `<body>` element,\
    \ the browser’s default font size will used.\n\n## Principle 3: All else being\
    \ equal, the last declared rule wins\n\nSuppose you have the following CSS declaration\
    \ in your HTML `<head>` element.\n\n```html\n<head>\n<style>\n    p { font-size:\
    \ 20px; }\n</style>\n</head>\n```\n"
