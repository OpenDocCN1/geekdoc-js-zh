  trans: "\n一个元素可以有多个类。在 HTML 属性中，多个类之间用空格分隔。例如，下面的 `div` 元素有两个类：`myclass1` 和 `myclass2`。\n\
    \n```html\n<div class=\"myclass1 myclass2\">\n…\n</div>\n```\n\n如果我们有以下 CSS 代码：\n\
    \n```css\n.myclass1 { … }\n.myclass2 { … }\n```\n\n那么 `myclass1` 和 `myclass2`\
    \ 的规则都适用于上述 `<div>` 元素。\n\n# 更多选择器\n\n除了通过 `id` 和 `class` 选择元素外，CSS 还提供了许多方法来指定我们想要选择的元素。\n\
    \n## 选择多个元素\n\n例如，我们可以一次选择多个元素。如果我们想选择 `<div>`、`<p>` 和 `<ul>` 元素，我们可以写：\n\n```css\n\
    div, p, ul { … }\n```\n\n## 选择子元素\n\n如果我们想选择 `<div>` 元素内部所有的 `<p>` 元素，我们可以写：\n\
    \n```css\ndiv p { … }\n```\n\n注意 `div` 和 `p` 之间没有逗号。在这种情况下，CSS 规则将仅适用于 `<div>`\
    \ 内部的 `<p>` 元素。例如，如果我们有下所示 HTML 结构，规则将适用于“I am a paragraph inside div”，而不会适用于“I\
    \ am a stand-alone paragraph”。\n\n```html\n<div>\n    <p>I am a paragraph inside\
    \ div</p>\n</div>\n<p>I am a stand-alone paragraph</p>\n```\n\n第一个段落“I am a paragraph\
    \ inside div”被称为 `<div>` 标签的子元素，因为它的起始和结束标签（`<p>` 和 `</p>`）完全位于 `<div>...</div>`\
    \ 标签之内。\n\n## 按属性选择\n\n你也可以根据元素的属性来选择元素。如果你想选择所有指向 `http://www.learncodingfast.com/`\
    \ 的超链接，你可以写：\n\n```css\na[href=\"http://www.learncodingfast.com\"] { … }\n```\n\
    \n方括号前不应该有空格。如果你有以下 HTML 代码，只有第一个链接会被选中。\n\n```html\n<a href=\"http://www.learncodingfast.com/\"\
    >Learn Coding Fast</a>\n<a href=\"http://www.google.com/\">Google</a>\n```\n\n\
    ## 选择伪类\n\n另一个常用的选择器是伪类选择器。伪类指的是元素的一种特殊状态。最常见的伪类是针对 `<a>...</a>` 元素的伪类。超链接可以处于四种状态之一：\n\
    \n- `link`（未访问过的链接）\n- `visited`（已过的链接）\n- `hover`（当用户鼠标悬停在其上方时），或\n- `active`（当链接被点击时）。\n\
    \n我们可以根据链接所处的状态来选择它。例如，要选择悬停状态，我们写：\n\n```css\na:hover { … }\n```\n\n关键字 `hover`\
    \ 通过冒号（`:`）添加到 `a` 选择器的后面，冒号前后均不留空格。我们将在第 9 章中回到选择和样式化链接不同状态的概念。\n\n除了选择链接的不同状态外，我们还可以使用伪类来选择子元素。假设我们有一个带有三个\
    \ `<p>` 子元素的 `<div>` 元素：\n\n```html\n<div>\n    <p>I am the first child</p>\n\
    \    <p>I am the second child</p>\n    <p>I am the third child</p>\n</div>\n```\n\
    \n我们可以使用 `first-child` 伪类来选择第一个 `<p>` 元素。我们也可以使用 `last-child` 选择器选择最后一个子元素，或者使用\
    \ `nth-child(n)` 选择器来选择第 n 个子元素。例如，如果我们写：\n\n```css\np:nth-child(2) { … }\n```\n\
    \n由于括号 `()` 中的数字‘2’，我们将选择段落“I am the second child”。\n\n## 选择伪元素\n\n除了伪类，CSS 还有伪元素的概念。伪元素指的是元素的指定部分，例如元素的第一个字母或第一行。\n\
    \n例如，如果我们有下所示的 `<p>` 元素：\n\n```html\n<p>This is some text.</p>\n```\n\n我们可以通过书写以下代码来选择第一个字母\
    \ (T)：\n\n```css\np::first-letter { … }\n```\n\n注意，在这种情况下使用了双冒号。另一个伪元素是 `first-line`\
    \ 元素。它将选择文本的第一行。\n\n最后，我们可以使用 `before` 和 `after` 伪元素在元素的内容之前或之后插入内容。例如，如果我们想在所有的\
    \ `<h1>` 元素之后添加一个感叹号，我们可以写：\n\n```css\nh1::after {\n    content: \"!\";\n}\n```\n\
    \n这将在会在所有的 `<h1>` 元素之后添加一个感叹号。如果我们有以下 HTML 代码：\n\n```html\n<h1>This is a heading</h1>\n\
    ```\n\n# 大小不敏感\n\n在大多数情况下，选择器是不区分大小写的的。然而，唯一的例外是某些语境下的 `id` 和 `class` 名称（等等，根据提供的文本：“在大多数情况下，选择器是不区分大小写的的”）。实际上，提供的文本有些碎片化，但我将保留核心信息。\n\
    \n# 优先级\n\n现在我们已经学会了如何选择，让我们进入一个非常重要的概念：优先级。三个原则控制着哪条规则生效。\n\n## 原则 1：选择器越具体，优先级越高\n\
    \n我们不会详细介绍如何计算选择性。要记住的点是 `id` 比 `class` 更具体，而 `class` 比元素更具体。考虑以下代码：\n\n```css\n\
    div { font-size: 10px; }\n#myId { font-size: 12px; }\n.myClass { font-size: 14px;\
    \ }\n```\n```html\n<div id=\"myId\" class=\"myClass\">Some text</div>\n```\n\n\
    由于 `<div>` 元素拥有 `class=\"myClass\"` 和 `id=\"myId\"`，三条规则 `div`、`#myId` 和 `.myClass`\
    \ 都生效。然而，由于 `id` 优先级最高，“Some text”将以 12px 显示。\n\n此外，关于特性的另一点是，选择器越详细，优先级越高。例如，`div#myId`\
    \ 的优先级高于 `#myId`。这是因为 `div#myId` 更详细，因为它告诉我们 `myId` 是 `div` 元素的 `id`。在示例代码中，将应用黄色。\n\
    \n```css\ndiv { color: red; }\ndiv#myId { color: yellow; }\n#myId { color: blue;\
    \ }\n.myClass { color: green; }\n```\n\n## 原则 2：如果没有指定样式，元素将从父容器继承样式\n\n子元素是完全位于另一个元素的起始和结束标签之内的元素。例如，在下代码中，`<p>`\
    \ 是 `<body>` 元素的子元素。由于没有定义 `<p>` 的字体大小，它将从定义了该属性的 `<body>` 元素继承该属性。\n\n```css\n\
    body {\n    font-size: 1.5em;\n}\n```\n```html\n<body>\n    <p>Some text</p>\n\
    </body>\n```\n\n如果 `<body>` 元素也没有定义 `font-size` 属性，将使用浏览器的字体字体。\n\n## 原则 3：在其他相等的情况下，最后声明的规则胜出\n\
    \n假设你在 HTML `<head>` 元素中有以下 CSS 声明。\n\n```html\n<head>\n<style>\n    p { font-size:\
    \ 20px; }\n</style>\n</head>\n```\n"
- fmt: "\nFurther down the HTML document, you have the following HTML code, with an\
    \ inline CSS rule:\n\n```html\n<p style=”font-size: 30px;>Some text</p>\n```\n\
    \nWhich rule do you think will be applied to the words “Some text”?\n\nThe correct\
    \ answer is the inline rule. This is because all things being equal, the rule\
    \ that is declared last has the highest precedence. Since inline CSS is declared\
    \ within the HTML code, it is declared later than the embedded CSS which is declared\
    \ in the `head` section. Hence, a font size of 30px will be applied.\n\n## Display\
    \ Inconsistency\n\nAnother issue to deal with when working with CSS is the problem\
    \ of display inconsistency across browsers. You may find that your website looks\
    \ slightly (or drastically) different in different browsers. Most display issues\
    \ tend to occur in older versions of Internet Explorer, although issues can occur\
    \ in other browsers too (especially mobile browsers).\n\nDisplay inconsistencies\
    \ occur because different browsers use different layout engines to interpret the\
    \ site’s CSS code. For instance, `Safari` and `Chrome` use the `WebKit` engine\
    \ while `Firefox` uses the `Gecko` engine. One engine may calculate and display\
    \ a page differently from another engine. For instance `Trident`, the engine used\
    \ by `Internet Explorer`, automatically widens a page’s pixel width for certain\
    \ page designs. This can lead to the sidebar being pushed to the bottom due to\
    \ insufficient width.\n\nAnother problem causing display inconsistency is the\
    \ lack of universal support for some CSS properties. Some properties are not supported\
    \ by all browsers. You can go to the site [http://www.caniuse.com](http://www.caniuse.com/)\
    \ to check if a certain CSS property is supported by the browser that you are\
    \ developing for.\n\nSometimes, a certain CSS property is supported by a particular\
    \ browser only when we add a prefix to our CSS rules. This is especially true\
    \ for newer properties in CSS3. An example is the `column-count` property in `CSS3`.\
    \ This property divides an element into multiple columns. For instance, we can\
    \ divide a `div` element into three columns by writing `column-count: 3`.\n\n\
    This property is not supported by older versions of `Firefox`, `Chrome`, `Safari`\
    \ and `Opera`. To enable the property to work on these browsers, you have to write\
    \ it as three declarations:\n\n```css\n-webkit-column-count: 3;\n-moz-column-count:\
    \ 3;\ncolumn-count: 3;\n```\n\ninstead of just\n\n```css\ncolumn-count: 3;\n```\n\
    \nThe `-webkit-` prefix adds support for older versions of `Chrome`, `Safari`\
    \ and `Opera` while the `-moz-` prefix adds support for `Firefox`. In addition,\
    \ we also have the `-ms-` prefix that adds support for `Internet Explorer`.\n\n\
    When creating your website, it is useful to test it on various browsers to ensure\
    \ that nothing is broken. The way to fix a ‘broken’ display depends on the issue\
    \ causing it. If you are really stuck, I suggest searching or posting the question\
    \ on [http://stackoverflow.com](http://stackoverflow.com/), which is a very useful\
    \ online community for programmers.\n\n## Comments\n\nThe last thing to cover\
    \ in this chapter is comments. In CSS, we add comments to our code using the `/*...*/`\
    \ symbols. An example is as follows:\n\n```css\n/*\nThe rules below are comments.\n\
    p {\n    background-color: black;\n    font-size: 20px;\n    color: white;\n}\n\
    */\n```\n\nEverything between the `/*` and `*/` symbols is ignored by the browser.\n\
    \n## Exercise 3\n\nDownload the source code for this exercise from [http://learncodingfast.com/css](http://learncodingfast.com/css)\
    \ and unzip the file. The source code for this exercise can be found in the Chapter\
    \ 3 - Basics of CSS folder.\n\n### Exercise 3.1\n\n> 1. Open the file `Chapter\
    \ 3 - Basics of CSS.html` concurrently in your browser and text editor.\n> 2.\
    \ First, look for the following lines in the source code in your text editor:\n\
    ```css\np {\nbackground-color: yellow;\n}\n```\nThis selects all the `<p>` elements\
    \ and sets their background colors to yellow. The line 'This is some text in the\
    \ div element.' is not selected because it is not within any `<p>...</p>` tags.\n\
    > 3. Now let’s try changing the rule from\n```css\np {\nbackground-color: yellow;\n\
    }\n```\nto\n```css\nP {\nBackground-coloR: YELLOW;\n}\n```\nSave the file in your\
    \ text editor and refresh your browser. Notice that nothing changes? This is because\
    \ CSS is not case-sensitive in most cases.\n> 4. Now, let us try to select different\
    \ HTML elements and observe which elements end up with a yellow background. For\
    \ each item below, simply change the selector on line 6 in the HTML file to the\
    \ required selector.\n> First, let’s select the element with `class = \"myClassPara\"\
    `. To do that, change the `p` selector in the CSS rule to `.myClassPara`. Save\
    \ the file in the editor and refresh the page in the browser. Notice which paragraph\
    \ is selected now.\n> 5. Now change the selector to `.myclasspara`. Notice that\
    \ nothing is selected now? That is because CSS is case-sensitive when selecting\
    \ classes and ids.\n> 6. Next, let's select the element with `id = \"myIDPara\"\
    `. Try doing it yourself.\n> Got it?\n> Change `.myClassPara` to `#myIDPara`.\
    \ Notice which paragraph is selected now.\n> 7. Now, change `#myIDPara` to `#myidpara`.\
    \ Notice that nothing is selected? That is because CSS is case-sensitive when\
    \ selecting classes and ids.\n> 8. Next, let's select the element with `id = \"\
    myIDPara\"`. Try doing it yourself.\n> Got it?\n> Change `.myClassPara` to `#myIDPara`.\
    \ Notice which paragraph is selected now.\n> 9. Now, change `#myIDPara` to `#myidpara`.\
    \ Notice that nothing is selected? That is because CSS is case-sensitive when\
    \ selecting classes and ids.\n\n## Chapter 4: CSS Box Model\n\nSo far, we’ve covered\
    \ the basics of HTML and CSS. In this chapter, we’ll start to do some actual CSS\
    \ coding. Specifically, we’ll learn about the CSS box model and look at how we\
    \ can modify the look and feel of a box in CSS.\n\n### What is the CSS Box Model\n\
    \nAll elements in CSS are treated as boxes. CSS boxes consist of margins, borders,\
    \ padding, and the actual content as shown below.\n"
