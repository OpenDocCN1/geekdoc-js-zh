  trans: "\n\n## 7. 分别在第一个、第二个和第三个 `<th>` 起始标签上添加 `id=\"firstColumn\"`、`id=\"secondColumn\"\
    ` 和 `id=\"thirdColumn\"` 属性。接下来，添加以下 CSS 规则来分别调整三列的宽度：\n\n```css\n#firstColumn\
    \ {\n    width: 100px;\n}\n#secondColumn {\n    width: 200px;\n}\n#thirdColumn\
    \ {\n    width: 50px;\n}\n```\n\n刷新页面并观察变化。尝试使用不同的值调整宽度。\n\n## 8. 修改 `tr` 的 CSS\
    \ 声明并观察表格发生了什么。尝试添加：\n\n(a) `text-align: center;`\n(b) `vertical-align: top;`\n\
    \n从 `tr` 中删除上述属性并将它们添加到 `th` 中。注意发生了什么。对 `td` 重复相同的操作。如果你没有看到任何区别，请增加表格的宽度和/或行的高度。\n\
    \n## 9. 修改 `tr` 的 CSS 声明并观察表格发生了什么。尝试添加：\n\n(a) `background-color: green;`\n(b)\
    \ `color: white;`\n\n从 `tr` 中删除上述属性并将它们添加到 `th` 中。注意发生了什么。\n\n现在，从 `th` 中删除属性并将它们添加到\
    \ `td` 中。\n\n## 10. 最后，让我们尝试为交替行染色。首先从 `td` 中移除 `background-color` 和 `color` 规则。接下来，添加以下代码并观察发生了什么。\n\
    \n```css\ntr:nth-child(even) {\n    background-color: lightgreen;\n}\ntr:nth-child(odd)\
    \ {\n    background-color: lightgray;\n}\n```\n\n## 额外项目\n\n恭喜你！我们现在涵盖了足够的 CSS（以及\
    \ HTML）基础知识来从开始编写我们的第一个网页。学习 CSS 的最佳方法是实践。因此，我在书中包含了一个额外项目，它将引导你编写一个虚构旅行社的网页。你可以在\
    \ `http://www.learncodingfast.com/demo/jetspeed.html` 查看该项目的演示。\n\n最初我打算将该项目放在书末。然而，考虑到\
    \ CSS 的图形化特性，我决定在 Kindle 书中包含该项目的所有指令和图像并不理想。因此，我为项目创建了一个单独的 PDF 文件，你可以在 `http://learncodingfast.com/css`\
    \ 下载。\n\n我强烈鼓励你尝试这个项目，因为它将让你有机会看到在书中学到的所有概念是如何结合在一起的。通过完成项目将有助于巩固你的学习，并填补你可能存在的任何空白。\n\
    \n祝编程愉快！\n\n## 感谢\n\n我们已经读到了书的最后。感谢你阅读这本书，希望你喜欢它。更重要的是，我诚地希望这本书帮助你掌握了 CSS 的基础知识。\n\
    \n我知道你本可以在几十本 CSS 相关的书中选择任何一本，但你选择了这本书。再次感谢你下载这本书并一直读到最后。请尝试练习题和额外项目。你将在实践中学学到很多。\n\
    \n现在，我想请你帮个“小”忙。你能否花一或两分钟时间[在亚马逊上为此书留评论](http://www.amazon.com/review/create-review/ref=cm_cr_dp_wrt_summary?ie=UTF8&asin=B00UI2QHQG&channel=detail-glance&nodeID=133140011&store=digital-text)？\n\
    \n这些反馈对我将非常有帮助，并将帮助我继续编写更多编程指南。如果你喜欢这本书或有任何改进建议，请告诉我。我将深表感激 :)\n\n最后但同样重要的是，记住你可以在\
    \ `http://www.learncodingfast.com/css` 下载项目和练习源代码。\n\n你也可以通过 `jamie@learncodingfast.com`\
    \ 与我联系。\n\n## 附录 A：练习源代码\n\n### 练习 3.1\n\n```html\n<!doctype html>\n<html>\n<head><title>第\
    \ 3 章 - CSS 基础</title>\n<style> \np{\nbackground-color: yellow;\n}\n</style>\n\
    </head>\n<body>\n<h1>第 3 章 - CSS 基础</h1>\n<h2>CSS 选择器</h2>\n<p>这个练习使用背景颜色来帮助我们确定我们正在选择哪个元素。这个段落既没有\
    \ class 没有 id。</p>\n<p id=\"myIDPara\">这个段落有 id = \"myIDPara\".</p>\n<p class=\"\
    myClass\">这个段落有 class=\"myClass\".</p>\n<p class=\"myClass mySecondPara\">这个段落有\
    \ class=\"myClass\" 和 class=\"mySecondPara\".</p>\n<div>\n    这是 div 中的一些文本。\n\
    \    <p>这个段落是 'div' 的第一个孩子。</p>\n    <p>这个段落是 'div' 的第二个孩子。</p>\n    <p>这个段落是\
    \ 'div' 的第三个孩子。</p>\n</div>\n<a href=\"http://www.learncodingfast.com\">快速学习</a><br>\n\
    <a href=\"http://www.google.com\">Google</a>\n</body></html>\n```\n\n### 练习 4.1\n\
