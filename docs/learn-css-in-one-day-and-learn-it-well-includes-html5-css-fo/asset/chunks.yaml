  trans: "\n\n`<ol>` 标签代表有序列表，用于创建一个以数字或字母作为列表标记的列表。\n\n### 有序列表\n\n示例：\n\n```html\n\
    <ol>\n  <li>Chocolate</li>\n  <li>Strawberry</li>\n  <li>Vanilla</li>\n</ol>\n\
    ```\n\n输出：\n> 1. Chocolate（巧克力）\n> 2. Strawberry（草莓）\n> 3. Vanilla（香草味）\n\n###\
    \ 无序列表\n`<ul>`...`</ul>` 和 `<li>`...`</li>`\n\n`<ul>` 标签代表无序列表，与 `<ol>`</ol>`\
    \ 标签类似。但是，它不使用数字或字母作为列表标记，而是使用形状（如圆点或空心圆）。\n\n### 表格\n`<table>`...`</table>`,\
    \ `<tr>`...`</tr>`, `<th>`...`</th>`, `<td>`...`</td>`\n\n`<table>` 标签用于创建表格。`<tr>`\
    \ 代表“表格行（Table Row）”，`<th>` 代表“表头（Table Header）”，而 `<td>` 代表“表格数据（Table Data）”。在\
    \ HTML 中，表格是逐行创建的。\n\n示例（数字不属于代码内容）：\n\n```html\n<table>\n  <tr>\n    <th>Name</th>\n\
    \    <th>Gender</th>\n  </tr>\n  <tr>\n    <td>Abigail</td>\n    <td>F</td>\n\
    \  </tr>\n  <tr>\n    <td>Benny</td>\n    <td>M</td>\n  </tr>\n</table>\n```\n\
    \n这段代码将为你生成一个有 3 行 2 列的表格。第 2 到 5 行定义了表格的第一行，由于使用了 `<th>` 标签，它是表头行。第 6 到 9 行定义了第二行，10\
    \ 到 13 行定义了第三行。取决于你在 CSS 中如何样式化表格，你将得到一个类似于下面的表格：\n\n![](img/00005.jpg)\n\n###\
    \ 与 CSS 结合使用的元素\n\n有两个特殊的 HTML 元素在 HTML 中没有任何固有含义。它们主要与 CSS 结合使用，为网页的特定部分设置样式。这两个元素是\
    \ `div` 和 `span`。\n\n#### Div 标签\n`<div>`...`</div>`\n\n`<div>` 代表“划分（division）”，用于定义\
    \ HTML 文档中的一个划分或区域。`<div>` 标签通常与 CSS 结合使用，以格式化 `<div>`...`</div>` 标签内的内容。\n\n\
    例如，如果我们写：\n\n```html\n<div>\n  This is some division in the HTML document.\n \
    \ <ol>\n    <li>Chocolate</li>\n    <li>Strawberry</li>\n    <li>Vanilla</li>\n\
    \  </ol>\n</div>\n```\n\n我们可以使用 CSS 来格式化 `div` 标签内的所有内容（即：文本和有序列表）。我们将在下一章学习如何操作。\n\
    \n#### Span 标签\n`<span>`...`</span>`\n\n`<span>` 标签与 `<div>` 标签类似。主要区别在于 `<div>`\
    \ 是**块级元素 (block element)**，而 `<span>` 是**行内元素 (inline element)**。\n\n块级元素是以新换行开始并结束的元素。相比之下，行内元素不会以换行开始或结束。例如，如果我们写：\n\
    \n`This is a <div>block element</div>, while this is an <span>inline</span> element.`\n\
    \n我们将得到：\n\nThis is a\nblock element\nwhile this is an inline element.\n\n由于短语“block\
    \ element”被标记为 `<div>`标签，它会在新行开始并结束。另一方面，“inline”一词是一个行内元素，不会在新行开始或结束。通常，我们倾向于使用\
    \ `<div>` 来封装文档的章节，而 `<span>` 用于封装一小部分文本、图像等。\n\n### 用于向网站添加 JavaScript 代码的元素\n\
    \n`<script>`...`</script>`\n\n`<script>` 标签用于向我们的 HTML 文档添加内部 JavaScript 代码，或链接到外部脚本。JavaScript\
    \ 是一种脚本语言，为我们的网站添加交互性。\n\n示例（添加内部 JS 代码）：\n\n```html\n<script>\n  document.getElementById(\"\
    para1\").innerHTML = \"Hello JavaScript!\";\n</script>\n```\n\n示例（链接到外部 JS 脚本）：\n\
    \n```html\n<script type=\"text/javascript\" src=\"myscripts.js\"></script>\n```\n\
    \n### 用于格式化文本的元素\n\n#### Strong 标签\n`<strong>`...`</strong>`\n\n`<strong>` 标签用于定义重要的文本。大多数浏览器会将文本**加粗**。\n\
    \n示例：\n\n`The examination will be held on <strong>12 Jan at 2pm</strong>. Late\
    \ will not be allowed into the hall.`\n\n输出：\n考试将于 1 月 12 日下午 2 点举行。迟到者将不允许进入现场。\n\
    \n#### Em 标签\n`<em>`...`</em>`\n\n`<em>` 标签用于定义强调的文本。大多数浏览器将以*斜体*形式显示文本。\n\n示例：\n\
    \n`The examination will be held on 12 Jan at 2pm. Late <em>not</em> be allowed\
    \ into the hall.`\n\n### 用于定义网页部分的元素\n\n`<header>`...`</header>`\n\n`<header>`\
    \ 标签用于定义页面的页眉部分。\n\n`<nav>`...`</nav>`\n\n`<nav>` 标签用于导航。\n\n`<main>`...`</main>`\n\
    \n`<main>` 标签用于页面的主要内容。\n\n`<footer>`...`</footer>`\n\n`<footer>` 标签用于页面的页脚部分。\n\
    \n```html\n<!doctype html>\n<html>\n<head>\n  <title>Example</title>\n</head>\n\
    <body>\n  <header>\n    <!-- Insert Header -->\n  </header>\n  <nav>\n    <!--\
    \ Insert Navigation -->\n  </nav>\n  <main>\n    <!-- Insert Main Content -->\n\
    \  </main>\n  <footer>\n    <!-- Insert Footer -->\n  </footer>\n</body>\n</html>\n\
    ```\n\n### 注释\n\n注意在之前的示例中，我们使用了大量的 `<!--` 和 `-->` 符号？这些被称为注释。通常我们在编程时，需要添加注释以便阅读和理解。注释不会在浏览器中显示，它们仅仅是为了解释我们的代码。\n\
    \n要在 HTML 中添加注释，我们使用 `<!--...-->` 标签。\n\n示例：\n\n```html\n<!--This is a comment.\
    \ It will not be displayed in the browser-->\n```\n\n### 字符实体\n\n某些字符在 HTML 中有预定义定义的特定用途。例如，小于符号\
    \ `<` 用于启动所有标签。如果我们需要在网页上显示文本 5<12 怎么办？\n\n为了实现这一点，我们需要使用字符实体。字符实体始终以与符号 `&` 开始并以分号\
    \ `;` 结束。显示小于符号有两种方法。我们可以写成 `&lt;` 或 `&#60;`。前者被称为实体名称，而后者被称为实体数字。实体名称更容易记忆（`lt`\
    \ 代表 less than），但某些浏览器并不支持所有的实体名称。\n\n常用的字符实体包括：\n\n小于符号 (<):\n`&lt;` 或 `&#60;`\n\
    \n大于符号 (>):\n`&gt;` 或 `&#62;`\n\n安培符号 (&):\n`&amp;` 或 `&#38;`\n\n例如，如果你想在网站上显示\
    \ 5<12，你在 HTML 代码中应将其写为 `5&lt;12`。\n\n"
- fmt: "\nAnother commonly used character entity is non-breaking space (`&nbsp;`).\
    \ A non breaking space entity is used to display consecutive spaces. By default,\
    \ HTML does not recognise consecutive spaces. If you write 5 spaces in your HTML\
    \ code, the browser will remove 4 of them and display only one space. For instance,\
    \ if you write\n\n`“There are 5 spaces      here”`\n\nthe browser will display\
    \ it as\n\n`“There are 5 spaces here”`.\n\nIf you want to display more than one\
    \ space, you need to write\n\n`“There are 5 spaces &nbsp;&nbsp;&nbsp;&nbsp;here”`.\n\
    \n# Chapter 3: Basics of CSS\n\nNow that we’ve covered quite a bit of HTML, let’s\
    \ move on to CSS. CSS stands for Cascading Stylesheet and as the name suggests,\
    \ CSS is all about styling and making your website look gorgeous.\n\nThe latest\
    \ version of CSS is `CSS3`. Unlike previous versions of CSS (namely `CSS1` and\
    \ `CSS2.1`), `CSS3` splits the language into different modules so that each module\
    \ can be developed separately at a different pace. Each module adds new features\
    \ or extends the capabilities of features previously defined in `CSS2.1`. Essentially,\
    \ `CSS3` is simply an extension of `CSS2.1`.\n\nThis book covers the core properties\
    \ of `CSS2.1` as well as a few new properties that are introduced in `CSS3`. Once\
    \ you master the core properties, you will have no problems moving on to more\
    \ advanced properties that are newly added in `CSS3`. These advanced properties\
    \ allow for more fanciful styling of your website, such as adding transitions\
    \ and animations.\n\nIn this chapter, we’ll be covering the basics of CSS, including\
    \ its syntax and order of precedence. However, before going into the syntax of\
    \ CSS, let’s first learn how to add CSS rules to our web site.\n\n## Applying\
    \ CSS Code\n\nThere are three ways to apply CSS code to our site.\n\nThe first\
    \ is by linking to an external file. This is the recommended method. To do linking,\
    \ you need to write your CSS rules in a separate text file and save it with a\
    \ `.css` extension. The syntax for adding the rules to your HTML code is\n\n```\n\
    <link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\">\n```\n\nYou add\
    \ the `<link>` tag to the `head` element, between the `<head>...</head>` tags.\
    \ The first two attributes `rel` and `type` tell the browser that this is a CSS\
    \ stylesheet. You do not need to modify them. The last attribute `href` is where\
    \ you specify the path to the CSS file that you want to link to. A CSS file is\
    \ simply a file that contains CSS rules, without any HTML tags. An example is\
    \ shown below. Don’t worry if the code does not make sense to you, we’ll cover\
    \ them very soon.\n\n```\nbody {\n    margin: 0;\n    background-color: green;\n\
    }\n```\n\nSave this code as “style.css” in the same folder as the `.html` file.\
    \ You can then use the `<link>` tag above to link this CSS file to your HTML file.\n\
    \nThe second method to add CSS rules to our site is to embed the code directly\
    \ into our HTML source code, within the `head` element. This is done with the\
    \ `<style>` tag. An example is shown below. The embedded CSS starts after the\
    \ `<style>` start tag and ends before the `</style>` end tag.\n\n```html\n<head>\n\
    <style>\ndiv {\n    color: blue;\n    width: 100px;\n    height: 200px;\n}\n</style>\n\
    </head>\n```\n\nThe last method is to use inline CSS. Inline CSS is specified\
    \ in the start tag of the element you want to apply it, using the `style` attribute.\
    \ Each rule ends with a semi-colon (`;`). An example is:\n\n```\n<div style=\"\
    text-decoration:underline; color:blue;\">Some text</div>\n```\n\nOf the three\
    \ methods, linking is the preferred method. Linking separates the HTML content\
    \ from the styling rules and makes it easier to maintain. It is also extremely\
    \ useful when we need to apply the same CSS rules to multiple pages. Embedded\
    \ CSS, on the other hand, is commonly used when rules apply to one page. Inline\
    \ CSS is handy when you need to apply a rule to one element, or when you want\
    \ to override other CSS rules that apply the same element. This is because inline\
    \ CSS has a higher precedence than CSS added using the other two methods. We’ll\
    \ discuss order of precedence later. However, inline CSS mixes styling with content\
    \ and should be avoided whenever possible.\n\n## Syntax of a CSS rule\n\nNow that\
    \ we know how to apply CSS rules to our HTML, let’s move on to learn actual CSS\
    \ code. The first thing to learn about CSS is its syntax, which is relatively\
    \ straightforward. The syntax is:\n\n`selector { property : value; property :\
    \ value; }`\n\nFor instance, if you want to style the contents inside a `<div>`\
    \ tag, you write the rule as\n\n```\ndiv {\n    background-color: green;\n   \
    \ font-size: 12px;\n}\n```\n\nThe first word `div` is the selector. It tells the\
    \ browser that the set of rules inside the curly brackets `{ }` applies to all\
    \ elements with the `<div>` tag. Inside the curly brackets, you write all your\
    \ declarations. You start by declaring the property you want to set (`background-color`\
    \ in the first declaration), followed by a colon (`:`). Next, you give the value\
    \ you want (`green` in this case). Finally, you end each declaration with a semi-colon\
    \ (`;`).\n\nIndentation and line breaks do not matter in CSS. You can also write\
    \ your declarations like this:\n\n```\ndiv { background-color: green; font-size:\
    \ 12px; }\n```\n\nPretty straightforward right? Great! Let’s move on...\n\n##\
    \ Selecting an Element\n\nIn the example above, the rules declared in the curly\
    \ brackets will apply to ALL elements with a `<div>` tag. However, most of the\
    \ time we want variation. Suppose you want one `<div>` element to have a font\
    \ size of `12px` and another to have a font size of `14px`. How would you do it?\n\
    \n### Selecting Classes and IDs\n\nThere are basically two ways to do it. The\
    \ first method is to use the `id` attribute. In your HTML document, instead of\
    \ just using the `<div>` tag, you can add an `id` attribute to it. For instance,\
    \ you can write\n\n```html\n<div id=\"para1\">Some text.</div>\n<div id=\"para2\"\
    >More text.</div>\n```\n\nIn our CSS code, we can then select the respective `id`\
    \ by adding a `#` sign in front of the `id` name. An example is shown below:\n\
    \n```css\ndiv {\n    background-color: green;\n}\n#para1 {\n    font-size: 12px;\n\
    }\n#para2 {\n    font-size: 14px;\n}\n```\n\nThe first rule applies to all elements\
    \ with the `<div>` tag. The second rule only applies to the element with `id=\"\
    para1\"`. The third rule only applies to the element with `id=\"para2\"`.\n\n\
    In addition to using the selector `#para1`, you can also be more specific and\
    \ write `div#para1`, with no space before and after the `#` sign. Both methods\
    \ will select the same element, but the second method has a higher precedence\
    \ (more on this later).\n\nNote that an `id` should be unique within a page. Two\
    \ `<div id=\"para1\">` tags is not allowed. One `<div id=\"para1\">` and one `<p\
    \ id=\"para1\">` tag is also not allowed as both have the same `id`. Although\
    \ your HTML and CSS code will work even if you have two elements with the same\
    \ `id`, problems will arise when you start using Javascript or other scripting\
    \ languages on your website.\n\nIf you need to apply the same CSS rules to two\
    \ different elements, you can use a `class`. A `class` is similar to an `id`,\
    \ with the exception that a `class` need not be unique. In addition, an `id` has\
    \ a higher precedence than a `class`.\n\nFor now, let’s consider the following\
    \ code:\n\n```html\n<div class=\"myclass1\">Some text.</div>\n<p class=\"myclass1\"\
    >More text.</p>\n<div>Yet more text.</div>\n```\n\nIf you want to select all `<div>`\
    \ elements (i.e. the first and third element), you write\n\n```css\ndiv { ...\
    \ }\n```\n\nIf you want to select all elements with `class=\"myclass1\"` (i.e.\
    \ the first and second element), you add a dot (`.`) in front of the `class` name,\
    \ like this:\n\n```css\n.myclass1 { ... }\n```\n\nIf you only want to select `<p>`\
    \ tags with `class=\"myclass1\"` (i.e. the second element), you write\n\n```css\n\
    p.myclass1 { ... }\n```\n\nThere should be no space before and after the dot.\n"
