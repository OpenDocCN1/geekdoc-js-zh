    non breaking space entity is used to display consecutive spaces. By default, HTML
    does not recognise consecutive spaces. If you write 5 spaces in your HTML code,
    the browser will remove 4 of them and display only one space. For instance, if
    you write


    `“There are 5 spaces      here”`


    the browser will display it as


    `“There are 5 spaces here”`.


    If you want to display more than one space, you need to write


    `“There are 5 spaces &nbsp;&nbsp;&nbsp;&nbsp;here”`.


    Chapter 3: Basics of CSS


    Now that we’ve covered quite a bit of HTML, let’s move on to CSS. CSS stands for
    Cascading Stylesheet and as the name suggests, CSS is all about styling and making
    your website look gorgeous.


    The latest version of CSS is CSS3\. Unlike previous versions of CSS (namely CSS1
    and CSS2.1), CSS3 splits the language into different modules so that each module
    can be developed separately at a different pace. Each module adds new features
    or extends the capabilities of features previously defined in CSS 2.1\. Essentially,
    CSS3 is simply an extension of CSS2.1.


    This book covers the core properties of CSS2.1 as well as a few new properties
    that are introduced in CSS3\. Once you master the core properties, you will have
    no problems moving on to more advanced properties that are newly added in CSS3\.
    These advanced properties allow for more fanciful styling of your website, such
    as adding transitions and animations.


    In this chapter, we’ll be covering the basics of CSS, including its syntax and
    order of precedence. However, before going into the syntax of CSS, let’s first
    learn how to add CSS rules to our web site.


    Applying CSS Code


    There are three ways to apply CSS code to our site.


    The first is by linking to an external file. This is the recommended method. To
    do linking, you need to write your CSS rules in a separate text file and save
    it with a `.css` extension. The syntax for adding the rules to your HTML code
    is


    `<link rel="stylesheet" type="text/css" href="style.css">`


    You add the `<link>` tag to the `head` element, between the `<head>...</head>`
    tags. The first two attributes `rel` and `type` tell the browser that this is
    a CSS stylesheet. You do not need to modify them. The last attribute `href` is
    where you specify the path to the CSS file that you want to link to. A CSS file
    is simply a file that contains CSS rules, without any HTML tags. An example is
    shown below. Don’t worry if the code does not make sense to you, we’ll cover them
    very soon.


    `body {`


    `       margin: 0;`


    `       background-color: green;`


    `}`


    Save this code as “style.css” in the same folder as the .html file. You can then
    use the `<link>` tag above to link this CSS file to your HTML file.


    The second method to add CSS rules to our site is to embed the code directly into
    our HTML source code, within the `head` element. This is done with the `<style>`
    tag. An example is shown below. The embedded CSS code starts after the `<style>`
    start tag and ends before the `</style>` end tag.


    `<head>`


    `<style>`


    `div {`


    `              color: blue;`


    `              width: 100px;`


    `              height: 200px;`


    `}`


    `</style>`


    `</head>`


    The last method is to use inline CSS. Inline CSS is specified in the start tag
    of the element you want to apply it to, using the `style` attribute. Each rule
    ends with a semi-colon (;). An example is:


    `<div style="text-decoration:underline; color:blue;">Some text</div>`


    Out of the three methods, linking is the preferred method. Linking separates the
    HTML content from the styling rules and makes it easier to maintain our codes.
    It is also extremely useful when we need to apply the same CSS rules to multiple
    web pages.


    Embedded CSS, on the other hand,  is commonly used when the rules only apply to
    one web page.


    Inline CSS is handy when you need to apply a rule to only one element, or when
    you want to override other CSS rules that apply to the same element. This is because
    inline CSS has a higher precedence than CSS code added using the other two methods.
    We’ll discuss order of precedence later in this chapter. However, inline CSS mixes
    styling with content and should be avoided whenever possible.


    Syntax of a CSS rule


    Now that we know how to apply CSS rules to our HTML files, let’s move on to learn
    some actual CSS code. The first thing to learn about CSS is its syntax, which
    is relatively straightforward. The syntax is:


    `selector { property : value; property : value; property : value; }`


    For instance, if you want to style the contents inside a `<div>` tag, you write
    the rule as


    `div {`


    `  background-color: green;`


    `  font-size: 12px;  `


    `}`


    The first word `div` is the selector. It tells the browser that the set of rules
    inside the curly brackets { } applies to all elements with the `<div>` tag.


    Inside the curly brackets, you write all your declarations. You start by declaring
    the property that you want to set (`background-color` in the first declaration),
    followed by a colon (:). Next, you give the value that you want (`green` in this
    case). Finally, you end each declaration with a semi-colon (;).


    Indentation and line breaks do not matter in CSS. You can also write your declarations
    like this:


    `div { background-color: green; font-size: 12px; }`


    Pretty straightforward right? Great! Let’s move on...


    Selecting an Element


    In the example above, the rules declared in the curly brackets will apply to ALL
    elements with a `<div>` tag. However, most of the time, we want greater variation.
    Suppose you want one `<div>` element to have a font size of 12px and another to
    have a font size of 14px. How would you do it?


    Selecting Classes and IDs


    There are basically two ways to do it. The first method is to use the `id` attribute.
    In your HTML document, instead of just using the `<div>` tag, you can add an `id`
    attribute to it. For instance, you can write


    `<div id=”para1”>`


    `Some text.`


    `</div>`


    `<div id=”para2”>`


    `More text.`


    `</div>`


    In our CSS code, we can then select the respective `id` by adding a # sign in
    front of the `id` name. An example is shown below:


    `div {`


    `  background-color: green;`


    `}`


    `#para1`


    `{`


    `  font-size: 12px;`


    `}`


    `#para2`


    `{`


    `  font-size: 14px;`


    `}`


    The first rule applies to all elements with the `<div>` tag. The second rule only
    applies to the element with `id=”para1”`. The third rule only applies to the element
    with `id=”para2”`.


    In addition to using the selector `#para1`, you can also be more specific and
    write `div#para1`, with no space before and after the # sign. Both methods will
    select the same element, but the second method has a higher precedence (more on
    this later).


    Note that an `id` should be unique within a page. Two `<div id=”para1”>` tags
    is not allowed. One `<div id=”para1”>` and one `<p id=”para1”>` tag is also not
    allowed as both have the same `id`. Although your HTML and CSS code will work
    even if you have two elements with the same `id`, problems will arise when you
    start using Javascript or other scripting languages on your website.


    If you need to apply the same CSS rules to two different elements, you can use
    a `class`. A `class` is similar to an `id`, with the exception that a `class`
    need not be unique. In addition, an `id` has a higher precedence than a `class`.


    For now, let’s consider the following code:


    `<div class=”myclass1”>`


    `Some text.`


    `</div>`


    `<p class=”myclass1”>`


    `More text.`


    `</p>`


    `<div>`


    `Yet more text.`


    `</div>`


    If you want to select all `<div>` elements (i.e. the first and third element),
    you write


    `div { … }`


    If you want to select all elements with `class=”myclass1”` (i.e. the first and
    second element), you add a dot (.) in front of the `class` name, like this:


    `.myclass1 { … }`


    If you only want to select `<p>` tags with `class=”myclass1”` (i.e. the second
    element), you write


    `p.myclass { … }`


    There should be no space before and after the dot.'
