    The thick black line is the border. Within the border is the padding and the actual
    content. Outside the border is the margin of the box. The thickness of the padding,
    border and margin can all be modified with CSS. To understand how this box model
    works, let’s analyze the code below. You can download this code at [http://learncodingfast.com/css](http://learncodingfast.com/css).


    `<!doctype html>`


    `<html>`


    `<head><title>Chapter 4 - CSS Box Model</title>`


    `<style type="text/css">`


    `#box1 {`


    `margin: 20px;`


    `padding: 10px;`


    `border: 5px solid black;`


    `width: 100px;`


    `height: 100px;`


    `text-align: justify;`


    `float: left;`


    `}`


    `#box2 {`


    `margin: 20px;`


    `padding: 50px;`


    `border: 5px solid black;`


    `width: 100px;`


    `height: 100px;`


    `text-align: justify;`


    `float: left;`


    `}`


    `</style></head>`


    `<body>`


    `<div id="box1">Learn CSS in One Day and Learn It Well. CSS is easy.</div>`


    `<div id="box2">Learn CSS in One Day and Learn It Well. CSS is easy.</div>`


    `<p>skajd fhadlc vkas j cnl ka jshvn aclaks jdclkasjd ckasj cnkas djvcn ksa mc
    nlkasd jn skajd fhadlc vkas j cnl ka jshvn aclaks jdclkasjd ckasj cnkas djvcn
    ksa mc nlkasd jn skajd fhadlc vkas j cnl ka jshvn aclaks jdclkasjd ckasj cnkas
    djvcn ksa mc nlkasd jn</p>`


    `</body>`


    `</html>`


    If you run this code, you’ll get the boxes below. The gibberish text beside and
    below the boxes is added to show the margin.


    ![](images/00003.jpg)


    This code defines two boxes with width and height of 100 pixels. This width and
    height refers to the dimensions of the content area only.


    The first box (`box1`) has a padding of 10 pixels (px) around the content area.
    Around the padding, it has a solid black border of 5px. The total width of `box1`
    (including its border) is 100 (content area) +10*2 (padding on both sides) +5*2
    (border on both sides) = 130 px. The same applies for the height.


    The second box (`box2`) has a padding of 50px. Despite `box2` being much larger
    than `box1`, notice that the text “Learn CSS in One Day and Learn It Well. CSS
    is easy.” still occupies the same area? This is because the content area is determined
    by the width and height properties, not by the padding. `box2` has a total width
    of 100+50*2+5*2 = 210px. Its height is also 210px.


    Outside the border, we have a margin of 20px for both boxes. Notice there some
    space between the gibberish text and the boxes? That is the margin.


    Try playing around with the code a bit and changing the values of the width, height,
    padding, margin and border properties. Observe what is affected by each change.
    You should notice that width and height affects the content area. Margin affects
    the area outside the border while padding affects the area inside. Border is of
    course the border of the box. We’ll cover each of these properties in detail next.


    Width and Height Properties


    The `width` and `height` properties of a CSS box specify the dimensions of the
    content area (excluding the padding, border and margin). The values are normally
    given in pixels or as a percentage. For instance, the code in our example sets
    the width and height of both `box1` and `box2` to 100px. You can also set the
    width to 80%. The boxes’ content area will then occupy 80% of the width of the
    page. Finally, you can set the height and width to `auto`. In this case, the browser
    will calculate these values automatically, based on the amount of space needed
    to display the content inside the box.


    Overflow Property


    Sometimes, the width and height of the content area may be too small to accommodate
    the contents inside the box. By default the content will flow out of the box and
    overlap other contents. This results in a very badly formatted web page. If you
    do not want this to happen, you can use the `overflow` property. The diagram below
    shows how content is displayed using different values for the `overflow` property
    (`visible`, `hidden`, `scroll` and `auto`).


    ![](images/00001.jpg)


    Padding and Margin Properties


    Paddings and margins are both transparent. Hence we cannot change their color.
    However, we can specify their width. The most commonly used unit for specifying
    width is the pixel. If you want the margin to be 10 pixels, you write `margin:
    10px;`. There should not be any space between 10 and px.


    The examples below show four different syntaxes for specifying margin width. The
    same works for paddings. Just change the property name from `margin` to `padding`.


    Syntax 1


    `margin: 25px;`


    This syntax sets all four margins to 25px.


    Syntax 2


    `margin: 25px 50px;`


    This syntax sets the top and bottom margins to 25px; the left and right margins
    to 50px.


    Syntax 3


    `margin-top: 25px;`


    `margin-right: 50px;`


    `margin-bottom: 60px;`


    `margin-left: 10px;`


    This syntax sets the individual margins separately.


    Syntax 4


    `margin: 25px 50px 60px 10px;`


    This syntax is a shorthand for syntax 3\. The four numbers specify the values
    of the individual margins, starting from the top and continuing in a clockwise
    direction. Hence top margin is 25px; right is 50px, bottom 60px and left 10px.


    In addition to having positive values, margins can have negative values. A negative
    margin will result in overlapping or hidden content. For instance, if we change
    the margin of `box2` from `margin: 20px;` to `margin: 20px 20px 20px -50px;` (i.e.
    `margin-left` is changed to -50px), we’ll get the following:


    ![](images/00010.jpg)


    Note that while margins can have negative values, paddings cannot have negative
    values.


    Margins are also commonly used to align block elements. By default, block elements
    take up the full width available. However, you can change this width using the
    `width` property. For instance, the code below changes the width of an element
    to 80%. You can then center align the element by setting the left and right margins
    to auto.


    `width: 80%;`


    `margin: 0 auto;`


    The `margin` rule above sets the top and bottom margins to 0px (the unit px is
    optional if the value is 0) and the left and right margins to auto. When margins
    are set to auto, the browser will evenly distribute the remaining width to the
    left and right margin, resulting in a center aligned element.


    Border Properties


    CSS `border` properties allow you to set the width, color, style and radius of
    an element''s border.


    border-width


    To set the thickness of the border, you use the `border-width` property. Border
    width is normally set in pixels. Alternatively, you can use one of three predefined
    values: `thin`, `medium` or `thick`. Border properties are set using the same
    syntaxes as margins and paddings.


    Examples:


    `border-width: 25px;`


    will set all borders to 25px.


    `border-width: 25px thin;`


    will set the top and bottom width to 25px and the left and right width to thin.


    `border-top-width: 30px;`


    will set the top border to 30px.


    border-color


    To set border color, you use the property `border-color`. The value of this property
    can be set by specifying a predefined color name, such as `green`, `red` and `yellow`
    etc. A total of 140 such names are defined in CSS. The site [http://www.w3schools.com/cssref/css_colornames.asp](http://www.w3schools.com/cssref/css_colornames.asp)
    gives a complete list of these names. In addition, you can also set the color
    to transparent, by writing `border-color: transparent;`.


    Another method to specify border color is to use the RGB notation (e.g. `rgb(0,255,0)`).
    All web colors are represented by three primary colors: Red, Green and Blue. If
    you write `rgb(0, 255, 0)`, it means you want the second color (i.e. green) to
    have an intensity of 255 (the maximum intensity), and the first and third colors
    (red and blue respectively) to have an intensity of 0 (the least). This will simply
    give you the color green.'
