  # 第 4 章：CSS 盒模型\n\n到目前，我们已经涵盖了 HTML 和 CSS 的基础。在本章中，我们将开始进行实际的 CSS 编码。具体来说，我们将学习\
  \ CSS 盒模型，并研究如何修改 CSS 盒的外观。\n\n## 什么是 CSS 盒模型\n\nCSS 中的所有元素都被视为盒子。CSS 盒子由外边距、边框、内边距和实际内容组成，如下所示。\n\
  \n\n\n\n\n![](img/00011.jpg)\n\n粗黑线是边框（border）。边界内部是内边距（padding）和实际内容。边界外部是框的外边距（margin）。内边距、边框和外边距的厚度都可以\
  \ CSS 修改。为了理解这个盒模型是如何工作的，让我们分析下面的代码。你可以在 [`learncodingfast.com/css`](http://learncodingfast.com/css)\
  \ 下载这段代码。\n\n```html\n<!doctype html>\n<html\n<head><title>Chapter 4 - CSS Box Model</title>\n\
  <style type=\"text/css\">\n#box1 {\n  margin: 20px;\n  padding: 10px;\n  border:\
  \ 5px solid black;\n  width: 100px;\n  height: 100px;\n  text-align: justify;\n\
  \  float: left;\n}\n#box2 {\n  margin: 20px;\n  padding: 50px;\n  border: 5px solid\
  \ black;\n  width: 100px;\n  height: 100px;\n  text-align: justify;\n  float: left;\n\
  }\n</style></head>\n<body>\n<div id=\"box1\">Learn CSS in One Day and Learn It Well.\
  \ CSS is easy.</div>>\n<div id=\"box2\">Learn CSS in One Day and Learn It Well.\
  \ CSS is easy.</div>>\n<p>skajd fhadlc vkas j cnl ka jshvn aclaks jdclkasjd ckasj\
  \ cnkas djvcn ksa mc nlkasd jn skajd fhadlc vkas j cnl ka jshvn aclaks jdclkasjd\
  \ ckasj cnkas djvcn ksa mc nlkasd jn skajd fhadlc vkas j cnl ka jshvn aclaks jdclkasjd\
  \ ckasj cnkas djvcn ksa mc nlkasd jn</p>\n</body>\n</html>\n```\n\n如果你运行这段代码，你将得到下面的框。框旁边和下方的乱码文本是为了显示外边距（margin）。\n\
  \n![](img/00003.jpg)\n\n这段代码定义了两个宽度和高度均为 100 像素的框。这个宽度和高度仅指内容区域的尺寸。\n\n第一个框（`box1`）内容区域周围有\
  \ 10 像素（px）的内边距。在内边距周围，它有一个 5px 的黑色实线边框。`box1` 的总宽度（包括边框）为 100（内容区域）+ 10*2（两侧内边距）+\
  \ 5*2（两侧边框）=130 px。高度也是如此。\n\n第二个框（`box2`）有 50px 的内边距。尽管 `box2` 比 `box1` 大得多，但请注意文字“Learn\
  \ CSS in One Day and Learn It Well. CSS is easy.” 仍然占据相同的区域？这是因为内容区域是由宽度和高度属性决定的，而不是内边距。`box2`\
  \ 的总宽度为 100+50*2+5*2 = 210px。它的高度也是 210px。\n\n在边框外部，两个框都有 20px 的外边距。注意乱码文本和框之间有一些空间吗？那就是外边距。\n\
  \n尝试稍微修改代码，更改宽度、height、padding、margin 和 border 属性的值。观察每项变化影响了哪些部分。你会注意到宽度和高度影响内容区域。外边距影响边框外部的区域，而内边距影响内部的区域。边框理当然是框的边界。我们将在接下来详细介绍这些每一个属性。\n\
  \n## 宽度和高度属性\n\nCSS 框的 `width` 和 `height` 属性指定了内容区域的尺寸（不包括内边距、边框和外边距）。值通常以像素或百分比给出。例如，示例中的代码将\
  \ `box1` 和 `box2` 的宽度和高度都设置为 100px。你也可以将宽度设置为 80%。此时框的内容区域将占据页面宽度的 80%。最后，你可以将高度和宽度设置为\
  \ `auto`。在这种情况下，浏览器将根据显示框内内容所需的空间自动计算这些值。\n\n## Overflow 溢出属性\n\n有时，内容区域的宽度和高度可能太小，无法容纳框内的内容。默认情况下，内容将溢出框外并与其他内容重叠。这将导致网页格式非常糟糕。如果你不希望发生这种情况，可以使用\
  \ `overflow` 属性。下面的图显示了使用 `overflow` 属性的不同值（`visible`、`hidden`、`scroll` 和 `auto`）如何显示内容。\n\
  \n![](img/00001.jpg)\n\n## Padding 和 Margin 属性\n\n内边距和外边距都是透明的。因此，我们无法改变它们的颜色。但我们可以指定它们的宽度。指定宽度最常用的单位是像素。如果你希望外边距为\
  \ 10 像素，可以写 `margin: 10px;`。10 和 px 之间不应有空格。\n\n下面的示例显示了指定外边距宽度的四种不同语法。内边距也一样。只需将属性名从\
  \ `margin` 更改为 `padding`。\n\n语法 1\n```css\nmargin: 25px;\n```\n语法 2\n```css\nmargin:\
  \ 25px 50px;\n```\n语法 3\n```css\nmargin-top: 25px;\n```\n语法 4\n```css\nmargin: 25px\
  \ 50px 60px 10px;\n```\n\n\n\n\n\n除了使用 RGB 表示法外，你也可以使用十六进制表示法，它使用 6 位数字表示颜色。前两个数字代表“红色”强度的十六进制值，接下来的两个代表“绿色”，最后两个代表“蓝色”。通常使用颜色工具来生成这些十六进制值。可以访问\
  \ [`instant-eyedropper.com/`](http://instant-eyedropper.com/) 网站获取其中一个免费工具。\n\n\
  或者，你可以访问 [`html-color-codes.info/`](http://html-color-codes.info/)，那里有一张颜色表供你选择所需的颜色。点击它，就会得到对应的十六进制值。\n\
  \n### 示例\n\n```css\nborder-color: rgb(255, 0, 0);\n```\n将所有边框设置为红色。\n\n```css\n\
  border-color: red green;\n```\n将顶部和底部边框设置为红色，左侧和右侧边框设置为绿色。\n\n```css\nborder-top-color:\
  \ #12005F;\n```\n将顶部边框设置为 #12005F。\n\n### border-style\n\n要设置边框样式，你需要使用属性 `border-style`。接受的值有：`none`、`dotted`、`dashed`、`solid`、`double`、`groove`、`ridge`、`inset`\
  \ 和 `outset`。例如，如果你写\n\n```css\nborder-style: solid dotted;\n```\n顶部和底部边界将为实线，左侧和右侧将为虚线。如果你想单独设置样式，可以写：\n\
  \n```css\nborder-top-style: solid;\n```\n\n```css\nborder-left-style: dotted;\n\
  ```\n\n### border-radius\n\n`border-radius` 属性用于创建圆角边框。值通常以像素或百分比给出。\n\n可以为四个角单独设置圆角半径。四个角分别是\
  \ `top-left`（左上）、`top-right`（右上）、`bottom-right`（右下）和 `bottom-left`（左下）。\n\n### 示例\n\
  \n```css\nborder-radius: 5px;\n```\n将所有角的圆角半径设置为 5px。\n\n```css\nborder-radius:\
  \ 10px 20px;\n```\n将左上和右下（即两个对角的角）的半径设置为 10px，右上和左下的半径设置为 20px。\n\n```css\nborder-radius:\
  \ 25px 5px 0 50px;\n```\n从左上角开始按顺时针方向设置各个角的值。\n\n```css\nborder-top-left-radius:\
  \ 10px;\n```\n将左上角的圆角半径设置为 10px。\n\n如果元素的宽度和高度为 100px，内边距为 20px，边框宽度为 50px（总宽度和总高度\
  \ = 100 + 20*2 + 50*2 = 240px），将圆角半径设置为 120px（240 除以 2）将得到一个圆而不是正方形。\n\n### 边框简写\n\
  \n`border` 属性是单行内指定边框宽度、样式和颜色的简写，而不需要分开进行。只需写：\n\n```css\nborder: 5px solid green;\n\
  ```\n这些值分别为宽度 (5px)、样式 (solid) 和颜色 (green)。此简写中不包含圆角半径。\n\n## 练习 4\n\n从 [`learncodingfast.com/css`](http://learncodingfast.com/css)\
  \ 下载此练习的源代码并解压文件。此练习的源代码可以在第 4 章 - CSS 模型中找到。\n\n### 练习 4.1\n\n1. 在浏览器和文本编辑器中同时打开\
