  > 链接 Links\n> 导航栏 Navigation Bars\n> 练习 9\n## 第十章：表格\n> 边框、内边距和外边距\n\n\n\n\n\n#\
  \ 第 1 章：引言\n\n欢迎来到 CSS 的世界。非常荣幸也感谢你选择这本书。在我们共同开启这段学习之旅之前，让我们先定义什么是 CSS。\n\nCSS 代表级联样式表（Cascading\
  \ Stylesheet），用于网站的样式设置和设计。它是 Web 程序员创建网站时使用的多种语言之一。其他网页语言包括 HTML、Javascript 和 PHP\
  \ 等（仅列举几个）。\n\nHTML 关注网站的内容和结构。由于没有内容的网站存在是毫无意义的，因此对于任何对网页编程感兴趣的人来说，了解 HTML 是至关重要的。本书将首先从介绍\
  \ HTML 开始，涵盖你可能需要了解的一些 HTML 基础知识。虽然这些内容并非无一不包，但它足够你完成大部分必要的 HTML 任务。如果你已经熟悉 HTML，可以随时跳到第\
  \ 3 章。\n\n## 工具\n\n在我们开始编写 HTML 和 CSS 页面之前，让我们先看一些推荐用于网页编程的工具。\n\n在最基础的层，你只需要一个网页浏览器（例如\
  \ Internet Explorer、Chrome、Safari、Firefox）和一个文本编辑器（例如记事本）就可以开始编写网站代码。然而，除非你属于认为真正的程序员不应该使用任何编程辅助工具的流派，否则我强烈建议使用一些在线免费工具来让你的编码生活更轻松。\n\
  \n最推荐的工具之一是提供语法高亮的高级文本编辑器。语法高亮意味着编辑器会根据文本用途用不同的颜色显示文本。例如，编辑器可以使用红色表示关键字，蓝色表示注释，绿色表示变量。这个简单的功能将使你的代码变得更容易阅读和调试。如果你使用的是\
  \ Windows 机器，我建议使用 Notepad++ ([`notepad-plus-plus.org/`](http://notepad-plus-plus.org/))。对于\
  \ Mac，我建议使用 TextWrangler ([`www.barebones.com/products/textwrangler/`](http://www.barebones.com/products/textwrangler/))。两者都是免费的。\n\
  \n### 打开 .HTML 文件\n\n.HTML 文件有两种打开方式。一种方法是通过双击文件在网页浏览器中打开，这用于查看页面。另一种方法是在文本编辑器中打开进行编辑。要这样做，首先启动你的文本编辑器，然后在编辑器内部打开文件。\n\
  \n在处理 HTML 文件时，我建议你同时在浏览器和文本编辑器中打开文件，并将两个窗口并排排列。这样，你就可以在编辑器中编辑代码，保存，然后移动到浏览器，刷新页面并立即检查对代码所做更改的效果。在完成第\
  \ 3 章到第 10 章的练习时，请遵循此步骤。\n\n# 第 2 章：HTML 基础\n\n现在我们已经介绍了网页编程的基础，让我们开始学习一些实际的 HTML\
  \ 代码。在本章中，我们将涵盖 HTML 的核心内容。如果你熟悉 HTML，可以跳过本章直接进入第 3 章。\n\n对于初次接触 HTML 的同学，让我们开始吧。\n\
  \n## 什么是 HTML\n\nHTML 代表超文本标记语言（Hypertext Markup Language），是 Web 程序员用于向网页添加内容的语言。标记语言简单来说是一种用于注释文档的语言，用以解释文本的不同部分是什么以及它们应该如何呈现。例如，我们可以使用\
  \ HTML 来指定内容应该以列表形式还是表格形式呈现。目前的 HTML 版本是 HTML5。\n\nHTML 最棒的一点是网页的源代码对所有人免费开放。这使得我们很容易通过研究其他网页的代码来学习\
  \ HTML。在 Windows 上查看网页源代码，只需在页面任何地方点击右键，并选择“查看源代码”（或其他类似的选项，取决于你使用的浏览器，例如“查看页面源代码”）。如果你使用的是\
  \ Mac，点击菜单栏中的“查看”，选择“开发工具”，然后选择“查看源代码”。\n\n你看到的大部分源代码看起来会非常复杂，特别是如果你没有任何 HTML 基础知识。不用担心。很快，你就能自己写出这些“复杂”的代码了。\n\
  \n为了更好地理解 HTML5 的工作原理，让我们从检查 HTML 文档的基本结构开始。\n\n### HTML 页面的基本结构\n\n下面是一个基础 HTML\
  \ 文档的示例。我在每一行旁边添加了数字。\n\n```\n1 <!doctype html>\n2 <html>\n3 <head>\n4 <title>My\
  \ HTML Page</title>\n5 </head>\n6 <body>\n7 <p>This is just text</p>\n8 <img src=\"\
  image.jpg\" alt=\"some image\">\n9 </body>\n10 </html>\n```\n\n从上面的代码可以看出，HTML 使用了许多标签，例如\
  \ `<head>` 和 `<body>`。\n\n#### Doctype\n\n在第 1 行，`<!doctype html>` 标签告诉浏览器此文档使用的是\
  \ HTML5。如果你检查旧页面的源代码，可能会看到类似 `<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \ \"http://www.w3.org/TR/html4/strict.dtd\">` 的内容。这意味着它们使用的是其他版本，如 HTML4.01。\n\n\
  插入 开始和结束标签\n\n在第 2 行，`<html>` 标签告诉浏览器 HTML 代码从这里开始。HTML 中的大多数标签都有对应的结束标签。`<html>`\
  \ 标签的结束标签位于第 10 行。它在 `html` 单词之前有一个额外的斜杠 (/)。\n\n注意，HTML 中的并非所有标签都有结束标签。例如，用于向网页添加图像的\
  \ `<img>` 标签就没有结束标签。通常，当我们需要告诉浏览器标签的效果应该何时结束时，就需要一个结束标签。例如，如果我们想在 HTML 中将某些文本加粗，我们可以写道：\n\
  \n`This text is <strong>important</strong>, but this text is not.`\n\n我们将得到：This\
  \ text is important, but this text is not.\n\n`<strong>` 标签和 `</<strong>` 标签告诉浏览器加粗效果从何时开始以及何时结束。相比之下，不需要告诉浏览器插入的图像应该何时结束。\n\
  \n#### head 元素\n\n在第 3 行，我们是 `head` 元素的开始。\n\n从广义上说，一个 HTML 文档由两个主要元素组成：`head` 元素和\
  \ `body` 元素。\n\n`head` 元素提供了关于文档的一信息，包括元数据、标题以及附加资源的链接。它从第 3 行的 `<head>` 标签开始，到第\
  \ 5 行的 `</head>` 标签结束。在 `<head>...</head>` 标签之间，我们封装了其他提供文档所有这些后台信息的标签。\n\n在示例中，我们只在\
  \ `head` 元素中包含了关于标题的信息。`<title>` 元素（第 4 行）显示浏览器应该在标题栏或页面标签页上显示的标题。在这种情况下，将显示文本“My\
  \ First HTML Page”。我们将在后的章节中介绍更多在 `head` 元素内部使用的标签。\n\n### body 元素\n\n\n\n\n\n第\
  \ 6 行是 `body` 元素开始的地方。`<body>...</body>` 标签内的内容将显示在网页上。在我们的示例中，文本“This is just text”和图像“someimage.jpg”将被显示。\n\
  \n在 `<body>...</body>` 标签内部，我们还可以使用许多其他标签，例如用于添加图像的 `<img>` 标签、用于显示表格的 `<table>`\
  \ 标签以及用于添加列表的 `<ul>` 标签。我们将在稍后详细介绍这些标签。\n\n为了直观地感受它的工作原理，你可以从配套网站（[`http://learncodingfast.com/css`](http://learncodingfast.com/css)）下载本章节的代码。你可以在\
  \ `Chapter 2 - Basics of HTML` 文件夹中找到源代码。双击 `HTML` 文件即可启动它。\n\n在完成本书附带的额外项目时，你也将被引导去编写一个真实的\
  \ HTML 文档。该项目的源代码可以在 `Bonus Project\\Answers` 文件夹中找到。\n\n## head 元素中的元素\n\n现在我们已经了解了\
  \ HTML 的工作原理，让我们详细查看 `head` 元素。\n\n如上所述，`head` 元素提供了有关文档通用信息，例如元数据、标题以及指向外部资源的链接。让我们来看看\
  \ `head` 元素中的一些标签。\n\n### `<meta>`\n\n`<meta>` 标签包含在 `<head>…</head>` 标签内，用于向浏览器、搜索引擎或其他网络服务提供有关网站的附加信息。这些信息不会显示在页面本身。`<meta>`\
  \ 标签没有结束标签。\n\n`<meta>` 标签的一个常见用途为搜索引擎提供关键词。例如：\n\n```html\n<meta name=\"keywords\"\
  \ content=\"HTML, CSS, Learn in One Day\">\n```\n\n你可能会注意到这个标签比我们之前讨论的标签要长得多。这是因为\
  \ `<meta>` 标签有两个属性：`name` 和 `content`。\n\n`name` 用于指定标签包含的信息的类型（在本例中为关键词），而 `content`\
  \ 用于指定信息的内容。\n\n你还可以使用 `name=description` 属性为你的网站提供描述。例如：\n\n```html\n<meta name=\"\
  description\" content=\"This is my first Website. It teaches you how to use HTML\
  \ and CSS\">\n```\n\n`<meta>` 标签的另一个常见用途是用它来指定浏览器如何控制页面缩放级别和尺寸。这是通过使用 `name=viewport`\
  \ 属性实现的。例如，你可以写：\n\n```html\n<meta name=\"viewport\" content=\"width=300, initial-scale=1\"\
  >\n```\n\n`width=300` 将视口的宽度设置为 300 像素。一个像素（`px`等于计算机屏幕上的一个点。\n\n当你将视口设置为 300px\
  \ 且有一张宽度为例如 500 像素的图像时，你只能看到图像的一部分，因为图像的宽度大于视口的宽度。要查看图像的其余部分，你需要向下滚动页面。相比之下，如果你将视口设置为\
  \ 500px，整个图像将完整显示，无需任何滚动。如果你将视口设置为 1000px，整个图像也会显示，但它会更小，并且只占屏幕宽度的一半。\n\n`initial-scale=1`\
  \ 设置页面在被浏览器首次加载时的初始缩放级别（在本例中为 1x）。\n\n如果你感兴趣了解更多关于视口的工作原理，可以查看 [`https://developer.apple.com/library/ios/documentation/AppleApplications/Reference/SafariWebContent/UsingtheViewport/UsingtheViewport.html`](https://developer.apple.com/library/ios/documentation/AppleApplications/Reference/SafariWebContent/UsingtheViewport/UsingtheViewport.html)\n\
  \n### `<title>...</title>`\n\n`<title>` 标签用于定义浏览器应该在其标题栏或页面标签页上显示的标题。\n\n### `<style>...</style>`\n\
  \n`<style>` 标签用于向我们的 HTML 文档添加内部 CSS 代码。我们将在第 3 章学习如何操作。\n\n示例：\n\n```html\n<style\
  \ type=\"text/css\">\nbody {\n  …\n}\n</style>\n```\n\n### `<link>`\n\n`<link>`\
  \ 标签用于链接到外部资源，最常用于链接到外部 CSS 样式表。它不需要结束标签。\n\n示例：\n\n```html\n<link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"mystyle.css\">\n```\n\n`rel` 和 `type` 属性只是告诉浏览器你正在链接到一个\
  \ CSS 样式表。你不需要修改它们。唯一你需要修改的属性是 `href` 属性。该属性用于指定 CSS 文件的路径。\n\n## 如何编写外部文件的路径\n\n\
  任何外部文件的路径始终从 HTML 文档的当前文件夹开始。假设有五个文件夹：`User`、`Documents`、`MyWebsite`、`MyCSS` 和 `MoreCSS`，结构如下：\n\
  \n`User > Documents > MyWebsite > MyCSS > MoreCSS`\n\n这意味着 `User` 文件夹包含 `Documents`\
  \ 文件夹，该文件夹又包含 `MyWebsite` 文件夹。在 `MyWebsite` 文件夹中，我们有 `MyCSS` 文件夹，它包含 `MoreCSS` 文件夹。\n\
  \n如果你正在 `MyWebsite` 中处理一个 HTML 文件，并想访问 `MoreCSS` 中的文件，你将使用路径 `MyCSS/MoreCSS/filename.ext`。\n\
  \n\n\n\n\n`<ol>` 标签代表有序列表，用于创建一个以数字或字母作为列表标记的列表。\n\n### 有序列表\n\n示例：\n\n```html\n\
  <ol>\n  <li>Chocolate</li>\n  <li>Strawberry</li>\n  <li>Vanilla</li>\n</ol>\n```\n\
  \n输出：\n> 1. Chocolate（巧克力）\n> 2. Strawberry（草莓）\n> 3. Vanilla（香草味）\n\n### 无序列表\n\
  `<ul>`...`</ul>` 和 `<li>`...`</li>`\n\n`<ul>` 标签代表无序列表，与 `<ol>`</ol>` 标签类似。但是，它不使用数字或字母作为列表标记，而是使用形状（如圆点或空心圆）。\n\
  \n### 表格\n`<table>`...`</table>`, `<tr>`...`</tr>`, `<th>`...`</th>`, `<td>`...`</td>`\n\
  \n`<table>` 标签用于创建表格。`<tr>` 代表“表格行（Table Row）”，`<th>` 代表“表头（Table Header）”，而 `<td>`\
  \ 代表“表格数据（Table Data）”。在 HTML 中，表格是逐行创建的。\n\n示例（数字不属于代码内容）：\n\n```html\n<table>\n\
  \  <tr>\n    <th>Name</th>\n    <th>Gender</th>\n  </tr>\n  <tr>\n    <td>Abigail</td>\n\
  \    <td>F</td>\n  </tr>\n  <tr>\n    <td>Benny</td>\n    <td>M</td>\n  </tr>\n\
  </table>\n```\n\n这段代码将为你生成一个有 3 行 2 列的表格。第 2 到 5 行定义了表格的第一行，由于使用了 `<th>` 标签，它是表头行。第\
  \ 6 到 9 行定义了第二行，10 到 13 行定义了第三行。取决于你在 CSS 中如何样式化表格，你将得到一个类似于下面的表格：\n\n![](img/00005.jpg)\n\
  \n### 与 CSS 结合使用的元素\n\n有两个特殊的 HTML 元素在 HTML 中没有任何固有含义。它们主要与 CSS 结合使用，为网页的特定部分设置样式。这两个元素是\
  \ `div` 和 `span`。\n\n#### Div 标签\n`<div>`...`</div>`\n\n`<div>` 代表“划分（division）”，用于定义\
  \ HTML 文档中的一个划分或区域。`<div>` 标签通常与 CSS 结合使用，以格式化 `<div>`...`</div>` 标签内的内容。\n\n例如，如果我们写：\n\
  \n```html\n<div>\n  This is some division in the HTML document.\n  <ol>\n    <li>Chocolate</li>\n\
  \    <li>Strawberry</li>\n    <li>Vanilla</li>\n  </ol>\n</div>\n```\n\n我们可以使用 CSS\
  \ 来格式化 `div` 标签内的所有内容（即：文本和有序列表）。我们将在下一章学习如何操作。\n\n#### Span 标签\n`<span>`...`</span>`\n\
  \n`<span>` 标签与 `<div>` 标签类似。主要区别在于 `<div>` 是**块级元素 (block element)**，而 `<span>`\
  \ 是**行内元素 (inline element)**。\n\n块级元素是以新换行开始并结束的元素。相比之下，行内元素不会以换行开始或结束。例如，如果我们写：\n\
  \n`This is a <div>block element</div>, while this is an <span>inline</span> element.`\n\
  \n我们将得到：\n\nThis is a\nblock element\nwhile this is an inline element.\n\n由于短语“block\
  \ element”被标记为 `<div>`标签，它会在新行开始并结束。另一方面，“inline”一词是一个行内元素，不会在新行开始或结束。通常，我们倾向于使用\
  \ `<div>` 来封装文档的章节，而 `<span>` 用于封装一小部分文本、图像等。\n\n### 用于向网站添加 JavaScript 代码的元素\n\n\
  `<script>`...`</script>`\n\n`<script>` 标签用于向我们的 HTML 文档添加内部 JavaScript 代码，或链接到外部脚本。JavaScript\
  \ 是一种脚本语言，为我们的网站添加交互性。\n\n示例（添加内部 JS 代码）：\n\n```html\n<script>\n  document.getElementById(\"\
  para1\").innerHTML = \"Hello JavaScript!\";\n</script>\n```\n\n示例（链接到外部 JS 脚本）：\n\
  \n```html\n<script type=\"text/javascript\" src=\"myscripts.js\"></script>\n```\n\
  \n### 用于格式化文本的元素\n\n#### Strong 标签\n`<strong>`...`</strong>`\n\n`<strong>` 标签用于定义重要的文本。大多数浏览器会将文本**加粗**。\n\
  \n示例：\n\n`The examination will be held on <strong>12 Jan at 2pm</strong>. Late will\
  \ not be allowed into the hall.`\n\n输出：\n考试将于 1 月 12 日下午 2 点举行。迟到者将不允许进入现场。\n\n\
  #### Em 标签\n`<em>`...`</em>`\n\n`<em>` 标签用于定义强调的文本。大多数浏览器将以*斜体*形式显示文本。\n\n示例：\n\n\
  `The examination will be held on 12 Jan at 2pm. Late <em>not</em> be allowed into\
  \ the hall.`\n\n### 用于定义网页部分的元素\n\n`<header>`...`</header>`\n\n`<header>` 标签用于定义页面的页眉部分。\n\
  \n`<nav>`...`</nav>`\n\n`<nav>` 标签用于导航。\n\n`<main>`...`</main>`\n\n`<main>` 标签用于页面的主要内容。\n\
  \n`<footer>`...`</footer>`\n\n`<footer>` 标签用于页面的页脚部分。\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n  <title>Example</title>\n</head>\n<body>\n  <header>\n    <!--\
  \ Insert Header -->\n  </header>\n  <nav>\n    <!-- Insert Navigation -->\n  </nav>\n\
  \  <main>\n    <!-- Insert Main Content -->\n  </main>\n  <footer>\n    <!-- Insert\
  \ Footer -->\n  </footer>\n</body>\n</html>\n```\n\n## 注释\n\n注意在之前的示例中，我们使用了大量的\
  \ `<!--` 和 `-->` 符号？这些被称为注释。通常我们在编程时，需要添加注释以便阅读和理解。注释不会在浏览器中显示，它们仅仅是为了解释我们的代码。\n\
  \n要在 HTML 中添加注释，我们使用 `<!--...-->` 标签。\n\n示例：\n\n```html\n<!--This is a comment.\
  \ It will not be displayed in the browser-->\n```\n\n### 字符实体\n\n某些字符在 HTML 中有预定义定义的特定用途。例如，小于符号\
  \ `<` 用于启动所有标签。如果我们需要在网页上显示文本 5<12 怎么办？\n\n为了实现这一点，我们需要使用字符实体。字符实体始终以与符号 `&` 开始并以分号\
  \ `;` 结束。显示小于符号有两种方法。我们可以写成 `&lt;` 或 `&#60;`。前者被称为实体名称，而后者被称为实体数字。实体名称更容易记忆（`lt`\
  \ 代表 less than），但某些浏览器并不支持所有的实体名称。\n\n常用的字符实体包括：\n\n小于符号 (<):\n`&lt;` 或 `&#60;`\n\
  \n大于符号 (>):\n`&gt;` 或 `&#62;`\n\n安培符号 (&):\n`&amp;` 或 `&#38;`\n\n例如，如果你想在网站上显示 5<12，你在\
  \ HTML 代码中应将其写为 `5&lt;12`。\n\n\n\n\n\n另一个常用的字符实体是不换行空格（`&nbsp;`）。不换行空格实体用于显示连续的空格。在默认情况下，HTML\
  \ 不识别连续的空格。如果你在 HTML 代码中写 5 个空格，浏览器会移除其中的 4 个并只显示一个空格。例如，如果你写\n\n`“There are 5 spaces\
  \      here”`\n\n浏览器将将其显示为\n\n`“There are 5 spaces here”。\n\n如果你想显示多个空格，你需要写\n\n\
  `“There are 5 spaces &nbsp;&nbsp;&nbsp;&nbsp;here”`。\n\n# 第 3 章：CSS 基础\n\n现在我们已经涵盖了大量的\
  \ HTML，让我们转向 CSS。CSS 代表级联样式表（Cascading Stylesheet），正如其名所示，CSS 的核心在于样式设计以及让你的网站看起来非常精美。\n\
  \nCSS 的最新版本是 `CSS3`。与之前的 CSS 版本（即 `CSS1` 和 `CSS2.1`）不同，`CSS3` 将语言分成了不同的模块，以便每个模块可以以不同的速度独立开发。每个模块都添加了新功能，或者扩展了之前在\
  \ `CSS2.1` 中定义的功能能力。本质上，`CSS3` 只是 `CSS2.1` 的扩展。\n\n本书涵盖了 `CSS2.1` 的核心属性，以及 `CSS3`\
  \ 中引入的几个新属性。一旦你掌握了核心属性，你就可以毫无问题地转向 `CSS3` 中新添加的高级属性。这些高级属性允许对你的网站进行更奇幻的样式设计，例如添加过渡和动画。\n\
  \n在本章中，我们将介绍 CSS 的基础，包括它的语法和优先级。然而，在进入 CSS 语法之前，让我们先学习如何向我们的网站添加 CSS 规则。\n\n## 应用\
  \ CSS 代码\n\n有三种方法可以将 CSS 代码应用到我们的网站中。\n\n第一种是链接到外部文件。这是推荐的方法。要进行链接，你需要将 CSS 规则写在一个单独的文本文件中并将其保存为\
  \ `.css` 扩展名。在 HTML 代码中添加规则的语法为\n\n```\n<link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"style.css\">\n```\n\n你将将 `<link>` 标签添加到 `head` 元素中，位于 `<head>...</head>`\
  \ 标签之间。前两个属性 `rel` 和 `type  告诉这是一个 CSS 样式表。你不需要修改它们。最后一个属性 `href` 是你指定要链接的 CSS 文件路径的地方。CSS\
  \ 文件仅仅是一个包含 CSS 规则的文件，不包含任何 HTML 标签。下例所示。如果代码对你来说意义不大不要担心，我们很快就会讲解。\n\n```\nbody\
  \ {\n    margin: 0;\n    background-color: green;\n}\n```\n\n将此代码保存为“style.css”，并与\
  \ `.html` 文件放在同一个文件夹中。然后你可以使用上面的 `<link>` 标签将此 CSS 文件链接到你的 HTML 文件。\n\n第二种向我们的网站添加\
  \ CSS 规则的方法是将代码直接嵌入到 HTML 源代码中，位于 `head` 元素内。这是通过 `<style>` 标签实现的。下例所示。\n\n```html\n\
  <head>\n<style>\ndiv {\n    color: blue;\n    width: 100px;\n    height: 200px;\n\
  }\n</style>\n</head>\n```\n\n最后一种方法是使用内联 CSS。内联 CSS 是在你想要应用它的元素的起始标签中，使用 `style`\
  \ 属性指定的。每个规则以分号（`;`）结束。示例如下：\n\n```\n<div style=\"text-decoration:underline; color:blue;\"\
  >Some text</div>\n```\n\n在这三种方法中，链接是首选方法。链接将 HTML 内容与样式规则分离，使其更易维护。当我们需要对多个页面应用相同的\
  \ CSS 规则时，它也非常有用。相反，嵌入式 CSS 通常用于适用于页面的规则。当你需要将一个规则应用于一个元素，或者当你想覆盖应用于同一元素的其他 CSS\
  \ 规则时，内联 CSS 非常方便。这是因为内联 CSS 的优先级高于使用其他两种方法添加的 CSS。我们稍后会讨论优先级。然而，内联 CSS 将样式与内容混合在一起，应该尽可能避免。\n\
  \n## CSS 规则的语法\n\n现在我们已经知道如何将 CSS 规则应用到 HTML 中，让我们学习实际的 CSS 代码。学习 CSS 的第一件事是它的语法，它相对非常直观。语法是：\n\
  \n`selector { property : value; property : value; }`\n\n例如，如果你想为 `<div>` 标签内部的内容设置样式，你可以这样写规则：\n\
  \n```\ndiv {\n    background-color: green;\n    font-size: 12px;\n}\n```\n\n第一个单词\
  \ `div` 是选择器。它告诉浏览器大括号 `{ }` 内部的规则适用于所有带有 `<div>` 标签的元素。在大括号内部，你写所有的声明。你首先声明你想要设置的属性（在第一个声明中是\
  \ `background-color`），紧接着是一个冒号（`:`）。然后，你给出你想要的值（在这种情况下是 `green`）。最后，你用分号（`;`）结束每个声明。\n\
  \n在 CSS 中，缩进和换行并不重要。你也可以这样写你的声明：\n\n```\ndiv { background-color: green; font-size:\
  \ 12px; }\n```\n\n非常直观，对吧？太棒了！让我们继续...\n\n## 选择元素\n\n在上面的示例中，大括号中声明的规则将适用于所有带有 `<div>`\
  \ 标签的元素。然而，在大多数情况下，我们希望有所变化。假设你想让一个 `<div>` 元素具有 `12px` 的字体大小，而另一个具有 `14px` 的字体大小。你会如何做呢？\n\
  \n### 选择类和 ID\n\n基本上有两种方法。第一种是使用 `id` 属性。在你的 HTML 文档中，不再仅仅使用 `<div>` 标签，你可以给它添加一个\
  \ `id` 属性。例如，你可以写：\n\n```html\n<div id=\"para1\">Some text.</div\n<div id=\"para2\"\
  >More text.</div>\n```\n\n在我们的 CSS 代码中，我们可以通过在 `id` 名称前添加 `#` 号来选择相应的 `id`。示例所示：\n\
  \n```css\ndiv {\n    background-color: green;\n}\n#para1 {\n    font-size: 12px;\n\
  }\n#para2 {\n    font-size: 14px;\n}\n```\n\n第一条规则适用于所有带有 `<div>` 标签的元素。第二条规则仅适用于\
  \ `id=\"para1\"` 的元素。第三条规则仅适用于 `id=\"para2\"` 的元素。\n\n除了选择器 `#para1` 之外，你也可以写得更具体，比如\
  \ `div#para1`，在 `#` 号前后都不留空格。这两种方法将选择同一个元素，但第二种方法具有更高的优先级（稍后详细介绍）。\n\n注意，`id` 在页面内应该是唯一的。不允许有两个\
  \ `<div id=\"para1\">` 标签。一个 `<div id=\"para1\">` 和一个 `<p id=\"para1\">` 标签也是不允许的，因为它们具有相同的\
  \ `id`。即使你有两个具有相同 `id` 的元素，你的 HTML 和 CSS 代码也可以工作，但当你开始在网站上使用 JavaScript 或其他脚本语言时就会出现问题。如果你需要对两个不同的元素应用相同的\
  \ CSS 规则，可以使用 `class`。`class` 类似于 `id`，区别在于 `class` 不需要是唯一的。此外，`id` 的优先级高于 `class`。\n\
  \n现在，让我们考虑以下代码：\n\n```html\n<div class=\"myclass1\">Some text.</div\n<p class=\"\
  myclass1\">More text.</p>\n<div>Yet more text.</div>\n```\n\n如果你想选择所有的 `<div>` 元素（即第一个和第三个元素），你写：\n\
  \n```css\ndiv { ... }\n```\n\n如果你想选择所有 `class=\"myclass1\"` 的元素（即第一个和第二个元素），你在 `class`\
  \ 名称前添加一个点（`.`），如下：\n\n```css\n.myclass1 { ... }\n```\n\n如果你只想选择 `class=\"myclass1\"\
  ` 的 `<p>` 标签（即第二个元素），你写：\n\n```css\np.myclass1 { ... }\n```\n\n点的前后不应该留空格。\n\n\n\
  \n\n一个元素可以有多个类。在 HTML 属性中，多个类之间用空格分隔。例如，下面的 `div` 元素有两个类：`myclass1` 和 `myclass2`。\n\
  \n```html\n<div class=\"myclass1 myclass2\">\n…\n</div>\n```\n\n如果我们有以下 CSS 代码：\n\
  \n```css\n.myclass1 { … }\n.myclass2 { … }\n```\n\n那么 `myclass1` 和 `myclass2` 的规则都适用于上述\
  \ `<div>` 元素。\n\n## 更多选择器\n\n除了通过 `id` 和 `class` 选择元素外，CSS 还提供了许多方法来指定我们想要选择的元素。\n\
  \n### 选择多个元素\n\n例如，我们可以一次选择多个元素。如果我们想选择 `<div>`、`<p>` 和 `<ul>` 元素，我们可以写：\n\n```css\n\
  div, p, ul { … }\n```\n\n### 选择子元素\n\n如果我们想选择 `<div>` 元素内部所有的 `<p>` 元素，我们可以写：\n\n\
  ```css\ndiv p { … }\n```\n\n注意 `div` 和 `p` 之间没有逗号。在这种情况下，CSS 规则将仅适用于 `<div>` 内部的\
  \ `<p>` 元素。例如，如果我们有下所示 HTML 结构，规则将适用于“I am a paragraph inside div”，而不会适用于“I am a\
  \ stand-alone paragraph”。\n\n```html\n<div>\n    <p>I am a paragraph inside div</p>\n\
  </div>\n<p>I am a stand-alone paragraph</p>\n```\n\n第一个段落“I am a paragraph inside\
  \ div”被称为 `<div>` 标签的子元素，因为它的起始和结束标签（`<p>` 和 `</p>`）完全位于 `<div>...</div>` 标签之内。\n\
  \n### 按属性选择\n\n你也可以根据元素的属性来选择元素。如果你想选择所有指向 `http://www.learncodingfast.com/` 的超链接，你可以写：\n\
  \n```css\na[href=\"http://www.learncodingfast.com\"] { … }\n```\n\n方括号前不应该有空格。如果你有以下\
  \ HTML 代码，只有第一个链接会被选中。\n\n```html\n<a href=\"http://www.learncodingfast.com/\">Learn\
  \ Coding Fast</a>\n<a href=\"http://www.google.com/\">Google</a>\n```\n\n### 选择伪类\n\
  \n另一个常用的选择器是伪类选择器。伪类指的是元素的一种特殊状态。最常见的伪类是针对 `<a>...</a>` 元素的伪类。超链接可以处于四种状态之一：\n\n\
  - `link`（未访问过的链接）\n- `visited`（已过的链接）\n- `hover`（当用户鼠标悬停在其上方时），或\n- `active`（当链接被点击时）。\n\
  \n我们可以根据链接所处的状态来选择它。例如，要选择悬停状态，我们写：\n\n```css\na:hover { … }\n```\n\n关键字 `hover`\
  \ 通过冒号（`:`）添加到 `a` 选择器的后面，冒号前后均不留空格。我们将在第 9 章中回到选择和样式化链接不同状态的概念。\n\n除了选择链接的不同状态外，我们还可以使用伪类来选择子元素。假设我们有一个带有三个\
  \ `<p>` 子元素的 `<div>` 元素：\n\n```html\n<div>\n    <p>I am the first child</p>\n  \
  \  <p>I am the second child</p>\n    <p>I am the third child</p>\n</div>\n```\n\n\
  我们可以使用 `first-child` 伪类来选择第一个 `<p>` 元素。我们也可以使用 `last-child` 选择器选择最后一个子元素，或者使用 `nth-child(n)`\
  \ 选择器来选择第 n 个子元素。例如，如果我们写：\n\n```css\np:nth-child(2) { … }\n```\n\n由于括号 `()` 中的数字‘2’，我们将选择段落“I\
  \ am the second child”。\n\n### 选择伪元素\n\n除了伪类，CSS 还有伪元素的概念。伪元素指的是元素的指定部分，例如元素的第一个字母或第一行。\n\
  \n例如，如果我们有下所示的 `<p>` 元素：\n\n```html\n<p>This is some text.</p>\n```\n\n我们可以通过书写以下代码来选择第一个字母\
  \ (T)：\n\n```css\np::first-letter { … }\n```\n\n注意，在这种情况下使用了双冒号。另一个伪元素是 `first-line`\
  \ 元素。它将选择文本的第一行。\n\n最后，我们可以使用 `before` 和 `after` 伪元素在元素的内容之前或之后插入内容。例如，如果我们想在所有的\
  \ `<h1>` 元素之后添加一个感叹号，我们可以写：\n\n```css\nh1::after {\n    content: \"!\";\n}\n```\n\
  \n这将在会在所有的 `<h1>` 元素之后添加一个感叹号。如果我们有以下 HTML 代码：\n\n```html\n<h1>This is a heading</h1>\n\
  ```\n\n## 大小不敏感\n\n在大多数情况下，选择器是不区分大小写的的。然而，唯一的例外是某些语境下的 `id` 和 `class` 名称（等等，根据提供的文本：“在大多数情况下，选择器是不区分大小写的的”）。实际上，提供的文本有些碎片化，但我将保留核心信息。\n\
  \n## 优先级\n\n现在我们已经学会了如何选择，让我们进入一个非常重要的概念：优先级。三个原则控制着哪条规则生效。\n\n### 原则 1：选择器越具体，优先级越高\n\
  \n我们不会详细介绍如何计算选择性。要记住的点是 `id` 比 `class` 更具体，而 `class` 比元素更具体。考虑以下代码：\n\n```css\n\
  div { font-size: 10px; }\n#myId { font-size: 12px; }\n.myClass { font-size: 14px;\
  \ }\n```\n```html\n<div id=\"myId\" class=\"myClass\">Some text</div>\n```\n\n由于\
  \ `<div>` 元素拥有 `class=\"myClass\"` 和 `id=\"myId\"`，三条规则 `div`、`#myId` 和 `.myClass`\
  \ 都生效。然而，由于 `id` 优先级最高，“Some text”将以 12px 显示。\n\n此外，关于特性的另一点是，选择器越详细，优先级越高。例如，`div#myId`\
  \ 的优先级高于 `#myId`。这是因为 `div#myId` 更详细，因为它告诉我们 `myId` 是 `div` 元素的 `id`。在示例代码中，将应用黄色。\n\
  \n```css\ndiv { color: red; }\ndiv#myId { color: yellow; }\n#myId { color: blue;\
  \ }\n.myClass { color: green; }\n```\n\n### 原则 2：如果没有指定样式，元素将从父容器继承样式\n\n子元素是完全位于另一个元素的起始和结束标签之内的元素。例如，在下代码中，`<p>`\
  \ 是 `<body>` 元素的子元素。由于没有定义 `<p>` 的字体大小，它将从定义了该属性的 `<body>` 元素继承该属性。\n\n```css\n\
  body {\n    font-size: 1.5em;\n}\n```\n```html\n<body>\n    <p>Some text</p>\n</body>\n\
  ```\n\n如果 `<body>` 元素也没有定义 `font-size` 属性，将使用浏览器的字体字体。\n\n### 原则 3：在其他相等的情况下，最后声明的规则胜出\n\
  \n假设你在 HTML `<head>` 元素中有以下 CSS 声明。\n\n```html\n<head>\n<style>\n    p { font-size:\
  \ 20px; }\n</style>\n</head>\n```\n\n\n\n\n在 HTML 文档的后续，你有以下 HTML 代码，其中包含一条内联 CSS\
  \ 规则：\n\n```html\n<p style=”font-size: 30px;>Some text</p>\n```\n\n你认为哪种规则将应用于“Some\
  \ text”这些单词上？\n\n正确答案是内联规则。这是因为在其他相等的情况下，最后声明的规则优先级最高。由于内联 CSS 是在 HTML 代码内部声明的，它的声明顺序晚于在\
  \ `head` 部分中声明的嵌入式 CSS。因此，将应用 30px 的字体大小。\n\n## 显示不一致\n\n在处理 CSS 时需要解决的另一个问题是跨浏览器的显示不一致问题。你可能会发现你的网站在不同的浏览器中看起来略有（或极度）不同。大多数显示问题倾向于旧版本的\
  \ Internet Explorer，尽管问题也可能发生在其他浏览器中（尤其是移动浏览器）。\n\n显示不一致的发生的原因是不同的浏览器使用不同的布局引擎来解释网站的\
  \ CSS 代码。例如，`Safari` 和 `Chrome` 使用 `WebKit` 引擎，而 `Firefox` 使用 `Gecko` 引擎。一个引擎计算和显示页面的方式可能与另一个引擎不同。例如，`Internet\
  \ Explorer` 使用的引擎 `Trident` 会为某些页面设计自动加宽页面像素宽度。这可能导致侧边栏因宽度不足而被推到底部。\n\n另一个导致显示不一致的问题是对某些\
  \ CSS 属性缺乏通用支持。某些属性并不是所有浏览器都支持。你可以访问 [`www.caniuse.com`](http://www.caniuse.com/)\
  \ 网站来检查你正在开发的浏览器是否支持特定的 CSS 属性。\n\n有时，只有当我们为 CSS 规则添加前缀时，特定的浏览器才支持某个 CSS 属性。这对于\
  \ CSS3 中的新属性尤其如此。一个例子是 CSS 中的 `column-count` 属性。该属性将元素分成多个列。例如，我们可以通过编写 `column-count:\
  \ 3` 将一个 `div` 元素分为三列。\n\n旧版本的 `Firefox`、`Chrome`、`Safari` 和 `Opera` 不支持此属性。为了让该属性在这些浏览器上生效，你必须将其三个三个声明：\n\
  \n```css\n-webkit-column-count: 3;\n-moz-column-count: 3;\ncolumn-count: 3;\n```\n\
  \n而不是简单的\n\n```css\ncolumn-count: 3;\n```\n\n`-webkit-` 前缀增加了对旧版本 `Chrome`、`Safari`\
  \ 和 `Opera` 的支持，而 `-moz-` 前缀增加了对 `Firefox` 的支持。此外，我们还有 `-ms-` 前缀增加了对 `Internet Explorer`\
  \ 的支持。\n\n在创建网站时，在各种浏览器上进行测试是有用的，以确保没有内容损坏。修复“损坏”显示的方法取决于导致问题的原因。如果你真的卡住了，我建议在 [`stackoverflow.com`](http://stackoverflow.com/)\
  \ 上搜索或发布问题，这是一个非常有用的程序员在线社区。\n\n## 注释\n\n本章最后介绍的是注释。在 CSS 中，我们使用 `/*...*/` 符号向代码中添加注释。例如所示：\n\
  \n```css\n/*\n下面的规则是注释。\np {\n    background-color: black;\n    font-size: 20px;\n\
  \    color: white;\n}\n*/\n```\n\n`/*` 和 `*/` 符号之间的所有内容会被浏览器忽略。\n\n## 练习 3\n\n从\
