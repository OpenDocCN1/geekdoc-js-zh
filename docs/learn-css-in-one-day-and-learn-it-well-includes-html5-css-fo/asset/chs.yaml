  \n# 第 7 章：背景\n\n在本章中，我们将学习如何更改元素的背景属性。这些属性包括更改其背景颜色和背景图像。\n\n首先，让我们先看看如何更改背景颜色。\n\
  \n## 背景颜色\n\n要声明元素的背景颜色，我们使用 `background-color` 属性。类似于指定 CSS 框的边框颜色，我们可以使用三种表示法之一声明元素的背景颜色：颜色名称、rgb\
  \ 表示法或十六进制表示法。\n\n示例：\n\n```\nbackground-color: green;\nbackground-color: rgb(0,\
  \ 255, 0);\nbackground-color: #00FF00;\n```\n\n## 背景图像\n\n如果你觉得仅使用颜色作为元素的背景太单调，你可以选择使用图像。CSS\
  \ 允许我们在图像显示上具有极大的灵活性。\n\n### background-image\n\n要使用图像作为背景，我们使用 `background-image`\
  \ 属性指定图片的 URL。\n\n示例：\n\n```\nbackground-image: url(“image1.jpg”);\n```\n\n### background-repeat\n\
  \n默认情况下，背景图像位于元素的左上角，并在水平和垂直方向上重复。如果你不希望背景图像重复，可以使用 `background-repeat` 属性进行更改。以下列表显示了\
  \ `background-repeat` 属性的一些常用值：\n\n- `repeat`: 默认值。图像将在水平和垂直方向上重复。\n- `repeat-x`:\
  \ 图像仅在水平方向重复。\n- `repeat-y`: 图像仅在垂直方向重复。\n- `no-repeat`: 图像不重复。\n\n示例：\n\n```\n\
  background-repeat: repeat-x;\n```\n\n### background-attachment\n\n`background-attachment`\
  \ 属性指定背景图像应该是固定还是随页面滚动。两个常用的值是 `fixed` 和 `scroll`。默认值是 `scroll`。尝试本章末尾的练习来看看它是如何工作的。\n\
  \n示例：\n\n```\nbackground-attachment: scroll;\n```\n\n### background-position\n\n\
  如果你想指定显示背景图像的哪个区域，`background-position` 属性非常有用。\n\n假设你有一个宽度和高度均为 100px 的元素。如果你使用的背景图像宽度为\
  \ 200px，高度为 300px，那么由于图像大于元素的大小，只有背景图像的一部分会被显示。\n\n![](img/00009.jpg)\n\n例如，如果你使用上面的图像（200px\
  \ x 300px）作为 100px x 100px 元素的背景图像，默认只会显示区域 A（左上角）。如果你想显示区域 F 呢？要实现，你需要更改 `background-position`\
  \ 属性的值。\n\n指定 `background-position` 值的最常用方法是使用像素。语法为：\n\n```\nbackground-position:\
  \ xpos ypos;\n```\n\n为了理解这种语法如何工作，让我们想象一块中间有一个 100px x 100px 孔洞的纸板。纸板上的这个孔代表 HTML\
  \ 元素。现在想象你的背景图像在纸板下方。默认情况下，图像将对齐，使得区域 A 通过纸板上的孔显示。如果你想显示区域 F，你必须将图像（而不是纸板）向左移动 100px\
  \ 并向上移动 200px。用 CSS 实现这一点，你需要写：\n\n```\nbackground-position: -100px -200px;\n```\n\
  \n第一个数字（`-100px`）水平移动图像。如果这个数字是正数，图像向右移动。如果是负数，则向左移动。\n\n第二个数字（`-200px`）垂直移动图像。如果这个数字是正数，图像向下移动。如果是负数，则向上移动。\n\
  \n理解这个概念的最佳方法是尝试本章的练习。我强烈建议你在进入第 8 章之前完成这些练习。\n\n## 练习 7\n\n从 [`learncodingfast.com/css`](http://learncodingfast.com/css)\
  \ 下载此练习的源代码并解压文件。此练习的源代码可以在章节找到。\n\n### 练习 7.1\n\n1. 从 [`learncodingfast.com/css`](http://learncodingfast.com/css)\
  \ 下载此练习的源代码并解压文件。此练习的源代码可以在章节找到。\n2. 在浏览器中打开 `7 - Background.html` 文件。注意滚动时发生了什么。\n\
  3. 在 `body` 元素中，将 `background-attachment: fixed;` 改为 `background-attachment: scroll;`。注意标志发生了什么。\n\
  4. 接下来，将 `background-repeat: repeat;` 改为：\n   - (a) `repeat-x;`\n   - (b) `no-repeat;`\n\
  \   - (c) `repeat-y;`\n   注意每种情况下发生了什么。\n5. 接下来，将 `background-color: white;` 改为\
  \ `background-color: #0000FF;`。这应该改变页面的背景颜色。\n6. 最后，我们将查看 `backgroundposition` 属性。此示例使用的图像是存储在相同文件夹中的‘backgroundposition.png’。在继续之前看一眼图像。\n\
  7. 注意当 `background-position` 设置为 `0 0`（默认值）时，显示区域 A。更改 `background-position` 属性将相对于区域\
  \ A 移动背景图像。\n8. 在 `#box1` 的 CSS 中，将 `background-position: 0 0;` 改为：\n   - (a) `background-position:\
  \ -100px 0;`\n   - (b) `background-position: 100px 0;`\n   - (c) `background-position:\
  \ 0 -100px;`\n   - (d) `background-position: 0 100px;`\n   - (e) `background-position:\
  \ -100px -100px;`\n   尝试弄清楚你会得到哪个区域。\n\n# 第 8 章：文本和字体\n\nCSS 中的文本和字体属性用于格式化网页上单词和文本的外观。`font`\
  \ 属性涉及字符的外观，例如它们是“粗”还是“细”、“大”还是“小”，以及使用哪种字体。`text` 属性用于样式化所有其他内容。在本章中，我们将涵盖常用的 `text`\
  \ 和 `font` 属性。\n\n## 字体属性\n\nfont-family\n\n`font-family` 属性用于设置字体类型。\n\n\n\n\n\n\
  字体类型主要三大类：衬线字体、无衬线字体和等宽字体。\n\n衬线字体（Serif）在字符的末端有一个小装饰线。例如“Times New Roman”和 Georgia。\n\
  \n无衬线字体（San Serif）字符的末端没有装饰线。例如 Arial 和 Verdana。\n\n等宽字体（Monospace）所有字符都使用相同的空间。例如，字母‘i’的宽度与字母‘a’相同。等宽字体的示例包括“Courier\
  \ New”和“Lucida Console”。\n\n在指定 `font-family` 属性时，你应该始终包含多个字体名称，这样如果浏览器不支持第一个字体，它就会尝试下一个字体，直到找到它支持的字体为止。从更具体的字体（如“Times\
  \ New Roman”）开始，并以通用字体族结束。如果字体名称包含多个单词，应使用引号。\n\n示例：\n\n```css\nfont-family: \"\
  Times New Roman\", Times, serif;\n```\n\n## font-size\n\n`font-size` 属性设置文本的大小。字体大小可以使用像素\
  \ (px)、em、百分比 (%) 或使用关键字来设置。\n\n### 使用 px\n\n大多数浏览器使用的默认字体大小是 16 像素。如果你想让网站显示不同的字体大小，可以这样指定：`font-size:\
  \ 20px;`。\n\n### 使用 em\n\n一个 em 等于当前的字体大小。如果该元素是另一个元素的子元素，则当前字体大小是父元素的字体大小。如果该元素不是任何元素的子元素，则当前字体大小是浏览器的默认字体大小。如上述，大多数浏览器使用的默认字体大小为\
  \ 16px。因此，默认情况下 `1em = 16px`。\n\n然而，可以通过更改浏览器设置来更改默认字体大小。例如，要更改 Firefox 的默认字体大小，点击菜单按钮（右侧的三条横线按钮），选择“选项”（Options），最后选择“内容”选项卡。然后你可以在“字体与颜色”部分下更改当前字体大小。\n\
  \n如果用户将默认字体设置为 20px，`1em` 变为 20px。如果你想让字体大小变为当前字体大小的 1.5 倍，只需编写 `1.5em`。em 是大多数开发者使用的首选单位大小，因为默认字体大小可以由用户自定义。\n\
  \n### 使用百分比\n\n百分比类似于 em。`200%` 仅意味着当前字体大小的 2 倍。因此，`200% = 2em`。\n\n### 使用关键字\n\n\
  指定字体大小的最后方法是使用关键字。常用的关键字有 `xx-small`、`x-small`、`small`、`medium`（默认值）、`large`、`x-large`\
  \ 和 `xx-large`。\n\n示例：\n\n```css\nfont-size: 40px;\nfont-size: 1.5em;\nfont-size:\
  \ 120%;\nfont-size: large;\n```\n\n## font-style\n\n`font-style` 属性用于指定斜体文本。两个常用值是\
  \ `normal` 和 `italic`。normal 显示不斜体的文本，而 italic 以斜体显示文本。\n\n示例：\n\n```css\nfont-style:\
  \ italic;\n```\n\n## font-weight\n\n`font-weight` 属性是 `font-style` 的对应属性。`font-style`\
  \ 用于指定斜体文本，而 `font-weight` 用于指定加粗文本。常用的值包括 `normal`、`bold`、`bolder` 和 `lighter`。或者，你也可以使用\
  \ 100 的倍数数字指定字符的粗细，从 100（最细）到 900（最粗）。400 是正常粗细，700 等于粗。\n\n然而，注意大多数网络浏览器只支持 `normal`\
  \ 和 `bold` 字体权重。在这种情况下，100-500 对应 `normal`，而 600 及以上对应 `bold`。\n\n示例：\n\n```css\n\
  font-weight: bold;\nfont-weight: 300;\n```\n\n## Text Properties\n\nCSS `text` 属性允许你设置与文本字体相关的属性。常用属性包括文本颜色、文本对齐、文本装饰、字间距、词间距行高。\n\
  \n### color\n\nCSS `color` 属性指定文本的颜色。与我们在第 4 章中学习的 `border-color` 属性类似，文本颜色可以通过三种方式之一指定：使用颜色名称、RGB\
  \ 值或十六进制值。\n\n示例：\n\n```css\ncolor: blue;\ncolor: #00ff00;\ncolor: rgb(255,0,0);\n\
  ```\n\n### text-alignment\n\n`text-alignment` 属性允许我们指定文本是居中、左对齐、右对齐还是两端对齐。常用的值有\
  \ `left`、`right`、`center` 和 `justify`。\n\n示例：\n\n```css\ntext-align: center;\n```\n\
  \n### text-decoration\n\n`text-decoration` 属性主要用于指定文本是否带有装饰。常用的值有 `none`（即：普通文本，无装饰）、`underline`（下划线）、`overline`（文本上方的线）和\
  \ `line-through`（文本删除线）。\n\n此属性通常用于移除链接的下划线。默认情况下，大多数浏览器将以蓝色并带下划线显示链接。你可以使用代码 `text-decoration:\
  \ none;` 来移除下划线。\n\n示例：\n\n```css\ntext-decoration: none;\n```\n\n### letter-spacing\n\
  \n字间距用于增加或减少字符之间的间距。\n\n### word-spacing\n\n词间距用于增加或减少单词之间的间距。\n\n### line-height\n\
  \n行高用于设置文本行之间的垂直距离。\n\n\n\n\n\n## 7. 修改 CSS 属性 `text-align` 并观察示例文本的变化。默认情况下，此段的文字是左对齐的。现在尝试每一项：\n\
  \n(a) `text-align: justify;`\n\n(b) `text-align: right;`\n\n(c) `text-align: center;`\n\
  \n## 8. 修改 CSS 属性 `text-decoration` 并观察示例文本的变化。尝试：\n\n(a) `text-decoration: underline;`\n\
  \n(b) `text-decoration: overline;`\n\n(c) `text-decoration: line-through;`\n\n##\
  \ 9. 修改 CSS 属性 `letter-spacing` 并观察示例文本的变化。尝试：\n\n(a) `letter-spacing: 5px;`\n\n\
  (b) `letter-spacing: -5px;`\n\n## 10. 将 `letter-spacing` 改回 `0px`。修改 CSS 属性 `word-spacing`\
  \ 并观察示例文本的变化。尝试：\n\n(a) `word-spacing: 10px;`\n\n(b) `word-spacing: -20px;`\n\n\
  ## 11. 将 `word-spacing` 改回 `0px`。修改 CSS 属性 `line-height` 并观察示例文本的变化。尝试：\n\n(a) `line-height:\
  \ 2;`\n\n(b) `line-height: 25px;`\n\n(c) `line-height: 30%;`\n\n# 第 9 章：列表、链接与导航栏\n\
  \n在本章中，我们将学习用于样式化链接和列表的 CSS 属性。此外，我们还将结合这两个概念，讨论如何创建网页上常见的导航栏。准备好了吗？让我们从 CSS 列表开始。\n\
  \n## CSS 列表\n\n回想在 HTML 中，我们可以创建两种类型的列表：有序列表和无序列表。我们可以使用 CSS 列表属性对这些列表进行样式化。\n\n\
  ### list-style-type\n\n`list-style-type` 属性允许为列表设置列表项目标记。列表项目标记是指每个列表项目左侧的那些符号/数字/字母。\n\
  \n对于有序列表，我们可以指定想要作为标记的数字或字母类型。例如，如果我们想使用罗马数字（例如 i, ii, iii）作为项目标记，可以写 `list-style-type:\
  \ lower-roman;`。\n\n其他常用的标记包括：\n\n- `decimal`（这是默认值），\n- `decimal-leading-zero`（带有前导零的数字，例如\
  \ 01, 02..），\n- `lower-alpha`（例如 a, b, c..），\n- `lower-greek`（例如 α, β, γ..），\n-\
  \ `upper-alpha`（例如 A, B, C..）以及\n`upper-roman`（例如 I, II, III…）。\n\n对于无序列表，你可以指定想要作为符号的形状。默认标记是\
  \ `disc`（实心圆）。你可以将其更改为 `square`（正方形）或 `circle`（空心圆）。\n\n此外，还可以选择不为列表使用任何项目标记。要这样做，你需要写\
  \ `list-style-type: none;`。这在创建导航栏时非常常见。\n\n示例：\n\n- `list-style-type: lower-roman;`\n\
  - `list-style-type: circle;`\n- `list-style-type: none;`\n\n### list-style-image\n\
  \n如果你不喜欢提供的任何列表样式，可以选择使用图像作为列表项目标记。要这样做，你可以使用 `list-style-image` 属性来指定使用的图像 URL。\n\
  \n示例：\n\n- `list-style-image: url(‘myMarker.gif’);`\n\n### list-style-position\n\
  \n`list-style-position` 属性用于指定列表项目标记应该出现在内容流内部还是外部。有两个接受的值：`inside` 和 `outside`。\n\
  \n默认情况下，列表项目带有一定程度的缩进。如果 `list-style-position` 设置为 `inside`，则列表项目标记将在缩进后显示。缩进由下方图中框框的左边缘表示。如果\
  \ `list-style-position` 设置为 `outside`，则标记将在缩进之前显示![](img/00004.jpg)\n\n换句话说，`list-style-position:\
  \ inside` 导致的缩进比 `list-style-position: outside` 更多。默认位置是 `outside`。\n\n示例：\n\n-\
  \ `list-style-position: outside;`\n\n### list-style\n\n`list-style` 是一个简写属性，用于在一条声明中设置所有列表属性（即\
  \ `list-style-type`、`list-style-position` 和 `list-style-image`）。如果缺少任何值，将使用该缺失属性的默认值。\n\
  \n示例：\n\n- `list-style: square inside url(\"myMarker.gif\");`\n\n## CSS 链接\n\n链接可以使用之前章节中讨论过的任何\
  \ CSS 属性进行样式化。你可以使用 `background-color` 属性设置背景颜色，这将为链接提供高亮显示效果。你还可以使用第 8 章涵盖的文本和字体属性来更改字体大小、字体样式、文本颜色、文本装饰等。\n\
  \n此外，我们可以根据状态对链接进行样式化。链接可以处于四种状态：\n\n- `link`（未访问的链接）\n- `visited`（已访问的链接）\n- `hover`（当鼠标悬停在其上方时）\n\
  - `active`（当点击点击时）\n\n要指定状态，我们写：\n\n```css\na:link { ... }\na:visited { ... }\n\
  a:hover { ... }\na:active { ... }\n```\n\n## 导航栏\n\n导航栏通常作为无序列表创建。让我们尝试制作自己的菜单。\n\
  \n```html\n<ul>\n  <li><a href=\"home.html\">首页</a></li>\n  <li><a href=\"html.html\"\
  >HTML 教程</a></li>\n  <li><a href=\"csst.html\">CSS 教程</a></li>\n  <li><a href=\"\
  javascript.html\">Javascript 教程</a></li>\n</ul>\n```\n\n接下来，我们需要移除列表的项目符号。\n\n```css\n\
  ul {\n  list-style-type: none;\n}\n```\n\n现在，我们必须对链接进行样式化。\n\n```css\na {\n  display:\
  \ block;\n  width: 160px;\n  text-align: center;\n  text-decoration: none;\n  background-color:\
  \ #0000FF;\n}\n\na:link {\n  color: #0000FF;\n}\n\na:visited {\n  color: #00FF00;\n\
  }\n\na:hover {\n  color: #FFFF00;\n}\n\na:active {\n  color: #FF00FF;\n}\n```\n\n\
  最后，如果我们想让导航栏成为水平条，我们需要让列表项目浮动（float）。\n\n```css\nli {\n  float: left;\n}\n```\n\n\
  搞定！我们刚刚创建了一个简单的水平导航栏。该导航栏的源代码已作为练习的一部分给出。尝试一下并让它在视觉上更有吸引力。你还可以为四种链接状态指定不同的样式。\n\n\
  \n\n\n\n> 刷新浏览器。什么都没有变化吧？那是因为 `list-style-position: outside;` 是默认值。现在将 `list-style-position:\
  \ outside;` 改为 `list-style-position: inside;`。你会发现无序列表向右稍微移动了（即缩进变大了）。\n\n> 5. 移除\
  \ `ul` 的 `list-style-type` 属性，并改用以下属性：\n\n> (a) `list-style-image: url(\"myMarker.gif\"\
  );`\n\n> 观察“Cars Unordered List”发生了什么变化。\n\n> 6. 现在让我们来看看如何为超链接样式。尝试在指定的选择器中添加以下规则：\n\
  \n> (a) 在 `a:link{}` 中添加 `color: green;`，并观察“Click Me”链接发生了什么变化。\n\n> (b) 在 `a:active{}`\
  \ 中添加 `font-size: 2em;` 并点击该链接。\n\n> (c) 在 `a:hover{}` 中添加 `background-color: red;`\
  \ 并将鼠标悬停在链接上。\n\n### 练习 9.2\n\n1. 在浏览器和文本编辑器中同时打开 `Chapter 9 - Navigation Bar.html`\
  \ 文件。\n2. 此页面展示了如何使用列表和链接的 CSS 规则创建一个水平导航栏的示例。书中解释了这些步骤。学习代码并尝试修改 CSS 声明以改进此导航栏的设计。\n\
  \n# 第 10 章：表格\n\nHTML 表格默认看起来并不好看。然而，通过一些简单的 CSS 样式，我们可以轻松地将其转换为精美的表格。在本章中，我们将学习如何实现。\n\
  \n## 边框、内边距和外边距\n\n我们将的第一组属性是 `border`、`padding` 和 `margin`。还记得我们在讨论 CSS 盒模型时提到过这些属性吗？HTML\
  \ 表格（<table>`）和单元格（`<th>` 和 `<td>`）遵循与其他 CSS 元素相同的盒模型，因此可以使用这些属性进行样式设置。\n\n请参考下面的图（“Table\
  \ Margin”和“Table Padding”字样是为了参考添加的，实际表格中并不存在）。\n\n![](img/00014.jpg)\n\n该表格的 CSS\
  \ 规则如下：\n\n```css\ntable {\n  border: dashed 1px black;\n  padding: 50px;\n  margin:\
  \ 60px;\n}\n\nth {\n  border: solid 1px black;\n  padding: 30px;\n  text-align:\
  \ center;\n}\n\ntd {\n  border: solid 1px black;\n  padding: 20px;\n}\n```\n\n虚线是表格的边框。虚线框周围的空间是表格的外边距（margin，声明为\
  \ 60px），虚线框内部的空间是它的内边距（padding，50px）。\n\n第一行（Firstname, Lastname, Age）使用 `<th>`\
  \ 标签定义为表格表头。“Firstname”、“Lastname”和“Age”单词周围的空间是 `<th>` 元素的内边距（30px）。\n\n第二行、第三行和第四行使用\
  \ `<td>` 标签定义。“Derek”、“Aaron”和“31”等单词周围的空间是 `<td>` 元素的内边距（20px）。\n\n`<th>` 和 `<td>`\
  \ 元素没有声明外边距，因为外边距会被表格单元格忽略。因此，我们无法指定单元格之间的间距。默认情况下，单个表格单元格之间会有一个小的间隙。此外，即使你将表格内边距设置为\
  \ 0px，表格边框（虚线）与单元格边框（实线）之间也存在间隙。如果你只需要一个边框，必须使用 `border-collapse` 属性：\n\n```css\n\
  border-collapse: collapse;\n```\n\n在本章的练习中，我们将有机会尝试各种 `border`、`padding` 和 `margin`\
  \ 属性。现在，让我们来看下一个属性。\n\n## 高和宽\n\n表格的宽高度可以使用 `width` 和 `height` 属性设置。值通常以像素或百分比的形式给出。例如，下面的代码将表格宽度设置为父元素的\
  \ 100%，高度设置为 500px。\n\n```css\ntable {\n  width: 100%;\n  height: 500px;\n}\n```\n\
  \n你也可以在 `tr`、`th` 或 `td` 级别上使用 `height` 属性。例如，如果你想让表头行的高度为 100px，可以写道：\n\n```css\n\
  th {\n  height: 100px;\n}\n```\n\n此外，你可以在表格单元格级别设置 `width` 属性（即针对 `td` 和 `th` 元素）。如果你想让表格单元格的宽度为\
  \ 200px，可以写道：\n\n```css\nth {\n  width: 200px;\n}\n```\n\n如果你想对单独列设置样式，可以使用 `id`/`class`\
  \ 属性。例如，如果你有如下表格结构：\n\n```html\n<table>\n  <tr>\n    <th id=\"firstColumn\">Firstname</th>\n\
  \    <th class=\"secondColumn\">Lastname</th>\n  </tr>\n  <tr>\n    <td>Derek</td>\n\
  \    <td>Aaron</td>\n  </tr>\n</table>\n```\n\n如果你只需要一个边框，就必须使用 `border-collapse`\
  \ 属性：\n\n```css\nborder-collapse: collapse;\n```\n\n## 文本对齐\n\n表格单元格内的文本可以使用 `text-align`\
  \ 属性进行水平对齐，并使用 `vertical-align` 属性进行垂直对齐。例如：\n\n```css\ntd {\n  text-align: center;\n\
  \  vertical-align: top;\n}\n```\n\n## 背景、字体和文本\n\n还可以使用第 7 章涵盖的背景、字体和文本设置样式。例如：\n\
  \n```css\nth {\n  background-color: #f2f2f2;\n  font-weight: bold;\n}\n```\n\n##\
  \ nth-child 选择器\n\n有时当我们有一个非常大的表格时，很难阅读。提高可读性的一种方法是使用 `nth-child()` 选择器为交替行上色。\n\
  \n```css\ntr:nth-child(even) {\n  background-color: lightgray;\n}\n\ntr:nth-child(odd)\
  \ {\n  background-color: white;\n}\n```\n\n\n\n\n## 7. 分别在第一个、第二个和第三个 `<th>` 起始标签上添加\
  \ `id=\"firstColumn\"`、`id=\"secondColumn\"` 和 `id=\"thirdColumn\"` 属性。接下来，添加以下\
  \ CSS 规则来分别调整三列的宽度：\n\n```css\n#firstColumn {\n    width: 100px;\n}\n#secondColumn\
  \ {\n    width: 200px;\n}\n#thirdColumn {\n    width: 50px;\n}\n```\n\n刷新页面并观察变化。尝试使用不同的值调整宽度。\n\
  \n## 8. 修改 `tr` 的 CSS 声明并观察表格发生了什么。尝试添加：\n\n(a) `text-align: center;`\n(b) `vertical-align:\
  \ top;`\n\n从 `tr` 中删除上述属性并将它们添加到 `th` 中。注意发生了什么。对 `td` 重复相同的操作。如果你没有看到任何区别，请增加表格的宽度和/或行的高度。\n\
  \n## 9. 修改 `tr` 的 CSS 声明并观察表格发生了什么。尝试添加：\n\n(a) `background-color: green;`\n(b)\
  \ `color: white;`\n\n从 `tr` 中删除上述属性并将它们添加到 `th` 中。注意发生了什么。\n\n现在，从 `th` 中删除属性并将它们添加到\
  \ `td` 中。\n\n## 10. 最后，让我们尝试为交替行染色。首先从 `td` 中移除 `background-color` 和 `color` 规则。接下来，添加以下代码并观察发生了什么。\n\
  \n```css\ntr:nth-child(even) {\n    background-color: lightgreen;\n}\ntr:nth-child(odd)\
  \ {\n    background-color: lightgray;\n}\n```\n\n## 额外项目\n\n恭喜你！我们现在涵盖了足够的 CSS（以及\
  \ HTML）基础知识来从开始编写我们的第一个网页。学习 CSS 的最佳方法是实践。因此，我在书中包含了一个额外项目，它将引导你编写一个虚构旅行社的网页。你可以在\
