  \ `float` 的作用）。`box1` 现在居中对齐了。\n8. 现在，让我们处理 `box2`。修改 `box2` 的 CSS 声明，将 `padding:\
  \ 50px;` 改为以下各项，并注意 `box2` 内部的变化：\n   - (a) `padding: 25px;`\n   - (b) `padding:\
  \ -10px;`\n   - (c) `padding: 25px 50px;`\n   - (d) `padding: 25px 50px 60px 10px;`\n\
  \   8(b) 将不起作用，因为内边距不能为负值。你将得到 0 像素的内边距。\n9. 移除 `box2` 的内边距规则并添加以下 4 行：\n   ```css\n\
  \   padding-top: 25px;\n   padding-right: 50px;\n   padding-bottom: 60px;\n   padding-left:\
  \ 10px;\n   ```\n   注意 `box2` 有任何变化吗？应该没有变化，因为这与上面的 8(d) 相同。\n10. 现在让我们更改 `box2`\
  \ 的边框样式。从 `box2` 的 CSS 声明中删除行 `border: 5px solid black;` 并添加以下各项。注意边框在每种情况下发生了什么：\n\
  \    - (a) `border-style: solid;`\n    - (b) `border-style: none double;`\n    -\
  \ (c) `border-style: inset;`\n    - (d) `border-style: outset;`\n11. 接下来，移除 `box2`\
  \ 的 `border-style` 规则并添加以下：\n    ```css\n    border-top-style: dotted;\n    border-left-style:\
  \ double;\n    ```\n12. 现在移除第 11 的规则并将边框样式改为实线（`border-style: solid;`）。添加以下各项。注意每种情况下\
  \ `box2` 发生了什么：\n    - (a) `border-width: 25px;`\n    - (b) `border-width: 25px\
  \ thin;`\n    - (c) `border-top-width: 30px;`\n13. 现在我们要更改 `box2` 的边框颜色。尝试添加以下各项：\n\
  \    - (a) `border-color: rgb(255, 0, 0);`\n    - (b) `border-color: red green;`\n\
  \    - (c) `border-top-color: #12FF5F;`\n14. 接下来，我们尝试边框简写。移除 `box2` 的所有边框属性。添加以下：\n\
  \    ```css\n    border: 5px solid green;\n    ```\n15. 现在，尝试 `border-radius` 属性。尝试以下各项：\n\
  \    - (a) `border-radius: 20px;`\n    - (b) `border-radius: 10px 20px;`\n    -\
  \ (c) `border-radius: 25px 5px 0 50px;`\n    - (d) `border-top-left-radius: 10px;`\n\
  \n\n\n\n\n定位元素有四种方法。为了理解这四种方法的工作原理，我强烈建议你尝试本章末尾的练习。这是一个没有实践很难理解的话题。\n\n## 静态定位 (Static\
  \ Positioning)\n\n第一种定位方法是 `static` 静态定位。静态并没有特殊含义，它意味着元素是根据页面的正常流进行定位的。所有的 HTML\
  \ 元素默认都使用这种方法进行定位。如果你想指定使用 `static` 定位（例如为了覆盖同一元素的其他定位规则），你可以写：\n\n```css\nposition:\
  \ static;\n```\n\n## 相对定位 (Relative Positioning)\n\n定位元素的第二种方法是 `relative` 相对定位方法。这种方法相对于元素相对于正常位置进行定位。正常位置是指元素在没有指定定位规则或使用\
  \ `static` 定位时的默认位置。\n\n假设我们有两个盒子，`box1` 和 `box2`，且没有指定定位。如果我们在 HTML 代码中在 `box1`\
  \ 之后创建 `box2`，那么 `box2` 默认将位于 `box1` 下方（参见下方代码）。\n\n```html\n<!DOCTYPE html>\n<html\n\
  <head>\n<style>\n#box1 {\n  /*一些用于 box1 的样式规则*/\n}\n#box2 {\n  /*一些用于 box2 的样式规则*/\n\
  }\n</style>\n</head>\n<body>\n<div id=\"box1\">Box 1</div>\n<div id=\"box2\">Box\
  \ 2</div>\n</body>\n</html>\n```\n\n现在，假设我们为 `box2` 的 CSS 声明添加了以下规则：\n\n```css\n\
  position: relative;\nleft: 150px;\ntop: 50px;\n```\n\n我们所做的是将 `box2` 的定位更改为 `relative`\
  \ 相对定位。\n\n![](img/00002.jpg)\n\n上面的图片显示了在使用 `relative` 定位时 `box2` 的位置。添加了一个白色虚线框来显示\
  \ `box2` 的原始位置。\n\n当应用 `relative` 定位时，`box2` 会相对于它的正常位置移动。`top: 50px;` 行将盒子距离原始位置的顶部移动\
  \ 50px，而 `left: 150px;` 行将其向左移动 150px。\n\n你也可以使用 `right` 和 `bottom` 属性来定位 `box2`。例如，`bottom:\
  \ 50px;` 将将 `box2` 从其原始底部向上移动 50px，而 `right: 50px;` 将将其从 `box2` 的原始右边缘向左移动 50px。此外，你可以使用负像素来定位盒子（例如\
  \ `left: -50px`）。\n\n尝试第 5 章的练习，并调整这些值看看所有所有设置是如何工作的。\n\n注意，当使用 `relative` 定位时，元素可能会与其他元素重叠。\n\
  \n如果你想指定哪个元素应该在前面，必须使用 `z-index` 属性。`z-index` 属性适用于任何定位为 `relative`、`fixed` 或 `absolute`\
  \ 的元素（即非 `static`）。`z-index` 值较大的元素将定位在 `z-index` 值较小的元素前面。\n\n假设你有两个盒子，`greenBox`\
  \ 和 `redBox`，它们相互重叠。如果你将 `greenBox` 的 `z-index` 声明为\n\n```css\nz-index: 1;\n```\n\
  \n并将 `redBox` 的 `z-index` 声明为\n\n```css\nz-index: 2;\n```\n\n那么 `redBox` 将位于 `greenBox`\
  \ 之上，因为它的 `z-index` 值更大。\n\n## 固定定位 (Fixed Positioning)\n\n第三种定位方法是 `fixed` 固定定位。顾如其名，使用\
  \ `fixed` 方法定位的元素将始终保持在它指定的位置；即使页面滚动，它也不会移动。固定定位通常用于在网页的侧边定位社交分享按钮。要使用 `fixed` 定位，我们写：\n\
  \n```css\nposition: fixed;\n```\n\n在使用 `fixed` 定位时，我们可以使用 `top` 属性指定盒子距离页面顶部的像素数，而使用\
  \ `left` 属性指定它距离页面左侧的像素数。\n\n除了 `top` 和 `left`，还有 `right` 和 `bottom` 属性，它们分别指定盒子距离页面右侧和底部的像素数。\n\
  \n## 绝对定位 (Absolute Positioning)\n\n最后的方法是 `absolute` 绝对定位。\n\n当使用 `absolute` 定位时，元素相对于第一个定位非\
  \ `static` 的父元素进行定位。如果没有找到这样的元素，它将相对于页面进行定位。\n\n例如，假设我们有以下 HTML 代码：\n\n```html\n\
  <div id=\"box1\">Content in Box 1</div>\n<div id=\"box2\">Content in Box 2</div>\n\
  ```\n\n以及以下 CSS 声明：\n\n```css\n#box1 {\n  position: relative;\n}\n#box2 {\n  position:\
  \ absolute;\n  top: 50px;\n  left: 150px;\n}\n```\n\n假设 `box2` 不是任何具有非静态定位元素的子元素，它将相对于页面进行定位。也就是说，它距离页面顶部\
  \ 50px，距离左侧 150px。\n\n然而，如果我们更改 HTML 结构为：\n\n```html\n<div id=\"box1\">Content in\
  \ Box 1\n  <div id=\"box2\">Content in Box 2</div>\n</div>\n```\n\n`box2` 现在是 `box1`\
  \ 的子元素。因此 `box2` 将相对于 `box1` 定位。它距离 `box1` 顶部 50px，距离 `box1` 左侧 150px。\n\n在某种程度上，`absolute`\
  \ 定位与 `relative` 定位相似，只是元素相对于父元素而不是正常位置。\n\n## 浮动 (Floating)\n\n我们将讨论的下一个 CSS 属性是浮动。浮动是一种在页面上排列元素的技术。这种想法类似于将书放在书架上。假设你有一叠厚度和高度不同的书，你需要将这些书放在书架上。此外，不允许重新排列书籍。也就是说，书籍必须按照它们在原始中的顺序放在书架上。\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n<title>Float</title>\n<style type=\"\
  text/css\">\ndiv {\n  float: left;\n  border: 1px dashed black;\n  margin: 5px;\n\
  }\n#box1 {\n  width: 60px;\n  height: 100px;\n}\n#box2 {\n  width: 100px;\n  height:\
  \ 20px;\n}\n#box3 {\n  width: 50px;\n  height: 150px;\n}\n#box4 {\n  width: 20px;\n\
  \  height: 50px;\n}\n#box5 {\n  width: 150px;\n  height: 120px;\n}\n#box6 {\n  width:\
  \ 120px;\n  height: 70px;\n}\n#box7 {\n  width: 25px;\n  height: 80px;\n}\n</style>\n\
  </head>\n<body>\n<div id=\"box1\">Box 1</div>\n<div id=\"box2\">Box 2</div>\n<div\
  \ id=\"box3\">Box 3</div>\n<div id=\"box4\">Box 4</div>\n<div id=\"box5\">Box 5</div>\n\
  <div id=\"box6\">Box 6</div>\n<div id=\"box7\">Box 7</div>\n</body>\n</html>\n```\n\
  \n如果我们运行这段代码，我们将得到类似下面的图片。\n\n![](img/00013.jpg)\n\n注意盒子是如何是从顶部开始从左到右排列的。由于 box\
  \ 5 太厚无法放入第一行，CSS 将其放在上一个盒子的下方。\n\n现在，假设在这些 7 个盒子之外，我们还有想要显示在网站上的以下文本。\n\n<p>这是一些非浮动的文本。</p>\n\
  <p>这是更多非浮动的文本。</p>\n<p>这是更多的非浮动的文本。</p>\n\n\n\n\n\n如果这些段落包含在 `div` 框之后的 HTML 文档中，我们将得到下面的图。这些段落将仅仅“挤入”任何可用的空间。\n\
  \n![](img/00006.jpg)\n\n如果你不希望发生这种情况，可以使用 `clear: both` 属性来清除浮动。要这样做，请在 CSS 声明中添加以下内容：\n\
  \n```css\n.clearFloat { clear: both; }\n```\n\n要使用此类，我们将其添加到第一个 `<p>` 标签中：\n\n```html\n\
  <p class=\"clearFloat\">这是某段未浮动的文本。</p>\n```\n\n你只需要在第一个 `<p>` 标签上添加 `clearFloat`\
  \ 类。一旦清除了浮动，文本将不再环绕这些框布局。\n\n这就是 CSS 中定位和浮动的的工作原理精要。我强烈建议你尝试本章节的练习题，以更好地理解这两个概念。\n\
