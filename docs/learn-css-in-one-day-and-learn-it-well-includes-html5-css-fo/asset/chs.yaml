  \ CSS，这本书将为你提供足够的深度，让你立即开始编写 CSS 代码。\n\n书中的所有示例和图像都经过仔细挑选，用于演示每个概念，以便你对该语言有更深入的理解。每个\
  \ CSS 章节末尾都有一个练习。这些练习旨在帮助你进一步加强理解。所有练习的源代码可以在书末的附录中找到。\n\n此外，正如理查德·布兰森所说：“学习任何事情最好的方法就是实践”。本书包含一个额外的赠送项目，你将在引导下从零开始编写一个网页。该项目使用了书中涵盖的概念，并让你有机会看到它们是如何整合在一起的。\n\
