    jQuery fadeOut() Example


    The following example demonstrates the fadeOut() method with different parameters:


    $("button").click(function(){


    $("#div1").fadeOut();


    $("#div2").fadeOut("slow");


    $("#div3").fadeOut(3000);


    });


    jQuery fadeToggle() Method


    Similar to the jQuery toggle() method which toggles between the hide() and show()
    methods, The jQuery fadeToggle() method toggles between the fadeIn() and fadeOut()
    methods.


    If the elements are hidden, fadeToggle() will fade them in. If the elements are
    visible, fadeToggle() will fade them out.


    Syntax


    $(selector).fadeToggle(speed,callback);


    The optional speed parameter specifies the duration of the effect. It accepts
    following values: "slow", "fast", or a number of milliseconds.


    The optional callback parameter is a function to be executed after the fading
    completes.


    jQuery fadeToggle() Example


    The following example demonstrates the fadeToggle() method with different parameters:


    $("button").click(function(){


    $("#div1").fadeToggle();


    $("#div2").fadeToggle("fast");


    $("#div3").fadeToggle(5000);


    });


    jQuery fadeTo() Method


    The final option in the set of jQuery fade methods is the fadeTo() method. The
    fadeTo() method allows fading to a given opacity (and takes a value between 0
    and 1). This is contrasted with the other fade in methods which always finish
    with showing the element at 100% opaque.


    Syntax


    $(selector).fadeTo(speed,opacity,callback);


    The required speed parameter specifies the duration of the effect. It accepts
    following values: "slow", "fast", or a number of milliseconds.


    The required opacity parameter in the fadeTo() method specifies fading to a given
    opacity (value between 0 and 1).


    The optional callback parameter is a function to be executed after the fading
    completes.


    jQuery fadeTo() Example


    The following example demonstrates the fadeTo() method with different parameters:


    $("button").click(function(){


    $("#div1").fadeTo("slow",0.15);


    $("#div2").fadeTo("slow",0.5);


    $("#div3").fadeTo("slow",0.8);


    });


    jQuery Sliding


    The jQuery slide methods show or hide elements by sliding them up or down. jQuery
    has the following slide methods:


    *   slideDown()


    *   slideUp()


    *   slideToggle()


    jQuery slideDown() Method


    The jQuery slideDown() method is used to slide down an element into visibility.


    Syntax


    $(selector).slideDown(speed,callback);


    The optional speed parameter specifies the duration of the effect. It can take
    the following values: "slow", "fast", or a number of milliseconds.


    The optional callback parameter is a function to be executed after the sliding
    completes.


    jQuery slideDown() Example


    The following example demonstrates the slideDown() method:


    $("#button").click(function(){


    $("#panel").slideDown();


    });


    jQuery slideUp() Method


    The jQuery slideUp() method is used to slide up an element into invisibility.


    Syntax


    $(selector).slideUp(speed,callback);


    The optional speed parameter specifies the duration of the effect. It can take
    the following values: "slow", "fast", or a number of milliseconds.


    The optional callback parameter is a function to be executed after the sliding
    completes.


    jQuery slideUp() Example


    The following example demonstrates the slideUp() method:


    $("#button").click(function(){


    $("#panel").slideUp();


    });


    jQuery slideToggle() Method


    The jQuery slideToggle() method toggles between the slideDown() and slideUp()
    methods.


    If the elements are visible, slideToggle() will slide them up. If the elements
    are invisible, slideToggle() will slide them down into visibility.


