    $("input:radio:checked") selects all radio elements that are checked.


    $("option:not(:selected)") selects all unselected <option> elements.


    $(":text:visible") selects all text fields that are visible.


    $("#myForm button:not(.someClass)") selects all buttons from the <form> with the
    id of myForm that do not possess the class name someClass.


    $("select[name=choices] :selected") selects the selected <option> elements within
    the <select> element named choices.


    ("p:contains(hello world)") selects all <p> elements that contain the text ''hello
    world''.


    JavaScript Objects


    JavaScript programmers in the audience will appreciate that the result set created
    by the application of a selector can be treated as a JavaScript array. Technically
    it is a JavaScript array that jQuery is shielding us from. Sometimes though it
    can be useful to use array indexing to directly access elements within the result
    set.


    For example:


    var element = $("img")[0];


    will set the variable element to the first element in the matched set


    Taking Action on a Result Set


    While the jQuery selectors give us great flexibility in identifying which DOM
    elements are to be added to a result set, sometimes there are criteria that cannot
    be expressed by selectors alone. Also, in the course of jQuery method chaining
    we may wish to adjust the contents of the result set between method calls. For
    these situations jQuery provides methods that operate not upon the elements within
    the result set, but on the result set itself. This section will discuss those
    methods.


    Adding Elements to a Result Set


    You can add additional elements to a result set using the .add() method.


    add(expression)


    The expression is a selector that specifies which elements are to be matched.
    Elements that match the selector will be added to the existing matched items.


    Given a jQuery object that represents a set of DOM elements, the .add() method
    constructs a new jQuery object from the union of those elements in the result
    set and the ones passed into the method. The argument to .add() can be pretty
    much anything that $() accepts, including a jQuery selector expression, references
    to DOM elements, or an HTML snippet.


    Removing Elements from a Result Set


    What if we want to remove elements from the result set? That is the job of the
    not() method.


    not(expression)


    The expression is a selector that specifies which elements are to be matched.
    Elements that do not match the selector will be included in the result.


    Given a jQuery object that represents a set of DOM elements, the .not() method
    constructs a new jQuery object from a subset of the matching elements. The supplied
    selector is tested against each element; the elements that do not match the selector
    will be included in the result.


    Examples


    $("body *").css("font-weight","bold")


    .not("p").css("color","blue");


    Makes all body elements bold, then makes all but the paragraph elements blue.


    $("body *").css("font-weight","bold")


    .not(anElement).css("color","blue");


    Similar to the previous example except the element referenced by variable anElement
    is not included in the second set (and therefore not colored blue).


    Finding Descendants


    Sometimes it is useful to limit the search for elements to descendants of the
    previously identified elements in the result set. The find() method does just
    that:


    find(expression)


    The expression is a selector that specifies which descendant elements are to be
    matched.


    Unlike the previously examined methods, find() only accepts a selector expression
    as its argument. The elements within the existing matched set will be searched
    for descendants that match the expression. Any elements in the original matched
    set that match the selector are not included in the new set.


    Given a jQuery object that represents a set of DOM elements, the .find() method
    allows us to search through the descendants of these elements in the DOM tree
    and construct a new jQuery object from the matching elements. The .find() and
    .children() methods are similar, except that the latter only travels a single
    level down the DOM tree.


    The first signature for the .find() method accepts a selector expression of the
    same type that we can pass to the $() function. The elements will be filtered
    by testing whether they match this selector.


    Examples


    $("div").css("background-color","blue")


    .find("img").css("border","1px solid aqua");;


    Selects all <div> elements, makes their background blue, selects all <img> elements
    that are descendants of those <div> elements (but not <img> elements that are
    not descendants) and gives them an aqua border.


    Filtering Matched Sets


    When really fine-grained control is required for filtering the elements of a matched
    set, the filter() method comes in handy:


    filter(selector)


    The selector is an expression that specifies which elements are to be retained.


    The filter function can also be passed a function, but that is beyond the scope
    of this book. When passed a selector, it acts like the opposite of not(), keeping
    those elements which match the selector (as opposed to excluding them).


    $(".invisible").show()


    .filter("img[src$=.gif]").attr("title","Hello world!");


    The first line selects all elements with class name invisible and sets them to
    visible. The second line filters the set down to just GIF images, and assigns
    a title attribute to them.


    Using jQuery for Form Validation


    Introduction - Basic Form Validation


    One of the primary uses of JavaScript is form validation. The idea is to prevent
    users from submitting forms that contain "invalid" data, however you define it.
    For instance, if a form asks a user for their email, wouldn''t it be great to
    check to see if a valid email address was entered? JavaScript makes this possible,
    but jQuery makes it easy with the validation plugin, which can be found at [http://plugins.jquery.com/validation/](http://plugins.jquery.com/validation/)


    Let''s imagine the following simple input form that could be used to allow visitors
    to your website to provide some feedback about it. We''ll start with a basic web
    form that does not have any validation.


