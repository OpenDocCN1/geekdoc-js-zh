    \ AJAX 语法 - Get/Post\n\n`get()` 和 `post()` 方法用于从服务器请求数据。\n\n### Get 与 Post\n\n\
    *   `GET` 从指定的资源请求数据。\n*   `POST` 将数据提交到指定的资源。\n\n`GET` 用于获取数据。然而，与 `GET` 相比有两个主要区别。首先，`POST`\
    \ 方法可以随请求发送数据。\n\n## jQuery $.get() 方法\n\n`$.get()` 方法使用 HTTP 请求从服务器获取数据。这是 `get()`\
