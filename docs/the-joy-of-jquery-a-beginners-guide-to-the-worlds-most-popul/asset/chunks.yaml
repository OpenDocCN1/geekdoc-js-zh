    ## 什么是 jQuery?

    ### 下载的替代方案

    使用来自 Google 或 Microsoft 的托管版本 `jQuery` 相比于自己托管具有巨大的优势。许多用户在访问其他网站时已经从 Google 或
    Microsoft 下载过 `jQuery`。因此，他们就不需要再次下载它，因为他们的浏览器已经在本地存储了它。这缩短了你网站的加载时间。此外，大多数 CDN
    都会确保当用户请求文件时，将从距离他们最近的服务器提供服务，这很可能比你的服务器更近（更重要的是，速度更快）。


    除非你有非常充分的理由要自己托管 `jQuery`，否则你应该使用 CDN（内容分发网络）。


