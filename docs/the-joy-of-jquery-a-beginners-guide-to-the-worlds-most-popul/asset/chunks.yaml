    "Buick",


    "Cadillac",


    "Chevrolet",


    "Chrysler",


    "Dodge",


    "Ferrari",


    "Fiat",


    "Fiskar",


    "GMC",


    "Honda",


    "Hyundai",


    "Infiniti",


    "Jaguar",


    "Jeep",


    "Kia",


    "Mazda",


    "Mercedes-Bens",


    "Mitsubishi",


    "Nissan",


    "Porsche",


    "Rolls-Royce",


    "Scion",


    "Suburu",


    "Toyota",


    "Volkswagon"


    38.5 “Volvo”


    ];


    $( "#tags" ).autocomplete({


    source: carTypes


    });


    });


    </script>


    </head>


    <body>


    <h1>Joy of jQuery - Sam''s Used Cars</h1>


    <h2>What kind of car are you looking for?</h2>


    <div class="ui-widget">


    <label for="tags">Manufacturer: </label>


    <input id="tags" />


    </div>


    </body>


    </html>


    Here''s how the form will look when done. A text box labeled ''Manufacturer''
    will automatically fill in car makes when you start to type. This is so cool,
    you simply have to add it everywhere you can in your own web pages!


