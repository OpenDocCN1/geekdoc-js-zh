  trans: "\n\n敏锐的读者可能已经注意到标题为“反馈”的列表项具有类名 `class=\"ui-state-disabled\"`。这防止了该项目被点击。很聪明，不是吧？这是因为汽车经销商\
    \ Sam 并不真的想要你的反馈，他只是想要钱。 :)\n\n# jQuery 进度条\n\n![](img/00019.jpeg)\n\n通常，向用户显示操作状态是有帮助的。在“Sam\
    \ 的二手车”的案例中，Sam 可能希望用户知道他们距离准备好车辆还有多远。进度条是视觉化这种状态极好的方法。\n\n一条 jQuery 语句就完成了所有工作。\n\
    \n```javascript\n$(function() {\n  $( \"#progressbar\").progressbar({value: 37});\n\
    });\n```\n\n再次，这清楚地展示了 jQuery 库惊人的力量。后台正在发生大量的代码。\n\n记住，基础的 jQuery 语法是 `$(selector).action()`。\n\
    \n执行工作的行代码是 `$( \"#progressbar\").progressbar({value: 37});`。在这个示例中，我们选择了一个 ID\
    \ 为 `progressbar` 的 DIV，并告诉 jQuery 对其应用 `progressbar` 函数。`progressbar` 函数接受一个\
    \ `value` 参数，用于指定进度条应该填充的百分比。\n\n## 示例代码\n\n```html\n01. <!doctype html>\n02.\
    \ <html lang=\"en\">\n03. <head>\n04. <title>jQuery UI Progressbar - Default functionality</title>\n\
    05. <link rel=\"stylesheet\" href=\"http://code.jquery.com/ui/1.10.3/themes/smoothness/jquery-ui.css\"\
    \ />\n06. <script src=\"http://code.jquery.com/jquery-1.9.1.js\"></script>\n07.\
    \ <script src=\"http://code.jquery.com/ui/1.10.3/jquery-ui.js\"></script>\n08.\
    \ <link rel=\"stylesheet\" href=\"/resources/demos/style.css\" />\n09. <script>\n\
    10. $(function() {\n11. $( \"#progressbar\").progressbar({\n12. value: 37\n13.\
    \ });\n14. });\n15. </script>\n16. </head>\n17. <body>\n18. <h1>The Joy of jQuery:\
    \ Sam's Used Cars</h1>\n19. <p>感谢您将车开到 Sam 的二手车修理厂。</p>\n20. <p>您的车已经修理了 37%……\
    \ 换句话说，我们已经成功将其拆解了。</p>\n21. <div id=\"progressbar\"></div>\n22. </body>\n23.\
    \ </html>\n```\n\n此小组件的相关代码可以在第 `11` 行和第 `21` 行找到。\n\n# jQuery 滑块\n\n滑块控件用于允许用户选择一个值而无需手动输入。相反，用户只需沿着某线移动选择器即可。在合适的情况下，滑块可以非常丝滑易用，但你不想过度使用。\n\
    \n如果你曾经买过二手车，你就知道当你靠近一辆车时，第一个想要得到答案的问题是“这辆车多少钱？”。反之，向你走来的销售人员想要知道的第一个问题是“你的预算是多少？”。\n\
    \n销售人员会非常喜欢这个滑块。对于 Sam 的二手车网站的访问者来说，滑块是一种指定他们愿意花费金额的简单方法，这样就可以向客户展示合适的车辆。它的外观可能是这样的：\n\
    \n![](img/00020.jpeg)\n\n生成滑块的代码（再次）非常简单。我们在表单上创建一个 `div` 并给它一个唯一的 `id`，例如 `'slider'`。在\
    \ jQuery 的文档加载就绪事件中，我们选择该 `div` 并对其应用 `slider` 方法。\n\n`slider` 方法接受多个选项，所有选项的描述可以在\
    \ [`api.jqueryui.com/slider/`](http://api.jqueryui.com/slider/) 中找到。\n\n滑块小组件的一些常用选项包括：`value`、`min`、`max`\
    \ 和 `increment`。\n\n与目前为止显示的组件相比，这个小组件的一个重要区别是，滑块小组件有一个我们需要处理的重要事件以使其变得有用。这就是\
    \ `slide` 事件。每当滑块控件移动时，`slide` 事件就会被触发。事件中提供的 `ui.value` 值代表了滑块由于当前移动而将具有的值。取消事件将阻止滑块移动，滑块将保持其先先的值。\n\
    \n例如，当用户移动滑块时， Sam 可能希望显示的值为“您愿意每月为车支付 250 美元”之类，以便向用户明确他们所选择的值。\n\n## 代码示例\n\n\
    ```html\n01. <!doctype html>\n02. <html lang=\"en\">\n03. <head>\n04. <meta charset=\"\
    utf-8\" />\n05. <title>Joy of jQuery - Slider</title>\n06. <link rel=\"stylesheet\"\
    \ href=\"jquery-ui.css\" />\n07. <script src=\"jquery-1.9.1.js\"></script>\n08.\
    \ <script src=\"jquery-ui.js\"></script>\n09. <link rel=\"stylesheet\" href=\"\
    /resources/demos/style.css\" />\n10. <script>\n11. $(function() {\n12. $( $(\"\
    #slider\").slider({\n13. value:200,\n14. min:100,\n15. max:500,\n16. step:25,\n\
    17. slide: function( event, ui ) {\n18. $( \"#amount\").val( \"$\" + ui.value\
    \ );\n19. }\n20. });\n21. $(\"#amount\").val( \"$\" + $(\"#slider\").slider(\"\
    value\"));\n22. });\n23. </script>\n24. </head>\n25. <body>\n26. <h1>The Joy of\
    \ jQuery: Sam's Used Cars</h1>\n27. <p>二手车</p>\n28. <p>首先，你的预算是多少?</p>\n29. <div\
    \ id=\"slider\"></div>\n30. <input type=\"text\" id=\"amount\" style=\"border:0;\
    \ font-weight:bold;\" />\n31. <p>此示例展示了特定的增量，在此情况下</p>\n32. <p>但你可以将其改为任何值。</p>\n\
    33. </body>\n34. </html>\n```\n\n第 1-10 行在所有中通用，不再进行详细说明。它们设置了页面并引用了 jQuery 文件。\n\
    \n第 10-23 行是示例中最重要的部分，我们将重点关注。第 10 行开始脚本块。第 11 行是现在熟悉的文档加载就绪事件的简写引用。它意味着“当文档充分加载到浏览器后执行以下操作”。\n\
    \n第 12 行遵循标准的选择器/动作语法，选择 ID 为 `'slider'` 的 `div` 并对其应用 `slider` 方法。`slider` 方法定义在\
    \ jQuery 库中。\n\n执行工作的行代码是 `$( \"#slider\").slider({value: 200, min:100, max:500,\
    \ step:25});`。在这个示例中，我们选择了一个 ID 为 `slider` 的 div，并告诉 jQuery 将其转换为一个初始值为 200 (`value:200`)、最小值为\
    \ 100、最大值为 500 且每次点击增量为 25 (`step:25`) 的滑块。\n\n到为止都还好，对吧？\n\n接下来的部分有点复杂，所以我在这里重复代码，以便你不需要向上滚动。接下来我们将集中在第\
    \ 17-22 行，但我们会在上下文中显示它们。\n\n```javascript\n17. slide: function( event, ui ) {\n\
    18. $( \"#amount\").val( \"$\" + ui.value );\n19. }\n20. });\n```\n\n"
- fmt: "\n```javascript\n21\\. $( \"#amount\" ).val( \"$\" + $( \"#slider\" ).slider(\
    \ \"value\" ) );\n22\\. });\n24\\. </head>\n```\n\nLine 17 is different from the\
    \ earlier options because instead of passing a simple value such as `max:500`,\
    \ we are going to instead handle the slide event. An event is something that happens,\
    \ such as when a button is clicked. In this case, the slide event occurs when\
    \ the slider slides. We are going to pass the slide option a function, as shown:\n\
    \n```javascript\nslide: function( event, ui ) {\n  $( \"#amount\" ).val( \"$\"\
    \ + ui.value );\n}\n```\n\nIn other words, when the slide event occurs, we are\
    \ going to perform the following function:\n\n```javascript\n$( \"#amount\" ).val(\
    \ \"$\" + ui.value );\n```\n\nThe astute reader (and by this I mean you) will\
    \ notice that the function used to handle the slide event of the slider control\
    \ itself uses jQuery!\n\nThe function handling the slide event of the slider control\
    \ follows the standard jQuery syntax of `$(selector).action()`.\n\nThe function\
    \ performs the following action: Select the thing with the ID of `'amount'` and\
    \ set its value to the dollar symbol and the current value of the slider control.\
    \ I circled it in red below, so you can see what happens when the user drags the\
    \ slider to the 225 mark.\n\n![](images/00021.jpeg)\n\nThe rest of the code is\
    \ standard HTML and I'll skip explaining it. You can play with it using the included\
    \ file `slider.html`.\n\n## jQuery Tabs\n\nTabs are a great way to group related\
    \ information so that the page doesn't seem overwhelming to the user and to make\
    \ it easier to find the information you are looking for.\n\nIn the case of a web\
    \ site for a used car business, you might not want a long page full of information\
    \ but rather to group related entries such as Overview, Photographs, and Finance\
    \ Calculator, as shown below:\n\n![](images/00022.jpeg)\n\nThe tab control works\
    \ very much like the menu control. You start off with an unordered list, then\
    \ transform it into something else with the magic of jQuery. Here's the relevant\
    \ HTML snippet used to create the page shown above:\n\n```html\n<div id=\"tabs\"\
    >\n  <ul>\n    <li><a href=\"#tabs-1\">Overview</a></li>\n    <li><a href=\"#tabs-2\"\
    >Photographs</a></li>\n    <li><a href=\"#tabs-3\">Finance Calculator</a></li>\n\
    \  </ul>\n  <div id=\"tabs-1\">\n    <p>Mileage: 23<br>Body Style: Convertible<br>Exterior\
    \ Color: Midnight Sapphire<br>Interior Color: Seashell<br>Stock #: R177<br><br>Fuel:\
    \ Gasoline: R-177<br>Engine: 6.8L V12 48V GDI DOHC<br>Transmission: 8-Speed Automatic<br>Drivetrain:\
    \ RWD<br>Doors: 2</p>\n  </div>\n</div>\n```\n\nThe jQuery code required is almost\
    \ ridiculously simple:\n\n```javascript\n$(function() {\n  $( \"#tabs\" ).tabs();\n\
    });\n```\n\nTo put content inside the tab where you want it to go, create a `div`\
    \ with an `id` which matches the `href` target of the list. For example, in the\
    \ code that follows note that the string `'tabs-1'` is common in both yellow highlights.\
    \ This is what links the tab to the content.\n\n```html\n<div id=\"tabs\">\n \
    \ <ul>\n    <li><a href=\"#tabs-1\">Overview</a></li>\n    <li><a href=\"#tabs-2\"\
    >Photographs</a></li>\n    <li><a href=\"#tabs-3\">Finance Calculator</a></li>\n\
    \  </ul>\n  <div id=\"tabs-1\">\n    <p>Mileage: 23<br>Body Style: Convertible<br>Exterior\
    \ Color: Midnight Sapphire<br>Interior Color: Seashell<br>Stock #: R177<br><br>Fuel:\
    \ Gasoline<br>Engine: 6.8L V12 48V GDI DOHC<br>Transmission: 8-Speed Automatic<br>Drivetrain:\
    \ RWD<br>Doors: 2</p>\n  </div>\n</div>\n```\n\nWhat we have done is specified\
    \ that the tab with the label of Overview will contain the content which is specified\
    \ in the `div` with the `id` of `'tabs-1'`. It really doesn't matter what we call\
    \ our tabs, as long as they match up.\n\nCheck out the sample file included as\
    \ `tabs.html`.\n\n## Code\n\n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n\
    \  <meta charset=\"utf-8\" />\n  <title>Joy of jQuery - UI Tabs</title>\n  <link\
    \ rel=\"stylesheet\" href=\"jquery-ui.css\" />\n  <script src=\"jquery-1.9.1.js\"\
    ></script>\n  <script src=\"jquery-ui.js\"></script>\n  <link rel=\"stylesheet\"\
    \ href=\"/resources/demos/style.css\" />\n  <script>\n    $(function() {\n   \
    \   $( \"#tabs\" ).tabs();\n    });\n  </script>\n</head>\n<body>\n  <h1>Sam's\
    \ Used Cars</h1>\n  <h2>2013 Rolls-Royce Phantom Drophead Coupe Base - $507,800</h2>\n\
    \  <div id=\"tabs\">\n    <ul>\n      <li><a href=\"#tabs-1\">Overview</a></li>\n\
    \      <li><a href=\"#tabs-2\">Photographs</a></li>\n      <li><a href=\"#tabs-3\"\
    >Finance Calculator</a></li>\n    </ul>\n    <div id=\"tabs-1\">\n      <p>Mileage:\
    \ 23<br>Body Style: Convertible<br>Exterior Color: Midnight Sapphire<br>Interior\
    \ Color: Seashell<br>Stock #: R177<br><br>Fuel: Gasoline<br>Engine: 6.8L V12 48V\
    \ GDI DOHC<br>Transmission: 8-Speed Automatic<br>Drivetrain: RWD<br>Doors: 2</p>\n\
    \    </div>\n    <div id=\"tabs-2\">\n      <img src=\"images/00021.jpeg\" alt=\"\
    photo\" />\n    </div>\n    <div id=\"tabs-3\">\n      <p>Finance Calculator content\
    \ here...</p>\n    </div>\n  </div>\n</body>\n</html>\n```\n\n## Other Widgets\n\
    \n### Accordion\n\nThere are many more widgets than the few shown, such as Accordion,\
    \ Spinner, and Tooltip—all follow the standard jQuery syntax of `$(selector).action()`.\n\
    \nThe accordion widget is a set of vertically collapsible headers. Each header\
    \ can be clicked to show or hide content.\n\n### Spinner\n\nThe spinner widget\
    \ allows users to select a value from a list by clicking arrows or typing.\n\n\
    ### Tooltip\n\nThe tooltip widget displays small popover messages when a user\
    \ hovers over an element.\n\n## Introduction\n\nThe accordion widget is a set\
    \ of vertically collapsible headers. Each header can be clicked to show or hide\
    \ content.\n\nThe spinner widget allows users to select a value from a list by\
    \ clicking arrows or typing.\n\nThe tooltip widget displays small popover messages\
    \ when a user hovers over an element.\n\n## Introduction\n\nThe accordion widget\
    \ is a set of vertically collapsible headers. Each header can be clicked to show\
    \ or hide content.\n\nThe spinner widget allows users to select a value from a\
    \ list by clicking arrows or typing.\n\nThe tooltip widget displays small popover\
    \ messages when a user hovers over an element.\n\n## Introduction\n\nThe accordion\
    \ widget is a set of vertically collapsible headers. Each header can be clicked\
    \ to show or hide content.\n\nThe spinner widget allows users to select a value\
    \ from a list by clicking arrows or typing.\n\nThe tooltip widget displays small\
    \ popover messages when a user hovers over an element.\n\n## Introduction\n\n\
    The accordion widget is a set of vertically collapsible headers. Each header can\
    \ be clicked to show or hide content.\n\nThe spinner widget allows users to select\
