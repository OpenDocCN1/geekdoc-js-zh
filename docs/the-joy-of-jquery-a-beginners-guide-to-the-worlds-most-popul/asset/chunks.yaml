    Lines 24 and 25 close the HTML.


    Auto-completing Text Fields


    Sometimes the range of possible values makes radio buttons or selects inappropriate
    or just awkward. A great solution is to offer a text box and suggest values as
    the user begins to type. Google has shown the power of this techniques as it suggests
    search terms as you type them.


    For instance, as I type the letters ''jq'' into the search box, Google automatically
    suggests what I am really looking for, which of course is jquery!


    ![](images/00013.jpeg)


    How could we add such a cool feature into our application? jQuery makes it easy!
    Consider the following example


