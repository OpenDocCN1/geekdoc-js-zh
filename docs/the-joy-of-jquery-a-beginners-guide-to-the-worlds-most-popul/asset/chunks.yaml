    I highly recommend that you get into the habit of putting declarations on their
    own line, and err on the side of readability. You''ll be glad you did.


    ## CSS Comments


    Speaking of readability, all proper programming languages support comments and
    CSS is no exception. Comments are used to explain your code, and are sure to help
    you when you edit the source code at a later date and can''t remember why you
    did something a certain way or what the intent of a particular rule was. (How''s
    that for a run-on?) Comments are ignored by browsers, but praised by users. Get
    in the comment habit too. :)


    A CSS comment begins with `/*`, and ends with `*/`, like this:


    ```css

    /*Here I set the default formatting for paragraphs*/

    p

    {

    text-align:center;

    color:black;

    font-family:Arial;

    }

    ```


    See how much easier to read that is?


    ## Specifying Fonts


    You may have noticed that many declarations mention fonts. The right font makes
    a significant difference in how a page looks. The `font-family` property can hold
    several font names at once and doing so is a best practice to ensure maximum compatibility.
    If the browser does not support the first font, it tries the next font, and so
    on.


    Start with the specific font you really want, and end with a generic font family
    you can live with. This approach will instruct the browser to pick a font in the
    generic family if the preferred fonts are not available.


    Example:


    ```css

    p{font-family:"Times New Roman", Times, serif}

    ```


    ## Using CSS to Position Elements


    ### Introduction to Positioning


    The CSS positioning properties allow you to precisely position an element on a
    page. It can place an element on top of another, beside another, and even specify
    what should happen if an element''s content is too big.


    Elements can be positioned using the `top`, `bottom`, `left`, and `right` properties.
    However, these properties will not work unless the `position` property is set
    first. These properties also work differently depending on the positioning method.


    There are four different positioning methods: Static, Fixed, Relative, and Absolute.


    ### Static Positioning


    HTML elements are positioned statically by default. A static positioned element
    is positioned on the page according to the “normal flow” of the page. In other
    words, when an element is static, it just goes with the flow. If you don''t specify
    an element''s position, then it is static.


    Static positioned elements are not affected by the `top`, `bottom`, `left`, and
    `right` properties.


    ### Fixed Positioning


    An element with a fixed position is positioned relative to the browser window.
    It will not move when the page is scrolled because it is not positioned relative
    to any other elements on the page.


    Here''s an example of fixed positioning:


    ```css

    p.fixed

    {

    position:fixed;

    top:25px;

    right:15px;

    }

    ```


    This style will select paragraphs with the class `fixed`. Fixed positioned elements
    are removed from the normal flow of things. All the other elements on the page
    behave as if fixed position elements simply do not exist.


    ### Relative Positioning


    A relative positioned element is positioned relative to where it would otherwise
    be if it were static. For instance, we could move an `h2` element left or right
    of its usual position by modifying its `left` position.


    For relatively positioned elements, the `left` property sets the left edge of
    an element to the left/right to its normal position.


    The following rule moves the `h2` elements left or right, depending on which class
    they belong to. For instance `<h2 class=''move_left''>`:


    ```css

    h2.move_left

    {

    position:relative;

    left:-30px;

    }


    h2.move_right

    {

    position:relative;

    left:30px;

    }

    ```


    The content of relatively positioned elements can be moved and can overlap other
    elements, but the space for the element is still preserved in the normal flow.


    ```css

    h2.pos_top

    {

    position:relative;

    top:-50px;

    }

    ```


    Relatively positioned elements are often used as container blocks for absolutely
    positioned elements.


    ### Absolute Positioning


    An absolute position element is positioned relative to the first parent element
    that has a position other than static. If no such element is found, the containing
    block is `<html>`.


    ```css

    h2

    {

    position:absolute;

    left:100px;

    top:150px;

    }

    ```


    Absolutely positioned elements are removed from the normal flow. The document
    and other elements behave as if absolutely positioned elements do not exist.


    Absolutely positioned elements can overlap other elements. Let''s discuss this
    next.


    ### Overlapping Elements


    When elements are positioned outside the normal flow, they can overlap other elements.
    When two elements overlap, how do you decide which element goes in front and which
    one goes in back? This is determined by a property called `z-index`. (I imagine
    that someone named Zachary came up with the term.)


    The `z-index` property specifies the “stack order” of an element. Think of a group
    of 3 blocks stacked on top of each other. The block at the top has the `z-index`
    of 3, and the block at the bottom would have the `z-index` of 1. Looking at the
    stack from above, the block on the top is the most visible, so you can think of
    that one as being at the front. The block on the bottom can be thought of as being
    at the back of the stack.


    An element can have a positive or negative stack order:


    ```css

    img

    {

    position:absolute;

    left:0px;

    top:0px;

    z-index:-1;

    }

    ```


    An element with higher `z-index` is placed in front of an element with a lower
    `z-index`.


    Note: If two positioned elements overlap, without a `z-index` specified, the element
    positioned last in the HTML code will be shown on top.


    ## jQuery Selectors


    ### What are jQuery selectors?


    The concept of jQuery selectors is one of the most important concepts that you
    need to master on truly understand the world of jQuery. OK, so what are jQuery
    selectors? Selectors use CSS syntax to select a page element or set of elements
    that you can perform an operation against.


    Understanding jQuery selectors is the key to using the library most effectively.
    The good news is that if you have worked with CSS before, you already know most
    of what follows.


    A jQuery statement typically follows the syntax:


    `$(selector).methodName()`


    The selector is a string expression that identifies the set of page elements that
    will be operated upon by the methods that follow the dot. This chapter will focus
    on the selector, while later chapters will focus on the methods.


    Many of the jQuery operations can also be strung together:


    `$(selector).method1().method2().method3()`


    As an example, let''s say that we want to hide the DOM element with the id value
    of `goAway` and to add class name `incognito`:


    `$("#goAway").hide().addClass("incognito")`


    ### What Does a jQuery Selector Return?


    When a jQuery selector is applied to a web page, what is really happening under
    the hood is that a complex JavaScript function is examining every element in the
    DOM. As each element is examined it is compared against the selector. Those DOM
    elements that match the selector are put aside into a ''special list'' containing
    only the matches. Once the entire document has been examined, the list of matching
    elements is “returned” so that it can be manipulated.


    As you are learning about jQuery-- and there are literally hundreds of resources
    where you may do this-- you may see this list of selected items referred to as
    the ''matched set'', the ''wrapped set'', or the ''result set''. They all mean
    the same thing-- that ''special list'' that was put aside as the elements in the
    DOM were compared against the selector.

