- fmt: "\nThe astute reader may have noticed the list item titled 'Feedback' has the\
    \ class `class=\"ui-state-disabled\"`. This prevents this item from being clicked.\
    \ Clever, isn't it? This is because Sam the car dealer doesn't really want your\
    \ feedback, he just wants your money. :)\n\n# jQuery Progressbar\n\n![](images/00019.jpeg)\n\
    \nOften it is helpful to display to the user the status of an operation. In the\
    \ case of Sam's Used Cars, perhaps Sam would like the user to have a sense of\
    \ how close they are to having the customer's car ready. A progress bar is a great\
    \ way to show this visually.\n\nA single jQuery statement does all the work.\n\
    \n```javascript\n$(function() {\n  $( \"#progressbar\").progressbar({value: 37});\n\
    });\n```\n\nAgain, this clearly demonstrates the incredible power of the jQuery\
    \ library. A lot of code is happening behind the scenes.\n\nRemember, the basic\
    \ jQuery syntax is `$(selector).action()`.\n\nThe line doing the work is `$( \"\
    #progressbar\").progressbar({value: 37});`. In this example we are selecting a\
    \ DIV with the ID of `progressbar` and telling jQuery to apply the `progressbar`\
    \ function to it. The `progressbar` function takes a parameter of `value` to specify\
    \ what percent of the bar should be filled in.\n\n## Sample Code\n\n```html\n\
    01. <!doctype html>\n02. <html lang=\"en\">\n03. <head>\n04. <title>jQuery UI\
    \ Progressbar - Default functionality</title>\n05. <link rel=\"stylesheet\" href=\"\
    http://code.jquery.com/ui/1.10.3/themes/smoothness/jquery-ui.css\" />\n06. <script\
    \ src=\"http://code.jquery.com/jquery-1.9.1.js\"></script>\n07. <script src=\"\
    http://code.jquery.com/ui/1.10.3/jquery-ui.js\"></script>\n08. <link rel=\"stylesheet\"\
    \ href=\"/resources/demos/style.css\" />\n09. <script>\n10. $(function() {\n11.\
    \ $( \"#progressbar\").progressbar({\n12. value: 37\n13. });\n14. });\n15. </script>\n\
    16. </head>\n17. <body>\n18. <h1>The Joy of jQuery: Sam's Used Cars</h1>\n19.\
    \ <p>Thank you for taking your car to Sam's Used Cars repair shop.</p>\n20. <p>Your\
    \ car is 37% repaired... In other words, we have successfully taken it apart.</p>\n\
    21. <div id=\"progressbar\"></div>\n22. </body>\n23. </html>\n```\n\nThe relevant\
    \ code for this widget can be found at line `11` and line `21`.\n\n# jQuery Slider\n\
    \nA slider control is used to allow the user to select a value without having\
    \ to type it in. Instead, the user simply drags a selector along a line. In the\
    \ right situation, a slider can be very slick deid, but you don't want to over\
    \ do it.\n\nIf you've ever been shopping for a used car then you know that the\
    \ first question you want answered as you approach a car is 'how much does this\
    \ car cost?'. Conversely, the first question the salesperson approaching you wants\
    \ to know is 'how much can you spend?'.\n\nThe salesperson will love the slider.\
    \ A slider is an easy way for visitors to Sam's Used Cars website to specify how\
    \ much they are willing to spend so that the appropriate cars can be displayed\
    \ to the customer. Here's how it could look:\n\n![](images/00020.jpeg)\n\nThe\
    \ code to produce the slider is (again) pretty easy. We create a `div` on the\
    \ form and give it a unique `id`, for example `'slider'`. In the jQuery document\
    \ ready event, we select the `div` and apply the `slider` method to it.\n\nThe\
    \ `slider` method takes a number of options, all of which are described at [http://api.jqueryui.com/slider/](http://api.jqueryui.com/slider/).\n\
    \nSome common options to the slider widget include: `value`, `min`, `max`, and\
    \ `increment`.\n\nOne important difference with this widget as compared with the\
    \ ones shown so far is that the slider widget has an important event that we need\
    \ to work with to make it useful. This is the `slide` event. The `slide` event\
    \ is triggered every time the slider control moves. The value provided in the\
    \ event as `ui.value` represents the value that the handle will have as a result\
    \ of the current movement. Canceling the event will prevent the handle from moving\
    \ and the handle will continue to have its previous value.\n\nFor example, as\
    \ the user moves the slider around, Sam might want the value displayed as 'You're\
    \ willing to pay $250 per month for your car' or something like that to make it\
    \ clear to the user the value that they have selected.\n\n## Code Sample\n\n```html\n\
    01. <!doctype html>\n02. <html lang=\"en\">\n03. <head>\n04. <meta charset=\"\
    utf-8\" />\n05. <title>Joy of jQuery - Slider</title>\n06. <link rel=\"stylesheet\"\
    \ href=\"jquery-ui.css\" />\n07. <script src=\"jquery-1.9.1.js\"></script>\n08.\
    \ <script src=\"jquery-ui.js\"></script>\n09. <link rel=\"stylesheet\" href=\"\
    /resources/demos/style.css\" />\n10. <script>\n11. $(function() {\n12. $( \"#slider\"\
    ).slider({\n13. value:200,\n14. min:100,\n15. max:500,\n16. step:25,\n17. slide:\
    \ function( event, ui ) {\n18. $( \"#amount\").val( \"$\" + ui.value );\n19. }\n\
    20. });\n21. $( \"#amount\").val( \"$\" + $(\"#slider\").slider( \"value\" ) );\n\
    22. });\n23. </script>\n24. </head>\n25. <body>\n26. <h1>The Joy of jQuery: Sam's\
    \ Used Cars</h1>\n27. <p>Used Cars</p>\n28. <p>First, how much can you spend?</p>\n\
    29. <div id=\"slider\"></div>\n30. <input type=\"text\" id=\"amount\" style=\"\
    border:0; font-weight:bold;\" />\n31. <p>This example shows specific increments,\
    \ in this case</p>\n32. <p>but you can change it to anything you want.</p>\n33.\
    \ </body>\n34. </html>\n```\n\nLines 1 - 10 are common on all widget examples\
    \ and no longer get a detailed explanation. They set up the page and reference\
    \ the required jQuery files.\n\nLines 10 - 23 are the most important ones in this\
    \ example will get the most attention. Line 10 begins a script block. Line 11\
    \ is the (now familiar) short version reference to the documentReady event. It\
    \ means 'do the following things once the document is sufficiently loaded into\
    \ the browser'.\n\nLine 12 follows the standard syntax of selector/action to select\
    \ the `div` with the id of `'slider'` and apply the `slider` method to it. The\
    \ `slider` method is defined in the jQuery library.\n\nThe line doing the work\
    \ is `$( \"#slider\").slider({value: 200, min:100, max:500, step:25});`. In this\
    \ example we are selecting a `div` with the ID of `slider` and telling jQuery\
    \ to transform it into a slider with an initial value of 200 (`value:200`), a\
    \ minimum value of 100, a maximum value of 500, and the value incremented with\
    \ each click as 25 (`step:25`).\n\nSo far so good, right?\n\nThe next part is\
    \ a little tricky, so I'll repeat the code here so you don't have to scroll back\
    \ up. Next we're going to concentrate on lines 17 – 22, but I'll show them in\
