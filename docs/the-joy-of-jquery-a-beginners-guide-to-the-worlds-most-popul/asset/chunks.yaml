    \ href=\"jquery-ui.css\" />\n<script src=\"jquery-1.9.1.js\"></script>\n<script>\n\
    $(document).ready(function(){\n    $(\"button\").click(function(){\n        var\
    \ Make = $('input[type=\"radio\"]:checked').val();\n        $.post(\"response.php\"\
    ,\n        {\n            Make: Make\n        },\n        function(data,status){\n\
    \            // alert(\"Data: \" + data + \"\\nStatus: \" + status);\n       \
    \     $(\"#deal\").html(data);\n        });\n    });\n});\n</script>\n</head>\n\
    <body>\n    <h1>Sam's Used Cars</h1>\n    <p>Sam wants to put you into a new (used)\
    \ car! Click on the button to learn about today's special:</p>\n    <p>\n    \
    \    <form method=\"post\">\n            <input type=\"radio\" name=\"Make\" value=\"\
    Ford\">Ford<br>\n            <input type=\"radio\" name=\"Make\" value=\"Dodge\"\
    >Dodge<br>\n            <input type=\"radio\" name=\"Make\" value=\"Honda\">Honda<br>\n\
    \        </form>\n    </p>\n    <div id=\"deal\" style=\"background-color:silver;\"\
    >\n        Today's Special\n    </div>\n    <br>\n    <button>Send an HTTP POST\
    \ request to a page and get the result back</button>\n</body>\n</html>\n```\n\n\
    AJAX in Client Side JavaScripting, so only your computer will see or process your\
    \ data input/output.\n\nThe first parameter of `$.post()` is the URL we wish to\
    \ request (`\"response.php\"`).\n\nThen we pass in some data to send along with\
    \ the request (`Make`).\n\nThe PHP script in `\"response.php\"` reads the parameters,\
    \ processes them, and returns a result.\n\nThe third parameter is a callback function.\
    \ The first callback parameter holds the content of the page requested, and the\
    \ second callback parameter holds the status of the request.\n\n**Tip:** Here\
    \ is how the PHP file looks like (`\"demo_test_post.asp\"`):\n\n```php\n<?php\n\
    $Make = $_POST['Make'] ;\n$Day = date(\"l\");\nswitch ($Make ) {\ncase \"Dodge\"\
    :\n    echo \"<h1>Dodge</h1>\";\n    echo \"<p>The perfect vehicles for families\
    \ on a budget. $Day is Dodge day at Sam's Used Cars.</p>\";\n    break;\ncase\
    \ \"Ford\":\n    echo \"<h1>Ford</h1>\";\n    echo \"<p>The Ford Explorer is America's\
    \ Favorite SUV. $Day is Ford day at Sam's Used Cars. </p>\";\n    break;\ncase\
    \ \"Honda\":\n    echo \"<h1>Honda</h1>\";\n    echo \"<p>$Day is Honda day at\
    \ Sam's Used Cars. Come on down...</p>\";\n    break;\ndefault:\n    echo \"<h1>$Make</h1>\"\
    ;\n    echo \"<p>$Day is your lucky day at Sam's Used Cars. If we don't have a\
    \ $Make we'll find one for you!</p>\";\n    break;\n}\n?>\n```\n\n## Alternate\
    \ AJAX Syntax - Load\n\n`load` is similar to Get but adds functionality which\
    \ allows you to define where in the document the returned data should go. Therefore\
    \ the `load` command is really only a good fit for those times when you know that\
    \ what you'll get back is a snippet of well-formed HTML which you want to put\
    \ someplace in your document.\n\nThe `load` command is a method which is associated\
    \ with a particular jQuery-wrapped element which you first select using a jQuery\
    \ selector. The pattern would be similar to:\n\n`$('#divWantingContent').load(...)`\n\
    \nAs an aside, it should be noted that the `get()`, `post()`, and `load()` commands\
    \ are really just “wrappers” for the more complicated (but more flexible) generic\
    \ `$.ajax()` command. In other words, when you call the `get` command what is\
    \ really happening is that the `.ajax()` command is being called with all the\
    \ parameters filled in for you automatically. We are not going to cover the more\
    \ generic `.ajax()` methods in this book, but if you find that neither `get`,\
    \ `post`, or `load` do exactly what you need it is certainly good to know that\
    \ jQuery provides even more flexible methods than these.\n\nHere is the syntax\
    \ for `load()` method:\n\n`[selector].load( URL, [data], [callback] );`\n\nHere\
    \ is a description of the parameters:\n\n- **URL**: The URL of the server-side\
    \ resource to which the request is sent. It could be a CGI, ASP, JSP, or PHP script\
    \ which generates data dynamically or out of a database.\n- **data**: This optional\
    \ parameter represents an object whose properties are serialized into properly\
    \ encoded parameters to be passed to the request. If specified, the request is\
    \ made using the `POST` method. If omitted, the `GET` method is used.\n- **callback**:\
    \ The function which will be executed after the response data has been loaded\
    \ into the elements of the matched set. The first parameter passed to this function\
    \ is the response text received from the server and second parameter is the status\
    \ code.\n\n### A Basic Example: Loading Simple Data\n\nLet's start with a basic\
    \ example. Imagine that Sam the used car dealer wants to have a page on his web\
    \ site that reveals the “deal of the day”.\n\n(Note: The provided text contains\
    \ significant repetition and structural mismatch between the HTML tags and the\
    \ descriptive text. The following is the cleaned representation based on the logic\
    \ provided in the source.)\n\nThe source text provided was a jumble of HTML line\
    \ numbers, and descriptions. I have extracted the core logic of the \"A Basic\
    \ Example: Loading Simple Data\" section's description:\n\nImagine that Sam the\
    \ used car dealer wants to have a page on his web site that reveals the “deal\
    \ of the day”. The `load` method replaces the HTML inside the div with the results\
    \ of the URL that was loaded.\n\n### A More Advanced Example: Loading Data and\
    \ Executing a Function\n\nThe optional callback parameter specifies a function\
    \ that will run when the `load()` method completes. The callback function can\
    \ take three parameters:\n\n- **responseText**: contains the text returned if\
    \ the load succeeds\n- **statusText**: contains the status of the call\n- **xhr**:\
    \ contains the XMLHttpRequest object\n\nThe following example modifies our earlier\
    \ example to display an alert box after the `load()` method completes. If the\
    \ `load()` method has succeed, it displays \"External content loaded successfully!\"\
    , and if it fails it displays an error message.\n\n```javascript\n$(document).ready(function(){\n\
    \    $(\"#driver\").click(function(){\n        $(\"#deal\").load(\"response.html\"\
    ,function(responseTxt,statusTxt,xhr){\n            if(statusTxt==\"success\")\n\
    \            alert(\"External content loaded successfully!\");\n            if(statusTxt==\"\
    error\")\n            alert(\"Error: \"+xhr.status+\": \"+xhr.statusText);\n \
    \       });\n    });\n});\n```\n"
