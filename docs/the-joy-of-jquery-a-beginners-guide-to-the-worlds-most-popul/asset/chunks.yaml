    我强烈建议你养成将声明单独写一行的习惯，并尽可能提高可读性。你会为这样做感到庆幸的。


    ## CSS 注释


    说到可读性，所有正规语言都支持注释，CSS 也不例外。注释用于解释你的代码，当你日后编辑源代码时，它们一定能帮助你——那时你可能忘记了为什么要以某种方式操作，或者某个特定规则的意图是什么。（这个长句写得怎么样？）。浏览器会忽略注释，但用户会赞赏它们。也养成写注释的习惯吧。:)


    CSS 注释以 `/*` 开始，以 `*/` 结束，如下所示：


    ```css

    /*在这里我设置了段落的默认格式*/

    p

    {

    text-align:center;

    color:black;

    font-family:Arial;

    }

    ```


    看这样读起来是不是容易得多？


    ## 指定字体


    你可能已经注意到很多声明都提到了字体。正确的字体会对页面的外观产生显著影响。`font-family` 属性可以同时包含多个字体名称，这样做是确保最大兼容性的最佳实践。如果浏览器不支持第一个字体，它会尝试下一个字体，依此类推。


    从你真正想要的特定字体开始，以你能够接受的通用字体族结束。这种方法将指示浏览器在首选字体可用时从通用字体族中选择一个字体。


    示例：


    ```css

    p{font-family:"Times New Roman", Times, serif}

    ```


    ## 使用 CSS 定位元素


    ### 定位简介


    CSS 定位属性允许你在页面上精确地定位元素。它可以将一个元素放置在另一个元素的上方、旁边，甚至指定当元素内容过大时应该发生什么。


    元素可以使用 `top`、`bottom`、`left` 和 `right` 属性进行定位。然而，除非先设置 `position` 属性，否则这些属性将不起作用。这些属性的作用也根据定位方法的不同而异。


    有四种定位方法：静态 (Static)、固定 (Fixed)、相对 (Relative) 和绝对 (Absolute)。


    ### 静态定位


    HTML 元素默认是静态定位的。静态定位的元素根据页面的“标准流”在页面上定位。换句话说，当一个元素是静态的时，它就顺流而。如果你没有指定元素的位置，它就是静态的。


    静态定位的元素不受 `top`、`bottom`、`left` 和 `right` 属性的影响。


    ### 固定定位


    固定位置的元素相对于浏览器窗口进行定位。当页面滚动时，它不会移动，因为它不是相对于页面上的任何其他元素进行定位。


    这是一个固定定位的示例：


    ```css

    p.fixed

    {

    position:fixed;

    top:25px;

    right:15px;

    }

    ```


    此样式将选择带有 `fixed` 类的段落。固定定位的元素从标准流中移除。页面上的所有其他元素表现就像固定定位元素不存在一样。


    ### 相对定位


    相对定位的元素相对于其如果是静态时所在的位置进行定位。例如，我们可以通过修改 `left` 位置将 `h2` 元素移动到其通常位置的左侧或右侧。


    对于相对定位的元素，`left` 属性将元素的左边缘相对于正常位置的左/右。


    以下规则根据元素所属的类将 `h2` 元素向左或向右移动。例如 `<h2 class=''move_left''>`：


    ```css

    h2.move_left

    {

    position:relative;

    left:-30px;

    }


    h2.move_right

    {

    position:relative;

    left:30px;

    }

    ```


    相对定位元素的内容可以移动并可能与其他元素重叠，但元素空间在标准流中仍然被保留。


    ```css

    h2.pos_top

    {

    position:relative;

    top:-50px;

    }

    ```


    相对定位元素经常被用作绝对定位元素的容器块。


    ### 绝对定位


    绝对定位元素元素相对于第一个非静态位置的父元素进行定位。如果没有找到此类元素，则包含块为 `<html>`。


    ```css

    h2

    {

    position:absolute;

    left:100px;

    top:150px;

    }

    ```


    绝对定位的元素从标准流中移除。文档和其他元素表现就像绝对定位元素不存在一样。


    绝对定位元素可以与其他元素重叠。我们接下来讨论这个。


    ### 元素重叠


    当元素定位在标准流之外时，它们可能会与其他元素重叠。当两个元素重叠时，你如何决定哪个元素在前，哪个元素在后？这由名为 `z-index` 的属性决定。（我猜是叫
    Zachary 的人想出的词。）


    `z-index` 属性指定了元素的“堆叠顺序”。想象一组 3 个堆叠在一起的块。最顶部的块 `z-index` 为 3，最底部的块 `z-index` 将为
    1。从上方观察堆叠层，顶部的块最可见，所以你可以认为它在前面。底部的块可以被认为在堆叠的后面。


    元素可以有一个正或负的堆叠顺序：


    ```css

    img

    {

    position:absolute;

    left:0px;

    top:0px;

    z-index:-1;

    }

    ```


    `z-index` 较大的元素位于 `z-index` 较小的元素前面。注意：如果两个元素重叠且没有指定 `z-index`， HTML 代码中后定义的元素将显示上方。


    ## jQuery 选择器


    ### 什么是 jQuery 选择器


    jQuery 选择器的概念是真正理解 jQuery 世界的最重要的概念之一。那么，什么是 jQuery 选择器？选择器使用 CSS 语法来选择元素或元素集，以便对其执行操作。


    理解 jQuery 选择器是有效使用该库的关键。好消息是，如果你以前用过 CSS，你已经知道了大部分内容。


    一个 jQuery 语句通常遵循语法：


    `$(selector).methodName()`


    选择器是一个表达式，用于标识后续方法操作的元素集。本章将关注选择器，而后续章节将关注方法。


    许多 jQuery 操作也可以组合：


    `$(selector).method1().method2().method3()`


    作为一个示例，假设我们想要隐藏 ID 为 `goAway` 的 DOM 元素并添加类 `incognito`：


    `$("#goAway").hide().addClass("incognito")`


    ### jQuery 选择器返回什么


    当 jQuery 选择器应用于 Web 页面时，底层发生的是一个复杂的 JavaScript 函数正在检查 DOM 中的每个元素。在检查每个元素时，它都会与选择器进行比较。匹配选择器的
    DOM 元素被放入一个只包含匹配项的“特殊列表”。当整个文档检查完成后，该匹配元素列表将被“返回”，以便进行操作。


    当你学习 jQuery 时——你有成百千千的资源可以这样做——你可能会看到被选项目列表被称为“匹配集”(matched set)、“包装集”(wrapped
    set) 或“结果集”(result set)。它们都是同一个意思——即在 DOM 元素与选择器进行比较时被放入的那个“特殊列表”。


    '
- fmt: '

    Personally, I prefer the term ''result set'' because it is consistent with the
    idea that the selector is basically running a query against the document and sending
    back a result. But just because I like the term result set doesn''t mean I should
    set you up for confusion later. Understand that the terms are interchangeable
    and mean exactly the same thing. I may mix it up here and there as we go along,
    just to help keep you awake.


    # Types of jQuery selectors


    There are three categories of jQuery selectors: Basic CSS selectors, Positional
    selectors, and Custom jQuery selectors. The Basic Selectors are known as "find
    selectors" as they are used to find elements within the DOM. The Positional and
    Custom Selectors are "filter selectors" as they filter (or fine-tune) a set of
    elements.


    ## Basic CSS Selectors


    The following jQuery selectors follow standard CSS3 syntax for selectors. Any
    variation of the selectors below could be used as the selector parameter for the
    jQuery command of


    ```javascript

    $(selector).methodName();

    ```


    ### Real-life Examples of Selectors


    - `$("p")` selects all the `<p>` elements

    - `$("h1")` selects all the `<h1>` elements

    - `$("div a")` selects all the anchor tag (`<a>`) elements within `<div>` elements

    - `$("p>div")` selects all `<div>` elements that are direct children of `<p>`
    elements

    - `$("div~h2")` selects all `<div>` elements that are preceded by a `<h2>` element

    - `$("p:has(b)")` selects all the paragraph elements that contain some bold text.

    - `$("div.className")` selects all `<div>` elements with a class name of `className`.

    - `$(".className ")` selects all the elements with class name of `className`.

    - `$("#IDvalue")` selects the element with the id value of `IDvalue`.

    - `$("img[alt]")` selects all the images (`<img>` elements) that have an `alt`
    attribute.

    - `$("a[href$=.pdf]")` selects all the anchors that link to a PDF file. It selects
    all the `<a>` elements with an `href` attribute that ends with `.pdf`.


    You can practice with jQuery selectors by visiting [http://www.w3schools.com/jquery/trysel.asp?filename=trysel_basic&jqsel=p.intro,%23choose](http://www.w3schools.com/jquery/trysel.asp?filename=trysel_basic&jqsel=p.intro,%23choose)


    ## Multiple Selectors


    Multiple selectors can be combined into a single statement if you separate them
    with commas. For example, the selector `$("ul,ol")` will select all the list (`<ul>`
    and `<ol>`) elements.


    ## Positional Selectors


    Positional selectors select elements based upon the positional relationships between
    the elements. These selectors can be appended to any base selector (which we"ll
    denote as `BaseSelector`) to filter the matches based upon position. If the base
    selector is omitted, it is assumed to be `*` (all the elements).


    ### Example Positional Selectors Syntax


    - `BaseSelector:first`: Selects the first element on the page matching the base
    selector.

    - `BaseSelector:last`: Selects the last element on the page matching the base
    selector.

    - `BaseSelector:first-child`: Selects all elements matching the base selector
    that are first children.

    - `BaseSelector:last-child`: Selects all elements matching the base selector that
    are last children.

    - `BaseSelector:only-child`: Selects all elements matching the base selector that
    are only children.

    - `BaseSelector:nth-child(n)`: Selects all elements matching the base selector
    that are n-th ordinal children. Counting starts at 1.

    - `BaseSelector:nth-child(odd|even)`: Selects all elements matching the base selector
    that are even or odd ordinal children. The first child is considered odd (counting
    starts at 1).

    - `BaseSelector:even`: Selects the even elements matching the base selector.

    - `BaseSelector:odd`: Selects the odd elements matching the base selector.

    - `BaseSelector:eq(n)`: Selects the n-th element within the set of elements matching
    the base selector. Counting starts at 0.

    - `BaseSelector:gt(n)`: Selects elements matching the base selector that that
    are greater than the n-th element (exclusive). Counting starts at 0.

    - `BaseSelector:lt(n)`: Selects elements matching the base selector that that
    are less than the n-th element (exclusive). Counting starts at 0.


    ### Real-life Examples


    - `$("p:first")` selects the first paragraph on the page.

    - `$("img[src$=.png]:first")` selects the first `<img>` element on the page that
    has a `src` attribute ending in `.png`

    - `$("button.small:last")` selects the last `<button>` element on the page that
    has a class name of `small`

    - `$("li:first-child")` selects all `<li>` elements that are first children within
    their lists

    - `$("a:only-child")` selects all `<a>` elements that are the only element within
    their parent

    - `$("li:nth-child(2)")` selects all `<li>` elements that are the second item
    within their lists

    - `$("tr:nth-child(odd)")` selects all odd `<tr>` elements within a table

    - `$("div:nth-child(5n)")` selects every 5th `<div>` element

    - `$("div:nth-child(5n+1)")` selects the element after every 5th `<div>` element

    - `$(".someClass:eq(1)")` selects the second element with a class name of `someClass`

    - `$(".someClass:gt(1)")` selects all but the first two elements with a class
    name of `someClass`

    - `$(".someClass:lt(4)")` selects the first four elements with a class name of
    `someClass`


    Note that the `:nth-child` selectors begin counting at 1, while most jQuery selectors,
    such as `:eq`, `:gt` and `:lt` begin with 0.


    ## jQuery Custom Selectors


    These selectors are provided by jQuery to allow for commonly used, or plain handy,
    selections were not anticipated by the CSS Specification. Like the Positional
    Selectors, these selectors filter a base matching (which we denote as `B`). Omitting
    `B` is interpreted as the set of all elements. These selectors may be combined;
    see the examples for some selector combinations.


    - `BaseSelector:enabled`: Selects elements matching the base selector that are
    in the enabled state.

    - `BaseSelector:button`: Selects elements matching the base selector that are
    of any button type.

    - `BaseSelector:input`: Selects elements matching the base selector that are input
    controls-- such as `<input>`, `<select>`, `<textarea>` and `<button>` elements.

    - `BaseSelector:checkbox`: Selects elements matching the base selector that are
    the input type checkbox. For example this selector would select `<input type="checkbox"
    name="colors">`.

    - `BaseSelector:image`: Selects elements matching the base selector that are of
    the input type image.

    - `BaseSelector:file`: Selects elements matching the base selector that are of
    the input type file.

    - `BaseSelector:radio`: Selects elements matching the base selector that are of
    `input[type=radio]`.

    - `BaseSelector:text`: Selects elements matching the base selector that are of
    the input type text.

    - `BaseSelector:password`: Selects elements matching the base selector that are
    of the input type password.

    - `BaseSelector:submit`: Selects elements matching the base selector that are
    either of `input type=submit` or `button type=submit`.

    - `BaseSelector:reset`: Selects elements matching the base selector that are of
    `input[type=reset]` or `button[type=reset]`.

    - `BaseSelector:hidden`: Selects elements matching the base selector that are
    hidden.

    - `BaseSelector:header`: Selects elements matching the base selector that are
    headers `<h1>` through `<h6>`.

    - `BaseSelector:not(f)`: Selects elements matching the base selector that do not
    match the filter selector specified by `not()`. A filter selector is any selector
    beginning with a colon(:)

    - `BaseSelector:parent`: Selects elements matching the base selector that are
    parents of non-empty children.

    - `BaseSelector:selected`: Selects elements matching the base selector that are
    in the selected state. Only `<option>` elements may posses this state.

    - `BaseSelector:animated`: Selects elements matching the base selector that are
    currently under animated control via one of the jQuery animation methods.

    - `BaseSelector:visible`: Selects elements matching the base selector that are
    not hidden.

