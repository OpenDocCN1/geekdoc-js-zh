    ```


    ### Lists


    There are two kinds of lists— ordered and unordered. An ordered list is numbered,
    such as 1, 2, 3, while an unordered list is a list of bullet items. There are
    tags to start and stop the list, and tags for each item in the list.


    An ordered list starts with the `<ol>` tag. An unordered list starts with the
    `<<ul>>` tag. Each list item, regardless of list type, starts with the `<li>`
    tag and ends with `</li>`.


    ```html

    <ul>

    <li>Coffee</li>

    <li>Milk</li>

    </ul>

    ```

