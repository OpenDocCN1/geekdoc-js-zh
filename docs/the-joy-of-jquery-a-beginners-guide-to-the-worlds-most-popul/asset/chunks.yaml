    第 5 行对我们来说是新的。它告诉浏览器“视口”（在移动设备上可见的页面部分）宽度应该与设备宽度相同，初始缩比例为 `1`。简而言之，对于 99% 的 jQuery
    移动页面，你可以直接使用这一行。如果没有这一行，移动浏览器将尝试缩放文档，看起来会很糟糕。


    ![](img/00024.jpeg)


    ```html

    6. <meta http-equiv="content-type" content="text/html; charset=utf-8" />

