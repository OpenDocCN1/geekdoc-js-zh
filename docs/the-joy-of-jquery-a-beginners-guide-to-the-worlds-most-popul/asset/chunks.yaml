    Not all elements have both an opening and closing piece. For example, `<br>` doesn''t
    have a corresponding `</br>`, and neither does `<hr>`. The `<hr>` tag inserts
    a horizontal rule (line) and the `<br>` tag inserts a new line.


    ## Required tags


    An HTML page starts with the `<html>` tag and ends with `</html>`. The body of
    the page goes inside `body` tags.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>This is my first paragraph.</p>

    </body>

    </html>

    ```


    ### DocType


    If a webpage is missing a `<DOCTYPE>` tag or has some sort of “transitional” doctype
    tag, the page will be rendered in what is called ''quirks'' mode. Quirks mode
    is somewhat unpredictable, and you don''t always get what you expect.


    So, it is important to have a doctype tag if you want your web page to display
    in Standards mode, as expected. For simplicity, however, the examples in the book
    will skip this.


    ### Head


    The head of the document is where the `Title` and `Meta` information will go.
    Generally, you would also put any CSS styles, script tags, and link tags to external
    files in the Head also, if you have any.


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>

    This is the title of the page.

    </title>

    </head>

    <body>

    The body text goes here.

    </body>

    </html>

    ```


    ## Optional Tags


    ### Meta Tags


    The `Meta` tag, along with the `link` tag, are unique in that they are the only
    HTML tags that require neither a closing tag nor a closing `/` at the end of the
    tag and are still considered syntactically correct.


    The other thing about meta tags is that they are the only tag that, generally
    speaking, has no effect on the layout or processing of the page; they are used
    to give information about the page and/or site being viewed. The `meta` tag is
    essentially a key/value pair, and each tag can only contain one pair of values.
    Meta tags are used primarily by search engines.


    ## Useful Tags


    ### Headers


    Headers are used to organize information into hierarchical groupings.


    ```html

    <h1>Heading1</h1>

    <h2>Heading2</h2>

    <h3>Heading3</h3>

    <h4>Heading4</h4>

    <h5>Heading5</h5>

    <h6>Heading6</h6>

    ```


    Header tags are block-level elements, meaning they take up an entire line by themselves,
    and no other markup is allowed inside heading tags.


    ### DIV


    The `DIV` tag is one you can use to create a logical division within your document.
    `DIV`s work with CSS, and allow you to write CSS rules that specify how the text
    within the `DIV` should be formatted.


    ### Images/Picture


    To add an image to your document, you use the “image” tag. To insert an image
    into your html document use the following syntax:


    ```html

    <img src="smiley.gif" alt="Smiley face">

    ```


    The value that you put in the `src=` attribute can either specify a graphic that
    is on the local file system, or you can specify a full URL which retrieves the
    image from somewhere else on the Internet.


    ### Links


    A link takes a user to another place when they click on it. The link can be to
    a specific part of the open document or to a new page entirely.


    Takes the user to a new page.

    ```html

    <a href="http://www.joyofphp.com">Visit Joy of PHP!</a>

    ```


