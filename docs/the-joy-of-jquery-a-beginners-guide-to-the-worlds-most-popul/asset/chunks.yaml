    \nMicrosoft: [`www.asp.net/ajaxlibrary/CDNjQueryUI1910.ashx`](http://www.asp.net/ajaxlibrary/CDNjQueryUI1910.ashx)\n\
    \nGoogle: http://www.devcurry.com/2010/05/latest-jquery-and-jquery-ui-theme-links.html\n\
    \n引用 jQuery UI\n\n现在你已经有了主题，是时候开始为你的网站添加 `jQuery UI` 了。如上所述，你需要引用这些库和 `CSS` 文件。在你的\
    \ `<head>` 标签中，你需要添加以下内容：\n\n```html\n<head>\n<script src=\"http://code.jquery.com/jquery-1.9.1.js\"\
    ></script>\n<script src=\"http://code.jquery.com/ui/1.10.3/jquery-ui.js\"></script>\n\
    <script src=\"js/jquery-ui-1.10.3.custom.js\"></script>\n</head>\n```\n\n第一个引用是\
    \ `jQuery` 库的 `<script>` 引用。第二个 `<script>` 引用是 `jQuery UI` 库的。第三个也是最后一个 `<script>`\
    \ 引用是添加主题的 `jQuery UI` `CSS` 文件。前两个 `<script>` 引用是让 `jQuery UI` 运行所必需的。你不一定要有主题，但如果没有主题，UI\
    \ 看起来会很单调。\n\n现在我们已经添加了 `jQuery UI` 的适当链接，现在可以添加一些小部件和其他项目了。让我们添加一个日历小部件。在 `<head>`\
