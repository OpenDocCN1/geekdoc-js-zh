    in the document the returned data should go. Therefore the load command is really
    only a good fit for those times when you know that what you''ll get back is a
    snippet of well-formed HTML which you want to put someplace in your document.


    The load command is a method which is associated with a particular jQuery-wrapped
    element which you first select using a jQuery selector. The pattern would be similar
    to:


    $(''#divWantingContent'').load(...)


    As an aside, it should be noted that the get(), post(), and load() commands are
    really just “wrappers” for the more complicated (but more flexible) generic $.ajax()
    command. In other words, when you call the get command what is really happening
    is that the .ajax() command is being called with all the parameters filled in
    for you automatically. We are not going to cover the more generic .ajax() methods
    in this book, but if you find that neither get, post, or load do exactly what
    you need it is certainly good to know that jQuery provides even more flexible
    methods than these.


    Here is the syntax for load() method:


    [selector].load( URL, [data], [callback] );


    Here is a description of the parameters:


    URL: The URL of the server-side resource to which the request is sent. It could
    be a CGI, ASP, JSP, or PHP script which generates data dynamically or out of a
    database.


    data: This optional parameter represents an object whose properties are serialized
    into properly encoded parameters to be passed to the request. If specified, the
    request is made using the POST method. If omitted, the GET method is used.


    callback: The function which will be executed after the response data has been
    loaded into the elements of the matched set. The first parameter passed to this
    function is the response text received from the server and second parameter is
    the status code.


    A Basic Example: Loading Simple Data


    Let''s start with a basic example. Imagine that Sam the used car dealer wants
    to have a page on his web site that reveals the “deal of the day” when visitors
    click a button. The page is set up with a div with the id of ''deal'' which for
    convenience has a gray background.


    Under the div is a button labeled ''Today''s Special''. When you click the button,
    the contents of the deal div will be replaced with the content of a separate HTML
    that contains the details of the deal.


    ![](images/00032.jpeg)


    Clicking the button will reveal the deal, such as:


    ![](images/00033.jpeg)


