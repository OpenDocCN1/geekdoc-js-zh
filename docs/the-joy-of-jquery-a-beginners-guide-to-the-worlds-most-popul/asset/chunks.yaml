    24\. </head>


    Line 17 is different from the earlier options because instead of passing a simple
    value such as max:500, we are going to instead handle the slide event. An event
    is something that happens, such as when a button is clicked. In this case, the
    slide event occurs when the slider slides. We are going to pass the slide option
    a function, as shown:


    slide: function( event, ui ) {


    $( "#amount" ).val( "$" + ui.value );


    }


    In other words, when the slide event occurs, we are going to perform the following
    function:


    $( "#amount" ).val( "$" + ui.value );


    The astute reader (and by this I mean you) will notice that the function used
    to handle the slide event of the slider control itself uses jQuery!


    The function handling the slide event of the slider control follows the standard
    jQuery syntax of $(selector).action()


    The function performs the following action: Select the thing with the ID of ''amount''
    and set its value to the dollar symbol and the current value of the slider control.
    I circled it in red below, so you can see what happens when the user drags the
    slider to the 225 mark.


    ![](images/00021.jpeg)


    The rest of the code is standard HTML and I''ll skip explaining it. You can play
    with it using the included file slider.html.


    jQuery Tabs


    Tabs are a great way to group related information so that the page doesn''t seem
    overwhelming to the user and to make it easier to find the information you are
    looking for.


    In the case of a web site for a used car business, you might not want a long page
    full of information but rather to group related entries such as Overview, Photographs,
    and Finance Calculator, as shown below:


    ![](images/00022.jpeg)


    The tab control works very much like the menu control. You start off with an unordered
    list, then transform it into something else with the magic of jQuery. Here''s
    the relevant HTML snippet used to create the page shown above:


    <div id="tabs">


    <ul>


    <li><a href="#tabs-1">Overview</a></li>


    <li><a href="#tabs-2">Photographs</a></li>


    <li><a href="#tabs-3">Finance Calculator</a></li>


    </ul>


    <div id="tabs-1">


    <p>Mileage: 23<br>Body Style: Convertible<br>Exterior Color: Midnight


    Sapphire<br>Interior Color: Seashell<br>Stock #: R177<br>


    <br>Fuel: Gasoline<br>Engine: 6.8L V12 48V GDI DOHC<br>Transmission: 8-Speed


    Automatic<br>Drivetrain: RWD<br>Doors: 2</p>


    </div>


    The jQuery code required is almost ridiculously simple:


    $(function() {


    $( "#tabs" ).tabs();


    });


    To put content inside the tab where you want it to go, create a div with an id
    which matches the href target of the list. For example, in the code that follows
    note that the string ''tabs-1'' is common in both yellow highlights. This is what
    links the tab to the content.


    <div id="tabs">


    <ul>


    <li><a href="#tabs-1">Overview</a></li>


    <li><a href="#tabs-2">Photographs</a></li>


    <li><a href="#tabs-3">Finance Calculator</a></li>


    </ul>


    <div id="tabs-1">


    <p>Mileage: 23<br>Body Style: Convertible<br>Exterior Color: Midnight


    Sapphire<br>Interior Color: Seashell<br>Stock #: R177<br>


    <br>Fuel: Gasoline<br>Engine: 6.8L V12 48V GDI DOHC<br>Transmission: 8-Speed


    Automatic<br>Drivetrain: RWD<br>Doors: 2</p>


    </div>


    What we have done is specified that the tab with the label of Overview will contain
    the content which is specified in the div with the id of ''tabs-1''. It really
    doesn''t matter what we call our tabs, as long as they match up.


    Check out the sample file included as tabs.html.


    Code


    <!doctype html>


    <html lang="en">


    <head>


    <meta charset="utf-8" />


    <title>Joy of jQuery - UI Tabs</title>


    <link rel="stylesheet" href="jquery-ui.css" />


    <script src="jquery-1.9.1.js"></script>


    <script src="jquery-ui.js"></script>


    <link rel="stylesheet" href="/resources/demos/style.css" />


    <script>


    $(function() {


    $( "#tabs" ).tabs();


    });


    </script>


    </head>


    <body>


    <h1>Sam''s Used Cars</h1>


    <h2>2013 Rolls-Royce Phantom Drophead Coupe Base - $507,800


    </h2>


    <div id="tabs">


    <ul>


    <li><a href="#tabs-1">Overview</a></li>


    <li><a href="#tabs-2">Photographs</a></li>


    <li><a href="#tabs-3">Finance Calculator</a></li>


    </ul>


    <div id="tabs-1">


    <p>Mileage: 23<br>Body Style: Convertible<br>Exterior Color: Midnight


    Sapphire<br>Interior Color: Seashell<br>Stock #: R177<br>


    <br>Fuel: Gasoline<br>Engine: 6.8L V12 48V GDI DOHC<br>Transmission: 8-Speed


    Automatic<br>Drivetrain: RWD<br>Doors: 2</p>


    </div>


    <div id="tabs-2">


    <p><img alt="Rolls Royce Interior" height="266" src="Rolls.jpg" width="400"></p>


    </div>


    <div id="tabs-3">


    <p>Seriously.&nbsp; If you have to ask, you can''t afford this one. </p>


    </div>


    </div>


    </body>


    </html>


    Other Widgets


    Obviously, there are many more jQuery UI widgets than the few shown here--such
    as the official widgets of Accordian, Spinner and Tooltip--but they all work in
    a consistent way, which is $(selector).action()


    The basic jQuery syntax, even for UI widgets, is $(selector).action()


    jQuery Mobile


    Introduction


    At the risk of stating the obvious, mobile devices are extremely popular and thus
    very important to web developers. jQuery Mobile is an HTML 5 based toolkit built
    on top of jQuery that makes it extremely easy to build web pages that are optimized
    for mobile users.


    It looks great on iOS and Android, and other mobile devices. The nice thing is
    that jQuery Mobile looks great on all these devices and you don''t need to write
    code for each specific device.


    Getting Started


    Links to jQuery Mobile CDN


    Copy-and-Paste Snippet for CDN-hosted files (recommended):


    <link rel="stylesheet" href="http://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.css"
    />


    <script src="http://code.jquery.com/jquery-1.9.1.min.js"></script>


    <script src="http://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.js"></script>


    Hello (mobile) World!


    Here''s an example of a very basic jQuery Mobile page, in the tradition of the
    classic ''Hello World'' example:


    ![](images/00023.jpeg)


    Hello (mobile) World Source Code


    Here''s the code that produced the above screen shot. You can find the source
    code for this file in the jQuery Mobile folder as 1-hello-mobile-world.html


    1\. <!DOCTYPE html>


    2\. <html>


    3\. <head>


    4\. <title>Joy of jQuery</title>


    5\. <meta name="viewport" content="width=device-width, initial-scale=1" />


    6\. <meta http-equiv="content-type" content="text/html; charset=utf-8" />


    7\. <link rel="stylesheet" href="http://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.css"
    />


    8\. <script src="http://code.jquery.com/jquery-1.9.1.min.js"></script>


    9\. <script src="http://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.js"></script>


    10\. </head>


    11\. <body>


    12.


    13\. <div data-role="page">


    14.


    15\. <div data-role="header">


    16\. <h1>Joy of jQuery</h1>


    17\. </div><!-- /header -->


    18.


    19\. <div data-role="content">


    20\. <p>Hello world</p>


    21\. </div><!-- /content -->


    22.


    23\. </div><!-- /page -->


    24.


    25\. </body>


    26\. </html>


    The first thing to notice is on line 1 -- <!DOCTYPE html>. jQuery mobile is based
    on HTML 5 and that means that you have to declare the doc type. You''ll also see
    a number of DIVs with various roles defined, such as data-role=”page” or data=role=”header”.
    This is how you define the various elements on a jQuery mobile page. Let''s look
    in more detail.


    1\. <!DOCTYPE html>


    2\. <html>


    3\. <head>


    4\. <title>Joy of jQuery</title>


    5\. <meta name="viewport" content="width=device-width, initial-scale=1" />


    Line 1 specifies the document type,and this line is required for jQuery mobile
    applications. Line 2 begins the html, and Line 3 begins the head section of the
    document.


    Line 4 is the document title, and this would appear in the browsers title bar
    and is also used by search engines. So far, we have entered only standard html.'
