    jQuery Progressbar


    ![](images/00019.jpeg)


    Often it is helpful to display to the user the status of an operation. In the
    case of Sam''s Used Cars, perhaps Sam would like to user to have a sense of how
    close they are to having the customer''s car ready. A progress bar is a great
    way to show this visually.


    A single jQuery statement does all the work.


    <script>


    $(function() {


    $( "#progressbar" ).progressbar({value: 37});


    });


    </script>


    Again, this clearly demonstrates the incredible power of the jQuery library. A
    lot of code is happening behind the scenes.


    Remember, the basic jQuery syntax is $(selector).action()


    The line doing the work is $( "#progressbar" ).progressbar({value: 37}); In this
    example we are selecting a DIV with the ID of progressbar and telling jQuery to
    apply the progressbar function to it. The progressbar function takes a parameter
    of value to specify what percent of the bar should be filled in.


    Here''s a full example


