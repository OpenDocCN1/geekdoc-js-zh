    <tr>

    <td>row 1</td>

    <td>row 2</td>

    </tr>

    </table>

    ```


    ### HTML Table Headers


    Headers in a table are defined with the `<th>` tag.


    ```html

    <table border="1">

    <tr>

    <th>Header 1</th>

    <th>Header 2</th>

    </tr>

    </table>

    ```

