    Line 5 is new for us. It tells the browser that the “viewport” (the part of the
    page that is visible on the mobile device) should be as wide as the device width
    with an initial scale of `1`. In short, you can take this line as is for 99% of
    your jQuery mobile pages. Without this line, the mobile browser will try to scale
    the document and it will look bad.


    ![](images/00024.jpeg)


    ```html

    6. <meta http-equiv="content-type" content="text/html; charset=utf-8" />

    7. <link rel="stylesheet" href="http://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.css"
    />

    8. <script src="http://code.jquery.com/jquery-1.9.1.min.js"></script>

    9. <script src="http://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.js"></script>

    ```


    Line 6 is another one of those required ones. jQuery Mobile likes to know the
    character set. Just put it in all your mobile pages, and don''t worry about it.


    Line 7 is a link to the jQuery mobile style sheet. Line 8 is a reference to the
    jQuery library, and finally line 9 is a reference to the jQuery mobile library.
    Note that you must include the jQuery mobile library AFTER you enter the jQuery
    library, because one relies on the other.


    You must enter the reference to jQuery mobile after referencing jQuery. jQuery
    mobile extends jQuery so jQuery must be loaded first in the document.


    ```html

    10. </head>

    11. <body>

    12.

    13. <div data-role="page">

    14.

    15. <div data-role="header">

    16. <h1>Joy of jQuery</h1>

    17. </div> <!-- /header -->

    18.

    19. <div data-role="content">

    20. <p>Hello world</p>

    21. </div> <!-- /content -->

    22.

    23. </div> <!-- /page -->

    24.

    25. </body>

    26. </html>

    ```


    Line 13 is the start of a `DIV` that ends on Line 23. Notice that the `DIV`s in
    the document all contain an attribute called `data-role`. The `data-role` tells
    jquery mobile how the particular `DIV` should be formatted. The jQuery Mobile
    framework uses HTML5 `data-` attributes to allow for markup-based initialization
    and configuration of widgets.


    There are many types of data roles, but in the interest of keeping this first
    page simple we have limited our data-roles to `page`, `header`, and `content`.


    ## jQuery Mobile Theming


    The default theme includes 5 swatches are given letters (a, b, c, d, e) for quick
    reference. This makes things super easy. To make mapping of color swatches consistent
    across widgets, the jQuery team followed the convention that swatch "a" is the
    highest level of visual priority (black in our default theme), "b" is secondary
    level (blue) and "c" is the baseline level (gray) that we use by default in many
    situations, "d" for an alternate secondary level and "e" as an accent swatch.


    ![](images/00025.jpeg)


    Using a specific swatch is super easy. For instance, if I wanted to modify the
    ''hello mobile world'' example to use the “b” theme in the header bar, I would
    make the following code change:


    ```html

    <div data-role="header" data-theme="b">

    ```


    You can put the `data-theme` element in any jQuery `div` with a `data-role` and
    it will be themed appropriately. Thus it follows that to change the look of the
    content area one would do this:


    ```html

    <div data-role="content" data-theme="b">

    ```


    ### Exercise


    Try experimenting by putting the `data-theme` attribute to different sections
    of the page. You''ll see that get different results depending on where you apply
    it. See if you can get it to look like this:


    ![](images/00026.jpeg)


    ## How to test your Mobile Pages


    You may have noticed that examples used in the book all have a web address that
    starts with an IP address of 192.186.... That''s because when I work on mobile
    web pages, I put them under the `WAMP` folder on my laptop computer. `WAMP` (for
    those of you who haven''t read my ''[Joy of PHP](http://www.amazon.com/The-Joy-PHP-Programming-Applications-ebook/dp/B00BALXN70/r)''
    or worked with `WAMP` before, it''s a super-easy (and free) web server you can
    install on just about any computer and it can host pages like this easily. Just
    Google ''download WAMP'' and you''ll find it.


    My laptop is not accessible over the Internet, but it is accessible to other computers
    (and mobile devices) on the same local network (i.e., sharing the WIFI in my house).
    So I just found the IP address of my laptop (on Windows choose Run, `CMD`, `ipConfig`)
    and entered that address into the address bar on my iPod.


    ![](images/00027.jpeg)


    No doubt a similar method exists for those readers using the superior Apple platform,
    but that''s the concept. :)


    ## A More Advanced Example with UI elements and multiple pages


