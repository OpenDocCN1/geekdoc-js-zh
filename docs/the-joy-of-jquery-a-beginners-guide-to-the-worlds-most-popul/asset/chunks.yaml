    #datepicker\").datepicker();\n});\n</script>\n```\n\n在 body 标签中，我们添加这些：\n\n```html\n\
    <p>Date: <input id=\"datepicker\" type=\"text\"></p>\n```\n\n这段代码的作用是将 `\"datepicker\"\
    ` 小部件挂载到 `<input>` 框上。让我们在下一节中更详细地检查它。\n\n### Date Picker\n\nWeb 表单上的常见需求是让用户输入日期。在原生\
    \ HTML 中，唯一的选择是给用户一个文本字段，并希望他们输入有效的日期。\n\n![](img/00011.jpeg)\n\n`jQuery` 日期字段让用户输入日期变得简单。日期选择器修改了标准表单输入字段的行为。只需聚焦输入字段（点击或使用\
    \ tab 键），一个交互式日历就会神奇地出现。选择一个日期，选中的日期将显示为输入框的值。\n\n![](img/00012.jpeg)\n\n### Code\n\
    \n```html\n01 <!doctype html>\n02\n03 <html lang=\"en\">\n04 <head>\n05 <meta\
    \ charset=\"utf-8\" />\n06 <title>jQuery UI Datepicker - Default functionality</title>\n\
    07 <link rel=\"stylesheet\" href=\"jquery-ui.css\" />\n08 <script src=\"jquery-1.9.1.js\"\
    ></script>\n09 <script src=\"jquery-ui.js\"></script>\n10\n11 <script>\n12 $(function()\
    \ {\n13 $( \"#datepicker\" ).datepicker();\n14 });\n15 </script>\n16 </head>\n\
    17 <body>\n18 <h1>Joy of jQuery</h1>\n19 <h2>When you would like to bring in your\
    \ car for service?</h2>\n20\n21 <p>Date: <input type=\"text\" id=\"datepicker\"\
    \ /></p>\n22\n23\n24 </body>\n25 </html>\n```\n\n### Code 解释\n\n```html\n01 <!doctype\
    \ html>\n02\n03 <html lang=\"en\">\n04 <head>\n05 <meta charset=\"utf-8\" />\n\
    06 <title>jQuery UI Datepicker - Default functionality</title>\n07 <link rel=\"\
    stylesheet\" href=\"jquery-ui.css\" />\n08 <script src=\"jquery-1.9.1.js\"></script>\n\
    09 <script src=\"jquery-ui.js\"></script>\n10\n11 <script>\n12 $(function() {\n\
    13 $( \"#datepicker\" ).datepicker();\n14 });\n15 </script>\n16 </head>\n17 <body>\n\
    18 <h1>Joy of jQuery</h1>\n19 <h2>When you would like to bring in your car for\
    \ service?</h2>\n20\n21 <p>Date: <input type=\"text\" id=\"datepicker\" /></p>\n\
    ```\n\n第 6 行设置了 `title`。第 7 行是 `CSS` 文件。第 8 行是 `jQuery` 库。第 9 行是 `jQuery UI` 库。第\
    \ 11 行开始 `<script>`。第 12 行打开 `function`。第 13 行调用了 `$(\"#datepicker\")()`。第 14\
    \ 行结束了 `function`。第 15 行结束了 `<script>`。第 16 行结束了 `</head>`。第 17 行是 `<body>`。第\
    \ 18 行是 `<h1>`。第 19 行是 `<h2>`。第 21 行是 `<p>`。\n\n### 自动补全文本字段\n\n有时可能的数值范围会让单选按钮变得很尴尬。一个棒的解决方案是提供一个文本框并在用户输入时建议值。例如，当我向框中输入\
    \ `jq` 时，Google 会自动建议我想要的内容。\n\n![](img/00013.jpeg)\n\n我们如何为我们的应用程序添加如此酷的功能？`jQuery`\
    \ 让这一切变得简单！请考虑以下示例：\n\n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n\
    <meta charset=\"utf-8\" />\n<title>Joy of jQuery - Autocomplete</title>\n<link\
    \ rel=\"stylesheet\" href=\"http://code.jquery.com/ui/1.10.3/themes/smoothness/jquery-ui.css\"\
    \ />\n<script src=\"http://code.jquery.com/jquery-1.9.1.js\"></script>\n<script\
    \ src=\"http://code.jquery.com/ui/1.10.3/jquery-ui.js\"></script>\n<script>\n\
    $(function() {\nvar carTypes = [\n\"Audi\",\n\"BMW\",\n\"Buick\",\n\"Cadillac\"\
    ,\n\"Chevrolet\",\n\"Chrysler\",\n\"Dodge\",\n\"Ferrari\",\n\"Fiat\",\n\"Fiskar\"\
    ,\n\"GMC\",\n\"Honda\",\n\"Hyundai\",\n\"Infiniti\",\n\"Jaguar\",\n\"Jeep\",\n\
    \"Kia\",\n\"Mazda\",\n\"Mercedes-Bens\",\n\"Mitsubishi\",\n\"Nissan\",\n\"Porsche\"\
    ,\n\"Rolls-Royce\",\n\"Scion\",\n\"Suburu\",\n\"Toyota\",\n\"Volkswagon\",\n\"\
    Volvo\"\n];\n\n$(\"#tags\" ).autocomplete({\nsource: carTypes\n});\n});\n</script>\n\
    </head>\n<body>\n<h1>Joy of jQuery - Sam's Used Cars</h1>\n<h2>What kind of car\
    \ are you looking for?</h2>\n<div class=\"ui-widget\">\n<label for=\"tags\">Manufacturer:\
    \ </label>\n<input id=\"tags\" />\n</div>\n</body>\n</html>\n```\n\n这就是完成后表单看起来的样子。一个标记为\
    \ `\"Manufacturer\"` 的文本框会在你开始输入时自动填充汽车品牌。这太酷了，你只需在自己的网页中任何可以添加的地方添加它！\n\n![](img/00014.jpeg)\n"
