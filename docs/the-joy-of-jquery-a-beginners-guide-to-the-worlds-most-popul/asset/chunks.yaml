    jQuery AJAX


    AJAX is a method of requesting data from a server and updating selected parts
    of the current page with the server''s response. Once you have experienced it
    you will see why AJAX is such a powerful technique. This means that users can
    make a selection or click on an item on your page and the page will respond by
    updating to reflect the selection without having to reload the whole page as is
    the case with traditional server-side scripting.


    AJAX is a much better method than reloading a whole page when information changes
    because it makes a page seem more responsive and dynamic.


    The good news is that jQuery has this topic covered too! You''ll learn in this
    chapter that it is very easy to load any static or dynamic data using jQuery AJAX.
    Note that the example givens here are intended get you started. jQuery AJAX is
    a very rich topic all on its own.


    Basic AJAX Syntax - Get/Post


    The jQuery get() and post() methods are used to request data from the server with
    an HTTP GET or POST request.


    GET vs. POST


    *   GET requests data from a specified resource.


    *   POST submits data to a specified resource to be processed.


    GET is used for getting data from a server. Note that this method may return cached
    data, depending on the server or browser settings.


    POST can also be used to get data from the server. However, there are two major
    differences when contrasted with GET. First, the POST method never returns cached
    data, and second, it can be used to send data along with the request. In other
    words, the POST command can submit a form and send back the results.


    jQuery $.get() Method


    The $.get() method requests data from the server using an HTTP GET request. Here
    is the syntax for get() method:


    $.get(URL, callback);


    The required URL parameter specifies the URL you wish to request (get) and the
    optional callback parameter is the name of a function that will be executed if
    the request succeeds.


    jQuery $.get() Example


    The following example uses the $.get() method to retrieve data from a file on
    the server:


    $("button").click(function(){


    $.get("todays_deal.php",function(data,status){


    alert("Data: " + data + "\nStatus: " + status);


    });


    });


    The first parameter of $.get() is the URL we wish to request ("todays_deal.php").


    The second parameter is a callback function. A “callback function” is a fancy
    way of saying that this is the function that will be run if the get succeeds.
    The callback function itself has parameters which are given values by jQuery if
    the get succeeds. The first parameter will hold the content of the page requested,
    and the second callback parameter will hold the status of the request. At first
    I assumed that the value of the status parameter could only be “success” because,
    by definition, the function is only called if the get succeeds. However, a little
    Googling turned up other possible values as well such as “notmodified”, “error”,
    “timeout”, or “parsererror”.


    By the way, the PHP file called above ("todays_deal.php") looks like this:


    <?php echo ("Today only-- Sam has an awesome deal for you!"); ?>


    jQuery $.post() Method


    The $.post() method requests data from the server using an HTTP POST request.


    Here is the syntax for post() method:


    $.post(URL,data,callback);


    As with get, the required URL parameter specifies the URL you wish to request.


    The optional data parameter specifies some data to send along with the request.


    As with get, the optional callback parameter is the name of a function that will
    be executed if the request succeeds.


    jQuery $.post() Example


    The following example uses the $.post() method to send some data along with a
    request to retrieve data from a server. Since this particular example relies on
    a php-based server-side script, I have posted it on [http://www.joyofphp.com/ajaxpost.html](http://www.joyofphp.com/ajaxpost.html)
    so you can try it out.


