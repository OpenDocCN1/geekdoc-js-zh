    ## HTML Forms


    HTML forms are a special kind of HTML page that can be used to pass data to a
    server. Once the server gets the data, it may manipulate the data and send some
    of it back, or it may store it into database for later use.


    An HTML form will contain input elements like labels, text fields, check boxes,
    radio select, submit buttons, and more. A form can also present lists, from which
    the user can make a selection, or a text area where multi-line typing is allowed.


    The basic structure of a form is as follows:


    ```html

    <form>

    .

    </form>

    ```


    The form tags go inside the `<body>` tag. The data in the form is sent to the
    page specified in the form''s `action` attribute.


    ```html

    <form name="input" action="PostSignup.php" method="get">

    ```

    We''ll cover the form actions later.


    ### The Input tag


    The most common form element is the `<input>` element, which is used to collect
    information from the user. An `<input>` element has several variations, which
    depend on the `type` attribute. An `<input>` element also has a `name` element,
    so you can refer to it later. In general, the syntax is:


    ```html

    <input type="type" name="name"/>

    ```


    An `<input>` element can be of type text, checkbox, password, radio button, submit
    button, and more. The common input types are described.


    Text Fields: `<input type="text">` defines a one-line input field that a user
    can enter text into:


    ```html

    <form>

    First name: <input type="text" name="firstname"/><br>

    Last name: <input type="text" name="lastname"/>

    </form>

    ```

    This is how the above HTML code would look in a browser:

    ![](images/0005.jpeg)


    Password Field: `<input type="password">` defines a password field. The password
    field is just like the text field, except the text that is typed in is not displayed
    on the screen.


    ```html

    Password: <input type="password" name="pwd"/>

    ```

