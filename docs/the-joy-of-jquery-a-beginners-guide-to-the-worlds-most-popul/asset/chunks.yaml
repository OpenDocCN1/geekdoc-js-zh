    # What is jQuery?

    ## Introduction


    `jQuery` is a programming language you can use to create cool web applications.
    It''s free, powerful, relatively easy to set up and learn, and it has extensions
    and plugins available to do almost anything you could imagine. You can get started
    quickly, and you won''t outgrow it later when you get really good at it. In my
    humble opinion, `jQuery` is well worth it the time and effort you put into learning
    it.


    Frankly, it''s just plain fun too. That''s what inspired me to write this book.


    Let''s get started. The most basic concept you need to grasp is that a web page
    is just a bunch of text, organized in a certain way, which is displayed by a browser.
    The browser reads this text and builds a model of the page in memory called the
    ''document object model''. `jQuery` lets you manipulate the document object model
    (also commonly known as the ''DOM''). You will see the term `DOM` throughout this
    book.


    `jQuery` is a lightweight JavaScript library with the tagline of "write less,
    do more". So what does that mean, exactly? To understand what it means, it helps
    to have an idea of what `jQuery` is intended to help you do. If you didn''t have
    `jQuery` (or any other framework like `Dojo`, which is also very cool) then the
    way you would make things happen in the browser is to use a language called `JavaScript`.


    `JavaScript` is programming language that is built into all modern web browsers
    so that client-side scripts can interact with the user, control the browser, communicate
    with the server in the background, and alter the document content and formatting
    that is displayed. `JavaScript` is a full-featured programming language and, as
    such, it can be rather complicated.


    `jQuery` is written in `JavaScript`. In fact, `jQuery` is a lot of `JavaScript`
    all in one place--hence the phrase ''library''. It''s like a library full of `JavaScript`
    code. The purpose of `jQuery` is to make it easier for you to use `JavaScript`
    in your web pages. `jQuery` takes many of the common tasks that would otherwise
    require lots of lines of `JavaScript` code and turns them into methods that you
    can call with a single line. `jQuery` is written in `JavaScript`. In fact, `jQuery`
