    jQuery Slider


    A slider control is used to allow the user to select a value without having to
    type it in. Instead, the user simply drags a selector along a line. In the right
    situation, a slider can be very slick indeed, but you don''t want to over do it.


    If you''ve ever been shopping for a used car then you know that the first question
    you want answered as you approach a car is ''how much does this car cost?'' Conversely,
    the first question the salesperson approaching you wants to know is ''how much
    can you spend?''


    The salesperson will love the slider. A slider is an easy way for visitors to
    Sam''s Used Cars website to specify how much they are willing to spend so that
    the appropriate cars can be displayed to the customer. Here''s how it could look:


    ![](images/00020.jpeg)


    The code to produce the slider is (again) pretty easy. We create a div on the
    form and give it a unique id, for example ''slider''. In the jQuery document ready
    event we select the div and apply the slider method to it.


    The slider method takes a number of options, all of which are described at [http://api.jqueryui.com/slider/](http://api.jqueryui.com/slider/)


    Some common options to the slider widget include: value, min, max, and increment.


    One important difference with this widget as compared with the ones shown so far
    is that the slider widget has an important event that we need to work with to
    make it useful. This is the slide event. The slide event is triggered every time
    the slider control moves. The value provided in the event as ui.value represents
    the value that the handle will have as a result of the current movement. Canceling
    the event will prevent the handle from moving and the handle will continue to
    have its previous value.


    For example, as the user moves the slider around, Sam might want the value displayed
    as ''You''re willing to pay $250 per month for your car'' or something like that
    to make it clear to the user the value that they have just selected.


