    You can get all the source code that accompanies this book by visiting http://www.thejoyofjquery.com
    and joining the mailing list. I''ll never spam you, and you can always opt out
    if you lose interest. Although I haven''t done any yet, I do intent to make some
    youtube videos of the source code in action and I''ll update everyone on the mailing
    list as they come out.


    ## Contacting the Author


    I invite you to contact me if you have any book feedback (such as typos or code
    bugs) or questions. If there''s something you just don''t get, maybe other people
    will have the same issue and it means I need to improve that particular section.
    I take the time to get back to everyone that emails me. I''m at AlanForbes@outlook.com.


    ## Installing for a Web Site


    If you want to make your application you want to be available to everybody via
    the Internet, you’ll need to install your application onto a publicly accessible
    server. Typically that means finding a hosting provider.


    If you are looking for an inexpensive hosting provider, my own PHP-based site
