- fmt: "\nOnce you have a theme you love, you can download that theme to your computer.\
    \ When you click the download button, you will be taken to the 'Download Builder'\
    \ page where you can either download the entire `jQuery` library or pick and choose\
    \ the items you require. This makes it very easy to get the smallest download\
    \ possible, if that's your goal.\n\nWhen you get the download, it will come as\
    \ a zipped file which contains the `jQuery` libraries, `CSS` files, and a demo\
    \ page inside. Opening the demo file will show how your theme will look and gives\
    \ you some sample code to look at to see how it was applied. Here's a partial\
    \ screen shot showing the sample file I download in researching this book:\n\n\
    ![](images/00010.jpeg)\n\nThe `CSS` folder is where the theme is stored. There\
    \ will be a `CSS` file and a folder with the images used by the widgets. Place\
    \ these files on your website and reference the `CSS` file and you are ready to\
    \ start adding widgets that will use your theme.\n\njQuery Widgets CDN\n\nAgain,\
    \ both Microsoft and Google provide content delivery networks (CDN) for the `jQuery\
    \ UI`. They also provide links to the `CSS` for themes in the gallery. You can\
    \ find links to this below:\n\n[http://ajax.googleapis.com/ajax/libs/jqueryui/1.8.10/jquery-ui.js](http://ajax.googleapis.com/ajax/libs/jqueryui/1.8.10/jquery-ui.js)\n\
    \nMicrosoft: [http://www.asp.net/ajaxlibrary/CDNjQueryUI1910.ashx](http://www.asp.net/ajaxlibrary/CDNjQueryUI1910.ashx)\n\
    \nGoogle: http://www.devcurry.com/2010/05/latest-jquery-and-jquery-ui-theme-links.html\n\
    \nReferencing jQuery UI\n\nNow that you have your theme, it is time to start adding\
    \ the `jQuery UI` to your web site. As stated above, you will need to reference\
    \ these libraries and `CSS` files. In your `<head>` tag, you will add this:\n\n\
    ```html\n<head>\n<script src=\"http://code.jquery.com/jquery-1.9.1.js\"></script>\n\
    <script src=\"http://code.jquery.com/ui/1.10.3/jquery-ui.js\"></script>\n<script\
    \ src=\"js/jquery-ui-1.10.3.custom.js\"></script>\n</head>\n```\n\nThe first reference\
    \ is the `<script>` reference for the `jQuery` library. The second `<script>`\
    \ reference is for the `jQuery UI` library. The third and final `<script>` reference\
    \ is for the `jQuery UI` `CSS` file that will add the theme. The first two `<script>`\
    \ references are required to get the `jQuery UI` to work. You do not have to have\
    \ a theme, but the UI will look bland without one.\n\nNow that we have added the\
    \ appropriate links for `jQuery UI`, we can now add some widgets and other items.\
    \ Let us add a calendar widget. In the `<head>` tag, we add this:\n\n```javascript\n\
    <script>\n$(document).ready(function () {\n  $(\"#datepicker\").datepicker();\n\
    });\n</script>\n```\n\nIn the body tag, we add this:\n\n```html\n<p>Date: <input\
    \ id=\"datepicker\" type=\"text\"></p>\n```\n\nWhat this code does is attaches\
    \ a `\"datepicker\"` widget to the `<input>` box. Let's examine this more fully\
    \ in the next section.\n\n### Date Picker\n\nOne common need on web forms is to\
    \ ask the user to enter a date. In native HTML, the only option is to give the\
    \ user a text field and hope that they input a valid date.\n\n![](images/00011.jpeg)\n\
    \nThe `jQuery` date field make it much easier for users to enter dates. The date\
    \ picker modifies the behavior of a standard form input field. Simply focus on\
    \ the input field (click, or use the tab key) and an interactive calendar will\
    \ appear magically. Choose a date and the selected date is shown as the input's\
    \ value.\n\n![](images/00012.jpeg)\n\n### Code\n\n```html\n01 <!doctype html>\n\
    02\n03 <html lang=\"en\">\n04 <head>\n05 <meta charset=\"utf-8\" />\n06 <title>jQuery\
    \ UI Datepicker - Default functionality</title>\n07 <link rel=\"stylesheet\" href=\"\
    jquery-ui.css\" />\n08 <script src=\"jquery-1.9.1.js\"></script>\n09 <script src=\"\
    jquery-ui.js\"></script>\n10\n11 <script>\n12 $(function() {\n13 $( \"#datepicker\"\
    \ ).datepicker();\n14 });\n15 </script>\n16 </head>\n17 <body>\n18 <h1>Joy of\
    \ jQuery</h1>\n19 <h2>When you would like to bring in your car for service?</h2>\n\
    20\n21 <p>Date: <input type=\"text\" id=\"datepicker\" /></p>\n22\n23\n24 </body>\n\
    25 </html>\n```\n\n### Code Explained\n\n```html\n01 <!doctype html>\n02\n03 <html\
    \ lang=\"en\">\n04 <head>\n05 <meta charset=\"utf-8\" />\n06 <title>jQuery UI\
    \ Datepicker - Default functionality</title>\n07 <link rel=\"stylesheet\" href=\"\
    jquery-ui.css\" />\n08 <script src=\"jquery-1.9.1.js\"></script>\n09 <script src=\"\
    jquery-ui.js\"></script>\n10\n11 <script>\n12 $(function() {\n13 $( \"#datepicker\"\
    \ ).datepicker();\n14 });\n15 </script>\n16 </head>\n17 <body>\n18 <h1>Joy of\
    \ jQuery</h1>\n19 <h2>When you would like to bring in your car for service?</h2>\n\
    20\n21 <p>Date: <input type=\"text\" id=\"datepicker\" /></p>\n```\n\nLine `6`\
    \ sets the `title`. `Line 7` is the `CSS` file. `Line 8` is the `jQuery` library.\
    \ `Line 9` is the `jQuery UI` library. `Line 11` starts the `script`. `Line 12`\
    \ opens the `function`. `Line 13` calls `$(\"#datepicker\").datepicker()`. `Line\
    \ 14` closes the `function`. `Line 15` closes the `script`. `Line 16` closes the\
    \ `head`. `Line 17` is the `body`. `Line 18` is the `h1`. `Line 19` is the `h2`.\
    \ `Line 21` is the `p`.\n\n### Auto-completing Text Fields\n\nSometimes the range\
    \ of possible values makes radio buttons or just awkward. A great solution is\
    \ to offer a text box and suggest values as the user types. For instance, as I\
    \ type the letters `jq` into the search box, Google automatically suggests what\
    \ I am looking for.\n\n![](images/00013.jpeg)\n\nHow could we add such a cool\
    \ feature into our application? `jQuery` makes it easy! Consider the following\
    \ example:\n\n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"\
    utf-8\" />\n<title>Joy of jQuery - Autocomplete</title>\n<link rel=\"stylesheet\"\
    \ href=\"http://code.jquery.com/ui/1.10.3/themes/smoothness/jquery-ui.css\" />\n\
    <script src=\"http://code.jquery.com/jquery-1.9.1.js\"></script>\n<script src=\"\
    http://code.jquery.com/ui/1.10.3/jquery-ui.js\"></script>\n<script>\n$(function()\
    \ {\nvar carTypes = [\n\"Audi\",\n\"BMW\",\n\"Buick\",\n\"Cadillac\",\n\"Chevrolet\"\
    ,\n\"Chrysler\",\n\"Dodge\",\n\"Ferrari\",\n\"Fiat\",\n\"Fiskar\",\n\"GMC\",\n\
    \"Honda\",\n\"Hyundai\",\n\"Infiniti\",\n\"Jaguar\",\n\"Jeep\",\n\"Kia\",\n\"\
    Mazda\",\n\"Mercedes-Bens\",\n\"Mitsubishi\",\n\"Nissan\",\n\"Porsche\",\n\"Rolls-Royce\"\
    ,\n\"Scion\",\n\"Suburu\",\n\"Toyota\",\n\"Volkswagon\",\n\"Volvo\"\n];\n\n$(\"\
    #tags\" ).autocomplete({\nsource: carTypes\n});\n});\n</script>\n</head>\n<body>\n\
    <h1>Joy of jQuery - Sam's Used Cars</h1>\n<h2>What kind of car are you looking\
    \ for?</h2>\n<div class=\"ui-widget\">\n<label for=\"tags\">Manufacturer: </label>\n\
    <input id=\"tags\" />\n</div>\n</body>\n</html>\n```\n\nHere's how the form will\
    \ look when done. A text box labeled `\"Manufacturer\"` will automatically fill\
    \ in car makes when you start to type. This is so cool, you simply have to add\
    \ it everywhere you can in your own web pages!\n\n![](images/00014.jpeg)\n"
  raw: 'Once you have a theme you love, you can download that theme to your computer.
    When you click the download button, you will be taken to the ''Download Builder''
    page where you can either download the entire jQuery library or pick and choose
    the items you require. This makes it very easy to get the smallest download possible,
    if that''s your goal.


    When you get the download, it will come as a a zipped file which contains the
    jQuery libraries, CSS files, and a demo page inside. Opening the demo file will
    how your theme will look and gives you some sample code to look at to see how
    it was applied. Here''s a partial screen shot showing the sample file I download
    in researching this book:


    ![](images/00010.jpeg)


    The CSS folder is where the theme is stored. There will be a CSS file and a folder
    with the images used by the widgets. Place these files on your website and reference
    the CSS file and you are ready to start adding widgets that will use your theme.


    jQuery Widgets CDN


    Again, both Microsoft and Google provide content delivery networks (CDN) for the
    jQuery UI. They also provide links to the CSS for themes in the gallery. You can
    find links to this below:


    [http://ajax.googleapis.com/ajax/libs/jqueryui/1.8.10/jquery-ui.js](http://ajax.googleapis.com/ajax/libs/jqueryui/1.8.10/jquery-ui.js)


    Microsoft: [http://www.asp.net/ajaxlibrary/CDNjQueryUI1910.ashx](http://www.asp.net/ajaxlibrary/CDNjQueryUI1910.ashx)


    Google: http://www.devcurry.com/2010/05/latest-jquery-and-jquery-ui-theme-links.html


    Referencing jQuery UI


    Now that you have your theme, it is time to start adding the jQuery UI to your
    web site. As stated above, you will need to reference these libraries and CSS
    files. In your <head> tag, you will add this:


    <head>


    <script  src="http://code.jquery.com/jquery-1.9.1.js"></script>


    <script  src="[http://code.jquery.com/ui/1.10.3/jquery-ui.js](http://code.jquery.com/ui/1.10.3/jquery-ui.js)"></script>


    <script  src="js/jquery-ui-1.10.3.custom.js"></script>


    </head>


    The first reference is the <script> reference for the jQuery library. The second
    <script> reference is for the jQuery UI library. The third and final <script>
    reference is for the jQuery UI CSS file that will add the theme. The first two
    <script> references are required to get the jQuery UI to work. You do not have
    to have a theme, but the UI will look bland without one.


    Now that we have added the appropriate links for jQuery UI, we can now add some
    widgets and other items. Let us add a calendar widget. In the <head> tag, we add
    this:


    <script>


    $(document).ready(function () {


    $("#datepicker").datepicker();


    });


    </script>


    In the body tag, we add this:


    <p>Date: <input id="datepicker" type="text"></p>


    What this code does is attaches a "datepicker" widget to the <input> box. Let''s
    examine this more fully in the next section.


    Date Picker


    One common need on web forms is to ask the user to enter a date. In native HTML,
    the only option is to give the user a text field and hope that they input a valid
    date.


    ![](images/00011.jpeg)


    The jQuery date field make it much easier for users to enter dates. The date picker
    modifies the behavior of a standard form input field. Simply focus on the input
    field (click, or use the tab key) and an interactive calendar will appear magically.
    Choose a date and the selected date is shown as the input''s value.


    ![](images/00012.jpeg)


    Code


    01 <!doctype html>


    02


    03 <html lang="en">


    04 <head>


    05 <meta charset="utf-8" />


    06 <title>jQuery UI Datepicker - Default functionality</title>


    07 <link rel="stylesheet" href="jquery-ui.css" />


    08 <script src="jquery-1.9.1.js"></script>


    09 <script src="jquery-ui.js"></script>


    10


    11 <script>


    12 $(function() {


    13 $( "#datepicker" ).datepicker();


    14 });


    15 </script>


    16 </head>


    17 <body>


    18 <h1>Joy of jQuery</h1>


    19 <h2>When you would like to bring in your car for service?</h2>


    20


    21 <p>Date: <input type="text" id="datepicker" /></p>


    22


    23


    24 </body>


    25 </html>


    Code Explained


    01 <!doctype html>


    02


    03 <html lang="en">


    04 <head>


    05 <meta charset="utf-8" />


    06 <title>jQuery UI Datepicker - Default functionality</title>


    07 <link rel="stylesheet" href="jquery-ui.css" />


    08 <script src="jquery-1.9.1.js"></script>


    09 <script src="jquery-ui.js"></script>


    Line 6 sets the title that appears in the browser. Line 7 is the link to the jQuery
    UI style sheet (css) file. Line 8 is the link to the jQuery library and Line 9
    is the link to the jQuery UI library. Lines 7, 8, and 9 will be common on any
    page that uses the jQuery UI.


    11 <script>


    12 $(function() {


    13 $( "#datepicker" ).datepicker();


    14 });


    15 </script>


    16 </head>


    Line 11 starts a script block and line 15 closes the script block. The script
    is what transforms the ordinary text input into the date picker. Line 12 opens
    the short form of the jQuery document ready event. Line 14 closes the block. Line
    13 is the the one that does all the work so we''ll discuss it in some detail.


    Remember, the basic jQuery syntax is $(selector).action()


    The text to the left of the dot (highlighted in yellow below) selects the page
    element with the ID ''datepicker''.


    $( "#datepicker" ).datepicker();


    The text to the right of the dot (highlighted in yellow below) tells jQuery to
    run the action ''datepicker'' which is a function provided by the jQuery UI library.


    $( "#datepicker" ).datepicker();


    17 <body>


    18 <h1>Joy of jQuery</h1>


    19 <h2>When you would like to bring in your car for service?</h2>


    20


    21 <p>Date: <input type="text" id="datepicker" /></p>


    22


    23


    24 </body>


    25 </html>


    Lines 17 – 25 are pretty straight forward. We have a headline on Line 18 and a
    subhead on Line 19. Line 21 has the text ''Date:'' followed by an input box with
    the id of ''datapicker''. The id is critical because that is how jQuery selected
