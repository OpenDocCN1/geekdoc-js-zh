  raw: 'Personally, I prefer the term ''result set'' because it is consistent with
    the idea that the selector is basically running a query against the document and
    sending back a result. But just because I like the term result set doesn''t mean
    I should set you up for confusion later. Understand that the terms are interchangeable
    and mean exactly the same thing. I may mix it up here and there as we go along,
    just to help keep you awake.


    Types of jQuery selectors


    There are three categories of jQuery selectors: Basic CSS selectors, Positional
    selectors, and Custom jQuery selectors.


    The Basic Selectors are known as "find selectors" as they are used to find elements
    within the DOM. The Positional and Custom Selectors are "filter selectors" as
    they filter (or fine-tune) a set of elements.


    Basic CSS Selectors


    The following jQuery selectors follow standard CSS3 syntax for selectors. Any
    variation of the selectors below could be used as the selector parameter for the
    jQuery command of


    $(selector).methodName();


    Real-life Examples of Selectors


    $("p") selects all the <p> elements


    $("h1") selects all the <h1> elements


    $("div a") selects all the anchor tag (<a>) elements within <div> elements


    $("p>div") selects all <div> elements that are direct children of <p> elements


    $("div~h2") selects all <div> elements that are preceded by a <h2> element


    $("p:has(b)") selects all the paragraph elements that contain some bold text.


    $("div.className") selects all <div> elements with a class name of className.


    $(".className ") selects all the elements with class name of className.


    $("#IDvalue") selects the element with the id value of IDvalue.


    $("img[alt]") selects all the images (<img> elements) that have an alt attribute.


    $("a[href$=.pdf]") selects all the anchors that link to a PDF file. It selects
    all the <a> elements with an href attribute that ends with .pdf.


    You can practice with jQuery selectors by visiting [http://www.w3schools.com/jquery/trysel.asp?filename=trysel_basic&jqsel=p.intro,%23choose](http://www.w3schools.com/jquery/trysel.asp?filename=trysel_basic&jqsel=p.intro,%23choose)


    Multiple Selectors


    Multiple selectors can be combined into a single statement if you separate them
    with commas. For example, the selector $("ul,ol") will select all the list (<ul>
    and <ol>) elements.


    You can use multiple selectors in a single statement by separating them with commas.


    Positional Selectors


    Positional selectors select elements based upon the positional relationships between
    the elements. These selectors can be appended to any base selector (which we"ll
    denote as ''BaseSelector'') to filter the matches based upon position. If the
    base selector is omitted, it is assumed to be * (all the elements).


    Example Positional Selectors Syntax


    BaseSelector:first


    Selects the first element on the page matching the base selector.


    BaseSelector:last


    Selects the last element on the page matching the base selector.


    BaseSelector:first-child


    Selects all elements matching the base selector that are first children.


    BaseSelector:last-child


    Selects all elements matching the base selector that are last children.


    BaseSelector:only-child


    Selects all elements matching the base selector that are only children.


    BaseSelector:nth-child(n)


    Selects all elements matching the base selector that are n-th ordinal children.
    Counting starts at 1.


    BaseSelector:nth-child(odd|even)


    Selects all elements matching the base selector that are even or odd ordinal children.
    The first child is considered odd (counting starts at 1).


    BaseSelector:even


    Selects the even elements matching the base selector.


    BaseSelector:odd


    Selects the odd elements matching the base selector.


    BaseSelector:eq(n)


    Selects the n-th element within the set of elements matching the base selector.
    Counting starts at 0.


    BaseSelector:gt(n)


    Selects elements matching the base selector that that are greater than the n-th
    element (exclusive). Counting starts at 0.


    BaseSelector:lt(n)


    Selects elements matching the base selector that that are less than the n-th element
    (exclusive). Counting starts at 0.


    Real-life Examples


    $("p:first") selects the first paragraph on the page.


    $("img[src$=.png]:first") selects the first <img> element on the page that has
    a src attribute ending in .png


    $("button.small:last") selects the last <button> element on the page that has
    a class name of small


    $("li:first-child") selects all <li> elements that are first children within their
    lists


    $("a:only-child") selects all <a> elements that are the only element within their
    parent


    $("li:nth-child(2)") selects all <li> elements that are the second item within
    their lists


    $("tr:nth-child(odd)") selects all odd <tr> elements within a table


    $("div:nth-child(5n)") selects every 5th <div> element


    $("div:nth-child(5n+1)") selects the element after every 5th <div> element


    $(".someClass:eq(1)") selects the second element with a class name of someClass


    $(".someClass:gt(1)") selects all but the first two elements with a class name
    of someClass


    $(".someClass:lt(4)") selects the first four elements with a class name of someClass


    Note that the :nth-child selectors begin counting at 1, while most jQuery selectors,
    such as :eq, :gt and :lt begin with 0.


    jQuery Custom Selectors


    These selectors are provided by jQuery to allow for commonly used, or just plain
    handy, selections that were not anticipated by the CSS Specification. Like the
    Positional Selectors, these selectors filter a base matching set (which we denote
    with B). Omitting B is interpreted as the set of all elements. These selectors
    may be combined; see the examples for some powerful selector combinations.


    BaseSelector:enabled


    Selects elements matching the base selector that are in the enabled state.


    BaseSelector:button


    Selects elements matching the base selector that are of any button type.


    BaseSelector:input


    Selects elements matching the base selector that are input controls-- such as
    <input>, <select>, <textarea> and <button> elements.


    BaseSelector:checkbox


    Selects elements matching the base selector that are the input type checkbox.
    For example this selector would select


    <input type="checkbox" name="colors">


    BaseSelector:image


    Selects elements matching the base selector that are of the input type image.


    BaseSelector:file


    Selects elements matching the base selector that are of the input type file.


    BaseSelector:radio


    Selects elements matching the base selector that are of type input[type=radio].


    BaseSelector:text


    Selects elements matching the base selector that are of the input type text.


    BaseSelector:password


    Selects elements matching the base selector that are of the input type password.


    BaseSelector:submit


    Selects elements matching the base selector that are either of type input type=submit
    or button type=submit.


    BaseSelector:reset


    Selects elements matching the base selector that are of type input[type=reset]
    or button[type=reset].


    BaseSelector:hidden


    Selects elements matching the base selector that are hidden.


    BaseSelector:header


    Selects elements matching the base selector that are headers <h1> through <h6>.


    BaseSelector:not(f)


    Selects elements matching the base selector that do not match the filter selector
    specified by not(). A filter selector is any selector beginning with a colon(:)


    BaseSelector:parent


    Selects elements matching the base selector that are parents of non-empty children.


    BaseSelector:selected


    Selects elements matching the base selector that are in the selected state. Only
    <option> elements may posses this state.


    BaseSelector:animated


    Selects elements matching the base selector that are currently under animated
    control via one of the jQuery animation methods.


    BaseSelector:visible


    Selects elements matching the base selector that are not hidden.


