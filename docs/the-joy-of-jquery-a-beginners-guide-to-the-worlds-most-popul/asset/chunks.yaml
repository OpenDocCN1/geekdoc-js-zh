    ## Crossing Domains


    You may have noticed that these examples load their dynamic content from the same
    domain (or when running locally, the same folder). Most browsers prevent scripts
    from loading content into the current page from other domains. As your mom used
    to say, ''this is for your own good!'' The idea is to prevent cross-domain scripts
    from loading malware into the current web page of an unsuspecting user.


    If you really need to pull data from another domain, investigate the jQuery `.ajax`
    API documentation. There are limited cases where you can cross domain, but this
    is beyond the scope of the boo. For this, search for the property `crossDomain`
    which you can find at [http://api.jquery.com/jQuery.ajax/](http://api.jquery.com/jQuery.ajax/)
    to learn more.


    ## jQuery Animation


    Of the many things that jQuery makes easy, animation is the most visible, and
    arguably one of the most fun. Just remember not to overdo it on your own web pages.
    Use animation where it makes sense, and not just for the sake of having animation
    everywhere.


    ## jQuery hide(), show(), and toggle()


    With jQuery, you can hide and show HTML elements with the `hide()` and `show()`
    methods:


    ### Hide

    ```

    $("#hide").click(function(){

    $("p.first()").hide();

    });

    ```


    ### Show

    ```javascript

    $("#show").click(function(){

    $("p.first()").show();

    });

    ```


    ### Syntax

    ```

    $(selector).hide(speed,callback);

    $(selector).show(speed,callback);

    ```

    The optional `speed` parameter specifies the speed of the transition from one
    state to another and can take the values of "slow", "fast", or a number specifying
    a number of milliseconds.


    The optional `callback` parameter is a function that will be executed after the
    `hide()` or `show()` method completes.


    ### jQuery toggle()


    With jQuery, you can toggle between the `hide()` and `show()` methods with the
    `toggle()` method. Visible elements are hidden and hidden elements become visible:


    ### Example

    ```javascript

    $("button").click(function(){

    $("p.first()").toggle();

    });

    ```


    ### Syntax

    ```

    $(selector).toggle(speed,callback);

    ```

    Since `toggle` is really just calling the `show` or `hide` functions, it naturally
    offers the same parameters. The optional `speed` parameter can take the following
    values: "slow", "fast", or a number of milliseconds.


    The optional `callback` parameter is the function to execute after `toggle()`
    completes.


    ## jQuery Fading


    Instead of simply showing or hiding elements, jQuery also allows you to fade elements
    in and out of visibility. jQuery has the following fade methods:


    * `fadeIn()`

    * `fadeOut()`

    * `fadeToggle()`

    * `fadeTo()`


    ### jQuery fadeIn() Method


    The jQuery `fadeIn()` method is used to make a hidden element progressively more
    visible. When it finishes, the element is fully visible.


    ### Syntax

    ```

    $(selector).fadeIn(speed,callback);

    ```

    The optional `speed` parameter specifies the duration of the effect. It accepts
    following values: "slow", "fast", or a number of milliseconds.


    The optional `callback` parameter is a function to be executed after the fading
    completes.


    ### jQuery fadeIn() Example

    ```javascript

    $("button").click(function(){

    $("#div1").fadeIn();

    $("#div2").fadeIn("slow");

    $("#div3").fadeIn(5000);

    });

    ```


    ### jQuery fadeOut() Method


    The jQuery `fadeOut()` method is used to make a visible element progressively
    less visible. When it finishes, the element is fully hidden.


    ### Syntax

    ```

    $(selector).fadeOut(speed,callback);

    ```

    The optional `speed` parameter specifies the duration of the effect. It accepts
    following values: "slow", "fast", or a number of milliseconds.


    The optional `callback` parameter is a function to be executed after the fading
    completes.


    ### jQuery fadeOut() Example

    ```javascript

    $("button").click(function(){

    $("#div1").fadeOut();

    $("#div2").fadeOut("slow");

    $("#div3").fadeOut(3000);

    });

    ```


    ### jQuery fadeToggle() Method


    Similar to the jQuery `toggle()` method which toggles between the `hide()` and
    `show()` methods, the jQuery `fadeToggle()` method toggles between the `fadeIn()`
    and `fadeOut()` methods.


    If the elements are hidden, `fadeToggle()` will fade them in. If the elements
    are visible, `fadeToggle()` will fade them out.


    ### Syntax

    ```

    $(selector).fadeToggle(speed,callback);

    ```

    The optional `speed` parameter specifies the duration of the effect. It accepts
    following values: "slow", "fast", or a number of milliseconds.


    The optional `callback` parameter is the function to be executed after `toggle()`
    completes.


    ### jQuery fadeToggle() Example

    ```javascript

    $("button").click(function(){

    $("#div1").fadeToggle();

    $("#div2").fadeToggle("slow");

    $("#div3").fadeToggle(5000);

    });

    ```


    ### jQuery fadeTo() Method


    The final option in the set of fade methods is the `fadeTo()` method. The `fadeTo()`
    method allows fading to a given opacity. This is contrasted with the other fade
    methods which always finish with showing the element at 100% opaque.


    ### Syntax

    ```

    $(selector).fadeTo(speed,opacity,callback);

    ```

    The required `speed` parameter specifies the duration of the effect. It accepts
    following values: "slow", "fast", or a number of milliseconds.


    The required `opacity` parameter in the `fadeTo()` method specifies fading to
    a given opacity (value between 0 and 1).


    The optional `callback` parameter is a function to be executed after the fading
    completes.


    ### jQuery fadeTo() Example

    ```javascript

    $("button").click(function(){

    $("#div1").fadeTo("slow",0.15);

    $("#div2").fadeTo("slow",0.5);

    $("#div3").fadeTo("slow",0.8);

    });

    ```


    ## jQuery Sliding


    The jQuery slide methods show or hide elements by sliding them up or down. jQuery
    has the following slide methods:


    * `slideDown()`

    * `slideUp()`

    * `slideToggle()`


    ### jQuery slideDown() Method


    The jQuery `slideDown()` method is used to slide down an element into visibility.


    ### Syntax

    ```

    $(selector).slideDown(speed,callback);

    ```

    The optional `speed` parameter specifies the duration of the effect. It can take
    the following values: "slow", "fast", or a number of milliseconds.


    The optional `callback` parameter is a function to be executed after the sliding
    completes.


    ### jQuery slideDown() Example

    ```javascript

    $("#button").click(function(){

    $("#panel").slideDown();

    });

    ```


    ### jQuery slideUp() Method


    The jQuery `slideUp()` method is used to slide up an element into invisibility.


    ### Syntax

    ```

    $(selector).slideUp(speed,callback);

    ```

    The optional `speed` parameter specifies the duration of the effect. It can take
    the following values: "slow", "fast", or a number of milliseconds.


    The optional `callback` parameter is a function to be executed after the sliding
    completes.


    ### jQuery slideUp() Example

    ```javascript

    $("#button").click(function(){

    $("#panel").slideUp();

    });

    ```


    ### jQuery slideToggle() Method


    The jQuery `slideToggle()` method toggles between the `slideDown()` and `slideUp()`
    methods.


    If the elements are visible, `slideToggle()` will slide them up. If the elements
    are invisible, `slideToggle()` will slide them down into visibility.

