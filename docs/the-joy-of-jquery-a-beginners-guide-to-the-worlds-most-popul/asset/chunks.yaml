    Code Explained


    The part of the AJAX code that does the work is shown below


    06\. <script type="text/javascript" language="javascript">


    07\. $(document).ready(function() {


    08\. $("#driver").click(function(event){


    09\. $(''#deal'').load(''result.html'');


