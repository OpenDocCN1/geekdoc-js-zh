    jQuery Menu


    Menus are super easy in jQuery. Let''s imagine that Sam''s Used Cars would like
    its website to have a menu that makes it easy for customers to find their way
    around the site. One way to do it would be to create an unordered list to serve
    as a navigator, as shown below.


    ![](images/00017.jpeg)


    The jQuery menu widget can automatically transform a the simple unordered list
    shown above into a very cool and professional menu as shown below:


    ![](images/00018.jpeg)


    Transforming a List into a Menu


    How is this magical transformation achieved you ask? jQuery makes it so simple
    it is almost embarrassing! But we don''t need to tell anyone else how easy it
    is. But the truth is that all you really need to do is add jQuery to the page
    and tell it which unordered list to transform into a menu.


    For instance, imagine I have a list with the id attribute of menuCars, such as:


    <ul id="menuCars">


    <li><a href="buy.htm">Buy a Car</a></li>


    <li>


    <a href="sell.htm">Sell a Car</a>


    ….


    To transform this list, I would add the following code:


    <script>


    $(function() {


    $( "#menuCars" ).menu();


    });


    </script>


    Yes, that''s it! Sure you can tweak it with extra attributes, but you don''t have
    to. To play with this widget, check out the sample file menu.html or visit the
    widget page at [http://jqueryui.com/menu/#default](http://jqueryui.com/menu/#default)


    Example Menu Code


    <!doctype html>


    <head>


    <title>Joy of jQuery - jQuery UI Menu</title>


    <link rel="stylesheet" href="jquery-ui.css" />


    <script src="jquery-1.9.1.js"></script>


    <script src="jquery-ui.js"></script>


    <link rel="stylesheet" href="/resources/demos/style.css" />


    <script>


    $(function() {


    $( "#menuCars" ).menu();


    });


    </script>


    <style>


    .ui-menu { width: 200px; }


    </style>


    </head>


    <body>


    <h1>The Joy of jQuery: Sam''s Used Cars


    </h1>


    <ul id="menuCars">


    <li><a href="#">Buy a Car</a></li>


    <li>


    <a href="#">Sell a Car</a>


    <ul>


    <li><a href="#">Tow in</a></li>


    <li><a href="#">Drive in</a></li>'
