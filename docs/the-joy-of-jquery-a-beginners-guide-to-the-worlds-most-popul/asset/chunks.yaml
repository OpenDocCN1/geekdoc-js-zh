    jQuery UI Widgets: Dramatic Page Enhancements


    Introduction


    jQuery makes it easy to make your web forms shine, and look as if you are an awesome
    developer thanks to the jQuery UI library. The jQuery UI library is a separate,
    but related, library that is designed to work with jQuery.


    UI stands for user-interface and the jQuery UI library provides user interface
    enhancements. These enhancements consist primarily of themes and widgets.


    Themes


    The jQuery UI provides a powerful theming engine. It allows you to create a theme
    for your site and apply it without too much fuss. There are two options, both
    of which are available from [http://jqueryui.com/themeroller/](http://jqueryui.com/themeroller/)


    1.  You can download a pre-defined theme from the jQuery gallery, or


    2.  You can create a custom theme on your own, using the ''roll your own'' option.


    Pre-defined themes


    There are a number of pre-defined themes available that you can use freely. The
    nice thing about the pre-defined themes is that someone else has already gone
    to the trouble to make sure that the colors are compatible and that the whole
    thing looks good. If you don''t really have a eye for design, and very few people
    do, you might just want to go for the pre-defined theme that you like the best.


    To see how a theme will look, just click the image of the theme and all the controls
    on the screen will instantly update to use the selected theme. To use a pre-defined
    theme, simply click the download button, as circled below


    ![](images/00009.jpeg)


    Custom Themes


    One of the great features of the theme roller is that you can select a theme from
    the gallery and then customize it to your exact standards using the Edit button
    (you can also click the ''Roll Your Own'' tab if you''re feeling rebellious).


    As you make changes to the various font and color options, you will see those
    changes reflected by the various widgets and animations on the right side. This
    makes it easy to see what those changes will look like when applied to the various
    jQuery widgets.'
