    ## Getting Started with jQuery


    ### Basic jQuery Syntax


    With jQuery you select (query) HTML elements and perform "actions" on them.


    ### jQuery Syntax


    The jQuery syntax is designed for selecting HTML elements and then performing
    some action on them.


    The basic syntax is: `$(selector).action()`


    *   The `$` sign means ''what follows is jQuery''

    *   The `(selector)` is used to find (or select) a subset of HTML elements

    *   The `action` defines what will happen to the selected elements.


    Here''s a picture that points out each element:


    ![](images/00001.jpeg)


    ### jQuery Examples


    *   `$(this).hide()` - hides the current element.

    *   `$("p").hide()` - hides all `<p>` elements.

    *   `$(".test").hide()` - hides all elements with `class="test"`.

    *   `$("#test").hide()` - hides the element with `id="test"`.


    Are you familiar with CSS selectors? If so, you are in luck. jQuery uses CSS syntax
    to select elements. You will learn more about the selector syntax in the next
    chapter of this tutorial.


    ### The Document Ready Event


    You might have noticed that all jQuery methods in our examples, are inside a document
    ready event:


    ```javascript

    $(document).ready(function(){


    // jQuery methods go here...


    });

    ```


    This is to prevent any jQuery code from running before the document is finished
    loading (i.e., before it is ready).


    It is good practice to wait for the document to be fully loaded and ready before
    working with it. This also allows you to have your JavaScript code before the
    body of your document, in the head section.


    Here are some examples of actions that can fail if methods are run before the
    document is fully loaded:


    *   Trying to hide an element that is not created yet

    *   Trying to get the size of an image that is not loaded yet


    Tip: The jQuery team has also created an even shorter method for the document
    ready event:


    ```javascript

    $(function(){


    // jQuery methods go here...


    });

    ```


    Use the syntax you prefer. We think that the document ready event is easier to
    understand when reading the code.


    ## Introduction to HTML


    ### Introduction


    As we have described it, jQuery is a language used for manipulating web pages
    after they have been sent to the browser. Web pages are written in HTML, and jQuery
    is used so that the HTML on a given page can change dynamically depending on certain
    situations that you define.


    Since jQuery is used to manipulate the HTML on a page, it only makes sense that
    you need to understand basic HTML before you can go any further.


    Cascading Style Sheets (CSS) is a related technology used to define the look and
    feel of an HTML page. Sometimes CSS is referred more simply as a style sheet.


    jQuery allows you to manipulate a web page''s HTML and CSS. If you already understand
    HTML and CSS very well, you can skip the next two chapters. If you think you could
    benefit from a quick refresher on these baseline technologies then please take
    the time to read them now, because jQuery isn''t going to make much sense otherwise.


    ### Basic HTML


    HTML is the primary building block of the web and so it is crucial to have a basic
    understanding of what HTML is and how it works. HTML is a markup language that
    is used by browsers so that they know how to render a document as a web page.
    Regardless of whether a document starts off as HTML written by hand or is generated
    using ASP, JSP, or PHP, ultimately the document is turned into HTML and sent to
    the browser to be rendered for display to a person.


    HTML is a markup language that defines the structure and outline of a web page.
    Markup is not intended to define the look and feel of the content on the page
    beyond rudimentary concepts such as headers, paragraphs, and lists.


    The presentation attributes of HTML have all been deprecated, which is a fancy
    way of saying ''please don''t use these anymore, even though they still work''.
    The current best practices in HTML page design stipulate that most style should
    be contained in style sheets, which are a set of rules that describe how a page
    should look. Style sheets are a topic in themselves, and covered in the next chapter.


    Writing and viewing HTML is incredibly easy (and fun), which of course is a big
    factor in what made it so popular. All you need to build HTML is a computer, a
    text editor and a browser. You simply create the file, save it with an `.htm`
    or `.html` extension, and open it directly. Windows users will find [Programmer''s
    Notepad](http://www.notepad.org/) to be a great editor for creating HTML.


    #### Basic Elements of HTML


    All HTML based documents have the same basic elements. They are composed of tags
    that define the various parts—from where it starts and ends to everything in between.
    HTML uses elements (“tags”) to mark up sections of text.


    Tags


    To distinguish tags from ordinary text, tags appear inside brackets: `<` and `>`.
    Most tags have an open and close tag, also known as a start and end tag. The open
    tag starts with `<` and end tag starts with `</`. For example `<b>` indicates
    to start bold and `</b>` indicates to stop (end) bold.


    For example here is a paragraph element:


    ```html

    <p>This is the first paragraph.</p>

    ```


    In this example the `<p>` and `</p>` are the tags; they are used to delineate
    the text contained within as a paragraph. Something worth pointing out here is
    that you don''t have to put everything on a single line. The code above works
    just as well as this below:


    ```html

    <p>


    This is the first paragraph


    </p>

    ```


    In fact, the indentation isn''t needed either, although it certainly improves
    the readability. Keep in mind that someone (maybe you) may have to edit your HTML
    in the future so making it readable is a good idea.


    All tag formats are the same. They begin with a less-than sign: `<` and end with
    a greater-than sign: `>`. Always. What goes inside the `<` and `>` is the tag
    name. A big part of learning HTML is learning the specific tags and what they
    do.


    Nested Tags


    In general, most tags can be nested inside other tags, but of course there may
    be exceptions to this rule.


    Here you see the bold tag nested inside of a paragraph tag:


    ```html

    <p>This is the first paragraph, with some <b>bold</b> text in it.</p>

    ```

