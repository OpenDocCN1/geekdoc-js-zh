    ## jQuery Mobile 主题


    默认主题包含 5 种色块，并为其分配了字母 (a, b, c, d, e) 以于快速引用。这让事情变得超级简单。为了让跨组件的色块映射保持一致，jQuery
    团队遵循了约定：色块 "a" 是视觉优先级最高级（在我们默认主题中为黑色），"b" 是次级（蓝色），"c" 是我们在许多情况下默认使用的基准级（灰色），"d"
    用于备用次级，“e" 作为强调色块。


    ![](img/00025.jpeg)


    使用特定的色块非常简单。例如，如果我想修改“hello mobile world”示例，在标题栏中使用“b”主题，我会进行以下代码更改：


    ```html

    <div data-role="header" data-theme="b">

    ```


    你可以将 `data-theme` 元素放在任何带有 `data-role` 的 jQuery `div` 中，它将获得适当的主题。因此，要更改内容区域的外观可以这样做：


    ```html

    <div data-role="content" data-theme="b">

    ```


