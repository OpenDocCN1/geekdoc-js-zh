    \n该函数执行了以下操作：选择 ID 为 `'amount'` 的元素，并将其值设置为美元符号和滑块控件的当前值。我在下方红圈了它，这样你就可以看到用户拖动滑块到\
    \ 225 处时发生了什么。\n\n![](img/00021.jpeg)\n\n代码的其他部分是标准的 HTML，我将不再解释。你可以使用包含的 `slider.html`\
    \ 文件进行尝试。\n\n## jQuery Tabs（标签页）\n\nTabs 是分组相关信息的极佳方法，可以让页面对用户来说不那么混乱，并且更容易找到你正在寻找的信息。\n\
    \n对于二手车业务的网站，你可能不想一个充满信息的长页面，而是将相关的条目分组，例如概览（Overview）、照片（Photographs）和财务计算器（Finance\
    \ Calculator），所示：\n\n![](img/00022.jpeg)\n\n标签控件的工作原理与菜单非常相似。你从一个无序列表开始，通过 jQuery\
    \ 的魔法将其转换为其他形式。这里是创建上述页面所需的 HTML 代码段：\n\n```html\n<div id=\"tabs\">\n  <ul>\n\
    \    <li><a href=\"#tabs-1\">Overview</a></a></li>\n    <li><a href=\"#tabs-2\"\
    >Photographs</a></a></li>\n    <li><a href=\"#tabs-3\">Finance Calculator</a></a></li>\n\
    \  </ul>\n  <div id=\"tabs-1\">\n    <p>Mileage: 23<br>Body Style: Convertible<br>Exterior\
    \ Color: Midnight Sapphire<br>Interior Color: Seashell<br>Stock #: R177<br><br>Fuel:\
    \ Gasoline: R-177<br>Engine: 6.8L V12 48V GDI DOHC<br>Transmission: 8-Speed Automatic<br>Drivetrain:\
    \ RWD<br>Doors: 2</p>\n  </div>\n</div>\n```\n\n所需的 jQuery 代码几乎简单得不可思议：\n\n```javascript\n\
    $(function() {\n  $( \"#tabs\" ).tabs();\n});\n```\n\n要将内容放在你想要的位置标签页中，创建一个 `id`\
    \ 与列表 `href` 目标匹配的 `div`。例如，在接后的代码中，注意字符串 `'tabs-1'` 在两个黄色高亮处都是通用的。这就是标签页与内容链接的地方。\n\
    \n```html\n<div id=\"tabs\">\n  <ul>\n    <li><a href=\"#tabs-1\">Overview</a></a></li>\n\
    \    <li><a href=\"#tabs-2\">Photographs</a></a></li>\n    <li><a href=\"#tabs-3\"\
    >Finance Calculator</a></a></li>\n  </ul>\n  <div id=\"tabs-1\">\n    <p>Mileage:\
    \ 23<br>Body Style: Convertible<br>Exterior Color: Midnight Sapphire<br>Interior\
    \ Color: Seashell<br>Stock #: R177<br><br>Fuel: Gasoline<br>Engine: 6.8L V12 48V\
    \ GDI DOHC<br>Transmission: 8-Speed Automatic<br>Drivetrain: RWD<br>Doors: 2</p>\n\
    \  </div>\n</div>\n```\n\n我们所做的是指定标签为 Overview 的标签页将包含 `id` 为 `'tabs-1'` 的 `div`\
    \ 中指定的内容。我们的标签页起什么名字并不重要，只要它们匹配即可。\n\n查看包含的 `tabs.html` 示例文件。\n\n## 代码\n\n```html\n\
    <!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\" />\n  <title>Joy\
    \ of jQuery - UI Tabs</title>\n  <link rel=\"stylesheet\" href=\"jquery-ui.css\"\
    \ />\n  <script src=\"jquery-1.9.1.js\"></script>\n  <script src=\"jquery-ui.js\"\
    ></script>\n  <link rel=\"stylesheet\" href=\"/resources/demos/style.css\" />\n\
    \  <script>\n    $(function() {\n      $( \"#tabs\" ).tabs();\n    });\n  </script>\n\
    </head>\n<body>\n  <h1>Sam's Used Cars</h1>\n  <h2>2013 Rolls-Royce Phantom Drophead\
    \ Coupe Base - $507,800</h2>\n  <div id=\"tabs\">\n    <ul>\n      <li><a href=\"\
    #tabs-1\">Overview</a></a></li>\n      <li><a href=\"#tabs-2\">Photographs</a></a></li>\n\
    \      <li><a href=\"#tabs-3\">Finance Calculator</a></a></li>\n    </ul>\n  \
    \  <div id=\"tabs-1\">\n      <p>Mileage: 23<br>Body Style: Convertible<br>Exterior\
    \ Color: Midnight Sapphire<br>Interior Color: Seashell<br>Stock #: R177<br><br>Fuel:\
    \ Gasoline<br>Engine: 6.8L V12 48V GDI DOHC<br>Transmission: 8-Speed Automatic<br>Drivetrain:\
    \ RWD<br>Doors: 2</p>\n    </div>\n    <div id=\"tabs-2\">\n      <img src=\"\
    images/00021.jpeg\" alt=\"photo\" />\n    </div>\n    <div id=\"tabs-3\">\n  \
    \    <p>Finance Calculator content here...</p>\n    </div>\n  </div>\n</body>\n\
    </html>\n```\n\n## 其他控件\n\n### Accordion（折叠面板）\n比显示的控件多得多，例如 Accordion、Spinner\
    \ 和 Tooltip——它们都遵循标准的 jQuery 语法 `$(selector).action()`。accordion 是一组可折叠的头部。每个头部都可以点击显示或隐藏内容。\n\
    \n### Spinner（计数器）\nspinner 控件允许用户通过点击箭头或输入从列表中选择值。\n\n### Tooltip（提示框）\ntooltip\
    \ 控件在用户悬停在元素上时显示弹出消息。\n\n## 简介（Introduction）\naccordion 控件是一组可折叠的头部。每个头部都可以点击显示或隐藏内容。\n\
    \n（注：由于原文中存在大量重复的段落，此处已按要求翻译了核心内容并保持格式）\n\n"
