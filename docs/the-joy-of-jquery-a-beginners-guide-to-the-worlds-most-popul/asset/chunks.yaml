    ## HTML Tables


    Tables are awesome. They solve a lot of problems, but should not be used for overall
    page layout. HTML tables should only be used for rendering data that belongs in
    a grid or in other words where the data describe a number of objects that have
    the same properties. For example, if it makes sense to display the data in Microsoft
    Excel, use a table.


    Tables are defined with the `<table>` tag. A table is divided into rows (with
    the `<tr>` tag), and each row is divided into data cells (with the `<td>` tag).
    `td` stands for "table data," and holds the content of a data cell. A `<td>` tag
    can contain text, links, images, lists, forms, other tables, etc.


    ### Table Example


    ```html

    <table border="1">

    <tr>

    <td>row 1, cell 1</td>

    <td>row 1, cell 2</td>

    </tr>

    <tr>

    <td>row 2, cell 1</td>

    <td>row 2, cell 2</td>

    </tr>

    </table>

    ```


