    \ after the sliding completes.\n\n## jQuery slideToggle() Example\n\nThe following\
    \ example demonstrates the `slideToggle()` method:\n\n```javascript\n$(\"#button\"\
    ).click(function(){\n  $(\"#panel\").slideToggle();\n});\n```\n\n## jQuery Animate\n\
    \nThe jQuery `animate()` method is used to create custom animations. Nearly any\
    \ CSS property can be animated however keep in mind that all property names must\
    \ be camel-cased when used with the `animate()` method. For example you will need\
    \ to write `paddingRight` instead of `padding-righ`, `marginRight` instead of\
    \ `margin-right`, and so on.\n\nNote: By default all HTML elements have a static\
    \ position and cannot be moved via animation. To manipulate an elements position,\
    \ remember to first set the CSS `position` property of the element to `relative`,\
    \ `fixed`, or `absolute`.\n\nColor animation is not included in the core jQuery\
    \ library. If you want to animate color, you need to download the Color Animations\
    \ plugin from jQuery.com.\n\n## Syntax\n\n```javascript\n$(selector).animate({params},speed,callback);\n\
    ```\n\nThe required `params` parameter defines the CSS properties to be animated.\n\
