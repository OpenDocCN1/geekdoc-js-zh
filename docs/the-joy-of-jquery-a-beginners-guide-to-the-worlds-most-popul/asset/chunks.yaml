    Meta Tags


    The Meta tag, along with the link tag, are unique in that they are the only HTML
    tags that require neither a closing tag nor a closing / at the end of the tag
    and are still considered syntactically correct.


    The other thing about meta tags is that they are the only tag that, generally
    speaking, has no effect on the layout or processing of the page; they are used
    to give information about the page and/or site being viewed. The meta tag is essentially
    a key/value pair, and each tag can only contain one pair of values. Meta tags
    are used primarily by search engines.


