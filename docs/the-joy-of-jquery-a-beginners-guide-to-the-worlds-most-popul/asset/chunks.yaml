    Line 7 starts the familiar OnReady event. It states that when the document ready,
    attach a function to the click event of the item with the ID of ''driver'' (this
    is the button). This happens in line 8.


    The function that will attached is specified in line 9 → $(''#deal'').load(''result.html'');


    Here is the simple syntax for load() method:


    [selector].load( URL, [data], [callback] );


    In this case we are only using the first parameter: URL. What line 9 does is select
    the div with the id of deal, and replace the HTML inside the div with the results
    of the URL that was loaded.


    A More Advanced Example: Loading Data and Executing a Function


    The optional callback parameter specifies a function that will run when the load()
    method is completed. The callback function can take three parameters:


    *   responseText - contains the text returned if the load succeeds


    *   statusText - contains the status of the call


    *   xhr - contains the XMLHttpRequest object


    The following example modifies our earlier example to display an alert box after
    the load() method completes. If the load() method has succeed, it displays "External
    content loaded successfully!", and if it fails it displays an error message.


    ![](images/00034.jpeg)


    The previous code looked like this:


    $(document).ready(function() {


    $("#driver").click(function(event){


    $(''#deal'').load(''result.html'');


