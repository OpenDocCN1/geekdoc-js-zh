    \ and a Style Sheet is a list of styles. For instance, you may have a style that\
    \ defines how `<h1>` elements should look and another for how basic paragraphs\
    \ should look.\n\nAll browsers support CSS today. Learn it, love it.\n\nBest practices\
    \ dictate that a style sheet should be stored as a separate file that is distinct\
    \ from the HTML page, although this is not the only supported configuration. Your\
    \ style sheet should have a `.css` extension to make it easy to identify by both\
    \ computers and humans.\n\nStyles were added to HTML 4.0 to solve a problem. The\
    \ problem was that HTML was never intended to contain tags for formatting a document.\
    \ HTML was intended to define the content of a document, such as:\n\n```html\n\
    <h1>This is a heading</h1>\n<p>This is a paragraph.</p>\n```\n\nWhen tags like\
    \ `<font>`, and color attributes were added to the HTML 3.2 specification, it\
    \ inadvertently created a real mess for web developers. While it was great to\
    \ have such control over how a web page looked, the development of large web sites\
    \ suddenly got a lot more tedious and expensive. To get that unique 'corporate\
    \ identity' that marketers craved, fonts and color information were now required\
    \ to be added to every page. Even worse, changing something that should be simple\
    \ (i.e., all headers should now be in orange – as is the case on Amazon.com) meant\
    \ editing every page. Again. Ugh.\n\nTo solve this problem, the World Wide Web\
    \ Consortium (W3C) created CSS. In HTML 4.0, all formatting could be removed from\
    \ the HTML document and stored in a separate CSS file.\n\n### External Style Sheets\
    \ can save a lot of work\nExternal Style Sheets are stored in CSS files.\n\nAn\
    \ external style sheet is ideal when the style is applied to many pages, and this\
    \ is the only type of style sheet we will cover in this book. With an external\
    \ style sheet, you can change the look of an entire web site just by changing\
    \ the contents of this one file.\n\nAn external style sheet can be written in\
    \ any text editor because it is just a plain text file. Here's an example of a\
    \ simple style:\n\n```css\nbody {\n  background-color: #F0F0F0;\n}\n\nh1 {\n \
    \ color: orange;\n}\n\np {\n  font-family: Arial, sans-serif;\n}\n```\n\n### CSS\
    \ Rule Syntax\nA CSS rule has two main parts: a selector, and declarations contained\
    \ inside curly brackets. \n\n```css\np {\n  color: red;\n  text-align: center;\n\
    }\n```\n\nThe selector is the HTML element you want to style. In this case, we\
    \ have:\n\n```css\np {\n  color: red;\n  text-align: center;\n}\n```\n\nThe second\
    \ half of a style is the declaration. The declaration is the part that changes\
    \ the selected item-- for instance, changing the color. Each declaration consists\
    \ of a property and a value. The property is the style attribute you want to change,\
    \ and the value is what you want to set it to. In other words, if you were changing\
    \ some text to blue, the property would be `color` and the value would be `blue`.\n\
    \nA CSS declaration always ends with a semicolon, and the declaration, or declaration\
    \ groups are surrounded by curly brackets `{}`. If we wanted to make more than\
    \ one change to the paragraph text, we would use a declaration group, such as:\n\
    \n```css\np {\n  color: blue;\n  text-align: left;\n}\n```\n\n### How to use a\
    \ Style Sheet\nOK, so now we have a style sheet. How do we use it? To use a style\
    \ sheet, the HTML page simply has to link to it using `<link>` tag.\n\n```html\n\
    <head>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"mystyle.css\">\n</head>\n\
    ```\n\nIf you used the above style sheet, the following changes would occur:\n\
    1. The background color would change to yellow.\n2. The `<h1>` header would be\
    \ orange.\n3. All the text within paragraphs would be 20 points.\n\n### Selectors\n\
    As you might guess, selectors are not just limited to selecting single items,\
    \ such as the paragraph tag. There are many CSS selectors. Here are a few:\n\n\
    ![](images/00008.jpeg)\n\nWe'll cover more of these when we talk about jQuery\
    \ selectors which– conveniently– are based on CSS selectors.\n\n### Child vs Descendant\n\
    You may notice that some selectors refer to elements' descendant. Consider the\
    \ following ancestor selector:\n\n`div p`\n\nThis selects all paragraphs that\
    \ are descendants of a `div`. In other words, if a paragraph is inside a div,\
    \ even it is first inside something else.\n\nThen the child selector:\n\n`div\
    \ > p`\n\nWhat's the difference? The difference is that the child selector only\
    \ selects the immediate children, not the children of children.\n\n### CSS Examples\n\
    Here's a basic example that sets the color of the text in paragraphs to blue:\n\
    \n```css\np {color:blue;}\n```\n\n```css\np {color:blue;text-align:left;}\n\n\
    Here's a more advanced example:\n\n```css\nh1 { display: block; margin: 20px 0\
    \ 6px 0; font-size: 1.8em; color: blue; text-decoration: none; text-align: center;\
    \ }\n```\n\nYou may have noticed that the second example was considerably harder\
    \ to read because it reads like a run-on sentence. To make the CSS more readable\
    \ to humans, it much better if you put each declaration on its own line, like\
    \ this:\n\n```css\np {\n  color: red;\n  text-align: center;\n}\n```\n"
  raw: 'Note that a password field doesn''t secure the data, it only hides it on the
    screen.


    Radio Buttons: <input type="radio"> defines a radio button. Radio buttons let
    a user select one (and only one) of a limited number of presented choices:


    <body>


    <form>


    Pick your favorite color: <br/>


    <input type="radio" name="color" value="red"/>Red<br/>


    <input type="radio" name="color" value="blue"/>Blue<br/>


    <input type="radio" name="color" value="green"/>Green


    </form>


    </body>


    This is how the HTML code above looks in a browser:


    ![](images/00006.jpeg)


    Checkboxes: <input type="checkbox"> defines a checkbox. Checkboxes let a user
    select ZERO or MORE options of a limited number of choices.


    <form>


    <input type="checkbox" name="vehicle" value="Bike">I have a bike<br>


    <input type="checkbox" name="vehicle" value="Car">I have a car


    </form>


    Submit Button: <input type="submit"> defines a submit button.


    A submit button is used when the user has filled in the form, and is ready to
    send (“submit”) the data they have entered to the server. The data is sent to
    the page specified in the form''s action attribute, which will be covered in the
    next section.


    HTML Form Actions & Methods


    When you define a form, there are two required attributes: action and method.
    The action attribute (action=) indicates the name of the file that the form will
    be submitted to. The method attribute (method=) specifies how the form will be
    submitted.


    The file defined in the action attribute usually does something with the received
    input, like put it into a database or send back some of the values to the user.
    Here''s an example of a simple form with action and method attributes.


    <form name="input" action="form_action.php" method="get">


    Your name: <input type="text" name="name"/>


    <input type="submit" value="Submit">


    </form>


    For the purposes of this book we will assume that the action attribute specifies
    the name of a PHP file. As you will see, the PHP file specified in the action
    attribute will have access to all the values in the form that was submitted.


    Introduction to CSS


    What is CSS?


    CSS is an acronym that stands for Cascading Style Sheets. Styles define how to
    display HTML elements, and a Style Sheet is a list of styles. For instance, you
    may have a style that defines how <h1> elements should look and another for how
    basic paragraphs should look.


    All browsers support CSS today. Learn it, love it.


    Best practices dictate that a style sheet should be stored as a separate file
    that is distinct from the HTML page, although this is not the only supported configuration.
    Your style sheet should have a .css extension to make it easy to identify by both
    computers and humans.


    Styles were added to HTML 4.0 to solve a problem. The problem was that HTML was
    never intended to contain tags for formatting a document. HTML was intended to
    define the content of a document, such as:


    <h1>This is a heading</h1>


    <p>This is a paragraph.</p>


    When tags like <font>, and color attributes were added to the HTML 3.2 specification,
    it inadvertently created a real mess for web developers. While it was great to
    have such control over how a web page looked, the development of large web sites
    suddenly got a lot more tedious and expensive. To get that unique ''corporate
    identity'' that marketers craved, fonts and color information were now required
    to be added to every page. Even worse, changing something that should be simple
    (i.e., all headers should now be in orange – as is the case on Amazon.com) meant
    editing every page. Again. Ugh.


    To solve this problem, the World Wide Web Consortium (W3C) created CSS. In HTML
    4.0, all formatting could be removed from the HTML document and stored in a separate
    CSS file.


    External Style Sheets can save a lot of work


    External Style Sheets are stored in CSS files


    A Simple Style Sheet


    An external style sheet is ideal when the style is applied to many pages, and
    this is the only type of style sheet we will cover in this book. With an external
    style sheet, you can change the look of an entire web site just by changing the
    contents of this one file.


    An external style sheet can be written in any text editor because it is just a
    plain text file. Here''s an example of a very basic style sheet:


    body


    {


    background-color:#F7F8E0;


    }


    h1


    {


    color:orange;


    text-align:center;


    }


    p


    {


    font-family:"Times New Roman";


    font-size:20px;


    }


    CSS Style Rule Syntax


    A style sheet consists of a number of Style Rules. These rules follow a simple
    format:


    ![](images/00007.jpeg)


    A CSS rule has two main parts: a selector, and one or more declarations contained
    inside curly brackets. Let''s use an example:


    p


    {


    font-family:"Times New Roman";


    font-size:12px;


    }


    The selector is normally the HTML element you want to style. In this case, we
    are selecting the paragraph elements “p”.


    Declarations occur after the selector and appear {between curly brackets}. Each
    declaration consists of a property and a value. The property is the style attribute
    you want to change, while the value is what you want to change it to.


    If you have multiple declarations, you separate them with a semi colon. In our
    example above, we set two attributes: font-family and font-size.


    According to this rule, all the paragraphs will be Times New Roman, 12 points.


    How to use a Style Sheet


    OK, so now we have a style sheet. How do we use it? To use a style sheet, the
    HTML page simply has to link to the style sheet using the <link> tag. The <link>
    tag goes inside the head section, as shown:


    <head>


    <link rel="stylesheet" type="text/css" href="mystyle.css">


    </head>


    If you used the above style sheet, the following changes to the document would
    occur:


    1.  The background color would change to light yellow (F7F8E0).


    2.  The h1 header would be orange and centered.


    3.  All the text within paragraphs would be 20 points and in the Times Roman font


    Take a look back at the style sheet. Can you figure out why these changes would
    occur?


    Selectors


    As you might guess, selectors are not just limited to selecting single items,
    such as the paragraph tag. There are many CSS selectors. Here are a few:


    ![](images/00008.jpeg)


    We''ll cover more of these selectors when we talk about jQuery selectors which–
    conveniently– are based on CSS selectors.


    Child vs Descendant


    You may notice that some selectors refer to an elements'' descendant or children.
    Consider the following ancestor selector:


    div p


    This selects all paragraphs that are descendants of a div. (In other words, if
    a paragraph is inside a div, even it is first nested inside something else.


    Then the child selector:


    div > p


    What''s the difference? The difference is that the child selector only selects
    the immediate children, not the children of children.


    CSS Declarations


    The second half of a style is the declaration. The declaration is the part that
    changes the selected item-- for instance, changing the color. Each declaration
    consists of a property and a value. The property is the style attribute you want
    to change, and the value is what you want to set it to. In other words, if you
    were changing some text to blue, the property would be ''color'' and the value
    would be ''blue''.


    CSS Examples


    Here''s a basic example that sets the color of the text in paragraphs to blue:


    p {color:blue;}


    A CSS declaration always ends with a semicolon, and the declaration, or declaration
    groups are surrounded by curly brackets {}. If we wanted to make more than one
    change to the paragraph text, we would use a declaration group, such as:


    p {color:blue;text-align:left;}


    here''s a more advanced example:


    h1 { display: block; margin: 20px 0 6px 0; font-size: 1.8em; color: blue; text-decoration:
    none; text-align: center; }


    You may have noticed that the second example was considerably harder to read because
    it reads like a run-on sentence. To make the CSS more readable to humans, it much
    better if you put each declaration on its own line, like this:


    p


    {


    color:red;


    text-align:center;


    }'
