  \ `data-role` 为 `content`，当然，那是页面的主要内容所在。内容区域内部包含一个无序列表 `<ul>`，其中有四个列表项：奥迪、宝马、雪佛兰和道奇。jQuery\
  \ 将这个简单的无序列表转换为一组触控友好的按钮。最后是一个 `data-role` 为 `footer` 的 `DIV`，它定义了页面底部的内容。\n\n这里有一张图片可以帮助解释这一切的工作原理：\n\
