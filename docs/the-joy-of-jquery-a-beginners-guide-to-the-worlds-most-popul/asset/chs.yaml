  \n# 什么是 jQuery?\n### 简介\n\n`jQuery` 是一种你可以用来创建酷 Web 应用程序的编程语言。它是免费的、强大的、相对容易设置和学习，并且拥有许多扩展和插件可以实现你所想象的任何功能。你可以快速上手，而且当你以后精通它时，也不会觉得它不再够用。在我看来，`jQuery`\
  \ 非常值得你投入精力和时间去学习。\n\n坦率地说，它本身也非常有趣。这就是我写这本书的灵感所在。\n\n让我们开始吧。你需要掌握的最基本概念是：网页仅仅是一堆按特定方式组织的文本，由浏览器显示。浏览器读取这些文本并在内存中构建一个名为“文档对象模型”的页面模型。`jQuery`\
  \ 允许你操作文档对象模型（通常称为“DOM”）。你将在全书中看到 `DOM` 这个术语。\n\n`jQuery` 是一个轻量级的 JavaScript 库，口号是“写更少的代码，做更多的事”。这到底意味着什么呢？为了理解它的含义，最好对\
  \ `jQuery` 旨在帮助你做什么心中有数。如果你没有 `jQuery`（或其他任何其他框架，如 `Dojo`，它也很酷），那么你在浏览器中实现功能的方法就是使用一种名为\
  \ `JavaScript` 的语言。\n\n`JavaScript` 是一种内置在所有现代 浏览器中的编程语言，以便客户端脚本可以与用户交互、控制浏览器、在后台与服务器通信，并更改显示的文档内容和格式。`JavaScript`\
  \ 是一种功能齐全的编程语言，因此可能相当复杂。\n\n`jQuery` 是用 `JavaScript` 编写。事实上，`jQuery` 是将大量的 `JavaScript`\
  \ 代码聚集在一起——因此有了“库（library）”这个词。它就像一个装满 `JavaScript` 代码的库。`jQuery` 的目的是让你在网页中使用 `JavaScript`\
  \ 变得更加容易。`jQuery` 将许多原本需要大量行 `JavaScript` 代码才能完成的常见任务，转换为你可以用单行调用的方法。\n\n（注：原文中存在大量重复段落，翻译时已进行去重处理以保留核心逻辑。）\n\
  \n# 什么是 jQuery?\n### 简介\n`jQuery` 是一种你可以用来创建酷 Web 应用程序的编程语言。它是免费的、强大的、相对容易设置和学习，并且拥有许多扩展和插件可以实现你所想象的任何功能。你可以快速上手，而且当你以后精通它时，也不会觉得它不再够用。在我看来，`jQuery`\
  \ 非常值得你投入精力和时间去学习。\n\n坦率地说，它本身也非常有趣。这就是我写这本书的灵感所在。\n\n让我们开始吧。你需要掌握的最基本概念是：网页仅仅是一堆按特定方式组织的文本，由浏览器显示。浏览器读取这些文本并在内存中构建一个名为“文档对象模型”的页面模型。`jQuery`\
  \ 允许你操作文档对象模型（通常称为“DOM”）。你将在全书中看到 `DOM` 这个术语。\n\n`jQuery` 是一个轻量级的 JavaScript 库，口号是“写更少的代码，做更多的事”。这到底意味着什么呢？为了理解它的含义，最好对\
  \ `jQuery` 旨在帮助你做什么心中有数。如果你没有 `jQuery`（或其他任何其他框架，如 `Dojo`，它也很酷），那么你在浏览器中实现功能的方法就是使用一种名为\
  \ `JavaScript` 的语言。\n\n`JavaScript` 是一种内置在所有现代 浏览器中的编程语言，以便客户端脚本可以与用户交互、控制浏览器、在后台与服务器通信，并更改显示的文档内容和格式。`JavaScript`\
  \ 是一种功能齐全的编程语言，因此可能相当复杂。\n\n`jQuery` 是用 `JavaScript` 编写。事实上，`jQuery` 是将大量的 `JavaScript`\
  \ 代码聚集在一起——因此有了“库（library）”这个词。它就像一个装满 `JavaScript` 代码的库。`jQuery` 的目的是让你在网页中使用 `JavaScript`\
  \ 变得更加容易。`jQuery` 将许多原本需要大量行 `JavaScript` 代码才能完成的常见任务，转换为你可以用单行调用的方法。\n\n# 什么是 jQuery?\n\
  ### 特性\n`jQuery` 包含：\n* `HTML`\n* `CSS`\n* `AJAX`\n* 效果 (Effects)\n* 动画 (Animations)\n\
  \n# 什么是 jQuery?\n### 为什么它不是\n`jQuery` 不是：\n* 一种语言\n* 一个框架\n* 一个浏览器\n\n（注：提供的文本包含许多重复的段落和不完整的句子。我已经清理了结构，在保持逻辑文档流的同时保留了源文本中提供的核心技术信息。）\n\
  \n# 什么是 jQuery?\n### 下载的替代方案\n使用来自 Google 或 Microsoft 的托管版本 `jQuery` 相比于自己托管具有巨大的优势。许多用户在访问其他网站时已经从\
  \ Google 或 Microsoft 下载过 `jQuery`。因此，他们就不需要再次下载它，因为他们的浏览器已经在本地存储了它。这缩短了你网站的加载时间。此外，大多数\
  \ CDN 都会确保当用户请求文件时，将从距离他们最近的服务器提供服务，这很可能比你的服务器更近（更重要的是，速度更快）。\n\n除非你有非常充分的理由要自己托管\
  \ `jQuery`，否则你应该使用 CDN（内容分发网络）。\n\n\n\n\n\n你可以通过访问 http://www.thejoyofjquery.com\
  \ 并加入邮件列表来获取本书的所有源代码。我永远不会向你发送垃圾邮件，如果你失去了兴趣，也可以随时退出。虽然目前我还没有做过这些视频，但我打算制作一些演示源代码运行的\
  \ YouTube 视频，并在发布时通过邮件列表向大家更新进度。\n\n## 联系作者\n\n如果你对本书有任何反馈（如拼写错误或代码 Bug）或问题，欢迎与我联系。如果某些地方你仍然无法理解，可能其他人也会遇到相同的问题，这意味着我需要改进特定的章节。我会花时间回复每一位给我发邮件的人。我的邮箱是\
  \ AlanForbes@outlook.com。\n\n## 为网站安装\n\n如果你想让你的应用程序可以通过互联网供所有人访问，你就需要将应用程序安装到可以公共访问的服务器上。这通常意味着寻找一个托管提供商。\n\
  \n如果你正在寻找廉价的托管提供商，我自己的基于 PHP 的网站（它让人们轻松地编写自己的 Kindle 书，访问 [`www.KindleSmith.com`](http://www.KindleSmith.com/)）托管在\
  \ AccuWeb Hosting，我在他们那里没有遇到过任何问题。\n\n如果你也想使用他们，如果你能使用我的推广链接 `manage.accuwebhosting.com/aff.php?aff=743`，我将不胜感激。\n\
  \n使用上述链接不会增加你的费用，我会获得小额佣金。谢谢。\n\n## 开始使用 jQuery\n\n### jQuery 基本语法\n\n使用 jQuery，你可以选择（查询）HTML\
  \ 元素并对它们执行“操作”。\n\n### jQuery 语法\n\njQuery 语法设计用于选择 HTML 元素并对其执行某些操作。\n\n基本语法为：`$(selector).action()`\n\
  \n*   `$` 符号意味着“后面的是 jQuery”\n*   `(selector)` 用于找到（或选择）HTML 元素的子集\n*   `action`\
  \ 定义了对选定元素将发生什么。\n\n这是一张指出每个元素的图片：\n\n![](img/00001.jpeg)\n\n### jQuery 示例\n\n*\
  \   `$(this).hide()` - 隐藏当前元素。\n*   `$(\"p\").hide()` - 隐藏所有的 `<p>` 元素。\n*   `$(\"\
  .test\").hide()` - 隐藏所有 `class=\"test\"` 的元素。\n*   `$(\"#test\").hide()` - 隐藏 `id=\"\
  test\"` 的元素。\n\n你熟悉 CSS 选择器吗？如果是，那你就运气了。jQuery 使用 CSS 语法来选择元素。你将在本教程的下一章节学习更多关于选择器语法的知识。\n\
  \n### 文档就绪事件\n\n你可能注意到，我们示例中所有的 jQuery 方法都在一个 document ready 事件中：\n\n```javascript\n\
  $(document).ready(function(){\n\n// jQuery 方法写在这里...\n\n});\n\n```\n\n这是为了防止任何 jQuery\
  \ 代码在文档完成加载之前（即在它准备就绪之前）运行。\n\n在处理文档之前，等待文档完全加载并就绪是一个良好的习惯。这还允许你将 JavaScript 代码放在文档\
  \ body 标签之前，即 head 区域。\n\n以下是一些如果在文档完全加载之前运行方法可能会导致失败的操作示例：\n\n*   尝试隐藏尚未创建的元素\n\
  *   尝试获取尚未加载的图像的大小\n\n提示：jQuery 团队还为文档就绪事件创建了一个更短的方法：\n\n```javascript\n$(function(){\n\
  \n// jQuery 方法写在这里...\n\n});\n\n```\n\n使用你喜欢的语法即可。我们认为在阅读代码时，document ready 事件更容易理解。\n\
  \n## HTML 简介\n\n### 简介\n\n正如我们所描述的，jQuery 是一种用于在网页发送到浏览器后进行的语言。网页是用 HTML 编写的，使用\
  \ jQuery 是为了让特定页面上的 HTML 可以根据你定义的某些情况发生动态变化。\n\n由于 jQuery 用于操作页面上的 HTML，因此在继续之前，你需要理解基础\
  \ HTML 是有意义的。\n\n层叠样式表（CSS）是一种相关技术，用于定义 HTML 页面的外观和感觉。有时 CSS 也被更简单地称为样式表。\n\njQuery\
  \ 允许你操作网页的 HTML 和 CSS。如果你已经非常理解 HTML 和 CSS，可以跳过接下来的两个章节。如果你认为通过对这些基础技术进行快速复习会获益，那么请花时间现在阅读它们，否则\
  \ jQuery 将不会产生太大意义。\n\n### 基础 HTML\n\nHTML 是网页的主要构建模块，因此对 HTML 是什么以及它是如何工作的有一个基本的理解至关重要。HTML\
  \ 是一种标记语言，浏览器使用它，以便它们知道如何将文档渲染为网页。无论文档起初是手写的 HTML 还是使用 ASP、JSP 或 PHP 生成的，最终文档都会转换为\
  \ HTML 并发送到浏览器中进行渲染，以供人显示。\n\nHTML 是一种定义网页结构和大纲的标记语言。标记并不是为了定义页面内容的视觉和感觉，除了标题、段落和列表等基础概念之外。\n\
  \nHTML 的表现属性已被废弃，这是一种华丽的说法，意思是“请不要再使用这些了，尽管它们仍然有效”。HTML 页面设计的当前最佳实践规定，大多数样式应包含样式表中，样式表是一组描述页面应该什么样子的规则。样式表本身就是一个主题，将在下一章节介绍。\n\
  \n编写和查看 HTML 极其简单（而且有趣），这正是让它如此受欢迎的一个因素。构建 HTML 只需要计算机、一个文本编辑器和一个浏览器。你只需创建文件，以 `.htm`\
  \ 或 `.html` 扩展名保存，然后直接打开它。Windows 用户会发现 [Notepad](http://www.notepad.org/) 是创建 HTML\
  \ 的绝佳编辑器。\n\n#### HTML 基本元素\n\n所有 HTML 文档都有相同的基本元素。它们由定义各个部分的标签组成——从开始到结束以及之间的所有内容。HTML\
  \ 使用元素（标签）来标记文本。\n\n标签\n\n为了将标签与普通文本区分开，标签出现在括号内：`<` 和 `>`。大多数标签都有开启标签和关闭标签，也称为开始和结束标签。开启标签以\
  \ `<` 开头，结束标签以 `</` 开头。例如 `<b>` 表示开始加粗，`</b>` 表示停止（结束）加粗。\n\n例如这是一个段落元素：\n\n```html\n\
  <p>这是第一个段落。</p>\n```\n\n在这个示例中`<p>` 和 `</p>` 是标签；它们用于界定包含其中的文本为段落。这里值得指出的一点是，你不需要将所有内容放在同一行。上面的代码效果和下面的一样一样：\n\
  \n```html\n<p>\n\n这是第一个段落。\n\n</p>\n```\n\n事实上，缩进也不是需要的，尽管它确实提高了可读性。记住，未来某人（可能是你）可能编辑你的\
  \ HTML，所以让它易于阅读是一个好主意。\n\n所有的标签格式都是相同的。它们以小于号 `<` 开头，以大于号 `>` 结尾。始终如此。位于 `<` 和 `>`\
  \ 之间的是标签名称。学习 HTML 的很大一部分是学习特定的标签及其作用。\n\n嵌套标签\n\n通常情况下，大多数标签都可以嵌套在其他标签内部，但当然这个规则可能会有例外。\n\
  \n在这里你看到加粗标签嵌套在段落标签内部：\n\n```html\n<p>这是第一个段落，其中包含一些<b>加粗</b>文本。</p>\n```\n\n\n\n\
  \n并不是所有的元素都有对应的开始和结束标签。例如，`<br>` 没有对应的 `</br>`，`<hr>` 也是如此。`<hr>` 标签插入一条水平规则（线），而\
  \ `<br>` 标签插入一个换行。\n\n## 必需标签\n\nHTML 页面以 `<html>` 标签开始，以 `</html>` 结束。页面主体位于 `<body>`\
  \ 标签内部。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>这是我的第一段文字。</p>\n</body>\n\
  </html>\n```\n\n### DocType（文档类型声明）\n\n如果网页缺少 `<DOCTYPE>` 标签或具有某种类型的“过渡性” doctype\
  \ 标签，页面将以所谓的“怪异模式”（quirks mode）进行渲染。怪异模式具有某种不可预测性，你并不总能得到预期的结果。\n\n因此，如果你希望你的网页按照预期以“标准模式”（Standards\
  \ mode）显示，拥有一个 doctype 标签是非常重要的。不过，为了简单起见，书中的示例将跳过这一步。\n\n### Head（头部）\n\n文档的头部是放置\
  \ `Title`（标题）和 `Meta`（元数据）信息的地方。通常，如果你有任何 CSS 样式、脚本标签以及指向外部文件的链接标签，你也会将它们放在 Head\
  \ 中。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>\n这是页面的标题。\n</title>\n\
  </head>\n<body>\n正文内容在这里。\n</body>\n</html>\n```\n\n## 可选标签\n\n### Meta Tags（元数据标签）\n\
  \n`Meta` 标签与 `link` 标签的独特之处在于，它们是唯一既不需要结束标签，也不需要在标签末尾添加结束 `/` 的 HTML 标签，且仍然被认为语法正确。\n\
  \n关于元数据标签的另外一点是，通常情况下，它们是唯一对页面的布局或处理没有影响的标签；它们用于提供关于所查看页面和/或网站的信息。`meta` 标签本质上是一个键/值对，每个标签只能包含一对值。元数据标签主要供搜索引擎使用。\n\
  \n## 有用标签\n\n### Headers（标题）\n\n标题用于将信息组织成层级分组。\n\n```html\n<h1>标题 1</h1>\n<h2>标题\
  \ 2</h2>\n<h3>标题 3</h3>\n<h4>标题 4</h4>\n<h5>标题 5</h5>\n<h6>标题 6</h6>\n```\n\n标题标签是块级元素，这意味着它们单独占据整行，并且标题标签内部不允许有其他标记。\n\
  \n### DIV\n\n`DIV` 标签是你用来在文档中创建逻辑划分的标签之一。`DIV` 与 CSS 配合，并允许你编写 CSS 规则来指定 `DIV` 内部文本的格式方法。\n\
  \n### Images/Picture（图像/图片）\n\n要向文档中添加图像，你可以使用“image”标签。在 html 文档中插入图像请使用以下语法：\n\
  \n```html\n<img src=\"smiley.gif\" alt=\"笑脸\">\n```\n\n你在 `src=` 属性中填入的值可以指定本地文件系统上的图形，也可以指定一个完整的\
  \ URL，从互联网的其他地方获取图像。\n\n### Links（链接）\n\n用户点击链接时，会将他们带到另一个地方。链接可以指向打开文档的特定部分，也可以指向全新的页面。\n\
  \n将用户带到新页面。\n```html\n<a href=\"http://www.joyofphp.com\">访问 Joy of PHP!</a>\n```\n\
  \n将用户带到当前页的不同位置（由标签 `<a id=\"top\">` 所示）：\n```html\n<a href=\"#top\">回到顶部</a>\n\
  ```\n\n### Lists（列表）\n\n列表有两种类型——有序列表和无序列表。有序列表是有编号的，例如 1, 2, 3，而无序列表是带符号的项目列表。有标签用于开始和结束列表，也有用于列表每个每个项的标签。\n\
  \n有序列表以 `<ol>` 标签开始。无序列表以 `<ul>` 标签开始。每个列表项无论列表类型如何，都以 `<li>` 标签开始并以 `</li>` 结束。\n\
  \n```html\n<ul>\n<li>咖啡</li>\n<li>牛奶</li>\n</ul>\n```\n![](img/00002.jpeg)\n\n###\
  \ Exercise（练习）\n\n制作几个基础的 HTML 文件并将它们放置在计算机的正确位置，这样你就可以在浏览器中打开它们了。包含列表、段落以及粗体和斜体文本。我还没有告诉你如何制作斜体任务。鉴于粗体的标签是\
  \ `<b>`，你认为斜体的标签是什么呢？\n\n## HTML Tables（HTML 表格）\n\n表格非常棒。它们解决了很多问题，但不应用于整个页面的布局。HTML\
  \ 表格应该只用于渲染属于网格的数据，换句话说，就是描述具有相同属性的多个对象。例如，如果在 Microsoft Excel 中显示这些数据是合理的，请使用表格。\n\
  \n表格用 `<table>` 标签定义。表格分为行（使用 `<tr>` 标签），每行又分为数据单元（使用 `<td>` 标签）。`td` 代表 \"table\
  \ data\"，存储数据单元的内容。`<td>` 标签可以包含文本、链接、图像、列表、表单、其他表格等。\n\n### Table Example（表格示例）\n\
  \n```html\n<table border=\"1\">\n<tr>\n<td>行 1 单元格 1</td>\n<td>行 1 单元格 2</td>\n\
  </tr>\n<tr>\n<td>行 2 单元格 1</td>\n<td>行 2 单元格 2</td>\n</tr>\n</table>\n```\n*(注：原文示例代码内容不完整或为占位符，翻译时保持逻辑结构，此处根据语意进行了结构对齐处理)*\n\
  ```html\n<table border=\"1\">\n<tr>\n<td>row 1, cell 1</td>\n<td>row 1, cell 2</td>\n\
  </tr>\n<tr>\n<td>row 2, cell 1</td>\n<td>row 2, cell 2</td>\n</tr>\n</table>\n```\n\
  \n### HTML Tables and Border Attribute（HTML 表格与边界属性）\n\n如果不指定边界，表格将显示：\n```html\n\
  <table>\n<tr>\n<td>row 1</td>\n<td>row 2</td>\n</tr>\n</table>\n```\n\n### HTML\
  \ Table Headers（HTML 表头）\n\n表格中的头用 `<th>` 标签定义。\n\n```html\n<table border=\"1\"\
  >\n<tr>\n<th>Header 1</th>\n<th>Header 2</th>\n</tr>\n</table>\n```\n![](img/0004.jpeg)\n\
  \n## HTML Forms（HTML 表单）\n\nHTML 表单特殊的 HTML 页面，用于将数据传递给服务器。一旦服务器获取了数据，可以对其进行处理并返回，也可以将其存储在数据库中以后使用。\n\
  \nHTML 表单将包含输入元素，如标签、文本字段、复选框、单选按钮、提交按钮等。表单还可以呈现列表让用户从中选择，或者允许多行输入的文本区域。\n\n表单的基本结构如下：\n\
  \n```html\n<form>\n.\n</form>\n```\n\n表单标签放在 `<body>` 标签内部。表单中的数据被发送到表单 `action`\
  \ 属性指定的页面。\n\n```html\n<form name=\"input\" action=\"PostSignup.php\" method=\"\
  get\">\n```\n我们将稍后介绍表单动作。\n\n### The Input tag（Input 标签）\n\n常见的表单元素是 `<input>` 元素，用于从用户处收集信息。`<input>`\
  \ 元素有多种变体，取决于 `type` 属性。`<input>` 元素还有一个 `name` 属性，以便后续引用。通用语法为：\n\n```html\n<input\
  \ type=\"type\" name=\"name\"/>\n```\n\n`<input>` 元素可以是文本、复选框、密码、单选按钮、提交按钮等类型。常见的输入类型描述如下：\n\
  \n文本字段：`<input type=\"text\">` 定义了一个用户可以输入文本的单行输入字段：\n\n```html\n<form>\n名：<input\
  \ type=\"text\" name=\"firstname\"/><br>\n姓：<input type=\"text\" name=\"lastname\"\
  />\n</form>\n```\n上述 HTML 代码在浏览器中看起来像这样：\n![](img/0005.jpeg)\n\n密码字段：`<input type=\"\
  password\">` 定义了一个密码字段。密码字段与文本字段一样，只是输入的输入的文字不会显示在屏幕上。\n\n```html\n密码：<input type=\"\
  password\" name=\"pwd\"/>\n```\n\n\n\n\n注意，密码字段并不能保护数据，它只是在屏幕上隐藏数据。\n\n### 单选按钮\
  \ (Radio Buttons)\n`<input type=\"radio\">` 定义一个单选按钮。单选按钮允许用户从有限的展示选项中选择一个（且仅限一个）：\n\
  \n```html\n<body>\n<form>\n选择你喜喜欢的颜色： <br/>\n<input type=\"radio\" name=\"color\"\
  \ value=\"red\"/>红色<br/>\n<input type=\"radio\" name=\"color\" value=\"blue\"/>蓝色<br/>\n\
  <input type=\"radio\" name=\"color\" value=\"green\"/>绿色\n</form>\n</body>\n```\n\
  \n以下是上述 HTML 代码在浏览器中的显示效果：\n\n![](img/00006.jpeg)\n\n### 复选框 (Checkboxes)\n`<input\
  \ type=\"checkbox\">` 定义一个复选框复选框。复选框允许用户从有限的选项中选择零或多个选项。\n\n```html\n<form>\n<input\
  \ type=\"checkbox\" name=\"vehicle\" value=\"Bike\">我有一辆自行车<br>\n<input type=\"\
  checkbox\" name=\"vehicle\" value=\"Car\">我有一辆汽车\n</form>\n```\n\n### 提交按钮 (Submit\
  \ Button)\n`<input type=\"submit\">` 定义一个提交按钮。\n\n当用户填写完表单并准备好将输入的数据发送（提交）到服务器时，就会使用提交按钮。数据会被发送到表单\
  \ `action` 属性指定的页面，这将在下一节中介绍。\n\n## HTML 表单动作与方法 (HTML Form Actions & Methods)\n\
  当你定义一个表单时，有两个必需属性：`action` 和 `method`。`action` 属性（`action=`）指示表单将提交的文件名称。`method`\
  \ 属性（`method=`）指定表单提交的方式。\n\n`action` 属性中定义的文件通常会对接收到的输入进行某些处理，例如将其放入数据库或向用户返回某些值。这里有一个带有\
  \ `action` 和 `method` 属性的简单表单示例。\n\n```html\n<form name=\"input\" action=\"form_action.php\"\
  \ method=\"get\">\n你的名字：<input type=\"text\" name=\"name\"/>\n<input type=\"submit\"\
  \ value=\"提交\">\n</form>\n```\n\n为了本书的内容，我们将假设 `action` 属性指定了一个 PHP 文件的名称。正如你将看到的，`action`\
  \ 属性中指定的 PHP 文件将可以访问表单中的所有值。\n\n## CSS 简介 (Introduction to CSS)\n\n### 什么是 CSS？\n\
  CSS 是 Cascading Style Sheets（级联样式表）的缩写。样式定义了如何显示 HTML 元素，而样式表是样式列表。例如，你可能有一个样式定义\
  \ `<h1>` 元素的样子，另一个样式定义基本段落的样子。\n\n今天所有的浏览器都支持 CSS。学习它，热爱它。\n\n最佳实践规定，样式表应该存储为与 HTML\
  \ 页面分离的独立文件，尽管这并不是唯一支持的配置。你的样式表应该具有 `.css` 扩展名，以便计算机和人类轻松识别。\n\n样式被加入 HTML 4.0 是为了解决一个问题。这个问题是，HTML\
  \ 从未被设计为包含用于文档格式化的标签。HTML 的初衷是定义文档的内容，例如：\n\n```html\n<h1>这是一个标题</h1>\n<p>这是一个段落。</p>\n\
  ```\n\n当 `<font>` 标签和颜色属性被添加到 HTML 3.2 规范时，它无意中为 Web 开发者造成了巨大的混乱。虽然能对网页的外观进行这种控制非常棒，但大型网站的开发突然变得更加繁琐和昂贵。为了获得营销人员渴望的独特“企业视觉识别系统”，现在必须在每个页面中添加字体和颜色信息。更糟糕的是，更改一个本应该是简单的事情（例如，所有标题现在都应该是橙色的——如\
  \ Amazon.com 的情况所示）意味着要编辑每一个页面。又是这样。唉。\n\n为了解决这个问题，世界维网联盟 (W3C) 创建了 CSS。在 HTML 4.0\
  \ 中，所有的格式都可以从 HTML 文档中移除，并存储在独立的 CSS 文件中。\n\n### 外部样式表 (External Style Sheets) 可以节省大量工作\n\
  样式表应该存储为与 HTML 页面分离的独立文件，尽管这并不是唯一支持的配置。你的样式表应该具有 `.css` 扩展名，以便计算机和人类轻松识别。\n\n外部样式表可以节省大量工作。外部样式表存储在\
  \ CSS 文件中。使用外部样式表，你可以通过 `<link>` 标签将其链接到页面。\n\n如果你使用了上面的样式表，将发生以下变化：\n1. 背景颜色将变为黄色。\n\
  2. `<h1>` 标题将变为橙色。\n3. 段落中的所有文字将变为 20 点。\n\n外部样式表可以存储在 CSS 文件中。使用外部样式表，你可以通过 `<link>`\
  \ 标签将其链接到页面。\n\n```html\n<head>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"\
  mystyle.css\">\n</head>\n```\n\n外部样式表可以存储在 CSS 文件中。使用外部样式表，你可以通过 `<link>` 标签将其链接到页面。\n\
  \n使用外部样式表，你可以通过 `<link>` 标签将其链接到页面。\n\n外部样式表可以存储在 CSS 文件中。使用外部样式表，你可以通过 `<link>`\
  \ 标签将其链接到页面。\n\n外部样式表可以存储在 CSS 文件中。使用外部样式表，你可以通过 `<link>` 标签将其链接到页面。\n\n外部样式表可以存储在\
  \ CSS 文件中。使用外部样式表，你可以通过 `<link>` 标签将其链接到页面。\n\n外部样式表可以存储在 CSS 文件中。使用外部样式表，你可以通过\
  \ `<link>` 标签将其链接到页面。\n\n外部样式表可以存储在 CSS 文件中。使用外部样式表，你可以通过 `<link>` 标签将其链接到页面。\n\n\
  外部样式表可以存储在 CSS 文件中。使用外部样式表，你可以通过 `<link>` 标签将其链接到页面。\n\n外部样式表可以存储在 CSS 文件中。使用外部样式表，你可以通过\
  \ `<link>` 标签将其链接到页面。\n\n外部样式表可以存储在 CSS 文件中。使用外部样式表，你可以通过 `<link>` 标签将其链接到页面。\n\n\
  ### CSS 规则语法 (CSS Rule Syntax)\nCSS 规则有两个主要部分：选择器和位于花括号 `{}` 内的声明。选择器是你想要样式的元素。\n\
  \n```css\np {\n  color: red;\n}\n```\n\n外部样式表可以存储在 CSS 文件中。使用外部样式表，你可以通过 `<link>`\
  \ 标签将其链接到页面。\n\n外部样式表可以存储在 CSS 文件中。使用外部样式表，你可以通过 `<link>` 标签将其链接到页面。\n\n外部样式表可以存储在\
  \ CSS 文件中。使用外部样式表，你可以通过 `<link>` 标签将其链接到页面。\n\n外部样式表可以存储在 CSS 文件中。使用外部样式表，你可以通过\
  \ `<link>` 标签将其链接到页面。\n\n外部样式表可以存储在 CSS 文件中。使用外部样式表，你可以通过 `<link>` 标签将其链接到页面。\n\n\
  ### 如何使用样式表 (How to use a Style Sheet)\n好了，现在我们有一个样式表了。如何使用它？要使用样式表，HTML 页面只需通过\
  \ `<link>` 标签将其链接。\n\n```html\n<head>\n<link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"mystyle.css\">\n</head>\n```\n\n使用样式表，你可以通过 `<link>` 标签将其链接到。\n\n### 选择器\
  \ (Selectors)\n正如你所猜的，选择器不仅限于选择单个项目，例如 `<p>` 标签。有很多 CSS 选择器。这里有几个：\n\n![](img/00008.jpeg)\n\
  \n当我们讨论 jQuery 选择器时，我们会介绍更多这些，它们是基于 CSS 选择器的。\n\n### 子元素与后代选择器 (Child vs Descendant)\n\
  你可能注意到某些选择器指的是元素的后代。考虑以下这个后代选择器：\n\n`div p`\n\n这会选择所有 `div` 的后代段落。换句话之，如果段落在 `div`\
  \ 内部，即使它在其他东西内部。\n\n然后是子选择器：\n\n`div > p`\n\n区别是什么？区别在于子选择器只选择直接子元素，而不选择元素的子元素。\n\
  \n### CSS 示例 (CSS Examples)\n这是一个基础示例，将段落文字颜色设置为蓝色：\n\n```css\np {color:blue;}\n\
  ```\n\n```css\np {color:blue;text-align:left;}\n\n这是一个更高级的示例：\n\n```css\nh1 { display:\
  \ block; margin: 20px 0 6px 0; font-size: 1.8em; color: blue; text-decoration: none;\
  \ text-align: center; }\n```\n\n你可能注意到第二个示例读起来要困难得多，因为它读起来像一个连句。为了让 CSS 对人类更易读，最好将每个声明放在单独的一行中，如下所示：\n\
  \n```css\np {\n  color: red;\n  text-align: center;\n}\n```\n\n\n\n\n我强烈建议你养成将声明单独写一行的习惯，并尽可能提高可读性。你会为这样做感到庆幸的。\n\
  \n## CSS 注释\n\n说到可读性，所有正规语言都支持注释，CSS 也不例外。注释用于解释你的代码，当你日后编辑源代码时，它们一定能帮助你——那时你可能忘记了为什么要以某种方式操作，或者某个特定规则的意图是什么。（这个长句写得怎么样？）。浏览器会忽略注释，但用户会赞赏它们。也养成写注释的习惯吧。:)\n\
  \nCSS 注释以 `/*` 开始，以 `*/` 结束，如下所示：\n\n```css\n/*在这里我设置了段落的默认格式*/\np\n{\ntext-align:center;\n\
  color:black;\nfont-family:Arial;\n}\n```\n\n看这样读起来是不是容易得多？\n\n## 指定字体\n\n你可能已经注意到很多声明都提到了字体。正确的字体会对页面的外观产生显著影响。`font-family`\
  \ 属性可以同时包含多个字体名称，这样做是确保最大兼容性的最佳实践。如果浏览器不支持第一个字体，它会尝试下一个字体，依此类推。\n\n从你真正想要的特定字体开始，以你能够接受的通用字体族结束。这种方法将指示浏览器在首选字体可用时从通用字体族中选择一个字体。\n\
  \n示例：\n\n```css\np{font-family:\"Times New Roman\", Times, serif}\n```\n\n## 使用\
  \ CSS 定位元素\n\n### 定位简介\n\nCSS 定位属性允许你在页面上精确地定位元素。它可以将一个元素放置在另一个元素的上方、旁边，甚至指定当元素内容过大时应该发生什么。\n\
  \n元素可以使用 `top`、`bottom`、`left` 和 `right` 属性进行定位。然而，除非先设置 `position` 属性，否则这些属性将不起作用。这些属性的作用也根据定位方法的不同而异。\n\
  \n有四种定位方法：静态 (Static)、固定 (Fixed)、相对 (Relative) 和绝对 (Absolute)。\n\n### 静态定位\n\nHTML\
  \ 元素默认是静态定位的。静态定位的元素根据页面的“标准流”在页面上定位。换句话说，当一个元素是静态的时，它就顺流而。如果你没有指定元素的位置，它就是静态的。\n\
  \n静态定位的元素不受 `top`、`bottom`、`left` 和 `right` 属性的影响。\n\n### 固定定位\n\n固定位置的元素相对于浏览器窗口进行定位。当页面滚动时，它不会移动，因为它不是相对于页面上的任何其他元素进行定位。\n\
  \n这是一个固定定位的示例：\n\n```css\np.fixed\n{\nposition:fixed;\ntop:25px;\nright:15px;\n\
  }\n```\n\n此样式将选择带有 `fixed` 类的段落。固定定位的元素从标准流中移除。页面上的所有其他元素表现就像固定定位元素不存在一样。\n\n###\
  \ 相对定位\n\n相对定位的元素相对于其如果是静态时所在的位置进行定位。例如，我们可以通过修改 `left` 位置将 `h2` 元素移动到其通常位置的左侧或右侧。\n\
  \n对于相对定位的元素，`left` 属性将元素的左边缘相对于正常位置的左/右。\n\n以下规则根据元素所属的类将 `h2` 元素向左或向右移动。例如 `<h2\
  \ class='move_left'>`：\n\n```css\nh2.move_left\n{\nposition:relative;\nleft:-30px;\n\
  }\n\nh2.move_right\n{\nposition:relative;\nleft:30px;\n}\n```\n\n相对定位元素的内容可以移动并可能与其他元素重叠，但元素空间在标准流中仍然被保留。\n\
  \n```css\nh2.pos_top\n{\nposition:relative;\ntop:-50px;\n}\n```\n\n相对定位元素经常被用作绝对定位元素的容器块。\n\
  \n### 绝对定位\n\n绝对定位元素元素相对于第一个非静态位置的父元素进行定位。如果没有找到此类元素，则包含块为 `<html>`。\n\n```css\n\
  h2\n{\nposition:absolute;\nleft:100px;\ntop:150px;\n}\n```\n\n绝对定位的元素从标准流中移除。文档和其他元素表现就像绝对定位元素不存在一样。\n\
  \n绝对定位元素可以与其他元素重叠。我们接下来讨论这个。\n\n### 元素重叠\n\n当元素定位在标准流之外时，它们可能会与其他元素重叠。当两个元素重叠时，你如何决定哪个元素在前，哪个元素在后？这由名为\
  \ `z-index` 的属性决定。（我猜是叫 Zachary 的人想出的词。）\n\n`z-index` 属性指定了元素的“堆叠顺序”。想象一组 3 个堆叠在一起的块。最顶部的块\
  \ `z-index` 为 3，最底部的块 `z-index` 将为 1。从上方观察堆叠层，顶部的块最可见，所以你可以认为它在前面。底部的块可以被认为在堆叠的后面。\n\
  \n元素可以有一个正或负的堆叠顺序：\n\n```css\nimg\n{\nposition:absolute;\nleft:0px;\ntop:0px;\n\
  z-index:-1;\n}\n```\n\n`z-index` 较大的元素位于 `z-index` 较小的元素前面。注意：如果两个元素重叠且没有指定 `z-index`，\
  \ HTML 代码中后定义的元素将显示上方。\n\n## jQuery 选择器\n\n### 什么是 jQuery 选择器\n\njQuery 选择器的概念是真正理解\
  \ jQuery 世界的最重要的概念之一。那么，什么是 jQuery 选择器？选择器使用 CSS 语法来选择元素或元素集，以便对其执行操作。\n\n理解 jQuery\
  \ 选择器是有效使用该库的关键。好消息是，如果你以前用过 CSS，你已经知道了大部分内容。\n\n一个 jQuery 语句通常遵循语法：\n\n`$(selector).methodName()`\n\
  \n选择器是一个表达式，用于标识后续方法操作的元素集。本章将关注选择器，而后续章节将关注方法。\n\n许多 jQuery 操作也可以组合：\n\n`$(selector).method1().method2().method3()`\n\
  \n作为一个示例，假设我们想要隐藏 ID 为 `goAway` 的 DOM 元素并添加类 `incognito`：\n\n`$(\"#goAway\").hide().addClass(\"\
  incognito\")`\n\n### jQuery 选择器返回什么\n\n当 jQuery 选择器应用于 Web 页面时，底层发生的是一个复杂的 JavaScript\
  \ 函数正在检查 DOM 中的每个元素。在检查每个元素时，它都会与选择器进行比较。匹配选择器的 DOM 元素被放入一个只包含匹配项的“特殊列表”。当整个文档检查完成后，该匹配元素列表将被“返回”，以便进行操作。\n\
  \n当你学习 jQuery 时——你有成百千千的资源可以这样做——你可能会看到被选项目列表被称为“匹配集”(matched set)、“包装集”(wrapped\
  \ set) 或“结果集”(result set)。它们都是同一个意思——即在 DOM 元素与选择器进行比较时被放入的那个“特殊列表”。\n\n\n\n\n\n\
  我个人更倾向于使用“结果集”（result set）这个术语，因为它符合选择器基本上是对文档执行查询并返回结果的理念。但仅仅因为我喜欢结果集这个词，并不意味着我在之后会让你感到困惑。请理解，这些术语是可以互换的，意思完全相同。在后续的学习过程中，我可能会在这里混用它们，以此帮助你保持清醒。\n\
  \n# jQuery 选择器的类型\n\njQuery 选择器分为三类：基础 CSS 选择器、位置选择器和自定义 jQuery 选择器。基础选择器被称为“查找选择器”（find\
  \ selectors），因为它们用于在 DOM 中查找元素。位置选择器自定义选择器是“过滤选择器”（filter selectors），因为它们用于过滤（或精调）一组元素。\n\
  \n## 基础 CSS 选择器\n\n以下 jQuery 选择器遵循标准的 CSS3 选择器语法。以下选择器的任何变体都可以作为 jQuery 命令的选择器参数使用：\n\
  \n```javascript\n$(selector).methodName();\n```\n\n### 选择器的实际示例\n\n- `$(\"p\")`\
  \ 选择所有的 `<p>` 元素\n- `$(\"h1\")` 选择所有的 `<h1>` 元素\n- `$(\"div a\")` 选择 `<div>` 元素内所有的锚点标签\
  \ (`<a>`) 元素\n- `$(\"p>div\")` 选择所有作为 `<p>` 元素直接子元素的 `<div>` 元素\n- `$(\"div~h2\"\
  )` 选择前面有 `<h2>` 元素的 `<div>` 元素\n- `$(\"p:has(b)\")` 选择所有包含加粗文本的段元素\n- `$(\"div.className\"\
  )` 选择所有类名为 `className` 的 `<div>` 元素\n- `$(\".className \")` 选择所有类名为 `className`\
  \ 的元素\n- `$(\"#IDvalue\")` 选择 id 值为 `IDvalue` 的元素\n- `$(\"img[alt]\")` 选择所有具有 `alt`\
  \ 属性的图像 (`<img>` 元素）\n- `$(\"a[href$=.pdf]\")` 选择所有链接到 PDF 文件的锚点。它选择所有 `href` 属性以\
  \ `.pdf` 结尾的 `<a>` 元素\n\n你可以访问 [`www.w3schools.com/jquery/trysel.asp?filename=trysel_basic&jqsel=p.intro,%23choose`](http://www.w3schools.com/jquery/trysel.asp?filename=trysel_basic&jqsel=p.intro,%23choose)\
  \ 来练习 jQuery 选择器。\n\n## 多重选择器\n\n如果用逗号分隔多个选择器，可以将它们合并到一个语句中。例如，选择器 `$(\"ul,ol\"\
  )` 将选择所有的列表 (`<ul>` 和 `<ol>`) 元素。\n\n## 位置选择器\n\n位置选择器根据元素之间的位置关系选择元素。这些选择器可以附加到任何基础选择器（我们记为\
  \ `BaseSelector`）之后，以根据位置过滤匹配项。如果省略基础选择器，则假设为 `*`（所有元素）。\n\n### 示例位置选择器语法\n\n- `BaseSelector:first`:\
  \ 选择页面上第一个匹配基础选择器的元素。\n- `BaseSelector:last`: 选择页面上最后一个匹配基础选择器的元素。\n- `BaseSelector:first-child`:\
  \ 选择所有匹配基础选择器且为第一个元素的元素。\n- `BaseSelector:last-child`: 选择所有匹配基础选择器且为最后一个元素的元素。\n\
  - `BaseSelector:only-child`: 选择所有匹配基础选择器且为唯一子元素的元素。\n- `BaseSelector:nth-child(n)`:\
  \ 选择所有匹配基础选择器且为第 n 个子元素。计数从 1 开始。\n- `BaseSelector:nth-child(odd|even)`: 选择所有匹配基础选择器且为偶数或奇数子元素。第一个元素被视为奇数（计数从\
  \ 1 开始）。\n- `BaseSelector:even`: 选择所有匹配基础选择器的偶数元素。\n- `BaseSelector:odd`: 选择所有匹配基础选择器的奇数元素。\n\
  - `BaseSelector:eq(n)`: 选择匹配基础选择器的元素集中的第 n 个元素。计数从 0 开始。\n- `BaseSelector:gt(n)`:\
  \ 选择匹配基础选择器且大于第 n 个元素的元素（不包含 n）。计数从 0 开始。\n- `BaseSelector:lt(n)`: 选择匹配基础选择器且小于第\
  \ n 个元素的元素（不包含 n）。计数从 0 开始。\n\n### 实际示例\n\n- `$(\"p:first\")` 选择页面上的第一个段落。\n- `$(\"\
  img[src$=.png]:first\")` 选择页面上第一个 `src` 属性以 `.png` 结尾的 `<img>` 元素\n- `$(\"button.small:last\"\
  )` 选择页面上最后一个类名为 `small` 的 `<button>` 元素\n- `$(\"li:first-child\")` 选择所有在列表中作为第一个元素的\
  \ `<li>` 元素\n- `$(\"a:only-child\")` 选择所有在其父元素内是唯一的 `<a>` 元素\n- `$(\"li:nth-child(2)\"\
  )` 选择所有在列表中处于第二个的 `<li>` 元素\n- `$(\"tr:nth-child(odd)\")` 选择表格中所有奇数的 `<tr>` 元素\n\
  - `$(\"div:nth-child(5n)\")` 选择每 5 个 `<div>` 元素\n- `$(\"div:nth-child(5n+1)\")`\
  \ 选择每 5 个 `<div>` 元素之后的元素\n- `$(\".someClass:eq(1)\")` 选择类名为 `someClass` 的第二个元素\n\
  - `$(\".someClass:gt(1)\")` 选择除前两个之外的所有类名为 `someClass` 的元素\n- `$(\".someClass:lt(4)\"\
  )` 选择类名为 `someClass` 的前四个元素\n\n注意 `:nth-child` 选择器的计数从 1 开始，而大多数 jQuery 选择器（如 `:eq`、`:gt`\
  \ 和 `:lt`）从 0 开始。\n\n## jQuery 自定义选择器\n\njQuery 提供这些选择器是为了实现 CSS 规范未预料到的常用或方便的选择。与位置选择器类似，这些选择器过滤一个基础匹配项（我们记为\
  \ `B`）。省略 `B` 被解释为所有元素集。这些选择器可以组合；请查看选择器组合示例。\n\n- `BaseSelector:enabled`: 选择匹配基础选择器且处于启用状态的元素。\n\
  - `BaseSelector:button`: 选择匹配基础选择器且为任何按钮类型的元素。\n- `BaseSelector:input`: 选择匹配基础选择器的控件——例如\
  \ `<input>`、`<select>`、`<textarea>` 和 `<button>` 元素。\n- `BaseSelector:checkbox`:\
  \ 选择匹配基础选择器类型为 checkbox 的元素。例如此选择器会选择 `<input type=\"checkbox\" name=\"colors\"\
  >`。\n- `BaseSelector:image`: 选择匹配基础选择器且类型为图像的元素。\n- `BaseSelector:file`: 选择匹配基础选择器且类型为文件的元素。\n\
  - `BaseSelector:radio`: 选择匹配基础选择器且为 `input[type=radio]` 的元素。\n- `BaseSelector:text`:\
  \ 选择匹配基础选择器且类型为文本的元素。\n- `BaseSelector:password`: 选择匹配基础选择器且类型为密码的元素。\n- `BaseSelector:submit`:\
  \ 选择匹配基础选择器且为 `input type=submit` 或 `button type=submit` 的元素。\n- `BaseSelector:reset`:\
  \ 选择匹配基础选择器且为 `input[type=reset]` 或 `button[type=reset]` 的元素。\n- `BaseSelector:hidden`:\
  \ 选择匹配基础选择器且隐藏的元素。\n- `BaseSelector:header`: 选择匹配基础选择器且为标题 `<h1>` 到 `<h6>` 的元素。\n\
  - `BaseSelector:not(f)`: 选择匹配基础选择器但不符合 `not()` 中指定的过滤选择器的元素。过滤选择器是任何以冒号(:)开头的选择器。\n\
  - `BaseSelector:parent`: 选择匹配基础选择器且具有非空子元素的元素。\n- `BaseSelector:selected`: 选择匹配基础选择器且处于选中状态的元素。只有\
  \ `<option>` 元素可能拥有此状态。\n- `BaseSelector:animated`: 选择匹配基础选择器且正通过一个 jQuery 动画方法进行动画控制的元素。\n\
  - `BaseSelector:visible`: 选择匹配基础选择器且可见的元素。\n\n\n\n\n如你所见，jQuery 选择器既强大强大又提供了灵活性，让你创建一个一组\
  \ DOM 元素（称为结果集或匹配集），你可以使用 jQuery 方法对这些元素进行操作。让我们再看一组示例。\n\n`$(\"img:animated\")`\
  \ 选择所有正在进行动画的图像元素。\n\n`$(\":button:disabled\")` 选择所有禁用的按钮。这将是启用这些按钮的一种方便方法。\n\n\
  `$(\"input:radio:checked\")` 选择所有被选中的单选元素。\n\n`$(\"option:not(:selected)\")` 选择所有未选中的\
  \ `<option>` 元素。\n\n`$(\":text:visible\")` 选择所有可见的文本字段。\n\n`$(\"#myForm button:not(.someClass)\"\
  )` 选择 id 为 `myForm` 的 `<form>` 标签中所有不具备 `someClass` 类名的按钮。\n\n`$(\"select[name=choices]\
  \ :selected\")` 选择名为 `choices` 的 `<select>` 元素中被选中的 `<option>` 元素。\n\n`$(\"p:contains(hello\
  \ world)\")` 选择包含文本 'hello world' 的所有 `<p>` 元素。\n\n# JavaScript 对象\n\n观众中的 JavaScript\
  \ 程序员会发现，应用选择器产生的结果集可以被视为 JavaScript 数组。从技术上讲，它是 jQuery 为我们屏蔽掉的 JavaScript 数组。尽管如此，有时使用数组索引访问结果集中的元素也是有用的。\n\
  \n例如：\n\n```\nvar element = $(\"img\")[0];\n```\n\n这将把变量 `element` 设置为匹配集中的第一个元素。\n\
  \n# 对结果集采取操作\n\n虽然 jQuery 选择器在识别要将哪些 DOM 元素添加到结果集时给了我们极大的灵活性，但有时某些标准是无法通过选择器单独的。此外，在\
  \ jQuery 方法链的过程中，我们可能希望在方法调用之间调整结果集的内容。针对这些情况，jQuery 提供了方法，这些方法的操作不是作用于结果集中的元素，而是作用于结果集本身。本节将讨论这些方法。\n\
  \n## 向结果集添加元素\n\n你可以使用 `.add()` 方法向结果集添加额外的元素。\n\n```\nadd(expression)\n```\n\n\
  `expression` 是一个选择器，用于指定要匹配哪些元素。匹配该选择器的元素将尽添加到现有的匹配项中。\n\n给定一个代表一组 DOM 元素的 jQuery\
  \ 对象，`.add()` 方法将根据结果集中的元素与传入方法的元素的并集，构建一个新的 jQuery 对象。`.add()` 的参数几乎可以是 `$()` \
  \ world 接受的任何内容，包括 jQuery 选择器表达式、DOM 元素的引用或 HTML 片段。\n\n## 从结果集中移除元素\n\n如果我们想从结果集中移除元素呢？那是\
  \ `not()` 方法的工作。\n\n```\nnot(expression)\n```\n\n`expression` 是一个选择器，用于指定要匹配哪些元素。不匹配选择器的元素将包含在结果中。\n\
  \n给定一个代表一组 DOM 元素的 jQuery 对象，`.not()` 方法根据匹配元素的子集构建一个新的 jQuery 对象。提供的选择器将对每个元素进行测试；不匹配选择器的元素将包含在结果中。\n\
  \n### 示例\n\n```\n$(\"body *\").css(\"font-weight\",\"bold\").not(\"p\").css(\"color\"\
  ,\"blue\");\n```\n\n将所有 body 元素加粗，然后将段落元素以外的所有元素设为蓝色。\n\n```\n$(\"body *\").css(\"\
  font-weight\",\"bold\").not(anElement).css(\"color\",\"blue\");\n```\n\n与上一个示例类似，区别是变量\
  \ `anElement` 引用的元素未包含在第二个集合中（因此不会被染成蓝色）。\n\n## 查找后代元素\n\n有时，将元素搜索限制在结果集中之前确定的元素的后代中是有用的。`find()`\
  \ 方法正是此功能：\n\n```\nfind(expression)\n```\n\n`expression` 是一个选择器，用于指定要匹配哪些后代元素。\n\
  \n与之前检查的方法不同，`find()` 仅接受选择器表达式作为参数。将在现有匹配集中的元素中搜索匹配该表达式的后代元素。原始匹配集中任何匹配选择器的元素都不会被包含在新集合中。\n\
  \n给定一个代表一组 DOM 元素的 jQuery 对象，`.find()` 方法允许我们搜索 DOM 树中这些元素的后代，并从匹配的元素构建一个一个新的 jQuery\
  \ 对象。`.find()` 和 `.children()` 方法类似，区别在于后者只在 DOM 树中向下移动一层。\n\n`.find()` 方法的第一种签名接受与我们可以传递给\
  \ `$()` 函数相同类型的选择器表达式。将通过测试元素是否匹配此选择器来对其进行过滤。\n\n### 示例\n\n```\n$(\"div\").css(\"\
  background-color\",\"blue\").find(\"img\").css(\"border\",\"1px solid aqua\");\n\
  ```\n\n选择所有 `<div>` 元素，将其背景设为蓝色，选择这些 `<div>` 元素的后代 `<img>` 元素（而不是不是后代的 `<img>` 元素），并为它们设置青色边框。\n\
  \n## 过滤匹配集\n\n当需要对匹配集的过滤进行更细粒度的控制时，`filter()` 方法变得非常有用：\n\n```\nfilter(selector)\n\
  ```\n\n`selector` 是一个表达式，用于指定要保留哪些元素。\n\n`filter` 函数也可以传递一个函数，但这超出了本书的范围。当传递选择器时，它的作用类似于\
  \ `not()` 的相反，保留匹配选择器的元素（而不是排除它们）。\n\n```\n$(\".invisible\").show().filter(\"img[src$=.gif]\"\
  ).attr(\"title\",\"Hello world!\");\n```\n\n# 使用 jQuery 进行表单验证\n\n## 简介 - 表单验证\n\
  \nJavaScript 的主要用途之一是表单验证。其理念是防止用户提交包含“无效”数据的表单。\n\n\n\n\n\n```css\n08 .submit {\
  \ margin-left: 13em; margin-top: 2em;}\n</style>\n```\n\n第 4 - 9 行包含格式化文档的样式。第 5\
  \ 行使用了 `*` 选择器，它选择所有元素，并将默认字体设置为 Arial。第 6 行定义了标签的样式，第 7 行定义了输入元素的样式，第 8 行定义了提交按钮的样式。\n\
  \n```html\n11 </head>\n<body>\n```\n\n第 11 行关闭了 `HEAD` 区域，第 12 行开始 body 区域。\n\n\
  ```html\n13 <form id=\"comments\" method=\"get\" action=\"\">\n<fieldset>\n<legend>没有验证或消息的简单表单</legend>\n\
  ```\n\n第 13 行开始表单。对于 jQuery 而言，重要的标签是 `id` 属性，在此例中为 `'comments'`。我们将使用这个 `id` 来告诉\
  \ jQuery 应该验证哪个表单。第 14 行开始一个 `fieldset`。\n\n`fieldset` 标签将表单中相关的元素分组在一起。\n\n```html\n\
  16 <div>\n<label for=\"name\">Name</label>\n<input id=\"name\" name=\"name\" />\n\
  </div>\n20 <div>\n<label for=\"email\" style=\"height: 1px\">E-Mail</label>\n<input\
  \ id=\"email\" name=\"email\" />\n</div>\n24 <div>\n<label for=\"url\">URL (optional)</label>\n\
  <input id=\"url\" name=\"url\" class=\"url\" value=\"\" />\n</div>\n28 <div>\n<label\
  \ for=\"ccomment\">Your comment</label>\n<textarea id=\"ccomment\" name=\"comment\"\
  ></textarea>\n</div>\n32 <div>\n<input class=\"submit\" type=\"submit\" value=\"\
  Submit\"/>\n</</div>\n</fieldset>\n```\n\n第 16 – 35 行定义了表单上的字段。第 33 行是提交按钮。\n\n\
  ```html\n36 </form>\n</body>\n</html>\n```\n\n第 36 行关闭表单，第 37 行关闭 body，第 38 行关闭\
  \ html 文档。\n\n# 带有 jQuery 验证的表单\n\n我还提供了一个带有验证的表单版本。该页面名为 `'validation.html'`。\n\
  \n## 代码\n\n```html\n01. <!DOCTYPE html>\n02. <html>\n03. <head>\n04. <script src=\"\
  jquery.min.js\"></script>\n05. <script src=\"jquery.validate.js\"></script>\n07.\
  \ <style type=\"text/css\">\n08. * { font-family: Arial; }\n09. label { width: 10em;\
  \ float: left; }\n10. label.error { float: none; color: red; padding-left: .5em;\
  \ vertical-align: top; }\n11. div { clear: both; }\n12. input, textarea { width:\
  \ 15em; }\n13. .submit { margin-left: 10em; }\n</style>\n15. <script type=\"text/javascript\"\
  >\n16. jQuery(document).ready(function($){\n17. $(\"#comments\").validate();\n18.\
  \ });\n</script>\n20. </head>\n21. <body>\n22. <form id=\"comments\" method=\"get\"\
  \ action=\"\">\n23. <fieldset>\n<legend>带有基础验证和消息的简单表单</legend>\n25. <div>\n<label\
  \ for=\"name\">Name</label>\n<input id=\"name\" name=\"name\" class=\"required\"\
  \ minlength=\"2\" />\n</div>\n29. <div>\n<label for=\"email\">E-Mail</label>\n<input\
  \ id=\"email\" name=\"email\" class=\"required email\" />\n</div>\n33. <div>\n<label\
  \ for=\"url\">URL (optional)</label>\n<input id=\"url\" name=\"url\" class=\"url\"\
  \ value=\"\" />\n</div>\n37. <div>\n<label for=\"comment\">Your comment</label>\n\
  <textarea id=\"comment\" name=\"comment\" class=\"required\"></textarea>\n</div>\n\
  41 <div>\n<input class=\"submit\" type=\"submit\" value=\"Submit\"/>\n</</div>\n\
  </fieldset>\n45. </form>\n46. </body>\n47. </html>\n```\n\n### 代码解释\n\n上面的代码包含了\
  \ jQuery 验证插件。我们使用 `jQuery(document).ready(function($){` 来确保代码在 DOM 完全加载后运行。然后我们调用\
  \ `$(\"#comments\").validate();` 为带有 `id=\"comments\"` 的表单初始化验证。\n\nCSS 包含了格式化表单的样式。例如，`*`\
  \ 选择器将全局字体设置为 Arial，`label.error` 类用于用红色显示错误消息。\n\n\n\n\n一旦你有了自己喜欢的主题，就可以将该主题下载到计算机上。点击下载按钮时，你将被带到“下载生成器”（Download\
  \ Builder）页面，在其中你可以你可以下载整个 `jQuery` 库，也可以挑选你需要的项目。如果你的目标是获取尽可能小的下载包，这非常容易。\n\n当你获得下载内容时，它将以压缩包的形式出现，其中包含\
  \ `jQuery` 库、`CSS` 文件和一个演示页面。打开演示文件将显示你的主题的外观，并提供一些示例代码供你参考，查看它是如何应用的。这里是我在研究此书时下载的示例文件的部分截图：\n\
  \n![](img/00010.jpeg)\n\n`CSS` 文件夹是存储主题的地方。那里会有一个 `CSS` 文件和一个包含小部件用图像的文件夹。将这些文件放置在网站上并引用该\
  \ `CSS` 文件，你就可以开始添加使用该主题的小部件了。\n\njQuery Widgets CDN\n\n同样，Microsoft 和 Google 都为\
  \ `jQuery UI` 提供了内容分发网络（CDN）。它们还提供了库中主题的 `CSS` 链接。你可以在下方找到这些链接：\n\n[`ajax.googleapis.com/ajax/libs/jqueryui/1.8.10/jquery-ui.js`](http://ajax.googleapis.com/ajax/libs/jqueryui/1.8.10/jquery-ui.js)\n\
  \nMicrosoft: [`www.asp.net/ajaxlibrary/CDNjQueryUI1910.ashx`](http://www.asp.net/ajaxlibrary/CDNjQueryUI1910.ashx)\n\
  \nGoogle: http://www.devcurry.com/2010/05/latest-jquery-and-jquery-ui-theme-links.html\n\
  \n引用 jQuery UI\n\n现在你已经有了主题，是时候开始为你的网站添加 `jQuery UI` 了。如上所述，你需要引用这些库和 `CSS` 文件。在你的\
  \ `<head>` 标签中，你需要添加以下内容：\n\n```html\n<head>\n<script src=\"http://code.jquery.com/jquery-1.9.1.js\"\
  ></script>\n<script src=\"http://code.jquery.com/ui/1.10.3/jquery-ui.js\"></script>\n\
  <script src=\"js/jquery-ui-1.10.3.custom.js\"></script>\n</head>\n```\n\n第一个引用是\
  \ `jQuery` 库的 `<script>` 引用。第二个 `<script>` 引用是 `jQuery UI` 库的。第三个也是最后一个 `<script>`\
  \ 引用是添加主题的 `jQuery UI` `CSS` 文件。前两个 `<script>` 引用是让 `jQuery UI` 运行所必需的。你不一定要有主题，但如果没有主题，UI\
  \ 看起来会很单调。\n\n现在我们已经添加了 `jQuery UI` 的适当链接，现在可以添加一些小部件和其他项目了。让我们添加一个日历小部件。在 `<head>`\
  \ 标签中，我们添加这些：\n\n```javascript\n<script>\n$(document).ready(function () {\n  $(\"\
  #datepicker\").datepicker();\n});\n</script>\n```\n\n在 body 标签中，我们添加这些：\n\n```html\n\
  <p>Date: <input id=\"datepicker\" type=\"text\"></p>\n```\n\n这段代码的作用是将 `\"datepicker\"\
  ` 小部件挂载到 `<input>` 框上。让我们在下一节中更详细地检查它。\n\n### Date Picker\n\nWeb 表单上的常见需求是让用户输入日期。在原生\
  \ HTML 中，唯一的选择是给用户一个文本字段，并希望他们输入有效的日期。\n\n![](img/00011.jpeg)\n\n`jQuery` 日期字段让用户输入日期变得简单。日期选择器修改了标准表单输入字段的行为。只需聚焦输入字段（点击或使用\
  \ tab 键），一个交互式日历就会神奇地出现。选择一个日期，选中的日期将显示为输入框的值。\n\n![](img/00012.jpeg)\n\n### Code\n\
  \n```html\n01 <!doctype html>\n02\n03 <html lang=\"en\">\n04 <head>\n05 <meta charset=\"\
  utf-8\" />\n06 <title>jQuery UI Datepicker - Default functionality</title>\n07 <link\
  \ rel=\"stylesheet\" href=\"jquery-ui.css\" />\n08 <script src=\"jquery-1.9.1.js\"\
  ></script>\n09 <script src=\"jquery-ui.js\"></script>\n10\n11 <script>\n12 $(function()\
  \ {\n13 $( \"#datepicker\" ).datepicker();\n14 });\n15 </script>\n16 </head>\n17\
  \ <body>\n18 <h1>Joy of jQuery</h1>\n19 <h2>When you would like to bring in your\
  \ car for service?</h2>\n20\n21 <p>Date: <input type=\"text\" id=\"datepicker\"\
  \ /></p>\n22\n23\n24 </body>\n25 </html>\n```\n\n### Code 解释\n\n```html\n01 <!doctype\
  \ html>\n02\n03 <html lang=\"en\">\n04 <head>\n05 <meta charset=\"utf-8\" />\n06\
  \ <title>jQuery UI Datepicker - Default functionality</title>\n07 <link rel=\"stylesheet\"\
  \ href=\"jquery-ui.css\" />\n08 <script src=\"jquery-1.9.1.js\"></script>\n09 <script\
  \ src=\"jquery-ui.js\"></script>\n10\n11 <script>\n12 $(function() {\n13 $( \"#datepicker\"\
  \ ).datepicker();\n14 });\n15 </script>\n16 </head>\n17 <body>\n18 <h1>Joy of jQuery</h1>\n\
  19 <h2>When you would like to bring in your car for service?</h2>\n20\n21 <p>Date:\
  \ <input type=\"text\" id=\"datepicker\" /></p>\n```\n\n第 6 行设置了 `title`。第 7 行是\
  \ `CSS` 文件。第 8 行是 `jQuery` 库。第 9 行是 `jQuery UI` 库。第 11 行开始 `<script>`。第 12 行打开 `function`。第\
  \ 13 行调用了 `$(\"#datepicker\")()`。第 14 行结束了 `function`。第 15 行结束了 `<script>`。第 16\
  \ 行结束了 `</head>`。第 17 行是 `<body>`。第 18 行是 `<h1>`。第 19 行是 `<h2>`。第 21 行是 `<p>`。\n\
  \n### 自动补全文本字段\n\n有时可能的数值范围会让单选按钮变得很尴尬。一个棒的解决方案是提供一个文本框并在用户输入时建议值。例如，当我向框中输入 `jq`\
  \ 时，Google 会自动建议我想要的内容。\n\n![](img/00013.jpeg)\n\n我们如何为我们的应用程序添加如此酷的功能？`jQuery`\
  \ 让这一切变得简单！请考虑以下示例：\n\n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n<meta\
  \ charset=\"utf-8\" />\n<title>Joy of jQuery - Autocomplete</title>\n<link rel=\"\
  stylesheet\" href=\"http://code.jquery.com/ui/1.10.3/themes/smoothness/jquery-ui.css\"\
  \ />\n<script src=\"http://code.jquery.com/jquery-1.9.1.js\"></script>\n<script\
  \ src=\"http://code.jquery.com/ui/1.10.3/jquery-ui.js\"></script>\n<script>\n$(function()\
  \ {\nvar carTypes = [\n\"Audi\",\n\"BMW\",\n\"Buick\",\n\"Cadillac\",\n\"Chevrolet\"\
  ,\n\"Chrysler\",\n\"Dodge\",\n\"Ferrari\",\n\"Fiat\",\n\"Fiskar\",\n\"GMC\",\n\"\
  Honda\",\n\"Hyundai\",\n\"Infiniti\",\n\"Jaguar\",\n\"Jeep\",\n\"Kia\",\n\"Mazda\"\
  ,\n\"Mercedes-Bens\",\n\"Mitsubishi\",\n\"Nissan\",\n\"Porsche\",\n\"Rolls-Royce\"\
  ,\n\"Scion\",\n\"Suburu\",\n\"Toyota\",\n\"Volkswagon\",\n\"Volvo\"\n];\n\n$(\"\
  #tags\" ).autocomplete({\nsource: carTypes\n});\n});\n</script>\n</head>\n<body>\n\
  <h1>Joy of jQuery - Sam's Used Cars</h1>\n<h2>What kind of car are you looking for?</h2>\n\
  <div class=\"ui-widget\">\n<label for=\"tags\">Manufacturer: </label>\n<input id=\"\
  tags\" />\n</div>\n</body>\n</html>\n```\n\n这就是完成后表单看起来的样子。一个标记为 `\"Manufacturer\"\
  ` 的文本框会在你开始输入时自动填充汽车品牌。这太酷了，你只需在自己的网页中任何可以添加的地方添加它！\n\n![](img/00014.jpeg)\n\n\n\
  \n第 1-2 行将文档设置为 html。第 3 行开始 `head` 区域。第 4 行设置字符集，可能不需要。第 5 行是页面标题，当页面激活时显示在浏览器的顶部。\n\
  \n```html\n06. <link rel=\"stylesheet\" href=\"http://code.jquery.com/ui/1.10.3/themes/smoothness/jquery-ui.css\"\
  \ />\n07. <script src=\"http://code.jquery.com/jquery-1.9.1.js\"></script>\n08.\
  \ <script src=\"http://code.jquery.com/ui/1.10.3/jquery-ui.js\"></script>\n```\n\
  \n第 6 行是 jQuery UI 样式表的链接。关于什么是样式表，请参见相关章节。\n\n第 7 行下载基础 jQuery 代码，而第 8 行下载 jQuery\
  \ UI 代码。\n\n```html\n09. <script>\n10. $(function() {\n11. var carTypes = [\n12.\
  \ \"Audi\",\n...\n37. \"Toyota\",\n38. \"Volkswagon\"\n39. ];\n```\n\n第 9 行开始一个脚本块。第\
  \ 10 行是 jQuery `document ready` 事件简短版本的开始。第 11 行声明了一个名为 `carTypes` 的变量，它将是一个数组。该数组由第\
  \ 12 行到 38 行的汽车制造商名称填充。第 39 行关闭变量声明，第 43 行关闭脚本块。\n\n```javascript\n40. $( \"#tags\"\
  \ ).autocomplete({\n41. source: carTypes\n42. });\n43. });\n44. </script>\n45. </head>\n\
  46. <body>\n47. <h1>Joy of jQuery - Sam's Used Cars</h1>\n48. <h2>你正在寻找哪种汽车?</h2>\n\
  49. <div class=\"ui-widget\">\n50. <label for=\"tags\">Manufacturer: </label>\n\
  51. <input id=\"tags\" />\n52. </div>\n53. </body>\n54. </html>\n```\n\n第 40 行是\
  \ jQuery `document ready` 事件简短版本的开始，在第 42 行关闭。\n\n记住，基础 jQuery 语法是 `$(selector).action()`。\n\
  \n如你所见，完全不需要多少代码。单条 jQuery 语句（跨越第 40 和第 41 行）就完成了所有工作。\n\n点左侧的文本（在下方用黄色高亮显示）选择了\
  \ ID 为 'tags' 的页面元素。\n\n```javascript\n$( \"#tags\" ).autocomplete({source:carTypes});\n\
  ```\n\n点右侧的文本（在下方用黄色高亮显示）告诉 jQuery 运行 `autocomplete` 操作，这是 jQuery UI 库提供的一个函数。\n\
  \n某些 jQuery 操作需要参数，而某些则不需要。[自动补全组件](http://api.jqueryui.com/autocomplete/) 接受一个参数，指定将要建议的项目来源。这是合理的，因为你希望控制自动建议的值。\n\
  \n## jQuery UI 按钮\n\n使用 jQuery UI 制作按钮非常简单，它们看起来比标准的 HTML 按钮好看得多。此外，你甚至可以对链接进行看起来像按钮。\n\
  \n![](img/00015.jpeg)\n\n## 代码\n\n```html\n01. <html>\n02. <head>\n03. <title>jQuery\
  \ UI Button - Default functionality</title>\n04. <link rel=\"stylesheet\" href=\"\
  jquery-ui.css\" />\n05. <link href=\"css/alan-theme/jquery-ui-1.10.3.custom.css\"\
  \ rel=\"stylesheet\">\n06.\n07. <script src=\"jquery-1.9.1.js\"></script>\n08. <script\
  \ src=\"jquery-ui.js\"></script>\n09. <script>\n10. $(function() {\n11. $( \"input[type=submit],\
  \ a, button\" )\n12. .button()\n13. });\n14. </script>\n15. </head>\n16. <body>\n\
  17. <h1>Joy of jQuery</h1>\n18. <h2>Examples of the jQuery button widget</h2>\n\
  19.\n20. <button>A button element</button>\n21. <input type=\"submit\" value=\"\
  A submit button\" />\n22. <a href=\"#\">An anchor</a>\n23. </body>\n24. </html>\n\
  ```\n\n### 代码解释\n\n```html\n01. <html>\n02. <head>\n03. <title>jQuery UI Button\
  \ - Basic functionality</title>\n04. <link rel=\"stylesheet\" href=\"jquery-ui.css\"\
  \ />\n05. <link href=\"css/alan-theme/jquery-ui-1.10.3.custom.css\" rel=\"stylesheet\"\
  >\n06.\n07. <script src=\"jquery-1.9.1.js\"></script>\n08. <script src=\"jquery-ui.js\"\
  ></script>\n```\n\n第 1 行将文档设置为 html。第 2 行开始 `head` 区域。第 3 行设置文档标题，当页面激活时显示在浏览器的顶部。第\
  \ 4 行是 jQuery UI 样式表的链接。第 5 行是可选样式表的链接，在章节开头有所描述。\n\n第 7 行下载基础 jQuery 代码，第 8 行下载\
  \ jQuery UI 代码。\n\n\n\n\n敏锐的读者可能已经注意到标题为“反馈”的列表项具有类名 `class=\"ui-state-disabled\"\
  `。这防止了该项目被点击。很聪明，不是吧？这是因为汽车经销商 Sam 并不真的想要你的反馈，他只是想要钱。 :)\n\n# jQuery 进度条\n\n![](img/00019.jpeg)\n\
  \n通常，向用户显示操作状态是有帮助的。在“Sam 的二手车”的案例中，Sam 可能希望用户知道他们距离准备好车辆还有多远。进度条是视觉化这种状态极好的方法。\n\
  \n一条 jQuery 语句就完成了所有工作。\n\n```javascript\n$(function() {\n  $( \"#progressbar\"\
  ).progressbar({value: 37});\n});\n```\n\n再次，这清楚地展示了 jQuery 库惊人的力量。后台正在发生大量的代码。\n\
  \n记住，基础的 jQuery 语法是 `$(selector).action()`。\n\n执行工作的行代码是 `$( \"#progressbar\").progressbar({value:\
  \ 37});`。在这个示例中，我们选择了一个 ID 为 `progressbar` 的 DIV，并告诉 jQuery 对其应用 `progressbar` 函数。`progressbar`\
  \ 函数接受一个 `value` 参数，用于指定进度条应该填充的百分比。\n\n## 示例代码\n\n```html\n01. <!doctype html>\n\
  02. <html lang=\"en\">\n03. <head>\n04. <title>jQuery UI Progressbar - Default functionality</title>\n\
  05. <link rel=\"stylesheet\" href=\"http://code.jquery.com/ui/1.10.3/themes/smoothness/jquery-ui.css\"\
  \ />\n06. <script src=\"http://code.jquery.com/jquery-1.9.1.js\"></script>\n07.\
  \ <script src=\"http://code.jquery.com/ui/1.10.3/jquery-ui.js\"></script>\n08. <link\
  \ rel=\"stylesheet\" href=\"/resources/demos/style.css\" />\n09. <script>\n10. $(function()\
  \ {\n11. $( \"#progressbar\").progressbar({\n12. value: 37\n13. });\n14. });\n15.\
  \ </script>\n16. </head>\n17. <body>\n18. <h1>The Joy of jQuery: Sam's Used Cars</h1>\n\
  19. <p>感谢您将车开到 Sam 的二手车修理厂。</p>\n20. <p>您的车已经修理了 37%…… 换句话说，我们已经成功将其拆解了。</p>\n21.\
  \ <div id=\"progressbar\"></div>\n22. </body>\n23. </html>\n```\n\n此小组件的相关代码可以在第\
  \ `11` 行和第 `21` 行找到。\n\n# jQuery 滑块\n\n滑块控件用于允许用户选择一个值而无需手动输入。相反，用户只需沿着某线移动选择器即可。在合适的情况下，滑块可以非常丝滑易用，但你不想过度使用。\n\
  \n如果你曾经买过二手车，你就知道当你靠近一辆车时，第一个想要得到答案的问题是“这辆车多少钱？”。反之，向你走来的销售人员想要知道的第一个问题是“你的预算是多少？”。\n\
  \n销售人员会非常喜欢这个滑块。对于 Sam 的二手车网站的访问者来说，滑块是一种指定他们愿意花费金额的简单方法，这样就可以向客户展示合适的车辆。它的外观可能是这样的：\n\
  \n![](img/00020.jpeg)\n\n生成滑块的代码（再次）非常简单。我们在表单上创建一个 `div` 并给它一个唯一的 `id`，例如 `'slider'`。在\
  \ jQuery 的文档加载就绪事件中，我们选择该 `div` 并对其应用 `slider` 方法。\n\n`slider` 方法接受多个选项，所有选项的描述可以在\
  \ [`api.jqueryui.com/slider/`](http://api.jqueryui.com/slider/) 中找到。\n\n滑块小组件的一些常用选项包括：`value`、`min`、`max`\
  \ 和 `increment`。\n\n与目前为止显示的组件相比，这个小组件的一个重要区别是，滑块小组件有一个我们需要处理的重要事件以使其变得有用。这就是 `slide`\
  \ 事件。每当滑块控件移动时，`slide` 事件就会被触发。事件中提供的 `ui.value` 值代表了滑块由于当前移动而将具有的值。取消事件将阻止滑块移动，滑块将保持其先先的值。\n\
  \n例如，当用户移动滑块时， Sam 可能希望显示的值为“您愿意每月为车支付 250 美元”之类，以便向用户明确他们所选择的值。\n\n## 代码示例\n\n\
  ```html\n01. <!doctype html>\n02. <html lang=\"en\">\n03. <head>\n04. <meta charset=\"\
  utf-8\" />\n05. <title>Joy of jQuery - Slider</title>\n06. <link rel=\"stylesheet\"\
  \ href=\"jquery-ui.css\" />\n07. <script src=\"jquery-1.9.1.js\"></script>\n08.\
  \ <script src=\"jquery-ui.js\"></script>\n09. <link rel=\"stylesheet\" href=\"/resources/demos/style.css\"\
  \ />\n10. <script>\n11. $(function() {\n12. $( $(\"#slider\").slider({\n13. value:200,\n\
  14. min:100,\n15. max:500,\n16. step:25,\n17. slide: function( event, ui ) {\n18.\
  \ $( \"#amount\").val( \"$\" + ui.value );\n19. }\n20. });\n21. $(\"#amount\").val(\
  \ \"$\" + $(\"#slider\").slider(\"value\"));\n22. });\n23. </script>\n24. </head>\n\
  25. <body>\n26. <h1>The Joy of jQuery: Sam's Used Cars</h1>\n27. <p>二手车</p>\n28.\
  \ <p>首先，你的预算是多少?</p>\n29. <div id=\"slider\"></div>\n30. <input type=\"text\" id=\"\
  amount\" style=\"border:0; font-weight:bold;\" />\n31. <p>此示例展示了特定的增量，在此情况下</p>\n\
  32. <p>但你可以将其改为任何值。</p>\n33. </body>\n34. </html>\n```\n\n第 1-10 行在所有中通用，不再进行详细说明。它们设置了页面并引用了\
  \ jQuery 文件。\n\n第 10-23 行是示例中最重要的部分，我们将重点关注。第 10 行开始脚本块。第 11 行是现在熟悉的文档加载就绪事件的简写引用。它意味着“当文档充分加载到浏览器后执行以下操作”。\n\
  \n第 12 行遵循标准的选择器/动作语法，选择 ID 为 `'slider'` 的 `div` 并对其应用 `slider` 方法。`slider` 方法定义在\
  \ jQuery 库中。\n\n执行工作的行代码是 `$( \"#slider\").slider({value: 200, min:100, max:500,\
  \ step:25});`。在这个示例中，我们选择了一个 ID 为 `slider` 的 div，并告诉 jQuery 将其转换为一个初始值为 200 (`value:200`)、最小值为\
  \ 100、最大值为 500 且每次点击增量为 25 (`step:25`) 的滑块。\n\n到为止都还好，对吧？\n\n接下来的部分有点复杂，所以我在这里重复代码，以便你不需要向上滚动。接下来我们将集中在第\
  \ 17-22 行，但我们会在上下文中显示它们。\n\n```javascript\n17. slide: function( event, ui ) {\n\
  18. $( \"#amount\").val( \"$\" + ui.value );\n19. }\n20. });\n```\n\n\n\n\n\n```javascript\n\
  21\\. $( \"#amount\" ).val( \"$\" + $( \"#slider\" ).slider( \"value\" ) );\n22\\\
  . });\n24\\. </head>\n```\n\n第 17 行与之前的选项不同，因为我们不是传递像 `max:500` 这样简单的值，而是要处理 slide\
  \ 事件。事件是会发生的事情，例如点击按钮。在这种情况下，当滑块移动时，就会发生 slide 事件。我们将一个函数传递给 `slide` 选项，所示：\n\n\
  ```javascript\nslide: function( event, ui ) {\n  $( \"#amount\" ).val( \"$\" + ui.value\
  \ );\n}\n```\n\n换句话说，当 slide 事件发生时，我们将执行以下函数：\n\n```javascript\n$( \"#amount\" ).val(\
  \ \"$\" + ui.value );\n```\n\n敏锐的读者（我指的就是你）会注意到，用于处理滑块控件 slide 事件的函数使用了 jQuery！\n\
  \n处理滑块控件 slide 事件的函数遵循标准的 jQuery 语法 `$(selector).action()`。\n\n该函数执行了以下操作：选择 ID\
  \ 为 `'amount'` 的元素，并将其值设置为美元符号和滑块控件的当前值。我在下方红圈了它，这样你就可以看到用户拖动滑块到 225 处时发生了什么。\n\n\
  ![](img/00021.jpeg)\n\n代码的其他部分是标准的 HTML，我将不再解释。你可以使用包含的 `slider.html` 文件进行尝试。\n\n\
  ## jQuery Tabs（标签页）\n\nTabs 是分组相关信息的极佳方法，可以让页面对用户来说不那么混乱，并且更容易找到你正在寻找的信息。\n\n对于二手车业务的网站，你可能不想一个充满信息的长页面，而是将相关的条目分组，例如概览（Overview）、照片（Photographs）和财务计算器（Finance\
  \ Calculator），所示：\n\n![](img/00022.jpeg)\n\n标签控件的工作原理与菜单非常相似。你从一个无序列表开始，通过 jQuery\
  \ 的魔法将其转换为其他形式。这里是创建上述页面所需的 HTML 代码段：\n\n```html\n<div id=\"tabs\">\n  <ul>\n  \
  \  <li><a href=\"#tabs-1\">Overview</a></a></li>\n    <li><a href=\"#tabs-2\">Photographs</a></a></li>\n\
  \    <li><a href=\"#tabs-3\">Finance Calculator</a></a></li>\n  </ul>\n  <div id=\"\
  tabs-1\">\n    <p>Mileage: 23<br>Body Style: Convertible<br>Exterior Color: Midnight\
  \ Sapphire<br>Interior Color: Seashell<br>Stock #: R177<br><br>Fuel: Gasoline: R-177<br>Engine:\
  \ 6.8L V12 48V GDI DOHC<br>Transmission: 8-Speed Automatic<br>Drivetrain: RWD<br>Doors:\
  \ 2</p>\n  </div>\n</div>\n```\n\n所需的 jQuery 代码几乎简单得不可思议：\n\n```javascript\n$(function()\
  \ {\n  $( \"#tabs\" ).tabs();\n});\n```\n\n要将内容放在你想要的位置标签页中，创建一个 `id` 与列表 `href`\
  \ 目标匹配的 `div`。例如，在接后的代码中，注意字符串 `'tabs-1'` 在两个黄色高亮处都是通用的。这就是标签页与内容链接的地方。\n\n```html\n\
  <div id=\"tabs\">\n  <ul>\n    <li><a href=\"#tabs-1\">Overview</a></a></li>\n \
  \   <li><a href=\"#tabs-2\">Photographs</a></a></li>\n    <li><a href=\"#tabs-3\"\
  >Finance Calculator</a></a></li>\n  </ul>\n  <div id=\"tabs-1\">\n    <p>Mileage:\
  \ 23<br>Body Style: Convertible<br>Exterior Color: Midnight Sapphire<br>Interior\
  \ Color: Seashell<br>Stock #: R177<br><br>Fuel: Gasoline<br>Engine: 6.8L V12 48V\
