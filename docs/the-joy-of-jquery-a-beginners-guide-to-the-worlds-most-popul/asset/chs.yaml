  \n```\n\n一个“回调函数”是一种高级的说法，指这是在获取成功时将运行的函数。回调函数本身包含参数，这些参数由 jQuery 在获取成功时赋予的。第一个参数将包含请求的页面内容，第二个回调参数将包含请求的状态。起初我假设状态参数的值只有“success”，因为根据定义，函数只有在获取成功时才被调用。然而，简单的搜索发现了其他可能的值，如“notmodified”、“error”、“timeout”或“parsererror”。##\
  \ AJAX 语法 - Get/Post\n\n`get()` 和 `post()` 方法用于从服务器请求数据。\n\n### Get 与 Post\n\n*\
  \   `GET` 从指定的资源请求数据。\n*   `POST` 将数据提交到指定的资源。\n\n`GET` 用于获取数据。然而，与 `GET` 相比有两个主要区别。首先，`POST`\
  \ 方法可以随请求发送数据。\n\n## jQuery $.get() 方法\n\n`$.get()` 方法使用 HTTP 请求从服务器获取数据。这是 `get()`\
  \ 的语法：\n\n```javascript\n$.get(URL, callback);\n```\n\n所需的 `URL` 参数是你想要请求的 URL (`get`)，可选的\
  \ `callback` 参数是请求成功后将执行的函数名称。\n\n### $.get() 示例\n\n以下示例使用 `.get()` 方法从文件检索数据：\n\
  \n```javascript\n$(\"button\").click(function(){\n  $.get(\"todays_deal.php\",function(data,status){\n\
  \    alert(\"Data: \" + data + \"\\nStatus: \" + status);\n  });\n});\n```\n\n`$.get()`\
  \ 的第一个参数是你想要请求的 URL (`\"todays_deal.php\"`）。第二个参数是回调函数。“回调函数”是一种高级的说法，指这是在成功时将运行的函数。回调函数本身包含参数，这些参数由\
  \ jQuery 在成功时赋予的。第一个参数将包含页的内容，第二个回调参数将包含请求的状态。起初我假设状态参数的值只有“success”，因为根据定义，函数只有在成功时才被调用。然而，简单的搜索发现了其他可能的值。\n\
  \n顺便说一下，上面 PHP 文件 (\"todays_deal.php\") 如下：\n\n```php\n<?php echo (\"Today only--\
  \ Sam has an awesome deal for you!\"); ?>\n```\n\n## jQuery $.post() 方法\n\n`$.post()`\
  \ 方法使用 HTTP POST 请求从服务器获取数据。这是 `post()` 的语法：\n\n```javascript\n$.post(URL, data,\
  \ callback);\n```\n\n所需的 `URL` 参数是你想要请求的 URL。可选的 `data` 参数指定了随请求发送的一些数据。与 `get`\
  \ 一一样，可选的 `callback` 参数是请求成功后将执行的函数名称。\n\n### $.post() 示例\n\n以下示例使用 `.post()` 方法在从服务器检索数据的同时发送一些数据。由于此特定示例依赖于基于\
  \ php 的服务器端脚本，我将其发布在了 [`www.joyofphp.com/ajaxpost.html`](http://www.joyofphp.com/ajaxpost.html)\
  \ 上供你尝试。\n\n\n\n\n\n# jQuery 之悦 -  Ajax POST 示例\n\n```html\n<link rel=\"stylesheet\"\
  \ href=\"jquery-ui.css\" />\n<script src=\"jquery-1.9.1.js\"></script>\n<script>\n\
  $(document).ready(function(){\n    $(\"button\").click(function(){\n        var\
  \ Make = $('input[type=\"radio\"]:checked').val();\n        $.post(\"response.php\"\
  ,\n        {\n            Make: Make\n        },\n        function(data,status){\n\
  \            // alert(\"Data: \" + data + \"\\nStatus: \" + status);\n         \
  \   $(\"#deal\").html(data);\n        });\n    });\n});\n</script>\n</head>\n<<body>\n\
  \    <h1>Sam 的二手车行</h1>\n    <p>Sam 想让你开上一一辆新的（二手）车！点击按钮了解今日的特惠：</p>\n    <p>\n\
  \        <form method=\"post\">\n            <input type=\"radio\" name=\"Make\"\
  \ value=\"Ford\">福特<br>\n            <input type=\"radio\" name=\"Make\" value=\"\
  Dodge\">道奇<br>\n            <input type=\"radio\" name=\"Make\" value=\"Honda\"\
  >本田<br>\n        </form>\n    </p>\n    <div id=\"deal\" style=\"background-color:silver;\"\
  >\n        今日特惠\n    </div>\n    <br>\n    <button>向页面发送 HTTP POST 请求并获取结果</button>\n\
  </body>\n</html>\n```\n\nAJAX 是在客户端 JavaScript 中运行的，因此只有你的计算机会看到或处理你的数据输入/输出。\n\n\
  `$.post()` 的第一个参数是我们想要请求的 URL（`\"response.php\"`）。\n\n然后我们传入了一些要随请求一起发送的数据（`Make`）。\n\
  \n`\"response.php\"` 中的 PHP 脚本会读取参数，对其进行处理并返回结果。\n\n第三个参数是回调函数。第一个回调参数持有所请求页面的内容，第二个回调参数持有请求的状态。\n\
  \n**提示：** 以下是 PHP 文件的外观所示（`\"demo_test_post.asp\"`）：\n\n```php\n<?php\n$Make = $_POST['Make']\
  \ ;\n$Day = date(\"l\");\nswitch ($Make ) {\ncase \"Dodge\":\n    echo \"<h1>Dodge</h1>\"\
  ;\n    echo \"<p>预算有限家庭的完美车型。$Day 是 Sam 二手车行的道奇日。</p>\";\n    break;\ncase \"Ford\"\
  :\n    echo \"<h1>Ford</h1>\";\n    echo \"<p>福特探险者是美国人喜爱的 SUV。$Day 是 Sam 二手车行的福特日。</p>\"\
  ;\n    break;\ncase \"Honda\":\n    echo \"<h1>Honda</h1>\";\n    echo \"<p>$Day\
  \ 是 Sam 二手车行的本田日。快来看吧...</</p>\";\n    break;\ndefault:\n    echo \"<h1>$Make</h1>\"\
  ;\n    echo \"<p>$Day 是你在 Sam 二手车行的幸运日。如果我们这里没有 $Make，我们会为你找一台的！</p>\";\n    break;\n\
  }\n?>\n```\n\n## 备用 AJAX 语法 - Load\n\n`load` 与 `get` 类似，但它增加了功能，允许你定义返回的数据应该放在文档的哪个位置。因此，`load`\
  \ 命令非常适用于以下情况：你知道返回的内容是一个格式良好的 HTML 片段，并且你想将其放在文档的某处。\n\n`load` 命令是一个与特定的 jQuery\
  \ 封装元素相关的方法，你首先需要使用 jQuery 选择器来选择该元素。其模式类似于：\n\n`$('#divWantingContent').load(...)`\n\
  \n顺便提一下，由于 `get()`、`post()` 和 `load()` 命令实际上只是更复杂（但更灵活）的通用 `$.ajax()` 命令的“封装（wrapper）”。换句话说，当你调用\
  \ `get` 命令时，实际上发生的情况是调用了 `.ajax()` 命令，并自动为你填充了所有参数。我们不会在书中介绍更具通用性的 `.ajax()` 方法，但如果你发现\
  \ `get`、`post` 或 `load` 都不能完全满足你的需求，那么了解 jQuery 提供了比这些更灵活的方法也是很有好处的。\n\n以下是 `load()`\
  \ 方法的语法：\n\n`[selector].load( URL, [data], [callback] );`\n\n以下是参数的说明：\n\n- **URL**:\
  \ 发送请求的服务器端资源的 URL。它可以是一个 CGI、ASP、JSP 或 PHP 脚本，用于动态生成数据或从数据库获取数据。\n- **data**: 此可选参数表示一个对象，其属性会被序列化为编码正确的参数以传递给请求。如果指定了该参数，将使用\
  \ `POST` 方法进行请求。如果省略，则使用 `GET` 方法。\n- **callback**: 在响应数据加载到匹配集合的元素后执行的函数。传递给此函数的第一个参数是从服务器收到的响应文本，第二个参数是状态状态码。\n\
  \n### 基础示例：加载简单数据\n\n让我们从一个基础示例开始。假设二手车商 Sam 想在他的网站上设置一个页面，用来揭示“今日特惠”。\n\n（注意：提供的文本包含大量的重复内容，且\
  \ HTML 标签与描述性文本之间结构不匹配。以下是根据源文件中提供的逻辑清理后的表示形式。）\n\n提供的源文本是 HTML 行号和描述的杂烩。我已提取了“基础示例：加载简单数据”章节描述的核心逻辑：\n\
  \n假设二手车商 Sam 想在他的网站上设置一个页面来揭示“今日特惠”。`load` 方法将用加载的 URL 结果替换 div 内部的 HTML。\n\n###\
  \ 更高级的示例：加载数据并执行函数\n\n可选的回调参数指定了一个在 `load()` 方法完成后运行的函数。该回调函数可以接收三个参数：\n\n- **responseText**:\
  \ 如果加载成功，包含的文本。\n- **statusText**: 调用的状态。\n- **xhr**: 包含 XMLHttpRequest 对象。\n\n\
  以下示例修改了我们之前的示例，在 `load()` 方法完成后显示一个警告框。如果 `load()` 方法成功，它将显示“外部内容加载成功！”，如果失败了，它将显示错误消息。\n\
  \n```javascript\n$(document).ready(function(){\n    $(\"#driver\").click(function(){\n\
  \        $(\"#deal\").load(\"response.html\",function(responseTxt,statusTxt,xhr){\n\
  \            if(statusTxt==\"success\")\n            alert(\"外部内容加载成功！\");\n   \
  \         if(statusTxt==\"error\")\n            alert(\"错误：\"+xhr.status+\": \"\
  +xhr.statusText);\n        });\n    });\n});\n```\n\n\n\n\n\n# 代码 – ajax2.html\n\
  \n```html\n<html>\n<head>\n<title>jQuery 之美 -  Ajax 示例</title>\n<link rel=\"stylesheet\"\
  \ href=\"jquery-ui.css\" />\n<script src=\"jquery-1.9.1.js\"></script>\n<script\
  \ type=\"text/javascript\" language=\"javascript\">\n$(document).ready(function()\
  \ {\n$(\"#driver\").click(function(){\n$(\"#deal\").load(\"result.html\",function(responseTxt,statusTxt,xhr){\n\
  if(statusTxt==\"success\")\nalert(\"外部内容加载成功!\");\nif(statusTxt==\"error\")\nalert(\"\
  错误: \"+xhr.status+\": \"+xhr.statusText);\n});\n});\n});\n</script>\n</head>\n<body>\n\
  <h1>Sam 的二手车</h1>\n<p>Sam 想让你开上一辆崭新的（二手）车！&nbsp;&nbsp; 点击按钮了解今日特惠：</p>\n<div id=\"\
  deal\" style=\"background-color:silver;\">\n今日特惠\n</div>\n<br><input type=\"button\"\
  \ id=\"driver\" value=\"今日特惠\" />\n</body>\n</html>\n```\n\n## 跨域\n\n你可能已经注意到，这些示例从同一个域名加载动态内容（或者在本地运行时，从同一个文件夹加载）。大多数浏览器都会阻止脚本从其他域名将内容加载到当前页面。正如你妈妈常说的，“这都是为了你好！”这种设计的目的是防止跨域脚本将恶意软件加载到毫无防备的用户所在的当前网页中。\n\
  \n如果你确实需要从另一个域提取数据，请研究 jQuery 的 `.ajax` API 文档。在少数情况下你可以实现跨域，但这超出了本书的讨论范围。关于这一点，请搜索\
  \ `crossDomain` 属性，你可以在 [`api.jquery.com/jQuery.ajax/`](http://api.jquery.com/jQuery.ajax/)\
  \ 了解更多信息。\n\n## jQuery 动画\n\n在 jQuery 使变得简单的许多功能中，动画是最直观的，也认为是最有趣的之一。只需记住不要在自己的网页上过度使用动画。在合理的地方使用动画，而不是为了到处处使用动画而使用它。\n\
  \n## jQuery hide(), show(), and toggle()\n\n通过 jQuery，你可以使用 `hide()` 和 `show()`\
  \ 方法隐藏和显示 HTML 元素：\n\n### 隐藏\n```\n$(\"#hide\").click(function(){\n$(\"p.first()\"\
  ).hide();\n});\n```\n\n### 显示\n```javascript\n$(\"#show\").click(function(){\n$(\"\
  p.first()\").show();\n});\n```\n\n## 语法\n```\n$(selector).hide(speed,callback);\n\
  $(selector).show(speed,callback);\n```\n可选的 `speed` 参数指定了从一个状态到另一个状态的过渡速度，可以取值 \"\
  slow\"、fast\" 或指定毫秒数的数字。\n\n可选的 `callback` 参数是一个函数，它将在 `hide()` 或 `show()` 方法完成后被执行。\n\
  \n### jQuery toggle()\n\n通过 jQuery，你可以使用 `toggle()` 方法在 `hide()` 和 `show()` 方法之间切换。可见的元素会被隐藏，隐藏的元素将变为可见：\n\
  \n### 示例\n```javascript\n$(\"button\").click(function(){\n$(\"p.first()\").toggle();\n\
  });\n```\n\n## 语法\n```\n$(selector).toggle(speed,callback);\n```\n由于 `toggle` 实际上只是调用了\
  \ `show` 或 `hide` 函数，因此自然地提供了相同的参数。可选的 `speed` 参数可以取以下值：\"slow\"、\"fast\" 或毫秒数的数字。\n\
  \n可选的 `callback` 参数是 `toggle()` 完成后执行的函数。\n\n## jQuery 渐变 (Fading)\n\njQuery 不仅仅是简单的显示或隐藏元素，还允许让元素渐入和淡出可见状态。jQuery\
  \ 拥有以下渐变方法：\n\n* `fadeIn()`\n* `fadeOut()`\n* `fadeToggle()`\n* `fadeTo()`\n\n###\
  \ jQuery fadeIn() 方法\n\njQuery 的 `fadeIn()` 方法用于让隐藏元素逐渐变得可见。当它完成时，元素将完全可见。\n\n##\
  \ 语法\n```\n$(selector).fadeIn(speed,callback);\n```\n可选的 `speed` 参数指定了效果的持续时间。它接受以下值：\"\
  slow\"、\"fast\" 或毫秒数的数字。\n\n可选的 `callback` 参数是一个在渐变完成后后执行的函数。\n\n### jQuery fadeIn()\
  \ 示例\n```javascript\n$(\"button\").click(function(){\n$(\"#div1\").fadeIn();\n$(\"\
  #div2\").fadeIn(\"slow\");\n$(\"#div3\").fadeIn(5000);\n});\n```\n\n### jQuery fadeOut()\
  \ 方法\n\njQuery 的 `fadeOut()` 方法用于让可见元素逐渐变得不可。当它完成时，元素将完全隐藏。\n\n## 语法\n```\n$(selector).fadeOut(speed,callback);\n\
  ```\n可选的 `speed` 参数指定了效果的持续时间。它接受以下值：\"slow\"、\"fast\" 或毫秒数的数字。\n\n可选的 `callback`\
  \ 参数是一个在渐变完成后后执行的函数。\n\n### jQuery fadeOut() 示例\n```javascript\n$(\"button\").click(function(){\n\
  $(\"#div1\").fadeOut();\n$(\"#div2\").fadeOut(\"slow\");\n$(\"#div3\").fadeOut(3000);\n\
  });\n```\n\n### jQuery fadeToggle() 方法\n\n类似于在 `hide()` 和 `show()` 方法之间切换的 jQuery\
  \ `toggle()` 方法，jQuery 的 `fadeToggle()` 方法在 `fadeIn()` 和 `fadeOut()` 方法之间切换。\n\n\
  如果元素是隐藏的，`fadeToggle()` 将让它们淡入。如果元素是可见的，`fadeToggle()` 将让它们淡出。\n\n## 语法\n```\n$(selector).fadeToggle(speed,callback);\n\
  ```\n可选的 `speed` 参数指定了效果的持续时间。可以取值：\"slow\"、\"fast\" 或毫秒数的数字。\n\n可选的 `callback`\
  \ 参数是 `toggle()` 完成后执行的函数。\n\n### jQuery fadeToggle() 示例\n```javascript\n$(\"button\"\
  ).click(function(){\n$(\"#div1\").fadeToggle();\n$(\"#div2\").fadeToggle(\"slow\"\
  );\n$(\"#div3\").fadeToggle(5000);\n});\n```\n\n### jQuery fadeTo() 方法\n\n渐变方法集中的最后一个是\
  \ `fadeTo()` 方法。`fadeTo()` 方法允许渐变到指定的透明度。这与其他渐变方法不同，后者总是以显示 100% 的元素结束。\n\n## 语法\n\
  ```\n$(selector).fadeTo(speed,opacity,callback);\n```\n所需的 `speed` 参数指定了效果的持续时间。它接受以下值：\"\
  slow\"、\"fast\" 或毫秒数的数字。\n\n`fadeTo()` 方法中所需的 `opacity` 参数指定指定的透明度（0 到 1 之间的值）。\n\
  \n可选的 `callback` 参数是渐变完成后后执行的函数。\n\n### jQuery fadeTo() 示例\n```javascript\n$(\"\
  button\").click(function(){\n$(\"#div1\").fadeTo(\"slow\",0.15);\n$(\"#div2\").fadeTo(\"\
  slow\",0.5);\n$(\"#div3\").fadeTo(\"slow\",0.8);\n});\n```\n\n## jQuery 滑动 (Sliding)\n\
  \njQuery 滑动方法通过向上或向下滑动来显示或隐藏元素。jQuery 有以下滑动方法：\n\n* `slideDown()`\n* `slideUp()`\n\
  * `slideToggle()`\n\n### jQuery slideDown() 方法\n\njQuery 的 `slideDown()` 方法用于让元素向下进入可见状态。\n\
  \n## 语法\n```\n$(selector).slideDown(speed,callback);\n```\n可选的 `speed` 参数指定了效果的持续时间。它可以取值：\"\
  slow\"、\"fast\" 或毫秒数的数字。\n\n可选的 `callback` 参数是一个在滑动完成后后执行的函数。\n\n### jQuery slideDown()\
  \ 示例\n```javascript\n$(\"#button\").click(function(){\n$(\"#panel\").slideDown();\n\
  });\n```\n\n### jQuery slideUp() 方法\n\njQuery 的 `slideUp()` 方法用于让元素向上进入不可见状态。\n\n\
  ## 语法\n```\n$(selector).slideUp(speed,callback);\n```\n可选的 `speed` 参数指定了效果的持续时间。它可以取值：\"\
  slow\"、\"fast\" 或毫秒数的数字。\n\n可选的 `callback` 参数是一个在滑动完成后后执行的函数。\n\n### jQuery slideUp()\
  \ 示例\n```javascript\n$(\"#button\").click(function(){\n$(\"#panel\").slideUp();\n\
  });\n```\n\n### jQuery slideToggle() 方法\n\njQuery 的 `slideToggle()` 方法在 `slideDown()`\
  \ 和 `slideUp()` 方法之间切换。\n\n如果元素是可见的，`slideToggle()` 将让它们向上滑动。如果元素是不可见的，`slideToggle()`\
  \ 将让它们向下进入可见状态。\n\n\n\n\n\n```javascript\n$(selector).slideToggle(speed,callback);\n\
  ```\n\n可选的 `speed` 参数可以取以下值：\"slow\"、fast\" 或毫秒形式的数字。\n\n可选的 `callback` 参数是一个在滑动完成后执行的函数。\n\
  \n## jQuery slideToggle() 示例\n\n以下示例演示了 `slideToggle()` 方法的使用：\n\n```javascript\n\
  $(\"#button\").click(function(){\n  $(\"#panel\").slideToggle();\n});\n```\n\n##\
  \ jQuery Animate\n\njQuery 的 `animate()` 方法用于创建自定义动画。几乎任何 CSS 属性都可以制作动画，但请记住，在使用\
  \ `animate()` 方法时，所有属性名称必须使用驼峰命名法。例如，您需要编写 `paddingRight` 而不是 `padding-righ`，编写\
  \ `marginRight` 而不是 `margin-right`，以此此类推。\n\n注意：默认情况下，所有 HTML 元素都具有静态位置，无法通过动画进行移动。要操作元素的位置，请记住先将元素的\
  \ CSS `position` 属性设置为 `relative`、`fixed` 或 `absolute`。\n\n颜色动画未包含在 jQuery 核心库中。如果您想对颜色制作动画，，需要从\
  \ jQuery.com 下载 Color Animations 插件。\n\n## 语法\n\n```javascript\n$(selector).animate({params},speed,callback);\n\
  ```\n\n必需的 `params` 参数定义了要动画的 CSS 属性。\n\n可选的 `speed` 参数指定效果的持续时间。它接受以下值：\"slow\"\
  、fast\" 或毫秒形式的数字。\n\n可选的 `callback` 参数是一个在动画完成后执行的函数。\n\n## jQuery Animate 示例\n\n\
  以下示例演示了 `animate()` 方法的简单用法；它会将 `<div>` 元素向右移动，直到其 `left` 属性达到 `300px`：\n\n```javascript\n\
  $(\"button\").click(function(){\n  $(\"div\").animate({left:'300px'});\n});\n```\n\
  \n## 动画多个属性\n\n如果您真的想玩花哨的（我鼓励您适度使用），可以同时对多个属性制作动画：\n\n```javascript\n$(\"button\"\
  ).click(function(){\n  $(\"div\").animate({\n    left:'250px',\n    opacity:'0.7',\n\
  \    height:'300px',\n    width:'300px'\n  }, \"slow\");\n});\n```\n\n# 作者的话\n\n\
