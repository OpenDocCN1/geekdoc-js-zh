  ### Accordion（折叠面板）\n比显示的控件多得多，例如 Accordion、Spinner 和 Tooltip——它们都遵循标准的 jQuery 语法\
  \ `$(selector).action()`。accordion 是一组可折叠的头部。每个头部都可以点击显示或隐藏内容。\n\n### Spinner（计数器）\n\
  spinner 控件允许用户通过点击箭头或输入从列表中选择值。\n\n### Tooltip（提示框）\ntooltip 控件在用户悬停在元素上时显示弹出消息。\n\
  \n## 简介（Introduction）\naccordion 控件是一组可折叠的头部。每个头部都可以点击显示或隐藏内容。\n\n（注：由于原文中存在大量重复的段落，此处已按要求翻译了核心内容并保持格式）\n\
  \n\n\n\n第 5 行对我们来说是新的。它告诉浏览器“视口”（在移动设备上可见的页面部分）宽度应该与设备宽度相同，初始缩比例为 `1`。简而言之，对于 99%\
  \ 的 jQuery 移动页面，你可以直接使用这一行。如果没有这一行，移动浏览器将尝试缩放文档，看起来会很糟糕。\n\n![](img/00024.jpeg)\n\
  \n```html\n6. <meta http-equiv=\"content-type\" content=\"text/html; charset=utf-8\"\
  \ />\n7. <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.css\"\
  \ />\n8. <script src=\"http://code.jquery.com/jquery-1.9.1.min.js\"></script>\n\
  9. <script src=\"http://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.js\"\
  ></script>\n```\n\n第 6 行是另一个必选项项。jQuery Mobile 喜欢知道字符集。只需将其放入你所有的移动页面中即可，无需担心。\n\
  \n第 7 行是到 jQuery mobile 样式表的链接。第 8 行是对 jQuery 库的引用，最后第 9 行是对 jQuery mobile 库的引用。注意，你必须在引入\
  \ jQuery 库之后引入 jQuery mobile 库，因为它们之间相互依赖。\n\n你必须在引用 jQuery 之后引用 jQuery mobile。jQuery\
  \ mobile 扩展了 jQuery，因此 jQuery 必须在文档中先加载。\n\n```html\n10. </head>\n11. <body>\n12.\n\
  13. <div data-role=\"page\">\n14.\n15. <div data-role=\"header\">\n16. <h1>Joy of\
  \ jQuery</h1>\n17. </div> <!-- /header -->\n18.\n19. <div data-role=\"content\"\
  >\n20. <p>Hello world</p>\n21. </div> <!-- /content -->\n22.\n23. </div> <!-- /page\
  \ -->\n24.\n25. </body>\n26. </html>\n```\n\n第 13 行是一个 `DIV` 的开始，在第 23 行结束。注意文档中的所有\
  \ `DIV` 都包含一个名为 `data-role` 的属性。`data-role` 告诉 jquery mobile 如何格式化特定的 `DIV`。jQuery\
  \ Mobile 框架使用 HTML5 的 `data-` 属性来实现基于标记的组件初始化和配置。\n\n数据角色有许多类型，但为了保持第一页的简单，我们将 data-roles\
  \ 限制在 `page`、`header` 和 `content`。\n\n## jQuery Mobile 主题\n\n默认主题包含 5 种色块，并为其分配了字母\
  \ (a, b, c, d, e) 以于快速引用。这让事情变得超级简单。为了让跨组件的色块映射保持一致，jQuery 团队遵循了约定：色块 \"a\" 是视觉优先级最高级（在我们默认主题中为黑色），\"\
  b\" 是次级（蓝色），\"c\" 是我们在许多情况下默认使用的基准级（灰色），\"d\" 用于备用次级，“e\" 作为强调色块。\n\n![](img/00025.jpeg)\n\
  \n使用特定的色块非常简单。例如，如果我想修改“hello mobile world”示例，在标题栏中使用“b”主题，我会进行以下代码更改：\n\n```html\n\
  <div data-role=\"header\" data-theme=\"b\">\n```\n\n你可以将 `data-theme` 元素放在任何带有 `data-role`\
  \ 的 jQuery `div` 中，它将获得适当的主题。因此，要更改内容区域的外观可以这样做：\n\n```html\n<div data-role=\"content\"\
  \ data-theme=\"b\">\n```\n\n### 练习\n\n尝试通过将 `data-theme` 属性放在页面的不同部分来进行实验。你会发现根据应用位置的不同，会有不同的结果。看看是否能让它看起来像这样：\n\
