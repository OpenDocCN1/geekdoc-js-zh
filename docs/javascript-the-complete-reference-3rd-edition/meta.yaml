    ## HOW TO USE THE BOOK


    This is a documentation of the uses of JavaScript mostly in website development.
    Follow the Step by Step guide to be able to get the best out of this book. Work
    through it from chapter to chapter and you will be happy at the time you get to
    the last page. You will need a web authoring software like Dreamweaver or web
    editing software like Notepad++, and web browsers like Google chrome and Mozilla
    Firefox to preview your work.


