  md: '# JAVASCRIPT BOOLEANS


    JavaScript Boolean represents one of two values: that is true or false. This implies
    that JavaScript Boolean Values is True or False.


    Examples


    +   1. Boolean(57>34) //


    returns true

    2. Boolean(45 > 78) //


    returns false


    # Comparisons and Conditions


    In this case, everything with a “Real” value is True but everything Without a
    “Real” is False.


    Examples


    +   1. var y = 0 ;


    Boolean(y); //


    returns false

    2. var y = null;


    Boolean(y); //


    returns false

    3. var y= false;


    Boolean(y); //


    returns false'
