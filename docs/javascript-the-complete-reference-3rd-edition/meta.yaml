    ## JAVASCRIPT VARIABLE


    JavaScript variables are containers for storing data values. These variables must
    be assigned as explained below:


    In this example, m, n, and p, are variables and m and n will be given some values:
    To assign a variable, you use var- variable, = for assigning, set the value eg
    7, and end it with semi colon.


    Examples


    - 1. Declaring variables

    var s = 9;

    var w = 39;

    var person = "Steven Bright";

    var price = $2.99;

    var pi = 3.14;

    - 2. m = 9;

    var n = 23;

    var p = m + n;

    let p = 9+23 = 32

    - 3. m = 12;

    var n = 40;

    var p = m - n;

    let p = 12-40 = -28


    Note: m stores the value 9, n stores the value 23, p stores the value 32.


    ## Rules for Constructing Variable Names:


    The general rules for constructing names for variables (unique identifiers) are
    given below and make sure you pay attention to them while naming your JavaScript
    variables:


    - Names can contain letters, digits, underscores, and dollar signs.

    - Names must begin with a letter.

    - Names can also begin with $.

    - Names are case sensitive (y and Y are different variables).

    - Reserved words (like JavaScript keywords) cannot be used as names.


    ## JAVASCRIPT OPERATORS


    ### JavaScript Arithmetic Operators


    These operators are used to perform arithmetic on numbers be literals or variables.
    Below are the various JavaScript arithmetic operators and their functions:


    | Operator | Description |

    | :--- | :--- |

    | + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

    | % | Modulus |

    | ++ | Increment |

    | -- | Decrement |


    ### JavaScript Assignment Operators


    These operators assign values to JavaScript variables.


    Operators and their uses Explained


    | Operator | Uses |

    | :--- | :--- |

    | = | x = y same as x = y |

    | += | x += y same as x = x + y |

    | -= | x -= y same as x = x - y |

    | *= | x *= y same as x = x * y |

    | /= | x /= y same as x = x / y |

    | %= | x %= y same as x = x % y |


    Example


    ```javascript

    var x = 10;

    x += 5;

    x = x + y same as x = x+y

    ```

    where y = 5 in this case


    Therefore,

    x = 10+5 = 15.


    ### JavaScript String Operators


    This involves the use of + operator to add (concatenate) strings i.e. texts.


    Example


    ```javascript

    var txt1 = "The room";

    var txt1 += "is hot";

    ```

    The result of txt1 will be: The room is hot


    ## ADDING STRINGS AND NUMBERS


    Remember that adding two numbers will return the sum, but adding a number and
    a string will return a string:


    Example


    ```javascript

    w = "steven" + 2006;

    ```

    The result of w will be: steven2006


    ## JAVASCRIPT BOOLEANS


    JavaScript Boolean represents one of two values: that is true or false. This implies
    that JavaScript Boolean Values is True or False.


    Examples


    - 1. Boolean(57>34) // returns true

    - 2. Boolean(45 > 78) // returns false


    ## Comparisons and Conditions


    In this case, everything with a “Real” value is True but everything Without a
    “Real” is False.


    Examples


    - 1. var y = 0;

    Boolean(y); // returns false

    - 2. var y = null;

    Boolean(y); // returns false

    - 3. var y = false;

    Boolean(y); // returns false


