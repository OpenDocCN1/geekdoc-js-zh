  md: '# TYPES OF JAVAS


    There are two types of JavaScript that is Internal and External Scripts.


    # Inline JavaScript:


    Example:


    ```

    <script>

    alert("WELCOME!");

    </script>

    ```


    # External JavaScript:


    You use the SRC attribute of the <SCRIPT> tag to call JavaScript code from an
    external text file. This is useful if you have a lot of code or you want to run
    the external file from several pages, since any number of pages can call the same
    external JavaScript file.


    Example:


    The script below was saved as a miscript.js file:


    alert("WELCOME!");


    This was then called upon by the syntax below put in the head section just before
    the closing head tag:


    ```

    <script src="miscript.js"></script>

    ```


    # Standalone Javascript


    This script loads as a page is loaded. A good example is given bellow:


    ```

    <script>

    alert(''Welcome!'')

    </script>

    ```'
