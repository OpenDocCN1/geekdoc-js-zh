  md: '# JAVASCRIPT USES OUTSIDE WEB PAGES


    Apart from JavaScript use Web browsers and servers, JavaScript interpreters embedded
    in a number of other tools and each of these applications provides its own object
    model that provides access to the host environment. Some of these tools are:


    # Embedded scripting language


    The following are implemented using JavaScript:


    Opera''s extensions, Google''s Chrome extensions , Apple''s Dashboard Widgets,
    Microsoft''s Gadgets, Yahoo! Widgets. OpenOffice.org, an office application suite,
    as well as its popular fork LibreOffice.


    # Scripting engine


    The following Scripting languages are also base on JavaScript:


    Microsoft''s Active Scripting technology supports JScript as a scripting language.


    The Qt C++ toolkit includes a QtScript module to interpret JavaScript, analogous
    to Java''s javax.script package.


    The Java programming language introduced the javax.script package in version 6
    that includes a JavaScript implementation based on Mozilla Rhino.


    # Application platform


    The following Application platforms are also base on JavaScript:


    Adobe Integrated Runtime is a JavaScript runtime that allows developers to create
    desktop applications.


    The Mozilla platform, which underlies Firefox, Thunderbird, and some other Web
    browsers, uses JavaScript to implement the graphical user interface (GUI) of its
    various products.


    GNOME Shell, the shell for the GNOME 3 desktop environment, also made JavaScript
    its default programming language.'
