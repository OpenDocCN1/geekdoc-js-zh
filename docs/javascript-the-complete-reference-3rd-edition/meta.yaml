    w += 5;

    ```

    w 的结果将是 steven5


    ## JavaScript 布尔值


    JavaScript 布尔值表示两个值之一：真或假。这暗示了真实的或不真实的值。


    示例


    - 1. Boolean(57>34) // 返回 true

    - 2. Boolean(45) // 返回 false


    ## 比较与条件


    在这种情况下，所有“真实的”值都是真，但“不真实的”值都是假。


    示例


    - 1. var y = 0;

    Boolean(y); // 返回 false

    - 2. var y = null;

    Boolean(y); // 返回 false

    - 3. var y = false;

    Boolean(y); // 返回 false


