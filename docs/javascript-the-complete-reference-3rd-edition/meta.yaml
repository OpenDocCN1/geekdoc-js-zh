    - 命名区分大小写（y 和 Y 是不同的变量）。

    - 保留 word（如 JavaScript 关键字）不能用名称。


    ## JavaScript 运算符


    ### JavaScript 算术运算符


    这些运算符用于对字面量或变量进行算术运算。以下是各种 JavaScript 算术运算符及其功能：


    | 运算符 | 描述 |

    | :--- | :--- |

    | + | 加法 |

    | - | 减法 |

    | * | 乘法 |

    | / | 除法 |

    | % | 取模 |

    | ++ | 自增 |

    | -- | 自减 |


    ### JavaScript 赋值运算符


    这些运算符将值赋予 JavaScript 变量。


    运算符及其用途解释


    | 运算符 | 用途 |

    | :--- | :--- |

    | = | x = y 等于 x = y |

    | += | x += y 等于 x = x + y |

    | -= | x -= y 等于 x = x - y |

    | *= | x *= y 等于 x = x * y |

    | /= | x /= y 等于 x = x / y |

    | %= | x %= y 等于 x = x % y |


    示例


    ```javascript

    var x = 10;

    x += 5;

    x = x + y same as x = x+y

    ```

    在此情况下 y = 5


    因此，

    x = 10+5 = 15.


    ### JavaScript 字符串运算符


    这涉及使用 `+` 运算符来相（连接）字符串，即文本。


    示例


    ```javascript

    var txt1 = "The";

    txt1 += "room";

    ```

    txt1 的结果将是 The room


    ## 字符串与数字相加


    记住，将数字相加将返回字符串。


    示例


    ```javascript

