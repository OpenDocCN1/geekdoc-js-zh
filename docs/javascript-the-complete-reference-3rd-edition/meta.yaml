  md: '# INTRODUCTION


    JavaScript is a scripting language. It is a language for the web, server, Personal
    computers,

    Laptops, Tablets, Phones, etc.


    It is used to add interactivity to HTML pages that is giving the pages some level
    of

    dynamism.


    A scripting language is a lightweight programming language. It can be inserted
    into

    HTML pages and it is an interpreted language (that is scripts execute without
    preliminary

    compilation)


    Scripts can be place in the head or body section of HTML document. Nevertheless,
    it is a

    common practice to put scripts in the head section, or at the bottom of a web
    page such

    that they are all in one place and do not interfere with page content.


    When a JavaScript interpreter is embedded in a web browser, the result is client
    side

    JavaScript. It combines the scripting ability of a JavaScript interpreter with
    the Document

    Object Model (DOM) defined by a web browser. Client-side JavaScript add some level
    of

    dynamic behavior to otherwise static web pages.


    Although there are strong outward similarities between JavaScript and Java, including

    language name, syntax, and respect standard libraries, the two are distinct languages

    and differ greatly in their design.


    Take note of the following


    +   * JavaScript code is case sensitive

    * White space between words and tabs are ignored

    * JavaScript statements end with a semi- colon (;)

    * Line breaks are ignored except within a statement

    * Capitalize the first letter of every word except the first e.g. userFirstName

    * To declare variables, use the keyword var and the variable name: var username.
    To assign values to variables, add an equal sign and the value: var userName =
    "Smith"

    var price = 100'
