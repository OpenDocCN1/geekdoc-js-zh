  md: '# 214 Hour 16


    Microsoft isn''t alone in confusing browser IDs. Netscape version 6.0 displays
    user agent string beginning with Mozilla/5, and an app version of 5.0. (Netscape
    5.0 was an open-source version that was released to the public only as source
    code, but formed the foundation of what is now Netscape 6.0.)


    ![](img/253d3bf9d2a81ee62f8085998b463a44_235_0.png)


    Although these are two interesting episodes in the annals of the browser wars,
    what does all this mean to you? Well, you''ll need to be careful when your scripts
    are trying to differentiate between IE and Netscape, and between different versions.
    For example, the following statement was presented earlier in this hour as an
    example of the navigator properties:


    ```

    if (navigator.userAgent.indexOf("Mozilla/4") == -1)

    window.location="non_netscape.html");

    ```


    As it turns out, this statement checks for the string Mozilla/4—which will actually
    allow either Netscape 4.x or Internet Explorer 4.x, or even IE 5.x. This isn''t
    necessarily a bad thing, but what if you want to look specifically for Netscape
    4.0? In that case, you can be specific:


    ```

    if (navigator.appName.indexOf("Netscape") == -1

    || navigator.appVersion.indexOf("4.0") == -1)

    window.location="non_netscape.html");

    ```


    This longer if statement first checks the navigator.appName property, which will
    contain the appropriate value of Netscape or Microsoft. Next, it checks the navigator.appVersion
    property. If the name isn''t Netscape or the version isn''t 4.0, it sends the
    user to another page.


    > This example uses the indexOf string method, which searches for a string within
    another string. To refresh your memory about this and other string functions,
    see Hour 6, "Using Strings and Arrays."


    ![](img/253d3bf9d2a81ee62f8085998b463a44_235_1.png)


    In conclusion, don''t trust the code name or app version properties, and always
    test your cross-browser scripts with several browsers before you put them online.
    In the Workshop section of this hour, you''ll learn a practical way to check specifically
    for 5.0 and later browsers.'
