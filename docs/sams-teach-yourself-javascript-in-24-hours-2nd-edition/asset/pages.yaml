  md: 'Listing 21.1 shows a script I wrote to play the classic "Guess a Number" game.
    The script picks a number between 1 and 100 and then allows the user 10 guesses.
    If a guess is incorrect, it provides a hint as to whether the target number is
    higher or lower.


    This is a relatively simple script with a twist: It includes at least one bug
    and doesn''t work at all in its present form.


    # Listing 21.1 The Number Guesser Script, Complete with Bugs


    ```

    1: <html>

    2: <head>

    3: <title>Guess a Number</title>

    4: <script LANGUAGE="JavaScript" * 100 + 1;

    5: var num = Math.random();

    6: var tries = 0;

    7: function guess() {

    8: var guess = document.form1.guess1.value;

    9: tries++;

    10: status = "Tries: " + tries;

    11: if (guess < num)

    12: document.form1.hint.value = "No, guess higher";

    13: if (guess > num)

    14: document.form1.hint.value = "No, guess lower.";

    15: if (guess == num) {

    16: window.alert(''Correct! You guessed it in " + tries + " tries.");

    17: location.reload();

    18: }

    19: if (tries == 10) {

    20: window.alert(''Sorry, time''s up. The number was: " + num);

    21: location.reload();

    22: }

    23: }

    24: </script>

    25: </head>

    26: <body>

    27: <h1>Guess a Number</h1>

    28: <br>

    29: <p>I''m thinking of a number between 1 and 100. Try to guess

    30: it in less than 10 tries.</p>

    31: <form NAME="form1">

    32: <input TYPE="text" SIZE=25 NAME="hint" VALUE="Enter your guess.">

    33: <br>

    34: <Guess:</br>

    35: <input TYPE="text" NAME="guess1" SIZE=''5''>

    36: <input TYPE="BUTTON" VALUE="Guess" onclick="guess();">

    37: </form>

    38: </body>

    39: </html>

    ```'
