  md: '# Adding Text to a Page


    Next, you can create a script that actually adds text to a page. To do this, you
    must first create a new text node. This statement creates a new text node with
    the text "this is a test":n


    ```

    var node=document.createTextNode("this is a test");

    ```


    Next, you can add this node to the document. To do this, you use the appendChild
    method. The text can be added to any element that contain text, but we will use
    a paragraph. The following statement adds the text node defined above to the paragraph
    with the identifier p1:


    ```

    document.getElementById("p1").appendChild(node);

    ```


    Listing 19.3 shows the HTML document for a complete example that uses this technique,
    using a form to allow the user to specify text to add to the page.


    # Listing 19.3 Adding Text to a Page


    ```

    1: <html>

    2: <head>

    3: <title>Adding to a page</title>

    4: <script language="Javascript">

    5: function AddText() {

    6: var sentence=document.form1.sentence.value;

    7: var node=document.createTextNode(" " + sentence);

    8: document.getElementById("p1").appendChild(node);

    9: }

    10: </script>

    11: </head>

    12: <body>

    13: <h1>Create Your Own Content</h1>

    14: <p id="p1"> using the WC DOM, you can dynamically

    15: add sentences to this paragraph. Type a sentence

    16: and click the Add button.</p>

    17: <form type="text" name="sentence" size="65">

    18: <input type="button" value="Add" onclick="AddText();"

    19: </form>

    20: </body>

    21: </html>

    ```


    In this example, lines 14–16 define the paragraph that will hold the added text.
    Lines 17–20 define a form with a text field called sentence and an add button,
    which calls the AddText function. This function is defined in lines 4–10.'
