  md: '# Getting Data with Forms


    ```

    <option VALUE="choice3">This is the third choice.

    </select>

    ```


    Each of the <option> tags defines one of the possible choices. The VALUE attribute
    is the name that is returned to the program, and the text outside the <option>
    tag is displayed as the text of the option.


    An optional attribute to the <select> tag, MULTIPLE, can be specified to allow
    multiple items to be selected. Browsers usually display a single-selection <select>
    as a dropdown list and a multiple-selection list as a scrollable list.


    The object for selection lists is the select object. The object itself has the
    following properties:


    +   - name is the name of the selection list.

    - length is the number of options in the list.

    - options is the array of options. Each selectable option has an entry in this
    array.

    - selectedIndex returns the value of the currently selected item. You can use
    this to change the value easily. In a multiple-selection list, this indicates
    the first selected item.



    The options array has a single property of its own, length, which indicates the
    number of selections. In addition, each item in the options array has the following
    properties:


    +   - index is the index into the array.

    - defaultSelected indicates the state of the SELECTED attribute.

    - selected is the current state of the option. Setting this property to true selects
    the option. You can select multiple options if the MULTIPLE attribute is included
    in the <select> tag.

    - name is the value of the NAME attribute. This is used by the server.

    - text is the text that is displayed in the option. In Netscape 3.0 or later,
    you can change this value.


    The select object has two methods—blur() and focus()—which perform the same purposes
    as the corresponding methods for text objects. The event handlers are onBlur,
    onFocus, and onChange, similar to other objects.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_208_0.png)


    > You can change selection lists dynamically—for example, choosing a product in
    one list could control which options are available in another list. You can also
    add and delete options from the list.


