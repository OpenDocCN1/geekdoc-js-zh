  md: "The first step in the next function is to increment the image in the current\
    \ box. Here is the function definition and the increment statement: ;\n\n```\n\
    function next() {\n cimage += 1;\n```\n\nAfter incrementing the value of cimage,\
    \ the script needs to make sure it hasn't gone past 8 because there are eight\
    \ images. The next part of the script checks for values greater than 8:\n\n```\n\
    if (cimage > 8) {\n cimage = 4;\ndocument.images[cbox].src = \"mouse0.gif\";\n\
    cbox = (cbox + 1) % 5;\nnbox = (cbox + 1) % 5;\n}\n```\n\nIf the current image\
    \ has a value over 8, this code increments the value of cbox and assigns nbox\
    \ to the next value. Both of these statements use the modulo (%) operator, which\
    \ prevents the position from reaching a value greater than 4. The mouse will start\
    \ over at the left side of the page.\n\nThe preceding script also resets cimage\
    \ to 4. (Because the current box was previously the next box, it's already moved\
    \ through images 1, 2, and 3)\n\nNext, the script calculates the image for the\
    \ next box, if any:\n\n```\nnimage = cimage - 5;\nif (nbox <= 0) nbox = 0;\n```\n\
    \nThe first statement here assigns nimage to five less than cimage. If you look\
    \ at the images in Figure 15.3, you'll notice that images 6, 7, and 8 match up\
    \ with images 1, 2, and 3, respectively, to form a complete mouse. The subtraction\
    \ results in a negative value, there shouldn't be a next image, so assign 0 to\
    \ nimage.\n\nFinally, the next function assigns the images by cimage and nimage\
    \ to the locations by cbox and nbox:\n\n```\ndocument.images[cbox].src = \"mouse\"\
    \ + cimage + \".gif\";\ndocument.images[nbox].src = \"mouse\" + nimage + \".gif\"\
    ;\nwindow.setTimeout(next(), 100);\n```\n\nThe final statement here sets a timeout\
    \ that the next function will be called again in a tenth of a second. (You can\
    \ increase or decrease this value to change the mouse's speed)\n\n# Putting It\
    \ All Together\n\nYou now have all the components of a working animation script.\
    \ Listing 15.3 shows the complete HTML document and script. The <BODY> tag includes\
    \ an onLoad event"
