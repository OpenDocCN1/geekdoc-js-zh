    # # Workshop: Creating a Simple Animation


    Although rollovers are undoubtedly the most practical use for JavaScript images,
    you can also use the feature for simple animations. JavaScript isn''t always the
    best way to do animations, but it''s very useful in cases where you want to control
    the animation from a script.


    If you just want an animated image that repeats over and over, an animated GIF
    image is often a better choice. Many graphic software packages are available that
    automate the process of creating animated GIF images.


    As simple example of JavaScript animation, you will now create a script that moves
    an animated character across the browser display.


    # ## Creating the Images


    The first step in creating a JavaScript animation is to create the images themselves.
    For this example, you will make an animated mouse move across the page. (You could
    use anything, of course, but this mouse is the only thing I can draw.)


    The mouse animation uses a series of eight images, shown in Figure 15.3. To create
    these images, draw the mouse in a 100x100 square and then shift it to the left
    and right to create the various stages in the animation.


    Call these images mouse1.gif through mouse8.gif. You will also need a blank image
    for those times when the mouse isn''t there; call that mouse0.gif. All of these
    files are available on this book''s Web site (www.javascript.com), so you can
    try the example yourself.


    # ## Creating the HTML Document


    Next, you''ll need to create the HTML document for the animation. You will animate
    the mouse through five adjacent images on the page so it appears to move from
    one end to the other. Here is the basic HTML to lay out the graphics:'
