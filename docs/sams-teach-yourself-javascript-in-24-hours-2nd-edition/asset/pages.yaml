- img_proc: true
  md: '> Bear in mind that the newline character is ignored-by HTML, except inside
    the <pre> container. You will need to use the <br> tag if you want an actual line
    break.


    You can use these methods only within the body of the Web page, so they will be
    executed when the page loads. You can''t use these methods to add to a page that
    has already loaded without reloading. You can write new content for a document,
    however, as the next section explains.


    > You can also directly modify the text of a Web page on newer browsers using
    the features of the new DOM. You''ll learn these techniques in Hour 19, "Advanced
    DOM Features."


    The document.write method can be used only within a <script> tag in the body of
    an HTML document. You can also use it in a function, provided you include a call
    to the function within the body of the document.


    # Clearing and Rewriting Documents


    The document object includes open and close methods. Unlike the window object
    methods of the same name, these methods don''t actually open and close new documents
    or windows. Instead, the open method opens a stream, which clears the document
    and allows you to create a new one with it or written methods.


    When you use the document.open method, the current document is cleared. Any data
    already displayed in the document is erased, and you can begin writing new content
    to the document.


    The data you write after the document.open isn''t actually displayed until you
    close the stream with the document.close method. You can use this to ensure that
    blocks of write execute at the same time.


    > If you use the document.open method on the current window, part of the current
    document—will be cleared, and will stop executing. For this reason, these methods
    are best used with separate windows and frames. You''ll learn about this in Hour
    13.'
