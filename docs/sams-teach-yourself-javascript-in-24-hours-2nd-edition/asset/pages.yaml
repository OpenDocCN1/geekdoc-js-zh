  md: '# Creating Dynamic Pages with the DOM


    The difference is in the way you JavaScript to control layer positioning. Here
    is the DOM method of changing the layer''s top position to 200, as you learned
    above:


    ```

    var obj = document.getElementById(''layer1'');

    obj.style.top=200;

    ```


    Internet Explorer 4.0 uses a similar syntax, but stores all objects under the
    document.all object rather than a tree structure. This is IE4''s method of performing
    the same position:


    ```

    var obj=document.all.layer1;

    obj.style.top=200;

    ```


    Last not least, Netscape 4.0 uses the layers array to store information about
    layer positions. Here is the Netscape 4.0 method of changing the layer''s position:


    ```

    var obj=document.layers[''layer1''];

    obj.style.top=200;

    ```


    As you see, the new DOM will make multiple-browser compatibility much easier.
    In the meantime, be sure to support older browsers if it''s possible and practical
    for your pages.


