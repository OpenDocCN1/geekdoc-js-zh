  md: '# Adding Graphics Links


    As an alternative to the drop-down navigation bar, you cart use graphics in a
    navigation bar at the top of the page. You''ll use rollovers to change the graphics
    when the mouse moves over them, as described in Hour 15, "Using Graphics and Animation."


    # Creating the Graphics


    To begin creating the rollovers, you will need to create graphics for the links.
    For each one, you''ll need a highlighted and unhighlighted version. The highlighting
    can be a different color, an added line or circle, or anything you want.


    For this example, I created graphics for the major links: Spreadsheet, Word Processor,
    Database, and Order Form. The highlighted versions are negatives of the normal
    graphics. For simplicity, call the standard graphics spread.gif, word.gif, data.gif,
    and order.gif. The highlighted versions will have an added number 2, as in order2.gif.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_323_0.png)


    When you''re creating graphics for rollovers, remember that the highlighted and
    unhighlighted versions of an image must be the same size. Otherwise, the images
    may be distorted or not replaced correctly.


    # Creating Event Handlers


    Once you''ve created the graphics, you simply need to add the graphic links with
    onmouseover and onMouseOut event handlers. Listing 22.5 shows the HTML for the
    graphics, including the event handlers.


    # LISTING 22.5 The Rollover Event Handlers


