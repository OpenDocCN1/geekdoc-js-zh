    Notice that the loop was only executed nine times. This is because the conditional
    is i<10. When the counter (i) is incremented to 10, the expression is no longer
    true. If you need the loop to count to 10, you could change the conditional; either
    i<=10 or i<11 will work fine.


    You might notice that the variable name i is often used as the counter in loops.
    This is a programming tradition that began with an ancient language called Forth.
    There''s no need for you to follow this tradition, but it is a good idea to use
    one consistent variable for counters. (To learn more about Forth Interest Group''s
    Web site at www.forth.org)


    The structure of the for loop in JavaScript is based on Java, which in turn is
    based on C. Although it is traditionally used to count from one number to another,
    you can use just any statement for the initialization, condition, and increment.
    However, there''s usually a better way to do other types of loops with the while
    keyword, described in the next section.


    # Using while Loops


    Another keyword for loops in JavaScript is while. Unlike for loops


    The while statement includes the condition in parentheses, and it is followed
    by a block of statements within braces, just like a for loop. Listing 8.2 shows
    a simple while loop.


    LISTING 8.2 A Simple Loop Using while


    ```

    1: while (total < 10) {

    2: n++;

    3: total += values[n];

    4: }

    ```


    This loop uses a counter, n, to iterate through the values array. Rather than
    stopping at a certain count, however, it stops when the total of the values reaches
    10.'
