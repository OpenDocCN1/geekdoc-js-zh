  md: '# # BOSTON PUBLIC LIBRARY

    Copley Square

    Boston, MA 02116

    Teach Yourself JavaScript in 24 Hours, Second Edition


    # ## What you should already have to get the most out of this book...


    +   - Familiarity with the basic workings of your computer, your operating system,
    and the Internet

    - At least basic skills in creating Web pages with HTML

    - The aptitude and desire to create dynamic content with JavaScript


    Some books that may help...


    ![](img/253d3bf9d2a81ee62f8085998b463a44_1_0.png)


    Sams Teach Yourself HTML 4 in 24 Hours

    This book will get you up and running with HTML in no time.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_1_1.png)


    Sams Teach Yourself HomeSite 4 in 24 Hours

    HomeSite is a powerful HTML code editor.


    # ## What this book will help you learn...


    +   - The fundamentals of JavaScript and programming

    - How to use JavaScript with forms, graphics, and animation

    - The knowledge to create useful Web applications with JavaScript


    Related titles...


    ![](img/253d3bf9d2a81ee62f8085998b463a44_1_2.png)


    Sams Teach Yourself CGI in 24 Hours

    While JavaScript is highly effective for creating client-side scripting, there
    may be times when server-side applications with CGI may be beneficial.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_1_3.png)


    Sams Teach Yourself PHP4 in 24 Hours

    As an alternative to CGI programming, technologies such as PHP4 provide many of
    the same capabilities, easy-to-use package.


    # ## Where you may want to go from here...


    +   - Expand your abilities as an application programmer by gaining a more complete
    knowledge of JavaScript

    - Learn more about Web programming to build even more complex Web applications

    - Expand your repertoire by learning other programming languages as C++ or Java


    Possible titles to look for...


    ![](img/253d3bf9d2a81ee62f8085998b463a44_1_4.png)


    Pure JavaScript

    This book contains insightful programming techniques, complete with well-commented
    code examples.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_1_5.png)


    Sams Teach Yourself Java 2 in 21 Days

    This book will increase your ability to add interactivity to your Web development.'
