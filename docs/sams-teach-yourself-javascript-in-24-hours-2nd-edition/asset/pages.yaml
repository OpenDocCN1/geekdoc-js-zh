  md: '# HOUR 11


    # Creating Custom Objects


    In the last two hours, you''ve learned to use JavaScript''s built-in objects,
    such as Date. You''ve also learned about the objects in the DOM (Document Object
    Model), which allow you to manipulate Web documents. These are the most commonly
    used JavaScript objects, but you can also create custom objects.


    In this hour, you''ll learn how to create your own custom objects with JavaScript,
    and in the process learn a bit more about how JavaScript handles all kinds of
    objects. Hour 11 covers the following topics:


    +   * How objects can simplify scripts

    * Defining an object

    * Adding methods to an object

    * Creating instances of an object

    * Using objects to store and manage data'
