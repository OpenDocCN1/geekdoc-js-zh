  md: "# Workshop: Creating Back and Forward Buttons\n\nBrowser-specific scripting\
    \ can be complicated, and you'll learn more about the navigator object in Hour\
    \ 16, \"Creating Cross-Browser Scripts.\"\n\nOne common use for the back and forward\
    \ methods of the history object is to add your own Back and Forward buttons to\
    \ a Web document. This can improve the user interface of your pages.\n\nAs an\
    \ example of the use of the history object, you will now create a script that\
    \ displays Back and Forward buttons and uses these methods to navigate the browser.\n\
    \nYou will use graphic images for the Back and Forward buttons. You can use the\
    \ images from this book's Web site at www.jsworkshop.com or make your own images\
    \ to match the other graphics on your page.\n\nHere's the part of the script that\
    \ will handle the Back button:\n\n```\n<a HREF=\"javascript:history.back();\"\n\
    <img ORDER=0 SRC=\"left.gif\">\n\n```\n\nThis uses a javascript:URL to execute\
