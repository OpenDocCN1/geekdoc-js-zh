  md: '# Exploring JavaScript''s Capabilities


    HTML page appropriately. If the plug-in is not available, your script can send
    the user to a different page, or even send them to the download page for the plug-in.

    Along with detecting installed plug-ins, you can use JavaScript to work with dynamic
    content. Netscape calls this feature LiveConnect. Using this system, you can control
    a plug-in with JavaScript.


    > Incidentally, the LiveConnect specification also allows JavaScript programs
