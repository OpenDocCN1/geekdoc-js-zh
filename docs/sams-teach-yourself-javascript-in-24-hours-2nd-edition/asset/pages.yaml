  md: '# Getting Data with Forms


    You can use JavaScript to validate a form whether it''s submitted by email or
    to a CGI script, or is simply used by a script. Listing 14.3 is a version of the
    name and address form that includes validation.


    # Listing 14.3 A Form with a Validation Script


    ```

    1 <html>

    2 <head>

    3 <title>Form Example</title>

    4 <script LANGUAGE="JavaScript">

    5 function validate() {

    6 if (document.form1.name.value.length < 1) {

    7 alert(''Please enter your full name.'');

    8 return false;

    9 }

    10 if (document.form1.address.value.length < 3) {

    11 alert(''Please enter your address.'');

    12 return false;

    13 }

    14 if (document.form1.phone.value.length < 3) {

    15 alert(''Please enter your phone number.'');

    16 return false;

    17 }

    18 return true;

    19 }

    20 </script>

    21 </head>

    22 <body>

    23 <h1>Form Example</h1>

    24 <p>Enter the following information. When you press the Display button,

    25 the data you enter will be validated, then sent by email.</p>

    26 <form name="form1" action="mailto:user@host.com" enctype="text/plain">

    27 OnSubmit="return validate();"

    28 <p>Name:</b /> <Input TYPE="TEXT" LENGTH="20" NAME="username">

    29 </p>

    30 <p>Address:</b /> <Input TYPE="TEXT" LENGTH="30" NAME="address">

    31 </p>

    32 <p>Phone:</b /> <Input TYPE="TEXT" LENGTH="15" NAME="phone">

    33 </p>

    34 <input TYPE="SUBMIT" Value="Submit"></p>

    35 </form>

    36 </body>

    37 </html>

    ```


    This form uses a function called validate to check the data in each of the form
