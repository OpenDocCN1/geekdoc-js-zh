    \ image. The script for the Forward button is nearly identical: \n\n```\n<a HREF=\"\
    javascript:history.forward();\"\n<img ORDER=0 SRC=\"right.gif\">\n\n```\n\nWith\
    \ these out of the way, you just need to build the rest of an HTML document. Listing\
