    # # Workshop: Adding Link Descriptions to a Web Page


    One of the most common uses for an event handler is to display a message on the
    status line when the user moves the mouse over a link, moving the mouse over the
    Order Form link might display a message like "Order a product or an order''s status"
    on the status line.


    Status line descriptions like these are typically displayed with the onError event
    handler. You will now create a script that displays messages in this manner and
    clears the message using the mouseOut event handler. You''ll use functions to
    simplify the process.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_177_0.png)


    > When you use this technique, your status line message will replace the URL that
    is usually displayed there. Make sure your description is at least as useful as
    the URL. All too often, Web designers use this technique to display a redundant
    message; for example, a link labeled "Order Form" displays the description "Go
    to the Order Form."


    To begin the script, you will define a function to display a message on the status
    line. Although you don''t need to use a function, it makes your job a bit easier.
    For example, a link with an event handler that displays a message on the status
    line might look like this:


    ```

    <a href="order.html" onmouseover="window.status=''Order a product''; return true;">Order
    Form</a>

    ```


    In this example, the return true statement is necessary to prevent the status
    message from being overwritten immediately by the URL display. As you can see,
    this makes the <a> tag complicated—and there isn''t even a way to clear the message.


    Using a function simplifies the links tags slightly. More importantly, it will
    make it easy to add other features (such as graphics) at a later time. You will
    call the function to display a describe message. Listing 12.1 shows its function
    definition.'
