- img_proc: true
  md: 'To begin creating the script, open your favorite text editor and type the beginning
    and ending <script> tags, as shown in Listing 2.1. (This listing andothers in
    this book include line numbers for reference; be sure to type the script without
    the line numbers.)


    # Listing 2.1 The Framework for a JavaScript Script


    ```

    1: <script LANGUAGE="JavaScript">

    2: </script>

    ```


    Since this script does not use any of the new features of JavaScript 1.1 or later,
    we do not specify a version number in the <script> tag. This script should work
    in Netscape 2.0 and later Internet Explorer 3.0 or later.


    # Adding JavaScript Statements


    To complete the script, you will need to determine what the local and UTC times
    are, and then display them to the browser. Fortunately all of the hard parts,
    such as converting dates, are built into the JavaScript interpreter.


    # Storing Data in Variables


    To begin the script, you will use a variable to store the current date. You will
    learn more about variables in Hour 5, “Using Variables and Functions.” For now,
    think of them as containers that can hold something (a number, or in this case,
    a date).


    To start writing the script, add the following line after the <script> tag. Be
    sure to use the same combination of capital and lowercase letters in your version,
    since JavaScript is case-sensitive in some instances.


    ```

    now = new Date();

    ```


    This statement creates a variable called now and stores the current date and time
    in it. This statement and the objects you will use in the script JavaScript’s
    built-in Date object, which allows you to conveniently handle dates and times.
    You’ll learn more working with dates in Hour 9, “Using Built-In Objects.”


    ![](img/253d3bf9d2a81ee62f8085998b463a44_41_0.png)


    The semicolon at the end of the above statement. This tells the browser that it
    has reached the end of a statement. You can actually omit the semicolons, but
    we’ll use them throughout this book for clarity.'
