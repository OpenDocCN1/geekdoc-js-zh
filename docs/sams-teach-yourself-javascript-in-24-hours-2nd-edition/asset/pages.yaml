  md: "# Working with Multimedia and Plug-Ins\n\nQ Where can I find a list of the\
    \ exact properties and methods supported by a plug-in?\n\nA Check the plug-in\
    \ vendor's Web site. For the plug-ins that are bundled with Netscape, you can\
    \ find information on Netscape's site.\n\nQ Just how supported are plug-ins? Will\
    \ I be abandoning part of my audience by using them?\n\nA In the case of basic\
    \ plug-ins such as Quicktime and audio players, you're pretty safe to use them.\
    \ More complicated plug-ins are far less common. I suggest that you only use these\
    \ when they're required (for example, a game that requires Macromedia Flash) or\
    \ when you've provided a plug-in-free alternative to access your content.\n\n\
    # Quiz\n\nTest your knowledge of JavaScript's plug-in and multimedia features\
    \ by answering the following questions.\n\n# Questions\n\n+   1. Which feature\
    \ of Netscape allows JavaScript to control a plug-in?\n   a. Java\n   b. LiveConnect\n\
    \   c. LiveAudio\n2. The plugins object is a child of which browser object?\n\
