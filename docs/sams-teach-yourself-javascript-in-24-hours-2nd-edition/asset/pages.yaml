  md: '# Responding to Events


    The onMouseOut handler is the opposite—it is called when the mouse pointer moves
    out of the object''s border. Unless something strange happens, this always happens
    some time after the onMouseOver event is called.


    This handler is particularly useful if your script has a change when the pointer
    moved over the object—for example, displaying a message in the status line or
    changing an image. You can use an onMouseOut handler to undo the action when the
    pointer moves away.


    You''ll use both onMouseOver and onMouseOut handlers in the “Workshop: Adding
    Link Descriptions to a Web Page” section at the end of this hour.


    > One of the most common uses for the onMouseOver and onMouseOut event handlers
    is to create rollovers—images that change when the mouse moves over them. You''ll
    learn how to create these in Hour 15, "Using Graphics and Animation"


    ![](img/253d3bf9d2a81ee62f8085998b463a44_174_0.png)


    A third handler, onMouseMove, is called when any mouse movement at all occurs.
    Because this happens so often, this handler isn''t available by default. To use
    it, you must use event capturing, an advanced feature available in JavaScript
    1.2 and later. To learn about this feature, see the references in Appendix A,
    "Other JavaScript Resources"


    # Ups and Downs


    You can also use events to detect when the mouse button is clicked. The basic
    event handler for is onClick. This event handler is called when the mouse button
    is while positioned over the appropriate object.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_174_1.png)


    > The object in this case can be a link. It can also be a form element. You''ll
    learn more about forms in Hour 14, "Getting Data with Forms."


    For example, you can use the following event handler to display an alert when
    a link is clicked:


    ```

    <a href="http://www.jsworkshop.com/" onclick="window.alert(''You are about to
    leave this site.'');">Click Here</a>

    ```


    In this case, the onClick event handler runs before the linked page is loaded
    into the browser. This is useful for making links conditional or displaying a
    disclaimer before launching the linked page.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_174_2.png)'
