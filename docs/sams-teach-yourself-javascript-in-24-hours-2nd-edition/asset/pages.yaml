  md: '# Creating a Simple Script


    While Internet Explorer displays error dialog boxes for each error, Netscape''s
    JavaScript Console displays a single list of errors and allows you to test commands.
    For this reason, you may find it useful to install Netscape for debugging and
    testing JavaScript, even if Internet Explorer is your primary browser.


    # Workshop: Hiding Scripts from Older Browsers


    Since older browsers don''t understand the <SCRIPT> tag, they will not behave
    very well when they encounter a script in a Web page. In most cases, they will
    display the script in the middle of the page—probably not the effect you were
    looking for.


    To avoid this, you can enclose the script within HTML comments. This tells older
    browsers to ignore the script completely. Newer browsers are smart enough to know
    that your script isn''t really a comment.


    HTML comments begin with the tag <! .. and end with the ..> tag. Listing 2.6 shows
    a simple example of a script with comments.


    # Listing 2.6 Hiding a Script from Older Browsers


    ```

    1: <SCRIPT LANGUAGE="JavaScript">

    2: <!--

    3: document.write(''Your browser supports JavaScript.'');

    4: // -->

    5: </SCRIPT>

    ```


    This script includes the beginning and ending HTML comment tags. The // in the
    last line is a JavaScript comment; this prevents the HTML comment from being detected
    as a JavaScript error.


    > This process of hiding scripts is not perfect. Certain characters within your
    script (particularly the greater than sign, >) may end the comment prematurely.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_48_0.png)'
