    # Workshop: A Better Scrolling Message


    In Hour 6, "Using Strings and Arrays," you created a script that scrolls a message
    across the browser''s status line. Using the DOM objects, you can create a better
    scrolling message—one that scrolls within the Web page itself.


    To do this, you can start with the scrolling message example from Hour 6. Instead
    of assigning the message to the window.status variable, you can display it in
