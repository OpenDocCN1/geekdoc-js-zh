  md: '# Creating the HTML Document


    For this example, you''ll start with the Web page of a small (and hopeless) software
    company known as Fictional Software Company (FSC). Their Web page is rather unimpressive,
    but you''ve got to somewhere.


    The main FSC Web page is shown in Figure 22.1. It includes a logo at the top,
    three paragraphs of information, and a simple bulleted list of links to the various
    subpages. This page is defined using the HTML in Listing 22.1.


