  md: '# HOUR 7


    # Testing and Comparing Values


    Having survived Hours 5 and 6 of this book, you should now be familiar with creating
    and using variables of all sorts. In this hour, you''ll learn how to make better
    use of variables by comparing, testing, and evaluating their values with the tools
    provided by JavaScript.


    In Hour 7, you''ll learn to use conditional statements in JavaScript. You will
    cover the following topics:


    +   * Testing variables with the if statement

    * Using various operators to compare values

    * Using logical operators to combine conditions

    * Using alternate conditions with else

    * Creating expressions with conditional operators

