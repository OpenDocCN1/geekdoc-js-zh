    The action of the script is performs by lines 18–26. Line 18 begins a loop for
    that

    loops from 0 to the number of plug-ins (the length property of the plugins array).


    The document.write statements in lines 19–25 display the properties for a single
    plugin

    object, along with some HTML tags to make the table. This script''s output in
    Navigator

    is shown in Figure 20.


    # Using Objects in Plug-Ins


    You now know how to use the navigator object''s properties to detect plug-ins.
    You can

    also use objects to manipulate plug-ins themselves.


    Each embedded object in a document is represented by an element in the embeds
    array,

    which is a child of the document array. For example, if a document contains a
    single

    embedded object, it is represented by document.embeds[].


