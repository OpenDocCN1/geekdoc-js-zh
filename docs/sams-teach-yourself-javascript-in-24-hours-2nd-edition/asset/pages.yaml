  md: '# Supporting Browsers with JavaScript


    If you''re using features that are on the cutting edge and require a particular
    browser or version, there are several ways of using JavaScript to steer users
    in the right direction.

    The following sections explain three different methods.


    # Creating a Browser-Specific Page


    The easiest solution—and the least polite—is to pick a browser version to support
    and kick everyone out who isn''t using it. This is easy to do with a script in
    the header or body of the page. Listing 16.2 shows a simple example.


    +   Listing 16.2 Creating a Browser-Specific Page


    ```

    1: <script language="JavaScript">

    2: if (navigator.appName.indexOf(''Netscape'') == -1

    3: // navigator.appName.indexOf(''5.0'') == -1

    4: window.alert("Download Netscape now, or else.");

    5: window.location = "http://www.netscape.com/";

    6: </script>

    ```


    If you''re using a non-Netscape browser or a version of Netscape other than 5.0/6.0,
    this script displays a rude message and sends you to Netscape''s Web page. Needless
    to say, there are more polite ways of saying this.


    > If you must make a page browser-specific, be sure you have a good reason to
    do so. If other browsers can display the page''s content—even if your buttons
    or animations don''t—you should support them. Few users are willing to download
    a new browser just for your page, so you''ll be losing a good part of your audience.


    # Branching to Separate Pages


    In most cases, it''s not hard to support more than one browser. If you want to
    fine-tune your pages to display perfectly on both Netscape and IE, one convenient
    way is to create a separate version of the page for each browser. You can then
    use JavaScript to send the user to the appropriate page.


    Listing 16.3 shows a script that could be placed on the introductory page of a
    site. After detecting the browser version, it sends the user to the appropriate
    page.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# LISTING 16.3 Sending Browsers to Specific Pages


    ```

    1: <script language="Javascript">

    2: if (navigator.appName.indexOf("Netscape") > -1

    3: && navigator.version.indexOf("5") > -1)

    4: window.location = "netscape.html";

    5: if (navigator.appName.indexOf("Microsoft") > -1

    6: && navigator.version.indexOf("4") > -1)

    7: window.location = "ie.html";

    8: window.location = "default.html";

    9: </script>

    ```


    This script sends the user to one of three pages: netscape.html for Netscape 5.x
    or 6.x, ie.html for Internet Explorer 4.x or 5.x, or default.html.


    > You might have noticed that there is no third statement in Listing 16.3. The
    statement to send the user to default.html is unconditional. This works because
    if either of the statements was true, the browser would have been sent to a different
    page, immediately aborting the current script. The only browsers that make it
    to the last line are those that aren''t detected specifically.


    # Making a Multiple-Browser Page


    The third alternative is to make a single page that supports more than one type
    of browser. You can use a script in the page to detect the browser, and then use
    script commands to include different HTML codes in the document depending on the
    browser.


    This method uses only one document, but you might find that it transforms a long,
    impossibly complicated page. A short example of a page that does this is included
    in the “Workshop: Scripting for Multiple Browsers” section of this hour.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_237_0.png)


    > Some more complex issues involved with cross-browser scripting are presented
    in Hour 19, “Using Advanced DOM Features."


    # Supporting Non-JavaScript Browsers


    What about browsers that don''t support JavaScript at all? You can''t detect them
    with a script because they won''t even run the script. However, there are ways
    of dealing with these browsers.'
