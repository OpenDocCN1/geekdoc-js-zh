    # Displaying Browser Information


    As an example of how to read the navigator object''s properties, Listing 16.1
    shows a script that displays a list of the properties and their values for the
    current browser.


    # LISTING 16.1 A Script to Display Information About the Browser


    ```

    <html>

    <head>

    <title>Browser Information</title>

    </head>

    <body>

    <h1>Browser Information</h1>

    <hr>

    <p>

    <navigator></p> object contains the following information

    about the browser you are using.

    </p>

    <ul>

    <script LANGUAGE="JavaScript">

    document.write("<li>Code Name:</li>" + navigator.appCode);

    document.write("<li>App Name:</li>" + navigator.appName);

    document.write("<li>App Version:</li>" + navigator.appVersion);

    document.write("<li>User Agent:</li>" + navigator.userAgent);

    document.write("<li>Language:</li>" + navigator.language);

    document.write("<li>Platform:</li>" + navigator.platform);

    </script>

    </ul>

    </script>

    <hr>

    </body>

    </html>

    ```


    This script includes a basic HTML document. A script is used within the body of
    the document (lines 13 to 20) to display each of the properties of the navigator
    object using the document.write statement.


    To try this script, load it into the browser of your choice. If you have more
    than one browser or browser version handy, try it in each one. Netscape 6''s display
    of the script is shown in Figure 16.1.


