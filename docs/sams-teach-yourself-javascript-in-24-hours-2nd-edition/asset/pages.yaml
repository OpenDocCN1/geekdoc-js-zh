  md: '# The if Statement


    One of the most important features of a computer language is the capability to
    test and compare values. This allows your scripts to behave differently based
    on the values of variables, or based on input from the user.


    The if statement is the main conditional statement in JavaScript. This statement
    means much the same in JavaScript as it does in English—for example, here is a
    typical conditional statement in English:


    If the phone rings, answer it.


    This statement consists of two parts: a condition (If the phone rings) and an
    action (answer it). The if statement in JavaScript works the same way. Here is
    an example of a basic if statement:




    ```

    if (a == 1) window.alert("Found a !");

    ```


    This statement includes a condition (if it equals a) and an action (display a
    message). This statement checks the variable a, and if it has a value of t, it
    prints a message. Otherwise, it does nothing.


    If you use an if statement like the preceding example, you can use a single statement
    as the action. You can also use multiple statements for the action by enclosing
    them in braces ({}), as shown in Listing 7.1.


    # Listing 7.1 An Statement with Multiple Action Statements


    ```

    1: if (a == 1) {

    2:   window.alert("Found a !");

    3:   a = 0;

    4: }

    ```


    This block of statements checks the variable a once again. If it finds a value
    of t, it displays a message and sets it back to 0.


    # Conditional Operators


    While the action part of an if statement can include any of the JavaScript statements
    you''ve already learned (and any others, for that matter), the condition part
    of the statement uses its own syntax. This is called a *conditional expression*.


    A conditional expression includes two values to be compared (in the preceding
    example, the values were a and 1). These values can be variables, constants, or
    even expressions in themselves.'
  merge: -1
