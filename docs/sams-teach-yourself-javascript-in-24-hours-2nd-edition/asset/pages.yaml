  md: '# Using Built-In Objects


    +   - getTimezoneOffset() gives you the local time zone''s offset from GMT (Greenwich
    Mean Time, also known as UTC). In this case, local refers to the location of the
    browser (Of course, this only works if the user has set their system clock accurately.).


    +   - toTimeString() converts the date object''s time value to text, using GMT.


    +   - toLocaleString() converts the date object''s time value to text, using local
    time.


    # Converting Between Date Formats


    Two special methods of the Date object allow you to convert between date formats.
    Instead of using these methods with a Date object you created, you use them with
    the built-in object itself. These include the following:


    +   - Date.parse() converts a date string, such as June 20, 1996 to a Date object
    (number of milliseconds since 1/1/1970).


    +   - Date.UTC() does the opposite. It converts a Date object value (number of
    milliseconds) to a UTC (GMT) time.


    # Workshop: Working with the Math Object


    The Math.random method, discussed earlier in this hour, generates a random number
    between 0 and 1. However, it''s very difficult for a computer to generate a truly
    random number. (It''s also hard for a human to do so—that''s why dice were invented.).


    Today''s computers reasonably well at generating random numbers, but just how
    good is JavaScript''s Math.random function? One way to test it is to generate
    many random numbers and calculate the average of all of them.


    In theory, the average should be near .5, halfway between 0 and 1. The more random
    values you generate, the closer the average should get to this middle ground.


    As an example of the Math object, you can create a script that tests JavaScript''s
    random function. To do this, you''ll generate 5,000 random numbers and calculate
    their average.


    In case you skipped Hour 8, "Repeating Yourself: Using Loops," and are getting
    out your calculator. don''t worry—you''ll use a loop to generate the random numbers.
    (You''ll be surprised how fast JavaScript can do this).


    To begin your script, you will initialize a variable called total. This variable
    will store a running total of all the random values, so it''s important that it
    starts at 0:


    ```

    total = 0;

    ```'
