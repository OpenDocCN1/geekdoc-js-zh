  md: '# JavaScript Quick Reference


    +   - getTimeZoneOffset gives the local zone''s offset from GMT.

    - toGMTString converts the date object''s time value to text, using GMT (Greenwich
    Mean Time, also known as UTC).

    - toLocale converts the date object''s time value to text, using local time.

    - Date.parse converts a date string, such as "June 20, 2003" to a date object
    (number of milliseconds since 1/1/1970).

    - Date.UTC converts a date value number (number of milliseconds) to a UTC (GMT)
    time.


    # Basic DOM (Document Object Model) Objects


    The DOM includes objects that represent the browser window, the current document,
    and its contents. The basic objects are summarized here, and explained in detail
    in Hour 10, "Working with the Document Object Model." More sophisticated DOM features
    are covered in Hours 17–19.


    # Window


    The window object represents the current browser window. If multiple windows are
    open or frames are used, there may be more than one window object. These are given
    aliases to distinguish them:


    +   - self is the current window, as is window. This is the window containing
    the current JavaScript document.

    - top is the window currently on top (active) onscreen.

    - parent is a window that contains frames. Each frame is a window object under
    parent.

    - The frames array contains the window object for each frame. These can be addressed
    as parent.frames[] through the number of frames, or with their individual names,
    as in parent.docframe.


    The window object has three child objects:


    +   - The location object stores the location (URL) of the document displayed
    in the window.

    - The document object holds the Web page itself.

    - The history object contains a list of sites visited before or after the current
    site in the window.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_374_0.png)'
