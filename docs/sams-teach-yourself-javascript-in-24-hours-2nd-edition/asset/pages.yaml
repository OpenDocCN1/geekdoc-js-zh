  md: '# Summary


    In this hour, you''ve learned how to debug JavaScript programs. You examined some
    techniques for producing scripts with a minimum of bugs and learned some tools
    that will help you find bugs in scripts. Finally, you tried your hand at debugging
    a script.


    Congratulations—you''re nearing the final hours of your JavaScript education.
    In the next two hours, you will use the scripting commands and techniques you''ve
    learned to create complete applications.


    # Q&A


    +   Why are some errors displayed after the script runs for a time, while others
    are displayed when the script loads?


    +   The JavaScript interpreter looks at scripts in the body or heading of the
    document, such as function definitions, when the page loads. Event handlers aren''t
    checked until the event happens. Additionally, a statement might look fine when
    the page loads, but will cause an error because of the value of a variable it
    uses later.


    +   What is the purpose of the location.reload statements in the number guesser
    script?


    +   This is an easy way to start a new game by reloading the page reinitializes
    the variables. This results in a new number being picked, and the default "Guess
    a Number" message is displayed in the hint field.


    +   The JavaScript console in Netscape is useful for testing JavaScript commands
    when I''m not sure of the syntax. Is there an equivalent in Internet Explorer?


    +   A not built-in one, but I''ve created a JavaScript-based console that works
    in Netscape or Internet Explorer. It can''t display errors like Netscape''s console,
    but it is useful for testing commands interactively. You can find it at this book''s
    Web site: http://www.javascript.com/


    # Quiz


    Test your knowledge of avoiding and debugging JavaScript errors by answering the
    following questions.'
