  md: '# Tools for Scripting


    Unlike many programming languages, you won''t need any special software to create
    JavaScript scripts. In fact, you probably already have everything you need.


    The first thing you''ll need to work with JavaScript is an editor. JavaScript
    scripts are stored in simple text files, usually as part of HTML documents. Any
    editor that can store ASCII text files will work.


    You can choose from a wide range of editors, from simple text editors to word
    processors. If you don''t have a favorite editor already, a simple editor is most
    likely included with your computer. For Windows computers, the Notepad accessory
    will work fine.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_39_0.png)


    > If you use a word processor to create JavaScript programs, be sure you save
    the files as ASCII text rather than as word processing documents.


    A variety of dedicated HTML editors are also available and will work with JavaScript.
    In fact, many include features specifically for JavaScript—for example, coloring
    the JavaScript scripts to indicate their purposes, or even creating simple scripts
    automatically.


    For Windows computers, here are a few recommended editors:


    +   * **HomeSite**: An excellent HTML editor that includes JavaScript support.

    * **Microsoft FrontPage 2000**: Microsoft''s visual HTML editor. The Script Builder
    component allows you to easily create simple scripts.

    * **TextPad**: A powerful text editor that includes a number of features missing
    from Notepad.


    For the Macintosh, BBEdit, BBEdit Lite, and Alpha are good HTML editors that you
    can use to create Web pages and scripts.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_39_1.png)


    > Appendix B, "Tools for JavaScript Developers," includes Web addresses to download
    these and other HTML and JavaScript editors.


    You''ll need two other things to work with JavaScript: A web browser and a computer
    to run it on. Since this book covers new features introduced up to JavaScript
    1.5, I'
