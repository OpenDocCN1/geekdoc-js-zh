  md: '# # Working with the location Object


    A third child of the window object is the location object. This object stores
    information about the current URL stored in the window. For example, the following
    statement loads a URL into the current window:


    ```

    window.location.href="http://www.starlingtech.com";

    ```


    The href property used in this statement contains the entire URL of the window''s
    location object. You can also access properties of the URL with various properties
    of the location object—for example, location.protocol is the protocol part of
    the URL (typically http):


    > Although the location.href property usually contains the same URL as the document.URL
    property described earlier in this chapter, you can''t change the document.URL
    property. Always use location.href to load a new page.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_154_0.png)


    The location object has two methods:


    +   - location.reload reloads the current document. This is the same as the Reload
    button on Netscape''s toolbar.

    - location.replace replaces the current location with a new one. This is similar
    to setting the location object''s properties yourself. The difference is that
    the replace method does not affect the browser''s history. In other words, the
    Back button can''t be used to go to the previous location.


    # # Reading Information about the Browser


    > The navigator object is named after Netscape Navigator, which was the only browser
    that supported JavaScript when the language first appeared in Navigator 2.0. Despite
    its Netscape-specific name, this object is now supported in Microsoft Internet
    Explorer.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_154_1.png)'
