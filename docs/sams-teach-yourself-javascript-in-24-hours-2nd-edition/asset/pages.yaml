  md: '# HOUR 10


    # Working with the Document Object Model


    In Hour 9, “Using Built-In Objects,” you learned about JavaScript’s support for
    objects, which allows you to store data in all sorts of interesting ways. However,
    the way you’ll use objects the most is in accessing the objects in the Document
    Object Model (DOM), which lets your scripts manipulate Web pages, windows, and
    documents.


    In this hour, you will explore this hierarchy of objects. Hour 10 covers the following
    topics:


    +   - How to access the various objects in the DOM

    - Working with windows using the window object

    - Working with Web documents with the document object

    - Using objects for links and anchors

    - Using the location object to work with URLs

    - Getting information about the browser with the navigator object

    - Creating JavaScript-based Back and Forward buttons


    ![](img/253d3bf9d2a81ee62f8085998b463a44_146_0.png)'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# Understanding the Document Object Model


    One advantage that JavaScript has over basic HTML is that scripts manipulate the
    Web document and its contents. Your script can load a new page into the browser,
    with parts of the browser window and document, open new windows, and even modify
    text within the page dynamically.


    To work with the browser and documents, JavaScript uses a hierarchy of parent
    and child objects called the Document Object Model, or DOM. These objects are
    organized into a tree-like structure, and represent all of the content and components
    of a Web document.


    Like other objects you''ve explored, the objects in the DOM have *properties*,
    which describe the Web page or document, and *methods*, which allow you to work
    with parts of the Web page.


    When you refer to an object, you use the parent object name followed by the child
    object name or names, separated by periods. For example, JavaScript stores objects
    to represent images in a document as children of the document object. The following
    refers to the image9 a child of the document object, which is a child of the window
    object:


    window.document.image9


    The window is the parent object for all of the objects we will be looking at in
    this hour. Figure 10.1 shows this section of the DOM object hierarchy and a variety
    of its objects.


    FIGURE 10.1

    The JavaScript browser object hierarchy.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_147_0.png)


    This diagram includes only the basic browser objects that will be covered in this
    hour. These are actually a small part of the Document Object Model, which you''ll
    learn more about starting with Hour 17, "Working with Style Sheets."'
  merge: -1
  pgno: 147
