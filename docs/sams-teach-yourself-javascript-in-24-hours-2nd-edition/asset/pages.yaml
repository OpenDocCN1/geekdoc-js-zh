  md: 'You might have noticed that you could have done the same thing with a for loop:


    for (n=0;total < 10; n++) {

    total += values[n];

    }


    As a matter of fact, the for loop is nothing more than a special kind of while
    loop that handles an initialization and an increment for you. You can generally
    use while for any loop. However, it''s best to choose whichever type of loop makes
    the most sense for the job, or that takes the least amount of typing.",.


    # # Using do...while Loops


    JavaScript 1.2 introduced a third type of loop: the do...while loop. This type
    of loop is similar to an ordinary while loop, with one difference: the condition
    is tested at the end of the loop rather than the beginning. Listing 8.3 shows
    a typical do...while loop.


    **LISTING 8.3** An Example of a do...while Loop


    ```

    1: do {

    2: n++;

    3: total += values[n];

    4: }

    5: while (total < 10);

    ```


    As you''ve properly noticed, this is basically an upside-down version of the while
    example in Listing 8.2. There is one difference: with the do loop, the condition
    is tested at the end of the loop. This means that the statements in the loop will
    always be executed at least once, even if the condition is never true.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_123_0.png)


    > As with the for and while loops, the do loop can include a single statement
    without braces, or a number of statements enclosed in braces.


    # # Working with Loops


    Although you can use simple for and while loops for straightforward tasks, there
    are some considerations you should make when using more complicated loops. In
    the next sections, we''ll look at infinite loops and the break and continue statements,
    which give you more control over your loops.'
