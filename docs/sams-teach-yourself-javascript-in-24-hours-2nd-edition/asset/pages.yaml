    # Understanding Methods


    As you learned in Hour 5, “Using Variables and Functions,” functions are combinations

    of statements that can be executed as a single unit. Methods are functions that
    are stored

    as properties of an object.


    You''ve already used methods. For example, the to method of String objects

    verts a string to uppercase. Here is an example using a string called value:


    ```

    value.toUpperCase();

    ```


    Like ordinary functions, methods can optionally return a value. For example, this
    state-

    ment rounds a number using the round method of the Math object and stores the
    result in

    the variable final:


    ```

    final = Math.round(num);

    ```


    # Using with the Keyword


    The keyword is one that you haven''t seen before. You can use it to make JavaScript
    pro-

    gramming easier—or at least easy to type.


    The keyword specifies an object, and it is followed by a block of statements

    enclosed in braces. For each statement in the block, any properties you mention
    without

    specifying an object are assumed to be for that object.


    As an example, suppose you have a string called lastname. You can use to perform

    string operations on it without specifying the name of the string every time:


    ```

    with (lastname) {

    window.alert("The length of last name: " + length);

    window.alert("The last name is: " + toUpperCase());

    }

    ```


    In this example, the length property and the toString method refer to the lastname

    string, although it is only specified once with the keyword.


    Obviously, the with keyword only saves a bit of typing in situations like this.
    However,

    y will find it very useful when you''re dealing with an object throughout a large
    pro-\cedure, or when you are using a built-in object, such as the Math object.'
