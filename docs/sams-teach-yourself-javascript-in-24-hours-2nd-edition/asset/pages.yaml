  md: '# # Hiding and Showing Objects


    We will now move on to a number of real-world examples using the DOM objects to
    manipulate Web pages. As a simple example, you can create a script that hides
    or shows objects within a page.


    As you learned in Hour 17, "Working with Style Sheets," objects have a visibility
    style property that specifies whether they are currently visible within the page:


    ```

    Object.style.visibility="hidden"; // hides an object

    Object.style.visibility="visible"; // shows an object

    ```


    It should be simple to use a script to change these values and hide or show an
    element. However, this is complicated by the fact that Internet Explorer 5.0 and
    5.5 do not support the visibility property in JavaScript. They do, support this
    alternative:


    ```

    Object.style.display="none"; // hides an object

    Object.style.display="""; // shows an object

    ```


    Keeping in mind, you can create a script that hides or shows objects in either
    browser. Listing 19.1 shows the HTML document for a script that allows two headings
    to be shown or hidden.


