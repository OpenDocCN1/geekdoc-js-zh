    # Summary


    In this hour, you''ve learned how to use the window object to work with browser
    windows, and used its properties and methods to set timeouts and display dialog
    boxes. You''ve also learned how JavaScript can work with framed documents.


    In the next hour, you''ll move on to another unexplored area of the JavaScript
    object hierarchy—the form object. You''ll learn how to use frames to create some
    of the most useful applications of JavaScript.


    # Q&A


    +   Q When a script is running in a window created by another script, how can
    it refer back to the original window?


    +   A In Netscape 3.0 and later, JavaScript includes the window.opener property,
    which lets you refer to the window that opened the current window.


    +   Q I''ve heard about layers, which are similar to frames, but more versatile,
    and are supported in Netscape 4.0. Can I use them with JavaScript?


    +   A Yes, Like windows and frames, each layer has its own window object. You''ll
    learn how to use layers in Hour 18, “Creating Dynamic Pages with the DOM."'
