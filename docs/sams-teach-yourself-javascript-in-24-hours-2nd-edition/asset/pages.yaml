    either yes (1) or no (0): toolbar, location, directories, status, menus, scrollbars,
    and resizable. You can list only the features you want to change from the default.
    This example creates a small window with no toolbar or status line:


    ```

    SmallWin = window.open('''',small'',width=100,height=120,toolbar=0,status=0'');

    ```


    > You can manipulate the current window in a variety of ways from a signed script,
    which has the user''s permission to gain greater control over the browser. See
    Appendix A, "Other JavaScript Resources," for a list of Web sites with information
    about signed scripts and other advanced features.


    # Opening and Closing Windows


    Of course, you can close windows as well. The window.close() method closes a window.
    Browsers don''t allow you to close the main browser window without the user''s
    permission: its main purpose is for closing windows you have created. For example,
    this statement closes a window called updatedwindow:


    ```

    updatedwindow.close();

    ```


    As another example, Listing 13.1 shows an HTML document that enables you to open
    a new window by pressing a button. (I have specified a very small size for the
    second window so you can tell them apart.) You can then press another button to
    close the new window. The third button attempts to close the current window. Netscape
    and Internet Explorer allow this, but for confirmation first.


    # Listing 13.1 Opening and Closing Windows with JavaScript


    ```

    <html>

    <head><title>Create a New Window</title>

    </head>

    <body>

    <h1>Create a New Window</h1>

    <hr>

    <p>Use the buttons below to test opening and closing windows in JavaScript</p>

    <br>

    <form NAME="winform">

    <input TYPE="button" VALUE="Open New Window"

    onclick="NewWin=window.open('''',NewWin'',

    ''toolbar=no,status=no,width=200,height=100); '' >

    <p><input TYPE="button" VALUE="Close New Window"

    onclick="NewWin.close();"></p>

    ```'
