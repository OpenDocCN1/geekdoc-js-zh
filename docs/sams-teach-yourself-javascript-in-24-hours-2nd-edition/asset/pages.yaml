  md: '# Adding the Script to a Web Page


    You should now have a complete script that calculates a result and displays it.
    Your listing should match Listing 2.2. In case you''re still a bit confused, Listing
    2.3 is a line-by-line breakdown of the script with an explanation for each statement.


    # LISTING 2.2 The Complete Date and Time Script


    ```

    1: <script language="JavaScript">

    2: now = new Date();

    3: localtime = now.toString();

    4: utctime = now.getGMTString();

    5: document.write("<b>Local time:</b>" " + localtime + "<br>");

    6: document.write("<b>UTC time:</b>" " + utctime + "</pp>");

    7: </script>

    ```


    # LISTING 2.3 A Descriptive Breakdown of the Date and Time Script


    +   1: The script begins here:

    2: Store the current date and time in the new variable

    3: Store the local time as a string in localtime

    4: Store the UTC time as a string in utctime

    5: Display the local time string within the Web page

    6: Add the UTC time string to the Web page

    7: The script ends here.


    To use your script, you''ll need to add it to an HTML document. In its most basic
    form, the HTML document should include opening and closing <html><head> tags and
    <body> tags.


    If you add these tags to the document containing your script along with a descriptive
    heading, you end up with something like Listing 2.4.


    # LISTING 2.4 The Date and Time Script in an HTML Document


    ```

    1: <html>

