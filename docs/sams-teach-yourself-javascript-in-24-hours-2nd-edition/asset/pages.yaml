    # Using Image Maps with JavaScript


    Image maps are a popular way to provide navigation for a site. They''re images
    that are divided into a number of "hot spots," or areas that act as links. Using
    JavaScript, you can perform script commands when an area of the image is clicked.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_217_0.png)


    There are two types of image maps: client-side and server-side. Client-side maps
    define the linked areas of the image within the HTML document, and thus can be
    used with JavaScript. Server-side maps require a separate map definition file,
    and are handled by Web servers.


    As an example of using a client-side image map with JavaScript, let''s create
    a simple image map menu for a fictional company. The company''s name isn''t important,
    but it''s obviously not a graphic design company.


    To create a client-side map, you need to do three things:


    +   - Use your favorite graphics application to create the actual graphic as a
    GIF or JPEG image. The sample image used in this example is available at this
    book''s Web site, www.jworkshop.com.


    +   - Create a MAP definition that describes areas in the image.


    +   - Include the image map in the document, using the USEMAP attribute to point
    to the map definition.


    15.1 shows the example client-side image map definition.


    # Listing 15.1 Using a Client-Side Image Map with JavaScript


    ```

    1: <html>

    2: <head>

    3: <title>Image Map Example</title>

    4: <script LANGUAGE="JavaScript">

    5: function update(t) {

    6: document.form1.text.value = t;

    7: }

    8: </script>

    9: </head>

    10: <body>

    ```'
