  md: '# Working with DOM Nodes


    As you learned in Hour 18, "Creating Dynamic Pages with the DOM," the DOM organizes
    objects within a Web page into a tree-like structure. Each node (object) in this
    tree can be accessed via JavaScript. In the next sections you will learn how you
    can use the properties and methods of nodes to manage them.


    The sections below only describe the most important properties and methods of
    nodes, and those that are supported by current browsers. For a complete list of
    available properties, see the W3C''s DOM specification at http://www.w3.org/TR/DOM-Level-2.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_273_0.png)


    # Basic Node Properties


    You have already used the style property of nodes to change their stylesheet values.
    Each node also has a number of basic properties that you can examine or set. These
    include the following:


    +   * nodeName is the name of the node (not the ID). For nodes based on HTML tags,
    such as <p> or <body>, the name is the tag name: P or BODY. For the document node,
    the name is a special code: #document. Similarly, text nodes have the name #text.

    * nodeType is an integer describing the node''s type: 1 for normal HTML tags,
    3 for text nodes, and 9 for the document node.

    * nodeValue is the actual text contained within a text node.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_273_1.png)


    > The nodeValue property is not available for non-text nodes. There is no easy
    way to get the HTML contents of a node, such as body or div.


    # Node Relationship Properties


    In addition to the basic properties described above, each node has a number of
    properties that describe its relation to other nodes. These include the following:


    +   * first is the first child object for a node. For nodes that contain text,
    such as h1 or p, the text node containing the actual text is the first child.

    * lastChild is the node''s last child object.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Using Advanced DOM Features


    +   - childNodes is an array that includes all of a node''s child nodes. You can
    use a loop

    with this array to work with all of the nodes under a given node.

    - previousSibling is the sibling (node at the same level) previous to the current
    node.

    - nextSibling is the sibling after the current node.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_274_0.png)


    > Remember that, like all JavaScript objects and properties, the node properties
    and functions described here are case-sensitive. Be sure you type them exactly
    as shown.


    # Document Methods


    The document itself has several methods you may find useful. You have already
    used one of these, getElementById, to refer to DOM objects by their ID properties.
    The document''s methods include the following:


    +   - getElementById(ID) returns the element with the specified ID attribute.

    - getElementsByTagName(tag) returns an array of all the elements with a specified
    tag name. You can use the wildcard "*" to return an array containing all the nodes
    in the document.

    - createTextNode(text) creates a new text node containing the specified text,
    which you can add to the document.


    # Node Methods


    Each node within a page has a number of methods available. Which of these are
    valid depends on the node''s position in the page, and whether it has parent or
    child nodes. These include the following:


    +   - appendChild(new) appends the new node after all of the object''s existing
    nodes.

    - insertBefore(new,old) specifies the new child node before the specified old
    node, which must already exist.

    - replaceChild(new,old) replaces the specified old child node with a new node.

    - removeChild(old) removes a child node from the object''s set of children.

    - hasChildNodes() returns a boolean value of true if the object has one or more
    child nodes, or false if it has none.'
