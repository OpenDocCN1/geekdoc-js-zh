  md: '# LISTING 19.4 script LANGUAGE="JavaScript">


    ```

    4: <script LANGUAGE="JavaScript">

    5: msg = "This is an example of a scrolling message; ";

    6: msg += "It appears in the body of the page ";

    7: msg += "instead of in the status line. ";

    8: spacer = ""

    9: pos = 0;

    10: function ScrollMessage() {

    11: var newtext = msg.substring(pos, msg.length) +

    12: spacer + msg.substring(0, pos);

    13: var td = document.getElementById(''scroll'');

    14: td.firstChild.nodeValue = newtext;

    15:

    16: if (pos > msg.length || pos == 0) {

    17: window.setTimeout(''ScrollMessage'',200);

    18: }

    19: </script>

    20: <head>

    21: <body onload="ScrollMessage();">

    22: <h1>A Better Scrolling Message</h1>

    23: <p>Rather than using the status line, this page uses

    24: the DOM to scroll a message within the small table below.</p>

    25: <table width="90%" border>

    26: <tr>

    27: <td id="scroll" width="90%"> The scrolling message goes here.</td>

    28: </tr>

    29: </table>

    30: </body>

    31: </html>

    ```


    In this example, lines 25–29 define a simple table to contain the scrolling message.
    The <td> tag has an identifier of scroll, and will be the actual container for
    the scrolling text.


    Lines 5–9 initialize the variables for this script, and the ScrollMessage function
    in lines 10–18 performs the actual scrolling. This function is first called by
    the document’s onload method.


    Lines 11–16 handle the scroll within the newtext string. Line 13 assigns the td
    variable to the table where the scrolling happens, and line 14 sets the cell''s
    text node to the new version of the message.


    Finally, lines 15–16 handle the pos counter for the current scroll position, and
    line 17 uses the setTimeout to call the ScrollMessage function again after a short
    delay. Figure 19.4 shows this example in Netscape 6.0.'
