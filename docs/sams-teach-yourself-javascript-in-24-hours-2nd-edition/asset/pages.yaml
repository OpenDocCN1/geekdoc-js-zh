    # # Aligning Text


    One of the most useful features of style sheets is the capability to change the
    spacing and

    alignment of text. Most of these features aren''t available using standard HTML.
    You can

    use the following properties to change the alignment and spacing of text:


    +   - letter-spacing—Specifies the spacing between letters (Internet Explorer
    4.0 and

    l only).

    - text-decoration—Allows you to create lines over, under, or through the text,
    or

    to choose blinking text.

    - vertical-align—Allows you to move the element up or down to align with other

    elements on the same line (Internet Explorer 4 only).

    - text-align—Specifies the justification of text. This can be left, right, center,

    or justify.

    - text-transform—Changes the capitalization of text. capitalize makes the first

    letter of each word uppercase; uppercase makes all letters uppercase; and

    lowercase makes all letters lowercase.

    - text-indent—Allows you to specify the amount of indentation for paragraphs and

    other elements.

    - line-height—This allows you to specify the distance between the top of one line

    of and the top of the next.


    # # Changing Colors and Background Images


    You can use style sheets to gain more control over the colors and background

    images used on your Web page. CSS includes the following properties for this purpose:


    +   - color—Specifies the text color of an element. This is useful for emphasizing
    text

    or for using a specific color scheme for the document.

    - background-color—Specifies the background color of an element. By setting this

    value, you can make paragraphs, table cells, and other elements with unique back-

    ground colors.'
