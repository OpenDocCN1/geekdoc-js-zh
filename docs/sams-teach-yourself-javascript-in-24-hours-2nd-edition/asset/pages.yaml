- img_proc: true
  md: '# Creating an Object Instance


    Now let''s use the object definition and method you created above. To use an object
    definition, you create a new object. This is done with the new keyword. This is
    the same keyword you''ve already used to create Date and Array objects.


    The following statement creates a new Card object titled:


    ```

    tom = new Card("Tom Jones", "123 Elm Street", "555-1234", "555-9876");

    ```


    As you can see, creating an object is easy. All you do is call the Card() function
    (the object definition) and give it the required attributes, in the same order
    as the definition.


    Once this statement executes, a new object is created to hold Tom''s information.
    This is called an instance of the Card object. Just as there can be several string
