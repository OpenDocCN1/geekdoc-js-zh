  md: 'You can then create a new object using new:


    ```

    Fred = new Name("Fred", "Smith");

    ```


    # # Customizing Objects


    You can add additional properties to an object you have created just by assigning
    them:


    ```

    Fred.middle = "Clarence";

    ```


    Properties you add this way apply only to that instance of the object, not to
    all objects of the type. A more permanent approach is to use the prototype keyword,
    which adds a property to an object''s prototype (definition). This means that
    any future object of the type will include this property. You can include a default
    value:


    ```

    Name.prototype.title = "Citizen";

    ```


    You can use this technique to add properties to the definitions of built-in objects
    as well. For example, this statement adds a property called num to all existing
    and future string objects, with a default value of 10:


    ```

    string.prototype.num = 10;

    ```


    # # JavaScript Statements


    This is an alphabetical listing of the statements available in JavaScript and
    their syntax.


    # # Comments


    Comments are used to include a note within a JavaScript program, and are ignored
    by the interpreter. There are two different types of comment syntax:


    ```

    // this is a comment

    /* this is also a comment */

    ```


    Only the second syntax can be used for multiple-line comments; the first must
    be repeated on each line.


    # # break


    This statement is used to break out of the current for or while loop. Control
    resumes after the loop, as if it had finished.


    # # continue


    This statement continues a for or while loop without executing the rest of the
    loop. Control resumes at the next iteration of the loop.'
