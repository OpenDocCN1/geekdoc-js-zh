  md: '# Using for Loops


    The keyword is the first tool to consider for creating loops. A for loop typically
    uses a variable (called a counter or index) to keep track of how many times the
    loop has executed, and it stops when the counter reaches a certain number. A basic
    for statement


    ```

    for (var = 1; var < 10; var++)

    ```


    There are three parameters to the for loop, separated by semicolons:


    +   * The first parameter (var = 1 in the example) specifies a variable and assigns
    an initial value to it. This called the initial expression because it sets up
    the initial state for the loop.

    * The second parameter (var < 10 in the example) is a condition that must remain
    true to keep the loop running. This is the condition of the loop.

    * The third parameter (var++ in the example) is a statement that executes with
    each iteration of the loop. This is called the increment expression because it
    is usually used to increment the counter.


    After the three parameters are specified, a left brace ({ is used to signal the
    beginning of a block. A right brace ()) is used at the end of the block. All the
    statements between the braces will be executed with each iteration of the loop.


    As with if statements, if you use only a single statement within the loop, you
    can include it rather than a block of statements. In this case, the braces are
    not required.


    This may sound a bit confusing, but once you''re used to it, you''ll use for loops
    frequently. A simple example of this type of loop is shown in Listing 8.1.


    # Listing 8.1 A Loop Using for the Keyword


    ```

    1: for (i=1; i<10; i++) {

    2: document.write("This is line "i,"<br>");

    3: }

    ```


    This example displays a message with the loop''s counter during each iteration.
    The output of Listing 8.1 would look like this:


    ```

    This is line 1

    This is line 2

    This is line 3

    This is line 4

    This is line 5

    This is line 6

    ```'
