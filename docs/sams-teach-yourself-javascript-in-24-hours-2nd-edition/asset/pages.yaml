  md: '# Understanding JavaScript


    Another language you may hear of is JavaScript. This is how Microsoft refers to
    its implementation of JavaScript, which is partially compatible with the Netscape
    version.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_32_0.png)


    # Alternatives to JavaScript


    JavaScript is not the only language used on the Web, and in some cases, it may
    not be the right tool for the job. Java, for example, can do some things better
    than JavaScript. In the following sections, we''ll look at a few commonly used
    Web languages and their advantages.


    # Java


    Java is a programming language developed by Sun Microsystems to create applets,
    or programs that execute within a Web page.


    Java is a compiled language, but the compiler produces code for a virtual machine
    rather than a real computer. The virtual machine is a set of rules for codes and
    their meanings, with capabilities that fit well into the scope of a Web browser.


    The virtual machine code is then interpreted by a Web browser. This allows the
    same Java applet to execute the same way on PCs, Macintoshes, and UNIX machines,
    and on different browsers.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_32_1.png)


    > Java is also a densely populated island in Indonesia and a slang term for coffee-fee.
    This has resulted in a widespread invasion of coffee-related terms in computer
    literature.


    At this point, we need to make one thing clear: Java is a fine language, but you
    won''t be learning it in this book. Although their names and some of their commands
    are similar, JavaScript and Java are entirely different languages.


    # ActiveX


    ActiveX is a specification developed by Microsoft that allows ordinary Windows
    programs to run within a Web page. ActiveX programs can be written in languages
    such as Visual C++ and Visual Basic, and they are compiled before being placed
    on the Web server.'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'ActiveX applications, called controls, are downloaded and executed by the Web
    browser, like Java applets. Unlike Java applets, controls can be installed permanently
    when they are downloaded, eliminating the need to download again.


    ActiveX''s main advantage is that it can do just about anything. This can also
    be a disadvantage: several enterprising programmers have already used ActiveX
    to bring new capabilities to Web pages, such as the "Web page that turns off your
    computer" and "the Web page that formats your disk drive.


    Fortunately, ActiveX has a signature feature that identifies the source of the
    control and prevents controls from being modified. While this won''t prevent a
    control from damaging your system, you can specify which sources of controls you
    trust.


    ActiveX has two main disadvantages. First, it isn''t as easy to program as a scripting
    language or Java. Second, ActiveX is proprietary: it works only in Microsoft Internet
    Explorer, and under Windows platforms.


    # VBScript


    VBScript, sometimes known as Visual Scripting Edition, is Microsoft''s answer
    to JavaScript. Just as JavaScript''s syntax is loosely based on Java, VBScript''s
    syntax is loosely based on Microsoft Visual Basic, a popular programming language
    for Windows machines.


    Like JavaScript, VBScript is a simple scripting language, and you can include
    VBScript statements within an HTML document. To begin a VBScript script, you use
    the <script LANGUAGE="VBScript"> tag.


    VBScript can do many of the same things as JavaScript, and it even looks similar
    in some cases. It has two main advantages:


    +   - For those who already know Visual Basic, it may be easier to learn than
    JavaScript.

    - It is closely integrated with ActiveX. Microsoft''s standard for Web-embedded
    applications.


    VBScript''s main disadvantage is that it is supported only by Microsoft Internet
    Explorer. JavaScript, on the other hand, is supported by both Netscape and Internet
    Explorer. JavaScript is also a much more popular language, and you can see it
    in use all over the Web.


    # CGI and Server-Side Scripting


    CGI (Common Gateway Interface) is not really a language, but a specification that
    allows programs to run on Web servers. CGI programs can be written in a number
    of languages, including Perl, C, and Visual Basic.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Understanding JavaScript


    CGI programs are heavily used on the Web. If you''ve ever typed information into
    a form and pressed a button to send it to a Web site, chances the data was sent
    to a CGI application.


    The main difference between CGI and JavaScript is that CGI executes on the server,
    while JavaScript executes on the client (the Web browser). The main disadvantage
    of CGI is that, since the data must be sent to the Web server and back, response
    time may be slow.


    On the other hand, CGI can do things JavaScript can''t. It can read and write
    files on the server. While a client-side JavaScript program can read information
    from a form and then manipulate it, it can''t store the data on the Web server.


    Along with traditional CGI, scripting languages such as Microsoft''s Active Server
    Pages, JavaScript Pages, Cold Fusion, and PHP are often used on Web servers. A
    server-side implementation of JavaScript is also available.


    > CGI and server-side programming are outside the focus of this book. You can
    learn more about these technologies with other books from Sams Publishing, including
    Sams Teach Yourself CGI in 24 Hours, Sams Teach Yourself Perl in 24 Hours, and
    Sams Teach Yourself PHP in 24 Hours.


    # Summary


    During this hour, you''ve learned what Web scripting is and what JavaScript is.
    You''ve also learned how to insert a script into an HTML document, and how JavaScript
    differs from other Web languages.


    If you''re waiting for some real JavaScript code, look no further than the next
    hour. “Creating a Simple Script,” which guides you through the process of creating
    a working JavaScript application.


    # Q&A


    +   Q If I plan to learn Java or CGI anyway, will I have any use for JavaScript?

    A A. JavaScript is the ideal tool for many applications, such as form validation.
    While Java and CGI have their uses, they can''t do all that JavaScript can do.

    Q Can a Web page include more than one set of <script> tags?

    A Yes. In fact, the larger scripts in this book will often include two or more
    script sections.'
  merge: -1
  pgno: 34
