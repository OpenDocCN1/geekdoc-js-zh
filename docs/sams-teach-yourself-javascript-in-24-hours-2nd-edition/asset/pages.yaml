- img_proc: true
  md: '# The Basics of HTML Forms


    Forms are among the most useful features of the HTML language. As you''ll learn
    during this hour, adding JavaScript to forms can make them more interactive and
    provide a number of useful features. The first step in creating an interactive
    form is to create the HTML form itself.


    # Defining a Form


    An HTML form begins with the <form> tag. This tag indicates that a form is beginning,
    and it enables form elements to be used. The <form> tag includes three parameters:


    +   - NAME is simply a name for the form. You can use forms without giving them
    names, but you''ll need to assign a name to a form in order to easily use it with
    JavaScript.

    - METHOD is either GET or POST; these are the two ways the data can be sent to
    the server.

    - ACTION is the CGI script that form data will be sent to when submitted. You
    can also use the mailto: action to send the form''s results to an email address,
    as described later in this hour.


    For example, here is a <form> tag for a form named Order. This form uses the GET
    method and sends its data to a CGI script called order.cgi in the same directory
    as the Web page itself:


    ```

    <form NAME="order" METHOD="GET" ACTION="order.cgi">

    ```


    For a form that will be processed entirely by JavaScript (such as a calculator
    or interactive game), the METHOD and ACTION attributes are not needed. You can
    use a simple <form> tag that names the form:


    ```

    <form NAME="calcform">

    ```


    The <form> tag is followed by one or more form elements. These are the data fields
    in the form, such as text fields, buttons, and checkboxes. In the next section,
    you''ll learn how JavaScript assigns objects to each of the form elements.


    # Using the form Object with JavaScript


    Each form in your HTML page is represented in JavaScript by a form object, which
    has the same name as the NAME attribute in the <form> tag you used to define it.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Getting Data with Forms


    Alternately, you can use the forms array to refer to forms. This array includes
    an item for each form element, indexed starting with 0. For example, if the first
    form in a document has the name form1, you can refer to it in one of two ways:


    ```

    document.form

    ```


    ```

    document.forms[0]

    ```


    # The form Object''s Properties


    Along with the elements, each form object also has a list of properties, most
    of which are defined by the corresponding <form> tag. You can also set these from
    JavaScript. They include the following:


    +   - action is the form''s ACTION attribute, or the program to which the form
    data will be submitted.

    - encoding is the MIME type of the form, specified with the ENTYPE attribute.
    In most cases, this is not needed.

    - length is the number of elements in the form. You cannot change this property.

    - method is the method used to submit the form, either GET or POST.

    - target specifies the window in which the result of the form (from the CGI script)
    will be displayed. Normally, this is done in the main window, replacing the form
    itself.


    # Submitting and Resetting Forms


    The form object has two methods, submit and reset. You can use these methods to
    submit the data or reset the form yourself, without requiring the user to press
    a button. One reason for this is to submit the form when the user clicks an image
    or performs another action that would not usually submit the form.


    > If you use the submit method to send data to a server or by email, Netscape
    will prompt the user to verify that she wants to submit the information. There''s
    no way to do this behind the user''s back.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_202_0.png)


    # Detecting Form Events


    The form object has two handlers, onSubmit and onReset. You can specify a group
    of JavaScript statements or a function call for these events within the <form>
    tag that defines the form.'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'If you specify a statement or function for the onSubmit event, the statement
    is called before the data is submitted to the CGI script. You can prevent the
    submission from happening by returning a value of false from the onSubmit event
    handler. If the statement returns true, the data will be submitted. In the same
    fashion, you can prevent a Reset button from working with an onRequest event handler.


    # Scripting Form Elements


    The most important property of the form object is the elements array, which contains
    an object for each of the form elements. You can refer to an element by its own
    name or by its index in the array. For example, the following two expressions
    refer to the first element in the order form, the name1 text field:


    ```

    document.order.elements[0]

    ```


    ```

    document.order.name1

    ```


    > Both forms and elements can be referred to by their own names or as indices
    in the forms and elements arrays. For clarity, the examples in this hour use individual
    form and element names rather than array references. You''ll also find it easier
    to use names in your own scripts.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_203_0.png)


    If you refer to forms and elements as arrays, you can use the length property
    to determine the number of objects in the array: document.forms.length is the
    number of forms in a document, document.form1.length is the number of elements
    in the form1!


    # Text Fields


    The most commonly used form elements are text fields. You can use them to prompt
    for a name, address, or any information. With JavaScript, you can display text
    in the field automatically. The following is an example of a simple text field:


    ```

    <input TYPE="TEXT" NAME="text1" VALUE="hello" SIZE="30">

    ```


    This defines a text field text1. The field gets a default value of "hello" and
    allows up to 30 characters to be entered. JavaScript treats this field as a text
    object with the name text1.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Getting Data with Forms


    Text fields are the simplest to work with in JavaScript. Each text object has
    the follow-ing properties:


    +   - name is the name given to the field. This is also used as the object name.

    - defaultValue is the default value and corresponds to the VALUE attribute. This
    is a read-only property.

    - value is the current value. This starts out the same as the default value, but
    can be changed, either by the user or by JavaScript functions.


    When you work with text fields, most of the time you will use the value attribute
    to read the value the user has entered or to change the value. For example, the
    following state-ments the value of a text field username in the order form to
    "John Q. User":


    ```

    document.order.username.value = "John Q. User";

    ```


    # Text Areas


    Text areas are defined with their own tag, <textarea>, and are represented by
    the textarea object. There is one major difference between a text area and a text
    field: Text areas allow the user to enter more than one line of information. Here
    is an example of a text area definition:


    ```

    <textarea name="text1" rows="2" cols="70">

    This is the content of the TEXTAREA tag.

    </textarea>

    ```


    This HTML defines a text area text1, with two rows and 70 columns available for
    text. In JavaScript, this would be represented by a text area object text1 under
    the form object.


    The text between the opening and closing <textarea> tags is used as the initial
    value for the text area. You can include line breaks within the default value.


    # Working with Text in Forms


    The text and textarea objects also have a few methods you can use:


    +   - focus() sets the focus to the field. This positions the cursor in the field
    and makes it the current field.

    - blur() is the opposite; it removes the focus from the field.

    - select() selects the text in the field, just as a user can do with the mouse.
    All of the text is selected; there is no way to select part of the text.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_204_0.png)'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'You can use event handlers to detect when the value of a text field changes.
    The text and textarea objects support the following event handlers:


    +   - The onFocus event happens when the text field gains focus.


    +   - The onBlur event happens when the text field loses focus.


    +   - The onChange event happens when the user changes the text in the field and
    then moves out of it.


    +   - The onSelect event happens when the user selects some or all of the text
    in the field. Unfortunately, there''s no way to tell exactly which part of the
    text was selected. (If the text is selected with the select() method described
    above, this event is not triggered.)


    If used, these event handlers should be included in the <input> tag declaration.
    For example, the following is a text field including an onChange event that displays
    an alert:


    ```

    <input TYPE="TEXT" NAME="text1" onChange="window.alert(''Changed.'');">

    ```


    # Buttons


    The final type of element is a button. Buttons use the <input> tag and can use
    one of three types:


    +   - type=SUBMIT is a submit button. This button causes the data in the form
    fields to be sent to the CGI script.


    +   - type=RESET is a reset button. This button sets all the form fields back
    to their default value, or blank.


    +   - type=BUTTON is a generic button. This button performs no action on its own,
    but you can assign it using a JavaScript event handler.


    All three types of buttons include a NAME attribute to identify the button and
    a VALUE that indicates the text to display on the button''s face. A few buttons
    were used in the examples in Hour 13, "Using Windows and Frames." As another example,
    the following defines a Submit button with the name sub1 and the value "Click
    Here":


    ```

    <input TYPE="SUBMIT" NAME="sub1" VALUE="Click Here">

    ```


    If the user presses a Submit or Reset button, you can detect it with the onSubmit
    or onReset event handlers, described earlier in this hour. For generic buttons,
    you can use an onClick event handler.'
  merge: -1
  pgno: 205
