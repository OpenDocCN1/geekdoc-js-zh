  md: '# Statistical and Logarithmic Functions


    +   * Math.exp returns e (the base of natural logarithms) raised to a power.

    * Math.log returns the natural logarithm of a number.

    * Math.max accepts two numbers, and returns whichever is greater.

    * Math.min accepts two numbers, and returns the smaller of the two.


    # Basic Math and Rounding


    +   * Math.abs calculates the absolute value of a number.

    * Math.ceil rounds a number up to the nearest integer.

    * Math.floor rounds a number down to the nearest integer.

    * Math.pow calculates one number to the power of another.

    * Math.round rounds a number to the nearest integer.

    * Math.sqrt calculates the square root of a number.


    # Random Numbers


    +   * Math.random returns a random number between 0 and 1.


    # Date


    The Date object is a built-in JavaScript object that allows you to conveniently
    work with dates and times. You can create a date object any time you need to store
    a date, and use the date object''s methods to work with the date:


    +   * setDate the day of the month.

    * setMonth the month. JavaScript numbers from 0 to 11, starting with January (0).

    * setFullYear the year. setFullYear is a 4-digit, Y2K-compliant version.

    * setTime the time (and the date) by specifying the number of milliseconds since
    January 1st, 1970.

    * setHours, setMinutes, and setSeconds set the time.

    * getDate gets the day of the month.

    * getMonth gets the month.

    * getYear gets the year.

    * getTime gets the time (and the date) as the number of milliseconds since January
    1st, 1970.

    * getHours, getMinutes, and getSeconds get the time.'
