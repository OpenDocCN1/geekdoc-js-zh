  md: '# Escaping from a Loop


    There is one way out of an infinite loop. You can use the break statement during
    a loop to exit it immediately and continue with the first statement after the
    loop. Listing 8.5 shows one example of use of break:


    LISTING 8.5 Escaping from an Infinite Loop with break


    ```

    1: while (true) {

    2: n++;

    3: if (values[n] == 1) break;

    4: }

    ```


    Although the while statement is set up as an infinite loop, the if statement checks
    the corresponding value of an array. If it finds a 1, it exits the loop.


    When the JavaScript interpreter encounters a break statement, it skips the rest
    of the loop and continues the script with the first statement after the right
    brace at the loop''s end. You can use the break statement in any type of loop,
    whether infinite or not. This provides an easy way to exit if an error occurs,
    or if you''ve found what you were looking for.


    # Continuing a Loop


    One statement is available to help you control the execution of statements in
    a loop. The continue statement skips the rest of the loop, unlike break, it continues
    with the next iteration of the loop. Listing 8.6 shows a simple example.


    LISTING 8.6 Using continue to Skip Part of a Loop


    ```

    1: for (i=1; i<21; i++) {

    2: if (score[i]==0) continue;

    3: document.write("Student number "+i," Score: "+score[i],"\n");

    4: }

    ```


    This script uses a loop to print scores for 20 students, stored in the score array.
    The if statement is used to check for scores with a value of 0. The script assumes
    that a score of 0 means that the student didn''t take the test, so it continues
    the loop without printing that score.'
