    ![](img/253d3bf9d2a81ee62f8085998b463a44_311_0.png)


    As you can see from the alert message, it''s no wonder you didn''t win: The random
    number picked includes more than 10 decimal places, and you''ve been guessing
    integers. You could guess decimal numbers, but you''d need a whole lot more than
    10 guesses, and the game would start to lose its simplicity and charm.


    To fix this problem, look at the statement that generates the random number:


    ```

    5: var num = Math.random() * 100 + 1;

