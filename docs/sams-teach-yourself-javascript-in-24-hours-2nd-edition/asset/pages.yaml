    # Displaying Dialog Boxes


    The window object includes three methods that are useful for displaying messages
    and interacting with the user. You''ve already used these in some of your scripts.
    Here''s a summary:


    +   - The alert method displays an alert dialog box, shown in Figure 13.3. This
    dialog box simply gives the user a message.

    - The confirm method displays a confirmation dialog box. This displays a message
    and includes OK and Cancel buttons. This method returns true if OK is pressed
    and false if Cancel is pressed. A confirmation is displayed in Figure 13.4.

    - The prompt method displays a message and prompts the user for input. It returns
    the text entered by the user.


    # Creating a Script to Display Dialog Boxes


    As a further illustration of these types of dialog boxes, Listing 13.3 shows an
    HTML document that uses buttons and event handlers to enable you to test dialog
    boxes.'
