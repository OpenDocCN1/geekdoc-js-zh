  md: '# Responding to Events


    Thankfully, JavaScript 1.2 and later can detect keyboard actions. The main event
    handler for this purpose is onKeyPress, which occurs when a key is pressed and
    released, or held down. As mouse buttons, you can detect the down and up parts
    of the keypress with the onKeyDown and onKeyUp handlers.


    Of course, you might find it useful to know which key the user pressed. You can
    find this out with the event object, which is sent to your event handler when
    the event occurs. The event.which property stores the ASCII character code for
    the key that was pressed.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_176_0.png)


    ASCII (American Standard Code for Information Interchange) is the standard


    If you''d rather deal with actual characters, you can use the fromCharCode method
    to convert it. This method converts a numeric ASCII code to its corresponding
    string character. For example, the following <body> tag includes an event handler
    that displays the character for the key that was pressed in an alert message:


    ```

    <body onKeyPress="window.alert(''You pressed:'' + String.fromCharCode(event.which));">

    ```


    This statement uses the String.fromCharCode method to convert the event.which
    property to a string, and displays the string as part of an alert dialog.


    # Using the onload Event


    Another event you''ll frequently use is onload. This event occurs when the current
    page (including all of its images) finishes loading from the server.


    The onload is related to the document object, and to define it use an event handler
    in the <BODY> tag. For example, the following is a <BODY> tag that uses a simple
    event handler to display an alert when the page finishes loading:


    ```

    <body onload="alert(''Loading complete.'');">

    ```


    ![](img/253d3bf9d2a81ee62f8085998b463a44_176_1.png)


    Since the onload event occurs after the HTML document has finished loading and
    displaying, you cannot use the document.write or document.open state-within an
    onload event handler. This would overwrite the current document.'
