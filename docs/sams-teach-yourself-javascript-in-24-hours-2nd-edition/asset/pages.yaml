    # What Time Is It?


    One common and easy use for JavaScript is display dates and times. Since JavaScript
    runs on the browser, the timers it displays will be in the user''s current time
    zone. However, you can also use JavaScript to calculate "universal" (UTC) time.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_40_1.png)


    > UTC stands for the French equivalent of Universal Coordinated Time, and is the
    new name for the old GMT (Greenwich Mean Time) standard. This is the time at the
    International Date Line, near London, England.


    As a basic introduction to JavaScript, you will now create a simple script that
    displays the current time and the UTC within a Web page.


    # Beginning the Script


    Your script, like most JavaScript programs, begins with the HTML <script> tag.
    As you learned in Hour 1, you use the <script> and </script> tags to enclose a
    script within the HTML document.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_40_2.png)


    > Remember to not include anything but valid JavaScript statements between <script>
    tags. If the browser finds anything but valid JavaScript statements within the
    <script> tags, it will display a JavaScript error message.'
