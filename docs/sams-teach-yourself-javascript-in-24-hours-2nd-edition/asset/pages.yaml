    \ computers are supposed to be good at: performing repetitive tasks. You will\
    \ use loops in many of your scripts, in more useful ways than this example.\n\n\
    ![](img/253d3bf9d2a81ee62f8085998b463a44_70_0.png)\n\n> Loops are covered in detail\
    \ in Hour 8, \"Repeating Yourself: Using Loops.\"\n\n# Which Script Runs First?\n\
    \nAs learned in Hour 1, you can actually have several scripts within a Web document:\
    \ one or more <script> tags, and any number of event handlers. With all of these\
    \ scripts, you might wonder how the browser knows which to execute first. Fortunately,\
    \ this is done in a logical fashion:\n\n+   - Sets of <script> tags within the\
    \ <head> section of an HTML document are handled. Since these scripts cannot create\
    \ output in the Web page, it's a good place to define functions for use later.\n\
    - Sets of <script> tags within the <body> section of the HTML document are executed\
    \ after the <head> section, while the Web page loads and displays. If there is\
    \ more than one script in the body, they are executed in order.\n- Event handlers\
    \ are executed when their events happen. For example, the onload event handler\
    \ is executed when the body of a Web page loads. Since the <head> section is loaded\
    \ before any events, you can define functions there and use them in your event\
    \ handlers.\n\n# Workshop: Using Comments\n\nIn Hour 2, you used HTML comments\
    \ to hide your script from older browsers. JavaScript also includes its own type\
