  md: '# Controlling Styles with JavaScript


    The new W3C DOM (Document Object Model) makes it easy for JavaScript applications
    to control the styles of a page. Whether you use style sheets or not, you can
    use JavaScript to modify the style of any element on a page.


    As you learned in Hour 10, "Working with the Document Object Model," the DOM allows
    you to access the HTML document and all its elements scriptable objects. You can
    change any object''s style by modifying its style value.


    The names and values of objects under the style attribute are the same as you''ve
    learned in this Hour. For example, you can change an element''s color by modifying
    its style.color attribute:


    ```

    element.style.color="blue";

    ```


    Here, element represents the object for an element. There are many ways of finding
    an element''s corresponding object, which you will learn about in detail in Hour
    18.


    In the meantime, an easy way to find an element''s object is to assign an identifier
    to it with the ID attribute. The following statement creates an <h1> element with
    the identifier "head1":


    ```

    <h1 id="head1">This is a heading</h1>

    ```


    Now that you''ve assigned an identifier, you can use the GetElementById method
    to find the DOM object for the element:


    ```

    element = document.getElementById("head1");

    ```


    You can also use a shortcut to set styles and avoid the use of a variable by directly
    working with the getElementById method:


    ```

    document.getElementById("head1").style.color="blue";

    ```


    This statement combines the examples above by directly assigning the blue color
    style to the head element of the page. You''ll use this technique to create a
    dynamic page in the Workshop section.


    # Workshop: Creating Dynamic Styles


    Using the DOM style objects, you can create a page that allows you to directly
    control the colors used in the page''s text. To begin with, you will need a form
    with which to select colors. Listing 17.3 shows a basic form using <select> tags
    to define options for head and body colors.


