  md: '# Using Functions


    The scripts you''ve seen so far are simple lists of instructions. The browser
    begins with the first statement after the <script> tag and follows each instruction
    in order until it reaches the closing <script> tag (or encounters an error).


    While this is a straightforward approach for short scripts, it can also be confusing
    to read a huge script written in this fashion. To make it easier for you to organize
    your scripts, JavaScript supports functions, which you learned about in Hour 4,
    "How JavaScript Works." In this section you will learn how to define and use functions.


    # Defining a Function


    Functions are groups of JavaScript statements that can be treated as a single
    unit. To use a function, you must first define it. Listing 5.1 shows a simple
    example of a function definition.


    +   Listing 5.1 A Simple Function Definition


    ```

    1: function Greet() {

    2:   alert("Greetings.");

    3: }

    ```


    This listing defines a function that displays an alert message to the user. This
    begins with the function keyword. The function''s name is Greet. Notice the parentheses
    after the function''s name. As you''ll learn next, the space between them is not
    always empty.


    The first and last lines of the function definition include braces { and } . You
    use these to enclose all of the statements in the function. The browser uses the
    braces to determine where the function begins and ends.


    Between the braces, this particular function contains a single line. This uses
    the built-in alert function, which displays an alert message. The message will
    contain the text "Greetings."


    Now, about those parentheses. The current Greet function always does the same
    thing: each time you use it, it displays the same message. While this avoids a
    bit of typing, it doesn''t really provide much of an advantage.


    To make your function more flexible, you can add parameters, also known as arguments.
    These are variables that are received by the function each time it is called.
    For example, you can add a parameter who that tells the function the name of the
    person to greet. Listing 5.2 shows the modified function.'
  merge: -1
