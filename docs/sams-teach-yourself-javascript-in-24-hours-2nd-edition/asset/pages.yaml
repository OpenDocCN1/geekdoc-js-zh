  md: '# Preloading Images


    Although you can''t add an image to the page dynamically, you can create an independent
    image object. This enables you to specify an image that will be loaded and placed
    in the cache, but will not be displayed on the page.


    This sounds useless, but it''s a great way to work with modem-speed connections.
    Once you''ve preloaded an image, you can replace any of the images on the page
    with that image—and it''s already cached, the change happens instantly.


    You can cache an image by creating a new image object, using the new keyword.
    Here''s an example:


    ```

    Image2 = new Image();

    Image2.src = "arrow1.gif";

    ```


    ![](img/253d3bf9d2a81ee62f8085998b463a44_221_0.png)


    > You learned about the new keyword and its other uses for object-oriented programming
    in Hour 11, "Creating Custom Objects."


    # Creating Rolllovers


    The most common use of JavaScript''s dynamic image feature is to create rollovers,
    which are images that change when you move the mouse over them.


    Rollovers are usually used for images that are links. Using this feature, you
    can highlight the current link with a different color or a border, or by changing
    the image entirely.


    You can turn an image into a rollover by adding an mouseOver handler that replaces
    the image with a highlighted version and an mouseOut handler that returns the
    original image. Listing 15.2 shows an example that uses four images as rollovers.


    # LISTING 15.2 Example of Rollovers


    ```

    <html>

    <head>

    <title>Roll Over, Spot. Good Dog.</title>

    </head>

    <body>

    <h1>Example of Rollovers</h1>

    <a href="document.images[0].src=''home1.gif'';"

    mouseover="document.images[0].src=''home2.gif'';"

    mouseout="document.images[0].src=''home3.gif'';"

    <img src="home4.gif" width=192 height=47 border="0">

    </body>

    </html>

    ```'
