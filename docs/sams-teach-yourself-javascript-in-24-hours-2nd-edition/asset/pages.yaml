  md: 'If your onClick event handler returns the false value, the link will not be
    followed. For example, the link that displays a confirmation dialog. If you click
    Cancel, the link is not followed; if you click OK, the new page is loaded:


    ```

    <a href="http://www.javascript.com/"\nonclick="return(window.confirm(''Are you
    sure?''));">\nClick Here</a>",

    ```


    This example uses the return statement to enclose the event handler. This ensures
    that the false value that is returned when the user clicks Cancel is returned
    from the event handler, which prevents the link from being followed.


    The ondblclick event handler is similar, but is only used if the user double-clicks
    on an object. Because links usually require only a single-click, you could use
    this to make a link do two things depending on the number of clicks. (Needless
    to say, this could be confusing.) You can also detect double-clicks on images
    and other objects.


    To give you more control of what happens when the mouse button is pressed, two
    more events are included:


    +   - onMouseDown is used when the user presses the mouse button.

    - onMouseUp is used when the user releases the mouse button.


    These two are the two halves of a mouse click. If you want to detect an entire
    click, use onClick. Use onMouseUp and onMouseDown to detect just one or the other.


    To detect which mouse button is pressed, you can use the property of the event
    object. This property is assigned the value 1 for the left button, or 3 for the
    right button. This property is assigned for onclick, ondblclick, onMouseUp, and
    onMouseDown events.


    For example, this script creates an onMouseDown event handler that displays an
    alert indicating which button was pressed.


    ```

    Function mousealert(e) {

    wichone = (e.which == 1) ? "Left" : "Right";

    message = "You clicked the " + wichone + " button.";

    alert(message);

    }

    document.onmousedown = mousealert;

    ```


    # Using Keyboard Events


    Prior to the release of Netscape 4.0, JavaScript programs couldn''t detect keyboard
    actions—just mouse actions. This made it difficult to create some types of programs
    in JavaScript. For example, games were difficult to play using Go Left and Right
    buttons.'
