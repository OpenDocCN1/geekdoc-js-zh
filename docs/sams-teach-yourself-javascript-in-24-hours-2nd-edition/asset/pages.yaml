  md: '# HOUR 21


    # Finding and Handling Errors


    Welcome to Part VI. In the final three hours of this book, you''ll use the JavaScript
    features and techniques you''ve learned to create some applications. Before you
    move on to this, it''s important to know how to deal with problems in your scripts.


    In this hour, you''ll learn a few pointers on keeping your scripts bug-free, and
    you''ll look at the tools and techniques you can use to find and eliminate bugs
    when they occur. Hour 21 covers the following topics:


    +   * Using good programming practices to avoid bugs

    * Tips for debugging with the JavaScript console

    * Using alert messages and status messages to debug scripts

    * Using Netscape''s JavaScript Debugger

    * Debugging an actual script


    ![](img/253d3bf9d2a81ee62f8085998b463a44_300_0.png)'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# Avoiding Bugs


    A bug is an error in a program that prevents it from doing what it should do.
    If you''ve tried writing any scripts on your own, you''ve probably run into one
    or more bugs. If not, you will—no matter how careful you are.


    Although you''ll undoubtedly run into a few bugs if you write a complex script,
    you can avoid many others by carefully writing and double-checking your script.


    # Using Good Programming Practices


    There''s not a single programmer out there whose programs always work the first
    time, without any bugs. However, good programmers share a few habits that help
    them avoid some of the more common bugs. Here are a few habits you can develop
    to improve your scripts:


    +   - Format your scripts neatly and keep them readable. Use consistent spacing
    and variable names that mean something. It''s hard to determine what''s wrong
    with a script when you can''t remember what a particular line does.

    - Similarly, use JavaScript comments liberally to document your script. This will
    help you if you need to work on the script after you''ve forgotten the details
    of how it works—or if someone inherits the job.

    - End all JavaScript statements with semicolons. Although this is optional, it
    will make the script more readable. Additionally, it may help the browser to produce
    meaningful error messages.

    - Declare all variables with the var keyword. This is optional in most cases,
    but it will help you really mean to create a new variable and avoid problems with
    variable scope.

    - Divide complicated scripts into functions. This will make the script easier
    to read, and it will also make it easy to pinpoint the cause of a problem.

    - Write a large script in several phases and test the script at each phase before
    adding more features. This way, you can avoid having problems happen at once.


    # Avoiding Common Mistakes


    Along with following scripting practices, you should also watch for common mistakes
    in your scripts. Different people make different mistakes in JavaScript programming,
    but the following sections explore some of the most common ones.'
  merge: -1
  pgno: 301
- img_proc: true
  md: '# Finding and Handling Errors


    # Syntax Errors


    A syntax error is an incorrect keyword, operator, punctuation mark, or other item
    in a script. Most often, it''s caused by a typing error.


    Syntax errors are usually obvious—both to you when you look at the script and
    to the browser''s JavaScript interpreter when you load the script. These errors
    usually result in an error message and can be easily corrected.


    # Assignment and Equality


    One of the most common syntax errors made by beginning programmers is confusing
    the assignment operator (=) with the equality operator (==). This can be a hard
    error to spot because it may not result in an error message.


    If you''re confused about which operator to use, follow this simple rule: = to
    change the value of a variable and == to compare two values. Here''s an example
    of a statement that confuses the two:


    ```

    `If (a = 5) alert(''found a five.'');`

    ```


    The statement looks logical enough, but a = 5 will actually assign the value 5
    to the variable rather than comparing the two. Netscape usually detects this type
    of error and displays an error message in the JavaScript console, the opposite
    type of error (using == when you mean =) may not be detected.


    # Local and Global Variables


    Another common mistake is confusing local and global variables, such as trying
    to use the value of a variable that was declared in a function outside the function.
    If you actually need to do this, you should either use a global variable or return
    a value from the function.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_302_0.png)


    > Hour 5, "Using Variables and Functions," describes the differences between local
    and global variables in detail.


    # Using Objects Correctly


    Another common error is referring to JavaScript objects incorrectly. It''s important
    to use the correct object names and to remember to explicitly name the parent
    of an object.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_302_1.png)'
  merge: -1
  pgno: 302
- img_proc: true
  md: 'For example, you can usually refer to the window.alert method as simply alert.

    However, there are some cases when you must use window.alert, as in some event
    handlers. If you find that alert or another method or property is not recognized
    by the browser, try specifying the window object.


    Another common mistake is to assume that you can omit the document object''s name,
    such as using write instead of document.write. This won''t work because most scripts
    have a window object as their scope.


    # HTML Errors


    Last but not, don''t forget that JavaScript isn''t the only language that can
    have errors. It''s easy to accidentally create an error in an HTML document—for
    example, forgetting to include a closing </table> tag, or even a closing </script>
    tag.


    While writing proper HTML is beyond the scope of your book, you should be aware
    that sometimes improper HTML can cause errors in your JavaScript. When you experience
    bugs, be sure to double-check the HTML, especially the objects (such as forms
    or images) that your script manipulates.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_303_0.png)


    A variety of programs are available for checking the HTML syntax of your documents.
    This can help you avoid errors, as well as conform to the HTML specifications.
    See Appendix B, “Tools for JavaScript Developers,” for a list of these programs.


    # Basic Debugging Tools


    If checking your script for common mistakes and obvious problems doesn''t fix
    things, it''s time to start debugging. This is the process of finding errors in
    a program and eliminating them. Some basic tools for debugging scripts are described
    in the following sections.


    # Netscape''s JavaScript Console


    The first thing you should do if your script doesn''t work is check for error
    messages. In Netscape 4.5 and later, the messages are not displayed by default,
    but are logged to the JavaScript console.


    To access the console, type “javascript:” in Netscape''s Location field. The console
    displays the last few error messages that have occurred, as shown in Figure 21.1.'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# Finding and Handling Errors


    FIGURE 21.1


    The JavaScript console displays recent error messages.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_304_0.png)


    Along reading the error messages, you can use the console to type a JavaScript
    command or expression and see its results. This is useful if you need to make
    sure of your script uses the correct syntax.


    # Making the Console Display Automatically


    After you''ve spent a while dealing with JavaScript errors, you''ll find yourself
    frequently typing "javascript; to access the console. Fortunately, Netscape (version
    4.5 or later) includes an option to display the console each time an error occurs.


    This setting is not available in the Preferences dialog. To change the setting,
    you''ll need to edit your Netscape preferences file. This file is stored in your
    user preferences directory (usually named with initials) under the Netscape installation
    directory. The filename is prefs.js.


    To make the change, open the prefs.js file in a text editor. This file consists
    of a number of JavaScript commands to set your user preferences. To make the console
    display automatically, add this line to the end of the file:


    ```

    user_pref(''javascript.console.on_error'', true);

    ```


    After you''ve made the change, save the file and start Netscape. Now, when the
    JavaScript interpreter encounters an error, the console will pop up automatically
    and display the error.'
  merge: -1
  pgno: 304
- img_proc: true
  md: '> Netscape rewrites the contents of the prefs.js file each time it runs, so
    you cannot edit the file while Netscape is running. Exit all browser windows before
    editing the file.


    # Displaying Error Messages in Internet Explorer


    Internet Explorer 4.0 and later do not display JavaScript error messages by default.
    While this can make browsing poorly-written pages a more pleasant experience,
    it can be frustrating to JavaScript programmers.


    To enable the display of error messages in Internet Explorer, select Internet
    Options from the Tools menu. Select the Advanced tab. In the list under browsing,
    deselect the "Disable script debugging" option and enable the "Display a notification
    about every script error" option.


    > Netscape''s JavaScript console is a better debugging tool than Internet Explorer''s
    error messages, so you may want to test your scripts even if IE is your default
    browser. More importantly, you should test all scripts in both browsers to ensure
    compatibility.


    # Alert Messages and the Status Line


    If you''re lucky, the error messages in the console will tell you how to fix your
    script. However, your script may not generate any error messages at all—but still
    fail to work correctly. In this, the real debugging process begins.


    One useful debugging technique is to add temporary statements to your script to
    let you know what''s going on. For example, you can use an alert message to display
    the value of a variable. Once you understand what''s happening to the variable,
    you can figure out what''s wrong with the script.


    > You can also display debugging information on the status line or in a separate
    browser window. You can use document.write in some cases, but this only works
    when the document hasn''t finished loading yet.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# Netscape''s JavaScript Debugger


    Although you can use alert messages and a little common sense to quickly find
    a bug in a simple script, larger scripts can be difficult to debug. Netscape''s
    JavaScript Debugger is a powerful tool you can use to debug scripts.


    # Installing the Debugger


    The Debugger is a Java-based program that runs within the Netscape browser. You
    can download the current version of the Debugger from Netscape''s Web site:


    ```

    http://developer.netscape.com/software/jsdebug.html

    ```


    > The Debugger installs using Netscape''s SmartUpdate feature. Because of this,
    you must use Navigator 4.0 or later to perform the download and installation.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_306_0.png)


    To install the Debugger, follow the instructions on the site to reach the download
    link. The software will be downloaded and installed automatically.


    # The Debugger Window


    Once you''ve installed the Debugger, you can begin to use it. To load the Debugger,
    enter the location of the local Debugger page, jsdebugger.html. This page is stored
    under the Netscape directory on your computer.


    The first time you run the Debugger, you will be presented with a number of security
    warnings. The Debugger uses a number of features that are only allowed with authorization;
    you can safely grant it these privileges.


    After the security warnings, the Debugger window is displayed. Once it is displayed,
    you can leave it open while you run scripts in the Navigator window you already
    have open.


    The Debugger keeps track of the scripts you load after it starts running. To open
    a script for debugging, first load your HTML document into the browser. Next,
    click the button on the Debugger toolbar. A list of recently opened documents
    is displayed; select the appropriate one. The script is then displayed in the
    Debugger window, as shown in Figure 21.2.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_306_1.png)'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# FIGURE 21.2

    The Debugger window displays the current script.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_307_0.png)


    Once the script is loaded into the Debugger, you can begin the debugging process.
    The following sections describe the basic features of the Debugger. For more details
    about its operation, see Netscape''s Web site at the URL mentioned earlier in
    this section.


    # Setting Breakpoints and Interrupts


    After the Debugger is loaded, it monitors the currently running script in the
    browser window. One useful feature is the capability to freeze the execution of
    the script at a certain point. The statement where you want to stop the script
    is called a *breakpoint*.


    To set a breakpoint, click to the left of the statement in the Debugger window.
    A red dot will appear to indicate a breakpoint. You can place as many breakpoints
    as you need.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Finding and Handling Errors


    When the script reaches the statement where you have placed a breakpoint, it pauses
    and the Debugger takes control. You can then check variables or other aspects
    of the script.


    If you want to stop executing as soon as possible, use the Interrupt button on
    the Debugger toolbar. This will stop the script as soon as it is able (usually
    when the current-statement finishes) and return return control to the Debugger.


    > The script will also stop executing and return control to the Debugger if it
    encounters a JavaScript error.


    # Watching Values


    Usually, the main reason to interrupt the execution of the script is to see what
    the current values of your variables are. You can easily keep track of one or
    more variables by adding them to the Debugger''s watch list.


    To add a variable to the list, select its name in the Debugger window and choose
    Copy to Watch from the Edit menu. The values of any variables you''ve set to watch
    will be displayed in the console in the lower-right corner of the Debugger window.


    # Stepping Through a Script


    Once the script has been interrupted and you''ve learned what you need to know,
    you will probably want to continue the execution of the script. The easiest way
    to do this is to use the Run button in the Debugger toolbar. This continues the
    script where it stopped and keeps it running until the next breakpoint or interrupt.


    You can also execute the script one step at a time. To do this, use the Step Into
    command from the Control menu. This will execute the current statement and then
    return control to the Debugger.


    > You can also step through an entire function in one step with the Debugger''s
    Step Over command. For information about other options, see Netscape''s Debugger
    documentation.


    # Workshop: Debugging a Script


    You should now have a good understanding of what can go wrong with JavaScript
    programs and the tools you have available to diagnose these problems. You can
    now try your hand at debugging a script.'
