  md: '# Check Boxes


    A check box is a form element that looks like a small box. Clicking on the check
    box switches between the checked and unchecked states, which is useful for indicating
    Yes or No choices in your forms. You can use the <input> tag to define a check
    box. Here is a simple example:


    ```

    <input TYPE="CHECKBOX" NAME="check1" VALUE="Yes" CHECKED>

    ```


    Again, this gives a name to the form element. The VALUE attribute assigns a meaning
    to the check box; this is a value that is returned if the check box is checked.
    The default value is "on." The CHECK attribute can be included to make the check
    box by default.


    A check box is: it has two states. Nevertheless, the check box object in JavaScript
    has four properties:


    +   - name is the name of the check box, and also the object name.

    - value is the "true" value for the check box—usually on. This value is used by
    the server to indicate that the check box was checked. In JavaScript, you should
    use the checked property instead.

    - defaultChecked is the default status of the check box, assigned by the CHECK
    attribute.

    - checked is the current value. This is a boolean: true for checked and false
    for unchecked.


    To manipulate the check box or use its value, you use the checked attribute. For
    example, this statement turns on a check box called same in the order form:


    ```

    document.order.same.checked = true;

    ```


    The check box has a single method, click(). This method simulates a click on the
    box. It also has a single event, onClick, which occurs whenever the check box
    is clicked. This happens whether the box was turned on or off, so you''ll need
    to examine the checked property to see what happened.


    # Radio Buttons


    Another element for decisions is the radio button, using the <input> tag''s RADIO
    type. Radio buttons are also known as option buttons. These are similar to check
    boxes, but they exist in groups and only one can be checked in each group. They
    are used for a multiple-choice or "one of many" input. Here is an example of a
    group of radio buttons:


    ```

    <input TYPE="RADIO" NAME="radio1" VALUE="Option1" CHECKED> Option 1

    <input TYPE="RADIO" NAME="radio1" VALUE="Option2> Option 2

    <input TYPE="RADIO" NAME="radio1" VALUE="Option3> Option 3

    ```


    ![](img/253d3bf9d2a81ee62f8085998b463a44_206_0.png)'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'These statements define a group of three radio buttons. The NAME attribute
    is the same for all three (which is what makes them a group). The VALUE attribute
    is the value passed to a script or CGI program to indicate which button is selected—be
    sure you assign a different-value to each button.


    > Radio buttons are named for their similarity to the buttons on old push-button
    radios. Those buttons used a mechanical arrangement so that you pushed one button
    in, the others popped out.


    For scripting, radio buttons are similar to check boxes, except that an entire
    group of them shares a single name and a single object. You can refer to the following
    properties of the radio object:


    +   - name is the name common to the radio buttons.

    - length is the number of radio buttons in the group.


    To access the individual buttons, you treat the radio object as an array. The
    buttons are indexed, starting with 0. Each individual button has the following
    properties:


    +   - value is the value assigned to the button. (This is used by the server).

    - defaultchecked indicates the value of the CHECKED attribute and the default
    state of the button.

    - checked is the current state.


    For example, you can check the first radio button in the radio1 group on the form
    with this statement:

    document.form1.radio1[0].checked = true;


    However, if you want to be sure you set the other values to false as needed. This
    is not done automatically. You can use the click method to do both of these in
    one step.

    Like a check box, radio buttons have a click() method and an onClick event handler.
    Each radio button can have a separate statement for this event.


    # # Drop-Down Lists


    A final form element is also useful for multiple-choice selections. The <select>
    HTML tag is used to define a selection list, or a drop-down list of text items.
    The following is an example of a selection list:


    ```

    <select NAME="select1" SIZE=40>

    <option VALUE="choice1" SELECTED>This is the first choice.

    <option VALUE="choice2">This is the second choice.

    ```'
