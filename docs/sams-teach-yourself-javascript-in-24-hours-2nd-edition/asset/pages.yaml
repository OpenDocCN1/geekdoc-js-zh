    \ property to display the correct page for the user's language.\n- navigator.platform\
    \ is the computer platform of the current browser. This is a short string, such\
    \ as \"Win96\", \"Win32\", or \"MacPC\". You can use this to enable any platform-specific\
    \ features (for example, ActiveX controls).\n\nYou will usually use these properties\
    \ in an if statement. For example the following statement sends the user to a\
    \ default URL if they are not using Netscape 4.x:\n\n```\nif (navigator.userAgent.indexOf(\"\
    Mozilla/4\") == -1)\n  window.location=\"non_netscape.html\";\n```\n\n![](img/253d3bf9d2a81ee62f8085998b463a44_231_0.png)\n\
    \nAs you might have guessed, the navigator object is named after Netscape Navigator,\
