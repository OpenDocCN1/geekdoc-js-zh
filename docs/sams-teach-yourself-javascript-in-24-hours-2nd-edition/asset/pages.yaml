    # Working with Plug-Ins


    Plug-ins are add-ons that allow different types of content to be used within a
    Web page. Plug-ins are available for everything ranging from audio to video to
    virtual reality, and much more. Here are some of the most common plug-ins:


    +   * RealAudio, for streaming audio support

    * QuickTime, for embedded video clips

    * Adobe Acrobat, for precisely formatted documents

    * ShockWave, for animations and interactive applications


    While you can use plug-content to add anything to your Web page, there is one
    major problem: aside from a few default plug-ins that are included with browsers,
    you can''t really count on the entire audience for your page to have the plug-installed.


    This makes plug-ins an issue similar to browser versions: You either have to choose
    one particular plug-in to support and expect the users to install it, or you must
    create alternative pages (typically one using plug-ins and without them).


    Once again, JavaScript can make the situation a bit more controllable. You can
    use JavaScript to detect whether the browser has a particular plug-in installed
    and modify the'
