    and arrays.


    # Q&A


    +   - Q Netscape displays the error message "missing semicolon before statement"
    when I try the function example.

    - A This is probably because you mistyped something. JavaScript is case-sensitive,
    be sure you use the capitalization right. This specific error message will appear
    if you use the keyword For instead of function.

    - Q What is the importance of the var keyword? Should I always use it to declare
    variables?

    - A You only need to use var to define a local variable in a function, and then
    only if you want to ensure that a global variable of the same name is not used.
    However, if you''re unsure at all, it''s always safe to use var. Using it consistently
    will help you keep your scripts organized and error-free.

    - Q Is there any reason I would want to use the var keyword to create a local
    variable with the same name as a global one?

    - A Not on purpose. The main reason to use var is to avoid conflicts with global
    variables you not know about. For example, you may add a global variable in the
    future, or you may add another script to the page that uses a similar variable
    name. This is more of an issue with large, complex scripts.

    - Q What are good boolean variables?

    - A Often in scripts you''ll need a variable to indicate something has happened—for
    example, whether a phone number the user entered is in the right format. Boolean
    variables are ideal for this; they''re also useful in working with conditions,
    as you''ll see in Hour 7.


