  md: '# HOUR 16

    Creating Cross-Browser Scripts


    Welcome to the fourth hour of Part IV. Up until now, most of the scripts you''ve
    written will work in the latest versions of either of today’s most popular browsers:
    Netscape Navigator and Internet Explorer. Between these two, your scripts will
    work for a vast majority of the Web audience.


    As you move to Part V, however, you''ll start working with topics that aren''t
    so compatible. The latest features, such as layers and dynamic HTML, tend to work
    differently on different browsers, and some features are specific to one or another.


    The new DOM (Document Object Model) standard has eliminated many of the most troubling
    browsers differences. Until this is widely implemented, you can use JavaScript
    to differentiate between browsers, supporting all of them either within one page
    or on separate pages.


    Hour 16 covers the following topics:


    +   * Using JavaScript to get browser information

    * Displaying browser details with JavaScript


    ![](img/253d3bf9d2a81ee62f8085998b463a44_230_0.png)'
