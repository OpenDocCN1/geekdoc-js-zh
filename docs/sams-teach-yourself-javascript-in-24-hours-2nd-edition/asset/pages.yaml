  md: 'The following are examples of the substring() method using this string:


    +   - alpha.substring(0,4) returns ABCD.

    - alpha.substring(10,12) returns KL.

    - alpha.substring(12,10) also returns KL. Because it''s smaller, 10 is used as
    the first index.

    - alpha.substring(6,7) returns GH.

    - alpha.substring(24,25) returns YZ.

    - alpha.substring(0,25) returns the entire alphabet.

    - alpha.substring(6,6) returns the null value, an empty string. This is true whenever
    the two index values are the same.


    # Getting a Single Character


    The charAt method is a simple way to grab a single character from a string. You
    specify the character''s index, or position, in parentheses. The indices begin
    at 0 for the first character. Here are a few examples using the alpha string:


    +   - alpha.charAt(0) returns A.

    - alpha.charAt(12) returns M.

    - alpha.charAt(25) returns Z.

    - alpha.charAt(27) returns an empty string because there is no character at that
    position.


    # Finding a Substring


    Another way for substrings is to find a string within another string. One way
    to do this is with the indexOf method. To use this method, add indexOf to the
    string you want to search, and specify the string to search for in the parentheses.
    This example searches for text in the test string:


    where = test.indexOf("text");


    ![](img/253d3bf9d2a81ee62f8085998b463a44_99_0.png)


    | As with most JavaScript methods and property names, indexOf is case sensitive.
    Make sure you type it exactly as shown here when you use it in scripts. |


    The value returned in the where variable is an index into the string, similar
    to the first index in the substring method. The first character of the string
    is index 0.'
