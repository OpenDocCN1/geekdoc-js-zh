  md: '# Style and Substance


    If you''ve ever tried to make a good-looking Web page, you''ve probably encountered
    some problems. First of all, HTML doesn''t give you very much control over a page''s
    appearance. For example, you can''t change the amount of space between words—in
    fact, you can''t even use two spaces between words because they''ll be converted
    to a single space.


    Second, when you do your best to make a perfect-looking document using HTML, you
    will find that it doesn''t necessarily display the same way on all browsers—or
    on different computers running the same browser.


    The reason for these problems is simple: HTML was never meant to handle such things
    as layout, justification, and spacing. HTML deals with a document''s structure—in
    other words, how the document is divided into paragraphs, lists, and other elements.


    This isn''t a bad thing. It''s one of the most powerful features of HTML. You
    define the structure of the document, so it can be displayed in sorts of different
    ways without changing its meaning. For example, a well-written HTML document can
    be displayed in Netscape or Internet Explorer, which generally treat elements
    the same way—there is a space between paragraphs, headings are in big, bold, and
    so on.


    Because HTML only defines the structure, the same document can be displayed in
    a text-based browser, such as Lynx. In this case, the different elements will
    be displayed differently, but you can still tell which text is a heading, which
    is a list, and so on.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_247_0.png)


    > Text-based browsers aren''t the only alternate of displaying HTML. Browsers
    designed for the blind can read a Web page using a speech synthesizer, with different
    voices or sounds that indicate the different elements.


    As you should now understand, HTML is very good at its job—defining a document''s
    structure. Not surprisingly, using this language to control the document''s presentation
    will only draw you


    Fortunately, the World Wide Web Consortium (W3C) realized that Web authors need
    to control the layout and presentation of documents. This resulted in the Cascading
    Style Sheets (CSS) standard.


    CSS adds a number of features to standard HTML to control style and appearance.
    More importantly, it does this without affecting HTML''s ability to describe document
    structures. While style sheets still won''t make your document look 100% identical
    on all browsers and platforms, it is certainly a step in the right direction.'
  merge: -1
  pgno: 247
- img_proc: true
  md: "# Working with Style Sheets\n\nLet's look at a real-world example. If you're\
    \ browsing the Web with a CSS-supported browser and come across a page that uses\
    \ CSS, you'll see the document exactly as it was intended. You can also turn off\
    \ your browser's support for style sheets if you'd rather view all the pages in\
    \ the same consistent way.\n\n# Defining and Using CSS Styles\n\nUse styles on\
    \ a page, you first need to define the styles, using the <style> tag, and then\
    \ indicate the styles that should be used with various HTML elements.\n\nThe main\
    \ HTML tag you'll use to define style sheets is the <style> tag which starts a\
    \ listing of styles. The initial <style> tag specifies the type of style sheet,\
    \ and the </style> tag ends the style definitions. For example, the following\
    \ tag starts a style definition using CSS:\n\n```\n<style TYPE=\"text/css\">\n\
    ```\n\nRather than using a style defined in the document header, you can specify\
    \ a style for an individual element only. For example, the following HTML tag\
    \ represents a Level 1 header colored blue:\n\n```\n<H1 STYLE=\"color: blue\"\
    >This is a blue header.</H1>\n```\n\nYou should place the <style> tags in the\
    \ <head> section of the HTML document. In the following sections, you'll learn\
    \ how to create style rules, and about the various parameters you can set using\
    \ CSS.\n\n# Creating Rules\n\nEach line within the <style> tags is called a rule.\
    \ To create a rule, you specify the HTML elements that it will affect, as well\
    \ as a list of properties and values that control the appearance of those elements.\
    \ We'll look at the properties later in this section.\n\nAs a simple example,\
    \ the following style sheet contains a single rule: All Level 1 headers are:\n\
