  md: '# How JavaScript Programs Work


    > The document.write function we discussed earlier this hour is actually a method
    of the document object. You will learn more about this object in Hour 10, "Working
    with the Document Object Model."


    Don''t worry if this sounds confusing—you''ll be exploring objects in much more
    detail later in this book. For now, you just need to know the basics. JavaScript
    supports three kinds of objects:


    +   - Built-in objects are built into the JavaScript language. You''ve already
    encountered one of these, Date, in Hour 2. Other built-in objects include Array
    and String, which you''ll explore in Hour 6, "Strings and Arrays," and Math, which
    is explained in Hour 9, "Using Built-in Objects."


    +   - Browser objects are objects that represent various components of the browser
    and the current HTML document. For example, the alert() function you used earlier
    in this chapter is actually a method of the window object. You will explore these
    in more detail in Hour 10.


    +   - Custom objects are objects you create yourself. For example, you could create
    a person object, as in the examples in this section. You''ll learn to use custom
    objects in Hour 11, "Creating Custom Objects."


    # Handling Events


    As mentioned in Hour 1, "Understanding JavaScript," not all scripts are located
    within <script> tags. You can also use scripts as event handlers. While this might
    sound like a complex programming term, it actually means exactly what it says:
    Event handlers are scripts that handle events.


    In real life, an event is something that happens to you. For example, the things
    you write on your calendar events: "Dentist appointment" or "Fred''s Birthday."
    You also encounter unscheduled events in your life: for example, a traffic light,
    an IRS audit, or an uninvited visit from relatives.


    Whether events are scheduled or unscheduled, you probably have normal ways of
    handling them. Your event handlers might include things like When Fred''s birthday
    arrives, send him a present or when relatives visit unexpectedly, turn out the
    lights and pretend nobody''s home.


    Event handlers in JavaScript are similar: They tell the browser what to do when
    a certain event occurs. The events JavaScript deals with aren''t as exciting as
    the ones you deal'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# 48 Hour 4


    with—they include such events as When the mouse button clicks and When this page
    is finished loading. Nevertheless, they’re very useful part of JavaScript.


    Many JavaScript events (such as mouse clicks) are caused by the user. Rather than
    doing things in a set order, your script can respond to the user''s actions. Needless
    to say, this is essential for just about every practical use of JavaScript.


    Event handlers are associated with particular browser objects, and you specify
    the event handler in the tag that defines the object. For example, images and
    text links have an, onMouseEnter, that happens when the mouse pointer moves over
    the object. Here is a typical HTML image tag with an event handler:


    ```

    <img SRC="button.gif" onMouseOver="highlight();"

    ```


    You specify the event handler as an attribute to the HTML tag and include the
    JavaScript statement to handle the event within the quotation marks. This is an
    ideal use for functions, since function names are short and to the point and can
    refer to a whole series of statements.


    > You''ll learn more about event handlers in Hour 12, "Responding to Events"


    # Conditional Statements


    While event handlers notify your script when something happens, you may want to
    check certain conditions yourself. For example, did the user enter a valid email
    address?


    JavaScript supports conditional statements, which allow you to answer questions
    like this. A typical conditional uses the if statement, as in this example:


    ```

    if (a==1) alert("The countdown has reached 1.");

    ```


    This compares the variable a with the constant 1, and displays an alert message
    to the user if they are the same. You will use conditional statements in most
    of your scripts.


    > You''ll learn more about conditionals in Hour 7, "Testing and Comparing Values."'
  merge: -1
