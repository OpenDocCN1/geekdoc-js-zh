    # Working with Frames


    Some browsers (including the latest Netscape and Microsoft browsers) support frames
    or framesets, which enable you to divide the browser window into multiple panes.
    Each frame can contain a separate URL or the output of a script.


    # Using JavaScript Objects for Frames


    When a window contains multiple frames, each frame is represented in JavaScript
    by a frame object. This object is equivalent to a window object, but it is used
    for dealing with that frame. The frame object''s name is the same as the NAME
    attribute you give it in the <frame> tag.'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'Remember the window and self keywords, which refer to the current window? When
    you are using frames, these keywords refer to the current frame instead. Another
    key-word, parent, enables you to refer to the main window.


    Each frame object in a window is a child of the parent window object. Suppose
    you define a set of frames using the HTML in Listing 13.4.


    # ### Listing 13.4 A Framed Document That Divides the Page into Quarters.


    ```

    1 <frameset ROWS="*" SRC="*">

    2 <frame NAME="topleft" SRC="topleft.htm">

    3 <frame NAME="topright" SRC="topright.htm">

    4 <frame NAME="bottomleft" SRC="bottomleft.htm">

    5 <frame NAME="bottomright" SRC="bottomright.htm">

    6 </frameset>

    ```


    This simply divides the window into quarters. If you have a JavaScript program
    in the topleft.htm file it would refer to the other windows as parent.topright,
    parent.bottomleft, and so on. The keywords window and self would refer to the
    topleft frame.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_193_0.png)


    > If you use nested framesets, things are a bit more complicated. window still
    represents the current frame, parent represents the frameset containing the current
    frame, and top represents the main frameset that contains all the others.


    # ## The frames Array


    Rather than referring to frames in a document by name, you can use the frames
    array. This array stores information about each of the frames in the document.
    The frames are indexed starting with zero and beginning with the first <FRAME>
    tag in the frameset document.


    For example, you could refer to the frames defined in Listing 13.4 using array
    references:


    +   * parent.frames[0] is equivalent to the topleft frame.

    * parent.frames[1] is equivalent to the topright frame.

    * parent.frames[2] is equivalent to the bottomleft frame.

    * parent.frames[3] is equivalent to the bottomright frame.'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'You can refer to a frame using either method interchangeably, depending on
    your application, you should use the most convenient method. For example, a document
    with 10 frames would probably be easier to use by number, but a simple two-frame
    document is easier to use if the frames have meaningful names.


    # Workshop: Creating a Navigation Frame


    A common use for frames is to display a navigation frame along the side or top
    of a page. Using frame objects, you can create a navigation frame that controls
    the document in another frame.


    To begin, you''ll need a document to define the frameset. This is the simple part.
    Listing 13.5 defines a frameset with frames on the left and right.


    +   Listing 13.5 An HTML Document to Divide the Window into Two Frames


    ```

    <html>

    <head>

    <title>Frame Navigation Example</title>

    </head>

    <frameset COLS="left,*">

    <frame NAME="left" SRC="left.html">

    <frame NAME="right" SRC="about:blank">

    </frameset>

    </html>

    ```


    Next, you will need the document for the left-hand frame, which will act as the
    navigation frame. Listing 13.6 shows the HTML document for this frame.


    +   Listing 13.6 The HTML Document for the Navigation Frame


    ```

    <html>

    <head>

    <title>Navigation Frame</title>

    <body>

    <p>

    Follow one of these links

    to load a page into the right-hand

    frame:

    </p>

    <ul>

    <li><a href="#" onclick="parent.right.location=''order.html''; window.location=''ordernav.html'';"></a></li>

    </ul>

    ```


