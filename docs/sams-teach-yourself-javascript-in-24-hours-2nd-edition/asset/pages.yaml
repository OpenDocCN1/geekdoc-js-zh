  md: '# Working with Style Sheets


    +   * background-image—Specifies a GIF format image to be used as the background
    for the element.

    * background-repeat—Specifies whether the background image is repeated (tiled).
    The image can be repeated horizontally, vertically, or both (Internet Explorer
    4.0 and later).

    * background-attachment—Controls whether the background image scrolls when you
    scroll through the document. fixed means that the background image stays still
    while the document scrolls; scroll means the image scrolls with the document (like
    background images on normal Web documents). Currently, this feature is supported
    only by Internet Explorer 4.0 and later.

    * background-position—Allows you to offset the position of the background image
    (Internet Explorer 4.0 and later only).

    * background—This provides a quick way to set all the background elements in this
    list. You can specify all the attributes in a single background rule.


    # Working with Fonts


    Style sheets also allow you to control the fonts used on the Web document and
    how they are displayed. You can use the following properties to control fonts:


    +   * font-family—Specifies the name of a font, such as arial or helvetica, to
    use with the element. Because not all users have the same fonts installed, you
    can list several fonts. The CSS specification also supports several generic font
    families that are guaranteed to be: serif, sans-serif, cursive, fantasy, and monospace.

    * font-style—Specifies the style of a font, such as normal, italic, or oblique.

    * font-variant—This value is normal for normal text, and small-caps to display
    lowercase letters as small capitals.

    * font-weight—Allows you to specify normal or bold text. You can also specify
    a numeric font weight for a specific amount of boldness.

    * font-size—The point size of the font.

    * font—This is a quick way to set all the font properties in this list. You can
    list all the values in a single font rule.


    # Margins and Borders


    Last but not least, you can use style sheets to control the general layout of
    the page. The following properties affect margins, borders, and the width and
