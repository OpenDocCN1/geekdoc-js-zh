  md: '# Using Strings and Arrays


    You can specify an optional second parameter to indicate the index value to begin
    the search. For example, this statement searches for the word fish in the temp
    string, starting with the 20th character:

    where = temp.indexOf("fish",19);


    > One use for the second parameter is to search for multiple occurrences of a
    string. After finding the first occurrence, you search starting with that location
    for the second one, and so on.


    A second method, lastIndexOf(), works the same way, but finds the last occurrence
    of the string. It searches the strings backwards, starting with the last character.
    For example, this statement finds the occurrence of Fred in the names string:

    where = names.lastIndexOf("Fred");

    As with indexOf(), you can specify a location to search from as the second parameter.
    In this case, the string will be searched backwards starting at that location.


    # Using Numeric Arrays


    An array is a numbered group of data items that you can treat as a single unit.
    For example, you might use an array called scores to store several scores for
    a game. Arrays can contain strings, numbers, objects, or other types of data.


    # Creating a Numeric Array


    Unlike most other types of JavaScript variables, you must declare an array before
    you use it. The following example creates an array with 30 elements:

    To assign values to the array, use brackets and an index. Indices begin with 0,
    so the elements of the array in this example would be numbered 0 to 29. These
    statements assign values to the first four elements of the array:


    ```

    scores[0] = 39;

    scores[1] = 40;

    scores[2] = 100;

    scores[3] = 49;

    ```


