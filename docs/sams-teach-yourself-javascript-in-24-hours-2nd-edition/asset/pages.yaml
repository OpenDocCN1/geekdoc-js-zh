- img_proc: true
  md: 'JavaScript Quick Reference


    # for


    Defines a loop, usually to count from one number to another using an index variable.
    In this example, the variable i counts from 1 to 9:


    ```

    for (i=1;i<10;i++) { statements }

    ```


    # for...in


    This is a different type of loop, used to iterate through the properties of an
    object, or the elements of an array. This statement loops through the properties
    of the Scores object, using the variable x to hold each property in turn:


    ```

    for (x in Scores) { statements }

    ```


    # function


    Defines a JavaScript function that can be used anywhere within the current document.
    Functions can optionally return a value with the return statement. This example
    defines a function to add two numbers and return the result:


    ```

    function add(n1,n2) { result = n1 + n2; return result; }

    ```


    # if...else


    This is a conditional statement. If the condition is true, the statements after
    the if statement are executed; otherwise, the statements after the else statement
    (if present) are executed. This example prints a message stating whether a number
    is less than or greater than 10:


    ```

    if (a > 10) { document.write("Greater 10"); } else { document.write("10 or less");
    }

    ```


    A shorthand method can also be used for these types of statements, where ? indicates
    the if portion and : indicates the else portion. This statement is equivalent
    to the example above:


    ```

    document.write((a > 10) ? "Greater 10" : "10 or less");

    ```


    Conditional statements are explained further in Hour 7, "Testing and Comparing
    Values."


    ![](img/253d3bf9d2a81ee62f8085998b463a44_378_0.png)'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# return


    This statement ends a function, and optionally returns a value. The return statement
    is necessary only if a value is returned.


    # var


    This statement is used to declare a variable. If you use it within a function,
    the variable is guaranteed to be local to that function. If you use it outside
    the function, the variable is considered global. Here''s an example:


    ```

    var students = 30;

    ```


    Since JavaScript is a loosely-typed language, you do not need to specify the type
    when you declare the variable. A variable is also automatically declared the first
    time you assign it a value:


    ```

    students = 30;

    ```


    Using var will help avoid conflicts between local and global variables. Note that
    arrays are not considered ordinary JavaScript variables; they are objects. See
    Hour 6, "Using Strings and Arrays," for details.


    # while


    The while statement defines a loop that iterates as long as a condition remains
    true. This example waits until the value of a text field is "go":


    ```

    while (document.form1.text.value != "go") { statements }

    ```


    # JavaScript Built-In Functions


    The functions in the following sections are built into JavaScript, rather than
    being methods of a particular object.


    # eval


    This function evaluates a string as a JavaScript statement or expression, and
    either executes it or returns the resulting value. In the following example, a
    function is called using variables as an argument:


    ```

    a = eval("add(x,y)");

    ```


    eval is typically used to evaluate an expression or statement entered by the user.'
