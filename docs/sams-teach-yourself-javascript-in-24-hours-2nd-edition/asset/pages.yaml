    Using Loops."


    ![](img/253d3bf9d2a81ee62f8085998b463a44_101_0.png)


    # Using String Arrays


    So far, you''ve used arrays of numbers. JavaScript also allows you to use string
    arrays, or arrays of strings. This is a powerful feature that allows you to work
    with a large number of strings at the same time.


    # Creating a String Array


    You define a string array in the same way as a numeric array (in fact, JavaScript
    does not make a distinction between them):


    ```

    names = new Array(30);

    ```


    You can then assign string values to the array elements:


    ```

    names[0] = "Henry J. Tillman";

    names[1] = "Sherlock Holmes";

    ```


    You can use these array elements anywhere you would use a string. You can even
    use the string methods introduced earlier. For example, the following statement
    prints the first five characters of the first element of the names array, resulting
    in Henry:


    ```

    document.write(names[0].substring(0,5));

    ```'
