  md: '# HOUR 20


    # Working with Multimedia and Plug-Ins


    Welcome to the last hour of Part V. In the last three hours, you''ve learned some
    of JavaScript''s most advanced features: style sheets and the Document Object
    Model (DOM). In Hour 20, you''ll learn another advanced feature: JavaScript with
    plug-ins.


    Plug-ins are browser add-ons that allow you to use additional types of information
    in the browser: sounds, videos, and so forth. You can use JavaScript to control
    the behavior of these plug-ins, allowing your scripts to do about anything.


    Hour 20 covers the following topics:


    +   * How LiveConnect connects JavaScript, Java, and Plug-ins

    * Detecting plug-ins with JavaScript

    * Checking available MIME types

    * Scripting objects in plug-ins

    * Creating an application using sounds


    ![](img/253d3bf9d2a81ee62f8085998b463a44_286_0.png)'
  merge: -1
  pgno: 286
- img_proc: true
  md: "# Introducing Plug-Ins and LiveConnect\n\nPlug-ins were introduced by Netscape\
    \ Navigator 3.0. Rather than adding support directly to the browser for media\
    \ types such as formatted text, video, and audio, Netscape created a modular architecture\
    \ that allows programmers to write their own browser-addons for these features.\n\
    \nThere are now hundreds of plug-ins available. Here are a few of the most popular:\n\
    \n+   - Macromedia's ShockWave and Flash plug-ins support animation and video.\n\
    - Adobe's Acrobat plug-in supports precisely formatted, cross-platform text.\n\
    - RealPlayer supports streaming audio and video.\n  - Headspace's Beatnik plug-in\
    \ supports music in Web pages.\n\nYou can download these plug-ins from their manufacturers.\
    \ The Navigator browser installation includes several basic plug-ins:\n\n+   -\
    \ The QuickTime plug-in for inline movies\n- The LiveAudio plug-in for audio and\
    \ MIDI (music) files\n- Bundled versions of the RealPlayer, ShockWave, and Beatnik\
    \ plug-ins\n\nBecause these are included with Navigator, you can assume that at\
    \ least 50% of your Web page's audience will have them. The workshop section of\
    \ this hour will use the LiveAudio plug-in to play sounds.\n\nMicrosoft Internet\
    \ Explorer also supports plug-ins, but usually requires a different version of\
    \ a plug-in. Additionally, some plug-ins are available only for one platform,\
    \ such as Windows or Macintosh.\n\n![](img/253d3bf9d2a81ee62f8085998b463a44_287_0.png)\n\
    \n| All of the examples in this hour use plug-ins that are available for all platforms,\
    \ but the plug-in detection examples require Netscape Navigator 3.0 or later.\
    \ |\n\nYou can include a file that uses a plug-in in a Web document with the <embed>\
    \ tag. This tag specifies the filename for the content and any parameters required\
    \ by the plug-in.\n\n# Understanding MIME Types\n\nMultipurpose Internet Mail\
    \ Extensions (MIME) is a standard for classifying different types of files and\
    \ transmitting them over the Internet. The different types of files known as MIME\
    \ types."
  merge: -1
  pgno: 287
- img_proc: true
  md: 'You''ve already worked with a few MIME types: HTML (MIME type/html), text (MIME
    type/plain), and GIF images (MIME type image/gif). Although Web browsers don''t
    normally support many more than these types, external applications and plug-ins
    can provide support for additional types.


    When a Web server sends a document to a browser, it includes that document''s
    MIME type in the heading. If the browser supports MIME type, it displays the file.
    If not, you''re asked what to do with the file (such as when you click a .zip
    or .exe file to download it).


    # How LiveConnect Works


    So far, you''ve learned how useful plug-ins can be to a browser, but you haven''t
    seen how they work with JavaScript. That''s where LiveConnect comes in. LiveConnect
    is a Netscape standard that allows JavaScript, Java, and plug-ins to communicate.


    LiveConnect allows plug-ins to make parameters available as objects. These objects
    are stored as part of the browser object hierarchy and are available to JavaScript
    and Java programs. While there are minor differences in the way they are implemented,
    Internet Explorer 4.0 and later also support scriptable plug-ins in JavaScript.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_288_0.png)


    > You can also use LiveConnect to use Java commands from within a JavaScript program,
    or to communicate between Java and JavaScript programs. See Netscape''s Web site
    for more detail:


    http://developer.netscape.com/docs/manuals/liveconnect.html


    # Working with Plug-In Objects


    The JavaScript navigator object, which you learned about in Hour 10, "Working
    with the Document Object Model," includes a child object called plugins. This
    object is an array, with one entry for each plug-in installed on the browser.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_288_1.png)


    > Unfortunately, the navigator.plugins object is supported only by Netscape 3.0
    and later. There is no easy way to detect installed plug-ins in Internet Explorer.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_288_2.png)'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'Each plug-in has an entry in the array. Each entry has the following properties:


    +   - name is the name of the plug-in.

    - filename is the executable file that was loaded to install the plug-in.

    - description is a description of the plug-in, supplied by the developer.

    - mimeTypes is an array with one entry for each MIME type supported by the installed
    plug-ins.


    You can use these properties in a script to find out about the browser, as you’ll
    see in the next section.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_289_0.png)


    Netscape’s navigator object also has a child object called mimeTypes, which includes
    an array element for each MIME type supported by the browser or its plug-ins.


    # Checking for Plug-Ins


    If you want to use a hot new plug-in on your pages, but you know that not every
    plug-in installed? One of the handiest uses for JavaScript is to detect a plug-
    before loading the page that contains plug-in’s content


    For example, Listing 20.1 shows a simple script that checks for the QuickTime
    plug-in (or any other plug-in that handles QuickTime movies). If a plug-in is
    found, the script writes the <embed> tag to include a movie in the document. If
    not, it displays a still image.


    # LISTING 20.1 Checking for the QuickTime Plug-In


    ```

    1: test=navigator.mimeTypes["video/quicktime"]

    2: if (test)

    3: document.writeln(<embed SRC="quick.mov" HEIGHT=100 WIDTH=100>");

    4: else

    5: document.writeln(<img SRC="quick.gif" HEIGHT=100 WIDTH=100>");

    ```


    If your script does not detect the appropriate plug-in, you can provide a link
    to the down-load location for the plug-in or to a non-plug-in version of the page.


    # Listing Plug-Ins


    As an example of the plugins array, you can use JavaScript to list the plug-ins
    supported by your browser. Listing 20.2 shows a script that lists the plug-ins
    in a table, with file-names and descriptions.'
  merge: -1
  pgno: 289
