  md: '# Creating Cross-Browser Scripts


    There are several unexpected things about this display. First of all, the navigator-language
    property is listed as undefined. This isn''t much of a surprise because this prop-erty
    isn''t supported by Internet Explorer.


    -language property is listed as undefined. This isn''t much of a surprise because
    this prop-erty isn''t supported by Internet Explorer.


    More importantly, you''ll notice that the word Mozilla appears in the code name
    and user agent fields. The full user agent string reads as follows:

    Mozilla/4.0 (compatible; MSIE 5.5; Windows 98)


    What is this? Some sort of secret endorsement of Netscape by Microsoft? Some sort
    of government conspiracy? Is Netscape''s mythical monster, Mozilla, hiding somewhere
    under Microsoft''s Redmond campus?


    As it turns out, Mozilla did have a good reason for this. At the height of the
    browser wars, about the time Netscape 3.0 and IE 3.0 came out, it was becoming
    common to see “Netscape only” pages. Webmasters who used features as frames and
    JavaScript set their servers to turn away browsers without Mozilla in their user
    agent string. The problem with this was that most of these features were also
    supported by Internet Explorer.


    Mozilla solved this problem in IE 4.0 by making IE''s user agent read Mozilla,
    with the word compatible in parentheses. This allows IE to view those pages, but
    still includes enough details to tell servers which browser was in.


    > Many Web servers keep statistics about which browsers people use to access them.
    When Microsoft changed IE''s user agent string, many of the statistics programs
    were not aware of the change. As a result, they counted a visit by IE as a visit
    by Netscape. Ironically, Microsoft''s move to make their browser more compatible
    caused Netscape''s market share statistics to improve, least for a while.


    You''ve probably already noticed the other problem with Internet Explorer 5.5''s
    User agent string: the portion reading Mozilla/4.0. Not only is IE claiming to
    be Netscape—it''s also masquerading as version 4.0. Why?


    As it turns out, this was another effort by Microsoft to stay one ahead of the
    browser wars, although this one doesn''t make quite as much sense. Since poorly-written
    scripts were checking specifically for Mozilla/4 for dynamic HTML pages, Microsoft
    was concerned that its 5.0 version would fail to run these pages.'
