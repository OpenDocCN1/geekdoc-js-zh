- img_proc: true
  md: '# Controlling Windows with Objects


    In Hour 10, "Working with the Document Object Model," you learned that you can
    use DOM objects to represent various parts of the browser window and the current
    HTML document. You also learned that the history, document, and location objects
    are all children of the window object.


    In this hour, you''ll take a closer look at the window object itself. As you''ve
    probably guessed by now, this means you''ll be dealing with browser windows. A
    variation of the window object also allows you to work with frames, as you''ll
    see later in this hour.


    The window object always refers to the current window (the one containing the
    script). The self keyword is also a synonym for the current window. In the next
    section, you''ll learn you can have more than one window on the screen at the
    same time, and can refer to them with different names.


    # Creating a New Window


    One of the most convenient uses for the window object is to create a new window.
    You can do this to display a document—for example, the instructions for a game—without
    clearing the current window. You can also create windows for specific purposes,
    such as navigation windows.


    You can create a new browser window with the window.open() method. A typical statement
    to open a new window looks like this:


    ```

    WinObj=window.open("URL", "WindowName", "Feature List");

    ```


    The following are the components of the window.open() statement:


    +   * The WinObj variable is used to store the new window object. You can access
    methods and properties of the new object using this name.

    * The first parameter of the window.open() method is a URL, which will be loaded
    into the new window. If it''s left blank, no Page will be loaded.

    * The second parameter specifies a window name (here, WindowName). This is assigned
    to the window object''s name property and is to refer to the window.

    * The third parameter is a list of optional features, separated by commas. You
    can customize the new window by choosing whether to include the toolbar, status
    bar, and other features. This enables you to create a variety of "floating" windows,
    which may look nothing like a typical browser window.


    The features available in the third parameter of the window.open() method include
    width and height, to set the size of the window, and several features that can
    be set'
