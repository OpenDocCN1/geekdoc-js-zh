    This specifies a statement to be used as the onmouseover event handler for the
    link. This statement displays an alert message when the mouse moves over the link.


    > The previous example uses single quotation marks to surround the text. It is
    necessary in an event handler because double quotation marks are used to surround
    the event handler itself. (You can also use single quotation marks to surround
    the event handler and double quotes within the script statements.)


    You can use JavaScript statements like the previous one in an event handler, but
    if you need more than one statement, it''s a good idea to use a function instead.
    Just define the function in the header of the document, and then call the function
    as the event handler like this:


    ```

    <a href="bottom" onMouseOver="DoIt(1)">Move the mouse over this link.</a>

    ```


    This example calls a function called DoIt(1) when the user moves over the link.
    Using a function is convenient because you can use longer, more readable JavaScript
    routines as event handlers. You''ll use a longer function to handle events in
    the "Workshop: Adding Link Descriptions to a Web Page" section of this hour.


    > For simple event handlers, you can use two statements if you separate them by
    a semicolon. However, in most cases it''s easier to use a function to perform
    the statements.


