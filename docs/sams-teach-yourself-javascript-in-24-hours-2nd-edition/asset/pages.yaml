  md: '# LISTING 5.2 A Function That Accepts a Parameter


    ```

    1: function Greet(who) {

    2:   alert(''Greetings, '' + who);

    3: }

    ```


    Of course, to use this function, you should include it in an HTML document.

    Traditionally, the best place for a function is within the <head> section of the
    document. Since the statements in the <head> section are executed first, this
    ensures that the function is defined before it is used.


    Listing 5.3 shows the Greet function embedded in the header section of an HTML
    document.


    # LISTING 5.3 The Greet Function in an HTML Document


    ```

    1: <html>

    2: <head>

    3: <title>Functions</title>

    4: <script LANGUAGE="JavaScript">

    5: function Greet(who) {

    6:   alert(''Greetings, '' + who);

    7: }

    8: </script>

    9: </head>

    10: <body>

    11: This is the body of the page.

    12: </body>

    13: </html>

    ```


    # Calling the Function


    You have defined a function and placed it in an HTML document. However, if you
    load Listing 5.3 into a browser, you will notice that it does absolutely nothing.
    This is because the function is defined—ready to be used—but we haven''t used
    it yet.


    Making use of a function is referred to as calling the function. To call a function,
    use the function''s name as a statement in a script. You will need to include
    the parentheses and the values for the function''s parameters. For example, here''s
    a statement that calls the Greet function:


    Greet("Fred");'
