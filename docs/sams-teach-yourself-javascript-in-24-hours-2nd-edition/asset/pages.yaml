  md: '# Location


    The location object contains information about the current.URL being displayed
    by the window. It has a set of properties to hold the different components of
    the URL:


    +   - location.protocol is the protocol (or method) of the URL.

    - location.hostname specifies the host name.

    - location.port specifies the communication port.

    - location.host is a combination of the host name and port.

    - location.pathname is the directory to find the document on the host, and the
    name of the file.

    - location.hash is the name of an anchor within the document, if specified.

    - location.target specifies the TARGET attribute of the link that was used to
    reach the current location.

    - location.query specifies a query string.

    - location.href is the entire URL.


    # History


    The history object holds information about the URLs that have been visited before
    and after the current one in the window, and includes methods to go to previous
    or next locations:


    +   - history.back goes back to the previous location.

    - history.forward goes forward to the next location.

    - history.go goes to a specified offset in the history list.


    # Document


    The document object represents the current document in the window. It includes
    the following child objects:


    +   - document.forms is an array with an element for each form in the document.
    These can also be addressed by name, as in document.regform. Form elements are
    child objects of the form object, and are described in Hour 14, "Getting Data
    with Forms.\n- document.links is an array containing elements for each of the
    links in the document.

    - document.anchors is an array with elements for each of the anchors in the document.'
