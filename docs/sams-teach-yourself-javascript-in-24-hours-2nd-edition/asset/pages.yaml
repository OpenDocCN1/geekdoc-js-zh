    # Validating Forms


    One of the simplest, yet powerful features of the Web is the use of interactive
    forms. These forms allow the user to enter information and interact with the sites,
    instead of simply looking at the page. This makes everything from order forms
    to questionnaires to interactive games possible.


    Traditionally, forms are handled by a CGI (Common Gateway Interface) script. This
    script runs on the Web server. When the user enters information on a page and
    presses the Submit button, it is sent to the CGI script for processing. The script
    then sends back a result in the form of another Web page.


    > While this book does not cover CGI, Hour 1, "Understanding JavaScript," presented
    a basic description of CGI and mentioned some other books that go into detail.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_56_2.png)'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'While CGI is a powerful system, it has disadvantages for some uses of forms.
    The main disadvantage is that submitting the data requires communication with
    the Web server and may take anywhere from a few seconds to a few minutes.


    Often, the CGI script is responsible for validating the form, or making sure the
    appropriate data has been entered. For example, if the user enters only four digits
    in a phone number field, or leaves a required field blank, the script could alert
    him and prompt for the missing information.


    While this method of form validation works, the slow speed can make it inconvenient—users
    may be frustrated when waiting ten minutes for a reply from the server, and receive
    a response indicating that they need to supply missing information and start over.


    As you''ve probably guessed now, JavaScript provides a convenient solution to
    this problem. A JavaScript program can read the data in the form instantly (without
    any communication with the server) and display an error message in an alert box.
    Your script can even move the cursor to the field that contains the error.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_57_0.png)


    > You will learn how to write a JavaScript program to validate a form in Hour
    14.


    In some cases, JavaScript can be used to handle the form submission entirely,
    sending the results via email. The script can also pass the data on to a CGI script
    after validating it.


    You can also use JavaScript to automate forms in ways CGI can''t. For example,
    Figure 3.3 shows an order form that uses JavaScript to fill the subtotals and
    keep a running total as the user enters product quantities.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_57_1.png)


    > JavaScript can work with forms faster than CGI and without communicating with
    the server, then you may be wondering, why use CGI? The answer is that CGI can
    do things a client-side scripting language can''t, such as writing data to a file
    on the server or working with a database. (A server-side version of JavaScript
    is available, and can also perform these functions.)'
