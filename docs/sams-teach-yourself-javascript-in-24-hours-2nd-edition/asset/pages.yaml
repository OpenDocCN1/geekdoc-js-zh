  md: '# # What Is an Object?


    As you know from earlier hours of this book, objects allow you to combine several
    kinds of data (properties) and functions (methods) into a single, convenient package.
    In this hour, you''ll learn more about the built-in Math and Date objects—but
    first, here''s a quick overview of the way objects work in JavaScript.


    # ## Creating Objects


    Each object has a special function, called a constructor, that''s used to create
    objects. For example, JavaScript includes a built-in function String to create
    String objects. That''s why you can create a string variable like this:


    ```

    myname=new String("Figby");

    ```


    The new keyword tells JavaScript to create a new object—or in technical terms,
    a new instance of the Object. This particular instance will have the value Figby
    and will be stored in the variable name.


    You can use the same basic syntax to create String objects, Date objects, Array
    objects, and even your own custom objects. (The Math object is an exception, which
    you''ll learn about in this hour.)


    ![](img/253d3bf9d2a81ee62f8085998b463a44_135_0.png)


    > If you''re dying to create some custom objects right away, you should probably
    get some sleep. If you''re serious, you can skip to Hour 11, "Creating Custom
    Objects."


    # ## Object Properties and Values


    Each object can have one or more properties, or attributes. Each property is basically
    a variable in itself, and is contained within the object. Each property can be
    assigned a value. You can use properties to store any type of data a variable
    store.


    You''ve already used a few object properties, such as the length property of strings
    and arrays. To refer to a property, you use the object''s name, a period, and
    the property''s name. For example, the length of the names array is referred to
    with this property: names.length


    Object properties can even contain objects themselves. For example, each of an
    array elements is a special type of property, named with an index value.'
