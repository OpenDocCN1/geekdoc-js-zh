  md: 'You can use any expression to the right of the equal sign, including other
    variables. You have used this syntax earlier to add one to a variable: ;


    lines = lines + 1;


    Since incrementing or decrementing variables is quite common


    lines += 1;


    Similarly, you can subtract a number from a variable using the -= operator:


    lines -= 1;


    If you still think that''s too much to type, JavaScript also includes the increment
    and decrement operators, ++ and --. This statement adds one to the value of lines:


    lines++;


    Similarly, this statement subtracts one from the value of lines:


    lines--;


    You can alternately use the ++ or -- operators before a variable name, as in ++lines.
    However, these are not identical. The difference is when the increment or decrement
    happens:


    +   * If the operator is after the variable name, the increment or decrement happens
    after the current expression is evaluated.


    +   * If the operator is before the variable name, the increment or decrement
    happens before the current expression is evaluated.


    This difference is only an issue when you use the variable in an expression and
    increment it in the same statement. As an example, suppose you have assigned the
    lines variable value 40. The following statements have different effects:


    ```

    alert(lines++);

    alert(+lines);

    ```


    The first statement displays an alert with the value 40, and then it increments
    lines to 41. The second statement first increments lines to 41, then displays
    an alert with the value 41.'
