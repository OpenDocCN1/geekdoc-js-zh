  md: '# Summary


    In this hour, you''ve used style sheets to control the appearance of Web documents.

    You''ve learned the CSS syntax for creating style sheets, and used JavaScript
    to control the styles of a document.


    In Hour 18, you will move on to layers and other features of the new W3C DOM.


    # Q&A


    +   Q What''s the difference between changing the appearance of text with traditional
    tags, such as `<b>` and `<i>`, using a style sheet?


    +   A Functionally, there is no difference. If you''re only using simple boldface,
    italics, and such, it''s probably best to avoid style sheets. On the other hand,
    if you need to use more specific formatting, style sheets are ideal.


    +   Q What happens if two style sheets affect the same text?


    +   A The CSS specification is designed to allow style sheets to overlap, or cascade.
    Thus, you can specify a style for the body of the document and override it for
    specific elements, such as headings and paragraphs. You can even go one step further
    and override the style for one particular instance of an element.


    +   Q What if users don''t like the styles I use in my pages?


    +   A This is another distinct advantage style sheets have over browser-specific
    tags. When style sheets are fully supported, users will be able to choose a default
    style sheet of their own and override any properties they want.


    # Quiz


    Test your knowledge of style sheets and JavaScript by answering the following
    questions.


    # Questions


    +   1. Which tag do you use to begin a CSS style sheet?


    +   a. `<style>`


    +   b. `<style TYPE="text/css">`


    +   c. `<style TYPE="text/javascript">`


    ![](img/253d3bf9d2a81ee62f8085998b463a44_258_0.png)'
  merge: -1
  pgno: 258
- img_proc: true
  md: '2. Why isn''t the normal HTML language very good at defining layout and presentation?


    +   a. Because it was designed by programmers. ;


    +   b. Because magazines feared the competition.


    +   c. Because its main purpose is to describe document structure.


    3. Which feature of new browsers allows you to use JavaScript statements to change
    styles?


    +   a. HTML 4.0


    +   b. The DOM


    +   c. CSS 2.0


    # Answers


    +   1. b. You begin a CSS style sheet with the tag <style TYPE="text/css">.


    +   2. c. HTML is primarily intended to describe the structure of documents.


    +   3. b. The DOM (Document Object Model) allows you to change styles using JavaScript.


