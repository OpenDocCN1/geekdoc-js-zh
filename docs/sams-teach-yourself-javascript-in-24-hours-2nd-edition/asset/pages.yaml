  md: '# Q&A


    +   Q Is this about as complex as a JavaScript program can get?


    +   A Not by any means. You can write much more complicated scripts that can encompass
    several different HTML files.


    +   Q I thought the images at the top, which the images array are indexed starting
    with 0, but the game uses the indices 1-5 to display the cards. How does this
    work?


    +   A The game includes a title graphic at the top, which uses the images[ ] space.
    If you add or remove graphics from the top of the page, be sure to change the
    indices accordingly.


    +   Q Why use an object to store cards when the filename (such as 1h.gif) already
    stores a card''s information?


    +   A Just for convenience. By using an object, you can individually access the
    card''s value and its suit, which are heavily used by the scoring routine.


