  md: 'An easier alternative is to send users with JavaScript support to another page.
    This can be accomplished with a single JavaScript statement:


    ```

    <script LANGUAGE="JavaScript">

    window.location="JavaScript.html";

    </script>

    ```


    This sends the user to a different page. If the browser doesn''t support JavaScript,
    of course, the script won''t be executed.


    The final alternative is to simply make your scripts unobtrusive. Use comments
    to hide them from other browsers, as described in Hour 4, "How JavaScript Programs
    Work," and be sure they''re not essential to navigate or read the page.


    # Workshop: Scripting for Multiple Browsers


    As an example of the techniques you learned in this chapter, you can create a
    script that uses reliable methods to determine which of the following categories
    the current browser falls into:


    +   - Either Internet Explorer or Netscape, 5.0 or later

    - Netscape 4.x

    - Internet Explorer 4.x

    - All others


    This is useful because the 5.0 and later browsers support the new DOM for dynamic
    HTML. You may also want to support the 4.x browsers, which support dynamic features
    but in incompatible ways. Last but not least, older browsers can be supported
    with a minimal script.


    As a simple example, this script will determine the browser in use and set a variable
    browser, to the appropriate code. Listing 16.5 shows the browser detection example


