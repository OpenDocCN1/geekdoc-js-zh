  md: "# Understanding DOM Structure\n\nIn Hour 10, “Working with the Document Object\
    \ Model,” you learned about some of the most important DOM objects are organized:\
    \ the window object contains the document object, and so on. While these objects\
    \ worked in older browsers, the new DOM adds objects under the document object\
    \ for every element of a page.\n\nTo better understand this concept, let's look\
    \ at the simple HTML document in Listing 18.1. This document has the <head> and\
    \ <body> sections, a heading, and a single paragraph of text.\n\n# Listing 18.1\
    \ A Simple HTML Document\n\n```\n<html>\n<head>\n  <title>A simple HTML Document</title>\n\
    \  </head>\n<body>\n  <h1>This is a Heading</h1>\n  <p>This is a paragraph</p>\n\
    </body>\n</html>\n```\n\nLike all HTML documents, this one is composed of various\
    \ containers and their contents. The <html> tags form a container that includes\
    \ the entire document, the <body> tags contain the body of the page, and so on.\n\
    \nIn the DOM, each container within the page and its contents are represented\
    \ by an object. The objects are organized into a tree-like structure, with the\
    \ document object itself at the root of the tree, and individual elements such\
    \ as the heading and paragraph of text at leaves of the tree. Figure 18.1 shows\
    \ a diagram of these relationships.\n\nFigure 18.1 How the DOM represents an HTML\
    \ document.\n\n![](img/253d3bf9d2a81ee62f8085998b463a44_261_0.png)"
  merge: -1
  pgno: 261
- img_proc: true
  md: '# Creating Dynamic Pages with the DOM


    In the following sections, you will examine the structure of the DOM more closely.


    > Don''t worry if this tree structure confuses you; you can do quite a bit by
    simply assigning IDs to elements and referring to them. This is the method used
    in the previous hour, as well as in the Workshop session of this hour. In Hour
    19, "Using Advanced DOM Features," you will look at more complicated examples
    that require you to understand the way objects are organized in the DOM.


    # Nodes

    Each container or element in the document is called a node in the DOM. In the
    example Figure 18.1, each of the objects in boxes is a node, and the lines represent
    the relationships between the nodes.


    You will often need to refer to individual nodes in scripts. You can do this by
    assigning an ID, or by navigating the tree using the relationships between the
    nodes.


    # Parents and Children

    As you learned earlier in this book, each JavaScript object can have a parent—an
    object that contains it—and can also have children—objects that it contains. The
    DOM uses the same terminology.


    In Figure 18.1, the document object is the parent object for the remaining objects,
    and does not have a parent. The html object is the parent of the head and body
    objects, and the h1 and p objects are children of the body object.


    Text nodes work a bit differently. The actual text in the paragraph is a node
    in itself, and is a child of the p object. Similarly, the text in the <h1> tags
    is a child of the h1 object.


    > In Hour 19, you will learn methods of referring to objects by their parent and
    child relationships, as well as ways of adding and removing nodes from the document.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_262_0.png)


    # Siblings

    The DOM also uses another term for organization of objects: siblings. As you might
    expect, this refers to objects that have the same parent—in other words, objects
    at the same level in the DOM object tree.'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'In Figure 18.1, the h1 and p objects are siblings: Both are children of the
    body object. Similarly, the head and body objects are siblings under the html
    object.


    # Creating Positionable Elements


    Netscape 4.0 included a <layer> tag, which defined a portion of the Web page that
    could be moved, shown, or hidden separately from the rest of the page. While this
    was proprietary, the CSS (Cascading Style Sheets) specification also includes
    methods of positioning elements.


    Under the new DOM, you can control any element in the page. You can effectively
    create a layer, or a group of HTML objects that can be controlled as a group,
    using the <div> tag.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_263_0.png)


    > The <div> tag is part of the HTML 3.0 standard. It defines an arbitrary section
    of the HTML document and, by itself, it does not specify any formatting for the
    text it contains. This makes it the ideal choice for implementing styles and layers.


    To create a layer with <div>, enclose the content of the layer between the two
    division tags and specify the layer''s properties in the STYLE attribute of the
    <div> tag. Here''s a simple example:


    ```

    <div id="layer1" style="position:absolute; left:100; top:100">

    <p>This is the content of the layer.</p>

    </div>

    ```


    This code defines a layer with the name layer1. This is a movable layer that''s
    100 pixels down and 100 pixels to the right of the upper-left corner of the browser
    window. You''ll learn more details about the layer properties in the next section.


    # Setting Positioning Properties


    You can use various properties in the STYLE attribute of the <div> tag when you
    define a layer to set its position, visibility, and other features. The following
    properties are available:


    +   - the position is the main positioning attribute and can affect the properties
    below. The position property can have one of three values:

    - static defines items that are laid out in normal HTML fashion, and cannot be
    moved. This is the default.

    - absolute specifies that an item will be positioned using coordinates specify.'
  merge: -1
