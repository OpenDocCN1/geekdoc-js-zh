  md: '# Understanding JavaScript


    ```

    6: <h1>The American Eggplant Society</h1>

    7: <p>Welcome to our Web page. Unfortunately,

    8: it''s still under construction.

    9: We last worked on it on this date:</p>

    10: <script LANGUAGE="JavaScript">

    11: document.write(document.lastModified);

    12: \</script>

    13: </body>

    14: </html>

    ```


    The document.write statement, which you''ll learn more about later, sends output
    as part of the Web document. In this case, it displays the modification date of
    the document.


    > Notice the <script> tag in Listing 1.2 includes a parameter: LANGUAGE="JavaScript".
    This specifies the scripting language to the browser. You can also specify a JavaScript
    version, as you''ll learn later in this hour.


    In this example, we placed the script within the body of the HTML document. There
    are actually four places where you might use scripts:


    +   - In the body of the page. In this case, the output of the script is displayed
    as part of the HTML document when the browser loads the page.

    - In the header of the page, between the <head> tags. Scripts in the header aren''t
    executed immediately, but can be referred to by other scripts. The header is used
    for functions--collections of JavaScript statements that can be used as a group.
    You will learn more about functions in Hour 4, "How JavaScript Programs Work."

    - With an HTML tag. This is an event handler and allows the script to work with
    HTML elements. Event handlers are the one type of script for which you don''t
    need to use the <script> tag. You''ll learn more about event handlers in Hour
    4.

    - In a separate file entirely. JavaScript supports the use of files with .js extension
    scripts; these can be included by specifying a file in the <script> tag. This
    feature works only in Netscape Navigator 3.0 or later and Internet Explorer 4.0
    or later.


