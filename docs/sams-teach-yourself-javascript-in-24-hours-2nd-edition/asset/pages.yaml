    # Using Dynamic Images in JavaScript


    One of the most useful features of JavaScript is the capability to dynamically
    change images. This means you can create images that "magically" change, which
    could be used for clocks, image rollovers (images that change when you move the
    mouse over them), or even simple animations.


    The images in a Web page are reflected in an array, just like form elements. By
    modifying the properties of the array items, you can replace the image with a
    different one. This enables you to create dynamically changing content on the
    page without using frames or layers.


    This technique isn''t perfect for all applications. Before you get started, note
    the following limitations:


    +   - You can only change existing images in the page with this technique—you
    can''t add new ones or remove an image entirely.


    +   - You can replace an existing image with a larger or smaller image, but this
    may not look good because the text won''t be reformatted to match.


    +   - Any image you use will have to be loaded from the server. This makes this
    technique impractical for complicated animations or large images.'
