  md: '# Summary


    In this hour, you''ve learned to use events to detect mouse actions, keyboard
    actions, and other events, such as the loading of the page. You can use event
    handlers to perform a simple JavaScript statement when an event occurs, or to
    call a more complicated function.


    Congratulations! You''re halfway through your 24-hour tour of JavaScript. In the
    next few chapters, you''ll move on to some more advanced methods of working with
    Web pages—for example, you''ll learn how to use windows, frames, forms, and graphics,
    and how to make scripts that detect the user''s browser.


    # Q&A


    +   I noticed that the `<img>` tag in HTML can''t have onMouse or onClick event
    handlers. How can my scripts respond when the mouse moves over an image?

    The easiest way to do this is to make the image a link by surrounding it with
    an `<a>` tag. You can include the `BORDER=` attribute to prevent the blue link
    border from being displayed around the image. You''ll see an example of this in
    Hour 15.

    My image rollovers using onmouseover works perfectly in Internet Explorer, but
    not in Netscape. Why?

    Re-read the previous answer, and check whether you''ve used an onmouseover event
    for an `<img>` tag. This is supported by Internet Explorer, but not by Netscape.

    What happens if I define both onkeydown and keyPressed event handlers? Will both
    be called when a key is pressed?

    The onkeydown event handler is called first. If it returns true, the onkeypress
    event is called. Otherwise, no keyPressed event is generated.

    When I use the onload event, my event handler sometimes executes before the page
    is done loading, or before some of the graphics. Is there a better way?

    A is a bug in some older versions of JavaScript. One solution is to add a slight
    delay to your script using the setTimeout method. You''ll learn how to use this
    method in Hour 13, "Using Windows and Frames."


    ![](img/253d3bf9d2a81ee62f8085998b463a44_180_0.png)'
