    # Accessing Array Elements


    You can read the contents of an array using the same notation you used when assigning
    values. For example, the following statements would display the values of the
    first four elements of the scores array:


    ```

    scoresdisp = "Scores: " + scores[0] + ", " + scores[1] + ", " + scores[2] + ",
