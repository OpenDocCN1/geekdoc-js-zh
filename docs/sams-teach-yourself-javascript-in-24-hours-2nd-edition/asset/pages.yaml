  md: '# Modifying the Script


    While the current script does indeed display the current date and time, its display
    isn''t nearly as attractive as the clock on your wall or desk. To remedy that,
    you can use some additional JavaScript features and a bit of HTML to display a
    large clock.


    To display a clock, we need the hours, minutes, and seconds in separate variables.
    Once again, JavaScript has built-in functions to do the most of the work. Listing
    2.5 shows the modified version of the script.


    # Listing 2.5 The Date and Time Script with Added Large Clock Script


    ```

    1: <html>

    2: <head><title>Displaying Times and Dates</title></head>

    3: <body>

    4: <h1>Current Date and Time</h1>

    5: <p>

    6: <script language="JavaScript">

    7: var now = new Date();

    8: var localtime = now.toLocalString();

    9: var utctime = now.toUTCTimeString();

    10: document.write("<b><b>Local time: </b>" + localtime + "<BR>");

    11: document.write("<b>UTC time: </b>" + utctime + "</p>");

    12: hours = now.getHours();

    13: mins = now.getMinutes();

    14: secs = now.getSeconds();

    15: document.write("<font size=''5''>");

    16: document.write(hours + ": " + mins + ": " + secs);

    17: document.write("</font>");

    18: </script>

    19: </body>

    20: </html>

    ```


    The first three statements are added on lines 12–14. These store the hour, minute,
    and second portions of the current time in the hours, mins, and secs variables.


    Next, line 15 adds a <font> HTML tag to the page to display the clock in a large
    typeface. Line 16 displays the hours, mins, and secs variables, separated by colons,
    and line 17 adds the </font> tag.


    Now that you have modified the script, save the HTML file and open the modified
    file in your browser. If you leave the browser running, you can simply use the
    Reload button to load the new version of the script. Try it and verify that the
    same time is displayed in both the upper portion of the window and the new large
    clock. Figure 2.2 shows the results.'
