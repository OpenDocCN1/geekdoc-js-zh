  md: '# Calculating the Results


    Internally, JavaScript stores dates as the number of milliseconds since January
    1, 1970.

    Fortunately, JavaScript includes a number of functions to convert dates and times
    in various-ways, so you don''t have to figure out how to convert milliseconds
    to day, date, and time.


    To continue your script, add the following two statements before the final </script>
    tag:


    ```

    localtime = now.toString();

    utctime = now.toGMTString();

    ```


    These statements create two new variables: localtime, containing the current time
    and date in a nice readable format, and utctime, containing the UTC equivalent.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_42_0.png)


    The localtime and utctime variables store a piece of text, such as "January 1,
    2012 12:00 PM." in programming parlance, a piece of text is called a string. You
    will learn more about strings in Hour 6, "Using Strings and Arrays."


    # Creating Output


    You have two variables—localtime and utctime—which contain the results we want
    from our script. Of course, these variables don''t do us much good unless we see
    them. JavaScript includes a number of ways to display information, and one of
    the simplest is the document.write statement.


    The document.write statement displays a text string, a number, or anything else
    you want to throw. Since your JavaScript program will be used within a Web page,
    the output will be displayed as part of the page. To display result, add these
    statements before the final </script> tag:


    ```

    document.write("<b>-local time:"" + localtime + "<BR>");

    document.write("<b>-UTC:"" + utctime + "</p>");

    ```


    These statements tell the browser to add some text to the Web page containing
    your script. The output will include some brief strings introducing the results,
    and the contents of the localtime and utctime variables.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_42_1.png)


    > The plus signs (+) used between the text and variables in the above statements.
    In this case, it tells the browser to combine the values into one string of text.
    If you use the plus sign between two numbers, they are added together.'
  merge: -1
