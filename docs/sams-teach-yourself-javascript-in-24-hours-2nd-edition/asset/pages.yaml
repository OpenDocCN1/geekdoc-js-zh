  md: '# Creating Cross-Browser Scripts


    With 99% of Web users using a recent copy of Netscape or IE, where are the non-JavaScript
    browsers? First, there are still some older browsers out there, and text browsers
    such as Lynx don''t support scripting. Second, and more importantly, Netscape
    and IE users have JavaScript support turned off, either due to security concerns
    or just to avoid watching scrolling messages in the status line.


    In the last year or two, a variety of new browsers have also emerged. Palmtop
    computers, such as Palm Inc.''s Palm Series and the Windows CE platform, Web browsing,
    as do some cellular phones and other appliances. Since none of these support JavaScript,
    it''s even more important to provide an alternative when possible.


    One way to be friendly to non-JavaScript browsers is to use the <script> tag.
    Supported in Netscape 3.0 and later, this tag displays a message to non-JavaScript
    browsers. Browsers that support JavaScript ignore the text between the <script>
    tags, while others display it. Here is a simple example:


    ```

    <script>

    This page requires JavaScript. You can either download a copy of netscape from
    a <a href="http://www.netscape.com/"> their page, or switch to the <a href="nojs.html">Non-JavaScript</a>
    version of this page.

    </script>

    ```


    The main problem with using <noscript> is that Netscape 2.0 will display the text
    between the tags, even though it does support some JavaScript. There''s a way
    to solve this problem, but it''s a bit tricky. Listing 16.4 shows a script that
    can detect non-JavaScript browsers and display a message.


    # Listing 16.4 Detecting Non-JavaScript Browsers


    ```

    1:  <script LANGUAGE=''JavaScript''>

    2:  <!-- //hide from old browsers

    3:  ...script commands go here...

    4:  /* (start JavaScript comment, end HTML comment)

    5:  -

    6:  -->

    7:  You''re using a non-JavaScript browser! Shame on you.

    8:  <!-- * // -->

    9:  </script>

    ```


    This uses the HTML comment tags (<!-- and -->) to hide the script commands from
    old browsers. It then uses JavaScript comment tags (/* and */) to enclose the
    message for non-JavaScript browsers, so it will be disregarded by browsers that
    support JavaScript.'
  merge: -1
