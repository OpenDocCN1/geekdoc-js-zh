  md: '# Summary


    In this hour, you''ve used various JavaScript techniques you learned throughout
    this book to improve a Web page''s appearance and user-friendliness.


    In the next hour, you''ll move on to a more complex JavaScript application: a
    complete game with graphics and user interaction.


    # Q&A


    +   - Is there any way to use some kind of "floating hints" or "balloon help"
    with links instead of using the status bar?


    +   - Yes, you can use dynamic HTML to achieve this effect. See Hour 18, "Creating
    Dynamic Pages with DOM." for information.


    +   - Can the navigation bar in this hour be used with browsers that don''t support
    JavaScript?


    +   - Yes. You could easily modify it to send the selections to a CGI script,
    which could send the user to the correct page. This would be slower, but would
    still work.


