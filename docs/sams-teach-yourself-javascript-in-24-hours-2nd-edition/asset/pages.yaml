  md: '# Summary


    In this hour, you learned how to use JavaScript to work with graphics. JavaScript
    can work with image maps, and can be used to create image rollovers and simple
    animations.


    In the final hour of Part IV, you''ll learn more techniques that are helpful in
    creating scripts for the Web: detecting browser versions and creating scripts
    that work on multiple browsers.


    # Q&A


    +   I created an onmouseover handler for rollovers, and it works in Internet Explorer
    but not Netscape. What''s wrong?


    +   This is probably because you used the onmouseover handler in the `<img>` tag.
    This is supported only by Internet Explorer. For Netscape, you need to make the
    image a link and use event handlers in the `<a>` tag (This will also work in Internet
    Explorer).


    +   Can I use rollovers in an image map?


    +   No, you''ll need to replace the entire image map to do this. Usually, it''s
    easier to divide the image map into a number of sections and use those as the
    rollovers.


    +   JavaScript animation seems a bit basic. Is there a way to do more complex
    or interactive animation?


    +   Not in JavaScript. For these purposes, you may want to look into Java or Macromedia''s
    Flash. See this URL for more information about Flash: http://www.macromedia.com/software/flash/


    +   I created a JavaScript program on a page with images, and my event handlers
    don''t seem to be working. What''s wrong?


    +   JavaScript requires you to use HEIGHT and WIDTH attributes on all `<img>`
    tags. Adding them will most likely make the event handlers work properly. See
    Hour 21, "Finding and Handling Errors," for other debugging techniques.'
