  md: '# Can I make scripts that work on both Netscape and Internet Explorer?


    Yes, but it isn''t always easy. Some JavaScript commands are supported by both
    browsers, and if you carefully test a simple script on both browsers, you can
    make it work. For more complex scripts, you may need to use different sections
    of code for each browser. JavaScript can detect the browser and then run the code
    for the appropriate browser.


    # What about supporting different versions of Netscape?


    If you don''t specify a version number in the <script> tag, you can write simple
    scripts that run in Netscape 2.0 and later versions. In this case you will need
    to stick to the features of JavaScript 1.0.


    # What happens if a user''s browser doesn''t support JavaScript at all?


    You can use HTML comments to prevent older browsers from displaying JavaScript
    code. This is explained in Hour 2.


    # Quiz


    Test your knowledge of the material covered in this hour by answering the following
    questions.


    # Questions


    +   1. Why do JavaScript and Java have similar names?

    a. JavaScript is a stripped-down version of Java

    b. JavaScript''s syntax is loosely based on Java''s

    c. They both originated on the island of Java

    2. When a user views a page containing a JavaScript program, which machine actually
    executes the script?

    a. The user''s machine running a Web browser

    b. The Web server

    c. A central machine deep within Netscape''s corporate offices

    3. Which of the following languages is supported by both Microsoft Internet Explorer
    and Netscape Navigator?

    a. VBScript

    b. ActiveX

    c. JavaScript'
  merge: -1
