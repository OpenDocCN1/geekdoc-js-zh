    # Improving a Site’s User Interface


    Have you ever bored by a Web site? (If you haven’t, you need to get out more.)
    One of the most popular uses for JavaScript is to add a bit of excitement to a
    Web page. This includes eye candy features like scrolling messages and rollovers,
    as well as useful navigational aids and new ways of presenting information.


    # Using the Status Line


    The status line is the gray strip at the bottom of the browser window that is
    found in all today’s fashionable browsers. It usually serves two main purposes:


    +   - Displaying descriptions of menu and toolbar items

    - Displaying the URL of links as the mouse pointer moves over them


    Using JavaScript, you can take control of the status line of yourself. You’ve
    probably noticed scrolling messages in the status line of some pages. While this
    can be annoying in some cases (am I the only one who thinks so?), it’s one of
    the most popular uses of JavaScript.


    > You’ll learn how to create a script for scrolling status line messages in Hour
