  md: '# Working with the Document Object Model


    +   - The title property lists the title of the current page, defined by the HTML
    <title> tag.

    - The referrer property is the URL of the page user was viewing prior to the current
    page—usually, the page with a link to the current page.

    - The lastModified property is the date the document was last modified. This date
    is sent from the server along with the page.


    As an example, Listing 10.1 shows a short HTML document that displays its last
    modified date.


    # Listing 10.1 Displaying the Last Modified Date


    ```

    1: <html><head><title>Test Document</title></head>

    2: <body>

    3: <p>This page was last modified on:

    4: <script>

    5: document.write(document.lastModified);

    6: </script>

    7: </p><br>

    8: </html>

    ```


    This can tell the user when the page was last changed. If you use JavaScript,
    you don''t have to remember to update the date each time you modify the page.
    (You could also use the script to always print the current date, but that would
    be cheating.)


    > You might find that the document.lastModified property doesn''t work on your
    Web pages. The date is received from the Web server, and some servers do not maintain
    modification dates correctly.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_150_0.png)


    # Writing Text in a Document


    The simplest document object methods are also the ones you will use most often.
    In fact, you''ve used one of them already. document.write method prints text as
    part of the HTML page in a document window. This statement is used whenever you
    need to include output in a Web page.


    An alternative statement, document.writeln, prints text, but it also includes
    a new-line (

    ) character at the end. This is handy when you want your text to be the last thing
    on the line.'
