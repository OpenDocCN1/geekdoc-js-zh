  md: '![](img/253d3bf9d2a81ee62f8085998b463a44_348_0.png)


    # HOUR 24


    # Where Do We Go from Here?


    By now, you should be reasonably confident with JavaScript programming, and you
    probably have some ideas for improving your pages with this technology. As you
    reach the end of your 24-hour JavaScript course, it''s time to look to the future
    of JavaScript and the Web, and decide how to further your education.


    In Hour 24, you will examine what lies ahead for JavaScript and the Web, and what
    future technologies may impact your scripting. This hour covers the following
    topics:


    +   * Where to go to learn more about JavaScript

    * How future versions of JavaScript may affect your scripts

    * An introduction to XML (Extensible Markup Language)

    * How to be sure you''re ready for future Web technologies

    * A few final JavaScript tips'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# Learning Advanced JavaScript Techniques


    Although you''ve learned all the essentials of the JavaScript language, there
    is still much to learn. JavaScript can be used to script environments other than
    the Web, features such as signed scripts can allow you to create more powerful
    JavaScript applications.


    Here are some ways you can further your JavaScript education:


    +   - See Appendix A, "Other JavaScript Resources," for a list of JavaScript books
    and Web pages with further information.

    - While the core JavaScript language is in place, be sure to follow the latest
    developments. The Web sites in Appendix A and this book''s site (www.javascript.com)
    will let you know when changes are on the way.

    - Be sure to spend some time practicing the JavaScript techniques you''ve learned
    throughout this book. You can use them to create much more complex applications
    than those you''ve worked with so far.


    # Future Web Technologies


    The Web has practically appeared out of nowhere over the course of a few years,
    and is continually changing. In the following sections, you will explore some
    of the upcoming—and already developed—technologies that will affect your pages
    and scripts.


    # Future Versions of JavaScript


    Since this is a book about JavaScript 1.5, you should be well aware that JavaScript
    has gone through several versions to reach its current status. Fortunately, the
    core language hasn''t changed much through these version changes, and nearly all
    scripts written for older versions will work on the latest version.


    The next version of JavaScript is likely to be version 2.0. No date has been announced
    for its specification. Netscape''s development team and the ECMA agency are working
    on it. Version 2.0''s main change will be the addition of true object-oriented
    features, such as classes and inheritance.


    As with previous versions, version 2.0 should be backward compatible with older
    versions. To be sure your scripts work under version 2.0, follow the standard
    language features and do not rely on any undocumented or browser-specific features.'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# Where Do We Go From Here?


    # Future DOM Versions


    Currently, the W3C DOM level 1 is an official specification, while level 2 is
    only a recommendation. Level 2 adds features such as event handling and better
    style sheet support, and is already partially supported by Netscape 6.0, and Internet
    Explorer 5.0 and later.


    In the future, expect better browser support for the DOM, and no compatibility
    issues between browsers. Future DOM versions will undoubtedly add more features,
    but no documentation yet exists for these versions.


    # XML (Extensible Markup Language)


    HTML was originally created as a language for the Web, and was based on an older
    standard for documentation SGML (Standard Generalized Markup Language.) HTML is
    a much-simplified version of SGML, specifically designed for Web documents.


    A relatively new language on the scene is XML (Extensible Markup Language). While
    XML is also a simplified version of SGML, it isn''t nearly as simple as HTML.
    While HTML has a specific purpose, XML can be used for virtually any purpose.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_350_0.png)


    > The W3C (World Web Consortium) developed XML, and has published a specification
    to standardize the language.


    Strictly speaking, XML isn''t a language in itself—there is no concise list of
    XML tags because XML has no set list of tags. Instead, XML allows you to create
    your own languages for whatever purpose you choose.


    So what is use for a language without any specific commands? Well, XML allows
    you to define languages for any purpose you choose. If you were writing recipes,
    for example, you could create tags for ingredients, ingredient quantities, and
    instructions.


    XML uses a DTD (Document Type Definition) to define the tags used in a particular
    document. The DTD can be in a separate file or built into the document, and specifies
    which tags are allowed, their attributes, and what they can contain.


    XML is already in use today. Although it isn''t directly supported by Web browsers,
    you can use a program on the server to parse XML documents into HTML documents
    before sending them to the browser.


    To return to the recipe example, an XML processor could convert each recipe into
    HTML. The reason for doing this is simple: By changing the rules in the parser,
    you'
  merge: -1
  pgno: 350
- img_proc: true
  md: 'could change the entire format of all the recipes—a difficult task to perform
    manually if you had thousands of recipes.


    # XSL (Extensible Stylesheet Language)


    XML documents focus strictly on the meaning of the tags—content—and ignore presentation.
    The presentation of XML can be determined by creating an XSL (Extensible Stylesheet
    Language) style sheet.


    XSL is based on XML, but specifies presentation—parameters such as font size,
    margins, and table formatting—for an XML document. When you use an XML processing
    program to create HTML output, it uses an XSL stylesheet to determine the HTML
    formatting of the output.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_351_0.png)


    > XSL documents are actually XML documents, using their own DTD stylesheet tags.
    XSL is a newer W3C specification.


    # Planning for the Future


    In the history of JavaScript, there has never been such a major change to the
    language that a great number of scripts written using the older version have stopped
    working. Nevertheless, many scripts have been crippled by new releases—chiefly
    those that used browser-specific features.


    The following sections offer some guidelines you can follow in writing scripts
    to ensure that the impact of future JavaScript versions and browser releases will
    be minimal.


    # Keeping Scripts Compatible


    Right now, dynamic HTML (HTML) is in use on many Web pages. The new W3C DOM standardizes
    the objects used for dynamic HTML, but it was not available when the majority
    of these pages were created. Thus, they use a number of techniques to offer the
    latest dynamic features:


    +   - Browser detection is used to separately support Netscape and Internet Explorer,
    or in some cases a specific browser is required.

    - Scripts are written to work around bugs in browsers, or sometimes even take
    advantage of them.

    - The process of writing scripts often involves trial and error rather than consulting
    official documentation.'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Where Do We Go from Here?


    While the W3C DOM will solve these issues when it is widely supported, there will
    always be brand new features that are not part of the official DOM specification
    and will be subject to change.


    There’s nothing wrong with using these features—but if you, you should be aware
    that you''re going to need to test the scripts on several different browsers.
    Additionally, if you''ve used non-standard features, you will eventually have
    to rewrite the scripts to use newer, standard features.


    # Staying HTML Compliant


    One trend as browsers advance tend to do a better job of following the W3C standard
    for HTML—and often, relying on it. This means that a page that uses completely
    standard HTML will likely work in future browsers, one that uses browser-specific
    features or workarounds is bound to have problems eventually.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_352_0.png)


    > In the first release of Netscape 6.0 received many complaints about "breaking"
    previously working pages. In most cases, the page used bad HTML, and previous
    browsers happened to handle the error gracefully.


    To avoid these problems, try to use completely valid HTML whenever possible. This
    means not only using standard tags and attributes, but following certain formatting
    rules: For example, always using opening and closing <p tags, and enclosing numbers
    for table widths and other parameters in quotation marks.


    To be sure your documents follow the HTML standard, see Appendix B, "Tools for
    JavaScript Developers," for suggested HTML validation programs and services. These
    will examine your document and point out any areas that do not comply with the
    HTML standard.


    # Document Everything


    Last but not least, be sure you understand everything your scripts are doing.
    Document your scripts using comments, and particularly document any statements
    that may look cryptic or were particularly hard to get working properly.


    If your scripts are properly documented, it will be a much easier process if you
    have to modify them to be compatible with a future browser, JavaScript, or DOM
    version.'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# Workshop: A Few JavaScript Tips


    Well, you''ve reached the end of 24-hour JavaScript education. Before you start
    madly scripting on your latest project, here are a few tips to keep in mind:


    First, avoid gratuitous use of JavaScript or its features. While you may get a
    kick out of watching your page''s title wiggle back and forth as your script manipulates
    it the DOM, does such a feature add value to your page?


    Next, be careful that your scripting doesn''t take away normal browser conveniences.
    As an example, you can display friendly descriptions on the status line when the
    user hovers over your links, doing this on links to external sites eliminates
    the browser''s display of the URL, which is a useful feature.


    Another common example is pages that create their own JavaScript window of a set
    size. While this is sophisticated, it takes away normal functionality of the Back
    and Forward buttons, and often the status line. these pages often look quite small
    and silly when I see them taking a tiny portion of my large monitor.


    Be sure you need it before using a brand-new JavaScript feature. While it may
    be flashy or even add value to your page, be aware that the latest features will
    be enjoyed by only those users who are using brand-new browsers, and new features
    often have unexpected bugs. If you do use new features, be sure to use browser
    checking to include them only when latest browsers are in use.


    Finally, make sure your page scale down gracefully. Test it with older browsers,
    and with non-JavaScript browsers. While users with these browsers may not be able
    to see your newest cosmetic improvements, make sure they can at least navigate
    your page and read its text.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_353_0.png)


    | One very scaled-down browser is Lynx, a text-based browser. To find out more
    about it and try it on your pages, see the Lynx Links at http://www.trill-home.com/lynx.html
    |


    # Summary


    In this hour, you''ve learned how the future of JavaScript and the Web may affect
    your Web pages and scripts, and learned some of the upcoming technologies that
    may change the way you work with the Web.'
  merge: -1
