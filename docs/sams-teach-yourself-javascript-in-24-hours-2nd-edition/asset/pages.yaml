  md: '# SAMS Teach Yourself JavaScript™ in 24 Hours SECOND EDITION


    # Get Started Now!

    24 proven one-hour lessons


    In just 24 lessons of one hour or less, you will be programming with JavaScript.
    Using a straightforward, step-by-step approach, each lesson builds upon the previous
    one, allowing you to learn the essentials of JavaScript from the ground up.


    # Learn how to...


    +   * Use JavaScript to build dynamic Web pages

    * Create rollovers and simple animations

    * Write scripts that work in both Microsoft® Internet Explorer and Netscape®

    * Use JavaScript to verify Web-based forms

    * Create a shopping cart script

    * Build your own JavaScript game

    * Control cascading style sheets with simple JavaScript

    * Create dynamic pages with layers

    * Debug JavaScript applications


    > Tips point out shortcuts and solutions


    > Notes clarify concepts and procedures in a straightforward manner


    > Cautions help you avoid common pitfalls


