  md: '# FIGURE 3.2


    A pop-up alert message created with JavaScript.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_55_0.png)


    For a more versatile display than an alert message, you can use JavaScript to
    create an entirely new browser window. You can choose how the window will be displayed—for
    example, its size, and whether it has a toolbar and location bar.


    Once you''ve created a new browser window, you can load a URL into it, or even
    create its content directly using JavaScript. You can also clear the contents
    of the normal browser window and display a new document in it. JavaScript can
    also work with frames, which allow you to divide a browser window into sections.


