  md: '# APPENDIX B


    # Tools for JavaScript Developers


    One of the best things about JavaScript is that it requires no specialized tools—all
    you need to start scripting is a Web browser and a simple text editor. Nonetheless,
    tools are available that will make scripting easier. Some of these are described
    in this appendix.


    # HTML and Text Editors


    While they aren''t specifically intended for scripting, a wide variety of HTML
    editors are available. These allow you to easily create Web documents, either
    by automating the process of entering tags, or by presenting you with an environment
    for directly creating styled text.


    # HomeSite


    HomeSite, from Allaire, is a full-featured HTML editor. It is similar to a text
    editor, but includes features to automatically add HTML tags, and to easily create
    complicated HTML elements such as tables.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_362_0.png)'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'HomeSite includes a number of JavaScript features, such as creating tags automati-
    and coloring script commands to make them easy to follow.


    A demo version of HomeSite is available for download from Allaire''s site:


    http://www.allaire.com/


    HomeSite also includes a basic version of TopStyle from Bradford, an editor for
    Cascading Style Sheets. You can find out more about TopStyle at their Web site:


    http://www.bradfordsoft.com/topstyle/


    # FrontPage


    Microsoft FrontPage is a popular WYSIWYG (what you see is what you get) HTML editor
