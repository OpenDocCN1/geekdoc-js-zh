  md: '# Combining Tasks with Functions


    In the basic scripts you''ve examined so far, you''ve seen many JavaScriptStatements
    that have a section in parentheses, like this:


    document.write("Testing.");


    This is an example of a *function*. Functions provide a simple way to handle a
    task, as adding output to a Web page. JavaScript includes a wide variety of built-in
    functions, which you will learn about throughout this book. A statement that uses
    a function, as in the example above, is referred to as a *function call*


    Functions take parameters (the expression inside the parentheses) to tell them
    what to do. Additionally, a function can return a value to a waiting variable.
    For example, the following function call prompts the user for a response and stores
    it in the text variable:


    text = prompt("Enter some text.");


    You can also create your own functions. This is useful for two main reasons: First,
    you separate logical portions of your script to make it easier to understand.
    Second, and more importantly, you can use the function several times or with different
    data to avoid repeating script statements.


    You will learn how to define, call, and return values from your own functions
    in Hour 5, "Using Variables and Functions."


    ![](img/253d3bf9d2a81ee62f8085998b463a44_67_0.png)


    # Understanding Objects


    In Hour 2,"Creating a Simple Script," you learned that objects are containers
    that store a number, a string of text, or another value. JavaScript also supports
    objects. Like variables, objects can store data—but they can store two or more
    pieces of data at once.


    The items of data stored in an object are called the *properties* of the object.
    As an example, you can use objects to store information about a person as an address
    book. The properties of each person object might include a name, address, and
    other information.


    JavaScript uses variables to store object names and property names. For example,
    for a person object called Bob, the properties might include Bob.address and Bob.phone.


    Objects can also include *methods*. These are functions that work with the object''s
    data. For example, our person object for the address book might include a `display()`
    method to display the person''s information. In JavaScript terminology, the statement
    `Bob.display()` would display Bob''s details.'
  merge: -1
