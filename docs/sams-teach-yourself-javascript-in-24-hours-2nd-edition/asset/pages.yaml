  md: 'To make programming the navigation bar easier, choose simple, meaningful names
    for the subpages. Construct their names based on the value of the selection lists.
    Assign a one-letter code to each product: w for the word processor, s for the
    spreadsheet, and d for the database. Then follow that with an underscore and a
    word indicating the type of information.


    Here are the categories of information and their corresponding codes:


    +   - tech—Technical support for the product

    - sales—Sales and availability information

    - feat—A list of features

    - price—Pricing for the product

    - tips—Tips for getting the most out of the spreadsheet program


    For example, s_feat.html is the features list for the spreadsheet program. Meaningful
    names like this make it easier to maintain HTML pages. When you''re automating
    JavaScript, they can make a big difference.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_319_0.png)


    > To try this yourself, you''ll need all the individual HTML files. You can download
    them from this book''s Web site at http://www.javascriptworkshop.com/


    # Creating the Data Structures and HTML


    Before you write the function to navigate the pages, you need to store the needed
    data. In this case, you need to store the three codes for the software products
    and the five codes for the types of pages. You could create an array for each
    list, but that isn''t necessary in this case.


    Rather than creating an array, you can simply place the information in the HTML
    page itself and it will be stored in the properties of the form object by the
    JavaScript interpreter. You will use the codes as the VALUE attribute of each
    option.


    You will need to define an HTML selection list for each of the lists of information.
    In addition, the user needs a way to visit the page after selecting it. You can
    do this with a Go button next to the drop-down lists.


    Listing 22.2 shows the HTML to add to the main page. You''ll include it toward
    the end of the page, but it''s generally self-contained and could be placed anywhere.'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# Improving the Web Page with JavaScript


    # **Listing 22.2** The HTML to Define the Table of Contents


    ```

    1: <form name="navform">

    2: <select name="program">

    3: <option VALUE="x">SELECTED>Select Product

    4: <option VALUE="w">Fictional Word Processor

    5: <option VALUE="s">Fictional Spreadsheet

    6: <option VALUE="d">Fictional Database

    7: </select>

    8: <select name="category">

    9: <option VALUE="x">SELECTED>Select a Category

    10: <option VALUE="tech">Technical Support

    11: <option VALUE="sales">Sales and Availability

    12: <option VALUE="feat">List of Features

    13: <option VALUE="price">Pricing Information

    14: <option VALUE="tips">Tips and Techniques

    15: </select>

    16: <input TYPE="button" NAME="go" VALUE="Go to Page

    17: onclick="Navigate();"

    18: </form>

    ```


    In addition to the categories discussed, there''s an additional option with the
    value x in each selection list. These are the default options and display instructions
    until another selection is made. Selecting the Go button while one of these options
    is selected does nothing.


    # **Creating the Function for the Navigation Bar


    You defined an onClick event handler for the Go button, which calls the Navigate()
    function. Next, you need to create this function. It will read the current value
    of both selection lists, construct a filename, and then load that file into the
    browser.


    Listing 22.3 shows the Navigate() function. Next you will look at the features
    of this function in detail.


    # **Listing 22.3** The Function for Navigating Based on the Selection Lists


    ```

    1: function Navigate() {

    2: prod = document.navform.program.selectedIndex;

    3: cat = document.navform.category.selectedIndex;

    4: prodval = document.navform.program.options[prod].value;

    5: catval = document.navform.category.options[cat].value;

    6: if (prodval == "x" || catval == "x") return;

    7: window.location = prodval + ''_'' + catval + ".html";

    8: }

    ```


    ![](img/253d3bf9d2a81ee62f8085998b463a44_320_0.png)'
  merge: -1
  pgno: 320
- img_proc: true
  md: 'To begin, this function sets two variables—prod and cat—to hold the currently
    selected index for each selection list. Next, prodval and catval are assigned
    to the corresponding value properties.


    The if statement checks both lists for the x value, meaning that the user hasn''t
    selected an item. If no value has been selected in either list, it returns without
    doing any-thing.


    Finally, the new document filename is constructed by concatenating the two codes,
    the underscore (_), and the html suffix. This value is assigned to the window.location
    prop-erty, which causes the new page to be loaded.


    > Because changing the location property loads the new document, you can''t do
    anything in the current JavaScript program. In fact, the Navigate() function never
    returns. However, you could include JavaScript functions on the next page.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_321_0.png)


    # # Adding Link Descriptions


    Some users will undoubtedly prefer traditional hyperlinks to the navigation bar.
    To make these links more friendly, you can display descriptions of them on the
    status line when the user moves the mouse pointer over them.


    You can accomplish this easily with onmouseover handlers. When the user moves
    the mouse over a link, this event will call a function to display the appropriate
    message on the status line. For example, the HTML defines a link with a friendly
    status line:


    ```

    <a href="order.html"

    onmouseover="window.status=''Allows you to order products'';return true;"

    onmouseout="window.status='''';"></a>

    ```


    This sets the value of window.status to display the message. In addition, the
    true value is returned; this is necessary to override the normal action (displaying
    the URL) for the status line. The onmouseout handler clears the status line when
    the mouse pointer moves off the link.


    > You learned the basics of window objects, including the window.status object,
    in Hour 10, "Working with the Document Object Model." Event handlers are described
    in Hour 12, "Responding to Events."


    ![](img/253d3bf9d2a81ee62f8085998b463a44_321_1.png)'
  merge: -1
  pgno: 321
