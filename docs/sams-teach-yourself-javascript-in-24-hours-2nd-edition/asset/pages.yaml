    you learned throughout this book to create complete JavaScript applications.


    # Q&A


    +   - Can I force the browser to download a plug-in automatically to support document?


    +   - No, although a future version of Netscape may support this feature, and
    Internet Explorer provides an option to allow the download of plug-ins on demand.
    If the user does download and install the plug-in, you can use the navigator plugins.reload
    method to refresh the list of plug-ins.'
