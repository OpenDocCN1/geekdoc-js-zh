  md: '# History of the DOM


    Starting with the introduction of JavaScript 1.0 in Netscape, JavaScript has included
    objects to represent parts of a Web document and other browser features. However,
    there was never a true standard. While both Netscape Navigator and Microsoft Internet
    Explorer included many of the same objects, there was no guarantee that the same
    objects would work the same way in both browsers, let alone in less common browsers.


    The bad news is that there are still differences between the browsers—but here’s
    the good news. First of all, since the release of Netscape 3.0 and Internet Explorer
    4.0, all of the basic objects (those covered in this chapter) are supported in
    the same way in both browsers.


    More importantly, the W3C (World Wide Web Consortium) has recently developed the
    DOM standard. This standard defines not only basic objects, but an entire set
    of objects that encompass all parts of an HTML document, and can even support
    XML (Extensible Markup Language) documents.


    The DOM standard has been partially adopted by the Netscape and Internet Explorer
    4.0 browsers, and Internet Explorer 5.0 and Netscape 6.0 are moving even closer
    to true cross-browser standardization.


    While all of this standardization doesn’t change how the objects described in
    this hour work, you’ll be thankful for it as you move into the advanced features
    of the DOM later in this book.


    > The basic object hierarchy described in this hour is informally referred to
    as DOM level 0. DOM 1 and DOM 2 are the standards released by the W3C, which incorporate
    most of the basic DOM 0 objects. You''ll learn more about the advanced features
    of the DOM in Part V of this book.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_148_0.png)


    # Using window Objects


    At the top of the browser object hierarchy is the window object, which represents
    a browser window. You’ve already used a few methods and properties of the window
    object:


    +   * You used the window.status property to change the contents of the browser’s
    status line.

    * The window.alert, window.confirm, and window.prompt methods display message
    dialogs to the user.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'There can be several window objects at a time, each representing an open browser
    window. Frames are also represented by window objects. You''ll learn more about
    windows and frames in Hour 13, "Using Windows and Frames.",


    Layers, which allow you to include, modify, and position dynamic content within
    a Web document, are also similar to window objects. These are explained in Hour
    18, "Creating Dynamic Pages.",


    # Working with Web Documents


    The document object represents a Web document, or page. Web documents are displayed
    within browser windows, so it shouldn''t surprise you to learn that the document
    object is a child of the window object.


    Because the window object always represents the current window (the one containing
    the script), you can use `window.document` to refer to the current document. You
    can also simply refer to document, which automatically refers to the current window.


    You''ve already used the `document.write` method to display text within a Web
    document. The examples in earlier hours only used a single window and document,
    so it was unnecessary to use `window.document.write`but this longer syntax would
    have worked equally well.


    If multiple windows or frames are in use, there might be several window objects,
    each with its own document object. To use one of these document objects, you use
    the name of the window and the name of the document.


    In the following sections, you will look at some of the properties and methods
    of the document object that will be useful in your scripting.


    # Getting Information About the Document


    Several properties of the document object include information about the current
    document in general:


    +   * The `URL` property specifies the document''s URL. This is a simple text
    field. You can''t change this property. If you need to send the user to a different
    location, use the `window.location` object, described later in this hour.'
  merge: -1
