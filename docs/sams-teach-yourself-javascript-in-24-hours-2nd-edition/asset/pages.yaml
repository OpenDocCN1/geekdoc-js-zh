    This uses the Math.random method, which results in a number between 0 and 1. The
    number is multiplied and incremented to result in a number between 1 and 100.


    This statement does produce a number between 1 and 100, but not an integer. To
    fix the problem, you can add the Math.floor method to chop off the decimal portion
