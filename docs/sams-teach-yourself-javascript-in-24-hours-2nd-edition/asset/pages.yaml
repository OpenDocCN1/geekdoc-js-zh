  md: '# Setting Date Values


    A variety of set methods enable you to set components of a Date object to values:


    +   - setDate() sets the day of the month.

    - setMonth() sets the month. JavaScript sets the months from 0 to 11, starting
    with January (0).

    - setFullYear() sets the year.

    - setTime() sets the time (and the date) by specifying the number of milliseconds
    since January 1st, 1970.

    - setHours(), setMinutes(), and setSeconds() set the time.


    As an example, the following statement sets the year of a Date object called holiday
    to 2000:


    ```

    holiday.setYear(2000);

    ```


    # Getting Date Values


    You can use the get methods to get values from a Date object. This is the only
    way to obtain these values, because they are not available as properties. Here
    are the available get methods for dates:


    +   - getDate() gets the day of the month.

    - getMonth() gets the month.

    - getFullYear() gets the year.

    - getTime() gets the time (and the date) as the number of milliseconds since January
    1st, 1970.

    - getHours(), getMinutes(), and getSeconds() get the time.


    > Along with setFullYear and getFullYear, which require 4-digit years, JavaScript
    includes setYear and getYear, which use two-digit year values. You should always
    use the four-digit version to avoid Year 2000 issues.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_139_0.png)


    # Working with Time Zones


    Finally, a few functions are available to help your Date objects work with local
    time values and time zones:'
