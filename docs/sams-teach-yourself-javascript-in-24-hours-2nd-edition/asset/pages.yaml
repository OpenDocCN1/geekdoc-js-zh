- img_proc: true
  md: "# Using Objects to Simplify Scripting\n\nAlthough JavaScript variables and\
    \ arrays are versatile to store data, sometimes you need a more complicated structure.\
    \ For example, suppose you are creating a script to work with a business card\
    \ database that contains names, addresses, and phone numbers for a variety of\
    \ people.\n\nIf you were using regular variables, you would need several separate\
    \ variables for each person in the database: a name variable, an address variable,\
    \ and so on. This would be very confusing.\n\nArrays would improve things slightly.\
    \ You could have a names array, an addresses array, and a phone number array.\
    \ Each person in the database would have an entry in each array. This would be\
    \ more convenient, but still not perfect.\n\nWith objects, you can make the variables\
    \ that store the database as logical as business cards. Each card is represented\
    \ by a Card object, which has properties for name, address, and phone number.\
    \ You can even add methods to the object to display or work with the information.\n\
    \nIn the following sections, you'll use JavaScript to create the Card object and\
    \ its properties and methods. Later in this hour, you'll use the Card object in\
    \ a script to display information for several members of the database.\n\n# Defining\
    \ an Object\n\nThe first step in creating an object is to name it and its properties.\
    \ We've already decided to call the object a Card object. Each object will have\
    \ the following properties:\n\n+   - name\n- address\n- workphone\n- homephone\n\
    \nThe first step in using this object in a JavaScript program is to create a function\
    \ to create new Card objects. This function is called the constructor for an object.\
    \ Here is the constructor function for the Card object:\n\n```\nfunction Card(name,address,work,home)\
    \ {\n  this.name = name;\n  this.address = address;\n  this.workphone = work;\n\
    \  this.homephone = home;\n}\n```"
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Creating Custom Objects


    The constructor is a simple function that accepts parameters to initialize a new
    object and assign them to the corresponding properties. This function accepts
    several parameters from the statement that calls the function, and then assigns
    them as properties of an object. Because the function is called Card, the object
    is the Card object.


    Notice this keyword. You''ll use it anytime you create an object definition. Use
    this to refer to the current object—the one that is being created by the function.


    # Defining an Object Method


    Next, you will create a method to work with the Card object. Because all Card
    objects will have the same properties, it might be handy to have a function that
    prints out the properties in a new format. Let''s call this function PrintCard.


    Your PrintCard will be used as a method for Card objects, so you don''t need to
    ask for parameters. Instead, use this keyword again to refer to the current object''s
    properties. Here is a function definition for the PrintCard() function:


    ```

    function PrintCard() {

    line1 = ''Name: '' + this.name + ''<br>'';

    line2 = ''Address: '' + this.address + ''<br>'';

    line3 = ''Work Phone: '' + this.workphone + ''<br>'';

    line4 = ''Home Phone: '' + this.homephone + ''<br>'';

    document.write(line1, line2, line3, line4);

    }

    ```


    This function simply reads the properties from the current object (this), prints
    each one with a caption, and skips to a new line.


    You now have a function that prints a Card, but it isn''t officially a method
    of the Card object. The last thing you need to do is make PrintCard part of the
    function definition for Card objects. Here is the modified function definition:


    ```

    function Card(name,address,work,home) {

    this.name = name;

    this.address = address;

    this.workphone = work;

    this.homephone = home;

    this.PrintCard = PrintCard;

    }

    ```


    The added statement looks just like another property definition, but it refers
    to the PrintCard function. This will work so long as the PrintCard function is
    defined with its own function definition.'
  merge: -1
