    window. JavaScript can work with layers to create some truly amazing effects.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_55_2.png)


    > You''ll learn about layers and Dynamic HTML in Hour 18, "Creating Dynamic Pages
    with the DOM."


    # Graphics and Animation


    One thing that separates an exciting, well-designed Web page from a boring one
    is the use of graphics. While you won''t learn how to create graphics in this
    book, you will learn how JavaScript can work with graphics.


