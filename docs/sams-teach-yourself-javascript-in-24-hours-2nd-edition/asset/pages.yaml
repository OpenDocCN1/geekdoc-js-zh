  md: 'Comments allow you to include documentation within your script. This will be
    useful if someone tries to understand the script, or even if you try to understand
    it after a long break. To include comments in a JavaScript program, begin a line
    with two slashes, as in this example:


    ```

    //this is a comment.

    ```


    You can also begin a comment in the middle of a line, which is useful for documenting
    a script. For example:


    ```

    a = a + 1; // add one to the value of a

    ```


    JavaScript also supports C-style comments, which begin with /* and end with /.
    These comments can extend across more than one line, as the following example
    demonstrates.


    ```

    /*This script includes a variety of features, including this comment. */

    ```


    ![](img/253d3bf9d2a81ee62f8085998b463a44_71_0.png)


    > Since these comments are part of JavaScript syntax, they are only valid inside
    <script> tags.


    # Summary


    During this hour, you''ve learned some of the basics of JavaScript programming
    and syntax: functions, the basics of objects, and event handlers. You also learned
    how to use JavaScript comments to make your script easier to read.


    You have now reached the end of Part I of this book and should have a good grasp
    of the fundamentals of JavaScript. In the next few hours, you will learn the specifics
    of JavaScript programming using various features, and will create a variety of
    entertaining and useful example scripts.


    # Q&A


    +   I''ve heard the term “object-oriented” applied to languages such as C and
    Java. If JavaScript supports objects, is it an object-oriented language?


    +   Yes, although it might not fit some people''s strict definitions. JavaScript
    objects do not support all of the features that languages such as C and Java support.'
