  md: "# Working with Multimedia and Plug-Ins\n\n# Embedding the Sounds\n\nFor this\
    \ example, I created sound files in WAV format for each of the 13 notes in a single\
    \ octave of a piano keyboard. Each file is named after the note it contains. Your\
    \ HTML document will need to include these sounds using the <embed> tag.\n\nNormally,\
    \ when you embed a sound, it plays as soon as the page loads. You don't want all\
    \ 13 notes to play at once (that wouldn't work anyway), so use the AUTOSTART=false\
    \ parameter\n\nAlso include the HIDDEN=true parameter to prevent the browser from\
    \ displaying little control panels for each of the sounds. The <embed> tag for\
    \ a single note (the bottom C) would look like:\n\n```\n<embed SRC=\"@C.wav\"\
    \ HIDDEN=true AUTOSTART=false>\n```\n\nBecause the HTML document will include\
    \ a tag like this for each sound, the 13 sounds will be loaded (but not played)\
    \ immediately. This will prevent the browser from having to communicate with the\
    \ server to load a file each time you click a piano key.\n\n# Displaying the Keyboard\n\
    \nFor the keyboard display, I created two GIF graphics: a white key and a black\
    \ key. The HTML document simply needs to include whitekey.gif and blackkey.gif\
    \ in the right combination to display the 13 keys.\n\nFor a better-looking keyboard,\
    \ you could use an image map. The script sticks to linked graphics for simplicity;\
    \ the script in this hour's workshop visits this book's Web site for a fancy version.\
    \ Here's the HTML link for a single piano key:\n\n```\n<a href=\"#\" onclick=\"\
    playnote();\"><img border=0 SRC=\"whitekey.gif\" ALIGN=TOP></a>\n```\n\nThis displays\
    \ the white graphic. It is linked with \"# as a target (which will prevent the\
    \ browser from loading a different page), and the onclick event handler runs a\
    \ JavaScript function to play the note.\n\n# Playing the Sounds\n\nThe playnote\
    \ function handles the playing of the appropriate sound. It accepts a parameter\
    \ (a number from 0 to 11 representing one of the embedded sounds) and uses the\
    \ play method to play the sound. Here's the function:\n\n```\nfunction playnote(note)\
    \ {\n  document.embeds[note].play();\n}\n```\n\n![](img/253d3bf9d2a81ee62f8085998b463a44_292_0.png)"
