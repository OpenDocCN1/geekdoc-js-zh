  md: '# Accessing Browser History


    The history object is another child (property) of the window object. This object
    holds information about the URLs that have been visited before and after the current
    one, and it includes methods to go to previous or next locations.


    The history object has three properties:


    +   - history.length keeps track of the length of the history list—in other words,
    the number of different locations that the user has visited.

    - history.current contains the value of the current history entry—the URL of the
    page that the user is currently staring at.

    - history.next is the value of the next entry in the history list—the URL the
    user will be sent to if they press the browser''s Forward button. Because the
    Forward button only works when you''ve already used the Back button, there may
    not always be a value for history.next.

    - history.previous is the previous history entry—the URL the user will be sent
    to if they use the browser''s Back button.


    You can also treat the history object as an array. Each entry contains one of
    the URLs in the history list, with history[0] being the current entry. But not
    least, the history object has three methods:


    +   - history.go opens a URL from the history list. To use this method, specify
    a positive or negative number in parentheses. For example, history.go(-2) is equivalent
    to pressing the Back twice.

    - history.back loads the previous URL in the history list—equivalent to pressing
    the Back button.

    - history.forward loads the next URL in the history list, if available. This is
    equivalent to pressing the Forward button.


    You''ll use these methods in the Workshop at the end of this hour.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_153_0.png)


    > The history.back and history.forward methods don''t work correctly in older
    versions of Netscape Navigator. For this reason, you might want to use history.go(-1)
    and history.go(1) instead.'
  merge: -1
  pgno: 153
