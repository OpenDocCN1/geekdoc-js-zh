    # Dealing with Old Browsers


    While the new DOM makes it easy to manipulate styles, positions, and even portions
    of a document themselves, you should be aware that these features are only standardized
    and supported in Internet Explorer 5.0 and Netscape 6.0 and later.


    Furthermore, since the DOM features are new, you may run into differences in the
    ways browsers implement these features. You should test any DOM-dependent scripts
    on both the latest Netscape and Internet Explorer browsers before publishing it.


    Equally important, you should be aware that many users are using older browsers
    and will be for some time. Since Netscape 4.0 and Internet Explorer 4.0 support
    many of these features, although in non-standard ways, you can use browser detection
    to support these browsers as well as newer DOM-compliant browsers.


    > You learned the techniques used in browser detection in Hour 16, "Creating Cross-Browser
    Scripts."


