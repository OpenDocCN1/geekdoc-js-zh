- img_proc: true
  md: '# Finding and Handling Errors


    Here’s a summary of how this script should work:


    +   - Line 5 picks a random number and stores it in the num variable.

    - The guess function in lines 7–23 is called each time the user enters a guess.

    - Within the guess function, several if statements test the user''s guess. If
    it is incorrect, a hint is displayed in the text box. If the guess is correct,
    the script displays an alert message to congratulate the user.


    # Testing the Program


    To test this program, load the HTML document into your browser. It appears to
    load correctly and does not immediately cause any errors. However, when you enter
    a guess and press the Guess button, a JavaScript error occurs.


    According to Netscape’s JavaScript Console, the error message is this:


    guess is not a function.


    # Fixing the Error


    As the error message indicates, there must be something wrong with the function
    call to the guess function. This might happen if the names of the function definition
    and the function call didn’t match, but they do in this case.


    Upon further examination, you’ll notice that the first two lines of the function
    are as follows:


    ```

    function guess() {

    var guess = document.form1.guess1.value;

    ```


    Although this looks correct at first glance, there’s a problem: the function and
    the variable definition use the same name, guess. As a result, the variable definition
    overwrites the function. Thus, when the event handler tries to call the function,
    it finds a variable called guess instead, as the error message reported, guess
    is not a function.


    This is easy to fix. Simply change the name of the function from guess to a unique
    name, guessit. Make the same change in both the function definition (line 7) and
    the event handler (line 36).


    # Testing the Script Again


    Now that you’ve fixed the error, try the script again. This it loads without an
    error, and you can enter a guess without an error. The hints about guessing higher
    or lower are even displayed correctly.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_310_0.png)'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'However, to truly test the script, you''ll need to play the game all the way
    through. When you do, you''ll discover that there''s still another problem in
    the script: You can''t win, no matter how hard you try.


    After your 10 guesses are up, an alert message informs you that you''ve lost the
    game. Coincidentally, this alert message also tells you what''s wrong with the
    script. Figure 21.3 shows how the browser window looks after a complete game,
