    # # Calculating the Score


    Last but not, the Addscore function calculates the score for the current poker
    hand. The score is one of the following values, loosely based on the odds of different
    hands:


    +   - One pair (Jacks or better): 1 point

    - Two pair: 2 points

    - Three of a kind: 3 points

    - Straight: 4 points

    - Flush: 5 points

    - Full house: 10 points

    - Four of a kind: 25 points

    - Straight flush: 50 points

    - Royal flush: 100 points


