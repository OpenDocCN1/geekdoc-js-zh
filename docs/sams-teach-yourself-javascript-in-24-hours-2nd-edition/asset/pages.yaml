  md: '# Summary


    During this hour, you wrote a simple JavaScript program and tested it using a
    browser. You learned the tools you needed to work with JavaScript—basically, an
    editor and a browser. You also learned how to modify and test scripts, and what
    happens when a JavaScript program runs into an error. Finally, you learned how
