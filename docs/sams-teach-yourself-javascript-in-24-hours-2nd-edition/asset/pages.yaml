  md: '# HOUR 4


    # How JavaScript Programs Work


    Welcome to the end of Part I of this book. In the first three hours, you''ve learned
    what JavaScript is, created a simple script, and learned the variety of things
    JavaScript can do.


    In this, the final hour of Part I, you''ll learn a few basic concepts and script
    components that you''ll use in just about every script you write. This will prepare
    you for the remaining hours of the book, in which you''ll explore specific JavaScript
    functions and features.


    Hour 4 covers the following topics:


    +   - Organizing scripts using functions

    - What objects are and how JavaScript uses them

    - How JavaScript can respond to events

    - How browsers execute scripts in the proper order

    - Adding comments to clarify your JavaScript code


    ![](img/253d3bf9d2a81ee62f8085998b463a44_66_0.png)'
