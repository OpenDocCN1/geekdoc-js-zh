    \n> For the most part, the variables you've used in earlier hours of this book\
    \ have been global.\n\nA local variable belongs to a particular function. Any\
    \ variable you declare (or use for the first time) in a function is a local variable.\
    \ For example, the variables in the function's parameter list are local variables.\n\
