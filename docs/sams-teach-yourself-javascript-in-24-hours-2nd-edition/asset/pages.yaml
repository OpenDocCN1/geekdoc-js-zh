  md: "# Reading Browser Information\n\n+   - Making a page browser-specific\n- Dealing\
    \ with browsers without JavaScript\n- Creating a script for multiple browser support\n\
    \nIn Hour 10, \"Working with the Document Object Model,\" you learned the various\
    \ objects (such as window and document) that represent properties of the browser\
    \ window and the current Web document. JavaScript also includes an object called\
