  md: '# Using Graphics and Animation


    ```

    <h1>Animation in JavaScript</h1>

    <br>

    <center>

    <img src="mouse0.gif" width=100 height=100 alt="" border="">

    <img src="mouse1.gif" width=100 height=100 alt="" border="">

    <img src="mouse2.gif" width=100 height=100 alt="" border="">

    <img src="mouse3.gif" width=100 height=100 alt="" border="">

    <img src="mouse4.gif" width=100 height=100 alt="" border="">

    </center>

    ```


    At this point, all of the five images on the page are displaying the mouse0.gif
    image and are therefore invisible. Because they are the first images on the page,
    the script will be able to access them as images[] through images[4].


    # Figure 15.3


    The eight images for the mouse animation.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_224_0.png)


    # Defining the Variables


    To begin the actual script, define some global variables. Here is the beginning
    of the script:


    ```

    var cbox=0;

    var nbox=1;

    var cimage=0;

    var nimage=0;

    ```


    The cimage variable will store a value from 0 to 4, indicating which of the five
    images the mouse is currently running through. Part of the mouse may protrude
    into the next image, so use the nbox variable to store the position of the right
    half of the mouse, if required.


    The cimage variable will store the value of the image (from 1 to 8) to be stored
    in the current box. Similarly, nimage will store the value of the image for the
    part of the mouse that protrudes into the next box, if needed.


    # Stepping Through the Animation


    Next, create the actual animation. You''ll use a function called next to move
    the mouse to its next position, and use the setTimeout method to call this function
    regularly.'
