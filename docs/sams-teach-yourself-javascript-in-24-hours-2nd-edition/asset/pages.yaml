  md: '# Introduction


    The World Wide Web began as a simple repository for information, but it has grown
    into much more—it entertains, teaches, advertises, and communicates. As the Web
    has evolved, the tools have also evolved. Simple markup tools such as HTML have
    been joined by true programming languages—including JavaScript.


    Now don''t let the word "programming" scare you. For many, the term conjures images
    of long nights staring at the screen, trying to remember which sequence of punctuation
    marks will produce the effect you need. (Don''t get me wrong. Some of us enjoy
    that sort of.)


    Although JavaScript programming, it''s a very simple language. As a matter of
    fact, if you haven''t programmed before, it makes a great introduction to programming.
    It requires very little knowledge to start programming with JavaScript—you’ll
    write your first program in Hour 2, "Creating a Simple Script."


    If you can create a Web page with HTML, you can easily use JavaScript to improve
    a page. JavaScript programs can run from a single line to a full-scale application.
    In this book, you''ll start with simple scripts, and proceed to complex applications,
    such as a card game.


    If you''ve spent time developing pages for the Web, you know that the Web is constantly
    changing, and it can be hard to keep up with the latest languages and tools. This
    book will help you add JavaScript to your Web development toolbox, and I think
    you''ll enjoy learning it.


    I really had fun writing this book—and believe it or not, writing isn''t always
    fun. I hope you''ll have as much fun as you experiment with JavaScript and its
    capabilities.


    # How to Use This Book


    This book is divided into 24 lessons. Each covers a single JavaScript topic, and
    should take about an hour to complete. The lessons start with the basics of JavaScript,
    and continue with more advanced topics. You can study an hour a day, or whatever
    pace suits you. (If you choose to forego sleep and do your studying in a single
    24-hour period, you may have what it it takes to be a computer book author.)'
  merge: -1
  pgno: 22
- img_proc: true
