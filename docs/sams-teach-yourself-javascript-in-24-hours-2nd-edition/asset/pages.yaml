    The navigator object isn't part of the DOM, so you can refer to it directly. It\
    \ includes a number of properties, each of which tells you something about the\
    \ browser. Include the following:\n\n+   - navigator.appName is the browser's\
    \ internal code name, usually Mozilla Explorer.\n- navigator.appName is the browser's\
    \ name, usually Netscape or Microsoft Internet Explorer.\n- navigator.appVersion\
    \ is the version of Netscape being used—for example, 4.0(Win95).\n- navigator.userAgent\
