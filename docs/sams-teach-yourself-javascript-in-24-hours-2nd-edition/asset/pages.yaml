    # Using Conditional Expressions


    In addition to the if statement, JavaScript provides a shorthand type of conditional
    expression that you can use to make quick decisions. This uses a peculiar of syntax,
    which is also found in other languages, such as C. A conditional expression looks
    like this:


    ```

    variable = (condition) ? (true action) : (false action);

    ```


    This assigns one of two values to the variable: one if the condition is true,
    and another if it is false. Here is an example of a conditional expression:


    ```

    value = (a == 1) ? 1 : ;

    ```


    This statement may look confusing, but it is equivalent to the following if statement:


    ```

    if (a == 1)

    value = 1;

    elelse

    value = 0;

    ```


    In other words, the value after the question mark (?) will be used if the condition
    is true, and the value after the colon (:) will be used if the condition is false.
    The colon represents the else part of this statement, and the else part of if
    statement, is optional.


    Shorthand expressions can be used anywhere JavaScript expects a value. They provide
    an easy way to make simple decisions about values. As an example, here''s an easy
    way to display a grammatically correct message about the counter variable:


    ```

    document.write(''Found '' + counter + ((counter == 1) ? " word." : " words."));

    ```


