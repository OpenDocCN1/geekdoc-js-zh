  md: 'An additional logical operator is the And operator, &&. Consider this statement:

    if (phone == "" && email == "") window.alert("Both are Missing!");

    This statement uses && (And) instead of || (Or), so the error message will only
    be dis-

    played if the email address and phone number variables are blank. (In this particular

    case, or is a better choice).


    If the JavaScript interpreter discovers the answer to a conditional expression
    reaching the end, it does not evaluate the rest of the condition. For

    ample, if the first of two conditions separated by && operator is false, the

    second is not evaluated. You can take advantage of this to improve thenspeed of
    your scripts.


    The third logical operator is the exclamation mark (!), which means Not. It can
    be used

    to invert an expression—in other words, a true expression would become false,
    and a

    false would become true. For example, here''s a statement that the Not operator:

    if (phone != "") alert("phone is OK!");


    In this case, the Not operator is used as part of the not-equal operator, !=.
    This operator

    inverts the condition, so the action of the statement is executed only if the
    phone num-ber variable is not blank.


    The logical operators are powerful, but it''s easy to accidentally create annimimpossible
    condition with them. For example, the condition (a < 10 && a &

    20) might look correct at first glance. However, if you read it out loud, you

    get "a is less than 10 and a is greater than 20"—an impossibility in ournuniverse.
    In this case, or (||) should have been used.


    # The else Keyword


    An additional feature of the if statement is the else keyword. Much like its English

    eivalent, it tells the JavaScript interpreter what to do if the condition isn''t
    true.

    Listing 7.2 shows a simple example of the keyword in action.


    # LISTING 7.2 An Example Using the if and else Keywords


    ```

    1: if (a == 1) {

    2:   alert(''Found a 1!'');

    3:   a = 0;

    ```'
