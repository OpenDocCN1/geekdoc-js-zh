  md: "# Q&A\n\nQ Can I avoid assigning an ID attribute to every DOM object I want\
    \ to handle with a script?\n\nA Yes. While the scripts in this hour typically\
    \ use the ID attribute for convenience, you can actually locate any object in\
    \ the page by using combinations of node properties such as firstChild and nextSibling.\n\
    \nQ Can I include HTML, such as <b> tags, in the new text I assign to a text node?\n\
    \nA No, text nodes are limited to text. To assign more complex HTML to a node,\
    \ you need to remove the existing node and replace it with a new one.\n\nQ Is\
    \ there a reference that specifies which DOM properties and methods work in which\
    \ browser versions?\n\nA Yes, several Web sites are available that keep up-to-date\
    \ lists of browser features. Some of these are listed in Appendix A, \"Other JavaScript\
    \ Resources.\"\n\n# Quiz\n\nTest your knowledge of JavaScript's advanced DOM features\
    \ by answering the following questions.\n\n# Questions\n\n+   1. If para1 is the\
    \ DOM object for a paragraph, what is the correct syntax to change the text within\
    \ the paragraph to \"New Text\":\n  a. para1.value=\"New Text\"\n  b. para1.firstChild.nodeValue=\"\
    New Text\"\n  c. para1.nodeValue=\"New Text\"\n\n+   2. Which of the following\
    \ DOM objects never has a parent node?\n  a. body\n  b. div\n  c. document\n\n\
    +   3. Which of the following is the correct syntax to get the DOM object for\
    \ a heading with the identifier head1?\n  a. document.getElementById(\"head1\"\
    )\n  b. document.GetElementByID(\"head1\")\n  c. document.getElementsById(\"head1\"\
    )"
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Using Advanced DOM Features


    # Answers


    +   1. b. The actual text is the nodeValue attribute of the text node, which is
    a child of the paragraph node.


    +   2. c. The document object is the root of the DOM object tree, and has no parent
    object.


    +   3. a. getElementById has a lowercase "g" at the beginning, and a lowercase
    "d" at the end, contrary to what you might know about normal English grammar.


