  md: '# Creating Dynamic Pages with the DOM


    +   - relative defines an item that is offset a certain amount from the static
    position, where the element would normally have been laid out within the HTML
    page.


    +   - left and top position offsets for the position of the item. For absolute
    positioning, this is relative to the main browser window or a containing item.
    For relative positioning, it''s relative to the usual static position.


    +   - width and height are similar to the standard HTML WIDTH and HEIGHT attributes
    and specify a width and height for the item.


    +   - clip specifies the clipping rectangle for an item. Only the portion of the
    item inside this rectangle is displayed.


    +   - overflow indicates whether the clipping cuts off the item or a scroll bar
    allows viewing the rest of the item. Values include none, clip, and scroll.


    +   - z-index specifies how items overlap. Normally indexes start with 1 and go
    up with each layer "top" of the page. By changing this value, you can specify
    which item is on top.


    +   - display specifies whether an item is displayed in the browser. A value of
    "none" hides the object, and any other value (or an empty string) shows the object
    (Internet Explorer 5.0 and later only)


    +   - visibility specifies whether an item is visible. Values include visible
    (default)


    +   - background-color specifies the color for the background of any text in the
    layer.


    +   - layer-background-color specifies the background color for the entire layer
    (whether it contains text or not).


    +   - background-image specifies a background image for any text in the layer.


    +   - layer-background-image specifies the background image for the entire layer
    (whether it contains text or not).


    # Controlling Positioning with JavaScript


    As you learned in the previous hour, you can control the style attributes for
    any object with the attributes of the style object under the object. You can control
    the positioning listed in the previous section the same way.


    Suppose you have created a layer with the following `<div>` tags:


    ```

    <DIV ID="layer1" STYLE="position:absolute; left:100; top:100">

    <p>This is the content of the layer.</p>

    </DIV>

    ```


