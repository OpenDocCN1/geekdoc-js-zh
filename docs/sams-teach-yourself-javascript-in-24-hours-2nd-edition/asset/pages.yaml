  md: '# Glossary


    # interpreter


    The browser component that interprets JavaScript statements and acts on them.


    # Java


    An object-oriented language developed by Sun Microsystems. Java applets can be
    embedded within a Web page. JavaScript has similar syntax, but is not the same
    as Java.


    # JavaScript


    A scripting language for Web documents, loosely based on Java''s syntax, developed
    by Netscape. JavaScript is now supported by the most popular browsers.


    # loop


    A set of JavaScript statements that are executed a number of times, or until a
    certain condition is met.


    # method


    A specialized type of function that can be stored in an object, and acts on the
    object''s properties.


    # Navigator


    A browser developed by Netscape, and the first to support JavaScript.


    # object


    A type of variable that can store multiple values, called properties, and functions,
    methods.


    # operator


    A character used to divide variables or constants used in an expression.


    # parameter


    A variable sent to a function when it is called, also known as an argument.


    # property


    A variable that is stored as part of an object. Each object can have any number
    of properties.


    # scope


    The part of a JavaScript program that a variable was declared in and is available
    to.


