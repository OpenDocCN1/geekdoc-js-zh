  md: '# APPENDIX C


    # Glossary


    **ActiveX**


    A technology developed by Microsoft to allow components to be created, primarily
    for Windows computers. ActiveX components, or controls, can be embedded in Web
    pages.


    **applet**


    A Java program that is designed to be embedded in a Web page.


    **argument**


    A parameter that is passed to a function when it is called. Arguments are specified
    within parentheses in the function call.


    **array**


    A set of variables that can be referred to with the the same name and a number.
    called an index.


    **Boolean**


    A type of variable that can store only two values: true and false.


    ![](img/253d3bf9d2a81ee62f8085998b463a44_366_0.png)'
  merge: -1
  pgno: 366
- img_proc: true
  md: '# concatenate


    The act of combining two strings into a single, longer string.


    # conditional


    A JavaScript statement that performs an action if a particular condition is true,
    usually using the if statement.


    # debug


    The act of finding errors, or bugs, in a program or script.


    # decrement


    To decrease the value of a variable by one. In JavaScript, this can be done with
    the decrement operator, --.


    # Document Object Model (DOM)


    The set of objects that JavaScript can use to refer to the browser window and
    portions of the HTML document. The W3C (World Wide Web Consortium) DOM is a standardized
    version supported by the latest browsers, and allows access to every object within
    a page.


    # element


    A single member of an array, referred to with an index.


    # event


    A condition, often the result of a user''s action, that can be detected by a script.


    # expression


    A combination of variables, constants, and operators that can be evaluated to
    a value.


    # function


    A group of JavaScript statements that can be referred to using a function name
    and arguments.


    # Hypertext Markup Language (HTML)


    The language used in Web documents. JavaScript statements are not HTML, but can
    be included within an HTML document.


    # increment


    To increase the value of a variable by one. In JavaScript, this is done with the
    increment operator, ++.'
