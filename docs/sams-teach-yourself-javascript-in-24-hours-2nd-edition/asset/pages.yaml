  md: 'Next, the function needs to calculate the average of the four numbers. You
    can calculate this by adding the numbers, then dividing by the number of numbers
    (in this case, 4). Thus, here is the next line of the function:


    ```

    result = (a + b + c + d) / 4;

    ```


    This statement creates a variable called result and calculates the result by adding
    the numbers, then dividing by 4. (The parentheses are necessary to tell JavaScript
    to perform the addition before the division.)


    To send this back to the script that called the function, you use the return keyword.
    Here is the last part of the function:


    ```

    return result;

    )

    ```


    Listing 5.5 shows the complete Average function.


    # Listing 5.5 A Function to Average Four Numbers


    ```

    1: <script LANGUAGE="JavaScript">

    2: function average(a,b,c,d) {

    3: result = (a + b + c + d) / 4;

    4: return result;

    5: }

    6: </script>

    ```


    To use this function in a script, you can use a variable with the function call.
    For example, this statement averages the numbers 3, 4, 5, and 6 and stores the
    result in a variable called score:


    score = Average(3,4,5,6);


    > You can also use the function call directly in an expression. For example, you
    can use the alert statement to display the result of the function:

    alert(Average(1,2,3,4)).


