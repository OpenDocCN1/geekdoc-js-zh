  md: '# How JavaScript Fits into a Web Page


    As you hopefully already know, HTML is the language you use to create Web documents.
    To refresh your memory, Listing 1.1 shows a short but sadly typical Web document.


    # Listing 1.1 A Simple HTML Document


    ```

    1: <html>

    2: <head>

    3: <title>Our Home Page</title>

    4: </head>

    5: <body>

    6: <h1>The American Elephant Society</h1>

    7: <p>Welcome to our Web page. Unfortunately,

    8: it''s still under construction.</p>

    9: </body>

    10: </html>

    ```


    This document contains a header within the <head> tags and the body of the page
    within the <body> tags. To add JavaScript to a page, you''ll use a similar tag:
    <script>.

    The <script> tag tells the browser to start treating the text as a script, and
    the </script> tag returns to the regularly scheduled HTML. In most cases, you
    can''t use JavaScript statements except within <script>. The exception is event
    handlers, described later in this chapter.

    Using the <script> tag, we can add a short script (in this case, just one line)
    to the Web document, as shown in Listing 1.2. If you try this or other examples
    in this book-self, don''t type the line numbers—they''re just for your convenience
    in referring to the script.


    > If you want to try this example in a browser but don''t want to type it, the
    HTML document is available on this book''s Web site at http://www.javascript.com/
    (as are all of the other listings).


    # Listing 1.2 A Simple HTML Document with a Simple Script


    ```

    1: <html>

    2: <head>

    3: <title>Our Home Page</title>

    4: </head>

    5: <body>

    ```'
  merge: -1
