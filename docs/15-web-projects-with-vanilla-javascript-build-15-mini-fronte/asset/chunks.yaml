    ```\n\n## Utility Styles\n\n```css\n.clearfix::after {\n  content: \"\";\n  clear:\
    \ both;\n  display: table;\n}\n```\n\n## Conclusion\n\nStyling is an integral\
    \ part of any web application, and as we've seen in this chapter, it plays a pivotal\
    \ role in the user experience. With our CSS now set up, our Movie Seat Booking\
    \ application is not only functional but also visually engaging.\n\n# Selecting\
    \ Movie & Seats From UI\n\nIn this chapter, we will walk through the process of\
    \ creating the core functionality of our movie seat booking application. Our main\
    \ focus will be to understand and implement the logic that allows users to select\
    \ a movie and its corresponding seats from the UI.\n\n### 1. Creating the HTML\
    \ Layout\n\nBefore diving into the JavaScript, ensure that your HTML is properly\
    \ set up. For this section, we'll have a dropdown list of movies with their respective\
    \ prices and a layout representing the theater's seats.\n\n```html\n<div class=\"\
    movie-container\">\n  <label>Choose a movie:</label>\n  <select id=\"movie\">\n\
    \    <option value=\"10\">Avengers: Endgame ($10)</option>\n    <option value=\"\
    12\">Joker ($12)</option>\n    <option value=\"8\">Frozen II ($8)</option>\n \
    \   <option value=\"9\">Ford v Ferrari ($9)</option>\n  </select>\n</div>\n<ul\
    \ class=\"seating-chart\">\n  <!-- Each list item represents a seat -->\n  <!--\
    \ Using data attributes to indicate seat status: available, occupied -->\n  <li\
    \ class=\"seat\" data-status=\"available\"></li>\n  <!-- ... repeat for all seats\
    \ in the theater -->\n</ul>\n```\n\n### 2. JavaScript: DOM Selection\n\nStart\
    \ by selecting the elements from the DOM:\n\n```javascript\nconst movieSelect\
    \ = document.getElementById('movie');\nconst seats = document.querySelectorAll('.seating-chart\
    \ .seat[data-status=\"available\"]');\n```\n\n### 3. Listening for Events\n\n\
    Now, we want to detect when a user selects a movie or clicks on a seat:\n\n```javascript\n\
    movieSelect.addEventListener('change', updateSelectedMovie);\nseats.forEach(seat\
    \ => seat.addEventListener('click', toggleSeatSelection));\n```\n\n### 4. Toggling\
    \ Seat Selection\n\nWe want users to be able to select and deselect seats. When\
    \ a seat is selected, we'll change its data attribute:\n\n```javascript\nfunction\
    \ toggleSeatSelection(e) {\n  const seat = e.target;\n  // Toggle the data-status\
    \ attribute\n  if (seat.dataset.status === 'available') {\n    seat.dataset.status\
    \ = 'selected';\n  } else {\n    seat.dataset.status = 'available';\n  }\n  //\
    \ Update a visual representation (maybe change seat color)\n  seat.classList.toggle('selected-seat');\n\
    \  // You can now also call another function to calculate and display total cost\n\
    \  updateTotalCost();\n}\n```\n\n### 5. Updating the Selected Movie\n\nWhen the\
    \ user selects a different movie, we'll store the movie's value (price) for further\
    \ calculations:\n\n```javascript\nlet ticketPrice = +movieSelect.value;\nfunction\
    \ updateSelectedMovie(e) {\n  ticketPrice = +e.target.value;\n  // Resetting previously\
    \ selected seats when switching movies might be a good idea\n  resetSelectedSeats();\n\
    \  updateTotalCost();\n}\n```\n\n### 6. Calculating Total Cost\n\nAfter selecting\
    \ the seats and the movie, we'll provide a live update of the total cost:\n\n\
    ```javascript\nfunction updateTotalCost() {\n  const selectedSeats = document.querySelectorAll('.seating-chart\
    \ .seat[data-status=\"selected\"]');\n  const numberOfSeats = selectedSeats.length;\n\
    \  const totalCost = numberOfSeats * ticketPrice;\n  // Display this to the user\
    \ using DOM manipulation\n  document.getElementById('total-cost').textContent\
    \ = `$${totalCost}`;\n}\n```\n\nRemember, this chapter focuses on the front-end\
    \ aspect. In real-world applications, you'd want to synchronize with a backend\
    \ to ensure seat availability, especially in scenarios where multiple users might\
    \ be trying to book the same seats simultaneously.\n\n## Conclusion\n\nBy now,\
    \ you should have a functional UI that allows users to select a movie, choose\
    \ their preferred seats, and view the total cost of their selection. In the next\
    \ chapter, we'll look into saving these details into local storage and populating\
    \ the UI with saved data to enhance the user experience.\n\n# Save Data To Local\
    \ Storage\n\nLocal storage is an essential part of modern web development, especially\
    \ when we want to provide a seamless user experience. In the context of our Movie\
    \ Seat Booking project, it makes sense to utilize local storage to save the user's\
    \ seat selection and movie choice. This way, even if they leave the page and come\
    \ back, their choices remain intact.\n\n## Understanding Local Storage\n\nLocal\
    \ storage is a way to store data on the user's browser. It's like a mini database\
    \ in the browser that developers can use to store key-value pairs.\n\n**Advantages:**\n\
    - Data is saved across browser sessions.\n- No expiration time; the data remains\
    \ until it's explicitly deleted or the user clears their browser data.\n- Unlike\
    \ cookies, local storage is not sent to the server with every HTTP request, making\
    \ your application faster and more efficient.\n\n**Limitations:**\n- Typically,\
    \ browsers give you up to 5-10MB of storage.\n- It's synchronous, meaning it might\
    \ block the main thread if you're trying to store a large amount of data.\n\n\
    ## Implementing Local Storage in our Movie Seat Booking Application\n\nFor our\
    \ project, we'll save the selected movie and its price, as well as the indices\
    \ of selected seats. This way, when the user revisits the page, we can repopulate\
    \ the UI with their selections.\n\n### Step 1: Saving the Selected Movie\n\nWhenever\
    \ a user selects a movie from the dropdown, we should save that selection to local\
    \ storage.\n\n```javascript\nconst movieSelect = document.getElementById('movie');\n\
    movieSelect.addEventListener('change', (e) => {\n  const selectedMovieIndex =\
    \ e.target.selectedIndex;\n  const selectedMoviePrice = e.target.value;\n  localStorage.setItem('selectedMovieIndex',\
    \ selectedMovieIndex);\n  localStorage.setItem('selectedMoviePrice', selectedMoviePrice);\n\
    });\n```\n\n### Step 2: Saving Selected Seats\n\nTo store seat selections, we'll\
    \ keep track of the indices of the selected seats. These indices will represent\
    \ the seats in our UI.\n"
