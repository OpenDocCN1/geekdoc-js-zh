    Section 2:  Project 1 - Form Validator | Intro Project


    Project Intro


    Welcome to our very first project of this exciting journey: The Form Validator!
    Forms are an integral part of the web, and no matter how the landscape of web
    development changes, form validations will always be a necessary skill for web
    developers. Whether you''re building a sign-up page, a login form, or any other
    input system, ensuring the accuracy and correctness of data is vital. This introductory
    project is designed to provide a strong foundation for those validations.


    * * *


    Why Form Validation?


    In the vast world of web development, why did we choose to start with form validation?
    Here are a few reasons:


    1\. Universality: Nearly every website you visit has some form - be it a search
    bar, a login page, or a feedback form.


    2\. User Experience: A good form validation system provides immediate feedback
    to users, ensuring they provide the right information.


    3\. Security: Ensuring data is validated on the front-end can also be a first
    line of defense against malicious inputs.


    * * *


    What We''ll Build


    We''re going to design a simple form that asks users for a username, email, and
    password. This form will have the following features:


    - Fields will be checked to ensure they aren’t left empty.


    - Email addresses will be validated to ensure they''re in a proper format.


    - Passwords will be validated for length and to ensure a confirm password matches.


    * * *


    Technologies & Techniques


    Although the main focus here is on JavaScript, HTML and CSS will play crucial
    roles. Here''s a glimpse of what we''ll use:


    1\. HTML: Structure our form and inputs.


    2\. CSS: Stylish visual cues to indicate errors or successful inputs.


    3\. JavaScript: The heart of our validation logic. We''ll be using vanilla JavaScript,
    without any libraries or frameworks.


    * * *


    Prerequisites


    You should have a basic understanding of HTML, CSS, and JavaScript. If you''re
    completely new or need a refresher, it''s advisable to first check out the "Modern
    HTML/CSS From The Beginning" and "Modern JS From The Beginning" courses on Udemy.


    * * *


    What You''ll Gain


    By the end of this project, you''ll:


    1\. Understand how to intercept form submissions using JavaScript.


    2\. Learn how to traverse and manipulate the DOM to highlight errors.


    3\. Be familiar with basic string methods and regular expressions for validation.


    4\. Have a foundational project in your portfolio to showcase basic front-end
    validation skills.


    Let''s Get Started!


    Excited? You should be! This foundational project will set the pace for the other,
    more complex projects we''ll tackle in this course. So, buckle up, and let’s dive
    into the world of form validation!


    * * *


    In the next chapter, we''ll begin with the structure of our form by creating its
    HTML layout. Let''s begin this amazing journey together!


    Project HTML


    Welcome to Chapter 4, where we''re going to dive into the heart of our first project:
    the Form Validator. Before we begin styling and adding dynamic functionality,
    we need a solid foundation. That foundation is our HTML structure.


