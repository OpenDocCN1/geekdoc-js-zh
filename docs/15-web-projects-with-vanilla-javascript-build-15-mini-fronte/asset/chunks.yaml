    ## Add & Delete Transactions


    In this chapter, we''ll learn how to add and delete transactions within our Expense
    Tracker. We''ll be interacting with the DOM to capture user input, and we''ll
    utilize local storage to persist our transactions. Let’s dive in.


    * * *


    ### 1. The HTML Structure


    Before adding or deleting transactions, we need a simple HTML structure to capture
    user input. For the sake of brevity, let''s assume the following structure is
    in place:


    ```html


    <div id="transaction-form">


    <input type="text" id="transaction-name" placeholder="Enter transaction name...">


    <input type="number" id="transaction-amount" placeholder="Enter amount...">


    <button id="add-transaction">Add Transaction</button>


    </div>


    <ul id="transaction-list">


    <!-- Transactions will be dynamically added here -->


    </ul>


    ```


    * * *


    ### 2. Capturing User Input


    Firstly, we need to capture what the user enters. This can be achieved using the
    DOM.


    ```javascript


    const transactionNameEl = document.getElementById(''transaction-name'');


    const transactionAmountEl = document.getElementById(''transaction-amount'');


    ```


    * * *


    ### 3. Storing Transactions


    We will store our transactions in an array and later save them to local storage.


    ```javascript


    let transactions = [];


    function addTransaction(e) {


    e.preventDefault();


    if (transactionNameEl.value.trim() === '''' || transactionAmountEl.value.trim()
    === '''') {


    alert(''Please enter a valid name and amount for the transaction.'');


    return;


    }


    const newTransaction = {


    id: generateID(),


    name: transactionNameEl.value,


    amount: parseFloat(transactionAmountEl.value)


    };


    transactions.push(newTransaction);


    updateLocalStorage();


    updateUI();


    transactionNameEl.value = '''';


    transactionAmountEl.value = '''';


    }


    function generateID() {


    return Math.floor(Math.random() * 100000000);


    }


    ```


    * * *


    ### 4. Displaying Transactions


    Once a transaction is added, we need to display it to the user.


    ```javascript


    function updateUI() {


    const transactionListEl = document.getElementById(''transaction-list'');


    transactionListEl.innerHTML = '''';


    transactions.forEach(transaction => {


    const sign = transaction.amount < 0 ? ''-'' : ''+'';


    const item = document.createElement(''li'');


    item.className = transaction.amount < 0 ? ''minus'' : ''plus'';


    item.innerHTML = `


    ${transaction.name} <span>${sign}${Math.abs(transaction.amount)}</span>


    <button class="delete-btn" onclick="deleteTransaction(${transaction.id})">x</button>


    `;


    transactionListEl.appendChild(item);


    });


    }


    ```


    * * *


    ### 5. Deleting Transactions


    For deletion, we can utilize the unique ID we''ve given to each transaction.


    ```javascript


    function deleteTransaction(id) {


    transactions = transactions.filter(transaction => transaction.id !== id);


    updateLocalStorage();


    updateUI();


    }


    ```


    * * *


    ### 6. Persisting to Local Storage


    We want our transactions to remain available even after a page reload. For that,
    we’ll utilize local storage.


    ```javascript


    function updateLocalStorage() {


    localStorage.setItem(''transactions'', JSON.stringify(transactions));


    }


    // Initially load transactions from local storage (if available)


    function initializeTransactions() {


    const storedTransactions = localStorage.getItem(''transactions'');


    transactions = storedTransactions ? JSON.parse(storedTransactions) : [];


    updateUI();


    }


    initializeTransactions();


    ```


    * * *


    ### 7. Event Listeners


    Finally, we attach an event listener to our add button:


    ```javascript


    document.getElementById(''add-transaction'').addEventListener(''click'', addTransaction);


    ```


    And voilà! With these functionalities in place, users can seamlessly add and delete
    transactions. The transactions are not only reflected in the UI but are also stored
    in the browser''s local storage, ensuring no data is lost even if the user refreshes
    the page.


    Remember, while the above code snippets provide a solid foundation for an expense
    tracker, there are various enhancements and additional features you can incorporate.
    As always, testing each functionality thoroughly ensures a smooth user experience.


    ## Persist To Local Storage


    One of the most common requirements for modern web applications is the ability
    to persist data across sessions, without necessarily sending data back to a server.
    This can provide users with a seamless experience, as data like settings, user
    preferences, or even user-generated content can be saved and then loaded on subsequent
    visits. In our Expense Tracker project, we''ll leverage the power of the Web Storage
    API, specifically the Local Storage, to achieve this.


    * * *


    ### What is Local Storage?


    Local Storage is a web-based storage solution that allows websites to store key-value
    pairs in a web browser with no expiration time. It''s perfect for saving user-specific
    data, and it''s much larger in terms of storage capacity than cookies.


    Benefits:


    - Persistence: Unlike session storage, data stored in local storage does not expire
    with the session. This means even if you close the browser or tab, the data will
    still be there when you come back.

