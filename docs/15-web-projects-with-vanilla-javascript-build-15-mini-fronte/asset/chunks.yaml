    # A Look at JSON & Fetch


    In this chapter, we''ll dive deep into two crucial concepts in modern web development:
    JSON and the Fetch API. As we proceed with our Exchange Rate Calculator, we will
    rely on these tools to fetch and handle data from external sources. By understanding
    their foundations, you''ll be better equipped to create dynamic, data-driven web
    applications.


    ## What is JSON?


    JSON stands for JavaScript Object Notation. It''s a lightweight data interchange
    format that is easy for humans to read and write, and easy for machines to parse
    and generate. JSON is a text format, independent of any language, which makes
    it an ideal data format for data exchange between a client and server, or between
    different parts of an application.


    A JSON object looks like this:


    ```json

    {

    "name": "John",

    "age": 30,

    "city": "New York"

    }

    ```


    ### Key Features of JSON:


    1. Readability: JSON structures are straightforward, making it easy for humans
    to read and write.

    2. Universality: Most programming languages, including JavaScript, have built-in
    support for JSON.

    3. Flexibility: JSON can represent a wide variety of data structures, including
    objects, arrays, and primitive data types.


    ## Introduction to Fetch API


    The Fetch API provides an interface for fetching resources, including across the
    network. It gives a more modern way to make web requests compared to the older
    `XMLHttpRequest`. With `fetch()`, we can make requests and handle responses more
    flexibly and with less boilerplate code.


    ### Basic Syntax of Fetch:


    ```javascript

    fetch(url)

    .then(response => response.json())

    .then(data => console.log(data))

    .catch(error => console.error(''Error:'', error));

    ```


    ## Combining JSON & Fetch


    When we use the Fetch API to retrieve data from a server, the response is often
    in JSON format. Here''s a step-by-step breakdown of how to use them together:


    1. Request Data: Use the `fetch()` function to make a request to an API or server.

    2. Handle Response: Once the request is made, the server will send back a response.
    This response is not directly in JSON format, but a `Response` object which contains
    the data in a method like `json()`.

    3. Parse JSON: Using the `json()` method, we can extract the JSON data from the
    `Response` object.


    Example:


    ```javascript

    fetch(''https://api.example.com/data'')

    .then(response => response.json())

    .then(data => {

    // Handle the JSON data here

    console.log(data);

    })

    .catch(error => {

    console.error(''Error fetching data:'', error);

    });

    ```


    ## Practical Application: Fetching Exchange Rates


    For our Exchange Rate Calculator project, we''ll be using an API that provides
    currency exchange rates in JSON format. Using the Fetch API, we can retrieve this
    data, parse the JSON, and then manipulate it within our application to provide
    users with real-time currency conversions.


    Here''s a hypothetical example:


    ```javascript

    fetch(''https://api.currencyexchange.com/rates'')

    .then(response => {

    if (!response.ok) {

    throw new Error(''Network response was not ok'');

    }

    return response.json();

    })

    .then(data => {

    // Use the data (exchange rates) to update our application''s UI

    updateExchangeRates(data);

    })

    .catch(error => {

    console.error(''There was a problem with the fetch operation:'', error.message);

    });

    ```


    In the above example, after fetching the data, we check if the response was successful
    using the `response.ok` property. If there''s an issue (e.g., the server returns
    a 404 or 500 status), we handle it appropriately.


    ## Conclusion


    Understanding JSON and the Fetch API is essential for modern web development.
    These tools allow us to interact with servers, APIs, and other external data sources
    seamlessly. As we build our Exchange Rate Calculator, we''ll see these concepts
    in action, retrieving real-world data and presenting it to our users. In the next
    chapters, we''ll integrate this knowledge into our project, setting the foundation
    for dynamic, data-driven web applications.


    ### Further Reading & Resources:


    - MDN Web Docs: [Using Fetch](https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch)

    - MDN Web Docs: [JSON](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON)


    ### Exercise:


    1. Visit an online JSON editor, such as [jsoneditoronline.org](https://jsoneditoronline.org/).
    Create a sample JSON structure and practice modifying it.

    2. Experiment with the Fetch API. Try fetching data from a public API like [jsonplaceholder.typicode.com](https://jsonplaceholder.typicode.com/).
    Analyze the JSON response you get.


    With this understanding of JSON and Fetch, you''re now ready to dive deeper into
    the Exchange Rate Calculator project and apply what you''ve learned to build a
    functional, interactive application.


    # Fetch Rates & Update DOM


    In the preceding chapters, we laid the groundwork for our Exchange Rate Calculator
    project, structuring our HTML and beautifying it with CSS. Now, we''ll dive into
    the heart of our application: fetching real-time exchange rates and dynamically
    updating our webpage (or the Document Object Model, abbreviated as DOM).


    ## 1. Introduction to Fetching Data


    Fetching data from external sources is a common requirement in modern web applications.
    JavaScript provides a built-in method called `fetch()` to make HTTP requests,
    which simplifies the process of retrieving and sending data to an external source.


    ## 2. Fetch API


    The Fetch API provides a simple interface for making network requests and handling
    responses. The primary method for this is `fetch()`.


    ### Basic Syntax:


    ```javascript

    fetch(url)

    .then(response => response.json())

    .then(data => console.log(data))

    .catch(error => console.error("There was an error!", error));

    ```


    - `url`: The URL you want to fetch.

    - The `fetch()` method returns a promise that resolves into the `Response` object
    representing the response to the request.

    - The `response.json()` method reads the response body and returns it as a JSON
    object.


    ## 3. Setting Up the Exchange Rate API


    For this project, we''ll use the `exchangerate-api` (or any similar service).
    It''s a free service that provides currency conversion rates.


    Firstly, sign up and get your API key.


    ## 4. Making Our Fetch Request


    With our API key at the ready, let''s fetch the rates:


    ```javascript

    const currencyOne = document.getElementById(''currency-one'');

    const currencyTwo = document.getElementById(''currency-two'');

    const rateElement = document.getElementById(''rate'');

    let apiURL = `https://api.exchangerate-api.com/v4/latest/${currencyOne.value}`;


    fetch(apiURL)

    .then(response => response.json())

    .then(data => {

    const rate = data.rates[currencyTwo.value];

    rateElement.innerText = `1 ${currencyOne.value} = ${rate} ${currencyTwo.value}`;

    })

    .catch(error => console.error("Error fetching data:", error));

    ```


    Here, we''re fetching the latest exchange rate for the currency selected in `currencyOne`
    and updating the DOM with the rate for `currencyTwo`.


    ## 5. Updating the DOM


    After fetching the data, our main task is to dynamically update our webpage. We''ve
    already displayed the rate in the above code. But to make our application interactive,
    let''s also convert the entered amount:


    ```javascript

    const amountOne = document.getElementById(''amount-one'');

    const amountTwo = document.getElementById(''amount-two'');


    fetch(apiURL)

    .then(response => response.json())

    .then(data => {

    const rate = data.rates[currencyTwo.value];

    rateElement.innerText = `1 ${currencyOne.value} = ${rate} ${currencyTwo.value}`;

    // Convert the amount

    const amount = amountOne.value * rate;

    amountTwo.value = amount.toFixed(2);

    });

    ```


    We''ve added code to convert `amountOne` using the fetched rate and update `amountTwo`
    accordingly.


    ## 6. Event Listeners

