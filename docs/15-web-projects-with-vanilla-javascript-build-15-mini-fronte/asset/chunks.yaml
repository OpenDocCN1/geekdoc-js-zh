  trans: "\n\n虽然本项目旨在让那些对 HTML、CSS 和 JavaScript 有基本了解的人能够上手，但如果你已经完成了本课程之前的项目，将会非常有帮助。我们将基于前几章介绍的基础概念进行构建。\n\
    \n## 最终目标的预览\n\n想象一个时尚的网页。在左上角有一个汉堡图标（三条堆叠的线）。点击后，一个菜单从左侧滑入，显示指向网站不同部分的链接。这种滑动效果非常流畅，使用户体验感觉精致且专业。\n\
    \n现在，在我们的主要内容中，有一个标有“了解更多”的按钮。点击它后，背景变暗，一个居中的模态窗口出现，包含更多详细信息或一个注册表单。点击关闭图标或模态窗口外部的任何位置将再次将其隐藏，将用户返回到主要内容。\n\
    \n听起来很令人兴奋，对吧？这就是我们即将构建的内容！所以，系好安全带，让我们开始这段奇妙的旅程，为你的 Web 开发工具箱添加更多交互元素。进入下一章，我们将从项目的\
    \ HTML 结构开始！\n\n# 项目 HTML\n\n欢迎来到第六个项目：菜单滑块与模态窗口（Menu Slider & Modal）的 HTML 部分！这里是我们奠定项目基础的地方。记住，良好的\
    \ HTML 结构对于使 CSS 和 JavaScript 的集成更简单、更高效至关重要。\n\n### 简介\n\nHTML（超文本标记语言）是任何网页的骨架。它提供结构，而\
    \ CSS 负责样式，JavaScript 则赋予其生命。在本章中，我们将专注于为我们的菜单滑块和模态窗口创建语义化且可访问的结构。\n\n### 设置基础\
    \ HTML 结构\n\n首先，我们将设置一个基础的 HTML5 模板。\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1.0\">\n    <title>Menu Slider & Modal</title>\n\
    \    <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n</body>\n\
    <script src=\"script.js\"></script>\n</html>\n```\n\n### 创建页眉部分\n\n我们的页眉将包含一个导航栏和一个用于触发滑动菜单的菜单图标。\n\
    \n```html\n<header>\n    <div class=\"container\">\n        <h1>Menu Slider &\
    \ Modal</h1>\n        <button id=\"menu-btn\">☰</button>\n    </div>\n</header>\n\
    ```\n\n这里：\n- `container` 将作为一个包装器来使我们的内容居中。\n- `h1` 提供标题。\n- `menu-btn` 按钮将用于触发滑动菜单。\n\
    \n### 打造滑动菜单\n\n滑动菜单将是一个从左侧滑入和滑出的侧边栏。我们将从基础结构开始，随后使用 JavaScript 添加滑动功能。\n\n```html\n\
    <aside id=\"menu-slider\">\n    <ul>\n        <li><a href=\"home\">Home</a></li>\n\
    \        <li><a href=\"services\">Services</a></li>\n        <li><a href=\"about\"\
    >About</a></li>\n        <li><a href=\"contact\">Contact</a></li>\n    </ul>\n\
    </aside>\n```\n\n### 构建模态窗口部分\n\n我们的模态窗口将是一个简单的弹出窗口，可以通过按钮点击触发。为了这个示例，我们将使用它来显示一个订阅表单。\n\
    \n```html\n<div id=\"modal\">\n    <div class=\"modal-content\">\n        <span\
    \ id=\"close-btn\">×</span>\n        <h2>Subscribe to Our Newsletter</h2>\n  \
    \      <form action=\"\">\n            <input type=\"email\" placeholder=\"Enter\
    \ your email\">\n            <button type=\"submit\">Subscribe</button>\n    \
    \    </form>\n    </div>\n</div>\n```\n\n在这个结构中：\n- ID 为 `modal` 的外层 `div` 将作为背景，在模态窗口可见时使页面的其余部分变暗。\n\
    - `modal-content` 包含模态窗口的实际内容。\n- `close-btn` 将用于关闭模态窗口。\n- 模态窗口内的表单提示用户订阅新闻通讯。\n\
    \n### 总结\n\n随着菜单滑块与模态窗口项目的 HTML 结构就绪，你已经准备好进入 CSS 样式设计和 JavaScript 功能添加阶段了。请始终确保你的\
    \ HTML 清晰且具有语义化，因为这不仅能提高网站的可访问性，还能简化样式设计和脚本编写的过程。\n\n在下一章中，我们将深入研究导航栏的样式设计，并使用\
    \ CSS 设置项目的整体外观。\n\n# 导航栏样式\n\n欢迎来到第 35 章，我们将专注于 Web 应用程序 UI 中最基础的组件之一：导航栏（Navbar）。导航栏通常包含帮助用户在网站不同部分或页面之间跳转的链接。鉴于其重要性，导航栏的样式设计对于美学和可用性都至关重要。让我们来看看如何为“菜单滑块与模态窗口”项目设计导航栏样式。\n\
    \n### 1. 导航栏的基础结构\n\n在开始设计样式之前，让我们回顾一下我们正在使用的 HTML 结构。一个典型的导航栏可能像这样：\n\n```html\n\
    <nav class=\"navbar\">\n    <div class=\"logo\">\n        <h1>MyWebsite</h1>\n\
    \    </div>\n    <ul class=\"nav-menu\">\n        <li><a href=\"home\">Home</a></li>\n\
    \        <li><a href=\"about\">About</a></li>\n        <li><a href=\"services\"\
    >Services</a></li>\n        <li><a href=\"contact\">Contact</a></li>\n    </ul>\n\
    \    <div class=\"menu-toggle\"><i class=\"fas fa-bars\"></i></div>\n</nav>\n\
    ```\n\n### 2. 导航栏容器的样式\n\n首先，让我们给导航栏一个独特的外观，使其与页面的其余部分区分开来。\n\n```css\n.navbar\
    \ {\n    display: flex;\n    justify-content: space-between;\n    align-items:\
    \ center;\n    background-color: 333;\n    padding: 10px 50px;\n    box-shadow:\
    \ 0px 3px 10px rgba(0, 0, 0, 0.2);\n}\n```\n\n- `display: flex;` 确保导航栏的子元素在同一行对齐。\n\
    - `justify-content: space-between;` 将子元素均匀地分布在导航栏两端。\n- `box-shadow:` 添加一个微妙的阴影，使导航栏看起来略微高于页面。\n\
    \n### 3. Logo 的样式\n\n我们的 Logo 是品牌的代表；它应该突出，但不能掩盖其他元素。\n\n```css\n.navbar .logo\
    \ h1 {\n    color: fff;\n    margin: 0;\n    font-size: 1.5rem;\n    text-transform:\
    \ uppercase;\n    letter-spacing: 2px;\n}\n```\n\n### 4. 菜单的样式\n\n接下来，让我们设计菜单链接的样式。现代的做法是使用带有项目间距的水平列表。\n\
    \n```css\n.nav-menu {\n    list-style-type: none;\n    padding: 0;\n    display:\
    \ flex;\n    gap: 20px;\n}\n.nav-menu li a {\n    color: fff;\n    text-decoration:\
    \ none;\n    transition: color 0.3s ease;\n}\n.nav-menu li a:hover {\n    color:\
    \ 007BFF;  /* 悬停效果的蓝色调 */\n}\n```\n\n### 5. 菜单切换按钮的样式\n\n这是用户在较小屏幕上点击以查看菜单的按钮：\n\
    \n```css\n.menu-toggle {\n    display: none; /* 初始在桌面端隐藏 */\n    font-size: 1.5rem;\n\
    \    color: fff;\n    cursor: pointer;\n}\n/* 媒体查询，用于在较小屏幕上显示菜单切换按钮 */\n@media\
    \ (max-width: 768px) {\n    .menu-toggle {\n        display: block;\n    }\n \
    \   .nav-menu {\n        display: none; /* 默认在移动端隐藏菜单 */\n        flex-direction:\
    \ column;\n        gap: 10px;\n        position: absolute;\n        top: 60px;\
    \ /* 导航栏的高度 */\n        left: 0;\n        background-color: 333;\n        width:\
    \ 100%;\n    }\n    .nav-menu.active { /* 该类将通过 JS 添加以显示菜单 */\n        display:\
    \ flex;\n    }\n}\n```\n\n### 6. 额外修饰\n\n为了进一步完善我们的导航栏，可以考虑添加过渡或动画，以获得更流畅的用户体验。例如：\n\
    \n```css\n.nav-menu li a {\n    transition: all 0.3s ease;\n}\n```\n\n这将确保在悬停于菜单项时，颜色等属性的变化是渐进且平滑的。\n\
    \n### 结论\n\n通过这些样式，我们的导航栏不仅功能完备，而且视觉上具有吸引力。一个设计良好的导航栏能增强用户体验，并引导他们无缝地浏览你的应用程序。一如既往，你可以随意调整颜色、尺寸和其他属性，以更好地适应你网站的整体设计和主题。\n\
    \n在下一章中，我们将探索页眉和模态组件的样式设计，深入研究 CSS 世界并提升项目的外观和感觉。敬请期待！\n\n# 页眉与模态窗口样式\n\n"
- fmt: '

    Welcome back! Having set up the basic structure for our Menu Slider & Modal project,
    it''s time to give our header and modal some appealing visuals. Styling is a crucial
    part of any web project. It enhances the user experience and ensures your application
    is pleasant to the eyes. In this chapter, we''ll focus on styling the header and
    the modal using pure CSS.


    ## 1. Styling the Header


    Our header typically contains the website''s title and perhaps a navigation menu
    button. Let''s make it stand out but still maintain a level of simplicity.


    ### HTML Structure Reminder:


    ```html

    <header>

    <h1>Our Website</h1>

    <button id="menu-btn">Menu</button>

    </header>

    ```


    ### CSS:


    ```css

    /* Base Styling for the Header */

    header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 1rem 2rem;

    background-color: 333;

    color: white;

    box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.2);

    }

    header h1 {

    font-size: 2rem;

    }

    menu-btn {

    background-color: 555;

    border: none;

    color: white;

    padding: 0.5rem 1rem;

    cursor: pointer;

    border-radius: 5px;

    transition: background-color 0.3s;

    }

    menu-btn:hover {

    background-color: 777;

    }

    ```


    Here, we''ve used a flexbox layout for the header to space out the title and the
    button. The `box-shadow` gives a subtle elevation effect to the header.


    ## 2. Styling the Modal


    The modal is a crucial part of this project. It should grab the user''s attention,
    yet not be too distracting.


    ### HTML Structure Reminder:


    ```html

    <div id="modal">

    <div class="modal-content">

    <span class="close-btn">&times;</span>

    <h2>Modal Title</h2>

    <p>Some content here...</p>

    </div>

    </div>

    ```


    ### CSS:


    ```css

    /* Base Styling for the Modal */

    modal {

    display: none;

    position: fixed;

    top: 0;

    left: 0;

    width: 100vw;

    height: 100vh;

    background-color: rgba(0, 0, 0, 0.7);

    z-index: 1000;

    align-items: center;

    justify-content: center;

    }

    .modal-content {

    background-color: fff;

    padding: 2rem;

    width: 70%;

    max-width: 500px;

    border-radius: 10px;

    box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.3);

    }

    .close-btn {

    position: absolute;

    top: 10px;

    right: 15px;

    font-size: 1.5rem;

    cursor: pointer;

    transition: color 0.3s;

    }

    .close-btn:hover {

    color: red;

    }

    ```


    The outer `modal` div stretches across the whole viewport and has a semi-transparent
    background to give focus to the modal content. The `.modal-content` div holds
    our actual modal content and stands out against the dark background, thanks to
    its white color.


    The `close-btn` is positioned in the top-right corner of the modal. We''ve also
    added a hover effect to provide feedback to the user.


    ### Conclusion


    With the header and modal now styled, our project is starting to take shape. Styling
    plays a vital role in dictating the feel and atmosphere of an application, and
    by now, you should have a better understanding of how to achieve this using pure
    CSS.


    In the next chapter, we''ll delve into the JavaScript behind the Menu and Modal
    Toggle functionalities, bringing our project to life!


    ## Menu & Modal Toggle


    In this chapter, we''ll learn how to implement a toggle mechanism for our menu
    and modal using the Document Object Model (DOM) and Cascading Style Sheets (CSS).
    Toggles are frequently used in web design to show or hide content upon user interaction.
    They enhance user experience by providing a dynamic interface.


    ### 1. The HTML Structure:


    Before diving into the JavaScript and CSS for our toggle, let''s set up the basic
    HTML structure:


    ```html

    <div id="menu-container">

    <button id="menu-button">Menu</button>

    <div id="menu-content" class="hidden">

    <ul>

    <li><a href="">Home</a></li>

    <li><a href="">About</a></li>

    <li><a href="">Services</a></li>

    </ul>

    </div>

    </div>

    <button id="open-modal-btn">Open Modal</button>

    <div id="myModal" class="modal hidden">

    <div class="modal-content">

    <span id="close-modal-btn" class="close">&times;</span>

    <p>Welcome to our website!</p>

    </div>

    </div>

    ```


    Note: We''ve added the class `hidden` to both the `menu-content` and `myModal`
    to hide them initially.


    ### 2. Styling the Toggle:


    The `hidden` class is crucial as it will help in toggling the display of our menu
    and modal:


    ```css

    .hidden {

    display: none;

    }

    .menu {

    /* Add general styling for the menu here */

    }

    .modal {

    position: fixed;

    z-index: 1;

    left: 0;

    top: 0;

    width: 100%;

    height: 100%;

    background-color: rgba(0,0,0,0.4);

    }

    .modal-content {

    background-color: fefefe;

    margin: 15% auto;

    padding: 20px;

    border: 1px solid 888;

    width: 80%;

    }

    ```


    ### 3. The JavaScript Toggle Mechanism:


    Using JavaScript, we can easily toggle the visibility of our menu and modal:


    ```javascript

    document.addEventListener(''DOMContentLoaded'', function() {

    const menuBtn = document.getElementById("menu-button");

    const modalBtn = document.getElementById("open-modal-btn");

    const closeModalBtn = document.getElementById("close-modal-btn");

    const menuContent = document.getElementById("menu-content");

    const myModal = document.getElementById("myModal");

    menuBtn.addEventListener("click", function() {

    toggleVisibility(menuContent);

    });

    modalBtn.addEventListener("click", function() {

    toggleVisibility(myModal);

    });

    closeModalBtn.addEventListener("click", function() {

    toggleVisibility(myModal);

    });

    function toggleVisibility(element) {

    if (element.classList.contains(''hidden'')) {

    element.classList.remove(''hidden'');

    } else {

    element.classList.add(''hidden'');

    }

    }

    });

    ```


    The above script listens for the `DOMContentLoaded` event, ensuring our JavaScript
    runs only after the entire HTML document has been completely loaded. We''ve defined
    a `toggleVisibility()` function that toggles the visibility of an element by adding
    or removing the `hidden` class.


    ### Conclusion:


    By the end of this chapter, you''ve learned how to use JavaScript and CSS in tandem
    to create a toggle mechanism for a menu and a modal. By integrating this knowledge
    into your web projects, you can create a more interactive and dynamic user interface.


    # Section 8: Project 7 - Hangman Game | DOM, SVG, Events


    ## Project Intro


    Welcome to our seventh project - The Hangman Game! This classic word game not
    only tests your vocabulary but also provides a delightful user experience with
    the help of SVG for graphics, DOM for dynamic content manipulation, and JavaScript
    events to capture user inputs. By the end of this project, you''ll have a fully
    functional Hangman game that you can show off to your friends or even include
    in your web portfolio.


    ### Objective of the Game:


    The aim of the Hangman game is straightforward. A word or phrase is chosen at
    random, and the player must guess the word letter by letter. For every wrong guess,
    a part of a "hangman" figure is drawn. The game ends when the figure is complete
    (indicating all guesses were wrong) or the word/phrase is entirely guessed correctly.


    ### What You''ll Learn:


    - SVG (Scalable Vector Graphics): You’ll understand how to use SVG to draw and
    animate the hangman figure. SVGs are a powerful way to add vector-based graphics
    to your webpage, and they can be manipulated using CSS and JavaScript.

    - DOM Manipulation: As with our previous projects, the DOM plays a crucial role.
    You''ll be updating the display based on user guesses, revealing letters, showing
    notifications, and more.

    - JavaScript Events: User input is vital in the Hangman game. You''ll be harnessing
    keyboard events to capture user guesses, button click events for game controls,
    and more.

    - Game Logic: Behind every game lies a set of rules and logic. You''ll be setting
    up conditions to check player guesses, determine when the game is won or lost,
    and more.


    ### Why The Hangman Game?

