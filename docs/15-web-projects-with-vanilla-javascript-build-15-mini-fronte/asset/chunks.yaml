    </div>


    <div class="form-control">


    <label for="amount">Amount</label>


    <input type="number" id="amount" placeholder="Enter amount...">


    <small>(negative - expense, positive - income)</small>


    </div>


    <button class="btn">Add transaction</button>


    </form>


    ```


