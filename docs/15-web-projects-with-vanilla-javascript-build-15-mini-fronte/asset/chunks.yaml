    Project HTML


    Welcome to the next exciting phase of our project series! In this chapter, we''ll
    be laying the foundation for our Custom Video Player project by setting up the
    HTML structure. This player will leverage the HTML5 Video API, giving us capabilities
    to play, pause, skip, and more. But before any of that, we need to build our HTML
    scaffold!


    * * *


    HTML5 Video Element:


    HTML5 introduced the `<video>` element which allows us to embed video files that
    can be played directly in the browser without the need for external plugins. Alongside
    the video element, there are multiple attributes and child elements we can use
    to enhance the user experience, such as adding controls, setting a poster image,
    or even providing multiple sources for different video formats.


    * * *


    Setting Up the Basic Structure:


    Let''s dive in and create our HTML structure for the video player.


    ```html


    <!DOCTYPE html>


    <html lang="en">


    <head>


    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Custom Video Player</title>


    <!-- You''ll link your CSS here -->


    <link rel="stylesheet" href="styles.css">


    </head>


    <body>


    <div class="video-container">


    <video id="video" width="750" height="500" controls>


    <!-- Insert your video source(s) here -->


    <source src="path-to-your-video.mp4" type="video/mp4">


    <!-- You can provide multiple sources for different video formats -->


    <source src="path-to-your-video.webm" type="video/webm">


    <!-- Display text for browsers that don''t support the video tag -->


    Your browser does not support the video tag.


    </video>


    <div class="controls">


    <button id="play-pause">Play</button>


    <input type="range" id="volume" min="0" max="1" step="0.1">


    <button id="full-screen">Full-Screen</button>


    <span id="time">00:00 / 00:00</span>


    </div>


    </div>


    <!-- You''ll link your JavaScript here -->


    <script src="script.js"></script>


    </body>


    </html>


    ```


    Explaining the Code:


    - Video Container: This is a wrapping `div` that contains the video and its custom
    controls. It will help in styling and positioning.


    - Video Element: We''ve provided two `<source>` elements within the `<video>`
    tag. This is to ensure maximum compatibility across browsers. Different browsers
    might support different video formats, so by providing multiple formats, we ensure
    that most users can view the video.


    The `controls` attribute, when present, displays the default browser controls
    for the video player. While we''ll be building our own custom controls, this is
    useful during the setup phase to ensure our video is loading correctly.


    - Custom Controls: Underneath the video, we have a `div` with a class of `controls`.
    This will contain our custom controls for the video player, including:


    - Play/Pause Button: A toggle button to play or pause the video.


    - Volume Control: An input range to adjust the video''s volume.


    - Full-Screen Button: A button to toggle full-screen mode.


    - Time Display: A span to display the current time of the video and its total
    duration.


    * * *


    Conclusion:


    Setting up the HTML is the first step in creating our Custom Video Player. This
    structure provides a foundation upon which we''ll build our styles and functionalities.
    In the upcoming chapters, we will focus on styling this structure with CSS and
    then implementing the video controls with JavaScript. The goal is to create a
    player that is both functional and aesthetically pleasing, offering users an enhanced
    video playback experience.


    Project CSS


    Welcome back! Now that we''ve set up the HTML structure for our custom video player
    in the previous chapter, it''s time to style it and give it an appealing look.
    CSS is the backbone of web aesthetics. In this chapter, we''ll focus on making
    our video player not just functional, but also user-friendly and visually appealing.


    * * *


    1\. Basic Reset:


    To begin with, let''s reset some default styles. This will help us maintain consistency
    across browsers.


    ```css


    * {


    margin: 0;


    padding: 0;


    box-sizing: border-box;


    }


    ```


    * * *


    2\. Setting Up the Container:


    Our video player will sit inside a container. This container will hold the video
    and the control bar.


    ```css


    .video-container {


    width: 80%;


    max-width: 800px;


    margin: 40px auto;


    position: relative;


    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);


    }


    ```


    * * *


    3\. Styling the Video Element:


    The `<video>` element will take up the entire width of its container. We''ll also
    give it a fixed height.


    ```css


    video {


    width: 100%;


    height: 450px;


    display: block;


    }


    ```


    * * *


    4\. Video Controls:


    Below the video, we''ll have our custom controls which will include play/pause
    buttons, a progress bar, volume control, and full-screen toggling.


    ```css


    .video-controls {


    display: flex;


    align-items: center;


    justify-content: space-between;


    background-color: 333;


    color: fff;


    padding: 10px 15px;


    }


    ```


    4.1 Buttons:


    All buttons will have a consistent style.


    ```css


    .video-controls button {


    background: none;


    border: none;


    color: fff;


    font-size: 16px;


    margin-right: 15px;


    cursor: pointer;


    }


    ```


    For any active or hover state:


    ```css


    .video-controls button.active,


    .video-controls button:hover {


    color: ff6347;


    }


    ```


    4.2 Progress Bar:


    The progress bar will show how much of the video has been played.


    ```css


    .progress-bar {


    flex: 1;


    height: 5px;


    background-color: 555;


    margin: 0 10px;


    position: relative;


    }


    ```


    For the played section:


    ```css


    .progress-bar span {


    display: block;


    height: 100%;


    background-color: ff6347;


    position: absolute;


    left: 0;


    top: 0;


    width: 0%; /* This will be updated dynamically using JavaScript */


    }


    ```


    4.3 Volume Control:


    ```css


    .volume {


    display: flex;


    align-items: center;


    }


    .volume-slider {


    width: 100px;


    margin-left: 10px;


    }


    ```


    * * *


    5\. Full Screen Styling:


    When in full screen mode, we want our video to occupy the entire viewport.


    ```css


    video:-webkit-full-screen {


    width: 100vw;


    height: 100vh;


    }


    video:fullscreen {


    width: 100vw;


    height: 100vh;


    }


    ```


    That wraps up our styling for the custom video player. As you can see, with just
    a bit of CSS, we''ve transformed our raw HTML structure into a visually appealing
    and user-friendly video player. In the next chapter, we''ll dive into making this
    player functional by using the HTML5 Video API and JavaScript.


    Note: Always remember to test your styles across different browsers to ensure
    compatibility and consistent appearance. Adjustments might be necessary based
    on browser-specific quirks.


    Play, Pause & Stop


    Welcome back, dear readers! In this chapter, we are going to dive deep into the
    core functionalities of our Custom Video Player: play, pause, and stop. These
    are basic yet crucial controls for any media player, and with the help of the
    HTML5 Video API, implementing them is quite straightforward.


    * * *


    Introduction to HTML5 Video API:


    Before diving into the coding section, it''s essential to understand the power
    of the HTML5 Video API. This API provides a way to programmatically access and
    manipulate video content played back through the `<video>` element in web pages.
    It exposes methods and properties that allow developers to play, pause, adjust
    volume, and even check if a video has ended.


    For our custom video player, the primary methods we''ll focus on are:


    1\. `play()`: Initiates playback of the video.


    2\. `pause()`: Pauses the currently playing video.


    3\. `currentTime`: Represents the current playback time in seconds. It''s both
    a getter and setter, meaning you can set this to a specific value to seek to that
    time in the video.


