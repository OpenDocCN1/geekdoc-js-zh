    \  document.getElementById('count').innerText = count;\n  document.getElementById('total').innerText\
    \ = total;\n}\n// 在填充座位后调用此函数\nupdateSelectedCountAndTotal();\n```\n\n### 6. 最终思考\n\
    \n在开发应用程序时，始终考虑用户体验至关重要。通过用保存的数据填充用户界面，我们为用户节省了时间，并提供了连续性，尤其是当他们不得不离开页面再返回时。\n\
    \n在下一节中，我们将深入探讨自定义视频播放器以及如何利用 HTML5 Video API 的强大功能。敬请期待！\n\n# 第 4 节：项目 3 - 自定义视频播放器\
    \ | HTML5 Video API\n\n## 项目介绍\n\n在当今互联网驱动的世界中，视频内容是最强大、最有说服力的信息传递媒介之一。像 YouTube、Vimeo\
    \ 和其他媒体托管平台之所以蓬勃发展，是因为我们天生热爱视觉叙事。但是，作为一名 Web 开发者，你是否曾思考过播放按钮、音量滑块或全屏切换背后的魔力？自定义视频播放器正是这种魔力的核心。\n\
    \n欢迎来到项目 3：自定义视频播放器！这个项目不仅仅是把视频嵌入到网页中。在本模块结束时，你将创建一个根据你的设计量身定制的视频播放器，功能丰富，全部使用强大的\
    \ HTML5 Video API。\n\n## 为什么需要自定义视频播放器？\n\n1. 设计控制：你不受标准视频控件的限制。想要一个复古的音量旋钮而不是滑块？尽管去做！\n\
    2. 增强功能：添加速度控制、自定义字幕甚至视频书签系统等功能。\n3. 集成：将播放器与其他系统无缝集成，例如用于跟踪用户参与度的分析工具。\n\n##\
    \ 你将学到什么？\n\n- HTML5 视频元素：深入理解 `<video>` 元素、其属性及其能力。\n- 自定义控件：用你自己的播放、暂停、音量和全屏按钮替换浏览器的默认控件。\n\
    - 视频 API：利用 HTML5 Video API 以编程方式操控视频播放。\n- 样式化播放器：使用 CSS 为你的视频播放器设计样式，使其响应式且视觉吸引力强。\n\
    - 事件与交互：理解视频播放过程中触发的不同事件，并利用它们创建交互功能。\n\n## 项目概览\n\n在这个项目中，你将构建一个具有以下功能的自定义视频播放器：\n\
    \n1. 基本控件：播放、暂停、停止以及音量滑块。\n2. 播放进度：一个显示视频播放进度并允许用户跳转到不同部分的滑块。\n3. 时间戳：显示当前时间和视频总时长。\n\
    4. 全屏切换：允许用户切换到全屏模式。\n5. 响应式设计：确保播放器在所有设备上看起来都很棒。\n\n通过完成这个项目，你将深入到一个开发者在构建富媒体\
    \ Web 应用时遇到的真实任务。无论是用于个性化作品集、定制企业应用还是媒体创业想法，掌握自定义视频播放器都是一项能让你脱颖而出的技能。\n\n"
- fmt: "\nIn the subsequent chapters, we will break down the creation process into\
    \ digestible sections, covering the design, functionality, and best practices.\
    \ By the end, you'll have a fully functioning video player that you can be proud\
    \ of, with the skills and knowledge to customize it further as you see fit. Let's\
    \ dive in!\n\n# Project HTML\n\nWelcome to the next exciting phase of our project\
    \ series! In this chapter, we'll be laying the foundation for our Custom Video\
    \ Player project by setting up the HTML structure. This player will leverage the\
    \ HTML5 Video API, giving us capabilities to play, pause, skip, and more. But\
    \ before any of that, we need to build our HTML scaffold!\n\n## HTML5 Video Element\n\
    \nHTML5 introduced the `<video>` element which allows us to embed video files\
    \ that can be played directly in the browser without the need for external plugins.\
    \ Alongside the video element, there are multiple attributes and child elements\
    \ we can use to enhance the user experience, such as adding controls, setting\
    \ a poster image, or even providing multiple sources for different video formats.\n\
    \n## Setting Up the Basic Structure\n\nLet's dive in and create our HTML structure\
    \ for the video player.\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    \    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n    <title>Custom Video Player</title>\n    <!-- You'll\
    \ link your CSS here -->\n    <link rel=\"stylesheet\" href=\"styles.css\">\n\
    </head>\n<body>\n    <div class=\"video-container\">\n        <video id=\"video\"\
    \ width=\"750\" height=\"500\" controls>\n            <!-- Insert your video source(s)\
    \ here -->\n            <source src=\"path-to-your-video.mp4\" type=\"video/mp4\"\
    >\n            <!-- You can provide multiple sources for different video formats\
    \ -->\n            <source src=\"path-to-your-video.webm\" type=\"video/webm\"\
    >\n            <!-- Display text for browsers that don't support the video tag\
    \ -->\n            Your browser does not support the video tag.\n        </video>\n\
    \        <div class=\"controls\">\n            <button id=\"play-pause\">Play</button>\n\
    \            <input type=\"range\" id=\"volume\" min=\"0\" max=\"1\" step=\"0.1\"\
    >\n            <button id=\"full-screen\">Full-Screen</button>\n            <span\
    \ id=\"time\">00:00 / 00:00</span>\n        </div>\n    </div>\n    <!-- You'll\
    \ link your JavaScript here -->\n    <script src=\"script.js\"></script>\n</body>\n\
    </html>\n```\n\n## Explaining the Code\n\n- Video Container: This is a wrapping\
    \ `div` that contains the video and its custom controls. It will help in styling\
    \ and positioning.\n- Video Element: We've provided two `<source>` elements within\
    \ the `<video>` tag. This is to ensure maximum compatibility across browsers.\
    \ Different browsers might support different video formats, so by providing multiple\
    \ formats, we ensure that most users can view the video.\nThe `controls` attribute,\
    \ when present, displays the default browser controls for the video player. While\
    \ we'll be building our own custom controls, this is useful during the setup phase\
    \ to ensure our video is loading correctly.\n- Custom Controls: Underneath the\
    \ video, we have a `div` with a class of `controls`. This will contain our custom\
    \ controls for the video player, including:\n    - Play/Pause Button: A toggle\
    \ button to play or pause the video.\n    - Volume Control: An input range to\
    \ adjust the video's volume.\n    - Full-Screen Button: A button to toggle full-screen\
    \ mode.\n    - Time Display: A `span` to display the current time of the video\
    \ and its total duration.\n\n## Conclusion\n\nSetting up the HTML is the first\
    \ step in creating our Custom Video Player. This structure provides a foundation\
    \ upon which we'll build our styles and functionalities. In the upcoming chapters,\
    \ we will focus on styling this structure with CSS and then implementing the video\
    \ controls with JavaScript. The goal is to create a player that is both functional\
    \ and aesthetically pleasing, offering users an enhanced video playback experience.\n\
    \n# Project CSS\n\nWelcome back! Now that we've set up the HTML structure for\
    \ our custom video player in the previous chapter, it's time to style it and give\
    \ it an appealing look. CSS is the backbone of web aesthetics. In this chapter,\
    \ we'll focus on making our video player not just functional, but also user-friendly\
    \ and visually appealing.\n\n## 1. Basic Reset\n\nTo begin with, let's reset some\
    \ default styles. This will help us maintain consistency across browsers.\n\n\
    ```css\n* {\n    margin: 0;\n    padding: 0;\n    box-sizing: border-box;\n}\n\
    ```\n\n## 2. Setting Up the Container\n\nOur video player will sit inside a container.\
    \ This container will hold the video and the control bar.\n\n```css\n.video-container\
    \ {\n    width: 80%;\n    max-width: 800px;\n    margin: 40px auto;\n    position:\
    \ relative;\n    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);\n}\n```\n\n## 3. Styling\
    \ the Video Element\n\nThe `<video>` element will take up the entire width of\
    \ its container. We'll also give it a fixed height.\n\n```css\nvideo {\n    width:\
    \ 100%;\n    height: 450px;\n    display: block;\n}\n```\n\n## 4. Video Controls\n\
    \nBelow the video, we'll have our custom controls which will include play/pause\
    \ buttons, a progress bar, volume control, and full-screen toggling.\n\n```css\n\
    .video-controls {\n    display: flex;\n    align-items: center;\n    justify-content:\
    \ space-between;\n    background-color: 333;\n    color: fff;\n    padding: 10px\
    \ 15px;\n}\n```\n\n### 4.1 Buttons\n\nAll buttons will have a consistent style.\n\
    \n```css\n.video-controls button {\n    background: none;\n    border: none;\n\
    \    color: fff;\n    font-size: 16px;\n    margin-right: 15px;\n    cursor: pointer;\n\
    }\n```\n\nFor any active or hover state:\n\n```css\n.video-controls button.active,\n\
    .video-controls button:hover {\n    color: ff6347;\n}\n```\n\n### 4.2 Progress\
    \ Bar\n\nThe progress bar will show how much of the video has been played.\n\n\
    ```css\n.progress-bar {\n    flex: 1;\n    height: 5px;\n    background-color:\
    \ 555;\n    margin: 0 10px;\n    position: relative;\n}\n```\n\nFor the played\
    \ section:\n\n```css\n.progress-bar span {\n    display: block;\n    height: 100%;\n\
    \    background-color: ff6347;\n    position: absolute;\n    left: 0;\n    top:\
    \ 0;\n    width: 0%; /* This will be updated dynamically using JavaScript */\n\
    }\n```\n\n### 4.3 Volume Control\n\n```css\n.volume {\n    display: flex;\n  \
    \  align-items: center;\n}\n.volume-slider {\n    width: 100px;\n    margin-left:\
    \ 10px;\n}\n```\n\n## 5. Full Screen Styling\n\nWhen in full screen mode, we want\
    \ our video to occupy the entire viewport.\n\n```css\nvideo:-webkit-full-screen\
    \ {\n    width: 100vw;\n    height: 100vh;\n}\nvideo:fullscreen {\n    width:\
    \ 100vw;\n    height: 100vh;\n}\n```\n\nThat wraps up our styling for the custom\
    \ video player. As you can see, with just a bit of CSS, we've transformed our\
    \ raw HTML structure into a visually appealing and user-friendly video player.\
    \ In the next chapter, we'll dive into making this player functional by using\
    \ the HTML5 Video API and JavaScript.\n\n**Note:** Always remember to test your\
    \ styles across different browsers to ensure compatibility and consistent appearance.\
    \ Adjustments might be necessary based on browser-specific quirks.\n\n# Play,\
    \ Pause & Stop\n\nWelcome back, dear readers! In this chapter, we are going to\
    \ dive deep into the core functionalities of our Custom Video Player: play, pause,\
    \ and stop. These are basic yet crucial controls for any media player, and with\
    \ the help of the HTML5 Video API, implementing them is quite straightforward.\n\
    \n## Introduction to HTML5 Video API\n\nBefore diving into the coding section,\
    \ it's essential to understand the power of the HTML5 Video API. This API provides\
    \ a way to programmatically access and manipulate video content played back through\
    \ the `<video>` element in web pages. It exposes methods and properties that allow\
    \ developers to play, pause, adjust volume, and even check if a video has ended.\n\
    \nFor our custom video player, the primary methods we'll focus on are:\n\n1. `play()`:\
    \ Initiates playback of the video.\n2. `pause()`: Pauses the currently playing\
    \ video.\n3. `currentTime`: Represents the current playback time in seconds. It's\
    \ both a getter and setter, meaning you can set this to a specific value to seek\
    \ to that time in the video.\n\n## Setting up the HTML\n"
