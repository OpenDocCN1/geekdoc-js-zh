    Section 3:  Project 2 - Movie Seat Booking | DOM & Local Storage


    Project Intro


    Welcome to Project 2, where we’ll dive deep into the powerful capabilities of
    the Document Object Model (DOM) and the wonders of the Local Storage API. By the
    end of this project, you''ll have built a fully functional movie seat booking
    application, an asset to add to your growing web development portfolio.


    * * *


    Overview


    Imagine a world where every time you wanted to watch a movie, you’d simply load
    up your own app, select the movie, choose your preferred seats, and voila! The
    app would remember your choice, even if you accidentally closed it. Sounds great,
    right? That’s precisely what we’re building in this project.


    * * *


    Key Features


    1\. Dynamic Movie Selection: Display a list of movies with their prices and allow
    users to choose one.


    2\. Interactive Seat Map: A graphical representation of the movie theater, where
    users can click on individual seats to select or deselect them.


    3\. Seat Booking: Allow users to book their desired seats by clicking on them.
    Booked seats will have a different color or style to distinguish them from available
    seats.


    4\. Price Calculation: Display the total price based on the number of seats selected
    and the price of the chosen movie.


    5\. Local Storage Capabilities: Save the user’s movie and seat selection even
    if they close the browser. When they revisit, their choices should still be there.


    * * *


    What You Will Learn


    - DOM Manipulation: Learn how to interact with and modify web page elements in
    real-time, making your web applications interactive and dynamic.


    - Event Handling: Detect and respond to user actions, such as clicking on a seat
    or selecting a movie.


    - Using Local Storage: Store user data, such as their seat selection, on their
    own computer, ensuring that their preferences remain saved even after closing
    the browser.


    - Data Retrieval & Display: Retrieve data from Local Storage and display it appropriately
    when the user revisits the page.


    * * *


    Real-World Applications


    Beyond just being a fun project, understanding these concepts is crucial for building
    interactive web applications.


    - E-commerce sites use similar techniques for shopping carts, ensuring that your
    selected items remain in the cart even after navigating away.


    - Forms on many websites remember your input if you navigate away and come back,
    enhancing user experience.


    By mastering these concepts here, you’ll be well-equipped to tackle real-world
    challenges in web development.


    * * *


    Prerequisites


    Before diving into this project, it would be beneficial to have:


    1\. A basic understanding of HTML, CSS, and JavaScript. If you’re new to these,
    refer back to our foundational chapters or courses.


    2\. Familiarity with the basics of the DOM, particularly how to select and modify
    elements.


    * * *


    Conclusion


    This project is an exciting blend of front-end design with backend-like functionalities
    using pure front-end technologies. Not only will it boost your confidence in building
    real-world projects, but it will also be an excellent addition to your portfolio,
    showcasing your prowess in DOM manipulation and Local Storage.


    Project HTML


    Welcome to the heart of our second project: the Movie Seat Booking application.
    This project will give you practical experience working with the Document Object
    Model (DOM) and the Local Storage of a browser. But before we delve into the interactive
    JavaScript and CSS styling, we need to lay the groundwork with our HTML. This
    is where it all starts.


    * * *


    1\. Setting Up Our HTML Document


    To begin, let''s set up our basic HTML structure:


    ```html


    <!DOCTYPE html>


    <html lang="en">


    <head>


    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Movie Seat Booking</title>


    <link rel="stylesheet" href="styles.css">


    <script src="script.js" defer></script>


    </head>


    <body>


    </body>


    </html>


    ```


    This structure references an external stylesheet (`styles.css`) and an external
    JavaScript file (`script.js`). The `defer` attribute ensures our JavaScript won''t
    run until the HTML document is fully loaded.


    * * *


    2\. The Main Container


    Inside the body, our main content will reside within a centered container:


    ```html


    <div class="container">


    <!-- Content goes here -->


    </div>


    ```


    * * *


    3\. Adding a Title and Movie Selection


    First, let''s provide a title for our movie theater, followed by a dropdown menu
    for movie selection:


    ```html


    <h2>Select a Movie:</h2>


    <select id="movie">


    <option value="10">Avengers: Endgame ($10)</option>


    <option value="8">Joker ($8)</option>


    <option value="12">Frozen II ($12)</option>


    <option value="9">Toy Story 4 ($9)</option>


    </select>


    ```


    The `value` attribute for each movie represents its ticket price.


    * * *


    4\. Theater Layout


    For our theater layout, we''ll represent seats using div elements. Unoccupied
    seats will be clickable, allowing users to choose them. Once selected, the seat''s
    status will be updated to show that it''s occupied.


    ```html


    <div class="cinema">


    <!-- We''ll use repeated divs to denote individual seats -->


    <div class="row">


    <div class="seat"></div>


    <div class="seat"></div>


    <!-- Add more seats as required -->


    </div>


    <!-- Repeat rows as required -->


    </div>


    ```


    * * *


    5\. Information Display


    Beneath the cinema layout, we''ll provide an area to display information to the
    user:


    ```html


    <div class="info">


    <p>Total Tickets: <span id="ticketCount">0</span></p>


    <p>Total Price: $<span id="totalPrice">0</span></p>


    </div>


    ```


    The information display shows the number of tickets and the total price.


    * * *


    6\. Conclusion


    This sets the foundation for our movie seat booking app. With the HTML in place,
    we''ll be diving into the CSS to make our app visually appealing in the next chapter,
    followed by the JavaScript to give it dynamic functionality.


    Remember, a well-structured HTML will simplify the process when it comes to styling
    and adding interactivity. Think of this as building the skeleton of our application,
    upon which we''ll layer on the muscles (CSS) and the brain (JavaScript).


    In the next chapter, we''ll delve into the styling of this project. Make sure
    your HTML structure aligns with what we''ve covered here, as it will be crucial
    for our CSS and JavaScript to function correctly.


    Project CSS


    In this chapter, we''ll be diving deep into styling our Movie Seat Booking App
    using pure CSS. Our goal is to create an intuitive, engaging, and aesthetically
    pleasing user interface that aligns well with the functionality we will develop
    in the subsequent chapters.


    * * *


    CSS Structure:


    We will break down our styles into three main parts:


    1\. Base Styles: This is where we set up our foundational styles such as the app''s
    font, colors, and general layout.


    2\. Component Styles: These will include styles for specific components like buttons,
    seat selections, and movie dropdown.


    3\. Utility Styles: General utility styles that might be reused.


    * * *


