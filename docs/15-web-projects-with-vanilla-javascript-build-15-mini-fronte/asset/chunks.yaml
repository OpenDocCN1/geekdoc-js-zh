    # 第 1 节：简介


    ## 第 1 章：欢迎来到本课程


    首先，让我对你选择学习《使用原生 JavaScript 完成 15 个 Web 项目》表示诚挚的感谢。这本课程书是你步入 Web 开发世界的门户，你将使用
    Web 的基础工具：`HTML5`、`CSS` 和 `JavaScript` 来构建项目。当你翻开这本书时，你将开启一段沉浸式的旅程，这段旅程不仅承诺为你提供必要的技能，还将为你带来极具参与感的实践体验。


    ### 等待你的是什么？

    在接下来的几个章节中，我们将深入探讨一系列项目，每个项目都经过精心设计，以提供理论与实践的平衡结合。从创建表单验证器和自定义视频播放器，到构思像猜词游戏 (Hangman)
    和打砖块 (Breakout) 这样的游戏，每个项目的设计都旨在实现两个主要目标：

    1. 技能获取：确保你对 Web 开发的核心概念有具体的理解。

    2. 技能应用：使你能够将所学知识应用于实际场景中。


    ### 为什么是“原生” JavaScript？

    在 Web 开发的浩瀚海洋中，无数的框架和库承诺更快的开发速度和巧妙的功能。虽然这些对于资深开发者来说是极好的工具，但对于初学者来说，掌握纯 `JavaScript`
    的基础且原始的力量至关重要。通过专注于“原生” `JavaScript`，我们确保你理解 Web 脚本的核心，从而使你在未来更容易适应任何库或框架。


    ### 本课程书面向谁？

    本课程书面向广泛的受众：

    - 接触过 `HTML`、`CSS` 和 `JS` 并渴望构建项目的初学者。

    - 希望巩固理解并获得更多实践经验的中级开发者。

    - 寻求结构化 Web 开发教学课程的教育者和讲师。


    ### 如何最大限度地利用本课程书

    1. 积极跟随：由于这是一个基于项目的课程书，请始终准备好你的开发环境。亲手输入代码片段，尝试运行它们，尝试破坏它们，然后修复它们。

    2. 熟能生巧：在某些章节的末尾，我加入了一些可选练习。请参与其中以巩固你的理解。

    3. 保持好奇心：每当引入一个新概念时，花点时间进一步探索。你越是挑战自己，就越能掌握 Web 开发的细微之处。


    ### 前置要求

    虽然本课程书旨在提供全面的指导，但具备 `HTML`、`CSS` 和 `JS` 的基础知识将大有裨益。如果你是完全的初学者，我建议先学习我在 Udemy 上的“Modern
    HTML/CSS From The Beginning”和“Modern JS From The Beginning”课程。这将为你应对本课程书中的项目打下坚实的基础。


    ### 总结

    请记住，每一位程序员，无论多么熟练，都是从零开始的。只要有耐心、毅力和正确的资源，你也可以在 Web 开发领域开辟出自己的天地。


    现在，当我们站在这段激动人心旅程的起点时，请深呼吸，卷起袖子，让我们一起潜入原生 `JavaScript` Web 项目的世界吧！


    ## 第 2 章：环境搭建


    欢迎来到我们探索 Web 开发世界的激动人心之旅的第一步！在深入研究我们将要处理的各种项目之前，确保我们的开发环境正确配置至关重要。本章将引导你完成本书项目中所需的所有工具和软件的安装与配置。


    ### 2.1. 系统要求

    在开始之前，请确保你的计算机具备：

    - Windows、macOS 或 Linux 等操作系统。

