    Ball-Brick Collision Detection


    To make our game interactive, we''ll now make the ball break bricks when they
    collide.


    1\. Define the Bricks


    First, let''s define our bricks:


    ```javascript


    const brickRowCount = 5;


    const brickColumnCount = 3;


    const brickWidth = 75;


    const brickHeight = 20;


    const brickPadding = 10;


    const brickOffsetTop = 30;


    const brickOffsetLeft = 30;


    const bricks = [];


    for(let c=0; c<brickColumnCount; c++) {


    bricks[c] = [];


    for(let r=0; r<brickRowCount; r++) {


    bricks[c][r] = { x: 0, y: 0, status: 1 };


    }


    }


    ```


    Here, `status: 1` indicates the brick is unbroken. Once broken by the ball, we''ll
    change it to `status: 0`.


    2\. Collision Detection


    For every frame, we need to check if the ball collides with any of the bricks:


    ```javascript


    function collisionDetection() {


    for(let c=0; c<brickColumnCount; c++) {


    for(let r=0; r<brickRowCount; r++) {


