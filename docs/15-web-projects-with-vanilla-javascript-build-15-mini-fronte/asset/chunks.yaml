  trans: "\n在接下来的章节中，我们将把创建过程分解为易于理解的部分，涵盖设计、功能和最佳实践。最后，你将拥有一个功能完备的视频播放器，并掌握根据自身需求进一步定制的技能和知识。让我们开始吧！\n\
    \n# 项目 HTML\n\n欢迎来到我们项目系列的下一个激动人心的阶段！在本章中，我们将通过搭建 HTML 结构来为自定义视频播放器项目奠定基础。该播放器将利用\
    \ HTML5 视频 API，使我们能够实现播放、暂停、快进等功能。但在那之前，我们需要先构建 HTML 脚手架！\n\n## HTML5 视频元素\n\n\
    HTML5 引入了 `<video>` 元素，它允许我们嵌入视频文件，这些文件可以直接在浏览器中播放，无需外部插件。除了视频元素本身，我们还可以使用多种属性和子元素来增强用户体验，例如添加控件、设置海报图像，甚至为不同视频格式提供多个源文件。\n\
    \n## 搭建基本结构\n\n让我们开始为视频播放器创建 HTML 结构。\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1.0\">\n    <title>自定义视频播放器</title>\n    <!--\
    \ 你将在此处链接 CSS -->\n    <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n\
    <body>\n    <div class=\"video-container\">\n        <video id=\"video\" width=\"\
    750\" height=\"500\" controls>\n            <!-- 在此处插入你的视频源 -->\n            <source\
    \ src=\"path-to-your-video.mp4\" type=\"video/mp4\">\n            <!-- 你可以为不同视频格式提供多个源文件\
    \ -->\n            <source src=\"path-to-your-video.webm\" type=\"video/webm\"\
    >\n            <!-- 为不支持 video 标签的浏览器显示文本 -->\n            你的浏览器不支持 video 标签。\n\
    \        </video>\n        <div class=\"controls\">\n            <button id=\"\
    play-pause\">播放</button>\n            <input type=\"range\" id=\"volume\" min=\"\
    0\" max=\"1\" step=\"0.1\">\n            <button id=\"full-screen\">全屏</button>\n\
    \            <span id=\"time\">00:00 / 00:00</span>\n        </div>\n    </div>\n\
    \    <!-- 你将在此处链接 JavaScript -->\n    <script src=\"script.js\"></script>\n</body>\n\
    </html>\n```\n\n## 代码解释\n\n-   视频容器：这是一个包裹 `div`，包含视频及其自定义控件。它将有助于样式设置和定位。\n-\
    \   视频元素：我们在 `<video>` 标签内提供了两个 `<source>` 元素。这是为了确保跨浏览器的最大兼容性。不同浏览器可能支持不同的视频格式，因此通过提供多种格式，我们确保大多数用户都能观看视频。\n\
    \    `controls` 属性存在时，会显示视频播放器的默认浏览器控件。虽然我们将构建自己的自定义控件，但在设置阶段，这对于确保视频正确加载非常有用。\n\
    -   自定义控件：在视频下方，我们有一个类名为 `controls` 的 `div`。它将包含我们视频播放器的自定义控件，包括：\n    -   播放/暂停按钮：用于播放或暂停视频的切换按钮。\n\
    \    -   音量控制：用于调整视频音量的输入范围滑块。\n    -   全屏按钮：用于切换全屏模式的按钮。\n    -   时间显示：一个 `span`，用于显示视频的当前时间和总时长。\n\
    \n## 结论\n\n设置 HTML 是创建自定义视频播放器的第一步。这个结构为我们后续构建样式和功能提供了基础。在接下来的章节中，我们将专注于使用 CSS\
    \ 为这个结构设置样式，然后使用 JavaScript 实现视频控件。目标是创建一个既实用又美观的播放器，为用户提供增强的视频播放体验。\n\n# 项目 CSS\n\
    \n欢迎回来！既然我们在上一章中已经为自定义视频播放器搭建了 HTML 结构，现在是时候为其设置样式，赋予它一个吸引人的外观了。CSS 是网页美学的支柱。在本章中，我们将专注于让我们的视频播放器不仅功能完善，而且用户友好、视觉美观。\n\
    \n## 1. 基础重置\n\n首先，让我们重置一些默认样式。这将有助于我们在不同浏览器之间保持一致性。\n\n```css\n* {\n    margin:\
    \ 0;\n    padding: 0;\n    box-sizing: border-box;\n}\n```\n\n## 2. 设置容器\n\n我们的视频播放器将位于一个容器内。该容器将容纳视频和控制栏。\n\
    \n```css\n.video-container {\n    width: 80%;\n    max-width: 800px;\n    margin:\
    \ 40px auto;\n    position: relative;\n    box-shadow: 0 4px 8px rgba(0, 0, 0,\
    \ 0.1);\n}\n```\n\n## 3. 设置视频元素样式\n\n`<video>` 元素将占据其容器的整个宽度。我们还会给它一个固定的高度。\n\n\
    ```css\nvideo {\n    width: 100%;\n    height: 450px;\n    display: block;\n}\n\
    ```\n\n## 4. 视频控件\n\n在视频下方，我们将放置自定义控件，包括播放/暂停按钮、进度条、音量控制和全屏切换。\n\n```css\n.video-controls\
    \ {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n\
    \    background-color: 333;\n    color: fff;\n    padding: 10px 15px;\n}\n```\n\
    \n### 4.1 按钮\n\n所有按钮将具有一致的样式。\n\n```css\n.video-controls button {\n    background:\
    \ none;\n    border: none;\n    color: fff;\n    font-size: 16px;\n    margin-right:\
    \ 15px;\n    cursor: pointer;\n}\n```\n\n对于任何激活或悬停状态：\n\n```css\n.video-controls\
    \ button.active,\n.video-controls button:hover {\n    color: ff6347;\n}\n```\n\
    \n### 4.2 进度条\n\n进度条将显示视频已播放了多少。\n\n```css\n.progress-bar {\n    flex: 1;\n  \
    \  height: 5px;\n    background-color: 555;\n    margin: 0 10px;\n    position:\
    \ relative;\n}\n```\n\n对于已播放的部分：\n\n```css\n.progress-bar span {\n    display:\
    \ block;\n    height: 100%;\n    background-color: ff6347;\n    position: absolute;\n\
    \    left: 0;\n    top: 0;\n    width: 0%; /* 这将通过 JavaScript 动态更新 */\n}\n```\n\
    \n### 4.3 音量控制\n\n```css\n.volume {\n    display: flex;\n    align-items: center;\n\
    }\n.volume-slider {\n    width: 100px;\n    margin-left: 10px;\n}\n```\n\n## 5.\
    \ 全屏样式\n\n在全屏模式下，我们希望视频占据整个视口。\n\n```css\nvideo:-webkit-full-screen {\n    width:\
    \ 100vw;\n    height: 100vh;\n}\nvideo:fullscreen {\n    width: 100vw;\n    height:\
    \ 100vh;\n}\n```\n\n至此，我们完成了自定义视频播放器的样式设置。如你所见，只需少量 CSS，我们就将原始的 HTML 结构转变成了一个视觉美观且用户友好的视频播放器。在下一章中，我们将深入探讨如何使用\
    \ HTML5 视频 API 和 JavaScript 让这个播放器具备功能。\n\n**注意：** 始终记得在不同浏览器中测试你的样式，以确保兼容性和外观一致性。可能需要根据特定浏览器的特性进行调整。\n\
    \n# 播放、暂停与停止\n\n欢迎回来，亲爱的读者们！在本章中，我们将深入探讨自定义视频播放器的核心功能：播放、暂停和停止。这些是任何媒体播放器基本但至关重要的控件，借助\
    \ HTML5 视频 API，实现它们相当直接。\n\n## HTML5 视频 API 简介\n\n在深入编码部分之前，理解 HTML5 视频 API 的强大功能至关重要。该\
    \ API 提供了一种以编程方式访问和操作通过网页中 `<video>` 元素播放的视频内容的方法。它公开了方法和属性，允许开发者播放、暂停、调整音量，甚至检查视频是否已结束。\n\
    \n对于我们的自定义视频播放器，我们将主要关注以下方法：\n\n1.  `play()`：开始播放视频。\n2.  `pause()`：暂停当前正在播放的视频。\n\
    3.  `currentTime`：表示当前播放时间（以秒为单位）。它既是 getter 也是 setter，意味着你可以将其设置为特定值，以跳转到视频中的该时间点。\n\
    \n## 设置 HTML\n\n"
- fmt: "\n# Video Player Implementation\n\nLet's assume you have the following HTML\
    \ structure for your video player:\n\n```html\n<div class=\"video-container\"\
    >\n  <video id=\"videoPlayer\" width=\"640\" height=\"360\" controls>\n    <source\
    \ src=\"path_to_your_video.mp4\" type=\"video/mp4\">\n    Your browser does not\
    \ support the video tag.\n  </video>\n  <div class=\"controls\">\n    <button\
    \ id=\"playBtn\">Play</button>\n    <button id=\"pauseBtn\">Pause</button>\n \
    \   <button id=\"stopBtn\">Stop</button>\n  </div>\n</div>\n```\n\n## Implementing\
    \ Play, Pause & Stop functionalities\n\n1. **Play Video**:\nTo play the video,\
    \ we need to target our video element and call the `play()` method.\n\n```javascript\n\
    const video = document.getElementById('videoPlayer');\ndocument.getElementById('playBtn').addEventListener('click',\
    \ function() {\n  video.play();\n});\n```\n\n2. **Pause Video**:\nPausing the\
    \ video is just as simple. Target the video element and call the `pause()` method.\n\
    \n```javascript\ndocument.getElementById('pauseBtn').addEventListener('click',\
    \ function() {\n  video.pause();\n});\n```\n\n3. **Stop Video**:\nStopping the\
    \ video involves two steps:\n1. Pause the video.\n2. Reset the video's `currentTime`\
    \ to `0` (i.e., the beginning).\n\n```javascript\ndocument.getElementById('stopBtn').addEventListener('click',\
    \ function() {\n  video.pause();\n  video.currentTime = 0;\n});\n```\n\n## Enhancing\
    \ UX with Play/Pause Toggle\n\nOften, video players combine the play and pause\
    \ functionality into one button. Let's create a toggle function for this:\n\n\
    1. **Modify the HTML**:\n```html\n<button id=\"togglePlayPauseBtn\">Play</button>\n\
    ```\n\n2. **JavaScript**:\n```javascript\nconst togglePlayPauseBtn = document.getElementById('togglePlayPauseBtn');\n\
    togglePlayPauseBtn.addEventListener('click', function() {\n  if (video.paused)\
    \ {\n    video.play();\n    togglePlayPauseBtn.innerText = \"Pause\";\n  } else\
    \ {\n    video.pause();\n    togglePlayPauseBtn.innerText = \"Play\";\n  }\n});\n\
    ```\n\n## Wrapping Up\n\nWith the HTML5 Video API, implementing play, pause, and\
    \ stop functionality becomes a walk in the park. The API offers a wide range of\
    \ methods and properties that can help developers create robust and feature-rich\
    \ video players.\n\nIn the next chapter, we'll dive into enhancing our video player's\
    \ user experience by adding a progress bar and a timestamp, allowing users to\
    \ visually see the playback status and duration of the video.\n\nRemember, practice\
    \ makes perfect! Don't hesitate to play around with the code, try different functionalities,\
    \ and make this video player truly your own. Happy coding!\n\n# Video Progress\
    \ Bar & Timestamp\n\nWelcome to Chapter 19! In this chapter, we’ll explore two\
    \ critical elements of a custom video player – the progress bar and timestamp.\
    \ Both of these enhance the user experience, allowing viewers to know the video's\
    \ progress and control playback.\n\n## 1. Understanding the Video API\n\nBefore\
    \ diving into the coding part, it’s essential to understand the HTML5 Video API\
    \ a bit. The Video API offers properties like `currentTime` (current playback\
    \ position, in seconds) and `duration` (total video duration, in seconds). These\
    \ properties will be crucial for our progress bar and timestamp functionality.\n\
    \n## 2. HTML Structure\n\nFor our custom video player, let's consider you already\
    \ have the following basic HTML structure from the previous chapters:\n\n```html\n\
    <video id=\"video\" width=\"750\" controls>\n  <source src=\"path_to_video.mp4\"\
    \ type=\"video/mp4\">\n</video>\n<div id=\"video-controls\">\n  <div id=\"progress-bar\"\
    >\n    <div id=\"progress\"></div>\n  </div>\n  <span id=\"timestamp\">00:00 /\
    \ 00:00</span>\n</div>\n```\n\nHere, `progress-bar` is the container, and `progress`\
    \ is the fill that'll show video playback progress. The `timestamp` will display\
    \ the current time and total video duration.\n\n## 3. CSS for Progress Bar\n\n\
    Before adding functionality, ensure the progress bar looks right:\n\n```css\n\
    .progress-bar {\n  width: 90%;\n  height: 5px;\n  background: #e0e0e0;\n  margin:\
    \ 10px auto;\n  position: relative;\n}\n.progress {\n  height: 5px;\n  background:\
    \ #007BFF;\n  width: 0;\n}\n```\n\n## 4. JavaScript Functionality\n\nNow, let’s\
    \ dive into the fun part – the JavaScript!\n\n### a. Progress Bar\nWe want the\
    \ progress bar to fill up as the video plays:\n\n```javascript\nconst video =\
    \ document.getElementById('video');\nconst progressBar = document.getElementById('progress-bar');\n\
    const progress = document.getElementById('progress');\nvideo.addEventListener('timeupdate',\
    \ updateProgressBar);\n\nfunction updateProgressBar() {\n  const percentage =\
    \ (video.currentTime / video.duration) * 100;\n  progress.style.width = `${percentage}%`;\n\
    }\n```\n\n### b. Timestamp\nTo update the timestamp:\n\n```javascript\nconst timestamp\
    \ = document.getElementById('timestamp');\nvideo.addEventListener('timeupdate',\
    \ updateTimestamp);\n\nfunction updateTimestamp() {\n  const minutesCurrent =\
    \ Math.floor(video.currentTime / 60);\n  let secondsCurrent = Math.floor(video.currentTime\
    \ % 60);\n  if (secondsCurrent < 10) {\n    secondsCurrent = '0' + secondsCurrent;\n\
    \  }\n  const minutesDuration = Math.floor(video.duration / 60);\n  let secondsDuration\
    \ = Math.floor(video.duration % 60);\n  if (secondsDuration < 10) {\n    secondsDuration\
    \ = '0' + secondsDuration;\n  }\n  timestamp.textContent = `${minutesCurrent}:${secondsCurrent}\
    \ / ${minutesDuration}:${secondsDuration}`;\n}\n```\n\n## 5. Seeking Functionality\n\
    \nLet's add the ability for users to click on the progress bar to seek to different\
    \ parts of the video:\n\n```javascript\nprogressBar.addEventListener('click',\
    \ setVideoProgress);\n\nfunction setVideoProgress(e) {\n  const clickPosition\
    \ = e.offsetX;\n  const width = progressBar.offsetWidth;\n  const clickPercentage\
    \ = (clickPosition / width);\n  video.currentTime = clickPercentage * video.duration;\n\
    }\n```\n\n## 6. Recap\n\nBy now, you have a functional progress bar that fills\
    \ up as the video plays and a timestamp that updates in real-time. The user can\
    \ also click on the progress bar to seek the video, enhancing user control and\
    \ experience.\n\n# Project 4 - Exchange Rate Calculator | Fetch & JSON Intro\n\
    \n## Project Intro\n\nWelcome to Project 4, the Exchange Rate Calculator! In this\
    \ project, we will embark on a journey to create a utility tool that can be widely\
    \ used in daily life. Whether you’re traveling, investing, or just curious about\
    \ the world economy, an exchange rate calculator provides essential information\
    \ about currency values in different countries.\n\n### Objective\nBy the end of\
    \ this project, you will have built an interactive web application that retrieves\
    \ real-time exchange rates for various currencies and performs calculations to\
    \ convert amounts between these currencies. This will be done using pure vanilla\
    \ JavaScript, giving you a hands-on experience with the `Fetch API` and `JSON`\
    \ data manipulation.\n\n### Project Overview\nHere's a sneak peek into what we\
    \ will be developing:\n1. **User Interface**: A sleek and intuitive design with\
    \ dropdowns for selecting currencies and an input for the amount to convert.\n\
    2. **Real-time Data**: We'll fetch real-time exchange rates from a free API.\n\
    3. **Conversion Logic**: Convert input currency to the desired output currency\
    \ and display the result.\n4. **Error Handling**: Implement proper error checking\
    \ and handling to ensure a seamless user experience.\n\n### Skills & Techniques\
    \ to be Acquired\n- `Fetch API`: Understand how to make asynchronous requests\
    \ to retrieve real-time data.\n- `JSON` Data Handling: Work with `JSON` responses\
    \ to extract, manipulate, and use data in our application.\n- Dynamic DOM Manipulation:\
    \ Populate dropdowns with available currencies, display real-time conversion rates,\
    \ and more.\n- Error Handling: Create user-friendly error messages for issues\
    \ like network errors or invalid data.\n\n### Why This Project?\nThe Exchange\
    \ Rate Calculator will not just be another project in your portfolio; it showcases\
    \ your ability to build practical real-world applications. It emphasizes:\n1.\
    \ **Utility**: Creating something that people can use in their daily lives.\n\
    2. **Data Manipulation**: Working with live data feeds and displaying them dynamically.\n"
