    < brick.y + brickHeight) {


    ball.dy = -ball.dy;


    brick.status = 0;


    }


    }


    }


    }


    }


    ```


    When a collision is detected, we reverse the `dy` direction of the ball and set
    the `status` of the brick to `0`, indicating it''s been broken.


