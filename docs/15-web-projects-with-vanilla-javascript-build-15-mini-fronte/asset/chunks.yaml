    \ translate(-50%, -50%);\n  z-index: 1000;\n}\n```\n\n* * *\n\n### 第 4 节：显示和隐藏加载器\n\
    \n使用 JavaScript，你可以轻松控制加载器的可见性。在获取帖子时，将其样式设置为 `display: block`，完成后设置为 `display:\
    \ none`。\n\n```javascript\n// 假设你已经通过查询选择了加载器\nconst loader = document.querySelector('.loader');\n\
    \n// 显示加载器\nloader.style.display = 'block';\n\n// 隐藏加载器\nloader.style.display\
    \ = 'none';\n```\n\n这样，我们的加载器只在获取过程中可见，确保用户不会受到不必要的干扰。\n\n* * *\n\n## 结论\n\nCSS\
    \ 在增强用户体验方面起着至关重要的作用，尤其是对于像无限滚动帖子项目这样的 Web 应用程序。通过视觉上吸引人的设计和流畅的加载器动画，我们让用户体验变得愉悦且直观。\n\
    \n在下一章中，我们将专注于获取初始帖子并用内容填充页面。这将是我们结合 CSS 设计与动态 JavaScript 功能真正发挥魔力的地方。敬请期待！\n\n\
    ## 从 API 获取初始帖子\n\n在我们的“无限滚动帖子”项目中，实现无限滚动功能之前的第一步是从 API 获取初始帖子。在本章中，我们将深入探讨如何使用\
    \ `Fetch` API 和 `Async/Await` 从外部 API 获取帖子。开始之前，请确保你已经按照前面章节的描述正确设置了项目结构。\n\n\
    * * *\n\n### 为什么使用带有 Async/Await 的 Fetch API？\n\nJavaScript 的 `Fetch` API 提供了一种更简单的方式向服务器发起网络请求。当与\
    \ `Async/Await` 结合使用时，`Fetch` 变得更加强大，允许我们编写看起来和行为都像同步代码的异步代码，使其更易于阅读和维护。\n\n*\
    \ * *\n\n### 设置 API 端点\n\n在本教程中，让我们使用 `jsonplaceholder` 免费的假在线 REST API，它提供了一组我们可以检索的帖子：\n\
    \nAPI 端点：`https://jsonplaceholder.typicode.com/posts`\n\n* * *\n\n### 使用 Async/Await\
    \ 编写 Fetch 函数\n\n```javascript\nasync function getInitialPosts() {\n  try {\n\
    \    const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');\n\
    \    const data = await response.json();\n    return data;\n  } catch (error)\
    \ {\n    console.error(\"获取帖子时出错\", error);\n  }\n}\n```\n\n* * *\n\n### 理解函数\n\
    \n- 我们将函数 `getInitialPosts` 声明为 `async`。这确保该函数返回一个 promise。\n- 在函数内部，我们使用 `try...catch`\
    \ 块来处理任何潜在的错误。\n- 我们使用 API 端点调用 `fetch` 函数。为了确保初始不会获取太多帖子，我们使用查询参数 `_limit=5`\
    \ 将帖子数量限制为 5。\n- 使用 `await` 关键字暂停函数的执行，直到 promise 解决并返回其结果。这使得我们的异步代码看起来像同步代码。\n\
    - 一旦数据被获取，我们使用 `response.json()` 方法将其转换为 JSON。\n- 如果一切顺利，该函数将返回获取的帖子作为 JSON 数组。\n\
    \n* * *\n\n### 显示帖子\n\n一旦我们获取了帖子，就需要将它们显示在页面上。让我们添加另一个函数来处理这个任务。\n\n```javascript\n\
    function displayPosts(posts) {\n  const postContainer = document.getElementById('posts');\n\
    \  posts.forEach(post => {\n    const postElement = document.createElement('div');\n\
    \    postElement.classList.add('post');\n    postElement.innerHTML = `\n     \
    \ <h2 class=\"post-title\">${post.title}</h2>\n      <p class=\"post-body\">${post.body}</p>\n\
    \    `;\n    postContainer.appendChild(postElement);\n  });\n}\n```\n\n要使用这个函数：\n\
    \n```javascript\ngetInitialPosts().then(posts => {\n  displayPosts(posts);\n});\n\
    ```\n\n* * *\n\n## 结论\n\n"
- fmt: "\nIn this chapter, we covered how to use the Fetch API combined with Async/Await\
    \ to retrieve initial posts from an API endpoint. We also looked at how to display\
    \ these posts on our webpage. In the next chapter, we will add the infinite scrolling\
    \ feature, which will load more posts as the user scrolls down the page.\n\nRemember,\
    \ while `jsonplaceholder` is great for learning and testing, in a real-world application,\
    \ you'd be working with your own backend or a third-party service that provides\
    \ the content you need. Always ensure you handle errors gracefully to enhance\
    \ the user experience.\n\n## Add Infinite Scrolling\n\nWelcome to Chapter 61!\
    \ Here, we'll be implementing one of the most sought-after features on modern\
    \ websites: Infinite Scrolling. This technique enhances user experience by continuously\
    \ loading content as users scroll, removing the need for pagination buttons. To\
    \ achieve this, we'll harness the power of Fetch and Async/Await in conjunction\
    \ with some CSS magic. Let's dive in!\n\n* * *\n\n### 1. Understanding Infinite\
    \ Scrolling\n\nInfinite scrolling is a web design technique that loads content\
    \ continuously as the user scrolls down the page, eliminating the need for pagination.\
    \ It's widely used in social media platforms, blogs, and news websites to improve\
    \ user engagement. The principle is simple: as the user approaches the bottom\
    \ of the content, more content is fetched and appended.\n\n* * *\n\n### 2. Setting\
    \ up the Environment\n\nBefore implementing infinite scrolling, ensure you have:\n\
    \n- An API or data source from which you can fetch posts or data.\n- A container\
    \ in your HTML to display the fetched data.\n- Basic styling for the loader animation\
    \ (Refer to Chapter 59 for the CSS & Loader Animation).\n\n* * *\n\n### 3. Listening\
    \ for Scroll Events\n\nTo detect when the user is near the bottom of the page,\
    \ we'll use the `scroll` event.\n\n```javascript\nwindow.addEventListener('scroll',\
    \ () => {\n  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight\
    \ - 10) {\n    loadMorePosts();\n  }\n});\n```\n\nThe condition inside the event\
    \ checks if the combined height of the viewport and the scroll offset is greater\
    \ than or equal to the height of the entire document minus a small threshold (10\
    \ pixels in this case).\n\n* * *\n\n### 4. Fetching More Posts\n\nThe `loadMorePosts`\
    \ function will handle the fetching of more posts.\n\n```javascript\nasync function\
    \ loadMorePosts() {\n  // Display the loader animation\n  showLoader();\n\n  //\
    \ Delay to simulate fetching data\n  await setTimeout(() => {}, 1000);\n\n  //\
    \ Fetch the next set of posts\n  const response = await fetch('YOUR_API_ENDPOINT_HERE');\n\
    \  const data = await response.json();\n\n  // Render the fetched posts\n  displayPosts(data);\n\
    \n  // Hide the loader animation\n  hideLoader();\n}\n```\n\nHere, `showLoader()`\
    \ and `hideLoader()` are functions to handle displaying and hiding the loader\
    \ animation, respectively. Ensure to replace `'YOUR_API_ENDPOINT_HERE'` with your\
    \ actual API endpoint.\n\n* * *\n\n### 5. Appending the Posts\n\nWithin the `displayPosts`\
    \ function, iterate over the fetched data and append each post to your container.\n\
    \n```javascript\nfunction displayPosts(posts) {\n  posts.forEach(post => {\n \
    \   const postElement = document.createElement('div');\n    postElement.classList.add('post');\n\
    \    postElement.innerHTML = `\n      <h2>${post.title}</h2>\n      <p>${post.body}</p>\n\
    \    `;\n    document.querySelector('.posts-container').appendChild(postElement);\n\
    \  });\n}\n```\n\nEnsure you have a `.posts-container` or similar in your HTML\
    \ to append these posts to.\n\n* * *\n\n### 6. Handling Edge Cases\n\nFor a seamless\
    \ user experience:\n\n- Handle cases where there's no more content to fetch. Inform\
    \ the user accordingly.\n- Ensure the loader doesn't get stuck if there's an error\
    \ during fetching.\n- Adjust the threshold (10 pixels in our case) depending on\
    \ your content's structure and the desired user experience.\n\n* * *\n\n### Conclusion\n\
    \nInfinite scrolling is a powerful technique for improving user engagement on\
    \ content-rich websites. By utilizing modern JavaScript features like Fetch and\
    \ Async/Await, we can easily implement this functionality in our web projects.\
    \ Always remember to handle edge cases and provide feedback to users for a seamless\
    \ browsing experience.\n\n**Note:** This chapter assumes you have a basic understanding\
    \ of Fetch API, Async/Await, and CSS animations. If not, kindly revisit the previous\
    \ chapters for a thorough understanding. The code provided is a basic implementation\
    \ and might require adjustments based on the specifics of your project and API.\n\
    \n## Filter Fetched Posts\n\nWelcome back to the \"Infinite Scroll Posts\" project.\
    \ Having already fetched posts and implemented infinite scrolling, our next goal\
    \ is to introduce a functionality that allows users to filter through the fetched\
    \ posts. This will enhance user experience by enabling them to find specific posts\
    \ quickly.\n\n**Objective:** Implement a filtering functionality that allows users\
    \ to search through the fetched posts based on titles and content.\n\n* * *\n\n\
    ### Prerequisites:\n\n1. A working knowledge of JavaScript, particularly ES6+\
    \ features such as Async/Await.\n2. Familiarity with the DOM (Document Object\
    \ Model) and manipulating it with JavaScript.\n3. Previous chapters in this project\
    \ where we set up fetching posts and infinite scrolling.\n\n* * *\n\n### Step\
    \ 1: Setting up the Filter Input Field\n\nWe need an input field where users can\
    \ type search queries:\n\n```html\n<input type=\"text\" id=\"filter\" placeholder=\"\
    Filter posts...\">\n```\n\n* * *\n\n### Step 2: JavaScript Implementation\n\n\
    #### a. Accessing the Input Element\n\nAccess the input element using the DOM:\n\
    \n```javascript\nconst filterInput = document.getElementById('filter');\n```\n\
    \n#### b. Event Listener\n\nWe'll attach an event listener to the input element\
    \ to detect when the user types:\n\n```javascript\nfilterInput.addEventListener('input',\
    \ filterPosts);\n```\n\n#### c. Filtering Function\n\nThis function is the core\
    \ of our filtering feature:\n\n```javascript\nfunction filterPosts(e) {\n  const\
    \ searchTerm = e.target.value.toUpperCase(); // Convert input to uppercase for\
    \ non-case sensitive search\n  const posts = document.querySelectorAll('.post');\
    \ // Assume each post has a class of 'post'\n\n  posts.forEach(post => {\n   \
    \ const postTitle = post.querySelector('.post-title').innerText.toUpperCase();\n\
    \    const postContent = post.querySelector('.post-content').innerText.toUpperCase();\n\
    \n    // Check if search term exists in post title or content\n    if (postTitle.indexOf(searchTerm)\
    \ > -1 || postContent.indexOf(searchTerm) > -1) {\n      post.style.display =\
    \ 'block';\n    } else {\n      post.style.display = 'none';\n    }\n  });\n}\n\
    ```\n\n**Explanation:**\n\n- We're using the `input` event, which fires every\
    \ time the `value` of the input field changes.\n- Within the `filterPosts` function:\n\
    \  - Convert the search term to uppercase to ensure our search is not case-sensitive.\n\
    \  - We select all posts. For this example, I've assumed each post has a class\
    \ of `'post'`.\n  - For each post, we check if the search term exists in its title\
    \ or content. If it does, we display the post; otherwise, we hide it.\n\n* * *\n\
    \n### Step 3: Enhancements\n\n#### a. Adding a Delay\n\nInstant filtering can\
    \ be jarring, especially with larger datasets. Consider adding a delay using `setTimeout`.\n\
    \n#### b. Spinner or Loader\n\nIf filtering takes time, showing a spinner can\
    \ enhance user experience. You can reuse the CSS loader implemented in previous\
    \ chapters.\n\n#### c. Highlighting Matched Text\n\nEnhance user experience by\
    \ highlighting the matched text within the post. This can be achieved using `Regex`\
    \ and manipulating the `innerHTML` property of post elements.\n\n* * *\n\n###\
    \ Conclusion\n\nFiltering is a powerful feature that greatly enhances user experience,\
    \ allowing users to quickly and efficiently find the information they're looking\
    \ for. With the implementation above, users of your infinite scroll post project\
    \ can now search through posts with ease.\n\n## Section 12: Project 11 - Speech\
    \ Text Reader | Speech Synthesis\n\n### Project Intro\n"
  raw: 'In this chapter, we covered how to use the Fetch API combined with Async/Await
    to retrieve initial posts from an API endpoint. We also looked at how to display
    these posts on our webpage. In the next chapter, we will add the infinite scrolling
    feature, which will load more posts as the user scrolls down the page.


    Remember, while `jsonplaceholder` is great for learning and testing, in a real-world
    application, you''d be working with your own backend or a third-party service
    that provides the content you need. Always ensure you handle errors gracefully
    to enhance the user experience.


    Add Infinite Scrolling


    Welcome to Chapter 61! Here, we''ll be implementing one of the most sought-after
    features on modern websites: Infinite Scrolling. This technique enhances user
    experience by continuously loading content as users scroll, removing the need
    for pagination buttons. To achieve this, we''ll harness the power of Fetch and
    Async/Await in conjunction with some CSS magic. Let''s dive in!


    * * *


    1\. Understanding Infinite Scrolling


    Infinite scrolling is a web design technique that loads content continuously as
    the user scrolls down the page, eliminating the need for pagination. It''s widely
    used in social media platforms, blogs, and news websites to improve user engagement.
    The principle is simple: as the user approaches the bottom of the content, more
    content is fetched and appended.


    * * *


    2\. Setting up the Environment


    Before implementing infinite scrolling, ensure you have:


    - An API or data source from which you can fetch posts or data.


    - A container in your HTML to display the fetched data.


    - Basic styling for the loader animation (Refer to Chapter 59 for the CSS & Loader
    Animation).


    * * *


    3\. Listening for Scroll Events


    To detect when the user is near the bottom of the page, we''ll use the `scroll`
    event.


    ```javascript


    window.addEventListener(''scroll'', () => {


    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight
    - 10) {


    loadMorePosts();


    }


    });


    ```


    The condition inside the event checks if the combined height of the viewport and
    the scroll offset is greater than or equal to the height of the entire document
    minus a small threshold (10 pixels in this case).


    * * *


    4\. Fetching More Posts


    The `loadMorePosts` function will handle the fetching of more posts.


    ```javascript


    async function loadMorePosts() {


    // Display the loader animation


    showLoader();


    // Delay to simulate fetching data


    await setTimeout(() => {}, 1000);


    // Fetch the next set of posts


    const response = await fetch(''YOUR_API_ENDPOINT_HERE'');


    const data = await response.json();


    // Render the fetched posts


    displayPosts(data);


    // Hide the loader animation


    hideLoader();


    }


    ```


    Here, `showLoader()` and `hideLoader()` are functions to handle displaying and
    hiding the loader animation, respectively. Ensure to replace `''YOUR_API_ENDPOINT_HERE''`
    with your actual API endpoint.


    * * *


    5\. Appending the Posts


    Within the `displayPosts` function, iterate over the fetched data and append each
    post to your container.


    ```javascript


    function displayPosts(posts) {


    posts.forEach(post => {


    const postElement = document.createElement(''div'');


    postElement.classList.add(''post'');


    postElement.innerHTML = `


    <h2>${post.title}</h2>


    <p>${post.body}</p>


    `;


    document.querySelector(''.posts-container'').appendChild(postElement);


    });


    }


    ```


    Ensure you have a `.posts-container` or similar in your HTML to append these posts
    to.


    * * *


    6\. Handling Edge Cases


    For a seamless user experience:


    - Handle cases where there''s no more content to fetch. Inform the user accordingly.


    - Ensure the loader doesn''t get stuck if there''s an error during fetching.


    - Adjust the threshold (10 pixels in our case) depending on your content''s structure
    and the desired user experience.


    * * *


    Conclusion


    Infinite scrolling is a powerful technique for improving user engagement on content-rich
    websites. By utilizing modern JavaScript features like Fetch and Async/Await,
    we can easily implement this functionality in our web projects. Always remember
    to handle edge cases and provide feedback to users for a seamless browsing experience.


    Note: This chapter assumes you have a basic understanding of Fetch API, Async/Await,
    and CSS animations. If not, kindly revisit the previous chapters for a thorough
    understanding. The code provided is a basic implementation and might require adjustments
    based on the specifics of your project and API.


    Filter Fetched Posts


    Welcome back to the "Infinite Scroll Posts" project. Having already fetched posts
    and implemented infinite scrolling, our next goal is to introduce a functionality
    that allows users to filter through the fetched posts. This will enhance user
    experience by enabling them to find specific posts quickly.


    Objective: Implement a filtering functionality that allows users to search through
    the fetched posts based on titles and content.


    * * *


    Prerequisites:


    1\. A working knowledge of JavaScript, particularly ES6+ features such as Async/Await.


    2\. Familiarity with the DOM (Document Object Model) and manipulating it with
    JavaScript.


    3\. Previous chapters in this project where we set up fetching posts and infinite
    scrolling.


    * * *


    Step 1: Setting up the Filter Input Field


    We need an input field where users can type search queries:


    ```html


    <input type="text" id="filter" placeholder="Filter posts...">


    ```


    * * *


    Step 2: JavaScript Implementation


    a. Accessing the Input Element:


    Access the input element using the DOM:


    ```javascript


    const filterInput = document.getElementById(''filter'');


    ```


    b. Event Listener:


    We''ll attach an event listener to the input element to detect when the user types:


    ```javascript


    filterInput.addEventListener(''input'', filterPosts);


    ```


    c. Filtering Function:


    This function is the core of our filtering feature:


    ```javascript


    function filterPosts(e) {


    const searchTerm = e.target.value.toUpperCase(); // Convert input to uppercase
    for non-case sensitive search


    const posts = document.querySelectorAll(''.post''); // Assume each post has a
    class of ''post''


    posts.forEach(post => {


    const postTitle = post.querySelector(''.post-title'').innerText.toUpperCase();


    const postContent = post.querySelector(''.post-content'').innerText.toUpperCase();


    // Check if search term exists in post title or content


    if (postTitle.indexOf(searchTerm) > -1 || postContent.indexOf(searchTerm) > -1)
    {


    post.style.display = ''block'';


    } else {


    post.style.display = ''none'';


    }


    });


    }


    ```


    Explanation:


    - We''re using the `input` event, which fires every time the `value` of the input
    field changes.


    - Within the `filterPosts` function:


    - Convert the search term to uppercase to ensure our search is not case-sensitive.


    - We select all posts. For this example, I''ve assumed each post has a class of
    ''post''.


    - For each post, we check if the search term exists in its title or content. If
    it does, we display the post; otherwise, we hide it.


    * * *


    Step 3: Enhancements


    a. Adding a Delay: Instant filtering can be jarring, especially with larger datasets.
    Consider adding a delay using `setTimeout`.


    b. Spinner or Loader: If filtering takes time, showing a spinner can enhance user
    experience. You can reuse the CSS loader implemented in previous chapters.


    c. Highlighting Matched Text: Enhance user experience by highlighting the matched
    text within the post. This can be achieved using Regex and manipulating the innerHTML
    property of post elements.


    * * *


    Conclusion:


    Filtering is a powerful feature that greatly enhances user experience, allowing
    users to quickly and efficiently find the information they''re looking for. With
    the implementation above, users of your infinite scroll post project can now search
    through posts with ease.


    Section 12:  Project 11 - Speech Text Reader | Speech Synthesis  


    Project Intro'
