    Populate UI With Saved Data


    Welcome back! In the previous chapter, we discussed how to save the selected movie
    and seat data to the local storage. Now, when a user visits the movie seat booking
    page, they should be able to see their previously selected seats. This is essential
    for a user-friendly experience. In this chapter, we''ll populate the user interface
    (UI) with the saved data from local storage.


    * * *


    1\. Understand the Purpose


    Populating the UI with saved data helps in providing a seamless user experience.
    When a user returns to our movie booking site, they don’t have to select their
    seats and movie choice again; it will automatically show their previous selections.


    * * *


    2\. Retrieve Data From Local Storage


    Before we populate our UI, we must first retrieve the saved data.


    ```javascript


    const selectedSeats = JSON.parse(localStorage.getItem(''selectedSeats''));


    const selectedMovieIndex = localStorage.getItem(''selectedMovieIndex'');


    ```


    In the code above:


    - We retrieve the `selectedSeats` from local storage and parse them from string
    format to an array using `JSON.parse()`.


    - The `selectedMovieIndex` is retrieved as is because it''s stored as a string.


    * * *


    3\. Populate Movie Selection


    To populate the movie dropdown with the saved movie choice, we use the retrieved
    `selectedMovieIndex`.


    ```javascript


    const movieSelect = document.getElementById(''movie'');


    if (selectedMovieIndex !== null) {


    movieSelect.selectedIndex = selectedMovieIndex;


    }


    ```


    Here, we simply set the `selectedIndex` property of our `movieSelect` dropdown
    to the retrieved index, making sure it''s not null.


    * * *


    4\. Populate Seats


    Now, let''s populate the seats based on the saved selections:


    ```javascript


    const seats = document.querySelectorAll(''.seat:not(.occupied)'');


    if (selectedSeats !== null && selectedSeats.length > 0) {


    seats.forEach((seat, index) => {


    if (selectedSeats.indexOf(index) > -1) {


    seat.classList.add(''selected'');


    }


    });


    }


    ```


    In this code:


    - We first select all the seats that are not occupied.


    - We then check if `selectedSeats` contains data and loop through each seat.


    - If the seat''s index is found in the `selectedSeats` array, we add the `selected`
    class to that seat, visually marking it as selected.


    * * *


    5\. Update Count and Total Price


    Remember, our UI should also reflect the correct count of selected seats and the
    total price. Let''s make sure we handle that too.


    ```javascript


    function updateSelectedCountAndTotal() {


    const selectedSeats = document.querySelectorAll(''.row .seat.selected'');


    const count = selectedSeats.length;


    const total = count * +movieSelect.value;


    document.getElementById(''count'').innerText = count;


    document.getElementById(''total'').innerText = total;


    }


    // Call this function after populating the seats


    updateSelectedCountAndTotal();


    ```


    * * *


    6\. Final Thoughts


    It''s essential always to consider the user''s experience when developing applications.
    By populating the UI with saved data, we save the user time and provide a sense
    of continuity, especially if they had to navigate away from the page and then
    come back.


    In the next section, we''ll dive into the custom video player and how to harness
    the power of the HTML5 Video API. Stay tuned!


    Section 4:  Project 3 - Custom Video Player | HTML5 Video API


    Project Intro


