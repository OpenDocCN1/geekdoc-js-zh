    Are you ready to dive deep into the world of Fetch and JSON? Let’s begin!


    Project HTML


    In this chapter, we''re going to lay the foundation for our Exchange Rate Calculator
    project. The HTML structure will form the skeleton upon which we will later add
    styling (CSS) and dynamic functionality (JavaScript). By the end of this chapter,
    you will have a clear understanding of the layout and elements that comprise our
    exchange rate calculator.


    * * *


    Structure Overview


    Our Exchange Rate Calculator will consist of:


    - A title


    - Two dropdown lists for selecting source and target currencies


    - Two input fields for entering and displaying the conversion result


    - A button to perform the conversion


    - A section to display the current exchange rate between the selected currencies


    * * *


    The HTML Structure


    ```html


    <!DOCTYPE html>


    <html lang="en">


    <head>


    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Exchange Rate Calculator</title>


    <!-- Link to the CSS file will be added later -->


    </head>


    <body>


    <div class="calculator-container">


    <h1>Exchange Rate Calculator</h1>


    <div class="input-group">


    <label for="from-currency">From:</label>


    <select id="from-currency">


    <!-- Options will be populated using JavaScript -->


    </select>


    <input type="number" id="from-amount" placeholder="Enter amount">


    </div>


    <div class="input-group">


    <label for="to-currency">To:</label>


    <select id="to-currency">


    <!-- Options will be populated using JavaScript -->


    </select>


    <input type="number" id="to-amount" placeholder="Converted amount" readonly>


    </div>


    <button id="convert-btn">Convert</button>


    <div class="rate-display">


    <p>Exchange rate from <span id="display-from-currency"></span> to <span id="display-to-currency"></span>
    is: <span id="exchange-rate"></span></p>


    </div>


    </div>


    <!-- Link to the JavaScript file will be added later -->


    </body>


    </html>


    ```


    * * *


    Breaking Down the Structure


    1\. HTML Boilerplate:


    The beginning of our document sets up the standard structure, including the doctype
    declaration, `<head>` section, and `<body>` tag. We''ve also specified a `viewport`
    meta tag to ensure our calculator is mobile responsive.


    2\. Calculator Container:


    We''ve wrapped our entire calculator in a `div` with the class `calculator-container`.
    This will help us style the calculator as a cohesive unit later on.


    3\. Title:


    A simple heading (`<h1>`) announces the purpose of our application: "Exchange
    Rate Calculator".


    4\. Input Groups:


    We have two `div` elements with the class `input-group` for our source and target
    currencies. Inside each `div`, we have:


    - A label


    - A dropdown list (`<select>`) to choose a currency


    - An input field (`<input>`) for amounts


    The source currency input allows user entry, while the target currency input is
    read-only since it will display the calculated result.


    5\. Convert Button:


    The "Convert" button (`<button>`) will trigger the currency conversion when clicked.


    6\. Rate Display:


    Finally, we have a `div` with the class `rate-display` that will show the current
    exchange rate between the two selected currencies. We''ve used placeholder `<span>`
    elements to make it easier to insert dynamic data with JavaScript later on.


