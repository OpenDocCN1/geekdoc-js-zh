    Using the `Date` object, we can fetch the current year:


    ```javascript


    const currentYear = new Date().getFullYear();


    ```


    Step 3: Display the Next Year


    ```javascript


    yearEl.textContent = currentYear + 1;


    ```


    This will ensure that the displayed year is always the next one, keeping our countdown
    relevant.


    * * *


    Implementing the Spinner Animation


    As users visit our page, it''s a pleasant experience to provide them with a visual
    cue indicating that the countdown is being set up. This is where our spinner comes
    into play. It will display for a short time before revealing the countdown.


    Step 1: HTML Setup


    Within your main HTML, incorporate the spinner div:


    ```html


    <div class="spinner" id="spinner"></div>


    ```


    Step 2: CSS Styling


    For the spinner, you''ll want a simple rotating animation:


    ```css


    .spinner {


    width: 50px;


    height: 50px;


    border: 5px solid rgba(255, 255, 255, 0.1);


    border-top: 5px solid fff;


    border-radius: 50%;


    position: absolute;


    top: 50%;


    left: 50%;


    transform: translate(-50%, -50%);


    animation: spin 1s linear infinite;


    }


    @keyframes spin {


    0% {


    transform: translate(-50%, -50%) rotate(0deg);


    }


    100% {


    transform: translate(-50%, -50%) rotate(360deg);


    }


    }


    ```


    Step 3: JavaScript Logic


    Finally, to ensure that the spinner only shows for a brief time before the countdown
    is displayed:


    ```javascript


    const spinnerEl = document.getElementById(''spinner'');


    const countdownEl = document.getElementById(''countdown''); // Assuming this is
    the id of your countdown container


    setTimeout(() => {


    spinnerEl.style.display = ''none'';


    countdownEl.style.display = ''block'';


    }, 1000);


    ```


    This will hide the spinner and display the countdown after a second.


    * * *


    Wrapping Up


    With our dynamic year in place and a pleasant loading spinner to greet our users,
    our New Year Countdown is taking shape!


    Remember, the power of web development is not just in creating beautiful visuals
    but in enhancing user experience with these small dynamic functionalities. The
    countdown becomes more robust and user-friendly, ensuring our users return year
    after year.


    Section 15:  Project 14 - Sortable List | Drag & Drop API


    Project Intro


    Welcome to Project 14! In this module, we are going to explore one of the cool
    features of modern web development — the Drag & Drop API. As web developers, we''re
    always on the lookout for ways to enhance user experience and make web interactions
    feel natural and intuitive. The Drag & Drop feature is a versatile tool that,
    when implemented well, can significantly elevate the functionality and usability
    of a website or application.


    * * *


    Objective of the Project


    Our primary goal in this project is to develop a sortable list. Think of a scenario
    where you have a list of tasks, priorities, or perhaps even a playlist of songs,
    and you want to rearrange them based on their importance, urgency, or preference.
    Wouldn’t it be amazing if you could simply drag an item and place it wherever
    you wanted within the list? That''s exactly what we''re going to build in this
    project.


    * * *


    Why a Sortable List?


    The ability to manipulate the order of items in a list through dragging and dropping
    is not just visually satisfying for the user, but it''s also extremely functional.
    Here''s why:


    1\. Flexibility: Users are not always sure of the order of items when they initially
    create a list. Having the ability to reorder items provides the flexibility to
    adapt the list over time.


    2\. Intuitiveness: Dragging and dropping feels natural. It mimics the action of
    physically moving objects around, making the interaction feel real and immersive.


    3\. Enhanced User Experience: No need to manually delete and re-add items to change
    their order. A sortable list provides a seamless way to organize items.


    * * *


    Technical Overview


    In this project, we''ll harness the capabilities of the HTML5 Drag & Drop API.
    Here are the primary components we will be focusing on:


    1\. Draggable Elements: These are the items in our list that we want to make movable.


    2\. Drop Zones: These are the areas where we can place our draggable elements.


    3\. Drag & Drop Events: These are a set of events that the browser triggers as
    elements are dragged and dropped. We''ll be leveraging events like `dragstart`,
    `dragover`, `dragleave`, and `drop`.


    * * *


    Expected Outcomes


    By the end of this project:


    - You''ll have a functional sortable list that allows items to be rearranged using
    drag and drop.


    - You''ll gain a deep understanding of the Drag & Drop API, its events, and methods.'
