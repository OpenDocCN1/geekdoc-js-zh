    In this initial setup:


    - We''re setting a general font, background color, text color, and line-height
    for the entire body.


    - The `.container` class centers our content and keeps everything tidy.


    - Individual `.post` sections are clearly defined with subtle borders, padding,
    shadows, and rounded edges for a modern appearance.


    * * *


    Section 2: Designing the Loader Animation


    For our infinite scroll, it''s important to provide user feedback. The loader
    animation is a visual indicator that posts are currently being fetched.


    Step 1: Basic Loader Structure


    Our loader will be a simple spinning circle. Begin by adding this HTML structure
    wherever you intend to place your loader:


    ```html


    <div class="loader"></div>


    ```


    Step 2: Styling the Loader


    Now, apply the following CSS to design our loader:


    ```css


    .loader {


    border: 16px solid f3f3f3; /* Light grey */


    border-top: 16px solid 3498db; /* Blue */


    border-radius: 50%; /* To make it a circle */


    width: 120px;


    height: 120px;


    animation: spin 1s linear infinite;


    }


    ```


    Step 3: Creating the Spin Animation


    Now, the magical part. Let''s create the `spin` animation:


    ```css


    @keyframes spin {


    0% { transform: rotate(0deg); }


    100% { transform: rotate(360deg); }


    }


    ```


    With this keyframes animation, our loader will continuously spin, providing a
    visual cue to users that content is loading.


    * * *


    Section 3: Positioning the Loader


    Our loader should be centrally placed on the page, especially when posts are being
    fetched. Apply the following styles to ensure its position remains consistent:


    ```css


    .loader {


    position: fixed;


    left: 50%;


    top: 50%;


    transform: translate(-50%, -50%);


