  trans: "\n\n# 更改语音与自定义文本框\n\n在本章中，我们将通过实现两个关键功能来扩展语音文本阅读器的功能：\n\n1. 更改文本转语音阅读器的语音。\n\
    2. 允许用户输入自定义文本以供朗读。\n\n这些功能将使我们的应用程序更加灵活，让用户对语音输出和朗读内容拥有更多控制权。\n\n---\n\n## 第一步：为语音选择和自定义文本设置\
    \ HTML\n\n在深入 JavaScript 功能之前，我们先设置 HTML，包含一个用于语音选择的下拉列表和一个用于自定义文本输入的文本区域。\n\n\
    `index.html`\n\n```html\n<div class=\"voice-selection\">\n  <label for=\"voiceList\"\
    >选择语音：</label>\n  <select id=\"voiceList\"></select>\n</div>\n<div class=\"custom-text\"\
    >\n  <label for=\"customText\">输入自定义文本：</label>\n  <textarea id=\"customText\"\
    \ rows=\"5\" placeholder=\"在此输入自定义文本...\"></textarea>\n  <button id=\"readCustomText\"\
    >朗读自定义文本</button>\n</div>\n```\n\n---\n\n## 第二步：获取可用语音\n\n我们从 `SpeechSynthesis`\
    \ API 获取可用语音，并填充下拉列表。\n\n`app.js`\n\n```javascript\nconst voiceList = document.getElementById('voiceList');\n\
    let voices = [];\n\nfunction populateVoiceList() {\n  voices = speechSynthesis.getVoices();\n\
    \  voices.forEach(voice => {\n    const option = document.createElement('option');\n\
    \    option.textContent = voice.name;\n    option.setAttribute('data-lang', voice.lang);\n\
    \    option.setAttribute('data-name', voice.name);\n    voiceList.appendChild(option);\n\
    \  });\n}\n\n// 当语音列表发生变化时触发此事件\nspeechSynthesis.onvoiceschanged = populateVoiceList;\n\
    ```\n\n---\n\n## 第三步：更改语音\n\n当语音加载到下拉列表后，我们希望根据用户的选择来更改语音。\n\n`app.js`（续）\n\n\
    ```javascript\nlet selectedVoice;\n\nvoiceList.addEventListener('change', (e)\
    \ => {\n  selectedVoice = voices.find(voice => voice.name === e.target.value);\n\
    });\n```\n\n---\n\n## 第四步：实现自定义文本框\n\n对于自定义文本功能，我们需要允许用户在文本区域中输入内容，然后使用选定的语音朗读出来。\n\
    \n`app.js`（续）\n\n```javascript\nconst customText = document.getElementById('customText');\n\
    const readCustomTextButton = document.getElementById('readCustomText');\n\nreadCustomTextButton.addEventListener('click',\
    \ () => {\n  let utterThis = new SpeechSynthesisUtterance(customText.value);\n\
    \  if (selectedVoice) {\n    utterThis.voice = selectedVoice;\n  }\n  speechSynthesis.speak(utterThis);\n\
    \  customText.value = ''; // 朗读后清空文本区域\n});\n```\n\n---\n\n## 第五步：美化界面\n\n为了让用户界面直观整洁，我们添加一些样式。\n\
    \n`styles.css`\n\n```css\n.voice-selection, .custom-text {\n  margin: 20px 0;\n\
    }\n\nlabel {\n  display: block;\n  margin-bottom: 10px;\n  font-weight: bold;\n\
    }\n\nselect, textarea {\n  width: 100%;\n  padding: 10px;\n  border: 1px solid\
    \ #ccc;\n  border-radius: 4px;\n}\n\nbutton {\n  display: block;\n  margin-top:\
    \ 10px;\n  padding: 10px 20px;\n  background-color: #333;\n  color: #fff;\n  border:\
    \ none;\n  border-radius: 4px;\n  cursor: pointer;\n}\n\nbutton:hover {\n  background-color:\
    \ #555;\n}\n```\n\n---\n\n## 结论\n\n通过上述步骤，我们成功地为语音文本阅读器添加了更改语音的功能，并允许用户输入自定义文本供应用程序朗读。这不仅使我们的应用程序更加灵活，还通过提供对内容和呈现方式的更多控制，增强了用户体验。\n\
    \n请记住，像这样的无障碍工具可以改变用户与 Web 应用程序交互的方式。务必使用不同类型的用户测试这些工具，以确保它们能满足不同的需求。\n\n---\n\
    \n# 第 13 节：项目 12 - 放松应用 | CSS 动画、setTimeout\n\n## 项目介绍\n\n欢迎来到项目 12——放松应用。在快节奏的世界中，花点时间放松和呼吸不仅对心理健康至关重要，也有助于提高生产力。基于此，放松应用作为一个数字伴侣，鼓励用户暂停、呼吸，并重新与当下时刻建立连接。\n\
    \n---\n\n## 放松应用的目标\n\n放松应用的主要目的是引导用户完成一系列呼吸练习，帮助他们达到平静和专注的状态。作为开发者，这为我们提供了一个机会，深入探索\
    \ CSS 动画和 JavaScript 函数（尤其是 `setTimeout` 方法）的有趣结合。\n\n---\n\n## 我们将构建什么？\n\n1.\
    \ **视觉呼吸引导**：一个用户友好的界面，直观地向用户显示何时吸气、屏气和呼气。\n2. **动画**：使用 CSS，我们将创建一个与呼吸指令同步的平滑、舒缓的动画，让用户能够视觉跟随。\n\
    3. **JavaScript 集成**：我们的 JS 代码不仅控制动画触发，还指导用户每个呼吸阶段应持续多长时间。\n\n---\n\n## 放松应用的功能\n\
    \n1. **引导式呼吸指令**：清晰的屏幕提示，准确告诉用户何时吸气、屏气和呼气。\n2. **自适应循环**：应用将持续运行呼吸循环，用户可以根据需要随时使用。\n\
    3. **响应式设计**：我们的应用将适配不同设备，确保每个人都能访问并受益。\n4. **可自定义设置**：虽然这是一个基础版本，但开发者后续可以添加功能，让用户设置自己的呼吸间隔或选择不同的放松模式。\n\
    \n---\n\n## 为什么选择放松应用？\n\n- **全面学习**：该项目提供了全面的学习体验，从创建视觉吸引人的设计到理解和实现 JavaScript\
    \ 的异步函数。\n- **实际应用**：冥想和放松应用越来越受欢迎。该项目可以作为那些希望深入探索此类应用的基础。\n- **具有挑战性但可实现**：对于与我们一同走过前\
    \ 11 个项目的开发者来说，放松应用提供了恰到好处的挑战，同时确保它仍然可实现且有趣。\n\n总之，通过完成这个项目，你不仅将拥有一个功能完整的放松应用，还将更深入地理解如何将\
    \ CSS 动画与 JavaScript 方法有效结合，以创建同步的用户体验。那么，让我们开始构建通往放松和编程精通之路吧！\n\n---\n\n## 创建大圆\n\
    \n在放松应用中，主要的视觉组件是一个大圆，它将代表我们的呼吸视觉引导。这个圆会扩张和收缩，模拟呼吸过程。在动画化之前，我们首先需要创建它。在本章中，我们将引导你使用\
    \ HTML 和 CSS 创建这个关键组件。\n\n---\n\n### 第一步：设置 HTML 结构\n\n让我们从为圆创建基本 HTML 结构开始。\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
    >\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n  <title>放松应用</title>\n  <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n\
    <body>\n  <div class=\"container\">\n    <div class=\"circle\"></div>\n  </div>\n\
    </body>\n</html>\n```\n\n这里，我们将圆包裹在一个容器中。这将有助于后续的定位和动画制作。\n\n---\n\n### 第二步：使用\
    \ CSS 为圆添加样式\n\n"
- fmt: "\nFor our circle to look visually appealing and give the user a sense of relaxation,\
    \ we'll opt for a calm, pastel color. The size of the circle should be significant\
    \ enough to be the primary focus, but not overwhelming.\n\nIn your `styles.css`:\n\
    \n```css\nbody, html {\n  height: 100%;\n  margin: 0;\n  display: flex;\n  justify-content:\
    \ center;\n  align-items: center;\n  background-color: 282c34; /* A dark background\
    \ for contrast */\n}\n\n.container {\n  position: relative;\n  width: 300px;\n\
    \  height: 300px;\n}\n\n.circle {\n  position: absolute;\n  top: 50%;\n  left:\
    \ 50%;\n  transform: translate(-50%, -50%);\n  width: 100%;\n  height: 100%;\n\
    \  border-radius: 50%; /* Makes it a perfect circle */\n  background-color: 89CFF0;\
    \ /* A soothing blue color */\n  box-shadow: 0px 0px 15px rgba(0,0,0,0.2); /*\
    \ A subtle shadow for depth */\n}\n```\n\nIn the above CSS, we've:\n\n- Centered\
    \ the `.container` using flex properties on the `body`.\n- Used the `position:\
    \ absolute` and `transform` properties for the `.circle` to ensure it's perfectly\
    \ centered within the `.container`.\n- Used the `border-radius` property to turn\
    \ our square div into a circle.\n- Chose a relaxing blue shade for the background.\n\
    \n* * *\n\n## Step 3: Add a Textual Indicator\n\nThough our main focus is the\
    \ circle, having a textual indicator can provide additional context. Let's add\
    \ a simple \"Breathe In\" and \"Breathe Out\" text that will later be toggled\
    \ through JavaScript as the circle expands and contracts.\n\nModify the HTML:\n\
    \n```html\n<div class=\"container\">\n  <div class=\"circle\">\n    <p class=\"\
    text\">Breathe In</p>\n  </div>\n</div>\n```\n\nNow, add some styling for the\
    \ text:\n\n```css\n.text {\n  position: absolute;\n  top: 50%;\n  left: 50%;\n\
    \  transform: translate(-50%, -50%);\n  font-family: 'Arial', sans-serif;\n  color:\
    \ fff;\n  font-size: 1.5rem;\n  text-align: center;\n  opacity: 0.8;\n}\n```\n\
    \n* * *\n\n## Conclusion\n\nWe have now successfully created a large circle which\
    \ will serve as the core visual element for our Relaxer App. This circle will\
    \ soon be animated to assist users in a relaxing breathing exercise. In the next\
    \ chapters, we will dive deeper into adding animations and enhancing the interactivity\
    \ of this circle.\n\nRemember, the effectiveness of this app isn't just about\
    \ the animations or the code, but also about the visual cues that can help users\
    \ find relaxation and calmness. Our choice of colors, positioning, and the smoothness\
    \ of animations will play a crucial role in the app's overall impact.\n\n# Creating\
    \ & Animating The Pointer\n\nIn this chapter, we will be focusing on an integral\
    \ part of the Relaxer App: the pointer. The pointer serves as a visual cue to\
    \ guide the user through their breathing exercises. It will rotate around the\
    \ circumference of a circle, with its motion corresponding to the breathing instructions.\n\
    \n* * *\n\n## Prerequisites\n\nBefore we begin, ensure you have the following\
    \ set up:\n\n- Basic HTML structure for the Relaxer App\n- A large circle in the\
    \ center of the page (from Chapter 70)\n\n* * *\n\n### 1. Creating the Pointer\
    \ with HTML & CSS\n\n**HTML:**\n\nAdd a div for the pointer within the circle\
    \ element:\n\n```html\n<div class=\"circle\">\n  <div class=\"pointer\"></div>\n\
    </div>\n```\n\n**CSS:**\n\nStyle the pointer to appear as a small, prominent triangle\
    \ that stands out against the circle:\n\n```css\n.pointer {\n  width: 0;\n  height:\
    \ 0;\n  border-left: 10px solid transparent;\n  border-right: 10px solid transparent;\n\
    \  border-bottom: 20px solid 333;\n  position: absolute;\n  top: -10px;\n  left:\
    \ 50%;\n  transform: translateX(-50%);\n}\n```\n\n* * *\n\n### 2. Basic Animation\
    \ Setup\n\nTo animate the pointer, we will be using CSS keyframes and the `transform`\
    \ property. For simplicity, let's set up an animation that rotates the pointer\
    \ 360 degrees over a duration of 8 seconds (to mimic a full breath cycle).\n\n\
    **CSS:**\n\n```css\n@keyframes rotatePointer {\n  0% {\n    transform: rotate(0deg);\n\
    \  }\n  100% {\n    transform: rotate(360deg);\n  }\n}\n```\n\nApply the animation\
    \ to the pointer:\n\n```css\n.pointer {\n  /* ...previous styles... */\n  animation:\
    \ rotatePointer 8s linear infinite;\n}\n```\n\n* * *\n\n### 3. Timing with `setTimeout`\n\
    \nWhile the CSS animation gives us a continuous motion, we want the pointer to\
    \ pause during specific moments to simulate the 'inhale' and 'exhale' periods.\
    \ For this, we'll employ JavaScript's `setTimeout` method.\n\n**JavaScript:**\n\
    \nFirst, grab the pointer element:\n\n```javascript\nconst pointer = document.querySelector('.pointer');\n\
    ```\n\nNext, create a function to control the pointer's animation:\n\n```javascript\n\
    function controlPointerAnimation() {\n  // Pause the animation\n  pointer.style.animationPlayState\
    \ = 'paused';\n\n  // 'Inhale' for 4 seconds\n  setTimeout(() => {\n    pointer.style.animationPlayState\
    \ = 'running';\n  }, 4000);\n\n  // 'Exhale' for 4 seconds and then pause again\n\
    \  setTimeout(() => {\n    pointer.style.animationPlayState = 'paused';\n  },\
    \ 8000);\n}\n```\n\nInvoke the function when the page loads:\n\n```javascript\n\
    controlPointerAnimation();\n```\n\nFor continuous cycles, you can use `setInterval`\
    \ to run the `controlPointerAnimation` function every 8 seconds.\n\n```javascript\n\
    setInterval(controlPointerAnimation, 8000);\n```\n\n* * *\n\n## Conclusion\n\n\
    The animated pointer now provides a clear visual cue for users, guiding them through\
    \ the breathing exercise. By combining CSS animations with timed JavaScript functions,\
    \ we've created a seamless user experience that's both interactive and beneficial\
    \ for relaxation.\n\nIn the next chapter, we'll delve into triggering the breathing\
    \ animation with JavaScript, enhancing the relaxation experience further. Stay\
    \ tuned!\n\n# Breath Animation With JS Trigger\n\nObjective: In this chapter,\
    \ we'll walk through how to create a breathing relaxation app. The app will encourage\
    \ users to follow a rhythmic breathing pattern, using a visual guide that expands\
    \ and contracts. The animation will be achieved using CSS animations and triggered\
    \ via JavaScript.\n\n* * *\n\n## 1. Introduction\n\nBreathing exercises are often\
    \ used to induce relaxation and reduce stress. Our goal is to create an animation\
    \ that mimics the inhalation and exhalation process, guiding users to sync their\
    \ breath with it.\n\n* * *\n\n## 2. Setting Up the HTML Structure\n\nLet's start\
    \ by creating a basic structure for our animation:\n\n```html\n<div class=\"app\"\
    >\n  <div class=\"circle\">\n    <div class=\"inner-circle\"></div>\n  </div>\n\
    \  <p id=\"instruction\">Breathe In</p>\n</div>\n```\n\nHere, `.circle` represents\
    \ the breath visual while `.inner-circle` mimics the lungs expanding and contracting.\n\
    \n* * *\n\n## 3. Styling Our Animation\n\nNext, let's style our circles:\n\n```css\n\
    .app {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n\
    \  height: 100vh;\n  background-color: e0f7fa;\n}\n\n.circle {\n  width: 100px;\n\
    \  height: 100px;\n  border-radius: 50%;\n  background-color: 81d4fa;\n  display:\
    \ flex;\n  justify-content: center;\n  align-items: center;\n  overflow: hidden;\n\
    }\n\n.inner-circle {\n  width: 50px;\n  height: 50px;\n  border-radius: 50%;\n\
    \  background-color: 29b6f6;\n  opacity: 0.7;\n}\n```\n\n* * *\n\n## 4. Creating\
    \ the CSS Animation\n\nLet's create two animations: one for breathing in, where\
    \ the circle expands, and one for breathing out, where it contracts.\n\n```css\n\
    @keyframes breatheIn {\n  0%, 100% {\n    width: 50px;\n    height: 50px;\n  }\n\
    \  50% {\n    width: 100px;\n    height: 100px;\n  }\n}\n\n@keyframes breatheOut\
    \ {\n  0%, 100% {\n    width: 100px;\n    height: 100px;\n  }\n  50% {\n    width:\
    \ 50px;\n    height: 50px;\n  }\n}\n```\n\n* * *\n\n## 5. Adding JavaScript Trigger\n\
    \nNow, let's use JavaScript to trigger these animations:\n\n```javascript\nconst\
    \ instruction = document.getElementById('instruction');\nconst innerCircle = document.querySelector('.inner-circle');\n\
    \nlet isBreathingIn = true;\n\nconst breatheFunction = () => {\n  if (isBreathingIn)\
    \ {\n    instruction.innerText = 'Breathe Out';\n    innerCircle.style.animation\
    \ = 'breatheIn 2s alternate 2';\n  } else {\n    instruction.innerText = 'Breathe\
    \ In';\n    innerCircle.style.animation = 'breatheOut 2s alternate 2';\n  }\n\
    \  isBreathingIn = !isBreathingIn;\n};\n\n// Initial call\nbreatheFunction();\n\
    \n// Use setInterval to keep repeating\nsetInterval(breatheFunction, 4000);\n\
    ```\n"
