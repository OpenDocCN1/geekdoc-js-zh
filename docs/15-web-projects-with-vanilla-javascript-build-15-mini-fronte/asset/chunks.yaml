  trans: "\n\n# 数组方法：filter()\n\n`filter()` 方法创建一个新数组，其中包含所有通过所提供函数测试的元素。简单来说，它会根据你设定的条件过滤出元素。\n\
    \n## 语法\n\n```javascript\nlet newArray = arr.filter(callback(element[, index[,\
    \ array]])[, thisArg])\n```\n\n其中：\n- `callback`：一个断言函数，返回布尔值。它测试每个元素，返回 `true`\
    \ 则保留该元素，否则返回 `false`。\n- `element`：数组中当前正在处理的元素。\n- `index`（可选）：当前元素在数组中的索引。\n\
    - `array`（可选）：调用 `filter()` 的数组本身。\n- `thisArg`（可选）：执行回调时用作 `this` 的对象。\n\n##\
    \ 实现 filter() 方法以显示百万富翁\n\n假设我们有一个用户对象数组，每个对象包含 `name`、`age` 和 `wealth` 属性。我们的目标是筛选出财富超过\
    \ 100 万的用户并显示。\n\n### 步骤 1：示例数据数组\n为了演示，考虑以下示例用户数据：\n\n```javascript\nconst users\
    \ = [\n  { name: 'John Doe', age: 32, wealth: 500000 },\n  { name: 'Jane Smith',\
    \ age: 29, wealth: 1500000 },\n  { name: 'Chris Johnson', age: 45, wealth: 2200000\
    \ },\n  { name: 'Anna Brown', age: 28, wealth: 750000 },\n  { name: 'Tom Davis',\
    \ age: 34, wealth: 9800000 }\n];\n```\n\n### 步骤 2：使用 filter() 获取百万富翁\n逻辑很简单：我们需要检查每个用户的\
    \ `wealth` 属性是否大于 100 万。\n\n```javascript\nconst millionaires = users.filter(user\
    \ => user.wealth > 1000000);\nconsole.log(millionaires);\n```\n\n上述代码将返回一个包含财富超过\
    \ 100 万的用户数组。\n\n### 步骤 3：在 DOM 上显示百万富翁\n我们将创建一个函数，用于在网页上动态显示百万富翁列表：\n\n```javascript\n\
    function displayMillionaires(millionaires) {\n  const millionaireContainer = document.getElementById('millionaire-list');\n\
    \  // 清空之前的列表\n  millionaireContainer.innerHTML = '';\n  // 遍历每个百万富翁并添加到 DOM\n\
    \  millionaires.forEach(millionaire => {\n    const millionaireElement = document.createElement('div');\n\
    \    millionaireElement.className = 'millionaire';\n    millionaireElement.innerHTML\
    \ = `\n      <strong>${millionaire.name}</strong> - 财富: $${millionaire.wealth.toLocaleString()}\n\
    \    `;\n    millionaireContainer.appendChild(millionaireElement);\n  });\n}\n\
    // 调用显示函数\ndisplayMillionaires(millionaires);\n```\n\n请确保你的 HTML 中有一个 `id` 为 `millionaire-list`\
    \ 的元素，以便此功能正常工作。\n\n## 结论\n`filter()` 方法非常强大，它允许我们根据特定条件从主数据集中提取子集。在本章中，我们成功筛选并显示了百万富翁用户。随着你在\
    \ JavaScript 学习之旅中的深入，你会发现 `filter()` 在无数场景中都是不可或缺的。\n\n# 数组方法：reduce()\n\n欢迎来到\
    \ DOM 数组方法项目的又一个精彩章节。到目前为止，我们已经介绍了多种数组方法，如 `forEach()`、`map()`、`filter()` 和 `sort()`。在本章中，我们将重点介绍另一个强大的数组方法：`reduce()`。我们的目标？计算用户列表的总财富。\n\
    \n## reduce() 简介\n`reduce()` 方法对累加器和数组中的每个元素（从左到右）应用一个函数，将其归约为单个值。累加器会累积回调的返回值。如果没有提供\
    \ `initialValue`，则数组的第一个元素将被用作累加器，回调将从第二个元素开始执行。\n\n## 语法\n\n```javascript\narray.reduce(callback(accumulator,\
    \ currentValue[, index[, array]])[, initialValue])\n```\n\n关键点：\n- `accumulator`：累加回调的返回值。\n\
    - `currentValue`：数组中当前正在处理的元素。\n- `index`（可选）：`currentValue` 的索引。\n- `array`（可选）：调用\
    \ `reduce()` 的数组本身。\n- `initialValue`（可选）：作为第一次调用回调的第一个参数的值。\n\n## 场景：计算总财富\n\
    假设你有一个用户列表，每个用户包含 `id`、`name` 和 `wealth`：\n\n```javascript\nconst users = [\n\
    \  { id: 1, name: \"John\", wealth: 50000 },\n  { id: 2, name: \"Jane\", wealth:\
    \ 150000 },\n  { id: 3, name: \"Doe\", wealth: 30000 },\n  { id: 4, name: \"Smith\"\
    , wealth: 120000 }\n];\n```\n\n我们想要计算所有用户的总财富。\n\n## 使用 reduce() 实现\n让我们看看如何使用\
    \ `reduce()` 方法实现这一目标：\n\n```javascript\nconst totalWealth = users.reduce((acc,\
    \ user) => acc + user.wealth, 0);\nconsole.log(totalWealth);  // 输出: 350000\n\
    ```\n\n在上面的示例中：\n1. 我们为累加器 `acc` 提供了初始值 `0`。\n2. 对于 `users` 数组中的每个 `user`，我们将用户的\
    \ `wealth` 加到累加器上。\n3. `acc` 的最终值（本例中为 350000）表示总财富。\n\n### 分解说明\n- `reduce()`\
    \ 函数从累加器（`acc`）值为 `0`（我们的初始值）开始。\n- 对于第一个用户（John），`acc` 为 `0`，`user.wealth` 为\
    \ `50000`。因此 `acc` 变为 `50000`。\n- 对于下一个用户（Jane），`acc` 为 `50000`，`user.wealth`\
    \ 为 `150000`。因此 `acc` 变为 `200000`。\n- 此过程对所有用户继续。\n- 迭代结束时，`acc` 保存了所有用户的总财富。\n\
    \n## 总结\n`reduce()` 方法提供了一种简洁的方式来计算数组的聚合值。在本章中，我们用它来计算用户数组的总财富。但 `reduce()` 函数的应用远不止于此。你可以在许多场景中使用它，例如查找数组中的最大值、统计项目出现次数等。\n\
    \n# 项目 6 - 菜单滑块与模态框 | DOM & CSS\n\n## 项目介绍\n欢迎来到本系列的第六个项目，我们将深入使用纯 HTML、CSS 和\
    \ JavaScript 创建一个菜单滑块与模态框。没有框架，没有库，只有原生的 Web 技术。一如既往，我们将全程指导你，确保你理解代码每一部分背后的“如何”与“为什么”。\n\
    \n## 1. 项目概述\n在这个项目中，我们将创建一个从侧面滑入的交互式导航菜单（通常称为“汉堡菜单”）。这是许多现代网站上的流行功能，提供了简洁的用户界面，尤其适合移动端用户。\n\
    \n但这还不是全部！为了配合我们的菜单滑块，我们还将创建一个模态框。模态框是显示在当前页面之上的对话框或弹出窗口，通常用于通知、收集用户输入或在不离开页面的情况下显示附加信息。\n\
    \n## 2. 涵盖的核心概念\n- **DOM 操作**：本项目将让我们练习操作文档对象模型（DOM）的技能，使我们能够动态地与网页元素交互并修改它们。\n\
    - **CSS 过渡与动画**：我们将更深入地探索 CSS 世界，使菜单滑动效果和模态框的显示平滑且美观。\n- **事件监听器**：这些对于创建交互性至关重要。我们将使用事件监听器来检测菜单按钮何时被点击、模态触发器何时被触发以及用户何时想要关闭模态框。\n\
    \n## 3. 你将实现的目标\n在本项目结束时，你将拥有：\n- 一个点击按钮即可激活的滑动菜单，具有平滑的过渡效果。\n- 一个可以触发打开并带有关闭按钮的模态框。\n\
    - 对 DOM 以及如何使用原生 JavaScript 与之交互的更深入理解。\n- 增强的 CSS 技能，特别是在创建动画和过渡方面。\n- 更有信心从头开始构建交互式\
    \ Web 组件！\n\n## 4. 前置要求\n\n"
- fmt: "\nWhile this project is designed to be accessible for those with a basic understanding\
    \ of HTML, CSS, and JavaScript, it will be beneficial if you've gone through the\
    \ prior projects in this course. We'll be building upon foundational concepts\
    \ introduced in earlier chapters.\n\n## A Peek at the End Goal\n\nImagine a sleek\
    \ webpage. On the top left corner, there's a hamburger icon (three stacked lines).\
    \ When clicked, a menu slides in from the left, revealing links to different sections\
    \ of the website. This sliding effect is smooth, making the user experience feel\
    \ polished and professional.\n\nNow, within our main content, there's a button\
    \ labeled \"Learn More.\" Upon clicking it, the background dims, and a centered\
    \ modal window appears, containing more details or perhaps a sign-up form. Clicking\
    \ a close icon or anywhere outside the modal will hide it again, returning the\
    \ user to the main content.\n\nSounds exciting, right? Well, that's what we are\
    \ about to build! So, buckle up, and let's get started on this fantastic journey\
    \ to add more interactive elements to your web development toolkit. On to the\
    \ next chapter where we begin with our project's HTML structure!\n\n# Project\
    \ HTML\n\nWelcome to the HTML section of our sixth project: the Menu Slider &\
    \ Modal! This is where we lay down the foundation of our project. Remember, a\
    \ good structure in your HTML is crucial to making your CSS and JavaScript integration\
    \ easier and more efficient.\n\n### Introduction\n\nHTML (HyperText Markup Language)\
    \ is the backbone of any web page. It provides the structure, while CSS styles\
    \ it and JavaScript brings it to life. In this chapter, we'll focus on creating\
    \ a semantic and accessible structure for our Menu Slider and Modal.\n\n### Setting\
    \ up the Basic HTML Structure\n\nTo begin with, we will set up a basic HTML5 template.\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
    >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n    <title>Menu Slider & Modal</title>\n    <link rel=\"stylesheet\" href=\"\
    styles.css\">\n</head>\n<body>\n</body>\n<script src=\"script.js\"></script>\n\
    </html>\n```\n\n### Creating the Header Section\n\nOur header will contain a navigation\
    \ bar and a menu icon which will trigger the sliding menu.\n\n```html\n<header>\n\
    \    <div class=\"container\">\n        <h1>Menu Slider & Modal</h1>\n       \
    \ <button id=\"menu-btn\">☰</button>\n    </div>\n</header>\n```\n\nHere:\n- `container`\
    \ will act as a wrapper to center our content.\n- The `h1` provides a title.\n\
    - The `menu-btn` button will be used to trigger the sliding menu.\n\n### Crafting\
    \ the Sliding Menu\n\nThe sliding menu will be a sidebar that slides in and out\
    \ from the left. We'll start with the basic structure, and the sliding functionality\
    \ will be added with JavaScript later on.\n\n```html\n<aside id=\"menu-slider\"\
    >\n    <ul>\n        <li><a href=\"home\">Home</a></li>\n        <li><a href=\"\
    services\">Services</a></li>\n        <li><a href=\"about\">About</a></li>\n \
    \       <li><a href=\"contact\">Contact</a></li>\n    </ul>\n</aside>\n```\n\n\
    ### Building the Modal Section\n\nOur modal will be a simple pop-up that can be\
    \ triggered via a button click. For the sake of this example, we'll use it to\
    \ display a subscription form.\n\n```html\n<div id=\"modal\">\n    <div class=\"\
    modal-content\">\n        <span id=\"close-btn\">×</span>\n        <h2>Subscribe\
    \ to Our Newsletter</h2>\n        <form action=\"\">\n            <input type=\"\
    email\" placeholder=\"Enter your email\">\n            <button type=\"submit\"\
    >Subscribe</button>\n        </form>\n    </div>\n</div>\n```\n\nIn this structure:\n\
    - The outer `div` with id `modal` will act as a backdrop, dimming the rest of\
    \ the page when the modal is visible.\n- `modal-content` contains the actual contents\
    \ of the modal.\n- `close-btn` will be used to close the modal.\n- The form within\
    \ the modal prompts the user to subscribe to a newsletter.\n\n### Wrapping Up\n\
    \nWith the HTML structure set for the Menu Slider & Modal project, you're ready\
    \ to move on to styling with CSS and adding functionality with JavaScript. Always\
    \ ensure your HTML is clear and semantic, as this not only makes your website\
    \ more accessible but also eases the process of styling and scripting.\n\nIn the\
    \ next chapter, we will dive into styling our Navbar and setting up the overall\
    \ look of our project with CSS.\n\n# Navbar Styling\n\nWelcome to Chapter 35,\
    \ where we'll be focusing on one of the most fundamental components of a web application's\
    \ UI: the Navbar. The navigation bar, or navbar for short, typically contains\
    \ links that help users navigate through different sections or pages of a website.\
    \ Given its importance, styling the navbar is crucial for both aesthetics and\
    \ usability. Let's dive into how we can style our navbar for the \"Menu Slider\
    \ & Modal\" project.\n\n### 1. The Basic Structure of a Navbar\n\nBefore we style,\
    \ let's remind ourselves of the HTML structure we're working with. A typical navbar\
    \ might look something like this:\n\n```html\n<nav class=\"navbar\">\n    <div\
    \ class=\"logo\">\n        <h1>MyWebsite</h1>\n    </div>\n    <ul class=\"nav-menu\"\
    >\n        <li><a href=\"home\">Home</a></li>\n        <li><a href=\"about\">About</a></li>\n\
    \        <li><a href=\"services\">Services</a></li>\n        <li><a href=\"contact\"\
    >Contact</a></li>\n    </ul>\n    <div class=\"menu-toggle\"><i class=\"fas fa-bars\"\
    ></i></div>\n</nav>\n```\n\n### 2. Styling the Navbar Container\n\nTo start, let's\
    \ give our navbar a distinct look that separates it from the rest of the page.\n\
    \n```css\n.navbar {\n    display: flex;\n    justify-content: space-between;\n\
    \    align-items: center;\n    background-color: 333;\n    padding: 10px 50px;\n\
    \    box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.2);\n}\n```\n\n- `display: flex;`\
    \ ensures that the navbar's child elements are aligned in a row.\n- `justify-content:\
    \ space-between;` evenly distributes the child elements across the navbar.\n-\
    \ `box-shadow:` adds a subtle shadow, making the navbar appear slightly elevated\
    \ from the page.\n\n### 3. Styling the Logo\n\nOur logo is the brand's representation;\
    \ it should stand out but not overpower other elements.\n\n```css\n.navbar .logo\
    \ h1 {\n    color: fff;\n    margin: 0;\n    font-size: 1.5rem;\n    text-transform:\
    \ uppercase;\n    letter-spacing: 2px;\n}\n```\n\n### 4. Styling the Menu\n\n\
    Next, let's style the menu links. A modern practice is to use a horizontal list\
    \ with spacing between items.\n\n```css\n.nav-menu {\n    list-style-type: none;\n\
    \    padding: 0;\n    display: flex;\n    gap: 20px;\n}\n.nav-menu li a {\n  \
    \  color: fff;\n    text-decoration: none;\n    transition: color 0.3s ease;\n\
    }\n.nav-menu li a:hover {\n    color: 007BFF;  /* A shade of blue for hover effect\
    \ */\n}\n```\n\n### 5. Styling the Menu Toggle\n\nThis is the button users will\
    \ click to see the menu on smaller screens:\n\n```css\n.menu-toggle {\n    display:\
    \ none; /* Initially hidden on desktop */\n    font-size: 1.5rem;\n    color:\
    \ fff;\n    cursor: pointer;\n}\n/* Media query to show the menu toggle on smaller\
    \ screens */\n@media (max-width: 768px) {\n    .menu-toggle {\n        display:\
    \ block;\n    }\n    .nav-menu {\n        display: none; /* Hide menu on mobile\
    \ by default */\n        flex-direction: column;\n        gap: 10px;\n       \
    \ position: absolute;\n        top: 60px; /* height of the navbar */\n       \
    \ left: 0;\n        background-color: 333;\n        width: 100%;\n    }\n    .nav-menu.active\
    \ { /* This class will be added via JS to show the menu */\n        display: flex;\n\
    \    }\n}\n```\n\n### 6. Additional Touches\n\nTo further refine our navbar, consider\
    \ adding transitions or animations for a smoother user experience. For instance:\n\
    \n```css\n.nav-menu li a {\n    transition: all 0.3s ease;\n}\n```\n\nThis will\
    \ ensure that changes to properties like color, when hovering over the menu items,\
    \ are gradual and smooth.\n\n### Conclusion\n\nWith these styles, our navbar is\
    \ not only functional but also visually appealing. A well-styled navbar enhances\
    \ user experience and guides them seamlessly through your application. As always,\
    \ feel free to adjust colors, sizes, and other properties to better fit the overall\
    \ design and theme of your website.\n\nIn the next chapter, we'll explore styling\
    \ the header and modal components, diving deeper into the world of CSS and improving\
    \ our project's look and feel. Stay tuned!\n\n# Header & Modal Styling\n"
