    \ calculator will be centered on the page. This main container will house all\
    \ our components.\n\n```css\n.container {\n    width: 90%;\n    max-width: 600px;\n\
    \    margin: 50px auto;\n    background-color: f4f4f4;\n    padding: 20px;\n \
    \   border-radius: 5px;\n    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);\n}\n```\n\
    \n### 3. Styling the Heading\nLet's ensure our project heading stands out and\
    \ provides a clear purpose to our users.\n\n```css\n.container h1 {\n    text-align:\
    \ center;\n    margin-bottom: 20px;\n    color: 333;\n}\n```\n\n### 4. The Exchange\
    \ Rate Input Fields\nThe exchange rate calculator will primarily consist of two\
    \ input fields – one for the source currency and one for the target currency.\n\
    \n```css\n.input-group {\n    display: flex;\n    justify-content: space-between;\n\
    \    margin-bottom: 15px;\n}\n.input-group label {\n    flex: 1;\n    padding:\
    \ 10px;\n    background: ddd;\n    border: 1px solid bbb;\n    border-right: none;\n\
    \    border-radius: 5px 0 0 5px;\n}\n.input-group input {\n    flex: 2;\n    padding:\
    \ 10px;\n    border: 1px solid bbb;\n    border-radius: 0 5px 5px 0;\n}\n```\n\
    \n### 5. Currency Dropdowns\nWe'll have two dropdowns for users to select currencies\
    \ they want to exchange between.\n\n```css\n.select-group {\n    margin-bottom:\
    \ 20px;\n}\n.select-group select {\n    width: 48%;\n    padding: 10px;\n    border:\
    \ 1px solid bbb;\n    border-radius: 5px;\n}\n```\n\n### 6. The Result Display\n\
    Once the user inputs an amount and selects the relevant currencies, the converted\
    \ value will be displayed below.\n\n```css\n.result-display {\n    background-color:\
    \ e6e6e6;\n    padding: 10px;\n    border-radius: 5px;\n    text-align: center;\n\
    \    margin-top: 20px;\n}\n.result-display p {\n    font-size: 1.5em;\n    color:\
