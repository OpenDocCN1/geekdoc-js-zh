    While this is a standalone project, it’s beneficial if you have a basic understanding
    of HTML, CSS, and JavaScript, as we’ll dive deep into some advanced topics. If
    you’re entirely new, I recommend going through the previous sections of this book
    to build a solid foundation.


    * * *


    In conclusion, the Hangman game is an exciting project that blends fun with learning.
    As we progress through this section, remember to test your game frequently and
    enjoy the process. By the end of it, not only will you have a deeper understanding
    of web development techniques, but you''ll also have a game to play and share.
    Let''s get started!


    Draw Hangman With SVG


    SVG, or Scalable Vector Graphics, is an XML-based format for two-dimensional graphics.
    The beauty of SVG is that it can scale indefinitely without losing any quality,
    making it a popular choice for web graphics. In this chapter, we’ll utilize SVG
    to draw the iconic hangman figure step by step.


    * * *


    Getting Started with SVG


    SVG graphics are defined in XML, which means every element and attribute in the
    SVG is accessible via your JavaScript, allowing for dynamic creation and manipulation.


    Here''s a basic structure of an SVG:


    ```xml


    <svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">


    <!-- SVG content goes here -->


    </svg>


    ```


    This defines an SVG canvas of 300x300 units. Anything drawn outside of this area
    will be clipped out.


    * * *


    Setting Up the Hangman Stand


    Before drawing the hangman figure itself, let''s set up the hangman stand.


    ```xml


    <svg width="200" height="250" xmlns="http://www.w3.org/2000/svg">


    <!-- Vertical line -->


    <line x1="60" y1="20" x2="60" y2="200" style="stroke:black;stroke-width:5"/>


    <!-- Horizontal line -->


    <line x1="10" y1="20" x2="150" y2="20" style="stroke:black;stroke-width:5"/>


    <!-- Small vertical line -->


    <line x1="140" y1="20" x2="140" y2="40" style="stroke:black;stroke-width:5"/>


    </svg>


    ```


    * * *


    Drawing the Hangman with SVG


    To break the drawing process into manageable steps, we’ll draw the hangman piece
    by piece. For each incorrect guess, a new part of the hangman will appear.


    1\. Head


    Using the `<circle>` SVG element:


    ```xml


    <circle cx="140" cy="60" r="20" stroke="black" stroke-width="3" fill="white" />


    ```


    Here, `cx` and `cy` determine the circle''s center, while `r` defines the radius.


    2\. Body


    Using the `<line>` SVG element:


    ```xml


    <line x1="140" y1="80" x2="140" y2="120" style="stroke:black;stroke-width:3"/>


    ```


    3\. Left Arm


    ```xml


    <line x1="140" y1="90" x2="120" y2="110" style="stroke:black;stroke-width:3"/>


    ```


    4\. Right Arm


    ```xml


    <line x1="140" y1="90" x2="160" y2="110" style="stroke:black;stroke-width:3"/>


    ```


    5\. Left Leg


    ```xml


    <line x1="140" y1="120" x2="120" y2="150" style="stroke:black;stroke-width:3"/>


    ```


    6\. Right Leg


    ```xml


    <line x1="140" y1="120" x2="160" y2="150" style="stroke:black;stroke-width:3"/>


    ```


    * * *


    Dynamic Drawing with JavaScript


    Instead of showing the entire figure right away, we want to draw each part in
    response to incorrect guesses. This means dynamically adding SVG elements using
    JavaScript.


    Here''s a sample code snippet to show the head after one incorrect guess:


    ```javascript


    const svgNamespace = "http://www.w3.org/2000/svg";


    function drawHead() {


    let circle = document.createElementNS(svgNamespace, "circle");


    circle.setAttribute("cx", "140");


    circle.setAttribute("cy", "60");


    circle.setAttribute("r", "20");


    circle.setAttribute("stroke", "black");


    circle.setAttribute("stroke-width", "3");


    circle.setAttribute("fill", "white");


    document.querySelector("svg").appendChild(circle);


    }


    ```


    Repeat similar functions for the body, arms, and legs. Trigger the drawing functions
    based on the game''s state and the number of incorrect guesses.


    * * *


    Conclusion


    Drawing with SVG provides immense flexibility when creating graphics for web applications.
    In this chapter, we explored how to use SVG to dynamically draw the hangman figure
    for our game. By integrating SVG with JavaScript, we can make our game more interactive
    and responsive to player actions. As you progress with the Hangman game project,
    you''ll appreciate the power and flexibility SVG brings to web development.


    Main Styling


    Welcome to Chapter 40 of our journey through creating a Hangman game. Now that
    we have a sketch of our hangman using SVG, it''s time to give our game a visual
    appeal that is inviting and intuitive. We''ll cover the main styling for our Hangman
    game, focusing on creating an engaging user experience.


    * * *


    1\. Setting up the Basic Layout


    Before diving into the specific elements, let''s define some base styles to create
    a consistent look.


    ```css


    * {


    margin: 0;


    padding: 0;


    box-sizing: border-box;


    font-family: ''Arial'', sans-serif;


    }


    body {


    background-color: f4f4f4;


    color: 333;


    font-size: 16px;


    line-height: 1.5;


    }


    .container {


    max-width: 800px;


    margin: 2em auto;


    background-color: fff;


    padding: 20px;


    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);


    }


    ```


    This sets a neutral background color, a default font, and a centered container
    for our game.


    * * *


    2\. Hangman Board Styling


    Our hangman board will be the main attraction, so let''s ensure it looks appealing.


    ```css


    .hangman-board {


    display: flex;


    justify-content: space-between;


    margin-bottom: 20px;


    }


    .hangman-figure {


    flex: 1;


    display: inline-block;


    position: relative;


    width: 250px;


    height: 250px;


    }


    ```


    * * *


    3\. Word Placeholder


    The word that players are guessing will be displayed with underscores for each
    unguessed letter. We''ll style these so they''re easy to read and spaced nicely.


    ```css


    .word {


    display: flex;


    justify-content: center;


    align-items: center;


    height: 50px;


    margin-bottom: 20px;


    }


    .letter, .placeholder {


    margin: 0 5px;


    font-size: 2em;


    font-weight: bold;


    display: inline-block;


    width: 30px;


    border-bottom: 2px solid 333;


    text-align: center;


    }


    ```


    * * *


    4\. Keyboard


    For our game, players will select letters from an on-screen keyboard. Let’s style
    these buttons:


    ```css


    .keyboard {


    display: flex;


    flex-wrap: wrap;


    justify-content: center;


    }


    .key {


    margin: 5px;


    padding: 10px 15px;


    border: none;


    background-color: f4f4f4;


    cursor: pointer;


    border-radius: 4px;


    transition: background-color 0.2s ease;


    }


    .key:hover {


    background-color: ddd;


    }


    ```


    * * *


    5\. Notification Pop-up


    We''ll use a pop-up to notify players when they select a repeated letter.


    ```css


    .notification {


    position: absolute;


    top: 10px;


    right: 10px;


    background-color: e74c3c;


    color: fff;


    padding: 10px 20px;


    border-radius: 4px;


    visibility: hidden;


    opacity: 0;


    transition: opacity 0.3s ease, visibility 0.3s ease;


    }


    .show-notification {


    visibility: visible;


    opacity: 1;


    }


    ```


    * * *


    6\. Responsiveness


    Finally, let’s ensure our game looks good on smaller screens.'
