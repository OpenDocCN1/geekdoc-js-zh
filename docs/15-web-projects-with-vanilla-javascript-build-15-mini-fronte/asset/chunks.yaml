    Generate Random Users - Fetch w/ Async/Await


    Generating random users for a project can be essential, especially when building
    applications that require user data but you don''t want to use actual personal
    data. In this chapter, we will be fetching random user data using the Random User
    Generator API. The Fetch API combined with Async/Await makes the process of obtaining
    this data smooth and efficient.


    * * *


    Setting Up The API


    Before we dive into the code, you need to be familiar with the API we will be
    using. The Random User Generator is a free, open-source API that provides random
    user data in JSON format. The data can include things like name, picture, location,
    email, and more.


    API Endpoint: `https://randomuser.me/api/`


    * * *


    Getting Started with Fetch and Async/Await


    Before we work with Async/Await, let''s understand the basics of the Fetch API.


    The Fetch API provides an interface for fetching resources. In simpler words,
    it lets you communicate with other websites and servers, which is essential when
    we want to retrieve or send data.


    A basic fetch request looks like this:


    ```javascript


    fetch(''https://randomuser.me/api/'')


    .then(response => response.json())


    .then(data => console.log(data));


    ```


    However, we''ll be utilizing `async/await` to make our code cleaner and easier
    to understand. With `async/await`, our code becomes:


    ```javascript


    async function fetchUsers() {


    let response = await fetch(''https://randomuser.me/api/'');


    let data = await response.json();


    console.log(data);


    }


    fetchUsers();


    ```


    * * *


    Generating Random Users


    To fetch multiple users, we need to specify the number of users we want by adding
    a parameter to the API endpoint.


    For instance, to fetch 5 users:


    `https://randomuser.me/api/?results=5`


    Let''s integrate this into our function:


    ```javascript


    async function fetchMultipleUsers(num) {


    let response = await fetch(`https://randomuser.me/api/?results=${num}`);


    let data = await response.json();


    displayUsers(data.results); // We will create this function next


    }


    fetchMultipleUsers(5);


    ```


    * * *


    Displaying the Users


    Now that we''ve fetched the users, we want to display them in our HTML. For this
    example, we''ll create a simple list of names.


    ```javascript


    function displayUsers(users) {


    const usersContainer = document.getElementById(''usersContainer'');


    users.forEach(user => {


    const userElement = document.createElement(''div'');


    userElement.innerHTML = `


    <h2>${user.name.title} ${user.name.first} ${user.name.last}</h2>


    <img src="${user.picture.medium}" alt="${user.name.first}">


    <p>Email: ${user.email}</p>


    <p>Location: ${user.location.city}, ${user.location.state}</p>


    `;


    usersContainer.appendChild(userElement);


    });


    }


    ```


    Ensure you have an element in your HTML with the id `usersContainer`:


    ```html


    <div id="usersContainer"></div>


    ```


    * * *


    Handling Errors


    When working with APIs, it''s crucial to handle errors gracefully. Network problems,
    API downtimes, or request limits can cause issues. With `async/await`, we can
    use simple try/catch blocks:


    ```javascript


    async function fetchMultipleUsers(num) {


    try {


    let response = await fetch(`https://randomuser.me/api/?results=${num}`);


    if (!response.ok) {


    throw new Error(`HTTP error! Status: ${response.status}`);


    }


    let data = await response.json();


    displayUsers(data.results);


    } catch (error) {


    console.error(''Fetch error: '' + error.message);


    }


    }


    ```


    * * *


    Conclusion


    In this chapter, we learned how to generate random user data using the Random
    User Generator API, integrated with the Fetch API and Async/Await. This technique
    can be instrumental when you want to create mock data for your applications, especially
    during the development phase.


    Remember, always refer to the API''s documentation if you wish to explore more
    features or if you run into any issues. APIs are powerful tools, and mastering
    them can elevate your projects significantly.


    Output Users - forEach() & DOM Methods


    Welcome to Chapter 28! In this chapter, we will take a deep dive into how we can
    output a list of users to our web page using the `forEach()` method and DOM manipulation
    techniques. We will be working on the DOM Array Methods project, and our goal
    is to fetch a list of random users and display them in a user-friendly format.


    * * *


    Prerequisites:


    Before jumping into this chapter, make sure you have:


    1\. Basic understanding of JavaScript and its ES6 syntax.


    2\. Familiarity with the Document Object Model (DOM).


    3\. Completed Chapter 27 where we generated a list of random users using Fetch
    with Async/Await.


    * * *


    Step 1: Setting Up Our HTML Structure


    We need a section in our HTML where we will output our users. Let''s create a
    simple `div` to hold our users:


    ```html


    <div id="users-output"></div>


    ```


    * * *


    Step 2: Fetching Users


    Assuming you''ve fetched the users in the previous chapter, you should have an
    array of user objects. For simplicity''s sake, let''s say our array looks something
    like this:


    ```javascript


    const users = [


    {id: 1, name: ''John Doe'', age: 32},


    {id: 2, name: ''Jane Smith'', age: 28},


    // ... more users


    ];


    ```


    * * *


    Step 3: Outputting Users with `forEach()` & DOM Methods


    Now, let''s use the `forEach()` method to loop through each user and display them:


    ```javascript


    const outputDiv = document.getElementById(''users-output'');


    users.forEach(user => {


    // Create a new div for each user


    const userDiv = document.createElement(''div'');


    userDiv.className = ''user'';


    // Create an innerHTML template for the user


    userDiv.innerHTML = `


    <h3>${user.name}</h3>


    <p>Age: ${user.age}</p>


    `;


    // Append the user div to the main output div


    outputDiv.appendChild(userDiv);


    });


    ```


    In the code above:


    1\. We first get a reference to our main output div.


    2\. Using `forEach()`, we loop through each user.


    3\. For each user, we create a new `div`.


    4\. We then set the `innerHTML` of that div to a template which displays the user''s
    name and age.


    5\. Finally, we append this user div to the main output div.


    * * *


    Step 4: Styling Our Users


    While this is mainly a JavaScript-focused chapter, adding a bit of CSS can help
    in presenting our users more attractively:


    ```css


    .user {


    border: 1px solid ccc;


    padding: 10px;


    margin: 10px 0;


    border-radius: 5px;


    }


    ```


    This will give each user a nice box with some spacing between each one.


    * * *


    Summary:


    In this chapter, we learned how to use the `forEach()` method in conjunction with
    DOM methods to output users to our web page. This is a fundamental pattern in
    web development – fetching data and then displaying it to the user.


    In the next chapter, we will enhance our project by adding functionalities that
    allow users to double their money using the `map()` method. Stay tuned!


    * * *


    Note: Remember that in a real-world scenario, the user data would be fetched from
