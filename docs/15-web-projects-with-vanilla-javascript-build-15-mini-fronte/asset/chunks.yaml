    欢迎回来！在搭建好“菜单滑块与模态框”项目的基本结构后，现在是时候为我们的页眉（header）和模态框（modal）添加一些吸引人的视觉效果了。样式设计是任何
    Web 项目的关键部分，它能增强用户体验，并确保你的应用程序赏心悦目。在本章中，我们将重点讨论如何使用纯 CSS 为页眉和模态框设计样式。


    ## 1. 页眉样式设计


    我们的页眉通常包含网站标题，可能还有一个导航菜单按钮。让我们在保持简洁的同时，使其脱颖而出。


    ### HTML 结构回顾：


    ```html

    <header>

    <h1>Our Website</h1>

    <button id="menu-btn">Menu</button>

    </header>

    ```


    ### CSS：


    ```css

    /* Base Styling for the Header */

    header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 1rem 2rem;

    background-color: 333;

    color: white;

    box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.2);

    }

    header h1 {

    font-size: 2rem;

    }

    menu-btn {

    background-color: 555;

    border: none;

    color: white;

    padding: 0.5rem 1rem;

    cursor: pointer;

    border-radius: 5px;

    transition: background-color 0.3s;

    }

    menu-btn:hover {

    background-color: 777;

    }

    ```


    在这里，我们为页眉使用了 flexbox 布局，以便将标题和按钮分开排列。`box-shadow` 为页眉提供了一种微妙的悬浮效果。


    ## 2. 模态框样式设计


    模态框是本项目的一个关键部分。它应该能吸引用户的注意力，但又不能过于干扰。


    ### HTML 结构回顾：


    ```html

    <div id="modal">

    <div class="modal-content">

    <span class="close-btn">&times;</span>

    <h2>Modal Title</h2>

    <p>Some content here...</p>

    </div>

    </div>

    ```


    ### CSS：


    ```css

    /* Base Styling for the Modal */

    modal {

    display: none;

    position: fixed;

    top: 0;

    left: 0;

    width: 100vw;

    height: 100vh;

    background-color: rgba(0, 0, 0, 0.7);

    z-index: 1000;

    align-items: center;

    justify-content: center;

    }

    .modal-content {

    background-color: fff;

    padding: 2rem;

    width: 70%;

    max-width: 500px;

    border-radius: 10px;

    box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.3);

    }

    .close-btn {

    position: absolute;

    top: 10px;

    right: 15px;

    font-size: 1.5rem;

    cursor: pointer;

    transition: color 0.3s;

    }

    .close-btn:hover {

    color: red;

    }

    ```


    外部的 `modal` div 延伸至整个视口，并具有半透明背景，以便将焦点集中在模态框内容上。`.modal-content` div 承载实际的模态框内容，得益于其白色，在深色背景下显得格外突出。


    `close-btn` 位于模态框的右上角。我们还添加了悬停效果，以便向用户提供反馈。


    ### 总结


    随着页眉和模态框样式的完成，我们的项目开始初具规模。样式设计在决定应用程序的感受和氛围方面起着至关重要的作用，到目前为止，你应该已经更好地理解了如何使用纯
    CSS 来实现这一点。


    在下一章中，我们将深入研究菜单和模态框切换功能背后的 JavaScript，让我们的项目“活”起来！


    ## 菜单与模态框切换


    在本章中，我们将学习如何使用文档对象模型（DOM）和层叠样式表（CSS）为我们的菜单和模态框实现切换机制。切换（Toggles）在 Web 设计中经常被用来在用户交互时显示或隐藏内容。它们通过提供动态界面来增强用户体验。


    ### 1. HTML 结构：


    在深入研究切换功能的 JavaScript 和 CSS 之前，让我们先搭建基本的 HTML 结构：


    ```html

    <div id="menu-container">

    <button id="menu-button">Menu</button>

    <div id="menu-content" class="hidden">

    <ul>

    <li><a href="">Home</a></li>

    <li><a href="">About</a></li>

    <li><a href="">Services</a></li>

    </ul>

    </div>

    </div>

    <button id="open-modal-btn">Open Modal</button>

    <div id="myModal" class="modal hidden">

    <div class="modal-content">

    <span id="close-modal-btn" class="close">&times;</span>

    <p>Welcome to our website!</p>

    </div>

    </div>

    ```


    注意：我们为 `menu-content` 和 `myModal` 都添加了 `hidden` 类，以便在初始状态下隐藏它们。


    ### 2. 切换样式设计：


    `hidden` 类至关重要，因为它将帮助我们切换菜单和模态框的显示状态：


    ```css

    .hidden {

    display: none;

    }

    .menu {

    /* Add general styling for the menu here */

    }

    .modal {

    position: fixed;

    z-index: 1;

    left: 0;

    top: 0;

    width: 100%;

    height: 100%;

    background-color: rgba(0,0,0,0.4);

    }

    .modal-content {

    background-color: fefefe;

    margin: 15% auto;

    padding: 20px;

    border: 1px solid 888;

    width: 80%;

    }

    ```


    ### 3. JavaScript 切换机制：


    使用 JavaScript，我们可以轻松地切换菜单和模态框的可见性：


    ```javascript

    document.addEventListener(''DOMContentLoaded'', function() {

    const menuBtn = document.getElementById("menu-button");

    const modalBtn = document.getElementById("open-modal-btn");

    const closeModalBtn = document.getElementById("close-modal-btn");

    const menuContent = document.getElementById("menu-content");

    const myModal = document.getElementById("myModal");

    menuBtn.addEventListener("click", function() {

    toggleVisibility(menuContent);

    });

    modalBtn.addEventListener("click", function() {

    toggleVisibility(myModal);

    });

    closeModalBtn.addEventListener("click", function() {

    toggleVisibility(myModal);

    });

    function toggleVisibility(element) {

    if (element.classList.contains(''hidden'')) {

    element.classList.remove(''hidden'');

    } else {

    element.classList.add(''hidden'');

    }

    }

    });

    ```


    上述脚本监听 `DOMContentLoaded` 事件，确保 JavaScript 仅在整个 HTML 文档完全加载后才运行。我们定义了一个 `toggleVisibility()`
    函数，通过添加或删除 `hidden` 类来切换元素的可见性。


    ### 总结：


    在本章结束时，你已经学习了如何将 JavaScript 和 CSS 结合使用，为菜单和模态框创建切换机制。通过将这些知识整合到你的 Web 项目中，你可以创建更具交互性和动态的用户界面。


    # 第 8 节：项目 7 - 猜词游戏 (Hangman Game) | DOM, SVG, 事件


    ## 项目介绍


    欢迎来到我们的第七个项目 —— 猜词游戏（Hangman Game）！这款经典的文字游戏不仅考验你的词汇量，还能在 SVG 图形、DOM 动态内容操作和 JavaScript
    事件捕获用户输入的帮助下，提供愉悦的用户体验。到本项目结束时，你将拥有一个功能完整的猜词游戏，可以向朋友展示，甚至将其加入你的 Web 作品集。


    ### 游戏目标：


    猜词游戏的目标很简单。随机选择一个单词或短语，玩家必须逐个字母地猜测该单词。每次猜错，就会画出“吊死鬼”图形的一部分。当图形绘制完成（表示所有猜测均错误）或单词/短语被完全正确猜出时，游戏结束。


    ### 你将学到：


    - SVG (可缩放矢量图形)：你将了解如何使用 SVG 来绘制和动画化吊死鬼图形。SVG 是向网页添加矢量图形的强大方式，并且可以使用 CSS 和 JavaScript
    进行操作。

    - DOM 操作：与之前的项目一样，DOM 起着至关重要的作用。你将根据用户的猜测更新显示内容、揭晓字母、显示通知等。

    - JavaScript 事件：用户输入在猜词游戏中至关重要。你将利用键盘事件来捕获用户猜测，利用按钮点击事件进行游戏控制等。

    - 游戏逻辑：每个游戏背后都有一套规则和逻辑。你将设置条件来检查玩家的猜测，确定游戏何时获胜或失败等。


    ### 为什么选择猜词游戏？


