    Project CSS


    Welcome to the styling portion of our first project: the Form Validator. As you
    may recall, the aim of this project is to introduce you to the basics of web development,
    and one of the essential aspects of building a visually appealing web application
    is styling. CSS (Cascading Style Sheets) allows us to apply styles to our HTML
    documents, making them more aesthetically pleasing and user-friendly.


    For our form validator, we''re going to focus on creating a neat, simple, and
    intuitive design that guides users through the process of inputting their details.
    The goal here is not just to make things look nice but also to use styles as a
    tool for better usability.


    * * *


    1\. Base Styles:


    Let''s begin by adding some general styles to our form:


    ```css


    body {


    font-family: Arial, sans-serif;


    line-height: 1.6;


    background-color: f4f4f4;


    display: flex;


    justify-content: center;


    align-items: center;


    height: 100vh;


    }


    .container {


    background-color: fff;


    padding: 20px;


    border-radius: 5px;


    box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);


    width: 400px;


    }


    ```


    These base styles will provide a pleasant gray background, center our form on
    the page, and give the form container a nice shadow and rounded corners.


    * * *


    2\. Form Styles:


    Now, let''s style the form elements.


    ```css


    form {


    width: 100%;


    }


    form label {


    display: block;


    margin-bottom: 5px;


    font-weight: bold;


    }


    form input[type="text"],


    form input[type="password"],


    form input[type="email"] {


    width: 100%;


    padding: 10px;


    margin-bottom: 10px;


    border: 1px solid ccc;


    border-radius: 4px;


    }


    form button {


    display: block;


    width: 100%;


    padding: 10px;


    border: none;


    border-radius: 4px;


    background-color: 333;


    color: fff;


    cursor: pointer;


    }


    ```


    These styles make our form inputs stretch to take up the full width of the container,
    making it easier for users to click into them. They also apply some padding for
    better visual spacing and a neat appearance.


    * * *


    3\. Validation Feedback Styles:


    To provide immediate feedback to users, let''s add some styles to highlight invalid
    and valid fields:


    ```css


    .invalid {


    border-color: red;


    background-color: ffe6e6;


    }


    .valid {


    border-color: green;


    background-color: e6ffe6;


    }


    .error-message {


    color: red;


    font-weight: bold;


    font-size: 0.8rem;


    margin-top: -10px;


    margin-bottom: 10px;


    }


    ```


    The `.invalid` and `.valid` classes provide a visual cue about the input field
    status by changing border colors. The `.error-message` class will be used for
    displaying specific error messages next to our input fields.


    * * *


    4\. Responsive Design:


    Considering the growing number of mobile users, our form should be responsive:


    ```css


    @media screen and (max-width: 420px) {


    .container {


    width: 90%;


    }


    }


    ```


    This media query ensures that on smaller screens, our form takes up most of the
    viewport width, leaving a small margin on the sides.


    * * *


    Conclusion:


    CSS is a powerful tool that goes beyond just making things look good. With the
    styles we''ve added, our form is now not only visually appealing but also user-friendly.
    The visual cues from our validation feedback styles will guide users through the
    form, making the entire process intuitive and efficient.


