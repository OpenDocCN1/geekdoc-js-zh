  trans: "\n\n在本章中，我们介绍了如何使用 Fetch API 结合 Async/Await 从 API 端点获取初始帖子。我们还学习了如何将这些帖子显示在网页上。在下一章中，我们将添加无限滚动功能，当用户向下滚动页面时，该功能会加载更多帖子。\n\
    \n请记住，虽然 `jsonplaceholder` 非常适合学习和测试，但在实际应用中，你需要使用自己的后端或提供所需内容的第三方服务。始终确保优雅地处理错误，以提升用户体验。\n\
    \n## 添加无限滚动\n\n欢迎来到第 61 章！在这里，我们将实现现代网站上最受欢迎的功能之一：无限滚动。该技术通过用户滚动时持续加载内容来提升用户体验，无需分页按钮。为此，我们将利用\
    \ Fetch 和 Async/Await 的强大功能，并结合一些 CSS 魔法。让我们开始吧！\n\n* * *\n\n### 1. 理解无限滚动\n\n\
    无限滚动是一种网页设计技术，当用户向下滚动页面时，内容会持续加载，无需分页。它广泛应用于社交媒体平台、博客和新闻网站，以提高用户参与度。原理很简单：当用户接近内容底部时，会获取并追加更多内容。\n\
    \n* * *\n\n### 2. 环境设置\n\n在实现无限滚动之前，请确保你具备：\n\n- 一个 API 或数据源，用于获取帖子或数据。\n- HTML\
    \ 中用于显示获取数据的容器。\n- 加载动画的基本样式（请参考第 59 章了解 CSS 和加载动画）。\n\n* * *\n\n### 3. 监听滚动事件\n\
    \n为了检测用户何时接近页面底部，我们将使用 `scroll` 事件。\n\n```javascript\nwindow.addEventListener('scroll',\
    \ () => {\n  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight\
    \ - 10) {\n    loadMorePosts();\n  }\n});\n```\n\n事件内部的条件检查视口高度与滚动偏移量之和是否大于或等于整个文档的高度减去一个小的阈值（此处为\
    \ 10 像素）。\n\n* * *\n\n### 4. 获取更多帖子\n\n`loadMorePosts` 函数将处理获取更多帖子的操作。\n\n```javascript\n\
    async function loadMorePosts() {\n  // 显示加载动画\n  showLoader();\n\n  // 延迟以模拟数据获取\n\
    \  await setTimeout(() => {}, 1000);\n\n  // 获取下一组帖子\n  const response = await\
    \ fetch('YOUR_API_ENDPOINT_HERE');\n  const data = await response.json();\n\n\
    \  // 渲染获取到的帖子\n  displayPosts(data);\n\n  // 隐藏加载动画\n  hideLoader();\n}\n```\n\
    \n这里，`showLoader()` 和 `hideLoader()` 分别是显示和隐藏加载动画的函数。请务必将 `'YOUR_API_ENDPOINT_HERE'`\
    \ 替换为你的实际 API 端点。\n\n* * *\n\n### 5. 追加帖子\n\n在 `displayPosts` 函数中，遍历获取到的数据并将每个帖子追加到你的容器中。\n\
    \n```javascript\nfunction displayPosts(posts) {\n  posts.forEach(post => {\n \
    \   const postElement = document.createElement('div');\n    postElement.classList.add('post');\n\
    \    postElement.innerHTML = `\n      <h2>${post.title}</h2>\n      <p>${post.body}</p>\n\
    \    `;\n    document.querySelector('.posts-container').appendChild(postElement);\n\
    \  });\n}\n```\n\n请确保你的 HTML 中有一个 `.posts-container` 或类似的元素来追加这些帖子。\n\n* * *\n\
    \n### 6. 处理边界情况\n\n为了获得无缝的用户体验：\n\n- 处理没有更多内容可获取的情况，并相应通知用户。\n- 确保在获取过程中出现错误时，加载动画不会卡住。\n\
    - 根据内容结构和期望的用户体验调整阈值（本例中为 10 像素）。\n\n* * *\n\n### 结论\n\n无限滚动是一种强大的技术，可提高内容丰富网站的用户参与度。通过利用\
    \ Fetch 和 Async/Await 等现代 JavaScript 功能，我们可以轻松地在 Web 项目中实现此功能。始终记住处理边界情况并向用户提供反馈，以获得流畅的浏览体验。\n\
    \n**注意：** 本章假设你对 Fetch API、Async/Await 和 CSS 动画有基本了解。如果没有，请重新阅读前面的章节以深入理解。提供的代码是一个基本实现，可能需要根据你的项目和\
    \ API 的具体情况进行调整。\n\n## 过滤已获取的帖子\n\n欢迎回到“无限滚动帖子”项目。在已经获取帖子并实现无限滚动之后，我们的下一个目标是引入一个功能，允许用户过滤已获取的帖子。这将使用户能够快速找到特定帖子，从而提升用户体验。\n\
    \n**目标：** 实现一个过滤功能，允许用户根据标题和内容搜索已获取的帖子。\n\n* * *\n\n### 先决条件：\n\n1. 具备 JavaScript\
    \ 的工作知识，特别是 ES6+ 特性，如 Async/Await。\n2. 熟悉 DOM（文档对象模型）并使用 JavaScript 操作它。\n3. 本项目前面的章节，其中我们设置了帖子获取和无限滚动。\n\
    \n* * *\n\n### 步骤 1：设置过滤输入字段\n\n我们需要一个输入字段，用户可以在其中输入搜索查询：\n\n```html\n<input type=\"\
    text\" id=\"filter\" placeholder=\"过滤帖子...\">\n```\n\n* * *\n\n### 步骤 2：JavaScript\
    \ 实现\n\n#### a. 访问输入元素\n\n使用 DOM 访问输入元素：\n\n```javascript\nconst filterInput =\
    \ document.getElementById('filter');\n```\n\n#### b. 事件监听器\n\n我们将为输入元素附加一个事件监听器，以检测用户何时输入：\n\
    \n```javascript\nfilterInput.addEventListener('input', filterPosts);\n```\n\n\
    #### c. 过滤函数\n\n此函数是过滤功能的核心：\n\n```javascript\nfunction filterPosts(e) {\n  const\
    \ searchTerm = e.target.value.toUpperCase(); // 将输入转换为大写以实现不区分大小写的搜索\n  const\
    \ posts = document.querySelectorAll('.post'); // 假设每个帖子都有一个 'post' 类\n\n  posts.forEach(post\
    \ => {\n    const postTitle = post.querySelector('.post-title').innerText.toUpperCase();\n\
    \    const postContent = post.querySelector('.post-content').innerText.toUpperCase();\n\
    \n    // 检查搜索词是否存在于帖子标题或内容中\n    if (postTitle.indexOf(searchTerm) > -1 || postContent.indexOf(searchTerm)\
    \ > -1) {\n      post.style.display = 'block';\n    } else {\n      post.style.display\
    \ = 'none';\n    }\n  });\n}\n```\n\n**解释：**\n\n- 我们使用 `input` 事件，该事件在输入字段的 `value`\
    \ 每次更改时触发。\n- 在 `filterPosts` 函数中：\n  - 将搜索词转换为大写，以确保搜索不区分大小写。\n  - 我们选择所有帖子。在此示例中，我假设每个帖子都有一个\
    \ `'post'` 类。\n  - 对于每个帖子，我们检查搜索词是否存在于其标题或内容中。如果存在，则显示该帖子；否则隐藏它。\n\n* * *\n\n\
    ### 步骤 3：增强功能\n\n#### a. 添加延迟\n\n即时过滤可能会让人感到突兀，尤其是在处理较大数据集时。考虑使用 `setTimeout`\
    \ 添加延迟。\n\n#### b. 旋转器或加载器\n\n如果过滤需要时间，显示旋转器可以提升用户体验。你可以重用前面章节中实现的 CSS 加载器。\n\n\
    #### c. 高亮匹配文本\n\n通过高亮帖子中匹配的文本来增强用户体验。这可以通过使用 `Regex` 和操作帖子元素的 `innerHTML` 属性来实现。\n\
    \n* * *\n\n### 结论\n\n过滤是一项强大的功能，可极大地提升用户体验，使用户能够快速高效地找到所需信息。通过上述实现，你的无限滚动帖子项目的用户现在可以轻松搜索帖子。\n\
    \n## 第 12 节：项目 11 - 语音文本阅读器 | 语音合成\n\n### 项目介绍\n\n"
