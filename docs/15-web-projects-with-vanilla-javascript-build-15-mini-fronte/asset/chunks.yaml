  trans: "\n\n- 你将能够在不同场景中实现拖放功能，而不仅仅是用于排序列表。\n\n---\n\n## 前置条件\n\n虽然我们会详细解释每一步，但你需要具备以下基础知识：\n\
    \n- HTML：用于构建列表结构。\n- CSS：用于设置列表样式，并在拖放过程中提供视觉提示。\n- JavaScript：用于处理拖放事件并操作 DOM。\n\
    \n---\n\n## 总结\n\n拖放 API 为网页开启了交互可能性的新世界。无论是构建游戏、计划表还是可视化组织工具，理解如何利用它的力量都能让你的项目脱颖而出。\n\
    \n你准备好了吗？让我们直接开始构建可排序列表吧！\n\n# 将列表项插入 DOM\n\n在本章中，我们将探讨 Web 开发中的基础任务之一——将列表项插入文档对象模型（DOM）。动态向\
    \ DOM 插入元素的能力对于创建动态 Web 应用至关重要。在我们的可排序列表项目中，我们将创建一个用户可以通过拖放列表项进行交互的列表。但在那之前，我们需要先将列表项放入\
    \ DOM。让我们开始吧！\n\n---\n\n## 理解 DOM\n\n在深入插入过程之前，理解什么是 DOM 至关重要。DOM 代表了 Web 文档的结构，每个元素、属性和文本片段都成为该结构中的一个节点。当我们谈论将列表项插入\
    \ DOM 时，本质上是在向这个结构添加节点。\n\n---\n\n## 基本列表结构\n\n在 HTML 中，使用无序列表的基本列表结构如下所示：\n\n\
    ```html\n<ul>\n  <li>Item 1</li>\n  <li>Item 2</li>\n  <li>Item 3</li>\n</ul>\n\
    ```\n\n在我们的可排序列表项目中，我们希望动态插入这些列表项。\n\n---\n\n## 使用 JavaScript 插入列表项\n\n以下是使用 JavaScript\
    \ 将列表项插入 DOM 的分步指南：\n\n1. 选择父元素\n\n在插入列表项之前，我们需要选择父元素。在我们的例子中，它是 `<ul>` 元素。\n\n\
    ```javascript\nconst list = document.querySelector('ul');\n```\n\n2. 创建列表项元素\n\
    \n我们可以使用 `document.createElement()` 方法创建一个新元素。\n\n```javascript\nconst listItem\
    \ = document.createElement('li');\n```\n\n3. 设置列表项的内容\n\n你可以使用 `textContent` 属性为新创建的列表项设置文本内容。\n\
    \n```javascript\nlistItem.textContent = 'Item 4';\n```\n\n4. 将列表项追加到父元素\n\n要将新的列表项插入\
    \ DOM，可以使用 `appendChild()` 方法。\n\n```javascript\nlist.appendChild(listItem);\n\
    ```\n\n如果你按照上述步骤操作，你的列表现在将如下所示：\n\n```html\n<ul>\n  <li>Item 1</li>\n  <li>Item\
    \ 2</li>\n  <li>Item 3</li>\n  <li>Item 4</li>\n</ul>\n```\n\n---\n\n## 动态插入多个列表项\n\
    \n为了使我们的项目具有交互性，我们可能希望一次插入多个列表项。例如，如果我们有一个项目数组，可以遍历该数组并将每个项目插入 DOM：\n\n```javascript\n\
    const items = ['Item 5', 'Item 6', 'Item 7'];\nitems.forEach(item => {\n  const\
    \ listItem = document.createElement('li');\n  listItem.textContent = item;\n \
    \ list.appendChild(listItem);\n});\n```\n\n这将把我们的列表扩展为：\n\n```html\n<ul>\n  <li>Item\
    \ 1</li>\n  <li>Item 2</li>\n  <li>Item 3</li>\n  <li>Item 4</li>\n  <li>Item\
    \ 5</li>\n  <li>Item 6</li>\n  <li>Item 7</li>\n</ul>\n```\n\n---\n\n## 总结\n\n\
    能够操作 DOM 是 Web 开发人员的基本技能。现在，你应该已经很好地理解了如何使用 JavaScript 动态地将列表项插入 DOM。在下一章中，我们将学习如何打乱这些列表项，并为我们的拖放功能做好准备。敬请期待！\n\
    \n# 打乱列表项\n\n在本章中，我们将介绍打乱可排序列表中项目的概念。目的是让用户挑战将列表重新排列回原始顺序。通过这样做，我们将提供一个拖放 API\
    \ 的实际应用场景，展示其实际用途。\n\n---\n\n## 理解打乱的需求\n\n在深入技术细节之前，让我们先理解打乱的需求。当我们向用户提供一个已排序的列表，然后要求他们在打乱后重新排列时，我们实际上是在给他们一个简单而有效的排序练习。这可以应用于现实场景，如排序任务、重新排列产品列表或任何其他需要排序的需求。\n\
    \n---\n\n## 开始\n\n首先，我们假设有一个项目列表，其 HTML 结构如下：\n\n```html\n<ul id=\"sortable-list\"\
    >\n  <li draggable=\"true\">Item 1</li>\n  <li draggable=\"true\">Item 2</li>\n\
    \  <li draggable=\"true\">Item 3</li>\n  <!--... 以此类推 -->\n</ul>\n```\n\n---\n\
    \n## JavaScript：打乱列表\n\n我们将使用现代版本的 Fisher-Yates（也称为 Knuth）洗牌算法。该算法确保列表的每种排列概率相等。\n\
    \n```javascript\nfunction scrambleList() {\n  const ul = document.querySelector('sortable-list');\n\
    \  const items = ul.getElementsByTagName('li');\n  let itemsArr = Array.prototype.slice.call(items);\n\
    \  itemsArr.sort(() => 0.5 - Math.random());\n  itemsArr.forEach(item => {\n \
    \   ul.appendChild(item);\n  });\n}\n```\n\n在这个函数中：\n\n- 我们首先通过 ID 选择无序列表。\n-\
    \ 我们获取无序列表中的所有列表项。\n- 我们将 HTML 集合转换为数组，以便对其使用数组方法。\n- 然后使用 `sort()` 方法打乱列表。逻辑\
    \ `0.5 - Math.random()` 是一种常用的随机排序技巧。\n- 最后，我们将每个打乱后的项目重新追加到列表中。\n\n---\n\n##\
    \ 执行打乱\n\n现在，你可能希望在应用程序的特定时刻触发打乱。为了演示，我们将添加一个按钮，点击后即可打乱列表。\n\n```html\n<button\
    \ onclick=\"scrambleList()\">打乱项目</button>\n```\n\n---\n\n## 总结\n\n通过引入打乱功能，你为可排序列表应用增加了一个交互层。这既给用户带来了挑战，也给了他们一个明确的目标：恢复顺序。在下一章中，我们将深入探讨应用的核心样式，并为拖放功能设置视觉舞台。记住，用户体验至关重要，我们提供的视觉反馈对于引导用户完成排序过程至关重要。\n\
    \n# 核心 CSS\n\nCSS，即层叠样式表，是控制 Web 应用外观和感觉的重要工具。在本章中，我们将深入探讨核心 CSS，为我们的可排序列表项目赋予简洁、专业的外观。请记住，好的\
    \ CSS 不仅能让你的应用视觉上吸引人，还能提升用户体验。\n\n---\n\n## 1. 重置默认样式\n\n在深入项目特定样式之前，确保重置浏览器默认样式至关重要。这将为我们提供跨不同浏览器的一致基线。\n\
    \n```css\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n```\n\
    \n---\n\n## 2. 设置 Body 和主容器\n\n`body` 和主容器元素决定了整个应用的基本样式和定位。\n\n```css\nbody {\n\
    \  font-family: 'Arial', sans-serif;\n  background-color: #f4f4f4;\n  color: #333;\n\
    \  font-size: 16px;\n  line-height: 1.6;\n}\n\n.wrapper {\n  width: 80%;\n  max-width:\
    \ 1200px;\n  margin: 40px auto;\n  padding: 20px;\n  background-color: #fff;\n\
    \  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n}\n```\n\n---\n\n## 3. 设置可排序列表的样式\n\
    \n对于我们的可排序列表，我们将设计一种样式，使每个列表项有所区分，同时明确表明它们可以被拖放。\n\n"
- fmt: "\n```css\n.sortable-list {\n  list-style-type: none;\n}\n\n.sortable-list\
    \ li {\n  padding: 15px;\n  border: 1px solid ddd;\n  cursor: move; /* Indicates\
    \ draggability */\n  margin-bottom: 10px;\n  background-color: f9f9f9;\n  transition:\
    \ background-color 0.2s;\n}\n\n.sortable-list li:hover {\n  background-color:\
    \ f4f4f4;\n}\n```\n\n---\n\n## 4. Drag & Drop Indication\n\nWhen a user drags\
    \ a list item, we'll want to give a visual indication. A simple way is to change\
    \ the background color.\n\n```css\n.sortable-list li.dragging {\n  background-color:\
    \ ddd;\n  border: 1px solid transparent;\n}\n```\n\n---\n\n## 5. Feedback and\
    \ Notifications\n\nIf you've integrated any feedback mechanism like an alert to\
    \ indicate the correct order, we'll want to style it accordingly.\n\n```css\n\
    .alert {\n  padding: 10px;\n  margin: 10px 0;\n  border: 1px solid transparent;\n\
    \  border-radius: 5px;\n}\n\n.alert.success {\n  color: 006400;\n  background-color:\
    \ e6ffe6;\n  border-color: 006400;\n}\n\n.alert.error {\n  color: a80000;\n  background-color:\
    \ ffe6e6;\n  border-color: a80000;\n}\n```\n\n---\n\n## 6. Additional Touches\n\
    \nFinally, you can add some additional touches to improve the aesthetics and user\
    \ experience. Consider adding `hover` effects, transitions, and possibly some\
    \ responsive media queries to ensure your sortable list looks good on all devices.\n\
    \n---\n\n## Conclusion\n\nCSS is a powerful tool that enables web developers to\
    \ create visually appealing and intuitive user interfaces. By using thoughtful\
    \ and purposeful styles, you can significantly improve user experience. In the\
    \ next chapters, we'll integrate the drag and drop API functionality into our\
    \ styled sortable list, adding functionality to our visually appealing design.\n\
    \nRemember, always test your designs on various devices and browsers to ensure\
    \ consistency and optimal user experience.\n\n---\n\n## Drag & Drop Functionality\n\
    \nDrag and Drop (DnD) functionality is a user interface pattern that allows users\
    \ to directly manipulate elements on the screen, offering an intuitive way to\
    \ rearrange elements, move data between containers, or even create elements by\
    \ dragging a new object into a designated space. In the context of our Sortable\
    \ List project, we'll use this feature to rearrange list items by dragging them\
    \ to their desired locations.\n\n---\n\n### Basics of the HTML Drag and Drop API\n\
    \nBefore diving into the code, it's crucial to understand the foundational concepts\
    \ of the Drag and Drop API:\n\n- `draggable` attribute: This attribute is set\
    \ on the element you wish to drag. Most HTML elements are not draggable by default,\
    \ so you need to set `draggable=\"true\"` on them.\n\n```html\n<div draggable=\"\
    true\">This is a draggable element.</div>\n```\n\n- Drag & Drop Events: These\
    \ are the primary events that the DnD API provides, which give us control over\
    \ the drag and drop lifecycle.\n  - `dragstart`: Triggered when the user starts\
    \ dragging an element.\n  - `drag`: Triggered as the element is being dragged.\n\
    \  - `dragend`: Triggered when the user releases the element.\n  - `dragenter`:\
    \ Triggered when a dragged element enters a drop target.\n  - `dragover`: Triggered\
    \ as the dragged element is over a drop target (many times).\n  - `dragleave`:\
    \ Triggered when a dragged element leaves a drop target.\n  - `drop`: Triggered\
    \ when the dragged element is dropped on a drop target.\n\n---\n\n### Implementing\
    \ Drag & Drop for our Sortable List\n\n#### 1. Setting Items as Draggable\n\n\
    Every list item that you want to be draggable should have the `draggable` attribute\
    \ set to `true`. Assuming you have a list like this:\n\n```html\n<ul id=\"sortable-list\"\
    >\n  <li draggable=\"true\">Item 1</li>\n  <li draggable=\"true\">Item 2</li>\n\
    \  <!-- ... -->\n</ul>\n```\n\n#### 2. Add Event Listeners\n\nNow, we'll attach\
    \ event listeners to handle the drag and drop operations.\n\n```javascript\nconst\
    \ listItems = document.querySelectorAll('sortable-list li');\n\nlistItems.forEach(item\
    \ => {\n  item.addEventListener('dragstart', handleDragStart);\n  item.addEventListener('dragover',\
    \ handleDragOver);\n  item.addEventListener('drop', handleDrop);\n  item.addEventListener('dragleave',\
    \ handleDragLeave);\n});\n```\n\n#### 3. Handling Drag Start\n\nWhen dragging\
    \ starts, we'll set some data on the event to recognize what's being dragged.\n\
    \n```javascript\nfunction handleDragStart(e) {\n  e.dataTransfer.setData('text/plain',\
    \ e.target.id);\n  setTimeout(() => {\n    e.target.classList.add('hidden');\n\
    \  }, 0);\n}\n```\n\nThe `hidden` class can be something simple that visually\
    \ hides the item, like:\n\n```css\n.hidden {\n  display: none;\n}\n```\n\n####\
    \ 4. Handling Drag Over\n\nBy default, dropping is disabled on most elements.\
    \ To allow a drop, we need to prevent the default handling of the event.\n\n```javascript\n\
    function handleDragOver(e) {\n  e.preventDefault();\n  e.target.classList.add('over');\n\
    }\n```\n\nThe `over` class can be a styling indication for the placeholder where\
    \ the element will be dropped.\n\n#### 5. Handling Drop\n\nThis is where the magic\
    \ happens! Here, we'll rearrange our list based on where the item was dropped.\n\
    \n```javascript\nfunction handleDrop(e) {\n  e.preventDefault();\n  const draggedId\
    \ = e.dataTransfer.getData('text/plain');\n  const draggedItem = document.getElementById(draggedId);\n\
    \  const dropTarget = e.target;\n\n  // Insert the dragged item before the drop\
    \ target\n  dropTarget.parentNode.insertBefore(draggedItem, dropTarget);\n  draggedItem.classList.remove('hidden');\n\
    }\n```\n\n#### 6. Handling Drag Leave\n\nWhen the draggable item leaves a potential\
    \ drop target, we want to remove any indication that the drop target is active.\n\
    \n```javascript\nfunction handleDragLeave(e) {\n  e.target.classList.remove('over');\n\
    }\n```\n\n---\n\n## Conclusion\n\nThe Drag and Drop API provides a powerful way\
    \ to implement intuitive interactions in your web projects. With this API, we\
    \ can create visually appealing interfaces where users can directly manipulate\
    \ on-screen elements, making for a more dynamic and engaging user experience.\n\
    \n---\n\n## Check Order\n\nAfter mastering the art of dragging and dropping items\
    \ on our sortable list, the next vital step is to check the order of the items.\
    \ This ensures that users receive feedback on their effort, thereby making the\
    \ sortable list interactive and intuitive.\n\nIn this chapter, we'll focus on\
    \ determining the correct order of the items after they've been sorted. We'll\
    \ walk through creating a function to validate the order, and then provide feedback\
    \ to the user based on their sorting performance.\n\n---\n\n### Prerequisites\n\
    \nBefore delving into the code, ensure that:\n\n- You have a working drag and\
    \ drop functionality from the previous chapters.\n- You have a predetermined correct\
    \ order for the list items to compare against.\n\n---\n\n### Setting Up the Correct\
    \ Order\n\nFor the sake of our tutorial, let's imagine our list represents the\
    \ order of planets from the sun:\n\n```javascript\nconst correctOrder = ['Mercury',\
    \ 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];\n```\n\n\
    ---\n\n### Checking the Order\n\nOnce a user finishes sorting the list, we need\
    \ to check the order against our `correctOrder` array.\n\n```javascript\nfunction\
    \ checkOrder() {\n  const listItems = document.querySelectorAll('li');\n  let\
    \ isCorrect = true;\n\n  listItems.forEach((item, index) => {\n    if (item.textContent\
    \ !== correctOrder[index]) {\n      isCorrect = false;\n    }\n  });\n\n  return\
    \ isCorrect;\n}\n```\n\nIn this function:\n\n- We first select all the `li` elements.\n\
    - We initialize a variable `isCorrect` to `true`.\n- We then loop through each\
    \ list item and compare its text content with the correct order. If any do not\
    \ match, we set `isCorrect` to `false`.\n\n---\n\n### Providing Feedback\n\nOnce\
    \ we've determined whether the order is correct or not, it's essential to provide\
    \ feedback to the user.\n\n```javascript\nfunction provideFeedback() {\n  const\
    \ isOrderCorrect = checkOrder();\n\n  if (isOrderCorrect) {\n    alert(\"Congratulations!\
    \ You've sorted the list correctly.\");\n  } else {\n    alert(\"Oops! That doesn't\
    \ seem right. Try again.\");\n  }\n}\n```\n\nNow, we'll call `provideFeedback`\
    \ every time a list item is dropped.\n\n---\n\n### Hooking Up the Feedback Function\
    \ to Drag & Drop\n\nUpdate your `drop` event listener:\n"
