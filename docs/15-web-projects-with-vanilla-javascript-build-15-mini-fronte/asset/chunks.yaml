  trans: "\n\n# JavaScript 数组方法探索\n\n在本章中，我们将探索 JavaScript 中一个非常实用的数组方法——`map()` 函数。它是我们在这个项目中深入研究的\
    \ DOM 数组方法之一。正如章节标题所示，我们将应用 `map()` 来将列表中的金额翻倍。这个实践练习将让你亲身体验 `map()` 函数的工作原理，以及如何在各种\
    \ Web 项目中利用它。\n\n## 什么是 map()？\n\n`map()` 方法是一个高阶函数，它创建一个新数组，其结果是调用数组中的每个元素上提供的函数后的返回值。与\
    \ `forEach()` 不同（它不返回任何内容），`map()` 返回一个新数组，而不会改变原始数组。\n\n### 基本语法\n\n```javascript\n\
    const newArray = array.map(function(currentValue, index, arr), thisValue);\n```\n\
    \n- `currentValue`：数组中正在处理的当前元素。\n- `index`（可选）：正在处理的当前元素的索引。\n- `arr`（可选）：调用\
    \ `map` 的数组。\n- `thisValue`（可选）：执行函数时用作 `this` 的对象。\n\n## 实际应用：金额翻倍\n\n假设你有一个用户列表，每个用户都有一个账户余额。也许你正在举办一个特别促销活动，为每个用户提供余额翻倍的机会。让我们看看如何使用\
    \ `map()` 函数来实现这一点。\n\n### 步骤 1：创建原始数组\n\n首先，让我们创建包含当前余额的初始用户数组：\n\n```javascript\n\
    const users = [\n  { name: 'Alice', balance: 100 },\n  { name: 'Bob', balance:\
    \ 200 },\n  { name: 'Charlie', balance: 150 },\n  { name: 'David', balance: 80\
    \ }\n];\n```\n\n### 步骤 2：使用 map() 翻倍金额\n\n为了将每个用户的金额翻倍，我们将使用 `map()` 函数。我们将针对\
    \ `balance` 属性并将其乘以 2：\n\n```javascript\nconst doubledBalances = users.map(user\
    \ => {\n  return {\n    ...user,\n    balance: user.balance * 2\n  };\n});\n```\n\
    \n在上面的代码片段中，我们为每个用户返回一个新对象。我们使用展开运算符（`...user`）展开原始用户属性，然后通过将当前值乘以 2 来覆盖 `balance`\
    \ 属性。\n\n### 步骤 3：显示结果\n\n现在，让我们显示结果，查看原始余额和翻倍后的余额：\n\n```javascript\nconsole.log(\"\
    原始余额:\", users);\nconsole.log(\"翻倍后的余额:\", doubledBalances);\n```\n\n## 为什么要使用\
    \ map()？\n\n1. **不可变性**：`map()` 最大的优点之一是它不会改变原始数组。这符合函数式编程原则，确保数据保持不变，有助于防止代码中出现意外的副作用。\n\
    2. **可链式调用**：由于 `map()` 返回一个新数组，你可以链式调用其他数组方法，如 `sort()`、`filter()` 等，使代码更简洁易读。\n\
    3. **灵活性**：提供的函数可以根据需要简单或复杂，允许对数组元素进行广泛的转换。\n\n## 结论\n\n`map()` 函数是 JavaScript\
    \ 工具箱中的一个强大工具。它提供了一种简单、高效且函数式的方式来转换数组中的数据。在本章中，我们利用 `map()` 将数组中每个用户的金额翻倍。然而，它的应用是多样化的，随着你在不同\
    \ Web 项目中的进展，你会发现无数场景中 `map()` 都会派上用场。\n\n# 按财富排序 - sort()\n\n在我们探索 Web 开发领域的旅程中，我们已经接触了各种\
    \ DOM 数组方法，每种方法都有其独特的能力。在本章中，我们将深入探讨 `sort()` 方法。它可能看起来只是一个简单的排序工具，但在 JavaScript\
    \ 中，它变成了一个多功能的工具，可以根据各种用例进行定制。我们的任务？按财富对用户列表进行排序，将最富有的人显示在最前面。\n\n## 理解 sort()\
    \ 方法\n\n`sort()` 方法的核心是根据某些比较标准对数组元素进行排序。默认情况下，它将元素作为字符串进行排序。因此，`[10, 2, 22].sort()`\
    \ 会返回 `[10, 2, 22]`。这可能不是你期望的结果，但这是 JavaScript 的默认行为。\n\n但别担心，`sort()` 方法允许我们定义自己的比较函数，从而赋予我们自定义排序方式的能力。\n\
    \n## sort() 的语法\n\n```javascript\narray.sort([compareFunction])\n```\n\n`compareFunction`\
    \ 是可选的，但对于我们的任务至关重要。该函数应返回：\n\n- 如果 `a` 应排在 `b` 之前，则返回负值\n- 如果 `a` 应排在 `b` 之后，则返回正值\n\
    - 如果 `a` 和 `b` 相等，则返回零\n\n## 按财富对用户排序\n\n假设我们有一个用户对象数组，每个对象都有 `name` 和 `wealth`\
    \ 属性：\n\n```javascript\nconst users = [\n  { name: 'John', wealth: 2300 },\n \
    \ { name: 'Sarah', wealth: 5800 },\n  { name: 'Mike', wealth: 4500 },\n];\n```\n\
    \n要按财富降序（最富有的在前）对这些用户进行排序，我们可以这样使用 `sort()` 方法：\n\n```javascript\nusers.sort((a,\
    \ b) => b.wealth - a.wealth);\n```\n\n这里，`(a, b)` 是 `users` 数组中两个连续的元素。减法结果为正或负值，帮助\
    \ `sort()` 决定顺序。\n\n## 可视化排序机制\n\n考虑两个用户：\n- 用户 A 财富为 5000\n- 用户 B 财富为 3000\n\n\
    按降序排序时：`b.wealth - a.wealth`：\n- 对于 A 和 B：3000 - 5000 = -2000（负值，所以 A 排在 B 之前）\n\
    \n现在你可以看到用户是如何按财富排序，最富有的排在最前面了！\n\n## 在 DOM 中显示排序后的用户\n\n排序后，你可能希望在 DOM 中显示用户。使用前面章节学到的技术，你可以创建并追加元素到\
    \ DOM 中。\n\n```javascript\nconst userList = document.querySelector('.users-list');\n\
    users.forEach(user => {\n  const userElement = document.createElement('div');\n\
    \  userElement.className = 'user';\n  userElement.innerHTML = `\n    <h3>${user.name}</h3>\n\
    \    <p>$${user.wealth.toLocaleString()}</p>\n  `;\n  userList.appendChild(userElement);\n\
    });\n```\n\n在上面的代码中，我们遍历每个用户，为他们创建一个新的 DOM 元素，并将其追加到 `.users-list` 容器中。`toLocaleString()`\
    \ 方法是一个巧妙的小技巧，用于格式化数字并添加逗号（或相应的区域符号）。\n\n## 结论\n\n`sort()` 方法虽然看起来简单，但它是 JavaScript\
    \ 工具箱中的必备工具。通过它，你成功按财富对用户进行了排序，丰富了 Web 应用程序的功能。这个方法的真正优势在于它的灵活性——通过定义自己的比较函数，我们可以以多种自定义方式对数组进行排序。\n\
    \n请记住，Web 开发不仅仅是了解工具，更是理解它们并创新地使用它们。随着你不断前进，思考在你的项目中还可以用 `sort()` 实现哪些令人兴奋的方式！\n\
    \n## 练习\n\n尝试按财富升序对用户进行排序。你会如何修改比较函数来实现这一点？\n\n在下一章中，我们将深入探讨 `filter()` 方法，这是一个根据特定条件精炼列表的强大工具。敬请期待！\n\
    \n# 显示百万富翁 - filter()\n\n欢迎来到第 31 章，我们将深入探讨 JavaScript 中最常用的数组方法之一：`filter()`\
    \ 方法。鉴于我们项目的主题是 DOM 数组方法，本章将重点介绍如何使用 `filter()` 从用户列表中仅显示百万富翁。我们将学习如何利用 `filter()`\
    \ 的强大功能，从原始数据数组中创建一个子集，并在网页上动态显示它。\n\n## 什么是 filter() 方法？\n\n"
- fmt: "\n# Array Methods: filter()\n\nThe `filter()` method creates a new array with\
    \ all the elements that pass the test implemented by the provided function. In\
    \ simpler terms, it filters out elements based on a condition you set.\n\n## Syntax\n\
    \n```javascript\nlet newArray = arr.filter(callback(element[, index[, array]])[,\
    \ thisArg])\n```\n\nWhere:\n- `callback`: Function is a predicate, which returns\
    \ a Boolean value. It tests each element and returns `true` to keep the element,\
    \ `false` otherwise.\n- `element`: Current element being processed in the array.\n\
    - `index` (optional): Index of the current element in the array.\n- `array` (optional):\
    \ The array `filter()` was called upon.\n- `thisArg` (optional): Object to use\
    \ as `this` when executing the callback.\n\n## Implementing the filter() method\
    \ to show millionaires\n\nLet's take a scenario where we have an array of user\
    \ objects, each having properties like `name`, `age`, and `wealth`. Our objective\
    \ is to filter out and display only those users who have wealth above 1 million.\n\
    \n### Step 1: Sample Data Array\nFor the sake of this example, consider the following\
    \ sample user data:\n\n```javascript\nconst users = [\n  { name: 'John Doe', age:\
    \ 32, wealth: 500000 },\n  { name: 'Jane Smith', age: 29, wealth: 1500000 },\n\
    \  { name: 'Chris Johnson', age: 45, wealth: 2200000 },\n  { name: 'Anna Brown',\
    \ age: 28, wealth: 750000 },\n  { name: 'Tom Davis', age: 34, wealth: 9800000\
    \ }\n];\n```\n\n### Step 2: Using filter() to get millionaires\nThe logic is simple:\
    \ We need to test if the `wealth` property of each user is greater than 1 million.\n\
    \n```javascript\nconst millionaires = users.filter(user => user.wealth > 1000000);\n\
    console.log(millionaires);\n```\n\nThe above code will give us an array of users\
    \ who have wealth greater than 1 million.\n\n### Step 3: Displaying Millionaires\
    \ on the DOM\nWe will create a function to dynamically display the list of millionaires\
    \ on our webpage:\n\n```javascript\nfunction displayMillionaires(millionaires)\
    \ {\n  const millionaireContainer = document.getElementById('millionaire-list');\n\
    \  // Clear out the previous list\n  millionaireContainer.innerHTML = '';\n  //\
    \ Loop through each millionaire and add to the DOM\n  millionaires.forEach(millionaire\
    \ => {\n    const millionaireElement = document.createElement('div');\n    millionaireElement.className\
    \ = 'millionaire';\n    millionaireElement.innerHTML = `\n      <strong>${millionaire.name}</strong>\
    \ - Wealth: $${millionaire.wealth.toLocaleString()}\n    `;\n    millionaireContainer.appendChild(millionaireElement);\n\
    \  });\n}\n// Call the display function\ndisplayMillionaires(millionaires);\n\
    ```\n\nRemember to have an element with the id `millionaire-list` in your HTML\
    \ for this to work.\n\n## Conclusion\nThe `filter()` method is powerful, allowing\
    \ us to extract subsets of data from our main dataset based on specific criteria.\
    \ In this chapter, we successfully isolated and displayed our millionaire users.\
    \ As you progress through your JavaScript journey, you'll find countless scenarios\
    \ where `filter()` becomes indispensable.\n\n# Array Methods: reduce()\n\nWelcome\
    \ to another exciting chapter in our DOM Array Methods project. By now, we've\
    \ covered a variety of array methods like `forEach()`, `map()`, `filter()`, and\
    \ `sort()`. In this chapter, we'll focus on another powerful array method: `reduce()`.\
    \ Our aim? To calculate the total wealth of a list of users.\n\n## Introduction\
    \ to reduce()\nThe `reduce()` method applies a function to an accumulator and\
    \ each element in an array (from left to right) to reduce it to a single value.\
    \ The accumulator accumulates the callback's return values. If no `initialValue`\
    \ is provided, the first element in the array will be used as the accumulator,\
    \ and the callback will start from the second element.\n\n## Syntax\n\n```javascript\n\
    array.reduce(callback(accumulator, currentValue[, index[, array]])[, initialValue])\n\
    ```\n\nKey Points:\n- `accumulator`: This accumulates the callback's return values.\n\
    - `currentValue`: The current element being processed in the array.\n- `index`\
    \ (optional): The index of the `currentValue`.\n- `array` (optional): The array\
    \ `reduce()` was called upon.\n- `initialValue` (optional): Value to use as the\
    \ first argument to the first call of the callback.\n\n## Scenario: Calculating\
    \ Total Wealth\nImagine you have a list of users, each with an `id`, `name`, and\
    \ `wealth`:\n\n```javascript\nconst users = [\n  { id: 1, name: \"John\", wealth:\
    \ 50000 },\n  { id: 2, name: \"Jane\", wealth: 150000 },\n  { id: 3, name: \"\
    Doe\", wealth: 30000 },\n  { id: 4, name: \"Smith\", wealth: 120000 }\n];\n```\n\
    \nWe want to calculate the total wealth of all users.\n\n## Implementing with\
    \ reduce()\nLet’s see how we can achieve this using the `reduce()` method:\n\n\
    ```javascript\nconst totalWealth = users.reduce((acc, user) => acc + user.wealth,\
    \ 0);\nconsole.log(totalWealth);  // Outputs: 350000\n```\n\nIn the above example:\n\
    1. We provide an initial value of `0` for the accumulator `acc`.\n2. For each\
    \ `user` in the `users` array, we add the user's `wealth` to the accumulator.\n\
    3. The final value of `acc` (i.e., 350000 in this case) represents the total wealth.\n\
    \n### Breaking it Down\n- The `reduce()` function starts with the accumulator\
    \ (`acc`) value of `0` (our initial value).\n- For the first user (John), `acc`\
    \ is `0` and `user.wealth` is `50000`. So, `acc` becomes `50000`.\n- For the next\
    \ user (Jane), `acc` is `50000` and `user.wealth` is `150000`. So, `acc` becomes\
    \ `200000`.\n- This process continues for all users.\n- At the end of the iteration,\
    \ `acc` holds the total wealth of all users.\n\n## Wrapping Up\nThe `reduce()`\
    \ method offers a concise way to calculate aggregate values from arrays. In this\
    \ chapter, we used it to calculate the total wealth from an array of users. But\
    \ the `reduce()` function's applications don't end here. You can use it in numerous\
    \ scenarios, like finding the maximum value in an array, counting occurrences\
    \ of items, and more.\n\n# Project 6 - Menu Slider & Modal | DOM & CSS\n\n## Project\
    \ Intro\nWelcome to the sixth project in our series, where we will be delving\
    \ into the creation of a Menu Slider & Modal using pure HTML, CSS, and JavaScript.\
    \ No frameworks, no libraries, just vanilla web technologies. As always, we're\
    \ here to guide you every step of the way, ensuring you understand both the \"\
    how\" and the \"why\" behind each part of the code.\n\n## 1. Project Overview\n\
    In this project, we'll create an interactive navigation menu that slides in from\
    \ the side (often referred to as a \"hamburger menu\"). This is a popular feature\
    \ on many modern websites, providing a clean user interface, especially for mobile\
    \ users.\n\nBut that's not all! To complement our menu slider, we'll also create\
    \ a modal. A modal is a dialog box or pop-up window that is displayed on top of\
    \ the current page, often used for notifications, gathering user input, or displaying\
    \ additional information without leaving the page.\n\n## 2. Core Concepts Covered\n\
    - **DOM Manipulation**: This project will allow us to practice our skills in manipulating\
    \ the Document Object Model (DOM), giving us the ability to interact with and\
    \ modify web page elements dynamically.\n- **CSS Transitions and Animations**:\
    \ We'll delve deeper into the world of CSS to make our menu slide effect and modal\
    \ appearance smooth and aesthetically pleasing.\n- **Event Listeners**: These\
    \ are crucial when creating interactivity. We'll use event listeners to detect\
    \ when the menu button is clicked, when modal triggers are engaged, and when the\
    \ user wants to close the modal.\n\n## 3. What You Will Achieve\nBy the end of\
    \ this project, you will have:\n- A slide-in menu that activates on a button click,\
    \ providing a smooth transition effect.\n- A modal that can be triggered to open\
    \ and will have a close button to hide it.\n- A better understanding of the DOM,\
    \ and how to interact with it using vanilla JavaScript.\n- Enhanced your CSS skills,\
    \ particularly in creating animations and transitions.\n- More confidence in building\
    \ interactive web components from scratch!\n\n## 4. Pre-requisites\n"
