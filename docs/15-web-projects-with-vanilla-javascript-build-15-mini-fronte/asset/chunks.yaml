    \  margin-top: 20px;\n}\n\n.voice-selection select {\n  width: 100%;\n  padding:\
    \ 10px;\n  border: 1px solid ccc;\n}\n```\n\n* * *\n\n## 结论\n\n通过设置这些样式，我们的语音文本阅读器应该看起来精致且用户友好。这些样式增强了应用程序的可用性，并为用户创造了愉快的体验。在下一章中，我们将深入\
    \ JavaScript，集成 Web Speech API，让用户能够将文本转换为语音。\n\n# 获取语音\n\n在 Web 开发领域，提供全面的用户体验不仅涉及用户看到的内容，还涉及他们听到的内容。Web\
    \ Speech API 的 `SpeechSynthesis` 接口提供了将文本内容语音化的能力。该接口的关键要素之一是能够选择不同的语音选项以满足内容需求。在本章中，我们将探讨如何获取并使用可用的语音选项来丰富语音文本阅读器项目。\n\
    \n* * *\n\n## 理解 SpeechSynthesis\n\n在深入获取可用语音之前，有必要掌握 `SpeechSynthesis` 的基础知识。它是控制网页上文本转语音的主要接口。该接口拥有一个名为\
    \ `getVoices()` 的方法，该方法返回一个 `SpeechSynthesisVoice` 对象数组，代表所有可用的语音。\n\n* * *\n\n\
    ## 获取可用语音\n\n1. 初始化过程：在获取语音之前，我们需要引用 `SpeechSynthesis` 接口：\n\n```javascript\n\
    const synth = window.speechSynthesis;\n```\n\n2. 获取并列出语音：使用初始化后的 `synth` 对象，调用\
    \ `getVoices()` 方法：\n\n```javascript\nlet voices = [];\n\nfunction populateVoiceList()\
    \ {\n  voices = synth.getVoices();\n  // 用于显示这些语音的代码将写在这里\n}\n```\n\n请记住，可用语音列表在页面加载时可能不会立即可用。为了处理这种情况，我们应该监听\
    \ `voiceschanged` 事件：\n\n```javascript\nsynth.onvoiceschanged = populateVoiceList;\n\
    ```\n\n* * *\n\n## 在下拉菜单中显示语音\n\n为了让用户选择语音，通常的做法是将它们显示在下拉列表中：\n\n1. HTML 结构：\n\
    \n```html\n<select id=\"voiceSelect\"></select>\n```\n\n2. 填充下拉菜单：\n\n回到 `populateVoiceList`\
    \ 函数，现在可以遍历 `voices` 数组并为每个语音创建一个选项：\n\n```javascript\nconst voiceSelect = document.getElementById('voiceSelect');\n\
    voices.forEach(voice => {\n  const option = document.createElement('option');\n\
    \  option.textContent = `${voice.name} (${voice.lang})`;\n  // 设置必要的属性\n  option.setAttribute('data-lang',\
    \ voice.lang);\n  option.setAttribute('data-name', voice.name);\n  voiceSelect.appendChild(option);\n\
    });\n```\n\n* * *\n\n## 使用选中的语音\n\n要实际使用某个语音，你需要在合成语音时进行设置：\n\n1. 合成语音：\n\n假设你想朗读以下消息：\n\
    \n```javascript\nconst utterThis = new SpeechSynthesisUtterance('Hello, how are\
    \ you?');\n```\n\n2. 设置语音：\n\n在指示 `synth` 朗读消息之前，设置选中的语音：\n\n```javascript\nconst\
    \ selectedVoiceName = voiceSelect.selectedOptions[0].getAttribute('data-name');\n\
    utterThis.voice = voices.find(voice => voice.name === selectedVoiceName);\n```\n\
    \n3. 朗读！：\n\n最后，使用 `speak` 方法：\n\n```javascript\nsynth.speak(utterThis);\n```\n\
    \n* * *\n\n## 结论\n\n将动态语音选择集成到你的语音文本阅读器中，可以增强定制化能力，满足全球不同语言偏好的用户需求。只需几行代码，Web\
    \ Speech API 的 `SpeechSynthesis` 接口就能为你的 Web 应用程序提供一个强大的工具，让静态文本焕发生机。随着你的深入，可以考虑探索其他功能，如调整音调、语速和音量，以进一步定制用户的听觉体验。\n\
    \n# 语音按钮\n\n在本章中，我们将探讨语音文本阅读器项目的核心组件之一：语音按钮。这些按钮将作为触发器，让应用程序将选中的或输入的文本转换为可听的语音。利用\
    \ Web Speech API（特别是 Speech Synthesis 接口）的强大功能，我们将为应用程序赋予声音。\n\n* * *\n\n## 前提条件\n\
    \n在深入本章之前，请确保你已经按照前几章的内容成功设置了项目的基本结构。\n\n* * *\n\n## 创建语音按钮\n\n1. HTML 结构：\n\n\
    首先，在 HTML 中为按钮搭建基本结构：\n\n```html\n<div id=\"buttons\">\n  <button id=\"start\"\
    >开始朗读</button>\n  <button id=\"stop\">停止朗读</button>\n</div>\n```\n\n这里有两个按钮：\n\
    \n- `开始朗读`：启动语音。\n- `停止朗读`：停止正在进行的语音。\n\n2. 基本样式：\n\n为了让按钮视觉上吸引人且用户友好，我们应用一些 CSS：\n\
    \n```css\nbuttons {\n  display: flex;\n  justify-content: space-around;\n  margin-top:\
    \ 20px;\n}\n\nbutton {\n  padding: 10px 20px;\n  font-size: 16px;\n  cursor: pointer;\n\
    \  border: none;\n  background-color: 3498db;\n  color: fff;\n  border-radius:\
    \ 5px;\n}\n\nbutton:hover {\n  background-color: 2980b9;\n}\n```\n\n* * *\n\n\
    ## JavaScript 实现\n\n现在，让我们利用 Web Speech API 的强大功能：\n\n1. 选择元素：\n\n使用 JavaScript，首先选择按钮元素：\n\
    \n```javascript\nconst startBtn = document.getElementById('start');\nconst stopBtn\
    \ = document.getElementById('stop');\n```\n\n2. 初始化 Speech Synthesis：\n\n接下来，初始化\
    \ `SpeechSynthesis` 对象：\n\n```javascript\nconst synth = window.speechSynthesis;\n\
    ```\n\n3. 开始朗读按钮：\n\n“开始朗读”按钮将获取提供的文本并将其转换为语音。让我们看看如何实现：\n\n```javascript\nstartBtn.addEventListener('click',\
    \ () => {\n  if (synth.speaking) {\n    console.error('语音合成正在进行中。');\n    return;\n\
    \  }\n  let textInput = document.getElementById('text-input').value;  // 假设 'text-input'\
    \ 是用户输入/粘贴文本的 textarea 或 input 的 ID\n  if (textInput !== '') {\n    let utterance\
    \ = new SpeechSynthesisUtterance(textInput);\n    // 可选：在此处设置语音、音调和语速\n    //\
    \ utterance.voice = synth.getVoices()[0];\n    // utterance.pitch = 1;\n    //\
    \ utterance.rate = 1;\n    synth.speak(utterance);\n  }\n});\n```\n\n4. 停止朗读按钮：\n\
    \n“停止朗读”按钮将停止任何正在进行的语音合成：\n\n```javascript\nstopBtn.addEventListener('click',\
    \ () => {\n  if (synth.speaking) {\n    synth.cancel();\n  }\n});\n```\n\n* *\
    \ *\n\n## 测试功能\n\n添加上述代码片段后，你应该在支持 Web Speech API 的浏览器中测试应用程序。在指定的输入区域输入或粘贴一些文本，然后点击“开始朗读”按钮。你应该能听到文本被朗读出来。点击“停止朗读”按钮应立即停止语音。\n\
    \n* * *\n\n## 结论\n\n"
- fmt: "\n# Change Voice & Custom Text Box\n\nIn this chapter, we will extend the\
    \ functionalities of our Speech Text Reader by implementing two key features:\n\
    \n1. Changing the voice for our text-to-speech reader.\n2. Allowing users to input\
    \ custom text to be read out loud.\n\nThese features will make our application\
    \ versatile, giving users more control over the voice output and the content being\
    \ read.\n\n---\n\n## Step 1: Setting Up the HTML for Voice Selection and Custom\
    \ Text\n\nBefore we dive into the JavaScript functionalities, let's set up our\
    \ HTML to include a dropdown list for voice selection and a text area for custom\
    \ text input.\n\n`index.html`\n\n```html\n<div class=\"voice-selection\">\n  <label\
    \ for=\"voiceList\">Choose Voice:</label>\n  <select id=\"voiceList\"></select>\n\
    </div>\n<div class=\"custom-text\">\n  <label for=\"customText\">Enter Custom\
    \ Text:</label>\n  <textarea id=\"customText\" rows=\"5\" placeholder=\"Type your\
    \ custom text here...\"></textarea>\n  <button id=\"readCustomText\">Read Custom\
    \ Text</button>\n</div>\n```\n\n---\n\n## Step 2: Fetching Available Voices\n\n\
    Let's fetch the available voices from the `SpeechSynthesis` API and populate our\
    \ dropdown list.\n\n`app.js`\n\n```javascript\nconst voiceList = document.getElementById('voiceList');\n\
    let voices = [];\n\nfunction populateVoiceList() {\n  voices = speechSynthesis.getVoices();\n\
    \  voices.forEach(voice => {\n    const option = document.createElement('option');\n\
    \    option.textContent = voice.name;\n    option.setAttribute('data-lang', voice.lang);\n\
    \    option.setAttribute('data-name', voice.name);\n    voiceList.appendChild(option);\n\
    \  });\n}\n\n// This event is triggered when voice list changes\nspeechSynthesis.onvoiceschanged\
    \ = populateVoiceList;\n```\n\n---\n\n## Step 3: Changing the Voice\n\nOnce the\
    \ voices are loaded into our dropdown, we want the ability to change the voice\
    \ based on the user's selection.\n\n`app.js` (Continuation)\n\n```javascript\n\
    let selectedVoice;\n\nvoiceList.addEventListener('change', (e) => {\n  selectedVoice\
    \ = voices.find(voice => voice.name === e.target.value);\n});\n```\n\n---\n\n\
    ## Step 4: Implementing the Custom Text Box\n\nFor our custom text feature, we\
    \ need to allow users to type in a text area, and then read the content out loud\
    \ using the selected voice.\n\n`app.js` (Continuation)\n\n```javascript\nconst\
    \ customText = document.getElementById('customText');\nconst readCustomTextButton\
    \ = document.getElementById('readCustomText');\n\nreadCustomTextButton.addEventListener('click',\
    \ () => {\n  let utterThis = new SpeechSynthesisUtterance(customText.value);\n\
    \  if (selectedVoice) {\n    utterThis.voice = selectedVoice;\n  }\n  speechSynthesis.speak(utterThis);\n\
    \  customText.value = ''; // Clear the text area after reading\n});\n```\n\n---\n\
    \n## Step 5: Styling the Interface\n\nTo keep our user interface intuitive and\
    \ neat, let's add some styling.\n\n`styles.css`\n\n```css\n.voice-selection, .custom-text\
    \ {\n  margin: 20px 0;\n}\n\nlabel {\n  display: block;\n  margin-bottom: 10px;\n\
    \  font-weight: bold;\n}\n\nselect, textarea {\n  width: 100%;\n  padding: 10px;\n\
    \  border: 1px solid #ccc;\n  border-radius: 4px;\n}\n\nbutton {\n  display: block;\n\
    \  margin-top: 10px;\n  padding: 10px 20px;\n  background-color: #333;\n  color:\
    \ #fff;\n  border: none;\n  border-radius: 4px;\n  cursor: pointer;\n}\n\nbutton:hover\
    \ {\n  background-color: #555;\n}\n```\n\n---\n\n## Conclusion\n\nWith the steps\
    \ outlined above, we've successfully added functionalities to change the voice\
    \ of our Speech Text Reader and allow users to input custom text for the application\
    \ to read out loud. This not only makes our application more versatile but also\
    \ enhances the user experience by providing more control over the content and\
    \ its presentation.\n\nRemember, accessibility tools like these can make a difference\
    \ in how users interact with web applications. Always ensure that you test these\
    \ tools with a variety of users to guarantee that they cater to different needs.\n\
    \n---\n\n# Section 13: Project 12 - Relaxer App | CSS Animations, setTimeout\n\
    \n## Project Intro\n\nWelcome to Project 12, the Relaxer App. In our fast-paced\
    \ world, taking a few moments to relax and breathe is not just essential for mental\
    \ health, but also for boosting productivity. With this in mind, the Relaxer App\
    \ serves as a digital companion that encourages its users to pause, breathe, and\
    \ reconnect with the present moment.\n\n---\n\n## Objective of the Relaxer App\n\
    \nThe primary purpose of the Relaxer App is to guide the user through a series\
    \ of breathing exercises, helping them achieve a state of calm and focus. As developers,\
    \ it provides us an opportunity to delve into an interesting blend of CSS animations\
    \ and JavaScript functions, especially the `setTimeout` method.\n\n---\n\n## What\
    \ Will We Build?\n\n1. **Visual Breathing Guide**: A user-friendly UI that will\
    \ visually show the user when to breathe in, hold their breath, and breathe out.\n\
    2. **Animation**: Using CSS, we'll create a smooth and calming animation that\
    \ coincides with the breathing instructions, allowing the user to follow along\
    \ visually.\n3. **JavaScript Integration**: Our JS code will not only control\
    \ the animation triggers but also guide the user on how long they should be performing\
    \ each part of the breathing exercise.\n\n---\n\n## Features of the Relaxer App\n\
    \n1. **Guided Breathing Instructions**: Clear on-screen prompts that tell the\
    \ user exactly when to breathe in, hold, and breathe out.\n2. **Adaptive Cycle**:\
    \ The app will continually run the breathing cycle, allowing users to use it for\
    \ as long as they need.\n3. **Responsive Design**: Our app will be adaptable to\
    \ different devices ensuring everyone can access and benefit from it.\n4. **Customizable\
    \ Settings**: While this is a basic version, developers can later add features\
    \ where users can set their breathing intervals or choose different relaxation\
    \ modes.\n\n---\n\n## Why the Relaxer App?\n\n- **Holistic Learning**: This project\
    \ offers a well-rounded learning experience, from creating visually appealing\
    \ designs to understanding and implementing JavaScript's asynchronous functions.\n\
    - **Real-world Application**: Meditation and relaxation apps are increasingly\
    \ popular. This project can serve as a foundation for those looking to delve deeper\
    \ into this genre of apps.\n- **Challenging Yet Achievable**: For those who've\
    \ journeyed with us through the previous 11 projects, the Relaxer App provides\
    \ just the right amount of challenge while ensuring that it remains achievable\
    \ and enjoyable.\n\nIn conclusion, by the end of this project, you will not only\
    \ have a functional Relaxer App but also a deeper understanding of how CSS animations\
    \ can be effectively combined with JavaScript methods to create a synchronous\
    \ user experience. So, let's dive in and start building our path to relaxation\
    \ and coding mastery!\n\n---\n\n## Creating The Large Circle\n\nIn the Relaxer\
    \ App, the main visual component is a large circle which will represent our breathing\
    \ visual guide. This circle will expand and contract, simulating the breathing\
    \ process. Before animating it, we first need to create it. In this chapter, we'll\
    \ walk you through the process of creating this essential component using HTML\
    \ and CSS.\n\n---\n\n### Step 1: Setting up the HTML Structure\n\nLet's start\
    \ by creating the basic structure for our circle in the HTML.\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Relaxer\
    \ App</title>\n  <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n\
    \  <div class=\"container\">\n    <div class=\"circle\"></div>\n  </div>\n</body>\n\
    </html>\n```\n\nHere, we've wrapped the circle inside a container. This will help\
    \ in positioning and animating it later on.\n\n---\n\n### Step 2: Styling the\
    \ Circle using CSS\n"
  raw: 'The Speech Buttons play a pivotal role in our Speech Text Reader application,
    allowing users to control when text-to-speech conversion begins and ends. Leveraging
    the capabilities of the Web Speech API, we''ve managed to introduce a powerful
    feature with just a few lines of code. In the upcoming chapters, we''ll explore
    more features and functionalities to make our application more robust and user-friendly.


    Change Voice & Custom Text Box


    In this chapter, we will extend the functionalities of our Speech Text Reader
    by implementing two key features:


    1\. Changing the voice for our text-to-speech reader.


    2\. Allowing users to input custom text to be read out loud.


    These features will make our application versatile, giving users more control
    over the voice output and the content being read.


    * * *


    Step 1: Setting Up the HTML for Voice Selection and Custom Text


    Before we dive into the JavaScript functionalities, let''s set up our HTML to
    include a dropdown list for voice selection and a text area for custom text input.


    index.html


    ```html


    <div class="voice-selection">


    <label for="voiceList">Choose Voice:</label>


    <select id="voiceList"></select>


    </div>


    <div class="custom-text">


    <label for="customText">Enter Custom Text:</label>


    <textarea id="customText" rows="5" placeholder="Type your custom text here..."></textarea>


    <button id="readCustomText">Read Custom Text</button>


    </div>


    ```


    * * *


    Step 2: Fetching Available Voices


    Let''s fetch the available voices from the SpeechSynthesis API and populate our
    dropdown list.


    app.js


    ```javascript


    const voiceList = document.getElementById(''voiceList'');


    let voices = [];


    function populateVoiceList() {


    voices = speechSynthesis.getVoices();


    voices.forEach(voice => {


    const option = document.createElement(''option'');


    option.textContent = voice.name;


    option.setAttribute(''data-lang'', voice.lang);


    option.setAttribute(''data-name'', voice.name);


    voiceList.appendChild(option);


    });


    }


    // This event is triggered when voice list changes


    speechSynthesis.onvoiceschanged = populateVoiceList;


    ```


    * * *


    Step 3: Changing the Voice


    Once the voices are loaded into our dropdown, we want the ability to change the
    voice based on the user''s selection.


    app.js (Continuation)


    ```javascript


    let selectedVoice;


    voiceList.addEventListener(''change'', (e) => {


    selectedVoice = voices.find(voice => voice.name === e.target.value);


    });


    ```


    * * *


    Step 4: Implementing the Custom Text Box


    For our custom text feature, we need to allow users to type in a text area, and
    then read the content out loud using the selected voice.


    app.js (Continuation)


    ```javascript


    const customText = document.getElementById(''customText'');


    const readCustomTextButton = document.getElementById(''readCustomText'');


    readCustomTextButton.addEventListener(''click'', () => {


    let utterThis = new SpeechSynthesisUtterance(customText.value);


    if (selectedVoice) {


    utterThis.voice = selectedVoice;


    }


    speechSynthesis.speak(utterThis);


    customText.value = ''''; // Clear the text area after reading


    });


    ```


    * * *


    Step 5: Styling the Interface


    To keep our user interface intuitive and neat, let''s add some styling.


    styles.css


    ```css


    .voice-selection, .custom-text {


    margin: 20px 0;


    }


    label {


    display: block;


    margin-bottom: 10px;


    font-weight: bold;


    }


    select, textarea {


    width: 100%;


    padding: 10px;


    border: 1px solid ccc;


    border-radius: 4px;


    }


    button {


    display: block;


    margin-top: 10px;


    padding: 10px 20px;


    background-color: 333;


    color: fff;


    border: none;


    border-radius: 4px;


    cursor: pointer;


    }


    button:hover {


    background-color: 555;


    }


    ```


    * * *


    Conclusion


    With the steps outlined above, we''ve successfully added functionalities to change
    the voice of our Speech Text Reader and allow users to input custom text for the
    application to read out loud. This not only makes our application more versatile
    but also enhances the user experience by providing more control over the content
    and its presentation.


    Remember, accessibility tools like these can make a difference in how users interact
    with web applications. Always ensure that you test these tools with a variety
    of users to guarantee that they cater to different needs.


    Section 13:  Project 12 - Relaxer App | CSS Animations, setTimeout


    Project Intro


    Welcome to Project 12, the Relaxer App. In our fast-paced world, taking a few
    moments to relax and breathe is not just essential for mental health, but also
    for boosting productivity. With this in mind, the Relaxer App serves as a digital
    companion that encourages its users to pause, breathe, and reconnect with the
    present moment.


    * * *


    Objective of the Relaxer App:


    The primary purpose of the Relaxer App is to guide the user through a series of
    breathing exercises, helping them achieve a state of calm and focus. As developers,
