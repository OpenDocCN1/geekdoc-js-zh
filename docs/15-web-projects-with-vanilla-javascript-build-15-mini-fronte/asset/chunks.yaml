- fmt: "\nBefore we begin coding, it's crucial to understand the significance of CSS.\
    \ For our Expense Tracker, a clean and organized UI ensures users can easily add\
    \ and monitor their expenses without any distractions. Styling also helps to reinforce\
    \ functionality – by making important buttons or warnings prominent, we guide\
    \ the user's experience in a positive direction.\n\n* * *\n\n## 2. Setting Up\
    \ the Base Style\n\nFor consistency across browsers, we'll start by resetting\
    \ some of the default browser styles:\n\n```css\n* {\n  margin: 0;\n  padding:\
    \ 0;\n  box-sizing: border-box;\n  font-family: 'Arial', sans-serif;\n}\n```\n\
    \n* * *\n\n## 3. Styling the Main Container\n\nOur Expense Tracker app will be\
    \ contained within a main `div`. We want this container to be centered and have\
    \ some space around it for a pleasant look:\n\n```css\n.container {\n  width:\
    \ 80%;\n  max-width: 600px;\n  margin: 40px auto;\n  padding: 20px;\n  background-color:\
    \ f4f4f4;\n  border-radius: 5px;\n  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n\
    }\n```\n\n* * *\n\n## 4. Header Styles\n\nA bold header will help users quickly\
    \ identify the app:\n\n```css\nheader {\n  text-align: center;\n  margin-bottom:\
    \ 20px;\n}\n\nheader h2 {\n  font-size: 2rem;\n  color: 333;\n}\n```\n\n* * *\n\
    \n## 5. Input Fields and Buttons\n\nOur app will have input fields for users to\
    \ add expenses and buttons to submit them. These elements should be easy to spot\
    \ and use:\n\n```css\ninput, button {\n  width: 100%;\n  padding: 10px;\n  margin-bottom:\
    \ 10px;\n  border: 1px solid ccc;\n  border-radius: 4px;\n  font-size: 1rem;\n\
    }\n\nbutton {\n  background-color: 007BFF;\n  color: fff;\n  cursor: pointer;\n\
    }\n\nbutton:hover {\n  background-color: 0056b3;\n}\n```\n\n* * *\n\n## 6. Displaying\
    \ Transactions\n\nExpenses will be listed in rows. Positive values (income) will\
    \ be displayed in green, while negative values (expenses) will be in red for easy\
    \ differentiation:\n\n```css\n.transaction {\n  display: flex;\n  justify-content:\
    \ space-between;\n  padding: 10px;\n  border-bottom: 1px solid ddd;\n}\n\n.transaction.income\
    \ {\n  color: green;\n}\n\n.transaction.expense {\n  color: red;\n}\n```\n\n*\
    \ * *\n\n## 7. Totals, Income, and Expense Display\n\nIt's vital for users to\
    \ get a quick overview of their financial status:\n\n```css\n.overview {\n  display:\
    \ flex;\n  justify-content: space-between;\n  margin-top: 20px;\n}\n\n.total,\
    \ .income, .expense {\n  width: 30%;\n  padding: 10px;\n  border: 1px solid ddd;\n\
    \  border-radius: 4px;\n  text-align: center;\n}\n\n.total {\n  color: 333;\n\
    }\n\n.income {\n  color: green;\n}\n\n.expense {\n  color: red;\n}\n```\n\n* *\
    \ *\n\n## 8. Responsive Design\n\nGiven the increasing number of users accessing\
    \ apps from mobile devices, we must ensure our design looks great on smaller screens:\n\
    \n```css\n@media (max-width: 480px) {\n  .container {\n    width: 95%;\n  }\n\n\
    \  .overview {\n    flex-direction: column;\n  }\n\n  .total, .income, .expense\
    \ {\n    width: 100%;\n    margin-bottom: 10px;\n  }\n}\n```\n\n* * *\n\n## Summary\n\
    \nThe styling of our \"Expense Tracker\" app emphasizes clarity and user-friendliness.\
    \ We've used a combination of layouts, color schemes, and responsive design to\
    \ ensure our application looks and functions well across various devices. In the\
    \ next chapters, we'll dive into the functionality of our app, where we'll employ\
    \ JavaScript to bring our Expense Tracker to life.\n\n## Show Transaction Items\n\
    \nIn this chapter, we'll be focusing on displaying the transaction items in our\
    \ Expense Tracker project. These transaction items represent individual financial\
    \ activities, either income or expenditure, that the user has recorded in the\
    \ app. We'll utilize a combination of HTML, CSS, and JavaScript to achieve this.\
    \ Let's dive in!\n\n* * *\n\n### 1. The HTML Structure\n\nTo display transaction\
    \ items, we need a container in our HTML where each transaction can be listed.\
    \ The following markup will serve our purpose:\n\n```html\n<section class=\"transactions\"\
    >\n  <h2>Transaction History</h2>\n  <ul id=\"transaction-list\">\n    <!-- Transaction\
    \ items will be added here using JavaScript -->\n  </ul>\n</section>\n```\n\n\
    Here, the `transaction-list` will be dynamically populated with the transaction\
    \ items using JavaScript.\n\n* * *\n\n### 2. CSS Styling\n\nTo make our transaction\
    \ list visually appealing, let's style it:\n\n```css\n.transactions {\n  margin:\
    \ 20px 0;\n  border: 1px solid e0e0e0;\n  padding: 10px;\n}\n\n.transactions h2\
    \ {\n  text-align: center;\n  margin-bottom: 15px;\n}\n\ntransaction-list {\n\
    \  list-style-type: none;\n  padding: 0;\n}\n\ntransaction-list li {\n  display:\
    \ flex;\n  justify-content: space-between;\n  padding: 8px 0;\n  border-bottom:\
    \ 1px solid e0e0e0;\n}\n```\n\n* * *\n\n### 3. JavaScript Implementation\n\nFirst,\
    \ select the transaction list in your JavaScript:\n\n```javascript\nconst transactionList\
    \ = document.getElementById('transaction-list');\n```\n\nAssuming you have an\
    \ array of transaction objects named `transactions` (which will be filled with\
    \ user input or data from local storage), we will use the following function to\
    \ display them:\n\n```javascript\nfunction displayTransactions() {\n  // Clear\
    \ out any current transaction items in the list\n  transactionList.innerHTML =\
    \ '';\n\n  // Loop through the transactions array and display each one\n  transactions.forEach(transaction\
    \ => {\n    const item = document.createElement('li');\n    item.innerHTML = `\n\
    \      <span>${transaction.description}</span>\n      <span>${transaction.amount\
    \ > 0 ? '+' : '-'}$${Math.abs(transaction.amount)}</span>\n    `;\n    item.classList.add(transaction.amount\
    \ > 0 ? 'income' : 'expense');\n    transactionList.appendChild(item);\n  });\n\
    }\n```\n\nThis function first clears any current transactions in the list. Then,\
    \ for each transaction in our `transactions` array, it creates a new list item\
    \ (`li`) element, sets its inner HTML to display the transaction's description\
    \ and amount, adds a class based on whether the transaction is an income or an\
    \ expense, and then appends the item to our `transaction-list`.\n\n* * *\n\n###\
    \ 4. Additional CSS for Income and Expense\n\nDifferentiate income and expense\
    \ visually using colors:\n\n```css\ntransaction-list .income {\n  color: green;\n\
    }\n\ntransaction-list .expense {\n  color: red;\n}\n```\n\n* * *\n\n### 5. Calling\
    \ the `displayTransactions` Function\n\nWhenever a new transaction is added or\
    \ an existing one is modified, ensure you call the `displayTransactions()` function.\
    \ This will ensure that the list is always updated with the latest data:\n\n```javascript\n\
    // Sample code when adding a new transaction\nfunction addTransaction(transaction)\
    \ {\n  transactions.push(transaction);\n  displayTransactions();\n}\n```\n\n*\
    \ * *\n\n## Conclusion\n\nWith the above steps, we've successfully implemented\
    \ the functionality to display transaction items in our Expense Tracker project.\
    \ As users add or remove transactions, the list will update dynamically, providing\
    \ a clear and concise view of their financial activities. In subsequent chapters,\
    \ we will build upon this foundation by adding more features, such as calculating\
