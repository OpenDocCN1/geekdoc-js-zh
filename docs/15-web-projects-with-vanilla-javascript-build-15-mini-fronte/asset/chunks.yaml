    Project HTML


    Welcome to the HTML section of our sixth project: the Menu Slider & Modal! This
    is where we lay down the foundation of our project. Remember, a good structure
    in your HTML is crucial to making your CSS and JavaScript integration easier and
    more efficient.


    * * *


    Introduction


    HTML (HyperText Markup Language) is the backbone of any web page. It provides
    the structure, while CSS styles it and JavaScript brings it to life. In this chapter,
    we''ll focus on creating a semantic and accessible structure for our Menu Slider
    and Modal.


    * * *


    Setting up the Basic HTML Structure


    To begin with, we will set up a basic HTML5 template.


    ```html


    <!DOCTYPE html>


    <html lang="en">


    <head>


    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Menu Slider & Modal</title>


    <link rel="stylesheet" href="styles.css">


    </head>


    <body>


    </body>


    <script src="script.js"></script>


    </html>


    ```


    * * *


    Creating the Header Section


    Our header will contain a navigation bar and a menu icon which will trigger the
    sliding menu.


    ```html


    <header>


    <div class="container">


    <h1>Menu Slider & Modal</h1>


    <button id="menu-btn">☰</button>


    </div>


    </header>


    ```


    Here:


    - `container` will act as a wrapper to center our content.


    - The `h1` provides a title.


    - The `menu-btn` button will be used to trigger the sliding menu.


    * * *


    Crafting the Sliding Menu


    The sliding menu will be a sidebar that slides in and out from the left. We''ll
    start with the basic structure, and the sliding functionality will be added with
    JavaScript later on.


    ```html


    <aside id="menu-slider">


    <ul>


    <li><a href="home">Home</a></li>


    <li><a href="services">Services</a></li>


    <li><a href="about">About</a></li>


    <li><a href="contact">Contact</a></li>


    </ul>


    </aside>


    ```


    * * *


    Building the Modal Section


    Our modal will be a simple pop-up that can be triggered via a button click. For
    the sake of this example, we''ll use it to display a subscription form.


    ```html


    <div id="modal">


    <div class="modal-content">


    <span id="close-btn">×</span>


    <h2>Subscribe to Our Newsletter</h2>


    <form action="">


    <input type="email" placeholder="Enter your email">


    <button type="submit">Subscribe</button>


    </form>


    </div>


    </div>


    ```


    In this structure:


    - The outer `div` with id `modal` will act as a backdrop, dimming the rest of
    the page when the modal is visible.


    - `modal-content` contains the actual contents of the modal.


    - `close-btn` will be used to close the modal.


    - The form within the modal prompts the user to subscribe to a newsletter.


    * * *


    Wrapping Up


    With the HTML structure set for the Menu Slider & Modal project, you''re ready
    to move on to styling with CSS and adding functionality with JavaScript. Always
    ensure your HTML is clear and semantic, as this not only makes your website more
    accessible but also eases the process of styling and scripting.


    In the next chapter, we will dive into styling our Navbar and setting up the overall
    look of our project with CSS.


    Navbar Styling


    Welcome to Chapter 35, where we''ll be focusing on one of the most fundamental
    components of a web application''s UI: the Navbar. The navigation bar, or navbar
    for short, typically contains links that help users navigate through different
    sections or pages of a website. Given its importance, styling the navbar is crucial
    for both aesthetics and usability. Let''s dive into how we can style our navbar
    for the "Menu Slider & Modal" project.


    * * *


    1\. The Basic Structure of a Navbar


    Before we style, let''s remind ourselves of the HTML structure we''re working
    with. A typical navbar might look something like this:


    ```html


    <nav class="navbar">


    <div class="logo">


    <h1>MyWebsite</h1>


    </div>


    <ul class="nav-menu">


    <li><a href="home">Home</a></li>


    <li><a href="about">About</a></li>


    <li><a href="services">Services</a></li>


    <li><a href="contact">Contact</a></li>


    </ul>


    <div class="menu-toggle"><i class="fas fa-bars"></i></div>


    </nav>


    ```


    * * *


    2\. Styling the Navbar Container


    To start, let''s give our navbar a distinct look that separates it from the rest
    of the page.


    ```css


    .navbar {


    display: flex;


    justify-content: space-between;


    align-items: center;


    background-color: 333;


    padding: 10px 50px;


    box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.2);


    }


    ```


    - `display: flex;` ensures that the navbar''s child elements are aligned in a
    row.


    - `justify-content: space-between;` evenly distributes the child elements across
    the navbar.


    - `box-shadow:` adds a subtle shadow, making the navbar appear slightly elevated
    from the page.


    * * *


    3\. Styling the Logo


    Our logo is the brand''s representation; it should stand out but not overpower
    other elements.


    ```css


    .navbar .logo h1 {


    color: fff;


    margin: 0;


    font-size: 1.5rem;


    text-transform: uppercase;


    letter-spacing: 2px;


    }


    ```


    * * *


    4\. Styling the Menu


    Next, let''s style the menu links. A modern practice is to use a horizontal list
    with spacing between items.


    ```css


    .nav-menu {


    list-style-type: none;


    padding: 0;


    display: flex;


    gap: 20px;


    }


    .nav-menu li a {


    color: fff;


    text-decoration: none;


    transition: color 0.3s ease;


    }


    .nav-menu li a:hover {


    color: 007BFF;  /* A shade of blue for hover effect */


    }


    ```


    * * *


    5\. Styling the Menu Toggle


    This is the button users will click to see the menu on smaller screens:


    ```css


    .menu-toggle {


    display: none; /* Initially hidden on desktop */


    font-size: 1.5rem;


    color: fff;


    cursor: pointer;


    }


    /* Media query to show the menu toggle on smaller screens */


    @media (max-width: 768px) {


    .menu-toggle {


    display: block;


    }


    .nav-menu {


    display: none; /* Hide menu on mobile by default */


    flex-direction: column;


    gap: 10px;


    position: absolute;


    top: 60px; /* height of the navbar */


    left: 0;


    background-color: 333;


    width: 100%;


    }


    .nav-menu.active { /* This class will be added via JS to show the menu */


    display: flex;


    }


    }


    ```


    * * *


    6\. Additional Touches


    To further refine our navbar, consider adding transitions or animations for a
    smoother user experience. For instance:


    ```css


    .nav-menu li a {


    transition: all 0.3s ease;


    }


    ```


    This will ensure that changes to properties like color, when hovering over the
    menu items, are gradual and smooth.


    * * *


    Conclusion


    With these styles, our navbar is not only functional but also visually appealing.
    A well-styled navbar enhances user experience and guides them seamlessly through
    your application. As always, feel free to adjust colors, sizes, and other properties
    to better fit the overall design and theme of your website.


    In the next chapter, we''ll explore styling the header and modal components, diving
    deeper into the world of CSS and improving our project''s look and feel. Stay
    tuned!


    Header & Modal Styling'
