  trans: "\n\n# 餐食查找器项目指南\n\n## 引言\n1. 理解 API：API（应用程序编程接口）允许不同软件之间进行通信和数据共享。在 Web\
    \ 开发领域，掌握如何使用 API 是一项关键技能，本项目将提供其实际应用。\n2. 深入探索 Fetch：`Fetch API` 提供了一个 JavaScript\
    \ 接口，用于访问和操作 HTTP 管道的各个部分，例如请求和响应。我们将大量使用 `Fetch API` 从 `MealDB` 中检索数据。\n3. 动态\
    \ UI 更新：本项目将让你亲身体验如何根据从外部源获取的数据动态更新用户界面。\n\n## 我们将构建什么？\n1. 搜索功能：用户可以输入餐食名称或食材来搜索匹配的餐食。\n\
    2. 显示餐食：我们将以网格形式展示餐食，为用户提供视觉享受。\n3. 详细视图：当用户点击某餐食时，可以查看其详细信息，包括食材、制作步骤，甚至视频教程。\n\
    4. 随机餐食推荐：添加一个有趣的功能，用户可以获取随机餐食推荐，帮助他们发现新食谱。\n\n## 技术与技巧\n- HTML 和 CSS：我们信赖的伙伴。我们将使用它们来创建和美化网页。\n\
    - JavaScript：这将是本项目的核心。我们将用它来获取数据、操作 DOM 以及添加交互性。\n- `Fetch API`：用于向 `MealDB API`\
    \ 发送请求并获取数据。\n- `Async/Await`：一种处理 JavaScript 中异步操作的现代方式。在使用 `Fetch API` 时，我们将利用它来编写更易读、更清晰的代码结构。\n\
    - `JSON`：从 API 获取的数据将是 `JSON` 格式。我们将解析这些数据并利用它动态更新网页。\n\n## 面临的挑战\n1. 处理 API 响应：并非每次搜索查询都会返回结果。学习如何优雅地处理此类情况可以提升用户体验。\n\
    2. 动态 DOM 操作：根据获取的数据，应用程序的外观将动态变化。\n3. 错误处理：API 有时可能失败，或者可能存在连接问题。适当的错误处理可确保我们的应用程序健壮且用户友好。\n\
    \n在接下来的章节中，我们将深入探讨构建餐食查找器应用的细节。从在 HTML 中搭建基本结构，到用 CSS 设计组件样式，最后用 JavaScript 让一切活起来。所以，卷起袖子，让我们开始烹饪吧！\n\
    \n> 注意：在开发本项目时，请始终参考 `MealDB API` 文档。它提供了关于请求端点、响应格式等方面的宝贵信息。请始终遵守 API 使用指南和服务条款。\n\
    \n# 项目 HTML 与基础 CSS\n\n在本章中，我们将为“餐食查找器”项目奠定基础。到本章结束时，你将拥有一个视觉上吸引人的 HTML 结构，并辅以基础\
    \ CSS 样式。这将作为后续章节中我们与 `MealDB API` 交互的基础。\n\n### 步骤 1：搭建 HTML 结构\n对于我们的餐食查找器应用，我们需要一个用于搜索的输入字段、一个触发搜索的按钮、一个显示结果的容器，以及一个显示所选餐食详细信息的区域。\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
    >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n    <title>餐食查找器</title>\n    <link rel=\"stylesheet\" href=\"styles.css\"\
    >\n</head>\n<body>\n    <div class=\"container\">\n        <h1>餐食查找器</h1>\n  \
    \      <div class=\"search-box\">\n            <input type=\"text\" id=\"search-input\"\
    \ placeholder=\"搜索餐食...\">\n            <button id=\"search-btn\">搜索</button>\n\
    \        </div>\n        <div class=\"meal-list\"></div>\n        <div class=\"\
    meal-details\"></div>\n    </div>\n</body>\n</html>\n```\n\n### 步骤 2：添加基础 CSS\n\
    对于基础样式，我们将使用现代 CSS 技术，确保我们的应用外观时尚且响应式。\n\n`styles.css`：\n\n```css\nbody {\n  \
    \  font-family: 'Arial', sans-serif;\n    background-color: f4f4f4;\n    margin:\
    \ 0;\n    padding: 0;\n}\n.container {\n    width: 80%;\n    margin: 2rem auto;\n\
    \    background-color: fff;\n    padding: 1rem;\n    box-shadow: 0 0 10px rgba(0,\
    \ 0, 0, 0.1);\n}\nh1 {\n    text-align: center;\n    color: 333;\n    margin-bottom:\
    \ 1rem;\n}\n.search-box {\n    display: flex;\n    justify-content: center;\n\
    \    gap: 1rem;\n}\nsearch-input {\n    padding: 0.5rem 1rem;\n    font-size:\
    \ 1rem;\n    border: 1px solid ccc;\n    border-radius: 5px;\n    flex: 2;\n}\n\
    search-btn {\n    padding: 0.5rem 1rem;\n    background-color: 007BFF;\n    color:\
    \ fff;\n    border: none;\n    border-radius: 5px;\n    cursor: pointer;\n   \
    \ transition: background-color 0.3s;\n}\nsearch-btn:hover {\n    background-color:\
    \ 0056b3;\n}\n.meal-list, .meal-details {\n    margin-top: 2rem;\n}\n```\n\n###\
    \ 总结\n至此，我们的“餐食查找器”项目已具备基本布局。通过结构化的 HTML 和基础 CSS 样式，我们拥有了一个简洁直观的界面。在接下来的章节中，我们将集成使用\
    \ `MealDB API` 搜索餐食的功能，在应用中显示结果，并允许用户查看每道餐食的详细信息。\n\n# 从 API 搜索并显示餐食\n\n在本章中，我们将深入探讨\
    \ API 的世界，特别关注 `MealDB API`。我们将了解如何将其集成到我们的餐食查找器项目中，让用户能够搜索餐食并查看详细信息。到本章结束时，你将亲身体验如何从\
    \ API 获取数据，并使用原生 JavaScript 将其动态渲染到 DOM 中。\n\n## 理解 MealDB API\n在深入代码之前，让我们先熟悉一下\
    \ `MealDB API`。该 API 提供食谱餐食信息，并且免费使用。你可以搜索餐食、按 ID 查找特定餐食，甚至获取随机餐食推荐。\n\n按名称搜索餐食的端点：\n\
    `https://www.themealdb.com/api/json/v1/1/search.php?s={餐食名称}`\n\n将 `{餐食名称}` 替换为你想要搜索的餐食。返回的\
    \ `JSON` 将包含一个匹配搜索的餐食数组。\n\n## 设置搜索功能\n\n### 1. HTML 结构\n我们需要一个输入字段供用户输入餐食名称，以及一个触发搜索的按钮。\n\
    \n```html\n<input type=\"text\" id=\"meal-search\" placeholder=\"搜索餐食...\">\n\
    <button id=\"search-btn\">搜索</button>\n<div id=\"meal-results\"></div>\n```\n\n\
    ### 2. JavaScript - 获取数据\n为了从 API 获取数据，我们将使用 JavaScript 中的 `Fetch API`。我们将为搜索按钮添加一个事件监听器来触发该函数。\n\
    \n```javascript\nconst searchBtn = document.getElementById('search-btn');\nconst\
    \ mealSearch = document.getElementById('meal-search');\nconst mealResults = document.getElementById('meal-results');\n\
    \nsearchBtn.addEventListener('click', fetchMeals);\n\nfunction fetchMeals() {\n\
    \    const searchTerm = mealSearch.value.trim();\n    fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${searchTerm}`)\n\
    \        .then(response => response.json())\n        .then(data => displayMeals(data.meals));\n\
    }\n```\n\n## 显示结果\n一旦我们获取到餐食数据，就需要将其显示出来。我们将通过遍历餐食数组并为每个餐食创建卡片来实现。\n\n```javascript\n\
    function displayMeals(meals) {\n    if(!meals) {\n        mealResults.innerHTML\
    \ = '<p>未找到餐食。请尝试其他搜索！</p>';\n        return;\n    }\n    const mealsHTML = meals.map(meal\
    \ => `\n        <div class=\"meal-card\">\n            <img src=\"${meal.strMealThumb}\"\
    \ alt=\"${meal.strMeal}\">\n            <h3>${meal.strMeal}</h3>\n           \
    \ <button onclick=\"fetchMealDetails(${meal.idMeal})\">查看食谱</button>\n       \
    \ </div>\n    `).join('');\n    mealResults.innerHTML = mealsHTML;\n}\n```\n\n\
    该函数检查返回的数组中是否有餐食。如果没有，则显示“未找到餐食”消息。否则，它会遍历 `meals` 数组，为每个餐食生成 HTML，并将其插入到 DOM\
    \ 中。\n\n## 获取餐食详细信息\n\n"
- fmt: "\nOur cards have a \"View Recipe\" button. When clicked, we want to fetch\
    \ more detailed information about the meal. This requires another endpoint from\
    \ the MealDB API, which retrieves details based on meal ID.\n\nEndpoint for meal\
    \ details by ID:\n\n```\nhttps://www.themealdb.com/api/json/v1/1/lookup.php?i={meal-id}\n\
    ```\n\nThe function to fetch and display the details could look like:\n\n```javascript\n\
    function fetchMealDetails(id) {\n  fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${id}`)\n\
    \    .then(response => response.json())\n    .then(data => {\n      const meal\
    \ = data.meals[0];\n      const detailsHTML = `\n        <h2>${meal.strMeal}</h2>\n\
    \        <img src=\"${meal.strMealThumb}\" alt=\"${meal.strMeal}\">\n        <p>${meal.strInstructions}</p>\n\
    \      `;\n      mealResults.innerHTML = detailsHTML;\n    });\n}\n```\n\nThis\
    \ function fetches the detailed meal data using the provided ID, and then renders\
    \ it to the DOM.\n\n---\n\n## Conclusion\n\nBy now, you should have a functional\
    \ Meal Finder that allows users to search for meals using the MealDB API. The\
    \ results are displayed dynamically, and users can view detailed recipes with\
    \ just a click. Remember, APIs offer a plethora of data that can be used to enhance\
    \ your web applications. The key lies in understanding the API documentation,\
    \ structuring your fetch requests appropriately, and presenting the data to users\
    \ in a user-friendly manner.\n\n## Show Single Meal Page\n\nWelcome back! In the\
    \ last chapter, we saw how to fetch meals and display them based on user queries.\
    \ Now, we are going to focus on how to show the details of a selected meal on\
    \ a dedicated page. By the end of this chapter, you will have an interactive page\
    \ where users can click on a meal and view its details including ingredients and\
    \ preparation steps.\n\n---\n\n### Objective:\n\n- Fetch detailed data for a single\
    \ meal using the MealDB API.\n- Display the meal details including image, name,\
    \ category, origin, ingredients, and preparation steps.\n\n---\n\n### Getting\
    \ Started:\n\nTo show the single meal page, we will be utilizing the `idMeal`\
    \ property which is unique to each meal and can be used to fetch the detailed\
    \ information of that meal from the MealDB API.\n\n---\n\n### 1. HTML Structure:\n\
    \nLet's first design the layout for our single meal page.\n\n```html\n<div class=\"\
    single-meal\">\n  <div class=\"single-meal-header\">\n    <img src=\"\" alt=\"\
    Meal Image\" id=\"meal-img\">\n    <h2 id=\"meal-name\"></h2>\n  </div>\n  <div\
    \ class=\"single-meal-info\">\n    <p><strong>Category:</strong> <span id=\"meal-category\"\
    ></span></p>\n    <p><strong>Origin:</strong> <span id=\"meal-origin\"></span></p>\n\
    \  </div>\n  <div class=\"single-meal-ingredients\">\n    <h3>Ingredients:</h3>\n\
    \    <ul id=\"ingredients-list\"></ul>\n  </div>\n  <div class=\"single-meal-instructions\"\
    >\n    <h3>Instructions:</h3>\n    <p id=\"meal-instructions\"></p>\n  </div>\n\
    </div>\n```\n\n---\n\n### 2. CSS Styling:\n\nFor a better presentation, add some\
    \ CSS for the single meal display.\n\n```css\n.single-meal-header {\n  display:\
    \ flex;\n  align-items: center;\n}\nmeal-img {\n  width: 150px;\n  height: 150px;\n\
    \  margin-right: 20px;\n  object-fit: cover;\n  border-radius: 50%;\n}\n.single-meal-info\
    \ {\n  margin-top: 20px;\n}\n.single-meal-ingredients, .single-meal-instructions\
    \ {\n  margin-top: 30px;\n}\n```\n\n---\n\n### 3. JavaScript Functionality:\n\n\
    We will fetch and display the single meal's details using JavaScript.\n\n```javascript\n\
    function getSingleMealDetails(mealID) {\n  fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${mealID}`)\n\
    \    .then(response => response.json())\n    .then(data => {\n      const meal\
    \ = data.meals[0];\n      displayMealDetails(meal);\n    })\n    .catch(error\
    \ => console.error('Error fetching single meal:', error));\n}\n\nfunction displayMealDetails(meal)\
    \ {\n  // Clear previous data\n  document.getElementById('meal-img').src = meal.strMealThumb;\n\
    \  document.getElementById('meal-name').textContent = meal.strMeal;\n  document.getElementById('meal-category').textContent\
    \ = meal.strCategory;\n  document.getElementById('meal-origin').textContent =\
    \ meal.strArea;\n\n  // List ingredients\n  const ingredientsList = document.getElementById('ingredients-list');\n\
    \  ingredientsList.innerHTML = '';\n  for(let i = 1; i <= 20; i++) {\n    if(meal[`strIngredient${i}`])\
    \ {\n      const li = document.createElement('li');\n      li.textContent = `${meal[`strIngredient${i}`]}\
    \ - ${meal[`strMeasure${i}`]}`;\n      ingredientsList.appendChild(li);\n    }\n\
    \  }\n\n  // Display instructions\n  document.getElementById('meal-instructions').textContent\
    \ = meal.strInstructions;\n}\n```\n\n---\n\n### 4. Event Handling:\n\nWhen a user\
    \ clicks on a meal from the list, fetch its details:\n\n```javascript\ndocument.body.addEventListener('click',\
    \ (e) => {\n  if (e.target.classList.contains('meal-item')) {\n    const mealID\
    \ = e.target.getAttribute('data-mealid');\n    getSingleMealDetails(mealID);\n\
    \  }\n});\n```\n\nMake sure that each meal displayed in the list has the class\
    \ `meal-item` and a `data-mealid` attribute with the meal's unique ID.\n\n---\n\
    \n### Wrapping Up:\n\nYou've successfully created a single meal page that fetches\
    \ detailed information about a meal and displays it in a user-friendly format.\
    \ Now, when users are intrigued by a meal's name or picture, they can dive deeper\
    \ into its ingredients and instructions.\n\nIn the next chapter, we will delve\
    \ into how to display random meals and style their presentation. Stay tuned!\n\
    \n## Display Random Meal & Single Meal CSS\n\nWelcome back to Project 8: Meal\
