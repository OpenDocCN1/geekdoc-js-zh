    \ 秒\n  </div>\n</div>\n```\n\n---\n\n## 3. 获取当前日期与新年日期\n\n在 JavaScript 中，我们需要获取当前日期和下一个新年的日期：\n\
    \n```javascript\nconst currentDate = new Date();\nconst nextNewYearDate = new\
    \ Date(currentDate.getFullYear() + 1, 0, 1);\n```\n\n---\n\n## 4. 计算差值\n\n我们需要计算当前日期与新年日期之间的毫秒差：\n\
    \n```javascript\nconst difference = nextNewYearDate - currentDate;\n```\n\n根据这个差值，我们可以推导出天数、小时数、分钟数和秒数。\n\
    \n---\n\n## 5. 推导时间单位\n\n以下是推导每个时间单位的详细步骤：\n\n```javascript\nconst seconds = Math.floor(difference\
    \ / 1000);\nconst minutes = Math.floor(seconds / 60);\nconst hours = Math.floor(minutes\
    \ / 60);\nconst days = Math.floor(hours / 24);\nconst secondsLeft = seconds %\
    \ 60;\nconst minutesLeft = minutes % 60;\nconst hoursLeft = hours % 24;\n```\n\
    \n---\n\n## 6. 显示倒计时\n\n现在，我们将用计算出的值更新 HTML 结构：\n\n```javascript\ndocument.querySelector('.days').textContent\
    \ = days;\ndocument.querySelector('.hours').textContent = hoursLeft;\ndocument.querySelector('.minutes').textContent\
    \ = minutesLeft;\ndocument.querySelector('.seconds').textContent = secondsLeft;\n\
    ```\n\n---\n\n## 7. 每秒更新倒计时\n\n为了让倒计时动态更新，我们需要每秒刷新一次：\n\n```javascript\nsetInterval(()\
    \ => {\n  // 重新计算差值\n  const currentDate = new Date();\n  const difference = nextNewYearDate\
    \ - currentDate;\n\n  // 将差值转换为天数、小时数、分钟数和秒数\n  // ...\n\n  // 更新 HTML\n  // ...\n\
    }, 1000);\n```\n\n大功告成！你已经成功利用 DOM 操作和 JavaScript 的 `Date` 对象创建了一个动态的新年倒计时。\n\n\
    ---\n\n## 结语\n\n倒计时可以为许多网站增添激动人心的元素，尤其是那些期待某个活动的网站。通过掌握 `Date` 对象并理解时间计算背后的数学原理，你可以为网页创建大量基于时间的功能。一如既往，熟能生巧。尝试为其他活动创建倒计时，或者添加自定义用户输入等功能，实现个性化倒计时。创意无限！\n\
    \n## 动态年份与加载动画\n\n欢迎回到项目 13——新年倒计时！在上一章中，我们通过设置着陆页打下了基础。这一次，我们将深入 JavaScript 世界，实现动态年份显示和加载动画，展示新年倒计时。\n\
    \n---\n\n### 设置动态年份\n\n新年倒计时最重要的功能之一就是确保它每年都能保持时效性。与其硬编码年份，不如利用 JavaScript 的 `Date`\
    \ 对象，让倒计时始终指向即将到来的新年。\n\n#### 步骤 1：访问 DOM 元素\n\n开始之前，我们需要获取要显示年份的元素的引用。\n\n```javascript\n\
    const yearEl = document.getElementById('year');\n```\n\n#### 步骤 2：获取当前年份\n\n使用\
    \ `Date` 对象，我们可以获取当前年份：\n\n```javascript\nconst currentYear = new Date().getFullYear();\n\
    ```\n\n#### 步骤 3：显示下一年份\n\n```javascript\nyearEl.textContent = currentYear + 1;\n\
    ```\n\n这将确保显示的年份始终是下一年，使倒计时保持时效性。\n\n---\n\n### 实现加载动画\n\n当用户访问我们的页面时，提供一个视觉提示，表明倒计时正在加载中，会带来良好的体验。这就是加载动画的作用。它会短暂显示，然后才展示倒计时。\n\
    \n#### 步骤 1：HTML 设置\n\n在主 HTML 中，加入加载动画的 div：\n\n```html\n<div class=\"spinner\"\
    \ id=\"spinner\"></div>\n```\n\n#### 步骤 2：CSS 样式\n\n对于加载动画，你需要一个简单的旋转动画：\n\n```css\n\
    .spinner {\n  width: 50px;\n  height: 50px;\n  border: 5px solid rgba(255, 255,\
    \ 255, 0.1);\n  border-top: 5px solid fff;\n  border-radius: 50%;\n  position:\
    \ absolute;\n  top: 50%;\n  left: 50%;\n  transform: translate(-50%, -50%);\n\
    \  animation: spin 1s linear infinite;\n}\n\n@keyframes spin {\n  0% {\n    transform:\
    \ translate(-50%, -50%) rotate(0deg);\n  }\n  100% {\n    transform: translate(-50%,\
    \ -50%) rotate(360deg);\n  }\n}\n```\n\n#### 步骤 3：JavaScript 逻辑\n\n最后，确保加载动画只短暂显示，然后展示倒计时：\n\
    \n```javascript\nconst spinnerEl = document.getElementById('spinner');\nconst\
    \ countdownEl = document.getElementById('countdown'); // 假设这是倒计时容器的 id\n\nsetTimeout(()\
    \ => {\n  spinnerEl.style.display = 'none';\n  countdownEl.style.display = 'block';\n\
    }, 1000);\n```\n\n这将在一秒后隐藏加载动画并显示倒计时。\n\n---\n\n### 总结\n\n有了动态年份和友好的加载动画来迎接用户，我们的新年倒计时已初具雏形！\n\
    \n请记住，Web 开发的魅力不仅在于创造精美的视觉效果，更在于通过这些微小的动态功能提升用户体验。倒计时变得更加健壮和用户友好，确保用户年复一年地回来使用。\n\
    \n# 第 15 节：项目 14 - 可排序列表 | 拖放 API\n\n## 项目介绍\n\n欢迎来到项目 14！在本模块中，我们将探索现代 Web 开发的酷炫功能之一——拖放\
    \ API。作为 Web 开发者，我们一直在寻找增强用户体验、让 Web 交互感觉自然直观的方法。拖放功能是一种多功能工具，如果实现得当，可以显著提升网站或应用程序的功能性和可用性。\n\
    \n---\n\n## 项目目标\n\n本项目的主要目标是开发一个可排序列表。想象一下这样的场景：你有一个任务列表、优先级列表，甚至是一个歌曲播放列表，你想根据它们的重要性、紧迫性或偏好重新排列顺序。如果你能简单地拖拽一个项目，并将其放置在列表中的任意位置，那该多棒？这正是我们将在本项目中构建的内容。\n\
    \n---\n\n## 为什么需要可排序列表？\n\n通过拖放来操作列表项顺序的能力，不仅对用户来说视觉上令人满意，而且功能极其强大。原因如下：\n\n1.\
    \ 灵活性：用户在最初创建列表时，并不总是确定项目的顺序。拥有重新排序的能力，可以随着时间的推移灵活调整列表。\n2. 直观性：拖放操作感觉自然。它模仿了物理移动物体的动作，使交互感觉真实且沉浸。\n\
    3. 增强用户体验：无需手动删除并重新添加项目来改变顺序。可排序列表提供了一种无缝的方式来组织项目。\n\n---\n\n## 技术概述\n\n在本项目中，我们将利用\
    \ HTML5 拖放 API 的能力。以下是我们将重点关注的主要组件：\n\n1. 可拖拽元素：这些是我们列表中希望使其可移动的项目。\n2. 放置区域：这些是我们可以放置可拖拽元素的区域。\n\
    3. 拖放事件：这些是浏览器在元素被拖拽和放置时触发的一组事件。我们将利用 `dragstart`、`dragover`、`dragleave` 和 `drop`\
    \ 等事件。\n\n---\n\n## 预期成果\n\n在本项目结束时：\n\n- 你将拥有一个功能性的可排序列表，允许通过拖放重新排列项目。\n- 你将深入理解拖放\
    \ API 及其事件和方法。\n\n"
- fmt: "\n- You'll be able to implement drag & drop functionality in different scenarios,\
    \ not just for sorting lists.\n\n---\n\n## Prerequisites\n\nWhile we will be explaining\
    \ each step in detail, it's essential to have a basic understanding of:\n\n- HTML:\
    \ To structure our list.\n- CSS: For styling our list and creating visual cues\
    \ during the drag & drop process.\n- JavaScript: To handle drag & drop events\
    \ and manipulate the DOM.\n\n---\n\n## In Conclusion\n\nThe Drag & Drop API opens\
    \ up a world of interactive possibilities on the web. Whether it's building a\
    \ game, a planner, or a visual organizer, understanding how to harness its power\
    \ can set your projects apart.\n\nAre you excited? Let's dive right into building\
    \ our sortable list!\n\n# Insert List Items Into DOM\n\nIn this chapter, we will\
    \ explore one of the foundational tasks in web development – inserting list items\
    \ into the Document Object Model (DOM). The ability to dynamically insert elements\
    \ into the DOM is vital for creating dynamic web applications. In the context\
    \ of our sortable list project, we will be creating a list that the user can interact\
    \ with by dragging and dropping list items. But before we can do that, we need\
    \ to get our list items into the DOM. Let’s get started!\n\n---\n\n## Understanding\
    \ the DOM\n\nBefore diving into the insertion process, it’s essential to understand\
    \ what the DOM is. The DOM represents the structure of your web document, and\
    \ every element, attribute, and piece of text becomes a node within this structure.\
    \ When we talk about inserting list items into the DOM, we are essentially adding\
    \ nodes to this structure.\n\n---\n\n## Basic List Structure\n\nIn HTML, a basic\
    \ list structure using unordered lists looks like this:\n\n```html\n<ul>\n  <li>Item\
    \ 1</li>\n  <li>Item 2</li>\n  <li>Item 3</li>\n</ul>\n```\n\nIn our sortable\
    \ list project, we want to dynamically insert these list items.\n\n---\n\n## Inserting\
    \ List Items Using JavaScript\n\nHere is a step-by-step guide to inserting list\
    \ items into the DOM using JavaScript:\n\n1. Select the Parent Element\n\nBefore\
    \ we can insert a list item, we need to select the parent element. In our case,\
    \ it's the `<ul>` element.\n\n```javascript\nconst list = document.querySelector('ul');\n\
    ```\n\n2. Create the List Item Element\n\nWe can create a new element using the\
    \ `document.createElement()` method.\n\n```javascript\nconst listItem = document.createElement('li');\n\
    ```\n\n3. Set the Content for the List Item\n\nYou can set the text content for\
    \ this newly created list item using the `textContent` property.\n\n```javascript\n\
    listItem.textContent = 'Item 4';\n```\n\n4. Append the List Item to the Parent\
    \ Element\n\nTo insert the new list item into the DOM, you use the `appendChild()`\
    \ method.\n\n```javascript\nlist.appendChild(listItem);\n```\n\nIf you followed\
    \ the above steps, your list will now look like this:\n\n```html\n<ul>\n  <li>Item\
    \ 1</li>\n  <li>Item 2</li>\n  <li>Item 3</li>\n  <li>Item 4</li>\n</ul>\n```\n\
    \n---\n\n## Dynamically Inserting Multiple List Items\n\nTo make our project interactive,\
    \ we might want to insert multiple list items at once. For example, if we have\
    \ an array of items, we can iterate over this array and insert each item into\
    \ the DOM:\n\n```javascript\nconst items = ['Item 5', 'Item 6', 'Item 7'];\nitems.forEach(item\
    \ => {\n  const listItem = document.createElement('li');\n  listItem.textContent\
    \ = item;\n  list.appendChild(listItem);\n});\n```\n\nThis will extend our list\
    \ to:\n\n```html\n<ul>\n  <li>Item 1</li>\n  <li>Item 2</li>\n  <li>Item 3</li>\n\
    \  <li>Item 4</li>\n  <li>Item 5</li>\n  <li>Item 6</li>\n  <li>Item 7</li>\n\
    </ul>\n```\n\n---\n\n## Conclusion\n\nBeing able to manipulate the DOM is a fundamental\
    \ skill for a web developer. By now, you should have a good understanding of how\
    \ to insert list items into the DOM dynamically using JavaScript. In the next\
    \ chapter, we'll learn how to scramble these list items and set the stage for\
    \ our drag-and-drop functionality. Stay tuned!\n\n# Scramble List Items\n\nIn\
    \ this chapter, we'll introduce the concept of scrambling the items in our sortable\
    \ list. The aim is to challenge the user to rearrange the list into its original\
    \ order. By doing this, we'll provide a real-world application of the Drag & Drop\
    \ API, as it demonstrates a practical use-case.\n\n---\n\n## Understanding the\
    \ Need for Scrambling\n\nBefore we dive into the technicalities, let’s understand\
    \ the need for scrambling. When we provide a list to users in a sorted order,\
    \ and then task them with rearranging it after it's been scrambled, we're giving\
    \ them a simple, yet effective exercise in sorting. This could be applied in real-world\
    \ scenarios like sorting tasks, rearranging products in a list, or any other kind\
    \ of ordering requirement.\n\n---\n\n## Getting Started\n\nFirst, we'll assume\
    \ that we have a list of items, structured in an HTML format as follows:\n\n```html\n\
    <ul id=\"sortable-list\">\n  <li draggable=\"true\">Item 1</li>\n  <li draggable=\"\
    true\">Item 2</li>\n  <li draggable=\"true\">Item 3</li>\n  <!--... and so on\
    \ -->\n</ul>\n```\n\n---\n\n## JavaScript: Scrambling the List\n\nWe'll use a\
    \ modern version of the Fisher-Yates (also known as the Knuth) shuffle algorithm.\
    \ This algorithm ensures each permutation of the list is equally likely.\n\n```javascript\n\
    function scrambleList() {\n  const ul = document.querySelector('sortable-list');\n\
    \  const items = ul.getElementsByTagName('li');\n  let itemsArr = Array.prototype.slice.call(items);\n\
    \  itemsArr.sort(() => 0.5 - Math.random());\n  itemsArr.forEach(item => {\n \
    \   ul.appendChild(item);\n  });\n}\n```\n\nIn this function:\n\n- We first select\
    \ our unordered list by its ID.\n- We get all the list items from the unordered\
    \ list.\n- We convert the HTML collection to an array, so we can use array methods\
    \ on it.\n- We then use the `sort()` method to shuffle the list. The logic `0.5\
    \ - Math.random()` is a commonly used trick to randomize the sort.\n- Finally,\
    \ we append each shuffled item back to the list.\n\n---\n\n## Executing the Scramble\n\
    \nNow, you'll probably want to trigger the scramble at a specific point in your\
    \ application. For demonstration purposes, we’ll just add a button which, when\
    \ clicked, will scramble our list.\n\n```html\n<button onclick=\"scrambleList()\"\
    >Scramble Items</button>\n```\n\n---\n\n## Conclusion\n\nBy introducing a scrambling\
    \ feature, you've added an interactive layer to your sortable list application.\
    \ This challenges the users, but also gives them a tangible goal: to restore order.\
    \ In the next chapter, we'll delve into the core styling of our application and\
    \ set the visual stage for our drag and drop functionality. Remember, user experience\
    \ is paramount, and the visual feedback we provide is crucial in guiding users\
    \ through the sorting process.\n\n# Core CSS\n\nCSS, or Cascading Style Sheets,\
    \ is an essential tool for controlling the look and feel of your web applications.\
    \ In this chapter, we'll be diving into the core CSS that will give our Sortable\
    \ List project a clean, professional appearance. Remember, good CSS not only makes\
    \ your application visually appealing, but it can also enhance user experience.\n\
    \n---\n\n## 1. Resetting Default Styles\n\nBefore diving into the project-specific\
    \ styles, it's essential to ensure that we reset browser-default styles. This\
    \ will give us a consistent baseline across different browsers.\n\n```css\n* {\n\
    \  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n```\n\n---\n\n## 2.\
    \ Setting up the Body & Main Wrapper\n\nThe `body` and main wrapper elements dictate\
    \ the basic styling and positioning of our entire app.\n\n```css\nbody {\n  font-family:\
    \ 'Arial', sans-serif;\n  background-color: #f4f4f4;\n  color: #333;\n  font-size:\
    \ 16px;\n  line-height: 1.6;\n}\n\n.wrapper {\n  width: 80%;\n  max-width: 1200px;\n\
    \  margin: 40px auto;\n  padding: 20px;\n  background-color: #fff;\n  box-shadow:\
    \ 0 0 10px rgba(0, 0, 0, 0.1);\n}\n```\n\n---\n\n## 3. Styling the Sortable List\n\
    \nFor our sortable list, we'll aim for a design that differentiates each list\
    \ item while making it clear that they can be dragged and dropped.\n"
