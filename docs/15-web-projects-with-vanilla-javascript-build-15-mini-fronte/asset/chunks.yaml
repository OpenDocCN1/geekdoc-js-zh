    the test implemented by the provided function. In simpler terms, it filters out
    elements based on a condition you set.


    * * *


    Syntax:


    ```javascript


    let newArray = arr.filter(callback(element[, index[, array]])[, thisArg])


    ```


    Where:


    - `callback`: Function is a predicate, which returns a Boolean value. It tests
    each element and returns `true` to keep the element, `false` otherwise.


    - `element`: Current element being processed in the array.


    - `index` (optional): Index of the current element in the array.


    - `array` (optional): The array `filter()` was called upon.


    - `thisArg` (optional): Object to use as `this` when executing the callback.


    * * *


    Implementing the filter() method to show millionaires


    Let''s take a scenario where we have an array of user objects, each having properties
    like `name`, `age`, and `wealth`. Our objective is to filter out and display only
    those users who have wealth above 1 million.


    Step 1: Sample Data Array


    For the sake of this example, consider the following sample user data:


    ```javascript


    const users = [


    { name: ''John Doe'', age: 32, wealth: 500000 },


    { name: ''Jane Smith'', age: 29, wealth: 1500000 },


    { name: ''Chris Johnson'', age: 45, wealth: 2200000 },


    { name: ''Anna Brown'', age: 28, wealth: 750000 },


    { name: ''Tom Davis'', age: 34, wealth: 9800000 }


    ];


    ```


    Step 2: Using filter() to get millionaires


    The logic is simple: We need to test if the `wealth` property of each user is
    greater than 1 million.


    ```javascript


    const millionaires = users.filter(user => user.wealth > 1000000);


    console.log(millionaires);


    ```


    The above code will give us an array of users who have wealth greater than 1 million.


    Step 3: Displaying Millionaires on the DOM


    We will create a function to dynamically display the list of millionaires on our
    webpage:


    ```javascript


    function displayMillionaires(millionaires) {


    const millionaireContainer = document.getElementById(''millionaire-list'');


    // Clear out the previous list


    millionaireContainer.innerHTML = '''';


    // Loop through each millionaire and add to the DOM


    millionaires.forEach(millionaire => {


    const millionaireElement = document.createElement(''div'');


    millionaireElement.className = ''millionaire'';


    millionaireElement.innerHTML = `


    <strong>${millionaire.name}</strong> - Wealth: $${millionaire.wealth.toLocaleString()}


    `;


    millionaireContainer.appendChild(millionaireElement);


    });


    }


    // Call the display function


    displayMillionaires(millionaires);


    ```


    Remember to have an element with the id `millionaire-list` in your HTML for this
    to work.


    * * *


    Conclusion


    The `filter()` method is powerful, allowing us to extract subsets of data from
    our main dataset based on specific criteria. In this chapter, we successfully
    isolated and displayed our millionaire users. As you progress through your JavaScript
    journey, you''ll find countless scenarios where `filter()` becomes indispensable.


    Calculate Wealth - reduce()


    Welcome to another exciting chapter in our DOM Array Methods project. By now,
    we''ve covered a variety of array methods like `forEach()`, `map()`, `filter()`,
    and `sort()`. In this chapter, we''ll focus on another powerful array method:
    `reduce()`. Our aim? To calculate the total wealth of a list of users.


    * * *


    Introduction to `reduce()`


    The `reduce()` method applies a function to an accumulator and each element in
    an array (from left to right) to reduce it to a single value. The accumulator
    accumulates the callback''s return values. If no initialValue is provided, the
    first element in the array will be used as the accumulator, and the callback will
    start from the second element.


    * * *


    Syntax:


    ```javascript


    array.reduce(callback(accumulator, currentValue[, index[, array]])[, initialValue])


    ```


    Key Points:


    - accumulator: This accumulates the callback''s return values.


    - currentValue: The current element being processed in the array.


    - index (optional): The index of the `currentValue`.


    - array (optional): The array `reduce()` was called upon.


    - initialValue (optional): Value to use as the first argument to the first call
    of the callback.


    * * *


    Scenario: Calculating Total Wealth


    Imagine you have a list of users, each with an `id`, `name`, and `wealth`:


    ```javascript


    const users = [


    { id: 1, name: "John", wealth: 50000 },


    { id: 2, name: "Jane", wealth: 150000 },


    { id: 3, name: "Doe", wealth: 30000 },


    { id: 4, name: "Smith", wealth: 120000 }


    ];


    ```


    We want to calculate the total wealth of all users.


    * * *


    Implementing with `reduce()`


    Let’s see how we can achieve this using the `reduce()` method:


    ```javascript


    const totalWealth = users.reduce((acc, user) => acc + user.wealth, 0);


    console.log(totalWealth);  // Outputs: 350000


    ```


    In the above example:


    1\. We provide an initial value of 0 for the accumulator `acc`.


    2\. For each `user` in the `users` array, we add the user''s `wealth` to the accumulator.


    3\. The final value of `acc` (i.e., 350000 in this case) represents the total
    wealth.


    Breaking it Down


    - The `reduce()` function starts with the accumulator (`acc`) value of 0 (our
    initial value).


    - For the first user (John), `acc` is 0 and `user.wealth` is 50000. So, `acc`
    becomes 50000.


    - For the next user (Jane), `acc` is 50000 and `user.wealth` is 150000\. So, `acc`
    becomes 200000.


    - This process continues for all users.


    - At the end of the iteration, `acc` holds the total wealth of all users.


    * * *


    Wrapping Up


    The `reduce()` method offers a concise way to calculate aggregate values from
    arrays. In this chapter, we used it to calculate the total wealth from an array
    of users. But the `reduce()` function''s applications don''t end here. You can
    use it in numerous scenarios, like finding the maximum value in an array, counting
    occurrences of items, and more.


    Section 7:  Project 6 - Menu Slider & Modal | DOM & CSS


    Project Intro


    Welcome to the sixth project in our series, where we will be delving into the
    creation of a Menu Slider & Modal using pure HTML, CSS, and JavaScript. No frameworks,
    no libraries, just vanilla web technologies. As always, we''re here to guide you
    every step of the way, ensuring you understand both the "how" and the "why" behind
    each part of the code.


    * * *


    1\. Project Overview


    In this project, we''ll create an interactive navigation menu that slides in from
    the side (often referred to as a "hamburger menu"). This is a popular feature
    on many modern websites, providing a clean user interface, especially for mobile
    users.


    But that''s not all! To complement our menu slider, we''ll also create a modal.
    A modal is a dialog box or pop-up window that is displayed on top of the current
    page, often used for notifications, gathering user input, or displaying additional
    information without leaving the page.


    * * *


    2\. Core Concepts Covered


    * DOM Manipulation: This project will allow us to practice our skills in manipulating
    the Document Object Model (DOM), giving us the ability to interact with and modify
    web page elements dynamically.


    * CSS Transitions and Animations: We''ll delve deeper into the world of CSS to
    make our menu slide effect and modal appearance smooth and aesthetically pleasing.


    * Event Listeners: These are crucial when creating interactivity. We''ll use event
    listeners to detect when the menu button is clicked, when modal triggers are engaged,
    and when the user wants to close the modal.


    * * *


    3\. What You Will Achieve


    By the end of this project, you will have:


    * A slide-in menu that activates on a button click, providing a smooth transition
    effect.


