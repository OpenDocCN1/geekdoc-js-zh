    Selecting Movie & Seats From UI


    In this chapter, we will walk through the process of creating the core functionality
    of our movie seat booking application. Our main focus will be to understand and
    implement the logic that allows users to select a movie and its corresponding
    seats from the UI.


    * * *


    1\. Creating the HTML Layout:


    Before diving into the JavaScript, ensure that your HTML is properly set up. For
    this section, we''ll have a dropdown list of movies with their respective prices
    and a layout representing the theater''s seats.


    ```html


    <div class="movie-container">


    <label>Choose a movie:</label>


    <select id="movie">


    <option value="10">Avengers: Endgame ($10)</option>


    <option value="12">Joker ($12)</option>


    <option value="8">Frozen II ($8)</option>


    <option value="9">Ford v Ferrari ($9)</option>


    </select>


    </div>


    <ul class="seating-chart">


    <!-- Each list item represents a seat -->


    <!-- Using data attributes to indicate seat status: available, occupied -->


    <li class="seat" data-status="available"></li>


    <!-- ... repeat for all seats in the theater -->


    </ul>


    ```


    * * *


    2\. JavaScript: DOM Selection:


    Start by selecting the elements from the DOM:


    ```javascript


    const movieSelect = document.getElementById(''movie'');


    const seats = document.querySelectorAll(''.seating-chart .seat[data-status="available"]'');


    ```


    * * *


    3\. Listening for Events:


    Now, we want to detect when a user selects a movie or clicks on a seat:


    ```javascript


    movieSelect.addEventListener(''change'', updateSelectedMovie);


    seats.forEach(seat => seat.addEventListener(''click'', toggleSeatSelection));


    ```


    * * *


    4\. Toggling Seat Selection:


    We want users to be able to select and deselect seats. When a seat is selected,
    we''ll change its data attribute:


    ```javascript


    function toggleSeatSelection(e) {


    const seat = e.target;


    // Toggle the data-status attribute


    if (seat.dataset.status === ''available'') {


    seat.dataset.status = ''selected'';


    } else {


    seat.dataset.status = ''available'';


    }


    // Update a visual representation (maybe change seat color)


    seat.classList.toggle(''selected-seat'');


    // You can now also call another function to calculate and display total cost


    updateTotalCost();


    }


    ```


    * * *


    5\. Updating the Selected Movie:


    When the user selects a different movie, we''ll store the movie''s value (price)
    for further calculations:


    ```javascript


    let ticketPrice = +movieSelect.value;


    function updateSelectedMovie(e) {


    ticketPrice = +e.target.value;


    // Resetting previously selected seats when switching movies might be a good idea


    resetSelectedSeats();


    updateTotalCost();


    }


    ```


    * * *


    6\. Calculating Total Cost:


    After selecting the seats and the movie, we''ll provide a live update of the total
    cost:


    ```javascript


    function updateTotalCost() {


    const selectedSeats = document.querySelectorAll(''.seating-chart .seat[data-status="selected"]'');


    const numberOfSeats = selectedSeats.length;


    const totalCost = numberOfSeats * ticketPrice;


    // Display this to the user using DOM manipulation


    document.getElementById(''total-cost'').textContent = `$${totalCost}`;


    }


    ```


    Remember, this chapter focuses on the front-end aspect. In real-world applications,
    you''d want to synchronize with a backend to ensure seat availability, especially
    in scenarios where multiple users might be trying to book the same seats simultaneously.


    * * *


    Conclusion:


    By now, you should have a functional UI that allows users to select a movie, choose
    their preferred seats, and view the total cost of their selection. In the next
    chapter, we''ll look into saving these details into local storage and populating
    the UI with saved data to enhance the user experience.


    Save Data To Local Storage


    Local storage is an essential part of modern web development, especially when
    we want to provide a seamless user experience. In the context of our Movie Seat
    Booking project, it makes sense to utilize local storage to save the user''s seat
    selection and movie choice. This way, even if they leave the page and come back,
    their choices remain intact.


    * * *


    Understanding Local Storage


    Local storage is a way to store data on the user''s browser. It''s like a mini
    database in the browser that developers can use to store key-value pairs.


    Advantages:


    - Data is saved across browser sessions.


    - No expiration time; the data remains until it''s explicitly deleted or the user
    clears their browser data.


    - Unlike cookies, local storage is not sent to the server with every HTTP request,
    making your application faster and more efficient.


    Limitations:


    - Typically, browsers give you up to 5-10MB of storage.


    - It''s synchronous, meaning it might block the main thread if you''re trying
    to store a large amount of data.


    * * *


    Implementing Local Storage in our Movie Seat Booking Application


    For our project, we''ll save the selected movie and its price, as well as the
    indices of selected seats. This way, when the user revisits the page, we can repopulate
    the UI with their selections.


    Step 1: Saving the Selected Movie


    Whenever a user selects a movie from the dropdown, we should save that selection
    to local storage.


    ```javascript


    const movieSelect = document.getElementById(''movie'');


    movieSelect.addEventListener(''change'', (e) => {


    const selectedMovieIndex = e.target.selectedIndex;


    const selectedMoviePrice = e.target.value;


    localStorage.setItem(''selectedMovieIndex'', selectedMovieIndex);


    localStorage.setItem(''selectedMoviePrice'', selectedMoviePrice);


    });


    ```


    Step 2: Saving Selected Seats


    To store seat selections, we''ll keep track of the indices of the selected seats.
    These indices will represent the seats in our UI.'
