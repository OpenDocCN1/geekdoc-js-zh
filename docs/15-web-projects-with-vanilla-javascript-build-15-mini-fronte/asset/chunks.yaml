  raw: 'Our cards have a "View Recipe" button. When clicked, we want to fetch more
    detailed information about the meal. This requires another endpoint from the MealDB
    API, which retrieves details based on meal ID.


    Endpoint for meal details by ID:


    ```


    https://www.themealdb.com/api/json/v1/1/lookup.php?i={meal-id}


    ```


    The function to fetch and display the details could look like:


    ```javascript


    function fetchMealDetails(id) {


    fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${id}`)


    .then(response => response.json())


    .then(data => {


    const meal = data.meals[0];


    const detailsHTML = `


    <h2>${meal.strMeal}</h2>


    <img src="${meal.strMealThumb}" alt="${meal.strMeal}">


    <p>${meal.strInstructions}</p>


    `;


    mealResults.innerHTML = detailsHTML;


    });


    }


    ```


    This function fetches the detailed meal data using the provided ID, and then renders
    it to the DOM.


    * * *


    Conclusion


    By now, you should have a functional Meal Finder that allows users to search for
    meals using the MealDB API. The results are displayed dynamically, and users can
    view detailed recipes with just a click. Remember, APIs offer a plethora of data
    that can be used to enhance your web applications. The key lies in understanding
    the API documentation, structuring your fetch requests appropriately, and presenting
    the data to users in a user-friendly manner.


    Show Single Meal Page


    Welcome back! In the last chapter, we saw how to fetch meals and display them
    based on user queries. Now, we are going to focus on how to show the details of
    a selected meal on a dedicated page. By the end of this chapter, you will have
    an interactive page where users can click on a meal and view its details including
    ingredients and preparation steps.


    * * *


    Objective:


    - Fetch detailed data for a single meal using the MealDB API.


    - Display the meal details including image, name, category, origin, ingredients,
    and preparation steps.


    * * *


    Getting Started:


    To show the single meal page, we will be utilizing the `idMeal` property which
    is unique to each meal and can be used to fetch the detailed information of that
    meal from the MealDB API.


    * * *


    1\. HTML Structure:


    Let''s first design the layout for our single meal page.


    ```html


    <div class="single-meal">


    <div class="single-meal-header">


    <img src="" alt="Meal Image" id="meal-img">


    <h2 id="meal-name"></h2>


    </div>


    <div class="single-meal-info">


    <p><strong>Category:</strong> <span id="meal-category"></span></p>


    <p><strong>Origin:</strong> <span id="meal-origin"></span></p>


    </div>


    <div class="single-meal-ingredients">


    <h3>Ingredients:</h3>


    <ul id="ingredients-list"></ul>


    </div>


    <div class="single-meal-instructions">


    <h3>Instructions:</h3>


    <p id="meal-instructions"></p>


    </div>


    </div>


    ```


    * * *


    2\. CSS Styling:


    For a better presentation, add some CSS for the single meal display.


    ```css


    .single-meal-header {


    display: flex;


    align-items: center;


    }


    meal-img {


    width: 150px;


    height: 150px;


    margin-right: 20px;


    object-fit: cover;


    border-radius: 50%;


    }


    .single-meal-info {


    margin-top: 20px;


    }


    .single-meal-ingredients, .single-meal-instructions {


    margin-top: 30px;


    }


    ```


    * * *


    3\. JavaScript Functionality:


    We will fetch and display the single meal''s details using JavaScript.


    ```javascript


    function getSingleMealDetails(mealID) {


    fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${mealID}`)


    .then(response => response.json())


    .then(data => {


    const meal = data.meals[0];


    displayMealDetails(meal);


    })


    .catch(error => console.error(''Error fetching single meal:'', error));


    }


    function displayMealDetails(meal) {


    // Clear previous data


    document.getElementById(''meal-img'').src = meal.strMealThumb;


    document.getElementById(''meal-name'').textContent = meal.strMeal;


    document.getElementById(''meal-category'').textContent = meal.strCategory;


    document.getElementById(''meal-origin'').textContent = meal.strArea;


    // List ingredients


    const ingredientsList = document.getElementById(''ingredients-list'');


    ingredientsList.innerHTML = '''';


    for(let i = 1; i <= 20; i++) {


    if(meal[`strIngredient${i}`]) {


    const li = document.createElement(''li'');


    li.textContent = `${meal[`strIngredient${i}`]} - ${meal[`strMeasure${i}`]}`;


    ingredientsList.appendChild(li);


    }


    }


    // Display instructions


    document.getElementById(''meal-instructions'').textContent = meal.strInstructions;


    }


    ```


    * * *


    4\. Event Handling:


    When a user clicks on a meal from the list, fetch its details:


    ```javascript


    document.body.addEventListener(''click'', (e) => {


    if (e.target.classList.contains(''meal-item'')) {


    const mealID = e.target.getAttribute(''data-mealid'');


    getSingleMealDetails(mealID);


    }


    });


    ```


    Make sure that each meal displayed in the list has the class `meal-item` and a
    `data-mealid` attribute with the meal''s unique ID.


    * * *


    Wrapping Up:


    You''ve successfully created a single meal page that fetches detailed information
    about a meal and displays it in a user-friendly format. Now, when users are intrigued
    by a meal''s name or picture, they can dive deeper into its ingredients and instructions.


    In the next chapter, we will delve into how to display random meals and style
    their presentation. Stay tuned!


