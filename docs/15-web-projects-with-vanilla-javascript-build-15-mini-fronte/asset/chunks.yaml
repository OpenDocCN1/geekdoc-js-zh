    \n# 第 16 节：项目 15 - 打砖块游戏 | HTML5 Canvas API\n\n## 项目简介\n\n欢迎来到项目 15，即使用 HTML5\
    \ Canvas API 的“打砖块游戏”！如果你曾体验过经典街机游戏，那么这将是一段愉快的怀旧之旅。如果没有，请准备好体验这款为许多现代游戏奠定基础的昔日瑰宝。\n\
    \n* * *\n\n## 打砖块游戏\n\n打砖块游戏（通常简称为“Breakout”）的规则很简单。你控制一个挡板，左右移动，目的是弹起一个球，球在墙壁上反弹并击碎上方排列的砖块。击碎砖块后，它们会消失，目标是在不让球掉落到挡板下方的情况下清除所有砖块。听起来很简单，对吧？随着关卡提升，游戏可能会引入更快的球速、不同的砖块布局以及其他挑战，让你时刻保持警惕！\n\
    \n* * *\n\n## 为什么选择这个项目？\n\n这款游戏为深入探索 HTML5 Canvas API 提供了绝佳平台。通过这个项目，你将理解：\n\n\
    - 如何在画布上绘制和动画化形状。\n- 实现检测球与砖块或挡板碰撞的逻辑。\n- 捕获用户输入以移动挡板。\n- 实时操作画布以反映游戏状态，如分数、球重置或游戏结束场景。\n\
    \n* * *\n\n## 你将学到什么？\n\n到本项目结束时，你将熟悉：\n\n1. HTML5 Canvas 基础：设置画布，理解其坐标系，并绘制基本形状。\n\
    2. 动画：使用 `requestAnimationFrame` 创建流畅动画。\n3. 碰撞检测：理解如何检测球击中挡板、墙壁或砖块。\n4. 用户输入处理：捕获并处理键盘输入以移动挡板。\n\
    5. 游戏逻辑：实现游戏的核心机制，如球移动、分数追踪和关卡推进。\n\n* * *\n\n## 先决条件\n\n在开始之前，请确保你熟悉基本的 JavaScript\
    \ 概念，因为我们将用 JS 编写游戏逻辑。了解数组、循环和条件语句会很有帮助。如果你对 Canvas API 不熟悉，也不用担心，我们会逐步讲解所有内容。\n\
    \n* * *\n\n## 工具与技术\n\n- HTML：用于搭建游戏的结构和画布。\n- CSS：一些样式，使游戏看起来更吸引人。\n- JavaScript：游戏逻辑的核心。我们将使用原生\
    \ JS，因此无需外部库。\n- HTML5 Canvas API：用于绘制和动画化游戏元素。\n\n* * *\n\n## 总结\n\n这个项目既有趣又有教育意义。到结束时，你不仅会拥有一个可以向朋友和家人展示的功能性游戏，还会对游戏开发原理、Canvas\
    \ API 和 JavaScript 有更深入的理解。所以，卷起袖子，让我们通过打砖块游戏进入游戏开发的世界吧！\n\n在下一章中，我们将开始设置游戏页面和样式。准备好，让我们开始打砖块吧！\n\
    \n## 创建与样式化页面\n\n在本章中，我们将迈出打砖块游戏项目的第一步。在深入 HTML5 Canvas API 并创建实际游戏机制之前，我们首先需要打好基础。一个结构良好且样式美观的网页将成为我们游戏的基石。让我们开始吧！\n\
    \n* * *\n\n### 1. 设置 HTML 结构：\n\n首先，我们的 HTML 结构将很简单。我们需要一个游戏标题、一个用于渲染游戏的 canvas\
    \ 元素，以及可能一个用于游戏说明或致谢的页脚或区域。\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
    <head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n  <title>打砖块游戏</title>\n  <link rel=\"stylesheet\" href=\"\
    styles.css\">\n</head>\n<body>\n  <header>\n    <h1>打砖块游戏</h1>\n  </header>\n\
    \  <section id=\"game-area\">\n    <canvas id=\"breakoutCanvas\" width=\"800\"\
    \ height=\"600\"></canvas>\n  </section>\n  <footer>\n    <p>操作说明：使用方向键或触摸控制移动挡板。击碎所有砖块即可获胜！</p>\n\
    \  </footer>\n</body>\n</html>\n```\n\n注意：\n\n- `canvas` 元素被赋予了固定的宽度和高度。这些尺寸可以根据你的设计偏好进行调整。\n\
    - 我们链接了一个名为 `styles.css` 的外部 CSS 文件来样式化游戏页面。\n\n* * *\n\n### 2. 样式化页面：\n\n为了游戏的视觉吸引力，我们将采用简洁、居中的布局，并配以柔和的背景，使游戏区域成为主要焦点。\n\
    \n*styles.css:*\n\n```css\nbody {\n  font-family: 'Arial', sans-serif;\n  background-color:\
    \ 282c34;\n  color: ffffff;\n  text-align: center;\n  display: flex;\n  flex-direction:\
    \ column;\n  align-items: center;\n  justify-content: center;\n  height: 100vh;\n\
    \  margin: 0;\n}\n\nheader {\n  margin-bottom: 20px;\n}\n\nh1 {\n  font-size:\
    \ 2.5em;\n  margin: 0;\n}\n\n#game-area {\n  position: relative;\n}\n\n#breakoutCanvas\
    \ {\n  border: 2px solid ffffff;\n  background-color: 1a1d23;\n}\n\nfooter {\n\
    \  margin-top: 20px;\n}\n\nfooter p {\n  font-size: 0.9em;\n}\n```\n\n亮点：\n\n\
    - 我们为页面设置了深色背景（`282c34`），以突出色彩丰富的游戏元素。\n- 游戏画布使用了稍有不同的深色（`1a1d23`），并带有边框以作区分。\n\
    - 整个布局通过 Flexbox 在水平和垂直方向上居中，呈现出现代而简洁的外观。\n\n* * *\n\n### 3. 改进与增强：\n\n虽然我们的基础结构和样式已经设置好，但始终要考虑如何增强用户体验：\n\
    \n- 你可能想添加一个开始游戏按钮，或一个记分板来追踪玩家的进度。\n- 响应式设计可以确保游戏在所有设备上看起来都很棒。使用媒体查询为小屏幕调整样式。\n\
    - 考虑添加游戏音效或背景音乐，以获得更沉浸的体验。\n\n* * *\n\n### 总结：\n\n通过搭建页面结构并应用样式，我们为打砖块游戏奠定了坚实的基础。这确保了我们在后续章节中将要深入的游戏机制，能够在一个精致且专业的舞台上展示。\n\
    \n请记住，设计是游戏开发的关键部分。它不仅关乎外观，还关乎感觉。因此，请始终花时间完善和优化游戏运行的环境。在接下来的章节中，我们将使用 HTML5 Canvas\
    \ API 让打砖块游戏活起来。敬请期待！\n\n## Canvas 计划大纲\n\n欢迎来到第 85 章，我们将深入规划打砖块游戏项目。画布是我们游戏的关键部分，理解其结构和功能对于游戏开发至关重要。\n\
    \n* * *\n\n### 1. Canvas 简介\n\n"
- fmt: "\nBefore we jump into the specifics of our Breakout game, let’s briefly recap\
    \ what the Canvas is. The HTML5 `<canvas>` element is used to draw graphics, on\
    \ the fly, via scripting (usually JavaScript). It allows for dynamic, scriptable\
    \ rendering of 2D shapes and bitmap images.\n\n---\n\n## 2. Setting Up Our Canvas\n\
    \nTo initiate our canvas, we'll be defining it within our HTML:\n\n```html\n<canvas\
    \ id=\"breakoutCanvas\" width=\"800\" height=\"600\"></canvas>\n```\n\nThis will\
    \ create a drawing surface 800 pixels wide and 600 pixels tall. But to bring life\
    \ to this canvas, we must use JavaScript.\n\nIn your JavaScript, target the canvas\
    \ element:\n\n```javascript\nconst canvas = document.getElementById('breakoutCanvas');\n\
    const ctx = canvas.getContext('2d');\n```\n\n`getContext('2d')` gives us a drawing\
    \ context on the canvas, which we'll use for the Breakout game's visual elements.\n\
    \n---\n\n## 3. Elements of Our Breakout Game\n\nOur Breakout game comprises the\
    \ following elements:\n\n- Ball\n- Paddle\n- Bricks\n- Score Display\n- Life Display\n\
    \nEach element will be drawn and manipulated using the canvas API.\n\n---\n\n\
    ## 4. Coordinate System\n\nThe canvas has a built-in coordinate system. The top-left\
    \ corner of the canvas is defined as point `(0,0)`. All elements are placed relative\
    \ to this point. As we go downwards, the y-coordinate increases; as we go to the\
    \ right, the x-coordinate increases.\n\n---\n\n## 5. Ball Dynamics\n\n- Initial\
    \ Position: Center of the canvas.\n- Movement: The ball will move both in the\
    \ x and y directions.\n- Collision: We will need to detect collisions with the\
    \ paddle, the bricks, and the canvas edges.\n\n---\n\n## 6. Paddle Dynamics\n\n\
    - Initial Position: Centered horizontally at the bottom of the canvas.\n- Movement:\
    \ The paddle will only move horizontally, controlled by the user.\n- Width and\
    \ Height: These dimensions will be constants that we can tweak as per our game's\
    \ requirement.\n\n---\n\n## 7. Brick Configuration\n\n- Rows and Columns: We’ll\
    \ design a pattern of bricks using multiple rows and columns.\n- Brick Size: Each\
    \ brick will have a uniform size, but we can adjust this to fit our design.\n\
    - Gaps: There will be small gaps between bricks to distinguish them clearly.\n\
    \n---\n\n## 8. Score & Life Display\n\n- Position: Top-left corner of the canvas.\n\
    - Dynamics: The score will increment when the ball hits a brick, and the life\
    \ count will decrement when the ball misses the paddle.\n\n---\n\n## 9. Color\
    \ Scheme\n\nA consistent and visually pleasing color scheme is essential. For\
    \ our game, we’ll be choosing:\n\n- Ball: Red\n- Paddle: Black\n- Bricks: A gradient\
    \ of blues (this will add a dynamic feel)\n- Background: Light grey\n- Score &\
    \ Life Display: Dark grey with white text\n\n---\n\n## 10. Future Enhancements\
    \ (Optional)\n\nPlanning ahead, we can think of additional features:\n\n- Multiple\
    \ levels with increasing difficulty\n- Power-ups that appear randomly\n- Different\
    \ brick types, some harder to break\n\n---\n\n## Conclusion\n\nThe canvas offers\
    \ a plethora of opportunities for web-based game development. By understanding\
    \ its capabilities and planning our game's structure, we set the stage for smooth\
    \ development in subsequent chapters. In the upcoming chapters, we’ll delve into\
    \ the specifics of each game element, starting with drawing the ball and paddle\
    \ on our canvas. Stay tuned!\n\n---\n\nRemember, planning is a crucial phase in\
    \ any development process. A well-thought-out plan can help streamline the coding\
    \ phase and reduce potential errors. Always consider spending ample time in this\
    \ phase before jumping into coding.\n\n---\n\n## Draw Ball, Paddle & Score\n\n\
    In this chapter, we will start to see our Breakout game take shape. We’ll be diving\
    \ deep into the HTML5 Canvas API, understanding how to draw and animate a ball,\
    \ paddle, and keep score. Let’s get started!\n\n---\n\n### 1. Setting Up the Canvas\
    \ Context\n\nBefore we start drawing, let's set up our canvas context. We’ve already\
    \ created our canvas element in our HTML, so we'll grab that and set its 2D rendering\
    \ context:\n\n```javascript\nconst canvas = document.getElementById('breakoutCanvas');\n\
    const ctx = canvas.getContext('2d');\n```\n\n---\n\n### 2. Defining the Ball Properties\n\
    \nWe'll start by defining properties for our ball:\n\n```javascript\nconst ball\
    \ = {\n  x: canvas.width / 2,\n  y: canvas.height - 30,\n  radius: 10,\n  speed:\
    \ 2,\n  dx: 2,\n  dy: -2,\n  color: 'blue'\n};\n```\n\nHere, `dx` and `dy` represent\
    \ the ball’s movement along the x and y axis.\n\n---\n\n### 3. Drawing the Ball\n\
    \nNow, let's create a function to draw our ball:\n\n```javascript\nfunction drawBall()\
    \ {\n  ctx.beginPath();\n  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);\n\
    \  ctx.fillStyle = ball.color;\n  ctx.fill();\n  ctx.closePath();\n}\n```\n\n\
    This function uses the `arc()` method which draws a circle using the properties\
    \ we set for our ball.\n\n---\n\n### 4. Defining the Paddle Properties\n\nLet’s\
    \ define our paddle:\n\n```javascript\nconst paddle = {\n  height: 10,\n  width:\
    \ 75,\n  x: (canvas.width - 75) / 2,\n  color: 'green'\n};\n```\n\nWe've set the\
    \ initial position of the paddle to be centered at the bottom of the canvas.\n\
    \n---\n\n### 5. Drawing the Paddle\n\nHere's our function to draw the paddle:\n\
    \n```javascript\nfunction drawPaddle() {\n  ctx.beginPath();\n  ctx.rect(paddle.x,\
    \ canvas.height - paddle.height, paddle.width, paddle.height);\n  ctx.fillStyle\
    \ = paddle.color;\n  ctx.fill();\n  ctx.closePath();\n}\n```\n\nWe used the `rect()`\
    \ method to draw our paddle as a rectangle.\n\n---\n\n### 6. Keeping Score\n\n\
    We'll need a variable to keep track of the score:\n\n```javascript\nlet score\
    \ = 0;\n```\n\nTo display it, we'll create a function:\n\n```javascript\nfunction\
    \ drawScore() {\n  ctx.font = '16px Arial';\n  ctx.fillStyle = 'black';\n  ctx.fillText('Score:\
    \ ' + score, 8, 20);\n}\n```\n\nThe `fillText()` method is used to render the\
    \ score on the canvas.\n\n---\n\n### 7. Bringing It All Together\n\nNow, let’s\
    \ create a function to draw everything:\n\n```javascript\nfunction draw() {\n\
    \  ctx.clearRect(0, 0, canvas.width, canvas.height);\n  drawBall();\n  drawPaddle();\n\
    \  drawScore();\n  requestAnimationFrame(draw);\n}\n```\n\nWe start by clearing\
    \ the canvas to ensure no trails are left by the ball. Then we draw our elements.\
    \ Finally, the `requestAnimationFrame()` recursively calls our `draw()` function,\
    \ creating an animation loop.\n\n---\n\n### 8. Let's Play!\n\nTo kick things off,\
    \ simply call the `draw()` function:\n\n```javascript\ndraw();\n```\n\nThis will\
    \ initiate our game loop and you’ll see the ball, paddle, and score on the canvas.\n\
    \n---\n\n## Summary\n\nIn this chapter, we've successfully drawn our ball and\
    \ paddle using the HTML5 Canvas API and started keeping score. As we progress\
    \ further, we'll add the ability to move the paddle, bounce the ball, and break\
    \ the bricks. This is just the beginning of our Breakout game journey!\n\n---\n\
    \n## Creating The Bricks\n\nIn this chapter, we'll be focusing on one of the core\
    \ components of our Breakout game: the bricks. Every game has its obstacles, and\
    \ in Breakout, the bricks serve that purpose. By using the HTML5 Canvas API, we'll\
    \ create, style, and position our bricks.\n\n---\n\n### Brick Configuration\n\n\
    Before diving into the code, let's outline the properties our bricks will have:\n\
    \n- Width & Height: The dimensions of each brick.\n- Padding: Space between each\
    \ brick.\n- Offset: Initial top and left space to start drawing the bricks.\n\
    - Color: The color of the bricks.\n- Row & Column: Number of rows and columns\
    \ for our bricks.\n\n---\n\n### Setting Up Our Bricks\n\n#### 1. Brick Variables\n\
    \nBefore drawing, we need to set our variables:\n\n```javascript\nconst brickWidth\
    \ = 70;\nconst brickHeight = 20;\nconst brickPadding = 10;\nconst brickOffsetTop\
    \ = 30;\nconst brickOffsetLeft = 30;\nconst brickRowCount = 5;\nconst brickColumnCount\
    \ = 3;\n```\n\n#### 2. Brick Array\n\nWe'll represent our bricks as an array of\
    \ objects:\n\n```javascript\nlet bricks = [];\nfor(let c=0; c<brickColumnCount;\
    \ c++) {\n  bricks[c] = [];\n  for(let r=0; r<brickRowCount; r++) {\n    bricks[c][r]\
    \ = { x: 0, y: 0, status: 1 };\n  }\n}\n```\n"
  raw: 'Before we jump into the specifics of our Breakout game, let’s briefly recap
    what the Canvas is. The HTML5 `<canvas>` element is used to draw graphics, on
    the fly, via scripting (usually JavaScript). It allows for dynamic, scriptable
    rendering of 2D shapes and bitmap images.


    * * *


    2\. Setting Up Our Canvas


    To initiate our canvas, we''ll be defining it within our HTML:


    ```html


    <canvas id="breakoutCanvas" width="800" height="600"></canvas>


    ```


    This will create a drawing surface 800 pixels wide and 600 pixels tall. But to
    bring life to this canvas, we must use JavaScript.


    In your JavaScript, target the canvas element:


    ```javascript


    const canvas = document.getElementById(''breakoutCanvas'');


    const ctx = canvas.getContext(''2d'');


    ```


    `getContext(''2d'')` gives us a drawing context on the canvas, which we''ll use
    for the Breakout game''s visual elements.


    * * *


    3\. Elements of Our Breakout Game


    Our Breakout game comprises the following elements:


    - Ball


    - Paddle


    - Bricks


    - Score Display


    - Life Display


    Each element will be drawn and manipulated using the canvas API.


    * * *


    4\. Coordinate System


    The canvas has a built-in coordinate system. The top-left corner of the canvas
    is defined as point (0,0). All elements are placed relative to this point. As
    we go downwards, the y-coordinate increases; as we go to the right, the x-coordinate
    increases.


    * * *


    5\. Ball Dynamics


    - Initial Position: Center of the canvas.


    - Movement: The ball will move both in the x and y directions.


    - Collision: We will need to detect collisions with the paddle, the bricks, and
    the canvas edges.


    * * *


    6\. Paddle Dynamics


    - Initial Position: Centered horizontally at the bottom of the canvas.


    - Movement: The paddle will only move horizontally, controlled by the user.


    - Width and Height: These dimensions will be constants that we can tweak as per
    our game''s requirement.


    * * *


    7\. Brick Configuration


    - Rows and Columns: We’ll design a pattern of bricks using multiple rows and columns.


    - Brick Size: Each brick will have a uniform size, but we can adjust this to fit
    our design.


    - Gaps: There will be small gaps between bricks to distinguish them clearly.


    * * *


    8\. Score & Life Display


    - Position: Top-left corner of the canvas.


    - Dynamics: The score will increment when the ball hits a brick, and the life
    count will decrement when the ball misses the paddle.


    * * *


    9\. Color Scheme


    A consistent and visually pleasing color scheme is essential. For our game, we’ll
    be choosing:


    - Ball: Red


    - Paddle: Black


    - Bricks: A gradient of blues (this will add a dynamic feel)


    - Background: Light grey


    - Score & Life Display: Dark grey with white text


    * * *


    10\. Future Enhancements (Optional)


    Planning ahead, we can think of additional features:


    - Multiple levels with increasing difficulty


    - Power-ups that appear randomly


    - Different brick types, some harder to break


    * * *


    Conclusion


    The canvas offers a plethora of opportunities for web-based game development.
    By understanding its capabilities and planning our game''s structure, we set the
    stage for smooth development in subsequent chapters. In the upcoming chapters,
    we’ll delve into the specifics of each game element, starting with drawing the
    ball and paddle on our canvas. Stay tuned!


    * * *


    Remember, planning is a crucial phase in any development process. A well-thought-out
    plan can help streamline the coding phase and reduce potential errors. Always
    consider spending ample time in this phase before jumping into coding.


    Draw Ball, Paddle & Score


    In this chapter, we will start to see our Breakout game take shape. We’ll be diving
    deep into the HTML5 Canvas API, understanding how to draw and animate a ball,
    paddle, and keep score. Let’s get started!


    * * *


    1\. Setting Up the Canvas Context


    Before we start drawing, let''s set up our canvas context. We’ve already created
    our canvas element in our HTML, so we''ll grab that and set its 2D rendering context:


    ```javascript


    const canvas = document.getElementById(''breakoutCanvas'');


    const ctx = canvas.getContext(''2d'');


    ```


    * * *


    2\. Defining the Ball Properties


    We''ll start by defining properties for our ball:


    ```javascript


    const ball = {


    x: canvas.width / 2,


    y: canvas.height - 30,


    radius: 10,


    speed: 2,


    dx: 2,


    dy: -2,


    color: ''blue''


    };


    ```


    Here, `dx` and `dy` represent the ball’s movement along the x and y axis.


    * * *


    3\. Drawing the Ball


    Now, let''s create a function to draw our ball:


    ```javascript


    function drawBall() {


    ctx.beginPath();


    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);


    ctx.fillStyle = ball.color;


    ctx.fill();


    ctx.closePath();


    }


    ```


    This function uses the `arc()` method which draws a circle using the properties
    we set for our ball.


    * * *


    4\. Defining the Paddle Properties


    Let’s define our paddle:


    ```javascript


    const paddle = {


    height: 10,


    width: 75,


    x: (canvas.width - 75) / 2,


    color: ''green''


    };


    ```


    We''ve set the initial position of the paddle to be centered at the bottom of
    the canvas.


    * * *


    5\. Drawing the Paddle


    Here''s our function to draw the paddle:


    ```javascript


    function drawPaddle() {


    ctx.beginPath();


    ctx.rect(paddle.x, canvas.height - paddle.height, paddle.width, paddle.height);


    ctx.fillStyle = paddle.color;


    ctx.fill();


    ctx.closePath();


    }


    ```


    We used the `rect()` method to draw our paddle as a rectangle.


    * * *


    6\. Keeping Score


    We''ll need a variable to keep track of the score:


    ```javascript


    let score = 0;


    ```


    To display it, we''ll create a function:


    ```javascript


    function drawScore() {


    ctx.font = ''16px Arial'';


    ctx.fillStyle = ''black'';


    ctx.fillText(''Score: '' + score, 8, 20);


    }


    ```


    The `fillText()` method is used to render the score on the canvas.


    * * *


    7\. Bringing It All Together


    Now, let’s create a function to draw everything:


    ```javascript


    function draw() {


    ctx.clearRect(0, 0, canvas.width, canvas.height);


    drawBall();


    drawPaddle();


    drawScore();


    requestAnimationFrame(draw);


    }


    ```


    We start by clearing the canvas to ensure no trails are left by the ball. Then
    we draw our elements. Finally, the `requestAnimationFrame()` recursively calls
    our `draw()` function, creating an animation loop.


    * * *


    8\. Let''s Play!


    To kick things off, simply call the `draw()` function:


    ```javascript


    draw();


    ```


    This will initiate our game loop and you’ll see the ball, paddle, and score on
    the canvas.


    * * *


    Summary


    In this chapter, we''ve successfully drawn our ball and paddle using the HTML5
    Canvas API and started keeping score. As we progress further, we''ll add the ability
    to move the paddle, bounce the ball, and break the bricks. This is just the beginning
    of our Breakout game journey!


    Creating The Bricks


    In this chapter, we''ll be focusing on one of the core components of our Breakout
    game: the bricks. Every game has its obstacles, and in Breakout, the bricks serve
    that purpose. By using the HTML5 Canvas API, we''ll create, style, and position
    our bricks.


    * * *


    Brick Configuration


    Before diving into the code, let''s outline the properties our bricks will have:


    - Width & Height: The dimensions of each brick.


    - Padding: Space between each brick.


    - Offset: Initial top and left space to start drawing the bricks.


    - Color: The color of the bricks.


    - Row & Column: Number of rows and columns for our bricks.


    * * *


    Setting Up Our Bricks


    1\. Brick Variables


    Before drawing, we need to set our variables:


    ```javascript


    const brickWidth = 70;


    const brickHeight = 20;


    const brickPadding = 10;


    const brickOffsetTop = 30;


    const brickOffsetLeft = 30;


    const brickRowCount = 5;


    const brickColumnCount = 3;


    ```


    2\. Brick Array


    We''ll represent our bricks as an array of objects:


    ```javascript


    let bricks = [];


    for(let c=0; c<brickColumnCount; c++) {


    bricks[c] = [];


    for(let r=0; r<brickRowCount; r++) {


    bricks[c][r] = { x: 0, y: 0, status: 1 };


    }


    }


    ```'
