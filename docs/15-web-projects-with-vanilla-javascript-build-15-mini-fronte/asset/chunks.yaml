    Show Transaction Items


    In this chapter, we''ll be focusing on displaying the transaction items in our
    Expense Tracker project. These transaction items represent individual financial
    activities, either income or expenditure, that the user has recorded in the app.
    We''ll utilize a combination of HTML, CSS, and JavaScript to achieve this. Let''s
    dive in!


    * * *


    1\. The HTML Structure


    To display transaction items, we need a container in our HTML where each transaction
    can be listed. The following markup will serve our purpose:


    ```html


    <section class="transactions">


    <h2>Transaction History</h2>


    <ul id="transaction-list">


    <!-- Transaction items will be added here using JavaScript -->


    </ul>


    </section>


    ```


    Here, the `transaction-list` will be dynamically populated with the transaction
    items using JavaScript.


    * * *


    2\. CSS Styling


    To make our transaction list visually appealing, let''s style it:


    ```css


    .transactions {


    margin: 20px 0;


    border: 1px solid e0e0e0;


    padding: 10px;


    }


    .transactions h2 {


    text-align: center;


    margin-bottom: 15px;


    }


    transaction-list {


    list-style-type: none;


    padding: 0;


    }


    transaction-list li {


    display: flex;


    justify-content: space-between;


    padding: 8px 0;


    border-bottom: 1px solid e0e0e0;


    }


    ```


    * * *


    3\. JavaScript Implementation


    First, select the transaction list in your JavaScript:


    ```javascript


    const transactionList = document.getElementById(''transaction-list'');


    ```


    Assuming you have an array of transaction objects named `transactions` (which
    will be filled with user input or data from local storage), we will use the following
    function to display them:


    ```javascript


    function displayTransactions() {


    // Clear out any current transaction items in the list


    transactionList.innerHTML = '''';


    // Loop through the transactions array and display each one


    transactions.forEach(transaction => {


    const item = document.createElement(''li'');


    item.innerHTML = `


    <span>${transaction.description}</span>


    <span>${transaction.amount > 0 ? ''+'' : ''-''}$${Math.abs(transaction.amount)}</span>


    `;


    item.classList.add(transaction.amount > 0 ? ''income'' : ''expense'');


    transactionList.appendChild(item);


    });


    }


    ```


    This function first clears any current transactions in the list. Then, for each
    transaction in our `transactions` array, it creates a new list item (`li`) element,
    sets its inner HTML to display the transaction''s description and amount, adds
    a class based on whether the transaction is an income or an expense, and then
    appends the item to our `transaction-list`.


    * * *


    4\. Additional CSS for Income and Expense


    Differentiate income and expense visually using colors:


    ```css


    transaction-list .income {


    color: green;


    }


    transaction-list .expense {


    color: red;


    }


    ```


    * * *


    5\. Calling the `displayTransactions` Function


    Whenever a new transaction is added or an existing one is modified, ensure you
    call the `displayTransactions()` function. This will ensure that the list is always
    updated with the latest data:


    ```javascript


    // Sample code when adding a new transaction


    function addTransaction(transaction) {


    transactions.push(transaction);


    displayTransactions();


    }


    ```


    * * *


    Conclusion


    With the above steps, we''ve successfully implemented the functionality to display
    transaction items in our Expense Tracker project. As users add or remove transactions,
    the list will update dynamically, providing a clear and concise view of their
    financial activities. In subsequent chapters, we will build upon this foundation
