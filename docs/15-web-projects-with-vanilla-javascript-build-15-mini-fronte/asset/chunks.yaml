    ## 持久化到本地存储


    现代 Web 应用最常见的需求之一是在会话之间持久化数据，而无需将数据发送回服务器。这可以为用户提供无缝体验，因为设置、用户偏好甚至用户生成的内容等数据都可以保存，并在后续访问时加载。在我们的支出追踪器项目中，我们将利用
    Web 存储 API（特别是本地存储）的强大功能来实现这一点。


    * * *


    ### 什么是本地存储？


    本地存储是一种基于 Web 的存储解决方案，允许网站在 Web 浏览器中存储键值对，且没有过期时间。它非常适合保存用户特定数据，并且其存储容量远大于 Cookie。


    优点：


    - **持久性**：与会话存储不同，本地存储中的数据不会随会话过期。这意味着即使您关闭浏览器或标签页，数据在您返回时仍然存在。


    '
- fmt: '

    - Capacity: You can store up to 5-10 MB of data depending on the browser. Far
    more than what cookies can hold.

    - Simplicity: The API is straightforward, with simple `set`, `get`, and `remove`
    methods.


    * * *


    ## Implementing Local Storage in the Expense Tracker


    ### Storing Transactions:


    To persist our expense transactions, we''ll need to save them to local storage
    whenever a new transaction is added or an existing one is deleted.


    ```javascript


    // Initial transactions array


    let transactions = [];


    function updateLocalStorage() {


    localStorage.setItem(''transactions'', JSON.stringify(transactions));


    }


    ```


    ### Adding a Transaction:


    When you add a new transaction to your list:


    ```javascript


    function addTransaction(transaction) {


    transactions.push(transaction);


    updateLocalStorage();


    }


    ```


    This will add the transaction to the `transactions` array and then update local
    storage with the new array.


    ### Deleting a Transaction:


    Similarly, when deleting:


    ```javascript


    function deleteTransaction(id) {


    transactions = transactions.filter(transaction => transaction.id !== id);


    updateLocalStorage();


    }


    ```


    Here, we''re filtering out the transaction with a specific ID and then updating
    our local storage.


    ### Loading Transactions from Local Storage:


    When the user visits the expense tracker, it''s essential to check local storage
    and populate any saved transactions.


    ```javascript


    function init() {


    // Check for saved transactions in Local Storage


    const savedTransactions = JSON.parse(localStorage.getItem(''transactions''));


    if (savedTransactions) {


    transactions = savedTransactions;


    // Then, render these transactions to the DOM as needed


    }


    }


    init();


    ```


    * * *


    ## Important Considerations:


    - JSON Parsing and Stringifying: Local Storage only stores strings. So, when saving
    arrays or objects, you''ll need to stringify them first using `JSON.stringify()`.
    When retrieving them, parse them back into a usable format with `JSON.parse()`.

    - Limitations: While the 5-10 MB limit is generous for many applications, be aware
    of it. If there''s a potential for your application to store a large amount of
    data, you may want to consider other options or strategies like IndexedDB or even
    server-side storage.

    - Security: Local Storage is not designed for sensitive data. Since it''s accessible
    via JavaScript, it''s open to potential XSS attacks. Always ensure you validate
    and sanitize your data.


    * * *


    ## Conclusion:


    Local Storage is a powerful tool in a web developer''s arsenal, offering a simple
    and efficient way to enhance user experience through data persistence. In our
    Expense Tracker application, it provides an essential bridge between sessions,
    ensuring that our users never lose track of their transactions. As with all tools,
    it''s crucial to be aware of its limitations and use it judiciously.


