  trans: "\n\n# 视频播放器实现\n\n假设你的视频播放器具有以下 HTML 结构：\n\n```html\n<div class=\"video-container\"\
    >\n  <video id=\"videoPlayer\" width=\"640\" height=\"360\" controls>\n    <source\
    \ src=\"path_to_your_video.mp4\" type=\"video/mp4\">\n    您的浏览器不支持 video 标签。\n\
    \  </video>\n  <div class=\"controls\">\n    <button id=\"playBtn\">播放</button>\n\
    \    <button id=\"pauseBtn\">暂停</button>\n    <button id=\"stopBtn\">停止</button>\n\
    \  </div>\n</div>\n```\n\n## 实现播放、暂停和停止功能\n\n1. **播放视频**：\n要播放视频，我们需要定位视频元素并调用\
    \ `play()` 方法。\n\n```javascript\nconst video = document.getElementById('videoPlayer');\n\
    document.getElementById('playBtn').addEventListener('click', function() {\n  video.play();\n\
    });\n```\n\n2. **暂停视频**：\n暂停视频同样简单。定位视频元素并调用 `pause()` 方法。\n\n```javascript\n\
    document.getElementById('pauseBtn').addEventListener('click', function() {\n \
    \ video.pause();\n});\n```\n\n3. **停止视频**：\n停止视频包含两个步骤：\n1. 暂停视频。\n2. 将视频的 `currentTime`\
    \ 重置为 `0`（即开头）。\n\n```javascript\ndocument.getElementById('stopBtn').addEventListener('click',\
    \ function() {\n  video.pause();\n  video.currentTime = 0;\n});\n```\n\n## 通过播放/暂停切换增强用户体验\n\
    \n通常，视频播放器会将播放和暂停功能合并到一个按钮中。让我们为此创建一个切换函数：\n\n1. **修改 HTML**：\n```html\n<button\
    \ id=\"togglePlayPauseBtn\">播放</button>\n```\n\n2. **JavaScript**：\n```javascript\n\
    const togglePlayPauseBtn = document.getElementById('togglePlayPauseBtn');\ntogglePlayPauseBtn.addEventListener('click',\
    \ function() {\n  if (video.paused) {\n    video.play();\n    togglePlayPauseBtn.innerText\
    \ = \"暂停\";\n  } else {\n    video.pause();\n    togglePlayPauseBtn.innerText\
    \ = \"播放\";\n  }\n});\n```\n\n## 总结\n\n借助 HTML5 Video API，实现播放、暂停和停止功能变得轻而易举。该\
    \ API 提供了丰富的方法和属性，帮助开发者创建功能强大且特性丰富的视频播放器。\n\n在下一章中，我们将深入探讨如何通过添加进度条和时间戳来增强视频播放器的用户体验，让用户能够直观地看到播放状态和视频时长。\n\
    \n记住，熟能生巧！大胆尝试修改代码，探索不同的功能，让这个视频播放器真正属于你。祝你编码愉快！\n\n# 视频进度条与时间戳\n\n欢迎来到第 19 章！在本章中，我们将探索自定义视频播放器的两个关键元素——进度条和时间戳。这两者都能提升用户体验，让观看者了解视频的进度并控制播放。\n\
    \n## 1. 理解 Video API\n\n在深入编码之前，有必要先了解一下 HTML5 Video API。Video API 提供了诸如 `currentTime`（当前播放位置，以秒为单位）和\
    \ `duration`（视频总时长，以秒为单位）等属性。这些属性对于我们的进度条和时间戳功能至关重要。\n\n## 2. HTML 结构\n\n对于我们的自定义视频播放器，假设你已经从之前的章节中获得了以下基本\
    \ HTML 结构：\n\n```html\n<video id=\"video\" width=\"750\" controls>\n  <source\
    \ src=\"path_to_video.mp4\" type=\"video/mp4\">\n</video>\n<div id=\"video-controls\"\
    >\n  <div id=\"progress-bar\">\n    <div id=\"progress\"></div>\n  </div>\n  <span\
    \ id=\"timestamp\">00:00 / 00:00</span>\n</div>\n```\n\n这里，`progress-bar` 是容器，`progress`\
    \ 是填充条，用于显示视频播放进度。`timestamp` 将显示当前时间和视频总时长。\n\n## 3. 进度条的 CSS\n\n在添加功能之前，确保进度条外观正确：\n\
    \n```css\n.progress-bar {\n  width: 90%;\n  height: 5px;\n  background: #e0e0e0;\n\
    \  margin: 10px auto;\n  position: relative;\n}\n.progress {\n  height: 5px;\n\
    \  background: #007BFF;\n  width: 0;\n}\n```\n\n## 4. JavaScript 功能\n\n现在，让我们进入有趣的部分——JavaScript！\n\
    \n### a. 进度条\n我们希望进度条随着视频播放而填充：\n\n```javascript\nconst video = document.getElementById('video');\n\
    const progressBar = document.getElementById('progress-bar');\nconst progress =\
    \ document.getElementById('progress');\nvideo.addEventListener('timeupdate', updateProgressBar);\n\
    \nfunction updateProgressBar() {\n  const percentage = (video.currentTime / video.duration)\
    \ * 100;\n  progress.style.width = `${percentage}%`;\n}\n```\n\n### b. 时间戳\n更新时间戳：\n\
    \n```javascript\nconst timestamp = document.getElementById('timestamp');\nvideo.addEventListener('timeupdate',\
    \ updateTimestamp);\n\nfunction updateTimestamp() {\n  const minutesCurrent =\
    \ Math.floor(video.currentTime / 60);\n  let secondsCurrent = Math.floor(video.currentTime\
    \ % 60);\n  if (secondsCurrent < 10) {\n    secondsCurrent = '0' + secondsCurrent;\n\
    \  }\n  const minutesDuration = Math.floor(video.duration / 60);\n  let secondsDuration\
    \ = Math.floor(video.duration % 60);\n  if (secondsDuration < 10) {\n    secondsDuration\
    \ = '0' + secondsDuration;\n  }\n  timestamp.textContent = `${minutesCurrent}:${secondsCurrent}\
    \ / ${minutesDuration}:${secondsDuration}`;\n}\n```\n\n## 5. 跳转功能\n\n让我们添加用户点击进度条跳转到视频不同部分的功能：\n\
    \n```javascript\nprogressBar.addEventListener('click', setVideoProgress);\n\n\
    function setVideoProgress(e) {\n  const clickPosition = e.offsetX;\n  const width\
    \ = progressBar.offsetWidth;\n  const clickPercentage = (clickPosition / width);\n\
    \  video.currentTime = clickPercentage * video.duration;\n}\n```\n\n## 6. 回顾\n\
    \n至此，你已经拥有了一个功能性的进度条，它会随着视频播放而填充，并且时间戳会实时更新。用户还可以点击进度条跳转到视频的任意位置，从而增强了用户对播放的控制和体验。\n\
    \n# 项目 4 - 汇率计算器 | Fetch 与 JSON 入门\n\n## 项目介绍\n\n欢迎来到项目 4——汇率计算器！在这个项目中，我们将踏上一段旅程，创建一个在日常生活中广泛使用的实用工具。无论你是旅行、投资，还是仅仅对世界经济感到好奇，汇率计算器都能提供关于不同国家货币价值的重要信息。\n\
    \n### 目标\n在本项目结束时，你将构建一个交互式 Web 应用程序，该程序能够获取多种货币的实时汇率，并执行计算以在这些货币之间进行金额转换。这一切都将使用纯原生\
    \ JavaScript 完成，让你亲身体验 `Fetch API` 和 `JSON` 数据处理。\n\n### 项目概览\n以下是我们将要开发的内容预览：\n\
    1. **用户界面**：一个简洁直观的设计，包含用于选择货币的下拉菜单和用于输入转换金额的输入框。\n2. **实时数据**：我们将从一个免费的 API 获取实时汇率。\n\
    3. **转换逻辑**：将输入的货币转换为目标货币并显示结果。\n4. **错误处理**：实现适当的错误检查和错误处理，以确保流畅的用户体验。\n\n###\
    \ 需要掌握的技能与技术\n- `Fetch API`：理解如何发出异步请求以获取实时数据。\n- `JSON` 数据处理：处理 `JSON` 响应，提取、操作并在应用程序中使用数据。\n\
    - 动态 DOM 操作：用可用货币填充下拉菜单、显示实时汇率等。\n- 错误处理：为网络错误或无效数据等问题创建用户友好的错误消息。\n\n### 为什么选择这个项目？\n\
    汇率计算器不仅会成为你作品集中的又一个项目，它还能展示你构建实用现实世界应用程序的能力。它强调：\n1. **实用性**：创建人们可以在日常生活中使用的工具。\n\
    2. **数据处理**：处理实时数据流并动态显示它们。\n\n"
