    }


    // 初始从本地存储加载交易（如果可用）


    function initializeTransactions() {


    const storedTransactions = localStorage.getItem(''transactions'');


    transactions = storedTransactions ? JSON.parse(storedTransactions) : [];


    updateUI();


    }


    initializeTransactions();


    ```


