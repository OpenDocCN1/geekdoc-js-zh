    ```


    4\. Append the List Item to the Parent Element


    To insert the new list item into the DOM, you use the `appendChild()` method.


    ```javascript


    list.appendChild(listItem);


    ```


    If you followed the above steps, your list will now look like this:


    ```html


    <ul>


    <li>Item 1</li>


    <li>Item 2</li>


    <li>Item 3</li>


    <li>Item 4</li>


    </ul>


    ```


    * * *


    Dynamically Inserting Multiple List Items


    To make our project interactive, we might want to insert multiple list items at
    once. For example, if we have an array of items, we can iterate over this array
    and insert each item into the DOM:


    ```javascript


    const items = [''Item 5'', ''Item 6'', ''Item 7''];


    items.forEach(item => {


    const listItem = document.createElement(''li'');


    listItem.textContent = item;


    list.appendChild(listItem);


    });


    ```


    This will extend our list to:


    ```html


    <ul>


    <li>Item 1</li>


    <li>Item 2</li>


    <li>Item 3</li>


    <li>Item 4</li>


    <li>Item 5</li>


    <li>Item 6</li>


    <li>Item 7</li>


    </ul>


    ```


    * * *


    Conclusion


    Being able to manipulate the DOM is a fundamental skill for a web developer. By
    now, you should have a good understanding of how to insert list items into the
    DOM dynamically using JavaScript. In the next chapter, we''ll learn how to scramble
    these list items and set the stage for our drag-and-drop functionality. Stay tuned!


    Scramble List Items


    In this chapter, we''ll introduce the concept of scrambling the items in our sortable
    list. The aim is to challenge the user to rearrange the list into its original
    order. By doing this, we''ll provide a real-world application of the Drag & Drop
    API, as it demonstrates a practical use-case.


    * * *


    Understanding the Need for Scrambling


    Before we dive into the technicalities, let’s understand the need for scrambling.
    When we provide a list to users in a sorted order, and then task them with rearranging
    it after it''s been scrambled, we''re giving them a simple, yet effective exercise
    in sorting. This could be applied in real-world scenarios like sorting tasks,
    rearranging products in a list, or any other kind of ordering requirement.


    * * *


    Getting Started


    First, we''ll assume that we have a list of items, structured in an HTML format
    as follows:


    ```html


    <ul id="sortable-list">


    <li draggable="true">Item 1</li>


    <li draggable="true">Item 2</li>


    <li draggable="true">Item 3</li>


    <!--... and so on -->


    </ul>


    ```


    * * *


    JavaScript: Scrambling the List


    We''ll use a modern version of the Fisher-Yates (also known as the Knuth) shuffle
    algorithm. This algorithm ensures each permutation of the list is equally likely.


    ```javascript


    function scrambleList() {


    const ul = document.querySelector(''sortable-list'');


    const items = ul.getElementsByTagName(''li'');


    let itemsArr = Array.prototype.slice.call(items);


    itemsArr.sort(() => 0.5 - Math.random());


    itemsArr.forEach(item => {


    ul.appendChild(item);


    });


    }


    ```


    In this function:


    - We first select our unordered list by its ID.


    - We get all the list items from the unordered list.


    - We convert the HTML collection to an array, so we can use array methods on it.


    - We then use the `sort()` method to shuffle the list. The logic `0.5 - Math.random()`
    is a commonly used trick to randomize the sort.


    - Finally, we append each shuffled item back to the list.


    * * *


    Executing the Scramble


    Now, you''ll probably want to trigger the scramble at a specific point in your
    application. For demonstration purposes, we’ll just add a button which, when clicked,
    will scramble our list.


    ```html


    <button onclick="scrambleList()">Scramble Items</button>


    ```


    * * *


    Conclusion


    By introducing a scrambling feature, you''ve added an interactive layer to your
    sortable list application. This challenges the users, but also gives them a tangible
    goal: to restore order. In the next chapter, we''ll delve into the core styling
    of our application and set the visual stage for our drag and drop functionality.
    Remember, user experience is paramount, and the visual feedback we provide is
    crucial in guiding users through the sorting process.


    Core CSS


    CSS, or Cascading Style Sheets, is an essential tool for controlling the look
    and feel of your web applications. In this chapter, we''ll be diving into the
    core CSS that will give our Sortable List project a clean, professional appearance.
    Remember, good CSS not only makes your application visually appealing, but it
    can also enhance user experience.


    * * *


    1\. Resetting Default Styles:


    Before diving into the project-specific styles, it''s essential to ensure that
    we reset browser-default styles. This will give us a consistent baseline across
    different browsers.


    ```css


    * {


    margin: 0;


    padding: 0;


    box-sizing: border-box;


    }


    ```


    * * *


    2\. Setting up the Body & Main Wrapper:


    The `body` and main wrapper elements dictate the basic styling and positioning
    of our entire app.


    ```css


    body {


    font-family: ''Arial'', sans-serif;


    background-color: f4f4f4;


    color: 333;


    font-size: 16px;


    line-height: 1.6;


    }


    .wrapper {


    width: 80%;


    max-width: 1200px;


    margin: 40px auto;


    padding: 20px;


    background-color: fff;


    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);


    }


    ```


    * * *


    3\. Styling the Sortable List:


    For our sortable list, we''ll aim for a design that differentiates each list item
    while making it clear that they can be dragged and dropped.'
