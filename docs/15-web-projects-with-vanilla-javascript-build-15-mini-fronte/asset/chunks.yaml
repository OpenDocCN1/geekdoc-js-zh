    Drag & Drop Functionality


    Drag and Drop (DnD) functionality is a user interface pattern that allows users
    to directly manipulate elements on the screen, offering an intuitive way to rearrange
    elements, move data between containers, or even create elements by dragging a
    new object into a designated space. In the context of our Sortable List project,
    we''ll use this feature to rearrange list items by dragging them to their desired
    locations.


    * * *


    Basics of the HTML Drag and Drop API


    Before diving into the code, it''s crucial to understand the foundational concepts
    of the Drag and Drop API:


    - draggable attribute: This attribute is set on the element you wish to drag.
    Most HTML elements are not draggable by default, so you need to set `draggable="true"`
    on them.


    ```html


    <div draggable="true">This is a draggable element.</div>


    ```


    - Drag & Drop Events: These are the primary events that the DnD API provides,
    which give us control over the drag and drop lifecycle.


    - dragstart: Triggered when the user starts dragging an element.


    - drag: Triggered as the element is being dragged.


    - dragend: Triggered when the user releases the element.


    - dragenter: Triggered when a dragged element enters a drop target.


    - dragover: Triggered as the dragged element is over a drop target (many times).


    - dragleave: Triggered when a dragged element leaves a drop target.


    - drop: Triggered when the dragged element is dropped on a drop target.


    * * *


    Implementing Drag & Drop for our Sortable List


    1\. Setting Items as Draggable


    Every list item that you want to be draggable should have the `draggable` attribute
    set to `true`. Assuming you have a list like this:


    ```html


    <ul id="sortable-list">


    <li draggable="true">Item 1</li>


    <li draggable="true">Item 2</li>


    <!-- ... -->


    </ul>


    ```


    2\. Add Event Listeners


    Now, we''ll attach event listeners to handle the drag and drop operations.


    ```javascript


    const listItems = document.querySelectorAll(''sortable-list li'');


    listItems.forEach(item => {


    item.addEventListener(''dragstart'', handleDragStart);


    item.addEventListener(''dragover'', handleDragOver);


    item.addEventListener(''drop'', handleDrop);


    item.addEventListener(''dragleave'', handleDragLeave);


    });


    ```


    3\. Handling Drag Start


    When dragging starts, we''ll set some data on the event to recognize what''s being
    dragged.


    ```javascript


    function handleDragStart(e) {


    e.dataTransfer.setData(''text/plain'', e.target.id);


    setTimeout(() => {


    e.target.classList.add(''hidden'');


    }, 0);


    }


    ```


    The `hidden` class can be something simple that visually hides the item, like:


    ```css


    .hidden {


    display: none;


    }


    ```


    4\. Handling Drag Over


    By default, dropping is disabled on most elements. To allow a drop, we need to
    prevent the default handling of the event.


    ```javascript


    function handleDragOver(e) {


    e.preventDefault();


    e.target.classList.add(''over'');


    }


    ```


    The `over` class can be a styling indication for the placeholder where the element
    will be dropped.


    5\. Handling Drop


    This is where the magic happens! Here, we''ll rearrange our list based on where
    the item was dropped.


    ```javascript


    function handleDrop(e) {


    e.preventDefault();


    const draggedId = e.dataTransfer.getData(''text/plain'');


    const draggedItem = document.getElementById(draggedId);


    const dropTarget = e.target;


    // Insert the dragged item before the drop target


    dropTarget.parentNode.insertBefore(draggedItem, dropTarget);


    draggedItem.classList.remove(''hidden'');


    }


    ```


    6\. Handling Drag Leave


    When the draggable item leaves a potential drop target, we want to remove any
    indication that the drop target is active.


    ```javascript


    function handleDragLeave(e) {


    e.target.classList.remove(''over'');


    }


    ```


    * * *


    Conclusion


    The Drag and Drop API provides a powerful way to implement intuitive interactions
    in your web projects. With this API, we can create visually appealing interfaces
    where users can directly manipulate on-screen elements, making for a more dynamic
    and engaging user experience.


    Check Order


    After mastering the art of dragging and dropping items on our sortable list, the
    next vital step is to check the order of the items. This ensures that users receive
    feedback on their effort, thereby making the sortable list interactive and intuitive.


    In this chapter, we''ll focus on determining the correct order of the items after
    they''ve been sorted. We''ll walk through creating a function to validate the
    order, and then provide feedback to the user based on their sorting performance.


    * * *


    Prerequisites


    Before delving into the code, ensure that:


    - You have a working drag and drop functionality from the previous chapters.


    - You have a predetermined correct order for the list items to compare against.


    * * *


    Setting Up the Correct Order


    For the sake of our tutorial, let''s imagine our list represents the order of
    planets from the sun:


    ```javascript


    const correctOrder = [''Mercury'', ''Venus'', ''Earth'', ''Mars'', ''Jupiter'',
    ''Saturn'', ''Uranus'', ''Neptune''];


    ```


    * * *


    Checking the Order


    Once a user finishes sorting the list, we need to check the order against our
    `correctOrder` array.


    ```javascript


    function checkOrder() {


    const listItems = document.querySelectorAll(''li'');


    let isCorrect = true;


    listItems.forEach((item, index) => {


    if (item.textContent !== correctOrder[index]) {


    isCorrect = false;


    }


    });


    return isCorrect;


    }


    ```


    In this function:


    - We first select all the `li` elements.


    - We initialize a variable `isCorrect` to `true`.


    - We then loop through each list item and compare its text content with the correct
    order. If any do not match, we set `isCorrect` to `false`.


    * * *


    Providing Feedback


    Once we''ve determined whether the order is correct or not, it''s essential to
    provide feedback to the user.


    ```javascript


    function provideFeedback() {


    const isOrderCorrect = checkOrder();


    if (isOrderCorrect) {


    alert("Congratulations! You''ve sorted the list correctly.");


    } else {


    alert("Oops! That doesn''t seem right. Try again.");


    }


    }


    ```


    Now, we''ll call `provideFeedback` every time a list item is dropped.


    * * *


    Hooking Up the Feedback Function to Drag & Drop


