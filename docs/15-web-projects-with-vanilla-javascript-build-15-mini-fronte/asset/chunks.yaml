    Section 10:


    Project 9 - Expense Tracker | Array Methods & Local Storage


    Project Intro


    As we journey through the vast world of web development, we''ve seen how the amalgamation
    of HTML, CSS, and JavaScript can give life to a variety of dynamic applications.
    From form validation to creating interactive movie seat bookings, every project
    has added a new feather to your web development cap. In this project, we''ll delve
    into an essential tool that many individuals use daily - an Expense Tracker. By
    the end of this project, you''ll have built a dynamic application that not only
    tracks expenses and income but also persists data using local storage.


    * * *


    Project Overview


    In today''s digital age, where the proliferation of mobile applications has taken
    center stage, expense tracking applications have seen a massive rise in popularity.
    They help users monitor their spending habits, keep track of savings, and provide
    insights into their financial health. With the Expense Tracker project, we aim
    to equip you with the skills to build your own version of this handy tool.


    The primary objective of our Expense Tracker is:


    - To record and display transactions (both expenses and income).


    - To display the current balance, total income, and total expenditure.


    - To provide functionalities to add and delete transactions.


    - To store transaction data in the local storage, ensuring data persistence even
    after refreshing the page.


    * * *


    Why This Project?


    You might be wondering, why an Expense Tracker?


    1\. Practical Utility: The Expense Tracker is a practical tool that many users
    would find beneficial in their daily lives. Building applications that have real-world
    utility can be rewarding and motivating.


    2\. Complexity: This project strikes a balance between simplicity and complexity.
    It''s comprehensive enough to challenge you but not overwhelmingly intricate that
    it becomes a hurdle.


    3\. Diverse Skills Application: This project provides an excellent platform to
    apply various skills like manipulating the DOM, using high order array methods
    like `forEach`, `map`, `filter`, and `reduce`, and leveraging the local storage.


    * * *


    Technologies & Concepts Used


    - HTML & CSS: Foundation of our Expense Tracker''s frontend. You''ll be creating
    structured HTML templates and styling them to make the application visually appealing.


    - JavaScript: The brain behind the operation. JS will give life to the application,
    allowing users to interact with the Expense Tracker.


    - DOM Manipulation: You''ll extensively manipulate the DOM to display transactions,
    update balance, income, and expenses.


    - Array Methods: This project will make use of high order array methods, which
    are fundamental when working with lists of data in JS. Expect to use methods like
    `map` for processing and `filter` for displaying specific transactions.


    - Local Storage: One of the most exciting aspects of this project. You''ll ensure
    that data entered by the user persists even after the browser session ends.


    * * *


    Conclusion


    Brace yourself for an exhilarating journey as we navigate through the intricacies
    of building an Expense Tracker. By the end of this project, you''ll have a functional
    tool at your disposal and a bolstered understanding of how to build practical
    applications from scratch.


    Now, let''s dive into the HTML structure in the next chapter, setting the foundation
    for our Expense Tracker!


