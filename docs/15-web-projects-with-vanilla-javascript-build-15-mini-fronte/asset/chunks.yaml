  trans: "\n\n# 总结\n\nUI 在确保最终用户能够理解并欣赏我们项目的数组方法方面，UI 起到了至关重要的作用。通过建立一个简单且有效的界面，我们为随后将填充并操作该界面数据的逻辑\
    \ JavaScript 函数铺平了道路。\n\n在接下来的章节中，我们将深入探讨如何获取随机用户数据，并运用数组方法来实现我们之前通过操作按钮暗示的功能。请保持关注，继续编码！\n\
    \n# 生成随机用户 - 使用 Async/Await 进行 Fetch\n\n为项目生成随机用户至关重要，尤其是当你构建需要用户数据但又不想使用真实个人数据的应用程序时。在本章中，我们将使用\
    \ Random User Generator API 来获取随机用户数据。`Fetch API` 与 `Async/Await` 的结合使得获取这些数据的过程变得流畅且高效。\n\
    \n## 设置 API\n\n在深入代码之前，你需要熟悉我们将要使用的 API。Random User Generator 是一个免费的开源 API，它以\
    \ `JSON` 格式提供随机用户数据。数据可以包括姓名、照片、位置、电子邮件等信息。\n\nAPI 端点：`https://randomuser.me/api/`\n\
    \n## 开始使用 Fetch 和 Async/Await\n\n在开始使用 `Async/Await` 之前，让我们先了解 `Fetch API` 的基础知识。\n\
    \n`Fetch API` 提供了一个获取资源的接口。简单来说，它允许你与其他网站和服务器进行通信，这在我们想要检索或发送数据时至关重要。\n\n一个基础的\
    \ fetch 请求如下所示：\n\n```javascript\nfetch('https://randomuser.me/api/')\n.then(response\
    \ => response.json())\n.then(data => console.log(data));\n```\n\n然而，我们将利用 `async/await`\
    \ 来使代码更简洁且更易于理解。使用 `async/await` 后，我们的代码变为：\n\n```javascript\nasync function fetchUsers()\
    \ {\n  let response = await fetch('https://randomuser.me/api/');\n  let data =\
    \ await response.json();\n  console.log(data);\n}\nfetchUsers();\n```\n\n## 生成随机用户\n\
    \n为了获取多个用户，我们需要通过在 API 端点添加参数来指定想要的用户数量。\n\n例如，获取 5 个用户：`https://randomuser.me/api/?results=5`\n\
    \n让我们将其集成到我们的函数中：\n\n```javascript\nasync function fetchMultipleUsers(num) {\n\
    \  let response = await fetch(`https://randomuser.me/api/?results=${num}`);\n\
    \  let data = await response.json();\n  displayUsers(data.results); // 我们接下来将创建这个函数\n\
    }\nfetchMultipleUsers(5);\n```\n\n## 显示用户\n\n现在我们已经获取了用户，我们希望将他们显示在 HTML 中。在这个示例中，我们将创建一个简单的姓名列表。\n\
    \n```javascript\nfunction displayUsers(users) {\n  const usersContainer = document.getElementById('usersContainer');\n\
    \  users.forEach(user => {\n    const userElement = document.createElement('div');\n\
    \    userElement.innerHTML = `\n      <h2>${user.name.title} ${user.name.first}\
    \ ${user.name.last}</h2>\n      <img src=\"${user.picture.medium}\" alt=\"${user.name.first}\"\
    >\n      <p>Email: ${user.email}</p>\n      <p>Location: ${user.location.city},\
    \ ${user.location.state}</p>\n    `;\n    usersContainer.appendChild(userElement);\n\
    \  });\n}\n```\n\n请确保你的 HTML 中有一个 id 为 `usersContainer` 的元素：\n\n```html\n<div\
    \ id=\"usersContainer\"></div>\n```\n\n## 错误处理\n\n在与 API 交互时，优雅地处理错误至关重要。网络问题、API\
    \ 停机或请求限制都可能导致问题。使用 `async/await`，我们可以使用简单的 `try/catch` 块：\n\n```javascript\n\
    async function fetchMultipleUsers(num) {\n  try {\n    let response = await fetch(`https://randomuser.me/api/?results=${num}`);\n\
    \    if (!response.ok) {\n      throw new Error(`HTTP error! Status: ${response.status}`);\n\
    \    }\n    let data = await response.json();\n    displayUsers(data.results);\n\
    \  } catch (error) {\n    console.error('Fetch error: ' + error.message);\n  }\n\
    }\n```\n\n## 总结\n\n在本章中，我们学习了如何使用 Random User Generator API 生成随机用户数据，并将其与 `Fetch\
    \ API` 和 `Async/Await` 结合。当你想要为应用程序创建模拟数据（尤其是开发阶段）时，这种技术将非常有用。\n\n记住，如果你想探索更多功能或遇到任何问题，请始终参考\
    \ API 的文档。API 是强大的工具，掌握它们可以显著提升你的项目水平。\n\n# 输出用户 - forEach() 与 DOM 方法\n\n欢迎来到第\
    \ 28 章！在本章中，我们将深入探讨如何使用 `forEach()` 方法和 DOM 操作技术将用户列表输出到我们的网页上。我们将继续进行 DOM 数组方法项目，目标是获取随机用户列表并以用户友好的格式显示它们。\n\
    \n## 前提条件\n\n在开始本章之前，请确保你已具备：\n\n1. 对 JavaScript 及其 ES6 语法的基本理解。\n2. 熟悉文档对象模型\
    \ (DOM)。\n3. 完成了第 27 章，即使用 `Fetch` 和 `Async/Await` 生成随机用户列表。\n\n## 第一步：设置 HTML\
    \ 结构\n\n我们需要在 HTML 中设置一个区域来输出用户。让我们创建一个简单的 `div` 来承载用户：\n\n```html\n<div id=\"\
    users-output\"></div>\n```\n\n## 第二步：获取用户\n\n假设你在前一章中已经获取了用户，你应该已经拥有一个用户对象数组。为了简单起见，假设我们的数组如下所示：\n\
    \n```javascript\nconst users = [\n  {id: 1, name: 'John Doe', age: 32},\n  {id:\
    \ 2, name: 'Jane Smith', age: 28},\n  // ... 更多用户\n];\n```\n\n## 第三步：使用 forEach()\
    \ 和 DOM 方法输出用户\n\n现在，让我们使用 `forEach()` 方法遍历每个用户并显示他们：\n\n```javascript\nconst\
    \ outputDiv = document.getElementById('users-output');\nusers.forEach(user =>\
    \ {\n  // 为每个用户创建一个新的 div\n  const userDiv = document.createElement('div');\n\
    \  userDiv.className = 'user';\n  // 为用户创建 innerHTML 模板\n  userDiv.innerHTML =\
    \ `\n    <h3>${user.name}</h3>\n    <p>Age: ${user.age}</p>\n  `;\n  // 将用户 div\
    \ 添加到主输出 div 中\n  outputDiv.appendChild(userDiv);\n});\n```\n\n在上述代码中：\n\n1. 我们首先获取主输出\
    \ div 的引用。\n2. 使用 `forEach()` 遍历每个用户。\n3. 为每个用户创建一个新的 `div`。\n4. 然后我们将该 div 的\
    \ `innerHTML` 设置为一个显示用户姓名和年龄的模板。\n5. 最后，我们将这个用户 div 添加到主输出 div 中。\n\n## 第四步：美化用户样式\n\
    \n虽然本章主要关注 JavaScript，但添加一点 CSS 可以帮助我们更美观地呈现用户：\n\n```css\n.user {\n  border:\
    \ 1px solid ccc;\n  padding: 10px;\n  margin: 10px 0;\n  border-radius: 5px;\n\
    }\n```\n\n这将为每个用户提供一个带有间距的精美方框。\n\n## 总结\n\n在本章中，我们学习了如何将 `forEach()` 方法与 DOM\
    \ 方法结合使用，将用户输出到网页上。这是 Web 开发中的一个基本模式——获取数据然后将其显示给用户。\n\n在下一章中，我们将通过添加允许用户使用 `map()`\
    \ 方法使资金翻倍的功能来增强我们的项目。请保持关注！\n\n**注意：** 请记住，在真实场景中，用户数据将从 API 或数据库中获取。本示例中的硬编码\
    \ `users` 数组仅用于演示目的。此外，请始终确保处理 fetch 操作期间可能出现的任何错误或任何其他潜在问题，以提升用户体验。\n\n# 资金翻倍\
    \ - map()\n\n"
- fmt: "\n# JavaScript Array Methods Exploration\n\nIn this chapter, we will explore\
    \ one of the highly useful array methods in JavaScript - the `map()` function.\
    \ It's a part of the DOM array methods we're delving into in this project. As\
    \ the chapter title suggests, we'll be applying `map()` to double the money values\
    \ in our list. This practical exercise will give you a hands-on experience of\
    \ how the `map()` function operates and how you can leverage it in various web\
    \ projects.\n\n## What is map()?\n\nThe `map()` method is a higher-order function\
    \ that creates a new array populated with the results of calling a provided function\
    \ on every element in the calling array. Unlike `forEach()`, which doesn’t return\
    \ anything, `map()` returns a new array without mutating the original array.\n\
    \n### Basic Syntax\n\n```javascript\nconst newArray = array.map(function(currentValue,\
    \ index, arr), thisValue);\n```\n\n- `currentValue`: The current element being\
    \ processed in the array.\n- `index` (optional): The index of the current element\
    \ being processed.\n- `arr` (optional): The array on which `map` was called.\n\
    - `thisValue` (optional): Object to use as `this` when executing the function.\n\
    \n## Practical Application: Doubling Money\n\nImagine you have a list of users,\
    \ each with an account balance. Perhaps you're running a special promotion where\
    \ you're offering to double the balance of every user. Let's see how you can use\
    \ the `map()` function to achieve this.\n\n### Step 1: Creating our Original Array\n\
    \nFirst, let's create our initial array of users with their current balances:\n\
    \n```javascript\nconst users = [\n  { name: 'Alice', balance: 100 },\n  { name:\
    \ 'Bob', balance: 200 },\n  { name: 'Charlie', balance: 150 },\n  { name: 'David',\
    \ balance: 80 }\n];\n```\n\n### Step 2: Using map() to Double the Money\n\nTo\
    \ double the money for each user, we'll utilize the `map()` function. We'll target\
    \ the `balance` property and multiply it by 2:\n\n```javascript\nconst doubledBalances\
    \ = users.map(user => {\n  return {\n    ...user,\n    balance: user.balance *\
    \ 2\n  };\n});\n```\n\nIn the code snippet above, we're returning a new object\
    \ for each user. We spread out the original user properties using the spread operator\
    \ (`...user`) and then overwrite the `balance` property by multiplying its current\
    \ value by 2.\n\n### Step 3: Display the Results\n\nNow, let's display our results\
    \ to see the original balances and the doubled balances:\n\n```javascript\nconsole.log(\"\
    Original Balances:\", users);\nconsole.log(\"Doubled Balances:\", doubledBalances);\n\
    ```\n\n## Why use map()?\n\n1. **Immutability**: One of the biggest advantages\
    \ of `map()` is that it doesn't mutate the original array. This is in line with\
    \ functional programming principles, ensuring data remains unchanged, which can\
    \ help prevent unintended side-effects in your code.\n2. **Chainability**: Since\
    \ `map()` returns a new array, you can chain other array methods like `sort()`,\
    \ `filter()`, etc., making your code more concise and readable.\n3. **Flexibility**:\
    \ The provided function can be as simple or complex as needed, allowing for a\
    \ wide range of transformations on array elements.\n\n## Conclusion\n\nThe `map()`\
    \ function is a powerful tool in your JavaScript toolkit. It provides an easy,\
    \ efficient, and functional way to transform data in arrays. In this chapter,\
    \ we leveraged `map()` to double the money for each user in our array. However,\
    \ its applications are diverse, and as you progress through different web projects,\
    \ you'll find countless scenarios where `map()` will come in handy.\n\n# Sort\
    \ By Richest - sort()\n\nIn our journey through the realm of web development,\
    \ we've tackled various DOM Array methods, each with its unique powers. In this\
    \ chapter, we'll delve into the `sort()` method. It might seem like a simple tool\
    \ to arrange items, but with JavaScript, it becomes a versatile utility that can\
    \ be tailored for a wide range of use-cases. Our mission? To sort a list of users\
    \ by their wealth, showcasing those who have the most at the top.\n\n## Understanding\
    \ the sort() Method\n\nAt its core, the `sort()` method is used to arrange the\
    \ elements of an array based on some comparison criteria. By default, it sorts\
    \ elements as strings. So, `[10, 2, 22].sort()` would return `[10, 2, 22]`. This\
    \ might not be what you'd expect, but it's how JavaScript works by default.\n\n\
    But fear not, for the `sort()` method allows us to define our own comparison function,\
    \ granting us the power to customize how we want our elements to be sorted.\n\n\
    ## Syntax of sort()\n\n```javascript\narray.sort([compareFunction])\n```\n\nThe\
    \ `compareFunction` is optional, but crucial for our task. This function should\
    \ return:\n\n- A negative value if `a` should be sorted before `b`\n- A positive\
    \ value if `a` should be sorted after `b`\n- Zero if `a` and `b` are equal\n\n\
    ## Sorting Users by Wealth\n\nLet's imagine we have an array of user objects,\
    \ each with a `name` and a `wealth` property:\n\n```javascript\nconst users =\
    \ [\n  { name: 'John', wealth: 2300 },\n  { name: 'Sarah', wealth: 5800 },\n \
    \ { name: 'Mike', wealth: 4500 },\n];\n```\n\nTo sort these users by their wealth\
    \ in descending order (richest first), we'd utilize the `sort()` method as follows:\n\
    \n```javascript\nusers.sort((a, b) => b.wealth - a.wealth);\n```\n\nHere, `(a,\
    \ b)` are two consecutive elements in the `users` array. The subtraction results\
    \ in a positive or negative value, helping `sort()` decide the order.\n\n## Visualizing\
    \ the Sorting Mechanism\n\nConsider two users:\n- User A with a wealth of 5000\n\
    - User B with a wealth of 3000\n\nWhen sorting in descending order: `b.wealth\
    \ - a.wealth`:\n- For A and B: 3000 - 5000 = -2000 (a negative value, so A comes\
    \ before B)\n\nNow you can see how the users get sorted with the richest at the\
    \ top!\n\n## Displaying Sorted Users on the DOM\n\nOnce sorted, you might want\
    \ to display the users in the DOM. Using the techniques we learned from earlier\
    \ chapters, you can create and append elements to the DOM.\n\n```javascript\n\
    const userList = document.querySelector('.users-list');\nusers.forEach(user =>\
    \ {\n  const userElement = document.createElement('div');\n  userElement.className\
    \ = 'user';\n  userElement.innerHTML = `\n    <h3>${user.name}</h3>\n    <p>$${user.wealth.toLocaleString()}</p>\n\
    \  `;\n  userList.appendChild(userElement);\n});\n```\n\nIn the code above, we're\
    \ iterating through each user, creating a new DOM element for them, and appending\
    \ it to a `.users-list` container. The `toLocaleString()` method is a neat trick\
    \ to format numbers with commas (or appropriate locale symbols).\n\n## Conclusion\n\
    \nThe `sort()` method, though appearing simple, is an essential tool in your JavaScript\
    \ toolbox. With it, you've successfully sorted users by their wealth, enriching\
    \ the functionality of your web application. This method's true strength lies\
    \ in its flexibility—by defining our own comparison functions, we can sort arrays\
    \ in numerous, customized ways.\n\nRemember, web development isn't just about\
    \ knowing the tools; it's about understanding them and innovating with how you\
    \ use them. As you move forward, think about other exciting ways you can utilize\
    \ `sort()` in your projects!\n\n## Practice Exercise\n\nTry sorting the users\
    \ in ascending order of their wealth. How would you modify the compare function\
    \ to achieve this?\n\nIn the next chapter, we'll dive into the `filter()` method,\
    \ a powerful tool to refine our lists based on specific criteria. Stay tuned!\n\
    \n# Show Millionaires - filter()\n\nWelcome to Chapter 31, where we dive deep\
    \ into one of the most commonly used array methods in JavaScript: the `filter()`\
    \ method. Given our project's theme on DOM Array Methods, this chapter will specifically\
    \ focus on using `filter()` to display only the millionaires from a list of users.\
    \ We'll learn how to harness the power of `filter()` to create a subset of our\
    \ original data array and display it dynamically on our webpage.\n\n## What is\
    \ the filter() method?\n"
  raw: 'In this chapter, we will explore one of the highly useful array methods in
    JavaScript - the `map()` function. It''s a part of the DOM array methods we''re
    delving into in this project. As the chapter title suggests, we''ll be applying
    `map()` to double the money values in our list. This practical exercise will give
    you a hands-on experience of how the `map()` function operates and how you can
    leverage it in various web projects.


    * * *


    What is map()?


    The `map()` method is a higher-order function that creates a new array populated
    with the results of calling a provided function on every element in the calling
    array. Unlike `forEach()`, which doesn’t return anything, `map()` returns a new
    array without mutating the original array.


    Basic Syntax:


    ```javascript


    const newArray = array.map(function(currentValue, index, arr), thisValue);


    ```


    - `currentValue`: The current element being processed in the array.


    - `index` (optional): The index of the current element being processed.


    - `arr` (optional): The array on which map was called.


    - `thisValue` (optional): Object to use as `this` when executing the function.


    * * *


    Practical Application: Doubling Money


    Imagine you have a list of users, each with an account balance. Perhaps you''re
    running a special promotion where you''re offering to double the balance of every
    user. Let''s see how you can use the `map()` function to achieve this.


    Step 1: Creating our Original Array


    First, let''s create our initial array of users with their current balances:


    ```javascript


    const users = [


    { name: ''Alice'', balance: 100 },


    { name: ''Bob'', balance: 200 },


    { name: ''Charlie'', balance: 150 },


    { name: ''David'', balance: 80 }


    ];


    ```


    Step 2: Using map() to Double the Money


    To double the money for each user, we''ll utilize the `map()` function. We''ll
    target the `balance` property and multiply it by 2:


    ```javascript


    const doubledBalances = users.map(user => {


    return {


    ...user,


    balance: user.balance * 2


    };


    });


    ```


    In the code snippet above, we''re returning a new object for each user. We spread
    out the original user properties using the spread operator (`...user`) and then
    overwrite the balance property by multiplying its current value by 2.


    Step 3: Display the Results


    Now, let''s display our results to see the original balances and the doubled balances:


    ```javascript


    console.log("Original Balances:", users);


    console.log("Doubled Balances:", doubledBalances);


    ```


    * * *


    Why use map()?


    1\. Immutability: One of the biggest advantages of `map()` is that it doesn''t
    mutate the original array. This is in line with functional programming principles,
    ensuring data remains unchanged, which can help prevent unintended side-effects
    in your code.


    2\. Chainability: Since `map()` returns a new array, you can chain other array
    methods like `sort()`, `filter()`, etc., making your code more concise and readable.


    3\. Flexibility: The provided function can be as simple or complex as needed,
    allowing for a wide range of transformations on array elements.


    * * *


    Conclusion


    The `map()` function is a powerful tool in your JavaScript toolkit. It provides
    an easy, efficient, and functional way to transform data in arrays. In this chapter,
    we leveraged `map()` to double the money for each user in our array. However,
    its applications are diverse, and as you progress through different web projects,
    you''ll find countless scenarios where `map()` will come in handy.


    Sort By Richest - sort()


    In our journey through the realm of web development, we''ve tackled various DOM
    Array methods, each with its unique powers. In this chapter, we''ll delve into
    the `sort()` method. It might seem like a simple tool to arrange items, but with
    JavaScript, it becomes a versatile utility that can be tailored for a wide range
    of use-cases. Our mission? To sort a list of users by their wealth, showcasing
    those who have the most at the top.


    * * *


    Understanding the `sort()` Method


    At its core, the `sort()` method is used to arrange the elements of an array based
    on some comparison criteria. By default, it sorts elements as strings. So, `[10,
    2, 22].sort()` would return `[10, 2, 22]`. This might not be what you''d expect,
    but it''s how JavaScript works by default.


    But fear not, for the `sort()` method allows us to define our own comparison function,
    granting us the power to customize how we want our elements to be sorted.


    * * *


    Syntax of `sort()`


    ```javascript


    array.sort([compareFunction])


    ```


    The `compareFunction` is optional, but crucial for our task. This function should
    return:


    - A negative value if `a` should be sorted before `b`


    - A positive value if `a` should be sorted after `b`


    - Zero if `a` and `b` are equal


    * * *


    Sorting Users by Wealth


    Let''s imagine we have an array of user objects, each with a `name` and a `wealth`
    property:


    ```javascript


    const users = [


    { name: ''John'', wealth: 2300 },


    { name: ''Sarah'', wealth: 5800 },


    { name: ''Mike'', wealth: 4500 },


    ];


    ```


    To sort these users by their wealth in descending order (richest first), we''d
    utilize the `sort()` method as follows:


    ```javascript


    users.sort((a, b) => b.wealth - a.wealth);


    ```


    Here, `(a, b)` are two consecutive elements in the `users` array. The subtraction
    results in a positive or negative value, helping `sort()` decide the order.


    * * *


    Visualizing the Sorting Mechanism


    Consider two users:


    - User A with a wealth of 5000


    - User B with a wealth of 3000


    When sorting in descending order: `b.wealth - a.wealth`:


    - For A and B: 3000 - 5000 = -2000 (a negative value, so A comes before B)


    Now you can see how the users get sorted with the richest at the top!


    * * *


    Displaying Sorted Users on the DOM


    Once sorted, you might want to display the users in the DOM. Using the techniques
    we learned from earlier chapters, you can create and append elements to the DOM.


    ```javascript


    const userList = document.querySelector(''.users-list'');


    users.forEach(user => {


    const userElement = document.createElement(''div'');


    userElement.className = ''user'';


    userElement.innerHTML = `


    <h3>${user.name}</h3>


    <p>$${user.wealth.toLocaleString()}</p>


    `;


    userList.appendChild(userElement);


    });


    ```


    In the code above, we''re iterating through each user, creating a new DOM element
    for them, and appending it to a `.users-list` container. The `toLocaleString()`
    method is a neat trick to format numbers with commas (or appropriate locale symbols).


    * * *


    Conclusion


    The `sort()` method, though appearing simple, is an essential tool in your JavaScript
    toolbox. With it, you''ve successfully sorted users by their wealth, enriching
    the functionality of your web application. This method''s true strength lies in
    its flexibility—by defining our own comparison functions, we can sort arrays in
    numerous, customized ways.


    Remember, web development isn''t just about knowing the tools; it''s about understanding
    them and innovating with how you use them. As you move forward, think about other
    exciting ways you can utilize `sort()` in your projects!


    * * *


    Practice Exercise


    Try sorting the users in ascending order of their wealth. How would you modify
    the compare function to achieve this?


    * * *


    In the next chapter, we''ll dive into the `filter()` method, a powerful tool to
    refine our lists based on specific criteria. Stay tuned!


