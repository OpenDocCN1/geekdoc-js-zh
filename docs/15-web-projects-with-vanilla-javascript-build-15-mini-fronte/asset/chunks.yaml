    \n# 项目 CSS\n\n在本章中，我们将深入使用纯 CSS 来为电影座位预订应用设计样式。我们的目标是创建一个直观、引人入胜且美观的用户界面，使其与后续章节中开发的功能相得益彰。\n\
    \n## CSS 结构\n\n我们将把样式分为三个主要部分：\n\n1. 基础样式：在此设置应用的字体、颜色和整体布局等基础样式。\n2. 组件样式：包括按钮、座位选择和电影下拉菜单等特定组件的样式。\n\
    3. 工具样式：可能重复使用的通用工具样式。\n\n### 1. 基础样式\n\nHTML 主体和容器：\n\n"
