    First, let''s define the paddle''s properties. Place these at the top of your
    script, where you''ve set up the other game variables:


    ```javascript


    let paddleHeight = 10;


    let paddleWidth = 75;


    let paddleX = (canvas.width - paddleWidth) / 2;


    ```


    - `paddleHeight`: The thickness of the paddle.


    - `paddleWidth`: The length of the paddle.


    - `paddleX`: The starting x-coordinate of the paddle. This will place it centered
    at the bottom of the canvas.


    * * *


    3\. Drawing the Paddle


    Using the canvas context, we can draw the paddle:


    ```javascript


    function drawPaddle() {


    ctx.beginPath();


    ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);


    ctx.fillStyle = "0095DD";


    ctx.fill();


    ctx.closePath();


    }


    ```


    Every time we call `drawPaddle()`, it will render the paddle at its current `paddleX`
    position.


    * * *


    4\. Moving the Paddle


    We will allow the player to move the paddle using the left and right arrow keys.


    4.1\. Event Listeners


    Add event listeners to detect key presses:


    ```javascript


    document.addEventListener("keydown", keyDownHandler, false);


    document.addEventListener("keyup", keyUpHandler, false);


    ```


    4.2\. Handling Key Presses


    Now, we''ll create our handler functions. When the player presses a key down,
    `keyDownHandler` will fire. When they release it, `keyUpHandler` will execute:


    ```javascript


    let rightPressed = false;


    let leftPressed = false;


    function keyDownHandler(e) {


    if(e.key == "Right" || e.key == "ArrowRight") {


    rightPressed = true;


    }


    else if(e.key == "Left" || e.key == "ArrowLeft") {


    leftPressed = true;


    }


    }


    function keyUpHandler(e) {


    if(e.key == "Right" || e.key == "ArrowRight") {


    rightPressed = false;


    }


    else if(e.key == "Left" || e.key == "ArrowLeft") {


    leftPressed = false;


    }


    }


    ```


    * * *


    5\. Implementing Paddle Movement


    Within your game''s `draw` or main loop function, implement the paddle''s movement:


    ```javascript


    let paddleDX = 7;  // Paddle''s movement speed


    if(rightPressed) {


    paddleX += paddleDX;


    if (paddleX + paddleWidth > canvas.width){


    paddleX = canvas.width - paddleWidth;


    }


    }


    if(leftPressed) {


    paddleX -= paddleDX;


    if (paddleX < 0){


