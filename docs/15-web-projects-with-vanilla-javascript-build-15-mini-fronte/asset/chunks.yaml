    };


    ```


    In the code above, `dx` and `dy` represent the change in `x` and `y` position
    respectively. If `dx` is positive, the ball moves to the right. If `dy` is negative,
    the ball moves upwards.


    * * *


    Updating the Ball''s Position


    To move the ball, we need to update its position on every frame:


    ```javascript


    function moveBall() {


    ball.x += ball.dx;


    ball.y += ball.dy;


    }


    ```


