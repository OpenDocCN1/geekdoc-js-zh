  trans: "\n\n我们的卡片上有一个“查看食谱”按钮。点击后，我们希望获取关于该餐食的更详细信息。这需要用到 MealDB API 的另一个端点，该端点根据餐食\
    \ ID 检索详细信息。\n\n按 ID 获取餐食详情的端点：\n\n```\nhttps://www.themealdb.com/api/json/v1/1/lookup.php?i={meal-id}\n\
    ```\n\n用于获取并显示详情的函数可能如下所示：\n\n```javascript\nfunction fetchMealDetails(id) {\n\
    \  fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${id}`)\n    .then(response\
    \ => response.json())\n    .then(data => {\n      const meal = data.meals[0];\n\
    \      const detailsHTML = `\n        <h2>${meal.strMeal}</h2>\n        <img src=\"\
    ${meal.strMealThumb}\" alt=\"${meal.strMeal}\">\n        <p>${meal.strInstructions}</p>\n\
    \      `;\n      mealResults.innerHTML = detailsHTML;\n    });\n}\n```\n\n该函数使用提供的\
    \ ID 获取详细的餐食数据，然后将其渲染到 DOM 中。\n\n---\n\n## 结论\n\n至此，你应该已经拥有一个功能完整的餐食查找器，允许用户通过\
    \ MealDB API 搜索餐食。结果会动态显示，用户只需点击一下即可查看详细的食谱。请记住，API 提供了大量数据，可用于增强你的 Web 应用程序。关键在于理解\
    \ API 文档、合理构建 fetch 请求，并以用户友好的方式呈现数据。\n\n## 显示单餐页面\n\n欢迎回来！在上一章中，我们了解了如何根据用户查询获取并显示餐食。现在，我们将专注于如何在专用页面上显示所选餐食的详细信息。到本章结束时，你将拥有一个交互式页面，用户可以在其中点击餐食并查看其详细信息，包括食材和准备步骤。\n\
    \n---\n\n### 目标：\n\n- 使用 MealDB API 获取单餐的详细数据。\n- 显示餐食详情，包括图片、名称、类别、产地、食材和准备步骤。\n\
    \n---\n\n### 开始：\n\n为了显示单餐页面，我们将利用 `idMeal` 属性，该属性对每餐都是唯一的，可用于从 MealDB API 获取该餐食的详细信息。\n\
    \n---\n\n### 1. HTML 结构：\n\n首先，让我们设计单餐页面的布局。\n\n```html\n<div class=\"single-meal\"\
    >\n  <div class=\"single-meal-header\">\n    <img src=\"\" alt=\"餐食图片\" id=\"\
    meal-img\">\n    <h2 id=\"meal-name\"></h2>\n  </div>\n  <div class=\"single-meal-info\"\
    >\n    <p><strong>类别：</strong> <span id=\"meal-category\"></span></p>\n    <p><strong>产地：</strong>\
    \ <span id=\"meal-origin\"></span></p>\n  </div>\n  <div class=\"single-meal-ingredients\"\
    >\n    <h3>食材：</h3>\n    <ul id=\"ingredients-list\"></ul>\n  </div>\n  <div class=\"\
    single-meal-instructions\">\n    <h3>步骤：</h3>\n    <p id=\"meal-instructions\"\
    ></p>\n  </div>\n</div>\n```\n\n---\n\n### 2. CSS 样式：\n\n为了更好的呈现效果，为单餐显示添加一些 CSS。\n\
    \n```css\n.single-meal-header {\n  display: flex;\n  align-items: center;\n}\n\
    meal-img {\n  width: 150px;\n  height: 150px;\n  margin-right: 20px;\n  object-fit:\
    \ cover;\n  border-radius: 50%;\n}\n.single-meal-info {\n  margin-top: 20px;\n\
    }\n.single-meal-ingredients, .single-meal-instructions {\n  margin-top: 30px;\n\
    }\n```\n\n---\n\n### 3. JavaScript 功能：\n\n我们将使用 JavaScript 获取并显示单餐的详细信息。\n\n```javascript\n\
    function getSingleMealDetails(mealID) {\n  fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${mealID}`)\n\
    \    .then(response => response.json())\n    .then(data => {\n      const meal\
    \ = data.meals[0];\n      displayMealDetails(meal);\n    })\n    .catch(error\
    \ => console.error('获取单餐时出错：', error));\n}\n\nfunction displayMealDetails(meal)\
    \ {\n  // 清除之前的数据\n  document.getElementById('meal-img').src = meal.strMealThumb;\n\
    \  document.getElementById('meal-name').textContent = meal.strMeal;\n  document.getElementById('meal-category').textContent\
    \ = meal.strCategory;\n  document.getElementById('meal-origin').textContent =\
    \ meal.strArea;\n\n  // 列出食材\n  const ingredientsList = document.getElementById('ingredients-list');\n\
    \  ingredientsList.innerHTML = '';\n  for(let i = 1; i <= 20; i++) {\n    if(meal[`strIngredient${i}`])\
    \ {\n      const li = document.createElement('li');\n      li.textContent = `${meal[`strIngredient${i}`]}\
    \ - ${meal[`strMeasure${i}`]}`;\n      ingredientsList.appendChild(li);\n    }\n\
    \  }\n\n  // 显示步骤\n  document.getElementById('meal-instructions').textContent\
    \ = meal.strInstructions;\n}\n```\n\n---\n\n### 4. 事件处理：\n\n当用户点击列表中的餐食时，获取其详细信息：\n\
    \n```javascript\ndocument.body.addEventListener('click', (e) => {\n  if (e.target.classList.contains('meal-item'))\
    \ {\n    const mealID = e.target.getAttribute('data-mealid');\n    getSingleMealDetails(mealID);\n\
    \  }\n});\n```\n\n确保列表中显示的每个餐食都带有 `meal-item` 类和一个包含餐食唯一 ID 的 `data-mealid` 属性。\n\
    \n---\n\n### 总结：\n\n你已经成功创建了一个单餐页面，该页面获取餐食的详细信息并以用户友好的格式显示。现在，当用户对某个餐食的名称或图片感兴趣时，他们可以深入了解其食材和步骤。\n\
    \n在下一章中，我们将深入探讨如何显示随机餐食并为其设计样式。敬请期待！\n\n## 显示随机餐食与单餐 CSS\n\n欢迎回到项目 8：餐食查找器。在前几章中，我们介绍了如何从\
    \ MealDB API 获取餐食并以列表形式呈现。现在，我们将通过为单餐显示设计样式，并为随机呈现的餐食创建吸引人的视图，来进一步深入项目。\n\n---\n\
    \n### 为什么关注样式？\n\nUI（用户界面）是任何 Web 应用程序最关键的部分之一。它决定了用户如何与应用程序交互，并影响他们的整体体验。一个好的\
    \ UI 应该直观且视觉上吸引人。通过为我们的餐食提供引人入胜的设计，我们旨在为用户创造难忘的体验，这有望鼓励他们更频繁地使用我们的应用程序。\n\n---\n\
    \n### 显示随机餐食 CSS\n\n当我们显示随机餐食时，目标是使其成为屏幕的焦点，给予其应有的重视。\n\n**HTML 结构：**\n\n```html\n\
    <div class=\"random-meal\">\n  <img src=\"meal-image.jpg\" alt=\"餐食名称\" class=\"\
    random-meal-image\">\n  <div class=\"random-meal-details\">\n    <h2 class=\"\
    random-meal-title\">餐食名称</h2>\n    <p class=\"random-meal-description\">简短描述...</p>\n\
    \  </div>\n</div>\n```\n\n**CSS 样式：**\n\n```css\n.random-meal {\n  display: flex;\n\
    \  align-items: center;\n  margin: 20px 0;\n  border-radius: 8px;\n  overflow:\
    \ hidden;\n  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);\n}\n.random-meal-image\
    \ {\n  width: 150px;\n  height: 150px;\n  object-fit: cover;\n}\n.random-meal-details\
    \ {\n  flex: 1;\n  padding: 10px;\n}\n.random-meal-title {\n  font-size: 24px;\n\
    \  font-weight: bold;\n  margin-bottom: 10px;\n}\n.random-meal-description {\n\
    \  font-size: 16px;\n  color: 555;\n}\n```\n\n---\n\n### 单餐 CSS\n\n单餐显示将提供关于特定餐食的更多详细信息，从食材到准备步骤。\n\
    \n**HTML 结构：**\n\n```html\n<div class=\"single-meal\">\n  <img src=\"meal-image.jpg\"\
