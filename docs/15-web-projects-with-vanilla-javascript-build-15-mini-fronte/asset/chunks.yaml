    ```html


    <div class="video-container">


    <video id="videoPlayer" width="640" height="360" controls>


    <source src="path_to_your_video.mp4" type="video/mp4">


    Your browser does not support the video tag.


    </video>


    <div class="controls">


    <button id="playBtn">Play</button>


    <button id="pauseBtn">Pause</button>


    <button id="stopBtn">Stop</button>


    </div>


    </div>


    ```


    * * *


    Implementing Play, Pause & Stop functionalities:


    1\. Play Video:


    To play the video, we need to target our video element and call the `play()` method.


    ```javascript


    const video = document.getElementById(''videoPlayer'');


    document.getElementById(''playBtn'').addEventListener(''click'', function() {


    video.play();


    });


    ```


    2\. Pause Video:


    Pausing the video is just as simple. Target the video element and call the `pause()`
    method.


    ```javascript


    document.getElementById(''pauseBtn'').addEventListener(''click'', function() {


    video.pause();


    });


    ```


    3\. Stop Video:


    Stopping the video involves two steps:


    1\. Pause the video.


    2\. Reset the video''s current time to 0 (i.e., the beginning).


    ```javascript


    document.getElementById(''stopBtn'').addEventListener(''click'', function() {


    video.pause();


    video.currentTime = 0;


    });


    ```


    * * *


    Enhancing UX with Play/Pause Toggle:


    Often, video players combine the play and pause functionality into one button.
    Let''s create a toggle function for this:


    1\. Modify the HTML:


    ```html


    <button id="togglePlayPauseBtn">Play</button>


    ```


    2\. JavaScript:


    ```javascript


    const togglePlayPauseBtn = document.getElementById(''togglePlayPauseBtn'');


    togglePlayPauseBtn.addEventListener(''click'', function() {


    if (video.paused) {


    video.play();


    togglePlayPauseBtn.innerText = "Pause";


    } else {


    video.pause();


    togglePlayPauseBtn.innerText = "Play";


    }


    });


    ```


    * * *


    Wrapping Up:


    With the HTML5 Video API, implementing play, pause, and stop functionality becomes
    a walk in the park. The API offers a wide range of methods and properties that
    can help developers create robust and feature-rich video players.


    In the next chapter, we''ll dive into enhancing our video player''s user experience
    by adding a progress bar and a timestamp, allowing users to visually see the playback
    status and duration of the video.


    Remember, practice makes perfect! Don''t hesitate to play around with the code,
    try different functionalities, and make this video player truly your own. Happy
    coding!


    Video Progress Bar & Timestamp


    Welcome to Chapter 19! In this chapter, we’ll explore two critical elements of
    a custom video player – the progress bar and timestamp. Both of these enhance
    the user experience, allowing viewers to know the video''s progress and control
    playback.


    * * *


    1\. Understanding the Video API


    Before diving into the coding part, it’s essential to understand the HTML5 Video
    API a bit. The Video API offers properties like `currentTime` (current playback
    position, in seconds) and `duration` (total video duration, in seconds). These
    properties will be crucial for our progress bar and timestamp functionality.


    * * *


    2\. HTML Structure


    For our custom video player, let''s consider you already have the following basic
    HTML structure from the previous chapters:


    ```html


    <video id="video" width="750" controls>


    <source src="path_to_video.mp4" type="video/mp4">


    </video>


    <div id="video-controls">


    <div id="progress-bar">


    <div id="progress"></div>


    </div>


    <span id="timestamp">00:00 / 00:00</span>


    </div>


    ```


    Here, `progress-bar` is the container, and `progress` is the fill that''ll show
    video playback progress. The `timestamp` will display the current time and total
    video duration.


    * * *


    3\. CSS for Progress Bar


    Before adding functionality, ensure the progress bar looks right:


    ```css


    progress-bar {


    width: 90%;


    height: 5px;


    background: e0e0e0;


    margin: 10px auto;


    position: relative;


    }


    progress {


    height: 5px;


    background: 007BFF;


    width: 0;


    }


    ```


    * * *


    4\. JavaScript Functionality


    Now, let’s dive into the fun part – the JavaScript!


    a. Progress Bar


    We want the progress bar to fill up as the video plays:


    ```javascript


    const video = document.getElementById(''video'');


    const progressBar = document.getElementById(''progress-bar'');


    const progress = document.getElementById(''progress'');


    video.addEventListener(''timeupdate'', updateProgressBar);


    function updateProgressBar() {


    const percentage = (video.currentTime / video.duration) * 100;


    progress.style.width = `${percentage}%`;


    }


    ```


    b. Timestamp


    To update the timestamp:


    ```javascript


    const timestamp = document.getElementById(''timestamp'');


    video.addEventListener(''timeupdate'', updateTimestamp);


    function updateTimestamp() {


    const minutesCurrent = Math.floor(video.currentTime / 60);


    let secondsCurrent = Math.floor(video.currentTime % 60);


    if (secondsCurrent < 10) {


    secondsCurrent = ''0'' + secondsCurrent;


    }


    const minutesDuration = Math.floor(video.duration / 60);


    let secondsDuration = Math.floor(video.duration % 60);


    if (secondsDuration < 10) {


    secondsDuration = ''0'' + secondsDuration;


    }


    timestamp.textContent = `${minutesCurrent}:${secondsCurrent} / ${minutesDuration}:${secondsDuration}`;


    }


    ```


    * * *


    5\. Seeking Functionality


    Let''s add the ability for users to click on the progress bar to seek to different
    parts of the video:


    ```javascript


    progressBar.addEventListener(''click'', setVideoProgress);


    function setVideoProgress(e) {


    const clickPosition = e.offsetX;


    const width = progressBar.offsetWidth;


    const clickPercentage = (clickPosition / width);


    video.currentTime = clickPercentage * video.duration;


    }


    ```


    * * *


    6\. Recap


    By now, you have a functional progress bar that fills up as the video plays and
    a timestamp that updates in real-time. The user can also click on the progress
    bar to seek the video, enhancing user control and experience.


    Section 5:  Project 4 - Exchange Rate Calculator | Fetch & JSON Intro


    Project Intro


    Welcome to Project 4, the Exchange Rate Calculator! In this project, we will embark
    on a journey to create a utility tool that can be widely used in daily life. Whether
    you’re traveling, investing, or just curious about the world economy, an exchange
    rate calculator provides essential information about currency values in different
    countries.


    * * *


    Objective:


    By the end of this project, you will have built an interactive web application
    that retrieves real-time exchange rates for various currencies and performs calculations
    to convert amounts between these currencies. This will be done using pure vanilla
    JavaScript, giving you a hands-on experience with the Fetch API and JSON data
    manipulation.


    * * *


    Project Overview:


    Here''s a sneak peek into what we will be developing:


    1\. User Interface: A sleek and intuitive design with dropdowns for selecting
    currencies and an input for the amount to convert.


    2\. Real-time Data: We''ll fetch real-time exchange rates from a free API.


    3\. Conversion Logic: Convert input currency to the desired output currency and
    display the result.


    4\. Error Handling: Implement proper error checking and handling to ensure a seamless
    user experience.


    * * *


    Skills & Techniques to be Acquired:


    - Fetch API: Understand how to make asynchronous requests to retrieve real-time
    data.


    - JSON Data Handling: Work with JSON responses to extract, manipulate, and use
    data in our application.


    - Dynamic DOM Manipulation: Populate dropdowns with available currencies, display
    real-time conversion rates, and more.


    - Error Handling: Create user-friendly error messages for issues like network
    errors or invalid data.


    * * *


    Why This Project?


    The Exchange Rate Calculator will not just be another project in your portfolio;
    it showcases your ability to build practical real-world applications. It emphasizes:


    1\. Utility: Creating something that people can use in their daily lives.


    2\. Data Manipulation: Working with live data feeds and displaying them dynamically.'
