    Get Speech Voices


    In the world of web development, providing a holistic user experience involves
    not only what the user sees but also what they hear. The Web Speech API''s SpeechSynthesis
    interface offers the capability to vocalize text content. One of the key elements
    of this interface is the ability to select different voice options to suit the
    content''s needs. In this chapter, we''ll explore how to fetch and use the available
    voice options to enrich the Speech Text Reader project.


    * * *


    Understanding SpeechSynthesis


    Before diving into retrieving available voices, it''s essential to grasp the basics
    of `SpeechSynthesis`. It''s the primary interface for controlling text-to-speech
    on a web page. This interface possesses a method called `getVoices()`, which returns
    an array of `SpeechSynthesisVoice` objects representing all the voices available.


    * * *


    Fetching Available Voices


    1\. Initialize the Process: Before retrieving voices, we''ll need a reference
    to the SpeechSynthesis interface:


    ```javascript


    const synth = window.speechSynthesis;


    ```


    2\. Get and List Voices: With the initialized `synth` object, use the `getVoices()`
    method:


    ```javascript


    let voices = [];


    function populateVoiceList() {


    voices = synth.getVoices();


    // Code to display these voices will go here


    }


    ```


    Remember that the list of available voices might not be immediately available
    when the page loads. To handle this, we should listen to the `voiceschanged` event:


    ```javascript


    synth.onvoiceschanged = populateVoiceList;


    ```


    * * *


    Displaying the Voices in a Dropdown


    To let users choose a voice, it''s common practice to display them in a dropdown
    list:


    1\. HTML Structure:


    ```html


    <select id="voiceSelect"></select>


    ```


    2\. Populate the Dropdown:


    Back in the `populateVoiceList` function, you can now loop through the `voices`
    array and create an option for each voice:


    ```javascript


    const voiceSelect = document.getElementById(''voiceSelect'');


    voices.forEach(voice => {


    const option = document.createElement(''option'');


    option.textContent = `${voice.name} (${voice.lang})`;


    // Set necessary attributes


    option.setAttribute(''data-lang'', voice.lang);


    option.setAttribute(''data-name'', voice.name);


    voiceSelect.appendChild(option);


    });


    ```


    * * *


    Using a Selected Voice


    To actually use one of the voices, you''ll need to set it when you''re synthesizing
    speech:


    1\. Synthesize Speech:


    Let''s say you want to speak the following message:


    ```javascript


    const utterThis = new SpeechSynthesisUtterance(''Hello, how are you?'');


    ```


    2\. Set the Voice:


    Before you instruct `synth` to speak the message, set the selected voice:


    ```javascript


    const selectedVoiceName = voiceSelect.selectedOptions[0].getAttribute(''data-name'');


    utterThis.voice = voices.find(voice => voice.name === selectedVoiceName);


    ```


    3\. Speak!:


    Finally, use the `speak` method:


    ```javascript


    synth.speak(utterThis);


    ```


    * * *


    Conclusion


    Integrating dynamic voice selection into your Speech Text Reader enhances customization,
    catering to a global audience with varying linguistic preferences. With just a
    few lines of code, the Web Speech API''s SpeechSynthesis interface grants your
    web applications a powerful tool, breathing life into static text. As you progress,
    consider exploring other features like adjusting pitch, rate, and volume to further
    tailor the user''s auditory experience.


    Speech Buttons


    In this chapter, we''ll explore one of the core components of our Speech Text
    Reader project: the Speech Buttons. These buttons will serve as the trigger for
    our application to start converting the selected or entered text into audible
    speech. Harnessing the power of the Web Speech API, particularly the Speech Synthesis
    interface, we will give our application a voice.


    * * *


    Prerequisites


    Before diving into this chapter, ensure you''ve successfully set up the basic
    structure of the project as covered in the previous chapters.


    * * *


    Creating the Speech Buttons


    1\. HTML Structure:


    First, let''s lay out the basic structure for our buttons in our HTML:


    ```html


    <div id="buttons">


    <button id="start">Start Speaking</button>


    <button id="stop">Stop Speaking</button>


    </div>


    ```


    Here, we have two buttons:


    - `Start Speaking`: To initiate the speech.


    - `Stop Speaking`: To halt any ongoing speech.


    2\. Basic Styling:


    For our buttons to be visually appealing and user-friendly, let’s apply some CSS:


    ```css


    buttons {


    display: flex;


    justify-content: space-around;


    margin-top: 20px;


    }


    button {


    padding: 10px 20px;


    font-size: 16px;


    cursor: pointer;


    border: none;


    background-color: 3498db;


    color: fff;


    border-radius: 5px;


    }


    button:hover {


    background-color: 2980b9;


    }


    ```


    * * *


    JavaScript Implementation


    Now, let''s harness the power of the Web Speech API:


    1\. Selecting our Elements:


    Using JavaScript, we first need to select our button elements:


    ```javascript


    const startBtn = document.getElementById(''start'');


    const stopBtn = document.getElementById(''stop'');


    ```


    2\. Initializing Speech Synthesis:


    Next, we initialize our SpeechSynthesis object:


    ```javascript


    const synth = window.speechSynthesis;


    ```


    3\. Start Speaking Button:


    The Start Speaking button will take the provided text and convert it into speech.
    Let’s see how this is done:


    ```javascript


    startBtn.addEventListener(''click'', () => {


    if (synth.speaking) {


    console.error(''Speech synthesis is already speaking.'');


    return;


    }


    let textInput = document.getElementById(''text-input'').value;  // Assuming ''text-input''
    is the ID of the textarea or input where users type/paste their text


    if (textInput !== '''') {


    let utterance = new SpeechSynthesisUtterance(textInput);


    // Optional: Set voice, pitch, and rate here


    // utterance.voice = synth.getVoices()[0];


    // utterance.pitch = 1;


    // utterance.rate = 1;


    synth.speak(utterance);


    }


    });


    ```


    4\. Stop Speaking Button:


    The Stop Speaking button will halt any ongoing speech synthesis:


    ```javascript


    stopBtn.addEventListener(''click'', () => {


    if (synth.speaking) {


    synth.cancel();


    }


    });


    ```


    * * *


    Testing the Functionality


    Once you''ve added the above code snippets, you should test the application in
    a browser that supports the Web Speech API. Type or paste some text into your
    designated input area and click the "Start Speaking" button. You should hear the
    text being read aloud. Clicking the "Stop Speaking" button should immediately
    halt the speech.


