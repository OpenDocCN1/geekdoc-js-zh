    * * *


    Summary


    At this stage, our ''Meal Finder'' project now has a basic layout. With our structured
    HTML and base CSS styling, we have a clean and intuitive interface ready. In the
    next chapters, we will integrate the functionality to search for meals using the
    MealDB API, display the results in our app, and allow users to view detailed information
    about each meal.


    Search & Display Meals From API


    In this chapter, we will delve deep into the world of APIs, specifically focusing
    on the MealDB API. We''ll take a look at how to integrate it into our Meal Finder
    project, allowing users to search for meals and view the details. By the end of
    this chapter, you''ll have hands-on experience with fetching data from an API
    and rendering it dynamically to the DOM using vanilla JavaScript.


    * * *


    Understanding the MealDB API


    Before diving into the code, let''s familiarize ourselves with the MealDB API.
    This API provides recipe meal information and is free to use. You can search for
    meals, look up specific meals by their ID, and even fetch random meal suggestions.


    Endpoint for searching meals by name:


    ```


    https://www.themealdb.com/api/json/v1/1/search.php?s={meal-name}


    ```


    Replace `{meal-name}` with the meal you want to search for. The returned JSON
    will contain an array of meals that match the search.


    * * *


    Setting up the Search Functionality


    1\. HTML Structure


    We''ll need an input field for the user to type in their meal name and a button
    to trigger the search.


    ```html


    <input type="text" id="meal-search" placeholder="Search for meals...">


    <button id="search-btn">Search</button>


    <div id="meal-results"></div>


    ```


    2\. JavaScript - Fetching the Data


    To get the data from the API, we''ll use the Fetch API in JavaScript. We''ll attach
    an event listener to our search button to trigger the function.


    ```javascript


    const searchBtn = document.getElementById(''search-btn'');


    const mealSearch = document.getElementById(''meal-search'');


    const mealResults = document.getElementById(''meal-results'');


    searchBtn.addEventListener(''click'', fetchMeals);


    function fetchMeals() {


    const searchTerm = mealSearch.value.trim();


    fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${searchTerm}`)


    .then(response => response.json())


    .then(data => displayMeals(data.meals));


    }


    ```


    * * *


    Displaying the Results


    Once we get the meal data, we need to display it. We''ll do this by iterating
    over the array of meals and creating a card for each one.


    ```javascript


    function displayMeals(meals) {


    if(!meals) {


    mealResults.innerHTML = ''<p>No meals found. Try a different search!</p>'';


    return;


    }


    const mealsHTML = meals.map(meal => `


    <div class="meal-card">


    <img src="${meal.strMealThumb}" alt="${meal.strMeal}">


    <h3>${meal.strMeal}</h3>


    <button onclick="fetchMealDetails(${meal.idMeal})">View Recipe</button>


    </div>


    `).join('''');


    mealResults.innerHTML = mealsHTML;


    }


    ```


    This function checks if there are any meals in the returned array. If not, it
    shows a "No meals found" message. Otherwise, it maps over the meals array, generating
    HTML for each meal, and inserts it into the DOM.


    * * *


    Fetching Detailed Meal Information'
