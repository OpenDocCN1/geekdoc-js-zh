    ```javascript


    let balance = 0;


    let income = 0;


    let expense = 0;


    const balanceAmount = document.getElementById(''balance-amount'');


    const incomeAmount = document.getElementById(''income-amount'');


    const expenseAmount = document.getElementById(''expense-amount'');


    ```


    * * *


    ## 3. Calculation Function


    Now, let''s create a function that calculates the `balance`, `income`, and `expense`
    based on the transaction data.


    ```javascript


    function calculateTotals(transactions) {


    income = transactions


    .filter(transaction => transaction.amount > 0)


    .reduce((acc, transaction) => acc + transaction.amount, 0);


    expense = transactions


    .filter(transaction => transaction.amount < 0)


    .reduce((acc, transaction) => acc + transaction.amount, 0) * -1; // We multiply
    by -1 to get a positive number


    balance = income - expense;


    }


    ```


    Note: In the function above, we''re using array methods `filter()` and `reduce()`
    to calculate our `income`, `expense`, and `balance`.


    * * *


    ## 4. Displaying the Values


    With our calculations done, it''s time to display these values in our DOM.


    ```javascript


    function updateUI() {


    balanceAmount.textContent = `$${balance.toFixed(2)}`;


    incomeAmount.textContent = `$${income.toFixed(2)}`;


    expenseAmount.textContent = `$${expense.toFixed(2)}`;


    }


    ```


    * * *


    ## 5. Integrating with Local Storage


    Since our project involves local storage, we want to make sure that whenever a
    new transaction is added or removed, we recalculate our values and update the
    UI.


    ```javascript


    function updateLocalStorage() {


    localStorage.setItem(''transactions'', JSON.stringify(transactions));


    calculateTotals(transactions);


    updateUI();


    }


    ```


    * * *


    ## 6. Integrating with the Existing Transaction System


    Assuming we have a mechanism to add or remove transactions, we should call the
    `updateLocalStorage` function right after a transaction is added or removed.


    ```javascript


    function addTransaction(transaction) {


    transactions.push(transaction);


    updateLocalStorage();


    }


    function removeTransaction(id) {


    transactions = transactions.filter(transaction => transaction.id !== id);


    updateLocalStorage();


    }


    ```


    * * *


    ## Conclusion


    Our Expense Tracker now not only adds or removes transactions but also provides
    a clear overview of a user''s financial status by displaying the `balance`, `income`,
    and `expense` in real-time. By integrating with local storage, we ensure that
    our data remains persistent across sessions. This project demonstrates the power
    of Vanilla JavaScript in building dynamic applications without relying on any
    libraries or frameworks. As we progress, we will continue adding more functionalities
    to this project, making it a comprehensive tool for anyone wishing to track their
    expenses.


