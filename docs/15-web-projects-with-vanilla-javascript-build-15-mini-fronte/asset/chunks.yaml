    Get Initial Posts From API


    In our "Infinite Scroll Posts" project, the first step before implementing the
    infinite scroll feature is to fetch initial posts from an API. In this chapter,
    we will delve deep into how to get posts from an external API using the `Fetch`
    API and `Async/Await`. Before starting, make sure you have set up your project
    structure correctly as described in the previous chapters.


    * * *


    Why Fetch API with Async/Await?


    JavaScript''s Fetch API provides a simpler way of making network requests to the
    server. When combined with Async/Await, Fetch becomes even more powerful, allowing
    us to write asynchronous code that looks and behaves like synchronous code, making
    it easier to read and maintain.


    * * *


    Setting Up The API Endpoint


    For this tutorial, let''s use the `jsonplaceholder` free fake online REST API,
    which provides a set of posts that we can retrieve:


    API Endpoint: `https://jsonplaceholder.typicode.com/posts`


    * * *


    Writing the Fetch Function with Async/Await


    ```javascript


    async function getInitialPosts() {


    try {


    const response = await fetch(''https://jsonplaceholder.typicode.com/posts?_limit=5'');


    const data = await response.json();


    return data;


    } catch (error) {


    console.error("There was an error fetching the posts", error);


    }


    }


    ```


    * * *


    Understanding the Function


    - We declare the function `getInitialPosts` as `async`. This ensures that the
    function returns a promise.


    - Inside the function, we use a `try...catch` block to handle any potential errors.


    - We call the `fetch` function with the API endpoint. To ensure that we don''t
    get too many posts initially, we use a query parameter `_limit=5` to limit the
    number of posts to 5.


    - The `await` keyword is used to pause the execution of the function until the
    promise settles and returns its result. This makes our asynchronous code appear
    synchronous.


    - Once the data is fetched, we convert it to JSON using the `response.json()`
    method.


    - If everything goes smoothly, the function will return the fetched posts as a
    JSON array.


    * * *


    Displaying the Posts


    Once we''ve fetched the posts, we need to display them on our page. Let''s add
    another function to handle this.


    ```javascript


    function displayPosts(posts) {


    const postContainer = document.getElementById(''posts'');


    posts.forEach(post => {


    const postElement = document.createElement(''div'');


    postElement.classList.add(''post'');


    postElement.innerHTML = `


    <h2 class="post-title">${post.title}</h2>


    <p class="post-body">${post.body}</p>


    `;


    postContainer.appendChild(postElement);


    });


    }


    ```


    To use this function:


    ```javascript


    getInitialPosts().then(posts => {


    displayPosts(posts);


    });


    ```


