    Conclusion


    With the header and modal now styled, our project is starting to take shape. Styling
    plays a vital role in dictating the feel and atmosphere of an application, and
    by now, you should have a better understanding of how to achieve this using pure
    CSS.


    In the next chapter, we''ll delve into the JavaScript behind the Menu and Modal
    Toggle functionalities, bringing our project to life!


    Menu & Modal Toggle


    In this chapter, we''ll learn how to implement a toggle mechanism for our menu
    and modal using the Document Object Model (DOM) and Cascading Style Sheets (CSS).
    Toggles are frequently used in web design to show or hide content upon user interaction.
    They enhance user experience by providing a dynamic interface.


    * * *


    1\. The HTML Structure:


    Before diving into the JavaScript and CSS for our toggle, let''s set up the basic
    HTML structure:


    ```html


    <div id="menu-container">


    <button id="menu-button">Menu</button>


    <div id="menu-content" class="hidden">


    <ul>


    <li><a href="">Home</a></li>


    <li><a href="">About</a></li>


    <li><a href="">Services</a></li>


    </ul>


    </div>


    </div>


    <button id="open-modal-btn">Open Modal</button>


    <div id="myModal" class="modal hidden">


    <div class="modal-content">


    <span id="close-modal-btn" class="close">&times;</span>


    <p>Welcome to our website!</p>


    </div>


    </div>


    ```


    Note: We''ve added the class `hidden` to both the `menu-content` and `myModal`
    to hide them initially.


    * * *


    2\. Styling the Toggle:


    The `hidden` class is crucial as it will help in toggling the display of our menu
    and modal:


    ```css


    .hidden {


    display: none;


    }


    .menu {


    /* Add general styling for the menu here */


    }


    .modal {


    position: fixed;


    z-index: 1;


    left: 0;


    top: 0;


    width: 100%;


    height: 100%;


    background-color: rgba(0,0,0,0.4);


    }


    .modal-content {


    background-color: fefefe;


    margin: 15% auto;


    padding: 20px;


    border: 1px solid 888;


    width: 80%;


    }


    ```


    * * *


    3\. The JavaScript Toggle Mechanism:


    Using JavaScript, we can easily toggle the visibility of our menu and modal:


    ```javascript


    document.addEventListener(''DOMContentLoaded'', function() {


    const menuBtn = document.getElementById("menu-button");


    const modalBtn = document.getElementById("open-modal-btn");


    const closeModalBtn = document.getElementById("close-modal-btn");


    const menuContent = document.getElementById("menu-content");


    const myModal = document.getElementById("myModal");


    menuBtn.addEventListener("click", function() {


    toggleVisibility(menuContent);


    });


    modalBtn.addEventListener("click", function() {


    toggleVisibility(myModal);


    });


    closeModalBtn.addEventListener("click", function() {


    toggleVisibility(myModal);


    });


    function toggleVisibility(element) {


    if (element.classList.contains(''hidden'')) {


    element.classList.remove(''hidden'');


    } else {


    element.classList.add(''hidden'');


    }


    }


    });


    ```


    The above script listens for the `DOMContentLoaded` event, ensuring our JavaScript
    runs only after the entire HTML document has been completely loaded. We''ve defined
    a `toggleVisibility` function that toggles the visibility of an element by adding
    or removing the `hidden` class.


    * * *


    Conclusion:


    By the end of this chapter, you''ve learned how to use JavaScript and CSS in tandem
    to create a toggle mechanism for a menu and a modal. By integrating this knowledge
    into your web projects, you can create a more interactive and dynamic user interface.


    Section 8: Project 7 - Hangman Game | DOM, SVG, Events


    Project Intro


    Welcome to our seventh project - The Hangman Game! This classic word game not
    only tests your vocabulary but also provides a delightful user experience with
    the help of SVG for graphics, DOM for dynamic content manipulation, and JavaScript
    events to capture user inputs. By the end of this project, you''ll have a fully
    functional Hangman game that you can show off to your friends or even include
    in your web portfolio.


    * * *


    Objective of the Game:


    The aim of the Hangman game is straightforward. A word or phrase is chosen at
    random, and the player must guess the word letter by letter. For every wrong guess,
    a part of a "hangman" figure is drawn. The game ends when the figure is complete
    (indicating all guesses were wrong) or the word/phrase is entirely guessed correctly.


    * * *


    What You''ll Learn:


    - SVG (Scalable Vector Graphics): You’ll understand how to use SVG to draw and
    animate the hangman figure. SVGs are a powerful way to add vector-based graphics
    to your webpage, and they can be manipulated using CSS and JavaScript.


    - DOM Manipulation: As with our previous projects, the DOM plays a crucial role.
    You''ll be updating the display based on user guesses, revealing letters, showing
    notifications, and more.


    - JavaScript Events: User input is vital in the Hangman game. You''ll be harnessing
    keyboard events to capture user guesses, button click events for game controls,
    and more.


    - Game Logic: Behind every game lies a set of rules and logic. You''ll be setting
    up conditions to check player guesses, determine when the game is won or lost,
    and more.


    * * *


    Why The Hangman Game?'
