    \ seats and movie choice again; it will automatically show their previous selections.\n\
    \n### 2. Retrieve Data From Local Storage\n\nBefore we populate our UI, we must\
    \ first retrieve the saved data.\n\n```javascript\nconst selectedSeats = JSON.parse(localStorage.getItem('selectedSeats'));\n\
    const selectedMovieIndex = localStorage.getItem('selectedMovieIndex');\n```\n\n\
    In the code above:\n- We retrieve the `selectedSeats` from local storage and parse\
    \ them from string format to an array using `JSON.parse()`.\n- The `selectedMovieIndex`\
    \ is retrieved as is because it's stored as a string.\n\n### 3. Populate Movie\
    \ Selection\n\nTo populate the movie dropdown with the saved movie choice, we\
    \ use the retrieved `selectedMovieIndex`.\n\n```javascript\nconst movieSelect\
    \ = document.getElementById('movie');\n\nif (selectedMovieIndex !== null) {\n\
    \  movieSelect.selectedIndex = selectedMovieIndex;\n}\n```\n\nHere, we simply\
    \ set the `selectedIndex` property of our `movieSelect` dropdown to the retrieved\
    \ index, making sure it's not null.\n\n### 4. Populate Seats\n\nNow, let's populate\
    \ the seats based on the saved selections:\n\n```javascript\nconst seats = document.querySelectorAll('.seat:not(.occupied)');\n\
    \nif (selectedSeats !== null && selectedSeats.length > 0) {\n  seats.forEach((seat,\
    \ index) => {\n    if (selectedSeats.indexOf(index) > -1) {\n      seat.classList.add('selected');\n\
    \    }\n  });\n}\n```\n\nIn this code:\n- We first select all the seats that are\
    \ not occupied.\n- We then check if `selectedSeats` contains data and loop through\
    \ each seat.\n- If the seat's index is found in the `selectedSeats` array, we\
    \ add the `selected` class to that seat, visually marking it as selected.\n\n\
    ### 5. Update Count and Total Price\n\nRemember, our UI should also reflect the\
    \ correct count of selected seats and the total price. Let's make sure we handle\
    \ that too.\n\n```javascript\nfunction updateSelectedCountAndTotal() {\n  const\
    \ selectedSeats = document.querySelectorAll('.row .seat.selected');\n  const count\
    \ = selectedSeats.length;\n  const total = count * +movieSelect.value;\n  document.getElementById('count').innerText\
    \ = count;\n  document.getElementById('total').innerText = total;\n}\n// Call\
    \ this function after populating the seats\nupdateSelectedCountAndTotal();\n```\n\
    \n### 6. Final Thoughts\n\nIt's essential always to consider the user's experience\
    \ when developing applications. By populating the UI with saved data, we save\
    \ the user time and provide a sense of continuity, especially if they had to navigate\
    \ away from the page and then come back.\n\nIn the next section, we'll dive into\
    \ the custom video player and how to harness the power of the HTML5 Video API.\
    \ Stay tuned!\n\n# Section 4: Project 3 - Custom Video Player | HTML5 Video API\n\
    \n## Project Intro\n\nIn today's internet-driven world, video content is one of\
