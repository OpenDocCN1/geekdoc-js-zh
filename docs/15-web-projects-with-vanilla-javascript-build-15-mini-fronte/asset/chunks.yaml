    \n# 第 3 节：项目 2 - 电影座位预订 | DOM 与本地存储\n\n## 项目介绍\n\n欢迎来到项目 2，我们将深入探索文档对象模型（DOM）的强大功能以及本地存储\
    \ API 的奇妙之处。完成本项目后，你将构建一个功能完整的电影座位预订应用，为你的 Web 开发作品集增添一份亮眼的资产。\n\n## 概述\n\n想象一下，每次你想看电影时，只需加载自己的应用，选择电影，挑选心仪的座位，然后搞定！即使你不小心关闭了应用，它也能记住你的选择。听起来很棒，对吧？这正是我们将在本项目中构建的内容。\n\
    \n## 主要功能\n\n1. 动态电影选择：显示电影列表及其价格，允许用户选择一部电影。\n2. 交互式座位图：电影院的图形化表示，用户可以点击单个座位来选择或取消选择。\n\
    3. 座位预订：允许用户通过点击来预订心仪的座位。已预订的座位将使用不同的颜色或样式，以区别于可用座位。\n4. 价格计算：根据所选座位数量和所选电影的价格显示总价。\n\
    5. 本地存储功能：即使用户关闭浏览器，也能保存其电影和座位选择。当用户再次访问时，他们的选择仍然存在。\n\n## 你将学到什么\n\n- DOM 操作：学习如何实时与网页元素交互并修改它们，使你的\
    \ Web 应用具有交互性和动态性。\n- 事件处理：检测并响应用户操作，例如点击座位或选择电影。\n- 使用本地存储：将用户数据（如座位选择）存储在他们自己的计算机上，确保即使关闭浏览器后，他们的偏好设置仍被保留。\n\
    - 数据检索与显示：从本地存储中检索数据，并在用户再次访问页面时适当地显示出来。\n\n## 实际应用\n\n除了作为一个有趣的项目之外，理解这些概念对于构建交互式\
    \ Web 应用至关重要。\n\n- 电子商务网站使用类似技术处理购物车，确保你选择的商品在离开页面后仍保留在购物车中。\n- 许多网站上的表单会记住你离开又返回时输入的内容，从而提升用户体验。\n\
    \n通过在这里掌握这些概念，你将能够很好地应对 Web 开发中的实际挑战。\n\n## 前置要求\n\n在开始本项目之前，建议具备以下条件：\n\n1. 对\
    \ HTML、CSS 和 JavaScript 有基本了解。如果你是新手，请回顾我们的基础章节或课程。\n2. 熟悉 DOM 的基础知识，特别是如何选择和修改元素。\n\
    \n## 结论\n\n本项目是前端设计与使用纯前端技术实现类似后端功能的激动人心的结合。它不仅会增强你构建实际项目的信心，还将成为你作品集中的优秀补充，展示你在\
    \ DOM 操作和本地存储方面的能力。\n\n# 项目 HTML\n\n欢迎来到我们第二个项目的核心：电影座位预订应用。本项目将为你提供使用文档对象模型（DOM）和浏览器本地存储的实践经验。但在深入交互式\
    \ JavaScript 和 CSS 样式之前，我们需要先用 HTML 打好基础。一切从这里开始。\n\n### 1. 设置 HTML 文档\n\n首先，让我们搭建基本的\
    \ HTML 结构：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
    UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n  <title>电影座位预订</title>\n  <link rel=\"stylesheet\" href=\"styles.css\">\n\
    \  <script src=\"script.js\" defer></script>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\n该结构引用了外部样式表（`styles.css`）和外部 JavaScript 文件（`script.js`）。`defer` 属性确保我们的\
    \ JavaScript 在 HTML 文档完全加载后才会运行。\n\n### 2. 主容器\n\n在 body 内部，我们的主要内容将位于一个居中的容器中：\n\
    \n```html\n<div class=\"container\">\n  <!-- 内容将放在这里 -->\n</div>\n```\n\n### 3.\
    \ 添加标题和电影选择\n\n首先，为我们的电影院提供一个标题，然后是一个用于选择电影的下拉菜单：\n\n```html\n<h2>选择电影：</h2>\n\
    <select id=\"movie\">\n  <option value=\"10\">复仇者联盟 4：终局之战 ($10)</option>\n  <option\
    \ value=\"8\">小丑 ($8)</option>\n  <option value=\"12\">冰雪奇缘 2 ($12)</option>\n\
    \  <option value=\"9\">玩具总动员 4 ($9)</option>\n</select>\n```\n\n每个电影的 `value`\
    \ 属性代表其票价。\n\n### 4. 影院布局\n\n对于影院布局，我们将使用 `div` 元素来表示座位。未占用的座位是可点击的，允许用户选择它们。一旦选中，座位的状态将更新为已占用。\n\
    \n```html\n<div class=\"cinema\">\n  <!-- 我们将使用重复的 div 来表示单个座位 -->\n  <div class=\"\
    row\">\n    <div class=\"seat\"></div>\n    <div class=\"seat\"></div>\n    <!--\
    \ 根据需要添加更多座位 -->\n  </div>\n  <!-- 根据需要重复行 -->\n</div>\n```\n\n### 5. 信息显示\n\n\
    在影院布局下方，我们将提供一个区域来向用户显示信息：\n\n```html\n<div class=\"info\">\n  <p>总票数：<span id=\"\
    ticketCount\">0</span></p>\n  <p>总价：$<span id=\"totalPrice\">0</span></p>\n</div>\n\
    ```\n\n信息显示区域展示了票数和总价。\n\n### 6. 结论\n\n这为我们的电影座位预订应用奠定了基础。有了 HTML 结构，我们将在下一章深入\
