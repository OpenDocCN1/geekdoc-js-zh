    Creating & Animating The Pointer


    In this chapter, we will be focusing on an integral part of the Relaxer App: the
    pointer. The pointer serves as a visual cue to guide the user through their breathing
    exercises. It will rotate around the circumference of a circle, with its motion
    corresponding to the breathing instructions.


    * * *


    Prerequisites


    Before we begin, ensure you have the following set up:


    - Basic HTML structure for the Relaxer App


    - A large circle in the center of the page (from Chapter 70)


    * * *


    1\. Creating the Pointer with HTML & CSS


    HTML:


    Add a div for the pointer within the circle element:


    ```html


    <div class="circle">


    <div class="pointer"></div>


    </div>


    ```


    CSS:


    Style the pointer to appear as a small, prominent triangle that stands out against
    the circle:


    ```css


    .pointer {


    width: 0;


    height: 0;


    border-left: 10px solid transparent;


    border-right: 10px solid transparent;


    border-bottom: 20px solid 333;


    position: absolute;


    top: -10px;


    left: 50%;


    transform: translateX(-50%);


    }


    ```


    * * *


    2\. Basic Animation Setup


    To animate the pointer, we will be using CSS keyframes and the `transform` property.
    For simplicity, let''s set up an animation that rotates the pointer 360 degrees
    over a duration of 8 seconds (to mimic a full breath cycle).


    CSS:


    ```css


    @keyframes rotatePointer {


    0% {


    transform: rotate(0deg);


    }


    100% {


    transform: rotate(360deg);


    }


    }


    ```


    Apply the animation to the pointer:


    ```css


    .pointer {


    /* ...previous styles... */


    animation: rotatePointer 8s linear infinite;


    }


    ```


    * * *


    3\. Timing with `setTimeout`


    While the CSS animation gives us a continuous motion, we want the pointer to pause
    during specific moments to simulate the ''inhale'' and ''exhale'' periods. For
    this, we''ll employ JavaScript''s `setTimeout` method.


    JavaScript:


    First, grab the pointer element:


    ```javascript


    const pointer = document.querySelector(''.pointer'');


    ```


    Next, create a function to control the pointer''s animation:


    ```javascript


    function controlPointerAnimation() {


    // Pause the animation


    pointer.style.animationPlayState = ''paused'';


    // ''Inhale'' for 4 seconds


    setTimeout(() => {


    pointer.style.animationPlayState = ''running'';


    }, 4000);


    // ''Exhale'' for 4 seconds and then pause again


    setTimeout(() => {


    pointer.style.animationPlayState = ''paused'';


    }, 8000);


    }


    ```


    Invoke the function when the page loads:


    ```javascript


    controlPointerAnimation();


    ```


    For continuous cycles, you can use `setInterval` to run the `controlPointerAnimation`
    function every 8 seconds.


    ```javascript


    setInterval(controlPointerAnimation, 8000);


    ```


    * * *


    Conclusion


    The animated pointer now provides a clear visual cue for users, guiding them through
    the breathing exercise. By combining CSS animations with timed JavaScript functions,
    we''ve created a seamless user experience that''s both interactive and beneficial
    for relaxation.


    In the next chapter, we''ll delve into triggering the breathing animation with
    JavaScript, enhancing the relaxation experience further. Stay tuned!


    Breath Animation With JS Trigger


    Objective: In this chapter, we''ll walk through how to create a breathing relaxation
    app. The app will encourage users to follow a rhythmic breathing pattern, using
    a visual guide that expands and contracts. The animation will be achieved using
    CSS animations and triggered via JavaScript.


    * * *


    1\. Introduction


    Breathing exercises are often used to induce relaxation and reduce stress. Our
    goal is to create an animation that mimics the inhalation and exhalation process,
    guiding users to sync their breath with it.


    * * *


    2\. Setting Up the HTML Structure


    Let''s start by creating a basic structure for our animation:


    ```html


    <div class="app">


    <div class="circle">


    <div class="inner-circle"></div>


    </div>


    <p id="instruction">Breathe In</p>


    </div>


    ```


    Here, `.circle` represents the breath visual while `.inner-circle` mimics the
    lungs expanding and contracting.


    * * *


    3\. Styling Our Animation


    Next, let''s style our circles:


    ```css


    .app {


    display: flex;


    justify-content: center;


    align-items: center;


    height: 100vh;


    background-color: e0f7fa;


    }


    .circle {


    width: 100px;


    height: 100px;


    border-radius: 50%;


    background-color: 81d4fa;


    display: flex;


    justify-content: center;


    align-items: center;


    overflow: hidden;


    }


    .inner-circle {


    width: 50px;


    height: 50px;


    border-radius: 50%;


    background-color: 29b6f6;


    opacity: 0.7;


    }


    ```


    * * *


    4\. Creating the CSS Animation


    Let''s create two animations: one for breathing in, where the circle expands,
    and one for breathing out, where it contracts.


    ```css


    @keyframes breatheIn {


    0%, 100% {


    width: 50px;


    height: 50px;


    }


    50% {


    width: 100px;


    height: 100px;


    }


    }


    @keyframes breatheOut {


    0%, 100% {


    width: 100px;


    height: 100px;


    }


    50% {


    width: 50px;


    height: 50px;


    }


    }


    ```


    * * *


    5\. Adding JavaScript Trigger


    Now, let''s use JavaScript to trigger these animations:


    ```javascript


    const instruction = document.getElementById(''instruction'');


    const innerCircle = document.querySelector(''.inner-circle'');


    let isBreathingIn = true;


    const breatheFunction = () => {


    if (isBreathingIn) {


    instruction.innerText = ''Breathe Out'';


    innerCircle.style.animation = ''breatheIn 2s alternate 2'';


    } else {


    instruction.innerText = ''Breathe In'';


    innerCircle.style.animation = ''breatheOut 2s alternate 2'';


    }


    isBreathingIn = !isBreathingIn;


    };


    // Initial call


    breatheFunction();


    // Use setInterval to keep repeating


    setInterval(breatheFunction, 4000);


    ```'
