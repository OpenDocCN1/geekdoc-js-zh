    * * *


    Styling the UI:


    CSS Structure:


    1\. Main Container - This will be centered in the middle of the screen with some
    padding for aesthetics.


    2\. Header - We''ll give it a font-size enhancement, center-align the text, and
    add some margins for spacing.


    3\. Users List - Here, we will style it so each user and their wealth are displayed
    in neat rows with alternate light and dark backgrounds for better clarity.


    4\. Action Buttons - These will be styled to be easily recognizable, with hover
