  ```\n\n### 6. 响应式设计\n\n最后，确保我们的游戏在小屏幕上也能良好显示。\n\n\n\n\n```css\n@media screen and\
  \ (max-width: 768px) {\n  .hangman-board {\n    flex-direction: column;\n  }\n \
