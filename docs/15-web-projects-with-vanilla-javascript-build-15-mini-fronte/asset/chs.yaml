  \ 2rem;\n}\n```\n\n### 总结\n至此，我们的“餐食查找器”项目已具备基本布局。通过结构化的 HTML 和基础 CSS 样式，我们拥有了一个简洁直观的界面。在接下来的章节中，我们将集成使用\
  \ `MealDB API` 搜索餐食的功能，在应用中显示结果，并允许用户查看每道餐食的详细信息。\n\n# 从 API 搜索并显示餐食\n\n在本章中，我们将深入探讨\
  \ API 的世界，特别关注 `MealDB API`。我们将了解如何将其集成到我们的餐食查找器项目中，让用户能够搜索餐食并查看详细信息。到本章结束时，你将亲身体验如何从\
  \ API 获取数据，并使用原生 JavaScript 将其动态渲染到 DOM 中。\n\n## 理解 MealDB API\n在深入代码之前，让我们先熟悉一下\
  \ `MealDB API`。该 API 提供食谱餐食信息，并且免费使用。你可以搜索餐食、按 ID 查找特定餐食，甚至获取随机餐食推荐。\n\n按名称搜索餐食的端点：\n\
  `https://www.themealdb.com/api/json/v1/1/search.php?s={餐食名称}`\n\n将 `{餐食名称}` 替换为你想要搜索的餐食。返回的\
  \ `JSON` 将包含一个匹配搜索的餐食数组。\n\n## 设置搜索功能\n\n### 1. HTML 结构\n我们需要一个输入字段供用户输入餐食名称，以及一个触发搜索的按钮。\n\
  \n```html\n<input type=\"text\" id=\"meal-search\" placeholder=\"搜索餐食...\">\n<button\
  \ id=\"search-btn\">搜索</button>\n<div id=\"meal-results\"></div>\n```\n\n### 2.\
  \ JavaScript - 获取数据\n为了从 API 获取数据，我们将使用 JavaScript 中的 `Fetch API`。我们将为搜索按钮添加一个事件监听器来触发该函数。\n\
  \n```javascript\nconst searchBtn = document.getElementById('search-btn');\nconst\
  \ mealSearch = document.getElementById('meal-search');\nconst mealResults = document.getElementById('meal-results');\n\
  \nsearchBtn.addEventListener('click', fetchMeals);\n\nfunction fetchMeals() {\n\
  \    const searchTerm = mealSearch.value.trim();\n    fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${searchTerm}`)\n\
  \        .then(response => response.json())\n        .then(data => displayMeals(data.meals));\n\
  }\n```\n\n## 显示结果\n一旦我们获取到餐食数据，就需要将其显示出来。我们将通过遍历餐食数组并为每个餐食创建卡片来实现。\n\n```javascript\n\
  function displayMeals(meals) {\n    if(!meals) {\n        mealResults.innerHTML\
  \ = '<p>未找到餐食。请尝试其他搜索！</p>';\n        return;\n    }\n    const mealsHTML = meals.map(meal\
  \ => `\n        <div class=\"meal-card\">\n            <img src=\"${meal.strMealThumb}\"\
  \ alt=\"${meal.strMeal}\">\n            <h3>${meal.strMeal}</h3>\n            <button\
  \ onclick=\"fetchMealDetails(${meal.idMeal})\">查看食谱</button>\n        </div>\n \
  \   `).join('');\n    mealResults.innerHTML = mealsHTML;\n}\n```\n\n该函数检查返回的数组中是否有餐食。如果没有，则显示“未找到餐食”消息。否则，它会遍历\
  \ `meals` 数组，为每个餐食生成 HTML，并将其插入到 DOM 中。\n\n## 获取餐食详细信息\n\n\n\n\n\n我们的卡片上有一个“查看食谱”按钮。点击后，我们希望获取关于该餐食的更详细信息。这需要用到\
  \ MealDB API 的另一个端点，该端点根据餐食 ID 检索详细信息。\n\n按 ID 获取餐食详情的端点：\n\n```\nhttps://www.themealdb.com/api/json/v1/1/lookup.php?i={meal-id}\n\
  ```\n\n用于获取并显示详情的函数可能如下所示：\n\n```javascript\nfunction fetchMealDetails(id) {\n \
  \ fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${id}`)\n    .then(response\
  \ => response.json())\n    .then(data => {\n      const meal = data.meals[0];\n\
  \      const detailsHTML = `\n        <h2>${meal.strMeal}</h2>\n        <img src=\"\
  ${meal.strMealThumb}\" alt=\"${meal.strMeal}\">\n        <p>${meal.strInstructions}</p>\n\
  \      `;\n      mealResults.innerHTML = detailsHTML;\n    });\n}\n```\n\n该函数使用提供的\
  \ ID 获取详细的餐食数据，然后将其渲染到 DOM 中。\n\n---\n\n## 结论\n\n至此，你应该已经拥有一个功能完整的餐食查找器，允许用户通过 MealDB\
  \ API 搜索餐食。结果会动态显示，用户只需点击一下即可查看详细的食谱。请记住，API 提供了大量数据，可用于增强你的 Web 应用程序。关键在于理解 API\
  \ 文档、合理构建 fetch 请求，并以用户友好的方式呈现数据。\n\n## 显示单餐页面\n\n欢迎回来！在上一章中，我们了解了如何根据用户查询获取并显示餐食。现在，我们将专注于如何在专用页面上显示所选餐食的详细信息。到本章结束时，你将拥有一个交互式页面，用户可以在其中点击餐食并查看其详细信息，包括食材和准备步骤。\n\
  \n---\n\n### 目标：\n\n- 使用 MealDB API 获取单餐的详细数据。\n- 显示餐食详情，包括图片、名称、类别、产地、食材和准备步骤。\n\
  \n---\n\n### 开始：\n\n为了显示单餐页面，我们将利用 `idMeal` 属性，该属性对每餐都是唯一的，可用于从 MealDB API 获取该餐食的详细信息。\n\
  \n---\n\n### 1. HTML 结构：\n\n首先，让我们设计单餐页面的布局。\n\n```html\n<div class=\"single-meal\"\
  >\n  <div class=\"single-meal-header\">\n    <img src=\"\" alt=\"餐食图片\" id=\"meal-img\"\
  >\n    <h2 id=\"meal-name\"></h2>\n  </div>\n  <div class=\"single-meal-info\">\n\
  \    <p><strong>类别：</strong> <span id=\"meal-category\"></span></p>\n    <p><strong>产地：</strong>\
  \ <span id=\"meal-origin\"></span></p>\n  </div>\n  <div class=\"single-meal-ingredients\"\
  >\n    <h3>食材：</h3>\n    <ul id=\"ingredients-list\"></ul>\n  </div>\n  <div class=\"\
  single-meal-instructions\">\n    <h3>步骤：</h3>\n    <p id=\"meal-instructions\"></p>\n\
  \  </div>\n</div>\n```\n\n---\n\n### 2. CSS 样式：\n\n为了更好的呈现效果，为单餐显示添加一些 CSS。\n\n\
  ```css\n.single-meal-header {\n  display: flex;\n  align-items: center;\n}\nmeal-img\
  \ {\n  width: 150px;\n  height: 150px;\n  margin-right: 20px;\n  object-fit: cover;\n\
  \  border-radius: 50%;\n}\n.single-meal-info {\n  margin-top: 20px;\n}\n.single-meal-ingredients,\
  \ .single-meal-instructions {\n  margin-top: 30px;\n}\n```\n\n---\n\n### 3. JavaScript\
  \ 功能：\n\n我们将使用 JavaScript 获取并显示单餐的详细信息。\n\n```javascript\nfunction getSingleMealDetails(mealID)\
  \ {\n  fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${mealID}`)\n\
  \    .then(response => response.json())\n    .then(data => {\n      const meal =\
  \ data.meals[0];\n      displayMealDetails(meal);\n    })\n    .catch(error => console.error('获取单餐时出错：',\
  \ error));\n}\n\nfunction displayMealDetails(meal) {\n  // 清除之前的数据\n  document.getElementById('meal-img').src\
  \ = meal.strMealThumb;\n  document.getElementById('meal-name').textContent = meal.strMeal;\n\
  \  document.getElementById('meal-category').textContent = meal.strCategory;\n  document.getElementById('meal-origin').textContent\
  \ = meal.strArea;\n\n  // 列出食材\n  const ingredientsList = document.getElementById('ingredients-list');\n\
  \  ingredientsList.innerHTML = '';\n  for(let i = 1; i <= 20; i++) {\n    if(meal[`strIngredient${i}`])\
  \ {\n      const li = document.createElement('li');\n      li.textContent = `${meal[`strIngredient${i}`]}\
  \ - ${meal[`strMeasure${i}`]}`;\n      ingredientsList.appendChild(li);\n    }\n\
  \  }\n\n  // 显示步骤\n  document.getElementById('meal-instructions').textContent =\
  \ meal.strInstructions;\n}\n```\n\n---\n\n### 4. 事件处理：\n\n当用户点击列表中的餐食时，获取其详细信息：\n\
  \n```javascript\ndocument.body.addEventListener('click', (e) => {\n  if (e.target.classList.contains('meal-item'))\
  \ {\n    const mealID = e.target.getAttribute('data-mealid');\n    getSingleMealDetails(mealID);\n\
  \  }\n});\n```\n\n确保列表中显示的每个餐食都带有 `meal-item` 类和一个包含餐食唯一 ID 的 `data-mealid` 属性。\n\
  \n---\n\n### 总结：\n\n你已经成功创建了一个单餐页面，该页面获取餐食的详细信息并以用户友好的格式显示。现在，当用户对某个餐食的名称或图片感兴趣时，他们可以深入了解其食材和步骤。\n\
  \n在下一章中，我们将深入探讨如何显示随机餐食并为其设计样式。敬请期待！\n\n## 显示随机餐食与单餐 CSS\n\n欢迎回到项目 8：餐食查找器。在前几章中，我们介绍了如何从\
  \ MealDB API 获取餐食并以列表形式呈现。现在，我们将通过为单餐显示设计样式，并为随机呈现的餐食创建吸引人的视图，来进一步深入项目。\n\n---\n\
