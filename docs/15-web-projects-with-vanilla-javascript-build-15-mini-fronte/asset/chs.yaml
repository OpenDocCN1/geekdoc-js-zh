  该结构引用了外部样式表（`styles.css`）和外部 JavaScript 文件（`script.js`）。`defer` 属性确保我们的 JavaScript\
  \ 在 HTML 文档完全加载后才会运行。\n\n### 2. 主容器\n\n在 body 内部，我们的主要内容将位于一个居中的容器中：\n\n```html\n\
