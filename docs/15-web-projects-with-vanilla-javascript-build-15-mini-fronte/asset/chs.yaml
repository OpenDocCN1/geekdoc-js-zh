  \n---\n\n### 单餐 CSS\n\n单餐显示将提供关于特定餐食的更多详细信息，从食材到准备步骤。\n\n**HTML 结构：**\n\n```html\n\
  <div class=\"single-meal\">\n  <img src=\"meal-image.jpg\" alt=\"餐食名称\" class=\"\
  single-meal-image\">\n  <div class=\"single-meal-details\">\n    <h2 class=\"single-meal-title\"\
  >餐食名称</h2>\n    <ul class=\"ingredients-list\">\n      <li>食材 1</li>\n      <!--\
