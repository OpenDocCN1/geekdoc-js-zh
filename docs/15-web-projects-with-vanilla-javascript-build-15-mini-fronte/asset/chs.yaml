  \n我们的“费用追踪器”应用的样式设计强调清晰和用户友好。我们结合使用了布局、配色方案和响应式设计，以确保我们的应用在各种设备上都能良好运行和显示。在接下来的章节中，我们将深入探讨应用的功能，使用\
  \ JavaScript 让我们的费用追踪器活起来。\n\n## 显示交易项目\n\n在本章中，我们将专注于在费用追踪器项目中显示交易项目。这些交易项目代表用户记录在应用中的单个财务活动，无论是收入还是支出。我们将结合使用\
  \ HTML、CSS 和 JavaScript 来实现这一目标。让我们开始吧！\n\n* * *\n\n### 1. HTML 结构\n\n为了显示交易项目，我们需要在\
  \ HTML 中提供一个容器，每个交易都可以在其中列出。以下标记将满足我们的需求：\n\n```html\n<section class=\"transactions\"\
  >\n  <h2>交易历史</h2>\n  <ul id=\"transaction-list\">\n    <!-- 交易项目将使用 JavaScript\
  \ 添加到这里 -->\n  </ul>\n</section>\n```\n\n在这里，`transaction-list` 将使用 JavaScript 动态填充交易项目。\n\
  \n* * *\n\n### 2. CSS 样式\n\n为了使我们的交易列表在视觉上更具吸引力，让我们为其添加样式：\n\n```css\n.transactions\
  \ {\n  margin: 20px 0;\n  border: 1px solid e0e0e0;\n  padding: 10px;\n}\n\n.transactions\
  \ h2 {\n  text-align: center;\n  margin-bottom: 15px;\n}\n\ntransaction-list {\n\
  \  list-style-type: none;\n  padding: 0;\n}\n\ntransaction-list li {\n  display:\
  \ flex;\n  justify-content: space-between;\n  padding: 8px 0;\n  border-bottom:\
  \ 1px solid e0e0e0;\n}\n```\n\n* * *\n\n### 3. JavaScript 实现\n\n首先，在 JavaScript\
  \ 中选择交易列表：\n\n```javascript\nconst transactionList = document.getElementById('transaction-list');\n\
  ```\n\n假设你有一个名为 `transactions` 的交易对象数组（该数组将由用户输入或本地存储数据填充），我们将使用以下函数来显示它们：\n\n```javascript\n\
  function displayTransactions() {\n  // 清除列表中当前的所有交易项目\n  transactionList.innerHTML\
  \ = '';\n\n  // 遍历 transactions 数组并显示每个交易\n  transactions.forEach(transaction =>\
  \ {\n    const item = document.createElement('li');\n    item.innerHTML = `\n  \
  \    <span>${transaction.description}</span>\n      <span>${transaction.amount >\
  \ 0 ? '+' : '-'}$${Math.abs(transaction.amount)}</span>\n    `;\n    item.classList.add(transaction.amount\
  \ > 0 ? 'income' : 'expense');\n    transactionList.appendChild(item);\n  });\n\
  }\n```\n\n此函数首先清除列表中的当前交易。然后，对于 `transactions` 数组中的每个交易，它创建一个新的列表项（`li`）元素，设置其内部\
  \ HTML 以显示交易的描述和金额，根据交易是收入还是支出添加一个类，然后将该项追加到 `transaction-list` 中。\n\n* * *\n\n\
  ### 4. 收入和支出的额外 CSS\n\n使用颜色在视觉上区分收入和支出：\n\n```css\ntransaction-list .income {\n\
  \  color: green;\n}\n\ntransaction-list .expense {\n  color: red;\n}\n```\n\n* *\
  \ *\n\n### 5. 调用 `displayTransactions` 函数\n\n每当添加新交易或修改现有交易时，请确保调用 `displayTransactions()`\
  \ 函数。这将确保列表始终使用最新数据更新：\n\n```javascript\n// 添加新交易时的示例代码\nfunction addTransaction(transaction)\
  \ {\n  transactions.push(transaction);\n  displayTransactions();\n}\n```\n\n* *\
  \ *\n\n## 结论\n\n通过以上步骤，我们成功地在费用追踪器项目中实现了显示交易项目的功能。当用户添加或删除交易时，列表将动态更新，提供清晰简洁的财务活动概览。在后续章节中，我们将在此基础上添加更多功能，例如计算和显示余额、收入和支出。敬请期待！\n\
  \n## 显示余额、收入和支出\n\n在费用追踪器的核心功能中，最关键的功能之一是能够正确显示用户的余额、收入和支出。这使用户能够一目了然地了解其财务状况。在本章中，我们将深入探讨实现这一目标所需的\
  \ JavaScript 逻辑和 DOM 操作技术。\n\n* * *\n\n### 1. 准备工作\n\n在编写任何代码之前，必须准备好必要的 HTML 结构来容纳我们的余额、收入和支出。\n\
  \n**HTML 结构：**\n\n```html\n<div class=\"balance\">\n  <h3>你的余额</h3>\n  <h2 id=\"\
  balance-amount\">$0.00</h2>\n  <div class=\"income-expense\">\n    <div class=\"\
  plus\">\n      <h3>收入</h3>\n      <p id=\"income-amount\">$0.00</p>\n    </div>\n\
  \    <div class=\"minus\">\n      <h3>支出</h3>\n      <p id=\"expense-amount\">$0.00</p>\n\
  \    </div>\n  </div>\n</div>\n```\n\n* * *\n\n### 2. 初始化变量\n\n在我们的脚本中，让我们初始化所需的变量：\n\
  \n\n\n\n\n```javascript\n\nlet balance = 0;\n\nlet income = 0;\n\nlet expense =\
  \ 0;\n\nconst balanceAmount = document.getElementById('balance-amount');\n\nconst\
  \ incomeAmount = document.getElementById('income-amount');\n\nconst expenseAmount\
  \ = document.getElementById('expense-amount');\n\n```\n\n* * *\n\n## 3. 计算函数\n\n\
  现在，让我们创建一个函数，根据交易数据计算 `balance`（余额）、`income`（收入）和 `expense`（支出）。\n\n```javascript\n\
  \nfunction calculateTotals(transactions) {\n\nincome = transactions\n\n.filter(transaction\
  \ => transaction.amount > 0)\n\n.reduce((acc, transaction) => acc + transaction.amount,\
  \ 0);\n\nexpense = transactions\n\n.filter(transaction => transaction.amount < 0)\n\
  \n.reduce((acc, transaction) => acc + transaction.amount, 0) * -1; // 乘以 -1 得到正数\n\
  \nbalance = income - expense;\n\n}\n\n```\n\n注意：在上面的函数中，我们使用了数组方法 `filter()` 和 `reduce()`\
  \ 来计算 `income`（收入）、`expense`（支出）和 `balance`（余额）。\n\n* * *\n\n## 4. 显示数值\n\n计算完成后，是时候将这些值显示在\
  \ DOM 中了。\n\n```javascript\n\nfunction updateUI() {\n\nbalanceAmount.textContent\
  \ = `$${balance.toFixed(2)}`;\n\nincomeAmount.textContent = `$${income.toFixed(2)}`;\n\
  \nexpenseAmount.textContent = `$${expense.toFixed(2)}`;\n\n}\n\n```\n\n* * *\n\n\
  ## 5. 与本地存储集成\n\n由于我们的项目涉及本地存储，我们需要确保每当添加或删除新交易时，重新计算数值并更新 UI。\n\n```javascript\n\
  \nfunction updateLocalStorage() {\n\nlocalStorage.setItem('transactions', JSON.stringify(transactions));\n\
  \ncalculateTotals(transactions);\n\nupdateUI();\n\n}\n\n```\n\n* * *\n\n## 6. 与现有交易系统集成\n\
  \n假设我们有一个添加或删除交易的机制，我们应该在添加或删除交易后立即调用 `updateLocalStorage` 函数。\n\n```javascript\n\
  \nfunction addTransaction(transaction) {\n\ntransactions.push(transaction);\n\n\
  updateLocalStorage();\n\n}\n\nfunction removeTransaction(id) {\n\ntransactions =\
  \ transactions.filter(transaction => transaction.id !== id);\n\nupdateLocalStorage();\n\
  \n}\n\n```\n\n* * *\n\n## 结论\n\n我们的支出追踪器现在不仅能添加或删除交易，还能通过实时显示 `balance`（余额）、`income`（收入）和\
  \ `expense`（支出）来清晰展示用户的财务状况。通过与本地存储集成，我们确保数据在会话之间保持持久。该项目展示了原生 JavaScript 在构建动态应用方面的强大能力，无需依赖任何库或框架。随着我们的推进，我们将继续为该项目添加更多功能，使其成为任何希望追踪支出的人的综合工具。\n\
  \n* * *\n\n### 练习：\n\n1. 添加处理不同货币的功能。\n2. 增强 UI，在视觉上区分正余额和负余额。\n3. 扩展追踪器，对支出进行分类并以饼图形式呈现。\n\
  \n## 添加与删除交易\n\n在本章中，我们将学习如何在支出追踪器中添加和删除交易。我们将与 DOM 交互以捕获用户输入，并利用本地存储来持久化交易。让我们开始吧。\n\
  \n* * *\n\n### 1. HTML 结构\n\n在添加或删除交易之前，我们需要一个简单的 HTML 结构来捕获用户输入。为简洁起见，假设以下结构已就位：\n\
  \n```html\n\n<div id=\"transaction-form\">\n\n<input type=\"text\" id=\"transaction-name\"\
  \ placeholder=\"输入交易名称...\">\n\n<input type=\"number\" id=\"transaction-amount\"\
  \ placeholder=\"输入金额...\">\n\n<button id=\"add-transaction\">添加交易</button>\n\n</div>\n\
  \n<ul id=\"transaction-list\">\n\n<!-- 交易将动态添加到这里 -->\n\n</ul>\n\n```\n\n* * *\n\
  \n### 2. 捕获用户输入\n\n首先，我们需要捕获用户输入的内容。这可以通过 DOM 实现。\n\n```javascript\n\nconst transactionNameEl\
  \ = document.getElementById('transaction-name');\n\nconst transactionAmountEl =\
  \ document.getElementById('transaction-amount');\n\n```\n\n* * *\n\n### 3. 存储交易\n\
  \n我们将交易存储在一个数组中，然后保存到本地存储。\n\n```javascript\n\nlet transactions = [];\n\nfunction\
  \ addTransaction(e) {\n\ne.preventDefault();\n\nif (transactionNameEl.value.trim()\
  \ === '' || transactionAmountEl.value.trim() === '') {\n\nalert('请输入有效的交易名称和金额。');\n\
  \nreturn;\n\n}\n\nconst newTransaction = {\n\nid: generateID(),\n\nname: transactionNameEl.value,\n\
  \namount: parseFloat(transactionAmountEl.value)\n\n};\n\ntransactions.push(newTransaction);\n\
  \nupdateLocalStorage();\n\nupdateUI();\n\ntransactionNameEl.value = '';\n\ntransactionAmountEl.value\
  \ = '';\n\n}\n\nfunction generateID() {\n\nreturn Math.floor(Math.random() * 100000000);\n\
  \n}\n\n```\n\n* * *\n\n### 4. 显示交易\n\n添加交易后，我们需要将其显示给用户。\n\n```javascript\n\nfunction\
  \ updateUI() {\n\nconst transactionListEl = document.getElementById('transaction-list');\n\
  \ntransactionListEl.innerHTML = '';\n\ntransactions.forEach(transaction => {\n\n\
  const sign = transaction.amount < 0 ? '-' : '+';\n\nconst item = document.createElement('li');\n\
  \nitem.className = transaction.amount < 0 ? 'minus' : 'plus';\n\nitem.innerHTML\
  \ = `\n\n${transaction.name} <span>${sign}${Math.abs(transaction.amount)}</span>\n\
  \n<button class=\"delete-btn\" onclick=\"deleteTransaction(${transaction.id})\"\
  >x</button>\n\n`;\n\ntransactionListEl.appendChild(item);\n\n});\n\n}\n\n```\n\n\
  * * *\n\n### 5. 删除交易\n\n对于删除，我们可以利用分配给每个交易的唯一 ID。\n\n```javascript\n\nfunction deleteTransaction(id)\
  \ {\n\ntransactions = transactions.filter(transaction => transaction.id !== id);\n\
  \nupdateLocalStorage();\n\nupdateUI();\n\n}\n\n```\n\n* * *\n\n### 6. 持久化到本地存储\n\
  \n我们希望即使在页面重新加载后，交易仍然可用。为此，我们将利用本地存储。\n\n```javascript\n\nfunction updateLocalStorage()\
  \ {\n\nlocalStorage.setItem('transactions', JSON.stringify(transactions));\n\n}\n\
  \n// 初始从本地存储加载交易（如果可用）\n\nfunction initializeTransactions() {\n\nconst storedTransactions\
  \ = localStorage.getItem('transactions');\n\ntransactions = storedTransactions ?\
  \ JSON.parse(storedTransactions) : [];\n\nupdateUI();\n\n}\n\ninitializeTransactions();\n\
  \n```\n\n* * *\n\n### 7. 事件监听器\n\n最后，我们为添加按钮附加一个事件监听器：\n\n```javascript\n\ndocument.getElementById('add-transaction').addEventListener('click',\
  \ addTransaction);\n\n```\n\n瞧！有了这些功能，用户可以无缝地添加和删除交易。交易不仅会反映在 UI 中，还会存储在浏览器的本地存储中，确保即使用户刷新页面也不会丢失数据。\n\
  \n请记住，虽然上述代码片段为支出追踪器提供了坚实的基础，但您还可以加入各种增强功能和附加特性。一如既往，彻底测试每个功能可确保流畅的用户体验。\n\n## 持久化到本地存储\n\
  \n现代 Web 应用最常见的需求之一是在会话之间持久化数据，而无需将数据发送回服务器。这可以为用户提供无缝体验，因为设置、用户偏好甚至用户生成的内容等数据都可以保存，并在后续访问时加载。在我们的支出追踪器项目中，我们将利用\
  \ Web 存储 API（特别是本地存储）的强大功能来实现这一点。\n\n* * *\n\n### 什么是本地存储？\n\n本地存储是一种基于 Web 的存储解决方案，允许网站在\
  \ Web 浏览器中存储键值对，且没有过期时间。它非常适合保存用户特定数据，并且其存储容量远大于 Cookie。\n\n优点：\n\n- **持久性**：与会话存储不同，本地存储中的数据不会随会话过期。这意味着即使您关闭浏览器或标签页，数据在您返回时仍然存在。\n\
  \n\n\n\n\n- **容量**：根据浏览器的不同，最多可存储 5-10 MB 的数据，远超 Cookie 的存储能力。\n- **简洁性**：API 直观明了，提供了简单的\
  \ `set`、`get` 和 `remove` 方法。\n\n* * *\n\n## 在费用追踪器中实现本地存储\n\n### 存储交易记录：\n\n为了持久化保存我们的费用交易记录，每当添加新交易或删除现有交易时，都需要将其保存到本地存储中。\n\
  \n```javascript\n\n// 初始交易数组\n\nlet transactions = [];\n\nfunction updateLocalStorage()\
  \ {\n\nlocalStorage.setItem('transactions', JSON.stringify(transactions));\n\n}\n\
  \n```\n\n### 添加交易：\n\n当你向列表中添加新交易时：\n\n```javascript\n\nfunction addTransaction(transaction)\
  \ {\n\ntransactions.push(transaction);\n\nupdateLocalStorage();\n\n}\n\n```\n\n\
  这会将交易添加到 `transactions` 数组中，然后用新数组更新本地存储。\n\n### 删除交易：\n\n同样，删除时：\n\n```javascript\n\
  \nfunction deleteTransaction(id) {\n\ntransactions = transactions.filter(transaction\
  \ => transaction.id !== id);\n\nupdateLocalStorage();\n\n}\n\n```\n\n这里，我们过滤掉具有特定\
  \ ID 的交易，然后更新本地存储。\n\n### 从本地存储加载交易：\n\n当用户访问费用追踪器时，必须检查本地存储并加载已保存的交易。\n\n```javascript\n\
  \nfunction init() {\n\n// 检查本地存储中是否有已保存的交易\n\nconst savedTransactions = JSON.parse(localStorage.getItem('transactions'));\n\
  \nif (savedTransactions) {\n\ntransactions = savedTransactions;\n\n// 然后根据需要将这些交易渲染到\
  \ DOM 中\n\n}\n\n}\n\ninit();\n\n```\n\n* * *\n\n## 重要注意事项：\n\n- **JSON 解析与序列化**：本地存储只存储字符串。因此，在保存数组或对象时，需要先用\
  \ `JSON.stringify()` 将其序列化。在读取时，再用 `JSON.parse()` 将其解析回可用的格式。\n- **限制**：虽然 5-10\
  \ MB 的限制对许多应用来说已经足够，但仍需注意。如果应用可能存储大量数据，可能需要考虑其他方案或策略，例如 IndexedDB 或服务器端存储。\n- **安全性**：本地存储并非为敏感数据设计。由于它可以通过\
  \ JavaScript 访问，因此容易受到潜在的 XSS 攻击。务必确保对数据进行验证和清理。\n\n* * *\n\n## 结论：\n\n本地存储是 Web\
  \ 开发者工具箱中的强大工具，通过数据持久化提供了一种简单高效的方式来增强用户体验。在我们的费用追踪器应用中，它在会话之间架起了一座重要的桥梁，确保用户永远不会丢失交易记录。与所有工具一样，了解其局限性并谨慎使用至关重要。\n\
  \n# 第 11 节：项目 10 - 无限滚动帖子 | Fetch、Async/Await、CSS 加载器\n\n## 项目简介\n\n欢迎来到我们旅程中的第十个项目——“无限滚动帖子”。这个项目将是一次引人入胜的探索，涉及从\
  \ API 获取数据、利用异步 JavaScript 操作，并通过美观的 CSS 加载器动画提升用户体验。那么，闲话少叙，让我们来看看这个项目包含哪些内容。\n\
  \n* * *\n\n### 1. 概述\n\n在现代网络时代，用户体验至关重要。用户体验的一个方面是能够无中断地获取和显示内容。用户习惯于点击“下一页”进行分页的日子已经一去不复返了。现在，他们期望内容在滚动时自动加载，这通常被称为无限滚动。从\
  \ Twitter 和 Facebook 等社交媒体平台到新闻网站，这一功能在许多现代网站上都能看到。\n\n* * *\n\n### 2. 目标\n\n完成本项目后，你将能够：\n\
  \n- 理解无限滚动功能的基本原理和机制。\n- 使用 Fetch 和 Async/Await 从公共 API 获取数据。\n- 在用户向下滚动页面时无缝显示获取到的数据。\n\
  - 通过添加 CSS 加载器动画来指示数据获取过程，从而增强用户体验。\n\n* * *\n\n### 3. 技术与概念\n\n- **Fetch API**：我们将使用\
  \ Fetch API 来请求和接收数据。这个强大的 Web API 使得跨网络获取资源变得简单。\n- **Async/Await**：为了有效处理异步操作，我们将利用\
  \ JavaScript 中的 Async/Await。这将确保数据获取过程流畅，避免出现任何意外的竞态条件。\n- **CSS 加载器**：用户必须始终了解后台正在进行的操作。CSS\
  \ 加载器通过提供视觉提示来指示数据正在获取，从而满足这一需求。\n- **无限滚动机制**：我们将深入探讨自动加载内容背后的逻辑。通过检查用户的滚动位置和内容的高度，我们可以确定何时获取更多数据。\n\
  \n* * *\n\n### 4. 预期效果？\n\n以下是最终产品的概览：\n\n1. **初始加载**：当用户首次访问网站时，屏幕上会显示预设数量的帖子。\n\
  2. **滚动**：当用户向下滚动时，在接近底部之前，新帖子会自动开始加载，从而提升用户体验。\n3. **加载动画**：在获取新帖子时，底部会显示一个加载器，向用户指示内容正在加载。\n\
  4. **错误处理**：如果由于网络问题或 API 限制等原因无法获取数据，将适当通知用户。\n\n* * *\n\n### 5. 前置要求\n\n在开始本项目之前，建议你熟悉以下内容：\n\
  \n- 用于结构和样式的基本 HTML/CSS。\n- JavaScript 基础知识，尤其是 Promise。\n- 对 API 工作原理的基本了解。\n\n\
  * * *\n\n### 6. 开始前的话\n\n“无限滚动帖子”项目将考验你的技能，并提供创建当今 Web 应用中广泛使用的功能的实际经验。随着项目的推进，请记住，每一个挑战都是通往精通的垫脚石。保持好奇心，继续编码！\n\
  \n在接下来的章节中，我们将从 HTML 结构开始，使用 CSS 设计项目样式，然后深入探讨驱动无限滚动机制的 JavaScript 逻辑。系好安全带，让我们开始吧！\n\
  \n## 项目 HTML\n\n欢迎来到第 51 章，我们将深入探讨“无限滚动帖子”项目的 HTML 结构。这个项目特别令人兴奋，因为它结合了 Fetch API、异步函数和流畅的\
  \ CSS 动画。HTML 结构构成了 CSS 和 JavaScript 运行的基础，所以让我们确保打下坚实的基础！\n\n* * *\n\n### 1. 项目概述\n\
  \n在“无限滚动帖子”项目中，我们的目标是创建一个 Web 应用程序，用户可以在其中无限滚动浏览一系列帖子，就像许多社交媒体平台上的工作方式一样。当用户滚动到页面底部时，新帖子会从\
  \ API 获取并无缝显示。此外，CSS 加载器将向用户提示更多内容正在加载。\n\n* * *\n\n### 2. 设置文档\n\n每个 HTML 文档都从一个基本结构开始。让我们从那里开始：\n\
  \n```html\n\n<!DOCTYPE html>\n\n<html lang=\"en\">\n\n<head>\n\n<meta charset=\"\
  UTF-8\">\n\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n\n<title>无限滚动帖子</title>\n\n<link rel=\"stylesheet\" href=\"styles.css\">\n\n\
  </head>\n\n<body>\n\n<!-- 内容将放在这里 -->\n\n<script src=\"script.js\"></script>\n\n\
  </body>\n\n</html>\n\n```\n\n* * *\n\n### 3. 主要内容区域\n\n我们项目的核心内容是我们将获取并显示的帖子。让我们为这些帖子创建一个容器：\n\
  \n```html\n\n<div class=\"posts-container\">\n\n<!-- 各个帖子将追加到这里 -->\n\n</div>\n\n\
  ```\n\n* * *\n\n### 4. 加载器\n\n由于我们实现了无限滚动，我们需要一个加载器来告知用户正在获取新帖子：\n\n\n\n\n\n```html\n\
  \n<div class=\"loader\">\n  Loading...\n</div>\n\n```\n\n（注意：加载器的实际视觉效果将通过 CSS 控制。在我们的\
  \ JavaScript 中，我们将根据是否正在获取数据，以编程方式显示或隐藏此加载器。）\n\n* * *\n\n## 5. 错误消息\n\n如果获取帖子时出现问题，设置一个专门区域来显示错误消息是良好的用户体验：\n\
  \n```html\n<div class=\"error-message\">\n  <!-- 错误消息将插入此处 -->\n</div>\n```\n\n\
  * * *\n\n## 6. 添加元数据\n\n包含元标签以改善 SEO（搜索引擎优化），并确保在 Facebook 或 Twitter 等平台上分享时显示良好，是一种良好的实践：\n\
  \n```html\n<meta name=\"description\" content=\"无限滚动帖子：从我们的 API 中深入无尽的内容。\">\n<meta\
  \ property=\"og:title\" content=\"无限滚动帖子\">\n<meta property=\"og:description\" content=\"\
  体验从我们的 API 实时获取帖子的无限滚动魔力。\">\n<meta property=\"og:image\" content=\"path_to_thumbnail_image.jpg\"\
  >\n```\n\n将 `path_to_thumbnail_image.jpg` 替换为你选择的用于社交平台分享的缩略图路径。\n\n* * *\n\n##\
  \ 7. 结语\n\n我们在此处构建的 HTML 结构构成了无限滚动帖子项目的基础。虽然看起来简单，但请记住，当我们的 CSS 和 JavaScript 发挥作用时，魔法才会发生，使这个结构变得生动。\n\
  \n在接下来的章节中，我们将使用 CSS 为这个结构添加样式，然后使用 JavaScript 添加功能。敬请期待，看看我们简单的 HTML 如何转变为一个动态的无限滚动体验！\n\
  \n## 项目 CSS 与加载器动画\n\n欢迎来到第 59 章！在这里，我们将讨论无限滚动帖子项目的 CSS 设计以及加载器动画的创建。在本章结束时，你将拥有一个视觉上吸引人的布局和一个流畅的加载动画，这将增强用户体验，尤其是在获取新帖子时。\n\
  \n* * *\n\n### 第 1 节：基本 CSS 设置\n\n在深入探讨加载器动画的具体细节之前，让我们先确保设置好基本的 CSS 基础。\n\n```css\n\
  body {\n  font-family: 'Arial', sans-serif;\n  background-color: #f9f9f9;\n  color:\
  \ #333;\n  line-height: 1.6;\n}\n\n.container {\n  width: 80%;\n  margin: auto;\n\
  \  overflow: hidden;\n}\n\n.post {\n  border: 1px solid #ccc;\n  padding: 20px;\n\
  \  margin: 20px 0;\n  border-radius: 5px;\n  background-color: #fff;\n  box-shadow:\
  \ 2px 2px 12px rgba(0,0,0,0.1);\n}\n```\n\n在这个初始设置中：\n\n- 我们为整个 body 设置了通用字体、背景颜色、文本颜色和行高。\n\
  - `.container` 类使内容居中并保持整洁。\n- 各个 `.post` 部分通过微妙的边框、内边距、阴影和圆角清晰定义，呈现现代外观。\n\n* *\
  \ *\n\n### 第 2 节：设计加载器动画\n\n对于无限滚动，提供用户反馈非常重要。加载器动画是一个视觉指示器，表明正在获取帖子。\n\n#### 步骤\
  \ 1：基本加载器结构\n\n我们的加载器将是一个简单的旋转圆圈。首先在你打算放置加载器的位置添加以下 HTML 结构：\n\n```html\n<div class=\"\
  loader\"></div>\n```\n\n#### 步骤 2：为加载器添加样式\n\n现在，应用以下 CSS 来设计我们的加载器：\n\n```css\n\
  .loader {\n  border: 16px solid #f3f3f3; /* 浅灰色 */\n  border-top: 16px solid #3498db;\
  \ /* 蓝色 */\n  border-radius: 50%; /* 使其成为圆形 */\n  width: 120px;\n  height: 120px;\n\
  \  animation: spin 1s linear infinite;\n}\n```\n\n#### 步骤 3：创建旋转动画\n\n现在，神奇的部分来了。让我们创建\
  \ `spin` 动画：\n\n```css\n@keyframes spin {\n  0% { transform: rotate(0deg); }\n \
  \ 100% { transform: rotate(360deg); }\n}\n```\n\n通过这个关键帧动画，我们的加载器将持续旋转，为用户提供内容正在加载的视觉提示。\n\
  \n* * *\n\n### 第 3 节：定位加载器\n\n我们的加载器应居中放置在页面上，尤其是在获取帖子时。应用以下样式以确保其位置保持一致：\n\n```css\n\
  .loader {\n  position: fixed;\n  left: 50%;\n  top: 50%;\n  transform: translate(-50%,\
  \ -50%);\n  z-index: 1000;\n}\n```\n\n* * *\n\n### 第 4 节：显示和隐藏加载器\n\n使用 JavaScript，你可以轻松控制加载器的可见性。在获取帖子时，将其样式设置为\
  \ `display: block`，完成后设置为 `display: none`。\n\n```javascript\n// 假设你已经通过查询选择了加载器\n\
  const loader = document.querySelector('.loader');\n\n// 显示加载器\nloader.style.display\
  \ = 'block';\n\n// 隐藏加载器\nloader.style.display = 'none';\n```\n\n这样，我们的加载器只在获取过程中可见，确保用户不会受到不必要的干扰。\n\
  \n* * *\n\n## 结论\n\nCSS 在增强用户体验方面起着至关重要的作用，尤其是对于像无限滚动帖子项目这样的 Web 应用程序。通过视觉上吸引人的设计和流畅的加载器动画，我们让用户体验变得愉悦且直观。\n\
  \n在下一章中，我们将专注于获取初始帖子并用内容填充页面。这将是我们结合 CSS 设计与动态 JavaScript 功能真正发挥魔力的地方。敬请期待！\n\n\
  ## 从 API 获取初始帖子\n\n在我们的“无限滚动帖子”项目中，实现无限滚动功能之前的第一步是从 API 获取初始帖子。在本章中，我们将深入探讨如何使用\
  \ `Fetch` API 和 `Async/Await` 从外部 API 获取帖子。开始之前，请确保你已经按照前面章节的描述正确设置了项目结构。\n\n* *\
  \ *\n\n### 为什么使用带有 Async/Await 的 Fetch API？\n\nJavaScript 的 `Fetch` API 提供了一种更简单的方式向服务器发起网络请求。当与\
  \ `Async/Await` 结合使用时，`Fetch` 变得更加强大，允许我们编写看起来和行为都像同步代码的异步代码，使其更易于阅读和维护。\n\n* *\
  \ *\n\n### 设置 API 端点\n\n在本教程中，让我们使用 `jsonplaceholder` 免费的假在线 REST API，它提供了一组我们可以检索的帖子：\n\
  \nAPI 端点：`https://jsonplaceholder.typicode.com/posts`\n\n* * *\n\n### 使用 Async/Await\
  \ 编写 Fetch 函数\n\n```javascript\nasync function getInitialPosts() {\n  try {\n  \
  \  const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');\n\
  \    const data = await response.json();\n    return data;\n  } catch (error) {\n\
  \    console.error(\"获取帖子时出错\", error);\n  }\n}\n```\n\n* * *\n\n### 理解函数\n\n- 我们将函数\
  \ `getInitialPosts` 声明为 `async`。这确保该函数返回一个 promise。\n- 在函数内部，我们使用 `try...catch`\
  \ 块来处理任何潜在的错误。\n- 我们使用 API 端点调用 `fetch` 函数。为了确保初始不会获取太多帖子，我们使用查询参数 `_limit=5` 将帖子数量限制为\
  \ 5。\n- 使用 `await` 关键字暂停函数的执行，直到 promise 解决并返回其结果。这使得我们的异步代码看起来像同步代码。\n- 一旦数据被获取，我们使用\
  \ `response.json()` 方法将其转换为 JSON。\n- 如果一切顺利，该函数将返回获取的帖子作为 JSON 数组。\n\n* * *\n\n\
  ### 显示帖子\n\n一旦我们获取了帖子，就需要将它们显示在页面上。让我们添加另一个函数来处理这个任务。\n\n```javascript\nfunction\
  \ displayPosts(posts) {\n  const postContainer = document.getElementById('posts');\n\
  \  posts.forEach(post => {\n    const postElement = document.createElement('div');\n\
  \    postElement.classList.add('post');\n    postElement.innerHTML = `\n      <h2\
  \ class=\"post-title\">${post.title}</h2>\n      <p class=\"post-body\">${post.body}</p>\n\
  \    `;\n    postContainer.appendChild(postElement);\n  });\n}\n```\n\n要使用这个函数：\n\
  \n```javascript\ngetInitialPosts().then(posts => {\n  displayPosts(posts);\n});\n\
  ```\n\n* * *\n\n## 结论\n\n\n\n\n\n在本章中，我们介绍了如何使用 Fetch API 结合 Async/Await 从 API 端点获取初始帖子。我们还学习了如何将这些帖子显示在网页上。在下一章中，我们将添加无限滚动功能，当用户向下滚动页面时，该功能会加载更多帖子。\n\
  \n请记住，虽然 `jsonplaceholder` 非常适合学习和测试，但在实际应用中，你需要使用自己的后端或提供所需内容的第三方服务。始终确保优雅地处理错误，以提升用户体验。\n\
  \n## 添加无限滚动\n\n欢迎来到第 61 章！在这里，我们将实现现代网站上最受欢迎的功能之一：无限滚动。该技术通过用户滚动时持续加载内容来提升用户体验，无需分页按钮。为此，我们将利用\
  \ Fetch 和 Async/Await 的强大功能，并结合一些 CSS 魔法。让我们开始吧！\n\n* * *\n\n### 1. 理解无限滚动\n\n无限滚动是一种网页设计技术，当用户向下滚动页面时，内容会持续加载，无需分页。它广泛应用于社交媒体平台、博客和新闻网站，以提高用户参与度。原理很简单：当用户接近内容底部时，会获取并追加更多内容。\n\
  \n* * *\n\n### 2. 环境设置\n\n在实现无限滚动之前，请确保你具备：\n\n- 一个 API 或数据源，用于获取帖子或数据。\n- HTML\
  \ 中用于显示获取数据的容器。\n- 加载动画的基本样式（请参考第 59 章了解 CSS 和加载动画）。\n\n* * *\n\n### 3. 监听滚动事件\n\
  \n为了检测用户何时接近页面底部，我们将使用 `scroll` 事件。\n\n```javascript\nwindow.addEventListener('scroll',\
  \ () => {\n  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight\
  \ - 10) {\n    loadMorePosts();\n  }\n});\n```\n\n事件内部的条件检查视口高度与滚动偏移量之和是否大于或等于整个文档的高度减去一个小的阈值（此处为\
  \ 10 像素）。\n\n* * *\n\n### 4. 获取更多帖子\n\n`loadMorePosts` 函数将处理获取更多帖子的操作。\n\n```javascript\n\
  async function loadMorePosts() {\n  // 显示加载动画\n  showLoader();\n\n  // 延迟以模拟数据获取\n\
  \  await setTimeout(() => {}, 1000);\n\n  // 获取下一组帖子\n  const response = await fetch('YOUR_API_ENDPOINT_HERE');\n\
  \  const data = await response.json();\n\n  // 渲染获取到的帖子\n  displayPosts(data);\n\
  \n  // 隐藏加载动画\n  hideLoader();\n}\n```\n\n这里，`showLoader()` 和 `hideLoader()` 分别是显示和隐藏加载动画的函数。请务必将\
  \ `'YOUR_API_ENDPOINT_HERE'` 替换为你的实际 API 端点。\n\n* * *\n\n### 5. 追加帖子\n\n在 `displayPosts`\
  \ 函数中，遍历获取到的数据并将每个帖子追加到你的容器中。\n\n```javascript\nfunction displayPosts(posts) {\n\
  \  posts.forEach(post => {\n    const postElement = document.createElement('div');\n\
  \    postElement.classList.add('post');\n    postElement.innerHTML = `\n      <h2>${post.title}</h2>\n\
  \      <p>${post.body}</p>\n    `;\n    document.querySelector('.posts-container').appendChild(postElement);\n\
  \  });\n}\n```\n\n请确保你的 HTML 中有一个 `.posts-container` 或类似的元素来追加这些帖子。\n\n* * *\n\n\
  ### 6. 处理边界情况\n\n为了获得无缝的用户体验：\n\n- 处理没有更多内容可获取的情况，并相应通知用户。\n- 确保在获取过程中出现错误时，加载动画不会卡住。\n\
  - 根据内容结构和期望的用户体验调整阈值（本例中为 10 像素）。\n\n* * *\n\n### 结论\n\n无限滚动是一种强大的技术，可提高内容丰富网站的用户参与度。通过利用\
  \ Fetch 和 Async/Await 等现代 JavaScript 功能，我们可以轻松地在 Web 项目中实现此功能。始终记住处理边界情况并向用户提供反馈，以获得流畅的浏览体验。\n\
  \n**注意：** 本章假设你对 Fetch API、Async/Await 和 CSS 动画有基本了解。如果没有，请重新阅读前面的章节以深入理解。提供的代码是一个基本实现，可能需要根据你的项目和\
  \ API 的具体情况进行调整。\n\n## 过滤已获取的帖子\n\n欢迎回到“无限滚动帖子”项目。在已经获取帖子并实现无限滚动之后，我们的下一个目标是引入一个功能，允许用户过滤已获取的帖子。这将使用户能够快速找到特定帖子，从而提升用户体验。\n\
  \n**目标：** 实现一个过滤功能，允许用户根据标题和内容搜索已获取的帖子。\n\n* * *\n\n### 先决条件：\n\n1. 具备 JavaScript\
  \ 的工作知识，特别是 ES6+ 特性，如 Async/Await。\n2. 熟悉 DOM（文档对象模型）并使用 JavaScript 操作它。\n3. 本项目前面的章节，其中我们设置了帖子获取和无限滚动。\n\
  \n* * *\n\n### 步骤 1：设置过滤输入字段\n\n我们需要一个输入字段，用户可以在其中输入搜索查询：\n\n```html\n<input type=\"\
  text\" id=\"filter\" placeholder=\"过滤帖子...\">\n```\n\n* * *\n\n### 步骤 2：JavaScript\
  \ 实现\n\n#### a. 访问输入元素\n\n使用 DOM 访问输入元素：\n\n```javascript\nconst filterInput = document.getElementById('filter');\n\
  ```\n\n#### b. 事件监听器\n\n我们将为输入元素附加一个事件监听器，以检测用户何时输入：\n\n```javascript\nfilterInput.addEventListener('input',\
  \ filterPosts);\n```\n\n#### c. 过滤函数\n\n此函数是过滤功能的核心：\n\n```javascript\nfunction\
  \ filterPosts(e) {\n  const searchTerm = e.target.value.toUpperCase(); // 将输入转换为大写以实现不区分大小写的搜索\n\
  \  const posts = document.querySelectorAll('.post'); // 假设每个帖子都有一个 'post' 类\n\n\
  \  posts.forEach(post => {\n    const postTitle = post.querySelector('.post-title').innerText.toUpperCase();\n\
  \    const postContent = post.querySelector('.post-content').innerText.toUpperCase();\n\
  \n    // 检查搜索词是否存在于帖子标题或内容中\n    if (postTitle.indexOf(searchTerm) > -1 || postContent.indexOf(searchTerm)\
  \ > -1) {\n      post.style.display = 'block';\n    } else {\n      post.style.display\
  \ = 'none';\n    }\n  });\n}\n```\n\n**解释：**\n\n- 我们使用 `input` 事件，该事件在输入字段的 `value`\
  \ 每次更改时触发。\n- 在 `filterPosts` 函数中：\n  - 将搜索词转换为大写，以确保搜索不区分大小写。\n  - 我们选择所有帖子。在此示例中，我假设每个帖子都有一个\
  \ `'post'` 类。\n  - 对于每个帖子，我们检查搜索词是否存在于其标题或内容中。如果存在，则显示该帖子；否则隐藏它。\n\n* * *\n\n###\
  \ 步骤 3：增强功能\n\n#### a. 添加延迟\n\n即时过滤可能会让人感到突兀，尤其是在处理较大数据集时。考虑使用 `setTimeout` 添加延迟。\n\
  \n#### b. 旋转器或加载器\n\n如果过滤需要时间，显示旋转器可以提升用户体验。你可以重用前面章节中实现的 CSS 加载器。\n\n#### c. 高亮匹配文本\n\
  \n通过高亮帖子中匹配的文本来增强用户体验。这可以通过使用 `Regex` 和操作帖子元素的 `innerHTML` 属性来实现。\n\n* * *\n\n###\
  \ 结论\n\n过滤是一项强大的功能，可极大地提升用户体验，使用户能够快速高效地找到所需信息。通过上述实现，你的无限滚动帖子项目的用户现在可以轻松搜索帖子。\n\
  \n## 第 12 节：项目 11 - 语音文本阅读器 | 语音合成\n\n### 项目介绍\n\n\n\n\n\n随着数字领域的发展，我们与设备交互的方式也在迅速变化。虽然触摸和打字是主要的交互方式，但语音识别与合成正在技术世界中迅速崭露头角。机器理解并响应我们语音的能力不仅提供了便利，还弥合了残障用户的使用鸿沟。\n\
  \n在本项目中，我们将踏上一段开发“语音文本阅读器”应用的旅程。借助 `Web Speech API`，特别是 `Speech Synthesis` 接口，我们的应用将能够将文本输入转换为可听的语音。无论你是在考虑一款辅助视障用户的工具，还是一个能大声朗读睡前故事的应用，可能性都是无限的。\n\
  \n---\n\n## 目标\n\n完成本项目后，你将能够：\n\n1. 理解 `Web Speech API` 的基础知识及其在现代 Web 应用中的作用。\n\
  2. 实现 `Speech Synthesis` 接口，将文本数据转换为语音。\n3. 自定义语音选择、音调和语速。\n4. 设计一个用户友好的界面，便于文本输入和语音输出。\n\
  \n---\n\n## 为什么选择语音合成？\n\n语音合成，通常称为文本转语音（TTS），有着广泛的应用：\n\n- **无障碍性**：它帮助有视觉障碍、阅读障碍或其他导致屏幕阅读困难情况的用户。\n\
  - **多任务处理**：用户可以在进行其他活动（如开车或做饭）时收听内容。\n- **语言学习**：它为学习新语言的人提供发音指导。\n- **娱乐**：用于阅读故事或将书面内容转换为播客等应用。\n\
  \n---\n\n## 它是如何工作的？\n\n`Web Speech API` 提供了通往文本转语音引擎的桥梁，允许开发者从其 Web 应用中控制语音输出。通过\
  \ `Speech Synthesis` 接口，我们将有一系列选项来调整语音（男声、女声等）、音调、语速，甚至选择不同的语言。\n\n---\n\n## 项目范围\n\
  \n我们的语音文本阅读器将包含：\n\n- 一个简洁清晰的用户界面（UI），用于文本输入。\n- 选择不同语音的选项。\n- 用于调整音调和语速的滑块/控件。\n\
  - 一个播放按钮，用于启动语音合成。\n- 视觉反馈，指示文本正在被朗读。\n\n---\n\n## 后续章节内容预告\n\n随着我们逐步深入各章节，我们将：\n\
  \n1. 为我们的应用搭建 HTML 框架，重点关注用户界面。\n2. 深入 CSS，确保我们的应用不仅功能完善，而且美观悦目。\n3. 实现 JavaScript，这是魔法发生的地方，集成\
  \ `Web Speech API`，捕获用户输入并将其转换为语音。\n\n---\n\n## 前置要求\n\n虽然本项目面向有一定 HTML、CSS 和 JS\
  \ 经验的学习者，但设计上也力求对初学者友好。如果你对这些技术完全陌生，建议先回顾书中描述的入门章节或课程。\n\n---\n\n## 让我们开始吧！\n\n\
  兴奋吗？我们也是！将文本转换为语音的能力非常了不起，在本项目结束时，你将拥有一个功能完整的语音文本阅读器。那么，闲话少说，让我们直接开始吧！\n\n## HTML\
  \ 与输出语音框\n\n在项目 11 中，我们将涉足 Web 语音合成领域，让我们的 Web 应用能够“对用户说话”。`Speech Synthesis API`\
  \ 提供了 Web 应用与系统级语音合成软件之间的桥梁。本章将引导你为语音文本阅读器创建 HTML 结构，重点放在输出语音框上，这些框将成为我们阅读器的基础。\n\
  \n---\n\n### 1. 语音阅读器的结构\n\n对于我们的语音文本阅读器，我们将有一组预设的短语或句子，用户点击即可听到它们被朗读出来。每个短语都将包含在自己的框中，我们称之为“语音框”。\n\
  \n---\n\n### 2. 设置基础 HTML 结构\n\n让我们从搭建基础 HTML 结构开始。\n\n```html\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1.0\">\n<title>语音文本阅读器</title>\n<link rel=\"stylesheet\"\
  \ href=\"path_to_your_css\">\n</head>\n<body>\n<main id=\"main\">\n<h1>语音文本阅读器</h1>\n\
  <div class=\"speech-boxes\">\n<!-- 语音框将添加在这里 -->\n</div>\n</main>\n<script src=\"\
  path_to_your_js\"></script>\n</body>\n</html>\n```\n\n---\n\n### 3. 创建一个语音框\n\n\
  每个语音框将包含一个短语或句子，点击即可朗读。单个语音框的 HTML 结构如下所示：\n\n```html\n<div class=\"speech-box\"\
  \ data-text=\"Hello, world!\">\n<p>Hello, world!</p>\n</div>\n```\n\n`data-text`\
  \ 属性保存了将被朗读的文本。我们将使用 JavaScript 访问该属性，然后通过 `Speech Synthesis API` 朗读文本。\n\n---\n\
  \n### 4. 添加更多语音框\n\n在我们的示例中，让我们添加几个包含不同短语的框：\n\n```html\n<div class=\"speech-boxes\"\
  >\n<div class=\"speech-box\" data-text=\"Hello, world!\">\n<p>Hello, world!</p>\n\
  </div>\n<div class=\"speech-box\" data-text=\"How are you today?\">\n<p>How are\
  \ you today?</p>\n</div>\n<div class=\"speech-box\" data-text=\"It's a sunny day\
  \ outside.\">\n<p>It's a sunny day outside.</p>\n</div>\n</div>\n```\n\n每个语音框包含一个独特的短语。用户点击任意一个框，就能听到对应的文本。\n\
  \n---\n\n### 5. 提升用户体验\n\n为了提升用户体验，可以考虑添加一些视觉元素或图标，提示用户这些框是可点击的，并且会产生音频输出。例如，你可以在每个框内添加一个小喇叭或音频图标。\n\
  \n---\n\n### 总结\n\n本章介绍了语音文本阅读器应用所需的基本 HTML 结构。我们设计了语音框来容纳预设短语，用户点击即可听到它们被朗读。在接下来的章节中，我们将深入探讨\
  \ `Speech Synthesis API` 以及相应的 JavaScript，让我们的语音框活起来。\n\n语音框的视觉外观和整体布局可以通过 CSS 进行改进并实现交互，我们将在下一章中介绍。\n\
  \n## 项目 CSS\n\n欢迎来到语音文本阅读器项目的 CSS 样式部分！在完成 HTML 结构之后，我们现在需要增强其外观和感觉，使其既用户友好又吸引人。在本章中，我们将逐一介绍应用于语音文本阅读器的每个\
  \ CSS 属性和样式，使其生动起来。\n\n---\n\n### 1. 设置基础样式\n\n首先，让我们重置一些浏览器默认样式，并为项目建立基础。\n\n```css\n\
  * {\nmargin: 0;\npadding: 0;\nbox-sizing: border-box;\nfont-family: 'Arial', sans-serif;\n\
  }\n\nbody {\nbackground-color: #f4f4f4;\ncolor: #333;\nfont-size: 16px;\nline-height:\
  \ 1.5;\n}\n```\n\n---\n\n### 2. 主容器\n\n我们的主容器将把所有内容居中在屏幕上，并添加柔和的阴影以增加层次感。\n\n```css\n\
  .container {\nmax-width: 800px;\nmargin: 50px auto;\npadding: 20px;\nbackground:\
  \ #fff;\nbox-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n}\n```\n\n---\n\n### 3. 标题\n\n\
  标题样式将加粗、居中，并在底部留出更多间距，以与下方内容分隔。\n\n```css\nh1 {\ntext-align: center;\nfont-size:\
  \ 2em;\nmargin-bottom: 20px;\n}\n```\n\n---\n\n### 4. 语音框样式\n\n这些框将包含预定义的文本，我们的应用可以朗读这些文本。\n\
  \n\n\n\n\n```css\n.speech-box {\n  display: flex;\n  align-items: center;\n  justify-content:\
  \ space-between;\n  padding: 15px;\n  border: 1px solid ccc;\n  margin-bottom: 10px;\n\
  \  cursor: pointer;\n  transition: background 0.3s ease;\n}\n\n.speech-box:hover\
  \ {\n  background: f9f9f9;\n}\n```\n\n* * *\n\n## 5. 自定义文本框\n\n用户可以在此处输入自定义文本，供应用程序朗读。\n\
  \n```css\n.custom-text {\n  margin-top: 20px;\n}\n\n.custom-text textarea {\n  width:\
  \ 100%;\n  padding: 10px;\n  border: 1px solid ccc;\n  height: 100px;\n  resize:\
  \ none;\n}\n```\n\n* * *\n\n## 6. 按钮\n\n我们的按钮将启动语音功能。我们希望它们易于识别和点击。\n\n```css\n\
  .btn {\n  display: inline-block;\n  background: 007BFF;\n  color: fff;\n  padding:\
  \ 10px 20px;\n  margin-top: 20px;\n  border: none;\n  cursor: pointer;\n  transition:\
  \ background 0.3s ease;\n}\n\n.btn:hover {\n  background: 0056b3;\n}\n\n.btn:disabled\
  \ {\n  background: ccc;\n  cursor: not-allowed;\n}\n```\n\n* * *\n\n## 7. 语音选择下拉菜单\n\
  \n此下拉菜单允许用户选择不同的语音选项。\n\n```css\n.voice-selection {\n  margin-top: 20px;\n}\n\n\
  .voice-selection select {\n  width: 100%;\n  padding: 10px;\n  border: 1px solid\
  \ ccc;\n}\n```\n\n* * *\n\n## 结论\n\n通过设置这些样式，我们的语音文本阅读器应该看起来精致且用户友好。这些样式增强了应用程序的可用性，并为用户创造了愉快的体验。在下一章中，我们将深入\
  \ JavaScript，集成 Web Speech API，让用户能够将文本转换为语音。\n\n# 获取语音\n\n在 Web 开发领域，提供全面的用户体验不仅涉及用户看到的内容，还涉及他们听到的内容。Web\
  \ Speech API 的 `SpeechSynthesis` 接口提供了将文本内容语音化的能力。该接口的关键要素之一是能够选择不同的语音选项以满足内容需求。在本章中，我们将探讨如何获取并使用可用的语音选项来丰富语音文本阅读器项目。\n\
  \n* * *\n\n## 理解 SpeechSynthesis\n\n在深入获取可用语音之前，有必要掌握 `SpeechSynthesis` 的基础知识。它是控制网页上文本转语音的主要接口。该接口拥有一个名为\
  \ `getVoices()` 的方法，该方法返回一个 `SpeechSynthesisVoice` 对象数组，代表所有可用的语音。\n\n* * *\n\n\
  ## 获取可用语音\n\n1. 初始化过程：在获取语音之前，我们需要引用 `SpeechSynthesis` 接口：\n\n```javascript\nconst\
  \ synth = window.speechSynthesis;\n```\n\n2. 获取并列出语音：使用初始化后的 `synth` 对象，调用 `getVoices()`\
  \ 方法：\n\n```javascript\nlet voices = [];\n\nfunction populateVoiceList() {\n  voices\
  \ = synth.getVoices();\n  // 用于显示这些语音的代码将写在这里\n}\n```\n\n请记住，可用语音列表在页面加载时可能不会立即可用。为了处理这种情况，我们应该监听\
  \ `voiceschanged` 事件：\n\n```javascript\nsynth.onvoiceschanged = populateVoiceList;\n\
  ```\n\n* * *\n\n## 在下拉菜单中显示语音\n\n为了让用户选择语音，通常的做法是将它们显示在下拉列表中：\n\n1. HTML 结构：\n\n\
  ```html\n<select id=\"voiceSelect\"></select>\n```\n\n2. 填充下拉菜单：\n\n回到 `populateVoiceList`\
  \ 函数，现在可以遍历 `voices` 数组并为每个语音创建一个选项：\n\n```javascript\nconst voiceSelect = document.getElementById('voiceSelect');\n\
  voices.forEach(voice => {\n  const option = document.createElement('option');\n\
  \  option.textContent = `${voice.name} (${voice.lang})`;\n  // 设置必要的属性\n  option.setAttribute('data-lang',\
  \ voice.lang);\n  option.setAttribute('data-name', voice.name);\n  voiceSelect.appendChild(option);\n\
  });\n```\n\n* * *\n\n## 使用选中的语音\n\n要实际使用某个语音，你需要在合成语音时进行设置：\n\n1. 合成语音：\n\n假设你想朗读以下消息：\n\
  \n```javascript\nconst utterThis = new SpeechSynthesisUtterance('Hello, how are\
  \ you?');\n```\n\n2. 设置语音：\n\n在指示 `synth` 朗读消息之前，设置选中的语音：\n\n```javascript\nconst\
  \ selectedVoiceName = voiceSelect.selectedOptions[0].getAttribute('data-name');\n\
  utterThis.voice = voices.find(voice => voice.name === selectedVoiceName);\n```\n\
  \n3. 朗读！：\n\n最后，使用 `speak` 方法：\n\n```javascript\nsynth.speak(utterThis);\n```\n\n\
  * * *\n\n## 结论\n\n将动态语音选择集成到你的语音文本阅读器中，可以增强定制化能力，满足全球不同语言偏好的用户需求。只需几行代码，Web Speech\
  \ API 的 `SpeechSynthesis` 接口就能为你的 Web 应用程序提供一个强大的工具，让静态文本焕发生机。随着你的深入，可以考虑探索其他功能，如调整音调、语速和音量，以进一步定制用户的听觉体验。\n\
  \n# 语音按钮\n\n在本章中，我们将探讨语音文本阅读器项目的核心组件之一：语音按钮。这些按钮将作为触发器，让应用程序将选中的或输入的文本转换为可听的语音。利用\
  \ Web Speech API（特别是 Speech Synthesis 接口）的强大功能，我们将为应用程序赋予声音。\n\n* * *\n\n## 前提条件\n\
  \n在深入本章之前，请确保你已经按照前几章的内容成功设置了项目的基本结构。\n\n* * *\n\n## 创建语音按钮\n\n1. HTML 结构：\n\n首先，在\
  \ HTML 中为按钮搭建基本结构：\n\n```html\n<div id=\"buttons\">\n  <button id=\"start\">开始朗读</button>\n\
  \  <button id=\"stop\">停止朗读</button>\n</div>\n```\n\n这里有两个按钮：\n\n- `开始朗读`：启动语音。\n\
  - `停止朗读`：停止正在进行的语音。\n\n2. 基本样式：\n\n为了让按钮视觉上吸引人且用户友好，我们应用一些 CSS：\n\n```css\nbuttons\
  \ {\n  display: flex;\n  justify-content: space-around;\n  margin-top: 20px;\n}\n\
  \nbutton {\n  padding: 10px 20px;\n  font-size: 16px;\n  cursor: pointer;\n  border:\
  \ none;\n  background-color: 3498db;\n  color: fff;\n  border-radius: 5px;\n}\n\n\
  button:hover {\n  background-color: 2980b9;\n}\n```\n\n* * *\n\n## JavaScript 实现\n\
  \n现在，让我们利用 Web Speech API 的强大功能：\n\n1. 选择元素：\n\n使用 JavaScript，首先选择按钮元素：\n\n```javascript\n\
  const startBtn = document.getElementById('start');\nconst stopBtn = document.getElementById('stop');\n\
  ```\n\n2. 初始化 Speech Synthesis：\n\n接下来，初始化 `SpeechSynthesis` 对象：\n\n```javascript\n\
  const synth = window.speechSynthesis;\n```\n\n3. 开始朗读按钮：\n\n“开始朗读”按钮将获取提供的文本并将其转换为语音。让我们看看如何实现：\n\
  \n```javascript\nstartBtn.addEventListener('click', () => {\n  if (synth.speaking)\
  \ {\n    console.error('语音合成正在进行中。');\n    return;\n  }\n  let textInput = document.getElementById('text-input').value;\
  \  // 假设 'text-input' 是用户输入/粘贴文本的 textarea 或 input 的 ID\n  if (textInput !== '')\
  \ {\n    let utterance = new SpeechSynthesisUtterance(textInput);\n    // 可选：在此处设置语音、音调和语速\n\
  \    // utterance.voice = synth.getVoices()[0];\n    // utterance.pitch = 1;\n \
  \   // utterance.rate = 1;\n    synth.speak(utterance);\n  }\n});\n```\n\n4. 停止朗读按钮：\n\
  \n“停止朗读”按钮将停止任何正在进行的语音合成：\n\n```javascript\nstopBtn.addEventListener('click', ()\
  \ => {\n  if (synth.speaking) {\n    synth.cancel();\n  }\n});\n```\n\n* * *\n\n\
  ## 测试功能\n\n添加上述代码片段后，你应该在支持 Web Speech API 的浏览器中测试应用程序。在指定的输入区域输入或粘贴一些文本，然后点击“开始朗读”按钮。你应该能听到文本被朗读出来。点击“停止朗读”按钮应立即停止语音。\n\
  \n* * *\n\n## 结论\n\n\n\n\n\n# 更改语音与自定义文本框\n\n在本章中，我们将通过实现两个关键功能来扩展语音文本阅读器的功能：\n\n\
  1. 更改文本转语音阅读器的语音。\n2. 允许用户输入自定义文本以供朗读。\n\n这些功能将使我们的应用程序更加灵活，让用户对语音输出和朗读内容拥有更多控制权。\n\
  \n---\n\n## 第一步：为语音选择和自定义文本设置 HTML\n\n在深入 JavaScript 功能之前，我们先设置 HTML，包含一个用于语音选择的下拉列表和一个用于自定义文本输入的文本区域。\n\
  \n`index.html`\n\n```html\n<div class=\"voice-selection\">\n  <label for=\"voiceList\"\
  >选择语音：</label>\n  <select id=\"voiceList\"></select>\n</div>\n<div class=\"custom-text\"\
  >\n  <label for=\"customText\">输入自定义文本：</label>\n  <textarea id=\"customText\" rows=\"\
  5\" placeholder=\"在此输入自定义文本...\"></textarea>\n  <button id=\"readCustomText\">朗读自定义文本</button>\n\
  </div>\n```\n\n---\n\n## 第二步：获取可用语音\n\n我们从 `SpeechSynthesis` API 获取可用语音，并填充下拉列表。\n\
  \n`app.js`\n\n```javascript\nconst voiceList = document.getElementById('voiceList');\n\
  let voices = [];\n\nfunction populateVoiceList() {\n  voices = speechSynthesis.getVoices();\n\
  \  voices.forEach(voice => {\n    const option = document.createElement('option');\n\
  \    option.textContent = voice.name;\n    option.setAttribute('data-lang', voice.lang);\n\
  \    option.setAttribute('data-name', voice.name);\n    voiceList.appendChild(option);\n\
  \  });\n}\n\n// 当语音列表发生变化时触发此事件\nspeechSynthesis.onvoiceschanged = populateVoiceList;\n\
  ```\n\n---\n\n## 第三步：更改语音\n\n当语音加载到下拉列表后，我们希望根据用户的选择来更改语音。\n\n`app.js`（续）\n\n```javascript\n\
  let selectedVoice;\n\nvoiceList.addEventListener('change', (e) => {\n  selectedVoice\
  \ = voices.find(voice => voice.name === e.target.value);\n});\n```\n\n---\n\n##\
  \ 第四步：实现自定义文本框\n\n对于自定义文本功能，我们需要允许用户在文本区域中输入内容，然后使用选定的语音朗读出来。\n\n`app.js`（续）\n\n\
  ```javascript\nconst customText = document.getElementById('customText');\nconst\
  \ readCustomTextButton = document.getElementById('readCustomText');\n\nreadCustomTextButton.addEventListener('click',\
  \ () => {\n  let utterThis = new SpeechSynthesisUtterance(customText.value);\n \
  \ if (selectedVoice) {\n    utterThis.voice = selectedVoice;\n  }\n  speechSynthesis.speak(utterThis);\n\
  \  customText.value = ''; // 朗读后清空文本区域\n});\n```\n\n---\n\n## 第五步：美化界面\n\n为了让用户界面直观整洁，我们添加一些样式。\n\
  \n`styles.css`\n\n```css\n.voice-selection, .custom-text {\n  margin: 20px 0;\n\
  }\n\nlabel {\n  display: block;\n  margin-bottom: 10px;\n  font-weight: bold;\n\
  }\n\nselect, textarea {\n  width: 100%;\n  padding: 10px;\n  border: 1px solid #ccc;\n\
  \  border-radius: 4px;\n}\n\nbutton {\n  display: block;\n  margin-top: 10px;\n\
  \  padding: 10px 20px;\n  background-color: #333;\n  color: #fff;\n  border: none;\n\
  \  border-radius: 4px;\n  cursor: pointer;\n}\n\nbutton:hover {\n  background-color:\
  \ #555;\n}\n```\n\n---\n\n## 结论\n\n通过上述步骤，我们成功地为语音文本阅读器添加了更改语音的功能，并允许用户输入自定义文本供应用程序朗读。这不仅使我们的应用程序更加灵活，还通过提供对内容和呈现方式的更多控制，增强了用户体验。\n\
  \n请记住，像这样的无障碍工具可以改变用户与 Web 应用程序交互的方式。务必使用不同类型的用户测试这些工具，以确保它们能满足不同的需求。\n\n---\n\n\
  # 第 13 节：项目 12 - 放松应用 | CSS 动画、setTimeout\n\n## 项目介绍\n\n欢迎来到项目 12——放松应用。在快节奏的世界中，花点时间放松和呼吸不仅对心理健康至关重要，也有助于提高生产力。基于此，放松应用作为一个数字伴侣，鼓励用户暂停、呼吸，并重新与当下时刻建立连接。\n\
  \n---\n\n## 放松应用的目标\n\n放松应用的主要目的是引导用户完成一系列呼吸练习，帮助他们达到平静和专注的状态。作为开发者，这为我们提供了一个机会，深入探索\
  \ CSS 动画和 JavaScript 函数（尤其是 `setTimeout` 方法）的有趣结合。\n\n---\n\n## 我们将构建什么？\n\n1. **视觉呼吸引导**：一个用户友好的界面，直观地向用户显示何时吸气、屏气和呼气。\n\
  2. **动画**：使用 CSS，我们将创建一个与呼吸指令同步的平滑、舒缓的动画，让用户能够视觉跟随。\n3. **JavaScript 集成**：我们的 JS\
  \ 代码不仅控制动画触发，还指导用户每个呼吸阶段应持续多长时间。\n\n---\n\n## 放松应用的功能\n\n1. **引导式呼吸指令**：清晰的屏幕提示，准确告诉用户何时吸气、屏气和呼气。\n\
  2. **自适应循环**：应用将持续运行呼吸循环，用户可以根据需要随时使用。\n3. **响应式设计**：我们的应用将适配不同设备，确保每个人都能访问并受益。\n\
  4. **可自定义设置**：虽然这是一个基础版本，但开发者后续可以添加功能，让用户设置自己的呼吸间隔或选择不同的放松模式。\n\n---\n\n## 为什么选择放松应用？\n\
  \n- **全面学习**：该项目提供了全面的学习体验，从创建视觉吸引人的设计到理解和实现 JavaScript 的异步函数。\n- **实际应用**：冥想和放松应用越来越受欢迎。该项目可以作为那些希望深入探索此类应用的基础。\n\
  - **具有挑战性但可实现**：对于与我们一同走过前 11 个项目的开发者来说，放松应用提供了恰到好处的挑战，同时确保它仍然可实现且有趣。\n\n总之，通过完成这个项目，你不仅将拥有一个功能完整的放松应用，还将更深入地理解如何将\
  \ CSS 动画与 JavaScript 方法有效结合，以创建同步的用户体验。那么，让我们开始构建通往放松和编程精通之路吧！\n\n---\n\n## 创建大圆\n\
  \n在放松应用中，主要的视觉组件是一个大圆，它将代表我们的呼吸视觉引导。这个圆会扩张和收缩，模拟呼吸过程。在动画化之前，我们首先需要创建它。在本章中，我们将引导你使用\
  \ HTML 和 CSS 创建这个关键组件。\n\n---\n\n### 第一步：设置 HTML 结构\n\n让我们从为圆创建基本 HTML 结构开始。\n\n\
  ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
  >\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
  \  <title>放松应用</title>\n  <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n\
  <body>\n  <div class=\"container\">\n    <div class=\"circle\"></div>\n  </div>\n\
  </body>\n</html>\n```\n\n这里，我们将圆包裹在一个容器中。这将有助于后续的定位和动画制作。\n\n---\n\n### 第二步：使用 CSS\
  \ 为圆添加样式\n\n\n\n\n为了让我们的圆形看起来美观且给用户带来放松感，我们将选择一种柔和、淡雅的色彩。圆形的大小应足够显著，成为视觉焦点，但又不至于过于突兀。\n\
  \n在你的 `styles.css` 文件中：\n\n```css\nbody, html {\n  height: 100%;\n  margin: 0;\n\
  \  display: flex;\n  justify-content: center;\n  align-items: center;\n  background-color:\
  \ 282c34; /* 深色背景以形成对比 */\n}\n\n.container {\n  position: relative;\n  width: 300px;\n\
  \  height: 300px;\n}\n\n.circle {\n  position: absolute;\n  top: 50%;\n  left: 50%;\n\
  \  transform: translate(-50%, -50%);\n  width: 100%;\n  height: 100%;\n  border-radius:\
  \ 50%; /* 使其成为完美的圆形 */\n  background-color: 89CFF0; /* 舒缓的蓝色 */\n  box-shadow: 0px\
  \ 0px 15px rgba(0,0,0,0.2); /* 微妙的阴影增加深度感 */\n}\n```\n\n在上述 CSS 中，我们：\n\n- 使用 `body`\
  \ 上的 flex 属性将 `.container` 居中。\n- 对 `.circle` 使用 `position: absolute` 和 `transform`\
  \ 属性，确保它在 `.container` 内完美居中。\n- 使用 `border-radius` 属性将方形 div 变成圆形。\n- 选择了一种令人放松的蓝色作为背景色。\n\
  \n* * *\n\n## 步骤 3：添加文字指示\n\n虽然我们的主要焦点是圆形，但添加文字指示可以提供额外的上下文。让我们添加简单的“吸气”和“呼气”文字，稍后当圆形扩展和收缩时，将通过\
  \ JavaScript 切换这些文字。\n\n修改 HTML：\n\n```html\n<div class=\"container\">\n  <div class=\"\
  circle\">\n    <p class=\"text\">吸气</p>\n  </div>\n</div>\n```\n\n现在，为文字添加一些样式：\n\
  \n```css\n.text {\n  position: absolute;\n  top: 50%;\n  left: 50%;\n  transform:\
  \ translate(-50%, -50%);\n  font-family: 'Arial', sans-serif;\n  color: fff;\n \
  \ font-size: 1.5rem;\n  text-align: center;\n  opacity: 0.8;\n}\n```\n\n* * *\n\n\
  ## 结论\n\n我们现在已成功创建了一个大圆形，它将作为放松应用的核心视觉元素。这个圆形很快将被动画化，以帮助用户进行放松的呼吸练习。在接下来的章节中，我们将深入探讨如何添加动画并增强这个圆形的交互性。\n\
  \n请记住，这个应用的有效性不仅在于动画或代码，还在于能够帮助用户找到放松和平静的视觉提示。我们对颜色、位置以及动画流畅度的选择将在应用的整体效果中发挥关键作用。\n\
  \n# 创建并动画化指针\n\n在本章中，我们将专注于放松应用的一个关键部分：指针。指针作为视觉提示，引导用户完成呼吸练习。它将围绕圆的周长旋转，其运动与呼吸指令相对应。\n\
  \n* * *\n\n## 前置条件\n\n在开始之前，请确保你已经完成了以下设置：\n\n- 放松应用的基本 HTML 结构\n- 页面中央的一个大圆形（来自第\
  \ 70 章）\n\n* * *\n\n### 1. 使用 HTML 和 CSS 创建指针\n\n**HTML：**\n\n在圆形元素内添加一个指针的 div：\n\
  \n```html\n<div class=\"circle\">\n  <div class=\"pointer\"></div>\n</div>\n```\n\
  \n**CSS：**\n\n将指针样式设置为一个突出的小三角形，使其在圆形上显眼：\n\n```css\n.pointer {\n  width: 0;\n \
  \ height: 0;\n  border-left: 10px solid transparent;\n  border-right: 10px solid\
  \ transparent;\n  border-bottom: 20px solid 333;\n  position: absolute;\n  top:\
  \ -10px;\n  left: 50%;\n  transform: translateX(-50%);\n}\n```\n\n* * *\n\n### 2.\
  \ 基本动画设置\n\n为了动画化指针，我们将使用 CSS 关键帧和 `transform` 属性。为简单起见，我们设置一个动画，让指针在 8 秒内旋转 360\
  \ 度（模拟一个完整的呼吸周期）。\n\n**CSS：**\n\n```css\n@keyframes rotatePointer {\n  0% {\n  \
  \  transform: rotate(0deg);\n  }\n  100% {\n    transform: rotate(360deg);\n  }\n\
  }\n```\n\n将动画应用到指针上：\n\n```css\n.pointer {\n  /* ...之前的样式... */\n  animation: rotatePointer\
  \ 8s linear infinite;\n}\n```\n\n* * *\n\n### 3. 使用 `setTimeout` 控制时间\n\n虽然 CSS\
  \ 动画提供了连续的运动，但我们希望指针在特定时刻暂停，以模拟“吸气”和“呼气”阶段。为此，我们将使用 JavaScript 的 `setTimeout` 方法。\n\
  \n**JavaScript：**\n\n首先，获取指针元素：\n\n```javascript\nconst pointer = document.querySelector('.pointer');\n\
  ```\n\n接下来，创建一个控制指针动画的函数：\n\n```javascript\nfunction controlPointerAnimation() {\n\
  \  // 暂停动画\n  pointer.style.animationPlayState = 'paused';\n\n  // “吸气”持续 4 秒\n\
  \  setTimeout(() => {\n    pointer.style.animationPlayState = 'running';\n  }, 4000);\n\
  \n  // “呼气”持续 4 秒，然后再次暂停\n  setTimeout(() => {\n    pointer.style.animationPlayState\
  \ = 'paused';\n  }, 8000);\n}\n```\n\n在页面加载时调用该函数：\n\n```javascript\ncontrolPointerAnimation();\n\
  ```\n\n为了实现连续循环，可以使用 `setInterval` 每 8 秒运行一次 `controlPointerAnimation` 函数。\n\n```javascript\n\
  setInterval(controlPointerAnimation, 8000);\n```\n\n* * *\n\n## 结论\n\n动画化的指针现在为用户提供了清晰的视觉提示，引导他们完成呼吸练习。通过将\
  \ CSS 动画与定时 JavaScript 函数相结合，我们创造了一个无缝的用户体验，既具有交互性，又有助于放松。\n\n在下一章中，我们将深入探讨如何使用\
  \ JavaScript 触发呼吸动画，进一步提升放松体验。敬请期待！\n\n# 使用 JS 触发的呼吸动画\n\n目标：在本章中，我们将逐步讲解如何创建一个呼吸放松应用。该应用将鼓励用户跟随一个扩展和收缩的视觉引导，按照有节奏的呼吸模式进行呼吸。动画将使用\
  \ CSS 动画实现，并通过 JavaScript 触发。\n\n* * *\n\n## 1. 引言\n\n呼吸练习常用于诱导放松和减轻压力。我们的目标是创建一个模拟吸气和呼气过程的动画，引导用户与之同步呼吸。\n\
  \n* * *\n\n## 2. 设置 HTML 结构\n\n让我们从创建动画的基本结构开始：\n\n```html\n<div class=\"app\">\n\
  \  <div class=\"circle\">\n    <div class=\"inner-circle\"></div>\n  </div>\n  <p\
  \ id=\"instruction\">吸气</p>\n</div>\n```\n\n这里，`.circle` 代表呼吸的视觉元素，而 `.inner-circle`\
  \ 模拟肺部的扩张和收缩。\n\n* * *\n\n## 3. 为动画添加样式\n\n接下来，为我们的圆形添加样式：\n\n```css\n.app {\n \
  \ display: flex;\n  justify-content: center;\n  align-items: center;\n  height:\
  \ 100vh;\n  background-color: e0f7fa;\n}\n\n.circle {\n  width: 100px;\n  height:\
  \ 100px;\n  border-radius: 50%;\n  background-color: 81d4fa;\n  display: flex;\n\
  \  justify-content: center;\n  align-items: center;\n  overflow: hidden;\n}\n\n\
  .inner-circle {\n  width: 50px;\n  height: 50px;\n  border-radius: 50%;\n  background-color:\
  \ 29b6f6;\n  opacity: 0.7;\n}\n```\n\n* * *\n\n## 4. 创建 CSS 动画\n\n让我们创建两个动画：一个用于吸气，圆形扩展；另一个用于呼气，圆形收缩。\n\
  \n```css\n@keyframes breatheIn {\n  0%, 100% {\n    width: 50px;\n    height: 50px;\n\
  \  }\n  50% {\n    width: 100px;\n    height: 100px;\n  }\n}\n\n@keyframes breatheOut\
  \ {\n  0%, 100% {\n    width: 100px;\n    height: 100px;\n  }\n  50% {\n    width:\
  \ 50px;\n    height: 50px;\n  }\n}\n```\n\n* * *\n\n## 5. 添加 JavaScript 触发\n\n现在，使用\
  \ JavaScript 来触发这些动画：\n\n```javascript\nconst instruction = document.getElementById('instruction');\n\
  const innerCircle = document.querySelector('.inner-circle');\n\nlet isBreathingIn\
  \ = true;\n\nconst breatheFunction = () => {\n  if (isBreathingIn) {\n    instruction.innerText\
  \ = '呼气';\n    innerCircle.style.animation = 'breatheIn 2s alternate 2';\n  } else\
  \ {\n    instruction.innerText = '吸气';\n    innerCircle.style.animation = 'breatheOut\
  \ 2s alternate 2';\n  }\n  isBreathingIn = !isBreathingIn;\n};\n\n// 初始调用\nbreatheFunction();\n\
  \n// 使用 setInterval 持续重复\nsetInterval(breatheFunction, 4000);\n```\n\n\n\n\n在这里，我们每\
  \ 4 秒在 `breatheIn` 和 `breatheOut` 动画之间切换一次，每个动画有 2 秒完成时间，并伴有 2 秒的暂停（通过使用 `alternate`\
  \ 计数实现）。\n\n* * *\n\n## 6. 结论\n\n至此，我们的呼吸动画就完成了。`放松应用` 现在为用户提供了一种视觉辅助，帮助他们同步呼吸。CSS\
  \ 动画与 JavaScript 触发器相结合，为用户提供了一种动态的方式来呈现引人入胜的内容。\n\n通过遵循此模型，您可以扩展此概念，加入声音、调整时间，甚至为不同的放松技巧加入不同的呼吸模式。\n\
  \n* * *\n\n注意：请始终确保您的应用程序（尤其是那些涉及健康影响的）包含适当的免责声明。此应用是一个基本模型，仅供说明之用。在处理与健康和福祉相关的内容时，最好咨询专业人士。\n\
  \n# 第 14 节：项目 13 - 新年倒计时 | DOM、日期与时间\n\n## 项目介绍\n\n欢迎来到本书的第十三个项目！我们已经走了很长的路，从表单验证器到自定义视频播放器，现在我们正深入一个令人愉悦的新年倒计时应用。当我们告别旧年，热切期待新年的到来时，一个可视化的倒计时可以增强兴奋和激动之情。无论您是想将其部署到您的网站上，集成到活动页面中，还是仅仅享受编程之旅，这个项目都将带来挑战和成就感。\n\
  \n* * *\n\n## 项目目标\n\n本项目的主要目标是创建一个基于网页的新年倒计时器。随着时间一秒一秒地流逝，新年临近，我们的应用将提供实时更新，显示剩余的天数、小时数、分钟数和秒数。\n\
  \n* * *\n\n## 主要功能\n\n1. 动态日期与时间集成：使用 JavaScript 的 `Date` 对象，应用程序将持续获取当前日期和时间，计算与新年之间的差值，并显示倒计时。\n\
  2. 着陆页：一个设计精美的着陆页，通过动画、相关图片以及倒计时本身来吸引用户。\n3. 响应式设计：我们希望每个人，无论使用何种设备，都能享受倒计时。因此，我们将确保设计具有响应性，在手机和桌面设备上都能呈现良好效果。\n\
  4. 旋转效果：就在倒计时到达新年之前，我们将添加一个旋转效果来增加期待感。\n5. 动态年份更新：无需手动更新目标年份。我们的应用将自动为下一个新年设置倒计时。\n\
  \n* * *\n\n## 使用的技术与方法\n\n* HTML：用于构建着陆页和倒计时元素的结构。\n* CSS：用于样式设计、美化以及确保应用的响应性。我们还将使用\
  \ CSS 创建动画。\n* JavaScript：这是奇迹发生的地方。我们将使用 JS 来：\n  - 获取当前日期和时间。\n  - 计算当前日期与新年之间的差值。\n\
  \  - 实时更新 DOM 元素。\n  - 实现旋转效果和动态年份更新。\n\n* * *\n\n## 你将学到什么\n\n在本项目结束时：\n\n- 你将更深入地理解\
  \ JavaScript 的 `Date` 对象及其方法。\n- 你将学会实时操作 DOM，使你的应用更具动态性和交互性。\n- 你将更清楚地认识到设计中响应性的重要性，并掌握实现它的实用知识。\n\
  - 你将体验到构建一个对时间敏感的应用所带来的兴奋感。\n\n## 前提条件\n\n在开始本项目之前，请确保你对 HTML、CSS 和 JavaScript 有基本的了解。本书之前的项目涵盖了\
  \ DOM 操作、CSS 样式和 JavaScript 基础知识，这些对于成功完成本项目至关重要。\n\n* * *\n\n## 着陆页 HTML 与样式\n\n\
  在本章中，我们将专注于为新年倒计时项目创建着陆页。目标是设计一个视觉上吸引人的网页，同时为我们的倒计时器提供功能背景。我们将使用 HTML 构建结构，使用 CSS\
  \ 进行样式设计。\n\n* * *\n\n### 1. 设置 HTML 结构\n\n对于着陆页，我们希望有一个简单而充满活力的设计，以营造对新年倒计时的期待感。\n\
  \n让我们从基本的 HTML 结构开始：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta\
  \ charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n<title>新年倒计时</title>\n<link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n\
  <body>\n<div class=\"container\">\n<header>\n<h1>新年倒计时</h1>\n<p>满怀激动地迎接新年！</p>\n\
  </header>\n<div class=\"countdown-wrapper\">\n<!-- 倒计时器将在下一章放置于此 -->\n</div>\n</div>\n\
  </body>\n</html>\n```\n\n在这里，我们设置了一个 `container` div 来容纳整个内容。在此内部，`header` 包含一个标题和一个副标题。`countdown-wrapper`\
  \ 是一个占位符，我们将在下一章中在此处添加倒计时器。\n\n* * *\n\n### 2. 为着陆页添加样式\n\n现在让我们进入样式设计。对于这个项目，我们考虑使用深色主题搭配金色点缀，以营造节日氛围。\n\
  \nstyles.css\n\n```css\nbody {\nfont-family: 'Arial', sans-serif;\nbackground-color:\
  \ 222;\ncolor: fff;\ntext-align: center;\nmargin: 0;\npadding: 0;\nheight: 100vh;\n\
  display: flex;\njustify-content: center;\nalign-items: center;\n}\n.container {\n\
  width: 80%;\nmax-width: 800px;\n}\nheader {\nmargin-bottom: 20px;\n}\nheader h1\
  \ {\nfont-size: 2.5rem;\ncolor: gold;\nmargin: 0;\n}\nheader p {\ncolor: ddd;\n\
  font-style: italic;\n}\n.countdown-wrapper {\nborder: 2px solid gold;\npadding:\
  \ 20px;\nborder-radius: 10px;\nbox-shadow: 0px 0px 15px rgba(255, 215, 0, 0.6);\n\
  }\n```\n\n以下是我们 CSS 所做工作的分解：\n\n- 对于 body，我们使用了深色（`222`）并将文本颜色设置为白色。我们还使用 flexbox\
  \ 属性将 `container` 居中。\n- 容器宽度设置为视口的 80%，最大宽度为 800px，以确保我们的设计具有响应性。\n- header 有一个底部边距，以在其与倒计时器之间留出空间。h1\
  \ 标签（标题）被着色为金色以突出显示。\n- 我们为 `countdown-wrapper` 设置了金色边框，并添加了微妙的盒子阴影以赋予其一些深度。\n\n\
  * * *\n\n### 3. 结论\n\n随着着陆页的 HTML 和样式设计完成，我们现在有了一个基础，可以在接下来的章节中实现我们的倒计时器。深色主题搭配金色点缀，为新年倒计时增添了一丝节日气氛和期待感。\n\
  \n在下一章中，我们将专注于创建实际的倒计时，动态添加天数、小时数、分钟数和秒数，并使用 JavaScript 使其全部实时运行。\n\n# 创建倒计时\n\n\
  ## 第 75 章：创建倒计时\n\n欢迎来到我们项目旅程的第 75 章！在本章中，我们将深入新年倒计时项目的核心：创建倒计时本身。我们将获取当前日期，确定新年日期，并计算两者之间的差值。然后，结果将动态显示在我们的着陆页上。\n\
  \n* * *\n\n### 1. 理解目标\n\n我们的目标是显示一个每秒递减的倒计时，并显示距离新年剩余的天数、小时数、分钟数和秒数。这种动态视觉效果能够吸引用户，并营造对即将到来的新年的期待感。\n\
  \n* * *\n\n### 2. 设置 HTML 结构\n\n在深入 JavaScript 之前，让我们在 HTML 中创建一个占位符，用于显示我们的倒计时：\n\
  \n\n\n\n\n```html\n<div class=\"countdown\">\n  <div class=\"time\">\n    <span\
  \ class=\"days\">365</span> 天\n  </div>\n  <div class=\"time\">\n    <span class=\"\
  hours\">00</span> 小时\n  </div>\n  <div class=\"time\">\n    <span class=\"minutes\"\
  >00</span> 分钟\n  </div>\n  <div class=\"time\">\n    <span class=\"seconds\">00</span>\
  \ 秒\n  </div>\n</div>\n```\n\n---\n\n## 3. 获取当前日期与新年日期\n\n在 JavaScript 中，我们需要获取当前日期和下一个新年的日期：\n\
  \n```javascript\nconst currentDate = new Date();\nconst nextNewYearDate = new Date(currentDate.getFullYear()\
  \ + 1, 0, 1);\n```\n\n---\n\n## 4. 计算差值\n\n我们需要计算当前日期与新年日期之间的毫秒差：\n\n```javascript\n\
  const difference = nextNewYearDate - currentDate;\n```\n\n根据这个差值，我们可以推导出天数、小时数、分钟数和秒数。\n\
  \n---\n\n## 5. 推导时间单位\n\n以下是推导每个时间单位的详细步骤：\n\n```javascript\nconst seconds = Math.floor(difference\
  \ / 1000);\nconst minutes = Math.floor(seconds / 60);\nconst hours = Math.floor(minutes\
  \ / 60);\nconst days = Math.floor(hours / 24);\nconst secondsLeft = seconds % 60;\n\
  const minutesLeft = minutes % 60;\nconst hoursLeft = hours % 24;\n```\n\n---\n\n\
  ## 6. 显示倒计时\n\n现在，我们将用计算出的值更新 HTML 结构：\n\n```javascript\ndocument.querySelector('.days').textContent\
  \ = days;\ndocument.querySelector('.hours').textContent = hoursLeft;\ndocument.querySelector('.minutes').textContent\
  \ = minutesLeft;\ndocument.querySelector('.seconds').textContent = secondsLeft;\n\
  ```\n\n---\n\n## 7. 每秒更新倒计时\n\n为了让倒计时动态更新，我们需要每秒刷新一次：\n\n```javascript\nsetInterval(()\
  \ => {\n  // 重新计算差值\n  const currentDate = new Date();\n  const difference = nextNewYearDate\
  \ - currentDate;\n\n  // 将差值转换为天数、小时数、分钟数和秒数\n  // ...\n\n  // 更新 HTML\n  // ...\n\
  }, 1000);\n```\n\n大功告成！你已经成功利用 DOM 操作和 JavaScript 的 `Date` 对象创建了一个动态的新年倒计时。\n\n\
  ---\n\n## 结语\n\n倒计时可以为许多网站增添激动人心的元素，尤其是那些期待某个活动的网站。通过掌握 `Date` 对象并理解时间计算背后的数学原理，你可以为网页创建大量基于时间的功能。一如既往，熟能生巧。尝试为其他活动创建倒计时，或者添加自定义用户输入等功能，实现个性化倒计时。创意无限！\n\
  \n## 动态年份与加载动画\n\n欢迎回到项目 13——新年倒计时！在上一章中，我们通过设置着陆页打下了基础。这一次，我们将深入 JavaScript 世界，实现动态年份显示和加载动画，展示新年倒计时。\n\
  \n---\n\n### 设置动态年份\n\n新年倒计时最重要的功能之一就是确保它每年都能保持时效性。与其硬编码年份，不如利用 JavaScript 的 `Date`\
  \ 对象，让倒计时始终指向即将到来的新年。\n\n#### 步骤 1：访问 DOM 元素\n\n开始之前，我们需要获取要显示年份的元素的引用。\n\n```javascript\n\
  const yearEl = document.getElementById('year');\n```\n\n#### 步骤 2：获取当前年份\n\n使用 `Date`\
  \ 对象，我们可以获取当前年份：\n\n```javascript\nconst currentYear = new Date().getFullYear();\n\
  ```\n\n#### 步骤 3：显示下一年份\n\n```javascript\nyearEl.textContent = currentYear + 1;\n\
  ```\n\n这将确保显示的年份始终是下一年，使倒计时保持时效性。\n\n---\n\n### 实现加载动画\n\n当用户访问我们的页面时，提供一个视觉提示，表明倒计时正在加载中，会带来良好的体验。这就是加载动画的作用。它会短暂显示，然后才展示倒计时。\n\
  \n#### 步骤 1：HTML 设置\n\n在主 HTML 中，加入加载动画的 div：\n\n```html\n<div class=\"spinner\"\
  \ id=\"spinner\"></div>\n```\n\n#### 步骤 2：CSS 样式\n\n对于加载动画，你需要一个简单的旋转动画：\n\n```css\n\
  .spinner {\n  width: 50px;\n  height: 50px;\n  border: 5px solid rgba(255, 255,\
  \ 255, 0.1);\n  border-top: 5px solid fff;\n  border-radius: 50%;\n  position: absolute;\n\
  \  top: 50%;\n  left: 50%;\n  transform: translate(-50%, -50%);\n  animation: spin\
  \ 1s linear infinite;\n}\n\n@keyframes spin {\n  0% {\n    transform: translate(-50%,\
  \ -50%) rotate(0deg);\n  }\n  100% {\n    transform: translate(-50%, -50%) rotate(360deg);\n\
  \  }\n}\n```\n\n#### 步骤 3：JavaScript 逻辑\n\n最后，确保加载动画只短暂显示，然后展示倒计时：\n\n```javascript\n\
  const spinnerEl = document.getElementById('spinner');\nconst countdownEl = document.getElementById('countdown');\
  \ // 假设这是倒计时容器的 id\n\nsetTimeout(() => {\n  spinnerEl.style.display = 'none';\n\
  \  countdownEl.style.display = 'block';\n}, 1000);\n```\n\n这将在一秒后隐藏加载动画并显示倒计时。\n\
  \n---\n\n### 总结\n\n有了动态年份和友好的加载动画来迎接用户，我们的新年倒计时已初具雏形！\n\n请记住，Web 开发的魅力不仅在于创造精美的视觉效果，更在于通过这些微小的动态功能提升用户体验。倒计时变得更加健壮和用户友好，确保用户年复一年地回来使用。\n\
  \n# 第 15 节：项目 14 - 可排序列表 | 拖放 API\n\n## 项目介绍\n\n欢迎来到项目 14！在本模块中，我们将探索现代 Web 开发的酷炫功能之一——拖放\
  \ API。作为 Web 开发者，我们一直在寻找增强用户体验、让 Web 交互感觉自然直观的方法。拖放功能是一种多功能工具，如果实现得当，可以显著提升网站或应用程序的功能性和可用性。\n\
  \n---\n\n## 项目目标\n\n本项目的主要目标是开发一个可排序列表。想象一下这样的场景：你有一个任务列表、优先级列表，甚至是一个歌曲播放列表，你想根据它们的重要性、紧迫性或偏好重新排列顺序。如果你能简单地拖拽一个项目，并将其放置在列表中的任意位置，那该多棒？这正是我们将在本项目中构建的内容。\n\
  \n---\n\n## 为什么需要可排序列表？\n\n通过拖放来操作列表项顺序的能力，不仅对用户来说视觉上令人满意，而且功能极其强大。原因如下：\n\n1. 灵活性：用户在最初创建列表时，并不总是确定项目的顺序。拥有重新排序的能力，可以随着时间的推移灵活调整列表。\n\
  2. 直观性：拖放操作感觉自然。它模仿了物理移动物体的动作，使交互感觉真实且沉浸。\n3. 增强用户体验：无需手动删除并重新添加项目来改变顺序。可排序列表提供了一种无缝的方式来组织项目。\n\
  \n---\n\n## 技术概述\n\n在本项目中，我们将利用 HTML5 拖放 API 的能力。以下是我们将重点关注的主要组件：\n\n1. 可拖拽元素：这些是我们列表中希望使其可移动的项目。\n\
  2. 放置区域：这些是我们可以放置可拖拽元素的区域。\n3. 拖放事件：这些是浏览器在元素被拖拽和放置时触发的一组事件。我们将利用 `dragstart`、`dragover`、`dragleave`\
  \ 和 `drop` 等事件。\n\n---\n\n## 预期成果\n\n在本项目结束时：\n\n- 你将拥有一个功能性的可排序列表，允许通过拖放重新排列项目。\n\
  - 你将深入理解拖放 API 及其事件和方法。\n\n\n\n\n\n- 你将能够在不同场景中实现拖放功能，而不仅仅是用于排序列表。\n\n---\n\n##\
  \ 前置条件\n\n虽然我们会详细解释每一步，但你需要具备以下基础知识：\n\n- HTML：用于构建列表结构。\n- CSS：用于设置列表样式，并在拖放过程中提供视觉提示。\n\
  - JavaScript：用于处理拖放事件并操作 DOM。\n\n---\n\n### 总结\n\n拖放 API 为网页开启了交互可能性的新世界。无论是构建游戏、计划表还是可视化组织工具，理解如何利用它的力量都能让你的项目脱颖而出。\n\
  \n你准备好了吗？让我们直接开始构建可排序列表吧！\n\n# 将列表项插入 DOM\n\n在本章中，我们将探讨 Web 开发中的基础任务之一——将列表项插入文档对象模型（DOM）。动态向\
  \ DOM 插入元素的能力对于创建动态 Web 应用至关重要。在我们的可排序列表项目中，我们将创建一个用户可以通过拖放列表项进行交互的列表。但在那之前，我们需要先将列表项放入\
  \ DOM。让我们开始吧！\n\n---\n\n## 理解 DOM\n\n在深入插入过程之前，理解什么是 DOM 至关重要。DOM 代表了 Web 文档的结构，每个元素、属性和文本片段都成为该结构中的一个节点。当我们谈论将列表项插入\
  \ DOM 时，本质上是在向这个结构添加节点。\n\n---\n\n## 基本列表结构\n\n在 HTML 中，使用无序列表的基本列表结构如下所示：\n\n```html\n\
  <ul>\n  <li>Item 1</li>\n  <li>Item 2</li>\n  <li>Item 3</li>\n</ul>\n```\n\n在我们的可排序列表项目中，我们希望动态插入这些列表项。\n\
  \n---\n\n## 使用 JavaScript 插入列表项\n\n以下是使用 JavaScript 将列表项插入 DOM 的分步指南：\n\n1. 选择父元素\n\
  \n在插入列表项之前，我们需要选择父元素。在我们的例子中，它是 `<ul>` 元素。\n\n```javascript\nconst list = document.querySelector('ul');\n\
  ```\n\n2. 创建列表项元素\n\n我们可以使用 `document.createElement()` 方法创建一个新元素。\n\n```javascript\n\
  const listItem = document.createElement('li');\n```\n\n3. 设置列表项的内容\n\n你可以使用 `textContent`\
  \ 属性为新创建的列表项设置文本内容。\n\n```javascript\nlistItem.textContent = 'Item 4';\n```\n\n\
  4. 将列表项追加到父元素\n\n要将新的列表项插入 DOM，可以使用 `appendChild()` 方法。\n\n```javascript\nlist.appendChild(listItem);\n\
  ```\n\n如果你按照上述步骤操作，你的列表现在将如下所示：\n\n```html\n<ul>\n  <li>Item 1</li>\n  <li>Item\
  \ 2</li>\n  <li>Item 3</li>\n  <li>Item 4</li>\n</ul>\n```\n\n---\n\n## 动态插入多个列表项\n\
  \n为了使我们的项目具有交互性，我们可能希望一次插入多个列表项。例如，如果我们有一个项目数组，可以遍历该数组并将每个项目插入 DOM：\n\n```javascript\n\
  const items = ['Item 5', 'Item 6', 'Item 7'];\nitems.forEach(item => {\n  const\
  \ listItem = document.createElement('li');\n  listItem.textContent = item;\n  list.appendChild(listItem);\n\
  });\n```\n\n这将把我们的列表扩展为：\n\n```html\n<ul>\n  <li>Item 1</li>\n  <li>Item 2</li>\n\
  \  <li>Item 3</li>\n  <li>Item 4</li>\n  <li>Item 5</li>\n  <li>Item 6</li>\n  <li>Item\
  \ 7</li>\n</ul>\n```\n\n---\n\n### 总结\n\n能够操作 DOM 是 Web 开发人员的基本技能。现在，你应该已经很好地理解了如何使用\
  \ JavaScript 动态地将列表项插入 DOM。在下一章中，我们将学习如何打乱这些列表项，并为我们的拖放功能做好准备。敬请期待！\n\n# 打乱列表项\n\
  \n在本章中，我们将介绍打乱可排序列表中项目的概念。目的是让用户挑战将列表重新排列回原始顺序。通过这样做，我们将提供一个拖放 API 的实际应用场景，展示其实际用途。\n\
  \n---\n\n## 理解打乱的需求\n\n在深入技术细节之前，让我们先理解打乱的需求。当我们向用户提供一个已排序的列表，然后要求他们在打乱后重新排列时，我们实际上是在给他们一个简单而有效的排序练习。这可以应用于现实场景，如排序任务、重新排列产品列表或任何其他需要排序的需求。\n\
  \n---\n\n## 开始\n\n首先，我们假设有一个项目列表，其 HTML 结构如下：\n\n```html\n<ul id=\"sortable-list\"\
  >\n  <li draggable=\"true\">Item 1</li>\n  <li draggable=\"true\">Item 2</li>\n\
  \  <li draggable=\"true\">Item 3</li>\n  <!--... 以此类推 -->\n</ul>\n```\n\n---\n\n\
  ## JavaScript：打乱列表\n\n我们将使用现代版本的 Fisher-Yates（也称为 Knuth）洗牌算法。该算法确保列表的每种排列概率相等。\n\
  \n```javascript\nfunction scrambleList() {\n  const ul = document.querySelector('sortable-list');\n\
  \  const items = ul.getElementsByTagName('li');\n  let itemsArr = Array.prototype.slice.call(items);\n\
  \  itemsArr.sort(() => 0.5 - Math.random());\n  itemsArr.forEach(item => {\n   \
  \ ul.appendChild(item);\n  });\n}\n```\n\n在这个函数中：\n\n- 我们首先通过 ID 选择无序列表。\n- 我们获取无序列表中的所有列表项。\n\
  - 我们将 HTML 集合转换为数组，以便对其使用数组方法。\n- 然后使用 `sort()` 方法打乱列表。逻辑 `0.5 - Math.random()`\
  \ 是一种常用的随机排序技巧。\n- 最后，我们将每个打乱后的项目重新追加到列表中。\n\n---\n\n## 执行打乱\n\n现在，你可能希望在应用程序的特定时刻触发打乱。为了演示，我们将添加一个按钮，点击后即可打乱列表。\n\
  \n```html\n<button onclick=\"scrambleList()\">打乱项目</button>\n```\n\n---\n\n### 总结\n\
  \n通过引入打乱功能，你为可排序列表应用增加了一个交互层。这既给用户带来了挑战，也给了他们一个明确的目标：恢复顺序。在下一章中，我们将深入探讨应用的核心样式，并为拖放功能设置视觉舞台。记住，用户体验至关重要，我们提供的视觉反馈对于引导用户完成排序过程至关重要。\n\
  \n# 核心 CSS\n\nCSS，即层叠样式表，是控制 Web 应用外观和感觉的重要工具。在本章中，我们将深入探讨核心 CSS，为我们的可排序列表项目赋予简洁、专业的外观。请记住，好的\
  \ CSS 不仅能让你的应用视觉上吸引人，还能提升用户体验。\n\n---\n\n## 1. 重置默认样式\n\n在深入项目特定样式之前，确保重置浏览器默认样式至关重要。这将为我们提供跨不同浏览器的一致基线。\n\
  \n```css\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n```\n\n\
  ---\n\n## 2. 设置 Body 和主容器\n\n`body` 和主容器元素决定了整个应用的基本样式和定位。\n\n```css\nbody {\n \
  \ font-family: 'Arial', sans-serif;\n  background-color: #f4f4f4;\n  color: #333;\n\
  \  font-size: 16px;\n  line-height: 1.6;\n}\n\n.wrapper {\n  width: 80%;\n  max-width:\
  \ 1200px;\n  margin: 40px auto;\n  padding: 20px;\n  background-color: #fff;\n \
  \ box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n}\n```\n\n---\n\n## 3. 设置可排序列表的样式\n\n\
  对于我们的可排序列表，我们将设计一种样式，使每个列表项有所区分，同时明确表明它们可以被拖放。\n\n\n\n\n\n```css\n.sortable-list\
  \ {\n  list-style-type: none;\n}\n\n.sortable-list li {\n  padding: 15px;\n  border:\
  \ 1px solid ddd;\n  cursor: move; /* 表示可拖拽 */\n  margin-bottom: 10px;\n  background-color:\
  \ f9f9f9;\n  transition: background-color 0.2s;\n}\n\n.sortable-list li:hover {\n\
  \  background-color: f4f4f4;\n}\n```\n\n---\n\n## 4. 拖放指示\n\n当用户拖拽列表项时，我们需要给出视觉提示。一个简单的方法是改变背景颜色。\n\
  \n```css\n.sortable-list li.dragging {\n  background-color: ddd;\n  border: 1px\
  \ solid transparent;\n}\n```\n\n---\n\n## 5. 反馈与通知\n\n如果你集成了任何反馈机制（例如用于指示正确顺序的提示框），我们需要为其设置相应的样式。\n\
  \n```css\n.alert {\n  padding: 10px;\n  margin: 10px 0;\n  border: 1px solid transparent;\n\
  \  border-radius: 5px;\n}\n\n.alert.success {\n  color: 006400;\n  background-color:\
  \ e6ffe6;\n  border-color: 006400;\n}\n\n.alert.error {\n  color: a80000;\n  background-color:\
  \ ffe6e6;\n  border-color: a80000;\n}\n```\n\n---\n\n## 6. 额外润色\n\n最后，你可以添加一些额外的润色来提升美观度和用户体验。考虑添加\
  \ `hover` 效果、过渡动画，以及可能的响应式媒体查询，以确保你的可排序列表在所有设备上都能良好显示。\n\n---\n\n## 结论\n\nCSS 是一种强大的工具，它使\
  \ Web 开发者能够创建视觉上吸引人且直观的用户界面。通过使用深思熟虑且有针对性的样式，你可以显著改善用户体验。在接下来的章节中，我们将把拖放 API 功能集成到我们样式化的可排序列表中，为美观的设计增添功能性。\n\
  \n请记住，始终在各种设备和浏览器上测试你的设计，以确保一致性和最佳用户体验。\n\n---\n\n## 拖放功能\n\n拖放（DnD）功能是一种用户界面模式，允许用户直接操作屏幕上的元素，提供一种直观的方式来重新排列元素、在容器之间移动数据，甚至通过将新对象拖入指定空间来创建元素。在我们的可排序列表项目中，我们将使用此功能通过将列表项拖拽到所需位置来重新排列它们。\n\
  \n---\n\n### HTML 拖放 API 基础\n\n在深入代码之前，理解拖放 API 的基本概念至关重要：\n\n- `draggable` 属性：该属性设置在你希望拖拽的元素上。大多数\
  \ HTML 元素默认不可拖拽，因此你需要为它们设置 `draggable=\"true\"`。\n\n```html\n<div draggable=\"true\"\
  >这是一个可拖拽的元素。</div>\n```\n\n- 拖放事件：这些是 DnD API 提供的主要事件，它们让我们能够控制拖放的生命周期。\n  - `dragstart`：当用户开始拖拽元素时触发。\n\
  \  - `drag`：当元素正在被拖拽时触发。\n  - `dragend`：当用户释放元素时触发。\n  - `dragenter`：当被拖拽的元素进入一个放置目标时触发。\n\
  \  - `dragover`：当被拖拽的元素位于一个放置目标上方时触发（多次触发）。\n  - `dragleave`：当被拖拽的元素离开一个放置目标时触发。\n\
  \  - `drop`：当被拖拽的元素被放置到放置目标上时触发。\n\n---\n\n### 为我们的可排序列表实现拖放\n\n#### 1. 将项目设置为可拖拽\n\
  \n每个你希望可拖拽的列表项都应设置 `draggable` 属性为 `true`。假设你有一个这样的列表：\n\n```html\n<ul id=\"sortable-list\"\
  >\n  <li draggable=\"true\">项目 1</li>\n  <li draggable=\"true\">项目 2</li>\n  <!--\
  \ ... -->\n</ul>\n```\n\n#### 2. 添加事件监听器\n\n现在，我们将附加事件监听器来处理拖放操作。\n\n```javascript\n\
  const listItems = document.querySelectorAll('sortable-list li');\n\nlistItems.forEach(item\
  \ => {\n  item.addEventListener('dragstart', handleDragStart);\n  item.addEventListener('dragover',\
  \ handleDragOver);\n  item.addEventListener('drop', handleDrop);\n  item.addEventListener('dragleave',\
  \ handleDragLeave);\n});\n```\n\n#### 3. 处理拖拽开始\n\n当拖拽开始时，我们将在事件上设置一些数据，以识别正在拖拽的内容。\n\
  \n```javascript\nfunction handleDragStart(e) {\n  e.dataTransfer.setData('text/plain',\
  \ e.target.id);\n  setTimeout(() => {\n    e.target.classList.add('hidden');\n \
  \ }, 0);\n}\n```\n\n`hidden` 类可以是一个简单的样式，用于在视觉上隐藏项目，例如：\n\n```css\n.hidden {\n \
  \ display: none;\n}\n```\n\n#### 4. 处理拖拽悬停\n\n默认情况下，大多数元素上禁止放置。要允许放置，我们需要阻止事件的默认行为。\n\
  \n```javascript\nfunction handleDragOver(e) {\n  e.preventDefault();\n  e.target.classList.add('over');\n\
  }\n```\n\n`over` 类可以作为放置位置的样式提示，指示元素将被放置的位置。\n\n#### 5. 处理放置\n\n这就是奇迹发生的地方！在这里，我们将根据项目被放置的位置重新排列列表。\n\
  \n```javascript\nfunction handleDrop(e) {\n  e.preventDefault();\n  const draggedId\
  \ = e.dataTransfer.getData('text/plain');\n  const draggedItem = document.getElementById(draggedId);\n\
  \  const dropTarget = e.target;\n\n  // 将被拖拽的项目插入到放置目标之前\n  dropTarget.parentNode.insertBefore(draggedItem,\
  \ dropTarget);\n  draggedItem.classList.remove('hidden');\n}\n```\n\n#### 6. 处理拖拽离开\n\
  \n当可拖拽项目离开一个潜在的放置目标时，我们希望移除任何表明该放置目标处于活动状态的指示。\n\n```javascript\nfunction handleDragLeave(e)\
  \ {\n  e.target.classList.remove('over');\n}\n```\n\n---\n\n## 结论\n\n拖放 API 提供了一种强大的方式，可以在你的\
  \ Web 项目中实现直观的交互。借助此 API，我们可以创建视觉上吸引人的界面，让用户能够直接操作屏幕上的元素，从而带来更具动态性和参与感的用户体验。\n\n\
  ---\n\n## 检查顺序\n\n在掌握了在可排序列表中拖放项目的技巧后，下一步关键任务是检查项目的顺序。这确保用户能收到关于其操作的反馈，从而使可排序列表具有交互性和直观性。\n\
  \n在本章中，我们将重点放在确定项目排序后的正确顺序上。我们将逐步创建一个函数来验证顺序，然后根据用户的排序表现提供反馈。\n\n---\n\n### 前提条件\n\
  \n在深入代码之前，请确保：\n\n- 你已经拥有前几章中实现的拖放功能。\n- 你有一个预定义的列表项正确顺序，用于进行比较。\n\n---\n\n### 设置正确顺序\n\
  \n为了本教程的方便，假设我们的列表代表行星距离太阳的顺序：\n\n```javascript\nconst correctOrder = ['水星', '金星',\
  \ '地球', '火星', '木星', '土星', '天王星', '海王星'];\n```\n\n---\n\n### 检查顺序\n\n当用户完成列表排序后，我们需要对照\
  \ `correctOrder` 数组检查顺序。\n\n```javascript\nfunction checkOrder() {\n  const listItems\
  \ = document.querySelectorAll('li');\n  let isCorrect = true;\n\n  listItems.forEach((item,\
  \ index) => {\n    if (item.textContent !== correctOrder[index]) {\n      isCorrect\
  \ = false;\n    }\n  });\n\n  return isCorrect;\n}\n```\n\n在这个函数中：\n\n- 我们首先选择所有\
  \ `li` 元素。\n- 我们初始化一个变量 `isCorrect` 为 `true`。\n- 然后我们遍历每个列表项，将其文本内容与正确顺序进行比较。如果有任何不匹配，我们将\
  \ `isCorrect` 设置为 `false`。\n\n---\n\n### 提供反馈\n\n一旦我们确定了顺序是否正确，就需要向用户提供反馈。\n\n```javascript\n\
  function provideFeedback() {\n  const isOrderCorrect = checkOrder();\n\n  if (isOrderCorrect)\
  \ {\n    alert(\"恭喜！你已正确排序列表。\");\n  } else {\n    alert(\"哎呀！看起来不太对。再试一次。\");\n\
  \  }\n}\n```\n\n现在，我们将在每次列表项被放置时调用 `provideFeedback`。\n\n---\n\n### 将反馈函数连接到拖放操作\n\
  \n更新你的 `drop` 事件监听器：\n\n\n\n\n\n```javascript\nlistItem.addEventListener('drop',\
  \ function(e) {\n  // ... existing drag & drop logic ...\n  provideFeedback();\n\
