  \ 获取实时汇率。敬请期待！\n\n# 初识 JSON 与 Fetch\n\n在本章中，我们将深入探讨现代 Web 开发中的两个关键概念：JSON 和 Fetch\
  \ API。在构建汇率计算器的过程中，我们将依赖这些工具来获取和处理外部数据。通过理解它们的基础知识，你将能更好地创建动态、数据驱动的 Web 应用。\n\n\
  ## 什么是 JSON？\n\nJSON 代表 JavaScript 对象表示法（JavaScript Object Notation）。它是一种轻量级的数据交换格式，易于人类读写，也易于机器解析和生成。JSON\
  \ 是一种文本格式，与任何语言无关，因此成为客户端与服务器之间或应用不同部分之间数据交换的理想格式。\n\n一个 JSON 对象看起来像这样：\n\n```json\n\
  {\n\"name\": \"John\",\n\"age\": 30,\n\"city\": \"New York\"\n}\n```\n\n### JSON\
  \ 的主要特性：\n\n1. 可读性：JSON 结构直观，便于人类读写。\n2. 通用性：大多数编程语言（包括 JavaScript）都内置了对 JSON 的支持。\n\
  3. 灵活性：JSON 可以表示多种数据结构，包括对象、数组和基本数据类型。\n\n## Fetch API 简介\n\nFetch API 提供了一个用于获取资源的接口，包括跨网络获取。与较旧的\
  \ `XMLHttpRequest` 相比，它提供了一种更现代的 Web 请求方式。使用 `fetch()`，我们可以更灵活地发起请求并处理响应，且样板代码更少。\n\
  \n### Fetch 的基本语法：\n\n```javascript\nfetch(url)\n.then(response => response.json())\n\
  .then(data => console.log(data))\n.catch(error => console.error('Error:', error));\n\
  ```\n\n## 结合 JSON 与 Fetch\n\n当我们使用 Fetch API 从服务器获取数据时，响应通常采用 JSON 格式。以下是它们结合使用的逐步分解：\n\
  \n1. 请求数据：使用 `fetch()` 函数向 API 或服务器发起请求。\n2. 处理响应：请求发出后，服务器会返回一个响应。该响应并非直接是 JSON\
  \ 格式，而是一个 `Response` 对象，其中包含可通过 `json()` 等方法提取的数据。\n3. 解析 JSON：使用 `json()` 方法，我们可以从\
  \ `Response` 对象中提取 JSON 数据。\n\n示例：\n\n```javascript\nfetch('https://api.example.com/data')\n\
  .then(response => response.json())\n.then(data => {\n// 在此处处理 JSON 数据\nconsole.log(data);\n\
  })\n.catch(error => {\nconsole.error('Error fetching data:', error);\n});\n```\n\
  \n## 实际应用：获取汇率\n\n对于我们的汇率计算器项目，我们将使用一个以 JSON 格式提供货币汇率的 API。通过 Fetch API，我们可以获取这些数据，解析\
  \ JSON，然后在应用中操作这些数据，为用户提供实时货币转换。\n\n以下是一个假设示例：\n\n```javascript\nfetch('https://api.currencyexchange.com/rates')\n\
  .then(response => {\nif (!response.ok) {\nthrow new Error('Network response was\
  \ not ok');\n}\nreturn response.json();\n})\n.then(data => {\n// 使用数据（汇率）更新应用界面\n\
  updateExchangeRates(data);\n})\n.catch(error => {\nconsole.error('There was a problem\
  \ with the fetch operation:', error.message);\n});\n```\n\n在上面的示例中，获取数据后，我们使用 `response.ok`\
  \ 属性检查响应是否成功。如果出现问题（例如服务器返回 404 或 500 状态码），我们会进行相应处理。\n\n### 总结\n\n理解 JSON 和 Fetch\
  \ API 对于现代 Web 开发至关重要。这些工具使我们能够无缝地与服务器、API 及其他外部数据源交互。在构建汇率计算器的过程中，我们将看到这些概念的实际应用——获取真实世界的数据并呈现给用户。在接下来的章节中，我们将把这些知识整合到项目中，为动态、数据驱动的\
  \ Web 应用奠定基础。\n\n### 延伸阅读与资源：\n\n- MDN Web 文档：[使用 Fetch](https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch)\n\
  - MDN Web 文档：[JSON](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON)\n\
  \n### 练习：\n\n1. 访问在线 JSON 编辑器，例如 [jsoneditoronline.org](https://jsoneditoronline.org/)。创建一个示例\
  \ JSON 结构并练习修改。\n2. 尝试使用 Fetch API。尝试从公共 API（如 [jsonplaceholder.typicode.com](https://jsonplaceholder.typicode.com/)）获取数据。分析你得到的\
  \ JSON 响应。\n\n掌握了 JSON 和 Fetch 的知识后，你现在可以更深入地投入汇率计算器项目，并应用所学内容构建一个功能性的交互式应用。\n\n\
  # 获取汇率并更新 DOM\n\n在前面的章节中，我们为汇率计算器项目打下了基础，构建了 HTML 结构并用 CSS 美化了界面。现在，我们将深入应用的核心：获取实时汇率并动态更新网页（即文档对象模型，简称\
  \ DOM）。\n\n## 1. 数据获取简介\n\n从外部源获取数据是现代 Web 应用中的常见需求。JavaScript 提供了一种名为 `fetch()`\
  \ 的内置方法用于发起 HTTP 请求，这简化了从外部源检索和发送数据的过程。\n\n## 2. Fetch API\n\nFetch API 提供了一个简单的接口用于发起网络请求和处理响应。其主要方法是\
  \ `fetch()`。\n\n### 基本语法：\n\n```javascript\nfetch(url)\n.then(response => response.json())\n\
  .then(data => console.log(data))\n.catch(error => console.error(\"There was an error!\"\
  , error));\n```\n\n- `url`：你想要获取的 URL。\n- `fetch()` 方法返回一个 Promise，该 Promise 解析为表示请求响应的\
  \ `Response` 对象。\n- `response.json()` 方法读取响应体并将其作为 JSON 对象返回。\n\n## 3. 设置汇率 API\n\
  \n对于本项目，我们将使用 `exchangerate-api`（或任何类似服务）。这是一个提供货币兑换汇率的免费服务。\n\n首先，注册并获取你的 API 密钥。\n\
  \n## 4. 发起 Fetch 请求\n\n准备好 API 密钥后，让我们获取汇率：\n\n```javascript\nconst currencyOne\
  \ = document.getElementById('currency-one');\nconst currencyTwo = document.getElementById('currency-two');\n\
  const rateElement = document.getElementById('rate');\nlet apiURL = `https://api.exchangerate-api.com/v4/latest/${currencyOne.value}`;\n\
  \nfetch(apiURL)\n.then(response => response.json())\n.then(data => {\nconst rate\
  \ = data.rates[currencyTwo.value];\nrateElement.innerText = `1 ${currencyOne.value}\
  \ = ${rate} ${currencyTwo.value}`;\n})\n.catch(error => console.error(\"Error fetching\
  \ data:\", error));\n```\n\n这里，我们获取 `currencyOne` 所选货币的最新汇率，并用 `currencyTwo` 的汇率更新\
  \ DOM。\n\n## 5. 更新 DOM\n\n获取数据后，我们的主要任务是动态更新网页。上面的代码已经显示了汇率。但为了让应用具有交互性，我们还需要转换输入的金额：\n\
  \n```javascript\nconst amountOne = document.getElementById('amount-one');\nconst\
  \ amountTwo = document.getElementById('amount-two');\n\nfetch(apiURL)\n.then(response\
  \ => response.json())\n.then(data => {\nconst rate = data.rates[currencyTwo.value];\n\
  rateElement.innerText = `1 ${currencyOne.value} = ${rate} ${currencyTwo.value}`;\n\
  // 转换金额\nconst amount = amountOne.value * rate;\namountTwo.value = amount.toFixed(2);\n\
  });\n```\n\n我们添加了代码，使用获取的汇率转换 `amountOne`，并相应地更新 `amountTwo`。\n\n## 6. 事件监听器\n\n\
  \n\n\n\n为了让我们的应用程序能够响应用户操作，让我们添加事件监听器：\n\n```javascript\ncurrencyOne.addEventListener('change',\
  \ calculate);\ncurrencyTwo.addEventListener('change', calculate);\namountOne.addEventListener('input',\
  \ calculate);\namountTwo.addEventListener('input', calculate);\n```\n\n`calculate`\
  \ 函数将调用我们的数据获取逻辑并更新 DOM。现在，每当用户更改货币类型或调整金额时，我们的应用程序都会动态获取新汇率并更新 DOM。\n\n## 7. 错误处理\n\
  \nAPI 的世界并非总是完美的。可能会出现停机，或者我们可能超出 API 请求限制。让我们添加一些基本的错误处理：\n\n```javascript\nfetch(apiURL)\n\
  .then(response => {\n    if(!response.ok) {\n        throw new Error(\"Network response\
  \ was not ok\");\n    }\n    return response.json();\n})\n.then(data => {\n    //...\
  \ 其余逻辑\n})\n.catch(error => {\n    console.error(\"There was a problem with the\
  \ fetch operation:\", error.message);\n});\n```\n\n## 8. 结论\n\n至此，我们的汇率计算器核心功能已经完成！你已成功将外部\
  \ API 集成到项目中，并使应用程序变得动态且可交互。\n\n在后续项目中，你将进一步探索异步 JavaScript，以及如何与 API 和 DOM 进行更多交互。记住，实践是关键。你构建的项目越多，就会变得越熟练。\n\
  \n> 注意：务必谨慎处理来自外部来源的数据。确保你获取的数据来自可信来源，并在使用前始终验证和清理数据。\n\n# 第 6 节：项目 5 - DOM 数组方法\
  \ | `forEach`、`map`、`filter`、`sort`、`reduce`\n\n## 项目介绍\n\n欢迎来到项目 5：DOM 数组方法探索！如果你曾对\
  \ JavaScript 在处理数组时提供的强大功能感到好奇，那么你来对地方了。本项目将带你深入探索 JavaScript 中一些最常用且基础的数组方法。\n\n\
  ### 为什么是 DOM 数组方法？\n\n数组是 JavaScript 中最基本但至关重要的数据结构之一。无论你是创建简单的项目列表、处理来自 API 的数据，还是构建更复杂的应用程序，你都会发现自己需要处理数组。JavaScript\
  \ 提供了丰富的内置方法，帮助你高效地管理和操作这些数组。\n\n但为什么要把 DOM 和数组方法结合起来呢？文档对象模型（DOM）代表了网页的结构。通过将我们对\
  \ DOM 的了解与数组方法相结合，我们可以创建动态且交互式的 Web 应用程序。本项目将展示这种组合的强大威力。\n\n### 我们将构建什么？\n\n我们将开发一个应用程序，从\
  \ API 获取随机用户数据，将其呈现在网页上，并允许用户使用各种功能与数据进行交互。以下是简要概述：\n\n- **生成随机用户**：我们将获取用户数据并在网站上展示。\n\
  - **双倍金钱**：点击按钮，我们将演示如何操作数组中的数值数据，将用户的金钱翻倍。\n- **按财富排序**：另一个交互功能，根据用户的财富进行排序。\n\
  - **显示百万富翁**：一个筛选功能，仅显示财富超过一百万的用户。\n- **计算总财富**：我们将汇总所有用户的财富，并以简洁的格式呈现。\n\n### 学习成果\n\
  \n完成本项目后，你将能够：\n\n1. **加深对数组方法的理解**：我们将深入探讨 `forEach`、`map`、`filter`、`sort` 和 `reduce`\
  \ 等方法。你不仅会了解如何使用它们，还会明白为什么以及何时使用它们。\n2. **增强 DOM 操作技能**：你将获得大量动态添加、删除和修改网页元素的实践机会。\n\
  3. **强化异步操作能力**：我们将从 API 获取数据，为你提供一个实际场景来理解 JavaScript 中的异步操作。\n4. **提升问题解决能力**：通过动手任务，你将提高逻辑思维和解决问题的能力。\n\
  \n### 先决条件\n\n为了充分利用本项目：\n\n- 需要具备 HTML、CSS 和 JavaScript 的基础知识。如果你是初学者，建议先回顾这些主题的早期章节。\n\
  - 了解如何从 API 获取数据将有所帮助。如果你不熟悉，别担心！我们会在本项目中介绍基础知识。\n- 耐心和乐于尝试的精神。有时，理解一个概念的最佳方式就是动手实践、犯错并从中学习。\n\
  \n### 开始之前的话\n\n每一位开发者，无论是新手还是专家，都会经历发现和学习的过程。本项目旨在成为你掌握 Web 开发之路上的垫脚石。虽然重点在于数组方法和\
  \ DOM 操作，但请记住，更广泛的目标是培养探索和持续学习的心态。\n\n带着热情投入，保持开放的心态，最重要的是，享受这个过程！让我们一起踏上这段激动人心的旅程。\n\
  \n## 项目 UI\n\n在 Web 开发领域，用户界面（UI）是人与机器之间交互的空间。这种交互的目标是让人类能够有效地操作和控制机器，同时机器提供反馈以帮助操作者做出决策。在“项目\
  \ 5：DOM 数组方法”中，我们的主要目标是展示一系列不同的 JavaScript 方法，为了有效地做到这一点，我们需要一个合适的 UI。\n\n本项目的目的是构建一个动态的用户仪表板，列出随机用户及其财富，并提供各种功能来操作这些数据。用户将能够为用户双倍金钱、按财富排序、筛选仅显示百万富翁以及计算总财富。让我们开始构建这个\
  \ UI 吧！\n\n### 搭建结构\n\n#### HTML 结构：\n\n1. **主容器** - 此容器将封装与项目相关的所有 UI 元素。\n2. **标题**\
