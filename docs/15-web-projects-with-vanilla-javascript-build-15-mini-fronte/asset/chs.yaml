  \n### 4. 键盘\n\n在我们的游戏中，玩家将从屏幕键盘上选择字母。让我们为这些按钮设置样式：\n\n```css\n.keyboard {\n  display:\
  \ flex;\n  flex-wrap: wrap;\n  justify-content: center;\n}\n.key {\n  margin: 5px;\n\
