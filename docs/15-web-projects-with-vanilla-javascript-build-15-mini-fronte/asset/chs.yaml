  >按财富排序</button>\n        <button id=\"calculate-wealth\">计算总财富</button>\n    </div>\n\
  </div>\n```\n\n#### 样式化 UI：\n\nCSS 结构：\n\n1. **主容器** - 居中显示在屏幕中央，并添加一些内边距以提升美观度。\n\
  2. **标题** - 我们将增大字体大小，居中对齐文本，并添加外边距以留出间距。\n3. **用户列表** - 我们将对其进行样式设置，使每个用户及其财富以整齐的行显示，并交替使用浅色和深色背景以提高清晰度。\n\
  4. **操作按钮** - 这些按钮将被设计为易于识别，并带有悬停效果以显示交互性。\n\n```css\n.main-container {\n    width:\
