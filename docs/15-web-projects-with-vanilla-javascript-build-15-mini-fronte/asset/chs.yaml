  \ CSS 的设置完成，我们的电影座位预订应用程序不仅具备了功能，而且在视觉上也具有吸引力。\n\n# 通过 UI 选择电影和座位\n\n在本章中，我们将逐步讲解创建电影座位预订应用程序核心功能的流程。我们的主要重点是理解并实现允许用户从\
  \ UI 中选择电影及其相应座位的逻辑。\n\n### 1. 创建 HTML 布局\n\n在深入研究 JavaScript 之前，请确保您的 HTML 已正确设置。在本节中，我们将设置一个包含电影及其相应价格的下拉列表，以及一个代表电影院座位的布局。\n\
  \n```html\n<div class=\"movie-container\">\n  <label>Choose a movie:</label>\n \
  \ <select id=\"movie\">\n    <option value=\"10\">Avengers: Endgame ($10)</option>\n\
  \    <option value=\"12\">Joker ($12)</option>\n    <option value=\"8\">Frozen II\
  \ ($8)</option>\n    <option value=\"9\">Ford v Ferrari ($9)</option>\n  </select>\n\
  </div>\n<ul class=\"seating-chart\">\n  <!-- Each list item represents a seat -->\n\
  \  <!-- Using data attributes to indicate seat status: available, occupied -->\n\
  \  <li class=\"seat\" data-status=\"available\"></li>\n  <!-- ... repeat for all\
  \ seats in the theater -->\n</ul>\n```\n\n### 2. JavaScript：DOM 选择\n\n首先从 DOM 中选择元素：\n\
  \n```javascript\nconst movieSelect = document.getElementById('movie');\nconst seats\
  \ = document.querySelectorAll('.seating-chart .seat[data-status=\"available\"]');\n\
  ```\n\n### 3. 监听事件\n\n现在，我们要检测用户何时选择电影或点击座位：\n\n```javascript\nmovieSelect.addEventListener('change',\
  \ updateSelectedMovie);\nseats.forEach(seat => seat.addEventListener('click', toggleSeatSelection));\n\
  ```\n\n### 4. 切换座位选择状态\n\n我们希望用户能够选择和取消选择座位。当座位被选中时，我们将更改其数据属性：\n\n```javascript\n\
  function toggleSeatSelection(e) {\n  const seat = e.target;\n  // Toggle the data-status\
  \ attribute\n  if (seat.dataset.status === 'available') {\n    seat.dataset.status\
  \ = 'selected';\n  } else {\n    seat.dataset.status = 'available';\n  }\n  // Update\
  \ a visual representation (maybe change seat color)\n  seat.classList.toggle('selected-seat');\n\
  \  // You can now also call another function to calculate and display total cost\n\
  \  updateTotalCost();\n}\n```\n\n### 5. 更新所选电影\n\n当用户选择不同的电影时，我们将存储该电影的值（价格）以便进一步计算：\n\
  \n```javascript\nlet ticketPrice = +movieSelect.value;\nfunction updateSelectedMovie(e)\
  \ {\n  ticketPrice = +e.target.value;\n  // Resetting previously selected seats\
  \ when switching movies might be a good idea\n  resetSelectedSeats();\n  updateTotalCost();\n\
  }\n```\n\n### 6. 计算总费用\n\n在选择座位和电影后，我们将提供总费用的实时更新：\n\n```javascript\nfunction updateTotalCost()\
  \ {\n  const selectedSeats = document.querySelectorAll('.seating-chart .seat[data-status=\"\
  selected\"]');\n  const numberOfSeats = selectedSeats.length;\n  const totalCost\
  \ = numberOfSeats * ticketPrice;\n  // Display this to the user using DOM manipulation\n\
  \  document.getElementById('total-cost').textContent = `$${totalCost}`;\n}\n```\n\
  \n请记住，本章侧重于前端方面。在实际应用中，您需要与后端同步以确保座位的可用性，特别是在多个用户可能尝试同时预订相同座位的场景下。\n\n## 结论\n\n\
  到目前为止，您应该已经拥有一个功能齐全的 UI，允许用户选择电影、选择心仪的座位并查看所选内容的总费用。在下一章中，我们将研究如何将这些详细信息保存到本地存储（local\
  \ storage）中，并使用保存的数据填充 UI，以增强用户体验。\n\n# 将数据保存到本地存储\n\n本地存储是现代 Web 开发的重要组成部分，尤其是当我们希望提供无缝的用户体验时。在电影座位预订项目的背景下，利用本地存储来保存用户的座位选择和电影选择是非常合理的。这样，即使他们离开页面再回来，他们的选择依然存在。\n\
  \n## 理解本地存储\n\n本地存储是一种在用户浏览器上存储数据的方法。它就像浏览器中的一个小型数据库，开发人员可以用它来存储键值对。\n\n**优点：**\n\
  - 数据在浏览器会话之间保存。\n- 没有过期时间；除非被明确删除或用户清除浏览器数据，否则数据将一直保留。\n- 与 Cookie 不同，本地存储不会在每次\
  \ HTTP 请求时发送到服务器，从而使您的应用程序运行更快、更高效。\n\n**局限性：**\n- 通常，浏览器提供 5-10MB 的存储空间。\n- 它是同步的，这意味着如果您尝试存储大量数据，它可能会阻塞主线程。\n\
  \n## 在电影座位预订应用程序中实现本地存储\n\n对于我们的项目，我们将保存所选电影及其价格，以及所选座位的索引。这样，当用户重新访问页面时，我们可以用他们的选择重新填充\
  \ UI。\n\n### 第 1 步：保存所选电影\n\n每当用户从下拉菜单中选择电影时，我们应该将该选择保存到本地存储中。\n\n```javascript\n\
  const movieSelect = document.getElementById('movie');\nmovieSelect.addEventListener('change',\
  \ (e) => {\n  const selectedMovieIndex = e.target.selectedIndex;\n  const selectedMoviePrice\
  \ = e.target.value;\n  localStorage.setItem('selectedMovieIndex', selectedMovieIndex);\n\
  \  localStorage.setItem('selectedMoviePrice', selectedMoviePrice);\n});\n```\n\n\
  ### 第 2 步：保存所选座位\n\n为了存储座位选择，我们将跟踪所选座位的索引。这些索引将代表我们 UI 中的座位。\n\n\n\n\n\n```javascript\n\
  const seats = document.querySelectorAll('.row .seat:not(.occupied)');\n\nseats.forEach((seat,\
  \ index) => {\n  seat.addEventListener('click', () => {\n    // 点击时切换选中类\n    seat.classList.toggle('selected');\n\
  \    // 保存更新后的座位选择\n    saveSelectedSeats();\n  });\n});\n\nfunction saveSelectedSeats()\
  \ {\n  const selectedSeats = document.querySelectorAll('.row .seat.selected');\n\
  \  const seatsIndex = [...selectedSeats].map(seat => [...seats].indexOf(seat));\n\
  \  localStorage.setItem('selectedSeats', JSON.stringify(seatsIndex));\n}\n```\n\n\
  注意：我们使用 `JSON.stringify()` 是因为本地存储只能存储字符串。通过将座位索引数组转换为字符串，我们可以轻松保存和检索它。\n\n## 用保存的数据填充用户界面\n\
  \n当用户再次访问我们的订票页面时，我们应该检查本地存储中是否有保存的数据，并相应地更新用户界面。\n\n### 步骤 1：设置已选电影\n\n```javascript\n\
  const selectedMovieIndex = localStorage.getItem('selectedMovieIndex');\n\nif (selectedMovieIndex\
  \ !== null) {\n  movieSelect.selectedIndex = selectedMovieIndex;\n}\n```\n\n###\
  \ 步骤 2：显示已选座位\n\n```javascript\nconst selectedSeats = JSON.parse(localStorage.getItem('selectedSeats'));\n\
  \nif (selectedSeats !== null && selectedSeats.length > 0) {\n  seats.forEach((seat,\
  \ index) => {\n    if (selectedSeats.indexOf(index) > -1) {\n      seat.classList.add('selected');\n\
  \    }\n  });\n}\n```\n\n## 结论\n\n在我们的电影座位预订项目中使用本地存储，可以确保用户友好的体验。这一功能在用户可能意外刷新或离开页面的场景中尤为重要。借助本地存储，他们的座位和电影选择得以保留，免去了重新选择的麻烦。\n\
  \n在下一章中，我们将探讨如何用本地存储中保存的数据填充用户界面，为回访用户提供无缝体验。\n\n## 用保存的数据填充用户界面\n\n欢迎回来！在上一章中，我们讨论了如何将选中的电影和座位数据保存到本地存储。现在，当用户访问电影座位预订页面时，他们应该能够看到之前选中的座位。这对于用户友好的体验至关重要。在本章中，我们将用本地存储中保存的数据填充用户界面（UI）。\n\
  \n### 1. 理解目的\n\n用保存的数据填充用户界面有助于提供无缝的用户体验。当用户返回我们的电影订票网站时，他们无需再次选择座位和电影；系统会自动显示他们之前的选择。\n\
  \n### 2. 从本地存储检索数据\n\n在填充用户界面之前，我们必须先检索保存的数据。\n\n```javascript\nconst selectedSeats\
  \ = JSON.parse(localStorage.getItem('selectedSeats'));\nconst selectedMovieIndex\
  \ = localStorage.getItem('selectedMovieIndex');\n```\n\n在上述代码中：\n- 我们从本地存储中检索 `selectedSeats`，并使用\
  \ `JSON.parse()` 将其从字符串格式解析为数组。\n- `selectedMovieIndex` 按原样检索，因为它存储为字符串。\n\n###\
  \ 3. 填充电影选择\n\n为了用保存的电影选择填充电影下拉菜单，我们使用检索到的 `selectedMovieIndex`。\n\n```javascript\n\
  const movieSelect = document.getElementById('movie');\n\nif (selectedMovieIndex\
  \ !== null) {\n  movieSelect.selectedIndex = selectedMovieIndex;\n}\n```\n\n这里，我们只需将\
  \ `movieSelect` 下拉菜单的 `selectedIndex` 属性设置为检索到的索引，并确保它不为 null。\n\n### 4. 填充座位\n\n\
  现在，让我们根据保存的选择来填充座位：\n\n```javascript\nconst seats = document.querySelectorAll('.seat:not(.occupied)');\n\
  \nif (selectedSeats !== null && selectedSeats.length > 0) {\n  seats.forEach((seat,\
  \ index) => {\n    if (selectedSeats.indexOf(index) > -1) {\n      seat.classList.add('selected');\n\
  \    }\n  });\n}\n```\n\n在这段代码中：\n- 我们首先选择所有未被占用的座位。\n- 然后检查 `selectedSeats` 是否包含数据，并遍历每个座位。\n\
  - 如果座位的索引在 `selectedSeats` 数组中，我们为该座位添加 `selected` 类，从而在视觉上标记为已选。\n\n### 5. 更新计数和总价\n\
  \n请记住，我们的用户界面还应反映已选座位的正确数量和总价。让我们确保也处理这一点。\n\n```javascript\nfunction updateSelectedCountAndTotal()\
  \ {\n  const selectedSeats = document.querySelectorAll('.row .seat.selected');\n\
  \  const count = selectedSeats.length;\n  const total = count * +movieSelect.value;\n\
  \  document.getElementById('count').innerText = count;\n  document.getElementById('total').innerText\
  \ = total;\n}\n// 在填充座位后调用此函数\nupdateSelectedCountAndTotal();\n```\n\n### 6. 最终思考\n\
  \n在开发应用程序时，始终考虑用户体验至关重要。通过用保存的数据填充用户界面，我们为用户节省了时间，并提供了连续性，尤其是当他们不得不离开页面再返回时。\n\n\
  在下一节中，我们将深入探讨自定义视频播放器以及如何利用 HTML5 Video API 的强大功能。敬请期待！\n\n# 第 4 节：项目 3 - 自定义视频播放器\
  \ | HTML5 Video API\n\n## 项目介绍\n\n在当今互联网驱动的世界中，视频内容是最强大、最有说服力的信息传递媒介之一。像 YouTube、Vimeo\
  \ 和其他媒体托管平台之所以蓬勃发展，是因为我们天生热爱视觉叙事。但是，作为一名 Web 开发者，你是否曾思考过播放按钮、音量滑块或全屏切换背后的魔力？自定义视频播放器正是这种魔力的核心。\n\
  \n欢迎来到项目 3：自定义视频播放器！这个项目不仅仅是把视频嵌入到网页中。在本模块结束时，你将创建一个根据你的设计量身定制的视频播放器，功能丰富，全部使用强大的\
  \ HTML5 Video API。\n\n## 为什么需要自定义视频播放器？\n\n1. 设计控制：你不受标准视频控件的限制。想要一个复古的音量旋钮而不是滑块？尽管去做！\n\
  2. 增强功能：添加速度控制、自定义字幕甚至视频书签系统等功能。\n3. 集成：将播放器与其他系统无缝集成，例如用于跟踪用户参与度的分析工具。\n\n## 你将学到什么？\n\
  \n- HTML5 视频元素：深入理解 `<video>` 元素、其属性及其能力。\n- 自定义控件：用你自己的播放、暂停、音量和全屏按钮替换浏览器的默认控件。\n\
  - 视频 API：利用 HTML5 Video API 以编程方式操控视频播放。\n- 样式化播放器：使用 CSS 为你的视频播放器设计样式，使其响应式且视觉吸引力强。\n\
  - 事件与交互：理解视频播放过程中触发的不同事件，并利用它们创建交互功能。\n\n## 项目概览\n\n在这个项目中，你将构建一个具有以下功能的自定义视频播放器：\n\
  \n1. 基本控件：播放、暂停、停止以及音量滑块。\n2. 播放进度：一个显示视频播放进度并允许用户跳转到不同部分的滑块。\n3. 时间戳：显示当前时间和视频总时长。\n\
  4. 全屏切换：允许用户切换到全屏模式。\n5. 响应式设计：确保播放器在所有设备上看起来都很棒。\n\n通过完成这个项目，你将深入到一个开发者在构建富媒体 Web\
  \ 应用时遇到的真实任务。无论是用于个性化作品集、定制企业应用还是媒体创业想法，掌握自定义视频播放器都是一项能让你脱颖而出的技能。\n\n\n\n\n在接下来的章节中，我们将把创建过程分解为易于理解的部分，涵盖设计、功能和最佳实践。最后，你将拥有一个功能完备的视频播放器，并掌握根据自身需求进一步定制的技能和知识。让我们开始吧！\n\
  \n# 项目 HTML\n\n欢迎来到我们项目系列的下一个激动人心的阶段！在本章中，我们将通过搭建 HTML 结构来为自定义视频播放器项目奠定基础。该播放器将利用\
  \ HTML5 视频 API，使我们能够实现播放、暂停、快进等功能。但在那之前，我们需要先构建 HTML 脚手架！\n\n## HTML5 视频元素\n\nHTML5\
  \ 引入了 `<video>` 元素，它允许我们嵌入视频文件，这些文件可以直接在浏览器中播放，无需外部插件。除了视频元素本身，我们还可以使用多种属性和子元素来增强用户体验，例如添加控件、设置海报图像，甚至为不同视频格式提供多个源文件。\n\
  \n## 搭建基本结构\n\n让我们开始为视频播放器创建 HTML 结构。\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
  en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1.0\">\n    <title>自定义视频播放器</title>\n    <!--\
  \ 你将在此处链接 CSS -->\n    <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n\
  <body>\n    <div class=\"video-container\">\n        <video id=\"video\" width=\"\
  750\" height=\"500\" controls>\n            <!-- 在此处插入你的视频源 -->\n            <source\
  \ src=\"path-to-your-video.mp4\" type=\"video/mp4\">\n            <!-- 你可以为不同视频格式提供多个源文件\
  \ -->\n            <source src=\"path-to-your-video.webm\" type=\"video/webm\">\n\
  \            <!-- 为不支持 video 标签的浏览器显示文本 -->\n            你的浏览器不支持 video 标签。\n  \
  \      </video>\n        <div class=\"controls\">\n            <button id=\"play-pause\"\
  >播放</button>\n            <input type=\"range\" id=\"volume\" min=\"0\" max=\"1\"\
  \ step=\"0.1\">\n            <button id=\"full-screen\">全屏</button>\n          \
  \  <span id=\"time\">00:00 / 00:00</span>\n        </div>\n    </div>\n    <!--\
  \ 你将在此处链接 JavaScript -->\n    <script src=\"script.js\"></script>\n</body>\n</html>\n\
  ```\n\n## 代码解释\n\n-   视频容器：这是一个包裹 `div`，包含视频及其自定义控件。它将有助于样式设置和定位。\n-   视频元素：我们在\
  \ `<video>` 标签内提供了两个 `<source>` 元素。这是为了确保跨浏览器的最大兼容性。不同浏览器可能支持不同的视频格式，因此通过提供多种格式，我们确保大多数用户都能观看视频。\n\
  \    `controls` 属性存在时，会显示视频播放器的默认浏览器控件。虽然我们将构建自己的自定义控件，但在设置阶段，这对于确保视频正确加载非常有用。\n\
  -   自定义控件：在视频下方，我们有一个类名为 `controls` 的 `div`。它将包含我们视频播放器的自定义控件，包括：\n    -   播放/暂停按钮：用于播放或暂停视频的切换按钮。\n\
  \    -   音量控制：用于调整视频音量的输入范围滑块。\n    -   全屏按钮：用于切换全屏模式的按钮。\n    -   时间显示：一个 `span`，用于显示视频的当前时间和总时长。\n\
  \n## 结论\n\n设置 HTML 是创建自定义视频播放器的第一步。这个结构为我们后续构建样式和功能提供了基础。在接下来的章节中，我们将专注于使用 CSS 为这个结构设置样式，然后使用\
  \ JavaScript 实现视频控件。目标是创建一个既实用又美观的播放器，为用户提供增强的视频播放体验。\n\n# 项目 CSS\n\n欢迎回来！既然我们在上一章中已经为自定义视频播放器搭建了\
  \ HTML 结构，现在是时候为其设置样式，赋予它一个吸引人的外观了。CSS 是网页美学的支柱。在本章中，我们将专注于让我们的视频播放器不仅功能完善，而且用户友好、视觉美观。\n\
  \n## 1. 基础重置\n\n首先，让我们重置一些默认样式。这将有助于我们在不同浏览器之间保持一致性。\n\n```css\n* {\n    margin:\
  \ 0;\n    padding: 0;\n    box-sizing: border-box;\n}\n```\n\n## 2. 设置容器\n\n我们的视频播放器将位于一个容器内。该容器将容纳视频和控制栏。\n\
  \n```css\n.video-container {\n    width: 80%;\n    max-width: 800px;\n    margin:\
  \ 40px auto;\n    position: relative;\n    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);\n\
  }\n```\n\n## 3. 设置视频元素样式\n\n`<video>` 元素将占据其容器的整个宽度。我们还会给它一个固定的高度。\n\n```css\nvideo\
  \ {\n    width: 100%;\n    height: 450px;\n    display: block;\n}\n```\n\n## 4.\
  \ 视频控件\n\n在视频下方，我们将放置自定义控件，包括播放/暂停按钮、进度条、音量控制和全屏切换。\n\n```css\n.video-controls {\n\
  \    display: flex;\n    align-items: center;\n    justify-content: space-between;\n\
  \    background-color: 333;\n    color: fff;\n    padding: 10px 15px;\n}\n```\n\n\
  ### 4.1 按钮\n\n所有按钮将具有一致的样式。\n\n```css\n.video-controls button {\n    background:\
  \ none;\n    border: none;\n    color: fff;\n    font-size: 16px;\n    margin-right:\
  \ 15px;\n    cursor: pointer;\n}\n```\n\n对于任何激活或悬停状态：\n\n```css\n.video-controls\
  \ button.active,\n.video-controls button:hover {\n    color: ff6347;\n}\n```\n\n\
  ### 4.2 进度条\n\n进度条将显示视频已播放了多少。\n\n```css\n.progress-bar {\n    flex: 1;\n    height:\
  \ 5px;\n    background-color: 555;\n    margin: 0 10px;\n    position: relative;\n\
  }\n```\n\n对于已播放的部分：\n\n```css\n.progress-bar span {\n    display: block;\n    height:\
  \ 100%;\n    background-color: ff6347;\n    position: absolute;\n    left: 0;\n\
  \    top: 0;\n    width: 0%; /* 这将通过 JavaScript 动态更新 */\n}\n```\n\n### 4.3 音量控制\n\
  \n```css\n.volume {\n    display: flex;\n    align-items: center;\n}\n.volume-slider\
  \ {\n    width: 100px;\n    margin-left: 10px;\n}\n```\n\n## 5. 全屏样式\n\n在全屏模式下，我们希望视频占据整个视口。\n\
  \n```css\nvideo:-webkit-full-screen {\n    width: 100vw;\n    height: 100vh;\n}\n\
  video:fullscreen {\n    width: 100vw;\n    height: 100vh;\n}\n```\n\n至此，我们完成了自定义视频播放器的样式设置。如你所见，只需少量\
  \ CSS，我们就将原始的 HTML 结构转变成了一个视觉美观且用户友好的视频播放器。在下一章中，我们将深入探讨如何使用 HTML5 视频 API 和 JavaScript\
  \ 让这个播放器具备功能。\n\n**注意：** 始终记得在不同浏览器中测试你的样式，以确保兼容性和外观一致性。可能需要根据特定浏览器的特性进行调整。\n\n\
  # 播放、暂停与停止\n\n欢迎回来，亲爱的读者们！在本章中，我们将深入探讨自定义视频播放器的核心功能：播放、暂停和停止。这些是任何媒体播放器基本但至关重要的控件，借助\
  \ HTML5 视频 API，实现它们相当直接。\n\n## HTML5 视频 API 简介\n\n在深入编码部分之前，理解 HTML5 视频 API 的强大功能至关重要。该\
  \ API 提供了一种以编程方式访问和操作通过网页中 `<video>` 元素播放的视频内容的方法。它公开了方法和属性，允许开发者播放、暂停、调整音量，甚至检查视频是否已结束。\n\
  \n对于我们的自定义视频播放器，我们将主要关注以下方法：\n\n1.  `play()`：开始播放视频。\n2.  `pause()`：暂停当前正在播放的视频。\n\
  3.  `currentTime`：表示当前播放时间（以秒为单位）。它既是 getter 也是 setter，意味着你可以将其设置为特定值，以跳转到视频中的该时间点。\n\
  \n## 设置 HTML\n\n\n\n\n\n# 视频播放器实现\n\n假设你的视频播放器具有以下 HTML 结构：\n\n```html\n<div class=\"\
  video-container\">\n  <video id=\"videoPlayer\" width=\"640\" height=\"360\" controls>\n\
  \    <source src=\"path_to_your_video.mp4\" type=\"video/mp4\">\n    您的浏览器不支持 video\
  \ 标签。\n  </video>\n  <div class=\"controls\">\n    <button id=\"playBtn\">播放</button>\n\
  \    <button id=\"pauseBtn\">暂停</button>\n    <button id=\"stopBtn\">停止</button>\n\
  \  </div>\n</div>\n```\n\n## 实现播放、暂停和停止功能\n\n1. **播放视频**：\n要播放视频，我们需要定位视频元素并调用 `play()`\
  \ 方法。\n\n```javascript\nconst video = document.getElementById('videoPlayer');\n\
  document.getElementById('playBtn').addEventListener('click', function() {\n  video.play();\n\
  });\n```\n\n2. **暂停视频**：\n暂停视频同样简单。定位视频元素并调用 `pause()` 方法。\n\n```javascript\ndocument.getElementById('pauseBtn').addEventListener('click',\
  \ function() {\n  video.pause();\n});\n```\n\n3. **停止视频**：\n停止视频包含两个步骤：\n1. 暂停视频。\n\
  2. 将视频的 `currentTime` 重置为 `0`（即开头）。\n\n```javascript\ndocument.getElementById('stopBtn').addEventListener('click',\
  \ function() {\n  video.pause();\n  video.currentTime = 0;\n});\n```\n\n## 通过播放/暂停切换增强用户体验\n\
  \n通常，视频播放器会将播放和暂停功能合并到一个按钮中。让我们为此创建一个切换函数：\n\n1. **修改 HTML**：\n```html\n<button\
  \ id=\"togglePlayPauseBtn\">播放</button>\n```\n\n2. **JavaScript**：\n```javascript\n\
  const togglePlayPauseBtn = document.getElementById('togglePlayPauseBtn');\ntogglePlayPauseBtn.addEventListener('click',\
  \ function() {\n  if (video.paused) {\n    video.play();\n    togglePlayPauseBtn.innerText\
  \ = \"暂停\";\n  } else {\n    video.pause();\n    togglePlayPauseBtn.innerText =\
  \ \"播放\";\n  }\n});\n```\n\n### 总结\n\n借助 HTML5 Video API，实现播放、暂停和停止功能变得轻而易举。该 API\
  \ 提供了丰富的方法和属性，帮助开发者创建功能强大且特性丰富的视频播放器。\n\n在下一章中，我们将深入探讨如何通过添加进度条和时间戳来增强视频播放器的用户体验，让用户能够直观地看到播放状态和视频时长。\n\
  \n记住，熟能生巧！大胆尝试修改代码，探索不同的功能，让这个视频播放器真正属于你。祝你编码愉快！\n\n# 视频进度条与时间戳\n\n欢迎来到第 19 章！在本章中，我们将探索自定义视频播放器的两个关键元素——进度条和时间戳。这两者都能提升用户体验，让观看者了解视频的进度并控制播放。\n\
  \n## 1. 理解 Video API\n\n在深入编码之前，有必要先了解一下 HTML5 Video API。Video API 提供了诸如 `currentTime`（当前播放位置，以秒为单位）和\
  \ `duration`（视频总时长，以秒为单位）等属性。这些属性对于我们的进度条和时间戳功能至关重要。\n\n## 2. HTML 结构\n\n对于我们的自定义视频播放器，假设你已经从之前的章节中获得了以下基本\
  \ HTML 结构：\n\n```html\n<video id=\"video\" width=\"750\" controls>\n  <source src=\"\
  path_to_video.mp4\" type=\"video/mp4\">\n</video>\n<div id=\"video-controls\">\n\
  \  <div id=\"progress-bar\">\n    <div id=\"progress\"></div>\n  </div>\n  <span\
  \ id=\"timestamp\">00:00 / 00:00</span>\n</div>\n```\n\n这里，`progress-bar` 是容器，`progress`\
  \ 是填充条，用于显示视频播放进度。`timestamp` 将显示当前时间和视频总时长。\n\n## 3. 进度条的 CSS\n\n在添加功能之前，确保进度条外观正确：\n\
  \n```css\n.progress-bar {\n  width: 90%;\n  height: 5px;\n  background: #e0e0e0;\n\
  \  margin: 10px auto;\n  position: relative;\n}\n.progress {\n  height: 5px;\n \
  \ background: #007BFF;\n  width: 0;\n}\n```\n\n## 4. JavaScript 功能\n\n现在，让我们进入有趣的部分——JavaScript！\n\
  \n### a. 进度条\n我们希望进度条随着视频播放而填充：\n\n```javascript\nconst video = document.getElementById('video');\n\
  const progressBar = document.getElementById('progress-bar');\nconst progress = document.getElementById('progress');\n\
  video.addEventListener('timeupdate', updateProgressBar);\n\nfunction updateProgressBar()\
  \ {\n  const percentage = (video.currentTime / video.duration) * 100;\n  progress.style.width\
  \ = `${percentage}%`;\n}\n```\n\n### b. 时间戳\n更新时间戳：\n\n```javascript\nconst timestamp\
  \ = document.getElementById('timestamp');\nvideo.addEventListener('timeupdate',\
  \ updateTimestamp);\n\nfunction updateTimestamp() {\n  const minutesCurrent = Math.floor(video.currentTime\
  \ / 60);\n  let secondsCurrent = Math.floor(video.currentTime % 60);\n  if (secondsCurrent\
  \ < 10) {\n    secondsCurrent = '0' + secondsCurrent;\n  }\n  const minutesDuration\
  \ = Math.floor(video.duration / 60);\n  let secondsDuration = Math.floor(video.duration\
  \ % 60);\n  if (secondsDuration < 10) {\n    secondsDuration = '0' + secondsDuration;\n\
  \  }\n  timestamp.textContent = `${minutesCurrent}:${secondsCurrent} / ${minutesDuration}:${secondsDuration}`;\n\
  }\n```\n\n## 5. 跳转功能\n\n让我们添加用户点击进度条跳转到视频不同部分的功能：\n\n```javascript\nprogressBar.addEventListener('click',\
  \ setVideoProgress);\n\nfunction setVideoProgress(e) {\n  const clickPosition =\
  \ e.offsetX;\n  const width = progressBar.offsetWidth;\n  const clickPercentage\
  \ = (clickPosition / width);\n  video.currentTime = clickPercentage * video.duration;\n\
  }\n```\n\n## 6. 回顾\n\n至此，你已经拥有了一个功能性的进度条，它会随着视频播放而填充，并且时间戳会实时更新。用户还可以点击进度条跳转到视频的任意位置，从而增强了用户对播放的控制和体验。\n\
