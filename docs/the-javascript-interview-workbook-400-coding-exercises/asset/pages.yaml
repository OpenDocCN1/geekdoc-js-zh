    # 3.4 this keyword


    The **this** keyword can cause confusion among beginner and more advanced developers
    alike. In order to understand **this**, it is imperative to understand what execution
    context means.


    In JavaScript, **this** is a reference to an object. The object that **this**
    will depend on whether it is within the global context, inside an object, or within
    a constructor. We can also explicitly define the value of **this** with prototype
    methods such as `apply()`, `call()` and `bind()`.


    When a function is called, an execution context is created. The execution context
    contains information about the environment within which the current block of code
    is being executed. This information includes where the function has been called
    from, its parameters, how the function is invoked and what contingent upon this
    a binding to **this** is made


    > Function declaration does not matter , how a function is called is what matters.


    How a function is called refers to its **runtime binding** and this, what is determines
    the value of the **this** keyword.


    We have a look at four different ways of determining the value of **this** by
    examining its binding.


    # 3.4.1 Global (default) binding


    **this** refers to the global object (window) in the global execution context,
    when not in **strict mode**. For example:


    ```

    function globalContext() {


    console.log(this); // [object Window]

    }

    globalContext();

    ```'
