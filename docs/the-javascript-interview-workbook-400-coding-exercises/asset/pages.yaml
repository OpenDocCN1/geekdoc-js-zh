    # 1.3.1.1 Operator Precedence


    In an expression operators with higher precedence over others will be evaluated
    first.


    As an example, the multiplication operator has higher precedence than the addition
    operator. This is demonstrated in the following expression:


    ```

    let x = 2 + 3 * 6;

    x = 2 + 18;

    x = 20;

    ```


    Multiplication takes place first, therefore 3 is multiplied by 6 which equals
    the number 18. And then 2 is added to 18 which returns 20.


    While you are not expected to memorize the precedence order of operators, it is
    an important consideration while evaluating an expression.


    This table displays the precedence orders of operators:


    | Precedence | Operator | Symbol |

    | --- | --- | --- |

    | 1 | Parenthesis | () |

    | 2 | Unary | ++, --, ~, delete, new, typeof,

    | 3 | Multiplicative | *, /, % |

    | 4 | Additive | +, - |

    | 5 | Shift | <<, >> |

    | 6 | Relational | <, >, >= |

    | 7 | Equality | ==, !=, ===, !== |

    | 8 | Bitwise | &, ^ |

    | 9 | Logical | &&, || |


