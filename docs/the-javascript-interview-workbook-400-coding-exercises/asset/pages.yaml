  md: '# 4.1.3 Array values


    Arrays can hold primitive values and reference data types. We will practice problems
    with primitive and reference data types such as arrays and objects.


    # Exercises


    +   1. What is the fundamental difference between an array and an object?


    # Answers


    +   1. In an array items are ordered by indices. Whereas, objects represent a
    group of items in unordered key : value pairs


    # 4.2 Array declaration


    An array can be declared in the following ways:


    +   1. Array literal notation

    2. Array() constructor

    3. Array.of() method


    We will go over these methods of array declaration and finish off by discussing
    the different types of values that an array can hold. Along the way we will also
    do accessing array and inserting values.


    # 4.2.1 Array literal notation


    You can declare a variable to be a reference to an array using the [] brackets
    as demonstrated below:


    ```

    let fruitArray = [];

    ```


    The fruitArray is empty as it has no items inside it. We can add items in the
    array by specifying their values. Each item in the array is separated by a comma:
    Indexes are zero based, therefore the first item in the array which is ''mango''
    is at index 0. The second item ''apple'' is at index 1 and so. The last item in
    the array ''watermelon'' is at index 4:


    ```

    fruitArray = [''mango'', ''apple'', ''grapes'', ''blueberry'', ''watermelon''];

    ```


    Logging the fruitArray to the console we will get:


    ```

    console.log(fruitArray);

    ["mango", "apple", "grapes", "blueberry", "watermelon"]

    ```


    Therefore, all the string items of the fruitArray are displayed, each separated
    by a comma except for the last item.


    To access an item in the array use the [] brackets with the index number specified.
    For example let''s access the item at index 2:


    ```

    console.log(fruitArray[2]);

    ```


    The item at index 2 is the third item in the array since remember, an array starts
    at index 0:'
