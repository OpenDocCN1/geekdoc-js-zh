    # # Summary


    In this chapter, we learned about the call stack, execution context, and the event
    loop. Since JavaScript only handles one task at a time, the call stack which follows
    the LIFO (Last In Out) principle determines execution order. Moving on, we discussed
    execution context which describes the environment within which JavaScript code
    is executed. It will dictate if a variable, object, or another block of code is
    accessible or not. We also learned about the two types of execution contexts:
    global and function. Lastly, we learned about the event loop which is the process
