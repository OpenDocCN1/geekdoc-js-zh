  md: '# DOM POWER-7


    > “Calling should be a pointer for your skill development” — S. Adeleja


    Document Object Model


    DOM stands for Document Object Model. It is extremely important when it comes
    to accessing HTML elements and manipulating them via JavaScript. This is a relatively
    shorter chapter; however don''t let that fool you, as there are lots of practice
    exercises. Knowledge and practical experience of DOM manipulation are important
    for frontend developers. As it will allow you to make more dynamic frontend web
    applications for your portfolio. React.js and Vue.js which make state management
    much easier.


    We''re going to cover the main topics:


    +   * What is the DOM?

    * Properties of the DOM

    * DOM methods

    * Iterating through DOM nodes


    # 7.1 What is the DOM?


    The DOM often be a source of confusion for beginners. This is because beginners
    know the basics of JavaScript but they cannot quite fill in the dots on how to
    use JavaScript to build functionality into their websites or web applications
    using the DOM API. To understand the DOM let'' first understand its purpose. Put
    simply the DOM allows you to access and manipulate HTML elements on webpages.
    You can add, delete, and change HTML elements via the DOM API using JavaScript.
    Therefore, knowing what DOM methods and properties to allow you to build functionalities
    such as adding items to a shopping cart, toggling signup/login buttons, etc. All
    these dynamic functionalities are part of what is known as state management. State
    management refers to the state of the components (elements) on a webpage. For
    example, a signup button can have a visible state when the user is not logged
    in. The same signup button can have an invisible state when the user logs in and
    is hidden. Now that we know the purpose of the DOM, this brings us to the next
    question what is the DOM?


    The DOM broadly has two purposes:


    +   * It defines the logical structure of an HTML document for example index.html

    * Dictates how the elements within an HTML document can be accessed and modified'
  merge: -1
  pgno: 349
- img_proc: true
  md: "The Document Object Model is a web API that allows you to access and manipulate\
    \ a webpage's content, structure, and styles. It is an object-based representation\
    \ of a source document's HTML elements, created by the browser when it parses\
    \ a webpage. All the elements in an HTML document are represented in a family\
    \ tree-like manner called a \"node tree\". It is called a node tree because we\
    \ can visualize it as a tree with a single root and many branches and leaves.\n\
    \nLet's have a look at what this means. Take as an example the following HTML\
    \ document (index.html):\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>The\
    \ DOM</title>\n</head>\n<body>\n  <h1>Hello JavaScript Dev!</h1>\n  <p>Random\
    \ text</p>\n</body>\n</html>\n```"
  merge: -1
  pgno: 350
- img_proc: true
  md: 'Each HTML element inside index.html will be represented in the DOM as a node:


    ![](img/b565ac948bd35e932b90037e76b71eca_351_0.png)


    The DOM includes the content of a webpage in addition to all elements. However,
    we normally leave out drawing/representing the content.


    # Pictorial representation of the DOM


    An important point to keep in mind is these nodes are objects. The documents that
    are parsed by the browser becomes a document object, this is the root node. All
    other nodes such as HTML, body, are child nodes. And from Chapter 3, we know that
    objects have properties and methods. The same way these nodes can be manipulated
    via DOM properties and methods. This is how you can perform CRUD (create, read,
    update, and delete) on DOM elements.


    If you''d like to visualize the DOM you can do by using the Live DOM Viewer at
    https://softwaretree.com/live-dom-viewer in the next section we will cover some
    DOM properties.


