    # 5.1 Destructuring Arrays


    Destructuring is an ES6 feature. Destructuring allows you to unpack the values
    from arrays and assign them to individual variables. This allows for a more direct
    way of accessing array items. Let''s have a look at what destructuring manually
    means:


    ```

    let alphabet = [''a'', ''b'', ''c'', ''d'', ''e'', ''f''];

    ```


    In order to assign the value of the first element from alphabet to a variable,
    this is what we would do:


    ```

    let firstEl = alphabet[0];

    ```


    And then to assign the second array element from alphabet to a variable, we would
    access its value at index 1:


    ```

    let secondEl = alphabet[1];

    ```


    Logging firstEl and secondEl variables we get:


    ```

    console.log(firstEl, secondEl);

    ```


    ```

    "a" "b"

    ```


    Imagine that we would like to do this for all the array elements in the alphabet,
    a bit tiresome to do this for each of the array elements. In this case, destructuring
    will be useful as it will allow you to unpack the values from the array into individual
    variables. And this is how we would do it:


    ```

    let [firstEl, secondEl, thirdEl, fourthEl, fifthEl, sixthEl] = alphabet;

    ```'
