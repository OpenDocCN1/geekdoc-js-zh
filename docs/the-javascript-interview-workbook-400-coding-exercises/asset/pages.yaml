    2. Create an empty array items and initialize it with values of 5 different data
    types. What is the length of the array?

    3. What method can be used to determine whether a given object is an array?


    # Answers


    +   1. Array literal syntax, Array() constructor and Array.of() method

    2. items array:

    let items = [''hello'', {id: 1}, true, null, 10];nThe length of the array is 5
    since it has 5 items.

    3. Determine whether a given object is an array:

    Array.isArray(value)


    # 4.2.2 Array() constructor


    The new keyword used along with Array() constructor function will initialize a
    new array with a flexible size. For example:


    ```

    let fruitArray = new Array();

    ```


    If the number of array items are known, the number can be passed as a parameter
    to the Array constructor:


    ```

    fruitArray = new Array(5);

    ```


    This will create an array with five indices/slots logging the length property
    of the fruitArray:


    ```

    console.log(fruitArray.length); // 5

    ```'
