    Arrays are extremely useful data structures that store ordered values of multiple
    data types. In this section, you will go over the fundamentals of arrays. You
    will read about new array features added toJavaScript from ES-ES10. Knowing how
    to manipulate arrays will help you solve complex problems easily. By the end of
    this section you will be proficient enough to delve deeper into arrays and use
    them proficiently. Do not skip the coding exercises in this chapter as they provide
    grounding for the next chapter using advanced methods.


    We''re going to cover the following main topics:


    +   * Array declaration

    * Array properties

    * Array methods


    # 4.1 Arrays in JavaScript


    # 4.1.1 Definition


    Arrays are an object data type used to represent an ordered list of elements.
    You can traverse a list of items in array, access an individual item in the array,
    and use one of the methods provided by JavaScript to mutate an array. The `typeof`
    array is `Object`. An object is a collection of unordered `key:value` pairs. Whereas,
    an array is a collection of ordered values wherein values have an index/position
    rather than key names.


    # 4.1.2 Indexing in arrays


    | index | 0 | 1 | 2 | 3 |

    |---|---|---|---|---||

    | item | item a | item b | item c | item d |


    Indexing is number based. In the diagram above items `a-d` are positioned at `0,
    1, 2` and `3` respectively. The index of an array starts at zero. This means that
    the position of the first item in an array will be at index 0. Moving on, next
    will be index 1, index 2 etc.'
