    \ item) {\n        return(item * 8);\n    });\n\nmultiplier(1, 8, 2, 10, 9); //\
    \ 8, 64, 16, 80, 72\n```\n\n# 6.8 Callback functions\n\n# 6.8.1 Introduction\n\
    \nJavaScript is considered to be synchronous i.e. single-threaded. This means\
    \ one line of code is executed at a time. It cannot multi-task and move on to\
    \ the next line or block of code until the current line or block has been executed.\
    \ Therefore, if you have a function that has to perform some"
