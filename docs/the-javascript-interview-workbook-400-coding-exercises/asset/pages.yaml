    # 1.2.9 Why can we use methods such as toUpperCase() on primitive data types?


    You may have heard of the very popular saying "Everything in JavaScript is an
    object". This is because JavaScript readily coerces primitives between objects,
    subsequently allowing you to use methods such as toUpperCase() on string data
    type. Except for Null and Undefined data types, all primitives have an associated
    object equivalent.


    Let me backtrack a bit here and explain what a method is. Method is a function
    associated with an object. A primitive will be coerced to an object so that methods
    like toUpperCase() can be used on them.


    First, let us examine the statement "JavaScript readily coerces between primitives
    and objects" by analyzing the code below:


    ```

    let num1 = Number(1);

    let num2 = num1 + 2;

    console.log(num2); // 3

    console.log(typeof(num1)); // object

    console.log(typeof(num2)); //number

    ```


    The Number constructor functions a wrapper around variable num1 and is coerced
    into the primitive type. The value of the object wrapper num1 is the primitive
    that we wrap around i.e. When we use the typeof operator to check num1 and num2
    we get object and number. Hence, the object coerced to the primitive number type
    is which num2 = 3.


    Upon applying a method or accessing the property of a primitive for example a
    string or boolean, a new temporary object is created using the appropriate constructor
    function. A constructor starts with the new keyword followed by the primitive
    data type. To illustrate this, look at the following code:


    ```

    console.log(typeof("love\));//string

    console.log(typeof(new String("universe"))));//object

    ```'
