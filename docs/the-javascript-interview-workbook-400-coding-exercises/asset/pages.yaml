    # 3.8.2 Copying objects with deep copy


    The JSON.stringify and JSON.parse methods can be used to deep copy an object.
    In a deep copy, the source and target objects have different memory addresses
    and are not connected at all. The JSON.stringify() method will take a JavaScript
    object as an argument and transform it into a string. The JSON.parse() method
    will parse the JavaScript string and return a JavaScript object.


    For example an object called object1 has a nested object called division:


    ```

    let object1 = {

    role: ''HR'',

    division: {

    management: ''HR Recruiter'',

    },

    }

    ```


    The object is first transformed into a string and then this string will be parsed
    and converted into an object being returned:


    ```

    let object2 = JSON.parse(JSON.stringify(object1));

    console.log(object2);

    ```


    object2 now has the role property including the nested management property copied
    over it:


    ```

    [object Object] {

    division: [object Object] {

    management: "HR Recruiter"

    },

    role: "HR"

    }

    ```


    237'
