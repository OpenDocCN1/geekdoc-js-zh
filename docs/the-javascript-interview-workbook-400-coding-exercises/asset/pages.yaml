    # ## 6.2 Functions


    Functions are a block of code assigned to certain functionality in your program.
    The functionality afforded by these blocks of code can be used repeatedly without
    needing to re-write them. You may be accustomed to using methods that are in-built
    functions of the window object such as alert() and confirm().


    # ### 6.2.1 Function declaration


    Making a function is known as a function declaration. Just as making a variable
    is known as a variable declaration. To declare a function, use the function keyword
    followed by the name of the function, followed by parenthesis (). Any statements
    of code inside a function are enclosed within curly braces {}.


    Syntax:


    ```

    function function() {

    //statements of code inside the function block

    }

    ```


    The above is known as a function statement. The content of the function is compiled
    but not executed. The function will be executed when we call the function.


    # ### 6.2.2 Function call


    A function is called by its name and parenthesis (). Let''s declare and call a
    function:


    ```

    function sayHello() {

    console.log(''Hello!'');

    }

    ```


    The sayHello() will log the string ''Hello!'' once the function is called. Call
    the function by its name to execute it:


    ```

    "Hello!"

    ```


