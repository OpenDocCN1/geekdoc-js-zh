    # Initialization


    During declaration, variables are automatically assigned a value of undefined.
    This is called initialization:


    ```

    var x = undefined;

    ```


    # Assignment


    Assignment refers to assigning a value to a variable with the assignment operator
    (=). Let''s assign a numeric value of 100 to a variable called x:


    ```

    var x = 100;

    ```


    And this brings us to the next point, how are var variables hoisted in memory?
    Var variables are hoisted in memory with a starting value of undefined. For example:


    ```

    icecream = ''Maple Syrup'';

    ```


    Conceptually, it will be stored in memory like so:


    | Variable Name | Value |

    | --- | --- |

    | icecream | undefined |


    Therefore, which is why you try and access a var variable before its declaration,
    the undefined type is returned:


    ```

    console.log(icecream); // undefined

    icecream = ''Maple Syrup'';

    ```


    undefined is logged to the console. The following bullet points will explain why:


    +   - The variable declaration var icecream is hoisted to the top of its scope,
    in this case, global scope. It is initialized with a starting value of undefined

    - Only the variable declaration is moved, not its assignment (= (''Maple Syrup'')'
