    # 8.2 Execution context


    Execution context is an abstract concept describing the environment within which
    JavaScript code is executed. The execution context will dictate if a variable,
    object, or another block of code that are not within a function are executed inside
    the global execution context. There are two types of execution contexts: global
    and function. Let''s examine the global execution context first.


    # 8.2.1 Global execution context


    The execution context is the default execution context. Variables and other blocks
    of code that are executed inside the global execution context. The global context
    is attached to the window object and there is only one execution context throughout
    code execution. For example:


    ```

    let greeting = ''hello'';

    console.log(greeting === window.greeting); true

    ```


    The global variable greeting is a property of the global window object. Therefore,
    true is returned.


    The global execution context therefore, does the following:


    +   * Creates the window object as the global execution context

    * Creates a reference to the window object using this'
