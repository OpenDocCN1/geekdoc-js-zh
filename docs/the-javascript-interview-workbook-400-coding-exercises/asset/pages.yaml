    # 1.4.3 Numeric coercion


    Like the data types, values can be implicitly and explicitly coerced into the
    number data type.


    # 1.4.3.1 Implicit Numeric coercion:


    Implicit numeric coercion will convert a non-numeric type such as a string or
    boolean to a number data type. Since numbers are used for mathematic operations,
    numeric coercion occurs through operands such as:


    +   * Arithmetic operands (+, *, %, /)

    * Comparison operands (<, >, <=, >=)

    * Equality operands == and !==

    * Unary -


    The following examples demonstrate implicit coercion to the numeric data type:


    ```

    console.log(1 + (''123'')); // 124

    console.log(2 * ''9''); // 18

    console.log(1 / ''one''); // NaN

    console.log(1 - true); // 0

    console.log(1 >= false); //true

    console.log(0 == false); //true

    ```


    > In the examples, implicit coercion will convert the string and boolean data
    types to numbers. Pay attention to when the unary addition (+) operator is used
    in front of a string:


    ```

    console.log(1 + (''123'')); // 124

    ```


    The unary operator converts the string ''123'' into a number data type and then
    1 is added to the number 123.'
