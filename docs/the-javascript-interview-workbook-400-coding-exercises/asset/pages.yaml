    # 1.4.4 Boolean coercion


    There are two types of boolean coercions: implicit and explicit. In this section
    we will examine the coercion of values into the boolean true and false.


    # 1.4.4.1 Implicit boolean coercion:


    Implicit boolean coercion are usually used during comparisons. Use cases of implicit
    boolean coercion are covered in section 1.3.9 (Comparisons) to compare values
    using ==, !=, and >= operators.


    Remember that during implicit coercion, the loose equality and inequality operators
    === and strict equality and inequality !== operators are not used as they will
    not coerce values.


    > To recap there are 6 false values in JavaScript. Everything else is a truthy.


    +   1. "empty string

    2. null

    3. undefined

    4. false

    5. 0

    6. NaN


    Here are some general guidelines for implicit boolean coercion using the === operator.


    +   - When a boolean is compared with a non-boolean, the latter will be coerced
    to a number.

    - true is coerced to the number 1 and false to the number 0.

    - null and undefined are equal to each and themselves, but not to 0, false, or
    ''0''.

    - NaN is not equal to anything, including itself.'
