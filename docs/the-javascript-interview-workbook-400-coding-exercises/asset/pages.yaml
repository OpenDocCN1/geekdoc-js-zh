    # 5.3 Map, Reduce and Filter methods


    ES5 introduced map, reduce, and filter methods. These are powerful features of
    the JavaScript language that will allow you to use and maneuver arrays to a greater
    extent. Additionally, these methods allow you to take a functional programming
    approach. In a gist, functional programming is a paradigm that avoids state and
    mutating data. Programs are treated as mathematical functions whose execution
    will always produce identical and reliable results when the same arguments are
    passed to them. Let''s have a look at each of these methods starting with map()


    # 5.3.1 map()


    The map() method will transform every element of an array by executing a callback
    function for each item. This method does not mutate/change the original array
    instead, it returns a new array with the mapped/changed array items.


    Syntax: array.map(callback, thisArg);


    The first parameter is a function that will be executed on each element in the
    array. This is called a callback function as it is executed when the method is
    called on the array. The callback function in turn can take 3 arguments:


    +   - Current Item: The current item in the array being processed. Required parameter.

    - Index: The index of the current item in the array. Optional parameter. For example
    index 0.

    - Array: The array on which map() will enact. Optional parameter. There is already
    a reference to the original array tied to the map() method when it is called.


    The 2nd parameter that the map() can take:


    thisArg: The value to use as this while executing the callback function. Optional
    parameter.


    The example preceding shows the transformation of an array of numbers using map():


    ```

    let numberArray = [10,100,1000,10000];nlet mappedArray = numberArray.map(function
    multiplySix(item) {

    return (item * 6);

    });

    ```


    In this example, the value of each item in the numberArray is multiplied by ,
    by executing the callback function named multiplySix. The first argument of the
    callback function is item which refers to the current item in the array being
    processed. It is a required parameter. Once the callback function has finished
    execution for each item in the array, the newly transformed values of array items
    are returned and assigned to let mappedArray.'
