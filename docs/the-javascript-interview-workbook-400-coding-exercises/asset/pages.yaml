    # 1.4.1 Definition


    Type coercion and type casting are often used interchangeably. However, there
    is a slight difference between both.


    > Type coercion can be defined as “automatic or implicit conversion of values
    from one data type to another. For example strings to numbers". (MDN)


    Whereas, type casting also called explicit coercion is manual. It is by the developer
    using functions such as toString() which converts a string to a number.


    # 1.4.2 String coercion


    In this section, we will discuss implicit and explicit string coercion of values.
    Starting with implicit coercions.


    # 1.4.2.1 Implicit string coercion:


    String coercion occurs when a value is converted into the string data type. Take
