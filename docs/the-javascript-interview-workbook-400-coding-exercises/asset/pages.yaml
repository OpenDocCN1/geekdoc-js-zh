- img_proc: true
  md: 'The variables follow an order from left to right. Therefore, the first variable
    (`firstEl`) will be assigned the value of the array at index 0, `secondEl` will
    be the value of `alphabet[1]` and so on.


    Destructuring assignment allows for a much faster and easier way of assigning
    array values to variables. We can also skip array elements if we wish. For example,
    let''s skip the ''d'' at `alphabet[3]` by omitting the variable name `fourthEl`
    and replacing it with a comma:


    ```

    let [firstEl, secondEl, thirdEl, fifthEl, sixthEl] = alphabet;

    ```


    There is no reference to the variable `fourthEl` whose value will correspond to
    the letter ''d'' at the third index in the `alphabet` array. So we log `fourthEl`
    to the console `ReferenceError` occurs:


    ```

    console.log(fourthEl);

    ```


    ```

    ReferenceError: fourthEl is not defined

    ```


    A comma is used to skip values in an array. For example let''s skip the first
    4 values in the `alphabet` array:


    ```

    let [,,, fifthEl, sixthEl] = alphabet;

    ```


    The variable names have been replaced by commas and will be skipped over. Only
    `fifthEl` and `sixthEl` will be assigned values corresponding to their position
    moving to right in the `alphabet` array. For example let''s check the `fifthEl`
    variable:


    ```

    console.log(fifthEl); // "e"

    ```


    Nested arrays are destructured as well. Take as an example a nested array called
    `arrNest`


    ```

    let arrNest = [''a'', ''b'', ''c'', [1,2,3]];

    ```


    In order to use destructured assignment, we will declare variables like so:


    ```

    let [a,b,c, [one, two, three]] = arrNest;

    ```


    The variables are declared moving from left to right corresponding to the array
    values from index 0 onwards.


    ```

    console.log(a, b, c, one,two,three);

    ```


    ```

    "a"

    "b"

    "c"

    1

    2

    3

    ```


