    # 3.6 Classes


    In-oriented programming class types are templates for creating objects. As we
    just learned in prototypical inheritance, objects inherit properties and methods
    from a prototype. Classes build upon prototypical inheritance. Classes were introduced
    in ES6 to mimic the class data type found in Java and other object-oriented programming
    languages. Now developers use constructor functions to mimic object-oriented design
    patterns. JavaScript does not have the class type, so we create functions in a
    way that they behave as classes to easily create objects. A class is a function
    and when invoked as a constructor will create an instance of that class.


    The next sections explore classes in detail and how can effectively use classes
    in JavaScript to write object-oriented code.


    # 3.6.1 Class declarations


    Classes are functions that are declared with the class keyword instead of the
    function keyword. The name of a class is capitalized as the convention. For example
    Person is a class. Note the similarity in structure to a function:


    ```

    class Person()

    ```'
