    # 1.2.7 Data types


    Data types in software aim to represent or model data in the physical world. For
    example, a car in life may be represented as the "object" data type in a web application
    such as Uber, Ola, or Lyft. JavaScript is loosely typed, which means that you
    don''t have to enforce a variable''s data type before declaring it. Instead, the
    data type is induced at run time. Compare this other languages such as C++ and
    Java where the data type of a variable must be stated during variable declaration.


    There are 2 main categories of data types:


    +   1. Primitives

    2. Object


    We will explore both Primitive types moving on.


    # 1.2.7.1 Primitive Data types:


    The Mozilla Developers Network MDN defines a primitive data type as:


    > Data is not an object and has no method, i.e. no associated functions may be
    used on them.


    From this we derive two properties of primitive data types:


    +   1. Immutability

    2. Copy by value.


    # 1. Immutability


    Values that are primitive data types are immutable like neurons or electrons of
    an atom which means theycannot be inherently changed. For example:


    ```

    let universe = 10;

    universe = ''10'';

    ```'
