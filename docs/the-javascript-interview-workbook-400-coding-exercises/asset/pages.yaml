    # 5.2.4 Convert a string into an array


    Using the spread operator allows us to convert a string into an array of the string''s
    characters. This is much faster and more convenient than looping through the characters
    in a string and accessing them at each index. This example demonstrates this:


    ```

    let game = ''Animal Crossing New Horizons'';

    let chars = [...game];

    ```


    The spread operator will return an array of characters, including the whitespace
    contained in the string. The result of this operation is:


    ```

    ["A","n","i","m","a","l"," ",C","o","r","s","i","n","g"," ",N","e","w"," ",H","o","r","i","z","o","n","s","
    ",","D","u","r","B","e","n"," ","C","o","r","s","i","n","g"," ",H","o","r","i","z","o","n","s","
    ",","r","o","r"]

    ```


    Now it becomes easy to mutate the characters in the string. We can use the filter()
    method which will filter the array elements representing the whitespace ("") from
    the array. We will come to the filter() method in this moving on.


    # 5.2.5 Math object


    The Math object in JavaScript provides many methods such as Math.min() which will
    return the smallest integer from the arguments provided to the method and Math.max()
    which will return the largest integer. For example:


    ```

    console.log(Math.max(319000, 30000, 8200)); // 319000

    ```


    Let''s try this on an array of integers:


    ```

    console.log(Math.max([319000, 30000, 8200])); //NaN

    ```'
