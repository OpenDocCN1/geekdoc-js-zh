  md: '# 2.4.2. Use cases of strict mode


    Listed below are some common use cases comparing to code with and without strict
    mode.


    # 1. Global Variables


    Take as an example, the following assignment:


    ```

    x = 6;

    ```


    Without strict mode, this will automatically create a variable/object in the global
    context:


    ```

    var x = 6;

    ```


    However, with strict mode enabled a global variable/object is not automatically
    declared.


    ```

    ''use strict'';

    x=6;

    ```


    With strict mode enabled a ReferenceError is thrown:


    ```

    ReferenceError: assignment to undeclared variable x

    ```


    # 2. Deletion of variables, functions and objects


    In non-strict mode, deletion of variables, objects, and functions is allowed:


    ```

    let x;

    function unstrictMode() {

    }

    let obj = {};

    delete(x);

    delete(unstrictMode());

    delete(obj);

    ```


    Whereas in strict mode, deleting any one of them is not permissible and will throw
    an error:


    ```

    ''use strict''

    let x;

    function unstrictMode() {

    }

    let obj = {};

    ```'
