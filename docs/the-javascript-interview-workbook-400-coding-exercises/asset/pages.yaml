- img_proc: true
  md: "complex computations, it may well be possible during that time other parts\
    \ of the application freeze. To make our code behave asynchronously, we can use\
    \ callback functions.\n\nBefore we continue, let's understand functions are objects\
    \ this means that they can be used in an object like manner:\n\n+   - Functions\
    \ can be stored in variables\n- You can pass a function as an argument to another\
    \ function\n- You can return a function, from a function\n- One function can be\
    \ created inside another\n\nThese are aspects of what is known as asynchronous\
    \ programming, of which callback functions are a part.\n\nA function that is passed\
    \ as an argument to another function is called a callback function. The function\
    \ that accepts another function as an argument is called a higher-order function\
    \ and contains the logic for when the callback function is executed.\n\nMDN describes\
    \ callback functions as:\n\nA callback function is passed into another function\
    \ as an argument, which is then invoked inside the outer function to complete\
    \ some routine or action.\n\n# 6.8.2 Why?\n\nCallback functions are efficient\
    \ as a function doesn't have to wait for something to finish or return a value\
    \ to complete a routine or task. Callback functions are often used in DOM events\
    \ and the array methods that we saw in the previous chapter `filter(), map()`,\
    \ etc. Callback functions can be asynchronous or synchronous.\n\nIn a normal function,\
    \ some value is returned and stored in a variable to presumably perform some other\
    \ task. However, with callback functions the callback function is passed as an\
    \ argument to the main function, and the returned value from the main function\
    \ is provided to the callback function.\n\nIt is also a way of making sure that\
    \ an event for example `click` has taken place before something runs. Therefore,\
    \ the callback function is declared but won't run the `click` event occurs.\n\n\
    Let's have a look at a simple callback function in the preceding example:\n\n\
    ```\n//mainFunc accepts a callback function as a parameter\n\nfunction mainFunc(item1,\
    \ item2, callback) {\n  console.log(`I like eating ${item1} and ${item2}`);\n\n\
    \  //callback function is called after the above lines have finished\n  executing;\n\
    \n  callback();\n}\n```"
