    You can also use a trailing comma by adding a comma after the last item in the
    array as:


    ```

    fruitArray = [''mango'', ''apple'', ''grapes'', ''bluberry'',

    watermelon];

    ```


    Trailing commas are becoming more common as they make it easier to see version
    control diffs using Git.


    Arrays are objects. We can verify this by using the typeof operator:


    ```

    console.log(typeof(fruitArray)); // "object"

    ```


    There is ESS method Array.isArray(value) which will check whether an object passed
    as an argument is an array. If so it will return the boolean true. For example:


    ```

    console.log(Array.isArray(fruitArray)); //true

    ```


    fruitArray is an array therefore, true is returned from the method.


