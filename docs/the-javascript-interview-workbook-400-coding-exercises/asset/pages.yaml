  md: '# Theory Thor -8


    "Mastery lies on an infinite continuum" — C. Matakas


    In this chapter, we will go over some important theoretical concepts. Though these
    concepts are intermediate in nature, an understanding of these will greatly help
    you along your journey honing your JavaScript expertise. I recommend that you
    keep practicing the coding exercises from other chapters as you go along. This
    will motivate you to keep coding as you form the habit of reading other topics.


    We''re going to cover the following main topics:


    +   * What is the call stack?

    * Execution context

    * Event loop


    # 8.1 What is the call stack?


    An understanding of the call stack will allow you to understand how execution
    order in JavaScript works. JavaScript is a single-threaded language; this means
    that it handles task at a time. JavaScript code is executed by the JavaScript
    engine. Google''s V8 engine is an example of a popular JavaScript engine, there
    are others such as the SpiderMonkey and Rhino. The most popular host environment
    for the JavaScript engine to run in is browser.


    The V8 engine is written in C++. It is an open-source, high-performance JavaScript
    and Web Assembly engine. The V8 engine has two main parts:


    +   * Heap: The heap is an unstructured memory that is used for memory allocation
    of variables and objects

    * Stack: The stack is used for function calls and it records where we are currently
    in the program


    Since JavaScript only handles one task at a time, as it has a single call stack.
    The call stack is mainly used for function calls. Functions are executed from
    top to bottom, one at a time. A call stack is a dynamic data structure that follows
    the Last-In Last-Out(LIFO) principle. Its goal is to record where in the program
    we currently are. The LIFO principle temporarily stores and manages function invocation.'
  merge: -1
  pgno: 375
- img_proc: true
  md: "When we say that the call stack applies the LIFO principle to function invocation,\
    \ this means that the last function to be pushed into the stack is the first to\
    \ be popped out from the stack, when the function returns.\n\n![](img/b565ac948bd35e932b90037e76b71eca_376_0.png)\n\
    \nLast pancake on the stack is the first one on the plate\n\nLet’s have a look\
    \ at an example:\n\n```\nfunction functionOne() {\n  throw new Error('Stack Trace\
    \ Error');\n}\nfunction functionTwo() {\n  functionOne();\n}\nfunction functionThree()\
    \ {\n  functionTwo();\n}\nfunction functionThree();\n```"
  merge: -1
  pgno: 376
- img_proc: true
  md: "The following will be returned:\n\n> > > Uncaught Error: Stack Trace Error\n\
    at functionOne (<anonymous>:2:9)\nat functionTwo (<anonymous>:6:2)\nat functionThree\
    \ (<anonymous>:10:3)\nat <anonymous>:13:1\n\nNotice the order of the functions\
    \ logged to the console:\n\n+   - functionOne\n- functionTwo\n- functionThree\n\
    \nfunctionOne which is the last function to be called from within functionTwo\
    \ is the first function out and logs an error. which functionTwo. Lastly, functionThree\
    \ is logged, which is the first function to be pushed onto the stack during execution.\
    \ This demonstrates the LIFO principle. The last function to be pushed into the\
    \ stack (functionOne) is the first to be popped from the stack. And the first\
    \ function to be pushed into the stack is the last to be popped from the stack.\n\
    \nWhen a stack is invoked, its arguments and variables within the function are\
    \ pushed into the stack. An entry in the call stack is called a stack frame. A\
    \ stack frame is a memory location within the call stack. Once the function is\
    \ popped off the stack, the memory is cleared.\n\nThe call stack manages function\
    \ invocation as it keeps a record of the position of each function call (stack\
    \ frame) as functions pushed and popped from the call stack. This record-keeping\
    \ makes code execution synchronous. As the position of the next function to execute\
    \ is known in advance.\n\nLet's have a look at another example:\n\n```\nfunction\
    \ function1() {\n  console.log('function 1');\n}\n\nfunction function2() {\n \
