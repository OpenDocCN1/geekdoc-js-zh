    # 3.2.2 new() keyword


    The new operator is used to instantiate objects from a constructor function as
    we will see in this section.


    # 3.2.2.1 In-built object constructor function


    The new operator can be used to create an object using the in-built Object constructor.
    Constructor functions are like regular functions with the exception that:


    +   - They start with an upper case letter


    +   - They are executed with the new keyword


    For example below, we create an object using the new keyword and Object constructor
    function:


    ```

    let employee = new Object();

    ```


    Querying the typeof(employee) results in object:


    ```

    console.log(typeof(employee)); // "object"

    ```


    Constructor functions are akin to templates or blueprints from which many objects
    can be created, using the constructor function as a blueprint. The function will
    initialize and return an empty object. The empty object is then referenced by
    a variable, which in our case is let employee.


    Then properties can be added to this object via the dot notation as we saw earlier
    in section 3.2.1 of this chapter. For example:


    ```

    employee.id = 100;

    employee.role = ''admin'';

    employee.salary = 100000;

    employee.raise = employee.salary * 2;

    ```


    However, if we want to create many instances of a template object? It would be
    redundant and tiring to initialize those via the methods that we have learned
    so far as we would have to add properties to them one by one. In such a case we
    utilize a user defined object constructor function.'
