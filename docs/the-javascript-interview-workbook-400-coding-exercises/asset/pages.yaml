    as b


    +   - Change the value of b.one to the string ''zoo''


    +   - What is a.one ?


    # Answers


    +   1. In a shallow copy, a new object is created which has the exact values as
    the source object. Primitive values are copied by value whereas if a field is
    of a reference type (an array or other) then the reference/memory address is copied
    over to the newly created object. In a shallow copy the source object and target
    share the same memory address.

    In a deep copy, all the values (primitive and reference types) are duplicated
    into a source object and allocated new memory locations. Therefore, the memory
    address of the target and source objects is different. Changing the source object
    after a deep copy will not affect the target object.


    +   2. Some ways to shallow copy:


    +   - Iteration using a for-in loop'
