  md: "```\nwindow.onload = function() {\n  alert('Hello User!')\n}\n```\n\n# 6.6\
    \ Arrow functions\n\nArrow functions also called fat arrow are part of the ES6\
    \ specification. They allow you to write function expressions with a shorter and\
    \ more concise syntax. It can take some time to wrap your head around these, as\
    \ the syntax can be a bit unusual at first. However, with time and practice, the\
    \ syntax gets familiar.\n\nWhile many people prefer using arrow functions, it\
    \ is my experience that a beginner should not necessarily get up replacing every\
    \ function declaration or expression with an arrow function.\n\n# 6.6.1 Syntax\n\
    \nLet's have a look at the different ways to write function expressions before\
    \ we start using them.\n\nSyntax: let functionName = (arg1, arg2...argN) => statement\n\
    \nArguments are within the parenthesis () and, following an arrow (=>) symbol\
    \ is the code statement that a function will execute.\n\n# 6.6.1.1 No parameters\n\
    \nWhen there are no parameters, the function statement will look like this:\n\n\
    ```\nlet greeting = () => ('Hello World!');\n```\n\nThere will be nothing inside\
    \ the parenthesis, and therefore if we log the greeting expression, we will see\
    \ its value:\n\n```\nconsole.log(greeting()); // \"Hello World!\"\n```\n\n# 6.6.1.2\
    \ Single parameter\n\nIf you have only 1 parameter, the parenthesis () around\
    \ the parameter can be omitted. This is a personal style. Let's take a look at\
    \ an example:\n\n```\nlet singleVal = a => a + 1;\n```\n\nThe singleVal() function\
    \ takes a single parameter s, increments it by 1 and returns it. We can call the\
    \ singleVal() function expression and query its value by logging it to the console:\n\
    \n```\nconsole.log(singleVal(1));\n```\n\n![](img/b565ac948bd35e932b90037e76b71eca_329_0.png)"
  merge: -1
  pgno: 329
- img_proc: true
  md: "# 6.6.1.3 Multiple arguments\n\nTake as an example the following function:\n\
    \n```\nfunction multiply(a, b) {\n  return(a * b);\n}\n```\n\nThis can be re-written\
    \ using the arrow function a * b syntax:\n\n```\nlet multiply=(a, b) => (return\
    \ a * b)\n```\n\nThe function keyword is deleted. Instead we use a function expression.\
    \ In parameters a and b within the parentheses (). Then we have inserted a arrow\
    \ (=>) to the right of the function parameters. The function will return a multiplied\
    \ by b. We can call the function expression so:\n\n```\nmultiply(2, 3); // 6\n\
    ```\n\n# 6.6.1.4 Return values\n\nArrows implicitly return values and there is\
    \ no need to use the return keyword. Let's look at an example to demonstrate this:\n\
    \n```\nlet nums = (x,y,z) => x + y + z\n```\n\nis a function expression using\
    \ fat arrows. The function takes x, y and z as parameters. Notice that there is\
    \ no return keyword and no curly braces (). The absence of curly braces indicates\
    \ the return of a value.\n\nWhen using the return keyword or multiple statements\
    \ in an arrow function, the curly braces are compulsory.\n\n```\nlet sumMultiply\
    \ = (x, y) => {\n  let z = 5;\n  return (x * y) + z;\n}\n```\n\nWe can then use\
    \ the sumMultiply function expression:\n\n```\nsumMultiply(2,3); // 11\n```\n\n\
    Arrow functions are concise and implicitly return values. However, there are cases\
    \ when you should not be using arrow functions. We will discuss this next\n\n\
    # 6.6.2 this binding\n\nOne of the major differences between a regular function\
    \ and arrow function is how the this keyword will behave. In Chapter 2, The Basics\
    \ -2 we covered this keyword in detail. In summary, how this behaves is determined\
    \ by how a function is called. The this keyword is either implicitly or explicitly\
    \ bound."
