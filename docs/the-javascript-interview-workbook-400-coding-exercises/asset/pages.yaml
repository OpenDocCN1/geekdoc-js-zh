    5. There are a couple of differences between the two:


    +   - The arguments object is array like but not an array. Whereas the rest parameters
    are array instances which why you can use array methods such sort(), map(), filter()
    etc. on them

    - The arguments object contains all the arguments passed to an object. Whereas
    rest parameters are a reference to arguments to be passed later in the function
    and are not formally defined in a function


    6. Example of the rest parameter:


    ```

    function rest(x,y,...z) {

    console.log(x); // 1

    console.log(y); // 2

    console.log(z); // [3,4,5]

    }

    ```


    rest(1,2,3,4,5);


    Example of the spread operator:


    ```

    let array1 = [''a'', ''b'', ''c''];

    let array2 = [''d'', ''e'', ''f''];

    let combinedArray = [...array1, ...array2];

    console.log(combinedArray);//["a","b","c","d","e","f"]

    ```


    The most obvious different is that the rest operator is used with functions ,
    and the spread operator is used with arrays. The rest operator collects all the
    remaining elements into an array. Whereas, the spread operator allows arrays/objects/strings
    to be expanded into single arguments/elements.


