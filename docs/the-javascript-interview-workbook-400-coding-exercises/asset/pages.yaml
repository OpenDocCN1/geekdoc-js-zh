    # 4.2.3 Array.of()


    This method is used to instantiate arrays. It will create a new instance using
    the arguments passed to it as array values. The number of arguments or type of
    arguments passed do not matter. For example:


    ```

    let another = Array.of(1, 2, 3);

    console.log(another) // [ 1, 2, 3 ]

    ```


    This instantiates a new array with the numeric values 1,2 and 3.


