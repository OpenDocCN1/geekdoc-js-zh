    # 2.1.3 let and const hoisting


    let and const are stored as uninitialized values, in contrast to var which is
    stored as undefined. As an example:


    ```

    let city = ''Toronto''

    const apple = ''Granny smith''

    ```


    These will be stored as uninitialized:


    | Variable Name | Value |

    | let, const | uninitialized |


    Trying to reference a let or const variable before its declaration will result
    in a ReferenceError getting thrown:


    ```

    console.log(city);

    console.log(apple);

    let city = ''Toronto''

    const apple = ''Granny smith''

    ```


    > ReferenceError: can''t access lexical declaration ''city'' before initialization


    Like var, let and const variables are hoisted. However, unlike var, they cannot
    be accessed before they are declared. This is because they lie inside the Temporal
