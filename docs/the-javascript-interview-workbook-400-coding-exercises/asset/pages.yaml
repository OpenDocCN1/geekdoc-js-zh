  md: '# 8.2.2 Function execution context


    The code within a function is executed within a function execution context. There
    are two phases concerning the function execution context:


    +   1. Creation phase


    +   2. Execution phase


    Let''s discuss these starting with the creation phase.


    # 8.2.3.1 Creation phase


    When a call is encountered, the creation phase begins. This phase will setup everything
    for execution. At this point the JavaScript engine has called a function but not
    yet executed it. A couple of things happen during the creation phase:


    +   * An activation object is setup: Memory is set up in the activation object.
    This is a special object which contains all the variables defined within the function,
    the arguments object for the function, function arguments and any inner functions
    declaration inside the main function


    +   * Scope chain: this is a list of all the variables within the function. This
    includes all the variables in the global scope. It forms a connection to the outer
    environment.


    +   * Create a this context: The value of this is initialized after the creation
    of the scope chain


    Hoisting is an important part of the creation phase. During the creation phase
    memory is setup already for all variable and function declarations to be saved.
    Therefore, before execution the JavaScript engine already has a reference to variable
    and function declarations. This is how you have access to variables before they
    are declared. For example:


    ```

    console.log(a); //undefined

    var a = 5;

    ```


    The variables are initialized in memory with a default value of undefined during
    the creation phase. This is why you are able to access a before its declaration.
    Variables declared with let const are not assigned any initial values and trying
    to access them before declaration results in ReferenceError:


    ```

    console.log(a); //ReferenceError: can''t access lexical declaration ''a'' before
    initialization

    let a = 5;

    ```'
