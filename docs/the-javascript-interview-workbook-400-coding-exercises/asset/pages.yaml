  md: '# Don''t just believe- practice


    # Why I wrote this workbook?


    As a coding bootcamp instructor for the past 4 years, some of the questions that
    I''ve been asked concerning employment are:


    +   1. Will I get a job after this?

    2. How many projects do I need to complete to start interviewing?

    3. How can I test my JavaScript knowledge?

    4. How should I prepare for technical interviews, and what will I be asked?


    # Circumventing life issues to get employed!


    The best way for junior developers to circumvent the issue of not having enough
    experience or projects, and still get employed is to plenty of doing exercises
    (on old and newer ES features) while having done whole projects on them. This
    demonstrates a practical understanding of core and advanced JavaScript concepts.


    Often people have to balance multiple things while they learn to code including
    part-time jobs. Those, they''re on a time crunch and may not be able to commit
    to doing projects. Some people leave their current jobs to learn how to code.
    The more time they spend out of webdev employment status means they dip into their
    savings and deplete their bank balances.


    > This workbook focuses on circumventing these issues in a practical and straightforward
    way.


    > To my own students and others I have filtered, sorted and organized vast amounts
    of information in a way that makes it easier for you to LEARN and PREPARE at the
    same time.


    +   ✓ Practice over 400+ coding exercises. Answers provided.


    +   ✓ Get down to the nifty-gritty of JavaScript. Practice the often neglected
    parts such as this keyword, hoisting, and more.


    +   ✓ Answer questions about advanced ES topics without having done whole projects
    on them.


    +   ✓ Start preparing to interview ASAP!'
