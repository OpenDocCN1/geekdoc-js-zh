  md: '# 5.2 Spread operator


    The spread and rest operators introduced in ES6 look familiar but work in different
    contexts. In this section, we will go over the spread operator and its use cases.
    We will come to the rest operator in Chapter 5, Fun functions.


    # 5.2.2 Spread operator


    The spread operator will spread or expand an array into its set of items. The
    definition provided by MDN is:


    **Spread syntax** allows an iterable such as an array expression or string to
    be expanded in places where zero or more arguments (for function calls) or elements
    (for array literals) are expected


    What this means is that the spread operator will allow an expression to be expanded
    in places multiple elements/arguments are expected.


    Syntax:


    The spread operator spreads out the items of the inner array in the outer array.
    It starts with [] – which then expands to [1] and [1, 2]. After it becomes [1,
    2, 3] etc.


    To understand this best lets take a look at an example:


    ```

    let array1 = [1, 2, 3, ... [4, 5]];

    ```


    Nested within array1 is another array containing the numeric values 4 and 5. We
    would like to expand the items in the nested array. Therefore, we use the spread
    operator denoted by the triple dots (..) just before the nested array.


    Let''s view the output on logging array1 to the console:


    ```

    console.log(array1);

    ```


    ```

    [1, 2, 3, 4, 5];

    ```


    The spread operator spreads out the items of the inner array in the outer array.
    The spread operator will not mutate the original array. The goal should be to
    keep data structures as arrays and objects in their unchanged states i.e. immutable.
    Fewer states/things changing in your code means that there are less things to
    track and worry about.


    Below are a few uses cases of the spread operator


    # 5.2.2 Merge arrays


    The spread operator can be used to merge the values of two arrays. This can be
    used in place of concat() method. For example:


    ```

    let greeting = [''Hey'', ''there''];

    let devGreeting = [''Hello'', ''world!''];

    ```'
