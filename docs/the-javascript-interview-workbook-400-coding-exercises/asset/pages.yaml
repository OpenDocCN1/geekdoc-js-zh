  md: '# 4.4.1 Adding an array element


    There are a couple of different ways you can add elements to an array discussed
    down below.


    # 4.4.1.1 Array.prototype.push()


    Consider an array called `studentList`


    ```

    let studentList = [''Merengue'', ''Orion'', ''Jannat'', ''Ray'', ''Amal''];

    ```


    In order to add an array item to the list we can use the `push()` method which
    pushes an item to the end of an array. The method takes it as an argument one
    or more items to be pushed:


    ```

    studentList.push(''Sabrina'', ''Karan'');

    ```


    In this case we have pushed two string values `Sabrina` and `Karan` into the `studentList`
    array. Logging the array to the console will display all its contents:


    ```

    console.log(studentList)

    [''Merengue'', ''Orion'', ''Jannat'', ''Ray'', ''Amal'', ''Sabrina'', ''Karan'']

    ```


    The array is returned with a new value of the `length` property since items were
    added to it:


    ```

    console.log(studentList.length); // 7

    ```


    The push method is a alternative to pushing items at specific indices, because
    if you miss an index it will create an `undefined` item at that particular index.
    For example let''s push the string values


    ```

    studentList[6] = ''Sabrina'';

    studentList[7] = ''Karan'';

    ```


    Now logging the `studentList` array to the console we are displayed:


    ```

    [''Merengue'', ''Orion'', ''Jannat'', ''Ray'', ''Amal'', ''undefined'', ''Sabrina'',
    ''Karan'']

    ```


    An `undefined` value exists at index 5, since we missed that one and added the
    string value `Sabrina` at index 6 and `Karan` at index 7.


    Therefore, to avoid unintended errors it is better to use the `push()` method
    which adds all items to the end of an array.


    # 4.4.1.2 Array.prototype.unshift()


    The `unshift()` method will add items to the beginning of an array. Carrying on
    our previous `studentList` array:


    ```

    let studentList = [''Merengue'', ''Orion'', ''Jannat'', ''Ray'', ''Amal''];

    ```


    Let''s add items to the beginning of the array using the `unshift()` method which
    takes as an argument/arguments items to be added to the `studentList` array:


    ```

    studentList.unshift(''Sabrina'', ''Karan'');

    ```'
