  md: "An arrow function does not have it's binding of the this keyword. Instead the\
    \ this keyword is lexically bound. This means that arrow functions use this from\
    \ their own enclosing scope.\n\nLet's have a look at an example to demonstrate\
    \ this.\n\nHTML:\n\n```\n<button id=\"btn\" type=\"button\">Click me!</button>\n\
    ```\n\nJavaScript:\n\n```\n// event listener with a standard callback function\n\
    document.getElementById('btn').addEventListener('click', function() {\n  this.innerText\
    \ = 'Clicked'\n});\n```\n\nThe above code attaches an event listener to a button\
    \ element. The this keyword references the object (HTML element) on which the\
    \ event will occur. In this case it is the button element.\n\nNow let's look at\
    \ our arrow function:\n\n```\ndocument.getElementById('button1').addEventListener('click',\
    \ () =>\nthis.innerText = \"Clicked!\");\n```\n\nIn the arrow function, the this\
    \ keyword is inherited from its parent scope in which this case is the global\
    \ object. Re-stated, the arrow function will use the this keyword from the code\
    \ that contains the arrow function, which is the window object.\n\nTherefore,\
    \ the this keyword is lexically bound in arrow functions. Let's wrap up this topic\
    \ by briefly discussing why not to use arrow functions.\n\n# 6.6.3 When not to\
    \ use arrow functions\n\nArrow functions should be avoided when writing constructor\
    \ functions, and prototype extensions. Using the ES6 class syntax to write object\
    \ code. Keep in mind that arrow functions can be confusing as they are anonymous\
    \ (have no name). Therefore, making code less readable. Additionally the lack\
    \ of function names can also make debugging harder. It is better to use arrow\
    \ functions along array methods such as filter().map() as these methods are self-explanatory\
    \ and indicate the purpose of the callback function. Let's put this to practice\
    \ by performing some coding exercises about arrow functions.\n\nExercises\n\n\
    +   1. Convert the following function to an arrow function\n\n```\nfunction employee(hours)\
    \ {\n  return hours;\n}\nemployee(10);\n```\n\n+   2. Convert the following function\
    \ to an arrow function:"
