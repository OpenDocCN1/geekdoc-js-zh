  md: "```\n}\nmainFunc('chocolate', 'cheese', function() {\n  console.log('Do you\
    \ have some?');\n});\n```\n\nLet's examine what's happening:\n\n+   - When we\
    \ pass a function as an argument to another function, we are treating it like\
    \ a variable\n- Only the function definition is passed. The function is not executed\
    \ in the parameter\n- The callback function is executed when the mainFun() is\
    \ called\n- The code/functions are still executed in the order given. The only\
    \ change is that the JavaScript engine doesn't wait for a response before moving\
    \ on.\n\n# Note\n\nWhen a callback is passed into another function, only the reference\
    \ to the function is passed. You call it without executing it, thus the absence\
    \ of the parenthesis ().\n\nLet's have a look at three different ways of making\
    \ a callback function:\n\n+   1. Named callback function\n2. Anonymous callback\
    \ function\n3. Named variable\n\n# 6.8.3 Named callback function\n\nCallback functions\
    \ can be declared and then passed as arguments to other functions which will call\
    \ them. Take the preceding block of code as callback as example:\n\n```\nfunction\
    \ myFunction(callback) {\n  callback();\n}\n\nfunction namedCallbackFunction()\
    \ {\n  console.log('This is from within the named function passed as a callback');\n\
    }\n\nmainFunction(namedCallbackFunction);\n```\n\nHere is a breakdown of the code:\n\
    \n+   - We have function called myFunction() that takes a callback as a parameter.\
    \ The callback function is called from within myFunction()."
