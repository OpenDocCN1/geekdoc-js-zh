  md: '# The Basics -1


    "For the things we have to learn before we can do them, we learn by doing them."
    — Aristotle


    This chapter lays the foundations for understanding the deeper parts of JavaScript
    presented in laterchapters. It will also give you the advantage of understanding
    the underlying mechanisms for basic concepts. Practice coding problems are given
    at the end of each section in that chapter allow you to solidify your knowledge
    and get better at coding in JavaScript.

    Often basic aspects of JavaScript are skipped in favor of the more advanced parts.
    However, learning the fundamentals well gives you the advantage of being able
    to grasp libraries and frameworks such JQuery, React.js, Vue.js, and others more
    easily.


    You might have read about these concepts and used them in your projects before.
    In which case I suggest that you reinforce your skills by practicing the coding
    exercises at the end of each section. You should use the information in the chapter
    to guide you. The exercises go beyond the basics; hence a previous background
    in JavaScript helps.


    In this chapter we''re going to cover the following main topics:


    +   - What you need to know about ECMAScript

    - Data types and variables

    - Operators & Comparisons

    - Type Coercion

    - Iteration

    - Conditional statements


    # 1.1 What you need to know about ECMA Script


    ECMA which is short for European Computer Manufacturer''s Association is an international
    organization that creates standards for technologies. One of these standards is
    ECMA-262. ECMA-262 is the standard for creating a general-purpose scripting language.
    This is commonly called ECMAScript specification. This specification contains
    rules and guidelines for creating a scripting language. JavaScript is one of the
    implementations of the ECMAScript Specification. Other implementations include
    JavaScript'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'and Action. The committee that works on the ECMAScript specification is called
    TC39

    (Technical Committee number 39).


    ES (ECMAScript) followed by a number, references the specific version of ECMAScript,
    for

    example, ES1, ES2, etc. So there are 10 versions of ES from ES1 to ES10.Next

    references the next upcoming version of ES.


    For ES2 and ES3, each version of ES introduces a new exception handling added
    to the language.

    For example, regular expressions and try - catch const and let keywords and

    Where ES6 additions include arrow function expressions, more.


    Therefore, JavaScript continuously evolves, with yearly additions post ES6. We
    will explore

    major ES updates of each version in this interview workbook. It is important to
    know what

    features are available for you rather than memorizing what ES version

    belong to.


    Yearly ES additions allow browser vendors and developers to implement features
    at\constant rate.


    Each browser uses a different JavaScript engine. V8 is Chrome''s JavaScript engine,
    Firefox

    uses SpiderMonkey and Chakra is Explorer''s JavaScript engine. Each browser

    adopts the latest ES features at different rates. Therefore, when working with
    the latest ES

    features you can:


    +   - Check browser support for a specific feature

    - Transpile your code


    To check support for a particular ES feature you may use

    https://www.canuse.com. The website provides a table of browsers and their versions

    that a particular feature that is searched for.


    To ensure that your code you works on all browsers, it is common to transpile
    your

    JavaScript code. Transpiling translates your JavaScript code from one version
    to a previous

    ES version. This in turn allows you to use the latest features that haven''t been

    implemented uniformly across all browsers. Babel is a common transpiler

    https://www.babeljs.com. Babel is used to convert ES6 and onwards code into a
    backward\compatible version so that it may run on older browsers as expected.


    # Exercises


    +   1. What are the two ways to ensure your code is compatible in most browsers?

    2. What is the difference between ECMAScript and JavaScript?


    16'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Answers


    +   1. To ensure your code is backward compatible with older browsers, you can
    transpile your code using a transpiler such as Babel. If developing an application
    for users of a specific device or browser it is wise to check if a particular
    ES feature is supported by checking online https://www.canuse.com.


    +   2. ECMA Script is a general-purpose scripting language. Whereas, JavaScript
    is a major implementation of the ECMAScript specification


    # 1.2 – Variables and Data Types


    Variables can be defined with the following keywords:


    +   1. var


    +   2. let


    +   3. const


    let const are ES6 additions and it is preferable to use them instead of var, for
    reasons discussed later on. The following table shows the difference between


    | Name | Scope | Re-assignment |

    | --- | --- | --- |

    | Var | Function & global scope | Yes |

    | let (ES6) | Block scope | Yes (outside current scope) |

    | const (ES6) | Block scope | No |


    The 3 types of variables declarations will be discussed in reference to their
    scope and whether values can be re-assigned to them. But before we do so, let''s
    first discuss "scope" means.


    # 1.2.1 Scope


    The word "scope" itself means "extent" or "range" to which a subject matter is
