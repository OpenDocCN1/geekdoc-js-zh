  md: "# 2.1.4 Function hoisting\n\nFunctions are hoisted along with a reference to\
    \ the body of the entire function. For example, take a function called `myFunc()`:\n\
    \n```\nfunction myFunction() {\n  console.log('This is myFunc');\n}\n```\n\nThe\
    \ `myFunc()` function will be stored in memory during compilation like so:\n\n\
    | Function name | Value |\n| - | - |\n| myFunc | console.log('This is myFunc');\
    \ |\n\nTherefore, referencing a function before its declaration behaves as it\
    \ would when calling it after its declaration:\n\n```\nmyFunc();\nfunction myFunction()\
    \ {\n  console.log('This is myFunc');\n}\n```\n\nThe function will execute before\
    \ its declaration and the following will be logged to the console:\n\n> \"This\
    \ is myFunc\"\n\nHaving understood the hoisting mechanism for var, let, const\
    \ and function declarations. Let's examine the precedence order for these:\n\n\
    # 2.1.5 Precedence for variable and function hoisting\n\nThe order of precedence\
    \ for hoisting is:\n\n+   1. Variable assignment\n2. Function declaration\n3.\
    \ Variable declaration"
