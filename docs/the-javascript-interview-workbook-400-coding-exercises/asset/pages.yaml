    # 3. Pass by reference


    Non-primitive data types are passed by reference compared to primitive data types
    that are passed by value. As such non-primitive data types are also called reference
    types.


    To understand why they are reference types, we will briefly look at how variables
    are stored in memory. A fixed amount of memory is allocated to a variable after
    it is declared. For primitive data types, the actual value in memory is copied
    over because the value assigned to a variable is immutable and known. Subsequently,
    exactly how much memory it will also be known. For example let user = "Jyoti",
    is "1010110 1111001 1011011 1101001 1101001" binary.


    Whereas, for object types the address of the object is copied rather than the
    actual value. As objects can have multiple values, which may or may not fit inside
    memory. For example in the following code, the object called user has one property
    to start with. But with time you can keep adding more properties as you like.


    ```

    let user={

    role: ''developer''

    };

    user.employed = true;

    user.name = ''Rocko'';

    ```


    When you console.log the user object, you see it now has all the newly added properties:


    ```

    Object {

    employed: true,

    name: "Rocko",

    role: "Developer"

    }

    ```


    Therefore, properties and their values are added after declaring the object. This
    illustrates that the memory size of reference types is not known in advance. So
    objects are copied by reference rather than value.'
