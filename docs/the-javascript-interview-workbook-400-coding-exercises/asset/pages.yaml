  md: "# 3.6.5.2 Private instance fields\n\nPrivate instance fields are only accessible\
    \ within the body of the class. That is to say that they are encapsulated within\
    \ that specific class. Private fields cannot be modified outside of the class\
    \ that they belong. They can only be read and changed within the class.\n\nIn\
    \ order to declare a private field, pre-fix the name with the # symbol. The #\
    \ must be used every time that the private field is declared, modified or read.\
    \ In this example the name age and hobby fields are declared as private fields:\n\
    \n```\nclass Person {\n  #name;\n  #age;\n  #hobby;\n\n  constructor(name, age,\
    \ hobby) {\n    this.#name = name;\n    this.#age = age;\n    this.#hobby = hobby;\n\
    \  }\n\n  getName() {\n    console.log(this.#name);\n  }\n}\n\nconst person1 =\
    \ new Person('Zelda');\nperson1.#name; // SyntaxError\n```\n\nThe name, age and\
    \ hobby private fields cannot be accessed outside of the class. The getName()\
    \ method has access to the private #name and #hobby fields as it is located inside\
    \ the class with the private fields. getName() is not a private method with how\
    \ we are able to get an output from person1.getName().\n\nTrying to access the\
    \ name field of the person1 class instance results in an error: person.#name;\
    \ //\"SyntaxError: Private field '#name' must be declared in an enclosing class"
