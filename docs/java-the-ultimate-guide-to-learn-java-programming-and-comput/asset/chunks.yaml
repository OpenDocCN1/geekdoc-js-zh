    ## Introduction


    The Java language was initially introduced by a team at Sun Microsystems consisting
    of James Gosling, Sheridan, Patrick Naughton, and Chrisuar. It is an object-oriented
    language.


    ## Four Java Platforms


    There are four primary platforms in Java:


    - Java Standard Edition (SE)

    - Java Enterprise Edition (EE)

    - Java Micro Edition (ME)

    - JavaFX


    ## Tools for Beginners


    In order to begin learning Java, you need to choose an IDE. IDE, also known as
    Integrated Development Environment, serves as your workspace for writing Java
    codes. Here are the following IDEs:


    - BlueJ: This is an IDE for beginners. It was originally designed to help beginners.

    - DrJava: This is a lightweight IDE. Similar to BlueJ, it was also designed for
    beginners.

    - Eclipse: One of the popular IDEs today, Eclipse is an open source platform.

    - NetBeans: This is another popular IDE commonly used today. It is highly recommended
    for beginners due to its user interface.


    Aside from Java IDEs, another tool you need is the JDK. JDK, which stands for
    Java Development Kit, serves as your computer’s interpreter and compiler for the
    Java language. Without this, your computer will not be able to translate Java
    codes into universal machine language. All versions of JDK are available from
    the official website.


    ## Chapter 1 – Writing a Java Program


    Once you are done from choosing your preferred IDE and from downloading the latest
    version of JDK, you now have the tools to begin programming using the Java language.
    However, having the tools does not mean that you are already prepared to jump
    into writing your first Java application.


    It is also important to understand the structure of a Java program – its primary
    components and their components in the Java application.


    ### Software Types


    You can create two types of software using the Java programming language – applets
    and applications.


    Applets are smaller pieces of programming codes that were designed to run on web
    browsers. We can consider the applets as smaller and lighter applications. They
    are mainly used to provide either navigation enhancements or additional interactivity
    to the browser. In contrast with stand-alone Java applications, applets do not
    need any interpreter in order to execute.


    ## Misinterpretations


    Before we proceed, I would like to clarify that the Java language is not related
    to the JavaScript language. These are two different programming languages whereas
    Java is used for the development of stand-alone applications. On the other hand,
    the JavaScript language is an integrated language for web development. It is used
    to assert functions that are not achievable through HTML language.


    This book is about the Java language and not about the JavaScript language.

