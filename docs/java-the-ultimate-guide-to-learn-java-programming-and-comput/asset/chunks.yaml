- fmt: "\nAnother type of software that you can develop through Java is a console\
    \ application. Console applications are stand-alone programs that run within a\
    \ console environment. All IDEs feature an integrated console environment in order\
    \ for you to test these kinds of programs. As a beginner, it is important for\
    \ you to learn console operations to have a good grasp on the basics of Java language.\n\
    \n![java_programmers_brain_screensaver_preview](images/00007.jpeg)\n\n## Classes,\
    \ Instances, and Objects\n\nThe classes, instances, and objects are the three\
    \ vital elements of a program created using an object-oriented language such as\
    \ the Java. In order to understand these three, you need to first look at their\
    \ relationship from one another.\n\nClasses are the highest and they cover everything\
    \ in Java programming language. Specific elements in a class are called `Objects`.\
    \ Once you add the additional specification to an `Object`, then it becomes an\
    \ `Instance`.\n\nIn an analogy, for instance, let us say our class here is the\
    \ `animal`. Under `animal` class, we have different kinds of animals like `dogs`,\
    \ `cats`, `birds`, and so on. These are the `objects` under `animal` class. Under\
    \ the category of `dogs`, we have different breeds like `poodles`, `golden retrievers`,\
    \ `Labradors`, and so on. These are the `instances` of the object `dogs`.\n\n\
    ## Project Creation\n\nThe first step in writing your Java program is to start\
    \ a new empty project in your chosen IDE. You can do this by navigating through\
    \ the top most toolbar as follows:\n\n`File -> New Project`\n\nAfter selecting\
    \ `New Project`, a new window will appear where you will be able to choose from\
    \ a list of categories. Under the `Categories` list, select `Java` and then select\
    \ `Java Application` from the adjacent window panel. Afterward, click on the `Next`\
    \ button and you will be asked for the project name and the location where you\
    \ want to save your project.\n\nAlways remember the project name since you will\
    \ be asked to go back to the same project along the way.\n\n## Main Class Creation\n\
    \nAfter the creation of a new project, the IDE will automatically create both\
    \ the package and the main class. Packages, also known as source packages, serves\
    \ as folders where you can efficiently organize all assets of the Java project\
    \ such as classes and instances. Take note, however, that packages are simply\
    \ identifiers for the organization of assets. Consider them as folders in your\
    \ computer where you organize your files accordingly.\n\nThere should be a main\
    \ class under the package. If the IDE did not automatically create the main class,\
    \ then you can create it by navigating on the main menu as follows:\n\n`File ->\
    \ New File -> Java Class`\n\nThe main class has its vital role in a Java program.\
    \ The `main` method, which is what initially executed when opening a Java program,\
    \ is contained in the main class. In other programming languages, the `main` method\
    \ is known as the entry point.\n\n### Writing the Package Statement\n\nNow that\
    \ we already have the main class in our Java project, we are now ready to write\
    \ our first Java programming language line – the package statement. This statement\
    \ is an optional part of the program and is only introduced to you for learning\
    \ purposes. This is written using the following syntax:\n\n`package [package name];`\n\
    \nThe IDE will automatically look for the default package if this line is not\
    \ written. In other words, the package statement might come in handy if you are\
    \ working on a Java project with multiple packages. Keep in mind that package\
    \ name must match with the name of the package where the class you need belongs\
    \ to. Let us say, for instance, that the name of your package is `javatestproject`.\
    \ The syntax should look like this in your IDE:\n\n```java\npackage javatestproject;\n\
    ```\n\n### Writing the Class Declaration\n\nNext to the package statement is the\
    \ class declaration. The syntax we need to follow here is this:\n\n`[access modifier]\
    \ class [class name]`\n\nThere are two kinds of access modifiers that you can\
    \ use: `public` and `private`. The `private` modifier prevents the other classes\
    \ from accessing the declared class while the `public` modifier allows other classes\
    \ to access the declared class. For the meantime, let us focus and use the `public`\
    \ as our access modifier for our first Java application.\n\nClass name, as what\
    \ the name suggests, is the name you designated to the main class. Take note that\
    \ the Java programming language is case sensitive so make sure that you name of\
    \ the main class with correct upper case and lower case characters. Let us say\
    \ that the name of our main class is `JavaTestProject`, then this is what should\
    \ we have right now:\n\n```java\npackage javatestproject;\npublic class JavaTestProject\
    \ {\n}\n```\n\nThe open (`{`) and close (`}`) curly braces refer to the opening\
    \ and closing of a Java code block. This helps the program in determining where\
    \ a certain block of code begins and where it ends.\n\n### Writing the Main Method\n\
    \nNow that we are done declaring the class, it is now time to declare the main\
    \ method for our first program. In our main method, we will be using two keywords:\
    \ `void` and `static`.\n\nThe `void` keyword signals the Java Virtual Machine,\
    \ also known as `JVM`, that the program successfully ran and finished. The keyword\
    \ `static` signals the program that the field refers to the class and neither\
    \ the objects nor the instances in it. In other words, the program will be able\
    \ to freely go through the class without creating instances in that class. Due\
    \ to the nature of the main method to act as the program’s entry point, it is\
    \ essential to declare it as `static`. Hence, our syntax for the main method declaration\
    \ should follow this format:\n\n`[access modifier] static void`\n\nHowever, this\
    \ is not a complete declaration for the main method yet. We should also add the\
    \ parameter `main(String[] args)` to allow the program in executing command-line\
    \ arguments. And so, our final code for the main method should look like this:\n\
    \n```java\npublic static void main(String[] args)\n```\n\nIf added to our line\
    \ of codes above, our IDE should look like this:\n\n```java\npackage javatestproject;\n\
    public class JavaTestProject {\n    public static void main(String[] args) {\n\
    \    }\n}\n```\n\n## Writing the Program Output\n\nAs of now, you already covered\
