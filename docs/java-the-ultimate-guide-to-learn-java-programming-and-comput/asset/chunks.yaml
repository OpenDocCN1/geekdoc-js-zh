    # Computer Hacking: The Essential Hacking Guide for Beginners

    MATT BENTON


    ## Contents

    - Introduction – What is Hacking?

    - Chapter 1 – Hacking and the Influence of Cyberpunk

    - Chapter 2 – The Different Types of Hackers

    - Chapter 3 – Computer Security

    - Chapter 4 – Hacking Techniques

    - Conclusion


    ## Introduction – What is Hacking?

    Hacking is the act of gaining unauthorized access to a computer system, and can
    include viewing or copying data, or even creating new data. Often hacking is understood
    to be a way of maliciously disrupting a computer system, copying information,
    or leaving behind a virus that destroys data.


    There are many different reasons why hacking takes place, and these reasons range
    from wanting to disrupt a system due to ideology (so hacking as a means of protesting);
    wanting to gain profit for example in order to commit credit card fraud; or simply
    hacking for the sake of enjoyment and amusement.


    There is some controversy about the definition of the word ‘hacker’ because those
    that try to prevent such breaches in security from taking place, or seek to recover
    lost files, can also be known as hackers. Thus, some people believe that the correct
    term for malicious system security breaches is in fact ‘cracking’ and that ‘hacking’
    is the correct word to use for those who fight against such malicious exploitation
    of computer weaknesses.


    However, in the popular imagination and in general conversation, the word ‘hacker’
    is mainly understood to refer to the ‘bad’ method of breaking through computer
    security. The two processes share many common skills, as regardless of motivation
    (whether to steal or protect, break in to or save, computer data) the same understanding
    of computers is required.


    Hacking is more than simply a pastime for those who are interested in technology,
    and more than simply an illegal activity used for personal gain and with malicious
    intent, although both of these motivations do make up much of hacking activity.
    In fact, hacking is its own subculture, and members of the community feel very
    strongly about their ideologies, techniques and social relationships in the computer
    underworld.


    There are many hacking groups and conventions, such as SummerCon, DEF CON, HoHoCon,
    ShmooCon, BlackHat, Chaos Communication and Hacker Halted, and local hacking communities
    take their entries into hacking competitions very seriously. Unsurprisingly there
    are also numerous online groups and forums dedicated to the subject of hacking,
    and there is certainly a strong community spirit felt by those with similar hacking
    ideologies.


    Furthermore, hackers are often passionate about literary depictions of the hacking
    community, and ardently read fictional Cyberpunk and factual hacker magazines.


    This book will serve as an introduction to the world of hacking, and will provide
    insight into some of the key influences, ideologies, groups, concepts, and techniques
    of hacking.


    The first chapter will consider the beginnings of hacking and the influence of
    the literary genre, Cyberpunk. The second chapter will look at the different types
    of hackers, and draw a distinction between ethical and unethical hacking. The
    third chapter will look at the issue of computer security, which is vital to an
    understanding of hacking.


    The final chapter will provide an overview of the various different techniques
    for hacking, including automated and manual approaches as well as the importance
    of the cyber confidence trick known as social engineering.


    ## Chapter 1 – Hacking and the Influence of Cyberpunk

    Michael Bruce Sterling, the American science fiction author, helped establish
    the popular genre of Cyberpunk. Cyberpunk is a subcategory of science fiction
    that focuses on the role of technology in a future setting. In this literary and
    cinematic genre, lower-class citizens are depicted, who have access to, and a
    great understanding of, advanced technology.


    Cyberpunk often explores the role of technology during the breakdown of social
    order, in which there is an oppressive government restricting and damaging the
    lives of the general population. Furthermore, artificial intelligence (such as
    robots or intelligent computers) also plays a significant part in Cyberpunk stories,
    and the Earth is depicted in the near future in a post-industrial dystopia (the
    opposite of utopia, and therefore a bleak world characterized by oppression and
    often social unrest.)


    ![Описание: C:\Users\Diana\Desktop\images.jpg](images/00011.jpeg)


    The impact of Cyberpunk in the present-day understanding of hacking is considerable.
    Science fiction is particularly effective when we can recognize our own world
    within the fictional representation, and with Cyberpunk we can recognize many
    of the concerns of the contemporary technological age. Lawrence Person (editor
    of the science fiction magazine Nova Express) describes the typical characters
    in Cyberpunk:


    “Classic cyberpunk characters were marginalized, alienated loners who lived on
    the edge of society in generally dystropic futures where daily life was impacted
    by rapid technological change, an ubiquitous data sphere of computerized information,
    and invasive modification of the human body.”


    To a contemporary reader, this description of Cyberpunk characters is reminiscent
    of how hackers are thought of in the popular imagination, and depicted in books
    and in films. Therefore, the interplay between Cyberpunk characters and how we
    view real-life hackers is considerable: in many ways our understanding of what
    a hacker is like is based on how Cyberpunk characters are depicted in fiction.
    One example of this is how in Cyberpunk the characters often live in filthy conditions,
    work at night and sleep all day, and do not have any social life beyond chat rooms.


    In the present-day imagination when we think of hackers we will often think of
    a lonely boy sitting in a darkened room behind a computer screen. In fact, Michael
    Bruce Sterling, who was one of the first science-fiction writers who dealt with
    Cyberpunk, has also shown the most interest in understanding the development of
    hacking.


    ![Описание: C:\Users\Diana\Desktop\images (1).jpg](images/00012.jpeg)


    Sterling has traced the emergence of hacking, and the associated underground computer
    network, to the Yippies, a counterculture group who were active in the 1960s and
    published Technological Assistance Program, a newsletter that taught its readership
    techniques for unauthorized access to telephones, known as phreaking.


    Many of the individuals who were involved in the phreaking community are also
    an active part of the underground hacking community, suggesting that the relationship
    between the two groups.


    ## Chapter 2 – The Different Types of Hackers

    The computer hacking underground contains various different subcategories of hackers.
    This is mainly due to conflicting ideologies, whereby certain groups calls themselves
    by a specific name, or call others a specific name, in order to emphasize that
    they do not agree with the ideologies of others.

