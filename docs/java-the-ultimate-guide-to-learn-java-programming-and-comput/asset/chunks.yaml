    Conclusion


    The Java programming language gives you unlimited tools to achieve different operations.
    However, it is extremely important to get to know the IDE you chose to use. Beginners
    should find which IDE they feel most comfortable working on. Although all IDEs
    use a single programming language, each has its own unique interface that might
    change your programming pace.


    We also learned how to start a new project and the essential elements a project
    needs such as the main class and the main method. Packages were also introduced
    and although the package declaration is optional, we have learned that declaring
    packages in our Java program will help us efficiently organize multiple classes
    for bigger projects.


    The main class and the main method may also contain access modifiers that will
    allow the program in defining whether it should allow other classes in accessing
    the statement or not. It is a general practice to use “Public” as the main class’s
    access modifier.


    Allowing the program to return a message as its output has also been discussed
    in the first chapter of this book. You may use the keyword “print” as the simplest
    form of the parameter or you may rather sign the Java program to show the string
    in another line. This can be done with the use of the keyword “println”.


    We also discussed how dull it is to have a one-way-only program where users were
    not capable of sending an input. The Java programming language has an answer to
    this by allowing you to use its built-in Scanner class which can be found in the
    built-in local package known as java.util. The Scanner class allows us to collect
    data entered by the user from their keyboard. This opened new operations such
    as returning the user input as the program output.


    The next chapter introduces variables and how do they bring out the full potential
    of the Java programming language. We discussed the different data types that we
    can store inside variables and how to call these data for our program’s output.
    It is also important to remember that we can also store variables into another
    variable for efficient programming later on.


    Lastly, our last chapter discusses the different operators aside from the assignment
    operator represented by the equal sign ( = ). In the end, we combined everything
    we have learned to create a Java program which can solve a mathematical equation
    based on user’s input.


    At this point, I am confident that you already grasped the idea behind the Java
    programming language as an object-oriented language. I personally congratulate
    you for finishing this book and I am quite sure that you are now ready to move
    forward to a more advanced method in Java programming.'
