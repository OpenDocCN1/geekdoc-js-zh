    快速学习 Java 编程的终极指南（入门 Java、傻瓜 Java、如何编程、Java 应用、Java 编程）


    PETER HOFFMAN


    ## 引言


    Java 语言最初是由 Sun Microsystems 的一个由 James Gosling, Sheridan, Patrick Naughton 和
    Chris 组成的团队引入的。它是一种面向对象的语言。


    ## Java 平台


    - Java 标准版 (SE)

    - Java 企业版 (EE)

    - Java 微版 (ME)

    - JavaFX


    ## 入门工具


    为了学习 Java，你需要选择一个 IDE。IDE，即集成开发环境，是用于编写代码的工作空间。以下是 IDE：


    - BlueJ：这是一个面向初者的 IDE。它最初是为学者设计的。

    - DrJava：这是一个轻量级 IDE。类似于 BlueJ，它也是为学者设计的。

    - Eclipse：如今流行的 IDE 之一，是一个开源平台。

    - NetBeans：另一个流行的 IDE，因其用户界面被推荐给学者。


    除了 Java IDE 之外，你需要的另一个工具是 JDK。JDK，全称为 Java 开发工具包，是你计算机的解释器和编译器。没有它，你的计算机将无法将 Java
    代码转换为机器语言。所有版本的 JDK 都可以从官网下载。


    ## 第 1 章 – 编写 Java 程序


    一旦你选择了心仪的 IDE 并下载了最新版本的 JDK，你现在拥有了使用 Java 语言编程的工具。然而，拥有工具并不意味着你已经准备好编写你的第一个 Java
    应用程序。


    理解 Java 程序的结构——其主要组件及其在应用程序中的组成也是重要的。


    ### 软件类型


    你可以使用 Java 语言创建两种软件——Applet 和应用程序。


    Applet 是设计在浏览器中运行的较小代码。我们可以将 Applet 视为更小、更量级的应用程序。它们主要用于提供导航增强或额外的交互。与独立的 Java
    应用程序相比，Applet 不需要解释器即可执行。


