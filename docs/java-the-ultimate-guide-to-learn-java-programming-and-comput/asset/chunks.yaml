  trans: "\n\n通过 Java 开发的另一种类型的软件是控制台应用程序。控制台应用程序是在控制台环境中运行的独立程序。所有的 IDE 都拥有一个集成的控制台环境，以便你测试此类程序。作为一个初学者，学习控制台操作对于你良好掌握\
    \ Java 语言的基础至关重要。\n\n![java_programmers_brain_screensaver_preview](img/00007.jpeg)\n\
    \n## 类、实例与对象\n\n类、实例和对象是使用如 Java 等面向对象的语言创建程序时的三个核心元素。为了理解这三者，你首先需要查看它们之间的关系。\n\
    \n类（Classes）是最高层，它们涵盖了 Java 编程语言中的一切。类中的特定元素被称为 `Objects`（对象）。一旦你为 `Object` 添加额外的规格，它就变成了一个\
    \ `Instance`（实例）。\n\n比方来说，假设这里的类是 `animal`（动物）。在 `animal` 类下，我们有不同种类的动物如 `dogs`（狗）、`cats`（猫）、`birds`（鸟）等。这些都是\
    \ `animal` 类下的 `objects`。在 `dogs` 类别下，我们有不同的品种，如 `poodles`（贵宾犬）、`golden retrievers`（金毛犬）、`Labradors`（拉布拉犬）等。这些就是对象\
    \ `dogs` 的 `instances`。\n\n## 创建项目\n\n编写 Java 程序的第一步是在所选的 IDE 中启动一个新的空项目。你可以通过如下导航最顶部的工具栏来实现：\n\
    \n`File -> New Project`\n\n选择 `New Project` 后，会弹出一个新窗口，你可以在其中类别列表中进行选择。在 `Categories`\
    \ 列表中，选择 `Java`，然后在相邻的窗口面板中选择 `Java Application`。之后，点击 `Next` 按钮，系统会要求输入项目名称以及你想保存项目的位置。\n\
    \n始终记住项目名称，因为在过程中会被要求返回同一个项目。\n\n## 创建主类\n\n在创建新项目后，IDE 会自动创建包（package）和主类（main\
    \ class）。包也被称为源包（source packages），作为文件夹使用，你可以在其中高效地组织 Java 项目的所有资产，如类和实例。但请注意，包仅仅是资产组织的标识符。将它们想象成计算机中的文件夹，你据此组织文件。\n\
    \n在包下应该有一个主类。如果 IDE 没有自动创建主类，你可以通过如下导航主菜单来创建：\n\n`File -> New File -> Java Class`\n\
    \n主类在 Java 程序中起着至关重要的作用。`main` 方法是打开 Java 程序时最初执行的内容，它包含在主类中。在其他编程语言中，`main` 方法被称为入口点。\n\
    \n### 编写包语句\n\n现在我们已经在 Java 项目中有了主类，现在准备好编写我们的第一行 Java 编程语言代码——包语句（package statement）。该语句是程序的可选部分，仅为了学习目的才向你介绍它。它使用以下语法编写：\n\
    \n`package [package name];`\n\n如果没有写这一行，IDE 将自动查找默认包。换句话说，如果你在一个包含多个包的 Java 项目中工作，包语句可能会派用场。请记住，包名必须与类所属的包名匹配。例如，假设你的包名是\
    \ `javatestproject`。在你的 IDE 中，语法应该是这样的：\n\n```java\npackage javatestproject;\n\
    ```\n\n### 编写类声明\n\n紧随包语句之后的是类声明（class declaration）。我们需要遵循的语法如下：\n\n`[access modifier]\
    \ class [class name]`\n\n你可以使用两种访问修饰符：`public`（公共）和 `private`（私有）。`private` 修饰符防止其他类访问声明的类，而\
    \ `public` 修饰符则允许其他类访问声明的类。目前，让我们专注于并将 `public` 作为我们第一个 Java 程序的访问修饰符。\n\n类名（Class\
    \ name）如其名，是你指定为主类的名称。请注意，Java 编程语言对大小写敏感，因此请确保你的主类名使用正确的大小写字母。假设我们的主类名为 `JavaTestProject`，那么我们现在应该拥有：\n\
    \n```java\npackage javatestproject;\npublic class JavaTestProject {\n}\n```\n\n\
    左括号（`{`）和右括号（`}`）指的是 Java 代码块的开始和结束。这有助于程序确定特定代码块从哪里开始何时结束。\n\n### 编写 main 方法\n\
    \n现在类声明完成后，是时候为我们的第一个程序声明 main 方法了。在 main 方法中，我们将使用两个关键字：`void` 和 `static`。\n\n\
    `void` 关键字向 Java 虚拟机（也称为 `JVM`）信号程序已成功运行并结束。`static` 关键字向程序信号该字段指的是类，而不是类中的对象或实例。换句话说，程序可以在不创建该类实例的情况下自由地访问该类。由于\
    \ main 方法作为程序入口点的性质，将其声明为 `static` 是至关重要的。因此，我们 main 方法声明的语法应该遵循此格式：\n\n`[access\
    \ modifier] static void`\n\n然而，这还不是 main 方法完整的声明。我们应该添加参数 `main(String[] args)`\
    \ 以允许程序执行命令行参数。因此，我们 main 方法的最终代码应该是：\n\n```java\npublic static void main(String[]\
    \ args)\n```\n\n如果添加到上面的代码中，我们的 IDE 应该是：\n\n```java\npackage javatestproject;\n\
    public class JavaTestProject {\n    public static void main(String[] args) {\n\
    \    }\n}\n\n\n## 编写程序输出\n\n现在我们已经涵盖了 Java 程序的基础部分。遗憾的是，我们还没有告诉程序具体要做什么。我们想要程序执行的是传递消息。我们称程序输出（Program\
    \ Output）或输出流（Output Stream）。为了让程序传递消息，我们应该使用以下语法：\n\n`System.out.print(\"[message]\"\
    )`\n\n不用 `print` 参数，你可以将其替换为 `println`。这在执行后会将输出打印到新行。因此，另一种格式应该是：\n\n`System.out.println(\"\
    [message]\")`\n\n让我们现在使用上面的命令行让程序打印“Java is Awesome!”语句。我们的语法应该是：\n\n`System.out.print(\"\
    Java is Awesome!\");`\n\n当我们插入输出代码后，我们的 IDE 应该是：\n\n```java\npackage javatestproject;\n\
    public class JavaTestProject {\n    public static void main(String[] args) {\n\
    \        System.out.print(\"Java is Awesome!\");\n    }\n}\n\n## 允许用户输入\n\nJava\
    \ 编程语言允许你通过发送输入让用户与程序通信。我们可以通过使用内置类 `Scanner` 来。\n\n`Scanner` 类收集来自计算机键盘的用户输入。它将收集到的数据存储在变量中，这些变量可以在程序的输出流中执行。为了这一点，我们需要在包语句添加以下行：\n\
    \n`import java.util.Scanner;`\n\n这是一个导入语句（import statement）的示例，它信号程序从名为 `java.util`\
    \ 的内置 Java 包中导入 `Scanner` 类。这就是我们在 IDE 中添加它们的位置：\n\n```java\npackage javatestproject;\n\
    import java.util.Scanner;\n```\n\n"
- fmt: "\nThis, however, does not do anything yet. We need to assign a variable name\
    \ to the `Scanner` class first in order to call the scanner’s collected data into\
    \ our output stream. We can assign a variable name to the `Scanner` class by using\
    \ the following statement:\n\n```\nScanner [variable name] = new Scanner(System.in);\n\
    ```\n\nYou can assign any name to the variable. It is a common practice to start\
    \ the name with an uppercase character followed by lowercase characters. It is\
    \ also a good practice to separate words by using uppercase characters. Let us\
