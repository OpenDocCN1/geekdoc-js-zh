    Introduction


    The company behind the Java programming language is the Sun Microsystems. The
    language was initially introduced in the year 1991\. It was developed by a team
    of people consisting Mike Sheridan, Ed Frank, Chris Warth, Patrick Naughton, and
    James Gosling. Due to its object-oriented nature, the Java language can be reused
    with regards to data focus, classes creation, written instructions, and the creation
    of both instances and objects.


    The Four Java Platforms


    There are four primary platforms in the Java programming language. They are as
    follows:


    *   Java Standard Edition (Java SE)


    *   Java Enterprise Edition (Java EE)


    *   Java Micro Edition (Java ME)


    *   JavaFX


    Java-based applications that were being used for computer software were developed
    on the standard edition of Java. Java-based applications for web servers were
    developed on the enterprise edition while Java-based applications for multimedia
    platforms were developed on JavaFX. Most JavaFX-based applications are what we
    usually call flash players. Lastly, Java-based applications for mobile devices
    were developed on the micro edition Java platform.


    Tools for Beginners


    In order to begin your journey to the world of Java programming, you need to choose
    which IDE to use. IDE, also known as Integrated Development Environment, serves
    as your workspace in writing Java applications. Imagine it as your notepad in
    writing HTML codes. However, IDEs were specifically designed for the Java language
    which means it features all the tools you might need in Java development.


    Here are the following IDEs that you can use:


    *   BlueJ – this is an ideal IDE for beginners. You can easily navigate due to
    its simplistic interface. It was also originally designed to help beginners in
    familiarizing the primary concepts of the Java language.


    *   DrJava – this is a lightweight IDE. Similar to BlueJ, DrJava was also designed
    for beginners. Although it features a simplistic user interface, DrJava has enough
    tools that every advanced Java developer can use as well.


    *   Eclipse – one of the popular IDEs today, the Eclipse is an open source platform
    with responsive navigation and design. Apparently, it has the cleanest user interface
    compared to other IDEs in this list.


    *   NetBeans – this is another popular IDE which is commonly used in Java development
    nowadays. This is highly recommended for beginners due to its fast and powerful
    tools that are compatible in all platforms of the Java language.


    Each IDE has a unique user interface and ease of navigation. Feel free to use
    any IDE where you feel most comfortable with. Keep in mind that all of them use
    the same language although they may appear to be different from one another.


    Aside from Java IDEs, another tool you need to begin learning the Java programming
    language is the JDK. JDK, which stands for the Java Development Kit, serves as
    your computer’s interpreter and compiler for the Java language. Without this,
    your computer will not be able to translate Java codes into the universal machine
    language. All versions of JDK are available from the official website of Oracle.


    Take note that you need to choose the JDK version that is most appropriate to
    your computer’s operating system to avoid future issues when compiling written
