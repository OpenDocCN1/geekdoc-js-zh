    # Chapter 2 – Variables\n\nDue to the introduction to the `Scanner` class above,\
    \ we are now familiar with variables. However, the full potential of variables\
    \ was still unknown to us.\n\nVariables serve as containers of data. They allow\
    \ us to call specific data in a more convenient way. We can also create a new\
    \ set of data using inconsistent values through the use of variables. Most programming\
    \ languages use variables and developers were able to solve both arithmetic and\
    \ logical operations through them.\n\nIn order to utilize a variable, we need\
    \ to declare it first and then assign a data type upon its declaration. By doing\
    \ so, the program will be able to recognize what kind of value was stored inside\
    \ a variable.\n\n![java4](images/00008.jpeg)\n\n## Overview of Data Types\n\n\
    There are different data types and we can use each type in various operations\
    \ and functions. Before we can learn how to assign a data type to a variable,\
    \ it is important to first familiarize ourselves with the data types. Here is\
    \ a table of the data types we can use for variables in the Java programming language\
    \ and their brief descriptions:\n\n| Data Type | Description |\n| :--- | :---\
    \ |\n| `Boolean` | This data type has only two possible values: `true` or `false`.\
    \ |\n| `Byte` | This data type has the tiniest range compared to all number-based\
    \ data types. Its value by default is `0` and it may store an 8-bit 2s integer.\
    \ |\n| `Character` | This data type only stores a single character. By default,\
    \ the value will always be an empty space. |\n| `Double` | This data type can\
    \ store numerical value of 64-bit IEEE 754 and has a value of `0.0d` by default.\
    \ These are numerical values that have decimal points. |\n| `Float` | This data\
    \ type stores 32-bit IEEE 754 which is less specific than the `Double` data type.\
    \ By default, data is set to `0.0f`. |\n| `Integer` | This data type is the simplest\
    \ way to handle numerical values. When not specified, it will automatically translate\
    \ the value into `0`. It does not support decimal points which make it inefficient\
    \ for precise values. |\n| `Long` | This data type allows you to store numerical\
    \ value between -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807. Its default\
    \ value is `0`. |\n| `Short` | This data type allows you to store a numerical\
    \ value between -32,768 to 32,767. By default, it is set to `0`. |\n| `String`\
    \ | This data stores alphanumeric values. Empty string variables will give `null`\
    \ values by default. |\n\n## Creation of Variables\n\nWe need to write a declaration\
    \ statement in order to create a variable for a certain data type. Any name can\
    \ be assigned to a variable which we will also use when calling the stored data\
    \ in the future block of codes.\n\nLet us create a variable using the ` data type\
    \ and let us name this variable as “MyAge”. Our declaration syntax should be:\n\
    \n```\nint MyAge;\n```\n\nBy default, the program will assign the zero value to\
    \ the `MyAge` variable since we did not specify an integer value. In order to\
    \ assign a specific value inside the `MyAge` variable, we will use the equal (`=`)\
    \ operator sign. Let us say that we want to assign the value `20` to the variable.\
    \ Our syntax will now look like this:\n\n```\nint MyAge = 20;\n```\n\nThe same\
    \ goes with other data types. Here is the list of examples for each data type\
    \ when declaring them in our IDE: (Assigned variable name is “TestVar”)\n\n| Syntax\
    \ Formula | Example |\n| :--- | :--- |\n| `Boolean [variable name] = [true or\
    \ false];` | `Boolean TestVar = true;` |\n| `byte [variable name] = [numerical\
    \ value];` | `byte TestVar = 0;` |\n| `char [variable name] = [single character];`\
    \ | `char TestVar = L;` |\n| `double [variable name] = [numerical value]d;` |\
    \ `double TestVar = 31.13d;` |\n| `float [variable name] = [numerical value]f;`\
    \ | `float TestVar = 1.3f;` |\n| `int [variable name] = [numerical value];` |\
    \ `int TestVar = 5;` |\n| `long [variable name] = [numerical value];` | `long\
    \ TestVar = 0L;` |\n| `short [variable name] = [numerical value];` | `short TestVar\
    \ = 32000;` |\n| `String [variable name] = [alphanumeric value];` | `String TestVar\
    \ = null;` |\n\n# Data Type and User Input\n\n![java-text-editor-syntax-highlighting](images/00009.jpeg)\n\
    \nWe already know that we can collect input with the use of `Scanner`. Now, we\
