    -   需求驱动


    这里肯定还有我遗漏的其他问题，我鼓励你去寻找答案。一个拥有优质且通常是最实时的文档的地方是 MDN 开发者网络。


    还有许多我没有机会讨论的话题，例如：

    - Web Workers、Service Workers、IndexedDB、本地存储（localStorage）和会话存储（SessionStorage）、通过
    WebSockets 和 XRequests 进行分页，以及最近的 Fetch API，但我相信如果你已经读到了这里，你现在能够理解大多数在线技术文章了。


