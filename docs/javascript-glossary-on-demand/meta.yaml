- md: '

    ## Property Definition and Assignment


    To secure or immune to errors, we have no control, even not at all, of many things
    could possibly go wrong. There are better approaches to control our application,
    and on that many things could possibly grow.


    There are many ways to define a property, especially when the new object was created.


    ### Which descriptor for what


    Having various ways to define a property can be both handy and frustrating. There
    are many glitches to talk about when it comes to descriptors, but let''s stick
    to common ones available in JavaScript.


    For instance, every generic property as assignment will be writable, configurable,
    and enumerable descriptor.


    | Property | Configurable | Writable | Value |

    | :--- | :--- | :--- | :--- |

    | Name | True | True | String |

    | Age | True | True | 7 |

    | Function | True | True | Function |


    ### Native Code


    It is actually lucky that native descriptors are configurable and writable, as
    it means that they can be reassigned and fixed, whenever necessary.


    ## Defensive Method Descriptor


    If we are creating a class for our own purposes, we probably want to ensure that
    its methods cannot possibly modified anywhere else, during the application execution.


    In these cases we might want to set methods directly in the prototype as follows:


    - Define a property method directly in the class or function.

    - Configurable: false, Enumerable: false, Writable: false - not possible to change
    it later.


    ## Lazy Property Descriptor


    When we talk about properties, we refer to those properties that will have expected
    value after the first time we need.


    One page, we are going to detail it with many features, but we can ask for more
    properties. In paper, the car has a defined property, but it will be defined like
    that.


    ## Lazy Property Descriptor


    The reason we need to use defined property is that if we want to change the property
    in the future, we should be able to remove this property or replace it, which
    is why we set it as configurable.


    The last important information about descriptors is that not only can you set
    them, but you can always receive them too. Let''s try to pay around with this
    method, explaining or validating everything we learned so far. Have a closer look
    at the object property.


    ### Most directly accessed JavaScript class


    | Property Name | Configurable | Writable | Value |

    | :--- | :--- | :--- | :--- |

    | Name | True | True | String |

    | Age | True | True | 7 |

    | Function | True | True | Function |


    ## Object.defineProperties(obj, descriptors)


    The plural version of Object.defineProperties someho simplifies the multiple descriptors
    assignment, as it requires less typing (which is always a plus).


    | Property Name | Configurable | Writable | Value |

    | :--- | :--- | :--- | :--- |

    | Name | True | True | String |

    | Age | True | True | 7 |

    | Function | True | True | Function |


    ## Static Method


    We have been using methods as object keys among others which are exposed through
    the globally available object class. There are other methods, in most of native
    classes. `Array.isArray(array)`, `String.fromCharCode(0x1f49)`, or `Number.isNaN(nan)`,
    just to name a few.


    These are methods related to the constructors they are attached to. It is possible
    to define similar static methods themselves, in the good way.


    ## Function Descriptor


    Remember: functions are just objects. `square.function = function(n) { return
    n * n; }`, `square.return = function(n) { return n * n; }`.


    Let''s test two different rectangles:


    - `var rect1 = new Rectangle(2, 3);`

    - `var rect2 = new Rectangle(2, 2);`


    Invert the rectangle.isSquare: `square(rect1.isSquare)`


    The square property is false, but it still returns true if that instance is a
    square. No this context involved whatever.


    The latter conditions are the same for every public static function. For instance,
    object keys don''t need the object context in order to be executed.

    '
  mdcn: '


    ## 属性定义与赋值


    为了确保安全或免受错误影响，我们对许多可能出错的问题完全没有控制能力。有更好的方法来控制我们的应用程序，并防止许多可能出现的问题不断增加。


    定义属性有许多方法，特别是在创建新对象时。


    ### 在什么情况下使用什么描述符


    有多种定义属性的方法，既方便又令人沮丧。谈到描述符（descriptors）时，有很多问题需要讨论，但让我们专注于 JavaScript 中常用的描述符即可。


    例如，每个作为赋值的通用属性都将具有可配置、可写入和可枚举的描述符。


    | 属性 | 可配置 (Configurable) | 可写入 (Writable) | 值 (Value) |

    | :--- | :--- | :--- | :--- |

    | Name | True | True | String |

    | Age | True | True | 7 |

    | Function | True | True | Function |


    ### Native Code


    原生描述符的可配置和可写入实际上是幸运的，这意味着它们可以在需要时重新赋值和修复。


    ## 防御性方法描述符


    如果我们为了自己的目的创建一个类，我们可能希望确保其方法在应用程序执行过程中无法在其他地方被修改。


    在这种情况下，我们可能希望按照如下方式在原型中直接设置方法：


    - 直接在类或函数中定义属性方法。

    - Configurable: false, Enumerable: false, Writable: false - 之后无法更改。


    ## 懒加载属性描述符


    当我们谈论属性时，指的是那些在我们第一次需要之后将具有预期值的属性。


    在后续页中，我们将通过许多功能详细介绍它，但我们可以请求更多属性。在理论上，汽车有一个定义的属性，但它的定义方式是那样。


    ## 懒加载属性描述符


    我们需要使用定义属性的原因是，如果我们将来想更改该属性，我们应该能够删除或替换该属性，这就是我们将其设置为可配置的原因。


    关于描述符的最后一个重要信息是，你不仅可以设置它们，而且始终获取它们。让我们尝试用这种方法进行练习，解释或验证我们目前学到的所有内容。仔细观察对象属性。


    ### 最直接访问的 JavaScript 类


    | 属性名 | 可配置 (Configurable) | 可写入 (Writable) | 值 (Value) |

    | :--- | :--- | :--- | :--- |

    | Name | True | True | String |

    | Age | True | True | 7 |

    | Function | True | True | Function |


    ## Object.defineProperties(obj, descriptors)


    `Object.defineProperties` 的复数版本某种程度上简化了多个描述符的赋值，因为它需要的输入更少（这总是一个加分项）。


    | 属性名 | 可配置 (Configurable) | 可写入 (Writable) | 值 (Value) |

    | :--- | :--- | :--- | :--- |

    | Name | True | True | String |

    | Age | True | True | 7 |

    | Function | True | True | Function |


    ## 静态方法


    我们一直使用方法作为对象的键等，这些方法通过全局可用的类暴露。在大多数原生类中还有其他方法，例如 `Array.isArray(array)`、`String.fromCharCode(0x1f49)`
    或 `Number.isNaN(nan)` 等。


    这些方法与其依附的构造函数相关。我们也可以以正确的方式自己定义类似的静态方法。


    ## 函数描述符


    记住：函数只是对象。`square.function = function(n) { return n * n; }`，`square.return = function(n)
    { return n * n; }`。


    测试两个不同的矩形：


    - `var rect1 = new Rectangle(2, 3);`

    - `var rect2 = new Rectangle(2, 2);`


    反转矩形的 .isSquare：`square(rect1.isSquare)`


    square 属性为 false，但如果该实例是正方形，它仍然返回 true。这不涉及任何上下文。


    后者的条件对于每个公共静态函数都是相同的。例如，对象键在执行时不需要对象的上下文。


    '
