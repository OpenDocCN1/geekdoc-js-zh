    \ ) ;\n\n* 显示 2。也是\n\n然而，当我们需要三元逻辑时，可能应该使用适当的运算符。\n\n## 真值与假值\n\nif 或 else 语句，以及三元或逻辑运算符都是非常仁慈的。检查一个实际的布尔类型\
    \ true 或 false 值并没有区别。值 `false` 连同数字 0、空字符串 \"\"、null 值、undefined 以及自身的 NAN 引用，被视为*假值\
    \ (falsey values)*。这意味着其他所有内容都被视为*真值 (truthy)*，就好像它们是一个真条件一样。\n\n### IF console.log\
    \ 任何对象都是真 ) ;\n\n### IF [] console.log 即使是空数组也是真 ) ;\n\n### IF -1 console.log(\
