    \n**VAR PROPERTY**\n* TRUE\nPROPERTY HAS DEFINED IT*\n* FALSE\nPROPERTY HAS PROPERTY\
    \ TO STRINGING 12)\n* TRUE\n* FALSE\nPROPERTY HAS PROPERTY TO STRING 12)\n* FALSE\n\
    IF YOU LOOK OVER WITH A FORFORIN, YOU'LL see THAT PROP IS REALABLE IN there, BUT\
