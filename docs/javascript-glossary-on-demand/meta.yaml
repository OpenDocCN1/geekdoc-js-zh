- md: "\n## CONLOG(TYPE A)\n\n### UNDEFINED\n\n**FUNCTION** MYSCOPE() ^ USE STRICT\
    \ - ?? SWITCH WITH LOCAL SCOPE TO STRICT MODE* A123.\n\nMYSCOPE() * SHOWS AND\
    \ ERROR\n\nCONLOG(TYPE A)\n\n### STILL UNDEFINED\n\nNot only is it impossible\
    \ to define variables in the global scope by accident, but when this directive\
    \ is used, the execution context will also be undefined, unless explicitly provided.\n\
    \n### DEFINED IN THE GLOBAL SCOPE\n\n**FUNCTION** WHO,THIS() ^ USE STRICT - **RETURN\
    \ THIS**!`\n\nWHO,THIS()\n\n### UNDEFINED\n\n**THIS**.WHO,THIS() * ?? THE GLOBAL\
    \ CONTEXT*\n\n**METHOD CONTEXT**\n\nIn JAVASCRIPT OBJECTs can have properties\
    \ of any kind and functions are no exception.\n\n### CREATE AN EMPTY OBJECT\n\n\
    **VAR** REM ^`.-\n\n### DEFINE A PROPERTY AS FUNCTION EXPRESSION\n\nrem.SOMEPROPERTYNAME\
    \ **FUNCTION** ^\n\n**RETURN THIS**!`\x1E\n\n### WHAT WOULD BE THAT RETURNED CONTEXT\
    \ VALUE\"*\n\n* LET US FIGURE IT OUT BY INVOKING rem.SOMEPROPERTYNAME\n\nrem.SOMEPROPERTYNAME()\
    \ * EXACTLY THE REM ITSELF*\n\nWhen a function is invoked through an object, it\
    \ implicitly uses this object as its current execution context. It is important\
    \ to remember that any function can be attached to any object at any time, even\
    \ if it is not directly defined as a property of that object.\n\n### GENERIC FUNCTION\
    \ DEFINED HERE SOME ELSE\n\n**GENERIC FUNCTION** SAYTHE NAME CONLOG.THIS.\n\n\
    GENERIC OBJECT WITH PROPERTY AND VALUE. WE CAN INVOKE IT AS METHOD. SAYTHE NAME\
    \ ATTACHED AS THE, EVEN THOUGH IT IS NOT SUCH GOOD IDEA TO ATTACH METHODS, THE\
    \ fact THAT we can borrow functions OF ANY KIND AND USE THEM AS DIFFERENT OBJECTS\
    \ IS NOTLESS AMAZING. Why should we need that is more than a little question,\
    \ and the answer is for each collection of items does not necessarily have all\
    \ methods like an array. NEW: THERE ARE BETTER AND CLEANER WAYS TO INVOKE A FUNCTION\
    \ BY PROVIDING A CONTEXT.\n\nINVOKING FUNCTION VIA CALL OR APPLY AS DESCRIBED\
    \ IN THE TYPES PARAGRAPH, FUNCTIONS ARE SPECIAL OBJECTS THAT CAN BE EXECUTED.\
    \ JUST LIKE ANY OBJECT, FUNCTIONS CAN ALSO HAVE PROPERTIES, THEN METHODS.\n\n\
    THE MOST COMMONLY USED METHODS OF ANY FUNCTION ARE .CALL AND .APPLY, WHICH ONLY\
    \ DIFFER IN WHAT WHILE. .CALL ACCEP AN ARBITRARY COUNT OF ARGUMENTS TO PASS ALONG,\
    \ .APPLY ACCEP ONLY AN ARRAY TO BE USED AS INVOCATION ARGUMENTS.\n\n### THREE\
    \ FUNCTIONS THAT LOG SOME INFORMATION\n\nFUNCTION WITH NO ARGUMENTS() ^ CONLOG\
    \ NOTHING TO DO HERE\n\nFUNCTION WITH ONE ARGUMENT (FIRST) CONLOG RECEIVED, FIRST!\n\
    \nFUNCTION WITH TWO ARGUMENTS (A, B) CONLOG RECEIVED, A, B!\n\n### USING CALL\
    \ AND IGNORING THE FIRST CONTEXT VALUE FOR NOW, USING NULL:\n\nWITH ARGUMENTS(NULL)\
    \ )\n\nWITH ONE ARGUMENT(NULL, SOME VALUE )\n\nWITH TWO ARGUMENTS(NULL, FIRST\
    \ VALUE, SECOND VALUE )\n\nTO USE APPLY(), YOU NEED ONE OR MORE ARRAYS\n\n**VAR**\
    \ EMPTY!@.-\n\n**VAR** WITH ONE ARGUMENT > ANY VALUE @\n\n**VAR** WITH TWO ARGUMENTS\
    \ > 1ST, 2ND @\n\n### SAME RESULT AS YOU LOGGED ALREADY VIA .CALL\n\nWITH ARGUMENTS.APPLY(NULL,\
    \ EMPTY!)-\n\nWITH ONE ARGUMENT.APPLY(NULL, EMPTY!NAME)\n\nWITH ARGUMENTS.APPLY(NULL,\
    \ EMPTY,TWO)\n\nTIP TO REMEMBER THE DIFFERENCE BETWEEN CALL AND .APPLY. THE WORD\
    \ \"WITH\" AND FOR EACH*\n\nNOW THAT THE DIFFERENCE BETWEEN THESE TWO METHODS\
    \ IS CLEAR, IT TO UNDERSTAND AND WHATS ABOUT THEM. REMEMBER THE COLLECTION IN\
    \ THE PREVIOUS PAGE. ALL METHODS CONLOG(TYPE.NAME)\n\n### FUNCTION ARGUMENTS(SARRAY)\n\
    \n* MOST EVERY OBJECT HAS A STRING METHOD\n\n* IT USUALLY DESCRIBES WHAT KIND\
    \ OF OBJECT YOU ARE DEALING WITH CONLOG(TYPE.NAME)\n\nGENERIC FUNCTION DEFINED\
    \ HERE SOME ELSE WE CAN INVOKE FUNCTION THROUGH METHODS AS FIRST CONTEXT, ANY\
    \ VALUE THAT WILL BE RETURNED AS THIS.WITH,THIS.\n\nCONLOG.WITH(12)\n\n**ARGUMENTS**\
    \ EVERY TIME A FUNCTION IS INVOKED, IT REQUIRE MANY ARGUMENTS, EACH WHICH IS ALSO\
    \ THE NAME OF THE SPECIAL OBJECT THAT CREATED EACH TIME FUNCTION IS EXECUTED.\n\
    \nFUNCTION CONTEXT AND THREE ARGUMENTS(A, B) ^ CONLOG\n\nINVOKING FUNCTION CALL\
    \ OR APPLY AS DESCRIBED IN THE TYPES PARAGRAPH, FUNCTIONS ARE SPECIAL OBJECTS\
    \ THAT CAN BE EXECUTED. JUST LIKE ANY OBJECT, FUNCTIONS CAN ALSO HAVE PROPERTIES,\
    \ THEN METHODS.\n\nTHE MOST COMMONLY USED METHODS OF ANY FUNCTION ARE .CALL AND\
    \ .APPLY, WHICH ONLY DIFFER IN WHAT WHILE. .CALL ACCEPTS AN ARBITRARY COUNT OF\
    \ ARGUMENTS TO PASS ALONG, .APPLY ACCEPTS ONLY AN ARRAY TO BE USED AS INVOCATION\
    \ ARGUMENTS.\n\n### THREE FUNCTIONS THAT LOG SOME INFORMATION\n\nFUNCTION WITH\
    \ NO ARGUMENTS() ^ CONLOG NOTHING TO DO HERE\n\nFUNCTION WITH ONE ARGUMENT (FIRST)\
