    \ B) CONLOG 接收，A, B!\n\n### 现在使用 CALL 并忽略第一个上下文值，使用 NULL：\n\nWITH ARGUMENTS(NULL)\
    \ )\n\nWITH ONE ARGUMENT(NULL, SOME VALUE )\n\nWITH TWO ARGUMENTS(NULL, FIRST\
