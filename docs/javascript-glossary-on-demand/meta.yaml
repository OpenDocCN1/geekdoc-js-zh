  mdcn: "\n\n## CONLOG(类型 A)\n\n### 未定义\n\n**函数** MYSCOPE() ^ 使用严格模式 - ?? 将局部作用域切换到严格模式*\
    \ A123。\n\nMYSCOPE() * 显示错误\n\nCONLOG(类型 A)\n\n### 仍然未定义\n\n不仅无法在全局作用域意外定义变量，而且当使用此指令时，执行上下文也是未定义的，除非显式提供。\n\
