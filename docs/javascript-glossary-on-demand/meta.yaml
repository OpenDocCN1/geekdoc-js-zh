- md: "\n## CONSTRUCTOR\n\nWHEN YOU DECLARE A FUNCTION, THE ENGINE WILL AUTOMATICALLY\
    \ PROVIDE ITS\nprototype OBJECT.\n\n## FUNCTION\nJUST$FUNCTION() // AND IT COULD\
    \ DO ANYTHING IT WANTS *\nconsole.log(\n* \"WHO PUT THIS OBJECT HERE\"*\nJUST$FUNCTION.PROTOCOL,\n\
    * \"`*\"\n* IS THAT INTERPRETED FROM THE GLOBAL FUNCTION\"*\nJUST$FUNCTION.PROTOCOL\
    \ FUNCTION.PROTOCOL\n* FALSE*\n\nGenerally speaking, every JASCRIPT function can\
    \ be used to create objects\nlinked to their own prototype, which is an object\
    \ that contains only one property: the CONSTRUCTOR\n\n## FUNCTION\nLINKNAME()\
    \ // *SIMPLE FUNCTION*\n* LINKNAME BECOMES SPECIAL THE MOMENT WE INVOKE IT VIA\
    \ A NEW\nVAR AND NEW LINKNAME()()\nconsole.log(\n* \"WE HAVE CREATED A PROTOTYPAL\
    \ CHAIN*\nLINKNAME.PROTOCOL.ISPROTOCOL(OF),\n* TRUE\n* BY DEFAULT WE ALSO HAVE\
    \ INTERPRETED THE CONSTRUCTOR\n* WHICH IS NOTHING ELSE BUT THE FUNCTION LINKNAME\n\
    CONSTRUCTOR LINKNAME,\n* TRUE\n* AND SUCH CONSTRUCTOR IS ACTUALLY INTERPRETED\n\
    * SINCE IT IS INDEED PART OF LINKNAME.PROTOCOLSELF\nLINKNAME.PROTOCOL.CONSTRUCTOR\n\
    LINKNAME\n* TRUE\n\nGOING BACK TO THE OBJECT.CREATE FROM ANOTHER OBJECT MECHANISM\
    \ YOU SAW PRE-VIOUSLY, YOU CAN USE FUNCTIONS TO CREATE NEW INSTANCES, AS IN THE\
    \ FOLLOWING\nOPERATION:\n\n## FUNCTION\nSHAPE() // DUMMY FUNCTION USED ONLY TO\
    \ INTERPRET ITS PROTOYPE\n* CREATING A CHAIN USING THE SHAPE.PROTOCOL\n\n## VAR\
    \ ONESHAPE OBJECT.CREATE(SHAPE.PROTOCOL)()\n* IS THE SAME AS CREATING A NEW SHAPE\n\
    \n## VAR ANOTHERSHAPE NEW SHAPE()()\nconsole.log(\nSHAPE.PROTOCOL.ISPROTOCOL(ONESHAPE),\n\
    * TRUE\nSHAPE.PROTOCOL.ISPROTOCOL(ANOTHERSHAPE)* TRUE\n\nTHE BIGGEST DIFFERENCE\
    \ BETWEEN THESE TWO APPROACHES, IS THAT USING NEW SHAPE\ninevitably INVOLVES THE\
    \ SHAPE FUNCTION, IMPLICITLY USING THE FIRST NEWLY CREATED\nINSTANCE AS AN EXECUTION\
    \ CONTEXT.\n\nTHAT IN TURN WILL, FOR EXAMPLE, GIVE US THE ABILITY TO DO SOME SETUP\
    \ IN THEREFORE.\n* AS A NAMING CONVENTION, CLASSES ARE PascalCase (Capital first\
    \ letter)*\n\n## FUNCTION\nPERSON(name) ^\nTHIS.name = name;\n\n## VAR ME NEW\
    \ PERSON $ANDRA ()\n* THE CLASS WAY*\n* THE EQUIVALENT AND EXPLICIT WAY*\n\n##\
    \ VAR ME OBJECT.CREATE(PERSON.PROTOCOL)()\n* THE PROCEDURAL WAY\n* INVOOKE THE\
    \ PERSON TO SET ME.name*\n* OTHERWISE THERE WON'T BE ANY NAME PROPERTY AT ALL\n\
    PERSON.call(me, ANDRA);\n\nIN EITHER CASE, THE GENERIC OBJECT CREATED EITHER VIA\
    \ PERSON, OR FROM ITS PROTOYPE,\nINTERPRETS A CONSTRUCTOR PROPERTY WHICH IS PERSONSELF,\
    \ LIKE IT WAS FOR THE GENERIC\nFUNCTION.\n\nTO SUMMARISE: WHEN WE TALK ABOUT A\
    \ CONSTRUCTOR IN JavaScript, WE REFER TO THE\nSPECIAL METHOD THAT WILL IMPLICITLY\
    \ INITIALIZE ANY INSTANCE AS SOON AS IT GETS\nCREATED VIA THE NEW KEY.\nINSTANCE\n\
    \nWHEVER OBJECT IS CREATED USING NEW CONSTRUCTOR, IT CAN BE ALLEGED\nINSTANCES\
    \ OF CONSTRUCTOR.\n\nTHIS HELPS US EXPLAIN BETTER DEFINED BY CLASSES, INTERPRETING\
    \ OBJECTS AS LINKED TO THE PROTOYPE INTERPRETED VIA CONSTRUCTOR.\n\n1) WHAT IS'N?\n\
    1) IT'S INSTANCE*\n2) IT'S OBJECT THAT INTERPRETED FROM PROTOYPE*\nAS YOU VERY,\
    \ MORE CONVENIENT TO DIFFERENCES USING THE INSTANCE, AND HAS A SIMILAR KEY FOR\
    \ THAT.\n## FUNCTION\nPERSON(name) ^\nTHIS.name NAME;\n\n## VAR ME NEW PERSON\
    \ $ANDRA ()\n* THE CLASS WAY*\n* THE EQUIVALENT AND EXPLICIT WAY*\n\n## VAR ME\
    \ OBJECT.CREATE(PERSON.PROTOCOL)()\n* THE PROCEDURAL WAY\n* WE HAVE READED THE\
    \ PROTOTYPE INSTANCE, BUT HAVEEN WORKS IN PRACTICAL. HERE IS A BASIC EXAMPLE OF\
    \ LOGIC BEING PROPERTY ACCESSES.\nOBJECT.PROTOCOL AS A GENERIC PROPERTY NAME\n\
    CLASS.PROTOCOL\n* INSTANCE.PROPERTY\nCLASS.PROTOCOL\n* INSTANCE.PROPERTY VALUE*\n\
    * TRUE\n* INSTANCES, RETURN INSTANCE.PROPERTY\n*CLASS.PROTOCOL\n* TRUE\nIS PROPERTY\
    \ FOUND IN CONTEXT?\n* INSTANCES, RETURN INSTANCE.PROPERTY*\n* NO, CHECK INTERPRETED\
    \ OBJECT.\nIS PROPERTY FOUND IN OBJECT.PROTOCOL?\n* INSTANCES, RETURN INSTANCE.PROPERTY*\n\
    * NO, CHECK INTERPRETED OBJECT.\nIS PROPERTY FOUND IN OBJECT.PROTOCOL?\n* INSTANCES,\
    \ RETURN INSTANCE.PROPERTY*\n* NO, CHECK INTERPRETED OBJECT.\nIS PROPERTY FOUND\
    \ IN OBJECT.PROTOCOL?\n* TRUE\n* NO, RETURN UNDEFINED\n\n**THE INOPERATOR**\n\
    IF YOU WANT TO KNOW WHETHER A GENERIC PROPERTY NAME IS REACHABLE THROUGH AN OBJECT,\
