- md: "\n## SHARED DATA PROTOCOL\n\nSHARED DATA ^ *222 WILL BE INHERITED*\n\n**VAR**\
    \ ONE **NEW** SHARED DATA. *222 JUST TWO DIFFERENT INSTANCES*\n\n**VAR** TWO **NEW**\
    \ SHARED DATA. *222 THAT INHERITED FROM SHAREDDATA.PROTOCOL*\n\n*222 NOTE: PARTS\
    \ ARE OPTIONAL*\n\nONE.DATA.TEST ONE CHECK, ONE CHECK - console.log(\"222 DID\
    \ previous operation affected TWO.DATA\")\n\nTWO.DATA.TEST, *ONE CHECK IS BECAUSE\
    \ CONE AND TWO ARE SHARING THE SAME DATA\"*\n\nONE.DATA TWO.DATA *222 TRUE IT\
    \ IS EXACTLY THE SAME REFERENCE*\n\nThe above example is one of the reasons modern-DATASCRIPT\
