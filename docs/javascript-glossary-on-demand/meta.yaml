    know if such code succeeded or failed. This verification procedure is known as
    *debugging*, for the simple reason that it''s usually performed through a *debugger*,
    which is a developer''s helper tool that most modern modern browsers provide.


    - Try to *Right Click* on any webpage, and see if there is *Inspect Element* as
    the last option of the menu. This is how you can test all examples in this book:
    click *Inspect Element* and then the button or tab called *Console*, and start
    writing in pieces of code, also known as *snippets*, while we walk through the
    examples.


    As an alternative, you could also use the *Node.js command interface*, since most
    examples are environment agnostic, which means these will work in every browser
    as well as servers.


    Every code example contains some graded comments, I strongly suggest you read
    all of them at least once, and focus on the actual programming afterwards.


    ## Comments


    In programming, comments are meaningful descriptions of the code itself. They
    are ignored during code execution, and can be // single line, ending when a new
    line is encountered, or // multiple line //.


    ## Operators


    If you take a calculator, you can see numbers and arithmetic operations on it.
    In programming it''s basically the same, there are arithmetic, comparison, assignment,
    conditional and other operations. We can use them right away in any console.


    | Let''s do some math | |

    | :--- | :--- |

    | 2 + 2 | 4 |

    | 3 * 3 | 9 |

    | 2 * 15 | 30 |

    | 1 - 2 | -1 |

    | 2 / -1 | -2 |


    *While in a calculator the sign = means *show the result*, in JavaScript it means
    *assign the result*. You can use the = sign to hold some results to be reused
    later on.*


    **var result = 7;


    **result * 2 shows 14**


    If you want to compare two different values, you can use the triple equals operator
    ===


    - 2 === true // course, same number, it is identical to itself

    - 2 === false // well, 2 is different from 3 so it cannot be the same


    To verify that two values are different, you can use the *not* version.


    - 2 !== 2 // false

    - 2 !== 2 // so these cannot be different

    - 2 !== 3 // true // course 2 is different from 3. It''s true*


    The *not* operator can be used to negate some logical condition, by inverting
    its value. For instance, !true false and versa.


    If you want to state that different values are in fact the same, you can use logical
    operators.


    - (4 == 5) // false

    - (5 == 4) // false

    - (2 == 3) // false

    - (true || false) // true


    *There is an entire section about these operations further in the book so for
    now.*


    ## Parts


    It is possible to group different sequences of operations via parts. These become
    instantly more readable, making the development clearer. As an example, if one
    read operation as 2 * 3, one should think the result is 10, instead multiply the
    sum of 3 and 2 and make it clear to both you and JavaScript interpreter.


    Parts are also referred as parts for short, which is described later.


    In JavaScript there are curly {}, or square []. These can be used to create objects
    and, in square brackets, also their values.


    ## Variables


    A variable is a camel case used to reference a value. Starting always with the
    lower case and eventually putting multiple words through uppercase letters. If
    the composite variable name contains single characters or acronyms in it, it is
    okay to put multiple uppercase letters.


    ## References


    A reference is like a simple link that points to a specific value. Thinking of
    a object, the photo can be considered as a reference to a person; you don''t need
    to have this person present in the room to see what she looks like or what she
    is doing, the photo is enough.


    Variables


    A variable is usually a meaningful name used to reference a generic value. Back
    to the example of the object, varPhoto = new // creates a reference to object
    whose name is varPhoto. You can keep it for me, and as needed, receive other objects
    from other people and assign its value at any time.


    Create a variable that references my object


    - varPhoto = new //

    - // 5 years later //그런- save the old picture

    - by using a new variable name


    - oldPhoto = varPhoto

    - then shoot a new object

    - simply assigning it to the same variable


    - varPhoto = new //)


    A common JavaScript convention for variable names is camelCase anyValue; starting
    always with the lower case, and eventually putting multiple words through uppercase
    letters. If the composite variable name contains single characters or acronyms
    in it, it is okay to put multiple uppercase letters.


    ## Common naming conventions examples


    - var thisIs$goodNameFor$variable anyValue;

    - var result = load6(); // object.property genericValue;


    Constants


    A constant is like a variable but can only be created and assigned once. In modern
    JavaScript, it can be explicitly created using the key.


    *The value of constant is static value*


    - const result = load6(); // object.property genericValue;

    - const a // shows the letter a*


    *The value of constant is static*


    - // it does not change its value


    *const 5 shows 5 static value*


