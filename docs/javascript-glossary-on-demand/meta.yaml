    \n## 反模式 (ANTIPATTER)\n\n不一定与布尔逻辑有关，“反模式”一词指的是某些糟糕的实践，或者代码中具有已知且非预期效果的逻辑。例如，模拟三元运算符而不是使用它，就构成了一个反模式。\n\
    \n**TRUE** console.log(2) || console.log(false) ) ;\n\n* 2. 正确\n\n**TRUE** console.log(2)\
    \ || console.log(false) ) ; * 2. 然后为假/*\n\n这是因为 console.log 总是返回 undefined，而 undefined\
    \ 是*假值*。\n\n**DOM**\n\n文档对象模型指的是任何网页的*并行世界*。它是一个巨大的接口集合，描述了每个 HTML 元素、SVG 和 XML\
