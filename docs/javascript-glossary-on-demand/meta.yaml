    ## REFERENCE


    This term is related to a specific operation: executing any sort of function reference
    using parentheses:


    ### DECLARING A FUNCTION


    **FUNCTION** `something(something)`


    - **WHERE SOMETHING IS THE REFERENCE NAME**

    - OF THE FUNCTION we have just declared: `SOMETHING`

    - NOTHING happens (just shows the function itself)

    - TO EXECUTE this function

    - we need to invoke it using parentheses: `SOMETHING()`

    - logs something,


    If you look carefully, you can see that even the operation `console.log(something)`
    is invoking a function. However, in such a case the log function is invoked through
    a console object reference instead of directly, and it is accessed using a *dot
    notation*.


    Every time a function is invoked after a dot, that function can be considered
    a *method*.


    ## FUNCTION DECLARATION VS EXPRESSION


    There are a few ways to define a function and each might be more or less consistent.


    A function declaration, for example, creates a reference available anywhere within
    the *scope*. It has been declared, even if invoked before:


    `function SOMETHING()`


    - `SOMETHING` works even before declared.


    This can help you organize code into separate blocks. If there are many declarations
    in different parts, it is good practice to declare all needed functions together.


    ## VARIABLE-FUNCTION DECLARATION


    `VARIABLE NAME-FUNCTION` referenced via declaration: `const SOMETHING = function()`


    was born ready, even if invoked before: `SOMETHING = function()`


    Like every single variable, functions should also be assigned a value to reference
    it, although functions are not needed when comes to function declarations, as
    shown in the example. To simply define `VARIABLE-NAME-FUNCTION` referenced: `const
    SOMETHING() = function()`


    There is another step:


    - use the function name to assign values: `SOMETHING() = 10`


    - the count in this case starts at 10.


    ## SCOPE


    This term indicates the boundaries in which the code is executed. Think of it
    as the universe is every galaxy, the galaxy is systems scope, the planet is all
    continents'' scope, and for each continent we are going to have countries, regions,
    cities, and finally your own house, which is your own scope while you are inside,
    while the rest of the city will be your scope when you get out.


    In JavaScript, by default there is a local scope in which you can define functions
    and variables. However, back to the house metaphor, you don''t want each neighbor
    to know about every single thing you do in your place. Your home is your place,
    and functions, in JavaScript, are the way to define your very own place without
    interfering, or being disturbed, by everything that happens in the middle of the
    street, or anywhere else, including other houses.


    - global scope starts before code is executed (it''s already there)

    - function scope starts here:


    - **FUNCTION** `myScope(soc, ped, args)`

    - defining a variable inside myScope makes it available only here:


    - **VARIABLE** `myMess = my room`

    - function myScope() ends here:


    - **TYPE** `myScope` is the function


    - **SCOPE** `myScope` is private.


    Since it is possible to create functions inside other functions, it is also possible
    to have a private room within the house. To create private, we can use the function
    name: `SOMETHING = private`.


    - `function SOMETHING = private`

    - the count in this case is 10


    - `function SOMETHING = private`

    - `function SOMETHING = private` (declared)


    ## LOCAL CONTEXT


    If you open your browser console, or start nodes, you can inspect the local context
    writing `console.log(this)` or simply `this`.


    When you define a variable or declare a function globally, you are also able to
    reference these variables through the local context, since it is just like an
    object.


    - create a variable directly in the global scope:


    - **VARIABLE** definedVariable can everyone access "me"

    - it is accessible through the global object: `console.this.definedVariable`

    - the same when you create a function:


    - **FUNCTION** `globalFunction`

    - `console.this.globalFunction` (declared)


    It is important to remember that defined functions can access their other variables,
    but not necessarily all.


    Every time a function is invoked, however, there is also a way to automatically
    clean up or free memory once we have completed the task the function is supported
    to solve.


    ## CONTEXT


    Every time a function is invoked, it is possible to reference its current execution
    context through the automatically available `this`, which has one of the following
    values:


    - the global program context, called `window` in browsers and global server

    - the generic object that invoked the function through the notation: `obj.function()`

    - an arbitrary value, including undefined, when invoked via function methods like
    `.call` or `.apply`


    ## LOCAL CONTEXT


    If you open your browser console, or start nodes, you can inspect the local context
    writing `console.log(this)` or simply `this`.


    When you define a variable or declare a function globally, you are also able to
    reference these variables through the local context, since it is just like an
    object.


    - create a variable directly in the global scope:


    - **VARIABLE** definedVariable can everyone access "me"

    - it is accessible through the global object: `console.this.definedVariable`

    - the same when you create a function:


    - **FUNCTION** `globalFunction`

    - `console.this.globalFunction` (declared)


    It is important to remember that defined functions can access their other variables,
    but not necessarily all.


    Every time a function is invoked, however, there is also a way to automatically
    clean up or free memory once we have completed the task the function is supported
    to solve.


    ##Every time a function is invoked, it is possible to reference its current execution
    context through the automatically available `this`, which has one of the following
    values:


    - the global program context, called `window` in browsers and global server

    - the generic object that invoked the function through the notation: `obj.function()`

    - an arbitrary value, including undefined, when invoked via function methods like
    `.call` or `.apply`


    To prevent accidental global scope and context pollution, the 5th version of the
    JavaScript specification (the standard that defines JavaScript languages, syntax,
    and behavior) introduces a special use strict directive.


    This strange string, if placed at the beginning of a function, will guard the
    local context and switch into a more strict behavior. If you try the previous
    code again, you will see an error instead of the number 123.

    '
