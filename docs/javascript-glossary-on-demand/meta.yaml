    \n与 `__` 运算符相反，`__` 运算符只有在在前一个条件通过验证后才会继续检查条件。这可能是需要记住的最重要概念之一。\n\n例如，以下 ATM 操作将不会同时执行，而是一个接一个地执行。\n\
