- md: "\n## EVENT\n## EVENT\n## EVENT CUSTOM EVENT\n### STOP PROPAGATION ( )\n\n###\
    \ EVENT\n### EVENT CUSTOM EVENT\n**EVENT.PREVENTDEFAULT ( )**\n\nIf a node has\
    \ some special action associated with it, the PREVENTDEFAULT method prevents that\
    \ action from happening. Are you clicking on a link representing the default won't\
    \ the browser follow that link? Are you filling out some form representing the\
    \ default won't you change the text in the input or it won't you submit that form?\n\
    \n**FUNCTION** just preventDefault(event) { event.preventDefault(); }\n\n- IT\
    \ WON OPEN THE LINK\nadd.addEventListener('click', preventDefault);\n\n- IT WON\
    \ LET YOU WRITE IN INPUT\ninput.addEventListener('keydown', preventDefault);\n\
    \nWith the touch events, you can even prevent pages from scrolling.\n\n**CUSTOMEVENT**\n\
    \nWhenever we want to create our own synthetic events, the DOM provides its own\
    \ constructor which Web IDL describes as follows:\n\n- THE FOLLOWING MEANS A NEW\
    \ CUSTOM EVENT (type, detail: anyvalue*)\nConstructor(DOMEvent type, optional\
    \ customevent, initevent, initdict, exposed (Window, Worker))\n\n- AVAILABLE ON\
    \ PAGES AND WEB WORKERS\n\n**INFRASTRUCTURE** CUSTOM EVENT: EVENT ^\n\n- IMPLEMENTATIONS\
    \ EVENT INTERFACE\nReasonably attribute any detail.\n\n- THE MAIN DIFFERENCE WITH\
    \ EVENT\nE- It describes the CUSTOM EVENT OBJECT EXPECTED AS AN OPTION\nCustomEvent\
    \ UNIT: EVENT UNIT ^\nany detail NULL.\n\n- By default, detail property will be\
    \ null.\n\nWell, maybe the Web IDL format is a bit lengthy, but it surely provides\
    \ all necessary details.\n\n- T/'DS (TOO LONG, DID'T READ)\n**VAR** event **NEW**\
    \ CUSTOM EVENT my-type, detail: ^any: sort,\n**OF**: data,\nCOULD: **FUNCTION**\n\
    return possibly think about\n\n- so that if we have such listener in some node\
    \ document.addEventListener('my-type', function(event) { console.log(event.type,\
    \ event.preventDefault(), event.type, detail.detail });\n\n- we can dispatch the\
    \ event, invoking the associated listener document.dispatchEvent(Event(\"event\"\
    ));\n\nSince the custom event interface also implements the generic event, each\
    \ previously described method, such as event.preventDefault(), event.stopPropagation(),\
    \ and the currentTarget property will be available, making the event look *really*.\n\
    \n**EVENT EMITTER**\n\nWhen it comes to serving events, taking note.js as the\
    \ main example, the entire capturing and bubbling sort doesn't make sense anymore;\
    \ there is no tree to consider; there, just a possible amount of listeners ready\
    \ to react as asynchronously emitted events.\n\nThe type of received arguments\
    \ is also very different, and the most commonly used *signature* for listeners\
    \ is the function (possibleError, possibleReturn).\n\n**SIGNATURE**\n\nIn JS and\
    \ in programming in general, a function signature refers to the whole description\
    \ of the generic function: its name, the names of all expected parameters, the\
    \ scope in which the function always executes, and other possibly relevant info\
    \ about it.\n\n- THE function sum accepts two arguments, A NEW CUSTOM EVENT (type,\
    \ return) ^return.\n\n- THE function sum also accepts two arguments but does something\
    \ else CUSTOM EVENT (type, return) ^.\n\n**PARAMETERS**\n\nWhen we define the\
    \ name and amount of possible events that developer can pass when calling function,\
    \ we are actually defining the parameters. The reason why talk about events stated\
    \ is that this reference exists and events created every time.\n\n**EVENTS**\n\
    \nEvents are provided by objects that have mechanics to interact and eventually\
    \ create them.\n\n**EVENTS**\n\nEvents require events.\n\nA COMMON EXAMPLE\n\n\
    CUSTOM EVENT (event, return)\nconsole.log(\"CUSTOM EVENT\", return)\n\n- CONSTRUCTOR\n\
    \nCUSTOM EVENT (event, return)\nwhich is a CONSTRUCTOR\nconsole.log(\"CUSTOM EVENT\"\
    , return)\nreturn.\n\n- LET TRY success event.\n\nThe relationship between objects\
