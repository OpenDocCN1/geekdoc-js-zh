    \ 来找出答案\n\nrem.SOMEPROPERTYNAME() * 正好是 REM 本身*\n\n当通过对象调用函数时，它会隐式地使用该对象作为其当前的执行上下文。记住，任何函数都可以随时附加到任何对象上，即使它没有被直接定义为该对象的属性。\n\
    \n### 此处定义的通用函数在其他处\n\n**通用函数** SAYTHE NAME CONLOG.THIS.\n\n带有属性和值的通用对象。我们可以将其作为方法调用。SAYTHE\
    \ NAME 附加为该，尽管附加方法不是个好主意，但我们可以借用**任何类型**的函数并将其作为不同的对象使用，这一事实是令人惊讶的。我们为什么需要这些这不仅仅是一个小问题，答案是每个项目集合并不一定像数组那样拥有所有方法。新增：有更好、更整洁的方法通过提供上下文来调用函数。\n\
