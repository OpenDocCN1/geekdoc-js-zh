- md: "\n## EVENTS USING A FUNCTION\n\nThe reason this interface is considered the\
    \ most misunderstood is that almost\neveryone uses functions, instead of objects,\
    \ to register events.\n\n* *Why is that?* Back in 2000, when developers were trying\
    \ to make events work in both standard and non-standard browsers, there was no\
    \ easy way to replicate the object behavior via AJAX (ATTACH(EVENT) and DETACH(EVENT\
    \ non-standard alternatives).\n\nThe fallback to *functions* only supported some\
    \ compromised old books, articles, libraries, and frameworks, introducing problems\
    \ that were already solved with the standard interface.\n\n### The same logic\
    \ as seen before, using a function\n\n- DOCUMENT.ADDEVENT/LISTENER (CLICK, **FUNCTION**\
    \ EVENT)\n- WHERE was this listener registered?\n- **VAR** NOTE: EVENT.CURRENTTARGET;\n\
    - IS THIS LISTENER THE DOCUMENT INDEED? CONSOLE.LOG(NOTE DOCUMENT););\n- *TRUE*\
    \ CONSOLE.LOG(**THIS** DOCUMENT););\n- *TRUE AGAIN, REDUNDANT INFO*\n- IF WE DON'T\
    \ NAME OUR FUNCTION LISTENER\n- WE WON'T EVER BE ABLE TO REMOVE IT\n- BECAUSE\
    \ WE DON'T HAVE A REFERENCE, I.E..\n- NOTE.REMOVEEVENT/LISTENER(EVENT.TYPE, \"\
    function\"););\n- *What could we use here?*\n\nWhen we use a function as the event\
    \ listener, we automatically opt in for the following:\n\n- This execution context\
    \ always points to the EVENT.CURRENTTARGET-node.\n- We will eventually need a\
    \ companion object if we want to increment a counter or anything else that could\
    \ be related to a generic state of the node or of the component.\n- If we have\
    \ no reference, we won't ever be able to *unsubscribe* later.\n\nTo solve the\
    \ first two points of the above list of inefficiencies, the community came up\
    \ with an idea: the creation of functions on-demand whose context is statically\
    \ trapped.\n\n### Utility example\n\n| **FUNCTION** | BIND THECONTEXT(fn, context)\
    \ |\n| :--- | :--- |\n| RETURN a function that uses context variable | **RETURN\
    \ FUNCTION** |\n| AND explicitly force it to use context each time | **RETURN**\
    \ fn.apply(context, arguments); |\n\n| **FUNCTION** WHO'S? | **RETURN THIS**.\
    \ It |\n| IT JUST RETURNS THE CONTEXT | **VAR** ME | NAME: ANDREA |\n| **VAR**\
    \ ALWAYS ME | BIND THECONTEXT(WHO'S, ME);) | NOW TRAPPED FOR FOREVER | ALWAYSME(ME)\
    \ ME);) |\n| *TRUE IT'S ALWAYS ME* | ALWAYSME.CALL(^this) ME);) |\n| *TRUE IT'S\
    \ ALWAYS ME* | ALWAYSME.CALL(this) ME);) |\n| *TRUE IT'S ALWAYS ME* | ALWAYSME.CALL(DOCUMENT)\
    \ ME); |\n\n**FUNCTION BIND**\n\nAfter being widely adopted, the function executed\
    \ with a trapped context became standard and the function protocol also uses partial\
    \ arguments. **FUNCTION BIND** creates a new function* that every time it is invoked,\
    \ will use the execution context* and the number of arguments* as the first required\
    \ argument.\n\n| **FUNCTION** | **BIND** | **RETURN** |\n| :--- | :--- | :---\
    \ |\n| CREATES A FUNCTION* | | |\n| THAT EVERY TIME INVOKED | | |\n| WILL USE\
    \ AS EXECUTION CONTEXT | | |\n| AND THE NUMBER 5 AS FIRST REQUIRED | | |\n| ARGUMENT\
    \ 5 | | | || ARGUMENT 7 | | |\n| ARGUMENT 12 | | |\n| ARGUMENT 15 | | |\n| ARGUMENT\
    \ 6 | | |\n| ARGUMENT 5 | | | |\n| ARGUMENT 10 | | | |\n| ARGUMENT 15 | | |\n\
    | ARGUMENT 20 | | |\n\nThanks to this method, now we have the ability to produce\
    \ the listener class.\n\n### FUNCTION BIND\n\nThe listeners in these two methods\
    \ show that we can make their own methods, binding the events once. **BIND.BINDMENT**.\
    \ **BIND.STOPLIST** gives us the ability to later to remove the item at any time.\
    \ EVENT LISTENER(CLICK, **BIND.BINDMENT**); EVENT LISTENER(**BIND.DROPO**, **BIND.STOPLIST**).\n\
    \n- *Here is a new click listener instance that shows clicks on the body* **NEW**\
    \ LISTENER DOCUMENT.BODY\n\n Remember: to unsubscribe from an event, you must\
    \ pass the exact same reference.\n\n### EVENTS\n\nSince the beginning of its time,\
    \ JavaScript has demonstrated its strength and capabilities as an excellent event-driven\
    \ programming environment. You can register any sort of event type, and pass around\
    \ any sort of data, in both browser and server-side engines.\n\nHowever, the implementation\
    \ of nodes, an environment that lets you run JavaScript-based programs entirely\
    \ on the server-side, differs in many ways from the one in the browser.\n\n###\
    \ Browser Events\n\nAlready introduced in the previous pages, browser events can\
    \ be split into two major categories:\n\n1. **USER** or **SYSTEM** events\n2.\
    \ **CUSTOM** events, also known as *synthetic events*, which are generated via\
    \ code.\n\nWhen you surf the web and type on your keyboard, use the mouse to touch\
    \ the screen, you are creating and implicitly events that are specially treated\
    \ as user events. List of well-known events available in every browser by detail.\
    \ If you search for DOM events in type, there is quite clear that the DOM contains\
    \ trees. Binding to each tree is the possible to reach into each branch, also\
    \ described as **DOM** TREE. **BIND.DROPO**: CLICK-LISTENER, value: 0.\n\nSPECIFIC\
    \ method to increment event increment: **FUNCTION** EVENT. This one will be the\
    \ trapped event.CURRENTTARGET. **BIND.DROPO**.VALUE = 0, STOP/LISTING **FUNCTION**\
    \ EVENT | **VAR** HEV.CURRENTTARGET.VALUE = 0, STOP/LISTING **FUNCTION** EVENT\
    \ |\n\n*We can unsubscribe both methods, binding the events once. EVENT LISTENER(CLICK,\
    \ **BIND.BINDMENT**); EVENT LISTENER(**BIND.DROPO**, **BIND.STOPLIST**).\n\n*Here\
    \ is a new click listener instance that shows clicks on the body* **NEW** LISTENER\
    \ DOCUMENT.BODY\n\n### .ANY,ANY$$\n\nThe .ANY,ANY$$ contestant is actually requested\
    \ from the event constructor. This is one of the differences between the classes\
    \ in JavaScript and the classes in the DOM. The document.element is always available\
    \ HTML/ROOT. To better understand what we are doing, now it's probably a good\
    \ time to switch to an empty page. It is usually possible to do this by simply\
    \ typing about blank in the URL bar, which is the one where we usually write the\
    \ website address such as www*, the one we could use to do a search. If you open\
    \ the console and write the for each code in there, once you press enter and click\
    \ on any available white space on the page, you should see the following:\n\n\
    - DOCUMENT BY **TRUE**\n- it starts capturing from the document\n- HTML/ BY **TRUE**\n\
    - it travels the HTML node to reach the target* own- BY/ BY **FALSE**\n- it reaches\
    \ the target, nothing to capture any more\n- BY/ BY **FALSE**\n- it starts binding\
    \ up from the target\n- HTML/ BY **FALSE**\n- so it will trigger the parent HTML\
    \ node listener*\n- DOCUMENT. BY **FALSE**\n- until binding reaches the document\
    \ listener*\n\nAgain, here is what happens in the capturing phase: document.element.body\n\
    \nAnd here is what happens in the binding: document.element.body\n\n**EVENT.STOPPROPAGATION()**\n\
    \nCapturing can be extensive, especially when in nested trees. If a specific listener\
    \ has no meaning for other nodes, stop propagation can interrupt the event binding\
    \ or binding phase.\n\nTake the previous example with click listener. Simply adding\
    \ function.apply(context, arguments) to the beginning of the event handler will\
    \ force the event to stop.\n\n"
