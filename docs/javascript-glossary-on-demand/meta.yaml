- md: "\n... a textual attempt to describe what happens while we loop.\n\n**FUNCTION**\
    \ forever ( ^ J.NEXT ( A )\n\n**VAR** SENT #30\n\n**WHILE** TRUE ( ^ ...\n\n**VAR**\
    \ RECEIVED.\n\n**YIELD** SENT #66, VALUE: 0.\n\nJ.NEXT ( B )\n\nVALUE: 1.\n\n\
    J.NEXT ( C )\n\n**GENERATOR.THROW(ERROR)**\n\nIf something goes wrong during an\
    \ iteration, it is possible to exit from the generator either by returning, as\
    \ in a regular function, or by throwing an error.\n\nThe whole point of having\
    \ generators though is the ability to control them from the outside without direct\
    \ access to their scope or context, but with the equivalent of the remote control\
    \ *play/pause*.\n\nThe gen.throw(NEW ERROR) method gives us the ability to also\
    \ force the generator to stop its execution, even if nothing wrong happened in\
    \ its execution scope.\n\n**PROMISES**\n\nIf we need to chain a sequence of asynchronous\
    \ operations we have a few options:\n\n- Nest callbacks if scoped references are\
    \ relevant\n- Pass dozens of references to each function needed in the process\n\
    - Attach any sort of data at runtime and invoke methods all over\n\nHowever, if\
    \ we want to handle possible errors during this process we are basically doomed,\
    \ so this is the moment when a Promise could save the day.\n\n**A COMMON ASYNCHRONOUS\
    \ APPROACH**\n\n**A COMMON PROMISE-BASED APPROACH**\n\n| Async (input, function\
    \ (output)) | Promise (input).then(function (output)) |\n|---| Use output to do\
    \ something else | Use output to return some value |\n\nThere is a subtle but\
    \ very relevant difference between the classic and Promise-based approach which\
    \ is that a Promise instance can be passed around as it is, and we can then add\
    \ our logic at any time by simply invoking its .then() method.\n\n**VAR** WAIT\
    \ UNTIL THIS BOOK FINISHED **NEW** Promise.\n\n*A new Promise requires a function\
    \ which will be invoked later on*\n\n**FUNCTION**\n\n*Once this function is invoked,\
