    ## 继承 (EXTENDS)


    继承之旅始于讨论对象继承其他对象，结束于讨论类继承其他类。没有理由感到恐慌，这只是对以下问题的简短回答：


    ### 什么是正方形


    - 1) 一个继承原型的类

    - 2) 一个原型直接继承另一个原型的类


