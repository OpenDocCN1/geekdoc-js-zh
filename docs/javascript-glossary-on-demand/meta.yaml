    \n如果我们需要链式一系列异步操作，我们有几种选择：\n\n- 如果涉及作用域引用，则嵌套回调\n- 向处理过程中所需的每个函数传递几十个引用\n- 在运行时挂载任何类型的数据并在处调用方法\n\
    \n然而，如果我们想处理在此过程中可能出现的错误，我们基本上就没救了，所以这就是 Promise 可以救场的时刻。\n\n**一种常见的异步方法**\n\n\
