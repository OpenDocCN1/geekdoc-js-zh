    > OR OR MORE VARIABLE CALCULATIONS, SEPARATED


    ## FIRST SEMICOL


    1@ CONDITION TO SATISFY

    ## SECOND SEMICOL


    2@ CHANGES TO UPDATE THE CONDITION


    3@ Do something with the current value. Please note this is actually the third
    part of a for loop. The fourth one comes after this one.


    Taking into consideration the previous while loop as an example, you can do exactly
    the same process within the following for loop:


    | FOR VAR | INDEX SIZE, LENGTH; | INDEX | 0 <= 1 |

    | :--- | :--- | :--- | :--- | :--- |

    | console.log(list[index]); | | | | |

    | console.log(index); | | | |

    | console.log(); | | | | |


    It is very important to note that if the condition is not satisfied, neither the
    third nor the fourth part of the loop is executed.


    - EMPTY list, its length is 0

    - FOR VAR LIST > 0


    | FOR VAR | i = 0; i < collection.length; | i++ |

    | :--- | :--- | :--- |

    | i = 0; i < length; | | |

    | THE CONDITION IS NEVER SATISFIED | | |

    | i i = 1 | | |

    | IT WON NOT HAPPEN IF THE CONDITION EXITED THE LOOP | | |

    | console.log(i); | | |

    | console.log(i); | | |


    As soon as you put at least one item in the list, the condition is satisfied at
    least once, and you will see that the value of i after the loop is 1 instead of
    0.


    ## INCREMENTAL ++ OPERATOR


    It is very common to increment integers using a `++` sign instead of reassignment
    the variable itself adding 1. Accordingly, the following example is how a for
    loop usually looks like:


    | FOR VAR | i = 0; i < collection.length; | i++ |

    | :--- | :--- | :--- |

    | do something with collection[i]; | | |


    The `++` operator can be used both before or after a variable. In both cases the
    variable is incremented, but its immediately returned value is quite different.


    - USING `++` as suffix (a.k.a. post-increment)

    - VAR NUM 0

    - VAR NUM++PLUSNUM num++;


    | FOR VAR | NUM++PLUSNUM num++; |

    | :--- | :--- | :--- |

    | console.log(num++PLUSNUM); | 0, when assigned num was not incremented yet |

    | console.log(num); | 1 |

    | 1, because after num++ it got incremented | |


    - USING `++` as prefix (a.k.a. pre-increment)

    - VAR NUM 0

    - VAR PLUSNUMPLUSNUM num++;


    | FOR VAR | PLUSNUMPLUSNUM num++; |

    | :--- | :--- | :--- |

    | console.log(++NUMNUM); | 1, when assigned, num was already incremented |

    | console.log(num); | 1 |

    | 1, ++num incremented num and returned it as 1 | |


    There is no specific reason to prefer one way or the other, and while `num++`
    is usually preferred, `++num` could also be used as an example to loop over a
    collection with at least 2 items:


    - VAR i 10

    - WHILE ++i < list.length)


    - compare(list[i-1], list[i]);


    ## ARRAY METHODS


    In JavaScript, array comes with some special methods used to change, update or
    integrate items. Array methods look cleaner than loops but iterate over any collection,
    groups included.


    ### ARRAY.FOREACHALL()


    This is probably the closest possible to a loop array methods, and works like
    this:


    `array.forEach(value, index)`


    | FOR VAR | INDEX | VALUE |

    | :--- | :--- | :--- |

    | 0 | | |

    | 1 | | |

    | 2 | | |

    | 3 | | |

    | |


    ## ARRAY MAP


    NEW ARRAY


    If you want to create a new array based on some value found during the iteration,
    MAP is the right way to go. Its usage is basically the same as for the for each,
    but its invoked function should return some value for each iterated index.


    - VAR single > 1, 2, 3;

    - VAR doubled single.map(function(num, i, arr) {

    return num * 2;

    })


    - `console.log(single);`


    - > 1, 2, 3;

    - `console.log(doubled);`


    The main use case for MAP is to create a new list of items after some extracting,
    changing, or transforming the initial values of a collection.


    - VAR user name: Andrea, age: 37, name: Robert, age: 17


    - return person.filter(person.age >= 18)


    - return person.filter(person.age 18)


    - 18


    - false, Robert is too young


    ## ARRAY.INDEXOF(value, from) number


    As its name suggests, index finds the index, if any, that holds a specific value
    within an array.


    - VAR alphabet > a, b, c, d, e.e., z, y

    - VAR index alphabet.indexOf(c) = 2

    - 2

    - alphabet.indexOf(c) = c

    - if not found, returns -1

    - alphabet.indexOf(123) = -1

    - -1


    In the latest specifications, array.includes(value, from) returns a boolean indicating
    the value is present or not.


    There are actually dozens of array methods. All of them are described with many
    examples and uses in the MD Mozilla Developer Network, under the section


    ### ARRAY.METHODS


    Array, which is the object containing all methods and behaviors integrated by
    every array.


    - [Methods](https://developer.mozilla.org) (not false)

