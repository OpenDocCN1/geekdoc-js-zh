    \n如果你熟悉页面，你可能知道像 textContent 或 innerHTML 这样的属性，一旦定义就会影响整个内容。\n\n所有这些神奇属性都归功于访问器和赋值器。它们与普通方法不同，但你不需要显式调用它们。\n\
    \n这是一个方法的示例：object.property: var size: 8 (configurable: true, *你可以以后删除它*, getter:\
    \ function() ^ 返回 this.size *每次都计算一次*), set: function() ^ *将不允许* *新的* 错误。并不是简单地改变区域。\n\
    \n读取区域，它调用构造函数 cgetc as method console.log(\"222 DID previous operation affected\
    \ TWO.\")\n\n## UNDEFINED PROPERTY\n\nUNDEFINED\n\n属性是因为 ONE 和 TWO 正在共享相同的数据\"\
    每个实例有不同的数据。\n\n"
