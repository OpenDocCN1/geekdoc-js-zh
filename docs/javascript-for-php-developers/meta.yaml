- img_proc: true
  md: "Here you see a call to a one-off function that runs and returns a value, which\
    \ you then assign to the variable immediate_one.\n\nIf the example were:\n\n```\n\
    var immediate_one = function () {\n  return 1;\n};\n```\n\nthen immediate_one\
    \ would be a function, not the return value of a function invocation, and it wouldn't\
    \ run, but simply defined.\n\nAnd how about this syntax?\n\n```\n// Syntax error\n\
    function myfunc() {\n  return 1;\n};\n```\n\nThis is not valid syntax because\
    \ myfunc() was defined using the function declaration syntax, not the function\
    \ expression syntax. The difference sometimes may be noticeable unless you take\
    \ into account where the code is in the program.\n\nYou can fix this syntax error\
    \ by passing the function as an operand to the grouping operator:\n\n```\n// Valid\
    \ syntax\n(function myfunc() {\n  return 1;\n})()\n```\n\nAll you need to do is\
    \ wrap the function in parentheses. How is that different? Well, in this case,\
    \ the function is no longer in the program code, but is passed as an operand to\
    \ an operator—the grouping operator ()—which simply returns the function. It turns\
    \ the function declaration into a function expression, and the () that follows\
    \ executes the function. Function declarations cannot be operands; therefore,\
    \ the interpreter can disambiguate the syntax and treat this function as a function\
    \ expression.\n\nThis is also a valid placement of the grouping operator’s parentheses:\n\
    \n```\n// Still valid syntax\n(function myfunc() {\n  return 1;\n})()\n```\n\n\
    Immediate functions are a useful common construct to deal with the way variable\
    \ scope works in JavaScript. Immediate functions are also sometimes called self-executing\
    \ or self-invoking functions, although this is confusing, as it may mean a recursive\
    \ function. They are also called IIFE (immediately-invoked function expressions),\
    \ but that’s a bit of a mouthful."
