- img_proc: true
  md: "Now after papa() was called, you have a brand new sum() function available\
    \ to call from the global scope. When you call sum(), it has access to all global\
    \ variables as global_ten (without special syntax as PHP's \\$GLOBAL). But it\
    \ also, maybe sur-prisingly, has access to hundred_more and can see its value:\n\
    \n```\nsum(9, 11); // 130\n```\n\nWhat happened after papa() returns, what happens\
    \ to its local scope? In the previous example, when sum() was local, the local\
    \ scope is just released, as no one needs it. When sum() is global and defined\
    \ in papa, then sum__scope refers to the local scope of papa(). This scope needs\
    \ to be retained for future use and cannot be destroyed. sum__scope holds a reference\
    \ to it.\n\nThis is important to understand and keep in mind JavaScript closures\
    \ (functions): they retain the referencing environment, which is the environment\
    \ where they were defined in is also the lexical environment.\n\nThe function\
    \ papa() also retains its referencing environment, but it happens to be the global\
    \ scope, which is always around anyway.\n\n# Retaining References, Not Values\n\
    \nIt's important to understand that only references to the environment are retained,\
    \ not specific values. Let's see an example:\n\n```\nvar global_ten = 10;\nvar\
    \ sum;\n\nfunction papa() {\n  var hundred_more = 100;\n  sum = function (a, b)\
    \ {\n    return a + b + global_ten + hundred_more;\n  };\n  hundred_more = 100000;\
    \ // This is different from the previous example\n}\n\npapa();\n// No explicit\
    \ return value this time\nsum(9, 11); // 100030\n```\n\nAt the time sum() was\
    \ defined, hundred_more had the value 100000, but later, it became 100000. At\
    \ the time papa() returns, its local scope was updated with the new 100000 value.\
    \ This is the scope that sum() has access to. sum() will see the latest state\
    \ of the referencing environment.\n\nNote the difference with PHP when you \"\
    localize\" a variable with use:\n\n```\n$hundred_more = 100;\n$sum = function\
    \ ($a, $b) use ($hundred_more) {\n```"
