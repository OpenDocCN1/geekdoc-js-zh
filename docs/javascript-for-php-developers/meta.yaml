- img_proc: true
  md: 'While PHP has several alternative syntax options for if-then-else control structures,
    in JavaScript, there''s only one (not counting the ternary operator). Thus, you
    can''t, for example, use elseif instead of else if.


    # Ternary Operator


    The short conditional syntax looks as a ternary operator (because it''s an operator
    that takes three operands), too:


    ```

    var num = 11;

    var whaisit = (num % 2) ? "odd" : "even";

    num + " is " + whaisit; // 11 is odd

    ```


    You''ve probably learned to avoid stacking more than one ternary without parentheses,
    as it''s tricky to read. Another reason is that it works differently in JavaScript.
    For example:


    ```

    // PHP

    echo true ? "a" : true ? "b" : "c"; // "b"


    // Same as

    echo (true ? "a" : true ? "b" : "c"); // "b"

    ) ? "a" : "c"; // "b"

    ```


    It''s the same syntax in JavaScript, but with a different result, because of the
    different order of evaluation:


    ```

    // JavaScript

    true ? "a" : true ? "b" : "c"; // "a"


    // Same as

    true ? "a" : "I''m ignored"; // "a"

    ```


    # Strict Comparison


    Have you noticed the triple equals sign === that all code examples used so far?
    Comparison works similar to PHP:


    +   - Three equals mean strict comparison (the expressions are compared by both
    value and type).

    n- Two equals signs mean loose comparison (only values are compared and, if needed,
    one expression is cast to the type of the other to perform type comparison).


    In order to make debugging easier, it''s always preferable to know what you''re
    comparing, by using === is good practice. It''s easier because you can catch errors
    while developing and before the program runs "in the wild" where values can be
    unpredictable. You also don''t need to remember the casting rules and oddities,
    which are not exactly like in PHP.'
