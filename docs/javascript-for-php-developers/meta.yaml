    # PHP 开发者的 JavaScript


    ![](img/7167a987f8e0f5a6179bb61bf22fe204_0_0.png)


    JavaScript/Web 开发


    # PHP 开发者的 JavaScript


    如果你想在 PHP 之外显著扩展你的 Web 开发技能，这本实用的实操书籍将从零开始教你 ECMAScript——JavaScript 的核心语言。你将发现
    JavaScript 和 PHP 之间存在一些相似之处，例如条件和循环，但重点在于 JavaScript 独特的对象创建、类（或其缺失）、原型和继承。


    对于当今的 Web 开发而言，JavaScript 知识至关重要，无论你是在为客户端、服务端还是移动端构建应用程序——而且你的 PHP 经验将带给你领先的优势。这本书将帮助你快速练掌握
    JavaScript，并在你开始编码后作为参考书。


    > 读这本书就像是在向未来的自己学习 JavaScript——那个已经成为 JavaScript 专家并发现了时空旅行秘密的你。如果你是一个想要学习 JavaScript
    的开发者，可以停止寻找那本完美的书了。就是它了。


    - 探索 JavaScript 语法，包括变量、数组、循环和条件

    - 学习函数在 JavaScript 中为什么重要——以及它们实际上是对象

    - 深入研究 JavaScript 的面向对象特性，包括原型、代码复用和继承

    - 检查内置 API 并探索其全局函数、属性和对象

    - 学习 ECMAScript 5（该标准的最新版本）中的更新

    - 使用常用的设计模式来组织应用程序中的代码


    Chris Shiflett，Brooklyn Beta 共同者，Fictive Kin 伙伴


    Stoyan Stefanov，Facebook 工程师，YSlow 2.0 性能工具的架构师以及 smash.it 图像优化工具的创建者。他是《JavaScript
    Patterns》(O''Reilly)、《Object-Oriented JavaScript》(Packt Publishing)、《The Book
    of Speed》(在线)以及《High Performance JavaScript》(O''Reilly) 的作者。作为 Zend 认证工程师，Stoyan
    在 phpied.com 和 jspatterns.com 编写博客。


