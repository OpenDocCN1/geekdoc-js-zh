  mdcn: "\n# # 限制对象的变变\n\n在 ES3 中，所有对象都是可变的，只有内置对象中存在少数例外。有时这不是一个好主意，因为你对象的用户可能会对其进行无法修复的更改。在\
    \ ES5 中，你可以限制对对象的访问。例如，你可以通过将它们的 `writable` 属性设置为 `false` 来让某些属性变为只读。\n\n但你仍然对整个对象进行操作：\n\
    \n- 防止扩展（即：不允许添加新属性）\n- “密封”（Sealing）一个对象，这意味着在使对象不可扩展的基础上，将所有属性变为不可配置（无法删除它们）\n\
    - “冻结”（Freezing）一个对象，这类似于密封，但多了一步步骤：将所有属性设置为不可写（nonwritable）\n\n考虑这个普通对象：\n\n\
    ```javascriptvar pizza = {\n  tomatoes: true,\n  cheese: true\n}\n```\n\n你始终可以添加更多属性：\n\
    \n```javascript\npizza.pepperoni = 'lots';\n```\n\n你可以更改和删除属性，因为它们都是可配置且可写的：\n\
    \n```javascript\npizza.cheese = 'mozzarella'\ndelete pizza.pepperoni; // true\n\
    ```\n\n然而，如果你防止了扩展，你将无法再次添加属性。你可以使用 `Object.isExtensible()` 检查扩展性，并使用 `Object.preventExtensions()`（不可逆地）禁用扩展：\n\
    \n```javascript\nObject.isExtensible(pizza); // true\nObject.preventExtensions(pizza);\
    \ // 返回 `pizza` 对象\nObject.isExtensible(pizza); // false\n```\n\n```javascript\n\
    pizza.broccoli = 'ew'; // 错误，不能再添加属性\ntypeof pizza.broccoli; // \"undefined\"\n\
    ```\n\n此外，当使用 `seal()` 时可以防止删除：\n\n```javascript\nObject.isFrozen(pizza); // false\n\
    Object.seal(pizza); // 返回 `pizza` 对象\nObject.isFrozen(pizza); // true\n```\n\n\
    ```javascript\ndelete pizza.cheese; // 错误，无法删除\npizza.cheese; // \"mozzarella\"\
    \n```\n\n不过，你仍然可以更改属性值：\n\n```javascript\npizza.cheese = 'ricotta';\n```\n\n但一旦冻结（`freeze()`）对象，一切结束了，所有属性都变为不可写：\n\
    \n```javascript\nObject.isFrozen(pizza); // false\nObject.freeze(pizza); // 返回\
    \ `pizza` 对象\nObject.isFrozen(pizza); // true\n```\n\n```javascript\npizza.cheese\
    \ = 'gorgonzola'; // 错误，'cheese' 是只读的\npizza.cheese; // 'ricotta'\n```\n\n总结一下：\n\
    \n- `freeze()` 执行了 `seal()` 的工作，并将所有属性的 `writable` 属性设置为 `false`。\n- `seal()`\
    \ 执行了 `preventExtensions()` 的工作，并将所有属性的 `configurable` 属性设置为 `false`。\n- `preventExtensions()`\
    \ 没有设置任何属性，但它不允许你之后再添加更多属性。\n- 这些操作都无法恢复（即：没有 `unfreeze()`、`defrost()`、`allowExtensions()`\
    \ 等）。\n\n# # 循环的替代方案\n\n在 ES3 中，如果你想获取所有属性列表（类似于 PHP 中的 `array_keys()`），你必须使用\
    \ `for` 循环。在 ES5 中，你可以使用 `Object.keys()` 或 `Object.getPropertyNames()`。`keys()`\
    \ 方法提供可枚举属性（那些会在 `for` 循环中的属性），而 `getOwnPropertyNames()` 返回所有属性，无论是否可枚举。\n\n这两种方法只作用于自有属性，除非你没有使用描述符来设置\
    \ `enumerable` 属性：\n\n```javascript\nvar pizza = {tomatoes: true, cheese: true};\n\
    Object.keys(pizza); // [\"tomatoes\", \"cheese\"]\nObject.getOwnPropertyNames(pizza);\
    \ // [\"tomatoes\", \"cheese\"]\n```\n\n它们都只处理自有属性，不会返回任何继承自原型的属性。让我们创建一个对象 `pizza_v20`，它继承自\
    \ `pizza` 并添加了一些新属性：\n\n```javascript\nvar pizza_v20 = Object.create(pizza, {\n\
    \  salami: {value: \"lots\", enumerable: true},\n  sauce: {value: \"secret\"}\n\
    });\n```\n\n`keys()` 不返回 `sauce`，因为它不可枚举的，但 `getOwnPropertyNames` 会返回所有属性：\n\n\
    ```javascript\nObject.keys(pizza_v20); // [\"salami\"]\nObject.getOwnPropertyNames(pizza_v20);\
    \ // [\"sauce\", \"salami\"]\n```\n\n它们都没有返回任何 `pizza` 的属性，因为这些属性是继承的：\npizza_v20.cheese;\
    \ // true\npizza_v20.__proto__ === pizza; // true\n\n# # Object.getPrototypeOf()\n\
    \n总结 ES5 中 `Object()` 的新特性后，让我们来看看 `getPrototype()` 方法。\n\n# # 测试数组内容\n\n两个新方法\
    \ `every()` 和 `some()` 让你遍历所有数组元素并返回一个布尔值，取决于数组是否满足你在回调函数中提供的检查条件。\n\n假设你想检查数组是否包含数字。检查逻辑如下：\n\
    \n```javascript\nfunction isEven(num) {\n  return num % 2 === 0;\n}\n```\n\n测试如下：\n\
    \n```javascript\n// *所有*数字都是偶数吗？\n[1, 2, 4].every(isEven); // false\n```\n\n```javascript\n\
    // 数组中*某些*（或至少一个）数字是偶数吗？\n[1, 2, 4].some(isEven); // true\n```\n"
