    \ // false\nconstant.define('hi', 'ho'); // true\n// //尝试重新定义常量应该失败\nconstant.define('hi',\
    \ 'hoho'); // false\nconstant.constant('hi'); // \"ho\"\n```\n\n## 命名空间\n\nJavaScript\
    \ 中没有命名空间，但你完全可以使用对象的属性来实现这一目的。\n\n常见方法是在你的应用程序或库中定义一个全局变量。这样，你所做的一切都将成为该对象的属性。\n"
