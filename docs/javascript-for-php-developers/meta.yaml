    # CHAPTER JavaScript Syntax


    Just like PHP, JavaScript has a C-like syntax, you''ll find it immediately familiar.
    This chapter goes over the basics, highlighting what''s similar and what''s different
    about variables, arrays, loops, conditions, and some miscellaneous (and slightly
    strange) operators.


    # Variables


    To define a variable in PHP, you''d write:


    ```

    // PHP

    $n = 1;

    ```


    The equivalent in JavaScript is:


    ```

    // JavaScript

    var n = 1;

    ```


    There''s no dollar sign, just the name of the variable. Like in PHP, you don''t
    define variable types because the type is derived from the value. You use var
    for all types.


    If you need a numeric type, you give your variable a numeric value. The same applies
    to booleans and strings


    ```

    var n = 1;      // number

    var b = true;   // boolean

    var s = "hello"; // string

    ```


    You have the option of declaring a variable without initializing it with a value.
    In such cases, the variable is assigned the special value undefined:


    ```

    var a;

    a; // `a` has the special value `undefined`

    ```'
  - '[PAGE 25]


    Redearing an existing variable doesn''t set the variable value back to undefined:


    ```

    var a = 1;

    var a;

    // "a" is still 1

    ```


    You can declare (and optionally initialize with value) several variables with
    one statement as long as you separate them with comma and end with a semicolon:


    ```

    var pi = 3.14,

    yeps = true,

    nopes,

    hi = "hello",

    wrrld = "world",

    ```


    Technically, var is optional. Unless the variable was defined higher up in the
    scope chain (discussed in more detail in Chapter 3), if you skip var you end up
    with a global variable. And you''ve learned, probably the hard way, global namespace
    pollution is a sin. Additionally, there are some subtle differences if you declare
    a global variable with without var. To cut a long short, resist this temptation
    and always use var to declare your variables.


    Variables can be named using letters, numbers, underscore, and the dollar sign.
    You cannot start with a number, though:


    ```

    var _v1; // Valid

    var v1; // Valid

    var v_1; // Valid

    var 1v; // Invalid

    ```


    # What Does $ Do in JavaScript?


    This is sort of a trick question sometimes asked at interviews. The short answer
    is: nothing.


    You can name variables using $ anywhere in the name. Earlier ECMAScript standard
    editions recommended that $ should only be used in auto-generated code, a suggestion
