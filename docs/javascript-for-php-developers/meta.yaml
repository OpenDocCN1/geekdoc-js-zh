    \ expects, and these are happily ignored without any errors:\n\n```\nsum(); //\
    \ NaN (not a number)\nsum(1, 2); // 3\nsum(1, 2, 100, 999); // 3\n```\n\nYou can\
    \ prepare for receiving any number of arguments and handle this case gracefully.\
    \ In PHP, you can use func_get_args(), which returns an array of arguments passed\
    \ to your function. In JavaScript, you use the arguments array-like object. It's\
    \ an object available to your function body. It's dubbed \"array-like\" because\
    \ its properties are enumerated from index 0, and it also has a length property,\
    \ just like an array:\n\n```\nfunction sum(/* nothing here */) {\n  for (var i\
    \ = 0, result = 0; i < arguments.length; i++) {\n    result += arguments[i];\n\
    \  }\n  return result;\n}\n```\n\n```\nsum(); // 0\nsum(111); // 111\nsum(1, 2);\
    \ // 3\nsum(1, 2, 3); // 6\nsum(1, 10, 2, 9, 38); // 33\n```\n\nRemember that\
