- img_proc: true
  md: "This syntax is called a named function expression because you assign a name\
    \ to the function. If you don't, which is much more common, you end up with an\
    \ unnamed function expression, or simply called a function expression or an anonymous\
    \ function.\n\nSetting the name (identifier) of the expression to something other\
    \ than the variable you assign it to (as with plum in the preceding example) is\
    \ not recommended. It is confusing to read, and in many IE versions, it mistakenly\
    \ creates two symbols (variables) in the enclosing scope. In other words, typeof\
    \ plum will be \"undefined\" in modern browsers and So it's best to set the name\
    \ matching to the variable you assign it to, like:\n\n```\nvar sum = function\
    \ sum(a, b) {\n  return a + b;\n}\n```\n\nThis is useful for debugging and a good\
    \ minifier strip the name if it detects's not used in the body of the function.\n\
    \n# Scope\n\nThere's no block scope in JavaScript, only function scope.\n\nAny\
    \ variables you define inside of a function are local to the function and not\
    \ visible outside it. Global variables are defined outside of any function:\n\n\
    ```\nif (true) {\n  // Global even if in a curly braces block\n  var true_global\
    \ = 1;\n}\n```\n\n```\nif (false) {\n  var false_global = 1;\n}\n```\n\n```\n\
    var sum = function () {\n  var local = 1;\n  is_it_local = 1;\n  return true_global\
    \ + local + is_it_local;\n}\n```\n\n```\ntrue_global; // 1\nfalse_global; // undefined\n\
    local; // ReferenceError: local is not defined\nis_it_local; // ReferenceError:\
    \ is_it_local is not defined\n```\n\n```\nsum(); // 3\n```\n\n```\ntrue_global;\
    \ // 1\nfalse_global; // undefined\n```"
