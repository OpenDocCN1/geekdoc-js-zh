    In JavaScript, you use the for-in loop:


    ```

    // JavaScript

    var out = '''';

    for (var key in clothes) {

    out += key + '': '' + clothes[key] + ''\n'';

    }",

    ```


    You don''t have direct access to the next property''s value inside the loop, so
    you get the value by using the square bracket notation clothes[key].


    Also note that the order in which properties are enumerated is not guaranteed
    and depends on implementations. In other words, shoes may appear before shirt,
    although in the definition''s later. If you want to maintain the order, you need
    to use a regular array to store the data.


    And just for illustration purposes, if you forget for a moment in PHP you have
    access to => (foreach) you can do the following JavaScript for -in:


    ```

    $out = '''';

    foreach (array_keys($clothes) as $key) {

    $out = $key . '': '' . $clothes[$key] . ''\n'';

    }

    ```


