    # void


    Another operator you may come across void. It takes any expression as an operand
    and returns undefined:


    ```

    var a = void 1;

    typeof a === "undefined"; // true

    ```


    The void operator is rarely useful, but sometimes used as an href in links. With
    the typeof operator, people often mistake it together with the grouping operator
    () so it looks like a function call:


    > <-- not a good practice --

    <a href="javascript:void(0)">click and nothing happens/</a>


    This practice looks innocent enough, but when you think about it, it''s as silly
    as it is common. Here''s what happens:


    +   1. The user clicks, and a JavaScript expression is evaluated.

    2. The literal value 0 is sent as an operand to the grouping operator ().n3. The
    grouping operator returns the last value in the group, 0.

    4. 0 is sent to the void operator.

    5. void, being the black hole that it is, takes the operand and returns undefined.


    Ignoring for the broken semantics of having links that do nothing, people might
    just as well as make the href be javascript:undefined.


    # Comma Operator


    The comma operator is another slightly odd one. It''s the lowest precedence operator
    in JavaScript. It returns the value of the operand passed to it:


    ```

    var a = ("hello", "there");

    a; // "there"

    var a = ("hello", "there", "young", "one");

    a; // "one"

    ```


    It''s similar to && || ||, but these stop evaluating the expression when the outcome
    is clear, the comma operator keeps going:'
