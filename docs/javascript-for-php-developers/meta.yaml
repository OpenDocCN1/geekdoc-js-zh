- md: "# # Restricting Object Mutations\n\nIn ES3, all objects are mutable, with a\
    \ few exceptions found in the built-in objects. Sometimes this is not a good idea\
    \ because users of your objects can change them beyond repair. In ES5, you can\
    \ restrict access to your objects. For example, you can make selected properties\
    \ read-only by setting their writable attribute to false.\n\nBut you can access\
    \ to the whole object:\n\n- Preventing extensions (i.e., don't allow new properties)\n\
    - \"Sealing\" an object, which means making all properties nonconfigurable (cannot\
    \ delete them) on top of making the object nonextensible\n- \"Freezing\" an object,\
    \ which is like sealing but with the additional step of setting all properties\
    \ to nonwritable\n\nConsider this regular object:\n\n```javascriptvar pizza =\
    \ {\n  tomatoes: true,\n  cheese: true\n}\n```\n\nYou can always add more properties:\n\
    \n```javascript\npizza.pepperoni = 'lots';\n```\n\nYou can change and delete properties,\
    \ because they are all configurable and writable:\n\n```javascript\npizza.cheese\
    \ = 'mozzarella'\ndelete pizza.pepperoni; // true\n```\n\nHowever, if you prevent\
    \ extensions, you'll no longer be able to add properties. You can check for extensibility\
    \ with Object.isExtensible() and disable extensions (irreversibly) with Object.preventExtensions():\n\
    \n```javascript\nObject.isExtensible(pizza); // true\nObject.preventExtensions(pizza);\
    \ // Returns the `pizza` object\nObject.isExtensible(pizza); // false\n```\n\n\
    ```javascript\npizza.broccoli = 'ew'; // Error, cannot add properties anymore\n\
    typeof pizza.broccoli; // \"undefined\"\n```\n\nAdditionally, you can prevent\
    \ deletions when seal():\n\n```javascript\nObject.isFrozen(pizza); // false\n\
    Object.seal(pizza); // Returns the `pizza` object\nObject.isFrozen(pizza); //\
    \ true\n```\n\n```javascript\ndelete pizza.cheese; // Error, can't delete\npizza.cheese;\
    \ // \"mozzarella\"\n```\n\nYou can still change a property value though:\n\n\
    ```javascript\npizza.cheese = 'ricotta';\n```\n\nBut once you freeze() an object,\
    \ that's it, all properties become nonwritable:\n\n```javascript\nObject.isFrozen(pizza);\
    \ // false\nObject.freeze(pizza); // Returns the `pizza` object\nObject.isFrozen(pizza);\
    \ // true\n```\n\n```javascript\npizza.cheese = 'gorgonzola'; // Error, 'cheese'\
    \ is read-only\npizza.cheese; // 'ricotta'\n```\n\nSo, in review:\n\n- freeze()\
    \ does what seal() plus sets the writable attribute to false for all properties.\n\
    - seal() does what preventExtensions() does plus sets the configurable attribute\
    \ to false for all properties.\n- preventExtensions() doesn't set any attributes,\
    \ but it doesn't let you add more afterward.\n- None of these actions can be turned\
    \ back on (i.e., there's no unfreeze(), defrost(), allowExtensions(), etc.).\n\
    \n# # Looping Alternatives\n\nIn ES3, if you want to get a list of all properties\
    \ (like array_keys() in PHP), then you have to do a for-loop. In ES5, you can\
    \ use Object.keys() or Object.getPropertyNames(). The keys() method gives you\
    \ enumerable properties (those that will show up in a for-loop), while getOwnPropertyNames()\
    \ returns all properties, enumerable or not.\n\nBoth methods work on own properties\
    \ only, unless you don't use descriptors to set the enumerable attributes:\n\n\
    ```javascript\nvar pizza = {tomatoes: true, cheese: true};\nObject.keys(pizza);\
    \ // [\"tomatoes\", \"cheese\"]\nObject.getOwnPropertyNames(pizza); // [\"tomatoes\"\
    , \"cheese\"]\n```\n\nBoth work with own properties only, they will not return\
    \ anything inherited from the prototype. Let's create an object pizza_v20 that\
    \ inherits pizza and adds some new properties:\n\n```javascript\nvar pizza_v20\
    \ = Object.create(pizza, {\n  salami: {value: \"lots\", enumerable: true},\n \
    \ sauce: {value: \"secret\"}\n});\n```\n\nkeys() will not return sauce because\
    \ it's not enumerable, but getOwnPropertyNames will return all properties:\n\n\
    ```javascript\nObject.keys(pizza_v20); // [\"salami\"]\nObject.getOwnPropertyNames(pizza_v20);\
    \ // [\"sauce\", \"salami\"]\n```\n\nBoth do not return any of the pizza properties,\
    \ because those properties are inherited:\npizza_v20.cheese; // true\npizza_v20.__proto__\
    \ === pizza; // true\n\n# # Object.getPrototypeOf()\n\nWrapping up the novelties\
    \ in Object() in ES5, let's take a look at the getPrototype() method.\n\nWrapping\
    \ up the novelties in Object() in ES5, let's take a look at the getPrototype()\
    \ method.\n\nWrapping up the novelties in Object() in ES5, let's take a look at\
    \ the getPrototype() method.\n\nWrapping up the novelties in Object() in ES5,\
    \ let's take a look at the getPrototype() method.\n\nWrapping up the novelties\
    \ in Object() in ES5, let's take a look at the getPrototype() method.\n\nWrapping\
    \ up the novelties in Object() in ES5, let's take a look at the getPrototype()\
    \ method.\n\nWrapping up the novelties in Object() in ES5, let's take a look at\
    \ the getPrototype() method. (Wait, let me re-process the text properly based\
    \ on flow).\n\n# # Testing the Array Content\n\nTwo new methods, every() and some(),let\
    \ you iterate over all array elements and return a boolean, whether or not the\
    \ array satisfy a check you provide in a callback.\n\nSay you want to check if\
    \ an array contains numbers. The check will be:\n\n```javascript\nfunction isEven(num)\
