    \ common pattern of dealing with defaults in JavaScript:\n\n```javascript\n//\
    \ JavaScript\nvar a = 100;\nvar b = a || 200;\nb; // 100\n\n// PHP\n$a = 100;\n\
    $b = $a || 200;\nvar_dump($b); // bool(true)\n```\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_40_0.png)\n\
    \n# CHAPTER 3\nFunctions\n\nFunctions are an important topic in JavaScript because\
    \ the language has many uses for them. In their most basic form, they look like\
    \ a PHP function:\n\n```javascript\n// Works in both basic form\nfunction sum($a,\
    \ $b) {\n    return $a + $b;\n}\n\nsum(3, 5); // 8\n```\n\n# Default Parameters\n\
    \nThere's no syntax that allows you to have a default value of a function parameter,\
    \ as is often done in PHP. This is scheduled for a future version of ECMAScript,\
    \ but for now you have to take care of yourself inside the body of your function.\
    \ Let's say you want the second parameter to default to 2:\n\n```javascript\n\
    // PHP\nfunction sum($a, $b = 2) {\n    return $a + $b;\n}\n\n// JavaScript\n\
    function sum(a, b) {\n    b = b || 2;\n    // Also sometimes written as\n    //\
    \ b || (b = 2)\n    return a + b;\n}\n```\n\nThis is a short syntax that works\
    \ fine in many cases, but it's a little naive in this particular because b ||\
    \ 2 is a loose comparison. If you pass 0 as an argument, the comparison evaluates\
    \ to false and b becomes 2:\n\n```javascript\nsum(3); // 5\nsum(3, 0); // 5, not\
    \ what you'd expect\n```\n\nA longer version is to use typeof:\n\n```javascript\n\
    function sum(a, b) {\n  b = typeof b === \"undefined\" ? 2 : b;\n  return a +\
    \ b;\n}\nsum(3, 0); // 3\nsum(3); // 5\n```\n\n# Any Number of Arguments\n\nYou\
    \ do not have to pass all arguments that a function expects, and JavaScript won't\
    \ complain. In other words, there are no required parameters. If you need to make\
    \ a parameter required, you need to enforce this in the body of your function.\n\
    \nYou can also pass more arguments than a function expects, and these are happily\
    \ ignored without any errors:\n\n```javascript\nsum(); // NaN (not a number)\n\
    sum(1, 2); // 3\nsum(1, 2, 100, 999); // 3\n```\n\nYou can prepare for receiving\
    \ any number of arguments and handle this case gracefully. In PHP, you can use\
    \ func_get_args(), which returns an array of arguments passed to your function.\
    \ In JavaScript, you use the arguments array-like object. It's an object available\
    \ to your function body. It's dubbed \"array-like\" because its properties are\
    \ enumerated from index 0, and it also has a length property, just like an array:\n\
    \n```javascript\nfunction sum(/* nothing here */) {\n  for (var i = 0, result\
    \ = 0; i < arguments.length; i++) {\n    result += arguments[i];\n  }\n  return\
    \ result;\n}\n```\n\n```javascript\nsum(); // 0\nsum(111); // 111\nsum(1, 2);\
    \ // 3\nsum(1, 2, 3); // 6\nsum(1, 10, 2, 9, 38); // 33\n```\n\nRemember that\
    \ although it looks like an array, arguments is in fact an object, and it doesn't\
    \ have methods such as push(), pop(). However, you can easily convert this array-like\
    \ object to an array. Brace yourself for mastering what's new that will be explained\
    \ in detail later:\n\n```javascript\nfunction sum() {\n  var args = Array.prototype.slice.call(arguments);\n\
    \  typeof args.push; // \"undefined\"\n  typeof args.push; // \"function\"\n}\n\
    sum();\n```\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_44_0.png)\n\nThe typeof\
    \ operator returns the string \"function\" when used with functions.\n\n# arguments.length\
    \ Trick\n\nA clever approach to handling optional parameters is the one suggested\
    \ by JavaScript uses the arguments object:\n\n```javascript\n// Here you have\
    \ a function with all default parameters, like PHP's declaration:\n// function\
    \ sum($a = 1, $b = 2, $c = 3, $d = 4)\nfunction sum(a, b, c, d) {\n  // Note:\
    \ no 'break'\n  switch (arguments.length) {\n    case 0: a = 1;\n    case 1: b\
    \ = 2;\n    case 2: c = 3;\n    case 3: d = 4;\n  }\n  return a + b + c + d;\n\
    }\n```\n\n```javascript\nsum(); // 10\nsum(1); // 10\nsum(1, 2); // 20\nsum(1,\
    \ 2, 3); // 30\nsum(1, 2, 4); // 40\n```\n\n# Return Values\n\nFunctions always\
    \ return a value. If the function doesn't return, then undefined is returned implicitly:\n\
    \n```javascript\n// Explicit 'return'\nfunction iReturn() {\n  return 101;\n}\n\
    iReturn() === 101; // true\n```\n\n```javascript\ntypeof iReturn() === \"number\"\
    ; // true\n\n// Implicit 'return'\nfunction noReturn() {\n}\nnoReturn() === undefined;\
    \ // true\ntypeof noReturn() === \"undefined\"; // true\n```\n\n# Functions Are\
    \ Objects\n\nIt's important to understand that functions in JavaScript are objects.\
    \ They come with some properties and methods of their own. For example, take a\
    \ look at this simple function:\n\n```javascript\nfunction sum(a, b) {\n  return\
    \ a + b;\n}\n```\n\nThe length property of the object tells you how many parameters\
    \ are listed in the function definition, or in other words, how many arguments\
    \ the function expects:\n\n```javascript\nsum.length; // 2\n```\n\nThe methods\
    \ call() and apply() of the function offer an alternative way to call the function:\n\
    \n```javascript\nsum.call(null, 3, 4); // 7\nsum.apply(null, [3, 4]); // 7\n```\n\
    \nThe difference between the two is that apply() takes the arguments to pass to\
    \ the function as an array, as opposed to one. These two methods are similar to\
    \ what you can do in PHP using the following:\n\n```php\n// PHP\ncall_user_func('sum',\
    \ 3, 4);\ncall_user_func('sum', array(3, 4));\n```\n\nThe fact that functions\
    \ are objects means you can add properties and methods to the function objects.\
    \ This can be useful, for example, to cache the results of a function invocation\
    \ to avoid duplicate work.\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_45_0.png)\n\
    \nIf you're wondering about the first parameter passed to call() and apply(),\
    \ you can ignore it for now. You'll find out more about it later. Spoiler: it\
    \ is an object that the sum() function can refer to as this inside its body if\
    \ desired.\n\n# A Different Syntax\n\nFunctions are objects, so they can be assigned\
    \ to variables like all other data types. The following snippet shows a perfectly\
    \ valid and commonly used syntax:\n\n```javascript\nvar sum = function (a, b)\
    \ {\n  return a + b;\n}\n\nsum(2, 2); // 4\n```\n\nThis syntax shows what is called\
    \ a function expression, as opposed to the other syntax you're familiar with,\
    \ which is called a function declaration. The function declaration is the more\
    \ common syntax, and the only one available in PHP before version 5.3.\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_46_0.png)\n\
    \nThere's a semantic difference in the meaning of the function keyword depending\
    \ on the context. In a function expression, it's an operator in. A function declaration,\
    \ it's a statement.\n\nNote the trailing semicolon in the function expression.\
    \ Unlike function declarations, function expressions require a semicolon.\n\n\
    ![](img/7167a987f8e0f5a6179bb61bf22fe204_46_1.png)\n\nJavaScript has a semicolon\
    \ insertion mechanism where the interpreter adds the semicolons if you forget\
    \ them. However, it's always preferable to add the semicolons yourself to avoid\
    \ ambiguities. It is also helpful when you minify your code in order to reduce\
    \ its size in production, because with minification, all the code is pretty much\
    \ on line.\n\nThere is one more syntax you may encounter called named function\
    \ expression (NFE). It looks like this:\n\n```javascript\nvar sum = function plum(a,\
    \ b) {\n  return a + b;\n}\n\nsum(21, 21); // 42\nplum(21, 21); // Error: plum()\
    \ is not defined\n```\n\nThis sort of syntax can be helpful while debugging the\
    \ non-standard but commonly available name property of the function object:\n\n\
    ```javascript\nsum.name; // \"plum\"\n```\n\nThis syntax is called a named function\
    \ expression because you assign a name to the function. If you don't, which is\
    \ much common, you end up with an unnamed function expression, or simply called\
    \ an anonymous function.\n\nSetting the name (identifier) of the expression to\
    \ something other than the variable you assign it to (as plum in the preceding\
    \ example) is not recommended. It is confusing to read, and in many IE versions,\
    \ it mistakenly creates symbols (variables) in the enclosing scope. In other words,\
    \ typeof plum will be \"undefined\" in modern browsers So it's best to set the\
    \ name matching the variable you assign it to, like:\n\n```javascript\nvar sum\
    \ = function sum(a, b) {\n  return a + b;\n}\n```"
