    # About the Author


    Stoyan Stefan is a Facebook engineer, ex-Yahoo, architect of the YSlow 2.0 performance
    tool, and creator of the smash.it image optimization tool.


    He''s the author of JavaScript Patterns (O''Reilly), Object-Oriented JavaScript
    (Packt Publishing), The Book of Speed (online), and a contributor to High Performance
    JavaScript (O''Reilly) and Even Faster Web Sites (O''Reilly).


    Stoyan is a Zend-certified engineer, blogs at phpied.com and jspratters.com, and
    speaks at conferences and meetings around the world (Velocity, JSConf, Web Directions,
    and Fronterre, among others).


    A Bulgarian-Canadian, Stoyan lives in Los Angeles with his wife and daughters
    and spends his time biking from home, office, the beach, band practice, flying
    lessons, and kids'' birthday parties.


    # Colophon


    The animal on cover of JavaScript for PHP Developers (Sciurus carolinensis) is
    an eastern grey squirrel (a tree squirrel native to the eastern and Midwestern
    United States, and the southern portions of the eastern provinces of Canada).
    The genus, Sciurus, is derived from two Greek words: skia, meaning shadow, and
    our, meaning tail.


    As the names suggest, the eastern grey squirrel has grey fur, but it also has
    a brownish color. It has a white and a bushy tail. It is one of very few mammalian
    species that can descend a tree headfirst; it does this by turning its feet so
    the claws point backward and can grip the tree bark.


    Like many members of the Sciuridae family, the eastern grey squirrel is a scatter-hoarder:
    it hoards food in numerous caches for later recovery. Some caches are temporary,
    especially those made the site of a sudden abundance of food that can be retrieved
    within hours or days for reburial in a more secure site. Others are more permanent
    and are not retrieved until months later. Each squirrel is estimated to make several
    thousand caches each season. The squirrels have very accurate spatial memory for
    the locations of these caches, and use distant and nearby landmarks to retrieve
    them.


    Communication involves volatiles and posturing. The species has a varied repertoire
    of vocalizations, including a squeak like that of a mouse, a low-pitched noise,
    a chatter, and a raspy sound. Other methods of communication include tail flickering.
    Communications are mainly used in mating season and to ward off predators.


    The cover image is from Wood''s Animate Creation. The cover font is Adobe ITC
    garam. The text font is Adobe Minion Pro; the heading font is Adobe Myriad Condensed;
    and the code font is Dalton Maag''s Ubuntu Mono.'
