  - "[PAGE 134]\n\n# Revealing Pattern\n\nRelated to the question of privacy is the\
    \ so-called revealing pattern. The idea is that when you provide an object, you\
    \ make everything private by default and at the end you decide which parts to\
    \ reveal by making them public.\n\nIf you were to rewrite the previous example\
    \ using the revealing pattern, you would end up with something similar to the\
    \ following snippet:\n\n```\nvar my = (function () {\\n  var stuff = {\n    b:\
    \ [1, 2]\n  }\n});\n\nfunction encodeStuff() {\n  return JSON.parse(JSON.stringify(stuff));\n\
    }\n\nvar getStuff = function () {\n  var snap = encodeStuff();\n  return function\
    \ () {\n    return snap;\n  };\n};\n\n// Revelation happens here\nreturn {\n \
    \ getStuff: getStuff,\n  getRealStuff: encodeStuff\n});\n}();\n```\n\nSome things\
    \ to note here:\n\n+   - Everything is private until the very last return statement,\
    \ where you decide how much you want to reveal in the form of a public API.\n\
    - You don't need to use the same function names for public/private—the getRealStuff\
    \ is actually the private encodeStuff.\n- One function can use another private\
    \ function internally.\n- It's up to you to decide how to treat the name property\
    \ of the functions to reveal.\n\nTesting:\n\n```\n// getStuff was defined with\
    \ anonymous function expression\\nmy.getStuff.name; // \" \"\n```"
