    \ the next versions of ECMAScript.\n\n## Arrays\n\nIn PHP, you define an array\
    \ using:\n\n```php\n// PHP\n$a = array(1, 2, 3);\n```\n\nIn JavaScript, you drop\
    \ array and use square brackets:\n\n```javascript\n// JavaScript\nvar a = [1,\
    \ 2, 3];\n```\n\nPHP version 5.4 adds support for short array syntax, so it becomes\
    \ just like JavaScript:\n\n```php\n// PHP\n$a = [1, 2, 3];\n\n// JavaScript\n\
    var arr = Array([\"a\", 2, 3]);\nvar arrgh = new Array([\"a\", \"b\", \"c\"]);\n\
    arr; // [1, 2, 3]\narrgh; // [\"a\", \"b\", \"c\"]\n```\n\nThese also work in\
    \ JavaScript:\n\nThere's more about this syntax later, but keep in mind that the\
    \ square bracket notation is preferred.\n\nJust like PHP, you can mix any type\
    \ of values in an array, including other arrays:\n\n```javascript\n// JavaScript\n\
    var a = [1, \"yes\", false, null, undefined, [1, 2, 3]];\n```\n\nArrays in JavaScript\
    \ are objects:\n\n```javascript\ntypeof a; // \"object\"\n```\n\nYou'll find discussions\
    \ of the properties and methods of array objects later in this book, but just\
    \ to give you a flavor:\n\n```javascript\nvar a = [1, 2, 3];\na.length; // 3,\
    \ like count() in PHP\n```\n\nUnfortunately, you cannot add an element using a[]\
    \ as you do in PHP. You need to pass the index of the element you're adding:\n\
    \n```javascript\na[3] = 4;\n```\n\nOr, more commonly, use the length to get the\
    \ next index:\n\n```javascript\na[a.length] = \"five\"\n```\n\nAlternatively,\
    \ there's the push() method, similar to PHP's array_push() function:\n\n```javascript\n\
    a.push(6);\n```\n\nThe end result of executing all of these statements is:\n\n\
    ```javascript\na; // [1, 2, 3, 4, \"five\", 6]\n```\n\nYou access elements using\
    \ their index, just as you'd expect:\n\n```javascript\nvar b = a[4];\nb; // \"\
    five\"\n```\n\n## Associative Arrays\n\nThere are no associative arrays in JavaScript.\
    \ When you need one, use an object.\n\nIf you want to do this:\n\n```php\n// PHP\n\
    $assoc = array('one' => 1, 'two' => 2);\n```\n\nin JavaScript, you'd write:\n\n\
    ```javascript\n// JavaScript\nvar assoc = {'one': 1, 'two': 2};\n```\n\nThe difference\
    \ is just about using : instead of => and wrapping the values in curly brackets.\n\
    \nThe quotes around the keys—let's call them properties because they are indeed\
    \ properties of an object—are commonly omitted. When the keys are valid identifiers\
    \ (meaning the keys can be used as variable names), quotes are optional:\n\n```javascript\n\
    var assoc = {one: 1, two: 2};\n```\n\nAdding more to this associative array/object/dictionary:\n\
    \n```javascript\nassoc.three = 3;\n```\n\nTo remove properties, use the delete\
    \ operator:\n\n```javascript\ndelete assoc.two;\n```\n\nIn ES3, there is no easy\
    \ way to count the number of properties in an object other than going through\
