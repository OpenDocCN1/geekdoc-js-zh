  md: "# indexOf() and lastIndexOf()\n\nThe two new methods Array.prototype.indexOf()\
    \ and Array.prototype.lastIndexOf() offers more ways to search in an array.\n\n\
    Array.prototype.indexOf() returns the index of the first occurrence of an element:\n\
    \n```\nvar a = ['one', 'and', 'two', 'and', 'three', 'and', 'four'];\na.indexOf('three');\
    \ // 4\n```\n\nThis is close to PHP's array_search().\n\nWhile Array.prototype.indexOf()\
    \ returns the first occurrence, Array.prototype.lastIndexOf() returns the last\
    \ occurrence:\n\n```\nvar a = ['one', 'and', 'two', 'and', 'three', 'and', 'four'];\n\
    a.indexOf('and'); // 1\na.lastIndexOf('and'); // 5\n```\n\nThe search for elements\
    \ uses strict comparison to find matches:\n\n```\n[1, 2, 100, \"100\"].indexOf('100');\
    \ // 3\n[1, 2, 100, \"100\"].indexOf(100); // 2\n```\n\nYou can also specify start\
    \ position in indexOf() or end position in lastIndexOf() to begin the search:\n\
    \n```\nvar arr = [100, 1, 2, 100];\n\narr.indexOf(100); // 0\narr.lastIndexOf(100,\
    \ 2); // 3\n```\n\n```\narr.indexOf(100); // 3\narr.lastIndexOf(100, 2); // 0\n\
    ```\n\n# Walking the Array Elements\n\nES5 adds Array.prototype.forEach(), which\
    \ allows you to loop over array elements without a construct loop. It takes a\
    \ callback function in which you can do an operation with each element or with\
    \ the whole array.\n\nHere's a quick example that logs the arguments passed to\
    \ the callback function:\n\n```\n[\"a\", \"b\", \"c\"].forEach(function (arguments)\
    \ {\n  console.log(arguments);\n}\n```\n\nThe result in the console will be:\n\
    \n```\n[\"a\", 0, Array[3]]\n[\"b\", 1, Array[3]]\n[\"c\", 2, Array[3]]\n```\n\
    \nAs you see, the format is:"
  merge: -1
