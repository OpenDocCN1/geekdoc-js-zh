    \ gives you a nonhacky way to distinguish between arrays and objects (remember\
    \ arrays are objects) in JavaScript.\n\\If you want to shim the method and use\
    \ it in ES3 as well, you can use the Object.prototype.toString() trick, illustrated\
    \ previously in this book:\n\n```\nif (!Array.isArray) {\n  Array.isArray = function\
    \ (candidate) {\n    return Object.prototype.toString.call(candidate) === 'object\
    \ Array';\n  }\n}\n```\n\n```\nArray.isArray([]); // true\n```\n\nThis method\
    \ is the equivalent of is_array() in PHP."
