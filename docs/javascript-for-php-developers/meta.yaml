    ```\n\n```\nvar mysingle = new APP.Single();\nmysingle.say(); // \"Hi\"\n```"
  - "[PAGE 145]\n\n# Factory\n\nThe factory method pattern allows you to defer the\
    \ object creation to more specific subclasses/constructors. This allows you to\
    \ decide at runtime which class/constructor you'll use to create an object. You\
    \ usually pass a string to a static factory() or build() method, and this method\
    \ takes care of finding the right class to instantiate.\n\nIn PHP, you commonly\
    \ use a prefix to namespace your classes, or in newer versions, use a real namespace.\
    \ For example:\n\n```\n// PHP\n\n// Specific implementations\nclass Polygon_Trangle\
