  - '[PAGE 31]


    While PHP has several alternative syntax options for if-then-else control structures,
    in JavaScript, there''s only one (not counting the ternary operator). Thus, you
    can''t, for example, use elseif instead of else if.


    # Ternary Operator


    The short conditional syntax looks as a ternary operator (because it''s an operator
    that takes three operands), too:


    ```

    var num = 11;

    var whaisit = (num % 2) ? "odd" : "even";

    num + " is " + whaisit; // 11 is odd

    ```


    You''ve probably learned to avoid stacking more than one ternary without parentheses,
    as it''s tricky to read. Another reason is that it works differently in JavaScript.
    For example:


    ```

    // PHP

    echo true ? "a" : true ? "b" : "c"; // "b"


    // Same as

    echo (true ? "a" : true ? "b" : "c"); // "b"

    ) ? "a" : "c"; // "b"

    ```


    It''s the same syntax in JavaScript, but with a different result, because of the
    different order of evaluation:


    ```

    // JavaScript

    true ? "a" : true ? "b" : "c"; // "a"


    // Same as

    true ? "a" : "I''m ignored"; // "a"

    ```


    # Strict Comparison


    Have you noticed the triple equals sign === that all code examples used so far?
    Comparison works similar to PHP:


    +   - Three equals mean strict comparison (the expressions are compared by both
    value and type).

    n- Two equals signs mean loose comparison (only values are compared and, if needed,
    one expression is cast to the type of the other to perform type comparison).


    In order to make debugging easier, it''s always preferable to know what you''re
    comparing, by using === is good practice. It''s easier because you can catch errors
    while developing and before the program runs "in the wild" where values can be
    unpredictable. You also don''t need to remember the casting rules and oddities,
    which are not exactly like in PHP.'
  - "[PAGE 32]\n\nIn general, there are a handful of falsy values (values that cast\
    \ to false in nonstrict comparisons):\n\n+   * Empty string \"\"\n* The number\
    \ 0\n* The value false\n* null\n* undefined\n* Special numeric value NaN, which\
    \ means \"not a number,\" like PHP's NAN constant\n\nThese might trip you in nonstrict\
    \ comparisons:\n\n```\nnull === undefined; // true\n\"\" == 0; // true\n```\n\n\
    but\n\n```\nnull === undefined; // false\n0 == \"\"; // false\n```\n\nbecause\n\
    \n```\ntypeof null === typeof undefined; // false, \"object\" !== \"undefined\"\
    \ntypeof 0 === typeof \"\"; // false, \"number\" !== \"string\"\n```\n\nAll objects\
    \ are stretchy. And since arrays are objects, they always cast to true in loose\
    \ comparisons. This is different from PHP, where empty arrays are false:\n\n```\n\
    // PHP\nif (array()) {\n  echo \"hello\";\n  // Not reachable in PHP\n}\n\n//\
    \ JavaScript\nif ([]) {\n  console.log('hello');\n  // Reachable in JavaScript\n\
    }\n```\n\nNot falsy values are nonstrict equal to one another:\n\n```\nundefined\
    \ == null; // true\nundefined == 0; // false\n```\n\nTo recap, you can make your\
    \ life and the lives of those around you easier by always using strict comparison\
    \ with ===. You don't need to remember the casting rules and their differences\
    \ with PHP."
