    \ for math constants and static methods.\n- **JSON**: Also not a constructor,\
    \ but a global object you’ll see again in Chapter 6.\n\n# CHAPTER 6\nECMAScript\
    \ 5\n\nThis book has mostly talked about ECMAScript 3 because it's the most widely-distributed\
    \ version of the language. However, the latest standard is ECMAScript 5.1 (version\
    \ 4 was a dead-end branch that was eventually scrapped). Most modern browsers\
    \ support ES5. You should know what's new in ES5 even if you currently have to\
    \ support legacy browsers.\n\nThe three main areas of updates are:\n\n- Introduction\
    \ of strict mode\n- Object and property attributes\n- Some new APIs\n\n# Strict\
    \ Mode\n\nStrict mode is not backward compatible, and is therefore an opt-in feature.\
    \ Once per function or per program you can opt into strict mode by using:\n\n\
    ```javascript\n\"use strict\";\n```\n\nSince this is just a string statement,\
    \ old browsers will not complain and simply ignore it. But an engine that understands\
    \ strict mode will treat your code more strictly, allowing some JavaScript features\
    \ and constructs which, over the years, have proven to be more trouble than they're\
    \ worth. This book doesn't teach any of these shady practices, so there's nothing\
    \ for you to unlearn.\n\nExamples of features that trigger an error in strict\
    \ mode are:\n\n- Use of the with statement\n- Use of undeclared variables\n- Use\
    \ of arguments.callee or arguments.caller\n- Attempts to assign to read-only properties\
    \ (e.g., window.Infinity = 0);\n- Attempts to delete nonconfigurable properties\
    \ (you will see what configurable means in a bit)\n- Object literals with duplicate\
    \ properties\n\n```javascript\n// Example of duplicate properties\nvar obj = {\n\
    \  a: 1,\n  a: 2\n};\n```\n\n# Property Attributes\n\nThe second area of changes\
    \ in ES5 is the introduction of property attributes. In ES3, these were always\
    \ true. Here’s a simple example-to show how strict and nonstrict modes differ:\n\
    \n```javascript\n// Nonstrict\nvar obj = {\n  a: 1;\n};\n\n// Strict\n'use strict';\n\
    var obj = {\n  a: 1;\n};\n```\n\nDescriptors give you more control over mutability.\
    \ They let you, for example, define:\n\n```javascript\nvar descriptor = {\n  value:\
    \ \"John\",\n  enumerable: false,\n  writable: false,\n  configurable: false\n\
    };\n```\n\nA full descriptor was used for the secret property: the stealth_descriptor\
    \ sets the value, as well as the three attributes. The skill property only defines\
    \ a value. This means that all the attributes are set to their default values,\
    \ which are all false.\n\nIf you simply set a property without a descriptor, all\
    \ attributes are true, as is the case in ES3:\n\n```javascript\nprogrammer.likes\
    \ = ['pizza', 'beer', 'coffee'];\n```\n\n# New Object APIs\n\nLet's take a look\
