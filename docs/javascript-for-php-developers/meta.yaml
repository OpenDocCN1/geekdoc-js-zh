    # String Concatenation


    When looking at the for-in example, you may have noticed that the + operator is
    used to concatenate strings:


    ```

    var alphabet = "a" + "b" + "c";nalphabet; // "abc";

    ```


    It may seem strange, but the + operator is used for both adding numbers as well
    as concatenating strings:


    ```

    var numbers = "1" + "2" + "3";var sum = 1 + 2 + 3;numbers; // "123"

    ; // 6

    ```


    How do you know which operation will be performed? That depends on the type of
    the operands.


    Needless to say, the + operator is a common source of errors, so''s important
    to keep the variable types in mind.


    An alternative way to concatenate strings is even append to an array, and once
    done, join its elements. This concatenation performs even better in ancient IE
    versions (version 7 and earlier):


    ```

    [''R'', ''-'', ''D'', 2].join(''''); // "R2-D2"

    ```


    And finally, there''s the concat() method for strings, which doesn''t require
    you to create array objects just for concatenation:


    ```

    .concat(''R'', 2, ''-'', ''D'', 2); // "R2-D2"

    String.prototype.concat(''R'', 2, ''-'', ''D'', 2); // "R2-D2"

    ```


    # Type Casting


    Because can do both addition and string concatenation, you can also use + to quickly
    change the types of:


    ```

    +1"; // Converts the string "1" to the number 1

    "" + 1; // Converts the number 1 to the string "1"

    ```


    Speaking of type casting, you can use !! to convert to a boolean:


    ```

    !!; // true

    !!"; // false

    ```


    The first ! negates and returns a boolean true if the value is false, and the
    second ! negates again to give you the desired result of converting to a boolean.
    Additionally,'
