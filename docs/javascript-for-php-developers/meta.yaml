    The line this instanceof checks if the newly created this object was created by
    Dog. The line var fido = Dog(); didn''t use new, so this points to the global
    object. The global object was definitely created by Dog. After all, it was around
    even before Dog, so the check fails and the line return new Dog(); is reached.


    ![](img/7167a987f8e0f5a6179bb61bf22fe204_74_0.png)


    You don''t really know exactly which constructor was used to create the global
    object it''s an internal implementation dependent on the environment.


    Another way to introspect and ask “Who created you?” is to use the constructor
    property that all objects have. It''s also a writable property, so it''s not really
    reliable, as the following example shows:


    ```

    function Dog() {}

    var fido = new Dog();

    ```


    ```

    fido.constructor === Dog; // true, as expected

    fido.constructor = "I like potatoes"

    fido.constructor === Dog; // false, ... wait, what?

    fido.constructor;

    // "I like potatoes"

    ```


    # Prototypes


    The concept of prototypes does not exist in PHP but is an important concept in
    JavaScript.


    Let''s take a look at an example:


    ```

    function Dog(name) { // Constructor

    this.name = name;

    }

    ```


