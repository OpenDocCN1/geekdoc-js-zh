    \n```\n\ntoJSON() is handy for representing dates in JSON format and is used by\
    \ JSON.stringify(), which you'll see later. In fact, there is Date.prototype.toJSON(),\
    \ which returns the same as toJSON():\n\n```javascript\nvar today = new Date();\n\
    today.toJSON() === today.toISOString(); // true\n```\n\n# Function.prototype.bind()\n\
    \nSince functions can be passed as around, and inside a function it depends on\
