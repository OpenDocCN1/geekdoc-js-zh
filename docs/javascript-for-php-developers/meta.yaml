    \ 0); // 100\n```\n\nThe same thing in JavaScript returns 100,000 because the\
    \ reference to hundred_more would be retained, not its value:\n\n```\nvar hundred_more\
    \ = 100;\nvar sum = function (a, b) {\n  return a + b + hundred_more;\n}\nhundred_more\
    \ = 100000;\nsum(0, 0); // 100000\n```\n\n# Closures in a Loop\n\nLet's see another\
    \ example where this becomes even more obvious. Let's define an array of functions:\n\
    \n```\nvar fns = [];\n\nfunction definer() {\n  for (var i = 0; i < 5; i++) {\n\
    \    fns.push(function () {\n      return i;\n    });\n  }\n}\n\ndefiner();\n\
    ```\n\nHere you loop from 0 to 4, defining five functions. You can call these\
    \ functions like so:\n\n```\nfns[0]();\nfns[1]();\nfns[2]();\nfns[3]();\nfns[4]();\n\
    ```\n\nIf you haven't read the previous section, you might naively think that\
    \ each of these function calls returns the value of i at the time of function\
    \ definition. But all the five functions were defined in the same environment\
    \ and have access to the same local scope.\n\nWhen definer() returns, i has the\
    \ value 5, not 4, because at the last iteration there was one final i++. This\
    \ is the value that exists in the retained environment, and all five functions\
    \ see it. So\n\n```\nfns[0](); // s\nfns[1](); // s\nfns[2](); // s\n```"
