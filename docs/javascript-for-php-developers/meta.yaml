    \ {\n        $class = \"Polygon_ . ucfirst(strtolower($name));\n        if (class_exists($class))\
    \ {\n            return $class;\n        }\n        throw new Exception($class\
    \ . \" doesn't exist\");\n    }\n}\n```\n\n```\n// Usage\n$tri = Polygon::factory('triangle');\n\
    echo get_class($tri); // \"Polygon_Triangle\"\n```\n\n```\n// Throws an Exception,\
    \ there's no Polygon_Rectangle\n$rect = Polygon::factory('rectangle');\n```\n\n\
    The most important part here is return $class; PHP allows you to create instances\
