    a; // \"there\"\nvar a = (\"hello\", \"there\", \"young\", \"one\");\na; // \"\
    one\"\n```\n\n它与 `&&`、`||` 相似，但这些在结果确定时会停止评估表达式，而逗号运算符会继续执行：\n"
