    \n## JSLint\n\nJSLint 是一个静态检查你代码的工具，用于寻找潜在的危险模式以及缩进和缺失分号等简单问题。由于 JavaScript 不经过编译，某些错误很容易被掩盖，JSLint\
    \ 帮助你在代码上线生产之前发现其中一些问题。\n\nJSLint 已移植到许多环境中，并作为许多 IDE 和编辑器的插件可用。你可以轻松地将其集成到你的文本编辑器中，并在保存每个文件时运行它，这将让你对代码的质量更有信心。\n\
    \n一些开发者认为 ESLint 具有限制性且带有主观性，但它有许多选项，所以你可以调整并关闭你不认同的检查。名为 JSHint 的类似工具允许对想要开启的检查进行更精细的控制。另一个是\
    \ JavaScript Lint，它基于 Mozilla 的 SpiderMonkey JavaScript 引擎。\n\n## 检查本书书\n\n书中的所有示例都持续通过\
