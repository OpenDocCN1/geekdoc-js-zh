  md: '# # CHAPTER 1 Introduction


    JavaScript has a bad reputation for years. Many developers consider writing in
    JavaScript a pain because the programs behave so unpredictably. Once done coding,
    they open another browser to test, only to be greeted with another unhelpful error
    message (Figure 1-1). Thus, developers often simply refuse to bother studying
    the language.


    ![](img/7167a987f8e0f5a6179bb61bf22fe204_16_0.png)


    Figure 1-1. JavaScript errors gone wild'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'As it turns out, most of the problems have historically been (and let''s be
    honest, still are are) due to browser differences in the implementation of DOM
    and BOM, and to a much smaller extent, the JavaScript language itself.


    DOM stands for Document Object Model. It''s an API (application programming interface)
    for working with structured documents as those written in XML, XHTML, and HTML
    DOM is a language-independent API that also exists in PHP. In JavaScript, this
    API is easily spotted: anything that starts with document has to do with the DOM.
    As a point of historical interest, DOM started in JavaScript and was later standardized
    by the Wide Web Consortium (W3C) as an API independent of JavaScript or any other
    language. These days, you can still unveil remnants of primordial DOM (now called
    DOM)—things like document, images (all ones on a page) and document links (all
    links), which were replaced in version 1 with more generic methods such as document.getElementById()
    and document.getElementsByTagName().


    BOM stands for Browser Object Model. It''s a nice name for something that''s not
    formally defined. It''s a collection of browser-related properties and methods,
    such as available size screen or the status bar. Most of these properties are
    available as globals such as innerWidth, although you must not see them as properties
    of the window object (e.g., window.innerHeight). BOM hasn''t been standardized
    for a long time, so as you can imagine, there are differences across browsers.
    HTML5 started to codify common behavior among browsers, the common BOM objects.


    Another you need to know is ECMScript. This is the core JavaScript language when
    you strip out the DOM and BOM. It''s the language that deals with syntax, loops,
    functions, objects, and so on. JavaScript started as a Netscape innovation, but
    was later copied by browser vendors, raising the need for this language to establish
    a standard to which all implementors (browser vendors and others) would need to
    conform. This standard was defined by the European Computer Manufacturers Association
    (ECMA), now Ecma International, and called ECMScript. These days, JavaScript should
    technically mean Mozilla''s implementation of ECMScript (there''s also JSC, which
    is Microsoft''s implementation), but that''s not what people mean when say "JavaScript".


    All in all, when people talk about JavaScript, they may mean an array of topics,
    including DOM, BOM, and ECMScript. So:


    JavaScript = ECMAScript + DOM + BOM


    # # Scope of This Book


    A good thing that has happened since the early days of the Web is that there is
    a wide availability of high-quality JavaScript libraries, such as jQuery and YUI
    (Yahoo!)


    2 | Chapter 1: Introduction'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'User Interface Library. These libraries take the pain out of development by
    providing an API layer that abstracts the differences in the browser implementations
    of DOM and BOM—sometimes ECMAScript itself.


    The scope of this book is ECMAScript, the language itself. DOM is something you''re
    probably already familiar with PHP, and BOM is not really interesting (it''s just
    a collection of global variables and functions), you can always use a library
    to abstract the DOM and BOM. This book is independent of any particular JavaScript
    library, allowing you to focus on the core language and pick a library of your
    choice when you need one.


    The book uses the term JavaScript to mean ECMAScript because "ECMAScript" is uncommon
    and just plain awkward. The focus is on the most popular version of the language,
    ECMAScript 3 (ES3). The standards body skipped 4 and the latest version at the
    time of this book''s publication is ECMAScript 5.1, which is also referred to
    as ESS. Although ESS is already available you cannot rely on it if you want to
    support older browsers, as Internet Explorer before version 9. Chapter 6 details
    what''s new and different in ES5, and will help you to decide or not to use it.
    It works in old browsers via a "shim," or "polyfill," as you''ll see in "Shims"
    on page 112.


    # The Language


    Once you strip out all the DOM/BOM browser hell, what you have left is JavaScript—a
    beautiful, small language with a familiar C-like syntax and just a handful of
    built-in objects.


    It''s a popular language that''s practically everywhere: on the client, server,
    mobile phones, desktop, and shell. Even inside PHP you can embed JavaScript using
    the PHP class. It''s actually harder to find an environment where you cannot run
    JavaScript, which means you can learn one language and use it everywhere.


    It''s also an odd language when you approach it from the perspective of a PHP
    developer. Here are some things to be aware of on and look for as you progress
    through this book:",


    +   - Functions in JavaScript objects. Arrays and regular expressions are objects,
    too.

    - Functions provide scope, and local variable scope is achieved by wrapping the
    code in a function.

    - Closures are used heavily. Although closures have existed in PHP since version
    5.3, they are not commonly used in PHP. In JavaScript, they are everywhere.

    - Prototypes are an important concept in JavaScript for which there is no equivalent
    in PHP. It''s one of the ways JavaScript accomplishes code reuse and inheritance.'
