  md: "The most popular open source AMD utility at the time of writing is RequireJS.\n\
    \n# Design Patterns\n\nFor dessert, let's consider a few design patterns from\
    \ the Gang of Four's book. Bear in mind that patterns are designed for static,\
    \ strongly typed, class-based languages could be trivial to implement or unnecessary\
    \ in a language as JavaScript.\n\n# Singleton\n\nThe singleton pattern ensures\
    \ there's only one object of a certain class and provides a single global access\
    \ to it. JavaScript doesn't have classes, so a single instance of a class does\
    \ make sense. Additionally, all objects are unique, so the term singleton in JavaScript\
    \ can be another name for an object:\n\n```\nvar singleton = {a: 1};\nvar another\
    \ = {a: 1};\nsingleton === another; // false\n```\n\nAs you can see, singleton\
    \ is already a unique object.\n\n> Sometimes when people say \"singleton\" in\
    \ JavaScript they mean an object created using the module pattern.\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_143_0.png)\n\
    \n# Singletons with constructors\n\nBut what if your team is so attached to the\
    \ concept of classes that they want to create all the objects with constructor\
    \ functions? In other words, you're looking for something that behaves like this:\n\
    \n```\nfunction Single() {\n  // magic!\n}\n```\n\n```\nvar a = new Single();\n\
    var b = new Single();\na === b; // true\n```\n\nSince the goal is to have a single\
    \ hidden instance (object), you can get a little help from an old friend—the closure\
    \ created by an immediate function:\n\n```\nvar Single = {function () {\n  var\
    \ instance;\n```\n\n```\nfunction Single() {\n  // Own properties\n  this.say_what\
    \ = \"Hi\";\n```"
