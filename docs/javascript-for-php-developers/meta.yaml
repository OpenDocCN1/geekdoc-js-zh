  mdcn: "\n```javascript\n}\n// 开始实际工作...\nthis.thisIsTheName = \"Fido\";\n//实际工作结束\n\
    \n// 隐式在结尾...\n// return this;\n}\nvar newfido = new Dog();\nvar fido = Dog();\n\
    ```\n\n```javascript\nnewfido.thisIsTheName; // \"Fido\"\nfido.thisIsTheName;\
    \ // \"Fido\"\n```\n\n`this instanceof` 这一行检查新创建的 this 对象是否由 Dog 创建的。`var fido\
    \ = Dog();` 这一行没有使用 `new`，所以它指向全局对象。全局对象显然不是 Dog 创建的。毕竟，它在 Dog 之前就已经存在，所以检查失败并执行了\
    \ `return new Dog();` 这一行。\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_74_0.png)\n\
    \n你并不确定具体哪个构造函数创建了全局对象，这取决于环境的内部实现。\n\n另一种内省并询问“谁创建了你？”的方法是使用所有对象都拥有的 `constructor`\
    \ 属性。它也是可写的属性，所以它并不真的可靠，如下例所示：\n\n```javascript\nfunction Dog() {}\nvar fido =\
    \ new Dog();\n```\n\n```javascript\nfido.constructor === Dog; // true，符合预期\nfido.constructor\
    \ = \"I like potatoes\"\nfido.constructor === Dog; // false, ...等等，什么？\nfido.constructor;\n\
    // \"I like potatoes\"\n```\n\n# 原型\n\n原型概念在 PHP 中不存在，但它是 JavaScript 中一个重要的概念。\n\
    \n让我们来看一个例子：\n\n```javascript\nfunction Dog(name) { // 构造函数\n  this.name = name;\n\
    }\n```\n\n```javascript\n// 向 `prototype` 属性添加一个成员\n```\n\n```javascript\nDog.prototype.setName\
    \ = function () {\n  return this.name;\n}\n\nvar fido = new Dog(\"Fluffy\");\n\
    fido.setName(); // \"Fluffy\"\n```\n\n这里发生了什么？\n\n1. 有一个普通函数 Dog，显然是为了作为构造函数而创建的，因为它以大写\
    \ D 开头，并在内部引用了 `this`。\n2. 在幕后，Dog() 函数像任何其他函数一样，自动获得了一个名为 `prototype` 的属性。你知道函数是对象，所以它们可以拥有属性。每个函数（无论构造函数还是其他）都会创建一个\
    \ `prototype` 属性。\n3. 你在原型上添加了一个新属性，名为 `setName`。这个属性恰好是一个函数，所以你可以说它是一个方法。\n4.\
    \ `setName()` 可以访问 `this`。\n5. 使用 `new Dog()` 创建 fido 对象可以让 fido 访问到所有添加到 `prototype`\
    \ 属性的属性。否则，如果你在不使用 `new` 的情况下调用 `Dog()`，原型类型及其所有内容都会被忽略。\n6. 即使 `setName` 不是 fido\
    \ 对象的属性，`fido.setName()` 也能正常工作。\n\n对象可以访问不属于它、而是属于创建该对象的构造函数的所谓“原型”的对象的属性和方法。\n\
    让我们思考一下；后面会有关于原型的更多内容。\n\n# 对象字面量\n\n你已经在本书的多个地方看到过对象字面量的用法（例如，讨论如何在 JavaScript\
    \ 中表示 PHP 的关联数组）。\n对象字面量仅仅是键值对，用逗号分隔并用大括号包裹：\n\n```javascript\nvar obj = {\n \
    \ name: \"Fluffy\",\n  legs: 4,\n  tail: 1\n};\n```\n\n在最后一个属性后留下尾逗号是不的，因为某些环境（早期的\
    \ Internet Explorer 版本）无法处理它并报错。\n\n你也可以从属性（或没有任何属性）开始，稍后添加更多：\n\n```javascript\n\
    var obj = {};\nobj.name = \"Fluffy\";\nobj.legs = 4;\nobj.tail = 1;\n```\n\n#\
    \ 访问属性\n\n使用对象字面量符号创建对象后，你可以使用点符号访问属性：\n\n```javascript\nvar desc = obj.name +\
    \ \" has \" + obj.legs + \" legs and \" + obj.tail + \" tail(s)\";\n```\n\n```javascript\n\
    desc; // Fluffy has 4 legs and 1 tail(s)\n```\n\n或者，你可以使用方括号表示法来访问属性。例如，遍历一个变量。\n\
    \n```javascript\nvar desc = obj[\"name\"] + \" has \" + obj[\"legs\"] + \" legs\
    \ and \" +\nobj[\"tail\"] + \" tail(s)\";\n```\n\n```javascript\ndesc; // Fluffy\
    \ has 4 legs and 1 tail(s)\n```\n\n这并不常见，因为将属性名作为字符串传递比较冗长且有点笨拙。但是当你提前不知道属性名并需要遍历属性时，它是很有用的：\n\
    \n```javascript\nvar all = [];\nfor (var property in obj) {\n  all.push(property\
    \ + \": \" + obj[property]);\n}\nvar desc = all.join(', ');\n```\n\n```javascript\n\
    desc; // \"name: Fluffy, legs: 4, tail: 1\"\n```\n\n或者如另一个例子，当属性在运行时求值时\n\n```javascript\n\
    var obj = {\n  foo: \"Foo\",\n  bar: \"Bar\",\n  obar: \"Foo + Bar = BFF\"\n}\n\
    ```\n\n```javascript\nvar fprop = \"foo\", bprop = \"bar\";\n```\n\n```javascript\n\
    obj[fprop]; // \"Foo\"\n```\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_76_0.png)\n\
    \n```javascript\nobj[fprop + bprop]; // \"Foo + Bar\"\n```\n\n当属性不是有效标识符时，需要方括号表示法（对象字面量中的名称相同）：\n\
    \n```javascript\nvar fido = {};\nfido.number-of-aws = 4; // ReferenceError\nfido['number-of-aws']\
    \ = 4; // 这是 OK\n```\n\n# 混淆\n\nJavaScript 中的点用于访问属性，但在 PHP 中，它们用于拼接字符串。当你编写 JavaScript\
    \ 时，经常会混淆目的：\n\n```javascript\n// PHP\nvar world = \"wrrld\";\nvar result = \"\
    hello \" . world;\n```\n\n在 JavaScript 中，这不是语法错误。它是这样工作的：\n\n```javascript\n\"\
    hello\".world; // undefined\n```\n\n换句话说，由于点的空格是可选的，所以它是这样工作的：\n\n```javascript\n\
    \"hello\".world; // undefined\n```\n\n# 字面量中的方法\n\n（此处原文包含大量重复空格/占位符，已根据指令保留格式并仅翻译逻辑内容）\n"
