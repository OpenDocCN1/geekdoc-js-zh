  md: "# Restricting Object Mutations\n\nIn ES3, all objects are mutable, with a few\
    \ exceptions found in the built-in objects. Sometimes this is not a good idea\
    \ because users of your objects can change them beyond repair. In ES5, you can\
    \ restrict access to your objects. For example, you can make selected properties\
    \ read-only by setting their writable attribute to false.\n\nBut you can access\
    \ to the whole object:\n\n+   - Preventing extensions (i.e., don't allow new properties)\n\
    - \"Sealing\" an object, which means making all properties nonconfigurable (cannot\
    \ delete them) on top of making the object nonextensible\n- \"Freezing\" an object,\
    \ which is like sealing but with the additional step of setting all properties\
    \ to nonwritable\n\nConsider this regular object:\n\n```\nvar pizza = {\n  tomatoes:\
    \ true,\n  cheese: true\n}\n```\n\nYou can always add more properties:\n\n```\n\
    pizza.pepperoni = 'lots';\",\n```\n\nYou can change and delete properties, because\
    \ they are all configurable and writable:\n\n```\npizza.cheese = 'mozzarella'\n\
    delete pizza.pepperoni; // true\n```\n\nHowever, if you prevent extensions, you'll\
    \ no longer be able to add properties. You can check for extensibility with Object.isExtensible()\
    \ and disable extensions (irreversibly) with Object.preventExtensions():\n\n```\n\
    Object.isExtensible(pizza); // true\nObject.preventExtensions(pizza); // Returns\
    \ the `pizza` object\nObject.isExtensible(pizza); // false\n```\n\n```\npizza.broccoli\
    \ = 'ew'; // Error, cannot add properties anymore\ntypeof pizza.broccoli; // \"\
    undefined\"\n```\n\nAdditionally, you can prevent deletions when seal():\n\n```\n\
    Object.isFrozen(pizza); // false\nObject.seal(pizza); // Returns the `pizza` object\n\
    Object.isFrozen(pizza); // true\n```\n\n```\ndelete pizza.cheese; // Error, can't\
    \ delete\npizza.cheese; // \"mozzarella\"\n```\n\nYou can still change a property\
    \ value though:"
