  md: 'Array access to strings (e.g., red[1]) is defined in ES5 and doesn''t work

    in old IEs.


    Another example: the geeky joke that Halloween is actually Christmas because every-body
    knows Oct 31 = Dec 25. Using a JavaScript console, you can check if you got the
    joke. October = Oct = 8, December = Dec = Decimal = 10, and so:


    ```

    parseInt(31, 8) === parseInt(25, 10); // true

    ```


    # Encoding URLs


    The other four of the global functions deal with URL encodings:


    encodeURIComponent() and decodeURIComponent()

    These functions are like PHP''s urlencode() and urldecode().


    encodeURI() and decodeURI()

    These are similar to encodeURIComponent() and decodeURIComponent() but they

    produce valid URLs while encoding only the part that needs encoding, leaving

    things like :// untouched split into four groups:


    ```

    var url = ''http://phpied.com/search=js php'';

    encodeURIComponent(url); // "http%3A%2F%2Fphpied.com%2Fsearch%3Djs%20php"

    decodeURI(url);         // "http://phpied.com/?search=js%20php"

    ```


    Note that encodeURI() doesn''t encode "&", which may be a problem or a feature
    de-dending on what you''re trying to do with query strings:


    ```

    var qs = ''helloworld&jello=m o n'';

    URIComponent(qs); // "hello%3Dworld%26jello%3Dm%20o%20a%20n"

    decodeURI(qs);     // "helloworld&jello=m%20o%20a%20n"

    ```


    You may also across the functions escape() and unescape(). These are not part
    of ECMAScript; they come from BOM. They work

    slight different than encodeURI() and encodeURIComponent(), and

    should not be used.


    # Built-In Constructors


    Most of the built-in, ready-to-use functionality in JavaScript is implemented
    in its global

    constructor functions and two "other" global objects: either as properties and
    methods

    of the constructor functions themselves or as part of prototype properties. The

    constructors can be split into four groups:'
