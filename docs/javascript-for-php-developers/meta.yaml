    \ you already know about undefined.\n\nThe fact that these three special values\
    \ are properties of the global object is of little interest. But a curious problem\
    \ exists in ES3 (fixed in ES5)—you can overwrite them (e.g., Infinity = 1). This\
    \ is, of course, a terrible idea, but it happens “in the wild.” Here’s a pattern\
    \ that libraries use to prevent people from shooting themselves in the foot:\n\
    \n```\n// Global program code\n(Function(window, undefined) {\n  // window and\
    \ undefined are what they should be\n\n  // library goes here ...n}(this /*, no\
