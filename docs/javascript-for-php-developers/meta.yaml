  md: "order of the decoration be important (e.g., a decorator that escapes HTML should\
    \ run before the one that adds HTML tags such as <i>).\n\nIn effect, your program\
    \ chains decorators one after the other. Each decorator should therefore work\
    \ with the result of the previous decorator in the chain.\n\n# Adding decorators\n\
    \nLet's use Text() as a namespace and add all the decorators there:\n\n```\nText.decorators\
    \ = {};\n```\n\nThe first decorator adds missing spaces after punctuation:\n\n\
    ```\nText.decorators.punctuation = {\n  get: function (text) {\n    return text.replace(/[/,:!?])\\\
    s*/g, '$1');\n  }\n}\n```\n\nHere you a punctuation object with a single method.\
    \ This method receives the output of the decorator that comes before it in the\
    \ call chain and further modifies the text.\n\nSame for the italics object:\n\n\
    ```\nText.decorators.italics = {\n  get: function (text) {\n    return text.replace(/(_)(.*?)?(_)/g,\
    \ '<i>$2<i></i>');\n  }\n}\n```\n\nAnd finally, an escape object:\n\n```\nText.decorators.escape\
    \ = {\n  get: function (text) {\n    return text.replace(/&/g, '&amp;');\n   \
    \ replace(/</g, '&lt;');\n    replace(/>/g, '&gt;');\n  }\n}\n```\n\n# decorate()\
    \ and get\n\nNow that the API is clear and the decorators exist, it's time for\
    \ the decorate() method.\n\nFirst, you need to slightly modify the Text() constructor\
    \ so it maintains a list of decorators currently registered:\n\n```\nfunction\
    \ Text(txt) {\n  this.input = txt;\n  this.decorators_list = [];\n}\n```"
