  md: '# null and undefined


    So far, you''ve seen three of the five primitive types: string, boolean, and number.
    The other two are the types null and undefined.


    The undefined type has only one value—the value undefined. When you declare a
    variable but not initialize it, it''s initialized with undefined. Also, when you
    have a function that doesn''t return a value explicitly, it returns undefined:


    ```

    var a;

    typeof a; // "undefined"

    var b = 1;

    b = undefined;

    typeof b; // "undefined"

    ```


    Note that the typeof operator always returns a string. In the previous example,
    b has the value undefined, but typeof returns the string "undefined". It''s common
    for newcomers to confuse the string "undefined" and the value undefined. Consider
    these differences:


    ```

    var b;

    b === undefined; // true

    b === "undefined"; // false

    typeof b === "undefined"; // true

    typeof b === undefined; // false

    ```


    The null type has only one value—the value null. It''s rarely useful, but can
    be passed in function calls when calling functions that take a lot of arguments
    or when you want to make an explicit difference between undeclared and uninitialized
    variables, since undefined may mean either of those.


    Surprisingly, typeof returns "object" when used with a null value:


    ```

    var a = null;

    typeof a; // "object"

    ```


    ![](img/7167a987f8e0f5a6179bb61bf22fe204_28_0.png)


    You can expect typeof to return "null" in one of the next versions of ECMAScript.


    # Arrays


    In PHP, you define an array using:


    ```

    // PHP

    $a = array(1, 2, 3);

    ```


    In JavaScript, you drop array and use square brackets:'
