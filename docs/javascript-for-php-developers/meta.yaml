  md: '# Preface


    JavaScript is the language of the browser. It''s also the language that allows
    you to build increasingly diverse types of client, server, desktop, mobile, and
    shell applications. HTML5 continues the trend of allowing you to build rich applications
    (formerly known as RIA, Ajax, and HTML) with new features such as local storage,
    databases on the client, geolocation, image, and video APIs—all exposed and scriptable
    by JavaScript. Fluency in JavaScript is a must for every web developer today.


    This book is for the PHP developer who learning JavaScript from the ground up.
    Both languages look deceptively close because they both share the similar C-like
    syntax. But they differ in many concepts, such as object creation, classes, and
    prototypes, which are critical to mastering each language. The book draws on your
    previous experience and so it won''t put you to sleep explaining the most trivial
