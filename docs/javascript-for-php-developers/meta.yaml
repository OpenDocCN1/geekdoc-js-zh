    \ inheriting from another constructor function; hence, it looks bit like a class\
    \ inheriting from a class.\n\nHere’s the gist:\n\n```javascript\nfunction extend(Child,\
    \ Parent) {\n  var F = function () {}\n  F.prototype = Parent.prototype;\n  Child.prototype\
    \ = new F();\n}\n```\n\nWith this method, two constructor functions to extend().\
    \ After extend() is done, any new objects created with the first constructor (the\
    \ child) get all the properties methods of the second (the parent) via the prototype\
    \ property.\n\n> This method is often referred to as “classical” in quotes because\
    \ it looks closest to the idea of classes.\n\nThere are only two small things\
    \ to add to extend():\n\n- 1. Have the child keep a reference to the parent, just\
    \ in case.\n- 2. Reset the constructor property of the child to point to the child’s\
    \ constructor, in case this is needed for introspection (you’ll see more about\
    \ this property in Chapter 5):\n\n```javascript\nfunction extend(Child, Parent)\
    \ {\n  var F = function () {}\n  F.prototype = Parent.prototype;\n  Child.prototype\
    \ = new F();\n  Child.prototype.parent = Parent;\n  Child.prototype.constructor\
    \ = Child;\n}\n```\n\nIn this method, there’s no instance of new Parent() involved.\
    \ This means that own properties added to this inside the parent constructor will\
    \ not be inherited. Only the properties added to the prototype of the parent will\
    \ be inherited. And this is OK in many scenarios. In general, you add the properties\
    \ you want to reuse to the prototype.\n\nConsider this setup:\n\n```javascript\n\
