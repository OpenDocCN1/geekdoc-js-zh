  md: "Using require(), you get the module's exports object and assign it to a local\
    \ variable, which doesn't need to have the same name. This is also fine:\n\n```\n\
    var bye = require(\"/hi\");\n```\n\nYou can export several properties and get\
    \ a handle to a specific property when you use require(). For example, you can\
    \ say the sayHi() directly to a variable:\n\n```\nvar hey = require(\"/hi\").sayHi;\n\
    hey(); // \"hi!\"\n```\n\nAs you can see, CommonJS is much simpler and friendlier\
    \ than the module pattern's namespaces and closures. The hassle is taken care\
    \ of for you, and you have at your disposal the require() function and the exports\
    \ object.\n\n# Using an Agnostic Module\n\nIf you want to create a portable piece\
    \ of JavaScript (say, an open source library) and you don't know whether it will\
    \ be used in a CommonJS environment or not, you can still support by:\n\n+   -\
    \ Defining a simple namespace/object\n- Adding all your stuff there\n- Checking\
    \ for exports and making your public API a property of exports\n\nFor example,\
    \ here is how you would do it:\n\n```\n// SinglePHP\nvar JSPHP = JSPHP || {};\n\
    \n// Define the functionality of your `utils` module\nJSPHP.utils = {\n  isOdd:\
    \ function(num) {\n    return num % 2 !== 0;\n  }\n};\n\n// CommonJS?\nif (typeof\
    \ exports === \"object\") {\n  exports.utils = JSPHP.utils;\n}\n```\n\nThis way,\
    \ CommonJS environments can simply load your code and use the longer namespaced\
    \ method call:\n\n```\nJSPHP.utils.isOdd(10); // false\n```\n\nThis sort of namesacing\
    \ is longer than just.isOdd(), but it provides some degree of certainty that the\
    \ user of your JSPHP utility doesn't already have a variable with the same name\
    \ in their."
