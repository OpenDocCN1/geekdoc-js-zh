    ;\nfunction Child() {\n  extend(Child, Parent);\n}\n```\n\nThe property name is\
    \ not inherited, but the family is:\n\n```javascript\nnew Child().name; // undefined\n\
    new Child().family; // \"Bear\"\n```\n\nAnd the child has access to the parent:\n\
    \n```javascript\nChild.prototype.parent === Parent; // true\n```\n\n## Borrowing\
    \ Methods\n\nUsing call() and apply() gives you an opportunity to reuse code without\
    \ having to deal with inheritance at all. After all, inheritance is meant to help\
    \ us reuse code.\n\nIf you see a method like this, you can temporarily borrow\
    \ it, passing your own object to be bound to:\n\n```javascript\nvar object = {\n\
    \  name: \"normal\",\n  sayName: function () {\n    return \"My name is \" + this.name;\n\
    \  }\n}\n```\n\n```javascript\nvar precious = {\n  shiny: true,\n  name: \"iPhone\"\
    \n}\n```\n\nIf you want to benefit from object.sayName() without extending anything,\
