  md: "# Factory\n\nThe factory method pattern allows you to defer the object creation\
    \ to more specific subclasses/constructors. This allows you to decide at runtime\
    \ which class/constructor you'll use to create an object. You usually pass a string\
    \ to a static factory() or build() method, and this method takes care of finding\
    \ the right class to instantiate.\n\nIn PHP, you commonly use a prefix to namespace\
    \ your classes, or in newer versions, use a real namespace. For example:\n\n```\n\
    // PHP\n\n// Specific implementations\nclass Polygon_Trangle {}\nclass Polygon_Square\
    \ {}\nclass Polygon_Circle {}\",\n```\n\n```\n// Where the factory lives\n```\n\
    \n```\nPolygon {\n    static function factory($name) {\n        $class = \"Polygon_\
    \ . ucfirst(strtolower($name));\n        if (class_exists($class)) {\n       \
    \     return $class;\n        }\n        throw new Exception($class . \" doesn't\
    \ exist\");\n    }\n}\n```\n\n```\n// Usage\n$tri = Polygon::factory('triangle');\n\
    echo get_class($tri); // \"Polygon_Triangle\"\n```\n\n```\n// Throws an Exception,\
    \ there's no Polygon_Rectangle\n$rect = Polygon::factory('rectangle');\n```\n\n\
    The most important part here is return $class; PHP allows you to create instances\
    \ of classes that are not known in advance. In other languages, you might need\
    \ a long switch statement listing all known classes.\n\nIn JavaScript, you can\
    \ map Polygon object and use it as a namespace as well as a place to keep your\
    \ static factory() method:\n\n```\n// JavaScript\nvar Polygon = {\n    factory:\
    \ function (name) {\n        var const = name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();\n\
    \        if (Polygon[const]) {\n            return Polygon[const];\n        }\n\
    \        throw new Error(\"Polygon. \" + name + \" doesn't exist\");\n    }\n\
    }\n```"
