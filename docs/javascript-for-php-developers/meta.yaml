    # Accessing Properties


    Having created object using the object literal notation, you can access the properties
    using the dot notation:


    ```

    var desc = obj.name + " has " + obj.legs + " legs and " + obj.tail + " tail(s)";

    ```


    ```

    desc; // Fluffy has 4 legs and 1 tail(s)

    ```


    Alternatively, you can use the square bracket notation to access properties. For
    example, iterating over a variable.


    ```

    var desc = obj["name"] + " has " + obj["legs"] + " legs and " +

    obj["tail"] + " tail(s)";

    ```


    ```

    desc; // Fluffy has 4 legs and 1 tail(s)

    ```


    This is not too common, because it''s longer and a little clumsy to passing property
    names as strings. However, it is useful when you don''t know the property name
    in advance and need to iterate over properties:


    ```

    var all = [];

    for (var property in obj) {

    all.push(property + ": " + obj[property]);

    }

    var desc = all.join('', '');

    ```


    ```

    desc; // "name: Fluffy, legs: 4, tail: 1"

    ```


