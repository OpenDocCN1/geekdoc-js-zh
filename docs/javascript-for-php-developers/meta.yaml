    \ needs to find all variables sprinkled throughout the function body and keep\
    \ them handy in one place. Moving to line 5, it turns out `sum` is also a function,\
    \ so it needs a `__scope` property. Now `sum.__scope` points to `papa()variables`,\
    \ as is `sum(which)` lexically defined. The linked list (chain) of scopes becomes:\n\
    \nsum.__scope -> papa's __variables -> global __variables\n\nNow if the interpreter\
    \ needs to look up a variable, it looks in the local `__variables` of `papa()`.\
    \ If the variable is not found, then the interpreter will find this sequence:\
    \ \"OK, I'm inside the function `papa()`, and there's no local variable with that\
    \ name. Let me see where `papa.__scope` points to. Oh, lookie, another `__variables`\
    \ thing, full of variables; I'd better check what's in there!\n\n[papa() local\
    \ __variables] hunred_more, sum\n[global __variables] global_ten, papa\n\nNext,\
    \ on line 6, the code calls `sum`, so the interpreter enters this function and\
    \ finds itself on line 6. It creates yet another `__variables` object containing\
    \ `a` and `b`. These are not declared with `var` but are declared by way of being\
    \ used as the function's formal parameters.\n\nWhat used to be a local scope now\
    \ becomes a closure, as there's now another immediate local scope at:\n\n```\n\
    sum(1) local __variables__ a, b\n[papa() closure __variables__ hundred_more, sum\n\
    [global __variables] global_ten, papa\n```\n\nWhen the interpreter has to perform\
    \ the arithmetic operation on line 6, it starts looking values to replace the\
    \ variables. You can imagine the interpreter thinking something along these lines:\n\
    \n```\n// Got it in the [local] scope, we're good.\nb // Also in the [local] scope,\
    \ excellent.\nglobal_ten // Hm, not in [local], let me dig deeper.\n// What's\
    \ sum()'s _scope? I see, a [closure]!\n// Meh, not in [closure] either, let's\
    \ keep going.\n// [closure] is papa()__variables object. So what's papa.__scope?\n\
    // It's the [global__variables__].\n// I found 'global_ten' in [global] scope,\
    \ yay me!\n// This was the last chance, otherwise I would\n// need to throw an\
    \ error.\n```\n\nhundred_more // Not in [local], but found in [closure], all fine.\n\
    \nYou see now how a chain (the scope chain) is created in the form of a linked\
    \ list where each function knows its lexical `__scope__`. The interpreter needs\
    \ a variable and doesn't find it locally, it starts following the chain of linked\
    \ scopes, looking for that variable.\n\n# The Scope Chain in the WebKit Console\n\
    \nWhen debugging in the WebKit console (in either Chrome or Safari), you can look\
    \ at the scope objects and what they contain. I've created an HTML file you can\
    \ practice with. Here's how:\n\n- 1. Load the file in a WebKit browser.\n- 2.\
    \ Right-click anywhere and select \"Inspect element\" to bring up the Web Inspector.\n\
    - 3. Click the Scripts tab.\n- 4. Insert breakpoints by clicking on line numbers\
    \ 8 and 21.\n\nYou will see something like what is shown in Figure 3-1.\n\n```html\n\
    <script>\nvar global_ten = 10;\n\nfunction papa1() {\n  var hundred_more = 100;\n\
    \  var sum = function(a, b) {\n    return a + b + global_ten + hundred_more;\n\
    \  };\n  return sum(0, 11);\n}\n\npapa2();\n\nfunction papa2() {\n  var hundred_more\
    \ = 100;\n  function innerSum() {\n    var sum = function(a, b) {\n      return\
    \ a + b + global_ten + hundred_more;\n    };\n    return sum(0, 11);\n  }\n}\n\
    papa2();\n</script>\n```\n\nFigure 3-1. Breakpoints in the Web Inspector\n\nNow\
    \ refresh the page and you'll see the code execution stop at line 8. Look at the\
    \ right-hand menu, in the Scope Variables section. You'll clearly see the chain\
    \ consisting of Global, Closure, and Local sections, and the variables available\
    \ inside (Figure 3-2).\n\n```html\nscope.html\n<script>\nvar global_ten = 10;\n\
