  md: 'JavaScript/Web Development


    # JavaScript for PHP Developers


    If you want to significantly expand your web development skills beyond PHP, this
    practical, hands-on book teaches you ECMAScript—the core JavaScript language—from
    the ground up. You''ll discover some similarities between JavaScript and PHP,
    such as conditions and loops, but the primary focus is on JavaScript''s unique
    object creation, classes (or lack thereof), prototypes, and inheritance.


    JavaScript knowledge is essential for working with today''s Web, whether you''re
    building applications for the client, the server, or for mobile use—and your PHP
    experience gives you a head start. This book will help you become fluent with
    JavaScript quickly, and then serve as a reference once you start coding.


    > Reading this book is like learning JavaScript from yourself, the future you
    who is a JavaScript expert and has discovered time travel. If you''re a developer
    wanting to learn JavaScript, you can stop searching for the perfect book. This
    is it.


    +   - Explore JavaScript syntax, including variables, arrays, loops, and conditions

    - Learn how functions are important in JavaScript—and why they''re actually objects

    - Delve into JavaScript''s object-oriented features, including prototypes, code
    reuse, and inheritance

    - Examine the built-in API and explore its global functions, properties, and objects

    - Learn about updates in ECMAScript 5, the latest version of the standard

    - Use common design patterns to organize your code in applications


    Chris Shiflett Co-organizer of Brooklyn Beta and Partner at Fictive Kin


    Stoyan Stefanov, a Facebook engineer, is the architect of the YSlow 2.0 performance
    tool and creator of the smash.it image optimization tool. He''s the author of
    JavaScript Patterns (O''Reilly), Object-Oriented JavaScript (Packt Publishing),
    The Book of Speed (online), and a contributor to High Performance JavaScript (O''Reilly).
    A Zend-certified engineer, Stoyan blogs at phpied.com and jspatterns.com.


    $14.99 CAN $15.99nISBN: 978-1-449-32019-5


