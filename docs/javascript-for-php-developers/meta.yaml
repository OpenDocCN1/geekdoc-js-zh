  - "[PAGE 127]\n\n# JSON\n\nTo wrap up the discussion of ECMAScript 5, let's take\
    \ a look at the JSON object. It's an addition to ES5 that standardizes what's\
    \ already implemented in all browsers, including IE8+. JSON stands for \"JavaScript\
    \ Object Notation\" and is a data exchange format that uses JavaScript object\
    \ and array literals to encode arbitrary data.\n\nJSON has two (unfortunately\
    \ named) methods—stringify() and parse()—which correspond to PHP's json_encode()\
    \ and json_decode();\n\n```\nJSON.stringify({hello: \"world\"}); // {'hello':\
    \ 'world'}\nJSON.parse('{\"hello\": \"world\"}').hello; // \"world\"\n```\n\n\
    In environments that don't support JSON natively, you can use the shim available\
    \ here.\n\n# Shims\n\n\"Shims,\" or \"polyfills,\" are a way to support new APIs\
    \ in older environments. Since in JavaScript you can change built-in objects and\
    \ prototypes, you can emulate the new APIs. Here's an example of a shim:\n\n```\n\
    if (!Date.now) {\n  Date.now = function () {\n    return new Date().getTime();\n\
    \  }\n}\n```\n\nor:\n\n```\n// source:\n// https://developer.mozilla.org/en-US/docs/JavaScript/Reference/\n\
    //         Global_Objects/String/Trim\nif (String.prototype.trim) {\n  String.prototype.trim\
    \ = function () {\n    return this.replace(/^\\s+|\\s+$/g, '');\n  }\n}\n```\n\
    \nAs you can see, the shims are often small, and you can load them before your\
    \ first line of code, enabling legacy browsers to handle the new and shiny features.\n\
    \nBe aware that there are some features you can't shim (e.g., strict mode and\
    \ all methods that deal with property descriptors.\n\nTo check which features\
    \ are supported among browsers, consult this site."
  - "[PAGE 128]\n\n# CHAPTER 7\nJavaScript Patterns\n\nNow that you know about JavaScript's\
    \ syntax and built-in APIs, as well as the special treatment of functions and\
    \ the existence of prototypes, let's take a look at some common JavaScript patterns.\
    \ These are not necessarily the design patterns from the Gang of Four's book (although\
    \ there are a few at the end, for good measure), but most patterns specific to\
    \ organizing your code when creating a larger application.\n\nFor example, JavaScript\
    \ doesn't have namespaces, modules, or private properties, but these are all features\
    \ that are easy to replicate.\n\nYou'll notice that most of the time, the solutions\
    \ to a lot of problems boil down to interesting uses of functions, which is why\
    \ understanding functions, closures, and scope is critical to mastering JavaScript.\n\
    \n# Private Properties\n\nIn ESS, you can use property descriptors to limit access\
    \ to certain properties, but you can't do anything like this in ES3. So how do\
    \ you create private properties that no one is allowed to touch?\n\nThe solution\
    \ is to use a closure and not expose the variables you want to keep private. These\
    \ will not be exactly private properties of an object, but they will be private\
    \ neverless.\n\nAn example of using a closure for privacy was discussed in \"\
    Immediate Functions\" on page 47. But the topic is worth reviewing and expanding.\
    \ A common pattern of using a closure to define an object is like:\n\n```\nvar\
    \ my = {function () {\n  return {\n    hi: 1,\n    bye: 2\n  }};\n```"
