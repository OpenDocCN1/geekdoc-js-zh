- md: "'s similar to PHP's array_slice().\n\nNote the difference with Array.prototype.slice(),\
    \ however, slice() takes a start index and a length (number of elements) to remove,\
    \ slice() takes start and end index:\n\n```javascript\n// PHP\n$input = array(\"\
    red\", \"green\", \"blue\", \"yellow\", \"purple\");\n$slice = array_slice($input,\
    \ 2, 2, \"orange\");\nprint_r($input); // \"red\", \"green\", \"orange\", \"purple\"\
    \nprint_r($slice); // \"blue\", \"yellow\"\n```\n\n```javascript\n// JavaScript\n\
    var input = [\"red\", \"green\", \"blue\", \"yellow\", \"purple\"];\nvar slice\
    \ = input.slice(2, 2, \"orange\");\ninput.toString(); // \"red,green,orange,purple\"\
    \nslice.toString(); // \"blue,yellow\"\n```\n\nYou can add many elements to replace\
    \ the sliced out ones, and if they are not arrays, they'll be treated as one element:\n\
    \n```javascript\nvar input = [\"red\", \"green\", \"blue\", \"yellow\", \"purple\"\
    ];\ninput.splice(2, 2, \"orange\", [\"black\", \"white\", \"grey\"]);\ninput.toString();\
    \ // \"red,green,orange,black,white,grey\"\n```\n\n## reverse()\n\nAs the names\
    \ suggests, Array.prototype.reverse() reverses the order of the array elements\
    \ (the last element comes first, etc.), similar to PHP's array_reverse():\n\n\
    - [1, 2, 3].reverse().toString(); // \"3,2,1\"\n\n## join()\n\nArray.prototype.join()\
    \ is like PHP's implode(). It returns a string of the elements of the array, delimited\
    \ by a string. The default delimiter is comma:\n\n- [5, 4, 3].join(' '); // \"\
    5 > 4 > 3\"\n[5, 4, 3].join(); // \"5,4,3\"\n// same as toString()\n[5, 4, 3].join('');\
    \ // \"543\"\n\nIn PHP, the opposite of implode() is explode(), and in JavaScript,\
    \ the opposite of Array.prototype.join() is String.prototype.split(), which you'll\
    \ see in a bit.\n\nAt this point, you're done with arrays. Let's consider regular\
    \ expressions next.\n\n# RegExp\n\nThe RegExp constructor creates regular expression\
    \ objects. It can be used with and without new. It also has an alternative syntax\
    \ that uses a regular literal:\n\n```javascript\nvar re = new RegExp('[a-z]');\
    \ // Constructor\nvar re = RegExp('[a-z]'); // Constructor without `new`\nvar\
    \ re = /[a-z]/; // Literal\n```\n\nAs you see, it is shorter and easier. You only\
    \ need to use the constructor when creating the pattern on the fly by concatenating\
    \ strings.\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_103_0.png)\n\nIn ES3, regular\
    \ expression objects defined with the literal notation are created only once during\
    \ the parsing stage:\n\n```javascript\nfunction gimme() {\n  return /[a-z]/;\n\
    }\n\nvar a = gimme();\nvar b = gimme();\na === b; // false, but true in ES3\n\
    ```\n\nYou can also specify any of the three regex modifiers:\n\n- global (g)—match\
    \ all occurrences, not just the first\n- multiline (m)\n- ignoreCase (i)\n\nYou\
    \ can set them in any order. They are all false by default:\n\n```javascript\n\
    var re = new RegExp('[a-z]', 'gmi');\nvar re = /[a-z]/ig;\n```\n\n```javascript\n\
    // test\nre.ignoreCase; // true\nre.multiline; // false\n```\n\n# test() and properties\n\
    \nAfter you've created the regex object, you can use exec() and test() to match\
    \ strings. exec() returns matches, while test() returns true/false if at least\
    \ one match was found:\n\n```javascript\nre.exec('somestring'); // Returns matches\n\
    re.test('somestring'); // Returns true/false\n```\n\nAdditional properties of\
    \ the regex object are as follows:\n\n```javascript\nre.lastIndex; // The index\
    \ of the last match\nre.source; // The pattern as a string (e.g., \"[a-z]\")\n\
    re.global; // Whether the 'g' flag was set\nre.multiline; // Whether the 'm' flag\
    \ was set\nre.ignoreCase; // Whether the 'i' flag was set\n```\n\n## exec()\n\n\
    When you use re.exec(), the return value is an array of matches plus two more\
    \ properties: input and index, which are respectively the input string to matched\
    \ and the index of the match. Let's see an example in more detail:\n\n```javascript\n\
    var re = /[a-z]+/g;\nvar result = re.exec('doodle');\nresult.join(','); // \"\
    doodle\"\n```\n\nArrays are objects, so it's OK for them to have additional properties:\
    \ numeric ones 0, 1, 2...\n\n```javascript\nresult.input; // doodle\nresult.index;\
    \ // 0\n```\n\nIf you call re.exec() again, you'll get the same result. But the\
    \ regex pattern is supposed to also match more. To get all matches, you need the\
    \ g modifier: then call re.exec() in a loop and get the next match where the match\
    \ ends.\n\n```javascript\nvar re = /[a-z]+/g;\nvar str = \"doodle\";\nwhile (match\
    \ = re.exec(str)) {\n  // something with match\n  console.log(match);\n  re.lastIndex;\
    \ // 0\n}\n```\n\nWhen re.exec() returns null, that's your signal that there are\
    \ no more matches:\n\n```javascript\nvar re = /[a-z]+/g;\nvar str = \"doodle\"\
    ;\nre.lastIndex; // 0\n\nre.exec(str); // [\"doodle\", 0]\nre.lastIndex; // 6\n\
    \nre.exec(str); // null\nre.lastIndex; // 0\n```\n\n# Function\n\nYou can use\
    \ Function constructor to create function objects:\n\n```javascript\nvar f = Function('a',\
    \ 'b', 'return a + b');\nf(4, 5); // 9\n```\n\nAs you see, this way of creating\
    \ functions is cumbersome and smells of eval(), so it should be avoided as much\
    \ as possible. Although Function() can be used wisely for some metaprogramming\
    \ tasks, for common problems you rarely need to write code as string. One use\
    \ of Function() is to replace eval() because Function() creates a local scope\
    \ and doesn't bleed variables across the evaluation.\n\n```javascript\nvar code\
    \ = \"var tmp = 1; console.log(tmp);\";\nFunction(code()); // Logs 1\ntypeof tmp;\
    \ // undefined\neval(code); // Logs 1\ntypeof tmp; // \"number\"\n```\n\nAs you\
    \ see, you omit new with Function(), too. Function() doesn't bleed variables into\
    \ the global space, but it also has nothing in its scope chain except the global\
    \ scope:\n\n```javascript\n// Global namespace\nvar globe = \"round\";\n\n(function\
    \ () {\n  var globe = \"flat\";\n\n  (new Function(\"return globe;\"))(); // \"\
    round\"\n\n  eval(\"return globe;\"); // \"flat\"\n})();\n```\n\n# Function properties\n\
    \nYou already know about all properties and methods of the function object:\n\n\
    - length: Expected number of arguments\n- name: Name of the function, not of the\
    \ ECMAScript standard\n- call(): Executes a function passing individual arguments\n\
    - apply(): Executes a function passing all arguments as an array\n\nAn example:\n\
    \n```javascript\n// Define a function\nfunction sum() {\n  var res = 0;\n  for\
    \ (var i = 0; i < arguments.length; i++) {\n    res += arguments[i];\n  }\n  return\
    \ res;\n}\n```\n\n```javascript\n// Test properties\nsum.length; // 0\nsum.name;\
    \ // \"sum\"\n```\n\n```javascript\n// Test methods\nsum.call(null, 1, 2, 3);\
    \ // 6\nsum.apply([2, 2, 2, 2]); // 8\n```\n\nThe first argument passed to call()\
    \ and apply() is the object to be assigned to this inside the body of the function.\
    \ When you don't care about this, you pass null.\n\n# String\n\nString() used\
    \ as a constructor with new string objects. String() used as a function without\
    \ new casts the argument to a primitive string. String objects are different from\
    \ primitives, but you can access properties and methods of a primitive string\
    \ (and boolean and number) as if it were an object. There is much reason to use\
    \ the new String() constructor directly:\n\n```javascript\n// Constructor, creates\
    \ string objects\nvar s = new String(\"hello\");\ntypeof s; // \"object\"\n```\n\
    \n```javascript\n// Without 'new' it creates string primitives\nvar s = String(\"\
    hello\");\ntypeof s; // \"string\"\n```\n\n```javascript\n// Best used as a primitive\n\
    var s = \"hello\";\ntypeof s; // \"string\"\n```\n\n```javascript\n// You can\
    \ call methods and properties on primitives too\nns.length; // 5\n\"hi\".length;\
    \ // 2\n```\n\n```javascript\n// You can't add properties to primitives\nvar sp\
    \ = \"primitive\";\nsp.likes_caves = true;\nsp.length; // 9\nsp.likes_caves; //\
    \ undefined\n```\n\nTable 5-1. Methods of String.prototype compared to PHP functions\n\
    \n| JavaScript | PHP | Result |\n| --- | --- | --- |\n| var s = \"JavaScript\"\
    ; | $s = \"JavaScript\"; | |\n| s.length; | echo strlen($s); | 10 |\n| s.indexOf(\"\
    a\"); | echo strpos($s, 'a'); | 1 |\n| s.lastIndexOf(\"a\"); | echo strpos($s,\
    \ 'a'); | \"3\" |\n| s.charAt(0); | echo $s[0]; | \"j\" |\n| s.charCodeAt(0);\
    \ | echo ord($s[0]); | 74 |\n| s.toLowerCase(); | echo strtolower($s); | \"javascript\"\
    \ |\n| s.toLocaleLowerCase(); | | |\n| s.toUpperCase(); | echo strupper($s); |\
    \ \"JAVASCRIPT\" |\n| s.toLocaleUpperCase(); | | |\n| s.concat(\"rul\", \"!\"\
    ); | echo $s . \"rul\" . \". . \"!\"; | \"JavaScript rul!\" |\n\n substring()\n\
    \nThere are three methods that allow you to extract a piece of a string:\n\n```javascript\n\
    var s = \"JavaScript\";\ns.slice(4, 7); // \"Scr\"\ns.substring(4, 7); // \"Scr\"\
    \ns.substr(4, 3); // \"Sc\"\n```\n\nThe first two, slice() and substring(), are\
    \ similar to PHP's substr(), only they take a start and end index as opposed to\
    \ start index and length. The nonstandard substr() in JavaScript take start and\
    \ length, so it is just like substr() in PHP."
  mdcn: "\n与 PHP 的 `array_slice()` 相似。\n\n但注意它与 `Array.prototype.slice()` 的区别：`slice()`\
    \ 接收的是起始索引和要删除的长度，而 `splice()` 接收的是起始索引和结束索引：\n\n```javascript\n// PHP\n$input\
    \ = array(\"red\", \"green\", \"blue\", \"yellow\", \"purple\");\n$slice = array_slice($input,\
    \ 2, 2, \"orange\");\nprint_r($input); // \"red\", \"green\", \"orange\", \"purple\"\
    \nprint_r($slice); // \"blue\", \"yellow\"\n```\n\n```javascript\n// JavaScript\n\
    var input = [\"red\", \"green\", \"blue\", \"yellow\", \"purple\"];\nvar slice\
    \ = input.slice(2, 2, \"orange\");\ninput.toString(); // \"red,green,orange,purple\"\
    \nslice.toString(); // \"blue,yellow\"\n```\n\n你可以添加许多元素来替换切掉的元素，如果它们不是数组，它们将被视为一个元素：\n\
    \n```javascript\nvar input = [\"red\", \"green\", \"blue\", \"yellow\", \"purple\"\
    ];\ninput.splice(2, 2, \"orange\", [\"black\", \"white\", \"grey\"]);\ninput.toString();\
    \ // \"red,green,orange,black,white,grey\"\n```\n\n## reverse()\n\n顾名其实，`Array.prototype.reverse()`\
    \ 会反转数组元素的顺序（最后一个元素在前，以此类推），与 PHP 的 `array_reverse()` 类似：\n\n- [1, 2, 3].reverse().toString();\
    \ // \"3,2,1\"\n\n## join()\n\n`Array.prototype.join()` 类似于 PHP 的 `implode()`。它返回一个由数组元素组成的字符串，并用字符串分隔。默认分隔符是逗号：\n\
    \n- [5, 4, 3].join(' '); // \"5 > 4 > 3\"\n[5, 4, 3].join(); // \"5,4,3\"\n//\
    \ 等于 toString()\n[5, 4, 3].join(''); // \"543\"\n\n在 PHP 中，`implode()` 的反向是 `explode()`，而在\
    \ JavaScript 中，`Array.prototype.join()` 的反向是 `String.prototype.split()`，你稍后就会看到。\n\
    \n到这里，你已经完成了数组部分。让我们接下来考虑正则表达式。\n\n# RegExp\n\n`RegExp` 构造函数用于创建正则表达式对象。它可以带 `new`\
    \ 使用也可以不带。它还存在一种使用正则表达式字面量的替代语法：\n\n```javascript\nvar re = new RegExp('[a-z]');\
    \ // 构造函数\nvar re = RegExp('[a-z]'); // 不带 `new` 的构造函数\nvar re = /[a-z]/; // 字面量\n\
    ```\n\n如你所见，这样更短更简单。只有当你通过拼接字符串动态创建模式时，才需要使用构造函数。\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_103_0.png)\n\
    \n在 ES3 中，用字面量符号定义的正则表达式对象只会在解析阶段创建一次：\n\n```javascript\nfunction gimme() {\n\
    \  return /[a-z]/;\n}\n\nvar a = gimme();\nvar b = gimme();\na === b; // false，但在\
    \ ES3 中为 true\n```\n\n你还可以指定三个正则修饰符之一：\n\n- global (g)—匹配所有出现情况，而不只是第一个\n- multiline\
    \ (m)—多行模式\n- ignoreCase (i)—忽略大小写\n\n你可以以任何顺序设置它们。它们默认都是 false：\n\n```javascript\n\
    var re = new RegExp('[a-z]', 'gmi');\nvar re = /[a-z]/ig;\n```\n\n```javascript\n\
    // test\nre.ignoreCase; // true\nre.multiline; // false\n```\n\n# test() 和属性\n\
    \n创建正则对象后，你可以使用 `exec()` 和 `test()` 来匹配字符串。`exec()` 返回匹配项，而 `test()` 在至少找到一个匹配项时返回\
    \ true/false：\n\n```javascript\nre.exec('somestring'); // 返回匹配项\nre.test('somestring');\
    \ // 返回 true/false\n```\n\n正则对象的其他属性如下：\n\n```javascript\nre.lastIndex; // 上一次匹配的索引\n\
    re.source; // 字符串形式的模式（例如 \"[a-z]\"）\nre.global; // 是否设置了 'g' 标记\nre.multiline;\
    \ // 是否设置了 'm' 标记\nre.ignoreCase; // 是否设置了 'i' 标记\n```\n\n## exec()\n\n当你使用 `re.exec()`\
    \ 时，返回值是一个匹配项数组加上另外两个属性：`input` 和 `index`，它们分别是匹配的输入字符串和匹配的索引。让我们详细查看一个示例：\n\n\
    ```javascript\nvar re = /[a-z]+/g;\nvar result = re.exec('doodle');\nresult.join(',');\
    \ // \"doodle\"\n```\n\n数组是对象，所以它们拥有额外的属性是可以的：数字属性 0, 1, 2...\n\n```javascript\n\
