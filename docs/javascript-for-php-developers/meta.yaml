  md: "# CHAPTER 4\n\n# Object-Oriented Programming\n\nThis chapter discusses the\
    \ object-oriented features of JavaScript, including objects, constructor functions,\
    \ and prototypes. It also talks about code reuse and inheritance.\n\n# Constructors\
    \ and Classes\n\nIn PHP, if you have a Dog class, you create a `$fido` instance\
    \ of this class using:\n\n```\n// PHP\n$fido = new Dog();\n```\n\nJavaScript has\
    \ a similar syntax:\n\n```\n// JavaScript\nvar fido = new Dog();\n```\n\nOne important\
    \ difference is that Dog is not a class in JavaScript because there are no classes\
    \ in the language. Dog is just a function. But functions that are meant to create\
    \ objects are called constructor functions.\n\nSyntactically, there is no difference\
    \ between a regular function and a constructor function. The difference is in\
    \ the intent. Thus, for readability purposes, it's a common convention to capitalize\
    \ the first letter in constructor function names.\n\nWhen you call a function\
    \ with the new operator, it always returns an object. The object is known as `this`\
    \ inside the body of the function. That's what happens even if you don't do anything\
    \ special in the function. Remember that otherwise (when called without new) every\
    \ function without an explicit return returns undefined:\n\n```\nfunction Dog()\
    \ {\n  this.name = \"Fido\";\n  this.sayName = function () {\n    return \"Woof!\
    \ \" + this.name;\n  }\n```"
