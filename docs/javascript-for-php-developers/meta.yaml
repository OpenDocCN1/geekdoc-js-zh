  md: "# JSON\n\nTo wrap up the discussion of ECMAScript 5, let's take a look at the\
    \ JSON object. It's an addition to ES5 that standardizes what's already implemented\
    \ in all browsers, including IE8+. JSON stands for \"JavaScript Object Notation\"\
    \ and is a data exchange format that uses JavaScript object and array literals\
    \ to encode arbitrary data.\n\nJSON has two (unfortunately named) methods—stringify()\
    \ and parse()—which correspond to PHP's json_encode() and json_decode();\n\n```\n\
    JSON.stringify({hello: \"world\"}); // {'hello': 'world'}\nJSON.parse('{\"hello\"\
    : \"world\"}').hello; // \"world\"\n```\n\nIn environments that don't support\
    \ JSON natively, you can use the shim available here.\n\n# Shims\n\n\"Shims,\"\
    \ or \"polyfills,\" are a way to support new APIs in older environments. Since\
    \ in JavaScript you can change built-in objects and prototypes, you can emulate\
    \ the new APIs. Here's an example of a shim:\n\n```\nif (!Date.now) {\n  Date.now\
    \ = function () {\n    return new Date().getTime();\n  }\n}\n```\n\nor:\n\n```\n\
    // source:\n// https://developer.mozilla.org/en-US/docs/JavaScript/Reference/\n\
    //         Global_Objects/String/Trim\nif (String.prototype.trim) {\n  String.prototype.trim\
    \ = function () {\n    return this.replace(/^\\s+|\\s+$/g, '');\n  }\n}\n```\n\
    \nAs you can see, the shims are often small, and you can load them before your\
    \ first line of code, enabling legacy browsers to handle the new and shiny features.\n\
    \nBe aware that there are some features you can't shim (e.g., strict mode and\
    \ all methods that deal with property descriptors.\n\nTo check which features\
    \ are supported among browsers, consult this site."
