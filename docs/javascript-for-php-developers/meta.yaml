  mdcn: "\n```javascript\nvar global_ten = 10;\n\nfunction papa() {\n  var hunred_more\
    \ = 100;\n  var sum = function (a, b) {\n    return a + b + global_ten + hunred_more;\n\
    \  }\n  return sum(9, 11);\n}\n\npapa(); // 130\n```\n\n从第 1 行（程序代码）开始，解释器有一个隐藏的\
    \ `__variables` 对象，其中包含了所有的变量（例如 `global_ten` 和 `papa`）。\n\n由于其中一个是一个函数，它需要一个\
    \ `__scope` 属性。`papa.__scope` 指向 `global__variables`。\n\n如果解释器需要查找变量的值，查找过程非常简单，因为只有一个地方可以查找：\n\
    \n[global__variables] global_ten, papa\n\n接下来，解释器运行到了第 11 行。它进入函数 `papa()` 并发现自己处于第\
    \ 4 行。它创建了另一个 `__variables` 对象，其中包含 `hunred_more` 和 `sum`。现在明白为什么需要它：解释器需要找到分散在函数体中的所有变量，并将它们方便地保存在一起。移动到第\
    \ 5 行，发现 `sum` 也是一个函数，所以它需要一个 `__scope` 属性。现在 `sum.__scope` 指向 `papa()variables`，正如\
    \ `sum(which)` 在词法上定义的那样。作用域的链表（链）变为：\n\nsum.__scope -> papa's __variables ->\
    \ global __variables\n\n现在，如果解释器需要查找变量，它会在 `papa()` 的本地 `__variables` 中查找。如果没有找到该变量，解释器将发现这样一个序列：“好的，我在函数\
    \ `papa()` 内部，没有这个名字的局部变量。让我看看 `papa.__scope` 指向哪里。噢，看哪，另一个 `__variables` 东西儿，里面装满了变量；我最好检查一下里面有什么！”\n\
    \n[papa() local __variables] hunred_more, sum\n[global __variables] global_ten,\
    \ papa\n\n接下来，在第 6 行，代码调用了 `sum`，因此解释器进入了这个函数并发现处于第 6 行。它又创建了一个包含 `a` 和 `b` 的\
    \ `__variables` 对象。这些变量没有用 `var` 声明，而是通过作为函数的形式参数而声明。\n\n原来的局部作用域现在变成了一个闭包，因为现在有了另一个直接局部作用域：\n\
    \n```\nsum(1) local __variables__ a, b\n[papa() closure __variables__ hundred_more,\
    \ sum\n[global __variables] global_ten, papa\n```\n\n当解释器必须对第 6 行执行算术运算时，它开始寻找值来替换变量。你可以想象解释器在进行如下思考：\n\
    \n```\n// 在 [local] 作用域中找到了，没问题。\nb // 也在 [local] 作用域中，太棒了。\nglobal_ten // 嗯，不在\
    \ [local] 中，让我深入挖掘。\n// sum() 的 _scope 是什么？我明白了，是一个 [closure]！\n// 额，[closure]\
    \ 里也没有，继续吧。\n// [closure] 是 papa()__variables 对象。那么 papa.__scope 是什么？\n// 它是 [global__variables__]。\n\
    // 我在 [global] 作用域中找到了 'global_ten'，真棒！\n// 这是最后一次机会，否则我将\n// 必须抛出一个错误。\n```\n\
    \nhundred_more // 不在 [local] 中，但在 [closure] 中找到了，正常。\n\n你现在看到链（作用域链）是如何以链表的形式创建的，每个函数都知道它的词法\
    \ `__scope__`。当解释器需要变量但在本地没有找到时，它开始顺着链接的作用域链查找该变量。\n\n# WebKit 控制台中的作用域链\n\n在\
    \ WebKit 控制台中调试（无论是在 Chrome 还是 Safari 中），你可以查看作用域对象以及它们包含的内容。我创建了一个 HTML 文件供你练习。方法如下：\n\
    \n- 1. 在 WebKit 浏览器中加载该文件。\n- 2. 在任意地方点击右键并选择“检查元素”调出 Web 检查器。\n- 3. 点击 Scripts\
    \ 标签页。\n- 4. 点击第 8 行和第 21 行设置断点。\n\n你会看到类似于图 3-1 所示的内容。\n\n```html\n<script>\n\
    var global_ten = 10;\n\nfunction papa1() {\n  var hundred_more = 100;\n  var sum\
    \ = function(a, b) {\n    return a + b + global_ten + hundred_more;\n  };\n  return\
    \ sum(0, 11);\n}\n\npapa2();\n\nfunction papa2() {\n  var hundred_more = 100;\n\
    \  function innerSum() {\n    var sum = function(a, b) {\n      return a + b +\
    \ global_ten + hundred_more;\n    };\n    return sum(0, 11);\n  }\n}\npapa2();\n\
    </script>\n```\n\n图 3-1. Web 检查器中的断点\n\n现在刷新页面，你会看到代码执行停止在第 8 行。查看右侧菜单中的 Scope\
    \ Variables 部分。你会清晰地看到由 Global（全局）、Closure（闭包）和 Local（局部）部分组成的链，以及内部可用的变量（图 3-2）。\n\
    \n```html\nscope.html\n<script>\nvar global_ten = 10;\n\nfunction papa1 {\nvar\
    \ hundred_more = 100;\n\nfunction papa2 {\nvar hundred_more = 100;\nfunction innerSum\
    \ {\nvar sum = function(a, b) {\nreturn a + b + global_ten + hundred_more;\n};\n\
