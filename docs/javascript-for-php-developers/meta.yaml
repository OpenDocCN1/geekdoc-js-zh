  - '[PAGE 18]


    User Interface Library. These libraries take the pain out of development by providing
    an API layer that abstracts the differences in the browser implementations of
    DOM and BOM—sometimes ECMAScript itself.


    The scope of this book is ECMAScript, the language itself. DOM is something you''re
    probably already familiar with PHP, and BOM is not really interesting (it''s just
    a collection of global variables and functions), you can always use a library
    to abstract the DOM and BOM. This book is independent of any particular JavaScript
    library, allowing you to focus on the core language and pick a library of your
    choice when you need one.


    The book uses the term JavaScript to mean ECMAScript because "ECMAScript" is uncommon
    and just plain awkward. The focus is on the most popular version of the language,
    ECMAScript 3 (ES3). The standards body skipped 4 and the latest version at the
    time of this book''s publication is ECMAScript 5.1, which is also referred to
    as ESS. Although ESS is already available you cannot rely on it if you want to
    support older browsers, as Internet Explorer before version 9. Chapter 6 details
    what''s new and different in ES5, and will help you to decide or not to use it.
    It works in old browsers via a "shim," or "polyfill," as you''ll see in "Shims"
    on page 112.


    # The Language


    Once you strip out all the DOM/BOM browser hell, what you have left is JavaScript—a
    beautiful, small language with a familiar C-like syntax and just a handful of
    built-in objects.


    It''s a popular language that''s practically everywhere: on the client, server,
    mobile phones, desktop, and shell. Even inside PHP you can embed JavaScript using
    the PHP class. It''s actually harder to find an environment where you cannot run
    JavaScript, which means you can learn one language and use it everywhere.


    It''s also an odd language when you approach it from the perspective of a PHP
    developer. Here are some things to be aware of on and look for as you progress
    through this book:",


    +   - Functions in JavaScript objects. Arrays and regular expressions are objects,
    too.

    - Functions provide scope, and local variable scope is achieved by wrapping the
    code in a function.

    - Closures are used heavily. Although closures have existed in PHP since version
    5.3, they are not commonly used in PHP. In JavaScript, they are everywhere.

    - Prototypes are an important concept in JavaScript for which there is no equivalent
    in PHP. It''s one of the ways JavaScript accomplishes code reuse and inheritance.'
