  md: 'Object(), Array(), RegExp(), and Function()

    These are rarely used to create objects, because they have shorter syntax versions.
    However, their prototypes are full of useful properties, no matter how you create
    the object.


    String(), Number(), and Boolean()

    These are also used directly to create objects, because they are just wrappers
    around primitive types. In JavaScript, you can jump easily between the primitive
    type and its object wrapper, and you can call methods directly on the primitive.


    Date()

    Has tons of methods to work with dates.


    Error()

    Creates error objects. Error objects are simple and you can opt in throwing your
    own error objects and forget all about the Error() constructor. Error() is generic,
    there are also more specific error constructors (e.g., SyntaxError(), ReferenceError()),
    etc.


    There are two more global objects worth mentioning:

    Math

    This is not a constructor (so you cannot do var m = new Math()); but is a global
    object where you can find a number of math-related properties and methods. For
    example:


    ```

    Math.min(3, 5); // 3

    Math.E; // 2.718281828459045

    ```


    JSON

    This is not a constructor either, but is rather an object that holds methods for
    encoding/decoding strings. It''s a new addition to ECMAScript 5, and you''ll read
    more about it in Chapter 6.


    Let''s examine all these constructors in more detail.


    # Object


    The Object constructor creates objects like so:


    ```

    var o = new Object();

    ```


    This is equivalent to the object literal notation:

    var o = {};nGiven that the literal is shorter, there''s no reason to use the constructor
    directly.'
