    \ = ['a', 'b', 'c'];\nvar out = input.map(entity);\nout; // [\"#97\", \"#98\"\
    , \"#99\"];\n```\n\nArray.prototype.reduce() takes an array and returns it to\
    \ a single value, using a callback function.\n\nSay you want to sum all numbers\
    \ in an array and add 100 to the result. So you would start with 100 and iteratively\
    \ add the next value to the running sum:\n\n```javascript\nfunction sum(running_sum,\
    \ value, index, array) {\n  console.log(arguments);\n  return running_sum + value;\n\
    }\n```\n\n```javascript\n[1, 2, 3].reduce(sum, 100); // 106\n```\n\nDuring the\
    \ iteration, you'll see in the console:\n\n```javascript\n[100, 1, 0, Array[3]]\n\
    [101, 2, 1, Array[3]]\n[103, 3, 2, Array[3]]\n```\n\nArray.prototype.reduceRight()\
    \ is the same, only loops the array elements from right to left, meaning it starts\
