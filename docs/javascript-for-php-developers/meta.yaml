  md: '+   - You add properties to a special exports object. Anything you add to exports
    becomes your module''s publicly accessible API.


    # Using a CommonJS Module


    How do you use this module from your program or from another module? In NodeJS,
    the filename of the module serves as a module identifier. So if you save the definition
    from the previous snippet in a file named hi.js, you can then use it like so:


    ```

    var hi = require("./hi.js");

    hi.sayHi(); // "hi"

    ```


    As you can see, the other CommonJS magic (in addition to exports) is the function
    called require(). It takes a module identifier, finds and evaluates the required
    module, and returns the exports object from that module (Figure 7-1).


    ![](img/7167a987f8e0f5a6179bb61bf22fe204_140_0.png)


    Figure 7-1. Defining and using a CommonJS module in NodeJS console


    Depending on the environment, you may be able to specify the module identifier
    in a different manner (e.g., in NodeJS, the .js is optional). In others, the module
    identifier may just be a string, not a file path. When define your module with
    exports, you have the object module as well, and you can specify a module.id to
    identify the module.'
