  md: "![](img/7167a987f8e0f5a6179bb61bf22fe204_58_0.png)\n\n# # Retaining the Scope\n\
    \nAs you know, local functions have access to the scope of the environment where\
    \ they were defined. When the execution moves out of a local function such as\
    \ inner Sum() or sum(), the local scope of this function (its __variables object)\
    \ is no longer available and can be destroyed and garbage collected unless there's\
    \ someone who still needs it. This is interesting, and is as powerful as it is\
    \ error prone.\n\nLet's say sum() wasn't a local function, but a global one: It\
    \ is still defined in the global environment, the variable sum was declared in\
    \ the global scope:\n\n```\nvar global_ten = 10;\nvar sum;\n\nfunction papa()\
    \ {\n  var hundred_more = 100;\n  sum = function (a, b) {\n    return a + b +\
    \ global_ten + hundred_more;\n  };\n  return sum(9, 11);\n}\n\npapa(); // 130\n\
    ```\n\nScope Chain | 43"
