    \ access the properties of an object, use the dot notation:\n\n```javascript\n\
    assoc.one; // 1\n```\n\nAlternatively, use the square bracket notation, which\
    \ looks more like an array in PHP:\n\n```javascript\nassoc[\"one\"] // 1\n```\n\
    \n## Conditions\n\nThe if syntax is equivalent to the one in PHP:\n\n```javascript\n\
    var a, b;\nif (a === \"hello\") {\n}\n```\n\nThe if syntax is equivalent to the\
    \ one in PHP:\n\n```javascript\nvar a, b;\nif (a === \"hello\") {\n  // ...\n\
    } else if (a === \"world\") {\n  // ...\n} else {\n  // ...\n}\n```\n\nWait-if-else\
    \ structures:\n\n```javascript\nvar a, b;\nif (a === \"hello\") {\n  // ...\n\
    } else if (a === \"world\") {\n  // ...\n} else {\n  // ...\n}\n```\n\nThe if\
    \ syntax is equivalent to the one in PHP:\n\n```javascript\nvar a, b;\nif (a ===\
    \ \"hello\") {\n  // ...\n} else if (a === \"world\") {\n  // ...\n} else {\n\
    \  // ...\n}\n```\n\nThe if syntax is equivalent to the one in PHP:\n\n```javascript\n\
    var a, b;\nif (a === \"hello\") {\n  // ...\n} else if (a === \"world\") {\n \
