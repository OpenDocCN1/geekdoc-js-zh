  - '[PAGE 90]


    # Numbers


    The four number-related functions are the following:


    ```

    isNaN()

    Tells you if the argument is the NaN value. PHP has is_nan().

    ```


    ```

    isFinite()

    Tells you if the argument is not the Infinity value. PHP has similar to is_finite().

    ```


    ```

    parseInt()

    Takes a string and returns an integer value, similar to intval() in PHP.

    ```


    ```

    parseFloat()

    Parses strings as floats, like PHP''s floatval().

    ```


    You use is() to determine if the result of an arithmetic operation was successful,
    because the NaN value doesn''t compare to anything, including itself:


    ```

    NaN === NaN; // false

    1 * ''two'' === NaN; // false

    isNaN(1 * ''two''); // true

    ```


    parseInt() takes an argument and a second argument, which specifies how you want
    the string to be parsed. You can always pass 10 to make sure your input is treated
    as a decimal; otherwise, the interpreter will guess:


    ```

    parseInt(''08''); // 8

    parseInt(''08''); // 0

    parseInt(''08'', 10); // 8

    ```


    > In strict mode, ES5 parseInt(''08'') returns 8.


    ![](img/7167a987f8e0f5a6179bb61bf22fe204_90_0.png)


    Let''s see another example of using parseInt(). Say you want to convert hexadecimal
    colors to rgb:


    ```

    var red = ''#ff0000'', r, g, b;

    r = red[1] + red[2]; // "ff"

    g = red[3] + red[4]; // "00"

    b = red[5] + red[6]; // "00"

    r = parseInt(r, 16); // Parse as hexadecimal

    g = parseInt(g, 16); // hex

    b = parseInt(b, 16); // hex


    "rgb(" + r + ", " + g + ", " + b + ")"; // "rgb(255, 0, 0)"

    ```'
