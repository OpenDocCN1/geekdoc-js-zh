    # 第 3 章\n函数\n\n函数是 JavaScript 中的一个重要主题，因为该语言有许多用处。在最基础的形式中，它们看起来像 PHP 函数：\n\n\
    ```javascript\n// 基础形式均有效\nfunction sum($a, $b) {\n    return $a + $b;\n}\n\n\
    sum(3, 5); // 8\n```\n\n# 默认参数\n\n目前没有语法允许你为函数参数设置默认值（像在 PHP 中经常做的那样）。这计划在 ECMAScript\
    \ 的未来版本中实现，但目前你必须在函数体内部自己处理。假设你想让第二个参数默认为 2：\n\n```javascript\n// PHP\nfunction\
    \ sum($a, $b = 2) {\n    return $a + $b;\n}\n\n// JavaScript\nfunction sum(a,\
    \ b) {\n    b = b || 2;\n    // 有时也写成\n    // b || (b = 2)\n    return a + b;\n\
    }\n```\n\n这种短语法在很多情况下运行良好，但在这种情况下有点天真，因为 `b || 2` 是一个松散比较。如果你传递 `0` 作为参数，比较将求为\
    \ `false` 且 `b` 将变成 `2`：\n\n```javascript\nsum(3); // 5\nsum(3, 0); // 5，不是你预期的结果\n\
    ```\n\n较长的版本是使用 `typeof`：\n\n```javascript\nfunction sum(a, b) {\n  b = typeof\
    \ b === \"undefined\" ? 2 : b;\n  return a + b;\n}\nsum(3, 0); // 3\nsum(3); //\
    \ 5\n```\n\n# 任意数量的参数\n\n不必传递函数期望的所有参数，JavaScript 不会报错。换句话说，没有强制参数。如果你需要让某个参数变为必填，你需要在函数体内部强制执行。\n\
    \n你也可以传递比函数期望的更多的参数，这些参数会被愉快地忽略而不产生任何错误：\n\n```javascript\nsum(); // NaN (不是数字)\n\
    sum(1, 2); // 3\nsum(1, 2, 100, 999); // 3\n```\n\n你可以准备接收任意数量的参数并优雅地处理这种情况情况。在\
    \ PHP 中，你可以使用 `func_get_args()`，它返回一个传递给函数的参数数组。在 JavaScript 中，你使用 `arguments`\
    \ 类数组对象。它是函数体内部可用的一个对象。它被称为“类数组”，是因为它的属性从索引 0 开始枚举，而且它也像数组一样有一个 `length` 属性：\n\
    \n```javascript\nfunction sum(/* 这里什么都没有 */) {\n  for (var i = 0, result = 0;\
    \ i < arguments.length; i++) {\n    result += arguments[i];\n  }\n  return result;\n\
    }\n```\n\n```javascript\nsum(); // 0\nsum(111); // 111\nsum(1, 2); // 3\nsum(1,\
    \ 2, 3); // 6\nsum(1, 10, 2, 9, 38); // 33\n```\n\n记住，尽管 `arguments` 看起来像数组，但它实际上是一个对象，并且没有像\
    \ `push()`、`pop()` 等方法。不过，你可以轻松地将这个类数组对象转换为数组。准备好掌握稍后详细解释的新内容吧：\n\n```javascript\n\
    function sum() {\n  var args = Array.prototype.slice.call(arguments);\n  typeof\
    \ args.push; // \"undefined\"\n  typeof args.push; // \"function\"\n}\nsum();\n\
    ```\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_44_0.png)\n\n`typeof` 运算符在与函数配合时返回字符串\
    \ `\"function\"`。\n\n# arguments.length 技巧\n\n处理可选参数的一种聪明方法是 JavaScript 使用 `arguments`\
    \ 对象所建议的方法：\n\n```javascript\n// 这里你有一个所有默认参数的函数，就像 PHP 的声明一样：\n// function sum($a\
    \ = 1, $b = 2, $c = 3, $d = 4)\nfunction sum(a, b, c, d) {\n  // 注意：没有 'break'\n\
