    , \"We\", \"Th\", \"Fr\", \"Sa\", \"Js\"]\n```\n\nA way to protect the array is\
    \ not to return it directly, but to return a copy of it. Using the fact that slice\
    \ will return a new array, you can use it as a general copy-making tool:"
