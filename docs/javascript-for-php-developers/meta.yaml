    # Learning Environment


    ((("environment"To keep things simple, JavaScript doesn''t have a concept of input
    and output. I/O is provided by the environment that JavaScript runs in. The most
    common environment is the web browser, where the responsibility for a user interface
    falls to HTML. You don''t need all to study the language, so let''s use the I/O
    provided by a JavaScript console.


    A console lets you quickly type pieces of code and see them run, just like the
    interactive PHP shell you invoke on the command line:


    ```

    $ php -a

    Interactive shell


    php > echo "hi";nh1

    ```


    There are many JavaScript consoles to pick from and use for studying. The most
    accessible consoles are those provided by browsers.


    # Browsers


    In a desktop WebKit browser (e.g., Chrome or Safari), simply load a page, right-click
    anywhere, and select "Inspect element" from the menu. This brings up the Web Inspector.
    Click the Console and you''re ready to go (Figure 1-2).


    In newer Firefox versions, you get to a console by going to the Menu Bar and selecting
    Tools→Web Developer→Web Console. Alternatively, you can also install the Firebug
    extension, which works in any Firefox version.


    Internet Explorer (since IE8) F12 Developer Tools with a console under the Script
    tab.'
