  - "[PAGE 58]\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_58_0.png)\n\n# # Retaining\
    \ the Scope\n\nAs you know, local functions have access to the scope of the environment\
    \ where they were defined. When the execution moves out of a local function such\
    \ as inner Sum() or sum(), the local scope of this function (its __variables object)\
    \ is no longer available and can be destroyed and garbage collected unless there's\
    \ someone who still needs it. This is interesting, and is as powerful as it is\
    \ error prone.\n\nLet's say sum() wasn't a local function, but a global one: It\
    \ is still defined in the global environment, the variable sum was declared in\
    \ the global scope:\n\n```\nvar global_ten = 10;\nvar sum;\n\nfunction papa()\
    \ {\n  var hundred_more = 100;\n  sum = function (a, b) {\n    return a + b +\
    \ global_ten + hundred_more;\n  };\n  return sum(9, 11);\n}\n\npapa(); // 130\n\
    ```\n\nScope Chain | 43"
  - "[PAGE 59]\n\nNow after papa() was called, you have a brand new sum() function\
    \ available to call from the global scope. When you call sum(), it has access\
    \ to all global variables as global_ten (without special syntax as PHP's \\$GLOBAL).\
    \ But it also, maybe sur-prisingly, has access to hundred_more and can see its\
    \ value:\n\n```\nsum(9, 11); // 130\n```\n\nWhat happened after papa() returns,\
    \ what happens to its local scope? In the previous example, when sum() was local,\
    \ the local scope is just released, as no one needs it. When sum() is global and\
    \ defined in papa, then sum__scope refers to the local scope of papa(). This scope\
    \ needs to be retained for future use and cannot be destroyed. sum__scope holds\
    \ a reference to it.\n\nThis is important to understand and keep in mind JavaScript\
    \ closures (functions): they retain the referencing environment, which is the\
    \ environment where they were defined in is also the lexical environment.\n\n\
    The function papa() also retains its referencing environment, but it happens to\
    \ be the global scope, which is always around anyway.\n\n# Retaining References,\
    \ Not Values\n\nIt's important to understand that only references to the environment\
    \ are retained, not specific values. Let's see an example:\n\n```\nvar global_ten\
    \ = 10;\nvar sum;\n\nfunction papa() {\n  var hundred_more = 100;\n  sum = function\
    \ (a, b) {\n    return a + b + global_ten + hundred_more;\n  };\n  hundred_more\
    \ = 100000; // This is different from the previous example\n}\n\npapa();\n// No\
    \ explicit return value this time\nsum(9, 11); // 100030\n```\n\nAt the time sum()\
    \ was defined, hundred_more had the value 100000, but later, it became 100000.\
    \ At the time papa() returns, its local scope was updated with the new 100000\
    \ value. This is the scope that sum() has access to. sum() will see the latest\
    \ state of the referencing environment.\n\nNote the difference with PHP when you\
    \ \"localize\" a variable with use:\n\n```\n$hundred_more = 100;\n$sum = function\
    \ ($a, $b) use ($hundred_more) {\n```"
- md: "javascript\nreturn $a + $b + $hundred_more;\n}\n$hundred_more = 100000;\necho\
    \ $sum(0, 0); // 100\n```\n\nThe same thing in JavaScript returns 100,000 because\
    \ the reference to hundred_more would be retained, not its value:\n\n```javascript\n\
    var hundred_more = 100;\nvar sum = function (a, b) {\n  return a + b + hundred_more;\n\
    }\nhundred_more = 100000;\nsum(0, 0); // 100000\n```\n\n# Closures in a Loop\n\
    \nLet's see another example where this becomes even more obvious. Let's define\
    \ an array of functions:\n\n```javascript\nvar fns = [];\n\nfunction definer()\
    \ {\n  for (var i = 0; i < 5; i++) {\n    fns.push(function () {\n      return\
    \ i;\n    });\n  }\n}\n\ndefiner();\n```\n\nHere you loop from 0 to 4, defining\
    \ five functions. You can call these functions like so:\n\n```javascript\nfns[0]();\n\
    fns[1]();\nfns[2]();\nfns[3]();\nfns[4]();\n```\n\nIf you haven't read the previous\
    \ section, you might naively think that each of these function calls returns the\
    \ value of i at the time of function definition. But all the five functions were\
    \ defined in the same environment and have access to the same local scope.\n\n\
    When definer() returns, i has the value 5, not 4, because at the last iteration\
    \ there was one final i++. This is the value that exists in the retained environment,\
    \ and all five functions see it. So\n\n```javascript\nfns[0](); // 5\nfns[1]();\
    \ // 5\nfns[2](); // 5\nfns[3](); // 5\nfns[4](); // 5\n```\n\nAnd what if you\
    \ do all functions to return an incremented value? You use another closure to\
    \ \"localize\" the value of i into a local_i:\n\n```javascript\nvar fns = [];\n\
    \nfunction definer() {\n  for (var i = 0; i < 5; i++) {\n    fns.push(function\
    \ (local_i) {\n      return function () {\n        return local_i;\n      };\n\
    \    })(i);\n  }\n}\n\ndefiner();\n```\n\nAnother object was introduced here.\
    \ In this new scope, there's a local variable local_i. It initialized with the\
    \ current value of i and retained. In fact, each of the five functions has its\
    \ own environment, different from the other four.\n\nThis is now more like what\
    \ you'd expect:\n\n```javascript\nfns[0](); // 0\nfns[1](); // 1\nfns[2](); //\
    \ 2\nfns[3](); // 3\nfns[4](); // 4\n```\n\nHow about a small improvement: simplifying\
    \ the loop inside definer()? You can introduce a little binder(i) function that\
    \ returns a new function with the local i value:\n\n```javascript\nvar fns = [];\n\
    \nfunction binder(i) {\n  return function () {\n    return i;\n  };\n}\n\nfunction\
    \ definer() {\n  for (var i = 0; i < 5; i++) {\n    fns.push(binder(i));\n  }\n\
    }\n\ndefiner();\n\n// Test\nfns[0](); // 0\nfns[1](); // 1\nfns[2](); // 2\nfns[3]();\
    \ // 3\nfns[4](); // 4\n```\n\n# Exercise: onclick\n\nLet's see a practical example\
    \ that demonstrates the same idea that referencing environment variables are retained\
    \ by reference, not values.\n\nSay you have three buttons on an HTML page with\
    \ incrementing ID attributes:\n\n```html\n<button id=\"button-1\">one</button>\n\
    <button id=\"button-2\">two</button>\n<button id=\"button-3\">three</button>\n\
    ```\n\nThen you assign click handlers in a loop:\n\n```html\n<script>\nfor (var\
    \ i = 1; i <= 3; i++) {\n  document.getElementById('button-' + i).onclick = function\
    \ () {\n    alert(\"This is button: \" + i);\n  }\n}\n</script>\n```\n\nAgain,\
    \ this code may look like it should work fine, but any button you always gives\
    \ you:\n\n> \"This is button: 4\"\n\nYou can play with the example online. As\
    \ an exercise, think about how to modify the loop so the three buttons return\
    \ respectively:\n\n- This is button: 1\n- This is button: 2\n- This is button:\
    \ 3\n\n# Immediate Functions\n\nIn the definer() function, a bit of new syntax\
    \ wasn't mentioned previously was introduced: the trailing (). It instructs the\
    \ interpreter to take the function that was just defined and execute immediately:\n\
    \n```javascript\nvar immediate_one = function () {\n  return 1;\n};\nimmediate_one();\
    \ // 1\n```\n\nHow about this syntax?\n\nThis is not valid syntax because myfunc()\
    \ was defined using the function declaration, not the function expression. The\
    \ difference sometimes may be noticeable unless you take into account where the\
