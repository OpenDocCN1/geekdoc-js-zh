    # Own Properties


    In JavaScript, there is a distinction between properties owned by an object and
    properties that are inherited from a prototype object. The syntax for accessing
    either of those is the same, but sometimes you need to know if a property belongs
    to your object or it comes from somewhere else.


    Own properties are added to an object using the object literal notation or via
    an assignment:


    ```

    var literal = {

    mine: "I pown you"

    };


    literal.mine; // "I pown you"


    var assigned = {};nassigned.mine = "I pown you";

    ```


