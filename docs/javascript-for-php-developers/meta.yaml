    \n- Some exceptions of the blanket statement \"there’s no block scope\":\n  -\
    \ Block scope is planned for the next version of ECMAScript by using let instead\
    \ of var\n  - The error object in a catch block is scoped to its block:\n\n```javascript\n\
    try {\n  throw new Error(\"Yuck!\");\n} catch (err) {\n  err.message; // \"Yuck!\"\
    \n}\ntypeof err; // \"undefined\"\n```\n\n# Hoisting\n\nWhen the program execution\
    \ enters a new scope (e.g., in a new function, the global scope, or eval()), all\
    \ the variables defined anywhere in the function are moved, or hoisted to the\
    \ top of the scope. This is something to be aware of, as it can be a little confusing:\n\
    \n```javascript\nvar a = 1;\nfunction hoistingTest() {\n  console.log(a);\n  var\
    \ a = 2;\n  console.log(a);\n}\n```\n\nhoistingTest(); // Logs \"undefined\",\
    \ then 2\n\nYou might expect that the first console.log() would see the global\
    \ value of 1. But instead, you get undefined because the declaration of the local\
    \ a was hoisted to the top. Only the declaration was hoisted, but not the assignment\
    \ to 2. It's as if the function was written like this:\n\n```javascript\nfunction\
    \ hoistingTest() {\n  var a;\n  console.log(a);\n  a = 2;\n  console.log(a);\n\
    }\n```\n\nTo prevent confusion, many developers adopt the convention of always\
    \ declaring all variables at the top, regardless of where they are used. This\
    \ can be thought of as an annoying manual hoisting, after all, that's just how\
    \ things work, and hoisting is the JavaScript interpreter's job. But you can make\
    \ the code more explicit and easier to read. The other option—defining variables\
