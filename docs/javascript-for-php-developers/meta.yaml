  mdcn: "\n```javascript\nvar APP = {};\n\n// 定义我的\nAPP.my = {\n  // ...\n};\n\n//\
    \ 常量\nAPP.constant = {\n  define: function () {\n    // ...\n  }\n  // ...\n};\n\
    \n// 其他内容\nAPP.my.more = {\n  // ...\n};\n```\n\n由于 APP.my 和 APP.constant 是不同的、且可能是巨大的功能块，为了简单起见，将它们实现在不同的文件中是明智之举。（你的构建过程会在生产环境中合并这些文件并对它们进行混淆压缩，以优化性能.）这些代码块可能会在不同情况下被动态包含，而你可能不知道\
    \ `constant` 是否已经定义。如果你盲目地执行 `APP.constant = {}`，那么你就会抹掉之前创建的任何同名属性（在这种情况下，你会丢失你所有的常量）。因此，在添加新属性之前进行检查是非常重要的：\n\
    \n```javascript\nif (!APP.constant) {\n  APP.constant = {\n    // ...\n  }\n}\n\
    ```\n\n但这可能很快变得非常繁琐，特别是对于深度嵌套的属性，如果有一个通用的 `namespace()` 函数就太好了：\n\n```javascript\n\
    // 哎！\nif (APP && APP.my && !APP.my.more) {\n  APP.my.more = {};\n}\n```\n\n```javascript\n\
    // 更好\nAPP.namespace('APP.my.more');\n```\n\n这里是一个通用的 `namespace()` 函数的实现：\n\n\
    ```javascript\nvar APP = {\n  namespace: function (ns) {\n    var parts = ns.split('.'),\n\
    \    parent = APP,\n\ni;\n\n// 去除冗余的全局变量\nif (parts[0] === \"APP\") {\n  parts\
    \ = parts.slice(1);\n}\n\nfor (let i = 0; i < parts.length; i++) {\n  // 如果属性不存在则创建它\n\
    \  if (typeof parent[parts[i]] === \"undefined\") {\n    parent[parts[i]] = {};\n\
    \  }\n  parent = parent[parts[i]];\n}\n\nreturn parent;\n\n}\n```\n\n现在你可以这样做：\n\
    \n```javascript\nvar my = APP.namespace('APP.my');\nmy === APP.my; // true\n\n\
    APP.namespace('my.more');\ntypeof APP.my.more; // \"object\"\n```\n\n## 模块\n\n\
    在 JavaScript 中没有模块的概念，但“模块模式”这一名称通常用于指代本章已讨论过的几个概念，即：\n\n- 使用命名空间将每个模块定义为单个全局对象的的一个属性。\n\
    - 使用一个立即执行函数（IIFE）来封装整个模块定义，并在需要时提供私有性，同时为任何临时变量提供定义和初始化模块的地方。\n- 立即执行函数返回一个对象（或者如果你倾向于返回一个构造函数），暴露出一个公共的\
    \ API。\n\n新模块的整体骨架看起来如下：\n\n```javascript\nAPP.namespace('my.shiny').module =\
    \ (function () {\n\n// 依赖的短名称\nvar shiny = APP.my.shiny;\n\n// 本地/私有变量\nvar i,\
    \ j;\n\n// 私有函数\nfunction hidden() {\n```\n\n```javascript\n// 公共 API\nreturn\
    \ {\n  willUseMe: function () {\n    return \"Yups\";\n  }\n}\n();\n```\n\n使用新模块：\n\
    \n```javascript\nAPP.my.shiny.module.willUseMe(); // \"Yups\"\n```\n\n## CommonJS\
    \ 模块\n\n另一种组织代码为模块的方法是由 CommonJS 规范提供的。CommonJS 并不是由 Ecma International 或 W3C\
    \ 等标准机构建立的标准，它是一个由社区驱动的项目，旨在让开发者对编写跨环境 JavaScript 的通用实践达成共识。模块规范只是 CommonJS 内部的一个（尽管是最流行的）子项目。\n\
    \n目前已经有一些浏览器原生实现了 CommonJS 模块，但也有一些环境和框架提供了模块支持。支持 CommonJS 的著名环境之一是 NodeJS。\n\
    \n## 定义 CommonJS 模块\n\n下面的代码片段是一个基础 CommonJS 模块的定义：\n\n```javascript\n// 私有变量\n\
    var i, j;\n```\n\n```javascript\n// 私有函数\nfunction hidden() {\n```\n\n```javascript\n\
    // 公共 API\nexports.sayHL = function () {\n  return \"hi\";\n};\n```\n\n你在这里得到了什么？\n\
    \n- 不需要立即执行函数封装。\n- 私有变量和函数就像你定义全局变量一样被定义。然而，CommonJS 的实现会处理并将这些变量变为局部，因此你所的一切默认都是局部的。\n\
    - 你向一个特殊的 `exports` 对象添加属性。你添加到 `exports` 中的任何内容将成为你模块的公共可访问 API。\n\n## 使用 CommonJS\
