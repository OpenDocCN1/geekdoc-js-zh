  md: "```\nvar data = ['eeny', 'meeny', 'miny', 'moe'];\nvar count = data.length;\n\
    \nnext = function () {\n  if (index < count) {\n    index++;\n  }\n  return data[index];\n\
    };\n\nprevious = function () {\n  if (index >= 0) {\n    index--;\n  }\n  return\
    \ data[index];\n};\n\nrewind = function () {\n  index = -1;\n};\n();\n```\n\n\
    In this example index, data and count are private since the users of this iterator\
    \ only need the methods to go back and forth, and probably shouldn't have access\
    \ to the data and the pointer, should they decide to mess them up.\n\nTesting\
    \ back and forth:\n\n```\nnext(); // \"eeny\"\nnext(); // \"meeny\"\nprevious();\
    \ // \"eeny\"\n```\n\nMore testing: rewind and start over:\n\n```\nvar a;\nrewind();\n\
    while (a = next()) {\n  // Do something with `a`\n```\n\n# Passing and Returning\
    \ Functions\n\nYou already saw examples of passing functions around, but it's\
    \ worth mentioning again: you can pass functions as arguments to other functions,\
    \ and you can also have functions return other functions as their return values.\n\
    \nPreviously, there was a function that returned a whole array of five functions.\
    \ There's no reason why it cannot return just one function."
