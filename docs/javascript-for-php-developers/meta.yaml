  md: "[the element, its index, the whole array]\n\n# # Filtering\n\nES5 adds Array.prototype.filter(),\
    \ which, just like PHP's array_filter(), lets you execute a callback function\
    \ on every array element. If the callback returns true, the elements pushed to\
    \ a new array, which is returned at the end:\n\n```\nfunction testVowels(char)\
    \ {\n  return ([aeou]/i).test(char);\n}\n```\n\n```\nvar input = [\"a\", \"b\"\
    , \"c\", \"d\", \"e\\];\nvar output = input.filter(testVowels);\n```\n\n```\n\
    output.join(', '); // \"a\", \"e\"\n```\n\n# # Testing the Array Content\n\nTwo\
    \ new methods, every() and some(),let you iterate over all array elements and\
    \ return a boolean, whether or not the array satisfy a check you provide in a\
    \ callback.\n\nSay you want to check if an array contains numbers. The check will\
    \ be:\n\n```\nfunction isEven(num) {\n  return num % 2 === 0;\n}\n```\n\nAnd the\
    \ tests:\n\n```\n// Are *all* of the numbers even?\n[1, 2, 4].every(isEven); //\
    \ false\n```\n\n```\n// Are at least some (or even one) of the numbers even?\n\
    [1, 2, 4].some(isEven); // true\n```\n\n# # Map/Reduce\n\nSimilar to PHP's array_map()\
    \ and array_reduce(), in ES5 you have Array.prototype type.map() and Array.prototype.reduce(),\
    \ plus one Array.prototype.reduceRight().\n\nmap() returns a new array where each\
    \ element has been changed by your custom callback function.\n\nHere's a function\
    \ that turns a character into its HTML entity form:\n\n```\nfunction entity(char)\
    \ {\n  return \"&#\" + char.charCodeAt(0) + \";\";\n}\n```"
