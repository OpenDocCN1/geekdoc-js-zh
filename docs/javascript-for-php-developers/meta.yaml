- img_proc: true
  md: "In general, there are a handful of falsy values (values that cast to false\
    \ in nonstrict comparisons):\n\n+   * Empty string \"\"\n* The number 0\n* The\
    \ value false\n* null\n* undefined\n* Special numeric value NaN, which means \"\
    not a number,\" like PHP's NAN constant\n\nThese might trip you in nonstrict comparisons:\n\
    \n```\nnull === undefined; // true\n\"\" == 0; // true\n```\n\nbut\n\n```\nnull\
    \ === undefined; // false\n0 == \"\"; // false\n```\n\nbecause\n\n```\ntypeof\
    \ null === typeof undefined; // false, \"object\" !== \"undefined\"\ntypeof 0\
    \ === typeof \"\"; // false, \"number\" !== \"string\"\n```\n\nAll objects are\
    \ stretchy. And since arrays are objects, they always cast to true in loose comparisons.\
    \ This is different from PHP, where empty arrays are false:\n\n```\n// PHP\nif\
    \ (array()) {\n  echo \"hello\";\n  // Not reachable in PHP\n}\n\n// JavaScript\n\
    if ([]) {\n  console.log('hello');\n  // Reachable in JavaScript\n}\n```\n\nNot\
    \ falsy values are nonstrict equal to one another:\n\n```\nundefined == null;\
    \ // true\nundefined == 0; // false\n```\n\nTo recap, you can make your life and\
    \ the lives of those around you easier by always using strict comparison with\
    \ ===. You don't need to remember the casting rules and their differences with\
    \ PHP."
