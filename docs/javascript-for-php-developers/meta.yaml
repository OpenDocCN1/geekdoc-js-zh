    \ are allowed\n    result = \"what\";\n    break;\n  case \"\": // Strict comparison\n\
    \    result = \"a is an empty string\";\n    break;\n  default:\n    result =\
    \ \"@#$\";\n}\n```\n\nThe result here is \"a is an empty string\", where similar\
    \ code in PHP would give you \"a is false\".\n\n# try-catch\n\nTry-catch blocks\
