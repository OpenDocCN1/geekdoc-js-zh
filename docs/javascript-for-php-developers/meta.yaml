    [100, 3, 2, Array[3]]\n[103, 2, 1, Array[3]]\n[105, 1, 0, Array[3]]\n```\n\n#\
    \ String Trimming\n\nSimilar to PHP's trim() function, ES5 introduces String.prototype.trim().\n\
    \n```javascript\n\" hello\".trim(); // \"hello\"\n```\n\nAnd this is only added\
