  md: "+   • A message property is accessed as opposed to calling a getMessage() method\n\
    \nIn JavaScript, there's also finally (which exists in PHP as well, since version\
    \ 5.5), but it is rare to see in practice, especially considering there are some\
    \ bugs in IE with it:\n\n```\nvar msg = \"\"\ntry {\n    throw new Error(\"ouch\"\
    );\n} catch (e) {\n    msg += e.message;\n} finally {\n    msg += \" - ouch -\
    \ finally\";\n}\nmsg; // output \"ouch - finally\"\n```\n\nAs you can see, the\
    \ statements in the finally block are always executed, regardless of whether or\
    \ not the try block throws an error.\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_34_0.png)\n\
    \nYou will see more about variable scope later, but note that the catch block\
    \ is an exception to the rule, the rule being: no block scope, function scope.\
    \ In the example you shown, e is only visible inside the catch block. However,\
    \ the error e is the only exception; if you define other variables inside the\
    \ catch block, they bleed outside of it:\n\n```\ntry {\n    throw new Error();\n\
    } catch (e) {\n    var oops = 1;\n}\n```\n\n```\ntypeof e; // \"undefined\"\n\
    typeof oops; // \"number\"\n```\n\nTry-catch has performance implications when\
    \ the catch block is executed, and should be avoided in performance-critical code\
