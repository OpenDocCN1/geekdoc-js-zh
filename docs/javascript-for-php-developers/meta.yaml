- md: "The most popular open source AMD utility at the time of writing is RequireJS.\n\
    \n## Design Patterns\n\nFor dessert, let's consider a few design patterns from\
    \ the Gang of Four's book. Bear in mind that patterns are designed for static,\
    \ strongly typed, class-based languages could be trivial to implement or unnecessary\
    \ in a language as JavaScript.\n\n## Singleton\n\nThe singleton pattern ensures\
    \ there's only one object of a certain class and provides a single global access\
    \ to it. JavaScript doesn't have classes, so a single instance of a class does\
    \ make sense. Additionally, all objects are unique, so the term singleton in JavaScript\
    \ can be another name for an object:\n\n```javascript\nvar singleton = {a: 1};\n\
    var another = {a: 1};\nsingleton === another; // false\n```\n\nAs you can see,\
    \ singleton is already a unique object.\n\n> Sometimes when people say \"singleton\"\
    \ in JavaScript they mean an object created using the module pattern.\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_143_0.png)\n\
    \n## Singletons with constructors\n\nBut what if your team is so attached to the\
    \ concept of classes that they want to create all the objects with constructor\
    \ functions? In other words, you're looking for something that behaves like this:\n\
    \n```javascript\nfunction Single() {\n  // magic!\n}\n```\n\n```javascript\nvar\
    \ a = new Single();\nvar b = new Single();\na === b; // true\n```\n\nSince the\
    \ goal is to have a single hidden instance (object), you can get a little help\
    \ from an old friend—the closure created by an immediate function:\n\n```javascript\n\
    var Single = {function () {\n  var instance;\n```\n\n```javascript\nfunction Single()\
    \ {\n  // Own properties\n  this.say_what = \"Hi\";\n```\n\n```javascript\n}\n\
    \n// Prototype properties\nSingle.say = function () {\n  return this.say_what;\n\
    };\n```\n\n```javascript\nreturn function () {\n  if (!instance) {\n    instance\
    \ = new Single();\n  }\n  return instance;\n}\n```\n\n```javascript\n));\n```\n\
    \nThe instance is protected inside a closure. The same closure contains the local\
    \ Single constructor function, which works like a regular constructor you you\
    \ can add properties to this or to Single.prototype. It doesn't really matter\
    \ which way you choose: the benefit of the prototype is a single definition for\
    \ all instances, but in this case you only have single instance instance.\n\n\
    The immediate function returns a function that is assigned to the global Single\
    \ variable. Then you can call this with new:\n\n```javascript\n// Get an instance\n\
    var a = new Single();\na.say(); // \"Hi\"\n```\n\nOnly the first call to new Single\
    \ creates a new object. From then on, the private in instance is returned:\n\n\
    ```javascript\n// Get another instance, which should be the same\nvar b = new\
    \ Single();\nb.say(); // \"Hi\"\n```\n\n```javascript\n// Check if the singleton\
    \ works\na === b; // true\na.say === b.say; // true\n```\n\nFor simplicity, the\
    \ variable is a global Single, but it doesn't need to be global; you can always\
    \ create the constructor in a namespace like APP.Single:\n\n```javascript\nAPP.Single\
    \ = (function () {\n  // ...\n});\n```\n\n```javascript\nvar mysingle = new APP.Single();\n\
    mysingle.say(); // \"Hi\"\n```\n\n## Factory\n\nThe factory method pattern allows\
    \ you to defer the object creation to more specific subclasses/constructors. This\
    \ allows you to decide at runtime which class/constructor you'll use to create\
    \ an object. You usually pass a string to a static factory() or build() method,\
    \ and this method takes care of finding the right class to instantiate.\n\nIn\
    \ PHP, you commonly use a prefix to namespace your classes, or in newer versions,\
    \ use a real namespace. For example:\n\n```php\n// PHP\n\n// Specific implementations\n\
    class Polygon_Trangle {}\nclass Polygon_Square {}\nclass Polygon_Circle {};\n\
    ```\n\n```php\n// Where the factory lives\n```\n\n```php\nPolygon {\n    static\
    \ function factory($name) {\n        $class = \"Polygon_\" . ucfirst(strtolower($name));\n\
    \        if (class_exists($class)) {\n            return $class;\n        }\n\
    \        throw new Exception($class . \" doesn't exist\");\n    }\n}\n```\n\n\
    ```php\n// Usage\n$tri = Polygon::factory('triangle');\necho get_class($tri);\
    \ // \"Polygon_Triangle\"\n```\n\n```php\n// Throws an Exception, there's no Polygon_Rectangle\n\
    $rect = Polygon::factory('rectangle');\n```\n\nThe most important part here is\
    \ return $class; PHP allows you to create instances of classes that are not known\
    \ in advance. In other languages, you might need a long switch statement listing\
    \ all known classes.\n\nIn JavaScript, you can map Polygon object and use it as\
    \ a namespace as well as a place to keep your static factory() method:\n\n```javascript\n\
    // JavaScript\nvar Polygon = {\n    factory: function (name) {\n        var const\
    \ = name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();\n        if (Polygon[const])\
    \ {\n            return Polygon[const];\n        }\n        throw new Error(\"\
    Polygon. \" + name + \" doesn't exist\");\n    }\n```\n\n```javascript\n};\n```\n\
    \n```javascript\n// Specific implementations\nPolygon.Triangle = function () {};\n\
    Polygon.Square = function () {};\nPolygon.Circle = function () {};\n```\n\n```javascript\n\
    // Usage\nvar tri = Polygon.factory('triangle');\ntri = Instanceof Polygon.Triangle;\
    \ // true\n```\n\n`new Polygon.factory('Rectangle'); // Error: Polygon.Rectangle\
    \ doesn't exist`\n\nThere is no special trick or syntax here; it is about simply\
    \ accessing a property here.\n\n## Decorator\n\nThe decorator pattern lets you\
    \ augment an object at runtime. It's an alternative to inheritance. Using this\
    \ constructor is simple:\n\n```javascript\nfunction Text(txt) {\n  this.input\
    \ = txt;\n}\n```\n\n```javascript\nText.prototype.get = function () {\n  return\
    \ this.input;\n}\n```\n\nUsing this constructor looks like:\n\n```javascript\n\
    var my = new Text(\"hello\");\nmy.get(); // \"hello\"\n```\n\n## Adding decorators\n\
    \nNow that the API is clear and the decorators exist, it's time for the decorate()\
    \ method. First, you need to slightly modify the Text() constructor so it maintains\
    \ a list of decorators:\n\n```javascript\nfunction Text(txt) {\n  this.input =\
    \ txt;\n  this.decorators_list = [];\n}\n```\n\nThe decorate() method is actually\
    \ appending to the list of registered decorators:\n\n```javascript\nText.prototype.decorate\
    \ = function (decorator) {\n  this.decorators_list.push(decorator);\n}\n```\n\n\
    The most intelligence will be hidden in the code get() method, which you rewrite\
    \ to look like:\n\n```javascript\nText.prototype.get = function () {\n  var txt\
    \ = this.input,\n  max = this.decorators_list.length,\n  name;\n  for (var i =\
    \ 0; i < max; i++) {\n    name = this.decorators_list[i];\n    txt = Text.decorators[name].get(txt);\n\
    \  }\n  return txt;\n}\n```\n\nAs you can see, this method loops over requested\
    \ decorators and calls one's get(), passing the result of the previous.\n\nSame\
    \ for punctuation:\n\n```javascript\nText.decorators.punctuation = {\n  get: function\
    \ (text) {\n    return text.replace(/,(.*)/g, ',$1');\n  }\n}\n```\n\nFor italics:\n\
    \n```javascript\nText.decorators.italics = {\n  get: function (text) {\n    return\
    \ text.replace(/(_)(.*?)()/g, '<i>$2</i>');\n  }\n}\n```\n\nAnd finally, escape\
    \ object:\n\n```javascript\nText.decorators.escape = {\n  get: function (text)\
    \ {\n    return text.replace(/&/g, '&amp;');\n    replace(/</g, '&lt;');\n   \
    \ replace(/>/g, '&gt;');\n  }\n}\n```\n\nMore testing:\n\n```javascript\nvar my\
    \ = new Text(\"_hello_ho,_ho_\");\nmy.decorate('punctuation');\nmy.decorate('italics');\n\
    my.get(); // \"<i>hello</i>ho, <i>ho</i>\"\n```\n\nYou can also add decorators:\n\
    \n```javascript\nmy.decorate('escape');\nmy.get(); // \"&lt;i&gt;hello&lt;/i&gt;ho,\
    \ &lt;i&gt;ho&lt;/i&gt;\"\n```\n\n## Documentation and Testing\n\nLet's wrap this\
    \ chapter and the book with a few words about documentation and testing in JavaScript.\n\
    \n## Manual\n\nOne of the really strong points of PHP is its great manual, especially\
    \ with all the user-contributed comments. No exact equivalent exists for JavaScript,\
    \ the Mozilla De-veloper Network (MDN) has an excellent online resource you can\
    \ consult. Even though it's about Mozilla and Firefox, there are often notes about\
    \ IE and other browsers necessary.\n\nFor IE-specific flavors, your best resource\
    \ is the MSDN site."
  mdcn: "\n在本文写作时，最流行的开源 AMD 工具是 RequireJS。\n\n## 设计模式\n\n作为甜点，让我们考虑一下来自“四人帮”（Gang\
    \ of Four）书中的一些设计模式。请记住，模式是为静态、强类型、基于类的语言设计的，在 JavaScript 这种语言中，实现它们可能非常简单，或者根本没有必要。\n\
    \n## 单例模式\n\n单例模式确保某个类只有一个对象，并为该对象提供单一的全局访问。JavaScript 没有类，所以一个类的单实例是有意义的。此外，所有对象都是唯一的，因此\
    \ JavaScript 中的单例可以是对象的另一个名称：\n\n```javascript\nvar singleton = {a: 1};\nvar another\
    \ = {a: 1};\nsingleton === another; // false\n```\n\n如你所见，singleton 已经是一个唯一对象。\n\
    \n> 有时当人们在 JavaScript 中说“单例”时，指的是使用模块模式创建的对象。\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_143_0.png)\n\
    \n## 使用构造函数的单例\n\n但如果你的团队非常固守类的概念，以至于想用构造函数创建所有对象呢？换句话说，你正在寻找行为像这样的东西：\n\n```javascript\n\
    function Single() {\n  // 魔法！\n}\n```\n\n```javascript\nvar a = new Single();\n\
    var b = new Single();\na === b; // true\n```\n\n由于目标是有一个隐藏的实例（对象），你可以从一个老朋友那里获得帮助——由立即函数创建的闭包：\n\
    \n```javascript\nvar Single = {function () {\n  var instance;\n```\n\n```javascript\n\
    function Single() {\n  // 自身属性\n  this.say_what = \"Hi\";\n```\n\n```javascript\n\
    }\n\n// 原型属性\nSingle.say = function () {\n  return this.say_what;\n};\n```\n\n\
    ```javascript\nreturn function () {\n  if (!instance) {\n    instance = new Single();\n\
    \  }\n  return instance;\n}\n```\n\n```javascript\n));\n```\n\n实例被保护在闭包内部。同一个闭包包含了本地的\
    \ `Single` 构造函数，它的作用就像一个普通的构造函数，你可以向它添加属性，或者向 `Single.prototype` 添加属性。选择哪种方式并不重要：原型的用处是为所有实例提供单一定义，但在这种情况下你只有一个实例\
    \ `instance`。\n\n立即函数返回一个赋值给全局变量 `Single` 的函数。你可以用 `new` 调用它：\n\n```javascript\n\
    // 获取实例\nvar a = new Single();\na.say(); // \"Hi\"\n```\n\n只有第一次调用 `new Single`\
    \ 会创建一个新对象。从那时起，返回私有的 `instance`：\n\n```javascript\n// 获取另一个实例，它应该是同一个\nvar b\
    \ = new Single();\nb.say(); // \"Hi\"\n```\n\n```javascript\n// 检查单例是否生效\na ===\
    \ b; // true\na.say === b.say; // true\n```\n\n为了简单起见，变量是全局的 `Single`，但它不需要是全局的；你始终可以在\
    \ `APP.Single` 命名空间中创建构造函数：\n\n```javascript\nAPP.Single = (function () {\n  //\
    \ ...\n});\n```\n\n```javascript\nvar mysingle = new APP.Single();\nmysingle.say();\
    \ // \"Hi\"\n```\n\n## 工厂模式\n\n工厂方法模式允许你将对象的创建推到更具体的子类/构造函数中。这允许你在运行时决定使用哪个类/构造函数来创建对象。你通常会向静态工厂\
    \ `factory()` 或 `build()` 方法传递一个字符串，该方法会负责找到正确的类以进行实例化。\n\n在 PHP 中，你通常使用前缀来为类命名空间，或者在较新版本中使用真正的命名空间。例如：\n\
    \n```php\n// PHP\n\n// 具体实现\nclass Polygon_Trangle {}\nclass Polygon_Square {}\n\
    class Polygon_Circle {};\n```\n\n```php\n// 工厂所在的位置\n```\n\n```php\nPolygon {\n\
    \    static function factory($name) {\n        $class = \"Polygon_\" . ucfirst(strtolower($name));\n\
    \        if (class_exists($class)) {\n            return $class;\n        }\n\
    \        throw new Exception($class . \" doesn't exist\");\n    }\n}\n```\n\n\
    ```php\n// 使用\n$tri = Polygon::factory('triangle');\necho get_class($tri); //\
    \ \"Polygon_Triangle\"\n```\n\n```php\n// 抛出异常，没有 Polygon_Rectangle\n$rect = Polygon::factory('rectangle');\n\
    ```\n\n这里最重要的部分是 `return $class;`。PHP 允许你创建预先类的类。在其他语言中，你可能需要一个列出所有已知类的 `switch`\
    \ 语句。\n\n在 JavaScript 中，你可以映射 `Polygon` 对象并将其作为命名空间，同时也作为存放静态工厂 `factory()` 方法的地方：\n\
    \n```javascript\n// JavaScript\nvar Polygon = {\n    factory: function (name)\
    \ {\n        var const = name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();\n\
    \        if (Polygon[const]) {\n            return Polygon[const];\n        }\n\
    \        throw new Error(\"Polygon. \" + name + \" doesn't exist\");\n    }\n\
    ```\n\n```javascript\n};\n```\n\n```javascript\n// 具体实现\nPolygon.Triangle = function\
    \ () {};\nPolygon.Square = function () {};\nPolygon.Circle = function () {};\n\
    ```\n\n```javascript\n// 使用\nvar tri = Polygon.factory('triangle');\ntri = Instanceof\
    \ Polygon.Triangle; // ```\n\n## 装饰器模式\n\n装饰器模式允许你在运行时动态地给对象添加功能。这允许你可以在不修改原始类的情况下扩展其行为。\n\
    \n在 JavaScript 中，你可以使用一个函数来包装一个对象的方法：\n\n```javascript\nfunction Person(name)\
    \ {\n  this.name = name;\n}\n\nPerson.prototype.say = function() {\n  console.log(\"\
    Hello, I'm \" + this.name);\n};\n\nfunction speak(person) {\n  var oldSay = person.say;\n\
    \  person.say = function() {\n    console.log(\"I am also speaking...\");\n  \
    \  oldSay.call(this);\n  };\n}\n\nvar p1 = new Person(\"Alice\");\np1.say(); //\
    \ Hello, I'm Alice\nspeak(p1);\np1.say(); // I'm also speaking... Hello, I'm Alice\n\
    ```\n\n这种装饰器模式非常灵活，因为它允许你在运行时组合多个装饰器。\n\n在 JavaScript 中，中，装饰器模式通常通过类，，来装饰装饰器：\n\
    \n```javascript\nfunction Person(name) {\n  this.name = name;\n}\n\nPerson.prototype.say\
    \ = function() {\n  console.log(\"Hello, I'm \" + this.name);\n};\n\nfunction\
    \ speakDecorator(person) {\n  var oldSay = person.say;\n  person.say = function()\
    \ {\n    console.log(\"I am also speaking...\");\n    oldSay.call(this);\n  };\n\
    \  return person;\n}\n\nvar p1 = new Person(\"Alice\");\np1.say(); // Hello, I'm\
    \ Alice\nspeakDecorator(p1);\np1.say(); // I'm also speaking... Hello, I'm Alice\n\
    ```\n\n此外，在 ES6 中，你可以使用类和扩展来实现装饰器：\n\n```javascript\nclass Person {\n  constructor(name)\
    \ {\n    this.name = name;\n  }\n  say() {\n    console.log(\"Hello, I'm \" +\
    \ this.name);\n  }\n}\n\nfunction speakDecorator(target) {\n  const oldSay = target.say;\n\
    \  target.say = function() {\n    console.log(\"I am also speaking...\");\n  \
    \  oldSay.call(this);\n  };\n  return target;\n}\n\nconst p1 = new Person(\"Alice\"\
    );\np1.say(); // Hello, I'm Alice\n// 注意：原生 ES6 装饰器语法目前仍提案中，通常使用 Babel 等工具支持\n\
    ```\n\n装饰器模式在 JavaScript 中非常强大，特别是在处理需要动态扩展的对象时。\n"
