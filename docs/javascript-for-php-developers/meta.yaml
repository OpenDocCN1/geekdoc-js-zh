    Some environments also offer trimLeft() and trimRight(), but these are not part\
    \ of the standard.\n\n# New in Date\n\nThree new methods are added to working\
    \ with dates.\n\nDate.now() is a shorter way to do (new Date()).getTime() or +new\
    \ Date(). It returns the current timestamp:\n\n```javascript\nDate.now(); // 1327943271496\n\
    Date.now() === +new Date(); // true\n```\n\nDate.prototype.toJSON() is another\
