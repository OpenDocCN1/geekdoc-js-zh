  md: "# switch\n\nThe switch control statement works just like in PHP, with only\
    \ one difference. The cases are evaluated using JavaScript strict comparison:\n\
    \n```\n// JavaScript\nvar a = \"\";\nvar result = \"\";\n\nswitch (a) {\n  case\
    \ false:\n    result = \"a is false\";\n    break;\n  case a + \"hello\": // Expressions\
    \ are allowed\n    result = \"what\";\n    break;\n  case \"\": // Strict comparison\n\
    \    result = \"a is an empty string\";\n    break;\n  default:\n    result =\
    \ \"@#$\";\n}\n```\n\nThe result here is \"a is an empty string\", where similar\
    \ code in PHP would give you \"a is false\".\n\n# try-catch\n\nTry-catch blocks\
    \ are also pretty much identical to PHP. Here’s an example in PHP:\n\n```\n//\
    \ PHP\ntry {\n  throw new Exception('ouch');\n} catch (Exception $e) {\n  $msg\
    \ = $e->getMessage();\n}\n```\n\nAnd it is here in JavaScript:\n\n```\n// JavaScript\n\
    var msg = \"\";\ntry {\n  throw new Error(\"ouch\");\n} catch (e) {\n  msg = e.message;\n\
    }\nmsg; // o\"\n```\n\nThe few noticeable differences are the following:\n\n+\
    \   * An Error object is thrown, not an Exception\n* Type is not declared when\
    \ catching"
