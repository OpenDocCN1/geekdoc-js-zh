  - "[PAGE 42]\n\n# CHAPTER 3\nFunctions\n\nFunctions are an important topic in JavaScript\
    \ because the language has many uses for them. In their most basic form, they\
    \ look like a PHP function:\n\n```\n// Works in both basic form\nfunction sum($a,\
    \ $b) {\n    return $a + $b;\n}\n\nsum(3, 5); // 8\n```\n\n# Default Parameters\n\
    \nThere's no syntax that allows you to have a default value of a function parameter,\
    \ as is often done in PHP. This is scheduled for a future version of ECMAScript,\
    \ but for now you have to take care of yourself inside the body of your function.\
    \ Let's say you want the second parameter to default to 2:\n\n```\n// PHP\nfunction\
    \ sum($a, $b = 2) {\n    return $a + $b;\n}\n\n// JavaScript\nfunction sum(a,\
    \ b) {\n    b = b || 2;\n    // Also sometimes written as\n    // b || (b = 2)\n\
    \    return a + b;\n}\n```\n\nThis is a short syntax that works fine in many cases,\
    \ but it's a little naive in this particular because b || 2 is a loose comparison.\
    \ If you pass 0 as an argument, the comparison evaluates to false and b becomes\
    \ 2:"
  - "[PAGE 43]\n\n```\nsum(3); // 5\nsum(3, 0); // 5, not what you'd expect\n```\n\
    \nA longer version is to use typeof:\n\n```\nfunction sum(a, b) {\n  b = typeof\
    \ b === \"undefined\" ? 2 : b;\n  return a + b;\n}\nnsum(3, 0); // 3\nsum(3);\
    \ // 5\n```\n\n# Any Number of Arguments\n\nYou do not have to pass all arguments\
    \ that a function expects, and JavaScript won't complain. In other words, there\
    \ are no required parameters. If you need to make a parameter required, you need\
    \ to enforce this in the body of your function.\n\nYou can also pass more arguments\
    \ than a function expects, and these are happily ignored without any errors:\n\
    \n```\nsum(); // NaN (not a number)\nsum(1, 2); // 3\nsum(1, 2, 100, 999); //\
    \ 3\n```\n\nYou can prepare for receiving any number of arguments and handle this\
    \ case gracefully. In PHP, you can use func_get_args(), which returns an array\
    \ of arguments passed to your function. In JavaScript, you use the arguments array-like\
    \ object. It's an object available to your function body. It's dubbed \"array-like\"\
    \ because its properties are enumerated from index 0, and it also has a length\
    \ property, just like an array:\n\n```\nfunction sum(/* nothing here */) {\n \
    \ for (var i = 0, result = 0; i < arguments.length; i++) {\n    result += arguments[i];\n\
    \  }\n  return result;\n}\n```\n\n```\nsum(); // 0\nsum(111); // 111\nsum(1, 2);\
    \ // 3\nsum(1, 2, 3); // 6\nsum(1, 10, 2, 9, 38); // 33\n```\n\nRemember that\
    \ although it looks like an array, arguments is in fact an object, and it doesn't\
    \ have methods such as push(), pop(). However, you can easily convert this array-like\
    \ object to an array. Brace yourself for mastering what's new that will be explained\
    \ in detail later:"
