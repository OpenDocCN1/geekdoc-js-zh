    \ {\n  var a;\n  console.log(a);\n  a = 2;\n  console.log(a);\n}\n```\n\nTo prevent\
    \ confusion, many developers adopt the convention of always declaring all variables\
    \ at the top, regardless of where they are used. This can be thought of as an\
