    \ `begetObject()` 让 `F()` 不每次都被创建吗？\n\n## “经典” extend()\n\n让我们用另一种实现继承的方式作为结束，这种方法可能最接近\
    \ PHP，因为它看起来像一个构造函数继承另一个构造函数；因此，它看起来像一个类继承一个类。\n\n核心原理如下：\n\n```javascript\nfunction\
    \ extend(Child, Parent) {\n  var F = function () {}\n  F.prototype = Parent.prototype;\n\
    \  Child.prototype = new F();\n}\n```\n\n使用这种方法，extend() 需要两个构造函数。在 `extend()`\
    \ 完成后，使用第一个构造函数（子类）创建任何新对象都会通过 `prototype` 属性获得第二个构造函数（父类）的所有属性方法。\n\n> 这种方法通常被称为“经典”方法，因为它最接近类的概念。\n\
    \n在 `extend()` 中只需要额外添加两个小细节：\n\n- 1. 让子类保留对父类的引用，以防万一。\n- 2. 将子类的 `constructor`\
    \ 属性指向子类的构造函数，以防内省时需要（你将在第 5 章看到更多关于该属性的内容）：\n\n```javascript\nfunction extend(Child,\
    \ Parent) {\n  var F = function () {}\n  F.prototype = Parent.prototype;\n  Child.prototype\
    \ = new F();\n  Child.prototype.parent = Parent;\n  Child.prototype.constructor\
    \ = Child;\n}\n```\n\n在这种方法中，不涉及 `new Parent()` 的实例。这意味着在父类构造函数内部添加的自有属性不会被继承。只有添加到父类\
    \ `prototype` 上的属性会被继承。这在许多场景下都是没问题的。通常情况下，你将想要重用的属性添加到原型上。\n\n考虑以下这种设置：\n\n```javascript\n\
    function Parent() {\n  this.name = \"Papa\"\n}\nParent.prototype.family = \"Bear\"\
    ;\nfunction Child() {\n  extend(Child, Parent);\n}\n```\n\n属性 `name` 没有被继承，但 `family`\
    \ 继承了：\n\n```javascript\nnew Child().name; // undefined\nnew Child().family; //\
    \ \"Bear\"\n```\n\n而且子类可以访问父类：\n\n```javascript\nChild.prototype.parent === Parent;\
    \ // true\n```\n\n## 借用方法\n\n使用 `call()` 和 `apply()` 让你有机会重用代码，而完全不需要处理继承。毕竟，继承的目的是为了帮助我们重用代码。\n\
    \n如果你看到像这样的方法，你可以临时借用它，传递你自己的对象进行绑定：\n\n```javascript\nvar object = {\n  name:\
    \ \"normal\",\n  sayName: function () {\n    return \"My name is \" + this.name;\n\
    \  }\n}\n```\n\n```javascript\nvar precious = {\n  shiny: true,\n  name: \"iPhone\"\
    \n}\n```\n\n如果你想在不扩展任何东西的情况下利用 `object.sayName()`，可以直接这样做：\n\n```javascript\n\
    object.sayName.call(precious); // \"My name is iPhone\"\n```\n\n如果你将方法借用和经典继承结合起来，你可以同时获得自有属性原型属性：\n\
    \n```javascript\nfunction Parent(name) {\n  this.name = name;\n}\nParent.prototype.family\
    \ = \"Bear\";\n```\n\n```javascript\nfunction Child() {\n  Child.prototype.parent.apply(this,\
    \ arguments);\n}\n```\n\n```javascript\nextend(Child, Parent);\n```\n\n所有属性都变成了子类的自有属性。通过\
    \ `arguments` 和 `apply()` 的魔法，如果你需要，你还可以将参数传递给构造函数：\n\n```javascript\nvar bear\
    \ = new Child('Cub');\nbear.name; // \"Cub\"\nbear.family; // \"Bear\"\nbear.hasOwnProperty('name');\
    \ // true\nbear.hasOwnProperty('family'); // false\n```\n\n## 结论\n\n如你所见，实现继承有很多可选选项。你可以根据当前任务、个人偏好或团队偏好来挑选选择。你甚至可以构建自己的解决方案，或者使用你所选库自带的方案。但注意，JavaScript\
    \ 项目中深层继承链并不常见，因为该语言允许你简单地复制其他对象的属性和方法或“借用”它们来完成任务。或者正如四人帮的《设计模式》（Addison-Wesley,\
    \ 1994）所说：“优先使用对象组合而非类继承。”\n\n# 第 5 章\n\n## 内置 API\n\nJavaScript 有一个很小的内置 API，本章将介绍其几乎全部内容。只有三个全局属性、九个全局函数以及少量全局对象，其中大多数是构造函数。大部分实用的内容都在构造函数的原型上，或者直接作为构造函数的属性存在。\n\
    \n## 全局对象\n\n你已经了解全局对象了，但让我们回顾一下。每个 JavaScript 环境都有一个全局对象，类似于 PHP 中的 `$GLOBALS`\
    \ 数组。\n\n某些环境（并非所有）都有一个指向全局对象的全局变量。浏览器称之为 `window`。你可以在全局程序代码或函数中使用它，只要该函数没有被用\
    \ `new` 调用且你不在 ES5 严格模式下——这一点稍后会详细介绍。\n\n你也可以将全局变量视为全局变量。\n\n## 全局属性\n\n三个全局属性：\n\
    \n- window\n- undefined\n- NaN\n\n## 全局函数\n\n有九个全局函数：\n\n- isNaN\n- isFinite\n\
    - parseInt\n- parseFloat\n- eval\n- setTimeout\n- setInterval\n- decodeURI\n-\
    \ encodeURI\n\n## 全局对象\n\n有全局对象：\n\n- Object\n- Array\n- Function\n- Date\n- RegExp\n\
    - Error\n- String\n- Number\n\n## 数字\n\n与数字相关的函数有：\n\n- `isNaN()`: 告诉你是参数是否为 `NaN`\
    \ 值。\n- `isFinite()`: 告诉你是参数是否不是 `Infinity` 值。\n- `parseInt()`: 取字符串并返回整数值。\n\
    - `parseFloat()`: 解析字符串为浮点数。\n\n你使用 `isNaN` 来判断算术运算的结果是否成功，因为 `NaN` 值与任何内容都不比较，包括它自己：\n\
    \n```javascript\nNaN === NaN; // false\n1 * 'two' === NaN; // false\nisNaN(1 *\
    \ 'two'); // true\n```\n\n`parseInt()` 取一个参数和一个第二个参数，后者指定了你如何解析字符串。你可以始终传递 `10`\
    \ 以确保输入被视为十进制；否则解释器会进行猜测：\n\n```javascript\nparseInt('08'); // 8\nparseInt('08');\
    \ // 0\nparseInt('08', 10); // 8\n```\n"
