    \  typeof arguments.push; // \"undefined\"\n  typeof args.push; // \"function\"\
    \n}\nsum();\n```\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_44_0.png)\n\nThe\
    \ typeof operator returns the string \"function\" when used with functions.\n\n\
    # arguments.length Trick\n\nA clever approach to handling optional parameters\
    \ is the one suggested by Andrea Giamarchi that uses the arguments object:\n\n\
    ```\n// Here you have a function with all four default\n// parameters, minicking\
    \ PHP's declaration:\n// function sum($a = 1, $b = 2, $c = 3, $d = 4) ...\nfunction\
    \ sum(a, b, c, d) {\n  // Note: no 'break' needed\n  switch (arguments.length)\
    \ {\n    case 0: a = 1;\n    case 1: b = 2;\n    case 2: c = 3;\n    case 3: d\
    \ = 4;\n  }\n  return a + b + c + d;\n}\n```\n\n```\n// test\nsum(); // 10\nsum(1);\
    \ // 10\nsum(11); // 20\nsum(1, 2, 3, 24); // 30\nsum(11, 22); // 40\n```\n\n\
    # Return Values\n\nFunctions always return a value. If the function doesn't use\
    \ return, then the value undefined is returned implicitly:\n\n```\n// Explicit\
    \ 'return'\nfunction iReturn() {\n  return 101;\n}\niReturn() === 101; // true\n\
    ```"
  - "[PAGE 45]\n\n```\ntypeof Return() === \"number\"; // true\n\n// Implicit 'return'\n\
    function noReturn() {\n}\nnoReturn() === undefined; // true\ntypeof noReturn()\
    \ === \"undefined\"; // true\n```\n\n# Functions Are Objects\n\nIt's important\
    \ to understand that functions in JavaScript are objects. They come with some\
    \ properties and methods of their own.\n\nFor example, take a look at this simple\
    \ function:\n\n```\nfunction sum(a, b) {\n  return a + b;\n}\n```\n\nThe length\
    \ property of a object tells you how many formal parameters are listed in the\
    \ ( ) of the function definition, or in other words, how many arguments the function\
    \ expects:\n\n```\nsum.length; // 2\n```\n\nThe methods call() and apply() of\
    \ the function objects offer an alternative way to call the function:\n\n```\n\
    sum.call(null, 3, 4); // 7\nsum.apply(null, [3, 4]); // 7\n```\n\nThe difference\
    \ between the two is that apply() takes the arguments to pass to the function\
    \ as an array, as opposed to one by. These two methods are similar to what you\
    \ can do in PHP using the following:\n\n```\n// PHP\ncall_user_func('sun', 3,\
    \ 4);\ncall_user_func_array('sun', array(3, 4));\n```\n\nThe fact that functions\
    \ are objects means you can add properties and methods to the function objects.\
    \ This can be useful, for example, to cache the results of a function invocation\
    \ to avoid duplicate work.\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_45_0.png)\n\
    \nIf you're wondering about the first parameter passed to call() and apply(),\
    \ you can ignore it for now. You'll find out more about it later. Spoiler: it\
    \ is an object that the sum() function can refer to as this inside its body if\
    \ so desires."
  - "[PAGE 46]\n\n# A Different Syntax\n\nFunctions are objects, so they can be assigned\
    \ to variables just like all other data types.\nThe following snippet shows a\
    \ perfectly valid and commonly used syntax:\n\n```\nvar sum = function (a, b)\
    \ {\n  return a + b;\n}\n\nsum(2, 2); // 4\n```\n\nThis syntax shows what is called\
    \ a function expression, as opposed to the other syntax\nyou're familiar with,\
    \ which is called a function declaration. The function declaration is\nthe more\
    \ common syntax, and the only one available in PHP before version 5.3.\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_46_0.png)\n\
    \nThere's a semantic difference in the meaning of the function keyword\ndending\
    \ on the context. In a function expression, it's an operator in.\nA function declaration,\
    \ it's a statement.\n\nNote the trailing semicolon in the function expression.\
    \ Unlike function declarations,\nfunction expressions require a semicolon.\n\n\
    ![](img/7167a987f8e0f5a6179bb61bf22fe204_46_1.png)\n\nJavaScript has a semicolon\
    \ insertion mechanism where the interpreter\nadds the semicolons for if you forget\
    \ them. However, it's always\npreferable to add the semicolons yourself to avoid\
    \ ambiguities. It also\nves helpful when you minify your code in order to reduce\
    \ its size in\nproduction, because with minification, all the code is pretty much\
    \ on\nline.\n\nThere is one more syntax you may encounter called named function\
    \ expression (NFE).\nit looks like this:\n\n```\nvar sum = function plum(a, b)\
    \ {\n  return a + b;\n}\n\nsum(21, 21); // 42\nplum(21, 21); // Error: plum()\
    \ is not defined\n```\n\nThis sort of syntax can be helpful while debugging when\
    \ the debugger reads the non-\nstandard but commonly available name property of\
    \ the function object:\n\n```\nsum.name; // \"plum\"\n```"
  - "[PAGE 47]\n\nThis syntax is called a named function expression because you assign\
    \ a name to the function. If you don't, which is much more common, you end up\
    \ with an unnamed function expression, or simply called a function expression\
    \ or an anonymous function.\n\nSetting the name (identifier) of the expression\
    \ to something other than the variable you assign it to (as with plum in the preceding\
    \ example) is not recommended. It is confusing to read, and in many IE versions,\
    \ it mistakenly creates two symbols (variables) in the enclosing scope. In other\
    \ words, typeof plum will be \"undefined\" in modern browsers and So it's best\
    \ to set the name matching to the variable you assign it to, like:\n\n```\nvar\
    \ sum = function sum(a, b) {\n  return a + b;\n}\n```\n\nThis is useful for debugging\
    \ and a good minifier strip the name if it detects's not used in the body of the\
    \ function.\n\n# Scope\n\nThere's no block scope in JavaScript, only function\
    \ scope.\n\nAny variables you define inside of a function are local to the function\
    \ and not visible outside it. Global variables are defined outside of any function:\n\
    \n```\nif (true) {\n  // Global even if in a curly braces block\n  var true_global\
    \ = 1;\n}\n```\n\n```\nif (false) {\n  var false_global = 1;\n}\n```\n\n```\n\
    var sum = function () {\n  var local = 1;\n  is_it_local = 1;\n  return true_global\
    \ + local + is_it_local;\n}\n```\n\n```\ntrue_global; // 1\nfalse_global; // undefined\n\
    local; // ReferenceError: local is not defined\nis_it_local; // ReferenceError:\
    \ is_it_local is not defined\n```\n\n```\nsum(); // 3\n```\n\n```\ntrue_global;\
    \ // 1\nfalse_global; // undefined\n```"
