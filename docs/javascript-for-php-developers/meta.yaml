- md: "You can call the get() method directly or by using its call method:\n\n```\n\
    my.get();              // \"ohai\"\nmy.get.call();    // \"ohai\"\n```\n\nHowever,\
    \ it's completely legal to overwrite the call method with something else, if it\
    \ is not an event:call:\n\n```\nmy.get.call() = \"not so special\";\n```\n\nThe\
    \ next time you try to call(), you'll get an error because it's no longer callable:\n\
    \n```\nmy.get.call(); // TypeError: call is not a function\n```\n\nSo you have\
    \ to be careful when you expose objects publicly.\n\n## Returning Private Arrays\n\
    \nThe previous example showed how to expose a function, but you can expose arrays\
    \ (also objects) or other objects.\n\nSay you have a private array and you want\
    \ to give (but not write) access to it. Doing the following looks like it should\
    \ be a good enough protection:\n\n```\nvar my = (function () {\n\n  var days =\
    \ [\"Mo\", \"Tu\", \"We\", \"Th\", \"Fr\", \"Sa\", \"Su\"];\n\n  return {\n  \
    \  getDays: function () {\n      return days;\n    }\n  };\n}());\n```\n\nOutside\
    \ the closure, the get days just fine, and you don't have a direct way to access\
    \ the private days variable:\n\n```\nmy.getDays(); // [\"Mo\", \"Tu\", \"We\"\
    , \"Th\", \"Fr\", \"Sa\", \"Su\"]\n```\n\nHowever, you get indirect access because\
    \ the array is an object and it's passed by reference, which you can use to add\
    \ another element to the array:\n\n```\nmy.getDays().push('Js'); // We need one\
    \ JavaScript day each week!\n```\n\nAnd it works!\n\n```\nmy.getDays(); // [\"\
    Mo\", \"Tu\", \"We\", \"Th\", \"Fr\", \"Sa\", \"Js\"]\n```\n\nA way to protect\
    \ the array is not to return it directly, but to return a copy of it. Using the\
    \ fact that slice will return a new array, you can use it as a general copy-making\
    \ tool:\n\n```\nvar my = (function () {\n\n  var days = [\"Mo\", \"Tu\", \"We\"\
    , \"Th\", \"Fr\", \"Sa\", \"Su\"];\n\n  return {\n    getDays: function () {\n\
    \      return days.slice();\n    }\n  };\n})();\n```\n\nAn attempt to sneak an\
    \ extra day in the weekend will now be unsuccessful:\n\n```\nmy.getDays().push('Js');\n\
    my.getDays(); // [\"Mo\", \"Tu\", \"We\", \"Th\", \"Fr\", \"Sa\", \"Su\"]\n```\n\
    \nIf days were not an array or an object with unknown properties (some properties\
    \ may be other objects, which may be arrays), you would need to create a deep\
    \ copy of it and return it.\n\n## Deep Copy via JSON\n\nThe simplest way to create\
    \ a deep copy is to JSON-encode the object. It may not be the most efficient way,\
    \ especially in browsers that don't support JSON, but it's certainly short:\n\n\
    ```\nvar my = (function () {\n\n  var stuff = {\n    a: {\n      b: [1, 2]\n \
    \   }\n  }\n\n  return {\n    getStuff: function () {\n      return JSON.parse(JSON.stringify(stuff));\n\
    \    }\n  };\n})()\n```\n\nAccessing stuff for reading, but not writing:\n\n```\n\
    my.getStuff().a.b.toString(); // \"1,2\"\n```\n\n```javascript// change\nmy.getStuff().a.b.push(3);\n\
    my.getStuff().a.c = \"Ch-chchangin\";\n```\n\n```javascript\n// test changes?\n\
    my.getStuff().a.b.toString(); // \"1,2\"\ntypeof my.getStuff().a.c; // \"undefined\"\
    \n```\n\nTo make getStuff() more efficient, you can use an immediate function\
    \ that precomputes the JSON encode/decode and returns a snapshot of stuff at the\
    \ time of definition:\n\n```\nvar my = (function () {\n\n  var stuff = {\n   \
    \ a: {\n      b: [1, 2]\n    }\n  };\n\n  return {\n    getStuff: function ()\
    \ {\n      var snap = JSON.parse(JSON.stringify(stuff));\n      return function\
    \ () {\n        return snap;\n      }\n    }(),\n\n    getRealStuff: function\
    \ () {\n      return JSON.parse(JSON.stringify(stuff));\n    }\n  };\n});\n```\n\
    \nHere you have an anonymous function (notice the () at the end of getStuff())\
    \ that clones stuff snap. Then this function returns a new function that simply\
    \ returns the existing snap. Later, when you do my.getStuff(), it's the inner\
    \ function that is executed, and it has access to snap because both snap and the\
    \ inner function were created inside the closure created by the inner (wrapper)\
    \ function.\n\nNow calls to getStuff() return snap, which is not protected via\
    \ a clone. Therefore, snap can be tampered with, but the important stuff stays\
    \ safe:\n\n```\nmy.getStuff().a.b.push(3); // \"1,2,3\"\nmy.getStuff().a.b.toString();\n\
    my.getRealStuff().a.b.toString(); // \"1,2\"\n```\n\nOf course, in ES3 everything\
    \ is mutable, nothing prevents you from overwriting or wiping out the public API\
    \ getStuff() and getReal() and destroying all hard work of carefully protecting\
    \ private properties and methods. In other fact, if you want to shoot yourself\
    \ in the foot, there are certainly easy ways to do so:\n\n```javascript\nmy.getRealStuff\
    \ = function () {\n  return \"or don't\";\n};\ndelete my.getStuff(); // true\n\
    ```\n\n```javascript\nmy.getRealStuff(); // \"or don't\"\nmy.getStuff(); // Error:\
    \ no function\n```\n\n## Chapter 7: JavaScript Patterns\n\n### Revealing Pattern\n\
    \nRelated to privacy is the so-called revealing pattern. The idea is that when\
    \ you provide an object, you make everything private by default. If you were to\
    \ rewrite the previous example using this:\n\n```javascript\nvar my = (function\
    \ () {\n\n  var stuff = {\n    a: {\n      b: [1, 2]\n    }\n  };\n\n  return\
    \ {\n    getStuff: function () {\n      return JSON.parse(JSON.stringify(stuff));\n\
    \    }\n  };\n})();\n```\n\nWait, the OCR text provided was slightly garbled in\
    \ that section. Let me clean up the logic based on standard Revealing Pattern\
    \ patterns and the provided text:\n\nThe revealing pattern allows you to define\
    \ all your variables and functions privately and then expose only the ones you\
    \ want to be public.\n\n### Constants\n\nJavaScript environments provide the const\
    \ statement which can be used instead of var:\n\n```javascript\nconst PI = 3.14;\n\
    ```\n\nBut in ES5 there is no such thing as a constant. You can work around this\
    \ by either using a convention or a utility. Both have drawbacks (a convention\
    \ is not enforceable, and a utility is overkill for most tasks). If you're considering\
    \ a convention, be aware that the common convention is to use UPPERCASE for constant\
    \ names. If you go with a utility, you can create an object that implements the\
    \ following:\n\n```javascript\nvar constant = (function () {\n  var constants\
    \ = {}; // All constants go here\n  var hasProperty = Object.prototype.hasOwnProperty;\n\
    \  var allowed = { // Only primitive accepted\n    string: 1,\n    number: 1,\n\
    \    boolean: 1\n  };\n\n  return {\n    define: function (name, value) {\n  \
    \    if (this.defined(name)) {\n        return false;\n      }\n      if (!hasOwnProperty.call(allowed,\
