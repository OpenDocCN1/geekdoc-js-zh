  md: "# CHAPTER 3\nFunctions\n\nFunctions are an important topic in JavaScript because\
    \ the language has many uses for them. In their most basic form, they look like\
    \ a PHP function:\n\n```\n// Works in both basic form\nfunction sum($a, $b) {\n\
    \    return $a + $b;\n}\n\nsum(3, 5); // 8\n```\n\n# Default Parameters\n\nThere's\
    \ no syntax that allows you to have a default value of a function parameter, as\
    \ is often done in PHP. This is scheduled for a future version of ECMAScript,\
    \ but for now you have to take care of yourself inside the body of your function.\
    \ Let's say you want the second parameter to default to 2:\n\n```\n// PHP\nfunction\
    \ sum($a, $b = 2) {\n    return $a + $b;\n}\n\n// JavaScript\nfunction sum(a,\
    \ b) {\n    b = b || 2;\n    // Also sometimes written as\n    // b || (b = 2)\n\
    \    return a + b;\n}\n```\n\nThis is a short syntax that works fine in many cases,\
    \ but it's a little naive in this particular because b || 2 is a loose comparison.\
    \ If you pass 0 as an argument, the comparison evaluates to false and b becomes\
    \ 2:"
