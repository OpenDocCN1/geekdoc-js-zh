    It''s similar to PHP''s array_slice().


    Note the difference with Array.prototype.slice(), however, slice() takes a start
    index and a length (number of elements) to remove, slice() takes start and end
    index:


    ```

    // PHP

    $input = array("red", "green", "blue", "yellow", "purple");

    $slice = array_slice($input, 2, 2, "orange");

    print_r($input); // "red", "green", "orange", "purple"

    print_r($slice); // "blue", "yellow"

    ```


    ```

    // JavaScript

    var input = ["red", "green", "blue", "yellow", "purple"];

    var slice = input.slice(2, 2, "orange");

    input.toString(); // "red,green,orange,purple"

    lice.toString(); // "blue,yellow"

    ```


    You can add many elements to replace the sliced out ones, and if they are not
    arrays, they''ll be treated as one element:


    ```

    var input = ["red", "green", "blue", "yellow", "purple"];

    input.splice(2, 2, "orange", ["black", "white" "grey"]);

    input.toString(); // "red,green,orange,black,white,grey"

    ```


    reverse()


    As the names suggests, Array.prototype.reverse() reverses the order of the array
    elements (the last element comes first, etc.), similar to PHP''s array_reverse():


    +   [1, 2, 3].reverse().toString(); // "3,2,1"


    join()


    Array.prototype.join() is like PHP''s implode(). It returns a string of the elements
    of the array, delimited by a string. The default delimiter is comma:


    +   [5, 4, 3].join('' ''); // "5 > 4 > 3"

    [5, 4, 3].join(); // "5,4,3"

    // same as toString()

    [5, 4, 3].join(''''); // "543"


    In PHP, the opposite of implode() is explode(), and in JavaScript, the opposite
    of Array.prototype.join() is String.prototype.split(), which you''ll see in a
    bit.


    At this point, you''re done with arrays. Let''s consider regular expressions next.


