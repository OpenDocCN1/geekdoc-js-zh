    \ = array('one' => 1, 'two' => 2);\n```\n\nin JavaScript, you'd write:\n\n```\n\
    JavaScript\nvar assoc = {'one': 1, 'two': 2};\n```\n\nThe difference is just about\
    \ using : instead of => and wrapping the values in curly brackets.\n\nThe quotes\
    \ around the keys—let's call them properties because they are indeed properties\
    \ of an object—are commonly omitted. When the keys are valid identifiers (meaning\
    \ the keys can be used as variable names), quotes are optional:\n\n```\nvar assoc\
    \ = {one: 1, two: 2};\n```\n\nAdding more to this associative array/object/dictionary:\n\
    \n```\nassoc.three = 3;\n```\n\nTo remove properties, use the delete operator:\n\
