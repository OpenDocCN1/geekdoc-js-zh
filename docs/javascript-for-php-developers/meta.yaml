  md: "In CommonJS environments, your module can be used without worrying about globals\
    \ and namespaces. For example:\n\n`require('./utils').utils.isOdd(1); // true`\n\
    \n# AMD\n\nAnother idea of implementing modules in JavaScript is called AMD, or\
    \ Asynchronous Module Definition. It's similar to CommonJS in the way it uses\
    \ a require() function to include a module inside another module or program.\n\
    \nBut CommonJS doesn't bother with the details of how a module is defined (it's\
    \ the environment's task), the AMD pattern defines a function called define().\n\
    \nSo defining a module looks like:\n\n```\ndefine('hi', ['hello'], function ()\
    \ {\n  // Private variables\n  var i, j;\n\n  // Private functions\n  function\
    \ hidden() {}\n\n  // Public API\n  return {\n    sayHi: function () {\n     \
    \ return \"hi\";\n    }\n  };\n});\n```\n\nThe function that defines the module\
    \ is the same as with CommonJS, only you simply return the public API instead\
    \ of assigning it to an exports object.\n\nThe first argument to define() is the\
    \ new module name and the second is an array of dependencies (other modules the\
    \ new module needs).\n\nUsing the hi module in your program looks like:\n\n```\n\
    require(['hi'], function (hi) {\n  hi.sayHi(); // \"hi\";\n});\n```\n\nThe first\
    \ argument to require() is a list of modules you need; the second is a callback\
    \ function that is called when this module is available.\n\n“available” because\
    \ AMD worries about loading modules asynchronously (the A in name). imagine a\
    \ page that only needs three modules. The user interacts with the page, and your\
    \ program requires another module that is not currently loaded. Your AMD helper\
    \ library takes care of fetching your additional module and invoking your callback\
    \ when the module is available."
