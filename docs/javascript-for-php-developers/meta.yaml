    ![](img/7167a987f8e0f5a6179bb61bf22fe204_81_0.png)


    It was previously mentioned that object literals like o = {} create "empty" objects.
    The word "empty" is in quotes because the objects are not really empty or blank.
    Every object, even if it doesn''t have any own properties, has properties and
    methods already available—the ones that come from its prototype chain.


    # this or prototype


    When using constructor functions, you can add properties to this or or to the
    constructor''s prototype. You might be wondering which one you should use.


    Adding to the prototype is more efficient and takes less memory because the properties
    and functions are created only once and reused by all objects created with the
    same constructor. Anything you add to this will be created every time you instantiate
    a new object.


    Therefore, any members you plan to reuse and share among instances should be added
    to the prototype, and any properties that have different values in each instance
    should be own properties added to this. Most commonly, methods go to the prototype
    and properties to this, unless they are constant among the instances.


    And talking about code reuse brings about the following question: Can you reuse
    code using inheritance?


    # Inheritance


