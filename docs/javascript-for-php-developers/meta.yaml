  - "[PAGE 75]\n\n```\nDog.prototype.setName = function () {\n  return this.name;\n\
    }\n\nvar fido = new Dog(\"Fluffy\");\nfido.setName(); // \"Fluffy\"\n```\n\nWhat\
    \ happened here?\n\n+   1. There's a normal function Dog, obviously created with\
    \ the intent to be a constructor function because it starts with a capital D and\
    \ refers to this inside its body.\n2. Behind the scenes, the Dog() function, like\
    \ any other function, automatically gets a property called prototype. You know\
    \ that functions are objects, so they can have properties.) The prototype property\
    \ is always created for each function, constructor or otherwise.\n3. You add a\
