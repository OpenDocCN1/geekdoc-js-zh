    \ 模式\n\n### 暴露模式\n\n与隐私性相关的是所谓的暴露模式。这种模式的理念是，当你提供一个对象时，默认情况下所有内容都是私有的。你可以只暴露你想公开的部分。通过以下示例使用这一点：\n\
    \n```javascript\nvar my = (function () {\n\n  var stuff = {\n    a: {\n      b:\
