- md: "And, of course, you can always consult the ECMA-262 specs.\n\n## Documenting\
    \ Your Code\n\nIf you're familiar with PHPDoc or JavaDoc, you'll be happy to learn\
    \ that you can use the same idea for inline commenting in JavaScript:\n\n```javascript\n\
    /**\n * Sums two numbers\n * @param {Number} a First number\n * @param {Number}\
    \ b Second number\n * @return {Number} The sum\n */\nfunction sum(a, b) {\n  return\
    \ a + b;\n}\n```\n\nThere are several tools you can use to generate documentation\
    \ from comments, including JDoc Toolkit and YUIDoc.\n\nIn JavaScript, where you\
    \ have more than one choice to do tasks (e.g., inheritance), the documentation\
    \ system may not be able to decide the purpose of a piece of code, so it usually\
    \ provides you with special new tags such as @inherits, @class, or @constructor\
    \ that you can use to declare your intentions.\n\n## Unit Testing\n\nThere are\
    \ several projects that help you test your JavaScript code. One example is Jasmine,\
    \ which has a plain-English type of API.\n\nLet's say you want to test the following\
    \ function:\n\n```javascript\nfunction Text(txt) {\n  this.input = txt;\n}\n```\n\
    \n```javascript\nText.prototype.get = function () {\n  return this.input;\n}\n\
    ```\n\nYour test file would look like this:\n\n```javascript\ndescribe(\"Text\"\
    , function () {\n  // first test\n  it('creates objects', function () {\n    expect(new\
    \ Text(\"wee\")).input).toBe(\"wee\");\n  });\n\n  // second test\n  it(\"can\
    \ get back the input\", function () {\n    // setup\n    var t = new Text(\"hello\"\
    );\n\n    // multiple assertions\n    expect(t.get()).toBeDefined();\n    expect(t.put).toBeUndefined();\n\
    \    expect(t.get()).toBe('hello');\n  });\n});\n```\n\nBesides Jasmine, you have\
    \ many options to pick when it comes to unit testing.\n\nFor testing user interactions\
    \ in a browser, you can use Selenium.\n\nThere's also a tool called JSCoverage,\
    \ which you can run to instrument your code before running the unit tests and\
    \ then get an idea of the code coverage of your tests.\n\n## JSLint\n\nJSLint\
    \ is tool that inspects your code statically to look for potentially dangerous\
    \ patterns as well as simple things like indentation and missing semicolons. If\
    \ JavaScript is not compiled, some errors are easily masked, and JSLint helps\
    \ you uncover some of these before the code goes to production.\n\nJSLint has\
    \ been ported to many environments, and is available as a plug-in to many IDEs\
    \ and editors. You can easily integrate it with your text editor and run it on\
    \ every file save, which will give you a greater confidence in the quality of\
    \ your code.\n\nSome developers consider ESLint restrictive and opinionated, but\
    \ it has a few options, so you can tweak and turn off checks you disagree with.\
    \ A similar tool called JSHint allows finer-grained control over which checks\
    \ you want to turn on. Another l is JavaScript Lint, based on Mozilla's SpiderMonkey\
    \ JavaScript engine.\n\n## Linting This Book\n\nAll of the examples in this book\
    \ were continuously run through JSHint to ensure high quality of the code samples\
    \ and prevent regressions in late-stage tweaks. However, since there are some\
    \ intentional errors and bad practices for educational purposes, there are some\
    \ JSHint checks that were turned off. Now that you know so much about JavaScript,\
    \ you'll find these behind-the-scenes glimpses interesting. Here is the full list\
    \ of JSHint options used for checking the book samples:\n\n```javascript\nvar\
    \ lintopts = {\n  indent: 2, // Two spaces for indentation\n  plusplus: false,\
    \ // Allows ++ and --\n  browser: true, // Assumes some common browser globals\
    \ exist,\n  such: // such as 'document'\n  node: true, // Assumes the code can\
    \ run in node.js\n  // and globals such as `global` are defined\n  // OK to have\
    \ expressions that seemingly do nothing,\n  // such as `a;` // `true`, which the\
    \ samples use to show\n  // result values\n  loopfunc: true, // Allows definition\
    \ of a function in a loop\n  // for educational purposes (in the part about closures)\n\
    \  newcap: false, // Allows calling constructors (capitalized functions)\n  //\
    \ without `new`-`again`, just for educational purposes\n  proto: true, // Allows\
    \ using `__proto__`, which is great for understanding\n  // prototypes, although\
    \ it's not supported in all browsers\n};\n```\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_151_0.png)\n\
