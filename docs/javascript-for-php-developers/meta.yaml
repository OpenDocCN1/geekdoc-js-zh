    \ with a few exceptions found in the built-in objects. Sometimes this is not a\
    \ good idea because users of your objects can change them beyond repair. In ES5,\
    \ you can restrict access to your objects. For example, you can make selected\
    \ properties read-only by setting their writable attribute to false.\n\nBut you\
    \ can access to the whole object:\n\n+   - Preventing extensions (i.e., don't\
    \ allow new properties)\n- \"Sealing\" an object, which means making all properties\
    \ nonconfigurable (cannot delete them) on top of making the object nonextensible\n\
    - \"Freezing\" an object, which is like sealing but with the additional step of\
    \ setting all properties to nonwritable\n\nConsider this regular object:\n\n```\n\
    var pizza = {\n  tomatoes: true,\n  cheese: true\n}\n```\n\nYou can always add\
    \ more properties:\n\n```\npizza.pepperoni = 'lots';\",\n```\n\nYou can change\
    \ and delete properties, because they are all configurable and writable:\n\n```\n\
    pizza.cheese = 'mozzarella'\ndelete pizza.pepperoni; // true\n```\n\nHowever,\
    \ if you prevent extensions, you'll no longer be able to add properties. You can\
    \ check for extensibility with Object.isExtensible() and disable extensions (irreversibly)\
    \ with Object.preventExtensions():\n\n```\nObject.isExtensible(pizza); // true\n\
    Object.preventExtensions(pizza); // Returns the `pizza` object\nObject.isExtensible(pizza);\
    \ // false\n```\n\n```\npizza.broccoli = 'ew'; // Error, cannot add properties\
    \ anymore\ntypeof pizza.broccoli; // \"undefined\"\n```\n\nAdditionally, you can\
