    \ = $e->getMessage();\n}\n```\n\nAnd it is here in JavaScript:\n\n```\n// JavaScript\n\
    var msg = \"\";\ntry {\n  throw new Error(\"ouch\");\n} catch (e) {\n  msg = e.message;\n\
    }\nmsg; // o\"\n```\n\nThe few noticeable differences are the following:\n\n+\
    \   * An Error object is thrown, not an Exception\n* Type is not declared when\
    \ catching"
- md: "- A message property is accessed as opposed to calling a getMessage() method\n\
    \nIn JavaScript, there's also finally (which exists in PHP as well, since version\
    \ 5.5), but it is rare to see in practice, especially considering there are some\
    \ bugs in IE with it:\n\n```javascript\nvar msg = \"\"\ntry {\n    throw new Error(\"\
    ouch\");\n} catch (e) {\n    msg += e.message;\n} finally {\n    msg += \" - ouch\
    \ - finally\";\n}\nmsg; // output \"ouch - finally\"\n```\n\nAs you can see, the\
    \ statements in the finally block are always executed, regardless of whether or\
    \ not the try block throws an error.\n\nYou will see more about variable scope\
    \ later, but note that the catch block is an exception to the rule, the rule being:\
    \ no block scope, function scope. In the example you shown, e is only visible\
    \ inside the catch block. However, the error e is the only exception; if you define\
    \ other variables inside the catch block, they bleed outside of it:\n\n```javascript\n\
    try {\n    throw new Error();\n} catch (e) {\n    var oops = 1;\n}\n```\n\n```javascript\n\
    typeof e; // \"undefined\"\ntypeof oops; // \"number\"\n```\n\nTry-catch has performance\
    \ implications when the catch block is executed, and should be avoided in performance-critical\
    \ code paths (i.e., you should move it outside loops).\n\n# while and for Loops\n\
    \nThe while, do-while, and for loops work exactly the same in JavaScript as PHP,\
    \ both languages copying C syntax. Let's have some fun and take a look at an example\
    \ that calculates the sum of the numbers from 1 to 100.\n\nThe code in this section\
    \ runs in both languages, but in JavaScript, you should start with the following:\n\
    \n```javascript\nvar i, $sum;\n```\n\nIt's not required, but emphasizes the good\
    \ habit of always declaring your variables. If you skip this line, the code still\
    \ works, $i and $sum become global variables. The $i in front of the variable\
    \ name is an uncommon but absolutely valid part of a name.\n\nAnd here's the cross-language\
    \ while loop example:\n\n```php\n$i = 1;\n$sum = 0;\n\nwhile ($i <= 100) {\n \
    \ $sum += $i;\n}\n\n$sum; // 5050\n$i; // 101\n```\n\n$sum is now 5050.\n\nSimilarly,\
    \ here's a cross-language example of a do-while loop:\n\n```php\n$i = 1;\n$sum\
    \ = 0;\n\ndo {\n  $sum += $i;\n} while ($i <= 100);\n\n$sum; // 5050\n```\n\n\
    The loop is also the same in PHP, and the following example works in both languages\
    \ as well:\n\n```php\n$i = 1;\n$sum = 0;\n\nfor ($i = 0; $sum <= 100; $i++) {\n\
    \  $sum += $i;\n}\n```\n\n$sum; // 5050\nin all these examples, $i ends being\
    \ 101, not 100. Can you answer which?\n\n# for-in Loops\n\nIn JavaScript, when\
    \ you need an associative array, you use an object. And you iterate over objects\
    \ not in a foreach loop but in a for-in loop.\n\nLet's say you have defined the\
    \ following array in PHP:\n\n```php\n// PHP\n$clothes = array(\n  'shirt' => 'black',\n\
    \  'pants' => 'jeans',\n  'shoes' => 'none', // Trailing comma OK, even recommended\n\
    );\n```\n\nThe same data in JavaScript looks like this:\n\n```javascript\n// JavaScript\n\
    var clothes = {\n  shirt: 'black',\n  pants: 'jeans',\n  shoes: 'none' // Trailing\
    \ comma not OK, because of old IEs\n};\n```\n\nIn PHP, you iterate over the data\
    \ as:\n\n```php\n// PHP\n$out = '';\nforeach ($clothes as $key => $value) {\n\
    \  $out = $key . ': ' . $value . '\\n';\n}\n```\n\nIn JavaScript, you use the\
    \ for-in loop:\n\n```javascript\n// JavaScript\nvar out = '';\nfor (var key in\
    \ clothes) {\n  out += key + ': ' + clothes[key] + '\\n';\n}\n```\n\nYou don't\
    \ have direct access to the next property inside the loop, so you get the value\
    \ using square bracket notation clothes[key]. Also note that the order in which\
    \ properties are enumerated is not guaranteed and depends on implementations.\
    \ In other words, shoes may appear before shirt. If you want to maintain the order,\
    \ you need to use a regular array to store the data. Just for illustration purposes,\
    \ if you forget for a moment in PHP you have access to (foreach) you can do the\
    \ following JavaScript:\n\n```php\n$out = '';\nforeach (array_keys($clothes) as\
    \ $key) {\n  $out = $key . ': ' . $clothes[$key] . '\\n';\n}\n```\n\n# Miscellaneous\
    \ Operators\n\nBefore you dive into the important topic of functions, let's examine\
    \ a few JavaScript operators.\n\n# in\n\nIn the previous section, in operator\
    \ was used to iterate over properties of an object. It can also be used to check\
    \ whether a property exists in an object:\n\n```javascript\nif (\"shirt\" in clothes)\
    \ {\n  // something\n}\n```\n\n```javascript\nif (\"hat\" in clothes) {\n  //\
    \ false\n}\n```\n\nAlternatively, and moreosely, you can check for presence by\
    \ using the typeof operator:\n\n```javascript\nif (typeof clothes[\"shirt\"] !==\
    \ \"undefined\") {\n  // something\n}\n```\n\nA shorter version of this is to\
    \ compare to the undefined value:\n\n```javascript\ntypeof clothes[\"shirt\"]\
    \ !== undefined // true\n```\n\n# String Concatenation\n\nWhen looking at the\
    \ for-in example, you may have noticed that the + operator is used to concatenate\
    \ strings:\n\n```javascript\nvar alphabet = \"a\" + \"b\" + \"c\";\nalphabet;\
    \ // \"abc\";\n```\n\nIt may seem strange, but the + operator is used for both\
    \ adding numbers as well as concatenating strings:\n\n```javascript\nvar numbers\
    \ = \"1\" + \"2\" + \"3\";\nvar sum = 1 + 2 + 3;\nnumbers; // \"123\"\nsum; //\
    \ 6\n```\n\nHow do you know which operation will be performed? That depends on\
    \ the type of the operands. Needless to say, the + operator is a common source\
    \ of errors, so its important to keep the variable types in mind. An alternative\
    \ way to concatenate strings is to append to an array, and once done, join its\
    \ elements. This concatenation performs even better in ancient IE versions (version\
    \ 7 and earlier):\n\n```javascript\n['R', '-', 'D', 2].join(''); // \"R2-D2\"\n\
    ```\n\nAnd finally, there's the concat() method for strings, which doesn't require\
    \ you to create array objects just for concatenation:\n\n```javascript\n\"\".concat('R',\
    \ 2, '-', 2); // \"R2-D2\"\nString.prototype.concat('R', 2, '-', 2); // \"R2-D2\"\
    \n```\n\n# Type Casting\n\nBecause + can do both addition and string concatenation,\
    \ you can also use + to quickly change the types of:\n\n```javascript\n+\"1\"\
    ; // Converts the string \"1\" to the number 1\n\"\" + 1; // Converts the number\
    \ 1 to the string \"1\"\n```\n\nSpeaking of type casting, you can use !! to convert\
    \ to a boolean:\n\n```javascript\n!!true // true\n!!false // false\n```\n\nThe\
    \ first ! negates and returns a boolean true if the value is false, and the second\
    \ ! negates again to give you the desired result of converting to a boolean. Additionally,\
    \ built-constructors, which you'll see later in detail, can also be used to perform\
    \ type casting:\n\n```javascript\nNumber(\"1\") === 1; // true\nString(100) ===\
    \ \"100\"; // true\nBoolean(0) === false; // true\nBoolean(100) === true; // true\n\
    ```\n\n# void\n\nAnother operator you may come across void. It takes any expression\
    \ as an operand and returns undefined:\n\n```javascript\nvar a = void 1;\ntypeof\
    \ a === \"undefined\"; // true\n```\n\nThe void operator is rarely useful, but\
    \ sometimes used as an href in links. With the typeof operator, people often mistake\
    \ it together with the grouping operator () so it looks like a function call:\n\
    \n> <-- not a good practice --\n<a href=\"javascript:void(0)\">click and nothing\
    \ happens</a>\n\nThis practice looks innocent enough, but when you think about\
    \ it, it's as silly as it is common. Here's what happens:\n\n1. The user clicks,\
    \ and a JavaScript expression is evaluated.\n2. The literal value 0 is sent as\
    \ an operand to the grouping operator ().\n3. The grouping operator returns the\
    \ last value in the group, 0.\n4. 0 is sent to the void operator.\n5. void, being\
    \ the black hole that it is, takes the operand and returns undefined.\n\nIgnoring\
    \ for the broken semantics of having links that do nothing, people might just\
    \ as well make the href be javascript:undefined.\n\n# Comma Operator\n\nThe comma\
    \ operator is another slightly odd one. It's the lowest precedence operator in\
    \ JavaScript. It returns the value of the operand passed to it:\n\n```javascript\n\
    var a = (\"hello\", \"there\");\na; // \"there\"\nvar a = (\"hello\", \"there\"\
    , \"young\", \"one\");\na; // \"one\"\n```\n\nIt's similar to && || ||, but these\
    \ stop evaluating the expression when the outcome is clear, the comma operator\
    \ keeps going:"
