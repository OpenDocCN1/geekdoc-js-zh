    # Exercise: onclick\n\nLet's see a practical example that demonstrates the same\
    \ idea that referencing environment variables are retained by reference, not values.\n\
    \nSay you have three buttons on an HTML page with incrementing ID attributes:\n\
    \n```\n<button id=\"button-1\">one</button>\n<button id=\"button-2\">two</button>\n\
    <button id=\"button-3\">three</button>\n```\n\nThen you assign click handlers\
    \ in a loop:\n\n```\n<script>\nfor (var i = 1; i <= 3; i++) {\n  document.getElementById('button-'\
    \ + i).onclick = function () {\n    alert(\"This is button: \" + i);\n  }\n}\n\
    </script>\n```\n\nAgain, this code may look like it should work fine, but any\
    \ button you always gives you:\n\n> \"This is button: 4\"\n\nYou can play with\
    \ the example online.\n\nAs an exercise, think about how to modify the loop so\
    \ that the three buttons return respectively:\n\n+   - This is button: 1\n- This\
    \ is button: 2\n- This is button: 3\n\n# Immediate Functions\n\nIn the definer()\
    \ function earlier, a bit of new syntax wasn't mentioned previously was introduced:\
    \ the trailing (). It instructs the interpreter to take the function that was\
    \ just defined and execute immediately:\n\n```\nvar immediate_one = function ()\
    \ {\n  return 1;\n}\nimmediate_one; // 1\n```"
