    # Constants


    JavaScript environments provide the special const statement, which can be used
    instead of var:


    ```

    const PI = 3.14;

    ```


    But even ES5 there is no such thing as a constant. You can work around this limitation
    by either using a convention or introducing a utility. However, both of these
    have drawbacks (a convention is not enforceable, and a utility is overkill for
    most tasks). If you''re considering a convention, be aware that the common convention
    is to use ALLCAPS for constant names. If you go with a constant utility, you can
    use a closure where you define your own private repository for all constants.


    Let''s create an object constant that implements the following methods (mimicking
    the PHP''s functions that deal with constants):


    +   - define()\n- defined()\n- constant()


    ```

    var constant = (function () {

    var constants = {}, // All constants go here

    ownProp = Object.prototype.hasOwnProperty, // Shorthand

    allowed = { // Only primitive types accepted

    string: 1,

    number: 1,

    boolean: 1

    };


    return {

    defefine: function (name, value) {

    if (this.defined(name)) {

    return false;

    }

    if (!ownProp.call(allowed, typeof value)) {

    return false;

    }

    }

    };

    ```'
