    \n```\n\nThe returned text doesn't look too pretty. It could use some decoration.\n\
    \n# Decoration API\n\nThe decoration API looks like this:\n\n```\nmy.decorate('punctuation');\
    \ // Fix spaces after punctuation\nmy.decorate('italics'); // Turn into <i>\n\
    ```\n\n```\nmy.get(); // \"hello, <i>world!</i> wasup? \"\n```\n\nUsing the decorators,\
    \ your program can decide at any time which decoration is appropriate for the\
    \ given task and enhance the object my with extra functionality. Also, the"
  - "[PAGE 147]\n\norder of the decoration be important (e.g., a decorator that escapes\
    \ HTML should run before the one that adds HTML tags such as <i>).\n\nIn effect,\
    \ your program chains decorators one after the other. Each decorator should therefore\
