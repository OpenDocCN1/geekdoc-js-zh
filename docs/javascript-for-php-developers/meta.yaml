  mdcn: "\n## 图 1-2. Web 检查控制台\n\n## JavaScriptCore\n\n如果你使用的是 Mac，它已经自带了一个可以运行 shell\
    \ 脚本的 JavaScript 解释器。Windows 也内置了命令行 JavaScript 解释器，但缺少控制台。\n\nMac 上的 JavaScript\
    \ 命令行解释器是一个名为 JavaScriptCore 的程序，可以在 /System/Library/Frameworks/JavaScriptCore.framework/Versions/Current/Resources/jsc\
    \ 找到它。\n\n你可以为它创建别名（alias），这样操作更方便：\n\n- 启动终端应用程序（例如通过在 Spotlight 中输入“terminal”）。\n\
    - 输入以下内容：\n  `alias jsc='/System/Library/Frameworks/JavaScriptCore.framework/Versions/Current/Resources/jsc'`\n\
    \n- 现在你可以通过输入 jsc 即可启动控制台（图 1-3）。\n\n## 图 1-3. JavaScriptCore\n\n注意，这比浏览器的控制台更加纯净，因为它没有\
    \ BOM 和 DOM 的概念，只有核心 JavaScript 语言。\n\n你可以随时将该别名添加到你的 ~/.profile 文件中，这样在你需要时它就会一直那里。\n\
    \n![](img/7167a987f8e0f5a6179bb61bf22fe204_21_0.png)\n\n## Node.js 和 Rhino\n\n\
    如果你在电脑上安装了 Node.js 或 Rhino，就可以使用它们的控制台，它们的优点可以在任何操作系统上运行。\n\nNode.js 基于 Google\
    \ 的 V8 JavaScript 引擎。安装后，你可以在终端中输入 `node` 来获取控制台（图 1-4）。\n\n## 图 1-4. Node.js\
    \ 控制台\n\nRhino 是由 Mozilla 用 Java 编写的 JavaScript 解释器。在下载 rhino.file 并将其保存到合适的地方（在我的情况下是主目录），你可以通过输入以下命令打开控制台（图\
    \ 1-5）：\n\n```\n$ java -jar ~/rhino.jar\n```\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_22_0.png)\n\
    \n如果有选择的话，请使用 Node.js。你会发现这个 REPL（读取-评估-打印循环）与使用 `php -a`（甚至更好）在探索和实验该语言方面非常相似。\n\
    \n## 较长的示例\n\n使用 JavaScriptCore、Node.js 或 Rhino，你可以创建更长的示例并将它们存储在单独的文件中。事实上，这就是用\
    \ JavaScript 编写自己的 shell 脚本的方法。你通过传递参数来运行外部文件：\n\n```\n$ j test.js\n$ node test.js\n\
    $ java -jar ~/rhino.jar test.js\n```\n\n## 开始吧\n\n配备了手手的 JavaScript 控制台，你已经准备好开启\
    \ JavaScript 之旅了。首先，第二章将检查 JavaScript 语法，重点关注与 PHP 的相似与不同。\n\n## 第二章 JavaScript\
    \ 语法\n\n就像 PHP 一样，JavaScript 具有类 C 的语法，你会觉得非常熟悉。本章将介绍基础知识，重点介绍变量、数组、循环、条件以及一些杂杂（且略微奇怪）运算符的异同。\n\
    \n## 变量\n\n在 PHP 中定义变量，你会写：\n\n```php\n// PHP\n$n = 1;\n```\n\nJavaScript 中对应的等写法是：\n\
    \n```javascript\n// JavaScript\nvar n = 1;\n```\n\n这里没有美元符号，只有变量名。和 PHP 一样，你不需要定义变量类型，因为类型是从值推导出来的。所有类型都使用\
    \ `var`。\n\n如果你需要数值类型，只需给变量赋一个数值。布尔值和字符串也是如此：\n\n```javascript\nvar n = 1;   \
    \   // number\nvar b = true;   // boolean\nvar s = \"hello\"; // string\n```\n\
    \n你可以选择声明一个变量而不初始化它的值。在这种情况下，变量被赋值为特殊值 `undefined`：\n\n```javascript\nvar a;\n\
    a; // `a` 具有特殊值 `undefined`\n```\n\n重新声明一个现有变量不会将变量值设回 `undefined`：\n\n```javascript\n\
    var a = 1;\nvar a;\n// \"a\" 仍然是 1\n```\n\n你可以在一条语句中声明（并可选值初始化）多个变量，只要用逗号分隔并以分号结尾即可：\n\
    \n```javascript\nvar a = 1, b = 2, c = 3;\n```\n"
