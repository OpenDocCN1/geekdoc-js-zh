  md: '# Acknowledgments


    First and foremost, big thanks and gratitude to my second-time reviewers who helped
    me with JavaScript Patterns before, the Three Musketeers and d''Artagnan: the
    ever-so-amazing Andrea Giamarchi, Asen Bozhilov, Dmitry Soshnikov, and Juriy “kangax”
    Zaytsev. As with the previous book, they helped me tremendously with their deep
    knowledge and experience with JavaScript, their attention to detail, and their
    determination to have technical accuracy above all. They would often comment on
    some of my bold statements with: "Hmm, this is not entirely correct and not always
    true, because..." I am forever in debt to these four ridiculously talented developers
    who also happen to be great and friendly people.


    Many thanks to Chris Shiflett and Sean Coates. They made sure the PHP side of
    things made sense, but what''s more, this whole book started as a post on their
    PHPAdvent (now WebAdvent.org) blog, followed by a talk at the ConFoo conference,
    which Sean organizes.


    Next, thanks to the Facebook engineers who hang out in the JavaScript group. I
    posted an early draft asking for comments. Three people even went through the
    whole thing gave me invaluable feedback and further nitpicking, which is the best
    quality in a technical reviewer. Thanks to Alok Menghrajani, James Ide, and Alex
    Himel.


    Finally, thanks to Randy Owens who read the “early release” of the book and meticulously
    filed tens of errata reports.


    > Stoyan Stefan

    Los Angeles, April 2013'
