    Prefixing the value with a 0 results in an octal value:


    ```

    var a = 012;

    a === 10; // true

    ```


    > Octal literals are now deprecated and disallowed in "strict mode" in ES5.

    (See Chapter 6 for more details on strict mode.)


    Prefixing the value with a 0x gives you a hexadecimal value:


    ```

    var a = 0xff;

    a === 255; // true

    ```


    You can also use scientific notation:


    ```

    var a = 5e3; // 5 with three zeros

    a === 5000; // true


    var b = 5E-3; // Moving the three digits to the left of 5

    b === 0.005; // true

    ```


    # typeof Introspection


    You can use the typeof operator to find the type of value you''re working with:


    ```

    var a = "test"

    typeof a; // "string"

    typeof 0xff; // "number"

    typeof false; // "boolean"

    ```


    Sometimes typeof is used as a function (e.g., typeof(a)), but that''s not really
    recommended. Remember that typeof is not a function, but an operator. The reason
    that typeof() works as a function is because in this context, it() is also an
    operator, called a grouping operator, which is usually used to override operator
    precedence, as in:


    ```

    3 * (2 + 1); // 9

    // versus

    3 * 2 + 1; // 7

    ```


    > JavaScript''s typeof(a) is to type as PHP''s echo($a); is to echo $a; (although
    for different reasons). Same for include($a) versus include $a; in PHP. Even though
    it works, it''s considered a bad practice because it looks like something it is
    not.'
