- md: "```javascript\nvar APP = {};\n\n// Define my\nAPP.my = {\n  // ...\n};\n\n\
    // Constants\nAPP.constant = {\n  define: function () {\n    // ...\n  }\n  //\
    \ ...\n};\n\n// Something else\nAPP.my.more = {\n  // ...\n};\n```\n\nSince APP.my\
    \ and APP.constant are distinct, potentially big chunks of functionality, it would\
    \ be wise to implement them in different files for simplicity. (Your build process\
    \ will merge the files and minify them for performance purposes in production.)\
    \ These chunks of code may be included dynamically under different circumstances,\
    \ and you may not know if constant, isn't already defined. If you blindly do APP.constant\
    \ = {}, then you wipe out any other previously created property with the same\
    \ name (and in this case, lose all your constants). That why it's important to\
    \ check before you add a new property:\n\n```javascript\nif (!APP.constant) {\n\
    \  APP.constant = {\n    // ...\n  }\n}\n```\n\nBut this can quickly become tedious,\
    \ especially for deeply nested properties, it would be nice to have a general-purpose\
    \ namespace() function:\n\n```javascript\n// Argh!\nif (APP && APP.my && !APP.my.more)\
    \ {\n  APP.my.more = {};\n}\n```\n\n```javascript\n// Better\nAPP.namespace('APP.my.more');\n\
    ```\n\nHere's an implementation of a generic namespace() function:\n\n```javascript\n\
    var APP = {\n  namespace: function (ns) {\n    var parts = ns.split('.'),\n  \
    \  parent = APP,\n\ni;\n\n// Strip redundant global\nif (parts[0] === \"APP\"\
    ) {\n  parts = parts.slice(1);\n}\n\nfor (let i = 0; i < parts.length; i++) {\n\
    \  // create a property if it doesn't exist\n  if (typeof parent[parts[i]] ===\
    \ \"undefined\") {\n    parent[parts[i]] = {};\n  }\n  parent = parent[parts[i]];\n\
    }\n\nreturn parent;\n\n}\n```\n\nNow you can do:\n\n```javascript\nvar my = APP.namespace('APP.my');\n\
    my === APP.my; // true\n\nAPP.namespace('my.more');\ntypeof APP.my.more; // \"\
    object\"\n```\n\n## Modules\n\nThere is no concept of modules in JavaScript, but\
    \ the name module pattern is often used to refer to a concept of several things\
    \ already discussed in the chapter, namely:\n\n- Namespaces to define each module\
    \ as a property of a single global object.\n- An immediate function that wraps\
    \ the whole module definition and provides privacy, if required, as well as a\
    \ place for any temporary variables to define and initialize the module.\n- The\
    \ immediate function returns an object (or a constructor function if you're inclined),\
    \ which reveals a public API.\n\nThe overall skeleton of a new module would look\
    \ like this:\n\n```javascript\nAPP.namespace('my.shiny').module = (function ()\
    \ {\n\n// Short names for dependencies\nvar shiny = APP.my.shiny;\n\n// Local/private\
    \ variables\nvar i, j;\n\n// Private functions\nfunction hidden() {\n```\n\n```javascript\n\
    // Public API\nreturn {\n  willUseMe: function () {\n    return \"Yups\";\n  }\n\
    }\n();\n```\n\nUsing the new module:\n\n```javascript\nAPP.my.shiny.module.willUseMe();\
    \ // \"Yups\"\n```\n\n## CommonJS Modules\n\nAnother approach to organizing your\
    \ code into modules is provided by the CommonJS specification. CommonJS is not\
    \ a standard established by a standards body such as Ecma International or W3C,\
    \ it is a community-driven project aiming to developers agree on common practices\
    \ for writing cross-environment JavaScript. The modules specification is just\
    \ one (albeit the most popular) of the subprojects within CommonJS.\n\nThere are\
    \ currently browsers that implement CommonJS modules natively, but there are environments\
    \ and frameworks that provide module support. One of the prominent environments\
    \ with CommonJS support is NodeJS.\n\n## Defining a CommonJS Module\n\nThe following\
    \ snippet is a definition of a bare-bones CommonJS module:\n\n```javascript\n\
    // Private variables\nvar i, j;\n```\n\n```javascript\n// Private functions\n\
    function hidden() {\n```\n\n```javascript\n// Public API\nexports.sayHL = function\
    \ () {\n  return \"hi\";\n};\n```\n\nWhat do you have here?\n\n- There's no need\
    \ for an immediate function wrapper.\n- Private variables and functions are simply\
    \ defined as you would define a global. However, the CommonJS implementation takes\
    \ care of making these variables local, so everything you do is local by default.\n\
    - You add properties to a special exports object. Anything you add to exports\
    \ becomes your module's publicly accessible API.\n\n## Using a CommonJS Module\n\
    \nHow do you use this module from your program or from another module? In NodeJS,\
