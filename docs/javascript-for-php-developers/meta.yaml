    bear.hasOwnProperty('name'); // true\nbear.hasOwnProperty('family'); // false\n\
    ```\n\n## Conclusion\n\nAs you can see, there are many options available for implementing\
    \ inheritance. You can pick and choose depending on the task at hand, personal\
    \ preferences, team preferences. You can even build your own solution or use one\
    \ that comes with your library of choice. Note, however, deep inheritance chains\
    \ are not too common in JavaScript projects because the language allows you to\
    \ simply copy properties and methods of other objects or “borrow” them to achieve\
    \ your task. Or, as the Gang of Four’s Design Patterns (Addison-Wesley, 1994)\
    \ says: “Prefer object composition to class inheritance.”\n\n# CHAPTER 5\n\n##\
    \ The Built-In API\n\nJavaScript has a small built-in API, and this chapter takes\
    \ a look at pretty much all of it. There are only three global properties, nine\
    \ global functions, and a handful of global objects, most of which are constructor\
    \ functions. Most of the useful stuff is in the prototypes of the constructors\
    \ or directly as properties of the constructors.\n\n## The Global Object\n\nYou\
    \ already know about the global object, but let's revisit it. Each JavaScript\
    \ environment has a global object, something like the $GLOBALS array in PHP.\n\
    \nSome environments, not all, have a global variable that refers to the global\
    \ object. Browsers call it window. You can access it using this in global program\
    \ code or in a function, as long as the function is not called with new and you're\
    \ not in ES5 strict mode—more on this later.\n\nYou can also think of global variables\
    \ as global variables.\n\n## Global Properties\n\nThere are three global properties:\n\
    \n- window\n- undefined\n- NaN\n\n## Global Functions\n\nThere are nine global\
    \ functions:\n\n- isNaN\n- isFinite\n- parseInt\n- parseFloat\n- eval\n- setTimeout\n\
    - setInterval\n- decodeURI\n- encodeURI\n\n## Global Objects\n\nThere are several\
    \ global objects:\n\n- Object\n- Array\n- Function\n- Date\n- RegExp\n- Error\n\
    - String\n- Number\n\n## Numbers\n\nThe number-related functions are:\n\n- isNaN():\
    \ Tells you if the argument is the NaN value.\n- isFinite(): Tells you if the\
    \ argument is not the Infinity value.\n- parseInt(): Takes a string and returns\
    \ an integer value.\n- parseFloat(): Parses strings as floats.\n\nYou use isNaN\
    \ to determine if the result of an arithmetic operation was successful, because\
    \ the NaN value doesn't compare to anything, including itself:\n\n```javascript\n\
    NaN === NaN; // false\n1 * 'two' === NaN; // false\nisNaN(1 * 'two'); // true\n\
    ```\n\nparseInt() takes an argument and a second argument, which specifies how\
    \ you want the string to be parsed. You can always pass 10 to make sure your input\
    \ is treated as a decimal; otherwise, the interpreter will guess:\n\n```javascript\n\
    parseInt('08'); // 8\nparseInt('08'); // 0\nparseInt('08', 10); // 8\n```"
