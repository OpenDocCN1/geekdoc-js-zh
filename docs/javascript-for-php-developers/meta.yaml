  md: "# Callbacks Are Not Strings\n\nNote that you don't wrap the callback in quotes,\
    \ meaning you don't pass it as a string:\n\n```\n// No-no\ngoForIt(11, 22, \"\
    sum\\()); // TypeError: not a function\n```\n\nIn the previous snippet, sum is\
    \ a function object, not a string, so wrapping it in quotes means it will try\
    \ to execute a string as a function, which won't work.\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_67_0.png)\n\
    \nIn PHP, traditionally the callbacks were defined using function names as strings\
    \ passed to call_user_func(), for example, but since the language has adopted\
    \ closures, this is getting increasingly less common.\n\nHowever, some browser\
    \ functions (e.g., setTimeout()) that accept callbacks, and are nice enough to\
    \ deal with cases where people do pass a string.\n\nSay you have this function\
    \ that tells you:\n\n```\nfunction showTime() {\n  alert(new Date());\n}\n```\n\
    \nYou can schedule it to execute in 1 second (1,000 milliseconds):\n\n```\nsetTimeout(showTime,\
    \ 1000);\n```\n\nYou can also see people doing things like this:\n\n```\nsetTimeout(\"\
    showTime()\", 1000);\n```\n\nThis works, but it feels wrong because you're expected\
    \ to pass a function value, not a string. It means setTimeout() checks what you're\
    \ passing, and if it's a string, evaluates it. A simple implementation would be\
    \ roughly something like this:\n\n```\nfunction setTimeout(callback, when) {\n\
    \  // when the time is right ...\n\n  if (typeof callback === \"string\") {\n\
    \    function () {\n      eval(callback);\n    }()\n  } else {\n    callback();\n\
    \  }\n}\n```"
