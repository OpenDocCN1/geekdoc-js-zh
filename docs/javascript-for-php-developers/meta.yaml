    # CHAPTER 5


    # The Built-In API


    JavaScript has a small built-in API, and this chapter takes a look at pretty much
    all of it. There are only three global properties, nine global functions, and
    a handful of global objects, most of which are constructor functions. Most of
    the useful stuff is in the prototypes of the constructors or directly as properties
    of the constructors.


    # The Global Object


    You already know about the global object, but let''s revisit it. Each JavaScript
    environment has a global object, something like the $GLOBALS array in PHP.


    Some environments, not all, have a global variable that refers to the global object.
    Browsers call it window. You can access it using this in global program code or
    in a function, as long as the function is not called with new and you''re not
    in ES5 strict mode—more on this later.


    You can also think of global variables as properties of the global object, with
    the only difference that you cannot delete them. Try the following in a browser:


    ```

    // Create a global variable

    var john = "Jo"

    john; // "Jo"

    window.john; // "Jo", works as a property too

    ```


    ```

