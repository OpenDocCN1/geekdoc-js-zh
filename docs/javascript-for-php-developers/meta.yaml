    \ntypeof oops; // \"number\"\n```\n\n当执行 `catch` 块时，`try-catch` 会产生性能影响，在性能敏感的代码路径中应避免使用（即你应该将其移动到循环之外）。\n\
    \n# while 和 for 循环\n\n`while`、`do-while` 和 `for` 循环在 JavaScript 中的工作方式与 PHP 完全相同，两种语言都复制了\
    \ C 语法。让我们趣味一下，看一个计算从 1 到 100 之和的示例。\n\n本部分的代码在两种语言中运行，但在 JavaScript 中，你应该从这里开始：\n\
    \n```javascript\nvar i, $sum;\n```\n\n这并不是强制要求的，但它强调了始终声明变量的良好习惯。如果你跳过这一行，代码仍然有效，`$i`\
    \ 和 `$sum` 会变成全局变量。变量名前的 `$` 是一个不常见但完全有效的名称部分。\n\n这是一个跨语言的 `while` 循环示例：\n\n```php\n\
    $i = 1;\n$sum = 0;\n\nwhile ($i <= 100) {\n  $sum += $i;\n}\n\n$sum; // 5050\n\
    $i; // 101\n```\n\n`$sum` 现在是 5050。\n\n同样，这是一个跨语言的 `do-while` 循环示例：\n\n```php\n\
    $i = 1;\n$sum = 0;\n\ndo {\n  $sum += $i;\n} while ($i <= 100);\n\n$sum; // 5050\n\
    ```\n\n循环在 PHP 中也是一样的，下面的示例在两种语言中同样有效：\n\n```php\n$i = 1;\n$sum = 0;\n\nfor ($i\
    \ = 0; $sum <= 100; $i++) {\n  $sum += $i;\n}\n```\n\n$sum; // 5050\n在所有这些示例中，`$i`\
    \ 结束时都是 101而不是 100。你能回答是哪一个吗？\n\n# for-in 循环\n\n在 JavaScript 中，当你需要关联数组时，你使用对象。你遍历对象不是使用\
    \ `foreach` 循环，而是使用 `for-in` 循环。\n\n假设你在 PHP 中定义了以下数组：\n\n```php\n// PHP\n$clothes\
    \ = array(\n  'shirt' => 'black',\n  'pants' => 'jeans',\n  'shoes' => 'none',\
    \ // 结尾逗号是允许的，甚至推荐\n);\n```\n\n相同的数据在 JavaScript 中看起来如下：\n\n```javascript\n//\
    \ JavaScript\nvar clothes = {\n  shirt: 'black',\n  pants: 'jeans',\n  shoes:\
    \ 'none' // 结尾逗号是不的，因为旧版 IE\n};\n```\n\n在 PHP 中，你这样遍历数据：\n\n```php\n// PHP\n$out\
    \ = '';\nforeach ($clothes as $key => $value) {\n  $out = $key . ': ' . $value\
    \ . '\\n';\n}\n```\n\n在 JavaScript 中，你使用 `for-in` 循环：\n\n```javascript\n// JavaScript\n\
    var out = '';\nfor (var key in clothes) {\n  out += key + ': ' + clothes[key]\
    \ + '\\n';\n}\n```\n\n你无法在循环内部直接访问下一个属性，因此你使用方括号符号 `clothes[key]` 获取值。还要注意，属性枚举的顺序是不保证的，取决于具体的实现。换句话说，`shoes`\
    \ 可能会出现在 `shirt` 之前。如果你想保持顺序，你需要使用普通数组来存储数据。仅为了说明，如果你暂时忘记了 PHP 中你可以访问 `(foreach)`，你可以执行以下\
    \ JavaScript 逻辑：\n\n```php\n$out = '';\nforeach (array_keys($clothes) as $key)\
    \ {\n  $out = $key . ': ' . $clothes[$key] . '\\n';\n}\n```\n\n# 杂项运算符\n\n在深入学习函数这个重要话题之前，让我们检查几个\
    \ JavaScript 运算符。\n\n# in\n\n在上节中，`in` 运算符被用于遍历对象的属性。它也可以用于检查属性是否存在于对象中：\n\n```javascript\n\
    if (\"shirt\" in clothes) {\n  // 某些操作\n}\n```\n\n```javascript\nif (\"hat\" in\
    \ clothes) {\n  // false\n}\n```\n\n或者，更常见的，你可以通过 `typeof` 来检查是否存在：\n\n```javascript\n\
    if (typeof clothes[\"shirt\"] !== \"undefined\") {\n  // 某些操作\n}\n```\n\n# 字符串连接\n\
    \n当执行 `catch` 块时，`try-catch` 会产生性能影响，在性能敏感的代码路径中应避免使用（即你应该将其移动到循环之外）。\n\n# 类型转换\n\
    \n由于 `+` 可以同时用于加法和字符串连接，你也可以使用 `+` 快速转换类型：\n\n```javascript\n+\"1\"; // 将字符串 \"\
    1\" 转换为数字 1\n\"\" + 1; // 将数字 1 转换为字符串 \"1\"\n```\n\n关于类型转换，你可以使用 `!!` 转换为布尔值：\n\
    \n```javascript\n!!true // true\n!!false // false\n```\n\n第一个 `!` 取反，当值为假时返回布尔值真，第二个\
    \ `!` 再次取反得到想要的结果。此外，构造函数（你稍后会详细介绍）也可以用于类型转换：\n\n```javascript\nNumber(\"1\")\
    \ === 1; // true\nString(100) === \"100\"; // true\nBoolean(0) === false; // true\n\
    Boolean(100) === true; // true\n```\n\n# void\n\n你可能会另一个运算符是 `void`。它接受任何表达式作为操作数并返回\
    \ `undefined`：\n\n```javascript\nvar a = void 1;\ntypeof a === \"undefined\";\
    \ // true\n```\n\n`void` 运算符很少用，但有时用在链接的 `href` 中。由于类型运算符，人们经常将其与分组运算符 `()` 混淆，使其看起来像函数调用：\n\
    \n> <-- 不是一种良好的做法 --\n<a href=\"javascript:void(0)\">点击后无反应</a>\n\n这种做法看起来很无害，但仔细想想，它既愚蠢又常见。这里是发生的过程：\n\
    \n1. 用户点击，执行一个 JavaScript 表达式。\n2. 字面量值 0 作为操作数发送给分组运算符 `()`。\n3. 分组运算符返回组中的最后一个值，0。\n\
    4. 0 被发送给 `void` 运算符。\n5. `void` 作为一个黑洞，接收操作数并返回 `undefined`。\n\n忽略无功能链接的损坏语义，人们完全可以将\
    \ `href` 设置为 `javascript:undefined`。\n\n# 逗号运算符\n\n逗号运算符是另一个奇怪的运算符。它是 JavaScript\
