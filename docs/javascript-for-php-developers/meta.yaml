    \ { // true\n  // Do something\n}\n```\n\nThe difference is that in only tests\
    \ for the presence of the property; it doesn't look at the value at all. Testing\
    \ with clothes.shirt returns true only if the property exists *and* has a non-falsy\
    \ value.\n\nAs an example, if you add a new property:\n\n```\nclothes.jacket =\
