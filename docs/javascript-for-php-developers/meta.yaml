  mdcn: "\n字符串的数组访问（例如 `red[1]`）在 ES5 中已定义，但在旧版 IE 中无法工作。\n\n另一个例子：一个极客的笑话，说万圣节实际上是圣诞节，因为大家都知道\
    \ 10 月 31 日 = 12 月 25 日。使用 JavaScript 控制台，你可以检查自己是否懂了这个笑话。October = Oct = 8，December\
    \ = Dec = Decimal = 10，以此类推：\n\n```javascript\nparseInt(31, 8) === parseInt(25,\
    \ 10); // true\n```\n\n#  URL 编码\n\n另外四个全局函数处理 URL 编码：\n\n### encodeURIComponent()\
    \ 和 decodeURIComponent()\n这些函数类似于 PHP 的 `urlencode()` 和 `urldecode()`。\n\n###\
    \ encodeURI() 和 decodeURI()\n这些与 `encodeURIComponent()` 和 `decodeURIComponent()`\
    \ 类似，但它们在只对需要编码的部分时产生有效的 URL，而对 `://` 等内容保持不变，将其分为四组：\n\n```javascript\nvar url\
    \ = 'http://phpied.com/search=js php';\nencodeURIComponent(url); // \"http%3A%2F%2Fphpied.com%2Fsearch%3Djs%20php\"\
    \ndecodeURI(url);         // \"http://phpied.com/?search=js%20php\"\n```\n\n注意\
    \ `encodeURI()` 不编码 `&`，取决于你尝试如何处理查询字符串，这可能是一个问题也可能是一个特性：\n\n```javascript\nvar\
    \ qs = 'helloworld&jello=m o n';\nURIComponent(qs); // \"hello%3Dworld%26jello%3Dm%20o%20a%20n\"\
    \ndecodeURI(qs);     // \"helloworld&jello=m%20o%20a%20n\"\n```\n\n你可能还会遇到 `escape()`\
    \ 和 `unescape()` 函数。它们不是 ECMAScript 的一部分，而是来自 BOM。它们的工作与 `encodeURI()` 和 `encodeURIComponent()`\
    \ 略有不同，不应使用。\n\n# 内置构造函数\n\nJavaScript 中大多数内置的、即用的功能都是通过它的全局构造函数和两个“其他”全局对象实现的：它们作为构造函数本身的属性和方法，也可以作为原型属性的一部分。构造函数可以分为四组：\n\
    \n### Object(), Array(), RegExp(), 和 Function()\n这些很少被用于创建对象，因为它们有更短的语法版本。然而，无论你如何创建对象，它们的原型都充满了实用的属性。\n\
    \n### String(), Number(), 和 Boolean()\n这些也被直接用于创建对象，因为它们只是原始类型的包装器。在 JavaScript\
    \ 中，你可以轻松地在原始类型和它的对象包装器之间跳转，并且可以直接在原始类型上调用方法。\n\n### Date()\n拥有大量方法来处理日期。\n\n\
    ### Error()\n创建错误对象。错误对象是简单的，你可以选择抛出自己的错误对象并完全遗忘 `Error()` 构造函数。`Error()` 是通用的，还有更具体的错误构造函数（例如\
    \ `SyntaxError()`、`ReferenceError()` 等）。\n\n还有两个值得提及的全局对象：\n\n### Math\n这不是一个构造函数（所以你不能执行\
    \ `var m = new Math()`），而是一个全局对象，你可以在其中找到许多数学相关的属性和方法。例如：\n\n```javascript\nMath.min(3,\
    \ 5); // 3\nMath.E; // 2.718281828459045\n```\n\n### JSON\n这也不是一个构造函数，而是一个持有编码/解码字符串方法的对象。它是\
    \ ECMAScript 5 新增的内容，你将在第 6 章读更多关于它的信息。\n\n让我们详细检查所有这些构造函数。\n\n# Object\n\n`Object`\
    \ 构造函数如下创建对象：\n\n```javascript\nvar o = new Object();\n```\n\n这等同于对象字面量符号：\nvar\
    \ o = {};\n鉴于字面量更短，没有理由直接使用构造函数。\n\n使用 `Object()` 时可以省略 `new`，所以 `var o = Object();`\
    \ 与 `var o = new Object();` 相同。\n\n`Object` 构造函数还接受一个参数。根据参数类型，`Object` 作为一个工厂，并将对象创建的任务委托给另一个构造函数（例如\
    \ `String()` 或 `Boolean()`）：\n\n```javascript\nvar s = new Object('hello');\n\
    s.constructor === String; // true\n```\n\n这是避免直接调用 `new Object()` 的另一个原因。有时你并不知道会得到什么类型的对象。\n\
    \n# toString()\n\n`toString()` 方法存在于 `Object.prototype` 上，所以你可以这样使用它：\n\n```javascript\n\
    var o = {};\no.toString(); // \"[object Object]\"\n```\n\n或者：\n\n```javascript\n\
    var o = {};\nObject.prototype.toString(o); // \"[object Object]\"\n```\n\n该方法为你提供对象的字符串表示，所以：\n\
    \n```javascript\nObject.prototype.toString({}) === Object.prototype.toString({a:\
    \ 1}); // true\n```\n\n`toString()` 方法通常用于测试一个对象是否为数组。事实证明，测试某个东西是否为数组有点棘手（毕竟，数组也是对象）。尽管这看起来有点廉劣，但一个良好且健壮的模式是使用\
    \ `toString()`。\n\n考虑以下：\n\n```javascript\nvar a = [];\nvar array_like = {\n \
    \ length: 1,\n  0: 1\n};\n```\n\n如果你进行测试：\n\n```javascript\nif ('length' in array_like)\
    \ {}\n```\n\n或者\n\n```javascript\nif (array_like.hasOwnProperty('0')) {}\n```\n\
    \n（注：原文文本后续部分出现大量重复和乱码，已根据逻辑截断或清理。）\n"
