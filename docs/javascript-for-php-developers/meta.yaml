    \ JavaScript 有了这么多了解，你会发现这些幕后的细节很有趣。以下用于检查书籍示例的 JSHint 选项完整列表：\n\n```javascript\n\
    var lintopts = {\n  indent: 2, // 缩进两个空格\n  plusplus: false, // 允许 ++ 和 --\n \
