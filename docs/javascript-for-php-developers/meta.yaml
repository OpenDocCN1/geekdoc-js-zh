    \ 是另一个字符串格式化函数：\n\n```javascript\nvar date = new Date(2012, 11, 31);\ndate.toDate();\
    \ // \"Mon Dec 31 2012\"\ndate.toJSON(); // \"2012-12-31T08:00:00.000Z\"\n```\n\
    \ntoJSON() 用于以 JSON 格式表示日期非常方便，并在稍后看到的 JSON.stringify() 中。事实上，存在 Date.prototype.toJSON()，它的返回值与\
    \ toJSON() 相同：\n\n```javascript\nvar today = new Date();\ntoday.toJSON() === today.toISOString();\
    \ // true\n```\n\n# Function.prototype.bind()\n\n由于函数可以作为参数传递，并且在函数内部取决于它是被调用的，因此在使用它时如果不能确定它符合预期似乎是有风险的。考虑这个例子：\n\
    \n```javascript\nvar breakfast = {\n  drink: \"coffee\",\n  eat: \"bacon\",\n\
    \  my: function () {\n    return this.drink + \" & \" + this.eat;\n  };\n};\n\n\
    breakfast.my(); // \"coffee and bacon\"\n```\n这里没有意外。然而，你可能想要一个新的引用，例如：\n\n```javascript\n\
    var morning = breakfast.my;\nmorning(); // \"undefined and undefined\"\n```\n\n\
    在这种情况下，这是全局对象，并且没有 drink 或 eat 属性。但你可以将 my() 方法绑定到 breakfast 对象，并使其按预期工作：\n\n\
    ```javascript\nvar morning = breakfast.my.bind(breakfast);\nmorning(); // \"coffee\
    \ and bacon\"\n```\n\n# JSON\n\n在结束对 ECMAScript 5 的讨论之前，让我们来看看 JSON 对象。它是 ES5\
    \ 的一个新增内容，标准化了所有浏览器（包括 IE8+）中已经实现的内容。JSON 代表“JavaScript 对象表示法”，是一种数据交换格式，它使用 JavaScript\
    \ 对象和数组字面量来编码任意数据。\n\nJSON 有两个（不幸命名的）方法——stringify() 和 parse()——它们对应于 PHP 的 json_encode()\
    \ 和 json_decode()；\n\n```javascript\nJSON.stringify({hello: \"world\"}); // {'hello':\
    \ 'world'}\nJSON.parse('{\"hello\": \"world\"}').hello; // \"world\"\n```\n\n\
    在不支持原生 JSON 的环境中，你可以使用此处提供的 shim（垫片）。\n\n# 垫片 (Shims)\n\n“Shims” 或 “polyfills”\
    \ 是在旧环境中支持新 API 的方法。在 JavaScript 中，你可以更改内置对象和原型，因此你可以模拟新的 API。这里有一个 shim 的例子：\n\
    \n```javascript\nif (!Date.now) {\n  Date.now = function () {\n    return new\
    \ Date().getTime();\n  }\n}\n```\n\n或者：\n\n```javascript\n// source:\n// https://developer.mozilla.org/en-US/docs/JavaScript/Reference/\n\
    //         Global_Objects/String/Trim\nif (String.prototype.trim) {\n  String.prototype.trim\
    \ = function () {\n    return this.replace(/^\\s+|\\s+$/g, '');\n  }\n}\n```\n\
    \n如你所见，shims 允许你在旧版浏览器中使用现代功能。\n\n# 私有属性\n\n在本节的示例中，私有变量被赋予了公共访问：\n\n```javascript\n\
    var my = (function () {\n  var hidden_private = 42;\n  return {\n    hi: 1,\n\
    \    bye: function () {\n      return hidden_private;\n    }\n  };\n})();\n\n\
    my.hi; // 1\nmy.bye(); // 43\nmy.hi = 100; // 100\nmy.bye(); // 142\n```\n你可以看到，属性\
    \ hi 可以在闭包外部被修改，而内部调用 special() 的方法 get() 仍然可以使用更新后的值工作。\n\n# 私有方法\n\n与普通变量一样，你也可以将函数放在闭包内部。它们可以访问内部的所有内容，因此它们可以访问局部变量。这里有一个例子，你有一个\
    \ special() 函数，它可以访问局部变量：\n\n```javascript\nvar my = (function () {\n  var hidden_private\
    \ = 42;\n  var public_api = {\n    hi: 1,\n    get: function () {\n      return\
    \ public_api.hi + hidden_private;\n    }\n  };\n  return public_api;\n})();\n\n\
    my.hi; // 1\nmy.get(); // 43\n```\n\n# 暴露私有对象\n\n在本节的示例中，私有函数 special() 被赋予了公共访问：\n\
    \n```javascript\nvar my = (function () {\n  function special() {\n    return \"\
    ohai\";\n  }\n  return {\n    hi: 1,\n    get: special\n  };\n})();\n```\n\n另一种这种方法如下：\n\
    \n```javascript\nvar my = {\n  hi: 1,\nget: special\n};\n```\n\n第二个例子更简单且对于大多数用例都良好，但它确实带有某种风险。由于\
    \ special() 是一个函数，它也是对象，因为对象是通过引用传递的，这意味着闭包外部的代码可以修改该对象的属性。\n\n让我们考虑一个更简单的例子：\n\
    \n```javascript\nvar my = (function () {\n  function special() {\n    return \"\
    ohai\";\n  }\n  return {\n    hi: 1,\n    get: special\n  };\n})();\n```\n"
