    \ snap can be tampered with, but the important stuff stays safe:\n\n```\nmy.getStuff().a.b.push(3);\
    \ // \"1,2,3\"\nmy.getStuff().a.b.toString();\nmy.getRealStuff().a.b.toString();\
    \ // \"1,2\"\n```\n\nOf course, in ES3 everything is mutable, nothing prevents\
