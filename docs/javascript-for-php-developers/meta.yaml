    \ what you expect it to be. Consider this example:\n\n```javascript\nvar breakfast\
    \ = {\n  drink: \"coffee\",\n  eat: \"bacon\",\n  my: function () {\n    return\
    \ this.drink + \" & \" + this.eat;\n  };\n};\n\nbreakfast.my(); // \"coffee and\
    \ bacon\"\nNo surprises here. However, you may want a new reference, say:\n\n\
    ```javascript\nvar morning = breakfast.my;\nmorning(); // \"undefined and undefined\"\
    \n```\n\nIn this case, this is the global object and there are no drink or eat\
    \ properties. But you can bind my() method to the breakfast object and have it\
    \ work as expected:\n\n```javascript\nvar morning = breakfast.my.bind(breakfast);\n\
    morning(); // \"coffee and bacon\"\n```\n\n# JSON\n\nTo wrap up the discussion\
    \ of ECMAScript 5, let's take a look at the JSON object. It's an addition to ES5\
    \ that standardizes what's already implemented in all browsers, including IE8+.\
    \ JSON stands for \"JavaScript Object Notation\" and is a data exchange format\
    \ that uses JavaScript object and array literals to encode arbitrary data.\n\n\
    JSON has two (unfortunately named) methods—stringify() and parse()—which correspond\
    \ to PHP's json_encode() and json_decode();\n\n```javascript\nJSON.stringify({hello:\
    \ \"world\"}); // {'hello': 'world'}\nJSON.parse('{\"hello\": \"world\"}').hello;\
    \ // \"world\"\n```\n\nIn environments that don't support JSON natively, you can\
    \ use the shim available here.\n\n# Shims\n\n\"Shims,\" or \"polyfills,\" are\
    \ a way to support new APIs in older environments. Since in JavaScript you can\
    \ change built-in objects and prototypes, you can emulate the new APIs. Here's\
    \ an example of a shim:\n\n```javascript\nif (!Date.now) {\n  Date.now = function\
    \ () {\n    return new Date().getTime();\n  }\n}\n```\n\nor:\n\n```javascript\n\
    // source:\n// https://developer.mozilla.org/en-US/docs/JavaScript/Reference/\n\
    //         Global_Objects/String/Trim\nif (String.prototype.trim) {\n  String.prototype.trim\
    \ = function () {\n    return this.replace(/^\\s+|\\s+$/g, '');\n  }\n}\n```\n\
    \nAs you can see, the shims allow you to use modern features in older browsers.\n\
    \n# Private Properties\n\nIn the example in this section, the private variable\
    \ was given public access:\n\n```javascript\nvar my = (function () {\n  var hidden_private\
    \ = 42;\n  return {\n    hi: 1,\n    bye: function () {\n      return hidden_private;\n\
    \    }\n  };\n})();\n\nmy.hi; // 1\nmy.bye(); // 43\nmy.hi = 100; // 100\nmy.bye();\
    \ // 142\n```\n\nIn you can see, the property hi can be modified outside the closure,\
    \ and the method get(), which internally calls special(), will still work with\
    \ the updated value.\n\n# Private Methods\n\nJust like regular variables, you\
    \ can also put functions inside the closure. They have access to everything inside,\
    \ so they can access local variables. Here's an example where you have a special()\
    \ function, which can access local variables:\n\n```javascript\nvar my = (function\
    \ () {\n  var hidden_private = 42;\n  var public_api = {\n    hi: 1,\n    get:\
    \ function () {\n      return public_api.hi + hidden_private;\n    }\n  };\n \
    \ return public_api;\n})();\n\nmy.hi; // 1\nmy.get(); // 43\n```\n\n# Exposing\
    \ Private Objects\n\nIn the example in this section, the private function special()\
    \ was given public access:\n\n```javascript\nvar my = (function () {\n  function\
    \ special() {\n    return \"ohai\";\n  }\n  return {\n    hi: 1,\n    get: special\n\
    \  };\n})();\n```\n\nAnother way to do so is as follows:\n\n```javascript\nvar\
    \ my = {\n  hi: 1,\nget: special\n};\n```\n\nThe second example is simpler and\
    \ works fine for most use cases, but it does come with a certain risk. Since special()\
    \ is a function, it's also an object, and because objects are passed by reference,\
    \ this means that code outside the closure can modify the properties of that object.\n\
    \nLet's consider a simpler example:\n\n```javascript\nvar my = (function () {\n\
    \  function special() {\n    return \"ohai\";\n  }\n  return {\n    hi: 1,\n \
    \   get: special\n  };\n})();\n```"
