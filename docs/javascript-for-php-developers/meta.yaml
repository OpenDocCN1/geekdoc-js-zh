  md: "In PHP, when you capture interesting variables with use, you have the option\
    \ to pass them by reference or by value (as in the example). In JavaScript, you\
    \ always have references to the variables in closure scope.\n\n# Scope Chain\n\
    \nEvery time the JavaScript interpreter enters a new function, it looks around\
    \ to see what local variables are available. It gathers those and puts them in\
    \ a special *variables* object.\n\nIf there's another function defined inside\
    \ the first and the interpreter enters its body, another *variables* object is\
    \ created for the inner function. The inner function also gets a special scope\
    \ property, which points to the *variables* object of the outer function. The\
    \ outer function is where the inner function was defined, as if in a dictionary.\
    \ That's why you hear the term \"lexical\" (\"lexical definition\" being synonymous\
    \ with \"dictionary definition\") to highlight the difference between definition\
    \ of a function and its execution. The scope property is set during the function\
    \ definition, not execution.\n\nThe *variables* object and the *scope* property\
    \ are invisible from the programmer's perspective, but the following snippet `__variables`\
    \ and `__scope` for illustration. `(__scope)` is in the ECMAScript specs.\n\n\
    If you are not defined inside another, it's in the global space (the global scope).\
    \ This place in the Universe also has a *variables* object containing all the\
    \ variables in the global scope. The *scope* property of the global function will\
    \ hold a reference to the global object.\n\nConsider a global function:\n\n```\n\
    var global_ten = 10;\n// __variables object contains all global variables\n//\
    \ {\n//   global_ten: 10,\n//   papa: function () {...},\n//   all other globals\n\
    //}\n```\n\n```\nfunction papa() {\n  var hundred_more = 100;\n  // __variables\
    \ object has {hundred_more: 100}\n  // __scope property points to the variable\
    \ object of the outer\n  // Lexical environment (in other words, the global __variables\
    \ object)\n}\n```\n\nHere's the reality represented in a linked list:\n\npapa.__scope\
    \ -> global __variables\n\nLet's take a look at the previous code sample again,\
    \ this time with line numbers:"
