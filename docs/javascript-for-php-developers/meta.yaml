  mdcn: "\n函数是对象，就像任何其他对象一样，它们可以作为参数传递。这里有一个演示这些内容的示例：\n\n```javascript\nfunction\
    \ goForIt(a, b, what) {\n  return function () {\n    return what(a, b);\n  }\n\
    }\n```\n\n此函数接收一个名为 `what` 的参数，预期是一个函数。你也可以将赋值给 `what` 的函数作为回调函数。`goForIt()` 函数返回一个不同的（匿名）函数，该函数返回执行回调的结果：\n\
    \n```javascript\nvar sumOneAndTwo = goForIt(1, 2, function (one, two) {\n  return\
    \ one + two;\n});\n```\n\n`sumOneAndTwo` 的值是什么？它不是 3，而是一个返回 3 的函数：\n\n```javascript\n\
    sumOneAndTwo(); // 3\n```\n\n注意执行回调的行：\n\n```javascript\nreturn what(a, b);\n\
    ```\n\n它可以被写成：\n\n```javascript\nwhat.call(null, a, b);\n```\n\n或者：\n\n```javascript\n\
    what.apply(null, [a, b]);\n```\n\n（稍后你会看到更多关于 `null` 参数的介绍。）\n\n你可以像这样现场定义回调函数：\n\
    \n```javascript\nvar sumOneAndTwo = goForIt(1, 2, function (one, two) {\n  return\
    \ one + two;\n});\n```\n\n这就像你在 PHP 中传递闭包作为回调一样。\n\n但你也可以复用你现有的另一个函数：\n\n```javascript\n\
    function sum(a, b) {\n  return a + b;\n}\n```\n\n```javascript\nvar mysum = goForIt(1,\
    \ 99, sum);\nmysum(); // 100\n```\n\n```javascript\n// 或者\ngoForIt(1, 99, sum());\
    \ // 100\n```\n\n# 回调不是字符串\n\n注意，你不要将回调包裹在引号中，这意味着你没有把它作为字符串传递：\n\n```javascript\n\
    // 错误做法\ngoForIt(11, 22, \"sum()); // TypeError: not a function\n```\n\n在之前的代码段中，`sum`\
    \ 是一个函数对象而不是字符串，因此将其包裹在引号中意味着它将尝试将字符串作为函数执行，这是行不通的。\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_67_0.png)\n\
    \n在 PHP 中，传统上回调是使用函数名作为字符串传递给 `call_user_func()` 定义的（例如），但由于语言引入了闭包，这种做法变得越来越少见。\n\
    \n然而，某些浏览器函数（例如 `setTimeout()`）接受回调，并且足够友好，可以处理人们真的传递字符串的情况。\n\n假设你有这样一个函数：\n\n\
    ```javascript\nfunction showTime() {\n  alert(new Date());\n}\n```\n\n你可以调度它在\
    \ 1 秒（1000 毫秒）后执行：\n\n```javascript\nsetTimeout(showTime, 1000);\n```\n\n你也可以看到人们像这样做：\n\
    \n```javascript\nsetTimeout(\"showTime()\", 1000);\n```\n\n这可以行通，但感觉不对劲，因为你预期传递的是一个函数值，而不是字符串。这意味着\
    \ `setTimeout()` 会检查你传递的内容，如果是字符串，它会对其求值。一个简单的实现大致如下：\n\n```javascript\nfunction\
    \ setTimeout(callback, when) {\n  // 当时间到了时 ...\n\n  if (typeof callback === \"\
    string\") {\n    function () {\n      eval(callback);\n    }()\n  } else {\n \
    \   callback();\n  }\n}\n```\n\n总结来说，你将函数值作为回调传递时时不加引号，也不加 `()`，因为你并不是在传递时执行该函数；你希望在稍后合适的时候再调用它。\n\
    \n最后一点：你有没有注意到你可以通过添加括号来立即执行另一个函数返回的函数？\n\n```javascript\ngoForIt(11, 22, sum)();\
    \ // 33\n```\n\n# 第四章\n\n# 面向对象编程\n\n本章讨论了 JavaScript 的面向对象特性，包括对象、构造函数和原型。它还讨论了代码复用和继承。\n\
    \n# 构造函数与类\n\n在 PHP 中，如果你有一个 `Dog` 类，你可以使用以下代码创建该类的 `$fido` 实例：\n\n```php\n//\
    \ PHP\n$fido = new Dog();\n```\n\n JavaScript 有相似的语法：\n\n```javascript\n// JavaScript\n\
    var fido = new Dog();\n```\n\n一个重要的区别是 `Dog` 在 JavaScript 中并不是类，因为该语言中没有类。`Dog`\
    \ 只是一个函数。但旨在创建对象的函数被称为构造函数。\n\n在语法上，普通函数和构造函数之间没有区别。区别在于意图。因此，为了可读性，通常惯例是将构造函数名的首字母大写。\n\
    \n当你使用 `new` 算符调用函数时，它总是返回一个对象。该对象在函数体内部被称为 `this`。即使你在函数中没有做任何特殊处理，也会发生这种情况。请记住，否则（在不带\
    \ `new` 调用时），每个没有显式返回的函数都会返回 `undefined`：\n\n```javascript\nfunction Dog() {\n\
    \  this.name = \"Fido\";\n  this.sayName = function () {\n    return \"Woof! \"\
    \ + this.name;\n  }\n}\nvar fido = new Dog();\nfido.sayName(); // \"Woof! Fido\"\
    \n```\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_71_0.png)\n\n在 JavaScript 中，就像在\
    \ PHP 中一样，如果不向构造函数传递参数，括号是可选的，这也是有效的：`var fido = new Dog;`\n\n如果你在控制台输入 `fido`，你会发现它有两个属性：`name`\
    \ 和 `sayName`。某些控制台还会显示一个名为 `__proto__` 的特殊属性，但你可以暂时忽略它。\n\n看看 `setName` 属性。由于函数在\
    \ JavaScript 中是对象，它们可以赋值给属性，在这种情况下你可以调用它们。在 JavaScript 中，属性和方法之间并没有真正的区别。\n\n\
    # 返回对象\n\n当你使用 `new` 调用函数时，会发生以下情况：\n\n1. 在后台自动创建一个通过 `this` 用的的对象。\n2. 属性被添加到该\
    \ `this` 对象。\n3. 如果函数返回一个对象，则返回该对象；否则，返回新创建的对象。\n"
