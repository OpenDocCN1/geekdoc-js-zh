    \ the JavaScript interpreter's job. But you can make the code more explicit and\
    \ easier to read. The other option—defining variables where you need them—means\
    \ in mental effort to do every time you read a (potentially long) function:\n\n\
    ```\nfunction mine() {\n  // Declare all, once at the top\n  var a, b = 2, c =\
