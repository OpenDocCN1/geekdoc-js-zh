  md: "To make getStuff() more efficient, you can use an immediate function that precomputes\
    \ the JSON encode/decode and returns a snapshot of stuff at the time of definition:\n\
    \n```\nvar my = (function () {\n\n  var stuff = {\n    a:\n      b: [1, 2]\n \
    \ };\n\n  return {\n    getStuff: function () {\n      var snap = JSON.parse(JSON.stringify(stuff));\n\
    \      return function () {\n        return snap;\n      }\n    }(),\n\n    getStuff:\
    \ function () {\n      return JSON.parse(JSON.stringify(stuff));\n    }\n  };\n\
    });\n```\n\nHere you have an anonymous function (notice the () at the end of getStuff())\
    \ that clones stuff snap. Then this function returns a new function that simply\
    \ returns the existing snap. Later, when you do my.getStuff(), it's the inner\
    \ function that is executed, and it has access to snap because both snap and the\
    \ inner function were created inside the closure created by the inner (wrapper)\
    \ function.\n\nNow calls to getStuff() return snap, which is not protected via\
    \ a clone. Therefore, snap can be tampered with, but the important stuff stays\
    \ safe:\n\n```\nmy.getStuff().a.b.push(3); // \"1,2,3\"\nmy.getStuff().a.b.toString();\n\
    my.getRealStuff().a.b.toString(); // \"1,2\"\n```\n\nOf course, in ES3 everything\
    \ is mutable, nothing prevents you from overwriting or wiping out the public API\
    \ getStuff() and getReal() and destroying all hard work of carefully protecting\
    \ private properties and methods. In other, if you want to shoot yourself in the\
    \ foot, there are certainly easy ways to do so:\n\n```\nmy.getRealStuff = function\
    \ () {\n  return \"or don't\";\n};\ndelete my.getStuff(); // true\n```\n\n```\n\
    my.getRealStuff(); // \"or don't\"\nmy.getStuff(); // Error: no such method\n\
    ```\n\n118 | Chapter 7: JavaScript Patterns"
