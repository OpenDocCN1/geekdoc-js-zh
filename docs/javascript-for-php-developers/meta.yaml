  md: "Functions are objects, and like any other objects, they can be passed as arguments.\
    \ Here’s an example that demonstrates all of this:\n\n```\nfunction goForIt(a,\
    \ b, what) {\n  return function () {\n    return what(a, b);\n  }\n}\n```\n\n\
    This function takes the parameter named what, which is expected to be a function.\
    \ You could also call the function assigned to what a callback function. The goForIt()\
    \ function returns a different (anonymous) function which returns the result of\
    \ executing the callback:\n\n```\nvar sumOneAndTwo = goForIt(1, 2, function (one,\
    \ two) {\n  return one + two;\n});\n```\n\nWhat is the value of sumOneAndTwo?\
    \ It’s not 3, but it’s a function that returns 3:\n\n```\nsumOneAndTwo(); // 3\n\
    ```\n\nNote the line that executes the callback:\n\n```\nreturn what(a, b);\n\
    ```\n\nIt can be written as:\n\n```\nwhat.call(null, a, b);\n```\n\nor:\n\n```\n\
    what.apply(null, [a, b]);\n```\n\n(You’ll see more about the null argument in\
    \ just a bit.)\n\nYou can define the callback function on the spot, like this:\n\
    \n```\nvar sumOneAndTwo = goForIt(1, 2, function (one, two) {\n  return one +\
    \ two;\n});\n```\n\nThis is just like you’d pass a closure as a callback in PHP.\n\
    \nBut you can also reuse a different function you already have laying around:\n\
    \n```\nfunction sum(a, b) {\n  return a + b;\n}\n```\n\n```\nvar mysum = goForIt(1,\
    \ 99, sum);\nmysum(); // 100\n```\n\n```\n// Also\ngoForIt(1, 99, sum()); // 100\n\
    ```"
