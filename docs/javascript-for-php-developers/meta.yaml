    \ 通过 JSON 进行深拷贝\n\n创建深拷贝最简单的方法是对对象进行 JSON 编码。这可能不是最高效的方法，特别是在不支持 JSON 的浏览器中，但它确实很短：\n\
    \n```\nvar my = (function () {\n\n  var stuff = {\n    a: {\n      b: [1, 2]\n\
    \    }\n  }\n\n  return {\n    getStuff: function () {\n      return JSON.parse(JSON.stringify(stuff));\n\
