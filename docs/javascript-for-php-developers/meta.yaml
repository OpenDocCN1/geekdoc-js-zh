    # Looping Alternatives


    In ES3, if you want to get a list of all properties (like array_keys() in PHP),
    then you have to do a for-loop. In ES5, you can use Object.keys() or Object.getPropertyNames().
    The keys() method gives you enumerable properties (those that will show up in
    a for-loop), while getOwnPropertyNames() returns all properties, enumerable or
    not.


    Both methods work on own properties only, unless you don''t use descriptors to
    set the enumerable attributes:


    ```

    var pizza = {tomatoes: true, cheese: true};

    Object.keys(pizza); // ["tomatoes", "cheese"]

    Object.getOwnPropertyNames(pizza); // ["tomatoes", "cheese"]

