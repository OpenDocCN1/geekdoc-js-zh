    \ JSON.parse(JSON.stringify(stuff));\n    }\n  };\n})();\n```\n\n### 常量\n\nJavaScript\
    \ 环境提供了 `const` 语句，可以替代 `var`：\n\n```javascript\nconst PI = 3.14;\n```\n\n但在 ES5\
