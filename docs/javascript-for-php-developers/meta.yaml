    ## 第1章 引言


    JavaScript 多来声誉不。许多开发者认为编写 JavaScript 是一种痛苦，因为程序的行为非常不可预测。编码完成后，他们会打开另一个浏览器进行测试，结果却收到另一个毫无用的错误信息（图
    1-1）。因此，开发者往往直接拒绝花精力研究这种语言。


    图 1-1. 失控的 JavaScript 错误


    事实证明，历史上大多数问题（诚实地说，现在也是）是由于浏览器在 DOM 和 BOM 实现上的差异，较小一部分是由于 JavaScript 语言本身。


    DOM 代表文档对象模型（Document Object Model）。它是用于处理如 XML、XHTML 和 HTML 等结构化文档的 API（应用程序编程接口）。DOM
    是一种语言无关的 API，也存在于 PHP 中。在 JavaScript 中，这个 API 非常容易识别：任何以 `document` 开头的内容都与 DOM
    有关。从历史角度来看，DOM 起于 JavaScript，后来由世界维网联盟（W3C）标准化为一种独立于 JavaScript 或任何其他语言的 API。如今，你仍然可以发现原始
    DOM（现在称为 DOM）的遗迹——例如 `document`、`images`（页面上的所有图像）和 `document links`（所有链接），它们在版本
    1 中被更通用的方法取代，如 `document.getElementById()` 和 `document.getElementsByTagName()`。


    BOM 代表浏览器对象模型（Browser Object Model）。对于没有正式定义的东西来说这是一个很好的名字。它是浏览器相关属性和方法的集合，例如可用屏幕尺寸或状态栏。这些属性大部分以全局变量的形式存在（如
    `innerWidth`），尽管你不应将其视为窗口 对象的属性（例如 `window.innerHeight`）。BOM 长期没有标准化，所以你可以想象的，不同浏览器之间存在差异。HTML5
    开始规范浏览器之间的共同行为，即常见的 BOM 对象。


    另一个你需要了解的是 ECMAScript。当你剥离 DOM 和 BOM 后，这就是 JavaScript 的核心语言。它是处理语法、循环、函数、对象等的语言。JavaScript
    起于 Netscape 的创新，但后来被浏览器厂商复制，导致这种语言需要建立一个标准，以便所有实现者（浏览器厂商和其他）都必须遵守。该标准由欧洲计算机厂商协会（ECMA，现为
    Ecma International）定义，并称为 ECMAScript。从技术上讲，JavaScript 应该意味着 Mozilla 对 ECMAScript
    的实现（还有 JSC，即微软的实现），但事实并不是人们在说“JavaScript”时的意思。


    总而言之，当人们谈论 JavaScript 时，他们指的是一系列主题，包括 DOM、BOM 和 ECMAScript。所以：


    JavaScript = ECMAScript + DOM + BOM


    ## 本书范围


    自 Web 早期以来的一件好事是有有了大量高质量 JavaScript 库，例如 jQuery 和 YUI。

    '
