    \ see more about the null argument in just a bit.)\n\nYou can define the callback\
    \ function on the spot, like this:\n\n```javascript\nvar sumOneAndTwo = goForIt(1,\
    \ 2, function (one, two) {\n  return one + two;\n});\n```\n\nThis is just like\
    \ you’d pass a closure as a callback in PHP.\n\nBut you can also reuse a different\
    \ function you already have laying around:\n\n```javascript\nfunction sum(a, b)\
    \ {\n  return a + b;\n}\n```\n\n```javascript\nvar mysum = goForIt(1, 99, sum);\n\
