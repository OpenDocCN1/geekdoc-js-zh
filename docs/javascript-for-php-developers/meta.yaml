  - "[PAGE 131]\n\nYou can call the get() method directly or by using its call method:\n\
    \n```\nmy.get();              // \"ohai\"\nmy.get.call();    // \"ohai\"\n```\n\
    \nHowever, it's completely legal to overwrite the call method with something else,\
    \ if it is not an event:call:\n\n```\nmy.get.call() = \"not so special\";\n```\n\
    \nThe next time you try call(), you'll get an error because it's no longer callable:\n\
    \n```\nmy.get.call(); // TypeError: call is not a function\n```\n\nSo you have\
    \ to be careful when you expose objects publicly.\n\n# Returning Private Arrays\n\
    \nThe previous example showed how to expose a function, but you can expose arrays\
    \ (also objects) or other objects.\n\nSay you have a private array and you want\
    \ to give (but not write) access to it. Doing the following looks like it should\
    \ be a good enough protection:\n\n```\nvar my = (function () {\n\nvar days = [\"\
    Mo\", \"Tu\", \"We\", \"Th\", \"Fr\", \"Sa\", \"Su\\];\n\nreturn {\n  getDays:\
    \ function () {\n    return days;\n  }\n};\n}());\n```\n\nOutside the closure,\
    \ the get days just fine, and you don't have a direct way to access the private\
    \ days variable:\n\n```\nmy.getDays(); // [\"Mo\", \"Tu\", \"We\", \"Th\", \"\
    Fr\", \"Sa\", \"Su\"]\n```\n\nHowever, you get indirect access because the array\
    \ is an object and it's passed by reference, which you can use to add another\
