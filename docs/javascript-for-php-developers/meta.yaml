  md: "# A Different Syntax\n\nFunctions are objects, so they can be assigned to variables\
    \ just like all other data types.\nThe following snippet shows a perfectly valid\
    \ and commonly used syntax:\n\n```\nvar sum = function (a, b) {\n  return a +\
    \ b;\n}\n\nsum(2, 2); // 4\n```\n\nThis syntax shows what is called a function\
    \ expression, as opposed to the other syntax\nyou're familiar with, which is called\
    \ a function declaration. The function declaration is\nthe more common syntax,\
    \ and the only one available in PHP before version 5.3.\n\n![](img/7167a987f8e0f5a6179bb61bf22fe204_46_0.png)\n\
    \nThere's a semantic difference in the meaning of the function keyword\ndending\
    \ on the context. In a function expression, it's an operator in.\nA function declaration,\
    \ it's a statement.\n\nNote the trailing semicolon in the function expression.\
    \ Unlike function declarations,\nfunction expressions require a semicolon.\n\n\
    ![](img/7167a987f8e0f5a6179bb61bf22fe204_46_1.png)\n\nJavaScript has a semicolon\
    \ insertion mechanism where the interpreter\nadds the semicolons for if you forget\
    \ them. However, it's always\npreferable to add the semicolons yourself to avoid\
    \ ambiguities. It also\nves helpful when you minify your code in order to reduce\
    \ its size in\nproduction, because with minification, all the code is pretty much\
    \ on\nline.\n\nThere is one more syntax you may encounter called named function\
    \ expression (NFE).\nit looks like this:\n\n```\nvar sum = function plum(a, b)\
    \ {\n  return a + b;\n}\n\nsum(21, 21); // 42\nplum(21, 21); // Error: plum()\
    \ is not defined\n```\n\nThis sort of syntax can be helpful while debugging when\
    \ the debugger reads the non-\nstandard but commonly available name property of\
    \ the function object:\n\n```\nsum.name; // \"plum\"\n```"
