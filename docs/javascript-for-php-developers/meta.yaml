  md: "The grouping operator () is also commonly used even when not required, for\
    \ readability. In the following example, hardtread and easytread both have value\
    \ 1, but the presence of the opening ( signals to the reader of the code that\
    \ there is something going on here (otherwise, it is easy to confuse hardtread\
    \ to be a function and not the returned value of a function):\n\n```\nvar hardtread\
    \ = function () {\n  return 1;\n});\n```\n\n```\nvar easytread = (function ()\
    \ {\n  return 1;\n});\n```\n\n```\nhardtread === easytread; // true\n```\n\n#\
    \ Initialization\n\nOne use for immediate functions is one-off initialization.\
    \ Often, you want to do some initialization without leaving global variables behind.\
    \ If this initialization is complex enough that it needs temporary variables,\
    \ you can wrap all your initialization code in an immediate function to clean\
    \ up yourself.\n\nThe following code assigns click event handlers to buttons is\
    \ a good candidate:\n\n```\n(function () {\n  for (var i = 1; i <= 3; i++) {\n\
    \    document.getElementById('button-' + i).onclick = function () {\n      //\
    \ ...\n    }\n  }\n});\n```\n\nIf there was no immediate function, the variable\
    \ would remain in the global scope.\nAs you can see, the function closes over\
    \ variables used in the piece of code, hence the name closure.\n\n# Privacy\n\n\
    Immediate function are also used to achieve privacy. You can have global functions\
    \ that are defined in the closure of another function and share this closure's\
    \ local scope.\nHere's a simple iterator implementation:\n\n```\nvar next, previous,\
    \ rewind; // Globals\n```\n\n```\n(function () {\n  // Private data\n  var index\
    \ = -1;\n})\n```"
