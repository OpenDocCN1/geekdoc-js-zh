    # Confusing Dots


    Dots in JavaScript are used to access properties, but in PHP, they concatenate
    strings. When you are in PHP but you''re writing in JavaScript, you can often
    confuse the purpose out of habit:


    ```

    // JavaScript

    var world = "wrrld"

    var result = "hello " . world.

    ```


    Funny enough, this is not a syntax error in JavaScript. The result contains the
    value undefined, because the space around the dot is optional, so it works like
    this:


    ```

    "hello".world; // undefined

    ```


    In other words, you''re accessing the property of the string object "hello". String
    literals are converted to objects before the scenes, as if you new String("hello")
    (maybe this coming soon). Since this object doesn''t have such a property, the
    result is undefined.


