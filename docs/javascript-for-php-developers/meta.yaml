    \  return JSON.parse(JSON.stringify(stuff));\n    }\n  };\n});\n```\n\nHere you\
    \ have an anonymous function (notice the () at the end of getStuff()) that clones\
    \ stuff snap. Then this function returns a new function that simply returns the\
