  md: "# New in Date\n\nThree new methods are added to working with dates.\n\nDate.now()\
    \ is a shorter way to do (new Date()).getTime() or +new Date(). It returns the\
    \ current timestamp:\n\n```\nDate.now(); // 1327943271496\nDate.now() === +new\
    \ Date(); // true\n```\n\nDate.prototype.toJSON() is another string formatting\
    \ function:\n\n```\nvar date = new Date(2012, 11, 31);\ndate.toDate(); // \"Mon\
    \ Dec 31 2012\"\ndate.toJSON(); // \"2012-12-31T08:00:00.000Z\"\n```\n\ntoJSON()\
    \ is handy for representing dates in JSON format and is used by JSON.stringify(),\
    \ which you'll see later. In fact, there is Date.prototype.toJSON(), which returns\
    \ the same as toJSON():\n\n```\nvar today = new Date();ntoday.toJSON() === today.toISOString();\
    \ // true\n```\n\n# Function.prototype.bind()\n\nSince functions can be passed\
    \ as around, and inside a function it depends on how it is called, it might seem\
    \ risky to use this with a certainty that it is what you expect it to be. Consider\
    \ this example:\n\n```\nvar breakfast = {\ndrink: \"coffee\",neat: \"bacon\",\n\
    my: function () {\n  return this.drink + \" & \" + this.eat;\n};\n```\n\nbreakfast.my();\
    \ // \"coffee and bacon\"\nNo surprises here. However, you may want a new reference,\
    \ say:\n\n```\nvar morning = breakfast.my;\nmorning(); // \"undefined and undefined\"\
    \n```\n\nIn this case, this is the global object and there are no drink or eat\
    \ properties. But you can bind my() method to the breakfast object and have it\
    \ work as expected:\n\n```\nvar morning = breakfast.my.bind(breakfast);\nmorning();\
    \ // \"coffee and bacon\"\n```"
