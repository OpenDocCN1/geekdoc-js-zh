    # valueOf()


    This method depends on the type of object. For regular objects as arrays, regular
    expressions, and functions it return the object itself:


    ```

    var o = {}, a = [];

    o.valueOf() === o; // true

    a.valueOf() === a; // true

    ```


    For objects created by the primitive wrappers Number(), Boolean(), and String(),
    it returns the primitive value. For Date objects, it returns a timestamp (same
    as the get Time() method):


    ```

    new Number(9).valueOf() === 9; // true

    new String(''boo'').valueOf() === "boo"; // true

    typeof (new Date()).valueOf(); // "number"

    ```


