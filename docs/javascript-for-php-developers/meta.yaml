    \ string, boolean, and number. The other two are the types null and undefined.\n\
    \nThe undefined type has only one value—the value undefined. When you declare\
    \ a variable but not initialize it, it's initialized with undefined. Also, when\
    \ you have a function that doesn't return a value explicitly, it returns undefined:\n\
    \n```javascript\nvar a;\ntypeof a; // \"undefined\"\nvar b = 1;\nb = undefined;\n\
    typeof b; // \"undefined\"\n```\n\nNote that the typeof operator always returns\
    \ a string. In the previous example, b has the value undefined, but typeof returns\
    \ the string \"undefined\". It's common for newcomers to confuse the string \"\
    undefined\" and the value undefined. Consider these differences:\n\n```javascript\n\
    var b;\nb === undefined; // true\nb === \"undefined\"; // false\ntypeof b ===\
    \ \"undefined\"; // true\ntypeof b === undefined; // false\n```\n\nThe null type\
    \ has only one value—the value null. It's rarely useful, but can be passed in\
    \ function calls when calling functions that take a lot of arguments or when you\
    \ want to make an explicit difference between undeclared and uninitialized variables,\
    \ since undefined may mean either of those.\n\nSurprisingly, typeof returns \"\
    object\" when used with a null value:\n\n```javascript\nvar a = null;\ntypeof\
