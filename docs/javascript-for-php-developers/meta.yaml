  md: "And, of course, you can always consult the ECMA-262 specs.\n\n# Documenting\
    \ Your Code\n\nIf you're familiar with PHPDoc or JavaDoc, you'll be happy to learn\
    \ that you can use the same idea for inline commenting in JavaScript:\n\n```\n\
    /**\n * Sums two numbers\n * @param {Number} a First number\n * @param {Number}\
    \ b Second number\n * @return {Number} The sum\n */\nfunction sum(a, b) {\n  return\
    \ a + b;\n}\n```\n\nThere are several tools you can use to generate documentation\
    \ from comments, including JDoc Toolkit and YUIDoc.\n\nIn JavaScript, where you\
    \ have more than one choice to do tasks (e.g., inheritance), the documentation\
    \ system may not be able to decide the purpose of a piece of code, so it usually\
    \ provides you with special new tags such as @inherits, @class, or @constructor\
    \ that you can use to declare your intentions.\n\n# Unit Testing\n\nThere are\
    \ several projects that help you test your JavaScript code. One example is Jasmine,\
    \ which has a plain-English type of API.\n\nLet's say you want to test the following\
    \ function:\n\n```\nfunction Text(txt) {\n  this.input = txt;\n}\n```\n\n```\n\
    Text.prototype.get = function () {\n  return this.input;\n}\n```\n\nYour test\
    \ file would look like this:\n\n```\ndescribe(\"Text\", function () {\n  // first\
