    \ the HTTP parameter to POST (or PUT).\n2. Set the Content-Type of the incoming\
    \ data.\n3. Send the data itself.\n\nYou can easily accomplish these tasks with\
    \ curl. You do the first simply by changing the method name, by specifying HTTP\
    \ headers with the -H flag to curl, and the last you can do in a few different\
    \ ways, but here you can use the -d flag and just write the JSON as a string.\n\
