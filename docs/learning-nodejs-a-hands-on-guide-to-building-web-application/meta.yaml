  md: '# Get Started Fast with Node.js Apps and Server Development


    Node.js makes it far easier to create fast, compact, and reliable web/network
    applications and web servers, and is rapidly becoming indispensable to modern
    web developers.


    Learning Node.js brings together the knowledge and JavaScript code you need to
    master the Node.js platform and build server-side applications with extraordinary
    speed and scalability.


    You''ll start installing and running Node.js, understanding the extensions it
    uses, and quickly writing your first app. Next, building on the basics, you''ll
    write more-capable application servers and extend them with today''s most powerful
    Node.js tools and modules. Finally, you''ll discover today''s best practices for
    testing, running Node.js code on production servers, and writing command-line
    utilities.


    Throughout the book, Marc Wandsneider teaches by walking line-by-line through
    carefully crafted examples, demonstrating proven techniques for creating highly
    efficient applications and servers.


    > If you''re a developer who wants to build server-side web applications with
    Node.js, Learning Node.js is your fastest route to success.


    +   - Node.js nonblocking I/O and async programming

    - Handle more requests and increase your application''s flexibility

    - Use and write your own modules

    - Perform common JSON/web server tasks

    - Use browsers to generate pages on the fly via Ajax calls and template libraries

    - Simplify development with the Express framework


    +   - Create database back-ends using popular NoSQL and relational databases

    - Deploy and run Node.js apps on Unix/OS X or Windows servers

    - Take advantage of multiprocessor hardware

    - Support virtual hosts and SSL/HTTPS security

    - Test Node.js programs that make synchronous, async, and RESTful server API functionality


    Register your book at informit.com/register for convenient access to updates,
    downloads, and to become available.

    ARC WANDSCHEIDER, senior developer advocate at Google, has more than 20 years
