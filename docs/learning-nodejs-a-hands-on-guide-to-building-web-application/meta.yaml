  md: '# Getting Started


    In this chapter, you dive right into things and get Node.js installed on your
    machines and make sure it is working correctly before moving further into the
    language and writing networked applications. By the end of this chapter, you should
    have Node installed and running on your computer, have entered a few small test
    programs to play around with it, and know how to use the built-in Node debugger.


    # Installing Node.js


    Let''s begin by looking at installation on Windows. Mac and Linux users should
    feel free to skip ahead to the appropriate sub-section, unless you have both types
    of machines.


    # Installation on Windows


    To install Node.js on a Windows machine, you can use the handy installer provided
    on the nodejs.org website. Visit the Download page and download Windows Installer
    (.msi) for either 32 bits or 64 bits, depending on what platform you are running.
    We show the installation for Windows 7/64-bit.


    After you download the MSI, double-click on it. You should see a setup program
    similar to that shown in Figure 1.1.


    Read and accept the License Agreement and then click Install. Because the install
    is pretty quick and painless, a few seconds later, you can click Finish to complete
    the installation.


    # Verifying the Installation


    To test the installation of the Node software, you can use the Windows command
    prompt cmd.exe. (If you are using PowerShell, that also works just fine.) If you
    are not familiar with this, you can launch it by going to Start / Run and then
    typing cmd, as shown in Figure 1.2.'
