    \ \\\n-d \"album_name: new album name\" \\ \\\n://localhost:8080/albums/old_album_name/rename.json\n\
    \nModifying the handle_incoming_request to accept the new request type is pretty\
    \ easy:function handle_incoming_request(req, res) {\n\n```\n// parse the query\
    \ parameters into an object and get the path\n// without them. (nd param true\
    \ = parse the parameters).\nreq_url = url.parse(req.url, true);\nvar core_url\
    \ = req.parsed_url.pathname;\n\n// test this fixed url to see what they're asking\
    \ for\nif (core_url == '/albums.json' && req.method.toLowerCase() == 'get') {\n\
    \    handle_list_albums(req, res);\n} else if (core_url.substr(core_url.length\
    \ - 12) == '/rename.json'\n&& req.method.toLowerCase() == 'post') {\n    handle_rename_album(req,\
    \ res);\n} else if (core_url.substr(0, 7) == '/albums'\n&& core_url.substr(core_url.length\
    \ - 5) == '.json'\n&& req.method.toLowerCase() == 'get') {\n    handle_get_album(req,\
    \ res);\n```"
