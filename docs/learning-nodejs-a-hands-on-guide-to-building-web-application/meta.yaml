    # HTTP Basic Authentication: Is It Secure?


    As I explain in this chapter, HTTP Basic Authentication is a relatively simple
    form of security.

    The client passes a header with a username and base64 encoded to the server with
    every request, which is authenticated by the server before processing it. Because
    base64 encoding is not a form of encryption, it amounts to passing plain-text
    usernames and passwords over the Internet. So you might ask: Is that fundamentally
    insecure?


    The answer is, no. Most secured portions of websites are encrypted and sent over
    the network using SSL/HTTPS. This method of sending encrypted traffic between
    a client and server is pretty safe, and what you should absolutely set up on your
    servers as well.

    Other people argue that browsers remember Basic Auth usernames and passwords,
    and this can be insecure. This argument is valid, and this is why you use Basic
    Auth only for API servers. For browser-based applications, you should stick with
    regular login pages and session cookies.


    So, although HTTP Basic Authentication can be insecure, with a little preparation
    and precaution, there is no reason it cannot be a production-level security system
    for your REST API servers.


    Clients do not remember sessions from API users, because they are not passing
    cookies around, so no login state is stored. These users need to authenticate
    every single request. To do this, they pass headers of the following format:


    Authorization: Basic username:password base64 encoded


    For example, to send the credentials for marcwan@example.com with the password
    kittycaton-keyboard, you would send


    Authorization: Basic bWFy3dhkbBlBlGtcXcxlLm9Y2zpraXR0EWNhdG9ua2V55Ym9hcmQ='
  merge: -1
