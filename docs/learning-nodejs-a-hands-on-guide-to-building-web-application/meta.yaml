  md: "# Chapter 5 Modules\n\n+   1. If the requested module is built-in—such as http\
    \ or fs—Node uses that.\n2. If the module name in the require function begins\
    \ with a path component—/, .., or / Node looks in the specific directory for that\
    \ module and tries to load it. If you don't specify a .js extension for your module\
    \ name, Node first looks for a folder-based module of that name. If it does not\
    \ find it, then it adds the extensions .js, .json, .node, and in turn tries to\
    \ load modules of those types. (Modules with the extension .node are compiled\
    \ add-on.)\n3. If the module name does not have a path component at the beginning,\
    \ Node looks in the node_modules/ subfolder of the current folder for the module.\
    \ If it is found, that is loaded; otherwise, Node works its way up the path tree\
    \ of the current location looking for node_modules/ folders. If those continue\
    \ to fail, it looks in some standard default locations, such as /usr/lib or /local/lib.\n\
    4. If the module isn't in any of these locations, an error is thrown.\n\n# Module\
    \ Caching\n\nAfter a module has been loaded from a particular file or directory,\
    \ Node.js caches it. Subsequent calls to require would load the same module from\
    \ the same location to get the exact same code, with any initialization or work\
    \ that has taken place. This is interesting because sometimes two files that are\
    \ asking to load a particular module might get different ones! Consider the following\
    \ project structure:\n\n+   + project/\n  + node_modules/\n  + special_widget/\n\
    \    + node_modules/\n      + mail_widget (v2.0.1)\n  mail_widget (v1.0.0)\nmain.js\n\
    utils.js\n\nIn this example, if either main.js is in the node_modules/ subdirectory\
    \ of project. However, if it requires special_widget, which in turn wishes to\
    \ Node's search finds it use mail_widget, special_widget gets its own privately\
    \ included version of mail_widget, the v2.0.1 in its own node_modules/ folder.\n\
    \nThis is one of the most powerful and awesome features of the Node.js module\
    \ system! In many other systems, modules, or dynamic libraries are all stored\
    \ in a central location, which creating nightmares when you require packages that\
    \ themselves require different versions of some other module. In Node, they are\
    \ free to include these different versions of the other modules, and Node's namespace\
    \ and module rules mean that they do not interfere with each other at all! Individual\
    \ modules and portions of a project are free to include, update, or modify included\
    \ modules as they see fit without affecting the rest of the system."
