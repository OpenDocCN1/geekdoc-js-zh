  md: '# What Exactly Is Node.js?


    web applications, similar to how Gmail does, and found most of what he looked
    at not quite appropriate. He eventually settled on JavaScript because it lacked
    a robust input/output (I/O) model (meaning he could write his own one new) and
    found the fast and fully manageable V8 runtime readily available.


    Inspired by similar projects in the Ruby and Python communities, he eventually
    took the Chrome V8 runtime and an event-processing library called libuv, and came
    up with the first versions of a new system called Node.js. The primary methodology
    or innovation in Node.js is that it is built entirely around an event-driven nonblocking
    model of programming. In short, you never (well, rarely) write code blocks.


    If your web application—in order to process a request and generate a response—needs
    to run a database query, it runs the request and tells Node.js what to do when
    the response returns. In the meantime, your code is free to start processing other
    requests or, indeed, do any other task it might need, such as cleaning up data
    or running analyses.


    Through this simple change in the way the application handles requests and work,
    you are able to trivially write web servers that can handle hundreds, if thousands,
    of requests simultaneously on machines without much processing or memory resources.
    Node runs in a single process, and your code executes largely in a single thread,
    the resource requirements are much lower than for many other platforms.


    This speed and capacity come with a few caveats, and you need to be fully aware
    of them so you can start working with Node.js with your eyes open.


    First and foremost, the new model is different from what you may have seen before
    and can sometimes be a bit confusing. If you''ve wrapped your brain fully around
    some of the concepts, some of the code you see written in Node.js can seem a bit
    strange. Much of this book is devoted to discussing the code patterns many programmers
    use to manage the challenges of the asynchronous, nonblocking way of programming
    that Node.js uses and how to develop your own.


    Another limitation with this model of programming is that it is really centered
    around applications that are doing lots of different things with lots of different
    processes, servers, or services. Node.js truly shines when your application is
    juggling connections to databases, caching servers, file systems, application
    servers, and more. The flip side of this, however, is that it''s not necessarily
    an optimal environment for writing compute servers that are doing long-running
    computations. For these, Node''s model of a single thread in a single process
    can create problems if a request is taking a ton of time to generate a complicated
    password digest or processing an image. In situations which you''re doing more
    computationally intensive work, you need to be careful how your applications use
    resources, or perhaps even farming those tasks out to other platforms and run
    them as a service for your Node.js programs to call.


    Finally, Node.js is a reasonably new platform and under active development. It
    has not yet (as of February 2013) hit version 1.0, and is constantly seeing new
    releases, sometimes at a truly dizzying pace.'
  merge: -1
