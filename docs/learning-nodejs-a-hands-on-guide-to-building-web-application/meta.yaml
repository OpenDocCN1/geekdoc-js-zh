- img_proc: false
  md: "# Chapter 10 Deployment and Development\n\n```\ntwo.get(\"/\", function(req,\
    \ res) {\n  res.send(\"This is app two!\")\n});\n```\n\n```\n// App three\nvar\
    \ three = express();\nthree.get(\"/\", function(req, res) {\n  res.send(\"This\
    \ is app three!\")\n});\n```\n\n```\n// controlling app\nvar master_app = express();\n\
    \nmaster_app.use(express.logger('dev'));\nmaster_app.use(express.vhost('app1',\
    \ one));\nmaster_app.use(express.vhost('app2', two));\nmaster_app.use(express.vhost('app3',\
    \ three));\n```\n\n```\nmaster_app.listen(8080);\n```\n\n# Testing Virtual Hosts\n\
    \nTesting virtual hosts can be a bit of a challenge because your servers are all\
    \ running on localhost, but you will need to somehow get the server to recognize\
    \ the name of the requested server.\n\nIf you're testing from the command line\
    \ using curl, you can just add a header to your request to specify which host\
    \ you are requesting, as follows:\n\n```\ncurl -X GET -H \"Host: hostname.com\"\
    \ http://localhost:8080\n```\n\nIf you want to test things out in the browser,\
    \ you will need to modify the DNS entries on your machine. The most common way\
    \ to do this is to edit, /etc/hosts (on UNIX/Mac machines) or C:\\Windows\\System32\\\
    drivers\\etc\\hosts. You must do this with elevated permissions. On UNIX/Mac,\
    \ launch your editor with sudo, whereas on Windows, you can simply use Notepad,\
    \ but make sure you run it with Administrator privileges.\n\nThen you can add\
    \ entries of the following format to the file:\n\n```\n127.0.0.1\thname\n```\n\
    \nHere, 127.0.0.1 is the IPv4 address for your local computer, and next to it,\
    \ you just just put the name you want to map to that address. You can add as many\
    \ lines for as many hosts as you want (for example, app1, app2, and app3).\n\n\
    Between these two options, you should have no problems testing virtual hosts,\
    \ either from the command line or the browser."
