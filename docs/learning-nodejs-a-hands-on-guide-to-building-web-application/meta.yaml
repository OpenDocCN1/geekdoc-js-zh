  md: "# Level: Ninja\n\nThe previous scripts for running applications are pretty\
    \ useful, and you can use them for low-traffic sites that don't crash often. They\
    \ do have a couple of serious limitations, however:\n\n+   1. If an app gets into\
    \ a state where it is constantly crashing, even when restarted, these scripts\
    \ blindly keep restarting, resulting in what is known as a \"run-away process.\"\
    \ You never get it to start properly, and your server will work itself to death\
    \ constantly trying.\n2. Although these scripts can keep your processes up and\
    \ running, they don't do a good job of telling you when they're in trouble, specifically\
    \ if they're using up too much memory. There are still instances where a Node\
    \ process can consume a bit much memory or otherwise get into trouble with system\
    \ resources. It would be great if there were a way to detect this and terminate\
    \ them let them start again from scratch.\n\nThus, in the following sections,\
    \ you look at a couple of more advanced deployment options, which start to deviate\
    \ quite greatly for UNIX and Windows at this point.\n\n# Linux/Mac\n\nThe previous\
    \ version of your script (when viewed as pseudo-code) was effectively while\n\n\
    ```\nwhile 1\n  run node\nend\n```\n\nYou can upgrade this script now to do something\
    \ more along the following lines:\n\n```\nPID = run node\nwhile 1\n  sleep a few\
    \ seconds\n  if PID not running\n    restart = yes\n  else\n    check node memory\
    \ usage\n    if using too much memory\n      restart = yes\n\n  if restart and\
    \ NOT too many restarts\n    PID = restart node\nend\n```\n\nThere are two key\
    \ tasks you need to perform to make this work:\n\n+   1. Get the process ID (pid)\
    \ of the last-started node server.\n2. Figure out how much memory the node process\
    \ is using.\n\nFor the first, you use the pgrep command, available on Mac and\
    \ most UNIX platforms. When used with the -n flag, it gives you the process ID\
    \ of the latest instance of the given process"
  merge: -1
  pgno: 231
- img_proc: false
  md: "name. You can also use the -f flag to tell it the name of the script, in case\
    \ your computer is running multiple Node servers. Thus, to get the pid of the\
    \ latest Node process running script_name.js, you use pgrep -n \"node script_name.js\"\
    \n\nNow, to get the amount of memory that your process is using, you need to use\
    \ two commands. The first is the ps command, when gives you the wux (wup on platforms-check\
    \ documentation) flags, tells you the total virtual memory consumption of the\
    \ flags, as well as the current resident size (the one you want). The output of\
    \ wux $pid is as follows:\n\n| USER PID MEM VSZ RSS TT STARTED TIME COMMAND |\n\
    | marcw 1974 6.6 3.4 450780 571888 ?? R 12:15AM 52:02.42 command name |\n\nYou\
    \ want the sixth column of the output. To get this, you have to first run the\
    \ awk command to get the second line, and then you run it to get the value in\
    \ the sixth column, as follows:\nps $PID | awk 'NR=1' | awk 'print ($6)'\n\nWith\
    \ the amount of memory that your process is consuming, you can make a decision\
    \ as to whether it's using too much and terminate it if necessary.\n\nI won't\
    \ print out the code of shell script here, but you can see it in the code for\
    \ Chapter 10 in the GitHub repository, as node_ninja_runner.sh. To use it, you\
    \ can run it as node_ninja_runner.sh server.js [extra params]\n\nYou do, of course,\
    \ need to make sure it's elevated to super-user privileges if you're going to\
    \ listen on a port such as 80 or 443.\n\n# Windows\n\nOn Windows, the best way\
    \ to run your apps in can be monitored would be to use a Windows Service. Node.js\
    \ is not set up to be a Windows Service, but fortunately you can use some tricks\
    \ to get it to behave like one.\n\nThrough the use of a nice little program nsm.exe\
    \ (The Non-S Service Manager) and an npm module called winser, you can install\
    \ your Node web applications as services and manage them fully through the Windows\
    \ Management Console. To set this up, you will need to do two things:\n\n+   -\
    \ Install a new custom action in the package.json for the web application.\n-\
    \ Download and install winser and have it do its work.\n\nFor the first step,\
    \ you just need to add the following to the package.json file:\n\n```\n{\n  \"\
    name\": \"Express-Demo\",\n  \"description\": \"Demonstrates Using Express and\
    \ Connect\"\n}\n```"
  merge: -1
