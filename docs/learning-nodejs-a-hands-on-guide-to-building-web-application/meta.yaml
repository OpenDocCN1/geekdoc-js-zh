  md: "# Authenticating the API 207\n\nFortunately, you don't have to compute these\
    \ headers yourself, because programs such as curl do the job for you. To pass\
    \ HTTP Basic Authentication information with a curl request, you can just add\
    \ the following to your request:\n\ncurl -u username:password ...\n\nSo, you can\
    \ secure those APIs that can make changes to your system: the two APIs for creating\
    \ albums and adding photos to albums. To do so, write a new piece of middleware\
    \ called requireAPILogin:\n\n```\napp.put('/v1/albums.json', requireAPILogin,\
    \ album_hdlr.create_album);\napp.put('/v1/albums/album_name/photos.json',\n  \
    \     requireAPILogin, album_hdlr.add_photo_to_album);\n```\n\nThe requireAPILogin\
    \ function is as follows:\n\n```\nfunction requireAPILogin(req, res, next) {\n\
    \  if (req.session && req.session.logged_in) {\n    next();\n    return;\n  }\n\
    \  var hra = req.headers.authorization;\n  if (hra && hra.search('Basic ') ==\
    \ 0) {\n    var creds = new Buffer(hra.split(' ')[1], 'base64').toString();\n\
    \    var parts = creds.split(':');\n    user_hdlr.authenticate_API(\n      parts[0],\n\
    \      parts[1],\n      function (err, resp) {\n        if (err && resp) {\n \
    \         next();\n        } else\n          need_auth(req, res);\n        }\n\
    \      });\n  } else {\n    need_auth(req, res);\n  }\nn}\n```\n\nThe code works\
    \ as follows:\n\n+   1. To maintain compatibility with the web application, you\
    \ check to see whether the user has already logged in using sessions in the browser.\
    \ If so, this is clear to use any API she wants. Because pure API calls from the\
    \ command line or simple clients don't pass around cookies (whereas Ajax calls\
    \ to the API in the browser do), there is no session, and additional authentication\
    \ information has to be provided."
  merge: -1
  pgno: 222
- img_proc: false
  md: "2. You look in the headers for the Authentication: header.\n\n3. You decode\
    \ and break apart the username and password from the header.\n\n4. You pass that\
    \ information along to the authenticate_API function in the user handler.\n\n\
    The authenticate_API function in the user handler is as follows—It fetches the\
    \ user given their email address, validates the password using the bcrypt npm\
    \ module, and then returns success or failure:\n\n```\nexports.authenticate_API\
    \ = function (un, pw, callback) {\n  async.waterfall(\n    function (cb) {\n \
    \     user_data.user_by_email(un, cb);\n    },\n    function (user_data, cb) {\n\
    \      var u = new User(user_data);\n      u.check_password(pw, cb);\n    },\n\
    \    function (err, results) {\n      if (err) {\n        callback(null, un);\n\
    \      } else {\n        callback(new Error(\"bogus credentials\"));\n      }\n\
    \    }\n  );\n};\n```\n\nFinally, if you determine that a user has not properly\
    \ authenticated his request, you need to do a bit of work to tell him that he\
    \ is not allowed to use the requested resource:\n\n```\nfunction need_auth(req,\
    \ res) {\n  res.header('WWW-Authenticate',\n    'Basic realm=\"Authorization required\"\
    ');\n  if (!req.headers.authorization) {\n    setTimeout(function () {\n     \
    \ res.send('Authentication required\\n', 401);\n    }, 3000);\n  } else {\n  \
    \  res.send('Authentication required\\n', 401);\n  }\n}\n```\n\nThis function\
    \ completes the API server obligations for HTTP Basic Authentication. If authentication\
    \ fails, it returns the header WWW-Authenticate. For a bit of extra security,\
    \ you see the user is using incorrect username/password combinations, you can\
    \ sleep for a few"
