    \ and handlers/users.js, login.js and login.html, register.js and register.html),\
    \ you have a complete login system for your web browser front end.\n\n# Resource\
    \ Pooling\n\nIn the preceding chapter, you saw that the MongoDB driver for Node.js\
    \ managed its own collection of connections, or \"pool\" of connections. The mysql\
    \ module does not do for you, so you have to come up with your own connection\
    \ pooling mechanism. Fortunately, it's so trivial to you don't need to worry at\
    \ all that the module doesn't implement this capability.\n\nIn npm, a module called\
    \ generic-pool allows for pooling of, well, anything. To use it, you create a\
    \ pool, specify the upper limit on the number of items you'd like to create, and\
    \ provide a function to create a new instance of an object in the pool. Then,\
    \ to get an item from the pool, you call the acquire function, which waits until\
    \ a pool is available for you. When you are done, you call the release function\
    \ to return the object back to the pool.\n\nLet's see this in action.\n\n# Getting\
    \ Started\n\nAdd generic-pool to the package.json dependencies:\n\n```\n{\"dependencies\"\
    : {\n  \"express\": \"3.x\",\n  \"async\": \"0.1.x\",\n  \"generic-pool\": \"\
