  md: "So, the basic methodology for building Node applications is now as follows:\n\
    \n+   1. Create an application folder.\n2. Write a package.json file describing\
    \ the package and stating which npm modules are needed.\n3. Run npm install to\
    \ make these modules are installed properly.\n\nSo, create a new folder called\
    \ trivial_express for your express test application and then put the following\
