    \  \"scripts\": {\n    \"start\": \"node 01_express_basic.js\"\n  }\n}\n```\n\n\
    For the second step, you can just do the following:\n\n```\nC:\\Users\\Mark\\\
    LearningNode\\Chapter10> npm install winser\n```\n\n(Or you can add winser to\
    \ your project dependencies.) Then, when you are ready to install your app as\
    \ a service, you can go to the project folder holding the package.json and run\n\
    \n```\nC:\\Users\\Mark\\LearningNode\\Chapter10> node_modules\\bin\\winser -i\n\
    ```\n\nThe program Express-Demo was installed as a service.\n\nTo uninstall the\
    \ service, run winser -r, as as follows:\n\n```\nC:\\Users\\Mark\\LearningNode\\\
    Chapter10> node_modules\\bin\\winser -r\n```\n\nThe service for Express-Demo was\
    \ removed.\n\nYou can then go to the Windows Management Console and start, stop,\
    \ pause, or otherwise manage the service to your heart's content!\n\n# Multiprocessor\
    \ Deployment: Using a Proxy\n\nI've mentioned many times that Node.js effectively\
    \ operates as a single-threaded process: All the code that your scripts executing\
    \ is in the same thread, and you use asynchronous call-backs to get as much efficiency\
    \ out of your CPU as possible.\n\nHowever, you must then ask the question: What\
    \ do you do on a system with multiple CPUs? How can you extract maximal functionality\
    \ of your servers? Many modern servers are nice powerful 8-16 core machines, and\
    \ you'd like to use all of them if possible.\n\nFortunately, the answer is reasonably\
    \ simple: Just run one node process per core you want to utilize (see Figure 10.1).\
    \ You can choose one of many of strategies to route traffic to the various different\
    \ node processes, as suits your requirements.\n\nThe problem you are now faced\
    \ with is that you have not one, but n Node processes running, all of which must\
    \ listen on a different port. (You can't have multiple people listening on the\
    \ same port number.) How do you get traffic to mydomain:80 to these servers?"
