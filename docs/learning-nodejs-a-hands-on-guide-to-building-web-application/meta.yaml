  md: "# Chapter 11 Command-Line Programming\n\nThe first line of this function, to\
    \ set up the mask, is just a way for you to choose reasonable permissions for\
    \ the new directories. The caller of this function can specify them directly,\
    \ or he can use what is known as the umask to filter out those that the current\
    \ shell user does not want to give to new files (or directories). On Windows machines,\
    \ umask returns 0, indicating that it does not want to mask anything at all; Windows\
    \ uses a completely different mechanism for file permissions.\n\n# Listing Contents\
    \ of Directories\n\nTo list the contents of a directory, you can use the readdirSync\
    \ function, which returns an array of filenames in the specified folder, excluding\
    \ \".\" and \"..\"\n\n```\n#!/usr/local/bin/node\nvar fs = require('fs');\n\n\
    var files = fs.readdirSync(\".\");\nconsole.log(files);\n```\n\n# Interacting\
    \ with the User: stdin/stdout\n\nYou might be familiar with the trio of IO handles\
    \ given to all processes, stdin, stdout, stderr, representing input, normal output,\
    \ and error output, respectively. These are all available to the Node.js scripts\
    \ and hang off the process object. In Node, they are all instances of Stream objects\
    \ (see Chapter 6, \"Expanding Your Web Server\")\n\nThe console.log function in,\
    \ is just the equivalent of\n\n```\nprocess.stdout.write(text + \"\\n\");\n```\n\
    \nWhereas console.error is basically\n\n```\nprocess.stderr.write(text + \"\\\
    n\");\n```\n\nInput, however, gives you a few more options, so in the following\
    \ sections, you look at buffered (line-by-line) input versus unbuffered (type\
    \ a character and immediately see something) input.\n\n# Basic Buffered Input-Output\n\
    \nBy default, the stream you get for stdin reads and buffers one line at a time.\
    \ Thus, if you try to read from stdin, nothing happens until the user presses\
    \ the Enter key, and then your program is given the entire line read from the\
    \ input stream. You listen for these events by adding a handler for the readable\
    \ event on stdin, as follows:\n\n```\nprocess.stdin.on('readable', function ()\
    \ {\n  var data = process.stdin.read();\n  // do something with input\n});\n```"
  merge: -1
  pgno: 255
