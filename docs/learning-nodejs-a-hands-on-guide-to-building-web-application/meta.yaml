    # # Summary


    This chapter introduced two Node.js features, streams and events, that you used
    to serve up static content from your web application. Equally importantly, this
    chapter introduced client-side engines, and you used Mustache to put together
    a simple start to a front-end for your photo album application.


    You might have noticed, however, that some of the things you have been doing far
    seem unnecessarily complicated, tedious, or possibly ever bug-prone (the handle_incoming_request
    function in particular). It would be nice if there were some further modules to
    help you keep track of things more easily.


    It is thus that you are not going to develop the photo album much further in its
    current form, but continue to look at some modules that will clean up your code
    significantly and allow you to add features quickly and with little code. You
    will do so using the Express Application Framework for Node.'
