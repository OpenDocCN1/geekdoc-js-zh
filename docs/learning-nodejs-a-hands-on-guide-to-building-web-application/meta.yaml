  md: "# Generating Test Certificates\n\nTo work with encrypted traffic on your development\
    \ machines, you need to generate some test certificates. You need to generate\
    \ two files—privkey.pem and newcert.pem—the private key and certificate, respectively.\
    \ All UNIX/Mac machines come with a tool called openssl that you can use to generate\
    \ these two files.\n\nFor Windows users, you can download a Win32 version of openssl.exe\
    \ by visiting http://gnwin32.sourceforge.net/packages/openssl.htm. The commands\
    \ you run are the same as on the other platforms.\n\nTo generate the two certificate\
    \ files, run the following three commands:\n\n```\nopenssl genrsa -out privkey.pem\
    \ 1024\nopenssl req -new -key privkey.pem -out certreq.csr\nopenssl x509 -req\
    \ -days 3650 -in certreq.csr -signkey privkey.pem -out newcert.pem\n```\n\nWith\
    \ these two files in hand, you can work using them in your apps. Note that you\
    \ should never use them in production sites; if you attempt to view a website\
    \ in a browser secured with these certificates, you get a horrible horrid and\
    \ dangerous-sounding warning about how they are not to be trusted at all. You\
    \ typically have to purchase production certificates from a trusted certificate\
    \ authority.\n\n# Built-in Support\n\nSurprisingly, Node.js provides support for\
    \ SSL/HTTPS streams out of the box, via the built-in https module provided by\
    \ Node. You can actually run an https module server to do listening on the HTTP\
    \ port (by default 443, but for development, you can use 8443 to avoid having\
    \ to elevate permissions of your Node process), and then it routes traffic to\
    \ the express server after the encrypted stream has been negotiated and created.\n\
    \nYou create the HTTPS server and pass in options the locations of the private\
    \ key and certificate file you plan to sign the site. You also give it the express\
    \ server to which it can send traffic after encryption is established. The code\
    \ for this is shown in Listing 10.5.\n\n# Listing 10.5 Express/https Module SSL\
    \ Support (https_express_server.js)\n\n```\nvar express = require('express');\n\
    https = require('https');\nfs = require('fs');\n\n// 1. Load certificates and\
    \ create options\nvar privateKey = fs.readFileSync('privkey.pem').toString();\n\
    var certificate = fs.readFileSync('newcert.pem').toString();\nvar options = {\n\
    \  key : privateKey,\n  cert : certificate\n}\n```"
  merge: -1
  pgno: 243
- img_proc: false
  md: ''
  merge: -1
  pgno: 244
- img_proc: false
  md: "}\n\n```\n// 2. Create an instance of HttpProxy to use with another server\n\
    var proxy = new httpProxy.HttpProxy({\n  host: 'localhost',\n  port: 8081\n});\n\
    \n```\n\n```\n// 3. Create https server and start accepting connections.\nhttps.createServer(options.https,\
    \ function (req, res) {\n  proxy.proxyRequest(req, res)\n}).listen(8443);\n```\n\
    \nThis may seem like a lot of routing and redirecting, but the Node development\
    \ group is almost fanatical about performance, and these components are sufficiently\
    \ lightweight that they shouldn't add much perceptible delay in the processing\
    \ of requests for your web applications.\n\n# Multiplatform Development\n\nOne\
    \ of the greatest strengths of Node.js is not only its strong support for UNIX\
    \ and Mac-like computers, but also its ability to run on Windows machines. As\
    \ I was writing this book, I played around with all the samples and ran things\
    \ on Windows without much trouble at.\n\nIndeed, you can have people on your projects\
    \ developing on whatever platforms they want, as long as you take care to prepare\
    \ for a couple of minor issues that will crop up: differences in configurations\
    \ and path differences.\n\n# Locations and Configuration Files\n\nWindows and\
    \ UNIX-like operating systems naturally keep things in different places. One way\
    \ that you can mitigate this problem is to use a configuration file to store these\
    \ locations. Your code can be made flexible enough to know where to find things\
    \ without having to handle each platform separately.\n\nYou actually used this\
    \ technique in Chapter 8, \"Databases I: NoSQL (MongoDB),\" and Chapter 9, \"\
    Databases II: SQL (MySQL),\" where you put database configuration information\
    \ in a file called local.config.js you can continue to follow this technique,\
    \ and expand on and generally put any information that affects the running of\
    \ your application into that file. Indeed, you don't need to restrict it to simply\
    \ file locations or paths, but can configure port numbers or build types from\
    \ there as well:"
  merge: -1
  pgno: 245
- img_proc: false
  md: "# Multiplatform Development 231\n\n```\nexports.config = {\n  db_config: {\n\
    \    host: \"localhost\",\n    user: \"root\",\n    password: \"\",\n    database:\
    \ \"PhotoAlbums\",\n\n    pooled_connections: 125,\n    idle_timeout_millis: 30000\n\
    \  },\n\n  static_content: \"../static\",\n  build_type: \"debug\" // show extra\
    \ output\n};\n```\n\nWhat you normally do is actually check this file in to the\
    \ version control system (such as GitHub) as local.config.js-base and not have\
    \ a local.config.js in the source tree. To run the application, you then copy\
    \ this base file over to local.config.js, update the values as appropriate for\
    \ your local running setup, and then run it. Any time you want to use these local\
    \ configuration variables, you just add var local = require('local.config.js');\n\
    \nThen, in code, you are free to refer to local.config.variable_xyz as you need.\n\
    \n# Handling Path Differences\n\nThe other major difference between Windows and\
    \ UNIX-like operating systems is paths. How do you code for things as require\
    \ when you have handlers in subfolders of your current project directory and so\
    \ on?\n\nThe good news is that a vast majority of time, you'll find that Node\
    \ accepts the forward slash (/) character. When you require modules from relative\
    \ paths (such as \"../path/to/thing\"), it works as you expect it to. Even for\
    \ cases where you're using the fs module APIs, most of them are also able to handle\
    \ the differences in path types throughout the platforms.\n\nFor those cases in\
    \ you absolutely need to work with the different path styles, you can use the\
    \ path.sep property in Node.js, and some clever use of array joining and splitting,\
    \ for example:\n\n```\nvar path = require('path');\nvar comps = ['..', 'static',\
    \ 'photos'];\nconsole.log(comps.join(path.sep));\n```"
  merge: -1
