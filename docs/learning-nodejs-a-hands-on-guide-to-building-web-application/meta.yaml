  md: '# Databases II: SQL (MySQL)


    Although NoSQL databases are surging in popularity, there are still plenty of
    good reasons to continue using relational databases, and they too remain just
    as popular as ever, especially the two most common open source variants, MySQL
    and PostgreSQL. The good news is that the asynchronous nature of Node.js meshes
    perfectly well with registering using these databases in your web applications,
    and there is good npm module support for most of them.


    In this chapter, I cover using MySQL with Node, using the mysql module from npm.
    Because you learned how to put your albums and photos in the database in the preceding
    chapter, you can now turn your focus to registering users in the application and
    requiring them to be logged in before creating any albums or adding photos.


    Even if you''re not planning on using traditional relational databases such as
    MySQL, it is still worth your while to read through this chapter because I introduce
    a couple of important features in express, as well as resource pooling, a way
    to control and limit the use of precious system resources. You also update the
    photo albums sample so that albums and photos will work with MySQL.


    # Getting Ready


    You need to do two things before you start playing around with MySQL in Node.js:
    Make sure MySQL is installed and install the mysql npm module.


    # Installing MySQL


    If you haven''t installed MySQL on your development machine yet, visit dev.mysql.com/downloads/mysql
    and download the version of the community server most appropriate for your machine.
    For Windows and Mac OS X, you can find downloadable installers, whereas for Linux
    and other Unix systems, you can unpack .tar.gz archives to your preferred location
    (most typically /usr/local/mysql).'
  merge: -1
  pgno: 204
- img_proc: false
  md: "If you're running the installers for Windows or Mac OS X, they take care of\
    \ everything for you, whereas for binary distributions only, you have to read\
    \ the INSTALL-BINARY text file and follow the instructions there to get MySQL\
    \ fully and running. When you're done, you should be able to start a new command\
    \ prompt or run the mysql command:\n\n```\nKimidori:Learning Node marcw$ /usr/local/mysql/bin/mysql\
    \ -u root\nWelcome to the MySQL monitor. Commands end with ; \\ g.\nYour MySQL\
    \ connection id is 1\nServer version: 5.5.29 MySQL Community Server (GPL)\n```\n\
    \n```\nmysql>\n```\n\n# Adding the mysql Module from npm\n\nTo install the mysql\
    \ module for Node.js, you can modify the package.json and add the follow-ing dependencies:\n\
    \n```\n\"dependencies\": {\n  \"async\": \"0.1.x\",\n  \"mysql\": \"2.x\"\n}\n\
    ```\n\nYou should see mysql/ under node_modules/ in your folder. Note that the\
    \ 2.x series of the mysql module is a significant improvement and departure from\
    \ the 0.x series. One of the trickier parts of Node.js is that it's constantly\
    \ under development and improvement; things are still changing quite a bit. You\
    \ use the 2.x series in this book because it's much more robust than what was\
    \ there before.\n\n# Creating a Schema for the Database\n\nWhen working with MySQL,\
    \ you need to create a database schema for the application, which you place in\
    \ schema.sql. The first part of this is to create a database with UTF-8 as the\
    \ default character set and sorting order, as follows:\n\n```\nDROP DATABASE IF\
    \ EXISTS PhotoAlbums;\n```\n\n```\nCREATE DATABASE PhotoAlbums\n  DEFAULT CHARACTER\
    \ SET utf8\n  DEFAULT COLLATE utf8_general_ci;\n```\n\n```\nUSE PhotoAlbums;\n\
    ```\n\nYou then have to create a schema for your Users table, where you place\
    \ information for reg-istered users of your photo-sharing app. You only need to\
    \ require an email address, display name, and password from the user, and store\
    \ a couple extra pieces of information, including"
  merge: -1
  pgno: 205
- img_proc: false
  md: "when the account was created, when it was last modified, and whether or not\
    \ it's been marked\nas deleted. The Users table looks as follows:\n\n```\nCREATE\
    \ TABLE Users\n(\n  user_uuid VARCHAR(50) UNIQUE PRIMARY KEY,\n  email_address\
    \ VARCHAR(150) UNIQUE,\n\n  display_name VARCHAR(100) NOT NULL,\n  password VARCHAR(100),\n\
    \n  first_seen_date BIGINT,\n  last_modified_date BIGINT,\n  deleted BOOL DEFAULT\
    \ false,\n\nINDEX(email_address),\nINDEX(user_uuid)\n) ENGINE = InnoDB;\n```\n\
    \nRunning all these commands in MySQL (mysql -u user -p secret < schema.sql) sets\
    \ up\nthe appropriate database and table structures you need to begin writing\
    \ code. If you're following-\nal with the code from the GitHub repository, you'll\
    \ notice that tables have been added\nfor albums and photos.\n\n# Basic Database\
    \ Operations\n\nMost of your work with MySQL will be limited to making connections\
    \ to the MySQL server and\nexecuting these queries and statements. This gives\
    \ you more than enough to run your straight-\nforward web applications and extract\
    \ more of the power of the database server.\n\n# Connecting\n\nTo connect to the\
    \ remote server, you create a connection via the mysql module and then call\n\
    t connect function, as follows:\n\n```\ndbclient = mysql.createConnection({\n\
    \  host: \"localhost\",\n  user: \"root\",\n  password: \"\",\n  database: \"\
    PhotoAlbums\"\n});\n\ndbclient.connect(function (err, results) { });\n```"
  merge: -1
  pgno: 206
- img_proc: false
  md: "If the connection fails, you get an error. If it succeeds, you can then use\
    \ your client object to\nexecute queries. After finishing all your work with the\
    \ database, you should close the connec-\nty by calling the end method:\ndbclient.end();\n\
    \n# # Adding Queries\n\nAfter connecting to the database server, you can start\
    \ executing queries with the (wait for it...)\nquery method, to which you pass\
    \ the SQL statements you executed:\n\n```\ndbclient.query(\"SELECT * FROM Albums\
    \ ORDER BY date\", function (err, results, fields)\n{});\n```\n\nIf the query\
    \ succeeds, the results parameter to the callback contains data relevant to\n\
    what you requested, and there is a third parameter, fields, for those cases when\
    \ you have\nadditional information to specify. (It is often empty when you don't\
    \ have such information)\nfor SELECT statements, the second parameter is an array\
    \ of queried rows:\n\n```\ndbclient.query(\"SELECT * FROM Albums\", function (err,\
    \ rows) {\n  for (var i = 0; i < rows.length; i++) {\n    console.log(\" Album:\
    \ \" + rows[i].name\n      + \" - \" + rows[i].date + \"\");\n  }\n});\n```\n\n\
    If you are using INSERT, UPDATE, or DELETE, the results get back from the query\
    \ method\nlook more similar to the following:\n\n```\n{ fieldCount: 0,\naffectedRows:\
