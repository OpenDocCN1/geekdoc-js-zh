  md: '# Chapter 3 Asynchronous Programming


    If you run this code, you might very well well expect to see the output "I caught
    the error: Uh oh!". But you do not. You actually see the following:


    ```

    timers.js:103

    ```


    ```

    if (process.listeners(''uncaughtException'').length) throw e;

    ```


    ```

    Error: Uh oh, something bad

    at at Object.timeout async_sync.js:5:15

    at at Timer.list. (timers.js:101:19)

    ```


    What happened? I did not say that ... catch blocks were supposed to catch errors
    for You did, but asynchronous callbacks throw a new little wrench into this situation.


    In reality, the call to setTimeout does within the try ... catch block. If that
    function were to throw an error, the catch block would catch it, and would see
    that you had hoped to see. However, the setTimeout function just adds an event
    to the Node event queue (instructing it to call the provided function after the
    specified time interval—2000ms in this) and then returns. The provided callback
    function actually operates within its own new context and scope


    As a result, you can call asynchronous functions for nonblocking I/O, very few
    of them will throw errors, but instead use a separate way of telling you that
    something has gone wrong.


    In Node, you use a number of patterns to help you standardize how you write code
    and avoid errors. These patterns are not enforced syntactically by the language
    or runtime, but you will see them used frequently and even you use them.


    # The Callback Function and Error Handling


    One of the patterns you will see is the format of the callback function you pass
    to most asynchronous functions. It has at least one parameter, the success or
    failure status of the last operation, and very commonly with some sort of additional
    results or information from the last operation (such as a file handle, database
    connection, rows from a query, and so on); some callbacks are given more than
    two:


    ```

    do_something(param1, param2, ..., paramn, function (err, results) { ... });

    ```


    The err parameter is either


    +   null, indicating the operation was a success, and (if there should be one)
    will be a result.


    +   An instance of the Error object class. You will occasionally notice some inconsistency
    here, with people always adding a code field to the Error object and then using
    the message field to hold a description of what happened, whereas others have
    chosen other patterns. For all the code you write in this book, you will follow
    the pattern of always including and using the message field to provide as much
    information as you can. For all the modules you write, you will use a string value
    for the with'
