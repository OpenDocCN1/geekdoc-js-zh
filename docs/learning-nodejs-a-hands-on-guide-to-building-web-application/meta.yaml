    \ () {\n  var renderedPage = Mustache.to_html(tmpl, tdata);\n  $(\"body\").html(renderedPage);\n\
    });\n();\n```\n\nThe $(function () { ... syntax is basically the same as the $(document).ready(function\
    \ ... ... just a bit shorter. So, this function is called after all the other\
    \ resources (most notably jQuery and Mustache) are loaded. It then does the following\
    \ three things:\n\n+   1. It requests the template file, home.html from the server\
    \ by calling the URL /tmpl/home.html.\n2. It asks for the JSON data representing\
    \ albums in the application, /albums.json.\n3. Finally, it gives these two things\
    \ to Mustache to do its templating magic.\n\n# Templating with Mustache\n\nThe\
    \ template engine I chose for the photo album app, Mustache is easy to use, fast,\
    \ and small. Most interestingly, it has only tags, wrapped in {{ and }}, known\
    \ as mustaches. It does not have any if statements or looping constructs. Tags\
    \ act as a type of rules that play out depending on the data you provide.\n\n\
    The basic usage of Mustache, which you saw in the preceding sections, is\n\n```\n\
    var html_text = Mustache.to_html(template, data);\n(\"body\").html(html_text);\n\
    ```\n\nTo print properties from an object, you use the following:\n\n# Mustache\
    \ template:\n\nThe album \"{{name}}\" has {{photos.length}} photos."
