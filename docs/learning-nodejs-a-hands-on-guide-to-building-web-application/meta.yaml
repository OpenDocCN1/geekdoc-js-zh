  md: "# Multiprocessor Deployment: Using a Proxy\n\nListing 10.2 A Round-Robin Proxy\
    \ Load Balancer (roundrobin.js)\n\n```\nvar httpProxy = require('http-proxy'),\n\
    fs = require('fs');\n\nvar servers = JSON.parse(fs.readFileSync('server_list.json')).servers;\n\
    \nvar s = httpProxy.createServerServer(function (req, res, proxy) {\n  // 1. Remove\
    \ first server\n  var target = servers.shift();\n  proxy.proxyRequest(req, res,\
    \ target);\n  // 2. Re-route to that server\n  servers.push(target); // 3. Add\
    \ back to end of list\n});\n\ns.listen(8080);\n```\n\nTo put all in action, you\
    \ now run node roundrobin.js, and you can start to query it as follows:\n\n```\n\
    curl -X GET http://localhost:8080\n```\n\nAs you run this command multiple times,\
    \ you should see the output showing the actual port number that is being listened\
    \ to for the current processing server.\n\n# Multiple Servers and Sessions\n\n\
    Running multiple servers on different CPUs and servers is a great way to spread\
    \ the load and give you a cheap path to scalability. (Servers under heavy load?\
    \ Just add more!) But they create one small complication that you need to address\
    \ before you can use them effectively: The session data is currently stored per\
    \ process using local MemoryStore objects (like \"POST Data, Cookies, and Sessions\"\
    \ in Chapter 7, \"Building Web Applications with Express\") This creates a rather\
    \ serious problem, as shown in Figure 10.2.\n\nEach Node server stores its own\
    \ record of sessions in its own memory store, when two requests from the same\
    \ client go to two different node processes, they have different ideas of current\
    \ state of the session data from the client and get horribly confused quickly.\
    \ You have two obvious ways to solve this problem:\n\n+   1. Implement a more\
    \ advanced router that remembers which Node server requests to a particular client\
    \ are being sent and ensure that all traffic continues to be routed in the same\
    \ way for the same client.\n2. Somehow pool the memory stores that stores the\
    \ session data uses so that all Node processes can access it.\n\nI prefer the\
    \ second solution because it is quite simple to implement and a much less complicated\
    \ solution."
  merge: -1
  pgno: 236
