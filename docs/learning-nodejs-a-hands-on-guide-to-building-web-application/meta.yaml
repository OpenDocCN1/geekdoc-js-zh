    \ Handling\n\nYou have written a little bit of Node code to serve static files\
    \ in your application, but it turns out that doing so is largely unnecessary.\
    \ Express (through connect) provides a static middleware-component that can do\
    \ all this work for you!\n\nTo use it, you just pass the name of the base folder\
    \ whose contents you want to serve statically to the middleware creation function,\
    \ as follows:\n\n```\napp.use(express.static('/secure/static_site_files'));\"\
    ,\n```\n\nYou put this before the URL routers, and when a request comes in, this\
    \ static layer takes the URL, appends it to its base folder name, and looks whether\
    \ that file exists. For example, if you request /content/style.css, this middleware\
    \ checks whether /secure/static_files/content/style.css exists and is readable.\
    \ If it is, the middleware serves files and stops calling further layers. If not,\
    \ it calls the next function.\n\nIf you want to serve static content from multiple\
    \ locations, add multiple components:\n\n```\napp.use(express.static('/secure/core_static_content'));\n\
