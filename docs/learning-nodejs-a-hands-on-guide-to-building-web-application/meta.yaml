  md: '# Introduction


    Welcome to Learning Node.js. Node.js is an exciting new platform for writing network
    and web applications that has created a lot of buzz over the past couple of years
    and rapidly gathered a sizeable follow in the developer community. In this book,
    I teach you more about it, why it is special, and get you up and writing Node.js
    programs in short order. You''ll soon find that people are around with Node.js
    and will refer to it it frequently as just Node or even "node." I certainly do
    a lot of that in this book as well.


    # Why Node.js?


    Node.js has arisen for a couple of primary reasons, which I explain next.


    # The Web


    In the past, writing web applications was a pretty standard process. You have
    one or more servers on your machine that listens on a port (for example, 80 for
    HTTP), and when a request is received, it forks a new process or a thread to begin
    processing and responding to the query. This work frequently involves communicating
    with external services, such as a database, memory cache, external computing server,
    or even just the file system. When all this work is finally finished, the process
    or thread is returned to the pool of "available" servers, and more requests can
    be handled.


    It is a reasonably linear process, easy to understand, and straightforward to
    code. There are, however, a couple of disadvantages that continue to plague the
    model:


    +   1. Each of these threads or processes carries some overhead with it. On some
    machines, PHP + Apache can take up as much as 10–15MB per process. In environments
    where a large server runs constantly and forks threads to process the requests,
    each of these carries some overhead to create a new stack and execution environment,
    and you frequently run into the limits of the server''s available memory.


    +   2. In most common usage scenarios a web server communicates with a database,
    caching server, external server, or file system, it spends most of its time sitting
    around doing nothing and waits for these services to finish and return their responses.
    While it is sitting there doing nothing, this thread is effectively "blocked"
    from doing anything else. The resources it consumes and the process or thread
    in which it runs are entirely frozen waiting for those responses to come back.'
