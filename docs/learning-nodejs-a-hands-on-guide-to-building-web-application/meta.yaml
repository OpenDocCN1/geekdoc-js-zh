  md: "Additional Middleware Functionality 155\n\n```\nres.end(\"You last asked for\
    \ this page at: \" + x);\n}\n.listen(8080);\n```\n\n# File Uploads\n\nThe express\
    \ bodyParser middleware component automatically includes the connect multipart\
    \ component for you, which provides support for file uploads. If you upload a\
    \ file to your app using the multipart/form-data enctype, the req.files contains\
    \ any files sent with the request:\n\n```\nvar express = require('express');\n\
    var app = express();\n  .use(express.logger('dev'))\n  .use(express.bodyParser())\n\
    \  .use(function (req, res) {\n    if (req.files || req.files.album_cover) {\n\
    \      res.end(\"Hunh. Did you send a file?\");\n    } else {\n      console.log(req.files);\n\
    \      res.end(\"You have asked to set the album cover for \"\n        + to \"\
    \ + + req.body.albumid\n        + to \" + + req.files.album_cover.name + \"\\\\\
    n\");\n    }\n  });\n  .listen(8080);\n```\n\nTo test this, you can still use\
    \ curl! It can upload files along with the request by combining the -F option\
    \ (from form data) and the @ operator with a filename, which tells it to send\
    \ that file:\n\n```\ncurl -i -H \"Expect:\" --album_cover=@oranges.jpg \\\n--albumid=ital2012\
    \ http://localhost:8080\n```\n\nThere is one trick, however, and that is curl\
    \ sometimes expects the server to send the response 100 Continue and then hang\
    \ waiting. To get around this, use -H \"Expect:\" to curl, which lets you test\
    \ file uploads normally.\n\n# Better Browser Support for PUT and DELETE\n\nPUT\
    \ (object creation) and DELETE (object destruction) are critical parts of REST\
    \ APIs that you are using, and the client web sends page data to the server via\
    \ these methods. For example, in jQuery, to say you want to delete a comment,\
    \ use\n\n```\n$.ajax({\n  url: 'http://server/v1/comments/23493298235.json',\n\
    \  type: 'DELETE'\n});\n```"
