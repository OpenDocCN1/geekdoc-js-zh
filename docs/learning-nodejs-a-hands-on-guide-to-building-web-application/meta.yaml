    \ any more. It can also be quite difficult to read the code, figure out what variables\
    \ are being used where, and determine the flow of the functions being called and\
    \ returned.\n\n# The Solution\n\nTo solve this problem, you can use an npm module\
    \ called async. Async provides an intuitive way to structure and organize asynchronous\
    \ calls and removes many, if not all, of the tricky parts of asynchronous programming\
    \ you encounter in Node.js.\n\n# Executing Code in Serial\n\nYou can execute serially\
    \ in async in two ways: through the waterfall function and the series function\
    \ (see Figure 5.1).\n\nThe waterfall function takes an array of functions and\
    \ executes them one at a time, passing the results from each function to the next.\
    \ At the end, a resulting function is called with the results from the final function\
    \ in the array. If an error is signaled at any step of the way, execution is halted,\
    \ and the resulting function is called with an error instead."
