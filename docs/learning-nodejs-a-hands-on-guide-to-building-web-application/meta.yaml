  md: "# Additional Middleware Functionality 149\n\n```\nvar express = require('express');\n\
    var connect = require('connect');\nvar app = express();\n```\n\n```\napp.use(connect.compress());\n\
    /* etc ... */\n```\n\nBecause adding and importing connect only for this is a\
    \ hassle, express actually re-exposes all the connect middleware, so you can refer\
    \ to them directly off the express module, as follows:\n\n```\nvar express = require('express');\n\
    var app = express();\n```\n\n```\napp.use(express.compress());\n/* etc ... */\n\
    ```\n\nOr you can download third-party components from npm or somewhere else and\
    \ install them directly:\n\n```\nvar express = require('express');\nvar middle_something\
    \ = require('middle_something');\nvar app = express();\n```\n\n```\napp.use(middle_something());\n\
    /* etc ... */\n```\n\n# Configurations\n\nUsing only some middleware in certain\
    \ configurations can be helpful. Some might modify your output for speed or size\
    \ so that it can be difficult or annoying to use curl to test your server. To\
    \ do this, you call the configure method on the express app, providing it with\
    \ the name of the configuration you want to target and a function that will be\
    \ called when configuration is needed. If you don't provide a name, that function\
    \ is called always, and you can provide multiple configuration names separated\
    \ by, comma before you provide the function, as shown here:\n\n```\napp.configure(function\
    \ () {\n  app.use(express.bodyParser());\n});\n```\n\n```\napp.configure('dev',\
    \ function () {\n  app.use(express.logger('dev'));\n});\n```\n\n```\napp.configure('production',\
    \ 'staging', function () {\n  app.use(express.logger());\n});\n```"
