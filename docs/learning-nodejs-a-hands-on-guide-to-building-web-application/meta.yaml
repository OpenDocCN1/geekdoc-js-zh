  md: '# Summary


    Now you''ve seen that Node is not only great for writing networked applications,
    but is also extremely powerful and fun for command-line synchronous applications.
    After this tour of creating and running scripts and passing parameters to you,
    you should now be pretty comfortable manipulating input and output in your program,
    and even be able to switch between buffered and unbuffered input when necessary.
    Finally, you should be able to create and run programs in your Node.js scripts
    with exec and spawn.


    To finish this treatment of programming JavaScript in Node.js, it''s time now
    to turn your attention to testing your scripts and applications.'
