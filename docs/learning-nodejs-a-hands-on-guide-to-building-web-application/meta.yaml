  md: 'On the response side, you have already used two methods: writeHead and end.
    You must call end on the response object once and only once for each incoming
    request. Otherwise, the client never gets the response and continues to listen
    on the connection for more data.


    When you are writing your responses, you should take care to make sure you think
    about your HTTP response codes (see the sidebar "HTTP Response Codes"). Part of
    writing your servers includes thinking logically about what you are trying to
    communicate to the calling clients and sending them as much information as possible
    to help them understand your response.


    # HTTP Response Codes


    The HTTP specification contains a large number of response codes a server can
    return to clients. You can learn more about them on Wikipedia (http://en.wikipedia.org/wiki/List_of_HTTP_status_codes).


    Although a dizzying number of response codes is possible, you''ll find yourself
    using a few of the more common responses in most of your applications:


    +   * 200 OK—Everything fine.

    * 301 Moved Permanently—The URL has been moved, and the client should request
    it at the URL specified in the response.

    * 400 Bad Request—The format of the client’s request is invalid and needs to be
    fixed.

    * 401 Unauthorized—The client has asked for something it does not have permission
    to view. It should try again authenticating the request.

    * 403 Forbidden—For whatever reason, the server is refusing to process this request.
    This is not the same as 401, where the client can try again with authentication.

    * 404 Not Found—The client has asked for something that does not exist.

    * 500 Internal Server Error—Something resulting in the server being unable to
    process the request. You typically use this for situations in which you know the
    client has some sort of inconsistent or buggy state and needs developer attention.

    * 503 Service Unavailable—This indicates some of runtime failure, such as temporary
    low on memory or having troubles with network resources. It''s a fatal error like
    500, but it does suggest the client try again in a while.


    These are the codes you will use, but there are many others that you are encouraged
    to browse over. If you''re unsure when to use one, look at code that others have
    written and see how they do it. The correct code for any given situation can cause
    for great debate, but you can usually get the right ones without too much trouble.


