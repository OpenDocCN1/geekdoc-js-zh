  md: "The only downside to this module is that it might interfere with some of your\
    \ development testing (curl just prints the compressed binary data to the screen,\
    \ which can be annoying), so it is common for you to use this in a production\
    \ configuration, as follows:\n\n```\nvar express = require('express');\nvar app\
    \ = express();\n\napp.use(express.logger('dev'));\napp.configure('production',\
    \ function () {\n  app.use(express.compress());\n});\n\napp.get('/', function(req,\
    \ res) {\n  res.send('hello world this should be compressed\\n');\n});\n\napp.listen(8080);\n\
    ```\n\n# HTTP Basic Authentication\n\nMiddleware can also help you with HTTP Basic\
    \ Authentication, if you want to use that in your application. Despite being frequently\
    \ maligned as outdated and unsafe, Basic Authentication, when combined with SSL\
    \ and HTTPS, actually can be a reasonable robust security solution for your applications.\n\
    \nTo use it, you set up the basicAuth middleware, it a function that takes a username\
