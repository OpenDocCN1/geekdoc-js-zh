  md: '# REST API Design and Modules


    +   - Collections should be nouns, specifically a plural noun, such as albums,
    users, or photos.


    +   - PUT /albums.json—The HTTP request body contains the JSON with the data for
    the new album.


    +   - You fetch or update an object by specifying the specific instance on the
    collection GET or POST, respectively.


    +   - GET /albums/italy2012.json—The request returns this album.


    +   - POST /albums/italy2012.json—The HTTP request body contains the JSON with
    the new data for this album.


    +   - You destroy objects with DELETE.


    +   - DELETE /albums/italy2012.json—Destroys this album.


    +   - If you have collections off collections, for example, photos associated
    with albums, you just continue the pattern:


    +   - GET /albums/italy2012/photos.json—Returns all the photos in this album.


    +   - PUT /albums/italy2012/photos.json—Adds a new photo to this collection.


    +   - GET /albums/italy2012/photos/23482938424.json—Fetches the photo with the
    given ID.


    +   - Slight changes to the way in which you get data from these collections,
    such as pagination or filtering, should all be done via GET query parameters:


    +   - GET /albums.json?located_in=Europe—Fetches only those albums in Europe.


    +   - GET /albums/japan2010/photos.json?page=1&size=25—Fetches the given page
    of 25 photos for the japan2010 album.


    +   - We version the API so that you want to make major changes to future versions
    that would not be compatible, you can simply update the version number. You prefix
    the API URLs with /v1/ for this first version.


    +   - Finally, you suffix all your URLs that return JSON with .json so that clients
    know what data will be in the response. In the future, you could also add support
    for .xml or whatever other formats you use.


    With this mind, the new API for the photo-sharing application centers around albums.
    It looks as follows:


    ```

    /v1/albums.json

    /v1/albums/:album_name.json

    ```


    ```

    /pages/:page_name

    /templates/:template_name

    /content/:filename

    ```'
