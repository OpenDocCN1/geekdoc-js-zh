  md: '# Introduction


    To reduce the randomization and troubles caused by these frequent updates, the
    developers have taken to labeling portions of the system with different degrees
    of stability, ranging from Unable to Stable to Locked. Changes to Stable or Locked
    portions of the runtime are rare and involve much community discussion to determine
    whether it will generate too much pain. As you work your way through this book,
    we point out which areas are less stable than others and suggest ways you can
    mitigate the dangers of changing APIs.


    The good news is that Node.js already has a large and active user community and
    a bunch of mailing lists, forums, and user groups devoted to promoting the platform
    and providing help where needed. A simple Google search will give you answers
    to 99 percent of your questions in a matter of seconds, so never be afraid to
    look!


    # Who Is This Book For?


    I wrote this book under the assumption that you are comfortable programming computers
    and are familiar with the functionality and syntax of at least one programming
    language such as Java, C/C++, PHP, or C#. Although you don''t have to be an expert,
    you''ve probably moved beyond "Learn in X by Y" level tasks.


    If you''re like me, you may have written some HTML/CSS/JavaScript and thus have
    "worked" with JavaScript, you might not be entirely familiar with it and just
    largely templated heavily off code on blog posts or mailing lists. Indeed, with
    its clunky UI and frustrating browser mismatches, you might even frown slightly
    at the mention of JavaScript. Far not—by the end of the first section of this
    book, distasteful memories of the language will be a thing of the past, and I
    hope, you''ll be writing your first Node.js programs with ease and a smile on
    your face!


    I assume that you have a basic understanding of how web applications work: Browsers
    send HTTP requests to a remote server that processes and sends a response with
    a code indicating success or failure, and then optionally some data along with
    that (such as the HTML for the page reader or perhaps JavaScript Object Notation,
    JSON, containing data for that request). You''ve probably connected to database
    servers in the past, run queries, and waited for the resulting rows, and so on.
    When I start to describe concepts beyond these in the samples and programs, I
    explain and refresh everybody''s memory on anything new or uncommon.


    # How to Use This Book


    This book is largely tutorial in nature. I try to balance out explanations with
    code to demonstrate it as much as possible and avoid long, tedious explanations
    of everything. For those situations in which I think a better explanation is interesting,
    I might point you to some resources or other documentation to learn more if you
    are so inclined (but it is never a necessity).'
  merge: -1
  pgno: 19
