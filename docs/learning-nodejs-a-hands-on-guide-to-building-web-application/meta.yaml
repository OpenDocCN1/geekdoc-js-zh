    # Summary


    This is another big chapter with tons of fun new stuff. I introduced the express
    application framework, talked about middleware, described how to use cookies and
    sessions, and helped you convert some of the code in your photo-sharing application
    into modules. You also managed to get rid of a lot of a lot of code by using static
    file-serving middleware and can now add compression, authentication, and better
    error handling to your applications.


    The photo-sharing application is shaping up quite nicely, but it still feels a
    bit rudimentary; you have only pictures in the albums and no great place to store
    any additional information you might like to add to albums or photos. With this
    issue in mind, in the following chapters you start looking at databases—firstSQL
    (CouchDB) and then MySQL—and see how you can use them in Node. You also look at
    some caching solutions and continue to grow out the little app into something
    more useful.'
