  md: "# Chapter 8 Databases: NoSQL (MongoDB)\n\nIn the bin/ subdiv, you should find\
    \ a file called mongodb, which is the base database server daemon. To run the\
    \ server in a development environment, you typically just use\n\n```\n/mongod\
    \ --dbpath /path/to/db  # unix\nmongod --dbpath \\path\\to\\db  # windows\n```\n\
    \nYou can create a folder like :-etc/mongodb or something similar to hold your\
    \ databases. To quickly delete them and restart your database server, press Ctrl+C\
    \ to kill the current server and then run the following:\n\n```\nrm /path/to/db/*\
    \ && ./mongod --dbpath /path/to/db  # unix\ndel \\path\\to\\db\\*  # windows 1\n\
    mongod --dbpath \\path\\to\\db  # windows 2\n```\n\nTo test your installation,\
    \ open another terminal window or command prompt, and run the mongo program, which\
    \ runs a simple interpreter that looks a lot like the Node REPL:\n\n```\nKimidori:bin\
    \ marcw ./mongo\nMongoDB shell version: 2.2.2\nconnecting to: test\n> show dbs\n\
    local (empty)\n```\n\nFor deployment to a live production environment, you should\
    \ read the MongoDB documentation bit further and learn about best practices and\
    \ configuration options, including setting up replication and backups, for example.\n\
    \n# Using MongoDB in Node.js\n\nAfter verifying the MongoDB installation, you\
    \ need to hook it up to Node.js. The most popular driver being used is currently\
    \ the native-mongodb for Node written by 10gen, the company that produces MongoDB.\
    \ There is a relational-object mapping (ROM) layer called mongoose for MongoDB\
    \ and Node.js that is quite popular, but you can stick with the simple driver\
    \ for this book because it provides everything you need are not terribly complicated)\
    \ and lets you structure your code to be more database agnostic (as we will see\
    \ in the next chapter).\n\nTo install the mongodb module, add the following to\
    \ your package.json file:\n\n```\n{\n  \"name\": \"MongoDB-Demo\",\n  \"description\"\
    : \"Demonstrates Using MongoDB in Node.js\",\n  \"version\": \"0.0.1\",\n  \"\
    private\": true,\n  \"dependencies\": {\n    \"async\": \"0.1.x\",\n    \"mongodb\"\
    : \"1.2.x\"\n  }\n}\n```"
  merge: -1
