    # Developing with Your Module


    You now have a module for working with albums. If you would like to use it in
    multiple projects, you could copy it to the node_modules/ folder of your other
    projects, but then you would have a problem: What happens when you want to make
    a change to your albums module? You have to copy the source code over all the
    locations it is being used and every time you change it?


    Fortunately, npm comes to the rescue here. You can modify the package.json file
    to add the following:


    ```

    { "name": "album-manager",

    "version": "1.0.0",

    "main": "./lib/albums.js",

    "private": true }

    ```


    This code tells npm to never accidentally publish this to the live npm repository,
    which you don''t want for this module now.


    Now you can use the npm link command, which tells npm to put a link to the album-manager
    package in the local machine''s default public package repository (such as /usr/local/lib/node_modules
    on Linux and Mac machines, or C:\Users\username\AppData\location\npm on Windows).'
