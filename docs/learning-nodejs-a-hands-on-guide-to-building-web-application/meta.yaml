    # Consuming Modules


    As you have already seen, to include a module in a Node file that you are writing,
    you use the require function. To be able to refer the functions and/or classes
    on that module, you assign the results (the exports object of the loaded module)
    to a variable:


    ```

    var http = require(''http'');

    ```


    Included modules are private to the module that includes them, so if a.js loads
    the http module, then b.js cannot reference it, unless it itself loads http.


    # Searching for Modules


    Node.js uses a pretty straightforward set of rules for finding modules requested
