  md: '# Databases I: NoSQL (MongoDB)


    Now that you have a solid foundation for your web application and are fully set
    up with the express web application framework and Mustache templating, you are
    ready to spend a couple of chapters adding a back end to it. In these next two
    chapters, you look at two common ways this is done. You start in this chapter
    by looking at a popular NoSQL database called MongoDB, which provides a quick
    and easy way to serialize JSON data directly to a database. This chapter covers
    the basics of using it, and then you update your album handler to let you store
    album and photo data to the database.


    I chose to work with MongoDB instead of other popular NoSQL databases—in particular,
    CouchDB—because it''s particularly easy to use and has some wonderful querying
    functionalities that others don''t provide so readily. Because the goal of this
    book is to teach you about working with the database server that was easiest to
    work with and would let you feel more comfortable working with My primary mission.


    If you''re maybe with MySQL or other relational databases, this chapter is still
    very much worth reading because you see how you move the album and photo handlers
    from file-based to database-backed modules. In the next chapter, where I discuss
    relational database systems, I provide a version of the code for MySQL as well.


    # Setting Up MongoDB


    To use MongoDB in your Node.js applications, you need to do two things: install
    the database server itself and make it work with Node.


    # Installing MongoDB


    To get started with MongoDB, you can download the binaries from http://mongodb.org.
    Distributions for most platforms are in zip file format, and you extract them
    to some location from which you''d like to run MongoDB.'
