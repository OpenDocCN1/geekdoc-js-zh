  md: "# Chapter 5 Modules\n\nTo write your own module that exposes, or exports, a\
    \ function called hello_world, you can write the following and save it to mymodule.js:\n\
    \n```\nexports.hello_world = function () {\n    console.log(\"Hello World\");\n\
    }\n```\n\nThe exports object is a special object created by the Node module system\
    \ in every file you create and is returned as the value of the function when you\
    \ include that module. It lives off the module object that every module has, and\
    \ is used to export functions, variables, or classes. In the simple example here,\
    \ the module exposes a single function on the exports object, and to consume it,\
    \ you could write the following and save it to modtest.js:\n\n```\nvar mm = require('./mymodule');\n\
    mm.hello_world();\n```\n\nRunning node modtest.js causes Node to print out \"\
    Hello World\" exactly as you would expect. You can expose as many functions and\
    \ classes as you want off the exports object as you'd like. For example:\n\n```\n\
    function Greeter (lang) {\n    this.language = lang;\n    this.greet() = function\
