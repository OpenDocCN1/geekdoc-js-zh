  md: "# Routing and Layers in Express 139\n\nWell, in express, it looks quite similar:\n\
    \n```\nvar express = require('express');\nvar app = express();\n\napp.get('/',\
    \ function(req, res) {\n  res.end('hello world');\n});\n\napp.listen(8080);\n\
    ```\n\nSave that, run it, and then either run curl or localhost:8080 in the web\
    \ browser, and you should get the hello world output you expect. One of the great\
    \ things about express is that it is built on top of everything you have seen\
    \ so far, so the HTTP request and response objects have the same methods and properties\
    \ they had before. To be certain, they have many new things that added make them\
    \ more interesting and powerful, but you are not operating in a completely new\
    \ world here—just an extended version of the one with which you are already familiar\
    \ and comfortable!\n\n# Routing and Layers in Express\n\nExpress is built on top\
    \ of a Node module called connected. Connect is what is known as a middleware\
    \ library that provides a collection of common functions that network applications\
    \ might need. At the heart of this model is the concept of a flow of functions,\
    \ or what some people like to describe as a layered set of functions.\n\n# Middleware:\
    \ What's in a Name?\n\nWhen you run into the middleware for the first time, you\
    \ can be forgiven for being worried that you've missed out on some new concept\
    \ or technology shift. Fortunately, it's nothing so complicated.\n\nMiddleware\
    \ originally was used to describe software components (typically on the server\
    \ side of things) that connects two things together, such as a business logic\
    \ layer and a database server, or storage services with application modules, and\
    \ so on.\n\nOver time, however, the term seems to become more generic and broad,\
    \ and now seems to cover any piece of software that connects two things together\
    \ in way, shape, or form.\n\nFor the purposes of this book, the middleware exposed\
    \ by connect that you see in express is basically just a collection of modules\
    \ that allow your apps to seamlessly integrate functionality from either the server\
    \ or browser.\n\nYou set up your application by creating a sequence of functions\
    \ (layers) through which express navigates. When one decides it to take over,\
    \ it can complete the processing and stop the sequence. Express then walks up\
    \ through the sequence to the end. (Some layers do their process \"on the way\
    \ in,\" others \"on the way out.\")"
