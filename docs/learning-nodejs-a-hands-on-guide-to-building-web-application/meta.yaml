  md: "# 238 Chapter 11 Command-Line Programming\n\n```\n} else {\n  try {\n    copy_file_sync(process.argv[2],\
    \ process.argv[3]);\n  } catch (e) {\n    console.log(\"Error copying file:\"\
    );\n    console.log(e);\n    process.exit(-1);\n  }\n}\n\nconsole.log(\"1 file\
    \ copied.\");\n}\n```\n\nYou can see here that you also make use of a new function,\
    \ process.exit. This function terminates the Node.js program immediately and passes\
    \ the return code back to the calling program (often a shell interpreter or command\
    \ prompt). The standard in Bourne shell returns 0 on success and nonzero when\
    \ something bad happens. You return -1 when something goes wrong with the copy.\n\
    \nYou can trivially change this copy function to a move function by performing\
    \ the copy file operation and deleting the source file when you're sure the destination\
    \ has been fully written and successfully closed. You perform this by using the\
    \ function unlinkSync:\n\n```\nfunction move_file_sync(src, dest) {\n  var read_so_far,\
    \ fdsrc, fdest, read;\n  var buff = new Buffer(BUFFER_SIZE);\n\n  fdsrc = fs.openSync(src,\
    \ 'r');\n  fdest = fs.openSync(dest, 'w');\n  read_so_far = 0;\n\n  do {\n   \
    \ read = fs.readSync(fdsrc, buff, BUFFER_SIZE, read_so_far);\n    fs.writeSync(fdest,\
    \ buff, 0, read);\n    read_so_far += read;\n  } while (read > 0);\n\n  fs.closeSync(fdsrc);\n\
    \  fs.closeSync(fdest);\n  return fs.unlinkSync(src);\n}\n```\n\nThe rest of the\
    \ script remains the same, except you change the call to copy_file_sync to move_file_sync."
