  md: "Middleware or routes that are set up outside configure function calls are considered\
    \ applicable for all configurations.\n\nTo run your app with a particular configuration,\
    \ set the NODE_ENV environment variable to the one you want. On most shells on\
    \ your Mac or UNIX computer, you can run node as follows:\nNODE_ENV=production\
    \ node program.js\n\nOn Windows, you can, in the command prompt, just set the\
    \ NODE_ENV and then run node\n(VERIFY):\n\n```\nset NODE_ENV=production\node program.js\n\
    ```\n\n# Ordering of Middleware\n\nThe layering and order of these middleware\
    \ components is important. As I mentioned, express and connect through them one\
    \ at a time until it finds that it can handle the request. To see how this is\
    \ relevant, consider the following simple app:\n\n```\nvar express = require('express');\n\
    var app = express();\n```\n\n```\napp.use(express.logger('dev'))\n// move this\
    \ to AFTER the next use() and see what happens!\n.use(express.responseTime());\n\
    .use(function(req, res) {\n  res.end('hello world\\n');\n})\n.listen(8080);\n\
    ```\n\nCall this app by using\n\n```\ncurl -i localhost:8080/blargh\n```\n\nYou\
    \ should see the following:\n\n```\nHTTP/1.1 200 OK\nX-Powered-By: Express\nX-Response-Time:\
