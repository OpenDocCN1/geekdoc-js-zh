    \ no checking of these parameters at runtime:\n\n```\n> hello();\nhello undefined\n\
    undefined\n> hello('marc', 'dog', 'cat', 48295);\nhello marc\nundefined\n>\n```\n\
    \nIf too few parameters are passed into a function call, the resulting variables\
    \ are assigned the value undefined. If too many are passed in, the extras are\
    \ simply unused.\n\nAll functions have a predefined array in the body called arguments.\
    \ It has all the values that were passed in to this particular function call,\
    \ and lets you do extra checking on the parameter. Indeed, you can go a step further\
    \ and use it to make your functions more powerful and flexible.\n\nSuppose you\
    \ want to initialize a cache been worst. The function to do this takes a size\
    \ to create the cache and use default values for other things such as cache location,\
    \ expiration algorithm, maximum cache item size, and storage type. You could write\
    \ the function as:\n\n```\nfunction init_cache(size_mb, location, algorithm, item_size,\
    \ storage_type) {\n\n}\n```\n\n```\ninit_cache(100, null, null, null, null);\n\
    ```\n\nHowever, it would be even cooler if you could have the function \"smart\"\
    \ enough to give you a couple of different ways to call it:\n\n```\nfunction init_cache()\
    \ {\nvar init_data = {\n  cache_size: 10,\n  location: '/tmp',\n  algorithm: 'lru',\n\
    \  item_size: 1024,\n  storage_type: 'btree'\n};\n\nvar a = arguments;\nfor (var\
    \ i = 0; i < a.length; i++) {\n  if (typeof a[i] == 'object') {\n    init_data\
    \ = a[i];\n    break;\n  } else if (typeof a[i] == 'number') {\n    init_data.cache_size\
    \ = a[i];\n  }\n}\n```"
