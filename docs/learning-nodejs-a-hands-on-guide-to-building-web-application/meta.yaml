  md: "214 Chapter Deployment and Development\n\n# Port Numbers\n\nFor most of this\
    \ book, you have been using very high port numbers for your sample apps, most\
    \ frequently 8080. The reason is that on some operating systems, most notably\
    \ UNIX/Mac OS X systems, port numbers below 1024 require super-user access. So,\
    \ for simple debugging and testing, 8080 is a great alternative to the more common\
    \ port 80 for web traffic.\n\nHowever, when you deploy your live applications,\
    \ you frequently want to run on port 80 because this is the default for web browsers.\
    \ To do this, you need to run the scripts as super-user. The two ways of doing\
    \ this are\n\n+   1. Log in to your system as the super-user and run programs\
    \ that way.\n2. Use the sudo command, which elevates the process to be executed\
    \ as super-user privileges when it actually runs.\n\nOf these two strategies,\
    \ I frequently use the latter.\n\n# Level: Basic\n\nAt the most basic level, you\
    \ can just use an infinite loop to run your scripts. This loop automatically restarts\
    \ the node process whenever it crashes out. On UNIX and Mac computers running\
    \ bash, the script can be as simple\n\n```\n#/bin/bash\nwhile true\n  node script_name.js\n\
    done\n```\n\nOn Windows, you can use batch files to do the job for you, as follows\
    \ (save this to run_script.bat or something similar and run it):\n\n```\n: loop\n\
    node script_name.js\ngoto loop\nend\n```\n\nThese scripts make sure that your\
    \ Node process is always restarted in the event that it crashes or is terminated\
    \ accidentally.\n\nYou can actually go one step further and use a command called\
    \ tee to write the output of the node process to a log file. You usually pipe\
    \ the output of your process to the tee command using the \"|pipe\" operator in\
    \ the command line, and then reprints the output on the standard output in addition\
    \ to writing the specified log file, as follows:\n\nnode hello_world.js | tee\
    \ - /var/server/logs/important.log\n\nThe -a flag tells you to append to the specified\
    \ log file instead of overwriting it. Thus, you can improve your deployment one\
    \ step further by running your scripts as follows:\n\n```\nbash ./run_script.sh\
    \ | tee - /var/server/logs/important.log\n```\n\n* Note"
