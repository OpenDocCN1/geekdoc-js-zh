  md: "# Structuring Your Data for MongoDB\n\nYou can then run npm update to get the\
    \ latest version of all the drivers. If you look in the node_modules/ folder,\
    \ you should see the mongodb/ subfolder there.\n\n# Structuring Your Data for\
    \ MongoDB\n\nMongoDB is quite suitable for use in your applications because it\
    \ uses JSON for storage itself. Whenever you create or add things to your database,\
    \ you pass around JavaScript objects—which is extremely convenient for you in\
    \ Node!\n\nIf you've used relational databases before, you're likely familiar\
    \ with the terminology of databases, tables, and rows. In MongoDB, these elements\
    \ are called databases, collections, and documents, respectively. Databases are\
    \ partitioned into collections of objects, all of which are represented by JSON\
    \ documents.\n\nAll objects in MongoDB have a unique identifier, represented by\
    \ _id. It can basically be any type as long as it's unique value. If you do not\
    \ provide one, MongoDB creates one for you: It is an instance of the class ObjectId.\
    \ When printed, it returns a 24-character hexadecimal string, such as 5da80ce04d403ebda700012.\n\
    \n# It's All JavaScript\n\nFor the photo application, you need to create two document\
    \ types: one for albums and one for photos within albums. You do not need to use\
    \ MongoDB's autogenerated _id values because you always uniquely identifying information\
    \ for your documents: For albums, the album_name is always unique, and for photos,\
    \ the combination of album_name and photo filename is unique.\n\nThus, you store\
    \ your albums as follows:\n\n```\n{n  id: \"Italy2012\",\n  name: \"Italy2012\"\
    ,\n  title: \"Spring Festival in Italy\",\n  date: \"2012/02/15\",\n  description:\"\
    I went to Italy for Spring Festival.\" }\n```\n\nAnd your photo documents look\
    \ similar to the following:\n\n```\n{n  _id: \"ital2012_picture_01.jpg\",\n  filename:\
    \ \"picture_01.jpg\",\n  albumid: \"ital2012\",\n  description: \"ZOMG it's Rome!\"\
    ,\n  date: \"2012/02/15 16:20:40\" }\n```\n\nAttempting to insert values into\
    \ a collection with duplicate _id causes MongoDB to signal an error. Use this\
    \ capability to ensure that albums are unique and that image files within an album\
    \ are also unique."
  merge: -1
