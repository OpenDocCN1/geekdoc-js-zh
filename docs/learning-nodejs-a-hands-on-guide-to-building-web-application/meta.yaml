    # Staying Up-to-Date and Finding Help


    As mentioned previously, one of the challenges of working with Node.js is its
    constant state of change. Although more and more APIs and sections of the product
    are considered Stable or Locked, some things are still changing with every new
    release, and these releases are happening on a weekly basis.


    Here are some things you can do to keep up-to-date and not miss out on any important
    changes or news:


    +   - Join the Node.js mailing list at /groups.google.com/group/nodejs. Many of
    the core Node developers are on this list and post whenever a new release or change
    is made.


    +   - If you are on Twitter, follow @nodejs there; you will receive tweets whenever
    a new release or something important comes along.


    +   - Visit nodejs.org on a semiregular base to make sure you are not falling
    too far behind.


    For help, the nodejs Google group is, of course, invaluable, as it is the node.org
    website. Similarly, StackOverflow has a very active community helping out with
    Node-related questions, and you can find many good answers there.


    However, I have found that a vast majority of problems are best answered with
    a simple Google search. Somebody somewhere has very likely run into the same problem
    as you and written a blog post or message about it. It is quite rare that I am
    unable to find the answers with simple searches.'
