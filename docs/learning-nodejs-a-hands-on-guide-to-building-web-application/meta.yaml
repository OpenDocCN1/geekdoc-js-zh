  md: '# Prototypes and Inheritance


    By default, all objects in JavaScript have a prototype object, which is the mechanism
    through which they inherit properties and methods. Prototypes have been the source
    of confusion in JavaScript over the years, often different browsers use different
    nomenclature and subtly different implementations. Because it is relevant to the
    interests of this chapter, I demonstrate the model that V8 (and thus Node) uses
    and that other JavaScript implementations seem to be moving towards.


    Change the Shape class created earlier so that all inheriting objects also get
    the X and Y properties, as well as the methods you have declared on it:


    ```

    function Shape () {

    }


    Shape.prototype.X = 0;

    Shape.prototype.Y = 0;

    ```


    ```

    Shape.prototype.move = function (x, y) {

    this.X = x;

    this.Y = y;

    }

    ```


    ```

    Shape.prototype.distance_from_origin = function () {

    return Math.sqrt(this.X*this.X + this.Y*this.Y);

    }

    ```


    ```

    Shape.prototype.area = function () {

    throw new Error("I don''t have a form yet");

    }

    ```


    ```

    var s = new Shape();

    s.move(10, 10);

    console.log(s.distance_from_origin);

    ```


    Run this script and you will get the output as the previous one. Indeed, functionally,
    apart from potentially being slightly more memory efficient if you created lots
    of instances, you would share all the implementations of move and distance_from_origin
    instead of carrying around them), it is not that different. You have added a method
    area that all shapes will have. On the base class, it does not make sense, so
    you have just thrown an error.


    More importantly, you have set yourself up to extend it quite easily:


    ```

    function Square() {

    }

    ```


    ```

    Square.prototype = new Shape();

    Square.prototype.__proto__ = Shape.prototype;

    Square.prototype.Width = 0;

    ```'
