  md: "# Serving Static Content with Streams\n\nShuffling data from stream (rs in\
    \ the preceding example) to stream (res) is such a common scenario that the Stream\
    \ class in Node.js has a convenience method to take care of all of this for pipe:\
    \ The serve_static_file function then becomes much simpler:\n\n```\nfunction serve_static_file(file,\
    \ res) {\n  var rs = fs.createReadStream(file);\n  rs.on(\n    'error',\n    function\
    \ (e) {\n      console.log(\"oh no Error!!\" + JSON.stringify(e));\n      res.end(\"\
    \");\n    }\n  );\n\n  var ct = content_type_for_path(file);\n  res.writeHead(200,\
    \ { \"Content-Type\" : ct });\n  rs.pipe(res);\n```\n\nThere is, unfortunately,\
    \ one small problem with pipe: it sends out HTTP response headers as soon as you\
    \ call it; after they are sent, you cannot subsequently call ServerResponse..\
    \ If the file you want to read with fs.createStream does not exist, you have no\
    \ way to report it to the client. To get around this issue, you need to first\
    \ check whether the file exists and then perform the pipe operation:\n\n```\n\
    function serve_static_file(file, res) {\n  fs.exists(file, function (exists) {\n\
    \    if (exists) {\n      res.writeHead(404, { \"Content-Type\" : \"application/json\"\
    \ });\n      var out = { error: \"not_found\",\n        message: \"\" + file +\
    \ \" not found\" };\n      res.end(JSON.stringify(out) + \"\\n\");\n      return;\n\
    \    }\n  });\n\n  var rs = fs.createReadStream(file);\n  rs.on(\n    'error',\n\
    \    function (e) {\n      res.end();\n    }\n  );\n\n  var ct = content_type_for_file(file);\n\
    \  res.writeHead(200, { \"Content-Type\" : ct });\n  rs.pipe(res);\n});\n```"
