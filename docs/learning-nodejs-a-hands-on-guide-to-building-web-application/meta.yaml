    # Manipulating Binary Data with Buffers


    Thus in your Node.js experience, you have been using strings, UTF-8 strings, to
    do your work. However, when working with streams and files, you actually work
    most with the Buffer class.


    Buffers work more or less as you''d expect them to: They hold binary data that
    can be converted into other formats, used in operations to write file contents,
    or broken apart and reassembled.


    One critical point to remember about buffers is that the length property on the
    object does not return the size of the content, but that of the buffer itself!
    For example:


    ```

    var b = new Buffer(10000);

    var str = "中国亚洲";

    b.write(str); // default is utf8, which is what we want

    console.log(b.length ); // prints 10000

    console.log(Buffer.byteLength(str)); // prints 15

    ```


    Node.js does not keep track of what you have written to place in the buffer, so
    you must keep track of these things yourself.


    Sometimes a string does not have the same byte length of characters—for example,
    the preceding string "中国亚洲". Buffer.byteLength returns the former:


    To convert a buffer to a string, you should use the toString method. You will
    always have it to convert to UTF-8 strings:


    ```

    console.log(buf.toString(''utf8''));

    ```'
