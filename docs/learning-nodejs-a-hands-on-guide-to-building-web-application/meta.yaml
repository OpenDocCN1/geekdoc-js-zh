  md: '# Expanding Your Web Server


    In this last chapter of Part II, “Learning to Run,” you expand the web server
    a little bit with new functionality; you learn how to serve up static content
    such as HTML pages, JavaScript files, cascading style sheets, and even image files.
    Armed with this knowledge, you turn your focus away from the server and look at
    programming the client.


    In the new Node.js world of generating websites, you''re going to migrate from
    the traditional model of generating HTML on the server before sending it down
    to clients, and instead have your server serve up static files or JSON. The web
    browser can then use AJAX calls along with template libraries to generate pages
    on the fly as the user navigates around the site. Finally, you look at uploading
    files to your servers and see some of the tools you can use to help make that
    task easier.


    Begin by taking a look at Node.js streams.


    # Serving Static Content with Streams


    In the asynchronous, nonblocking IO world of Node.js, you previously saw that
    you can use `fs.open` and `fs.read` in a loop to read the contents of a file.
    Node.js provides another, far more elegant mechanism for reading (and writing)
    files called *streams*. They act an awful lot like UNIX pipes—even on Windows—and
    you briefly saw them in use in the section “Receiving JSON POST Data” in Chapter
    4, “Writing Simple Applications,” when you needed to load in the data users sent
    along with requests.


    In the basic usage, you use the `on` method to add `listeners` to `events`. The
    provided functions are called whenever one of those events is triggered. The `readable`
    event is sent whenever a stream has read something in for you to process. The
    `end` event is sent whenever a stream has nothing more to read, and error events
    events are sent whenever something has gone wrong.'
