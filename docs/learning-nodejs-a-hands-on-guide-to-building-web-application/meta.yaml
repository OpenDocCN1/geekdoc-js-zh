  md: '# Data Types


    For the most part, working with MongoDB in JavaScript is entirely natural feeling
    and straight-forward. There are, however, a couple of scenarios in which you might
    run into some trouble, so it''s worth covering them now.


    As you saw back in Chapter 2, "A Closer Look at JavaScript," JavaScript represents
    all numbers as 64-bit double-precision floating-point numbers. This gives you
    53 bits of integer precision. But there is frequently a legitimate need for 64-bit
    integer values. When the reduced precision and approximations are unacceptable,
    you use the Long class that the mongodb driver for Node has. It takes a string
    value in its constructor and lets you perform operations on 64-bit integer values.
    It has a number of methods such as toString, compare, and add/subtract/multiply
    to mimic all common operations you''d expect for integer values.


    JavaScript also has a Binary class, that may expect, lets you store binary data
    into your documents. You can pass the constructor either a string or Buffer object
    instance, and data is stored as binary data. When you reload the document later,
    the value is returned to you with some extra metadata describing how MongoDB is
    storing in the collection.


    Finally, I want to mention the Timestamp class, which saves times to the database
    document, but does so when you actually wrote the record! So you can just set
    a value as follows:


    ```

    {_id: "unique_identifier1234",

    when: new Timestamp(),

    what: "Good News Everyone!" };

    ```


    For a complete list of the data types that the mongodb module provides, check
    out the documentation at github.com/mongodb/node-mongodb-native and also look
    at the source code in node_modules/mongodb/node_modules/bson/lib/bson/.


    # Understanding the Basic Operations


