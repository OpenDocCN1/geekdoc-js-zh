  md: 'In short, Node.js works intuitively, and for perhaps the first time in your
    life, you don''t have to sit there endlessly cursing the package repository system
    you''re using.


    # Cycles


    Consider the following situation:


    +   - a.js requires b.js.

    - b.js requires a.js.

    - main.js requires a.js.


    You can see that you clearly have a cycle in the preceding modules. Node stops
    cycles from by simply returning uninitialized modules when it detects one. In
    the preceding case, the following happens:


    +   - main.js is loaded, and code runs that requires a.js.

    - a.js is loaded, and code runs that requires b.js.

    - b.js is loaded, and code runs that requires a.js.

    - Node detects the cycle and returns an object referring to a.js, but does not
    execute any more code—the loading and initialization of a.js are unfinished at
    this point!

    - b.js, a.js, and main.js all finish initializing (in that order), and then the
    reference from b.js to a.js is valid and fully usable.


    # Writing Modules


    Recall that every file in Node.js is itself a module, with a module and exports
    object. However, you also should know that modules can be a bit more complicated
    than that, with a directory hold its contents and a file containing packaging
    information. For those cases in which you want to write a bunch of support files,
    break up the functionality of the module into separate JavaScript files, or even
    include unit tests, you can write modules in this format.


    The basic format is as follows:


    +   - Create the folder to hold the module contents.

    - Put a file called package.json into this folder. This file should contain at
    least a name for the module and main JavaScript file that Node should load initially
    for that module.

    - If Node cannot find the package.json file or no main JavaScript file is specified,
    it looks for index.js (or index.node for compiled add-on modules).'
