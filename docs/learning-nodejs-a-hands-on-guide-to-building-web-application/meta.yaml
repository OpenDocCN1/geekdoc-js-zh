  md: 'The book is divided into four major sections:


    +   * Part 1. Learning to Walk—You start installing and running Node, take another
    look at the JavaScript language and the extensions used in V8 and Node.js, and
    then you write your first application.


    +   * Part 2. Learning to Run—You start developing more powerful and influential
    application servers in this part of the book, and I start teaching you some of
    the core concepts and practices used in writing Node.js programs.


    +   * Part 3. Breaking Out the Big Guns—In this part, you look at some of the
    powerful tools and modules available to you for writing your web applications,
    such as help with web servers and communication with database servers.


    +   * Part 4. Getting the Most Out of Node.js—Finally, I close the book by looking
    at a few other advanced topics such as which you can run your applications on
    production servers, how you can test your code, and how you can use Node.js to
    write command-line utilities as well!


    As you work your way through the book, take the time to fire up your editor and
    enter the code, see how it works in your version of Node.js, and otherwise start
    writing and developing your own code as you go along. You develop your own little
    photo-sharing application as you work through this book, which I hope provides
    you with some inspiration or ideas for things you can write.


    # # Download the Source Code


    Source code for most of the examples and sample projects in this book can be found
    at github.com/marcwan/LearningNodeJS. You are highly encouraged to download it
    and play along, but don''t deny yourself the opportunity to type in some of the
    code and try many things out.


    The GitHub code has some functioning samples and has been tested to work on Mac,
    Linux, and Windows with the latest versions of Node.js. If new updates of Node
    require updates to the source code, I put changes and notes there, please be sure
    to pull down every few months.


    If you have any questions or problems with the code in this book, feel free to
    go to github.com/marcwan/LearningNodeJS and add an issue; they''ll be monitored
    and answered reasonably quickly.'
  merge: -1
