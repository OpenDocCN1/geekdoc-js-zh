  md: '# Connecting and Creating a Database


    To connect to a MongoDB server, you need to use the Server and Db classes. You
    can option-ally use the Connection class to get the default port number that the
    server listens on. The code to create the shared db object is as follows:


    ```

    var Db = require(''mongodb''), Db,

    Connection = require(''mongodb'').Connection,

    Server = require(''mongodb'').Server;

    ```


    ```

    var host = process.env[''MONGO_NODE_DRIVER_HOST''] != null

    ? process.env[''MONGO_NODE_DRIVER_HOST''] = ''localhost'';

    var port = process.env[''MONGO_NODE_DRIVER_PORT''] != null

    ? process.env[''MONGO_NODE_DRIVER_PORT''] : Connection.DEFAULT_PORT;

    ```


    ```

    var db = new Db(''PhotoAlbums'',

    host, port,

    { reconnect: true,

    poolSize: 20 },

    { w: 1 });

    ```


    MongoDB and the mongodb module you use are quite flexible with the way they handle
    writes and data integrity. The { w: 1 } flag you to the database constructor tells
    them to wait until at least one confirmed write has succeeded before calling callbacks
    you provide to database operations. You can specify higher numbers for environments
    with replication or 0 for cases in which you don''t know when the writes are finished.


    You don''t need to create a new Db object for each incoming request to your application
    server, nor do you need to worry about many people trying to work with the database
    server at the same time. The MongoDB module handles connection pooling and manages
    multiple requests at the same time for you. You can choose how many connections
    to maintain to the MongoDB by adjusting the value of the poolSize parameter to
    the Server object constructor, as shown in the preceding code.


    The name of the database you want to create, or if it already exists, is passed
    to the constructor of the Db object. It is created if it does not exist.


    # Creating Collections


    As mentioned previously, collections are the MongoDB equivalent of tables from
    relational database systems, and you create them with a call to either the collection
    or createCollection method on the Db object. By specifying the { safe: true }
    option as a second parameter, you can control exactly how they work with regards
    to existing or nonexistent collections (see Table 8.1).'
