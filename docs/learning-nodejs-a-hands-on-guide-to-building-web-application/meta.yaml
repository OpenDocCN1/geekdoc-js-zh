  md: '# Installing Node.js 11


    To make sure Node was installed properly, type node --version in the command window.

    You should see the output as in Figure 1.4.


    ![](bbox=[0.303, 0.181, 0.696, 0.298])


    Figure 1.4 Verifying Node is installed correctly. Check the version number.


    The command prompt window should print out the version number of the Node you
    just installed a few seconds ago. (Don''t worry if the number doesn''t match what
    you see—indeed, I''d be surprised if it did!) If you do not see this version number,
