  md: '# 50 Chapter 3 Asynchronous Programming


    ![](bbox=[0.168, 0.101, 0.822, 0.463])


    Figure 3.1 Traditional blocking IO web servers


    The problem is that for each of these processes or threads there is some amount
    of overhead. For heavier implementations using Apache and PHP, I have seen up
    to 10–15MB per-process memory overhead in the past–never mind the resources and
    time consumed by the operating system switching in and out constantly. That''s
    not even 100 simultaneously servers per gigabyte of RAM! Threaded solutions those
    using more lightweight HTTP servers do, of course, have better results, but you
    will still end up in a situation where the computer spends most of its time waiting
    around for blocked processes to get their results, and you running out of capacity
    to handle incoming requests.


    It would be nice if there were some way to make better use of all the available
    CPU computing power and available memory so not to waste much. This is where Node.js
    shines.


    # The Node.js Way of Doing Things


    To understand how Node.js changes the method demonstrated in the preceding section
    into a nonblocking, asynchronous model, first look at the setTimeout function
    in JavaScript. This function takes a function to call and a timeout after which
    it should be called:'
