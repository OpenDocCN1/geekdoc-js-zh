  md: "# Interacting with the User: stdin/stdout 243\n\nand 4, you switch stdin to\
    \ RawMode now that pressing any key triggers the readable event.\n\n2. If the\
    \ stream is in RawMode, it means the user pressed a key in response to your request\
    \ for a hash algorithm. For the first line here, you check to see whether this\
    \ key is Ctrl+C. (Note that this can be tricky to enter into an editor; in Emacs,\
    \ you can press Ctrl+Q and Ctrl+C, and it types ^C for you. Every editor is slightly\
    \ different.) If the user pressed Ctrl+C, you abort the input request and go back\
    \ to the hash prompt.\n\nIf the user entered some other key, make for sure it's\
    \ a valid key (1–4) or else you squawk and make him try again.\n\n3. Finally,\
    \ depending on the algorithm used, you generate the hash, print it out, and then\
    \ go back to the normal enter data prompt. You must be sure to turn off RawMode\
    \ so that you go back to line-buffered input!\n\nAgain, because you call resume\
    \ on stdin in this program, it does not exit until you process.exit, the user\
    \ enters a blank line, or the user presses Ctrl+C during buffered input (which\
    \ causes Node to just terminate).\n\n# The readline Module\n\nOne other way to\
    \ work with input in Node.js is to use the readline module. It's still marked\
    \ as unstable and subject to change, so I don't devote too much time and energy\
    \ to it, but it has a couple neat features that you can use in your programs.\n\
    \nTo turn on the readline module, call the createInterface method on it, specifying\
    \ as the stdin and stdout streams to:\n readline = require('readline');\n\n```\n\
    var rl = readline.createInterface({\n  input: process.stdin,\n  output: process.stdout\n\
    });\n```\n\nAfter you do this, your program does not exit until rl.close is called!\n\
    \n# Line-by-Line Prompting\n\nIf you call the prompt method in readline, the program\
    \ waits for a line of input (followed by Enter). When the program gets this keypress,\
    \ it sends the line event on the readline object. The event can process it as\
    \ needed:\n\n```\nrl.on(\"line\", function (line) {\n  console.log(line);\n  rl.prompt();\n\
    });\n```"
  merge: -1
  pgno: 258
- img_proc: false
  md: "To continue listening, you call the prompt again. One of the nice things about\
    \ the readline interface is that if the user presses Ctrl+C, you get the SIGINT\
    \ event called, and you can either shut down there or do other things to reset\
    \ the state and continue. Here, by closing the readline interface, you cause the\
    \ prompt to stop listening for input and exit:\n\n```\nrl.on(\"SIGINT\", function\
    \ () {\n  rl.close();\n});\n```\n\nNow you're ready to write a simple Reverse\
    \ Polish Notation calculator using the readline module. The code for this calculator\
    \ is shown in List 11.2.\n\nIf you've never heard of Reverse Polish Notation or\
    \ forgotten how it works, it's basically postfix mathematical notation format.\
    \ Instead of writing 1 + 2, you write 1 2 +. To write 5 * (2 + 3), you write:\
    \ 5 2 3 *, and so on. The little calculator takes a string at a time, splits it\
    \ up on bases, and performs simple calculations.\n\n# Listing 11.2 Simple Postfix\
    \ Calculator using readline (readline.js)\n\n```\nvar readline = require('readline');\n\
    var rl = readline.createInterface({\n  input: process.stdin,\n  output: process.stdout\n\
    });\n\nvar p = \"postfix expression > \"\nrl.setPrompt(p, p.length);\nrl.prompt();\
    \ // 1.\n\nrl.on(\"line\", function (line) {\n  if (line == \"\") {\n    rl.close();\
    \ return;\n  }\n\n  var parts = line.split(new RegExp(\"[ ]+\"));\n```"
  merge: -1
  pgno: 259
- img_proc: false
  md: "# Interacting with the User: stdin/stdout 245\n\n```\n// push numbers onto\
    \ a stack, case when we see an operator.\nfunction postfix_process(parts) {\n\
    \  var stack = [];\n  for (var i = 0; i < parts.length; i++) {\n    switch (parts[i])\
    \ {\n      case '+': case '-': case '*': case '/':\n        if (stack.length <\
    \ 2) return false;\n        do_op(stack, parts[i]);\n        break;\n      default:\n\
    \        var num = parseFloat(parts[i]);\n        if (isNaN(num)) return false;\n\
    \        stack.push(num);\n        break;\n    }\n  }\n  if (stack.length != 1)\
    \ return false;\n  return stack.pop();\n}\n\nfunction do_op(stack, operator) {\n\
    \  var b = stack.pop();\n  var a = stack.pop();\n  switch (operator) {\n    case\
    \ '+': stack.push(a + b); break;\n    case '-': stack.push(a - b); break;\n  \
    \  case '*': stack.push(a * b); break;\n    case '/': stack.push(a / b); break;\n\
    \    default: throw new Error(\"Unexpected operator\");\n  }\n}\n```\n\nThis program\
    \ works as follows:\n\n+   1. You create the readline module, set the default\
    \ prompt text on it, and then tell readline to show that prompt and wait for a\
    \ line of input.\n2. When you receive a line of input, you check to whether it's\
    \ empty (in which case you close down the program by closing the readline interface),\
    \ or else parse the input string and pass it to the little calculating function.\
    \ You print the results (good or bad).\n3. You complete the loop by telling readline\
    \ to print out the prompt and wait again.\n4. If the user presses Ctrl+C, you\
    \ close down the readline, which causes the program to exit gracefully."
