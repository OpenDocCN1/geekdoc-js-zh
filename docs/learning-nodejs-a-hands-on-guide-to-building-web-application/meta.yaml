  md: '# Type Basics


    Node.js has a few core types: number, boolean, string, and object. The two other
    types, function and array, are actually special kinds of objects, but because
    they have extra features in the language and runtime, some people refer to these
    three—object, function, and array—as complex types. The types null and undefined
    are also special kinds of objects and are also treated specially in JavaScript.


    The value undefined means that a value has not been set yet or simply does not
    exist:


    ```

    var x;

    undefined

    x = {};

    {}

    x.not_valid;

    undefined

    >

    ```


    null, on the other hand, is an explicit assertion that there is “no value":


    ```

    var y;

    undefined

    y

    undefined

    y = null;

    null

    >

    ```


    To see the type of anything in JavaScript, you use the typeof operator:


    ```

    typeof 10

    ''number''

    type "hello"

    ''string''

    type function () { var x = 20; }

    ''function''

    >

    ```


    # Constants


    While Node.js theoretically supports the const keyword extension that some modern
    JavaScript implementations have implemented, it’s still not widely used. For constants,
    the standard practice is to just use uppercase letters and variable declarations:


    ```

    var SECONDS_PER_DAY = 86400;

    undefined

    console.log(SECONDS_PER_DAY);

    86400

    undefined

    >

    ```'
