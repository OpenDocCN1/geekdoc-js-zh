    \ good, or false if not, as shown here:\n\n```\nvar express = require('express');\n\
    var app = express();\n\napp.use(express.basicAuth(auth_user));\napp.get('/', function(req,\
    \ res) {\n  res.send('secret message that only\\d users can see\\n');\n});\n\n\
    app.listen(8080);\n```\n\n```\nfunction auth_user(user, pass) {\n  if (user ==\
    \ 'marcwan'\n&& pass == 'this is how you get ants') {\n    return true;\n  } else\
    \ {\n    return false;\n  }\n}\n```"
