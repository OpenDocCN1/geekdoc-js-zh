  md: "# Multiprocessor Deployment: Using a Proxy 219\n\n![](bbox=[0.173, 0.131, 0.826,\
    \ 0.355])\n\nFigure 10.1 Running multiple node processes for the same app\n\n\
    You can solve this problem by implementing a simple round-robin load balancer\
    \ that is given a list of node servers running your particular web application.\
    \ You then redirect incoming requests to your domain to these other servers, one\
    \ at a time. You can, of course, experiment with more advanced strategies that\
    \ monitor load, availability, or responsiveness.\n\nTo implement the load balancer,\
    \ you first compile a list of servers that are running. Say you have a server\
    \ with four cores; you give three of them over to the app (and leave the fourth\
    \ for running other system services). You run these app servers on ports 8081,\
    \ 8082, and 8083. Thus, your list of servers is {\n\n```\n\"servers\": {\n  \"\
    host\": \"localhost\",\n  \"port\": \"8081\",\n  \"host\": \"localhost\",\n  \"\
    port\": \"8082\",\n  \"host\": \"localhost\",\n  \"port\": \"8083\"\n]\n```\n\n\
    The code for these simple servers is shown in Listing 10.1. It is the most simple\
    \ web server that you've seen in this book, with an additional bit of code to\
    \ get the port number on it should listen from the command line. (You learn more\
    \ about command-line parameters in Chapter 11, \"Command-Line Programming.\")"
  merge: -1
