  md: "# Virtual Hosting 225\n\nRequest:\nHost: A\n\n![](bbox=[0.144, 0.183, 0.855,\
    \ 0.483])\n\nFigure 10.4 The basic idea behind virtual hosting\n\n# Built-in Support\n\
    \nThe ability to run multiple virtual hosts is built directly into express. To\
    \ make it work, you create one express server for each host you want to support\
    \ and then another “master” server that is given the other virtual servers and\
    \ routes requests to them as appropriate. Finally, you use the vhost connect middleware\
    \ component to put this all together. The code is shown in Listing 10.3.\n\nListing\
    \ 10.3 Virtual Hosts in Express (vhost_server.js)\n\n```\nvar express = require('express');\n\
    \nvar one = express();\none.get(\"/\", function(req, res){\n  res.send(\"This\
    \ is app one!\")\n});\n```\n\n```\n// App two\nvar two = express();\n```"
  merge: -1
