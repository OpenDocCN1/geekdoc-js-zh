  md: '# Assembling Content on the Client: Templates 121


    +   - It makes your life more difficult when you have multiple types of clients.
    Some people might access you through a web browser, others through mobile apps,
    even others through desktop applications or third-party apps.


    +   - It''s frustrating to have to perform so many different types of things on
    the server. It would be great if you could just have your server focus on processing,
    storing, and generating data, and letting the client decide how to present the
    data.


    An increasingly common way of doing things, and something I''ve found particularly
    compelling and with Node, is to convert the server back end to serve only JSON,
    or as absolutely little else as possible. The client app can choose how to present
    the returned data to the user. Scripts, style sheets, and even most HTML can be
    served from file servers or content delivery networks (CDNs).


    For web browser applications, you can use client-side templates (see Figure 6.1).
    In this way of doing things,


    +   1. The client downloads a skeleton HTML page with pointers to JavaScript files,
    CSS files, and an empty body element from the Node server.


    +   2. One of the referenced JavaScript files is a bootstrap that does all the
    work of gathering everything and putting the page together. It is given the name
    of an HTML template and a server JSON API to call. It downloads the template and
    then applies the returned JSON data to that template using a template engine.
    You will use a template engine called "Mustache" (see the sidebar "Template Engines").


    +   3. The resulting HTML code is inserted into the body of the page, and all
    the server has to do is a little bit of JSON.


    It is in preparation for this that you have been developing the album application
    as a JSON-only server thus far. Although you would add the capability for it to
    serve up static files, this is largely for convenience and educational purposes;
    in a production environment, you would probably move these files to a CDN and
    update the URLs to point to them as appropriate.


    # Template Engines


    A large number of client-side (and server-side) template engines or libraries
    are available. The jQuery JavaScript library that you''re using most often in
    this book, there are a few as JSender or QoTemplate, both of which are just fine.
    There are others that don''t necessarily have to fit with your JavaScript helper
    library as we will.


    For your purposes here, they''re all about the same. The features set tend to
    be roughly equal, with similar ways of doing things and reasonably similar performance.
    When you are choosing a library, I recommend picking one that is actively being
    developed and/or maintained and seems to have a reasonable syntax you find comfortable.


    For this book and many of my recent projects, I am using a template engine called
    Mustache. As I just said, this decision is semi-arbitrary but was helped by mustache.js'
