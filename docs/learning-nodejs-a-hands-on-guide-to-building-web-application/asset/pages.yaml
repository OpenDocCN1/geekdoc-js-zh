- img_proc: true
  md: "# Chapter Deployment and Development\n\n# Port Numbers\n\nFor most of this\
    \ book, you have been using very high port numbers for your sample apps, most\
    \ frequently 8080. The reason is that some operating systems, most notably UNIX/Mac\
    \ OS X systems, port numbers below 1024 require super-user access. So, for simple\
    \ debugging and testing, 8080 is a great alternative to the more common port 80\
    \ for web traffic.\n\nHowever, when you deploy your live applications, you frequently\
    \ want to run on port 80 because this is the default for web browsers. To do this,\
    \ you need to run the scripts as super-user. The two ways of doing this are\n\n\
    +   1. Log in to your system as the super-user and run programs that way.\n\n\
    +   2. Use the sudo command, which elevates the process to be executed to super-user\
    \ privileges when it actually runs.\n\nOf these two strategies, I frequently use\
    \ the latter.\n\n# Level: Basic\n\nAt the most basic level, you can just use an\
    \ infinite loop to run your scripts. This loop just restarts the node process\
    \ whenever it crashes out. On UNIX and Mac computers running bash, the script\
    \ can be as simple as\n\n```\n#!/bin/bash\nwhile true\n\tnode script_name.js\n\
    done\n```\n\nOn Windows, you can use batch files to do the job for you, as follows\
    \ (save this to run_script.bat or something similar and run it):\n\n```\n: loop\n\
    node script_name.js\ngoto loop\necho\n```\n\nThese scripts make sure that your\
    \ Node process is always restarted in the event that it crashes or is terminated\
    \ accidentally.\n\nYou can actually go one step further and use a command called\
    \ tee to write the output of the node process to a log file. You usually pipe\
    \ the output of your process to the tee command using the \"|\" operator in the\
    \ command line, and then reprints the output on the standard output in addition\
    \ to writing the specified log file, as follows:\n\n```\nnode hello_world.js |\
    \ tee - /var/server/logs/important.log\n```\n\nThe -a flag tells you to append\
    \ to the specified log file instead of simply overwriting it. Thus, you can improve\
    \ your deployment one step further by running your scripts as follows:\n\n```\n\
    bash ./run_script.sh | tee - /var/server/logs/important.log\n```"
  merge: -1
  pgno: 229
- img_proc: true
  md: 'Or, on Windows, you can use the following:

    run_script.bat | tee -a /var/server/logs/important.log


    See the sidebar "Tee for Windows" for more information on actually making this
    technique work.


    # Tee for Windows (and Other Useful Commands)


    The shells are not known for being particularly powerful (although PowerShell
    is a nice step in the right direction). To get around this issue, people often
    download external utility packs that let them get some of the cool scripting functionality
    seen on UNIX platforms such as Linux or Mac OS X.


    For the tee program mentioned in this chapter, two good choices of utilities are


    +   - getgnuwin32.sourceforge.net/

    - unutils.sourceforge.net/


    You can also find specific tee utilities for Windows by simply searching for "Windows
    tee.". Indeed, for many of the UNIX-like tools I''ve been describing throughout
    this book, perfectly functioning Windows alternatives or versions are frequently
    available for them.


    # Using screen to Monitor the Output


    Although you are always logged in Windows and can easily log back to the desktop
    to see what is going on with your Node servers, on UNIX servers such as Linux
    or Mac OS X, you frequently have to log out and leave the servers running. The
    problem is that when you do, your standard output (stdout) handle and the output
    is lost, unless you are also writing to a log file. And even then, the log file
    sometimes is missing important information printed out by each Node or the OS
    regarding problems they encounter.


    To get around this issue, most UNIX systems support a magical utility called screen,
    which runs you as if they have a controlling terminal (also known as a tty), even
    if you are logged out. Installation is specific to your platform, Mac OS X has
    it by default, and most Linux platforms can get it by doing something similar
    to apt-get screen.


    Now, before you run your Node server, you can run screen and then run Node within
    that. To detach from screen, you press the sequence Ctrl+A Ctrl+D. To get back
    into screen, run the command screen -r (for resume). If you have multiple screen
    sessions running, they each have a name and you also have to type in the name
    of the session you want to resume.


    You screen for every Node server you are running. It''s a great way to come back
    every once in a while and browse how things are running.'
