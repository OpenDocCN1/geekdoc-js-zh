    \ before using the add album or photo pages.\n\n# Updating the API to Support\
    \ Users\n\nTo support a new user subsystem, you need to add a couple of new routes\
    \ to the API:\n\n```\napp.put('/v1/users.json', user_hdl.register);\napp.post('/service/login',\
    \ user_hdl.login);\n```\n\nThe first is the CRUD method (method with \"API Design\"\
    \ in Chapter 7, \"Building Web Applications with Express\") for creating users\
    \ through the API. The second is how you support logins and authentication for\
    \ the web browser version of the application. I show the implementations for these\
    \ two methods later in the section \"Creating the User Handler.\"\n\n# Examining\
    \ the Core User Data Operations\n\nTo get a connection to the database, create\
    \ a data/ folder for your application, and put—in addition to a backend_helpers.js\
    \ file containing simple error-handling help—a file called db.js. This file is\
    \ shown in Listing 9.1. Effectively, it provides a function to get a connection\
    \ to a MySQL database using connection information provided in the file local.config.js,\
    \ as you saw in Chapter 8, \"Databases I: NoSQL (MongoDB).\"\n\n> Listing 9.1\
    \ db.js\n\n```\nvar mysql = require('mysql');\nlocal = require('../local.config.js');\n\
    \nexports.db = function (callback) {\n\n  conn_props = local.config.db;\n  var\
    \ c = mysql.createConnection({\n    host: conn_props.host,\n    user: conn_props.user,\n\
    \    password: conn_props.password,\n    database: conn_props.database\n  });\n\
    \n  callback(null, c);\n}\n```\n\nWhen you have a connection, you are responsible\
    \ for closing it by calling the end method to free up the resources it consumes.\
