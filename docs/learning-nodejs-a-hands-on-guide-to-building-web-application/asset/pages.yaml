    \ Thus, to get the pid of the latest created Node process running script_name.js,\
    \ you use\npgrep -n \"node script_name.js\"\n\nNow, to get the amount of memory\
    \ your process is using, you need to use two commands.\nThe first is the ps command,\
    \ when gives you the wux (wop on some platforms)-check your documentation) flags,\
