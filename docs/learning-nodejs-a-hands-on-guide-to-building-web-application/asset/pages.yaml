  md: "# Writing Tests 257\n\n| Method | Tests |\n| --- | --- |\n| ok(value) | Tests\
    \ whether or not value is true. |\n| equal(value, expected) | Tests whether value\
    \ is expected (shallow test with ==, not ==). |\n| notEqual(value, expected) |\
    \ Makes that value is not the same as expected (shallow, using == only). |\n|\
    \ deepEqual(value, expected) | Makes that value is expected, inspecting sub-values\
    \ if required, using ==. |\n| notDeepEqual(value, expected) | Makes that value\
    \ is not expected, inspecting sub-values if required, using ==. |\n| strictEqual(value,\
    \ expected) | Tests for equality, using the === operator. |\n| throws(code, [Error])\
    \ | Makes sure the given code block throws an error. You can optionally tell what\
    \ kind of error you're-expect. |\n| doesNotThrow(value, expected) | Makes sure\
    \ the given code does not throw an error (optionally, of the specified type).\
