  md: "# Adding Authentication to the Application\n\n# # Updating the Express Application\n\
    \nThe primary method the express server uses to remember whether a user is logged\
    \ in is *session cookies*. Browsers save cookies with every request, so you use\
    \ session data (which you saw in \"POST Data, Cookies, and Sessions\" in Chapter\
    \ 7) to remember user login state. To set up this capability, add the following\
    \ lines to the top of server.js:\n\n```\napp.use(express.cookieParser(\"secret\
    \ text\"));\napp.use(express.session({\n  secret: \"FLUFFY BUNNIES\",\n  maxAge:\
    \ 8640000,\n  store: new express.session.MemoryStore()\n}));\n```\n\nIf a user\
    \ is logged in, you set req.session.logged_in = true and set req.session.logged_in_email_address\
    \ to a valid value. If a user is not logged in, these values are undefined.\n\n\
    To make sure a user is logged in before using the admin pages you created in the\
    \ preceding chapter, you can introduce a little bit of express functionality that\
    \ you haven't seen yet: the ability to inject your own middleware into routing\
    \ decisions.\n\nNormaly, you would route a URL as follows:\n\n```\napp.get(URL,\
    \ HANDLER_FUNCTION);\n```\n\nYou can, however, insert any number of middleware\
    \ functions between the URL and the handler function. They are called one after\
    \ another in the order they are listed. They are given three parameters: req,\
    \ res, and next. If they want to handle the request, they can process it and send\
    \ a response (res.end). If they do not, they can simply call the next() function.\n\
    \nSo, to require that a user be logged in for admin pages, change the routes for\
    \ pages to the following:\n\n```\napp.get('/pages/:page_name', requirePageLogin,\
    \ page_hdrl.generate());\napp.get('/pages/:page_name/sub_page', requirePageLogin,\
    \ page_hdrl.generate());\n```\n\nThe requirePageLogin function checks to whether\
    \ the user is asking for a page that requires authentication. If so, by calling\
    \ it checks whether or not he is logged in. If he is, allows processing to continue\
    \ by calling next(). If he is not logged in, it intercepts the URL and redirects\
    \ the user back to the login page:\n\n```\nfunction requirePageLogin(req, res,\
    \ next) {\n  if (req.params && req.params.page_name == 'admin') {\n    if (req.session\
    \ && req.session.logged_in) {\n      next();\n    } else {\n      res.redirect(\"\
    /pages/login\");\n    }\n  } else {\n    next();\n  }\n}\n```"
