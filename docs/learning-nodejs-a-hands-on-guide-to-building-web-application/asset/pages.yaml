    # Additional Middleware Functionality


    I''ve mentioned before this express is built on top of the connect middleware
    library. These components chain together and are given every incoming request
    at a time until one decide to process it and ceases calling the provided next
    function. The routing handlers form part of this chain. Express and connect with
    a number of other useful components, so let''s spend a little reviewing some of
    the most interesting ones.


    # Usage


    You use middleware components in express and connect with the use method. For
    example, using the logging middleware, you would write the following:


    ```

    var express = require(''express'');

    var app = express();


    ```


    ```

    app.use(express.logger());

    /* etc ... */

    ```


    The express.logger function that you call returns a function will form part of
    the filter layering in your application. Express comes with a number of components
    built in, but you are allowed to use any compatible middleware component. You
    can use any of those provided by connect (provided you''ve added it to the dependencies
    section of your package.json file):'
