    \ (node_runner.js)\n\n```\nvar spawn = require(\"child_process\").spawn;\nvar\
    \ node;\n```\n\n```\nif (process.argv.length < 3) {\n  console.log(\"I need a\
    \ script to run\");\n  process.exit(-1);\n}\n```\n\n```\nfunction spawn_node()\
    \ {\n  var node = spawn(\"node\", process.argv.slice(2));\n  node.stdout.on(\"\
