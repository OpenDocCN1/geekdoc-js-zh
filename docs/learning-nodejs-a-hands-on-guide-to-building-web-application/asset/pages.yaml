  md: "# Files and Stats\n\nYou create folders in Node by using the mkdir function\
    \ in the file system module. In the scripts shown here, you use the mkdirSync\
    \ variation of it. Now you're ready to write a program that behaves the same as\
    \ the mkdir -p command in UNIX shells: You specify a full path, and it creates\
    \ directory and any missing intermediary directories that do not exist.\n\nThe\
    \ work takes place in two steps:\n\n+   1. You break apart the path and then,\
    \ starting at the top, see which directories exist already or not. If something\
    \ exists at the given location but isn't a directory (that is, you want to use\
    \ mkdir a/b/c, but a/b already exists and is a regular file), you throw an error.\
    \ To determine the existence of a file, you use the existsSync function and then\
    \ call the statsSync function, which gives you a Stats object that can tell you\
    \ or not the object is a directory.\n\n+   2. For all entries that have not yet\
    \ been created, you iterate through them.\n\nHere's the code for the mkdirirs\
    \ function:\n\n```\nfunction mkdirirs (path_to_create, mode) {\n  if (mode ==\
    \ undefined) mode = 0777 & (-process.umask);\n\n  // 1. What do we have already\
    \ or not?\n  var parts = path_to_create.split(path.sep);\n  var i;\n  for (var\
    \ i = 0; i < parts.length; i++) {\n    var search;\n    search = parts.slice(0,\
    \ i + 1).join(path.sep);\n    if (fs.existsSync(search)) {\n      var st;\n  \
    \    if ((st = fs.statSync(search))) {\n        if (!st.isDirectory()) {\n   \
    \       throw new Error(\"Intermediate exists, is not a dir!\");\n        }\n\
    \      }\n    } else {\n      // doesn't exist. We can start creating now\n  \
    \    break;\n    }\n  }\n\n  // 2. Create whatever we don't have yet.\n  for (var\
    \ j = i; j < parts.length; j++) {\n    var build = parts.slice(0, j + 1).join(path.sep);\n\
    \    fs.mkdirSync(build, mode);\n  }\n}\n```"
