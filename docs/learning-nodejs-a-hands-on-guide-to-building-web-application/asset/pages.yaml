  md: '# Summary 61


    of Node event processing and callbacks, and you can use process.nextTick in any
    situation in which you are worried that a complex or slow computation is necessary.


    # Synchronous Function Calls


    Now that I have spent nearly an entire chapter telling you how Node.js is very
    much asynchronous and about all the tricks and traps of programming nonblocking
    IO, I must mention that Node actually does synchronous versions of some key APIs.
    You use them for writing command-line tools in Chapter 11, "Command-Line Programming."


    To demonstrate briefly here, you can rewrite the first script of this chapter
    as follows:


    ```

    var fs = require(''fs'');


    var handle = fs.openSync(''info.txt'', ''r'');

    var buf = new Buffer(100000);

    var read = fs.readSync(handle, buf, 0, 10000, null);

    console.log(buf.toString(''utf8'', 0, read));

    fs.closeSync(handle);

    ```


    As you work your way through this book, I hope you are able to see quite quickly
    that Node. js isn''t just for network or web applications. You can use it for
    everything from command-line utilities to prototyping to server management and
    more!


    # Summary


    Switching from a model of programming, where you execute a sequence of synchronous
    or blocking IO function calls and wait for each of them to complete before moving
    on to the next model where you do everything asynchronously and wait for Node
    to tell you when a given task is done, a bit of hang of mental gymnastics and
    experimentation. But I am convinced that when you get the hang of this, you''ll
    never be able to imagine going back to the other way of writing your web apps.


    Next, you write your first simple JSON application server.'
