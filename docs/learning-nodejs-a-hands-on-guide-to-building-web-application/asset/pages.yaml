  md: "# Routing and Layers in Express\n\nOne of the most powerful features of routing\
    \ is the ability to place placeholders to extract named values from the requested\
    \ route, marked by the colon (:) character. When the route is parsed, express\
    \ puts matched placeholders on the req.params object for you. For example:\n\n\
    ```\napp.get('/albums/:album_name.json', function (req, res) {\n  res.end(\"Requested\
    \ \" + req.params.album_name);\n});\n```\n\nIf you call the preceding app requesting\
    \ /albums/italy2012.json, you get the following output:\nRequested italy2012.\n\
    \nYou can put multiple parameters in the same URL as well:\n\n```\napp.get('/albums/:album_name/photos/:photo_id.json',\
    \ function (req, res) { ... });\n```\n\nIf your function is called, req.params\
    \ has both album_name and photo_id set with the appropriate incoming values. Placeholders\
    \ match any sequence of characters except for forward slashes.\nYou you provide\
    \ to the routing method is given the request and response object, as you have\
    \ seen. However, it is also given a third parameter, which you are free to use\
    \ or ignore. It is usually labeled next (the flow of the layered functions is\
    \ always continued through functions called next), and gives you the opportunity\
    \ to do some additional examinations on the incoming URL and still choose to ignore\
    \ it, as follows:\n\n```\napp.get('/users/:userid.json', function (req, res, next)\
    \ {\n  var uid = parseInt(req.params.userid);\n  if (uid < 2000000000) {\n   \
    \ // don't want it. Let somebody else process it.\n    next();\n  } else {\n \
    \   res.end(get_user_info(uid));\n  }\n});\n```\n\n# Updating Your Photo Album\
    \ App for Routing\n\nThe photo album app is quite easy to adapt to express. You\
    \ have to do only a few things to get it working:\n\n+   * Create a package.json\
    \ and install express.\n* Replace the http module's server with that of express.\n\
    * Replace the handle_incoming_request function with routing handlers.\n* Update\
    \ the way you query parameters in express. (They are on req.query for your convenience.)"
