  md: "# Modules and Objects\n\nYou frequently return objects from modules that you\
    \ write. There are two key patterns through which you do this. \n\n# The Factory\
    \ Model\n\nThe previous sample module contains a class called Greeter. To get\
    \ an instance of a Greeter object, you can create a creation function—or factory\
    \ function—to create and return an instance of this class. The basic model is\
    \ as follows: \n\n```\nfunction ABC (parms) {\n  this.varA = ...;\n  this.varB\
    \ = ...;\n  this.functionA = function () {\n    ...\n  }\n}\n\n```\n\n```\nexports.create_ABC\
    \ = function (parms) {\n  return new ABC(parms);\n}\n```\n\nThe advantage to this\
    \ model is that the module can still expose other functions and classes via the\
    \ exports object.\n\n# The Constructor Model\n\nAnother way to expose classes\
    \ from a module you write would be to completely replace the exports object in\
    \ the module with a class that you want people to use:\n\n```\nfunction ABC ()\
    \ {\n  this.varA = 10;\n  this.varB = 20;\n  this.functionA = function (var1,\
    \ var2) {\n    console.log(var1 + \" \" \" + var2);\n  }\n}\n\n```\n\n```\nmodule.exports\
    \ = ABC;\n```\n\nTo use this module, you would change your code to be the following:\n\
    \n```\nvar ABCClass = require('./conmod2');\nvar obj = new ABCClass();\nobj.functionA(1,\
    \ 2);\n```\n\nThus, the only thing you are really exposing from the module is\
    \ a constructor for the class. This approach feels nice and OOP-y, but has the\
    \ disadvantage of not letting you expose much"
