  md: "# Chapter 6 Expanding Your Web Server\n\nYou are now able to serve up static\
    \ content! But you have two problems. First, what happens if you ask for /content/blarge.html?\
    \ In its current form, the script throws an error and terminates, which isn't\
    \ what you want. In this case, you want to return a 404 HTTP response code and\
    \ even may be an error message.\n\nTo do this, you can listen to the error event\
    \ on read streams. Add the following few lines to the serve_static_function:\n\
    \n```\nrs.on(\n  'error',\n  function (e) {\n    res.writeHead(404, { \"Content-Type\"\
    \ : \"application/json\" });\n    var out = { error: \"not_found\",\n      message:\
    \ '' + file + '' not found ' };\n\n    res.end(JSON.stringify(out) + \"\\n\");\n\
    \  }\n);\n```\n\nNow, when you get an error (after no data or end events are called),\
    \ you update the response header code to 404, set a new Content-Type, and return\
    \ JSON with the error information that the client can use to report to the user\
    \ what has happened.\n\n# Serving Up More Than Just HTML\n\nThe second problem\
    \ is that you can currently serve up only HTML static content. The content_type_for_path\
    \ function only returns ... It would be nice if it were a bit more flexible, which\
    \ you can accomplish as follows:\n\n```\nfunction content_type_for_file(file)\
    \ {\n  var ext = path.extname(file);\n  switch (ext.toLowerCase()) {\n    case\
    \ '.html': return 'text/html';\n    case '.js': return 'text/javascript';\n  \
    \  case '.css': return 'text/css';\n    case '.jpg': return 'image/jpeg';\n  \
    \  default: return 'text/plain/';\n  }\n}\n```\n\nNow you can call the curl command\
    \ with a number of different file types and get the expected results. For binary\
    \ files such as JPEG images, you can use the -o flag to tell it to write the output\
    \ to the specified filename. Copy a JPEG to your current folder, run server with\
    \ node server.js, and then add the following:\n\n```\ncurl -o test.jpg http://localhost:8080/content/family.jpg\n\
    ```\n\nChances are, you now have a file called test.jpg that is exactly what you\
    \ expect it to be."
