    \ to authenticate to restricted APIs.\n\nHTTP Basic Authentication: Is It Secure?\n\
    as I explain in this chapter, HTTP Basic Authentication is a relatively simple\
    \ form of security:\nThe client passes a header with a username and password base64\
    \ encoded to the server with every request, which is authenticated by the server\
    \ before processing it. Because base64 encoding is not a form of encryption, it\
    \ amounts to passing plain-text usernames and passwords over the Internet. So\
    \ you might ask: Is that fundamentally insecure?\n\nThe answer is, largely, Most\
    \ secured portions of websites are encrypted and sent over the network using SSL/HTTPS.\
    \ This method of sending encrypted traffic between a client and server is pretty\
    \ safe, so you should absolutely set up on your servers as well.\nOther people\
    \ argue that browsers remember Basic Auth usernames and passwords, and this can\
    \ be insecure. This argument is valid, and this is why we use Basic Auth only\
    \ for API servers. For browser-based applications, you should stick with regular\
    \ login pages and session cookies.\n\nSo, although HTTP Basic Authentication can\
    \ be insecure, with a little preparation and precaution, there is no reason it\
    \ cannot be a reliable production-level security system for your REST API servers.\n\
    \nClients do not remember sessions from API users, because they are not passing\
    \ cookies, so no login state is stored. Thus, these users need to authenticate\
    \ every single request. To do this, they pass headers of the following format:\n\
    \nAuthorization: Basic username:password base64 encoded\n\nFor example, to send\
    \ the credentials for marcwan@example.com with the password kittycat-keyboard,\
    \ you would send\n\nAuthorization: Basic bWFyY3dhkbBlleGtcGxlLm9Y2zpraXR0E0hdG9ua2V5Ym9hcmQ="
