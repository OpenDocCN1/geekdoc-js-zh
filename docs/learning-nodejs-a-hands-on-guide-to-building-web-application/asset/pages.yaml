    \nYou, of course, need to make sure it's elevated to super-user privileges if\
    \ you're going to\nlisten on a port such as 80 or 443.\n\n# Windows\n\nOn Windows,\
    \ the best way to run your apps in be monitored would be\nto use a Windows Service.\
    \ Node.js is not set up to be a Windows Service, but fortunately\nyou can use\
    \ some tricks to get it to behave like one.\n\nThrough the use of a nice little\
    \ program called nsm.exe (the Non-Sucking Service Manager)\nand an npm module\
    \ called winser, you can install your Node web applications as services and\n\
    manage them fully through the Windows Management Console. To set this up, you\
    \ need to do\ntwo things:\n\n+   1. Install a new custom action in the package.json\
    \ for the web application.\n2. Download and install winser and have it its work.\n\
    \nFor the first step, you just need to add the following to the package.json file:\n\
    \n```\n{\n  \"name\": \"Express-Demo\",\n  \"description\": \"Demonstrates Using\
    \ Express and Connect\",\n```"
