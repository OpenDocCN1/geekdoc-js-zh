  md: "# 156 Chapter 7 Building Web Applications with Express\n\nIn most modern web\
    \ browsers, this technique works just fine. However, in some older browsers (well,\
    \ and any Internet Explorer version before 10), it fails. The reason is that their\
    \ implementation of XMLHttpRequest, the object which AJAX requests are, do not\
    \ support PUT or DELETE as a method.\n\nA common and elegant solution is to add\
    \ a new header called X-HTTP-Method-Override to your output, with the method you\
    \ really want to use, and then just use POST to post the request to the server.\
    \ The jQuery code would then become\n\n```\n$.ajax({\n  beforeSend:function(xhr)\
    \ {\n    xhr.setRequestHeader('X-HTTP-Method-Override', 'DELETE');\n  },\n  url:\
    \ 'http://server/v1/comments/23932598235.json',\n  type: 'POST'\n});\n```\n\n\
    To support this solution on your server, you use the methodOverride middleware,\
    \ as follows:\napp.use(express.methodOverride());\n\nIt looks for this header\
    \ and converts POST requests to DELETE or PUT as necessary. Thus, the app.delete\
    \ and app.put routes work exactly as expected.\n\n# Compressing Output\n\nTo save\
    \ bandwidth costs and speed, many web servers compress output using gzip or some\
    \ similar algorithm before sending it to the client. This requires that the client\
    \ first indicates that it is able to accept compressed output with the Accept-Encoding\
    \ HTTP header. If this is provided and the server knows, it adds the Content-Encoding\
    \ header on output with the appropriate algorithm specified and then sends the\
    \ compressed data.\n\nTo use this in your app, you can use the compress middleware.\
    \ It is truly hasslefree component; it checks whether the client accepts compressed\
