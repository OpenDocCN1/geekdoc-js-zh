  md: "144 Chapter 7 Building Web Applications with Express\n\n```\nfunction get_query_params(req)\
    \ {\n  return req.query;\n}\nfunction get_page_name(req) {\n  return req.params.page_name;\n\
    }\n```\n\nWith these changes, the photo sharing app should be updated and ready\
    \ to go with express. It should behave exactly like the old one.\n\n# REST API\
    \ Design and Modules\n\nWhen you are designing JSON servers such as the one you\
    \ are writing, it is important to spend some time thinking about the API and how\
    \ clients will use it. Spending some time up front to design a good API helps\
    \ you to think about how people will use the application and also helps you organize\
    \ and refactor the code to reflect this conceptual understanding.\n\n# API Design\n\
    \nFor the photo-sharing JSON server, the world REST comes from Representational\
    \ State Transfer, and basically implies that you can request an accurate representation\
    \ of an object from the server. REST APIs focus on four core operations (which,\
    \ coincidentally, map to four HTTP request methods):\n\n+   - Creation (PUT)\n\
    - Retrieval (GET)\n- Updating (POST)\n- Destruction (DELETE)\n\nSome people refer\
    \ to these operations as CRUD, and pretty much everything you do in your API centers\
    \ around doing one of these things, whether they are albums, photos, comments,\
    \ or users. Although it is not possible to design the perfect API, I will do my\
    \ absolute best to help you design one that is at least extremely intuitive and\
    \ doesn't leave the client authors scratching their heads as to what you intended.\
    \ Here are some principles to follow when designing RESTful interfaces:\n\n+ \
    \  - There are two basic kinds of URLs. Most URLs you design will be a variation\
    \ of these:\n  1. Collections—for example, /albums.\n  2. Specific items within\
    \ these collections—for example, /albums/italy2012."
