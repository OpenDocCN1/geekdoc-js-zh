  md: '140 Chapter 7 Building Web Applications with Express


    So, in the preceding express application, there is only one layer in the sequence:

    app.get(''/'', function(req, res) { });


    This function, which is a helper provided by express, processes the incoming request
    (by the provided function) if the following are both true:


    +   - The HTTP request method is GET.

    - The requested URL is /.


    If the incoming request does not match these criteria, the function is not called.
    If no function matches the requested URL—for example, browse or curl to /some/other/url—express
    just gives a default response:


    Cannot GET /some/other/url


    # Routing Basics


    The general format of the URL routing functions is as follows:

    app.method(url_pattern, optional_functions, request_handler_function);


    The preceding route handler is for handling GET requests for the URL/. To support
    a POST request on a particular URL, you can use the post method on the express
    application object:


    ```

    app.post("/forms/update_user_info.json", function(req, res) { ... });

    ```


    Similarly, express supports DELETE and PUT methods, both of which you use in the
    photo-sharing application, via the delete and put methods, respectively. Alternately,
    you can use the all method to indicate that the routing function should accept
    the given URL with any given HTTP method:


    ```

    app.all("/users/marwan.json", function(req, res) { ... });

    ```


    The first parameter to the routing function is a regular expression to match an
    incoming request URL. It can be simple as:

    /path/to/resources


    Or it can contain regular expression features, such as

    /user(s)?/list


    matches both /users/list and /user/list,

    /users/*


    matches anything starting with /users/.'
