  md: '# 12 Testing


    With all the code you have written so far, you''re now ready to look at how to
    test it to make sure it works. There are many models and paradigms through which
    this is done, and Node.js supports most of them. This chapter looks at some of
    the more common ones and then looks at how you can do functional testing of not
    only synchronous APIs, but also Node''s asynchronous code, and then add some testing
    to your photo album application.


    # Choosing a Framework


    A few common models of testing are available, including *test-driven development
    (TDD) and behavior-driven development (BDD)*. The former focuses highly on making
    that all your code is properly exposed to testing (indeed, in many cases, demanding
    that you write no code until you''ve written the tests for it), whereas the latter
    focuses on the business requirements of a particular unit or module of code, and
    encourages testing to be a bit more holistic than simple unit testing.


    Regardless of which model you subscribe (or will subscribe, if this is your first
    time writing tests), adding tests to your code base is always a good idea because
    you not only want to make sure that what you have written works, but also make
    sure that future changes your code-base don''t break things. Adding testing to
    your Node applications adds a few challenges because you frequently need to mix
    synchronous, asynchronous, and RESTful server API functionality together, but
    the Node.js platform is sufficiently robust and advanced already that there are
    options for all you need.


    Of the many frameworks available today, three stand out in popularity:


    +   node—this is a simple and straightforward test-runner for testing both in
    Node and in the browser. It''s extremely easy to work with and gives you a lot
    of flexibility for setting up your testing framework.


    +   Mocha—Based on an older testing framework called Espresso, Mocha is basically
    a more feature-rich TDD framework for Node that focuses on being easier to use
    and more enjoyable to code. It has some cool features for asynchronous testing
    and an API for output formatting.'
