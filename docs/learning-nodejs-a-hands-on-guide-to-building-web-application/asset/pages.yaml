    \n# Receiving JSON POST Data\n\nTo get the POST data in the program, you use a\
    \ Node feature called streams. Streams are a powerful way to transfer large amounts\
    \ of data in Node while maintaining its asynchronous, nonblocking nature of the\
    \ system. I cover streams more fully in Chapter 6, \"Expanding Your Web Server,\"\
    \ but for now, you just need to know the key pattern for using streams:\n\n```\n\
    .on(event_name, function { ... });\n```\n\nIn particular, pay attention to two\
    \ events for: the readable and end events. The stream is actually just the HttpServer\
    \ object from the http module (which inherits from the class Stream; ServerResponse\
    \ does, tool,), and you listen to these two events via the following pattern:\n\
    \n```\nvar json_body = '';\nreq.on(\n  'readable',\n  function () {\n    var d\
    \ = req.read();\n    if (d) {\n      if (typeof d == 'string') {\n        json_body\
    \ += d;\n      } else if (typeof d == 'object' && d instanceof Buffer) {\n   \
    \     json_body += d.toString('utf8');\n      }\n    }\n  }\n);\nreq.on(\n  'end',\n\
    \  function () {\n    // did we get a valid body?\n    if (json_body) {\n    \
    \  try {\n        var body = JSON.parse(json_body);\n        // use it and then\
    \ call the callback!\n        callback(null, ...);\n  n  }\n);\n```"
