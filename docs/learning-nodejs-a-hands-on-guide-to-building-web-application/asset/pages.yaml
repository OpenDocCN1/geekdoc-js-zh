  md: "# 146 Chapter 7 Building Web Applications with Express\n\nWhy don't you put\
    \ version numbers on the static content URLs? Because they're not part of the\
    \ JSON server interface, but instead are helpers to provide the contents for the\
    \ web browser client. Users always get the latest version of this and thus code\
    \ knows how to use the correct version of the API.\n\nIt should be trivial to\
    \ update the server.js file with this API design change. Don't forget to also\
    \ update the bootstrapping JavaScript files in /content/ with the new URLs as\
    \ well! Give that a try before continuing onward.\n\n# Modules\n\nWith APIs updated\
    \ around the new REST interface, you can take advantage of some of the clarity\
    \ you have given to the application. You now have clear functionality boundaries\
    \ around albums and pages, so you can put those areas of functionality into your\
    \ modules.\n\nCreate a subfolder of the application folder called handlers/ and\
    \ put the new modules in there. For albums, create a file in that folder albums.js\
