  md: '# 10

    Deployment and Development


    With the ability to build nontrivial Node.js applications firmly under your belt,
    you can now turn your attention to some additional topics on deployment and development
    of these apps. In this chapter, you start by looking at some of the various ways
    that people deploy and run their Node.js apps on production servers, looking at
    both UNIX/Mac and Windows options. You also see how you can take advantage of
    multiprocessor machines, despite the fact that Node.js is a single-threaded platform.


    You then move on to look at adding support for virtual hosts on the server, as
    well as securing your applications with SSL/HTTPS support. Finally, you take a
    quick look at some of the issues with multiplatform development when you have
    people working on a Node app with both Windows and UNIX/Mac machines.


    # Deployment


    To run your Node.js applications thus far, you''ve just been using the following
    from the command line:


    ```

    node script_name.js

    ```


    This approach works pretty great for development. However, for deploying your
    applications to live servers, you might want to add in an extra layer of reliability
    to help in those cases when they crash. Although you of course, strive to avoid
    bugs in your servers, some will eventually creep in in, so you''d like to have
    your servers recover as quickly as possible from such problems.


    Let''s look at some of the options now.'
  merge: -1
