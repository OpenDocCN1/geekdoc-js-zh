  md: "# Securing Your Projects with HTTPS/SSL 227\n\n# Proxy Server Support\n\nAlthough\
    \ it's cool that express has built-in support for virtual hosts, I worry a bit\
    \ about the risks of having multiple web applications running within one process.\
    \ If any one starts to misbehave or have problems, any number of your sites can\
    \ start to have problems as well.\n\nTo get around this situation, let's look\
    \ at another way of managing virtual hosts using the http-proxy module. Again,\
    \ because this module is so powerful, it can easily handle routing of traffic\
    \ to different virtual hosts in just a few lines of code. Indeed, to route traffic\
    \ based on the host names of the sites, you can run the code in Listing 10.4.\n\
    \nListing 10.4 Proxy server virtual hosts (proxy_hosts_server.js)\n\n```\nvar\
    \ httpProxy = require('http-proxy');\n\nvar options = {\n  hostnameOnly: true,\n\
    \  router: {\n    'app1': '127.0.0.1:8081',\n    'app2': '127.0.0.1:8082',\n \
    \   'app3': '127.0.0.1:8083'\n  }\n}\n\nvar proxyServer = httpProxy.createServer(options);\n\
    proxyServer.listen(8080);\n```\n\nYou give the proxy server a list of hosts to\
    \ look for and where to route incoming traffic for those hosts. To test this,\
    \ you can simply run the three different app servers and then run the proxy server,\
    \ making it the target of all your traffic.\n\n# Securing Your Projects with HTTPS/SSL\n\
    \nFor those parts of your application that handle sensitive data such as user\
    \ passwords or personal data, bank account or payment information, or anything\
    \ else somewhat private in nature, you should secure your applications with SSL-encrypted\
    \ HTTPS traffic. Although there is some overhead in creating the SSL connection\
    \ and encrypting the traffic, the security benefits are, of course, paramount\
    \ importance.\n\nTo add support for SSL/HTTPS to your applications, you need to\
    \ first generate some test certificates and add support for the encrypted traffic\
    \ to the application. For the latter, you again have two ways of doing this: either\
    \ through built-in support in express or by using a proxy\n\nserver."
  merge: -1
  pgno: 242
- img_proc: true
  md: "# Generating Test Certificates\n\nTo work with encrypted traffic on your development\
    \ machines, you need to generate some test certificates. You need to generate\
    \ two files—privkey.pem and newcert.pem—the private key and certificate, respectively.\
    \ All UNIX/Mac machines come with a tool called openssl that you can use to generate\
    \ these two files.\n\nFor Windows users, you can download a Win32 version of openssl.exe\
    \ by visiting http://gnwin32.sourceforge.net/packages/openssl.htm. The commands\
    \ you run are the same as on the other platforms.\n\nTo generate the two certificate\
    \ files, run the following three commands:\n\n```\nopenssl genrsa -out privkey.pem\
    \ 1024\nopenssl req -new -key privkey.pem -out certreq.csr\nopenssl x509 -days\
    \ 3650 -in certreq.csr -signkey privkey.pem -out newcert.pem\n```\n\nWith these\
    \ two files in hand, you can work on using them in your apps. Note that you should\
    \ never use them in production sites; if you attempt to view a website in a browser\
    \ secured with these certificates, you get a horrible لحد and dangerous-sounding\
    \ warning about how they are not to be trusted at all. You typically have to purchase\
    \ production certificates from a trusted certificate authority.\n\n# Built-in\
    \ Support\n\nNot surprisingly, Node.js provides support for SSL/HTTPS streams\
    \ right out of the box, via the built-in https module provided by Node. You can\
    \ actually run an https module server to be listening on the HTTP port (by default\
    \ 443, but for development, you can use 8443 to avoid having to elevate permissions\
    \ of your Node process), and then it routes traffic to the express server after\
    \ the encrypted stream has been negotiated and created.\n\nYou create the HTTPS\
    \ server and pass in options the locations of the private key and certificate\
    \ file you plan to use to sign the site. You also give it the express server to\
    \ which it can send traffic after encryption is established. The code for this\
    \ is shown in Listing 10.5.\n\nListing 10.5 Express/https Module Support (https_express_server.js)\n\
    \n```\nvar express = require('express');\nhtps = require('https');\nfs = require('fs');\n\
    \n// 1. Load certificates and create options\nvar privateKey = fs.readFileSync('privkey.pem').toString();\n\
    var certificate = fs.readFileSync('newcert.pem').toString();\nvar options = {\n\
    \  key: privateKey,\n  cert : certificate\n}\n```"
  merge: -1
  pgno: 243
- img_proc: true
  md: "# Securing Your Projects with HTTPS/SSL\n\n```\n// 2. Create express app and\
    \ set up routing, etc.\nvar app = express();\napp.get(\"*\", function(req, res)\
    \ {\n  res.end(\"Thanks for calling securely!\\n\");\n});\n```\n\n```\n// 3. start\
    \ https server with options and express app.\nhttps.createServer(options, app).listen(8443,\
    \ function() {\n  console.log(\"Express server listening on port 8443\");\n});\n\
    ```\n\nYou can view these encrypted pages in a web browser by entering https://localhost:8443\
    \ in the address bar. The first time you view them, you get a scary warning about\
    \ how insecure they are.\n\n# Proxy Server Support\n\nAs many of the other things\
    \ you're investigating in this chapter, you can also use the remarkably powerful\
    \ http-proxy module to handle SSL/HTTPS traffic. Using this module has a couple\
    \ of key advantages over using built-in support for HTTPS in that you let the\
    \ actual app runs as regular HTTP servers, leaving them \"hidden\" behind the\
    \ proxy server and freeing them from decryption encryption. You can then run as\
    \ many as you want using round-robin load balancing previously, or look at other\
    \ creative ways to set up your configuration.\n\nThe methodology for this support\
    \ isn't terribly different from that used in the previous example with proxy;\
    \ you create an instance of Node's built-in HTTPS server class and create an instance\
    \ of a proxy server that knows to route traffic to a regular HTTP server (the\
    \ app server). You then run the HTTPS server, and when it has established the\
    \ secure connection, it passes the request to the proxy server, which in turn\
    \ passes it to the app server(s). The code for this support is shown in Listing\
    \ 10.6\n\n# Listing 10.6 http-proxy SSL Support (https_proxy_server.js)\n\n```\n\
    var fs = require('fs');\nhttp = require('http'),\nhttps = require('https'),\n\
    httpProxy = require('http-proxy');\n```\n\n```\n// 1. Get certificates ready.\n\
    var options = {\nhttps: {\n  key: fs.readFileSync('privkey.pem', 'utf8'),\n  cert:\
    \ fs.readFileSync('cert.pem', 'utf8')\n```"
  merge: -1
  pgno: 244
- img_proc: true
  md: "# Chapter 10 Deployment and Development\n\n```\n}\n;\n// 2. Create an instance\
    \ of HttpProxy to use with another server\nvar proxy = new httpProxy.HttpProxy({\n\
    \  target: {\n    host: 'localhost',\n    port: 8081\n  }\n});\n```\n\n```\n//\
    \ 3. Create http server and start accepting connections.\nhttps.createServer(options.https,\
    \ function (req, res) {\n  proxy.proxyRequest(req, res)\n}).listen(8443);\n```\n\
    \nThis may seem like a lot of routing and redirecting, but the Node development\
    \ group is almost fanatical about performance, and these components are sufficiently\
    \ lightweight that they shouldn't add much perceptible delay in the processing\
    \ of requests for your web applications.\n\n# Multiplatform Development\n\nOne\
    \ of the greatest strengths of Node.js is not only its strong support for UNIX\
    \ and Mac-like computers, but also its ability to run on Windows machines. As\
    \ I was writing this book, I played around with all the samples and ran things\
    \ on Windows without much trouble at all.\n\nIndeed, you can have people on your\
    \ projects developing on whatever platforms they want, as long as you take care\
    \ to prepare for a couple of minor issues that will crop up: differences in configurations\
    \ and path differences.\n\n# Locations and Configuration Files\n\nWindows and\
    \ UNIX-like operating systems naturally keep things in different places. One way\
    \ that you can mitigate this problem is to use a configuration file to store these\
    \ locations. Your code can be made flexible enough to know where to find things\
    \ without having to handle each platform separately.\n\nYou actually first this\
    \ technique in Chapter 8, \"Databases I: NoSQL (MongoDB),\" and Chapter 9, \"\
    Databases II: SQL (MySQL),\" where you put database configuration information\
    \ in a file called local.config.js. You can continue to follow this technique,\
    \ and expand on and generally put any information that affects the running of\
    \ your application into that file. Indeed, you don't need to restrict it to simply\
    \ file locations or paths, which can configure port numbers or build types from\
    \ there as well:"
  merge: -1
