    ```\n\nAt the beginning, there are no albums in the database, so you should get\
    \ an empty array back when requesting albums.\n\nTo test creation, you need to\
    \ use the PUT method to send the data to the server and then test the response\
    \ you get back. The request module lets you specify JSON to pass to the server\
    \ along with the request, automatically specifies the Content-Type: application/json\
    \ header for, and expects JSON in return:\n\n```\nexports.create_album = function\
    \ (test) {\nvar d = \"We went to HK to do some shopping and spend New Year's.\
    \ Nice\";\nvar t = \"New Year's in Hong Kong\";\ntest.expect(7);\nrequest.put(\n\
    \  url: h + \"/v1/albums.json\",\n  json: { name: \"hongkong2012\",\n    title:\
    \ t,\n    description: d,\n    date: \"2012-12-28\" },\n  function (err, resp,\
    \ body) {\n    test.equal(err, null);\n    test.equal(resp.statusCode, 200);\n\
    \    test.notEqual(body.data.album, undefined);\n    test.equal(body.data.album.name,\
    \ \"hongkong2012\");\n    test.equal(body.data.album.date, \"2012-12-28\");\n\
    \    test.equal(body.data.album.description, d);\n    test.equal(body.data.album.title,\
    \ t);\n    test.done();\n  }\n});\n;\n```\n\nWhen the request is completed, you\
    \ can test all sorts of things, including the HTTP response code (which should\
    \ be 200 for successful requests of this type), and you can pick apart the JSON\
    \ and make sure it's similar to what you expected it to be. At the beginning,\
    \ observe that the code specifies that you will check seven conditions; this helps\
    \ node sanity check for you."
