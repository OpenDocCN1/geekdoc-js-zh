    # Installation on Windows


    For Windows users, you can install one of the many binaries for memcached available
    with a simple Internet search. You don''t need the latest and greatest version;
    anything in the 1.2.x series or later is fine. To install it as a service, you
    then run


    ```

    c:\memcached -d install

    ```


    You can run the memcached service by typing


    ```

    net start memcached

    ```


    And finally, you can edit HKEY_LOCAL_MACHINE/SYSTEM/CurrentControlSet/Services/memcached
    Service and modify the ImagePath to be


    ```

    "C:/memcached/memcached.exe" -d runservice -m 25

    ```'
