  md: "# Chapter 7 Building Web Applications with Express\n\nIf you run this server\
    \ and then try to browse to it, it asks you for a username and password before\
    \ letting you continue.\n\n# Error Handling\n\nAlthough you can handle errors\
    \ individually for each request, sometimes you might like to have a global error\
    \ handler for common situations. To do this, you provide a function that takes\
    \ four parameters to the app.use method:\n\n```\napp.use(function (err, req, res,\
    \ next) {\n  res.status(500);\n  res.end(JSON.stringify(err) + \"\\n\");\n});\n\
    ```\n\nThis method is placed after the other middleware setup and routing functions\
    \ so it's the last function that express calls in the app. You can examine the\
    \ exact error in this function and decide what to return to the user. As an example,\
    \ there is a version that converts any err object or thrown Error object to appropriate\
    \ JSON and returns it to the client as a server error:\n\n```\nvar express = require('express');\n\
    var app = express();\n\napp.get('/', function(req, res) {\n  throw new Error('Something\
    \ bad happened');\n  res.send('Probably will never get to this message.\\n');\n\
    });\n```\n\n```\napp.use(function (err, req, res, next) {\n  res.status(500);\n\
    \  res.end(err + \"\\n\");\n});\n```\n\n```\napp.listen(8080);\n```\n\nFinally,\
    \ Node.js allows you to specify a global application-wide error handler via the\
    \ process object:\n\n```\nprocess.on('uncaughtException', function (err) {\n \
    \ console.log('Caught exception: ' + err);\n});\n```\n\nIt is, however, a terrible\
    \ idea to use this for anything other than logging or diagnostic purposes. If\
    \ this function is called, you should assume that Node is in a very unhappy or\
    \ unstable state and should be restarted. So, for those situations when you use\
    \ this function, it is merely to log the error and terminate the node process:\n\
    \n```\nprocess.on('uncaughtException', function (err) {\n  console.log('Caught\
    \ exception: ' + err);\n  process.exit(-1);\n});\n```"
