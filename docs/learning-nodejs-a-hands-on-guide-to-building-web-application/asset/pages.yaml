- img_proc: true
  md: '# Databases II: SQL (MySQL)


    Although NoSQL databases are surging in popularity, there are still plenty of
    good reasons to continue using relational databases, and they too remain just
    as popular as ever, especially the two most common open source variants, MySQL
    and PostgreSQL. The good news is that the asynchronous nature of Node.js meshes
    perfectly well with registering with these databases in your web applications,
    and there is good npm module support for most of them.


    In this chapter, I cover using MySQL with Node, using the mysql module from npm.
    Because you learned how to put your albums and photos in the database in the preceding
    chapter, you can now turn your focus to registering users in the application and
    requiring them to be logged in before creating albums or adding photos.


    Even if you''re not planning on using traditional relational databases such as
    MySQL, it is worth your while to read through this chapter because I introduce
    a couple of important features in express, as well as talk about resource pooling,
    a way to control and limit the use of precious system resources. You also update
    the photo albums sample so that albums and photos will work with MySQL.


    # Getting Ready


    You need to do two things before you can start playing around with MySQL in Node.js:
    Make sure MySQL is installed and install the mysql npm module.


    # Installing MySQL


    If you haven''t installed MySQL on your development machine yet, visit dev.mysql.com/downloads/mysql
    and download the version of the community server most appropriate for your machine.
    For Windows and Mac OS X, you can find downloadable installers, whereas for Linux
    and other Unix systems, you can unpack .tar.gz archives to your preferred location
    (most typically /usr/local/mysql).'
