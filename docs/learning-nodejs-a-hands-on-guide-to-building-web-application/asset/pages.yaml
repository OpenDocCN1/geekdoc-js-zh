  md: "# Chapter 12 Testing\n\n+   VowsJS—The most prominent of the BDD testing frameworks\
    \ for Node.js, VowsJS not has a very descriptive syntax and structure to combine\
    \ BDD ideas with your tests, but also runs your tests concurrently, for faster\
    \ execution.\n\nAlthough they work perfectly fine and have their places, for this\
    \ chapter, you can stick with the reasonably straightforward nodeunit, largely\
    \ because it's really easy to work with and demonstrate.\n\n# Installing Nodeunit\n\
    \nFor your projects now, you can create a test/subfolder into which you put all\
    \ the files, samples, and data files related to the testing of your various projects.\
    \ The first file to put in is package.json, as follows:\n\n```\n{\n  \"name\"\
    : \"API-testing-demo\",\n  \"description\": \"Demonstrates API Testing with nodeunit\"\
    ,\n  \"version\": \"0.0.1\",\n  \"private\": true,\n  \"dependencies\": {\n  \
    \  \"nodeunit\": \"0.7.x\"\n  }\n}\n```\n\nWhen you run npm update, nodeunit is\
    \ installed, and you can begin writing and running tests.\n\n# Writing Tests\n\
    \nNodeunit organizes tests into modules, with each exposed function acting as\
    \ a test, and each exposed object acting as a group of tests. To each test, you\
    \ are given an object that will help you perform the tests and tell nodeunit when\
    \ you are done:\n\n```\nexports.test1 = function (test) {\n  test.equals(true,\
    \ true);\n  test.done();\n}\n```\n\nYou must call test.done at the end of every\
    \ single test; otherwise, nodeunit does not know when it is finished. To run this\
    \ test, save it to a file named trivial.js and run the provided running script\
    \ in the node_modules/.bin folder. On both Unix/Mac platforms and Windows, you\
    \ run (switch the / for \\ characters on Windows, of course)\n\n```\nnode_modules/.bin/nodeunit\
    \ trivial.js\n```"
