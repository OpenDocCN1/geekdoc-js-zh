  md: "To include it in a file, you require it as follows:\n\n```\nvar pool = require('generic-pool');\n\
    ```\n\nTo create a pool, you create a new instance of the pool class with some\
    \ configuration information, namely the number of pool items you want, and the\
    \ function to create a new object:\n\n```\nconn_props = local.config.db_config;\n\
    mysql_pool = Pool({\n  name: 'mysql',\n  create: function (callback) {\n    var\
    \ c = mysql.create({\n      host: conn_props.host,\n      user: conn_props.user,\n\
    \      password: conn_props.password,\n      database: conn_props.database\n \
    \   });\n    callback(null, c);\n  },\n  destroy: function (client) {\n    client.end();\n\
    \  },\n  max: conn_props.pooled_connections,\n  idleTimeoutMillis: conn_props.idle_timeout_millis,\n\
    \  log: false\n});\n```\n\n# Working with Connections\n\nIn the code, whenever\
    \ you want a connection to your MySQL server, instead of creating a new one, you\
    \ can just let the pool manage all for you. The acquire function blocks until\
    \ a connection is available for you to use. The previous db function in db.js\
    \ becomes\n\n```\nexports.db = function (callback) {\n  mysql_pool.acquire(callback);\n\
    });\n```\n\nAnd when you're done with the connection, you can just release it\
    \ back to the connection pool as follows:\n\n```\nconn.release();\n```\n\nAnybody\
    \ else waiting for a connection gets it right away.\n\n# Authenticating the API\n\
    \nNow, you're probably sitting feeling quite smug knowing that your application\
