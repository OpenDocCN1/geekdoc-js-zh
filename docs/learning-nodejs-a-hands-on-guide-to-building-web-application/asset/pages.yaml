  md: "# Events\n\nStreams are actually a subclass of the Node.js Event class, which\
    \ provides all the functionality for connecting and emitting events in your JavaScript\
    \ files. You can inherit from this class to create your own event firing classes.\
    \ For this example, create a dummy downloader class that fakes a remote download\
    \ via a two-second setTimeout:\n\n```\nvar events = require('events');\n\nfunction\
    \ Downloader() {\n  Downloader.prototype = new events.EventEmitter();\n  Downloader.prototype.__proto__\
    \ = events.EventEmitter.prototype;\n  Downloader.prototype.url = null;\n  Downloader.prototype.download_url\
    \ = function (path) {\n    var self = this;\n    self.url = 'start';\n    self.emit('start',\
    \ path);\n    setTimeout(function () {\n      self.emit('end', path);\n    },\
    \ 2000);\n  }\n}\n\nvar d = new Downloader();\nd.on(\"start\", function (path)\
    \ {\n  console.log(\"started downloading: \" + path);\n});\nd.on(\"end\", function\
    \ (path) {\n  console.log(\"finished downloading: \" + path);\n});\nd.download_url(\"\
    http://marcwan.com\");\n```\n\nYou signal that an event has been used by using\
    \ the emit method with the name of the event and any arguments you would like\
    \ passed to the listening function. You should make sure that all possible code\
    \ paths (including errors) signal an event; otherwise, your Node program might\
    \ hang.\n\n# Assembling Content on the Client: Templates\n\nIn more traditional\
    \ web application models, the client sends an HTTP request to the server, the\
    \ server gathers all the data and generates the HTML response, and it sends that\
    \ as text. While this way of doing things is very reasonable, it has a few key\
    \ disadvantages:\n\n+   - It doesn't take advantage of any of the computing power\
    \ available on the average client compute these days. Even the average mobile\
    \ phone or tablet is multiple times more powerful than PCs of 10 years ago."
  merge: -1
