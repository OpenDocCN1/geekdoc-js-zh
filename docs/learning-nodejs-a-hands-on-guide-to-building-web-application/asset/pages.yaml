    \ in this program, it does not exit until you process.exit, the user enters a\
    \ blank line, or the user presses Ctrl+C during buffered input (which causes Node\
    \ to just terminate).\n\n# The readline Module\n\nOne way to work with input in\
    \ Node.js is to use the readline module. It's still marked as Unstable and subject\
    \ to change, so I don't devote too much time and energy to it, but it has a couple\
