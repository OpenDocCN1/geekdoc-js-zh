  md: '# Chapter 7 Building Web Applications with Express


    Note, while you technically can serve content from your application''s folder
    by using the __dirname predefined variable in Node (it gives you the path to the
    currently executing Node script), this is a terrible idea and you should never
    do it.


    The static middleware provides no security at all, so you say the photo-sharing
    application from before and just add


    ```

    app.use(express.static(__dirname));

    ```


    You could then—as expected—browse for /content/style.css and /templates/home.html
    without any problems. The problem is that if the user asks for /server.js or /handlers/albums.js,
    the static middleware happily serves them because they lie off the __dirname folder.


    You might ask why security has not been added to the static middleware component,
    but this is the wrong question—it''s an unnecessary complication. If you want
    to use this component, put your static content outside of your application source
    tree. Indeed, as I''ve hinted before, you might even choose to have your application
    avoid serving static content altogether and opt to put the static content on CDNs
    instead. So get used to separating these components out of your source tree from
    the start.


    If you rewrite your server.js to use the static middleware, it looks something
    like the following. It does, require, however, that you move the content/, templates/,
    and album folders to another location so that you can avoid the security problem
    I just mentioned. The updated app structure looks as follows:


    +   + root_folder/

    + static/

    + albums/

    + content/

    + templates/

    + app/

    + handlers/

    + node_modules/


    Then the server.js file can look like that shown in Listing 7.3. One nice thing
    about this new version of the server is that you''ve managed to remove two routing
    functions—those for content and templates.


