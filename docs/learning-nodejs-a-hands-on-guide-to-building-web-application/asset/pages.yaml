    some further modules to help you keep track of things more easily.


    It is thus that you are not going to develop the photo album much further in its
    current form, but continue to look at some modules that will clean up your code
    significantly and allow you to add features quickly and with little code. You
    will do so using the Express Application Framework for Node.'
