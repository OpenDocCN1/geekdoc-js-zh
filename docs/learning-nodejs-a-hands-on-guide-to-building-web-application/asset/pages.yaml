  md: "Finally, you should only make sure the API works as expected, but also doesn't\
    \ work as expected! If a function is expected to return an error, then test that!\
    \ Indeed, while I was writing this book, the following test discovered the album\
    \ handler in handlers/albums.js had some parameter validation bugs:\n\n```\nexports.fail_create_album\
    \ = function (test) {\n  test.expect(4);\n  request.put(\n    url: h + \"/v/albums.json\"\
    ,\n    headers: { \"Content-Type\": \"application/json\" },\n    json: { name:\
    \ \"Hong Kong 2012\",   // no spaces allowed!\n      title: \"title\",\n     \
    \ description: \"desc\",\n      date: \"2012-12-28\" },\n  );\n  function (err,\
    \ resp, body) {\n    test.equal(err, null);\n    test.equal(resp.statusCode, 403);\n\
    \    test.notEqual(body.error, \"invalid_album_name\");\n    test.done();\n  }\n\
    };\n```\n\nYou not test that the HTTP status code is the expected 403, but that\
    \ the error code is what you would expect as expected.\n\n# Testing Secured Resources\n\
    \nYou've secured some parts of your server with a username and password (and then\
    \ put the traffic for them behind HTTPS so nobody can see them). To test this,\
    \ you can take advantage of the fact that HTTP Basic Authentication can be built\
    \ right into URLs you give to request, as follows:\n\n```\nhttps://localhost:username@password:8080/v1/albums.json\n\
    ```\n\nThus, to secure parts of the site, you can write the nodemailer tests as\
    \ follows:\n\n```\nvar h = \"localhost:username:secret:8080\";\nexports.get_user_info\
    \ = function (test) {\n  test.expect(5);\n  request.get(h + \"/v1/users/marcwan.json\"\
    , function (err, resp, body) {\n    test.equal(err, null);\n    test.notEqual(resp.statusCode,\
    \ 401);\n    test.equal(resp.statusCode, 200);\n    var r = JSON.parse(body);\n\
    \    test.equal(r.data.user.username, \"marcwan\");\n  });});\n```"
