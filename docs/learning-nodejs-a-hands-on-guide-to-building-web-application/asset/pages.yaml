  md: "# Getting memcached into express\n\nNow that you have memcached installed and\
    \ running (assume localhost on port 11211), you need to get a MemoryStore object\
    \ for it so that you can use it for your session data. Fortunately, the Nodejs\
    \ community is active so that there's already an npm module called connect-memcached.\
    \ So, let's add the following to your dependencies in package.json:\n\n```\n```json\n\
    \"connect-memcached\": \"0.0.x\"\n```\n```\n\nThen you can modify your session\
    \ code as follows:\n\n```\n```javascript\nvar express = require('express');\n\n\
    // pass the express obj so connect-memcached can inherit from MemoryStore\nvar\
    \ MemcachedStore = require('connect-memcached')(express);\nvar mcds = new MemcachedStore({\
    \ hosts: \"localhost:11211\" });\n\nvar app = express()\n  .use(express.logger('dev'))\n\
    \  .use(express.cookieParser())\n  .use(express.session({\n    secret: \"cat on\
    \ keyboard\",\n    cookie: { maxAge: 1800000 },\n    store: mcds\n  }));\n\n.use(function(req,\
    \ res) {\n    var x = req.session.last_access;\n    req.session.last_access =\
    \ new Date();\n    res.end(\"You last asked for this page at: \" + x);\n  })\n\
    \  .listen(8080);\n```\n```\n\nNow, all the Node servers can be configured to\
    \ use the same MemoryStore for session data and will be able to fetch the correct\
    \ information, no matter where the request is processed.\n\n# Virtual Hosting\n\
    \nRunning multiple websites on one server has been a major requirement of web\
    \ application platforms for many years now, and fortunately Node.js offers a couple\
    \ of very workable solutions for you when you build your apps with express.\n\n\
    You implement virtual hosting by adding the Host: header to the incoming HTTP\
    \ request, one of the major features in HTTP/1.1 (see Figure 10.4)."
