  md: '# A Closer Look at JavaScript


    Chances are, if you are reading this book, you have worked with JavaScript in
    the past. Perhaps you have worked on or written a web application that uses HTML,
    CSS, and JavaScript, and you have written some code to make the client more dynamic
    and interactive, either directly by manipulating the browser Document Object Model
    (DOM) or by using a framework such as jQuery or Prototype to hide some of the
    messy details for you. You might have found working with browsers a reasonably
    frustrating experience, spent a lot of time fighting the different browsers''
    incompatibilities, and it is also quite possible that you have never really studied
    the JavaScript language apart from the most basic of language features, looking
    things up on the fly as you go.


    The good news is that web browsers are slowly driving a much-needed cleanup of
    the JavaScript language. Additionally, ECMAScript, which is the specification
    itself on which modern implementations are based, is also evolving. The Chrome
    V8 JavaScript engine itself is also improving and cleaning up many frustrating
    things about the language and adding important features that are missing and need
    updating.


    So, if you''ve already played around with JavaScript in the past, it is probably
    worth your while to read this chapter fully and learn some of the details you
    might have overlooked or about some of the new features or those changed by V8
    and Node.js. Although most of the discussion in this chapter is applicable to
    standard JavaScript, sometimes I show you something new and improved in Google''s
    V8. For such nonstandard features, I mark them with (V8 JS).


    # Types


    This section begins the review of JavaScript by looking at the types the language
    offers. For much of the discussion in this chapter, I use the Node.js Read-Eval-Print-Loop
    (REPL) to demonstrate how the code works. To help you out, I use **bold** to indicate
    things that you type into the interpreter.


    ```

    client:LearningNode marc$ node >

    ```'
