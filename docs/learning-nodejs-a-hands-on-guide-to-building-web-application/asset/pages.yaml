    # # Summary


    Testing your Node.js apps and scripts is both simple and fast with many of the
    available testing frameworks available via npm. In this chapter, I showed you
    not only how to use nodeunit, a popular TDD framework, to test the synchronous
    and asynchronous portions of your applications, but also how to combine it with
    request to perform full API-level testing of your JSON servers.


    With this knowledge tucked under your belt, you''ve come to the end of your tour
    of Node.js. I hope that I''ve been able to convey some of the reasons why Node.js
    is so unbelievably exciting and fun to develop with and encouraged you to type
    things and play with the platform as you''ve been reading along.


    Sit down and start to write some code. If you have an idea for a website, start
    putting together some pages and APIs for it. If you do mobile development, think
    about the ways in which you can deliver a server to mobile customers, and figure
    out how to use Node to do that. Even if you''re just looking to script some things
    on a server, play around and start writing code today. The only way to get better
    at programming on any platform is just to use it.


    If you run into problems, don''t forget that the Node.js community is extremely
    active and helpful. With so many helpful and motivated members, it''s certain
    you''ll be able to meet many like-minded users and get all the resources and help
    you you need to build interesting, useful, and fun applications.'
