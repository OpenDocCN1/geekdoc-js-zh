  md: '# Updating Your Photo Albums App 171


    controls how many should be returned after you''ve done any skipping, and the
    last controls ordering and sorting—you are welcome to sort on more than one field.


    So, to fetch all the photos in an album sorted ascending by date, you would write


    ```

    photos.find({ albumid: "italy2012" })

    sort({ date: 1 })   // 1 is asc, -1 is desc

    toArray(function (err, results));

    ```


    To return the third page of these photos, assuming pages are 20 photos each, you
    would use


    ```

    photos.find({ albumid: "italy2012" })

    sort({ date: 1 })   // 1 is asc, -1 is desc

    skip(40)

    limit(20)

    toArray(function (err, results));

    ```


    Again, anything called before the toArray function at the end is just setting
    up the results

    cursor, and the query is not executed until that last function call.


    You can pass multiple fields to the sort function for sorting on multiple values:


    ```

    collection.find()

    sort({ field1: -1, field2: 1 })

    toArray(callback);

    ```


