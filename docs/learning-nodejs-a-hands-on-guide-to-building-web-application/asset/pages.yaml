  md: '# Chapter 9 Databases II: SQL (MySQL)


    If the connection fails, you get an error. If it succeeds, you can then use your
    client object to execute queries. After finishing all your work with the database,
    you should close the connection by calling the end method:


    ```

    dbclient.end();

    ```


    # Adding Queries


    After connecting to the database server, you can start executing queries with
    the (wait for it...) query method, to which you pass the SQL statements you executed:


    ```

    dbclient.query(''SELECT * FROM Albums ORDER BY date'', function (err, results,
    fields) {});

    ```


    If the query succeeds, the results parameter passed to the callback contains data
    relevant to what you requested, and there is a third parameter, fields, for those
    cases when you have additional information to specify. (It is often when you don''t
    have such information.) For SELECT statements, the second parameter is an array
    of queried rows:


    ```

    dbclient.query(''SELECT * FROM Albums'', function (err, rows) {

    for (var i = 0; i < rows.length; i++) {

    console.log('' -> Album: " + rows[i].name + '' "'' + rows[i].date + '' ");'');

    }

    });

    ```


    If you are using INSERT, UPDATE, or DELETE, the results you get back from query
    method look more similar to the following:


    ```

    { fieldCount: 0,

    affectedRows: 0,

    insertId: 0,

    serverStatus: 2,

    warningCount: 0,

    message: '''',

    changedRows: 0 }

    ```


    You can use this information to make sure that the number of affected rows is
    what you expected it to be by looking at the affectedRows property, or you can
    get the autogenerated ID of the last inserted row via the insertId property.


    And that''s pretty much all there is to use MySQL in Node.js. Let''s put it to
    some serious use then!


