  md: '# The HTML Skeleton Page


    Although you might attempt to do all HTML generation on the client, you cannot
    completely avoid the server doing any at all; you still need to send down the
    initial page skeleton that the client can use to perform the rest of the generation.


    For this example, you use a reasonably simple HTML page, which is saved as basic.html,
    shown in Listing 6.1.


    +   Listing 6.1 The Simple App Page Bootst (basic.html)


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Photo Album</title>

    <!-- Meta --

    <meta http-equiv="content-type" content="text/html; charset=utf-8" />

    <!-- Stylesheets --

    <link rel="stylesheet" href="http://localhost:8080/content/style.css" type="text/css"
    />

    <!-- javascripts --

    <script src="http://localhost:8080/content/jquery-1.8.3.min.js" type="text/javascript"></script>

    <script src="http://localhost:8080/content/mustache.js" type="text/javascript"></script>

    <script src="http://localhost:8080/content/{{PAGE_NAME}}.js" type="text/javascript"></script>

    </head>

    <body></body>

    </html>

    ```


    This file is straightforward; it has a style sheet, and you include jQuery and
    Mustache. The last script tag is the most interesting: This file is the page bootstrap
    that holds the code that will download the template, get the JSON data from the
    server for the page, and generate the HTML for the page based on these two files.
    You can see that it is set up with a parameter {{PAGE_NAME}} to replace with the
    actual page you will be loading at any given time.'
