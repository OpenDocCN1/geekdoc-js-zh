  md: '# Level: Ninja


    The previous scripts for running applications are pretty useful, and you can use
    them for low-traffic sites that don''t crash every often. They do have a couple
    of serious limitations, however:


    +   1. If an app gets into a state where it is constantly crashing, even when
    restarted, these scripts blindly keep restarting, resulting in what is known as
    a "run-away process." You never even get it to start properly, and your server
    will work itself to death constantly trying.

    2. Although these scripts keep your processes up and running, they don''t do a
    good job of telling you when they''re in trouble, specifically if they''re using
    up too much memory. There are still instances where a Node process can consume
    a bit too memory or otherwise get into trouble with system resources. It would
    be great if there were a way to detect this and terminate and let them start again
    from scratch.


    Thus, in the following sections, you look at a couple of more advanced deployment
    options, which start to deviate quite greatly for UNIX and Windows at this point.


    # Linux/Mac


    The previous version of your script (when viewed as pseudo-code) was effectively
    while


