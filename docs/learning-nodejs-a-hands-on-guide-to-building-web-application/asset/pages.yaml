    \ it's been marked as deleted. The Users table looks as follows:\n\n```\nCREATE\
    \ TABLE Users\n(\n  user_uuid VARCHAR(50) UNIQUE PRIMARY KEY,\n  email_address\
    \ VARCHAR(150) UNIQUE,\n\n  display_name VARCHAR(100) NOT NULL,\n  password VARCHAR(100),\n\
    \n  first_seen_date BIGINT,\n  last_modified_date BIGINT,\n  deleted BOOL DEFAULT\
    \ false,\n\n  INDEX(email_address),\n  INDEX(user_uuid)\n) ENGINE = InnoDB;\n\
    ```\n\nRunning all these commands in MySQL (mysql -u user -p secret < schema.sql)\
    \ sets up the appropriate database and table structures you need to begin writing\
    \ code. If you're following along with the code from the GitHub repository, you'll\
    \ notice that tables have been added for albums and photos.\n\n# Basic Database\
    \ Operations\n\nMost of your work with MySQL will be limited to making connections\
