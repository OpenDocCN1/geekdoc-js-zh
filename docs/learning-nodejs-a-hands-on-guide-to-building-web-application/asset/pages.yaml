    \ the INSTALL-BINARY text file and follow the instructions in there to get MySQL\
    \ fully and running. When you're done, you should be able to start a new command\
    \ prompt or run the mysql command:\n\n```\nKimidori:Learning Node marcw$ /usr/local/mysql/bin/mysql\
    \ -u root\nWelcome to the MySQL monitor. Commands end with ; or \\\nYour MySQL\
    \ connection id is 1\nServer version: 5.5.29 MySQL Community Server (GPL)\n```\n\
    \n# Adding the mysql Module from npm\n\nTo install the mysql module for Node.js,\
    \ you can modify the package.json and add the follow-ing dependencies:\n\n```\n\
    \"dependencies\": {\n  \"async\": \"0.1.x\",\n  \"mysql\": \"2.x\"\n}\n```\n\n\
    You should see mysql/ under node_modules/ in your folder. Note that the 2.x series\
    \ of the mysql module is a significant improvement and departure from the 0.x\
    \ series. One of the trickier parts of Node.js is that it's constantly under development\
    \ and improvement; things are still changing quite a bit. You use the 2.x series\
    \ in this book because it's much more robust than what was there before.\n\n#\
    \ Creating a Schema for the Database\n\nWhen working with MySQL, you need to create\
    \ a database schema for the application, which you place in schema.sql. The first\
