  md: "# Modifying Things: POST Data\n\nNow that I've largely covered how to get things\
    \ into your JSON server, you might like to start being able to send data to it,\
    \ either to create new things or modify ones. This is typically done with HTTP\
    \ POST data, and you can send the data in many different formats. To send data\
    \ using the curl method, you must do a few things:\n\n+   1. Set the HTTP method\
    \ parameter to POST (or PUT).\n2. Set the Content-Type of the incoming data.\n\
    3. Send the data itself.\n\nYou can easily accomplish these tasks with curl. You\
    \ do the first simply by changing the method name, by using HTTP headers with\
    \ the -H flag to curl, and the last you can do in a few different ways, but here\
    \ you can use the -d flag and just write the JSON as a string.\n\nNow it's time\
    \ to add some new functionality to the server to allow you to rename albums. Make\
    \ the URL format as follows and specify that it be a POST request:\nhttp://localhost:8080/albums/albumname/rename.json\n\
