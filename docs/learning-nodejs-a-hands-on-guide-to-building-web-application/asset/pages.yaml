    # # Summary


    This chapter introduced two key Node.js features, streams and events, that you
    used to serve up static content from your web application. Equally importantly,
    this chapter introduced client-template engines, and you used Mustache to put
    together a simple start to a front-end for your photo album application.


    You might have noticed, however, that some of the things you have been doing far
