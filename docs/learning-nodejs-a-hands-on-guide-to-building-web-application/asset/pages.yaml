  md: '# Numbers


    All numbers in JavaScript are 64-bit IEEE 754 double-precision floating-point
    numbers. For all positive and negative integers that can be expressed in 2^53
    bits accurately, the number type in JavaScript behaves much like integer data
    types in other languages:


    +   > 1024 + 1024

    1048576

    > 1048576

    1048576

    > 32437893250 + 3284598359235235

    3824630797128485

    > -38425358295 + 35892583295

    -25309550000


    The tricky part of using the number type, however, is that for any numeric values,
    it is an approximation of the actual number. For example:


    +   > 0.1 + 0.2

    0.30000000000000004


    When performing floating-point mathematical operations, you cannot just manipulate
    arbitrary real numbers and expect an exact value:


    +   > 1 - 0.3 + 0.1 == 0.8

    false


    For these cases, you instead need to check if the value is in some sort of approximate
    range, the size of which is defined by the magnitude of the values you are comparing.
    (Search the website stackoverflow.com for articles and questions on comparing
    floating-point numbers for good ideas of strategies on this.)


    For those situations where you absolutely need to represent 64-bit integer values
    in JavaScript without any chance of approximation errors, you are either stuck
    using the string type and manipulating these numbers by hand, or you can use one
    of the available modules for manipulating big values.


    JavaScript is a bit different from other languages in that dividing a number by
    zero returns the value Infinity or -Infinity instead of generating a runtime exception:


    +   > 5 / 0

    Infinity

    > -5 / 0

    -Infinity'
