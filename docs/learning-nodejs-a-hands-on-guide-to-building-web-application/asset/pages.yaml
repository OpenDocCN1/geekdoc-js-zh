    \ to run, or something complicated like \"echo 'Mancy' | sed s/M/N/g\". All commands\
    \ are run, and all output is buffered and passed back to the caller after the\
    \ command finishes.\n\nThe basic format is\n\n```\nexec(command, function (error,\
    \ stdout, stderr) {\n  // error is if an error occurred\n  // stdout and stderr\
    \ are buffers\n});\n```\n\nAfter the command finishes executing, the callback\
    \ is called. The first parameter is non-null only if an error occurred. Otherwise,\
    \ stdout and stderr are set to Buffer objects with the full contents of anything\
    \ written to the respective output stream.\n\nNow write a program that uses the\
    \ exec cat program (type on Windows). It takes the name of a file to print out.\
    \ It uses the exec function to launch the cat/type program and prints out all\
    \ the output when you're done:\n\n```\nvar exec = require('child_process'), exec,\n\
    child;\n\nif (process.argv.length != 3) {\n  console.log(\"I need a file name\"\
    );\n  process.exit(-1);\n}\n```\n\n```\nvar file_name = process.platform == 'win32'\
    \ ? 'type' : \"cat\";nchild = exec(cmd + \" \" * \" + file_name, function (error,\
    \ stdout, stderr) {\n  console.log('stdout: ' + stdout);\n  console.log('stderr:\
    \ ' + stderr);\n}\n\nif (error) {\n  console.log(\"Error exec'ing the file\");\n\
    \  console.log(error);\n  process.exit(1);\n});\n```\n\n# Advanced Process Creation\
    \ with Spawn\n\nA more advanced way of creating processes is to use the spawn\
    \ function available in the child_process module. This function gives you complete\
    \ control over the stdin and stdout of the child processes you create, and permits\
    \ some fantastic functionality, such as piping output from one child to another."
