  md: "# Multiprocessor Deployment: Using a Proxy 219\n\n![](img/462d9f726aa4852bc590bb4b26fa8f32_234_0.png)\n\
    \nFigure 10.1 Running multiple node processes for the same app\n\nYou can solve\
    \ this problem by implementing a simple round-robin load balancer that is given\
    \ a list of node servers running your particular web application. You then redirect\
    \ incoming requests to your domain to these other servers, one at a time. You\
    \ can, of, experiment with more advanced strategies that monitor load, availability,\
    \ or responsiveness.\n\nTo implement the load balancer, you first compile a list\
    \ of servers that are running. Say you have a server with four cores; you give\
    \ three of them over to the app (and leave the fourth for running other system\
    \ services). You run these app servers on ports 8081, 8082, and 8083. Thus, your\
    \ list of servers is {\n\n```\n\"servers\": {\n  \"host\": \"localhost\",\n  \"\
    port\": \"8081\"\n},\n{\n  \"host\": \"localhost\",\n  \"port\": \"8082\"\n},\n\
    {\n  \"host\": \"localhost\",\n  \"port\": \"8083\"\n}\n```\n\nThe code for these\
    \ simple servers is shown in Listing 10.1. It is the most simple web server that\
    \ you've seen in this book, with an additional bit of code to get the port number\
    \ on it should listen from the command line. (You learn more about command-line\
    \ parameters in Chapter 11, \"Command-Line Programming.\")"
  merge: -1
  pgno: 234
- img_proc: true
  md: "# Chapter 10 Deployment and Development\n\nListing 10.1 Trivial HTTP Server\n\
    \n```\nvar http = require('http');\n\nif (process.argv.length != 3) {\n    console.log(\"\
    Need a port number\");\n    process.exit(-1);\n}\n\nvar s = http.createServer(function\
    \ (req, res) {\n    res.end(\"I listened on port \" + process.argv[2]);\n});\n\
    \nsns.listen(process.argv[2]);\n```\n\nYou can launch your three servers on UNIX/Mac\
    \ platforms by typing\n\n+   $ simple.js 8081 &\n$ simple.js 8082 &\n$ simple.js\
    \ 8083 &\n\nOn Windows platforms, you can launch them by simply running the following\
    \ commands in different command prompts:\n\n+   node simple.js 8081\nnode simple.js\
    \ 8082\nnode simple.js 8083\n\nYou can build your proxy server using the npm module\
    \ http-proxy. The package.json looks as follows:\n\n```\n{\n    \"name\": \"Round-Robin-Demo\"\
    ,\n    \"description\": \"A little proxy server to round-robin requests\",\n \
    \   \"version\": \"0.0.1\",\n    \"private\": true,\n    \"dependencies\": {\n\
    \        \"http-proxy\": \"0.8.x\"\n    }\n}\n```\n\nThe code for the proxy is\
    \ quite simple, as shown in Listing 10.2. It basically maintains an array of available\
    \ servers, as shown previously, and then for each request coming to the service,\
    \ cycles through those available servers and forwards the requests to them."
  merge: -1
  pgno: 235
