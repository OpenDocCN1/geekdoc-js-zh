  md: '# Structuring Your Data for MongoDB


    You can then run npm update to get the latest version of all of the drivers. If
    you look in the node_modules/ folder, you should see the mongodb/ subfolder there.


    # Structuring Your Data for MongoDB


    MongoDB is quite suitable for use in your applications because it uses JSON for
    storage itself. Whenever you create or add things to your database, you pass around
    JavaScript objects—which is extremely convenient for you in Node!


    If you''ve used relational databases before, you''re likely familiar with the
    terminology of databases, tables, and rows. In MongoDB, these elements are called
    databases, collections, and documents, respectively. Databases are partitioned
    into collections of objects, all of which are represented by JSON documents.


    All objects in MongoDB have a unique identifier, represented by _id. It can basically
    be any type as it''s a unique value. If you do not provide one, MongoDB creates
    one for you: It is an instance of the class ObjectId. When printed, it returns
    a 24-character hexadecimal string, such as 5da80ce04d403ebda700012.


    # It''s All JavaScript


    For the photo application, you need to create two document types: one for albums
    and one for photos within albums. You do not need to use MongoDB''s autogenerated
    _id values because you always uniquely identifying information for your documents:
    For albums, the album_name is always unique, and for photos, the combination of
    album_name and photo filename is unique.


    Thus, you store your albums as follows:


    ```

    { _id: "Italy2012",

    name: "Italy2012",

    title: "Spring Festival in Italy",

    date: "2012/02/15",

    description: "I went to Italy for Spring Festival." }

    ```


    And your photo documents look similar to the following:


    ```

    { _id: "ital2012_picture_01.jpg",

    filename: "picture_01.jpg",

    albumid: "italy2012",

    description: "ZOMG it''s Rome!",

    date: "2012/02/15 16:20:40" }

    ```


    Attempting to insert values into a collection with duplicate _id values causes
    MongoDB to signal an error. Use this capability to ensure that albums are unique
    and image files within an album are also unique.'
