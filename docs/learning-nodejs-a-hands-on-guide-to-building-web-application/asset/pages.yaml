  md: "# Chapter 3 Asynchronous Programming\n\nthen you exit. When the fs.open function\
    \ completes its work and Node runs the callback, you no longer have the context\
    \ of the FileObject class anymore, and the callback function is given a new pointer!\n\
    \nThe bad news is that you, indeed, lost your pointer referring to the FileObject\
    \ class. The good news is that the callback function for fs.open does have its\
    \ function scope. A common solution to this problem is to \"save\" the disappearing\
    \ pointer in a variable called self or something similar. Now rewrite the file_exists\
    \ function to take advantage of this:\n\n```\nthis.file_exists = function (callback)\
    \ {\n  var self = this;\n\n  console.log(\"About open: \" + self.filename);\n\
    \  fs.open(this.filename, 'r', function (err, handle) {\n    if (err) {\n    \
    \  console.log(\"Can open: \" + self.filename);\n      callback(err);\n      return;\n\
    \    }\n    fs.close(handle, function () {\n      callback(null, true);\n    });\n\
    \  });\n}\n```\n\nBecause function scope is preserved via closures, the new self\
    \ variable is maintained for you even when your callback is executed asynchronously\
    \ later by Node.js. You will make extensive use of this in all your applications.\
    \ Some people like to use me instead of self because it is shorter; others still\
    \ use completely different words. Pick whatever you like and stick with it for\
    \ consistency.\n\n# Being Polite—Learning to Give Up Control\n\nNode runs in a\
    \ single thread with a single event loop that makes calls to external functions\
    \ and services. It places callback functions on the event queue to wait for the\
    \ responses and tries to execute code as quickly as possible. So what happens\
    \ if you have a function that tries to compute the intersection between two arrays:\n\
    \n```\nfunction compute_intersection(arr1, arr2, callback) {\n  var results =\
    \ [];\n  for (var i = 0; i < arr1.length; i++) {\n    for (var j = 0; j < arr2.length;\
    \ j++) {\n      if (arr2[j] == arr1[i]) {\n        results[results.length] = arr1[j];\n\
    \        break;\n      }\n    }\n  }\n}\n```"
