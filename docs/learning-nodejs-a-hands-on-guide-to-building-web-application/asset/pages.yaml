  md: "# Working with Files Synchronously\n\nFor nearly every single API you have\
    \ seen in the file system module (fs), both asynchronous and synchronous versions\
    \ are available. You have mostly been using the asynchronous versions far, but\
    \ the synchronous versions can be extremely useful to you when writing command-line\
    \ programs. Basically, for a vast majority of APIs in fs with the name func, there\
    \ is a corresponding API called funcSync.\n\nIn the following sections, you look\
    \ at a few examples of how you can use some of synchronous APIs.\n\n# Basic File\
    \ APIs\n\nThe fs module doesn't have a file copy function, so you can write one\
    \ yourself. For the open, read, and write APIs, you use the synchronous versions:\
    \ openSync, readSync, and writeSync. In the synchronous versions, they throw an\
    \ error if anything goes wrong. You can use a buffer to hold the data as you copy\
    \ from location a to b. Be sure to close everything you're done:\n\n```\nvar BUFFER_SIZE\
    \ = 1000000;\n\nfunction copy_file_sync (src, dest) {\n  var read_so_far, fdsrc,\
    \ fdest, read;\n  var buff = new Buffer(BUFFER_SIZE);\n\n  fdsrc = fs.openSync(src,\
    \ 'r');\n  fdest = fs.openSync(dest, 'w');\n  read_so_far = 0;\n\n  do {\n   \
    \ read = fs.readSync(fdsrc, buff, BUFFER_SIZE, read_so_far);\n    fs.writeSync(fdest,\
    \ buff, 0, read);\n    read_so_far += read;\n  } while (read > 0);\n\n```\n\n\
    ```\nfs.closeSync(fdsrc);\nreturn fs.closeSync(fdest);\n\n```\n\nTo call this\
    \ function, you can write a file_copy.js script that makes it get enough arguments,\
    \ calls the copy function, and handles any errors that are thrown during the process:\n\
    \n```\nif (process.argv.length != 4) {\n  console.log(\"Usage: \" + path.basename(process.argv[1],\
    \ '.js')\n  + \" [src_file] [dest_file]\");\nn\n```"
  merge: -1
