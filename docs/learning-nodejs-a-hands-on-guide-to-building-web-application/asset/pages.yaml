    # Manipulating Binary Data with Buffers


    Thus in your Node.js experience, you have been using strings, typically UTF-8
    strings, to do your work. However, when working with streams and files, you actually
    work most with the Buffer class.


    Buffers work more or less as you''d expect them to: They hold binary data that
    can be converted into other formats, used in operations to write files, or broken
    apart and reassembled.


    One critical point to remember about buffers is that the length property on the
    object does not return the size of the content, but that of the buffer itself!
    For example:


    ```

    var b = new Buffer(10000);

    var str = "中国密码";nnb.write(str); // default utf8, which is what we want

    console.log(b.length ); // will print 10000!

    ```


    Node.js does not keep track of what you have written to place in the buffer, you
    must keep track of these things yourself.


    Sometimes a string does not have the same byte length of characters—for example,
    the preceding string "中国密码". Buffer.byteLength returns the former:


    ```

    console.log(str.length ); // prints 5

    console.log(Buffer.byteLength(str)); // prints 15

    ```


    To convert a buffer to a string, you should use the toString method. You will
    almost always have it to convert to UTF-8 strings:


    ```

    console.log(buf.toString(''utf8''));

    ```'
