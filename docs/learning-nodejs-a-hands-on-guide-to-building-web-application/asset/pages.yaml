  md: '# Chapter 3 Asynchronous Programming


    ![](img/462d9f726aa4852bc590bb4b26fa8f32_65_0.png)


    Figure 3.1 Traditional blocking IO web servers


    The problem is that for each of these processes or threads that there is some
    amount of overhead. For heavier implementations using Apache and PHP, I have seen
    up to 10–15MB per-process memory overhead in the past—never mind the resources
    and time consumed by the operating system switching that constantly executing
    servers per gigabyte of RAM! Threaded solutions and those using more than 100
    simultaneously lightweight HTTP servers do, of course, have better results, but
    you will still end up in a situation where the computer spends most of its time
    waiting around for blocked processes to get their results, and you running out
    of capacity to handle incoming requests.


    It would be nice if there were some way to make better use of all the available
    CPU computing power and available memory so not to waste much. This is where Node.js
    shines.


