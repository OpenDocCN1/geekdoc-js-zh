  md: '# # Building Web Applications with Express


    Thus far, you have been learning the fundamentals and core concepts of Node.js;
    armed with these ideas, you have built some simple applications, although you''ve
    had to write a lot of code to do some reasonably basic things. It''s time to change
    gears bit and start building more interesting web applications, using one of the
    biggest strengths of Node: the huge collection of libraries and modules available
    to you through npm. Now that you understand the core workings of Node and modules,
    it''s time to find ways to make your life significantly easier and your development
    much faster.


    In this chapter, you start working with express, a web application framework for
    Node. It takes care of many of the basic tasks you learned about in previous chapters,
    and even exposes some powerful new functionality that you can take advantage of
    in your apps. I show you how to build apps with express and update your photo
    album app to use it. Then you look a bit more at application design, learn how
    to expose the API from your JSON server, and explore some new functionality you
    haven''t seen before.


    # ## Installing Express


    In this chapter, you are going to slowly change the way you install applications
    via npm. You might expect that, to install express, you''d just type


    ```

    npm install express

    ```


    and this would work just fine. However, it always installs the latest version
    of the express node module, which might not not want when you''re deploying your
    application to live production servers. When you develop and test against a particular
    version, it''s good to have that same version run on the live servers. Only after
    you update to a newer version and fully test against that you want to use that
    new version on the live servers.'
  merge: -1
  pgno: 152
- img_proc: true
  md: "# Chapter 7 Building Web Applications with Express\n\nSo, the basic methodology\
    \ for building Node applications is now as follows:\n\n+   1. Create an application\
    \ folder.\n2. Write a package.json file describing the package and stating which\
    \ npm modules are needed.\n3. Run npm install to make sure these modules are installed\
    \ properly.\n\nSo, create a new folder called trivial_express for your express\
    \ test application and then put the following into package.json in that folder:\n\
    \n```\n{\n  \"name\": \"Express-Demo\",\n  \"description\": \"Demonstrates Using\
    \ Express and Connect\",\n  \"version\": \"0.0.1\",\n  \"private\": true,\n  \"\
    dependencies\": {\n    \"express\": \"3.x\"\n  }\n}\n```\n\nThe name and description\
    \ fields are reasonably self-explanatory, and the app is just a toy right now,\
    \ so it has an appropriate version number. As you see in Chapter 5, \"Modules,\"\
    \ you can set private to true, which tells npm never to try installing it in the\
    \ live npm registry because it is just a test project for your own use.\n\nAfter\
    \ creating the file, you can run the following to read in the dependencies section\
    \ and install all the appropriate modules:\n\n```\nnpm install\n```\n\nBecause\
    \ express itself depends on many different modules, you see a decent amount of\
    \ output before it exits, but your node_modules/ folder should be ready to go.\
    \ If you ever make a change to your package.json, you can just run npm update\
    \ to make sure all the modules are correctly installed.\n\n# Hello World in Express\n\
    \nRecall from Chapter 1, \"Getting Started,\" that your first web server in Node.js\
    \ was roughly the following:\n\n```\nvar http = require(\"http\");\n\nfunction\
    \ process_request(req, res) {\n  res.end(\"Hello World\");\n}\n\nvar s = http.createServer(process_request);\n\
    s.listen(8080);\n```"
  merge: -1
  pgno: 153
- img_proc: true
  md: "# Routing and Layers in Express\n\nWell, in express, it looks quite similar:\n\
    \n```\nvar express = require('express');\nvar app = express();\n\napp.get('/',\
    \ function(req, res) {\n  res.end('hello world');\n});\n\napp.listen(8080);\n\
    ```\n\nSave that, you run it, and then either curl or localhost:8080 in the web\
    \ browser, and you should get the hello world you expect. One of the great things\
    \ about express is that it is built on top of everything you have seen so far,\
    \ so the HTTP request and response objects have the same methods and properties\
    \ they had before. To be certain, they have many new things that made make them\
    \ more interesting and powerful, but you are not operating in a completely new\
    \ world here—just an extended version of the one which you are already familiar\
    \ and comfortable!\n\n# Routing and Layers in Express\n\nExpress is built on top\
    \ of a Node module called connect. Connect is what is known as a middleware library\
    \ that provides a collection of functions that network applications might need.\
    \ At the heart of this model is the concept of a flow of functions, or what some\
    \ people like to describe as a layered set of functions.\n\n# Middleware: What's\
    \ in a Name?\n\nWhen you run into the middleware for the first time, you can be\
    \ forgiven for being worried that you've missed out on some new concept or technology\
    \ shift. Fortunately, it's nothing so complicated.\n\nEffectively middleware originally\
    \ used to describe software components (typically on the server side of things)\
    \ that connects two things together, such as a business logic layer and a database\
    \ server, or storage services with application modules, and so on.\n\nOver time,\
    \ however, the term seems to become more generic and broad, and now seems to cover\
    \ any piece of software that connects two things together in one way, shape, or\
    \ form.\n\nFor the purposes of this book, the middleware exposed by connect that\
    \ you see in express is basically just a collection of modules that allow your\
    \ web apps to seamlessly integrate functionality from either the server or browser.\n\
    \nYou set up your application by creating a sequence of functions (layers) through\
    \ express navigates. When one decides it to take over, it can complete the processing\
    \ and stop the sequence. Express then walks back up the sequence to the end. (Some\
    \ layers do their process \"on the way in,\" others \"on the way out.\")"
