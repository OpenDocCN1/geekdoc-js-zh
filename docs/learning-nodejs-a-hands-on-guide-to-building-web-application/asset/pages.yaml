    \ would return the plain text \"Thanks for calling!\\n\". Now you can change this\
    \ little bit and have it do things differently:\n\n+   1. Indicate that the returned\
    \ data is application/json instead of text/plain.\n2. Print out the incoming request\
    \ on console.log.\n3. Return a JSON string.\n\nHere is the trivial server, which\
    \ is saved to simple_server.js:\n\n```\nvar http = require('http');\n\nfunction\
