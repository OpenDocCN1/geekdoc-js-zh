  md: '# Asynchronous Programming


    Now that you have a refreshed and updated idea of what JavaScript programming
    is really like, it''s time to get into the core concept that makes Node.js what
    it is: that of nonblocking IO and asynchronous programming. It carries with it
    some huge advantages and benefits, which you shall soon see, but it also brings
    some complications and challenges with it.


    # The Old Way of Doing Things


    In the old days (2008 or so), when you sat down to write an application and needed
    to load a file, you would write something like the following (let''s assume you''re
    using something PHP-ish for example purposes):


    ```

    $file = fopen(''info.txt'', ''r'');

    // wait until file is open

    ```


    ```

    $contents = fread(file, 100000);

    // wait until contents are read

    ```


    ```

    // do something with those contents

    ```


    If you are to analyze the execution of this script, you would find that it spends
    a vast majority of its time doing nothing at all. Indeed, most of the clock time
    taken by this script is spent waiting for the computer''s file system to do its
    job and return the file contents requested. Let me generalize things step further
    and that for most IO-based applications—those that frequently connect to databases,
    communicate with external servers, or read and write files—your scripts will spend
    a majority of their time sitting around waiting (see Figure 3.1).


    The way your servers process multiple requests at the same time is by running
    many of these scripts in parallel. Modern operating systems are great at multitasking,
    so you can easily switch out processes that are blocked and let other processes
    have access to the CPU. Some environments take things step further and use threads
    instead of processes.'
