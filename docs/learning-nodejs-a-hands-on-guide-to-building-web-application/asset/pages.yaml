    \ exited);\n}\n```\n\n```\nfunction print_stdout() {\n  var data = process.stdout.read();\n\
    \  console.log(\"stdout: \" + data.toString(\"utf8\"));\n}\n```\n\n```\nfunction\
    \ print_stderr(data) {\n  var data = process.stderr.read();\n  console.log(\"\
    stderr: \" + data.toString(\"utf8\"));\n}\n```\n\n```\nfunction exited(code) {\n\
    \  console.error(\"--> Node exited with code: \" + code + \". Restarting\");\n\
    \  spawn_node();\n}\n```\n\nspawn_node();\n\nThis program works by listening for\
    \ the exit event on the spawned process. Whenever it sees that, it restarts the\
