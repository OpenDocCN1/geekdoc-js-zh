  md: "# 240 Chapter 11 Command-Line Programming\n\nThe first line of this function,\
    \ to set the mask, is just a way for you to choose reasonable\npermissions for\
    \ the new directories. The caller of this function can specify them directly,\
    \ or he\ncan use what is known as the umask to filter out permissions that the\
    \ current shell user\ndoes want to give to new files (or directories). On Windows\
    \ machines, umask returns 0,\nindicating that it does not want to mask anything\
    \ at all; Windows uses a completely differ-\ner mechanism for file permissions.\n\
    \n# Listing Contents of Directories\n\nTo list the contents of a directory, you\
    \ can use the readdirSync function, which returns an\narray of filenames in the\
    \ specified folder, excluding \". and \"\":\n\n```\n#!/usr/local/bin/node\nvar\
    \ fs = require('fs');\n\nvar files = fs.readdirSync(\".\");\nconsole.log(files);\n\
    ```\n\n# Interacting with the User: stdin/stdout\n\nYou might be familiar with\
    \ the trio of IO handles given to all processes, stdin, stdout, and\nstderr, representing\
    \ input, normal output, and error output, respectively. These are all avail-\n\
    able to the Node.js scripts and hang the process object. In Node, they are all\
    \ instances of\nStream objects (see Chapter 6, \"Expanding Your Web Server\").\n\
    \nThe console.log function, in, is just the equivalent of\n\n```\nprocess.stdout.write(text\
