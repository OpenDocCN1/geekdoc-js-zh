  md: "# Running Node.js and \"Hello World!\"\n\nThere are two primary ways to use\
    \ Node.js on your machines: by using the Node Shell or by saving JavaScript to\
    \ files and running those.\n\n# The Node Shell\n\nThe first way you will run Node.js\
    \ is the Node Shell, which is frequently called the Node REPL—REPL stands for\
    \ Read-Eval-Print-Loop. It's a great way to quickly test things in Node. If you\
    \ don't remember exactly how a function should be used, you can just use the REPL\
    \ and type in something to see what happens.\n\nTo launch the Node Shell, you\
    \ simply type node in whatever shell you are using:\n\n```\nclient:node marcw$\
    \ \n```\n\n> > is all the response you get. You can immediately start typing in\
    \ some code:\n\n```\n> console.log(\"Hello World!\");\n```\n\nHello World!\nundefined\n\
    \nThe first line of the output is the result of the code you just executed. In\
    \ this case, you use the Node global variable console and its log function to\
    \ print out Hello World! (See the next chapter for more information on console\
    \ and other globals.) The output of this statement is, predictably, Hello World!,\
    \ which is printed for you.\n\nThe last line of the output is always the resulting\
    \ value of the preceding statement. Every statement, function call, or expression\
    \ has a value associated with it, which is printed out in the Node shell for you.\
    \ If there is no evaluated expression or the function does not return any particular\
    \ value, the special value undefined is returned instead.\n\nTo exit the REPL,\
    \ you simply press Ctrl+D (same on Windows).\n\nIf you see three dots (...) in\
    \ the Node REPL, that means it is expecting more input from you to complete the\
    \ current expression, statement, or function. If you do not quite understand why\
    \ it is the ellipsis, you can just type .break (with the period) to get out of\
    \ it:\n\n```\n> function () {\n...\n  ...what?\n  ...break\n}>\n```"
