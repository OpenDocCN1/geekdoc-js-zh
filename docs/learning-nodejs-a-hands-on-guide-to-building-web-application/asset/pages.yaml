    \  input: process.stdin,\n  output: process.stdout\n});\n```\n\nAfter you do this,\
    \ your program does not exit until rl.close is called!\n\n# Line-by-Line Prompting\n\
    \nIf you call the prompt method in readline, the program waits for a line of input\
