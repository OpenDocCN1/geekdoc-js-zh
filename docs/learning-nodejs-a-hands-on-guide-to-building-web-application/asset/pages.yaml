    \ that the X-Response-Time header is gone!\n\nHTTP/1.1 200 OK\nX-Powered-By: Express\n\
    Date: Wed, 05 Dec 2012 04:14:05 GMT\nConnection: keep-alive\nTransfer-Encoding:\
    \ chunked\n\nhello world\n\nThe function that prints “Hello World!” took the request\
    \ and handled it fully by not calling next and by using res.end to close down\
    \ the response, so the responseTime middleware never got a chance to inspect the\
    \ request. You're adding middleware components, think about how they're going\
    \ to fit together for the various routes your app will be using.\n\n# Static File\
    \ Handling\n\nYou have written a little bit of Node code to serve static files\
    \ in your application, but it turns out that doing so is largely unnecessary.\
    \ Express (through connect) provides a static middleware-component that can do\
    \ all this work for you!\n\nTo use it, you just pass the name of the base folder\
    \ whose contents you want to serve statically to the middleware creation function,\
    \ as:\n\n```\napp.use(express.static('/secure/static_site_files'));\n```\n\nYou\
    \ put this before the URL routes, and when a request comes in, this static layer\
    \ takes the URL, appends it to its base folder name, and looks for that file exists.\
    \ For example, if you request /content/style.css, this middleware checks whether\
    \ /secure/static_files/content/style.css exists and is readable. If it is, the\
    \ middleware serves that file and stops calling further layers. If not, it calls\
    \ the next function.\n\nIf you want to serve static content from multiple locations,\
    \ add multiple components:\n\n```\napp.use(express.static('/secure/core_static_content'));\n\
    app.use(express.static('/secure/templates_and_html'));\n```"
