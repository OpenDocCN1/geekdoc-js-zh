    # Searching for MongoDB Generated IDs


    I previously mentioned that if you do not provide an _id field in documents you
    insert, MongoDB provides one for you. These autogenerated _id fields are of type
    ObjectID and are represented as 24-character hexadecimal strings.


    The problem is if you use these fields, you cannot search for them simply by specifying
    the string value of the ID. You need to wrap them back in an ObjectID class constructor,
    as follows:


    ```

    var ObjectID = require(''mongodb'').ObjectID;

    var idString = ''50da98dd138bc5c9000012'';

    collection.find({id: new ObjectID(idString)}, callback);

    ```


    If you try to execute the following, you don''t get any matches:


    ```

    collection.find({id: idString }, callback);

    ```


    You won''t encounter this problem in the apps you''re developing in this book
    because you are going to always generate your own _id fields.


    # Refining Your Finds


    To implement paging and sorting on your pages, you need to be manipulate or otherwise
    modify the results of the find operations. The mongodb module lets you do this
    by chaining additional function calls with these effects to the find operation,
    before you call one of the functions to generate a cursor.


    The methods you''ll use the most are skip, limit, and sort. The first indicates
    how many documents in the result set should be ignored before start returning
    any, the second'
