  md: '# Scripts and Parameters


    To be able to do interesting things with your scripts, you need to pass them parameters.
    In this case you need to worry about two problems: how to pass these parameters
    to your scripts and how to access them within the script.


    If you run your Node scripts by calling the interpreter all the time (works on
    all platforms), you need to do nothing extra—the arguments are passed directly
    to the executing script:


    ```

    node script_name [args]*

    ```


    # Passing Parameters on UNIX/Mac


    On UNIX-like operating systems where you use the #! syntax to launch your scripts,
    these parameters are passed directly to your scripts when you run them. So, even
    here, you don''t have to do anything else.


    # Passing Parameters on Windows


    On Windows, you mostly run your Node scripts via batch files with the .bat extension.
    You can pass parameters to these batch files, and they, in turn, pass them on
    to your Node.js scripts using the macro *. So, the batch file would look as follows:


    ```

    #echo off

    node %d0%-%p0%params *

    ```


    # Accessing Parameters in Node


    All parameters passed to your scripts are appended to the argv array on the process
    global object. The first two items in this array are always the node interpreter
    running and the script being run. So, any additional arguments passed to the script
    start at the third element, index 2. Now run the following:


    ```

    #usr/local/bin/node

    console.log(process.argv);

    ```


    You should see the output roughly as follows:


    +   Kidori_01_running marcw ./params.js 1 2 3 4 5

    - ''/usr/local/bin/node''

    - ''/Users/marcw/src/misc/LearningNode/Chapter11/01_running/params.js'',

    - ''1'',

    - ''2'',

    - ''3'',

    - ''4'',

    - ''5 ]'''
  merge: -1
