  md: "The first line of this code is something you haven't seen just yet: The require\
    \ function is a way to include additional functionality in Node.js programs. Node\
    \ comes with a pretty impressive set of modules, each of which you can include\
    \ separately as you need functionality. You will work with further modules frequently\
    \ from now; you learn about consuming them and writing your own in Chapter 5,\
    \ \"Modules\".\n\nIf you run this program as is, it throws an error and terminates.\
    \ How come? Because the fs.open function runs asynchronously; it returns immediately,\
    \ before the file has been opened, and you have the handle value returned to you.\
    \ The file variable is not set until the file has been opened and the handle to\
    \ it has been received in the callback specified as the third parameter to the\
    \ fs.open function. Thus, it is still undefined when you try to call the fs.read\
    \ function with it immediately afterward.\n\nFixing this program is easy:\n\n\
    ```\nvar fs = require('fs');\n\ns.open(\n  'info.txt', 'r',\n  function (err,\
    \ handle) { // we'll see more about the err param in a bit\n    var buf = new\
    \ Buffer(100000);\n    fs.read(\n      handle, buf, 0, 100000, null,\n      function\
    \ (err, length) {\n        console.log(buf.toString('utf8'), 0, length));\n  \
    \      fs.close(handle, function () { /* don't care * });\n      }\n    );\n \
    \ }\n);\n```\n\nThe key way to think of how these asynchronous functions work\
    \ is something along the following lines:\n\n+   * Check and validate parameters.\n\
    * Tell the Node.js core to queue the call to the appropriate function for you\
    \ (in the preceding example, the operating system or the read function), and to\
    \ notify (call) the provided callback function when there is a result.\n* Return\
    \ to the caller.\n\nYou might be asking: If the open function returns right away,\
    \ why doesn't the Node process exit immediately after that function returned?\
    \ The answer is that Node operates with an event queue; if there are pending events\
    \ for which you are awaiting a response, it does not exit until your code has\
    \ finished executing and there are no events left on that queue. If you are waiting\
    \ for a response (either to the open or the read function calls), it waits. See\
    \ Figure 3.2 for an idea of how this scenario looks conceptually."
