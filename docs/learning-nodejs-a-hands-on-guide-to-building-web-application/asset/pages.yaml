  md: '# Introduction


    Welcome to Learning Node.js. Node.js is an exciting new platform for writing network
    and web applications that has created a lot of buzz over the past couple of years
    and rapidly gathered a sizeable pool in the developer community. In this book,
    I teach you more about it, why it is special, and get you up and writing Node.js
    programs in short order. You''ll soon find that people are rather flexible with
    the name of Node.js and will refer to it frequently as just Node or even "node."
    I certainly do a lot of that in this book as well.


    # Why Node.js?


    Node.js has arisen for a couple of primary reasons, which I explain next.


    # The Web


    In the past, writing web applications was a pretty standard process. You have
    one or more servers on your machine that listens on a port (for example, 80 for
    HTTP), and when a request is received, it forks a new process or a thread to begin
    processing and responding to the query. This work frequently involves communicating
    with external services, such as a database, memory cache, external computing server,
    or even just the file system. When all this work is finally finished, the thread
    or process is returned to the pool of "available" servers, and more requests can
    be handled.


    It is a reasonably linear process, easy to understand, and straightforward to
    code. There are, however, a couple of disadvantages that continue to plague the
    model:


    +   1. Each of these threads or processes carries some overhead with it. On some
    machines, PHP + Apache can take up as much as 10–15MB per process. In environments
    where a large server runs constantly and forks threads to process the requests,
    each of these carries some overhead to create a new stack and execution environment,
    and you frequently run into the limits of the server''s available memory.


    +   2. In most common usage scenarios where a web server communicates with a database,
    caching server, external server, or file system, it spends most of its time sitting
    around doing nothing and waits for these services to finish and return their responses.
    While it is sitting there doing nothing, this thread is effectively "blocked"
    from anything else. The resources it consumes and the process or thread in which
    it runs are entirely frozen waiting for those responses to come back.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Only after the external component has finally sent back its response that will
    process or thread be free to finish processing, send a response to the client,
    and then reset to prepare for another incoming request.


    So, although it''s pretty easy to understand and work with, you do have a model
    that can be quite inefficient if your scripts spend most of their time waiting
    for database servers to finish running a query—an extremely common scenario for
    a lot of modern web applications.


    Many solutions to this problem have been developed and are in common use. You
    can buy bigger and more powerful servers with more memory. You can replace more
    powerful and feature-rich HTTP servers as Apache with smaller, lightweight ones
    as httpd or nginx. You can build stripped-down or reduced versions of your favorite
    programming language as PHP or Python. (Indeed, Facebook has taken this one step
    further and built a system that converts PHP to native C++ code for maximal speed
    and optimal size.) Or you can throw more servers at the problem to increase the
    number of simultaneous connections you can accommodate.


    # New Technologies


    Although the web developers of the world have continued their eternal struggle
    against server resources and the limits on the number of requests they can process,
    a few interesting things have happened in the meantime.


    JavaScript, that old (meaning 1995 or so) language that came to be well known
    (and frequently revised) for writing client-side scripts in the web browser, has
    been growing in popularity again. Modern versions of web browsers are cleaning
    up their implementations and adding in new features to make it more powerful and
    less quirky. With the advent of client libraries for these browsers, such as jQuery,
    script.aculo.us, or Prototype, programming in JavaScript has become fun and productive.
    Unwieldy APIs have been cleaned up, and for, dynamic effects have been added.


    At the same time, a new generation of browser competition has erupted, with Google''s
    Chrome, Mozilla''s Firefox, Apple''s Safari, and Microsoft''s Internet Explorer
    all vying for the crown of browser king. As part of this, all these companies
    are investing heavily in the JavaScript portion of these systems as web applications
    continue to grow ever-more dynamic and script-based. In particular, Google Chrome''s
    V8 JavaScript runtime is particularly fast and also open-sourced for use by anybody.


    With all these things in place, the opportunity arose for somebody to come along
    with a new approach to network (web) application development. Thus, the birth
    of Node.js.


    # What Exactly Node.js?


    In 2009, a fellow named Ryan Dahl was working for a company called Joyent, a cloud
    and virtualization services company in California. He was looking to develop push
    capabilities'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# What Exactly Node.js?


    web applications, similar to how Gmail does, and found most of what he looked
    at not quite appropriate. He eventually settled on JavaScript because it lacked
    a robust input/output (I/O) model (meaning he could write his own new one) and
    found the fast and fully programmable V8 runtime readily available.


    Inspired by similar projects in the Ruby and Python communities, he eventually
    took the Chrome V8 runtime and an event-processing library called libuv, and came
    up with the first versions of a new system called Node.js. The primary methodology
    or innovation in Node.js is that it is built entirely around an event-driven nonblocking
    model of programming. In short, you never (well, rarely) write code blocks.


    If your application—in order to process a request and generate a response—needs
    to run a database query, it runs the request and tells Node.js what to do when
    the response returns. In the meantime, Node.js is free to start processing other
    requests or, indeed, any other task it might need, such as cleaning up data or
    running analyses.


    Through this simple change in the way the application handles requests and work,
    you are able to trivially web servers that can handle hundreds, if not thousands,
    of requests simultaneously on machines without much processing or memory resources.
    Node runs in a single process, and your code executes largely in a single thread,
    so the resource requirements are much lower than for many other platforms.


    This speed and capacity come with a few caveats, and you need to be fully aware
    of them so you can start working with Node.js with your eyes open.


    First and foremost, the new model is different from what you may have seen before
    and can sometimes be a bit confusing. Until you''ve wrapped your brain fully around
    some of the core concepts, some of the code you see written in Node.js can seem
    a bit strange. Much of this book is devoted to discussing the code patterns that
    many programmers use to manage the challenges of the asynchronous, nonblocking
    way of programming that Node.js uses and how to develop your own.


    Another limitation with this model of programming is that it is really centered
    around applications that are doing lots of different things with lots of different
    processes, servers, or services. Node.js truly shines when you are juggling connections
    to databases, caching servers, file systems, application servers, and more. The
    flip side of this, however, is that it''s not necessarily an optimal environment
    for writing servers that are doing serious, long-running computations. For these,
    Node''s model of a single thread in a single process can create problems if a
    given request is taking ton of time to generate a complicated password digest
    or processing an image. In situations where you''re doing more computationally
    intensive work, you need to be careful how your applications use resources, or
    perhaps even consider farming those tasks out to other platforms and run them
    as a service for your Node.js programs to call.


    Finally, Node.js is a reasonably new platform and under active development. It
    has not yet (as of February 2013) hit version 1.0, and is constantly seeing new
    releases, sometimes at a truly dizzying pace.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Introduction


    To reduce the randomization and troubles caused by these frequent updates, the
    developers have taken to labeling portions of the system with different degrees
    of stability, ranging from unstable to Locked. Changes to Stable or Locked portions
    of the runtime are rare and involve much community discussion to determine whether
    it will generate too much pain. As you work your way through this book, we point
    out where areas are less stable than others and suggest ways you can mitigate
    the dangers of changing APIs.


    The good news is that Node.js already has a large and active user community and
    a bunch of mailing lists, forums, and user groups devoted to promoting the platform
    and providing help where needed. A simple Google search will get you to 99 percent
    of your questions in a matter of seconds, so never be afraid to look!


    # Who Is This Book For?


    I wrote this book under the assumption that you are comfortable programming computers
    and are familiar with the functionality and syntax of at least one programming
    language such as Java, C/C++, PHP or C#. Although you don''t have to be an expert,
    you''ve probably moved beyond "Learn X in Y days" level tasks.


    If you''re me, you have probably written some HTML/CSS/JavaScript and thus have
    "worked" with JavaScript, you might not be intimately familiar with it and just
    have largely templated heavily off code on blog posts or mailing lists. Indeed,
    with its clunky UI and frustrating browser mismatches, you might even frown slightly
    at the mention of JavaScript. Far not—by the end of the first section of this
    book, distasteful memories of the language will be a thing of the past and, I
    hope, you''ll be writing your first Node.js programs with ease and a smile on
    your face!


    I assume that you have a basic understanding of how web applications work: Browsers
    send HTTP requests to a remote server; the server processes requests and sends
    a response with a code indicating success or failure, and potentially some data
    along with that response (such as the HTML for the page to render or perhaps JavaScript
    Object Notation, or JSON, containing data for that request). You''ve probably
    connected to database servers in the past, run queries, and waited for the resulting
    rows, and so on. When I start to describe concepts beyond these in the samples
    and programs, I explain and refresh everybody''s memory on anything new or uncommon.


    # How to Use This Book


    This book is largely tutorial in nature. I try to balance out explanations with
    code to demonstrate it as much as possible and avoid long, tedious explanations
    of everything. For those situations in which I think a better explanation is interesting,
    I might point you to some resources or other documentation to learn more if you
    are so inclined (but it is never a necessity).'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'The book is divided into four major sections:


    **Part 1. Learning to Walk—**You start installing and running Node, take another
    look at the JavaScript language and the extensions used in V8 and Node.js, and
    then you write your first application.


    **Part 2. Learning to Run—**You start developing more powerful and interesting
    application servers in this part of the book, and I start teaching you some of
    the core concepts and practices used in writing Node.js programs.


    **Part 3. Breaking Out the Big Guns—**In this, you look at some of the powerful
    tools and modules available to you for writing your web applications, such as
    help with web servers and communication with database servers.


    **Part 4. Getting the Most Out of Node.js—**Finally, I close out the book by looking
    at a few other advanced topics such as which you can run your applications on
    production servers, how you can test your code, and how you can use Node.js to
    write command-line utilities as well!


    As you work your way through the book, take the time to fire your text editor
    and enter the code, see how it works in your version of Node.js, and otherwise
    start writing and developing your own code as you go along. You develop your own
    little photo-sharing application as you work through this book, which I hope provides
    you with some inspiration or ideas for things you can write.


    # Download the Source Code


    Source code for most of the examples in this book can be found at github.com/marwan/LearningNodeJS.
    You are highly encouraged to download it and play along, but don''t deny yourself
    the opportunity to type in some of the code as well try things out.


    The GitHub code has some functioning samples and has been tested to work on Mac,
    Linux, and Windows with the latest versions of Node.js. If new updates of Node
    require updates to the source code, I put changes and notes there, please be sure
    to pull down every few months.


    If you have any questions or problems with the code in this book, feel free to
    go to github.com/marwan/LearningNodeJS and add an issue; they''ll be monitored
    and answered quickly.'
  merge: -1
