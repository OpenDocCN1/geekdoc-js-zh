  md: '# Understanding the Basic Operations


    a query). The query is not executed and the contents of the cursor are not actually
    generated until you call one of the functions on it: nextObject, each, toArray,
    or streamRecords.


    The first three operate as you expect: nextObject can be called to get one document,
    each calls a function with each resulting document, and toArray fetches all the
    documents and passes them as a callback:


    ```

    var cursor = albums.find();

    ```


    ```

    cursor.nextObject(function(err, first_match) { });

    cursor.each(function(err, document) { });

    cursor.toArray(function(err, all_documents) { });

    ```


    If you call the find method with no arguments, it matches all documents in the
    collection.


    You can use the streamRecords method on the cursor to create a Stream object,
    which you can use as you use other streams:


    ```

    var stream = collection.find().streamRecords();

    stream.on("data", function(document) { }); // why not readable? See text!

    stream.on("end", function() { });

    ```


    This is the preferred way to fetch large numbers of records because it has a lower
    memory footprint than methods such as toArray, which return all the documents
    in a single chunk. At the time of writing this work, the mongodb module had not
    been updated to the "readable" event model that streams in Node.js use now; it
    is entirely possible that this has changed by the time you are using it. So, double-check,
    just to be sure. (The best place would be at the official site for the driver,
    http://mongodb.github.com/node-mongodb-native/.)


    To find specific documents in your collection, you can specify the fields to match
    as the first parameter to the find function:


    ```

    photos.find({albumid: "italy2012"}).toArray(function (err, results));

    ```


    You can use operators in find queries quite similar to those you saw previously
    as $and and $or to give more powerful queries. For example, if you had documents
    for people, you could find all people older than age 20


    ```

    users.find({age: {$gt: 20}}).toArray(callback);

    ```


    You can combine these operators using logical operations such as $and and $or
    to give more powerful queries. For example, to return all users between the ages
    of 20 and 40 (inclusive), you could use


    ```

    users.find({$and: [{age: {$gt: 20}}, {age: {$lte: 40}}]});

    ```


    Some operators are shown in Table 8.3. For a full listing of them, consult the
    MongoDB query documentation.'
