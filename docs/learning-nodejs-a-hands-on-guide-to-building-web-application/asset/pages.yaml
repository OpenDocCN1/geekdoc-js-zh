  md: "# Multiplatform Development 231\n\n```\nexports.config = {\n  db_config: {\n\
    \    host: \"localhost\",\n    user: \"root\",\n    password: \"\",\n    database:\
    \ \"PhotoAlbums\",\n\n    pooled_connections: 125,\n    idle_timeout_millis: 30000\n\
    \  },\n\n  static_content: \"../static/\",\n  build_type: \"debug\" // show extra\
    \ output\n};\n```\n\nWhat you normally do is actually check this file in the version\
    \ control system (such as GitHub) as local.config.js-base and not have a local.config.js\
    \ in the source tree. To run the application, you then copy this base file over\
    \ to local.config.js, update the values as appropriate for your local running\
    \ setup, and then run it that. Any time you want to use these local configuration\
    \ variables, you just add var local = require('local.config.js');\n\nThen, in\
    \ code, you're free to refer to local.config.variable_xyz as you need.\n\n# Handling\
    \ Path Differences\n\nThe other major difference between Windows and UNIX-like\
    \ operating systems is paths. How do you code things such as require when you\
    \ have handlers in subfolders of your current project directory and so on?\nThe\
    \ news is that a vast majority of the time, you'll find that Nodes accept the\
    \ forward slash (/) character. When you require modules from relative paths (such\
    \ as \"../path/to/th\"), it works as you would expect it to. Even for cases where\
    \ you're using the fs module APIs, most of them are also able to handle the differences\
    \ in path types between the platforms.\nFor cases that you absolutely need to\
    \ work with the different path styles, you can use the path.sep property in Node.js,\
    \ and some clever use of array joining and splitting, for example:\n\n```\nvar\
    \ path = require('path');\nvar comps = ['..', 'static', 'photos' ];\nconsole.log(comps.join(path.sep));\n\
    ```"
