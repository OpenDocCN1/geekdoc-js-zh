    \ to rename an album. In the process, you get a good understanding of the basics\
    \ of running a JSON server, as well as how it interacts with a lot of the basic\
    \ parts of HTTP such as GET and POST parameters, headers, requests, and responses.\
    \ This first generation of the photo album application uses APIs to do all its\
    \ work; it's a great way to learn about them and lets you focus on the new concepts\
    \ you want to learn.\n\n# Your First JSON Server\n\nAt the end of Chapter 1, \"\
