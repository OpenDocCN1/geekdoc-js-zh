  md: "# Being Polite—Learning to Give Up Control 59\n\n```\n}\n} callback(null, results);\
    \ // no error, pass in results\n}\n```\n\nArrays of a few thousand elements, this\
    \ function starts to consume significant amounts of time to do its work, on the\
    \ order of the second or more. In a single-threaded model, where Node.js can only\
    \ do one at a time, this amount of time can be a problem. Similar functions that\
    \ compute hashes, digests, or otherwise perform expensive operations are going\
    \ to cause your applications to temporarily \"freeze\" while they do their work.\
    \ What can you do?\n\nIn the Introduction to this book, I mentioned that there\
    \ are certain things for Node.js is not particularly well suited, and one of them\
    \ is definitely acting as a compute server. Node is far better suited to use more\
    \ common network application tasks, as those with heavy amounts of I/O and requests\
    \ to other services. If you want to write a server that does a lot of expensive\
    \ computations and calculations, you might want to consider moving these operations\
    \ to other services that your Node applications can call remotely.\n\nI am not\
    \ saying, that you should completely shy away from computationally intensive tasks.\
    \ If you're doing some of the time, you can still include them in Node.js and\
    \ take advantage of a method on the process global object called nextTick. This\
    \ method basically says, \"Give up control of execution, and then you have a free\
    \ moment, call the provided function.\" It tends to be significantly faster than\
    \ using the setTimeout function.\n\nListing 3.2 contains an updated version of\
    \ the compute_intersection function that yields every in a while to let Node process\
    \ other tasks.\n\n# Listing 3.2 Using process#nextTick to Be Polite\n\n```\nfunction\
    \ compute_intersection(arr1, arr2, callback) {\n  // let us break up the bigger\
    \ of the two arrays\n  var bigger = arr1.length > arr2.length ? arr1 : arr2;\n\
    \  var smaller = bigger === arr1 ? arr2 : arr1;\n  var biggerlen = bigger.length;\n\
    \  var smlen = smaller.length;\n\n  var sidx = 0; // starting index of any chunk\n\
    \  var size = 10; // chunk size, can adjust!\n  var results = []; // intermediate\
    \ results\n\n  // for each chunk of \"size\" elements in bigger, search through\
    \ smaller\n  function sub_compute_intersection() {\n    for (var i = sidx; i <\
    \ (sidx + size) && i < biggerlen; i++) {\n      for (var j = 0; j < smlen; j++)\
    \ {\n        if (bigger[i] == smaller[j]) {\n          results.push(smaller[j]);\n\
    \        }\n    }\n    break;\n```"
