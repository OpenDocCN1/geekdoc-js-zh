    ```\n\n```\nCREATE DATABASE PhotoAlbums\n  DEFAULT CHARACTER SET utf8\n  DEFAULT\
    \ COLLATE utf8_general_ci;\n```\n\n```\nUSE PhotoAlbums;\n```\n\nYou then have\
    \ to create a schema for your Users table, where you place information for regis-tered\
    \ users of your photo-sharing app. You only need to require an email address,\
    \ display name, and password from the user, and store a couple extra pieces of\
    \ information, including"
