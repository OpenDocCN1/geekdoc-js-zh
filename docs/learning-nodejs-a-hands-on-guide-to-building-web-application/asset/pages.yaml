  md: "To continue listening, you call the prompt again. One of the nice things about\
    \ the readline interface is that if the user presses Ctrl+C, you get the SIGINT\
    \ event called, and you can either shut down down there or do other things to\
    \ reset the state and continue. Here, by closing the readline interface, you cause\
    \ the prompt to stop listening for input and exit:\n\n```\nrl.on('SIGINT', function\
    \ () {\n  rl.close();\n});\n```\n\nNow you're ready to write a little Reverse\
    \ Polish Notation calculator using the readline module. The code for this calculator\
    \ is shown in Listing 11.2.\n\nIf you've never heard of Reverse Polish Notation\
    \ or forgotten how it works, it's basically a postfix mathematical notation format.\
    \ Instead of writing 1 +2, you write 1 2 +. To write 5 * (2 + 3), you write: 5\
    \ 2 3 + *, and so on. The little calculator takes a string at a time, splits it\
