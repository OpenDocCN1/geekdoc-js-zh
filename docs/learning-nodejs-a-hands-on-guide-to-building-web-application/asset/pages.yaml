    # ## Serving Static Content with Streams


    In the asynchronous, nonblocking IO of Node.js, you previously saw that you can
    use `fs.open` and `fs.read` in a loop to read the contents of a file. Node.js
    provides another, far more elegant mechanism for reading (and writing) files called
    `streams`. They act an awful lot like UNIX pipes—even on Windows—and you briefly
    saw them in use in the section "Receiving JSON POST Data" in Chapter 4, "Writing
    Simple Applications," when you needed to load the data into users along with requests.


    In the basic usage, you use the method to add `listeners` to `events`. The provided
    functions are called whenever one of those events is triggered. The `readable`
    event is sent whenever a read stream has read something in you to process. The
    `end` event is sent whenever a stream has nothing more to read, and `error` events
    are sent whenever something has gone wrong.'
