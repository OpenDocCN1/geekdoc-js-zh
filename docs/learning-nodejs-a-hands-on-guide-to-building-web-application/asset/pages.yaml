  md: "# Updating Your Photo Albums App\n\nYou do one trick here in the code to clone\
    \ an object:\n\n```\nvar write = JSON.parse(JSON.stringify(album_data));\n```\n\
    \nIt turns out that quickly serializing and deserializing an object is one of\
    \ the quickest ways to clone it in JavaScript. The reason we clone the object\
    \ in the above previous code is so that we do not modify an object that “isn’t\
    \ ours,” per se. It can be considered rude (or downright buggy) to modify objects\
    \ passed in to our function, so that we have just cloned it before adding the\
    \ _id field. Note that backhelp is simply the backend (in the data/ folder) version\
    \ of the helper functions we've seen before in helpers.js.\n\n# Finding Albums\n\
    \nLoading an album by its name is quite an easy operation:\n\n```\nexports.album_by_name\
    \ = function (name, callback) {\n  db.albums.find({ _id: name }).toArray(function\
    \ (err, results) {\n    if (err) {\n      callback(err);\n      return;\n    }\n\
    \n    if (results.length == 0) {\n      callback(null, null);\n    } else if (results.length\
    \ == 1) {\n      callback(null, results[0]);\n    } else {\n      console.error(\"\
    More than one album named: \" + name);\n      console.error(results);\n      callback(backutils.db_error());\n\
    \    }\n  });\n});\n```\n\nYou spend more time on error handling and validation\
    \ than you do actually finding the album.\n\n# Listing All Albums\n\nSimilarly,\
    \ listing all the albums is quite easy:\n\n```\nexports.all_albums = function\
    \ (sort_field, sort_desc, skip, count, callback) {\n  var sort = {};\n  sort[sort_field]\
    \ = sort_desc ? -1 : 1;\n  db.albums.find(\n    .sort(sort)\n    .limit(count)\n\
    \    .skip(skip)\n    .toArray(callback);\n});\n```"
