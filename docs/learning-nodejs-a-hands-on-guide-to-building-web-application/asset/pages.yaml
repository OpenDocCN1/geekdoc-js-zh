    \ callback(null, results); // no error, send back results\n} else {\n    sidx\
    \ += size;\n    process.nextTick(sub_compute_intersection);\n}\n}\nsub_compute_intersection();\n\
    ```\n\nIn this new version of the function, you basically divide the bigger of\
    \ the input arrays into chunks of 10 (you can choose whatever number you want),\
    \ compute the intersection of that many items, and then call process#nextTick\
    \ to allow other events or requests a chance to do their work. Only when there\
