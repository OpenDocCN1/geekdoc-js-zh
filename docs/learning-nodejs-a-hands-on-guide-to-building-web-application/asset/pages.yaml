    # Strings


    Strings in JavaScript are sequences of Unicode characters (represented internally
    in a 16-bit UCS-2 format) that can represent a vast majority of the characters
    in the world, including those used in most Asian languages. There is no separate
    char or character data type in the language; you just use a string of length to
    represent them. For most of the network applications you''ll be writing with Node.js,
    you will interact with the outside world in UTF-8, and Node will handle all the
    details of conversion for you. Except when you''re manipulating binary data, your
    experience with strings and character sets will largely be worry-free.


    Strings can be wrapped in single or double quotation marks. They are functionally
    equivalent, and you are free to use whatever you want. To include a single quotation
    mark inside a single-quoted string, you can use \'', and similarly for double
    quotation marks inside double-quoted strings, you can use \":


