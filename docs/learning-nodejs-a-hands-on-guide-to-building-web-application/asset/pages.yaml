  md: '# 11

    Command-Line Programming


    After spending so much time in this book discussing Node.js is a powerful asynchronous,
    non-blocking platform for creating applications, I''m now going to show you how
    some-times using regular synchronous, blocking IO is also cool in Node—writing
    command-line programs. It turns out that writing JavaScript code is so much fun
    that people are starting to write a lot of their day-to-day scripts and other
    quick programs in Node as well.


    In this chapter, you look at the basics of running command-line scripts in Node,
    including looking at some of the synchronous file system APIs available to you.
    You then look at how you can interact with the user directly via buffered and
    unbuffered input, and finally look at process creation and execution.


    # Running Command-Line Scripts


    You have quite few options to run Node.js scripts from the command line, for both
    UNIX- and Mac-like operating systems as well as Windows-based ones. You are able
    to make them appear as regular operating system commands and pass command-line
    parameters to them as well.


    # UNIX and Mac


    On UNIX-like operating systems such as Linux or Mac OS X, an overwhelming majority
    of users use the Bourne Shell, sh (or the popular modern variant, bash). Although
    the shell scriptinging language it comes with is quite fully featured and powerful,
    it can sometimes be more fun to write scripts in JavaScript instead.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Chapter 11 Command-Line Programming


    You have two ways to run your Node programs in the shell. The easiest is to just
    run it as you always have—by specifying the node program and the script to run
    (the .js extension is optional, actually):


    ```

    node do_something

    ```


    The second is to make the script an executable file by changing the first line
    as follows:


    ```

    #!/usr/local/bin/node

    ```


    The first two characters are known as a shebang, and tell the operating system
    that what comes directly after it is the path of the program to execute this file
    as a given argument. In the preceding example, the operating system knows to go
    to /usr/local/bin, look for the executable node, run it, and pass in the file
    as an argument to Node. The Node interpreter is smart enough to ignore this first
    line starting with #1 it realizes that these are for operating system use.


    So, you can write the following hello world executable in Node:


    ```

    #!/usr/local/bin/node

    console.log("Hello World!");

    ```


    To run the program as an executable, you also need to mark it as an executable
    file by using the chmod command:


    ```

    chmod 755 hello_world

    ```


    Now you can directly execute the script by typing


    ```

    $ ./hello_world

    Hello World!

    $

    ```


    There is one small problem with this approach: What happens when you take your
    script to other machines and node is not in /usr/local/bin, but instead in /usr/bin?
    The common solution is to change the shebang line as follows:


    ```

    #!/usr/bin/env node

    ```


    The env command looks through your PATH environment variable to find the first
    instance of the node program and runs it. Since all Unix/Mac machines have env
    in /usr/, so as long as node is in the PATH somewhere, this is more portable.


    If you poke around in your various operating system executable directories or
    other places where you have installed software, you see that a lot of programs
    use on a regular basis are, in fact, scripts of some sort.


    One small bonus: The Node interpreter is smart enough, even on Windows, to ignore
    the #1 syntax, so you can still write scripts that can be run as executables on
    both platforms!'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# Running Command-Line Scripts


    Microsoft Windows has never really had a fantastic scripting environment available
    to it. Windows Vista and 7 introduced the PowerShell, which is a nice improvement
    on previous ones, but it still never feels as powerful and easy to use as the
    shells available on UNIX platforms. The good news is however, that this doesn''t
    hurt you much because your primary goal is just to get your scripts launched and
    executing, and the features available in all modern (and semifinal) versions of
    Windows are more than enough.


    You can run your scripts with batch files (carrying the extension .bat). If you
    have the hello_world.js you saw in the previous section, you could create hello_world.bat,
    as follows:


    ```

    @echo off

    node hello_world

    ```


    By default, Windows echoes every command it sees in a batch file. The @echo off
    tells it to stop that. Now, to run the program, you could type


    ```

    C:\Users\Mark\LearningNode\Chapter11\ hello_world

    Hello World!

    C:\Users\Mark\LearningNode\Chapter11\>

    ```


    But there is a bug in this program! What hello_world.bat and hello_world.js are
    in the same folder, but you are executing the batch file from somewhere else,
    as shown here:


    ```

    C:\Users\Mark\LearningNode\Chapter11> cd \

    C:\> \Users\Mark\LearningNode\Chapter11\hello_world

    module.js:340

    ```


    Error: Cannot find module ''C:hello_world''


    ```

    at Function.Module.resolveFilename (module.js:338:15)

    at Function.Module._load (module.js:280:25)

    at Module.runMain (module.js:492:10)

    at process.start.nextTick.process._callback (node.js:244:9)

    ```


    Because you don''t specify the full path to hello_world.js, Node doesn''t know
    where to look for it gets lost. You fix that by changing the hello_world.bat script
    to be as follows:


    ```

    @echo off

    node %d0%-%p0\hello_world

    ```


    Here, you may use of two little batch file macros, %pxx and %~xx, to give you
    the drive and path, respectively, of the nth argument (here, the 0th, or the name
    of the script running). You can run hello_world from wherever you are on your
    computer and it''ll work properly:


    ```

    Z:\> C:\Users\Mark\LearningNode\Chapter11\hello_world

    Hello World!

    ```'
  merge: -1
