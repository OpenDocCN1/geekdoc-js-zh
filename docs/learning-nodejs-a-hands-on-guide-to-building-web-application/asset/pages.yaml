  md: "# Authenticating the API\n\nFortunately, you don't have to compute these headers\
    \ yourself, because programs such as curl do the job for you. To pass HTTP Basic\
    \ Authentication information with a curl request, you can just add the following\
    \ to your request:\n\n```\ncurl -u username:password ...\n```\n\nSo, you can secure\
    \ those APIs that can make changes to your system: the two APIs for creating albums\
    \ and adding photos to albums. To do so, write a new piece of middleware called\
    \ requireAPILogin:\n\n```\napp.put('/v1/albums.json', requireAPILogin, album_hdlr.create_album);\n\
    app.put('/v1/albums/album_name/photos.json',\nrequireAPILogin, album_hdlr.add_photo_to_album);\n\
    ```\n\nThe requireAPILogin function is as follows:\n\n```\nfunction requireAPILogin(req,\
    \ res, next) {\n  if (req.session && req.session.logged_in) { // 1.\n    next();\n\
    \    return;\n  }\n  var rhs = req.headers.authorization; // 2.\n  if (rhs &&\
    \ rhs.search('Basic ') == [0], ' 0) {\n    var creds = new Buffer(rhs.split('\
    \ ')[1], 'base64').toString(); // 3.\n    var parts = creds.split(':'); // 4.\n\
    \    user_hdlr.authenticate_API(\n      parts[0],\n      parts[1],\n      function\
    \ (err, resp) {\n        if (err && resp) {\n          next();\n        } else\n\
    \          need_auth(req, res);\n      }\n    );\n  } else\n    need_auth(req,\
    \ res);\n  }\n}\n```\n\nThe code works as follows:\n\n+   To maintain compatibility\
    \ with the web application, you check to see whether the user has already logged\
