  md: '# 5


    # Modules


    In the Node.js servers and scripts you have written thus far, you have already
    consumed external functionality in the form of modules. In this chapter, I explain
    how all this works and how to write your own. In addition to all the already-powerful
    and functional modules that Node provides for you, there is a huge community further
    developing modules that you can take advantage of in your programs, and indeed
    you can write your own to give something back!


    One of the cool things about Node is that you don''t really distinguish between
    modules that you have produced and modules that you consume from external repositories,
    such as those you see later in this chapter via npm, the Node Package Manager.
    When you write separate classes and groups of functions in Node, you put them
    in basically the same format—perhaps with a bit less dressing and documentation—as
    modules you download from the Internet and use. In fact, it takes only an extra
    bit of JSON and a line or two of code to prepare your code for consumption by
    others!


    Node ships with a large number of built-in modules, all of which are packaged
    in the node executable on your system. You can view their source if you download
    the Node source code from the nodejs.org website. They all live in the lib/ subdirectory.


    # Writing Simple Modules


    At a high level, modules are a way to group common functionality in Node.js. If
    you have a library of functions or classes for working with a particular database
    server, for example, it would make a lot of sense to put that code into a module
    and package it for consumption.


    Every file in Node.js is a module, although modules do not necessarily have to
    be this simple. You can package complex modules with many files, unit tests, documentation,
    and other support files into folders and consume them in the same way you would
    a module with only a single JavaScript file (see “Writing Modules” later in this
    chapter).'
