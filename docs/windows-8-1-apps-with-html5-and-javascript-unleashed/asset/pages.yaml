    # Using the ViewBox Control


    As an alternative to defining a viewport, you can use the ViewBox control. The
    ViewBox control enables you to resize content to fit available screen real estate
    while retaining the correct aspect ratio.


    Imagine, for example, that you happen to have a picture of a Tesla and the picture
    measures 800px by 484px. You want the picture to fill the entire available space
    but not get distorted.'
