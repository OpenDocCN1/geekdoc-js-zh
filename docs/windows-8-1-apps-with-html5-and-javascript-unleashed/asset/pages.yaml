  md: "You can customize the appearance of form fields in different states of validity\
    \ by using the following Cascading Style Sheet pseudo classes:\n\n+   - :valid—Applies\
    \ when an input element is valid\n\n+   - :invalid—Applies when an input element\
    \ is invalid\n\n+   - :required—Applies when an input element is required (has\
    \ the required attribute)\n\n+   - :optional—Applies when an input element is\
    \ not required (does not have the required attribute)\n\nImagine that you have\
    \ created the following user registration form:\n\n```\n<form>\n  <div>\n    <label>\n\
    \      First Name:\n      <input id=\"firstName\" required />\n    </label>\n\
    \  </div>\n  <div>\n    <label>\n      Last Name:\n      <input id=\"lastName\"\
    \ required />\n    </label>\n  </div>\n  <div>\n    <label>\n      Company:\n\
    \      <input id=\"company\" />\n    </label>\n  </div>\n  <div>\n    <input type=\"\
    submit\" />\n  </div>\n</form>\n```\n\nThe form contains required fields for the\
    \ user first and last names. It also contains an optional field for the user company.\n\
    \nYou can use the following style rules to control how the input elements are\
    \ styled:\n\n```\n:valid {\n  background-color: green;\n}\n\n:invalid {\n```"
  merge: -1
  pgno: 168
- img_proc: true
  md: "```\nbackground-color: yellow;\n}\n\n:optional {\n  border: 4px solid green;\n\
    }\n\n:required {\n  border: 4px solid red;\n}\n```\n\nThese rules cause valid\
    \ fields to appear with a green background color and invalid fields to appear\
    \ with a yellow background color. Optional fields appear with a green border and\
    \ required fields appear with a red border.\n\n# # Resetting a Form\n\nAfter you\
    \ successfully submit a form, it is a good idea to reset it so you can use the\
    \ form again. For example, your app might include a form for adding new movies.\
    \ Each time you add a new movie, you want the form to reset to its default state.\n\
