- img_proc: true
  md: "# Creating IndexedDB Data Source\n\n```\nvar store=newDB.createObjectStore(\"\
    tasks\", { keyPath: \"id\", autoIncrement: true });\nstore.createIndex(\"dateCreatedIndex\"\
    , \"dateCreated\");\n```\n\nWhen you create an index, you can retrieve objects\
    \ from an object store by using the index with a key range. A key range represents\
    \ the criteria that an index uses to match objects in a store.\n\nWhen creating\
    \ a key range, you can specify the following properties:\n\n+   - only—Enables\
    \ you to retrieve only the objects that match the supplied value\n\n+   - lowerBound—Enables\
    \ you to retrieve all objects that have a value greater than the supplied value\n\
    \n+   - upperBound—Enables you to retrieve all objects that have a value less\
    \ than the supplied value\n\n+   - bound—Enables you to retrieve all objects that\
    \ have a value greater or less than the supplied values\n\nFor example, here is\
    \ how you would retrieve all of the tasks from the tasks object store that were\
    \ created before 1999:\n\n```\nvar items = [];\nvar transaction = db.transaction(\"\
    tasks\");\nvar store = transaction.objectStore(\"tasks\");\nvar index = store.index(\"\
    dateCreatedIndex\");\nvar keyRange = IDBKeyRange.upperBound(new Date(\"1/1/1999\"\
    ));\nvar req = index.openCursor(keyRange);\nreq.onsuccess = function (evt) {\n\
    \  var cursor = evt.target.result;\n  if (cursor) {\n    items.push(cursor.value);\n\
    \    cursor.continue();\n  } else {\n    // All done!\n  }\n}\n```\n\nYou can\
    \ also use an index when getting a count of objects that match a particular key\
    \ range. For example, the following code gets a count of the number of tasks that\
    \ were created before 1999:\n\n```\nvar transaction = db.transaction(\"tasks\"\
    );\nvar store = transaction.objectStore(\"tasks\");\nvar index = store.index(\"\
    dateCreatedIndex\");\n```\n\n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_300_0.png)"
