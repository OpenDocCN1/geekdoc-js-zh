  md: "# Asynchronous Programming with Promises\n\n# Using then() Versus done()\n\n\
    In the previous section, we used the Promise object done() method to set up our\
    \ complete, error, and promise callbacks. The Promise object exposes another method\
    \ that is closely related to done(): the then() method.\n\nThe then() method—just\
    \ like the done() method—enables you to set up a complete, error, and promise\
    \ callback. Why does the then() method exist? Are there two important differences\
    \ between then() and done().\n\nThe then() method, unlike the done() method, supports\
    \ chaining. If you need to chain multiple promises then you are forced to use\
    \ the then() method. For example, the code in Listing 2.8 illustrates how you\
