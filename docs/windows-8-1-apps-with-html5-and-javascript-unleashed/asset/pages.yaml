  md: "# CHAPTER 9 Creating Data Sources\n\n> NOTE\n\nYou can find the entire source\
    \ code for the custom data source discussed in this section in myData\\myDataSource.js\
    \ file.\n\n# Creating the Data Source Class\n\nThe easiest way to create a custom\
    \ data source is to derive a new class from the base VirtualizedDataSource class.\
    \ For example, you can use the following code to create a new data source named\
    \ MyDataSource:\n\n```\nvar MyDataSource = WinJS.Class.derive(\n  WinJS.UI.VirtualizedDataSource,\n\
    \  Constructor {\n    function () {\n      this._adapter = new MyDataAdapterConstructor();\n\
    \      this._baseDataSourceConstructor(this._adapter);\n    }\n  });\n```\n\n\
    In the preceding code, two arguments are passed to the WinJS.Class.derive() method\
    \ to create the new MyDataSource class: a base class (WinJS.UI.VirtualizedDataSource)\
    \ and a constructor for the new class.\n\nIn the constructor for your derived\
    \ VirtualizedDataSource class, you call the _baseDataSourceConstructor() method\
    \ with a data adapter. The bulk of the work goes into building a custom data source\
    \ goes into creating this data adapter class.\n\n# Creating a Data Adapter\n\n\
    You create a data adapter by implementing the IListDataAdapter interface. This\
    \ interface has the following methods:\n\n+   * change()\n* getCount()\n* insertAtEnd()\n\
    * insertAtStart()\n* insertBefore()\n* itemsFromDescription()\n* itemsFromEnd()\n\
    * itemsFieldIndex()\n* itemsFromKey()"
  merge: -1
  pgno: 279
- img_proc: true
  md: "# Creating Custom Data Sources\n\n+   - itemsFromStart()\n- itemSignature()\n\
    - moveAfter()\n- moveBefore()\n- moveToEnd()\n- moveToToStart()\n- remove()\n\
    - setNotificationHandler()\n\nThe interface also includes the following property:\n\
    \n+   - compareByIdentity\n\nFortunately, you don't need to actually implement\
    \ all of these methods and properties.\nYou can implement only the methods that\
    \ you actually need.\n\nFor example, if you want to create a simple, read-only\
    \ data source then you only need to implement `getCount()` and `itemsFromIndex()`\
    \ methods. If you want to create a more complicated, read-write data source then\
    \ you need to also implement the `change()`, `insertAtEnd()`, and `remove()` methods.\n\
    \nIn the following sections, we describe how you can implement several of these\
    \ methods such as the `getCount()` and `itemsFromIndex()` methods.\n\n# Implementing\
    \ the getCount() Method\n\nThe `getCount()` method should return the total number\
    \ of records represented by the data source. For example, if you are storing items\
    \ in a JavaScript array, then the `getCount()` method should return the length\
    \ of the array:\n\n```\ngetCount: function () {\n  return WinJS.Promise.wrap(this._arrayData.length);\n\
    }\n```\n\nThe `getCount()` method must return a promise. Therefore, you either\
    \ need to wrap the return value in a promise using `WinJS.Promise.wrap()` or you\
    \ need to create a new promise object.\n\n# Implementing the itemsFromIndex()\
    \ Method\n\nThe `itemsFromIndex()` method returns a set of items from the data\
    \ source. Three arguments are passed to this method:\n\n+   - requestIndex—The\
    \ index of the first item to retrieve from the data source"
  merge: -1
  pgno: 280
- img_proc: true
  md: "# CHAPTER 9 Creating Data Sources\n\n+   - countBefore—The number of items\
    \ before the requested index to retrieve from the data source\n- countAfter—The\
    \ number of items after the requested index to retrieve from the data source\n\
    \nThe countBefore and countAfter parameters are intended to be interpreted as\
    \ hints. You can return more than the countBefore or countAfter number of items\
    \ if you wish.\n\nHere's a simple implementation of the itemsFromIndex() method.\
    \ This method returns a portion of JavaScript array.\n\n```\nitemsFromIndex: function\
    \ (requestIndex, countBefore, countAfter) {\n  var startIndex = Math.max(0, requestIndex\
    \ - countBefore);\n  var subItems = this.arrayData.slice(startIndex);\n  return\
    \ WinJS.wrap({\n    items: subItems,\n    offset: requestIndex - startIndex,\n\
    \    totalCount: this.arrayData.length\n  });\n}\n```\n\nThe itemsFromIndex()\
    \ method should return an object that implements the IFetchResult interface. In\
    \ the preceding code, three properties of the IFetchResult interface are returned:\
    \ items, offset, and totalCount.\n\nThe items represents the array of items returned\
    \ by the itemsFromIndex() method. Each item in the items array must implement\
    \ the ILiListItem interface. At the very minimum, each item must have a key and\
    \ a data property.\n\nThe offset represents the position of the item which corresponds\
    \ to the requestIndex in the items array. If you return items before the requested\
    \ index then the offset will be greater than 0.\n\nFinally, the totalCount property\
    \ returns the total number of items represented by the data source and not just\
    \ the number of items returned.\n\nEach item in the items array returned by itemsFromIndex\
    \ must implement the ILiListItem interface. Here's a sample of the data returned\
    \ from the itemsFromIndex() method:\n\n```\nitems: [\n  {key:\"1\", data:\"wake\
    \ up\"},\n  {key:\"3\", data:\"get out of bed\"},\n  {key:\"4\", data:\"drag the\
    \ comb across my head\"}\n]\noffset: 0,\ntotalCount: 3\n```"
  merge: -1
  pgno: 281
- img_proc: true
  md: "# Creating Custom Data Sources\n\nNOTE\nIn addition to the itemsFromIndex()\
    \ method, you can also implement the\nitemsFromDescription(), itemsFromEnd(),\
    \ itemsFromKey(), or itemsFromStart\nmethods. Implementing these additional methods\
    \ for fetching data is optional.\n\n# Implementing the insertAtEnd() Method\n\n\
    If you want to start creating new items then you should implement the insertAtEnd()\
    \ method. Two arguments are passed to this method, the key of the new item and\
    \ the actual new item.\n\nHere is a sample which illustrates how you can use the\
    \ insertAtEnd() method to add a new item to a JavaScript array.\n\n```\ninsertAtEnd:\
    \ function (unused, data) {\n  var newItem = {\n    key: (++this._maxKey).toString(),\n\
    \    data: data\n  };\n  this._arrayData.push(newItem);\n  return WinJS.Promise.wrap(newItem);\n\
    }\n```\n\nTypically, you don't provide a key and let the data source generate\
    \ the key for you. Therefore, typically, you ignore the key argument passed to\
    \ the insertAtEnd() method and you generate the key yourself. In the preceding\
    \ code, the key is generated by adding one to the previously generated key and\
    \ converting the result into a string.\n\nWARNING\nData source keys must be strings.\n\
    \nNotice that the insertAtEnd() method returns the new item including its key.\
    \ The object that is returned conforms to the IItem interface wrapped in a promise.\n\
    \n# Implementing the remove() Method\n\nIf you need to delete an item from a data\
    \ source then you need to implement the remove() method. The key of the item being\
    \ removed is passed to the method and the method returns nothing if the item is\
    \ removed.\n\nHere's some sample code that removes an item from an array:\n\n\
    ```\nremove: function (key) {\n  var i = this._getIndexFromKey(key);\n  this._arrayData.splice(i,\
    \ 1);\n  return WinJS.Promise.wrap(null);\n}\n```"
  merge: -1
  pgno: 282
- img_proc: true
  md: "# CHAPTER 9 Creating Data Sources\n\n```\n},\n_getIdxFromKey:function(key)\
    \ {\n  for (var i = 0; i < this.arrayData.length; i++) {\n    if (this._arrayData[i].key\
    \ == key) {\n      return i;\n    }\n  }\n}\n```\n\n# Implementing the change\
    \ () Method\n\nIf you need to support editing items in a data source then you\
    \ need to implement the change () method. Three arguments are passed to the change\
    \ () method: the key of the item being edited, the new value of the item being\
    \ edited, and the index of the item being edited.\n\nHere's some sample code for\
    \ implementing the change() method:\n\n```\nchange: function (key, data, indexHint)\
    \ {\n  var index = this._getIdxFromKey(key);\n  this._arrayData[index] = data;\n\
    \  var newItem = {\n    key: key,\n    index: index,\n    data: data,\n  };\n\
    \  return new WinJS.Promise.wrap(null);\n}\n```\n\nNotice that the change() method\
    \ returns an empty promise. The method just completes without returning anything\
    \ special.\n\n# Handling Errors\n\nIf there is an error when inserting, removing,\
    \ or changing an item then you can return an EditText object. You can return one\
    \ of the following four values:\n\n+   ▶ WinJS.UI.EditError.canceled—Return this\
    \ error when the edit operation, for ever reason, is canceled.\n\n+   ▶ WinJS.UI.EditError.noResponse—Return\
    \ this error when the edit operation times out.\n\n+   ▶ WinJS.UI.EditError.notPermitted—Return\
    \ this error when writing to a read-only data source.\n\n+   ▶ WinJS.UI.EditError.noLongerMeaningful—Return\
    \ this error when the item has already changed."
