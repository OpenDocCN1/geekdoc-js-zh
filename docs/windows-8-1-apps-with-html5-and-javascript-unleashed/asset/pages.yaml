    \ and create a new filtered WinJS.Binding.List by calling the createFiltered()\
    \ method. This method accepts a filter function that returns either the value\
    \ true or false depending on an item from the original list should be included\
    \ in the new list.\n\nThe code in Listings 8.11 and 8.12 illustrate how you can\
    \ use the createFiltered() method to create a key search form. The page in Listing\
    \ 8.11 contains an input box and a ListView control.\n\n# LISTING 8.11 Filtering\
    \ a List of Products (filtering\\filtering.html)\n\n```\n<div>\n  <input id=\"\
    inputFilter\" />\n</div>\n<div id=\"tmplProduct\">\n  <data-win-control=\"WinJS.Binding.Template\"\
    >\n    <div class=\"productItem\">\n      <h2>data-win-bind=\"innerText:name\"\
    ></h2>\n      <p><span>data-win-bind=\"innerText:price\"></span></p>\n    </div>\n\
    \  </data-win-control>\n</div>\n```\n\nThe JavaScript code in Listing 8.12 includes\
    \ a function named filterProducts(). This function accepts a ListView and a filter\
    \ string and filters the ListView so it only displays products that match the\
    \ filter string.\n\n# LISTING 8.12 Filtering a List of Products (filtering\\filtering.js)\n\
    \n```\n(function () {\n  \"use strict\";\n\n  // Create a List of products\n \
