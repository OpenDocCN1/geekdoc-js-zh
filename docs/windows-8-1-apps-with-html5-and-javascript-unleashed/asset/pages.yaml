  md: '# CHAPTER 14

    Using the Live Connect API


    The Live Connect API enables you to connect to Live Services from your Windows
    Store apps. Live Services provides you with services for authenticating users,
    retrieving information (including a user''s calendars and contacts), and interacting
    with a user''s SkyDrive.


    In the first part of this chapter, I explain the steps required to install and
    set up the Live SDK. For example, you learn how to register your Windows Store
    app at the Live Connect website.


    Next, I discuss how you can take advantage of a feature called zero-click single
    sign-on. This feature enables you to authenticate the users of your Windows Store
    app without requiring the users to enter their usernames and passwords.


    I also explain how you can take advantage of authentication when your Windows
    Store app interacts with Windows Azure Mobile Services. You learn how to restrict
    access to Mobile Services to authenticated users.


    You also learn how you can retrieve user information from Live Services. For example,
    I show you how you can retrieve the current user''s first and last name, birthday,
    and profile picture.


    Finally, I discuss SkyDrive. You learn how you can upload and download files from
    your Windows Store app to the hard drive in the sky which is SkyDrive.


    +   * Installing the Live SDK

    * Authenticating a User

    * Authenticating with Windows Azure Mobile Services

    * Retrieving Basic User information

    * Uploading and Downloading files from SkyDrive'
  merge: -1
