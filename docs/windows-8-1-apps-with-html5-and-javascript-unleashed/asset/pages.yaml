  md: "# Connecting to External Services\n\nThe MyTasks app cannot even get off the\
    \ ground unless it can connect to Live Connect and Windows Azure Mobile Services.\
    \ If the MyTasks app cannot authenticate you with Live Connect and get your tasks\
    \ from Azure Mobile Services then the app has nothing to do. The very first thing\
    \ that the MyTasks app does is to connect to these services.\n\nListing 16.1 contains\
    \ the startup code that is responsible for connecting to Live Connect and Azure.\n\
    \n# LISTING 16.1 MyTasks Startup Code (/js/default.js)\n\n```\n// The startup\
    \ method ensures that you are\n// connected to Live and Azure before\n// doing\
    \ anything else.\nfunction startup() {\n  return new WinJS.Promise(function (complete)\
    \ {\n    function login() {\n      // Login to Live\n      Live.login().done({\n\
    \        // Success\n        // Login to Azure Mobile Services\n        Services.login(Live.getAuthenticationToken()).done({\n\
    \          // Success\n          function () {\n            complete();\n    \
    \      },\n          // Fail\n          function (errorMessage) {\n          \
    \  // If first we don't succeed, try again ad nauseum\n            var message\
    \ = \"Could not connect to Windows Azure. \" +\n              errorMessage;\n\
    \            var md = new Windows.UI.Popups.MessageDialog(message);\n        \
    \    md.commands.append(new Windows.UI.Popups.\n          }\n        });\n   \
    \ }\n    UICommand(\"&Retry\");\nmd.showAsync().done(login);\n},\n// Fail\nfunction\
    \ () {\n  // If first we don't succeed, try again ad nauseum\n  var md = new Windows.UI.Popups.MessageDialog(\"\
    Could not connect\nto the Internet.\");\n  md.commands.append(new Windows.UI.Popups.UICommand(\"\
    &Retry\"));n\n```"
