  md: '# Creating a Page Control


    The alert.js JavaScript file creates the Alert control. The Alert control is created
    by calling the WinJS.Pages.define() method with the path to the alert.html file.


    When you create a Page control, you can create an event handler for the Page control
    ready event. This event is raised after the control has been rendered so you can
    access any elements in the alert.html file. The ready event has an options parameter
    that allows the consuming script to pass options using the data-win-options attributes.


    In the preceding code, the ready handler configures a click handler for the button.
    When you click the button, a Windows.UI.Popups.MessageBox is displayed.


    There is one other section in the alert.js file. The following code exposes the
    Alert control in the global namespace so that the control can be used declaratively
    in other HTML pages:


    ```

    WinJS.Namespace.define("MyControls", {

    Alert: Alert

    });

    ```


    Now that I have created the Alert control, I can use it in a page. The following
    page displays a button with the label Click Here! When you click the button, the
    alert Click the Button! is displayed:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8" />

