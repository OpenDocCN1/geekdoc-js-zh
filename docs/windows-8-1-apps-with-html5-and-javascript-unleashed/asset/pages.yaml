  md: 'To summarize, you need to complete the following steps:


    +   1. Within Visual Studio—from the Project, Store menu—reserve an app name and
    associate the MyTasks project with your app.


    +   2. At the Windows Store Dashboard, click Services and register your app with
    Live Connect. You need to enter a Redirect URL in this step.


    +   3. At the Windows Azure Management Portal, you need to create a new Mobile
    Service.


    +   4. Get your Live Connect client ID and client secret from the Live Connect
    Developers center and associate the client ID and client secret with your Mobile
    Service at the Windows Azure Management Portal. You need to enter your client
    ID and secret under your Mobile Service''s identity.


    +   5. In your Visual Studio project, update the \js\live.js file with the Redirect
    URL you created in step 2.


    +   6. In your Visual Studio project, update the \js\services.js file with your
    Mobile Service application that you can retrieve from the Windows Azure Management
    Portal.


    After you get Live Connect and Windows Azure configured, there is one more step
    that you must complete before the MyTasks app will work. To use the MyTasks app,
    you also need to create the insert.js, update.js, delete.js, and read.js server
    scripts hosted in your Windows Azure Mobile Service. All of these scripts are
    in the \serverScripts folder.


    You can add the server scripts to your Mobile Service in either of two ways. You
    can add these scripts from within the Windows Azure Management Portal (see Figure
    16.2) or you can add these scripts from within the Server Explorer window in Visual
    Studio. For detailed instructions see Chapter 10.


