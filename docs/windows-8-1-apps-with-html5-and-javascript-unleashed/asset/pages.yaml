    # Migrating from Windows 8 to Windows 8.1


    Windows 8.1 is the second release of Windows 8. There are already tens of thousands
    of apps written for Windows 8.


    If you already created a Windows Store app for Windows 8 and you want to migrate
    the app to Windows 8.1 then the process is dead easy. When you open your Windows
    8 app in Visual Studio 2013, Visual Studio recommends retargeting your app to
    Windows 8.1 (see Figure 1.35).'
  merge: -1
