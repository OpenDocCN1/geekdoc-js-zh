- img_proc: true
  md: '# 42 CHAPTER 1 Building Windows Store Apps


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_57_0.png)


    FIGURE 1.35 Retargeting to Windows 8.1


    You can right-click your project in the Solution Explorer window and select the
    menu option Retarget to Windows 8.1 to migrate your app to Windows 8.1.


    Retarget your app updates all of your script references to point to the Windows
    Library for JavaScript 2.0 instead of the Windows Library for JavaScript 1.0.
    If you prefer, you could do this by adding a reference to the Windows Library
    for JavaScript 2.0 to your project and updating the `<script>` tags in all of
    your HTML pages.


    After you retarget your app, you might need to make code changes. For example,
    as mentioned earlier in this chapter, Windows 8.1, unlike Windows 8, no longer
    supports a snapped view. A list of all the deprecated Windows 8 application programming
    interface (APIs) is displayed after you retarget your app.


    > NOTE

    You need Visual Studio 2013 Professional, Premium, or Ultimate to edit an existing
    Windows 8 app. Visual Studio 2013 Express allows you to retarget a Windows 8 app
    to Windows 8.1 before you modify it.


    This might be obvious, but I am going to say it anyway. Apps written for Windows
    8.1 won''t run on Windows 8. The Windows Runtime in Windows 8.1 has changed so
    you won''t see Windows 8.1 apps in the Windows Store on a computer running Windows
    8. You can still use Windows 8 apps, on the other hand, with Windows 8.1—you can
    install both Windows 8 and Windows 8.1 apps from the Windows Store on a computer
    running Windows 8.1.


