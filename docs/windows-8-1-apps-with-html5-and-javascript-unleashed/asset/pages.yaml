    \ was declared with isHeaderStatic to the value false.\n\n# Handling Hub Section\
    \ Navigation\n\nIf you want to do something when someone clicks on the header\
    \ for Section A or Section B then you can handle the Hub control's headerinvoked\
    \ event. For example, you could navigate the user to a new page with more detailed\
    \ content for the section.\n\nI discuss creating multipage pages and navigation\
