    \ is retrieved when the promise returned by the processAll() method is.\n\n# Using\
    \ the Tooltip Control\n\nYou can use the WinJS tooltip control to display a customizable\
    \ tooltip over any HTML element (see Figure 4.4). When you hover over the element,\
    \ the tooltip appears for a number of seconds. When you move your cursor away\
    \ from the element, the tooltip disappears.\n\n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_135_0.png)\n\
    \nFIGURE 4.4 Displaying a tooltip with the Tooltip control (tooltip\\tooltip.html)\n\
    \nYou declare the Tooltip control in a page like this:\n\n```\n<button id=\"btnDelete\"\
