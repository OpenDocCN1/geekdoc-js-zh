  md: 'The JavaScript library in 16.5 has one public method named say() that says
    any text out loud. This method selects a voice and then calls the SpeechSynthesizer
    synthesizeToStreamAsync() method to convert the text to a binary blob. The audio
    blob is assigned to an HTML5 Audio element and played.


    Notice that a particular voice is selected before the audio is played. The Microsoft
    Hazel Desktop is used with the text. This voice has a female English accent.


    The Windows.Media.SpeechSynthesis.SpeechSynthesizer.allVoices method returns a
    list of all of the voices available on the machine. On my machine, I have the
    following voices:


    +   - Microsoft David Desktop—American male voice

    - Microsoft Hazel Desktop—English female voice

    - Microsoft Zira Desktop—American female voice


    If you don''t specify a particular voice by assigning a voice to the voice property
    then the Microsoft David Desktop voice is used by default.


    > NOTE

    The Text-To-Speech API also supports Speech Markup Language (SSML). SSML is a
    markup language that provides you with greater control over how text is spoken.
    For example


    # Summary


    This chapter focused on building a simple productivity app: the MyTasks app. I
    discussed solutions to several of the challenges you face when building a real-world
    Windows Store app.


    First, I explained how you can ensure a connection to external services is available
    when you start a Windows Store app. The MyTasks app depends on communicating with
    Live Connect and Windows Azure. If connections to these services are not available
    then the MyTasks app repeats a Retry dialog in your face.


    Next, I discussed the importance of optimistic inserts, updates, and deletes for
    the perceived performance of your Windows Store app. I recommend that you always
    insert before inserting remotely to provide your users with the best perceived
    performance.


    I also demonstrated how you can gracefully adapt the MyTasks app to different
    screen widths. I showed how you can use CSS Media Queries and JavaScript to change
    the appearance of the app when it is stretched or shrunk.


    Finally, I talked about a new API introduced with Windows 8.1. I demonstrated
    how you can convert text to speech and read tasks out by taking advantage of the
    new Windows 8.1 SpeechSynthesizer class.'
