- img_proc: true
  md: '# CHAPTER 10 Using Windows Azure Mobile Services


    To create the table from within Visual Studio, right-click the Windows Azure Mobile
    Services node within the Server Explorer window and select New Table (see Figure
    10.4). Enter the name Tasks for the new table name.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_313_0.png)


    FIGURE 10.4 Creating a new SQL Azure database table


    Notice that you do not specify the columns for the new table. The columns are
    created dynamically based on the data you insert into the table. This feature
    is called Dynamic Schema. Taking advantage of Dynamic Schema makes it easier to
    develop a new Mobile Service. However, Microsoft recommends that you use Dynamic
    Schema for a production database. You can disable Dynamic Schema by selecting
    your Mobile Service and opening the Visual Studio Properties Window.


    # Installing the Mobile Services for WinJS Library


    Okay, so now we have our Mobile Service and our database table. In order to interact
    with our Mobile Service from our Windows Store app, we need to install the Mobile
    Services for WinJS client library.


    The fastest way to install this library is to take advantage of the NuGet Package
    Manager Console. After opening or starting a new project in Visual Studio, select
    Tools, Library Package Manager, Package Manager Console and enter the following
    command:


    ```

    Install-Package WindowsAzure.MobileServices.WinJS

    ```'
