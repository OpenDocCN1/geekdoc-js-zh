  md: 'After you create a Mobile Service—by using the Windows Azure Management Portal
    or using Visual Studio—you need to retrieve your secret application key. Navigate
    to the Management Portal at http://manage.WindowsAzure.com, navigate to the dashboard
    for your Mobile Service, and click the Manage Keys button located at the bottom
    of the page. Write down your key (see Figure 10.3). You will need this key to
    interact with your Mobile Service.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_312_0.png)


    FIGURE 10.3 Retrieving your Mobile Service application key


    > NOTE

    All of the code discussed in this chapter is in the Chapter10 folder. You need
    to change the API key in the default.js file to run the code.


    > NOTE

    The difference between a master key and an application key is that you use the
    master key when performing operations restricted to “Scripts and Admins”. You
    don’t distribute your master key with your Windows Store app.


    # Creating a Database Table


    In this chapter, I am going to build a Task List app that stores tasks in a database
    table exposed by Windows Azure Mobile Services. Therefore, the next step is to
    create this database table.


    Again, you have a choice. You can either create the database table using the Windows
    Azure Management Portal or you can create the database table directly inside of
    Visual Studio. This is purely a matter of preference.'
