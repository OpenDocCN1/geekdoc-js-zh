- img_proc: true
  md: "When the PointerDown event is raised, the movePlayerTouch() method is called.\
    \ This method takes care of changing the direction in which your character moves:\n\
    \n```\nplayerTouch: function(e) {\n  var playerX = this._player.x * TILE_WIDTH;\n\
    \  var playerY = this._player.y * TILE_HEIGHT;\n  var absX = Math.abs(e.offsetX\
    \ - playerX);\n  var absY = Math.abs(e.offsetY - playerY);\n\n  if (absX > absY)\
    \ {\n    if (e.offsetX > playerX) {\n      this._player.direction = Unleashed.Direction.right;\n\
    \    } else {\n      this._player.direction = Unleashed.Direction.left;\n    }\n\
    \  } else {\n    if (e.offsetY > playerY) {\n      this._player.direction = Unleashed.Direction.down;\n\
    \    } else {\n      this._player.direction = Unleashed.Direction.up;\n    }\n\
    \  }\n}\n```\n\nDepending on where you touch the screen, your character moves\
    \ in different directions. For example, if you touch the screen below your character\
    \ then your character changes direction to move down. If you touch to the right\
    \ of your character then your character moves to the right (see Figure 15.5).\n\
    \n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_440_0.png)\n\nFIGURE 15.5 Touching\
    \ the screen to change direction\n\n# Creating the Update Loop\n\nThe Brain Eater\
    \ game uses two loops during game play. The game executes an update loop to update\
    \ the positions of the player and the zombies. The game also executes a render\
    \ loop to render the game."
  merge: -1
  pgno: 440
- img_proc: true
  md: "# CHAPTER 15 Graphics and Games\n\nThe update loop executes every 250 milliseconds.\
    \ The executeUpdateLoop() method is triggered with the following call to the window.setInterval()\
    \ method when you start a game:\n\n```\nthis.updateLoopId = window.setInterval(this.executeUpdateLoop.bind(this),\n\
    UPDATE_LOOP_RATE);\n```\n\n> NOTE\nThe bind() method called on the executeUpdateLoop()\
    \ method is used to bind the current instance of the Game object to the executeUpdateLoop()\
    \ method when called. In other words, it ensures that this variable will refer\
    \ to the current instance of the Game object within the executeUpdateLoop() method.\n\
    \nThe UPDATE_LOOP_RATE constant has the value 250 milliseconds. If you want the\
    \ zombies to chase you faster then this value (the game definitely gets harder\
    \ the lower that you make):\n\nThe executeUpdate() method looks like this:\n\n\
    ```\nexecuteUpdateLoop: function () {\n  this.updateMonsterPositions();\n  this.updatePlayerPosition();\n\
    }\n```\n\nThis method updates the positions of the zombies and the player. For\
    \ example, the updateMonsterPositions() method moves all of the zombies in the\
    \ direction of the player.\n\nWhile updating the positions of the zombies and\
    \ the player, the update loop also checks for collisions whether there is a collision\
    \ between the player and a zombie or between the player and a food.\n\nFor example,\
    \ the updatePlayerPosition() method calls the following collideWithFood() method\
    \ to detect whether the player has walked into a food pellet:\n\n```\ncollideWithFood:\
    \ function () {\n  for (var i = 0; i < this._food.length; i++) {\n    var food\
    \ = this._food[i];\n    if (this._player.x === food.x && this._player.y === food.y)\
    \ {\n      Unleashed.Sounds.yum.play();\n      this._food.splice(i, 1);\n    }\n\
    \  }\n}\n```\n\n// If no more food then player wins!"
  merge: -1
  pgno: 441
- img_proc: true
  md: "```\nif (this._food.length == 0) {\n  this.win();\n}\n\n```\n\nThe collideWith()\
    \ method loops through the JavaScript _food array and checks whether the x and\
    \ y position of any Yum food pellet corresponds to the x and y position of the\
    \ player. If there is a match then “Yum!” sound is played and the food pellet\
    \ is removed from the food array using _food.splice(). If all of the food is eaten\
    \ the player wins.\n\nThe update loop does not return anything to the scene. The\
    \ update loop is responsible only for the state of the game. Rendering the game\
    \ is the responsibility of the render loop.\n\n# Creating the Render Loop\n\n\
    The render loop is responsible for rendering the game board. Unlike the update\
    \ loop, which is triggered by the window.setInterval() method, the render loop\
    \ is executed by calling the requestAnimationFrame() method.\n\nThe requestAnimationFrame()\
    \ method is defined as part of the W3C Timing Control for Script-Based Animation\
    \ standard. This method was introduced specifically for the purpose of creating\
    \ animations.\n\nWhen you use the requestAnimationFrame() method, you don't specify\
    \ how often the screen should be rendered. Instead, you let the browser determine\
    \ the best frame rate.\n\nThe idea is that the browser can do a better job than\
    \ you in determining the best frame rate. The browser can take into account all\
    \ of the animations being rendered and, therefore, render all of the animations\
    \ more smoothly. If the page is not completely visible the browser can throttle\
    \ the animations and save CPU power.\n\nIn the Brain Eaters game, the render loop\
    \ is started with the following code:\n\n```\nthis.animationLoopId = window.requestAnimationFrame(this.executeRenderLoop.\n\
    bind(this));\n```\n\nThe executeRenderLoop() method is passed to the requestAnimationFrame()\
    \ method. The executeRenderLoop() method looks like this:\n\n```\nexecuteRenderLoop:\
    \ function () {\n  this.render();\n  this._animationLoopId = window.requestAnimationFrame(this.executeRenderLoop.\n\
    bind(this);\n};\n```\n\nThe executeRenderLoop() calls the render method and then\
    \ immediately calls the window.requestAnimationFrame() method again. It is up\
    \ to the window to decide how quickly the executeRenderLoop() method gets again."
  merge: -1
  pgno: 442
- img_proc: true
  md: "> NOTE\nwindow.requestAnimationFrame() method is similar to the window.setTimeout()\
    \ method with the crucial difference that you don't specify a timeout value. The\
    \ window.requestAnimationFrame() method figures out its own timeout value.\n\n\
    The render() method is responsible for drawing the screen and it looks like this:\n\
    \n```\nrender: function () {\n  this.renderBoard();\n  this.renderFood();\n  this.renderMonsters();\n\
    \  this.renderPlayer();\n}\n```\n\nThe render() method draws the game board, the\
    \ food pellets, and the monsters, player.\n\nThe renderBoard() method draws the\
    \ 20 by 15 tile game board by calling the drawImage() method for each tile in\
    \ the game board. Here's what the renderBoard() method looks like:\n\n```\nrenderBoard:\
    \ function () {\n  for (var y = 0; y < VERTICAL_TILES; y++) {\n    for (var x\
