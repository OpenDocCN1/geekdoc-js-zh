  md: 'In general, each method of the web service data source delegates to a remote
    web service action with the same name.


    # Creating the Web Service


    There are several ways that you can create a web service. Even if you restrict
    yourself to Microsoft technologies, you have several options. You can create a
    WCF service, a WCF Data Service, an ASMX Web service, a Windows Azure Mobile Services
    service, or an ASP.NET Web API service.


    > In the next chapter, you learn how to interact with web services created with
    Azure Mobile Services.


    In this chapter, I create a web service by taking advantage of the ASP.NET Web
    API service. You can add a Web API controller to either an ASP.NET Web Forms or
    an ASP.NET MVC project. I create an ASP.NET MVC 4 project. When creating the ASP.NET
    MVC 4 project, I used the Web API project template (see Figure 9.3).


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_293_0.png)


    FIGURE 9.3 Creating an ASP.NET MVC 4 project using the Web API project template


    To take advantage of an ASP.NET Web API service, you need to add the right routes
    to the App_Start\RouteConfig.cs file. These routes map incoming browser requests
    to the correct API controller and action controller.'
