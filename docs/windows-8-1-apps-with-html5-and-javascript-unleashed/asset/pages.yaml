    \  </div>\n  <div data-win-bind=\"style.display:product1.onSale MyBindingConverters-onSaleToDisplay\"\
    >\n    <b>On Sale!</b>\n  </div>\n</div>\n<div>\n  <h1 data-win-bind=\"innerText:product2.name\"\
    ></h1>\n  <div>\n    <span>Price: <span data-win-bind=\"innerText:product2.price\"\
