  md: "# Performing Inserts, Updates, and Deletes\n\nExecuting this command adds a\
    \ new set of Mobile Services scripts to your project's js folder. To use the Mobile\
    \ Services for WinJS client library, you need to add a script reference to the\
    \ MobileServices.min.js file to a page as default.js page file like this:\n\n\
    ```\n<script src=\"js/MobileServices.min.js\"></script>\n```\n\nAfter you add\
    \ this reference, you will have the full power of the Mobile Services client library\
    \ at your disposal.\n\n# Performing Inserts, Updates, and Deletes\n\nIn the previous\
    \ sections, I created a Azure Mobile Service named unleashed, I created a new\
    \ database table named Tasks, and I installed the Mobile Services for WinJS library.\
    \ Now it is time to write some code and actually interact with the Tasks database\
    \ table from a Windows Store app. In this section, I explain how to perform basic\
    \ insert, update, and delete operations against the Tasks database table.\n\n\
    # Connecting to the Remote Database Table\n\nBefore you can perform any operation\
    \ against a remote database table such as inserting or updating data, you must\
    \ first connect to a Mobile Service and get a reference to the remote table.\n\
    \nThere are two main objects included in the Mobile Services library: MobileServiceClient\
    \ object and the MobileServiceTable object. Here's how you use these two objects\
    \ to get a reference to the Tasks table:\n\n```\n// Get Tasks table from Azure\
    \ Mobile Services\nvar mobileServiceClient = new WindowsAzure.MobileServiceClient(\n\
    \  \"https://unleashed.azure-mobile.net/\",\n  \"IwzCcChdiEkqquVBzPrHCNVifFpvgo72\"\
    \n);\n\nvar tasksTable = mobileServiceClient.getTable('Tasks');\n```\n\nThe constructor\
    \ for the MobileServiceClient object accepts two parameters. You need to pass\
    \ the URL and application key for the Mobile Service. After you create a MobileServiceClient,\
    \ you use its getTable() method to retrieve a MobileTable object that represents\
    \ an Azure database table.\n\n# Inserting Database Data\n\nYou insert database\
    \ data into a Mobile Service table by calling the MobileServiceTable insert()\
    \ method. For example, the following code adds a new task to the Tasks database\
    \ table:\n\n```\nvar newTask = {\n  name: \"Finish writing book\"\n};\n```"
  merge: -1
  pgno: 314
- img_proc: true
  md: "# CHAPTER 10 Using Windows Azure Mobile Services\n\n```\n```csharp\n// Call\
    \ insert on the mobile service\ntaskTable.insert(newTask).done(\n    // Success\n\
    \    function (result) {\n    // Failure\n    function (err) {\n    }\n}\n);\n\
    ```\n```\n\nThe insert() method returns a promise. You can supply a success and\
    \ an error function to handle the result of performing the insert.\n\nNotice that\
    \ the success function takes a result parameter. The result parameter represents\
    \ the new task returned by the insert() operation. The task returned by the insert()\
    \ method includes an id property that represents the primary key of the new database\
    \ record.\n\nThe error function also accepts a parameter. You can use err.responseText\
    \ to get any error message returned when attempting to perform the request. You\
    \ might, for example, display the error message in a modal popup dialog.\n\n#\
    \ Updating Database Data\n\nYou edit an existing database record by calling the\
    \ MobileServiceTable update() method.\n\n```\n```csharp\nvar taskToUpdate = {\n\
    \    id: 3,\n    name: \"Finish writing chapter 10\"\n};\n```\n```\n\n```\n```csharp\n\
    taskTable.update(taskToUpdate).done(\n    // Success\n    function (result) {\n\
    \    // Fail\n    function (err) {\n    }\n);\n```\n```\n\nWhen you update a record,\
    \ you must include the primary key of the record being updated in the object passed\
    \ to the update method. In this case, the taskToUpdate object must include an\
    \ id property that corresponds to the primary key of the record in the database\
    \ being updated.\n\nWhen you create a new table using Azure Mobile Services, the\
    \ new table gets a primary key column named id automatically. The id column is\
    \ an auto-increment column."
  merge: -1
  pgno: 315
- img_proc: true
  md: "# Deleting Database Data\n\nYou delete data from a database table by calling\
    \ the del() method. Here is how you would delete a task from the Tasks table:\n\
    \n```\nvar taskToDelete = {\n  id: 3,\n  name: \"Finish writing chapter 10\"\n\
    };\ntasksTable.del(taskToDelete).done(\n  // Success\n  function () {},\n  //\
    \ Fail\n  function (err) {}\n});\n```\n\nYou must pass the value of the primary\
    \ key of the object being deleted by the del() method. In the preceding code,\
    \ the taskToDelete has both an id and name property and the task with an id of\
    \ 3 is work fine if I left out the name property.\n\nYou don't get anything back\
    \ when a record is deleted successfully. Therefore, there is no reason to include\
    \ a parameter for the success function.\n\n> NOTE\nWhy is the method named del()\
    \ instead of delete()? The problem is that delete is a JavaScript reserved word.\n\
    \n# Performing Database Queries\n\nIn this section, I talk about the different\
    \ ways in which you can use the Mobile Services for WinJS to retrieve database\
    \ records from a Mobile Service. I discuss methods for retrieving a single record\
    \ and a set of records.\n\n# Looking Up a Single Database Record\n\nIf you want\
    \ to retrieve a single database record from a Mobile Service then you can call\
    \ the MobileServiceTable lookup() method like this:\n\n```\nvar id = 3;\ntasksTable.lookup(id).done(\n\
    \  // Success\n  function (result) {},\n  // Fail\n  function (err) {}\n});\n\
    ```"
  merge: -1
  pgno: 316
- img_proc: true
  md: "# 302 CHAPTER 10 Using Windows Azure Mobile Services\n\nYou pass the id of\
    \ the record that you want to retrieve to the lookup() method. The id should be\
    \ an integer and represent a primary key value.\n\nIf there is no matching record\
    \ then an error is returned and the promise error function is executed.\n\n# Retrieving\
    \ a Set of Database Records\n\nThe MobileTable object supports the following methods\
    \ for performing database queries that retrieve a set of records:\n\n+   * includeTotalCount()—Includes\
    \ the total count of matching records in the results\n* orderBy(coll, coll2, ...)—Returns\
    \ the matching records sorted in ascending\n* orderByDescending(coll, coll2, ...)—Returns\
    \ the matching records sorted in descending order\n* read(query)—Executes the\
    \ database query\n* select(function)—Returns a specific set of columns\n* skip(count)—Skips\
    \ a certain count of records\n* take(count)—Returns a limited count of records\n\
    * where(function | object)—Filters the records returned\n\nThese methods are chainable.\
    \ You can call the methods in succession to build a complex query.\n\n> NOTE\n\
    You can execute the queries discussed in this section by navigating to the queries\\\
    queries.html page.\n\nFor example, the following query returns the first three\
    \ tasks from the Tasks table in order of the Tasks name column:\n\n```\ntasksTable.take(3).orderBy(\"\
    name\").read().done({\n  // Success\nfunction (results) {\n  // Fail\n  function\
    \ (err) {\n});\n```"
  merge: -1
  pgno: 317
- img_proc: true
  md: "Executing this query returns results like the following:\n\n```\n{\n  \"id\"\
    :4,\"name\":\"Task A\",\n  \"id\":3,\"name\":\"Task B\",\n  \"id\":1,\"name\"\
    :\"Task C\"\n}\n```\n\nIf you call the includeTotalCount() method then you get\
    \ the total number of matching results included in your results when you limit\
    \ the results:\n\n```\ntasksTable.includeTotalCount().take(3).orderBy(\"name\"\
    ).read().done(\n// Success\nfunction(results) {\n  var totalCount = results.totalCount;\n\
    },\nFail:\nfunction (err) {\n});\n```\n\nExecuting this query returns the same\
    \ array of results as the previous query. However, the results include a property\
    \ named totalCount that contains the total count of records in the Tasks database\
    \ table (see Figure 10.5).\n\n| id | name |\n|---|---|\n| 4 | Task A |\n| 1 |\
    \ Task B |\n| 2 | Task C |\n5 total records\n\n# FIGURE 10.5 Displaying a total\
