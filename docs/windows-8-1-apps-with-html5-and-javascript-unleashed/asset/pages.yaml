  md: '# Using the Search Charm


    When you perform a search using the Search charm, you pick the area in which you
    want to search. For example, you can search Everywhere, Settings, Files, Web Images,
    or Web Videos. If the current app is registered as a search provider then you
    can also search the current app.


    Figure 13.11 illustrates the search areas displayed when you open the Search charm
    in Internet Explorer. Notice that you can pick the Internet Explorer app as one
    of the search areas. If you pick Internet Explorer and your search area then you
    get search results from Internet Explorer.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_384_0.png)


    FIGURE 13.11 Using the Search charm in Internet Explorer


    In this section, I explain how you can set up your Windows Store app as a search
    provider and wire up your app to work with the Search charm.


    > NOTEnSearch in Windows 8.1 is very different than search in Windows 8. The user
    interface has changed significantly. By default, search in Windows 8.1 is powered
    by Bing.


