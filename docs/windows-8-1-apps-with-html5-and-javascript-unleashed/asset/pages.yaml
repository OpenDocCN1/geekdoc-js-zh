    \    maxRating:3,\n    tooltipStrings: ['bad', 'okay', 'great!']\n}></div>\n```\n\
    \n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_140_0.png)\n\nFIGURE 4.11 Customizing\
    \ Rating control ratings\n\nNotice that the tooltipStrings property accepts a\
    \ JavaScript array. Each item in the array corresponds to a star.\n\n# Submitting\
    \ a Rating\n\nThe Rating control raises three events: preview, cancel, and change.\
    \ The preview event is raised when you hover over a star. The cancel event is\
    \ raised when you don't select a star after hovering over it. Finally, if you\
    \ click a star, the change event is raised.\n\nThe page in Listing 4.7 contains\
