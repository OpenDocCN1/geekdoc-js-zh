    # Using the ListView Control


    This entire chapter is devoted to one control: the ListView control. This is the
    single most important control included in the WinJS library. If you need to efficiently
    display an interactive list or grid of items—for example, a list of products,
    a list of movies, a list of files, a list of photos—then the ListView control
    is the control to use.


    The ListView control is used in many of the standard Windows 8.1 Mail app. For
    example, the ListView is used in the Windows 8.1 Mail app to display the list
    of messages in your inbox (see Figure 8.1). The control has been designed to perform
    well when displaying thousands of items.


    In this chapter, I explain how you can take advantage of all the most important
    features of the ListView control. You learn the basics, including how to select,
    sort, filter, and group items in a ListView.


    I also discuss more advanced features of the ListView control. In particular,
    you learn how to use the ListView control with semantic zoom to generate different
    representations of the same data. You also learn how to take advantage of drag
    and drop with a ListView.


    # IN THIS CHAPTER


    +   - Introduction to the ListView Control

    - Using Different Layouts

    - Adding Items to a ListView Control

    - Selecting Items in a ListView

    - Sorting Items in a ListView Control

    - Filtering Items in a ListView Control

    - Grouping Items in a ListView Control

    - Switching Views with Semantic Zoom

    - Switching ListView Templates Dynamically

    - Using Drag and Drop'
