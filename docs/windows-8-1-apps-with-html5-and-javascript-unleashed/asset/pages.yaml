  md: '# CHAPTER 5

    Creating Forms


    +   * Using HTML5 Form Validation

    * Using HTML5 Input Elements

    * Creating a Rich Text Editor

    * Displaying Progress


    I assume that anyone who is reading this book is already familiar with the basics
    of HTML, but I don''t assume that you are familiar with the latest features of
    HTML5. In particular, I don''t assume you are familiar with the changes to HTML
    forms included in the HTML5 standard.


    In the first section of this chapter, I describe how you can take advantage of
    HTML5 form validation in a Windows Store app. You learn how to use validation
    attributes—such as the required and pattern attribute—to enforce validation constraints.


    Next, I discuss the new features of input elements included in HTML5. You learn
    how the new HTML5 input types enable you to control the type of data entered into
    a form field.


    Finally, I talk about two other new features of HTML5. I explain how you can take
    advantage of the contenteditable attribute to create input elements that accept
    rich text such as bold and italic text. I also discuss the new HTML5 progress
    element.


    # Using HTML5 Form Validation


    In a Windows Store app, the easiest way to validate HTML form fields is to take
    advantage of the HTML5 validation attributes. Imagine, for example, that you want
    to create an HTML form that includes a form field for entering a Social Security
    number. In that case, you can use the required attribute to ensure that a value
    has been entered and you can use the pattern attribute to ensure that the value
    matches the pattern for a valid Social Security number.'
  merge: -1
  pgno: 164
- img_proc: true
  md: "# Using the required Attribute\n\nThe following HTML form illustrates how you\
    \ can use the required attribute:\n\n```\n<form>\n<div>\n  <label>\n    Social\
    \ Security Number:\n    <input id=\"ssn\" required />\n  </label>\n</div>\n<div>\n\
    \  <input type=\"submit\" />\n</div>\n</form>\n```\n\nIf you submit the form,\
    \ and you do not enter a value for the ssn field, then you get the error message\
    \ depicted in Figure 5.1. The input field has a red border surrounding it and\
    \ a callout message is displayed.\n\n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_165_0.png)\n\
    \nFigure 5.1 Using the required validation attribute\n\n# Using the pattern Attribute\n\
    \nYou use the pattern attribute to validate the value entered into an input field\
    \ against a regular expression pattern. For example, the following HTML form validates\
    \ the Social Security number against a regular expression:\n\n```\n<form>\n<div>\n\
    \  <label>\n    Social Security Number:\n    <input id=\"ssn\"\n      required\n\
    \      pattern=\"^\\d{3}-\\d{2}-\\d{4}\\$\"\n      title=\"###-##-####\"\" />\n\
    \  </label>\n</div>\n<div>\n</div>\n```"
  merge: -1
  pgno: 165
- img_proc: true
  md: "```\n<input type=\"submit\" />\n</div>\n</form>\n```\n\nNotice that the ssn\
    \ field has both a required and pattern attribute. The pattern attribute is not\
    \ triggered unless you enter a value.\n\nNotice, furthermore, that the ssn field\
    \ includes a title attribute. The title attribute contains the format displayed\
    \ by the pattern error message.\n\nIf you enter an invalid Social Security number\
    \ then you get the validation error message displayed in Figure 5.2.\n\n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_166_0.png)\n\
    \nFIGURE 5.2 Using the pattern validation attribute\n\n> NOTE\nMy favorite site\
    \ for finding regular expressions is located at http://regexlib.com.\n\n# Performing\
    \ Custom Validation\n\nIf you need to add custom validation rules to a form element\
    \ then you can take advantage of the JavaScript setCustomValidity() method. You\
    \ can use this method to associate a custom validation error message with a form\
    \ field.\n\nImagine, for example, that you have a complex set of rules for validating\
    \ a username in a user registration form. For example, you want to ensure that\
    \ the username is a certain length, in the database, and does not contain special\
    \ characters. This is a good candidate for a custom validation.\n\nThe following\
    \ HTML form includes a userName field:\n\n```\n<form>\n<div>\n  <label>\n    User\
    \ Name:\n    <input id=\"userName\" required />\n  </label>\n</div>\n<div>\n```"
