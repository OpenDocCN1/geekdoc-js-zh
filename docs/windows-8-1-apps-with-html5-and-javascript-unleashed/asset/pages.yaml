  md: "# CHAPTER 7 Using the ItemContainer, Repeater, and FlipView Controls\n\nIn\
    \ Listing 7.4, a selectionchanged event handler is added to all of the ItemContainers\
    \ on the page. When the selectionchanged event is raised, a new option is selected,\
    \ each option (other than the option that raised the event) is unselected. This\
    \ ensures that only one option is selected at a time.\n\n> WARNING\n\nBe careful\
    \ about infinite recursion here. Setting the ItemContainer selected property raises\
    \ the selectionchanging and selectionchanged events. Therefore, if you are not\
    \ careful when you set the selected property within either of these events then\
    \ you can crash your app.\n\n# Using Drag-and-Drop Items\n\nThe ItemContainer\
    \ is compatible with standard HTML5 drag and drop. You enable drag and drop for\
    \ an ItemContainer by setting the draggable option to the true value like this:\n\
    \n```\n<div data-win-control=\"WinJS.UI.ItemContainer\" data-win-options=\"{draggable:true}\"\
    >\n  Item 1\n</div>\n```\n\nAfter you enable drag and drop for an ItemContainer,\
    \ you can handle the standard HTML5 drag and drop events:\n\n+   * dragstart—Raiser\
    \ when you start dragging a draggable ItemContainer.\n* dragover—Raiser when you\
    \ drag an ItemContainer over an element. Handle this event to enable an ItemContainer\
    \ to be dropped on a particular element.\n* dragenter—Raiser when you drag an\
    \ ItemContainer over a new element. Handle this event to create a visual indication\
    \ of possible drop targets.\n* dragleave—Raiser when you drag an ItemContainer\
    \ out of an element. Handle this event to create a visual indication of possible\
    \ drop targets.\n* dragend—Raiser when a drag and drop operation completes. Handle\
    \ this event to do any clean up.\n\nImagine, for example, that you want to be\
    \ able to drag a list of items onto a drop target. When you drag an item onto\
    \ the drop target, you want the drop target to display the identity of the item\
    \ dropped (see Figure 7.3)."
