  md: "# Using the Menu Control\n\nThe WinJS Menu control is derived from the Flyout\
    \ control—so it has a lot of features in common. Like the Flyout control, the\
    \ Menu control appears in a popup and the menu disappears automatically when you\
    \ click outside of the menu area.\n\nHowever, unlike the Flyout control, the Menu\
    \ control is specifically designed to display menu commands. You can place only\
    \ menu commands in a Menu control and not other types of controls or HTML elements.\
    \ The Menu control supports the following types of menu commands:\n\n+   - button—You\
