  md: '# 34 CHAPTER 1 Building Windows Store Apps


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_49_0.png)


    Figure 1.26 The Visual Studio JavaScript Console Window


    You can view JavaScript errors and write debug messages to the Visual Studio console
    window by using `console.log()` in exactly the same way as you would write to
    a browser console window.


    If you hit an error and you want to display the value of a JavaScript variable
    then you can expand the variable name in the bottom of the JavaScript Console
    (see Figure 1.27).


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_49_1.png)


