  md: '# Building Windows Store Apps with Visual Studio


    # # Windows Store App Templates


    When you select the File, New Project menu option in Visual Studio, you can select
    from five different project templates as your starting point for your Windows
    Store app:


    +   1. Blank App—The simplest of the templates. Contains a single default.html,
    default.css, and default.js.

    2. Navigation App—Use this template for apps that require multiple pages.

    3. Grid App—Contains three pages for displaying groups of items.

    4. Split App—Contains two pages for displaying groups of items.

    5. Hub App—Contains three pages. One page displays a navigation hub and the other
    two pages display section and item detail. This project template is new with Windows
    8.1.


    We already used the Blank App project template when creating our first Windows
    app. Let us discuss the other project templates in more detail.


    #  Navigation App Project Template


    The Blank App is a good template to use when building a simple, single-page app.
    If you need to support multiple pages, on the other hand, you should use the Navigation
    App template.


    The Navigation App project template includes a single page named home. You can
    add additional pages by adding new Page Controls to the pages subfolder (see Figure
    1.16). I describe how you can create multi-page applications in detail in Chapter
    12, “Page Fragments and Navigation."


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_42_0.png)


    FIGURE 1.16 Creating a multi-page app with the Navigation App project template


    The next three project templates—the Grid App, the Split App, and the Hub App
    templates—are built on top of the Navigation App template. In other words, these
    project templates are multi-page apps with additional pages.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Grid App Project Template


    The Grid App project template contains three pages. The main page displays groups
    of items in a horizontal scrolling grid. You can click a group to view group details
    or click an item to view item details.


    Imagine, for example, that you are creating a product catalog. In that case, you
    might create different product categories such as Beverages and Fruit. Each category
    is a group and each category contains a set of product items.


    You can use the Grid App groupeditems page to display a horizontal scrolling grid
    of the product categories and associated products (see Figure 1.17). If you click
    a product category then you can view details for that category (see Figure 1.18).
    If you click a product then you can view details for that product (see Figure
    1.19).


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_43_0.png)


    FIGURE 1.17 The Grid App groupeditems page'
