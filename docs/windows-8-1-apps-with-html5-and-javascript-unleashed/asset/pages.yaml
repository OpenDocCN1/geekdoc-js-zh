    +   IN THIS CHAPTER

    * Namespaces, Modules, and Classes

    * Asynchronous Programming with Promises

    * Retrieving DOM Elements with Query Selectors

    * Performing Ajax Calls with the Scheduler Function

    * Using the Scheduler to Prioritize Tasks


    The goal of this chapter is to explain the features included in the base WinJS
    library. These are the features that you will use in just any application that
    you build.


    The first part of this chapter is devoted to the topic of namespaces, modules,
    and classes. You learn the recommended patterns for organizing your JavaScript
    code.


    Next, you learn how to take advantage of another feature of the base WinJS library
    called *promises*. Promises provide you with an elegant way to perform asynchronous
    programming in your JavaScript code.


    In this chapter, you also learn how to use Query Selectors when working with the
    WinJS library. Query Selectors enable you to efficiently retrieve DOM elements
    from an HTML document (jQuery selectors).


    You also learn how to work with a function included in the base WinJS library
    named *xhr()* function. The *xhr()* function enables you to perform Ajax calls—including
    cross-domain calls.


    Finally, you are provided with an introduction to the WinJS Scheduler. The Scheduler
    is a new feature of Windows 8.1 that enables you to improve the performance of
    your app by executing JavaScript code with different priorities.


