  md: '# Asynchronous Programming with Promises


    operation. Retrieving data from a remote website with an Ajax request takes longer
    or might not complete at all.


    When an operation might take a long time to complete, you should write your code
    so that it executes asynchronously. Instead of waiting for an operation to complete,
    you should start the operation and then do something else until you receive a
    signal that the operation is complete.


    An analogy: Some telephone customer service lines require you to wait on hold—listening
    to really bad music—until a customer representative is available. This is synchronous
    programming and very wasteful of your time.


    Some newer customer service lines enable you to enter your telephone number so
    a customer representative can call you back when a customer representative becomes
    available. This approach is much less wasteful of your time because you can do
    useful things while waiting for the callback.


    There are several patterns that you can use to write code that executes asynchronously.
    The most popular pattern in JavaScript is the callback pattern. When you call
    a function which might take a long time to return a result, you pass a callback
    function to the function.


    Using callbacks is a natural way to perform asynchronous programming with JavaScript.
    Instead of waiting for an operation to complete, sitting there and listening to
    bad music, you can get a callback when the operation is complete.


    # Using Promises


    The Common website defines a promise like this (http://wiki.commonjs.org/wiki/Promises):


    > "Promises provide a well-defined interface for interacting with an object that
    represents the result of an action that is performed asynchronously, and may or
    not be finished at any given point in time. By utilizing a standard interface,
    different components can return promises for asynchronous actions and consumers
    can utilize the promises in a predictable manner."


    A promise provides a standard pattern for specifying callbacks. In the WinJS library,
    when you create a promise, you can specify three callbacks: a complete callback,
    a failure callback, and a progress callback (both the failure and progress callbacks
    are optional).


    Promises are used extensively in the WinJS library. The methods in the animation
    library, the control library, and the binding library use all promises.


    For example, the xhr method included in the WinJS base library returns a promise.
    The xhr() method wraps to the standard XMLHttpRequest object in a promise. In
    Listing 2.7 illustrates how you can use the xhr() method to perform an Ajax request
    that retrieves the feed from my blog at StephenWalther.com.'
