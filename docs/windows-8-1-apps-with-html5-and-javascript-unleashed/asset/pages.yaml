  md: '# CHAPTER 7 Using the ItemContainer, Repeater, and FlipView Controls


    When you start dragging an ItemContainer, the dragstart handler is called. This
    handler assigns the ItemContainer being dragged to the dragMeItem variable.


    As you drag the ItemContainer over the page, the dragover, the dragenter, and
    the dragleave events are raised. The dragover event is used to determine where
    the ItemContainer can be dropped. The dragover event in Listing 7.6 enables the
    ItemContainer to be dropped only when the ItemContainer is dragged over the dropTarget:
    DIV element.


    You can (optionally) handle the dragenter and dragleave events to make a change
    in the user interface to validate drop locations. In the code in Listing 7.6,
    the dropTarget element is highlighted when you drag an ItemContainer over it.

    The drop handler simply displays the identity of the dropped ItemContainer in
    the dropTarget.


    The drop handler is responsible for handling the actual drop. In Listing 7.6,
    the draghandler is used to ensure that the dropTarget is no longer highlighted
    after the drag-and-drop operation completes.


    > NOTE

    ListView control implements all of the HTML5 drag-and-drop event handlers for
    you. In other words, if you want to implement drag and drop with very little work
    then just use a ListView control. We discuss drag and drop using the ListView
    in the next chapter.


