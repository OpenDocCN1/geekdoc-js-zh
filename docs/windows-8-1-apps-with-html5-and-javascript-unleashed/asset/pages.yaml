    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_26_0.png)


    FIGURE 1.4 The Settings charm


    When you are building a Windows Store app, you don''t build your own Settings
    menu. Instead, you extend the Settings charm with your custom app settings. I
    discuss the details of doing this in Chapter 6, “Menus and Flyouts.”


    # Different App Sizes and Orientations


    Every Windows 8.1 app supports a minimum width of either 500 pixels or 320 pixels.
    For example, if a Windows 8.1 app has a minimum horizontal size of 500 pixels
    then the app can be resized to any size between 500 pixels and the maximum screen
    size of the device where the app is displayed.


    If you are lucky enough to have a sufficiently large screen, then you can display
    multiple running apps side by side (up to four apps per monitor). For example,
    Figure 1.5 illustrates three Windows 8.1 apps running side by side (the Calendar,
    Maps, and News apps).


    > WARNING


    You cannot display more than two 500 pixel apps on a 1,024 pixel by 768 pixel
    screen because that would violate the laws of mathematics.'
