- img_proc: true
  md: 'The app bar contains the commands for creating tasks, deleting tasks, and marking
    tasks complete. Notice that the first and second tasks in Figure 16.1 have been
    marked as complete. Both tasks appear with a line through them.


    The nav bar enables you to navigate to another date and see the tasks for that
    date. In Figure 16.1, Thursday is highlighted because it represents the selected
    date.


    The MyTasks app was created using the Visual Studio Navigation App project template.
    The app contains a single page named home that is located at the path \pages\home\home.html.
    The home page displays the content that you see in Figure 16.1.


    The MyTasks app uses three custom JavaScript libraries:


    +   - live.js—Contains methods for interacting with Live Connect


    +   - services.js—Contains methods for interacting with Windows Azure Mobile Services


    +   - speech.js—Contains methods for using the Windows 8.1 Text-To-Speech synthesizer


    All three of these libraries can be found in the Visual Studio project \js folder.


    # Setting Up the App


    > NOTE If you want to avoid performing the setup steps described in this section
    but you still want to play with the MyTasks app then I recommend that you install
    the MyTasks app from the Windows Store.


    All of the source code for the MyTasks app is included in the GitHub repository
    associated with this book. Because the MyTasks app relies on external services—Live
    Connect and Windows Azure Mobile Services—you must perform some setup before the
    app will run.


    Setup is tedious and painful—but I guarantee that you can get everything to work
    with a strong cup of coffee and some patience in less than 15 minutes. You need
    to bounce back and forth between three websites:


    +   - Windows Store Dashboard—https://app.microsoft.com/StorePortals


    +   - Windows Azure Management Portal—http://manage.WindowsAzure.com


    +   - Live Connect Developers Center—https://account.live.com/developers/applications


    You can find detailed instructions for creating a Windows Azure Mobile Service
    in Chapter 10. Detailed instructions for getting an app to work with Live Connect
    and Windows Azure Mobile Services are in Chapter 14.'
