- img_proc: true
  md: '> NOTE

    Behind the scenes, session state is stored in local storage in a file named

    _sessionState.json. After the checkpoint event, session state is written to this
    file auto-matically. When an app is activated after termination, session state
    is loaded from this file automatically.


    # Designing for Different Window Sizes


    Windows 8.1 supports up to four apps side-by-side on the same monitor. For example,
    you can have your mail app open next to your music app next to your cal-dar app
    next to your solitaire app. You can even go crazy and attach multiple monitors
    to your computer and each monitor can display multiple side-by-side apps.


    > NOTE

    The number of apps that you can display side by side on a single monitor depends
    on your screen resolution. For example, you can''t display more than two apps
    side by side by a 1,024 pixel by 768 pixel monitor.


    You can resize an app at any time. For example, you can stretch the width of your
    mail app while you are reading your emails and shrink your mail app when shifting
    your focus to playing solitaire. A well-designed Windows Store app will intelli-gents
    adapt to the available real estate. For example, if a fat app is forced to get
    skinny, it will hide extra content automatically.


    If you are using a tablet computer—such as a Microsoft Surface—then you can switch
    the orientation of your computer at any time from portrait to landscape. Again,
    a well-designed Windows Store app will detect orientation changes and adapt automatically.


    In this section, you learn how to detect when the width or the orientation of
    your app changes. You learn how to gracefully adapt to different display widths
    and orientations.


    > NOTE

    Windows 8, unlike Windows 8.1, have discrete view states. In particular, Windows
    8 supported snapped, filled, and full screen view states. Windows 8.1 no longer
    supports discrete view states. Instead, you should build your app with the expectation
    that a user might change the width of your app continuously to any size larger
    than the minimum.


    # Setting the Minimum App Width


    By default, a Windows Store app has a minimum width of 500 pixels. You should
    design your Windows Store app so that it looks at 500 pixels and any resolution
    greater than 500 pixels (within reason).'
  merge: -1
  pgno: 335
