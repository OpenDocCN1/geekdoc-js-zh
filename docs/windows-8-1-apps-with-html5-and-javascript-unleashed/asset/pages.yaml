  pgno: 26
- img_proc: true
  md: '![](img/8ab4405a0676ad7bea0c93c2b4e03e30_27_0.png)


    FIGURE 1.5 Three Windows 8.1 apps side by side


    > NOTE > Windows 8, unlike Windows 8.1, supported running of no more than two
    apps at once. Furthermore, when using Windows 8, one of the running apps was required
    to be snapped to a horizontal resolution of 320 pixels. Windows 8.1 is far more
    flexible.


    A Windows Store app also must work when used with different device orientations.
    For example, when an app is viewed on a tablet computer, the user always has the
    option of rotating your app from a landscape to a portrait orientation.


    When building Windows Store apps, you need to design the app so it works with
    different screen resolutions and orientations. At any moment, the horizontal resolution
    of your app could be dramatically changed. I discuss how to handle switching between
    different resolutions in Chapter 11, "App Events and Stats."


    # People, Not Machines, Use Windows Store Apps


    When you buy a Windows Store app, the app is licensed per user and not per machine.
    When you buy an app, you can use the app on up to five machines—including both
    tablets and desktops—associated with your user account. You can view and install
    all of your purchased apps from the Windows Store by right-clicking within the
    Store app and selecting Your Apps.


    Better yet, data from your apps can be shared across multiple machines (roaming
    application data). So, if you are using an app to read an article on your tablet
    PC on the bus and then you open the same app on your desktop PC at work, you won''t
    lose your place in the article.'
