  md: "# Creating Custom Data Sources\n\nFor example, when creating a read-only data\
    \ source, you can create the `insertAtEnd()` method like this:\n\n```\ninsertAtEnd():\
    \ function (unused, data) {\n  return WinJS.Promise.wrapError(new WinJS.ErrorFromName(WinJS.UI.Editor.notPermitted));\n\
    }\n```\n\n# Implementing the setNotificationHandler() Method\n\nThe `setNotificationHandler()`\
    \ method enables you to raise notifications when the status of a data source changes.\
    \ You can call any of the following methods:\n\n+   - beginNotifications()\n-\
    \ changed()\n- endNotifications()\n- inserted()\n- invalidateAll()\n- moved()\n\
    - reload()\n- removed()\n\nYou don't need to raise these notifications when using\
    \ the standard data adapter methods such as the `insertAtEnd()`, `remove()`, and\
    \ `change()` methods discussed earlier. However, you will need to raise these\
    \ notifications when you add a custom method to your data source.\n\nImagine,\
    \ for example, that you want to add a `nuke()` method to your data source. When\
    \ you call the `nuke()`, all of the data is removed from your data source.\n\n\
    Here's how you would implement the `nuke()` method in the data adapter class:\n\
    \n```\nsetNotificationHandler: function (notificationHandler) {\n  this.notificationHandler\
    \ = notificationHandler;\n}\n\nnuke: function () {\n  this._arrayData = [];\n\
    \  this._notificationHandler.reload();\n}\n```"
  merge: -1
  pgno: 284
- img_proc: true
  md: "In the preceding code, the setNotificationHandler() method assigns the predefined\
    \ notificationHandler method to a private variable named _notificationHandler.\
    \ This makes this predefined notificationHandler method available to all of the\
    \ methods in the data adapter.\n\nThe nuke() method, our custom method, sets the\
    \ data source array to an empty array and calls the notificationHandler reload()\
    \ method. If you don't call reload() then a ListView bound to the data source\
    \ won't clear away its items.\n\nHere's how you can expose the custom nuke() method\
    \ from a data source:\n\n```\nvar MyDataSource = WinJS.Class.derive(\n  WinJS.UI.VirtualizedDataSource,\n\
    \  // Constructor\n  function (fileName) {\n    this._adapter = new MyDataAdapter();\n\
    \    this._baseDataSourceConstructor(this._adapter);\n  },\n  // Instance methods\n\
    \  {\n    nuke: function () {\n      this._adapter.nuke();\n    }\n  }\n);\n```\n\
    \nThe MyDataSource class in the code includes a nuke() method. The nuke() method\
    \ simply delegates to the data adapter nuke() method.\n\n# Creating a File Data\
    \ Source\n\nIn this section, I discuss how you can create a custom file data source.\
    \ The file data source stores and retrieves data from the file system.\n\n> NOTE\n\
    The complete source code for the FileDataSource is included in the GitHub source\
    \ code in a folder named file.\n\nThe DataSource includes implementations of the\
