  md: '# Adapting to Screen Changes


    Wide, thin, then wide again. The MyTasks app is designed to gracefully adapt to
    different screen widths. As I discussed in Chapter 11, multiple Windows 8.1 apps
    can be run side side. A user can change the size of a Windows 8.1 app at any moment.


    A standard Windows 8.1 app should be designed to work at any width between 500
    pixels and higher. By default, 500 pixels is the minimum horizontal width for
    a Windows 8.1 app.


    However, I wanted to be able to use the MyTasks app at widths lower than 500 pixels.
    In particular, I wanted to be able to open the MyTasks app side by side with other
    applications such as Visual Studio. That way, I can quickly add a new task to
    the MyTasks app while working within Visual Studio (see Figure 16.5).


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_455_0.png)


    FIGURE 16.5 Using MyTasks at 320 pixels


    If you want your Windows Store app to support a minimum width less than 500 pixels
    then you need to modify your app manifest (package.appxmanifest). I changed the
    minimum width for MyTasks to be 320 pixels (see Figure 16.6).'
  merge: -1
  pgno: 455
