  md: '# CHAPTER 10


    # Using Windows Azure

    Mobile Services


    The easiest way to store data in a Windows Store app

    is to take advantage of Windows Azure Mobile Services.

    Windows Azure Mobile Services enables you to store your

    data in a Windows Azure database hosted in the cloud.


    If you take advantage of Mobile Services then you don''t

    need to build and host your own web service on your own

    web server. You can let Microsoft worry about all that.


    Imagine, for example, that you want to create a Task List

    app and be able to access the list of tasks from multiple

    computers and tablets. In that case, you can store the list of

    t in a database table hosted on Azure and retrieve the

    list of tasks from anywhere. You can even access Mobile

    Service from non-Microsoft clients running iOS or Android.


    In this chapter, I explain how you can set up and create

    Azure Mobile Services. I demonstrate how you can insert,

    update, and delete an Azure database table from your

    Windows Store app. I also discuss how you can handle vali-

    dating form data when you submit the data to the cloud.


    > NOTE

    I discuss authorization and Windows Azure Mobile

    Services in Chapter 14, "Using the Live Connect API."


    # Creating a Mobile Service


    The first step required to use Azure Mobile Services is to log

    in to the Windows Azure Management Portal and create a

    new Mobile Service. You log in to the portal by navigating

    to http://manage.WindowsAzure.com.


    +   IN THIS CHAPTER

    - Creating a Mobile Service

    - Creating a Database Table

    - Installing the Mobile Services for Wx8 Library

    - Performing Inserts, Updates,

    and Deletes

    - Performing Database Queries

    - Performing Validation

    - Performing Custom Actions

    - Debugging Script Errors'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# CHAPTER 10 Using Windows Azure Mobile Services


    > NOTE

    I am assuming that you have subscribed to Windows Azure. If you haven''t subscribed
    to you need to visit http://WindowsAzure.com. They provide a free trial account
    if you just want to play with Microsoft''s multibillion data center centers.


    After log in to the portal, you can create a new Mobile Service by clicking the
    tab on the left of the page (see Figure 10.1). You create a new Mobile Service
    by providing a URL and creating a SQL Azure database. For example, I created a
    new service with the URL https://unleashed.azure-mobile.net/


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_311_0.png)


    FIGURE 10.1 Creating a new Mobile Service in the Windows Azure Management Portal


    As an alternative to using the web portal, you can create a new Mobile Service
    from directly inside Visual Studio. You first need to import your Windows Azure
    subscriptions into Visual Studio. Open the Server Explorer window, right-click
    Windows Azure Mobile Services, and select Import Subscriptions. Use the Import
    Subscriptions dialog to download and import your Azure subscriptions.


    Next, you can create a new Mobile Service by right-clicking Windows Azure Services
    and selecting the Create Service (see Figure 10.2). Use the Create Mobile Service
    to select a URL and a database for your new Mobile Service.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_311_1.png)


    FIGURE 10.2 Creating a new Mobile Service inside Visual Studio'
  merge: -1
