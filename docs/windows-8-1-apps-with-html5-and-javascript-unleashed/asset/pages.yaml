  md: "# Using the DatePicker Control\n\n+   - {month.abbreviated(n)}\n- {month.solo.full}\n\
    - {month.solo.abbreviated}\n- {month.solo.abbreviated(n)}\n- {month.integer}\n\
    - {month.integer(n)}\n\nFinally the datePattern property accepts the following\
    \ date format specifiers:\n\n+   - {day.integer}\n- {day.integer(n)}\n- {dayofweek.full}\n\
    - {dayofweek.abbreviated}\n- {dayofweek.abbreviated(n)}\n- {dayofweek.solo.full}\n\
    - {dayofweek.solo.abbreviated}\n- {dayofweek.solo.abbreviated(n)}\n\nAbove the\
    \ (n) refers to a number. For example, if you always want to display the day of\
    \ the month using two digits (possibly including a leading zero) then you would\
    \ use the day date format specifier {day.integer(2)}.\n\nHere's how you can display\
    \ an integer for the month, day and year:\n\n```\n<div id=\"dateBirthday\"\n \
    \   data-win-control=\"WinJS.UI.DatePicker\"\n    data-options='{\n        monthPattern:\
    \ '{month.integer(2)}',\n        datePattern: '{day.integer(2)}',\n        yearPattern:\
    \ '{year.abbreviated}'\n    }'></div>\n```\n\nBecause the datePattern is set to\
    \ the value {day.integer(2)}, a leading zero is displayed for single digit dates\
    \ (see Figure 4.14)."
