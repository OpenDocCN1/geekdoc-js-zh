    # Using the Windows Content Indexer


    In previous sections, I used a very simple method to determine whether a note
    matches a search query. If the title of the note contains the search query then
    that counts as a match. I did not even try to match the contents of the notes
    because the contents of the notes might contain HTML markup.


    In order to perform more sophisticated searches, you can take advantage of the
    Windows Index. The Windows Index, for example, enables you to perform Boolean
    queries that include OR and NOT operators. You can also perform exact phrase queries
    by wrapping your search terms in quotation marks. Finally, the Windows Index supports
    different types of content including HTML content.


    > NOTE


    When performing OR or NOT Boolean queries, you must enter OR and NOT in uppercase.


    In this section, I show you how to take advantage of a new API that was introduced
    with Windows 8.1 for interacting with the Windows Index. This new API enables
    you to index content from an app without creating new files in the file system.
    Instead, you can add, update, and delete content in the Windows Index directly
    from your app.'
  merge: -1
  pgno: 395
- img_proc: true
  md: "# Understanding the Windows Content Indexer API\n\nTo use the Windows Index\
    \ from a Windows Store app, you need to know how to work with the following three\
    \ WinRT classes:\n\n+   - ContentIndexer—This class contains methods for adding,\
    \ updating, and deleting content in an index. It also enables you to create a\
    \ new index query.\n\n+   - IndexableContent—This class represents content that\
    \ can be added to the index.\n\n+   - ContentQuery—This class represents a particular\
    \ query that you can perform against the index.\n\nSo you use the ContentIndexer\
    \ class to interact with the Windows Index that corresponds to your app. The ContentIndexer\
    \ class enables you to add new content to the index by creating an instance of\
    \ the IndexableContent class. The ContentIndexer also enables you to query the\
    \ index by creating an instance of the ContentQuery class.\n\n# Creating an Indexer\
    \ Helper\n\nTo make it easier to work with the Windows Index, I created a JavaScript\
    \ Indexer helper object. This helper has methods for inserting new content in\
    \ the index, deleting content from the index, and querying the index.\n\n> NOTE\
    \ You can find all of the code discussed in this section in the Chapter13\\SearchIndex\
    \ solution that accompanies this book.\n\nThe complete code for this helper object\
    \ is contained in Listing 13.9.\n\nLISTING 13.9 The IndexerHelper Object (js\\\
    indexerHelper.js)\n\n```\nfunction () {\n  \"use strict\";\n  var props = Windows.Storage.SystemProperties;\n\
    \n  // Add new content to the index\n  function add(id, value, itemNameDisplay,\
    \ keywords, comment) {\n    // Get the indexer\n    var indexer = Windows.Storage.Search.ContentIndexer.getIndexer();\n\
    \n    // Create content for the indexer\n    var content = new Windows.Storage.Search.IndexableContent();\n\
    \    var contentStream = new Windows.Storage.Streams.RandomAccessAccessStream();\n\
    \    var contentWriter = new Windows.Storage.Streams.DataWriter(contentStream);\n\
    \    contentWriter.WriteString(value);\n\n    return contentWriter.storeAsync().then(function\
    \ () {\n```\n\n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_396_0.png)"
  merge: -1
