  md: '# Using HTML5 Input Elements


    # Labeling Form Fields


    First off, you need to know the proper way to label HTML form fields. Providing
    proper labels is important for making your app accessible to users with disabilities—so
    adding labels is the right thing to do.


    There are two ways that you can use a label to label a form element. If you want
    the label to appear right next to the form element then you can include the form
    element inside the label''s opening and closing tags like this:


    ```

    <label>

    Title:

    <input id="inpTitle" required />

    </label>

    ```


    If the label is separated from the element being labeled in the page then you
    can associate the label and the form element explicitly by using the label''s
    for attribute this.


    ```

    <label for="inpTitle">

    Title:

    .. Other Content ..

    <input id="inpTitle" required />

    ```


    You should always label all of your form elements to make your apps more accessible
    to people with disabilities (screen readers need these labels). However, if you
    need to provide additional hints about the appropriate input value for a form
    element then you can take advantage of the new HTML5 placeholder attribute. When
    used in a Windows Store app, the placeholder attribute creates a watermark.


    For example, the following HTML form contains a field for entering a product activation
    code:


    ```

    <label>

    Activation Code:

    <input id="activationCode"

    size="10"

    placeholder="##-####-##" />

    </label>

    ```


    The form includes a placeholder attribute which displays the text ##-####-## (see
    Figure 5.5). As soon as you start typing a value into the field, the placeholder
    text disappears.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_172_0.png)'
  merge: -1
  pgno: 172
- img_proc: true
  md: "# CHAPTER 5 Creating Forms\n\n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_173_0.png)\n\
    \nFIGURE 5.5 Using the placeholder attribute\n\n> NOTE\nYou can use the Cascading\
    \ Style Sheet :-ms-input-placeholder pseudo class to style the text displayed\
    \ by a placeholder attribute.\n\n# Entering a Number\n\nIf you want to prevent\
    \ a user from entering anything except a number into an input field then you should\
    \ use the type=\"number\" attribute like this:\n\n```\n<label>\nFavorite Number:\n\
    \  <input id=\"inpFavNumber\"\n       type=\"number\"\n       placeholder=\"###\"\
    \ />\n</label>\n```\n\nIf the input type has the value number, and you enter anything\
    \ that is not a number, then the value disappears as soon as the field loses focus.\
    \ This can be confusing to the user. So it is a good idea to include a placeholder\
    \ attribute or instruction text that indicates that the field only accepts numbers\
    \ (no dollar signs, just numbers).\n\nYou can use the min and max attributes to\
    \ specify a minimum and maximum value for the input field like this:\n\n```\n\
    <label>\nQuantity:\n  <input id=\"inpQuantity\"\n       type=\"number\"\n    \
    \   placeholder=\"###\"\n       min=\"1\"\n       max=\"10\" />\n</label>\n```\n\
    \nIf you enter a number that does not fall into the specified range then a validation\
    \ error message is displayed (see Figure 5.6)."
