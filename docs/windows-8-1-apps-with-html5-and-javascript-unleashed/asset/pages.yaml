  md: "# CHAPTER 4 UsingJS Controls\n\nLISTING 4.4 Creating a WinJS Control Imperatively\
    \ (controlImperative\\controlImperativejs)\n\n```\n(function () {\n  \"use strict\"\
    ;\n\n  function initialize() {\n    var dateBirthday = document.getElementById(\"\
    dateBirthday\");\n    var ctrlBirthday = new WinJS.UI.DatePicker(dateBirthday);\n\
    \  }\n\n  document.addEventListener(\"DOMContentLoaded\", initialize);\n})();\n\
    ```\n\nThe code in Listing 4.4 creates a new instance of the JavaScript WinJS.UI.DatePicker()\
    \ class. The DatePicker class is created by passing the dateBirthday DIV element\
    \ to the constructor for the DatePicker class. Notice that you do not need to\
    \ call WinJS.UI.processAll() because you do not need to parse the document when\
    \ creating WinJS controls imperatively.\n\nThe code in 4.4 articulates that a\
    \ WinJS control is really just a JavaScript class. You can create this class declaratively\
    \ with the data-win-control attribute or imperatively by instantiating the class\
    \ in code. But, at the end of the day, it is a JavaScript class either way.\n\n\
    In this book, I take the declarative approach instead of the imperative approach\
    \ to creating controls. There is nothing wrong with either approach. However,\
    \ because the Microsoft samples favor the declarative approach, I will follow\
    \ Microsoft’s lead and use the declarative approach also.\n\n# Setting Control\
    \ Options\n\nMost controls support options. For example, when creating a TimePicker\
    \ control, you want to be set the default time or the clock format (24-hour or\
    \ 12-hour).\n\nYou can specify options declaratively by taking advantage of the\
    \ data-win-options attribute. For example, the following HTML fragment demonstrates\
    \ how you can set the current time displayed by the TimePicker control to the\
    \ time 3:04pm and the clock format to a 24-hour clock:\n\n```\n<div id=\"timeLunch\"\
    \n  data-win-control=\"WinJS.UI.TimePicker\"\n  data-win-options=\"{\n    current:\
    \ '3:04pm',\\n    clock: '24HourClock'\n  }\"></div>\n```\n\nThe options object\
    \ passed to the control is a JavaScript object—hence the curly braces around the\
    \ property names and value."
  merge: -1
  pgno: 133
- img_proc: true
  md: "# Introduction to WinJS Controls\n\nIf you prefer, you can set these options\
    \ imperatively. Here's how you can create an instance of the TimePicker control\
    \ in code and set its current and clock options:\n\n```\nfunction () {\n  \"use\
    \ strict\";\n\n  function initialize() {\n    var divLunch = document.getElementById(\"\
    timeLunch\");\n    var ctrlLunch = new WinJS.UI.TimePicker(timeLunch, {\n    \
    \  current: '3:04pm',\nn      clock: '24HourClock'\n    });\n  }\n\n  document.addEventListener(\"\
    DOMContentLoaded\", initialize);\n}();\n```\n\nThe options are passed to the TimePicker\
    \ constructor as the second parameter. The current time and clock options are\
    \ set.\n\n> NOTE\nnYou can also take advantage of the WinJS.UI.setOptions() method\
    \ to set control options imperatively. You can call the setOptions() method after\
    \ the control is constructed.\n\n# Retrieving Controls from an HTML Document\n\
    \nWhen a control gets created, it is always associated with a DOM element. The\
    \ DOM element is the \"host\" for the control.\nYou can retrieve a control from\
    \ its associated DOM element by using the winControl property. Every DOM element\
    \ that has an associated control has a winControl property that represents the\
