    # Working with the QueryCollection Class


    Both the WinJS.Utilities.query() method and the WinJS.Utilities.id() method return
    an instance of the QueryCollection class. The QueryCollection class derives from
    the base JavaScript Array class adds several useful methods for working with HTML
    elements:


    +   - addClass(name)—Adds a class to every element in the QueryCollection

    - setStyle(name)—Removes a style from every element in the QueryCollection

    - control(ctr, options)—Enables you to transform the items in the query collection
    into WinJS controls

    - forEach(callback, thisArg)—Enables you to perform an operation on each item
    in the QueryCollection

    - get(index)—Retrieves the element from the QueryCollection at the specified index

    - getAttribute(name)—Retrieves the value of an attribute for the first element
    in the QueryCollection

    - hasClass(name)—Returns true if the first element in the QueryCollection has
    a certain class'
