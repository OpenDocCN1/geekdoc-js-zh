    # Configuring App Settings


    Windows Store apps have a standard location for users to configure app settings.
    You access app settings from the Settings charm in the charm bar which you can
    open by


    +   - Moving your mouse to the bottom right of your screen

    - Swiping with your finger from the right edge of the screen

    - Pressing the Windows log key + 1


    The first two methods open the Charms panel from which you can select Settings.
    The last method opens the Settings panel directly.


    By default, System settings—such as network and volume settings—appear at the
    bottom of the Settings window (see Figure 6.11). Permission settings also appear
    automatically. Finally, if you did in fact get your Windows Store app from the
    Windows Store then the Settings window will also include Rate and Review settings.'
