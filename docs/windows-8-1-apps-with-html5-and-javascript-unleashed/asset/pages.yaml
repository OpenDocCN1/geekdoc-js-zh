  md: '# CHAPTER 2 WinJS Fundamentals


    A high-priority job yields only when a higher priority job is scheduled. So, if
    you schedule a job with a high priority, and you call `shouldYield()`, then the
    job will yield only when there is a higher priority job in the queue.


    A job scheduled with a lower priority than high—for example, `Priority.normal`
    or `Priority.idle`—will yield in two situations. First, a lower priority job will
    always yield to a higher priority job. Also, a job scheduled with a lower priority
    will yield automatically after a time slice.


    Because the `showQuote()` method was scheduled with `Priority.idle`, the `showQuote()`
    method will yield after a time slice automatically. Even though the `showQuote()`
    method creates a busy loop, it won''t completely block the user interface thread.
    Checking `shouldYield` breaks the busy loop automatically after every so many
    milliseconds.


    > WARNING


    Never ever, ever create busy loops in your JavaScript code. I only included a
    busy loop in List 2.20 to dramatize the Scheduler works.


    # Summary


    The goal of this chapter was to introduce you to the features of the base WinJS
    library. In the first section, you learned how to organize your JavaScript code
    into modules, namespaces, and classes. By taking advantage of modules and namespaces,
    you can avoid polluting the global namespace and make your app easier to maintain
    over time.


    Next, I discussed how you can take advantage of promises whenever you need to
    write asynchronous code. I discussed, for example, how you can use promises when
    performing Ajax requests. You learned how to create promises, cancel promises,
    chain promises, and compose new promises from existing promises.


    I also discussed how you can use WinJS query selectors to retrieve DOM elements.
    You learned how to use `WinJS.Utilities.query()` to perform a query using a selector
    and return a query. You also learned how to retrieve individual elements with
    `WinJS.Utilities.id()`.


    I also explained how you can use the `WinJS.xhr()` function to perform Ajax queries
    in a Windows Store app. You learned how to control the type of data returned by
    the `WinJS.xhr()` function by setting the `responseText` option. For example,
    you learned how to return the results of an Ajax query as a string or a document.


    Finally, I showed you how to take advantage of the Scheduler introduced in Windows
    8.1 to execute JavaScript code with different priorities. I demonstrated how you
    can yield a low priority job to a high priority job.'
