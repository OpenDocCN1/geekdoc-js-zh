    # Using the SearchBox Control


    When building Windows 8 apps, you were encouraged to use the Search charm for
    implementing search in your app. There was a problem, however. Users had difficulty
    finding the Search charm even if your app even supported search.


    Windows 8.1 introduces an alternative. Instead of implementing search with the
    Search charm, you can implement search with the new WinJS SearchBox control. This
    control appears right on your page (right in your face). Therefore, it is much
    more discoverable than the Search charm.


    In this section, you learn how to add a SearchBox control to the My Notes app.'
