    FIGURE 12.3 Creating a navigation app


    First, the Navigation App template contains pages folder. The pages folders contain
    all of the Page controls that represent the pages in your application. Each Page
    control is contained in a separate subfolder of the pages folder.


    The Navigation App template includes pages/home folder that contains a Page control
    that represents the home. This Page control is loaded by default when you start
    a Navigation App template.


    The Navigation App template, like the Blank App template, does include a default.html
    file. However, this file mainly acts as a shell for loading different Page controls
    from the pages folder. When you navigate page to page, the content in the body
    of the default.html file is loaded with new content.


    Finally, the Navigation App template includes a WinJS control that is not included
    in the Blank App template named the PageControlNavigator control. This control
    is located in a file named js/navigator.js. The PageControlNavigator control handles
    all of the details of loading the Page controls into the default.html page.


    Let me dig how all of this works a little deeper.


    # Understanding the Navigation App default.html


    As I mentioned previously, the default.html page in a navigation app is mainly
    a shell for the content contained in the Page controls. The entire contents of
    the default.html page is contained in Listing 12.1.'
