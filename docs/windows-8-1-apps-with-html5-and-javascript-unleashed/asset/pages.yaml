    # Using Namespaces


    Let me start by explaining the methods in the WinJS library for defining namespaces.


    Before we do anything else, we should start by answering the question: Why do
    we need

    namespaces? What function do they serve? Do just add needless complexity to our

    Windows Store apps?


    After all, plenty of JavaScript libraries do just fine without introducing support
    for

    namespaces. For example, jQuery has no support for namespaces and jQuery is the
    most

    popular JavaScript library in the universe. If jQuery can do without namespaces,
    why do

    we need to worry about namespaces at all?


    Namespaces perform two functions in a programming language. First, namespaces
    prevent

    namin collisions. In other words, namespaces enable you to create more than one
    object

    with the same name without conflict.


    For example, imagine that two companies—company A and company B—both want to

    make a JavaScript shopping cart control and both companies want to name the control

    ShoppingCart. By creating a CompanyA namespace and CompanyB namespace, both

    companies can create a ShoppingCart control: a control CompanyA.ShoppingCart and
    a

    CompanyB.ShoppingCart control.


    The second function of a namespace is organization. Namespaces are used to group

    related functionality even when the functionality is defined in different physical
    files.

    For example, I know that all the methods in the WinJS library relate to working
    with

    classes can be found in the WinJS.Class namespace. Namespaces make it easier to
    under-

    stand the availability in the library.


    If you are building a simple JavaScript application then you won''t have much
    reason to

    about namespaces. If you need to use multiple libraries written by different people

    then namespaces become very important.


