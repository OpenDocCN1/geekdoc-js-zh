  md: '# CHAPTER 13


    # Creating Share and Search Contracts


    +   - Supporting Sharing

    - Using the Search Charm

    - Using the Search Control

    - Using the Windows Content Indexer


    The focus of this chapter is the two topics of share and search. Enabling sharing
    for your app enables your app to participate in the ecosystem of apps living on
    your machine. For example, you can share a winning score in a game app, or pictures
    from a camera app, or appointments from a calendar.


    Adding support for search enables users of your app to quickly find content in
    your app. For example, users might search for an appointment in a Calendar app,
    a picture in a Photo Gallery app, or an article in a News app.


    In this chapter, I discuss two ways to implement search: you learn how to implement
    search both using the Search charm and using the new SearchBox control. I also
    explain how you can index content using the new Windows 8.1 Content Indexer.


    Throughout this chapter, I demonstrate how to implement share and search in the
    context of a single sample app. I demonstrate how you can build a note gathering
    app, named My Notes, which enables you to share and search notes (see Figure 13.1).


    NOTE


    You can find the full source code for this chapter in the Chapter 13 folder in
    the repository that accompanies this book on GitHub.'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# CHAPTER 13 Creating Share and Search Contracts


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_369_0.png)


    FIGURE 13.1 The My Notes app


    # Supporting Sharing


    When you build a Windows Store app, you can decide whether you want your app to
    act as a share source, a share target, or both. Let me explain the difference
    between being a share source and a share target.


    When your app acts as a share source, you can share information from your app
    with other Windows apps. Every app acts as a share source automatically. You share
    from an app by opening the Windows Charm bar and clicking the Share charm.


    > NOTE

    At a minimum, every Windows Store app enables you to share a screenshot of the
    app.'
  merge: -1
  pgno: 369
- img_proc: true
  md: 'If you click the Share charm in the Internet Explorer app, for example, then
    you can share a web page with other apps installed on your machine such as the
    Mail app, the Reader app, and the Twitter app (see Figure 13.2). If you share
    a web page with the Mail app then a link with a summary of the web page is opened
    in a new mail message.


    > NOTE

    You can open the Windows Charm bar by swiping from the right edge of the screen
    or mousing to either of the right corners or pressing the keyboard combination
    Win+C.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_370_0.png)


    FIGURE 13.2 Using Internet Explorer and a share source


    If you want your app to act as a share source then you can decide on the information
    that you want to share. For example, in the case of a game app, you might want
    players of your game to be able to share a winning score on Twitter or Facebook.
    Or, if you are building a Calendar app, you might want to be able to share appointments
    by email.'
  merge: -1
  pgno: 370
- img_proc: true
  md: 'Your app can act not only as a share source, your app can also act as a share
    target. When your app acts as a share target then it appears in the list of apps
    in the Share charm as a target for sharing information.


    You can register your app as a share target for different types of content. In
    that case, your app appears in the Share charm only when a particular type of
    content is being shared.


    For example, if you are building a photo gallery app, then it would make sense
    to make your app a share target for pictures. Or, if you are building an app for
    taking notes then you would want to make your app a share target for all sorts
    of content such as HTML and plain text. Again, it is up to you to decide what
    types of content you want to accept for your app.


    Let me show you how all of this works in the context of the My Notes app.


    # Creating a Share Source


    The My Notes app acts a share source by enabling you to share notes with other
    apps. For example, you might want to share notes by email or (don''t ask me why)
    Facebook or Twitter.


    Here''s how it works. Select a note from the list of notes, click the Share charm,
    and select the app that you want to share the note with (Figure 13.3). If you
    select the Mail app then a new message is created with the note (Figure 13.4).


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_371_0.png)


    FIGURE 13.3 Sharing a note with the My Notes app'
  merge: -1
  pgno: 371
