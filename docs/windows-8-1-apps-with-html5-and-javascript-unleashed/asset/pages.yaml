- img_proc: true
  md: 'forward()—Enables you to navigate forward in history. If you supply an integer
    parameter then you can go forward in history a certain number of entries.


    navigate()—Enables you to navigate to a particular page (Page control). You can
    also supply a custom object which represents the initial state of the page.


    And, you can use the following properties with navigation:


    +   - canGoBack—Returns true when you can navigate back.


    +   - canGoForward—Returns true when you can navigate forward.


    +   - history—Returns an object that represents all of the history entries. The
    history object has a current, backStack, and forwardState property.


    +   - location—Returns the URL associated with the current page.


    +   - state—Returns the state associated with the current page.


    Finally, the Navigation API supports the following three navigation events:


    +   - beforenavigate


    +   - navigating


    +   - navigated


    For each of these three events, you can use the detail property to read the location
    and state properties.


    # Understanding the PageControlNavigator


    The PageControlNavigator control is included with the Navigation App, Grid App,
    Split App, and Hub App Visual project templates—but it is not included with the
    Blank template.


    The PageControlNavigator control handles the navigated event and takes care of
    loading the right Page control in response to this event. For example, if you
    call WinJS.Navigation.navigate("/pages/somePage/somePage.html") then the PageControlNavigator
    loads the somePage.html Page control into the default. html page.


    # Understanding Navigation State


    When building a multi-page app with the Navigation API, you can take advantage
    of Navigation state to preserve your state as you navigate back and forth between
    pages. Each entry in history has a state property associated with it. You can
    assign whatever state that you want to this state property.'
  merge: -1
