  md: "# Creating an IndexedDB Data Source\n\nWhen you create an instance of the IndexedDB\
    \ data source, you also have the option of supplying a cursorOptions data source,\
    \ the cursorOptions object filters the object store. Here are the properties of\
    \ the cursorOptions object:\n\n+   - indexName—Create a key range using this index\n\
    \n+   - only—Create a key range and only return objects that match this value\n\
    \n+   - lowerBound—Create a key range and only return objects that have a value\
    \ greater than this lower bound\n\n+   - upperBound—Create a key range and only\
    \ return objects that have a value less than this upper bound\n\nFor example,\
    \ here is how you would filter tasks so that tasks created before 1999 are returned:\n\
    \n```\nWinJS.UI.processAll().done(function () {\n  var lvTasks = document.getElementById(\"\
    lvTasks\").winControl;\n\n  var createOptions = {\n    indexNames: [\"dateCreated\"\
    ],\n    databaseVersion: 3\n  };\n\n  var cursorOptions = {\n    indexName: \"\
    dateCreated\",\n    upperBound: new Date(\"1/1/1999\")\n  };\n\n  var tasksDataSource\
    \ = new DataSources.IndexedDBDataSource(\"tasks\", createOptions, cursorOptions);\n\
    \  lvTasks.itemDataSource = tasksDataSource;\n});\",\n```\n\nIn the code, the\
    \ createOptions object causes the tasks object store to be created with an index\
    \ on its dateCreated property. The cursorOptions object uses that index to return\
    \ only those tasks that have a dateCreated below the upperBound 1/1/1999.\n\n\
    I want to show you a more complete sample of using the IndexedDB data source.\
    \ The Movie app contained in Listing 9.3 and Listing 9.4 enables you to select\
    \ different movie categories and display only the movies in the selected category.\
    \ The app also enables you to create new movies and delete existing movies (see\
    \ Figure 9.6)."
