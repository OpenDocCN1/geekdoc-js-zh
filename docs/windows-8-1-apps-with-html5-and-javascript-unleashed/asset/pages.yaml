  md: '# Creating an IndexedDB Data Source


    When you create an instance of the web service data source, you must supply two
    arguments to the constructor: the URL of the web service and the name of the primary
    key property of the data to retrieve.


    The URL http://localhost:51807/api/tasks is the address of a local web service
    using port 51807. This port is generated randomly. You can determine the port
    number used by a Visual Studio project by opening the Project Properties dialog
    and selecting the Web tab (see Figure 9.4).


    > NOTE

    In the sample code, I use a web service located at localhost instead of providing
    a domain name. Using localhost while developing a new Windows Store app is fine,
    but if you attempt to release a Windows Store app that uses localhost then the
    app will fail certification.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_296_0.png)


    Figure 9.4 Determining the port number used by a Visual Studio project


    # Creating an IndexedDB Data Source


    The Indexed Database API (IndexedDB) is a W3C recommendation for exposing a database
    in the browser. The IndexedDB recommendation is supported by Firefox 12+, Chrome
    19+, and IE 10+. And, of course, the IndexedDB recommendation is supported by
    Windows Store apps.


    Behind the scenes, different browsers use different databases behind the IndexedDB
    API. For example, Firefox uses SQLite and IE uses SQLCE. The IndexedDB API provides
    a standard way to interact with these databases across browsers and across platforms.


    If you need to store lots of data in a Windows Store app, and query subsets of
    the data, IndexedDB is a good choice. Because IndexedDB supports indexes and cursors,
    you can work efficiently with large sets of data.


    In this section, I discuss how you can create an IndexedDB data source. I discuss
    how you can build a simple app which enables you to filter a list of movies by
    category (see Figure 9.5).'
