    The preceding code contains a handler for the WinJS.Application.activated event.
    event.previousExecutionState property represents the previous state of the application.
    All of the previous states are represented by the ApplicationExecutionState enumeration.


    Here are all of the possible values of the ApplicationExecutionState enumeration:


    +   * notRunning—The user activates the app after installing the app from the
    Windows Store, rebooting the computer, logging in and out, ending the task, the
    app crashing, or closing the app and restarting it within 10 seconds of closing.

    * running—The app is already running and the user activates it through a secondary
    tile or through one of the activation contracts or extensions.

    * suspended—The app is suspended and the app is activated through a secondary
    tile or through one of the activation contracts or extensions.

    * terminated—The app was terminated by Windows.

    * closedByUser—The app was closed by the user and not restarted for more than
    10 seconds.


