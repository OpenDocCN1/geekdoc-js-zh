    # Composing Promises


    You can build promises out of other promises. In other words, you can compose
    promises. Composing promises is useful when you need to perform multiple asynchronous
    operations and wait until all or any of the operations complete.


    There are two static methods of the Promise class that you can use to compose
    promises: the join() method and the any() method. When you join promises, a promise
    is complete when all of the joined promises are complete. When you use the any()
    method, a promise is complete when any of the promises complete.


    The following code illustrates how to use the join() method. A new promise is
    created out of two timeouts. The new promise does not complete until both of the
    timeout promises complete:


    ```

    WinJS.Promise.join([WinJS.Promise.timeout(1000),WinJS.Promise.timeout(5000)])

    .done(function () { console.log("join complete"); });

    ```


    The message "complete" will not be written to the JavaScript Console until both
    promises are passed to the join() method complete. The message won''t be written
    for 5 seconds (5,000 milliseconds).


    The any() method completes when any promise passed to the any() method completes:


    ```

    WinJS.Promise.any([WinJS.Promise.timeout(1000),WinJS.Promise.timeout(5000)])

    .done(function () { console.log("any complete"); });

    ```


    The code writes the message "any complete" to the JavaScript Console after 1 second
    (1,000 milliseconds). The message is written to the JavaScript console immediately
    after the first promise completes and before the second promise completes.


