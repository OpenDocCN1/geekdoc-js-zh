    > NOTE


    The Windows App Certification Kit is installed at the same time as you install
    Visual Studio. You can run it independently of Visual Studio by launching the
    Windows App Cert Kit from the Start screen.


    When you run the Windows App Certification Kit, the App Certification Kit launches
    and runs your app, and after your computer does crazy stuff for a while, a report
    is generated that details whether your app passes or fails (see Figure 1.34).


    > NOTE


    If you are using Team Foundation Server, you can even integrate the Windows App
    Certification Kit into your build process. Every time you do a new build of your
    app, you can run the technical certification tests automatically.'
