  md: "Listing 4.2 includes a call to the WinJS.UI.processAll() method. If you forget\
    \ to call this method (which is very easy to do) the controls declared in the\
    \ HTML page are never converted to controls.\n\nNotice that the call to WinJS.UI.processAll()\
    \ happens within an initialize() method, which is not called until the DOMContentLoaded\
    \ event is raised. The DOMContentLoaded event happens after an HTML document is\
    \ loaded. You must wait until the document is loaded before calling WinJS.UI.processAll()\
    \ or there won't be anything to process.\n\n# Creating Controls Imperatively\n\
    \nIn the previous section, I created an instance of the DatePicker control declaratively.\
    \ I declared the control in the HTML markup of the page.\n\nAs an alternative\
    \ to creating a WinJS control declaratively, you can also create a control imperatively.\
    \ In other words, you can control the control entirely in your JavaScript.\n\n\
    Consider the page in Listing 4.3. It contains a DIV element with an id of dateBirthday.\
    \ This DIV element does not have a data-win-control attribute.\n\nLISTING 4.3\
    \ Creating a WinJS Control Imperatively (controlImperative\\.html)\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <meta charset=\"utf-8\" />\n  <title>Chapter04</title>\n\
    \  <!-- WinJS references -->\n  <link href=\"css/ui-dark.css\" rel=\"stylesheet\"\
    \ />\n  <script src=\"Microsoft.WinJS.2.0/js/base.js\"></script>\n  <script src=\"\
    Microsoft.WinJS.2.0/js/ui.js\"></script>\n  <!-- Chapter04 references -->\n  <link\
    \ href=\"css/default.css\" rel=\"stylesheet\" />\n  <script src=\"controlImperative.js\"\
    ></script>\n</head>\n<body>\n  <div id=\"dateBirthday\"></div>\n</body>\n</html>\n\
    ```\n\nThe code in Listing 4.4 creates a DatePicker control and associates the\
    \ new control with the dateBirthday DIV element."
