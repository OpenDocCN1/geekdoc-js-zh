  md: "# Using Different ListView Layouts 229\n\n+   - Spanning Layout—Same as grid\
    \ layout supports multiple column items.\n\n+   - Layout—ListView items are displayed\
    \ in a single list.\n\nEach list corresponds to a JavaScript object—the GridLayout,\
    \ CellSpanningLayout, ListView objects—that has its own properties and methods.\
    \ Let us discuss each of these layout options in detail.\n\n# Using Grid Layout\n\
    \nThe default layout is grid layout. When a ListView displays items in grid layout,\
    \ the items are displayed in multiple columns. If there are too many items to\
    \ fit in the ListView you scroll to the right to view the additional items (see\
    \ Figure 8.4).\n\n> NOTE\nUnder the covers, grid layout uses the W3C CSS 3 Grid\
    \ Layout recommendation. You can read details here at /dev.w3.org/css/css3-grid-layout/.\n\
    \n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_244_0.png)\n\nFIGURE 8.4 ListView in\
    \ grid layout\n\nThe ListView uses grid layout, you can set the maximumRowsOrColumns\
    \ property to set how many of grid rows should be displayed. Here is how you would\
    \ set the maximumRowsOrColumns property so a ListView displays only one row (see\
    \ Figure 8.5):\n\n```\n<div id=\"Products\">\n  data-win-control=\"WinJS.UI.ListView\"\
    \n  data-win-options={\n    itemTemplate: select('#tmplProduct'),\n    layout:\
    \ {type:WinJS.UI.GridLayout, maximumRowsOrColumns:1}\n  }></div>\n```"
