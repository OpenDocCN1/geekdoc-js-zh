  md: '# CHAPTER 1 Building Windows Store Apps


    All Windows Store apps have a common set of features. Let me explain these features
    by pointing them out in the context of the Bing News app that''s included with
    Windows 8.


    > NOTE

    It is worth pointing out that the standard Windows 8 Bing News app discussed in
    this section was written using HTML5 and JavaScript (using the same techniques
    described in this book). If you are curious, you can view the HTML and JavaScript
    source for the News app by opening the hidden folder where Windows apps are installed
    at Program Files\WindowsApps.


    Support for Keyboard, Mouse, Touch, and Stylus

    One of the most distinctive characteristics of a Windows Store app is its oversized
    tiles and buttons and general use of whitespace. All of this user interface (UI)
    roominess makes Windows Store apps friendly to fat fingers.


    Windows Store apps are designed to work equally well when used on a touch-only
    tablet and used on a desktop computer with a keyboard and mouse. Windows Store
    apps are designed to be gropeable.


    The nice thing about how Windows 8 works is that you don''t need to put a lot
    of thought into supporting touch as a developer. As long as you stick with the
    standard Windows controls, you get both keyboard and touch support for free.


    Using the App Bar and Nav Bar

    Figure 1.1 contains a screenshot of the Windows 8 Bing News app with the home
    page of Fox News. Notice that the only thing that you see is the content of Fox
    News. No toolbars, no menus, no status bars.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_23_0.png)


    FIGURE 1.1 Windows 8 Bing News app'
