    # Publishing to the Windows Store


    One of the main motivations for building a Windows Store app is to sell your app
    in the Windows Store for either fame or profit. In this section, I discuss the
    steps you need to publish your Windows Store app to the Windows Store.


    > NOTE

    You can distribute your app without publishing to the Windows Store by taking
    advantage of a feature called sideloading. In order to take advantage of sideloading,
    you must sign your app and configure the right group policy settings on the target
    computers. You can learn about sideloading by visiting http://technet.microsoft.com/en-us/library/hh852635.aspx.


    # Register as a Windows Developer


    Before you publish an app to the Windows Store, you must first register as a Windows
    Store developer. You can sign up at the Windows Store Dashboard on the Windows
    Dev Center by selecting the menu option Project, Store, Open Developer Account
    within Visual Studio (see Figure 1.30).'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'The sign-up procedure is painless. Currently, it costs either $49 (for an individual
    account) or $99 (for a company account) year to become a registered Windows Store
    developer, or it is free with a MSDN subscription.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_52_0.png)


    FIGURE 1.30 Register as a Windows Store developer


    # Submitting Your App


    After registering, you can access the Windows Store dashboard and submit a new
    app. The process of submitting an app is broken down into 8 steps (see Figure
    1.31).


    One of the most important steps is to select the name for your app. You can reserve
    an app name in the Windows Store even before you have finished creating the app.
    Picking an app name is similar to picking a domain name—so I recommend that you
    acquire the name that you want as soon as possible.


    You also need to decide on how much you want to charge for your app. Currently,
    you can charge anywhere from $1.49 to $999.99. Or, you have the option of providing
    your app for free. You also have the option of providing your app with a limited
    free trial or making your app free with advertising.'
