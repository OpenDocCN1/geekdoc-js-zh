  md: '# CHAPTER 15


    # Graphics and Games


    # IN THIS CHAPTER


    +   - Overview of the Game

    - Creating the Game Ties

    - Playing the Game Sounds

    - Creating the Game Canvas

    - Capturing User Interaction

    - Creating the Update Loop

    - Creating the Render Loop


    In this chapter, you learn how to create a simple game using a Windows Store app.
    You learn how to create a game named Brain Eaters.


    The goal of the Brain Eaters game is to avoid getting eaten by zombies while eating
    food pellets. If you eat all five food pellets then you win the game. If your
    character gets eaten by a zombie then you lose (see Figure 15.1).


    The game works with keyboard, mouse, touch, and stylus. You can move your character
    using the arrow keys on your keyboard. Alternatively, if you are using a slate,
    then you can touch the screen to indicate the direction that your character should
    move.


    The game also works at different display resolutions. The game board resizes automatically
    to fit the available screen size so you can play the game on both low-resolution
    and high-resolution screens.'
  merge: -1
  pgno: 432
- img_proc: true
  md: '![](img/8ab4405a0676ad7bea0c93c2b4e03e30_433_0.png)


    FIGURE 15.1 Brain Eaters game


    > NOTE

    All the code for the Brain Eaters game is included in the source code for this
    book in the Chapter15\Game folder.


    > NOTE

    The Brain Eaters game is included in the Windows Store. You can install it and
    try it while reading this chapter.


    # Overview of the Game


    I created the Brain Eaters game with the Visual Studio Navigation App template.
    The game includes the following pages:


    +   - home—The home page contains an introduction screen that explains the rules
    for the game. You click the Start Game button to navigate to the play page.

    - play—The play page contains the actual game. Here is where you need to run away
    from the zombies.

    - lose—If the zombies catch you then you lose the game and end up on the lose
    page. You can click the Play Again? button to return the play page.'
