  md: '# Registering Your App


    Before you start using the Live Connect API, you must first associate your app
    with the Windows Store and register your app with Live Connect.


    If you haven''t already then you need to associate your app with the Windows Store.
    Follow these steps:


    +   Within Visual Studio, select the menu option Project, Store, Associate App
    with the Store. (In Visual Studio Express, use Store, Associate App with the Store.)
    This will open the Associate Your App with the Windows Store Wizard (see Figure
    14.2).

    2. You need to select an app name that you want to associate with your Visual
    Studio project. I entered the app name UnleashedLiveConnectSample.

    3. Finally, when you click associate, your Visual Studio project manifest file
    will be updated with the information from the Windows Store.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_404_0.png)


    FIGURE 14.2 Associating your app with the Windows Store'
  merge: -1
  pgno: 404
- img_proc: true
  md: '# CHAPTER 14 Using the Live Connect API


    After you finish associating your app with the store then you next need to register
    your app with Live Connect. Follow these steps.


    +   1. In your web browser, navigate to the Windows Store Dashboard located at
    https://appdev.microsoft.com/StorePortals.

    2. Select your Windows Store app from the dashboard and click the Services tile
    (Figure 14.3).

    3. Click the link to the Live Services site.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_405_0.png)


    FIGURE 14.3 Editing Windows Store app services


    Navigating to the Live Services site will launch one last wizard. You must complete
    the following steps:


    +   1. Identifying your app—You already completed this step when you associated
    your Visual Studio project with the Windows Store.

    2. Authenticating your service—You should record the client secret that you see
    in this step (Figure 14.4). Later in this chapter, when I discuss Azure Mobile
    Services, you will need this client secret to connect to Live Services.

    3. Representing your app to Live Connect users—You need to provide several pieces
    of information in this step. In particular, you need to provide a URL where you
    host your Terms of Service and a Privacy Policy. You also must enter a Redirect
    URL.


    The Redirect URI can be any valid URL that you like—the only requirement is that
    the URI cannot be used by anyone else. For the sample project discussed in this
    chapter, I entered the Redirect URI http://liveSDKDemo.Superex.com.'
