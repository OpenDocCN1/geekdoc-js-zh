    # Using the FlipView Control


    The FlipView control can be used to display a collection of items. Unlike the
    Repeater or ListView controls, the FlipView only displays a single item from a
    collection at a time.


    The FlipView control is ideal for displaying a photo gallery—one picture at a
    time. It can also be used for swiping through a list of magazine or newspaper
    articles.


    When you use the FlipView, only a single item from a data source is displayed.
    However, arrows are displayed so you can move to the next or previous item in
    the data source.


    For example, the JavaScript file in Listing 7.14 includes a collection of three
    articles. Each article has a title, author, and articleText property.'
