    # Summary


    The goal of this chapter was to explain how to implement share and search in a
    My Notes Store app. I discussed share and search in the context of the My Notes
    sample app.


    In the first part of this chapter, I showed you how you can make your app a share
    source or a share target. You learned how you can share notes from the My Notes
    app and how you can accept HTML and content shared from another app.


    Next, I demonstrated how you can support search in the My Notes app by using the
    Search charm or by using the SearchBox control. Finally, I explained how you can
    support advanced search queries, such as Boolean queries, by taking advantage
    of the Windows Index.'
