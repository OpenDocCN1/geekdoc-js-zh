    \ that enables you to pick a file from your hard drive. When you pick a file then\
    \ the Live Connect WL.backgroundUpload method is called with three parameters:\n\
    \n+   - path—The path on SkyDrive where you want to upload the file\n- file_name—The\
    \ name of the new file to create on SkyDrive\n- file_input—The storage file picked\
    \ from the open file picker\n\nAfter the file is uploaded, the getFileList() method\
    \ is called to refresh the list of files displayed by the ListView control so\
    \ the ListView control will display the newly uploaded file.\n\n# Summary\n\n\
    This chapter focused on the subject of the Live Connect API. You learned how to\
    \ use the Live Connect API to support zero-click single sign-on to authenticate\
    \ users without requiring to enter their usernames and passwords. You also learned\
    \ how to pass an authentication token from a Windows Store app to a Windows Azure\
    \ Mobile Service.\n\nNext, you learned how you can extract a treasure trove of\
    \ information about the current user from Live Services. For example, I demonstrated\
    \ how you can retrieve the current user’s first and last name, birthday, and profile\
    \ picture from Live Services.\n\nFinally, I explained how you can interact with\
    \ SkyDrive from a Windows Store app. You learned how to list, download, and upload\
    \ files to a user’s SkyDrive account."
