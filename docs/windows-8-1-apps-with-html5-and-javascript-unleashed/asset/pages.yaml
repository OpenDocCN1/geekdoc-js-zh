  md: "# CHAPTER 8 Using the ListView Control\n\n```\n// Use WinRTSyndicationClient\
    \ to get blog feed\nvar client = new Windows.Web.Syndication.SyndicationClient();\n\
    var feedURI = new Windows.Foundation.Uri(\"http://stephenwalther.com/feed\");\n\
    client.retrieveFeedAsync(feedURI).done(function (feed) {\n\n  // Convert feed\
    \ items to a List\n  var listItems = new WinJS.Binding.List(feed.items);\n\n \
    \ // Bind list to ListView\n  lvBlog.itemDataSource = listItems.dataSource;\n\
    });\n\ndocument.addEventListener(\"DOMContentLoaded\", initialize);\n} (();\n\
    ```\n\nThe SyndicationClient returns an instance of the SyndicationFeed class.\
    \ The SyndicationFeed class has an items property that contains the blog entries.\n\
    \nThe blog entries are passed to the constructor for the WinJS.Binding.List class\
    \ and the List class is bound to the ListView control.\n\n> WARNING\nBy default,\
    \ a ListView control will try to make each of its list items an observable by\
    \ calling the WinJS.Binding.as() method. This does not work on WinRT objects as\
    \ the items returned by the SyndicationClient class. You'll get an exception if\
    \ you try to bind WinRT objects to a ListView control.\n\nThere are two ways to\
    \ get around this. If you look closely at the template in Listing 8.3 you will\
    \ notice that the title bar is bound using the WinJS.Binding.oneTime() converter.\
    \ When you use the WinJS.oneTime() converter, the ListView control does not attempt\
    \ to convert the items bound to it observables.\n\nAnother solution to this problem\
    \ would be to convert the array of WinRT objects into a new JavaScript array of\
    \ JavaScript objects before binding to the ListView control. JavaScript objects,\
    \ unlike WinRT objects, are happy to be made into observables.\n\n# Using Different\
    \ ListView Layouts\n\nThe overall appearance of a ListView is determined by its\
    \ layout. The ListView control supports three different layouts:\n\n+   - Grid\
    \ Layout—ListView items are displayed in a multiple column grid."
