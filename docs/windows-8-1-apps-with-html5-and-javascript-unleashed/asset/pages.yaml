  md: '+   - notify(name, newValue, oldValue)—A private method that executes each
    function in the _listeners array


    +   - removeProperty(name)—Removes a property and notifies any listeners


    +   - setProperty(name, value)—Updates a property and notifies any listeners


    +   - unbind(name, action)—Enables you to stop executing a function in response
    to a property change


    +   - updateProperty(name, value)—Updates a property and notifies any listeners


    So when you create an observable, you get a new object with the same properties
    as an existing object. However, when you modify the properties of an observable
    object, you can notify any listeners of the observable that the value of a particular
    property has changed automatically.


    Imagine that you change the value of the price property like this:


    ```

    observableProduct.price = 2.99;

    ```


    In this case, the following sequence of events is triggered:


    +   1. The price setter calls the setProperty("price", 2.99) method.


    +   2. The setProperty() method updates the value of the backingData.price property
    and calls the notify() method.


    +   3. The notify() method executes each function in the collection of listeners
    associated with the price property.


    When an observable property is updated, you can execute one or more functions
    (listeners) automatically.


    > WARNING

    If you call the WinJS.Binding.as() method on a WinRT object then you will get
    an exception. The problem is that WinRT objects are immutable and the WinJS.Binding.as()
    method attempts to add a new method named _getObservable() to the immutable object.
    You can make JavaScript object observable, but not WinRT objects.


    # Creating Observable Listeners


    If you want to be notified when a property of an observable object is changed,
    then you need to register a listener. You register a listener by using the bind()
    method as in Listing 3.1.'
