    - datetime

    - date

    - month

    - week

    - time

    - datetime-local

    - number

    - range

    - color


    You can take advantage of these new input types to enforce validation rules. For
    example, an <input type="number" /> element will accept only numerals and not
    other types of characters. And an <input type="url" /> will accept only valid
    (absolute) URLs.


    You can also take advantage of these new input types to control the user interface
    for entering a value into a field. For example, when using the touch keyboard,
    an <input type="email" /> displays a specialized keyboard for entering email addresses,
    which includes specialized keys as @ and .com (see Figure 5.4).


