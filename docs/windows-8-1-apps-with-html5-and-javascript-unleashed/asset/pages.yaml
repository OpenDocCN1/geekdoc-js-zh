    # Using the Scheduler to Prioritize Jobs


    You can take advantage of the WinJS Scheduler (introduced in Windows 8.1) to execute
    a JavaScript function with a specific priority.


    Why would you want to do this? A Windows Store app written with JavaScript contains
    only one user interface thread. That thread must be used to everything. The thread
    is used by both your application code and the controls in the WinJS library.


    If you want to create an app that responds quickly to user interaction then you
    need to prioritize the work performed with one and only user interface thread.


    > NOTE

    nA Windows Store app written with a single user interface thread unless you use
    Web Workers. You can use Web Workers to create additional execution threads. The
    disadvantage of using Web Workers is that a Web Worker cannot access the DOM.
    Jobs created with the Scheduler do not have this limitation.


    Imagine, for example, that you are creating an RSS Reader app and you are displaying
    the currently selected blog entry. Quietly, in the background, you want to fetch
    the next blog entry because you anticipate that the user will view the next entry
    soon.


    Using the Scheduler, you can retrieve the next blog entry until the user interface
    is idle. That way, if the user clicks quickly from one entry to another, you won''t
    block the user from interacting with your app.


    Let me show you a sample of using the Scheduler. You schedule a new job by calling
    the WinJS.Utils.Scheduler.schedule() method and passing the method that represents
    the job you want to execute and (optionally) a job priority.


    In Listing 2.19, the WinJS.Utils.Scheduler.schedule() method is used to create
    two jobs named job and job2. The first job is given a normal priority and the
    second job is'
