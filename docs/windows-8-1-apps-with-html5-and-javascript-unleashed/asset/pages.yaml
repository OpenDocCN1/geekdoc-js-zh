  md: "You declare a DatePicker like this:\n\n```\n<div id=\"dateBirthday\">\n  data-win-control=\"\
    WinJS.UI.DatePicker\"></div>\n```\n\n> > WARNING\n> Don't forget to call WinJS.UI.processAll()\
    \ or your DatePicker will never become a DatePicker.\n\nBy default, the DatePicker\
    \ control has today's date selected. You can assign a particular date to the DatePicker\
    \ control by setting the control's current property like this:\n\n```\n<div id=\"\
    dateBirthday\">\n  data-win-control=\"WinJS.UI.DatePicker\"\n  data-win-options={\n\
    \    current: '12/25/1966'\n  }></div>\n```\n\nThe code causes the date '12/25/1966'\
    \ to be selected as the default date in the DatePicker control.\n\n# Formatting\
    \ the Year, Month, and Date\n\nYou can assign format strings to the DatePicker\
    \ yearPattern, monthPattern, and datePattern properties to control the appearance\
    \ of the year, month, and date. A format string can contain any characters. Within\
    \ the format string, you can use one or more format specifiers. A date format\
    \ specifier is a magic string that displays part of a date using a particular\
    \ format.\n\nthe yearPattern property accepts the following date format specifiers:\n\
    \n+   - {year.full}\n- {year.full(n)}\n- {year.abbreviated}\n- {year.abbreviated(n)}\n\
    - {era.abbreviated}\n- {era.abbreviated(n)}\n\nthe monthPattern property accepts\
    \ the following date format specifiers:\n\n+   - {month.full}\n- {month.abbreviated}"
