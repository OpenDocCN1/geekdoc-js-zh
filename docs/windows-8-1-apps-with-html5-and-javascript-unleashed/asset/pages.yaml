    \nFigure 12.6 Navigating between pages\n\n# Understanding the Navigation API\n\
    \nThe WinJS.Navigation.navigate() method is just one method of the WinJS Navigation\
    \ API. You can use all of the following methods to control user navigation:\n\n\
    +   - back()—ables you to navigate back in history. If you supply an integer parameter\
