    # Using the Rating Control\n\nYou can use the WinJS Rating control to collect\
    \ and display user ratings. By default, the Rating control enables you to select\
    \ between 1 and 5 stars to rate something (see Figure 4.10). You can change the\
    \ rating by using your mouse, fingers, or by moving focus to the control and using\
    \ your up/down or left/right arrow buttons.\n\n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_139_0.png)\n\
    \nFIGURE 4.10 Collecting a user rating\n\nHere's how you declare a Rating control:\n\
    \n```\n<div id=\"rating-control\"=\"WinJS.UI.Rating\"></div>\n```\n\nThere are\
    \ a couple of options you can set when declaring a Rating control: you can set\
    \ the default rating (averageRating) and can set whether a user is allowed to\
    \ clear a rating (the default value is true).\n\n```\n<div id=\"ratingProduct\"\
    \n  data-win-control=\"WinJS.UI.Rating\"\n  data-win-options=\"{\n    averageRating:3,\n\
    \    enableClear:false\n  }\"></div>\n```\n\nYou can clear a rating by swiping\
    \ from right to left across the rating control. This results in no stars being\
    \ selected."
