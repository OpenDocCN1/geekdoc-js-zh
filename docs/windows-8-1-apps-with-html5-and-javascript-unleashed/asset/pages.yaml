  md: '# CHAPTER 6

    Menus and Flyouts


    This chapter focuses on the topics of flyouts, menus, tool-bars, settings, and
    dialogs. You learn how to throw options at users and get their responses.


    I start by explaining how you can use the Flyout and Menu controls to display
    options within the body of a page. You learn how to display buttons, flyouts,
    toggles, and separators with a Menu control.


    Next, I discuss app bars and nav bars. The app bar is the standard location for
    placing application commands and the nav bar is the standard location for displaying
    navigation links in a Windows Store app.


    You also learn how to configure your settings. You learn how to take advantage
    of the SettingsFlyout to extend the standard settings displayed by the Settings
    charm.


    Finally, I show how you can create modal dialogs with the MessageDialog class.
    You learn how to create warning dialogs and Yes/No dialogs.


    # Using the Flyout Control


    You use a Flyout control to display a popup in a page. The popup disappears as
    soon as you click outside of the popup (or press the Esc key). You can use the
    Flyout control to display information, display warnings, and get input.


    NOTE

    The Flyout control supports light dismiss. When you click outside the Flyout control,
    the control disappears auto-matically.


    +   IN THIS CHAPTER

    - Using the Flyout Control

    - Using the Menu Control

    - Using the separate Control

    - Using the dialog Control

    - Configuring App Settings

    - Displaying Windows Dialogs'
