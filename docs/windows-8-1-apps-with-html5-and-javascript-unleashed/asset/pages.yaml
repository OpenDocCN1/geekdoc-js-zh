  md: "# Using the ItemContainer Control\n\nLISTING 7.3 Selecting an ItemContainer\
    \ (ItemContainerSelection\\ItemContainerSelection.html)\n\n```\n<div class=\"\
    option\" data-win-control=\"WinJS.UI.ItemContainer\">\n  Option 1\n</div>\n\n\
    <div class=\"option\" data-win-control=\"WinJS.UI.ItemContainer\">\n  Option 2\n\
    </div>\n\n<div class=\"option\" data-win-control=\"WinJS.UI.ItemContainer\">\n\
    \  Option 3\n</div>\n```\n\nAnd, Listing 7.4 contains the JavaScript code that\
    \ ensures that only one option is selected at a time.\n\nLISTING 7.4 Selecting\
    \ an ItemContainer (ItemContainerSelection\\ItemContainerSelection.js)\n\n```\n\
    function () {\n  \"use strict\";\n\n  function initialize() {\n    var options\
    \ = WinJS.Utilities.query(\".option\");\n\n    WinJS.UI.processAll().).done(function\
    \ () {\n      // When an option state is changed\n      options.listen(\"selectionchanged\"\
    , function (e) {\n        // If If selected then unselect all of the other options\n\
    \        var isSelected = e.target.winControl.selected;\n        if (isSelected)\
    \ {\n          options.forEach(function (option) {\n            if (option !==\
    \ e.target) {\n              option.winControl.selected = false;\n           \
    \ }\n          });\n        }\n      });\n    });\n  }\n\n  document.addEventListener(\"\
    DOMContentLoaded\", initialize);\n} ()\n```"
