  md: "From the perspective of a user, an app should behave in the same way regardless\
    \ of whether the app was suspended or terminated. You expect the app to be in\
    \ the same state when you switch back to it—even if you don't switch back to the\
    \ app for many hours. For example, if the user was reading a news story, the same\
    \ story should be selected when the user switches back to the app.\n\n# Detecting\
    \ When an App Is Suspended and Terminated\n\nYou can detect when an app is suspended\
    \ by handling the WinJS.Application checkpoint event. You should use this to save\
    \ the state of your app so you can reload the state when your app starts.\n\n\
    There is no method within a Windows Store app to detect when an app is terminated.\
    \ In particular, there is no app terminated event. For this reason, if you need\
    \ to save the state of your app so the state can be reloaded after termination,\
    \ then you should save your app during the checkpoint event.\n\nHere's some sample\
    \ code for handling this event:\n\n```\nWinJS.Application.addEventListener(\"\
    checkpoint\", function () {\n  // Save app state\n}\n```\n\n> Creating an app\
    \ terminated event would not make sense because Windows would need to wake your\
    \ up from a suspended state to raise the event. It would not make sense for Windows\
    \ to wake your app at the very moment that it detects memory resources have gotten\
    \ low.\n\n# Detecting the Previous Execution State\n\nWhen a Windows Store app\
    \ is activated, you use the previousExecutionState property to determine whether\
    \ the app is being launched, whether it was previously closed by the user, or\
    \ whether it is coming back after being suspended and terminated.\n\nDepending\
    \ on the value of previousExecutionState, you might want to load default values\
    \ or load the previous app state. For example, if you are creating a news app,\
    \ then you probably want to load the previous article that the user was reading.\
