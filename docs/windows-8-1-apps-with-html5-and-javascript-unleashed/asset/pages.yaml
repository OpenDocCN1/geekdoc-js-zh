  md: '# About the Author


    Formerly a Senior Program Manager at Microsoft, Stephen Walther now runs his own
    consulting and training company www.SuperexTraining.com. He flies to companies
    and provides hands-on training on building Windows Store apps.


    Stephen was completing his Ph.D. at MIT and teaching classes on metaphysics at
    MIT and Harvard when he abruptly realized there is no money in metaphysics. He
    dropped out to help found two successful Internet startups. He created the Collegescape
    website, a website used by more than 200 colleges, including Stanford, Harvard,
    and MIT, for online college applications (sold to ETS). He also was a founder
    of CityAuction, which was one of the first and largest auction websites (sold
    to CitySearch).'
