  md: '# CHAPTER 4


    # Using WinJS Controls


    My goal in this chapter is to provide you with an over-view of the controls included
    in the WinJS library. I start by explaining how you can add controls to your pages.
    You learn how to create WinJS controls both declaratively and imperatively and
    set control options.


    The bulk of this chapter is devoted to descriptions and samples of how you can
    use the basic controls included in the WinJS library. In this chapter, I focus
    on describing how you can use the following controls:


    +   - Tooltip—Used to display a pop-up tooltip

    - ToggleSwitch—Used to display a toggle switch that can be used in the same scenarios
    as a checkbox

    - Rating—Used to display and enter a user rating

    - DatePicker—Used to enter a date

    - TimePicker—Used to enter a time

    - Hub—Used to display multiple sections of content

    - WebView—Used to display an external web page in your app


    # Introduction to WinJS Controls


    You declare a WinJS control in a page by using the data-win-control attribute.
    For example, you can declare the WinJS DatePicker control by adding the following
    DIV element to a page:


    ```

    <div id="dateBirthday" data-win-control="WinJS.UI.DatePicker"></div>

    ```'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# CHAPTER 4 Using WinJS Controls


    The DIV element isn''t really doing anything. It is just acting as a placeholder
    for the control. It is a "host" for the DatePicker control. The data-win-control
    attribute is used to indicate the type of control that will be associated with
    the element.


    A WinJS control does not actually become a control until you call the WinJS.process()
    method. This method parses an HTML document, identifies any and all elements that
    include a data-win-control attribute, and generates a control for those elements.


    There is one other important requirement for WinJS controls: you must include
    references to the right JavaScript and Cascading Style Sheet files. In order to
    use any of the controls, you must add the following references to the top of your
    HTML page:


    ```

    <link href="//Microsoft.WinJS.2.0/css/ui-dark.css" rel="stylesheet" />

    <script src="//Microsoft.WinJS.2.0/js/base.js"></script>

    <script src="//Microsoft.WinJS.2.0/js/ui.js"></script>

    ```


    The first reference is a reference to a Cascading Style Sheet file named ui-dark.css.
    The WinJS library includes two sheets: ui-dark.css and ui-light.css. If you substitute
    the ui-light.css reference for the ui-dark.css reference, then you can use a light
    theme for all of your controls.


    Figure 4.1 illustrates the appearance of the DatePicker control when the dark
    theme is used, and Figure 4.2 illustrates the appearance of the DatePicker control
    when the light theme is used.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_129_0.png)


    FIGURE 4.1 Using the dark theme'
