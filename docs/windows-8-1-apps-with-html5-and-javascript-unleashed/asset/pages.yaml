    # Entering Email Addresses, URLs, Telephone Numbers, and Search Terms


    You can use the input types email, url, tel, and search to enable users to enter
    email addresses, URLs, telephone numbers, and search terms.


    If you use `<input type="email" />`, and you are using the touch keyboard, then
    you get the specialized keyboard which includes `@` and .com keys in Figure 5.9.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_175_1.png)


    FIGURE 5.9 Touch keyboard for email


    <input type="email" />` also gives you automatic validation. You must enter a
    valid email address or you get the validation error message in Figure 5.10.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_175_2.png)


    FIGURE 5.10 Validation for email


    <input type="url" />` creates a special input field for entering URLs. You get
    the touch keyboard in Figure 5.11 which includes special / and .com keys.'
