  md: '# CHAPTER 3 Observables, Bindings, and Templates


    There is nothing special about the product object in Listing 3.6—it is just a
    plain JavaScript object.


    Notice the call to WinJS.Binding.processAll() in Listing 3.6. The declarative
    data binding attributes in a page are not processed until you call this method.
    When you call the WinJS.Binding.processAll() method, you must specify two parameters:
    the root element and the data context.


    The root element determines which elements in a page get processed. If you pass
    the value null, then the entire document is parsed.


    The data context contains the data that you want to bind to the HTML attributes.
    In Listing 3.6, the product object is passed to the WinJS.Binding.processAll()
    method as the data context.


    # WARNING


    Don''t call WinJS.Binding.processAll() until the document containing the HTML
    elements has been loaded. Otherwise, there is nothing to process. In Listing 3.6,
    the WinJS.Binding.processAll() method is called within a function triggered by
    the DOMContentLoaded event.


    # ## Declarative Data Binding and Observables


    Declarative data binding and observables are a powerful combination. If you use
    observables with data binding then you can update the contents of an HTML document
    automatically whenever you change the underlying JavaScript objects.


    For example, the HTML page in Listing 3.7 contains a SPAN and a BUTTON element.
    The page displays the number of times the button has been clicked (see Figure
    3.6).


