  md: '# Installing the Live SDK


    Before you use the Live Connect API, you need to download the latest version of
    the Live SDK for Windows, Windows Phone, and .NET from the Microsoft website.
    You can download the SDK from the Dev Center for Windows Store apps at http://msdn.microsoft.com/en-us/windows/apps/


    # Adding a Reference to the Live SDK


    After you download the Live SDK, you need to add a reference to the Live SDK JavaScript
    library to your Visual Studio Windows Store app project. Select the menu option
    Project, Add Reference. After picking Windows, Extensions, check the checkbox
    next to Live SDK (see Figure 14.1).


    > > WARNING\After downloading the Live SDK, you need to stop and start Visual
    Studio for the Live SDK to appear in the Reference Manager.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_403_0.png)


    FIGURE 14.1 Adding a reference to the Live SDK JavaScript library


    Next, expand your References, Live SDK, JS folder and drag the wl.js file onto
    your default. html page. You will add the following JavaScript reference:


    ```

    <script src="LiveSDKHTML/js/wl.js"></script>

    ```'
  merge: -1
  pgno: 403
