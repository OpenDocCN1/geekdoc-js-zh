  md: '# CHAPTER 1


    # Building Windows

    Store Apps


    In this chapter, I introduce you to the basics of build-

    ing Windows Store apps. I start off by explaining how a

    Windows Store app differs from a traditional Windows

    desktop app. You learn what makes a Windows

    Store app a fearless Windows Store app.


    Feeling fearless and bold, and hoping that you too feel fear-

    less and bold, I next guide you through building your

    Windows Store app. You learn how to take advantage of

    the features of Microsoft Visual Studio 2013 to build, run,

    and debug a Windows Store app.


    Next, we dive into a discussion of the fundamental

    elements of a Windows Store app. You learn how a

    Windows Store app is forged out of HTML5, JavaScript,

    The Windows Library for JavaScript, and the Windows

    Runtime.


    Finally, we get to the money part. I explain how you can

    publish your Windows Store app to the Windows Store and

    start collecting those dollars.


    # What Is a Windows Store App?


    I can still remember the first time that I used an iPhone.

    When you scroll the screen on an iPhone, the screen actu-

    ally bounces! And when you add an email to the trash, the

