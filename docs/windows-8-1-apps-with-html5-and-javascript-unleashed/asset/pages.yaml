  md: "```\n<input type=\"submit\" />\n</div>\n</form>\n```\n\nThe following JavaScript\
    \ code demonstrates how you can display a validation error message when the user\
    \ name is short:\n\n```\nvar userName = document.getElementById(\"userName\");\n\
    \nuserName.addEventListener(\"input\", function (evt) {\n  User name must be more\
    \ than 3 characters\n  if (userName.value.length < 4) {\n    userName.setCustomValidity(\"\
    User name too short!\");\n  } else {\n    userName.setCustomValidity(\"\");\n\
    \  }\n});\n```\n\nIn the preceding code, an event listener for the input event\
    \ is created. When the value of the input element is changed then the length of\
    \ the value is checked. If the username is less than four characters the setCustomValidity()\
    \ method is used to invalidate the input element. Otherwise, the setCustomValidity()\
    \ method is called with an empty string to clear any previous validation errors\
    \ associated with the username element.\n\n> NOTE The input event is raised as\
    \ soon as the contents of an input element are changed. The input event differs\
    \ from the change event because the change event is not raised until after the\
    \ input element loses focus.\n\nYou must submit the form to see the validation\
    \ error message. After you submit the form, you see the error in Figure 5.3.\n\
    \n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_167_0.png)\n\nFIGURE 5.3 Using custom\
    \ validation\n\n# Customizing the Validation Error Style\n\nBy default, invalid\
    \ HTML fields in a form appear with a red border. For example, if you submit an\
    \ HTML form without entering a value in a required field then the field is displayed\
    \ with a red border."
