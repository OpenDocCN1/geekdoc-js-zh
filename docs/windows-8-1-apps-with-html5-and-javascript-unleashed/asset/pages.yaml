- img_proc: true
  md: "```\n<progress id=\"progress1\"\nmax=\"20\"\nvalue=\"1\">\n</progress>\n```\n\
    \nAnd, here is JavaScript code which updates the progress every 1 second:\n\n\
    ```\nfunction () {\n  \"use strict\";\n\n  function initialize() {\n    var progress1\
    \ = document.getElementById(\"progress1\");\n    var ivProgress = window.setInterval(updateProgress,\
    \ 1000);\n\n    function updateProgress() {\n      progress1.value = ++progress1.value;\n\
    \      if (progress1.value == 20) {\n        window.clearInterval(ivProgress);\n\
    \      }\n    }\n  }\n  document.addEventListener(\"DOMContentLoaded\", initialize);\n\
    }()();\n```\n\nDeclaring a progress element in this way gives you a traditional\
    \ progress bar (Figure 5.18).\n\n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_181_0.png)\n\
    \nFIGURE 5.18 Displaying determinate progress\n\nThere are some style options\
