    \ current game score goes up by 1.\n- **checkpoint**—Called when the app is suspended.\
    \ This event handler stores the current game score in session state.\n- **activated**—Called\
    \ when the app is activated. If the app is activated after termination then the\
    \ current game score is loaded from session state. Otherwise, a default value\
    \ for the game score is assigned.\n\nSession state is only loaded when an app\
    \ is activated after termination. Session state is not preserved, for example,\
    \ when a user explicitly closes an app or reboots her machine."
