  md: '# 16 CHAPTER 1 Building Windows Store Apps


    When your app does something scary, you must declare that your app will do this
    scary thing up front so the user can consent. You declare the capabilities of
    your app in your application manifest file. You can open the editor for your application
    manifest by double-clicking the package.appxmanifest file in the Solution Explorer
    window.


    Click the Capabilities tab to view all of the declared capabilities of your application.
    For example, if you want your app to be able to record from the computer microphone
    then you need to select the Microphone capability, or if you want your app to
