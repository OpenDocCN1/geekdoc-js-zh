  md: '# # Windows 8.1 Apps with HTML5 and JavaScript UNLEASHED


    Take advantage of your existing JavaScript and HTML skills to build apps for Windows
    8.1 and add them to the Windows Store. It''s a remarkable opportunity—and best-selling
    Microsoft web developer author Stephen Walter will show you how to take full advantage
    of it.


    Offering the same deep insight and practical code that has made his ASP.NET Unleashed
    the #1 ASP.NET book of all time, Walter covers everything you need to build outstanding
    Windows apps with JavaScript and HTML5.


    He guides you through using Microsoft''s WinJS 2.0 library to develop apps for
    Windows 8.1—learn how to use JavaScript templates, controls, and data binding.
    With ListControl to supporting SkyDrive cloud storage, creating games using IndexedDB
    and HTML5 forms.


    Extensively updated for the release of Windows 8.1, this book covers all of the
    new features of the WinJS 2.0 library such as the Repeater, Search, WebView, and
    Navbar and the new WinJS Scheduler. This book has been updated with a new sample
    app that demonstrates how to build a Windows Store app that interacts with Windows
    Azure Mobile Services.


    If you''re a developer, Windows 8 gives you millions of potential customers to
    buy your apps—and you already have the skills you''ll need to reach them. Get
    this book, master the tools and techniques you don''t already know—and get that
    new future you have imagined!


    # Detailed information on how to...


    +   - Get your app published in the Windows Store

    - Use JavaScript controls such as the Tooltip, Rating, DatePicker, and FlipView
    controls

    - Thorough master using the WinJS ListControl to display, sort, and filter data

    - Use new controls introduced with Windows 8.1 as the Repeater, NavBar, and SearchBox
    controls

    - Implement Windows Search and Share counts

    - Use HTML5 Canvas to build arcade games

    - Store data on the local file system, via Azure Mobile Services or in IndexedDB
    databases

    - Use Live Services to authenticate users, retrieve user profiles, and interact
    with SkyDrive

    - Create custom WinJS controls with Page Controls

    - Build apps that gracefully adapt to different resolutions and orientations

    - Take pictures from your computer''s webcam and play sounds


    Stephen Walter, former Program Manager on the ASP.NET team, was responsible for
    managing the Ajax Library and worked closely with the jQuery team. He knows Superexpert,
    a software consulting and training company that builds applications with JavaScript,
    HTML5, and ASP.NET MVC for clients such as Microsoft.


