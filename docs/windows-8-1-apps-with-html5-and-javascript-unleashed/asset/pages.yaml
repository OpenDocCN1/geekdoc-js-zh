  md: "You can use Ctrl-B to make the text bold, Ctrl-I to make the text italic, and\
    \ Ctrl-U to make the text underlined.\n\nNotice that the DIV element with the\
    \ contenteditable attribute has two CSS classes applied to it named win-textarea\
    \ and richtext. The win-textarea class is included as part of the WinJS library\
    \ and this class applies the standard Windows Store app styles to the editor.\n\
    \nThe richtext class is defined like this:\n\n```\n.richtext {\n  width:300px;\n\
    \  height:100px;\n  white-space:pre-wrap;\n}\n```\n\nThe HTML5 recommendation\
    \ recommends that you should always use white-space:pre-wrap with a contenteditable\
    \ DIV element, and who am I to question the wisdom of the editors of the HTML5\
    \ recommendation? For this reason, I always use white-space:pre-wrap with a contenteditable\
    \ DIV.\n\n# Displaying Progress\n\nThe HTML5 recommendation includes a new element—named\
    \ the progress element—that enables you to display a progress indicator. There\
    \ are two basic types of progress indicators—an indeterminate and a determinate\
    \ progress indicator.\n\nYou use an indeterminate progress indicator when you\
    \ want to show a busy wait indicator, and you do not know how longer a task will\
    \ take. Here's how you use an indeterminate progress indicator:\n\n```\n<progress\
    \ id=\"progress1\"></progress>\n```\n\nIn a Windows Store app, the default progress\
    \ indicator displays a set of animated dots moving horizontally (see Figure 5.17).\n\
    \n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_180_0.png)\n\nFIGURE 5.17 Displaying\
    \ indeterminate progress\n\nIf you want to display a determinate progress indicator\
    \ then you need to supply values for the progress element's max and value attributes.\
    \ For example, here's how you would create a progress indicator that shows progress\
    \ between the values 0 and 100:"
  merge: -1
