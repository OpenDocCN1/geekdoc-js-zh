  md: "# CHAPTER 6 Menus and Flyouts\n\nbutton in the app bar. Displaying a Delete\
    \ or Edit button, on the other hand, makes sense only when an item is selected.\n\
    \nThe app bar has two built-in sections named \"global\" and \"selection\". By\
    \ default, when you add commands to the app bar, the commands appear in the global\
    \ section. These commands appear on the right-hand side of the app bar.\n\nYou\
    \ also have the option of adding commands to the selection section. These commands\
    \ appear on the left-hand side of the app bar. Commands in the selection section\
    \ should appear only when something is selected.\n\nImagine that you want to display\
    \ a list of tasks by using a ListView control. You want users to be able to add\
    \ new tasks and delete existing tasks. In that case, it makes sense to place the\
    \ Add button in the app bar global section and the Delete button in the app bar\
    \ selection section (see Figure 6.8).\n\n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_197_0.png)\n\
    \nFIGURE 6.8 Global versus selection app sections\n\nHere's how you can declare\
    \ your app bar so it contains Add and Delete commands:\n\n```\n<div id=\"appBar\"\
    >\n  <button data-win-control=\"WinJS.UI.AppBar\" data-win-options=\"{sticky:true}>\n\
    \    data-win-control=\"WinJS.UI.AppBarCommand\"\n    data-win-options=\"{\n \
    \     id:'cmdAdd',\n      label:'Add',\n      icon:'add',\n      tooltip:'Add\
    \ Task'\n    }\">\n```"
