  md: '# Creating Your First Windows Store App


    Currently, every Windows Store app gets 100KB of roaming application data. Windows
    8.1 handles synchronizing this data between different machines for you automatically.


    # Closing a Windows Store App


    Now ever close a Windows Store app by moving your cursor over the x at the top-right
    of the screen. Ha! Tricked you! There is no close button in a Windows Store app
    because there is no chrome.


    > NOTE

    Even though it is not obvious how to close a Windows Store app it is possible.
    You can close a Windows Store app by swiping down from the top of the screen or
    pressing the keyboard combination Alt+F4.


    When interacting with Windows Store apps, there is no obvious way to close an
    app. This is intentional. Instead of closing a Windows Store app, you are encouraged
    to simply switch to another running app (by swiping from the left edge of the
    screen) or launch a new app (by selecting a new app from the Start screen).


    When you design a Windows Store app, you must design the app with the knowledge
    that a user might switch back and forth to your running app at any time. In Chapter
    11 I discuss how you can gracefully resume an app after it has been suspended.


    # Creating Your First Windows Store App


    Let''s be fearless. In this section, I guide you through building your first Windows
    Store app. Doing a Hello World app would be predictable and boring. Therefore,
    I suggest that you do something a little more advanced.


    I''ll show you how you can create an app which enables you to take pictures. When
    you click the Take Picture command in the app bar, you can take a picture, and
    then the picture is displayed in the app (see Figure 1.6, which shows a picture
    of my dog Rover).


    > NOTE

    The code for the completed app can be found in the Chapter 1 folder with the name
    App1. All of the code for this book is located in a GitHub repository at https://github.com/StephenWalther/Windows8.1AppsUnleased.'
