    # Setting Job Priorities


    You can specify a job priority by using the WinJS.Utilities.Scheduler.Priority
    enumeration, or you can specify a number value between -15 and 15. You can use
    any of the following values:


    +   * min (-15)

    * Idle (-13)

    * belowNormal (-9)

    * normal (0)

    * aboveNormal (9)

    * high (13)

    * max (15)


    Keep in mind that priorities are all relative. Scheduling all of your jobs to
    run at the highest priority won''t make your app perform any faster. Instead,
    you should use the different priorities to schedule the order of execution of
    your code.


    The standard WinJS controls—such as the ListView and Flip—use the Scheduler with
    the same priorities. You can use the Scheduler to prioritize your app code relative
    to WinJS control code.


    # Yielding to a Higher Priority Job


    Imagine your app performs a long-running but low-priority job. For example, that
    your app displays a constantly inspirational quotation.


    If a higher priority job comes along, you might want to yield the low-priority
    job to the higher priority job. For example, if a user clicks a button then you
    want to respond to the user interaction immediately. You don''t want to get blocked
    by the lower priority job.'
