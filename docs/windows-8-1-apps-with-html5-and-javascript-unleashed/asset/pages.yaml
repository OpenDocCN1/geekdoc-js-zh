  md: '# CHAPTER 16


    # Creating a Task List App


    In this final chapter, I walk through creating a productivity app. I demonstrate
    how you can create a basic tasks list app named MyTasks.


    My goal in this chapter is to tackle a more complete app: an app that can be submitted
    to the Windows Store, an app that includes robust error handling and all of the
    features that are required by a real-world app.


    This app weaves together several of the technologies discussed in earlier chapters
    of this book:


    +   - The MyTasks app uses Live Connect zero-click single sign-on to authenticate
    users. I discussed Live Connect authentication in Chapter 14, "Using the Live
    Connect API."


    +   - The MyTasks uses Windows Azure Mobile Services to save tasks to the cloud
    so the tasks can be accessed from multiple computers and devices. I discussed
    Azure Mobile Services in Chapter 10, "Using Windows Azure Mobile Services."


    +   - The MyTasks app adapts to different screen widths automatically using CSS
    Media Queries and JavaScript. I discussed how you can build apps that adapt to
    different view states in Chapter 11, "App Events and States."


    +   - The MyTasks app uses a ListView control to display the lists of tasks. I
    discussed the ListView control in detail in Chapter 8, "Using the ListView Control."


    +   - The MyTasks app uses a Binding Converter to display completed tasks with
    a line-through them. I discussed Binding Converters in Chapter 3, "Observables,
    Bindings, and Templates."


    # IN THIS CHAPTER


    +   - Overview of the App


    +   - Setting Up The App


    +   - Connecting To Azure Services


    +   - Dynamic Events, Properties, and Delegates


    +   - Adapting to Screen Changes


    +   - Creating a Custom Control


    +   - Using Text To Speech'
  merge: -1
  pgno: 446
- img_proc: true
  md: 'The MyTasks app uses an AppBar to display application commands for deleting
    a task, marking a task as complete, and creating a new task. I discussed the AppBar
    control in Chapter 6, "Menus and Flyouts."


    The MyTasks app uses a NavBar to display a navigation menu that enables you to
    navigate to different days of the week. I discussed the NavBar control in Chapter
    6.


    The MyTasks app includes a custom setting that displays a Privacy Policy. I discussed
    creating custom settings in Chapter 6.


    When building the MyTasks app, I also took advantage of a new API introduced in
    Windows 8.1. The MyTasks app uses the Windows 8.1 Text-To-Speech SpeechSynthesizer
    class to read tasks out loud. You know, like the computer voice in Star Trek.


    > NOTE

    I submitted the MyTasks app to the Windows Store. If you would like to play with
    the MyTasks app while reading this chapter then you can install the app from the
    Windows Store.


    # Overview of the App


    The MyTasks app is a basic list application. It enables you to create new tasks,
    mark tasks as complete, and delete existing tasks.


    When you first open the MyTasks app, you see a list of tasks for the current date.
    If you right-click the screen then you can see both the app bar and the nav bar
    (see Figure 16.1).


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_447_0.png)


    FIGURE 16.1 The MyTasks app'
  merge: -1
