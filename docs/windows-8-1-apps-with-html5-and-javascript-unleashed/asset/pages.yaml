  md: '# CHAPTER 9


    # Creating Data Sources


    +   IN THIS CHAPTER

    * Creating Custom Data Sources

    * Creating a File Data Source

    * Creating a Web Service Data Source

    * Creating an IndexedDB Data Source


    The WinJS library includes two objects that you can use as data sources—the List
    and the StorageDataSource objects. If you need to use a ListView or FlipView with
    other types of data then you will need to write a custom data source.


    The goal of this chapter is to explain how you can create custom data sources.
    In this chapter, I explain how you can create three custom data sources:


    +   * DataSource—The file data source stores data on the local file system.

    * WebWebService—The web service data source enables you to use a remote web service
    to retrieve and store data

    * IndexedDBData—The IndexedDB data source enables you to retrieve and store data
    using IndexedDB database.


    The full source of these data sources are contained in the GitHub project for
    this book (https://github.com/StephenWalther/Windows8.1AppsUnleashed).


    # Creating Custom Data Sources


    Let me start by giving you an overview of how you can create a custom data source.
    In this section, I''ll explain how you can implement the methods of a custom data
    source that uses a JavaScript array to store data. I''ll walk through creating
    the constructor for this data source as well as the most important methods for
    this data source. After discussing this (only simple) data source in this section,
    we''ll dive into more practical data sources in later sections, such as the Web
    service data source and IndexedDB data source.'
