  md: "# Using the ItemContainer Control 201\n\n# NOTE\n\nHTML5 enables you to add\
    \ a data-* attribute to any element. You can use data-* attributes to associate\
    \ custom information with an HTML element.\n\nI can detect when an ItemContainer\
    \ is clicked by handling the invoked event like I do in Listing 7.2.\n\n# LISTING\
    \ 7.2 Invoking an ItemContainer (itemContainerInvoked\\itemContainerInvoked)\n\
    \n```\nfunction () {\n  \"use strict\";\n\n  function initialize() {\n    var\
    \ options = WinJS.Utilities.query(\".option\");\n\n    WinJS.UI.processAll().done(function\
    \ () {\n      options.listen(\"invoked\", function (e) {\n        var md = new\
    \ Windows.UI.Popups.MessageDialog(e.target.dataset[\"option\"]);\n        md.showAsync();\n\
    \      });\n    });\n  }\n\n  document.addEventListener(\"DOMContentLoaded\",\
    \ initialize);\n}();\n```\n\nWhen you click any of the ItemContainers then a dialog\
    \ pops up the identity of the selected option (see Figure 7.2). The identity of\
    \ the clicked option is retrieved from the ItemContainer data-option attribute.\
    \ The value of the data-option attribute is represented by the element's dataset[\"\
    option\"] property. (If you added a data-something attribute then you would get\
    \ the value of this attribute with dataset[\"something\"])."
