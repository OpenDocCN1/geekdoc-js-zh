  md: '# Windows Runtime


    The Windows Runtime (WinRT) contains a class library that you can use in your
    Windows Store apps. These classes are projected directly into JavaScript, so they
    appear to be built-in JavaScript objects.


    For example, when we wrote our first Windows Store app, we took advantage of the
    WinRT Windows.Media.Capture.CameraCaptureUI class. When we called the CameraCaptureUI.captureTakePicture()
    method, we were able to take a picture.


    All of the WinRT classes are exposed in JavaScript from the WinRT namespace. For
    example, you create an instance of the CameraCaptureUI class with the following
    code:


    ```

    var captureUI = new Windows.Media.Capture.CameraCaptureUI();

    ```


    NOTE


    Note that WinRT class names can get silly long. For this reason, it is a good
    idea to alias the namespaces like this:


    ```

    var capture = Windows.Media.Capture;

    ```


    The WinRT classes extend JavaScript with all of the functionality that you need
    when building a Windows application. These classes enable you to do fun and amazing
    things such as:


    +   Geolocation—Use the WinRT Windows.Devices.Geolocation.Geolocator class to
    get your current latitude and longitude.


    +   File Access—Read and write to the file system by taking advantage of the WinRT
    classes in the Windows.Storage.namespace.


    +   Compass—Always know the direction of True North with the Windows.Devices.Sensors.Compass
    class.


    +   Print–Print from your Windows Store app by using the Windows.Printing.Manager
    class.


    +   Compress Files—Compress and decompress files using the classes in the WinRT
    Windows.Storage.Compression namespace.


    # Windows Library for JavaScript


    The Windows Library for JavaScript (WinJS) is a pure JavaScript library created
    by Microsoft specifically for building Windows Store apps. Understanding how to
    use this library is the primary focus of this book.'
  merge: -1
