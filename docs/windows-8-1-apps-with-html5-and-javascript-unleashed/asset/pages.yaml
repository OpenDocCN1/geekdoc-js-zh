  md: '# Summary


    The chapter was all about flyouts, menus, settings, toolbars, and dialogs. I started
    by discussing how you can use the Flyout control to make simple ephemeral popups
    which can contain any HTML content at all.


    Next, I explained how you can use the Menu control to display menu commands. You
    learned how to include buttons, flyouts, toggles, and separators in a menu.


    I also discussed the app bar and nav bar. You learned how the app bar is the standard
    location in a Windows Store app for placing commands, and the nav bar is the standard
    location in a Windows Store app for placing navigation links.


    You also learned how to take advantage of the SettingsFlyout control to extend
    the settings displayed in your Windows Store app''s Settings window. You learned
    how to store and retrieve settings from roaming settings.


    Finally, I showed you how you can create modal dialogs by taking advantage of
    the MessageDialog class. We created warning dialogs and Yes/No dialogs.


    Stay tuned. In the next chapter, we jump into a discussion of how you can display
    collections of data in your app.'
