  md: '# CHAPTER 4 Using WinJS Controls


    Imagine, for example, that you want to create a hybrid Windows Store app and website.
    You might want to implement your actual app using WinJS controls but host all
    of the help documentation for your app as web pages on a public website. In that
    case, you could use the WebView control to display your help documentation from
    the Internet.


    Or, you might want to build an app that interacts with web pages hosted on the
    Internet. For example, you might want to build a Research app that allows you
    to take clippings or extract images from existing web pages hosted on the Internet.
    Again, the WebView control enables you to do this.


    In this section, I explain how you can embed a WebView control in your Windows
    Store app and handle navigation events. I also demonstrate how you can capture
    screenshots from the pages hosted in the WebView.


    > NOTE


    What about Irames? There is already a standard technology to host one web page
    within another page, so why did Microsoft not reinvent the wheel?


    Unfortunately, Irames have several limitations. Many websites are designed to
    bust out of Irames using scripts or reject Irames using the X-Frame-Options header
    (for example, Google.com). Also, Irames do not support the navigation and capture
    application programming interfaces (APIs) that I discuss in the following sections.
    In general, you should use the WebView control instead of Irames.


    # Hosting a Page from the Internet with the WebView Control


    You declare a WebView control in a page in a different way than the other standard
    WinJS controls. Instead of using a data-win-control attribute, you declare a WebView
    control like this:


    ```

    <x-ms-webview src="http://superexpertTraining.com" width="800" height="500"></x-ms-webview>

    ```


    This WebView control displays the home page from SuperexpertTraining.com in the
    Windows Store app (see Figure 4.24). Furthermore, the control displays the external
    content in an 800px by 500px area.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Embedded Website using WebView


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_156_0.png)


    FIGURE 4.24 Displaying a web page with the WebView control


    Be aware that if the page loaded into the WebView control contains JavaScript
    then the JavaScript might throw an error. Your app will display a dialog like
    the one in Figure 4.25.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_156_1.png)


    FIGURE 4.25 WebView control JavaScript error


    Getting these errors is expected and your users won''t see these errors when your
    app is deployed. If you don''t want to see these JavaScript errors when running
    your app in Visual Studio then you can run your app outside the debugger by selecting
    the Visual Studio menu option Debug, Start Without Debugging.'
