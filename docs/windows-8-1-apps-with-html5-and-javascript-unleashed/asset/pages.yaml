  md: '# Setting Permissions for Your Mobile Service


    Next, I want to restrict access to my Mobile Service for the Tasks table so that
    only authenticated users can insert, update, delete, and read the tasks from the
    table. You can set Mobile Service permissions from within Visual Studio or you
    can set the permissions from the Windows Azure Management Portal (purely a matter
    of preference).


    Here are the steps for setting permissions for the Tasks table within Visual Studio:


    +   1. Open the Server Explorer window by selecting the menu option View, Server
    Explorer.

    2. Expand Windows Azure Mobile Services, expand the Mobile Service, and right-click
    the Tasks table and select the menu option Edit Permissions (see Figure 14.12).

    3. Enable only Authenticated Users to insert, update, delete, and read.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_417_0.png)


