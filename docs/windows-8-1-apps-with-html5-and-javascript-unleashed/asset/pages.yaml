    </body>\n</html>\n```\n\nThe text On Sale: does not appear after the first product,\
    \ but it does appear after the second product. The text is displayed with the\
    \ following DIV element:\n\n```\n<div data-win-bind=\"style.display:product2.onSale\
    \ MyBindingConverters-onSaleToDisplay\">\n  <b>On Sale!</b>\n</div>\n```\n\nThe\
    \ binding converter is applied to the DIV element's style attribute. When the\
    \ binding converter returns the value \"none\" then the contents of the DIV element\
    \ are hidden with display:none. Otherwise, the binding converter returns the value\
    \ \"block\" and the contents of the DIV element are displayed with display:block.\n\
    \nThe binding converter appears in the value of the data-win-bind expression.\
    \ In this case, the binding converter is a function named MyBindingConverters.onSaleToDisplay.\
    \ This binding converter converts a Boolean into the value \"none\" or \"block\"\
    .\n\nThe binding converter is contained in a separate file—referenced by the HTML\
    \ page—named MyBindingConverters.js (see Listing 3.14). You do not need to create\
    \ the binding converter in a separate file, but it makes easier to reuse the binding\
    \ converter with multiple pages."
