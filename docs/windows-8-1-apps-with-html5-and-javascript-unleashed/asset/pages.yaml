  md: '142 CHAPTER 4 Using WinJS Controls


    # WARNING


    Clicking a link with a target attribute in the WebView control will cause the
    page to open outside of your app and in your default browser. This can be surprising
    to a user.


    # WARNING


    The WebView control uses the Internet Explorer SmartScreen Filter to prevent phishing
    attacks. If you open a web page that SmartScreen finds suspicious then you get
    a pop-up warning message. You can test this feature by using the WebView control
    to open the page at advertising.info (this page was created by Microsoft to test
    SmartScreen).


    # Handling Navigation and Navigation Events


    You can use the methods exposed by the WebView control to handle navigation. For
    example, you can use the following three methods to display a web page:


    +   * navigate()—Displays a HTML page represented by a URL

    * navigateToString()—Displays an HTML page from an HTML string

    * NavigateToLocalStringUri—Displays a local HTML page represented by a URL


    The WebView control also exposes several useful events including


    +   * MSWebViewNavigationStarting—Raised when a user starts navigating to a new
    URI

    * MSWebViewContentLoading—Raised when new content is being loaded

    * MSWebViewNavigationCompleted—Raised when navigation is finished


    You can use the WebViewNavigationStarting event to prevent a user from navigating
    somewhere where you don''t want the user to go. For example, you might want to
    prevent a user from following links away from your website.


    The page in Listing 4.16 contains a WebView control that displays the Minecraft
    entry on Wikipedia.org. You can click links in the page to navigate to other pages
    at Wikipedia.org but you cannot navigate away from Wikipedia.org to another website
    (see Figure 4.26).'
