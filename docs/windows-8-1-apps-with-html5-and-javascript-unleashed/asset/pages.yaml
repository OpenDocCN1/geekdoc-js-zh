  md: 'win—If you eat all of the food pellets then you win the game and you are navigated
    to the win page.


    The home, lose, and win pages are boring—they are simple HTML pages that link
    to the play page (see Figure 15.2). The play page is where the game is actually
    played.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_434_0.png)


    FIGURE 15.2 The Brain Eaters home page


    Almost all of the code for the game is included in a JavaScript file named game.js,
    which contains the JavaScript game class. This class contains the code for starting
    the game, stopping the game, updating the positions of the zombies, and rendering
    the game.


    # Creating the Game Tiles


    The Brain Eaters game is rendered out of a set of image tiles. An image tile is
    simply a 50px by 50px image. The game board is rendered from background and wall
    tiles. The game also includes tiles for the zombies, player, and food.


    All of the game tiles are created in a JavaScript file named tiles.js (see Listing
    15.1).'
