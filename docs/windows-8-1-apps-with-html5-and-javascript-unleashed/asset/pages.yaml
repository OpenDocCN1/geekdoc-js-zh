    # Debugging a Windows Store App


    I''m always optimistic and believe that any code I will write run without error
    the first time that I write it. To, that has never happened. I spend a significant
    amount of my time debugging code that does not do what I want it to.


    In this section, I discuss the tools in Visual Studio that you can use to debug
    your code. I discuss how you can use the JavaScript Console window, breakpoints,
    and use the DOM Explorer.


    # Using the Visual Studio JavaScript Console Window


    When I write JavaScript code for pages used in websites, I use the JavaScript
    console window to view JavaScript errors. I also write custom messages to the
    console window using `console.log()` so I can debug my code. (See Figure 1.25).


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_48_0.png)


    FIGURE 1.25 Debugging with the Google Chrome JavaScript console


    When running a Windows Store app, you don''t have access to the browser JavaScript
    console. Instead of using the browser JavaScript console, you need to use the
    Visual Studio JavaScript Console (see Figure 1.26).'
  merge: -1
  pgno: 48
