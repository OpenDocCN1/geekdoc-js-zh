  md: "# # CHAPTER 7\nUsing the ItemContainer, Repeater, and FlipView Controls\n\n\
    The focus of this chapter is on three controls related to working with collections\
    \ of data: the ItemContainer, Repeater, and FlipView controls.\n\nThe ItemContainer\
    \ control enables you to create invokable, selectable, and draggable content—things\
    \ you can interact with. Although the ItemContainer control can be used on its\
    \ own, the ItemContainer control is most often used with the Repeater and ListView\
    \ controls.\n\nThe Repeater control is a very flexible control for displaying\
    \ a collection of data. You can use a Repeater control to display a collection\
    \ of data using any format you want.\n\nFinally, the FlipView control is a useful\
    \ control for displaying one item from a collection of items at a time. You can\
    \ use the FlipView control, for example, to display individual news articles in\
    \ a list of articles.\n\n# Using the ItemContainer Control\n\nLet me start by\
    \ discussing the ItemContainer control. After you wrap content in an ItemContainer\
    \ control, you can invoke, select, or drag-and-drop the content.\n\nHere's a simple\
    \ example. The following markup includes three ItemContainer controls, which represent\
    \ three options labeled Option 1, Option 2, and Option 3:\n\n```\n<div id=\"optionList\"\
    >\n  <div data-win-control=\"WinJS.UI.ItemContainer\">\n    Option 1\n  </div>\n\
    </div>\n```"
  merge: -1
  pgno: 212
- img_proc: true
  md: "```\n<div data-win-control=\"WinJS.UI.ItemContainer\">\n  Option 2\n</div>\n\
    ```\n\n```\n<div data-win-control=\"WinJS.UI.ItemContainer\">\n  Option 3\n</div>\n\
    ```\n\n```\n</div>\n```\n\nWhen this markup is displayed, you can click an option\
    \ to invoke it (the ItemContainer control works like a button) or you can right-click\
    \ an option to select it. For example, in Figure 7.1, Option 2 and Option 3 are\
    \ selected.\n\n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_213_0.png)\n\nFIGURE 7.1\
    \ Selecting from ItemContainer options\n\n# Styling an ItemContainer\n\nThe ItemContainer\
    \ control does not impose any styling on its content. For example, if you wrap\
    \ a DIV element with an ItemContainer then the DIV element will continue to render\
    \ as a DIV element. The element will work as a block element and expand across\
    \ the entire page.\n\nIf you want to style the content which appears in an ItemContainer\
    \ then you have to work with one or more of the standard Cascading Style Sheet\
    \ classes built into the WinJS library.\n\nThe ItemContainers that appear in Figure\
    \ 7.1 were styled with the following win-* CSS classes:\n\n```\n#optionList .win-item-container\
    \ {\n  width:100px;\n  height:100px;\n  margin:10px;\n  float:left;\n}\n```\n\n\
    ```\n#optionList .win-itembox {\n  background-color: gray;\n```"
