  md: "# CHAPTER 4 Using WinJS Controls\n\n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_145_0.png)\n\
    \nFIGURE 4.14 Formatting the month, day, and year\n\nYou can combine multiple\
    \ format speculators in a single format string. For example, if you want to display\
    \ not only the day of the month but the day of the month and the day of the week,\
    \ and not only the year but the year and the era, then you can declare the DatePicker\
    \ like this:\n\n```\n<div id=\"dateBirthday\"\n    data-win-control=\"WinJS.UI.DatePicker\"\
    \n    data-win-options='{month.integer(2)}-{month.full}',\n    datePattern='{day.integer(2)}\
    \ {dayofweek.abbreviated}',\n    yearPattern='{year.era.abbreviated}'\n</div>\n\
    ```\n\nNotice that the format string for the monthPattern includes a dash (-).\
    \ You can throw in any extra characters that you need within a format string (see\
    \ Figure 4.15).\n\n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_145_1.png)\n\nFIGURE\
    \ 4.15 Combining date format strings\n\n> NOTE\nUnder the covers, the DatePicker\
    \ leverages the WinRT\nWindows.Globalization.DateTimeFormatter to format dates.\
