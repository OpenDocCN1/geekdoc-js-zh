    \        this.drawImage(Unleashed.Tiles.background.image, x, y);\n      }\n  \
    \  }\n  }\n}\n```\n\nThe render() and renderMonsters() methods are very similar;\
    \ both methods loop through an array and render each element in the array to the\
    \ screen. Here's what the renderMonsters() method looks like:\n\n```\nrenderMonsters:\
    \ function () {\n  for (var i = 0; i < this._monsters.length; i++) {\n    var\
    \ monster = this._monsters[i];\n    this.drawImage(monster.tile.image, monster.x,\
    \ monster.y);\n  }\n}\n```"
