    }\n```\n\n# Using the IndexedDB Data Source\n\nThe IndexedDB data source enables\
    \ you to bind a ListView control to a collection of JavaScript objects stored\
    \ in an IndexedDB database. You create an IndexedDB data source by providing three\
    \ arguments:\n\n+   - objectStoreName—The name of the object store to represent\
    \ with the data source.\n- creationOptions—The creationOptions determine how the\
    \ IndexedDB database and object store are created.\n- cursorOptions—optional)\
    \ If you supply cursorOptions then you can filter the objects in the object store\
    \ using a key range.\n\nFor example, here is how you would create an instance\
    \ of the IndexedDB data source that represents a collection of movies:\n\n```\n\
    // Create the data source options\nvar createOptions = {\n  databaseName: \"MoviesDB\"\
    ,\n  databaseVersion: 1,\n  indexNames: [\"category\"]\n};\n\n```\n\n```\n// Create\
    \ the IndexedDB data source\nvar moviesDataSource = new DataSources.IndexedDBDataSource(\"\
    movies\", createOptions);\n```\n\nIn the code, the creationOptions represent the\
    \ properties of an IndexedDB database, object store, and indices. If the database\
    \ does not already exist, then the IndexedDB data source creates the database.\n\
    \nHere are the properties of the creationOption object:\n\n+   - databaseName—The\
    \ name of the IndexedDB database\n- databaseVersion—The version of the IndexedDB\
    \ database\n- indexNames—An index is created for each property name in this array."
