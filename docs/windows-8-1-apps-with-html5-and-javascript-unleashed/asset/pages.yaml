  md: '# Microsoft Design Style Principles


    Now we come to Windows. Except for the dancing card thing in Windows Solitaire,
    I can''t think of anything in Windows that has ever created this sense of fun.
    I can''t remember the last time that Windows made me laugh or brought me joy.


    With Windows Store apps, Microsoft has finally acknowledged user experience matters—in
    a big way. The heart of Windows Store apps is a set of user experience principles
    the Microsoft design style principles. By embracing the Microsoft design style
    principles, you can create Windows Store apps that seem more alive and that are
    a pleasure to use.


    The Microsoft design style principles is a set of user experience design principles
    developed by Microsoft in the construction of building the Windows Phone, Xbox
    Live, and the (now defunct) Zune. You also can see the Microsoft design principles
    applied to Microsoft websites as Microsoft SkyDrive and the Windows Azure Portal.
    Get ready. Here they are:


    +   1. Show pride in craftsmanship

    - Devote time and energy to small things that are seen often by many.

    - Engineer the experience to be complete and polished at every stage.


    +   2. Do more with less

    - Solve for distractions, not discoverability. Let people be immersed in what
    they love and will explore the rest.

    - Create a clean and purposeful experience by leaving only the most relevant elements
    on screen so people can be immersed in the content.


    +   3. Be fast and fluid

    - Let people interact directly with content, and respond to actions quickly with
    matching energy.

    - Bring life to the experience, create a sense of continuity and tell a story
    through meaningful use of motion.


    +   4. Be authentically digital

    - Take full advantage of the digital medium. Remove physical boundaries to create
    experiences that are more efficient and effortless than reality.

    - Embrace the fact that we are pixels on a screen. Design with bold, vibrant and
    crisp colors and images that go beyond the limits of real-world material.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# 5. Win as one


    +   - Leverage the ecosystem and work together with other apps, devices, and the
    system to complete scenarios for people.


    +   - Fit into the UI model to reduce redundancy. Take advantage of what people
    already know to provide a sense of familiarity, control, and confidence.


    > > NOTE

    The Microsoft design style principles were originally known as Metro design principles.
    This list of Microsoft design principles was taken from http://msdn.microsoft.com/en-us/library/windows/apps/hh464920
    and http://msdn.microsoft.com/library/windows/apps/hh465424.aspx.


    When I first read these principles, my initial reaction was that they seemed overly
    abstract and squishy. Exactly the type of principles that would be created by
    beret-wearing user guys.


    But then, when I saw how the principles were applied in practice—when building
    actual Windows Store apps—I started to develop a better appreciation for these
    principles.


    Take the “Do more with less” design principle. One of the distinctive features
    of a Windows Store app is the lack of chrome. Chronically, a Windows Store app
    is a Windows without the window. Windows Store apps are full-screen apps.


    This lack of chrome makes it easier to concentrate on the content of the application.
    For example, Windows 8 includes two version of Internet Explorer: a desktop version
    and a full-threaded Windows 8 version that follows the Microsoft design style
    principles.


    I really prefer using the Windows 8 version of Internet Explorer over the desktop
    version. When using the Windows 8 version, all you see is the web page, which
    is the point of the application in the first place.


    Or consider the “Be fast and fluid” principle. The reason that I like interacting
    with my iPhone so much is the illusion of motion, and this illusion is created
    by the judicious use of animations: On an iPhone, objects bounce and wobble


    When building a Windows Store app, you are encouraged to take advantage of animations.
    For example, if you use the standard ListView control—which we discuss in detail
    later in this book—then you get animations when you add or remove items. When
    you add an item to a ListView, it not only appears, it glides into place. When
    you remove an item, it doesn''t just disappear, items above and below collapse
    into place.


    # Common Features of Windows Store Apps


    Windows Store apps are applications that follow the Microsoft design style principles.
    Furthermore, Windows Store apps are designed to run on the Windows 8 or Windows
    RT operating system.'
