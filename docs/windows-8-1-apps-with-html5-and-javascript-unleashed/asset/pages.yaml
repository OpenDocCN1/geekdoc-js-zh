  md: '# # Introduction


    If you want to build a software application and reach the largest possible market
    of customers and make the most money then it makes sense for you to build a Windows
    8.1 app.


    Microsoft Windows is the most popular operating system in the world. Windows accounts
    for more than 90 percent of the operating system market. More than 100 million
    licenses for Windows 8 were sold in its first six months of release. The size
    of the Windows market dwarfs the size of every other marketplace for software
    applications (including the iPhone and Android markets).


    I want to own a toilet made of solid gold, Nathan Myhrvold''s jet, and a Tesla
    Roadster (orange). These are modest goals, and I know that many of you reading
    this book share the same goals. The most likely way for you or me (hopefully)
    to reach these goals is to build Windows 8.1 apps.


    When you build a Windows 8.1 app, you can sell your app right within Windows 8.1
    itself. Windows 8.1 includes the Windows Store (shown in Figure 1.1) where you
    can list your app for anywhere between free and $999.99. You can sell a variety
    of different types of apps including productivity apps (think task lists and time
    trackers) and games (think Angry Birds and Cut the Rope).


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_16_0.png)


    FIGURE 1.1 You can sell your app in the Windows Store.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Introduction


    This book is all about building Windows apps that you can sell in the Windows
    Store. In particular, you learn how to build Windows apps using JavaScript and
    HTML.


    Why JavaScript and HTML? You can build Windows apps using other technologies like
    C# or XAML or C++, but this book focuses exclusively on building Windows apps
    with JavaScript and HTML.


    The advantage of building Windows apps with JavaScript and HTML5 is that you can
    leverage your existing skills building websites to build Windows applications.
    If you are already comfortable programming with JavaScript, HTML, and Cascading
    Style Sheets then you should find it easy to build Windows apps.


    This book covers everything you need to build Windows apps. You learn how to use
    the Windows Library for JavaScript (WinJS) to create JavaScript applications.
    In particular, you learn how to use WinJS controls such as the Rating, Menu, Repeater,
    and ListView controls.


    You also learn how to work with the Windows Runtime. By taking advantage of the
    Windows Runtime, you can access Windows 8.1 functionality to do things that you
    could not normally do in a web app, such as capture video and sound and convert
    text to speech.


    By the end of this book, you will understand how to create Windows apps, such
    as game apps and productivity apps. In Chapter 15, "Graphics and Games," you learn
    how to create a simple arcade game—the Brain Eaters game. And, in Chapter 16,
    "Creating a List App," you learn how to build a productivity app—the MyTasks app.


    Read this book, build a Windows app, sell lots of copies, and buy a jet.


    # Updated for Windows 8.1


    This book has been extensively updated for Windows 8.1. Changes have been made
    to every chapter. All of the code associated with this book has been reviewed
    and updated to be compatible with Windows 8.1.


    Windows 8.1 includes several important controls, including the Hub, Repeater,
    ItemContainer, SearchBox, WebView, and NavBar controls. This book covers all of
    these controls in depth.


    Windows 8.1 ships with a new version of the Windows Library for JavaScript (WinJS
    2.0). This new version has significant new features such as the WinJS Scheduler.
    I discuss the new WinJS Scheduler in Chapter 2, "WinJS Fundamentals"


    Windows 8.1 includes important backwards breaking changes. Unlike Windows 8, Windows
    8.1 no longer supports discrete view states as a snapped or filled state. I discuss
    these changes in Chapter 11, "App Events and States."


    Finally, I added four new chapters to this book. I added a chapter that covers
    the new ItemContainer and Repeater controls (Chapter 7, "Using the ItemContainer,
    Repeater, and FlipView Controls"), a chapter devoted to using Azure Mobile Services
    (Chapter 10, "Data with Windows Azure"), a chapter on implementing and'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'search (Chapter 13, "Creating Share and Search Contracts"), and a chapter on
    building a productivity app (Chapter 16).


    # # Prerequisites for This Book


    If you can build a website using JavaScript, HTML, and Cascading Style Sheets
    then you have the skills that you need to read and understand this book.


    There are two software requirements for building Windows apps and using the code
    from this book.


    First, you must build a Windows 8.1 app on the Windows 8.1 operating system. Let
    me repeat this: You must have Windows 8.1 installed on your computer to use the
    code from this book.


    Second, in order to use the code from this book, you need Microsoft Visual Studio
    2013. There is a free version of Visual Studio 2013—Microsoft Visual Studio Express
    2013 for Windows—which you can download from the Microsoft.com website.


    # # Source Code


    You can download all of the source code associated with this book from GitHub:
    https://github.com/StephenWalther/Windows8.1AppsUnleashed


    Click the Downloads link to download the latest version of the code in a zip file.'
