  md: '# Optimistic Inserts, Updates, and Deletes


    Both the Live.login() method and the Services.login() method return promises.
    If there is an error logging into either Live Connect or Windows Azure then the
    error message is displayed in a Message Dialog (see Figure 16.3).


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_452_0.png)


    FIGURE 16.3 Error caused by no Internet connection


    If you click the Retry button in the Message dialog, then the login() method calls
    itself. In other words, the startup() method will keep attempting to connect to
    the services over and again every time you click Retry. Because the MyTasks app
    won''t work unless you connect to these services, the app won''t let you do anything.


    > NOTE

    Instead of throwing a user into an infinite loop, wouldn''t it make sense to just
    close the app when there is no Internet connection? Nope, definitely not. It violates
    Windows 8 app certification requirements to programmatically close an app: "Your
    app must neither programmatically close nor offer UI affordances to close it."


    # Optimistic Inserts, Updates, and Deletes


    Always optimistic because users are impatient.


    The MyTasks app uses optimistic inserts, update, and deletes when calling Windows
    Azure Mobile Services. For example, when a user creates a new task, the task is
    added to the Win3.Binding.List displayed by the ListView immediately and the new
    task appears immediately. Behind the scenes, the task is inserted in the Windows
    Azure database after the task already appears in the ListView.


    Being optimistic is important for perceived performance. When users interact with
    your Windows Store app, they don''t want for things to happen. They don''t care
    that their tasks need to be stored in a remote database. Everything should appear
    to happen instantly.'
