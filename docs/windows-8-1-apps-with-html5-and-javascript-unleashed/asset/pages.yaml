    \ was clicked.\n\nIn Listing 4.15, the headerinvoked event is handled and the\
    \ selected hub section index and header name is written to the Visual Studio JavaScript\
    \ Console window.\n\nLISTING 4.15 Using Hubs and Hub Sections (hub\\hub.html)\n\
    \n```\nfunction () {\n  \"use strict\";\n\n  function initialize() {\n    WinJS.UI.processAll().done(function\
    \ () {\n      var hub = document.getElementById(\"hub\").winControl;\n      hub.addEventListener(\"\
    headerinvoked\", function(e) {\n        var section = e.detail.section;\n    \
    \    var sectionIndex = e.detail.index;\n\n        // Display selected section\
    \ index and name\n        console.log(\"You clicked on section \" + section.header\n\
    \          + \" with index \" + sectionIndex);\n      });\n    });\n  }\n  document.addEventListener(\"\
    DOMContentLoaded\", initialize);\n}();\n```\n\n# Using the WebView Control\n\n\
    The WebView control (new in WinJS 2.0) enables you to embed a web page hosted\
    \ on the Internet in your Windows Store app. There are several different scenarios\
    \ in which it makes sense for you to use this control."
