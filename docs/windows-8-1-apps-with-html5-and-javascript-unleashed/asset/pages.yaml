  md: 'Notice that the page includes a reference to the alert.js JavaScript file.
    You must include a reference to your custom Page control in any page that uses
    the control declaratively.


    The Alert Page control is created declaratively in the body of the page just like
    any other standard WinJS control such as the ListView or DatePicker control.


    > > WARNING


    Remember to call WinJS.UI.processAll() or your Page controls, just like any other
    WinJS control, won''t get processed and turned into a control.


    # Creating Multi-Page Apps


    You can create a Windows Store app that contains multiple HTML pages and create
    links between the pages. However, Microsoft strongly discourages you from doing
    this. Instead, you are encouraged to create a single page app and dynamically
    load different Page controls that represent individual pages.


    Why does Microsoft make this recommendation? When you are building a Windows Store
    app, you are not building a website (even though you are using many of the same
    technologies). Instead, you are building a Windows application.


    Users have different expectations when using a Windows application than a web
    application. In a web application, it is normal to click a link and wait (and
    wait, and wait) for another page to load. While you are waiting, the application
    freezes. When the new page loads, you start over in a completely new context—the
    context of the new page.


    In a Windows application, this experience would be unacceptable. Microsoft Word,
    for example, never freezes when you click a button (well, hardly ever). You don''t
    navigate pages in a Windows application. Instead, you navigate content by opening
    dialogs and switching between tabs.


    To create this same type of Windows application experience in a Windows Store
    app, you are encouraged to create a single-page app.


    # Creating a Navigation App


    The easiest way to create a single-page app that contains multiple pages is to
    take advantage of the Visual Studio App project template (see Figure 12.3). There
    are several differences between this template and the Blank App template.'
  merge: -1
  pgno: 355
