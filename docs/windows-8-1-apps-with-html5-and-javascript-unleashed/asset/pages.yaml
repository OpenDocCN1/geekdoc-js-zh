  md: "# CHAPTER 16 Creating a Task List App\n\nWhat happens if things go wrong? What\
    \ happens if your Internet connection goes down and the task cannot be inserted\
    \ into the remote Azure database?\n\nIn the rare cases when things go wrong, you\
    \ simply revert. If you have inserted a task in the List then you remove it. If\
    \ you have deleted a task then add the task back again. If you have updated a\
    \ task then you revert it. And, you throw an error message to the user who knows\
    \ that something has gone wrong.\n\nListing 16.2 contains the code, from the \\\
    js\\services.js library, for creating a new task.\n\n# LISTING 16.2 Optimistic\
    \ Insert (/js/services.js)\n\n```\nfunction addMyTask(newTask) {\n  return WinJS.Promise(function\
    \ (complete, error) {\n    // Be optimistic\n    _myTasksList.dataSource.insertStart(null,\
    \ newTask).done(function (listItem) {\n      // Actually do the insert\n     \
    \ _myTasksList.Table.insert(newTask).done(\n        function (newDBItem) {\n \
    \         // Update the list item with the DB item\n          _myTasksList.dataSource.change(listItem.key,\
    \ newDBItem);\n          complete();\n        },\n        function (err) {\n \
    \         // Remove the item\n          _myTasksList.dataSource.remove(listItem.key).done(function\
    \ (error) {\n            error(err);\n          });\n        }\n      });\n  \
    \  });\n  });\n}\n\n```\n\nLet me explain what is going on in the addMyTask()\
    \ method in Listing 16.2. First, let me describe what happens when everything\
    \ goes right:\n\n+   1. The new task is added to the local WinJS.Binding.List\
    \ with the insertStart() method. Because the WinJS.Binding.List is bound to the\
    \ ListView, the new task appears immediately in the ListView."
  merge: -1
  pgno: 453
- img_proc: true
  md: '# Optimistic Inserts, Updates, and Deletes


    +   2. The new task is inserted in the remote MyTasks Azure database table by
    calling the `myTasks.insert()` method.


    +   3. After the new task is successfully inserted into the remote database then
    the task in the local WinJS.Binding.List is updated with the correct ID from the
    remote database.


    So, if everything works right, when a user creates a new task then the user can
    see the task immediately. The user does not need to wait for the remote database
    to be updated.


    If things don''t go right, then the following steps happen:


    +   1. The new task is added to the local WinJS.Binding.List and the user sees
    the new task in the ListView.


    +   2. For whatever reason, the new task cannot be inserted into the remote Azure
    table (for example, the internet is broken).


    +   3. The new task is removed from the local WinJS.Binding.List and the user
    sees that the task has been removed from the ListView.


    So, if things go wrong, the user sees the new task appear and disappear. Because
    the `getMyTask()` method calls the `error()` function, the user also sees the
    error message in Figure 16.4.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_454_0.png)


    FIGURE 16.4 When things go wrong with an optimistic insert'
  merge: -1
