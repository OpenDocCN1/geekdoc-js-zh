  md: '# CHAPTER 12

    Page Fragments and Navigation


    The goal of this chapter is to explain three controls: the HtmlControl, the Page
    control, and the PageControlNavigator control. All three controls enable you to
    display one HTML page in another HTML page using Ajax.


    The HtmlControl enables you to add a chunk of HTML to a page. You can use this
    control to reuse the same HTML markup in multiple places in your app.


    Creating custom Page controls enables you to easily create WinSJS controls out
    of an HTML page, JavaScript file, and style sheet. Create a Page control when
    you want to encapsulate both markup and behavior in a new control.


    Finally, the PageControlNavigator control enables you to build single page apps
    that contain multiple virtual pages. The PageControlNavigator enables you to load
    Page controls to simulate the experience of navigating between pages.


    # Using the HtmlControl Control


    If you want to include the same chunk of HTML in multiple pages in a Windows Store
    app, or you want to break up an existing page into more manageable parts, then
    you can use the WinJS HtmlControl. This control requires you to set one option:
    a URL. You set the URI to indicate the content that you want to load.


    > NOTE

    nYou can find the code discussed in this section in the Chapter12\Fragments folder
    in the GitHub source.'
  merge: -1
  pgno: 348
