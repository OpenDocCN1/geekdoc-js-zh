    \ padding:10px;\n}\n```\n\n> NOTE\nNotice that each CSS rule is qualified with\
    \ #optionList. In CSS, more specific rules override less specific rules. Without\
    \ the #optionList qualifier, the earlier CSS rules would be ignored because they\
    \ would be overridden by the default ItemContainer styles defined in the WinJS\
    \ ui-dark.css or ui-light.css file.\n\nThe win-itemcontainer applies to the outermost\
    \ DIV element rendered by the ItemContainer. The win-itemcontainer class provides\
    \ the DIV element with a fixed width and height of 100 pixels. It also floats\
    \ the DIV elements so the options appear next to one another horizontally.\n\n\
    The win-itembox applies to a DIV element that is nested inside the win-itemcontainer.\
    \ This is a good place to set the background color of the DIV.\n\nThe win-item\
    \ class applies to the innermost DIV element rendered by the ItemContainer. The\
    \ win-item class adds some padding to each option element.\n\nWhen an ItemContainer\
    \ is rendered, nested DIV elements are rendered. For example, the Option 1 ItemContainer\
