  md: '# Scaling Content to Fit Different Screen Resolutions


    In the previous section, you learned how to use media queries and JavaScript to
    hide or display content depending on the width and orientation of an app. In this
    section, I discuss how you can build your Windows Store app so it will adapt gracefully
    to screen resolutions.


    # Defining a Viewport


    You can take advantage of the @-ms viewport rule to scale content to fit different
    device resolutions—devices with different widths and heights—automatically.


    The @-ms viewport rule enables you to define a viewport. A viewport determines
    the width and height of the available screen estate used to display content independent
    of the actual screen size.


    For example, the following page displays some text and a picture of a Tesla:


    ```

    <DOCTYPE html>

    <html>

    <head>

    <title>viewport</title>

    </head>

    <body>

    <h1>A fast, red Tesla</h1>

    <img src="../images/tesla.jpg" />

    </body>

    </html>

    ```


    When the page is displayed full screen (see Figure 11.8) then everything looks
    fine. When you share the screen with another app, and lose half the horizontal
    resolution, then the picture is cut off (see Figure 11.9).'
