    \ by calling the notifyMutated() method.\n\n+   - itemremoved—Triggered by removing\
    \ an item from the list.\n\n+   - reload—Triggered by reordering the items in\
    \ a list by calling sort() or reverse().\nAlso triggered by calling the notifyReload()\
    \ method.\n\nThe code in Listing 3.4 demonstrates how you can trigger each of\
