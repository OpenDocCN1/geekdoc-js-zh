    \ load a default page such as the home page.\n\nHere's what the code looks like\
    \ for checking the previous state:\n\n```\nWinJS.Application.addEventListener(\"\
    activated\", function (evt) {\n  var appState = Windows.ApplicationModel.Activation.ApplicationExecutionState;\n\
