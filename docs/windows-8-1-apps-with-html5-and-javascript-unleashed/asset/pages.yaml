  md: '![](img/8ab4405a0676ad7bea0c93c2b4e03e30_217_0.png)


    FIGURE 7.2 Invoking an ItemContainer


    By default, an ItemContainer can be both invoked and selected. You can change
    this default behavior by modifying the tapBehavior and swipeBehavior properties.


    The tapBehavior property accepts the following values:


    +   - directSelect—Tapping an item both invokes and selects it

    - toggleSelect—Tapping an item selects/deselects it

    - invokeOnly—Tapping an item invokes but does not select it

    - None—Tapping an item neither invokes nor selects it


    The swipeBehavior property accepts the following two values:


    +   - select—Swiping an item selects it

    - None—Swiping an item does not select it


    # Selecting an ItemContainer


    Selecting an ItemContainer raises both a selectionchanging and selectionchanged
    event. You can handle these events to detect when an ItemContainer is selected.


    Imagine, for example, that you want to create a set of options that work like
    radio buttons. When you select one option, all of the other options are unselected
    automatically so that you can select only one option at a time.


    Listing 7.3 contains three ItemContainers that represent the three options.'
