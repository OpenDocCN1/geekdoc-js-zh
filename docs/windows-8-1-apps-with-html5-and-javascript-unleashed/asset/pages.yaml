  md: "# CHAPTER 4 Using WinJS Controls\n\n> NOTE\nI looked this up on Wikipedia (http://en.wikipedia.org/wiki/Noon).\
    \ Apparently, noon is neither 12:00am nor 12:00pm, but just 12 noon. Weird.\n\n\
    # Formatting the Hour, Minute, and Period\n\nYou can use template strings to format\
    \ the appearance of the items which appear in the hour, minute, and period select\
    \ lists. The template string can contain any characters you want, but there are\
    \ special format specifiers which you can use when displaying the different portions\
    \ of a time.\n\nYou can use the following format specifiers with the TimePicker\
    \ hourPattern property:\n\n+   * {hour.integer}\n* {hour.integer(n)}\n\nYou can\
    \ use the following format specifiers with the TimePicker minutePattern property:\n\
    \n+   * {minute.integer}\n* {minute.integer(n)}\n\nYou can use the following format\
    \ specifiers with the TimePicker periodPattern property:\n\n+   * {period.abbreviated}\n\
    * {period.abbreviated(n)}\n\nThe n refers to a number. For example, if you use\
    \ hour.integer(2) then a leading 0 will appear for single digit hours.\n\nThe\
    \ following declaration of a TimePicker control illustrates how you can customize\
    \ the appearance of the hour, minute, and period select lists (see Figure 4.21).\n\
    \n```\n<div id=\"timeLunch\n  data-win-control=\"WinJS.UI.TimePicker\"\n  data-win-options=\"\
    n    hourPattern: 'hour: {hour.integer(2)}',\n    minutePattern: 'minute: {minute.integer(2)}',\n\
    \    periodPattern: 'period: {period.abbreviated}'\n  \"></div>\n```"
