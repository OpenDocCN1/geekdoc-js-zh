    # Authentication and Windows Azure Mobile Services


    In Chapter 10, “Using Windows Azure Mobile Services,” I demonstrated how you can
    use Windows Azure Mobile Services to store app data in the cloud. In particular,
    I showed how you can create a Tasks database table hosted on Azure and execute
    inserts, deletes, and queries from a Windows Store app using Mobile Services.


    However, in that chapter, I avoided the whole issue of authentication. Anyone
    could read any data and make changes to the Tasks table. Anyone could do anything,
    which is very dangerous.


    In this section, I want to explain how you can use Live Connect authentication—which
    we discussed in the previous section—to control access to Mobile Services. I demonstrate
    how you can require users to authenticate before accessing the Tasks Mobile Service
    and how you can prevent users from accessing each other''s tasks.


    # Configuring Your Mobile Service


    Before you can use Live Connect with Azure Mobile Services, you must first provide
    Mobile Services with your app’s client ID and client secret from Live Connect.
    Follow these steps:


    +   1. Navigate to the My Applications page at the Live Connect Developers Center
    located at https://account.live.com/developers/applications. Select your application
    from the list of applications.

    2. Record the client ID and client secret for your app.

    3. Navigate to the Windows Azure Management portal at http://manage.WindowsAzure.com.
    Navigate to your Mobile Service and click the Identify tab (see Figure 14.11).

    4. Enter your client ID and client secret under Microsoft Account Settings.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_416_0.png)


    FIGURE 14.11 Entering your Live Connect client ID and client secret at Azure'
  merge: -1
  pgno: 416
