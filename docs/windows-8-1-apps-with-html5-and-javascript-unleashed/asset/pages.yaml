    # Passing App Certification


    Microsoft must review your app before it gets published to the Windows Store.
    Part in other words, your app must go through a certification process. Part of
    this certification process is automated and part of the certification process
    must be done by a human.


    There are many requirements for certification. Some of these requirements are
    obvious. For example, your app cannot contain programming errors that cause it
    to immediately crash and your app cannot simply be a big ad for your business.


    Some of the certification requirements are not so obvious. For example, to be
    certified, your app cannot unexpectedly transport large amounts of data over a
    metered network connection, your app must start up quickly, and your app must
    be complete (no "coming soon" features). Also, if your app links to the Internet,
    you must provide a privacy policy.


    > NOTE


    The Windows Store certification requirements are detailed at http://msdn.microsoft.com/en-us/library/windows/apps/hh694083.aspx.


    You can use the Windows App Certification Kit to run the automated certification
    tests on your app before you upload your package to the Windows Store. The easiest
    way to run the Windows Certification Kit is to package your app within Visual
    Studio by selecting the menu option Package, Store, Create App Package. The last
    step in the Create App Package Wizard enables you to launch the Windows App Certification
    Kit (Figure 1.33).'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# CHAPTER 1 Building Windows Store Apps


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_55_0.png)


