  md: "Modal dialogs are necessary when your app will not work without crucial information.\
    \ For example, a Weather app cannot display the weather without knowing your location.\
    \ So it makes sense to use a modal dialog to ask for the user's location when\
    \ the app first runs.\n\nYou can also use modal dialogs in the same situations\
    \ in which you would use JavaScript alerts: when you really need to get in a user's\
    \ face to convey critical warnings or information. You should use modal dialogs\
    \ sparingly.\n\n# NOTE\n\nJavaScript alerts do not work in Windows Store apps\
    \ written with JavaScript. Because I consider JavaScript alerts to be closely\
    \ related to the (deprecated) HTML blink tag, this is a good thing.\n\nYou create\
    \ modal dialogs by using the MessageBox class. Here's how you can open a dialog\
    \ with the message, \"Did you know that your fly is unzipped?\" (see Figure 6.14).\n\
    \n```\nvar message = new Windows.UI.Popups.MessageBox(\n    \"Did you know that\
    \ your fly is unzipped?\"\n);\nmessage.showAsync();\n```\n\n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_208_0.png)\n\
    \nFIGURE 6.14 Using a message dialog\n\nYou can customize the appearance of the\
    \ dialog by supplying commands. For example, here is how you would create a Yes/No\
    \ dialog:"
  merge: -1
