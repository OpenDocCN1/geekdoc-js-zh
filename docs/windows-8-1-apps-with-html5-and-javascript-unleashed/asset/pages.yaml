  md: '# CHAPTER 11


    # App Events and States


    The goal of this chapter is to explain Windows Store app events, lifecycle, and
    view states. In the first part, I explain the standard sequence of events which
    are raised whenever you start a Windows Store app. You learn how to handle the
    loaded, activated, and ready events.


    In the next part, I explain how you can handle application suspension, termination,
    and resumption. You learn how to store and retrieve the state of your application
    in session state so you can maintain the illusion that your app is always running.


    Finally, I discuss application view states. You learn how to gracefully handle
    displaying your app with advantage of different screen widths by taking the window
    resize event and media queries.


    # App Events


    When you launch a Windows Store app, the following WinJS application events are
    fired in the order shown here:


    +   - WinJS.Application.loaded—Triggered by the standard browser DOMContentLoaded
    event, right after the HTML document has finished loading

    - WinJS.Application.activated—Triggered after your application is activated

    - WinJS.Application.ready—Triggered after the loaded and activated events

    - WinJS.Application.unload—Triggered by the standard browser beforeunload event,
    right before a page is unloaded


    IN THIS CHAPTER

    - 400 Events

    - WinJS.Application.loaded—Triggered when terminating or initializing an app

    - WinJS.Application.activated—Triggered after the app is activated

    - WinJS.Application.ready—Triggered after the app is loaded and activated

    - WinJS.Application.unload—Triggered before the app is unloaded

    - Scaling Content to Fit Different Screen Sizes'
