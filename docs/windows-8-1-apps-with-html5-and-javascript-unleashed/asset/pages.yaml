    FIGURE 8.1 ListView in the Mail app


    # Introduction to the ListView Control


    Let''s start with the basics. You can bind a ListView control to any data source
    that implements the JavaScript IListDataSource interface. The WinJS library includes
    two objects that implement this data source:


    +   - WinJS.Binding.List—Enables you to represent a JavaScript array as a data
    source.


    +   - WinJS.UI.StorageDataSource—Enables you to represent files from your computer
    drive as a data source. For example, you can use the WinJS.UI.StorageDataSource
    with the ListView control to display a list of pictures retrieved from your computer''s
    Pictures library.


    In this chapter, we focus on using the WinJS.Binding.List data source because
    this is the most flexible data source. You can create an instance of the WinJS.Binding.List
    source from any JavaScript array.


    For example, you can perform an Ajax request against a remote server and retrieve
    an array of products. You can then display the array of products using the List
    data source with the ListView control.


    > NOTE

    Instead of using either WinJS.Binding.List of WinJS.UI.StorageDataSource sources,
    you can create a custom data source and use it with the ListView control. You
    might want to create a custom data source, for example, if you need to display
    data from an IndexedDB database with a ListView control. We create several custom
    data sources—including an IndexedDB data source—in the next chapter.


    Let''s look at how you use the ListView control with a WinJS.Binding.List data
    source. The page in Listing 8.1 contains a ListView control that displays a set
    of products (see Figure 8.2).'
