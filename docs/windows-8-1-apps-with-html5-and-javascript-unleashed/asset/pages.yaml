  md: "# Overview of IndexedDB\n\nAn IndexedDB database might be different than the\
    \ type of database that you normally use. An IndexedDB database is an object-oriented\
    \ database and not a relational database. Instead of storing data in tables, you\
    \ store data in object stores. An IndexedDB database contains one or more object\
    \ stores that contain a collection of JavaScript objects.\n\nThe IndexedDB API\
    \ includes both asynchronous and synchronous methods. Currently, only the asynchronous\
    \ methods are widely supported by browsers. If you want to open a database connection,\
    \ add an object to an object store, or get a count of items in an object store,\
    \ then you need to perform these operations asynchronously.\n\n# Creating or Connecting\
    \ to an IndexedDB Database\n\nYou don't create a new IndexedDB database upfront—instead,\
    \ you create a new database when a user first tries to make a connection to your\
    \ database. You create new IndexedDB databases by handling the upgradeneeded event\
    \ when attempting to open a connection to an IndexedDB database.\n\nFor example,\
    \ here's how you would both open a connection to an existing database named TasksDB\
    \ when create the TasksDB database when it does not already exist:\n\n```\nvar\
    \ reqOpen = window.indexedDB.open(\"TasksDB\", 2);\nreqOpen.upgradeneeded = function\
    \ (evt) {\n  var newDB = evt.target.result;\n  newDB.createObjectStore(\"tasks\"\
    , { keyPath: \"id\", autoIncrement: true });\n}\nreqOpen.onsuccess = function\
    \ () {\n  var db = reqOpen.result;\n  // Do something with db\n}\n```\n\n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_297_0.png)"
  merge: -1
  pgno: 297
- img_proc: true
  md: "# Creating an IndexedDB Data Source\n\nWhen you call window.indexedDB.open(),\
    \ and the database does not already exist, then the upgradeded event is raised.\
    \ In the preceding code, the upgradeded handler creates a new object store named\
    \ tasks. The new object store has an auto-increment column name id that acts as\
    \ the primary key.\n\nIf the database already exists with the right version, and\
    \ you call window.indexedDB.open(), then the success event is raised. At that\
    \ point, you have an open connection to the existing database and you can start\
    \ doing something useful with the database.\n\n# Adding Objects to an Object Store\n\
    \nYou use asynchronous methods to interact with an IndexedDB database. For example,\
    \ the following code illustrates how you would add a new object to the tasks object\
    \ store:\n\n```\nvar transaction = db.transaction(\"tasks\", \"readwrite\");\n\
    \ store = transaction.objectStore(\"tasks\");\n reqAdd = store.add({\n  name:\
    \ \"Feed the dog\"\n});\nreqAdd.onsuccess = function () {\n  // Task added successfully\n\
    });\n```\n\n> Notice that you use callbacks and not promises when interacting\
    \ with IndexedDB. Realize that IndexedDB is not a Microsoft technology so it works\
    \ independently of the promise pattern in WinJS.\n\nThe preceding code creates\
    \ new read-write database transaction, adds a new task to the tasks object store,\
    \ and handles the success event. If the new task gets added successfully then\
    \ the success event is raised.\n\n# Getting a Count of Objects in an Object Store\n\
    \nYou can get the count of numbers in a particular object store by taking advantage\
    \ of the count() method. For example, you can use the following code to determine\
    \ the number of items in the tasks objects store:\n\n```\nvar transaction = db.transaction(\"\
    tasks\");\n store = transaction.objectStore(\"tasks\");\n reqCount = store.count();\n\
    reqCount.onsuccess = function (evt) {\n  var count = evt.target.result;\n  console.log(count);\n\
    });\n```\n\n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_298_0.png)"
  merge: -1
  pgno: 298
- img_proc: true
  md: "# CHAPTER 9 Creating Data Sources\n\nThe preceding code creates a read-only\
    \ database transaction and gets a count of the number of objects in the tasks\
    \ object store by calling the count() method.\n\nNotice that the call to the count()\
    \ method is asynchronous. You get the count by handling the success event and\
    \ reading the target.result property.\n\n# Retrieving Objects from an Object Store\n\
    \nYou retrieve objects from an object store by opening a cursor and moving through\
    \ the cursor object at a time. For example, the following code opens a cursor\
    \ that returns the objects from the tasks object store:\n\n```\nvar items = [];\n\
    var transaction = db.transaction(\"tasks\");\nvar store = transaction.objectStore(\"\
    tasks\");\nvar req = store.openCursor();\nreq.onsuccess = function (evt) {\n \
    \ var cursor = evt.target.result;\n  if (cursor) {\n    items.push(cursor.value);\n\
    \    cursor.continue();\n  } else {\n    All done!\n  }\n};\n```\n\nWhen you open\
    \ a cursor and nothing goes wrong, the success event is raised. You can use cursor.value\
    \ to get the current object. Calling cursor.continue() moves the cursor forward\
    \ and raises the success event again.\n\nWhen you reach the end of the cursor\
    \ then cursor will have the value null. In that case, you know that you have retrieved\
    \ all of the objects from the object store.\n\ncursor.continue() advances by a\
    \ single object. If you need to advance by more than one object then you can use\
    \ cursor.advance().\n\n# Using Indexes and Key Ranges\n\nWhen you create a database,\
    \ you can create indexes on object properties. An index enables you to efficiently\
    \ retrieve objects that match a value or range of values.\n\nHere's how you would\
    \ create a tasks object store that includes an index on its dateCreated:\n\n```\n\
    var reqOpen = window.indexedDB.open(\"Tasks\", 2);\nreqOpen.onupgradeneeded =\
    \ function (evt) {\n  var newDB = evt.target.result;\n```"
  merge: -1
