  md: "# Switching Views with Semantic Zoom\n\nSemantic Zoom is a feature of Windows\
    \ 8 that enables you to view data at two different zoom levels. For example, the\
    \ Windows 8 Start screen takes advantage of Semantic Zoom. By default, when you\
    \ open the Start screen, you see a close-up view of your apps (see Figure 8.14).\
    \ However, you can zoom out to see a more far away view of your apps (see Figure\
    \ 8.15).\n\n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_263_0.png)\n\nFIGURE 8.14\
    \ Default Start screen\n\nWhen using the mouse, you can zoom out by clicking the\
    \ –button, which appears at the bottom right of the screen. When using touch,\
    \ you can zoom in and out by using pinch and stretch gestures. \n\nYou can implement\
    \ Semantic Zoom in your Windows app by taking advantage of WinJS SemanticZoom\
    \ control. When used with the ListView control, the SemanticZoom control enables\
    \ you to provide two different views of the same data: the hundred-foot view and\
    \ the ten-foot view."
  merge: -1
  pgno: 263
- img_proc: true
  md: '![](img/8ab4405a0676ad7bea0c93c2b4e03e30_264_0.png)


