  md: '# CHAPTER 1 Building Windows Store Apps


    There is a lot of interesting stuff happening in the JavaScript code in Listing
    1.2. Let''s walk through the code.


    First, I created an init() function that is executed when the DOMContentLoaded
    event is raised. The DOMContentLoaded is a standard DOM event that is raised when
    a browser finishes parsing an HTML document.


    I put all of my code into the init() function so the code won''t be executed until
    the DOM is ready. Otherwise, if I attempted to access any of the HTML elements
    in the page I would get an exception because the elements would not yet exist.


    The first thing that I do within the init() method is call the WinJS.UI.processAll()
    method. This method processes all of the controls in a page. In particular, it
    converts the DIV tag with the data-win-control="WinJS.UI.AppBar" attribute into
    an actual app bar.


    Next, I set up an event handler for the Take Picture command. When you click the
    Take Picture command in the app bar, an instance of the Windows.Media.Capture
    class is created. The CameraCaptureUI class is an example of a Windows Runtime
    class.


    The CameraCaptureUI.captureFilesAsync method displays the screen for taking a
    picture (see 1.12). When you click the OK button, the done() method is called
    and the picture is displayed in the page.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_35_0.png)


    FIGURE 1.12 The camera capture UI screen


    An object URL is created for the photo blob (the actual image data) returned by
    the captureFilesAsync() method by calling the URL.createObjectURL() method. This
    createObjectURL() method is part of the HTML5 File API.'
