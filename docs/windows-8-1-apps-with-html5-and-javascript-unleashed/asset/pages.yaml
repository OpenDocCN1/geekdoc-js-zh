  md: "# LISTING 3.14 A Binding Converter (dataBindingConverters\\myBindingConverters.js)\n\
    \n```\n(function () {\n  \"use strict\";\n\n  var onSaleToDisplay = WinJS.Binding.converter(function\
    \ (onSale) {\n    return onSale ? \"block\" : \"none\";\n  });\n\n  WinJS.Namespace.define(\"\
    MyBindingConverters\",\n  {\n    onSaleToDisplay: onSaleToDisplay\n  });\n})();\n\
    ```\n\nYou create a binding converter by passing a function to the WinJS.Binding.converter\
    \ method. The function converts the value passed to the function to some other\
    \ value. In Listing 3.14, the function converts the product onSale property (a\
    \ Boolean property) into either the \"block\" or \"none\" (a value that can be\
    \ used with the style display property).\n\nThe two products are created in Listing\
    \ 3.15. Listing 3.15 contains an object viewModel which has a product1 and product2\
    \ property.\n\n# LISTING 3.15 Using a Binding Converter (dataBindingConverters/dataBindingConverters.js)\n\
    \n```\n(function () {\n  \"use strict\";\n\nfunction initialize() {\n  var viewModel\
