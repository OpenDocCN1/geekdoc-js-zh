    > NOTE

    The Visual Studio Console window only appears when an app is running. If you can''t
    find the window, use the menu option Debug, Windows, JavaScript Console.


    # Setting Breakpoints


    If you are building a Windows Store app, and the Windows Store app is behaving
    in ways that you don''t understand, then it is useful to set breakpoints and step
    through your code.


    You set a breakpoint by clicking in the left gutter of the Visual Studio code
    editor next to the line that you want to break on (see Figure 1.28). When you
    run your app in debug mode, and the breakpoint is hit, you can examine the values
    of your variables by hovering over them with a mouse.'
