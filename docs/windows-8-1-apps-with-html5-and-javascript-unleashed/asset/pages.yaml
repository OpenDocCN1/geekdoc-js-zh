  md: "# # Declarative Data Binding and Bindingters\n\nBinding converters enable you\
    \ to transform the value of a property when using the property in a data-win-bind\
    \ attribute.\n\nThere are all sorts of situations in which a binding converter\
    \ is useful. For example, formatting dates and times or hiding displaying content\
    \ dependent on a property value. Whenever you need to alter a JavaScript property\
    \ value before displaying it, you use a binding converter.\n\nImagine, for example,\
    \ that you want to display the text On Sale! when a product is on sale. The page\
    \ in Listing 3.13 displays two products (see Figure 3.9). It uses a binding converter\
    \ to hide or display the contents of a DIV element that contains the text On Sale!\n\
    \n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_116_0.png)\n\nFIGURE 3.9 Using a binding\
    \ converter\n\nLISTING 3.13 Using a Binding Converter (dataBindingConverters/dataBindingConverters.html)\n\
    \n```\n<!DOCTYPE html>\n<head>\n  <meta charset=\"utf-8\" />\n  <title>Chapter03</title>\n\
    \n<!-- WinJS references --\n  <link href=\"//Microsoft.WinJS.2.0/css/ui-dark.css\"\
    \ rel=\"stylesheet\" />\n  <script src=\"//Microsoft.WinJS.2.0/js/base.js\"></script>\n\
    \  <script src=\"//Microsoft.WinJS.2.0/js/ui.js\"></script>\n\n  .Chapter03 references\n\
    \  <link href=\"css/default.css\" rel=\"stylesheet\" />\n  <script src=\"dataBindingConverters.js\"\
    ></script>\n  <script type=\"text/javascript\" src=\"myBindingConverters.js\"\
    ></script>\n</head>\n<body>\n```"
