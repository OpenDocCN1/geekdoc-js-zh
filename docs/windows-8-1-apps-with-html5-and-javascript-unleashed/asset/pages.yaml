  md: "# Capturing User Interaction\n\nThe Brain Eater game supports keyboard, mouse,\
    \ touch, and stylus interaction. If you are using the keyboard then you can move\
    \ your character by using the arrow keys.\n\nThe following code is used to capture\
    \ keyboard interaction:\n\n```\ndocument.addEventListener(\"keydown\", this.movePlayerKeyboard.bind(this));\n\
    ```\n\nWhen you press a key, the movePlayerKeyboard() method is called. This method\
    \ detects the arrow key that was pressed and changes the direction of the player:\n\
    \n```\nmovePlayerKeyboard: function (e) {\n  switch (e.keyCode) {\n    case WinJS.Utilities.Key.upArrow:\n\
    \      this._player.direction = Unleashed.Direction.up;\n      break;\n    case\
    \ WinJS.Utilities.Key.downArrow:\n      this._player.direction = Unleashed.Direction.down;\n\
    \      break;\n    case WinJS.Utilities.Key.leftArrow:\n      this._player.direction\
    \ = Unleashed.Direction.left;\n      break;\n    case WinJS.Utilities.Key.rightArrow:\n\
    \      this._player.direction = Unleashed.Direction.right;\n      break;\n   \
    \ case WinJS.Utilities.Key.space:\n      this._player.direction = Unleashed.Direction.none;\n\
    \      break;\n  }\n}\n```\n\nThe movePlayerKeyboard() method takes advantage\
    \ of the WinJS.Utilities.Key enumeration to detect which keyboard was pressed.\
    \ This enumeration contains a list of human-friendly names for the key codes so\
    \ you can use WinJS.Utilities.Key.upArrow instead of 38.\n\nIf you are using a\
    \ tablet device then you want to touch instead of a keyboard. In that case you\
    \ can touch the screen to indicate the direction in which you want your character\
    \ to move.\n\nThe following code is used to capture the MSPinterDown event. This\
    \ event is raised when you press down on your mouse button, touch the screen with\
    \ your finger, or touch the screen with a stylus:\n\n```\nthis._canvas.addEventListener(\"\
    MSPointerDown\", this.movePlayerTouch.bind(this));\n```"
  merge: -1
