  md: "# Creating an Observable\n\nImagine I have created a product object like this:\n\
    \n```\nvar product = {\n  name: \"Milk\",\n  description: \"Something to drink\"\
    ,\n  price: 12.33\n};\n```\n\nThere's nothing very exciting about this product.\
    \ It has three properties named name, description, and price.\n\nNow, imagine\
    \ that I want to be notified automatically whenever any of these properties are\
    \ changed. In that case, I can create an observable product from my product object\
    \ like this:\n\n```\nvar observableProduct = WinJs.Binding.as(product);\n```\n\
    \nThis line of code creates a new JavaScript object observable from the existing\
    \ JavaScript product object. This new object also has a name, description, and\
    \ price property. However, unlike the properties of the original product object,\
    \ the properties of the observable product trigger notifications when the properties\
    \ are changed.\n\nEach of the properties of the new observable product object\
    \ has been changed into access properties that have both a getter and a setter.\
    \ For example, the observable product price looks something like this:\n\nprice:\n\
    \n```\nget: function () { return this.getProperty(\"price\\ }\nset: function (value)\
    \ { this.setProperty(\"price\", value); }\n```\n\nWhen you read the price property\
    \ then the getProperty() method is called and when you set the price property\
    \ then the setProperty() method is called. The getProperty() and setProperty()\
    \ methods are methods of the observable product object.\n\nThe observable product\
    \ object supports the following methods:\n\n+   defineProperty(name, value)—Adds\
    \ a new property to an observable and notifies any listeners\n\n+   backingData—An\
    \ object that represents the value of each property\n\n+   bind(name, action)—Enables\
    \ you to execute a function when a property changes\n\n+   getProperty(name)—Returns\
    \ the value of a property using the string name of the property"
