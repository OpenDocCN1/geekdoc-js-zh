  md: '# Using HTML5 Input Elements


    > > NOTE

    nThe touch keyboard only appears when you don''t have a keyboard attached to your
    machine or you explicitly open the touch keyboard.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_176_0.png)


    FIGURE 5.11 Touch keyboard for URL


    An <input type="url" /> field requires you to enter a valid absolute URL. For
    example, the URL http://superexpert.com and the URL ftp://superexpert.com are
    valid, but the URL superexpert.com and the URL www.superexpert.com are not because
    they are not absolute URLs (see Figure 5.12).


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_176_1.png)


    FIGURE 5.12 Validating a URL


    You use the <input type="tel" /> element to enter telephone numbers. Because there
    are so many different formats for telephone numbers, this input type does not
    perform any validation. Instead, you can use <input type="tel" /> to display a
    specialized touch keyboard for telephone numbers (see Figure 5.13).


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_176_2.png)


    FIGURE 5.13 Entering a telephone number


    Finally, there is <input type="search" />. An <input type="search" /> element
    behaves identically to an <input type="text" /> element. The only difference is
    that you get a keyboard with a Search key instead of an Enter key.'
