    \    var inputFilter = document.getElementById(\"inputFilter\");\n\n    // Bind\
    \ the unfiltered list of products to the ListView\n    lvProducts.item = listProducts.dataSource;\n\
    \n    inputFilter.addEventListener(\"keyup\", function () {\n      filterProducts(lvProducts,\
    \ inputFilter.value);\n    });\n  });\n};\n\nfunction filterProducts(listViewFilter,\
    \ filter) {\n  // Filter the data source\n  var filteredListProducts = listProducts.createFiltered(function\
    \ (item) {\n    var result = item.name.toLowerCase().indexOf(filter);\n    return\
    \ item.name.toLowerCase().indexOf(filter) == 0;\n  });\n\n  // Bind the list of\
    \ products to the ListView\n  listViewFilter.itemDataSource = filteredListProducts.dataSource;\n\
    }\n\ndocument.addEventListener(\"DOMContentLoaded\", initialize);\n}();\n```\n\
    \nHere's the filter function used by the createFiltered() method:\n\n```\nfunction\
    \ (item) {\n  var result = item.name.toLowerCase().indexOf(filter);\n  return\
    \ item.name.toLowerCase().indexOf(filter) == 0;\n}\n```\n\nThis function returns\
    \ an item when the name does not start with the filter string. Depending on what\
    \ the user types into the input box, different results are displayed. This is\
    \ a live filter, so the results change as the user types."
