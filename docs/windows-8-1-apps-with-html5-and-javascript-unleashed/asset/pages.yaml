  md: '# Using the Hub Control


    The Hub control is new with WinJS 2.0. The control provides you with a way to
    organize the content in your app into different sections. Each section can have
    a custom layout.


    For example, the Store app included in Windows 8.1 uses the Hub control (see Figure
    4.22). When you open the store and view the home-page, you can see all of the
    available apps organized into different sections such as New Releases and Top
    Paid. These different sections were created with the Hub control.


    > NOTE

    The Visual Studio 2013 Hub App project template uses the Hub control.


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_152_0.png)


    ![](img/8ab4405a0676ad7bea0c93c2b4e03e30_152_1.png)'
