  md: "# Using List Layout\n\nThe second layout mode that you can use with a ListView\
    \ control is list layout. In list layout mode, the items are displayed in a single\
    \ vertical list. If all of the items do not fit in the ListView then you can scroll\
    \ the ListView (see Figure 8.7).\n\n![](img/8ab4405a0676ad7bea0c93c2b4e03e30_246_0.png)\n\
    \nFIGURE 8.7 A ListView control that uses list layout\n\nHere's how you can declare\
    \ a ListView so it uses list layout:\n\n```\n<div id=\"lvProducts\"\n    data-win-control=\"\
    WinJS.UI.ListView\"\n    data-win-options=\"{\n        itemTemplate: select('#tmplProduct'),\n\
    \        layout: {type:WinJS.UI.ListView}\n    }\n></div>\n```\n\nWhen ListView\
    \ items are rendered with list layout then the items are not actually displayed\
    \ using HTML. UL and LI elements as the name of the layout might imply. Instead,\
    \ Div elements are rendered for each item.\n\n# Using Cell Spanning Layout\n\n\
    The final layout mode is called cell spanning layout. Cell spanning layout is\
    \ similar to grid layout but, unlike grid layout, cell spanning layout enables\
    \ to create grid items with different sizes. For example, you can make a tile\
    \ screen that contains different size tiles like the Windows 8.1 start screen.\n\
    \nUnfortunately, great power also requires lots of math. So, if you want to create\
    \ different grid items then you will need to get out your calculator to figure\
    \ out the sizes of the different items.\n\nImagine that you want to create the\
    \ page in Figure 8.8. Notice that the figure includes three sizes of tiles: normal,\
    \ wide, and tall."
