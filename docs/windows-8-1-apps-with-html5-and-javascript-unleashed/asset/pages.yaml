  md: '# CHAPTER 11 App Events and States


    The ViewBox control has some significant limitations. You can add only one child
    element to a ViewBox. If you want to apply the ViewBox to multiple elements then
    you must wrap the elements in the DIV (with a particular width and height).


    Furthermore, the ViewBox does not work with text. You can use the ViewBox to resize
    a picture or an HTML5 canvas.


    The main scenario in which it makes sense to use the ViewBox is when you want
    to create a game, and you want the game to look good on computers and tablets
    with different resolutions. You don''t want your angry bird to look fat on one
    computer and skinny on another. We use the ViewBox control with the Brain Eaters
    game in Chapter 15, "Graphics and Games."


    > Behind the scenes, the ViewBox control uses the Cascading Style Sheet 3 translate
    and scale functions.


    # Summary


    This chapter was all about Windows Store app events and states. In the first part,
    I explained the standard types of events that are raised whenever you run a Windows
    Store app. You learned how to handle the application loaded, activated, and ready
    events.


    Next, I discussed how Windows Store apps get suspended and terminated automatically
    in Windows 8. You learned how to take advantage of session state to store and
    retrieve app data.


    Finally, you learned how to gracefully adapt to changes in the width, height,
    orientation, and resolution of a Windows Store app. You learned how to use media
    queries to hide and display content when the size of a Windows app changes. You
    also learned to scale a Windows Store app using the @ms-viewport rule and the
    ViewBox control.'
  merge: -1
