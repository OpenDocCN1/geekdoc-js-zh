  md: "# # Dynamic menu\n\nThis example uses the mouse coordinates to toggle the visibility\
    \ of menu layers and uses a stylesheet to specify the characteristics of the main\
    \ bar layer and the menu layers:\n\n```\n// Netscape/Mozilla capture events instruction\n\
    if (navigator.appName == \"Netscape\") {\n  window.captureEvents(Event.MOUSEMOVE);\n\
    }\n// specify the onmousemove event-handler\ndocument.onmousemove = track;\n\n\
    // get the menu layer objects\nvar m1 = document.getElementById(\"menu_1\");\n\
    var m2 = document.getElementById(\"menu_2\");\nvar m3 = document.getElementById(\"\
    menu_3\");\n\n// a function to react to the MOUSEMOVE event\nto to dynamically\
    \ hide menu layers\nfunction track(e) {\n  // get the current x,y coordinates\n\
    \  var x = (document.all) ? event.x : e.pageX;\n  var y = (document.all) ? event.y\
    \ : e.pageY;\n\n  // hide menu 1 if out of bounds\n  if(x<1 || x>60 || y<53 ||\
    \ y>123)\n    m1.style.visibility = \"hidden\";\n  // hide menu 2 if out of bounds\n\
    \  if(x<70 || x>130 || y<53 || y>123)\n    m2.style.visibility = \"hidden\";\n\
    \  // hide menu 3 if out of bounds\n  if(x<140 || x>200 || y<53 || y>123)\n  \
    \  m3.style.visibility = \"hidden\";\n}\n\n// a function to reveal a menu layer\n\
    function reveal(menu) {\n  if (menu == 1) m1.style.visibility = \"visible\";\n\
    \  if (menu == 2) m2.style.visibility = \"visible\";\n  if (menu == 3) m3.style.visibility\
    \ = \"visible\";\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_175_0.png)\n\
    \nmenus.js\n\n![](img/5f5106681c8c7072e64c4ea87c891513_175_1.png)\n\nRemember\
