  - '[PAGE 93]


    # Browser ID


    The navigator object has properties that provide information about the browser
    that is being used to view a document.


    The browser name is revealed by the navigator.appName property whereas a description
    of that particular version is available from the navigator.userAgent property.


    In addition to the release number the navigator.userAgent property contains other
    details, such as the host platform type.


    In the example below the navigator-userAgent property reveals the browsers to
    be Internet Explorer 6.0 (MSIE 6.0) and Netscape 7.0 running on a Windows XP platform
    (NT5.1):


    ![](img/5f5106681c8c7072e64c4ea87c891513_93_0.png)


    ```

    get the browser name

    var browser = navigator.appName;

    // get the browser description

    var description = navigator.userAgent;

    ndisplay the browser name and version

    alert( browser + "\n\n" + description );

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_93_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_93_2.png)'
  - '[PAGE 94]


    # Cross-browser compliance


    In order for Web pages to display as desired it is sometimes necessary to identify
    the Document Object Model (DOM) which that browser supports.


    Release 4.0 of both Netscape and Internet Explorer browsers added DOM support
    for dynamic HTML (DHTML). For this purpose Netscape introduced the document.layers
    property and Microsoft introduced the document.all property.


    More recently, release 6.0 of Netscape and release 5.0 of Internet Explorer introduced
    support for a DOM devised by the World Web Consortium (W3C). Crucially, this added
    a method called document.getElementById() that can be used to reference an HTML
    element by a page name assigned to its id attribute. For instance, document.getElementById("pic")
    could be used to reference a HTML element with an id value of "pic". For example,
    <img id="pic" src="pic.gif" alt="Fascinating Picture">


    As Web browsers are free software the overwhelming majority of browsers now in
    use support the W3C DOM.


    ![](img/5f5106681c8c7072e64c4ea87c891513_94_0.png)


    It is convenient to test for the existence document.layers, document.all and document.getElementById()
    to discover which DOM is supported by the browser.


    ![](img/5f5106681c8c7072e64c4ea87c891513_94_1.png)


    ```

    # cross-browser DOM test

    if(document.getElementById) alert("W3C DOM Supported");

    else

    if (document.all) alert("MSIE 4 DOM Supported");

    else

    if (document.layers) alert("NN 4 DOM Supported");

    else alert("This is a really old Web browser");

    ```


    dom-test.js


    ![](img/5f5106681c8c7072e64c4ea87c891513_94_2.png)


    8. Addressing page objects | 93'
  - '[PAGE 95]


    # Platform check


    The performance of a Web page may be affected by the operating system on which
    the browser is running due to some lack of support for the page content.


    For example, a Web browser running on a Linux platform will not support Microsoft
    ActiveX controls. So any Web page containing an ActiveX control will not perform
    as intended on that platform.


    Platform-specific scripting can be achieved, in a similar manner to that used
    for browser-specific scripting, with the `navigator.platform` property.


    This property contains a short string representing the user''s operating system
    and can be read to branch the script to accommodate any platform limitations.


    The example below writes out the `navigator.platform` value:


    ```

    ```js

    get the operating system type

    var os = navigator.platform;

    document.write("Operating system is " + os);

    ```

    ```


    ActiveX controls are one way to create interface features on Web documents.


    The document.write() method is used to have JavaScript write content into the
    page dynamically - it can write HTML tags too.


