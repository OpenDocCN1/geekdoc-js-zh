- md: "\n## Math methods\n\nThe JavaScript Math object has many methods – all of them\
    \ are listed in the table below:\n\n| Method | Description |\n|---|---|\n| Math.abs()\
    \ | return an absolute value |\n| Math.acos() | return an arc cosine |\n| Math.asin()\
    \ | return an arc sine |\n| Math.atan() | return an arc tangent |\n| Math.atan2()\
    \ | return angle from an X-axis to a point |\n| Math.ceil() | round a number up\
    \ |\n| Math.cos() | return a cosine value |\n| Math.exp() | return an exponent\
    \ of constant e |\n| Math.floor() | round down |\n| Math.log() | return a natural\
    \ logarithm |\n| Math.max() | return the larger of two numbers |\n| Math.min()\
    \ | return the smaller of two numbers |\n| Math.pow() | return the power value\
    \ |\n| Math.random() | return a random number |\n| Math.round() | round to the\
    \ nearest integer |\n| Math.sin() | return a sine value |\n| Math.sqrt() | return\
    \ the square root |\n| Math.tan() | return a tangent value |\n\nMath.random()\
    \ has many uses in Web pages to provide varied page content.\n\nThe Math methods\
    \ most commonly used from the above list are examined in more detail on the following\
    \ pages.\n\n## Rounding floats\n\nThe Math.round() method in JavaScript is useful\
    \ both to round floating-point numbers to the nearest integer and commute long\
    \ floating-point numbers to shorter rounded versions. Commonly this will be to\
    \ reduce a long floating point number to two decimal places.\n\nIf the floating\
    \ point value given as the method argument is exactly halfway between two integers\
    \ the method will round up to the nearest integer.\n\nThe example given below\
    \ illustrates the way that the Math.round() method handles rounding of positive\
    \ and negative halfway values and shows how it may be used to commute a long floating-point\
    \ number to two places:\n\n```javascript\nvar a = 7.5;\na = Math.round(a);\na\
    \ = \"Rounded Positive : \"+a+\" \\n\";\n\nvar b = -7.5;\nb = Math.round(b);\n\
    b = \"Rounded Negative : \"+b+\" \\n\";\n```\n\nRounding -7.5 does not give the\
    \ result -8.0 because that would be a higher number, and so that would be rounding\
    \ down.\n\n```javascript\nvar c = 3.764638467915;\nc = c * 100; // take it up\
    \ two places\nc = Math.round(c); // do the round\nc /= 100; // take it back 2\
    \ places\nc = \"Commuted Long Float : \"+c;\nalert(a+b+c);\n```\n\n## Forcing\
    \ floats\n\nAs an alternative to using the Math.round() method detailed on the\
    \ previous page the script may require that the float be selectively forced to\
    \ the nearest integer, above or below.\n\nJavaScript provides the Math.ceil()\
    \ method to force rounding up to the nearest integer and the Math.floor() method\
    \ rounds to the nearest integer.\n\nThe example below illustrates both methods\
    \ in action with both positive and negative values:\n\n```javascript\nvar a =\
    \ 7.5;\nvar a1 = \"a1\" : + Math.ceil(a);\nvar a2 = \"a2\" : + Math.floor(a);\n\
    var b = -7.5;\nvar b1 = \"b1\" : + Math.ceil(b);\nvar b2 = \"b2\" : + Math.floor(b);\n\
    var rup = \"ROUNDING UP\\n\" + a1 + \"\\n\" + b1 + \"\\n\";\nvar rdn = \"ROUNDING\
    \ DOWN\\n\" + a2 + \"\\n\" + b2;\n\nalert( rup + rdn );\n```\n\n## Comparing numbers\n\
    \nThe Math object has two methods allowing comparison of two numbers with a return\
    \ of the higher or lower value.\n\nMath.max() accepts the two values for comparison\
    \ as arguments and will return the higher of the two values.\n\nThe Math.min()\
    \ method works in precisely the same way returns the lower of the two given values.\n\
    \nIn the example below the Math.pow() method is used to create square and cube\
    \ values that are then compared with Math.max() and Math.min().\n\nThe Math.pow()\
    \ method requires two arguments to specify the power by which to raise that number:\n\
    \n```javascript\nvar sq = Math.pow( 5, 2 );\nvar cb = Math.pow( 3, 3 );\nvar hi\
    \ = \"Round up : \" + Math.max( sq, cb );\nvar lo = \"Round Down : \" + Math.min(\
    \ sq, cb );\nvar ng = \"Round Negative : \" + Math.max( -5, -7.5 );\nalert(\"\
    MAX\\n\" + hi + \"\\n\" + lo + \"\\n\" + ng);\n```\n\n## Random generator\n\n\
    Random numbers can be generated using the Math.random() method to return a floating-point\
    \ value between 0.0 and 1.0. This method can be used to create series of random\
    \ selections, like lottery draw, and is popular for producing random effects within\
    \ Web pages.\n\nMultiplying the random number will specify a wider range, for\
    \ example a multiplier of 10 will create a random number now between 0.0. To make\
    \ the randomly generated number useful it is generally best to round up the float\
    \ so that range becomes integer values. The Math.ceil() method will be used to\
    \ round the random number up to an integer between 1 and 10. The code below illustrates\
    \ this:\n\n```javascript\n// get a random number from 0.0 to 1.0\nvar rand1 =\
    \ Math.random();\n// multiply by 10 to make it between 0.0 and 10\nvar rand2 =\
    \ rand1 * 10;\n// round up it to make it between 1 and 10\nvar rand3 = Math.ceil(rand2);\n\
    \n// add each part to a string\nvar str = \"Random float [rand1]: \" + rand1 +\
    \ \" \\n\";\nstr += \"Specify range [rand2]: \" + rand2 + \" \\n\";\nstr += \"\
    Random integer [rand3]: \" + rand3;\n// display the string\nalert(str);\n```\n\
    \n### JavaScript Application\nRandom float [rand1]: 0.88847652642702\nSpecify\
