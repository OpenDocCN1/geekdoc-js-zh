  md: "# Option lists\n\nThe <option> items in a HTML <select> list have a text property\
    \ for each displayed string label and an associated value property. These are\
    \ equivalent to the HTML name and value attributes of each <option> element in\
    \ the <select> list.\n\nThis name=value pair is sent to the server when the form\
    \ is submitted.\n\nAll menu items are stored in the <select> object's options[]\
    \ array and both the text name label and its associated value may be dynamically\
    \ written by JavaScript.\n\nThis example dynamically sets the label name and the\
    \ associated value of all three option items in a drop-down list. The form has\
    \ the simple id of f and the <select> element has the id of menu.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_135_0.png)\n\
    \nThe [option] elements must be initially created by the HTML code.\n\n```\n//\
    \ a function to set the name and values of list options items\nfunction set_options()\
    \ {\n  with(document.forms.f.menu) {\n    options[0].text = \"One\"; options[0].value\
    \ = \"1\";\n    options[1].text = \"Two\"; options[1].value = \"2\";\n    options[2].text\
    \ = \"Three\"; options[2].value = \"3\";\n  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_135_1.png)"
  merge: -1
  pgno: 135
- img_proc: true
  md: "# Selected index\n\nAn options[] array has a property called currentIndex that\
    \ contains the index number of the item currently selected.\n\nJavaScript can\
    \ usefully retrieve the value of the current selection for dynamic effects.\n\n\
    This example extracts the value of the current selection for display in a text\
    \ box. The form has the id of f and the <select> element has the id of city. The\
    \ function is called by the onclick attribute of the button when the user clicks\
    \ it.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_136_0.png)\n\n> HOT TIP\nThis\
    \ example could use a with statement to make the script more concise.\n\n```\n\
    a function to get the selected item in a list\nfunction get_selected() {\n   \
