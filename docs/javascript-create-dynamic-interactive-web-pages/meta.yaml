  - '[PAGE 145]


    # Mouse over


    A MouseOver event occurs when the user places the cursor over an object on a Web
    page.


    The anchor <a> element can specify an event-handler for the MouseOver event by
    assigning a JavaScript function call to the HTML onmouseover attribute, like this:


    ```

    <a href="target.html" onmouseover="do_mouseover()">

    ```


    Most frequently the event-handler will perform an image swap as rollover effect
    but any statements may be executed.


    The example below assigns a string value to an input text box when the cursor
    is placed over an image:


    ```

    a function to react to the MOUSEOVER event

    function do_mouseover()

    {

    display a message in a form field

    document.forms.f.txt.value = "Mouse is Over the link";

    }

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_145_0.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_145_1.png)'
  - "[PAGE 146]\n\n# # Mouse out\n\nA MouseOut event occurs when the user moves the\
    \ cursor away from an HTML hyperlink on a Web page.\n\nThe anchor \\&lt;a&gt;\
    \ \\lt;/a&gt; element can specify an event-handler for the MouseOut event by assigning\
    \ a JavaScript function call to the HTML onmouseout attribute, like this:\n\n\
    ```\n<a href=\"target.html\" onmouseout=\"do_mouseout()\" onmouseover=\"do_mouseover()\"\
    >\n```\n\nMost frequently the event-handler will perform an image swap to return\
    \ an image to its original state in a rollover.\n\nThe following example builds\
    \ on the previous example by adding an onmouseout event-handler to change the\
    \ value of a text box when the cursor moves off the link:\n\n```\na function to\
    \ react to the MOUSEOUT\nfunction do_mouseout()\n{\n  document.forms.f.txt.value\
    \ = \"Mouse is Off the link\";\n}\n\n// a function to react to the MOUSEOVER event\n\
    function do_mouseover()\n{\n  document.forms.f.txt.value = \"Mouse is Over the\
    \ link\";\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_146_0.png)\n\nThis\
    \ illustration shows the text field after the cursor has moved over the image.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_146_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_146_2.png)\n\
    \n12. Event-handlers | 145"
  - "[PAGE 147]\n\n# Mouse down and mouse up\n\nA MouseDown event occurs when the\
    \ user presses a mouse button and a MouseUp event occurs when it is released.\n\
    \nTypically these are used together so that a single mouse click will use two\
    \ event-handlers, like this:\n\n```\n<input type=\"button\" value=\"Light Switch\"\
    \nonmousedown = \"light(1)\" onmouseover=\"light(0)\">\n```\n\nThis example swaps\
    \ an image and changes the value of a text box when the cursor is over and a mouse\
    \ button is pressed. It reverts to their original state when the button is released:\n\
    \n```\n// a function to react to MOUSEDOWN and MOUSEUP events\nfunction light(n)\
    \ {\n  if( n == 1 ) {\n    document.images.bulb.src = \"bulbon.gif\";\n    document.forms.f.txt.value\
    \ = \"Button is Down\";\n  }\n  if( n == 0 ) {\n    document.images.bulb.src =\
    \ \"bulboff.gif\";\n    document.forms.f.txt.value = \"Button is Up\";\n  }\n\
    }\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_147_0.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_147_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_147_2.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_147_3.png)\n\
    \n146 JavaScript in easy steps"
  - "[PAGE 148]\n\n# Mouse buttons\n\nJavaScript properties can determine which mouse\
    \ button has been pressed by examining the MouseDown event.\n\nWith Internet Explorer\
    \ the left mouse button stores an integer value of 1 in the event.button property,\
    \ the right mouse button stores an integer value of 2 and the center button, if\
    \ present, stores an integer value of 3.\n\nHere this property is used to inhibit\
    \ the Internet Explorer context menu that normally appears when the right mouse\
    \ button is pressed by the user:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_148_0.png)\n\
    \n```\nstore a default message\nvar msg = \"Right-Click Context Menu Is Disabled\"\
    \n// a function to stop the IE context menu\nfunction stopmenu(e) {\n    for Internet\
    \ Explorer browsers\n    if(navigator.appName == \"Microsoft Internet Explorer\"\
    \n    && event.button == 2 || event.button == 3 )) {\n        alert( msg);\n \
    \       return false;\n    }\n```\n\n```\n// specify the onmousedown event-handler\n\
    document.onmousedown = stopmenu;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_148_1.png)\n\
    \n12. Event-handlers"
- md: "\n## Key down and key up\n\nA KeyDown event occurs when the user presses a\
    \ keyboard key button and a Key event occurs when it is released. Typically these\
    \ are used together so that a single key depression will use two event-handlers.\n\
    \nThis example swaps an image and changes the value of a text box when a keyboard\
    \ key button is pressed and reverts both to their original state when the key\
    \ button is released:\n\n```javascript\nNetscape/Mozilla capture events instruction\n\
    if (navigator.appName == \"Netscape\") \nwindow.captureEvents ( Event.KEYDOWN,\
    \ Event.KEYUP );\n```\n\n### a function to react to KEYDOWN events\n\n```javascript\n\
    function isdown()\n{\ndocument.images.bulb.src = \"bulbon.gif\";\ndocument.forms.f.txt.value\
    \ = \"Key is Down\";\n}\n```\n\n### a function to react to KEYUP events\n\n```javascript\n\
    function isup()\n{\ndocument.images.bulb.src = \"bulboff.gif\";\ndocument.forms.f.txt.value\
    \ = \"Key is Up\";\n}\n```\n\n### define the event-handlers\n\n```javascript\n\
    document.onkeydown = isdown;\ndocument.onkeyup = isup;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_149_0.png)\n\
    \nNotice how the first two lines of this script capture both KeyDown and KeyUp\
    \ events for Netscape/Mozilla browsers.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_149_1.png)\n\
    \n| KeyUp and KeyDown | |\n| File | Edit | View | Favorites |\n| Key is Down |\
    \ |\n| Done | |\n\n| KeyUp and KeyDown | |\n| File | Edit | View | Favorites |\n\
    | Key is Up | |\n| Done | |\n\n148 | JavaScript in easy steps\n\n## Key codes\n\
    \nThe KeyDown event can also be used to get the Unicode character code number\
    \ of a key depression.\n\nThis example looks for the Y and N character codes,\
    \ in both upper and lower case, then branches the script according to the value.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_150_0.png)\n\n```javascript\nif( navigator.appName\
    \ == \"Netscape\"\nwindow.captureEvents( Event.KEYDOWN );\n```\n\n```javascript\n\
    function showkey(e) {\n  var msg = \"\", fwd = \"Y pressed\", hlt = \"N pressed\"\
    ;\n  // key codes in Netscape/Mozilla browsers\n  if( navigator.appName == \"\
    Netscape\") {\n    if( e.which == 89 || e.which == 121 ) msg = fwd;\n    if( e.which\
    \ == 78 || e.which == 110) msg = hlt;\n  }\n\n  // check key codes in Internet\
    \ Explorer\n  if( navigator.appName == \"Microsoft Internet Explorer\") {\n  \
    \  if(event.keyCode==89 || event.keyCode==121)msg= fwd;\n    if(event.keyCode==78\
    \ || event.keyCode==110)msg= hlt;\n  }\n\n  if( msg != \"\") alert(msg);\n  //\
    \ line the event-handler\n  document.onkeydown=showkey;\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_150_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_150_2.png)\n\n## Load\n\nThe Load event\
    \ does not occur until all the HTML elements on a Web page have completely loaded.\
    \ This means that the onload event-handler will only run after all the elements\
    \ are present.\n\nIf JavaScript is to modify elements of the document <body> section\
    \ those elements must already be loaded to avoid receiving a script error. \n\n\
    Typically the onload event-handler will call a JavaScript function, named init(),\
    \ that will initialize a number of values.\n\nThis example sets the HTML page\
    \ colors, then it assigns a value to a variable which it subsequently assigns\
    \ to a form text box:\n\n```javascript\n// a function to react to the LOAD event\n\
    function init() {\n  // set foreground and background colors\n  document.bgColor\
    \ = \"orange\";\n  document.fgColor = \"blue\";\n\n  // store a string then display\
    \ it in a form field\n  var str = \"The Page is Loaded\";\n  document.forms.f.txt.value\
    \ = str;\n}\n\n// specify the onload event-handler\nwindow.onload = init;\n```\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_151_0.png)\n\nA HTML event-handler\
    \ assigned to the onload attribute of the <body> tag would replace that assigned\
    \ in the script.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_151_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_151_2.png)\n\
    \n## Unload\n\nThe Unload event occurs whenever the browser unloads a document\
    \ from a window, or frame, usually when the user navigates to a new URL.\n\nThe\
    \ onclick event-handler may call a final JavaScript function to be run just before\
    \ the document unloads. When a frames page is unloaded the onload event-handler\
    \ of each frame may call a final function.\n\nThe onclick event-handler is useful\
    \ to save the final state of data on that page in a cookie or by submission to\
    \ the server.\n\nIt is also used to open new pop-up windows containing further\
    \ information that the user may find.\n\nThe example below illustrates the use\
    \ of the onload event-handler to open a new pop-up window:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_152_0.png)\n\
    \n```javascript\n// a function to react to the UNLOAD event\nfunction leaving()\n\
    {\n  // open a HTML document in a pop-up\n  var win = window.open(\"finally.html\"\
    , \"\", \"top=50,left=50,width=300,height=100\");\n}\n\n// specify the onload\
    \ event-handler\nwindow.onunload = leaving;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_152_1.png)\n\
    \n| Unload Event | |\n| File | Edit | View | Favorites |\n| Go to | |\n| Visit\
    \ | |\n\n## Focus\n\nThe Focus event occurs when the browser focus moves to an\
    \ element, and the onfocus event-handler can call a JavaScript function.\n\nThe\
    \ onfocus method can be added to HTML elements to receive focus.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_153_0.png)\n\
    \n```html\n<input type=\"text\" name=\"txt1\" value=\"Enter here\" onfocus=\"\
    wipe(this)\">\n<input type=\"text\" name=\"txt2\" value=\"Enter here\" onfocus=\"\
    wipe(this)\">\n```\n\nIn the following example, the user is reminded that they\
    \ have just left the field.\n\n```javascript\n// a function to clear input\nfunction\
    \ wipe(obj) {\n  if (obj.value == \"\") {\n    alert(\"Please enter data\");\n\
    \  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_153_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_153_2.png)\n\
    \n## Blur\n\nThe Blur event occurs when the browser focus moves away from an element.\
    \ The onblur event-handler is useful for text boxes that must be read-only.\n\n\
    In the following example, the user has left the field:\n\n```javascript\n// a\
    \ function to examine passed argument\nfunction is_entry(val) {\n  if (val ==\
    \ \"\") {\n    alert(\"Please enter data\");\n  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_154_0.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_154_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_154_2.png)\n\
    \n12. Event-handlers | 155\n\n## Change\n\nThe Change event occurs when the value\
    \ of a text input is changed or when the user selects an item in an options list.\n\
    \nThe onchange event-handler can call a JavaScript function to execute some code\
    \ whenever the event occurs.\n\nThe example below sets the initial selection to\
    \ Green then assigns an event-handler that displays the associated value in a\
    \ text box whenever the selection is changed:\n\n```javascript\n// a function\
    \ to set the selected item in a list\nfunction init() {\n  document.forms.f.s.options[1].selected\
    \ = true;\n  // specify an onchange event-handler\n  document.forms.f.s.onchange\
    \ = show_selected;\n}\n\n// a function to display the selected list item\nfunction\
    \ show_selected() {\n  document.forms.f.txt.value = document.forms.f.s.options(document.forms.f.s.selectedIndex).value;\n\
    }\n\n// specify the onload event-handler\nwindow.onload = init;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_155_0.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_155_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_155_2.png)\n"
  mdcn: "\n\n## 按键按下与松开\n\n当用户按下键盘按键时会发生 KeyDown 事件，当释放按键时会发生 Key 事件。通常，这些事件被一起使用，以便单个按键按下操作会使用两个事件处理器。\n\
    \n此示例在按下键盘按键时切换图像并更改文本框的值，并在释放按键时将两者都恢复到原始状态：\n\n```javascript\nNetscape/Mozilla\
    \ capture events instruction\nif (navigator.appName == \"Netscape\") \nwindow.captureEvents\
    \ ( Event.KEYDOWN, Event.KEYUP );\n```\n\n### 一个响应 KEYDOWN 事件的函数\n\n```javascript\n\
    function isdown()\n{\ndocument.images.bulb.src = \"bulbon.gif\";\ndocument.forms.f.txt.value\
    \ = \"Key is Down\";\n}\n```\n\n### 一个响应 KEYUP 事件的函数\n\n```javascript\nfunction\
    \ isup()\n{\ndocument.images.bulb.src = \"bulboff.gif\";\ndocument.forms.f.txt.value\
    \ = \"Key is Up\";\n}\n```\n\n### 定义事件处理器\n\n```javascript\ndocument.onkeydown\
    \ = isdown;\ndocument.onkeyup = isup;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_149_0.png)\n\
    \n注意此脚本的前两行如何捕获 Netscape/Mozilla 浏览器的 KeyDown 和 KeyUp 事件。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_149_1.png)\n\
    \n| 松开与按下 | |\n| 文件 | 编辑 | 视图 | 收藏 |\n| 键已按下 | |\n| 完成 | |\n\n| 松开与按下 | |\n| 文件\
    \ | 编辑 | 视图 | 收藏 |\n| 键已松开 | |\n| 完成 | |\n\n148 | JavaScript 快速入门\n\n## 键键码\n\n\
    KeyDown 事件也可用于获取按键按下时的 Unicode 字符编码数字。\n\n此示例查找 Y 和 N 字符编码（包括大和小写），然后根据值对脚本进行分支处理。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_150_0.png)\n\n```javascript\nif( navigator.appName\
    \ == \"Netscape\"\nwindow.captureEvents( Event.KEYDOWN );\n```\n\n```javascript\n\
    function showkey(e) {\n  var msg = \"\", fwd = \"Y pressed\", hlt = \"N pressed\"\
    ;\n  // Netscape/Mozilla 浏览器中的键码\n  if( navigator.appName == \"Netscape\") {\n\
    \    if( e.which == 89 || e.which == 121 ) msg = fwd;\n    if( e.which == 78 ||\
    \ e.which == 110) msg = hlt;\n  }\n\n  // Internet Explorer 中的键码检查\n  if( navigator.appName\
    \ == \"Microsoft Internet Explorer\") {\n    if(event.keyCode==89 || event.keyCode==121)msg=\
    \ fwd;\n    if(event.keyCode==78 || event.keyCode==110)msg= hlt;\n  }\n\n  if(\
    \ msg != \"\") alert(msg);\n  // 绑定事件处理器\n  document.onkeydown=showkey;\n}\n```\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_150_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_150_2.png)\n\
    \n## 加载 (Load)\n\n在 Web 页面上所有的 HTML 元素完全加载之前，Load 事件不会发生。这意味着 onload 事件处理器只有在所有元素存在后才会运行。\n\
    \n如果 JavaScript 要修改文档 `<body>` 部分的元素，这些元素必须已经加载，以避免接收脚本错误。\n\n通常，onload 事件处理器会调用一个名为\
    \ `init()` 的 JavaScript 函数，该函数将初始化多个值。\n\n```javascript\n// 一个响应 LOAD 事件的函数\n\
    function init() {\n  // 设置前景颜色和背景颜色\n  document.bgColor = \"orange\";\n  document.fgColor\
    \ = \"blue\";\n\n  // 存储字符串然后在表单字段中显示\n  var str = \"The Page is Loaded\";\n \
    \ document.forms.f.txt.value = str;\n}\n\n// 指定 onload 事件处理器\nwindow.onload =\
    \ init;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_151_0.png)\n\n分配给 `<body>`\
    \ 标签 `onload` 属性的 HTML 事件处理器将替换脚本中分配的那个。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_151_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_151_2.png)\n\n## 卸载 (Unload)\n\n当浏览器从窗口或框架中卸载文档时（通常是用户导航到新\
    \ URL 时），会发生 Unload 事件。\n\nonclick 事件处理器可以调用一个最终的 JavaScript 函数，在文档卸载之前运行。当框架页面被卸载时，每个框架的\
    \ onload 事件处理器可能会调用一个最终函数。\n\nonclick 事件处理器用于将该页面数据的最终状态保存到 cookie 中或通过提交到服务器。\n\
    \n它还用于打开包含用户可能感兴趣的进一步信息的弹出窗口。\n\n下面的示例说明了如何使用 onload 事件处理器打开一个新的弹出窗口：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_152_0.png)\n\
    \n```javascript\n// 一个响应 UNLOAD 事件的函数\nfunction leaving()\n{\n  // 在弹出窗口中打开 HTML\
    \ 文档\n  var win = window.open(\"finally.html\", \"\", \"top=50,left=50,width=300,height=100\"\
    );\n}\n\n// 指定 onload 事件处理器\nwindow.onunload = leaving;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_152_1.png)\n\
    \n| 卸载事件 | |\n| 文件 | 编辑 | 视图 | 收藏 |\n| 转到 | |\n| 访问 | |\n\n## 焦点 (Focus)\n\n当浏览器焦点移动到某个元素时会发生\
    \ Focus 事件，onfocus 事件处理器可以调用 JavaScript 函数。\n\n可以将 onfocus 方法添加到 HTML 元素中以接收焦点。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_153_0.png)\n\n```html\n<input type=\"\
    text\" name=\"txt1\" value=\"Enter here\" onfocus=\"wipe(this)\">\n<input type=\"\
    text\" name=\"txt2\" value=\"Enter here\" onfocus=\"wipe(this)\">\n```\n\n在接下来的示例中，用户会被提醒他们刚刚离开了该字段。\n\
    \n```javascript\n// 一个清空输入的函数\nfunction wipe(obj) {\n  if (obj.value == \"\")\
    \ {\n    alert(\"Please enter data\");\n  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_153_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_153_2.png)\n\n## 失去焦点 (Blur)\n\n当浏览器焦点离开某个元素时会发生\
    \ Blur 事件。onblur 事件处理器对于必须只读的文本框很有用。\n\n在下面的示例中，用户已经离开了字段：\n\n```javascript\n\
    // 一个检查传递参数的函数\nfunction is_entry(val) {\n  if (val == \"\") {\n    alert(\"Please\
    \ enter data\");\n  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_154_0.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_154_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_154_2.png)\n\
    \n12. 事件处理器 | 155\n\n## 改变 (Change)\n\n当文本输入的值更改或用户选择选项列表中的项时，会发生 Change 事件。onchange\
    \ 事件处理器可以在事件发生时调用 JavaScript 函数来执行某些代码。\n\n下面的示例设置初始选择为绿色，然后分配一个在选择更改时将关联值显示在文本框中的事件处理器：\n\
    \n```javascript\n// 设置列表选中项的函数\nfunction init() {\n  document.forms.f.s.options[1].selected\
    \ = true;\n  // 指定 onchange 事件处理器\n  document.forms.f.s.onchange = show_selected;\n\
    }\n\n// 一个显示选中列表项的函数\nfunction show_selected() {\n  document.forms.f.txt.value\
    \ = document.forms.f.s.options(document.forms.f.s.selectedIndex).value;\n}\n\n\
    // 指定 onload 事件处理器\nwindow.onload = init;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_155_0.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_155_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_155_2.png)\n\
    \n"
