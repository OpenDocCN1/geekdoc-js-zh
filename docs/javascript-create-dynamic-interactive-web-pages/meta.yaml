  md: "# Set colors\n\nThe properties and methods of the window.document object enable\
    \ a Web page document to be changed at runtime. Using JavaScript to assign new\
    \ values to properties of the window.document object causes the Web browser to\
    \ update the appearance of the Web page in line with the new values.\n\nThe window.part\
    \ of the address bar may be omitted as window is the top DOM object.\n\nThis can\
    \ be simply illustrated by assigning new values to the document.bgColor and document.fgColor\
    \ properties to change the background and foreground colors of a page.\n\nIn this\
    \ example the set_colors() function is called from the HTML onclick attribute\
    \ of the button when the user pushes it:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_113_0.png)\n\
    \n```\n// a function to set the colors of the page\nfunction set_colors() {\n\
    \    window.document.bgColor = \"red\";\n    window.document.fgColor = \"yellow\"\
    ;\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_113_1.png)\n\nNotice the\
    \ capitalization with both bgColor and fgColor.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_113_2.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_113_3.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_113_4.png)"
