  - "[PAGE 33]\n\n# Conditional if\n\nThe if keyword is used to perform the basic\
    \ conditional JavaScript test to evaluate an expression for a boolean value. The\
    \ statement following the evaluation will only be executed when the expression\
    \ returns true. The syntax for the if statement looks like this:\n\n```\nif (test\
    \ expression) statement-to-execute-when-true;\n```\n\nThe code to be executed\
    \ may contain multiple statements if they are enclosed within a pair of curly\
    \ braces to form a statement block.\n\nIn the example below the expression to\
    \ be tested uses the modulus operator to determine if the value contained in the\
    \ variable called num is exactly divisible by 2. The statement has two statements\
    \ — one to assign a string value to a variable and another to call a JavaScript\
    \ function.\n\n```\n// create two variables\nvar msg, num;\num = 7;\n\n// test\
    \ if the number is not exactly divisible by 2\nif ( num % 2 != 0 ) {\n  msg =\
    \ num + \" is an odd number.\";\n  alert( msg);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_33_0.png)\n\
    \n> The expression could have used (num%2==1) to detect an odd number.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_33_1.png)"
