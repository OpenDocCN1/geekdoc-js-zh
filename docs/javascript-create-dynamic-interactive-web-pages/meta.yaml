    MAX\\n\" + hi + \"\\n\" + lo + \"\\n\" + ng);\n```\n\n## 随机生成器\n\n可以使用 Math.random()\
    \ 方法生成一个 0.0 到 1.0 之间的浮点值。该方法可以创建一系列随机选择（如抽票），并用于在网页内产生随机效果，非常流行。\n\n乘以随机数可以指定更宽的范围，例如，乘以\
    \ 10 将创建一个现在 0.0 之间的随机数。为了让生成的随机数有用，最好的做法是将浮点数向上舍入，使范围变为整数值。将使用 Math.ceil() 方法将随机数向上舍入到\
    \ 1 到 10 之间的整数。下面的代码说明了这一点：\n\n```javascript\n// 获取从 0.0 到 1.0 的随机数\nvar rand1\
    \ = Math.random();\n// 乘以 10 使其处于 0.0 到 10 之间\nvar rand2 = rand1 * 10;\n// 向上舍入使其处于\
    \ 1 到 10 之间\nvar rand3 = Math.ceil(rand2);\n\n// 将每个部分添加到字符串中\nvar str = \"Random\
    \ float [rand1]: \" + rand1 + \" \\n\";\nstr += \"Specify range [rand2]: \" +\
    \ rand2 + \" \\n\";\nstr += \"Random integer [rand3]: \" + rand3;\n// 显示字符串\n\
    alert(str);\n```\n\n### JavaScript 应用\nRandom float [rand1]: 0.88847652642702\n\
    Specify range [rand2]: 8.88847652642702\nRandom integer [rand3]: 9\n\n## 乐票选择器\n\
    \n此示例使用 Math.random() 在 1 到 49 的范围内生成一系列随机数，这些数字可以作为英国国家乐票的选择：\n\n```javascript\n\
    // 创建变量\nvar i, rand, temp, str;\n// 创建一个包含50个元素的新数组\nvar nums = new Array(50);\n\
    \n// 用数字 1-49 填充元素 1-49\nfor(i = 1; i < 50; i++) nums[i] = i;\n\n// 随机化这些数字的算法\n\
    for(i = 1; i < 50; i++)\n{\n  rand = Math.ceil(Math.random() * 49);\n  temp =\
    \ nums[i];\n  nums[i] = nums[rand];\n  nums[rand] = temp;\n}\n // 将前六个元素添加到字符串\n\
    str = \"Your six lucky numbers are:\\n\\n\";\nfor(i = 1; i < 7; i++)\n{\n  str\
    \ += nums[i];\n  if(i != 6) str += \" - \";\n}\n// 显示字符串\nalert(str);\n```\n\n\
    ## 随机图片\n\n下面的示例中使用 Math.random() 方法从六张图片中随机选择一张显示在网页中。JavaScript 为一个 id 为 pic\
    \ 的 HTML <img> 标签显示图像。要显示的图像是在每次页面加载并执行脚本时确定的。\n\n请记住，包含此 JavaScript 的 <script>\
    \ 元素必须出现在 HTML 文档 body 中 <img> 标签之后，否则代码将无法找到任何 id 为 pic 的元素，因此无法分配随机选择的图像。\n\n\
    ```javascript\n// 创建新数组并为6个元素分配图像\nvar pix = new Array();\npix[0] = \"pic0.gif\"\
    ;\npix[1] = \"pic1.gif\";\npix[2] = \"pic2.gif\";\npix[3] = \"pic3.gif\";\npix[4]\
    \ = \"pic4.gif\";\npix[5] = \"pic5.gif\";\n```\n\n文档属性和方法在第10章中有详细解释。\n\n```javascript\n\
    // 获取 0 到 5 之间的随机整数\nvar rand = Math.floor(Math.random() * 6);\n\n// 将随机图像分配给\
    \ id 为 pic 的 HTML <img> 标签\ndocument.getElementById(\"pic\").src = pix[rand ];\n\
    ```\n\n使用此脚本网页上随机显示横幅。\n\n## 字符串操作\n\n本章解释了字符串特性，并通过示例演示了如何使用 JavaScript 代码处理文本字符串。\n\
    \n## \n\n- 字符串长度 | 76\n- 字符串中的字符 | 77\n- 合并字符串 | 78\n- 搜索字符串 | 79\n- 分离单词 | 80\n\
