  md: '# Random images


    The Math.random() method is used in the following example to randomly select one
    of six images to be displayed in a Web page. The JavaScript displays an image,
    for an HTML <img> tag with an id of pic. The image to display is determined by
    the code each time the page is loaded, and the script is executed.


    It is important to remember that the <script> element to include this JavaScript
    must appear in the body of the HTML document after the <img> tag the code will
    be unable to find any element with an id of pic - so it will be unable to assign
    the randomly selected image.


    ![](img/5f5106681c8c7072e64c4ea87c891513_75_0.png)


    ```

    // create a new array and assign images to 6 elements

    var pix = new Array();npix[0] = "pic0.gif";npix[1] = "pic1.gif";npix[2] = "pic2.gif";npix[3]
    = "pic3.gif";npix[4] = "pic4.gif";npix[5] = "pic5.gif";

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_75_1.png)


    Document properties and methods are fully explained in Chapter 10.


    ```

    // get a random integer between 0 and 5

    var rand = Math.floor(Math.random() * 6);


    // assign random image to the HTML <img> tag of pic id ndocument.getElementById("pic").src
    = pix[ rand ];

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_75_2.png)


    Use this script to randomly display banners on a Web page.


