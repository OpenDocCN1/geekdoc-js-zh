  - '[PAGE 61]


    # Setting date and time


    The JavaScript code may manipulate the Date object information using a variety
    of Date.set() methods.


    These mirror the range of Date.get() methods that are used to extract parts of
    the Date object information but are used instead to set new values.


    In the example below the initial Date object values are stored in the orig variable
    named orig. Then the various Date.set() methods apply new values to the Date object
    information:


    ```

    // create a new Date object

    var now = new Date();


    // store the original date and time information

    var orig = "Original :\n " + now.toString() + "\n\n";


    // set new date and time details

    now.setDate(21);

    now.setMonth(1);

    now.setHours(12);

    now.setMinutes(30);

    now.setSeconds(15);

    now.setFullYear(2005);


    // store the modified date and time information

    var mod = "Modified :\n " + now;

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_61_0.png)


    The toString() method used here returns the string value of JavaScript objects
    and has uses.


    ![](img/5f5106681c8c7072e64c4ea87c891513_61_1.png)


    ```

    // display original and modified date and times

    alert(orig + mod);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_61_2.png)'
- md: "\n# Date strings\n\nIn many instances the Date object information must be converted\
    \ into a string in order to store or use that information.\n\nThe Date.toString()\
    \ method on the facing page does this but it is often preferable to store this\
    \ information in standard UTC time.\n\nJavaScript provides the Date.toGMTString()\
    \ method that both converts the information to a string and converts it to the\
    \ GMT time zone.\n\n> A complete example setting cookies using this method can\
    \ be found in Chapter 10, on page 114.\n\nUsing this method of storing date information\
    \ avoids time confusion and is commonly used as the standard when setting the\
    \ life span of cookie files.\n\nThis simple example illustrates the Date.toGMTString()\
    \ method performing its conversions in a browser in Tokyo, Japan:\n\n```\ncreate\
    \ a new Date object\nvar now = new Date();\n\nstore local time\nvar jpn = \"Tokyo\
    \ Time:\\n\" +now.toString() + \"\\n\\n\";\n\nstore GMT time\nvar gmt = \"UTC\
    \ Time:\\n\" + now.toGMTString();\n\ndisplay local time and GMT time\nalert(jpn\
    \ + gmt);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_62_0.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_62_1.png)\n\
    \n# Using the system clock\n\nWhen a JavaScript window is needed to create an\
    \ action repeatedly in a Web browser the system clock can be used with the JavaScript\
    \ setTimeout() method of the window object.\n\nThe window.setTimeout() method\
    \ can run a function after a specified interval. Two arguments are required stating\
    \ the name of the function to call and the required interval time in milliseconds.\
    \ This method is often used at the end of a function to call the same function\
    \ recursively, following a set delay.\n\nThere is a slideshow script on page 166\
    \ using this method.\n\nMany uses can be found for this method in creating dynamic\
    \ effects. For instance, in slideshow scripts where the function displays successive\
    \ images at given intervals.\n\nThe example here uses the window.setTimeout()\
    \ method to display an alert() dialog box at 10 seconds intervals:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_63_0.png)\n\
    \n```\ncreate and initialize a counter variable\nvar num = 0;\n\n// a recursive\
    \ function to display a message\nfunction timeout() {\n    increment the counter\n\
    \    num++;\n    display the message\n    alert(\"This is 10-Second Message No:\
    \ \" +num);\n    set the interval before calling this function again\n    window.setTimeout(\"\
    timeout\", 10000);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_63_1.png)\n\
    \ncall the function to start the routine\ntimeout();\n\n![](img/5f5106681c8c7072e64c4ea87c891513_63_2.png)\n\
    \n# Cancelling the timer\n\nThe unfortunate viewer of the site containing the\
    \ JavaScript on the previous page would doubtless feel aggrieved at the constant\
    \ alert box messages. It may be better to show the message only a couple of times\
    \ then stop calling the timeout() function.\n\nThe window.setTimeout() method\
    \ can be cancelled easily using the window.clearTimeout() method.\n\nIn order\
    \ to clear the timer correctly it is necessary to assign the original window.setTimeout()\
    \ call to a variable – so that variable can be passed as the window.clearTimeout()\
    \ call argument.\n\nThe following example displays a message twice, then displays\
    \ a final message when the timer is cleared:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_64_0.png)\n\
    \nThe variable name tim is often used to name the timer variable.\n\n```\ncreate\
    \ a counter variable and a timer variable\nvar num = 0, tim;\n\nfunction timeout()\
    \ {\n  num++;\n  if ( num == 3 ) {\n    alert(\"OK - I told you twice\");\n  \
    \  window.clearTimeout( tim ); // cancel the timer\n  }\n  else {\n    alert(\"\
    This is 10-Second Message No : \" + num);\n    tim = window.setTimeout(\"timeout()\"\
    , 10000 );\n  }\n}\ntime();\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_64_1.png)\n\
    \n# JavaScript clock\n\nUtilizing the Date object with a timer can create a time\
    \ display that updates every second to produce a clock.\n\nThe example below displays\
    \ the local time dynamically in an HTML form text input named clock – the form\
    \ id is simply named f:\n\n```\nfunction tick() {\n  // create a new Date object\n\
    \  var now = new Date();\n\n  // extract the current hours, minutes and seconds\n\
    \  var hh = now.getHours();\n  var mn = now.getMinutes();\n  var ss = now.getSeconds();\n\
    \n  // ensure each component has two digits\n  if (hh < 9) hh = \"0\" + hh;\n\
    \  if (mn <= 9) mn = \"0\" + mn;\n  if (ss <= 9) ss = \"0\" + ss;\n\n  // assign\
    \ the current time to the form\n  document.forms.f.clock.value = hh + \": \" +\
    \ mn + \": \" + ss;\n\n  // set the interval to one second\n  window.setTimeout(\"\
    tick\", 1000);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_65_0.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_65_1.png)\n\nThe clock needs to be\
    \ started by calling the tick() function from the HTML <body>-<body onload=\"\
    tick()\"> ensures that the form has been created before JavaScript attempts to\
    \ assign the time to its clock field.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_65_2.png)\n\
    \n# Doing mathematics\n\nThis chapter is devoted to the JavaScript Math object\
    \ and describes the constant values and methods that are available to perform\
    \ mathematical calculations. The subject of random number generation is covered\
    \ and is illustrated with a practical example.\n\n## Contents\n- Math constants\n\
    - Using pi\n- Math methods\n- Rounding floats\n- Forcing floats\n- Comparing numbers\n\
    - Random generator\n- Lottery picker\n- Random images\n\n# Math constants\n\n\
    The intrinsic Math object contains a number of standard mathematical values for\
    \ easy reference. Uppercase is always used to refer to the constant values which\
    \ are all listed in the following table:\n\n| | Description |\n| :--- | :--- |\n\
    | Math.E | The constant e base of the natural logarithm with a value of approximately\
    \ 2.71828 |\n| Math.LN2 | The natural logarithm of 2 approximately 0.693147180599452862\
    \ |\n| Math.LN10 | The natural logarithm of 10 approximately 2.30258509299405911\
    \ |\n| Math.LOG2E | The base-2 logarithm of e approximately 1.4426950408896378\
    \ |\n| Math.LOG10E | The base-10 logarithm of e approximately 0.43249481903251867\
    \ |\n| Math.PI | The constant pi approximately 3.14159265358979 |\n| Math.SQRT12\
    \ | The reciprocal of the square root of 2 approximately 0.707106781186476 |\n\
    | Math.SQRT2 | The square root of 2 with a value of approximately 1.4142135623730951\
    \ |\n\n![](img/5f5106681c8c7072e64c4ea87c891513_67_0.png)\n\nThe Math constants\
    \ can be used anywhere within a script. Most of the Math constants are used only\
    \ in JavaScript applications that have a particular mathematical purpose but the\
    \ full list is given above for completeness. The Math.PI constant creates interesting\
    \ possibilities with dynamic effects. The following example script dynamically\
    \ rotates a layer named div:\n\n# Using pi\n\n![](img/5f5106681c8c7072e64c4ea87c891513_68_0.png)\n\
    \n```\nvar pos = 0;\n\nfunction to rotate a div with id of \"d1\"\nfunction spin()\
    \ {\n  // get the div's style object\n  var obj_style = document.getElementById(\"\
    d1\").style;\n  // desired radius and x, y offsets\n  var radius = 40;\n  var\
    \ x_offset = 50;\n  var y_offset = 50;\n\n  // get the new position\n  pos +=\
    \ 10;\n  var x = radius * Math.cos(pos * Math.PI/180);\n  var y = radius * Math.sin(pos\
    \ * Math.PI/180);\n\n  x += x_offset;\n  y += y_offset;\n  // move the div to\
    \ its new coordinates\n  obj_style.left = x + \"px\";\n  obj_style.top = y + \"\
    px\";\n  // set the interval to call this function again\n  setTimeout(spin(),\
    \ 100);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_68_1.png)\n\nThe Math.cos()\
    \ and Math.sin() functions are used to calculate the cosine and sine of an angle\
    \ in radians. These are used to calculate the coordinates of a circle.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_68_2.png)\n\
    \nThis routine is started by calling the spin() function on page load using the\
    \ onload attribute of the HTML <body> tag-<body onload=\"spin()\">\n\n![](img/5f5106681c8c7072e64c4ea87c891513_68_3.png)\n"
  mdcn: "\n\n# 日期字符串\n\n在许多情况下，必须将 Date 对象的信息转换为字符串，以便存储或使用这些信息。\n\n上一页中的 `Date.toString()`\
    \ 方法可以实现此功能，但通常更倾向于将这些信息存储为标准的 UTC 时间。\n\nJavaScript 提供了 `Date.toGMTString()`\
    \ 方法，它既可以将信息转换为字符串，又将其转换为 GMT 时区。\n\n> 关于使用此方法设置 cookie 的完整示例，可以参考第 10 章第 114\
    \ 页。\n\n使用这种方法存储日期信息可以避免时间混淆，并通常在设置 cookie 文件的生命周期时作为标准使用。\n\n这个简单的示例展示了 `Date.toGMTString()`\
    \ 方法在位于日本东京的浏览器中执行转换的过程：\n\n```\n创建一个新的 Date 对象\nvar now = new Date();\n\n//存储本地时间\n\
    var jpn = \"Tokyo Time:\\n\" +now.toString() + \"\\n\\n\";\n\n//存储 GMT 时间\nvar\
    \ gmt = \"UTC Time:\\n\" + now.toGMTString();\n\n//显示本地时间和 GMT 时间\nalert(jpn +\
    \ gmt);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_62_0.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_62_1.png)\n\
    \n# 使用系统时钟\n\n当需要 JavaScript 窗口在 Web 浏览器中重复创建动作时，可以使用系统时结合窗口对象的 `setTimeout()`\
    \ 方法。\n\n`window.setTimeout()` 方法可以在指定的间隔后运行函数。它需要两个参数，分别指定要调用的函数名称以及以毫秒为单位的间隔时间。该方法通常用于函数的末尾，以便在设置延迟后递归地调用同一个函数。\n\
    \n第 166 页有一个使用此方法的幻灯片脚本。\n\n该方法在创建动态效果方面有许多用途。例如，在幻灯片脚本中，函数按给定的间隔显示连续图像。\n\n此处的示例使用\
    \ `window.setTimeout()` 方法每隔 10 秒显示一次 `alert()` 对话框：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_63_0.png)\n\
    \n```\n创建并初始化计数器变量\nvar num = 0;\n\n// 一个显示消息的递归函数\nfunction timeout() {\n   \
    \ // 增加计数器\n    num++;\n    // 显示消息\n    alert(\"This is 10-Second Message No:\
    \ \" +num);\n    // 在再次调用此函数之前设置间隔\n    window.setTimeout(\"timeout\", 10000);\n\
    }\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_63_1.png)\n\n调用函数启动程序\ntimeout();\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_63_2.png)\n\n# 取消计时器\n\n上一页包含 JavaScript\
    \ 的网站的不幸访问无疑会对不断弹出的 alert 框消息感到恼恼。只显示几次消息然后停止调用 `timeout()` 函数可能会更好。\n\n可以使用 `window.clearTimeout()`\
    \ 方法轻松取消 `window.setTimeout()` 方法。\n\n为了正确清除计时器，有必要将原始的 `window.setTimeout()`\
    \ 调用赋值一个变量——这样该变量就可以作为 `window.clearTimeout()` 调用的参数传递。\n\n以下示例显示两次消息，然后在计时器清除后显示最后一条消息：\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_64_0.png)\n\n变量名 `tim` 通常用于命名计时器变量。\n\
    \n```\n创建一个计数器变量和一个计时器变量\nvar num = 0, tim;\n\nfunction timeout() {\n  num++;\n\
    \  if ( num == 3 ) {\n    alert(\"OK - I told you twice\");\n    window.clearTimeout(\
    \ tim ); // 取消计时器\n  }\n  else {\n    alert(\"This is 10-Second Message No : \"\
    \ + num);\n    tim = window.setTimeout(\"timeout()\", 10000 );\n  }\n}\ntime();\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_64_1.png)\n\n# JavaScript 钟\n\n\
    利用 Date 对象结合计时器可以创建一个每秒更新一次的时间显示，从而产生一个时钟。\n\n下面的示例在名为 `clock` 的 HTML 表单文本输入框中动态显示本地时间——表单\
    \ ID 简单名为 `f`：\n\n```\nfunction tick() {\n  // 创建一个新的 Date 对象\n  var now = new\
    \ Date();\n\n  // 提取当前的时、分、秒\n  var hh = now.getHours();\n  var mn = now.getMinutes();\n\
    \  var ss = now.getSeconds();\n\n  // 确保每个组件都有两位数\n  if (hh < 9) hh = \"0\" +\
    \ hh;\n  if (mn <= 9) mn = \"0\" + mn;\n  if (ss <= 9) ss = \"0\" + ss;\n\n  //\
    \ 将当前时间赋值给表单\n  document.forms.f.clock.value = hh + \": \" + mn + \": \" + ss;\n\
    \n  // 将间隔为一秒\n  window.setTimeout(\"tick\", 1000);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_65_0.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_65_1.png)\n\n需要通过从 HTML `<body>` 中调用\
    \ `tick()` 函数来启动时钟——`<body onload=\"tick()\">` 确保在 JavaScript 尝试将时间赋值给时钟字段之前，表单已经创建。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_65_2.png)\n\n# 数学运算\n\n本章专门介绍 JavaScript\
    \ Math 对象，并描述了用于执行数学计算的常量值和方法。涵盖了随机数生成的主题并进行了说明。\n\n## 内容\n- Math 常数\n- Math 方法\n\
    - 舍入\n- 随机数\n- 浮点数\n\n# Math 常数\n\n`Math` 对象包含了用于引用的数值。下面的表格列出了这些值：\n\n| | 描述\
    \ |\n| :--- | :--- |\n| Math.E | e 常数约为 2.718281828459045 |\n| Math.LN2 | 2 的自然对数约为\
    \ 0.693147180559945 |\n| Math.LN10 | 10 的自然对数约为 2.30258509299405 |\n| Math.LOG2\
    \ | 以2为底的对约为 1.442695040888963 |\n| Math.LOG10 | 以10为底的对约为 0.43429448933245 |\n\
    | Math.PI | π 常数约为 3.141592653589793 |\n| Math.SQRT2 | 2 的平方根约为 0.7071067811865476\
    \ |\n| Math.SQRT1 | 2 的平方根约为 1.414213562373095 |\n\n`Math` 常数可以在脚本的任何地方使用。大多数\
    \ Math 常数仅用于具有特定数学目的 JavaScript 应用程序，但上方提供了完整列表。`Math.PI` 常数创造了有趣的可能性。下面的示例动态旋转一个名为\
    \ `div` 的层：\n\n# 使用 pi\n\n![](img/5f5106681c8c7072e64c4ea87c891513_68_0.png)\n\
    \n```\nvar pos = 0;\n\n//  id 为 \"d1\" 的 div\nfunction spin() {\n  // 获取 div 的样式对象\n\
    \  var obj_style = document.getElementById(\"d1\").style;\n  // 期望的半径和 x, y 偏移\n\
    \  var radius = 40;\n  var x_offset = 50;\n  var y_offset = 50;\n\n  // 获取新位置\n\
    \  pos += 10;\n  var x = radius * Math.cos(pos * Math.PI/180);\n  var y = radius\
    \ * Math.sin(pos * Math.PI/180);\n\n  x += x_offset;\n  y += y_offset;\n  // 将\
    \ div 到新坐标\n  obj_style.left = x + \"px\";\n  obj_style.top = y + \"px\";\n  //\
    \ 设置再次调用此函数的间隔\n  setTimeout(spin(), 100);\n}\n```\n\n`Math.cos()` 和 `Math.sin()`\
    \ 函数用于计算弧度角的余弦和正弦值。这些被用于计算圆的坐标。\n\n该程序通过在 HTML `<body>` 标签的 `onload` 属性在页面加载时调用\
    \ `spin()` 函数来启动。\n\n"
