  md: "# # JavaScript: protocol\n\nThe javascript: protocol may be assigned to the\
    \ href attribute in a HTML <a> anchor element to make a JavaScript function the\
    \ target of a hyperlink.\n\nThe name of the function should follow the protocol\
    \ specifier to identify the script code to be executed, or short pieces of code\
    \ can be included in-line after `alert`, like:\n\n```\n<a href=\"javascript:alert('In-line\
    \ code')\">Link #1</a>\n<a href=\"javascript:respond()\">Link #2</a>\n```\n\n\
    This example contains both in-line code and a function call. Each will execute\
    \ when the user clicks the relevant hyperlink:\n\n```\n// a function to display\
    \ a simple message\nfunction respond() {\n  alert(\"JavaScript code\");\n}\n```\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_161_0.png)\n\nTo make an anchor that\
    \ has no target use javascript:// so that other attributes like onmouseover can\
    \ be used.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_161_1.png)\n\n| JavaScript:\
    \ Protocol |\n| File Edit View Favorites Tools Help |\n| Link #1 Link #2 |\n|\
    \ Microsoft Internet Explorer |\n| | In-line code |\n| | OK |\n| javascript:alert('In-line\
    \ code') | Local intranet |"
