  md: "# Multiple functions\n\nJavaScript functions may call other functions during\
    \ the execution of their code in just the same way that the previous examples\
    \ called the JavaScript alert() function.\n\nThe following example demonstrates\
    \ the use of multiple functions to manipulate and display an integer argument:\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_19_0.png)\n\n```\na function to call\
    \ a second function\nand display a returned result\nfunction call_alert( num )\n\
    {\n  var new_number = make_double( num);\n  alert(\" The Value Is \" + new_number);\n\
    }\n\na a function to double a value\n// and return the result to the caller\n\
    function make_double( num )\n{\n  var double_num = num + num;\n  return double_num;\n\
    }\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_19_1.png)\n\nThe argument value\
    \ is passed from the caller to the make_double() function via the call_alert(\
    \ 4 ) function:\n\n```\n<body onload = \"call_alert( 4 )\">\n```\n\nThe value\
    \ is manipulated by the code in the function body and the result is returned to\
    \ the new_number variable in the call_alert() function using the JavaScript return\
    \ keyword. Finally the alert() function is called to display the new_number variable.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_19_2.png)\n\n18 | JavaScript in easy\
    \ steps **"
