    \ the development of computer\ntechnology, 1949)\";\n\n    // define the onload\
    \ function\n    window.onload = write_text;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_137_2.png)\n\
    \n136 | JavaScript in easy steps"
  - '[PAGE 138]


    # Clear form


    The reset() method of a form will reset all the values within the form and update
    the inputs to their original state – just as if the user had pushed a reset button.
    Careful use should be made of the reset() method to avoid the need for the user
    to input data repeatedly.


    The example below uses the javascript protocol to call the intrinsic JavaScript
    reset() function. This allows the user to click an image to reset the form, rather
    than a traditional reset button. Some short pieces of JavaScript can be inserted
    into HTML document like this – without the need for any other script:


    See page 58 for an example of a reset button using the onreset event.


    ![](img/5f5106681c8c7072e64c4ea87c891513_138_0.png)


    ```

    <form id="f" method="post" action="">

    <input type="checkbox" name="chk1" value="fun"/>

    Fun JavaScript<br/>

    <input type="checkbox" name="chk2" value="great"/>

    Great JavaScript<br/>

    <input type="checkbox" name="chk3" value="easy"/>

    Easy JavaScript<br/>

    <img src="reset.gif" alt="" onclick="javascript:document.forms.reset()"/>

    </p>

    </form>

    ```


    reset.html (part of)


    ![](img/5f5106681c8c7072e64c4ea87c891513_138_1.png)


    See page 160 for more on the javascript: protocol.


    ![](img/5f5106681c8c7072e64c4ea87c891513_138_2.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_138_3.png)'
  - '[PAGE 139]


    # Send form


    When a form is submitted to the server the values assigned to the **name** and
    **value** attributes of each form element are sent as **name=value** pairs.


    The **submit()** method of the form object can be used to send the form to the
    server in exactly the same way as if the user had pushed an HTML submit button.


    The example below uses the **javascript:** protocol to call the intrinsic JavaScript
    **submit()** function. This allows the user to click an image to submit form,
    rather than a traditional submit button.


    ![](img/5f5106681c8c7072e64c4ea87c891513_139_0.png)


    ```

    <form id="f" method="post" action="parser.cgi">

    <p>

    <input type="checkbox" name="chk1" value="fun"/>

    JavaScript<br/>

    <input type="checkbox" name="chk2" value="great"/>

    Great JavaScript<br/>

    <input type="checkbox" name="chk3" value="easy"/>

    Easy JavaScript<br/>

    <img src="submit.gif" alt=""\nonclick="javascript:document.forms.f.submit()"/>

    </p>

    </form>

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_139_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_139_2.png)'
  - "[PAGE 140]\n\n# Amend form\n\nThe onsubmit property of a form object can be used\
    \ to execute a JavaScript function just before the form data is sent to the server.\
    \ This may be when the user pushes a HTML submit button, or when the form is sent\
    \ with the form object's submit() method.\n\nThe function will be executed then\
    \ the form will be submitted to the server. Usefully, this allows JavaScript to\
    \ amend the form so that the name=value pairs can be better used by a receiving\
    \ CGI script.\n\nIn the example below the HTML onsubmit attribute of the <form>\
    \ element calls the add_zeros() function just before the form data is sent to\
    \ the server. This function ensures that any empty text input element gets a zero\
    \ value assigned to it:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_140_0.png)\n\
    \n```\n// a function to assign zeros to empty text fields\nfunction add_zeros()\
    \ {\n  with(document.forms.f) {\n    if(txt1.value == \"\") txt1.value = \"0\"\
    ;\n    if(txt2.value == \"\") txt2.value = \"0\";\n    if(txt3.value == \"\")\
    \ txt3.value = \"0\";\n  }\n}\n```\n\nThe CGI script acknowledges the name fields\
    \ and the zero values:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_140_1.png)\n\
    \nCGI Parser Output\nFile Edit View Favorites Tools Help\nOutput:\n* Key: txt1\
    \ - Value: 100\n* Key: txt2 - Value: 0\n* Key: txt3 - Value: 0\nDone Local intranet\n\
    \nII. Form properties"
- md: "\n## Email address validation\n\nThe value of form elements may be validated\
    \ by correct format before the form is submitted.\n\nIn the following example\
    \ JavaScript tests the format of a text input string for the presence of @ and\
    \ dot characters and will only submit the form if the email address validation\
    \ appears correct:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_141_0.png)\n\n\
    ```javascript\n// a function to validate an email address\nfunction send_if_valid()\
    \ {\n  if (document.forms.f.email.value.indexOf(\"@\") == -1)\n    fail(\"No @\
    \ in address\");\n  else {\n    var adr = document.forms.f.email.value.split(\"\
    @\");\n    if (adr[0].length < 1) fail(\"User address absent\");\n    else if\
    \ (adr[1].indexOf(\".\") == -1) fail(\"No dot\");\n    else if (adr[1].length\
    \ < 3) fail(\"Domain incorrect\");\n    else document.forms.f.submit();\n  }\n\
    }\n\n// a function to display an error message\nfunction fail(msg) {\n  alert(\"\
    Email Address Error:\\n\" + msg);\n}\n```\n\nThe function `send_if_valid()` is\
    \ called from the HTML onclick attribute of the button in this example.\n\n| Email\
    \ Address Validation |\n| :--- |\n| File Edit View Favorites Tools Help |\n| Enter\
    \ Email Address: |\n| mike@noplace [Submit Form] |\n| Microsoft Internet Explorer\
    \ [Email Address Error: No dot [OK]] |\n| Done Local intranet |\n\nUser actions,\
    \ such as a key depression or a mouse click, create events that JavaScript can\
    \ use to interact with the user. This chapter describes common events and illustrates\
    \ how they may be used by a JavaScript event-handler.\n\n## Covers\n\n- Mouse\
    \ click | 142\n- Capture mouse | 143\n- Mouse over and mouse out | 144\n- Mouse\
    \ down and mouse up | 146\n- Mouse buttons | 147\n- Key down and key up | 148\n\
    - Key codes | 149\n- Load and unload | 150\n- Focus and blur | 152\n- Change |\
    \ 154\n- Reset | 155\n- Submit | 156\n- Abort | 157\n- Resize | 158\n\n## Mouse\
    \ click\n\nThe most common interactive event is the Click created when a user\
    \ clicks the left-hand mouse button while the cursor is over a form button in\
    \ a Web document.\n\nAn onclick event-handler is normally assigned to the button’s\
    \ HTML <input> tag with the HTML onclick attribute.\n\nTypically the value assigned\
    \ to the onclick attribute will be a call to a JavaScript function that will execute\
    \ statements.\n\n```html\n<input type=\"button\" value=\"Do Click\" onclick=\"\
    do_click('JavaScript in easy steps')\">\n```\n\nPut single quotes inside the double\
    \ quotes used to assign a string.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_143_0.png)\n\
    \nThis simple example calls a JavaScript function when the user clicks on a button\
    \ and passes a string argument for use by the called function:\n\n```javascript\n\
    // a function to react to the CLICK event\nfunction do_click(str) \n{\n    //\
    \ display the passed string argument\n    alert(str);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_143_1.png)\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_143_2.png)\n\n## Capture mouse\n\nIt\
    \ is extremely useful to know the whereabouts of the cursor when dealing with\
    \ JavaScript in DHTML scripting.\n\nWhenever the user moves the cursor MouseMove\
    \ event occurs and this can be captured by JavaScript for use with onmousemove\
    \ event-handler.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_144_0.png)\n\nThe\
    \ first script statement in this example is to trap mouse movements in Netscape\
    \ - substitution must be exactly.\n\nThe example below gives a useful way of determining\
    \ x,y screen coordinates when developing DHTML scripts.\n\nThe MouseMove event\
    \ is captured, then the onmousemove event-handler dynamically displays the cursor's\
    \ x,y coordinates in a text field named txt:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_144_1.png)\n\
    \nNetscape - substitution must be exactly.\n\n```javascript\n// // Netscape/Mozilla\
    \ capture events instruction\nif(navigator.appName == \"Netscape\")\n  window.captureEvents\
    \ (Event.MOUSEMOVE);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_144_2.png)\n\
    \n```javascript\n// a function to react to the MOUSEMOVE event\nfunction track(e)\
    \ {\n  var x = (document.all) ? event.x : e.pageX;\n  var y = (document.all) ?\
    \ event.y : e.pageY;\n  document.forms.f.txt.value = \"X: \" + x + \" Y: \" +\
    \ y;\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_144_3.png)\n\nThe document.all\
    \ property is found in Internet Explorer but not Netscape/Mozilla - so it can\
    \ be useful to apply browser-specific code.\n\n```javascript\n// specify the onmousemove\
    \ event-handler\ndocument.onmousemove;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_144_4.png)\n\
    \nThe Netscape and Internet Explorer DOM use different object names for the cursor's\
    \ x,y position.\n\n| MouseMove Event |\n| :--- |\n| File Edit View Favorites Help\
    \ |\n| X 200 Y: 60 |\n| Done Local intranet |\n| 12. Event-handlers | 143 |\n\n\
    ## Mouse over\n\nA MouseOver event occurs when the user places the cursor over\
    \ an object on a Web.. The anchor <a> element can specify an event-handler for\
    \ the MouseOver event by assigning a JavaScript function call to the HTML onmouseover\
    \ attribute, like this:\n\n```html\n<a href=\"target.html\" onmouseover=\"do_mouseover()\"\
    >\n```\n\nMost frequently the event-handler will perform an image swap effect\
    \ but any statements may be executed. The example below assigns a string value\
    \ to an text box when the cursor is placed over an image:\n\n```javascript\n//\
    \ a function to react to the MOUSEOVER event\nfunction do_mouseover() {\n  //\
    \ display message in a form field\n  document.forms.f.txt.value = \"Mouse is Over\
    \ the link\";\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_145_0.png)\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_145_1.png)\n\n## Mouse out\n\nA MouseOut\
    \ event occurs when the user moves the cursor away from an HTML hyperlink on a\
    \ Web. The anchor <a></a> can specify an event-handler for the MouseOut event\
    \ by assigning a JavaScript function call to the HTML onmouseout attribute, like\
    \ this:\n\n```html\n<a href=\"target.html\" onmouseout=\"do_mouseout()\" onmouseover=\"\
    do_mouseover()\">\n```\n\nMost frequently the event-handler will perform an image\
    \ swap to return an image to its original state in rollover. The following example\
    \ builds on the previous example by adding an onmouseout event-handler to change\
    \ the value of a text box when the cursor moves off the link:\n\n```javascript\n\
    // a function to react to MOUSEOUT\nfunction do_mouseout() {\n  document.forms.f.txt.value\
    \ = \"Mouse is Off the link\";\n}\n\n// a function to react to the MOUSEOVER event\n\
    function do_mouseover() {\n  document.forms.f.txt.value = \"Mouse is Over the\
    \ link\";\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_146_0.png)\n\nThis\
    \ illustration shows the text field after the cursor has moved over the image.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_146_1.png)\n![](img/5f5106681c8c7072e64c4ea87c891513_146_2.png)\n\
    \n12. Event-handlers | 145 |\n\n## Mouse down and mouse up\n\nA MouseDown event\
    \ occurs when the user presses a mouse button and a MouseUp event occurs when\
    \ it is released. Typically these are used together so that a single mouse click\
    \ will use two event-handlers, like this:\n\n```html\n<input type=\"button\" value=\"\
    Light Switch\" onmousedown=\"light(1)\" onmouseover=\"light(0)\">\n```\n\nThis\
    \ example swaps an image and changes the value of a text box when the cursor is\
    \ over and a mouse button is pressed. It reverts to their original state when\
    \ the button is released:\n\n```javascript\n// a function to react to MOUSEDOWN\
    \ and MOUSEUP events\nfunction light(n) {\n  if (n == 1 ) {\n    document.images.bulb.src\
    \ = \"bulbon.gif\";\n    document.forms.f.txt.value = \"Button is Down\";\n  }\n\
    \  if (n == 0 ) {\n    document.images.bulb.src = \"bulboff.gif\";\n    document.forms.f.txt.value\
    \ = \"Button is Up\";\n  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_147_0.png)\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_147_1.png)\n![](img/5f5106681c8c7072e64c4ea87c891513_147_2.png)\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_147_3.png)\n\n146 JavaScript in easy\
    \ steps\n\n## Mouse buttons\n\nJavaScript properties can determine which mouse\
    \ button has been pressed by examining the MouseDown event. With Internet Explorer\
    \ the left mouse button stores an integer value of 1 in the event.button property,\
    \ the right mouse button stores an integer value of 2 and the center button, if\
    \ present, stores an integer value of 3.\n\nHere this property is used to inhibit\
    \ the Internet Explorer context menu that normally appears when the right mouse\
    \ button is pressed by the user:\n\n```javascript\n// store a default message\n\
    var msg = \"Right-Click Context Menu Is Disabled\"\n// a function to stop the\
    \ IE context menu\nfunction stopmenu(e) {\n  // for Internet Explorer browsers\n\
    \  if(navigator.appName == \"Microsoft Internet Explorer\"\n  && (event.button\
    \ == 2 || event.button == 3)) {\n      alert( msg);\n      return false;\n  }\n\
    }\n```\n\n```javascript\n// specify the onmousedown event-handler\ndocument.onmousedown\
    \ = stopmenu;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_148_0.png)\n![](img/5f5106681c8c7072e64c4ea87c891513_148_1.png)\n\
    \n12. Event-handlers\n"
  mdcn: "\n\n## 邮箱地址验证\n\n表单元素的值在提交表单之前，可以通过正确的格式进行验证。\n\n在下面的示例中，JavaScript 测试文本输入字符串的格式是否包含\
    \ @ 字符和点 字符，只有当邮箱地址验证看起来正确时，才会提交表单：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_141_0.png)\n\
    \n```javascript\n// 验证邮箱地址的函数\nfunction send_if_valid() {\n  if (document.forms.f.email.value.indexOf(\"\
    @\") == -1)\n    fail(\"地址中缺少 @\");\n  else {\n    var adr = document.forms.f.email.value.split(\"\
    @\");\n    if (adr[0].length < 1) fail(\"用户地址不存在\");\n    else if (adr[1].indexOf(\"\
    .\") == -1) fail(\"缺少点\");\n    else if (adr[1].length < 3) fail(\"域名不正确\");\n\
    \    else document.forms.f.submit();\n  }\n}\n\n// 显示错误消息的函数\nfunction fail(msg)\
    \ {\n  alert(\"邮箱地址错误:\\n\" + msg);\n}\n```\n\n该函数 `send_if_valid()` 是从示例中按钮的\
    \ HTML `onclick` 属性调用的。\n\n| 邮箱地址验证 |\n| :--- |\n| 文件 编辑 视图 收藏 工具 帮助 |\n| 输入邮箱地址:\
    \ |\n| mike@noplace [提交表单] |\n| Microsoft Internet Explorer [邮箱地址错误: 缺少点 [确定]]\
    \ |\n| 完成 本地域网 |\n\n用户操作（如按下按键或点击鼠标）会创建 JavaScript 可用于与用户交互的事件。本章描述了常见的事件，并说明了它们如何被\
    \ JavaScript 事件处理器器使用。\n\n## 目录\n\n- 鼠标点击 | 142\n- 捕捉鼠标 | 143\n- 鼠标移入和鼠标移出 | 144\n\
    - 鼠标按下和鼠标抬起 | 146\n- 鼠标按钮 | 147\n- 按键按下和按键释放 | 148\n- 键码 | 149\n- 加载和卸载 | 150\n\
    - 焦点获得和失去 | 152\n- 改变 | 154\n- 重置 | 155\n- 提交 | 156\n- 取消 | 157\n- 调整大小 | 158\n\
    \n## 鼠标点击\n\n最常见的交互事件是用户在 Web 文档的表单按钮上点击左鼠标键时创建的 `Click` 事件。\n\n`onclick` 事件处理器通常通过\
    \ HTML `onclick` 属性分配给按钮的 HTML `<input>` 标签。\n\n通常，分配给 `onclick` 属性的值将是对一个 JavaScript\
    \ 函数的调用，该函数将执行语句。\n\n```html\n<input type=\"button\" value=\"Do Click\" onclick=\"\
    do_click('JavaScript in easy steps')\">\n```\n\n在用于赋值字符串的双引号内部内部使用单引号。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_143_0.png)\n\
    \n这个简单的示例在用户点击按钮时调用 JavaScript 函数，并传递一个字符串参数供被调用的函数使用：\n\n```javascript\n// 响应\
    \ CLICK 事件的函数\nfunction do_click(str) \n{\n    // 显示传递的字符串参数\n    alert(str);\n\
    }\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_143_1.png)\n![](img/5f5106681c8c7072e64c4ea87c891513_143_2.png)\n\
    \n## 捕捉鼠标\n\n在 DHTML 脚本中处理 JavaScript 时，知道光标的位置是非常有用的。\n\n每当用户移动鼠标时，就会发生 `MouseMove`\
    \ 事件，这可以被 JavaScript 捕获并用于 `onmousemove` 事件处理器。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_144_0.png)\n\
    \n示例中的第一个脚本语句是在 Netscape 中拦截鼠标移动 - 替换必须完全一致。\n\n下面的示例提供了一种在开发 DHTML 脚本时确定 x,y\
    \ 屏幕坐标的实用方法。\n\n捕获 `MouseMove` 事件后，`onmousemove` 事件处理器在名为 `txt` 的文本字段中动态地显示光标的\
    \ x,y 坐标：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_144_1.png)\n\nNetscape -\
    \ 替换必须完全一致。\n\n```javascript\n// // Netscape/Mozilla 捕获事件指令\nif(navigator.appName\
    \ == \"Netscape\")\n  window.captureEvents (Event.MOUSEMOVE);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_144_2.png)\n\
    \n```javascript\n// 响应 MOUSEMOVE 事件的函数\nfunction track(e) {\n  var x = (document.all)\
    \ ? event.x : e.pageX;\n  var y = (document.all) ? event.y : e.pageY;\n  document.forms.f.txt.value\
    \ = \"X: \" + x + \" Y: \" + y;\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_144_3.png)\n\
    \n`document.all` 属性存在于 Internet Explorer但在 Netscape/Mozilla 中 - 因此应用特定浏览器的代码是有用的。\n\
    \n```javascript\n// 指定 onmousemove 事件处理器\ndocument.onmousemove;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_144_4.png)\n\
    \nNetscape 和 Internet Explorer 的 DOM 使用不同的对象名称来表示光标的 x,y 位置。\n\n| MouseMove 事件\
    \ |\n| :--- |\n| 文件 编辑 视图 收藏 帮助 |\n| X 200 Y: 60 |\n| 完成 本地域网 |\n| 12. 事件处理器 |\
    \ 143 |\n\n## 鼠标移入\n\n当用户将光标置在 Web 上的对象上方时，会发生 `MouseOver` 事件。锚点 `<a>` 元素可以通过将\
    \ JavaScript 函数分配给 HTML `onmouseover` 属性来指定 `MouseOver` 事件，如下：\n\n```html\n<a\
    \ href=\"target.html\" onmouseover=\"mouseover()\">\n```\n\n通常事件处理器会在光标置于图像上时交换图像，如下所示在文本框中：\n\
    \n```javascript\n// 响应 MOUSEOVER 事件的函数\nfunction mouseover() {\n  // 显示鼠标进入\n\
    \  document.forms.f.txt.value = \"Mouse Over\";\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_145_0.png)\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_1)\n\n## 鼠标移出\n\n当用户光标离开 Web 上的对象时，会发生\
    \ `MouseOut` 事件。锚点 `<a>` 元素可以通过将 JavaScript 函数分配给 HTML `onmouseout` 属性来指定 `MouseOut`\
    \ 事件，如下：\n\n```html\n<a href=\"target.html\" onmouseout=\"mouseout()\">\n```\n\
    \n通常事件处理器会在光标离开图像时交换图像，如下所示在文本框中：\n\n```javascript\n// 响应 MOUSEOUT 事件的函数\nfunction\
    \ mouseout() {\n  // 显示鼠标移出\n  document.forms.f.txt.value = \"Mouse Out\";\n}\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_145_1)\n\n## 鼠标按下和鼠标抬起\n\n当用户按下鼠标键时发生\
    \ `MouseDown` 事件，当释放它时发生 `MouseUp` 事件。通常将它们结合使用，实现单次点击，如下：\n\n```html\n<input\
    \ type=\"button\" value=\"Switch\" onmousedown=\"light(1)\" onmouseup=\"light(0)\"\
    >\n```\n\n这个示例在释放按钮时恢复到原始状态：\n\n```javascript\n// 响应 MOUSEDOWN 和 MOUSEUP 事件的函数\n\
    function light(n) {\n  if (n == 1 ) {\n    document.images.bulb.src = \"bulbon.gif\"\
    ;\n    document.forms.f.txt.value = \"Button Down\";\n  }\n  if (n == 0 ) {\n\
    \    document.images.bulb.src = \"bulboff.gif\";\n    document.forms.f.txt.value\
    \ = \"Button Up\";\n  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_147_0.png)\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_147_1.png)\n![](img/5f5106681c8c7072e64c4ea87c891513_147_2.png)\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_147_3.png)\n\n## 鼠标按钮\n\nJavaScript 属性可以通过检查\
    \ `MouseDown` 事件来确定按下哪个鼠标按钮。在 Internet Explorer 中，左鼠标键在 `event.button` 属性中存储整数值\
    \ 1，右鼠标键存储整数值 2，如果存在中间键，则存储整数值 3。\n\n此处该属性用于抑制用户按下右鼠标键时正常出现的 Internet Explorer\
    \ 键菜单：\n\n```javascript\n// 存储默认消息\nvar msg = \"右键菜单已禁用\"\n// 停止 IE 菜单的函数\nfunction\
    \ stopmenu(e) {\n  // 针对 Internet Explorer 浏览器\n  if(navigator.appName == \"Microsoft\
    \ Internet Explorer\"\n  && (event.button == 2 || event.button == 3)) {\n    \
    \  alert( msg);\n      return false;\n  }\n}\n```\n\n```javascript\n// 指定 onmousedown\
    \ 事件处理器\ndocument.onmousedown = stopmenu;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_148_0.png)\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_148_1.png)\n\n"
