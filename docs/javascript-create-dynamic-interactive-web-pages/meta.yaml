  md: "# # Get size\n\nIt is sometimes useful to have JavaScript get the user's screen\
    \ resolution from the **width** and **height** properties of **window.screen**\
    \ object. Because a window may not be maximized to the full screen size it is\
    \ also helpful to determine the inner width of the window.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_108_0.png)\n\
    \nThe availHeight and availWidth properties of window.screen object contain the\
    \ size bars.\n\nThe Netscape and Internet Explorer document object models have\
    \ different ways of storing inner window dimensions as browser-specific scripting\
    \ is needed.\n\nIn the example below window dimensions are retrieved from the\
    \ appropriate object for each browser. The function is called by the onload attribute\
    \ of the HTML `<body>` tag to ensure that the window has been created before seeking\
    \ its dimensions.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_108_1.png)\n\n```\n\
    function get_sizes() {\n  var win_w, win_h, scr_w, scr_h, res, inr;\n  if(document.body.clientWidth)\
    \ {\\ // IE and Opera\n    win_w = document.body.clientWidth;\n    win_h = document.body.clientHeight;\n\
    \  } else if(window.innerWidth) {\\ // Netscape and Mozilla\n    win_w = inner.innerWidth;\n\
    \    win_h = inner.innerHeight;\n  }\n  scr_w = screen.width; scr_h = screen.height;\n\
    \  // display the size information\n  res = \"Resolution: \" + scr_w + \" x \"\
    \ + scr_h;\n  inr = \"Inner window : \" + win_w + \" x \" + win_h;\n  if(win_w\
    \ == null) alert(res + \" \\n\" + inr);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_108_2.png)\n\
    \nYou can call the window.print() method to print out the document in the browser\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_108_3.png)"
  merge: -1
  pgno: 108
