  - '[PAGE 29]


    # Comparison operators


    The operators that are commonly used in JavaScript to compare two values are all
    listed in the table below:


    | Operator | Comparative Test |

    | --- | --- |

    | == | Equality |

    | != | Inequality |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to


    ![](img/5f5106681c8c7072e64c4ea87c891513_29_0.png)


    The == equality operator compares two operands and will return **true** if both
    are equal in value. If both are the same number they are equal, or if both are
    strings the same characters in the same positions they are equal. Boolean operands
    that are both **true**, or both **false**, are equal.


    Conversely, the != operator returns true if two operands are not equal using the
    same rules as the == operator.


    Equality and inequality operators are useful in testing the state of two variables
    to perform conditional branching.


    The > greater operator compares two operands and will return **true** if the first
    is greater in value than the second.


    The < less operator makes the same comparison but will return **true** if the
    first operand is less in value than the second.


    Adding the = operator after a > greater operator or a > less operator makes it
    also return **true** if the two operands are exactly equal in value.


    The > greater operator is frequently used to test the value of a countdown variable
    in a loop.'
