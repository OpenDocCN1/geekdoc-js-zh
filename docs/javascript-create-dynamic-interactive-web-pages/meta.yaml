- md: "\n# Making statements\n\nStatements are used in JavaScript to progress the\
    \ execution of the JavaScript application. They may define loops within the code\
    \ or be simple terms to be evaluated. This chapter examines conditional testing\
    \ and the different types of loops with examples of their use.\n\n- Conditional\
    \ if | 32\n- If - prompt example | 33\n- If - else statements | 34\n- The switch\
    \ statement | 35\n- For loops | 36\n- The for - in loop | 37\n- While loops |\
    \ 38\n- The do - while loop | 39\n- Break statement | 40\n- Continue statement\
    \ | 41\n- Using with statements | 42\n\n![](img/5f5106681c8c7072e64c4ea87c891513_32_0.png)\n\
    \n## Conditional if\n\nThe if keyword is used to perform the basic conditional\
    \ JavaScript test to evaluate an expression for a boolean value. The statement\
    \ following the evaluation will only be executed when the expression returns true.\
    \ The syntax for the if statement looks like this:\n\n```\nif (test expression)\
    \ statement-to-execute-when-true;\n```\n\nThe code to be executed may contain\
    \ multiple statements if they are enclosed within a pair of curly braces to form\
    \ a statement block.\n\nIn the example below the expression to be tested uses\
    \ the modulus operator to determine if the value contained in the variable called\
    \ num is exactly divisible by 2. The statement has two statements — one to assign\
    \ a string value to a variable and another to call a JavaScript function.\n\n\
    ```javascript\n// create two variables\nvar msg, num;\nnum = 7;\n\n// test if\
    \ the number is not exactly divisible by 2\nif ( num % 2 != 0 ) {\n  msg = num\
    \ + \" is an odd number.\";\n  alert( msg);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_33_0.png)\n\
    \n> The expression could have used (num%2==1) to detect an odd number.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_33_1.png)\n\
    \nThis example calls the JavaScript prompt() function needs two arguments to be\
    \ supplied by the caller. The first argument is the message to be displayed and\
    \ the second is a default entry in the input field – in this case an empty string.\n\
    \nThe user input is assigned to the `username` variable and is displayed by the\
    \ `alert()` function if the string is not still empty.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_34_0.png)\n\
    \n```javascript\n// initialize a variable with a null value\nvar username = null;\n\
    if ( username == null ) {\n    // ask the user for their name\n    username =\
    \ prompt(\"Please Enter Your Name\", \"\");\n    // ... or greet the user by name\n\
    \    if ( username != \"\") ) alert(\"Welcome \" + username);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_34_1.png)\n\
    \nThe prompt dialog will open with an empty input field but is shown here following\
    \ user input.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_34_2.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_34_3.png)\n\
    \n## If - else statements\n\nThe JavaScript else keyword can be used with an if\
    \ statement to provide alternative code to execute, in the event that the test\
    \ expression returns false.\n\nThis is known as conditional branching and has\
    \ this syntax:\n\n```\nif (test expression) do-this; or-else-do-this;\n```\n\n\
    Several expressions may be tested until a true value is found when the code following\
    \ the true expression is executed. It is important to note any further code contained\
    \ in the if-else statement is ignored.\n\nSo in the following example any code\
    \ after the call to the alert() function by the third test will be ignored completely:\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_35_0.png)\n\n```javascript\nvar num\
    \ = 2, bool = false;\n// is the number 1 and the boolean value true ?\nif (num\
    \ == 1 && bool == 1) alert(\"TEST1 bool: \" + bool);\nelse\n// is the number 2\
    \ and the boolean value true ?\nif (num == 2 && bool == 1) alert(\"TEST2 bool:\
    \ \" + bool);\nelse\n// is the number 3 and the boolean value false ?\nif (num\
    \ == 3 && bool == 0) alert(\"TEST4 bool: \" + bool);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_35_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_35_2.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_35_3.png)\n\
    \n## The switch statement\n\nConditional branching using the if-else statement\
    \ may be more efficiently performed using switch statement when a test expression\
    \ evaluates the value of one variable.\n\nThe switch statement works in an unusual\
    \ way – first it evaluates a given expression, then it seeks a label to match\
    \ the resulting value. The code associated with the matching label will be executed\
    \ or, if no match is made, the statement will execute default code.\n\nThe case\
    \ keyword is used to denote a label and the default keyword denotes the default\
    \ code.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_36_0.png)\n\nFor more detail\
    \ on break statement see page 40.\n\nAll label code must be terminated by a break\
    \ statement. The labels may be numbers, strings, or booleans but must all of the\
    \ same type, like in this example that uses numbers:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_36_1.png)\n\
    \n```javascript\nvar num = 2;\nswitch(num)\n{\n  case 1: alert(\"This is case\
    \ 1\"); break;\n  case 2: alert(\"This is case 2\"); break;\n  case 3: alert(\"\
    This is case 3\"); break;\n  default: alert(\"This is default code\");\n}\n```\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_36_2.png)\n\nOmitting the ending break\
    \ keywords will allow execution of all other code in the switch statement.\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_36_3.png)\n\n## For loops\n\nThe for\
    \ loop is probably the most frequently used type of loop in JavaScript and has\
    \ this syntax:\n\n```\nfor ( initializer, test, increment )\n```\n\nThe initializer\
    \ is used to set the start value for the counter of the number of loop iterations.\
    \ A variable may be declared here for this purpose and it is traditional to name\
    \ it i.\n\nAt each pass of the loop a boolean condition is tested and the next\
    \ iteration of the loop will only run if the condition returns true. If the test\
    \ returns false then the loop will end.\n\nWith every iteration the counter is\
    \ incremented then the loop will execute the code in the statement. Multiple statements\
    \ can be executed if they are contained by curly braces in a statement block.\n\
    \nThe following example makes five iterations and changes the assigned value of\
    \ two variables at each pass:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_37_0.png)\n\
    \n```javascript\nvar a = 0, b = 0;\n// initialize counter at zero then loop until\
    \ it hits 5\nfor ( var i = 0; i < 5; i++) {\n  // increment variable values on\
    \ each iteration\n  a += 10; b += 5;\n}\n// display the final values after the\
    \ loop ends...\nalert(\"FOR LOOP\\n A is \" + a + \"... B is \" + b);\n```\n\n\
    > HOT TIP\nA loop can also count down - decrementing the counter at each iteration.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_37_1.png)\n\n## The for - in loop\n\
    \nThe for-in loop has a special use to enumerate all the variables for properties\
    \ contained within an object.\n\nThis loop is seldom used in regular JavaScript\
    \ but is included here because it can reveal the properties available for manipulation\
    \ within a Web browser.\n\nThe following example reveals a tantalizing glimpse\
    \ of the properties available within the window object of the Microsoft Internet\
    \ Explorer 6.0 Web browser:\n\n```javascript\nvar i = 0; a = \"\";\n\n// list\
    \ all window properties in a variable\nfor ( property in window ) {\n  a += property\
    \ + \"...\";\n}\n// display the window properties list\nalert(a);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_38_0.png)\n\
    \nThe properties revealed will vary for each browser and version.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_38_1.png)\n\
    \nThe properties revealed with this script are part of the Document Object Model\
    \ (DOM) that is described in chapter 8.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_38_2.png)\n\
    \n## While loops\n\nAnother loop uses the JavaScript while keyword followed by\
    \ an expression to be evaluated for a boolean value.\n\nIf the evaluation returns\
    \ true then the code in the statement block will be executed. After the code has\
    \ executed the test expression will again be evaluated and the loop will continue\
    \ until the evaluation returns false.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_39_0.png)\n\
    \nThe statement block must feature code that will affect the test expression in\
    \ order to change the evaluation result to return false - otherwise an infinite\
    \ loop will be created.\n\nIt is important to note that if the test expression\
    \ returns false when it is first evaluated then the code in the statement block\
    \ is never executed.\n\nThis example decrements a variable on each iteration of\
    \ the loop. The counter increments until it reaches 10 when the evaluation returns\
    \ false and the loop ends.\n\n```javascript\nvar i = 0, num = 50;\n// loop until\
    \ the counter hits 10\nwhile(i < 10 )\n{\n  num--;\n  i++;\n}\n// display the\
    \ final counter and number values\nalert(\"Loop stopped at \" + i + \"\\nnum is\
    \ now \" + num);\n```\n\nwhile.js\n\n![](img/5f5106681c8c7072e64c4ea87c891513_39_1.png)\n"
  mdcn: "\n\n# 语句\n\n语句在 JavaScript 中用于推进 JavaScript 应用程序的执行。它们可以在代码中定义循环，也可以是待评估的简单术语。本章将检查条件测试和不同类型的循环，并附带它们的用法示例。\n\
    \n- 条件 if | 32\n- If - prompt 示例 | 33\n- If - else 语句 | 34\n- switch 语句 | 35\n\
    - For 循环 | 36\n- for - in 循环 | 37\n- While 循环 | 38\n- do - while 循环 | 39\n- Break\
    \ 语句 | 40\n- Continue 语句 | 41\n- 使用 with 语句 | 42\n\n![](img/5f5106681c8c7072e64c4ea87c891513_32_0.png)\n\
    \n## 条件 if\n\n`if` 关键字用于执行基础的 JavaScript 条件测试，以评估一个表达式的布尔值。评估随后的语句仅在表达式返回 `true`\
    \ 时才会执行。`if` 语句的语法如下：\n\n```\nif (test expression) statement-to-execute-when-true;\n\
    ```\n\n如果代码被包含在一对大括号内形成语句块，则要执行的代码可以包含多个语句。\n\n在下面的示例中，待测试的表达式使用取模运算符来确定名为 `num`\
    \ 的变量所包含的值是否能被 2 整除。该语句包含两个部分——一个是给变量赋值字符串值，另一个是调用 JavaScript 函数。\n\n```javascript\n\
    // 创建两个变量\nvar msg, num;\nnum = 7;\n\n// 测试数字是否不能被 2 整除\nif ( num % 2 != 0 ) {\n\
    \  msg = num + \" is an odd number.\";\n  alert( msg);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_33_0.png)\n\
    \n> 该表达式可以使用 `(num%2==1)` 来检测奇数。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_33_1.png)\n\
    \n此示例调用的 JavaScript `prompt()` 函数需要调用者提供两个参数。第一个参数是要要的消息的消息，第二个是输入字段中的默认条目——在此情况下是一个空字符串。\n\
    \n用户输入被赋值给 `username` 变量，如果字符串不再为空，则将通过 `alert()` 函数显示。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_34_0.png)\n\
    \n```javascript\n// 用 null 值初始化一个变量\nvar username = null;\nif ( username == null\
    \ ) {\n    // 询问用户他们的姓名\n    username = prompt(\"Please Enter Your Name\", \"\"\
    );\n    // ... 或者通过名字问候用户\n    if ( username != \"\" ) alert(\"Welcome \" + username);\n\
    }\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_34_1.png)\n\nprompt 对话框打开时带有一个空输入字段，但此处显示的是用户输入后的状态。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_34_2.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_34_3.png)\n\
    \n## If - else 语句\n\nJavaScript 的 `else` 关键字可以与 `if` 语句一起使用，在测试表达式返回 `false` 时提供备的可执行代码。\n\
    \n这被称为条件分支，其语法如下：\n\n```\nif (test expression) do-this; or-else-do-this;\n```\n\
    \n当真表达式随后的代码执行时，可能会测试多个表达式，直到找到真值为止。需要注意的是，`if-else` 语句中包含的任何后续代码都会被忽略。\n\n因此，在下面的示例中，第三次测试调用\
    \ `alert()` 函数之后的任何代码都将被完全忽略：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_35_0.png)\n\
    \n```javascript\nvar num = 2, bool = false;\n// 数字是 1 且布尔值为 true 吗\nif (num ==\
    \ 1 && bool == 1) alert(\"TEST1 bool: \" + bool);\nelse\n// 数字是 2 且布尔值为 true 吗\n\
    if (num == 2 && bool == 1) alert(\"TEST2 bool: \" + bool);\nelse\n// 数字是 3 且布尔值为\
    \ false 吗\nif (num == 3 && bool == 0) alert(\"TEST4 bool: \" + bool);\n```\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_35_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_35_2.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_35_3.png)\n\n## switch 语句\n\n当测试表达式评估一个变量的值时，使用\
    \ `switch` 语句比使用 `if-else` 语句执行条件分支可能更高效。\n\n`switch` 语句的工作方式比较特殊——它首先评估一个给定的表达式，然后寻找一个匹配结果结果的标签。与匹配标签关联的代码将被执行，或者如果没有找到匹配项，则语句将执行默认代码。\n\
    \n`case` 关键字用于标记标签，`default` 关键字表示默认代码。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_36_0.png)\n\
    \n有关 `break` 语句的更多详细信息，请参阅第 40 页。\n\n所有标签代码都必须由 `break` 语句终止。标签可以是数字、字符串或布尔值，但类型必须全部相同，例如这个使用数字的示例：\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_36_1.png)\n\n```javascript\nvar num\
    \ = 2;\nswitch(num)\n{\n  case 1: alert(\"This is 1\"); break;\n  case 2: alert(\"\
    This is 2\"); break;\n  case 3: alert(\"This is 3\"); break;\n  default: alert(\"\
    This is default\");\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_36_2.png)\n\
    \n省略 `break` 语句将允许 `switch` 语句执行后续代码。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_36_3.png)\n\
    \n## For 循环\n\n`for` 循环通常是 JavaScript 中最频繁使用的循环类型，其语法如下：\n\n```\nfor (初始化; 测试;\
    \ 递量)\n```\n\n初始化用于设置循环的起始值。当测试表达式返回 `true` 时，循环执行。当测试表达式返回 `false` 时，循环停止。在循环的每次迭代中，递量部分都会执行。下面的示例显示了循环执行\
    \ 5 次的情况：\n\n```javascript\nvar a = 0, b = 0;\n// 计数器增加 5\nfor (var i = 0; i <\
    \ 5; i++) {\n  a++;\n}\n// 显示最终的 a 和 b 值\nalert(\"A is \" + a + \"\\nB is \" +\
    \ b);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_37_0.png)\n\n`for` 循环也可以通过递减变量来计数：\n\
    \n```javascript\nvar a = 10, b = 0;\n// 计数器递减到 0\nfor (var i = a; i > 0; i--)\
    \ {\n  b++;\n}\n// 显示循环结束后的 a 和 b 值\nalert(\"A is \" + a + \"\\nB is \" + b);\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_37_1.png)\n\n## For - in 循环\n\n\
    `for-in` 循环用于枚举对象中的所有属性。这种循环在常规 JavaScript 中很少使用，但在这里包含了以遍历窗口对象的属性：\n\n```javascript\n\
    var a = \"\";\n\n// 列出所有属性\nfor ( property in window ) {\n  a += property + \"\
    ...\";\n}\n// 显示属性列表\nalert(a);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_38_0.png)\n\
    \n列出的属性会随浏览器和版本而异。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_38_1.png)\n\n通过此脚本显示的属性属于文档对象模型\
    \ (DOM)，它在第 8 章中有所描述。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_38_2.png)\n\n\
    ## While 循环\n\n另一种循环使用 JavaScript `while` 关键字后跟一个待评估的表达式。\n\n如果评估结果为 `true`，则语句块中的代码将被执行。代码执行后，将再次对表达式进行评估，循环将持续直到返回\
    \ `false` 为止。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_39_0.png)\n\n语句块必须包含影响测试表达式的代码，以便改变评估结果返回\
    \ `false`——否则将导致无限循环。\n\n需要注意的是，如果测试表达式在第一次评估时返回 `false`，则语句块中的代码将永远不会执行。\n\n\
    此示例在每次迭代中递减一个变量。计数器增加直到达到 10，当评估返回 `false` 循环结束。\n\n```javascript\nvar i = 0,\
    \ num = 50;\n// 循环直到计数器达到 10\nwhile(i < 10 )\n{\n  num--;\n  i++;\n}\n// 显示最终的计数器和数字值\n\
    alert(\"Loop stopped at \" + i + \"\\nnum is now \" + num);\n```\n\nwhile.js\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_39_1.png)\n\n"
