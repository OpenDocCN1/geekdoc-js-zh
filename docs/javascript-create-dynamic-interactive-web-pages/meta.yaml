  md: '# Search a string


    JavaScript str can search a string to find a character or substring passed as
    the argument to the string.indexOf() method.


    If a match is made the method returns the starting position of the first occurrence
    of the matched character or substring within the searched string.


    In the event that no match is found the string.indexOf() method returns a value
    of -1.


    The following example uses the string.indexOf() method to seek a dot and @ character
    within an email address string to perform a simple format validation:


    ![](img/5f5106681c8c7072e64c4ea87c891513_80_0.png)


    ```

    create initialize a string to search

    var str = "mailme@domain.com";

    // seek @, dot and # characters within the search

    var att = str.indexOf("@");

    var dot = str.indexOf(".");

    var hsh = str.indexOf("#");

    ```


    ```

    make valid only if an @ and dot are found

    var fmt = ((att != -1) && (dot != -1)) ? "valid":"invalid";

    ```


    ```

    // display the results of the search

    var res = "Format is " + +fmt;

    res += "\n@ at " + +att;

    res += "\nDot in " + +dot;

    res += "\nHash is " + +hsh;

    alert(res);

    ```


    An optional second integer argument may specify the position from which to start
    the search.


    ![](img/5f5106681c8c7072e64c4ea87c891513_80_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_80_2.png)


    7. Working with strings'
