  md: '# Tacking layer


    The left coordinate of a layer object''s style can be modified by JavaScript to
    reposition the layer along the X axis.


    The following example moves a <div> layer that has an id of boat. This contains
    a sailboat image just outside the left edge of the window. A timer function sails
    the boat across the screen.


    When the boat disappears off the right edge of the window JavaScript swaps the
    image for a pre-loaded version of the sailboat image facing in the opposite direction.
    The script then sails it back across the screen from right to left.


    When the boat disappears off the left edge of the window the image reverts to
    the original version that proceeds to sail left to right and the boat continues
    to tack back and forth.


    The go_right variable determines the direction of travel. It''s initially set
    to true but it is reversed at each extreme point.


    The ext variable stores the width of the window according to the type of browser
    running the script.


    The set_sail() function is initially called from the script to start the routine
    then is called recursively from inside the function itself.


    ![](img/5f5106681c8c7072e64c4ea87c891513_169_0.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_169_1.png)'
  merge: -1
  pgno: 169
- img_proc: true
  md: "# cont'd\n\n![](img/5f5106681c8c7072e64c4ea87c891513_170_0.png)\n\n```\n//\
    \ preload the swap image\nvar preload = new Image(); preload.src = \"sail_1.gif\"\
    ;\nset the initial direction to right\nvar go_right = true;\n\n    a function\
    \ to move a <div> across the page\nfunction set_sail() {\n    get the div object\n\
    \    var obj = document.getElementById(\"boat\");\n\n    get the window width\n\
    \    var ext;\n    if(document.body.clientWidth) ext = document.body.clientWidth;\n\
    \    if(window.innerWidth) ext = window.innerWidth;\n\n    move by 1 pixel in\
    \ set direction\nif(go_right )\\ \n    obj.style.left = (parseInt(obj.style.left)+1)+\"\
    px\";\nelse\n    obj.style.left = (parseInt(obj.style.left)-1)+\"px\";\n\n// change\
    \ direction at the right extreme\nif(parseInt(obj.style.left ) >= ( ext + 5 ))\
    \ {\n    go_right=false;\n    document.images.boat_image.src = \"sail_1.gif\"\
    ;\n}\n\n// change direction at the left extreme\nif(parseInt(obj.style.left) <=\
    \ -75) {\n    go_right = true;\n    document.boat_image.src = \"sail_r.gif\";\n\
    }\n\n// set the interval to call this function\nwindow.setTimeout(\"set_sail()\"\
    , 50);\n}\n\n// start the routine\nset_sail();\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_170_1.png)\n\
    \nThis script must be included in the `<body>` section of the HTML document -\
    \ after the `<div>` element is created.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_170_2.png)\n\
    \nThe positional pixel values have \"px\" tacked on the end (e.g. left=\"70px\"\
    ) so the `parseInt()` method is needed to extract the integer part for manipulation.\n\
    \ntack.js"
