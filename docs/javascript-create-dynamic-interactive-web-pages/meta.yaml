  md: "# # Radio buttons\n\nA group of radio buttons that will only allow one of the\
    \ group to be checked at any time should all have the same name assigned to their\
    \ name attribute in the HTML `<input>` tag.\n\nIn the browser DOM the radio button\
    \ group creates a `document.form` object with that name.\n\nThis object contains\
    \ an array of all the radio buttons in the group, indexed in the order in which\
    \ they appear in the HTML code.\n\nJavaScript can address each radio button using\
    \ the array name and index number. In the example below JavaScript checks the\
    \ radio button then displays both radio values in a text box:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_131_0.png)\n\
    \n```\n```javascript// a function to get radio group information\nfunction radio_info()\
    \ {\n  // select the second radio button\n  document.forms.f.radii[1].checked\
    \ = true;\n\n  // get both radio button values\n  var msg = \"1st Radio Value:\
    \ \"\n  + document.forms.f.radii[0].value;\n  msg += \" 2nd Radio Value: \"\n\
    \  + document.forms.f.radii[1].value;\n  document.forms.f.txt1.value = msg;\n\
    }\n```\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_131_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_131_2.png)"
  merge: -1
  pgno: 131
- img_proc: true
  md: "# # Radio polling\n\nThe important feature of a radio button is whether it\
    \ is checked or not. This can be ascertained from the radio button's **checked**\
    \ property that will return a boolean **true** if the radio is checked or a boolean\
    \ **false** if it is unchecked.\n\nJavaScript can loop through all the radio button\
    \ array elements to test for a **checked** property, then use the value assigned\
    \ to the radio button that is checked.\n\nIn the example below the function is\
    \ called from the HTML **onclick** attribute of the push button form `<input>`.\
    \ This loops through the elements of the radio button array to discover which\
    \ button, if any, is checked. When a button has been checked its associated value\
    \ is used by the script to apply a new background color to the page.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_132_0.png)\n\
    \nIn JavaScript\nif(checked) is shorthand for\nif(checked==true)\n\n```\na function\
    \ to discover which radio button is selected\nfunction radio_poll()\n{\n  loop\
    \ through all radio buttons\n  for(var i=0; i < document.forms.f.radl.length;\
    \ i++)\n  {\n    if the radio is selected, use its value\n    if( document.forms.f.radl[i].checked\
    \ )\n      document.bgColor=document.forms.f.radl[i].value;\n  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_132_1.png)"
  merge: -1
  pgno: 132
- img_proc: true
  md: "# Checkboxes\n\nUnlike radio buttons a checkbox operates independently from\
    \ other checkboxes and so all checkboxes should be uniquely named by their name\
    \ attribute in the HTML code.\n\nEach checkbox creates a document.form object\
    \ with its given name and, like a radio button, has a checked property.\n\nIn\
    \ the following example the HTML onclick attribute of a button calls the JavaScript\
    \ function that sets the checked property of three checkboxes:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_133_0.png)\n\
    \n```\n// a function to check three checkboxes\nfunction checkall() {\n  // in\
    \ the form named f\n  with(document.forms.f) {\n    // check checkboxes named\
    \ chk1, chk2 and chk3\n    chk1.checked = true;\n    chk2.checked = true;\n  \
    \  chk3.checked = true;\n  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_133_1.png)\n\
    \nOnly checkboxes that are checked will have their name=value pairs sent to the\
    \ server on submission of the form.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_133_2.png)"
  merge: -1
  pgno: 133
- img_proc: true
  md: "# Checkbox polling\n\nThe checked property of a checkbox object is most important\
    \ and JavaScript may test for checked checkboxes then use their associated values.\n\
    \nThe example below tests the checked property of all checkboxes and assigns the\
    \ value of those that are checked to a string variable for display in an alert()\
    \ dialog box:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_134_0.png)\n\n```\n\
    a function to discover which checkboxes are selected\nfunction checkbox_poll()\n\
    {\n  // create a string for the results\n  var str = \"Color choice is \";\n\n\
    \  loop through all checkboxes\n  for(var i=1; i<4; i++)\n  {\n    if(eval(\"\
    document.forms.f.chk\"\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_134_1.png)\n\
    \nUse the eval() function to combine form property names and numbers.\n\n| Checkbox\
    \ Poll |\n| File Edit View Favorites Tools Help |\n| Red | Microsoft Internet\
    \ Explorer |\n| Green | Color choice is Red Blue |\n| Blue | OK |\n| Poll Checkboxes\
