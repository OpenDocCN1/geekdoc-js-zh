  md: "# Preloader array\n\nRollover images in Web pages use a JavaScript effect to\
    \ swap the original image for a replacement when the user places the cursor over\
    \ the image.\n\nIn order for this effect to work smoothly, without any download\
    \ delay, the required replacement image must be already loaded into the browser\
    \ cache.\n\nOne way to do this is to use a JavaScript preload routine that forces\
    \ the browser to download the image by creating new Image() objects that use the\
    \ swap images as their source.\n\n```\n// create an array of\n// appear in\nvar\
    \ pics = new Array(\"pic1.gif\",\"pic2.gif\",\"pic3.gif\");\n\n// create a new\
    \ empty array\nvar preload = new Array();\n\n// insert a new Image object\n//\
    \ then assign each image URI\nfor(var i = 0; i < pics.length; i++) {\n  preload[i]\
    \ = new Image();\n  preload[i].src = pics[i];\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_53_0.png)\n\
    \nA preloader array is used with the slide show script example on page 166.\n\n\
    The script example above uses arrays to preload three swap images to be ready\
    \ when the rollover effect is activated.\n\nThe first array contains the URL of\
    \ each image file.\n\nFor each element in the pics array the for loop creates\
    \ a corresponding element in the preload array.\n\nEach of the preload elements\
    \ is assigned a new Image() object, then the image URLs are assigned to their\
    \ src property. This forces the browser to download each image file into its cache\
    \ – ready to be displayed without delay."
  merge: -1
  pgno: 53
