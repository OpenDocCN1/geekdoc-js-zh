    \n![](img/5f5106681c8c7072e64c4ea87c891513_42_1.png)\n\n## 使用 with 语句\n\nJavaScript\
    \ **with** 关键字用于引用属性，无需在每个属性名前添加对象对象。这在编写产生动态效果的 JavaScript 应用时非常有用，因为脚本经常引用 document\
    \ 对象。\n\n例如，每个 Web 页面包含一个 **document** 对象，该对象反过来有一个 **forms** 属性来引用表单。表单可以通过分配给\
    \ **id** 属性的值引用。单个表单可以通过分配给 **name** 属性的值引用，JavaScript 可以设置它们的值。在此示例中，脚本设置了 **order**\
    \ 表单的 **user** 和 **city** 字段：\n\n```javascript\ndocument.forms.order.user.value\
    \ = \"Mike\";\ndocument.forms.order.city.value = \"New York\";\n```\n\n这些赋值可以使用像这样的\
    \ **with** 语句更清晰地表示：\n\n```javascript\nwith (document.forms.order) {\n  user.value\
    \ = \"Mike\";\n  city.value = \"New York\";\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_43_0.png)\n\
