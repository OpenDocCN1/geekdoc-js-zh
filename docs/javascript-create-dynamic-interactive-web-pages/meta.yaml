  - "[PAGE 91]\n\n# DOM hierarchy\n\nbrowser Document Object Model (DOM) is a collection\
    \ of objects in a Web browser that can be addressed by JavaScript in order to\
    \ influence the performance of a HTML document.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_91_0.png)\n\
    \nThese objects follow a strict hierarchy where the window object is the very\
    \ top level. Because window is the leaf \"root\" object can be omitted in the\
    \ address syntax. For instance, the window.document.bgColor property, which stores\
    \ the value of the window's current background color, can be addressed simply\
    \ as document.bgColor.\n\nSeveral of the DOM objects have properties that contain\
    \ an array of the elements in that Web page. For example, with document.images[],\
    \ the images[] array is a property of the document object that will store the\
    \ URL address of each image contained on that Web page. The URL of the first image\
    \ in the HTML code is stored in the array at document.images[0] then the URL of\
    \ successive images are stored at incrementing array index numbers.\n\nThe set_bg()\
    \ function in the example below is called from the onload attribute of the HTML\
    \ <body> tag to assign a value to the document.bgColor after the document has\
    \ been loaded. This then sets the background color of the document to the specified\
    \ value.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_91_1.png)\n\n```\nfunction\
    \ to set the document background color\nfunction set_bg() {\n  document.bgColor\
    \ = \"orange\";\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_91_2.png)"
