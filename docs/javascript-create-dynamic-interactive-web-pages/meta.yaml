- md: "\n## Getting date and time\n\nDate and time is often used in JavaScript to\
    \ customize the performance of a Web page. For example, a script might welcome\
    \ the user with a greeting appropriate to current time:\n\nThe script for this\
    \ application is contained in the example on page 56.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_55_0.png)\n\
    \nThe date and time that is used in JavaScript is taken from the clock and calendar\
    \ in the host system that is running the browser application in which the script\
    \ is loaded.\n\nTo access the system clock information the script must first create\
    \ a Date object.\n\nThis is achieved in the same manner in which an Array object\
    \ is created, using the JavaScript new keyword, but now with the JavaScript Date()\
    \ constructor function. The example below creates and displays a new Date object:\n\
    \n```javascript\n// create a new Date object\nvar now = new Date();\n\n// display\
    \ the Date object's date and time information\nalert(now);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_55_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_55_2.png)\n\n## Date information\n\n\
    The Date object has special methods that may be used to retrieve individual parts\
    \ of the date information.\n\nSome methods return the date information as an index\
    \ number that needs to be converted by the script.\n\nThe Date.getDay() method\
    \ returns the day of the week as an index value from 0 (Sunday) to 6 (Saturday).\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_56_0.png)\n\nAlso the Date.getMonth()\
    \ method returns the month of the year as an index value from 0 (January) to 11\
    \ (December).\n\nThe example below illustrates the Date object methods and uses\
    \ arrays to display the day and month names:\n\n```javascript\n// create an array\
    \ of day names\nvar days = new Array(\"Sun\", \"Mon\", \"Tue\", \"Wed\", \"Thu\"\
    , \"Fri\", \"Sat\");\n\n// create an array of month names\nvar months = new Array(\"\
    Jan\", \"Feb\", \"Mar\", \"Apr\", \"May\", \"Jun\", \"Aug\", \"Sep\", \"Oct\"\
    , \"Nov\", \"Dec\");\n\nvar now = new Date(); // create a new Date object\nvar\
    \ yy = now.getYear(); // get the year\nif(yy < 2000) yy += 1900; // adjust year\
    \ for Netscape\nvar mm = now.getMonth(); // get the month\nvar monthName = months[mm];\
    \ // convert month number to name\nvar dd = now.getDate(); // get day number in\
    \ the month\nvar dy = now.getDay(); // get day number in the week\nvar dayName\
    \ = days[dy]; // convert day to name\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_56_1.png)\n\
    \nNetscape reports the year as the number of years elapsed since 1900 — so in\
    \ this case a line of script adds 1900 to the reported date.\n\n```javascript\n\
    // display the extracted date and day information\nalert(dayName + \" \" + monthName\
    \ + \" \" + dd + \" \" + yy);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_56_2.png)\n\
    \n## Time information\n\nThe Date object has special methods to access the time\
    \ information that it contains. The example below gets the current hours, minutes,\
    \ seconds and milliseconds from the host clock and displays a welcome message\
    \ appropriate for the time of day:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_57_0.png)\n\
    \nThe hours are returned as numbers 0-23 in 24-hour format.\n\n```javascript\n\
    // create a new Date object\nvar now = new Date();\n\n// extract the time information\n\
    var hh = now.getHours();\nvar mn = now.getMinutes();\nvar ss = now.getSeconds();\n\
    var ms = now.getMilliseconds();\n\n// default welcome message\nvar hi = \"Good\
    \ Morning\";\n\n// welcome message if after noon\nif( hh > 11 ) hi=\"Good Afternoon\"\
    ;\n\n// welcome message if after 6 p.m.\nif( hh > 17 ) hi=\"Good Evening\";\n\n\
    // display welcome message and the current time\nvar tim = hi + \"\\n\";\ntim\
    \ += \"Hours: \" +hh+ \"\\n\";\ntim += \"Minutes: \" +mn+ \"\\n\";\ntim += \"\
    Seconds: \" +ss+ \".\" +ms;\nalert(tim);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_57_1.png)\n\
    \n## Current time\n\nThe JavaScript Date.getTime() method can be used to compare\
    \ two date objects numerically.\n\nThe method returns a number that is the difference\
    \ in milliseconds between the date object value and midnight on January 1, 1970\
    \ (sometimes referred to as \"the epoch\").\n\nThe example below creates a Date\
    \ object both before and after running a loop, then compares the values returned\
    \ by the Date.getTime() method to calculate the actual time taken to execute the\
    \ loop:\n\n```javascript\n// create a new Date object then get the current time\n\
    var start = new Date();\nvar msec1 = start.getTime();\n\n// run a loop counting\
    \ up to 250,000\nvar num = 0;\nfor(var i = 0; i < 250000; i++) {\n  num++;\n}\n\
    \n// get another Date object and get the time now\nvar stop = new Date();\nvar\
    \ msec2 = stop.getTime();\n\n// subtract the start time from the stop time to\
    \ cover the amount of time between the two points\nvar diff = ( msec2 - msec1\
    \ ) / 1000;\n\n// display the elapsed time\nalert(\"Time elapsed: \" +diff+\"\
    \ seconds\");\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_58_0.png)\n\nelapsed-time.js\n\
    \nAdjust the number that the loop counts up to according to your browser and platform.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_58_1.png)\n\n## Universal time\n\n\
    Universal Time is the standard time clock. The Date object has a series of methods\
    \ that convert local time to universal time. The example below calls local and\
    \ universal time information:\n\n```javascript\n// create a new Date object\n\
    var now = new Date();\n\n// get the local time in hours\nvar hh = now.getHours();\n\
    \n// get the universal time in hours\nvar utc = now.getUTCHours();\n\n// get the\
    \ universal time in minutes\nvar mn = now.getUTMinutes();\n\n// get the universal\
    \ time in seconds\nvar ss = now.getUTCSeconds();\n\n// ensure there are two digits\
    \ for minutes\nif(mn < 10) mn = \"0\" + mn;\n\n// display both times\nalert(\"\
    Local time: \" + hh + \":\" + mn + \":\" + ss);\nalert(\"UTC time: \" + utc +\
    \ \":\" + mn + \":\" + ss);\n```\n\nThe Date.getTimeOffset() method returns the\
    \ difference in minutes between local time and UTC. The example below shows the\
    \ offset in minutes:\n\n```javascript\n// create a new Date object\nvar now =\
    \ new Date();\nvar offset = now.getTimezoneOffset();\n\nvar msg = \"\";\nswitch(offset)\
    \ {\n  case 240: msg = \"East Coast\"; break;\n  case 300: msg = \"Central\";\
    \ break;\n  case 360: msg = \"Mountain\"; break;\n  case 420: msg = \"Pacific\"\
    ; break;\n  default: msg = \"all\";\n}\n\nalert(\"The offset is \" + offset +\
    \ \" minutes for \" + msg);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_59_0.png)\n\
    \n## Time zones\n\nThe Date.getTimeOffset() method returns the difference in minutes\
    \ between local time and UTC. The value is positive if the local time zone is\
    \ behind UTC and negative if it is ahead of UTC.\n\nThe table below shows some\
    \ time zone offsets:\n\n| Time Zone | Offset (Minutes) |\n| :--- | :--- |\n| UTC\
    \ | 0 |\n| GMT | 0 |\n| Eastern Time (EST) | 300 |\n| Central Time (CST) | 360\
    \ |\n| Mountain Time (MST) | 420 |\n| Pacific Time (PST) | 480 |\n| Central European\
    \ Time (CET) | -60 |\n| Eastern European Time (EET) | -120 |\n| Japan Standard\
    \ Time (JST) | -540 |\n\nA bug in some browsers does not correct offset.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_59_1.png)\n"
  mdcn: "\n\n## 获取日期和时间\n\n日期和时间在 JavaScript 中经常用于自定义 Web 页面的性能。例如，脚本可以根据当前时间向用户发送适当的问候：\n\
    \n此应用程序的脚本包含在第 56 页的示例中。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_55_0.png)\n\
    \nJavaScript 中使用的日期时间和来自于运行加载脚本的浏览器应用程序的主系统时钟和日历。\n\n要访问系统时钟信息，脚本必须创建一个 `Date`\
    \ 对象。\n\n实现方法与创建 `Array` 对象的方法相同，使用 JavaScript 的 `new` 关键字，但现在使用的是 JavaScript\
    \ 的 `Date()` 构造函数。下面的示例创建并显示了一个新的 `Date` 对象：\n\n```javascript\n// create a new\
    \ Date object\nvar now = new Date();\n\n// display the Date object's date and\
    \ time information\nalert(now);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_55_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_55_2.png)\n\n## 日期信息\n\n`Date` 对象拥有特殊方法，可以获取日期信息的各个部分。\n\
    \n某些方法以索引数字的形式返回日期信息，这需要脚本进行转换。\n\n`Date.getDay()` 方法返回星期几的索引值，范围从 0（星期日）到 6（星期六）。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_56_0.png)\n\n此外，`Date.getMonth()` 方法返回月份的索引值，范围从\
    \ 0（1月）到 11（12月）。\n\n下面的示例说明了 `Date` 对象的方法，并使用数组来显示星期和月份名称：\n\n```javascript\n\
    // create an array of day names\nvar days = new Array(\"Sun\", \"Mon\", \"Tue\"\
    , \"Wed\", \"Thu\", \"Fri\", \"Sat\");\n\n// create an array of month names\n\
    var months = new Array(\"Jan\", \"Feb\", \"Mar\", \"Apr\", \"May\", \"Jun\", \"\
    Aug\", \"Sep\", \"Oct\", \"Nov\", \"Dec\");\n\nvar now = new Date(); // create\
    \ a new Date object\nvar yy = now.getYear(); // get the year\nif(yy < 2000) yy\
    \ += 1900; // adjust year for Netscape\nvar mm = now.getMonth(); // get the month\n\
    var monthName = months[mm]; // convert month number to name\nvar dd = now.getDate();\
    \ // get day number in the month\nvar dy = now.getDay(); // get day number in\
    \ the week\nvar dayName = days[dy]; // convert day to name\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_56_1.png)\n\
    \nNetscape 报告年份为自 1900 年以来过的年数——因此在这种情况下，一行脚本向报告的日期加上了 1900。\n\n```javascript\n\
    // display the extracted date and day information\nalert(dayName + \" \" + monthName\
    \ + \" \" + dd + \" \" + yy);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_56_2.png)\n\
    \n## 时间信息\n\n`Date` 对象拥有特殊方法来访问其包含的时间信息。下面的示例从主时钟获取当前的小时、分钟、秒和毫秒，并显示与一天时间段匹配的欢迎消息：\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_57_0.png)\n\n小时以 24 小时制的数字 0-23 返回。\n\
    \n```javascript\n// create a new Date object\nvar now = new Date();\n\n// extract\
    \ the time information\nvar hh = now.getHours();\nvar mn = now.getMinutes();\n\
    var ss = now.getSeconds();\nvar ms = now.getMilliseconds();\n\n// default welcome\
    \ message\nvar hi = \"Good Morning\";\n\n// welcome message if after noon\nif(\
    \ hh > 11 ) hi=\"Good Afternoon\";\n\n// welcome message if after 6 p.m.\nif(\
    \ hh > 17 ) hi=\"Good Evening\";\n\n// display welcome message and the current\
    \ time\nvar tim = hi + \"\\n\";\ntim += \"Hours: \" +hh+ \"\\n\";\ntim += \"Minutes:\
    \ \" +mn+ \"\\n\";\ntim += \"Seconds: \" +ss+ \".\" +ms;\nalert(tim);\n```\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_57_1.png)\n\n## 当前时间\n\nJavaScript `Date.getTime()`\
    \ 方法可以用于数值比较两个 `Date` 对象。\n\n该方法返回一个数字，表示日期对象值与 1970 年 1 月 1 日午夜之间的毫秒差（有时称为“纪元”）。\n\
    \n下面的示例在运行循环前后各创建了一个 `Date` 对象，然后比较 `Date.getTime()` 方法返回的值，以计算执行循环所需的实际时间：\n\n\
    ```javascript\n// create a new Date object then get the current time\nvar start\
    \ = new Date();\nvar msec1 = start.getTime();\n\n// run a loop counting up to\
    \ 250,000\nvar num = 0;\nfor(var i = 0; i < 250000; i++) {\n  num++;\n}\n\n//\
    \ get another Date object and get the time now\nvar stop = new Date();\nvar msec2\
    \ = stop.getTime();\n\n// subtract the start time from the stop time to cover\
    \ the amount of time between the two points\nvar diff = ( msec2 - msec1 ) / 1000;\n\
    \n// display the elapsed time\nalert(\"Time elapsed: \" +diff+\" seconds\");\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_58_0.png)\n\nelapsed-time.js\n\
    \n根据你的浏览器调整循环计数的数字。\n\nimg/5f5106681c8c7072e64c4ea87c891513_58_1.png)\n\n## 通用时间\n\
    \n通用时间是标准时钟。`Date` 对象拥有一系列方法可以将本地时间转换为通用时间。下面的示例调用了本地时间和通用时间信息：\n\n```javascript\n\
    // create a new Date object\nvar now = new Date();\n\n// get the local time in\
    \ hours\nvar hh = now.getHours();\n\n// get the universal time in hours\nvar utc\
    \ = now.getUTCHours();\n\n// get the universal time in minutes\nvar mn = now.getUTMinutes();\n\
    \n// get the universal time in seconds\nvar ss = now.getUTCSeconds();\n\n// ensure\
    \ there are two digits for minutes\nif(mn < 10) mn = \"0\" + mn;\n\n// display\
    \ both times\nalert(\"Local time: \" + hh + \":\" + mn + \":\" + ss);\nalert(\"\
    UTC time: \" + utc + \":\" + mn + \":\" + ss);\n```\n\n`Date.getTimeOffset()`\
    \ 方法返回本地时间与通用时间之间的分钟差。下面的示例显示了偏移量：\n\n```javascript\n// create a new Date object\n\
    var now = new Date();\nvar offset = now.getTimezoneOffset();\n\nvar msg = \"\"\
    ;\nswitch(offset) {\n  case 240: msg = \"East Coast\"; break;\n  case 300: msg\
    \ = \"Central\"; break;\n  case 360: msg = \"Mountain\"; break;\n  case 420: msg\
    \ = \"Pacific\"; break;\n  default: msg = \"all\";\n}\n\nalert(\"The offset is\
    \ \" + offset + \" minutes for \" + msg);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_59_0.png)\n\
    \n## 时区\n\n`Date.getTimeOffset()` 方法返回本地时间与通用时间之间的分钟差。如果本地时区位于 UTC 之后，值为正；如果位于\
    \ UTC 之前，则值为负。\n\n下表显示了一些时区的偏移量：\n\n| 时区 | 偏移量（分钟） |\n| :--- | :--- |\n| UTC |\
    \ 0 |\n| GMT | 0 |\n| 东部时间 (EST) | 300 |\n| 中心时间 (CST) | 360 |\n| 山地时间 (MST) |\
    \ 420 |\n| 太平洋时间 (PST) | 480 |\n| 中欧时间 (CET) | -60 |\n| 东欧时间 (EET) | -120 |\n\
    | 日本标准时间 (JST) | -540 |\n\n某些浏览器的 Bug 不会修正偏移量。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_59_1.png)\n\
    \n"
