  md: '# Capture mouse


    It is extremely useful to know the whereabouts of the cursor when dealing with
    JavaScript in DHTML scripting.


    Whenever the user moves the cursor MouseMove event occurs and this can be captured
    by JavaScript for use with onmousemove event-handler.


    ![](img/5f5106681c8c7072e64c4ea87c891513_144_0.png)


    The first script statement in this example is to trap mouse movements in Netscape
    - substitution must be exactly


    The example below gives a useful way of determining x,y screen coordinates when
    developing DHTML scripts.


    The MouseMove event is captured, then the onmousemove event-handler dynamically
    displays the cursor''s x,y coordinates in a text field named txt:


    ![](img/5f5106681c8c7072e64c4ea87c891513_144_1.png)


    Netscape - substitution must be exactly


    ```

    // // Netscape/Mozilla capture events instruction

    if(navigator.appName == "Netscape")

    window.captureEvents (Event.MOUSEMOVE);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_144_2.png)


    ```

    // a function to react to the MOUSEMOVE event

    function track(e)

    var x = (document.all) ? event.x : e.pageX;

    var y = (document.all) ? event.y : e.pageY;

    document.forms.f.txt.value = "X: " +x + " Y: " +y;

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_144_3.png)


    The document.all property is found in Internet Explorer but not Netscape/Mozilla
    browsers - so it can be useful to apply browser-specific code.


    ```

    // specify the onmousemove event-handler

    document.onmousemove=;

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_144_4.png)


    The Netscape and Internet Explorer DOM use different object names for the cursor''s
    x,y position.


    | MouseMove Event |

    | File Edit View Favorites Tools Help |

    | X 200 Y: 60 |

    | Done Local intranet |


    12. Event-handlers | 143'
  merge: -1
  pgno: 144
