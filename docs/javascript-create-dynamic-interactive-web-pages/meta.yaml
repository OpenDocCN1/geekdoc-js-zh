  md: '# Separate words


    The contents of a string may be separated using the JavaScript `string.split()`
    method.


    A single argument should specify a common character for a delimiter at which points
    the string will be separated. Most commonly this can be a single space character
    so that a phrase with normal spacing will be separated into an array of single
    words.


    Each of the words can then be referenced using the index number of the split string
    array, like any other array.


    The example below illustrates this use of the `string.split()` method together
    with another instance where items in a database may use a pipe character as the
    delimiter:


    ```

    // create and initialize a string variable

    var str = "JavaScript in easy steps";


    // split words into array elements delimited by a space

    var ss = str.split(" ");


    // create and initialize another string variable

    var bk = "JavaScript in easy steps|Mike McGrath";


    // split words into array elements delimited by a pipe

    var bks = bk.split("|");


    // display some split elements

    var res = "Topic: " + ss[0];

    res += "\nTitle: " + bks[0];

    res += "\nAuthor: " + bks[1];

    alert(res);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_81_0.png)


    Data is often stored as a comma-delimited string.


    ![](img/5f5106681c8c7072e64c4ea87c891513_81_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_81_2.png)'
