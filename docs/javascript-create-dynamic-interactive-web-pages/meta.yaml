- md: "\n## DOM hierarchy\n\nThe browser Document Object Model (DOM) is a collection\
    \ of objects in a Web browser that can be addressed by JavaScript in order to\
    \ influence the performance of a HTML document.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_91_0.png)\n\
    \nThese objects follow a strict hierarchy where the window object is the very\
    \ top level. Because window is the leaf \"root\" object, the object can be omitted\
    \ in the address syntax. For instance, the window.document.bgColor property, which\
    \ stores the value of the window's current background color, can be addressed\
    \ simply as document.bgColor.\n\nSeveral of the DOM objects have properties that\
    \ contain an array of the elements in that Web page. For example, with document.images[],\
    \ the images[] array is a property of the document object that will store the\
    \ URL address of each image contained on that Web page. The URL of the first image\
    \ in the HTML code is stored in the array at document.images[0] then the URL of\
    \ successive images are stored at incrementing array index numbers.\n\nThe set_bg()\
    \ function in the example below is called from the onload attribute of the HTML\
    \ <body> tag to assign a value to the document.bgColor after the document has\
    \ been loaded. This then sets the background color of the document to the specified\
    \ value.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_91_1.png)\n\n```javascript\n\
    // function to set the document background color\nfunction set_bg() {\n  document.bgColor\
    \ = \"orange\";\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_91_2.png)\n\
    \n## Revealing page objects\n\nThe script example below reveals the default window\
    \ object properties in both Internet Explorer 6.0 and Netscape 7.0.\n\n```javascript\n\
    // show all window properties\nfor(propertyName in window) {\n  document.write(propertyName\
    \ + \", \");\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_92_0.png)\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_92_1.png)\n\nWindow properties - Internet\
    \ Explorer\nonbeforeunload, onafterprint, top.location, parent, offscreenBuffering,\
    \ frameElement, erroror, screen, event, clipboardData.Onresize, defaultStatus,\
    \ onblur, window, onload, scroll, scrollTop, onfocus, Option, length, onbeforeprint,\
    \ frames, self, clientinformation, external, screenLeft, opener, unload, document,\
    \ closed, history, Image, navigator, status, onhelp, name.\n\nWindow properties\
    \ - Netscape\nnavigator, document, window, parent, top, scrollbars, name, scrollX,\
    \ scrollY, getSelection, scrollByLines, scrollByPages, sizeToContent, dump, setTimeout,\
    \ setinterval, clearTimeout, clearInterval, setResizable, captureEvents, releaseEvents,\
    \ routeEvent, enableExternalCapture, disabledEnableCapture, prompt, open, openDialog,\
    \ frames, find, self, screen, history, content, sidebar, menu, toolbar, locationbar,\
    \ toolbar, statusbar, directories, closed, crypto, pks11, controls, operator,\
    \ status, defaultStatus, location, innerWidth, outerWidth, outerHeight, screenX,\
    \ y, pageOffset, pageOffsetY, length, fullscreen, alert, confirm, focus, blur,\
    \ forward, home, stop, print, moveTo, moveBy, resizeTo, resizeBy, scroll, close,\
    \ updateCommands, escape, unable, atop, btoa, removeEventListener, dispatchEvent,\
    \ getComputedStyle,\n\n## Browser ID\n\nThe navigator object has properties that\
    \ provide information about the browser that is being used to view a document.\n\
    \nThe browser name is revealed by the navigator.appName property whereas a description\
    \ of that particular version is available from the navigator.userAgent property.\n\
    \nIn addition to the release number the navigator.userAgent property contains\
    \ other details, such as the host platform type.\n\nIn the example below the navigator.userAgent\
    \ property reveals the browsers to be Internet Explorer 6.0 (MSIE 6.0) and Netscape\
    \ 7.0 running on a Windows XP platform (NT5.1):\n\n![](img/5f5106681c8c7072e64c4ea87c891513_93_0.png)\n\
    \n```javascript\n// get the browser name\nvar browser = navigator.appName;\n//\
    \ get the browser description\nvar description = navigator.userAgent;\n// display\
    \ the browser name and version\nalert( browser + \"\\n\\n\" + description );\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_93_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_93_2.png)\n\
    \n## Cross-browser compliance\n\nIn order for Web pages to display as desired\
    \ it is sometimes necessary to identify the Document Object Model (DOM) which\
    \ that browser supports.\n\nRelease 4.0 of both Netscape and Internet Explorer\
    \ browsers added DOM support for dynamic HTML (DHTML). For this purpose Netscape\
    \ introduced the document.layers property and Microsoft introduced the document.all\
    \ property.\n\nMore recently, release 6.0 of Netscape and release 5.0 of Internet\
    \ Explorer introduced support for a DOM devised by the World Web Consortium (W3C).\
    \ Crucially, this added a method called document.getElementById() that can be\
    \ used to reference an HTML element by a page name assigned to its id attribute.\
    \ For instance, document.getElementById(\"pic\") could be used to reference a\
    \ HTML element with an id value of \"pic\". For example, <img id=\"pic\" src=\"\
    pic.gif\" alt=\"Fascinating Picture\">\n\nAs Web browsers are free software the\
    \ overwhelming majority of browsers now in use support the W3C DOM.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_94_0.png)\n\
    \nIt is convenient to test for the existence of document.layers, document.all\
    \ and document.getElementById() to discover which DOM is supported by the browser.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_94_1.png)\n\n```javascript\n// cross-browser\
    \ DOM test\nif(document.getElementById) alert(\"W3C DOM Supported\");\nelse\n\
    if (document.all) alert(\"MSIE 4 DOM Supported\");\nelse\nif (document.layers)\
    \ alert(\"NN 4 DOM Supported\");\nelse alert(\"This is a really old Web browser\"\
    );\n```\n\ndom-test.js\n\n![](img/5f5106681c8c7072e64c4ea87c891513_94_2.png)\n\
    \n## Platform check\n\nThe performance of a Web page may be affected by the operating\
    \ system on which the browser is running due to some lack of support for the page\
    \ content.\n\nFor example, a Web browser running on a Linux platform will not\
    \ support Microsoft ActiveX controls. So any Web page containing an ActiveX control\
    \ will not perform as intended on that platform.\n\nPlatform-specific scripting\
    \ can be achieved, in a similar manner to that used for browser-specific scripting,\
    \ with the `navigator.platform` property.\n\nThis property contains a short string\
    \ representing the user's operating system and can be read to branch the script\
    \ to accommodate any platform limitations.\n\nThe example below writes out the\
    \ `navigator.platform` value:\n\n```javascript\n// get the operating system type\n\
    var os = navigator.platform;\ndocument.write(\"Operating system is \" + os);\n\
    ```\n\nActiveX controls are one way to create interface features on Web documents.\n\
    \nThe document.write() method is used to have JavaScript write content into the\
    \ page dynamically - it can write HTML tags too.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_95_0.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_95_1.png)\n\n## Plugins information\n\
    \nFor Netscape/Mozilla browsers JavaScript can be used to discover information\
    \ about any plugins that are installed in the browser with the navigator.plugins\
    \ property.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_96_0.png)\n\nnavigator.plugins\
    \ exists in Internet Explorer but it's not implemented. Each plugin installed\
    \ within a Netscape/Mozilla browser is added as an element in the navigator.plugins\
    \ array. For instance, if the Macromedia Shockwave plugin is installed there is\
    \ a navigator.plugins[\"Shockwave Flash\"] element.\n\nThe plugin has a name property,\
    \ storing the name and version of that plugin, and a description property that\
    \ contains information about the plugin.\n\nIn the following example the JavaScript\
    \ code first checks that the navigator.appName is Netscape before displaying the\
    \ name and description of the first plugin in the navigator.plugins array:\n\n\
    ```javascript\n// for Netscape/Mozilla browsers only\nif (navigator.appName ==\
    \ \"Netscape\") {\n    // for the first plugin element\n    with(navigator.plugins[0])\n\
    \    {\n        // display its name and description\n        document.write(\"\
    <html>\"+name+\"</html>\");\n        document.write(\"<p>\"+description+\"</p>\"\
    );\n    }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_96_1.png)\n\nMozilla\
    \ browsers identify with the Netscape name.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_96_2.png)\n\
    \nThe output from this script will vary according to the plugins installed on\
    \ your browser.\n\n| Listing Plugins - Mozilla |\n| :--- |\n| QuickTime Plug-in\
    \ 6.0.2 |\n| The QuickTime Plugin allows you to view a wide variety of multimedia\
    \ content in Web pages. For more information, visit the QuickTime Web site. |\n"
  mdcn: "\n\n## DOM 层级结构\n\n浏览器文档对象模型（DOM）是 Web 浏览器中的一组对象，可以通过 JavaScript 对其进行访问，以影响\
    \ HTML 文档的性能。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_91_0.png)\n\n这些对象遵循严格的层级结构，其中\
    \ window 对象处于最顶层。由于 window 是叶子节点形式的“根”对象，在地址语法中可以省略该对象。例如，存储当前窗口背景颜色值的 `window.document.bgColor`\
    \ 属性可以简单地访问为 `document.bgColor`。\n\n某些 DOM 对象具有包含该 Web 页面元素数组的属性。例如，通过 `document.images[]`，`images[]`\
    \ 数组是 对象的属性，它将存储该 Web 页面包含的每个图像的 URL 地址。HTML 代码中第一张图片的 URL 存储在数组 `document.images[0]`\
    \ 中，后续图片的 URL 则存储在递增的数组索引中。\n\n下方示例中的 `set_bg()` 函数从 HTML `<body>` 标签的 `onload`\
    \ 属性中调用，在文档加载后为 `document.bgColor` 赋值。这会将文档的背景颜色设置为指定值。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_91_1.png)\n\
    \n```javascript\n// 用于设置文档背景颜色的函数\nfunction set_bg() {\n  document.bgColor = \"\
    orange\";\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_91_2.png)\n\n##\
    \ 显示页面对象\n\n下面的脚本示例显示了 Internet Explorer 6.0 和 Netscape 7.0 中的默认 window 对象属性。\n\
    \n```javascript\n// 显示所有窗口属性\nfor(propertyName in window) {\n  document.write(propertyName\
    \ + \", \");\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_92_0.png)\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_92_1.png)\n\nWindow 属性 - Internet Explorer\n\
    onbeforeunload, onafterprint, top.location, parent, offscreenBuffering, frameElement,\
    \ erroror, screen, event, clipboardData.Onresize, defaultStatus, onblur, window,\
    \ onload, scroll, scrollTop, onfocus, Option, length, onbeforeprint, frames, self,\
    \ clientinformation, external, screenLeft, opener, unload, document, closed, history,\
    \ Image, navigator, status, onhelp, name.\n\nWindow 属性 - Netscape\nnavigator,\
    \ document, window, parent, top, scrollbars, name, scrollX, scrollY, getSelection,\
    \ scrollByLines, scrollByPages, sizeToContent, dump, setTimeout, setinterval,\
    \ clearTimeout, clearInterval, setResizable, captureEvents, releaseEvents, routeEvent,\
    \ enableExternalCapture, disabledEnableCapture, prompt, open, openDialog, frames,\
    \ find, self, screen, history, content, sidebar, menu, toolbar, locationbar, toolbar,\
    \ statusbar, directories, closed, crypto, pks11, controls, operator, status, defaultStatus,\
    \ location, innerWidth, outerWidth, outerHeight, screenX, y, pageOffset, pageOffsetY,\
    \ length, fullscreen, alert, confirm, focus, blur, forward, home, stop, print,\
    \ moveTo, moveBy, resizeTo, resizeBy, scroll, close, updateCommands, escape, unable,\
    \ atop, btoa, removeEventListener, dispatchEvent, getComputedStyle,\n\n## 浏览器\
    \ ID\n\nnavigator 对象具有提供有关用于查看文档的浏览器相关信息的属性。\n\n浏览器名称通过 `navigator.appName` 属性显示，而特定版本的描述可以通过\
    \ `navigator.userAgent` 属性获取。\n\n除了版本号外，`navigator.userAgent` 属性还包含其他细节，例如主机平台类型。\n\
    \n在下方示例中，`navigator.userAgent` 属性显示了运行在 Windows XP 平台（NT5.1）上的 Internet Explorer\
    \ 6.0 (MSIE 6.0) 和 Netscape 7.0 浏览器。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_93_0.png)\n\
    \n```javascript\n// 获取浏览器名称\nvar browser = navigator.appName;\n// 获取浏览器描述\nvar\
    \ description = navigator.userAgent;\n// 显示浏览器名称和版本\nalert( browser + \"\\n\\\
    n\" + description );\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_93_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_93_2.png)\n\n## 跨浏览器兼容性\n\n为了让 Web\
    \ 页面按预期显示，有时需要识别该浏览器支持的文档对象模型（DOM）。\n\nNetscape 和 Internet Explorer 浏览器的 4.0 版本都对动态\
    \ HTML (DHTML) 的 DOM 支持。为了这一目的，Netscape 引入了 `document.layers` 属性，微软引入了 `document.all`\
    \ 属性。\n\n最近，Netscape 的 6.0 版本和 Internet Explorer 的 5.0 版本引入了对世界 Web 联盟（W3C）设计的\
    \ DOM 的支持。关键在于，这增加了一个名为 `document.getElementById()` 的方法，可以通过分配给 `id` 属性的页面名来引用\
    \ HTML 元素。例如，`document.getElementById(\"pic\")` 可用于引用 id 值为 \"pic\" 的 HTML 元素。例如\
    \ `<img id=\"pic\" src=\"pic.gif\" alt=\"Fascinating Picture\">`\n\n由于 Web 浏览器是免费软件，现在使用的大多数浏览器都支持\
    \ W3C DOM。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_94_0.png)\n\n测试 `document.layers`、`document.all`\
    \ 和 `document.getElementById()` 是否存在以发现浏览器支持哪种 DOM 是方便的。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_94_1.png)\n\
    \n```javascript\n// 跨浏览器 DOM 测试\nif(document.getElementById) alert(\"W3C DOM Supported\"\
    );\nelse\nif (document.all) alert(\"MSIE 4 DOM Supported\");\nelse\nif (document.layers)\
    \ alert(\"NN 4 DOM Supported\");\nelse alert(\"This is a really old Web browser\"\
    );\n```\n\ndom-test.js\n\n![](img/5f5106681c8c7072e64c4ea87c891513_94_2.png)\n\
    \n## 平台检查\n\n由于对页面内容的某些支持缺失，Web 页面的性能可能会受到运行浏览器的操作系统的影响。\n\n例如，运行在 Linux 平台上的\
    \ Web 浏览器不支持 Microsoft ActiveX 控制。因此，任何包含 ActiveX 控制的 Web 页面在该平台上都无法按预期运行。\n\n\
    可以类似于用于浏览器特定脚本的方法，通过 `navigator.platform` 属性实现平台特定的脚本。\n\n该属性包含表示用户操作系统的短字符串，可以通过读取它来分支脚本以适应任何平台限制。\n\
    \n下方示例输出了 `navigator.platform` 的值：\n\n```javascript\n// 获取操作系统类型\nvar os = navigator.platform;\n\
    document.write(\"Operating system is \" + os);\n```\n\nActiveX 控制是在 Web 文档上创建界面特征的一种方法。\n\
    \n`document.write()` 方法用于让 JavaScript 动态向页面写入内容——它也可以写入 HTML 标签。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_95_0.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_95_1.png)\n\n## 插件信息\n\n对于 Netscape/Mozilla\
    \ 浏览器，可以使用 JavaScript 通过 `navigator.plugins` 属性发现浏览器中安装的任何插件的信息。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_96_0.png)\n\
    \n`navigator.plugins` 在 Internet Explorer 中存在但未实现。安装在 Netscape/Mozilla 浏览器中的每个插件都作为元素添加到\
    \ `navigator.plugins` 数组中。例如，如果安装了 Macromedia Shockwave 插件，则存在 `navigator.plugins[\"\
    Shockwave Flash\"]` 元素。\n\n插件有一个 `name` 属性，存储该插件的名称和版本，以及一个 `description` 属性，包含关于插件的信息。\n\
    \n在下面的示例中，JavaScript 代码首先检查 `navigator.appName` 是否为 Netscape，然后显示 `navigator.plugins`\
    \ 数组中第一个插件的名称和描述：\n\n```javascript\n// 仅限 Netscape/Mozilla 浏览器\nif (navigator.appName\
    \ == \"Netscape\") {\n    // 针对第一个插件元素\n    with(navigator.plugins[0])\n    {\n\
    \        // 显示其名称和描述\n        document.write(\"<html>\"+name+\"</html>\");\n \
    \       document.write(\"<p>\"+description+\"</p>\");\n    }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_96_1.png)\n\
    \nMozilla 浏览器以 Netscape 名称标识。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_96_2.png)\n\
    \n此脚本的输出将根据浏览器安装的插件而异。\n\n| 列出插件 - Mozilla |\n| :--- |\n| QuickTime Plug-in 6.0.2\
    \ |\n| QuickTime 插件允许你在 Web 页面中查看多种媒体内容。欲需更多信息，请访问 QuickTime 网站。 |\n\n"
