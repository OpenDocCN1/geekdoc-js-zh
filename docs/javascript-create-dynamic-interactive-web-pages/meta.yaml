- img_proc: true
  md: '# Getting date and time


    Date and time is often used in JavaScript to customize the performance of a Web
    page. For example, a script might welcome the user with a greeting appropriate
    to current time:


    The script for this application is contained in the example on page 56.


    ![](img/5f5106681c8c7072e64c4ea87c891513_55_0.png)


    The date and time that is used in JavaScript is taken from the clock and calendar
    in the host system that is running the browser application in which the script
    is loaded.


    To access the system clock information the script must first create a Date object.


    This is achieved in the same manner in which an Array object is created, using
    the JavaScript new keyword, but now with the JavaScript Date() constructor function.
    The example below creates and displays a new Date object:


    ```

    // create a new Date object

    var now = new Date();


    // display the Date object''s date and time information

    alert(now);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_55_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_55_2.png)'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Date information


    The Date object has special methods that may be used to retrieve individual parts
    of the date information.


    Some methods return the date information as an index number that needs to be converted
    by the script.


    The Date.getDay() method returns the day of the week as an index value from 0
    (Sunday) to 6 (Saturday).


    ![](img/5f5106681c8c7072e64c4ea87c891513_56_0.png)


    Also the Date.getMonth() method returns the month of the year as an index value
    from 0 (January) to 11 (December).


    The example below illustrates the Date object methods and uses arrays to display
    the day and month names:


    ```

    create an array of day names

    var days = new Array("Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat");


    create an array of month names

    var months = new Array("Jan", "Feb", "Mar", "Apr", "May", "Jun", "Aug", "Sep",
    "Oct", "Nov", "Dec");


    var now = new Date(); // create a new Date object

    var yy = now.getYear(); // get the year

    if(yy < 2000) yy += 1900; // adjust year for Netscape

    var mm = now.getMonth(); // get the month

    mm = [mm]; // convert month number to name

    var dd = now.getDate(); // get day number in the month

    var dy = now.getDay(); // get day number in the week

    d = [dy]; // convert day to name

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_56_1.png)


    Netscape reports

    the year as the

    number of years

    elapsed since

    1900 — so in this

    case a line of script adds 1900

    to the reported date.


    ```

    // display the extracted date and day information

    alert(dy + " " + mm + " " + dd + " " + yy);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_56_2.png)


    5. Date and time | 55'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# # Time information


    The Date object has special methods to access the time information that it contains.
    The example below gets the current hours, minutes, seconds and milliseconds from
    the host clock and displays a welcome message appropriate for the time of day:


    ![](img/5f5106681c8c7072e64c4ea87c891513_57_0.png)


    The hours are returned as numbers 0-23 in 24-hour format.


    ```

    javascript create a new Date object

    var now = new Date();


    // extract the time information

    var hh = now.getHours();

    var mn = now.getMinutes();

    var ss = now.getSeconds();

    var ms = now.getMilliseconds();


    default welcome message

    var hi = "Good Morning";


    // welcome message if after noon

    if( hh > 11 ) hi="Good Afternoon";


    // welcome message if after 6 p.m.

    if( hh > 17 ) hi="Good Evening";


    // display welcome message and the current time

    var tim = hi + "\n";

    tim += "Hours: " +hh+ "\n";

    tim += "Minutes: " +mn+ "\n";

    tim += "Seconds: " +ss+ "." +ms;

    alert(tim);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_57_1.png)


    56 | JavaScript in easy steps'
  merge: -1
  pgno: 57
- img_proc: true
  md: "# Current time\n\nThe JavaScript Date.getTime() method can be used to compare\
    \ two date objects numerically.\n\nThe method returns a number that is the difference\
    \ in milliseconds between the date object value and midnight on January 1, 1970\
    \ (sometimes referred to as \"the epoch\").\n\nThe example below creates a Date\
    \ object both before and after running a loop, then compares the values returned\
    \ by the Date.getTime() method to calculate the actual time taken to execute the\
    \ loop:\n\n```\ncreate a new Date object then get the current time\nvar start\
    \ = new Date();\nvar msec1 = start.getTime();\n\nrun a loop counting up to 250,000\n\
    var num = 0;\nfor(var i = 0; i < 250000; i++) {\n  num++;\n}\n\n// get another\
    \ Date object and get the time now\nvar stop = new Date();\nvar msec2 = stop.getTime();\n\
    \n// subtract the start time from the stop time to\ndcover the amount of time\
    \ between the two points\nvar diff = ( msec2 - msec1 ) / 1000;\n\n// display the\
    \ elapsed time\nalert(\"Time elapsed: \" +diff+\" seconds\");\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_58_0.png)\n\
    \nelapsed-time.js\n\n![](img/5f5106681c8c7072e64c4ea87c891513_58_1.png)\n\nAdjust\
    \ the number that the loop counts up to according to your browser and platform.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_58_2.png)\n\n5. Date and time | 57"
  merge: -1
