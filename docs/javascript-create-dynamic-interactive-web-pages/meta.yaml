  md: '# Cross-browser compliance


    In order for Web pages to display as desired it is sometimes necessary to identify
    the Document Object Model (DOM) which that browser supports.


    Release 4.0 of both Netscape and Internet Explorer browsers added DOM support
    for dynamic HTML (DHTML). For this purpose Netscape introduced the document.layers
    property and Microsoft introduced the document.all property.


    More recently, release 6.0 of Netscape and release 5.0 of Internet Explorer introduced
    support for a DOM devised by the World Web Consortium (W3C). Crucially, this added
    a method called document.getElementById() that can be used to reference an HTML
    element by a page name assigned to its id attribute. For instance, document.getElementById("pic")
    could be used to reference a HTML element with an id value of "pic". For example,
    <img id="pic" src="pic.gif" alt="Fascinating Picture">


    As Web browsers are free software the overwhelming majority of browsers now in
    use support the W3C DOM.


    ![](img/5f5106681c8c7072e64c4ea87c891513_94_0.png)


    It is convenient to test for the existence document.layers, document.all and document.getElementById()
    to discover which DOM is supported by the browser.


    ![](img/5f5106681c8c7072e64c4ea87c891513_94_1.png)


    ```

    # cross-browser DOM test

    if(document.getElementById) alert("W3C DOM Supported");

    else

    if (document.all) alert("MSIE 4 DOM Supported");

    else

    if (document.layers) alert("NN 4 DOM Supported");

    else alert("This is a really old Web browser");

    ```


    dom-test.js


    ![](img/5f5106681c8c7072e64c4ea87c891513_94_2.png)


    8. Addressing page objects | 93'
