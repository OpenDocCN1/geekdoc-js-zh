    document.write(m.hoop.value+" Hoops @ $3.99 each<br/>");

    if (m.cone.value != "")

    document.write(m.cone.value+" Cones @ $5.99 each<br/>");

    ```


    confirm.js (cont''d)


    Include this script in the body of the HTML document at the point where the details
    are to appear.


    ![](img/5f5106681c8c7072e64c4ea87c891513_185_0.png)


    Add a feature to navigate back to the order page so the user can amend the order
    if required.


    ![](img/5f5106681c8c7072e64c4ea87c891513_185_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_185_2.png)


    | Menu | Order No. 3313432<br>For John Smith<br>Account No. 12345 |

    | Producte | 5 Balls @ $7.99 each<br>8 Cones @ $5.99 each |


    The confirm.html document contains a further hidden form with the id of f that
    exactly mirrors the hidden form m in the menu frame. When the user clicks the
    hidden button on this page its onclick calls a JavaScript function that copies
    all the values from form m to form f, then it submits form f to the server.


