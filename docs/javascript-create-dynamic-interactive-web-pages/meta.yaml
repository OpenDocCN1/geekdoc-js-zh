  - '[PAGE 180]


    # JavaScript in e-commerce


    This final chapter shows how some of the earlier examples may be applied to e-commerce
    applications and illustrates how frames can store data for later use in other
    frames.


    # Covers


    +   - The products page | 180

    - A hidden form | 181

    - Get the customer details | 182

    - Generate an order number | 183

    - Confirm the order | 184

    - Submit the order | 185

    - What next? | 186'
  - '[PAGE 181]


    # The products page


    The example in this chapter follows the development of an on-line order that starts
    with a page from which the user may select quantities of items to order.


    The page is framed with a left-hand panel named menu and a right-hand larger frame
    named main.


    Typically the menu frame will remain constantly displayed while the main frame
    will display different pages as the user navigates around the site.


    A button is added at the bottom of the form that will advance the user to the
    next stage of the order process.


    In the form, depicted below, the user has entered quantity requirement for some
    of the illustrated products:


    ![](img/5f5106681c8c7072e64c4ea87c891513_181_0.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_181_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_181_2.png)


    The frame-holder document for this example is named e-commerce.html. It displays
    a menu.html in the menu frame and (initially) products.html in the main frame
    – as shown above.'
  - "[PAGE 182]\n\n# A hidden form\n\nThe page in the menu frame contains a hidden\
    \ form named m (for memory) that will retain the order data while the pages in\
    \ the main frame are changed.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_182_0.png)\n\
    \nIt consists of input items that mirror those of the form named f on the product\
    \ page together with inputs for customer name, account number and order number.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_182_1.png)\n\n```\n<!-- a form to store\
    \ order data --\n<form id=\"m\" action=\"\" method=\"post\">\n<input type=\"hidden\"\
    \ name=\"customer\" value=\"\" />\n<input type=\"hidden\" name=\"accountnumber\"\
    \ value=\"\" />\n<input type=\"hidden\" name=\"ordernumber\" value=\"\" />\n<input\
    \ type=\"hidden\" name=\"ball\" value=\"\" />\n<input type=\"hidden\" name=\"\
    hoop\" value=\"\" />\n<input type=\"hidden\" name=\"cone\" value=\"\" />\n</form>\n\
    ```\n\nThe onclick attribute of the button on the products page calls a JavaScript\
    \ function that fills the values of the hidden form m with the values entered\
    \ by the user into the products page f. It then loads a new page into the main\
    \ frame.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_182_2.png)\n\n```\n// a function\
    \ to store values in a form in another frame\nfunction populate() {\n\n  // variables\
    \ for the form objects\n  var m = parent.frames.menu.document.forms.m;\n  var\
    \ f = document.forms.f;\n\n  // copy the values\n  m.ball.value = f.ball.value;\n\
    \  m.hoop.value = f.hoop.value;\n  m.cone.value = f.cone.value;\n\n  //load a\
    \ new page into this frame\n  window.location = \"customer.html\";n}\n```"
  - "[PAGE 183]\n\n# Get the customer details\n\nThe next page in the **main** frame,\
    \ customer.html, requests the customer's name and account number.\n\nWhen the\
    \ user clicks the button on this page its **onclick** attribute calls a JavaScript\
    \ function to store the user input. It copies the values of the form **f** inputs\
    \ on this page to the identically-named hidden inputs in the memory form **m**\
    \ in the **menu** frame.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_183_0.png)\n\
    \n```\na function to store values in a form in another frame\nfunction populate()\
    \ {\n  // variables for the form objects\n  var m = parent.frames.menu.document.forms.m;\n\
    \  var f = document.forms.f;\n\n  // copy the values\n  m.customer.value = f.customer.value;\n\
    \  m.accountnum.value = f.accountnum.value;\n\n  // load another page in this\
    \ frame\n  window.location = \"confirm.html\";\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_183_1.png)\n\
    \n| E-commerce Example |\n|---||\n| Menu | Please Enter Your Details... |\n| Products\
    \ | Customer Name: John Smith |\n| | Account Number: 12345 |\n| | Confirm This\
    \ Order |"
  - '[PAGE 184]


    # Generate an order number


    The final page that appears in the order process contains all details of the customer''s
    order for the user to confirm before submitting the order form.


    These details are dynamically written by JavaScript with data retrieved from the
    hidden form m in the menu frame.


    It is useful to allocate a unique number to the customer''s order for identification
    purposes.


    The JavaScript on the confirmation page first generates this number, then stores
    it in the hidden form m in the menu frame.


    Typically a Date object can provide an order number using parts of the current
    time concatenated into a single number.


    In this script the order number will comprise the final number in the year followed
    by the month number, then the hour, minute and second:


    ```

    variables for the form objects

    var m = parent.frames.menu.document.forms.m;

    var f = document.forms.f;


    // generate a time-derived order number

    var d = new Date();

    var yr = (d.getFullYear()).toString();

    var js = d.charAt(3);

    var mo = (d.getMonth()).toString();

    var hr = (d.getHours()).toString();

    var mn = (d.getMinutes()).toString();

    var sc = (d.getSeconds()).toString();

    var onun = yr + mo + hr + mn + sc;

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_184_0.png)


    > It is unlikely but possible two different customers could generate the order
    number at exactly the same time.


    ![](img/5f5106681c8c7072e64c4ea87c891513_184_1.png)


    The script continues on the next page to dynamically write content using data
    from the hidden form m to state the order number, customer name and account number.


    Items required on the order and their quantity are listed only for those items
    where the user has made an entry.


    // store the order number with the other order data

    .ordernum.value = onun;'
