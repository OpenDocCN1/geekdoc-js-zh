  - "[PAGE 125]\n\n# The form object\n\nThe window.document.forms object contains\
    \ an array of all the forms in an HTML document, indexed in the order in which\
    \ they appear in the HTML code.\n\nFor instance, window.document.forms[0] addresses\
    \ the first form to appear in the HTML code of a Web page.\n\nIf the id attribute\
    \ of the <form> element has been assigned a value then the form can be addressed\
    \ by name. So a form f can be simply addressed as document.forms.f.\n\nAll other\
    \ attributes assigned in the <form> tag are also accessible properties of that\
    \ form object. For instance, with this form...\n\n![](img/5f5106681c8c7072e64c4ea87c891513_125_0.png)\n\
    \n```\n<form id = \"f\" method = \"post\" action = \"mailto:a@b.com\" enctype\
    \ = \"text/plain\">\n```\n\n...the following JavaScript function can be called\
    \ from the HTML <body>'s onload attribute to reveal the form properties:\n\n```\n\
    function form_info() {\n // get the form name\n  var msg = \"Name: \" + document.forms.f.id;\n\
    \n // get the form method, action and encoding type\n  msg += \"\\nMethod: \"\
    \ + document.forms.f.method;\n  msg += \"\\nAction: \" + document.forms.f.action;\n\
    \  msg += \"\\nEnctype: \" + document.forms.f.encoding;\n  alert(msg);\n}\n```\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_125_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_125_2.png)"
- md: "\n## Form elements\n\nThe window.document.forms[].elements object contains\
    \ an array of all the elements within a form indexed in the order in which they\
    \ appear in the HTML code. With a named f for instance, document.forms.f.elements[0]\
    \ addresses the first element that appears in that form.\n\nIf the name attribute\
    \ of the element has been assigned a value then the element can be addressed by\
    \ name. So the element btn1 in this form can simply be addressed as document.forms.f.btn1...\n\
    \n```html\n<form id=\"f\" method=\"post\">\n<input type=\"button\" name=\"btn1\"\
    \ value=\"Click Me\"\nonclick=\"alert('Hi - I am a button')\" />\n</form>\n```\n\
    \nOther attributes are accessible as properties of that element – as illustrated\
    \ by this example:\n\n```javascript\nfunction element_info() {\n    // get the\
    \ element type\n    var msg = \"Element Type: \"+document.forms.f.btn1.type;\n\
    \    // get the element value\n    msg += \"\\nElement Value: \"+document.forms.f.btn1.value;\n\
    \    // get the element onclick\n    msg += \"\\nElement Onclick: \"+document.forms.f.btn1.onclick;\n\
    \    alert(msg );\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_126_0.png)\n\
    \nUnless stated otherwise, all the example functions in this chapter are called\
    \ from the HTML <body> tag's onload attribute – a form field cannot be changed\
    \ before it has been created.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_126_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_126_2.png)\n\n## Click buttons\n\n\
    Values assigned in the HTML code may be reassigned by JavaScript so that a button\
    \ will perform a different action.\n\nIn the example below a HTML onclick method\
    \ specifies that the first() function will be called when the button is pushed:\n\
    \n```html\n<form id=\"f\" method=\"post\">\n  <input type=\"button\" name=\"btn1\"\
    \ value=\"Click Me\"\n  onclick=\"first()\"\n</form>\n```\n\nThe first() function\
    \ assigns a variable to a string, then specifies a new event-handler function\
    \ called second() to the button's onclick attribute. Subsequently pushing the\
    \ button will call the second() function and execute the statement it contains.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_127_0.png)\n\n```javascript\n// create\
    \ a global variable\nvar msg;\n\n// a function to store an initial message\nfunction\
    \ first() {\n  msg = \"This message was left by the first function\";\n  // assign\
    \ another function to the button\n  document.forms.f.btn1.onclick = second;\n\
    }\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_127_1.png)\n\nWhen assigning\
    \ event-handler functions only assign the name - without any brackets.\n\n```javascript\n\
    // a function to store a second message and display both\nfunction second() {\n\
    \  msg += \"\\nHi, I'm the second function\";\n  alert(msg);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_127_2.png)\n\
    \n## Toggle value\n\nIt is useful to change the label that is displayed on a button\
    \ by its value attribute if that button performs dual actions.\n\nIn the following\
    \ example a button calls a stopgo() function to start or stop a counter. The counter\
    \ increments an integer variable at 1-second intervals and displays the count\
    \ in the window's status bar.\n\nThe button label normally reads Start but changes\
    \ to Stop if the timer count() function is running.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_128_0.png)\n\
    \n```javascript\nvar running = false, num = -1, tim; // create globals\n\nfunction\
    \ count() // counter function\n{\n  if(running) {\n    num++; // increment the\
    \ tally\n    window.status = \"Seconds elapsed: \" + num;\n    tim = setTimeout(\"\
    count()\", 1000);\n  } else {\n    num = -1; clearTimeout(tim); // or halt\n \
    \ }\n}\n\nfunction stopgo() // control function\n{\n  running = !running; // toggle\
    \ counter\n  count();\n  document.forms.f.btn1.value = (running)? ? \"Stop\" :\
    \ \"Start\"; // change the label\n}\n```\n\nThe num variable is initialized at\
    \ -1 so that when first incremented counter will start at zero.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_128_1.png)\n\
    \nThe operator is used here to change the boolean variable to the opposite of\
    \ its current value.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_128_2.png)\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_128_3.png)\n\nII. Form properties | 127\n\
    \n## Text boxes\n\nThe text displayed in a HTML <input> text is easily changed\
    \ by JavaScript simply by assigning a new string to the value property of that\
    \ form element.\n\nHistorically, text boxes were restricted to display text in\
    \ just one fixed font but modern browsers allow a choice of font, size and color.\n\
    \nThe example below displays a string in a text box and adds style characteristics\
    \ for font, foreground-color and background-color:\n\n```javascript\n// function\
    \ to set the text in a form text field\nfunction set_text() {\n    // for text\
    \ field txt1 in form f\n    with(document.forms.f.txt1) {\n        // set the\
    \ text value\n        value = \"JavaScript in easy steps\";\n\n        // set\
    \ the style characteristics\n        style.fontFamily = \"comic sans ms\";\n \
    \       style.fontSize = \"16pt\";\n        style.color = \"yellow\";\n      \
    \  style.backgroundColor = \"red\";\n    }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_129_0.png)\n\
    \n| Text Field | |\n|---|---|\n| Text boxes | |\n| JavaScript in easy steps |\
    \ |\n\n## Password boxes\n\nA HTML <input type=\"password\"> is a text box that\
    \ displays asterisks in place of characters. This example converts the password\
    \ input, named pwd1, to lowercase. If the string matches, the browser will then\
    \ load the page; otherwise it will display an alert and clear the field.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_130_0.png)\n\
    \n```javascript\na function to validate password\nfunction validate() {\n  //\
    \ convert input to lowercase\n  var entry = document.forms.f.pwd1.toLowerCase();\n\
    \  // if the input is correct\n  if (entry == \"admin\") {\n    window.location\
    \ = \"page\";\n  } else {\n    // display password - incorrect\n    alert(\"Password\
    \ - incorrect\");\n    // clear the field\n    document.forms.f.pwd1.value = \"\
    \";\n  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_130_1.png)\n\n| Password\
    \ Field | |\n|---|---|\n| Password boxes | |\n| Password - incorrect | |\n\n##\
    \ Radio buttons\n\nA group of radio buttons with the same name will only allow\
    \ one of them to be checked at a time. This object contains an array of all the\
    \ buttons in the order in which they appear in the HTML. In the example below\
    \ JavaScript checks the radio button by index:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_131_0.png)\n\
    \n```javascript\n// a function to get radio information\nfunction radio_info()\
    \ {\n  // select the radio button\n  document.forms.f.radii[1].checked = true;\n\
    \n  // get both radio values\n  var msg = \"1st Radio Value: \" + document.forms.f.radii[0].value;\n\
    \  msg += \" 2nd Radio Value: \" + document.forms.f.radii[1].value;\n  document.forms.f.txt1.value\
    \ = msg;\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_131_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_131_2.png)\n\
    \n## Radio polling\n\nThe important feature of a radio button is whether it is\
    \ checked or not. This can be ascertained from the radio button's **checked**\
    \ property that will return a boolean **true** if the radio is checked or a boolean\
    \ **false** if it is unchecked.\n\nJavaScript can loop through all the radio button\
    \ array elements to test for **checked** property, then use the value assigned\
    \ to the radio button that is checked.\n\nIn the example below the function is\
    \ called from the HTML **onclick** attribute of the push button <input>. This\
    \ loops through the elements of the radio button array to discover which button,\
    \ if any, is checked. When a button has been checked its associated value is used\
    \ by the script to apply a new background color to the page.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_132_0.png)\n\
    \n```javascript\na function to discover which radio button is selected\nfunction\
    \ radio_poll() {\n  // loop through all radio buttons\n  for(var i=0; i < document.forms.f.radl.length;\
    \ i++) {\n    // if the radio is selected, use its value\n    if( document.forms.f.radl[i].checked\
    \ )\n      document.bgColor=document.forms.f.radl[i].value;\n  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_132_1.png)\n"
  mdcn: "\n\n## 表单元素\n\n`window.document.forms[].elements` 对象包含表单内所有元素的数组，并按照它们在 HTML\
    \ 代码中出现的顺序进行索引。例如，对于一个命名为 `f` 的表单，`document.forms.f.elements[0]` 指向表单中出现的第一个元素。\n\
    \n如果元素的 `name` 属性已赋值，则可以通过名称访问该元素。因此，此表单中的元素 `btn1` 可以简单地通过 `document.forms.f.btn1`\
    \ 来访问……\n\n```html\n<form id=\"f\" method=\"post\">\n<input type=\"button\" name=\"\
    btn1\" value=\"Click Me\"\nonclick=\"alert('Hi - I am a button')\" />\n</form>\n\
    ```\n\n其他属性可以作为该元素的属性访问——如下例所示：\n\n```javascript\nfunction element_info() {\n\
    \    // 获取元素类型\n    var msg = \"Element Type: \"+document.forms.f.btn1.type;\n\
    \    // 获取元素值\n    msg += \"\\nElement Value: \"+document.forms.f.btn1.value;\n\
    \    // 获取元素的 onclick 事件\n    msg += \"\\nElement Onclick: \"+document.forms.f.btn1.onclick;\n\
    \    alert(msg );\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_126_0.png)\n\
    \n除非另有说明，本章所有的示例函数都是从 HTML `<body>` 标签的 `onload` 属性调用的——表单字段在创建之前无法被更改。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_126_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_126_2.png)\n\n## 点击按钮\n\nHTML 代码中赋值的值可以通过\
    \ JavaScript 重新赋值，以便按钮执行不同的操作。\n\n在下例示例中，HTML 的 `onclick` 方法指定在按下按钮时将调用 `first()`\
    \ 函数：\n\n```html\n<form id=\"f\" method=\"post\">\n  <input type=\"button\" name=\"\
    btn1\" value=\"Click Me\"\n  onclick=\"first()\"\n</form>\n```\n\n`first()` 函数将字符串赋值给变量，然后为按钮的\
    \ `onclick` 属性指定一个名为 `second()` 的新事件处理函数。随后按下按钮将调用 `second()` 函数并执行其包含的语句。\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_127_0.png)\n\n```javascript\n// 创建全局变量\n\
    var msg;\n\n// 用于存储初始消息的函数\nfunction first() {\n  msg = \"This message was left\
    \ by the first function\";\n  // 将另一个函数赋值给按钮\n  document.forms.f.btn1.onclick\
    \ = second;\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_127_1.png)\n\n\
    赋值事件处理函数时，只赋值名称——不要带任何括号。\n\n```javascript\n// 用于存储第二个消息并显示两个消息的函数\nfunction second()\
    \ {\n  msg += \"\\nHi, I'm the second function\";\n  alert(msg);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_127_2.png)\n\
    \n## 切换值\n\n如果一个按钮执行双重操作，通过其 `value` 属性更改显示在按钮上的标签是有用的。\n\n在以下示例中，按钮调用 `stopgo()`\
    \ 函数来启动或停止计数器。计数器每隔 1 秒增加一次整数变量，并在窗口的状态栏中显示计数。\n\n按钮标签通常显示为 \"Start”（开始），但如果计时器\
    \ `count()` 函数正在运行，它会变为 \"Stop”（停止）。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_128_0.png)\n\
    \n```javascript\nvar running = false, num = -1, tim; // 创建全局变量\n\nfunction count()\
    \ // 计数函数\n{\n  if(running) {\n    num++; // 计数计数\n    window.status = \"Seconds\
    \ elapsed: \" + num;\n    tim = setTimeout(\"count()\", 1000);\n  } else {\n \
    \   num = -1; clearTimeout(tim); // 或者停止\n  }\n}\n\nfunction stopgo() // 控制函数\n\
    {\n  running = !running; // 切换计数器\n  count();\n  document.forms.f.btn1.value =\
    \ (running)? ? \"Stop\" : \"Start\"; // 更改标签\n}\n```\n\n`num` 变量初始化为 -1，这样在第一次增加时计数器将从零开始。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_128_1.png)\n\n在这里使用该运算符将布尔变量更改为其当前值的反值。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_128_2.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_128_3.png)\n\
    \nII. 表单属性 | 127\n\n## 文本框\n\nHTML `<input>` 文本中显示的文字可以通过 JavaScript 简单地为该表单元素的\
    \ `value` 属性分配新字符串来轻松更改。\n\n从历史角度看，文本框曾限制仅以一种固定字体显示文本，但现代浏览器允许选择字体、大小和颜色。\n\n\
    下例在文本框中显示一个字符串，并为字体、前景颜色和背景颜色添加样式特征：\n\n```javascript\n// 设置表单文本字段文本的函数\nfunction\
    \ set_text() {\n    // 针对表单 f 中的文本字段 txt1\n    with(document.forms.f.txt1) {\n\
    \        // 设置文本值\n        value = \"JavaScript in easy steps\";\n\n        //\
    \ 设置样式特征\n        style.fontFamily = \"comic sans ms\";\n        style.fontSize\
    \ = \"16pt\";\n        style.color = \"yellow\";\n        style.backgroundColor\
    \ = \"red\";\n    }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_129_0.png)\n\
    \n| 表单字段 | |\n|---|\n| 文本框 | |\n| JavaScript入门 |\n\n## 密码框\n\nHTML `<input type=\"\
    password\">` 是一种文本框，它用星号代替字符显示。此示例将名为 `pwd` 的输入转换为小写。如果匹配，浏览器将加载页面；否则将显示警告。\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_130_0)\n\n```javascript\n验证密码的函数\nfunction\
    \ validate() {\n  // 将输入转换为小写\n  var entry = document.forms.f.pwd.toLowerCase();\n\
    \  // 如果输入正确\n  if (entry == \"admin\") {\n    window.location = \"page\";\n \
    \ } else {\n    // 密码错误\n    alert(\"Password - incorrect\");\n    // 清空字段\n \
    \   document.forms.f.pwd.value = \"\";\n  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_130_1.png)\n\
    \n| 密码字段 | |\n|---|\n| 密码框 | |\n| 密码错误 |\n\n## 单选按钮\n\n具有相同的单选按钮组允许其中一个被选中。此对象包含了在\
    \ HTML 中出现的所有按钮。在下例中，JavaScript 通过索引检查单选按钮：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_131_0.png)\n\
    \n```javascript\n// 获取单选信息的函数\nfunction radio_info() {\n  // 选择单选按钮\n  document.forms.f.radii[1].checked\
    \ = true;\n\n  // 获取两个单选的值\n  var msg = \"1st Radio Value: \" + document.forms.f.radii[0].value;\n\
    \  msg += \" 2nd Radio Value: \" + document.forms.f.radii[1].value;\n  document.forms.f.txt1.value\
    \ = msg;\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_131_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_131_2.png)\n\
    \n## 单选轮\n\n单选按钮重要的特性是它是否被选中。这可以通过单选按钮的 `checked` 属性来确定，如果单选选中则返回布尔值 `true`，如果未选中则返回\
    \ `false`。\n\nJavaScript 可以遍历所有单选按钮数组以测试 `checked` 属性，然后使用被选中的单选按钮的值。\n\n在下例中，该函数是从推送按钮\
    \ `<input>` 的 `onclick` 属性调用的。它遍历单选按钮数组以发现哪个按钮被选中了。当某个按钮被选中时，其关联的值将被脚本用于为页面应用新的背景颜色。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_132_0.png)\n\n```javascript\n// 发现哪个单选按钮被选中的函数\n\
    function radio_poll() {\n  // 遍历所有单选按钮\n  for(var i=0; i < document.forms.f.radl.length;\
    \ i++) {\n    // 如果单选被选中，使用其值\n    if( document.forms.f.radl[i].checked )\n  \
    \    document.bgColor=document.forms.f.radl[i].value;\n  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_132_1.png)\n\
    \n"
