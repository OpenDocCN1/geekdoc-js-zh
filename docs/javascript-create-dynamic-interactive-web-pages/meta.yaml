  - '[PAGE 89]


    # Object constructor to address object properties and methods


    The JavaScript syntax uses the object name followed by a period then the property
    name.


    For instance, array.length addresses the length property of the array object.


    Previous example code in this book has used intrinsic JavaScript objects with
    pre-defined properties and methods.


    ![](img/5f5106681c8c7072e64c4ea87c891513_89_0.png)


    To declare both the object name and given property name.


    New custom objects can be easily created using the JavaScript new keyword with
    the Object() constructor.


    Properties may then be allocated to the new custom object by declaring a property
    name and assigning a value to it.


    The example below creates a new car object called car and then gives it three
    properties with assigned values:


    ![](img/5f5106681c8c7072e64c4ea87c891513_89_1.png)


    ```

    create a new car object

    var car = new Object();


    // create and initialize a maker property

    car.maker = "Porsche"


    // create and initialize a model property

    car.model = "Boxster"


    // create and initialize a color property

    car.color = "Red"


    // display all the car property values

    alert(car.color + " " + car.maker + " " + car.model );

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_89_2.png)'
  - '[PAGE 90]


    # Property inheritance


    Further flexibility can be added to the example on the facing page by assigning
    the newly created custom object to a property of another custom object.


    In this case the properties and values of the assigned object are inherited by
    the property of the second custom object.


    The inherited properties are addressed by adding a period and the inherited property
    name after the property address to which they have been assigned.


    It is helpful to understand this relationship when dealing with objects and properties
    in Web pages.


    The following example demonstrates how a new object is assigned to a property
    of a second custom object and how the inherited properties may be addressed:


    ```

    create a new object with assigned property values

    var suv = new Object();

    suv.badge = "Explorer";

    suv.type = "4X4";

    suv.doors = 4;

    suv.color = "Red";

    suv.engine = "4.0 liters";

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_90_0.png)


    An object must first been created in the script before it can be assigned to another
    object''s property.


    ```

    create another object that inherits from the first

    var car = new Object();

    car.maker = "Ford";

    car.model = suv;

    ```


    ```

    display unique value and inherited property values

    alert(car.maker+" +car.model.badge+" +car.model.type+");

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_90_1.png)


