  - '[PAGE 55]


    # Getting date and time


    Date and time is often used in JavaScript to customize the performance of a Web
    page. For example, a script might welcome the user with a greeting appropriate
    to current time:


    The script for this application is contained in the example on page 56.


    ![](img/5f5106681c8c7072e64c4ea87c891513_55_0.png)


    The date and time that is used in JavaScript is taken from the clock and calendar
    in the host system that is running the browser application in which the script
    is loaded.


    To access the system clock information the script must first create a Date object.


    This is achieved in the same manner in which an Array object is created, using
    the JavaScript new keyword, but now with the JavaScript Date() constructor function.
    The example below creates and displays a new Date object:


    ```

    // create a new Date object

    var now = new Date();


    // display the Date object''s date and time information

    alert(now);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_55_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_55_2.png)'
  - '[PAGE 56]


    # Date information


    The Date object has special methods that may be used to retrieve individual parts
    of the date information.


    Some methods return the date information as an index number that needs to be converted
    by the script.


    The Date.getDay() method returns the day of the week as an index value from 0
    (Sunday) to 6 (Saturday).


    ![](img/5f5106681c8c7072e64c4ea87c891513_56_0.png)


    Also the Date.getMonth() method returns the month of the year as an index value
    from 0 (January) to 11 (December).


    The example below illustrates the Date object methods and uses arrays to display
    the day and month names:


    ```

    create an array of day names

    var days = new Array("Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat");


    create an array of month names

    var months = new Array("Jan", "Feb", "Mar", "Apr", "May", "Jun", "Aug", "Sep",
    "Oct", "Nov", "Dec");


    var now = new Date(); // create a new Date object

    var yy = now.getYear(); // get the year

    if(yy < 2000) yy += 1900; // adjust year for Netscape

    var mm = now.getMonth(); // get the month

    mm = [mm]; // convert month number to name

    var dd = now.getDate(); // get day number in the month

    var dy = now.getDay(); // get day number in the week

    d = [dy]; // convert day to name

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_56_1.png)


    Netscape reports

    the year as the

    number of years

    elapsed since

    1900 — so in this

    case a line of script adds 1900

    to the reported date.


    ```

    // display the extracted date and day information

    alert(dy + " " + mm + " " + dd + " " + yy);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_56_2.png)


