    ---\n\n# Pop-up layers\n\nThis example builds on the earlier visibility toggle\
    \ script by using multiple layers which have their visibility toggled by an image\
    \ map.\n\nWhen the cursor is placed over an image map hyperlink, the JavaScript\
    \ function will display the appropriate layer but will hide that layer when the\
    \ cursor moves off the link.\n\nBoth layers are created in the HTML code with\
    \ their visibility property set to hidden – so they are not initially visible.\
    \ Placing the cursor over an active area of the image causes the onmouseover event\
    \ to call the talk() function. The function call passes a string argument to identify\
    \ which active area is the caller. This determines which layer object is to be\
    \ manipulated.\n\nThe talk() function sets the visibility style of the appropriate\
    \ layer object to visible – so it becomes visible. Moving the cursor off an active\
    \ area causes the onmouseout event, again passing a string argument identifier.\
    \ This once more sets the visibility style of the appropriate layer object to\
    \ hidden – so it becomes invisible.\n\nThis type of dynamic script can be used\
    \ to great effect with navigation menu rollovers.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_173_0.png)\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_173_1.png)\n\n---\n\n# JavaScript in\
    \ easy steps\n\n```javascript\n// a function to toggle visibility on\nfunction\
    \ talk(str) {\n  // a variable to store the object\n  var obj;\n\n  // get the\
    \ appropriate div layer\n  if (str == \"sal\") obj = document.getElementById(\"\
    sal\");\n  if (str == \"har\") obj = document.getElementById(\"har\");\n\n  //\
    \ show the layer\n  obj.style.visibility = \"visible\";\n}\n\n// function to toggle\
    \ visibility off\nfunction hush(str) {\n  // a variable to store the object\n\
    \  var obj;\n\n  // get the appropriate div layer\n  if (str == \"sal\") obj =\
    \ document.getElementById(\"sal\");\n  if (str == \"har\") obj = document.getElementById(\"\
    har\");\n\n  // hide the layer\n  obj.style.visibility = \"hidden\";\n}\n```\n\
