  md: "# Images array\n\nThe window.document.images[] object is an array of all image\
    \ objects contained within a Web page – in the order in which the HTML code added\
    \ to the page. so the first listed image is allocated to the first array element\
    \ and can be addressed as document.images[0].\n\nIn this example the name assigned\
    \ to the HTML id attribute and the src URL can be accessed for each image along\
    \ with the total length of the document.images array:\n\n+   Always give images\
    \ a name with the HTML id attribute.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_117_0.png)\n\
    \n+   The images array elements are only available after the browser has completely\
    \ loaded the page.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_117_1.png)\n\n\
    | File | Edit | View | Favorites | Tools | Help |\n|---|---|---|---|---|---||\n\
    | Flower Top Hat Dart | | | |\n\n```\n// a function to get images information\n\
    function image_info() {\n  var msg = \"Total Images : \" + document.images.length;\n\
    \  msg+=\"\\Middle Image Name : \"+document.images[1].id;\n  msg+=\"\\Middle Image\
    \ Source : \"+document.images[1].src;\n  alert(msg);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_117_2.png)\n\
    \nThis example assumes these images appear in the HTML code sequentially from\
    \ left to right – but this may not always be the case.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_117_3.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_117_4.png)\n\n116 | JavaScript in easy\
    \ steps"
