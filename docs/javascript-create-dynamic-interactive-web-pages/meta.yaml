    - Pop-up layers | 172\n- Dynamic menu | 174\n- Fresh options | 176\n- DOM reference\
    \ | 178\n\n# JavaScript: protocol\n\nThe javascript: protocol may be assigned\
    \ to the href attribute in an HTML <a> anchor element to make a JavaScript function\
    \ the target of a hyperlink.\n\nThe name of the function should follow the protocol\
    \ specifier to identify the script code to be executed, or short pieces of code\
    \ can be included in-line after `alert`, like:\n\n```html\n<a href=\"javascript:alert('In-line\
    \ code')\">Link #1</a>\n<a href=\"javascript:respond()\">Link #2</a>\n```\n\n\
    This example contains both in-line code and a function call. Each will execute\
    \ when the user clicks the relevant hyperlink:\n\n```javascript\n// a function\
    \ to display a simple message\nfunction respond() {\n  alert(\"JavaScript code\"\
    );\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_161_0.png)\n\nTo make an\
    \ anchor that has no target use `javascript://` so that other attributes like\
    \ onmouseover can be used.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_161_1.png)\n\
    \n# Layer attributes\n\nProbably the most important style attributes of a <div>\
    \ element used in DHTML are id, top, z-index, visibility, and background-color.\n\
    \nThese style attributes can be dynamically changed by assigning new values to\
    \ them with JavaScript.\n\nThe example demonstrates how to access these attributes\
    \ by listing the values of a <div> element called lyr:\n\n```javascript\n// a\
    \ function to display the attributes of a <div>\nfunction get_styles() {\n  var\
    \ obj = document.getElementById(\"lyr\");\n  var str = \"ID: \" + obj.id;\n  str\
    \ += \"\\nTop: \" + obj.style.top;\n  str += \"\\nZ-Index: \" + obj.style.zIndex;\n\
    \  str += \"\\nVisibility: \" + obj.style.visibility;\n  str += \"\\nBackground:\
    \ \" + obj.style.backgroundColor;\n  str += \"\\nForeground: \" + obj.style.color;\n\
    \  alert(str);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_162_0.png)\n\
    \n# Toggle visibility\n\nHaving determined how to access layer styles with JavaScript’\
    \ easy to have some fun with them by letting the JavaScript code dynamically change\
    \ their values.\n\nFor example, changing the visibility style value to hidden\
    \ will cause a layer to disappear from view.\n\nConversely a layer initially created\
    \ with a visibility style value of hidden can be revealed by changing that value\
    \ to visible.\n\nThe following script toggles the visibility of a single layer\
    \ with mouseover and mouseout event-handlers, like this:\n\n```html\n<a href=\"\
    javascript:*\" onmouseover=\"show_apple()\" onmouseout=\"hide_apple()\">Apple\
    \ Link</a>\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_163_0.png)\n\n```javascript\n\
    // a function to reveal a layer\nfunction show_apple() {\n    // reference the\
    \ layer by id\n    var obj = getElementById(\"layer\")\n    // show the layer\n\
    \    obj.style.visibility= \"visible\";\n}\n\n// a function to hide a layer\n\
    function hide_apple() {\n    // reference the layer by id\n    var obj = getElementById(\"\
    layer\")\n    // hide the layer\n    obj.style.visibility= \"hidden\";\n}\n```\n"
  mdcn: "\n\n# 重置 (Reset)\n\n当用户点击表单的重置按钮或 JavaScript 执行 `form.reset()` 方法时，会触发 Reset\
