  - '[PAGE 99]


    # Confirm


    The alert() function that is used extensively in the code examples given throughout
    this book is actually a method of the top-level window object, so may be be correctly
    addressed as window.alert().


    The window.confirm() method is the first of two other window methods that produce
    dialog boxes when called.


    It is used to get user confirmation from a dialog box containing an OK button
    that returns true to the script and a Cancel button that returns false to the
    script.


    A single argument should be passed to the method as a text string containing the
    question for the user to confirm.


    This example demonstrates the window.confirm() method performing conditional branching
    to determine which message string to write – depending upon which button the user
    pushes in the confirm dialog box:


    ```

    // create a variable to store a dialog response

    var ask = confirm("Do you wish to proceed ?" );


    // create a variable to store a reply

    var msg;


    // assign an appropriate reply message

    if(ask) msg = "OK button was pushed";

    else msg = "Cancel button was pushed";


    // display the reply message

    document.write( msg );

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_99_0.png)


    In this example

    (ask) is simply shorthand for

    (ask == true).


    ![](img/5f5106681c8c7072e64c4ea87c891513_99_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_99_2.png)'
  - '[PAGE 100]


    # Prompt


    The window.prompt() method is used to get keyboard input from the user through
    a dialog box containing a textfield together with OK and Cancel buttons.


    Two string arguments are required by the window.prompt() method to specify a message
    to display and a default textfield value. The second argument should be an empty
    string if no default textfield value is needed by the script.


    The dialog box returns the value of the textfield when the user presses the OK
    button. This example takes the user input to personalize the page:


    ![](img/5f5106681c8c7072e64c4ea87c891513_100_0.png)


    ```

    // request the user to enter their name

    var user = prompt("Please enter your name...", "");

    // provide a default name if field is left blank

    if(user == null || user == "") ) user = "visitor";

    // display a message with the user name

    document.write("Hi " +user+ ", welcome to this page");

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_100_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_100_2.png)'
  - '[PAGE 101]


    # Location


    The window.location object contains the full URL address of the document that
    is currently loaded in the browser.


    It stores the actual full URL in the window.location.href property and assigning
    a new value to this, or to the window.location object itself, will load the specified
    URL into the browser.


    A typical URL address may comprise these parts:


    ```

    protocol: // host / pathname ? # hash

    ```


    Each part of the URL address stored in the window.location object may be addressed
    individually using the appropriate location property – as demonstrated in this
    example:


    ![](img/5f5106681c8c7072e64c4ea87c891513_101_0.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_101_1.png)


    ```

    // assign each part of the current location to variables

    var loc = "Href: " + location.href;

    var prot = "Protocol: " + location.protocol;

    var host = "Host: " + location.host;

    var path = "Path: " + location.pathname;

    var hash = "Hash: " + location.hash;


    // display the variable values

    alert(locn+"\n"+prot+"\n"+host+"\n"+path+"\n"+hash);

    ```


    Assigning a new value to location.hash will move the browser location to the given
    location in the page.


    location.js


    ![](img/5f5106681c8c7072e64c4ea87c891513_101_2.png)'
  - "[PAGE 102]\n\n# History\n\nThe window.history property contains an array of the\
    \ URL addresses previously visited during a browser session. For security reasons\
    \ these are not directly readable but they are used to navigate back to previous\
    \ pages.\n\nThe back() and forward() methods of the window.history object emulate\
    \ the browser's Back and Forward buttons.\n\nMore flexible navigation is often\
    \ provided by the window.history.go() method that takes a single argument to specify\
    \ the location by relative position. For instance, an argument value of -1 will\
    \ revisit the previous page and a value of -2 reopens the page before it.\n\n\
    In a similar manner window.history.go(1) goes forward to the next page in the\
    \ history array of visited URLs.\n\nCalling window.history.go(0) causes the browser\
    \ to reload the current document.\n\nThe function in the example below returns\
    \ the user to the previous page. In this case the function is called from the\
    \ onclick attribute of a button form input in the HTML document.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_102_0.png)\n\
    \n```\n// a function to load the previous page\nfunction go_back() {\n  window.history.go(-1);\n\
    }\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_102_1.png)"
  - "[PAGE 103]\n\n# Onload\n\nThe window.onload object may be used to specify the\
    \ name of a function to be called immediately after a document has completely\
    \ loaded in a browser.\n\nTypically this initializing function is named init()\
    \ and is often used to set a number of values within the script.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_103_0.png)\n\
    \nThe slideshow script on page i66 does not start to run until called by onload\
    \ after all the images have downloaded.\n\nIt is especially useful when the page\
    \ contains a large number of graphics that may take a while to download. If these\
    \ images are used by the script it is essential that they finish downloading before\
    \ the script starts to run.\n\nThe HTML onload attribute, that may optionally\
    \ be included in the HTML <body> tag, can also set the window.onload object –\
    \ so care is needed to avoid overwriting one with the other.\n\nThis is again\
    \ the case with the window.onunload object and the HTML <body> tag's onload attribute\
    \ which can both specify a function to call when the user navigates to a new location.\n\
    \nTypically window.onunload calls a function that creates a pop-up window when\
    \ the user leaves a website.\n\nThis example displays a simple alert() dialog\
    \ message when the user exits the page:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_103_1.png)\n\
    \n```\n// a function to display an exit message\nfunction goodbye() {\n\talert(\"\
    Thanks - Come back soon\");\n-}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_103_2.png)\n\
    \n```\n// specify the onload event-handler\nwindow.onunload = goodbye;\n```\n\n\
    The assigned value is the name of the function – the argument brackets are not\
    \ required.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_103_3.png)\n\n102 | JavaScript\
    \ in easy steps"
  - '[PAGE 104]


    # Status


    The window.status object can be used to display a message in the status bar of
    the browser window until another feature in the displayed document sets a new
    status bar message, or the status bar is returned to its default state.


    A default message to display can be specified with the window.defaultStatus object.


    To display a message when the user places the cursor over a hyperlink the HTML
    mouseover attribute should specify the message to display. It must also return
    true to prevent the link URL appearing in the status bar as it would do normally.


    This example, using JavaScript within HTML tags, specifies a default message and
    adds an onmouseover attribute to the link. This displays another message while
    the cursor rests over the:


    ![](img/5f5106681c8c7072e64c4ea87c891513_104_0.png)


    ```

    <body onload = "window.defaultStatus = ''Status Demo''>

    <p><a href="nextpage.html" onmouseover="window.status=''Click Here'';return true">Hypertext
    Link</a></p>

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_104_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_104_2.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_104_3.png)


