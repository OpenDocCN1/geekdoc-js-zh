    # Pop-up layers


    This example builds on the earlier visibility toggle script by using multiple
    layers which have their visibility toggled by an image map.


    When the cursor is placed over an image map hyperlink, the JavaScript function
    will display the appropriate layer but will hide that layer when the cursor moves
    off the link.


    Both layers are created in the HTML code with their visibility property set to
    hidden – so they are not initially visible. Placing the cursor over an active
    area of the image causes the onmouseover event to call the talk() function. The
    function call passes a string argument to identify which active area is the caller.
    This determines which layer object is to be manipulated.


    The talk() function sets the visibility style of the appropriate layer object
    to visible – so it becomes visible. Moving the cursor off an active area causes
    the onmouseout event, again passing a string argument identifier. This once more
    sets the visibility style of the appropriate layer object to hidden – so it becomes
    invisible again.


    This type of dynamic script can be used to great effect with navigation menu item
    rollovers.


