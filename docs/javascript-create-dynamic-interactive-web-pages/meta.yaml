  - "[PAGE 157]\n\n# Submit\n\nThe **Submit** event occurs when the user pushes a\
    \ submit button in a form. The `onsubmit` event-handler may call a function to\
    \ carry out form validation before submission.\n\nIf the **onsubmit** event-handler\
    \ returns `false`, for instance when form validation fails, the form data will\
    \ not be sent.\n\nThis example performs basic email address validation and provides\
    \ the user with an `alert()` message if validation fails. The function is called\
    \ by the HTML `onsubmit` attribute of the `<form>` tag.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_157_0.png)\n\
    \n```\n// function to validate basic email address format\nfunction validation()\
    \ {\n  // seek an @ character in the address\n  if(document.forms.f.email.value.indexOf(\"\
    @\") == -1) {\n    // if absent display a message\n    alert(\"Email address is\
    \ absent or incorrect\");\n    // ...and do not submit the form\n    return false;\n\
    \  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_157_1.png)\n\nThe onsubmit\
    \ event-handler is not invoked by use of the `form.submit()` method in JavaScript.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_157_2.png)"
  - "[PAGE 158]\n\n# Abort\n\nInternet Explorer allows an event-handler to be specified\
    \ for the **Abort** event that occurs when the user cancels the download of an\
    \ image — usually by pushing the **stop** button on the browser's toolbar. The\
    \ **onabort** event-handler may call a JavaScript function when an image download\
    \ is cancelled.\n\nTo identify the image name must be given to its **id** attribute\
    \ in the HTML `<img>` element, like this...\n\n```\n<img id=\"big pic\" src=\"\
    bigpic.jpg\" alt=\"/>\n```\n\nAn event-handler can be assigned to image's **onabort**\
    \ property. In the example below the event-handler directly creates an `alert()`\
    \ message confirming that the download is cancelled:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_158_0.png)\n\
    \n```\nfor Internet Explorer only set an abort event-handler\nif(document.getElementById(\"\
    big-pic\").onabort = abort_msg;);\n```\n\n```\na function to display a confirmation\
    \ message\nfunction abort_msg() {\n    alert(\"Image Download Has Been Aborted\"\
    );\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_158_1.png)\n\nThe `<script>`\
    \ element that includes this script must appear in the HTML body *after* the `<img>`\
    \ element — an event-handler can't be set until the image object exists.\n\n|\
    \ Abort Event |\n| File | Edit | View | Favorites | Tools | Help |\n|---|---|---|---|---|---||\n\
    | Microsoft Internet Explorer |\n| Image Download Has Been Aborted OK | Done Local\
    \ intranet |\n\n![](img/5f5106681c8c7072e64c4ea87c891513_158_2.png)\n\nThis feature\
    \ is useful to switch the image source to a low-resolution version."
  - "[PAGE 159]\n\n# Resize\n\nThe **Resize** event occurs when a browser window is\
    \ re-sized by the user and the **onresize** event-handler can execute a function\
    \ to make the page appropriate for the new window size.\n\nThis is most useful\
    \ to reposition DHTML page components as illustrated in the following example.\
    \ This creates a centered `<div>` element with the `id` of **lyr** which will\
    \ be re-centered when the window is re-sized:\n\n```\n// a function to center\
    \ a <div> element\nfunction set_pos() {\n  var width;\n  get the window width\n\
    \  if (navigator.appName == \"Netscape\")\n    width = innerWidth; // for Netscape/Mozilla\n\
    \  else\n    width = document.body.clientWidth; // for IE\n\n  // half window\
    \ width minus half div width\n  var left_pos = parseInt(width / 2) - 50;\n  \n\
    \  // set the left position of the <div> element\n  document.getElementById(\"\
    lyr\").style.left=(left_pos+\"px\");\n}\n\n// specify the onresize event-handler\n\
    window.onresize=set_pos;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_159_0.png)\n\
    \nresize.js\n\nThis `<div>` is initially centered by calling the `set_pos()` function\
    \ from the HTML `<body>` element.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_159_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_159_2.png)\n\n158 | JavaScript in easy\
    \ steps"
