    \ PERL 是由 Larry Wall 在1987年发明的通用编程语言。实用查询和报告语言 (PERL) 全球拥有超过百万用户，是服务器端脚本的主要语言。对于许多人来说，它是\
    \ Wide Web 开发的首选语言。 | |\n| 页面最后更新时间: 04/06/2005 12:52:53 | |\n\n![](img/5f5106681c8c7072e64c4ea87c891513_120_2.png)\n\
    \n# XYZ坐标\n\n显示窗口中内容的物理位置可以使用称为 X、Y 和 Z 的坐标引用。\n\nX 坐标指定距离窗口最左边缘的像素距离。\n\nY 坐标指定距离窗口最顶边缘的像素距离。\n\
    \nZ 坐标通过索引号指定位于底部窗口层级之上的层的堆叠位置：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_121_0.png)\n\
    \n> 贴士：为了区分坐标，请记住 \"cross\" (X) 意味着“跨越”(across)。\n\n窗口左边缘的 X 坐标为零，窗口顶边缘的 Y 坐标也为零。\n\
    \nX=50  Y=30 的位置将指向距离左边缘 50 像素、距离顶边缘 30 像素的位置。\n\n底部窗口层的 Z 坐标索引值为零。层可以放置在此层级之上，就像透明片一样，并被赋予唯一的\
    \ Z-index 值。\n\n一个窗口可能有许多层，但顶层将始终具有最高的 Z-index 值。其下方的每个后续层将具有递减的较低 Z-index 值。\n\
    \n# 动态层\n\nJavaScript 可以通过向 HTML 文档的 body 部分写入必要的 HTML 代码和样式表规则来动态创建层。这允许控制每一层的位置和外观。\n\
    \n最重要的是，如果层发生重叠，它们的堆叠顺序由分配给它们的 `z-index` 属性的值决定——数字越大，层在堆栈中的位置越高。\n\n下面的示例通过动态创建两个重叠层来模拟相反的情况。第二个（黄色）层在堆栈中的位置高于第一个（紫色）层。如果它们的\
    \ z-index 值反转，例如层 1 为 20 而层 2 为 10，则紫色层将覆盖黄色层。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_122_0.png)\n\
    \n```javascript\n// 在 z-index 10 处写入层\ndocument.write(\"<div id='layer1'\nstyle='position:absolute;\
    \ top:20px; left:20px;\nwidth:80px; height:80px; background-color:purple;\ncolor:white;\
    \ z-index:10'>Layer #1</div>\");\n\n// 在 z-index 20 处写入层\ndocument.write(\"<div\
    \ id='layer2'\nstyle='position:absolute; top:40px; left:40px;\nwidth:80px; height:80px;\
    \ background-color:yellow;\nz-index:20'>Layer #2</div>\");\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_122_1.png)\n\
    \n# 透明层\n\n除非另有说明，否则层通常将与文档主体具有相同的背景创建——因此看起来是透明的。或者，也可以通过将其 `background-color`\
    \ 属性设置为 `transparent` 来显式地设置为透明。\n\n当层包含具有透明部分的规则形状 GIF 图片时，层的透明度尤为重要。在透明层上，这些图像看起来悬浮在文档背景上。通过分配不同的\
    \ z-index 值来确定它们的堆叠顺序，即使层重叠，多张图片也可以相邻出现。\n\n下面的脚本创建了两个这样的层——仅有一个透明的，以说明每张图像显示方式的。\n\
    \n```javascript\n// 创建一个透明层\ndocument.write('<div id='transparent-layer' style='position:\
    \ absolute; top:20px; left:230px; width:75px; height:110px; background-color:transparent'><img\
    \ src='deed.gif' alt=''></div>');\n```\n\n```javascript\n// 创建一个白色层\ndocument.write('<div\
    \ id='transparent-layer' style='position: absolute; top:20px; left:315px; width:75px;\
    \ height:110px; background-color:white'><img src='deed.gif' alt=''></div>');\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_123_0.png)\n\n此示例使用的图像是 GIF 格式，并将其绿色设置为透明。该图像实际上看起来是这样：\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_123_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_124)\n\
    \n# 表单属性\n\n本章说明了 JavaScript 如何操作 HTML 表单元素的输入。提供了所有常见表单元素（包括单选按钮和框）的示例。\n\n-\
    \ 表单对象 | 126\n- 表单元素 | 128\n- 点击按钮 | 129\n- 切换值 | 130\n- 文本框 | 131\n- 密码框 | 132\n\
    - 单选按钮 | 133\n- 复选框 | 134\n- 复选框轮询 | 135\n- 选择列表 | 136\n- 文本区域 | 137\n- 清空表单 |\
    \ 138\n- 发送表单 | 139\n- 修改表单 | 140\n- 邮箱验证 | 141\n\n# 表单对象\n\n`window.document.forms`\
    \ 对象包含 HTML 文档中的所有表单，按照它们在 HTML 代码中的顺序索引。\n\n例如，`window.document.forms[0]` 指向\
    \ 页面 HTML 代码中的第一个表单。\n\n如果 `<form>` 元素的 `id` 属性已赋值，则可以通过名称引用表单。因此表单 f 可以简单地表示为\
    \ `document.forms.f`。\n\n`<form>` 标签中分配的所有其他属性也是该表单对象的属性。例如，对于此表单...\n\n![](img/5f5106681c8c7072e64c4ea87c891513_125_0.png)\n\
    \n```html\n<form id = \"f\" method = \"post\" action = \"mailto:a@b.com\" enctype\
    \ = \"text/plain\">\n```\n\n...可以从 HTML `<body>` 的 `onload` 属性调用以下 JavaScript\
    \ 函数来显示表单属性：\n\n```javascript\nfunction form_info() {\n // 获取表单名称\n  var msg =\
    \ \"Name: \" + document.forms.f.id;\n\n // 获取表单方法、动作和编码\n  msg += \"\\nMethod:\
    \ \" + document.forms.f.method;\n  msg += \"\\nAction: \" + document.forms.f.action;\n\
    \  msg += \"\\nEnctype: \" + document.forms.f.encoding;\n  alert(msg);\n}\n```\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_125_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_125_2.png)\n\
    \n"
