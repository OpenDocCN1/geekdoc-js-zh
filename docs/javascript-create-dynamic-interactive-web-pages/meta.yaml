  - '[PAGE 62]


    # Date strings


    In many instances the Date object information must be converted into a string
    in order to store or use that information.


    The Date.toString() method on the facing page does this but it is often preferable
    to store this information in standard UTC time.


    JavaScript provides the Date.toGMTString() method that both converts the information
    to a string and converts it to the GMT time zone.


    > A complete example setting cookies using this method can be found in Chapter
    10, on page 114.


    Using this method of storing date information avoids time confusion and is commonly
    used as the standard when setting the life span of cookie files.


    This simple example illustrates the Date.toGMTString() method performing its conversions
    in a browser in Tokyo, Japan:


    ```

    create a new Date object

    var now = new Date();


    store local time

    var jpn = "Tokyo Time:\n" +now.toString() + "\n\n";


    store GMT time

    var gmt = "UTC Time:\n" + now.toGMTString();


    display local time and GMT time

    alert(jpn + gmt);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_62_0.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_62_1.png)


