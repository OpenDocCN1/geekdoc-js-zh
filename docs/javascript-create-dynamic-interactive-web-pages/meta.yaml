    \n通常，`document.write()` 方法出现在 HTML 文档 `<body>` 部分的脚本中，并将在一个条件测试后选择内容。\n\n需要注意的是，在运行时调用此方法将导致指定的内容被写入新的空白文档，从而替换当前页面。\n\
    \n变量值也可以与字符串参数拼接，以便将变量值引入 Web 页面的内容中。\n\n此示例首先生成一个随机数，然后进行测试以确定数字是奇数还是偶数。根据测试结果将选定的内容添加到页面：\n\
