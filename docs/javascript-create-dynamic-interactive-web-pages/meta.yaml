  - "[PAGE 96]\n\n# Plugins information\n\nFor Neatscape/Mozilla browsers JavaScript\
    \ can be used to discover information about any plugins that are installed in\
    \ the browser with the navigator.plugins array property.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_96_0.png)\n\
    \nnavigator.plugins exists in Internet Explorer but it's not implemented. Each\
    \ plugin is installed within a Neatscape/Mozilla browser is added as an element\
    \ in the navigator.plugins array. For instance, if the Macromedia Shockwave plugin\
    \ is installed there is a navigator.plugins[\"Shockwave Flash\"] element.\n\n\
    The plugin has a name property, storing the name and version of that plugin, and\
    \ a description property that contains information about the plugin.\n\nIn the\
    \ following example the JavaScript code first checks that the navigator.appName\
    \ is Neatscape before displaying the name and description of the first plugin\
    \ in the navigator.plugins array:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_96_1.png)\n\
    \n```\nfor Neatscape/Mozilla browsers only\nif (navigator.appName == \"Neatscape\"\
    )\n{\n    for the first plugin element\n    with(navigator.plugins[0])\n    {\n\
    \        display its name and description\n        document.write(\"<html>\"+name+\"\
    </html>\");\n        document.write(\"<p>\"+description+\"</p>\");\n    }\n}\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_96_2.png)\n\nMozilla browsers\
    \ identify with the Neatscape name.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_96_3.png)\n\
    \nThe output from this script will vary according to the plugins installed on\
    \ your browser.\n\n| Listing Plugins - Mozilla |\n| File Edit View Go Bookmarks\
    \ Tools Window Help |\n| QuickTime Plug-in 6.0.2 |\n| The QuickTime Plugin allows\
    \ you to view a wide variety of multimedia content in Web pages. For more information,\
    \ visit the QuickTime Web site. |\n\n\n8. Addressing page objects | 95"
- md: "\n## Java detection\n\nA browser can be assessed to discover if Java is enabled\
    \ using the navigator.javaEnabled() method. This returns a boolean value of true\
    \ or false, depending on the result.\n\nThe navigator.javaEnabled() method can\
    \ be used to determine if a page containing a Java applet should be loaded, or\
    \ if an alternative non-Java page should be loaded instead – as seen in this example:\n\
    \n```javascript\ntest if Java is enabled in the browser\nif ( navigator.javaEnabled()\
    \ ) {\n    window.location = \"javapage.html\"; // if true go here\n}\nelse {\n\
    \    window.location = \"nojavapage.html\"; // else go here\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_97_0.png)\n\
    \nwindow.location stores the URL of the current page – assigning it a new URL\
    \ will load that page in the browser. See page 100 for more about this property.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_97_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_97_2.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_97_3.png)\n\n96 | JavaScript in easy\
    \ steps\n\nThis chapter demonstrates properties and methods of the window object.\
    \ Creating pop-up windows is illustrated and the use of framed pages is also discussed\
    \ with examples of how to address objects in other frames.\n\n| Property | Page\
    \ |\n| :--- | :--- |\n| Confirm | 98 |\n| Prompt | 99 |\n| Location | 100 |\n\
    | History | 101 |\n| Onload | 102 |\n| Status | 103 |\n| Pop-up window | 104 |\n\
    | Pop-up features | 105 |\n| Close pop-up | 106 |\n| Get size | 107 |\n| Frames\
    \ array | 108 |\n| Frame objects | 109 |\n| Error handling | 110 |\n\n## Confirm\n\
    \nThe alert() function that is used extensively in the code examples given throughout\
    \ this book is actually a method of the top-level window object, so it may be\
    \ correctly addressed as window.alert().\n\nThe window.confirm() method is the\
    \ first of two other window methods that produce dialog boxes when called.\n\n\
    It is used to get user confirmation from a dialog box containing an OK button\
    \ that returns true to the script and a Cancel button that returns false to the\
    \ script.\n\nA single argument should be passed to the method as a text string\
    \ containing the question for the user to confirm.\n\nThis example demonstrates\
    \ the window.confirm() method performing conditional branching to determine which\
    \ message string to write – depending upon which button the user pushes in the\
    \ confirm dialog box:\n\n```javascript\n// create a variable to store a dialog\
    \ response\nvar ask = confirm(\"Do you wish to proceed ?\" );\n\n// create a variable\
    \ to store a reply\nvar msg;\n\n// assign an appropriate reply message\nif(ask)\
    \ msg = \"OK button was pushed\";\nelse msg = \"Cancel button was pushed\";\n\n\
    // display the reply message\ndocument.write( msg );\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_99_0.png)\n\
    \nIn this example, (ask) is simply shorthand for (ask == true).\n\n![](img/5f5106681c8c7072e64c4ea87c891513_99_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_99_2.png)\n\n## Prompt\n\nThe window.prompt()\
    \ method is used to get keyboard input from the user through a dialog box containing\
    \ a textfield together with OK and Cancel buttons.\n\nTwo string arguments are\
    \ required by the window.prompt() method to specify a message to display and a\
    \ default textfield value. The second argument should be an empty string if no\
    \ default textfield value is needed by the script.\n\nThe dialog box returns the\
    \ value of the textfield when the user presses the OK button. This example takes\
    \ the user input to personalize the page:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_100_0.png)\n\
    \n```javascript\n// request the user to enter their name\nvar user = prompt(\"\
    Please enter your name...\", \"\");\n// provide a default name if field is left\
    \ blank\nif(user == null || user == \"\" ) user = \"visitor\";\n// display a message\
    \ with the user name\ndocument.write(\"Hi \" +user+ \", welcome to this page\"\
    );\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_100_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_100_2.png)\n\
    \n## Location\n\nThe window.location object contains the full URL address of the\
    \ document that is currently loaded in the browser.\n\nIt stores the actual full\
    \ URL in the window.location.href property and assigning a new value to this,\
    \ or to the window.location object itself, will load the specified URL into the\
    \ browser.\n\nA typical URL address may comprise these parts:\n\n```\nprotocol:\
    \ // host / pathname ? # hash\n```\n\nEach part of the URL address stored in the\
    \ window.location object may be addressed individually using the appropriate location\
    \ property – as demonstrated in this example:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_101_0.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_101_1.png)\n\n```javascript\n// assign\
    \ each part of the current location to variables\nvar loc = \"Href: \" + location.href;\n\
    var prot = \"Protocol: \" + location.protocol;\nvar host = \"Host: \" + location.host;\n\
    var path = \"Path: \" + location.pathname;\nvar hash = \"Hash: \" + location.hash;\n\
    \n// display the variable values\nalert(locn+\"\\n\"+prot+\"\\n\"+host+\"\\n\"\
    +path+\"\\n\"+hash);\n```\n\nAssigning a new value to location.hash will move\
    \ the browser location to the given location in the page.\n\nlocation.js\n\n![](img/5f5106681c8c7072e64c4ea87c891513_101_2.png)\n\
    \n## History\n\nThe window.history property contains an array of the URL addresses\
    \ previously visited during a browser session. For security reasons these are\
    \ not directly readable but they are used to navigate back to previous pages.\n\
    \nThe back() and forward() methods of the window.history object emulate the browser's\
    \ Back and Forward buttons.\n\nMore flexible navigation is often provided by the\
    \ window.history.go() method that takes a single argument to specify the location\
    \ by relative position. For instance, an argument value of -1 will revisit the\
    \ previous page and a value of -2 reopens the page before it.\n\nlocation.js\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_102_1.png)\n\n```javascript\n// a function\
    \ to go back\nfunction back() {\n  history.go(-1);\n}\n\n// assign the handler\n\
    window.onunload = back;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_102.png)\n\
    \n## Onload\n\nThe window.onload event can be used to execute code after the page\
    \ has completely finished loading.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_103_0.png)\n\
    \nThis is especially useful when the page contains large images that may take\
    \ a while to download.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_103_1.png)\n\
    \n```javascript\n// a function to display an exit message\nfunction goodbye()\
    \ {\n\talert(\"Thanks - Come back soon\");\n}\n\n// specify the handler\nwindow.onload\
    \ = goodbye;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_103_2.png)\n\n##\
    \ Status\n\nThe window.status object can be used to display a message in the status\
    \ bar of the browser window until another feature in the displayed document sets\
    \ a new status message, or the status bar is returned to its default state.\n\n\
    A default message to display can be specified with the window.defaultStatus object.\n\
    \nTo display a message when the user places the cursor over a hyperlink the HTML\
    \ mouseover attribute should specify the message to display. It must also return\
    \ true to prevent the link URL appearing in the status bar as it would do normally.\n\
    \nThis example, using JavaScript within HTML tags, specifies a default message\
    \ and adds an onmouseover attribute to the link. This displays another message\
    \ while the cursor rests over the:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_104_0.png)\n\
    \n```html\n<body onload = \"window.defaultStatus = 'Status Demo'>\n<p><a href=\"\
    nextpage.html\" onmouseover=\"window.status='Click Here';return true\">Hypertext\
    \ Link</a></p>\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_104_1.png)\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_104_2.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_104_3.png)\n\
    \n102 | JavaScript in easy steps\n"
  mdcn: "\n\n## Java 检测\n\n可以使用 `navigator.javaEnabled()` 方法对浏览器进行评估，以发现其是否启用了 Java。该方法返回\
    \ `true` 或 `false` 的布尔值，取决于检测结果。\n\n`navigator.javaEnabled()` 方法可以确定是否应该加载包含 Java\
    \ applet 的页面，或者应该加载替代的非 Java 页面——例如所示：\n\n```javascript\n// 测试浏览器中是否启用了 Java\n\
    if ( navigator.javaEnabled() ) {\n    window.location = \"javapage.html\"; //\
    \ 如果为真跳转到这里\n}\nelse {\n    window.location = \"nojavapage.html\"; // 否则跳转到这里\n\
    }\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_97_0.png)\n\n`window.location`\
    \ 存储当前页面的 URL —— 为其分配新 URL 将在浏览器中加载该页面。关于此属性的更多信息请参阅第 100 页。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_97_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_97_2.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_97_3.png)\n\
    \n96 | 快速上手 JavaScript\n\n本章演示了 `window` 对象的属性和方法。说明了如何创建弹出窗口，并讨论了框架页面（framed\
    \ pages）的使用，同时结合了如何访问其他框架中对象的示例。\n\n| 属性 | 页码 |\n| :--- | :--- |\n| Confirm (确认)\
    \ | 98 |\n| Prompt (输入) | 99 |\n| Location (位置) | 100 |\n| History (历史) | 101\
    \ |\n| Onload (加载) | 102 |\n| Status (状态) | 103 |\n| Pop-up window (弹出窗口) | 104\
    \ |\n| Pop-up features (弹出特性) | 105 |\n| Close pop-up (关闭弹出窗) | 106 |\n| Get size\
    \ (获取尺寸) | 107 |\n| Frames array (框架数组) | 108 |\n| Frame objects (框架对象) | 109\
    \ |\n| Error handling (错误处理) | 110 |\n\n## Confirm (确认)\n\n在书中代码示例中广泛使用的 `alert()`\
    \ 函数实际上是顶层窗口对象的一个方法，因此可以正确地书写为 `window.alert()`。\n\n`window.confirm()` 方法是另外两个窗口方法中的第一个，在调用时会产生对话框。\n\
    \n它用于从对话框中获取用户确认。对话框包含一个 `OK` 按钮（向脚本返回 `true`）和一个 `Cancel` 按钮（向脚本返回 `false`）。\n\
    \n该方法应传递一个文本字符串作为参数，其中包含供用户确认的问题。\n\n此示例演示了 `window.confirm()` 方法如何执行条件分支，以确定写入哪个消息字符串——取决于用户在确认对话框中点击了哪个按钮：\n\
    \n```javascript\n// 创建一个变量来存储对话响应\nvar ask = confirm(\"Do you wish to proceed\
    \ ?\" );\n\n// 创建一个变量来存储回复\nvar msg;\n\n// 分配相应的回复消息\nif(ask) msg = \"OK button\
    \ was pushed\";\nelse msg = \"Cancel button was pushed\";\n\n// 显示回复消息\ndocument.write(\
    \ msg );\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_99_0.png)\n\n在此示例中，`(ask)`\
    \ 仅仅是 `(ask == true)` 的简写。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_99_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_99_2.png)\n\n## Prompt (输入)\n\n`window.prompt()`\
    \ 方法用于通过对话框获取用户的键盘输入，对话框中包含一个文本框以及 `OK` 和 `Cancel` 按钮。\n\n`window.prompt()` 方法需要两个字符串参数，分别指定要显示的消息和默认文本框值。如果脚本不需要默认文本框值，则第二个参数应为空字符串。\n\
    \n当用户按下 `OK` 按钮时，对话框会返回文本框的值。此示例利用用户输入来个性化页面：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_100_0.png)\n\
    \n```javascript\n// 请求用户输入姓名\nvar user = prompt(\"Please enter your name...\"\
    , \"\");\n// 如果字段留空，则提供默认名称\nif(user == null || user == \"\" ) user = \"visitor\"\
    ;\n// 显示带有用户名的消息\ndocument.write(\"Hi \" +user+ \", welcome to this page\");\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_100_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_100_2.png)\n\
    \n## Location (位置)\n\n`window.location` 对象包含当前在浏览器中加载的文档的完整 URL 地址。\n\n在 `window.location.href`\
    \ 属性中存储实际完整 URL，为该属性或 `window.location` 对象本身分配新值将把指定的 URL 加载到浏览器。\n\n一个典型的 URL\
    \ 地址可能包含这些部分：\n\n```\nprotocol: // host / pathname ? # hash\n```\n\n存储在 `window.location`\
    \ 对象中的 URL 地址的每个部分都可以使用相应的 `location` 属性单独访问——如示例所示：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_101_0.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_101_1.png)\n\n```javascript\n// 将当前位置的每个部分分配给变量\n\
    var loc = \"Href: \" + location.href;\nvar prot = \"Protocol: \" + location.protocol;\n\
    var host = \"Host: \" + location.host;\nvar path = \"Path: \" + location.pathname;\n\
    var hash = \"Hash: \" + location.hash;\n\n// 显示变量值\nalert(locn+\"\\n\"+prot+\"\
    \\n\"+host+\"\\n\"+path+\"\\n\"+hash);\n```\n\n为 `location.hash` 分配新值将浏览器位置移动到页面中指定位置。\n\
    \nlocation.js\n\n![](img/5f5106681c8c7072e64c4ea87c891513_101_2.png)\n\n## History\
    \ (历史)\n\n`window.history` 属性包含浏览器会话期间之前访问过的 URL 地址数组。出于安全考虑，这些地址无法直接读取，但它们被用于导航回之前的页面。\n\
    \n`window.history` 对象的 `back()` 和 `forward()` 方法模拟浏览器的“后退”和“前进”按钮。\n\n`window.history.go()`\
    \ 方法通常提供更灵活的导航，它接受一个单一参数来通过相对位置指定位置。例如，参数值 `-1` 将重新访问上一个页面，值 `-2` 将重新打开上上之前的页面。\n\
    \nlocation.js\n\n![](img/5f5106681c8c7072e64c4ea87c891513_102_1)\n\n```javascript\n\
    // 后退函数\nfunction back() {\n  history.go(-1);\n}\n\n// 分配处理器\nwindow.onunload\
    \ = back;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_102.png)\n\n## Onload\
    \ (加载)\n\n`window.onload` 事件可以在页面完全加载后执行代码。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_103_0.png)\n\
    \n当页面包含可能需要一些下载的图像时，这特别有用。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_103_1.png)\n\
    \n```javascript\n// 显示退出消息的函数\nfunction goodbye() {\n\talert(\"Thanks - Come back\
    \ soon\");\n}\n\n// 指定处理器\nwindow.onload = goodbye;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_103_2.png)\n\
    \n## Status (状态)\n\n`window.status` 对象用于在状态栏中显示消息，直到显示文档的其他部分设置新的状态消息或状态栏返回默认状态。\n\
    \n可以使用 `window.defaultStatus` 对象指定要显示的消息。\n\n要在鼠标悬停在超链接上时显示消息，HTML `mouseover`\
    \ 属性应指定要的消息。它还必须返回 `true` 以防止像通常那样在状态栏出现链接 URL。\n\n此示例在 HTML 标签中使用 JavaScript，指定了默认消息并在链接上添加了\
    \ `mouseover` 属性。当光标停留在上方时会显示另一个消息：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_104_0.png)\n\
    \n```html\n<body onload = \"window.defaultStatus = 'Status Demo'>\n<p><a href=\"\
    nextpage.html\" onmouseover=\"window.status='Click Here';return true\">超文本链接</a></p>\n\
    </body>\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_104_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_104_2.png)\n\
    \n"
