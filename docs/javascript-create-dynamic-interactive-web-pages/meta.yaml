  md: "# #Lottery picker\n\nThis example uses Math.random() to generate a series of\
    \ six random numbers within the range of 1 to 49 which can be used as selections\
    \ in the national British lottery:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_74_0.png)\n\
    \n```\n // create variables\nvar i, rand, temp, str;\n // create a new array of\
    \ 50 elements\nvar nums = new Array(50);\n\nfill elements 1-49 with numbers 1-49\n\
    for(i = 1; i < 50; i++) nums[i] = i;\n\n algorithm to randomize these numbers\n\
    for(i = 1; i < 50; i++)\n{\n rand = Math.ceil(Math.random() * 49);\ntemp = nums[i];\n\
    nums[i] = nums[rand];\nnums[rand] = temp;\n}\n // add the first six elements to\
    \ a string\nstr = \"Your six lucky numbers are:\\n\\n\";nfor(i = 1; i < 7; i++)\n\
    {\n str += nums[i];\nif(i != 6) str += \" - \";\n}\n // display the string\nalert(str);\n\
