    \n13. DHTML 中的 JavaScript | 17\n\n# DOM 引用\n\n下表说明了文档对象模型 (DOM)的重要部分，用以解释网页中的对象之间的关系。标记有\
    \ * 的部分是 Microsoft Internet Explorer 特有的，在其他浏览器中无法找到。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_179_0.png)\n\
    \n# 电子商务中的 JavaScript\n\n最后一章展示了如何将早的一些示例应用于电子商务应用程序，并说明了框架（frames）如何存储数据以便供其他框架后续使用。\n\
    \n# 目录\n\n- 产品页面 | 180\n- 隐藏表单 | 181\n- 获取客户详情 | 182\n- 生成订单号 | 183\n- 确认订单 |\
    \ 184\n- 提交订单 | 185\n- 接下来做什么？ | 186\n\n# 产品页面\n\n本章中的示例遵循了一个在线订单的开发过程，从一个用户可以在其中选择订购商品数量的页面开始。\n\
    \n该页面由两个框架组成：左侧名为 menu 的面板，和右侧名为 main 的较大框架。\n\n通常情况下，menu 框架将保持持续显示，而 main 框架将在用户在网站中导航时显示不同的页面。\n\
    \n表单底部添加了一个按钮，该按钮将用户引导到订单流程的下一个阶段。\n\n在下方所示的表单中，用户已经为某些示例的产品输入了数量需求：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_181_0.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_181_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_181_2.png)\n\
    \n此示例的框架文档名为 e-commerce.html。它在 menu 框架中显示 menu.html，并在（初始）main 框架中显示 products.html\
    \ - 如上所示。\n\n# 隐藏表单\n\nmenu 框架中的页面包含一个名为 m（代表记忆内存）的隐藏表单，当 main 框架中的页面更改时，它将保留订单数据。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_182_0.png)\n\n它由输入项组成，这些项与产品页面上名为 f\
    \ 的表单相同，并带有客户姓名、账号和订单号的输入框。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_182_1.png)\n\
    \n```html\n<!-- 用于存储订单数据的表单 -->\n<form id=\"m\" action=\"\" method=\"post\">\n\
    <input type=\"hidden\" name=\"customer\" value=\"\" />\n<input type=\"hidden\"\
    \ name=\"accountnumber\" value=\"\" />\n<input type=\"hidden\" name=\"ordernumber\"\
    \ value=\"\" />\n<input type=\"hidden\" name=\"ball\" value=\"\" />\n<input type=\"\
    hidden\" name=\"hoop\" value=\"\" />\n<input type=\"hidden\" name=\"cone\" value=\"\
    \" />\n</form>\n```\n\n产品页面上按钮的 onclick 属性会调用一个 JavaScript 函数，将用户在产品页面 f 中输入的值填充到隐藏表单\
    \ m 中。然后它会在 main 框架中加载一个新页面。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_182_2.png)\n\
    \n```javascript\n// 在另一个框架中存储订单数据的函数\nfunction populate() {\n  // 表单的变量\n  var\
    \ m = parent.document.forms.m;\n  var f = document.forms.f;\n\n  // 拷贝值\n  m.ball\
    \ = f.value;\n  m.hoop = f.value;\n  m.cone = f.value;\n\n  // 将新页面加载到此框架\n  window.location\
    \ = \"customer.html\";\n}\n```\n\n# 获取客户详情\n\n当用户点击此页面上的按钮时，其 onclick 属性调用一个 JavaScript\
    \ 函数，填充 menu 框架中隐藏表单 m 的值。此页面请求客户姓名和账号。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_183_0.png)\n\
    \n```javascript\n// 在另一个框架中存储值的函数\nfunction populate() {\n  // 表单的变量\n  var m\
    \ = parent.document.forms.m;\n  var f = document.forms.f;\n\n  // 拷贝值\n  m.ball\
    \ = f.value;\n  m.hoop = f.value;\n  m.cone = f.value;\n\n  // 将新页面加载到此框架\n  window.location\
    \ = \"customer.html\";\n}\n```\n\n# 生成订单号\n\n最后的页面 e-commerce 为用户生成订单号。该页面使用了\
    \ menu 框架中隐藏表单 m的数据。\n\n```javascript\n// 生成订单号\nvar d = new Date();\nvar yr =\
    \ d.getFullYear().toString();\nvar mo = d.getMonth().toString();\nvar hr = d.getHours().toString();\n\
    var mn = d.getMinutes().toString();\nvar sc = d.getSeconds().toString();\nvar\
    \ onun = yr + mo + hr + mn + sc;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_183_1.png)\n\
    \n# 确认订单\n\nconfirm.html 页面包含订单号、客户姓名和账号。用户在此页处确认订单。\n\n```javascript\n// 输出订单号\n\
    document.write(\"Order No. \" + m.ordernumber);\n\n// 输出客户详情\ndocument.write(\"\
