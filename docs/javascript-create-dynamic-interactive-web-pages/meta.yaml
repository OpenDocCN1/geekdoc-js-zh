  md: '# Last modified


    The document.lastModified object can provide date and time information of when
    a Web page was last updated. This data is usually supplied to document.lastModified
    from the HTTP file header that is sent by the Web server. In some instances the
    Web server may omit this information so document.lastModified will, in those cases,
    return zero.


    Typically this data is used to indicate how recently a Web page has been updated
    so the user knows how current information on that page may be. Usually this information
    is displayed at the bottom of a page in a smaller font than the general page text.


    The example that follows first tests that a date has been supplied to document.lastModified
    then writes the data into the HTML document:


    ```

    '' check that there is a lastModified date

    if( Date.parse(document.lastModified) != 0 )

    ```


    ```

    if so, write a message stating what that date is

    document.write

    ("Page last updated: " + document.lastModified );

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_120_0.png)


    The <script> block to include this script code would normally be situated at the
    very end of the HTML document <body> section.


    ![](img/5f5106681c8c7072e64c4ea87c891513_120_1.png)


