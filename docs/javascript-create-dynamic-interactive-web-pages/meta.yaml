  - "[PAGE 48]\n\n# Adding more elements\n\nAdditional elements can be added to an\
    \ array, without specifying an actual index number, by using the `array.length`\
    \ property to find the next available empty element.\n\nBecause the `array.length`\
    \ value exceeds the last index number by one it will always specify the next free\
    \ element when it is used as the index number – between the square brackets.\n\
    \nThe example below illustrates when assigning the integer 4 to the next free\
    \ element in the array named **a**.\n\nThe **b** array elements are initialized,\
    \ then the **for** loop successfully assigns the **b** array element values to\
    \ each free element in the **a** array.\n\nFinally all **a** array elements are\
    \ displayed by the `alert()` function in concatenated form by the `array.concat()`\
    \ method.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_48_0.png)\n\n```\nvar a\
    \ = new Array(1, 2, 3 );\n// insert an integer into the next empty element\na[a.length]\
    \ = 4; // a.length is 3\n\nvar b = new Array(5, 6, 7 );\n// copy each b element\
    \ value into the empty a elements\nfor(var i = 0; i < b.length; i++) {\n  a[a.length]\
    \ = b[i];\n}\n// display all a element values\nalert( a.concat() );\n```\n\nThe\
    \ method `array.concat()` will display all the element values in an array, separated\
    \ by commas,\n\n![](img/5f5106681c8c7072e64c4ea87c891513_48_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_48_2.png)\n\
    \n4. Using arrays | 47"
  - '[PAGE 49]


    # String of elements


    The JavaScript array.join() method will convert all array elements to strings
    and concatenate them.


    Used without arguments this will return a list of all the array element values
    separated by commas, like the array.concat() method on the previous page.


    But the array.join() method can accept an optional argument to specify an alternative
    separator to the default comma separator.


    Mostfully this can be a space so that result of the array.join() method will be
    a single string with space separators, as illustrated in the example below:


    ![](img/5f5106681c8c7072e64c4ea87c891513_49_0.png)


    ```

    create a new array

    var a = new Array();


    // put a word in seven array elements

    a[0] = "It"

    a[1] = "isn\t"

    a[2] = "rocket"

    a[3] = "science -"

    a[4] = "it''s"

    a[5] = "just"

    a[6] = "JavaScript"


    // display all words in the array, separated by a space

    alert(a.join(" "));

    ```


    Escape the single quotes with a \ backslash to avoid errors.


    ![](img/5f5106681c8c7072e64c4ea87c891513_49_1.png)'
  - "[PAGE 50]\n\n# Reverse element order\n\nArrays can be used to contain a file\
    \ name or complete URL in each element for use with dynamic features in Web pages.\n\
    \nOne popular use is with JavaScript slide shows that rotate a series of images\
    \ with a specified interval between each one.\n\nAn array is used to hold the\
    \ URL of each image in its elements so that the script can easily reference them\
    \ by array index.\n\nIf the slide show is required to reverse after displaying\
    \ the final image, rather than start over at the first image, this can be achieved\
    \ by reversing the element order inside the array.\n\nThe following example creates\
    \ an initial array of just three images whose order will be reversed after the\
    \ final image displays and the rev variable is set to true:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_50_0.png)\n\
    \n```\n// create a new array of image URLs\nvar imgs = new Array(\"img1.gif\"\
    , \"img2.gif\", \"img3.gif\");\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_50_1.png)\n\
    \n```\n// control variable\nvar rev = false;\n```\n\n```\n// when the slideshow\
    \ displays the final image\n// reverse the order\nrev = true;\n```\n\n```\nif\
    \ (rev == true) {\n  imgs.reverse();\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_50_2.png)\n\
    \n```\ndisplay the reversed element order\nalert(imgs.join(\" - \") + \" - \"\
    );\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_50_3.png)\n\n4. Using arrays"
  - '[PAGE 51]


    # Sub-arrays


    The JavaScript array.slice() method is useful to make a new array from an existing
    array using some of the existing element values.


    This method takes two arguments to specify the index numbers of elements in the
    original array where the new array elements should start and end.


    The second argument may have a negative value to indicate the element position
    from the end of the array.


    If only a single argument is specified it will be used as the first element index
    number and the method will return a new array with all elements from this position
    onwards.


    These examples illustrate the different ways in which the array.slice() method
    can be used:


    ```

    create and initialize a new array

    var nums = new Array(1, 2, 3, 4, 5, 6, 7, 8);


    get elements #2 up #4

    var str = "Slice A: " + nums.slice(2, 4) + "\n"


    get elements #1 to one before

    str += "Slice B: " + nums.slice(1, -1) + "\n"


    get elements #3 to end

    str += "Slice C: " + nums.slice(3 ) + "\n"


    display all three slices

    alert(str);

    ```


    The array elements are taken up to, but not including, the second argument index.


    ![](img/5f5106681c8c7072e64c4ea87c891513_51_0.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_51_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_51_2.png)'
  - '[PAGE 52]


    # Arrange elements


    The JavaScript array.sort() method allows element values to be arranged in alphabetical
    order.


    This is sometimes desirable so that the output can be presented alphabetically.


    Integer and floating point numeric values will be arranged in ascending order
    – as seen in the following example:


    ```

    // create an array of integers

    var integers = new Array(3, 8, 8, 1, 9, 7, 5, 4, 2, 6);

    integers.sort();


    // create an array of floating-point numbers

    var floats = new Array(0.5, 0.125, 0.75, 0.25);

    floats.sort();


    // create an array of strings

    var strings = new Array("Michael", "Andrew", "David");

    strings.sort();


    // sort the array alphabetically

    // separate the elements with a hyphen

    var str = "Integers array: " + integers.join(" - ");

    str += " \nFloats array: " + floats.join(" - ");

    str += " \nStrings array: " + strings.join(" - ");

    alert all three sorted arrays

    alert(str);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_52_0.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_52_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_52_2.png)


