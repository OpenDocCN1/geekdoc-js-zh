  md: "# The form object\n\nThe window.document.forms object contains an array of\
    \ all the forms in an HTML document, indexed in the order in which they appear\
    \ in the HTML code.\n\nFor instance, window.document.forms[0] addresses the first\
    \ form to appear in the HTML code of a Web page.\n\nIf the id attribute of the\
    \ <form> element has been assigned a value then the form can be addressed by name.\
    \ So a form f can be simply addressed as document.forms.f.\n\nAll other attributes\
    \ assigned in the <form> tag are also accessible properties of that form object.\
    \ For instance, with this form...\n\n![](img/5f5106681c8c7072e64c4ea87c891513_125_0.png)\n\
    \n```\n<form id = \"f\" method = \"post\" action = \"mailto:a@b.com\" enctype\
    \ = \"text/plain\">\n```\n\n...the following JavaScript function can be called\
    \ from the HTML <body>'s onload attribute to reveal the form properties:\n\n```\n\
    function form_info() {\n // get the form name\n  var msg = \"Name: \" + document.forms.f.id;\n\
    \n // get the form method, action and encoding type\n  msg += \"\\nMethod: \"\
    \ + document.forms.f.method;\n  msg += \"\\nAction: \" + document.forms.f.action;\n\
    \  msg += \"\\nEnctype: \" + document.forms.f.encoding;\n  alert(msg);\n}\n```\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_125_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_125_2.png)"
  merge: -1
  pgno: 125
- img_proc: true
  md: "# Form elements\n\nThe window.document.forms[].elements object contains an\
    \ array of all the elements within a form indexed in the order in which they appear\
    \ in the HTML code. With a named f for instance, document.forms.f.elements[0]\
    \ addresses the first element that appears in that form.\n\nIf the name attribute\
    \ of the element has been assigned a value then the element can be addressed by\
    \ name. So the element btn1 in this form can simply be addressed as document.forms.f.btn1...\n\
    \n```\n<form id=\"f\" method=\"post\">\n<input type=\"button\" name=\"btn1\" value=\"\
    Click Me\"\nonclick=\"alert('Hi - I am a button')\" />\n</form>\n```\n\nOther\
    \ attributes are accessible as properties of that element – as illustrated by\
    \ this example:\n\n```\nfunction element_info() {\n    get the element type\n\
    \    var msg = \"Element Type: \"+document.forms.f.btn1.type;\n    get the element\
    \ value\n    msg += \"\\nElement Value: \"+document.forms.f.btn1.value;\n    get\
    \ the element onclick\n    msg += \"\\nElement Onclick: \"+document.forms.f.btn1.onclick;\n\
    \    alert(msg );\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_126_0.png)\n\
    \nUnless stated otherwise, all the example functions in this chapter are called\
    \ from the HTML <body> tag's onload attribute – a form field cannot be changed\
    \ before it has been created.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_126_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_126_2.png)"
  merge: -1
  pgno: 126
- img_proc: true
  md: "# Click buttons\n\nValues assigned in the HTML code may be reassigned by JavaScript\
    \ so that a button will perform a different action.\n\nIn the example below a\
    \ HTML onclick method specifies that the first() function will be called when\
    \ the button is pushed:\n\n```\n<form id=\"f\" method=\"post\">\n  <input type=\"\
    button\" name=\"btn1\" value=\"Click Me\"\n  onclick=\"first()\"\n</form>\n```\n\
    \nThe first() function assigns a variable to a string, then specifies a new event-handler\
    \ function called second() to the button's onclick attribute. Subsequently pushing\
    \ the button will call the second() function and execute the statement it contains.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_127_0.png)\n\n```\n// create a global\
    \ variable\nvar msg;\n\n// a function to store an initial message\nfunction first()\
    \ {\n  msg = \"This message was left by the first function\";\n  // assign another\
    \ function to the button\ndocument.forms.f.btn1.onclick = second;\nn\n```\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_127_1.png)\n\nWhen assigning event-handler\
    \ functions only assign the name - without any brackets.\n\n```\n// a function\
    \ to store a second message and display both\nfunction second() {\n  msg += \"\
    \\nHi, I'm the second function\";\n  alert(msg);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_127_2.png)"
  merge: -1
  pgno: 127
- img_proc: true
  md: "# Toggle value\n\nIt is useful to change the label that is displayed on a button\
    \ by its value attribute if that button performs dual actions.\n\nIn the following\
    \ example a button calls a stopgo() function to start or stop a counter. The counter\
    \ increments an integer variable at 1-second intervals and displays the count\
    \ in the window's status bar.\n\nThe button label normally reads Start but changes\
    \ to Stop if the timer count() function is running.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_128_0.png)\n\
    \n```\nvar running = false, num = -1, tim; // create globals\n\nfunction count()\
    \ // counter function\n{\n  if(running) {\n    num++; // increment the tally\n\
    \    window.status = \"Seconds elapsed: \" + num;\n    tim = setTimeout(\"count()\"\
    , 1000);\n  } else {\n    num = -1; clearTimeout(tim); // or halt\n  }\n}\n\n\
    function stopgo() // control function\n{\n  running = !running; // toggle counter\n\
    \  count();\n  document.forms.f.btnl.value = (running)? ? \"Stop\" : \"Start\"\
    ; // change the label\n}\n```\n\nThe num variable is initialized at -1 so that\
    \ when first incremented counter will start at zero.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_128_1.png)\n\
    \nThe operator is used here to change the boolean variable to the opposite of\
    \ its current value.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_128_2.png)\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_128_3.png)\n\nII. Form properties | 127"
  merge: -1
  pgno: 128
- img_proc: true
  md: "# Text boxes\n\nThe text displayed in a HTML <input> text is easily changed\
    \ by JavaScript simply by assigning a new string to the value property of that\
    \ form element.\n\nHistorically, text boxes were restricted to display text in\
    \ just one fixed font but modern browsers allow a choice of font, size and color.\n\
    \nThe example below displays a string in a text box and adds style characteristics\
    \ for font, foreground-color and background-color:\n\n```\n// function to set\
    \ the text in a form text field\nfunction set_text() {\n    // for text field\
    \ txt in form f\n    with(document.forms.f.txt1) {\n        // set the text value\n\
    \        value = \"JavaScript in easy steps\";\n\n        // set the style characteristics\n\
    \        style.fontFamily = \"comic sans ms\";\n        style.fontSize = \"16pt\"\
    ;\n        style.color = \"yellow\";\n        style.backgroundColor = \"red\"\
    ;\n    }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_129_0.png)\n\n| Text\
    \ Field | |\n|---||\n| File Edit View Favorites Tools Help |\n| JavaScript in\
    \ easy steps | |\n| Done | Local intranet |"
  merge: -1
  pgno: 129
- img_proc: true
  md: "# Password boxes\n\nA HTML password <input> is simply a text box that displays\
    \ asterisks in place of the actual characters.\n\nThis example converts the string\
    \ input by the user, into a password field named pwd1, to lowercase and assigns\
    \ the string to a variable.\n\nIf the variable string matches the correct password\
    \ then the browser will load the first page of the website – but it will display\
    \ an alert() dialog message if the string does not match.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_130_0.png)\n\
    \n```\na function to validate a password entry\nfunction validate()\n{\n  convert\
    \ the input to lowercase\n  var entry = document.forms.f.pwd1.value.toLowerCase();\n\
    \  relocate the browser if the input is correct\n  if (entry == \"admin\") window.location\
    \ = \"page.html\";n  else {\n    // display a message if the input is incorrect\n\
    \    alert(\"Password incorrect - Please retry...\");\n    // clear the password\
    \ field\n    document.forms.f.pwd1.value = \"\"\n  }\n}\n```\n\npassword-field.js\n\
    \nThe final line in this script will clear the password box after the user clicks\
    \ the alert OK button. to be ready for another entry\n\n![](img/5f5106681c8c7072e64c4ea87c891513_130_1.png)\n\
    \n| Password Field |\n| File | Edit | View | Favorites | Tools | Help |\n| Microsoft\
    \ Internet Explorer |\n| Password incorrect - Please retry... |\n| OK |\n| Done\
    \ | Local intranet |"
  merge: -1
