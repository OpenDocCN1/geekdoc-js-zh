    \ // 针对 IE\n\n  // 窗口宽度的一半减去 div宽度\n  var left_pos = parseInt(width / 2) - 50;\n\
    \  \n  // 设置 <div> 元素的左位置\n  document.getElementById(\"lyr\").style.left = (left_pos+\"\
    px\");\n}\n\n// 指定 onresize 事件处理器\nwindow.onresize = set_pos;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_159_0.png)\n\
    \n该 `<div>` 最初通过从 HTML `<body>` 元素调用 `set_pos()` 函数来实现初始居中。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_159_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_159_2.png)\n\n# DHTML 中的 JavaScript\n\
    \n本章描述了如何使用 JavaScript 控制和操作 HTML 文档的组件。许多示例说明了位置、内容和可见性的特征如何进行动态更改，以创建一个有趣的交互式\
    \ Web 页面。\n\n- JavaScript: 协议 | 160\n- 图层属性 | 161\n- 切换可见性 | 162\n- 动态内容 | 164\n\
