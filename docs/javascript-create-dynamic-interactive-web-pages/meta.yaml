  - "[PAGE 110]\n\n# Frame objects\n\nThe example on the facing page allows access\
    \ to different frames within a framed window and because the browser DOM is hierarchical\
    \ that means that the objects and properties within any frame are also accessible.\n\
    \nThe script can assign values to these object properties and use their methods\
    \ just as with an an unframed window.\n\nTypically a navigation frame on the left\
    \ side of the window will have navigation buttons which, pushed, will assign new\
    \ URL locations to a main frame on the right side of the screen.\n\nThis example\
    \ adds a further function to the code list on the opposite page. This is called\
    \ from the HTML onClick attribute of the button to write text in the Banner frame\
    \ and to change the location of the Page frame:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_110_0.png)\n\
    \n```\nfunction next() {\n  load another page into the Page frame\n  parent.frames.Page.window.location\
    \ = \"nextpage.html\";\n  write text into the Banner frame\n  parent.frames.Banner.window.document.write(\"\
    Frame 2 - Written by Frame 1\");\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_110_1.png)"
  - "[PAGE 111]\n\n# Error handling\n\nA custom error-handling function may be assigned\
    \ to the `window.onerror` object to deal with runtime errors.\n\nWhen the browser\
    \ meets it it looks for it in the script, but if none is found, it will handle\
    \ the error itself by opening the browser error dialog box.\n\nOnce the error\
    \ has been notified a `true` value is returned to the browser to indicate that\
    \ the error has been dealt with.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_111_0.png)\n\
    \nTo avoid all error dialogs a custom error-handler function need only return\
    \ `true` when an error is encountered.\n\nUsefully the browser will pass three\
    \ arguments to the error-handler containing information on the nature of the error,\
    \ the URL of the file that contains the error, and the actual line number in that\
    \ file where the error exists.\n\nIn the example below each piece of error information\
    \ passed to the error-handling function by the browser is displayed for the user:\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_111_1.png)\n\n```\n// declare an error-handling\
    \ function\nwindow.onerror = errorHandler;\n\n// define the error-handling function\n\
    function errorHandler(msg, url, ln) {\n    alert(\"Error: \"+msg+ \"\\nIn File:\"\
    +url+\"\\nAt Line:\"+ln\");\n    return true; // tell the browser it's been handled\n\
    }\n```\n\n```\n// This is a deliberate mistake\ndocument.form[theMistake].value\
    \ = \"pushButton\";\n```\n\n[JavaScript Application]\nError: theMistake is not\
    \ defined\nIn File:http://localhost/error.js\nAt Line:12\n[OK]"
- md: "\n# Document properties\n\nThis chapter illustrates properties and methods\
    \ of the window.document object. Image-swapping rollovers are demonstrated and\
    \ cookies are explained. There is also an overview of how layers are used in JavaScript.\n\
    \n- Set colors | 112\n- JavaScript creates | 113\n- Set cookie | 114\n- Get cookie\
    \ | 115\n- Images array | 116\n- Rollover | 117\n- Dynamic content | 118\n- Last\
    \ modified | 119\n- XYZ coordinates | 120\n- Dynamic layers | 121\n- Transparent\
    \ layers | 122\n\n# Set colors\n\nThe properties and methods of the window.document\
    \ object enable a Web page document to be changed at runtime. Using JavaScript\
    \ to assign new values to properties of the window.document object causes the\
    \ Web browser to update the appearance of the Web page in line with the new values.\n\
    \nThe window.part of the address bar may be omitted as window is the top DOM object.\n\
    \nThis can be simply illustrated by assigning new values to the document.bgColor\
    \ and document.fgColor properties to change the background and foreground colors\
    \ of a page.\n\nIn this example the set_colors() function is called from the HTML\
    \ onclick attribute of the button when the user pushes it:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_113_0.png)\n\
    \n```javascript\n// a function to set the colors of the page\nfunction set_colors()\
    \ {\n    window.document.bgColor = \"red\";\n    window.document.fgColor = \"\
    yellow\";\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_113_1.png)\n\nNotice\
    \ the capitalization with both bgColor and fgColor.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_113_2.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_113_3.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_113_4.png)\n\
    \n# JavaScript creates\n\nThe `write()` method of the window.document object is\
    \ a tremendously powerful feature that allows JavaScript to create content dynamically\
    \ when loading a Web page.\n\nThe method takes a single string argument containing\
    \ the content to be written into the page and may include HTML tags to format\
    \ the content.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_114_0.png)\n\nTypically\
    \ the `document.write()` method appears within a script in the `<body>` section\
    \ of an HTML document and will select content following a conditional test.\n\n\
    It should be noted that calling this method at runtime will cause the specified\
    \ content to be written into a new blank document so replacing the current page.\n\
    \nVariable values may also be concatenated with a string argument in order to\
    \ introduce a variable value into the content of a Web page.\n\nThis example first\
    \ generates a random number then tests to determine if the number is odd or even.\
    \ Selected content is added to the page depending on the result of this test:\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_114_1.png)\n\n```javascript\n// get\
    \ a random integer between 1 - 100\nvar n = Math.ceil( Math.random() * 100 );\n\
    // determine whether the number is odd or even\ntype = ( n % 2 == 0 ) ? \"Even\"\
    \ : \"Odd\";\n\n// write a description of the number\ndocument.write(\"<html>Number\
    \ \" +n+ \" is \" +type+\"</html>\");\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_114_2.png)\n\
    \n# Set cookie\n\nCookies are tiny files that can be written by JavaScript to\
    \ store small amounts of data on the local hard drive. There are limitations to\
    \ the use of cookies that restrict their size to 4 kilobytes and Web browsers\
    \ are not required to retain more than 20 cookies per Web server. Typically a\
    \ cookie may often retain user data for across Web pages or subsequent visits\
    \ to a website.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_115_0.png)\n\nEscape\
    \ the values to include spaces, commas and semicolons.\n\nThe cookie data is held\
    \ in the window.document.cookie object as a name=value pair – the value may not\
    \ contain any semicolons, commas or whitespace. Multiple name=value pairs may\
    \ be stored by making further assignments to the document.cookie object\n\nThe\
    \ life-span of a cookie is limited to the length of the current browser session\
    \ unless an expiry date is specified when the cookie is first set.\n\nExpiration\
    \ is assigned to a named key expires by amending the current Date to the desired\
    \ future date.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_115_1.png)\n\nA cookie\
    \ may be deleted by setting an expiry date that is before the current date. Dates\
    \ of expiry should be expressed in GMT string by converting the Date object using\
    \ the Date.toGMTString() method. The calculation in the example below multiplies\
    \ the date, hours, and milliseconds to increment a Date object by exactly 1 week.\
    \ This example stores the user's name and account number in a cookie with a life-span\
    \ of 7 days:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_115_2.png)\n\n```javascript\n\
    // the data to be stored in the cookie\nvar user_account = \"Mike McGrath,0456\"\
    ;\n// create a new Date object\nvar expiry = new Date();\n// set the expiry for\
    \ 7 days\nexpiry.setTime(expiry.getTime() + (7*24*60*60*1000));\n// create the\
    \ cookie\ndocument.cookie = \"cookie=\"+escape(user_account) + \";expires=\" +\
    \ expiry.toGMTString() + \";\";\n```\n\n# Get cookie\n\nIf a cookie is set the\
    \ `document.cookie` object will return `true` JavaScript can test for the presence\
    \ of cookies. When a cookie is located the `document.cookie` object returns the\
    \ stored string. Parts of the data may be retrieved from the stored string using\
    \ regular string manipulation methods earlier in this book. When the script below\
    \ first seeks the cookie set by the previous page, it extracts the data values\
    \ to write customized content:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_116_0.png)\n\
    \n```javascript\n// find any cookies\nif(document.cookie) {\n  // unescape the\
    \ cookie data\n  var cookieata = unescape(document.cookie);\n  // split the name=value\
    \ pairs\n  var userdata = cookieata.split(\"=\");\n  // if the cookie is called\
