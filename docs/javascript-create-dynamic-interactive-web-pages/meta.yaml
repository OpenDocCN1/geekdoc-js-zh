    # Arithmetical operators


    The arithmetical operators used in JavaScript are listed in the table below with
    the operations they perform:


    | Operator | Operation |

    | --- | --- |

    | + | Addition (and concatenates strings) |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

    | % | Modulus |

    | ++ | Increment |

    | -- | Decrement |


    Notice that the + operator has two types of operation depending on the given operands.
    It will add together two numeric values and give the result of the addition. It
    will also join together two string values and return the concatenated string,
    as in the example on the facing page.


    ![](img/5f5106681c8c7072e64c4ea87c891513_23_0.png)


    An example using the modulus operator to determine odd or even values can be found
    in the if statement on page 32.


    The % modulus operator will divide the first number by the second number and return
    the remainder of the operation. This is most useful to determine if a number has
    an odd or even value.


    The ++ increment and -- decrement operators alter the given value by 1 and return
    the resulting new value. These are most commonly used to count iterations in a
    loop.


    All the other operators act as you would expect but care be taken to bracket expressions
    where more than one operator is used to clarify the operations:


    ```

    a = b * c - d % e / f ;           // This is unclear

    a = (b * c) - ((d % e) / f );               // This is clearer

    ```'
