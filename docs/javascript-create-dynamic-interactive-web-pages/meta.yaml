    \  msg=\"\\n Image Name : \"+document.images[1].id;\n  msg=\"\\n Image Source\
    \ : \"+document.images[1].src;\n  alert(msg);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_117_2.png)\n\
    \nThis example assumes these images appear in the HTML code sequentially from\
