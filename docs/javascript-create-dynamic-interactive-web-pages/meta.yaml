  md: "# Slide show\n\nJavaScript can rotate images to create an automatic slide show\
    \ that will update the current image after a predetermined interval.\n\nIn this\
    \ script a preload routine first downloads all the images into the browser's cache\
    \ to be readily available for display.\n\nRotation speed in milliseconds is specified\
    \ by the value assigned to the variable pause.\n\nThe variable named n is a counter\
    \ that is incremented by the rotate() timer function and is used to display the\
    \ image at that index number in the imgs[] array.\n\nIt is important that all\
    \ the images should have the same dimensions and be small file sizes to avoid\
    \ download delays.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_167_0.png)\n\n\
    ```\n// store an interval in a variable\nvar pause = 3000;\n  create and initialize\
    \ a counter\nvar n = 0;\n  create an array of image file names\nvar imgs = new\
    \ Array (\"butterfly.gif\", \"globe.gif\", \"fish.gif\", \"clock.gif\");\n\n//\
    \ preload all the images\nvar preload = new Array();\nfor(var i = 1; i < imgs.length;\
    \ i++) {\n  preload[i] = new Image();\n  preload[i].src = imgs[i];\n}\n```\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_167_1.png)\n\nSimply adding more image\
    \ filenames to the imgs[] array will extend the slide without further coding.\n\
    \n```\na function to display each image for the set interval\nfunction rotate()\
    \ {\n  document.images.pic.src = imgs[n];\n  n = (imgs.length - 1 )) ? n = 0 :\
    \ n++;\n  setTimeout(\"rotate()\", pause);\n}\n\n// specify the onload event-handler\n\
    window.onload = rotate;\n```\n\n166 | JavaScript in easy steps"
  merge: -1
