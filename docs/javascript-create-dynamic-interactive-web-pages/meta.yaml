    # 第一章


    # 引言


    JavaScript 是一种解释型编程语言，其解释器嵌入在 Microsoft Internet Explorer 和 Netscape Navigator
    等网络浏览器软件中。这意味着每当网页文档加载到浏览器窗口时，其中的脚本就可以被浏览器的 JavaScript 引擎读取。![](img/5f5106681c8c7072e64c4ea87c891513_9_0.png)
    通过这种方式，网页文档可以对用户的操作做出响应并执行动态视觉效果。JavaScript 不应与 Sun 公司的编译型编程语言 Java 混淆，尽管两者某些相似之处，但它是完全不同的语言。JavaScript
    语言包含许多令人深刻的功能，但出于安全考虑，它不能读取或写入文件，用于存储少量数据的 cookie 文件除外。本书关注创建交互式网页时最有用的 JavaScript
    核心和客户端功能。学习基础知识是重要的，因此首先通过示例章节涵盖了语言机制，解释了如何编写 JavaScript 程序。然后，介绍了浏览器的文档对象模型 (DOM)，以说明所有网页都包含可以使用
    JavaScript 操作的对象及其属性。将 JavaScript 与 DOM 知识相结合，可以创建强大的动态 HTML (DHTML) 效果。本书的最后一部分包含了使用
    JavaScript 创建流行 DHTML 效果的示例，并附带完整的源代码，可用于任何网页。

