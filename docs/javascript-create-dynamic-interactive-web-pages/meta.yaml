  md: "# Mouse down and mouse up\n\nA MouseDown event occurs when the user presses\
    \ a mouse button and a MouseUp event occurs when it is released.\n\nTypically\
    \ these are used together so that a single mouse click will use two event-handlers,\
    \ like this:\n\n```\n<input type=\"button\" value=\"Light Switch\"\nonmousedown\
    \ = \"light(1)\" onmouseover=\"light(0)\">\n```\n\nThis example swaps an image\
    \ and changes the value of a text box when the cursor is over and a mouse button\
    \ is pressed. It reverts to their original state when the button is released:\n\
    \n```\n// a function to react to MOUSEDOWN and MOUSEUP events\nfunction light(n)\
    \ {\n  if( n == 1 ) {\n    document.images.bulb.src = \"bulbon.gif\";\n    document.forms.f.txt.value\
    \ = \"Button is Down\";\n  }\n  if( n == 0 ) {\n    document.images.bulb.src =\
    \ \"bulboff.gif\";\n    document.forms.f.txt.value = \"Button is Up\";\n  }\n\
    }\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_147_0.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_147_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_147_2.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_147_3.png)\n\
    \n146 JavaScript in easy steps"
  merge: -1
  pgno: 147
- img_proc: true
  md: "# Mouse buttons\n\nJavaScript properties can determine which mouse button has\
    \ been pressed by examining the MouseDown event.\n\nWith Internet Explorer the\
    \ left mouse button stores an integer value of 1 in the event.button property,\
    \ the right mouse button stores an integer value of 2 and the center button, if\
    \ present, stores an integer value of 3.\n\nHere this property is used to inhibit\
    \ the Internet Explorer context menu that normally appears when the right mouse\
    \ button is pressed by the user:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_148_0.png)\n\
    \n```\nstore a default message\nvar msg = \"Right-Click Context Menu Is Disabled\"\
    \n// a function to stop the IE context menu\nfunction stopmenu(e) {\n    for Internet\
    \ Explorer browsers\n    if(navigator.appName == \"Microsoft Internet Explorer\"\
    \n    && event.button == 2 || event.button == 3 )) {\n        alert( msg);\n \
    \       return false;\n    }\n```\n\n```\n// specify the onmousedown event-handler\n\
    document.onmousedown = stopmenu;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_148_1.png)\n\
    \n12. Event-handlers"
  merge: -1
  pgno: 148
- img_proc: true
  md: "# Key down and key up\n\nA KeyDown event occurs when the user presses a keyboard\
    \ key button and a Key event occurs when it is released. Typically these are used\
    \ together so that a single key depression will use two event-handlers.\n\nThis\
    \ example swaps an image and changes the value of a text box when a keyboard key\
    \ button is pressed and reverts both to their original state when the key button\
    \ is released:\n\n```\nNetscape/Mozilla capture events instruction\nif (navigator.appName\
    \ == \"Netscape\") \nwindow.captureEvents ( Event.KEYDOWN, Event.KEYUP );\n```\n\
    \na function to react to KEYDOWN events\n\n```\nfunction isdown()\n{\ndocument.images.bulb.src\
    \ = \"bulbon.gif\";\ndocument.forms.f.txt.value = \"Key is Down\";\n}\n```\n\n\
    a function to react to KEYUP events\n\n```\nfunction isup()\n{\ndocument.images.bulb.src\
    \ = \"bulboff.gif\";\ndocument.forms.f.txt.value = \"Key is Up\";\n}\n```\n\n\
    define the event-handlers\n\n```\ndocument.onkeydown = isdown;\ndocument.onkeyup\
    \ = isup;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_149_0.png)\n\nNotice\
    \ how the first two lines of this script capture both KeyDown and KeyUp events\
    \ for Netscape/Mozilla browsers.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_149_1.png)\n\
    \n| KeyUp and KeyDown |\n| File | Edit | View | Favorites |\n| Key is Down |\n\
    | Done |\n\n| KeyUp and KeyDown |\n| File | Edit | View | Favorites |\n| Key is\
    \ Up |\n| Done |\n\n148 | JavaScript in easy steps"
  merge: -1
  pgno: 149
- img_proc: true
  md: "# Key codes\n\nThe KeyDown event can also be used to get the Unicode character\
    \ code number of a key depression.\n\nThis example looks for the Y and N character\
    \ codes, in both upper and lower case, then branches the script according to the\
    \ value.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_150_0.png)\n\n```\nif( navigator.appName\
    \ == \"Netscape\"\nwindow.captureEvents( Event.KEYDOWN );\n```\n\n```\nfunction\
    \ showkey(e) {\n  var msg = \"\", fwd = \"Y pressed\", hlt = \"N pressed\";\n\
    \  // key codes in Netscape/Mozilla browsers\n  if( navigator.appName == \"Netscape\"\
    ) {\n    if( e.which == 89 || e.which == 121 ) msg = fwd;\n    if( e.which ==\
    \ 78 || e.which == 110) msg = hlt;\n  }\n\n  // check key codes in Internet Explorer\n\
    \  if( navigator.appName == \"Microsoft Internet Explorer\") {\n    if(event.keyCode==89\
    \ || event.keyCode==121)msg= fwd;\n    if(event.keyCode==78 || event.keyCode==110)msg=\
    \ hlt;\n  }\n\n  if( msg != \"\") ) alert(msg);\n  // line the event-handler\n\
    \  document.onkeydown=showkey;\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_150_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_150_2.png)"
  merge: -1
  pgno: 150
- img_proc: true
  md: "# Load\n\nThe Load event does not occur until all the HTML elements on a Web\
    \ page have completely loaded. This means that the onload event-handler will only\
    \ run after all the elements are present.\n\nIf JavaScript is to modify elements\
    \ of the document <body> section those elements must already be loaded to avoid\
    \ receiving a script error.\n\nTypically the onload event-handler will call a\
    \ JavaScript function, named init(), that will initialize a number of values.\n\
    \nThis example sets the HTML page colors, then it assigns a value to a variable\
    \ which it subsequently assigns to a form text box:\n\n```\n// a function to react\
    \ to the LOAD event\nfunction init() {\n  // set foreground and background colors\n\
    \  document.bgColor = \"orange\";\n  document.fgColor = \"blue\";\n\n  // store\
    \ a string then display it in a form field\n  var str = \"The Page is Loaded\"\
    ;\n  document.forms.f.txt.value = str;\n}\n\n// specify the onload event-handler\n\
    window.onload = init;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_151_0.png)\n\
    \nA HTML event-handler assigned to the onload attribute of the <body> tag would\
    \ replace that assigned in the script.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_151_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_151_2.png)"
  merge: -1
  pgno: 151
- img_proc: true
  md: "# Unload\n\nThe Unload event occurs whenever the browser unloads a document\
    \ from a window, or frame, usually when the user navigates to a new URL.\n\nThe\
    \ onclick event-handler may call a final JavaScript function to be run just before\
    \ the document unloads. When a frames page is unloaded the onload event-handler\
    \ of each frame may call a final function.\n\nThe onclick event-handler is useful\
    \ to save the final state of data on that page in a cookie or by submission to\
    \ the server.\n\nIt is also used to open new pop-up windows containing further\
    \ information that the user may find.\n\nThe example below illustrates the use\
    \ of the onload event-handler to open a new pop-up window:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_152_0.png)\n\
    \n```\n// a function to react to the UNLOAD event\nfunction leaving()\n{\n  //\
    \ open a HTML document in a pop-up window\n  var win = window.open(\"finally.html\"\
    , \"\",\n  \"top=50,left=50,width=300,height=100\");\n}\n\n// specify the onload\
    \ event-handler\nwindow.onload = leaving;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_152_1.png)\n\
    \n| Unload Event |\n| File Edit View Favorites Help |\n| Go to | And finally...\
    \ |\n| | We're sorry to see you go Visit a similar site ? |\n| Local intranet\
    \ |"
  merge: -1
  pgno: 152
- img_proc: true
  md: "# Focus\n\nThe Focus event occurs when the user clicks on a form element or\
    \ on a window to direct the browser's focus.\n\nThe onfocus event-handler can\
    \ call a JavaScript function when the focus is received.\n\nA HTML onfocus attribute\
    \ can be added to form elements to specify a function when it receives focus,\
    \ like this...\n\n![](img/5f5106681c8c7072e64c4ea87c891513_153_0.png)\n\n```\n\
    <input type=\"text\" name=\"txt1\" value=\"Enter quantity here\" onfocus=\"wipe(this)\"\
    />\n<input type=\"text\" name=\"txt2\" value=\"Enter data here\" onfocus=\"wipe(this)\"\
    />\n```\n\nIn the example, below the text inputs initially display the strings\
    \ assigned to their respective value attributes.\n\nWhen the user clicks each\
    \ text input receives focus so the wipe() function assigns an empty string to\
    \ its value attribute. This clears the displayed text and places the cursor in\
    \ the appropriate position ready for the user to input text into that field.\n\
    \n```\n// a function to clear a text input\nfunction wipe(obj) {\n  // clear the\
    \ form field\n  obj.value=\"\"\n  // reset the focus\n  obj.focus();\n}\n```\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_153_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_153_2.png)"
  merge: -1
