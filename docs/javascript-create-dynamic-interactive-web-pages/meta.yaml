  md: '# Universal time clock


    Universal Time is the standard world time clock that runs Greenwich Mean Time.


    The Date object methods used in the previous examples all return the local system
    time but sometimes it is preferable to use the standard of Universal Time.


    For this the Date object has a series of methods that convert the time and date
    information from local time to universal.


    The example below calls local and universal time information on a PC running at
    Western European Time:


    ![](img/5f5106681c8c7072e64c4ea87c891513_59_0.png)


    ```

    // create a new Date object

    var now = new Date();


    // get the local time in hours

    var hh = now.getHours();


    // get the universal time in hours

    var utc_hh = now.getUTCHours();


    // get minutes and seconds

    var mn = now.getMinutes();

    var ss = now.getSeconds();


    // ensure there are two digits for the minute value

    if(mn < 9) mn = "0" +mn;


    // display both times

    var wet = "Athens time: "+hh+": "+mn+": "+ss+\

    \n";

    var utc = "Universal time: "+utc_hh+": "+mn+": "+ss+";

    nalert(wet + utc);

    ```


    If the minutes value is less than 10 this script adds a leading zero to it.


    ![](img/5f5106681c8c7072e64c4ea87c891513_59_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_59_2.png)


    58 | JavaScript in easy steps'
  merge: -1
  pgno: 59
- img_proc: true
  md: "# Time zones\n\nJavaScript can determine which time zone the user is in using\
    \ the\nDate.getTimezoneOffset() method.\n\nThe method gets the local time from\
    \ the Date object then\ncompares it to the UTC time. The return value is the difference\n\
    stated in minutes because some countries have time zones at other\nthan regular\
    \ one-hour intervals.\n\nIn the example below the Date.getTimezoneOffset() method\n\
    decides in U.S. time zone, if any, the user is located:\n\n```\ncreate a new Date\
    \ object\nvar now = new Date();\nget the number of minutes offset from UTC\nvar\
    \ offset = now.getTimezoneOffset();\n\ncreate an empty variable\nvar msg;\nnassign\
    \ an appropriate variable\nswitch(offset) {\n  case 240 : msg = \"East Coast\"\
    ; break;\n  case 300 : msg = \"Central\"; break;\n  case 360 : msg = \"Mountain\"\
    ; break;\n  case 420 : msg = \"Pacific\"; break;\n  default : msg = \"all\";\n\
    }\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_60_0.png)\n\nThis method can\n\
    easily be used to\na local Web\npage too.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_60_1.png)\n\
    \nA bug in some\nNetscape\nbrowsers does\nnot report the\ncorrect offset.\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_60_2.png)\n\ndisplay the message\nalert(\"\
    Welcome to \" +msg + \" visitors.\");\n\n![](img/5f5106681c8c7072e64c4ea87c891513_60_3.png)\n\
    \n5. Date and time | 59"
  merge: -1
