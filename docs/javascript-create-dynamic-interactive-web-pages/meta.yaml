  md: '# Scrolling layer


    Where the previous example modified the left property of a layer object''s style,
    this example manipulates the layer''s top property to move a layer higher or lower
    on the Y axis.


    This example moves a <div> layer that has an id of chopper. The layer contains
    a simple helicopter image.


    HTML code adds rollover hyperlinks that call JavaScript functions but have a void
    target.


    When the user places the cursor over the hyperlink "Soar" a timer function increments
    the value of the top property so the layer moves vertically higher in the window.


    Placing the cursor over the hyperlink "Sink" has the opposite effect and lowers
    the layer vertically in the window.


    In each case the timer function is cancelled when the cursor moves away from the
    hyperlink and the movement of the layer is discontinued.


    ![](img/5f5106681c8c7072e64c4ea87c891513_171_0.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_171_1.png)'
  merge: -1
  pgno: 171
- img_proc: true
  md: "# ...cont'd\n\n![](img/5f5106681c8c7072e64c4ea87c891513_172_0.png)\n\na variable\
    \ to store a timer\n\n```\nvar timer;\n// a function to move a <div> layer up\
    \ the page\nfunction soar() {\n  get the div object\n  var obj = document.getElementById(\"\
    chopper\");\n\n  move up by 1 pixel\n  obj.style.top = (parseInt(obj.style.top)-1)+\"\
    px\";\n\n  set the interval at which to call this function\n  timer = window.setTimeout(soar(),\
    \ 50);\n```\n\nscrolljs\n\n![](img/5f5106681c8c7072e64c4ea87c891513_172_1.png)\n\
    \nThe parseInt() method is needed to extract the layer's top value.\n\n```\na\
    \ function to move a <div> layer down the page\nfunction sink() {\n  get the div\
    \ object\n  var obj = document.getElementById(\"chopper\");\n\n  move down by\
    \ 1 pixel\n  obj.style.top = (parseInt(obj.style.top)+1)+\"px\";\n\n  set the\
    \ interval at which to call this function\n  timer = window.setTimeout(sink(),\
    \ 50);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_172_2.png)\n\nChange the\
    \ timer delay from 50 to adjust the speed of scroll.\n\n```\n// a function to\
