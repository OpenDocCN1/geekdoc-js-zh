  md: '# Setting date and time


    The JavaScript code may manipulate the Date object information using a variety
    of Date.set() methods.


    These mirror the range of Date.get() methods that are used to extract parts of
    the Date object information but are used instead to set new values.


    In the example below the initial Date object values are stored in the orig variable
    named orig. Then the various Date.set() methods apply new values to the Date object
    information:


    ```

    // create a new Date object

    var now = new Date();


    // store the original date and time information

    var orig = "Original :\n " + now.toString() + "\n\n";


    // set new date and time details

    now.setDate(21);

    now.setMonth(1);

    now.setHours(12);

    now.setMinutes(30);

    now.setSeconds(15);

    now.setFullYear(2005);


    // store the modified date and time information

    var mod = "Modified :\n " + now;

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_61_0.png)


    The toString() method used here returns the string value of JavaScript objects
    and has uses.


    ![](img/5f5106681c8c7072e64c4ea87c891513_61_1.png)


    ```

    // display original and modified date and times

    alert(orig + mod);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_61_2.png)'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Date strings


    In many instances the Date object information must be converted into a string
    in order to store or use that information.


    The Date.toString() method on the facing page does this but it is often preferable
    to store this information in standard UTC time.


    JavaScript provides the Date.toGMTString() method that both converts the information
    to a string and converts it to the GMT time zone.


    > A complete example setting cookies using this method can be found in Chapter
    10, on page 114.


    Using this method of storing date information avoids time confusion and is commonly
    used as the standard when setting the life span of cookie files.


    This simple example illustrates the Date.toGMTString() method performing its conversions
    in a browser in Tokyo, Japan:


    ```

    create a new Date object

    var now = new Date();


    store local time

    var jpn = "Tokyo Time:\n" +now.toString() + "\n\n";


    store GMT time

    var gmt = "UTC Time:\n" + now.toGMTString();


    display local time and GMT time

    alert(jpn + gmt);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_62_0.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_62_1.png)


    5. Date and time | 61'
