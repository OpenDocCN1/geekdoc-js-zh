  md: "# While loops\n\nAnother loop uses the JavaScript while keyword followed by\
    \ an expression to be evaluated for a boolean value.\n\nIf the evaluation returns\
    \ true then the code in the statement block will be executed. After the code has\
    \ executed the test expression will again be evaluated and the loop will continue\
    \ until the evaluation returns false.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_39_0.png)\n\
    \nThe statement block must feature code that will affect the test expression in\
    \ order to change the evaluation result to return false - otherwise an infinite\
    \ loop will be created.\n\nIt is important to note that if the test expression\
    \ returns false when it is first evaluated then the code in the statement block\
    \ is never executed.\n\nThis example decrements a variable on each iteration of\
    \ the loop. The counter increments until it reaches 10 when the evaluation returns\
    \ false and the loop ends.\n\n```\nvar i = 0, num = 50;\n// loop until the counter\
    \ hits 10\nwhile(i < 10 )\n{\n  num--;\n  i++;\n}\n// display the final counter\
    \ and number values\nalert(\"Loop stopped at \" + i + \"\\nnum is now \" + num\
    \ +);\n```\n\nwhile.js\n\n![](img/5f5106681c8c7072e64c4ea87c891513_39_1.png)"
  merge: -1
  pgno: 39
- img_proc: true
  md: "# The do - while loop\n\nThe JavaScript **do** keyword is used to denote the\
    \ start of a **do-while** loop and is followed by a statement block containing\
    \ the code to be executed by the loop.\n\nThe statement code is followed by the\
    \ JavaScript **while** keyword and an expression to be evaluated for a boolean\
    \ value of **true** or **false**.\n\nIf the evaluation returns **true** the loop\
    \ restarts at the **do** keyword and will continue until that returns **false**.\n\
    \nIt is important to note that, unlike the simple **while** loop, the statement\
    \ code will always be executed at least once the **do-while** loop because the\
    \ test expression is not encountered until the end of the loop.\n\nThe following\
    \ example will never loop because the counter value is incremented by 1 in the\
    \ first execution of the statement code so the first evaluation will return **false**:\n\
    \n```\nvar i = 0, num = 50;\n\n// loop until the counter hits 1\ndo {\n  num--;\n\
    \  i++;\n} while( i < 1 \\);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_40_0.png)\n\
    \nA **while** loop is often more suitable than a **do-while** loop.\n\n// display\
    \ the final counter and number values\nalert(\"Loop stopped at \" + i + \"\\num\
    \ is now \" + num \\);\n\n![](img/5f5106681c8c7072e64c4ea87c891513_40_1.png)\n\
    \n3. Making statements | 39"
  merge: -1
  pgno: 40
- img_proc: true
  md: "# Break statement\n\nThe JavaScript break keyword is used to terminate the\
    \ execution of a loop prematurely.\n\nThe break keyword is situated inside the\
    \ statement block containing the code that the loop should execute and is preceded\
    \ by a conditional test.\n\nWhen the test condition is met the break statement\
    \ immediately terminates the loop and no further iterations are made.\n\nNotice\
    \ in the alert() output below that the counter value is still three because the\
    \ increment in the final iteration is not applied\n\nIn the following example\
    \ the conditional test will return true when the counter value reaches three:\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_41_0.png)\n\n```\nvar i= 0;\n// Loop\
    \ until the counter hits 6\nwhile (i < 6)\n{\n  if( i == 3 ) break;\n  i++;\n\
    }\n// display the final counter value\nalert(\"BREAK\\nnLoop stopped at \" + i);\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_41_1.png)\n\nThe break keyword\
    \ is also used as a terminator with a switch statement.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_41_2.png)"
  merge: -1
  pgno: 41
- img_proc: true
  md: "# Continue statement\n\nThe JavaScript continue keyword is used to break the\
    \ current iteration of a loop.\n\nJust like the break keyword the continue keyword\
    \ is situated inside the statement block containing the code that the loop should\
    \ execute, preceded by a conditional test.\n\nWhen the test condition is met the\
    \ continue keyword immediately stops the current iteration of the loop, but further\
    \ iterations will be made until the loop ends.\n\nIn the example below the test\
    \ condition is met when the counter reaches three so the string concatenation\
    \ in that iteration is not applied but the loop continues on:\n\n```\nvar i =\
    \ 0, str = \"\";\nloop counter hits 5\nwhile(i < 5)\n{\n  i++;\n  if( i == 3 )\
    \ continue;\n  str += i + \" \";\n}\ndisplay final counter\n and all series numbers\n\
    alert(\"CONTINUE\\n\\n stopped:\"+i+\"\\nSeries:\"+str);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_42_0.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_42_1.png)"
  merge: -1
  pgno: 42
- img_proc: true
  md: "# # Using with statements\n\nThe JavaScript **with** keyword is used to reference\
    \ object properties without needing to add the object name before each property\
    \ name.\n\nThis is most useful when writing JavaScript applications to produce\
    \ dynamic effects as these scripts often refer to document objects.\n\nFor example,\
    \ every Web page contains a **document** object that in turn has a **forms** property\
    \ to reference forms on the Web page. Forms can be referenced by the value assigned\
    \ to their **id** attribute. Individual form fields can be referenced by the value\
    \ assigned to their **name** attribute and JavaScript can set their values.\n\n\
    In this example the script sets **user** and **city** fields of an **order** form:\n\
    \n```\ndocument.forms.order.user.value = \"Mike\";\ndocument.forms.order.city.value\
    \ = \"New York\";\n```\n\nThese assignments can be expressed more clearly using\
    \ a **with** statement like this:\n\n```\n// set values for user and city fields\
    \ of the order form\nwith (document.forms.order) {\n  user.value = \"Mike\";\n\
    \  city.value = \"New York\";\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_43_0.png)\n\
    \nSee Chapter 10 for more about document objects and properties.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_43_1.png)\n\
    \nThe <script> element that includes the JavaScript file must appear after the\
    \ form in the HTML file - so that the form fields are created before the script\
    \ tries to set their values.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_43_2.png)\n\
    \nwith.js\n\n![](img/5f5106681c8c7072e64c4ea87c891513_43_3.png)"
  merge: -1
