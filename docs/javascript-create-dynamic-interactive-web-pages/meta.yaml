  md: "# Variable scope\n\nThe variables used in the example on the facing page are\
    \ both declared inside a function so they are called local variables. Local variables\
    \ can only be used by the function in which they are declared.\n\nConversely,\
    \ global variables are declared outside functions and can be accessed by any function\
    \ in the same document.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_20_0.png)\n\
    \n```\ncreate a global variable\nvar stored_num;\n\n  a function to call a second\
    \ function\n  and display a returned result\nfunction call_alert( num )\n{\n \
    \ stored_num = num;\n  make_triple();\n  alert(\"The Value Is \" + stored_num\
    \ );\n}\n\n  a function to double a value\n  and return the result to the caller\n\
    function make_triple()\n{\n  stored_num = stored_num + stored_num + stored_num;\n\
    }\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_20_1.png)\n\nAll variables\
    \ may simply be declared without being initialized with a value.\n\nThis example\
    \ passes the argument value to a global variable:\n\n```\n<body onload = \"call_alert(\
    \ 5 )\">\n```\n\nThe second function manipulates the value of the global variable\
    \ before calling alert() to display the new value.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_20_2.png)"
