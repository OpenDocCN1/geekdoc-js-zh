  md: "# Layer attributes\n\nProbably the most important style attributes of a <div>\
    \ element to be used in DHTML is id, top, left, z-index, visibility, color and\
    \ background-color.\n\nThese style attributes can be dynamically changed by assigning\
    \ new values to them with JavaScript.\n\nThis example demonstrates how to access\
    \ each of these attributes by listing the values of a <div> element called lyr:\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_162_0.png)\n\nThe CSS z-index style\
    \ is referenced in JavaScript by the term zIndex. Also the background-color style\
    \ is referenced in JavaScript by the term backgroundColor.\n\n```\na function\
    \ to display the style attributes of a <div>\nfunction get_styles() {\n  var obj\
    \ = document.getElementById(\"lyr\");\n  var str = \"ID: \" + obj.id;\n  str +=\
    \ \"\\nTop: \" + obj.style.top;\n  str += \"\\nZ-Index: \" + obj.style.zIndex;\n\
    \  str += \"\\nVisibility: \" + obj.style.visibility;\n  str += \"\\nBackground:\
    \ \" + obj.style.backgroundColor;\n  str += \"\\nForeground: \" + obj.style.color;\n\
    \  alert(str);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_162_1.png)"
  merge: -1
  pgno: 162
- img_proc: true
  md: "# Toggle visibility\n\nHaving determined how to access layer styles with JavaScript’s\
    \ easy to have some fun with them by letting the JavaScript code dynamically change\
    \ their values.\n\nFor example, changing the visibility style value to hidden\
    \ will cause a layer to disappear from view.\n\nConversely a layer initially created\
    \ with a visibility style value of hidden can be revealed by changing that value\
    \ to visible.\n\nThe following script toggles the visibility of a single layer\
    \ with mouseover and mouseout event-handlers, like this:\n\n```\n<a href=\"javascript:*\"\
    \ onmouseover=\"show_apple()\" onmouseout=\"hide_apple()\">Apple Link</a>\n```\n\
    \nThis script could easily toggle several layers for even greater effect:\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_163_0.png)\n\n```\n// a function to reveal\
    \ a layer\nfunction show_apple() {\n    // reference the layer by id\n    var\
    \ obj = getElementById(\"layer\")\n    // show the layer\n    obj.style.visibility=\
    \ \"visible\"\n}\n\n// a function to hide a layer\nfunction hide_apple() {\n \
    \   // reference the layer by id\n    var obj = getElementById(\"layer\")\n  \
    \  // hide the layer\n    obj.style.visibility= \"hidden\"\n}\n```\n\nThe illustrations\
    \ on the opposite page demonstrate the effect of this script when the user places\
    \ the cursor over, and off, the hyperlink."
  merge: -1
