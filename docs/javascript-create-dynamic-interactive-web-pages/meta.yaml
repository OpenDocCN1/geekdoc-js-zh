- md: "\n## Checkboxes\n\nUnlike radio buttons a checkbox operates independently from\
    \ other checkboxes and so all checkboxes should be uniquely named by their name\
    \ attribute in the HTML code.\n\nEach checkbox creates a document.form object\
    \ with its given name and, like a radio button, has a checked property.\n\nIn\
    \ the following example the HTML onclick attribute of a button calls the JavaScript\
    \ function that sets the checked property of three checkboxes:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_133_0.png)\n\
    \n```javascript\n// a function to check checkboxes\nfunction checkall() {\n  //\
    \ in the form named f\n  with(document.forms.f) {\n    // check checkboxes chk1,\
    \ chk2 and chk3\n    chk1.checked = true;\n    chk2.checked = true;\n    chk3.checked\
    \ = true;\n  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_133_1.png)\n\
    \nOnly checkboxes that are checked will have their name=value pairs sent to the\
    \ server on submission of the form.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_133_2.png)\n\
    \n## Checkbox polling\n\nThe checked property of a checkbox object is most important\
    \ and JavaScript may test for checkboxes then use their associated values.\n\n\
    The example below tests the checked property of all checkboxes and assigns the\
    \ value of those that are checked to a string for display in an alert() dialog\
    \ box:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_134_0.png)\n\n```javascript\n\
    // a function to discover which checkboxes are selected\nfunction checkbox_poll()\
    \ {\n  // create a string for the results\n  var str = \"Color choice is \";\n\
    \n  // loop through all checkboxes\n  for(var i=1; i<4; i++) {\n    if(eval(\"\
    document.forms.f.chk\" + i).checked) {\n      str += eval(\"document.forms.f.chk\"\
    \ + i).value + \" \";\n    }\n  }\n  alert(str);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_134_1.png)\n\
    \nUse the eval() function to combine form property names and numbers.\n\n| Checkbox\
    \ Poll | File Edit View Favorites Help |\n| :--- | :--- |\n| Red | Microsoft Internet\
    \ Explorer |\n| Green | Color choice is Red |\n| Blue | OK |\n| Checkboxes | Done\
    \ |\n\n## Option lists\n\nThe <option> items in a HTML <select> list have a text\
    \ property for each displayed string label and an associated value property. These\
    \ are equivalent to the HTML name and value attributes of each <option> element\
    \ in the <select> list.\n\nThis name=value pair is sent to the server when the\
    \ form is submitted.\n\nAll menu items are stored in the <select> object's options[]\
    \ array and both the text label and its associated value may be dynamically written\
    \ by JavaScript.\n\nThis example dynamically sets the label name and the associated\
    \ value of all option items in a drop-down list. The form has the id of f and\
    \ the <select> element has the id of menu.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_135_0.png)\n\
    \nThe <option> elements must be initially created by the HTML code.\n\n```javascript\n\
    // a function to set the name and values of list options\nfunction set_options()\
    \ {\n  with(document.forms.f.menu) {\n    options[0].text = \"One\"; options[0].value\
    \ = \"1\";\n    options[1].text = \"Two\"; options[1].value = \"2\";\n    options[2].text\
    \ = \"Three\"; options[2].value = \"3\";\n  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_135_1.png)\n\
    \n## Selected index\n\nAn options[] array has a property called selectedIndex\
    \ that contains the index number of the item currently selected.\n\nJavaScript\
    \ can usefully retrieve the value of the current selection for dynamic effects.\n\
    \nThis example extracts the value of the current selection for display in a text\
    \ box. The form has the id of f and the <select> element has the id of city. The\
    \ function is called by the onclick attribute of the button when the user clicks\
    \ it.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_136_0.png)\n\n> HOT TIP\nThis\
    \ example could use a with statement to make the script more concise.\n\n```javascript\n\
    // a function to get the selected item in a list\nfunction get_selected() {\n\
    \  // a variable to store the selected index number\n  var pick = document.forms.f.city.selectedIndex;\n\
    \n  // assign the value of the selected element\n  // to a text field with the\
    \ id of txt1\n  document.forms.f.txt.value =\n  document.forms.f.city.options[pick].value;\n\
    }\n```\n\n## Selected Option\n\n| File Edit View Favorites Tools Help |\n| :---\
    \ | :--- |\n| New York v | Show Selected: New York |\n| London | |\n| New York\
    \ | |\n| Paris | |\n| Sydney | |\n\n## Text areas\n\nA HTML <textarea> element\
    \ is rather like a large scrolling text input whose value can be read and written\
    \ by JavaScript.\n\n### JavaScript in easy\n\nThe example below writes content\
    \ to a text area by assigning a string to its value property after the document\
    \ is loaded.\n\nThe function to assign the string is designated as the document’s\
    \ onload handler by the script. Care is needed when using this approach – if the\
    \ script is included in the <head> section of the HTML document an onload attribute\
    \ in the <body> tag may overwrite it.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_137_0.png)\n\
    \nIt is often best to call onload functions using the onload attribute of the\
    \ HTML <body> element.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_137_1.png)\n\
    \n```javascript\n// a function to write text content in a text area\nfunction\
    \ write_text() {\n  // assign a string to the textarea field\n  document.forms.f.txtarea.value\
    \ = \"Computers in the future may perhaps weigh 1 ton. Popular forecasting the\
    \ development of technology\";\n\n  // define the onload function\n  window.onload\
    \ = write_text;\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_137_2.png)\n\
    \n## Clear form\n\nThe reset() method of a form will reset all the values within\
    \ the form and update the inputs to their original state – just if the user had\
    \ pushed a reset button. Careful use should be made of the reset() method to avoid\
    \ the need for the user to input data repeatedly. The example below uses the javascript\
    \ protocol to call the intrinsic reset() function. This allows the user to click\
    \ an image to reset the form, rather than a traditional reset button. Some short\
    \ pieces of JavaScript can be inserted into HTML like this – without the need\
    \ for any other script: See page 138 for an example of a reset button using the\
    \ onreset event.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_138_0.png)\n\n```html\n\
    <form id=\"f\" method=\"post\" action=\"\">\n  <input type=\"checkbox\" name=\"\
    chk1\" value=\"fun\"/>\n  Fun JavaScript<br/>\n  <input type=\"checkbox\" name=\"\
    chk2\" value=\"great\"/>\n  Great JavaScript<br/>\n  <input type=\"checkbox\"\
    \ name=\"chk3\" value=\"easy\"/>\n  Easy JavaScript<br/>\n  <img src=\"reset.gif\"\
    \ alt=\"\" onclick=\"javascript:document.forms.reset()\"/>\n</form>\n```\n\nreset.html\
    \ (part of)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_138_1.png)\n\nSee page\
    \ 160 for more on the javascript protocol.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_138_2.png)\n\
    \n## Send form\n\nWhen a form is submitted to the server the values assigned to\
    \ the **name** and **value** attributes of each form element are sent as **name=value**\
    \ pairs.\n\nThe **submit()** method of the form object can be used to send the\
    \ form to the server in exactly the same way as if the user had pushed an HTML\
    \ submit button.\n\nThe example below uses the **javascript:** protocol to call\
    \ the intrinsic JavaScript **submit()** function. This allows the user to click\
    \ an image to submit form, rather than a traditional submit button.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_139_0.png)\n\
    \n```html\n<form id=\"f\" method=\"post\" action=\"parser.cgi\">\n  <p>\n    <input\
    \ type=\"checkbox\" name=\"chk1\" value=\"fun\"/>\n    JavaScript<br/>\n    <input\
    \ type=\"checkbox\" name=\"chk2\" value=\"great\"/>\n    Great JavaScript<br/>\n\
    \    <input type=\"checkbox\" name=\"chk3\" value=\"easy\"/>\n    Easy JavaScript<br/>\n\
    \    <img src=\"submit.gif\" alt=\"\" onclick=\"javascript:document.forms.f.submit()\"\
    />\n  </p>\n</form>\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_139_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_139_2.png)\n\n## Amend form\n\nThe\
    \ onsubmit property of a form object can be used to execute a JavaScript function\
    \ just before the form data is sent to the server. This may be when the user pushes\
    \ a HTML submit button, or when the form is sent with the form object's submit()\
    \ method.\n\nThe function will be executed then the form will be submitted to\
    \ the server. Usefully, this allows JavaScript to amend the form so that the name=value\
    \ pairs can be better used by a receiving CGI script.\n\nIn the example below\
    \ the HTML onsubmit attribute of the <form> element calls the add_zeros() function\
    \ just before the form data is sent to the server. This function ensures that\
    \ any text input element gets a zero value assigned to it:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_140_0.png)\n\
    \n```javascript\n// a function to assign zeros to empty text fields\nfunction\
    \ add_zeros() {\n  with(document.forms.f) {\n    if(txt1.value == \"\") txt1.value\
    \ = \"0\";\n    if(txt2.value == \"\") txt2.value = \"0\";\n    if(txt3.value\
    \ == \"\") txt3.value = \"0\";\n  }\n}\n```\n"
  mdcn: "\n\n## 复选框 (Checkboxes)\n\n与单选按钮不同，复选框的操作与其他复选框独立运行，因此所有复选框都应该通过其 HTML 代码中的\
    \ `name` 属性进行唯一命名。\n\n每个复选框都会创建一个带有给定名称的 `document.form` 对象，并且像单选按钮一样有一个 `checked`\
    \ 属性。\n\n在下面的示例中，按钮的 HTML `onclick` 属性调用了 JavaScript 函数，该函数设置三个复选框的 `checked`\
    \ 属性：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_133_0.png)\n\n```javascript\n\
    // 全选框的函数\nfunction checkall() {\n  // 在名为 f 的表单中\n  with(document.forms.f) {\n\
    \    // 选中复选框 chk1, chk2 和 chk3\n    chk1.checked = true;\n    chk2.checked =\
    \ true;\n    chk3.checked = true;\n  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_133_1.png)\n\
    \n只有被选中的复选框在提交表单时，其 `name=value` 对才会被发送到服务器。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_133_2.png)\n\
    \n## 复选框轮 (Checkbox polling)\n\n复选框对象的 `checked` 属性最重要的，JavaScript 可能会测试复选框并使用它们关联的值。\n\
    \n下面的示例测试了所有复选框的 `checked` 属性，并将选中项的值赋值给字符串，以便在 `alert()` 对话框中显示：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_134_0.png)\n\
    \n```javascript\n// 获取哪些复选框被选中的函数\nfunction checkbox_poll() {\n  // 为结果创建一个字符串\n\
    \  var str = \"Color choice is \";\n\n  // 遍历所有复选框\n  for(var i=1; i<4; i++) {\n\
    \    if(eval(\"document.forms.f.chk\" + i).checked) {\n      str += eval(\"document.forms.f.chk\"\
    \ + i).value + \" \";\n    }\n  }\n  alert(str);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_134_1.png)\n\
    \n使用 `eval()` 函数来组合表单属性名和数字。\n\n| 复选框轮 | 文件 编辑视图 收藏 帮助 |\n| :--- | :--- |\n| 红色\
    \ | Microsoft Internet Explorer |\n| 绿色 | 颜色是红色 |\n| 蓝色 | 好 |\n| 复选框 | 完成 |\n\n\
    ## 选项列表 (Option lists)\n\n HTML `<select>` 列表中的 `<option>` 项目对每个显示的字符串标签都有一个 `text`\
    \ 属性和一个关联的 `value` 属性。这些等同于 `<select>` 列表中每个 `<option>` 元素的 HTML `name` 和 `value`\
    \ 属性。\n\n当提交表单时，此 `name=value` 对会被发送到服务器。\n\n所有的菜单项存储在 `<select>` 对象的 `options[]`\
    \ 数组中，文本标签及其关联的值都可以由 JavaScript 动态写入。\n\n此示例动态设置了下拉列表中所有选项项目的标签名称和关联值。表单的 `id`\
    \ 为 `f`，`<select>` 元素的 `id` 为 `menu`。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_135_0.png)\n\
    \n`<option>` 元素必须由 HTML 代码初始创建。\n\n```javascript\n// 设置列表选项名称和值的函数\nfunction set_options()\
    \ {\n  with(document.forms.f.menu) {\n    options[0].text = \"One\"; options[0].value\
    \ = \"1\";\n    options[1].text = \"Two\"; options[1].value = \"2\";\n    options[2].text\
    \ = \"Three\"; options[2].value = \"3\";\n  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_135_1.png)\n\
    \n## 选中索引 (Selected index)\n\n`options[]` 数组有一个名为 `selectedIndex` 的属性，它包含当前选中项目的索引数字。\n\
    \nJavaScript 可以方便地获取当前选择的值来实现动态效果。\n\n此示例提取了当前选择的值显示在文本框中。表单的 `id` 为 `f`，`<select>`\
    \ 元素的 `id` 为 `city`。当用户点击按钮时，通过按钮的 `onclick` 属性调用该函数。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_136_0.png)\n\
    \n> 热贴士\n> 此示例可以使用 `with` 语句使脚本更加简洁。\n\n```javascript\n// 获取列表中选中项的函数\nfunction\
    \ get_selected() {\n  // 用于存储选中索引号的变量\n  var pick = document.forms.f.city.selectedIndex;\n\
    \n  // 将选中元素的值赋值\n  // 给 id 为 txt1 的文本字段\n  document.forms.f.txt.value =\n  document.forms.f.city.options[pick].value;\n\
    }\n```\n\n## 选中选项\n\n| 文件 编辑 视图 收藏 帮助 |\n| :--- | :--- |\n| 纽约 | 显示选中：纽约 |\n|\
    \ 伦敦 | |\n| 纽约 | |\n| 巴黎 | |\n| 悉尼 | |\n\n## 文本区域 (Text areas)\n\n HTML `<textarea>`\
    \ 元素类似于滚动文本输入，其值可以被 JavaScript 读取和写入。\n\n### JavaScript 简单\n\n下面的示例在文档加载后通过为其\
    \ `value` 属性赋值字符串向文本区域写入内容。使用这种方法时需要注意——如果脚本包含在 HTML 的 `<head>` 部分，`<body>` 标签中的\
    \ `onload` 属性可能会覆盖它。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_137_0.png)\n\n\
    通常最好使用 HTML `<body>` 元素的 `onload` 属性来调用 `onload` 函数。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_137_1.png)\n\
    \n```javascript\n// 在文本区域写入文本的函数\nfunction write_text() {\n  // 为 textarea 赋值字符串\n\
    \  document.forms.f.txtarea.value = \"Computers in the future may weigh 1 ton.\
    \ forecasting the development of technology\";\n\n  // 定义 onload 函数\n  window.onload\
    \ = write_text;\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_137_2.png)\n\
    \n## 清空表单 (Clear form)\n\n表的 `reset()` 方法将重置表单内的所有值并恢复原始状态——就像用户点击了重置按钮一样。应该谨慎使用\
    \ `reset()` 方法以避免用户重复输入。下面的示例使用 `javascript` 协议调用内置的 `reset()` 函数。这允许用户点击图像来重置表单，而不是使用传统的重置按钮。可以将一些短小的\
    \ JavaScript 插入此类 HTML 中——不需要任何其他脚本：参见第 138 页使用 `onreset` 事件的重置按钮示例。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_138_0.png)\n\
    \n```html\n<form id=\"f\" method=\"post\" action=\"\">\n  <input type=\"checkbox\"\
    \ name=\"chk1\" value=\"fun\"/>\n  Fun JavaScript<br/>\n  <input type=\"checkbox\"\
    \ name=\"chk2\" value=\"great\"/>\n  Great JavaScript<br/>\n  <input type=\"checkbox\"\
    \ name=\"chk3\" value=\"easy\"/>\n  Easy JavaScript<br/>\n  <img src=\"reset.gif\"\
    \ alt=\"\" onclick=\"javascript:document.forms.reset()\"/>\n</form>\n```\n\nreset.html\
    \ (部分内容)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_138_1.png)\n\n关于 `javascript`\
    \ 协议的更多信息请参见第 160 页。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_138_2.png)\n\n\
    ## 发送表单 (Send form)\n\n当表单提交到服务器时，分配给每个表单元素的 `name` 和 `value` 属性的值将 `name=value`\
    \ 对的形式发送。\n\n表的 `submit()` 方法可将表单发送到服务器，方式与用户点击 HTML 提交按钮完全相同。\n\n下面的示例使用 `javascript:`\
    \ 协议调用内置的 JavaScript `submit()` 函数。这允许用户点击图像提交表单，而不是使用传统的提交按钮。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_139_0.png)\n\
    \n```html\n<form id=\"f\" method=\"post\" action=\"parser.cgi\">\n  <p>\n    <input\
    \ type=\"checkbox\" name=\"chk1\" value=\"fun\"/>\n    JavaScript<br/>\n    <input\
    \ type=\"checkbox\" name=\"chk2\" value=\"great\"/>\n    Great JavaScript<br/>\n\
    \    <input type=\"checkbox\" name=\"chk3\" value=\"easy\"/>\n    Easy JavaScript<br/>\n\
    \    <img src=\"submit.gif\" alt=\"\" onclick=\"javascript:document.forms.f.submit()\"\
    />\n  </p>\n</form>\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_139_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_139_2.png)\n\n## 修改表单 (Amend form)\n\
    \n表单对象的 `onsubmit` 属性可以用于表单数据发送到服务器之前执行 JavaScript 函数。这可能发生在用户点击 HTML 提交按钮时，或者使用表单对象的\
    \ `submit()` 方法发送表单时。\n\n函数将先执行，然后表单将提交到服务器。很有用的是，这允许 JavaScript 修改表单，以便接收端 CGI\
    \ 脚本更好地使用 `name=value` 对。\n\n在下面的示例中，`<form>` 元素的 HTML `onsubmit` 属性在表单数据发送到服务器之前调用\
    \ `add_zeros()` 函数。该函数确保任何文本输入元素都获得一个零值：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_140_0.png)\n\
    \n```javascript\n// 给空文本字段赋值零的函数\nfunction add_zeros() {\n  with(document.forms.f)\
    \ {\n    if(txt1.value == \"\") txt1.value = \"0\";\n    if(txt2.value == \"\"\
    ) txt2.value = \"0\";\n    if(txt3.value == \"\") txt3.value = \"0\";\n  }\n}\n\
    ```\n\n"
