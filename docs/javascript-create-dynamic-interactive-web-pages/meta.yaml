  md: "# Dynamic content\n\nJavaScript can write content onto a layer without affecting\
    \ the elements elsewhere on the page.\n\nThe position of the layer will remain\
    \ unaltered but the height of the layer will be automatically increased if the\
    \ content will not fit into the existing layer size.\n\nAlso text will automatically\
    \ wrap intelligently at the layer border words will not be split.\n\nThe JavaScript\
    \ example for this feature will create a layer, then dynamically the user-entered\
    \ text onto the layer when the user pushes the input button.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_165_0.png)\n\
    \nAlthough this example uses text from user input JavaScript could write layer\
    \ from any function call.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_165_1.png)\n\
    \nwrite-js\n\n```\ncreate a <div>id='lyr' style='position:absolute;top:90px;left:10px;width:200px;height:10px;z-index:10;background-color:orange;'></div>\n\
    ```\n\n```\n// function to write a user-entered string on a layer\nfunction {\n\
    \  // get the string entry\n  var str = document.forms.f.txt.value;\n\n  // reference\
    \ the layer by id\n  var obj = document.getElementById(\"lyr\");\n\n  // open\
    \ the layer document\n  obj.document.open();\n\n  // write the string\n  obj.document.write(str);\n\
    \n  // close the layer document\n  obj.document.close();\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_165_2.png)\n\
    \nInsert the <script> element to include JavaScripts that write layers within\
    \ the body section of the HTML document.\n\nThe illustrations on the facing page\
    \ demonstrate the effect of this script when the user enters a string into the\
    \ text field then clicks the push button."
