  md: "# For loops\n\nThe for loop is probably the most frequently used type of loop\
    \ in JavaScript and has this syntax:\n\n```\nfor ( initializer , test , increment\
    \ ) statement/s ;\n```\n\nThe initializer is used to set the start value for the\
    \ counter of the number of loop iterations. A variable may be declared here for\
    \ this purpose and it is traditional to name it i.\n\nAt each pass of the loop\
    \ a boolean condition is tested and the next iteration of the loop will only run\
    \ if the condition returns true. If the test returns false then the loop will\
    \ end.\n\nWith every iteration the counter is incremented then the loop will execute\
    \ the code in the statement. Multiple statements can be executed if they are contained\
    \ by curly braces in a statement block.\n\nThe following example makes five iterations\
    \ and changes the assigned value of two variables at each pass:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_37_0.png)\n\
    \n```\nvar a = 0, b = 0;\n// initialize counter at zero then loop until it hits\
    \ 5\nfor ( var i = 0; i < 5; i++) {\n  // increment variable values on each iteration\n\
    \  a += 10; b += 5;\n}\n// display the final values after the loop ends...\nalert(\"\
    FOR LOOP\\n A is \" + a + \"... B is \" + b \");\n```\n\n> HOT TIP\nA loop can\
    \ also count down - decrementing the counter at each iteration.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_37_1.png)"
  merge: -1
  pgno: 37
- img_proc: true
  md: "# The for - in loop\n\nThe for-in loop has a special use to enumerate all the\
    \ variables for\nproperties contained within an object.\n\nThis loop is seldom\
    \ used in regular JavaScript but is included here\nbecause it can reveal the properties\
    \ available for manipulation\nwithin a Web browser.\n\nThe following example reveals\
    \ a tantalizing glimpse of the\nproperties available within the window object\
    \ of the Microsoft\nInternet Explorer 6.0 Web browser:\n\n```\nvar i = 0; a =\
    \ \"\"\n\n// list all window properties in a variable\nfor ( property in window\
    \ ) {\n  a += property + \"...\";\n}\n// display the window properties list\n\
    alert(a);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_38_0.png)\n\nThe properties\n\
    revealed will vary\nfor each browser\nand version.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_38_1.png)\n\
    \nThe properties\nrevealed with this\nscript are part of\nthe Document\nObject\
    \ Model\n(DOM) that is described in\nchapter 8.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_38_2.png)\n\
    \n3. Making statements"
  merge: -1
