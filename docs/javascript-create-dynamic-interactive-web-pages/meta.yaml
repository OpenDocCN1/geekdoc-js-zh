    # Including JavaScript in HTML


    In order to include JavaScript in a Web document a script block can be defined
    within the HTML code.


    The script block may be defined anywhere within the HTML code although the usual
    place is inside the head section of the document, between the `&lt;head&gt;` and
    `&lt;/head&gt;` tags.


    When a browser loads a document it reads (parses) sequentially. So placing the
    script block in the head of the document ensures that the JavaScript code is parsed
    before the rest of the HTML code and document''s body content.


    A script block looks like this:


    ```

    <script type = "text/javascript">

    n</script>

    ```


    The actual code could be added between the HTML `&lt;script&gt;` and `&lt;/script&gt;`
    tags.


    Alternatively, JavaScript code may be separated from the HTML code by writing
    all the JavaScript code inside a JavaScript file. This is simply a text document,
    that is saved with a `.js` extension, and contains no HTML tags whatsoever.


    The script reference should still be placed in the document section with an `src`
    attribute pointing the browser to the URL address of JavaScript file, like in
    this example:


    ```

    <script type = "text/javascript" src = "mycode.js">

    </script>

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_10_0.png)


    Notice that the `&lt;script&gt;` closing tag is still required.


    This is a better method than writing the code in a script block within the HTML
    document as it makes the code easier to maintain, avoids conflicts between JavaScript
    and XML, and allows the JavaScript code to be accessible to several HTML documents.


    All the JavaScript examples listed in this book are written in JavaScript files
    that are named as their HTML counterpart. For instance, `hello.html` calls upon
    the JavaScript code in `hello.js`.'
