  md: '# String length


    A string in JavaScript is simply zero or more characters enclosed within quotes,
    so these are all strings:


    ```

    var str1 = "My First String";

    var str2 = "";

    var str3 = "2";

    var str4 = "null";

    ```


    The empty quotes in **str2** define the variable as being a **string** data type
    regardless of the empty string value. The numeric value assigned to **str3** is
    automatically converted to a **string** type when enclosed in quotes and the JavaScript
    **null** keyword is just a string literal when enclosed by quotes.


    ![](img/5f5106681c8c7072e64c4ea87c891513_77_0.png)


    Essentially a string is a collection of characters, each character containing
    its own data, just like elements in a defined array.


    It is logical to regard a string as an array of characters and apply array characteristics
    when using strings.


    The example below parallels the **array.length** property with the **string.length**
    property:


    ```

    // create and initialize a string variable

    var a = "JavaScript Strings";n

    // display the length of the string

    alert("String length is " + a.length);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_77_1.png)'
  merge: -1
