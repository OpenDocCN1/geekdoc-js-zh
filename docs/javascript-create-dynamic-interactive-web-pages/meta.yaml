  - "[PAGE 118]\n\n# Rollover\n\nIf an image has been named in the HTML code, by assigning\
    \ a value to the <img> tag's id attribute, it may also be addressed by this name\
    \ in JavaScript. The script is document.images.imgname – an image named click\
    \ is addressed as document.images.click.\n\nAssigning a new value to the src property\
    \ of an image causes the browser to replace the image. Typically this is seen\
    \ in rollovers when the cursor is over an image it is replaced by a second image,\
    \ the original image is returned when the cursor moves away. The HTML <img> tag\
    \ must include an onmouseover attribute and onmouseout attribute to create a rollover\
    \ effect, like this:\n\n```\n<img id=\"click\" src=\"off.gif\" alt=\"\"\nonmouseover=\"\
    swap(1)\" onmouseout=\"swap(0)\" />\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_118_0.png)\n\
    \nThese attributes call the JavaScript image-swapping function whenever the onmouseover\
    \ and onmouseout events occur:\n\n```\nfunction swap(n)\n{\n  if (n == 0 )document.images.click.src\
    \ = \"off.gif\";\n  if (n == 1 )document.images.click.src = \"over.gif\";\n}\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_118_1.png)\n\n| Rollover Example\
    \ |\n| File | Edit | View | Favorites | Tools | Help |\n|---|---|---|---|---|---|\n\
    | Click Here |\n| Done | Local intranet |\n\n![](img/5f5106681c8c7072e64c4ea87c891513_118_2.png)\n\
    \n| Rollover Example |\n| File | Edit | View | Favorites | Tools | Help |\n|---|---|---|---|---|---|\n\
    | Click Here |\n| Done | Local intranet |\n\n![](img/5f5106681c8c7072e64c4ea87c891513_118_3.png)"
- md: "\n# Dynamic content\n\nThe window.document.open() method opens a new HTML document\
    \ which can be written to using the familiar method window.document.write() to\
    \ create dynamic content.\n\nWhen the content has been written the document stream\
    \ should be closed by the window.document.close() method.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_119_0.png)\n\
    \nThe example below builds on the pop-up window example in the last chapter by\
    \ writing the content from JavaScript instead of simply loading an existing HTML\
    \ document.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_119_1.png)\n\n```\n//\
    \ function to create a dynamic popup window\nfunction popup() {\n  // create the\
    \ popup window\n  var popwindow =\n  window.open(\"\", \"\", \"top=40,left=30,width=250,height=125\"\
    );\n  // open the pop-up window HTML document\n  popwindow.document.open();\n\
    \  // write content in the pop-up window\n  popwindow.document.write(\"<title>Pop-up</title>\"\
    );\n  popwindow.document.write(\"Dynamic Pop-up Page<br/>\");\n  popwindow.document.write(\"\
    <img src='dex.gif' alt='html document'>\");\n  // remember to finally close the\
    \ HTML document\n  popwindow.document.close();\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_119_2.png)\n\
    \n| Dynamic Pop-up Example | | |\n|---|---|---|\n| File Edit View Favorites Help\
    \ | | |\n| Pop-up | | |\n| Dynamic Pop-up Page | | |\n| Done | Local intranet\
    \ | |\n\n# Last modified\n\nThe document.lastModified object can provide date\
    \ and time information of when a Web page was last updated. This data is usually\
    \ supplied to document.lastModified from the HTTP file header that is sent by\
    \ the Web server. In some instances the Web server may omit this information so\
    \ document.lastModified will, in those cases, return zero.\n\nTypically this data\
    \ is used to indicate how recently a Web page has been updated so the user knows\
    \ how current information on that page may be. Usually this information is displayed\
    \ at the bottom of a page in a smaller font than the general page text.\n\nThe\
    \ example that follows first tests that a date has been supplied to document.lastModified\
    \ then writes the data into the HTML document:\n\n```\n// check that there is\
    \ a lastModified date\nif( Date.parse(document.lastModified) != 0 )\n```\n\n```javascript\n\
    // if so, write a message stating what that date is\ndocument.write\n(\"Page last\
    \ updated: \" + document.lastModified );\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_120_0.png)\n\
    \nThe <script> block to include this script code would normally be situated at\
    \ the very end of the HTML document <body> section.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_120_1.png)\n\
    \n| Last-Modified Example |\n| File | Edit | View | Favorites | Tools | Help |\n\
    |---|---|---|---|---|---|\n| PERL is a general-purpose programming language invented\
    \ in 1987 by Larry Wall. Practical Enquiry and Reporting Language (PERL) has over\
    \ one million users worldwide, and is the principal language for server-side scripting.\
    \ It is for many, the preferred language for Wide Web development. | |\n| Page\
    \ last updated: 04/06/2005 12:52:53 | |\n\n![](img/5f5106681c8c7072e64c4ea87c891513_120_2.png)\n\
    \n# XYZ coordinates\n\nPhysical position of content in a display window can be\
    \ referred to using coordinates called X, Y and Z.\n\nThe X coordinate specifies\
    \ the distance in pixels from the extreme left edge of the window.\n\nThe Y coordinate\
    \ specifies the distance in pixels from the extreme top edge of the window.\n\n\
    The Z coordinate specifies the stacked position, by index number, of layers above\
    \ the bottom window level:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_121_0.png)\n\
    \n> HOT TIP To differentiate the coordinates remember that a \"cross\" (X) means\
    \ \"across\".\n\nThe X coordinate at the left edge of the window is zero and the\
    \ Y coordinate at the top edge of the window is also zero.\n\nA position where\
    \ X=50 and Y=30 would pinpoint a location 50 pixels from the left edge and 30\
    \ pixels from the top edge.\n\nThe Z coordinate of the bottom window level has\
    \ an index value of zero. Layers may be placed over this level, like transparent\
    \ sheets, and are given unique Z-index values.\n\nA window may have many layers\
    \ but the top layer will always have the highest Z-index value. Each successive\
    \ layer below that will have a decreasing lower Z-index value.\n\n# Dynamic layers\n\
    \nJavaScript can create layers dynamically by writing the necessary HTML code\
    \ and stylesheet rules into the body section of the HTML document. This allows\
    \ control over the position and appearance of each layer.\n\nMost importantly,\
    \ if layers overlap their stacking order can be determined by the value assigned\
    \ to their z-index property – the higher the number, the higher the layer will\
    \ be in the stack.\n\nThe example below emulates the opposite by dynamically creating\
    \ two overlapping layers. The second (yellow) layer is higher in the stack than\
    \ the first (purple) layer. If their z-index values were reversed, so layer 1\
    \ was 20 and layer 2 was 10, the purple layer would overlap the yellow layer.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_122_0.png)\n\n```javascript\n// write\
    \ a layer at z-index 10\ndocument.write(\"<div id='layer1'\nstyle='position:absolute;\
    \ top:20px; left:20px;\nwidth:80px; height:80px; background-color:purple;\ncolor:white;\
    \ z-index:10'>Layer #1</div>\");\n\n// write a layer at z-index 20\ndocument.write(\"\
    <div id='layer2'\nstyle='position:absolute; top:40px; left:40px;\nwidth:80px;\
    \ height:80px; background-color:yellow;\nz-index:20'>Layer #2</div>\");\n```\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_122_1.png)\n\n# Transparent layers\n\
    \nUnless specified otherwise, a layer will usually be created with the same background\
    \ as the document body – so will appear to be transparent. Alternatively it can\
    \ be explicitly set to be transparent by setting its background-color property\
    \ to transparent.\n\nThe transparency of layers is particularly important when\
    \ they contain GIF images of irregular shapes that have transparent parts. On\
    \ a transparent layer these images appear to float over the document background.\
    \ Several images can appear in close proximity, even when layers overlap, by allocating\
    \ different z-index values to determine their stacking order.\n\nThe script below\
    \ creates two such layers – only one is transparent to illustrate the difference\
    \ in how each image appears.\n\n```javascript\n// create a transparent layer\n\
    document.write('<div id='transparent-layer' style='position: absolute; top:20px;\
    \ left:230px; width:75px; height:110px; background-color:transparent'><img src='deed.gif'\
    \ alt=''></div>');\n```\n\n```javascript\n// create a white layer\ndocument.write('<div\
    \ id='transparent-layer' style='position: absolute; top:20px; left:315px; width:75px;\
    \ height:110px; background-color:white'><img src='deed.gif' alt=''></div>');\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_123_0.png)\n\nThe image used in\
    \ this example is in the GIF format and has its green color set to transparent.\
    \ The image actually looks like this:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_123_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_123_2.png)\n\n# Form properties\n\n\
    This chapter illustrates how JavaScript can manipulate user input from HTML form\
    \ elements. Examples are given for all common form input elements including radio\
    \ buttons and selection boxes together with email address validation.\n\n- The\
    \ form object | 124\n- Form elements | 125\n- Click buttons | 126\n- Toggle value\
    \ | 127\n- Text boxes | 128\n- Password boxes | 129\n- Radio buttons | 130\n-\
    \ Radio polling | 131\n- Checkboxes | 132\n- Checkbox polling | 133\n- Option\
    \ lists | 134\n- Selected index | 135\n- Text areas | 136\n- Clear form | 137\n\
    - Send form | 138\n- Amend form | 139\n- Email address validation | 140\n\n# The\
    \ form object\n\nThe window.document.forms object contains an array of all the\
    \ forms in an HTML document, indexed in the order in which they appear in the\
    \ HTML code.\n\nFor instance, window.document.forms[0] addresses the first form\
    \ to appear in the HTML code of a Web page.\n\nIf the id attribute of the <form>\
    \ element has been assigned a value then the form can be addressed by name. So\
    \ a form f can be simply addressed as document.forms.f.\n\nAll other attributes\
    \ assigned in the <form> tag are also accessible properties of that form object.\
    \ For instance, with this form...\n\n![](img/5f5106681c8c7072e64c4ea87c891513_125_0.png)\n\
    \n```html\n<form id = \"f\" method = \"post\" action = \"mailto:a@b.com\" enctype\
    \ = \"text/plain\">\n```\n\n...the following JavaScript function can be called\
    \ from the HTML <body>'s onload attribute to reveal the form properties:\n\n```javascript\n\
    function form_info() {\n // get the form name\n  var msg = \"Name: \" + document.forms.f.id;\n\
    \n // get the form method, action and encoding type\n  msg += \"\\nMethod: \"\
    \ + document.forms.f.method;\n  msg += \"\\nAction: \" + document.forms.f.action;\n\
    \  msg += \"\\nEnctype: \" + document.forms.f.encoding;\n  alert(msg);\n}\n```\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_125_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_125_2.png)\n"
  mdcn: "\n\n# 动态内容\n\n`window.document.open()` 方法打开一个新的 HTML 文档，可以使用熟悉的 `window.document.write()`\
    \ 方法对其进行写入，以创建动态内容。\n\n当内容写入后，应该通过 `window.document.close()` 方法关闭文档流。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_119_0.png)\n\
    \n下面的示例基于上一章节的弹出窗口示例，通过从 JavaScript 内容而不是简单地加载现有的 HTML 文档。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_119_1.png)\n\
    \n```\n// 创建动态弹出窗口的函数\nfunction popup() {\n  // 创建弹出窗口\n  var popwindow =\n  window.open(\"\
    \", \"\", \"top=40,left=30,width=250,height=125\");\n  // 打开弹出窗口的 HTML 文档\n  popwindow.document.open();\n\
    \  // 在弹出窗口中写入内容\n  popwindow.document.write(\"<title>Pop-up</title>\");\n  popwindow.document.write(\"\
    Dynamic Pop-up Page<br/>\");\n  popwindow.document.write(\"<img src='dex.gif'\
    \ alt='html document'>\");\n  // 记得最后关闭 HTML 文档\n  popwindow.document.close();\n\
    }\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_119_2.png)\n\n| 动态弹出窗口示例 |\
    \ | |\n|---|---|---|\n| 文件 编辑 查看 收藏 帮助 | | |\n| 弹出窗口 | | |\n| 动态弹出页面 | | |\n|\
    \ 完成 | 本地内网 | |\n\n# 最后修改时间\n\n`document.lastModified` 对象可以提供 Web 页面最后更新的日期和时间。这些数据通常由\
    \ Web 服务器发送的 HTTP 文件头提供给 `document.lastModified`。在某些情况下，Web 服务器可能会省略此信息，在这种情况下\
    \ `document.lastModified` 将返回零。\n\n通常，此数据用于指示 Web 页面最近更新更新，以便使用户知道该页面上的信息有多新。通常这些信息显示在页面的底部，字体比页面正文较小。\n\
    \n接下来的示例首先测试 `document.lastModified` 是否已提供日期，然后将数据写入 HTML 文档：\n\n```\n// 检查是否存在\
    \ lastModified 日期\nif( Date.parse(document.lastModified) != 0 )\n```\n\n```javascript\n\
    // 如果存在，则写一条消息说明该日期是什么\ndocument.write\n(\"页面最后更新时间: \" + document.lastModified\
    \ );\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_120_0.png)\n\n包含此脚本代码的 `<script>`\
    \ 块通常位于 HTML 文档 `<body>` 部分的最末尾。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_120_1.png)\n\
