    \ —— 因此它们初始时是不可见的。将光标置在图像的活动区域上会触发 `onmouseover` 事件调用 `talk()` 函数。该函数调用传递一个字符串参数来标识是哪个活动区域的调用者。这决定了要操作哪一个层对象。\n\
    \n`talk()` 函数将相应层对象的 `visibility` 样式设置为 `visible` —— 使其变为可见。光标离开活动区域会触发 `onmouseout`\
    \ 事件，再次传递一个字符串标识符。这再次将相应层对象的 `visibility` 样式设置为 `hidden` —— 使其变为不可见。\n\n这种动态脚本可以非常有效地用于导航菜单的悬停效果。\n\
