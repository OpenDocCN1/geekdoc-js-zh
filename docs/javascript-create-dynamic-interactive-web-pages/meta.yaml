  - "[PAGE 141]\n\n# Email address validation\n\nThe value of form elements may be\
    \ validated by correct format\nbefore the form is submitted.\n\nIn the following\
    \ example JavaScript tests the format of a text input\nstring for the presence\
    \ of @ and dot characters and will only\nsubmit the form if the email address\
    \ validation appears correct:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_141_0.png)\n\
    \n```\na function to validate an email address\nfunction send_if_valid() {\n \
    \ if (document.forms.f.email.value.indexOf(\"@\") == -1)\n    fail(\"No @ in address\"\
    );\n  else\n    var adr = document.forms.f.email.value.split(\"@\\n    if (adr[0].length\
    \ < 1) fail(\"User address absent\");\n    else if (adr[1].indexOf(\".\") == -1)\
    \ fail(\"No dot\");\n    else if (adr[1].length < 3) fail(\"Domain incorrect\"\
    );\n    else document.forms.f.submit();\n}\n\na function to display an error message\n\
    function fail(msg) {\n  alert(\"Email Address Error:\\n\" + msg);\n}\n```\n\n\
    The function\nsend_if_valid() is\ncalled from the\nHTML onclick\nattribute of\
    \ the\nbutton in this example.\n\n| Email Address Validation |\n| File Edit View\
    \ Favorites Tools Help |\n| Enter Email Address: |\n| mike@noplace [Submit Form]\
    \ |\n| Microsoft Internet Explorer [Email Address Error: No dot [OK]] | |\n| Done\
