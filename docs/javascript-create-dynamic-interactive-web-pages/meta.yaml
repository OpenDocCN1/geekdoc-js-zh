  - "[PAGE 149]\n\n# Key down and key up\n\nA KeyDown event occurs when the user presses\
    \ a keyboard key button and a Key event occurs when it is released. Typically\
    \ these are used together so that a single key depression will use two event-handlers.\n\
    \nThis example swaps an image and changes the value of a text box when a keyboard\
    \ key button is pressed and reverts both to their original state when the key\
    \ button is released:\n\n```\nNetscape/Mozilla capture events instruction\nif\
    \ (navigator.appName == \"Netscape\") \nwindow.captureEvents ( Event.KEYDOWN,\
    \ Event.KEYUP );\n```\n\na function to react to KEYDOWN events\n\n```\nfunction\
    \ isdown()\n{\ndocument.images.bulb.src = \"bulbon.gif\";\ndocument.forms.f.txt.value\
    \ = \"Key is Down\";\n}\n```\n\na function to react to KEYUP events\n\n```\nfunction\
    \ isup()\n{\ndocument.images.bulb.src = \"bulboff.gif\";\ndocument.forms.f.txt.value\
    \ = \"Key is Up\";\n}\n```\n\ndefine the event-handlers\n\n```\ndocument.onkeydown\
    \ = isdown;\ndocument.onkeyup = isup;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_149_0.png)\n\
    \nNotice how the first two lines of this script capture both KeyDown and KeyUp\
    \ events for Netscape/Mozilla browsers.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_149_1.png)\n\
    \n| KeyUp and KeyDown |\n| File | Edit | View | Favorites |\n| Key is Down |\n\
    | Done |\n\n| KeyUp and KeyDown |\n| File | Edit | View | Favorites |\n| Key is\
    \ Up |\n| Done |\n\n148 | JavaScript in easy steps"
  - "[PAGE 150]\n\n# Key codes\n\nThe KeyDown event can also be used to get the Unicode\
    \ character code number of a key depression.\n\nThis example looks for the Y and\
    \ N character codes, in both upper and lower case, then branches the script according\
    \ to the value.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_150_0.png)\n\n```\n\
    if( navigator.appName == \"Netscape\"\nwindow.captureEvents( Event.KEYDOWN );\n\
    ```\n\n```\nfunction showkey(e) {\n  var msg = \"\", fwd = \"Y pressed\", hlt\
    \ = \"N pressed\";\n  // key codes in Netscape/Mozilla browsers\n  if( navigator.appName\
    \ == \"Netscape\") {\n    if( e.which == 89 || e.which == 121 ) msg = fwd;\n \
    \   if( e.which == 78 || e.which == 110) msg = hlt;\n  }\n\n  // check key codes\
    \ in Internet Explorer\n  if( navigator.appName == \"Microsoft Internet Explorer\"\
    ) {\n    if(event.keyCode==89 || event.keyCode==121)msg= fwd;\n    if(event.keyCode==78\
    \ || event.keyCode==110)msg= hlt;\n  }\n\n  if( msg != \"\") ) alert(msg);\n \
    \ // line the event-handler\n  document.onkeydown=showkey;\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_150_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_150_2.png)"
  - "[PAGE 151]\n\n# Load\n\nThe Load event does not occur until all the HTML elements\
    \ on a Web page have completely loaded. This means that the onload event-handler\
    \ will only run after all the elements are present.\n\nIf JavaScript is to modify\
    \ elements of the document <body> section those elements must already be loaded\
    \ to avoid receiving a script error.\n\nTypically the onload event-handler will\
    \ call a JavaScript function, named init(), that will initialize a number of values.\n\
    \nThis example sets the HTML page colors, then it assigns a value to a variable\
    \ which it subsequently assigns to a form text box:\n\n```\n// a function to react\
    \ to the LOAD event\nfunction init() {\n  // set foreground and background colors\n\
    \  document.bgColor = \"orange\";\n  document.fgColor = \"blue\";\n\n  // store\
    \ a string then display it in a form field\n  var str = \"The Page is Loaded\"\
    ;\n  document.forms.f.txt.value = str;\n}\n\n// specify the onload event-handler\n\
    window.onload = init;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_151_0.png)\n\
    \nA HTML event-handler assigned to the onload attribute of the <body> tag would\
    \ replace that assigned in the script.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_151_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_151_2.png)"
  - "[PAGE 152]\n\n# Unload\n\nThe Unload event occurs whenever the browser unloads\
    \ a document from a window, or frame, usually when the user navigates to a new\
    \ URL.\n\nThe onclick event-handler may call a final JavaScript function to be\
    \ run just before the document unloads. When a frames page is unloaded the onload\
    \ event-handler of each frame may call a final function.\n\nThe onclick event-handler\
    \ is useful to save the final state of data on that page in a cookie or by submission\
    \ to the server.\n\nIt is also used to open new pop-up windows containing further\
    \ information that the user may find.\n\nThe example below illustrates the use\
    \ of the onload event-handler to open a new pop-up window:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_152_0.png)\n\
    \n```\n// a function to react to the UNLOAD event\nfunction leaving()\n{\n  //\
    \ open a HTML document in a pop-up window\n  var win = window.open(\"finally.html\"\
    , \"\",\n  \"top=50,left=50,width=300,height=100\");\n}\n\n// specify the onload\
    \ event-handler\nwindow.onload = leaving;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_152_1.png)\n\
    \n| Unload Event |\n| File Edit View Favorites Help |\n| Go to | And finally...\
    \ |\n| | We're sorry to see you go Visit a similar site ? |\n| Local intranet\
    \ |"
  - "[PAGE 153]\n\n# Focus\n\nThe Focus event occurs when the user clicks on a form\
    \ element or on a window to direct the browser's focus.\n\nThe onfocus event-handler\
    \ can call a JavaScript function when the focus is received.\n\nA HTML onfocus\
    \ attribute can be added to form elements to specify a function when it receives\
    \ focus, like this...\n\n![](img/5f5106681c8c7072e64c4ea87c891513_153_0.png)\n\
    \n```\n<input type=\"text\" name=\"txt1\" value=\"Enter quantity here\" onfocus=\"\
    wipe(this)\"/>\n<input type=\"text\" name=\"txt2\" value=\"Enter data here\" onfocus=\"\
    wipe(this)\"/>\n```\n\nIn the example, below the text inputs initially display\
    \ the strings assigned to their respective value attributes.\n\nWhen the user\
    \ clicks each text input receives focus so the wipe() function assigns an empty\
    \ string to its value attribute. This clears the displayed text and places the\
    \ cursor in the appropriate position ready for the user to input text into that\
    \ field.\n\n```\n// a function to clear a text input\nfunction wipe(obj) {\n \
    \ // clear the form field\n  obj.value=\"\"\n  // reset the focus\n  obj.focus();\n\
    }\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_153_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_153_2.png)"
  - "[PAGE 154]\n\n# Blur\n\nA Blur event occurs when the browser’s focus moves away\
    \ from a form element, or a window, and the onblur event-handler may call a JavaScript\
    \ function.\n\nThe blur() method of a form element is useful to prevent user input\
    \ for text boxes that must be read-only.\n\nA blur() method can be called from\
    \ the HTML onfocus attribute of the read-only element, like this...\n\n```\n<input\
    \ type=\"text\" size=\"30\"\nvalue=\"This field is read-only\" onfocus=\"blur(this)\"\
    />\n```\n\nIn the following example the user is reminded that the text box they\
    \ have just left to receive some input:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_154_0.png)\n\
    \n```\na function to examine a passed string argument\nfunction is_entry( val\
    \ )\n{\n  if the text field is empty\n  if ( val == \"\")\n    ...display a message\n\
    \    alert(\"Please enter data\");\nn}\n```\n\nUsing the window.blur() method\
    \ will typically minimize the window.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_154_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_154_2.png)\n\n12. Event-handlers |\
    \ 153"
  - "[PAGE 155]\n\n# Change\n\nThe Change event occurs when the value of a text input\
    \ is changed or when the user selects an item in an options list.\n\nThe onchange\
    \ event-handler can call a JavaScript function to execute some code whenever the\
    \ Change event occurs.\n\nThe example below sets the initial selection option\
    \ to Green then assigns an event-handler that displays the associated value in\
    \ a text box whenever the selection is changed:\n\n```\n// a function to set the\
    \ selected item in a list\nfunction init() {\n  document.forms.f.s.options[1].selected\
    \ = true;\n  // specify an onchange event-handler\n  document.forms.f.s.onchange\
    \ = show_selected;\n}\n\n// a function to display the selected list item\nfunction\
    \ show_selected() {\n  document.forms.f.txt.value = document.forms.f.s.options(document.forms.f.s.selectedIndex).value;\n\
    }\n\n// specify the onload event-handler\nwindow.onload = init;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_155_0.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_155_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_155_2.png)"
- md: "\n# Reset\n\nThe Reset event occurs when the user pushes a form's reset button\
    \ or when JavaScript executes the form.reset() method.\n\nThe onreset event-handler\
    \ may call a JavaScript function when the Reset event occurs.\n\nIn this example\
    \ there are two HTML forms, named f1 and f2. The first form contains three radio\
    \ buttons and a reset button. An event-handler is assigned to the HTML onreset\
    \ attribute in the first <form> tag. When the reset button is pressed the value\
    \ of the second radio button is changed and its value is displayed in a text box\
    \ in the second function.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_156_0.png)\n\
    \n```\n// a function to set the value of a radio button\nfunction show_value()\
    \ {\n    // set the value\n    document.forms.f1.r[0].value = \"Salmon\";\n  \
    \  // display the set value\n    document.forms.f2.txt.value = document.forms.f1.r[0].value;\n\
    }\n```\n\nThe first radio button could be checked with JavaScript by assigning\
    \ the property document.forms.f1.r[0].checked.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_156_1.png)\n\
    \n# Submit\n\nThe **Submit** event occurs when the user pushes a submit button\
    \ in a form. The `onsubmit` event-handler may call a function to carry out form\
    \ validation before submission.\n\nIf the **onsubmit** event-handler returns `false`,\
    \ for instance when form validation fails, the form data will not be sent.\n\n\
    This example performs basic email address validation and provides the user with\
    \ an `alert()` message if validation fails. The function is called by the HTML\
    \ `onsubmit` attribute of the `<form>` tag.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_157_0.png)\n\
    \n```javascript\n// function to validate basic email address format\nfunction\
    \ validation() {\n  // seek an @ character in the address\n  if(document.forms.f.email.value.indexOf(\"\
    @\") == -1) {\n    // if absent display a message\n    alert(\"Email address is\
    \ absent or incorrect\");\n    // ...and do not submit the form\n    return false;\n\
    \  }\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_157_1.png)\n\nThe onsubmit\
    \ event-handler is not invoked by use of the `form.submit()` method in JavaScript.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_157_2.png)\n\n# Abort\n\nInternet Explorer\
    \ allows an event-handler to be specified for the **Abort** event that occurs\
    \ when the user cancels the download of an image — usually by pushing the **stop**\
    \ button on the browser's toolbar. The **onabort** event-handler may call a JavaScript\
    \ function when an image download is cancelled.\n\nTo identify the image name\
    \ must be given to its **id** attribute in the HTML <img> element, like this:\n\
    \n```html\n<img id=\"big-pic\" src=\"bigpic.jpg\" alt=\"\">\n```\n\nAn event-handler\
    \ can be assigned to image's **onabort** property. In the example below the event-handler\
    \ directly creates an `alert()` message confirming that the download is cancelled:\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_158_0.png)\n\n```javascript\n// for\
    \ Internet Explorer only set an abort event handler\ndocument.getElementById(\"\
    big-pic\").onabort = abort_msg;\n```\n\n```javascript\n// a function to display\
    \ a confirmation\nfunction abort_msg() {\n    alert(\"Image Download Has Been\
    \ Aborted\");\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_158_1.png)\n\
    \nThe `<script>` element that includes this script must appear in the HTML body\
    \ *after* the `<img>` element — an event-handler can't be set until the image\
    \ object exists.\n\n| Abort Event | File | Edit | Favorites | Help |\n| :--- |\
    \ :--- | :--- | :--- | :--- |\n| Microsoft Internet Explorer | | | | |\n| Image\
    \ Download Has Been Aborted | OK | Local intranet | | |\n\n![](img/5f5106681c8c7072e64c4ea87c891513_158_2.png)\n\
    \nThis feature is useful to switch the image source to a low-resolution version.\n\
    \n# Resize\n\nThe **Resize** event occurs when a browser window is resized by\
    \ the user and the **onresize** event-handler can execute a function to make the\
    \ page appropriate for the new window size.\n\nThis is most useful to reposition\
    \ DHTML page components as illustrated in the following example. This creates\
    \ a centered `<div>` element with the `id` \"lyr\" which will be reered when the\
    \ window is resized:\n\n```javascript\n// a function to center a <div> element\n\
    function set_pos() {\n  var width;\n  // get the window width\n  if (navigator.appName\
    \ == \"Netscape\")\n    width = innerWidth; // for Netscape\n  else\n    width\
    \ = document.body.clientWidth; // for IE\n\n  // half window width minus div width\n\
    \  var left_pos = parseInt(width / 2) - 50;\n  \n  // set the left position of\
    \ the <div> element\n  document.getElementById(\"lyr\").style.left = (left_pos+\"\
    px\");\n}\n\n// specify the onresize event-handler\nwindow.onresize = set_pos;\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_159_0.png)\n\nThis `<div>` is\
    \ initially centered by calling the `set_pos()` function from the HTML `<body>`\
    \ element.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_159_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_159_2.png)\n\
    \n# JavaScript in DHTML\n\nThis chapter describes the use of JavaScript to control\
    \ and manipulate components of an HTML document. The many examples illustrate\
    \ how characteristics of position, content and visibility can all be dynamically\
    \ changed to create an exciting interactive Web page.\n\n- JavaScript: protocol\
