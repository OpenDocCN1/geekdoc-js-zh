  md: '# Keywords


    The following table contains the keywords that are part of the JavaScript language
    syntax. These may not be used when choosing identifier names for variables, functions
    or labels:


    | break | do | function | null | typeof |

    |---|---|---|---|---|n| case | else | if | return | var |

    | continue | export | import | switch | void |

