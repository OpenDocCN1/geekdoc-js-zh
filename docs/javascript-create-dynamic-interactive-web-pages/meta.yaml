    \n此功能适用于将源切换到低分辨率版本。\n\n# 调整大小 (Resize)\n\n当用户调整浏览器窗口大小时会触发 **Resize** 事件，**onresize**\
    \ 事件处理器可以执行函数以使页面适应新的窗口大小。\n\n这对于重新定位 DHTML 页面组件最为有用，如下例所示。该示例创建了一个 `id` 为 \"\
    lyr\" 的居中 `<div>` 元素，当窗口调整大时它将重新居中：\n\n```javascript\n// 居中 <div> 元素的函数\nfunction\
