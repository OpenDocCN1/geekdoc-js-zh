  - '[PAGE 35]


    # If - else statements


    The JavaScript else keyword can be used with an if statement to provide alternative
    code to execute, in the event that the test expression returns false.


    This is known as conditional branching and has this syntax:


    ```

    if (test expression) do-this; or-else-do-this;

    ```


    Several expressions may be tested until a true value is found when the code following
    the true expression is executed. It is important to note any further code contained
    in the if-else statement is ignored.


    So in the following example any code after the call to the alert() function by
    the third test will be ignored completely:


    ![](img/5f5106681c8c7072e64c4ea87c891513_35_0.png)


    ```

    var num = 2, bool = false;

    // is the number 1 and the boolean value true ?nif (num == 1 && bool == 1) alert("TEST1
    bool: " + bool);

    else

    // is the number 2 and the boolean value true ?nif (num == 2 && bool == 1) alert("TEST2
    bool: " + bool);

    else

    // is the number 3 and the boolean value false ?nif (num == 3 && bool == 0) alert("TEST4
    bool: " + bool);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_35_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_35_2.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_35_3.png)'
  - "[PAGE 36]\n\n# The switch statement\n\nConditional branching using the if-else\
    \ statement may be more efficiently performed using a switch statement when a\
    \ test expression evaluates the value of just one variable.\n\nThe switch statement\
    \ works in an unusual way – first it evaluates a given expression, then it seeks\
    \ a label to match the resulting value. The code associated with the matching\
    \ label will be executed or, if no match is made, the statement will execute any\
    \ default code.\n\nThe JavaScript case keyword is used to denote a label and the\
    \ default keyword denotes the default code.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_36_0.png)\n\
    \nFor more detail on the break statement see page 40.\n\nAll label code must be\
    \ terminated by a break statement using the JavaScript break keyword.\n\nThe labels\
    \ may be numbers, strings, or booleans but must all be of the same type, like\
    \ in this example that uses number types:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_36_1.png)\n\
    \n```\nvar num = 2;\nswitch(num)\n{\n  is the number 1 ?n  case 1 : alert(\"This\
    \ is case 1\"); break;\n\n  // is the number 2 ?n  case 2 : alert(\"This is case\
    \ 2\"); break;\n\n  // is the number 3 ?n  case 3 : alert(\"This is case 3\");\
    \ break;\n\n  // if none of these numbers do this...\n  default : alert(\"This\
    \ is default code\");\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_36_2.png)\n\
    \nOmitting the ending break keywords will allow execution of all other code in\
    \ the switch statement.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_36_3.png)\n\
    \n3. Making statements"
  - "[PAGE 37]\n\n# For loops\n\nThe for loop is probably the most frequently used\
    \ type of loop in JavaScript and has this syntax:\n\n```\nfor ( initializer ,\
    \ test , increment ) statement/s ;\n```\n\nThe initializer is used to set the\
    \ start value for the counter of the number of loop iterations. A variable may\
    \ be declared here for this purpose and it is traditional to name it i.\n\nAt\
    \ each pass of the loop a boolean condition is tested and the next iteration of\
    \ the loop will only run if the condition returns true. If the test returns false\
    \ then the loop will end.\n\nWith every iteration the counter is incremented then\
    \ the loop will execute the code in the statement. Multiple statements can be\
    \ executed if they are contained by curly braces in a statement block.\n\nThe\
    \ following example makes five iterations and changes the assigned value of two\
    \ variables at each pass:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_37_0.png)\n\
    \n```\nvar a = 0, b = 0;\n// initialize counter at zero then loop until it hits\
    \ 5\nfor ( var i = 0; i < 5; i++) {\n  // increment variable values on each iteration\n\
    \  a += 10; b += 5;\n}\n// display the final values after the loop ends...\nalert(\"\
    FOR LOOP\\n A is \" + a + \"... B is \" + b \");\n```\n\n> HOT TIP\nA loop can\
    \ also count down - decrementing the counter at each iteration.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_37_1.png)"
  - "[PAGE 38]\n\n# The for - in loop\n\nThe for-in loop has a special use to enumerate\
    \ all the variables for\nproperties contained within an object.\n\nThis loop is\
    \ seldom used in regular JavaScript but is included here\nbecause it can reveal\
    \ the properties available for manipulation\nwithin a Web browser.\n\nThe following\
    \ example reveals a tantalizing glimpse of the\nproperties available within the\
    \ window object of the Microsoft\nInternet Explorer 6.0 Web browser:\n\n```\n\
    var i = 0; a = \"\"\n\n// list all window properties in a variable\nfor ( property\
    \ in window ) {\n  a += property + \"...\";\n}\n// display the window properties\
    \ list\nalert(a);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_38_0.png)\n\
    \nThe properties\nrevealed will vary\nfor each browser\nand version.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_38_1.png)\n\
    \nThe properties\nrevealed with this\nscript are part of\nthe Document\nObject\
    \ Model\n(DOM) that is described in\nchapter 8.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_38_2.png)\n\
    \n3. Making statements"
  - "[PAGE 39]\n\n# While loops\n\nAnother loop uses the JavaScript while keyword\
    \ followed by an expression to be evaluated for a boolean value.\n\nIf the evaluation\
    \ returns true then the code in the statement block will be executed. After the\
    \ code has executed the test expression will again be evaluated and the loop will\
    \ continue until the evaluation returns false.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_39_0.png)\n\
    \nThe statement block must feature code that will affect the test expression in\
    \ order to change the evaluation result to return false - otherwise an infinite\
    \ loop will be created.\n\nIt is important to note that if the test expression\
    \ returns false when it is first evaluated then the code in the statement block\
    \ is never executed.\n\nThis example decrements a variable on each iteration of\
    \ the loop. The counter increments until it reaches 10 when the evaluation returns\
    \ false and the loop ends.\n\n```\nvar i = 0, num = 50;\n// loop until the counter\
    \ hits 10\nwhile(i < 10 )\n{\n  num--;\n  i++;\n}\n// display the final counter\
    \ and number values\nalert(\"Loop stopped at \" + i + \"\\nnum is now \" + num\
    \ +);\n```\n\nwhile.js\n\n![](img/5f5106681c8c7072e64c4ea87c891513_39_1.png)"
- md: "\n## The do-while loop\n\nThe JavaScript **do** keyword is used to denote the\
    \ start of a **do-while** loop and is followed by a statement block containing\
    \ the code to be executed by the loop.\n\nThe statement code is followed by the\
    \ JavaScript **while** keyword and an expression to be evaluated for a boolean\
    \ value of **true** or **false**.\n\nIf the evaluation returns **true** the loop\
    \ restarts at the **do** keyword and will continue until that returns **false**.\n\
    \nIt is important to note that, unlike the simple **while** loop, the statement\
    \ code will always be executed at least once the **do-while** loop because the\
    \ test expression is not encountered until the end of the loop.\n\nThe following\
    \ example will never loop because the counter value is incremented by 1 in the\
    \ first execution of the statement code so the first evaluation will return **false**:\n\
    \n```javascript\nvar i = 0, num = 50;\n\n// loop until the counter hits 1\ndo\
    \ {\n  num--;\n  i++;\n} while( i < 1 );\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_40_0.png)\n\
    \nA **while** loop is often more suitable than a **do-while** loop.\n\n```javascript\n\
    // display the final counter and number values\nalert(\"Loop stopped at \" + i\
    \ + \"\\num is now \" + num);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_40_1.png)\n\
    \n3. Making statements | 39\n\n## Break statement\n\nThe JavaScript break keyword\
    \ is used to terminate the execution of a loop prematurely.\n\nThe break keyword\
    \ is situated inside the statement block containing the code that the loop should\
    \ execute and is preceded by a conditional test.\n\nWhen the test condition is\
    \ met the break statement immediately terminates the loop and no further iterations\
    \ are made.\n\nNotice in the alert() output below that the counter value is still\
    \ three because the increment in the final iteration is not applied\n\nIn the\
    \ following example the conditional test will return true when the counter value\
    \ reaches three:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_41_0.png)\n\n```javascript\n\
    var i= 0;\n// Loop until the counter hits 6\nwhile (i < 6)\n{\n  if( i == 3 )\
    \ break;\n  i++;\n}\n// display the final counter value\nalert(\"BREAK\\nLoop\
    \ stopped at \" + i);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_41_1.png)\n\
    \nThe break keyword is also used as a terminator with a switch statement.\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_41_2.png)\n\n## Continue statement\n\n\
    The JavaScript continue keyword is used to break the current iteration of a loop.\n\
    \nJust like the break keyword the continue keyword is situated inside the statement\
    \ block containing the code that the loop should execute, preceded by a conditional\
    \ test.\n\nWhen the test condition is met the continue keyword immediately stops\
    \ the current iteration of the loop, but further iterations will be made until\
    \ the loop ends.\n\nIn the example below the test condition is met when the counter\
    \ reaches three so the string concatenation in that iteration is not applied but\
    \ the loop continues on:\n\n```javascript\nvar i = 0, str = \"\";\n// loop counter\
    \ hits 5\nwhile(i < 5)\n{\n  i++;\n  if( i == 3 ) continue;\n  str += i + \" \"\
    ;\n}\n// display final counter\n// and all series numbers\nalert(\"CONTINUE\\\
    n\\n stopped:\"+i+\"\\nSeries:\"+str);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_42_0.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_42_1.png)\n\n## Using with statements\n\
    \nThe JavaScript **with** keyword is used to reference object properties without\
    \ needing to add the object name before each property name.\n\nThis is most useful\
    \ when writing JavaScript applications to produce dynamic effects as these scripts\
    \ often refer to document objects.\n\nFor example, every Web page contains a **document**\
    \ object that in turn has a **forms** property to reference forms on the Web page.\
    \ Forms can be referenced by the value assigned to their **id** attribute. Individual\
    \ form fields can be referenced by the value assigned to their **name** attribute\
    \ and JavaScript can set their values.\n\nIn this example the script sets **user**\
    \ and **city** fields of an **order** form:\n\n```javascript\ndocument.forms.order.user.value\
    \ = \"Mike\";\ndocument.forms.order.city.value = \"New York\";\n```\n\nThese assignments\
    \ can be expressed more clearly using a **with** statement like this:\n\n```javascript\n\
    // set values for user and city fields of the order form\nwith (document.forms.order)\
    \ {\n  user.value = \"Mike\";\n  city.value = \"New York\";\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_43_0.png)\n\
    \nSee Chapter 10 for more about document objects and properties.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_43_1.png)\n\
    \nThe <script> element that includes the JavaScript file must appear after the\
    \ form in the HTML file - so that the form fields are created before the script\
