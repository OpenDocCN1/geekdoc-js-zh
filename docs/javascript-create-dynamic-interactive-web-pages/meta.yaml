  - "[PAGE 60]\n\n# Time zones\n\nJavaScript can determine which time zone the user\
    \ is in using the\nDate.getTimezoneOffset() method.\n\nThe method gets the local\
    \ time from the Date object then\ncompares it to the UTC time. The return value\
    \ is the difference\nstated in minutes because some countries have time zones\
    \ at other\nthan regular one-hour intervals.\n\nIn the example below the Date.getTimezoneOffset()\
    \ method\ndecides in U.S. time zone, if any, the user is located:\n\n```\ncreate\
    \ a new Date object\nvar now = new Date();\nget the number of minutes offset from\
    \ UTC\nvar offset = now.getTimezoneOffset();\n\ncreate an empty variable\nvar\
    \ msg;\nnassign an appropriate variable\nswitch(offset) {\n  case 240 : msg =\
