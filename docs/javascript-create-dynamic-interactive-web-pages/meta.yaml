- img_proc: true
  md: '# String of elements


    The JavaScript array.join() method will convert all array elements to strings
    and concatenate them.


    Used without arguments this will return a list of all the array element values
    separated by commas, like the array.concat() method on the previous page.


    But the array.join() method can accept an optional argument to specify an alternative
    separator to the default comma separator.


    Mostfully this can be a space so that result of the array.join() method will be
    a single string with space separators, as illustrated in the example below:


    ![](img/5f5106681c8c7072e64c4ea87c891513_49_0.png)


    ```

    create a new array

    var a = new Array();


    // put a word in seven array elements

    a[0] = "It"

    a[1] = "isn\t"

    a[2] = "rocket"

    a[3] = "science -"

    a[4] = "it''s"

    a[5] = "just"

    a[6] = "JavaScript"


    // display all words in the array, separated by a space

    alert(a.join(" "));

    ```


    Escape the single quotes with a \ backslash to avoid errors.


    ![](img/5f5106681c8c7072e64c4ea87c891513_49_1.png)'
  merge: -1
  pgno: 49
- img_proc: true
  md: "# Reverse element order\n\nArrays can be used to contain a file name or complete\
    \ URL in each element for use with dynamic features in Web pages.\n\nOne popular\
    \ use is with JavaScript slide shows that rotate a series of images with a specified\
    \ interval between each one.\n\nAn array is used to hold the URL of each image\
    \ in its elements so that the script can easily reference them by array index.\n\
    \nIf the slide show is required to reverse after displaying the final image, rather\
    \ than start over at the first image, this can be achieved by reversing the element\
    \ order inside the array.\n\nThe following example creates an initial array of\
    \ just three images whose order will be reversed after the final image displays\
    \ and the rev variable is set to true:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_50_0.png)\n\
    \n```\n// create a new array of image URLs\nvar imgs = new Array(\"img1.gif\"\
    , \"img2.gif\", \"img3.gif\");\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_50_1.png)\n\
    \n```\n// control variable\nvar rev = false;\n```\n\n```\n// when the slideshow\
    \ displays the final image\n// reverse the order\nrev = true;\n```\n\n```\nif\
    \ (rev == true) {\n  imgs.reverse();\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_50_2.png)\n\
    \n```\ndisplay the reversed element order\nalert(imgs.join(\" - \") + \" - \"\
    );\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_50_3.png)\n\n4. Using arrays"
  merge: -1
