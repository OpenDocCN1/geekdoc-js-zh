    # Math constants


    The intrinsic Math object contains a number of standard mathematical constant
    values for easy reference.


    Uppercase is always used to refer to the constant values which are all listed
    in the following table:


    | Math.E | The constant e base of the natural logarithm with a value of approximately
    2.71828 |

    | Math.LN2 | The natural logarithm of 2 approximately 0.6931471805994528623 |

    | Math.LN10 | The natural logarithm of 10 approximately 2.302585092990459011 |

    | Math.LOG2E | The base-2 logarithm of e approximately 1.44269504088963378 |

    | Math.LOG10E | The base-10 logarithm of e approximately 0.432494819032518677
    |

    | Math.PI | The constant pi approximately 3.14159265358972 |

    | Math.SQRT1_2 | The reciprocal of the square root of 2 approximately 0.707106781186476
    |

    | Math.SQRT2 | The square root of 2 with a value of approximately 1.4142135623730951
    |


    ![](img/5f5106681c8c7072e64c4ea87c891513_67_0.png)


    The Math constants can be used anywhere within a script.


    Most of the Math constants are used only in JavaScript applications that have
    a particular mathematical purpose but the full list is given above for completeness.


