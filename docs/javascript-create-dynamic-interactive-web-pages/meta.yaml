  - "[PAGE 137]\n\n# Text areas\n\nA HTML <textarea> element is rather like a large\
    \ scrolling text input whose value can be read and written by JavaScript.\n\n\
    The example below writes content to a text area by assigning a string to its value\
    \ property after the document is loaded.\n\nThe function to assign the string\
    \ is designated as the document’s onload event handler by the script.\n\nCare\
    \ is needed when using this approach – if the script is included in the <head>\
    \ section of the HTML document an onload attribute in the <body> tag may overwrite\
    \ it.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_137_0.png)\n\nIt is often best\
    \ to call onload functions using the onload attribute of the HTML <body> element.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_137_1.png)\n\n```\n// a function to\
