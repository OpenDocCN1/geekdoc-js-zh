    \n![](img/5f5106681c8c7072e64c4ea87c891513_117_4.png)\n\n# Rollover\n\nIf an image\
    \ has been named in the HTML code, by assigning a value to the `<img>` tag's id\
    \ attribute, it may also be addressed by this name in JavaScript. The script is\
