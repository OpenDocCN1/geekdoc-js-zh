  md: "# Pop-up window\n\nOne of the most useful browser features provided by JavaScript\n\
    the ability to open a second browser window displaying another\nURL Web page.\n\
    \nThis is possible using the window.open() method which takes\nthree arguments\
    \ to specify the URL to load in the pop-up window,\na name for the pop-up and\
    \ its desired dimensional features.\n\nThese pop-up windows are invariably smaller\
    \ than the original\nwindow and have many uses including the display of large\
    \ images\nfrom a display of thumbnail-sized images.\n\nThe example below opens\
    \ a secondary pop-up window following\ncomplete loading of the first window:\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_105_0.png)\n\n```\n// a function to\
    \ open a pop-up window\nfunction popup() {\n    window.open(\"popup-2.html\",\
    \ \"\",\n    \"top=40,left=40,width=250,height=100\");\n}\n\n// set the onload\
    \ object\nwindow.onload = popup;\n```\n\nThe second argument mustnbe an empty\n\
    string if no name\nis being given to\nthe pop-up window.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_105_1.png)\n\
    \n104 | JavaScript in easy steps"
  merge: -1
  pgno: 105
- img_proc: true
  md: "# # Pop-up features\n\nThe third argument to the window.open() method may specify\
    \ many features to be included in the new window from the list in the following\
    \ table:\n\n| Feature | Description |\n| --- | --- |\n| directories | Adds the\
    \ links bar |\n| height | Sets the height in pixels of the document area |\n|\
    \ left | The X co-ordinate of the window on the screen |\n| location | Adds the\
    \ address bar |\n| menubar | Adds the standard menu bar |\n| resizable | Permits\
    \ the window to be resized |\n| scrollbars | Enables scrollbars when needed |\n\
    | status | Adds the status bar |\n| toolbar | Adds the button bar with back &\
    \ forward buttons |\n| top | The Y co-ordinate of the window on the screen |\n\
    | width | Sets the width in pixels of the document area |\n\n![](img/5f5106681c8c7072e64c4ea87c891513_106_0.png)\n\
    \nThe dimension features of top, left, width and height need to state a pixel\
    \ value like the example on the facing page. All the other features can have a\
    \ value of yes or no if the feature appears in the argument a yes value is assumed\
    \ – so it need to be specified.\n\nFor example, to add a status bar to the code\
    \ on the facing page just requires the addition of status to the features list:\n\
    \n```\na function to open a pop-up window with a status bar\nfunction popup()\
    \ {\n  window.open(\"popup-2.html\", \"\",\n  \"top=40,left=40,width=250,status=\"\
    );\n}\",}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_106_1.png)"
  merge: -1
  pgno: 106
- img_proc: true
  md: "# Close pop up\n\nA window can close itself simply by calling the window.close()\
    \ method by closing a pop-up window requires a little more effort.\n\nThe initial\
    \ call to the window.open() method should be assigned to a variable to create\
    \ a window object. This new object inherits the window.close() method which can\
    \ close the pop-up.\n\nThis example verifies the existence of the pop-up window\
    \ before closing when the user exits the main window:\n\n```\n// create a variable\
    \ to store a window object\nvar popupwindow;\n\n// a function to open a pop-up\
    \ window\nfunction popup() {\n  popwindow = window.open(\"popup-2.html\", \"\"\
    ,\n\"top=40,left=40,width=250,height=100,menubar,status\");\n}\n\n// a function\
    \ to close a pop-up window\nfunction close_popup() {\n  if(popwindow != null )\
    \ popwindow.close();\n}\n\n// set the onload and onunload objects\nwindow.onload\
    \ = popup;\nwindow.onunload = close_popup;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_107_0.png)\n\
    \nThis pop-up page is the same as that in the example on page 104 - but now JavaScript\
    \ added status bar and menu bar features to this window.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_107_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_107_2.png)\n\n106 | JavaScript in easy\
    \ steps"
  merge: -1
