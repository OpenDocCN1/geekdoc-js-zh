- md: "\n## Submit the order\n\n- a function to copy values from a hidden form in\
    \ another frame into a local hidden form\n- then submit the local form to the\
    \ server\n\n```javascript\nfunction send_order() {\n  copy the values from form\
    \ m to form f\n  f.customer.value = m.customer.value;\n  f.accountnumber.value\
    \ = m.accountnumber.value;\n  f.ordernumber.value = m.ordernumber.value;\n  f.ball.value\
    \ = m.ball.value;\n  f.hoop.value = m.hoop.value;\n  f.cone.value = m.cone.value;\n\
    \  submit form f to the server\n  f.submit();\n}\n```\n\nThis routine could simply\
    \ have submitted the hidden form in the other frame, but the response from the\
    \ server would then have appeared in that frame.\n\nIn this example, the action\
    \ attribute of the <form> element specifies that this form data should be processed\
    \ by a CGI script called parser.cgi. This server-side script simply sends a HTML\
    \ Web page back to the browser listing all the form data keys and that it has\
    \ received.\n\n## What next?\n\nThe future looks bright for JavaScript with the\
    \ introduction of the SVG file format to display Scalable Vector Graphics.\n\n\
    This file format stores vector graphic information in text form within a XML document.\n\
    \nFile sizes of SVG images are very small compared to GIF and JPG images and have\
    \ the advantage that the image can be scaled-up without increasing file size.\n\
    \nAlso most importantly, the elements of the image can be manipulated by JavaScript\
    \ to create animation and interactive effects.\n\nThis illustration showing the\
    \ text, star shape and drop-shadow effect is written in a text file using the\
    \ SVG format.\n\nLearn more about the SVG file format from the W3C website at\
    \ http://www.w3.org.\n\nJasc Software, creators of Paint Shop Pro, have a program\
    \ called WebDraw that creates vector graphics as SVG images available from their\
    \ website at http://www.jasc.com.\n\nModern versions of Adobe Illustrator support\
    \ SVG and include an Interactivity Palette to create dynamic SVG with JavaScript.\n\
    \nAdobe have also created the PC browser plug-in to support the SVG format which\
    \ can be automatically installed on browsers without SVG capability and is freely\
    \ available at http://www.adobe.com/svg/viewer/install/.\n\nThe further extension\
    \ of the browser DOM together with these exciting developments in SVG should ensure\
    \ that JavaScript will continue adding magic to future websites.\n"
  mdcn: "\n\n## 提交订单\n\n- 一个将另一个框架中隐藏表单的值复制到本地隐藏表单的函数\n- 然后将本地表单提交到服务器\n\n```javascript\n\
    function send_order() {\n  copy the values from form m to form f\n  f.customer.value\
    \ = m.customer.value;\n  f.accountnumber.value = m.accountnumber.value;\n  f.ordernumber.value\
    \ = m.ordernumber.value;\n  f.ball.value = m.ball.value;\n  f.hoop.value = m.hoop.value;\n\
    \  f.cone.value = m.cone.value;\n  submit form f to the server\n  f.submit();\n\
    }\n```\n\n此程序可以直接提交另一个框架中的隐藏表单，但服务器的响应将出现在那个框架中。\n\n在本示例中，`<form>` 元素的 `action`\
    \ 属性指定了表单数据应由名为 `parser.cgi` 的 CGI 脚本处理。该服务器端脚本只需向浏览器返回一个 HTML 页面，列出它接收的所有表单数据键。\n\
    \n## 接下来做什么？\n\n随着 SVG 文件格式用于显示可缩矢量图形的引入，JavaScript 的未来充满光明。\n\n这种文件格式在 XML 文档中以文本形式存储矢量图形信息。\n\
    \n与 GIF 和 JPG 图像相比，SVG 图像的文件大小非常小，其优势是图像可以放大而不会增加文件大小。\n\n同样重要的是，图像的元素可以通过 JavaScript\
    \ 进行操作，以创建动画和交互效果。\n\n这个显示文本、星形和投影投影效果的插图是使用 SVG 格式写在文本文件中的。\n\n可以通过 W3C 网站 http://www.w3.org\
    \ 了解更多关于 SVG 文件格式的信息。\n\nPaint Shop Pro 的创建者 Jasc Software 拥有一个名为 WebDraw 的程序，它可以创建作为\
    \ SVG 图像的矢量图形，并可从其网站 http://www.jasc.com 访问。\n\n现代版本的 Adobe Illustrator 支持 SVG，并包含一个交互色板（Interactivity\
    \ Palette），用于使用 JavaScript 创建动态 SVG。\n\nAdobe 还创建了支持 SVG 格式的 PC 浏览器插件，该插件可以自动安装在不具备\
    \ SVG 能力的浏览器上，并可以在 http://www.adobe.com/svg/viewer/install/ 免费获取。\n\n浏览器 DOM 的进一步扩展结合\
    \ SVG 领域的这些令人兴奋的发展，将确保 JavaScript 继续为未来的网站增添魔法。\n\n"
