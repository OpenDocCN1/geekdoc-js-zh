- md: "\n## Pop-up window\n\nOne of the most useful browser features provided by JavaScript\
    \ is the ability to open a second browser window displaying another URL web page.\n\
    \nThis is possible using the window.open() method which takes three arguments\
    \ to specify the URL to load in the pop-up window, a name for the pop-up and its\
    \ desired dimensional features.\n\nThese pop-up windows are invariably smaller\
    \ than the original window and have many uses including the display of large images\
    \ from a display of thumbnail-sized images.\n\nThe example below opens a secondary\
    \ pop-up window following complete loading of the first window:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_105_0.png)\n\
    \n```javascript\n// a function to open a pop-up window\nfunction popup() {\n \
    \   window.open(\"popup-2.html\", \"\",\n    \"top=40,left=40,width=250,height=100\"\
    );\n}\n\n// set the onload object\nwindow.onload = popup;\n```\n\nThe second argument\
    \ must be an empty string if no name is being given to the pop-up window.\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_105_1.png)\n\n## Pop-up features\n\n\
    The third argument to the window.open() method may specify many features to be\
    \ included in the new window from the list in the following table:\n\n| Feature\
    \ | Description |\n| --- | --- |\n| directories | Adds the links bar |\n| height\
    \ | Sets the height in pixels of the document area |\n| left | The X-coordinate\
    \ of the window on the screen |\n| location | Adds the address bar |\n| menubar\
    \ | Adds the standard menu bar |\n| resizable | Permits the window to be resized\
    \ |\n| scrollbars | Enables scrollbars when needed |\n| status | Adds the status\
    \ bar |\n| toolbar | Adds the toolbar with back & forward buttons |\n| top | The\
    \ Y-coordinate of the window on the screen |\n| width | Sets the width in pixels\
    \ of the document area |\n\n![](img/5f5106681c8c7072e64c4ea87c891513_106_0.png)\n\
    \nThe features of top, left, width and height need to state a pixel value like\
    \ the example on the page. All the other features can have a value of yes or no\
    \ if the feature appears in the argument a yes value is assumed so it needs to\
    \ be specified.\n\nFor example, to add a status bar to the code on the page requires\
    \ the addition of status to the features list:\n\n```javascript\na function to\
    \ open a pop-up window with a status bar\nfunction popup() {\n  window.open(\"\
    popup-2.html\", \"\",\n  \"top=40,left=40,width=250,status=yes\");\n}\n```\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_106_1.png)\n\n## Close pop up\n\nA window\
    \ can close itself simply by calling the window.close(); closing a pop-up window\
    \ requires a more effort. The initial call to the window.open() method should\
    \ be assigned to a variable to create a window object. This new object inherits\
    \ the window.close() method which can close the pop-up.\n\nThis example verifies\
    \ the existence of the pop-up window before closing the main window:\n\n```javascript\n\
    // create a variable to store a window object\nvar popupwindow;\n\n// a function\
    \ to open a pop-up window\nfunction popup() {\n  popupwindow = window.open(\"\
    popup-2.html\", \"\",\n  \"top=40,left=40,width=250,height=100,menubar=yes\");\n\
    }\n\n// a function to close a pop-up window\nfunction close_popup() {\n  if(popupwindow\
    \ != null ) popupwindow.close();\n}\n\n// set the onload and onload objects\n\
    window.onload = popup;\nwindow.onunload = close_popup;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_107_0.png)\n\
    \nThis pop-up page is the same as the example on page 104 - but now JavaScript\
    \ added status bar and menu bar features to this window.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_107_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_107_2.png)\n\n## Get size\n\nIt is\
    \ sometimes useful to have JavaScript get the user's screen resolution from the\
    \ **width** and **height** properties of the **window.screen** object. Because\
    \ a window may not be maximized to the full screen size it is also helpful to\
    \ determine the inner width of the window.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_108_0.png)\n\
    \nThe availHeight and availWidth properties of window.screen object contain the\
    \ size bars. The Netscape and Internet Explorer object models have different ways\
    \ of storing inner window dimensions as browser-specific scripting is needed.\n\
    \nIn the example below window dimensions are retrieved from the appropriate object\
    \ for each browser. The function is called by the onload attribute of the HTML\
    \ <body> tag to ensure that the window has been created before seeking its dimensions.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_108_1.png)\n\n```javascript\nfunction\
    \ get_sizes() {\n  var win_w, win_h, scr_w, scr_h, res, inr;\n  if(document.body.clientWidth)\
    \ { // IE and Opera\n    win_w = document.body.clientWidth;\n    win_h = document.body.clientHeight;\n\
    \  } else if(window.innerWidth) { // Netscape and Mozilla\n    win_w = inner.innerWidth;\n\
    \    win_h = inner.innerHeight;\n  }\n  scr_w = screen.width; scr_h = screen.height;\n\
    \  // display the size information\n  res = \"Resolution: \" + scr_w + \" x \"\
    \ + scr_h;\n  inr = \"Inner window : \" + win_w + \" x \" + win_h;\n  if(win_w\
    \ == null) alert(res + \"\\n\" + inr);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_108_2.png)\n\
    \nYou can call the window.print() method to print out the document in the browser\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_108_3.png)\n\n## Frames array\n\nThe\
    \ window.frames object contains an array of all the frames in a window which have\
    \ been defined in the HTML <frameset> tags.\n\nJavaScript can address these from\
    \ within any frame using the parent.window.frames[] array syntax.\n\nIndividual\
    \ frames can be addressed using their index number in the array, or by the value\
    \ assigned to the name attribute in the HTML <frame> tag. So a frame named \"\
    main\" can be addressed from within another frame as parent.window.frames[\"main\"\
    ] or more simply as parent.window.frames.main.\n\nThe script below is included\
    \ in an HTML frame document. It finds the total number of frames in frameset and\
    \ reads each of their names from the parent frame-holder document:\n\n```javascript\n\
    // find the total number of frames\nvar framenums = \"No. frames : \" + parent.window.frames.length;\n\
    \n// retrieve the name of each frame\nvar framenames = \"Frame 1 : \" + parent.window.frames[0];\n\
    framenames += \"Frame 2 : \" + parent.window.frames[1];\nframenames += \"Frame\
    \ 3 : \" + parent.window.frames[2];\n\n// This is a deliberate mistake\nalert(framenums\
    \ + framenames);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_109_0.png)\n\
    \nTIP: Always check the name with JavaScript that it exists.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_109_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_109_2.png)\n\n## Frame objects\n\n\
    The window.frames object allows access to different frames within a window. The\
    \ example on the page shows how to use these properties to change the location\
    \ of a frame.\n\nThis is called by the onClick attribute of the button to write\
    \ text into the Banner frame:\n\n```javascript\nfunction next() {\n  parent.frames.Page.location\
    \ = \"nextpage.html\";\n  parent.frames.Banner.document.write(\"Frame 2\");\n\
    }\n```\n"
  mdcn: "\n\n## 弹出窗口\n\nJavaScript 提供的最用的浏览器功能之一是打开一个显示另一个 URL 网页的第二个浏览器窗口。\n\n可以使用\
    \ `window.open()` 方法实现该功能，它接受三个参数来指定在弹出窗口中加载的 URL、弹出窗口的名称以及所需的尺寸特征。\n\n这些弹出窗口通常比原始窗口小，并有许多用途，包括从缩略图大小的图像显示大图。\n\
    \n下面的示例在第一个窗口完全加载后打开一个次弹出窗口：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_105_0.png)\n\
    \n```javascript\n// 一个打开弹出窗口的函数\nfunction popup() {\n    window.open(\"popup-2.html\"\
    , \"\",\n    \"top=40,left=40,width=250,height=100\");\n}\n\n// 设置 onload 对象\n\
    window.onload = popup;\n```\n\n如果没有为弹出窗口命名，则第二个参数必须为空字符串。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_105_1.png)\n\
    \n## 弹出特征\n\n`window.open()` 方法的第三个参数可以根据下表中的列表指定新窗口中的许多特征：\n\n| 特征 | 说明 |\n|\
    \ --- | --- |\n| directories | 添加链接栏 |\n| height | 设置文档区域的高度（像素值） |\n| left |\
    \ 窗口在屏幕上的 X 坐标 |\n| location | 添加地址栏 |\n| menubar | 添加标准菜单栏 |\n| resizable | 允许调整窗口大小\
    \ |\n| scrollbars | 需要时启用滚动条 |\n| status | 添加状态栏 |\n| toolbar | 添加带有后退和前进按钮的工具栏\
    \ |\n| top | 窗口在屏幕上的 Y 坐标 |\n| width | 设置文档区域的宽度（像素值） |\n\n![](img/5f5106681c8c7072e64c4ea87c891513_106_0.png)\n\
    \n`top`、`left`、`width` 和 `height` 特征需要像页面上的示例一样指定像素值。所有其他特征如果出现在参数中，其值可以是 `yes`\
    \ 或 `no`；如果特征出现则假设为 `yes`，因此需要显式指定。\n\n例如，要在页面上的代码中添加状态栏，需要在特征列表中添加 `status`：\n\
    \n```javascript\n// 一个打开带状态栏的弹出窗口的函数\nfunction popup() {\n  window.open(\"popup-2.html\"\
    , \"\",\n  \"top=40,left=40,width=250,status=yes\");\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_106_1.png)\n\
    \n## 关闭弹出窗口\n\n窗口可以通过简单调用 `window.close()` 来关闭自己。关闭弹出窗口需要更多努力。应该将对 `window.open()`\
    \ 方法的初始调用赋值一个变量以创建一个窗口对象。此新对象继承 `window.close()` 方法，该方法可以关闭弹出窗口。\n\n此示例在关闭主窗口之前验证弹出窗口是否存在：\n\
    \n```javascript\n// 创建一个变量来存储窗口对象\nvar popupwindow;\n\n// 一个打开弹出窗口的函数\nfunction\
    \ popup() {\n  popupwindow = window.open(\"popup-2.html\", \"\",\n  \"top=40,left=40,width=250,height=100,menubar=yes\"\
    );\n}\n\n// 一个关闭弹出窗口的函数\nfunction close_popup() {\n  if(popupwindow != null )\
    \ popupwindow.close();\n}\n\n// 设置 onload 和 onunload 对象\nwindow.onload = popup;\n\
    window.onunload = close_popup;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_107_0.png)\n\
    \n此弹出页面与第104页示例相同，但现在 JavaScript 为此窗口添加了状态栏和菜单栏特征。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_107_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_107_2.png)\n\n## 获取尺寸\n\n有时让 JavaScript\
    \ 从 **window.screen** 对象的 **width** 和 **height** 属性获取用户的屏幕分辨率是有用的的。因为窗口可能没有最大化到全屏尺寸，确定窗口的内部宽度也是很有帮助的。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_108_0.png)\n\n`window.screen` 对象的 `availHeight`\
    \ 和 `availWidth` 属性包含尺寸。Netscape 和 Internet Explorer 对象模型有不同的存储内部窗口尺寸的方法，因为需要特定浏览器的脚本。\n\
    \n在下面的示例中，窗口尺寸从每个浏览器的相应对象获取。该函数通过 HTML `<body>` 标签的 `onload` 属性调用，以确保在查找尺寸之前窗口已经创建。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_108_1.png)\n\n```javascript\nfunction\
    \ get_sizes() {\n  var win_w, win_h, scr_w, scr_h, res, inr;\n  if(document.body.clientWidth)\
    \ { // IE 和 Opera\n    win_w = document.body.clientWidth;\n    win_h = document.body.clientHeight;\n\
    \  } else if(window.innerWidth) { // Netscape 和 Mozilla\n    win_w = inner.innerWidth;\n\
    \    win_h = inner.innerHeight;\n  }\n  scr_w = screen.width; scr_h = screen.height;\n\
    \  // 显示尺寸信息\n  res = \"Resolution: \" + scr_w + \" x \" + scr_h;\n  inr = \"\
    Inner window : \" + win_w + \" x \" + win_h;\n  if(win_w == null) alert(res +\
    \ \"\\n\" + inr);\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_108_2.png)\n\
    \n你可以调用 `window.print()` 方法在浏览器中打印文档\n\n![](img/5f5106681c8c7072e64c4ea87c891513_108_3.png)\n\
    \n## Frames 数组\n\n`window.frames` 对象包含一个在 HTML `<frameset>` 标签中定义的所有帧的数组。\n\n\
    JavaScript 可以在任何帧内部使用 `parent.window.frames[]` 数组语法访问这些帧。\n\n单个帧可以使用数组中的索引数字访问，也可以通过\
    \ HTML `<frame>` 标签中赋值给 `name` 属性的值访问。因此，命名为 \"main\" 的帧可以在另一个帧内部通过 `parent.window.frames[\"\
    main\"]` 访问，或者简单地通过 `parent.window.frames.main`。\n\n下面的脚本包含在一个 HTML 帧文件中。它查找 frameset\
    \ 中帧的总数，并从父帧读取每个帧的名称：\n\n```javascript\n// 查找帧的总数\nvar framenums = \"No. frames\
    \ : \" + parent.window.frames.length;\n\n// 获取每个帧的名称\nvar framenames = \"Frame\
    \ 1 : \" + parent.window.frames[0];\nframenames += \"Frame 2 : \" + parent.window.frames[1];\n\
    framenames += \"Frame 3 : \" + parent.window.frames[2];\n\n// 这是一个故意的错误\nalert(framenums\
    \ + framenames);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_109_0.png)\n\
    \n提示：始终使用 JavaScript 检查该名称是否存在。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_109_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_109_2.png)\n\n## Frame 对象\n\n`window.frames`\
    \ 对象允许访问窗口内的不同帧。页面上的示例展示了如何使用这些属性更改帧的位置。\n\n此函数通过按钮的 `onClick` 属性调用，向 Banner 帧写入文本：\n\
    \n```javascript\nfunction next() {\n  parent.frames.Page.location = \"nextpage.html\"\
    ;\n  parent.frames.Banner.document.write(\"Frame 2\");\n}\n```\n\n"
