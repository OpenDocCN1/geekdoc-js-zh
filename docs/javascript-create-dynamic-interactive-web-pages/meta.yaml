- md: "\n## String length\n\nA string in JavaScript is simply zero or more characters\
    \ enclosed within quotes, so these are all strings:\n\n```\nvar str1 = \"My First\
    \ String\";\nvar str2 = \"\";\nvar str3 = \"2\";\nvar str4 = \"null\";\n```\n\n\
    The empty quotes in **str2** define the variable as being a **string** data type\
    \ regardless of the empty string value. The numeric value assigned to **str3**\
    \ is automatically converted to a **string** type when enclosed in quotes and\
    \ the JavaScript **null** keyword is just a string literal when enclosed by quotes.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_77_0.png)\n\nEssentially a string is\
    \ a collection of characters, each character containing its own data, just like\
    \ elements in a defined array.\n\nIt is logical to regard a string as an array\
    \ of characters and apply array characteristics when using strings.\n\nThe example\
    \ below parallels the **array.length** property with the **string.length** property:\n\
    \n```javascript\n// create and initialize a string variable\nvar a = \"JavaScript\
    \ Strings\";\n// display the length of the string\nalert(\"String length is \"\
    \ + a.length);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_77_1.png)\n\n\
    ## Characters in strings\n\nStrings are just arrays where each element is a character\
    \ and can be referenced in the same way as regular array elements.\n\nSo just\
    \ like arrays the first character is element 0 (zero).\n\nThe characters can be\
    \ found using the string.charAt() method which takes the element index number\
    \ as its sole argument.\n\nThe example below reads the characters in a string\
    \ and makes changes according to the character found:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_78_0.png)\n\
    \n```javascript\n// create and initialize two string variables\nvar str = \"longer\
    \ in\", var newstr = \"\"\n// get the first and last letters of the str variable\n\
    var a = \"First letter: \" + str.charAt(0);\nvar z = \"Final letter: \" + str.charAt(str.length\
    \ - 1);\n// to extract each character and copy into newstr\nfor(var i = 0; i <\
    \ str.length; i++) {\n    if(str.charAt(i) != \"i\") newstr += str.charAt(i);\n\
    \    else newstr += \"o\";\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_78_1.png)\n\
    \nThe result of the code above will be the letters of str:\n\n```javascript\n\
    var result = \"STRING: \" + newstr;\nresult = \"New string: \" + newstr;\nalert(result);\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_78_2.png)\n\n## Join strings\n\
    \nThe + operator is used to concatenate strings and is widely used throughout\
    \ this book. A new string is created that consists of the first string followed\
    \ immediately by the second string.\n\nThe example below concatenates a number\
    \ of values into a single string, irrespective of the original data type because\
    \ JavaScript performs automatic type conversion:\n\n```javascript\n// create and\
    \ initialize an integer variable\nvar num = 9;\n// create and initialize a float\
    \ variable\nvar flt = 8.6;\n// create and initialize a boolean variable\nvar bool\
    \ = true;\n// create and initialize several string variables\nvar str1 = \"Although\
    \ \";\nvar str2 = \" is cited as \";\nvar str3 = \" the \";\nvar str4 = \" range\
    \ is from about \";\nvar str5 = \" to.\";\n// display the concatenated string\n\
    alert(str1+flt+str3+bool+str4+num+str5);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_79_0.png)\n\
    \nRemember to escape quotes if included inside a string.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_79_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_79_2.png)\n\n## Search a string\n\n\
    JavaScript can search a string to find a character or substring passed as the\
    \ argument to the string.indexOf() method. If a match is made the method returns\
    \ the starting position of the first occurrence of the matched character or substring\
    \ within the searched string. In the event that no match is found the string.indexOf()\
    \ method returns a value of -1.\n\nThe following example uses the string.indexOf()\
    \ method to seek a dot and @ character within an email address string to perform\
    \ a simple format validation:\n\n```javascript\n// initialize a string to search\n\
    var str = \"mailme@domain.com\";\n// seek @, dot and # characters within the search\n\
    var att = str.indexOf(\"@\");\nvar dot = str.indexOf(\".\");\nvar hsh = str.indexOf(\"\
    #\");\n```\n\n```javascript\n// make valid only if an @ and dot are found\nvar\
    \ fmt = ((att != -1) && (dot != -1)) ? \"valid\":\"invalid\";\n```\n\n```javascript\n\
    // display the results of the search\nvar res = \"Format is \" + fmt;\nres +=\
    \ \"\\n@ at \" + att;\nres += \"\\nDot in \" + dot;\nres += \"\\nHash is \" +\
    \ hsh;\nalert(res);\n```\n\nAn optional second integer argument may specify the\
    \ position from which to start the search.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_80_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_80_2.png)\n\n## 7. Working with strings\n\
    \n## Separate words\n\nThe contents of a string may be separated using the JavaScript\
    \ `string.split()` method. A single argument should specify a common character\
    \ for a delimiter at which points the string will be separated. Most commonly\
    \ this can be a single space character so that a phrase with normal spacing will\
    \ be separated into an array of single words.\n\nEach of the words can then be\
    \ referenced using the index number of the split string array, like any other\
    \ array.\n\nThe example below illustrates this use of the `string.split()` method\
    \ together with another instance where items in a database may use a pipe character\
    \ as the delimiter:\n\n```javascript\n// create and initialize a string variable\n\
    var str = \"JavaScript in easy steps\";\n\n// split words into array elements\
    \ delimited by a space\nvar ss = str.split(\" \");\n\n// create and initialize\
    \ another string variable\nvar bk = \"JavaScript in easy steps|Mike McGrath\"\
    ;\n\n// split words into array elements delimited by a pipe\nvar bks = bk.split(\"\
    |\");\n\n// display some split elements\nvar res = \"Topic: \" + ss[0];\nres +=\
    \ \"\\nTitle: \" + bks[0];\nres += \"\\nAuthor: \" + bks[1];\nalert(res);\n```\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_81_0.png)\n\nData is often stored as\
    \ comma-delimited string.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_81_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_81_2.png)\n\n## Substrings\n\nA substring\
    \ may be extracted from an existing string using the substring() method which\
    \ must have two arguments. The first argument specifies the start and the second\
    \ will specify the length. An alternative way to extract a substring is available\
    \ with the substr() method. The example below demonstrates both methods:\n\n```javascript\n\
    // create and initialize a string\nvar str = \"JavaScript in steps\";\n\n// get\
    \ two substrings with the substring() method\nvar subl = str.substring(14,19)\
    \ + str.substring(0,11);\n\n// get two substrings with substr() method\nvar sub2\
    \ = str.substr(14,5) + str.substr(0,10);\n\n// display all\nvar res = \"Substring\
    \ method : \" + subl;\nres += \"\\nSubstr method : \" + sub2;\nalert(res);\n```\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_82_0.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_82_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_82_2.png)\n\n## Convert to string\n\
    \nIt is possible to manually call the JavaScript function that is used to convert\
    \ other data types to strings by calling the object.toString() method. This is\
    \ an essential function and will always try to return a string representation\
    \ of the object that is being queried, even if it is not itself a string.\n\n\
    In this example there is firstly a straightforward addition of two integers, followed\
    \ by a concatenation of a string with an integer where the integer is converted\
    \ to a string value. Finally the object.toString() method is demonstrated with\
    \ a different data type to illustrate that the generated output will reveal the\
    \ object type.\n\n```javascript\n// create an integer variable and add another\
    \ integer\nvar num = 9;\nvar nostr = num + 9;\n\n// create a string version of\
    \ the num integer variable\n// then concatenate a second value to it\nvar adstr\
    \ = num.toString() + 9;\n\n// create a new Image object\nvar img = new Image();\n\
    \n// display string values of the variables\nvar res = \"No strings : \" + nostr;\n\
    res += \"\\nAdded strings : \" + adstr;\nres += \"\\nImage : \" + img.toString();\n\
    alert(res);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_83_0.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_83_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_83_2.png)\n"
  mdcn: "\n\n## 字符串长度\n\nJavaScript 中的字符串简单来说是包含在引号内的零个或多个字符，因此这些都是字符串：\n\n```\nvar\
    \ str1 = \"My First String\";\nvar str2 = \"\";\nvar str3 = \"2\";\nvar str4 =\
    \ \"null\";\n```\n\n**str2** 中的空引号将该变量定义为**字符串**（string）数据类型，无论字符串值是否为空。赋值给 **str3**\
    \ 的数值在被引号包裹时会自动转换为**字符串**类型，而 JavaScript 的 **null** 关键字在被引号包裹时只是一个字符串字面量。\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_77_0.png)\n\n本质上，字符串是字符的集合，每个字符都包含自己的数据，就像定义数组中的元素一样。\n\
    \n将字符串视为字符数组并在使用字符串时应用数组特性是符合逻辑的。\n\n下面的示例将 **array.length** 属性与 **string.length**\
    \ 属性进行了对比：\n\n```javascript\n// 创建并初始化字符串变量\nvar a = \"JavaScript Strings\";\n\
    // 显示字符串的长度\nalert(\"String length is \" + a.length);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_77_1.png)\n\
    \n## 字符串中的字符\n\n字符串就是数组，其中每个元素都是字符，并且可以像普通数组元素一样被引用。\n\n所以，和数组一样，第一个字符是元素 0（零）。\n\
    \n可以使用 `string.charAt()` 方法查找字符，该方法接受元素索引作为唯一参数。\n\n下面的示例读取字符串中的字符，并根据找到的字符进行更改：\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_78_0.png)\n\n```javascript\n// 创建并初始化两个字符串变量\n\
    var str = \"longer in\", var newstr = \"\"\n// 获取 str 变量的首字母和最后一个\nvar a = \"\
    First letter: \" + str.charAt(0);\nvar z = \"Final letter: \" + str.charAt(str.length\
    \ - 1);\n// 提取每个字符并复制到 newstr\nfor(var i = 0; i < str.length; i++) {\n    if(str.charAt(i)\
    \ != \"i\") newstr += str.charAt(i);\n    else newstr += \"o\";\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_78_1.png)\n\
    \n上述代码的结果将是 str 的字母：\n\n```javascript\nvar result = \"STRING: \" + newstr;\nresult\
    \ = \"New string: \" + newstr;\nalert(result);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_78_2.png)\n\
    \n## 拼接字符串\n\n+ 运算符用于连接字符串，并在本书中广泛使用。它会创建一个新字符串，该字符串由第一个字符串紧接着第二个字符串组成。\n\n下面的示例将多个值拼接成单个字符串，而不论原始数据类型如何，因为\
    \ JavaScript 会执行自动类型转换：\n\n```javascript\n// 创建并初始化一个整数变量\nvar num = 9;\n// 创建并初始化一个浮点数变量\n\
    var flt = 8.6;\n// 创建并初始化一个布尔变量\nvar bool = true;\n// 创建并初始化几个字符串变量\nvar str1\
    \ = \"Although \";\nvar str2 = \" is cited as \";\nvar str3 = \" the \";\nvar\
    \ str4 = \" range is from about \";\nvar str5 = \" to.\";\n// 显示拼接后的字符串\nalert(str1+flt+str3+bool+str4+num+str5);\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_79_0.png)\n\n如果字符串内部包含引号，请对引号进行转义。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_79_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_79_2.png)\n\
    \n## 搜索字符串\n\nJavaScript 可以搜索字符串以找到作为 `string.indexOf()` 方法参数的字符或子字符串。如果匹配成功，该方法将返回匹配的字符或子字符串在搜索字符串中首次出现的位置起始位置。如果未找到匹配，`string.indexOf()`\
    \ 方法返回值 -1。\n\n以下示例使用 `string.indexOf()` 方法在电子邮件地址字符串中查找点和 @ 字符，以执行简单的格式验证：\n\n\
    ```javascript\n// 初始化一个用于搜索的字符串\nvar str = \"mailme@domain.com\";\n// 在搜索中查找 @、点和\
    \ # 字符\nvar att = str.indexOf(\"@\");\nvar dot = str.indexOf(\".\");\nvar hsh\
    \ = str.indexOf(\"#\");\n```\n\n```javascript\n// 只有在找到 @ 和点时有效\nvar fmt = ((att\
    \ != -1) && (dot != -1)) ? \"valid\":\"invalid\";\n```\n\n```javascript\n// 显示搜索结果\n\
    var res = \"Format is \" + fmt;\nres += \"\\n@ at \" + att;\nres += \"\\nDot in\
    \ \" + dot;\nres += \"\\nHash is \" + hsh;\nalert(res);\n```\n\n可选的第二个整数参数可以指定开始搜索的位置。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_80_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_80_2.png)\n\
    \n## 7. 字符串操作\n\n## 分离单词\n\n字符串的内容 JavaScript 的 `string.split()` 方法进行分离。单个参数应指定一个公共字符作为分隔符，字符串将在这些点被分离。最常见的情况是单个空格字符，这样带有正常间距的短语将被拆分成单单词的数组。\n\
    \n然后可以使用分割字符串数组的索引数字来引用每个单词，就像处理其他数组一样。\n\n下面的示例说明了 `string.split()` 方法的这种用法，以及另一个数据库中的项目可能使用管道符（|）作为分隔符的实例：\n\
    \n```javascript\n// 创建并初始化字符串变量\nvar str = \"JavaScript in easy steps\";\n\n//\
    \ 将单词按空格分离为数组元素\nvar ss = str.split(\" \");\n\n// 创建并初始化另一个字符串变量\nvar bk = \"\
    JavaScript in easy steps|Mike McGrath\";\n\n// 将单词按管道符分离为数组元素\nvar bks = bk.split(\"\
    |\");\n\n// 显示一些分离的元素\nvar res = \"Topic: \" + ss[0];\nres += \"\\nTitle: \" +\
    \ bks[0];\nres += \"\\nAuthor: \" + bks[1];\nalert(res);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_81_0.png)\n\
    \n数据通常以逗号分隔的字符串存储。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_81_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_81_2.png)\n\
    \n## 子字符串\n\n可以使用 `substring()` 方法从现有字符串中提取子字符串，该方法需要两个参数。第一个参数指定起始位置，第二个指定长度。另一种提取子字符串的方法是使用\
    \ `substr()` 方法。下面的示例演示了两种方法：\n\n```javascript\n// 创建并初始化字符串\nvar str = \"JavaScript\
    \ in\";\n\n// 使用 substring() 获取两个子字符串\nvar subl = str.substring(14,19) + str.substring(0,11);\n\
    \n// 使用 substr() 获取两个子字符串\nvar sub2 = str.substr(14,5) + str.substr(0,10);\n\n\
    // 显示结果\nvar res = \"Substring method : \" + subl;\nres += \"\\nSubstr method\
    \ : \" + sub2;\nalert(res);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_)\n\
    \n## 转换为字符串\n\n可以通过调用 `object.toString()` 方法手动调用用于将其他数据类型转换为字符串的 JavaScript 函数。这是一个基本函数，并将尝试返回所查询对象的字符串表示，即使它本身不是字符串。\n\
    \n在这个示例中，首先是两个整数的直接相加，然后是字符串与整数的拼接（其中整数转换为字符串值）。最后通过不同的数据类型演示 `object.toString()`\
    \ 方法，以说明生成的输出将显示对象类型。\n\n```javascript\n// 创建整数变量并加上另一个整数\nvar num = 9;\nvar nostr\
    \ = num + 9;\n\n// 创建 num 整数的字符串版本\nvar adstr = num.toString() + 9;\n\n// 创建一个新的\
    \ Image 对象\nvar img = new Image();\n\n// 显示变量的字符串值\nvar res = \"No strings : \"\
    \ + nostr;\nres += \"\\nAdded strings : \" + adstr;\nres += \"\\nImage : \" +\
    \ img.toString();\nalert(res);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_)\n\
    \n"
