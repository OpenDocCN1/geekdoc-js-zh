  - '[PAGE 12]


    # Syntax rules


    Notice that there is a semi-colon character at the end of the JavaScript statement
    on the facing page to comply with the required JavaScript language syntax rules.


    This must be added at the end of every JavaScript statement – in the same way
    that a period is used to terminate a sentence in the English language syntax rules.


    Most importantly, JavaScript is a case-sensitive language where "ALERT", "Alert"
    and "alert" are seen as three different words.


    All JavaScript keywords are in lowercase only so using ALERT("Hello World") or
    Alert("Hello World") in the previous code example would not call the JavaScript
    alert() function.


    Spaces, tabs and new lines are collectively known as whitespace and are completely
    ignored by JavaScript so the code may be formatted and indented to make its appearance
    more easily human-readable.


    ![](img/5f5106681c8c7072e64c4ea87c891513_12_0.png)


    Problems with case can be avoided by using lowercase throughout JavaScript code


    It is often useful to add comments to JavaScript code as explanation. The parser
    sees any text between // and the end of that line as a single-line comment, which
    it ignores. Also any text, on one or more lines, between /* and */ is ignored.


    ```

    /* Here is an introduction

    to this script code that

    uses a multi-line comment */


    // This is a single-line comment


    // Display a greeting

    alert("Hello World\ );

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_12_1.png)


    comments.js


    Excessive commenting is avoided – this can dramatically increase the size of a
    JavaScript file.'
  - '[PAGE 13]


    # Keywords


    The following table contains the keywords that are part of the JavaScript language
    syntax. These may not be used when choosing identifier names for variables, functions
    or labels:


    | break | do | function | null | typeof |

    |---|---|---|---|---|n| case | else | if | return | var |

    | continue | export | import | switch | void |

    | default | false | in | this | while |

    | delete | for | new | true | with |


    ![](img/5f5106681c8c7072e64c4ea87c891513_13_0.png)


    Additionally, JavaScript reserves all the words listed in the table below for
    possible future inclusion into the JavaScript syntax – so these too may not be
    used as identifier names. Although this may seem be a lot of words to avoid it
    is seldom a real problem – it’s just a point to remember.


    | abstract | debugger | goto | package | synchronized |

    |---|---|---|---|---|n| boolean | double | implements | private | throw |

    | byte | enum | instanceof | protected | throws |

    | catch | extends | int | public | transient |

    | char | final | interface | short | try |

    | class | finally | long | static | |

    | const | float | native | super |'
  - '[PAGE 14]


    # Variables


    A variable is a place in which to store data for manipulation within a JavaScript
    program.


    When naming variables any letter, digit and the underscore character _ may be
    used but the variable name may not begin with a digit. These are all valid variable
    names:


    ![](img/5f5106681c8c7072e64c4ea87c891513_14_0.png)


    ```

    abc

    my_first_variable

    var123

    ```


    Create a new variable using the JavaScript var keyword:


    ```

    create a variable and assign a string to it

    var message = "My First JavaScript Variable";

    // display the value stored in the variable

    alert( message );

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_14_1.png)


    The text string is stored inside the variable named message.


    The variable name is used in the call to the JavaScript alert() function that
    opens an alert dialog box displaying the string that is stored in the message
    variable.


    ![](img/5f5106681c8c7072e64c4ea87c891513_14_2.png)'
  - '[PAGE 15]


    # Data types


    JavaScript is a loosely typed language so its variables can store numbers, text
    strings or boolean values (ie. true or false).


    This is unlike other programming languages such as C++ and Java that need to declare
    variables of a specific data type and can only then store data of the declared
    type.


    ```

    // initialize a number variable

    var a = 0.06;

    // initialize a string

    var b = "JavaScript in easy steps";

    // initialize a boolean variable

    var c = false;

    // display the data type of each variable

    alert(typeof a + "\n" + typeof b + "\n" + typeof c);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_15_0.png)


    > Notice that JavaScript makes no distinction between integer numbers and floating-point
    numbers.


    The example above creates variables with initial values of the three different
    types supported by JavaScript.


    These three values are first passed to the alert() function, then the JavaScript
    keyword typeof is used to return their data types for display in the alert box
    shown below.


    The code "\n" inside the brackets just displays the output for each value on a
    new line in the alert dialog box.


    ![](img/5f5106681c8c7072e64c4ea87c891513_15_1.png)


    14 | JavaScript in easy steps'
  - '[PAGE 16]


    # Escape sequences


    When a character in a string is preceded by the \backslash character there is
    a special effect on the character immediately following the backslash. This is
    known as an escape sequence as it allows the character to escape recognition as
    part of the JavaScript syntax.


    The table below lists more escape sequences:


    ![](img/5f5106681c8c7072e64c4ea87c891513_16_0.png)


    | | |

    |---|---|

    | \b | Backspace |

    | \f | Form feed |

    | \n | New line |

    | \r | Carriage return |

    | \'' | Single quote |

    | " | Double quote |

    | \ | Single backslash character |


    The escape sequence " is useful to incorporate quotation marks within a string
    without the string itself becoming terminated, as in this example:


    ```

    display the string with escaped quotes

    alert ("We all say "JavaScript is great!" " );

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_16_1.png)'
- md: "\n# Functions\n\nA function is a piece of JavaScript code that can be executed\
    \ once or many times by the JavaScript application. Functions and variables form\
    \ the basis of all JavaScript programming.\n\nThis is how a function looks:\n\n\
    ```javascript\n// a function to display a message in an alert dialog\nfunction\
    \ call_alert() {\n    alert(\"My First JavaScript Function\");\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_17_0.png)\n\
    \nAlways try to give meaningful names to functions and variables, describing their\
    \ purpose.\n\nCreate a new function using the JavaScript function keyword followed\
    \ by a given identifier name. The name must be unique within the script and adhere\
    \ to the same naming conventions that apply to the naming of variables.\n\nThe\
    \ name is always followed by a pair of plain brackets, then a pair of curly brackets\
    \ containing the code to be executed.\n\nIn the example, the function has been\
    \ named call_alert() and the code to be executed will call the JavaScript alert()\
    \ function to display an alert() dialog box containing a message.\n\nThe function\
    \ can be called from anywhere in the JavaScript file or in the HTML document to\
    \ execute the statement that it contains.\n\nFor instance, the onload attribute\
    \ of the HTML <body> tag can be used to call the function when the document is\
    \ loaded into the browser, like this:\n\n```html\n<body onload = \"call_alert()\"\
    >\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_17_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_17_2.png)\n\
    \nRemember to include the plain brackets when referring to a function.\n\n# Function\
    \ arguments\n\nThe plain brackets that follow the name of all functions may be\
    \ used to contain data for use in the code to be executed. Just as the brackets\
    \ of the JavaScript alert() function contain the string to be displayed in the\
    \ alert() dialog box it creates.\n\nThe data contained within the brackets is\
    \ known as the function \"argument\".\n\nIn the example below the function call\
    \ passes a text string to the argument str in the call_alert() function for use\
    \ in the code that is to be executed:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_18_0.png)\n\
    \n```javascript\n// a function to display the value of a passed argument\nfunction\
    \ call_alert( str )\n{\n  alert( str );\n}\n```\n\nIt is important to note that\
    \ string contained inside the call to this function is enclosed in single quotes\
    \ to differentiate it from the double quotes used to contain the entire call:\n\
    \n```html\n<body onload = \"call_alert('Passed Value')\">\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_18_1.png)\n\
    \nstr is used in JavaScript as a variable name for strings.\n\nUsing double quotes\
    \ for both would mean that the onload attribute value would be \"call_alert(\"\
    \ because the string is terminated by the second double quote. This would create\
    \ a browser error and the function would not be executed.\n\nThe use of single\
    \ and double quotes in this manner appears throughout JavaScript programming in\
    \ several ways.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_18_2.png)\n\n# Multiple\
    \ functions\n\nJavaScript functions may call other functions during the execution\
    \ of their code in just the same way that the previous examples called the JavaScript\
    \ alert() function.\n\nThe following example demonstrates the use of multiple\
    \ functions to manipulate and display an integer argument:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_19_0.png)\n\
    \n```javascript\n// a function to call a second function\n// and display a returned\
    \ result\nfunction call_alert( num )\n{\n  var new_number = make_double( num);\n\
    \  alert(\" The Value Is \" + new_number);\n}\n\n// a function to double a value\n\
    // and return the result to the caller\nfunction make_double( num )\n{\n  var\
    \ double_num = num + num;\n  return double_num;\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_19_1.png)\n\
    \nThe argument value is passed from the caller to the make_double() function via\
    \ the call_alert( 4 ) function:\n\n```html\n<body onload = \"call_alert( 4 )\"\
    >\n```\n\nThe value is manipulated by the code in the function body and the result\
    \ is returned to the new_number variable in the call_alert() function using the\
    \ JavaScript return keyword. Finally the alert() function is called to display\
    \ the new_number variable.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_19_2.png)\n\
    \n18 | JavaScript in easy steps **\n\n# Variable scope\n\nThe variables used in\
    \ the example on the facing page are both declared inside a function so they are\
    \ called local variables. Local variables can only be used by the function in\
    \ which they are declared.\n\nConversely, global variables are declared outside\
    \ functions and can be accessed by any function in the same document.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_20_0.png)\n\
    \n```javascript\n// create a global variable\nvar stored_num;\n\n// a function\
    \ to call a second function\n// and display a returned result\nfunction call_alert(\
    \ num )\n{\n  stored_num = num;\n  make_triple();\n  alert(\"The Value Is \" +\
    \ stored_num );\n}\n\n// a function to double a value\n// and return the result\
    \ to the caller\nfunction make_triple()\n{\n  stored_num = stored_num + stored_num\
    \ + stored_num;\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_20_1.png)\n\
    \nAll variables may simply be declared without being initialized with a value.\n\
    \nThis example passes the argument value to a global variable:\n\n```html\n<body\
    \ onload = \"call_alert( 5 )\">\n```\n\nThe second function manipulates the value\
    \ of the global variable before calling alert() to display the new value.\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_20_2.png)\n\n# Multiple arguments\n\n\
    JavaScript functions may contain multiple arguments if they are separated by a\
    \ comma.\n\nThe number of arguments defined when the function is declared must\
    \ be exactly matched by the number of arguments contained in any call to that\
    \ function.\n\nThis example declares a function containing three arguments – so\
    \ any call to it must contain three argument values:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_21_0.png)\n\
    \n```javascript\n// create three variables\nvar a, b, c;\n\n// a function to display\
    \ three concatenated arguments\nfunction call_alert(str1, str2, str3) {\n    a\
    \ = str1;\n    b = str2;\n    c = str3;\n    alert(a + b + c);\n}\n```\n\nmulti-args.js\n\
    \n> HOT TIP: The var keyword can be used to declare multiple variables by separating\
    \ the variable names with comma.\n\nThe caller passes three strings to the function\
    \ although the value of the second string is merely a space:\n\n```html\n<body\
    \ onload = \"call_alert('Great', ' ', 'JavaScript')\">\n```\n\nThe function assigns\
    \ the argument values to three global variables and then calls alert(c) to display\
    \ the global values as a single concatenated string.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_21_1.png)\n\
    \n# Performing operations\n\nAll the common JavaScript operators are detailed\
    \ in this chapter which illustrates by example how to perform arithmetical operations,\
    \ how to assign values and how to make comparisons. The logical operators are\
    \ explained and demonstrated too, along with the conditional operator.\n\n# Covers\n\
    \n- Arithmetical operators | 22\n- Arithmetical examples | 23\n- Logical operators\
    \ | 24\n- Logical examples | 25\n- Assignment operators | 26\n- Assignment examples\
    \ | 27\n- Comparison operators | 28\n- Comparison examples | 29\n- Conditional\
    \ operator | 30\n\n# Chapter Two\n\n# Arithmetical operators\n\nThe arithmetical\
    \ operators used in JavaScript are listed in the table below with the operations\
    \ they perform:\n\n| Operator | Operation |\n| --- | --- |\n| + | Addition (and\
    \ concatenates strings) |\n| - | Subtraction |\n| * | Multiplication |\n| / |\
    \ Division |\n| % | Modulus |\n| ++ | Increment |\n| -- | Decrement |\n\nNotice\
    \ that the + operator has two types of operation depending on the given operands.\
    \ It will add together two numeric values and give the result of the addition.\
    \ It will also join together two string values and return the concatenated string,\
    \ as in the example on the facing page.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_23_0.png)\n\
    \nAn example using the modulus operator to determine odd or even values can be\
    \ found in the if statement on page 32.\n\nThe % modulus operator will divide\
    \ the first number by the second number and return the remainder of the operation.\
    \ This is most useful to determine if a number has an odd or even value.\n\nThe\
    \ ++ increment and decrement operators alter the given value by 1 and return the\
    \ resulting new value. These are most commonly used to count iterations in a loop.\n\
    \nAll the other operators act as you would expect but care be taken to bracket\
    \ expressions where more than one operator is used to clarify the operations:\n\
    \n```javascript\na = b * c - d % e / f ;           // This is unclear\na = (b\
    \ * c) - ((d % e) / f );               // This is clearer\n```\n"
  mdcn: "\n\n# 函数\n\n函数是一段可以被 JavaScript 应用执行一次或多次的 JavaScript 代码。函数和变量构成了所有 JavaScript\
    \ 编程的基础。\n\n函数的格式如下：\n\n```javascript\n// 一个在警报对话框中显示消息的函数\nfunction call_alert()\
    \ {\n    alert(\"My First JavaScript Function\");\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_17_0.png)\n\
    \n始终尝试为函数和变量赋予有意义的名字，描述它们的用途。\n\n使用 JavaScript 的 `function` 关键字后跟给定的标识符名称来创建一个新函数。该名称在脚本中必须是唯一的，并遵循与变量命名相同的命名规范。\n\
    \n名称后面总是跟着一对圆括号，然后是一对包含要执行代码的大括号。\n\n在示例中，该函数被命名为 `call_alert()`，要执行的代码将调用 JavaScript\
    \ 的 `alert()` 函数来显示一个包含消息的 `alert()` 对话框。\n\n该函数可以在 JavaScript 文件或 HTML 文档的任何地方调用，以执行其包含的语句。\n\
    \n例如，HTML `<body>` 标签的 `onload` 属性可以在文档加载到浏览器时调用该函数，如下：\n\n```html\n<body onload\
    \ = \"call_alert()\">\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_17_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_17_2.png)\n\n记住在引用函数时包含圆括号。\n\n# 函数参数\n\
    \n所有函数名称后的圆括号可以包含用于要执行代码的数据。就像 JavaScript `alert()` 函数的括号包含了它创建的 `alert()` 对话框中要显示的字符串一样。\n\
    \n括号内包含的数据被称为函数“参数”（argument）。\n\n在下例示例中，函数调用将一个文本字符串传递给 `call_alert()` 函数中的参数\
    \ `str`，用于要执行的代码：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_18_0.png)\n\n```javascript\n\
    // 一个显示传递的参数值值的函数\nfunction call_alert( str )\n{\n  alert( str );\n}\n```\n\n\
    需要注意的是，调用此函数时内部的字符串包含在单引号中，以区别于用于包含整个调用的双引号：\n\n```html\n<body onload = \"call_alert('Passed\
    \ Value')\">\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_18_1.png)\n\n`str`\
    \ 在 JavaScript 中用作字符串的变量名。\n\n对两者都使用双引号意味着 `onload` 属性的值将变为 `\"call_alert(\"`，因为字符串会被第二个双引号终止。这将导致浏览器错误且函数将不会执行。\n\
    \n这种单引号和双引号的使用在 JavaScript 编程中以多种方式贯穿。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_18_2.png)\n\
    \n# 多多个函数\n\nJavaScript 函数在执行代码期间可以调用其他函数，就像之前的示例调用 JavaScript `alert()` 函数一样。\n\
    \n接下来的示例演示了如何使用多个函数来操作和显示一个整数参数：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_19_0.png)\n\
    \n```javascript\n// 一个调用第二个函数的函数\n// 并显示返回的结果\nfunction call_alert( num )\n{\n\
    \  var new_number = make_double( num);\n  alert(\" The Value Is \" + new_number);\n\
    }\n\n// 一个将值翻倍的函数\n// 并结果返回给调用者\nfunction make_double( num )\n{\n  var double_num\
    \ = num + num;\n  return double_num;\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_19_1.png)\n\
    \n参数值通过 `call_alert( 4 )` 函数从调用者传递给 `make_double()` 函数：\n\n```html\n<body onload\
    \ = \"call_alert( 4 )\">\n```\n\n该值通过函数体中的代码进行处理，结果使用 JavaScript 的 `return` 关键字返回给\
    \ `call_alert()` 函数中的 `new_number` 变量。最后调用 `alert()` 函数显示 `new_number` 变量。\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_19_2.png)\n\n18 | JavaScript 入门 **\n\n\
    # 变量作用域\n\n对页示例中使用的变量都在函数内部声明，因此它们被称为局部变量。局部变量只能由声明它的函数使用。\n\n相反，全局变量声明在函数外部，可以被同一文档中的任何函数访问。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_20_0.png)\n\n```javascript\n// 创建全局变量\n\
    var stored_num;\n\n// 一个调用第二个函数的函数\n// 并显示返回的结果\nfunction call_alert( num )\n\
    {\n  stored_num = num;\n  make_triple();\n  alert(\"The Value Is \" + stored_num\
    \ );\n}\n\n// 一个将值翻倍的函数\n// 并结果返回给调用者\nfunction make_triple()\n{\n  stored_num\
    \ = stored_num + stored_num + stored_num;\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_20_1.png)\n\
    \n所有变量都可以仅声明而不使用值进行初始化。\n\n此示例将参数值传递给全局变量：\n\n```html\n<body onload = \"call_alert(\
    \ 5 )\">\n```\n\n第二个函数在调用 `alert()` 显示新值之前，处理了全局变量的值。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_20_2.png)\n\
    \n# 多个参数\n\n如果 JavaScript 函数之间用逗号隔开，则包含多个参数。\n\n在声明函数时定义的参数数量必须与该函数的任何调用中包含的参数数量完全匹配。\n\
    \n此示例声明了一个包含三个参数的函数——因此任何对它的调用必须包含三个参数值：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_21_0.png)\n\
    \n```javascript\n// 创建三个变量\nvar a, b, c;\n\n// 一个显示三个连接参数的函数\nfunction call_alert(str1,\
    \ str2, str3) {\n    a = str1;\n    b = str2;\n    c = str3;\n    alert(a + b\
