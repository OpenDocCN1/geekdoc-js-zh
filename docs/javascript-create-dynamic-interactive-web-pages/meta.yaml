  md: '# Syntax rules


    Notice that there is a semi-colon character at the end of the JavaScript statement
    on the facing page to comply with the required JavaScript language syntax rules.


    This must be added at the end of every JavaScript statement – in the same way
    that a period is used to terminate a sentence in the English language syntax rules.


    Most importantly, JavaScript is a case-sensitive language where "ALERT", "Alert"
    and "alert" are seen as three different words.


    All JavaScript keywords are in lowercase only so using ALERT("Hello World") or
    Alert("Hello World") in the previous code example would not call the JavaScript
    alert() function.


    Spaces, tabs and new lines are collectively known as whitespace and are completely
    ignored by JavaScript so the code may be formatted and indented to make its appearance
    more easily human-readable.


    ![](img/5f5106681c8c7072e64c4ea87c891513_12_0.png)


    Problems with case can be avoided by using lowercase throughout JavaScript code


    It is often useful to add comments to JavaScript code as explanation. The parser
    sees any text between // and the end of that line as a single-line comment, which
    it ignores. Also any text, on one or more lines, between /* and */ is ignored.


    ```

    /* Here is an introduction

    to this script code that

    uses a multi-line comment */


    // This is a single-line comment


    // Display a greeting

    alert("Hello World\ );

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_12_1.png)


    comments.js


    Excessive commenting is avoided – this can dramatically increase the size of a
    JavaScript file.'
