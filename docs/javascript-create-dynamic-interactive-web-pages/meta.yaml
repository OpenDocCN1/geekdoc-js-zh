  md: '# Browser ID


    The navigator object has properties that provide information about the browser
    that is being used to view a document.


    The browser name is revealed by the navigator.appName property whereas a description
    of that particular version is available from the navigator.userAgent property.


    In addition to the release number the navigator.userAgent property contains other
    details, such as the host platform type.


    In the example below the navigator-userAgent property reveals the browsers to
    be Internet Explorer 6.0 (MSIE 6.0) and Netscape 7.0 running on a Windows XP platform
    (NT5.1):


    ![](img/5f5106681c8c7072e64c4ea87c891513_93_0.png)


    ```

    get the browser name

    var browser = navigator.appName;

    // get the browser description

    var description = navigator.userAgent;

    ndisplay the browser name and version

    alert( browser + "\n\n" + description );

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_93_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_93_2.png)'
