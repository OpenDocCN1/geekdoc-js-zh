  md: "# Multiple arguments\n\nJavaScript functions may contain multiple arguments\
    \ if they are separated by a comma.\n\nThe number of arguments defined when the\
    \ function is declared must be exactly matched by the number of arguments contained\
    \ in any call to that function.\n\nThis example declares a function containing\
    \ three arguments – so any call to it must contain three argument values:\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_21_0.png)\n\n```\ncreate three variables\n\
    var a, b, c;\n\na function to display three concatenated arguments\nfunction call_alert(str1,\
    \ str2, str3) {\n    a = str1;\n    b = str2;\n    c = str3;\n    alert(a + b\
    \ + c);\n}\n```\n\nmulti-args.js\n\n> HOT TIP The var keyword can be used to declare\
    \ multiple variables by separating the variable names with comma.\n\nThe caller\
    \ passes three strings to the function although the value of the second string\
    \ is merely a space:\n\n```\n<body onload = \"call_alert('Great', ' ', 'JavaScript')\"\
    >\n```\n\nThe function assigns the argument values to three global variables and\
    \ then calls alert(c) to display the global values as a single concatenated string.\n\
