  md: "# History\n\nThe window.history property contains an array of the URL addresses\
    \ previously visited during a browser session. For security reasons these are\
    \ not directly readable but they are used to navigate back to previous pages.\n\
    \nThe back() and forward() methods of the window.history object emulate the browser's\
    \ Back and Forward buttons.\n\nMore flexible navigation is often provided by the\
    \ window.history.go() method that takes a single argument to specify the location\
    \ by relative position. For instance, an argument value of -1 will revisit the\
    \ previous page and a value of -2 reopens the page before it.\n\nIn a similar\
    \ manner window.history.go(1) goes forward to the next page in the history array\
    \ of visited URLs.\n\nCalling window.history.go(0) causes the browser to reload\
    \ the current document.\n\nThe function in the example below returns the user\
    \ to the previous page. In this case the function is called from the onclick attribute\
    \ of a button form input in the HTML document.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_102_0.png)\n\
    \n```\n// a function to load the previous page\nfunction go_back() {\n  window.history.go(-1);\n\
    }\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_102_1.png)"
