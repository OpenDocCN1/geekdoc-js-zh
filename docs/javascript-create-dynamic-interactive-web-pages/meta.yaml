    ## Arithmetical examples


    ```javascript

    var addnum = 20 + 30; addition

    var addstr = "I love " + "JavaScript"; // concatenation

    var sub = 35.75 - 28.25; // subtraction

    var mul = 8 * 50; // multiplication

    var mod = 65 % 2; // modulus

    var inc = 5; inc = ++inc; // increment

    var dec = 5; dec = --dec; // decrement

    var result = "Addnum is " + addnum + "\n";

    result += "Addstr is " + addstr + "\n";

    result += "Sub is " + sub + "\n";

    result += "Mul is " + mul + "\n";

    result += "Mod is " + mod + "\n";

    result += "Inc is " + inc + "\n";

    result += "Dec is " + dec + "\n";

    alert(result);

    ```


    The increment and decrement operators may also be used following the operand.
    Note that in those cases they will perform the operation but only return the unoperated
    value.


    2. Performing operations


    ## Logical operators


    The three logical operators that can be used in JavaScript are listed in the table
    below:


    | Operator | Operation |

    | :--- | :--- |

    | && | Logical AND |

    | || | Logical OR |

    | ! | Logical NOT |


    The logical operators are used with operands that have the boolean values of true
    or false – or values that can convert to true or false.


    The logical && operator will evaluate two operands and return true only if both
    operands themselves are true. Otherwise the && operator will return false.


    This is typically used in conditional branching where the direction of a JavaScript
    application is determined by testing two conditions. If both conditions are satisfied
    the script will go in a certain direction otherwise the script will take a different
    direction.


    Unlike the && operator that needs both operands to be true, the || operator will
    evaluate its two operands and return true if either of the operands returns true.
    If neither operand returns true then || will return false. This is useful in a
    JavaScript application to perform a certain action if either of test conditions
    has been met.


    The third logical operator ! is a unary operator that is used before a single
    operand. It returns the inverse value of the given operand, so if the variable
    a had value of true, !a would have a value of false. It is useful in JavaScript
    applications to toggle the value of a variable in successive loop iterations with
    a statement a=!. This will ensure that on each pass the value is changed, like
    flicking a light switch on and off.


    ## Logical examples


    ```javascript

    var a = true, b = false;

    var test1 = (a && a); // test both operands for true

    var test2 = (a && b);

    var test3 = (b && b);

    var test4 = (a || b); // test either operand for true

    var test5 = (a || b);

    var test6 = (b || b);

    var test7 = !a; test8 = !b; // invert values

    var result = "AND \n";

    result += "1: " + test1 + " 2: " + test2 + " 3: " + test3 + "\n";

    result += "\nOR\n";

    result += "4: " + test4 + " 5: " + test5 + " 6: " + test6 + "\n";

    result += "\nNOT\n7: " + test7 + " 8: " + test8;

    alert(result);

    ```


    Use the \n new line escape, and spaces to format the displayed output string.


    2. Performing operations


    ## Assignment operators


    The operators that are commonly used in JavaScript to assign values are all listed
    in the table below. All except the simple = assign operator is a shorthand form
    of a longer expression so each equivalent equivalent is also given for clarity.


    | Operator | Example | Equivalent |

    | :--- | :--- | :--- |

    | = | a = b | a = b |

    | += | a += b | a = (a + b) |

    | -= | a -= b | a = (a - b) |

    | *= | a *= b | a = (a * b) |

    | /= | a /= b | a = (a / b) |

    | %= | a %= b | a = (a % b) |


    It is important to think of the = operator as meaning “assign” rather than “equals”
    to avoid confusion with the == equality operator.


    In the example in the table the variable named a is assigned the value that is
    contained in the variable named b to become its new value.


    The += operator is most useful and has been used in earlier examples to add a
    second string to an existing string. In the table example the += operator adds
    the value contained in variable a to the value contained in the variable named
    b then assigns the result to become the new value contained in variable a.


    All other operators in the table work in the same way – by making the arithmetical
    operation between the two values first, then assigning the result to the first
    variable to become its new value.


    ## Assignment examples


    ```javascript

    var a = "JavaScript", b = " Code"; // assign string values

    a += b; // concatenate strings and assign to a

    var c = 8, d = 4; // assign integer values

    c += d; // add numbers and assign result to c

    var e = 7.5, f = 2.25; // assign float values

    e -= f; // subtract f from e and assign result to e

    var g = 8, h = 4; // assign integer values

    g *= h; // multiply numbers and assign result to g

    var i = 8, j = 4; // assign integer values

    i /= j; // divide i by j and assign result to i

    var k = 8, l = 4; // assign integer values

    k %= 1; // divide k by 1 and assign remainder to k

    ```


    The results are displayed using the alert() function, before, but that the code
    has been omitted to save space.


    2. Performing operations


    ## Comparison operators


    The operators that are commonly used in JavaScript to compare values are all listed
    below:


    | Operator | Comparison |

    | :--- | :--- |

    | == | Equality |

    | != | Inequality |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal |

    | <= | Less than or equal |


    The == operator will return true if both operands are equal. The != operator will
    return true if the operands are not equal.


    The > operator returns true if the first operand is greater than the second. The
    < operator returns true if the first operand is less than the second.


    The >= operator returns true if the first operand is greater than or equal to
    the second. The <= operator returns true if the first operand is less than or
    equal to the second.


    ## Comparison examples


    ```javascript

    // Compare strings

    var teststrings1 = ("JavaScript" == "JavaScript");

    var teststrings2 = ("JavaScript" == "javascript");


    // Compare numbers

    var testnumbers1 = (100 < 200);

    var testnumbers2 = (100 <= 100);


    // Compare boolean

    var testboolean1 = (true == true);

    var testboolean2 = (false == false);

    ```


    ## Conditional operator


    The JavaScript coder''s favorite comparison operator is probably the conditional
    operator. This first evaluates an expression for a true or false value then executes
    one of two statements, depending on the result of the evaluation.


    The conditional operator has this syntax:


    ```javascript

    (test expression) ? if-true-do-this : if-false-do-this ;

    ```


    This operator can often be used to run script functions that are dedicated to
    a particular Web browser following a browser-identification routine. The example
    below is to display a welcome message delivered by browser type:


    ```javascript

    // Is the browser Internet Explorer ?

    var is_ie = browser_id();


    // Display appropriate greeting

    ( is_ie ) ? greet_ie() : greet_other();

    ```'
