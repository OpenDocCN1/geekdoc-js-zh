    \    obj.style.visibility= \"visible\"\n}\n\n// a function to hide a layer\nfunction\
    \ hide_apple() {\n    // reference the layer by id\n    var obj = getElementById(\"\
    layer\")\n    // hide the layer\n    obj.style.visibility= \"hidden\"\n}\n```\n\
    \nThe illustrations on the opposite page demonstrate the effect of this script\
    \ when the user places the cursor over, and off, the hyperlink."
- md: "\n# ...cont'd\n\nThe javascript protocol specifier will appear in the status\
    \ bar in place of a target url address.\n\n13. JavaScript in DHTML\n\n## Dynamic\
    \ content\n\nJavaScript can write content onto a layer without affecting the elements\
    \ elsewhere on the page.\n\nThe position of the layer will remain unaltered but\
    \ the height of the layer will be automatically increased if the content will\
    \ not fit into the existing layer size.\n\nAlso text will automatically wrap intelligently\
    \ at the layer border; words will not be split.\n\nThe JavaScript example for\
    \ this feature will create a layer, then dynamically write the user-entered text\
    \ onto the layer when the user pushes the input button.\n\nAlthough this example\
    \ uses text from user input JavaScript could write layer from any function call.\n\
    \nwrite-js\n\n```html\n<div id='lyr' style='position:absolute;top:90px;left:10px;width:200px;height:10px;z-index:10;background-color:orange;'></div>\n\
    ```\n\n```javascript\nfunction write-js() {\n  // get the string entry\n  var\
    \ str = document.forms.f.txt.value;\n\n  // reference the layer by id\n  var obj\
    \ = document.getElementById(\"lyr\");\n\n  // open the layer document\n  obj.document.open();\n\
    \n  // write the string\n  obj.document.write(str);\n\n  // close the layer document\n\
    \  obj.document.close();\n}\n```\n\nInsert the <script> element to include JavaScripts\
    \ that write layers within the body section of the HTML document.\n\nThe illustrations\
    \ on the facing page demonstrate the effect of this script when the user enters\
    \ a string into the text field then clicks the push button.\n\n..cont'd\n\n13.\
    \ JavaScript in HTML\n\n## Slide show\n\nJavaScript can rotate images to create\
    \ an automatic slide show that will update the current image after a predetermined\
    \ interval.\n\nIn this script a preload routine first downloads all the images\
    \ into the browser's cache to be readily available for display.\n\nRotation speed\
    \ in milliseconds is specified by the value assigned to the variable pause.\n\n\
    The variable named n is a counter that is incremented by the rotate() timer function\
    \ and is used to display the image at that index number in the imgs[] array.\n\
    \nIt is important that all the images should have the same dimensions and be small\
    \ file sizes to avoid download delays.\n\n```javascript\n// store an interval\
    \ in a variable\nvar pause = 3000;\n// create and initialize a counter\nvar n\
    \ = 0;\n// create an array of image file names\nvar imgs = new Array (\"butterfly.gif\"\
    , \"globe.gif\", \"fish.gif\", \"clock.gif\");\n\n// preload all the images\n\
    var preload = new Array();\nfor(var i = 1; i < imgs.length; i++) {\n  preload[i]\
    \ = new Image();\n  preload[i].src = imgs[i];\n}\n```\n\nSimply adding more image\
    \ filenames to the imgs[] array will extend the slide without further coding.\n\
    \n```javascript\n// a function to display each image for the set interval\nfunction\
    \ rotate() {\n  document.images.pic.src = imgs[n];\n  n = (n < imgs.length - 1)\
    \ ? n++ : 0;\n  setTimeout(\"rotate()\", pause);\n}\n\n// specify the onload event-handler\n\
    window.onload = rotate;\n```\n\nThe HTML code used with the JavaScript slide show\
    \ assigns the name pic to the original image – so the script may address the image\
    \ object as document.images.pic:\n\n```html\n<img name=\"pic\" src=\"butterfly.gif\"\
    \ width=\"150\" height=\"150\"/>\n```\n\nEnsure that all images are the actual\
    \ size to be displayed so that the browser does not need to resize them.\n\n##\
    \ Tacking layer\n\nThe left coordinate of a layer object's style can be modified\
    \ by JavaScript to reposition the layer along the X axis.\n\nThe following example\
    \ moves a <div> layer that has an id of boat. This contains a sailboat image just\
    \ the left edge of the window. A timer function sails the boat across the screen.\n\
    \nWhen the boat disappears off the right edge of the window JavaScript swaps the\
    \ image for a pre-loaded version of the sailboat facing in the opposite direction.\
    \ The script then sails it back across the screen from right to left.\n\nWhen\
    \ the boat disappears off the left edge of the window the image reverts to the\
    \ original version that proceeds to sail to right and the boat continues to tack\
    \ and forth.\n\nThe go_right variable determines the direction of travel. It is\
    \ initially set to true but is reversed at each extreme.\n\nThe ext variable stores\
    \ the width of the window according to the script running.\n\nThe set_sail() function\
    \ is initially called from the script to start the routine then is called recursively\
    \ from the function itself.\n\n```javascript\n// preload the image\nvar preload\
    \ = new Image(); preload.src = \"sail_1.gif\";\n// set the initial direction to\
    \ right\nvar go_right = true;\n\n// a function to move a <div> across the page\n\
    function set_sail() {\n  // get the div object\n  var obj = document.getElementById(\"\
    boat\");\n\n  // get the window width\n  var ext;\n  if(document.body.clientWidth)\
    \ ext = document.body.clientWidth;\n  if(window.innerWidth) ext = window.innerWidth;\n\
    \n  // move by 1 pixel in direction\n  if(go_right) \n    obj.style.left = (parseInt(obj.style.left)+1)+\"\
    px\";\n  else\n    obj.style.left = (parseInt(obj.style.left)-1)+\"px\";\n\n \
    \ // change direction at the right extreme\n  if(parseInt(obj.style.left) >= (ext\
    \ + 5)) {\n    go_right=false;\n    document.images.boat_image.src = \"sail_1.gif\"\
    ;\n  }\n\n  // change direction at the left extreme\n  if(parseInt(obj.style.left)\
    \ <= -75) {\n    go_right = true;\n    document.images.boat_image.src = \"sail_r.gif\"\
    ;\n  }\n\n  // set the interval to call this function\n  window.setTimeout(\"\
    set_sail()\", 50);\n}\n\n// start the routine\nset_sail();\n```\n\nThis script\
    \ must be included in the <body> section of the HTML document after the <div>\
    \ element is created.\n\nThe positional pixel values have \"px\" tacked on the\
    \ end (e.g. left=\"70px\") so the `parseInt()` method is needed to extract the\
    \ integer part for manipulation.\n\ntack.js\n\n## Scrolling layer\n\nWhere the\
    \ previous example modified the left property of a layer object's style, this\
    \ example manipulates the layer's top property to move a layer higher or lower\
    \ on the Y axis.\n\nThis example moves a <div> layer that has an id of chopper.\
    \ The layer contains a simple helicopter image.\n\nHTML code adds rollover hyperlinks\
    \ that call JavaScript functions but have a void target.\n\nWhen the user places\
    \ the cursor over the hyperlink \"Soar\" a timer function increments the value\
    \ of the top property so the layer moves vertically higher in the window.\n\n\
    Placing the cursor over the hyperlink \"Sink\" has the opposite effect and lowers\
    \ the layer vertically in the window.\n\nIn each case the timer function is cancelled\
    \ when the cursor moves away from the hyperlink and the movement of the layer\
    \ is discontinued.\n"
  mdcn: "\n\n# ...续\n\njavascript 协议标识符将出现在状态栏中，取代目标 URL 地址。\n\n13. DHTML 中的 JavaScript\n\
    \n## 动态内容\n\nJavaScript 可以向层写入内容，而不影响页面上其他部分的元素。\n\n层的位置将保持不变，但如果内容无法适应现有的层大小，层的高度将自动增加。\n\
    \n此外，文本将在层边界处进行智能自动换行；单词不会被拆分。\n\n此功能的 JavaScript 示例将创建一个层，然后当用户点击输入按钮时，动态地将用户输入的的文本写入到该层中。\n\
    \n尽管此示例使用了来自用户输入的文本，但 JavaScript 可以从任何函数调用中写入层。\n\nwrite-js\n\n```html\n<div id='lyr'\
    \ style='position:absolute;top:90px;left:10px;width:200px;height:10px;z-index:10;background-color:orange;'></div>\n\
    ```\n\n```javascript\nfunction write-js() {\n  // 获取字符串输入\n  var str = document.forms.f.txt.value;\n\
    \n  // 通过 id 引用层\n  var obj = document.getElementById(\"lyr\");\n\n  // 打开层文档\n\
    \  obj.document.open();\n\n  // 写入字符串\n  obj.document.write(str);\n\n  // 关闭层文档\n\
    \  obj.document.close();\n}\n```\n\n在 HTML 文档的 body 部分插入 `<script>` 元素，以包含在 body\
    \ 内写入层的 JavaScript。\n\n对应的插图演示了当用户在文本字段中输入字符串并点击按钮时，此脚本的效果。\n\n..续\n\n13. HTML\
    \ 中的 JavaScript\n\n## 幻灯片\n\nJavaScript 可以旋转图像以创建自动幻灯片，它会在预定的时间间隔后更新当前图像。\n\n\
    在此脚本中，预加载程序首先将所有图像下载到浏览器缓存中，以便随时显示。\n\n以毫秒为单位的旋转速度通过赋值变量 `pause` 的值指定。\n\n变量 `n`\
    \ 是计数器，由 `rotate()` 定时函数增加，并用于显示 `imgs[]` 数组中对应索引的图像。\n\n所有图像应具有相同的尺寸且文件较小，这对于避免下载延迟很重要。\n\
    \n```javascript\n// 将间隔存储在变量中\nvar pause = 3000;\n// 创建并初始化计数器\nvar n = 0;\n//\
    \ 创建图像文件名的数组\nvar imgs = new Array (\"butterfly.gif\", \"globe.gif\", \"fish.gif\"\
    , \"clock.gif\");\n\n// 预加载所有图像\nvar preload = new Array();\nfor(var i = 1; i\
    \ < imgs.length; i++) {\n  preload[i] = new Image();\n  preload[i].src = imgs[i];\n\
    }\n```\n\n只需向 `imgs[]` 数组添加更多图像文件名即可扩展幻灯片，无需进一步编码。\n\n```javascript\n// 在设定间隔内显示每张图像的函数\n\
    function rotate() {\n  document.images.pic.src = imgs[n];\n  n = (n < imgs.length\
    \ - 1) ? n++ : 0;\n  setTimeout(\"rotate()\", pause);\n}\n\n// 指定 onload 事件处理器\n\
    window.onload = rotate;\n```\n\n配合 JavaScript 幻灯片使用的 HTML 代码为原始图像分配了名称 `pic`——因此脚本可以通过\
    \ `document.images.pic` 访问图像对象：\n\n```html\n<img name=\"pic\" src=\"butterfly.gif\"\
    \ width=\"150\" height=\"150\"/>\n```\n\n确保所有图像均为实际显示的尺寸，这样浏览器就无需调整它们的大小。\n\n\
    ## 换向层\n\n层对象样式的左坐标可以通过 JavaScript 修改，以便在 X 轴上对层进行重新定位。\n\n以下示例移动了一个 id 为 `boat`\
    \ 的 `<div>` 层。该层包含一幅位于窗口左边缘的帆船图像。一个定时函数让帆船横跨屏幕。\n\n当帆船从窗口右侧边缘消失时，JavaScript 将图像切换为预先加载的、朝向相反方向的帆船版本。然后，脚本将引导它从右向左再次横跨屏幕。\n\
    \n当帆船从窗口左侧边缘消失时，图像将恢复为原始版本，该版本将继续向右侧航行，帆船继续往回换向行驶。\n\n`go_right` 变量决定移动方向。它最初设置为\
    \ `true`，但在每个极端位置处都会反转。\n\n`ext` 变量根据运行的脚本存储窗口宽度。\n\n`set_sail()` 函数最初从脚本调用以启动程序，然后从函数内部递归调用。\n\
    \n```javascript\n// 预加载图像\nvar preload = new Image(); preload.src = \"sail_1.gif\"\
    ;\n// 设置初始方向为右侧\nvar go_right = true;\n\n// 跨越页面移动 <div> 的函数\nfunction set_sail()\
    \ {\n  // 获取 div 对象\n  var obj = document.getElementById(\"boat\");\n\n  // 获取窗口宽度\n\
    \  var ext;\n  if(document.body.clientWidth) ext = document.body.clientWidth;\n\
    \  if(window.innerWidth) ext = window.innerWidth;\n\n  // 按方向移动 1 像素\n  if(go_right)\
    \ \n    obj.style.left = (parseInt(obj.style.left)+1)+\"px\";\n  else\n    obj.style.left\
    \ = (parseInt(obj.style.left)-1)+\"px\";\n\n  // 在右极点改变方向\n  if(parseInt(obj.style.left)\
    \ >= (ext + 5)) {\n    go_right=false;\n    document.images.boat_image.src = \"\
    sail_1.gif\";\n  }\n\n  // 在左极点改变方向\n  if(parseInt(obj.style.left) <= -75) {\n\
    \    go_right = true;\n    document.images.boat_image.src = \"sail_r.gif\";\n\
    \  }\n\n  // 设置调用此函数的间隔\n  window.setTimeout(\"set_sail()\", 50);\n}\n\n// 启动程序\n\
    set_sail();\n```\n\n此脚本必须包含在 HTML 文档的 <body> 部分，位于创建 `<div>` 元素之后。\n\n位置像素值末尾附加了\
    \ \"px\"（例如 left=\"70px\"），因此需要 `parseInt()` 方法来提取整数部分进行操作。\n\ntack.js\n\n## 滚动层\n\
    \n上一个示例修改了层对象样式的 `left` 属性，而此示例操纵层的 `top` 属性以便在 Y 轴上向上或向下移动。\n\n此示例移动了一个 id 为\
    \ `chopper` 的 `<div>` 层。该层包含一张简单的直升机图像。\n\nHTML 代码增加了悬停链接，这些链接调用 JavaScript 函数但目标为空。\n\
    \n当用户将光标悬停在“Soar”链接上时，一个定时函数增加 `top` 属性的值，使层在窗口中垂直向上移动。\n\n将光标悬停在“Sink”链接上会产生相反的效果，使层在窗口中垂直向下移动。\n\
    \n在每情况下，当光标离开链接时，定时函数会被取消，层的移动也会停止。\n\n"
