    \ to store a timer\n\n```javascript\nvar timer;\n// a function to move a <div>\
    \ layer up the page\nfunction soar() {\n  // get the div object\n  var obj = document.getElementById(\"\
    chopper\");\n\n  // move up by 1 pixel\n  obj.style.top = (parseInt(obj.style.top)-1)+\"\
    px\";\n\n  // set the interval at which to call this function\n  timer = window.setTimeout(soar(),\
