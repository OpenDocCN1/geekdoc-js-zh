  - '[PAGE 9]


    # Introduction


    JavaScript is an interpreted programming language whose interpreter is embedded
    inside Web browser software, such as Microsoft Internet Explorer and Netscape
    Navigator.


    This means that script contained in Web documents can be read by the browser''s
    JavaScript engine whenever the document is loaded into the browser window.


    ![](img/5f5106681c8c7072e64c4ea87c891513_9_0.png)


    In this way, Web documents can be made to respond to the user''s actions and to
    perform dynamic visual effects.


    JavaScript should not be confused with the compiled programming language Java
    from Sun Microsystems, although bearing some resemblance, is a completely different
    language.


    JavaScript appeared in December 1995 and was initially called LiveScript, although
    the name was soon changed for marketing reasons.


    The JavaScript language contains many impressive features but for security reasons
    it cannot read or write files, with the exception of cookie files that store a
    small amount of data.


    This book is concerned with the core and client-side features of JavaScript that
    are most useful in the creation of interactive Web pages.


    It is important to learn the basics – so the mechanics of the language are covered
    first in chapters that explain, by example, how to write JavaScript programs.


    Then the browser Document Object Model (DOM) is introduced to illustrate how all
    Web pages contain objects with properties that can be manipulated by JavaScript.


    Combining JavaScript with knowledge of the DOM allows the creation of powerful
    Dynamic HTML (DHTML) effects.


    The final part of this book contains examples of JavaScript in use to create popular
    DHTML effects, together with full source code that can be used on any Web page.'
- md: "\n# Including JavaScript in HTML\n\nIn order to include JavaScript in a Web\
    \ document a script block can be defined within the HTML code.\n\nThe script block\
    \ may be defined anywhere within the HTML code although the usual place is inside\
    \ the head section of the document, between the `<head>` and `</head>` tags.\n\
    \nWhen a browser loads a document it reads (parses) sequentially. So placing the\
    \ script block in the head of the document ensures that the JavaScript code is\
    \ parsed before the rest of the HTML code and document's body content.\n\nA script\
    \ block looks like this:\n\n```\n<script type = \"text/javascript\">\n</script>\n\
    ```\n\nThe actual code could be added between the HTML `<script>` and `</script>`\
    \ tags.\n\nAlternatively, JavaScript code may be separated from the HTML code\
    \ by writing all the JavaScript code inside a JavaScript file. This is simply\
    \ a text document, that is saved with a `.js` extension, and contains no HTML\
    \ tags whatsoever.\n\nThe script reference should still be placed in the document\
    \ section with an `src` attribute pointing the browser to the URL address of JavaScript\
    \ file, like in this example:\n\n```\n<script type = \"text/javascript\" src =\
    \ \"mycode.js\">\n</script>\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_10_0.png)\n\
    \nNotice that the `<script>` closing tag is still required.\n\nThis is a better\
    \ method than writing the code in a script block within the HTML document as it\
    \ makes the code easier to maintain, avoids conflicts between JavaScript and XML,\
    \ and allows the JavaScript code to be accessible to several HTML documents.\n\
    \nAll the JavaScript examples listed in this book are written in JavaScript files\
    \ that are named as their HTML counterpart. For instance, `hello.html` calls upon\
    \ the JavaScript code in `hello.js`.\n\nTo make a JavaScript alert dialog box\
    \ appear is just a matter of calling the intrinsic JavaScript alert() function,\
    \ like this:\n\n```\nalert(\"Hello World\");\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_11_0.png)\n\
    \nThis script can now be included in an HTML document by adding a <script> element\
    \ specifying its type and URL address:\n\n```html\n<head>\n  <title>Hello World</title>\n\
    \  <script type=\"text/javascript\" src=\"hello-alert.js\"></script>\n</head>\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_11_1.png)\n\nWhen this document\
    \ is loaded into the Web browser the JavaScript engine implements the instructions\
    \ contained in the JavaScript code.\n\nIn this case, the JavaScript code causes\
    \ the browser to open an alert() dialog box bearing the message contained within\
    \ the quotation marks inside the brackets.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_11_2.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_11_3.png)\n\nThe quotation marks inside\
    \ the brackets do not appear as part of the message because they are just used\
    \ by JavaScript to denote a string of characters that is the text content of the\
    \ message itself.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_11_4.png)\n\nAll\
    \ text strings in JavaScript are contained in this way.\n\n# Syntax rules\n\n\
    Notice that there is a semicolon at the end of every JavaScript statement to comply\
    \ with the required language rules – in the same way that a period is used to\
    \ terminate a sentence in the English language rules. Most importantly, JavaScript\
    \ is a case-sensitive language where \"ALERT\", \"Alert\" and \"alert\" are seen\
    \ as different words. All JavaScript keywords are in lowercase only so using ALERT(\"\
    Hello World\") or Alert(\"Hello World\") in the code would not call the JavaScript\
    \ alert() function. Spaces, tabs and new lines are collectively known as whitespace\
    \ and are completely ignored by JavaScript so the code may be formatted and indented\
    \ to make its appearance easily readable. Problems with case can be avoided by\
    \ using lowercase throughout code. It is often useful to add comments as explanation.\
    \ The parser sees any text between // and the end of that line as a single-line\
    \ comment, which it ignores. Also any text, on one or more lines, between /* and\
    \ */ is ignored as a multi-line comment.\n\n```javascript\n/* Here is an introduction\
    \ to this script code */\n// This is a single-line comment\n// Display a greeting\n\
    alert(\"Hello World\");\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_12_1.png)\n\
    \nExcessive commenting is avoided – this can dramatically increase the size of\
    \ JavaScript file.\n\n# Keywords\n\nThe following table contains the keywords\
    \ that are part of the JavaScript language. These may not be used when choosing\
    \ identifier names for variables, functions or labels:\n\n| break | do | function\
    \ | null | typeof |\n|---|---|---|---|---|\n| case | else | if | return | var\
    \ |\n| continue | export | import | switch | void |\n| default | false | in |\
    \ this | while |\n| delete | for | new | true | with |\n\nAdditionally, JavaScript\
    \ reserves all the words listed in the table below for future inclusion into the\
    \ JavaScript syntax – so too may seem a lot of words to avoid is seldom a real\
    \ problem – it’s just a point to remember.\n\n| abstract | debugger | goto | package\
    \ | synchronized |\n|---|---|---|---|---|\n| boolean | double | implements | private\
    \ | throw |\n| byte | enum | instanceof | protected | throws |\n| catch | extends\
    \ | int | public | transient |\n| char | final | interface | short | try |\n|\
    \ class | finally | long | static | |\n| const | float | native | super | |\n\n\
    # Variables\n\nWhen naming variables any letter, digit and the underscore character\
    \ _ may be used but the variable name may not begin with a digit. These are all\
    \ valid variable names:\n\n```javascript\nabc\nmy_first_variable\nvar123\n```\n\
    \nCreate a new variable using the JavaScript var keyword:\n\n```javascript\ncreate\
    \ a variable and assign a string to it\nvar message = \"My First JavaScript Variable\"\
    ;\n// display the value stored in the variable\nalert( message );\n```\n\nThe\
    \ text string is stored inside the variable named message. The variable name is\
    \ used in the call to the JavaScript alert() function that opens an alert dialog\
    \ box displaying the string that is stored in the message variable.\n\n# Data\
    \ types\n\nJavaScript is a loosely typed language so its variables can store numbers,\
    \ text strings or boolean values (ie. true or false). This is unlike other programming\
    \ languages such as C++ and Java that need to declare variables of a specific\
    \ data type and can only then store data of the declared type.\n\n```javascript\n\
    // initialize a number variable\nvar a = 0.06;\n// initialize a string\nvar b\
    \ = \"JavaScript in easy steps\";\n// initialize a boolean variable\nvar c = false;\n\
    // display the data type of each variable\nalert(typeof a + \"\\n\" + typeof b\
    \ + \"\\n\" + typeof c);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_15_0.png)\n\
    \nNotice that JavaScript makes no distinction between integer numbers and floating-point\
    \ numbers. The example above creates variables with initial values of the three\
    \ types supported by JavaScript. These three values are first passed to the alert()\
    \ function, then the JavaScript keyword typeof is used to return their data types\
    \ for display in the alert box below. The code \"\\n\" inside the brackets just\
    \ displays the output for each value on a new line in the alert box.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_15_1.png)\n\
    \n# Escape sequences\n\nWhen a character in a string is preceded by the \\ character\
    \ there is a special effect on the character immediately following the backslash.\
    \ This is known as an escape sequence as it allows the character to escape recognition\
    \ as part of the JavaScript syntax. The table below lists more escape sequences:\n\
    \n| | |\n|---|---|\n| \\b | Backspace |\n| \\f | Form feed |\n| \\n | New line\
    \ |\n| \\r | Carriage return |\n| \\' | Single quote |\n| \" | Double quote |\n\
    | \\ | Single backslash character |\n\nThe escape sequence \" is useful to incorporate\
    \ quotation marks within a string without the string itself becoming terminated,\
    \ as in this example:\n\n```javascript\ndisplay the string with escaped quotes\n\
    alert (\"We all say \\\"JavaScript is great!\\\" \" );\n```\n"
  mdcn: "\n\n# 在 HTML 中引入 JavaScript\n\n为了在 Web 文档中引入 JavaScript，可以在 HTML 代码中定义脚本块（script\
    \ block）。\n\n脚本块可以定义在 HTML 代码的任何位置，尽管通常位于文档的 `head` 部分，即 `<head>` 和 `</head>`\
    \ 标签之间。\n\n当浏览器加载文档时，它会按顺序读取（解析）。因此，将脚本块放在文档的 `head` 中可以确保 JavaScript 代码在其余 HTML\
    \ 代码和文档 `body` 内容之前被解析。\n\n脚本块看起来像这样：\n\n```\n<script type = \"text/javascript\"\
    >\n</script>\n```\n\n实际代码可以添加到 HTML 的 `<script>` 和 `</script>` 标签之间。\n\n或者，也可以将所有的\
    \ JavaScript 代码写在一个 JavaScript 文件中，从而将 JavaScript 代码与 HTML 代码分离。这仅仅是一个文本文档，以 `.js`\
    \ 扩展名保存，且不包含任何 HTML 标签。\n\n脚本引用仍应放置在文档的某个部分，并使用 `src` 属性将浏览器指向 JavaScript 文件的\
    \ URL 地址，如下例所示：\n\n```\n<script type = \"text/javascript\" src = \"mycode.js\"\
    >\n</script>\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_10_0.png)\n\n注意，仍然需要\
    \ `<script>` 闭合标签。\n\n这种方法比在 HTML 文档的脚本块中编写代码更好，因为它使代码更易维护，避免了 JavaScript 和 XML\
    \ 之间的冲突，并允许 JavaScript 代码被多个 HTML 文档访问。\n\n本书中列出的所有 JavaScript 示例都编写在 JavaScript\
    \ 文件中，文件名与其对应的 HTML 文件相同。例如，`hello.html` 调用 `hello.js` 中的 JavaScript 代码。\n\n要显示\
    \ JavaScript 警告对话框，只需调用内置的 JavaScript `alert()` 函数，如下：\n\n```javascript\nalert(\"\
    Hello World\");\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_11_0.png)\n\n\
    现在可以通过添加指定类型和 URL 地址的 `<script>` 元素将此脚本包含在 HTML 文档中：\n\n```html\n<head>\n  <title>Hello\
    \ World</title>\n  <script type=\"text/javascript\" src=\"hello-alert.js\"></script>\n\
    </head>\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_11_1.png)\n\n当此文档加载到\
    \ Web 浏览器时，JavaScript 引擎会执行 JavaScript 代码中包含的指令。\n\n在这种情况下，JavaScript 代码会导致浏览器打开一个\
    \ `alert()` 对话框，带有括号内包含的消息。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_11_2.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_11_3.png)\n\n括号内的引号不会作为消息的一部分出现，因为它们仅被\
    \ JavaScript 用于表示字符字符串，该字符串是消息本身的文本内容。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_11_4.png)\n\
    \nJavaScript 中的所有文本字符串都是以这样包含的。\n\n# 语法规则\n\n注意，每个 JavaScript 语句末尾都有分号，以符合所需的语言规则——就像英语规则中使用句号来结束句子一样。最重要的是，JavaScript\
    \ 是一种区分大小写的语言，\"ALERT\"Alert\" 和 \"alert\" 被视为不同的单词。所有的 JavaScript 关键字仅全小写，因此在代码中使用\
    \ `ALERT(\"Hello World\")` 或 `Alert(\"Hello World\")` 不会调用 JavaScript `alert()`\
    \ 函数。空格、制表符和换行统称为空白字符，JavaScript 完全忽略它们，因此可以对代码进行格式化和缩进，使其易于阅读。通过在整个代码中使用小写可以避免大小写问题。添加注释作为说明通常很有用。解析器将\
    \ `//` 到该行结束之间的任何文本视为单行注释，并会忽略它。同样，`/*` 和 `*/` 之间的一个或多行的任何文本也被作为多行注释被忽略。\n\n```javascript\n\
    /* 这里是对此脚本代码的介绍 */\n// 这是一个单行注释\n// 显示问候语\nalert(\"Hello World\");\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_12_1.png)\n\
    \n应避免过度的注释——这会大大增加 JavaScript 文件的大小。\n\n# 关键字\n\n下表包含了 JavaScript 语言的关键字。在为变量、函数或标签选择标识符名称时，不能使用这些词：\n\
    \n| break | do | function | null | typeof |\n|---|---|---|---|---|\n| case | else\
    \ | if | return | var |\n| continue | export | import | switch | void |\n| default\
    \ | false | in | this | while |\n| delete | for | new | true | with |\n\n此外，JavaScript\
    \ 预留了下表列出的所有单词以备未来纳入 JavaScript 语法——虽然需要避免的单词看起来很多，但这很少是一个真实的问题——这只是需要记住的一。\n\n\
    | abstract | debugger | goto | package | synchronized |\n|---|---|---|---|---|\n\
    | boolean | double | implements | private | throw |\n| byte | enum | instanceof\
    \ | protected | throws |\n| catch | extends | int | public | transient |\n| char\
    \ | final | interface | short | try |\n| class | finally | long | static | |\n\
    | const | float | native | super | |\n\n# 变量\n\n在命名变量时，可以使用任何字母、数字和下划线字符 `_`，但变量名不能与数字开头。这些都是有效的变量名：\n\
    \n```javascript\nabc\nmy_first_variable\nvar123\n```\n\n使用 JavaScript `var` 关键字创建一个新变量：\n\
    \n```javascript\n// 创建一个变量并赋值一个字符串\nvar message = \"My First JavaScript Variable\"\
    ;\n// 显示存储在变量中的值\nalert( message );\n```\n\n文本字符串存储在名为 `message` 的变量中。在调用 JavaScript\
    \ `alert()` 函数时使用了该变量名，打开警告对话框显示存储在 `message` 变量中的字符串。\n\n# 数据类型\n\nJavaScript\
    \ 是一种弱类型语言，因此它的变量可以存储数字、文本字符串或布尔值（即 true 或 false）。这不像 C++ 和 Java 等编程语言，它们需要声明特定类型的变量才能存储相应类型的数据。\n\
    \n```javascript\n// 初始化数字变量\nvar a = 0.06;\n// 初始化字符串\nvar b = \"JavaScript in\
    \ easy steps\";\n// 初始化布尔变量\nvar c = false;\n// 显示每个变量的数据类型\nalert(typeof a +\
    \ \"\\n\" + typeof b + \"\\n\" + typeof c);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_15_0.png)\n\
    \n注意，JavaScript 不区分整数和浮点数。上面的示例创建了 JavaScript 支持的三类型变量。这三个值首先传递给 `alert()` 函数，然后使用\
    \ JavaScript 关键字 `typeof` 返回它们的数据类型以便在对话框中显示。括号内的代码 `\"\\n\"` 用于在对话框中换行显示每个值的输出。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_15_1.png)\n\n# 转义序列\n\n当字符串中的字符前面有一个\
    \ `\\` 字符时，它会对紧随其后的字符产生特殊影响。这被称为转义序列，因为它允许该字符逃逸对 JavaScript 语法部分的识别。下表列出了更多转义序列：\n\
    \n| | |\n|---|---|\n| \\b | 退格符 |\n| \\f | 分页符 |\n| \\n | 换行符 |\n| \\r | 回车 |\n\
    | \\' | 单引号 |\n| \" | 双引号 |\n| \\ | 单反斜杠字符 |\n\n转义序列 `\"` 有助于在字符串内部包含引号而不会导致字符串本身终止，如下例：\n\
    \n```javascript\n// 显示带有转义引号的字符串\nalert (\"We all say \\\"JavaScript is great!\\\
    \" \" );\n```\n\n"
