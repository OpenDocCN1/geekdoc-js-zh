    \n![](img/5f5106681c8c7072e64c4ea87c891513_116_3.png)\n\n# Images array\n\nThe\
    \ `window.document.images[]` object is an array of all image objects contained\
    \ within a Web page – in the order in which the HTML code added to the page so\
    \ the first listed image is allocated to the first array element and can be addressed\
