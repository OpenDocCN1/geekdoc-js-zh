  md: "# Error handling\n\nA custom error-handling function may be assigned to the\
    \ `window.onerror` object to deal with runtime errors.\n\nWhen the browser meets\
    \ it it looks for it in the script, but if none is found, it will handle the error\
    \ itself by opening the browser error dialog box.\n\nOnce the error has been notified\
    \ a `true` value is returned to the browser to indicate that the error has been\
    \ dealt with.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_111_0.png)\n\nTo avoid\
    \ all error dialogs a custom error-handler function need only return `true` when\
    \ an error is encountered.\n\nUsefully the browser will pass three arguments to\
    \ the error-handler containing information on the nature of the error, the URL\
    \ of the file that contains the error, and the actual line number in that file\
    \ where the error exists.\n\nIn the example below each piece of error information\
    \ passed to the error-handling function by the browser is displayed for the user:\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_111_1.png)\n\n```\n// declare an error-handling\
    \ function\nwindow.onerror = errorHandler;\n\n// define the error-handling function\n\
    function errorHandler(msg, url, ln) {\n    alert(\"Error: \"+msg+ \"\\nIn File:\"\
    +url+\"\\nAt Line:\"+ln\");\n    return true; // tell the browser it's been handled\n\
    }\n```\n\n```\n// This is a deliberate mistake\ndocument.form[theMistake].value\
    \ = \"pushButton\";\n```\n\n[JavaScript Application]\nError: theMistake is not\
    \ defined\nIn File:http://localhost/error.js\nAt Line:12\n[OK]"
