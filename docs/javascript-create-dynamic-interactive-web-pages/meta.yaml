    The JavaScript eval() function accepts as argument a string containing JavaScript
    code which it evaluates, then returns the resulting value.


    If the code string contains statements they will be executed by the eval() function,
    then the final value will be returned.


    While this function is a powerful feature of the JavaScript language it most often
    used to introduce variable values into a string.


    In the example below script assigns a string value to be displayed in a text input
    within a form that simply has the id of f. The HTML <input> element has been named
    textField.


    The <script> element to include this JavaScript must appear in the HTML document
    after the form elements so that the text field created before the script assigns
    a value to it.


    The text box and the display string are stored in variables that are evaluated
    by the eval() function.


    ![](img/5f5106681c8c7072e64c4ea87c891513_86_0.png)


    ```

    store the text input name

    var input = "textField";

    ```


    ```

    store the string to assign

    var inputtext = "JavaScript Text\";

    ```


    ```

    evaluate the assignment expression

    eval("document.forms.f."+inputname+").value="+inputtext");

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_86_1.png)


    Remember to escape the quotes inside a string to avoid error messages.


    Now the text string is displayed in the text field because the expression evaluates
    to:


    ```

    document.forms.f.textField.value = "JavaScript Text";

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_86_2.png)


    7. Working with strings | 85'
  - "[PAGE 87]\n\n# Encoding strings\n\nAll characters have a Unicode numerical representation\
    \ that can be returned for each individual character in a string with the string.charCodeAt()\
    \ method. This method requires the index of the character within the string as\
    \ its argument.\n\nConversely characters can be extracted from Unicode using the\
    \ JavaScript String.fromCharCode() function that takes the Unicode numeric value\
    \ as its argument.\n\nThe example below first loops through a string and makes\
    \ a comma delimited string of its Unicode character values. An array of these\
    \ Unicode numeric values is then created for the second loop to return the character\
    \ for each number:\n\n```\n// create and initialize three strings\nvar str = \"\
    Code Fun\", enc = \"\", unc = \"\";\n\n// get the str Unicode numbers, comma delimited\n\
    for(var i = 0; i < str.length; i++) {\n  enc += str.charCodeAt( i ) + \",\";\n\
    }\n\n// split the list of numbers into array elements\nvar ss = enc.split(\",\"\
    );\n\n// convert the Unicode values back to characters\nfor(var i = 0; i < ss.length;\
    \ i++) {\n  unc += String.fromCharCode( ss[i] );\n}\n\nalert(\"Encoded: \" +enc\
    \ + \"\\nUnencoded: \" +unc );\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_87_0.png)\n\
    \n> Notice that the fromCharCode() function is a property of the String() constructor\
    \ and is not a string method.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_87_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_87_2.png)\n\n86 | JavaScript in easy\
    \ steps **"
