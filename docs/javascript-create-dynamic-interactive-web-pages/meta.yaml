  - '[PAGE 46]


    # Array elements


    Each value held in an array is called an array element.


    When a variable is given array status using the new Array() constructor it also
    gets properties and methods that can be used to manipulate the elements contained
    in the array.


    ![](img/5f5106681c8c7072e64c4ea87c891513_46_0.png)


    One of the most useful these is the length property that may be used to report
    the number of elements that the array currently contains.


    The syntax to use a property or method just tacks a period and the name onto the
    object. So Array.length references the length property of the array object.


    Notice that an array containing three values will have a length of 3, but because
    indexing starts at zero the last element in the array will have an index number
    of only 2.


    The example below demonstrates this point:


    ```

    var a = new Array();

    a[0] = "JAVASCRIPT \na[1] = "ARRAY";

    a[2] = "LENGTH";

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_46_1.png)


    ```

    get the array length

    arraysize = a.length;

    alert(a[0]+a[1]+a[2]+"No.of.elements is "+arraysize");

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_46_2.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_46_3.png)


    4. Using arrays | 45'
  - "[PAGE 47]\n\n# Fill elements loop\n\nAll types of loops can be used to easily\
    \ fill the elements of an array with a large number of data values. This is one\
    \ of the major attractions of arrays and it is achieved with very little code.\n\
    \nThe example below first creates an array then, on each iteration, the for loop\
    \ fills each of the array elements with a string value to which is added the current\
    \ counter value.\n\nEach element value is concatenated in the variable named str\
    \ before displaying in the alert() dialog box:\n\n```\nvar str = \"FILL ELEMENTS\
    \ LOOP\\n\\n\";\ncreate a new array\nvar arr = new Array();\n\n// fill eight array\
    \ elements\nfor(var i = 0; i < 8; i++) {\n  arr[i] = \"Number is \" + i + \"\\\
    n\";\n  str += arr[i];\n}\n\n// display the value stored in each array element\n\
    nalert(str);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_47_0.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_47_1.png)\n\
    \nThis code could just easily be used to fill 100 elements by making the conditional\
    \ value of 8 into 100.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_47_2.png)"
- md: "\n# Adding more elements\n\nAdditional elements can be added to an array, without\
    \ specifying an actual index number, by using the `array.length` property to find\
    \ the next available empty element.\n\nBecause the `array.length` value exceeds\
    \ the last index number by one it will always specify the next free element when\
    \ it is used as the index number – between the square brackets.\n\nThe example\
    \ below illustrates when assigning the integer 4 to the next free element in the\
    \ array named **a**.\n\nThe **b** array elements are initialized, then the **for**\
    \ loop successfully assigns the **b** array element values to each free element\
    \ in the **a** array.\n\nFinally all **a** array elements are displayed by the\
    \ `alert()` function in concatenated form by the `array.concat()` method.\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_48_0.png)\n\n```javascript\nvar a = new\
    \ Array(1, 2, 3 );\n// insert an integer into the next empty element\na[a.length]\
    \ = 4; // a.length is 3\n\nvar b = new Array(5, 6, 7 );\n// copy each b element\
    \ value into the empty a elements\nfor(var i = 0; i < b.length; i++) {\n  a[a.length]\
    \ = b[i];\n}\n// display all a element values\nalert( a.concat() );\n```\n\nThe\
    \ method `array.concat()` will display all the element values in an array, separated\
    \ by commas,\n\n![](img/5f5106681c8c7072e64c4ea87c891513_48_1.png)\n\n![](img/5f5106681c8c7072e64c4ea)\n\
    \n# String of elements\n\nThe JavaScript array.join() method will convert all\
    \ array elements to strings and concatenate them.\n\nUsed without arguments this\
    \ will return a list of all the array element values separated by commas, like\
    \ the array.concat() method on the previous page.\n\nBut the array.join() method\
    \ can accept an optional argument to specify an alternative separator to the default\
    \ comma separator.\n\nMostfully this can be a space so that result of the array.join()\
    \ method will be a single string with space separators, as illustrated in the\
    \ example below:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_49_0.png)\n\n```javascript\n\
    create a new array\nvar a = new Array();\n\n// put a word in seven array elements\n\
    a[0] = \"It\"\na[1] = \"isn\\t\"\na[2] = \"rocket\"\na[3] = \"science -\"\na[4]\
    \ = \"it's\"\na[5] = \"just\"\na[6] = \"JavaScript\"\n\n// display all words in\
    \ the array, separated by a space\nalert(a.join(\" \"));\n```\n\nEscape the single\
    \ quotes with a \\ backslash to avoid errors.\n\n![](img/5f5106681c8c7072e64c4ea)\n\
    \n# Reverse element order\n\nArrays can be used to contain a file name or complete\
    \ URL in each element for use with dynamic features in Web pages.\n\nOne popular\
    \ use is with JavaScript slide shows that rotate a series of images with a specified\
    \ interval between each one.\n\nAn array is used to hold the URL of each image\
    \ in its elements so that the script can easily reference them by array index.\n\
    \nIf the slide show is required to reverse after displaying the final image, rather\
    \ than start over at the first image, this can be achieved by reversing the element\
    \ order inside the array.\n\nThe following example creates an initial array of\
    \ just three images whose order will be reversed after the final image displays\
    \ and the rev variable is set to true:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_50_0.png)\n\
    \n```javascript\n// create a new array of image URLs\nvar imgs = new Array(\"\
    img1.gif\", \"img2.gif\", \"img3.gif\");\n```\n\n![](img/5f5106681c8c7072e64c4ea)\n\
    \n```javascript\n// control variable\nvar rev = false;\n```\n\n```javascript\n\
    // when the slideshow displays the final image\n// reverse the order\nrev = true;\n\
    ```\n\n```javascript\nif (rev == true) {\n  imgs.reverse();\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea)\n\
    \n```javascript\ndisplay the reversed element order\nalert(imgs.join(\" - \")\
    \ + \" - \");\n```\n\n![](img/5f5106681c8c7072e64c4)\n\n# Sub-arrays\n\nThe JavaScript\
    \ array.slice() method is useful to make a new array from an existing array using\
    \ some of the existing element values.\n\nThis method takes two-optional arguments\
    \ to specify the index numbers of elements in the original array where the new\
    \ array elements should start and end.\n\nThe second argument may have a negative\
    \ value to indicate the element position from the end of the array.\n\nIf only\
    \ a single argument is specified it will be used as the first element index number\
    \ and the method will return a new array with all elements from this position\
    \ onwards.\n\nThese examples illustrate the different ways in which the array.slice()\
    \ method can be used:\n\n```javascript\ncreate and initialize a new array\nvar\
    \ nums = new Array(1, 2, 3, 4, 5, 6, 7, 8);\n\nget elements #2 up #4\nvar str\
    \ = \"Slice A: \" + nums.slice(2, 4) + \"\\n\"\n\nget elements #1 to one before\n\
    str += \"Slice B: \" + nums.slice(1, -1) + \"\\n\"\n\nget elements #3 to end\n\
    str += \"Slice C: \" + nums.slice(3 ) + \"\\n\"\n\ndisplay all three slices\n\
    alert(str);\n```\n\nThe array elements are taken up to, but not including, the\
    \ second argument index.\n\n![](img/5f5106681c8c7072e64c4ea)\n\n![](img/5f5106681c8c7072e64c4)\n\
    \n# Arrange elements\n\nThe JavaScript array.sort() method allows element values\
    \ to be arranged.\n\nThis is sometimes desirable to sort the array in ascending\
    \ order, as seen in the following example:\n\n```javascript\n// create an array\
    \ of integers\nvar integers = new Array(3, 8, 1, 9, 7, 5, 4, 6);\nintegers.sort();\n\
    \n// create an array of floating-point numbers\nvar floats = new Array(0.5, 0.8,\
    \ 0.12, 0.75, 0.2);\nfloats.sort();\n\n// create an array of strings\nvar strings\
    \ = new Array(\"Michael\", \"Andrew\", \"David\");\nstrings.sort();\n\n// separate\
    \ the elements with a hyphen\nvar str = \"Integers array: \" + integers.join(\"\
    \ - \");\nstr += \"\\nFloats array: \" + floats.join(\" - \");\nstr += \"\\nStrings\
    \ array: \" + strings.join(\" - \");\n// display the result\nalert(str);\n```\n\
    \n![](img/5f5106681c8c7072e64c4)\n\n![](img/5f5106681c8c7072e64c4)\n"
  mdcn: "\n\n# 添加更多元素\n\n可以使用 `array.length` 属性找到下一个空空元素，在不指定实际索引数字的情况下向数组添加额外元素。\n\
    \n由于 `array.length` 的值比最后一个索引大一，当它被用作索引（方括号之间）时，它始终指向下一个空元素。\n\n下面的示例说明了如何将整数\
    \ 4 赋值给名为 **a** 的数组中的下一个空元素。\n\n**b** 数组元素被初始化，然后 **for** 循环成功地将 **b** 数组元素值分配给\
    \ **a** 数组中的每个空元素。\n\n最后，通过 `array.concat()` 方法以连接的形式由 `alert()` 函数显示 **a** 数组的所有元素。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_48_0.png)\n\n```javascript\nvar a =\
    \ new Array(1, 2, 3 );\n// 在下一个空元素中插入一个整数\na[a.length] = 4; // a.length 为 3\n\n\
    var b = new Array(5, 6, 7 );\n// 将每个 b 元素值复制到 a 空元素中\nfor(var i = 0; i < b.length;\
    \ i++) {\n  a[a.length] = b[i];\n}\n// 显示所有 a 元素值\nalert( a.concat() );\n```\n\
    \n`array.concat()` 方法将显示数组中的所有元素值，并用逗号分隔\n\n![](img/5f5106681c8c7072e64c4ea87c891513_48_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4)\n\n# 元素字符串\n\nJavaScript array.join() 方法将所有数组元素转换为字符串并拼接。\n\
    \n如果不带参数使用，它将返回由逗号分隔的所有数组元素值列表，类似于上一页的 array.concat() 方法。\n\n但 array.join() 方法可以接受一个可选参数，用于指定替代默认逗号分隔符的备分隔符。\n\
    \n非常有用的是这可以是空格，这样 array.join() 方法的结果将是一个带有空格分隔符的单一字符串，如下例所示：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_49_0.png)\n\
    \n```javascript\n创建一个新数组\nvar a = new Array();\n\n// 在七个数组元素中放入单词\na[0] = \"It\"\
    \na[1] = \"isn\\t\"\na[2] = \"rocket\"\na[3] = \"science -\"\na[4] = \"it's\"\n\
    a[5] = \"just\"\na[6] = \"JavaScript\"\n\n// 显示数组中的所有单词，用空格分隔\nalert(a.join(\"\
    \ \"));\n```\n\n使用反斜杠 \\ 转义单引号以避免错误。\n\n![](img/5f5106681c8c7072e64cea)\n\n# 反转元素顺序\n\
    \n数组可以用于每个元素中包含文件名或完整 URL，用于 Web 页面中的动态功能。\n\n一个流行的用途是用于 JavaScript 幻灯片，它以指定的间隔旋转一系列图像。\n\
    \n使用数组将每个图像的 URL 存储在元素中，以便脚本可以通过数组索引轻松引用它们。\n\n如果要求幻灯片在显示最后一张图像后反转而不是从第一张图像重新开始，可以通过反转数组内部元素的顺序来实现。\n\
    \n下面的示例创建了一个仅包含三个图像的初始数组，在最后图像显示且 rev 变量设置为 true 之后，其顺序将反转：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_50_0.png)\n\
    \n```javascript\n// 创建一个新的图像 URL 数组\nvar imgs = new Array(\"img1.gif\", \"img2.gif\"\
    , \"img3.gif\");\n```\n\n![](img/5f5106681c8c7072e64cea)\n\n```javascript\n//\
    \ 控制变量\nvar rev = false;\n```\n\n```javascript\n// 当幻灯片显示最后一张图像时\n// 反转顺序\nrev\
    \ = true;\n```\n\n```javascript\nif (rev == true) {\n  imgs.reverse();\n}\n```\n\
    \n![](img/5f5106681c8c7072e64c4ea)\n\n```javascript\n// 显示反转后的元素顺序\nalert(imgs.join(\"\
    \ - \") + \" - \");\n```\n\n![](img/5f5106681c8c7072e64c4)\n\n# 子数组\n\nJavaScript\
    \ array.slice() 方法非常有用，可以使用一些现有元素值从现有数组创建一个新数组。\n\n该方法接受两个可选参数，用于指定原始数组中新数组元素开始和结束的元素索引数字。\n\
    \n第二个参数可以是负值，表示从数组末尾计算的元素位置。\n\n如果只指定一个参数，它将用作第一个元素的索引数字，该方法将返回从该位置开始的所有元素的新数组。\n\
    \n这些示例说明了 array.slice() 方法的不同用法：\n\n```javascript\n// 创建并初始化一个数组\nvar nums = new\
    \ Array(1, 2, 3, 4, 5, 6, 7, 8);\n\n// 获取 #2 到 #4 的元素\nvar str = \"Slice A: \"\
    \ + nums.slice(2, 4) + \"\\n\";\n\n// 获取 #1 到倒数第一个元素\nstr += \"Slice B: \" + nums.slice(1,\
    \ -1) + \"\\n\";\n\n// 获取 #3 到结束的元素\nstr += \"Slice C: \" + nums.slice(3 ) + \"\
    \\n\";\n\n// 显示三个切片\nalert(str);\n```\n\n数组元素取自但不包含第二个参数索引。\n\n![](img/5f5106681c8c7072e64c4ea)\n\
    \n![](img/5f5106681c8c7072e64c4)\n\n# 元素排序\n\nJavaScript array.sort() 方法允许对元素进行排序。\n\
    \n有时需要按升序排列数组，如下例所示：\n\n```javascript\n// 创建整数数组\nvar integers = new Array(3,\
    \ 8, 1, 9, 7, 5, 4, 6);\nintegers.sort();\n\n// 创建浮点数数组\nvar floats = new Array(0.5,\
    \ 0.8, 0.12, 0.75, 0.2);\nfloats.sort();\n\n// 创建字符串数组\nvar strings = new Array(\"\
    Michael\", \"Andrew\", \"David\");\nstrings.sort();\n\n// 用连字符分隔元素\nvar str =\
    \ \"Integers array: \" + integers.join(\" - \");\nstr += \"\\nFloats array: \"\
    \ + floats.join(\" - \");\nstr += \"\\nStrings array: \" + strings.join(\" - \"\
    );\n// 显示结果\nalert(str);\n```\n\n![](img/5f5106681c8c7072e64c4)\n\n![](img/5f5106681c8c7072e64c4)\n\
    \n"
