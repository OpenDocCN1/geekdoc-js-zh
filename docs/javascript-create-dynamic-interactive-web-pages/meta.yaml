    \n13. JavaScript in DHTML | 17\n\n# DOM reference\n\nThe chart below illustrates\
    \ the important parts of the Document Object Model (DOM) to explain how the objects\
    \ in a Web page are related. Those marked with an * are specific to Microsoft\
    \ Internet Explorer and are not found in other browsers.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_179_0.png)\n\
    \n# JavaScript in e-commerce\n\nThis final chapter shows how some of the earlier\
    \ examples may be applied to e-commerce applications and illustrates how frames\
    \ can store data for later use in other frames.\n\n# Covers\n\n- The products\
    \ page | 180\n- A hidden form | 181\n- Get the customer details | 182\n- Generate\
    \ an order number | 183\n- Confirm the order | 184\n- Submit the order | 185\n\
    - What next? | 186\n\n# The products page\n\nThe example in this chapter follows\
    \ the development of an on-line order that starts with a page from which the user\
    \ may select quantities of items to order.\n\nThe page is framed with a left-hand\
    \ panel named menu and a right-hand larger frame named main.\n\nTypically the\
    \ menu frame will remain constantly displayed while the main frame will display\
    \ different pages as the user navigates around the site.\n\nA button is added\
    \ at the bottom of the form that will advance the user to the next stage of the\
    \ order process.\n\nIn the form, depicted below, the user has entered quantity\
    \ requirement for some of the illustrated products:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_181_0.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_181_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_181_2.png)\n\
    \nThe frame-holder document for this example is named e-commerce.html. It displays\
    \ a menu.html in the menu frame and (initially) products.html in the main frame\
    \ – as shown above.\n\n# A hidden form\n\nThe page in the menu frame contains\
    \ a hidden form named m (for memory) that will retain the order data while the\
    \ pages in the main frame are changed.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_182_0.png)\n\
    \nIt consists of input items that mirror those of the form named f on the product\
    \ page together with inputs for customer name, account number and order number.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_182_1.png)\n\n```html\n<!-- a form\
    \ to store order data -->\n<form id=\"m\" action=\"\" method=\"post\">\n<input\
    \ type=\"hidden\" name=\"customer\" value=\"\" />\n<input type=\"hidden\" name=\"\
    accountnumber\" value=\"\" />\n<input type=\"hidden\" name=\"ordernumber\" value=\"\
    \" />\n<input type=\"hidden\" name=\"ball\" value=\"\" />\n<input type=\"hidden\"\
    \ name=\"hoop\" value=\"\" />\n<input type=\"hidden\" name=\"cone\" value=\"\"\
    \ />\n</form>\n```\n\nThe onclick attribute of the button on the products page\
    \ calls a JavaScript function that fills the values of the hidden form m with\
    \ the values entered by the user into the products page f. It then loads a new\
    \ page into the main frame.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_182_2.png)\n\
    \n```javascript\n// a function to store order data in another frame\nfunction\
    \ populate() {\n  // variables for the form\n  var m = parent.document.forms.m;\n\
    \  var f = document.forms.f;\n\n  // copy the values\n  m.ball = f.value;\n  m.hoop\
    \ = f.value;\n  m.cone = f.value;\n\n  // load a new page into this frame\n  window.location\
    \ = \"customer.html\";\n}\n```\n\n# Get the customer details\n\nWhen the user\
    \ clicks the button on this page its onclick attribute calls a JavaScript function\
    \ that fills the values of the hidden form m in the menu frame. This page requests\
    \ the customer name and account number.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_183_0.png)\n\
    \n```javascript\n// a function to store values in another frame\nfunction populate()\
    \ {\n  // variables for the form\n  var m = parent.document.forms.m;\n  var f\
    \ = document.forms.f;\n\n  // copy the values\n  m.ball = f.value;\n  m.hoop =\
    \ f.value;\n  m.cone = f.value;\n\n  // load a new page into this frame\n  window.location\
    \ = \"customer.html\";\n}\n```\n\n# Generate an order number\n\nThe final page\
    \ e-commerce generates the order number for the user. This page uses the data\
    \ from the hidden form m in the menu frame.\n\n```javascript\n// generate the\
    \ order number\nvar d = new Date();\nvar yr = d.getFullYear().toString();\nvar\
    \ mo = d.getMonth().toString();\nvar hr = d.getHours().toString();\nvar mn = d.getMinutes().toString();\n\
    var sc = d.getSeconds().toString();\nvar onun = yr + mo + hr + mn + sc;\n```\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_183_1.png)\n\n# Confirm the order\n\
    \nThe confirm.html page contains the order number, the customer name and account\
    \ number. It is where the user confirms the order.\n\n```javascript\n// write\
    \ out the order number\ndocument.write(\"Order No. \" + m.ordernumber);\n\n//\
    \ write out the customer details\ndocument.write(\"<br>/For \" + m.customer);\n\
    document.write(\"<br/>Account No. \" + m.accountnumber);\n\n// write out any ordered\
    \ products\ndocument.write(\"<hr/>\");\nif (m.ball != \"\")\ndocument.write(m.ball+\"\
    \ Balls @ $7.99<br/>\");\nif (m.hoop != \"\")\ndocument.write(m.hoop+\" Hoops\
    \ @ $3.99<br/>\");\nif (m.cone != \"\")\ndocument.write(m.cone+\" Cones @ $5.99<br/>\"\
    );\n```\n\nconfirm.js (cont'd)\n\nInclude this script in the body of the HTML\
    \ document at the point where the details are to appear.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_185_0.png)\n\
    \nAdd a feature to navigate back to the order page so the user can amend the order\
    \ if required.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_185_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_185_2.png)\n"
