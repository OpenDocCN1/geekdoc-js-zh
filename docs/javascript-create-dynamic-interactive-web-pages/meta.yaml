    \n# 中止 (Abort)\n\nInternet Explorer 允许为 **Abort** 事件指定事件处理器，该事件发生在用户取消图像下载时——通常是通过点击浏览器工具栏上的**停止**按钮。当图像下载被取消时，**onabort**\
    \ 事件处理器可能会调用一个 JavaScript 函数。\n\n为了识别图像名称，必须在 HTML `<img>` 元素为其指定 **id** 属性，如下：\n\
    \n```html\n<img id=\"big-pic\" src=\"bigpic.jpg\" alt=\"\">\n```\n\n可以为图像的 **onabort**\
    \ 属性分配一个事件处理器。在下面的示例中，事件处理器直接创建一个 `alert()` 消息，确认下载已取消：\n\n![](img/5f5106681c8c7072e64c4ea87c891513_158_0.png)\n\
