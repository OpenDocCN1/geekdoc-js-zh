  - "[PAGE 113]\n\n# Set colors\n\nThe properties and methods of the window.document\
    \ object enable a Web page document to be changed at runtime. Using JavaScript\
    \ to assign new values to properties of the window.document object causes the\
    \ Web browser to update the appearance of the Web page in line with the new values.\n\
    \nThe window.part of the address bar may be omitted as window is the top DOM object.\n\
    \nThis can be simply illustrated by assigning new values to the document.bgColor\
    \ and document.fgColor properties to change the background and foreground colors\
    \ of a page.\n\nIn this example the set_colors() function is called from the HTML\
    \ onclick attribute of the button when the user pushes it:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_113_0.png)\n\
    \n```\n// a function to set the colors of the page\nfunction set_colors() {\n\
    \    window.document.bgColor = \"red\";\n    window.document.fgColor = \"yellow\"\
    ;\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_113_1.png)\n\nNotice the\
    \ capitalization with both bgColor and fgColor.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_113_2.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_113_3.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_113_4.png)"
  - '[PAGE 114]


    # JavaScript creates


    The `write()` method of the window.document object is a tremendously powerful
    feature that allows JavaScript to create content dynamically when loading a Web
    page.


    The method takes a single string argument containing the content to be written
    into the page and may include HTML tags to format the content.


    ![](img/5f5106681c8c7072e64c4ea87c891513_114_0.png)


    Typically the `document.write()` method appears within a script in the `<body>`
    section of an HTML document and will select content following a conditional test.


    It should be noted that calling this method at runtime will cause the specified
    content to be written into a new blank document so replacing the current page.


    Variable values may also be concatenated with a string argument in order to introduce
    a variable value into the content of a Web page.


    This example first generates a random number then tests to determine if the number
    is odd or even. Selected content is added to the page depending on the result
    of this test:


    ![](img/5f5106681c8c7072e64c4ea87c891513_114_1.png)


    ```

    get a random integer between 1 - 100

    var n = Math.ceil( Math.random() * 100 );

    determ whether the number is odd or even

    type = ( n % 2 == 0 ) ? "Even" : "Odd";


    write a description of the number

    document.write("<html>Number " +n+ " is " +ntype+"</html>");

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_114_2.png)'
  - '[PAGE 115]


    # Set cookie


    Cookies are tiny files that can be written by JavaScript to store small amounts
    of data on the local hard drive. There are limitations to the use of cookies that
    restrict their size to 4 kilobytes and Web browsers are not required to retain
    more than 20 cookies per Web server. Typically a cookie may often retain user
    data for across Web pages or subsequent visits to a website.


    ![](img/5f5106681c8c7072e64c4ea87c891513_115_0.png)


    Escape the values to include spaces, commas and semicolons.


    The cookie data is held in the window.document.cookie object as a name=value pair
    – the value may not contain any semicolons, commas or whitespace. Multiple name=value
    pairs may be stored by making further assignments to the document.cookie object


    The life-span of a cookie is limited to the length of the current browser session
    unless an expiry date is specified when the cookie is first set.


    Expiration is assigned to a named key expires by amending the current Date to
    the desired future date.


    ![](img/5f5106681c8c7072e64c4ea87c891513_115_1.png)


    A cookie may be deleted by setting an expiry date that is before the real current
    date.


    Dates of expiry should be expressed in GMT string format by converting the Date
    object using the Date.toGMTString() method.


    The calculation in the example below multiplies the date, hours, minutes, and
    milliseconds to increment a Date object by exactly 1 week.


    This example stores the user''s name and account number in a cookie with a life-span
    of 7 days:


    ![](img/5f5106681c8c7072e64c4ea87c891513_115_2.png)


    ```

    // the data to be stored in the cookie

    var user_account = "Mike McGrath, 000456";


    // create a new Date object

    var expiry = new Date();


    // set the expiry for 7 days time

    expiry.setTime(expiry.getTime() + (7*24*60*60*1000));


    // create the cookie

    document.cookie = "cookiedata=escape(user_account)";

    + "expires=" + expiry.toGMTString() + ";";

    ```'
  - "[PAGE 116]\n\n# Get cookie\n\nIf a cookie is set the **document.cookie** object\
    \ will return **true** JavaScript can test for the presence of cookies. When a\
    \ cookie is located the **document.cookie** object returns the stored data string.\
    \ Parts of the data may be retrieved from the stored string using a regular string\
    \ manipulation methods covered earlier in this book.\n\nWhen the script below\
    \ runs it first seeks the cookie set by the previous example on the opposite page,\
    \ then it extracts the data values to write customized dynamic content:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_116_0.png)\n\
    \n```\nfind any cookies\nif(document.cookie) {\n  // unescape the cookie data\n\
    \  var cookiedata = unescape(document.cookie);\n  split the name=value pairs\n\
    \  var userdata = cookiedata.split(\"=\");\n  if the cookie is called cookiedata\n\
    \  if(userdata[0] == \"cookiedata\") {\n    // split the comma delimited values\n\
    \    var data = userdata[1].split(\",\");\n    var username = userdata[0];\n \
    \   var useracct = data[1];\n  }\n}\n// write out the data retrieved from the\
    \ cookie\ndocument.write(\"Welcome \"+username+ \"<br/>\");\ndocument.write(\"\
    Account number: \"+useracct+ \"\");\");\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_116_1.png)\n\
    \nMultiple name=value pairs will automatically be returned with a semicolon separating\
    \ each pair. Use string.indexOf() to identify the required pair.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_116_2.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_116_3.png)"
  - "[PAGE 117]\n\n# Images array\n\nThe window.document.images[] object is an array\
    \ of all image objects contained within a Web page – in the order in which the\
    \ HTML code added to the page. so the first listed image is allocated to the first\
    \ array element and can be addressed as document.images[0].\n\nIn this example\
    \ the name assigned to the HTML id attribute and the src URL can be accessed for\
