  - '[PAGE 70]


    # Rounding floats


    The Math.round() method in JavaScript is useful both to round floating-point numbers
    to the nearest integer and commute long floating-point numbers to shorter rounded
    versions. Commonly this will be to reduce a long floating point number to two
    decimal places.


    If the floating point value given as the method argument is exactly halfway between
    two integers the method will round up to the nearest integer.


    The example given below illustrates the way that the Math.round() method handles
    rounding of positive and negative halfway values and shows how it may be used
    to commute a long floating-point number to two places:


    ```

    var a = 7.5;

    a = Math.round(a);

    a = "Rounded Positive : "+a+" \n";


    var b = -7.5;

    b = Math.round(b);

    b = "Rounded Negative : "+b+" \n";

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_70_0.png)


    Rounding -7.5 does not give the result -8.0 because that would be a higher number,
    and so that would be rounding down.


    ```

    var c = 3.764638467915;

    c = c * 100; // take it up two places

    c = Math.round(c); // do the round

    c /= 100; // take it back 2 places

    c = "Commuted Long Float : "+c+"

    alert(a+b+c);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_70_1.png)


    6. Doing mathematics | 69'
  - '[PAGE 71]


    # Forcing floats


    As an alternative to using the Math.round() method detailed on the previous page
    the script may require that the float be selectively forced to the nearest integer,
    above or below.


    JavaScript provides the Math.ceil() method to force rounding up to the nearest
    integer and the Math.floor() method rounds to the nearest integer.


    The example below illustrates both methods in action with both positive and negative
    values:


    ```

    var a = 7.5;

    var a1 = "a1" : + Math.ceil(a);

    var a2 = "a2" : + Math.floor(a);

    var b = -7.5;

    var b1 = "b1" : + Math.ceil(b);

    var b2 = "b2" : + Math.floor(b);

    var rup = "ROUNDING UP\n" + a1 + "\n" + b1 + "\n";

    var rdn = "ROUNDING DOWN\n" + a2 + "\n" + b2;


    alert( rup + rdn );

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_71_0.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_71_1.png)'
  - '[PAGE 72]


    # Comparing numbers


    The Math object has two methods allowing comparison of two numbers with a return
    of the higher or lower value.


    Math.max() accepts the two values for comparison as arguments and will return
    the higher of the two values.


    The Math.min() method works in precisely the same way returns the lower of the
    two given values.


    In the example below the Math.pow() method is used to create square and cube values
    that are then compared with Math.max() and Math.min().


    The Math.pow() method requires two arguments to specify the power by which to
    raise that number:


    ```

    var sq = Math.pow( 5, 2 );

    var cb = Math.pow( 3, 3 )

    var hi = "Round up : " + Math.max( sq, cb );

    var lo = "Round Down : " + Math.min( sq, cb );

    var ng = "Round Negative Up : " + Math.max( -5, -4.75 );

    alert("MAXMIN\n" + hi + "\n" + lo + "\n" + ng");

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_72_0.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_72_1.png)


