    var res = "Topic: " + ss[0];

    res += "\nTitle: " + bks[0];

    res += "\nAuthor: " + bks[1];

    alert(res);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_81_0.png)


    Data is often stored as a comma-delimited string.


    ![](img/5f5106681c8c7072e64c4ea87c891513_81_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_81_2.png)'
  - '[PAGE 82]


    # Substrings


    A substring may be extracted from an existing string using the string.substring()
    method which must have two arguments to specify the start and end positions of
    the required substring within the main string.


    The character at the start argument position will be the first character in the
    returned substring. The last character in the substring will be the character
    preceding the given end argument.


    An alternative way to extract a substring from a string is available with the
    string.substr() method which also requires two arguments. While the first argument
    again specifies the start position of the substring the second will specify the
    length of the substring to be returned.


    The example below demonstrates both substring methods:


    ```

    // create and initialize a string variable

    var str = "JavaScript in easy steps";


    // get two substrings with the substring() method

    var subl = str.substring(14,19) + str.substring(0,11);


    // get two substrings with the substr() method

    var sub2 = str.substr(14,5) + str.substr(0,10);


    // display all the substrings

    var res = "Substring method : " +subl1;

    res += "nSubstr method : " +sub2;

    alert(res);

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_82_0.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_82_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_82_2.png)'
  - '[PAGE 83]


    # Convert to string


    It is possible to manually call the JavaScript function that is used to convert
    other data types to strings by calling the object.toString() method.


    This is an essential JavaScript function and will always try to return a string
    representation of the object that is being queried, even if it is not itself a
    string.


    In this example there is firstly a straightforward addition of two integers, followed
    by a concatenation of a string with an integer where the integer is converted
    to a string value.


    Finally the object.toString() method is demonstrated with a different data type
    to illustrate that the generated output will reveal the object type.


    ![](img/5f5106681c8c7072e64c4ea87c891513_83_0.png)


    ```

    // create an integer variable and add another integer

    var num = 9;

    var nostr = num + 9;


    // create a string version of the num integer variable

    // then concatenate a second value to it

    var adstr = num.toString() + 9;


    // create a new Image object

    var img = new Image();


    // display string values of the variables

    var res = "No strings : " + nostr;

    res += "\nAdded strings : " + adstr;

    res += "\nImage : " + img.toString();

    nalert(res);

    ```


    The toString() method can be used anywhere in JavaScript to reveal string about
    any object.


    ![](img/5f5106681c8c7072e64c4ea87c891513_83_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_83_2.png)'
- md: "\n## Change case\n\nThe string character case may be changed using the string.toUpperCase()\
    \ or string.toLowerCase() methods to force all the characters to become a common\
    \ case.\n\nThese methods are useful when comparing user input to ensure that the\
    \ character format agrees with the comparison format.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_84_0.png)\n\
    \nIn the following example the function is called when the user clicks the button\
    \ by assigning the function name to the onclick attribute of the button, like\
    \ this:\n\n```\n<input type=\"button\" value=\"Check Input\" onclick=\"check_input()\"\
    />\n```\n\nThe string.toLowerCase() method converts the uppercase entry in the\
    \ form text field for comparison with a lowercase string value.\n\n```javascript\n\
    function check_input() {\n    // get user input from text field in form of f\n\
    \    var entry = document.forms.f.textfield.value;\n    \n    // compare input\
    \ and display an appropriate message\n    if(entry.toLowerCase() == \"castle\"\
    ) alert(\"Accepted\");\n    else alert(\"Refused\");\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_84_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_84_2.png)\n\n7. Working with strings\
    \ | 83\n\n## Numbers from strings\n\nA number can be extracted from the beginning\
    \ of a string with the parseInt() and parseFloat() methods.\n\nThe parseInt()\
    \ method parses the string and returns the integer value that is located. The\
    \ parseFloat() method works in the same way but returns a floating point number.\n\
    \nIf the parser finds any non-numeric character before returning a number then\
    \ it will return the special NaN value that is used to denote “Not-a-Number\"\
    .\n\nThis example demonstrates both parseFloat() and parseInt() methods and illustrates\
    \ the JavaScript isNaN() function testing for a NaN value:\n\n```javascript\n\
    // create a string beginning with a number\nvar str = \"66.6% PASS RATE\";\n\n\
    // extract the initial integer value\nvar res = \"Integer : \" + parseInt(str);\n\
    \n// extract the initial float value\nres += \"\\nFloat : \" + parseFloat(str);\n\
    \n// create a string beginning with a letter\nvar badstr = \"PASS RATE 66.6%\"\
    ;\n\n// attempt to extract an initial integer value\nres += \"\\nNon-numeric :\
    \ \" + parseInt(badstr);\nres += \"\\nFound : \" + isNaN(parseInt(badstr)) ? \"\
    Character\" : \"Number\";\nalert(res);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_85_0.png)\n\
    \nThe NaN value cannot be tested for with the == equality operator.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_85_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_85_2.png)\n\n## Variables in strings\n\
    \nThe JavaScript eval() function accepts as argument a string containing JavaScript\
    \ code which it evaluates, then returns the resulting value.\n\nIf the code string\
    \ contains statements they will be executed by the eval() function, then the final\
    \ value will be returned.\n\nWhile this function is a powerful feature of the\
    \ JavaScript language it most often used to introduce variable values into a string.\n\
    \nIn the example below script assigns a string value to be displayed in a text\
    \ input within a form that simply has the id of f. The HTML <input> element has\
    \ been named textField.\n\nThe <script> element to include this JavaScript must\
    \ appear in the HTML document after the form elements so that the text field created\
    \ before the script assigns a value to it.\n\nThe text box and the display string\
    \ are stored in variables that are evaluated by the eval() function.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_86_0.png)\n\
    \n```javascript\n// store the text input name\nvar input = \"textField\";\n```\n\
    \n```javascript\n// store the string to assign\nvar inputtext = \"JavaScript Text\"\
    ;\n```\n\n```javascript\n// evaluate the assignment expression\neval(\"document.forms.f.\"\
    \ + input + \").value=\" + inputtext);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_86_1.png)\n\
    \nRemember to escape the quotes inside a string to avoid error messages.\n\nNow\
    \ the text string is displayed in the text field because the expression evaluates\
    \ to:\n\n```javascript\ndocument.forms.f.textField.value = \"JavaScript Text\"\
    ;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_86_2.png)\n\n7. Working with\
    \ strings | 85\n\n## Encoding strings\n\nAll characters have a Unicode numerical\
    \ representation that can be returned for each individual character in a string\
    \ with the string.charCodeAt() method. This method requires the index of the character\
    \ within the string as its argument.\n\nConversely characters can be extracted\
    \ from Unicode using the JavaScript String.fromCharCode() function that takes\
    \ the Unicode value as its argument.\n\nThe example below shows a string and returns\
    \ its Unicode values:\n\n```javascript\n// create a string\nvar str = \"ABC\"\
    ;\nvar enc = \"\";\n\n// loop through the string and get char codes\nfor (var\
    \ i = 0; i < str.length; i++) {\n  enc += str.charCodeAt(i) + \" \";\n}\nconsole.log(enc);\n\
    \n// convert char codes back to characters\nvar codes = \"65 66 67\";\nvar dec\
    \ = \"\";\n\n// loop through the codes and get characters\nfor (var i = 0; i <\
    \ 3; i++) {\n  dec += String.fromCharCode(codes.split(\" \")[i]);\n}\nconsole.log(dec);\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_87_0.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_87_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_87_2.png)\n\n7. Working with strings\
    \ | 86\n\n## Addressing page\n\n- Following the strings | 87\n- JavaScript strings\
    \ | 88\n- Object constructor | 89\n- Property inheritance | 90\n- Facing on |\
    \ 91\n- Cross- | 92\n- Java- | 93\n- Plugin- | 94\n- JavaScript with | 95\n\n\
    ## Object constructor\n\nThe JavaScript syntax uses the name followed by a period.\
    \ In this case the properties and values are assigned to the object.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_88_0.png)\n\
    \nNew objects can be easily created using new keyword. The example below creates\
    \ a car object and then gives it properties:\n\n```javascript\n// create a new\
    \ object\nvar car = new Object();\n\n// create and initialize maker property\n\
    car.maker = \"Porsche\";\n\n// create and initialize model property\ncar.model\
    \ = \"Boxster\";\n\n// create and initialize color property\ncar.color = \"Red\"\
    ;\n\n// display all the car properties\nalert(car.color + \" \" + car.maker +\
    \ \" \" + car.model);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_89_0.png)\n\
    \n## Property inheritance\n\nFurther flexibility can be added to the example by\
    \ assigning the newly created custom object to a property of another custom object.\n\
    \nIn this case the properties and values of the assigned object are inherited\
    \ by the second custom object. The inherited properties are addressed by adding\
    \ a period and the inherited property name after the property address to which\
    \ they have been assigned.\n\nIt is helpful to understand this relationship when\
    \ dealing with objects and properties in Web pages. The following example demonstrates\
    \ how a new object is assigned to a property of a second custom object and how\
    \ the inherited properties may be addressed:\n\n```javascript\n// create a new\
    \ object with assigned property values\nvar suv = new Object();\nsuv.badge = \"\
    Explorer\";\nsuv.type = \"4X4\";\nsuv.doors = 4;\nsuv.color = \"Red\";\nsuv.engine\
    \ = \"4.0 liters\";\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_90_0.png)\n\
    \nAn object must first been created in the script before it can be assigned to\
    \ another object's property.\n\n```javascript\n// create another object that inherits\
    \ from the first\nvar car = new Object();\ncar.maker = \"Ford\";\ncar.model =\
    \ suv;\n```\n\n```javascript\n// display unique value and inherited property values\n\
    alert(car.maker + \" \" + car.model.badge + \" \" + car.model.type);\n```\n\n\
    ![](img/5f5106681c8c7072e64c4ea87c891513_90_1.png)\n"
  mdcn: "\n\n## 转换大小写\n\n可以使用 `string.toUpperCase()` 或 `string.toLowerCase()` 方法更改字符串字符的大小，以强制所有字符转换为统一的大小写。\n\
    \n这些方法在比较用户输入时非常有用，可以确保字符格式与比较格式一致。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_84_0.png)\n\
    \n在下面的示例中，通过将函数名赋值给按钮的 `onclick` 属性，当用户点击按钮时调用该函数，如下：\n\n```\n<input type=\"button\"\
    \ value=\"Check Input\" onclick=\"check_input()\"/>\n```\n\n`string.toLowerCase()`\
    \ 方法将表单文本字段中的大写输入转换为小写字符串值，以便进行比较。\n\n```javascript\nfunction check_input() {\n\
    \    // 从表单的文本框中获取用户输入作为 f\n    var entry = document.forms.f.textfield.value;\n\
    \    \n    // 比较输入并显示适当的消息\n    if(entry.toLowerCase() == \"castle\") alert(\"\
    Accepted\");\n    else alert(\"Refused\");\n}\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_84_1.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_84_2.png)\n\n7. 处理字符串 | 83\n\n## 从字符串提取数字\n\
    \n可以使用 `parseInt()` 和 `parseFloat()` 方法从字符串的开头提取数字。\n\n`parseInt()` 方法解析字符串并返回找到的整数值。`parseFloat()`\
    \ 方法的工作相同，但返回的是浮点数。\n\n如果解析器在返回数字之前发现任何非数字字符，它将返回特殊的 `NaN` 值，该值用于表示“不是数字”（Not-a-Number）。\n\
    \n此示例演示了 `parseFloat()` 和 `parseInt()` 方法，并说明了 JavaScript 的 `isNaN()` 函数如何测试 NaN\
    \ 值：\n\n```javascript\n// 创建以数字开头的字符串\nvar str = \"66.6% PASS RATE\";\n\n// 提取初始整数值\n\
    var res = \"Integer : \" + parseInt(str);\n\n// 提取初始浮点值\nres += \"\\nFloat : \"\
    \ + parseFloat(str);\n\n// 创建以字母开头的字符串\nvar badstr = \"PASS RATE 66.6%\";\n\n\
    // 尝试提取初始整数值\nres += \"\\nNon-numeric : \" + parseInt(badstr);\nres += \"\\nFound\
    \ : \" + isNaN(parseInt(badstr)) ? \"Character\" : \"Number\";\nalert(res);\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_85_0.png)\n\n`NaN` 值无法用 `==` 等等运算符进行测试。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_85_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_85_2.png)\n\
    \n## 字符串中的变量\n\nJavaScript 的 `eval()` 函数接受一个包含 JavaScript 代码的字符串作为参数，并对其进行求值，然后返回结果。\n\
    \n如果代码字符串包含语句，它们将由 `eval()` 函数执行，然后返回最终值。\n\n虽然此函数是 JavaScript 语言的一个强大特性，但它最常用于将变量值引入字符串中。\n\
    \n在下面的示例脚本中，将字符串值赋值给表单中的文本输入框，该表单的 id 为 `f`。HTML `<input>` 元素命名为 `textField`。\n\
    \n包含此 JavaScript 的 `<script>` 元素必须出现在 HTML 文档中表单元素之后，这样脚本之前创建的文本框才能为其赋值。\n\n文本框和显示字符串存储在变量中，并由\
    \ `eval()` 函数进行求值。\n\n![](img/5f5106681c8c7072e64c4ea87c891513_86_0.png)\n\n```javascript\n\
    // 存储文本输入名称\nvar input = \"textField\";\n```\n\n```javascript\n// 存储要赋值的字符串\n\
    var inputtext = \"JavaScript Text\";\n```\n\n```javascript\n// 求值赋值表达式\neval(\"\
    document.forms.f.\" + input + \").value=\" + inputtext);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_86_1.png)\n\
    \n记得转义字符串内部引号以避免错误消息。\n\n现在文本字符串显示在文本框中，因为该表达式求值结果为：\n\n```javascript\ndocument.forms.f.textField.value\
    \ = \"JavaScript Text\";\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_86_2.png)\n\
    \n7. 处理字符串 | 85\n\n## 字符串编码\n\n所有字符都有 Unicode 数值表示，可以通过 `string.charCodeAt()`\
    \ 方法为字符串中的每个单独字符返回该值。该方法需要字符在字符串中的索引作为其参数。\n\n相反，可以使用 JavaScript `String.fromCharCode()`\
    \ 函数从 Unicode 提取字符，该函数接受 Unicode 值作为参数。\n\n下面的示例显示了一个字符串并返回其 Unicode 值：\n\n```javascript\n\
    // 创建一个字符串\nvar str = \"ABC\";\nvar enc = \"\";\n\n// 遍历字符串并获取字符编码\nfor (var i\
    \ = 0; i < str.length; i++) {\n  enc += str.charCodeAt(i) + \" \";\n}\nconsole.log(enc);\n\
    \n// 将字符编码转换回字符\nvar codes = \"65 66 67\";\nvar dec = \"\";\n\n// 遍历编码并获取字符\n\
    for (var i = 0; i < 3; i++) {\n  dec += String.fromCharCode(codes.split(\" \"\
    )[i]);\n}\nconsole.log(dec);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_87_0.png)\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_87_1.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_87_2.png)\n\
    \n7. 处理字符串 | 86\n\n## 页面地址\n\n- 后续字符串 | 87\n- JavaScript 字符串 | 88\n- 对象构造函数 |\
    \ 89\n- 属性继承 | 90\n- Facing on | 91\n- Cross- | 92\n- Java- | 93\n- Plugin- |\
    \ 94\n- JavaScript with | 95\n\n## 对象构造函数\n\nJavaScript 语法使用名称后紧跟一个点号。在这种情况下，属性和值被赋值给对象。\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_88_0.png)\n\n可以使用 `new` 关键字轻松创建新对象。下面的示例创建了一个汽车对象，然后赋予它属性：\n\
    \n```javascript\n// 创建新对象\nvar car = new Object();\n\n// 创建并初始化 maker 属性\ncar.maker\
    \ = \"Porsche\";\n\n// 创建并初始化 model 属性\ncar.model = \"Boxster\";\n\n// 创建并初始化\
    \ color 属性\ncar.color = \"Red\";\n\n// 显示所有汽车属性\nalert(car.color + \" \" + car.maker\
    \ + \" \" + car.model);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_89_0.png)\n\
    \n## 属性继承\n\n通过将新创建的自定义对象赋值给另一个自定义对象的属性，可以为示例添加进一步灵活性。\n\n在这种情况下，赋值对象的属性被第二个自定义对象继承。通过在属性地址后添加点号和继承的属性名称来访问。\n\
    \n在处理网页中的对象和属性时，理解这种关系非常有帮助。下面的示例演示了如何将新对象赋值给第二个自定义对象的属性，以及如何访问继承属性：\n\n```javascript\n\
    // 创建带有赋值属性的新对象\nvar suv = new Object();\nsuv.badge = \"Explorer\";\nsuv.type\
    \ = \"4X4\";\nsuv.doors = 4;\nsuv.color = \"Red\";\nsuv.engine = \"4.0 liters\"\
    ;\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_90_0.png)\n\n在赋值给另一个对象的属性之前，必须先在脚本中创建对象。\n\
    \n```javascript\n// 创建另一个继承自第一个对象\nvar car = new Object();\ncar.maker = \"Ford\"\
    ;\ncar.model = suv;\n```\n\n```javascript\n// 显示唯一值和继承的属性值\nalert(car.maker +\
    \ \" \" + car.model.badge + \" \" + car.model.type);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_90_1.png)\n\
    \n"
