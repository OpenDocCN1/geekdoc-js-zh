  md: "# Random generator\n\nRandom numbers can be generated using the Math.random()\
    \ method to return a floating-point value between 0.0 and 1.0. This method can\
    \ be used to create a series of random number selections, like a lottery draw,\
    \ and is popular for producing random effects within Web pages.\n\nMultiplying\
    \ the random number will specify a wider range so, for example, a multiplier of\
    \ 10 will create a random number now between 0.0 and 10.0.\n\nTo make the randomly\
    \ generated number more useful it is generally best to round up the returned float\
    \ so that the range will become two integer values.\n\nThe Math.ceil() method\
    \ will be used to round the random number up to an integer between 1 and 10 inclusive.\n\
    \nThe code below illustrates this example:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_73_0.png)\n\
    \n```\n// get a random number from 0.0 to 1.0\nvar rand1 = Math.random();\n multiply\
    \ by 10 to make it between 0.0 and 10\nvar rand2 = rand1 * 10;\n// round up it\
    \ to make it between 1 and 10\nvar rand3 = Math.ceil( rand3 );\n\n// add each\
    \ part to a string\nvar str = \"Random float [rand1]: \" + rand1 + \" \\n\";\n\
    str += \"Specify range [rand2]: \" + rand2 + \" \\n\";\nstr += \"Random integer\
    \ [rand3]: \" + rand3;\\n\n// display the string\nalert(str);\n```\n\nThe individual\
    \ steps are shown here with the rand variables but can be combined as: Math.ceil(Math.random()*10)\n\
    \n[JavaScript Application]\nRandom float [rand1]: 0.8884876526462702\nSpecify\
    \ range [rand2]: 8.8884876526462702\nRandom integer [rand3]: 9\n\n72 JavaScript\
    \ in easy steps"
