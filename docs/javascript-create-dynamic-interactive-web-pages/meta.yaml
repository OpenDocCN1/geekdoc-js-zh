  md: '# Send form


    When a form is submitted to the server the values assigned to the **name** and
    **value** attributes of each form element are sent as **name=value** pairs.


    The **submit()** method of the form object can be used to send the form to the
    server in exactly the same way as if the user had pushed an HTML submit button.


    The example below uses the **javascript:** protocol to call the intrinsic JavaScript
    **submit()** function. This allows the user to click an image to submit form,
    rather than a traditional submit button.


    ![](img/5f5106681c8c7072e64c4ea87c891513_139_0.png)


    ```

    <form id="f" method="post" action="parser.cgi">

    <p>

    <input type="checkbox" name="chk1" value="fun"/>

    JavaScript<br/>

    <input type="checkbox" name="chk2" value="great"/>

    Great JavaScript<br/>

    <input type="checkbox" name="chk3" value="easy"/>

    Easy JavaScript<br/>

    <img src="submit.gif" alt=""\nonclick="javascript:document.forms.f.submit()"/>

    </p>

    </form>

    ```


    ![](img/5f5106681c8c7072e64c4ea87c891513_139_1.png)


    ![](img/5f5106681c8c7072e64c4ea87c891513_139_2.png)'
  merge: -1
  pgno: 139
- img_proc: true
  md: "# Amend form\n\nThe onsubmit property of a form object can be used to execute\
    \ a JavaScript function just before the form data is sent to the server. This\
    \ may be when the user pushes a HTML submit button, or when the form is sent with\
    \ the form object's submit() method.\n\nThe function will be executed then the\
    \ form will be submitted to the server. Usefully, this allows JavaScript to amend\
    \ the form so that the name=value pairs can be better used by a receiving CGI\
    \ script.\n\nIn the example below the HTML onsubmit attribute of the <form> element\
    \ calls the add_zeros() function just before the form data is sent to the server.\
    \ This function ensures that any empty text input element gets a zero value assigned\
    \ to it:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_140_0.png)\n\n```\n// a function\
    \ to assign zeros to empty text fields\nfunction add_zeros() {\n  with(document.forms.f)\
    \ {\n    if(txt1.value == \"\") txt1.value = \"0\";\n    if(txt2.value == \"\"\
    ) txt2.value = \"0\";\n    if(txt3.value == \"\") txt3.value = \"0\";\n  }\n}\n\
    ```\n\nThe CGI script acknowledges the name fields and the zero values:\n\n![](img/5f5106681c8c7072e64c4ea87c891513_140_1.png)\n\
    \nCGI Parser Output\nFile Edit View Favorites Tools Help\nOutput:\n* Key: txt1\
    \ - Value: 100\n* Key: txt2 - Value: 0\n* Key: txt3 - Value: 0\nDone Local intranet\n\
    \nII. Form properties"
  merge: -1
  pgno: 140
- img_proc: true
  md: "# Email address validation\n\nThe value of form elements may be validated by\
    \ correct format\nbefore the form is submitted.\n\nIn the following example JavaScript\
    \ tests the format of a text input\nstring for the presence of @ and dot characters\
    \ and will only\nsubmit the form if the email address validation appears correct:\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_141_0.png)\n\n```\na function to validate\
    \ an email address\nfunction send_if_valid() {\n  if (document.forms.f.email.value.indexOf(\"\
    @\") == -1)\n    fail(\"No @ in address\");\n  else\n    var adr = document.forms.f.email.value.split(\"\
    @\\n    if (adr[0].length < 1) fail(\"User address absent\");\n    else if (adr[1].indexOf(\"\
    .\") == -1) fail(\"No dot\");\n    else if (adr[1].length < 3) fail(\"Domain incorrect\"\
    );\n    else document.forms.f.submit();\n}\n\na function to display an error message\n\
    function fail(msg) {\n  alert(\"Email Address Error:\\n\" + msg);\n}\n```\n\n\
    The function\nsend_if_valid() is\ncalled from the\nHTML onclick\nattribute of\
    \ the\nbutton in this example.\n\n| Email Address Validation |\n| File Edit View\
    \ Favorites Tools Help |\n| Enter Email Address: |\n| mike@noplace [Submit Form]\
    \ |\n| Microsoft Internet Explorer [Email Address Error: No dot [OK]] | |\n| Done\
    \ Local intranet |"
  merge: -1
