  md: "# Rollover\n\nIf an image has been named in the HTML code, by assigning a value\
    \ to the <img> tag's id attribute, it may also be addressed by this name in JavaScript.\
    \ The script is document.images.imgname – an image named click is addressed as\
    \ document.images.click.\n\nAssigning a new value to the src property of an image\
    \ causes the browser to replace the image. Typically this is seen in rollovers\
    \ when the cursor is over an image it is replaced by a second image, the original\
    \ image is returned when the cursor moves away. The HTML <img> tag must include\
    \ an onmouseover attribute and onmouseout attribute to create a rollover effect,\
    \ like this:\n\n```\n<img id=\"click\" src=\"off.gif\" alt=\"\"\nonmouseover=\"\
    swap(1)\" onmouseout=\"swap(0)\" />\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_118_0.png)\n\
    \nThese attributes call the JavaScript image-swapping function whenever the onmouseover\
    \ and onmouseout events occur:\n\n```\nfunction swap(n)\n{\n  if (n == 0 )document.images.click.src\
    \ = \"off.gif\";\n  if (n == 1 )document.images.click.src = \"over.gif\";\n}\n\
    ```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_118_1.png)\n\n| Rollover Example\
    \ |\n| File | Edit | View | Favorites | Tools | Help |\n|---|---|---|---|---|---|\n\
