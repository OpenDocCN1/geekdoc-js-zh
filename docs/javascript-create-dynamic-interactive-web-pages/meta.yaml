    \ />\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_118_0.png)\n\n这些属性每当 onmouseover\
    \ 和 onmouseout 事件发生时调用 JavaScript 图像切换函数：\n\n```javascript\nfunction swap(n) {\n\
    \  if (n == 0 )document.images.click.src = \"off.gif\";\n  if (n == 1 )document.images.click.src\
    \ = \"over.gif\";\n}\n```\n\n"
