    \ elements\na[0] = \"First\"\na[1] = \"JavaScript\"\na[2] = \"JavaScript\"\n```\n\
    *(Note: I kept the OCR text for a[2] as requested, though it looks like a typo\
    \ in the source).*\n\nIt is important to note that, indexing starts at zero.\n\
    \n![](img/5f5106681c8c7072e64c4ea87c891513_45_0.png)\n\nThe array values can now\
    \ be used just like variables. This is often more convenient to initialize the\
    \ array:\n\n```javascript\n// create three arrays\nvar a = new Array(\"Jan\",\
    \ \"Feb\", \"Mar\");\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_45_1.png)\n\
    \n## Array elements\n\nEach value in an array is called an element. When a variable\
    \ is given array status using the JavaScript new keyword, it also gets properties.\
    \ One of the most useful is the length property that may be used to report the\
    \ number of elements currently contained. Note that because indexing starts at\
    \ zero, the last element in the array will have an index of only 2.\n\n```javascript\n\
    var a = new Array();\na[0] = \"JAVASCRIPT\";\na[1] = \"ARRAY\";\na[2] = \"LENGTH\"\
    ;\n// display the final counter\narraysize = a.length;\nalert(a[0]+a[1]+a[2]+\"\
    No.ofelements is \"+arraysize);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_46_0.png)\n\
    \n## Fill elements loop\n\nAll types of loops can be used to easily fill the elements\
    \ of an array with a large number of data values. This is one of the major attractions\
    \ of arrays and it is achieved with very little code.\n\nThe example below first\
    \ creates an array then, on each iteration, the for loop fills each of the array\
    \ elements with a string value to which is added the current counter value.\n\n\
    Each element value is concatenated in the variable named str before displaying\
    \ in the alert() dialog box:\n\n```javascript\nvar str = \"FILL ELEMENTS LOOP\\\
    n\\n\";\n// create a new array\nvar arr = new Array();\n\n// fill eight array\
    \ elements\nfor(var i = 0; i < 8; i++) {\n  arr[i] = \"Number is \" + i + \"\\\
    n\";\n  str += arr[i];\n}\n\n// display the value stored in each array element\n\
    alert(str);\n```\n\n![](img/5f5106681c8c7072e64c4ea87c891513_47_0.png)\n\n![](img/5f5106681c8c7072e64c4ea87c891513_47_1.png)\n\
    \nThis code could just easily be used to fill 100 elements by making the conditional\
    \ value of 8 into 100.\n\n![](img/5f5106681c8c7072e64c4ea87c891513_47_2.png)\n"
