    # 现代异步 JavaScript 的早期赞誉


    对于想要提升异步 JavaScript 命令和理解水平的开发者来说，特别是对于 Promise API 中较新且不熟悉的方法来说，这是一份不可或缺的参考和可靠的指南。Faraz
    Kelhini 带你了解围绕迭代器进行异步操作的棘手问题，并提供了优秀且启发性的示例以及易于学习的源代码。


    | → | Karl Stolley |

    |  | Web 开发者、研究员、教授、《Programming WebRTC》作者，伊利诺伊理工学院 |


    Faraz Kelhini 高效的组织和精妙的写作使得《现代异步 JavaScript》成为该主题极具价值的介绍。书中包含几十个简洁的代码示例，为中高级 JavaScript
    开发者完善了一套不可或缺的包。


    | → | Victor Gavenda |

    |  | Pearson Education/Peachpit Press 前执行主编 |


    JavaScript 发展非常快，即使是老练的开发者也需要关注以跟上这种语言。《现代异步 JavaScript》是一本关于新引入的 JavaScript 特性的简明入门教程，有助于让异步代码更简洁、更安全。任何编写异步
    JavaScript 代码的人（无论运行在浏览器还是 Node.js 中）都应该关注。我最近写的所有那些糟糕的 JavaScript 代码都希望我能早点读读这本书。


    | → | Lukas Mathis |

    |  | 软件工程师、UI 设计师、《Designed for Use》作者，Appway |


    在职业生涯中，我与无数技术作家合作过，Faraz 在他们中脱颖而出，能够清晰地解释复杂的话。他在《现代异步 JavaScript》中的工作符合这些高标准。对于像我这样的非开发者来说，Faraz
    也能让我轻松掌握这些概念。


    | → | Matt Angelosanto |

    |  | LogRocket 博客编辑 |


    # 致谢


    编写和制作一本书需要团队的努力。衷心感谢整个 Pragmatic 团队为完成这本书付出的巨大努力。特别感谢我的编辑 Margaret Eldridge，她敏锐的眼睛发现了我写作中的漏洞并避免了错误。


    非常感谢在出版前评审书籍的专家，包括 Karl Stolley、Lukas Mathis、Michael Fazio、Trevor Burham、Kevin
    Gisi、Matthew Margolis、Mike Riley、Francesco Piccoli 和 Stefan Turalski。这些优秀的开发者提供了非常有用的见解和改进建议。


    感谢我的家人支持并忍受作者的脾气，我很感激。特别感谢我亲爱的朋友 Mahsa 和 Asal 在写作期间的鼓励。你们太棒了！


    最后，感谢那些在测试阶段购买书籍的积极读者。你们信任我，我很感激。


    Copyright © 2021, The Pragmatic Bookshelf.


    # 前言


    现代应用程序日益依赖异步编程来执行多个任务，JavaScript 正在快速进化以满足这一需求。JavaScript 的许多新功能旨在异步异步运行。因此，掌握有效执行异步任务的知识是当今
    JavaScript 开发者的必修课。


    设计响应异步程序最初可能具有挑战性，但一旦掌握了窍门，结果将是值得的。本书将帮助你。你将发现许多示例可以帮助你使用 ES2020、ES2021 和 ESNext
    引入的 JavaScript 功能编写高级程序。你还将发现各种高效管理和协调代码中异步部分的技术。


