    We hope you enjoyed this book and that you’re already thinking about what you
    want to learn next. To help make that decision easier, we’re offering you this
    gift.


    Head over to [https://pragprog.com](https://pragprog.com) right now and use the
    coupon code BUYANOTHER2021 to save 30% on your next ebook. Void where prohibited
    or restricted. This offer does not apply to any edition of the The Pragmatic Programmer
    ebook.


    And if you’d like to share your own expertise with the world, why not propose
    a writing idea to us? After all, many of our best authors started off as our readers,
    just like you. With a 50% royalty, world-class editorial services, and a name
    you trust, there’s nothing to lose. Visit [https://pragprog.com/become-an-author/](https://pragprog.com/become-an-author/)
    today to learn more and to get started.


    We thank you for your continued support, and we hope to hear from you again soon!


