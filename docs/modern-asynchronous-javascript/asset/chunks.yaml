    # Chapter 5


    Setting a Time Limit for Async Tasks


    Internet users are impatient. When working with asynchronous network requests,
    how long should we keep them waiting until we get a response from a server and
    settle a promise? If the app takes longer than a few seconds to respond, most
    users will leave it and find somewhere else to go. The amount of time it takes
    for an API to respond is usually outside the control of our code due to things
    like server overload. We need a way to set a time limit to avoid entering a state
    of prolonged or endless waiting.


    Fortunately, the Promise object comes with a method called Promise.race() that
    we can take advantage of to enforce a time limit for the latency of async tasks.
    This method is designed to race several promises against each other and return
    the result of the promise that settles first. By supplying it with a promise that’s
    going to be rejected after an allotted time, we can define how long the code should
    wait to get a response from a server.


    We’ll start this chapter by comparing Promise.race() to a method we already know:
    Promise.any(). Once we get the hang of how it works, we’ll use it to concurrently
    fetch data from an external API and execute a timer that logs an error after two
    seconds. We then revise the code to replace the error message with a function
    that pulls data from a cache to use in case the API is inaccessible or doesn’t
    respond quickly enough.


    ## Getting Ready


    The Promise.race() method has been around for a while, so most modern browsers
    already support it.^([[13]](#f_0046.xhtml_FOOTNOTE-13)) Node.js support for Promise.race()
    dates back to as early as version 0.12.0\. But if you want to make use of the
    feature in even older Node versions or browsers you can use a Babel plugin.^([[14]](#f_0046.xhtml_FOOTNOTE-14))


    ## Comparing Promise.race() to Promise.any()


    Recall from [​*Using the Promise.any() Method*​](#f_0038.xhtml_sec.PromiseAny),
    that Promise.any() uses the value of the first promise that fulfills. Promise.race()
    behaves exactly the same as far as promise fulfillment. However, when it come
    to rejection, Promise.race() is completely different: it settles as soon as one
    of the given promises rejects. In other words, while Promise.any() rejects if
    all of the given promises reject, Promise.race() rejects if the first promise
    that settles is rejected.


    To demonstrate, let’s create two promises. Promise A will reject after one second
    and promise B will succeed after two seconds:


    [latency/latency_ex01.js](http://media.pragprog.com/titles/fkajs/code/latency/latency_ex01.js)


    | ​  | ​**const**​ promiseA = ​**new**​ Promise((resolve, reject) => { |


    | ​  | setTimeout(reject, 1000, ​*''A''*​); |


    | ​  | }); |


    | ​  |  |


    | ​  | ​**const**​ promiseB = ​**new**​ Promise((resolve) => { |


    | ​  | setTimeout(resolve, 2000, ​*''B''*​); |


    | ​  | }); |


    | ​  |  |


    | ​  | Promise.race([ |


    | ​  | promiseA, |


    | ​  | promiseB |


    | ​  | ]).then((response) => { |


    | ​  | console.log(response); |


    | ​  | }).​**catch**​((error) => { |


    | ​  | console.error(error); ​*// => A*​ |


    | ​  | }); |


    | ​  |  |


    | ​  | Promise.any([ |


    | ​  | promiseA, |


    | ​  | promiseB |


    | ​  | ]).then((response) => { |


    | ​  | console.log(response); ​*// => B*​ |


    | ​  | }).​**catch**​((error) => { |


    | ​  | console.error(error); |


    | ​  | }); |


    Run this code in your browser’s console. You’ll be passing the same array of promises
    to both methods. But notice that Promise.race() rejects after one second and logs
    A to the console, while Promise.any() succeeds after two seconds and logs B.


    Another difference between the two methods is that passing an empty array (or
    any other empty iterable) to Promise.race() results in a promise that remains
    in pending state:


    [latency/latency_ex02.js](http://media.pragprog.com/titles/fkajs/code/latency/latency_ex02.js)


    | ​  | Promise.race(​*""*​).then((response) => { |


    | ​  | ​*// this will never be executed*​ |


    | ​  | }).​**catch**​((error) => { |


    | ​  | ​*// neither this one*​ |


    | ​  | }); |


    If we pass Promise.race() an iterable containing nothing, then the first of nothing
    can never be determined. So if the returned promise is stuck in the pending state,
    the first thing to check is the iterable we’re passing to the method.


    Okay, now that we know how Promise.race() works, let’s go ahead and use it in
    a more practical way.


