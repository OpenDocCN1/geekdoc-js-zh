    # Chapter 2


    Enhancing Custom Iterators with Generators


    Custom iterators are powerful tools that allow us to define how an object should
    be navigated. However, they require meticulous programming to maintain their internal
    state. What if you want a quick way of defining an iterator without going through
    the hassle of implementing the iterable protocol? Luckily, JavaScript provides
    generator functions as a shortcut to create iterators.'
