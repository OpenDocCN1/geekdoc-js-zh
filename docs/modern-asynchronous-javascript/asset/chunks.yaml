    # Chapter 6


    Canceling Pending Async Requests


    Applications today must work with information on remote servers, and the Fetch
    API allows you to easily retrieve resources asynchronously across the network.
    But sometimes you may want to cancel a pending async request before it has completed.
    Perhaps you have a network-intensive application and async requests are taking
    too long to fulfill, or maybe the user clicked a Cancel button.


    The AbortController API provides a generic interface that allows you to cancel
    a fetch request. The cornerstone of the API is the AbortController interface,
    which provides an abort() method. You can create a cancelable fetch request by
    passing the signal property of AbortController as an option to fetch(). Later,
    when you want to abort the fetch, simply call the abort() method to terminate
    the network transmission.


    We’ll start this chapter by setting a time limit for a fetch request. This example
    should give you a clear idea of how to implement an AbortController. Then we’ll
    move on to more advanced topics like deregistering multiple event listeners in
    one statement and creating an abort button to let users cancel async requests.


    ## Getting Ready


    All modern browsers support the AbortController API.^([[16]](#f_0054.xhtml_FOOTNOTE-16))
    In the Node environment, you’ll need a minimum Node version of 15.0.0\. To run
    your program in older browsers or Node versions, you can use a Babel plugin.^([[17]](#f_0054.xhtml_FOOTNOTE-17))


    ## Canceling Async Tasks After a Period of Time


    Remember [​*Enforcing a Time Limit for Async Tasks*​](#f_0045.xhtml_sec.EnforcingTimeLimit),
    where we used Promise.race() to concurrently fetch data from an external API and
    execute a timer? With the AbortController API, we can achieve a similar outcome:
    cancel a request that we have already issued but don’t want to wait for the operation
    to finish.


    | Promise.race() vs. AbortController |


