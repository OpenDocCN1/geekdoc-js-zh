    | ​45:  | loadBtn.disabled = ​**false**​; |


    | ​-  | abortBtn.disabled = ​**true**​; |


    | ​-  | }); |


    Now if we press the Cancel Loading button while the requests are in progress,
    it aborts every fetch and throws an error. In the catch block, we intercept the
    error and insert a custom message into the page informing the user that cancelation
    was successful:


    ![images/abort/success.png](images/abort/success.png)


    Note that Promise.allSettled() wouldn’t be suitable for this task. Promise.allSettled()
    is designed to wait for all promises to settle, so it doesn’t make sense to use
    this method when you need to abort requests before they’re completed.


    Another use case for abort() could be live search: when the user types a character
    in the input, it triggers a search request; when that promise resolves, you want
    to show the search results. But if the user presses multiple keys, the first search
    might resolve before the last. Aborting the “stale” request ensures that the search
    results reflect the most recent query.


    ## Wrapping Up


    An interesting aspect of the AbortController API is that it’s provided by the
    DOM standard and designed to be generic. That means soon we’ll see it adopted
    by other standards and libraries as well, lowering the learning curve for developers
    who want to use those platforms.


    Make use of the AbortController API in your programs to cancel async requests
    that are no longer needed or taking too long to complete. You can do that by calling
    abort() directly, setting a timer to call abort(), or providing a cancel button
    for users to abort requests whenever they want. You can even use an AbortController
    to deregister an event listener, or multiple event listeners, which is an ability
    that JavaScript previously lacked.


    The final chapter of this book is about the top-level await. In modern JavaScript
    programming, it’s a common practice to separate the functionality of a program
    into independent modules. Modular programming provides several benefits like the
    ability to use existing assets in other programs. It also makes testing and debugging
    easier because when we need to fix a specific function, we only have to do it
    in one module.


    Top-level await is a feature of modules that improves on the regular await keyword
    to enable developers to access the result of a promise from another module without
    having to use a workaround. In the next chapter, we’re going to cover this feature.


    #### Footnotes


    [[16]](#f_0048.xhtml_FNPTR-16)


    [https://caniuse.com/abortcontroller](https://caniuse.com/abortcontroller)


    [[17]](#f_0048.xhtml_FNPTR-17)


    [https://www.npmjs.com/package/yet-another-abortcontroller-polyfill](https://www.npmjs.com/package/yet-another-abortcontroller-polyfill)


    Copyright © 2021, The Pragmatic Bookshelf.


    # Chapter 7


    Accessing Promise Results from Another Module


    Often in modular programs, you need the result from another module before you
    run the main module. Consider a recipe suggester (recipe.js) that checks a list
    of on-hand ingredients asynchronously (pantry.js). Code for recipe.js should not
    execute until code for pantry.js has run. With top-level await we could tell recipe.js
    to halt its execution until pantry.js is fully executed. If you used the standard
    await keyword in an async function, recipe.js would attempt to access the result
    of pantry.js before it was ready.'
