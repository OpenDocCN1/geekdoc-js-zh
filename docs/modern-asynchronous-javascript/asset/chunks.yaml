  trans: "\n\n[intro/intro_ex01.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex01.js)\n\
    \n```javascript\nfirstFunction((x) => {\n  // process...\n  secondFunction(x,\
    \ (y) => {\n    // process...\n    thirdFunction(y, (z) => {\n      // And so\
    \ on...\n    });\n  });\n});\n```\n\n回调地狱（Callback hell）是糟糕编码实践的结果。如果你嵌套了超过几个回调，你的代码将迅速变得难以管理。修复这段代码的方法是单独定义每个函数：\n\
    \n[intro/intro_ex02.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex02.js)\n\
    \n```javascript\nfirstFunction((x) => {\n  // process...\n  secondFunction(x);\n\
    });\n\nsecondFunction(x, (y) => {\n  // process...\n  thirdFunction(y);\n});\n\
    \nthirdFunction(y, (z) => {\n  // process...\n  fourthFunction(z);\n  // And so\
    \ on...\n});\n```\n\n通过将函数移动到顶层，我们将获得一个更浅的、被分成小逻辑部分的代码。这种小的改变使得代码更易于。\n\n尽管如此，当需要更复杂的功能时，回调模型仍然难以使用。通过\
    \ promises，你可以动态地链多个异步任务。例如，你可以同时发送两个异步请求，等待结果，然后根据中间结果决定其他异步任务。或者可以使用 promise\
    \ 来跟踪多个异步操作的状态，并在其中一个完成时立即做出反应。这并不意味着你应该停止使用回调。当你的代码可能接收多次通知时，回调仍然有用。例如，`setInterval()`\
    \ 方法定义了一个重复执行的回调函数，每次调用之间有固定的时间延迟。一旦 promise 执行，你就无法再次调用它，但你可以多次调用回调函数。\n\n##\
    \ 介绍 Promises\n\n最初，promise 构造被 `Q`、`RSVP.js` 和 `WinJS` 等库使用。但它很快变得流行，促使 Ecma\
    \ 技术委员会在 ES2015 标准中利用它。\n\n较新的 JavaScript API 使用 promise 对象而不是传统的回调函数。例如，`Fetch\
    \ API` 相比 `XMLHttpRequest` 的复杂 API 不仅提供了更简单的语法，还通过返回 promise 防止了回调地狱。让我们来看一个简单的例子：\n\
    \n[intro/intro_ex03.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex03.js)\n\
    \n```javascript\nconst promise = fetch('https://eloux.com/async_js/examples/1.json');\n\
    \npromise.then((result) => {\n  // process\n}, (error) => {\n  console.log(error);\n\
    });\n```\n\n`fetch()` 方法允许我们跨网络检索文件。该方法返回一个 promise 对象，作为操作未来结果的占位符。为了对结果做出反应，我们使用\
    \ `then()` 方法。\n\n`then()` 接受两个函数作为参数。第一个函数在 promise 成功后调用一次，并将履行值作为参数传递给该函数。第二个函数仅在\
    \ promise 失败时被调用，并将拒绝原因作为参数传递。\n\n`fetch()` 返回的 promise 保持 pending（等待）状态直到 Ajax\
    \ 请求完成。规范使用 `unsettled` 一词来描述处于等待状态的 promise。接收数据后，promise 将转换到 fulfilled（已履行）或\
    \ rejected（拒绝）状态。此时，promise 被认为 settled（已解决）。\n\n值得注意的是，一个 promise 不可能成功或失败多次。它不能从失败切换到成功，反之亦然。`then()`\
    \ 的两个参数都是可选的。因此当我们不需要监听履行或拒绝时，可以省略相关的参数。\n\n## 创建已解决的承诺 (Settled Promises)\n\n\
    在学习此书中的示例时，你可能想要输入并修改每个示例以获得练习。静态 `Promise.resolve()` 和 `Promise.reject()` 方法允许你快速创建已解决的\
    \ promise，并观察在提供不同值时代码是如何运行的。\n\n例如，以下代码创建了一个已经以值 10 履行的 promise：\n\n[intro/intro_ex05.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex05.js)\n\
    \n```javascript\nconst promise = Promise.resolve(10);\n\npromise.then((data) =>\
    \ {\n  console.log(data); // 10\n});\n```\n\n在这里，我们有一个代表已知值的已解决 promise。这个 promise\
    \ 永远不会处于 rejected 状态，因此添加处理程序是没有意义的。要创建一个 rejected 状态的 promise，我们可以使用 `Promise.reject()`，如下：\n\
    \n```javascript\nconst promise = Promise.reject('Error!');\n\npromise.then((data)\
    \ => {\n  console.log(data); // 这不会被调用\n});\n```\n\n[intro/intro_ex06.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex06.js)\n\
    \n```javascript\nconst promise = Promise.reject('Error!');\n\npromise.catch((error)\
    \ => {\n  console.error(error);\n});\n```\n\n## 处理拒绝 (Rejection)\n\n处理被拒绝 promise\
    \ 有主要方法。在上一个示例中，我们使用了 `then(fulfill, reject)`，但也可以使用 `catch()` 方法：\n\n[intro/intro_ex07.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex07.js)\n\
    \n```javascript\nconst promise = Promise.reject('Error!');\n\npromise.catch((error)\
    \ => {\n  console.error(error);\n});\n```\n\n在链式 promise 时发生错误，解释器会跳过后续所有的 `then()`\
    \ 方法并执行它找到的第一个 `catch()` 方法。考虑以下：\n\n[intro/intro_ex08.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex08.js)\n\
    \n```javascript\nconst promise = Promise.reject('Error!');\n\npromise.then((value)\
    \ => {\n  console.log(value); // 这不会被调用\n}).catch((error) => {\n  console.error(error);\
    \ // 这会被调用\n});\n```\n\n在这里，我们使用 `catch()` 将多个拒绝处理器合并为一个。需要注意的是，`then(fulfill,\
    \ reject)` 并不总是等同于 `then(fulfill).catch(reject)`。交替使用这些模式可能会导致错误。例如：\n\n[intro/intro_ex09.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex09.js)\n\
    \n```javascript\nconst promise = Promise.resolve(10);\n\npromise.then((result)\
    \ => {\n  throw new Error('An error in the fulfillment handler');\n}, (error)\
    \ => {\n  console.error(error); // 这不会被调用\n});\n```\n\n此代码中的履行处理器抛出了错误，但拒绝处理器没有被执行。切换到\
    \ `catch()` 可以解决这个问题：\n\n[intro/intro_ex10.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex10.js)\n\
    \n```javascript\nconst promise = Promise.resolve(10);\n\npromise.then((result)\
    \ => {\n  throw new Error('An error in the fulfillment handler');\n}).catch((error)\
    \ => {\n  console.error(error); // 这会被调用\n});\n```\n\n"
- fmt: "\nThe rejection handler in the `then()` method cannot handle errors that occur\
    \ in the fulfillment handler. You’d need to chain an additional `then()` to do\
    \ that or, better yet, use the `catch()` method.\n\n## Managing Multiple Concurrent\
    \ Promises\n\nWe can chain multiple promises to perform additional asynchronous\
    \ operations one after another. But what if we want to execute multiple promises\
    \ at the same time and react as soon as one or all of them are settled? JavaScript\
    \ provides the following methods for this purpose:\n\n* `Promise.race()` – lets\
    \ you know as soon as one of the given promises either fulfills or rejects\n*\
    \ `Promise.allSettled()` – lets you know when all of the given promises either\
    \ fulfill or reject\n* `Promise.all()` – lets you know as soon as one of the given\
    \ promises rejects or when all of them fulfill\n* `Promise.any()` – lets you know\
    \ as soon as one of the given promises fulfills or when none of them fulfills\n\
    \n`Promise.race()` and `Promise.all()` have been around since the introduction\
    \ of the promise object in ES2015, while `Promise.allSettled()` and `Promise.any()`\
    \ were introduced in ES2020 and ES2021, respectively. Later in the book, we’ll\
    \ learn how to take advantage of each of these methods in our asynchronous programs.\
    \ But before we do that, let’s look at an important technique for processing data\
    \ from external sources: asynchronous iteration.\n\nCopyright © 2021, The Pragmatic\
    \ Bookshelf.\n\n# Chapter 1: Creating Custom Asynchronous Iterators\n\nIterating\
    \ over collections is one of the most common tasks in programming. That’s why\
    \ almost every new edition of ECMAScript introduces features to improve the iteration\
    \ capabilities of the language. These new features make coding easier and more\
    \ efficient, and they allow you to perform tasks that would previously require\
    \ external libraries.\n\nAs a JavaScript developer, you’ll often work with synchronous\
    \ data like customer order information stored via in-memory lists. Iterators give\
    \ you a neat way to process them, allowing you to move through the elements in\
    \ the data structure. What about when you need to process asynchronous data via\
    \ web APIs, like stock prices? Synchronous iterators cannot represent such data\
    \ sources, so that’s where you’ll need to use asynchronous iteration.\n\nThe process\
    \ of asynchronous iteration is a bit like cooking pancakes on a griddle. The first\
    \ step is to heat a lightly oiled griddle. Then you pour the batter onto the griddle,\
    \ filling it up with pancakes. You wait until the edges start to bubble, indicating\
    \ they’re ready to flip. Each pancake will be ready at a different time, depending\
    \ on when you poured the batter and how even the heat source is. You flip the\
    \ pancakes and take them off as they’re ready. So while preparing this simple\
    \ meal, in a sense, you are acting as an asynchronous iterator function.\n\nIn\
    \ this chapter, you’ll get aquainted with iterators and learn to create your own\
    \ custom iterators. Because sync and async iterators are closely related, we’ll\
    \ start with synchronous iterators. Then you’ll use what you’ve learned to create\
    \ async iterators.\n\n## Getting Ready\n\nIterators have been around since ES2015,\
    \ so browser support is solid. Following are the JavaScript features we’ll discuss\
    \ in this chapter along with some links to up-to-date sources for browser support:\n\
    \n* Async functions\n* `for await...of` loops\n* `async` and `await` keywords\n\
    \nIn the Node environment, you’ll need a minimum Node version of `7.6.0` to use\
    \ the `async` and `await` keywords and a minimum version of `10.0.0` to use `for\
    \ await...of`. You can also use a Babel plugin to make use of the features in\
    \ older browsers or Node versions.\n\n## Creating a Custom Iterator\n\nCollection\
    \ objects (including `Array`, `Set`, and `Map`) come with built-in iterators that\
    \ allow us to navigate their values. So, we don’t have to create our own iterators.\
    \ But sometimes these objects don’t serve our purpose. What if we want to customize\
    \ the iteration behavior of an object to return values backward or randomly? Or\
    \ iterate over a plain object or class, both being not iterable by default? In\
    \ that case, we’ll need to define our own `Symbol.iterator`.\n\n| Set and Map\
    \ |\n| --- |\n| ES2015 introduced two new data structures: `Set` and `Map`. A\
    \ `Set` is like an array, a collection of values, but it can’t contain duplicates\
    \ and the items cannot be accessed individually. Instead, a `Set` provides methods\
    \ to iterate over its elements or assert if it contains a value. A `Map` is similar\
    \ to an object, mapping keys to values, but provides more functionality in certain\
    \ situations. Maps are usually used as caches for storing data, which then can\
    \ be readily accessed when needed. |\n\n| Iterable or Iterator? |\n| --- |\n|\
    \ `Iterable` is an object that allows its values to be looped over in a `for...of`\
    \ construct. It does so by providing a method whose key is `Symbol.iterator`.\
    \ That method should be able to produce any number of iterators. `Iterator`, on\
    \ the other hand, is an object’s used to obtain the values to be iterated. |\n\
    \nRemember, to be classified as an iterable, an object must come with a `Symbol.iterator`\
    \ property and specify the return value for each iteration. In the following example,\
    \ we have a plain object that’s iterable because we’ve defined an iterable protocol\
    \ that allows us to access the items of the object one at a time:\n\n[iterators/iterator_ex03.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex03.js)\n\
    \n```javascript\nconst collection = {\n  a: 10,\n  b: 20,\n  c: 30,\n  [Symbol.iterator]()\
    \ {\n    let i = 0;\n    const values = Object.keys(this);\n    return {\n   \
    \   next: () => {\n        return {\n          value: this[values[i++]],\n   \
    \       done: i > values.length\n        }\n      }\n    }\n  }\n};\n\nconst iterator\
