    \n```javascript\nfirstFunction((x) => {\n  // process...\n  secondFunction(x,\
    \ (y) => {\n    // process...\n    thirdFunction(y, (z) => {\n      // And so\
    \ on...\n    });\n  });\n});\n```\n\nCallback hell is the result of poor coding\
    \ practice. If you nest more than a few callbacks, your code will quickly become\
    \ unmanageable. One way to fix this code is to define each function separately:\n\
    \n[intro/intro_ex02.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex02.js)\n\
    \n```javascript\nfirstFunction((x) => {\n  // process...\n  secondFunction(x);\n\
    });\n\nsecondFunction(x, (y) => {\n  // process...\n  thirdFunction(y);\n});\n\
    \nthirdFunction(y, (z) => {\n  // process...\n  fourthFunction(z);\n  // And so\
    \ on...\n});\n```\n\nBy moving functions to the top level, we’ll have a shallower\
    \ code that is separated into small logical sections. This small change results\
    \ in a more manageable code.\n\nStill, the callback model is difficult to work\
    \ with when more complex functionality is needed. With promises, you can easily\
    \ chain multiple asynchronous tasks dynamically. For example, you can make two\
    \ async requests simultaneously, wait for the results, and then determine what\
    \ other async task to do based on the intermediate result. Or you can use a promise\
    \ to track the state of multiple async operations and react as soon as one of\
    \ them is completed.\n\nThat doesn’t mean you should stop using callbacks though.\
    \ Callbacks are still useful when your code may receive a notification more than\
    \ once. For instance, the `setInterval()` method defines a callback function to\
    \ be executed repeatedly, with a fixed time delay between each call. You can’t\
    \ call a promise again once it’s executed, but you can call a callback function\
    \ multiple times.\n\n## Introducing Promises\n\nOriginally, the promise construct\
    \ was used by libraries such as `Q`, `RSVP.js`, and `WinJS`. But it quickly became\
    \ popular enough to encourage the Ecma Technical Committee to take advantage of\
    \ it in the ES2015 standard.\n\nNewer JavaScript APIs use the promise object rather\
    \ than the old-school callback function. For example, the `Fetch API` not only\
    \ provides a simpler syntax compared to the complex API of `XMLHttpRequest` but\
    \ also prevents callback hell by returning a promise. Let’s look at a simple example:\n\
    \n[intro/intro_ex03.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex03.js)\n\
    \n```javascript\nconst promise = fetch('https://eloux.com/async_js/examples/1.json');\n\
    \npromise.then((result) => {\n  // process\n}, (error) => {\n  console.log(error);\n\
    });\n```\n\nThe `fetch()` method allows us to retrieve files across the network.\
    \ This method returns a promise object that acts as a placeholder for the future\
    \ result of the operation. To react to the result, we use the `then()` method.\n\
    \n`then()` accepts two functions as parameters. The first function is called once\
    \ once the promise is succeeded, and the fulfillment value is passed to the function\
    \ as an argument. The second function is called only if the promise is failed,\
    \ with the rejection reason passed as its argument.\n\nThe promise returned by\
    \ `fetch()` remains in the pending state until the Ajax request is completed.\
    \ The spec uses the term `unsettled` to describe a promise that’s pending. After\
    \ receiving data, the promise transitions either to fulfilled or rejected state.\
    \ At this point, the promise is considered settled.\n\nIt is worth noting that\
    \ a promise cannot succeed or fail more than once. It also cannot switch from\
    \ failure to success or vice versa. Both arguments of `then()` are optional. So\
    \ when we don’t need to listen for fulfillment or rejection, we can omit the related\
    \ argument.\n\n## Creating Settled Promises\n\nWhen working your way through the\
    \ examples in this book, you may want to key in and alter each example to gain\
    \ practice. The static `Promise.resolve()` and `Promise.reject()` methods allow\
    \ you to quickly create settled promises and see how the code works when you give\
    \ it a different value.\n\nFor example, the following code creates a promise that’s\
    \ already fulfilled with the value 10:\n\n[intro/intro_ex05.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex05.js)\n\
    \n```javascript\nconst promise = Promise.resolve(10);\n\npromise.then((data) =>\
    \ {\n  console.log(data); // 10\n});\n```\n\nHere, we have a settled promise that\
    \ represents a known value. This promise will never be in the rejected state,\
    \ so adding a handler is pointless. To create a promise in the rejected state,\
    \ we can use `Promise.reject()`, like this:\n\n```javascript\nconst promise =\
    \ Promise.reject('Error!');\n\npromise.then((data) => {\n  console.log(data);\
    \ // This will not be called\n});\n```\n\n[intro/intro_ex06.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex06.js)\n\
    \n```javascript\nconst promise = Promise.reject('Error!');\n\npromise.catch((error)\
    \ => {\n  console.error(error);\n});\n```\n\n## Handling Rejection\n\nThere are\
    \ primary ways to handle a rejected promise. In the previous example, we used\
    \ `then(fulfill, reject)`, but we can also use the `catch()` method:\n\n[intro/intro_ex07.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex07.js)\n\
    \n```javascript\nconst promise = Promise.reject('Error!');\n\npromise.catch((error)\
    \ => {\n  console.error(error);\n});\n```\n\nWhen chaining promises and an error\
    \ occurs, the interpreter skips all `then()` methods that follow and executes\
    \ the first `catch()` method it can find. Consider the following:\n\n[intro/intro_ex08.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex08.js)\n\
    \n```javascript\nconst promise = Promise.reject('Error!');\n\npromise.then((value)\
    \ => {\n  console.log(value); // This will not be called\n}).catch((error) =>\
    \ {\n  console.error(error); // This will be called\n});\n```\n\nHere, we’ve used\
    \ `catch()` to combine multiple rejection handlers into one case at the end of\
    \ the. It’s important to understand that the pattern `then(fulfill, reject)` isn’t\
    \ always equivalent to `then(fulfill).catch(reject)`. Using these interchangeably\
    \ could potentially lead to an error. For example:\n\n[intro/intro_ex09.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex09.js)\n\
    \n```javascript\nconst promise = Promise.resolve(10);\n\npromise.then((result)\
    \ => {\n  throw new Error('An error in the fulfillment handler');\n}, (error)\
    \ => {\n  console.error(error); // This will not be called\n});\n```\n\nThe fulfillment\
    \ handler in this code throws an error, but the rejection handler isn’t executed.\
    \ Switching to `catch()` can fix this problem:\n\n[intro/intro_ex10.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex10.js)\n\
    \n```javascript\nconst promise = Promise.resolve(10);\n\npromise.then((result)\
    \ => {\n  throw new Error('An error in the fulfillment handler');\n}).catch((error)\
    \ => {\n  console.error(error); // This will be called\n});\n```\n"
  raw: '[intro/intro_ex01.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex01.js)


    | ​  | firstFunction((x) => { |


    | ​  | ​*// process...*​ |


    | ​  | secondFunction(x, (y) => { |


    | ​  | ​*// process...*​ |


    | ​  | thirdFunction(y, (z) => { |


    | ​  | ​*// And so on...*​ |


    | ​  | }); |


    | ​  | }); |


    | ​  | }); |


    Callback hell is the result of poor coding practice. If you nest more than a few
    callbacks, your code will quickly become unmanageable. One way to fix this code
    is to define each function separately:


    [intro/intro_ex02.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex02.js)


    | ​  | firstFunction((x) => { |


    | ​  | ​*// process...*​ |


    | ​  | secondFunction(x); |


    | ​  | }); |


    | ​  |  |


    | ​  | secondFunction(x, (y) => { |


    | ​  | ​*// process...*​ |


    | ​  | thirdFunction(y); |


    | ​  | }); |


    | ​  |  |


    | ​  | thirdFunction(y, (z) => { |


    | ​  | ​*// process...*​ |


    | ​  | fourthFunction(z); |


    | ​  | ​*// And so on...*​ |


    | ​  | }); |


    By moving functions to the top level, we’ll have a shallower code that is separated
    into small logical sections. This small change results in a more manageable code.


    Still, the callback model is difficult to work with when more complex functionality
    is needed. With promises, you can easily chain multiple asynchronous tasks dynamically.
    For example, you can make two async requests simultaneously, wait for the results,
    and then determine what other async task to do based on the intermediate result.
    Or you can use a promise to track the state of multiple async operations and react
    as soon as one of them is completed.


    That doesn’t mean you should stop using callbacks though. Callbacks are still
    useful when your code may receive a notification more than once. For instance,
    the setInterval() method defines a callback function to be executed repeatedly,
    with a fixed time delay between each call. You can’t call a promise again once
    it’s executed, but you can call a callback function multiple times.


    ## Introducing Promises


    Originally, the promise construct was used by libraries such as Q, RSVP.js, and
    WinJS. But it quickly became popular enough to encourage the Ecma Technical Committee
    to take advantage of it in the ES2015 standard.


    Newer JavaScript APIs use the promise object rather than the old-school callback
    function. For example, the Fetch API not only provides a simpler syntax compared
    to the complex API of XMLHttpRequest but also prevents callback hell by returning
    a promise. Let’s look at a simple example:


    [intro/intro_ex03.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex03.js)


    | ​  | ​**const**​ promise = fetch(​*''https://eloux.com/async_js/examples/1.json''*​);
    |


    | ​  |  |


    | ​  | promise.then((result) => { |


    | ​  | ​*// process*​ |


    | ​  | }, (error) => { |


    | ​  | console.log(error); |


    | ​  | }); |


    The fetch() method allows us to retrieve files across the network. This method
    returns a promise object that acts as a placeholder for the future result of the
    operation. To react to the result, we use the then() method.


    then() accepts two functions as parameters. The first function is called once
    the promise is succeeded, and the fulfillment value is passed to the function
    as an argument. The second function is called only if the promise is failed, with
    the rejection reason passed as its argument.


    The promise returned by fetch() remains in the pending state until the Ajax request
    is completed. The spec uses the term unsettled to describe a promise that’s pending.
    After receiving data, the promise transitions either to fulfilled or rejected
    state. At this point, the promise is considered settled.


    It’s worth noting that a promise cannot succeed or fail more than once. It also
    cannot switch from failure to success or vice versa. Both arguments of then()
    are optional. So when we don’t need to listen for fulfillment or rejection, we
    can omit the related argument.


    ## Creating Settled Promises


    When working your way through the examples in this book, you may want to key in
    and alter each example to gain practice. The static Promise.resolve() and Promise.reject()
    methods allow you to quickly create settled promises and see how the code works
    when you give it a different value.


    For example, the following code creates a promise that’s already fulfilled with
    the value 10:


    [intro/intro_ex05.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex05.js)


    | ​  | ​**const**​ promise = Promise.resolve(10); |


    | ​  |  |


    | ​  | promise.then((data) => { |


    | ​  | console.log(data); ​*// ⇒ 10*​ |


    | ​  | }); |


    Here, we have a settled promise that represents only a known value. This promise
    will never be in the rejected state, so adding a rejection handler is pointless.
    To create a promise in the rejected state, we can pass a value to the Promise.reject()
    method, like this:


    [intro/intro_ex06.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex06.js)


    | ​  | ​**const**​ promise = Promise.reject(​*''Error!''*​); |


    | ​  |  |


    | ​  | promise.then(​**null**​, (error) => { |


    | ​  | console.error(error); ​*// ⇒ Error!*​ |


    | ​  | }); |


    This code creates a settled promise that’s rejected with a predefined value. If
    we add a fulfillment handler to this code, it will never be called.


    Note that we won’t be covering testing or debugging extensively in this book.
    Don’t forget to take advantage of these methods when debugging your code.


    ## Handling Rejection


    There are two primary ways to handle a rejected promise. In the previous example,
    we used the pattern then(fulfill, reject), but we can also use the catch() method:


    [intro/intro_ex07.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex07.js)


    | ​  | ​**const**​ promise = Promise.reject(​*''Error!''*​); |


    | ​  |  |


    | ​  | promise.​**catch**​((error) => { |


    | ​  | console.error(error); ​*// ⇒ Error!*​ |


    | ​  | }); |


    When chaining promises and an error occurs, the interpreter skips all then() methods
    that follow and executes the first catch() method it can find. Consider the following
    code:


    [intro/intro_ex08.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex08.js)


    | ​  | ​**const**​ promise = Promise.reject(​*''Error!''*​); |


    | ​  |  |


    | ​  | promise.then((value) => { |


    | ​  | ​*// this won''t be executed*​ |


    | ​  | console.log(​*''Hi!''*​); |


    | ​  | }).then((value) => { |


    | ​  | ​*// this won''t be executed either*​ |


    | ​  | }).​**catch**​((error) => { |


    | ​  | console.error(error); |


    | ​  | }); |


    | ​  |  |


    | ​  | ​*// logs:*​ |


    | ​  | ​*// ⇒ Error!*​ |


    Here, we’ve used catch() to combine multiple rejection handlers into one case
    at the end of the chain.


    It’s important to understand that the pattern then(fulfill, reject) isn’t always
    equivalent to then(fulfill).catch(reject). Using these patterns interchangeably
    could potentially lead to an error. For example:


    [intro/intro_ex09.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex09.js)


    | ​  | ​**const**​ promise = Promise.resolve(10); |


    | ​  |  |


    | ​  | promise.then((result) => { |


    | ​  | ​**throw**​ ​**new**​ Error(); |


    | ​  | }, (error) => { |


    | ​  | ​*// this won''t be executed*​ |


    | ​  | console.error(​*''An error occurred in the fulfillment handler''*​); |


    | ​  | }); |


    | ​  |  |


    | ​  | ​*// logs:*​ |


    | ​  | ​*// ⇒ Uncaught (in promise) Error*​ |


    The fulfillment handler in this code throws an error, but the rejection handler
    isn’t executed. Switching to catch() can fix this problem:


    [intro/intro_ex10.js](http://media.pragprog.com/titles/fkajs/code/intro/intro_ex10.js)


    | ​  | ​**const**​ promise = Promise.resolve(10); |


    | ​  |  |


    | ​  | promise.then((result) => { |


    | ​  | ​**throw**​ ​**new**​ Error(); |


    | ​  | }).​**catch**​((error) => { |


    | ​  | console.error(​*''An error occurred in the fulfillment handler''*​); |


    | ​  | }); |


    | ​  |  |


    | ​  | ​*// logs:*​ |


    | ​  | ​*// ⇒ An error occurred in the fulfillment handler*​ |'
