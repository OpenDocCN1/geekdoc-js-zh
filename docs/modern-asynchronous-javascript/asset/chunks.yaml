    | ​  | ​**const**​ controller = ​**new**​ AbortController(); |


    | ​  | setTimeout(() => controller.abort(), timeout); |


    | ​  | settings.signal = controller.signal; |


    | ​  | ​**return**​ fetch(url, settings); |


