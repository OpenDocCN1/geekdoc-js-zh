    | ​  | .then(response => { |


    | ​  | ​**return**​ response.json(); |


    | ​  | }) |


    | ​  | .then(json => { |


    | ​  | console.log(json); |


    | ​  | }) |


    | ​  | .​**catch**​(error => { |


    | ​  | ​**if**​ (error.name === ​*''AbortError''*​) { |


    | ​  | console.log(​*''Request successfully canceled''*​); |


    | ​  | } ​**else**​ { |


    | ​  | console.error(​*''Fetch failed!''*​, error); |


    | ​  | } |


    | ​  | }); |


    | ​  |  |


    | ​  | controller.abort(); |


    | ​  |  |


    | ​  | ​*// logs:*​ |


    | ​  | ​*// => Request successfully cancelled*​ |


    To ensure we’re handling the abort error separately, we can check the name property
    of the error. If it has a value of AbortError, we know it’s thrown by the AbortController
    API. If not, then we handle it like any other error.


    Fetch requests aren’t the only type of request that can be canceled with the AbortController
    API. We can cancel event listeners too!


    ## Removing Multiple Event Listeners


    In client-side JavaScript programming, the flow of the code is determined by events.
    Whenever something happens to the page or web browser, the browser emits an event,
    such as when the user clicks a link or a given resource has loaded. If we want
    to do something when a particular event occurs, we can register one or more functions
    to be called using the addEventListener() method.


    We can later remove an event handler function from an object using the removeEventListener()
    method. If we register dozens of event handlers, we’ll need the exact same number
    of removeEventListener() methods to deregister them, which unnecessarily bloats
    the code. With AbortController we can deregister multiple event listeners in only
    one statement.


    Let’s look at a simple example. Say we want to temporarily give an element some
    special effect. We want to change the text of the element when the user’s pointing
    device (usually a mouse or trackpad) moves the cursor onto the element and reverse
    the effect when it moves past the element. We also want to change the background
