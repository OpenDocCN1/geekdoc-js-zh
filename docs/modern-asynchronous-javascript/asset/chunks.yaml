    may want to define a custom iterator protocol directly when you need an object
    with complicated state-maintaining behavior or you want to provide other methods
    besides next(). But in most other cases, you are best suited to define a generator
    that returns an iterator because state maintenance is mainly done for you.


    In this chapter, we’ll cover how synchronous and asynchronous generators work
    by adapting the examples from the previous chapter. Then we’ll look at a real-world
