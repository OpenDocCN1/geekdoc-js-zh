- fmt: "\nA number of workarounds could be used, but they make the code more complicated.\
    \ Top-level await is an addition to the language that provides a straightforward\
    \ way to use the `await` keyword outside of async functions so that we can perform\
    \ async tasks directly at the top level of the module. Now, modules can act as\
    \ a big async function and importing modules will wait for the child modules to\
    \ fully execute before they themselves start executing.\n\nIn this chapter, we’ll\
    \ find out how top-level await works and how to make use of it to initialize resources,\
    \ define dependency paths dynamically, and load dependencies with a fallback implementation.\n\
    \n## Getting Ready\n\nBefore using top-level await, make sure your browser or\
    \ Node version supports it. You’ll need a minimum Node version of `14.8.0`. You\
    \ can also use a Babel plugin to make use of the feature in older browsers or\
    \ Node versions.\n\nKeep in mind you can’t use top-level await in classic scripts—it\
    \ only works in module scripts and browser dev tools. If you get a `SyntaxError`\
    \ like the following, that means you’re not using it in a module:\n\n![images/await/await_error.png](images/await/await_error.png)\n\
    \nAdding a module to an HTML file is the same as adding a regular script except\
    \ that you should add a `type` attribute with the value of `module`, like this:\n\
    \n| | <script type=\"module\" src=\"module1.js\"></script> |\n\nAlso, modules\
    \ are subject to same-origin policy, meaning that you can’t import them from the\
    \ file system. You’ll need to run the code examples in this chapter on a server.\n\
    \n## Using Top-Level await\n\nWhen the `await` keyword was first introduced, it\
    \ wasn’t possible to use it outside of async functions. You’ve probably encountered\
    \ the fatal syntax error `await is only valid in async function`, too, when attempting\
    \ to use it for the first time:\n\n[await/Await_ex01.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex01.js)\n\
    \n```javascript\nconst res = await fetch('https://example');\n// SyntaxError:\
    \ await is only valid in async function\n```\n\nAs a way to get access to the\
    \ feature, I often wrapped the `await` statements in an immediately invoked async\
    \ function expression, like this:\n\n[await/Await_ex02.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex02.js)\n\
    \n```javascript\n(async function() {\n  const res = await fetch('https://example');\n\
    }());\n```\n\nIt’s unpleasant but functional! With top-level await we no longer\
    \ have to do this, because the `await` keyword works outside of async functions\
    \ as well. Go ahead and execute `await fetch(\"https://google.com\", {mode:\"\
    no-cors\"})` in your browser console. You should see a response like this:\n\n\
    ![images/await/await.png](images/await/await.png)\n\nBut there’s a bigger problem\
    \ that top-level await allows us solve. Bear with me for a moment. When working\
    \ with ES modules, we can make variables and functions available outside the module\
    \ using the `export` keyword. Then other modules in separate files can use the\
    \ `import` keyword to access those variables and functions. Any export or import\
    \ statement must be expressed at the top level of the code.\n\nSay we have a module\
    \ that retrieves weather data for Tokyo, Japan, from an external API, and we want\
    \ to make the result available to other modules:\n\n[await/Await_ex03.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex03.js)\n\
    \n```javascript\nlet result;\nconst api = `http://api.openweathermap.org/data/2.5/weather?q=Tokyo,Japan&APPID=1b1b3e9e909416e5bbe365a0a8505fbb`;\n\
    // use your own app id in production\n(async () => {\n  const response = await\
    \ fetch(api);\n  result = await response.json();\n})();\n\nexport {result};\n\
    ```\n\nIn another module, we’d like to import the result and extract the temperature:\n\
    \n[await/Await_ex04.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex04.js)\n\
    \n```javascript\nimport {result} from './module1.js';\n\nconsole.log(result.main.temp);\n\
    // TypeError: Cannot read property 'main' of undefined\n```\n\nBut this code produces\
    \ a `TypeError` because we’re trying to access the export before the async function\
    \ finishes. We still have a promise waiting to be settled until `result` has a\
    \ value of undefined.\n\nNow let’s delay the `console.log()` method and see what\
    \ happens. Go ahead and encapsulate the method in `setTimeout()`, like this:\n\
    \n[await/Await_ex05.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex05.js)\n\
    \n```javascript\nimport {result} from './module1.js';\n// don't do this in production\n\
    setTimeout(() => {\n  console.log(result.main.temp);\n}, 2000);\n// logs: 292.94\n\
    ```\n\nThis time we get the result we’re looking for (note that the temperature\
    \ is in kelvin). This means that exported variables are undefined until the promise\
    \ is settled. But this is a bad way of coding because now every consumer of `module1.js`\
    \ needs to know what a reasonable wait would be.\n\nWe can’t use the `export`\
    \ keyword inside functions, and prior to the introduction of top-level await,\
    \ we couldn’t use the `await` keyword outside of async functions either. One workaround\
    \ is to export the entire async function as the default export:\n\n[await/Await_ex06.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex06.js)\n\
    \n```javascript\nlet result;\nconst api = `http://api.openweathermap.org/data/2.5/weather?q=Tokyo,Japan&APPID=1b1b3e9e909416e5bbe365a0a8505fbb`;\n\
    // use your app id in production\nexport default (async () => {\n  const response\
    \ = await fetch(api);\n  result = await response.json();\n})();\n\nexport {result};\n\
    ```\n\nThen we could wait for the async function to settle before accessing the\
    \ variable:\n\n[await/Await_ex07.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex07.js)\n\
    \n```javascript\nimport p, {result} from './module1.js';\n\np.then(() => {\n \
    \ console.log(result.main.temp);\n})\n// logs: 292.94\n```\n\nBut as the code\
    \ becomes more complicated, it will become more difficult to manage the modules\
    \ this way. Other workarounds could work as well, but they come with their own\
    \ limitations.\n\nTop-level await aims to solve this problem by enabling developers\
    \ to use the `await` keyword outside async functions. You don’t need to do anything\
    \ special to start top-level await except having a modern browser that supports\
    \ the feature:\n\n[await/Await_ex08.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex08.js)\n\
    \n```javascript\nconst api = `http://api.openweathermap.org/data/2.5/weather?q=Tokyo,Japan&APPID=1b1b3e9e909416e5bbe365a0a8505fbb`;\n\
    // use your own app id in production\nconst response = await fetch(api);\nconst\
    \ result = await response.json();\n\nexport {result};\n```\n\nThen in another\
    \ module we can access the exported variable directly:\n\n[await/Await_ex09.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex09.js)\n\
    \n```javascript\nimport {result} from './module1.js';\n\nconsole.log(result.main.temp);\n\
    // logs: 292.94\n```\n"
