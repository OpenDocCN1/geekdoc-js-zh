    # Introduction


    The introduction of the `promise` object in ES2015 changed the way we write asynchronous
    programs in JavaScript. Similar to callbacks and events, a promise defines a block
    of code to be executed once an operation is finished. But unlike the old approaches,
    it gives us a robust mechanism to track the state of multiple asynchronous tasks
    and verify whether they are all successful.


    But what exactly do we mean when we say a program is asynchronous?


    ## Demystifying Asynchronous Execution


    The concept of asynchrony determines whether a task can start executing before
    another task is finished. In a synchronous execution, the program pauses until
    the current task is completed before moving to the next task. But in an asynchronous
    execution, the program continues executing even when the previous operation hasn’t
    finished yet.


    It helps to think of synchronous executions as a line of people waiting to buy
    movie tickets. If you are at the end of the line, you can’t buy a ticket until
    all the people in front of you have bought theirs. Think of asynchronous executions
    like ordering food in a restaurant. You don’t have to wait for other people who
    have come earlier to get their food before you can order yours. Everyone can order
    food at any time and receive it when it’s ready. Depending on the type of food
    you order, you may get your food sooner or later than other people.


    A bar chart can better illustrate the difference:


    ![images/intro/sync.png](images/intro/sync.png)![images/intro/async.png](images/intro/async.png)


    It’s important to understand that asynchrony and multithreading are two completely
    different concepts. JavaScript is often considered a single-threaded language,
    mostly because web browsers run one thread per global environment.


    But JavaScript, as a programming language, isn’t single-threaded. And there are
    some JavaScript environments that are multi-threaded. With the introduction of
    `Web Workers`, you can even have multiple threads on web browsers (they don’t
    run on the same global environment though).


    But even on a single thread, JavaScript is capable of executing asynchronous code.
    Threads aren’t the only way to perform tasks in parallel. Imagine a restaurant
    with only one cook. The cook can start a burger cooking and set a timer, then
    put some pizza in the oven and set a timer. He can clean the kitchen while the
    food is cooking. When the timer goes off, he takes the food out and serves it.
    If the switch between tasks is efficient enough, you won’t notice any lags.


    You can imagine a multi-threaded environment like a restaurant that has multiple
    cooks. One cook is responsible for cooking burgers, another one is responsible
    for cooking pizzas. But now you have to pay more to keep the other cook and make
    sure they share the resources properly so there will be no conflict. In other
    words, threading describes the number of workers, but asynchrony is about tasks.


    ## Working with Events


    The JavaScript language was created to add interactivity to web pages, so it needed
    a way to detect user actions and react to them. JavaScript’s solution for this
    need was events: whenever you interact with a web page, such as when clicking
    a button, an event takes place, allowing JavaScript code to react to the action.


    Although events have enabled JavaScript programs to detect interaction with objects
    and react to them, its lack of flexibility has been a significant problem for
    some developers. For example, events can happen before the program starts listening
    to them.


    If the user moves the cursor over the box before the `onmouseover` property is
    assigned, the code won’t be executed. Therefore, it’s always necessary to make
    sure the event handlers are assigned before an event occurs.


    Additionally, events can be frustrating to use when working with more than one
    element. For instance, there’s no easy way to detect whether a collection of images
    have been loaded, or check the order in which they have loaded.


    ## Working with Callback Functions


    Perhaps the simplest asynchronous execution in JavaScript is the `setTimeout()`
    function. This function defines a callback function to be executed in the future
    independently of the main program flow, so it doesn’t block the execution of the
    program.


    Another common asynchronous execution in JavaScript is `Ajax`. Similar to `setTimeout()`,
    an `Ajax` call doesn’t stop the execution flow of the program. It specifies a
    piece of code to run as soon as the code receives data from a server.


    The main advantage of using callbacks is that the program can continue doing useful
    work while other tasks are running, so it feels more responsive and there will
    be fewer “hangs.”


    Nesting callbacks is a common practice in JavaScript. But nesting too many callbacks
    can make the code hard to understand and lead to a maintainability issue known
    as callback hell. The following code is an example of callback hell:

