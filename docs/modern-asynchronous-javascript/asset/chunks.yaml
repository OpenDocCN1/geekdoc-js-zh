    ## Managing Multiple Concurrent Promises


    We can chain multiple promises to perform additional asynchronous operations one
    after another. But what if we want to execute multiple promises at the same time
    and react as soon as one or all of them are settled? JavaScript provides the following
    methods for this purpose:


    *   Promise.race() – lets you know as soon as one of the given promises either
    fulfills or rejects


    *   Promise.allSettled() – lets you know when all of the given promises either
    fulfill or reject


    *   Promise.all() – lets you know as soon as one of the given promises rejects
    or when all of them fulfill


    *   Promise.any() – lets you know as soon as one of the given promises fulfills
    or when none of them fulfills


    Promise.race() and Promise.all() have been around since the introduction of the
    promise object in ES2015, while Promise.allSettled() and Promise.any() were introduced
    in ES2020 and ES2021, respectively. Later in the book, we’ll learn how to take
    advantage of each of these methods in our asynchronous programs. But before we
    do that, let’s look at an important technique for processing data from external
    sources: asynchronous iteration.


    Copyright © 2021, The Pragmatic Bookshelf.


    # Chapter 1


    Creating Custom Asynchronous Iterators


    Iterating over collections is one of the most common tasks in programming. That’s
    why almost every new edition of ECMAScript introduces features to improve the
    iteration capabilities of the language. These new features make coding easier
    and more efficient, and they allow you to perform tasks that would previously
    require external libraries.


    As a JavaScript developer, you’ll often work with synchronous data like customer
    order information stored via in-memory lists. Iterators give you a neat way to
    process them, allowing you to move through the elements in the data structure.
    What about when you need to process asynchronous data via web APIs, like stock
    prices? Synchronous iterators cannot represent such data sources, so that’s where
    you’ll need to use asynchronous iteration.


    The process of asynchronous iteration is a bit like cooking pancakes on a griddle.
    The first step is to heat a lightly oiled griddle. Then you pour the batter onto
    the griddle, filling it up with pancakes. You wait until the edges start to bubble,
    indicating they’re ready to flip. Each pancake will be ready at a different time,
    depending on when you poured the batter and how even the heat source is. You flip
    the pancakes and take them off as they’re ready. So while preparing this simple
    meal, in a sense, you are acting as an asynchronous iterator function.


    In this chapter, you’ll get aquainted with iterators and learn to create your
    own custom iterators. Because sync and async iterators are closely related, we’ll
    start with synchronous iterators. Then you’ll use what you’ve learned to create
    async iterators.


    ## Getting Ready


    Iterators have been around since ES2015, so browser support is solid. Following
    are the JavaScript features we’ll discuss in this chapter along with some links
    to up-to-date sources for browser support:


    *   Async functions^([[2]](#f_0024.xhtml_FOOTNOTE-2))


    *   for await...of loops^([[3]](#f_0024.xhtml_FOOTNOTE-3))


    *   async and await keywords^([[4]](#f_0024.xhtml_FOOTNOTE-4))


    In the Node environment, you’ll need a minimum Node version of 7.6.0 to use the
    async and await keywords and a minimum version of 10.0.0 to use for await...of.
    You can also use a Babel plugin to make use of the features in older browsers
    or Node versions.^([[5]](#f_0024.xhtml_FOOTNOTE-5))


    ## Creating a Custom Iterator


    Collection objects (including Array, Set, and Map) come with built-in iterators
    that allow us to navigate their values. So, we don’t have to create our own iterators.
    But sometimes these objects don’t serve our purpose. What if we want to customize
    the iteration behavior of an object to return values backward or randomly? Or
    iterate over a plain object or class, both being not iterable by default? In that
    case, we’ll need to define our own Symbol.iterator.


    | Set and Map |


    | --- |


    | ![images/aside-icons/info.png](images/aside-icons/info.png) | ES2015 introduced
    two new data structures: Set and Map. A Set is like an array, a collection of
    values, but it can’t contain duplicates and the items cannot be accessed individually.
    Instead, a Set provides methods to iterate over its elements or assert if it contains
    a value. A Map is similar to an object, mapping keys to values, but provides more
    functionality in certain situations. Maps are usually used as caches for storing
    data, which then can be readily accessed when needed. |


    | Iterable or Iterator? |


    | --- |


    | ![images/aside-icons/info.png](images/aside-icons/info.png) | Iterable is an
    object that allows its values to be looped over in a for...of construct. It does
    so by providing a method whose key is Symbol.iterator. That method should be able
    to produce any number of iterators. Iterator, on the other hand, is an object
