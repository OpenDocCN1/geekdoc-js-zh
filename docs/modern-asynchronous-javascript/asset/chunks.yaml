    few event handlers, but it becomes unpleasant if we have dozens. For example,
    suppose we have a long list of elements, and we want to enable the user to sort
    the list by dragging and dropping the elements.


    For each element, there’s an event attached to check for the state of dragging.
    We want to disable drag and drop once the user clicks Save. Using AbortController
    can be a time-saver in this situation: rather than removing each event handler
    separately, we can call abort() to remove them all.


    So far, we’ve been canceling requests programmatically, but what if you want to
    give users the option to cancel requests themselves, like when they decide not
    to wait for a download?


    ## Making a User-Cancelable Async Request


    When including large files on your page, you should take into account the fact
    that some users will be on limited bandwidth or mobile devices with expensive
    data plans. Therefore, the ability for a user to load and cancel loading large
    items is valuable.


    Say you need to load a very large photo (in this case, 22 MB in size) from Wikipedia.
    You want to define a button that fetches the photo and another button that aborts
    the loading. Here’s how the program will look:


    ![images/abort/cancellable_req.png](images/abort/cancellable_req.png)


    You can see a live example of this program here:


    [https://eloux.com/async_js/examples/abort_ex08_complete.html](https://eloux.com/async_js/examples/abort_ex08_complete.html)


    First, define an HTML <image> element on the page. The src attribute of this element
    will be filled once the image is loaded. We also need an element to inform the
    user about the outcome, so define a <span> element with a class of result. Next,
    create the buttons. We’re going to disable the abort button until the load button
    is clicked, so give it a disabled attribute:


    [abort/abort_ex08.html](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex08.html)


