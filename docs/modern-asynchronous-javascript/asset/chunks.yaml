    \nCopyright © 2021, The Pragmatic Bookshelf.\n\n# 第 3 章：获取多个资源\n\n假设你想在多个异步请求完成后执行某项操作，无论它们成功还是失败。例如，你需要从四个独立的\
    \ Web API 获取数据并处理结果，但对于某个你可以没有的资源，可能会发生网络错误。`Promise.all()` 方法并不适用于此任务，因为单个网络错误会导致该方法立即拒绝（reject）。\n\
    \n幸运的是，ECMAScript 提供了一个较新的工具，用于报告所有请求的结果：`Promise.allSettled()`。通过这种方法，我们可以跟踪多个\
    \ promise 的状态，而不会让任何 promise 破坏其他 promise 的结果。我们将从检查一个常见的异步任务开始本章：执行多个 promise\
    \ 并处理结果。一旦你了解了潜在的陷阱，我们将查看 `Promise.allSettled()` 方法，并看它与 `Promise.all()` 的对比。\n\
    \n## 准备工作\n\n尽管 `Promise.allSettled()` 相对较新，但所有现代浏览器已经支持了它。但在旧版浏览器中运行示例之前，你可能需要确保浏览器支持它。在\
    \ Node 环境中，你需要 12.0 的版本。你也可以使用 Babel 插件来利用它。\n\n## 执行多个 promise\n\n在创建复杂应用程序时，你不可避免会遇到需要执行多个\
    \ promise 的情况。假设你有一个获取文章的异步函数，如下：\n\n```javascript\nasync function getPost(id)\
    \ {\n  try {\n    return await getPost(id);\n  } catch (error) {\n    // handle\
    \ error\n  }\n}\n```\n\n这段代码在获取单篇文章时运行良好。但如果你需要获取多篇文章呢？易如！创建一个循环来获取你需要的文章：\n\n\
    ```javascript\nconst postIds = ['1', '2', '3', '4'];\npostIds.forEach(async id\
    \ => {\n  const post = await getPost(id);\n  // process the post\n});\n```\n\n\
    但这里有一个问题：`await` 关键字会暂停循环，直到它从 `getPost()` 响应。换句话说，这段代码将按顺序加载文章，而不是同时发出多个请求。\n\
    \n修复此问题的方法之一是使用 `Promise.all()` 方法。`Promise.all()` 返回一个单一 promise，当迭代器中的所有 promise\
    \ 都解析（resolve）时：\n\n```javascript\nconst postIds = ['1', '2', '3', '4'];\nconst\
    \ promises = postIds.map(async (id) => {\n  return await getPost(id);\n});\nconst\
    \ arr = Promise.all(promises);\n```\n\n这里也有猫端！如果迭代器中的一个 promise 被拒绝（reject），`Promise.all()`\
    \ 也会立即拒绝，导致其他所有文章无法加载。这对于那些遵守承诺的老实对象来说是不公平的，对吧？\n\n直到最近，JavaScript 还没有内置方法来等待所有\
    \ promise 处于稳定（无论是已完成还是被拒绝）。幸运的是，ES2020 引入了 `Promise.allSettled()` 方法改变了这一点。通过这种方法，我们可以获取传递给方法的所有\
    \ promise 的结果。\n\n## 使用 Promise.allSettled() 获取多个资源\n\n`Promise.allSettled()`\
    \ 方法返回一个 promise，当所有给定的 promise 都成功完成或被拒绝（换句话说，即“稳定”）时解析。这种行为对于跟踪互不依赖对方完成的多个异步任务非常有用。\n\
