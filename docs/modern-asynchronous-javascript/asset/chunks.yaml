    Top-level await is an addition to the language that provides a straightforward
    way to use the await keyword outside of async functions so that we can perform
    async tasks directly at the top level of the module. Now, modules can act as a
    big async function and importing modules will wait for the child modules to fully
    execute before they themselves start executing.


    In this chapter, we’ll find out how top-level await works and how to make use
    of it to initialize resources, define dependency paths dynamically, and load dependencies
    with a fallback implementation.


    ## Getting Ready


    Before using top-level await, make sure your browser or Node version supports
    it.^([[18]](#f_0060.xhtml_FOOTNOTE-18)) You’ll need a minimum Node version of
    14.8.0\. You can also use a Babel plugin to make use of the feature in older browsers
    or Node versions.^([[19]](#f_0060.xhtml_FOOTNOTE-19))


    Keep in mind you can’t use top-level await in classic scripts—it only works in
    module scripts and browser dev tools. If you get a SyntaxError like the following,
    that means you’re not using it in a module:


    ![images/await/await_error.png](images/await/await_error.png)


    Adding a module to an HTML file is the same as adding a regular script except
    that you should add a type attribute with the value of module, like this:


    | ​  | <script type=​*"module"*​ src=​*"module1.js"*​></script> |


    Also, modules are subject to same-origin policy, meaning that you can’t import
    them from the file system. You’ll need to run the code examples in this chapter
    on a server.


    ## Using Top-Level await


    When the await keyword was first introduced, it wasn’t possible to use it outside
    of async functions. You’ve probably encountered the fatal syntax error await is
    only valid in async function, too, when attempting to use it for the first time:


    [await/Await_ex01.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex01.js)


    | ​  | ​**const**​ res = ​**await**​ fetch(​*''https://example''*​); |


    | ​  | ​*// SyntaxError: await is only valid in async function*​ |


    As a way to get access to the feature, I often wrapped the await statements in
    an immediately invoked async function expression, like this:


    [await/Await_ex02.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex02.js)


    | ​  | (​**async**​ ​**function**​() { |


    | ​  | ​**const**​ res = ​**await**​ fetch(​*''https://example''*​); |


    | ​  | }()); |


    It’s unpleasant but functional! With top-level await we no longer have to do this,
    because the await keyword works outside of async functions as well. Go ahead and
    execute await fetch("https://google.com", {mode:"no-cors"}); in your browser console.
    You should see a response like this:


    ![images/await/await.png](images/await/await.png)


    But there’s a bigger problem that top-level await allows us solve. Bear with me
    for a moment. When working with ES modules, we can make variables and functions
    available outside the module using the export keyword. Then other modules in separate
    files can use the import keyword to access those variables and functions. Any
    export or import statement must be expressed at the top level of the code.


    Say we have a module that retrieves weather data for Tokyo, Japan, from an external
    API, and we want to make the result available to other modules:


    [await/Await_ex03.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex03.js)


    | ​  | ​**let**​ result; |


    | ​  | ​**const**​ api = ​*`http://api.openweathermap.org/data/2.5/weather?*​
    |


    | ​  | ​*q=Tokyo,Japan&APPID=1b1b3e9e909416e5bbe365a0a8505fbb`*​; |


    | ​  | ​*// use your own app id in production*​ |


    | ​  |  |


    | ​  | (​**async**​ () => { |


    | ​  | ​**const**​ response = ​**await**​ fetch(api); |


    | ​  | result = ​**await**​ response.json(); |


    | ​  | })(); |


    | ​  |  |


    | ​  | ​**export**​ {result}; |


    In another module, we’d like to import the result and extract the temperature:


    [await/Await_ex04.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex04.js)


    | ​  | ​**import**​ {result} ​**from**​ ​*''./module1.js''*​; |


    | ​  |  |


    | ​  | console.log(result.main.temp); |


    | ​  |  |


    | ​  | ​*// logs:*​ |


    | ​  | ​*// => TypeError: Cannot read property ''main'' of undefined*​ |


    But this code produces a TypeError because we’re trying to access the export before
    the async function finishes executing. We still have a promise waiting to be settled;
    until then result has a value of undefined.


    Now let’s delay the console.log() method and see what happens. Go ahead and encapsulate
    the method in a setTimeout(), like this:


    [await/Await_ex05.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex05.js)


    | ​  | ​**import**​ {result} ​**from**​ ​*''./module1.js''*​; |


    | ​  |  |


    | ​  | ​*// don''t do this in production*​ |


    | ​  | setTimeout(() => { |


    | ​  | console.log(result.main.temp); |


    | ​  | }, 2000); |


    | ​  |  |


    | ​  | ​*// logs:*​ |


    | ​  | ​*// => 292.94*​ |


    This time we get the result we’re looking for (note that the temperature is in
    kelvin units). This means that exported variables are undefined until the promise
    is settled. But this is a bad way of coding our module because now every consumer
    of module1.js needs to know what a reasonable wait would be.


    We can’t use the export keyword inside functions, and prior to the introduction
    of top-level await, we couldn’t use the await keyword outside of async functions
    either.


    One workaround is to export the entire async function as the default export value:


    [await/Await_ex06.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex06.js)


    | ​  | ​**let**​ result; |


    | ​  | ​**const**​ api = ​*`http://api.openweathermap.org/data/2.5/weather?*​
    |


    | ​  | ​*q=Tokyo,Japan&APPID=1b1b3e9e909416e5bbe365a0a8505fbb`*​; |


    | ​  | ​*// use your own app id in production*​ |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ (​**async**​ () => { |


    | ​  | ​**const**​ response = ​**await**​ fetch(api); |


    | ​  | result = ​**await**​ response.json(); |


    | ​  | })(); |


    | ​  |  |


    | ​  | ​**export**​ {result}; |


    Then we could wait for the async function to settle before accessing the variable:


    [await/Await_ex07.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex07.js)


    | ​  | ​**import**​ p, {result} ​**from**​ ​*''./module1.js''*​; |


    | ​  |  |


    | ​  | p.then(()=>{ |


    | ​  | console.log(result.main.temp); |


    | ​  | }) |


    | ​  |  |


    | ​  | ​*// logs:*​ |


    | ​  | ​*// => 292.94*​ |


    But as the code becomes more complicated, it will become more difficult to manage
    the modules this way. Other workarounds could work as well, but they come with
    their own limitations.


    Top-level await aims to solve this problem by enabling developers to use the await
    keyword outside async functions. You don’t need to do anything special to start
    using top-level await except having a modern browser that supports the feature:


    [await/Await_ex08.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex08.js)


    | ​  | ​**const**​ api = ​*`http://api.openweathermap.org/data/2.5/weather?*​
    |


    | ​  | ​*q=Tokyo,Japan&APPID=1b1b3e9e909416e5bbe365a0a8505fbb`*​; |


    | ​  | ​*// use your own app id in production*​ |


    | ​  |  |


    | ​  | ​**const**​ response = ​**await**​ fetch(api); |


    | ​  | ​**const**​ result = ​**await**​ response.json(); |


    | ​  |  |


    | ​  | ​**export**​ {result}; |


    Then in another module we can access the exported variable directly:


    [await/Await_ex09.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex09.js)


    | ​  | ​**import**​ {result} ​**from**​ ​*''./module1.js''*​; |


    | ​  |  |


    | ​  | console.log(result.main.temp); |


    | ​  |  |


    | ​  | ​*// logs:*​ |


    | ​  | ​*// => 292.94*​ |'
