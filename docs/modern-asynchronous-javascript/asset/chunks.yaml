    for binary large object, which is a data type containing a collection of binary
    data. In JavaScript, `Blob` serves as an essential data interchange method for
    several APIs. They’re-often used when working with data that isn’t in a JavaScript-native
    format, such as images, audio, or other multimedia objects. |


    Now, what if we need to fetch multiple images and want to let the user abort them
    all at the same time?


    ## Aborting Multiple Fetch Requests with One Signal


    Just as we can abort multiple `addEventListener()` methods, we can abort multiple
    `fetch` requests with a single `AbortSignal`. Let’s revise the previous example
    to fetch an array of images rather than a single image. The following image shows
    how our program will look:


    ![images/abort/cancelling_multiple_req.png](images/abort/cancelling_multiple_req.png)


    Here’s a live example:


    [https://eloux.com/async_js/examples/abort_ex09_complete.html](https://eloux.com/async_js/examples/abort_ex09_complete.html)


    This time, we’ll first construct a new array of fetch requests out of the image
    URLs using the `map()` method (line 25). Then we execute them all by passing the
    array to `Promise.all()`. For each image that’s loaded, we convert it into a data
    URL, create an image element, and insert it into the page.


