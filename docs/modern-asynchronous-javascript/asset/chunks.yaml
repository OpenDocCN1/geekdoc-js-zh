  trans: "\n\n在获取可能需要一段时间才能完成的外部资源时，`Promise.race()` 方法会非常有用。通过这种方法，我们可以让一个异步任务与一个在若干毫秒后会被拒绝的\
    \ Promise 进行竞争。根据最先完成的 Promise，我们我们要么获得结果，要么报告错误信息。\n\n让我们创建一个函数，尝试从 API 拉取数据，如果服务器响应不够快，则报告错误。我们将用每个\
    \ 来表示每个结果，并使用 `Promise.race()` 选择第一个可用的结果：\n\n[latency/latency_ex03.js](http://media.pragprog.com/titles/fkajs/code/latency/latency_ex03.js)\n\
    \n```javascript\nfunction fetchData() {\n  const timeOut = 2000; // two seconds\n\
    \  const data = fetch('https://jsonplaceholder.typicode.com/todos/1');\n  const\
    \ failure = new Promise((resolve, reject) => {\n    setTimeout(() => {\n     \
    \ reject(new Error(`Failed to retrieve data after ${timeOut} milliseconds`));\n\
    \    }, timeOut);\n  });\n  return Promise.race([data, failure]);\n}\n\nfetchData().then((response)\
    \ => {\n  console.log(response);\n}).catch((error) => {\n  console.error(error);\n\
    });\n```\n\n在这里，我们将超时时间设置为了两秒，这通常足够接收来自 API 的响应。为了看到超时消息，请将超时时间设置为一毫秒并再次运行代码。果不其然，我们可以看到超时消息：\n\
    \n![images/latency/Timeout_message.png](img/Timeout_message.png)\n\n这段代码运行良好，但仅仅记录错误并不能提供最佳的用户体验。如果在规定时间内没有新数据，我们可以通过使用缓存数据来进一步改进这段代码。让我们稍微修改一下：\n\
    \n[latency/latency_ex04.js](http://media.pragprog.com/titles/fkajs/code/latency/latency_ex04.js)\n\
    \n```javascript\nfunction loadFromCache() {\n  const data = {\n    \"userId\"\
    : 1,\n    \"id\": 1,\n    \"title\": \"delectus aut autem\",\n    \"completed\"\
    : false\n  };\n  return new Promise((resolve) => {\n    resolve(data);\n  });\n\
    }\n\nfunction fetchData() {\n  const timeOut = 2000; // two seconds\n  const cache\
    \ = loadFromCache().then((data) => {\n    return new Promise((resolve) => {\n\
    \      setTimeout(() => {\n        resolve(data);\n      }, timeOut);\n    });\n\
    \  });\n  const freshData = fetch('https://jsonplaceholder.typicode.com/todos/1');\n\
    \  return Promise.race([freshData, cache]);\n}\n\nfetchData().then((response)\
    \ => {\n  console.log(response);\n}).catch((error) => {\n  console.error(error);\n\
    });\n```\n\n在这个版本的代码中，我们并发地从外部 API 获取数据，并从缓存中拉取数据，以防 API 无法访问或响应不够快。为了简单起见，`loadFromCache()`\
    \ 函数返回一个定义的对象，但在实际应用中，你可能会从数据库加载缓存数据。\n\n当然，使用缓存数据仅适用于某些不频繁更改的信息类型。如果你正在获取像股票价格或汇率这样的数据，那么使用\
    \ `Promise.any()` 是更好的选择（参见避免单点故障），因为它允许你从多个 API 请求数据并使用其中可用 API 的结果。\n\n`Promise.race()`\
    \ 的有趣用例是批量处理异步请求。正如 Chris Jensen 所解释的^([[15]](#f_0046.xhtml))\n\n"
- fmt: "\nWhen you only want to automatically cancel a fetch request after a specified\
    \ amount of time, you can use either `Promise.race()` or `AbortController`. It’s\
    \ a matter of preference. `AbortController` is easier to use if you want to cancel\
    \ an async request once a specific DOM event is fired, such as when the user clicks\
    \ a cancel button. `Promise.race()`, on the other hand, works better if you want\
    \ to concurrently fetch data and perform another task, such as pulling backup\
    \ from a database.\n\nConsider the following example. When we run this code, the\
    \ `setTimeout()` method sets a two-second timer to execute `abort()`. If the `fetch`\
    \ is complete in the allotted time, the `abort` will have no effect. If not, an\
    \ error is thrown, as follows:\n\n[abort/abort_ex01.js](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex01.js)\n\
    \n```javascript\nconst controller = new AbortController();\nconst signal = controller.signal;\n\
    \nfetch('https://eloux.com/todos/1', {signal})\n  .then(response => {\n    return\
    \ response.json();\n  })\n  .then(response => {\n    console.log(response);\n\
    \  });\n\nsetTimeout(() => controller.abort(), 2000);\n```\n\nTo be able to abort\
    \ a `fetch()` request, we first need to create an instance of `AbortController`\
    \ (line 1). It’s essential to have an `AbortController` before initiating the\
    \ `fetch` request, so we execute this statement first.\n\nNext, we obtain a `signal`\
    \ object that allows us to exchange information with the `fetch()` method:\n\n\
    ```javascript\nconst signal = controller.signal;\n```\n\nWe then pass this `signal`\
    \ object as an option to `fetch()`:\n\n```javascript\nfetch('https://eloux.com/todos/1',\
    \ {signal});\n```\n\nHere, we’re connecting `signal` and `controller` with the\
    \ request. This connection enables us to abort the request by calling the `abort()`\
    \ method of `controller`:\n\n```javascript\ncontroller.abort();\n```\n\n`abort()`\
    \ is the only method of `controller` and will cause the promise object returned\
    \ by `fetch` to reject with an exception, like this:\n\n![images/abort/abort_error.png](images/abort/abort_error.png)\n\
    \nAt this point, the control will be passed to the `catch()` method (if it exists).\
    \ Upon calling `abort()`, the API will notify the `signal`, which if you want,\
    \ you can listen to by attaching an event handler:\n\n```javascript\nsignal.addEventListener('abort',\
    \ () => {\n  console.log(signal.aborted);\n});\n// logs:\n// => true\n```\n\n\
    Notice how after aborting succeeds, the `aborted` property of `signal` has a value\
    \ of `true`.\n\nAborting a request might take only a few lines of code, but if\
    \ you have to do it a dozen times, you’re making your app unnecessarily hefty.\
    \ So why not turn the code into a function?\n\n[abort/abort_ex03.js](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex03.js)\n\
    \n```javascript\nfunction fetchWithTimeout(url, settings, timeout) {\n  // If\
    \ the timeout argument exists\n  if (timeout === undefined) {\n    return fetch(url,\
    \ settings);\n  }\n\n  // if timeout isn't an integer, throw an error\n  if (!Number.isInteger(timeout))\
    \ {\n    throw new TypeError('The third argument is not an integer');\n  }\n\n\
    \  const controller = new AbortController();\n  setTimeout(() => controller.abort(),\
    \ timeout);\n  settings.signal = controller.signal;\n  return fetch(url, settings);\n\
    }\n```\n\nThis function works like a `fetch()` method but provides the option\
    \ of setting a timeout. If we pass an integer (in milliseconds) as the third argument,\
    \ the request will abort after the time expires. If not, it will retrieve the\
    \ resource like a regular `fetch()`.\n\nA server might take a longer time than\
    \ expected to respond to requests, or might not respond at all. It’s always a\
    \ good idea to set a time limit for async requests to avoid keeping your users.\
    \ But how do you distinguish a fetch request that’s intentionally aborted from\
    \ the ones that terminated because of an error? We’ll explore that next.\n\n##\
    \ Handling an Aborted Request\n\nWhen `abort()` successfully cancels a request,\
    \ the pending promise rejects with a `DOMException` error. But you don’t want\
    \ to show the default error message if the operation is canceled by the user.\
    \ After all, it’s not considered an error if the cancelation is intentional.\n\
    \nSo let’s add a `catch()` method to the promise chain to handle the rejection:\n\
    \n[abort/abort_ex04.js](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex04.js)\n\
    \n```javascript\nconst src = 'https://eloux.com/todos/1';\nconst controller =\
    \ new AbortController();\nconst signal = controller.signal;\n\nfetch(src, {signal})\n\
    \  .then(response => {\n    return response.json();\n  })\n  .then(json => {\n\
    \    console.log(json);\n  })\n  .catch(error => {\n    if (error.name === 'AbortError')\
    \ {\n      console.log('Request successfully canceled');\n    } else {\n     \
    \ console.error('Fetch failed!', error);\n    }\n  });\n\ncontroller.abort();\n\
    // logs:\n// => Request successfully cancelled\n```\n\nTo ensure we’re handling\
    \ the abort error separately, we can check the `name` property of the error. If\
    \ it has a value of `AbortError`, we know it’s thrown by the `AbortController`\
    \ API. If not, then we handle it like any other error.\n\nFetch requests aren’t\
    \ the only type of request that can be canceled with the `AbortController` API.\
    \ We can cancel event listeners too!\n\n## Removing Event Listeners\n\nIn client-side\
    \ JavaScript programming, the flow of the code is determined by events. Whenever\
    \ something happens to the page or web browser, the browser emits an event, such\
    \ as when the user clicks a link or a given resource has loaded. If we want to\
    \ do something when a particular event occurs, we can register one or more functions\
    \ to be called using the `addEventListener()` method.\n\nWe can later remove an\
    \ event handler function from an object using the `removeEventListener()` method.\
    \ If we register dozens of event handlers, we’ll need the exact same number of\
    \ `removeEventListener()` methods to deregister them, which unnecessarily bloats\
    \ the code. With `AbortController` we can deregister multiple event listeners\
    \ in only one statement.\n\nLet’s look at a simple example. Say we want to temporarily\
    \ give an element some special effect. We want to change the text of the element\
    \ when the user’s pointing device (usually a mouse or trackpad) moves the cursor\
    \ onto the element and reverse the effect when it moves past the element. We also\
    \ want to change the background color of the element when the device is pressed\
    \ (`mousedown`) or released (`mouseup`). Here’s how we can implement this effect\
    \ using the old approach:\n\n[abort/abort_ex05.html](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex05.html)\n\
    \n```html\n<!doctype html>\n<html lang=\"en-us\">\n<head>\n  <meta charset=\"\
    utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
    >\n  <script src=\"abort_ex05.js\" defer></script>\n</head>\n<body>\n  <div class=\"\
    container\">Mouse over me!</div>\n</body>\n</html>\n```\n\n[abort/abort_ex05.js](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex05.js)\n\
    \n```javascript\nconst container = document.querySelector('.container');\n\nfunction\
    \ sayHello() {\n  container.textContent = 'Hello';\n}\n\nfunction sayBye() {\n\
    \  container.textContent = 'Bye!';\n}\n\nfunction depress() {\n```\n"
