  trans: "\n\n可以使用许多变通方案，但它们会让代码变得更加复杂。顶层 await（Top-level await）是语言的一项新增，它提供了一种在异步函数之外使用\
    \ `await` 关键字的简单方法，使我们直接在模块的顶层执行异步任务。现在，模块可以像大型异步函数一样工作，导入模块将等待子模块完全执行后，自身才会开始执行。\n\
    \n在本章中，我们将了解顶层 await 的工作原理，以及如何利用它来初始化资源、动态定义依赖路径以及带有回退实现的依赖加载。\n\n## 准备工作\n\n\
    在使用顶层 await 之前，请确保你的浏览器或 Node 版本支持它。你需要至少 `14.8.0` 版本的 Node。你也可以使用 Babel 插件在旧版本的浏览器或\
    \ Node 版本中使用该功能。\n\n请记住，你不能在经典脚本（classic scripts）中使用顶层 await——它只在模块脚本（module scripts）和浏览器开发者工具有效。如果你遇到类似下面的\
    \ `SyntaxError`，说明你没有在模块中使用它：\n\n![images/await/await_error.png](img/await_error.png)\n\
    \n在 HTML 文件中添加模块与添加普通脚本相同，但你应该添加一个值为 `module` 的 `type` 属性，如下：\n\n| | <script type=\"\
    module\" src=\"module1.js\"></script> |\n\n此外，模块受同源策略（same-origin policy）限制，这意味着你不能从文件系统导入它们。你需要在服务器上运行本章的代码示例。\n\
    \n## 使用层 await\n\n当 `await` 关键字首次引入时，无法在异步函数之外使用它。当你第一次尝试使用它时，可能也遇到过致命的语法错误：`await\
    \ is only valid in async function`：\n\n[await/Await_ex01.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex01.js)\n\
    \n```javascript\nconst res = await fetch('https://example');\n// SyntaxError:\
    \ await is only valid in async function\n```\n\n为了使用该功能，我经常将 `await` 语句封装在一个立即调用的异步函数表达式中，如下：\n\
    \n[await/Await_ex02.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex02.js)\n\
    \n```javascript\n(async function() {\n  const res = await fetch('https://example');\n\
    }());\n```\n\n这种做法虽然不愉快但功能可行！有了顶层 await，我们再也不需要这样做，因为 `await` 关键字在异步函数之外也可以工作。在你的浏览器控制台中执行\
    \ `await fetch(\"https://google.com\", {mode:\"no-cors\"})`。你应该看到类似这样的响应：\n\n\
    ![images/await/await.png](img/await.png)\n\n但顶层 await 允许我们解决一个更大的问题。请稍等。在处理 ES\
    \ 模块时，可以使用 `export` 关键字让模块外部可以使用变量和函数。然后，单独文件中的其他模块可以使用 `import` 关键字来访问这些变量和函数。任何导出或导入语句都必须在代码的顶层表示。\n\
    \n假设我们有一个模块从外部 API 获取日本东京的天气数据，并且我们希望让结果对其他模块可用：\n\n[await/Await_ex03.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex03.js)\n\
    \n```javascript\nlet result;\nconst api = `http://api.openweathermap.org/data/2.5/weather?q=Tokyo,Japan&APPID=1b1b3e9e909416e5bbe365a0a8505fbb`;\n\
    // 在生产环境中使用你自己的 app id\n(async () => {\n  const response = await fetch(api);\n\
    \  result = await response.json();\n})();\n\nexport {result};\n```\n\n在另一个模块中，我们想要导入结果并提取温度：\n\
    \n[await/Await_ex04.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex04.js)\n\
    \n```javascript\nimport {result} from './module1.js';\n\nconsole.log(result.main.temp);\n\
    // TypeError: Cannot read property 'main' of undefined\n```\n\n但这段代码产生了一个 `TypeError`，因为我们在异步函数完成之前尝试访问导出内容。在\
    \ `result` 变为 `undefined` 之前，我们仍然有一个 promise 在等待解决。\n\n现在让我们延迟 `console.log()`\
    \ 方法看看会发生什么。在 `setTimeout()` 中封装该方法，如下：\n\n[await/Await_ex05.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex05.js)\n\
    \n```javascript\nimport {result} from './module1.js';\n// 在生产环境中不要这样做做\nsetTimeout(()\
    \ => {\n  console.log(result.main.temp);\n}, 2000);\n// logs: 292.94\n```\n\n\
    这次我们得到了想要的结果（注意温度单位是开尔文）。这意味着在 promise 解决之前，导出的变量是 `undefined` 的。但这是一种糟糕的编码方式，因为现在\
    \ `module1.js` 的每个消费者都需要知道一个合理的等待时间。\n\n我们无法在函数内部使用 `export` 关键字，而在顶层 await 引入之前也无法在异步函数之外使用\
    \ `await` 关键字。一种变通方案是将整个异步函数作为默认导出：\n\n[await/Await_ex06.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex06.js)\n\
    \n```javascript\nlet result;\nconst api = `http://api.openweathermap.org/data/2.5/weather?q=Tokyo,Japan&APPID=1b1b3e9e909416e5bbe365a0a8505fbb`;\n\
    // 在生产环境中使用 app id\nexport default (async () => {\n  const response = await fetch(api);\n\
    \  result = await response.json();\n})();\n\nexport {result};\n```\n\n然后我们可以在访问变量之前等待异步函数的解决：\n\
    \n[await/Await_ex07.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex07.js)\n\
    \n```javascript\nimport p, {result} from './module1.js';\n\np.then(() => {\n \
    \ console.log(result.main.temp);\n})\n// logs: 292.94\n```\n\n但随着代码变得复杂，这种方式管理模块会变得困难。其他方案可行，但它们也有自己的局限性。\n\
    \n顶层 await 通过允许开发者在异步函数之外使用 `await` 关键字来解决这个问题。除了拥有支持该功能的现代浏览器外，你不需要任何特殊操作来开始顶层\
    \ await：\n\n[await/Await_ex08.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex08.js)\n\
    \n```javascript\nconst api = `http://api.openweathermap.org/data/2.5/weather?q=Tokyo,Japan&APPID=1b1b3e9e909416e5bbe365a0a8505fbb`;\n\
    // 在生产环境中使用你自己的 app id\nconst response = await fetch(api);\nconst result = await\
    \ response.json();\n\nexport {result};\n```\n\n然后在另一个模块中，我们可以直接访问导出的变量：\n\n[await/Await_ex09.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex09.js)\n\
    \n```javascript\nimport {result} from './module1.js';\n\nconsole.log(result.main.temp);\n\
    // logs: 292.94\n```\n\n"
- fmt: "\nWith top-level await, ECMAScript modules can await resources, causing other\
    \ modules who import them to wait before they start evaluating their own code.\
    \ Top-level await allows us to do some cool things that would previously require\
    \ a lot of effort to achieve. Let’s take a look at a few practical uses.\n\n##\
    \ Putting Top-Level await to Work\n\nWhen designing a program to support multiple\
    \ languages and regions, you may want to use a runtime value to determine the\
    \ language to use. Say you have an ES module and want to load a language pack\
    \ dynamically, based on the preferred language of the user set in the browser.\
    \ You can take advantage of top-level await to import the messages:\n\n[await/Await_ex10.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex10.js)\n\
    \n```javascript\nconst messages = await import(`./packs/messages-${navigator.language}.js`);\n\
    ```\n\nThe `navigator.language` property allows us to access the preferred language\
    \ of the user, which is usually the language of the browser UI. To embed the value\
    \ of the property within the string, we’ve put it inside `${...}`. The module\
    \ will be waiting for the language pack to be imported and can only evaluate the\
    \ rest of the body once the pack has been loaded.\n\nWe can also use top-level\
    \ await to load dependencies with a fallback implementation. As we learned in\
    \ Avoiding the Single Point of Failure](#f_0039.xhtml_sec.AvoidingSingleFailure),\
    \ it’s important to protect our app against external server issues. Network requests\
    \ to a server might fail. In critical applications, you can provide dependency\
    \ fallbacks to mitigate such failures using top-level await. Here’s an example:\n\
    \n[await/Await_ex11.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex11.js)\n\
    \n```javascript\nlet d3;\ntry {\n  d3 = await import('https://cdnjs.cloudflare.com/ajax/libs/d3/6.7.0/d3.min.js');\n\
    } catch {\n  d3 = await import('https://ajax.googleapis.com/ajax/libs/d3js/6.7.0/d3.min.js');\n\
    }\n```\n\nIn this code, we first attempt to load the D3 JavaScript library from\
    \ Cloudflare. If the import fails, we try an alternate CDN. Alternatively, we\
    \ can use `Promise.any()` to execute both requests asynchronously and use the\
    \ result of the one that responds faster:\n\n[await/Await_ex12.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex12.js)\n\
    \n```javascript\nconst CDNs = [\n  'https://cdnjs.cloudflare.com/ajax/libs/d3/6.7.0/d3.min.js',\n\
    \  'https://ajax.googleapis.com/ajax/libs/d3js/6.7.0/d3.min.js'\n];\nconst d3\
    \ = await Promise.any(CDNs);\n```\n\nAnother use case for top-level await is resource\
    \ initialization. For example:\n\n[await/Await_ex13.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex13.js)\n\
    \n```javascript\nimport {dbConnector } from './utilities.js';\nconst connection\
    \ = await dbConnector.connect();\n```\n\nBy using top-level await, we can make\
    \ the module behave like a big async function. We can now represent resources\
    \ with `await` and handle errors if the module can’t be used.\n\nRemember, a module\
    \ won’t start evaluating its body until the module that’s being imported has finished\
    \ executing its body. So if the other module has a top-level await, it must be\
    \ completed before the module that’s importing it begins executing.\n\n## Wrapping\
    \ Up\n\nPreviously, `await` was valid only in async functions. Times changed and\
    \ `await` got easier. We can use top-level await in modules to avoid wrapping\
    \ code in an async IIFE. We no longer need a workaround when accessing the result\
    \ of a promise from another module. And we can use `await` for tasks like initializing\
    \ resources, defining dependency paths dynamically, and loading dependencies with\
    \ a fallback implementation.\n\n## Thank you for reading!\n\nWe’ve reached the\
    \ end of the book! The beauty of JavaScript is that it is flexible enough to let\
    \ programmers determine how the language will evolve. As a result, the inputs\
    \ and proposals from the JavaScript community have played an important role in\
    \ the way the language has progressed. Anyone can get involved by drafting a proposal\
    \ (read [https://github.com/tc39/proposals](https://github.com/tc39/proposals)).\n\
    \nAn interesting aspect of the process is that new features are implemented by\
    \ browsers before they’re added to the specification. If you want to tune into\
    \ the features that are coming down the pike, here are some resources:\n\n- Check\
    \ out the proposals on GitHub ([https://github.com/tc39/proposals](https://github.com/tc39/proposals)).\
    \ Particularly, look for features that are at stage 3 and stage 4. A stage 3 means\
    \ the feature’s semantics, syntax, and API are completed and it’s very likely\
    \ to be added to the specification.\n- Watch the Google’s V8 engine blog. If something\
    \ gets added to Chrome, this is the place you’ll hear about it ([https://v8.dev/](https://v8.dev/)).\n\
    - Follow and take part in the TC39 Discourse ([https://es.discourse.group/](https://es.discourse.group/)).\
    \ TC39 is the committee responsible for evolving the definition of JavaScript.\n\
    \nThank you for reading! It was my pleasure to write this book. I hope you’ve\
    \ found it useful.\n\n#### Footnotes\n\n[[18]](#f_056.xhtml_FNPTR-18)\n\n[https://caniuse.com/mdn-javascript_operators_await_top_level](https://caniuse.com/mdn-javascript_operators_await_top_level)\n\
    \n[[19]](#f_056.xhtml_FNPTR-19)\n\n[https://babeljs.io/docs/en/babel-plugin-syntax-top-level-await](https://babeljs.io/docs/en/babel-plugin-syntax-top-level-await)\n"
  raw: 'With top-level await, ECMAScript modules can await resources, causing other
    modules who import them to wait before they start evaluating their own code. Top-level
    await allows us to do some cool things that would previously require a lot of
    effort to achieve. Let’s take a look at a few practical uses.


    ## Putting Top-Level await to Work


    When designing a program to support multiple languages and regions, you may want
    to use a runtime value to determine the language to use. Say you have an ES module
    and want to load a language pack dynamically, based on the preferred language
    of the user set in the browser. You can take advantage of top-level await to import
    the messages:


    [await/Await_ex10.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex10.js)


    | ​  | ​**const**​ messages = ​**await**​ ​**import**​(​*`./packs/messages-*​${navigator.language}​*.js`*​);
    |


    The navigator.language property allows us to access the preferred language of
    the user, which is usually the language of the browser UI. To embed the value
    of the property within the string, we’ve put it inside ${...}. The module will
    be waiting for the language pack to be imported and can only evaluate the rest
    of the body once the pack has been loaded.


    We can also use top-level await to load dependencies with a fallback implementation.
    As we learned in [​*Avoiding the Single Point of Failure*​](#f_0039.xhtml_sec.AvoidingSingleFailure),
    it’s important to protect our app against external server issues. Network requests
    to a server might fail. In critical applications, you can provide dependency fallbacks
    to mitigate such failures using top-level await. Here’s an example:


    [await/Await_ex11.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex11.js)


    | ​  | ​**let**​ d3; |


    | ​  |  |


    | ​  | ​**try**​ { |


    | ​  | d3 = ​**await**​ ​**import**​(​*''https://cdnjs.cloudflare.com/ajax/libs/d3/6.7.0/d3.min.js''*​);
    |


    | ​  | } ​**catch**​ { |


    | ​  | d3 = ​**await**​ ​**import**​(​*''https://ajax.googleapis.com/ajax/libs/d3js/6.7.0/d3.min.js''*​);
    |


    | ​  | } |


    In this code, we first attempt to load the D3 JavaScript library from Cloudflare.
    If the import fails, we try an alternate CDN. Alternatively, we can use Promise.any()
    to execute both requests asynchronously and use the result of the one that responds
    faster:


    [await/Await_ex12.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex12.js)


    | ​  | ​**const**​ CDNs = [ |


    | ​  | ​*''https://cdnjs.cloudflare.com/ajax/libs/d3/6.7.0/d3.min.js''*​, |


    | ​  | ​*''https://ajax.googleapis.com/ajax/libs/d3js/6.7.0/d3.min.js''*​ |


    | ​  | ]; |


    | ​  |  |


    | ​  | ​**const**​ d3 = ​**await**​ Promise.any(CDNs); |


    Another use case for top-level await is resource initialization. For example:


    [await/Await_ex13.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex13.js)


    | ​  | ​**import**​ {dbConnector} ​**from**​ ​*''./utilities.js''*​; |


    | ​  |  |


    | ​  | ​**const**​ connection = ​**await**​ dbConnector.connect(); |


    By using top-level await, we can make the module behave like a big async function.
    We can now represent resources with await and handle errors if the module can’t
    be used.


    Remember, a module won’t start evaluating its body until the module that’s being
    imported has finished executing its body. So if the other module has a top-level
    await, it must be completed before the module that’s importing it begins executing.


    ## Wrapping Up


    Previously, await was valid only in async functions. Times changed and await got
    easier. We can use top-level await in modules to avoid wrapping code in an async
    IIFE. We no longer need a workaround when accessing the result of a promise from
    another module. And we can use await for tasks like initializing resources, defining
    dependency paths dynamically, and loading dependencies with a fallback implementation.


    ## Thank you for reading!


    We’ve reached the end of the book! The beauty of JavaScript is that it is flexible
    enough to let programmers determine how the language will evolve. As a result,
    the inputs and proposals from the JavaScript community have played an important
    role in the way the language has progressed. Anyone can get involved by drafting
    a proposal (read [https://github.com/tc39/proposals](https://github.com/tc39/proposals)).


    An interesting aspect of the process is that new features are implemented by browsers
    before they’re added to the specification. If you want to tune into the features
    that are coming down the pike, here are some resources:


    *   Check out the proposals repository on GitHub ([https://github.com/tc39/proposals](https://github.com/tc39/proposals)).
    Particularly, look for features that are at stage 3 and stage 4\. When a feature
    is at stage 3, that means the feature’s semantics, syntax, and API are completed
    and it’s very likely to be added to the specification. A stage 4 proposal will
    be included in the soonest practical standard revision of the specification.


    *   Watch the Google’s V8 JavaScript engine blog. If something gets added to Chrome,
    this is the place you’ll hear about the feature ([https://v8.dev/](https://v8.dev/)).


    *   Follow and take part in the TC39 Discourse group ([https://es.discourse.group/](https://es.discourse.group/)).
    TC39 is the committee responsible for evolving the definition of JavaScript.


    Thank you for reading! It was my pleasure to write this book. I hope you’ve found
    it useful.


    #### Footnotes


    [[18]](#f_0056.xhtml_FNPTR-18)


    [https://caniuse.com/mdn-javascript_operators_await_top_level](https://caniuse.com/mdn-javascript_operators_await_top_level)


    [[19]](#f_0056.xhtml_FNPTR-19)


    [https://babeljs.io/docs/en/babel-plugin-syntax-top-level-await](https://babeljs.io/docs/en/babel-plugin-syntax-top-level-await)


