    Aborting a request might take only a few lines of code, but if you have to do
    it a dozen times, you’re making your app unnecessarily hefty. So why not turn
    the code into a function?


    [abort/abort_ex03.js](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex03.js)


    | ​  | ​**function**​ fetchWithTimeout(url, settings, timeout) { |


    | ​  | ​*// If the timeout argument doesn''t exists*​ |


    | ​  | ​**if**​ (timeout === ​**undefined**​) { |


    | ​  | ​**return**​ fetch(url, settings); |


    | ​  | } |


