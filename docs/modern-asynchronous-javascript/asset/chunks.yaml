    | ​  | ​*// logs:*​ |


    | ​  | ​*// ⇒ 10*​ |


    | ​  | ​*// ⇒ 20*​ |


    | ​  | ​*// ⇒ 30*​ |


    [Symbol.iterator]() works like any other method except that it’s automatically
    called if we use for...of on the object. The following image shows how for...of
    works behind the scenes:


    ![images/iterators/Iterator.png](images/iterators/Iterator.png)


    The iterator object is designed to maintain an internal pointer to a position
    in the items; and each time through the loop, it gives the succeeding value.


    Now, what happens when we use for...of to iterate over a native object that’s
    already iterable, like an array? Calling [Symbol.iterator]() on an array will
    return the result of the values() method because that’s the default iterator of
    arrays.


    While values() is the default iterator of sets and arrays, entries() is the default
    iterator of maps. An object may have several iterators, such as keys(), values(),
    and entries(), but only one of them serves as the default iterator. Built-in iterators
    make it possible to iterate over collection objects easily, and custom iterators
    allow us to define or customize the iteration behavior of objects. But if we want
    to work with asynchronous sources, we’ll need to create custom asynchronous iterators.


    ## Creating a Custom Asynchronous Iterator


    Suppose we want a function that retrieves several URLs and processes the result
    of each URL separately before moving on to the next. In other words, we want to
    retrieve and parse the URLs asynchronously, but not the results. That’s one scenario
    where an asynchronous iterator is useful.


    An asynchronous iterator is very similar to a regular non-async iterator except
    that its next() method returns a promise rather than a plain object. Thus, instead
    of immediately returning the result, the promise will provide the value (or failure
    reason) at some point in the future (like the griddle from our opening analogy,
    which yields a pancake at some point).


    An object is classified as asynchronous iterable when it has a Symbol.asyncIterator
    method that returns an asynchronous iterator. Without further ado, let’s look
    at a simple example of an async iterable object:


    [iterators/iterator_ex04.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex04.js)


    | ​1:  | ​**const**​ collection = { |


    | ​-  | a: 10, |


    | ​-  | b: 20, |


    | ​-  | c: 30, |


    | ​5:  | [Symbol.asyncIterator]() { |


    | ​-  | ​**const**​ keys = Object.keys(​**this**​); |


    | ​-  | ​**let**​ i = 0; |


    | ​-  | ​**return**​ { |


    | ​-  | next: () => { |


    | ​10:  | ​**return**​ ​**new**​ Promise((resolve, reject) => { |


    | ​-  | setTimeout(() => { |


    | ​-  | resolve({ |


    | ​-  | value: ​**this**​[keys[i++]], |


    | ​-  | done: i > keys.length |


    | ​15:  | }); |


    | ​-  | }, 1000); |


    | ​-  | }); |


    | ​-  | } |


    | ​-  | }; |


    | ​20:  | } |


    | ​-  | }; |


    | ​-  |  |


    | ​-  | ​**const**​ iterator = collection[Symbol.asyncIterator](); |


    | ​-  |  |


    | ​25:  | iterator.next().then(result => { |


    | ​-  | console.log(result); ​*// ⇒ {value: 10, done: false}*​ |


    | ​-  | }); |


    | ​-  |  |


    | ​-  | iterator.next().then(result => { |


    | ​30:  | console.log(result); ​*// ⇒ {value: 20, done: false}*​ |


    | ​-  | }); |


    | ​-  |  |


    | ​-  | iterator.next().then(result => { |


    | ​-  | console.log(result); ​*// ⇒ {value: 30, done: false}*​ |


    | ​35:  | }); |


    | ​-  |  |


    | ​-  | iterator.next().then(result => { |


    | ​-  | console.log(result); ​*// ⇒ {value: undefined, done: true}*​ |


    | ​-  | }); |


    Typically, a sync iterator returns an object containing a next() method. With
    each call to next(), a {value, done} pair is returned with the value property
    containing the yielded value. Similarly, an async iterator returns an object containing
    a next() method. But rather than a plain object, next() returns a promise (line
    10) that fulfills to {value, done}.


    For the sake of simplicity, we’ve used the setTimeout() method to resolve the
    promise after one second. But in a real-world example we’re more likely to make
    a call to an API and wait for a response.


    ### Retrieving URLs Separately


    Let’s look at a more concrete example. Remember the use case in [​*Creating a
    Custom Asynchronous Iterator*​](#f_0021.xhtml_sec.CustomAsyncIterator), for an
    asynchronous iterator that retrieves several URLs and processes them separately?
    Here’s how we can implement it:


    [iterators/iterator_ex05.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex05.js)


    | ​1:  | ​**const**​ srcArr = [ |


    | ​-  | ​*''https://eloux.com/async_js/examples/1.json''*​, |


    | ​-  | ​*''https://eloux.com/async_js/examples/2.json''*​, |


    | ​-  | ​*''https://eloux.com/async_js/examples/3.json''*​, |


    | ​5:  | ]; |


    | ​-  |  |


    | ​-  | srcArr[Symbol.asyncIterator] = ​**function**​() { |


    | ​-  | ​**let**​ i = 0; |


    | ​-  | ​**return**​ { |


    | ​10:  | ​**async**​ next() { |


    | ​-  | ​**if**​ (i === srcArr.length) { |


    | ​-  | ​**return**​ { |


    | ​-  | done: ​**true**​ |


    | ​-  | }; |


    | ​15:  | } |


    | ​-  | ​**const**​ url = srcArr[i++]; |


    | ​-  | ​**const**​ response = ​**await**​ fetch(url); |


    | ​-  | ​**if**​ (!response.ok) { |


    | ​-  | ​**throw**​ ​**new**​ Error(​*''Unable to retrieve URL: ''*​ + url); |


    | ​20:  | } |


    | ​-  | ​**return**​ { |


    | ​-  | value: ​**await**​ response.json(), |


    | ​-  | done: ​**false**​ |


    | ​-  | }; |


    | ​25:  | } |


    | ​-  | }; |


    | ​-  | }; |


    | ​-  |  |


    | ​-  | ​**const**​ iterator = srcArr[Symbol.asyncIterator](); |


    | ​30:  |  |


    | ​-  | iterator.next().then(result => { |


    | ​-  | console.log(result.value.firstName); ​*// ⇒ John*​ |


    | ​-  | }); |


    | ​-  |  |


    | ​35:  | iterator.next().then(result => { |


    | ​-  | console.log(result.value.firstName); ​*// ⇒ Peter*​ |


    | ​-  | }); |


    | ​-  |  |


    | ​-  | iterator.next().then(result => { |


    | ​40:  | console.log(result.value.firstName); ​*// ⇒ Anna*​ |


    | ​-  | }); |


    We begin with replacing the default iterator of srcArr (line 7). By assigning
    a new function to the Symbol.asyncIterator property of the array, we can define
    our custom iterator. Within the function, we create a counter variable to keep
    track of the array index. Then we return an object containing an async next()
    method.


    It’s essential to use the async keyword here so that the function returns a promise
    each time it’s called. Line 11 checks whether the end of array has been reached
    by comparing the value of the counter variable to the length of the array. If
    that’s true, there’s no point in continuing the iteration.


    It’s also important to ensure the response was successful (status in the range
    200–299) before proceeding further. Check the value of response.ok (line 18).
    If it doesn’t have a value of true, then there’s been an error fetching the URL.


    Async iterators are invaluable tools when working with web APIs. Often, the data
    can only be retrieved in the form of stream or pagination. Iterators make it possible
    to gracefully obtain the amount of data we need and process them. We’ll see an
    example of this in the next chapter where we write a function to retrieve a specified
    number of commits from the GitHub API.


    Now that you have a foundation in the mechanics of iterators, let’s find out how
    to quickly loop over their items.


    ## Iterating over Async Iterables with for…await…of


    In the previous example, we called the [Symbol.asyncIterator]() of the iterable
    to get an iterator object and called its next() method to resume the execution
    of the iterator. But sometimes we want a more straightforward way of accessing
    the items of an async iterable. We want to quickly get the result of all promises
    and terminate the loop automatically once the done property has a value of true.'
