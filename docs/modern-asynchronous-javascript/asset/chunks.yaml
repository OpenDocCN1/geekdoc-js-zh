    # Chapter 4


    Improving Reliability and Performance


    Nobody likes slow applications. As a programmer, you want to always strive to
    build apps that provide a snappy user experience. But what’s more important is
    designing apps that are able to recover quickly from difficult conditions. When
    working with web APIs, for instance, you need to be prepared for server downtime.
    How would your application react if it couldn’t reach a server?


    Building apps that are responsive and reliable should be at the top of the list
    of every developer. ES2021 Promise.any() is a recent addition to ECMAScript that
    helps us achieve both of these goals at the same time. We can protect our app
    from potential API downtimes by making network requests to multiple APIs asynchronously
    and using the result of the one that’s accessible. What’s more, we can improve
    the performance of critical application services by using the API that responds
    first.


    We’ll start this chapter by looking at how Promise.any() works. Once you get the
    hang of it, the next step is to learn how to make our app resilient against API
    issues and enhance its performance.


