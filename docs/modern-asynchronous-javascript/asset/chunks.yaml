  trans: "\n\n```javascript\n{\n  return {\n    {\n      value: this[values[i++]],\n\
    \      done: i > values.length\n    }\n  };\n}\n\nfor (const value of collection)\
    \ {\n  console.log(value);\n}\n\n// logs:\n// ⇒ 10\n// ⇒ 20\n// ⇒ 30\n```\n\n\
    `Symbol.iterator()` 的工作原理与其他任何方法相似，不同之处在于如果我们对对象使用 `for...of`，它会被自动调用。下面的图片展示了\
    \ `for...of` 在背后的工作原理：\n\n![images/iterators/Iterator.png](img/Iterator.png)\n\
    \n迭代器对象的设计用于维护一个指向项目位置的内部指针；每次循环循环时，它都会提供下一个值。\n\n现在，当我们使用 `for...of` 遍历一个已经可迭代的原生对象（例如数组）时，会发生什么？在数组上调用\
    \ `Symbol.iterator()` 将返回 `values()` 方法的结果，因为那是数组的默认迭代器。\n\n虽然 `values()` 是集合（sets）和数组的默认迭代器，但\
    \ `entries()` 是映射（maps）的默认迭代器。一个对象可以有多个迭代器，例如 `keys()`、`values()` 和 `entries()`，但其中只有一个会作为默认迭代器。内置迭代器使得轻松遍历集合对象成为可能，而自定义迭代器允许我们定义或自定义对象的迭代行为。但如果我们想处理异步源，我们需要创建自定义的异步迭代器。\n\
    \n## 创建自定义异步迭代器\n\n假设我们想要一个函数，获取多个 URL，并在移动到下一个 URL 之前单独处理每个 URL 的结果。换句话说，我们希望异步获取并解析\
    \ URL，而不是获取结果。这是异步迭代器很有用的一种场景。\n\n一个异步迭代器与普通的非异步迭代器非常相似，不同之处在于它的 `next()` 方法返回一个\
    \ promise 而不是普通对象。因此，promise 不会立即返回结果，而是在未来的某个点提供值（或失败原因），就像我们开头比喻中的烤架，它会在某个时刻产出煎饼。\n\
    \n当一个对象拥有一个返回异步迭代器的 `Symbol.asyncIterator` 方法时，它被归类为异步可迭代对象。话多说，让我们来看一个异步可迭代对象的简单示例：\n\
    \n[iterators/iterator_ex04.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex04.js)\n\
    \n```javascript\nconst collection = {\n  a: 10,\n  b: 20,\n  c: 30,\n  [Symbol.asyncIterator]()\
    \ {\n    const keys = Object.keys(this);\n    let i = 0;\n    return {\n     \
    \ next: () => {\n        return new Promise((resolve, reject) => {\n         \
    \ setTimeout(() => {\n            resolve({\n              value: this[keys[i++]],\n\
    \              done: i > keys.length\n            });\n          }, 1000);\n \
    \       });\n      }\n    };\n  }\n};\n\nconst iterator = collection[Symbol.asyncIterator]();\n\
    \niterator.next().then(result => {\n  console.log(result); // {value: 10, done:\
    \ false}\n});\n\niterator.next().then(result => {\n  console.log(result); // {value:\
    \ 20, done: false}\n});\n\niterator.next().then(result => {\n  console.log(result);\
    \ // {value: 30, done: false}\n});\n\niterator.next().then(result => {\n  console.log(result);\
    \ // {value: undefined, done: true}\n});\n```\n\n通常，同步迭代器返回一个包含 `next()` 方法的对象。每次调用\
    \ `next()`，都会返回一个 `{value, done}` 键值对，其中 `value` 属性包含产出的值。同样，异步迭代器返回一个包含 `next()`\
    \ 方法的对象。但 `next()` 返回的不是普通对象而是一个 promise（第 10 行），该 promise 将解析为 `{value, done}`。\n\
    \n为了简单起见，我们使用了 `setTimeout()` 方法在了一秒后解析 promise。但在现实世界的示例中，我们更有可能调用 API 并等待响应。\n\
    \n### 单独获取 URL\n\n让我们来看一个更具体的例子。还记得 创建自定义异步迭代器 中的用例吗？即一个异步迭代器，它用于获取多个 URL 并单独处理它们。这里是我们可以实现它的方式\n\
    \n[iterators/iterator_ex05.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex05.js)\n\
    \n```javascript\nconst srcArr = [\n  'https://eloux.com/async_js/1.json',\n  'https://eloux.com/async_js/2.json',\n\
    \  'https://eloux.com/async_js/3.json'\n];\nsrcArr[Symbol.asyncIterator] = function()\
    \ {\n  let i = 0;\n  return {\n    async next() {\n      if (i === srcArr.length)\
    \ {\n        return {\n          done: true\n        };\n      }\n      const\
    \ url = srcArr[i++];\n      const response = await fetch(url);\n      if (!response.ok)\
    \ {\n        throw new Error('Unable to fetch URL: ' + url);\n      }\n      return\
    \ {\n        value: await response.json(),\n        done: false\n      };\n  \
    \  }\n  };\n};\n\nconst iterator = srcArr[Symbol.asyncIterator]();\n\niterator.next().then(result\
    \ => {\n  console.log(result.value); // John\n});\n\niterator.next().then(result\
    \ => {\n  console.log(result.value); // Peter\n});\n\niterator.next().then(result\
    \ => {\n  console.log(result.value); // Anna\n});\n```\n\n## 使用 for…await…of 遍历异步可迭代对象\n\
    \n在上一个例子中，我们调用可迭代对象的 [Symbol.asyncIterator]() 来获取迭代器对象，并调用其 `next()` 方法来恢复迭代器的执行。但有时我们希望有一种更直接的方法来访问异步可迭代对象的项目。\n\
    \n"
- fmt: "\nThe `for..of` loop allows you to loop over iterable objects, but it doesn’t\
    \ work with asynchronous iterables (returns undefined). ES2018 introduced `for...await...of`\
    \ as a variant of `for...of` that can iterate over both sync and async iterables.\n\
    \nTo see this statement in action, let’s look at this rewritten version of the\
    \ previous example. Notice how `for...await...of` saves lines of code by executing\
    \ the same statement for the value of each property:\n\n[iterators/iterator_ex06.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex06.js)\n\
    \n```javascript\nconst srcArr = [\n  'https://eloux.com/async_js/examples/1.json',\n\
    \  'https://eloux.com/async_js/examples/2.json',\n  'https://eloux.com/async_js/examples/3.json',\n\
    ];\n\nsrcArr[Symbol.asyncIterator] = function() {\n  let i = 0;\n  return {\n\
    \    async next() {\n      if (i === srcArr.length) {\n        return {\n    \
    \      done: true\n        };\n      }\n      const url = srcArr[i++];\n     \
    \ const response = await fetch(url);\n      if (!response.ok) {\n        throw\
    \ new Error('Unable to retrieve URL: ' + url);\n      }\n      return {\n    \
    \    value: await response.json(),\n        done: false\n      };\n    }\n  };\n\
    };\n\n(async function() {\n  for await await (const url of srcArr) {\n    console.log(url.firstName);\n\
    \  }\n})();\n\n// logs:\n// ⇒ John\n// ⇒ Peter\n// ⇒ Anna\n```\n\nWhen we run\
    \ this code, the JavaScript engine executes the `Symbol.asyncIterator` method\
    \ of the object to obtain an asynchronous iterator. With each iteration of the\
    \ loop, the iterator executes the `next()` method and returns a promise (this\
    \ happens behind the scenes). As soon as the promise is fulfilled, the value of\
    \ the `value` property is assigned to `url`. As with `for...of`, the loop will\
    \ continue until `done` has a value of `true`.\n\nBecause we can use `for...await...of`\
    \ only inside asynchronous functions and generators, we’ve wrapped the statement\
    \ in an IIFE (immediately invoked function expression). Otherwise, the code would\
    \ throw a `SyntaxError`.\n\nIt’s a common practice to enclose `for...await...of`\
    \ in a `try...catch` statement. This way when a promise rejects, we can gracefully\
    \ handle the rejection:\n\n[iterators/iterator_ex07.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex07.js)\n\
    \n```javascript\nconst collection = {\n  [Symbol.asyncIterator]() {\n    return\
    \ {\n      next: () => {\n        return Promise.reject(new Error('Something went\
    \ wrong.'))\n      }\n    };\n  }\n};\n\n(async function() {\n  try {\n    for\
    \ await await (const value of collection) {}\n  } catch (error) {\n    console.error('Caught:\
    \ ' + error.message);\n  }\n})();\n\n// logs:\n// ⇒ Caught: Something went wrong.\n\
    ```\n\nThis iterator returns a `Promise` object that is rejected. Without `try...catch`,\
    \ we would see an `Uncaught (in promise) Error` in the browser’s console. The\
    \ `try...catch` statement allows us to specify a response should an exception\
    \ be thrown. The `for...await...of` statement provides a convenient, concise way\
    \ of accessing the items of an async iterable. By wrapping it in `try...catch`\
    \ statement, we have the ability to handle rejections the way we want.\n\n## To\
    \ Infinity and Beyond\n\n![images/aside-icons/info.png](images/aside-icons/info.png)\
    \ An interesting aspect of iterators is that they are infinite. For instance,\
    \ you may have Fibonacci iterator that delivers an infinite sequence.\n\n### Detecting\
    \ Whether an Object Is Iterable\n\nSo far we’ve been working with iterable objects\
    \ we “own.” Before iterating over an object we haven’t created, it’s important\
    \ to ensure that the object is iterable; otherwise, the code may throw a `TypeError`:\n\
    \n[iterators/iterator_ex08.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex08.js)\n\
    \n```javascript\n// a plain object\nconst collection = {\n  a: 10,\n  b: 20,\n\
    \  c: 30\n};\n\nfor (let value of collection) { // ⇒ TypeError: collection is\
    \ not iterable\n  console.log(value);\n}\n```\n\nDetecting whether an object is\
    \ iterable isn’t complicated: check for the existence of `Symbol.iterator` on\
    \ the object and ensure it’s a function (the `for...of` construct performs a similar\
    \ check):\n\n[iterators/iterator_ex09.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex09.js)\n\
    \n```javascript\nfunction isIterable(object) {\n  return typeof object[Symbol.iterator]\
    \ === \"function\";\n}\n\nconsole.log(isIterable({a: 10, b: 20})); // ⇒ false\n\
    console.log(isIterable(123)); // ⇒ false\nconsole.log(isIterable(\"abc\")); //\
    \ ⇒ true\nconsole.log(isIterable([10, 20, 30])); // ⇒ true\n```\n\nThe process\
    \ of detecting async iterables is almost the same, except that you’ll need to\
    \ look for `Symbol.asyncIterator` on the object like this:\n\n[iterators/iterator_ex10.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex10.js)\n\
    \n```javascript\nconst collection = {\n  [Symbol.asyncIterator]: async function()\
    \ {\n    // ...\n  }\n};\n\nfunction isAsyncIterable(object) {\n  return typeof\
    \ object[Symbol.asyncIterator] === \"function\";\n}\n\nconsole.log(isAsyncIterable(collection));\
    \ // ⇒ true\n```\n\nWhen working with objects originating from external sources,\
    \ you might expect that they will always remain in a certain shape. But writing\
    \ your code based on this assumption is a recipe for error. Before using the objects\
    \ you haven’t created, always ensure they have the property/method you’re looking\
    \ for.\n\n## Wrapping Up\n\n`Symbol.iterator` and `Symbol.asyncIterator` are the\
    \ cornerstone of iterables, and you can take advantage of them to create custom\
    \ iterators. Custom iterators allow you to define or customize the iteration behavior\
    \ of JavaScript objects. You can’t use `for...of` to iterate over async iterables;\
    \ instead you should use `for...await...of`. Next up, we’ll work with generator\
    \ functions to enhance your JavaScript code.\n\n#### Footnotes\n\n[[2](#f_0019.xhtml_FNPTR-2)\n\
    https://caniuse.com/async-functions\n\n[[3](#f_0019.xhtml_FNPTR-3)\nhttps://caniuse.com/mdn-javascript_statements_for_await_of\n\
    \n[[4](#f_0019.xhtml_FNPTR-4)\nhttps://caniuse.com/mdn-javascript_operators_await\n\
    \n[[5](#f_0019.xhtml_FNPTR-5)\nhttps://babeljs.io/docs/en/babel-plugin-proposal-async-generator-functions\n\
    \nCopyright © 2021, The Pragmatic Bookshelf.\n"
