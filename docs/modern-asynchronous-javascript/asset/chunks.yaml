    # Early Praise for Modern Asynchronous JavaScript


    For developers looking to level up on both their command and understanding of
    asynchronous JavaScript, especially newer and less familiar methods on the Promise
    API, this is an indispensable reference and solid guide. Faraz Kelhini walks you
    through the thorny problems around working asynchronously with iterables and provides
    excellent and inspiring examples and easy-to-study source code.


    | → | Karl Stolley |

    |  | Web Developer, Researcher, Professor, and Author of Programming WebRTC, Illinois
    Institute of Technology |


    Faraz Kelhini’s efficient organization and fine writing make Modern Asynchronous
    JavaScript a valuable introduction to the topic. The dozens of succinct code examples
    that are included round out an indispensable package for the intermediate-to-advanced
    JavaScripter.


    | → | Victor Gavenda |

    |  | Former Executive Editor, Pearson Education/Peachpit Press |


    JavaScript moves fast, and even seasoned developers need to pay attention to keep
    up with the language. Modern Asynchronous JavaScript is a pithy primer on newly
    introduced JavaScript features that help make asynchronous code more concise and
    safer. Anyone writing asynchronous JavaScript code, whether it runs in a browser
    or in Node.js, should pay attention. All of the ugly JavaScript code I’ve written
    recently wishes I’d read this book sooner.


    | → | Lukas Mathis |

    |  | Software Engineer, UI Designer, and Author of Designed for Use, Appway |


    I’ve worked with countless technical writers throughout my career, and Faraz stands
    out among them for his ability to clearly explain complex topics. His work in
    Modern Asynchronous JavaScript meets those high standards and then some. Even
    for a non-dev like myself, Faraz makes it easy to grasp the concepts.


    | → | Matt Angelosanto |

    |  | Managing Editor, LogRocket Blog |


    # Acknowledgments


    Writing and producing a book requires a team effort. My sincere thanks to the
    entire Pragmatic team for their great efforts to get this book to fruition. In
    particular, I would like to thank my editor, Margaret Eldridge, whose watchful
    eyes identified gaps in my writing and saved me from mistakes.


    A big thanks to experts who reviewed the book prior to publication, including
    Karl Stolley, Lukas Mathis, Michael Fazio, Trevor Burham, Kevin Gisi, Matthew
    Margolis, Mike Riley, Francesco Piccoli, and Stefan Turalski. These wonderful
    developers offered very helpful insight on the code quality and suggested ways
    to improve.


    My love to my family for their support and putting up with an author’s crankiness.
    I am grateful for that. And special thanks to my dear friends, Mahsa and Asal,
    for their encouragement during the writing of this book. You’re amazing!


    Finally, thanks to the eager readers who bought the book while it was in beta.
    You put your trust in me, and I appreciate that.


    Copyright © 2021, The Pragmatic Bookshelf.


    # Preface


    Modern applications increasingly rely on asynchronous programming to perform multiple
    tasks at the same time, and JavaScript is quickly evolving to address this need.
    Many new features of JavaScript are designed to only work asynchronously. As a
    result, gaining the knowledge to perform async tasks effectively is a must for
    today’s JavaScript programmers.


    Designing responsive asynchronous programs might be challenging at first, but
    once you get the hang of it, the outcome is rewarding. This book is here to help
    you with that. You’ll find multiple examples to help you write advanced programs
    using the new capabilities of JavaScript introduced in ES2020, ES2021, and ESNext.
    You’ll also discover various techniques to manage and coordinate the asynchronous
    parts of your code efficiently.


    Make sure you actually type and execute the code examples as you follow along
    in the book. Some examples may appear simple, but there’s a big difference between
    reading the code and being able to write it on your own.

