  trans: "\n\n`then()` 方法中的拒绝处理器（rejection handler）无法处理成功处理器（fulfillment handler）中发生的错误。你需要链式调用额外的\
    \ `then()`，或者更好的是使用 `catch()` 方法。\n\n## 管理多个并发 Promise\n\n我们可以链式多个 promise 来按顺序执行额外的异步操作。但如果我们想同时执行多个\
    \ promise 并在其中一个或全部完成（settled）时立即做出响应怎么办？JavaScript 提供了以下方法来实现这一目的：\n\n* `Promise.race()`\
    \ – 只要给定的 promise 中有一个变为完成（fulfill）或拒绝（reject），就会通知你。\n* `Promise.allSettled()`\
    \ – 当所有给定的 promise 都变为完成或拒绝时，就会通知你。\n* `Promise.all()` – 只要给定的 promise 中有一个被拒绝，或者所有它们都完成时，就会通知你。\n\
    * `Promise.any()` – 只要给定的 promise 中有一个变为完成，或者没有一个被完成时，就会通知你。\n\n`Promise.race()`\
    \ 和 `Promise.all()` 自 ES2015 引入 promise 对象以来就存在了，而 `Promise.allSettled()` 和 `Promise.any()`\
    \ 分别在 ES2020 和 ES2021 中引入。在书的后面部分，我们将学习如何在异步程序中利用这些方法的每一种。但在在此之前，让我们来看一种处理来自外部源数据的重要技术：异步迭代。\n\
    \n版权所有 © 2021, The Pragmatic Bookshelf.\n\n# 第 1 章：创建自定义异步迭代器\n\n遍历集合（collections）是编程中最常见的任务之一。这就是为什么\
    \ ECMAScript 的几乎每一个新版本都引入了改进语言迭代能力的特性。这些新特性使得编码变得更加简单、高效，并允许你执行以前可能需要外部库的任务。\n\
    \n作为一名 JavaScript 开发者，你经常会处理同步数据，例如通过内存列表存储的客户订单信息。迭代器（Iterators）为你提供了一种整洁的方式来处理它们，允许你在数据结构中的元素之间移动。那么当你需要通过\
    \ Web API 处理异步数据（例如股票价格）怎么办？同步迭代器无法表示此类数据源，这时你就需要使用异步迭代。\n\n异步迭代的过程有点像在煎锅上煎煎饼。第一步是加热一个涂了少量油的煎锅。然后你把面糊倒在煎锅上，填满煎饼。你等到边缘开始出现气泡，这表明它们准备好翻面了。每个煎饼准备好的时间不同，取决于你什么时候倒面糊以及热源有多均匀。在煎饼做好时将其翻面并取下。因此，在准备这份简单食物的过程中，从某种意义上说，你充当了一个异步迭代器函数。\n\
    \n在本章中，你将熟悉迭代器并学习创建自己的自定义迭代器。由于同步和异步迭代器密切相关，我们将从同步迭代器开始。然后你将利用所学知识创建异步迭代器。\n\n\
    ## 准备工作\n\n迭代器自 ES2015 起就存在，因此浏览器支持非常稳定。以下是本章将讨论的 JavaScript 特性，以及指向浏览器支持最新资源的链接：\n\
    \n* 异步函数（Async functions）\n* `for await...of` 循环\n* `async` 和 `await` 关键字\n\n\
    在 Node 环境中，你需要至少 `7.6.0`  Node 版本来使用 `async` 和 `await` 关键字，至少 `10.0.0` 版本来使用 `for\
    \ await...of`。你也可以使用 Babel 插件在旧版本的浏览器或 Node 版本中使用这些特性。\n\n## 创建自定义迭代器\n\n集合对象（包括\
    \ `Array`、`Set` 和 `Map`）带有内置的迭代器，允许我们导航其值。因此，我们不需要创建自己的迭代器。但有时这些对象并不符合我们的需求。如果我们想自定义对象的迭代行为，以反向或随机的方式返回值呢？或者遍历一个普通对象或类（它们默认都是不可迭代的）？在这种情况下，我们需要定义自己的\
    \ `Symbol.iterator`。\n\n| Set 和 Map |\n| --- |\n| ES2015 引入了两个新数据结构：`Set` 和 `Map`。`Set`\
    \ 类似于数组，值的集合，但它不能包含重复项，且无法单独访问项。相反，`Set` 提供了遍历其元素或断言它是否包含某个值的方法。`Map` 类似于对象，将键映射到值，但在某些情况下提供了更多功能。Maps\
    \ 通常用作存储数据的缓存，在需要时可以随时访问。 |\n\n| 可迭代对象 (Iterable) 还是迭代器 (Iterator)？ |\n| --- |\n\
    | `Iterable` 是一个允许其值在 `for...of` 结构中进行循环的对象。它通过提供一个键为 `Symbol.iterator` 的方法来实现这一点。该方法应该能够产生任意数量的迭代器。相反，`Iterator`\
    \ 是用于获取要迭代值的对象。 |\n\n记住，要被分类为可迭代对象（iterable），一个对象必须带有 `Symbol.iterator` 属性，并指定每次迭代的返回值。在接下来的示例中，我们有一个可迭代的普通对象，这是因为我们定义了一个可迭代协议，允许我们逐个访问对象的各个项：\n\
    \n[iterators/iterator_ex03.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex03.js)\n\
    \n```javascript\nconst collection = {\n  a: 10,\n  b: 20,\n  c: 30,\n  [Symbol.iterator]()\
    \ {\n    let i = 0;\n    return {\n      next() {\n        return {\n        \
    \  value: Object.keys(this)[i++],\n          done: i >= Object.keys(this).length\n\
    \        }\n      }\n    }\n  }\n};\n\nconst iterator = collection[Symbol.iterator]();\n\
    console.log(iterator.next()); // {value: 10, done: false}\nconsole.log(iterator.next());\
    \ // {value: 20, done: false}\nconsole.log(iterator.next()); // {value: 30, done:\
    \ false}\nconsole.log(iterator.next()); // {value: undefined, done: true}\n```\n\
    \n`next()` 方法返回对象的迭代结果。该方法始终返回一个包含两个属性的对象：`value` 和 `done`。`value` 属性持有迭代器返回的值。`done`\
    \ 属性持有一个布尔值，仅在没有值返回时被为 true。\n\n我们需要一种方法来跟踪要返回的值，所以我们定义了一个初始值为 `0` 的计数器。为了定义返回值，我们使用了\
    \ `Object.keys()`，它获取属性名的数组。现在当我们调用 `collection[Symbol.iterator()]` 时，它返回一个包含\
    \ `next()` 方法的对象。每次调用 `next()`，它都会返回一个 `{value, done}` 对。\n\n使用 `next()` 不是遍历可迭代对象的唯一方法。`for...of`\
    \ 语句允许我们创建循环，并在可迭代对象上重复执行相同的函数。如果我们想快速获取对象中所有项的值，`for...of` 更好。相反，`next()` 更加冗长，但它允许我们看到每次迭代发生了什么。让我们使用\
    \ `for...of` 重写这个示例以简化代码：\n\n[iterators/iterator_ex03_with_for-of.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex03_with_for-of.js)\n\
    \n```javascript\nconst collection = {\n  a: 10,\n  b: 20,\n  c: 30,\n  [Symbol.iterator]()\
    \ {\n    let i = 0;\n    const values = Object.keys(this);\n    yield values[i++];\n\
    \  }\n};\n\nfor (const value of collection) {\n  console.log(value);\n}\n```\n\
    \n"
- fmt: "\n```javascript\n{\n  return {\n    {\n      value: this[values[i++]],\n \
    \     done: i > values.length\n    }\n  };\n}\n\nfor (const value of collection)\
    \ {\n  console.log(value);\n}\n\n// logs:\n// ⇒ 10\n// ⇒ 20\n// ⇒ 30\n```\n\n\
    `Symbol.iterator()` works like any other method except that it’s automatically\
    \ called if we use `for...of` on the object. The following image shows how `for...of`\
    \ works behind the scenes:\n\n![images/iterators/Iterator.png](images/iterators/Iterator.png)\n\
    \nThe iterator object is designed to maintain an internal pointer to a position\
    \ in the items; and each time through the loop, it gives the succeeding value.\n\
    \nNow, what happens when we use `for...of` to iterate over a native object that’s\
    \ already iterable, like an array? Calling `Symbol.iterator()` on an array will\
    \ return the result of the `values()` method because that’s the default iterator\
    \ of arrays.\n\nWhile `values()` is the default iterator of sets and arrays, `entries()`\
    \ is the default iterator of maps. An object may have several iterators, such\
    \ as `keys()`, `values()`, and `entries()`, but only one of them serves as the\
    \ default iterator. Built-in iterators make it possible to iterate over collection\
    \ objects easily, and custom iterators allow us to define or customize the iteration\
    \ behavior of objects. But if we want to work with asynchronous sources, we’ll\
    \ need to create custom asynchronous iterators.\n\n## Creating a Custom Asynchronous\
    \ Iterator\n\nSuppose we want a function that retrieves several URLs and processes\
    \ the result of each URL separately before moving on to the next. In other words,\
    \ we want to retrieve and parse the URLs asynchronously, but not the results.\
    \ That’s one scenario where an asynchronous iterator is useful.\n\nAn asynchronous\
    \ iterator is very similar to a regular non-async iterator except that its `next()`\
    \ method returns a promise rather than a plain object. Thus, instead of immediately\
    \ returning the result, the promise will provide the value (or failure reason)\
    \ at some point in the future (like the griddle from our opening analogy, which\
    \ yields a pancake at some point).\n\nAn object is classified as asynchronous\
    \ iterable when it has a `Symbol.asyncIterator` method that returns an asynchronous\
    \ iterator. Without further ado, let’s look at a simple example of an async iterable\
    \ object:\n\n[iterators/iterator_ex04.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex04.js)\n\
    \n```javascript\nconst collection = {\n  a: 10,\n  b: 20,\n  c: 30,\n  [Symbol.asyncIterator]()\
    \ {\n    const keys = Object.keys(this);\n    let i = 0;\n    return {\n     \
    \ next: () => {\n        return new Promise((resolve, reject) => {\n         \
    \ setTimeout(() => {\n            resolve({\n              value: this[keys[i++]],\n\
    \              done: i > keys.length\n            });\n          }, 1000);\n \
    \       });\n      }\n    };\n  }\n};\n\nconst iterator = collection[Symbol.asyncIterator]();\n\
    \niterator.next().then(result => {\n  console.log(result); // {value: 10, done:\
    \ false}\n});\n\niterator.next().then(result => {\n  console.log(result); // {value:\
    \ 20, done: false}\n});\n\niterator.next().then(result => {\n  console.log(result);\
    \ // {value: 30, done: false}\n});\n\niterator.next().then(result => {\n  console.log(result);\
    \ // {value: undefined, done: true}\n});\n```\n\nTypically, a sync iterator returns\
    \ an object containing a `next()` method. With each call to `next()`, a `{value,\
    \ done}` pair is returned with the `value` property containing the yielded value.\
    \ Similarly, an async iterator returns an object containing a `next()` method.\
    \ But rather than a plain object, `next()` returns a promise (line 10) that fulfills\
    \ to `{value, done}`.\n\nFor the sake of simplicity, we’ve used the `setTimeout()`\
    \ method to resolve the promise after one second. But in a real-world example\
    \ we’re more likely to make a call to an API and wait for a response.\n\n### Retrieving\
    \ URLs Separately\n\nLet’s look at a more concrete example. Remember the use case\
    \ in [Creating a Custom Asynchronous Iterator](#f_0021.xhtml_sec.CustomAsyncIterator),\
    \ for an asynchronous iterator that retrieves several URLs and processes them\
    \ separately? Here’s how we can implement it:\n\n[iterators/iterator_ex05.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex05.js)\n\
    \n```javascript\nconst srcArr = [\n  'https://eloux.com/async_js/1.json',\n  'https://eloux.com/async_js/2.json',\n\
    \  'https://eloux.com/async_js/3.json'\n];\nsrcArr[Symbol.asyncIterator] = function()\
    \ {\n  let i = 0;\n  return {\n    async next() {\n      if (i === srcArr.length)\
    \ {\n        return {\n          done: true\n        };\n      }\n      const\
    \ url = srcArr[i++];\n      const response = await fetch(url);\n      if (!response.ok)\
    \ {\n        throw new Error('Unable to fetch URL: ' + url);\n      }\n      return\
    \ {\n        value: await response.json(),\n        done: false\n      };\n  \
    \  }\n  };\n};\n\nconst iterator = srcArr[Symbol.asyncIterator]();\n\niterator.next().then(result\
    \ => {\n  console.log(result.value); // John\n});\n\niterator.next().then(result\
    \ => {\n  console.log(result.value); // Peter\n});\n\niterator.next().then(result\
    \ => {\n  console.log(result.value); // Anna\n});\n```\n\n## Iterating over Async\
    \ Iterables with for…await…of\n\nIn the previous example, we called the [Symbol.asyncIterator]()\
    \ of the iterable to get an iterator object and called its `next()` method to\
    \ resume the execution of the iterator. But sometimes we want a more straightforward\
    \ way of accessing the items of an async iterable.\n"
