    Promise.any() is a valuable addition to the Promise object. This method allows
    us to execute multiple promises asynchronously and use the result of the one that’s
    accessible to respond faster. Make use of the Promise.any() method in your applications
    to avoid the dreaded SPOF and you’ll potentially see some welcome performance
    improvement too. Faster applications equal happier users, which is the promise
    of Promise.any().


    So far, we’ve talked about Promise.any(), Promise.allSettled(), and Promise.all().
    One more method that you should know about is Promise.race(). This method comes
    in handy when you need to set a time limit for computationally expensive tasks.


