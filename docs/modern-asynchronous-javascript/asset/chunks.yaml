    ## Using the Promise.any() Method


    Promise.any() returns a pending promise that resolves asynchronously as soon as
    one of the promises in the given iterable fulfills. All right, let’s execute the
    following code and see what happens:


    [promise.any/promise.any_ex01.js](http://media.pragprog.com/titles/fkajs/code/promise.any/promise.any_ex01.js)


    | ​  | ​**const**​ promises = [ |


    | ​  | Promise.reject(​**new**​ Error(​*''failure #1''*​)), |


    | ​  | Promise.reject(​**new**​ Error(​*''failure #2''*​)), |


    | ​  | Promise.resolve(​*''YES!''*​) |


    | ​  | ]; |


    | ​  |  |


    | ​  | Promise.any(promises). |


    | ​  | then((result) => console.log(result)); |


    | ​  |  |


    | ​  | ​*// logs:*​ |


    | ​  | ​*// => YES!*​ |


    Here we have an array of three promise objects passed to Promise.any(). Because
    Promise.resolve() returns a promise that’s already fulfilled, the promise returned
    by Promise.any() is immediately fulfilled with the given value.


    But what happens if all input promises reject?


    [promise.any/promise.any_ex02.js](http://media.pragprog.com/titles/fkajs/code/promise.any/promise.any_ex02.js)


    | ​  | ​**const**​ promises = [ |


    | ​  | Promise.reject(​**new**​ Error(​*''failure #1''*​)), |


    | ​  | Promise.reject(​**new**​ Error(​*''failure #2''*​)), |


    | ​  | Promise.reject(​**new**​ Error(​*''failure #3''*​)) |


    | ​  | ]; |


    | ​  |  |


    | ​  | Promise.any(promises).then( |


    | ​  | (result) => {console.log(result)}, |


    | ​  | (error) => {console.error(error)} |


    | ​  | ); |


    | ​  |  |


    | ​  | ​*// logs:*​ |


    | ​  | ​*// => AggregateError: No Promise in Promise.any was resolved*​ |


    The AggregateError object wraps all the rejection reasons of all the input promises
    in a single error, and we can read them using the errors property. Edit line 9
    of the preceding code and replace console.error(error) with console.error(error.errors),
    like this:


    [promise.any/promise.any_ex03.js](http://media.pragprog.com/titles/fkajs/code/promise.any/promise.any_ex03.js)


    | ​  | ​**const**​ promises = [ |


    | ​  | Promise.reject(​**new**​ Error(​*''failure #1''*​)), |


    | ​  | Promise.reject(​**new**​ Error(​*''failure #2''*​)), |


    | ​  | Promise.reject(​**new**​ Error(​*''failure #3''*​)) |


    | ​  | ]; |


    | ​  |  |


    | » | Promise.any(promises).then( |


    | » | (result) => {console.log(result)}, |


    | » | (error) => {console.error(error.errors)} |


    | » | ); |


    You should see a message like this in your browser’s console showing all the rejection
    reasons we’ve specified in the input promises:


    ![images/promise.any/Aggregate_error.png](images/promise.any/Aggregate_error.png)


    Only one other case causes Promise.any() to reject: passing an iterable that’s
    empty. Here’s an example:


    [promise.any/promise.any_ex04.js](http://media.pragprog.com/titles/fkajs/code/promise.any/promise.any_ex04.js)


    | ​  | Promise.any([]).then( |


    | ​  | (result) => {console.log(result)}, |


    | ​  | (error) => {console.log(error)} |


    | ​  | ); |


    | ​  |  |


    | ​  | ​*// logs:*​ |


    | ​  | ​*// => AggregateError: No Promise in Promise.any was resolved*​ |


    Notice the empty array at line 1 that causes Promise.any() to reject. The error
    message is exactly the same as when all promises reject, which is something to
    be wary of because you don’t want to misunderstand the reason for the failure.


    Now that you know how the Promise.any() method works, it’s time to look at some
    real-world examples. Up next, we’re going to learn how to take advantage of this
    method to make our app more resilient.


    ## Avoiding the Single Point of Failure


    A single point of failure (SPOF) is a component of a system that with just one
    malfunction or fault will stop the entire system from working. If you want to
    have a reliable application, you should be able to identify and avoid potential
    SPOFs in the system.


    A common SPOF in web applications occurs when fetching critical resources, such
    as data for financial markets, from external APIs. If the API is inaccessible,
    the app will stop working. The Promise.any() method is extremely useful in this
    regard. It enables us to request data from multiple APIs and use the result of
    the first successful promise.


    Let’s look at an example. In the following code, we have an array containing the
    URL of two APIs, both of which return the same info. Promise.any() will attempt
    to fetch the two URLs at the same time; so as long as one of the APIs is available,
    the code works fine:


    [promise.any/promise.any_ex05.js](http://media.pragprog.com/titles/fkajs/code/promise.any/promise.any_ex05.js)


    | ​  | ​**const**​ apis = [ |


    | ​  | ​*''https://eloux.com/todos/1''*​, |


    | ​  | ​*''https://jsonplaceholder.typicode.com/todos/1''*​ |


    | ​  | ]; |


    | ​  |  |


    | ​  | ​**async**​ ​**function**​ fetchData(api) { |


    | ​  | ​**const**​ response = ​**await**​ fetch(api); |


    | ​  | ​**if**​ (response.ok) { |


    | ​  | ​**return**​ response.json(); |


    | ​  | } ​**else**​ { |


    | ​  | ​**return**​ Promise.reject(​**new**​ Error(​*''Request failed''*​)); |


    | ​  | } |


    | ​  | } |


    | ​  |  |


    | ​  | ​**function**​ getData() { |


    | ​  | ​**return**​ Promise.any([ |


    | ​  | fetchData(apis[0]), |


    | ​  | fetchData(apis[1]) |


    | ​  | ]); |


    | ​  | } |


    | ​  |  |


    | ​  | getData().then((response) => console.log(response.title)); |


    Now, to see what actually happens behind the scenes, check the network tab of
    your browser’s console. Press F12 on your keyboard to open developer tools and
    then navigate to the network. The following image shows the Network tab of Mozilla
    Firefox:


    ![images/promise.any/Network_tab.png](images/promise.any/Network_tab.png)


    You can see that the status of both requests is 200, which means they are successfully
    fulfilled. But remember, Promise.any() only uses the result of the first promise
    that fulfills, so the other result is ignored.


    To see what happens if one of the APIs fails, we’re going to block one of the
    requests. If you’re using Firefox, click on the icon that says Request Blocking
    and enter eloux.com in the given field and press enter. This step will block any
    request to eloux.com, allowing you to simulate that the API is inaccessible, as
    shown in the image that follows:


    ![images/promise.any/Request_blocking.png](images/promise.any/Request_blocking.png)


    If you refresh the page, you’ll see that the request to eloux.com is unsuccessful.
    But since the other API is available, our code works fine. Now, what happens if
    both APIs are unavailable? Go ahead and enter jsonplaceholder.typicode.com, the
    URL of the other API, to block it. Switch back to the Console tab and run the
    code again. You should see an error message like this:


    | ​  | Uncaught (in promise) AggregateError: No Promise in Promise.any was resolved
    |


    We’re getting an AggregateError that denotes all promises passed to Promise.any()
    are rejected. But this error message isn’t the best way to handle a rejected promise.
    Let’s chain a catch() method and output a custom error message:


    [promise.any/promise.any_ex06.js](http://media.pragprog.com/titles/fkajs/code/promise.any/promise.any_ex06.js)


    | ​  | ​**const**​ apis = [ |


    | ​  | ​*''https://eloux.com/todos/1''*​, |


    | ​  | ​*''https://jsonplaceholder.typicode.com/todos/1''*​ |


    | ​  | ]; |


    | ​  |  |


    | ​  | ​**async**​ ​**function**​ fetchData(api) { |


    | ​  | ​**const**​ response = ​**await**​ fetch(api); |


    | ​  | ​**if**​ (response.ok) { |


    | ​  | ​**return**​ response.json(); |


    | ​  | } ​**else**​ { |


    | ​  | ​**return**​ Promise.reject(​**new**​ Error(​*''Request failed''*​)); |


    | ​  | } |


    | ​  | } |


    | ​  |  |


    | ​  | ​**function**​ getData() { |


    | ​  | ​**return**​ Promise.any([ |


    | ​  | fetchData(apis[0]), |


    | ​  | fetchData(apis[1]) |'
