    Notice how line 13 of the code registers an async function to be called when the
    Load Photo button is clicked. Within the function, we disable the Load button
    to prevent another click and enable the Cancel Loading button. Next we attempt
    to retrieve the image using the standard fetch() function.


    To be able to display the image we’ve retrieved, we need to convert it into an
    object URL. First use the Blob() constructor to get a Blob object (line 22). Now
    you can create a URL that refers to the Blob by passing the object into the URL.createObjectURL()
    method (line 23). All that’s left to do to display the image is insert the resulting
    data into the src attribute of the image tag. At the end of the code, we revert
    the buttons to their original state.


