  trans: "\n\n`for..of` 循环允许你遍历迭代对象，但它无法用于异步迭代器（会返回 `undefined`）。ES2018 引入了 `for...await...of`\
    \ 作为 `for...of` 的变体，它可以同时遍历同步和异步迭代器。\n\n为了看到这一语句的运作，让我们看看上一个示例的重写版本。注意 `for...await...of`\
    \ 如何通过对每个属性的值执行相同的语句来减少代码行数：\n\n[iterators/iterator_ex06.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex06.js)\n\
    \n```javascript\nconst srcArr = [\n  'https://eloux.com/async_js/examples/1.json',\n\
    \  'https://eloux.com/async_js/examples/2.json',\n  'https://eloux.com/async_js/examples/3.json',\n\
    ];\n\nsrcArr[Symbol.asyncIterator] = function() {\n  let i = 0;\n  return {\n\
    \    async next() {\n      if (i === srcArr.length) {\n        return {\n    \
    \      done: true\n        };\n      }\n      const url = srcArr[i++];\n     \
    \ const response = await fetch(url);\n      if (!response.ok) {\n        throw\
    \ new Error('Unable to retrieve URL: ' + url);\n      }\n      return {\n    \
    \    value: await response.json(),\n        done: false\n      };\n    }\n  };\n\
    };\n\n(async function() {\n  for await await (const url of srcArr) {\n    console.log(url.firstName);\n\
    \  }\n})();\n\n// logs:\n// ⇒ John\n// ⇒ Peter\n// ⇒ Anna\n```\n\n当我们运行这段代码时，JavaScript\
    \ 引擎会执行对象的 `Symbol.asyncIterator` 方法来获取异步迭代器。在循环的每次迭代中，迭代器都会执行 `next()` 方法并返回一个\
    \ promise（这在后台发生）。一旦 promise 一完成，`value` 属性的值就会赋值给 `url`。与 `for...of` 一样，循环将一直持续直到\
    \ `done` 的值为 `true`。\n\n由于我们只能在异步函数和生成器中使用 `for...await...of`，因此我们将该语句封装在一个 IIFE（立即执行函数表达式）中。否则，代码将抛出\
    \ `SyntaxError`。\n\n将 `for...await...of` 包裹在 `try...catch` 语句中是一种常见做法。这样当 promise\
    \ 被拒绝时，我们可以优雅地处理这种拒绝：\n\n[iterators/iterator_ex07.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex07.js)\n\
    \n```javascript\nconst collection = {\n  [Symbol.asyncIterator]() {\n    return\
    \ {\n      next: () => {\n        return Promise.reject(new Error('Something went\
    \ wrong.'))\n      }\n    };\n  }\n};\n\n(async function() {\n  try {\n    for\
    \ await await (const value of collection) {}\n  } catch (error) {\n    console.error('Caught:\
    \ ' + error.message);\n  }\n})();\n\n// logs:\n// ⇒ Caught: Something went wrong.\n\
    ```\n\n这个迭代器返回了一个被拒绝的 `Promise` 对象。如果没有 `try...catch`，我们将在浏览器控制台中看到 `Uncaught\
    \ (in promise) Error`。`try...catch` 语句允许我们在抛出异常时指定响应。`for...await...of` 语句提供了一种访问异步迭代器项的便捷简洁的方法。通过将其封装在\
    \ `try...catch` 语句中，我们能够按照我们想要的方式处理拒绝。\n\n## 迈向无限之外\n\n![images/aside-icons/info.png](img/info.png)\
    \ 迭代器的一个有趣方面是它们是无限。例如，你可能有一个交付无限序列的斐波那契迭代器。\n\n### 检测对象是否可迭代\n\n到目前为止，我们一直处理的是我们“拥有”的可迭代对象。在遍历一个尚未创建的对象之前，确保该对象是可迭代的重要的；否则代码可能会抛出\
    \ `TypeError`：\n\n[iterators/iterator_ex08.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex08.js)\n\
    \n```javascript\n// a plain object\nconst collection = {\n  a: 10,\n  b: 20,\n\
    \  c: 30\n};\n\nfor (let value of collection) { // ⇒ TypeError: collection is\
    \ not iterable\n  console.log(value);\n}\n```\n\n检测一个对象是否可迭代并不复杂：检查对象上是否存在 `Symbol.iterator`\
    \ 并确保它是一个函数（`for...of` 构造也执行了类似的检查）：\n\n[iterators/iterator_ex09.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex09.js)\n\
    \n```javascript\nfunction isIterable(object) {\n  return typeof object[Symbol.iterator]\
    \ === \"function\";\n}\n\nconsole.log(isIterable({a: 10, b: 20})); // ⇒ false\n\
    console.log(isIterable(123)); // ⇒ false\nconsole.log(isIterable(\"abc\")); //\
    \ ⇒ true\nconsole.log(isIterable([10, 20, 30])); // ⇒ true\n```\n\n检测异步迭代器是否可迭代的过程几乎相同，只是你需要在对象上查找\
    \ `Symbol.asyncIterator`：\n\n[iterators/iterator_ex10.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex10.js)\n\
    \n```javascript\nconst collection = {\n  [Symbol.asyncIterator]: async function()\
    \ {\n    // ...\n  }\n};\n\nfunction isAsyncIterable(object) {\n  return typeof\
    \ object[Symbol.asyncIterator] === \"function\";\n}\n\nconsole.log(isAsyncIterable(collection));\
    \ // ⇒ true\n```\n\n在处理来自外部的对象时，你可能期望它们始终保持某种形状。但基于这种假设编写代码会导致错误。在使用尚未创建的对象之前，始终确保它们具有你所需的属性。\n\
    \n## 总结\n\n`Symbol.iterator` 和 `Symbol.asyncIterator` 是可对象的基石，你可以利用它们创建自定义迭代器。自定义迭代器允许你定义或自定义\
    \ JavaScript 迭代行为。你不能使用 `for...of` 遍历异步迭代器；相反，你应该使用 `for...await...of`。接下来，我们将使用生成器函数来增强你的\
    \ JavaScript 代码。\n\n#### 脚注\n\n[2]\nhttps://caniuse.com/async-functions\n\n[3]\n\
    https://caniuse.com/mdn-javascript_statements_for_await_of\n\n[4]\nhttps://caniuse.com/mdn-javascript_operators_await\n\
    \n[5]\nhttps://babeljs.io/docs/en/babel-plugin-proposal-async-generator-functions\n\
    \nCopyright © 2021, The Pragmatic Bookshelf.\n\n"
- fmt: "\nEvery generator function is an iterator, but the opposite is not true. You\
    \ may want to define a custom iterator protocol directly when you need an object\
    \ with complicated state-maintaining behavior or you want to provide other methods\
    \ besides `next()`. But in most other cases, you are best suited to define a generator\
    \ that returns an iterator because state maintenance is mainly done for you.\n\
    \nIn this chapter, we’ll cover how synchronous and asynchronous generators work\
    \ by adapting the examples from the previous chapter. Then we’ll look at a real-world\
    \ example so you can see for yourself where asynchronous generators are useful.\n\
    \n## Getting Ready\n\nAs with iterators, generator functions have been available\
    \ since ES2015 and browser support is solid. In the Node environment, you’ll need\
    \ a minimum Node version of `4.0.0`. And if you want to use generators in older\
    \ browsers or Node versions, you can use a Babel plugin.\n\n## Using a Generator\
    \ to Define a Custom Iterator\n\nGenerator functions enhance the process of defining\
    \ the iterable protocol by providing an iterative algorithm. When called, a generator\
    \ function doesn’t execute its body immediately. Instead, it returns a special\
    \ type of iterator known as a generator object, as shown in the following image.\n\
    \n![images/generators/Generator.png](images/generators/Generator.png)\n\nWe can\
    \ run the generator function’s body by calling its `next()` method. The `yield`\
    \ keyword pauses the generator and specifies the value to be returned. With that\
    \ in mind, let’s adapt the example in [Creating a Custom Iterator](#f_0020.xhtml_sec.CustomIterator).\
    \ The result of this code is identical, but it’s much easier to implement.\n\n\
    Notice the asterisk following the function keyword at line 5. This is our generator\
    \ function and defines a custom iterator for collection:\n\n[generators/gen_ex01.js](http://media.pragprog.com/titles/fkajs/code/generators/gen_ex01.js)\n\
    \n```javascript\n1:  const collection = {\n  -   a: 10,\n  -   b: 20,\n  -   c:\
    \ 30,\n5:   [Symbol.iterator]: function*() {\n  -     for (let key in this) {\n\
    \  -       yield this[key];\n  -     }\n  -   }\n10:  };\n  -   const iterator\
    \ = collection[Symbol.iterator]();\n  -   console.log(iterator.next()); // ⇒ {value:\
    \ 10, done: false}\n15: console.log(iterator.next()); // ⇒ {value: 20, done: false}\n\
    \  -   console.log(iterator.next()); // ⇒ {value: 30, done: false}\n  -   console.log(iterator.next());\
    \ // ⇒ {value: undefined, done: true}\n```\n\nWe’ve used a for...in loop inside\
    \ the generator to iterate over the object’s properties. With each iteration,\
    \ the `yield` keyword halts the loop’s execution and returns the value of the\
    \ succeeding property to the caller.\n\nIt’s possible to call a generator function\
    \ as many times as needed, and each time it returns a new generator object. But\
    \ a generator object can be iterated only once. Since the object returned by a\
    \ generator is always an iterator, we can use the for...of syntax to iterate over\
    \ the result as well.\n\nNow that we know how synchronous generators work, we’re\
    \ ready to look at its asynchronous counterpart.\n\n## Creating an Asynchronous\
    \ Generator\n\nAn async generator is similar to a sync generator in that calling\
    \ `next()` resumes the execution of the generator until reaching the `yield` keyword.\
    \ But rather than returning a plain object, `next()` returns a promise.\n\nYou\
    \ can think of an async generator as a combination of an async function and a\
    \ generator function. Let’s rewrite the example from [Retrieving URLs Separately](#f_0021.xhtml_sec.AsyncExample),\
    \ using a generator function. Notice the `async` keyword and the asterisk symbol\
    \ (\\*) at line 7 indicating an asynchronous generator function:\n\n[generators/gen_ex02.js](http://media.pragprog.com/titles/fkajs/code/generators/gen_ex02.js)\n\
    \n```javascript\n1:  const srcArr = [\n  -   'https://eloux.com/async_js/examples/1.json',\n\
    \  -   'https://eloux.com/async_js/examples/2.json',\n  -   'https://eloux.com/async_js/examples/3.json',\n\
    5: ];\n  -   srcArr[Symbol.asyncIterator] = async function*() {\n  -     let i\
    \ = 0;\n  -     for (const url of this) {\n10:      const response = await fetch(url);\n\
    \  -      if (!response.ok) {\n  -        throw new Error('Unable to retrieve\
    \ URL: ' + response.status);\n  -      }\n  -      yield response.json();\n15:\
    \    }\n  - };\n  -   const iterator = srcArr[Symbol.asyncIterator]();\n  -  \
    \ \n20: iterator.next().then(result => {\n  console.log(result.value.firstName);\
    \ // ⇒ John\n  });\n  -   iterator.next().then(result => {\n25: console.log(result.value.firstName);\
    \ // ⇒ Peter\n  });\n  -   iterator.next().then(result => {\n30: console.log(result.value.firstName);\
    \ // ⇒ Anna\n  });\n```\n\nWithin this generator, we’ve used the `await` keyword\
    \ to wait for the fetch operation to complete. As with generator functions, `yield`\
    \ returns the result to the caller. In production, you’ll also want to use `catch()`\
    \ to handle errors during iteration. You can chain `catch()` the same way as its\
    \ sister method. For example:\n\n```javascript\niterator.next()\n  .then(result\
    \ => {\n    // ...\n  })\n  .catch(error => {\n    console.error('Caught: ' +\
    \ error.message);\n  });\n```\n\n## Iterating over Paginated Data\n\nOne situation\
    \ we want to use asynchronous iteration over is when working with APIs that provide\
    \ paginated data. By using an asynchronous iterator, we can seamlessly make network\
    \ requests and iterate over the results. For example, GitHub provides an API that\
    \ allows us to retrieve commits for a repository. The response is in JSON format\
    \ and contains the data for the last 30 commits. Say we want to retrieve info\
    \ for the remaining commits. We can achieve that using an asynchronous iterator\
    \ or, better yet, a generator. Let’s create an asynchronous generator and program\
    \ it to handle the pagination:\n\n[generators/gen_ex03.js](http://media.pragprog.com/titles/fkajs/code/generators/gen_ex03.js)\n\
    \n```javascript\n1:  // create an async generator function\n  -  async function*\
    \ generator(repo) {\n  -    // create an infinite loop\n5:    for (;;) {\n  -\
    \      // fetch the repo\n  -      const response = await fetch(repo);\n  -  \
    \    \n10:     // parse the body text as JSON\n  -     const data = await response.json();\n\
    \  -     \n  -     // yield the info of each commit\n  -     for (let commit of\
    \ data) {\n15:       yield commit;\n  -     }\n  -     \n  -     // extract the\
    \ URL of the next page from the headers\n  -     const link = response.headers.get('Link');\n\
    20:     repo = /<([^>]+)>;\\s*rel=\"next\"/.exec(link)?.[1];\n  -\n  -     //\
    \ if there's no \"next page\", break the loop.\n  -     if (repo === undefined)\
    \ {\n  -       break;\n  -     }\n  -   }\n  - }\n```\n"
