    Here, we’ve applied the map() method to an iterable of promises. Within the method,
    we use catch() to return promises that resolve with an error value. This way,
    we can simulate the behavior of Promise.allSettled() while being able to directly
    access the result of promises.


    Often, we use Promise.all() and Promise.allSettled() with similar types of requests,
    but there’s no written rule that we should. You may find yourself in a situation
    where you need to read a local file, retrieve a JSON document from a web API,
    and load an XML document from another API. Once you obtain data from all three
    async requests, you want to process them. Promise.all() and Promise.allSettled()
    are ideal for such scenarios.


    Keep in mind that you will want to use these methods only when you need to process
    the result of multiple async requests together. If it’s possible to process the
    result of each async request individually, then handle each promise with its own
    then() handler. This way, you can execute your code as soon as each promise is
    resolved.


    ## Wrapping Up


    In this chapter, we looked at potential pitfalls when executing multiple promises
    at the same time. We learned why looping over asynchronous tasks could be a bad
    idea because it will cause the promises to run sequentially. Then we learned about
    the Promise.allSettled() method and compared it to Promise.all().


    While Promise.all() is very strict in its execution policy, Promise.allSettled()
    is forgiving. That doesn’t mean Promise.allSettled() is superior to Promise.all():
    they complement each other. Using Promise.all() is more appropriate when you have
    essential async tasks that are dependent on each other. On the other hand, Promise.allSettled()
    is more suitable for async tasks that might fail but are not essential for your
    program to function.


    As of ES2021, the ECMAScript standard includes one more method for the promise
    object: Promise.any(). This method is the opposite of Promise.all(). In the next
    chapter, we’re going to learn how Promise.any() can help you when you need to
    focus on the promise that resolves first.


