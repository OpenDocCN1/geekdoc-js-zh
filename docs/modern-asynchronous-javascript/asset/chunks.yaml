  trans: "\n\n当你只想在指定时间后自动取消 `fetch` 请求时，可以使用 `Promise.race()` 或 `AbortController`。这取决于个人偏好。如果你想在触发特定的\
    \ DOM 事件时（例如用户点击取消按钮时）取消异步请求，`AbortController` 用起来更易用。另一方面，如果你想在并发获取数据的同时执行另一个任务（例如从数据库中拉取备份），`Promise.race()`\
    \ 的效果更好。\n\n考虑以下示例。当我们运行这段代码时，`setTimeout()` 方法会设置一个两秒钟的定时器来执行 `abort()`。如果 `fetch`\
    \ 在规定的时间内完成，则 `abort` 将产生任何影响。如果没有完成，则会抛出一个错误，如下：\n\n[abort/abort_ex01.js](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex01.js)\n\
    \n```javascript\nconst controller = new AbortController();\nconst signal = controller.signal;\n\
    \nfetch('https://eloux.com/todos/1', {signal})\n  .then(response => {\n    return\
    \ response.json();\n  })\n  .then(response => {\n    console.log(response);\n\
    \  });\n\nsetTimeout(() => controller.abort(), 2000);\n```\n\n为了能够取消 `fetch()`\
    \ 请求，我们首先需要创建一个 `AbortController` 实例（第 1 行）。在启动 `fetch` 请求之前拥有一个 `AbortController`\
    \ 是关重要的，因此我们首先执行此语句。\n\n接下来，我们获取一个 `signal` 对象，它允许我们与 `fetch()` 方法交换信息：\n\n```javascript\n\
    const signal = controller.signal;\n```\n\n然后，我们将此 `signal` 对象作为选项传递给 `fetch()`：\n\
    \n```javascript\nfetch('https://eloux.com/todos/1', {signal});\n```\n\n在这里，我们将\
    \ `signal` 和 `controller` 与请求连接起来。这种连接使我们能够通过调用 `controller` 的 `abort()` 方法来取消请求：\n\
    \n```javascript\ncontroller.abort();\n```\n\n`abort()` 是 `controller` 的唯一方法，它会导致\
    \ `fetch` 返回的 promise 对象因异常被拒绝，如下所示：\n\n![images/abort/abort_error.png](img/abort_error.png)\n\
    \n此时，控制权将传递给 `catch()` 方法（如果存在）。调用 `abort()` 后，API 将通知 `signal`，如果你愿意，可以通过附加事件处理程序来监听它：\n\
    \n```javascript\nsignal.addEventListener('abort', () => {\n  console.log(signal.aborted);\n\
    });\n// 日志:\n// => true\n```\n\n注意在取消成功后，`signal` 的 `aborted` 属性的值为 `true`。\n\n\
    取消请求可能只需要几行代码，但如果你必须执行几十次，就会让你的应用程序变得不必要的臃肿。那么为什么不把代码写成一个函数呢？\n\n[abort/abort_ex03.js](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex03.js)\n\
    \n```javascript\nfunction fetchWithTimeout(url, settings, timeout) {\n  // 如果\
    \ timeout 参数存在\n  if (timeout === undefined) {\n    return fetch(url, settings);\n\
    \  }\n\n  // 如果 timeout 不是整数，抛出错误\n  if (!Number.isInteger(timeout)) {\n    throw\
    \ new TypeError('The third argument is not an integer');\n  }\n\n  const controller\
    \ = new AbortController();\n  setTimeout(() => controller.abort(), timeout);\n\
    \  settings.signal = controller.signal;\n  return fetch(url, settings);\n}\n```\n\
    \n这个函数的工作方式类似于 `fetch()` 方法，但提供了设置超时时的选项。如果我们传递一个整数（毫秒）作为第三个参数，请求将在时间过期后取消。否则，它将像普通的\
    \ `fetch()` 一样获取资源。\n\n服务器可能比预期的花费长时间来响应请求，或者根本不响应。为异步请求设置时间限制始终是一个好主意，以避免让用户等待。但你如何区分有意取消的\
    \ `fetch` 请求和因错误终止的请求呢？我们接下来将探讨。\n\n## 处理已取消的请求\n\n当 `abort()` 成功取消请求时，悬挂的 promise\
    \ 会因 `DOMException` 错误被拒绝。但如果操作是由用户取消的，你不希望显示默认的错误信息。毕竟，如果取消是有意的，并不被视为错误。\n\n\
    所以，让我们给 promise 链添加一个 `catch()` 方法来处理拒绝：\n\n[abort/abort_ex04.js](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex_04.js)\n\
    \n```javascript\nconst src = 'https://eloux.com/todos/1';\nconst controller =\
    \ new AbortController();\nconst signal = controller.signal;\n\nfetch(src, {signal})\n\
    \  .then(response => {\n    return response.json();\n  })\n  .then(json => {\n\
    \    console.log(json);\n  })\n  .catch(error => {\n    if (error.name === 'AbortError')\
    \ {\n      console.log('Request successfully canceled');\n    } else {\n     \
    \ console.error('Fetch failed!', error);\n    }\n  });\n\ncontroller.abort();\n\
    // 日志:\n// => Request successfully cancelled\n```\n\n为了确保我们单独处理取消错误，可以检查错误的 `name`\
    \ 属性。如果它的值为 `AbortError`，我们就知道它是由 `AbortController` 抛出的。如果不是，我们就像处理其他错误一样处理它。\n\
    \nFetch 请求不是可以使用 `AbortController` API 取消的唯一类型。我们也可以取消监听器！\n\n## 移除监听器\n\n在客户端\
    \ JavaScript 编程中，代码流是由事件决定的。当页面或网络浏览器发生任何事情时，浏览器会发出事件，例如用户点击链接或资源加载完成。如果我们想在特定事件发生时执行某些操作，可以使用\
    \ `addEventListener()` 方法注册一个或多个函数。\n\n可以使用 `removeEventListener()` 方法从对象中移除事件处理函数。如果我们注册了几十个事件处理器，就需要相同数量的\
    \ `removeEventListener()` 方法来移除它们，这会让代码变得臃肿。使用 `AbortController`，只需一个语句即可移除多个监听器。\n\
    \n让我们来看一个简单的示例。假设我们要给元素提供一些特殊效果。当用户的指向设备（通常是鼠标或触摸板）移动到元素上时，更改元素的文本，并在移出元素时反转效果。我们还想在设备按下（`mousedown`）或释放（`mouseup`）时更改元素的背景颜色。这是使用旧方法实现这种效果的方式：\n\
    \n[abort/abort_05.html](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex05.html)\n\
    \n```html\n<!doctype html>\n<html lang=\"en-us\">\n<head>\n  <meta charset=\"\
    utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
    >\n  <script src=\"abort_ex05.js\" defer></script>\n</head>\n<body>\n  <div class=\"\
    container\">Mouse over me!</div>\n</body>\n</html>\n```\n\n[abort/abort_ex05.js](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex05.js)\n\
    \n```javascript\nconst container = document.querySelector('.container');\n\nfunction\
    \ sayHello() {\n  container.textContent = 'Hello';\n}\n\nfunction sayBye() {\n\
    \  container.textContent = 'Bye!';\n}\n\nfunction depress() {\n```\n\n"
- fmt: "\n```javascript\ncontainer.style.backgroundColor = 'aqua';\n}\n\nfunction\
    \ release() {\n  container.style.backgroundColor = 'transparent';\n}\n\ncontainer.addEventListener('mouseenter',\
    \ sayHello);\ncontainer.addEventListener('mouseout', sayBye);\ncontainer.addEventListener('mousedown',\
    \ depress);\ncontainer.addEventListener('mouseup', release);\n```\n\nHere, we’re\
    \ attaching four event handlers to an element with a class of `container`. Now\
    \ if we want to stop the effect, we’ll have to remove each handler one by one.\
    \ Note that the arguments must be the same—the type of event and the function\
    \ of the event handler.\n\n[abort/abort_ex06.js](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex06.js)\n\
    \n```javascript\ncontainer.removeEventListener('mouseenter', sayHello);\ncontainer.removeEventListener('mouseout',\
    \ sayBye);\ncontainer.removeEventListener('mousedown', depress);\ncontainer.removeEventListener('mouseup',\
    \ release);\n```\n\nBut it’s possible to use the `AbortController` API to achieve\
    \ the same result without having to remove each handler separately. The `addEventListener()`\
    \ method now accepts an `abort signal` as the third argument. Create a controller\
    \ object and pass its `signal` property to `addEventListener()`, like this:\n\n\
    [abort/abort_ex07.js](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex07.js)\n\
    \n```javascript\nconst container = document.querySelector('.container');\nconst\
    \ controller = new AbortController();\nconst signal = controller.signal;\n\nfunction\
    \ sayHello() {\n  container.textContent = 'Hello';\n}\n\nfunction sayBye() {\n\
    \  container.textContent = 'Bye!';\n}\n\nfunction depress() {\n  container.style.backgroundColor\
    \ = 'aqua';\n}\n\nfunction release() {\n  container.style.backgroundColor = 'transparent';\n\
    }\n\ncontainer.addEventListener('mouseenter', sayHello, {signal});\ncontainer.addEventListener('mouseout',\
    \ sayBye, {signal});\ncontainer.addEventListener('mousedown', depress, {signal});\n\
    container.addEventListener('mouseup', release, {signal});\n```\n\nNow, we can\
    \ abort all `addEventListener()` methods with a single `AbortSignal`:\n\n```javascript\n\
    controller.abort();\n```\n\nRemoving each event handler separately might not be\
    \ a big issue when we have a few event handlers, but it becomes unpleasant if\
    \ we have dozens. For example, suppose we have a long list of elements, and we\
    \ want to enable the user to sort the list by dragging and dropping the elements.\n\
    \nFor each element, there’s an event attached to check for the state of dragging.\
    \ We want to disable drag and drop once the user clicks Save. Using `AbortController`\
    \ can be a time-saver in this situation: rather than removing each event handler\
    \ separately, we can call `abort()` to remove them all.\n\nSo far, we’ve been\
    \ canceling requests programmatically, but what if you want to give users the\
    \ option to cancel requests themselves, like when they decide not to wait for\
    \ a download?\n\n## Making a User-Cancelable Async Request\n\nWhen including large\
    \ files on your page, you should take into account the fact that some users will\
    \ be on limited bandwidth or mobile devices with expensive data plans. Therefore,\
    \ the ability for a user to load and cancel loading large items is valuable.\n\
    \nSay you need to load a very large photo (in this case, 22 MB in size) from Wikipedia.\
    \ You want to define a button that fetches the photo and another button that aborts\
    \ the loading. Here’s how the program will look:\n\n![images/abort/cancellable_req.png](images/abort/cancellable_req.png)\n\
    \nYou can see a live example of this program here:\n\n[https://eloux.com/async_js/examples/abort_ex08_complete.html](https://eloux.com/async_js/examples/abort_ex08_complete.html)\n\
    \nFirst, define an HTML `<image>` element on the page. The `src` attribute of\
    \ this element will be filled once the image is loaded. We also need an element\
    \ to inform the user about the outcome, so define a `<span>` element with a class\
    \ of `result`. Next, create the buttons. We’re going to disable the abort button\
    \ until the load button is clicked, so give it a `disabled` attribute:\n\n[abort/abort_ex08.html](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex08.html)\n\
    \n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
    >\n  <title>Making a Cancelable Request</title>\n  <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n  <script src=\"abort_ex08.js\" defer></script>\n\
    </head>\n<body>\n  <image class=\"image\">\n  <span class=\"result\"></span>\n\
    \  <button class=\"loadBtn\">Load Photo</button>\n  <button class=\"abortBtn\"\
    \ disabled>Cancel Loading</button>\n</body>\n</html>\n```\n\nNow, in the JavaScript\
    \ file, we need to set up two functions: one to call when the Load button is clicked\
    \ and the other to call when the Cancel Loading button is clicked:\n\n[abort/abort_ex08.js](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex08.js)\n\
    \n```javascript\n// create a reference to each element\nconst loadBtn = document.querySelector('.loadBtn');\n\
    const abortBtn = document.querySelector('.abortBtn');\nconst image = document.querySelector('.image');\n\
    const result = document.querySelector('.result');\n\nconst controller = new AbortController();\n\
    \n// abort the request\nabortBtn.addEventListener('click', () => controller.abort());\n\
    \n// load the image\nloadBtn.addEventListener('click', async () => {\n  loadBtn.disabled\
    \ = true;\n  abortBtn.disabled = false;\n  result.textContent = 'Loading...';\n\
    \n  try {\n    const response = await fetch(`https://upload.wikimedia.org/wikipedia/commons/a/a3/Kayakistas_en_Gliar_Grey.jpg`,\
    \ {signal: controller.signal});\n    const blob = await response.blob();\n   \
    \ image.src = URL.createObjectURL(blob);\n    // remove the \"Loading..\" text\n\
    \    result.textContent = '';\n  } catch (err) {\n    if (err.name === 'AbortError')\
    \ {\n      result.textContent = 'Request successfully canceled';\n    } else {\n\
    \      result.textContent = 'An error occurred!';\n      console.error(err);\n\
    \    }\n  }\n  loadBtn.disabled = false;\n  abortBtn.disabled = true;\n});\n```\n\
    \nNotice how line 13 of the code registers an `async` function to be called when\
    \ the Load Photo button is clicked. Within the function, we disable the Load button\
    \ to prevent another click and enable the Cancel Loading button. Next we attempt\
    \ to retrieve the image using the standard `fetch()` function.\n\nTo be able to\
    \ display the image we’ve retrieved, we need to convert it into an object URL.\
    \ First use the `Blob()` constructor to get a `Blob` object (line 22). Now you\
    \ can create a URL that refers to the `Blob` by passing the object into the `URL.createObjectURL()`\
    \ method (line 23). All that’s left to do to display the image is insert the resulting\
    \ data into the `src` attribute of the image tag. At the end of the code, we revert\
    \ the buttons to their original state.\n\n| What’s a Blob? |\n\n| --- |\n"
