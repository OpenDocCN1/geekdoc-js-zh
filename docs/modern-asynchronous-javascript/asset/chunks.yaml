    ## Using a Generator to Define a Custom Iterator


    Generator functions enhance the process of defining the iterable protocol by providing
    an iterative algorithm. When called, a generator function doesn’t execute its
    body immediately. Instead, it returns a special type of iterator known as a generator
    object, as shown in the following image.


    ![images/generators/Generator.png](images/generators/Generator.png)


    We can run the generator function’s body by calling its next() method. The yield
    keyword pauses the generator and specifies the value to be returned. With that
    in mind, let’s adapt the example in [​*Creating a Custom Iterator*​](#f_0020.xhtml_sec.CustomIterator).
    The result of this code is identical, but it’s much easier to implement.


    Notice the asterisk following the function keyword at line 5\. This is our generator
    function and defines a custom iterator for collection:


    [generators/gen_ex01.js](http://media.pragprog.com/titles/fkajs/code/generators/gen_ex01.js)


    | ​1:  | ​**const**​ collection = { |


    | ​-  | a: 10, |


    | ​-  | b: 20, |


    | ​-  | c: 30, |


    | ​5:  | [Symbol.iterator]: ​**function**​*() { |


    | ​-  | ​**for**​ (​**let**​ key ​**in**​ ​**this**​) { |


    | ​-  | ​**yield**​ ​**this**​[key]; |


    | ​-  | } |


    | ​-  | } |


    | ​10:  | }; |


    | ​-  |  |


    | ​-  | ​**const**​ iterator = collection[Symbol.iterator](); |


    | ​-  |  |


    | ​-  | console.log(iterator.next()); ​*// ⇒ {value: 10, done: false}*​ |


    | ​15:  | console.log(iterator.next()); ​*// ⇒ {value: 20, done: false}*​ |


    | ​-  | console.log(iterator.next()); ​*// ⇒ {value: 30, done: false}*​ |


    | ​-  | console.log(iterator.next()); ​*// ⇒ {value: undefined, done: true}*​
    |


    We’ve used a for...in loop inside the generator to iterate over the object’s properties.
    With each iteration, the yield keyword halts the loop’s execution and returns
    the value of the succeeding property to the caller.


    It’s possible to call a generator function as many times as needed, and each time
    it returns a new generator object. But a generator object can be iterated only
    once. Since the object returned by a generator is always an iterator, we can use
    the for...of syntax to iterate over the result as well.


    Now that we know how synchronous generators work, we’re ready to look at its asynchronous
    counterpart.


    ## Creating an Asynchronous Generator


    An async generator is similar to a sync generator in that calling next() resumes
    the execution of the generator until reaching the yield keyword. But rather than
    returning a plain object, next() returns a promise.


    You can think of an async generator as a combination of an async function and
    a generator function. Let’s rewrite the example from [​*Retrieving URLs Separately*​](#f_0021.xhtml_sec.AsyncExample),
    using a generator function. Notice the async keyword and the asterisk symbol (*)
    at line 7 indicating an asynchronous generator function:


    [generators/gen_ex02.js](http://media.pragprog.com/titles/fkajs/code/generators/gen_ex02.js)


    | ​1:  | ​**const**​ srcArr = [ |


    | ​-  | ​*''https://eloux.com/async_js/examples/1.json''*​, |


    | ​-  | ​*''https://eloux.com/async_js/examples/2.json''*​, |


    | ​-  | ​*''https://eloux.com/async_js/examples/3.json''*​, |


    | ​5:  | ]; |


    | ​-  |  |


