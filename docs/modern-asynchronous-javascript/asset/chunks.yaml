    # Chapter 3


    Fetching Multiple Resources


    Suppose you want to take an action after multiple async requests have completed,
    regardless of their success or failure. For example, you need to obtain data from
    four separate web APIs and process the result, but there might be a network error
    for a resource that you can live without. The Promise.all() method isn’t suitable
    for this task because a single network error will cause the method to reject immediately.


    Fortunately, ECMAScript provides a newer tool that’s designed to report the outcome
    of all requests: Promise.allSettled(). With this method, we can track the state
    of multiple promises without letting any promise spoil the result of others. We’ll
    start this chapter by examining a common async task: executing multiple promises
    and handling the result. Once you’ve learned about potential pitfalls, we’ll look
    at the Promise.allSettled() method and see how it compares to Promise.all().


    ## Getting Ready


    Although Promise.allSettled() is relatively new, all modern browsers already support
    it. But before running the examples in older browsers, you’ll want to ensure the
    browser supports it.^([[9]](#f_0035.xhtml_FOOTNOTE-9)) In the Node environment,
    you’ll need a minimum Node version of 12.9.0\. You can also use a Babel plugin
    to make use of the feature in older browsers or Node versions.^([[10]](#f_0035.xhtml_FOOTNOTE-10))


    ## Executing Multiple Promises


    When creating complex JavaScript applications, you’ll inevitably encounter circumstances
    where you need to execute multiple promises. Say you have an async function that
    retrieves a blog post, like this:


    [promise.allSettled/tracking_promises_ex01.js](http://media.pragprog.com/titles/fkajs/code/promise.allSettled/tracking_promises_ex01.js)


    | ​  | ​**async**​ ​**function**​ getPost(id = 1) { |


    | ​  | ​**try**​ { |


    | ​  | ​**return**​ ​**await**​ Utility.loadPost(id); |


    | ​  | } ​**catch**​ (error) { |


    | ​  | ​*// handle error*​ |


    | ​  | } |


    | ​  | } |


    This code works great to retrieve a single blog post. But what if you need to
    retrieve multiple posts? Easy! Create a loop to get the posts you desire:


    [promise.allSettled/tracking_promises_ex02.js](http://media.pragprog.com/titles/fkajs/code/promise.allSettled/tracking_promises_ex02.js)


    | ​  | ​**const**​ postIds = [​*''1''*​, ​*''2''*​, ​*''3''*​, ​*''4''*​]; |


    | ​  |  |


    | ​  | postIds.forEach(​**async**​ id => { |


    | ​  | ​**const**​ post = ​**await**​ getPost(id); |


    | ​  |  |


    | ​  | ​*// process the post*​ |


    | ​  | }) |


    But there’s a problem here: the await keyword will pause the loop until it gets
    a response from getPost(). In other words, this code will load the posts sequentially
    rather than making multiple requests at the same time.


    One way to fix this issue is to use the Promise.all() method. Promise.all() returns
    a single promise that resolves once all the promises in the iterable have resolved:


    [promise.allSettled/tracking_promises_ex03.js](http://media.pragprog.com/titles/fkajs/code/promise.allSettled/tracking_promises_ex03.js)


    | ​  | ​**const**​ postIds = [​*''1''*​, ​*''2''*​, ​*''3''*​, ​*''4''*​]; |


    | ​  |  |


    | ​  | ​**const**​ promises = postIds.map(​**async**​ (id) => { |


    | ​  | ​**return**​ ​**await**​ getPost(id); |


    | ​  | }); |


    | ​  |  |


    | ​  | ​**const**​ arr = Promise.all(promises); |


    But there’s a catch here, too! If one of the promises in the iterable rejects,
    Promise.all() immediately rejects, causing every other post not to load. It’s
    not fair to honest objects who have kept their promise, right?


    Until fairly recently, JavaScript didn’t provide a built-in method to wait for
    all promises to settle (either fulfilled or rejected). Fortunately, ES2020 is
    here to change that by introducing the Promise.allSettled() method. With this
    method, we can get the result of all promises passed to the method.


    ## Using Promise.allSettled() to Fetch Multiple Resources


    The Promise.allSettled() method returns a pending promise that resolves when all
    of the given promises have either successfully fulfilled or rejected (“settled,”
    in other words). This behavior is very useful to track multiple asynchronous tasks
    that are not dependent on one another to complete.


    The following image shows how the Promise.allSettled() method resolves a pending
    promise:


    ![images/tracking_promises/allSettled.png](images/tracking_promises/allSettled.png)


    In the following example, we attempt to fetch three resources, one of which doesn’t
    exist. Notice how Promise.allSettled() reports the result of every promise:'
