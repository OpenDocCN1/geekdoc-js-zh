    This function works like a fetch() method but provides the option of setting a
    timeout. If we pass an integer (in milliseconds) as the third argument, the request
    will abort after the time expires. If not, it will retrieve the resource like
    a regular fetch().


    A server might take a longer time than expected to respond to requests, or might
    not respond at all. It’s always a good idea to set a time limit for async requests
    to avoid keeping your users waiting. But how do you distinguish a fetch request
    that’s intentionally aborted from the ones that are terminated because of an error?
    We’ll explore that question next.


    ## Handling an Aborted Request


    When abort() successfully cancels a request, the pending promise rejects with
    a DOMException error. But you don’t want to show the default error message if
    the operation is canceled by the user. After all, it’s not considered an error
    if the cancelation is intentional.


