  trans: "\n\n`Promise.any()` 方法是 ECMAScript 标准中的新成员，因此在运行示例之前，你可能需要确保你的浏览器支持它。在 Node\
    \ 环境中，你需要至少 `15.0.0` 版本的 Node。你也可以使用 Babel 插件在较旧的浏览器或 Node 版本中该该功能。\n\n## 使用 Promise.any()\
    \ 方法\n\n`Promise.any()` 返回一个处于等待状态的 promise，一旦给定的迭代对象中有一个 promise 成功（fulfilled），它就会异步地解析（resolve）。好了，让我们执行以下代码并看看发生了什么：\n\
    \n```javascript\nconst promises = [\n  Promise.reject(new Error('failure #1')),\n\
    \  Promise.reject(new Error('failure #2')),\n  Promise.resolve('YES!')\n];\n\n\
    Promise.any(promises).then((result) => console.log(result));\n\n// logs:\n// =>\
    \ YES!\n```\n\n在这里，我们将一个包含三个 promise 对象的数组传递给 `Promise.any()`。由于 `Promise.resolve()`\
    \ 返回的是已经完成的 promise，`Promise.any()` 返回的 promise 会立即以给定的值完成。\n\n但如果所有输入的 promise\
    \ 都被拒绝（reject）了会发生什么？\n\n```javascript\nconst promises = [\n  Promise.reject(new\
    \ Error('failure #1')),\n  Promise.reject(new Error('failure #2')),\n  Promise.reject(new\
    \ Error('failure #3'))\n];\n\nPromise.any(promises).then(\n  (result) => {console.log(result)},\n\
    \  (error) => {console.error(error)}\n);\n\n// logs:\n// => AggregateError: No\
    \ Promise in Promise.any was resolved\n```\n\n`AggregateError` 对象将所有输入 promise\
    \ 的拒绝原因封装在一个单一错误中，我们可以使用 `errors` 属性读取它们。修改上述代码的第 9 行，将 `console.error(error)`\
    \ 替换为 `console.error(error.errors)`，如下：\n\n```javascript\nconst promises = [\n\
    \  Promise.reject(new Error('failure #1')),\n  Promise.reject(new Error('failure\
    \ #2')),\n  Promise.reject(new Error('failure #3'))\n];\n\nPromise.any(promises).then(\n\
    \  (result) => {console.log(result)},\n  (error) => {console.error(error.errors)}\n\
    );\n```\n\n你应该会在浏览器控制台中看到类似下面的消息，显示了我们在输入 promise 中指定的所有拒绝原因：\n\n![images/promise.any/Aggregate_error.png](img/Aggregate_error.png)\n\
    \n只有另外一种情况会导致 `Promise.any()` 被拒绝：传递一个空的可迭代对象。这里有一个示例：\n\n```javascript\nPromise.any([]).then(\n\
    \  (result) => {console.log(result)},\n  (error) => {console.log(error)}\n);\n\
    \n// logs:\n// => AggregateError: No Promise in Promise.any was resolved\n```\n\
    \n注意第 1 行的空数组导致了 `Promise.any()` 被拒绝。错误信息与所有 promise 都被拒绝时完全相同，这一点需要警惕，因为你不想误解失败的原因。\n\
    \n现在你已经了解了 `Promise.any()` 方法是如何工作的，现在是时候看一些真实世界的示例了。接下来，我们将学习如何利用这个方法让我们的应用程序更具韧性。\n\
    \n## 避免单点故障\n\n单点故障（SPOF）是系统中的一个组件，一旦发生故障或错误，就会导致整个系统停止工作。如果你想要可靠的应用程序，你应该能够识别并避免系统中的潜在的单点故障。\n\
    \nWeb 应用程序中常见的单点故障发生在从外部 API 获取关键资源（例如金融市场数据）时。如果 API 无法访问，应用程序就会停止运行。`Promise.any()`\
    \ 方法在这方面非常有用。它允许我们从多个 API 请求数据，并使用第一个成功的结果。\n\n让我们来看一个示例。在下面的代码中，我们有一个包含两个 API\
    \ 的数组，它们都返回相同的信息。`Promise.any()` 将尝试同时获取这两个 URL；因此只要其中一个 API 可用，代码就能正常工作：\n\n\
    ```javascript\nconst apis = [\n  'https://eloux.com/todos/1',\n  'https://jsonplaceholder.typicode.com/todos/1'\n\
    ];\n\nasync function fetchData(api) {\n  const response = await fetch(api);\n\
    \  if (response.ok) {\n    return response.json();\n  } else {\n    return Promise.reject(new\
    \ Error('Request failed'));\n  }\n}\n\nfunction getData() {\n  return Promise.any([\n\
    \    fetchData(apis[0]),\n    fetchData(apis[1])\n  ]);\n}\n\ngetData().then((response)\
    \ => console.log(response));\n```\n\n现在，为了查看后台到底发生了什么，请检查浏览器控制器的网络（Network）标签。按\
    \ `F12` 打开开发者工具，然后导航到网络。下面的图片显示了 Firefox 的网络标签：\n\n![images/promise.any/Network_tab.png](img/Network_tab.png)\n\
    \n你可以看到两个请求的状态都是 200，这意味着它们都成功完成了。但请记住，`Promise.any()` 只使用第一个完成的 promise 的结果，因此其他结果会被忽略。\n\
    \n为了查看如果一个 API 失败会发生什么，我们将拦截其中一个请求。如果你使用的是 Firefox，点击“Request Blocking”（请求拦截）图标，在字段中输入\
    \ `eloux.com` 并按回车。此步骤将拦截对 `eloux.com` 的任何请求，让你模拟 API 无法访问的情况，如下所示：\n\n![images/promise.any/Request_blocking.png](img/Request_blocking.png)\n\
