  trans: "\n通过顶层 `await`（top-level await），ECMAScript 模块可以等待资源，导致导入它们的其他模块在开始评估自己的代码之前必须等待。顶层\
    \ `await` 允许我们实现一些以前需要大量努力才能实现的酷炫功能。让我们来看看几个实际用途。\n\n## 将顶层 await 投入工作\n\n在设计一个支持多种语言和区域的程序时，你可能希望使用运行时值来确定使用的语言。假设你有一个\
    \ ES 模块，并想根据浏览器中设置的用户偏好语言动态加载语言包。你可以利用顶层 `await` 来导入消息：\n\n[await/Await_ex10.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex10.js)\n\
    \n```javascript\nconst messages = await import(`./packs/messages-${navigator.language}.js`);\n\
    ```\n\n`navigator.language` 属性允许我们访问用户的偏语言，这通常是浏览器界面的语言。为了将该属性的值嵌入字符串中，我们将其放在了\
    \ `${...}` 内部。模块将等待语言包的导入，并且只有在语言包加载后才能评估实体的其余部分。\n\n我们还可以使用顶层 `await` 加载带有备用实现的依赖项。正如我们在避免单点故障中学习到的，保护应用程序免受外部服务器问题非常重要。对服务器的网络请求可能会失败。在关键应用程序中，你可以使用顶层\
    \ `await` 提供依赖备用以缓解此类失败。这是一个示例：\n\n[await/Await_ex11.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex11.js)\n\
    \n```javascript\nlet d3;\ntry {\n  d3 = await import('https://cdnjs.cloudflare.com/ajax/libs/d3/6.7.0/d3.min.js');\n\
    } catch {\n  d3 = await import('https://ajax.googleapis.com/ajax/libs/d3js/6.7.0/d3.min.js');\n\
    }\n```\n\n在这段代码中，我们首先尝试从 Cloudflare 加载 D3 JavaScript 库。如果导入失败，我们将尝试另一个 CDN。或者，我们可以使用\
    \ `Promise.any()` 异步执行两个请求，并使用响应较快的那一个的结果：\n\n[await/Await_ex12.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex12.js)\n\
    \n```javascript\nconst CDNs = [\n  'https://cdnjs.cloudflare.com/ajax/libs/d3/6.7.0/d3.min.js',\n\
    \  'https://ajax.googleapis.com/ajax/libs/d3js/6.7.0/d3.min.js'\n];\nconst d3\
    \ = await Promise.any(CDNs);\n```\n\n顶层 `await` 的另一个用例是资源初始化。例如：\n\n[await/Await_ex13.js](http://media.pragprog.com/titles/fkajs/code/await/Await_ex13.js)\n\
    \n```javascript\nimport {dbConnector} from './utilities.js';\nconst connection\
    \ = await dbConnector.connect();\n```\n\n通过使用顶层 `await`，我们可以让模块的行为像一个大的异步函数。我们现在可以使用\
    \ `await` 来表示资源，并在模块无法使用时处理错误。\n\n请记住，在被导入的模块完成其主体执行之前，模块不会开始评估其主体。因此，如果另一个模块具有顶层\
    \ `await`，则它必须在导入它的模块开始执行之前完成。\n\n## 总结\n\n在此之前，`await` 仅在异步函数中有效。时代变了，`await`\
    \ 变得更简单了。我们可以在模块中使用顶层 `await` 来避免将代码封装在异步 IIFE 中。在访问来自另一个模块的 promise 结果时，我们不再需要变通方法。我们可以将\
    \ `await` 用于初始化资源、动态定义依赖路径以及带有备用实现的依赖项加载等任务。\n\n## 感谢阅读！\n\n我们到达书的结尾！JavaScript\
    \ 的美丽之处在于它足够灵活，可以让程序员决定语言如何演进。因此，JavaScript 社区的投入和提案在语言的进展过程中起了重要作用。任何人都可以通过起草提案来参与（阅读\
    \ [`github.com/tc39/proposals`](https://github.com/tc39/proposals)）。\n\n该过程的一个有趣方面是，新功能在被添加到规范之前就已经由浏览器实现了。如果你想关注即将推出的功能，这里有一些资源：\n\
    \n- 检查 GitHub 上的提案 ([`github.com/tc39/proposals`](https://github.com/tc39/proposals))。特别注意处于阶段\
    \ 3 和阶段 4 的功能。阶段 3 意味着功能的语义、语法和 API 已经完成，它很有可能添加到规范中。\n- 关注 Google 的 V8 引擎博客。如果某些东西被添加到\
    \ Chrome 中，你将在那里听到消息 ([`v8.dev/`](https://v8.dev/))。\n- 关注并参与 TC39 Discourse ([`es.discourse.group/`](https://es.discourse.group/))。TC39\
    \ 是负责演进 JavaScript 定义的委员会。\n"
