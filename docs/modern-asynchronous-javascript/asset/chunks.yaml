    \n来看看这段代码的重写版本，这次使用 `Promise.all()` 方法：\n\n[promise.allSettled/tracking_promises_ex05.js](http://media.pragprog.com/titles/fkajs/code/promise.allSettled/tracking_promises_ex05.js)\n\
    \n```javascript\nconst promises = [\n  fetch('https://picsum.photos/200', {mode:\
    \ \"no-cors\"}),\n  fetch('https://does-not-exist', {mode: \"no-cors\"}),\n  fetch('https://picsum.photos/100/200',\
    \ {mode: \"no-cors\"})\n];\n\nPromise.all(promises)\n  .then((results) => results.forEach((result)\
    \ => console.log(result)));\n\n// logs:\n// => Uncaught (in promise) TypeError\n\
    ```\n\n这一次，promise 在第二个输入 promise 被拒绝时立即拒绝。这两个方法的一个重要区别是 `Promise.allSettled()`\
    \ 有一个 `Promise.all()` 没有的属性：`status`。事实上，`Promise.all()` 返回的是 `Promise.allSettled()`\
    \ 封装在对象中的原始值。对比：\n\n[promise.allSettled/tracking_promises_ex06.js](http://media.pragprog.com/titles/fkajs/code/promise.allSettled/tracking_promises_ex06.js)\n\
    \n```javascript\nconst promises = [\n  Promise.resolve(1),\n  Promise.resolve(2)\n\
    ];\n\nPromise.allSettled(promises)\n  .then((results) => results.forEach((result)\
    \ => console.log(result)));\n\n// logs:\n// => { status: \"fulfilled\", value:\
    \ 1 }\n// => { status: \"fulfilled\", value: 2 }\n\nPromise.all(promises)\n  .then((results)\
    \ => results.forEach((result) => console.log(result)));\n\n// logs:\n// => 1\n\
    // => 2\n```\n\n注意 `Promise.all()` 直接返回响应。如果你处于不支持 `Promise.allSettled()` 的旧 JavaScript\
    \ 环境中，或者你想直接返回 promise，有一个简单的变通方法。考虑以下代码：\n\n[promise.allSettled/tracking_promises_ex07.js](http://media.pragprog.com/titles/fkajs/code/promise.allSettled/tracking_promises_ex07.js)\n\
    \n```javascript\nconst promises = [\n  fetch('https://picsum.photos/200', {mode:\
    \ \"no-cors\"}),\n  fetch('https://does-not-exist', {mode: \"no-cors\"}),\n  fetch('https://picsum.photos/100/200',\
    \ {mode: \"no-cors\"})\n];\n```\n\n"
- fmt: "\nThe `Promise.any()` method is a newcomer to the ECMAScript standard, so\
    \ before running the examples, you’ll want to ensure your browser supports it.\
    \ In the Node environment, you’ll need a minimum Node version of `15.0.0`. You\
    \ can also use a Babel plugin to make use of the feature in older browsers or\
    \ Node versions.\n\n## Using the Promise.any() Method\n\n`Promise.any()` returns\
    \ a pending promise that resolves asynchronously as soon as one of the promises\
    \ in the given iterable fulfills. All right, let’s execute the following code\
    \ and see what happens:\n\n```javascript\nconst promises = [\n  Promise.reject(new\
    \ Error('failure #1')),\n  Promise.reject(new Error('failure #2')),\n  Promise.resolve('YES!')\n\
    ];\n\nPromise.any(promises).then((result) => console.log(result));\n\n// logs:\n\
    // => YES!\n```\n\nHere we have an array of three promise objects passed to `Promise.any()`.\
    \ Because `Promise.resolve()` returns a promise that’s already fulfilled, the\
    \ promise returned by `Promise.any()` is immediately fulfilled with the given\
    \ value.\n\nBut what happens if all input promises reject?\n\n```javascript\n\
    const promises = [\n  Promise.reject(new Error('failure #1')),\n  Promise.reject(new\
    \ Error('failure #2')),\n  Promise.reject(new Error('failure #3'))\n];\n\nPromise.any(promises).then(\n\
    \  (result) => {console.log(result)},\n  (error) => {console.error(error)}\n);\n\
    \n// logs:\n// => AggregateError: No Promise in Promise.any was resolved\n```\n\
    \nThe `AggregateError` object wraps all the rejection reasons of all the input\
    \ promises in a single error, and we can read them using the `errors` property.\
    \ Edit line 9 of the preceding code and replace `console.error(error)` with `console.error(error.errors)`,\
    \ like this:\n\n```javascript\nconst promises = [\n  Promise.reject(new Error('failure\
    \ #1')),\n  Promise.reject(new Error('failure #2')),\n  Promise.reject(new Error('failure\
    \ #3'))\n];\n\nPromise.any(promises).then(\n  (result) => {console.log(result)},\n\
    \  (error) => {console.error(error.errors)}\n);\n```\n\nYou should see a message\
    \ like this in your browser’s console showing all the rejection reasons we’ve\
    \ specified in the input promises:\n\n![images/promise.any/Aggregate_error.png](images/promise.any/Aggregate_error.png)\n\
    \nOnly one other case causes `Promise.any()` to reject: passing an iterable that’s\
    \ empty. Here’s an example:\n\n```javascript\nPromise.any([]).then(\n  (result)\
    \ => {console.log(result)},\n  (error) => {console.log(error)}\n);\n\n// logs:\n\
    // => AggregateError: No Promise in Promise.any was resolved\n```\n\nNotice the\
    \ empty array at line 1 that causes `Promise.any()` to reject. The error message\
    \ is exactly the same as when all promises reject, which is something to be wary\
    \ of because you don’t want to misunderstand the reason for the failure.\n\nNow\
    \ that you know how the `Promise.any()` method works, it’s time to look at some\
    \ real-world examples. Up next, we’re going to learn how to take advantage of\
    \ this method to make our app resilient.\n\n## Avoiding the Single of Failure\n\
    \nA single point of failure (SPOF) is a component of a system that with one malfunction\
    \ or fault will stop the entire system from working. If you want to have a reliable\
    \ application, you should be able to identify and avoid potential SPOFs in the\
    \ system.\n\nA common SPOF in web applications occurs when fetching critical resources,\
    \ such as data for financial markets, from external APIs. If the API is inaccessible,\
    \ the app will stop. The `Promise.any()` method is extremely useful in this regard.\
    \ It enables us to request data from multiple APIs and use the result of the first\
    \ successful.\n\nLet’s look at an example. In the following code, we have an array\
    \ containing two APIs, both of which return the same info. `Promise.any()` will\
    \ attempt to fetch the two URLs at the same time; so as long as one of the APIs\
    \ is available, the code works:\n\n```javascript\nconst apis = [\n  'https://eloux.com/todos/1',\n\
    \  'https://jsonplaceholder.typicode.com/todos/1'\n];\n\nasync function fetchData(api)\
    \ {\n  const response = await fetch(api);\n  if (response.ok) {\n    return response.json();\n\
    \  } else {\n    return Promise.reject(new Error('Request failed'));\n  }\n}\n\
    \nfunction getData() {\n  return Promise.any([\n    fetchData(apis[0]),\n    fetchData(apis[1])\n\
    \  ]);\n}\n\ngetData().then((response) => console.log(response));\n```\n\nNow,\
    \ to see what actually happens behind the scenes, check the network tab of your\
    \ browser’s console. Press `F12` to open developer tools and then navigate to\
    \ the network. The following image shows the Network tab of Firefox:\n\n![images/promise.any/Network_tab.png](images/promise.any/Network_tab.png)\n\
    \nYou can see that the status of both requests is 200, which means they are successfully\
    \ fulfilled. But remember, `Promise.any()` only uses the result of the first promise\
    \ that fulfills, so the other result is ignored.\n\nTo see what happens if one\
    \ of the APIs fails, we’re going to block one of the requests. If you’re using\
    \ Firefox, click on the icon that says Request Blocking and enter `eloux.com`\
    \ in the given field and press enter. This step will block any request to `eloux.com`,\
    \ allowing you to simulate that the API is inaccessible, as shown in the image\
    \ that follows:\n\n![images/promise.any/Request_blocking.png](images/promise.any/Request_blocking.png)\n\
    \nIf you refresh the page, you’ll see that the request to `eloux.com` is unsuccessful.\
    \ But since the other API is available, our code works fine. Now, what happens\
    \ if both APIs are unavailable? Go ahead and enter `jsonplaceholder.typicode.com`,\
    \ the URL of the other API, to block it. Switch back to the Console tab and run\
    \ the code again. You should see an error message like this:\n\n`Uncaught (in\
    \ promise) AggregateError: No Promise in Promise.any was resolved`\n\nWe’re getting\
    \ an `AggregateError` that denotes all promises passed to `Promise.any()` are\
    \ rejected. But this error message isn’t the best way to handle a rejected promise.\
    \ Let’s chain a `catch()` method and output a custom error message:\n\n```javascript\n\
    const apis = [\n  'https://eloux.com/todos/1',\n  'https://jsonplaceholder.typicode.com/todos/1'\n\
    ];\n\nasync function fetchData(api) {\n  const response = await fetch(api);\n\
    \  if (response.ok) {\n    return response.json();\n  } else {\n    return Promise.reject(new\
    \ Error('Request failed'));\n  }\n}\n\nfunction getData() {\n  return Promise.any([\n\
    \    fetchData(apis[0]),\n    fetchData(apis[1])\n  ]);\n}\n```\n"
