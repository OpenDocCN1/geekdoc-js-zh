    \nCopyright © 2021, The Pragmatic Bookshelf.\n\n# 第 5 章：为异步任务设置时间限制\n\n互联网用户是不耐烦的。在处理异步网络请求时，我们应该让他们等待多久才能从服务器获得响应并处理完\
    \ promise 呢？如果应用程序响应时间超过几秒钟，大多数用户就会离开它并寻找其他地方。API 响应的时间通常不受我们代码控制，因为存在服务器过载等因素。我们需要一种方法来设置时间限制，避免进入长时间或无尽等待的状态。\n\
    \n幸运的是，`Promise` 对象带有一个名为 `Promise.race()` 方法，我们可以利用它来强制执行异步任务延迟的时间限制。该方法设计用于让几个\
    \ promise 相互竞争，并返回第一个确定的 promise 的结果。通过提供一个在指定时间后被拒绝的 promise，我们可以定义代码应该等待多久从服务器获取响应。\n\
    \n本章将从比较 `Promise.race()` 和我们已经熟悉的方法 `Promise.any()` 开始。一旦我们掌握了它的工作原理，我们将使用它来并发从外部\
    \ API 获取数据，并执行一个在两秒后记录错误的计时器。然后我们修改代码，将错误消息替换为从缓存中提取数据的函数，以防 API 无法访问或响应不够快的情况。\n\
    \n## 准备工作\n\n`Promise.race()` 方法已经存在了一段时间，所以大多数现代浏览器已经支持了它。([[13]](#f_0046.xhtml_FOOTNOTE-13))\
    \ Node.js 对 `Promise.race()` 的支持可以追溯到 12.0 版本。如果你想在旧版浏览器中使用它，可以使用插件。\n\n### 比较\
    \ Promise.race() 和 Promise.any()\n\n回想使用 Promise.any()，`Promise.any()` 使用第一个成功的值。然而，涉及到拒绝时，`Promise.race()`\
    \ 在成功方面与 `Promise.any()`一样：一旦第一个 promise 确定它就会返回。为了演示，让我们创建两个 promise。A 将在一秒后拒绝，B\
    \ 将两秒后成功：\n\n```javascript\nconst promiseA = new Promise((resolve, reject) =>\
    \ {\n  setTimeout(() => reject('A'), 1000);\n});\n\nconst promiseB = new Promise((resolve)\
    \ => {\n  setTimeout(() => resolve('B'), 2000);\n});\n\nPromise.race([promiseA,\
    \ promiseB])\n  .then((response) => {\n    console.log(response);\n  })\n  .catch((error)\
    \ => {\n    console.error(error);\n  }); // 输出 A\n\nPromise.any([promiseA, promiseB])\n\
    \  .then((response) => {\n    console.log(response);\n  })\n  .catch((error) =>\
    \ {\n    console.error(error);\n  }); // 输出 B\n```\n\n在你的浏览器控制台中运行这段代码。你将向两个方法传递相同的\
    \ promise 数组。但注意，`Promise.race()` 在秒后拒绝并在控制台中打印 A，而 `Promise.any()` 在两秒后成功并打印\
    \ B。\n\n这两个方法的另一个区别是，将空数组（或任何其他空迭代）传递给 `Promise.race()` 会产生一个处于等待状态的 promise：\n\
    \n```javascript\nPromise.race([])\n  .then((response) => {\n    // 这永远不会被执行\n\
    \  })\n  .catch((error) => {\n    // 两个都不会\n  });\n```\n\n如果我们传递给 `Promise.race()`\
    \ 一个不包含任何内容的迭代器，那么“无第一个”永远无法确定。因此，如果返回的 promise 处于等待状态，首先要检查我们传递给该方法的迭代器。\n\n\n"
- fmt: "\nThe `Promise.race()` method can be useful when fetching an external resource\
    \ that may take a while to complete. With this method, we can race an async task\
    \ against a promise that’s going to be rejected after a number of milliseconds.\
    \ Depending on the promise that settles first, we either obtain the result or\
    \ report an error message.\n\nLet’s create a function that attempts to pull data\
    \ from an API and reports an error if the server doesn’t respond quickly enough.\
    \ We’ll represent each outcome by a promise and use `Promise.race()` to select\
    \ the first accessible result:\n\n[latency/latency_ex03.js](http://media.pragprog.com/titles/fkajs/code/latency/latency_ex03.js)\n\
    \n```javascript\nfunction fetchData() {\n  const timeOut = 2000; // two seconds\n\
    \  const data = fetch('https://jsonplaceholder.typicode.com/todos/1');\n  const\
    \ failure = new Promise((resolve, reject) => {\n    setTimeout(() => {\n     \
    \ reject(new Error(`Failed to retrieve data after ${timeOut} milliseconds`));\n\
    \    }, timeOut);\n  });\n  return Promise.race([data, failure]);\n}\n\nfetchData().then((response)\
    \ => {\n  console.log(response);\n}).catch((error) => {\n  console.error(error);\n\
    });\n```\n\nHere, we’ve set the timeout to two seconds, which is usually more\
    \ than enough to receive a response from an API. To see the timeout message, go\
    \ ahead and set a one-millisecond timeout and run the code again. Sure enough\
    \ we can see the timeout message:\n\n![images/latency/Timeout_message.png](images/latency/Timeout_message.png)\n\
    \nThis code works fine but simply logging an error doesn’t offer the best user\
    \ experience. We can further improve this code by using cached data if fresh data\
    \ isn’t available in allotted time. Let’s revise the code a little:\n\n[latency/latency_ex04.js](http://media.pragprog.com/titles/fkajs/code/latency/latency_ex04.js)\n\
    \n```javascript\nfunction loadFromCache() {\n  const data = {\n    \"userId\"\
    : 1,\n    \"id\": 1,\n    \"title\": \"delectus aut autem\",\n    \"completed\"\
    : false\n  };\n  return new Promise((resolve) => {\n    resolve(data);\n  });\n\
    }\n\nfunction fetchData() {\n  const timeOut = 2000; // two seconds\n  const cache\
    \ = loadFromCache().then((data) => {\n    return new Promise((resolve) => {\n\
    \      setTimeout(() => {\n        resolve(data);\n      }, timeOut);\n    });\n\
    \  });\n  const freshData = fetch('https://jsonplaceholder.typicode.com/todos/1');\n\
    \  return Promise.race([freshData, cache]);\n}\n\nfetchData().then((response)\
    \ => {\n  console.log(response);\n}).catch((error) => {\n  console.error(error);\n\
    });\n```\n\nIn this version of the code, we concurrently fetch data from an external\
    \ API and pull data from a cache to use in case the API is inaccessible or doesn’t\
    \ respond quickly enough. For the sake of simplicity, the `loadFromCache()` function\
    \ returns a predefined object, but in a real-world app you’ll probably load the\
    \ cached data from a database.\n\nOf course, using cached data would work only\
    \ for certain types of information that doesn’t change frequently. If you’re retrieving\
    \ data like stock prices or exchange rates, then using `Promise.any()` is a better\
    \ choice (see [Avoiding the Single Point of Failure](#f_0039.xhtml_sec.AvoidingSingleFailure))\
    \ since it allows you to request data from multiple APIs and use the result of\
    \ the one that’s accessible.\n\nAn interesting use case for `Promise.race()` is\
    \ to batch async requests. As explained by Chris Jensen,^([[15]](#f_0046.xhtml))\n"
  raw: 'The Promise.race() method can be useful when fetching an external resource
    that may take a while to complete. With this method, we can race an async task
    against a promise that’s going to be rejected after a number of milliseconds.
    Depending on the promise that settles first, we either obtain the result or report
    an error message.


    Let’s create a function that attempts to pull data from an API and reports an
    error if the server doesn’t respond quickly enough. We’ll represent each outcome
    by a promise and use Promise.race() to select the first accessible result:


    [latency/latency_ex03.js](http://media.pragprog.com/titles/fkajs/code/latency/latency_ex03.js)


    | ​  | ​**function**​ fetchData() { |


    | ​  | ​**const**​ timeOut = 2000; ​*// two seconds*​ |


    | ​  | ​**const**​ data = fetch(​*''https://jsonplaceholder.typicode.com/todos/1''*​);
    |


    | ​  | ​**const**​ failure = ​**new**​ Promise((resolve, reject) => { |


    | ​  | setTimeout(() => { |


    | ​  | reject(​**new**​ Error(​*`Failed to retrieve data after* ​${timeOut}​ *milliseconds`*​));
    |


    | ​  | }, timeOut); |


    | ​  | }); |


    | ​  | ​**return**​ Promise.race([data, failure]); |


    | ​  | } |


    | ​  |  |


    | ​  | fetchData().then((response) => { |


    | ​  | console.log(response); |


    | ​  | }).​**catch**​((error) => { |


    | ​  | console.error(error); |


    | ​  | }); |


    Here, we’ve set the timeout to two seconds, which is usually more than enough
    to receive a response from an API. To see the timeout message, go ahead and set
    a one-millisecond timeout and run the code again. Sure enough we can see the timeout
    message:


    ![images/latency/Timeout_message.png](images/latency/Timeout_message.png)


    This code works fine but simply logging an error doesn’t offer the best user experience.
    We can further improve this code by using cached data if fresh data isn’t available
    in allotted time. Let’s revise the code a little:


    [latency/latency_ex04.js](http://media.pragprog.com/titles/fkajs/code/latency/latency_ex04.js)


    | ​  | ​**function**​ loadFromCache() { |


    | ​  | ​**const**​ data = { |


    | ​  | ​*"userId"*​: 1, |


    | ​  | ​*"id"*​: 1, |


    | ​  | ​*"title"*​: ​*"delectus aut autem"*​, |


    | ​  | ​*"completed"*​: ​**false**​ |


    | ​  | }; |


    | ​  | ​**return**​ ​**new**​ Promise((resolve) => { |


    | ​  | resolve(data); |


    | ​  | }) |


    | ​  | } |


    | ​  |  |


    | ​  | ​**function**​ fetchData() { |


    | ​  | ​**const**​ timeOut = 2000; ​*// two seconds*​ |


    | ​  | ​**const**​ cache = loadFromCache().then((data) => { |


    | ​  | ​**return**​ ​**new**​ Promise((resolve) => { |


    | ​  | setTimeout(() => { |


    | ​  | resolve(data); |


    | ​  | }, timeOut); |


    | ​  | }); |


    | ​  | }); |


    | ​  | ​**const**​ freshData = fetch(​*''https://jsonplaceholder.typicode.com/todos/1''*​);
    |


    | ​  | ​**return**​ Promise.race([freshData, cache]); |


    | ​  | } |


    | ​  |  |


    | ​  | fetchData().then((response) => { |


    | ​  | console.log(response); |


    | ​  | }).​**catch**​((error) => { |


    | ​  | console.error(error); |


    | ​  | }); |


    In this version of the code, we concurrently fetch data from an external API and
    pull data from a cache to use in case the API is inaccessible or doesn’t respond
    quickly enough. For the sake of simplicity, the loadFromCache() function returns
    a predefined object, but in a real-world app you’ll probably load the cached data
    from a database.


    Of course, using cached data would work only for certain types of information
    that doesn’t change frequently. If you’re retrieving data like stock prices or
    exchange rates, then using Promise.any() is a better choice (see [​*Avoiding the
    Single Point of Failure*​](#f_0039.xhtml_sec.AvoidingSingleFailure)) since it
    allows you to request data from multiple APIs and use the result of the one that’s
    accessible.


    An interesting use case for Promise.race() is to batch async requests. As explained
    by Chris Jensen,^([[15]](#f_0046.xhtml_FOOTNOTE-15)) if you have to make a large
    number of async requests and don’t want the pending requests to get out of hand,
    you can use Promise.race() “to keep a fixed number of parallel promises running
    and add one to replace whenever one completes.” Using Promise.race() in this way
    lets you run multiple jobs in a batched way while preventing too much work from
    happening at one time.


    You can also apply Promise.race() to a computationally expensive background task.
    It’s easy to imagine cases where some task might be attempted in the background,
    such as rendering a complex canvas while the user is occupied with something else.
    Using Promise.race() there, again gives you some knowable time to work with—and
    the opportunity to introduce some logic of what to do should the task fail.


    ## Wrapping Up


    You can’t control how long it takes for a server to respond to requests, but that
    shouldn’t stop you from designing apps that are responsive to user requests. By
    taking advantage of the Promise.race() method, you can set a timeout for async
    requests and react if they take too long to complete.


    In the next chapter, you’re going to learn about canceling pending async requests
    using the AbortController API.


    #### Footnotes


    [[13]](#f_0043.xhtml_FNPTR-13)


