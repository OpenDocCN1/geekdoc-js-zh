    \n掌握了异步迭代器和生成器的基础后，你现在可以编写更强大的异步程序。接下来，你将使用 ES2020 的 `Promise.allSettled()` 方法来获取互不依赖的多个\
    \ promise 的结果。\n\n#### 脚注\n\n- [`caniuse.com/es6-generators`](https://caniuse.com/es6-generators)\n\
