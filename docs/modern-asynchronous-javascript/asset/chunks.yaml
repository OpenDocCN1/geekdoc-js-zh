  trans: "\n\n```javascript\ncontainer.style.backgroundColor = 'aqua';\n}\n\nfunction\
    \ release() {\n  container.style.backgroundColor = 'transparent';\n}\n\ncontainer.addEventListener('mouseenter',\
    \ sayHello);\ncontainer.addEventListener('mouseout', sayBye);\ncontainer.addEventListener('mousedown',\
    \ depress);\ncontainer.addEventListener('mouseup', release);\n```\n\n在这里，我们为一个类名为\
    \ `container` 的元素绑定了四个事件处理器。现在，如果我们想停止这个效果，就必须一个一个地移除每个处理器。注意，参数必须相同——即事件的类型和事件处理器的函数。\n\
    \n[abort/abort_ex06.js](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex06.js)\n\
    \n```javascript\ncontainer.removeEventListener('mouseenter', sayHello);\ncontainer.removeEventListener('mouseout',\
    \ sayBye);\ncontainer.removeEventListener('mousedown', depress);\ncontainer.removeEventListener('mouseup',\
    \ release);\n```\n\n但是可以使用 `AbortController` API 来实现相同的的结果，而无需单独移除每个处理器。`addEventListener()`\
    \ 方法现在接受一个 `abort signal` 作为第三个参数。创建一个控制器对象，并将其 `signal` 属性传递给 `addEventListener()`，如下所示：\n\
    \n[abort/abort_ex07.js](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex07.js)\n\
    \n```javascript\nconst container = document.querySelector('.container');\nconst\
    \ controller = new AbortController();\nconst signal = controller.signal;\n\nfunction\
    \ sayHello() {\n  container.textContent = 'Hello';\n}\n\nfunction sayBye() {\n\
    \  container.textContent = 'Bye!';\n}\n\nfunction depress() {\n  container.style.backgroundColor\
    \ = 'aqua';\n}\n\nfunction release() {\n  container.style.backgroundColor = 'transparent';\n\
    }\n\ncontainer.addEventListener('mouseenter', sayHello, {signal});\ncontainer.addEventListener('mouseout',\
    \ sayBye, {signal});\ncontainer.addEventListener('mousedown', depress, {signal});\n\
    container.addEventListener('mouseup', release, {signal});\n```\n\n现在，我们可以通过单一的\
    \ `AbortSignal` 取消所有的 `addEventListener()` 方法：\n\n```javascript\ncontroller.abort();\n\
    ```\n\n当只有几个事件处理器时，单独移除每个事件处理器可能不是大问题，但如果有几十个，情况就会变得很糟糕。例如，假设我们有一个长元素列表，我们想要用户能够通过拖放元素来排序列表。\n\
    \n对于每个元素，都绑定了一个事件来检查拖拽状态。我们希望在用户点击“保存”后禁用拖放。在这种情况下，使用 `AbortController` 可以节省时间：与其单独移除每个事件处理器，我们可以调用\
    \ `abort()` 来移除所有它们。\n\n到目前为止，我们一直通过程序取消请求，但如果你想给用户自己取消请求的机会呢，例如当他们决定不再等待下载时？\n\
    \n## 创建用户可取消的异步请求\n\n在页面上包含大文件时，你应该考虑到某些用户可能处于带宽限制或使用流量昂贵的移动设备上。因此，允许用户加载并取消加载大项目的能力是有价值的。\n\
    \n假设你需要从维基百科加载一张非常大的照片（在这种情况下大小为 22 MB）。你想定义一个按钮来获取照片，定义另一个按钮来取消加载。程序将如下所示：\n\n\
    ![images/abort/cancellable_req.png](img/cancellable_req.png)\n\n你可以在这里查看此程序的实时示例：\n\
    \n[`eloux.com/async_js/examples/abort_ex08_complete.html`](https://eloux.com/async_js/examples/abort_ex08_complete.html)\n\
    \n首先，在页面上定义一个 HTML `<image>` 元素。该元素的 `src` 属性将在图像加载后被填充。我们还需要一个元素来告知用户结果，因此定义一个类名为\
    \ `result` 的 `<span>` 元素。接下来，创建按钮。在点击加载按钮之前，我们要禁用取消按钮，因此给它添加一个 `disabled` 属性：\n\
    \n[abort/abort_ex08.html](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex08.html)\n\
    \n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
    >\n  <title>Making a Cancelable Request</title>\n  <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n  <script src=\"abort_ex08.js\" defer></script>\n\
    </head>\n<body>\n  <image class=\"image\">\n  <span class=\"result\"></span>\n\
    \  <button class=\"loadBtn\">Load Photo</button>\n  <button class=\"abortBtn\"\
    \ disabled>Cancel Loading</button>\n</body>\n</html>\n```\n\n现在，在 JavaScript 文件中，我们需要设置两个函数：一个在点击“加载”按钮时调用，另一个在点击“取消加载”按钮时调用：\n\
    \n[abort/abort_ex08.js](http://media.pragprog.com/titles/fkajs/code/abort/abort_ex08.js)\n\
    \n```javascript\n// 为每个元素创建引用\nconst loadBtn = document.querySelector('.loadBtn');\n\
    const abortBtn = document.querySelector('.abortBtn');\nconst image = document.querySelector('.image');\n\
    const result = document.querySelector('.result');\n\nconst controller = new AbortController();\n\
    \n// 取消请求\nabortBtn.addEventListener('click', () => controller.abort());\n\n//\
    \ 加载图像\nloadBtn.addEventListener('click', async () => {\n  loadBtn.disabled =\
    \ true;\n  abortBtn.disabled = false;\n  result.textContent = 'Loading...';\n\n\
    \  try {\n    const response = await fetch(`https://upload.wikimedia.org/wikipedia/commons/a/a3/Kayakistas_en_Gliar_Grey.jpg`,\
    \ {signal: controller.signal});\n    const blob = await response.blob();\n   \
    \ image.src = URL.createObjectURL(blob);\n    // 移除“Loading..”文本\n    result.textContent\
    \ = '';\n  } catch (err) {\n    if (err.name === 'AbortError') {\n      result.textContent\
    \ = 'Request successfully canceled';\n    } else {\n      result.textContent =\
    \ 'An error occurred!';\n      console.error(err);\n    }\n  }\n  loadBtn.disabled\
    \ = false;\n  abortBtn.disabled = true;\n});\n```\n\n注意代码第 13 行注册了一个在点击加载按钮时调用的异步函数。在函数内部，我们禁用加载按钮以防止重复点击并启用取消加载按钮。接下来，我们使用标准的\
    \ `fetch()` 函数尝试获取图像。\n\n为了能够显示获取的图像，我们需要将其转换为对象 URL。首先使用 `Blob()` 构造函数获取一个 `Blob`\
    \ 对象（第 22 行）。现在，通过将该对象传递给 `URL.createObjectURL()` 方法，你可以创建一个引用该 `Blob` 的 URL。显示图像只需剩下的工作是将结果插入到图像标签的\
    \ `src` 属性中。在代码结束处，我们将按钮恢复到原始状态。\n\n| 什么是 Blob? |\n\n| --- |\n\n"
