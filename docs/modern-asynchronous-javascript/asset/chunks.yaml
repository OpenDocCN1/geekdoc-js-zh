    Otherwise, the code would throw a SyntaxError.


    It’s a common practice to enclose for...await...of in a try...catch statement.
    This way when a promise rejects, we can gracefully handle the rejection:


    [iterators/iterator_ex07.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex07.js)


    | ​  | ​**const**​ collection = { |


    | ​  | [Symbol.asyncIterator]() { |


    | ​  | ​**return**​ { |


    | ​  | next: () => { |


    | ​  | ​**return**​ Promise.reject(​**new**​ Error(​*''Something went wrong.''*​))
    |


    | ​  | } |


    | ​  | }; |


    | ​  | } |


    | ​  | }; |


    | ​  |  |


    | ​  | (​**async**​ ​**function**​() { |


    | ​  | ​**try**​ { |


    | ​  | ​**for**​ ​**await**​ (​**const**​ value ​**of**​ collection) {} |


    | ​  | } ​**catch**​ (error) { |


    | ​  | console.error(​*''Caught: ''*​ + error.message); |


    | ​  | } |


    | ​  | })(); |


    | ​  |  |


    | ​  | ​*// logs:*​ |


    | ​  | ​*// ⇒ Caught: Something went wrong.*​ |


    This iterator returns a Promise object that is rejected. Without try...catch,
    we would see an Uncaught (in promise) Error in the browser’s console. The try...catch
    statement allows us to specify a response should an exception be thrown.


    The for...await...of statement provides a convenient, concise way of accessing
    the items of an async iterable. By wrapping it in a try...catch statement, we
    have the ability to handle promise rejections the way we want.


    | To Infinity and Beyond! |


    | --- |


    | ![images/aside-icons/info.png](images/aside-icons/info.png) | An interesting
    aspect of iterators is that they are infinite. For instance, you may have a Fibonacci
    iterator that delivers an infinite sequence. |


    ## Detecting Whether an Object Is Iterable


    So far we’ve been working with iterable objects that we “own.” Before iterating
    over an object that we haven’t created, it’s important to ensure that the object
    is iterable; otherwise, the code may throw a TypeError:


    [iterators/iterator_ex08.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex08.js)


    | ​  | ​*// a plain object*​ |


    | ​  | ​**const**​ collection = { |


    | ​  | a: 10, |


    | ​  | b: 20, |


    | ​  | c: 30 |


    | ​  | }; |


    | ​  |  |


    | ​  | ​**for**​ (​**let**​ value ​**of**​ collection) { ​*// ⇒ TypeError: collection
    is not iterable*​ |


    | ​  | console.log(value); |


    | ​  | } |


    Detecting whether an object is iterable isn’t complicated: check for the existence
    of [Symbol.iterator] on the object and ensure it’s a function (the for...of construct
    performs a similar check before execution):


    [iterators/iterator_ex09.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex09.js)


    | ​  | ​**function**​ isIterable(object) { |


    | ​  | ​**return**​ ​**typeof**​ object[Symbol.iterator] === ​*"function"*​; |


    | ​  | } |


    | ​  |  |


    | ​  | console.log(isIterable({a: 10, b: 20})); ​*// ⇒ false*​ |


    | ​  | console.log(isIterable(123)); ​*// ⇒ false*​ |


    | ​  |  |


    | ​  | console.log(isIterable(​*"abc"*​)); ​*// ⇒ true*​ |


    | ​  | console.log(isIterable([10, 20, 30])); ​*// ⇒ true*​ |


    The process of detecting async iterables is almost the same, except that you’ll
    need to look for [Symbol.asyncIterator] on the object like this:


    [iterators/iterator_ex10.js](http://media.pragprog.com/titles/fkajs/code/iterators/iterator_ex10.js)


    | ​  | ​**const**​ collection = { |


    | ​  | [Symbol.asyncIterator]: ​**async**​ ​**function**​() { |


    | ​  | ​*// ...*​ |


    | ​  | } |


    | ​  | }; |


    | ​  |  |


    | ​  | ​**function**​ isAsyncIterable(object) { |


    | ​  | ​**return**​ ​**typeof**​ object[Symbol.asyncIterator] === ​*"function"*​;
    |


    | ​  | } |


    | ​  |  |


    | ​  | console.log(isAsyncIterable(collection)); ​*// ⇒ true*​ |


    When working with objects originating from external sources, you might expect
    that they will always remain in a certain shape. But writing your code based on
    this assumption is a recipe for error. Before using the objects you haven’t created,
    always ensure they have the property/method you’re looking for.


    ## Wrapping Up


    ‘Symbol.iterator‘ and ‘Symbol.asyncIterator‘ are the cornerstone of iterables,
    and you can take advantage of them to create custom iterators. Custom iterators
    allow you to define or customize the iteration behavior of JavaScript objects.
    You can’t use ‘for...of‘ to iterate over async iterables; instead you should use
    ‘for...await...of‘. Next up, we’ll work with generator functions to enhance your
    JavaScript code.


