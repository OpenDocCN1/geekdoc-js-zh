  \n`Date` 对象还有一个 `setTime( )` 方法，该方法接受自纪元（epoch）以来的毫秒数作为参数——每天有 `86,400,000` 毫秒，因此\
  \ `setTime(86400000)` 将日期设置为 1970 年 1 月 1 日。\n\n## 匹配模式 (Match Patterns)\n\n`RegExp`\
  \ 对象是 JavaScript 的内置对象，可以包含一个“正则表达式”模式 – 用于描述字符串字符。正则表达式对于文本验证以及在文本内进行搜索和替换操作非常有用，通过将指定的模式与文本部分进行匹配来实现。\n\
  \n![image](img/pg396_1.jpg)\n\n正则表达式模式可能完全由位于 `/ /` 之间的字面字符组成，描述要匹配的字符字符串。例如，正则表达式\
  \ `/wind/` 在“windows”中找到匹配项 – 该模式在字面上完全匹配了文本中的字符串。更常见的是，正则表达式模式由字面字符和这些“元字符”组合组成：\n\
  \n| 元字符 | 匹配项 | 示例 |\n| :--- | :--- | :--- |\n| `.` | 任意字符 | `ja..pt` |\n| `^` |\
  \ 起始字符 | `^ja` |\n| `$` | 结尾字符 | `....pt$` |\n| `*` | 0 次或多次重复 | `ja*` |\n| `+`\
  \ | 一次或多次重复 | `ja+` |\n| `?` | 0 次或一次重复 | `ja?` |\n| `{ }` | 多次重复 | `ja{ 3 }` |\n\
  | `[ ]` | 字符类 | `[ a-z ]` |\n| `\\` | 任意数字 | `\\d` |\n| `\\||` | 或可选字符 | `a \\|\
  \ b` |\n| `( )` | 表达式分组 | `( ... )` |\n\n模式在最后一个 `/` 字符之后还可以包含 `i` 修饰符以执行忽略大小写的搜索，或者包含\
  \ `g` 修饰符对模式的所有匹配项进行全局搜索。\n\n`RegExp` 对象有一个 `test( )` 方法，在找到匹配时返回 true，否则返回 false。`RegExp`\
  \ 对象还有一个 `exec( )` 方法，在未找到匹配时返回 null 值，如果搜索成功则返回找到的文本，以及它的 `index` 属性（包含了匹配开始的字符位置）。\n\
  \n![image](img/snake.jpg)\n\n正则表达式的主题非常广泛，超出了本书的范围——但为了完整性，这里提供了简要的介绍。\n\n![image](img/forget.jpg)\n\
  \n字符类 `[a-z]` 仅匹配小写字母，但 `[a-z0-9]` 也匹配数字。\n\n![image](img/1p.jpg)创建一个带有自执行函数的 HTML\
  \ 文档，该函数比开始初始化三个变量\n\n```javascript\nconst system = ‘Windows’, suite = ‘Office’\
  \ pattern = /ice/i\n```\n\n![image](img/htmlp.jpg)\n\nregexp.html\n\n![image](img/2p.jpg)接下来，添加语句输出两个搜索结果\n\
  \n```javascript\nconsole.log( ‘In ‘ + system +’? ‘ + pattern.test( system ) )\n\
  console.log( ‘In ‘ + suite + ‘? ‘ + pattern.test( suite ) )\n```\n\n![image](img/3p.jpg)现在，添加语句输出文本匹配和位置，或者在未成功时输出消息\n\
  \n```javascript\nlet result = pattern.exec( suite )\nif( result )\n{\n  console.log(\
  \ ‘Found: ‘ + result + ‘ at ‘ + result.index )\n}\nelse { console.log( ‘No Match\
  \ Found’ ) }\n```\n\n![image](img/4p.jpg)然后，添加语句输出验证格式不错误的电子邮件地址尝试的结果\n\n```javascript\n\
  let email = ‘mike@example’\nconst format = /.+\\@.+\\..+/\nconsole.log( email +\
  \ ‘ Valid? ‘ + format.test( email ) )\n```\n\n![image](img/snake.jpg)\n\n这里使用的正则表达式仅测试最基本的电子邮件格式要求。\n\
  \n![image](img/5p.jpg)最后，添加语句修正地址格式并输出验证结果\n\n```javascript\nemail += ‘.com’\nconsole.log(\
  \ email + ‘ Valid? ‘ + format.test( email ) )\n```\n\n![image](img/6p.jpg)保存 HTML\
  \ 文档，然后在浏览器中打开它并启动控制台查看正则表达式匹配\n\n![image](img/pg397_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n字符索引从零开始，所以第四个字符位于索引位置 3。\n\n## 认识 JSON (Meet JSON)\n\n![image](img/pg398_1.jpg)\n\
  \nJavaScript 对象表示法 (“JSON”) 是一种用于存储和交换数据的流行文本格式。它是 JavaScript 语言的一个子集，在其中数据被存储为键值对或数组：\n\
  \n- **String** – 位于双引号内\n- **Number** – 整数或浮点数\n- **Object** – 在花括号内\n- **Array**\
  \ – 在方括号内\n- **Boolean** – true 或 false\n- **Null** – 空值\n\n你可以使用 `JSON.stringify(`\
  \ 方法将 JavaScript 对象转换为 JSON 字符串。反之，可以使用 `JSON.parse(` 方法将 JSON 字符串转换为 JavaScript\
  \ 对象。JSON 是常用的数据交换格式，常用于服务器与客户端之间传输数据。\n\n## 创建 Promise (Make Promises)\n\nJavaScript\
  \ 是一种单线程的“同步”语言。这意味着在任何时刻只能执行一个操作。随着脚本的进行，每个操作被添加到“调用栈”中，然后（按从上到下的顺序）执行——然后从栈中移除。\n\
  \n![image](img/pg400_1.jpg)\n\n\n\n\n\n然而，某些功能是由浏览器 API（“应用程序编程接口”）处理的，而不是由 JavaScript\
  \ 引擎处理。例如，`setTimeout()` 方法由浏览器处理的——这样在等待计时器结束时，可以执行其他操作。当计时器结束时，它会将操作传递到“回调队列”，然后（当它到达队列头部时）就会被执行。整个过程由一个“事件循环”控制，该循环不断监控调用堆栈和回调队列的状态。\n\
  \n![image](img/pg400_2.jpg)\n\n在 JavaScript 中，`Promise` 对象表示异步操作的最终完成或失败及其产生的值。它的状态可以是\
  \ `pending`（进行中）、`resolved`（已解决）或 `rejected`（已拒绝）。\n\n你使用 JavaScript 的 `new` 关键字和\
  \ `Promise() ` 构造函数创建一个 promise。它接受一个函数作为参数，该函数反过来接受两个函数的名称，用于指定当 promise 被解决或拒绝时执行的操作。\n\
  \n每个 JavaScript promise 都有 `then() ` 和 `catch() ` 方法，可以使用点符号在 promise 对象之后进行“链式调用”。`then()\
  \ ` 方法可以处理异步操作的结果，而 `catch() ` 方法可以在被拒绝时处理错误。\n\n![image](img/hot.jpg)\n\nWeb 浏览器有多个\
  \ API，包括 Fetch API，它用于通过网络获取资源。\n\n![image](img/hot.jpg)\n\n你可以向 promise 链式添加多个\
  \ `then() ` 方法调用，但只有一个会接收到解析后的结果。\n\n![image](img/1p.jpg)以一个自执行函数开始脚本，该函数创建一个 JavaScript\
  \ Promise 对象，该对象将在一秒延迟后执行两个函数之一一个\n\n```javascript\nconst promise = new Promise(\
  \ function( resolve, reject ) {\nlet random = Math.round( Math.random( ) * 10 )\n\
  if ( random % 2 === 0 )\n{ setTimeout( function( ) { resolve( random ) }, 1000 )\
  \ }\nelse\n{ setTimeout( function( ) { reject( random ) }, 1000 ) }\n} )\n```\n\n\
  ![image](img/htmlp.jpg)\n\nindex.html（注：此处原文为 promise.html）\n\n![image](img/2p.jpg)接下来，添加一个带有链式方法的语句来显示\
  \ promise 状态并处理返回的值\n\n```javascript\npromise\n.then( console.log( promise ) )\n\
  .then( function( res ) { console.log( res + ‘ Is Even’ } ) )\n.catch( function(\
  \ err ) { console.log( err + ‘ Is Odd’ } ) )\n```\n\n![image](img/3p.jpg)保存 HTML\
  \ 文档，然后在网页浏览器中打开它，并启动开发者工具中的控制台查看异步操作\n\n![image](img/pg401_1.jpg)\n\n![image](img/pg401_2.jpg)\n\
  \n![image](img/hot.jpg)\n\n注意控制台如何提供 promise 的行号以及处理结果函数的行号。\n\n### Fetch 数据\n\n\
  Web 浏览器支持 Fetch API，可以在 JavaScript 中通过网络获取资源。`fetch() ` 方法接受一个参数，即要获取的资源的 URL。\n\
  \n![image](img/pg402_1.jpg)\n\n`fetch() ` 方法是异步的，这意味着在等待资源到达时可以执行其他操作。完成后，`fetch()\
  \ ` 方法返回一个 `Promise` 对象，该对象包含一个响应（一个 `HTTPResponse` 对象）。\n\n通常，`fetch() ` 方法可以获取\
  \ JSON 资源并使用 `HTTPResponse` 对象的 `json() ` 方法对其进行解析。返回的 JSON 数据可以作为参数传递给下一个链式 promise\
  \ 方法，该方法反过来可以将 JSON 数据传递给处理函数。该过程的语法如下：\n\n```javascript\nfetch( *url* )\n.then(\
  \ function( response ) { return response.json( ) } )\n.then( function( data ) {\
  \ return *handler*( data ) } )\n.catch( function( err ) { return console.log( err\
  \ ) } )\n```\n\n### 箭头函数表达式\n\n上面的函数定义可以可选地写成更简洁的 JavaScript `=>` 箭头函数表达式。这让你能够跳省略\
  \ `function` 关键字，如下：\n\n```javascript\n.then( ( response ) => { return response.json(\
  \ ) } )\n```\n\n如果函数体只包含一条语句，且该语句返回一个值，你也可以省略 `=>` 箭头函数的大括号和 `return` 关键字，如下：\n\n\
  ```javascript\n.then( ( response ) => response.json( ) )\n```\n\n任何参数都可以像往常一样出现在圆括号\
  \ `()` 内的逗号分隔列表中，但如果只有一个参数，你甚至可以省略 `=>` 箭头函数中的括号——因此整个过程的语法可以可选地看起来：\n\n```javascript\n\
  fetch( *url* )\n.then( response => response.json( ) )\n.then( data => *handler*(\
  \ data ) )\n.catch( err => console.log( err ) )\n```\n\n这更具可读性，但你应该注意 `=>` 箭头函数处理\
  \ `this` 关键字的方式与普通函数不同。\n\n![image](img/snake.jpg)\n\n使用箭头函数时，`this` 关键字表示原始上下文的对象，而在普通函数中，`this`\
  \ 关键字表示调用函数的对象。\n\n![image](img/1p.jpg)打开一个纯文本编辑器（如 Windows 的记事本应用），然后创建一个包含多个键值对的\
  \ JSON 文档\n\n![image](img/pg403_2.jpg)\n\n![image](img/403_1.jpg)\n\n![image](img/2p.jpg)保存\
  \ JSON 文档，它可以通过网络访问\n\n```javascript\nfetch( ‘localhost/data.json’ )\n.then( response\
  \ => response.json( ) )\n.then( data => list( data ) )\n.catch( err => console.log(\
  \ err ) )\n```\n\nindex.html\n\n现在，创建一个函数来打印数据\n\n```javascript\nfunction list(\
  \ data ) {\nconst values = Object.values( data )\nlet i = 0\nwhile( i < values.length\
  \ ) { console.log( values[ i ] ) i++ }}\n```\n\n![image](img/5p.jpg)保存 HTML 文档和\
  \ JSON 文档，然后通过 HTTP 打开网页并启动开发者工具中的控制台查看数据\n\n\n\n\n\n# 19 字符串与数字 ![image](img/pg337_1.jpg)\n\
  \n本章描述并演示了 JavaScript 内置 `Math` 和 `String` 对象的方法。\n\n- 计算面积\n- 比较数字\n- 小数舍\n- 生成随机数\n\
  - 合并字符串\n- 分割字符串\n- 查找字符\n- 修剪字符串\n- 总结\n\n## 计算面积\n\n![image](img/pg406_1.jpg)\n\
  \nJavaScript 有一个内置的 `Math` 对象，提供了许多实用的方法和数学常量值。常量列在下表所示，以及它们的近似值：\n\n| **常量** |\
  \ **描述** |\n| :--- | :--- |\n| `Math.E` | 常数 E，自然对数的底数，近似值为 2.71828 |\n| `Math.LN2`\
  \ | 2 的自然对数，近似值为 0.69315 |\n| `Math.LN10` | 10 的自然对数，近似值为 2.30259 |\n| `Math.LOG2E`\
  \ | 常数 E 的以 2 为底的对数，近似值为 1.44269 |\n| `Math.LOG10E` | 常数 E 的以 10 为底的对数，近似值为 0.43429\
  \ |\n| `Math.PI` | 常数 PI，近似值为 3.14159 |\n| `Math.SQRT1_2` | 0.5 的平方根，近似值为 0.70711\
  \ |\n| `Math.SQRT2` | 2 的平方根，近似值为 1.41421 |\n\n不需要创建 `Math` 对象的实例，因为它默认全局可访问，因此可以通过\
  \ `Math` 对象和点符号表示语法从脚本的任何地方访问 `Math` 常量和方法。\n\n`Math` 常量主要用于具有特定数学目的的脚本，但为了完整性，上述列出了所有所有的\
  \ `Math` 常量。\n\n![image](img/hot.jpg)\n\n所有的 `Math` 方法都列在这里。\n\n![image](img/1o.jpg)创建一个\
  \ HTML 文档，包含一个自执行函数，从初始化变量开始\n\n```javascript\nlet radius = 4\nconsole.log( '\\\
  nRadius of Circle: ' + radius )\n```\n\n![image](img/htmlo.jpg)\n\nconstants.html\n\
  \n![image](img/2o.jpg)接下来，添加语句执行数学计算并在输出中显示结果\n\n```javascript\nlet area = Math.PI\
  \ * ( radius * radius )\nconsole.log( '\\nArea of Circle: ' + area )\n```\n\n![image](img/3o.jpg)现在，添加语句执行另一个数学计算并在输出中显示结果\n\
  \n```javascript\nlet circumference = 2 * ( Math.PI * radius )\nconsole.log( '\\\
  nPerimeter of Circle: ' + circumference )\n```\n\n![image](img/4o.jpg)然后，添加语句执行最后的数学计算并在输出中显示结果\n\
  \n```javascript\nlet cube = ( radius * radius * radius )\nlet volume = ( ( 4 / 3\
  \ ) * Math.PI ) * cube\nconsole.log( '\\nVolume of Sphere: ' + volume )\n```\n\n\
  ![image](img/5o.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台查看数学结果\n\n![image](img/pg407_1.jpg)\n\
  \n![image](img/snake.jpg)\n\n所有的 `Math` 常量名称必须大大写——例如，确保使用 `Math.PI` 而不是 `Math.pi`。\n\
  \n## 比较数字\n\n![image](img/pg408_1.jpg)\n\n内置的 `Math` 对象提供了这些实用的方法：\n\n| **方法** |\
  \ **返回** |\n| :--- | :--- |\n| `Math.abs()` | 绝对值 |\n| `Math.acos()` | 反余弦值 |\n\
  | `Math.asin()` | 反正弦值 |\n| `Math.atan()` | 反正切值 |\n| `Math.atan2()` | 来自 X 轴点的点的角度\
  \ |\n| `Math.ceil()` | 向上舍入的值 |\n| `Math.cos()` | 余弦值 |\n| `Math.exp()` | 常数 E 的指数\
  \ |\n| `Math.floor()` | 向下取整的值 |\n| `Math.log()` | 自然对数值 |\n| `Math.max()` | 两个数中较大的一个\
  \ |\n| `Math.min()` | 两个数中较小的一个 |\n| `Math.pow()` | 幂 |\n| `Math.random()` | 伪随机数\
  \ |\n| `Math.round()` | 最接近的整数 |\n| `Math.sin()` | 正弦值 |\n| `Math.sqrt()` | 平方根值\
  \ |\n| `Math.tan()` | 正切值 |\n\n![image](img/1o.jpg)创建一个 HTML 文档，包含一个自执行函数，从初始化两个变量开始\n\
  \n```javascript\nlet square = Math.pow( 5, 2 )     // 5 的 2 次方 ( 5 x 5 )\nlet cube\
  \ = Math.pow( 4, 3 )      // 4 的 3 次方 ( 4 x 4 x 4 )\n```\n\n![image](img/htmlo.jpg)\n\
  \nmath.html\n\n![image](img/2o.jpg)接下来，添加语句在输出中显示这两个正变量值中的最大值最小值\n\n```javascript\n\
  console.log( '\\nLargest Positive: ' + Math.max( square, cube ) )\nconsole.log(\
  \ '\\nSmallest Positive: ' + Math.min( square, cube ) )\n```\n\n![image](img/3o.jpg)现在，添加语句反转每个变量的极性\n\
  \n```javascript\nsquare *= -1\ncube *= -1\n```\n\n![image](img/4o.jpg)然后，添加语句在输出中显示这两个变量值的最大值和最小值\n\
  \n```javascript\nconsole.log( '\\nLargest Positive: ' + Math.max( square, cube )\
  \ )\nconsole.log( '\\nSmallest Positive: ' + Math.min( square, cube ) )\n```\n\n\
  ![image](img/5o.jpg)最大的负值是靠近零的一个。\n\n## 小数舍\n\n内置的 `Math` 对象提供了三种处理浮点数的方法。每个方法接收浮点数作为参数并返回一个整数。`Math.ceil()`\
  \ 方法向上舍入，`Math.floor()` 方法向下取整，而 `Math.round()` 方法向最近的整数舍入。\n\n![image](img/pg10.jpg)\n\
  \n在处理浮点值时，重要的是要意识到根据 IEEE（电气电子工程师学会）定义的计算机浮点数学与通常接受的数学准确性之间的差异。这是由于某些小数无法精确转换为二进制形式。例如，小数\
  \ `81.66` 无法精确转换为二进制，所以\n\n某些编程语言提供自动舍入来克服浮点差异，但 JavaScript 没有，因此必须小心，特别是在处理金额时，以避免数学错误的结果。建议的方法是先将浮点值乘以\
  \ 100，执行数学运算，最后将结果除以 100 返回相同的相同的位数。\n\n类似的方法也可将长浮点值保留两位小数。在将值乘以 100 后，可以使用 `Math.round()`\
  \ 方法对值进行舍入，然后通过除法返回两位小数。\n\n乘法、运算、再除法的步骤可以写为独立步骤，也可以使用括号在单个简洁表达式中确定顺序。例如，将命名为 `num`\
  \ 的长浮点值可以写为：\n\n```javascript\nnum = num * 100\nnum= Math.round( num )\nnum /= 100\n\
  ```\n\n或者作为：\n\n```javascript\nnum = ( Math.round( num * 100 ) ) / 100\n```\n\n\
  `Math.round()` 方法默认向上舍入——所以 `Math.round( 7.5 )` 返回 8 而不是 7，`Math.round( -7.5 )`\
  \ 返回 -7 而不是 -8。\n\n![image](img/1o.jpg)创建一个 HTML 文档，包含一个自执行函数，从初始化变量开始\n\n```javascript\n\
  let bodyTemp = 98.6\n```\n\n![image](img/htmlo.jpg)\n\nround.html\n\n![image](img/2o.jpg)接下来，添加语句显示最接近该浮点值的整数\n\
  \n\n\n\n\n```javascript\nconsole.log( ‘Ceiling: ‘ + Math.ceil( bodyTemp ) )\nconsole.log(\
  \ ‘Floor: ‘ + Math.floor( bodyTemp ) )\nconsole.log( ‘Round: ‘ + Math.round( bodyTemp\
  \ ) )\n```\n![image](img/3o.jpg)现在，添加语句来显示表达式的错误计算结果以及修正后的等效结果\n\n```javascript\n\
  console.log( ‘\\nImprecision: ‘ + ( 81.66 * 15 ) )\nconsole.log( ‘Corrected: ‘ +\
