  \n最内层括号中的表达式优先求。\n\n## 生成随机数\n\nJavaScript 的 `Math.random()` 方法返回一个 0.0 到 1.0 之间的随机浮点数。它可以用于各种需要生成随机数的网页效果。通过乘以随机浮点值可以扩大其范围。例如，将其乘以\
  \ 10，范围就会扩大到 0.0-10.0。\n\n![image](img/pg412_1.jpg)\n\n通常情况下，使用 `Math.ceil()` 方法将随机值向上取整，这样范围就会变为\
  \ 1-10。\n\n指定随机数值范围的过程可以写成单独的步骤，也可以使用括号在单个表达式中确定顺序。例如，为名为 `rand` 的变量指定 1-10 的范围，可以写为：\n\
  \n```javascript\nlet rand = Math.random()\nrand *= 10\nrand = Math.ceil(rand)\n\
  ```\n\n或者另一种写法是：\n\n```javascript\nlet rand = Math.ceil(Math.random() * 10)\n```\n\
  \n可以在指定的范围内生成一组唯一的随机数。例如，在 1-59 范围内范围内产生一组随机彩票号码选择：\n\n![image](img/1o.jpg)创建一个带有自执行函数的\
  \ HTML 文档，该函数开始声明五个变量\n\n```javascript\nlet i, rand, temp, nums = [ ]\nlet str =\
  \ ‘\\n\\nYour Six Lucky Numbers: ‘\n```\n\n![image](img/htmlo.jpg)\n\nrandom.html\n\
  \n![image](img/2o.jpg)接下来，添加一个循环将数组元素 1-59 填充为它们对应的索引号\n\n```javascript\nfor( i\
  \ = 1 ; i < 60 ; i++ ) { nums[ i ] = i }\n```\n![image](img/3o.jpg)现在，添加一个循环将数组元素中的数字随机化\n\
  \n```javascript\nfor( i = 1 ; i < 60 ; i++ )\n{\n  rand = Math.ceil( Math.random()\
  \ * 59 )\n  temp = nums[ i ]\n  nums[ i ] = nums[ rand ]\n  nums[ rand ] = temp\n\
  }\n```\n![image](img/hot.jpg)\n\n步骤 3 包含一个洗牌算法的算法，确保没有两个元素包含相同的数字。\n\n![image](img/4o.jpg)然后，添加一个循环将包含六个元素值的连字符列表附加到字符串变量\n\
