  \n```javascript\nlet str = definition.slice( 0, 27 )\nstr += definition.slice( 62,\
  \ 70 )\nconsole.log( str )\n```\n\n![image](img/3o.jpg)现在，添加语句输出切片中的四个独立的单词\n\n\
  ```javascript\nconsole.log( str.split( ‘ ‘, 4 )\n```\n\n![image](img/4o.jpg)然后，添加语句将原始字符串中选定的子字符串赋值给第二个变量，然后输出其值\n\
  \n```javascript\nstr = definition.substring( 42, 52 )\nstr += definition.substring(\
  \ 10, 17 )\nstr += definition.substr( 52, 70 )\nconsole.log( str )\n```\n\n![image](img/5o.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它并启动控制台以查看分割后的字符串输出\n\n![image](img/pg417_1.jpg)\n\n![image](img/forget.jpg)\n\
  \n将 `’’`（不带任何空格的空字符串）作为 `split(()` 函数的分隔符，以返回单个字符的数组。\n\n## 查找字符\n\nJavaScript String\
  \ 对象提供了许多方法，允许在字符串中搜索特定字符或子字符串。字符串 `search(()` 方法接受子字符串作为参数，并返回该字符在搜索字符串中出现的位置，如果未找到则返回值\
  \ -1。或者，可以将子字符串作为字符串 `match(()` 方法的参数，如果该子字符串存在则返回该子字符串，如果不存在则返回 JavaScript 的 `null`\
  \ 值。\n\n![image](img/pg418_1.jpg)\n\n字符串 `indexOf(()` 方法接受子字符串作为参数，当子字符串存在时，返回其首次出现的索引位置，当不存在时返回\
  \ -1。`lastIndexOf(()` 方法的工作方式相同，但它是从字符串末尾反向搜索的，报告子字符串的最后一次出现。\n\n要发现字符串中特定索引位置的字符，可以将索引值作为\
  \ `charAt(()` 方法的参数，或者通过向 `charCodeAt(()` 方法指定索引值来揭示其数字 Unicode 值。相反，可以将一个或多个 Unicode\
  \ 值作为 `String.fromCharCode(()` 方法的参数，以返回它们的字符值。\n\n此外，可以通过将字符或子字符串的值指定为字符串 `replace(()`\
  \ 方法的第一个参数，并将替换值作为第二个参数，来替换它们的所有出现处。\n\n![image](img/1o.jpg)创建一个带有自执行函数的 HTML 文档，该函数从初始化一个带有字符串值的变量开始\n\
  \n```javascript\nlet str = ‘JavaScript in easy steps’\n```\n\n![image](img/htmlo.jpg)\n\
  \nfind.html\n\n![image](img/2o.jpg)接下来，添加语句输出两个大小敏感字符串搜索的结果\n\n```javascript\nconsole.log(\
  \ ‘”Script” Search: ‘ + str.search( ‘Script’ ) )\nconsole.log( ‘”script” Search:\
  \ ‘ + str.search( ‘script’ ) )\n```\n\n![image](img/3o.jpg)现在，添加语句输出两个大小敏感字符串匹配的结果\n\
  \n```javascript\nconsole.log( ‘\\n”Script” Match: ‘ + str.match( ‘Script’ ) )\n\
  console.log( ‘”script” Match: ‘ + str.match( ‘script’ ) )\n```\n\n![image](img/snake.jpg)\n\
  \n`null` 关键字不等同于零值，因为 `null` 没有任何值。\n\n![image](img/hot.jpg)\n\n使用双引号在单引号包围的字符串中包含引号标记。\n\
  \n![image](img/4o.jpg)添加语句，如果在字符串内找到字符，则输出该字符的第一个和最后一个索引位置\n\n```javascript\nconsole.log(\
  \ ‘nindexOf “s”: ‘ + str.indexOf( ‘s’ ) )\nconsole.log( ‘indexOf “m”: ‘ + str.indexOf(\
  \ ‘m’ ) )\nconsole.log( ‘\\nlastIndexOf “s”: ‘ + str.lastIndexOf( ‘s’ ) )\nconsole.log(\
  \ ‘lastIndexOf “m”: ‘ + str.lastIndexOf( ‘m’ ) )\n```\n\n![image](img/5o.jpg)然后，添加语句输出字符串中的第一个字符及其\
  \ Unicode 值，加上通过其 Unicode 值指定的字符\n\n```javascript\nconsole.log( ‘charAt 0: ‘ + str.charAt(\
  \ 0 ) )\nconsole.log( ‘charCodeAt 0: ‘ + str.charCodeAt( 0 ) )\nconsole.log( ‘fromCharCode:\
  \ ‘ + String.fromCharCode( 74, 97, 118, 97 ) )\n```\n\n![image](img/6o.jpg)最后，添加语句输出原始字符串及其修改版本\n\
  \n```javascript\nconsole.log( ‘\\nOriginal: ‘ + str )\nconsole.log( ‘Replaced: ‘\
  \ + str.replace( ‘easy’, ‘simple’ ) )\n```\n\n![image](img/7o.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台查看结果\n\
  \n![image](img/pg417_1.jpg)\n\n![image](img/hot.jpg)\n\nUnicode 大写 A-Z 值为 65-90，小写\
  \ a-z 值为 97-122。\n\n![image](img/forget.jpg)\n\n`replace(()` 方法返回原始字符串的修改版本，但不会实际更改原始字符串。\n\
  \n## 修剪字符串\n\nJavaScript String 对象提供了 `trim()` 方法，可以移除字符串两端的空白字符。这对于确保用户输入不包含意外的空格、制表符或换行符特别有用。\n\
  \n![image](img/pg420_1.jpg)\n\n从字符串修剪空白后，你可以使用 `startsWith(()` 方法验证其起始字符，使用 `endsWith(()`\
  \ 方法验证其结束字符。这些方法各接受字符或子字符串作为参数，并在字符串中进行大小敏感的匹配。如果找到匹配，它们将返回 true，如果未找到则返回 false。\n\
  \n可以通过在字符串变量名后在 `[]` 方括号内指定索引位置来引用单个字符——例如，`str[ 0 ]` 用于引用名为 `str` 的字符串的字母。\n\n\
  你还可以通过将字符或子字符串作为 `includes(()` 方法的参数，在字符串中进行大小敏感的匹配。如果找到匹配，这将返回 true，如果未找到将返回 false。\n\
  \n如果你想构造一个包含多个字符串副本的新字符串，只需向 `repeat(()` 方法指定一个整数参数，以确定现有字符串在新创建的字符串中重复多少次。\n\n\
  ![image](img/1o.jpg)创建一个带有自执行函数的 HTML 文档，该函数从初始化一个变量开始——其值包含字符串两侧的空白字符\n\n```javascript\n\
  let str = ‘   Love For All, Hatred For None.   ’\n```\n\n\n\n\n\n![image](img/2o.jpg)接下来，添加语句来输出字符串并测试它的开头和结尾\n\
  \n```javascript\nconsole.log( ‘String: ‘ + str )\nconsole.log( ‘Starts With “L”\
  \ ? ‘ + str.startsWith( ‘L’ ) )\nconsole.log( ‘Ends With “.” ? ‘ +str.endsWith(\
  \ ‘.’ ) )\nconsole.log( ‘First Letter: ‘ + str[ 0 ] )\n```\n\n![image](img/3o.jpg)现在，添加一条语句将修剪后的字符串赋值给变量\n\
  \n```javascript\nstr = str.trim( )\n```\n\n![image](img/hot.jpg)\n\n`split()` 方法用于从示例此处中的\
  \ cookie 数据中移除空白字符。\n\n![image](img/4o.jpg)然后，添加语句输出修剪后的字符串并像之前一样测试它的开头和结尾：\n\n\
  ```javascript\nconle.log( ‘Trimmed: ‘ + str )\nconsole.log( ‘Starts With “L” ? ‘\
  \ + str.startsWith( ‘L’ ) )\nconsole.log( ‘Ends With “.” ? ‘ +str.endsWith( ‘.’\
  \ ) )\nconsole.log( ‘First Letter: ‘ + str[ 0 ] )\n```\n\n![image](img/5o.jpg)添加语句查看字符串中的子字符串\n\
  \n```javascript\nconsole.log( ‘\\nIncludes “Hat” ? ‘+ str.includes( ‘Hat’ ) )\n\
  console.log( ‘Includes “hat” ? ‘+ str.includes( ‘hat’ ) )\n```\n\n![image](img/6o.jpg)最后，添加一条语句输出\
  \ 10 次修剪后的字符串\n\n```javascript\nconsole.log( ‘\\nRepeat:\\n’ + str.repeat( 10 )\
  \ )\n```\n\n![image](img/7o.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台查看输出结果\n\n![image](img/pg421_1.jpg)\n\
  \n![image](img/hot.jpg)\n\n字符匹配也可以使用相等运算符完成，例如 `str[ 0 ] === ‘L’`\n\n![image](img/forget.jpg)\n\
  \n使用这些方法进行匹配是区分大小写的。\n\n## 总结\n\n- `Math` 对象提供了数学常量（如 `Math.PI`）和数学方法（如 `Math.max()`）。\n\
  - 浮点数可以使用 `Math.floor()`、`Math.ceil()` 和 `Math.round()` 方法舍入到最近的整数。\n- JavaScript\
  \ 不提供自动舍入来解决浮点数差异。\n- 将浮点数值乘以 100，进行算术运算，然后将结果除以 100 以避免误差错误。\n- `Math.random()`\
  \ 方法返回 0.0 到 1.0 之间的随机浮点数。\n- 将随机浮点数乘以 10 并使用 `Math.ceil()` 舍入结果，可以得到 1-10 的范围。\n\
  - `String` 对象提供了操作字符串值的有用方法，如 `toUpperCase()` 和 `toLowerCase()`。\n- 每个字符串都有一个 `length`\
  \ 属性，其中包含一个表示该字符串字符总数的整数。\n- 字符串可以使用 `+` 拼接运算符或字符串 `concat()` 方法连接在一起。\n- `eval()`\
  \ 内置函数可能会产生安全影响，因此最好避免使用。\n- `slice()` 和 `substring()` 方法的参数指定起始和结束位置，而 `substr()`\
  \ 方法的参数指定起始位置和要复制的字符数。\n- `split()` 方法返回一个数组，包含所有存在于参数指定的字符出现位置之间的子字符串。\n- `search()`、`match()`、`indexOf()`、`lastIndexOf()`\
  \ 和 `charAt()` 方法可用于在字符串内查找字符。\n- `trim()` 方法移除字符串两端的空白字符。\n- `startsWith()`、`endsWith()`\
  \ 和 `includes()` 方法在字符串内寻找区分大小写的匹配。\n- `replace()` 和 `repeat()` 方法创建修改后的字符串。\n\n\
  | 20 处理 Window 对象 | ![image](img/pg337_1.jpg) |\n\n*本章描述并演示了 浏览器环境中顶层 Window 对象的方法。*\n\
  \n- 相识 DOM\n- 检查属性\n- 显示对话框\n- 滚动查看\n- 弹出窗口\n- 制作计时器\n- 检查浏览器\n- 检查状态\n- 控制位置\n\
  - 浏览历史\n- 总结\n\n## 相识 DOM\n\n![image](img/pg424_1.jpg)\n\n浏览器在一个名为“文档对象模型”（DOM）的层次结构树中表示网页的所有的所有组件。每个组件都出现在顶层窗口对象下方，树包含如如下所示的分支：\n\
  \n![image](img/pg424_2.jpg)\n\n可以使用 `for...in` 循环列出浏览器提供的窗口对象的所有属性。列表将包含所有现代浏览器通用的基础属性，以及某些特定浏览器的微小属性。\n\
  \n![image](img/hot.jpg)\n\n后面跟着方括号的项目是数组对象，而普通圆括号内的是各种表单元素。\n\n![image](img/1bl.jpg)创建一个带有空列表元素的\
  \ HTML 文档\n\n```html\n<ol id=”props” style=”column-count:3”> </ol>\n```\n\n![image](img/htmlbl.jpg)\n\
  \ndom.html\n\n接下来，在脚本元素创建一个自执行函数，该函数从初始化两个变量开始\n\n```javascript\nconst list = document.getElementById(\
  \ ‘props’ )\nlet property = null\n```\n\n![image](img/3bl.jpg)现在，添加一个循环，用浏览器窗口对象的直接属性填充列表元素：\n\
  \n```javascript\nfor( property in window )\n{\n  if( property ) { list.innerHTML\
  \ += ‘<li>’ + property }\n}\n```\n\n![image](img/4bl.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台查看输出结果\n\
  \n![image](img/pg425_1.jpg)\n\n![image](img/forget.jpg)\n\n标签 `</li>` 是可选的，因此在此循环中省略了。\n\
  \n![image](img/hot.jpg)滚动列表以检查所有属性 - 这一次共有 204。\n\n## 检查属性\n\n顶层 DOM 窗口有一个 `screen`\
  \ 子对象，提供描述显示器的属性。整体屏幕尺寸可以通过 `window.screen.width` 和 `window.screen.height` 获取。\n\
  \n![image](img/pg426_1.jpg)\n\n同样，排除任务栏占据的可用屏幕尺寸可以通过 `window.screen.availWidth`\
  \ 和 `window.screen.availHeight` 获取。\n\n色彩能力可以通过 `window.screen.colorDepth` 属性发现，该属性包含描述颜色范围的值：\n\
  \n- **8 位** – 低色只能显示 256 种颜色。\n- **16 位** – 高色可以显示 65536 种颜色。\n- **24 位** – 真色可以显示数百万颜色。\n\
  - **32 位** – 深色可以显示数十亿种颜色。\n\n现代计算机使用 24 位或 32 位硬件进行色彩显示，但旧的计算机使用 16 位硬件。只有非常旧的计算机和旧手机使用\
  \ 8 位硬件显示色彩。\n\n还有一个 `window.screen.pixelDepth` 属性包含屏幕位深，但在现代计算机上，该值与 `window.screen.colorDepth`\
  \ 相同 始终使用 `window.screen.colorDepth` 来发现色彩能力。\n\n某些浏览器现在支持 `window.screen.orientation`\
  \ 对象，它有一个 `type` 属性描述屏幕当前的方向为横屏或竖屏，以及这是否是屏幕主要的或辅助的方向。\n\n由于 `window` 对象是浏览器脚本环境中的顶层全局对象，在引用其子对象及其属性时，可以省略它的名称。例如，你可以简单写\
  \ `screen.colorDepth` 来引用 `window.screen.colorDepth` 属性。\n\n![image](img/snake.jpg)\n\
  \n注意这些属性名的“驼峰命名法”大写。\n\n```html\n<p id=”props” style=”font:1.5em sans-serif”></p>\n\
  ```\n\n\n\n\n\n![image](img/htmlbl.jpg)\n\nscreen.html\n\n![image](img/2bl.jpg)接下来，在\
  \ `script` 元素中，创建一个自执行函数，该函数初始化六个变量\n\n```javascript\nconst info = document.getElementById(\
  \ ‘props’ )\nlet width = window.screen.width + ‘px’\nlet height = window.screen.height\
  \ + ‘px’\nlet availW = window.screen.availWidth + ‘px’\nlet availH = window.screen.availHeight\
  \ + ‘px’\nlet colors = ‘Unknown’\n```\n\n![image](img/3bl.jpg)现在，添加一条语句描述色彩能力\n\n\
  ```javascript\nswitch( window.screen.colorDepth )\n{\ncase 8 : colors = ‘Low Color’\
  \ ; break\ncase 16 : colors = ‘High Color’ ; break\ncase 24 : colors = ‘True Color’\
  \ ; break\ncase 32 : colors = ‘Deep Color’ ; break\n}\n```\n\n![image](img/4bl.jpg)然后，添加语句显示屏幕信息\n\
  \n```javascript\ninfo.innerHTML = ‘Screen Resolution: ‘ +\nwidth + ‘ x ‘ + height\
  \ + ‘<br>’\ninfo.innerHTML += ‘Available Screen Size: ‘ +\navailW + ‘ x ‘ + availH\
  \ + ‘<br>’\ninfo.innerHTML += ‘Color Capability: ‘ + colors + ‘<br>’\nif( window.screen.orientation\
  \ )\n{\ninfo.innerHTML += ‘Orientation: ‘ +\nwindow.screen.orientation.type\n}\n\
  ```\n\n![image](img/5bl.jpg)保存该 HTML 文档，然后在浏览器中打开它以查看屏幕信息\n\n![image](img/pg427_1.jpg)\n\
  \n![image](img/forget.jpg)\n\n这里的可用高度比屏幕高度少 40 像素，因为桌面任务栏高度为 40 像素。\n\n![image](img/hot.jpg)\n\
  \n`colorDepth` 属性可用于色彩能力有限的浏览器在文档中提供低分辨率图像。\n\n## 显示对话框\n\n顶层 DOM 窗口对象提供了三种方法，JavaScript\
  \ 可以通过这些方法向用户显示对话框消息。可以将简单的警告消息字符串作为 `window.alert()` 方法的参数。它将显示在一个只有一个“确定”按钮的对话框上，点击后只会关闭对话框。\n\
  \n![image](img/pg428_1.jpg)\n\n更有用的是，可以将消息作为 `window.confirm()` 方法的参数，请求用户做出决定。它将显示在一个有“确定”和“取消”按钮的对话框上。点击任何按钮都会关闭对话框，但“确定”按钮返回\
  \ `true` 值，而“取消”按钮返回 `false` 值。\n\n还可以可以将消息作为 `window.prompt()` 方法的参数，以请求用户输入。它将显示在一个有“确定”按钮、“取消”按钮和一个文本输入字段的对话框上。点击任何按钮都会关闭对话框，但“确定”按钮返回文本框中的值，而“取消”按钮返回\
  \ `null` 值。还可以为 `window.prompt()` 方法提供第二个参数，以指定文本框的默认内容。\n\n![image](img/1bl.jpg)创建一个带有空段落的\
  \ HTML 文档\n\n```html\n<p id=”response” style=”font:1.5em sans-serif”></p>\n```\n\
  \n![image](img/htmlbl.jpg)\n\ndialogs.html\n\n![image](img/2bl.jpg)接下来，在 `script`\
  \ 元素中，创建一个自执行函数，该函数初始化一个变量引用\n\n```javascript\nconst info = document.getElementById(\
  \ ‘response’ )\n```\n\n![image](img/3bl.jpg)现在，添加一条语句在简单的对话框上显示消息\n\n```javascript\n\
  window.alert( ‘Hello from JavaScript’ )\n```\n\n![image](img/4bl.jpg)然后，添加一条语句请求用户做出决定，并将响应写入段落\n\
  \n```javascript\ninfo.innerHTML = ‘Confirm: ‘ + window.confirm( ‘Go or Stop?’ )\n\
  ```\n\n![image](img/5bl.jpg)接下来，添加一条语句请求用户输入文本，并将文本响应写入段落\n\n```javascript\ninfo.innerHTML\
  \ += ‘<br>Prompt: ‘ + window.prompt( ‘Yes or No?’, ‘Yes’ )\n```\n\n![image](img/6bl.jpg)保存该\
  \ HTML 文档，然后在浏览器中打开它，以看到消息出现在简单的对话框上出现\n\n![image](img/pg429_1.jpg)\n\n![image](img/7bl.jpg)点击每个对话框上的“确定”按钮以依次关闭它们，然后看响应出现在段落中\n\
  \n![image](img/pg429_2.jpg)\n\n![image](img/pg429_3.jpg)\n\n![image](img/pg429_4.jpg)\n\
  \n![image](img/hot.jpg)\n\n`confirm` 对话框可以配合 `if` 语句来实现脚本分支——例如：\n\n```javascript\n\
  if( confirm( ‘OK?’ ) ) { ... } else { ... }\n```\n\n![image](img/forget.jpg)\n\n\
  如果脚本需要使用来自 `prompt` 对话框的文本输入，去除字符串两端的空格是一个良好习惯——参见此处。\n\n## 滚动\n\nDOM 对象有一个 `scrollBy()`\
  \ 方法，允许窗口进行水平和垂直滚动。该方法需要两个参数，指定沿各个轴移动的像素数。\n\n![image](img/pg430_1)\n\n当内容垂直溢出窗口时，右侧会出现滚动条。`scrollBy()`\
  \ 方法将按指定的像素数滚动。同样，当内容水平溢出窗口时，底部会出现滚动条。`scrollBy()` 方法将按指定的像素数滚动。\n\n还有一个 `scrollTo()`\
  \ 方法，接受两个参数（X 和 Y 坐标）滚动到特定位置。例如，当浏览器以表格格式显示数据时，`scrollTo()` 方法可以将特定的单元格放在窗口的左上角。\n\
  \nDOM 对象有一个 `scrollX` 属性，存储水平滚动的像素数。它表示“滑块”（滚动框）在窗口底部相对于窗口左角的位置。`scrollX` 属性是旧属性\
  \ `pageXOffset` 的别名，它在 DOM 中仍然存在，可以用它可以代替它。\n\n同样，有一个 `scrollY` 属性，存储垂直滚动的像素数。它表示滑块在窗口右侧滚动条上的位置，相对于窗口顶角。`scrollY`\
  \ 属性是旧属性 `pageYOffset` 的别名，它在 DOM 中仍然存在，可以用它可以代替它。\n\n向 `scrollBy()` 方法传递负值可以向上和向左移动。\n\
  \n![image](img/snake.jpg)\n\n`scrollby()` 方法的效果只有在内容溢出窗口并导致滚动条出现时才会显现。\n\n![image](img/1bl.jpg)创建一个带有宽空段落的\
  \ HTML 文档，该段落距离窗口左侧会有\n\n```html\n<p id=”info” style=”width:2000px; margin-left:300px;\n\
  font:1.2em sans-serif”></p>\n```\n\n![image](img/htmlbl.jpg)\n\nscroll.html\n\n\
  ![image](img/2bl.jpg)接下来，在 `script` 元素中，创建一个自执行函数，该函数初始化两个变量\n\n```javascript\n\
  const info = document.getElementById( ‘info’ )\nlet i = 0\n```\n\n![image](img/3bl.jpg)现在，添加一个循环向段落写入列\
  \ 40 个数字\n\n```javascript\nfor( i = 1 ; i < 41 ; i++ )\n{\ninfo.innerHTML += ( i\
  \ + ‘<br> )\n}\n```\n\n![image](img/4bl.jpg)然后，添加一条语句窗口向右水平滚动 200 像素，并向下滚动段落元素的高度\n\
  \n```javascript\nwindow.scrollBy( 200, info.clientHeight )\n```\n\n![image](img/hot.jpg)\n\
  \n\n\n\n\n注意这里使用了了元素的 `clientHeight` 属性。元素还有一个非常有用的 `clientWidth` 属性。\n\n![image](img/5bl.jpg)\n\
  \n最后，添加一个语句来追加当前窗口滚动条位置的确认信息\n\n```javascript\ninfo.innerHTML += ‘scrollX: ‘ + window.scrollX\
  \ + '& scrollY: ‘ + window.scrollY\n```\n\n![image](img/6bl.jpg)\n保存该 HTML 文档，然后在浏览器中打开它，以查看窗口的滚动位置和滚动条位置\n\
  \n![image](img/pg431_1.jpg)\n\n# 弹出窗口\n\n![image](img/pg432_1.jpg)\n\n可以使用 `window`\
  \ 对象的 `open()` ) 方法打开新的浏览器窗口。这需要三个参数来指定要在新窗口中加载的 HTML 文档的 URL 地址、新窗口的名称，以及一个用逗号分隔的特性列表，用于指定窗口应包含的特性——这些特性如下表所示：\n\
  \n| 特性 | 说明 |\n| :--- | :--- |\n| `directories` | 添加链接栏 |\n| `height` | 设置文档区域的高度（像素）\
  \ |\n| `left` | 窗口的屏幕 X 坐标 |\n| `location` | 添加地址栏 |\n| `menubar` | 添加标准菜单栏 |\n\
  | `resizable` | 允许调整窗口大小 |\n| `scrollbars` | 在需要时启用滚动条 |\n| `status` | 添加状态栏 |\n\
  | `toolbar` | 添加前进和后退按钮的工具栏 |\n| `top` | 窗口的屏幕 Y 坐标 |\n| `width` | 设置文档区域的宽度（像素）\
  \ |\n\n当成功时，`window.open()` ) 方法将返回一个新的窗口对象并打开新的“弹出”窗口；如果失败，该方法将简单地返回 `null`。应将返回的结果赋值给一个变量，随后可以对该变量进行测试——如果该变量不为\
  \ `null`，则它必须代表弹出窗口对象。可以通过调用其 `close()` ) 方法关闭该窗口，或通过其 `print()` ) 方法打印其内容。\n\n\
  可以通过指定 X 和 Y 屏幕轴坐标作为 `window.moveTo()` ) 方法的参数来对窗口进行定位。还有一个类似的 `window.moveBy()`\
  \ ) 方法，它接受两个参数，用于指定窗口从当前屏幕位置沿 X 和 Y 轴移动的像素值。\n\n![image](img/forget.jpg)\n\n由于弹出窗口的烦人泛滥，浏览器制造商已添加弹出拦截器——因此不再建议使用弹出窗口，但为了完整性，此处演示了它们。\n\
  \n![image](img/1bl.jpg)\n创建一个包含标题的 HTML 文档\n\n```html\n<h1>弹出窗口</h1>\n```\n\n![image](img/htmlbl.jpg)\n\
  popup.html\n\n![image](img/htmlbl.jpg)\nopener.html\n\n![image](img/2bl.jpg)创建第二个包含标题的\
  \ HTML 文档\n\n```html\n<h1>主窗口</h1>\n```\n\n![image](img/3bl.jpg)\n接下来，在第二个文档的 script\
  \ 元素中，添加一个自执行函数来创建一个窗口对象\n\n```javascript\nconst popWin = window.open( ‘popup.html’,\
  \ ‘Popup’, ‘top=150,left=100,width=350,height=100’ )\n```\n\n![image](img/4bl.jpg)保存两个\
  \ HTML 文档，然后打开第二个文档，查看其弹出窗口已被拦截\n\n![image](img/pg433_1.jpg)\n\n![image](img/5bl.jpg)打开浏览器的弹出拦截对话框，并选择允许此页面的弹出\n\
  \n![image](img/pg433_2.jpg)\n\n![image](img/6bl.jpg)现在，刷新浏览器窗口以查看带有指定特性的弹出窗口\n\n\
  ![image](img/pg433_3.jpg)\n\n![image](img/snake.jpg)\n\n在特性列表字符串中不要包含任何空格，否则可能会导致\
  \ `window.open()` ) 方法失败。\n\n![image](img/hot.jpg)\n\n注意弹出窗口没有在其标题栏上显示指定的“图标（favicon）”。\n\
  \n# 创建计时器\n\nJavaScript 的 `window` 对象有一个有趣的 `setTimeout()` ) 方法，它可以在指定的时间后重复评估指定的表达式。如果指定的表达式调用了出现\
  \ `window.setTimeout()` ) 语句的函数，就会创建一个递归循环——其中该函数将在指定的时间后被重复执行。\n\n![image](img/pg434_1.jpg)\n\
  \n`setTimeout()` ) 方法要评估的表达式必须作为其第一个参数指定，而时间必须作为其第二个参数指定的数字。时间以毫秒为单位，其中 1000 代表一秒。\n\
  \n`setTimeout()` ) 方法返回一个数值，该值可以赋值给变量以唯一标识等待过程。此值可以作为 `window` 对象 `clearTimeout()`\
  \ ) 方法的参数，以便在某处终止计时器循环。\n\n`window` 对象还有 `setInterval()` ) 和 `clearInterval()` )\
  \ 方法，它们接受相同的参数且工作方式相似。区别在于，`setInterval()` 指定的时间是评估表达式的间隔，无论执行需要多长时间。反之，`setTimeout()`\
  \ 方法指定的时间是等待周期。\n\n创建一个带有空段落的 HTML 文档\n\n```html\n<p id=\"info\"></p>\n```\n\n![image](img/htmlbl.jpg)\n\
  timer.html\n\n![image](img/2bl.jpg)\n接下来，在 script 元素中，初始化一个返回内部函数的变量\n\n```javascript\n\
  const count = function ( ) {\n    let num = 10;\n    return function ( ) {\n   \
  \     // ...\n    }\n}\n```\n现在，添加一个初始化变量的计时器函数\n\n```javascript\nfunction countDown(\
  \ ) {\n    const info = document.getElementById('info')\n    let timerId = null;\n\
  \    let num = 10\n\n    if ( num > 0 ) {\n        info.innerHTML = '剩余时间：' + num;\n\
  \        timerId = setTimeout( countDown, 1000 )\n    } else {\n        info.innerHTML\
  \ += '<span>起飞了！</span>'\n        window.clearTimeout( timerId )\n    }\n}\n```\n\
  \n![image](img/3bl.jpg)\n在函数块之后，添加一个语句在页面加载时调用计时器函数\n\n```javascript\ncountDown()\n\
  ```\n\n![image](img/4bl.jpg)\n保存该 HTML 文档，然后在浏览器中打开它，查看计时器倒计时 10 秒\n\n![image](img/pg435_1.jpg)\n\
  \n![image](img/pg435_2.jpg)\n\n![image](img/pg435_3.jpg)\n\n![image](img/hot.jpg)\n\
  \n你可以性地在计时器函数中添加 `console.log( timerId )` 语句，以查看计时器的 ID 值。\n\n# 查看浏览器\n\n在 DOM 层次结构中，顶层\
  \ `window` 对象有许多子对象，每个对象都有自己的属性和方法。其中之一是 `window.navigator` 对象，它包含了有关浏览器的信息。由于顶层\
  \ `window` 对象存在于“全局命名空间”中，其所有子对象都可以省略地址的该部分，因此可以使用 `alert()` 直接调用 `window.alert()`\
  \ ) 方法，可以使用 `onload` 引用 `window.onload` 属性，可以使用 `navigator` 引用 `window.navigator`\
  \ 对象。\n\n![image](img/pg436_1.jpg)\n\n`navigator` 对象有一个 `appName` 属性包含浏览器名称，一个 `appCodeName`\
  \ 属性包含其代码名称，以及 `appVersion` 属性包含其版本号。但你可能会对这些值感到惊讶，因为 Google Chrome、Firefox、Safari\
  \ 和 Opera 的代码名称都是“Mozilla”。\n\n\n\n\n每个浏览器在向 Web 服务器发送请求时，都会在名为“User-Agent”的 HTTP\
  \ 请求头中发送浏览器代码名称和版本，此字符串也可以通过 `navigator.userAgent` 属性获取。还有一个 `navigator.platform`\
  \ 属性，用于描述浏览器的宿主操作系统。\n\n在过去的几年里，人们非常关注浏览器检测脚本，这些脚本尝试通过 `navigator` 属性来识别浏览器，以便提供适用于该浏览器支持的功能的代码。这现在被认为是一种坏做法，目前建议使用特性检测（feature\
  \ detection）来代替。\n\n例如，通过查询浏览器是否支持有用的 `addEventListener()` 方法，可以判断该浏览器是否支持现代文档对象模型（DOM）。\n\
  \n![image](img/1bl.jpg)创建一个带有空列表的 HTML 文档\n\n```html\n<ul id=\"list\"></ul>\n```\n\
  \n![image](img/htmlbl.jpg)\n\nbrowser.html\n\n![image](img/2bl.jpg)接下来，在 `<script>`\
  \ 元素中创建一个自执行函数，该函数首先初始化一个变量引用\n\n```javascript\nconst list = document.getElementById(\
  \ ‘list’ )\n```\n\n![image](img/3bl.jpg)现在，添加语句列出你浏览器的名称\n\n```javascript\nlist.innerHTML\
  \ = ‘<li>Browser: ‘ + navigator.appName\nlist.innerHTML += ‘<li>Code Name: ‘ + navigator.appCodeName\n\
  ```\n\n![image](img/hot.jpg)\n\n之前的示例显式地使用了 `window` 前缀，使 `window` 对象方法和属性的父级关系清晰可见，但技术上最好省略\
  \ `window.` 前缀——这样它们就不会通过 `window` 对象自身的 `window` 属性被引用。例如，直接使用 `onload` 而不是 `window.onload`。\n\
  \n![image](img/4bl.jpg)然后，添加语句列出你的浏览器和操作系统的版本详情\n\n```javascript\nlist.innerHTML\
  \ += ‘<li>Version: ‘ + navigator.appVersion\nlist.innerHTML += ‘<li>Platform: ‘\
  \ + navigator.platform\n```\n\n![image](img/5bl.jpg)最后，添加一条语句来确认你使用的是现代浏览器\n\n```javascript\n\
  if( window.addEventListener )\n{\n  list.innerHTML += ‘<li>This is a modern DOM\
  \ browser’\n}\n```\n\n![image](img/6bl.jpg)保存 HTML 文档，然后在任何浏览器中打开它查看名称和版本详情\n\n\
  ![image](img/pg437_1.jpg)\n\n![image](img/pg437_2.jpg)\n\n![image](img/pg437_3.jpg)\n\
  \n![image](img/hot.jpg)\n\n在所有现代 浏览器中，`window` 对象都有一个 `addEventListener()` 方法——你将在第\
  \ 21 章中发现更多相关信息，该章节演示了窗口事件。\n\n![image](img/hot.jpg)\n\nGoogle Chrome 等浏览器将自己描述为\
  \ Netscape、Mozilla 是源于“浏览器大战”时代——那时浏览器必须假装这些名称，以便能够加载 Netscape Mozilla 浏览器可以加载的所有\
  \ Web 页面。\n\n## 检查状态\n\nDOM 窗口对象的 `navigator` 子对象有一个 `javaEnabled()` 方法，只有当 Web\
  \ 浏览器中启用了 Java 支持时，该方法才会返回 `true`。\n\n![image](img/pg438_1.jpg)\n\n还有一个 `cookieEnabled`\
  \ 属性，只有当浏览器启用了 cookie 支持时，它才为 `true`。\n\n此外，`navigator` 有一个 `plugins` 子对象和一个 `mimeTypes`\
  \ 子对象。与其他数组一样，`plugins` 和 `mimeTypes` 数组都有一个 `length` 属性，包含它们元素的数值总数。\n\n每个插件数组元素都有\
  \ `name` 和 `description` 属性，包含一个已安装插件功能的详情。可以像常一样使用元素索引号引用它们。例如，`navigator.plugins[0].name`\
  \ 的是 `plugins` 数组第一个元素的 `name` 属性。\n\n同样，每个 `mimeTypes` 数组元素都有 `type` 和 `description`\
  \ 属性，包含一个支持的 MIME 功能的详情。可以像常一样使用元素索引号引用它们。例如，`navigator.mimeTypes[0].type` 的是 `mimeTypes`\
  \ 数组第一个元素的 `type` 属性。\n\n![image](img/1bl.jpg)创建一个带有空段落的 HTML 文档\n\n```html\n<p\
  \ id=\"info\"></p>\n```\n\n![image](img/htmlbl.jpg)\n\nenabled.html\n\n![image](img/2bl.jpg)接下来，在\
  \ `<script>` 元素中创建一个自执行函数，该函数首先初始化两个变量\n\n```javascript\nconst info = document.getElementById(\
  \ ‘info’ )\nlet status = ‘‘\n```\n\n![image](img/3bl.jpg)现在，添加语句，只有在启用 Java 支持时才在段落中写入确认\n\
  \n```javascript\nstatus = ( navigator.javaEnabled() ) ? ‘Enabled’ : ‘Disabled’\n\
  info.innerHTML += ‘Java Support is ‘ + status + ‘<hr>’\n```\n\n![image](img/4bl.jpg)然后，添加语句，只有在启用\
  \ cookie 支持时才在段落中写入确认\n\n```javascript\nstatus = ( navigator.cookieEnabled ) ? ‘Enabled’\
  \ : ‘Disabled’\ninfo.innerHTML += ‘Cookie Support is ‘ + status + ‘<hr>’\n```\n\n\
  ![image](img/forget.jpg)\n\n这些数组元素的内容根据每个浏览器支持的功能而异。\n\n![image](img/5bl.jpg)现在，添加语句写入\
  \ plugins 数组的长度和一个示例元素\n\n```javascript\nif ( navigator.plugins.length > 0 )\n{\n\
  \  info.innerHTML += ‘Plugins: ‘ + navigator.plugins.length\n  info.innerHTML +=\
  \ ‘<br>Example: ‘ + navigator.plugins[0].name\n  info.innerHTML += ‘<br>Description:\
  \ ‘ + navigator.plugins[0].description\n}\n```\n\n![image](img/6bl.jpg)最后，添加语句写入\
  \ MIME 类型数组的长度和一个示例元素\n\n```javascript\nif ( navigator.mimeTypes.length > 0 )\n\
  {\n  info.innerHTML += ‘MIME types: ‘ + navigator.mimeTypes.length\n  info.innerHTML\
  \ += ‘<br>Example: ‘ + navigator.mimeTypes[0].type\n  info.innerHTML += ‘<br>Description:\
  \ ‘ + navigator.mimeTypes[0].description\n}\n```\n\n![image](img/7bl.jpg)\n\n你可以使用循环写入所有的\
  \ plugins 和 mimeTypes 元素。\n\n## 控制位置\n\n窗口的 `location` 对象有五个属性，包含当前在浏览器中加载的文档的完整地址组件。协议、域名、文件名和锚点（如果有）包含在\
  \ `location.href` 属性中。将新 URL 赋值给 `location` 属性将导致浏览器加载该地址的页面或资源。\n\n![image](img/pg440_1.jpg)\n\
  \n![image](img/1bl.jpg)创建一个带有超链接锚点的段落的 HTML 文档\n\n```html\n<p id=\"info\">\n  <a\
  \ id=\"frag\">Fragment Anchor</a>\n</p>\n```\n\n![image](img/htmlbl.jpg)\n\nlocation.html\n\
  \n![image](img/2bl.jpg)接下来，在 `<script>` 元素中创建一个自执行函数，该函数首先初始化两个变量\n\n```javascript\n\
  const info = document.getElementById( ‘info’ )\nlet jump = confirm( ‘Jump to Fragment?’\
  \ )\n```\n\n![image](img/3bl.jpg)现在，如果用户同意请求，则添加语句更改窗口的位置\n\n```javascript\nif (\
  \ jump )\n{\n  location = location.href + ‘#frag’\n}\n```\n\n![image](img/4bl.jpg)然后，添加语句在面板中写入当前位置地址的每个组件\n\
  \n```javascript\ninfo.innerHTML += ‘<hr>Href: ‘ + location.href\ninfo.innerHTML\
  \ += ‘<br>Protocol: ‘ + location.protocol\ninfo.innerHTML += ‘<br>Host:‘ + location.host\n\
  info.innerHTML += ‘<br>Path:‘ + location.pathname\ninfo.innerHTML += ‘<br>Hash:\
  \ ‘ + location.hash\n```\n\n![image](img/5bl.jpg)保存 HTML 文档，然后在任何浏览器中打开它，看到一个确认框请求更改位置\n\
  \n![image](img/6bl.jpg)点击取消按钮拒绝请求，并看到页面如常加载到其“根”位置\n\n![image](img/pg441_1.jpg)\n\
  \n\n\n\nWeb 浏览器可以加载任何支持的 MIME 类型的文件——例如，所有 PNG 文件的 MIME 类型为 `image/png`。\n\n![image](img/7bl.jpg)\n\
  刷新浏览器，然后点击 OK 按钮接受请求，并查看页面在相应片段位置的加载。\n\n![image](img/pg441_3.jpg)\n\n![image](img/pg441_4.jpg)\n\
  \n![image](img/hot.jpg)\n\n此处显示的的是位于本地系统 Web 服务器上的页面位置。如果页面位于你的桌面上，则协议将是 `file:`\
  \ 且没有 `host` 值。\n\n## 历史记录\n\nWeb 浏览器将当前会话中访问的 URL 历史存储在 `window` 对象的 `history`\
  \ 子对象中的数组中。与其它数组一样，它有一个 `length` 属性，但还有 `back()` 和 `forward()` 方法用于在元素之间移动。或者，历史记录对象的\
  \ `go()` 方法接受一个正整数或负整数作为参数，指定沿数组移动多少个元素。例如，`history.go( 1 )`向前移动一个元素，而 `history.go(\
  \ -2 )` 向后移动两个元素。\n\n![image](img/pg442_1.jpg)\n\n![image](img/1bl.jpg)\n创建三个完全相同的\
  \ HTML 文档，它们包含一个空段落并嵌入同一个外部脚本文件。\n\n```html\n<p id=”info” > </p>\n<script src=”history.js”\
  \ > </script>\n```\n\n![image](img/htmlbl.jpg)\n\npage-1.html\n\npage-2.html\n\n\
  page-3.html\n\n![image](img/2bl.jpg)\n接下来，创建一个脚本文件，其中包含一个自执行函数，开始初始化一个变量引用。\n\n\
  ```javascript\nconst info = document.getElementById( ‘info’ )\n```\n\n![image](img/jsbl.jpg)\n\
  \nhistory.js\n\n![image](img/3bl.jpg)\n现在，在函数块中添加语句向空段落中写入内容。\n\n```javascript\n\
  info.innerHTML += ‘<a href=”page-1.xhtml”>Page 1</a> | ‘\ninfo.innerHTML += ‘<a\
  \ href=”page-2.xhtml”>Page 2</a> | ‘\nsleep.innerHTML += ‘<a href=”page-3.xhtml”>Page\
  \ 3</a>’\ninfo.innerHTML += ‘<br>History Length: ‘ + history.length\ninfo.innerHTML\
  \ += ‘<br>Current Location: ‘ + location.pathname + ‘<br>’\n```\n\n![image](img/4bl.jpg)\n\
  然后添加语句在段落中创建按钮。\n\n```javascript\ninfo.innerHTML += ‘<button onclick=”history.back(\
  \ )”>Back</button>’\ninfo.innerHTML += ‘<button onclick=”history.forward( )”>Forward</button>’\n\
  ```\n\n![image](img/5bl.jpg)\n将 HTML 文档和 JavaScript 脚本文件保存在同一个文件夹中，然后清除浏览器历史记录。\n\
  \n![image](img/hot.jpg)\n\n要在 Google Chrome 浏览器中清除历史记录，点击 ![image](img/pg442_2.jpg)按钮，然后选择`更多工具`、`清除浏览数据`并点击`清除数据`按钮。\n\
  \n![image](img/6bl.jpg)\n打开第一个页面，查看初始历史长度为 1。\n\n![image](img/pg443_1.jpg)\n\n![image](img/7bl.jpg)\n\
  点击链接加载第三页，查看历史长度增加到 2。\n\n![image](img/pg443_2.jpg)\n\n![image](img/8bl.jpg)\n点击后退按钮返回第一个页面，但看到历史长度保持为\
  \ 2。\n\n![image](img/pg443_3.jpg)\n\n![image](img/hot.jpg)\n\nURL 以受保护的方式存储在 `history`\
  \ 对象数组元素中，因此无法以字符串形式被检索。\n\n![image](img/forget.jpg)\n\n在此示例中，只有当点击链接移动到不同页面时，每个\
  \ URL 才会被添加到 `history` 数组中。`back()`、`forward()` 和 `go()` 方法只是选择 `history` 数组中的元素，因此不会改变其\
  \ `length` 属性。\n\n## 总结\n\n- 文档对象模型 (DOM) 是 页面所有组件的层级树形表示。\n- `window` 对象是 DOM 层次结构中的顶层，具有描述浏览器窗口的属性。\n\
  - `screen` 对象是 `window` 对象的子，具有描述屏幕尺寸和颜色深色的属性。\n- `window` 对象具有 `scrollBy()` 和 `scrollTo()`\
  \ 方法以及指定滚动位置的 `scrollX` 和 `scrollY` 属性。\n- 可以使用 `window` 对象的 `alert()`、`confirm()`\
  \ 和 `prompt()` 方法显示对话框。\n- 可以使用 `window` 对象的 `open()` 方法创建弹出窗口，但可能会被弹出窗口拦截拦截。\n\
  - `window` 对象的 `setTimeout()` 方法创建一个计时器，稍后可以使用 `clearTimeout()` 方法取消。\n- `navigator`\
  \ 对象是 `window` 对象的子，具有描述浏览器和主机平台版本的属性。\n- `window` 对象存在于全局命名空间中，因此其所有子对象都不需要包含地址中的\
  \ `window` 部分。\n- 特性检测用于识别现代 DOM。\n- `navigator.plugins` 和 `navigator.mimeTypes`\
  \ 属性是包含支持功能详情的数组。\n- `location` 对象是 `window` 对象的子，具有描述页面位置的属性。\n- `history` 对象是\
  \ `window` 对象的子，包含访问历史记录的数组。\n\n| 提取信息 | ![image](img/337.jpg) |\n| :--- | :---\
  \ |\n| *本章演示了如何使用 DOM 对象的属性和方法。* | |\n\n在所有 DOM 对象中最感兴趣的是 `document` 对象，它提供了对 HTML\
  \ 文档的访问。\n\n- `document.title` 属性包含 HTML 标题元素中的值。\n- HTML 文档的位置包含在 `document.URL`\
  \ 属性中，类似于 `location.href` 属性的值。\n- 托管文档的域包含在 `document.domain` 属性中，类似于 `location.host`。\n\
  - HTML 文档向浏览器提供创建或最后修改日期，以便其决定使用缓存副本还是请求新副本。此日期也可以从 DOM 的 `document.lastModified`\
  \ 属性中获取。\n- `document.referrer` 属性存储用户加载当前 HTML 文档的网页 URL。只有当用户跟随超链接加载页面时才会设置，如果直接输入\
  \ URL 或使用其他方法加载页面则不会设置。\n\n![image](img/1v.jpg)\n创建一个 HTML 文档，在其主体部分提供指向第二个（目标）HTML\
  \ 文档的超链接。\n\n```html\n<p>\n<a href=”info-2.html” >跳转到下一页</a>\n</p>\n```\n\n![image](img/htmlv.jpg)\n\
  \ninfo-1.html\n\n![image](img/2v.jpg)\n接下来，创建目标 HTML 文档，它包含一个空有序列表。\n\n```html\n\
  <ul id=”list”></ul>\n```\n\n![image](img/htmlv.jpg)\n\ninfo-2.html\n\n![image](img/3v.jpg)\n\
  现在，在脚本元素中，创建一个自执行函数，开始初始化一个变量引用。\n\n```javascript\nconst list = document.getElementById(\
  \ ‘list’ )\n```\n\n![image](img/4v.jpg)\n然后，添加语句列出文档的特征。\n\n```javascript\nlist.innerHTML\
  \ = ‘<li>源自：’ + document.referrer\nlist.innerHTML += ‘<li>标题：’ + document.title\n\
  list.innerHTML += ‘<li>URL：’ + document.URL\n```\n\n\n\n\n\n```javascript\nlist.innerHTML\
  \ += '<li>Domain: ' + document.domain;\nlist.innerHTML += '<li>Last Modified: '\
  \ + document.lastModified;\n```\n\n![image](img/5v.jpg) \n将 HTML 文档保存在同一个文件夹中，然后在浏览器中打开包含链接的文档。\n\
  \n![image](img/pg447_1.jpg)\n\n![image](img/6v.jpg)\n现在，点击超链接在浏览器中加载第二个 HTML 文档并查看文档信息。\n\
  \n![image](img/pg447_2.jpg)\n\n![image](img/forget.jpg)\n\n`document.lastModified`\
  \ 中包含的日期与 HTML 文档本身有关，与 HTML 文档可能导入任何外部样式表或外部脚本文件无关。\n\n![image](img/snake.jpg)\n\
  \n此处显示的域名是位于本地系统 Web 服务器上的页面域名。如果页面位于你的桌面上，`document.referrer` 和 `document.domain`\
  \ 属性将不会赋予任何值。\n\n## 元素数组\n\nDOM 文档对象具有表单、图像、链接、样式表和脚本的子对象。这些子对象中的每一个都是一个数组，其中每个数组元素按照它们在\
  \ HTML 文档中出现的顺序代表文档组件。\n\n例如，文档正文中第一个图像（由 HTML `<img>` 标签指定）由 `document.images[0]`\
  \ 表示。这意味着可以使用 `document.images[0].src` 来引用其 URL，这会显示分配给 HTML `<img>` 标签 `src` 属性的路径。在脚本中为此组件分配新\
  \ URL 将动态地用不同的图像替换旧图像。\n\n![image](img/pg448_1.jpg)\n\n`links` 数组代表 HTML 文档中的 `<a>`\
  \ 标签；`styleSheets` 数组代表 HTML `<style>` 标签；`scripts` 数组代表 HTML `<script>` 标签。\n\n\
  `forms` 数组代表 HTML `<form>` 标签，但它也有自己的子元素对象，该对象是所有表单组件的数组。例如，HTML 文档中第一个表单的组件组件可以使用\
  \ `document.forms[0].elements[0].value` 来引用。在脚本中为此组件分配新值将动态地替换旧值。\n\n![image](img/1v.jpg)\
  \ 创建一个包含表单和空列表的 HTML 文档\n\n```html\n<form>\n  <img src=\"user.png\" alt=\"User\"\
  \ height=\"64\" width=\"64\">\n  <input type=\"text\" name=\"topic\" size=\"30\"\
  \ value=\"Type Your Question Here\">\n  <input type=\"button\" value=\"Ask a Question\"\
  > <br>\n  <a href=\"formhelp.html\" style=\"margin:5px\">Help?</a>\n</form>\n<ul\
  \ id=\"list\"></ul\n```\n\n![image](img/htmlv.jpg)\ncomponents.html\n\n![image](img/2v.jpg)\
  \ 现在，添加一个样式表来设置字体和表单\n\n```css\n<style>\n* { font : 1em sans-serif ; }\nform { width\
  \ : 500px ; height : 100px ; background : url(bg.png) ; }\n</style>\n```\n\n![image](img/pg448_2.jpg)\n\
  user.png 64px x 64px (灰色区域为透明)\n\n![image](img/pg448_3.jpg)\nbg.png 24px x 100px\n\
  \n![image](img/3v.jpg) 下一步，在脚本元素中创建一个自执行函数，该函数从初始化变量引用开始\n\n```javascript\nconst\
  \ list = document.getElementById('list');\n```\n\n![image](img/snake.jpg)\n\n注意\
  \ `styleSheets` 数组的“驼峰命名法”写法。\n\n![image](img/4v.jpg) 现在，添加语句列出文档的组件\n\n```javascript\n\
  list.innerHTML = '<li>No. Forms: ' + document.forms.length;\nlist.innerHTML += '<li>No.\
  \ Links: ' + document.links.length;\nlist.innerHTML += '<li>No. Images: ' + document.images.length;\n\
  list.innerHTML += '<li>No. Style Sheets: ' + document.styleSheets.length;\nlist.innerHTML\
  \ += '<li>No. Scripts: ' + document.scripts.length;\n```\n\n![image](img/5v.jpg)\
  \ 最后，添加语句列出两个属性值\n\n```javascript\nlist.innerHTML += '<li>First Image URL: ' + document.images[0].src;\n\
  list.innerHTML += '<li>First Form Element Value: ' + document.forms[0].elements[0].value;\n\
  ```\n\n![image](img/6v.jpg) 保存 HTML 文档，然后在浏览器中打开它以列出文档组件。\n\n![image](img/pg449_1.jpg)\n\
  \n注意，通过样式规则结合文档内的图像并不包含在 `images` 数组中，只有通过 HTML `<img>` 标签包含的图像——因此此处表单背景图像 (bg.png)\
  \ 不在 `images` 数组中。同样，内联到 `style` 属性的样式规则也不包含在 `styleSheets` 数组中。\n\n数组元素仅代表相关的 HTML\
  \ 标签。\n\n## 元素\n\n![image](img/forget.jpg)\n使用点表示法引用特定元素：\n\n- `document.getElementById(id)`：返回单个元素。\n\
  - `document.getElementsByTagName(tagName)`：返回一个 `HTMLCollection`。\n- `document.getElementsByClassName(className)`：返回一个\
  \ `HTMLCollection`。\n\n\n\n\n\n![image](img/6v.jpg)保存 HTML 文档，然后在浏览器中打开它，以查看通过不同方法检索的元素值\n\
  \n![image](img/pg451_1.jpg)\n\n## 写入内容\n\n如之前的示例所示，`document` 对象的 `innerHTML` 和\
  \ `innerText` 属性可以用于向现有元素写入内容。`document` 对象还有一个一个 `write()` 方法，它提供了写入内容的另一种方式，但它会自动调用\
  \ `document.open()` 方法来启动新文档——因此当前文档将不再显示。\n\n![image](img/pg452_1.jpg)\n\n更有用的是，`document.createElement()`\
  \ 方法接受一个标签名称作为参数，并创建一个该类型的元素。然后，可以通过赋值给新元素的 `innerHTML` 或 `innerText` 属性来向新元素添加内容。接着，通过将新元素指定为\
  \ `document.appendChild()` 方法的参数，将其插入到现有元素内部的网页中。\n\n你还通过通过指定属性名和值作为元素 `setAttribute()`\
  \ 方法的两个参数，动态地向元素写入属性。\n\n![image](img/1v.jpg)创建一个包含标题和一个包含三个项目的有序列表的 HTML 文档\n\n\
  ```html\n<h1 id=\"heading\">前三大城市</h1>\n<ol id=\"list\">\n  <li>Tokyo（日本东京）</li>\n\
  \  <li>New York（美国纽约）</li>\n  <li>Rio de Janeiro（巴西里约德亚内卢罗）</li>\n</ol>\n```\n\n\
  ![image](img/htmlv.jpg)\n\nwrite.html\n\n![image](img/2v.jpg)保存 HTML 文档，然后在浏览器中打开它，以查看网页\n\
  \n![image](img/pg452_2.jpg)\n\n![image](img/3v.jpg)接下来，在 `<script>` 元素中，创建一个自执行函数，该函数初始化两个变量作为新的列表项元素和一个变量引用：\n\
  \n```javascript\nconst itemFour = document.createElement('li')\nconst itemFive =\
  \ document.createElement('li')\nconst heading = document.getElementById('heading')\n\
  ```\n\n![image](img/4v.jpg)现在，为两个新元素分配文本内容：\n\n```javascript\nitemFour.innerText\
  \ = 'London, England'\nitemFive.innerText = 'Cape Town, South Africa'\n```\n\n![image](img/5v.jpg)然后，将新元素内容作为有序列表元素的子元素插入网页：\n\
  \n```javascript\ndocument.getElementById('list').appendChild(itemFour)\ndocument.getElementById('list').appendChild(itemFive)\n\
  ```\n\n![image](img/6v.jpg)为现有的标题元素添加属性以更改其字体颜色：\n\n```javascript\nheading.setAttribute('style',\
  \ 'color:Red')\n```\n\n![image](img/7v.jpg)最后，更改标题以更好地描述扩展后的列表：\n\n```javascript\n\
  heading.innerText = 'Best Five Cities'\n```\n\n![image](img/8v.jpg)再次保存 HTML 文档，然后刷新浏览器以查看新写入的内容\n\
  \n![image](img/pg453_1.jpg)\n\n![image](img/hot.jpg)\n\n可以通过将现有元素指定为 `document.removeChild()`\
  \ 方法的参数来从网页中移除，或者通过将新旧元素指定为 `document.replaceChild()` 方法的参数来替换。\n\n![image](img/hot.jpg)\n\
  \n你可以通过将属性指定作为元素 `removeAttribute()` 方法的参数来移除属性。\n\n## 管理 Cookie\n\n出于安全考虑，JavaScript\
  \ 无法在用户的硬盘上写入普通文件，但它可以写入“cookie”文件来存储少量数据。这些文件的大小限制为最大 4KB，数量限制为每个 Web 服务器 20 个。通常，存储在\
  \ cookie 中的数据将用于在用户后续访问网站时识别用户。\n\n![image](img/pg454_1.jpg)\n\nCookie 数据存储在 DOM\
  \ `document` 对象的 `cookie` 属性中，格式为一个或多个“key=value”对，并以“;”分号字符结束。值不应包含空格、逗号或分号，除非作为内置函数\
  \ `encodeURI()`的参数传递，该函数会将字符串以 Unicode 格式进行编码——例如，这会将一个空格表示为 %20。\n\n默认情况下，cookie\
  \ 的生存期限制为当前浏览器会话，除非在创建 cookie 时通过“expires=date”值对指定了过期日期，该日期值是一个 UTC 字符串。通常，这通过使用带有\
  \ `toUTCString()` 方法转换的 JavaScript `Date` 对象来实现。将现有 cookie 的过期日期设置为过去的时间将删除该 cookie。\n\
  \n从 cookie 中检索数据需要一些字符串操作，以便使用内置的 `decodeURI()` 函数将 Unicode 转换为普通文本（使 %20 再次变为空格），并分离数据的名称和值项。在\
  \ cookie 字符串内部，可以通过指定“=”分号作为 `split()` 方法的参数来分离多个对。同样，可以通过指定=”字符作为 `split()` 方法的参数来分离键和值。同样，当值是用逗号分隔的项目列表时，可以指定逗逗号作为\
  \ `split()` 方法的参数将其作为数组元素分离。\n\n创建一个包含“setter”和“getter”实用函数的外部 JavaScript 文件是有用的，这些函数可以被轻松调用以存储和检索\
  \ cookie 数据。\n\n![image](img/1v.jpg)以一个 setter 函数开始一个 JavaScript 文件，该函数具有 key、value\
  \ 和 expiry 参数：\n\n```javascript\nfunction setCookie(key, value, days) {\n  const\
  \ d = new Date()\n  d.setTime(d.getTime() + (days * 86400000))\n  document.cookie\
  \ = key + '=' + encodeURI(value) +\n  ';expires=' + d.toUTCString() + ';'\n}\n```\n\
  \n![image](img/jsv.jpg)\n\ncookie.js\n\n![image](img/snake.jpg)\n\ncookie 的过期日期通常无法被\
  \ JavaScript 读取。如果需要可读，请将其添加到 cookie 值列表中。\n\n![image](img/hot.jpg)\n\n此处设置 cookie\
  \ 过期的数字是毫秒数。\n\n![image](img/2v.jpg)然后，添加一个 getter 函数来接受 key 参数：\n\n```javascript\n\
  function getCookie(key) {\n  if (document.cookie) {\n    const pairs = decodeURI(document.cookie).split(';')\n\
  \    let i, name, value\n    for (i = 0; i < pairs.length; i++) {\n      name =\
  \ pairs[i].split('=')[0].trim()\n      if (name === key) { value = pairs[i].split('=')[1]\
  \ }\n    }\n    return value\n  }\n}\n```\n\n注意这里使用了 `trim()` 方法 方法。\n\n![image](img/3v.jpg)接下来，创建一个空列表并导入\
  \ JavaScript 文件的 HTML 文档：\n\n```html\n<ul id=\"list\"></ul>\n<script src=\"cookie.js\"\
  ></script>\n```\n\n![image](img/htmlv.jpg)\n\ncookie.html\n\n![image](img/4v.jpg)现在，在另一个\
  \ `<script>` 元素中，创建一个自执行函数来设置 cookie 然后获取其值：\n\n```javascript\nsetCookie('User','Mike\
  \ McGrath,12345', 7)\nconst list = document.getElementById('list')\nlet i, value\
  \ = getCookie('User')\nif (value.indexOf(',')) {\n  value = value.split(',')\n}\n\
  for (i = 0; i < value.length; i++) {\n  list.innerHTML += '<li>' + value[i]\n}\n\
  ```\n\n![image](img/5v.jpg)将 HTML 文档和 JavaScript 文件保存在 Web 服务器的同一文件夹中，然后在浏览器中打开网页以查看检索到的\
  \ cookie 值\n\n![image](img/pg455_1.jpg)\n\n![image](img/forget.jpg)\n\n通过将过期日期设置为当前实际日期之前的日期可以删除\
  \ cookie。\n\n## 加载事件\n\n![image](img/pg456_1.jpg)\n\nDOM 允许 JavaScript 响应网页上发生的“事件”，方法是脚本作者提供在特定事件发生时执行的函数。这些函数被称为“事件处理器”，可以响应如下事件：\n\
  \n- **load**: 在页面加载到浏览器中时触发\n- **click**: 在用户点击鼠标按钮时触发\n- **keydown**: 在用户按下键盘时触发\n\
  - **change**: 在用户修改输入字段时触发\n- **submit**: 在用户提交 HTML 表单时触发\n\n\n\n\n\n为了响应加载事件（load\
  \ event），可以通过赋值给 window 对象的 `onload` 属性来指定事件处理器函数名，其使用的语法如下：\n\n`onload=function-name`\n\
  \n或者，也可以将事件名称和事件处理器函数名作为 window 对象的 `addEventListener( )` 方法的参数，但事件名称必须包含在引号内，如下所示：\n\
  \n`addEventListener( ‘load’ , function-name )`\n\nload 事件的事件处理器可能用于检查浏览器的功能，并可以很好地检查\
  \ cookie 数据。\n\n![image](img/1v.jpg)\n创建一个 HTML 文档，其中包含一个段落，该段落有一个指向 cookie 示例的链接，一个空段落，并导入上一个示例中的外部\
  \ JavaScript 文件。\n\n```html\n<p><a href=”cookie.html”>Link</a></p>\n<p id=”info”></p>\n\
  <script src=”cookie.js”></script>\n```\n\n![image](img/htmlv.jpg)\n\nload.html\n\
  \n![image](img/2v.jpg)\n接下来，在 script 元素中，指定一个事件处理器函数，在页面加载后执行。\n\n```javascript\n\
  addEventListener( ‘load’, welcome )\n```\n\n![image](img/hot.jpg)\n\n还有一个 unload\
  \ 事件，它在用户离开页面时触发。它的事件处理器可以通过赋值给 `window.onunload` 属性来指定，也可以指定到 `addEventListener(\
  \ )` 方法中。\n\n![image](img/3v.jpg)\n现在，添加事件处理器函数来问候用户。\n\n```javascript\nfunction\
  \ welcome( ) {\n  const info = document.getElementById( ‘info’ )\n  if( getCookie(\
  \ ‘Name’ ) )\n  {\n    info.innerHTML = ‘Welcome Back, ‘ + getCookie( ‘Name’ )\n\
  \  }\n  else\n  {\n    let name = prompt( ‘Please Enter Your Name’, ‘User’ )\n \
  \   setCookie( ‘Name’, name, 7 )\n    info.innerHTML = ‘Welcome, ‘ + name\n  }\n\
  }\n```\n\n![image](img/forget.jpg)\n\n`prompt( )` 方法的第二个参数是默认输入值。\n\n![image](img/4v.jpg)\n\
  保存 HTML 文档并在浏览器中打开它 – 输入你的名字，点击链接，然后点击后退按钮。\n\n![image](img/pg457_1.jpg)\n![image](img/pg457_2.jpg)\n\
  ![image](img/pg457_3.jpg)\n![image](img/pg457_4.jpg)\n\n## 鼠标事件\n\n当用户点击 HTML 文档中的特定对象时执行的事件处理器函数，可以通过将函数名赋值给对象的\
  \ `onclick` 和 `ondblclick` 属性来指定。这些属性响应于用户点击一次鼠标键时触发的“click”事件，以及用户快速连续两次鼠标键时触发的“dblclick”事件。\n\
  \n![image](img/pg458_1.jpg)\n\n此外，对象的 `onmousedown` 和 `onmouseup` 属性可以指定事件处理器函数，在鼠标键被按下时执行（触发“mousedown”事件），在鼠标键释放时执行（触发“mouseup”事件）。\n\
  \n同样，对象的 `onmouseover` 和 `onmouseout` 属性可以指定事件处理器函数，在鼠标悬停在元素上时执行（触发“mouseover”事件），在鼠标移出元素时执行（触发“mouseout”事件）。这些通常用于创建鼠标悬停效果，例如将该元素的\
  \ `style.background` 值更改为不同的颜色。\n\n或者，可以将事件名称和事件处理器函数名作为该对象的 `addEventListener(\
  \ )` 方法的参数。它的用法可以像 window 对象的 `addEventListener( )` 方法一样，通过名称指定函数，或者你也可以作为第二个参数内联一个函数定义。当事件发生时，可以将一个事件对象传递给事件处理器函数。该对象有一个\
  \ `type` 属性，用于识别该事件的名称。\n\n![image](img/1v.jpg)\n创建一个包含两个段落和一个按钮的 HTML 文档。\n\n```html\n\
  <p id=”box”>Target</p>\n<p id=”info”>Place Mouse Over</p>\n<button id=”btn”>Click\
  \ Me</button>\n```\n\n![image](img/htmlv.jpg)\n\nmouse.html\n\n![image](img/2v.jpg)\n\
  接下来，在 script 元素中，创建一个自执行函数，从初始化两个变量开始。\n\n```javascript\nfunction ( ) {\n  const\
  \ box = document.getElementById( ‘box’ )\n  const btn = document.getElementById(\
  \ ‘btn’ )\n  // 在此处插入语句。\n}()\n```\n\n![image](img/hot.jpg)\n\nHTML 文档中的任何可见对象都可以为其\
  \ `click` 事件分配事件处理器，以便该对象可以像按钮一样工作。大多数开发者倾向于使用 `addEventListener( )` 方法来指定事件处理器函数，而不是赋值给\
  \ `onclick` 属性。\n\n![image](img/3v.jpg)\n现在，插入语句来指定内联事件处理器，这些处理器会将参数传递给第二个函数。\n\n\
  ```javascript\nbox.addEventListener( ‘mouseover’, function ( event ) { reactTo(\
  \ event, ‘Red’ } )\nbox.addEventListener( ‘mouseout’, function ( event ) { reactTo(\
  \ event, ‘Purple’ } )\nbox.addEventListener( ‘mousedown’, function ( event ) { reactTo(\
  \ event, ‘Green’ } )\nbox.addEventListener( ‘mouseup’, function ( event ) { reactTo(\
  \ event, ‘Blue’ } )\nbtn.addEventListener( ‘click’, function ( event ) { reactTo(\
  \ event, ‘Orange’ } )\n```\n\n![image](img/4v.jpg)\n最后，添加一个函数来显示事件类型并更改第一个段落的背景颜色。\n\
  \n```javascript\nfunction reactTo( event, color ) {\n  document.getElementById(\
  \ ‘box’ ).style.background = color\n  document.getElementById( ‘info’ ).innerText\
  \ = event.type\n}\n```\n\n![image](img/5v.jpg)\n保存 HTML 文档并在浏览器中打开，然后使用鼠标查看事件和响应。\n\
  \n![image](img/pg459_1.jpg)\n![image](img/pg459_2.jpg)\n![image](img/pg459_3.jpg)\n\
  ![image](img/pg459_4.jpg)\n![image](img/pg459_5.jpg)\n![image](img/snake.jpg)\n\n\
  如果移除一个带有事件处理器的对象，应该移除其事件处理器以防止内存泄漏。\n\n## 事件值\n\n除了示例）中描述的鼠标事件外，还有一个“mousemove”事件。它可以将事件对象传递给事件处理器，该对象的\
  \ `x` 和 `y` 属性包含鼠标指针的当前坐标。\n\n![image](img/pg460_1.jpg)\n\n还有一个“keydown”事件，在用户首次按下按键时触发，“keypress”事件在按键被按下时触发，以及“keyup”事件在按键释放时触发。这些事件都可以将事件对象传递给事件处理器，该对象有一个\
  \ `type` 属性识别事件名称，有一个 `keyCode` 属性存储按键的数值值。\n\n按键的数值值是其 Unicode 值，可以作为 `String.fromCharCode(\
  \ )` 方法的参数将其转换为字符值。\n\n事件处理器函数可以指定 `onmousemove`、`onkeydown`、`onkeypress` 和 `onkeyup`\
  \ 属性，或者作为对象的 `addEventListener( )` 方法的参数。\n\n![image](img/1v.jpg)\n创建一个包含空段落的 HTML\
  \ 文档。\n\n```html\n<p id=”info”></p>\n```\n\n![image](img/htmlv.jpg)\n\nvalues.html\n\
  \n![image](img/2v.jpg)\n接下来，在 script 元素中，创建一个自执行函数，为三个事件指定事件处理器函数并将事件参数传递给该函数。\n\
  \n```javascript\nfunction ( ) {\n  document.addEventListener( ‘keydown’, function\
  \ ( event ){ reactTo( event ) } )\n  document.addEventListener( ‘keyup’, function\
  \ ( event ){ reactTo( event ) } )\n  document.addEventListener( ‘mousemove’, function\
  \ ( event ){ reactTo( event ) } )\n} ( ) )\n```\n\n![image](img/3v.jpg)\n现在，用一个初始化变量的语句开始事件处理器函数。\n\
  \n```javascript\nfunction reactTo( event ) {\n  const info = document.getElementById(\
  \ ‘info’ )\n  // 在此处插入语句。\n}\n```\n\n\n\n\n\n![image](img/4v.jpg)然后，插入语句显示鼠标指针在当前窗口中的坐标值。\n\
  \n```javascript\nif( event.type === ‘mousemove’ )\n{\n  info.innerHTML = ‘Mouse\
  \ pointer is at X:’ + event.x + ‘ Y:’ + event.y\n}\n```\n\n![image](img/5v.jpg)接下来，添加语句在按下键盘键时显示其\
  \ Unicode 值。\n\n```javascript\nif( event.type === ‘keydown’ )\n{\n  info.innerHTML\
  \ += ‘<hr>’ + event.type\n  info.innerHTML += ‘: ‘ + event.keyCode\n}\n```\n\n![image](img/6v.jpg)最后，添加语句在释放键盘键时显示该键的字符。\n\
  \n```javascript\nif( event.type === ‘keyup’ )\n{\n  info.innerHTML += ‘<br>’ + event.type\
  \ + ‘: ‘ +\n  String.fromCharCode( event.keyCode ) + ‘<hr>’\n}\n```\n\n![image](img/7v.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它，并在窗口上移动鼠标，观察坐标值随鼠标移动而变化。\n\n![image](img/pg461_1.jpg)\n\n![image](img/8v.jpg)按下任何字母数字键盘键，查看该键的\
  \ Unicode 数字和字符值。\n\n![image](img/snake.jpg)\n\n`keydown` 和 `keyup` 事件作用于所有键盘键，但\
  \ `keypress` 仅作用于字母数字键。\n\n![image](img/forget.jpg)\n\n即使事件处理程序绑定到 `document` 对象以外的对象对象，坐标值始终与窗口位置相关。\n\
  \n## 复选框 (Check Boxes)\n\n单选按钮组允许用户从组中选择任意一个按钮，该组中所有单选按钮输入元素的 HTML `name` 属性共享相同的名称。在脚本术语中，该组名称是一个数组的名称，可以使用其数组索引值来引用每个单选按钮对象。\n\
  \n![image](img/pg462_1.jpg)\n\n与单选按钮组不同，复选框按钮组允许用户选择组中的一个或多个按钮。但与单选按钮组一样，每个 `name`\
  \ 属性共享相同的组名。该组名也是一个数组的名称，可以通过其数组索引值引用每个复选按钮对象。\n\n单选按钮对象和复选框按钮对象都有 `checked` 布尔属性，当按钮被选中时为\
  \ `true`，否则为 `false`。通过遍历按钮组数组来检查每个对象的 `checked` 属性，可以确定哪些按钮被选中。脚本语句也可以为按钮的 `checked`\
  \ 属性分配 `true` 值以选中它。\n\n![image](img/1v.jpg)创建一个包含有三个复选框组和一个提交按钮的表单的 HTML 文档\n\n\
  ```html\n<form id=”pizza” action=”echo.pl” method=”POST\">\n  <fieldset>\n    <legend>Select\
  \ Pizza Toppings</legend>\n    <input type=”checkbox” name=”Top” value=”Cheese”>Cheese\n\
  \    <input type=”checkbox” name=”Top” value=”Ham”>Ham\n    <input type=”checkbox”\
  \ name=”Top” value=”Peppers”>Peppers\n  </fieldset>\n  <input type=\"submit”>\n\
  </form>\n```\n\n![image](img/htmlv.jpg)\n\ncheckbox.html\n\n![image](img/2v.jpg)接下来，在脚本元素中创建一个自执行函数，为表单的“submit”事件指定一个事件处理函数并检查一个复选框\n\
  \n```javascript\n( function ( ) {\n  const form = document.getElementById( ‘pizza’\
  \ )\n  form.addEventListener( ‘submit’, function ( event ) { reactTo( form, event\
  \ ) } )\n  form.Top[ 0 ].checked = true\n} ) ( )\n```\n\n![image](img/hot.jpg)\n\
  \n当复选框按钮组中的多个按钮被选中时，它们的值将以逗号分隔列表的形式提交。\n\n![image](img/3v.jpg)现在，通过声明三个变量和一个循环开始编写事件处理函数，以确定哪些框被选中。\n\
  \n```javascript\nfunction reactTo( form, event ) {\n  let i, ok, summary = ‘’\n\
  \  for( i = 0 ; i < form.Top.length ; i++ )\n  {\n    if( form.Top[ i ].checked\
  \ )\n    {\n      summary += form.Top[ i ].value + ‘ ‘\n    }\n  }\n  // 在此处插入语句。\n\
  }\n```\n\n![image](img/4v.jpg)然后，添加语句确认选择并将其提交到 Web 服务器，或取消提交。\n\n```javascript\n\
  ok = confirm( ‘Submit These Choices?\\n’ + summary )\nif( !ok ) { event.preventDefault(\
  \ ) }\n```\n\n![image](img/5v.jpg)将 HTML 文档保存到 Web 服务器，然后在浏览器中打开，做出选择，然后确认提交。\n\n\
  ![image](img/pg463_1.jpg)\n\n![image](img/pg463_2.jpg)\n\n![image](img/pg463_3.jpg)\n\
  \n![image](img/pyv.jpg)\n\necho.pl\n\n![image](img/hot.jpg)\n\n当表单按钮被点击时，它会触发表单的默认\
  \ `event` 操作，即将表单数据提交到 Web 服务器。调用表单事件的 `preventDefault()` 方法可以停止表单数据的提交。\n\n![image](img/forget.jpg)\n\
  \n此示例在本地 Web 服务器上运行，脚本处理表单提交并为浏览器提供响应。\n\n## 下拉选项 (Select Options)\n\n在 HTML `<select>`\
  \ 标签中呈现的选项在 DOM 中由 `options[]` 数组唯一表示，该数组中的每个元素由 `<option>` 标签指定。在提交时，`<select>`\
  \ 标签分配的 `name` 属性以名称=值对的形式发送。\n\n![image](img/pg64_1)\n\n重要的是，列表对象有一个 `selectedIndex`\
  \ 属性，它包含当前选中 `options[]` 元素的索引数字。当用户更改列表中的选中选项时，会触发“change”事件。列表对象的 `onchange` 属性可以指定当选项更改时执行的事件处理函数。或者，可以将事件名称和事件处理函数作为参数传递给列表\
  \ `addEventListener()` 方法。\n\n![image](img/1v.jpg)创建一个包含表单列表、提交按钮和一个空段落的 HTML 文档\n\
  \n```html\n<form action=”echo.py” method=”POST\">\n  <select id=”list” name=”City\"\
  >\n    <option value=”Rome” selected>Rome</option>\n    <option value=”London”>London</option>\n\
  \    <option value=”New York”>New York</option>\n  </select>\n  <input type=\"submit”>\n\
  </form>\n<p id=”info”></p>\n```\n\n![image](img/htmlv.jpg)\n\noptions.html\n\n![image](img/2v.jpg)接下来，在脚本元素中创建一个自执行函数，为表单的“submit”事件和窗口的“load”事件指定事件处理函数。\n\
  \n```javascript\n( function ( ) {\n  const list = document.getElementById( ‘list’\
  \ )\n  list.addEventListener( ‘change’, function ( event ) { reactTo( list, event\
  \ ) } )\n  addEventListener( ‘load’, function ( event ) { reactTo( list, event )\
  \ } )\n} ) ( )\n```\n\n![image](img/forget.jpg)\n\n注意，HTML `selected` 属性选中了第一个选项元素，它在\
  \ DOM 中由 `options[0]` 表示。\n\n![image](img/3v.jpg)现在，添加事件处理函数，它将在段落中显示事件和当前的列表选择。\n\
  \n```javascript\nfunction reactTo( list, event ) {\n  const info = document.getElementById(\
  \ ‘info’ )\n  let index = list.options.selectedIndex\n  let city = list.options[\
  \ index ].value\n  info.innerHTML = event.type + ‘<br>Selected: ‘\n  info.innerHTML\
  \ += city + ‘<br>Index: ‘ + index\n}\n```\n\n层级上，此选中的选项可以使用 `document.forms[0].elements[0].options[1].value`\
  \ 来引用——这是 DOM 的最深层。\n\n\n\n\n事件处理程序可以指定给表单文本输入对象和文本对象的 `onfocus` 和 `onfocusout`\
  \ 属性，以识别激活元素。当用户选择文本字段时，会触发“focus”事件；当用户离开该文本字段时，会触发“focusout”事件。\n\n![image](img/pg466_1.jpg)\n\
  \n很有用处的是，事件处理程序可以指定给表单对象的 `onreset` 属性，当表单通过重置按钮恢复原始状态时，移除与表单输入相关的内容。\n\n与其他对象一样，事件名称和事件处理函数名称可以作为参数传递给文本字段和表单对象的\
  \ `addEventListener( )` 方法。\n\n![image](img/1v.jpg)创建一个 HTML 文档，其中包含带有文本字段和重置按钮的表单，以及一个空段落。\n\
  \n```html\n<form id=”code” >\n<input id=”lang” name=”Language” type=”text” >\n<input\
  \ type=”reset”>\n<input type=”submit”>\n</form>\n<p id=”info”></p>\n```\n\n![image](img/htmlv.jpg)\n\
  \nreset.html\n\n![image](img/2v.jpg)接下来，在脚本元素中，创建一个自执行函数，为文本字段的“focus”和“focusout”事件、表单的“reset”事件以及窗口的“load”事件指定事件处理函数。\n\
  \n```javascript\nfunction ( ) {\nconst form = document.getElementById( ‘code’ )\n\
  const lang = document.getElementById( ’lang’ )\nconst info = document.getElementById(\
  \ ‘info’ )\nlang.addEventListener( ‘focus’ ,\nfunction ( event ) { reactTo( event,\
  \ info ) } )\nlang.addEventListener( ‘focusout’ ,\nfunction ( event ) { reactTo(\
  \ event, info ) } )\nform.addEventListener( ‘reset’,\nfunction ( ) { defaultMessage(\
  \ info ) } )\naddEventListener( ‘load’,\nfunction ( ) { defaultMessage( info ) }\
  \ )\n} ) ( )\n```\n\n![image](img/hot.jpg)\n\n文本字段还有一个 `onselect` 属性，可以向其指定事件处理程序，以响应当用户选择部分文本时触发的“select”事件。\n\
  \n![image](img/3v.jpg)现在，为文本字段的“focus”和“focusout”事件添加事件处理函数，以显示事件类型。\n\n```javascript\n\
  function reactTo( event, info ) {\ninfo.innerHTML = event.type\n}\n```\n\n![image](img/4v.jpg)然后，为窗口的“load”和表单的“reset”事件添加事件处理函数，以显示消息。\n\
  \n```javascript\nfunction defaultMessage( info ) {\ninfo.innerHTML =\n‘Please enter\
  \ your favorite coding language’\n}\n```\n\n![image](img/5v.jpg)保存 HTML 文档，然后在浏览器中打开它，查看段落中出现的默认消息。\n\
  \n![image](img/pg467_1.jpg)\n\n![image](img/6v.jpg)选择文本字段查看“focus”事件触发，然后输入你最喜欢的语言名称。\n\
  \n![image](img/pg467_2.jpg)\n\n![image](img/7v.jpg)按下 Tab 键将焦点移动到重置按钮，查看“focusout”事件触发。\n\
  \n![image](img/pg467_3.jpg)\n\n![image](img/8v.jpg)按下 Enter 键（点击重置按钮）清除文本字段，并再次看到默认消息。\n\
  \n![image](img/pg467_4.jpg)\n\n## 验证表单\n\n表单对象的 `onsubmit` 属性可以指定一个事件处理函数，在表单提交到\
  \ Web 服务器进行处理之前验证用户输入到表单的内容。或者，可以将“submit”事件名称和事件处理函数名称作为参数传递给表单对象的 `addEventListener(\
  \ )` 方法。\n\n![image](img/pg468_1.jpg)\n\n最简单的表单验证是检查需要输入项的文本输入框，以确保用户已进行输入。当其值仍为空字符串时，说明未进行任何输入，因此验证函数可以调用\
  \ `event.preventDefault( )` 方法阻止表单提交。\n\n更高级的表单验证可以检查用户输入的字符串，以确保其符合预期格式。例如，在期望电子邮件地址的情况下，格式要求字符串必须包含一个“@”字符和至少一个“.”字符。如果缺少其中任何一个，则该字符串不是有效的电子邮件地址，因此验证函数可以阻止表单提交。\n\
  \n可以通过在表单的 `elements[ ]` 数组括号中引用其名称属性值来引用表单元素。\n\n![image](img/1v.jpg)创建一个 HTML\
  \ 文档，其中包含带有两个文本字段和一个提交按钮的表单。\n\n```html\n<form id=”contact” action=”echo.pl” method=”POST”>\n\
  <fieldset>\n<legend>Please Enter Your Details</legend>\nName: <input type=”text”\
  \ name=”Name” value=””>\n<br><br>\nEmail: <input type=”text” name=”Email” value=””>\n\
  </fieldset>\n<input type=”submit”>\n</form>\n```\n\n![image](img/htmlv.jpg)\n\n\
  validate.html\n\n![image](img/2v.jpg)接下来，在脚本元素中，创建一个自执行函数，为表单的“submit”事件指定事件处理函数。\n\
  \n```javascript\nfunction ( ) {\nconst form = document.getElementById( ‘contact’\
  \ )\nform.addEventListener( ‘submit’ ,\nfunction ( event ) {\nlet name = form.elements[‘Name’].value\n\
  if (name === ‘’ ) {\nalert( ‘Please Enter Name’ )\nevent.preventDefault( )\n}\n\
  let email = form.elements[‘Email’].value\nif (email === ‘’ || email.indexOf(@’)\
  \ === -1 ) {\nalert( ‘Please Enter Valid Email’ )\nevent.preventDefault( )\n}\n\
  })\n} ( )\n```\n（注：validate.html 的脚本文本是碎片化的；根据上下文重构了逻辑）：\n\n```javascript\nfunction\
  \ ( ) {\nconst form = document.getElementById( ‘contact’ )\nform.addEventListener(\
