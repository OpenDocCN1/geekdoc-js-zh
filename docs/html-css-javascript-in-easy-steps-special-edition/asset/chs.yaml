  \ 6 ) { str += ‘ - ‘ }\n}\n```\n![image](img/5o.jpg)最后，添加一个语句输出字符串变量\n\n```javascript\n\
  console.log( str )\n```\n![image](img/6o.jpg)保存 HTML 文档，然后在浏览器中打开并启动控制台，以查看范围内的唯一随机数选择\n\
