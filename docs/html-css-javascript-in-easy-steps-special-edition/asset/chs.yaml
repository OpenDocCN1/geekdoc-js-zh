  \necho.py\n\n## 总结\n\n- `document` 对象拥有 `title`、`URL`、`domain`、`lastModified` 和\
  \ `referrer` 属性，用于描述文档。\n- `document` 对象拥有 `forms`、`images`、`links`、`styleSheets`\
  \ 和 `scripts` 子对象，它们是文档数组。\n- `forms` 数组代表 `<form>` 标签，并有一个 `elements` 子对象，它是表单组件数组。\n\
  - `document` 对象拥有 `getElementById( )`、`getElementsByTagName( )` 和 `getElementsByClassName(\
  \ )` 方法，可以引用 HTML 元素。\n- document 对象的 `innerHTML` 和 `innerText` 属性可以向现有元素写入内容。\n\
  - `document` 对象拥有 `createElement( )`、`appendChild( )` 和 `setAttribute( )` 方法，可以向文档添加内容。\n\
  - `document` 对象的 `cookie` 属性拥有“key=value”键对，可以在用户系统上存储少量数据。\n- `encodeURI( )`、`decodeURI(\
  \ )`、`toUTCString( )` 和 `split( )` 函数用于 cookie 数据的字符串操作。\n- DOM 允许 JavaScript 根据用户操作响应\
  \ `load`、`click`、`keydown`、`change` 和 `submit` 等事件。\n- 事件处理函数可以赋值给对象属性，或通过 `addEventListener(\
  \ )` 方法指定。\n- 事件对象可以传递给事件处理函数，并可以通过其 `event.type` 属性识别事件。\n- `mousemove` 事件对象拥有\
  \ `x` 和 `y` 属性，包含指针的当前窗口坐标。\n- 单选按钮和复选框对象拥有 `checked` 布尔属性，只有在按钮被选中时才为真。\n- 选择列表对象拥有\
  \ `selectedIndex` 属性，包含当前选中的 `options[ ]` 元素的索引数字。\n- 表单提交事件有一个 `preventDefault(\
  \ )` 方法，可以调用以阻止表单提交到 Web 服务器。\n\n\n\n\n![image](http://www.ineasysteps.com)\n"
