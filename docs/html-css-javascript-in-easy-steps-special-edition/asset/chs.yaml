  \ |\n\n## 存储值\n\n![image](img/pg326_1.jpg)\n\n\n\n\n“变量”是一个容器，在所有脚本语言和编程语言中通用的，可以在其中存储数据并在稍后检索。与大多数其他语言中的“强类型”变量不同（这些变量必须声明它们可能包含的特定数据类型），JavaScript\
  \ 变量的使用简单得多，因为它们是“弱类型”的——所以它们可以包含任何类型的数据：\n\n| 数据类型 | 示例 | 描述 |\n| :--- | :--- |\
  \ :--- |\n| String | `'Hello World!'` | 文本字符串 |\n| Number | `3.142` | 整数或浮点数 |\n\
  | Boolean | `true` | 真 (1) 或假 (0) 值 |\n| Object | `console` | 用户定义的对象或内置对象 |\n|\
  \ Function | `log( )` | 用户定义的函数、内置函数或对象方法 |\n| Symbol | `Symbol( )` | 唯一的属性标识符 |\n\
  | null | `null` | 绝对的无（甚至不是 0） |\n| undefined | `undefined` | 未配置的属性 |\n\nJavaScript\
  \ 变量可以使用 `let`、`const` 或 `var` 关键字声明，后面跟着一个空格和你自定义的名称。用 `let` 声明的变量可以在脚本执行过程中重新赋予新值，而\
  \ `const`（常量）则不允许这样做。`var` 关键字在 `let` 关键字引入之前就被用于 JavaScript，但现在最好避免使用，因为它无法防止你在同一上下文中重复声明同一个变量。\n\
  \n脚本中的 `let` 变量声明可能仅仅是创建一个稍后可以赋值的变量，也可能包含一个赋值操作以用一个值立即“初始化”变量：\n\n```javascript\n\
  let myNumber // 声明一个变量。\nmyNumber = 10// 初始化一个变量。\nlet myString = ‘Hello World!’\
  \ // 声明并初始化一个变量。\n```\n\n也可以在一行内声明多个变量：\n\n```javascript\nlet i , j , k // 声明 3\
  \ 个变量。\nlet num =10 , char = ‘C’ // 声明并初始化 2 个变量。\n```\n\n常量在声明时必须初始化：\n\n```javascript\n\
  const myName = ‘Mike’\n```\n\n![image](img/forget.jpg)变量名是其所包含值的别名——在脚本中使用该名称将引用其存储的值。\n\
  \n![image](img/hot.jpg)\n\n为你的变量选择有意义的名称，以便以后更容易理解脚本。\n\n初始化时，JavaScript 会自动为赋值的值设置变量类型。稍后在脚本中赋值不同的数据类型可以更改变量类型。可以使用\
  \ `typeof` 关键字显示当前的变量类型。\n\n![image](img/1b.jpg)创建一个 HTML 文档，其中脚本声明了几个分配了不同数据类型的变量\n\
  \n```javascript\nconst firstName = ‘Mike’\nconst valueOfPi = 3.142\nlet isValid\
  \ = true\nlet jsObject = console\nlet jsMethod = console.log\nlet jsSymbol = Symbol(\
  \ )\nlet emptyVariable = null\nlet unusedVariable\n```\n\n![image](img/htmlb.jpg)\n\
  variables.html\n\n![image](img/2b.jpg)添加语句来输出每个变量的数据类型\n\n```javascript\nconsole.log(\
  \ ‘firstName: ‘ + typeof firstName )\nconsole.log( ‘valueOfPi: ‘ + typeof valueOfPi\
  \ )\nconsole.log( ‘isValid: ‘ + typeof isValid )\nconsole.log( ‘jsObject: ‘ + typeof\
  \ jsObject )\nconsole.log( ‘jsMethod: ‘ + typeof jsMethod )\nconsole.log( ‘jsSymbol:\
  \ ‘ + typeof jsSymbol )\nconsole.log( ‘emptyVariable: ‘ + typeof emptyVariable )\n\
  console.log( ‘unusedVariable: ‘ + typeof unusedVariable )\n```\n\n![image](img/3b.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它并启动控制台查看输出中的数据类型\n\n![image](img/pg327_1.jpg)\n\n![image](img/hot.jpg)这里使用拼接运算符\
  \ `+` 来输出一个组合的文本字符串。\n\n![image](img/snake.jpg)你会惊讶地发现赋值 `null` 值的变量被描述为 `object`\
  \ 类型，而不是 `null` 类型。这是 JavaScript 语言中的一个已知错误。\n\n## 创建函数\n\n函数表达式简单来说是在 `{ }` 大括号中分组执行的一条或多条语句，并返回一个最终的单一值。可以根据脚本需要调用函数来执行其语句。属于对象的函数（例如\
  \ `console.log( )`）被称为“方法”——以将其与内置函数和自定义函数区分开来。两者都有尾随括号，可以接受“参数”值并传递给函数进行处理——例如，传递到\
  \ `console.log( )` 方法括号中的参数。\n\n![image](img/pg328_1.jpg)传递给函数的参数数量通常必须与函数块声明括号内指定的“参数”数量匹配。例如，一个需要恰好一个参数的自定义函数看起来如下：\n\
  \n```javascript\nfunction *function-name* ( *parameter* ) {\n  // 在此处编写执行的语句。\n\
  }\n```\n\n可以以逗号分隔列表的形式指定多个参数，你可以可选地指定一个在函数调用未传递参数时使用的默认值，如下：\n\n```javascript\n\
  function *function-name* ( *parameter* = *value* ) {\n  // 在此处编写执行的语句。\n}\n```\n\
  \n变量名是其所包含值的别名——在脚本中使用名称将引用其存储的值。\n\n![image](img/hot.jpg)为你的变量选择有意义的名称以便以后更容易理解脚本。\n\
  \n初始化后，JavaScript 会自动为赋值的值设置变量类型。稍后在脚本中赋值不同的数据类型可以更改变量类型。可以使用 `typeof` 关键字显示当前的变量类型。\n\
  \n![image](img/1b.jpg)创建一个 HTML 文档，其中脚本声明了几个分配了不同数据类型的变量\n\n```javascript\nconst\
  \ firstName = ‘Mike’\nconst valueOfPi = 3.142\nlet isValid = true\nlet jsObject\
  \ = console\nlet jsMethod = console.log\nlet jsSymbol = Symbol( )\nlet emptyVariable\
  \ = null\nlet unusedVariable\n```\n\n![image](img/htmlb.jpg)\nvariables.html\n\n\
  ![image](img/2b.jpg)添加语句来输出每个变量的数据类型\n\n```javascript\nconsole.log( ‘firstName:\
  \ ‘ + typeof firstName )\nconsole.log( ‘valueOfPi: ‘ + typeof valueOfPi )\nconsole.log(\
  \ ‘isValid: ‘ + typeof isValid )\nconsole.log( ‘jsObject: ‘ + typeof jsObject )\n\
  console.log( ‘jsMethod: ‘ + typeof jsMethod )\nconsole.log( ‘jsSymbol: ‘ + typeof\
  \ jsSymbol )\nconsole.log( ‘emptyVariable: ‘ + typeof emptyVariable )\nconsole.log(\
  \ ‘unusedVariable: ‘ + typeof unusedVariable )\n```\n\n![image](img/3b.jpg)保存 HTML\
  \ 文档，然后在浏览器中打开它并启动控制台查看输出中的数据类型\n\n![image](img/pg327_1.jpg)\n\n![image](img/hot.jpg)这里使用拼接运算符\
  \ `+` 来输出一个组合的文本字符串。\n\n![image](img/snake.jpg)你会惊讶地发现赋值 `null` 值的变量被描述为 `object`\
  \ 类型，而不是 `null` 类型。这是 JavaScript 语言中的一个已知错误。\n\n## 创建函数\n\n函数表达式简单来说是在 `{ }` 大括号中分组执行的一条或多条语句，并返回一个最终的单一值。可以根据脚本需要调用函数来执行其语句。属于对象的函数（例如\
  \ `console.log( )`）被称为“方法”——以将其与内置函数和自定义函数区分开来。两者都有尾随括号，可以接受“参数”值并传递给函数进行处理——例如，传递到\
  \ `console.log( )` 方法中的参数。\n\n![image](img/pg328_1.jpg)传递给函数的参数数量通常必须与函数块声明括号内指定的“参数”数量匹配。例如，一个需要恰好一个参数的自定义函数看起来如下：\n\
  \n```javascript\nfunction *function-name* ( *parameter* ) {\n  // 在此处编写执行的语句。\n\
  }\n```\n\n可以以逗号分隔列表的形式指定多个参数，你可以可选地指定一个在函数调用未传递参数时使用的默认值，如下：\n\n```javascript\n\
  function *function-name* ( *parameter* = *value* ) {\n  // 在此处编写执行的语句。\n}\n```\n\
  \n变量名是其所包含值的别名——在脚本中使用名称将引用其存储的值。\n\n![image](img/hot.jpg)为你的变量选择有意义的名称以便以后更容易理解脚本。初始化后，JavaScript\
  \ 会自动为赋值的值设置变量类型。稍后在脚本中赋值不同的数据类型可以更改变量类型。可以使用 `typeof` 关键字显示当前的变量类型。\n\n![image](img/1b.jpg)创建一个\
  \ HTML 文档，其中脚本声明了几个分配了不同数据类型的变量\n\n```javascript\nconst firstName = ‘Mike’\nconst\
  \ valueOfPi = 3.142\nlet isValid = true\nlet jsObject = console\nlet jsMethod =\
  \ console.log\nlet jsSymbol = Symbol( )\nlet emptyVariable = null\nlet unusedVariable\n\
  ```\n\n![image](img/htmlb.jpg)\nvariables.html\n\n![image](img/2b.jpg)接下来，添加一个返回相加结果的函数\n\
  \n```javascript\nfunction add ( argOne, argTwo = 10 ) {\n  return argOne + argTwo\n\
  }\n```\n\n![image](img/3b.jpg)现在，通过调用上述每个函数添加一个返回平方和相加结果的函数\n\n```javascript\nfunction\
  \ squareAdd ( arg ) {\n  let result = square( arg )\n  return result + add( arg\
  \ )\n}\n```\n\n![image](img/4b.jpg)最后，添加调用函数并在输出中打印返回值的语句\n\n```javascript\nconsole.log(\
  \ ‘8 x 8: ‘ + square( 8 ) )\nconsole.log( ‘8 + 20: ‘ + add( 8, 20 ) )\nconsole.log(\
  \ ‘8 + 10: ‘ + add( 8 ) )\nconsole.log( ‘(8 x 8) + (8 + 10): ‘ + squareAdd( 8 )\
  \ )\n```\n\n![image](img/forget.jpg)注意，当调用者只传递一个参数值时，这里使用了默认第二个参数值（10）。\n\n![image](img/5b.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它并启动控制台查看函数返回的值\n\n![image](img/pg329_1.jpg)\n\n![image](img/hot.jpg)`*`\
  \ 字符是 JavaScript 中的算术乘法运算符。\n\n## 分配函数\n\n函数在 JavaScript 中非常有用，因为它们可以在需要时被调用（执行）来执行其语句，调用者可以传递不同的参数以返回不同的结果。\n\
  \n\n\n\n![image](img/pg330_1.jpg)\n\n必须认识到，JavaScript 的 `()` 括号运算符是调用语句中实际调用函数的组件。这意味着语句可以通过仅指定函数名来将函数赋值给变量。然后，可以在语句中指定变量名后跟\
  \ `()` 运算符来调用该函数。但请注意，如果你尝试通过指定函数名后跟 `()` 来将函数赋值给变量，那么该函数将被立即调用，并且该函数返回的值将被赋值给变量。\n\
  \n![image](img/hot.jpg)\n\n使用旧的 `var` 关键字声明的变量也会被提升（hoisted），但使用 `let` 或 `const`\
  \ 声明的变量不会被提升。\n\n## 函数提升 (Function Hoisting)\n\n尽管 JavaScript 解释器按从上到下的顺序读取脚本，但它实际上会进行两次扫描。第一次扫描寻找函数声明并记住找到的任何内容，这个过程被称为“提升”。第二次扫描是解释器实际执行脚本的过程。提升允许函数调用在函数声明之前出现在脚本中，因为解释器在第一次扫描时已经识别了该函数。然而，第一次扫描不会识别使用\
  \ `let` 或 `const` 关键字赋值给变量的函数！\n\n## 匿名函数 (Anonymous Functions)\n\n在将函数赋值给变量时，可以省略函数名，因为可以在语句中指定变量名和\
  \ `()` 运算符来调用函数。这些被称为匿名函数表达式，其语法如下：\n\n```\nlet variable = function ( parameters\
  \ ) { statements ; return value }\n```\n\n匿名函数表达式还可以通过将整个函数封装在 `()` 括号内，并在表达式末尾添加\
  \ `()` 括号运算符来变为“自执行的”。这意味着它们的语句在浏览器首次加载脚本时就会自动执行一次。自执行函数表达式的语法如下：\n\n```\n( function\
  \ () { statements ; return value } ) ( )\n```\n\n自执行函数在本书中被广泛使用，用于在脚本加载时执行示例代码。\n\
  \n![image](img/hot.jpg)\n\n自执行函数表达式也称为立即调用函数表达式（IIFE – 读音通常为“iffy”）。\n\n![image](img/1b.jpg)创建一个\
  \ HTML 文档，其中包含一个调用尚未声明的函数的脚本\n\n```javascript\nconsole.log( ‘Hoisted: ‘ + add( 100,\
  \ 200 ) )\n```\n\n![image](img/htmlb.jpg)\n\nanonymous.html\n\n![image](img/2b.jpg)接下来，在上方调用的函数下方添加\n\
  \n```javascript\nfunction add( numOne, numTwo ) {\nreturn numOne + numTwo\n}\n```\n\
  \n![image](img/3b.jpg)现在，添加一个将上述函数赋值给变量并调用被赋值函数的函数\n\n```javascript\nlet addition\
  \ = add\nconsole.log( ‘Assigned: ‘ + addition( 32, 64 ) )\n```\n\n![image](img/4b.jpg)然后，将一个类似的匿名函数赋值给变量并调用该被赋值的函数\n\
  \n```javascript\nlet anon = function ( numOne, numTwo ) {\nlet result = numOne +\
  \ numTwo ; return result\n}\nconsole.log( ‘Anonymous: ‘ + anon( 9, 1 ) )\n```\n\n\
  ![image](img/5b.jpg)最后，将自执行函数返回的值赋值给变量并显示该值\n\n```javascript\nlet iffy = ( function\
  \ () {\nlet str = ‘Self Invoked Output’ ; return str\n} ) ( )\nconsole.log( iffy\
  \ )\n```\n\n![image](img/6b.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台查看函数返回的值\n\n![image](img/pg331_1.jpg)\n\
  \n![image](img/forget.jpg)\n\n在将命名函数赋值给变量时，仅在语句中指定函数名即可。\n\n![image](img/hot.jpg)\n\
  \n自执行函数的意义可能不会立而易见，但到本章结束将会变得清晰。\n\n## 识别作用域 (Recognize Scope)\n\n变量在脚本中的可访问范围取决于它们的“词法作用域”（lexical\
  \ scope）——即变量创建的环境。这可以是“全局的”或“局部”。\n\n![image](img/pg332_1.jpg)\n\n## 全局作用域 (Global\
  \ Scope)\n\n在函数块外部创建的变量可以在整个脚本范围内访问。这意味着它们持续存在，并且同一脚本环境内的函数可以使用。初看这可能非常方便，但它有一个非常严重的缺点，即同名变量可能会冲突。例如，想象你创建了一个赋值为你名字的全局变量\
  \ `myName`，但随后包含了一个外部脚本，另一个开发者在其中创建了一个赋值为他或她名字的全局变量 `myName`。两个同名变量存在同一个脚本环境中，因此产生冲突。最好避免这种情况，因此你不应该在脚本中创建全局变量来存储原始值（除\
  \ Object 和 Function 外的所有数据类型）。\n\n## 局部作用域 (Local Scope)\n\n在函数块内部创建的变量在函数的整个生命周期内可以局部访问。它们只在函数执行时存在，然后就会销毁。它们的脚本环境是有限的——从创建点开始到最后的\
  \ `}` 大括号处，或者函数返回的时刻。在函数块的最开始声明变量是一个良好的习惯，这样它们的词法作用域就是整个函数的持续时间。这意味着同名变量可以在不同的函数中存在而不产生冲突。例如，局部\
  \ `myName` 变量可以愉快地存在于脚本的不同函数中，以及包含的外部脚本的函数中。建议尝试只在脚本中创建局部变量来存储值。\n\n## 最佳实践 (Best\
  \ Practice)\n\n使用旧的 `var` 关键字声明全局变量允许同名的冲突变量在没有警告的情况下覆盖其赋值的值。较新的 `let` 和 `const`\
  \ 关键字禁止了这种行为，并将其识别为“未捕到的语法错误”（Uncaught SyntaxError）。因此，建议创建使用 `let` 或 `const` 关键字声明的变量在脚本中存储值。\n\
  \n![image](img/hot.jpg)\n\n你可以在此处发现如何捕获和处理错误。\n\n![image](img/1b.jpg)创建一个外部脚本，调用函数以输出全局变量的值\n\
  \n```javascript\nlet myName = ‘External Script’\nfunction readName( ) { console.log(\
  \ myName ) }\nreadName( )\n```\n\n![image](img/pg333_1.jpg)\n\nexternal.js\n\n![image](img/2b.jpg)创建一个包含外部脚本并添加类似脚本的\
  \ HTML 文档\n\n```html\n<script src=\"external.js\"></script>\n<script>\nlet myName\
  \ = ‘Internal Script’\nfunction getName( ) { console.log( myName ) }\ngetName( )\n\
  </script>\n```\n\n![image](img/htmlb.jpg)\n\nscope.html\n\n![image](img/3b.jpg)将两个文件保存在同一个文件夹中，然后打开\
  \ HTML 文档查看控制台中报告的冲突错误\n\n![image](img/pg333_2.jpg)\n\n![image](img/4b.jpg)编辑两个脚本将全局变量变为局部变量，然后刷新浏览器查看无冲突\n\
  \n```javascript\nfunction readName( ) {\nlet myName = ‘External Script’ ; console.log(\
  \ myName )\n}\nfunction getName( ) {\nlet myName = ‘Internal Script’ ; console.log(\
  \ myName )\n}\n```\n\n![image](img/pg333_3.jpg)\n\n![image](img/forget.jpg)\n\n\
  函数调用 `readName( )` 和 `getName( )` 保持在脚本中无需修改。\n\n**使用闭包 (Use Closures)**\n\n\n\n\
  \n上一个示例演示了在 JavaScript 中创建全局变量来存储值的危险，但有时你可能希望存储能够持续被访问的值——例如，在脚本执行过程中记住一个不断增加的分数计数。如何在不使用全局变量存储原始值的情况下实现这一点？答案在于使用“闭包”。\n\
  \n![image](img/pg334_1.jpg)\n\n闭包是一个嵌套在外部函数内部函数，它保留了对外部函数中声明变量的访问——因为这是嵌套函数创建时的词法作用域。\n\
  \n![image](img/1b.jpg)创建一个 HTML 文档，其中脚本将一个自执行匿名函数赋值给全局变量\n\n```javascript\nconst\
  \ add = ( function ( ) {\n  // 在此处插入语句。\n} ) ( )\n```\n\n![image](img/htmlb.jpg)\n\
  \nclosure.html\n\n![image](img/2b.jpg)接下来，插入语句初始化局部变量并在同一作用域内将函数赋值给局部变量\n\n```javascript\n\
  let count = 0\nconst nested = function ( ) { return count = count + 1 }\n```\n\n\
  ![image](img/3b.jpg)现在，插入一条语句返回内部函数——将内部函数赋值给全局变量\n\n```javascript\nreturn nested\n\
  ```\n\n![image](img/4b.jpg)最后，对已赋值给全局变量的内部函数添加三次相同的函数调用\n\n```javascript\nconsole.log(\
  \ ‘Count is ‘ + add( ) )\nconsole.log( ‘Count is ‘ + add( ) )\nconsole.log( ‘Count\
  \ is ‘ + add( ) )\n```\n\n![image](img/5b.jpg)保存 HTML 文档，然后在浏览器中打开并启动控制台，查看从闭包返回的值\n\
  \n![image](img/pg334_2.jpg)\n\n![image](img/forget.jpg)\n\n自执行函数表达式的描述可见此处。它们只执行一次语句。在这里，你可以使用\
  \ `console.log( add )` 来确认函数表达式已赋值给外部变量。\n\n理解闭包的概念可能困难，因为看起来这个示例中的 `count` 变量在自执行函数执行完毕后应该被销毁。为了更好地理解闭包的工作原理，你可以探索所赋值函数的\
  \ `prototype` 属性。\n\n![image](img/6b.jpg)在脚本末尾添加一条语句以显示赋值函数内部是如何构建的\n\n```javascript\n\
  console.log( add.prototype )\n```\n\n![image](img/7b.jpg)保存 HTML 文档，然后刷新浏览器并展开“constructor”下拉列表以查看作用域\n\
  \n![image](img/pg335_1.jpg)\n\n仔细检查发现，赋值的函数除了普通的局部（脚本）作用域和外部（全局）作用域外，还有一个特殊的（闭包）作用域。这就是为什么\
  \ `count` 变量可以通过赋值函数保持可访问，而且，它无法通过任何其他方式被引用。\n\n使用闭包从脚本的其他部分隐藏持久变量是一个重要概念。这类似于在其他编程语言中隐藏“私有”变量的方法，它们只能通过“getter”方法访问。\n\
  \n![image](img/hot.jpg)\n\n所有 JavaScript 对象都从一个 `prototype` 继承属性和方法。标准 JavaScript\
  \ 对象（如函数）调用内部构造函数通过定义其组件来创建对象。\n\n![image](img/hot.jpg)\n\n如果你不能立即理解闭包的工作原理，不要担心。它们初看起来可能很神秘，但随着经验的增加会变得清晰。你可以继续后续，稍后再回来此技术。\n\
  \n## 总结\n\n- JavaScript 代码可以直接包含在 HTML 文档中，也可以使用 `<script> </script>` 标签从外部文件引入。\n\
  - JavaScript 可以在 HTML 元素中的 alert 对话框或浏览器控制台窗口中显示输出。\n- JavaScript 语句可能包含关键字、运算符、值和表达式。\n\
  - JavaScript 解释器忽略制表符和空格。\n-- JavaScript 语句可以分组在 `{ }` 大括号函数块中，需要时可以调用执行。\n- 变量和函数名可以由字母、数字和下划线组成，但必须避免关键字。\n\
  - JavaScript 变量可以包含 String、Number、Boolean、Object、Function、Symbol、`null` 和 `undefined`\
  \ 数据类型。\n- 使用 `let` 关键字声明的变量可以重新赋值新值，但 `const` 关键字不允许此操作。\n- 函数表达式具有分组在 `{ }` 大括号中的语句用于执行，并并返回一个最终的单一值。\n\
  - 函数表达式的 `( )` 括号可以包含用于从调用者传递参数值的参数。\n- 函数块可以包含一个 `return` 语句来指定要传回调用者的数据。\n- JavaScript\
  \ 的 `( )` 括号运算符调用函数。\n- 提升（Hoisting）允许函数调用出现在函数声明之前。\n- 匿名函数表达式没有函数名。\n- 词法作用域是变量创建的环境，可以是全局、局部或闭包。\n\
  - 局部变量应用于存储值，但全局变量可以赋值函数以创建闭包。\n- 闭包是一个嵌套在外部函数内部的函数，它保留了对外部函数中声明变量的访问。\n\n| 16 执行有用操作\
  \ | ![image](img/pg337_1.jpg) |\n\n*本章介绍了 JavaScript 运算符，并演示了如何在脚本中使用它们。*\n\n- 转换值\n\
  - 进行算术运算\n- 值赋值\n- 进行比较\n- 评估逻辑\n- 检查条件\n- 处理位操作\n- 强制排序\n- 总结\n\n### 转换值\n\n在 JavaScript\
  \ 中执行操作之前，识别你正在处理的值的数据类型非常重要，以避免意外结果。例如，值 42 是一个数字，但值 ‘42’ 是一个字符串，因此尝试对 ‘42’ + 8\
  \ 进行加法将返回字符串结果 ‘428’，而不是数字 50。幸运的是，JavaScript 提供了多种方法来返回其他数据类型版本的值——而不改变值的原始类型。\n\
  \n![image](img/pg338_1.jpg)\n\n### 字符串转数字\n\nJavaScript `parseInt( )` 内置函数可以返回括号内指定字符串的整数版本（在数字类型中）。例如，`parseInt(\
  \ ‘42’ )` 将返回数字 42，因此 42 + 8 将返回数字结果 50。\n\n同样，JavaScript `parseFloat( )` 内置函数可以返回括号内指定字符串的浮点数版本（在数字类型中）。\n\
  \n这两个方法都允许字母字符出现在指定字符串的数字部分并从结果中去除它们——例如，`parseInt( ‘42nd Street’ )` 返回数字 42。\n\n\
  如果这两个函数任一无法在指定字符串开头找到数值，结果将是 NaN —— 一个表示“不是数字”的 JavaScript 属性。你也可以通过在 JavaScript\
  \ `isNaN( )` 内置函数的括号内指定值来检查该值是否不是数字。这同样会首先尝试在指定值的开头找到数字，如果找到了数字（即使来自指定字符串）则返回 false，否则如果没有找到则返回\
  \ true。\n\n![image](img/hot.jpg)\n\n数据类型的转换被称为“强制转换”（coercion），它可以是显式的也可以是隐式的。当\
  \ ‘42’ + 8 返回字符串 ‘428’ 时，这是隐式转换。当 `String( 42 )` 返回字符串 ‘42’ 时，这是显式转换。\n\n**数字转字符串**\n\
  \n\n\n\n\nJavaScript `String()` 方法可以返回括号内指定的数字的字符串表示形式（即字符串数据类型）——例如，`String( 42\
  \ )` 将将数字‘42’作为字符串数据类型返回。\n\n或者，你也可以在变量名后附加一个 `toString()` 方法调用，以返回存储的数字数据类型的字符串表示。例如，当给一个名为“num”的变量赋值一个数字时，`num.toString()`\
  \ 将返回该存储数字的字符串版本。\n\n![image](img/1r.jpg)创建一个带有自执行匿名函数块的 HTML 文档，并在其中声明三个变量\n\n\
  ```javascript\nfunction ( ) {\n    let sum, net = ‘25’, tax = 5.00\n    // 在此处插入语句。\n\
  } ) ( )\n```\n\n![image](img/htmlr.jpg)\n\nconversion.html\n\n![image](img/2r.jpg)接下来，插入创建不同数据类型版本的语句，并在输出字符串中打印结果：\n\
  \n```javascript\nsum = net + tax\nconsole.log( ‘sum: ‘ + sum + ‘ ‘ + typeof sum\
  \ )\nsum = parseFloat( net ) + tax\nconsole.log( ‘sum: ‘ + sum + ‘ ‘ + typeof sum\
  \ )\nconsole.log( ‘tax: ‘ + tax + ‘ ‘ + typeof tax )\ntax = tax.toString()\nconsole.log(\
  \ ‘tax: ‘ + tax + ‘ ‘ + typeof tax )\nnet = ‘$’ + net\nconsole.log( ‘net: ‘ + net\
  \ + ‘ ‘ + parseInt( net ) )\nconsole.log( ‘net Not a Number? ‘ + isNaN( net ) )\n\
  ```\n\n![image](img/3r.jpg)保存该 HTML 文档，然后在浏览器中打开它并启动控制台查看不同的版本\n\n![image](img/pg339_1.jpg)\n\
  \n![image](img/forget.jpg)\n\n如果你在字符串添加‘$’前缀之前尝试 `isNan( net )`，结果为 `false` —— 因为该方法在‘25’字符串的开头找到了数字。\n\
  \n## 算术运算\n\nJavaScript 中常用的算术运算符列在下表，并包含了它们执行的操作：\n\n![image](img/pg340_1.jpg)\n\
  \n| 运算符 | 操作 |\n| :--- | :--- |\n| + | 数字相加 字符串拼接 |\n| – | 减法 |\n| ***** | 乘法 |\n\
  | /** | 除法 |\n| % | 取模 |\n| ++ | 递增 |\n| – – | 递减 |\n| ****** | 幂 |\n\n语句中指定的数值被称为“操作数”。例如，在语句\
  \ `5 + 2` 中，`+` 运算符提供了五和二作为操作数值。请注意，`+` 运算符会根据操作数的类型执行两种不同的操作。数字操作数被相加以返回总和，而字符串操作数被拼接以返回单个连接后的字符串。\n\
  \n% 取模运算符将第一个操作数除以第二个操作数并返回余数。除以二将返回一或零，从而有用地判断第一个操作数是奇数还是偶数。\n\n`++` 递增运算符和 `--`\
  \ 递减运算符将单个操作数的值改变一并返回新值。这些运算符最常用于计算循环次数，可以通过两种不同的方式使用产生细微不同的效果。当放在操作数之前（前置）时，其值在表达式求值之前立即改变；但当放在操作数之后（后置）时，先求值表达式，然后改变值。\n\
  \n![image](img/hot.jpg)\n\n幂运算符返回第一个操作数提升到第二个操作数幂次的结果。\n\n![image](img/hot.jpg)\n\
  \n使用取模运算符判断奇偶数的示例可以在此处。\n\n![image](img/1r.jpg)创建一个带有自执行匿名函数块的 HTML 文档\n\n```javascript\n\
  function ( ) {\n    // 在此处插入语句。\n} ) ( )\n```\n\n![image](img/htmlr.jpg)\n\narithmetic.html\n\
  \n![image](img/2r.jpg)接下来，插入使用每个算术运算符为变量赋值的语句，并在输出字符串中打印每个结果：\n\n```javascript\n\
  let sum = 80 + 20 ; console.log( ‘Addition: ‘ + sum )\nlet sub = sum - 50 ; console.log(\
  \ ‘Subtraction: ‘ + sub )\nlet mul = sum * 5 ; console.log( ‘Multiplication: ‘ +\
  \ mul )\nlet div = sum / 4 ; console.log( ‘Division: ‘ + div )\nlet mod = sum %\
  \ 2 ; console.log( ‘Modulus: ‘ + mod )\nlet inc = ++sum ; console.log( ‘Increment:\
  \ ‘ + inc )\nlet dec = --sum ; console.log( ‘Decrement: ‘ + dec )\n```\n\n![image](img/3r.jpg)保存该\
  \ HTML 文档，然后在浏览器中打开它并启动控制台查看算术结果\n\n![image](img/pg341_1.jpg)\n\n## 赋值\n\nJavaScript\
  \ 中常用于赋值的运算符都列在下表。除了简单的 `=` 赋值运算符外，所有运算符都是较长表达式的简写形式，因此为了清晰起见，也给出了等效形式。\n\n![image](img/pg342_1.jpg)\n\
  \n| 运算符 | 示例 | 等效形式 |\n| :--- | :--- | :--- |\n| = | a = b | a = b |\n| += | a +=\
  \ b | a = a + b |\n| -= | a -= b | a = a - b |\n| *= | a *= b | a = a * b |\n| /=\
  \ | a /= b | a = a / b |\n| %= | a %= b | a = a % b |\n| ** | a **= b | a = a **\
  \ b |\n\n将 `=` 运算符视为“赋值”而不是“等于”，以避免与 `===` 相等运算符混淆。\n\n`+=` 运算符最适用于追加字符串。例如，通过 `str\
  \ = ‘JavaScript’` 和 `str += ‘ Fun’，变量现在存储了‘JavaScript Fun’。\n\n所有其他赋值运算符的作用都类似于\
  \ `+=` 运算符。它们对操作数执行算术运算，然后将结果赋值给第一个变量。\n\n从数值上说，表格中的 `+=`示例会将 a 中的值加上 b 中的值，然后将总和赋值给新的\
  \ a。\n\n![image](img/1r.jpg)创建一个带有拼接两个字符串的自执行匿名函数的 HTML 文档\n\n```javascript\nfunction\
  \ ( ) {\n    let msg = ‘JavaScript’ ; msg += ‘ Fun’\n    console.log( ‘Add & concatenate:\
  \ ‘ + msg )\n    // 在此处插入语句。\n} ) ( )\n```\n\n![image](img/htmlr.jpg)\n\nassignment.html\n\
  \n![image](img/2r.jpg)接下来，插入使用组合运算符执行算术并赋值结果结果的语句：\n\n```javascript\nlet sum = 5.00\
  \ ; sum += 2.50\nconsole.log( ‘Add & assign decimal: ‘ + sum )\nsum = 8 ; sum -=\
  \ 4\nconsole.log( ‘Subtract & assign integer: ‘ + sum )\nsum = 8 ; sum *= 4\nconsole.log(\
  \ ‘Multiply & assign integer: ‘ + sum )\nsum = 8 ; sum /= 4\nconsole.log( ‘Divide\
  \ & assign integer: ‘ + sum )\nsum = 8 ; sum %= 4\nconsole.log( ‘Modulus & assign\
  \ integer: ‘ + sum )\n```\n\n`===` 相等运算符比较值，可以在此处找到详细解释。\n\n\n\n\n\n`===` 等等运算符比较两个操作数，如果它们完全相等，则返回布尔值\
  \ `true`，否则返回布尔值 `false`。如果操作数是相同的数字，则它们是相等的；如果操作数是包含相同位置上相同字符的字符串，它们是相等的；如果操作数是都是\
  \ `true` 或都是 `false` 的布尔值，它们是相等的。相反，`!==` 不等于运算符在两个操作数不相等时返回 `true`，其使用的规则与 `===`\
  \ 等等运算符相同。\n\n等等和不等于运算符在比较两个值以执行“条件分支”时非常有用，脚本将根据结果按照特定的方向运行。\n\n`>` 大于运算符比较两个操作数，如果第一个操作数的值大于第二个，则返回\
  \ `true`。`<` 小于运算符进行相同的比较，但当第一个操作数的值小于第二个时返回 `true`。在 `>` 大于运算符或 `<` 小于运算符后添加 `=`\
  \ 字符，可以让它们在两个操作数相等时也返回 `true`。\n\n`>` 大于和 `<` 小于运算符经常用于循环结构中测试计数器变量的值。\n\n![image](img/hot.jpg)\n\
  \n在循环结构中使用 `<` 小于运算符的示例可以参考这里。\n\n![image](img/snake.jpg)\n\n也有一个 `==` 等等运算符和一个\
  \ `!=` 不等于运算符，但这些可能会产生意料之外的结果，因为与 `===` 和 `!==` 不同，它们不能确保所比较的值具有相同的数据类型。这意味着 `25\
  \ == ‘25’` 返回 `true`，而 `25 === ‘25’` 返回 `false`。请务始终使用三个字符的版本，以确保你的脚本能够进行准确的比较。\n\
  \n![image](img/1r.jpg)创建一个带有自执行匿名函数的 HTML 文档，在该函数中声明三个变量\n\n```javascript\nfunction\
  \ () {\n  let comparison, sum = 8, str = ‘JavaScript’\n  // 在此处插入语句。\n}();\n```\n\
  \n![image](img/htmlr.jpg)\n\n`comparison.html`\n\n![image](img/2r.jpg)接下来，插入使用比较运算符来分配布尔结果以便输出的语句\n\
  \n```javascript\ncomparison = str === ‘JAVASCRIPT’\nconsole.log( ‘String Equality?\
  \ ‘ + comparison )\ncomparison = str === ‘JavaScript’\nconsole.log( ‘String Equality?\
  \ ‘ + comparison )\ncomparison = sum === 8\nconsole.log( ‘Number Equality? ‘ + comparison\
  \ )\ncomparison = sum > 5\nconsole.log( ‘Greater Than? ‘ + comparison )\ncomparison\
  \ = sum < 5\nconsole.log( ‘Less Than? ‘ + comparison )\ncomparison = sum <= 8\n\
  console.log( ‘Less Than or Equal To? ‘ + comparison )\n```\n\n![image](img/3r.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它并启动控制台以查看分配的结果\n\n![image](img/pg345_1.jpg)\n\n![image](img/forget.jpg)\n\
  \nJavaScript 是大小写敏感的，因此所比较字符串的字符大小写必须匹配才能相等。\n\n### 评估逻辑\n\nJavaScript 中可以使用的三个逻辑运算符列在表所示：\n\
  \n![image](img/pg346_1.jpg)\n\n| 运算符 | 操作 |\n| :--- | :--- |\n| `&&` | 逻辑与 |\n|\
  \ `||` | 逻辑或 |\n| `!` | 逻辑非 |\n\n逻辑运算符通常用于具有布尔值 `true` 或 `false` 的操作数——或者可以转换为 `true`\
  \ 或 `false` 的值。\n\n`&&` 逻辑与运算符将评估两个操作数，只有当两个操作数本身为 `true` 时才返回 `true`。否则，`&&` 与运算符将返回\
  \ `false`。这通常用于条件分支，脚本的方向由测试两个条件来决定。如果两个条件都满足，脚本将遵循特定方向运行，否则将遵循另一个方向。\n\n与需要两个操作数都为\
  \ `true` 的 `&&` 逻辑与运算符不同，`||` 逻辑或运算符将评估两个操作数，如果其中一个操作数本身为 `true`，则返回 `true`。如果两个操作数都不是\
  \ `true`，则 `||` 或运算符返回 `false`。这对于在两个条件之一满足时让脚本执行某些操作非常有用。\n\n第三个逻辑运算符是 `!` 逻辑非运算符，它用于单个操作数之前，并返回操作数的反反值。例如，如果名为“tog”的变量具有\
  \ `true` 值，那么 `!tog` 将返回 `false`。这对于在连续的循环迭代中使用如 `tog = !a` 的语句来“切换”变量的值非常有用，使得每次迭代的值都会反转——就像开关灯一样。\n\
  \n![image](img/pg346_2.jpg)\n\n“布尔”（Boolean）一词指的是英国数学家乔治·布尔（1815-1864）开发的一种逻辑思维系统。\n\
  \n![image](img/1r.jpg)创建一个带有自执行匿名函数的 HTML 文档，在该函数中声明三个变量\n\n```javascript\nfunction\
  \ () {\n  let result, yes = true, no = false\n  // 在此处插入语句。\n}();\n```\n\n![image](img/htmlr.jpg)\n\
  \n`logic.html`\n\n![image](img/2r.jpg)接下来，插入使用逻辑运算符来分配布尔结果以便输出的语句\n\n```javascript\n\
  result = yes && yes\nconsole.log( ‘Are both true? ‘ + result )\nresult = yes &&\
  \ no\nconsole.log( ‘Are both still true? ‘ + result )\nresult = yes || no\nconsole.log(\
  \ ‘Are either true? ‘ + result )\nresult = no || no\nconsole.log( ‘Are either true?\
  \ ‘ + result )\nconsole.log( ‘Original value: ‘ + yes )\nyes = !yes\nconsole.log(\
  \ ‘Toggled value: ‘ + yes )\n```\n\n![image](img/3r.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台以查看的结果\n\
  \n### 检查条件\n\nJavaScript 作者最喜欢的运算符可能是 `?:` 条件运算符。该运算符被称为“三元”运算符——意味着由三部分组成。\n\n\
  三元运算符评估指定条件的真假（true 或 false），然后根据结果执行两个指定语句之一。它的语法如下：\n\n![image](img/pg348_1.jpg)\n\
  \n`condition ? if-true-do-this : if-false-do-this`\n\n当需要根据结果执行多个操作时，每个指定项可以是函数调用，以便在每个函数中执行多个语句——例如，根据名为“flag”的变量的布尔值调用函数来执行多个语句：\n\
  \n`flag === true ? doThis() : doThat()`\n\n在这个示例中，`===` 等等运算符和 `true` 关键字实际上是多余的，因为评估表达式布尔值的运算符会自动执行这种评估，因此该示例可以更简单地表述为\n\
  \n`flag ? doThis() : doThat()`\n\n或者，三元运算符指定的两个语句可能会根据条件评估的结果为变量赋值值，如下：\n\n`flag\
  \ ? str = ‘Go left’ : str = ‘Go right’`\n\n虽然这在语法上是正确的，但更优雅的表达方式是让三元运算符在单个赋值语句将适当的值赋值给变量：\n\
  \n`str = flag ? ‘Go left’ : ‘Go right’`\n\n当条件评估数值的奇偶性时，两个语句可以根据评估判断数字是偶数还是奇数提供方案。\n\
  \n三元运算符有三个操作数——`?` 之前的以及 `:` 冒号两侧的。\n\n\n\n\n\n# ternary.html\n\n![image](img/2r.jpg)\n\
  接下来，插入语句以根据数量使用适当语法输出字符串\n\n```javascript\nlet verb = ( numOne !== 1 ) ? ‘ are ‘\
  \ : ‘ is ‘\nconsole.log( ‘There’ + verb + numOne )\n```\n\n![image](img/3r.jpg)\n\
  现在，插入语句以正确描述两个变量值奇偶性的字符串\n\n```javascript\nlet parity = ( numOne % 2 !== 0 ) ? ‘Odd’\
  \ : ‘Even’\nconsole.log( numOne + ‘ is ‘ + parity )\nparity = ( numTwo % 2 !== 0\
  \ ) ? ‘Odd’ : ‘Even’\nconsole.log( numTwo + ‘ is ‘ + parity )\n```\n\n![image](img/4r.jpg)\n\
  最后，插入语句以输出报告两个变量值中较大者的字符串\n\n```javascript\nlet max = ( numOne > numTwo ) ? numOne\
