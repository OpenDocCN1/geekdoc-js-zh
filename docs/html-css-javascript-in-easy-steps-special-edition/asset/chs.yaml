  \n## 合并字符串\n\nJavaScript 拥有 `String` 对象，它提供了操作字符串的方法。\n\n- `toUpperCase()` 返回字符串的大写字母版本。\n\
  - `toLowerCase()` 返回字符串的小写字母版本。\n- `concat()` 连接两个或多个字符串。\n- `length` 属性返回字符串中的字符数。\n\
  \n(注：提供的源文本中关于字符串方法的描述包含高度损坏/重复的句子；我提取了所呈现的核心技术概念。)\n\n\n\n\n同样，`slice(()` 方法可以用于返回起始位置之后的所有字符，该位置由单个参数指定；或者返回两个位置之间的所有字符，由两个参数指定。\n\
  \n有时复制由特定字符分隔的字符串部分是有用的。该分隔符字符可以作为字符串 `split(()` 方法的参数传递，该方法将返回一个包含所有该字符出现处之间的子字符串的数组。可选地，`split(()`\
  \ 方法可以提供第二个参数，用于指定它应该返回的数组大小。在这种情况下，将返回指定分隔符之间的每个子字符串，直到达到限制，字符串的其余部分将被忽略。\n\n这些字符串方法均不会修改原始字符串，而仅仅创建了原始字符串某个部分的副本。\n\
  \n![image](img/hot.jpg)\n\n`substr(()` 方法一认为认为比 `substring(()` 方法更容易使用——因为你只需要计算起始位置和子字符串长度，而不需要计算结束位置。\n\
  \n![image](img/hot.jpg)\n\n`split(()` 方法用于分离示例此处中的 cookie 数据。\n\n![image](img/1o.jpg)\n\
  \n创建一个带有自执行函数的 HTML 文档，该函数从初始化一个变量开始\n\n```javascript\nlet definition = ‘JavaScript\
  \ is the original dialect of \\ the ECMAScript standard language.’\n```\n\n![image](img/hot.jpg)\n\
