  \n\n\n\n```css\nspan.label { display : block ; padding : 15px ;\ntext-align : center\
  \ ;\nbackground : DarkOrange ; color : White ; }\n```\n\n![image](img/8o.jpg)保存\
  \ HTML 文档，然后将鼠标悬停在每个缩略图上以显示下拉内容\n\n![image](img/pg263_1.jpg)\n\n![image](img/pg263_2.jpg)\n\
  \n![image](img/pg263_3.jpg)\n\n![image](img/pg263_4.jpg)\n\n![image](img/hot.jpg)\n\
  \n另一种，可以使用 `visibility : hidden ;` 规则隐藏元素并使用 `visibility : visible ;` 规则显示。使用这些规则时，内容在隐藏时仍然占据页面上的空间，而使用\
  \ `display : none ;` 规则时，内容将完全从页面流布局中移除。\n\n## 绘制圆角\n\n通过使用 CSS `border-radius`\
  \ 属性圆角内容框的角可以增强内容框的外观。当所有角都具有相同的半径时，该属性可以指定半径为距离角点在水平和垂直方向上的距离——例如，值为 `20px`。\n\n\
  ![image](img/pg264_1.jpg)\n\n![image](img/pg264_2.jpg)\n\n也可以通过为 `border-top-left`、`border-top-right`、`border-bottom-right`\
  \ 和 `border-bottom-left` 属性指定半径大小来对单个角进行圆角。\n\n![image](img/pg264_3.jpg)\n\n另一种，可以使用\
  \ `border-radius` 作为简写属性指定四个值来对单个角进行圆角——顺序分别为 `border-top-left`、`border-top-right`、`border-bottom-right`、`border-bottom-left`。如果对任何角指定零值，则不会产生半径。也可以通过指定两个值来定义椭圆以使单个角弯曲，使得水平和垂直方向获得不同的半径。第一个值指定水平\
  \ x 半径，第二个值指定垂直 y 半径。例如，`border-top-right-radius : 20px 50px` 定义了一个椭圆。\n\n将 `border-radius`\
  \ 属性设置为正方形内容框大小（包括边框）的一半，可以创建圆形。\n\n![image](img/hot.jpg)\n\n通过在长方形内容框上将 `border-radius`\
  \ 设置为 50%，可以创建一个椭圆。\n\n![image](img/1o.jpg)创建一个包含三个外部 div 的 HTML 文档，每个 div 均包含一个内层\
  \ div 元素\n\n```html\n<div=”outer all”><div class=”inner”>\nAll Rounded Corners</div></div>\n\
  <div class=”outer ind”><div class=”inner”>\nIndividual Corners</div></div>\n<div\
  \ class=”outer cir”><div class=”inner”>\nCircle</div></div>\n```\n\n![image](img/htmlo.jpg)\n\
  \nradius.html\n\n![image](img/2o.jpg)接下来，添加带有规则的样式表以指定每个元素的位置和外观\n\n```css\ndiv.outer,\
  \ div.inner { width : 120px ; height : 120px ; }\ndiv.outer { display : inline-block\
  \ ; margin : 10px ;\nborder : 5px solid DarkOrange ; background : Bisque ; }\ndiv.inner\
  \ { display : table-cell ; text-align : center ;\nvertical-align : middle ; border\
  \ : 2px dashed Orange ; }\n```\n\n![image](img/3o.jpg)现在，添加规则来调整外部 div 的角\n\n```css\n\
  div.all { border-radius : 40px ; }\ndiv.ind { border-radius : 50px 0 50px 0 ; }\n\
  div.cir { border-radius : 65px ; }\n```\n\n![image](img/4o.jpg)保存 HTML 文档，然后在浏览器中打开它以查看圆角\n\
  \n![image](img/pg265_1.jpg)\n\n![image](img/hot.jpg)\n\n注意这里的 `table-cell` 显示样式如何允许文本在水平和垂直方向上居中。\n\
  \n![image](img/forget.jpg)\n\n此示例中的第二个外部 div 可以使用单独的规则 `border-top-left-radius :\
  \ 50px ; border-bottom- right-radius : 50px ;` 进行样式。\n\n## 添加投影\n\n通过使用 `box-shadow`\
  \ 属性添加投影投影效果可以增强内容框的外观，同样也可以用 `text-shadow` 属性增强文本。\n\n![image](img/pg266_1.jpg)\n\
  \n必须指定水平和垂直偏移值来定位阴影。当这些值为正值时，阴影将位于项目的右侧和下方。相反，可以指定负值将阴影分别置于左侧和上方——例如，正值 `20px 10px`。\n\
  \n![image](img/pg266_2.jpg)\n\n可选地，`box-shadow` 和 `text-shadow` 属性可以第三个值来指定模糊距离，该距离决定阴影边缘的模糊程度——值越高越模糊。例如，`20px`\
  \ 的模糊值会扩展阴影，使其在原始偏移两边 10 像素的区域变得模糊。\n\n![image](img/pg266_3.jpg)\n\n此外，第四个可选值可以指定扩散距离，以确定阴影应该延伸多远，并可以使用\
  \ `inset` 关键字创建内阴影。\n\n你还可以通过向 `text-shadow` 属性指定逗号分隔的阴影值列表为文本添加多个投影。\n\n![image](img/snake.jpg)\n\
  \n虽然不是严格要求指定颜色，但建议避免不同网络浏览器之间的不一致。\n\n![image](img/1o.jpg)创建一个包含三个外部 div 的 HTML\
  \ 文档，每个 div 均包含一个内层 div 元素\n\n```html\n<div class=”outer drop”><div class=”inner”>HTML</div></div>\n\
  <div class=”outer glow”><div class=”inner”>CSS</div></div>\n<div class=”outer inset”><div\
  \ class=”inner”>JS</div></div>\n```\n\n![image](img/htmlo.jpg)\n\nshadow.html\n\n\
  ![image](img/2o.jpg)接下来，添加带有规则的样式表以指定每个元素的位置和外观\n\n```css\ndiv.outer, div.inner\
  \ { width : 120px ; height : 120px ; }\ndiv.outer { display : inline-block ; margin\
  \ : 20px ;\nborder : 2px solid Black ; background : White ; }\ndiv.inner { display\
  \ : table-cell ; text-align : center ;\nvertical-align : middle ; font : bold 2em\
  \ sans-serif ; }\n```\n\n![image](img/3o.jpg)现在，添加规则为框和文本应用投影\n\n```css\ndiv.drop\
  \ { box-shadow : 10px 10px 10px DarkOrange; }\ndiv.drop > div.inner { text-shadow\
  \ : 2px 2px DarkOrange; }\ndiv.glow { box-shadow : 0 0 10px 10px DarkOrange; }\n\
  div.glow > div.inner { color : White;\ntext-shadow : 2px 2px 4px Black ; }\ndiv.inset\
  \ { box-shadow : 10px 10px 30px DarkOrange inset; }\ndiv.inset > div.inner { color\
  \ : Bisque;\ntext-shadow : -1px 0 Black , 0 1px Black , 1px 0 Black , 0 -1px Black\
  \ ; }\n```\n\n![image](img/4o.jpg)保存 HTML 文档，然后在浏览器中打开它以查看投影\n\n![image](img/pg267_1.jpg)\n\
  \n![image](img/hot.jpg)\n\n## 混合渐变\n\nCSS 提供了四个函数来创建渐变填充，浏览器从一个指定的颜色到另一种颜色进行平滑混合——`linear-gradient()`、`repeating-linear-gradient()`、`radial-gradient()`\
  \ 和 `repeating-radial-gradient()`。\n\n![image](img/pg268_1.jpg)\n\n`linear-gradient()`\
  \ 函数沿线性路径创建颜色过渡，从一个“颜色停止点”混合到另一个。每个颜色停止点可以在函数括号内简单地用逗号分隔的颜色值指定，或者用逗号分隔的颜色和位置值指定——例如，使用\
  \ `Red, Yellow` 或使用 `Red 50%, Yellow 100%` 来定义路径的中点和终点的颜色停止点。至少有两个颜色停止点，但你可以指定多个颜色停止点以实现使用更多颜色的复杂渐变效果。\n\
  \n\n\n\n\n`linear-gradient( )` 函数的默认方向是从上到下，但你可以通过包含一个可选的第一个值（作为 `top` `bottom`\
  \ `left` `right` 关键字的组合）来定义一个不同的方向——例如，从左上角开始的 `to bottom right` 关键字的对角线渐变。为了更精确地控制方向，可选的第一个值可以指定角度，例如\
  \ `45deg` 或 `90deg`。在这种情况下，该值指定了水平边缘与 `linear-gradient( )` 路径之间的角度。例如，`45deg` 创建了一个从左下角到右上角的对角线路径，而\
  \ `90deg` 生成了一个从左到右的水平路径。你也可以指定负值。例如，`-90deg` 创建了一个从右到左的水平路径（与 `270deg` 相同）。\n\n\
  `radial-gradient( )` 函数也从一个颜色停止点混合到另一个，但其路径是从中心点向外扩散的。默认情况下，它从元素的中心开始并呈圆形。可选，可以指定\
  \ `ellipse` 关键字以及长度和位置值来定义不同的径向形状和不同的中心点。你可以通过包含一个可选的第一个值（作为 `closest-side`、`farthest-side`、`closest-corner`、`farthest-corner`、`at`\
  \ 以及 x 轴和 y 轴的百分比值的组合）来定义不同的中心点——例如，从中心右侧和下方开始的径向渐变，使用 `closest-side` 在 `60% 60%`。\n\
  \n`repeating-linear-gradient( )` 和 `repeating-radial-gradient( )` 函数接受与其非重复版本相同的值，但在达到最后一个指定的颜色停止后会自动重复渐变。\n\
  \n![image](img/forget.jpg)\n\n每个渐变必须至少有两个颜色停止点。\n\n![image](img/1o.jpg)\n\n创建一个包含四个\
  \ div 元素的 HTML 文档\n\n```html\n<div class=\"linear\"></div>\n<div class=\"linear-repeat\"\
  ></div>\n<div class=\"radial\"></div>\n<div class=\"radial-repeat\"></div>\n```\n\
  \n![image](img/htmlo.jpg)\n\ngradient.html\n\n![image](img/2o.jpg) 接下来，添加带有规则的样式表以指定每个元素的位置和外观——包括默认的背景颜色\n\
  \n```css\ndiv { display: inline-block; width: 100px; height: 100px; margin: 10px;\
  \ border: 2px solid Black; background: Orange; }\n```\n\n![image](img/snake.jpg)\n\
  \n某些浏览器可能不支持渐变，因此指定一个默认单色是有用的。\n\n![image](img/3o.jpg) 现，添加规则来为支持渐变的浏览器应用渐变背景\n\n\
  ```css\ndiv.linear { background: linear-gradient(45deg, DarkOrange, Bisque); }\n\
  div.linear-repeat { background: repeating-linear-gradient(DarkOrange 20%, Bisque\
  \ 40%, OrangeRed 50%); }\ndiv.radial { background: radial-gradient(DarkOrange 20%,\
  \ Bisque 40%, OrangeRed 50%); }\ndiv.radial-repeat { background: repeating-radial-gradient(DarkOrange\
  \ 20%, Bisque 40%, OrangeRed 50%); }\n```\n\n![image](img/4o.jpg) 保存 HTML 文档然后在浏览器中打开它查看渐变\n\
  \n![image](img/pg269_1.jpg)\n\n![image](img/hot.jpg)\n\n在重复渐变中，你可以为第一个和最后一个颜色停止点指定相同的颜色以避免突兀的变化。\n\
  \n## 装饰边框\n\nCSS 提供了 `border-image` 属性，允许你通过 `url( )` 函数指定图像源来装饰边框。这是唯一必需的值，它会将图像放置在指定的边框区域，内容框的每个角落。\n\
  \n![image](img/pg270_1.jpg)\n\n`border-image` 属性可以在图像源之后指定额外的值来装饰角落之间的边框区域——但它的工作方式不寻常。\n\
  \n`border-image` 属性将图像切分为九部分，类似于井棋盘。第一个额外值可以指定从顶部、右侧、底部和左侧边缘切分图像的点。例如，`33%` 的值将从每条边缘切下三分之一。然后将四个角的切片放置在边框的每个角上，并将四个中间切片按默认拉伸，以装饰角落之间的边框区域。\n\
  \n![image](img/pg270_2.jpg)\n\n第二个额外值可以使用这些关键字显式指定如何装饰角落之间的边框区域：\n\n- `stretch`\
  \ – 中间切片拉伸以填充区域（默认值）。\n- `repeat` – 中间切片平铺填充区域，必要时进行分割。\n- `round` – 中间切片平铺填充区域，必要时重新缩放以避免分割。\n\
  \n`border-image` 属性是各个 `border-image-source`、`border-image-slice` 和 `border-image-repeat`\
  \ 属性的简写。还可以为 `border-image-width` 指定进一步的额外值以指定边框图像的宽度，并为 `border-image-outset` 指定图像可以延伸到边框区域之外的距离。\n\
  \n所有支持 `border-image` 属性的浏览器也支持渐变。这意味着，除了 `border-image`，你还可以指定任何渐变。\n\n![image](img/snake.jpg)\n\
  \n支持 `border-image` 属性的浏览器也支持渐变。这意味着，除了 `border-image`，你还可以指定任何渐变。\n\n![image](img/1o.jpg)\
  \ `border-image` 只有在指定了 `border` 后才会生效。\n\n![image](img/2o.jpg) 创建包含四个 div 元素的 HTML\n\
  \n```html\n<div class=\"image\"></div>\n<div class=\"round\"></div>\n<div class=\"\
  stretch\"></div>\n```\n\n![image](img/htmlo.jpg) transform.\n\n接下来，添加带有规则的样式表以指定每个元素的位置和外观——包括默认的背景颜色\n\
  \n```css\ndiv { display: inline-block; width: 100px; height: 100px; }\n```\n\n![image](img/3o.jpg)\
  \ 现，添加规则来为支持渐变的浏览器应用渐变背景\n\n```css\ndiv.linear { background: linear-gradient(45deg,\
  \ DarkOrange, Bisque); }\ndiv.linear-repeat { background: repeating-linear-gradient(DarkOrange\
  \ 20%, Bisque 40%, OrangeRed 50%); }\ndiv.radial { background: radial-gradient(DarkOrange\
  \ 20%, Bisque 40%, OrangeRed 50%); }\ndiv.radial-repeat { background: repeating-radial-gradient(DarkOrange\
  \ 20%, Bisque 40%, OrangeRed 50%); }\n```\n\n![image](img/4o.jpg) 保存 HTML 文档然后在浏览器中打开它查看渐变\n\
  \n![image](img/pg269_1.jpg)\n\n[content]\n[/content]\n\n## 变换形状\n\nCSS 可以通过为 `transform`\
  \ 属性指定变换函数来动态操作内容框，改变它们的大小、位置或方向。\n\n![image](img/pg271.jpg)\n\n| 函数 | 变换 |\n| :---\
  \ | :--- |\n| `scale(n1,n2)` | X 和 Y 轴缩放 `n1 n2` |\n| `scaleX(n)` | X 轴缩放 `n` |\n\
  | `scaleY(n)` | Y 轴缩放 `n` |\n| `skew(n1,n2)` | X 和 Y 轴倾斜 `n1 n2` |\n| `skewX(n)`\
  \ | X 轴倾斜 `n` |\n| `skewY(n)` | Y 轴倾斜 `n` |\n| `rotate(n)` | 旋转 `n` 角度 |\n| `rotateX(n)`\
  \ | X 轴旋转 `n` 角度 |\n| `rotateY(n)` | Y 轴旋转 `n` 角度 |\n| `rotateZ(n)` | Z 轴旋转 `n`\
  \ 角度 |\n| `translate(n1,n2)` | X 和 Y 轴移动 `n1 n2` 距离 |\n| `translateX(n)` | X 轴移动\
  \ `n` 距离 |\n| `translateY(n)` | Y 轴移动 `n` 距离 |\n| `matrix(n,n,n,n,n,n*)` | 缩放 `n`,\
  \ `n`，倾斜 `n`, `n`，移动 `n`, `n` |\n\n`matrix( )` 函数很少使用，但它允许同时对元素进行旋转、缩放、移动和倾斜。它的六个值按照（有点困惑的）顺序代表各个函数\
  \ `scaleX( )`、`skewY( )`、`skewX( )`、`scaleY( )`、`translateX( )` 和 `translateY( )`。\n\
  \n\n\n\n\n“变换基点”（transform origin）是执行变换的点，默认情况下，它是元素的中心。然而，你可以为 `transform-origin`\
  \ 属性指定替代方案，如单位、百分比值或关键字`top”（上）、`bottom”（下）、`left”（左）、`right”（右）和`center”（中间）。例如，使用\
  \ `rotate()` 和 `transform-origin : top left ;`，元素将绕其左上角旋转，而不是其中心点。\n\n可以将变换指定给元素的\
  \ `:hover` 伪类，这样当用户将光标悬停在元素上时将执行变换，当用户将光标移开时，它将恢复正常状态。\n\n![image](img/hot.jpg)\n\
  \n你还可以为 `scale()` 函数指定单个值，同时应用于 X 轴和 Y 轴。\n\n![image](img/snake.jpg)\n\n`transform-origin`\
  \ 属性只能与 `transform` 属性结合使用。\n\n![image](img/1o.jpg)\n\n### 创建带有三个 div 元素的 HTML 文档\n\
  \n```html\n<div class=\"rotate\">Rotate</div>\n<div class=\"scale\">Scale</div>\n\
  <div class=\"skew\">Skew</div>\n```\n\n![image](img/htmlo.jpg)\n\ntransform.html\n\
  \n![image](img/2o.jpg)\n\n### 接下来，添加带有规则样式表以指定每个元素的位置和外观\n\n```css\ndiv { display\
  \ : inline-block ; margin : 50px 0 0 50px ;\npadding : 15px ; background : DarkOrange\
  \ ;\ncolor : White ; font : 1.5em sans-serif ; }\n```\n\n![image](img/3o.jpg)\n\n\
  ### 现在，添加规则在用户将光标悬停在内容框上时对每个 div 进行变换\n\n```css\ndiv.rotate:hover { transform :\
  \ rotate( 45deg ) ; }\ndiv.scale:hover { transform : scale( 2.0, 2.0 ) ; }\ndiv.skew:hover\
  \ { transform : skew( 15deg, 15deg ) ; }\n```\n\n![image](img/4o.jpg)\n\n保存 HTML\
  \ 文档，然后在浏览器中打开它，并将光标悬停在每个元素上查看变换效果\n\n![image](img/pg273_1.jpg)\n![image](img/pg273_2.jpg)\n\
  ![image](img/pg273_3.jpg)\n\n### 创建过渡\n\nCSS 可以动态修改属性值，在指定的时间内改变它们的颜色、大小、位置、方向等，从而通过\
  \ `transition` 属性创建简单的动画效果。\n\n![image](img/pg274_1.jpg)\n\n`transition` 属性必须指定要修改的\
  \ CSS 属性以及效果的持续时间——例如，一个样式规则 `transition : width 5s ;` 用于在五秒内修改元素的宽度。多个属性可以以属性和持续时间对的逗号分隔列表的形式指定，例如\
  \ `transition : width 5s, height 3s ;` 同时修改宽度和高度。\n\n你可以通过为 `transition-timing-function`\
  \ 属性分配下面的函数之一来控制效果的“加速曲线”。\n\n| 函数: | 过渡 (Transition): |\n| :--- | :--- |\n| `linear`\
  \ | 从开始到结束速度一致 |\n| `ease` | 从开始增加以达到全速，然后在结束时减小（默认） |\n| `ease-in` | 仅在开始增加 |\n\
  | `ease-out` | 仅在结束时减小 |\n| `ease-in-out` | 在开始增加并在结束减小 |\n| `steps(*n*)` | 跳到 `n`\
  \ 个间隔 |\n| `cubic-bezier(*x1,y1,x2,y2*)` | 在坐标之间产生弹性或回弹效果 |\n\n此外，你可以指定一个 `transition-delay`\
  \ 时间值，例如 `1s` 代表一秒，这样效果就不会立即开始。\n\n`transition` 属性是各个 `transition-property`、`transition-duration`、`transition-timing-function`\
  \ 和 `transition-delay` 属性的简写属性。这些值可以指定每个单独的属性，也可以按此顺序为简写属性指定所有四个属性的值——例如，使用 `transition\
  \ : width 5s linear 0.5s ;` 在延迟 0.5 秒后，以一致的速度在五秒内修改宽度。你还可以通过逗号分隔的组组值列表来指定多个过渡。\n\
  \n可以将要修改的属性的最终值指定给元素的 `:hover` 伪类，这样当用户将光标悬停在元素上时将执行变换。\n\n![image](img/forget.jpg)\n\
  \n除非指定了持续时间，否则过渡不会运行。\n\n![image](img/hot.jpg)\n\n`steps()` 函数跳转到过渡中的暂停处，因此 `steps(5)`\
  \ 在五秒的效果中每秒暂停一次。\n\n![image](img/1o.jpg)\n\n### 创建带有一个 div 元素的 HTML 文档\n\n```html\n\
  <div class=\"expand\">Transition</div>\n```\n\n![image](img/htmlo.jpg)\n\ntransition.html\n\
  \n![image](img/2o.jpg)\n\n### 接下来，添加带有规则样式表以指定元素的位置和外观\n\n```css\ndiv { margin :\
  \ 50px ; padding : 15px ;\ncolor : White ; font : 1.5em sans-serif ;\nbackground\
  \ : Orange ;\nwidth : 100px ; height : 100px ; }\n```\n\n![image](img/3o.jpg) #\
  \ 接下来，添加带有规则样式表以指定元素的位置和外观\n\n```css\ndiv { margin : 50px ; padding : 15px ;\ncolor\
  \ : White ; font : 1.5em sans-serif ;\nbackground : Orange ;\nwidth : 100px ; height\
  \ : 100px ; }\n```\n\n![image](img/3o.jpg) # 接下来，添加带有规则样式表以指定元素的位置和外观\n\n（注：此处原文文本似乎存在重复或逻辑断层，已根据上下文整理翻译）\n\
  \n### 现在，添加规则在用户将光标悬停在内容框上时对每个 div 进行变换\n\n```css\ndiv.rotate:hover { transform\
  \ : rotate( 45deg ) ; }\ndiv.scale:hover { transform : scale( 2.0, 2.0 ) ; }\ndiv.skew:hover\
  \ { transform : skew( 15deg, 15deg ) ; }\n```\n\n![image](img/4o.jpg)\n\n保存 HTML\
  \ 文档，然后在浏览器中打开它，并将光标悬停在每个元素上查看变换效果\n\n![image](img/pg273_1.jpg)\n![image](img/pg273_2.jpg)\n\
  ![image](img/pg273_3.jpg)\n\n### 创建过渡\n\nCSS 可以动态修改属性值，在指定的时间内改变它们的颜色、大小、位置、方向等，从而通过\
