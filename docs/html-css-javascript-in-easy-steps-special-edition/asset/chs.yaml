  \n三元运算符可以返回任何数据类型的值——字符串、数字、布尔值等。\n\n## 位运算\n\nJavaScript “位”运算符将其操作数视为 32 位的序列，其中每个位可能包含零\
  \ (0) 或一 (1) 值。只有当该位包含 1 时，该位才贡献一个十进制部分。组件从右到左从“最低有效位”（LSB）到“最高有效位”（MSB）命名。下方八位模式中的二进制数表示十进制的\
  \ 50，如设置为 1 值的位位所示（2 + 16 + 32 = 50）。\n\n![image](img/pg350_1.jpg)\n\n| 位号 | 8 |\
  \ 7 | 6 | 5 | 4 | 3 | 2 | 1 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :---\
  \ | :--- | :--- |\n| 十进制 | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |\n| 二进制 | 0 | 0 |\
  \ 1 | 1 | 0 | 0 | 1 | 0 |\n\n可以使用下表列出的 JavaScript 位运算符来操作序列中的单个位。\n\n| 运算符 | 名称\
  \ | 二进制数操作： |\n| :--- | :--- | :--- |\n| \\| | 或 (OR) | 如果在两个比较的位中有一个为 1，则每个位返回\
  \ 1。示例：`1010 \\| 0101 = 1111` |\n| & | 与 (AND) | 如果两个比较的位都为 1，则每个位返回 1。 示例：`1010\
  \ & 1100 = 1000` |\n| ~ | 非 (NOT) | 位不为 1 时每个位返回 1，在位为 1 时返回 0。示例：`~ 1010 = 0101`\
  \ |\n| ^ | 异或 (XOR) | 如果两个比较的位中只有一个为 1，则每个位返回 1。示例：`1010 ^ 0100 = 1110` |\n| <<\
  \ | 左移 | 从右侧推入零，将每个位向左移动指定的位数。示例：`0010<< 2 = 1000` |\n| >> | 有符号右移 | 从左侧推入最左侧位的副本，将每个位向右移动指定的位数。示例：`1000\
  \ >> 2 = 0010` |\n| >>> | 右移 | 从左侧推入零，将每个位向右移动指定的位数。示例：`1000 >> 2 = 0010` |\n\n\
  ![image](img/forget.jpg)\n\n许多 JavaScript 作者从不使用位运算符，但了解它们是什么以及如何使用是有用的。\n\n![image](img/hot.jpg)\n\
  \n一个“字节”有 8 位，一个字节的每个半部分被称为“半字节”（nibble，即 4 位）。此表示例中的二进制数描述了存储在半字节中的值。\n\n![image](img/1r.jpg)\n\
