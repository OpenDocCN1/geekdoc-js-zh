  \n![image](img/1r.jpg)\n创建一个声明两个变量自执行匿名函数 HTML 文档\n\n```javascript\nfunction ( )\
  \ {\n  let numOne = 10, numTwo = 5\n  // 在此处插入语句。\n  let sum = 9 + 12 // 等于 21。\n\
  \  console.log( ‘分组和:‘ + sum )\n} ) (\n```\n\n![image](img/htmlr.jpg)\n\n# precedence.html\n\
  \n![image](img/2r.jpg)\n保存 HTML 文档，然后在浏览器中打开它并启动控制台查看结果\n\n![image](img/pg351.jpg)\n\
  \n三元运算符可以返回任何数据类型的值——字符串、数字、布尔值等。\n\n## precedence.html\n\n![image](img/3r.jpg)\n\
  通过对表达式进行分组来强制顺序，以便加法先执行，因为 ( ) 运算符具有最高优先级。\n\n```javascript\nlet sum = ( 9 + 12\
  \ ) / 3 // 除法优先级高于加法。\nconsole.log( ‘分组和:‘ + sum )\n```\n\n![image](img/4r.jpg)\n\
  再次保存 HTML 文档，然后刷新浏览器查看新结果\n\n![image](img/pg353_2.jpg)\n\n![image](img/hot.jpg)\n\
  \n## Order\n\nJavaScript 运算符具有不同的优先级。下表从高到低列出了每种运算符：\n\n| 运算符 | 操作 |\n| :--- | :---\
  \ |\n| ( ) | 表达式分组 |\n| . | 对象成员 |\n| [ ] | 数组成员 |\n| ( ) | 函数调用 |\n| ++ -- | 后置递增、后置递减\
  \ |\n| ++ -- | 前置递增、前置递减 |\n| ! ~ | 逻辑非、位非 |\n| ** | 幂 |\n| * / % | 乘法、除法、取模 |\n\
  | + – | 加法、减法 |\n| << >>> | 位移 |\n| <= > | 比较 |\n| === != | 等等、不不等 |\n| & | 位与 |\n\
  | ^ | 位异异 |\n| \\| | 位或 |\n| && | 逻辑与 |\n| || | 逻辑或 |\n| ?: | 三元条件 |\n| = += *=\
  \ %= &= ^= ^= \\|= << >>= >>>= | 赋值 |\n| , | 逗号 |\n\n**Summary**\n\n• parseInt(\
  \ ) 和 parseFloat( ) 可以将字符串转换为数字，但 String( ) 和 toString( ) 可以将数字转换为字符串。\n\n• isNaN(\
  \ ) 函数测试参数的 NaN 值。\n\n• 算术运算符执行常规算术，加上 % 取模、++ 递增、-- 递减。\n\n当 ++ 递增或 -- 递减运算符位于操作数之前时，其值会立即更改，但当它们位于操作数之后时，会先求表达式的值。\n\
  \n\n\n\n- `=` 运算符可以与算术运算符结合，执行算术运算后赋值其结果。\n- `+=` 运算符用于向现有字符串追加内容。\n- 两个操作数可以进行\
  \ `===` 相等、`!==` 不等、`>` 大于值或 `<` 小于值的比较。\n- `<=` 和 `>=` 组合比较运算符在两个操作数相等时也会返回 `true`。\n\
  - 逻辑 `&&` 与逻辑运算符评估两个操作数，当两个操作数都为真时返回 `true`；但逻辑 `||` 或逻辑运算符在任一操作数为真时返回 `true`。\n\
  - 逻辑 `!` 非运算符可以作用于单个操作数之前以返回其取反值。\n- 三元运算符 `?:` 评估条件的真假值，然后根据结果执行两个语句中的一个。\n- JavaScript\
  \ 位运算符可以操作二进制序列的单个位以执行二进制算术运算。\n- JavaScript 运算符具有不同的优先级，以确定语句被求值的顺序。\n- 可以通过在 `(\
  \ )` 括号内对表达式进行分组来强制执行优先级值顺序。\n\n| 17 管理脚本流 | ![image](img/pg337_1.jpg) |\n\n*本章描述了\
  \ JavaScript 控制结构，并演示了它们如何控制脚本的进度。*\n\n- 分支 If\n- 分支替代方案\n- Switch 替代方案\n- For 循环\n\
  - While 循环\n- Do 循环\n- 跳出\n- 捕获错误\n- 总结\n\n## 分支 If\n\n任何脚本或计算机程序的进展都取决于条件的评估，以确定流的方向。每次评估都可能根据评估结果提供一个或多个继续执行的分支。\n\
  \n![image](img/pg356_1.jpg)\n\n在 JavaScript 中，基本的条件测试使用 `if` 关键字执行，以测试条件是否为布尔真或假值。当结果为真时，将执行评估后的语句；否则将跳过该语句，流继续到下一个后续语句。\n\
  \n`if` 语句的语法要求将待测试的条件放在 `if` 关键字后的括号内，格式如下：\n\n```javascript\nif ( condition ) execute-this-statement-when-true\n\
  ```\n\n`if` 语句还可以通过在大括号内包含多个语句来指定在结果为真时执行的多个语句，如下所示：\n\n```javascript\nif ( condition\
  \ )\n{\n  execute-this-statement-when-true\n  execute-this-statement-when-true\n\
  \  execute-this-statement-when-true\n}\n```\n\n对条件的评估和根据结果执行的操作简单反映了真实生活中的思考过程——例如，你可能在夏天执行执行的操作：\n\
  \n```javascript\nlet temperature = readThermometer( )\nconst tolerable = 25\nif\
  \ ( temperature > tolerable )\n{\n  turn_on_air-condition\n}\n```\n\n\n\n使用 `if\
  \ else` 语句进行条件分支脚本流对于测试少数条件是可以的，但当有大量条件需要测试时，它会变得难以难以。。在这种情况下，使用 `switch` 语句而不是\
  \ `if else` 语句通常更高效、更优雅。\n\n![image](img/pg360_1.jpg)\n\n`switch` 语句的工作方式很独特——它首先评估指定的表达式，然后为结果值寻找匹配。如果找到匹配，`switch`\
  \ 语句将执行与该值关联的一个或多个语句；否则，它将执行指定为“默认语句”的一个或多个语句。\n\n`switch` 语句首先在 `switch` 关键字后的括号内包含要评估的表达式。随后是一对\
  \ `{ }` 大括号，其中包含可能的匹配项。每个匹配值后跟着 `case` 关键字，并使用冒号 `:`字符将一个或多个要执行的语句关联起来。重要的是，每个 `case`\
  \ 必须以 `break` 语句结束，以便在执行关联语句后退出 `switch` 语句。\n\n可选地，`switch` 语句可以包含一个最后的 `default`\
  \ 备选项，当所有指定的 `case` 值都不匹配表达式评估的结果时，与之关联一个或多个要执行的语句。\n\n因此，`switch` 语句的语法如下：\n\n\
  ```\nswitch ( expression ) \n{\ncase value-1 : 匹配时要执行的语句 ; break\ncase value-2 :\
  \ 匹配时要执行的语句 ; break\ncase value-3 : 匹配时要执行的语句 ; break\ndefault : 未找到匹配项时要执行的语句\n\
  }\n```\n\n`switch` 语句块中可以包含的 `case` 值数量没有限制，因此这是匹配几十、数百甚至数千个不同值中的任何一个值的理想方式。\n\n\
  ![image](img/snake.jpg)\n\n省略 `break` 语句允许脚本也执行与后续不匹配的 `case` 值关联的语句。\n\n![image](img/1g.jpg)创建一个\
  \ HTML 文档，其中包含一个自执行函数，并首先声明一个变量\n\n`let day`\n\n![image](img/htmlg.jpg)\n\nswitch.html\n\
  \n![image](img/2g.jpg)接下来，插入一个 `switch` 语句，在评估表达式后为变量赋值\n\n```\nswitch( 5 - 2 )\n\
  {\ncase 1 : day = ‘Monday’ ; break\ncase 2 : day = ‘Tuesday’ ; break\ncase 3 : day\
  \ = ‘Wednesday’ ; break\ncase 4 : day = ‘Thursday’ ; break\ncase 5 : day = ‘Friday’\
  \ ; break\ndefault : day = ‘Weekend’\n}\n```\n\n![image](img/3g.jpg)现在，插入一个语句输出由找到匹配的\
  \ case 语句所赋值的值\n\n`console.log( ‘It is ‘ + day )`\n\n![image](img/4g.jpg)保存 HTML\
  \ 文档，然后在浏览器中打开它并启动控制台查看输出中的赋值值\n\n![image](img/pg361_1.jpg)\n\n![image](img/forget.jpg)\n\
  \n作为可能的 case 匹配的字符串值必须像所有其他字符串值一样被包含在引号内。\n\n### For 循环\n\n循环是一种只要指定条件为真就重复代码块的结构。JavaScript\
  \ 中最常用的循环是 `for` 循环，其语法如下：\n\n```\nfor ( 初始化语句 ; 条件 ; 修改语句 ) {\n  要执行的语句\n}\n```\n\
  \n- **初始化语句**：在循环开始之前初始化变量的语句。\n- **条件**：在每次迭代之前评估的表达式。如果为真，循环继续；如果为假，循环结束。\n- **修改语句**：在每次迭代后执行的语句，通常用于更新计数器。\n\
  \n例如，执行 100 次的 `for` 循环：\n\n```forfor (let i = 0; i < 100; i++) {\n  // 要执行的语句\n\
  }\n```\n\n### While 循环\n\n当所需的迭代未知时使用 `while` 循环结构。`while` 循环的语法如下：\n\n```\nwhile\
  \ ( 条件 )\n{\n  要执行的语句\n}\n```\n\n- **条件**：在每次迭代之前评估的表达式。如果为真，执行大括号内的语句。如果为假，循环结束。\n\
  \n通过使用计数器变量作为条件并在每次迭代中增加其值，可以使 `while` 循环执行特定次数的迭代，就像 `for` 循环一样：\n\n```\nlet i\
  \ = 0;\nwhile (i < 100) {\n  // 要执行的语句\n  i++;\n}\n```\n\n\n\n\n```javascript\n\
  console.log( ‘Countdown Number: ‘ + i )\ni--\n}\n```\n![image](img/3g.jpg)保存 HTML\
  \ 文档，然后在浏览器中打开它并启动控制台以查看循环迭代\n\n![image](img/pg365_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n每个 `while` 循环必须带有大括号，因为它们包含两个语句——一个要执行的语句和一个修改器。\n\n### Do 循环\n\nJavaScript 中提供的另一种循环类型是\
  \ `do while` 循环结构。这就像是 `while` 循环的倒置版本，详情可以在此处查阅。当每次迭代中执行的语句必须至少执行一次时，它是理想的选择。它的语法如下：\n\
  \n```javascript\ndo\n{\n  statements-to-be-executed\n  modifier\n}\nwhile ( condition\
  \ )\n```\n\n![image](img/pg366_1.jpg)\n\n`while` 关键字后面的括号包含一个条件，该条件在每次迭代后都会评估为一个布尔值。每次迭代要执行的语句被封装在大括号内，并与一个修改测试条件中值的语句放在一起，这样在某个时刻其评估结果将返回\
  \ false，循环就会退出。只要评估结果为 true，语句就会在循环的每次迭代中执行。\n\n如果条件评估在第一次迭代时为 false，循环将立即退出，因此其大括号内的语句已执行了一次。`do\
  \ while` 循环有时被称为“后测试”循环，因为测试条件是在语句执行后才评估的。\n\n通过使用计数器变量作为测试条件并在每次迭代中增加其值，可以让 `do\
  \ while` 循环执行特定次数的迭代，类似于 `for` 循环。例如，执行 100 次一组语句的 `do while` 循环结构可能如下：\n\n```javascript\n\
  let i = 0\ndo\n{\n  statements-to-be-executed\n  i++\n}\nwhile ( i < 100 )\n```\n\
  \n计数器变量在每次迭代时都会递增，直到其值达到 100，此时评估返回 false，循环结束。\n\n![image](img/hot.jpg)\n\n只有在语句必须至少执行一次时，才使用\
  \ `do while` 循环。\n\n![image](img/1g.jpg)创建一个 HTML 文档，其自执行函数从初始化一个循环计数器变量开始\n\n```javascript\n\
  let i = 2\n```\n\n![image](img/htmlg.jpg)\n\ndo.html\n\n![image](img/2g.jpg)接下来，插入一个\
  \ `do while` 循环结构，它将进行迭代并在每次迭代输出循环计数器的值，直到其超过 1000\n\n```javascript\ndo\n{\n  i\
  \ *= 2\n  console.log( ‘Multiplied Number: ‘ + i )\n}\nwhile( i < 1000 )\n```\n\n\
  ![image](img/3g.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台以查看循环迭代\n\n![image](img/pg367_1.jpg)\n\
  \n![image](img/forget.jpg)\n\n注意最终值超过了条件限制，因为它在测试之前就被写入输出中了。\n\n### 跳出（Break Out）\n\
  \n JavaScript `break` 关键字可以在遇到指定条件时退出循环。条件测试应该出现在所有其他要执行的语句之前，以便循环能够立即结束。\n\n![image](img/pg368_1.jpg)\n\
  \n当嵌套在外部循环的循环中使用 `break` 语句时，流将在外部循环迭代中恢复。\n\n JavaScript `continue` 关键字可以在遇到指定条件时跳过循环的单次迭代。\n\
  \n当嵌套在外部循环的循环中使用 `continue` 语句时，流将在内部循环的下一次迭代继续。\n\n![image](img/1g.jpg)创建一个 HTML\
  \ 文档，其自执行函数从初始化两个循环计数器变量开始\n\n```javascript\nlet i = 0\nlet j = 0\n```\n\n![image](img/htmlg.jpg)\n\
  \nbreak.html\n\n![image](img/2g.jpg)接下来，插入一个包含内部嵌套 `for` 循环的 `for` 循环\n\n```javascript\n\
  for ( i = 1 ; i < 3 ; i++ )\n{\n  console.log( ‘Outer Loop: ‘ + i )\n  for ( j =\
  \ 1 ; j < 4 ; j++ )\n  {\n    // 插入在此处的语句。\n    console.log( ‘\\tInner Loop: ‘ +\
  \ j )\n  }\n}\n```\n\n![image](img/hot.jpg)\n\n`\\t` 转义序列在这里用于在输出中包含制表符。\n\n![image](img/3g.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它并启动控制台以查看外部循环的两次迭代和内部循环的三次迭代\n\n![image](img/pg369_1.jpg)\n\n\
  ![image](img/4g.jpg)接下来，在内部循环中插入语句以跳过内部循环的迭代并跳出外部循环\n\n```javascript\nif( ( i ===\
  \ 1 ) && ( j === 2 ) ) {\n  console.log( ‘\\tSkipped: ‘ + j )\n  continue\n}\nif(\
  \ ( i === 2 ) && ( j === 2 ) ) {\n  console.log( ‘\\tBroken: ‘ + j )\n  break\n\
  }\n```\n\n![image](img/5g.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台以查看迭代\n\n![image](img/pg371_1.jpg)\n\
  \n![image](img/1g.jpg)创建一个 HTML 文档，其自执行函数从初始化一个变量开始\n\n```javascript\nlet day =\
  \ 32\n```\n\n![image](img/htmlg.jpg)\n\ncatch.html\n\n![image](img/2g.jpg)接下来，插入一个\
  \ `try` 块来识别无效值\n\n```javascript\ntry\n{\n  if( day > 31 )\n  {\n    throw new RangeError(\
  \ ‘Day Cannot Exceed 31’ )\n  }\n  if( day < 1 )\n  {\n    throw ‘invalid’\n  }\n\
  }\n```\n\n![image](img/3g.jpg)现在，为 `try` 块附加一个 `catch` 块以处理无效值\n\n```javascript\n\
  catch( err )\n{\n  if( err === ‘invalid’ )\n  {\n    console.log( ‘Variable has\
  \ invalid value of ‘ + day )\n  }\n  else\n  {\n    console.log( err.name + ‘ Exception:\
  \ ‘ + err.message )\n  }\n}\n```\n\n![image](img/4g.jpg)然后，为 catch 块附加一个 `finally`\
  \ 块以输出最终消息\n\n```javascript\nfinally\n{\n  console.log( ‘The script has ignored\
  \ the error...’ )\n}\n```\n\n![image](img/5g.jpg)再次保存 HTML 文档，然后在浏览器中打开它并启动控制台以查看捕获的错误\n\
  \n![image](img/pg371_1.jpg)\n\n![image](img/6g.jpg)将变量值改为零，然后保存 HTML 文档并刷新浏览器以查看捕获的错误\n\
  \n![image](img/pg371_2.jpg)\n\n![image](img/hot.jpg)\n\n总结\n\n•基础条件测试使用 `if` 关键字执行，以测试布尔真值或假值。\n\
  \n\n\n\n\n- 可以通过 `else` 关键字扩展 `if` 语句来提供基本条件测试的备选分支。\n- 可以 `switch` 语句对大量条件进行布尔真值或假值的测试。\n\
  - 在 `switch` 块中，每个 `case` 语句必须以 `break` 关键字结束，以便在找到匹配项时退出。\n- `switch` 块可以包含一个最终的\
  \ `default` 语句，以便在未找到任何匹配项时执行。\n- `for` 循环必须指定一个初始化器、一个用于测试布尔真或假值的条件以及一个修饰符。\n-\
  \ 循环修饰符必须使被测试的条件在某个时刻变为假值，以便退出循环。\n- `while` 循环和 `for` 循环在执行任何语句之前会评估测试条件。\n- `do\
  \ while` 循环在执行语句之后评估测试条件。\n- 当遇到特定条件时可以使用 `break` 关键字退出循环。\n- 当遇到特定条件时可以使用 `continue`\
  \ 关键字跳过循环的单次。\n- `try catch` 结构可以处理脚本中发生的异常错误。\n- 每个错误对象都可以有一个 `name` 属性和一个 `message`\
  \ 属性，允许 `catch` 块描述其性质。\n- 可以 `throw` 关键字将字符串传递给 `catch` 块以识别错误。\n- `try catch`\
  \ 结构后面可以跟一个 `finally` 块，其中包含在处理异常后执行的语句。\n\n| 18 使用 Script 对象 | ![image](img/pg337_1.jpg)\
  \ |\n\n*本章节介绍了如何创建脚本对象，并演示了如何使用内置的 JavaScript 对象。*\n\n- 自定义对象\n- 扩展对象\n- 内置对象\n\
  - 创建数组\n- 循环元素\n- 切片数组\n- 排序元素\n- 获取日期\n- 提取日历\n- 提取时间\n- 设置日期\n- 匹配模式\n- 理解 JSON\n\
  - 创建 Promise\n- 获取数据\n- 总结\n\n## 自定义对象\n\n![image](img/pg374_1.jpg)\n\n现实世界的对象无处不在，它们每个都有我们可以描述的属性和行为：\n\
  \n- 属性描述对象拥有的特征。\n- 行为描述对象可以执行的操作。\n\n例如，一辆汽车可以用“品牌”和“型号”属性，以及“加速”和“刹车”行为来描述。\n\n\
  ![image](img/pg374_2.jpg)\n\n这些特征可以用 JavaScript 中的一个自定义汽车对象来表示，该对象包含品牌和型号的可变属性，以及\
  \ `accelerate()` 和 `brake()` 方法。\n\n值通过在 `{}` 大括号内用逗号分隔的 `name:value` 对赋值给对象，如下所示：\n\
  \n```javascript\nlet car = { make: ‘Jeep’, model: ‘Wrangler’,\n  accelerate: function\
  \ () { return this.model + ‘ drives away’ } ,\n  brake: function () { return this.make\
  \ + ‘ pulls up’ }\n}\n```\n\n你可以通过两种方式引用对象的属性值——使用 `objectName.propertyName` 的点符号语法，或使用\
  \ `objectName['propertyName']` 语法。\n\n可以使用点符号语法 `objectName.methodName()` 调用对象方法。\n\
  \n`this` 关键字可以在对象方法定义中使用，引用“拥有”该方法的对象。在上面的示例中，指的是 `car` 对象，因此 `this.model` 引用 `car.model`\
  \ 属性，而 `this.make` 引用 `car.make` 属性。\n\n![image](img/hot.jpg)\n\n在对象的 `name:value`\
  \ 列表中，空格会被忽略，但不要忘记在对之间加上一个逗号。\n\n![image](img/1p.jpg) 创建一个带有自执行函数的 HTML 文档，该函数从声明一个包含对象定义的变量开始：\n\
  \n```javascript\nlet car = {\n  // 在此处插入语句。\n}\n```\n\n![image](img/htmlp.jpg)\n\
  \ncustom.html\n\n![image](img/2p.jpg) 接下来，插入语句定义对象的属性\n\n```javascript\nmake: ‘Jeep’\
  \ ,\nmodel: ‘Wrangler’ ,\n```\n\n![image](img/3p.jpg) 现在，插入语句定义对象的方法\n\n```javascript\n\
  accelerate: function () {\n  return this.model + ‘ drives away’ } ,\nbrake: function\
  \ () {\n  return this.make + ‘ pulls up’ }\n```\n\n![image](img/4p.jpg) 那么，在变量声明的结束括号\
  \ `}` 之后，添加一条语句输出对象属性值的字符串\n\n```javascript\nconsole.log( ‘Car is a ‘ + car.make\
  \ + ‘ ‘ + car['model'] )\n```\n\n![image](img/5p.jpg) 最后，添加语句调用对象方法\n\n```javascript\n\
  console.log( car.accelerate() )\nconsole.log( car.brake() )\n```\n\n![image](img/6p.jpg)\
  \ 保存 HTML 文档，然后在浏览器中打开它，启动控制台查看对象的属性值和方法返回的字符串。\n\n![image](img/pg375_1.jpg) \n\n\
  `break` 关键字可以在遇到特定条件时退出循环。\n\n`continue` 关键字可以在遇到特定条件时跳过循环的单次迭代。\n\n## 扩展对象\n\n\
  ![image](img/pg376_1.jpg)\n\n![image](img/forget)) 自定义对象非常灵活，可以通过赋值新值随时进行扩展，使用点符号引用\
  \ `objectName.propertyName`。\n\n特殊的 `for in` 循环可以使用此语法列出对象的所有属性名：\n\n```javascript\n\
  for (property in car) {\n  console.log(property + ‘: ‘ + car[property] )\n}\n```\n\
  \n![image](img/1p.jpg) 为了在每次迭代中引用属性的值，需要将属性名放在方括号内。\n\n![image](img/pg376_2.jpg)\n\
  \n![image](img/forget)) 示例中的 `property` 变量实际上可以赋予任何有效名称。\n\n![image](img/4p.jpg)\
  \ 接下来，添加语句为两个现有对象属性赋值赋值\n\n```javascript\ncar.make = ‘Ford’\ncar.model = ‘Bronco’\n\
  ```\n\n![image](img/5p.jpg) 现在，添加语句为对象扩展一个额外的属性和额外的方法\n\n```javascript\ncar.engine\
  \ = ‘V6’\ncar.start = function () {\n  return this.make + ‘ motor is running’ }\n\
  ```\n\n![image](img/6p.jpg) 那么，添加语句输出包含对象属性值的字符串——使用引用引用技术\n\n```javascript\nconsole.log(\
  \ ‘\\nCar is a ‘ + car.make + ‘ ‘ + car['model'] )\nconsole.log( ‘Engine Type: ‘\
  \ + car.engine )\n```\n\n![image](img/hot.jpg) `\\n` 转义序列在此语句中用于在输出中包含换行（行间符）。\n\
  \n![image](img/7p.jpg) 最后，添加语句调用每个对象方法\n\n```javascript\nconsole.log( car.start()\
  \ )\nconsole.log( car.accelerate() )\nconsole.log( car.brake() )\n```\n\n![image](img/8p.jpg)\
  \ 再次保存 HTML 文档，然后刷新浏览器查看扩展后的对象的属性值和方法返回的字符串。\n\n\n\n\n\n| `String` (仅当使用 `new` 关键字创建时为对象)\
  \ |\n| `Number` (仅当使用 `new` 关键字创建时为对象) |\n| `Boolean` (仅当使用 `new` 关键字创建时为对象) |\n\
  | `Object` – 由你定义的对象 |\n| `Date` – 一个包含日期和时间部分的对象 |\n| `Array` – 一个存储索引化数据的对象 |\n\
  | `RegExp` – 一个描述正则表达式模式的对象 |\n| `Math` – 一个提供数学属性和方法的对象 |\n| `Error` – 一个提供错误详情的对象\
  \ |\n\nJavaScript 提供了上表列出的预内置对象。在这些对象中，除了 `Math` 之外，每个对象都有一个同名的构造方法，可以使用 `new` 关键字来创建该类型的对象——例如，通过\
  \ `let now = new Date()` 创建一个新的新的 `Date` 对象。\n\n然而，不建议你对 `Error` 和 `Date` 以外的任何对象类型使用\
  \ `new` 关键字和构造方法。JavaScript 可以根据赋值的值智能地识别出应该创建什么类型的对象，除非该值是字符串、数字或布尔值。这些各被视为“原始”字面量，没有属性或方法，因此\
  \ `typeof` 语句对这些值返回 `string`、`number`、`boolean`——而不是 `object`。\n\n所有的 JavaScript\
  \ 内置对象都从顶层的 `Object.prototype` 对象继承属性和方法。例如，这为低级对象（如 `Date.prototype`）提供了一个 `toLocaleString()`\
  \ 方法，因此你可以向 `Date` 对象附加该方法的调用，以获取一个本地化格式的日期字符串。\n\n你也可以在原始字符串、数字和布尔字面值上调用继承的方法，因为\
  \ JavaScript 会自动从等效对象调用该方法。这意味着你可以向数字字面值附加 `toLocaleString()` 方法调用，以获取本地化格式的数字字符串。\n\
  \n![image](img/hot.jpg)\n\n如果你是从头开始读这本书，你应该已经对 `String`、`Number`、`Boolean`、`Error`\
  \ 和 `Object` 对象了于熟悉。`Array` 对象在此处介绍，`Date` 对象在此处介绍，`RegExp` 对象在此处介绍，而 `Math` 对象在此处介绍。\n\
  \n![image](img/1p.jpg)创建一个带有自执行函数的 HTML 文档，该函数比开始将原始字面值赋值给三个变量\n\n```javascript\n\
  let jsString = ‘Text’ // 而不是 new String( ‘Text’ ).\nlet jsNumber = 125000// 而不是\
  \ new Number( 125000 ).\nlet jsBoolean = true // 而不是 new Boolean( true ).\n```\n\
  \n![image](img/htmlp.jpg)\n\nbuiltin.html\n\n![image](img/2p.jpg)接下来，赋值值以创建每个类型的对象\n\
  \n```javascript\nlet jsObject = { firstName: ‘Mike’, lastName: ‘McGrath’ }\nlet\
  \ jsDate = new Date()\nlet jsArray = [ 1, 2, 3 ]\nlet jsRegExp = /ineasysteps/i\n\
  let jsMath = Math\nlet jsError = new Error( ‘Error!’ )\n```\n\n![image](img/3p.jpg)现在，插入语句输出\
  \ Date 对象的内容和本地化格式的日期字符串\n\n```javascript\nconsole.log( ‘Date Object: ‘ + jsDate\
  \ )\nconsole.log( ‘Locale Date String: ‘ + jsDate.toLocaleString() )\n```\n\n![image](img/4p.jpg)然后，插入语句输出原始字面数字值和本地化格式的数字字符串\n\
  \n```javascript\nconsole.log( ‘\\nPrimitive Number: ‘ + jsNumber )\nconsole.log(\
  \ ‘Locale Number String: ‘ + jsNumber.toLocaleString() )\n```\n\n![image](img/5p.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它并启动控制台查看输出字符串\n\n![image](img/pg379_1.jpg)\n\n![image](img/forget.jpg)\n\
  \n`Math` 对象是唯一不提供构造方法的 JavaScript 对象。\n\n## 创建数组\n\n`Array` 对象是一个 JavaScript 内置对象，可以将多个项目（各种数据类型）存储在单个“元素”中。数组通过给变量赋值\
  \ `[]` 方括号来创建，该括号可以包含一个用逗号分隔的值列表以初始化数组元素。它的语法如下：\n\n![image](img/pg380_1.jpg)\n\n\
  ```javascript\nlet arrayName = [ value1 , value2 , value3 ]\n```\n\n与自定义对象（每个属性都有名称）不同，数组元素会自动编号——从零开始。因此第一个元素是\
  \ 0，第二个是 1，第三个是 2，以此此类推。这种编号系统通常被称为“零索引”。\n\n存储在数组元素中的值可以通过在对象名称后的方括号中包含元素索引数字来引用。例如，`colors[0]`\
  \ 将引用名为 `colors` 的数组中第一个元素的值。\n\n如果数组元素不需要立即初始化，可以创建一个数组并在稍后对其元素赋值，如下所示：\n\n```javascript\n\
  let colors = []\ncolors[0] = ‘Red’\ncolors[1] = ‘Green’\n```\n\n虽然 `Array` 提供了构造方法，但不应使用它来指定整数参数——创建一个空数组，如下所示：\n\
  \n```javascript\nlet jsArray = new Array(10)\n```\n\n你可能会预期 `jsArray[0]` 引用 10，但实际上返回的是\
  \ `undefined`。这是什么情况？这种异常只发生在你向构造方法指定单个整数时——创建一个空数组。\n\n所有内置对象名称都以大写字母开头——所以构造函数名为“Array”，而不是“array”。\n\
  \n![image](img/1p.jpg)创建一个带有自执行函数的 HTML 文档，该函数比创建一个数组——错误的方法\n\n```javascript\n\
  let jsArray = new Array(10)\n```\n\n![image](img/htmlp.jpg)\n\narray.html\n\n![image](img/2p.jpg)接下来，添加语句输出第一个元素的值并列出整个数组\n\
  \n```javascript\nconsole.log( jsArray[0])\nconsole.log( jsArray)\n```\n\n![image](img/3p.jpg)现在，添加一个语句声明变量，并初始化为数组的变量\n\
  \n```javascript\nlet month, summer = [ ‘June‘, ‘July‘, ‘August’ ]\n```\n\n![image](img/4p.jpg)然后，添加一个循环输出每个数组元素的索引数和值\n\
  \n```javascript\nfor ( month in summer )\n{\n  if ( month !== ‘’ )\n  {\n    console.log(\
  \ month + ‘: ‘ + summer[month] )\n  }\n}\n```\n\n![image](img/5p.jpg)最后添加语句输出第一个元素的值并列出整个数组\n\
  \n```javascript\nconsole.log( ‘Start of Summer: ‘ + summer[0] )\nconsole.log( summer\
  \ )\n```\n\n## 循环元素\n\n数组和循环是极佳的搭档！任何类型的循环都可以用于填充数组元素。即使是大型数组的元素也可以通过这种方式“填充”——而且代码非常少。\n\
  \n同样，可以使用循环快速读取每个数组元素中的值，并在循环的每次迭代中对该值执行适当的操作。\n\n有用的是，每个数组都有 `length` 属性，包含该数组元素总数的整数记录。由于零索引的结果，该值总是比最后一个元素的索引数大一，因此可以很容易地用于条件测试以终止循环。\n\
  \n\n\n\n\n![image](img/1p.jpg)创建一个 HTML 文档，其中包含一个自执行函数，该函数首先声明三个变量\n\n`let i, result,\
  \ boolArray = [ ]`\n\n![image](img/htmlp.jpg)\n\nelements.html\n\n![image](img/2p.jpg)接下来，输出一个简单的标题\n\
  \n`console.log( ‘Fill Elements...’ )`\n\n![image](img/3p.jpg)现在，添加一个循环来填充 10 个布尔值元素，并输出它们的索引号和每个存储的值\n\
  \n```\nfor( i = 1 ; i < 11 ; i++ )\n{\n  boolArray[ i ] = ( i % 2 === 0 ) ? true\
  \ : false\n  console.log( ‘Element ‘ + i + ‘: ‘ + boolArray[ i ] )\n}\n```\n\n![image](img/4p.jpg)然后，输出第二个简单的标题并初始化一个为空字符串值的变量\n\
  \n`console.log( ‘Read Elements...’ )`\n`result = ‘’`\n\n![image](img/5p.jpg)接下来，添加一个循环，将任何包含\
  \ true 元素的索引号赋值给字符串\n\n```\nfor( i = 1 ; i < boolArray.length ; i++ )\n{\n  if(\
  \ boolArray[ i ] ) { result += i + ‘ | ‘ }\n}\n```\n\n![image](img/hot.jpg)\n\n\
  这里的数组 `length` 属性值为 11，因为数组有十一个元素——尽管零索引元素尚未填充。\n\n![image](img/6p.jpg)现在，输出字符串以显示包含\
  \ true 值的元素的索引号\n\n`console.log( ‘True in Elements: ‘ + result )`\n\n![image](img/7p.jpg)将字符串变量重置为包含一个空字符串\n\
  \n`result = ‘‘`\n\n![image](img/8p.jpg)然后，添加一个循环，将任何包含 false 值的元素的索引号赋值给字符串\n\n\
  ```\nfor( i = 1 ; i < boolArray.length ; i++ )\n{\n  if( !boolArray[ i ] ) { result\
  \ += i + ‘ | ‘ }\n}\n```\n\n![image](img/9p.jpg)最后，输出字符串以显示包含 false 值的元素的索引号\n\n\
  `console.log( ‘False in Elements: ‘ + result )`\n\n![image](img/10p.jpg)保存 HTML\
  \ 文档，然后在浏览器中打开它并启动控制台来写入和读取数组元素\n\n![image](img/pg383_1.jpg)\n\n![image](img/forget.jpg)\n\
  \n布尔值的条件测试不需要包含表达式 `=== true`，因为这是自动完成的。\n\n# 切片数组\n\nJavaScript 对象具有属性和方法。除了 `length`\
  \ 属性外，每个数组对象都有可以用于操作数组元素的方法。这些方法列在下表中，并附有它们所执行任务的简要描述：\n\n![image](img/pg384_1.jpg)\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `join( *separator* )` | 将所有元素值合并为一个字符串，并用指定的分隔符隔开；如果没有指定分隔符，则使用逗号\
  \ |\n| `pop( )` | 删除数组的最后一个元素并返回其值 |\n| `push( *value , value* )` | 在数组末尾添加元素并返回新的长度\
  \ |\n| `reverse( )` | 反转数组中所有元素的顺序并返回每个元素重排序后的值 |\n| `shift( )` | 删除数组的第一个元素并返回其值\
  \ |\n| `slice( *begin , end* )` | 返回指定索引位置之间的元素；如果没有指定结束位置，则返回到数组末尾 |\n| `sort(\
  \ )` | 将数组中的所有元素按字母或数字顺序排序，并返回每个元素重排序后的值 |\n| `splice( *position , number, value,\
  \ value* )` | 从指定的索引位置开始替换指定数量的元素值，并返回被替换的值 |\n| `unshift( *value , value* )` |\
  \ 在数组开头添加元素并返回新的长度 |\n\n当 `push( )` 或 `unshift()` 方法未指定任何值时，将向数组添加一个单一空元素。可以指定一个逗号分隔的值列表传递给\
  \ `push()`、`unshift()` 和 `splice()` 方法以更改多个元素。\n\n![image](img/hot.jpg)\n\n`join(\
  \ )` 方法在将大量元素值合并为单个字符串时更快，但 `+` 拼接运算符在合并少数元素值时更快。\n\n![image](img/snake.jpg)\n\n\
  `slice( )` 方法返回直至但不包含可选的结束索引位置的元素值。\n\n![image](img/1p.jpg)创建一个 HTML 文档，其中包含一个自执行函数，该函数首先创建一个数组\n\
  \n`let seasons = [ ‘Spring’, ‘Summer’, ‘Fall’, ‘Winter’ ]`\n`console.log( ‘Elements:\
  \ ‘ + seasons )`\n\n![image](img/htmlp.jpg)\n\nslice.html\n\n![image](img/2p.jpg)接下来，输出修改后的元素列表\n\
  \n`console.log( ‘Joined: ‘ + seasons.join( ‘ & ‘ ) )`\n\n![image](img/3p.jpg)现在，从数组中提取最后一个元素\n\
  \n`console.log( ‘Popped: ‘ + seasons.pop( )`\n\n![image](img/4p.jpg)然后，将最后一个元素放回数组\n\
  \n`console.log( ‘Pushed: ‘ + seasons.push( ‘Winter’ )`\n\n![image](img/5p.jpg)接下来，仅输出两个元素\n\
  \n`console.log( ‘Sliced: ‘ + seasons.slice( 1, 3 ) )`\n\n![image](img/6p.jpg)最后，替换第三个元素的值\n\
  \n`console.log( ‘Spliced: ‘ + seasons.splice( 2, 1, ‘Autumn’ ) )`\n\n![image](img/7p.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它并启动控制台查看被操作的元素\n\n![image](img/pg385_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n使用不替换值的 `slice( )` 方法可以删除指定位置指定数量的元素，它将重新编号后续的所有元素。\n\n![image](img/forget.jpg)\n\
  \n`shift( )` 和 `unshift()` 方法类似于 `pop( )` 和 `push( )`，但作用于第一个元素而不是最后一个。`reverse(\
  \ )` 和 `sort( )` 方法将在下面的示例中使用](#chapter18.xhtml_sec190)。\n\n# 排序元素\n\n通常需要使用数组 `sort(\
  \ )` 方法按特定顺序排列数组的元素值。这可以选择地指定一个比较函数参数来定义排序顺序。\n\n![image](img/pg386_1.jpg)\n\n当未指定比较函数时，`sort(\
  \ )` 方法默认将将所有元素值转换为字符串，然后按字典顺序进行词法排序——比较每个第一个字符，然后是第二个字符，依此类推。当元素包含仅在大小上不同的匹配字符串时，大写字母较多的字符串获得较低的索引位置——出现在大写字母较少的字符串之前。\n\
  \n\n\n\n由 `sort()` 方法指定的比较函数将连续接收的一对对元素值以进行比较，并且它必须返回一个整数值来表示每次比较的结果。当第一个值大于第二个值时，它应该返回一个大于零的值，表示第一个值应该被排序到较高的索引位置——即出现在第二个值之后。相反，比较函数应该返回小于零的值，表示第一个值应该被排序到较低的索引位置——即出现在第二个值之前。当两个值相同时，应返回零，表示元素的位置应保持不变。当所有比较都完成后，元素将按数值升序排列。如果需要降序排列，则可以使用数组的\
  \ `reverse()` 方法来反转元素顺序。\n\n如果比较函数正在比较数值型元素值，它只需要返回第一个传入值减去第二个传入值的结果即可达到所需的效果。\n\
  \n![image](img/forget.jpg)\n\n记住，`sort()` 实际上会重新排列存储在数组元素中的值。\n\n![image](img/hot.jpg)\n\
  \n`sort()` 方法的默认行为等于使用以下语句比较参数 `x` 和 `y` 的比较函数：\n\n```\nif( x > y ) return 1 else\
  \ if( x < y ) return -1 else return 0\n```\n\n![image](img/1p.jpg)创建一个带有自执行函数的 HTML\
  \ 文档，该函数开始创建两个数组\n\n```javascript\nlet hues = [ ‘Red’, ‘RED’, ‘red’, ‘Green’, ‘Blue’\
  \ ]\nlet nums = [ 1, 20, 3, 17, 14, 0.5 ]\n```\n\n![image](img/htmlp.jpg)\n\nsort.html\n\
  \n![image](img/2p.jpg)接下来，输出每个数组中的值，并按字典排序顺序输出它们的元素值\n\n```javascript\nconsole.log(\
  \ ‘Colors: ‘ + hues )\nconsole.log( ‘Dictionary Sort: ‘ + hues.sort( ) )\nconsole.log(\
  \ ‘\\nNumbers: ‘ + nums )\nconsole.log( ‘Dictionary Sort: ‘ + nums.sort( ) )\n```\n\
  \n![image](img/3p.jpg)现在，添加一个语句，在调用比较函数后输出排序后的数值\n\n```javascript\nconsole.log(\
  \ ‘Numerical Sort: ‘ + nums.sort( sortNums ) )\n```\n\n![image](img/4p.jpg)最后，在函数块中添加一个语句，按降序输出数值\n\
  \n```javascript\nconsole.log( ‘Reversed Sort: ‘ + nums.reverse( ) )\n```\n\n![image](img/5p.jpg)接下来，在脚本中添加比较函数\n\
  \n```javascript\nfunction sortNums( numOne, numTwo ) {\n  return numOne - numTwo\n\
  }\n```\n\n![image](img/6p.jpg)保存该 HTML 文档，然后在浏览器中打开它并启动控制台查看排序后的元素\n\n![image](img/pg387_1.jpg)\n\
  \n![image](img/snake.jpg)\n\n当 `sort()` 方法指定比较函数时，必须仅通过函数名指定它——不要在 `sort()` 方法的参数中在比较函数名后包含尾随括号。\n\
  \n### 获取日期\n\n内置的 JavaScript `Date` 对象提供了表示特定日期、时间和时区的组件。使用 `new` 关键字、`Date()` 对象构造函数和变量名赋值来创建\
  \ `Date` 对象的实例。在不向构造函数传递任何参数的情况下，新的 `Date` 对象将根据运行浏览器的计算机的系统时间表示其创建时的日期时间。不考虑系统时间是否准确对应世界标准时间\
  \ (UTC) 或格林治标准时间 (GMT)。\n\n![image](img/pg388_1.jpg)\n\n计算机日期和时间以数值测量，为自 1970 年\
  \ 1 月 1 日 00:00:00 以来的经过时间——这个时间点通常被称为“元”（epoch）。在 JavaScript 中，经过的时间记录为自元以来的毫秒数。可以使用\
  \ `Date` 对象的 `getTime()` 方法提取此数字，并可以将其减去另一个 `Date` 对象的值，以计算脚本中两点之间的时间——例如，计算执行循环所需的时间。\n\
  \n可以使用 `toString()` 方法提取 `Date` 对象内部组件的字符串，或使用 `toUTCString()` 方法将其转换为 UTC 时间。\n\
  \n通过检查当前 `Date` 对象的 `getTimezoneOffset()` 方法返回的值，JavaScript 可以确定用户所在的时区（假设系统已正确设置为本地时区）。该方法返回一个整数，表示当前本地时间与\
  \ UTC 时间相的分钟数。计算是以分钟而不是小时为单位，因为某些时区的偏移不是一小时的间隔——例如，加拿纽芬兰是 UTC -3:30（夏令时期间为 UTC -2:30）。\n\
  \n时区偏移值可用于为美国时区提供本地化定制，但必须在夏令期间通过减去 60（分钟）进行调整。对应的示例调用了 `Date` 对象的 `getMonth()`\
  \ 和 `getDate()` 方法，如果当前日期未实行夏令时，则调整时区偏移值。\n\n![image](img/hot.jpg)\n\n更多示例请参见此处，那里演示了如何使用\
  \ `Date` 对象的组件。\n\n通过调用 `Date` 对象的许多方法来获取日期。\n\n![image](img/1p.jpg)创建一个带有自执行函数的\
  \ HTML 文档，该函数通过初始化三个变量开始\n\n```javascript\nconst now = new Date( )\nlet offset =\
  \ now.getTimezoneOffset( )\nlet dst = 60\n```\n\n![image](img/htmlp.jpg)\n\ndate.html\n\
  \n![image](img/2p.jpg)接下来，添加语句从 11 月 3 日关闭夏令时\n\n```javascript\nif( now.getMonth(\
  \ ) < 3 ) && ( now.getDate( ) < 10 )\n  { dst = 0 }\nif( now.getMonth( ) > 9 ) &&\
  \ ( now.getDate( ) > 2 )\n  { dst = 0 }\n```\n\n![image](img/3p.jpg)现在，添加一个语句建立时区\n\
  \n```javascript\nswitch( offset )\n{\n  case ( 300 ) : offset = ‘East Coast’ ; break\n\
  \  case ( 360 ) : offset = ‘Central’ ; break\n  case ( 420 ) : offset = ‘Mountain’\
  \ ; break\n  case ( 480 ) : offset = ‘Pacific’ ; break\n  default : offset = ‘All’\n\
  }\n```\n\n![image](img/4p.jpg)最后，添加语句输出日期、时间以及合适的问候语\n\n```javascript\nconsole.log(\
  \ ‘System Time: ‘ + now.toString( ) )\nconsole.log( ‘UTC (GMT) Time: ‘ + now.toUTCString(\
  \ ) )\nconsole.log( ‘\\nWelcome to ‘ + offset + ‘ Visitors’ )\n```\n\n![image](img/5p.jpg)保存该\
  \ HTML 文档，然后在浏览器中打开它并启动控制台查看元素排序\n\n![image](img/pg389_1.jpg)\n\n![image](img/snake.jpg)\n\
  \n`getMonth()` 方法返回一个从 0 开始的索引，其中三月位于位置 2——关于此更多信息请见下一个示例此处。\n\n![image](img/hot.jpg)发现时区可以引导浏览器进入进入该时区的页面——例如，为太平洋时区的用户提供一个仅包含加州经销商的页面。但要注意，系统时间可以被用户轻松更改任何时间、日期或时区，因此可能无法报告其实位置。\n\
  \n### 提取日历\n\nJavaScript `Date` 对象提供了独立的方法来提取其年份、月份、日期和星期的每个日期组件：\n\n![image](img/pg390_1.jpg)\n\
  \n| 方法 | 返回 |\n| :--- | :--- |\n| `getFullYear()` | 四位数年份 (yyyy) |\n| `getMonth()`\
  \ | 月份索引数字 (0-11) |\n| `getDate()` | 日期数字 (1-31) |\n| `getDay()` | 星期索引数字 (0-6)\
  \ |\n\n`Date` 对象的 `getFullYear()` 方法返回四位数的年份，例如 2025，而 `Date` 对象的 `getDate()` 方法返回月份中的几——因此在每月的第一天它返回\
  \ 1。\n\n\n\n\n由于国际化的原因，`getMonth()` 和 `getDay()` 返回的是索引值，这些值必须通过脚本转换为本地语言的月份和日期名称。月份名称的转换很容易实现：只需创建一个包含所有月份名称的数组（从一月开始），然后使用\
  \ `getMonth()` 返回的索引值从数组元素中引用相应的月份。\n\n同样，日期名称的转换也是通过创建一个包含所有星期名称的数组（从星期日开始），然后使用\
  \ `getDay()` 方法返回的索引值从数组元素中引用相应的日期来实现。\n\n随后，可以将这些组件组合成日期字符串，并根据任何区域偏好的日期格式进行排列。\n\
  \n![image](img/1p.jpg)创建一个带有自执行函数的 HTML 文档，该函数从初始化变量开始\n\n`const days = [ ‘Sun’,\
  \ ‘Mon’, ‘Tue’, ‘Wed’, ‘Thu’, ‘Fri’, ‘Sat’ ]`\n\n`const months = [ ‘Jan’, ‘Feb’,\
  \ ‘Mar’, ‘Apr’, ‘May’, ‘Jun’, ‘Jul’, ‘Aug’, ‘Sep’, ‘Oct’, ‘Nov’, ‘Dec’ ]`\n\n`const\
  \ now = new Date( )`\n\n![image](img/htmlp.jpg)\n\ncalendar.html\n\n![image](img/2p.jpg)接下来，添加语句使用\
  \ Date 对象的方法来提取单个日期组件\n\n`let year = now.getFullYear( )`\n\n`let month = now.getMonth(\
  \ )`\n\n`let dayNumber = now.getDate( )`\n\n`let dayName = now.getDay( )`\n\n![image](img/3p.jpg)现在，添加语句将提取的索引值转换为月份名称和日期名称\n\
  \n`month = months[ month ]`\n\n`dayName = days[ dayName ]`\n\n![image](img/4p.jpg)然后，将日期组件拼接成日期字符串——包括美式和英式日期格式\n\
  \n`let usDate = dayName + ‘, ‘ + month + ‘ ‘ + dayNumber + ‘, ‘ + year`\n\n`let\
  \ ukDate = dayName + ‘, ‘ + dayNumber + ‘ ‘ + month + ‘, ‘ + year`\n\n![image](img/5p.jpg)最后，添加语句输出每个日期字符串\n\
  \n`console.log( ‘U.S. Date: ‘ + usDate )`\n\n`console.log( ‘U.K. Date: ‘ + ukDate\
  \ )`\n\n![image](img/6p.jpg)保存 HTML 文档，然后在浏览器中打开它并启动控制台查看格式化的日期字符串\n\n![image](img/pg391_1.jpg)\n\
  \n![image](img/forget.jpg)\n\n月份索引从零 (0) 开始，而不是一 (1)——例如，三月的索引是 [2] 而不是 [3]。\n\n\
  ## 提取时间\n\nJavaScript Date 对象提供了单独的方法来提取其每个时间组件，包括时、分、秒和毫秒：\n\n![image](img/pg392_1.jpg)\n\
  \n| 方法 | 返回 |\n| :--- | :--- |\n| `getHours()` | 小时（数字 0-23） |\n| `getMinutes()`\
  \ | 分钟（数字 0-59） |\n| `getSeconds()` | 秒（数字 0-59） |\n| `getMilliseconds()` | 毫秒（数字\
  \ 0-999） |\n\nDate 对象的 `getHours()` 方法返回 24 小制的小时——范围为 0-23 的值。`getMinutes()` 和\
  \ `getSeconds()` 方法都返回范围在 0-59 的值。还有一个 `getMilliseconds()` 方法用于获得更高的精度，返回范围在 0-999\
  \ 的值。\n\n每个组件的值可以拼接成时间字符串，但通常最好在单数的分钟和秒值前添加前零以获得更好的可读性。例如，10:05:02 比 10:5:2 更好。\n\
  \n通过检查小时值来确定用户的系统时间当前是早上、下午还是晚上，可以创建一个合适的问候字符串。\n\n对于需要 12 小时制时间格式的情况，可以通过检查小时值以及所有减去\
  \ 12 的 PM 小时值来创建“AM”或“PM”后缀。例如，13:00 可以转换为 1:00 PM。\n\n![image](img/snake.jpg)\n\
  \n时间组件基于用户的系统时间——而该时间可能准确。\n\n![image](img/1p.jpg)创建一个带有自执行函数的 HTML 文档，该函数从初始化五个变量开始\n\
  \n`const now = new Date( )`\n\n`let hour = now.getHours( )`\n\n`let minute = now.getMinutes(\
  \ )`\n\n`let second = now.getSeconds( )`\n\n`let millisecond = now.getMilliseconds(\
  \ )`\n\n![image](img/htmlp.jpg)\n\ntime.html\n\n![image](img/2p.jpg)接下来，添加语句为小于\
  \ 10 的分钟和秒值前加零\n\n`if( minute < 10 ) { minute = ‘0’ + minute }`\n\n`if( second <\
  \ 10 ) { second = ‘0’ + second }`\n\n![image](img/3p.jpg)现在，将时间组件拼接成字符串，然后输出该字符串\n\
