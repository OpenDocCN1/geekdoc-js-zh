  \ 动画\n\nCSS 可以动态修改属性值，在指定的时间内改变它们的颜色、大小、位置、方向等，从而通过 `transition` 属性创建简单的动画效果。\n\n\
  ![image](img/pg274_1.jpg)\n\n`transition` 属性必须指定要修改的 CSS 属性以及效果的持续时间——例如，一个样式规则\
  \ `transition : width 5s ;` 用于在五秒内修改元素的宽度。多个属性可以以属性和持续时间对的逗号分隔列表的形式指定，例如 `transition\
  \ : width 5s, height 3s ;` 同时修改宽度和高度。\n\n（注：原文后部分存在大量重复占位符和乱码，已根据核心逻辑进行清理翻译）\n\n\
  \n\n\n\n![image](img/1o.jpg)创建一个 HTML 文档，其中一个 `div` 元素包含一个内部 `div` 元素\n\n```html\n\
  <div class=\"ball\">\n<div class=\"label\">Animation</div></div>\n```\n\n![image](img/htmlo.jpg)\n\
  \nanimation.html\n\n![image](img/2o.jpg)接下来，添加一个样式表，通过规则指定外部 `div` 元素的位置和外观\n\n\
  ```css\ndiv.ball { position : absolute ; top : 10px ; width : 120px ; height : 120px\
  \ ; color : White ; font : 1.5em sans-serif ; background : Orange ; border-radius\
  \ : 50% ; }\n```\n\n![image](img/3o.jpg)现在，添加规则指定内部 `div` 元素的外观\n\n```css\ndiv.label\
  \ { display : table-cell ; width : 120px ; height : 120px ; text-align : center\
  \ ; vertical-align : middle ; }\n```\n\n![image](img/4o.jpg)然后，添加一个关键帧规则来定义动画名称并指定动画的节点\n\
  \n```css\n@keyframes bounce { from { top : 10px ; } 50% { top : 40px ; } to { top\
  \ : 100px ; } }\n```\n\n![image](img/5o.jpg)最后，添加一条规则将动画绑定到外部 `div` 元素\n\n```css\n\
  div.ball { animation : bounce 2s linear infinite alternate ; }\n```\n\n![image](img/6o.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它以查看动画\n\n![image](img/pg277_1.jpg)\n\n![image](img/pg277_2.jpg)\n\
  \n![image](img/hot.jpg)\n\n此示例中不需要动画延迟，因此在样式规则中省略了该值，浏览器使用默认的零延迟值。\n\n## 适应对象 (Fit\
  \ Objects)\n\nCSS 提供了多种方法来操作图像或视频内容。通过将 `<img>` 或 `<video>` 元素设置为块级元素并将左右外边距设置为\
  \ `auto` 值，就可以简单地让它们在容器内居中。\n\n![image](img/pg278_1.jpg)\n\n趣的是，你可以使用 CSS `object-fit`\
  \ 属性指定图像或视频内容如何适应 `<img>` 或 `<video>` 元素本身。通过指定下面列出的任何值，可以决定内容是被拉伸、压缩、缩放还是裁剪：\n\n\
  | 值: | 适应模式: |\n| :--- | :--- |\n| **fill** | 内容被拉伸或压缩以填充元素的内容框（默认值） |\n| **contain**\
  \ | 内容被放大或缩小以保持其宽高比并适应在元素的内容框内 |\n| **cover** | 内容被缩放以保持其宽高比并填充元素的内容框，因此可能会被裁剪 |\n\
  | **scale-down** | 内容被缩小以在较小的内容框中保持其宽高比 |\n| **none** | 内容不调整大小，因此可能会被裁剪 |\n\n理解这些值如何影响对象适应其内容框的最佳方法可能是通过对比：\n\
  \n![image](img/1o.jpg)创建一个包含六个元素的 HTML 文档，它们将显示相同的图像——但适应方式不同\n\n```html\n<img src=\"\
  run.png\" alt=\"Run\">\n<img class=\"scale-down short\" src=\"run.png\" alt=\"Run\"\
  >\n<img class=\"none short\" src=\"run.png\" alt=\"Run\">\n<img class=\"fill tall\"\
  \ src=\"run.png\" alt=\"Run\">\n<img class=\"contain tall\" src=\"run.png\" alt=\"\
  Run\">\n<img class=\"cover tall\" src=\"run.png\" alt=\"Run\">\n```\n\n![image](img/htmlo.jpg)\n\
  \nfit.html\n\n![image](img/pngo.jpg)\n\nrun.png\n\n150px x 120px\n\n![image](img/2o.jpg)添加一个样式表，通过规则指定每个元素的外观并设置宽度匹配图像宽度\n\
  \n```css\nimg { display : inline-block ; border : 2px solid DarkOrange ; margin\
  \ : 5px ; width : 150px ; }\n```\n\n![image](img/3o.jpg)接下来，添加样式规则，使某些内容框比 120 像素的图像高度更短，某些更高\n\
  \n```css\nimg.short { height : 80px ; }\nimg.tall { height : 200px ; }\n```\n\n\
  ![image](img/4o.jpg)现在，添加规则指定图像如何适应它们各自的内容框\n\n```css\nimg.scale-down { object-fit\
  \ : scale-down ; }\nimg.none { object-fit : none ; }\nimg.fill { object-fit : fill\
  \ ; }\nimg.contain { object-fit : contain ; }\nimg.cover { object-fit : cover ;\
  \ }\n```\n\n![image](img/5o.jpg)保存 HTML 文档，然后在浏览器中打开它，比较对象如何适应在每个内容框内\n\n![image](img/pg279_1.jpg)\n\
  \n## 总结\n\n- 可以使用关键字指定指针悬停在选定元素上时显示的光标类型。\n- 可以通过指定 CSS `:focus` 伪类的值来指示页面中当前选中的交互组件。\n\
  - 用户操作引起的界面事件由 CSS `:focus`、`:hover` 和 `:active` 伪类识别。\n- `MouseOver` 和 `MouseOut`\
  \ 状态可用于链接、脚本或表单提交按钮创建悬停效果。\n- 相对定位的缩图元素可以显示一个位于其正下方绝对定位较大的元素。\n- 通过为 `border-radius`\
  \ 属性指定半径大小，内容框边框可以有圆角。\n- 通过为 `box-shadow` 或 `text-shadow` 属性指定偏移值，内容框和文本可以有阴影。\n\
  - 线性渐变和径向渐变用指定颜色停止点之间的混合颜色填充内容框。\n- 通过拉伸或平铺指定 `border-image` 属性的切片图像来装饰内容框边框。\n\
  - 变换（Transformations）操作内容框以改变其尺寸、位置或方向。\n- 过渡（Transitions）在指定的时间内修改属性值以创建简单的动画效果。\n\
  - 动画（Animations）在一段时间内修改属性值，并指定关键帧来确定特定点的值。\n- 图像和视频可以被拉伸、压缩、缩放或裁剪以适应内容框内部。\n\n\
  ### 13 控制网页\n\n![image](img/pg235_1.jpg)\n\n*本章演示了 HTML 文档中的列布局、flex 布局和网格布局。*\n\
  \n- 改变模型\n- 绘制轮廓\n- 使用列\n- 跨列\n- 使用 Flexbox\n- 对齐项目\n- 使用网格\n- 放置项目\n- 查询媒体\n- 切换导航\n\
  - 总结\n\n## 改变模型 (Change Models)\n\n网络浏览器应用位于“用户样式表”中的默认元素样式，会自动对某些元素应用边距。例如，`<body>`\
  \ 元素默认具有 8 像素的外边距。你可以在大多数浏览器中按 `F12` 键打开开发者工具并选择 `body` 元素来检查这一点：\n\n![image](img/pg282_1.jpg)\n\
  \n![image](img/htmlo.jpg)\n\ndefault.html\n\n![image](img/pg282_2.jpg)\n\n此外，浏览器的默认盒模型会将指定的内边距和边框应用于元素尺寸之外，因此元素的整体尺寸会比指定的大。例如，一个指定具有\
  \ 2 像素边框和 100x70 像素尺寸的 `<ul>` 列表元素通常会获得 16 像素的上下边距、40 像素的左填充（用于列表标记）以及内容框外的 2 像素边框。这使得元素的整体尺寸变为\
  \ 144 x 106 像素：\n\n![image](img/pg282_3.jpg)\n\n![image](img/pg282_4.jpg)\n\nCSS\
  \ `box-sizing` 属性的默认值为 `content-box`。\n\n为了控制这些默认浏览器行为，你可以在每个样式表的开头使用这些通用规则：\n\n\
  ```css\n* { margin : 0 ; padding : 0 ; box-sizing : border-box ; }\n```\n\n这会覆盖浏览器的默认样式，使边距和内边距不再自动应用到元素上。\n\
  \n\n\n\n此外，浏览器的默认盒模型将不再将你指定的内边距（padding）和边框（borders）应用于元素尺寸之外，因此元素的整体尺寸将完全符合你的指定。例如，一个指定为\
  \ 2 像素边框且大小为 100 x 70 像素的 `<ul>` 列表元素，现在不再产生外边距或内边距，2 像素的边框现在位于内容框内部。这使得元素的整体尺寸正如你的规范所示为\
  \ 100 x 70 像素：\n\n![image](img/pg283_2.jpg)\n\n![image](img/pg283_3.jpg)\n\n![image](img/hot.jpg)\n\
  \n你现在拥有了控制权，如果需要可以为列表标记添加左侧内边距。\n\n## 绘制轮廓 (Draw Outlines)\n\nCSS 提供了三个应用于用户界面的属性，作为普通盒模型的补充。其中前两个可以用于为元素添加轮廓。`outline`\
  \ 属性接受与 `border` 属性相同的值——例如，使用 `outline : 2px solid RoyalBlue ;` 可以在元素周围绘制一个 2 像素的蓝色轮廓。\n\
  \n![image](img/pg284_1.jpg)\n\n至关重要的是，与边框不同，轮廓不是元素尺寸的一部分，因此元素的总宽度和高度不受添加轮廓的影响。轮廓是在\
  \ Z 轴的另一个层层级上绘制的，因此可能会与其他内容重叠。\n\n此外，你可以通过为 `outline-offset` 属性指定距离值，在轮廓与元素边缘（或边框）之间添加空间——例如，使用\
  \ `outline-offset : 5px ;` 在元素边缘与轮廓之间添加 5 像素的间隙。\n\n第三个可以应用于用户界面的属性允许用户调整元素的大小，通常通过拖动其右下角。当\
  \ `resize` 属性指定 `both` 值时，允许用户在水平和垂直方向上调整元素的大小。\n\n如果用户通过调整元素来减小其尺寸，内容可能会溢出，因此在使用\
  \ `resize` 属性时，应配合 `overflow` 样式规则来处理内容溢出。重要的是，`overflow` 应该指定为 `scroll`、`auto`\
  \ 或 `hidden`，因为 `resize` 属性不会应用于 `overflow` 设置为 `visible` 的行内元素或块元素。\n\n如果你希望限制用户在两个方向上调整元素的大小，可以为\
  \ `resize` 属性指定一个水平值——这样用户就只能通过拖动角来调整元素的宽度。\n\n相反，你可以为 `resize` 属性指定一个垂直值——这样用户只能通过拖动角来调整元素的高度。\n\
  \n![image](img/forget.jpg)\n\n将所有元素的 `box-sizing` 属性设置为 `border-box` 意味着元素的边缘与其具有任何边框的边缘相同。\n\
  \n![image](img/1bl.jpg)\n\n创建一个包含 div 元素的 HTML 文档\n\n```html\n<div class=\"outline\
  \ resize\">此 div 具有蓝色的轮廓，可以通过拖动其右下角调整大小。</div>\n```\n\n![images](img/htmlbl.jpg)\n\
  \noutline.html\n\n添加一个带有规则的样式表来控制网页页面\n\n```css\n*** { margin : 0 ; padding : 0\
  \ ; box-sizing: border-box ; }\n```\n\n![image](img/3bl.jpg)接下来，添加规则来指定 div 元素的样式\n\
  \n```css\ndiv { width : 420px ; margin : 20px ; padding : 10px ;\nborder : 2px solid\
  \ Black ; background : LightSteelBlue ;\nfont : 1.25em sans-serif ; }\n```\n\n![image](img/4bl.jpg)现在，添加规则为\
  \ div 周围加上轮廓\n\n```css\ndiv.outline {        outline : 10px solid RoyalBlue ;\n\
  outline-offset : 5px ; }\n```\n\n![image](img/5bl.jpg)然后，添加一条规则使 div 可调整大小\n\n```css\n\
  div.resize { resize : both ; overflow : auto ; }\n```\n\n![image](img/6bl.jpg)保存该\
  \ HTML 文档，然后在网页浏览器中打开它以查看轮廓并调整元素大小\n\n![image](img/pg285_1.jpg)\n\n![image](img/pg285_2.jpg)\n\
  \n![image](img/forget.jpg)\n\n轮廓可以与页面内容重叠。\n\n## 使用列 (Use Columns)\n\nCSS 提供了许多属性，可以为文本创建多列布局——就像报纸中的布局一样。\n\
  \n![image](img/pg286_1.jpg)\n\n首先，你需要为 `column-count` 属性指定一个整数值，以确定你想将文本分成多少列——例如，使用\
  \ `column-count : 3 ;` 分三列。通常，这会在列之间创建一个默认宽度为 1em 的间隙（“槽”）——这相当于字体的高度。你也可以通过为 `column-gap`\
  \ 属性指定距离来选择自己的间隙大小——例如，使用 `column-gap : 50px ;` 在列之间创建一个 50 像素宽的间隙。\n\n有了更宽的间隙，你可以通过为\
  \ `column-rule` 属性指定宽度、样式和颜色值来添加一条垂直规则线。它接受与 `border` 属性相同的值，因此使用 `column-rule :\
  \ 5px solid RoyalBlue ;` 会添加蓝色的线。\n\n创建一个包含 div 元素和一些内容的 HTML 文档\n\n```html\n<div\
  \ class=\"newspaper\">\n<h1>CSS</h1>\n级联样式表（CSS）是一种用于描述 HTML 文档呈现方式的语言。虽然主要用于设置网页用户界面的样式，但该语言也可以应用于\
  \ XML 文档、SVG 和 XUL。\n</div>\n```\n\n![image](img/1bl.jpg)\n\nmulticol.html\n\n添加一个带有规则的样式表来控制网页\n\
  \n```css\n*** { margin : 0 ; padding : 0 ; box-sizing: border-box ; }\n```\n\n![image](img/2bl.jpg)接下来，添加规则为\
  \ div 添加外边距并指定两列布局的样式\n\n```css\ndiv.newspaper { margin : 15px ;\ncolumn-count :\
  \ 2 ;\ncolumn-gap : 50px ;\ncolumn-rule : solid ; }\n```\n\n![image](img/3bl.jpg)保存\
  \ HTML 文档，然后在网页浏览器中打开它以查看多列布局\n\n![image](img/4bl.jpg)修改步骤 3 中的规则——将外观改为带有间隙的三列布局\n\
  \n```css\ndiv.newspaper { margin : 15px ;\ncolumn-count : 3 ;\ncolumn-gap : 50px\
  \ ;\ncolumn-rule : 5px dotted RoyalBlue ; }\n```\n\n![image](img/5bl.jpg)再次保存 HTML\
  \ 文档，然后刷新浏览器以查看新的多列布局\n\n![image](img/6bl.jpg)\n\n![image](img/hot.jpg) \n\n这里的默认\
  \ `column-rule-color` 值源自文本颜色——为文本添加颜色规则也将更改线条颜色以匹配——例如，使用 `color : Red ;` 更改文本和线条颜色。\n\
  \n![image](img/snake.jpg)\n\n将此示例设置为许多列会导致标题与其他内容重叠——解决方案在后续示例中演示。\n\n## 跨列 (Span\
  \ Columns)\n\n除了在此示例](#chapter13.xhtml_colcnt)中引入的 `column-count`、`column-gap` 和\
  \ `column-rule` 属性外，CSS 还提供了另外三个用于列布局的属性。\n\n![image](img/pg288_1.jpg)\n\n当你希望标题等元素跨越列时，可以为\
  \ `column-span` 属性指定跨越列数的整数值，或使用关键字 `all`。\n\n你也可以通过为 `column-width` 属性指定尺寸来声明列的首选宽度——但浏览器仅将指定的值视为最小宽度建议。如果按照指定的宽度至少无法容纳至少两列，它将退回到单列布局。\n\
  \n\n\n\n最后，有一个简写属性 `columns`，可用于同时指定 `column-width` 和 `column-count` 值。通过使用 `columns`\
  \ 和 `column-rule` 简写属性，可以非常简洁地指定大量的列布局值。\n\n![image](img/1bl.jpg)创建一个包含文本内容和两个标题的\
  \ div HTML 文档\n\n```html\n<div class=\"newspaper\">\n<h1>专业 Word 文档</h1>\n<p>为了让你的文档看起来像是专业制作的，Word\
  \ 提供了页眉、页脚、封面和文本框设计，这些设计相得益彰。你可以添加匹配的封面、页眉和侧边栏。点击“插入”，然后从不同的库中选择你需要的元素。</p>\n<h2>协调的文档样式</h2>\n\
  <p>主题和样式也有助于保持你文档的协调性。当你点击“设计”并选择一个新主题时，图片、图表和 SmartArt 图形将更改以匹配你的新主题。当你应用样式时，你的标题将更改以匹配新主题。</p>\n\
  </div>\n```\n\n![images](img/htmlbl.jpg)\n\nspancol.html\n\n![image](img/2bl.jpg)添加带有规则的样式表以控制网页\n\
  \n```css\n* { margin : 0 ; padding : 0 ; box-sizing : border-box ; }\n```\n\n![image](img/3bl.jpg)接下来，添加规则为\
  \ div 添加左右外边距，并指定三列布局的外观——建议列宽为 100 像素\n\n```css\ndiv.newspaper {\nmargin : 0 15px\
  \ ;\ncolumn-gap : 50px ;\ncolumn-rule : 5px solid LightSteelBlue ;\ncolumns : 100px\
  \ 3 ; \n}\n```\n\n![image](img/4bl.jpg)现在，添加规则指定标题的外观，并让两个标题都跨越所有列\n\n```css\nh1,\
  \ h2 {\npadding : 10px 10px 10px ;\nmargin : 20px 0 0 0 ;\nbackground : LightSteelBlue\
  \ ;\ncolumn-span : all ; \n}\n```\n\n![image](img/5bl.jpg)保存 HTML 文档，然后在网页浏览器中打开它，查看多列布局以及跨越列的标题\n\
  \n![image](img/pg289_1.jpg)\n\n![image](img/forget.jpg)\n\n`column-rule` 属性是 `column-width`、`column-style`\
  \ 和 `column-color` 属性的简写。\n\n## 使用 Flexbox\n\n本书中之前的示例使用了绝对定位或相对定位以及通过浮动内容来显示内容。这些方法很重要，但并不是创建响应各种浏览器屏幕尺寸的灵活布局的理想选择。为了满足这一需求，CSS\
  \ 引入了弹性框（“flexbox”）布局方案。\n\n![image](img/pg290_1.jpg)\n\n要创建一个弹性框，你必须首先通过向其 `display`\
  \ 属性指定 flex 值来定义一个元素为“弹性容器”。\n\n弹性容器内部的任何内部元素（“flex 项目”）将显示在单行中。如果行的长度超过浏览器的宽度，行默认不会换行到下一行——除非你为\
  \ `flex-wrap` 属性指定了 `wrap` 值。\n\n你也可以通过为 `flex-wrap` 属性指定 `wrap-reverse` 值来反转行中\
  \ flex 项目的顺序。\n\n因此，要创建一个会将项目换行到行的弹性框，你需要同时对 `display` 和 `flex-wrap` 属性指定值。\n\n\
  ![image](img/1bl.jpg)创建一个包含五个内部 div 元素的 HTML 文档\n\n```html\n<div class=\"flex-container\"\
  >\n<div>One</div>\n<div>Two</div>\n<div>Three</div>\n<div>Four</div>\n<div>Five</div>\n\
  </div>\n```\n\n![images](img/htmlbl.jpg)\n\nflexbox.html\n\n![image](img/2bl.jpg)添加带有规则的样式表以控制网页\n\
  \n```css\n* { margin : 0 ; padding : 0 ; box-sizing : border-box ; }\n```\n\n![image](img/3bl.jpg)接下来，添加规则让外层\
  \ div 具有弹性\n\n```css\ndiv.flex-container {      display : flex ;\nflex-wrap : wrap\
  \ ;\nborder : 2px dashed RoyalBlue ; }\n```\n\n![image](img/4bl.jpg)现在，添加规则指定 flex\
  \ 项目的外观\n\n```css\ndiv.flex-container > div {\npadding : 10px 40px ;\nbackground\
  \ : LightSteelBlue ;\nborder : 2px solid RoyalBlue ;\nfont : 1.25em sans-serif ;\
  \ \n}\n```\n\n![image](img/hot.jpg)\n\n回到绝对定位和相对定位示例此处 以及浮动布局此处。\n\n![image](img/hot.jpg)\n\
  \n所有现代浏览器都支持 flexbox，自从：\n\n![images](img/chrome.jpg) Chrome 29.0\n\n![images](img/edge.jpg)\
  \ Edge 11.0\n\n![images](img/firefox.jpg) Firefox 22.0\n\n![images](img/safari.jpg)\
  \ Safari 10\n\n![images](img/opera.jpg) Opera 48\n\n![image](img/5bl.jpg)保存 HTML\
  \ 文档，然后在网页浏览器中打开它，查看 flexbox 布局\n\n![image](img/pg291_1.jpg)\n\n![image](img/6bl.jpg)拖动浏览器窗口的一侧使其变窄，查看布局如何将\
  \ flex 项目换行到下一行\n\n![image](img/pg291_2.jpg)\n\n![image](img/7bl.jpg)编辑步骤 3 中的规则——以反转换行顺序\n\
  \n```css\ndiv.flex-container {          display : flex ;\nflex-wrap : wrap-reverse\
  \ ;\nbackground : RoyalBlue ; }\n```\n\n![image](img/8bl.jpg)再次保存 HTML 文档，然后刷新网页浏览器，查看\
  \ flex 项目以反序出现\n\n![image](img/pg291_3.jpg)\n\n![image](img/forget.jpg)\n\n`wrap`\
  \ 属性的默认值是 `nowrap`。\n\n## 对齐项目\n\nflexbox 示例此处 已经在弹性容器的行范围内拉伸了 flex 项目。这是默认行为，但你可以通过\
  \ `justify-content` 属性控制 flex 项目在行方向上的对齐方式，指定 `center`、`flex-start`、`flex-end`、`space-evenly`、`space-around`\
  \ 或 `space-between`。\n\n![image](img/pg292.jpg)\n\n你还可以通过 `align-items` 属性在垂直方向上控制\
  \ flex 项目的对齐方式，指定 `center`、`flex-start`（行起始）或 `flex-end`（行结束）。\n\n同样，你可以通过 `align-content`\
  \ 属性控制弹性容器内行的对齐方式，指定 `center`、`flex-start`（容器起始）或 `flex-end`（容器结束）。\n\n![image](img/pg292_1.jpg)\n\
  \n如果你想在行内垂直对齐单个 flex 项目，可以通过 `:nth-child()` 伪类选择器引用内部子元素，并为 `align-self` 属性指定你的首选值。\n\
  \n![image](img/1bl.jpg)创建一个包含五个 div 元素的 HTML 文档\n\n```html\n<div class=\"flex-container\"\
  >\n<div>One</div>\n<div>Two</div>\n<div>Three</div>\n<div>Four</div>\n<div>Five</div>\n\
  </div>\n```\n\n![images](img/htmlbl.jpg)\n\nalignment.html\n\n![image](img/2bl.jpg)添加带有规则的样式表以控制网页\n\
  \n```css\n* { margin : 0 ; padding : 0 ; box-sizing : border-box ; }\n```\n\n![image](img/3bl.jpg)接下来，添加规则让外层\
  \ div 具有弹性并指定 flex 项目如何对齐\n\n```css\ndiv.flex-container { display : flex ; flex-flow\
  \ : row wrap ;\nborder : 2px dashed RoyalBlue ;\nheight : 200px ;\njustify-content\
  \ : space-between ;\nalign-items : center ; }\n```\n\n![image](img/hot.jpg)\n\n\
  对于完美居中，使用 `justify-content: center; align-items: center;` 样式规则。\n\n![image](img/4bl.jpg)此处（此处原文描述未翻译）\n\
  \n保存 HTML 文档，然后在网页浏览器中打开它，查看 flex 项目的对齐情况\n\n\n\n\n\n```css\ndiv.flex-container\
  \ > div:nth-child( 2 ) { align-self : flex-end ; }\ndiv.flex-container > div:nth-child(\
  \ 3 ) { align-self : flex-start ; }\n```\n\n![image](img/7bl.jpg)再次保存 HTML 文档，然后刷新网络浏览器以查看更改后的\
  \ flex 项目对齐方式\n\n![image](img/pg293_2.jpg)\n\n![image](img/forget.jpg)\n\n`align-self`\
  \ 属性会覆盖 `align-items` 属性中指定的对齐方式。\n\n## 画网格 (Draw Grid)\n\n在 290-293 页描述的 CSS 弹性布局方案是一个单维系统，在较小的显示区域内可以将\
  \ flex 项目行自动换到下一行或下一列。相比之下，CSS 网格布局方案是一个二维系统，它将“网格项目”放置在列和行中。\n\n![image](img/pg294_1.jpg)\n\
  \n要创建网格布局，你必须首先通过给元素的 `display` 属性指定 `grid`（或 `inline-grid`）值，将该元素定义为“网格容器”。网格容器内的所有直接子元素随后自动成为网格项目。\n\
  \n你可以通过将一个空格分隔的宽度列表传递给 `grid-template-columns` 属性，来指定网格应该包含多少列。例如，`grid-template-columns\
  \ : 20% 60% 20% ;`。同样，你可以通过将一个空格分隔的高度值列表传递给 `grid-template-rows` 属性来指定网格应该有多少行——例如，`grid-template-rows\
  \ : 20% 40% 40% ;`。\n\n`auto` 关键字也可以用于指定任何列宽或行高——例如，使用 `grid-template-columns :\
  \ auto auto auto ;` 和 `grid-template-rows : auto auto auto ;` 创建三个等等大小的列和行。\n\n\
  ![image](img/pg294_2.jpg)\n\n`repeat( )` 函数可以作为重复的片段 `fr` 单元来指定大量的列或行。该函数接受两个参数：指定重复次数和网格轨道片段的数量——例如，使用\
  \ `grid-template-columns : repeat( 10, 1fr ) ;` 创建十列等大小的列。\n\n![image](img/forget.jpg)\n\
  \n网格是块级元素，因此会填充整个页面宽度，而 `inline-grid` 则不会。\n\n![image](img/hot.jpg)\n\n所有现代浏览器都支持\
  \ grid，版本如下：\n\n![images](img/chrome.jpg) Chrome 57.0\n\n![images](img/edge.jpg)\
  \ Edge 16.0\n\n![images](img/firefox.jpg) Firefox 52.0\n\n![images](img/safari.jpg)\
  \ Safari 10\n\n![images](img/opera.jpg) Opera 44\n\n![image](img/1bl.jpg)创建一个包含七个内部\
  \ `div` 元素的 HTML 文档\n\n```html\n<div class=\"grid-container\">\n  <div>One</div>\
  \ <div>Two</div> <div>Three</div>\n  <div>Four</div> <div>Five</div> <div>Six</div>\n\
  \  <div>Seven</div>\n</div>\n```\n\n![image](img/htmlbl.jpg)\n\ngrid.html\n\n![image](img/2bl.jpg)添加带有规则的样式表以控制网页\n\
  \n```css\n* { margin : 0 ; padding : 0 ; box-sizing: border-box ; }\n```\n\n![image](img/3bl.jpg)接下来，添加规则使外部\
  \ `div` 成为一个三列两行的网格\n\n```css\ndiv.grid-container {\n  display : grid ;\n  grid-template-columns\
  \ : auto 250px auto ;\n  grid-template-rows : auto 100px ;\n  border : 2px dashed\
  \ RoyalBlue ;\n}\n```\n\n![image](img/4bl.jpg)现在，添加规则来指定网格项目的外观\n\n```css\ndiv.grid-container\
  \ > div {\n  background : LightSteelBlue ;\n  border : 2px solid RoyalBlue ;\n \
  \ padding : 10px 40px ;\n  font : 1.25em sans-serif ;\n}\n```\n\n![image](img/5bl.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它以查看网格布局\n\n![image](img/pg295_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n注意第二行和第二列更大，并且自动添加了第三行。随后的行都将只使用第一行的模板值。\n\n## 放置项目 (Place Items)\n\n在网格容器中，列和行之间起始边缘的线条被称为“列线”和“行线”。\n\
  \n![image](img/pg296_1.jpg)\n\n编号可以将网格项目放置在网格容器的特定位置。`grid-column` 和 `grid-row`\
  \ 简写属性可以以单个行号指定水平和垂直位置，例如，使用 `grid-column : 1 ; grid-row : 2 ;` 位于所示网格的左下角。\n\n\
  ![image](img/pg296_2.jpg)\n\n另一种，两个用“/”正斜线分隔的值可以指定起始和结束行号，使项目跨越行或列——例如 `grid-column\
  \ : 1 / 3 ;` 将跨越前两列。\n\n![image](img/1bl.jpg)创建一个包含七个内部 `div` 元素的 HTML 文档\n\n```html\n\
  <div class=\"grid-container\">\n  <div>One</div> <div>Two</div> <div>Three</div>\n\
  \  <div>Four</div> <div>Five</div> <div>Six</div>\n  <div>Seven</div>\n</div>\n\
  ```\n\n![image](img/htmlbl.jpg)\n\ngrid.html\n\n![image](img/2bl.jpg)添加带有规则的样式表以控制网页\n\
  \n```css\n* { margin : 0 ; padding : 0 ; box-sizing: border-box ; }\n```\n\n![image](img/3bl.jpg)接下来，添加规则使外部\
  \ `div` 成为一个三列两行的网格\n\n```css\ndiv.grid-container {\n  display : grid ;\n  grid-template-columns\
  \ : auto 250px auto ;\n  grid-template-rows : auto 100px ;\n  border : 2px dashed\
  \ RoyalBlue ;\n}\n```\n\n![image](img/4bl.jpg)现在，添加规则来指定网格项目的外观\n\n```css\ndiv.grid-container\
  \ > div {\n  background : LightSteelBlue ;\n  border : 2px solid RoyalBlue ;\n \
  \ padding : 10px 40px ;\n  font : 1.25em sans-serif ;\n}\n```\n\n![image](img/5bl.jpg)\n\
  \n## 媒体查询 (Query Media)\n\nCSS 有能力通过制作“媒体查询”来发现查看设备的能力，以应用适当样式规则。媒体查询的语法如下：\n\n\
  ```css\n@media *media-type* and ( *media-feature* ) { *style-rules }\n```\n\n![image](img/pg298_1.jpg)\n\
  \n可以使用以下关键字指定媒体类型：\n\n| 关键字 | 描述 |\n| :--- | :--- |\n| all | 检测所有媒体类型 |\n| print\
  \ | 检测打印机 |\n| screen | 检测电脑桌面、平板电脑和手机屏幕 |\n| speech | 检测屏幕阅读器 |\n\n媒体查询可以检查许多类型的媒体特征，但最有用的是使用这些关键字检测显示区域宽度和设备方向的特征：\n\
  \n| 关键字 | 描述 |\n| :--- | :--- |\n| min-width | 显示区域的最小宽度，如浏览器的宽度 |\n| max-width\
  \ | 显示区域的最大宽度，如浏览器的宽度 |\n| orientation | 视口的方向，表现为横屏模式或竖屏模式 |\n\n当指定的媒体类型上检测到指定的媒体特征时，媒体查询将报告为真，因此大括号内的样式规则将被应用；否则将它们忽略。例如，使用此媒体查询在显示区域宽度为\
  \ 600 像素或更小的设备上应用背景颜色：\n\n```css\n@media screen and ( max-width:600px ) {\n  body\
  \ { background : Blue ; }\n}\n```\n\n通过向查询中添加更多的 **and ( *media-feature* )** 部分，媒体查询可以检查多个媒体特征的存在。\n\
  \n\n\n\n\n![image](img/1bl.jpg)创建一个 HTML 文档，并附带一个样式表，为宽显示区域指定默认背景颜色\n\n```css\n\
  body { background : Tomato ; }\n```\n\n![images](img/htmlbl.jpg)\n\nmediaquery.html\n\
  \n![image](img/2bl.jpg)接下来，添加一个媒体查询，为中宽显示区域指定背景颜色\n\n```css\n@media screen and (\
  \ min-width:600px )\nand ( max-width:992px ) {\nbody { background : DarkOrange ;\
  \ }\n}\n```\n\n![image](img/snake.jpg)\n\n请注意，在媒体特性规范中，冒号字符周围没有空格。\n\n![image](img/3bl.jpg)现在，为小宽显示区域和不同方向添加媒体查询\n\
  \n```css\n@media screen and ( max-width:600px )\nand ( orientation:landscape ) {\n\
  body { background : LimeGreen ; }\n}\n\n@media screen and ( max-width:600px )\n\
  and ( orientation:portrait ) {\nbody { background : RoyalBlue ; }\n}\n```\n\n![image](img/4bl.jpg)保存\
  \ HTML 文档，然后在桌面、平板和手机设备上打开，查看相应的颜色\n\n![image](img/pg299_1.jpg)\n\n![image](img/pg299_2.jpg)\n\
  \n![image](img/pg299_3.jpg)\n\n![image](img/pg299_4.jpg)\n\n![image](img/hot.jpg)\n\
  \n此处为屏幕宽度指定的值是用于定位小、中、大设备的典型断点。\n\n## 切换导航\n\n媒体查询允许为大型和小型设备提供合适的导航。通常，宽显示区域使用水平导航栏，而较小的屏幕更适合垂直导航列表。\n\
  \n![image](img/pg300_1.jpg)\n\n垂直导航栏会为列表指定一个固定宽度值，而水平导航栏则可以将列表项浮动并隐藏溢出，以保持导航栏的可见性。\n\
  \n![image](img/1bl.jpg)创建一个包含四个超链接项的列表的 HTML 文档\n\n```html\n<ul>\n<li><a href=\"\
  #home\" class=\"current\">Home</a></li>\n<li><a href=\"#info\">Information</a></li>\n\
  <li><a href=\"#extra\">Extra</a></li>\n<li><a href=\"#contact\">Contact</a></li>\n\
  </ul>\n```\n\n![images](img/htmlbl.jpg)\n\nmedianav.html\n\n![image](img/2bl.jpg)添加一个包含规则来控制网页的样式表\n\
  \n```css\n* { margin : 0 ; padding : 0 ; box-sizing: border-box ; }\n```\n\n接下来，添加规则以移除标记、外边距和内边距，然后指定颜色、固定宽度和字体\n\
  \n```css\nul {\n    list-style-type : none ;\n    margin : 0 ;\n    padding : 0\
  \ ;\n    background : LightSteelBlue ;\n    width : 150px ;\n    font : 1.25em sans-serif\
  \ ; }\n```\n\n![image](img/4bl.jpg)现在，添加样式规则，将超链接显示为块级元素，并指定它们的外观\n\n```css\nli\
  \ a {\n    display : block ;\n    text-align : center ;\n    text-decoration : none\
  \ ;\n    color : Black ;\n    padding : 10px ; }\n```\n\n![image](img/5bl.jpg)然后，添加样式规则以指示超链接的状态\n\
  \n```css\nli a.current { background : CornflowerBlue ; }\nli a:hover { background\
  \ : RoyalBlue ; color : White ; }\n```\n\n![image](img/6bl.jpg)最后，添加一个媒体查询，当显示区域宽度达到\
  \ 600 像素或以上时应用新规则\n\n```css\n@media screen and ( min-width:600px ) {\nul { overflow\
  \ : hidden ; width : 100% ; }\nli a { float : left ; }\n}\n```\n\n![image](img/7bl.jpg)保存\
  \ HTML 文档，然后在桌面网页浏览器中打开网页，查看水平导航栏\n\n![image](img/pg301_1.jpg)\n\n![image](img/8bl.jpg)拖动浏览器边缘缩小其尺寸，查看导航栏自动切换为垂直列表\n\
  \n![image](img/pg301_2.jpg)\n\n![image](img/hot.jpg)\n\n此示例与此处的示例类似，但自动切换了导航类型。\n\
  \n## 总结\n\n- 通用样式规则可用于覆盖浏览器对外边距和内边距的默认样式。\n- 元素的总宽度和高度不受添加轮廓的影响。\n- 可调整大小的元素应指定如何处理任何内容溢出。\n\
  - `column-count` 可以指定文本内容应分成的列数。\n- `column-gap` 可以指定列之间的间距宽度。\n- `column-rule`\
  \ 简写属性可以指定列之间垂直分隔线的宽度、样式和颜色。\n- `column-span` 可以指定跨越的列数。\n- flexbox 方案首先需要通过为其 `display`\
  \ 属性指定 flex 值来创建一个弹性容器元素。\n- 弹性容器内的内部元素是弹性项目，默认情况下会显示在一行上。\n- `justify-content`\
  \ 可以水平对齐弹性项目，`align-items` 可以垂直对齐行上的弹性项目。\n- 网格布局方案首先需要通过为其 `display` 属性指定 grid\
  \ 值来创建一个网格容器元素。\n- 网格布局方案是一个二维系统，将网格项目放置在列和行中。\n- `grid-column` 和 `grid-row` 简写属性可以指定网格项目的水平和垂直定位。\n\
  - 媒体查询可用于发现查看设备的能力，以应用合适的样式规则。\n- 媒体查询可以指定屏幕媒体类型来检测 PC 桌面、平板和手机屏幕。\n- 媒体查询可以检查多种媒体特性，以发现显示区域的宽度和设备方向。\n\
  \n| 14 设备设计 | ![image](img/pg235_1.jpg) |\n\n*本章演示了 HTML 文档中的响应式网页设计（RWD）。*\n\n\
  - 调整布局\n- 比较方案\n- 组合方案\n- 添加断点\n- 缩放图像\n- 隐藏内容\n- 总结\n\n## 调整布局\n\n网页在各种具有不同大小显示区域和不同功能的设备上被查看。事实上，自\
  \ 2015 年以来，在移动设备上查看的网页数量已超过桌面 PC。这意味着设计网页时，必须确保其在各种设备和屏幕尺寸上都能呈现良好效果。\n\n![image](img/pg304_1.jpg)\n\
  \n响应式网页设计（“RWD”）旨在通过设计在所有设备上都能良好呈现内容并表现良好的网页，确保最佳的用户体验和满意度。\n\n采用 RWD 设计的网页仅使用 HTML\
  \ 和 CSS（无需 JavaScript）即可根据查看设备调整其布局。\n\n响应式网页设计的关键在于使用 CSS 媒体查询来确定查看设备的大小和能力。在识别设备特性后，可以通过使用基于流体比例网格和灵活图像来创建响应式布局，从而适应查看环境：\n\
  \n- **CSS 媒体查询** – 允许网页使用包含适合查看设备屏幕尺寸或浏览器窗口宽度的规则的样式表。\n- **流体网格布局** – 要求网页尺寸以相对单位（如百分比和\
  \ em 值，而非像素和点值等绝对单位）指定，以便项目可以拉伸或收缩。\n- **灵活图像** – 要求图像尺寸以相对单位（如百分比）指定，以便在较小的查看设备上不会溢出其包含元素。\n\
  - **响应式布局** – 会自动适应查看设备的尺寸，并在用户调整浏览器窗口大小时进行调整。\n\n\n\n\n\n### 简介\n\n针对响应式网页设计（RWD）优化的页面必须在文档的头部区域包含\
  \ `<meta>` 视口标签，如此处所示，以指示 Web 浏览器如何控制页面的尺寸和缩放。该标签的 `width=device-width` 值告诉浏览器在设备无关像素中匹配屏幕的宽度，而标签的\
  \ `initial-scale=1.0` 值则告诉浏览器在 CSS 像素与设备无关像素之间建立 1:1 的关系——无论设备的取向方向如何。\n\n![image](img/hot.jpg)\n\
  \nRWD 中的柔性图像有时被称为“上下文感知型”。\n\n![image](img/pg305_1.jpg)\n\n## 桌面端\n\n通常，响应式网页设计会为较大的设备提供\
  \ 3 列网页布局，类似于上方所示。它还会为中等尺寸设备提供 2 列布局，并为较小的设备提供 1 列布局，如下方所示。\n\n![image](img/pg305_2.jpg)\n\
  \n## 平板电脑\n\n![image](img/pg305_3.jpg)\n\n## 手机\n\n观察上方所示的布局，希望大家能够看出使用 CSS flexbox\
  \ 和 grid 布局方案就可以满足响应式网页设计的需求。\n\n![image](img/hot.jpg)\n\nGoogle Chrome 浏览器有一项功能，可以让你模拟网页在不同设备上的外观。在\
  \ Google Chrome 中打开网页，然后按 `F12` 键并点击“开发者工具”窗口中的 ![image](img/pg305_5.jpg) 按钮，在浏览器窗口中打开设备工具栏。从设备工具栏菜单的下拉选项中选择任何设备进行模拟。\n\
  \n![image](img/pg305_4.jpg)\n\n## 方案比较\n\n在决定哪种布局方案最适合 RWD 网页设计时，比较 flexbox 和 grid\
  \ 方案是有用的。\n\n![image](img/pg306_1.jpg)\n\n首先，回想一下 flexbox 用于 1 维布局，而 grid 用于 2 维布局。这意味着如果你想在行中布局项目（例如水平导航栏中的按钮），请选择\
  \ flexbox 方案。\n\n![image](img/pg306_2.jpg)\n\n相反，如果你想在两个维度上布局项目（同时包含行和列），请选择 grid\
  \ 布局方案。\n\n![image](img/pg306_3.jpg)\n\n对于上述插图中的头部项目，最直接的方案选择是 flexbox 布局方案。然而，使用每种方案构建页头并进行对比是一项有用的练习：\n\
  \n![image](img/1v.jpg)\n\n创建一个包含两个相似页头的 HTML 文档，中间用换行符隔开\n\n```html\n<header class=”\
  \ flex-container”>\n<div>Home</div><div>News</div><div>Logout</div>\n</header>\n\
  \n<br>\n\n<header class=” grid-container”>\n<div>Home</div><div>News</div><div>Logout</div>\n\
  </header>\n```\n\n![image](img/htmlv.jpg)\n\n`flexvgrid.html`\n\n![image](img/2v.jpg)Next（注：此处原文与图片紧为相连）\
  \ 接下来，添加一个包含规则的样式表，以控制页面并指定页头的显示效果\n\n```css\n* { margin : 0 ; padding : 0 ; box-sizing\
  \ : border-box ; }\nheader { background : Purple ; color : White ; }\nheader > div\
  \ { font : 1em sans-serif ; padding : 0 1em ; }\n```\n\n![image](img/3v.jpg)现在，添加规则来创建\
  \ flexbox 布局并将最后一个项目定位在最右侧\n\n```css\nheader.flex-container { display : flex ; }\n\
  header.flex-container > div:nth-child(3) {\n  margin : 0 0 0 auto ;\n}\n```\n\n\
  ![image](img/hot.jpg)\n\n注意，flexbox 布局通过添加左边距可以轻松将最后一个项目定位在最右侧，而 grid 布局必须显式地将其放置在网格的第\
  \ 10 列。\n\n![image](img/4v.jpg)然后，添加规则创建一个具有十列的 grid 布局，并将最后一个项目定位在最右侧\n\n```css\n\
  header.grid-container { display : grid ;\ngrid-template-columns : repeat( 10, 1fr\
  \ ) ; }\nheader.grid-container > div:nth-child(3) {\n  grid-column : 10 ;\n}\n```\n\
  \n![image](img/5v.jpg)保存 HTML 文档，然后在浏览器中打开它，发现页头看起来是完全相同的\n\n![image](img/pg307_1.jpg)\n\
  \n![image](img/6v.jpg)打开浏览器的开发者工具，然后检查每个页头以查看它们的对比\n\n![image](img/pg307_2.jpg)\n\
  \n![image](img/pg307_3.jpg)\n\n![image](img/hot.jpg)\n\n在 Google Chrome 中打开网页，然后按\
  \ `F12` 键并点击“开发者工具”窗口中的 ![image](img/pg307_4.jpg) 按钮，在浏览器窗口中打开设备工具栏。将光标置于任何元素上进行检查。\n\
  \n## 结合方案\n\nRWD 网页设计的最佳解决方案始终是 grid 和 flexbox 方案的结合。整体网布局适合导航栏等组件。flexbox 布局适合在移动设备上查看的项目。\n\
  \n![image](img/pg308_1.jpg)\n\n创建一个包含两个相似页头的 HTML 文档，中间用换行符隔开\n\n```html\n<div class=”grid-container”>\n\
  <header>\n<div>Home</div><div>News</div><div>Logout</div>\n</header>\n<nav>Menu</nav>\n\
  <main>Content</main>\n<aside>Aside</aside>\n<footer></footer>\n</div>\n```\n\n![image](img/htmlv.jpg)\n\
  \n`responsive.html`\n\n![image](img/2v.jpg)添加一个包含规则的样式表，以控制页面和某些元素的显示\n\n```css\n\
  * { margin : 0 ; padding : 0 ; box-sizing : border-box ; }\nheader { background\
  \ : Purple ; color : White ; }\nnav, footer { background : Thistle ; }\n```\n\n\
  ![image](img/3v.jpg)\n\n**vw** 和 **vh** 单位是视口宽和高度的 100%。 \n\n## 添加断点\n\n此处创建的响应式网页现在可以通过样式表中添加媒体查询，为具有较大显示区域的设备调整其布局。这将网格布局从小型设备的\
  \ 1 列网页布局改为中等尺寸设备的 2 列布局，以及大设备的 3 列布局。\n\n![image](img/pg310_1.jpg)\n\n![image](img/1v.jpg)从此处复制一个新的“responsive.html”文档，并将其保存为“breakpoints.html”\n\
  \n![image](img/htmlv.jpg)\n\n在样式表的现有规则之后，添加一个针对中等尺寸设备的媒体查询，通过将行数从 5 行减少 4 行来更改布局\n\
  \n\n\n\n\n```css\n@media screen and ( min-width:600px ) \nand ( max-width:992px\
  \ ) {\n  div.grid-container {\n    grid-template-rows : 10% 75% 10% 5% ;\n  }\n\
  \  nav { grid-column : span 2 ; }\n  main { grid-column : span 8 ; }\n}\n```\n![image](img/3v.jpg)接下来，添加另一个媒体查询，通过将行数从五行减少到三行来更改大设备的布局\n\
  \n```css\n@media screen and ( min-width:992px ) {\n  div.grid-container {\n    grid-template-rows\
  \ : 10% 85% 5% ;\n  }\n  nav { grid-column : span 2 ; }\n  main { grid-column :\
  \ span 6 ; }\n  aside { grid-column : span 2 ; }\n}\n```\n![image](img/4v.jpg)现在，保存\
  \ HTML 文档，然后在各种设备上打开它，查看断点如何调整布局\n\n![image](img/pg311_1.jpg)\n\n### 桌面端\n![image](img/pg311_2.jpg)\n\
  \n### 平板\n![image](img/pg311_3.jpg)\n\n### 手机\n![image](img/pg311_4.jpg)\n\n###\
  \ 缩放图像\n响应式网页设计应该考虑到，网页上的图像和视频内容也应该适应不同尺寸的查看设备\n\n![image](img/pg312_1.jpg)\n\n\
  通过在 `background-size` 属性上指定 `contain` 关键字，并在 `background-repeat` 属性上指定 `no-repeat`\
  \ 关键字，可以让背景图像缩小并保持其宽度和高度之间的比例——例如：\n\n```css\ndiv {\n  width : 100% ;\n  height\
  \ : 400px ;\n  background-image : url(ferrari.png) ;\n  background-size : contain\
  \ ;\n  background-repeat : no-repeat ;\n}\n```\n但这种技术只会在其包含元素内缩小图像——其容器保持指定的高度。\n\
  \n如果担心图像文件大小，你可以使用媒体查询为不同设备指定不同版本的图像，为小设备提供较小的图像文件以获得更好的性能。记住“移动优先”的设计原则，最初为小设备指定较小的图像文件，然后添加媒体查询为中等和大型设备指定日益较大的图像文件。\n\
  \n更简单来说，可以使用 CSS 规则通过为 `width` 属性分配百分比值，并为 `height` 属性指定 `auto` 关键字，来轻松地让图像放大或缩小\n\
  \n![image](img/1v.jpg)创建一个包含一个 `div` 元素和单个图像的 HTML 文档\n\n```html\n<img class=”scale”\
  \ src=”ferrari.png” alt=”Ferrari\">>\n```\n![image](img/htmlv.jpg)\n\nscale.html\n\
  \n![image](img/pngv.jpg)\n\nferrari.png\n\n800px x 400px\n\n![image](img/2v.jpg)添加一个带有规则的样式表来控制网页\n\
  \n```css\n* { \n  margin : 0 ; \n  padding : 0 ; \n  box-sizing : border-box ; \n\
  }\n```\n![image](img/3v.jpg)现在，添加规则来缩放图像\n\n```css\nimg.scale { \n  width : 100%\
  \ ; \n  height : auto ;\n  border : 5px dashed Purple ; \n}\n```\n![image](img/4v.jpg)保存\
  \ HTML 文档，然后在不同的设备上打开它，查看图像如何缩放到适应显示区域\n\n![image](img/pg313_1.jpg)\n\n### 隐藏内容\n\
  CSS 提供了多种方法可以将网页内容从视图中隐藏，但后果各异：\n\n![image](img/pg314_1.jpg)\n\n- `display : none\
  \ ;` – 从页面流中完全完全移除内容，不预留页面空间，且对屏幕阅读器不可见。\n- `visibility : hidden ;` – 保留在页面流中，预留页面空间，但内容对用户和屏幕阅读器不可见。\n\
  - `opacity : 0 ;` – 保留在页面流中，预留页面空间，内容在视觉上是隐藏的，但对屏幕阅读器可见的。\n\n在响应式网页设计中，理想情况下，不应从小设备查看的网页中省略内容。然而，你可以通过绝对定位内容到显示区域之外，将其从页面流中视觉移除，但保持其对屏幕阅读器可见以辅助辅助功能。\n\
  \n![image](img/1v.jpg)创建一个包含图像和段落的 `div` 的 HTML 文档\n\n```html\n<div class=”flex-container\"\
  >\n  <img src=”orchid.png” alt=”Orchid Photo.”>\n  <p class=”screen-reader-text\"\
  >兰花是香港的官方花花。</p>\n</div>\n```\n![image](img/htmlv.jpg)\n\nhide.html\n\n![image](img/pngv.jpg)\n\
  \norchid.png\n\n200px x 200px\n\n![image](img/2v.jpg)添加一个带有规则的样式表来控制网页\n\n```css\n\
  * { \n  margin : 0 ; \n  padding : 0 ; \n  box-sizing : border-box ; \n}\nbody {\
  \ \n  background : Black ; \n}\n```\n![image](img/3v.jpg)现在，添加规则来创建 flex 布局\n\n\
  ```css\ndiv.flex-container {\n  display : flex ;\n  justify-content : center ;\n\
  }\n```\n![image](img/4v.jpg)现在，添加规则来创建 flex 布局\n\n```css\ndiv.flex-container {\n\
  \  display : flex ;\n  justify-content : center ;\n}\n```\n![image](img/5v.jpg)现在，添加规则来创建\
  \ flex 布局\n\n```css\n@media screen and ( max-width:600px ) {\n  p.screen-reader-text\
  \ {\n    position: absolute;\n    width: 1px;\n    height: 1px;\n    left: -1000px;\n\
  \    overflow: hidden;\n  }\n}\n```\n![image](img/6v.jpg)保存 HTML 文档，然后在不同的设备上打开\n\
  \n![image](img/pg315_1.jpg)\n\n![image](img/7v.jpg)拖动浏览器边缘缩小宽度\n\n![image](img/8v.jpg)拖动浏览器边缘缩小宽度\n\
  \n![image](img/pg315_2.jpg)\n\n## 总结\n- 响应式网页设计 (RWD) 确保网页在所有设备上良好显示。\n- 响应式网页设计使用媒体查询确定查看设备的尺寸和功能。\n\
  - 针对响应式网页设计优化的页面在头部包含 `<meta>` 标签。\n- 响应式网页设计的需求可以使用 flex 布局和网格布局方案满足。\n- flex 布局将项目放置在行，但网格布局将项目放置在行和列。\n\
  - 响应式网页设计的最佳解决方案始终结合网格和 flex 方案。\n- 移动优先设计是一种良好的习惯，因为现在手机设备查看网页的数量超过了桌面电脑。\n- 响应式网页可以通过添加媒体查询来适应具有较大显示区域设备。\n\
  - 媒体查询可用于为不同设备指定不同版本的图像。\n- 通过在 `background-size` 属性上指定 `contain` 关键字，并在 `background-repeat`\
  \ 属性上指定 `no-repeat` 关键字，可以让背景图像缩小。\n\n### 15 开始学习 JavaScript\n| |\n|---|\n| ![image](img/pg317_1.jpg)\
  \ |\n\n*本章是 JavaScript 精彩世界的入门。它演示了如何在 HTML 文档中添加 JavaScript 变量和函数。*\n\n- **认识 JS**\n\
  - **引入脚本**\n- **控制台输出**\n- **编写语句**\n- **避免关键字**\n- **存储值**\n- **创建函数**\n- **分配函数**\n\
  - **识别作用域**\n\n\n\n\n\n# 使用闭包 (Closures)\n\n## Summary\n\n## 认识 JavaScript\n\nJavaScript（“JS”）是一种基于对象的脚本语言，其解释器被嵌入在\
  \ Google Chrome、Microsoft Edge、Firefox、Opera 和 Safari 等网络浏览器软件中。这使得网页中包含的脚本可以在浏览器加载页面时被解释，从而提供功能。出于安全考虑，JavaScript\
  \ 无法读取或写入文件，但存储少量数据的“cookie”文件除外。\n\n![image](img/pg318_1.jpg)\n\nJavaScript 由 Brendan\
  \ Eich 在 Netscape 公司创建，首次于 1995 年 12 月引入，最初命名为“LiveScript”。然而，它很快被改名，也许是为了利用太阳能微型系统公司（Sun\
  \ Microsystem）Java 编程语言的人气——尽管两者之间几乎没有相似之处。\n\n在引入 JavaScript 之前，网页功能需要浏览器调用驻留在\
  \ Web 服务器上的“服务端”脚本，而在那里，缓慢的响应会影响性能。调用驻留在用户系统上的“客户端”脚本则解决了延迟问题并提供了更卓越的体验。\n\nJavaScript\
  \ 迅速流行起来，但 Netscape 和微软在许可问题上产生了分歧——因此微软推出了了自己的名为“JScript”的版本。虽然与 JavaScript 相似，但新的\
  \ JScript 版本具有一些扩展功能。由于意识到碎片化的危险，JavaScript 语言由 Ecma International 标准组织于 1997 年\
  \ 6 月标准化为“ECMAScript”。这有助于稳定核心功能，但这个名字听起来像某种皮肤病，并不被广泛使用，大多数人将如一地称呼这种语言为“JavaScript”。\n\
  \n![image](img/pg318_2.jpg)\n\nJavaScript 语言的创建者 Brendan Eich 还共同创立了 Mozilla 项目，并帮助启动了\
  \ Firefox 网页浏览器。\n\n本书中的 JavaScript 示例描述了三个关键要素：\n\n- **语言基础** —— 说明语言语法、关键字、操作符、结构和内置对象的机制。\n\
  - **网页功能** —— 说明如何使用浏览器的文档对象模型（DOM）提供用户交互。\n- **Web 应用程序** —— 说明响应式 Web 应用和 JavaScript\
  \ 对象表示法（JSON）技术。\n\n## 引入脚本\n\n要在 HTML 文档中直接包含 JavaScript 代码，必须将其插入 `<script>` 和\
  \ `</script>` 标签之间，如下所示：\n\n```html\n<script>\ndocument.getElementById( ‘message’\
  \ ).innerText = ‘Hello World!’\n</script>\n```\n\n一个 HTML 文档可以包含多个脚本，这些脚本可以放在文档的\
  \ head 或 body 部分。然而，建议你将脚本放置在 body 部分的末尾（紧接在 `</body>` 结束标签之前），这样浏览器就可以在解释脚本之前渲染网页了。\n\
  \nJavaScript 代码也可以写在外部的纯文本文件中，并赋予 `.js` 文件扩展名。这允许多个不同的网页调用同一个脚本。为了在 HTML 文档中引入外部脚本，必须将脚本的文件名分配给\
  \ `<script>` 标签的 `src` 属性，如下所示：\n\n```html\n<script src=”external_script.js”> </script>\n\
  ```\n\n同样，这可以放在文档的 head 或 body 部分，浏览器会将该脚本处理为就像直接写在 HTML 文档该位置的那样。\n\n为 `<script>`\
  \ 标签的 `src` 属性仅分配外部脚本的文件名，要求该脚本文件位于与 HTML 文档相同的文件夹（目录）中。如果脚本位于相邻文件夹中，你可以分配文件的相对路径地址，如下所示：\n\
  \n```html\n<script src=”js/external_script.js”> </script>\n```\n\n如果脚本位于其他地方，你可以分配文件的绝对路径地址，如下：\n\
  \n```html\n<script src=”https://www.example.com/js/external_script.js”>\n</script>\n\
  ```\n\n你还可以通过在 HTML 文档的 body 中包含 `<noscript>` 元素来指定当用户在浏览器中禁用了 JavaScript 时才会显示的内容，如下所示：\n\
  \n```html\n<noscript>JavaScript is Not Enabled!</noscript>\n```\n\n![image](img/hot.jpg)\n\
  \n你可能会在 `<script>` 标签中看到 `type=”text/javascript\"` 属性，但现在不再需要，因为 JavaScript 现在是\
  \ HTML 的默认脚本语言。\n\n![image](img/snake.jpg)\n\n不要在外部 JavaScript 文件中包含 `<script>`\
  \ 和 `</script>` 标签，只包含脚本代码。\n\n![image](img/forget.jpg)\n\n外部脚本文件可以使代码维护更容易，但为了清晰起见，书中几乎所有的示例都是独立的，因此直接在\
  \ HTML 文档的标签之间包含脚本代码。\n\n## 控制台输出\n\nJavaScript 可以通过向 HTML 元素动态写入内容来显示输出。例如，使用这段代码：\n\
  \n```javascript\ndocument.getElementById( ‘message’ ).innerText = ‘Hello World!’\n\
  ```\n\n![image](img/pg320_1.jpg)\n\n元素通过分配给其 `id` 属性的值来识别，`innerText` 属性指定写入那里的文本。\n\
  \n![image](img/pg320_2.jpg)\n\n此外，JavaScript 还可以通过向弹出对话框写入内容来显示输出，如下：\n\n```javascript\n\
  window.alert( ‘Hello World!’ )\n```\n\n这调用了 `window` 对象的 `alert()` 方法，将 ( ) 括号内指定的内容显示在对话框中。\n\
  \n![image](img/pg320_3.jpg)\n\n在开发 JavaScript 和学习这种语言时，最初最好在浏览器的控制台中显示输出，如下：\n\n\
  ```javascript\nconsole.log( ‘Hello World!’ )\n```\n\n这调用了 `console` 对象的 `log()`\
  \ 方法，在控制台窗口显示 ( ) 括号内指定的内容。所有领先浏览器在其开发者工具中都有 JavaScript 控制台——通常通过按 F2 键访问。由于 Google\
  \ Chrome 浏览器在编写时统计上最受欢迎，因此在书中一直用于演示 JavaScript。\n\n![image](img/hot.jpg)\n\n注意使用\
  \ `.`（句点）运算符来描述对象的属性或方法。\n\n当代码发生错误时，控制台会提供有用信息——因此非常适合调试。\n\n![image](img/1b.jpg)创建一个包含空段落和脚本的\
  \ HTML 文档，用三种方式显示输出：\n\n```html\n<p id=”message”></p>\n<script>\ndocument.getElementById(\
  \ ‘message’ ).innerText = ‘Hello World!’\nwindow.alert( ‘Hello World!’ )\nconsole.log(\
  \ ‘Hello World!’ )\n</script>\n```\n\n![image](img/htmlb.jpg)\n\noutput.html\n\n\
  ![image](img/2b.jpg)保存 HTML 文档然后在浏览器中打开它，查看写入段落和显示在对话框中的输出——如所示\n\n![image](img/3b.jpg)接下来，按下\
  \ **F12** 键，或使用浏览器的菜单打开其开发者工具功能\n\n![image](img/4b.jpg)现在选择 **Console** 标签，查看写入控制台窗口的输出\n\
  \n![image](img/pg320_1.jpg)\n\n![image](img/5b.jpg)点击 ![image](img/pg321_3) **显示/隐藏**\
  \ 按钮隐藏或显示侧边栏，点击 ![image](img/pg321_4) **自定义** 按钮选择控制台窗口停靠浏览器窗口的方式，然后点击 ![image](img/pg321_5)\
  \ **清除** 按钮清除控制台的所有内容\n\n![image](img/pg321_2.jpg)\n\n还有一个 `document.write()` 方法可以替换整个网页的头部和主体，但通常通常被认为是不良实践。\n\
  \n![image](img/hot.jpg)\n\n\n\n\n确保控制台显示输出、HTML 文档名称以及创建该输出的 JavaScript 代码所在的行号。\n\
  \n## 语句\n\nJavaScript 代码由一系列称为“语句”（statements）的指令组成，当浏览器 JavaScript 引擎处理脚本时，这些语句通常按从到下的顺序执行。\n\
  \n![image](img/pg322_1.jpg)\n\n每个语句可能包含以下任何一个组件：\n\n- **关键字 (Keywords)** – 在 JavaScript\
  \ 语言中具有特殊含义的单词。\n- **运算符 (Operators)** – 对一个或多个操作数执行操作的特殊字符。\n- **值 (Values)** –\
  \ 文本字符串、数字、布尔值 `true` 或 `false`、`undefined` 和 `null`。\n- **表达式 (Expressions)** –\
  \ 产生单个值的代码单元。\n\n在早期的 JavaScript 代码中，每个语句都必须以 `;` 分号字符结束——就像英语语言中的每个句子必须以 `.` 句号（full\
  \ stop）结尾一样。现在这是可选的，所以除非你想在一行上编写多个语句，否则可以省略。在这种情况下，语句需要用分号隔开，如下所示：\n\n```\nstatement\
  \ ; statement ; statement\n```\n\n有些 JavaScript 程序员仍然习惯在每个语句末尾加上分号。书中的示例为了简洁起选择了省略它们，但选择权交由你。\n\
  \nJavaScript 解释器忽略制表符和空格（“空白字符”），所以你应该使用空格来提高代码的可读性。例如，在将两个数字相加时：\n\n`total = 100\
  \ + 200` 而不是 `total=100+200`\n\nJavaScript 语句通常分组在 `{ }` 大括号（“braces”）内的函数块中，这些块可以在需要时反复调用执行。良好的做法是将这些语句缩进两个空格以提高可读性，如下：\n\
  \n```\n{\n  statement\n  statement\n  statement\n}\n```\n\n![image](img/hot.jpg)\n\
  \nJavaScript 关键字在此处 描述，你稍后将学习运算符、值和表达式。\n\n![image](img/forget.jpg)\n\n“表达式”产生一个值，而“语句”执行一个动作。\n\
  \n![image](img/snake.jpg)\n\n使用空格键来缩进语句，因为在文本编辑器中查看代码时，制表符间距可能会被区别对待。\n\n规范 JavaScript\
  \ 语言的规则称为“语法”，它识别两种类型的值——固定和变量。固定的数值和文本字符串值被称为“字面量”（literals）：\n\n- **数字字面量 (Number\
  \ literals)** – 整数整数，如 `100`，或浮点数如 `3.142`。\n- **字符串字面量 (String literals)** – 双引号内的文本，如\
  \ `“JavaScript Fun”`，或单引号内的如 `‘JavaScript Fun’`。\n\n变量值简单地被称为“变量”（variables），用于存储脚本中的数据。可以使用\
  \ JavaScript 的 `let` 关键字创建变量——例如，`let total` 创建名为“total”的变量。可以使用 JavaScript 的 `=`\
  \ 赋值运算符为变量赋值以进行存储，如下：\n\n`let total = 300`\n\n可以使用其他 JavaScript 运算符形成将评估为单个值的表达式。通常，一个表达式可以包含在\
  \ `( )` 括号中，如下所示由数字和 JavaScript `+` 加法运算符组成的表达式，其评估值为单个值 100：\n\n`( 80 + 20 )`\n\
  \n表达式也可以包含变量值，如下所示由之前的变量值、JavaScript `-` 减法运算符和一个数字组成的表达式，同样评估值为单个值 100：\n\n`( total\
  \ - 200 )`\n\nJavaScript 是一种大小敏感的语言，因此名为 `total` 和 `Total` 的变量被视为两个完全不同的变量。\n\n\
  在你的 JavaScript 代码中添加解释性注释是一个良好的习惯，以便他人更容易理解，并且自己在日后回顾代码时也能理解。跟在 `//` 双斜杠之后的单行内容，或在多行中\
  \ `/*` 和 `*/` 字符序列之间的任何内容都被忽略。\n\n```\nlet total = 100 // 这段代码将被执行。\n\n/* let total\
  \ = 100\n这段代码不会被执行。 */\n```\n\n![image](img/hot.jpg)\n\n决定在代码中为字符串字面量使用一种引号形式，并坚持使用以保持一致性。书中的示例使用单引号。\n\
  \n![image](img/hot.jpg)\n\n在调试代码时，“注释掉”几行代码以防止其执行，这通常很有用。\n\n## 避免关键字\n\n![image](img/pg324_1.jpg)\n\
