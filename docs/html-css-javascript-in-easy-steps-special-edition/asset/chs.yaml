  \n# 第 1 章：HTML 入门\n\n*本章是对 HTML 精彩世界的介绍。它演示了如何创建有效的 HTML 文档，以及如何包含样式规则、脚本代码和链接资源。*\n\
  \n- 认识 HTML\n- 理解结构\n- 创建文档\n- 验证文档\n- 赋予标题\n- 提供元数据\n- 描述内容\n- 添加样式\n- 引入脚本\n-\
  \ 链接资源\n- 本章小结\n\n## 认识 HTML\n\n历史上，希望以特定格式打印文本的需求意味着原始手稿会带有注释“标记”，以向书籍印刷商指示作者希望如何排版文本段落。这些注释必须简洁，并且需要让印刷商和作者都能轻松理解。因此，一系列公认的缩写构成了标准标记语言的基础。\n\
  \n![图片](img/pg12_1.jpg)\n\n超文本标记语言（HTML）是一种现代标准标记语言，它使用称为“标签”的通用缩写来向 Web 浏览器指示作者希望如何排版网页的各个部分。它最初于\
  \ 1989 年由英国物理学家蒂姆·伯纳斯-李在瑞士的欧洲核子研究组织（CERN）设计，旨在让 CERN 的物理学家之间共享所有计算机存储的信息。伯纳斯-李创建了一个文本浏览器，通过超文本在互联网上传输信息，提供点击导航功能。1990\
  \ 年 5 月，该系统被命名为万维网，并于 1993 年由大学生马克·安德森添加了图像标签后得到增强。现在 HTML 可以同时显示文本和图像，万维网迅速变得非常流行。\n\
  \n\n\n\n\n# HTML 简介\n\n随着各种网络浏览器的开发，它们的开发者开始添加各自的专有标签——这实际上创建了他们各自版本的 HTML！世界维维网联盟（W3C）标准组织意识到了\
  \ HTML 可能会变得碎片化的危险，因此他们创建了一份所有网络浏览器都应该遵循的标准规范。这成功地激励了浏览器制造商去支持标准标签。HTML5 的最终 W3C\
  \ 标准规范现在由 Web 超文本应用技术工作组（WHATWG）作为“HTML 活标准”（HTML Living Standard）继续维护。\n\n万维网由一系列大容量计算机组成，被称为“网络服务器”，它们通过电话线和卫星连接到互联网。每台网络服务器都使用超文本传输协议（HTTP）作为通用通信标准，允许任何连接到任何网络服务器的计算机访问整个网络上的文件。\n\
  \nHTML 网页仅仅是纯文本文件，并保存为 `.htm` 或 `.html` 文件扩展名，例如 `index.html`。\n\n![image](img/hot.jpg)\n\
  \n你可以在 [whatwg.org](http://www.whatwg.org) 在线查找 HTML 活标准规范以及其他相关规范。\n\n## 理解 URL\n\
  \n为了通过互联网访问 HTML 文件，必须将该网络地址输入到浏览器的地址栏中。网络地址的正式称为“统一资源定位符”（URL），通常包含三个部分：\n\n- **协议\
  \ (Protocol)** – 任何使用 HTTP 协议的 URL 都以指定协议为 `http://` 或安全的 `https://` 开始。\n- **域名\
  \ (Domain)** – 可以从其中下载文件的计算机的主机名。例如：`www.example.com`\n- **路径 (Path)** – 文件名，并带有缀了任何父目录名称（如果适用）。例如：`/htdocs/index.html`\n\
  \n![image](img/pg13_1.jpg)\n\n通过协议、域名和路径描述文件位置的 URL 是在陈述其完整的“绝对地址”。位于同一域范围内的文件可以使用更简单的“相对地址”来进行引用，这意味着位于相同目录下的文件只需通过文件名即可引用。此外，相对地址可以通过在名称前加上\
  \ `../` 来引用其父目录中的文件。例如，父目录中名为 `higher.html` 的文件可以通过 `../higher.html` 进行引用。\n\n###\
  \ 网络服务器是如何工作的？\n\n当你向浏览器地址栏输入 URL 时，浏览器首先检查协议。当协议指定为 HTTP，或在未指定时假设为 HTTP 时，浏览器会识别出正在从网络服务器请求文件。然后它会联系域名服务器（DNS）以查找指定域名的数值互联网协议（IP）地址。接下来，将与该\
  \ IP 地址处的网络服务器建立连接，以请求指定路径的文件。当成功找到文件时，它会被复制回浏览器；否则网络服务器将发送错误代码，例如“404 – 页面未找到”。\n\
  \n![image](img/pg13_2.jpg)\n\n成功的响应会将 HTTP 头部发送到网络浏览器，描述响应的性质，并附带所请求文件的副本。HTTP 头部通常不可见，但可以使用各种开发工具进行检查，例如\
  \ Google Chrome 浏览器的 F12 开发者工具功能。\n\n## 理解结构\n\n![image](img/pg14_1.jpg)\n\nHTML\
  \ 文档的骨架结构包含三个部分：\n\n- **文档类型声明 (Document type declaration)** – 精确声明使用哪种版本的 HTML\
  \ 来标记文档。\n- **头部部分 (Head section)** – 提供关于文档本身的描述性数据，例如文档的标题和所使用的字符集。\n- **主体部分\
  \ (Body section)** – 包含文档加载到网络浏览器时将显示的内容。\n\n### 文档类型声明\n\n文档类型声明必须出现在每个 HTML 文档第一行的开头，以确保网络浏览器以“标准模式”（Standards\
  \ Mode）渲染（显示）文档——遵循 HTML 规范。所有 HTML 文档的文档类型声明标签如下：\n\n`<!DOCTYPE HTML>`\n\n需要注意的是，HTML\
  \ 不是一种区分大小写的语言——因此，文档类型声明标签以及所有其他标签都可以用大写字母和小写字母的任何组合来写。例如，以下都是有效的：\n\n`<!DOCTYPE\
  \ html>`\n`<!Doctype Html>`\n`<!doctype html>`\n\n大小写的选择由你决定，但建议你始终坚持你所选择的任何一种风格。书中推崇的文档类型声明标签大小写风格使用全大写，以强调其作为每个页面上第一个标签的显著性——但所有其他标签均使用全小写。\n\
  \n熟悉早期 HTML 版本的人可能会对 HTML 文档类型声明的简单性感到惊讶。事实上，早期版本的文档类型声明实际上并不是 HTML 语言的一部分——因此需要对架构文档进行冗长的引用。相比之下，现代\
  \ HTML 文档类型声明是 HTML 本身的一个内在部分。\n\n![image](img/hot.jpg)\n\n早期版本 HTML 的文档类型声明是 HTML\
  \ 所派源的标准通用标记语言（SGML）的一部分。\n\n整个文档头部部分和主体部分可以封装在一对 `<html>` `</html>` 标签中，以包含文档的其他部分。HTML\
  \ 规范实际上规定这些是可选的，但提供单一的“根”元素是有逻辑的。大多数 HTML 标签都像这样成对使用，用作“容器”，语法为 `<tagname> 数据 </tagname>`\n\
  \n### 头部部分\n\n文档的头部部分以 HTML 开启标签 `<head>` 开始，以相应的关闭标签 `</head>` 结束。稍后可以在这两个标签之间添加描述文档的数据，以完成\
  \ HTML 文档的头部部分。\n\n### 主体部分\n\n文档的主体部分以 HTML 开启标签 `<body>` 开始，以相应的关闭标签 `</body>`\
  \ 结束。稍后可以在这两个标签之间添加要在中显示的内容，以完成 HTML 文档的主体部分。\n\n### 代码注释\n\n注释可以添加到头部和主体部分的任何位置，位于\
  \ `<!--` 和 `-->` 标签之间。注释标签之间的任何内容会被浏览器忽略。\n\n![image](img/hot.jpg)\n\nHTML “元素”是任何匹配的开启和关闭标签对，或者任何不需要关闭标签的单个标签。\n\
  \n### 结构\n\n因此，创建每个 HTML 文档的基础结构标记如下所示：\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n\
  <!-- 此处添加描述文档的数据 -->\n</head>\n<body>\n<!-- 此处添加要在浏览器中显示的内容 -->\n</body>\n</html>\n\
  ```\n\n![image](img/hot.jpg)\n\n代表制表符、换行符、回车和空格的“不可见”字符统称为“空白字符”。它们可以可选地插入标签以提高清晰度。\n\
  \n## 创建文档\n\n这里描述的基础 HTML 文档结构可以使用任何纯文本编辑器——如 Windows 的记事本程序来创建简单的 HTML 文档。为了创建一个“骨架”HTML\
  \ 文档，必须首先添加定义文档主要编写语言、字符编码格式和标题的信息。\n\n![image](img/pg16_1.jpg)\n\n文档的主要语言通过在开启的\
  \ `<html>` 根标签内为 `lang` “属性”分配标准语言代码来定义。英语的代码为 `en`，因此完整的开启根元素如下：`<html lang=\"\
  en\">`\n\n\n\n\n\n文档的字符编码格式通过在位于文档头部（head section）的 `<meta>` 标签中为 `charset` 属性分配标准字符集代码来定义。推荐的编码是流行的\
  \ 8 位 Unicode 转换格式，其代码为 `UTF-8`，因此完整的元素看起来如下：`<meta charset=“UTF-8”>`\n\n![image](img/snake.jpg)\n\
  \nHTML 文档不应在 MS Word 等文字处理器中创建，因为这些应用程序在文件格式中包含了额外信息。\n\n最后，文档标题通过放置在文档头部区域的一对 `<title>\
  \ </title>` 标签之间的文本来定义。\n\n## 创建基础 HTML 文档\n\n按照以下步骤创建一个有效的基础 HTML 文档：\n\n![image](img/1b.jpg)\
  \ 启动你喜欢的纯文本编辑器，然后使用 HTML 文档类型声明开始一个新文档：\n\n```\n<!DOCTYPE HTML>\n```\n\n![image](img/htmlb.jpg)\n\
  `hello.html`\n\n![image](img/2b.jpg) 在文档类型声明下方，添加一个根元素，将文档的主要语言定义为英语：\n\n```\n<html\
  \ lang=”en”>\n<!-- Head and Body sections to be added here. -->\n</html>\n```\n\n\
  ![image](img/3b.jpg) 在根元素内部，插入一个文档头部区域：\n\n```\n<head>\n<!-- Descriptive information\
  \ to be added here. -->\n</head>\n```\n\n![image](img/4b.jpg) 在头部区域内，插入一个定义文档编码字符集的元素：\n\
  \n```\n<meta charset=“UTF-8”>\n```\n\n![image](img/hot.jpg)\n\n`<meta>` 标签是一个单标签——它没有匹配的闭合标签。查看此书内封扉页的元素标签列表可以找到其他单标签。\n\
  \n![image](img/5b.jpg) 接下来，在头部区域内，插入一个定义文档标题的元素：\n\n```\n<title>Get Started in HTML</title>\n\
  ```\n\n![image](img/6b.jpg) 在头部区域之后，插入一个文档主体区域：\n\n```html\n<body>\n<!-- Actual\
  \ document content to be added here. -->\n</body>\n```\n\n![image](img/7b.jpg) 在主体区域内，插入一个一级标题：\n\
  \n```\n<h1>Hello World!</h1>\n```\n\n![image](img/pg17_1.jpg)\n\n![image](img/8b.jpg)\
  \ 将文件的编码设置为 `UTF-8` 格式，然后将文档保存为 `hello.html`\n\n![image](img/pg17_2.jpg)\n\n![image](img/9b.jpg)\
  \ 现在，在现代网页浏览器中打开 HTML 文档，查看标题栏或标签上显示的标题，以及作为大标题显示的文档内容。\n\n![image](img/pg17_3.jpg)\n\
  \n![image](img/forget.jpg)\n\n属性值周围的双引号通常是可选的，但对于多个值来说是必须的。为了一致性，本书中示例中的属性值都用引号包围。\n\
  \n![image](img/hot.jpg)\n\n你可以在此处发现更多关于标题的内容。\n\n## 验证文档\n\n正如文本文档可能包含拼写和语法错误一样，HTML\
  \ 文档可能包含各种使其无法符合规范规则的错误。为了验证 HTML 文档确实符合其指定的文档类型声明的规则，可以使用验证工具进行测试。只有成功通过验证测试的 HTML\
  \ 文档才能确定是有效的文档。\n\n![image](img/pg18_1.jpg)\n\n网页浏览器并不尝试验证，因此在发布之前，使用验证工具验证每个 HTML\
  \ 文档是完全值得的，即使内容在你的网页浏览器中看起来没问题。当浏览器遇到 HTML 错误时，它会对预期意图进行猜测——但不同的浏览器可能会有不同的解释，因此可能会错误地显示文档。相反，有效的\
  \ HTML 文档在任何符合标准的浏览器中都应该始终正确显示。\n\n万维网联盟（W3C）在 `[validator.w3.org](http://validator.w3.org)`\
  \ 提供了一个免费的在线验证工具，你可以用它检查网页文档的语法：\n\n![image](img/1b.jpg) 连接互联网后，打开网页浏览器并导航到 `[validator.w3.org](http://validator.w3.org)`\
  \ 的 W3C 验证工具，然后点击**Validate by Upload**（通过文件验证）标签。\n\n![image](img/pg18_2.jpg)\n\
  \n![image](img/hot.jpg)\n\n验证器中的其他标签允许你输入位于 Web 服务器上的 HTML 文档地址以进行“Validate by URI”（通过\
  \ URI 验证），或复制粘贴文档中的所有代码以“Validate by Direct Input”（通过直接输入验证）。\n\n![image](img/2b.jpg)\
  \ 点击**Browse**按钮，然后导航到你想验证的 HTML 文档——一旦选中，它的本地路径就会出现在验证器的“File”字段中。\n\n![image](img/3b.jpg)\
  \ 接下来，点击验证器的**Check**按钮以上传 HTML 文档的副本并运行验证测试——结果将显示出来。\n\n![image](img/pg19_1.jpg)\n\
  \n![image](img/forget.jpg)\n\n验证器会自动检测文档的字符集和 HTML 版本。\n\n如果验证失败，将列出错误以便你轻松修正它们。当验证成功时，你可以选择在文档末尾包含一个合适的标志以证明验证：\n\
  \n![image](img/pg19_2.jpg)\n\n![image](img/hot.jpg)\n\n验证标志可以自定义，并在 `[w3.org/html](http://www.w3.org/html)`\
  \ 处生成用于网页的类。\n\n## 赋予标题\n\n![image](img/pg20_1.jpg)\n\n规范要求每个 HTML 文档都有标题，但其重要性经常被忽视。标题应该被仔细考虑，因为它被用于：\n\
  \n- **Bookmarks**（书签）——保存的标题。\n- **Title Bar**（标题栏）——网页浏览器显示。\n- **Navigation Tab**（导航标签）——网页浏览器显示。\n\
  - **History**（历史记录）——保存标题。\n- **Search Engines**（搜索引擎）——在搜索结果中显示。\n\n标题情况下应该是简短且有意义的——现代标签浏览器可能显示\
  \ 10 个字符。\n\n整个网站的标题应遵循一致的命名法，并将每个单词大写。一种流行的命名法提供公司名称和概要描述，并用连字符分隔。例如，“Amazon -\
  \ C Programming in easy steps”。另一种是将描述放在前面，这样当标题被截断时依然可见。例如，“C Programming in easy\
  \ steps - Amazon”。\n\n![image](img/pg20_2.jpg)\n\n![image](img/pg20_3.jpg)\n\n\n\
  \n\n```html\n<!-- 此处添加描述文档的数据。 -->\n</head>\n<body>\n<!-- 此处添加要在浏览器中显示的内容。 -->\n\
  </body>\n</html>\n```\n\n![image](img/3b.jpg) 在 `head` 部分中，插入一个指定字符集的 `meta` 元素和一个空的\
  \ `title` 元素：\n\n```html\n<meta charset=“UTF-8”>\n<title> </title>\n```\n\n![image](img/4b.jpg)\
  \ 在 `title` 元素中插入一个包含实体的标题：\n\n`&lt;HTML in easy steps&gt;`\n\n![image](img/5b.jpg)\
  \ 保存文档，然后在网页浏览器中打开它。\n\n![image](img/pg21_1.jpg)\n\n![image](img/6b.jpg) 启动语音叙述器，听到标题可能被读作“小于号-HTML-in-easy-steps-大于号”。\n\
  \n![image](img/7b.jpg) 编辑文档标题，使其更友好：\n\n`\"HTML in easy steps\"`\n\n![image](img/pg21_2.jpg)\n\
  \n![image](img/8b.jpg) 再次保存文档，然后在网页浏览器中打开它，听到叙述器现在将文档标题读作“HTML in easy steps”。\n\
  \n![image](img/forget.jpg)\n\n字符集可以像这里所示用大写定义，也可以用小写定义为 `utf-8`。\n\n![image](img/hot.jpg)\n\
  \n在 Windows 10 中，按 `Winkey` + `Ctrl` + `Enter` 启动叙述器，然后点击标签页以听到标题。标签页上不可见的标题文本仍会被叙述器读出。Windows\
  \ 10 会忽略标题中的尖括号，但在早期版本的 Windows 中，叙述器会逐字读出它们。\n\n## 提供元数据\n\n元信息就是描述其他数据的数据。在 HTML\
  \ 的上下文中，文档元数据描述的是文档本身，而不是文档的内容。\n\n![image](img/pg22_1.jpg)\n\nHTML 元数据在 HTML 文档的\
  \ `head` 部分中使用 `<meta>` 标签定义。`<meta>` 标签是一个“空”标签，不需要匹配的结束标签来创建 HTML 元素——它仅用于通过其标签属性指定信息。前面的示例已经使用此标签指定了文档的字符集。可以添加更多的\
  \ `<meta>` 标签来描述文档的其他方面。\n\n考虑到可能有大量手持设备查看网页，通过在 HTML 文档的 `head` 部分中包含以下 `<meta>`\
  \ 标签来优化页面以适应较小屏幕是很有用的：\n\n```html\n<meta name=”viewport” content=”width=device-width,\
  \ initial-scale=1”>\n```\n\n这将确保文档填满设备屏幕宽度，并设置初始缩放级别，使内容不被缩放。\n\n`<meta>` 标签还可以将文档的\
  \ HTTP 头属性分配给 `http-equiv` 属性，并将该属性的值指定给 `content` 属性。你可以将 HTTP 的“refresh”属性分配给\
  \ `http-equiv` 属性，以便在 `content` 属性指定的秒数后重新加载页面——例如，在五秒后重新加载页面，如下所示：\n\n```html\n\
  <meta http-equiv=“refresh” content= “5”>\n```\n\n这种技术常用于网站动态更新新闻或状态项，因为它不依赖于 JavaScript\
  \ 支持。\n\n另一种常见用法是在指定秒数后将浏览器重定向到新网页，如下所示：\n\n```html\n<meta http-equiv=“refresh”\
  \ content= “5 ; url=’new-page.html’ ”>\n```\n\n在这种情况下，`<meta>` 标签的 `content` 属性同时指定了延迟的秒数和要加载的新\
  \ URL。\n\n![image](img/hot.jpg)\n\n将 `width` 设置为 `device-width` 通常会自动将 `initial-scale`\
  \ 设置为 `1`，但显式将其设置为元数据也无妨。\n\n![image](img/1b.jpg) 创建一个极简的 HTML 文档：\n\n```html\n\
  <!DOCTYPE HTML>\n<html lang=“en”>\n<head>\n<meta charset=”UTF-8”>\n<!-- 此处插入更多元数据。\
  \ -->\n<title>Meta Refresh</title>\n</head>\n<body>\n<h1>5 秒后移动...</h1>\n</body>\n\
  </html>\n```\n\n![image](img/htmlb.jpg)\n`refresh.html`\n\n![image](img/2b.jpg)\
  \ 再插入两个元数据元素：\n\n```html\n<meta name=”viewport” content=”width=device-width, initial-scale=1”>\n\
  <meta http-equiv=“refresh” content= “5 ; url=’https://ineasysteps.com’ ”>\n```\n\
  \n![image](img/3b.jpg) 保存文档，然后在网页浏览器中打开它，等待五秒，看到浏览器重定向。\n\n![image](img/pg23_1.jpg)\n\
  \n![image](img/hot.jpg)\n\n当你只向 `url` 属性指定域名时（如本例），浏览器会自动加载该域名位置下的 `index.html`\
  \ 页面。\n\n## 描述内容\n\n除了指定文档的字符集和过期日期外，`<meta>` 标签还可用于提供搜索引擎可能使用的信息。但这并不能保证高排名，因为搜索引擎还会使用其他页面信息来实现这一目的——尤其是文档标题。通常，搜索引擎结果页面（SERP）会在搜索结果中页面标题下方显示元描述。\n\
  \n![image](img/pg24_1.jpg)\n\n搜索引擎优化（SEO）备受重视，以确保网页出现在 SERP 顶部，从而增加网站流量。不幸的是，没有万无一失的技术可以实现这一点，因为搜索引擎不断改变页面排名的算法。然而，提供描述页面内容的元数据仍然是有用的。\n\
  \n描述性的 `<meta>` 标签有一个 `name` 属性，赋值为“description”，以及一个 `content` 属性，赋值为页面内容的描述。\n\
  \n描述应在 50-160 个字符之间，因为过长的描述可能会被截断。描述应包含与文本内容相关的关键词。例如，搜索“italian ceramics”可能会返回所有描述中包含“italian”和“ceramics”的网页。\n\
  \n描述充当广告文案，因此使用重要关键词编写可读性强、引人注目的描述将鼓励用户从 SERP 访问页面。不应在描述中重复关键词，但应尽量使用关键词的复数形式——以匹配使用该词单数和复数形式的搜索。此外，不应在描述中包含双引号，因为\
  \ Google 可能会在双引号处截断描述。\n\n如果网站包含内容相同或非常相似的页面，可以通过在 HTML 代码中包含“规范链接”来指定要索引的页面，以指示首选来源。这使用包含\
  \ `rel`（关系）属性（赋值为“canonical”）和 `href`（超文本引用）属性（指定首选页面的 URL 地址）的 `<link>` 标签。\n\n\
  ![image](img/forget.jpg)\n\n所有搜索引擎都会找到要添加到索引中的页面——即使该页面从未提交给它们。\n\n![image](img/hot.jpg)\n\
  \n始终在描述中包含三个最重要的关键词。\n\n![image](img/1b.jpg) 创建一个极简的 HTML 文档：\n\n```html\n<!DOCTYPE\
  \ HTML>\n<html lang=“en”>\n<head>\n<meta charset=”UTF-8”>\n<!-- 此处插入更多元数据。 -->\n\
  <title>Tuscan Home Decor</title>\n</head>\n<body> <h1>Beautiful Tuscan Ceramics</h1>\
  \ </body>\n</html>\n```\n\n![image](img/htmlb.jpg)\n`keywords.html`\n\n![image](img/2b.jpg)\
  \ 插入网页的元描述：\n\n```html\n<meta name=“description” content=“Explore our extensive\
  \ range of high quality italian ceramics including tuscan majolica, dinnerwares,\
  \ vases, plates, and bowls”>\n```\n\n![image](img/3b.jpg) 接下来，在 `head` 部分中添加一个元素，指定此页面是索引目的的首选页面：\n\
  \n```html\n<link rel=”canonical” href=”https://www.example.com/keywords.html” >\n\
  ```\n\n![image](img/4b.jpg) 保存文档，然后访问 Chrome 网上应用店 `chrome.google.com/webstore/category/extensions`，搜索“seo”以添加搜索引擎分析扩展。\n\
  \n\n\n\n\n![image](img/5b.jpg) 在 Google Chrome 浏览器中打开 HTML 文档，然后使用分析工具查看元数据\n\n\
  ![image](img/pg25_1.jpg)\n\n![image](img/hot.jpg)\n\n网上有很多免费的元标记（meta tag）生成器可用——在搜索引擎中输入“free\
  \ meta tag generator”即可。\n\n## 添加样式\n\n级联样式表（CSS）规则可以包含在 HTML 文档中，以控制页面上每个元素的显示效果。样式表的使用已经取代了\
  \ HTML 中所有以前与显示相关的功能。例如，`<font>` 标签已经过时，因为字体族、粗细、样式和大小现在由样式表规则指定。\n\n![image](img/pg26_1.jpg)\n\
  \n嵌入 `<style> </style>` 标签的样式表可以添加到 HTML 文档的 head 部分，用封包含控制内容显示方式的规则。例如，一个包含确定所有一级标题外观规则的简单样式表看起来像这样：\n\
  \n```css\n<style>\nh1 { color : red ; background : yellow ; }\n</style>\n```\n\n\
  这种做法是可以接受的并且可以通过验证，但为了 HTML 将内容与显示分离的目标，样式表也可以包含在单独的文件中。将样式表存放在单独文件中的巨大优势是它们可以应用于多个\
  \ HTML 文档——从而使网站维护变得简单得多。编辑共享的样式表会立即影响共享该文件的每个 HTML 文档。\n\n外部样式表通过在文档的 head 部分添加\
  \ `<link>` 标签包含在 HTML 文档中。该标签必须包含一个被赋值为“stylesheet” 值的 `rel`（关系）属性，并将样式表的 URL 赋值给其\
  \ `href`（超文本引用）属性——例如，添加一个名为 `style.css` 的相邻样式表文件，如下所示：\n\n`<link rel=“stylesheet”\
  \ href=“style.css”>`\n\n你也可以将样式规则“内联”到显示 HTML 标签的 style 属性中，如下：\n\n`<h1 style=”color:red”>`\n\
  \n内联样式规则在某些情况下很有用，但可能会使页面维护变得困难。\n\n![image](img/snake.jpg)\n\n当多个规则选择元素的同一个属性进行样式设置时，浏览器通常会应用最后读取的规则，但内联规则的优先级高于嵌入规则和外部规则。嵌入规则的优先级高于外部规则。\n\
  \n![image](img/1b.jpg) 创建一个基础 HTML 文档\n\n```html\n<!DOCTYPE HTML>\n<html lang=“en”>\n\
  <head>\n<meta charset=”UTF-8”>\n<title>Style Sheet Example</title>\n</head>\n<body>\n\
  <h1>Styled Heading</h1>\n</body>\n</html>\n```\n\n![image](img/htmlb.jpg)\n`style.html`\n\
  \n![image](img/2b.jpg) 接下来，在 head 部分，添加一个嵌入式样式表\n\n```css\n<style>\nh1 { color :\
  \ Red ; background : Yellow ; }\n</style>\n```\n\n![image](img/3b.jpg) 现在，在 head\
  \ 部分，插入一个指向相邻外部样式表文件的链接\n\nlink-`<link rel=“stylesheet” href=“style.css”>`\n\n![image](img/css.jpg)\n\
  `style.css`\n\n![image](img/4b.jpg) 保存 HTML 文档，然后打开一个新的文本编辑器窗口，并精确复制此样式表\n\n```css\n\
  h1\n{\nborder : 10px dashed Blue ;\npadding : 5px ;\nwidth : 500px ;\n}\n```\n\n\
  ![image](img/5b.jpg) 将级联样式表文件保存到与 HTML 文档相同的目录下，然后在浏览器中打开网页以查看所应用的样式规则\n\n![image](img/pg27_1.jpg)\n\
  \n![image](img/forget.jpg)\n\n某些 HTML 元素，如 `<div>` 和 `<span>`（参见此处）纯粹是为了样式设置。CSS\
  \ 是一个独立的话题，但书中的许多示例包含了嵌入的 CSS 样式表规则，以提供独立的示例文件来演示 HTML 元素的使用。某些源代码示例包含了未列出的 CSS\
  \ 规则，用于说明屏幕图中 HTML 元素及其内容的大小和位置。\n\n##包含脚本\n\n脚本可以包含在 HTML 文档中，以与用户交互并提供动态效果。随着页面部分可以动态更新的网页的发展，这种能力已变得越来越重要。以前，浏览器通常会从\
  \ Web 服务器请求整个新页面，这效率较低且更加繁琐。\n\n![image](img/pg28_1.jpg)\n\n由 `<script> </script>`\
  \ 标签封装的 JavaScript 代码可以嵌入 HTML 文档中。这些代码最好放在文档的 body 部分，紧邻 `</body>` 闭合标签之前，这样浏览器可以在读取脚本之前处理文档的内容。\n\
  \n为了 HTML 将内容与显示分离的目标，脚本也可以包含在单独的文件中。在这种情况下，脚本文件的 URL 地址必须赋值给 `<script>` 标签内的 `src`\
  \ 属性。还需要 `</script>` 闭合标签。这些也可以放在 HTML 文档 body 部分的末尾，因为浏览器会将外部脚本处理得就像嵌入在那里一样——例如，添加一个名为\
  \ `script.js` 的相邻外部脚本文件，如下所示：\n\n`<script src=“script.js”></script>`\n\n![image](img/snake.jpg)\n\
  \n记住 `<script>` 标签始终需要一个闭合标签。\n\n你也可以将脚本“内联”到 HTML 标签的事件属性中。例如，识别鼠标点击事件：\n\n`<h1\
  \ onclick=”alert('Clicked!')>`\n\n内联脚本在某些情况下很有用，但可能会使页面维护变得困难。备用内容可以在文档 body 部分的\
  \ `<noscript> </noscript>` 标签之间提供，当脚本功能缺失时将显示。\n\n![image](img/1b.jpg) 创建一个基础 HTML\
  \ 文档\n\n```html\n<!DOCTYPE HTML>\n<html lang=“en”>\n<head>\n<meta charset=”UTF-8”>\n\
  <title>JavaScript Example</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n![image](img/htmlb.jpg)\n\
  `script.html`\n\n![image](img/2b.jpg) 在 body 部分，插入备用消息和标题\n\n```html\n<noscript>JavaScript\
  \ Not Enabled!</noscript>\n<h1 onclick=”this.innerText='Clicked!'; this.style.color='Red’”>Active\
  \ Heading</h1>\n```\n\n![image](img/3b.jpg) 在 body 部分的末尾，添加一个嵌入式脚本并指定外部脚本\n\n```html\n\
  <script>\ndocument.getElementsByTagName('h1')[0].onmouseover =\nfunction ( ) {\n\
  this.innerText= ’Mouse Over’ ; this.style.color='Blue’ }\n</script>\n<script src=”script.js”>\
  \ </script>\n```\n\n![image](img/js.jpg)\n`script.js`\n\n![image](img/4b.jpg) 保存\
  \ HTML 文档，然后打开一个新的文本编辑器窗口并创建外部脚本\n\n```javascript\ndocument.getElementsByTagName('h1')[0].onmouseout\
  \ =\nfunction ( ) {\nthis.innerText= ’Active Heading’ ; this.style.color = ’Black’\
  \ }\n```\n\n![image](img/5b.jpg) 将 JavaScript 文件保存为 `script.js` 到与 HTML 文档相同的目录下，然后在浏览器中打开网页并点击标题\n\
  \n![image](img/pg29_1.jpg)\n\n![image](img/pg29_2.jpg)\n\n![image](img/pg29_3.jpg)\n\
  \n![image](img/forget.jpg)\n\n某些 HTML 元素，如 `<template>` 和 `<slot>`（参见此处）纯粹是为了脚本。JavaScript\
  \ 是一个独立的话题，但书中的许多示例包含了的 JavaScript 代码，以提供独立的示例文件来演示 HTML 元素的使用。\n\n## 链接资源\n\n在之前的示例中用于在\
  \ HTML 文档中引入样式表的 `<link>` 标签也可以用于将其他资源引入文档。\n\n![image](img/pg30_1.jpg)\n\n此标签只能出现在文档的\
  \ head 部分，但 head 部分可以包含多个 `<link>` 标签。每个 `<link>` 标签必须包含 `rel` 和 `href` 属性，来说明链接资源的关系和位置。它也可以在适当的情况下包含\
  \ `type` 属性，以提示链接资源的 MIME 类型。\n\n\n\n\n\n| 允许的 rel（关系）值 |\n| :--- |\n| `alternate`\
  \ | `author` | `bookmark` | `help` | `icon` |\n| `license` | `next` | `nofollow`\
  \ | `noreferrer` | `prev` |\n| `search` | `stylesheet` | `tag` | `shortcut icon`\
  \ | |\n\n![image](img/hot.jpg)\n\nMIME（多部分互联网邮件扩展）类型描述了文件类型——例如用于 HTML 文件的 `text/html`。你可以在\
  \ [`www.iana.org/assignments/media-types/media-types.xhtml`](https://www.iana.org/assignments/media-types/media-types.xhtml)\
  \ 找到官方 MIME 类型列表。\n\n上述许多链接类型旨在帮助搜索引擎定位与该 HTML 文档关联的资源，且 `<link>` 标签还可以包含一个 `title`\
  \ 属性来进一步描述该资源——例如，另一种语言的页面版本：\n\n```html\n<link rel=“alternate” type=“text/html”\
  \ href=“esp.html” title=“Esta página en Español - This page in Spanish” >\n```\n\
  \n在这种情况下，资源的位置是使用相对地址指定的，默认情况下，浏览器会在 HTML 文档所在的目录中查找。然而，通过在文档的 `head` 部分开头插入一个 `<base>`\
  \ 标签，可以使浏览器在不同的目录中查找相对地址。其 `href` 属性可以指定绝对目录地址——例如，指定一个单独的“resources”目录，如下：\n\n\
  ```html\n<base href= “http://localhost/resources/”>\n```\n\n将图标资源链接到网页浏览器中显示是一种常见做法。该文件被精确命名为\
  \ `favicon.ico`，可以放在与 HTML 文档相同的目录中，也可以放在 `<base>` 标签指定的目录。所有浏览器都能识别 `<base>` 标签指定目录中的任何其他资源。\n\
  \n![image](img/snake.jpg)\n\n使用 `<base>` 元素时，必须将其放在 `head` 部分任何 `<link>` 元素之前。\n\
  \n![image](img/1b.jpg)\n创建一个包含元数据、链接资源以及样式规则和脚本代码区域的新 HTML 文档：\n\n```html\n<!DOCTYPE\
  \ HTML>\n<html lang=“en”>\n<head>\n    <meta charset=“UTF-8”>\n    <meta name=”viewport”\
  \ content=”width=device-width,initial-scale=1”>\n    <link rel=“shortcut icon” href=“favicon.ico”>\n\
  \    <title>Document Title</title>\n    <style>\n    </style>\n</head>\n<body>\n\
  \    <script>\n    </script>\n</body>\n</html>\n```\n\n![image](img/forget.jpg)\n\
  \n此模板是所有后续示例中都用于创建新 HTML 文档的基础 HTML 文档——只有标题会根据每个示例进行更改。\n\n![image](img/2b.jpg)\n\
  在 `head` 部分开头插入一个元素来指定基础“resources”目录：\n\n```html\n<base href=“http://localhost/resources/”>\n\
  ```\n\n![image](img/3b.jpg)\n将文档标题改为“Favicon”，然后保存 HTML 文档。\n\n![image](img/htmlb.jpg)\n\
  `favicon.html`\n\n![image](img/4b.jpg)\n打开图标编辑器并创建一个 32 x 32 像素的图标，并将你的图标与 HTML\
  \ 文档一起保存，或在“resources”目录中命名为 `favicon.ico`。\n\n![image](img/pg31_2.jpg)\n`favicon.ico`\
  \ 32px x 32px\n\n![image](img/5b.jpg)\n通过网络服务器在网页浏览器中打开 HTML 文档，以查看图标资源出现在浏览器中。\n\
  \n![image](img/pg31_1.jpg)\n\n![image](img/hot.jpg)\n\n你可以通过为链接的 `href` 属性分配 `favicon.ico?v=2`\
  \ 来强制浏览器刷新 favicon。\n\n## 总结\n\n- Web 超文本应用技术工作组 (WHATWG) 负责 HTML 实时标准。\n- 超文本传输协议\
  \ (HTTP) 是 Web 服务器使用的通用通信标准。\n- 统一资源定位符 (URL) 是由协议、域名和路径部分组成的绝对网络地址。\n- 相对地址可以通过名称引用相邻文件，并可以使用\
  \ `../` 语法引用父目录。\n- Web 服务器向请求的计算机发送响应头以及请求文件的副本，或发送错误代码。\n- 每个 HTML 文档都应该有一个文档类型声明、一个\
  \ `head` 部分和一个 `body` 部分。\n- 文档本身的信息包含在 `head` 部分，内容包含在 `body` 部分。\n- 文档的编写语言在起始根元素\
  \ `<html>` 的 `lang` 属性中指定。\n- 文档的字符集编码在 `head` 部分中 `<meta>` 标签的 `charset` 属性中指定。\n\
  - 文档标题在 `head` 部分的 `<title> </title>` 标签之间指定。\n- 可以免费的在线 W3C 验证工具来验证 HTML 文档无错误。\n\
  - 元数据描述文档，内容描述可以被搜索引擎用于索引网页。\n- `<style> </style>` 标签可以用于在 HTML 文档中嵌入样式表。\n- `<script>\
  \ </script>` 标签可以用于在 HTML 文档中包含内部外部 JavaScript 代码。\n- `<link>` 标签可以用于在 HTML 文档中嵌入外部样式和其他和其他。\n\
  \n# 2 结构化网页\n\n![image](img/pg11_1.jpg)\n\n*本章演示了如何将页面内容划分到组和章节。*\n\n- 声明标题\n- 分组标题\n\
  - 包含导航\n- 完成框架\n- 创建章节\n- 提供侧注\n- 修订划分\n- 总结\n\n## 声明标题\n\nHTML 标题元素使用 `<h1>`、`<h2>`、`<h3>`、`<h4>`、`<h5>`\
  \ 和 `<h6>` 标签创建。这些元素根据其数值进行重要性排序——`<h1>` 的重要性最高，`<h6>` 重要性最低。\n\n标题元素应该通过正确排序来隐式传达文档结构——即\
  \ `<h2>` 位于 `<h1>` 元素之下，`<h3>` 位于 `<h2>` 元素之下，以此此类推。这种结构有助于读者通过标题快速浏览文档。搜索引擎爬虫可能会推广具有正确顺序标题的文档，因为它们可以使用标题进行索引。\n\
  \n![image](img/34_1.jpg)\n\n标题的字体大小和权重将反映其重要性，但标题也有其他用途。将 `head` 部分的元关键词包含在标题中特别有用。<h1>\
  \ 元素元素是最重要的标题，理想情况下只出现一次以声明文档标题。通常，这可以是文档标题的简明版本。在其下方，若干 `<h2>` 标题可以为长文档声明主题标题。每个主题可能包含\
  \ `<h3>` 元素中的文章标题，随后是包含实际文章内容的 `<p>` 元素。\n\n![image](img/1r.jpg)\n创建一个 HTML 文档（参考模板）\n\
  \n![image](img/htmlr.jpg)\n`heading.html`\n\n![image](img/2r.jpg)\n在 `body` 部分中插入一个主文档标题：\n\
  \n```html\n<h1>Document Heading</h1>\n```\n\n![image](img/3r.jpg)\n接下来，在 `body`\
  \ 部分中插入一个主题标题：\n\n```html\n<h2>Topic Heading</h2>\n```\n\n![image](img/4r.jpg)\n\
  现在，在 `body` 部分中插入一些文章标题，随后是包含文章内容的段落：\n\n```html\n<h3>Article Heading</h3>\n<p>Article\
  \ content...</p>\n\n<h3>Article Heading</h3>\n<p>Article content...</p>\n```\n\n\
  ![image](img/snake.jpg)\n\n永远不要为了字体属性使用标题元素，因为这些可以被样式表规则覆盖——始终考虑使用标题来表示结构。\n\n![image](img/5r.jpg)\n\
  最后，添加另一个包含两个文章的主题。\n\n\n\n\n\n## 主题标题\n\n### 文章标题\n文章内容...\n\n### 文章标题\n文章内容...\n\
  \n![image](img/6r.jpg) 保存 HTML 文档，然后在网页浏览器中打开，即可查看标题和文档结构\n\n![image](img/pg35_1.jpg)\n\
  \n![image](img/pg35_2.jpg)\n\n由顺序排列的标题创建的文档结构被称为文档“大纲”。正确构建的大纲允许页面的一部分（例如单篇文章）轻松地聚合到另一个网站中。上方文档的大纲已在上方截图旁边展示。\n\
  \n![image](img/hot.jpg)\n\n你将在此处了解更多关于 `<p>` 段落元素的内容。\n\n![image](img/hot.jpg)\n\
  \n本章中的所有截图都添加了（未列出的）样式规则，以更清晰地说明所描述的元素。\n\n## 分组标题\n\n![image](img/pg36_1.jpg)\n\
  \n标题有时会带有子标题或标语。例如，文档标题可以这样标记：\n\n```html\n<h1>美国航空公司</h1>\n<h2>做我们最擅长的事</h2>\n\
  ```\n\n不幸的是，这严格来说要求所有后续标题必须为 `<h3>` 到 `<h6>`，以保持正确排序的大纲。幸运的是，HTML 通过 `<hgroup> </hgroup>`\
  \ 元素提供了一种分组解决方案。它可以用来同时包含标题和子标题，如下所示：\n\n```html\n<hgroup>\n  <h1>美国航空公司</h1>\n\
  \  <h2>做我们最擅长的事</h2>\n</hgroup>\n```\n\n一个文档可以包含多个 `<hgroup>` 元素，每个 `<hgroup>` 元素可以包含从\
  \ `<h1>` 到 `<h6>` 的标题。\n\n完整的页眉可以包含在 `<header> </header>` 标签中，以包含标题元素或 `<hgroup>`\
  \ 元素，以及其他介绍性内容——例如横幅、徽标或目录。\n\n![image](img/1r.jpg) 创建一个 HTML 文档（按照此处的模板）\n\n![image](img/htmlr.jpg)\n\
  `header.html`\n\n![image](img/2r.jpg) 在 body 部分中，插入一个包含横幅图片的主文档标题\n\n```html\n<header>\n\
  \  <img src=”header-banner.png” width=”500” height=”72” alt=”Banner”>\n  <hgroup>\n\
  \    <h1>HTML</h1>\n    <h2>构建更好的网站</h2>\n  </hgroup>\n</header>\n```\n\n![image](img/3r.jpg)\
  \ 接下来，在 body 部分中，插入一个主题和文章\n\n```html\n<hgroup>\n  <h2>主题标题</h2>\n  <h3>文章标题</h3>\n\
  </hgroup>\n<p>文章内容...</p>\n```\n\n![image](img/snake.jpg)\n\n你不能将一个 `<header>` 元素嵌套在另一个\
  \ `<header>` 元素中。\n\n![image](img/hot.jpg)\n\n你将在此处了解更多关于 `<img>` 图像元素的内容。\n\n![image](img/4r.jpg)\
  \ 现在，在 body 部分中，插入第二个主题及其单篇文章\n\n```html\n<hgroup>\n  <h1>CSS</h1>\n  <h2>层叠样式表</h2>\n\
  \  <h3>文章标题</h3>\n</hgroup>\n<p>文章内容...</p>\n```\n\n![image](img/5r.jpg) 保存 HTML\
  \ 文档，然后在网页浏览器中打开，即可查看分组标题和文档页眉\n\n![image](img/pg37_2.jpg)\n\n![image](img/pg37_3.jpg)\n\
  \n![image](img/forget.jpg)\n\n`<hgroup>` 元素仅对 `<h1>` 到 `<h6>` 的标题进行分组，而 `<header>`\
  \ 元素则对标题和其他附加项目进行分组。\n\n## 包含导航\n\n网页上用于使用户在页面或网站内导航的超链接组，应包含在 `<nav> </nav>` 标签之间，其他链接则使用\
  \ `<menu> </menu>` 标签。\n\n![image](img/pg38_1.jpg)\n\n这组链接通常可以是文档页眉中的水平菜单——通常称为导航栏（“nav\
  \ bar”）——也可以是页面边缘的垂直菜单。请注意，`<nav>` 元素只是菜单的包装器——它不会替换任何结构元素。\n\n![image](img/1r.jpg)\
  \ 创建一个 HTML 文档（按照此处的模板）\n\n![image](img/htmlr.jpg)\n`nav.html`\n\n![image](img/2r.jpg)\
  \ 在 body 中，插入一个包含徽标、文档标题和水平页面导航栏的页眉\n\n```html\n<header>\n  <img id=”logo” src=”nav-logo.png”\
  \ alt=”Logo”>\n  <h1>构建更好的网站</h1>\n  <nav id=”horizontal”>\n    <h2>站点链接</h2> \n\
  \    <p>\n      <a href=”#html”>标记语言</a> |\n      <a href=”#js”>脚本</a> |\n     \
  \ <a href=”#css”>样式表</a> \n    </p>\n  </nav>\n</header>\n```\n\n![image](img/3r.jpg)\
  \ 接下来，在 body 中，插入一个垂直站点导航菜单\n\n```html\n<nav id=”vertical” >\n  <h2>页面链接</h2>\n\
  \  <p>延伸阅读\n    <br><br> <a href=”nav-js.html”>JavaScript</a>\n    <br><br> <a href=”nav-css.html”>CSS</a>\
  \ \n  </p>\n</nav>\n```\n\n![image](img/4r.jpg) 现在，添加主题标题和内容\n\n```html\n<h2 id=”html”>HTML</h2>\n\
  <p>关于标记语言的一切...</p>\n\n<h2 id=”js”>JavaScript</h2>\n<p>关于脚本的一切...</p>\n\n<h2 id=”css”\
  \ >CSS</h2>\n<p>关于样式表的一切...</p>\n```\n\n![image](img/hot.jpg)\n\n你将在此处了解更多关于 `<a>`\
  \ 锚点元素的内容，并在此处找到关于 `<br>` 换行元素的详细信息。\n\n![image](img/snake.jpg)\n\n并非所有超链接组都适合包含在\
  \ `<nav>` 元素中——只有那些提供页面级或站点级导航的链接组才适用。\n\n![image](img/5r.jpg) 添加一个样式表，用于定位徽标图像、水平导航栏和垂直导航菜单\n\
  \n```css\n<style>\n#logo { float : left ; }\n#horizontal { padding-left : 100px\
  \ ; display : block ; }\n#vertical { float : left ; padding : 0px 30px 30px 30px\
  \ ; }\n</style>\n```\n\n![image](img/6r.jpg) 保存 HTML 文档，然后在浏览器中打开网页，尝试使用导航链接\n\n\
  ![image](img/pg39_1.jpg)\n\n![image](img/pg39_2.jpg)\n\n![image](img/hot.jpg)\n\n\
  通常将垂直导航菜单创建为无序列表——参见此处。\n\n## 完整框架\n\n正如一个典型的 HTML 文档可能包含文档标题或页眉组一样，它也可能在页面底部包含页脚或页脚组。每个页脚的内容包含在\
  \ `<footer> </footer>` 标签之间，并提供关于该文档部分的信息。\n\n![image](img/pg40_1.jpg)\n\n通常，`<footer>`\
  \ 元素可能包含作者姓名、作者的联系方式（放在 `<address>` 元素中），或版权和法律免责声明（放在 `<small>` 元素中）。与 `<header>`\
  \ 元素类似，`<footer>` 元素也可以包含嵌套在 `<nav>` 元素中的页面和站点导航超链接。\n\n文档标题和页脚可以合理地通过 `<main> </main>`\
  \ 元素分隔，该元素将包含页面内容。\n\n![image](img/1r.jpg) 创建一个 HTML 文档（按照此处的模板）\n\n![image](img/htmlr.jpg)\n\
  `framework.html`\n\n![image](img/2r.jpg) 在 body 中，插入一个文档标题\n\n```html\n<h1 id=”top”>有趣的文章</h1>\n\
  ```\n\n![image](img/3r.jpg) 接下来，添加一个主要内容容器\n\n```html\n<main>\n  <!-- 页面内容将在此处插入。\
  \ -->\n</main>\n```\n\n![image](img/4r.jpg) 在主要内容容器中，插入两篇作为主要页面内容的文章\n\n```html\n\
  <article>\n  <h2 id=”art-1”>莎莉的文章</h2>\n  <p>文章内容...</p>\n</article>\n\n<article>\n\
  \  <h2 id=”art-2”>特里的文章</h2>\n  <p>文章内容...</p>\n</article>\n```\n\n![image](img/forget.jpg)\n\
  \n每个 HTML `<article>` 元素也可以包含一个 `<footer>` 元素，提供文章作者的联系方式。\n\n![image](img/5r.jpg)\
  \ 最后，在 body 中，插入一个包含页面导航超链接、版权信息和 URL 地址的文档页脚\n\n```html\n<footer>\n  <nav>\n  \
  \  <h3>信息</h3>\n    <a href=”#art-1”>莎莉的文章</a> -\n    <a href=”#art-2”>特里的文章</a>\
  \ -\n    <a href=”#top”>返回顶部</a>\n  </nav>\n  <small>版权所有 &copy; 示例公司</small>\n\
  \  <address>www.example.com</address>\n</footer>\n```\n\n\n\n\n\n![image](img/6r.jpg)保存\
  \ HTML 文档，然后在浏览器中打开该网页，你会发现文档结构包含一个标题、页面内容和页脚区域。\n\n![image](img/pg41_1.jpg)\n\n\
  ![image](img/pg41_2.jpg)\n\n## 创建章节\n\n在 HTML 中，`<body>` 元素内的所有内容都被视为一个“章节”（section）的一部分。章节边界通过文档大纲中正确排序的标题隐式定义。也可以通过将内容放在之前示例所示的\
  \ `<header>`、`<main>` 和 `<footer>` 框架元素中显式定义，参见此处。\n\n![image](img/pg42_1.jpg)\n\
  \n文档主体或 `<main>` 元素内的页面内容也可以在 `<section>` `</section>` 标签之间进行分。每个章节通常以它自己的标题开头，随后是若干篇文章（article）。同样，每篇文章通常也以它自己的标题开头，随后是一个或多个段落。\n\
  \n在理解 `<section>` 和 `<article>` 元素时，考虑报纸包含不同章节的方式——新闻、体育、房地产等——会有帮助。每个章节都包含不同的文章。\n\
  \n![image](img/1r.jpg)创建一个 HTML 文档（使用此处的模板）\n\n![image](img/htmlr.jpg)\n\nsection.html\n\
  \n![image](img/2r.jpg)在 body 中插入一个文档标题\n\n```html\n<h1>Newspaper</h1>\n```\n\n![image](img/3r.jpg)接下来，添加一个主内容容器\n\
  \n```html\n<main>\n  <!-- 在此处插入页面内容。 -->\n</main>\n```\n\n![image](img/4r.jpg)现在，在主内容容器中，插入一个包含两篇文章的章节\n\
  \n```html\n<section>\n  <h2>News Section</h2>\n  <article>\n    <h3>Article #1</h3>\n\
  \    <p>Article content...</p>\n  </article>\n  <article>\n    <h3>Article #2</h3>\n\
  \    <p>Article content...</p>\n  </article>\n</section>\n```\n\n![image](img/hot.jpg)\n\
  \n在像这样简短的文档中，并不要求使用 `<section>` 元素——除非你特别想添加章节标题和页脚。\n\n![image](img/5r.jpg)接下来在主内容容器中，插入另一个包含单篇文章的章节\n\
  \n```html\n<section>\n  <h2>Sport Section</h2>\n  <article>\n    <h3>Article #1</h3>\n\
  \    <p>Article content...</p>\n  </article>\n</section>\n```\n\n![image](img/6r.jpg)在主内容容器之后，添加一个页面页脚\n\
  \n```html\n<footer>\n  <small>Copyright &copy; Example Corporation</small>\n</footer>\n\
  ```\n\n![image](img/7r.jpg)保存 HTML 文档然后在浏览器中打开它，查看以章节形式显示的文章内容。\n\n![image](img/pg43_1.jpg)\n\
  \n![image](img/pg43_2.jpg)\n\n![image](img/hot.jpg)\n\n`<section>` 只是一个分组元素，但 `<article>`\
  \ 包含一个独立的组合。\n\n![image](img/forget.jpg)\n\n文档、章节和文章的标题在文档大纲中正确嵌套。\n\n## 提供侧边栏\n\
  \nHTML 有用地提供了 `<aside>` `</aside>` 标签，可以嵌套在 `<article>` 元素内，以包含与该文章主要内容某种相关的内容。这些元素允许包含补充但独立的内容——通常显示为侧边栏或脚注。\n\
  \n![image](img/pg44_1.jpg)\n\n`<aside>` 元素内的内容应该是与文章相关的独立信息，例如从相关文章中提取的引言（pull-quotes）、文章使用的术语表，甚至是指向提供与文章相关的进一步阅读页面的超链接。\n\
  \n或者，`<aside>` 元素也可以单独使用，不带 `<article>` 元素，包含与整个页面相关的次要内容，例如相关的广告或博客。\n\n![image](img/1r.jpg)创建一个\
  \ HTML 文档（使用此处的模板）\n\n![image](img/htmlr.jpg)\n\naside.html\n\n![image](img/2r.jpg)在\
  \ body 中插入一个文档标题\n\n```html\n<h1>Famous Quotes</h1>\n```\n\n![image](img/3r.jpg)接下来，添加一个主内容容器\n\
  \n```html\n<main>\n  <!-- 在此处插入页面内容。 -->\n</main>\n```\n\n![image](img/4r.jpg)现在，在主内容容器中，插入一个包含标题、段落和一个\
  \ `aside` 元素的文章\n\n```html\n<article>\n  <h2>Happiness</h2>\n  <p><q>幸福的秘密不在于做你喜欢的事，而在于喜欢你必须做的事。</q>\
  \ <br>\n  <cite>James M. Barrie</cite></p>\n  <aside>James M. Barrie (1860 - 1937)是一位苏作家和剧作家。</aside>\n\
  </article>\n```\n\n![image](img/forget.jpg)\n\nHTML 的 `<aside>` 和 `<nav>` 元素也可以各自包含一个\
  \ `<footer>` 元素。\n\n![image](img/5r.jpg)在主内容容器中，插入第二个、带有 `class` 属性用于侧边栏的文章\n\n\
  ```html\n<article class=\"sidebar\">\n  <h2>Happiness</h2>\n  <p><q>幸福的秘密不在于做你喜欢的事，而在于喜欢你必须做的事。</q>\
  \ <br>\n  <cite>James M. Barrie</cite></p>\n  <aside>James M. Barrie (1860 - 1937)是一位苏作家和剧作家。</aside>\n\
  </article>\n```\n\n![image](img/6r.jpg)在主内容容器之后，添加一个页面页脚\n\n```html\n<footer>\n\
  \  <small>Copyright &copy; Example Corporation</small>\n</footer>\n```\n\n<style>\n\
  .sidebar > p {\n  padding-right: 20px;\n}\n</style>\n\n![image](img/7r.jpg)保存 HTML\
  \ 文档然后在浏览器中打开它，查看文章内容。\n\n## 修改区块\n\n在早期版本中广泛使用的 `<div>` 标签为了向下兼容继续被支持——但 `<div>`\
  \ 元素没有提供语义。与`<header>`、`<main>`、`<section>`、`<article>`、`<nav>` 和 `<footer>` 等语义元素相比，`<div>`\
  \ 是匿名的。`<nav>` 元素中很容易识别，但在无意义的 `<div>` 元素中并不明显。\n\n`<div>` 元素对于样式目的仍然有用，同样类似的匿名\
  \ `<span>` 标签也是如此。虽然 `<div>` 和 `<span>` 元素本身没有意义，但它们可以包含 `id`、`class` 或 `style`\
  \ 属性。仅将 `<div>` 元素用于样式——始终寻找要替代的语义元素。那些为了结构目的而非样式目的使用 `<div>` 元素的文档应该修改为使用语义元素——例如，给定下面的文档元素：\n\
  \n```html\n<body>\n  <div class=\"header\">\n    <h1>Web Languages</h1>\n  </div>\n\
  \  <div class=\"nav\">\n    <h2>Menu</h2>\n    <p><a href=\"nav-js.html\">JavaScript</a></p>\n\
  \    <p><a href=\"nav-css.html\">Cascading Style Sheets</a></p>\n  </div>\n  <div\
  \ class=\"main\">\n    <h2><span style=\"font-style:italic\"> HyperText</span> Markup\
  \ Language</h2>\n    <p>关于 HTML 的一切...</p>\n    <h2><span style=\"font-style:italic\"\
  > eXtensible </span> Markup Language</h2>\n    <p>关于 XML 的一切...</p>\n  </div>\n\
  \  <div class=\"footer\">\n    <p><small>Copyright &copy; Example Corporation</small></p>\n\
  \  </div>\n</body>\n```\n\n![image](img/pg46_2.jpg)\n\n将“header”类 `<div>` 替换为 `<header>`\
  \ 元素\n\n![image](img/htmlr.jpg)\n\nrevised.html\n\n![image](img/2r.jpg)将“nav”类 `<div>`\
  \ 替换为 `<nav>` 元素\n\n\n\n\n\n![image](img/3r.jpg)将类名为为“main”的 `<div>` 元素替换为 `<main>`\
  \ 元素。\n\n![image](img/4r.jpg)在标题和段落周围添加 `<article>` 元素，然后将 `<span>` 元素替换为 `<em>`\
  \ 元素——用于自动强调。\n\n```html\n<article>\n  <h2><em>HyperText</em> Markup Language</h2>\n\
  \  <p>All about HTML...</p>\n</article>\n\n<article>\n  <h2><em>eXtensible</em>\
  \ Markup Language</h2>\n  <p>All about XML...</p>\n</article>\n```\n\n![image](img/5r.jpg)将类名为“footer”的\
  \ `<div>` 元素替换为 `<footer>` 元素。\n\n![image](img/6r.jpg)保存编辑后的文档，然后在浏览器中同时打开两个文档，查看它们看起来完全相同——结构是相同的，但修订赋予了语义化含义。\n\
  \n![image](img/pg47_1.jpg)\n![image](img/pg47_2.jpg)\n![image](img/hot.jpg)\n\n\
  你可以在此处发现更多关于 `<em>` 强调元素的知识。\n\n![image](img/forget.jpg)\n\n同时修改任何相关的样式表以选择新元素。\n\
  \n## 摘要\n\n- 标题元素 `<h1>`、`<h2>`、`<h3>`、`<h4>`、`<h5>` 和 `<h6>` 按重要性从 `<h1>` 到 `<h6>`\
  \ 排序。\n- 顺序正确的标题元素隐式地传达了文档结构——即创建文档大纲。\n- `<hgroup>` 元素可以包含标题和子标题——从 `<h1>` 到 `<h6>`。\n\
  - 完整的页眉（包括标志、横幅和 `<h1>` 到 `<h6>` 标题）可以包含在 `<header>` 元素中。\n- 提供页面或网站导航的超链接组应包含在\
  \ `<nav>` 元素中。\n- `<nav>` 元素只是菜单的包装器，通常在页眉中水平显示，或在侧边栏中垂直显示。\n- 网页正文部分的框架可能由 `<header>`、`<main>`\
  \ 和 `<footer>` 元素组成。\n- 通常，`<footer>` 元素可能包含在 `<address>` 元素中的联系详情或 `<small>` 元素中的法律细节。\n\
  - 每个文档 `<section>` 元素通常以一个节标题开头，随后是一个或多个文章（article>）。\n- 每个文档 `<article>` 元素通常以一个文章标题开头，随后是一个或多个段落。\n\
  - 与文章相关的独立信息可以包含嵌套在 `<article>` 元素中的 `<aside>` 元素中。\n- `<div>` 和 `<span>` 元素没有意义，但对于样式设置很有用。\n\
  \n| 3 管理文本内容 | ![image](img/pg11_1.jpg) |\n\n*本章演示了如何在页面内容中包含文本和超链接。*\n\n- 插入段落\n\
  - 包含引用\n- 添加强调\n- 添加修改\n- 添加短语\n- 保留格式\n- 使用上标\n- 显示代码\n- 给出建议\n- 衡量数量\n- 直接性语言\n\
  - 创建超链接\n- 访问键\n- 片段链接\n- 协议链接\n- 摘要\n\n## 插入段落\n\n所有的文本内容在传统上都被分分为句子和段落，以便于阅读和理解。HTML\
  \ 文档中的内容也是如此，它们的段落包含在 `<p> </p>` 标签内。每个段落元素在浏览器中视觉上与下一个段落隔离开——通常在它们之间留出两个空行。\n\n\
  ![image](img/pg50_1.jpg)\n\n段落内的文本在遇到元素边缘时通常会自动换到下一行，但也可以通过插入换行标签 `<br>` 来强制其更早换行。\n\
  \n为了强调，可以在段落之间插入水平规则标签 `<hr>`，以画一条线将它们分隔。然而，`<hr>` 标签不能插入到段落内部来分隔句子。你可能会发现 HTML\
  \ 中有 `<hr>` 标签感到惊讶，因为它似乎只起了纯粹的演示作用。然而，规范中它被描述为表示“段落级的主题分隔”，例如故事中的场景转折。\n\n`<br>`\
  \ 标签和 `<hr>` 标签都是不需要闭合标签的单标签。\n\n![image](img/1g.jpg) 创建一个 HTML 文档\n\n![image](img/2g.jpg)\
  \ `html`\n\n![image](img/3g.jpg) 在节内创建一个大标题\n\n```html\n<h1>The Statue of Liberty</h1>\n\
  ```\n\n![image](img/4g.jpg) 接下来，在节内添加一个段落\n\n```html\nThe Statue of Liberty\n<p>The\
  \ Statue of Liberty was built over nine years</p>\n```\n\n![image](img/5g.jpg) 在段落后添加水平线\n\
  \n```html\n<p>The Statue of Liberty was built over nine years</p>\n<hr>\n<p>The\
  \ Statue of Liberty was built over nine years</p>\n```\n\n![image](img/6g.jpg) 现在，在段落中插入换行\n\
  \n```html\n<p>The Statue of Liberty was built over nine years<br>by French sculptor\
  \ Augusteoldi.<br>Upon its completion in 1884 350 pieces of the statue were packed\
  \ into</p>\n```\n\n![image](img/7g.jpg) 在节内添加第二个段落\n\n```html\n<p>The Statue of\
  \ Liberty was built over nine years<br>by French sculptor Augusteoldi.<br>Upon its\
  \ completion in 1884 350 pieces of the statue were packed into 214 crates for New\
  \ York.</p>\n<p>The Statue of Liberty was built over nine years<br>by French sculptor\
  \ Augusteoldi.<br>Upon its completion in 1884 350 pieces of the statue were packed\
  \ into 214 crates for New York.</p>\n```\n\n保存 HTML 文档并在网页浏览器中打开它，查看标题、段落、强制换行和水平规则线\n\
  \n![image](img/pg51_1.jpg)\n![image](img/pg51_2.jpg)\n![image](img/hot.jpg)\n\n\
  `<hr>` 元素可以被认为是故事和散文中常见的节分隔符的 HTML 等效物。\n\n## 包含引用\n\n重要的是某些 HTML 元素会在页面上产生一个矩形区域来显示内容，而另一些元素仅在外部容器块的行内产生一个小块。这些被称为“流”（flow）元素和“短语”（phasing）元素。在行内产生小块的短语元素必须包含在流元素中，后者产生较大的容器块，例如\
  \ `<p> </p>`。通过对比浏览器显示用于包含引用的两个 HTML 元素的方式，可以看到流元素和短语元素之间的差异。\n\n![image](img/pg52_1.jpg)\n\
  \n`<blockquote>` 标签用于包含来自其他来源长引用，可以通过 `cite` 属性指定。对于该元素，浏览器通常会产生一个矩形区域来包含引用，从新行开始并与周围内容缩进——因此\
  \ `<blockquote>` 是一个流元素。\n\n`<q>` 标签用于包含来自其他来源的短引用，可以通过 `cite` 属性指定。对于该元素，浏览器通常会在当前行内产生一个小块区域来包含引用——因此\
  \ `<q>` 是一个短语元素。\n\n\n\n\n\n# HTML 文本格式化与强调\n\n## 引用元素\n\n### 简介\n\n与 `<blockquote>`\
  \ 流级元素不同，`<q>` 短语元素会让浏览器在页面上显示内容时，自动在元素内容周围添加引号。理想情况下，这些应该是环绕整个元素内容的双引号，而对任何内部嵌套的引用使用单引号，但其实现方式可能有所不同。\n\
  \n### 创建引用文档\n\n1. ![image](img/1g.jpg) 创建一个 HTML 文档\n2. ![image](img/2g.jpg) 在\
  \ body 部分内插入一个段落\n\n   ```html\n   <p>A Paragraph Flow Block!</p>\n   ```\n\n3.\
  \ ![image](img/3g.jpg) 在 body 部分内插入一个包含两个嵌套小引用的块引用\n\n   ```html\n   <blockquote\
  \ cite=\"http://www.example.com/origin.html\">\n   A Blockquote Flow Block!<br>Paul\
  \ said, <q>I saw Emma at lunch, she told me <q>Susan wants you to get some ice cream\
  \ on your way home.</q> I think I will get some at Ben and Jerry’s on Main Street.</q>\
  \ </blockquote>\n   ```\n\n4. ![image](img/4g.jpg) 保存 HTML 文档然后打开它，以比较双引号、单引号和撇号\n\
  5. ![image](img/5g.jpg) 将此样式表插入文档的 head 部分，然后重新加载页面以显示这些块\n\n   ```css\n   p, blockquote\
  \ { border : 2px solid Green ; }\n   q { background : LawnGreen ; }\n   ```\n\n\
  ### 默认段落宽度和颜色名称\n\n默认情况下，段落元素块将填充其容器元素的宽度——例如示例此处 中的 `<h1>` 元素块。\n\nHTML 识别 [`w3.org/TR/css-color-3/#svg-color`](http://www.w3.org/TR/css-color-3/#svg-color)\
  \ 中描述的标准颜色名称和代码。这些名称不区分大小写，但可以使用大写字母——例如，`LawnGreen` 比 `lawngreen` 更具可读性。这里的流级元素显示\
  \ `Green` 实线边框，短语元素显示 `LawnGreen` 背景色。\n\n## 强调元素\n\n### 简介\n\nHTML 提供了四个短语元素，用于强调文档正文中的文本：\n\
  \n- 包在 `<b>` `</b>` 标签之间的文本会被加粗，但不传达额外的重要性，例如段落中的关键词——通常以粗体字体显示。\n- 包在 `<i>` `</i>`\
  \ 标签之间的文本会被增强，但不传达额外的重要性，例如段落中的术语——通常以斜体字体显示。\n- 包在 `<strong>` `</strong>` 标签之间的文本重要性增加，且不改变句子含义——通常以粗体字体显示。\n\
  - 包在 `<em>` `</em>` 标签之间的文本应该被强调，以刻意影响句子含义——通常以斜体字体显示。\n\n`<b>` 和 `<i>` 标签仍留在 HTML\
  \ 中可能会让人感到惊讶，因为它们从外观上暗示内容应该以粗体或斜体字体呈现——这与 HTML 将结构与表现分离的宗旨相悖。然而，根据规范，它们的含义已被重新定义，因此\
  \ `<b>` 元素内的内容应该是“样式偏移的”，而 `<i>` 元素内的内容应被视为“另一种语调”。在实际操作中，它们仍然用粗体和斜体字体表示，但应作为最后的手段，因为它们不传达含义——请改用\
  \ `<strong>` 和 `<em>` 标签。\n\n`<strong>` 和 `<em>` 标签的优势在于它们描述了内容相对于周围文本的重要性，并让浏览器选择呈现方式。此外，这些标签在建议叙述者应如何通过语音传达内容方面更有意义。\n\
  \n与许多 HTML 标签一样，`<strong>` 和 `<em>` 标签可以嵌套，但必须注意正确关闭嵌套元素。例如，`<<strong> <em>...</em>\
  \ </strong>` 是正确的顺序，而 `<<strong> <em>... </strong> </em>` 是错误的且无法通过验证。\n\n规范鼓励网页作者在网页设计的各个方面都考虑可访问性问题。\n\
  \n### 创建强调文档\n\n1. ![image](img/1g.jpg) 创建一个 HTML 文档\n\n   `emphasis.htm`\n\n2.\
  \ ![image](img/2g.jpg) 在 body 部分内添加一个段落，强调某些文本而不影响句子含义\n\n   ```html\n   <p>\n \
  \  <strong>Warning.</strong>\n   This dungeon is dangerous.\n   <strong>Avoid the\
  \ ducks.</strong>\n   Take any gold you find.\n   <strong>Do not take any of the\
  \ diamonds, they are explosive.</strong> You have been warned.\n   </p>\n   ```\n\
  \n3. ![image](img/3g.jpg) 接下来，在 body 部分内添加强调某些文本以影响句子含义的段落\n\n   ```html\n   <p><em>Puppy\
  \ dogs</em> are cute.</p>\n   ```\n\n   ```html\n   <p>Puppy dogs <em>are</em> cute.</p>\n\
  \   ```\n\n   ```html\n   <p>Puppy dogs are <em>cute.</em></p>\n   ```\n\n4. ![image](img/4g.jpg)\
  \ 将此样式表插入文档的 head 部分，以高亮显示被强调的文本\n\n   ```css\n   strong, em { background : LawnGreen\
  \ ; }\n   ```\n\n5. ![image](img/5g.jpg) 保存 HTML 文档然后打开它，以显示被强调的文本\n\n### 使用 `<b>`\
  \ 标签\n\n应避免使用 `<b>` 标签，但一种合法的用法是标记文章的引导句。\n\n## 修改元素\n\n### 简介\n\nHTML 提供了三个可以格式化文档主体内容的元素：\n\
  \n- 包在 `<small>` `</small>` 标签之间的文本被视为周围内容的旁注，例如法律信息——通常以较小字体显示。\n- 包在 `<del>` `</del>`\
  \ 标签之间的文本被视为从文档中删除，例如列表中的项目——通常以删除线显示。\n- 包在 `<ins>` `</ins>` 标签之间的文本被视为添加到文档中，例如列表中的新项目——通常以下划线显示。\n\
  \n`<small>` 标签仅用于包含补充内容的短注释。它不是用于大量文本（如多个段落），那样会过度。\n\n在显示 `<small>` 元素的内容时，网络浏览器会考虑显示周围内容的字体大小，然后应用相应的缩小。因此，当周围内容以\
  \ 12 点字体显示时，`<small>` 元素内的内容可能以 10 点字体显示——具体大小由浏览器决定。\n\n`<del>` 和 `<ins>` 元素可以用于内容区域，标记更改的片段，并封装整个更改的内容，如替换的段落。\n\
  \n`<del>` 和 `<ins>` 标签可以可选地包含 `cite` 属性，以指定说明更改的 URL。\n\n### 创建修改文档\n\n1. ![image](img/1g.jpg)\
  \ 创建一个 HTML 文档\n\n   `format.html`\n\n2. ![image](img/2g.jpg) 在 body 部分内插入一个包含法律目的旁注的段落\n\
  \n   ```html\n   <p>Example Corp 今日宣布了第二季度的利润<small>(披露：EG News 是 Example Corp 的子公司)</small>引发了与\
  \ Demo Group 合并的推测。</p>\n   ```\n\n3. ![image](img/3g.jpg) 接下来，插入一个大标题和一个段落\n\n\
  \   ```html\n   <h1>To Do List</h1>\n   ```\n\n   ```html\n   <p>Empty the dishwasher</p>\n\
  \   ```\n\n4. ![image](img/4g.jpg) 现在，插入一个被删除的段落\n\n   ```html\n   <del><p>Take\
  \ out the trash</p></del>\n   ```\n\n5. ![image](img/5g.jpg) 然后，插入一个新添加的段落\n\n \
  \  ```html\n   <ins><p>Sweep the yard</p></ins>\n   ```\n\n6. ![image](img/6g.jpg)\
  \ 最后，插入一个新添加的段落，其中包含一个已更改的文本片段\n\n   ```html\n   <ins>\n   <p>Feed the <del>dog</del><ins>\
  \ cat</ins></p>\n   </ins>\n   ```\n\n\n\n\n![image](img/7g.jpg)保存 HTML 文档，然后在网络浏览器中打开它，查看文本的格式化情况\n\
  \n![image](img/pg57_1.jpg)\n\n![image](img/forget.jpg)\n\n`<small>` 标签并不表示内容不重要，仅表示它是周围文本的侧边注释。\n\
  \n## 添加短语\n\n![image](img/pg58_1.jpg)\n\nHTML 提供了四种短语元素，可用于标记文档主体内需要特殊处理的文本：\n\n\
  • 包裹在 `<s>` 和 `</s>` 标签之间的文本被标记为被更准确或相关的更新内容所取代——通常显示为删除线效果。\n\n• 包裹在 `<u>` 和 `</u>`\
  \ 标签之间的文本被标记为与普通文本内容有某种不同之处——通常显示为带有下划线的文本。\n\n• 包裹在 `<mark>` 和 `</mark>` 之间的文本被标记为具有特殊参考意义的内容——通常以有色背景块的形式显示以突出文本。\n\
  \n• 被 `<wbr>` 标签断开的文本被隐式标记为适合换行的位置——代表单词换行的机会。\n\n需要注意的是，规范规定 `<s>` 标签不应用于指示文档内的编辑内容。而应该使用\
  \ `<del>` 标签来指示文档编辑。\n\n同样，`<mark>` 标签不应用于强调文本内容的重要性，而应仅用于突出文档内文本的相关性。而应使用 `<strong>`\
  \ 和 `<em>` 标签来表示强调。\n\n`<u>` 标签在 HTML 5.0 规范中已被废弃，因为文档中的下划线文本通常表示超链接。然而，`<u>` 标签已被恢复，用于标记中文中的拼写错误词汇或专有名词。尽管如此，强烈不建议作者使用\
  \ `<u>` 标签进行强调，以避免与链接混淆。再次，应使用 `<strong>` 和 `<em>` 标签来表示强调。\n\n当文档包含可能超过浏览器宽度的长内容时，你可能希望使用\
  \ `<wbr>` 标签指示可以插入换行的合适位置。\n\n![image](img/snake.jpg)\n\n使用样式表规则用于演示，而不是使用 `<u>`\
  \ 标签来实现下划线。\n\n![image](img/1g.jpg)创建一个 HTML 文档\n\n![image](img/htmlg.jpg)\n\nmark.html\n\
  \n![image](img/2g.jpg)在 body 部分，添加一个标记单词换行机会的段落\n\n`<p>Microsoft Surface Pro 7</p>`\n\
  \n`<p><wbr>- 256GB / Intel Core i7</p>`\n\n![image](img/3g.jpg)接下来，在 body 部分，添加一个标记了被取代的价格并提供当前价格的段落\n\
  \n`<p><s>$1,499</</s>> $1,299</p>`\n\n![image](img/4g.jpg)现在，在 body 部分，添加标记用于参考的文本以及标记拼写错误词汇的段落\n\
  \n`<p>Memory: <mark>16GB</mark><br>Screen: <mark>12.3-inch</mark></p>`\n\n`<p>Surface\
  \ <u>Penn</u> Included</p>`\n\n![image](img/5g.jpg)保存 HTML 文档，然后在网络浏览器中打开它，查看文本的格式化情况\n\
  \n![image](img/pg57_1.jpg)\n\n![image](img/forget.jpg)\n\n`<wbr>` 是适合断行的文本合适位置——代表单词换行的机会。\n\
  \n使用样式表规则用于演示，而不是使用 `<u>` 标签来实现下划线。\n\n\n\n\n![图片](img/2g.jpg) 在 body 部分中，插入一个包含由字符实体生成的上标的段落\n\
  \n```html\n<p>\nSquare of four: 4&sup2; = 16 <br>\nCube of four: 4&sup3; = 64\n\
  </p>\n```\n\n![图片](img/3g.jpg) 现在，在 body 部分中，插入一个类似的包含由 HTML 元素生成的上标的段落\n\n```html\n\
  <p>\nSquare of four: 4<sup>2</sup> = 16 <br>\nCube of four: 4<sup>3</sup> = 64\n\
  </p>\n```\n\n![图片](img/4g.jpg) 最后，在 body 部分中，插入一个包含由 HTML 元素生成的下标的段落\n\n```html\n\
  <p>\nWater: H<sub>2</sub>O <br>\nOil of Vitriol: H<sub>2</sub>SO<sub>4</sub>\n</p>\n\
  ```\n\n![图片](img/5g.jpg) 保存文档，然后在浏览器中打开它，以比较上标并查看下标文本\n\n![图片](img/pg63_1.jpg)\n\
  ![图片](img/hot.jpg)\n\n在段落中使用上标 `²` 来表示面积，例如 10 feet²，你可能更倾向于使用实体 `&sup2;` 而不是 `<sup>2</sup>`\
  \ 以保持行间距相等。\n\n## 显示代码\n\n![图片](img/pg64_1.jpg)\n\nHTML 提供了五种短语元素，专门用于在文档主体中包含计算机程序代码：\n\
  \n- 完整的程序代码或代码片段可以包装在 `<code>` 标签中以合适字体显示。\n- 程序变量实例可以包装在 `<var>` 标签中以区别于常规文本。\n\
  - 示例程序输入和输出可以包装在 `<samp>` 标签中以区别于常规文本。\n- 同时具有机器可读代码的内容可以包装在 `<data>` 标签中，并将代码指定给其\
  \ `value` 属性。\n- 日期和时间可以包装在 `<time>` 标签中，并将其机器可读版本指定给 `datetime` 属性。\n\n例如，`<data>`\
  \ 元素可以描述一本书的标题及其机器可读的 ISBN，然后 `<time>` 元素可以描述该书的出版日期：\n\n![图片](img/1g.jpg) 创建一个\
  \ HTML 文档\n![图片](img/htmlg.jpg)\n`code.html`\n\n![图片](img/2g.jpg) 在 body 部分中，插入一个包含变量、示例输入和示例输出的程序描述\n\
  \n```html\n<p>\nThis program assigns an input value to\n<var>degF</var>\nthen performs\
  \ a conversion on that value, assigning the result to\n<var>degC</var>\nfor output.\
  \ For example, input of\n<samp>98.6</samp>\nwill output\n<samp>37C</samp>.\n</p>\n\
  ```\n\n![图片](img/3g.jpg) 现在，在 body 部分中，说明程序代码来源\n\n```html\n<data value=”978-1-84078-719-1”>\n\
  C++ Programming in easy steps, 5th Edition</data>\n<time datetime=”2023-12-15”>\n\
  (December 25th, 2023)</time>\n```\n\n![图片](img/hot.jpg)\n\n`datetime` 的 `<time>`\
  \ 元素的值必须采用有效格式——例如，完整日期时间 `2023-12-25 14:30` 或月份 `2023-12` 或日期 `2023-12-25` 或天数\
  \ `12-25` 或仅时间 `14:30.`\n\n![图片](img/4g.jpg) 接下来，在 body 部分中，插入预格式化的程序代码\n\n```html\n\
  <pre>\n<code>\n#include &lt;iostream&gt;\nusing namespace std;\nint main()\n{\n\
  float degF, degC;\ncout &lt;&lt; “Enter Fahrenheit Temperature: “;\ncin &gt;&gt;\
  \ degF;\ndegC = ((degF - 32.0 ) * (5.0 / 9.0));\ncout &lt;&lt; degF &lt;&lt; “F\
  \ is “ &lt;&lt; degC &lt;&lt; “C”;\ncout &lt;&lt; endl;\nreturn 0;\n}\n</code>\n\
  </pre>\n```\n\n![图片](img/5g.jpg) 保存 HTML 文档，然后在 Web 浏览器中打开它，以查看程序描述、来源详情和程序代码的显示方式\n\
  \n![图片](img/pg65_1.jpg)\n![图片](img/snake.jpg)\n\n请注意，程序代码中的所有尖括号字符都已替换为字符实体，以避免与\
  \ HTML 标签冲突。\n\n![图片](img/forget.jpg)\n\n请记住，在 `<pre>` 流元素中插入短语 `<code>` 元素，以在 HTML\
  \ 文档中保留程序代码的布局。\n\n## 提供建议\n\n![图片](img/pg66_1.jpg)\n\nHTML 提供了四种可用于在文档主体中指定建议性短语的短语元素：\n\
  \n- 文本可以包装在 `<abbr>` 标签中以表示它是缩写。\n- 文本可以包装在 `<cite>` 标签中以表示它是来自其他来源的引用或参考。\n- 文本可以包装在\
  \ `<dfn>` 标签中以表示它是该术语的定义性实例。\n- 文本可以包装在 `<kbd>` 标签中以表示需要用户从键盘输入的内容。\n\n每个可以合法出现在文档主体中的\
  \ HTML 元素都可以选择包含 `title` 属性。指定给 `title` 属性的值通常显示为工具提示，当用户将光标放在元素上时会弹出。这意味着上面列出的每个短语元素都可以包含\
  \ `title` 属性以扩展其内容的含义。\n\n![图片](img/1g.jpg) 创建一个 HTML 文档\n![图片](img/htmlg.jpg)\n\
  `advice.html`\n\n![图片](img/2g.jpg) 在 body 部分中，插入一个包含带工具提示建议的缩写的段落\n\n```html\n<p>\n\
  <abbr title=”HyperText Markup Language”>\nHTML\n</abbr> in easy steps</p>\n```\n\
  \n![图片](img/3g.jpg) 接下来，插入一个带工具提示建议的引用参考\n\n```html\n<p>\n<cite title=”Inventor\
  \ of the HyperText Markup Language”>Sir Tim Berners-Lee</cite></p>\n```\n\n![图片](img/4g.jpg)\
  \ 现在，插入一个带工具提示建议的定义性术语\n\n```html\n<p>\n<dfn title=”The popular language of the\
  \ World Wide Web. Commonly abbreviated to ‘HTML’ ”>\nHyperText Markup Language</dfn></p>\n\
  ```\n\n![图片](img/forget.jpg)\n\n请记住使用单引号表示嵌套引号——如第 4 步中的 `‘HTML’`。\n\n![图片](img/5g.jpg)\
  \ 然后，插入一个带工具提示建议的键盘指令\n\n```html\n<p>\n<kbd title=”Press the Y key on your keyboard\
  \ to execute a script. This requires JavaScript to be enabled in your browser”>Hit\
  \ Y to Continue.</kbd></p>\n```\n\n![图片](img/6g.jpg) 最后，添加一个响应键盘指令的脚本\n\n```html\n\
  <script>\nfunction showkey( e ) {\nif( e.keyCode === 89 || e.keyCode === 121 )\n\
  {\nalert( ‘Y pressed. Thank You.’ )\n}\n}\ndocument.onkeydown = showkey\n</script>\n\
  ```\n\n![图片](img/7g.jpg) 保存 HTML 文档，然后在浏览器中打开它，并将光标放在元素上以查看工具提示\n\n![图片](img/pg67_1.jpg)\n\
  ![图片](img/8g.jpg)\n\n在浏览器中启用 JavaScript 后，按 `Y` 键查看脚本响应。\n\n![图片](img/pg67_2.jpg)\n\
  ![图片](img/hot.jpg)\n\n脚本在按键被按下时检查 `keycode`，并会响应小写 `“y”` 和大写 `“Y”`。\n\n## 量规\n\n\
  ![图片](img/pg68_1.jpg)\n\n范围内的值可以使用 HTML `<meter>` 元素在网页上以可视化方式显示为量规。\n\n`<meter>`\
  \ 元素必须包含一个定义分数测量的 `value` 属性。可选地，`<meter>` 标签也可以包含 `min` 和 `max` 属性以指定最小和最大范围边界。如果省略这些属性，则默认范围为\
  \ 0-1。\n\n`<meter>` 标签还可以包含 `low` 和 `high` 属性以指定范围内的低和高位置，而 `optimum` 属性可以指定范围内的理想首选位置。\n\
  \n`low` 和 `high` 属性可以指定由 `min` 和 `max` 属性指定的整个范围内的次优范围。实际上，这可以将量规分为三个部分——低、中和高。尽管不在\
  \ HTML 标准规范中，但这三个部分可以用不同的颜色由 Web 浏览器表示。例如，Google Chrome 浏览器合理地使用红色表示低部分，黄色表示中间部分，绿色表示高部分。\n\
  \n建议 `<meter>` 元素应包含描述量规状态的文本，该文本仅在不会可视化显示此元素的浏览器中显示。\n\n\n\n\n# HTML 交互元素与注释\n\n\
  交互式的 `<details>` 和 `<summary>` 元素可以在无需脚本的情况下响应用户操作，以显示额外信息。通常，`<details>` 元素在网页上提供一个由三角形箭头表示的“披露小部件”。嵌套的\
  \ `<summary>` 元素显示描述小部件内隐藏信息的标题。额外信息包含在嵌套于 `<details>` 元素内部元素中，位于 `<summary>` 元素之后。\n\
  \n当用户点击 `<summary>` 元素时，小部件的状态会从“关闭”变为“打开”，并显示隐藏的信息。再次点击 `<summary>` 元素将关闭小部件并再次隐藏信息。\n\
  \n![image](img/hot.jpg)\n\n三角形箭头会旋转以表示小部件的打开和关闭状态——因此，这些部件有时被称为“折叠控件”（twisties）。\n\
  \n![image](img/1g.jpg)\n\n### 创建 HTML 文档\n\n![image](img/htmlg.jpg)\n\n`meter.html`\n\
  \n![image](img/2g.jpg) 在 body 部分，插入一个包含测量量的 `<article>`，其测量范围为 0-100，次优范围为 15-50，最优值为\
  \ 100，当前值为 80%\n\n```html\n<article>\n  <h2>Gauge</h2>\n  Fuel Level:\n  <meter\
  \ min=\"0\" low=\"15\" high=\"50\" max=\"100\" optimum=\"100\" value=\"80\">80%</meter>\n\
  \  <!-- 在此处插入细节。 -->\n</article>\n```\n\n![image](img/3g.jpg) 插入描述仪表当前状态的细节\n\n\
  ```html\n<details>\n  <summary>Status</summary>\n  OK to Continue...（可以继续...）\n\
  </details>\n```\n\n![image](img/4g.jpg) 重复步骤 2 和 3 两次，创建另外两个仪表，然后将它们的当前值编辑为 40 和\
  \ 10，并提供适当的描述\n\n![image](img/5g.jpg) 保存 HTML 文档，然后在浏览器中打开它并点击每个 `<summary>` 元素查看其描述\n\
  \n![image](img/pg69_1.jpg)\n![image](img/pg69_2.jpg)\n![image](img/snake.jpg)\n\n\
  `<meter>` 元素应仅用于指定范围内的分数测量，而不是指示进度——请使用 `<progress>` 元素表示进度（参见此处）。\n\n## 直接语言\n\n\
  ![image](img/pg70_1.jpg)\n\n推荐的 UTF-8 文档编码格式支持双向文本，使得从右向左语言（如希伯来语）的字符会自动按方向写入，并可能与英语等从左到右的文本一起出现。从右到左阅读的内容应在\
  \ `<bdi></bdi>` 双向隔离标签内，以免混淆浏览器，因为它期望是从左到右读取。此外，HTML 还提供了 `<bdo>` 双向覆盖元素，可以通过其 `dir`\
  \ 属性显式指定文本方向为 `ltr` 或 `rtl`。\n\n双向覆盖允许从右到左语言的字符以“逻辑”上的左到右顺序作为字符实体写入 HTML 文档中，但以“视觉”上的从右到左顺序显示。例如，下面的\
  \ `<bdo>` 元素从左到右包含了按输入顺序排列的五个字符实体，但从右到左显示它们：\n\n```html\n<bdo dir=\"rtl\">&#1497;&#1513;&#1512;&#1488;&#1500;</bdo>\n\
  ```\n\n.... 显示为 ![image](img/pg70_2.jpg) (拉丁字母中的 Yiśrā’ēl)。\n\n![image](img/forget.jpg)\n\
  \n如果没有双向覆盖，这些字符实体将按其逻辑顺序显示为 ![image](img/pg70_3.jpg)——对于从右向左的希伯来语来说，这是反向的。\n\n##\
  \ Ruby 注释（注音符号）\n\n对于东方语言，HTML 支持“Ruby 注释”，可以很有用地在文本旁提供发音。例如，日语中有多种字母表。用语义“汉字”（Kanji）字母（有数千个字符）编写的文本通常带有对应的语音“假名”（Hiragana）注释（约\
  \ 50 个字符），以辅助发音。这在日语中被称为“Furigana”，在英语中被称为“Ruby”——以指示发音的小字体命名。为了方便西方人阅读，日文汉字文本可以使用“罗马字”（Romaji）进行注释——其拉丁字母等价形式。同样在中文中，用“汉语”字母编写的文本可以使用拼音（Pinyin）进行注释——其拉丁字母等价形式。\n\
  \nHTML Ruby 注释完全包含在根 `<ruby></ruby>` 标签之间。该元素可以用`<rb></rb>` 标签（Ruby base）包含东方文本，用`<rt></rt>`\
  \ 标签（Ruby text）包含注释。可选在 `<rtc></rtc>` 标签内提供英语等价内容。\n\n![image](img/1g.jpg) 创建 HTML\
  \ 文档类型\n\n![image](img/htmlg.jpg)\n\n`ruby.html`\n\n![image](img/2g.jpg) 在 body\
  \ 部分，插入一个带有适当发音注释的日语文本元素\n\n```html\n<ruby>\n  <!-- 日语汉字文本。 -->\n  <rb>東 京</rb>\n\
  \  <!-- 罗马字注释。 -->\n  <rt>tō kyō</rt>\n  <!-- 英语等价文本。 -->\n  <rtc>Tokyo</rtc>\n\
  </ruby>\n```\n\n![image](img/3g.jpg) 接下来，插入带有适当发音注释的中文元素\n\n```html\n<ruby>\n  <!--\
  \ 中文文本。 -->\n  <rb>北京</rb>\n  <!-- 拼音注释。 -->\n  <rt>běi jīng</rt>\n  <!-- 英语等价文本。\
  \ -->\n  <rtc>Beijing</rtc>\n</ruby>\n```\n\n![image](img/4g.jpg) 保存 HTML 文档，然后在浏览器中打开它查看文本和\
  \ Ruby 注释\n\n![image](img/pg71_1.jpg)\n![image](img/snake.jpg)\n\n## 创建链接\n\n当互联网带有文本内容时，“超文本”（hypertext）提供了访问相关文档的能力，网页页面现在被称为“链接”（hyperlink）。\n\
  \n链接被包含在 `<a>` 锚标签之间，通过 `href` 属性指定目标 URL。可选 `<a>` 标签还可以包含 `title` 属性以指定在用户鼠标悬停在链接上时显示的文本。\n\
  \n网页浏览器将以某种方式与普通文本区分链接——通常链接带有下划线，基于图像的链接带有边框。\n\n每个网页链接对三种交互状态敏感：\n- **悬停（Hover）**——获得焦点，鼠标悬放在链接上。\n\
  - **激活（Active）**——检索资源，用户点击链接。\n- **已访问（Visited）**——链接之前已被检索过。\n\n可以使用样式规则来强调每个链接状态：\n\
  \n![image](img/1g.jpg) 创建 HTML 文档\n\n![image](img/htmlg.jpg)\n\n`link.html`\n\n\
  ![image](img/2g.jpg) 接下来，在 head 部分添加样式表的链接\n\n```html\n<link rel=\"stylesheet\"\
  \ href=\"link.css\">\n```\n\n![image](img/3g.jpg) 现在，在 body 部分，插入一个指向目标页面的链接——包含提示\n\
  \n```html\n<a href=\"link-target.html\" title=\"指向目标页面的链接\">访问目标</a>\n```\n\n![image](img/htmlg.jpg)\n\
  \n`link-target.html`\n\n![image](img/4g.jpg) 保存 HTML 文档，然后创建一个类似的第二个文档，链接相同的样式表并包含一个指向第一个文档的链接\n\
  \n```html\n<a href=\"link.html\" title=\"返回的链接\">返回</a>\n```\n\n![image](img/5g.jpg)\
  \ 将第二个 HTML 文档与第一个一起保存，然后创建一个样式表来强调每个链接状态\n\n```css\na:hover { background : Yellow\
  \ ; }\na:active { background : Red ; color : White ; }\na:visited { background :\
  \ Aqua ; }\n```\n\n![image](img/cssg.jpg)\n\n`link.css`\n\n![image](img/6g.jpg)\
  \ 将样式表与两个 HTML 文档一起保存，然后在浏览器中打开第一个页面查看链接的默认状态\n\n![image](img/pg73_1.jpg)\n\n\n\n\
  \n\n![image](img/7g.jpg)将光标悬停在超链接上，查看其悬停状态\n\n![image](img/pg73_2.jpg)\n\n![image](img/8g.jpg)在超链接上按住鼠标左键，查看其激活状态\n\
  \n![image](img/pg73_3.jpg)\n\n![image](img/9g.jpg)释放鼠标按钮以加载目标页面\n\n![image](img/10g.jpg)点击目标页面中的超链接，重新加载第一个页面\n\
  \n![image](img/pg73_4.jpg)\n\n![image](img/11g.jpg)可以看到第一个页面上的超链接现在处于已访问状态\n\n![image](img/pg73_5.jpg)\n\
  \n![image](img/forget.jpg)\n\n如果再次点击链接加载目标页面，浏览器会识别出该页面之前已从第一个页面访问过。\n\n## 访问键\n\
  \n![image](img/pg74_1.jpg)\n\n有三种方式可以访问超链接的目标：\n\n- **指针** – 使用鼠标或类似设备将屏幕指针置于超链接上，然后用户点击以访问其目标。\n\
  - **Tab 键** – 反复按 `Tab` 键，依次聚焦每个超链接，然后按 `Return` 键访问当前选中超链接的目标。\n- **访问键** – 按下指定的字符键以聚焦特定超链接，然后按\
  \ `Return` 键访问其目标。\n\n超链接的指定字符键由 `<a>` 锚标签的 `accesskey` 属性指定。使用指定键的方法通常要求用户在大多数浏览器（如\
  \ Google Chrome）中按下 `Alt` + `accesskey`，但在 Firefox 中则是 `Alt` + `Shift` + `accesskey`。\n\
  \n![image](img/1g.jpg)创建一个 HTML 文档\n\n![image](img/htmlg.jpg)\n\n`keys-home.html`\n\
  \n![image](img/2g.jpg)接下来，在 head 部分添加一个样式表，移除默认的超链接样式\n\n```html\n<style>\na { text-decoration\
  \ : none ; color : Black ; }\na:focus { background : Red ; color : White ; }\n</style>\n\
  ```\n\n![image](img/3g.jpg)现在，在 body 部分插入两个超链接，分别指定不同的数字访问键字符\n\n```html\n<a href=”keys-home.html”\
  \ accesskey=”1”>Home Page</a> |\n<a href=”keys-catalog.html” accesskey=”2”>Catalog\
  \ Page</a>\n```\n\n![image](img/htmlg.jpg)\n\n`keys-catalog.html`\n\n![image](img/4g.jpg)保存该\
  \ HTML 文档，然后创建一个类似的第二个文档，包含相同的两个超链接——但移除默认样式的样式表除外\n\n```html\n<a href=”keys-home.html”\
  \ accesskey=”1”>Home Page</a> |\n<a href=”keys-catalog.html” accesskey=”2”>Catalog\
  \ Page</a>\n```\n\n![image](img/5g.jpg)将第二个 HTML 文档与第一个文档保存在一起，然后在浏览器中打开第一个网页，查看没有默认样式的超链接\n\
  \n![image](img/pg75_1.jpg)\n\n![image](img/6g.jpg)反复按 `Tab` 键，直到第二个超链接获得焦点，然后按 `Return`\
  \ 键跟随该链接\n\n![image](img/pg75_2.jpg)\n\n![image](img/7g.jpg)按下访问键组合和数字 1 键（例如 `Alt`\
  \ + `1`），然后按 `Return` 键跟随第一个超链接\n\n![image](img/pg75_3.jpg)\n\n![image](img/snake.jpg)\n\
  \n移除默认的超链接样式意味着它们不再容易被识别为链接——因此最好避免这样做，除非有其他提示让用户知道它们可用于导航。\n\n![image](img/hot.jpg)\n\
  \nMac 用户在使用 Safari 浏览器时应按下 `CMD` + `accesskey`。\n\n## 片段链接\n\n超链接可以定位到文档中通过“片段”标识符创建的特定位置——即在其开始标签中为\
  \ `id` 属性分配了唯一标识名称的元素。在超链接中，片段标识符通过 `<a>` 标签的 `href` 属性指定，并以 `#` 哈希字符作为前缀。例如，标签\
  \ `<a href=”#top”>` 定位到同一文档中包含唯一片段标识符名称 `top` 的元素。\n\n![image](img/pg76_1.jpg)\n\
  \n超链接也可以使用文档的 URL 定位到不同文档中的特定位置，URL 后跟 `#` 哈希字符，然后是片段标识符。例如，标签 `<a href=”index.html#top”>`\
  \ 定位到名为 `index.html` 的文档中包含唯一片段标识符名称 `top` 的元素。\n\n跟随指向片段标识符的超链接时，文档将从片段标识符出现的位置开始显示：\n\
  \n![image](img/1g.jpg)创建一个 HTML 文档\n\n![image](img/htmlg.jpg)\n\n`frag.html`\n\n\
  ![image](img/2g.jpg)在 body 部分中，插入两个包含片段标识符的超链接，并分别指向不同的片段\n\n```html\n<a id=”top”\
  \ href=”#btm”>Skip to Page Foot</a> |\n<a id=”next-btm” href=”frag-next.html#btm”>Skip\
  \ to Next Page Foot</a>\n```\n\n![image](img/3g.jpg)接下来，在 body 中插入一个表示内容的段落，后跟一个包含片段标识符的超链接，该超链接指向文档中的第一个超链接\n\
  \n```html\n<p style=”height:700px;background:Yellow”></p>\n<a id=”btm” href=”#top”>Skip\
  \ to Page Head</a>\n```\n\n![image](img/htmlg.jpg)\n\n`frag-next.html`\n\n![image](img/4g.jpg)保存该\
  \ HTML 文档，然后创建一个类似的第二个文档，在内容上下方都包含超链接\n\n```html\n<a id=”top” href=”#btm”>Skip to\
  \ Page Foot</a>\n<p style=”height:700px;background:Red”>Content...</p>\n<a id=”btm”\
  \ href=”#top”>Skip to Page Head</a> |\n<a id=”prev-top” href=”frag.html#top”>Skip\
  \ to Previous Page Head</a>\n```\n\n![image](img/5g.jpg)将第二个 HTML 文档与第一个文档保存在一起，然后在浏览器中打开第一个页面，点击第一个超链接跳转到该页面底部\n\
  \n![image](img/pg77_1.jpg)\n\n![image](img/6g.jpg)接下来，点击超链接返回该页面顶部\n\n![image](img/7g.jpg)现在，点击第二个超链接跳转到下一页的底部\n\
  \n![image](img/pg77_2.jpg)\n\n![image](img/forget.jpg)\n\n`#` 哈希字符在 HTML 中用于定位片段和指定十六进制颜色值，在\
  \ CSS 中用于通过元素的 `id` 属性选择元素进行样式设置。十六进制颜色值指定构成颜色的红、绿、蓝分量——例如，红色是十六进制 `#FF0000`。\n\n\
  ![image](img/hot.jpg)\n\n在长页面的末尾，包含一个指向页面顶部片段的超链接，这样用户就不需要向上滚动。\n\n## 协议链接\n\n超链接的\
  \ `href` 属性通常使用超文本传输协议（`http:` 或安全的 `https:`）定位资源，但也可以使用其他协议定位资源。\n\n![image](img/pg78_1.jpg)\n\
  \n可以使用 `javascript:` 协议调用脚本函数，也可以通过 `mailto:` 协议调用电子邮件客户端：\n\n![image](img/1g.jpg)创建一个\
  \ HTML 文档\n\n![image](img/htmlg.jpg)\n\n`protocol.html`\n\n![image](img/2g.jpg)在\
  \ body 部分中，插入一张图表图片\n\n```html\n<img id=”chart” src=”protocol-chart.png” alt=”Chart”>\n\
  ```\n\n![image](img/3g.jpg)接下来，插入一个包含两个超链接的段落，这两个超链接分别指向不同的协议\n\n```html\n<p id=”links”>\n\
  <a href=”javascript:toggle( )”>Show/Hide Chart</a>\n<br>\n<a href=”mailto:wendy@example.com”>Email\
  \ Wendy</a>\n</p>\n```\n\n![image](img/4g.jpg)现在，添加一个样式表，其中包含一条隐藏图片的规则和一条设置段落样式的规则\n\
  \n```css\n<style>\nimg#chart { visibility : hidden ; height : 0px ; }\np#links {\
  \ padding : 5px ; border : 1px solid ; float : left ; width : 200px ; }\n</style>\n\
  ```\n\n![image](img/5g.jpg)最后，添加一个脚本，当第一个超链接被点击时，交替显示和隐藏图片\n\n```javascript\n<script>\n\
  function toggle( ) {\n    const chart = document.getElementById( 'chart' )\n   \
  \ let hid = ( chart.style.visibility !== 'visible' )\n    chart.style.visibility\
  \ = ( hid ) ? 'visible' : 'hidden'\n    chart.style.height = ( hid ) ? 'auto' :\
  \ '0px'\n}\n</script>\n```\n\n![image](img/hot.jpg)\n\n该脚本首先检查图片元素的当前可见性状态，然后将其反转。\n\
  \n\n\n\n\n![图片](img/6g.jpg) 保存 HTML 文档，然后在浏览器中打开，点击第一个链接即可显示图表图片。\n\n![图片](img/pg79_1.jpg)\n\
  \n![图片](img/7g.jpg) 点击第一个超链接可再次隐藏图表图片。\n\n![图片](img/8g.jpg) 点击第二个超链接可启动默认的电子邮件客户端应用程序——准备发送邮件。\n\
  \n![图片](img/pg79_2.jpg)\n\n![图片](img/forget.jpg)\n\n`mailto:` 协议会自动将收件人的电子邮件地址添加到电子邮件客户端的“收件人”字段中。\n\
  \n## 总结\n\n- 段落 `<p>` 元素可以包含 `<br>` 换行标签，段落之间可以用 `<hr>` 水平分隔线分隔。\n- 长引用可以放在 `<blockquote>`\
  \ 流元素中，短引用可以放在 `<q>` 短语元素中。\n- 推荐使用 `<em>` 和 `<strong>` 短语元素来强调文本，而不是 `<b>` 和 `<i>`\
  \ 短语元素。\n- 旁注可以放在 `<small>` 元素中，`<ins>` 和 `<del>` 元素用于表示替换的文本。\n- `<s>` 元素表示已废弃的内容，`<mark>`\
  \ 元素用于高亮显示以供参考的内容。\n- `<u>` 元素表示不同的文本，`<wbr>` 元素可用于建议合适的换行点。\n- 为避免对齐问题，在创建预格式化文本以放入\
  \ `<pre>` 元素时，应避免使用制表符间距。\n- 上标和下标可以使用字符实体或 `<sup>` 和 `<sub>` 元素来包含。\n- 程序代码可以使用\
  \ `<code>`、`<var>` 和 `<samp>` 元素包含在 HTML 文档中。\n- 机器可读代码可以指定给 `<data>` 标签的 `value`\
  \ 属性和 `<time>` 标签的 `datetime` 属性。\n- `<abbr>`、`<cite>`、`<dfn>` 和 `<kbd>` 元素提供建议。\n\
  - 许多元素可以包含 `title` 属性以提供工具提示。\n- `<bdi>` 和 `<bdo>` 双向元素可用于包围从右向左阅读的语言文本。\n- Ruby\
  \ 注释使用 `<ruby>`、`<rb>`、`<rt>`、`<rp>` 和 `<rtc>` 元素为东方语言提供发音辅助。\n- `<a>` 标签可以创建指向其他网页、页面片段或协议（如\
  \ `javascript:` 和 `mailto:`）的超链接。\n\n# 4 编写列表和表格\n\n![图片](img/pg11_1.jpg)\n\n本章演示如何在列表和表格单元格中显示项目。\n\
  \n- `无序列表`\n- `有序列表`\n- `描述列表`\n- `基本表格`\n- `跨行跨列单元格`\n- `增强表格`\n- `控制列`\n- `总结`\n\
  \n## 无序列表\n\n无序列表中列表项的顺序不重要，通常在每个项目前放置一个项目符号，以将列表项与普通文本区分开。\n\n![图片](img/pg82_1.jpg)\n\
  \n在 HTML 中，无序列表使用 `<ul></ul>` 标签创建，它为列表项提供了一个容器。每个列表项可以使用 `<li></li>` 标签包围项目来创建，或者可选地仅使用\
  \ `<li>` 放在项目前面——这两种 `<li>` 元素形式都是有效的 HTML。一个无序列表 `<ul>` 元素可以包含多个列表项 `<li>` 元素。\n\
  \n用于区分无序列表项与普通文本的项目符号可以是以下三种标记类型之一：\n\n- `实心圆` – 填充的圆形项目符号（默认样式）。\n- `空心圆` – 未填充的圆形项目符号。\n\
  - `实心方块` – 填充的方形项目符号。\n\n样式规则可以为无序列表的 `list-style-type` 属性指定上述任一值，或者可以为该属性指定 `none`\
  \ 值以隐藏项目符号。\n\n每个 HTML 列表还有一个 `list-style-image` 属性，可以指定用作列表项目符号的图片的 URL。该图片将替代任何标记类型的项目符号。如果浏览器无法使用指定的图片，则将使用其\
  \ `list-style-type` 属性指定的标记，如果未指定标记，则使用默认标记。\n\n![图片](img/1p.jpg) 创建一个 HTML 文档\n\
  ![图片](img/htmlp.jpg) `ulist.html`\n\n![图片](img/2p.jpg) 在 body 部分中，插入一个将显示默认实心圆项目符号的无序列表：\n\
  \n```html\n<ul>\n  <li>HTML</li>\n  <li>Cascading Style Sheets</li>\n  <li>JavaScript</li>\n\
  </ul>\n```\n\n![图片](img/3p.jpg) 接下来，插入一个将显示空心圆项目符号的无序列表：\n\n```html\n<ul style=\"\
  list-style-type:circle\">\n  <li>C Programming</li>\n  <li>C++ Programming</li>\n\
  \  <li>C# Programming</li>\n</ul>\n```\n\n![图片](img/4p.jpg) 现在，插入一个将显示实心方块项目符号的无序列表：\n\
  \n```html\n<ul style=\"list-style-type:square\">\n  <li>Bash</li>\n  <li>PHP</li>\n\
  \  <li>Python</li>\n</ul>\n```\n\n![图片](img/5p.jpg) 最后，插入一个将显示图片作为项目符号的无序列表：\n\n\
  ```html\n<ul style=\"list-style-image:url(ulist-go.png)\">\n  <li>Access</li>\n\
  \  <li>Excel VBA</li>\n  <li>Visual Basic</li>\n</ul>\n```\n\n![图片](img/pg83_1.jpg)\
  \ `ulist-go.png` (21px x 21px)\n\n![图片](img/6p.jpg) 保存 HTML 文档，然后在浏览器中打开，查看无序列表的项目符号。\n\
  \n![图片](img/pg83_2.jpg)\n![图片](img/hot.jpg)\n\n请注意，在 CSS 术语中，列表是在内容框中编写的，其项目符号绘制在左侧内边距区域中。\n\
  \n## 有序列表\n\n有序列表中列表项的顺序很重要，每个项目都有编号，以将列表项与普通文本区分开。\n\n![图片](img/pg84_1.jpg)\n\n\
  在 HTML 中，有序列表使用 `<ol></ol>` 标签创建，它为列表项提供了一个容器。与无序列表一样，每个列表项可以使用 `<li></li>` 标签包围项目来创建，或者可选地仅使用\
  \ `<li>` 放在项目前面——这两种 `<li>` 元素形式都是有效的 HTML。一个有序列表 `<ol>` 元素可以包含多个列表项 `<li>` 元素。\n\
  \n用于区分有序列表项与普通文本的自动编号可以是以下六种编号类型之一：\n\n- `十进制` – 传统数字（默认样式）。\n- `罗马数字` – 古典数字。\n\
  - `拉丁字母` – 传统字母顺序。\n- `希腊字母` – 古典字母顺序。\n- `格鲁吉亚数字` – 传统格鲁吉亚编号。\n- `亚美尼亚数字` – 传统亚美尼亚编号。\n\
  \n样式规则可以为列表的 `list-style-type` 属性指定上述任一编号类型，使用以下值：\n\n| 类型 | 值 |\n| :--- | :---\
  \ |\n| 十进制 | `decimal` 或 `decimal-leading-zero` |\n| 罗马数字 | `lower-roman` 或 `upper-roman`\
  \ |\n| 拉丁字母 | `lower-latin` 或 `upper-latin`，`lower-alpha` 或 `upper-alpha` |\n| 希腊字母\
  \ | `lower-greek` |\n| 格鲁吉亚数字 | `georgian` |\n| 亚美尼亚数字 | `armenian` |\n\n此外，可以指定\
  \ `none` 值以隐藏编号。列表项编号通常从 1 开始，但可以在 `<ol>` 标签的 `start` 属性中指定不同的起始点。\n\n![图片](img/forget.jpg)\n\
  \n当未指定编号类型时，将使用默认类型。\n\n![图片](img/1p.jpg) 创建一个 HTML 文档\n![图片](img/htmlp.jpg) `olist.html`\n\
  \n![图片](img/2p.jpg) 在 body 部分中，插入一个将显示默认编号的有序列表：\n\n```html\n<ol>\n  <li>HTML</li>\n\
  \  <li>Cascading Style Sheets</li>\n  <li>JavaScript</li>\n</ol>\n```\n\n![图片](img/3p.jpg)\
  \ 接下来，插入一个将显示罗马数字编号的有序列表：\n\n```html\n<ol style=\"list-style-type:upper-roman\"\
  >\n  <li>C Programming</li>\n  <li>C++ Programming</li>\n  <li>C# Programming</li>\n\
  </ol>\n```\n\n![图片](img/4p.jpg) 现在，插入一个将从一百（100）开始编号的有序列表：\n\n```html\n<ol start=\"\
  100\">\n  <li>Bash</li>\n  <li>PHP</li>\n  <li>Python</li>\n</ol>\n```\n\n![图片](img/5p.jpg)\
  \ 保存 HTML 文档，然后在浏览器中打开，查看有序列表的编号。\n\n![图片](img/pg85_1.jpg)\n![图片](img/hot.jpg)\n\
  \n\n\n\n\n与无序列表中的标记一样，编号绘制在列表内容框的左内边距区域。\n\n## 描述列表\n\n描述列表是一种特殊类型的列表，其中每个列表项包含两部分——第一部分是术语，第二部分是对该术语的描述。这被称为名称/值对。例如，术语“太阳”的名称/值对可以是“太阳/我们太阳系中心的恒星”。\n\
  \n![image](img/pg86_1.jpg)\n\n在 HTML 中，描述列表使用 `<dl> </dl>` 标签创建，这些标签为列表项提供了一个容器。每个列表项术语包含在\
  \ `<dt> </dt>` 定义术语标签之间，每个列表项描述包含在 `<dd> </dd>` 定义描述标签之间。可选地，可以省略 `</dt>` 和 `</dd>`\
  \ 结束标签——`<dt>` 和 `<dd>` 元素的任何一种形式都是有效的。\n\n描述列表中的每个列表项可以包含多个 `<dt>` 定义术语元素和多个 `<dd>`\
  \ 定义描述元素——以允许一个术语有多个描述，或多个术语共享一个描述。通常，浏览器会将定义描述相对于其术语进行缩进显示。\n\n描述列表也适用于包含一系列问题和相关答案，或任何其他名称/值数据组。\n\
  \n![image](img/1p.jpg)创建一个 HTML 文档\n\n![image](img/htmlp.jpg)\n\n`dlist.html`\n\n\
  ![image](img/2p.jpg)在 body 部分中，插入一个包含两个问答名称/值对的描述列表\n\n```html\n<dl>\n<dt>什么是 HTML？</dt>\n\
  <dd>超文本标记语言</dd>\n<dt>它有什么用途？</dt>\n<dd>网页结构。</dd>\n</dl>\n```\n\n![image](img/3p.jpg)接下来，在\
  \ body 部分中，插入一个描述列表，描述一个术语的用法、发音和含义\n\n```html\n<dl>\n<dt><dfn>同音异义词</dfn></dt>\n\
  <dd class=”grammar”>名词</dd>\n<dd class=”spoken”>[hɒmənɪm]</dd>\n<dd>一个与另一个词在发音和拼写上相同但含义不同的词</dd>\n\
  </dl>\n```\n\n![image](img/4p.jpg)现在，插入一个描述列表，描述一个术语的用法、发音和多个含义\n\n```html\n<dl>\n\
  <dt><dfn>鼠标</dfn></dt>\n<dd class=”grammar”>名词</dd>\n<dd class=”spoken”>[maʊs]</dd>\n\
  <dd>各种啮齿动物科中的一种小动物</dd>\n<dd>一种手掌大小的、带按钮的设备，用于移动计算机光标</dd> \n<dd>一个安静、胆小的人</dd>\n\
  </dl>\n```\n\n![image](img/5p.jpg)添加一个样式表，为列表中的问题和定义术语着色，并为某些特定描述着色\n\n```css\n\
  <style>\ndt { color : Blue ; }\ndfn { color : Red ; font-size : 20pt ; }\ndd.grammar\
  \ { color : Green ; }\ndd.spoken { color : Purple ; }\n</style>\n```\n\n![image](img/6p.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它，查看名称/值对\n\n![image](img/pg87_2.jpg)\n\n![image](img/forget.jpg)\n\
  \n单独的 `<dt>` 元素并不表示其内容是被定义的术语——必须使用嵌套的 `<dfn>` 元素来实现此目的。\n\n![image](img/snake.jpg)\n\
  \n不要使用定义列表来标记对话——应使用段落来标记每一段对话。\n\n## 基本表格\n\n数据通常以表格形式呈现最佳，按行和列排列，以逻辑方式对相关项进行分组，从而易于理解。\n\
  \n![image](img/pg88_1.jpg)\n\n在 HTML 中，表格使用 `<table> </table>` 标签创建，这些标签为表格行提供了一个容器。每个表格行使用\
  \ `<tr> </tr>` 标签创建，这些标签为一行表格数据单元格提供了容器。每个表格数据单元格使用 `<td> </td>` 标签创建，这些标签包含要呈现的实际数据。可选地，可以省略\
  \ `</td>` 和 `</tr>` 结束标签——`<td>` 和 `<tr>` 元素的任何一种形式都是有效的。\n\n一个 `<table>` 元素通常包含多个\
  \ `<tr>` 元素，以创建一个显示多行数据的表格。类似地，每个 `<tr>` 元素通常包含多个 `<td>` 元素，以创建一个多列数据的表格。然而，需要注意的是，表格中的每个\
  \ `<tr>` 行必须包含完全相同数量的 `<td>` 单元格——例如，如果第一个 `<tr>` 行包含五个 `<td>` 单元格，那么所有 `<tr>` 行都必须包含五个\
  \ `<td>` 单元格。\n\n![image](img/1p.jpg)创建一个 HTML 文档\n\n![image](img/htmlp.jpg)\n\n\
  `table.html`\n\n![image](img/2p.jpg)在 body 部分中，插入一个表格元素\n\n```html\n<table>\n<!--\
  \ 表格行将放在这里。 -->\n</table>\n```\n\n![image](img/3p.jpg)现在，在表格元素中，插入三个表格行——每行包含三个表格数据单元格\n\
  \n```html\n<tr> <td>单元格 1.1 <td>单元格 1.2 <td>单元格 1.3 </tr>\n<tr> <td>单元格 2.1 <td>单元格\
  \ 2.2 <td>单元格 2.3 </tr>\n<tr> <td>单元格 3.1 <td>单元格 3.2 <td>单元格 3.3 </tr>\n```\n\n\
  ![image](img/4p.jpg)添加一个样式表，设置表格宽度和边框、单元格边框以及稍后添加的标题边框\n\n```css\n<style>\ntable\
  \ { width : 500px ; border : 5px solid Black ; }\ntd,th { border : 1px solid Black\
  \ ; }\n</style>\n```\n\n![image](img/hot.jpg)\n\n省略结束的 `</td>` 单元格标签，但保留结束的 `</tr>`\
  \ 标签，以更清晰地表示每个表格行的结束。\n\n![image](img/5p.jpg)保存 HTML 文档，然后在浏览器中打开它，查看一个基本表格\n\n\
  ![image](img/pg89_1.jpg)\n\n可以使用 `<caption> </caption>` 标签指定表格标题，并且可以在 `<th> </th>`\
  \ 标签之间添加行标题和列标题。\n\n![image](img/6p.jpg)在开始表格标签之后立即插入一个标题\n\n```html\n<caption>一个基本表格</caption>\n\
  ```\n\n![image](img/7p.jpg)接下来，插入一行四个列标题\n\n```html\n<tr><th><th>列 1<th>列 2<th>列\
  \ 3</tr>\n```\n\n![image](img/8p.jpg)现在，在每个后续行的开头插入一个标题\n\n```html\n<tr><th>行 1<td>单元格\
  \ 1.1<td>单元格 1.2<td>单元格 1.3</tr>\n<tr><th>行 2<td>单元格 2.1<td>单元格 2.2<td>单元格 2.3</tr>\n\
  <tr><th>行 3<td>单元格 3.1<td>单元格 3.2<td>单元格 3.3</tr>\n```\n\n![image](img/9p.jpg)保存编辑后的\
  \ HTML 文档，然后刷新浏览器以查看添加的内容\n\n![image](img/pg89_1.jpg)\n\n![image](img/snake.jpg)\n\
  \n如果要包含 `<caption>` 元素，它必须紧跟在开始 `<table>` 标签之后。\n\n![image](img/snake.jpg)\n\n结束的\
  \ `</th>` 标签是可选的，但开始 `<th>` 标题的数量必须与行和列的数量完全匹配。\n\n![image](img/forget.jpg)\n\n\
  本章后续示例将在此基础上构建，引入更多表格特性。\n\n## 跨行单元格\n\n单个表格单元格可以与其他单元格垂直合并，以跨越多行。\n\n![image](img/pg90_1.jpg)\n\
  \n要跨越的行数通过跨行单元格的 `<td>` 标签中的 `rowspan` 属性指定。然后必须删除被跨越行中的单元格，以保持表格的对称性。\n\n![image](img/1p.jpg)复制上一个示例\
  \ 此处 中创建的 `table.html` 文档，并将其重命名为 `rowspan.html`\n\n![image](img/htmlp.jpg)\n\n\
  `rowspan.html`\n\n![image](img/2p.jpg)更改文档和表格标题\n\n```html\n<title>行跨列示例</title>\n\
  <caption>一个跨行的表格</caption>\n```\n\n![image](img/3p.jpg)在包含文本“单元格 1.1”的表格数据元素中，在其开始标签中插入一个属性并编辑其内容\n\
  \n```html\n<td rowspan=”2”>单元格 1.1+2.1</td>\n```\n\n![image](img/4p.jpg)接下来，删除包含文本“单元格\
  \ 2.1”的表格数据元素——因为该单元格现在已被跨越\n\n![image](img/5p.jpg)现在，向样式表添加规则，为跨行的单元格设置背景颜色\n\n\
  ```css\ntd[rowspan=”2”] { background : Pink ; }\ntd[rowspan=”3”] { background :\
  \ HotPink ; }\n```\n\n![image](img/6p.jpg)保存 HTML 文档，然后在浏览器中打开它，查看第 1 列中跨两行的单元格\n\
  \n![image](img/pg90_2.jpg)\n\n\n\n\n\n![image](img/7p.jpg)接下来，在表格数据元素中插入一个包含“Cell\
  \ 2.2”文本的属性，并编辑其内容\n\n```html\n<td rowspan=”2”>Cell 2.2+3.2</td>\n```\n\n![image](img/8p.jpg)现在，删除包含“Cell\
  \ 3.2”文本的表格数据元素——因为该单元格现在被合并\n\n![image](img/9p.jpg)保存编辑后的 HTML 文档，然后刷新浏览器以查看第 2\
  \ 列中跨两行的单元格\n\n![image](img/pg91_1.jpg)\n\n![image](img/10p.jpg)接下来，在表格数据元素中插入一个包含“Cell\
  \ 1.3”文本的属性，并编辑其内容\n\n```html\n<td rowspan=”3”>Cell 1.3+2.3+3.3</td>\n```\n\n![image](img/11p.jpg)现在，删除包含“Cell\
  \ 2.3”和“Cell 3.3”文本的表格数据元素——因为这些单元格现在被合并\n\n![image](img/12p.jpg)保存编辑后的 HTML 文档并刷新浏览器以查看第\
  \ 3 列中跨三行的单元格\n\n![image](img/pg91_2.jpg)\n\n![image](img/forget.jpg)\n\n注意，默认情况下每个单元格中的文本是左对齐的，并在合并单元格中水平居中。\n\
  \n## 增强表格\n\n可以通过在常规表格内容上下添加特殊的表头和表脚行来增强表格，这些行提供了额外的表格信息。\n\n![image](img/pg92_1.jpg)\n\
  \n在 HTML 中，表头信息包含在 `<<thead>> </thead>` 标签之间，表脚信息包含在 `<tfoot> </tfoot>` 标签之间。当表格具有\
  \ `<<thead>>` 和 `<tfoot>` 元素时，所有的常规表格行必须包含在 `<tbody> </tbody>` 标签之间。\n\n在长表中，可以使用多个\
  \ `<tbody>` 元素将行分组为单独的表格主体。打印这些内容时，每个纸页都可以重复表头和表脚信息。\n\n注意的是 `<<thead>>` 元素必须出现在\
  \ `<<table>>` 元素内第一个 `<tbody>` 元素之前，但如果存在 `<<caption>>` 元素，则应出现在其之后。\n\n![image](img/1p.jpg)复制此处创建的\
  \ `table.html` 文档，并将其重命名为“enhance.html”\n\n![image](img/htmlp.jpg)\n\nenhance.html\n\
  \n![image](img/2p.jpg)更改文档和表格标题\n\n```html\n<title>Enhanced Table Example</title>\n\
  <caption>An Enhanced Table</caption>\n```\n\n![image](img/3p.jpg)向样式表添加规则来美化表头、第二个表格主体标题以及最后的表格表脚\n\
  \n```css\nthead { background : Pink ; }\nth.next { background : DeepPink ; color\
  \ : White ; }\ntfoot { background : HotPink ; }\n```\n\n![image](img/4p.jpg)在 caption\
  \ 之后，插入一个包含跨越所有四列的单行的表头\n\n```html\n<<thead>\n<tr><td colspan=”4”>Header Information</tr>\n\
  </head>\n```\n\n![image](img/5p.jpg)在表头之后，添加一个表格主体元素来封装所有现有的常规表格行\n\n```html\n<tbody>\n\
  <!-- Existing row elements go here. -->\n</tbody>\n```\n\n![image](img/6p.jpg)在表格主体元素之后，插入一个包含四个更多表格行的第二个表格主体元素\n\
  \n```html\n<tbody>\n<tr> <th colspan=”4” class=”next”>Next section</tr>\n<tr>\n\
  <th>Row 4</td><td>Cell 4.1</td><td>Cell 4.2</td><td>Cell 4.3</td></tr>\n<tr>\n<th>Row\
  \ 5</td><td>Cell 5.1</td><td>Cell 5.2</td><td>Cell 5.3</td></tr>\n<tr>\n<th>Row\
  \ 6</td><td>Cell 6.1</td><td>Cell 6.2</td><td>Cell 6.3</td></tr>\n</tbody>\n```\n\
  \n![image](img/7p.jpg)在第二个表格主体之后，插入一个包含跨越所有四列的单行的表脚\n\n```html\n<tfoot>\n<tr><td\
  \ colspan=”4”>Footer Information</tr>\n</tfoot>\n```\n\n![image](img/8p.jpg)保存 HTML\
  \ 文档，然后在浏览器中打开它以查看增强后的表格\n\n![image](img/pg93_1.jpg)\n\n![image](img/forget.jpg)\n\
  \n表头和表脚应包含信息——所有的表格数据都应该出现在表格主体中。\n\n## 控制列\n\n当仅通过样式规则指定总宽度时，浏览器默认根据其内容计算每列的宽度——内容宽的列将比内容窄的列更宽。使用\
  \ `<col>` 标签表示单独列可以实现对列宽更大的控制，因此规则可以指定它们的大小和外观。\n\n![image](img/pg94_1.jpg)\n\n\
  单个 `<col>` 元素也可以通过包含 `span` 属性来指定列数，表示多个列。因此，指定列宽的样式规则将应用于 `<col>` 元素表示的所有列。可选情况下，`<col>`\
  \ 元素可以包含在 `<colgroup>` 标签之间。\n\n![image](img/1p.jpg)创建一个 HTML 文档\n\n![image](img/htmlp.jpg)\n\
  \ncolumn.html\n\n![image](img/2p.jpg)在主体中插入一个表格\n\n```html\n<table>\n<caption>Breakfast</caption>\n\
  <tbody>Table content to go here.</tbody>\n</table>\n```\n\n![image](img/3p.jpg)接下来，在表格中插入一个列组\n\
  \n```html\n<colgroup>\n<col>\n</colgroup>\n```\n\n![image](img/4p.jpg)现在，添加规则来指定每列的宽度\n\
  \n```css\n<style>\ntable { width : 500px ; border-collapse : collapse ; }\ntbody\
  \ th { background : Pink ; color : White ; }\ntbody td { padding : 3px ; text-align\
  \ : center ; }\ntfoot { font-size : small ; }\n</style>\n```\n\n![image](img/5p.jpg)接下来，添加规则来指定每列的宽度\n\
  \n```css\ncolgroup.sidebar col { width : 70px ; }\ncolgroup.info col { width : 80px\
  \ ; }\n```\n\n![image](img/6p.jpg)现在，添加规则来样式分组和单独的列\n\n```css\ncolgroup.info { border-left\
  \ : 2px solid White ; }\ncolgroup col.stripe { background : Pink ; }\n```\n\n![image](img/7p.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它以查看不同的列组\n\n![image](img/pg95_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n此表脚使用了 &bull; 字符实体来创建符号。\n\n## 总结\n\n- HTML `<ul>` 元素创建一个无序列表，其中包含单个列表项目 `<li>`\
  \ 元素。\n- `list-style-type` 属性可以指定无序列表项目使用 `disc`、`circle` 或 `square` 符号，或 `none`。\n\
  - `list-style-image` 属性可以指定用于替代列表项目符号的图像 URL。\n- `<ol>` 元素创建一个有序数字列表，其中包含单个列表项目\
  \ `<li>` 元素。\n- `list-style-type` 属性可以指定有序列表项目如何编号，例如 `decimal`、`upper-latin` 或\
  \ `none`。\n- `<dl>` 元素创建一个定义列表，其中包含 `<dt>` 元素中的术语和 `<dd>` 元素的描述。\n- HTML `<table>`\
  \ 元素创建一个表格，并可以可选包含一个 `<caption>` 元素作为表格标题。\n- 每个表格行都通过 `<tr>` 元素创建，其中包含许多 `<th>`\
  \ 标题元素和 `<td>` 数据元素。\n- 表格单元格可以使用 `rowspan` 属性跨越其他单元格，使用 `colspan` 属性跨越右侧单元格。\n\n\
  \n\n\n\n-   在 `<caption>` 元素之后立即添加 `<<thead>` 和 `<tfoot>` 元素，可以为表格添加表头和页脚。\n-  \
  \ 具有表头和页脚的表格必须将所有普通表格行封装在 `<tbody>` 元素中。\n-   可以使用 `<colgroup>` 元素对表格列进行分组以设置样式。\n\
  -   每个表格列可以用 `<col>` 元素表示，以便对其单独设置样式。\n\n| 5 整合媒体内容 | ![image](img/pg11_1.jpg) |\n\
  \n**本章演示了如何在页面内容中包含图像和其他媒体文件。**\n\n- 添加图像\n- 图像热区域\n- 引用图表\n- 选择图片\n- 嵌入对象\n- 嵌入向量\n\
  - 嵌入框架\n- 添加音频\n- 添加视频\n- 指示进度\n- 使用模板\n- 插入插槽\n- 使用对话框\n- 绘制画布\n- 总结\n\n## 添加图像\n\
  \n![image](img/pg98_1.jpg)\n\n在 HTML 文档内容中添加图像的能力引入了许多令人兴奋的。使用 `<img>` 标签可以轻松向文档添加图像，该标签最好始终包含以下属性：\n\
  \n-   需要 `src` 属性来指定图像位置的 URL，可以是绝对路径或相对路径。\n-   建议使用 `width` 属性来指定图像在页面上占据区域的像素宽度。\n\
  -   建议使用 `height` 属性来指定图像在页面上占据区域的像素高度。\n-   建议使用 `alt` 属性来指定描述图像的文本，用于图像无法加载的情况。\n\
  \n赋给 `width` 和 `height` 属性的值会指示网络浏览器在网页上创建该尺寸的内容区域。这不需要是图像的实际尺寸，因为网络浏览器可以按另一个指定的尺寸渲染图像。必须注意确保尺寸按实际图像大小等比例缩放，以避免失真。此外，图像应该只缩小，因为放大通常会导致像素化——即肉眼可以看到单个像素。然而，依赖浏览器来缩放不以全尺寸显示的图像是效率低下的做法，因为这需要下载不必要的大得多的文件。更好的方法是使用图形编辑器（如\
  \ Photoshop）调整图像大小，将其尺寸调整为它在页面上占据的实际尺寸，这样它下载和显示速度会更快。\n\n![image](img/pg98_2.jpg)\
  \ 原始文件大小\n\n![image](img/pg98_3.jpg) 缩小至 33% 网络图形的最优文件类型是流行的非专有网络图形 (PNG) 格式，它能产生紧凑的文件并支持透明度。\n\
  \n![image](img/forget.jpg) HTML 标签中的属性可以以任何顺序出现。\n\n![image](img/snake.jpg) 避免在网络图形中使用\
  \ BMP 位图格式——将此处显示的原始图像保存为 `fish.bmp` 将创建一个大小为 790KB 的文件！\n\n![image](img/1o.jpg)\
  \ 创建 HTML 文档\n\n![image](img/htmlo.jpg) image.html\n\n![image](img/2o.jpg) 在 body\
  \ 部分，插入三个图像元素——显示一个全尺寸图形加上两个缩放版本\n\n```html\n<img src=\"image-fish.png\" width=\"\
  200\" height=\"150\" alt=\"Fish\">\n<img src=\"image-fish.png\" width=\"150\" height=\"\
  112\" alt=\"Fish\">\n<img src=\"image-fish.png\" width=\"100\" height=\"75\" alt=\"\
  Fish\">\n```\n\n![image](img/3o.jpg) 保存 HTML 文档然后在浏览器中打开它，查看全尺寸图像和缩放版本\n\n![image](img/pg99_1.jpg)\
  \ image-fish.png 200px x 150px\n\n![image](img/pg99_2.jpg) 现在，为每个图像元素插入此属性\n\n```html\n\
  style=\"background:Aqua\"\n```\n\n![image](img/pg99_3.jpg) 刷新您的浏览器以查看彩色背景\n\n##\
  \ 图像热区域\n\n如果为图像添加“图像映射”以定义每个超链接的“热点”区域，单个图像就可以目标多个超链接资源。要使用图像映射，`<img>` 标签必须包含\
  \ `usemap` 属性来指定映射名称，并以 `#` 字符开头。图像映射本身包含在 `<map>` `</map>` 标签之间，其名称由起始 `<map>`\
  \ 标签中的 `name` 属性指定。\n\n![image](img/pg100_1.jpg) 图像中每个成为超链接热点的区域由 `<map>` 元素内 `<area>`\
  \ 标签的四个属性定义。`shape` 属性指定形状为 `rect`（矩形）、`circle`（圆形）或 `poly`（多边形），`coords` 属性指定逗号分隔的列表。\n\
  \n| 形状 | 坐标 |\n| :--- | :--- |\n| rect | 左上角 x, 左上角 y, 右下角 x, 右下角 y |\n| circle\
  \ | 中心 x, 中心 y, 半径 |\n| poly | x1, y1, x2, y2, x3, y3, 等 – 每个点一个对 |\n\n每个 `<area>`\
  \ 标签必须具有 `href` 属性来指定超链接的 URL，并具有 `alt` 属性来指定在图像未启用时显示的替代文本。第一个和最后一个点必须具有相同的坐标以完成形状。\n\
  \n![image](img/1o.jpg) 创建 HTML 文档\n\n![image](img/htmlo.jpg) map.html\n\n![image](img/2o.jpg)\
  \ 在 body 部分，插入图像和映射元素\n\n```html\n<img src=\"map.png\" alt=\"Search\" usemap=\"\
  #search\">\n<map name=\"search\">\n  <!-- 区域在此处 -->\n</map>\n```\n\n![image](img/pg99_2.jpg)\
  \ map.png 400px x 200px\n\n![image](img/3o.jpg) 在映射元素内，定义一个覆盖图像左上象的矩形热点——从左上角点 `xy:0,0`\
  \ 到右下角点 `xy:200,100`\n\n```html\n<area shape=\"rect\" coords=\"0,0,200,100\" href=\"\
  https://www.bing.com\" alt=\"Bing Panel\" title=\"Link to Bing\">\n```\n\n![image](img/4o.jpg)\
  \ 现在，在映射元素内，定义三个相同尺寸的热点覆盖图像的其他三个象限\n\n```html\n<area shape=\"rect\" coords=\"200,0,400,100\"\
  \ href=\"https://www.ask.com\" alt=\"Ask Panel\" title=\"Link to Ask\">\n<area shape=\"\
  rect\" coords=\"0,100,200,200\" href=\"https://www.google.com\" alt=\"Google Panel\"\
  \ title=\"Link to Google\">\n<area shape=\"rect\" coords=\"200,100,400,200\" href=\"\
  https://www.yahoo.com\" alt=\"Yahoo Panel\" title=\"Link to Yahoo\">\n```\n\n![image](img/5o.jpg)\
  \ 保存 HTML 文档然后在浏览器中打开它，查看工具提示描述每个可以点击以打开其关联目标的热点\n\n![image](img/pg101_1.jpg)\n\n\
  ## 引用图表\n\n根据最新的 HTML 规范，网页作者现在有了更多方法将图像插入到网页中。`<img>` 标签可以嵌套在 `<figure>` 元素中，以嵌入与正文内容相关但移除后不会破坏文本含义的图像。由于嵌套图像现在实际上变成了一个自包含的“图表”，可以根据需要将其远离文本，并使用嵌套的\
  \ `<figcaption>` 元素中的标题进行引用：\n\n```html\n<figure id=\"front-stack\">\n  <img src=\"\
  figure-front.png\" alt=\"Front-end\">\n  <figcaption>标题在此</figcaption>\n</figure>\n\
  ```\n\n\n\n\n```html\n<figure width=\"160\" height=\"145\">\n<figcaption class=\"\
  reference\">\n图 1：前端技术\n</figcaption>\n</figure>\n```\n\n![image](img/4o.jpg)\n\
  现在，插入引用上述带注图片的文本内容\n\n<p>前端开发，也称为客户端开发，是为网站或 Web 应用生成 HTML 文档、CSS 样式表和 JavaScript\
  \ 脚本代码 <span class=\"reference\">(图 1)</span>实践——这样用户就可以可以直接看到并与之交互。</p>\n\n![image](img/5o.jpg)\n\
  插入第二个带注图片\n\n```html\n<figure id=\"back-stack\">\n<img src=\"figure-back.png\" alt=\"\
  Back-end\" width=\"160\" height=\"128\">\n<figcaption class=\"reference\">\n图 2：后端技术\n\
  </figcaption>\n</figure>\n```\n\n![image](img/hot.jpg)\n\n始终通过标签来引用图片——避免使用如“右侧图中的”之类的引用术语，这样文档布局就可以轻松更改而不会产生混淆。\n\
  \n![image](img/6o.jpg)\n现在，插入引用第二个带注图片的文本内容\n\n<p>后端开发，也称为服务器端开发，是使用 SQL、Java、PHP\
  \ 或 .NET 等编程语言生成复杂网站的 <span class=\"reference\">(图 2)</span>实践，以提供前端能力之外的功能。</p>\n\
  \n![image](img/7o.jpg)\n添加样式表来定位每个带注图片，并指定一些字体样式\n\n```css\n<style>\nfigure#front-stack{\
  \ float:left; margin-top :0px; }\nfigure#back-stack { float:right; margin-top:0px;\
  \ }\n.reference { color : Red; font-weight:bold; }\np:first-letter { font-size :xx-large;\
  \ }\n</style>\n```\n\n![image](img/8o.jpg)\n保存 HTML 文档和样式表，然后在浏览器中打开网页以查看带注图片\n\n\
  ![image](img/pg103_1.jpg)\n\n![image](img/forget.jpg)\n\n你可以在 [www.ineasysteps.com](http://www.ineasysteps.com)\
  \ 通过该系列关于 SQL、Java、PHP、Python 和 MySQL 的配套书籍发现更多关于后端技术的知识\n\n## 选择图片\n\n随着网页内容越来越多在小型手持设备上访问，最新的\
  \ HTML 规范允许网页作者根据设备屏幕尺寸指定在网页上显示的备用图像。\n\n![image](img/pg104_1.jpg)\n\n`<picture>`\
  \ `</picture>` 元素用于包含多个图像源，浏览器从中选择最合适的尺寸。每个图像源都指定在嵌套的 `<source>` 元素的 `srcset` 属性中，并将适用于该图片的最小屏幕宽度指定在它的\
  \ `media` 属性中。该作业需要一种特殊的语法，在 `( )` 括号内通过 `min-width` 属性指定尺寸——例如，指定某图像仅适用于屏幕宽度超过某值的设备显示。\n\
  \n*(注：原文中该段落重复多次，此处已按要求仅翻译一次)*\n\n\n\n\n# 嵌入向量\n\nHTML `<embed>` 元素允许你集成外部资源以与 HTML\
  \ 文档进行交互。\n\n![image](img/pg108_1.jpg)\n\n支持现代 HTML 的网页浏览器也支持缩放矢量图形 (SVG)。与 PNG\
  \ 等位图图形格式不同（后者将图形信息存储为每个像素的颜色），矢量图形将图形信息存储为一系列“路径”。这是一种描述图形的非常高效的方法。\n\n最重要的是，矢量图形可以在不失真清晰度的情况下进行缩放。这意味着它们可以无限放大，而不会出现像放大\
  \ PNG、JPG 或 GIF 文件格式的位图图像时那样的像素化问题。\n\n![image](img/pg108_2.jpg)\n\n![image](img/pg108_3.jpg)\n\
  \n![image](img/pg108_4.jpg)\n\nSVG 矢量 x 3\n\n![image](img/pg108_5.jpg)\n\nPNG 位图\
  \ x 3\n\nSVG 实际上并不是 HTML 的一部分，而是一种基于可扩展标记语言 (XML) 的规范，因此它在文本文件中描述矢量图像。这些文件可以手动创建，但使用像\
  \ Adobe Illustrator 这样的矢量图形编辑器简单得多。\n\nSVG 图像可以缩放而不会丢失清晰度，并且可以高质量打印而不丢失分辨率。\n\n\
  SVG 文件还可以进行脚本化处理。在静态矢量图像中添加 JavaScript 功能使得创建交互式 SVG 对象成为可能。这意味着 SVG 文件中的每个元素和每个属性都可以动画化。\n\
  \n静态 SVG 图像和交互式 SVG 对象都可以通过通过为 `<embed>` 元素的 `type` 属性指定 MIME 类型“image/svg+xml”来嵌入到\
  \ HTML 中。\n\n![image](img/hot.jpg)\n\n静态 SVG 图像也可以使用 `<img>` 元素嵌入——就像对待任何其他图像一样。\n\
  \n![image](img/1o.jpg)创建一个 HTML 文档\n\n![image](img/htmlo.jpg)\n\nvector.html\n\n\
  ![image](img/2o.jpg)在 `body` 部分中，插入一个元素来嵌入一个交互式缩放矢量图形\n\n```html\n<embed src=\"\
  vector-picker.svg\" type=\"image/svg+xml\" width=\"280\" height=\"200\">\n```\n\n\
  ![image](img/svgo.jpg)\n\nvector-picker.svg\n\n（外部资源）\n\n![image](img/3o.jpg)将 HTML\
  \ 文档与 SVG 文件一起保存，然后在浏览器中打开该网页以查看嵌入的交互式缩放矢量图形\n\n![image](img/4o.jpg)点击图像中任何带圈的颜色样本来选择颜色以与矢量图形交互\n\
  \n![image](img/pg109_1.jpg)\n\n![image](img/forget.jpg)\n\n你可以通过从此处下载示例包来检查 JavaScript\
  \ 是如何纳入此 SVG 文档的：[www.ineasysteps.com/resource-centre/downloads](http://www.ineasysteps.com/resource-centre/downloads)\n\
  \n# 嵌入框架\n\n外部资源可以使用 `<iframe> </iframe>` 标签以“内联框架”的形式嵌入到 HTML 文档中。这些框架在页面上创建了一个固定区域，用于显示嵌入的资源。内联框架的尺寸必须指定给\
  \ `<iframe>` 元素的 `width` 和 `height` 属性，并将外部资源的 URL 赋值给其 `src` 属性。当外部资源的尺寸超过内联框架的尺寸时，浏览器会自动添加滚动条，以便户可以查看全部内容。\n\
  \n![image](img/pg106_1.jpg)\n\n每个 `<iframe>` 元素还可以可选包含一个 `name` 属性，为该框架指定唯一标识符。这允许超链接通过将框架名称分配给\
  \ `<a>` 元素中的 `target` 属性，将其 `href` 属性中指定的 URL 加载到内联框架中（而不是替换整个页面）。例如，超链接可以目标一个名为“topbox”的内联框架：`<a\
  \ href=\"some.html\" target=\"topbox\">`。\n\n通常，内联框架有助于在保持紧凑页面格式的同时提供补充内容。\n\n![image](img/1o.jpg)创建一个\
  \ HTML 文档\n\n![image](img/htmlo.jpg)\n\niframe.html\n\n![image](img/2o.jpg)在 `body`\
  \ 部分中，插入一个包含标题和描述性段落的 `article` 元素，并指定类名以用于定位样式设置\n\n```html\n<article class=\"\
  left220\">\n  <h3>概念车</h3>\n  <p>最近的汽展上首秀的许多具有创意和创新的概念车让观众对它们的产出充满期待。</p>\n</article>\n\
  ```\n\n![image](img/3o.jpg)接下来，在 `body` 中，作为一个 `aside`，插入一个内联框架来加载一个包含相关文本和说明性照片的文档，并水平排列\n\
  \n```html\n<aside>\n  <iframe src=\"concept.html\" width=\"300\" height=\"220\"\
  ></iframe>\n</aside>\n```\n\n![image](img/htmlo.jpg)\n\nconcept.html\n\n（外部资源）\n\
  \n![image](img/4o.jpg)现在，添加一个样式表来调整 `article` 的大小并将其定位在内联框架的左侧\n\n```html\n<style>\n\
  \  article.left220 { width :200px; float :left; margin-right :10px ; }\n</style>\n\
  ```\n\n![image](img/5o.jpg)将 HTML 文档与外部资源一起保存，然后在浏览器中打开它以查看文章和内联框架的内容\n\n![image](img/pg11_1.jpg)\n\
  \n![image](img/6o.jpg)拖动滚动条浏览内容\n\n![image](img/forget.jpg)\n\n在 `<iframe> </iframe>`\
  \ 标签之间可以提供备用消息，在禁用内联框架时显示。\n\n![image](img/hot.jpg)\n\n嵌入文档在房地产网站上非常受欢迎，用于配合属性描述。\n\
  \n# 添加音频\n\n外部音频资源（如 MP3 文件可以使用 `<audio> </audio>` 标签嵌入到 HTML 文档中。\n\n![image](img/pg12.jpg)\n\
  \n`<audio>` 元素可以包含 `src` 属性来指定音频资源的 URL，并包含额外的属性来决定如何使用音频资源：\n\n- `autoplay`：布尔属性，指定浏览器立即播放音频资源。\n\
  - `loop`：布尔属性，指定浏览器重复播放音频资源。\n- `controls`：布尔属性，指定浏览器显示启动或停止的控件。\n- `preload`：接受“auto”或“none”值，建议浏览器加载音频资源以便准备播放。\n\
  \n布尔属性（如 `autoplay`、`loop` 和 `controls` 属性）不需要赋值——仅存在元素中就足够让浏览器理解其用途。\n\n![image](img/hot.jpg)\n\
  \n布尔值只能是 True 或 False。默认情况下，除非赋值为 False，否则布尔属性均为 True。\n\n浏览器依赖内置的“编解码器”（**co**der-**dec**decoder）来解码音频资源以便播放。遗憾，并非所有浏览器都包含相同的音频解码器：\n\
  \n- **高级音频编码 (AAC)**：`mp4a.40.2`，Google Chrome、Firefox 和 Microsoft Edge 等现代浏览器支持音频。\n\
  - **Ogg 音频**：`vorbis`，其他浏览器支持的 OGG 格式音频。\n\n这种不一致性导致音频资源需要编码两次以便在所有浏览器中播放。因此需要在\
  \ `<audio>` 元素嵌套两个 `<source>` 元素，而不是在 `<audio>` 标签的 `src` 属性中指定单个资源 URL。对于每种文件格式，`<source>`\
  \ 元素可以通过 `src` 属性指定其资源 URL，并通过 `type` 属性指定其 MIME 类型。浏览器将仅加载支持的音频资源进行播放。\n\n在`<audio>\
  \ </audio>` 标签之间可以包含备用消息，在不支持音频播放时显示。\n\n![image](img/htmlo.jpg)\n\naudio.html\n\
  \n\n\n\n![image](img/2o.jpg)在 body 部分插入一个元素，用于嵌入 MP3 格式的音频资源并实现自动播放。\n\n```html\n\
  <audio src=\"audio.mp3\" autoplay >\n[ 后备消息 ]\n</audio>\n```\n\n![image](img/3o.jpg)保存\
  \ HTML 文档，然后在支持的浏览器中打开网页，即可听到自动播放的音频。\n\n![image](img/4o.jpg)接下来，将之前的两个属性替换为一个属性，以显示音频播放的用户控件。\n\
  \n```html\n<audio controls>\n<!-- 此处插入资源来源 -->\n</audio>\n```\n\n![image](img/5o.jpg)现在，在\
  \ audio 元素中插入元素，为所有浏览器指定要嵌入的音频资源。\n\n```html\n<source src=\"audio.mp3\" type=\"\
  audio/mpeg\" >\n<source src=\"audio.ogg\" type=\"audio/ogg\" >\n```\n\n![image](img/mp3o.jpg)\n\
  \naudio.mp3\n\n![image](img/oggo.jpg)\n\naudio.ogg\n\n（外部资源）\n\n![image](img/6o.jpg)再次保存\
  \ HTML 文档，然后在任意浏览器中打开网页，使用控件收听播放。\n\n![image](img/pg113_1.jpg)\n\n![image](img/snake.jpg)\n\
  \n避免在网站上使用自动音频播放，因为许多用户厌恶自动播放功能。\n\n## 添加视频\n\n可以使用 `<video> </video>` 标签在 HTML\
  \ 文档中嵌入 MP4 视频文件等外部视频资源。\n\n![image](img/pg114_1.jpg)\n\n为了确定视频资源的使用方式，`<video>`\
  \ 元素可以包含 `src`、`autoplay`、`loop`、`controls` 和 `preload` 属性，就像前面示例中的 `<audio>` 元素一样（参见此处）。此外，还可以通过\
  \ `width` 和 `height` 属性指定页面上显示视频区域的尺寸。\n\n有两种主要的视频压缩标准：\n\n- **高级视频编码（AVC）**——一种专利标准，也称为\
  \ H.264 或 MPEG-4（`.mp4` 文件）。\n- **WEBM 视频**——一种免版税的替代方案，用于替代专利的 H.264 和 MPEG-4 标准（`.webm`\
  \ 文件）。\n\n视频资源可以编码为每种格式，以便在所有浏览器中播放，并通过嵌套在 `<video>` 元素内的 `<source>` 元素进行嵌入。对于每种文件格式，`<source>`\
  \ 元素可以将其资源 URL 指定给 `src` 属性，并将每个视频文件的 MIME 类型指定给 `type` 属性。浏览器只会加载支持的视频资源进行播放。\n\
  \n可以在 `<video>` 元素内嵌套一个 `<track>` 标签，以指定 Web 视频文本轨道（WebVTT）字幕文件的位置，并将其指定给 `src`\
  \ 属性。该标签可以包含一个 `kind` 属性来描述轨道，以及一个 `srclang` 属性来描述语言。该标签还必须包含一个布尔值 `default` 属性，以使用指定的文件。\n\
  \n![image](img/pg114_2.jpg)\n\n你可以在 [www.w3.org/TR/webvtt1](http://www.w3.org/TR/webvtt1)\
  \ 在线了解更多关于 WebVTT 字幕格式的信息。\n\n字幕文件以 `WEBVTT` 开头。开始和结束时间提示以 HH:MM:SS.sss 格式添加在新行上，并用\
  \ `-->` 分隔。相关的字幕文本出现在每个时间提示下方的新行上，如下所示：\n\n```text\nWEBVTT\n00:00:01.000 --> 00:00:04.000\n\
  用“HTML in easy steps”弹吉他\n\n00:00:05.000 --> 00:00:06.000\n感谢观看\n```\n\n![image](img/vtto.jpg)\n\
  \nvideo.vtt\n\n![image](img/snake.jpg)\n\n注意，毫秒之间用句点（英文句号）分隔，而不是冒号。\n\n![image](img/1o.jpg)创建一个\
  \ HTML 文档\n\n![image](img/htmlo.jpg)\n\nvideo.html\n\n![image](img/2o.jpg)在 body\
  \ 部分插入一个元素，以显示视频播放的用户控件。\n\n```html\n<video controls >\n<!-- 此处插入资源来源 -->\n[ 后备消息\
  \ ]\n</video>\n```\n\n![image](img/3o.jpg)接下来，在 video 元素中插入元素，以嵌入视频资源并指定字幕文件。\n\n\
  ```html\n<source src=\"video.mp4\" type=\"video/mp4\" >\n<source src=\"video.webm\"\
  \ type=\"video/webm\" >\n<track src=\"video.vtt\" kind=\"subtitles\" srclang=\"\
  en\" default>\n```\n\n![image](img/mp4o.jpg)\n\nvideo.mp4\n\n![image](img/webm.jpg)\n\
  \nvideo.webm\n\n（外部资源）\n\n![image](img/4o.jpg)保存 HTML 文档，然后在任意浏览器中打开网页，使用控件观看视频播放。\n\
  \n![image](img/pg115_1.jpg)\n\n![image](img/pg115_2.jpg)\n\n![image](img/forget.jpg)\n\
  \n这个短视频会显示一条持续 4 秒的字幕，随后再显示第二条字幕。\n\n## 指示进度\n\n如果你不想提供浏览器标准的音频或视频播放控件，可以省略 `controls`\
  \ 属性。嵌入的媒体对象具有 `play()` 和 `pause()` 方法，可以调用这些方法来控制播放。\n\n`<progress>` 元素显示一个完成进度的可视化指示器。`value`\
  \ 属性决定进度的大小，并可以通过 `ontimeupdate` 事件动态更新。嵌入的媒体具有 `currentTime` 属性，用于存储自播放开始以来经过的时间，以及\
  \ `duration` 属性，用于存储总时间。这些可用于计算百分比：`currentTime / duration`。\n\nHTML 的 `<template></template>`\
  \ 元素允许你包含在网页加载到浏览器时不会立即显示在页面上的内容。\n\n\n\n\n## HTML 模板\n\n存储在 `<template>` 元素内部的内容可以使用\
  \ JavaScript 在稍后加载，以便在网页上显示该内容。当你有可能重复添加的内容时，这非常有用。\n\n模板内容是一个 `DocumentFragment`\
  \ 对象，脚本可以对其进行复制。复制后的节点可以作为现有内容的“子”元素添加。脚本还可以从内容中移除子元素。\n\n### 创建 HTML 文档\n\n![image](img/1o.jpg)\n\
  \n![image](img/htmlo.jpg)\n\n`template.html`\n\n### 在 body 部分，添加两个段落，点击时将调用脚本函数\n\
  \n```html\n<p id=\"hotel\" style=\"cursor:pointer\"\nonclick=\"addStar(this)\">米斯特酒店\
  \ (Hotel Mistrale)</p>\n```\n\n```html\n<p id=\"clear\" style=\"cursor:pointer\"\
  \nonclick=\"removeStars()\">清除</p>\n```\n\n### 接下来，添加模板内容，将脚本函数将其追加到现有内容中\n\n```html\n\
  <template>\n<img src=\"star.png\" alt=\"金星\">\n</template>\n```\n\n![image](img/pg118_2.jpg)\n\
  \nstar.png 32px x 32px（灰色区域为透明）。\n\n### 现在，添加一个脚本函数来复制模板内容并在点击时将其追加到第一个段落\n\n```html\n\
  <script>\nfunction addStar(hotel ) {\nconst temp = document.getElementById( 'star'\
  \ )\nconst copy =temp.content.cloneNode( true )\nhotel.appendChild(copy )\n}\n//\
  \ 在此处插入第二个函数。\n</script>\n```\n\n### 然后，插入一个函数，在点击第二个段落时移除第一个段落中的所有子元素\n\n```javascript\n\
  function removeStars( ) {\nconst hotel = document.getElementById( 'hotel' )\nwhile\
  \ ( hotel.ChildElementCount > 0 )\n{\nhotel.removeChild( hotel.lastChild )\n}\n\
  }\n```\n\n### 将 HTML 文档与星星图片保存在一起，然后在浏览器中打开它并点击添加/移除内容\n\n![image](img/pg119_1.jpg)\n\
  \n![image](img/pg119_2.jpg)\n\n![image](img/pg119_3.jpg)\n\n![image](img/hot.jpg)\n\
  \n在 `<template>` 标签引入 HTML 之前，脚本必须创建 HTML 子元素内容，但使用模板要方便得多。\n\n## 插入插槽 (Slots)\n\
  \n在上一个示例所示的 `<template>` 元素此处 只能追加模板元素内定义的内容。然而，通过在 `<template>` 元素中包含 HTML `<slot>\
  \ </slot>` 元素，可以使模板更加灵活，每个模板实例的内容可以不同。\n\n![image](img/pg120_1.jpg)\n\n`<slot> </slot>`\
  \ 标签可以选择包含默认文本，但起始 `<slot>` 标签必须包含一个 `name` 属性，用于将该插槽标识为模板内的占位符。\n\n`<slot>` 元素占位符通过在\
  \ HTML 元素中包含 `slot` 属性来填充内容，该属性指定与插槽匹配的 `name` 属性值。可以使用 JavaScript 将组合后的模板和插槽内容追加到网页上。\n\
  \n### 创建 HTML 文档\n\n![image](img/1o.jpg)\n\n![image](img/htmlo.jpg)\n\n`slot.html`\n\
  \n### 在 body 部分，添加两个 div，每个 div 包含三个 span，指定相同的三个插槽\n\n```html\n<div class=\"homonym\"\
  >\n<span slot=\"word\">Air (空气)</span>\n<span slot=\"def-1\">一段优扬的旋律</span>\n<span\
  \ slot=\"def-2\">我们呼吸的物质</span>\n</div>\n```\n\n```html\n<div class=\"homonym\"\
  >\n<span slot=\"word\">Current (电流)</span>\n<span slot=\"def-1\">水流</span>\n<span\
  \ slot=\"def-2\">最新的</span>\n</div>\n```\n\n### 接下来，添加一个描述列表模板，其术语和描述提供了上述指定的插槽\n\
  \n```html\n<template id=\"list-template\">\n<dl>\n<dt><slot name=\"word\">术语</slot>\n\
  <dd><slot name=\"def-1\">第一个定义</slot>\n<dd><slot name=\"def-2\">第二个定义</slot>\n</dl>\n\
  <style>\ndl { width :250px ; border :1px solid ; }\ndt { background :Orange ; color\
  \ :White ; }\n</style>\n</template>\n```\n\n![image](img/snake.jpg)\n\n样式表必须包含在模板中，否则其规则将无法应用于模板元素。\n\
  \n### 现在，添加一个脚本在页面加载时将列表模板与指定插槽的文本内容结合\n\n```html\n<script>\n( function ( ) {\n\
  const homs =\ndocument.getElementsByClassName( 'homonym' )\nconst temp = document.getElementById(\
  \ 'list-template' )\nif( 'attachShadow' in homs[ 0 ] )\n{\nlet i, copy, shadow\n\
  for( i = 0 ; i < homs.length ; i++ )\n{\ncopy = temp.content.cloneNode( true )\n\
  shadow = homs[ i ].attachShadow( { mode: 'closed' } )\nshadow.appendChild( copy\
  \ )\n}\n}\n} ) ()\n</script>\n```\n\n### 保存 HTML 文档，然后在浏览器中打开它查看组合后的模板和插槽内容\n\n\
  ![image](img/pg121_1.jpg)\n\n![image](img/hot.jpg)\n\n严格来说，这个示例创建了 Shadow DOM，通过\
  \ `shadowRoot` 属性访问 HTML 元素。\n\n![image](img/forget.jpg)\n\n`slot` 属性只能出现在这些 HTML\
  \ 标签中：\n\n- `<article>`\n- `<aside>`\n- `<blockquote>`\n- `<body>`\n- `<div>`\n\
  - `<footer>`\n- `<header>`\n- `<h1>`\n- `<main>`\n- `<nav>`\n- `<p>`\n- `<section>`\n\
  - `<span>`\n- `<ul>`\n\n## 使用对话框\n\n你可以创建一个模态对话框，用户必须对其做出响应。模态对话框出现在所有其他页面内容之上，并包含各种类型的内容（文本、图像等）。\n\
  \n![image](img/pg122_1.jpg)\n\n模态对话框通常通过包含 `<button>` 元素来提供关闭对话框的方式`<button>` 和\
  \ `</button>` 标签之间的文本将作为按钮的标签。起始 `<button>` 标签可以包含 `onclick` 属性在点击按钮时调用脚本函数。或者，脚本可以动态地添加“事件监听器”来识别用户点击了按钮——创建一个“点击事件”。\n\
  \n### 创建 HTML 文档\n\n![image](img/1o.jpg)\n\n![image](img/htmlo.jpg)\n\n`dialog.html`\n\
  \n### 在 body 部分，添加一个按钮和一个空段落，它们都有唯一的 `id` 用于脚本处理\n\n```html\n<button id=\"show\"\
  >显示对话框</button>\n<p id=\"info\"></p>\n```\n\n### 接下来，添加一个包含文本、图像和两个按钮的对话框，它们都有唯一的\
  \ `id` 用于脚本处理\n\n```html\n<dialog id=\"dlog\">\n您的选择\n<img src=\"dialog-qmark.svg\"\
  \nheight=\"64\" width=\"64\" alt=\"问号\">\n<br>\n<button id=\"cncl\">取消</button>\n\
  <button id=\"conf\">确认</button>\n</dialog>\n```\n\n![image](img/svgo.jpg)\n\n`dialog-qmark.svg`\n\
  \n### 现在，添加一个脚本为每个按钮添加事件监听器和事件处理函数\n\n```html\n<script>\n( function ( ) {\nconst\
  \ dlog = document.getElementById( 'dlog' )\nconst info = document.getElementById(\
  \ 'info' )\nconst show = document.getElementById( 'show' )\nconst cncl = document.getElementById(\
  \ 'cncl' )\nconst conf = document.getElementById( 'conf' )\n\nshow.addEventListener(\
  \ 'click', function ( ) {\ndlog.showModal( )\ninfo.innerText = '对话框已打开' } )\n\n\
  cncl.addEventListener( 'click', function ( ) {\ndlog.close( )\ninfo.innerText =\
  \ '对话框已取消' } )\n\nconf.addEventListener( 'click', function ( ) {\ndlog.close( )\n\
  info.innerText = '对话框已确认' } )\n\n} ) ()\n</script>\n```\n\n\n\n![image](img/5o.jpg)保存\
  \ HTML 文档，然后在浏览器中打开并点击按钮以查看模态对话框\n\n![image](img/pg123_1.jpg)\n\n![image](img/pg123_2.jpg)\n\
  \n![image](img/pg123_3.jpg)\n\n![image](img/hot.jpg)\n\n尽管`onclick`和`addEventListener`技术都是正确的，但优先使用事件监听器有优势。它清晰地将脚本与\
  \ HTML 代码分离，并且与`onclick`不同，它允许为同一事件添加多个监听器。\n\n![image](img/snake.jpg)\n\n在 Firefox\
  \ 中，你可能需要打开`about:config`并将`dom.dialog_element`设置为`enabled`才能看到模态对话框。\n\n## 绘制画布\n\
  \n`<canvas>` `</canvas>`标签在页面上创建一个位图画布区域，JavaScript 可以在其中绘制形状、文本和图像。默认情况下，画布区域宽\
  \ 300 像素，高 150 像素，但可以通过`<canvas>`元素的`width`和`height`属性指定其他尺寸。可选地，可以在`<canvas>` `</canvas>`标签之间包含后备文本，这些文本仅在不支持画布区域的浏览器中显示。\n\
  \n![image](img/pg124_1.jpg)\n\n要使用画布，脚本必须首先创建一个`CanvasRenderingContext2D`对象。这个名称简洁的上下文对象提供了在画布区域绘制形状和文本所需的所有方法和属性。上下文对象是通过画布本身的`getContext()`方法创建的。例如，对于一个`id`为“canvas”的`<canvas>`元素，如下所示：\n\
  \n```javascript\nconst ctx = document.getElementById( ‘canvas’ ).getContext( ‘2d’\
  \ )\n```\n\n然后可以为上下文对象的许多属性赋值，并调用其许多方法在画布上绘制，例如下面列出的这些基本属性和方法：\n\n| 属性 | 设置 |\n\
  | :--- | :--- |\n| `fillStyle` | 填充颜色（默认黑色） |\n| `strokeStyle` | 描边颜色（默认黑色） |\n\
  | `lineWidth` | 描边宽度（默认 1） |\n| `font` | 字体大小和样式（默认 10px sans-serif） |\n\n| 方法 |\
  \ 绘制 |\n| :--- | :--- |\n| `fillRect()` | 填充矩形 |\n| `strokeRect()` | 未填充矩形 |\n|\
  \ `fillText()` | 填充文本 |\n| `strokeText()` | 未填充文本 |\n\n画布可以通过脚本频繁重绘以创建动画，也可以用于创建交互式游戏。事实上，画布提供的可能性几乎是无限的，因此对画布元素的全面探索可以写成另一本书。下面列出的示例仅使用上表中的基本属性和方法对画布元素进行了简要介绍。\n\
  \n![images](img/hot.jpg)\n\n你可以在 HTML Living Standard 规范中在线了解更多关于画布元素的属性和方法，网址为**[html.spec.whatwg.org/multipage/canvas.html](http://html.spec.whatwg.org/multipage/canvas.html)**。\n\
  \n![image](img/1o.jpg)创建一个包含画布元素的 HTML 文档\n\n```html\n<canvas id=”canvas” width=”500”\
  \ height=”150”>\n[Fallback Text]</canvas>\n```\n\n![images](img/htmlo.jpg)\n\ncanavas.html\n\
  \n![image](img/2o.jpg)添加一个包含自调用函数的脚本，该函数首先初始化一个上下文对象并设置两个属性\n\n```html\n<script>\n\
  ( function ( ) {\nconst ctx = document.getElementById( ‘canvas’ ).getContext( ‘2d’\
  \ )\nctx.lineWidth = 2;\nctx.font = ‘5em Fantasy’\n// Statements to be inserted\
  \ here.\n} ) ( )()\n</script>\n```\n\n![image](img/3o.jpg)接下来，插入语句以填充和描边整个画布\n\n\
  ```javascript\nctx.fillStyle = ‘Bisque’\nctx.fillRect( 0, 0, 500, 150 )\nctx.strokeStyle\
  \ = ‘Red’\nctx.strokeRect( 0, 0, 500, 150 )\n```\n\n![image](img/4o.jpg)现在，插入语句以填充和描边一些文本\n\
  \n```javascript\nctx.fillStyle = ‘Orange’\nctx.fillText( ‘HTML Canvas’, 30, 100\
  \ )\nctx.strokeStyle = ‘Black’\nctx.strokeText( ‘HTML Canvas’, 30, 100 )\n```\n\n\
  ![images](img/hot.jpg)\n\n这些参数指定矩形左上角的 X、Y 坐标，后跟宽度和高度尺寸。这些参数指定文本以及文本左上角的 X、Y 坐标。\n\
  \n![image](img/5o.jpg)保存 HTML 文档，然后在浏览器中打开，查看绘制在画布上的填充和描边\n\n![images](img/pg125_2.jpg)\n\
  \n## 总结\n\n- `<img>`标签在网页上放置图像，最好始终包含`src`、`width`、`height`和`alt`属性。\n- `<map>`\
  \ `</map>`标签包围`<area>`元素，用于定义图像映射的区域，并且必须包含`name`属性。\n- `<figure>`和`<figcaption>`标签可用于嵌入带标题的引用。\n\
  - `<picture>`元素可以包含针对不同屏幕尺寸的`<source>`标签。\n- `<object>` `</object>`标签可以嵌入外部资源。\n\
  - `<iframe>`元素可用于嵌入框架。\n- `<audio>` `</audio>`标签用于媒体播放，`<video>` `</video>`标签用于视频内容。\n\
  - `<track>`元素可以提供字幕或说明。\n- `<progress>`元素可以提供视觉指示器。\n- `<template>`元素可以指定一组元素。\n\
  - `<slot>` `</slot>`标签在每个实例中有所不同。\n- `<dialog>` `</dialog>`标签创建模态对话框。\n- `<button>`\
  \ `</button>`标签创建可点击的按钮。\n\n\n\n\n\n![image](img/9bl.jpg)现在，在浏览器的地址栏中输入 `localhost`，然后按\
  \ `Return` 键看到默认的索引网页出现。\n\n![image](img/pg129_4.jpg)\n\n![image](img/hot.jpg)\n\
  \n如果你的系统资源有限，你可能更喜欢在需要时手动启动 Web 服务器。\n\n![image](img/hot.jpg)\n\n默认页面是一个名为 `index.html`\
  \ 的文件，位于你安装 Abyss 目录下名为 `htdocs` 的文件夹中。该文件夹就是你在开发期间放置网页文件的地方。\n\n## 安装 Python\n\n\
  Web 服务器可以运行服务端脚本，以响应来自 Web 浏览器的请求。最流行的服务器端脚本语言包括 `PHP`、`ASP.NET`、`Ruby`、`Perl` 和\
  \ `Python`。\n\n![image](img/pg130_1.jpg)\n\n为了在你 PC 上安装的 Abyss Web 服务器上启用服务器端脚本功能，你必须先安装服务器端脚本语言的解释器——例如\
  \ `Python`。\n\n![image](img/1bl.jpg)启动你的浏览器并访问 [activestate.com](http://www.activestate.com)\n\
  \n![image](img/2bl.jpg)登录（或创建账户并登录），选择 `Featured Projects & Languages` 并下载适用于你系统的最新\
  \ Python 构建安装程序。\n\n![image](img/pg130_2.jpg)\n\n![image](img/3bl.jpg)运行安装程序，然后点击\
  \ `Next` 开始设置。\n\n![image](img/4bl.jpg)点击 `Next` 接受许可协议。\n\n![image](img/5bl.jpg)点击\
  \ `Next` 接受建议的安装位置和所有选项。\n\n![image](img/pg130_3.jpg)\n\n![image](img/hot.jpg)\n\
  \nPython 是免费提供的，且在 ActiveState 创建账户不需要费用。\n\n![image](img/forget.jpg)\n\n建议的安装文件夹名称可能包含版本号，但你可以将其更改为\
