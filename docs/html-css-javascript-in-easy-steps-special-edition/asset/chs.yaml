  \n## Echo 脚本\n\n为 Abyss Web 服务器配置了 `.py` 扩展后，现在可以创建一个 Python 脚本来回显请求。\n\n![image](img/hot.jpg)打开一个纯文本编辑器（如记事本），然后在文件开头输入：\n\
  \n```python\nimport cgi\n```\n\n![image](img/2bl.jpg)使用特殊模块提供的函数将所有键赋值给变量：\n\n```pythonform\
  \ = cgi.FieldStorage()\n```\n\n![image](img/3bl.jpg)使用内置的 `print()` 函数写入发送浏览器的头部。注意下方代码。Python\
  \ 使用缩进来分组语句，而不是大括号，因此这三行必须相同的缩进：\n\n```python\nfor i in form.keys():\n    key =\
  \ str( i )\n    val = str( form.getvalue( key ) )\n    print( '<tr>' + key + '<td>'\
  \ + val + '</tr>' )\n```\n\n![image](img/4bl.jpg)头部必须与内容分开，因此下方添加此行：\n\n```python\n\
  print('Content-Type:text/html; charset=utf-8')\nprint('\\r\\n\\r\\n')\n```\n\n![image](img/5bl.jpg)开始带有声明、标题和样式表编写\
  \ HTML 文档：\n\n```python\nprint('<!DOCTYPE HTML>\n<html>\n<title>Web Response</title>\n\
  <style>tr,th,td{border:2px solid Gray}</style>')\n```\n\n![image](img/6bl.jpg)接下来，开始创建一个带有表头单元格的表格：\n\
  \n```python\nprint('<table style=\"width:500px\"><tr><th>Key</th><th>Value</th></tr>')\n\
  ```\n\n![image](img/7bl.jpg)最后，添加这些行来完成表格、显示服务器图标并完成 HTML 文档：\n\n```python\nprint('</table><img\
  \ src=\"pwrabyss.gif\">\n</html>')\n```\n\n![image](img/8bl.jpg)确保你的脚本看起来如上方截图所示。\n\
  \n![image](img/9bl.jpg)将文件保存为 `echo.py` 到系统上 Abyss Web 服务器的 `htdocs` 文件夹中——在 Windows\
  \ 上这通常是 `C:\\Abyss Web Server\\htdocs`。\n\n![image](img/10bl.jpg)当 Abyss Web Server\
  \ 运行时，打开浏览器，在地址栏中输入 `localhost/echo.py` 并按 `Return`，看到脚本以一个空表格做出响应。\n\n\n\n\n\n\
  # 网页表单提交与服务器交互\n\n## echo.py 脚本\n\n`echo.py` 脚本在第 7 章中用于演示向 Abyss Web 服务器提交 HTML\
  \ 表单。\n\n### 测试环境\n\n现在，Abyss Web 服务器已安装并配置为执行 Python 脚本（参见此处），可以通过从浏览器向服务器发送数据来测试环境。\n\
  \n![图片](img/pg136_1.jpg)\n\n可以通过在 Python 脚本的 URL 后附加“查询字符串”来向服务器发送数据。查询字符串以 `?`\
  \ 问号分隔符开头，后跟一个 `key=value` 对——例如，要发送单个键值对，可使用 `http://localhost/echo.py?Forename=Mike`。\n\
  \n可以向服务器发送多个 `key=value` 对，每个键值对在查询字符串中用 `&` 符号分隔，例如 `http://localhost/echo.py?Forename=Mike&Surname=McGrath`。\n\
  \n数据可以通过直接在浏览器的地址栏中输入 URL 和查询字符串来发送，也可以通过指向该 URL 和查询字符串的超链接发送，或者通过将 `location` 设置为该\
  \ URL 和查询字符串的 JavaScript 来发送。\n\n![图片](img/1bl.jpg)创建一个 HTML 文档\n\n![图片](img/htmlbl.jpg)\n\
  \nquery-string.html\n\n![图片](img/2bl.jpg)接下来，在 body 部分添加一个超链接，用于向 Python 脚本发送数据\n\
  \n```html\n<a href=\"http://localhost/echo.py?CSS=Style\">\nStyling Web Pages</a>\n\
  ```\n\n![图片](img/3bl.jpg)现在，在 body 部分添加一个按钮\n\n```html\n<button id=\"sender\">Scripting\
  \ Web Pages</button>\n```\n\n![图片](img/4bl.jpg)最后，添加一个脚本，当用户点击按钮时向 Python 脚本发送数据\n\
  \n```javascript\n( function ( ) {\nconst sender = document.getElementById( 'sender'\
  \ )\nsender.addEventListener( 'click' , function ( ) {\nlocation='http://localhost/echo.py?JavaScript=Function'\
  \ } )\n} ) ( )\n```\n\n![图片](img/5bl.jpg)将 HTML 文档保存到服务器的 `htdocs` 文件夹中，然后在浏览器中打开它，并使用浏览器的地址栏、超链接或按钮发送数据\n\
  \n![图片](img/pg137_1.jpg)\n\n![图片](img/pg137_2.jpg)\n\n![图片](img/pg137_3.jpg)\n\n\
  ![图片](img/hot.jpg)\n\nPython 脚本按预期运行。向查询字符串中添加更多 `key=value` 对（每对用 `&` 分隔），可以看到响应中表格的行数增加。\n\
  \n## 总结\n\n- 免费的 Abyss Web Server X1 可以安装在您自己的 PC 上用于 Web 开发。\n- Abyss 可以手动启动，也可以设置为在后台自动持续运行。\n\
  - 当 Abyss 运行时，它提供一个名为 `localhost` 的域名，该域名是 IP 地址 `127.0.0.1` 的别名。\n- Web 服务器可以调用解释器来执行服务器端脚本，以响应来自\
  \ Web 浏览器的请求。\n- 最流行的服务器端脚本语言包括 PHP、ASP.NET、Ruby、Perl 和 Python。\n- 安装 Python 后，您可以通过\
  \ Python 控制台直接与其解释器（`python.exe`）交互。\n- 必须配置 Abyss，使其知道 Python 解释器（`python.exe`）的位置，并识别扩展名为\
  \ `.py` 的文件为 Python 脚本。\n- 需要 URL `localhost:9999` 和用户凭据才能打开 Abyss Web Server 控制台。\n\
  - CGI/ISAPI 接口允许数据在 Web 服务器和脚本解释器之间传输。\n- 系统中 Abyss Web Server 的位置包含一个 `htdocs`\
  \ 文件夹，该文件夹被 `localhost` 域名识别。\n- HTML 文档、服务器端脚本和其他资源文件应放置在 Abyss 的 `htdocs` 文件夹中。\n\
  - 可以通过在请求的 URL 后附加查询字符串来向 Web 服务器发送数据。\n- 查询字符串以 `?` 问号分隔符开头。\n- 查询字符串包含一个或多个 `key=value`\
  \ 对，每对用 `&` 符号分隔。\n- Python 服务器端脚本可以在 Web 服务器响应中回显从浏览器请求发送给它的数据。\n\n| 7 生成输入表单 |\
  \ ![图片](img/pg11_1.jpg) |\n\n***本章演示如何包含表单以向 Web 服务器提交数据。***\n\n**提交文本**\n\n**输入类型**\n\
  \n**文本区域**\n\n**复选框**\n\n**隐藏数据**\n\n**上传文件**\n\n**按钮**\n\n**图像按钮**\n\n**添加徽标**\n\
  \n**选择选项**\n\n**数据列表选项**\n\n**标签控件**\n\n**总结**\n\n## 提交文本\n\n网页表单由 HTML 元素构建，这些元素向\
  \ Web 服务器发送数据。每个元素都包含一个 name 属性和一个 value 属性，因此分配给这些属性的数据可以作为 `key=value` 对进行处理。例如，如果某个元素的\
  \ name 属性被赋值为 \"Brand\"，value 属性被赋值为 \"Ford\"，那么 `key=value` 对表示的数据就是 `Brand=Ford`。\n\
  \n![图片](img/pg140_1.jpg)\n\n表单元素包含在 `<form>` `</form>` 标签之间。每个开头的 `<form>` 标签应包含一个\
  \ method 属性，指定用于提交表单的 HTTP 方法，以及一个 action 属性，指定用于处理提交数据的服务器端脚本的 URL。\n\nmethod 属性可以赋值为\
  \ `\"GET\"` 或 `\"POST\"`。通过首选的 GET 方法提交时，数据会附加到 URL 上；而通过 POST 方法提交时，数据会以不同的方式编码，并且可以在\
  \ GET 方法失败时使用。\n\n通常，HTML 表单会有一个“提交”按钮，用户点击该按钮即可发送数据进行处理。这是通过将 `<input>` 标签的 type\
  \ 属性赋值为 `\"submit\"` 来创建的。此外，该标签还可以包含 name 和 value 属性，以提交分配给它们的 `name=value` 对数据。\n\
  \nHTML 表单可以提供文本框，用户可以在其中输入数据以供提交。这是通过将 `<input>` 标签的 type 属性赋值为 `\"text\"`，并将其 name\
  \ 属性赋值为一个名称来创建的。文本框中的数据作为与该文本框名称关联的值，以 `key=value` 对的形式发送。可选地，`<input>` 标签可以包含一个\
  \ value 属性来指定默认值。用于输入密码的文本框是通过将 `<input>` 标签的 type 属性赋值为 `\"password\"` 来创建的。它的功能与其他文本框类似，但不会以可读文本的形式显示其内容。文本和密码\
  \ `<input>` 元素都可以选择包含以下其他属性：\n\n- `size` – 文本框的宽度，以平均字符宽度为单位。\n- `minlength` 和 `maxlength`\
  \ – 允许的字符数。\n- `min` 和 `max` – 允许的数值范围。\n- `placeholder` – 向用户提供数据输入提示。\n- `readonly`\
  \ – 文本框中的默认值无法更改。\n- `disabled` – 文本框变灰，且不会被提交。\n\n![图片](img/forget.jpg)\n\n通过 GET\
  \ 方法发送的数据会作为查询字符串附加到请求中，因此在 Web 服务器的响应中，可能会在浏览器的地址栏中可见。对于敏感数据，您可以通过 POST 方法提交以防止这种情况。\n\
  \n![图片](img/1v.jpg)创建一个包含表单的 HTML 文档，使用 GET 方法向服务器端脚本发送数据\n\n```html\n<form method=\"\
  GET\" action=\"http://localhost/echo.py\" >\n<!-- 表单组件将放在这里。 -->\n</form>\n```\n\
  \n![图片](img/htmlv.jpg)\n\ntextbox.html\n\n![图片](img/2v.jpg)现在，在表单元素中插入文本输入框和一个提交按钮——按钮上会显示其\
  \ value 值\n\n```html\n<dl>\n<dt>用户名：\n<dd><input type=\"text\" name=\"Name\">\n\
  <dt>密码：\n<dd><input type=\"password\" name=\"Pwd\">\n<dt>邮政编码：\n<dd><input type=\"\
  text\" name=\"Zip\"\nsize=\"5\" maxlength=\"5\">\n</dl>\n<input type=\"submit\"\
  \ name=\"Form\" value=\"发送\">\n```\n\n\n\n\n\n![image](img/3v.jpg) 将 HTML 文档保存到\
  \ Abyss 的 htdocs 文件夹中，然后在浏览器中打开并提交一些数据。\n\n![image](img/pg141_1.jpg)\n\n![image](img/forget.jpg)\n\
  \n本章中的示例将表单数据发送到此处创建的服务器端脚本。\n\n![image](img/snake.jpg)\n\n请注意，响应中的数据顺序不一定与表单输入元素的顺序相同。\n\
  \n## 输入类型\n\nHTML 表单的 `<input>` 标签可以通过包含 `required` 关键字来强制要求填写。它还可以通过 `type` 属性分配的值来控制用户允许提交的内容。下表中列出的许多输入类型，如果用户输入了不允许的值，会阻止表单提交并发出错误提示。有些还提供了特殊控件，使用户能够轻松选择允许的值。\n\
  \n![image](img/pg142_1.jpg)\n\n| 类型 | 允许的输入 |\n|------|------------|\n| text | 文本字符串\
  \ |\n| password | 文本字符串（由浏览器隐藏） |\n| url | 有效的 URL 协议和域名地址 |\n| email | 有效的电子邮件地址\
  \ |\n| date | 日期，格式为 mm/dd/yyyy |\n| month | 月份和年份 |\n| week | 周数和年份 |\n| time |\
  \ 时间，格式为 HH:MM |\n| datetime-local | 日期和时间，格式为 mm-dd-yy HH:MM |\n| number | 数值整数\
  \ |\n| range | 数值整数（滑块） |\n| color | 颜色，格式为 #RRGGBB 十六进制 |\n| file | 文件路径地址（浏览）\
  \ |\n\n### 创建一个包含带提交按钮的表单的 HTML 文档\n\n![image](img/1v.jpg)\n\n```\n<form method=\"\
  GET\" action=\"http://localhost/echo.py\" >\n<!-- 此处放置输入元素。 -->\n<p><input type=\"\
  submit\" value=\"提交表单\"></p>\n</form>\n```\n\n![image](img/htmlv.jpg)\n\n`input-types.html`\n\
  \n### 现在，在表单中插入四个控制输入元素\n\n![image](img/2v.jpg)\n\n```\n颜色：<input type=\"color\"\
  \ name=\"color\">\n范围：\n<input type=\"range\" name=\"range\" min=\"1\" max=\"10\"\
  >\n时间：<input type=\"time\" name=\"time\"> <br>\nURL：\n<input type=\"url\" name=\"\
  url\" size=\"54\" required >\n```\n\n### 将 HTML 文档保存到 Abyss 的 htdocs 文件夹中，然后尝试提交表单，观察其失败\n\
  \n![image](img/3v.jpg)\n\n![image](img/pg143_1.jpg)\n\n### 在 url 类型输入字段中输入一个有效的\
  \ URL\n\n![image](img/4v.jpg)\n\n### 现在，使用其他输入的特殊控件输入允许的值，然后成功提交表单\n\n![image](img/5v.jpg)\n\
  \n![image](img/pg143_2.jpg)\n\n![image](img/hot.jpg)\n\n请注意，特殊字符在查询字符串中被转换为百分比 Unicode\
  \ 值。这里的 **#** 符号被转换为其 Unicode 值 **%23**。\n\n## 文本区域\n\nHTML 表单可以提供一个多行文本字段，用户可以在其中输入数据以提交给\
  \ Web 服务器进行处理。这些字段由 `<textarea>` `</textarea>` 标签创建，这些标签可以包含默认文本内容。\n\n![image](img/pg140_1.jpg)\n\
  \n`<textarea>` 标签应包含一个 `name` 属性，该属性将在提交时与元素的内容关联为键值对。此外，该标签必须包含 `rows` 属性，用于指定可见文本行数，以及\
  \ `cols` 属性，用于指定字段宽度（以平均字符宽度为单位）。可选地，它还可以包含 `readonly` 属性，以防止用户编辑其内容。\n\n在提交大量文本时，必须注意\
  \ GET 方法的一些限制。这因浏览器而异，但可能只允许 URL 附加大约 200 个字符。POST 方法提供了更大的容量，因为文本作为“表单数据”与 HTTP\
  \ 标头一起发送，而不仅仅是附加到 URL：\n\n### 创建一个包含表单元素的 HTML 文档，该表单元素包含一个提交按钮，用于通过 POST 方法发送表单数据\n\
  \n![image](img/1v.jpg)\n\n```\n<form method=\"POST\" action=\"http://localhost/echo.py\"\
  \ >\n<!-- 此处放置文本区域元素。 -->\n<p><input type=\"submit\" value=\"提交表单\"></p>\n</form>\n\
  ```\n\n![image](img/htmlv.jpg)\n\n`textarea.html`\n\n### 现在，在表单元素中插入一个文本输入区域，该区域有\
  \ 10 行，宽度为 65 个平均字符宽度\n\n![image](img/2v.jpg)\n\n```\n<textarea name=\"未来网络\"\n\
  rows=\"8\" cols=\"70\">\n</textarea>\n```\n\n### 将 HTML 文档保存到 Abyss 的 htdocs 文件夹中，然后在浏览器中打开网页，输入一些数据并提交表单\n\
  \n![image](img/3v.jpg)\n\n![image](img/forget.jpg)\n\n与文本 **<input>** 元素不同，**<textarea>**\
  \ 元素没有 **value** 属性——因为其内容被视为其值。\n\n![image](img/pg145_1.jpg)\n\n![image](img/4v.jpg)文本不会附加到\
  \ URL，因此请检查响应标头，查看它已作为“表单数据”发送\n\n![image](img/pg145_2.jpg)\n\n![image](img/snake.jpg)\n\
  \n平均字符宽度可能因浏览器而异——因此文本区域字段的物理大小也可能不同。\n\n![image](img/hot.jpg)\n\n您可以使用 Google Chrome\
  \ 浏览器中的开发者工具检查响应标头。按 **F12**，然后选择 **网络** 选项卡，并在左侧窗格中选择 `echo.py` 项。\n\n## 复选框\n\n\
  HTML 表单可以提供一个可视化的复选框“开/关”开关，用户可以切换它以包含或排除其关联数据以提交给服务器。当复选框被选中时，开关设置为“开”，其键值对将被提交。\n\
  \n![image](img/pg146_1.jpg)\n\n复选框是通过将 `type` 属性赋值为“checkbox”来创建的 `<input>` 标签。该标签还必须包含\
  \ `name` 属性和 `value` 属性，以指定键值对的值。可选地，该标签还可以包含布尔类型的 `checked` 属性，以将开关的初始状态设置为“开”——这样复选框中将自动出现一个勾选标记。复选框的名称可以是各自唯一的，或者多个复选框可以共享一个共同的名称，以允许用户为同一命名属性选择多个值。在这种情况下，选中的值由服务器以逗号分隔的列表形式返回，格式为\
  \ key=value,value,value。\n\n“单选按钮”与复选框类似，但它是通过将 `type` 属性赋值为“radio”来创建的 `<input>`\
  \ 标签。与复选框不同，共享相同名称的单选按钮是互斥的，因此当选择一个单选按钮时，该组中的所有其他单选按钮将自动关闭。\n\n多个复选框和单选按钮可以通过将其\
  \ `<input>` 元素包裹在 `<fieldset>` `</fieldset>` 标签中进行视觉分组。这些标签还可以包含 `<legend>` `</legend>`\
  \ 标签来声明一个共同的组名：\n\n### 创建一个包含带提交按钮的表单元素的 HTML 文档\n\n![image](img/1v.jpg)\n\n```\n\
  <form method=\"GET\" action=\"http://localhost/echo.py\" >\n<!-- 此处放置复选框和单选按钮。 -->\n\
  <p><input type=\"submit\"></p>\n</form>\n```\n\n![image](img/htmlv.jpg)\n\n`checkbox.html`\n\
  \n### 现在，在表单元素中插入一个包含两个复选框的段落\n\n![image](img/2v.jpg)\n\n```\n<p>发送详细信息\n<input\
  \ type=\"checkbox\" name=\"发送\" value=\"详细信息\">\n发送价格\n<input type=\"checkbox\"\
  \ name=\"发送\" value=\"价格\">\n</p>\n```\n\n![image](img/hot.jpg)\n\n**checked** 属性不需要赋值——它的存在将开关设置为“开”，它的缺失则使开关保持“关”状态。\n\
  \n### 接下来，在表单元素中插入一个带有图例的字段集\n\n![image](img/3v.jpg)\n\n```\n<fieldset>\n<legend>HTML\
  \ 是一种什么类型的语言？</legend>\n<!-- 此处放置单选按钮。 -->\n</fieldset>\n```\n\n### 然后，在字段集中插入单选按钮，并选中其中一个\n\
  \n![image](img/4v.jpg)\n\n```\n脚本语言 <input type=\"radio\"\nname=\"定义\" value=\"\
  脚本语言\"> <br>\n标记语言 <input type=\"radio\"\nname=\"定义\" value=\"标记语言\"> <br>\n编程语言\
  \ <input type=\"radio\"\nname=\"定义\" value=\"编程语言\" checked>\n```\n\n### 将 HTML\
  \ 文档保存到 Abyss 的 htdocs 文件夹中，然后打开网页，勾选两个复选框，选择正确的单选按钮答案，并提交表单\n\n![image](img/5v.jpg)\n\
  \n\n\n\n\n![image](img/pg147_1.jpg)\n\n![image](img/snake.jpg)\n\n`<fieldset>` 元素仅在视觉上将它包含的相关元素进行分组——它并不会程序上将它们关联起来。\n\
  \n![image](img/forget.jpg)\n\n勾选一个复选框并提交表单，查看只有该复选框的名称和值被发送到服务器。\n\n## 隐藏数据\n\n\
  HTML 表单可以提供隐藏元素，这些元素不会创建可见控件，但允许将额外数据提交到服务器。隐藏表单数据通过为 `<input>` 标签的 `type` 属性赋值“hidden”来创建。该标签必须包含一个\
  \ `name` 属性，并可以包含 `value` 属性以指定将作为 `name=value` 对提交的静态数据。可选地，`<input>` 标签可以包含 `id`\
  \ 属性并省略 `value` 属性，以便可以使用脚本指定其值。\n\n![image](img/pg148_1.jpg)\n\n隐藏表单数据还可以用于执行计算并在\
  \ `<output> </output>` 元素中动态显示结果。`<output>` 标签必须包含一个 `id` 属性和一个用于脚本引用的 `for` 属性。`for`\
  \ 属性可以以空格分隔列表的形式指定多个元素标识。这些可以被赋值给 `<form>` 标签的 `oninput` 属性，以执行计算，其结果将出现在 `<output>\
  \ </output>` 元素中——但不会提交到服务器：\n\n![image](img/1v.jpg)创建一个包含图像的 HTML 文档，显示销售价格详情的物品\n\
  \n```html\n<img src=”hidden-sale.png” width=”200” height=”120” alt=”Sale\">>\n```\n\
  \n![image](img/htmlv.jpg)\n\nhidden.html\n\n![image](img/2v.jpg)接下来，插入一个表单元素\n\n\
  ```html\n<form method=”GET” action=”http://localhost/echo.py” >\n  <!-- 此处放置隐藏数据、输入和输出\
  \ -->\n  <input type=”submit” name=”Offer” value=”Buy Teddy Bears\">>\n</form>\n\
  ```\n\n![image](img/3v.jpg)在表单元素中，插入一个用于用户输入的可见输入元素\n\n```html\nQty (60 Available)\
  \ <input type=”number” id=”qty” name=”Quantity” min=”1” max=”60\">>\n```\n\n![image](img/4v.jpg)现在，在表单元素中插入一个用于隐藏数据的不可见元素和一个用于显示计算结果元素\n\
  \n```html\n<input type=”hidden” id=”price” name=”Unit Price” value=”24.99\">>\n\
  <output name=”sum” for=”qty price”></output> <br>\n```\n\n![image](img/hot.jpg)\n\
  \n隐藏数据元素可以用于在跨网站时维护用户数据——在第一页输入的用户名可以在任何其他页面被召回。\n\n![image](img/5v.jpg)然后，在 `<form>`\
  \ 标签中插入另一个属性\n\n```html\noninput=”sum.value=multiply( qty, price )”\n```\n\n![image](img/6v.jpg)添加一个脚本来执行计算\n\
  \n```javascript\n<script>\nfunction multiply(q,p ) {\n  let result=parseFloat(q.value\
  \ ) * parseFloat(p.value )\n  if ( isNaN( result ) || result < 1 ) return ‘ ‘\n\
  \  else return ‘Total: $’ + result.toFixed( 2 )\n}\n</script>\n```\n\n![image](img/7v.jpg)将\
  \ HTML 文档保存在 Abyss 的 htdocs 文件夹中，然后在浏览器中打开网页，输入数据并提交表单\n\n![image](img/pg149_1.jpg)\n\
  \n![image](img/snake.jpg)\n\nJavaScript 对大小写敏感，因此在复制脚本示例时必须使用正确的大小写。\n\n![image](img/forget.jpg)\n\
  \n隐藏表单 `<input>` 数据会被提交到服务器，但 `<output>` 元素仅显示结果。\n\n## 上传文件\n\nHTML 表单可以提供文件选择功能，它会调用操作系统的“选择文件”对话框，允许用户浏览其本地文件系统并选择文件。\n\
  \n![image](img/pg150_1.jpg)\n\n通过为 `<input>` 标签的 `type` 属性赋值“file”并为其 `name` 属性赋值\
  \ `name` 来创建文件选择功能。该元素产生一个文本字段和一个“浏览”按钮，用于启动选择文件对话框。选择文件后，其完整路径将显示在文本字段中。提交表单时，元素名称和所选的文件名将作为\
  \ `name=value` 对发送到 Web 服务器。\n\n如果需要将选的文件上传到 Web 服务器，`<form>` 标签必须包含一个 `enctype`\
  \ 属性，指定编码类型为“multipart/form-data”。此外，它的 `method` 属性必须指定 `POST` 方法——因为表单数据无法使用 `GET`\
  \ 方法附加到 URL 中：\n\n![image](img/1v.jpg)创建一个 HTML 文档，包含一个带有提交按钮的表单元素，通过 POST 方法发送表单数据并指定表单数据的编码类型\n\
  \n```html\n<form method=”POST” action=”http://localhost/upload.py” enctype=”multipart/form-data”\
  \ >\n  <!-- 此处放置文件输入元素 -->\n  <input type=”submit\">>\n</form>\n```\n\n![image](img/htmlv.jpg)\n\
  \nupload.html\n\n![image](img/2v.jpg)在表单元素中，插入一个文件元素和一个换行符\n\n```html\n<input type=”file”\
  \ name=”Upload” size=”70” > <br>\n```\n\n![image](img/3v.jpg)将 HTML 文档保存在 Abyss\
  \ htdocs 文件夹中，然后在浏览器中打开网页，选择文件并提交表单\n\n![image](img/4v.jpg)\n\n![image](img/pg151.jpg)\n\
  \n![image](img/5v.jpg)\n\n## 按钮\n\nHTML 表单可以提供用于脚本目的按钮。当用户点击按钮时，会发生脚本可以响应的“click”事件。这允许用户与表单交互并设置值。赋值给按钮属性的文本将显示在按钮上。\n\
  \n此外，通过为 `<input>` 标签的 `type` 属性指定 `reset` 值，可以将任何 HTML 表单恢复初始状态：\n\n```html\n<form\
  \ method=”GET” action=”http://localhost/echo.py” >\n  <!-- 此处放置 fieldset -->\n \
  \ <input type=”reset” value=”Reset Form\">>\n  <input type=”button” value=”Choose\
  \ Me” id=”btn\">>\n  <input type=”submit” value=”Submit Form\">>\n</form>\n```\n\
  \n![image](img/htmlv.jpg)\n\nbutton.html\n\n![image](img/2v.jpg)在表单元素中，插入一个包含图例和复选框组的\
  \ fieldset\n\n```html\n<fieldset>\n  <legend>Pizza Toppings</legend>\n  <input id=”pepperoni”\
  \ type=”checkbox” name=”Toppings” value=”Pepperoni\">>Pepperoni\n  <input id=”mushroom”\
  \ type=”checkbox” name=”Toppings” value=”Mushroom\">>Mushroom |\n  <input id=”bbqsauce”\
  \ type=”checkbox” name=”Toppings” value=”BBQ Sauce\">>BBQ Sauce\n</fieldset>\n```\n\
  \n![image](img/3v.jpg)添加一个为按钮关联行为的脚本\n\n```javascript\n<script>\n(function ( ) {\n\
  \  const pep = document.getElementById( ‘pepperoni ‘ )\n  const btn = document.getElementById(\
  \ ‘btn ‘ )\n  btn.addEventListener( ‘click’ , function ( ) {\n    pep.checked =\
  \ true\n  } )\n} ) ( )\n</script>\n```\n\n![image](img/4v.jpg)将 HTML 文档保存在 htdocs\
  \ 文件夹中，然后在浏览器中打开网页，并点击按钮勾选一个框\n\n\n\n\n\n![image](img/pg153_2.jpg)\n![image](img/forget.jpg)\n\
  \n在 HTML 元素中，仅存在布尔属性 `checked` 即可勾选框，但在脚本中，需要为框的 `checked` 属性赋值 `true` 值才能勾选。\n\n\
  ## 图像按钮\n\nHTML 表单可以使用图像按钮来提交表单，而不是普通的提交按钮。通过为 `<input>` 标签的 `type` 属性指定“image”值并包含\
  \ `alt` 属性即可创建图像按钮。当使用图像按钮提交表单时，点击点的 XY 坐标将作为键值对与表单其他数据一起自动提交。\n\n![image](img/pg154_1.jpg)\n\
  \n此外，还可以通过脚本绑定行为将普通的 `<img>` 标签作为图像按钮。当行为是提交表单时，脚本函数可以很有用地包含验证逻辑——例如，确保用户输入的电子邮件地址符合预期格式：\n\
  \n![image](img/1v.jpg) 创建一个 HTML 文档，其中包含一个带有文本输入字段的表单元素，这两个元素都有用于脚本编写的 id\n\n```html\n\
  <form id=”my-form” method=”GET” action=”http://localhost/echo.py” >\nPlease Supply\
  \ Your Email Address:\n<input id=”adr” name=“Address” type=“text” size=”45” <br>\n\
  <!-- Image Buttons to go here. -->\n</form>\n```\n\n![image](img/htmlv.jpg)\nibutton.html\n\
  \n![image](img/2v.jpg) 接下来在表单元素中插入一个简单提交表单的图像按钮\n\n```html\n<input type=”image”\
  \ src=”ibutton.png” alt=”Submit Button” title=”Click to submit form”>\n```\n\n![image](img/3v.jpg)\
  \ 现在在表单元素中插入一个执行验证后提交表单的图像按钮\n\n```html\n<img id=”btn” src=”ibutton.png” alt=”Submit\
  \ Button” title=”Click to submit with JavaScript validation”>\n```\n\n![image](img/forget.jpg)\n\
  \n注意，执行验证的图像按钮被赋予了一个 id，以便脚本可以为其绑定行为。\n\n![image](img/pg154_2.jpg)\n![image](img/4v.jpg)\
  \ 添加一个为图像按钮绑定行为的脚本\n\n```javascript\n<script>\n( function ( ) {\n    const btn =\
  \ document.getElementById( ‘btn’ )\n    btn .addEventListener( ‘click’ , function\
  \ ( ) {\n        const myForm = document.getElementById( ‘myForm’ )\n        const\
  \ pattern = /^([a-zA-Z0-9_.-])+@([a-zA-Z0-9_.-])+\\.([a-zA-Z])+([a-zA-Z])+/\n  \
  \      let adr = document.getElementById( ‘adr’ ).value\n        if( !pattern.test(adr\
  \ ) ) alert( ‘Invalid Email Address’ )\n        else myForm.submit( )\n    } )\n\
  } ) ( )\n</script>\n```\n\n![image](img/5v.jpg) 将 HTML 文档保存到 Abyss 的 htdocs 文件夹中，然后在浏览器中打开它，输入不完整的电子邮件地址并使用每个按钮提交表单\n\
  \n![image](img/pg155_1.jpg)\n![image](img/pg155_2.jpg)\n![image](img/6v.jpg) 当使用带有脚本行为的按钮验证失败时，修正电子邮件地址然后再次点击验证按钮以成功提交表单\n\
  \n![image](img/pg155_3.jpg)\n![image](img/snake.jpg)\n\n此示例中的脚本会将输入文本与正则表达式匹配，该模式描述了任何有效电子邮件地址的格式。模式必须单行出现——正如此处列出的所示。\n\
  \n![image](img/hot.jpg) 使用无脚本的图像按钮提交表单，以查看 Web 服务器响应中的坐标。\n\n## 添加 Logo\n\nHTML\
  \ 可以使用 `<button> </button>` 标签创建显示小“logo”图像的按钮。这些标签可以包含一个 <img>` 元素来指定 logo 图像的\
  \ URL 以及显示在按钮上的文本。\n\n![image](img/pg156_1.jpg)\n\n每个 `<button>` 标签应包含一个 `type`\
  \ 属性，以指定按钮是简单的脚本“按钮”类型、“提交”表单类型还是“重置”表单类型。脚本可以在 `<button>` 标签中包含 `onclick` 属性，以指定按钮被点击时调用的函数，或直接指定要执行的脚本片段：\n\
  \n![image](img/1v.jpg) 创建一个 HTML 文档，其中包含一个带有图例（legend）和文本输入字段的 fieldset\n\n```html\n\
  <form method=”GET” action=”http://localhost/echo.py”>\n  <fieldset>\n    <legend>Favorite\
  \ Color</legend>\n    <input type=”text” name=”Color”>\n    <!-- Logo Buttons to\
  \ go here. -->\n  </fieldset>\n</form>\n```\n\n![image](img/htmlv.jpg)\nlogo.html\n\
  \n![image](img/2v.jpg) 在 fieldset 中插入一个脚本 logo 按钮，指定在该按钮被点击时执行的脚本片段\n\n```html\n\
  <button type=”button” onclick=”alert(‘...’)\">>\n```\n\n![image](img/3v.jpg) 现在在表单元素内部插入一个图像元素和显示在按钮上的文本\n\
  \n```html\n<button type=”submit”>\n  <img src=\"...\" >\n</button>\n```\n\n![image](img/4v.jpg)\
  \ 最后，添加一个按钮元素来重置表单\n\n```html\n<button type=”reset”>\n```\n\n\n\n\n\n![image](img/4v.jpg)将\
  \ HTML 文档保存到 Abyss 的 htdocs 文件夹中，然后在浏览器中打开它。\n\n![image](img/5v.jpg)打开下拉列表并提交表单，查看默认选项值被提交。\n\
  \n![image](img/pg159_1.jpg)\n\n![image](img/hot.jpg)\n\n始终包含 `selected` 属性以自动选择每个列表中的一个选项\
  \ – 以提供默认选择。\n\n## Datalist 选项 (Datal Options)\n\n可以使用 `<datalist> </datalist>`\
  \ 元素封装一组预定义的 `<option>` 值，为文本 `<input>` 提供简单的“自动完成”功能。用户可以选择选项中的任何一个，也可以直接在输入字段中输入文本。为了将\
  \ `<input>` 字段与列表关联，`<datalist>` 标签必须包含 `id` 属性以指定列表名称。然后必须在`<input>` 标签的 `list`\
  \ 属性中指定相同的名称以创建关联。`<input>` 标签还必须包含 `name` 属性，以便像往常一样发送到服务器。\n\n![image](img/pg160_1.jpg)\n\
  \n![image](img/1v.jpg)创建一个包含提交按钮的表单元素的 HTML 文档。\n\n```html\n<form method=\"GET\"\
  \ action=\"http://localhost/echo.py\">\n  <!-- 此处放置表单数据列表和输入字段 -->\n  <p><input\
  \ type=\"submit\" value=\"Submit Form\"></p>\n</form>\n```\n\n![image](img/htmlv.jpg)\n\
  \ndatalist.html\n\n![image](img/2v.jpg)接下来，插入一个带有指定 `id` 名称的预定义选项数据列表。\n\n```html\n\
  <datalist id=\"browsers\">\n  <option value=\"Google Chrome\">\n  <option value=\"\
  Firefox\">\n  <option value=\"Internet Explorer\">\n  <option value=\"Opera\">\n\
  \  <option value=\"Safari\">\n  <option value=\"Microsoft Edge\">\n</datalist>\n\
  ```\n\n![image](img/3v.jpg)现在，插入一个包含文本的标签和一个与上述数据列表关联的输入字段。\n\n```html\n<label>\n\
  \  从此列表中选择您的浏览器：\n  <input list=\"browsers\" name=\"myBrowser\">\n</label>\n```\n\
  \n![image](img/4v.jpg)将 HTML 文档保存到 Abyss 的 htdocs 文件夹中，然后在浏览器中打开网页。\n\n![image](img/forget.jpg)\n\
  \n提交到服务器的键值值对是指定的列表名称以及从选项中选择或用户直接输入的输入。\n\n![image](img/5v.jpg)选择输入字段，查看预定义选项在下拉列表中出现。\n\
  \n![image](img/pg161_1.jpg)\n\n![image](img/6v.jpg)从下拉列表中选择任何选项，或在输入字段中输入您自己的文本创建一个值。\n\
  \n![image](img/7v.jpg)提交表单以将输入字段名称和您选择的值发送到服务器。\n\n![image](img/pg161_2.jpg)\n\n\
  ![image](img/hot.jpg)\n\n您可能需要双击输入字段以覆盖浏览器自带的自动完成建议。\n\n## 标签控件 (Label Controls)\n\
  \n与 HTML 表单控件关联的文本可以封装在 `<label> </label>` 标签之间。起始 `<label>` 标签可以包含 `for` 属性，以指定分配给控件\
  \ `id` 属性的值以建立关联。\n\n![image](img/pg162_1.jpg)\n\n或者，`<label>` 元素可以简单地封装文本和控件元素来实现关联。这允许将样式应用于整个标签\
  \ – 包括文本和控件。这对于区分与特定文本关联的控件通常有用。\n\n此外，每个表单控件元素可以包含一个 `tabindex` 属性，以将其在文档中的制表顺序指定为\
  \ 0 到 32,767 之间的唯一值。使用 tab 键，用户可以从最低的 `tabindex` 值开始导航文档，并向后续更高的值进行：\n\n![image](img/1v.jpg)创建一个包含带有图例（legend）的字段集（fieldset）的表单元素的\
  \ HTML 文档。\n\n```html\n<form method=\"GET\" action=\"http://localhost/echo.py\"\
  >\n  <fieldset>\n    <legend>Toolbox</legend>\n    <!-- 此处放置表单控件 -->\n  </fieldset>\n\
  </form>\n```\n\n![image](img/htmlv.jpg)\n\nlabel.html\n\n![image](img/2v.jpg)现在，在字段集中，插入每个包含文本的标签和一个带有指定制表顺序的复选框。\n\
  \n```html\n<label>Hammer\n  <input type=\"checkbox\" name=\"Toolbox\" value=\"Hammer\"\
  \ tabindex=\"2\" checked>\n</label>\n<label>Screwdriver\n  <input type=\"checkbox\"\
  \ name=\"Toolbox\" value=\"Screwdriver\" tabindex=\"3\">\n</label>\n<label>Wrench\n\
  \  <input type=\"checkbox\" name=\"Toolbox\" value=\"Wrench\" tabindex=\"4\" checked>\n\
  </label>\n<label>Drill\n  <input type=\"checkbox\" name=\"Toolbox\" value=\"Drill\"\
  \ tabindex=\"5\">\n</label>\n<label>Saw\n  <input type=\"checkbox\" name=\"Toolbox\"\
  \ value=\"Saw\" tabindex=\"6\" checked>\n</label>\n```\n\n![image](img/3v.jpg)接下来，插入一个带有图片的提交按钮\
  \ –\n\n```html\n<button type=\"submit\" tabindex=\"1\">\n  <img src=\"tools.png\"\
  \ alt=\"Tools\">Submit\n</button>\n```\n\n![image](img/hot.jpg)\n\n表单“控件”可以是任何 `<input>`,\
  \ `<button>` 或 `<textarea>`。\n\n![image](img/4v.jpg)将 HTML 文档保存到 Abyss htdocs 文件夹中，然后在浏览器中打开网页。\n\
  \n![image](img/pg163_1.jpg)\n\n![image](img/5v.jpg)编辑 HTML 文档以添加样式\n\n```css\n<style>\n\
  \  .hilite {\n    background: red;\n    color: white;\n  }\n</style>\n```\n\n![image](img/6v.jpg)为每个标签添加类\n\
  \n![image](img/7v.jpg)使用 tab 键在控件间移动，提交表单。\n\n![image](img/pg163_2.jpg)\n\n## 总结\
  \ (Summary)\n\n- HTML 表单以键值对的形式提交数据。\n- 所有表单控件元素都封装在 `<form> </form>` 标签之间，标签必须包含\
  \ `action` 属性以指定脚本 URL，以及 `method` 属性以指定提交方法。\n- 每个 `<input>` 标签的 `type` 属性指定其组件类型，例如“text”、“password”、“checkbox”、“radio”等。\n\
  - `<input>` 标签可以包含 `name` 和 `value` 属性以指定用于提交的数据。\n- `<input>` 标签可以通过包含 `required`\
  \ 关键字来强制其完成，但许多浏览器在用户输入不允许的值时阻止提交。\n- 多行文本字段由 `<textarea> </textarea>` 标签创建，它需要\
  \ `rows` 和 `cols` 属性来指定其大小。\n- 单选按钮和复选框在被选中时才会提交它们的 `name` 和 `value` 属性数据。\n- 表单可以包含隐藏输入元素，允许将静态或脚本的数据提交到服务器。\n\
  - 当表单用于上传文件时，`<form>` 标签必须包含 `enctype` 属性指定编码为“multipart/form-data”。\n- 表单可以通过普通的提交\
  \ `<input>` 元素、图像 `<input>` 元素或 `<button>` 元素进行提交。\n- 可以通过在 `<button> </button>`\
  \ 标签之间封装 `<img>` 元素为按钮添加标志图片。\n- 选项列表通过在 `<select> </select>` 标签之间封装多个 `<option>`\
  \ 元素创建。\n- 选项列表可以封装在 `<optgroup> </optgroup>` 标签之间，该标签可以通过 `label` 属性指定选项组名称。\n\
  - `<input>` 标签可以包含 `list` 属性以与 `<datalist>` 元素的 `id` 关联，从而提供预定义的选项。\n\n\n\n\n\n\
  ## 应用规则\n## 选择类型\n## 选择类\n## 选择标识\n## 选择关系元素\n## 选择属性\n# 权重权重\n## 绘制颜色\n## 设置背景\n\
  ## 总结\n\n## 认识 CSS\n\n层叠样式表（CSS）是一种用于控制超文本标记语言（HTML）文档中元素呈现方式的语言。呈现方式通过“样式”来指定，这些样式可以“内联”赋值给\
  \ HTML 元素的样式属性，也可以通过 HTML 文档头部部分 `<style> </style>` 标签内的“规则”来指定，或者作为单独样式表中的规则。每条样式规则都会选择指定的元素，然后对它们应用指定的样式。\n\
  \n![image](img/pg166_1.jpg)\n\nCSS 由世界维网联盟（W3C）创建，旨在重新夺回对文档标记的控制权，因为 HTML 已经从最初仅用于定义文档结构元素（如标题、段落、超链接、列表等）的几个“标签”，增长到了极其复杂的程度。随着控制图像、文本颜色、字体大小和背景颜色的标签不断增加，人们发现许多网页的源代码往往包含大量的标记，而实际内容却很少。\n\
  \nW3C 提供了一种通过分离结构和呈现方面来重新夺回文档标记控制权的解决方案。HTML 标签将继续控制结构，但呈现方面现在将由用层叠样式表（CSS）语言编写的“样式规则”来控制。除了区分文档的结构和呈现方面外，CSS\
  \ 解决方案还带来了以下额外优势：\n\n• **更易维护** – 单个样式表可以控制多个 HTML 文档，因此通过编辑一个样式表即可更改整个网站的外观。\n\
  • **更小的文件体积** – 从 HTML 中移除所有呈现标记可以产生更小的文件，下载速度更快。\n• **更强的控制力** – 现在可以为任何 HTML 元素指定外边距、边框、内边距、背景颜色和背景图像，以及界面某些部分（如光标）的外观。\n\
  \n最新的 CSS 规范（CSS3）分为多个模块，允许圆角、投影、渐变颜色填充和动画效果等增强——这些及更多功能将在书中通过示例进行演示。\n\n![image](img/pg166_2.jpg)\n\
  \nW3C 是一个国际联盟，其成员共同开发网络标准。CSS 主页可以在 W3C 网站找到：`[www.w3.org/Style/CSS](http://www.w3.org/Style/CSS)`。\n\
  \nCSS 中的“层叠”（Cascading）一词描述了样式规则从一个样式表传递到另一个的方式。层叠决定了哪条样式规则具有优先级，并成为应用到所选 HTML 元素的规则。\n\
  \n有三种基本的样式表类型，它们可以指定应用于 HTML 元素的样式规则：\n\n• **浏览器（默认）样式表** – 浏览器采用一组固有的样式规则，并默认将其应用于所有网页。这些规则在不同浏览器之间略有不同，但都具有共同特征，如黑色文本和蓝色超链接。\n\
  • **用户样式表** – 某些浏览器允许用户指定自己的外观偏好，这实际上创建了一个自定义样式表，可以覆盖浏览器的默认样式表。\n• **作者样式表** – 当\
  \ HTML 文档指定了由网页作者创建的样式表时，浏览器将应用其中包含的样式规则，覆盖用户样式表和默认浏览器样式表。\n\n![image](img/pg167_1.jpg)\n\
  \n因此，层叠意味着浏览器通常会应用作者样式表中的规则（如果存在），否则将应用用户样式表中的规则（如果存在），否则默认应用浏览器样式表中的规则。\n\n![image](img/hot.jpg)\n\
  \nCSS 是被所有现代网络浏览器公认的通用样式表语言。\n\n![image](img/hot.jpg)\n\n针对同一元素的样式规则的最终优先级由其“特殊性”权重决定——参见此处。\n\
  \n## 创建规则\n\n![image](img/pg168_1.jpg)\n\n在 CSS 中，每条样式规则由两个主要部分组成：\n\n| ![image](img/b1.jpg)\
  \ | **选择器** – 指定 HTML 文档中的哪些元素是该规则的目标。 |\n| ![image](img/b2.jpg) | **声明块** – 指定如何对所选目标元素的属性进行样式设置。\
  \ | |\n\n一条样式规则（或“样式规则集”）以选择器开始，随后是位于大括号（括号）内的声明块。大括号包含一个或多个声明，每个声明指定一个属性以及该属性的有效值，如下例所示：\n\
  \n![image](img/pg168_2.jpg)\n\n通常，选择器针对（选择）特定的 HTML 元素进行样式设置——例如使用上述样式规则示例中的文档中的所有\
  \ `<h1>` 标题元素。\n\n示例中的声明块包含两个声明，用于指定所选目标元素的颜色和背景颜色。CSS `color` 属性被赋值为 `Blue` 值——因此每个\
  \ `<h1>` 标题元素将具有蓝色前景。同样，CSS `background` 属性被赋值为 `Yellow` 值——因此每个 `<h1>` 标题元素将具有黄色背景。\n\
  \n注意 CSS 声明如何使用 `:` 为属性赋值。同样请注意每个声明都以 `;` 结束。严格来说，声明块中的最后一个声明不需要以分号结束，但大多数网页作者倾向于习惯性地为所有\
  \ CSS 声明加上结尾——这样他们在向现有规则中添加更多声明时，就不需要记得添加分隔分号了。\n\n![image](img/hot.jpg)\n\n`background`\
  \ 属性是 `background-color` 以及其他几个 CSS 属性的“简写”属性，这些属性在此处进行了描述。\n\n![image](img/1b.jpg)在创建新的样式规则时，作者必须首先指定一个选择器，以目标应用于规则的\
  \ HTML 元素——CSS 选择器是声明块左大括号之前的所有内容。\n\n`h1`\n\n![image](img/htmlb.jpg)\n\nrules.html\n\
  \n![image](img/2b.jpg)接下来，通过在选择器后添加一对大括号来创建声明块。\n\n`h1 { }`\n\n![image](img/3b.jpg)现在，可以在声明块内插入一个声明来为属性赋值。\n\
  \n`h1 { color : Blue ; }`\n\n![image](img/4b.jpg)然后可以在声明块内添加第二个声明，它与第一个声明用分号隔开。\n\
  \n`h1 { color : Blue ; background : Yellow ; }`\n\n![image](img/5b.jpg)该样式规则集现在已完成，但也可以通过扩展选择器成为逗号分隔的列表，将其应用于另一个\
  \ HTML 元素。\n\n`h1, h2 { color : Blue ; background : Yellow ; }`\n\n![image](img/6b.jpg)之后可以在第一个样式规则集下方添加更多的样式规则集，以针对其他元素。\n\
  \n`h1, h2 { color : Blue ; background : Yellow ; }`\n\n`p      { color : Red ; }`\n\
  \n![image](img/pg169_1.jpg)\n\n![image](img/forget.jpg)\n\n样式规则内部允许存在空白字符（空格、制表符、换行符和回车符），以便作者根据自己的偏好格式化样式规则。\n\
  \n![image](img/hot.jpg)\n\n\n\n\n少于四个声明的样式规则集写在单行，否则为了清晰起见，将跨多行编写——通常选择器和 `{` 左大括号出现在第一行，随后是单独占一行的声明，最后一行是\
  \ `}` 右大括号。由于页面空间限制，本书中的代码采用了更紧凑的格式。\n\n## 应用规则\n\n样式表仅仅是应用于 HTML 文档的样式规则集合。通过在\
  \ HTML 文档的 `head` 部分在 `<style>` 和 `</style>` 标签之间插入样式规则，就可以内部样式表。\n\n![image](img/pg170_1.jpg)\n\
  \n此外，每个 HTML 文档的 `head` 部分应该包含一个 `<meta>` 标签来为页面设置“视口”（viewport）。该标签决定了适应查看页面的设备的网页可见区域，其外观完全如如下所示：\n\
  \n```\n<meta name=”viewport”\ncontent=”width=device-width, initial-scale=1.0” >\n\
  ```\n\n• `width=device-width` 部分将页面宽度设置为与查看设备的屏幕宽度匹配。\n\n• `initial-scale=1.0` 部分在网页首次加载时将浏览器的初始缩放级别设置为\
  \ 100%。\n\n![image](img/forget.jpg)\n\n视口的 `<meta>` 标签不需要跨两行显示。在这里之所以显示这种形式是由于空间限制。\n\
  \n![image](img/1b.jpg)打开一个纯文本编辑器（如 Windows 的记事本应用），然后创建一个包含标题、子标题和段落元素的 HTML 文档\n\
  \n```html\n<!DOCTYPE HTML>\n<html lang=”en”>\n<head>\n<meta charset=”UTF-8”>\n<meta\
  \ name=”viewport”\ncontent=”width=device-width, initial-scale=1.0” >\n<title>Apply\
  \ Style Rules</title>\n<!-- 在此处插入内部样式表。 -->\n</head>\n<body>\n<h1>Heading</h1>\n\
  <h2>Sub-heading</h2>\n<p>Paragraph </p>\n</body>\n</html>\n```\n\n![image](img/htmlb.jpg)\n\
  \n`apply.html`\n\n![image](img/2b.jpg)在文档的 `head` 部分，插入一个包含标题元素样式规则的内部样式表\n\n```html\n\
  <style>\nh1        { color : Blue ; background : Yellow ; }\n</style>\n```\n\n![image](img/3b.jpg)保存\
  \ HTML 文件，然后在网页浏览器中打开它，以查看应用于标题的内部样式表规则\n\n![image](img/pg171_1.jpg)\n\n样式规则也可以通过为元素的\
  \ `style` 属性分配“内联”属性和值来应用：\n\n![image](img/4b.jpg)编辑子标题标签以添加一个内联规则集\n\n```html\n\
  <h2 style=”color : White ; background : Green ;” >\n```\n\n样式规则也可以从外部样式表应用：\n\n\
  ![image](img/5b.jpg)打开一个纯文本编辑器，然后输入下面的样式规则并将其为名为“external.css”的外部样式表\n\n```css\n\
  p { color : Yellow ; background : Red ; }\n```\n\n![image](img/csss.jpg)\n\n`external.css`\n\
  \n![image](img/6b.jpg)通过在文档的 `head` 部分插入此标签来编辑 HTML 文件以链接外部样式表\n\n```html\n<link\
  \ rel=”stylesheet” href=”external.css” type=”text/css”>\n```\n\n![image](img/7b.jpg)保存\
  \ HTML 文件，然后在网页浏览器中重新打开它，以查看应用的内联和外部样式表规则\n\n![image](img/pg171_2.jpg)\n\n![image](img/snake.jpg)\n\
  \n内联规则可能会覆盖其他样式表指定的规则，因为内联规则是浏览器最后应用的规则。\n\n![image](img/hot.jpg)\n\n外部样式表对于在多个网页间保持一致样式非常有用，因此作者可以更改单个规则，该规则将立即应用到所有页面。本书中的大多数示例都使用内部样式表，以便每个\
  \ HTML 文档都是一个独立的示例。\n\n## 选择类型\n\n样式规则的选择器部分选择 HTML 文档中的元素，并根据该规则声明块中指定的值对元素进行样式处理。\n\
  \n![image](img/pg172_1.jpg)\n\n“类型”选择器选择页面中匹配选择器的所有元素。可以通过指定逗号分隔的元素类型列表的类型选择器选择多个元素。\n\
  \n![image](img/1b.jpg)创建一个包含标题和在区域容器内的无序链接列表的 HTML 文档\n\n```html\n<div>\n<h1>Large\
  \ Heading</h1>\n<ul>\n<li><a href=”https://google.com”>Google</a></li>\n<li><a href=”https://yahoo.com”>Yahoo</a></li>\n\
  <li><a href=”https://mediafire.com”>MediaFire</a></li>\n</ul>\n</div>\n```\n\n![image](img/htmlb.jpg)\n\
  \n`type.html`\n\n![image](img/2b.jpg)添加一个样式表，其中的样式规则将容器元素的宽度设置为页面宽度的一半\n\n```html\n\
  <style>\ndiv { width : 50% ; }\n</style>\n```\n\n![image](img/3b.jpg)添加样式规则，设置所有超链接、标题和列表元素的背景颜色\n\
  \n```css\na { background : Yellow ; }\nh1, ul { color: White ; background : Blue\
  \ ; }\n```\n\n![image](img/4b.jpg)保存 HTML 文件，然后在浏览器中打开网页，以查看由类型选择器样化的元素\n\n![image](img/pg172_2.jpg)\n\
  \n![image](img/snake.jpg)\n\n记住，在针对多个元素类型的选择器中，元素类型之间必须有逗号。\n\nCSS `*` 通用选择器可用于选择\
  \ HTML 文档中所有类型的元素——就像它是一个列出所有元素类型作为逗号分隔列表的选择器一样：\n\n![image](img/5b.jpg)添加带有通用选择器的样式规则，以使所有文本变为斜体，然后再次保存\
  \ HTML 文件并刷新浏览器，以查看标题和列表文本均变为斜体\n\n```css\n* { font-style : italic ; }\n```\n\n\
  ![image](img/pg173_1.jpg)\n\n`*` 通用选择器也可以用于选择包含指定元素类型内的任意类型的元素：\n\n![image](img/6b.jpg)使用通用选择器添加样式规则，为“div”容器内的所有元素添加\
  \ 2 像素宽的框，然后再次保存 HTML 文件并刷新浏览器查看框\n\n```css\ndiv * { border : 2px solid Red ; }\n\
  ```\n\n![image](img/pg173_2.jpg)\n\n![image](img/hot.jpg)\n\n你将在本书的第 10 章](#chapter10)发现更多\
  \ CSS 字体属性。\n\n![image](img/forget.jpg)\n\n`div *` 选择器选择 div 内的所有类型元素，但不包括 `<div>`\
  \ 元素。\n\n## 选择类\n\n作为通过类型选择元素的替代，类选择器可以选择包含 `class` 属性且其值匹配选择器的 HTML 元素。类选择器以 `.`\
  \ 点开头，随后是匹配的 `class` 值。这对于跨特定元素应用样式规则特别有用。\n\n![image](img/pg174_1.jpg)\n\n此外，类选择器可以与类型选择器结合以选择类的实例。在这种情况下，选择器首先指定元素类型，随后是\
  \ `.` 点和匹配的 `class` 值：\n\n![image](img/1b.jpg)创建一个包含段落和两个跨字的 HTML 文档——它们都具有相同的 `class`\
  \ 值\n\n```html\n<p class=”frame”>You can fool all the people\n<span class=”frame”>some</span>\
  \ of the time, and\n<span class=”frame”>some</span> of the people all the time,\
  \ but you cannot fool all the people all the time.</p>\n```\n\n![image](img/htmlb.jpg)\n\
  \n`class.html`\n\n![image](img/2b.jpg)添加一个样式表，使用 `class` 值为每个元素绘制红色边框\n\n```html\n\
  <style>\n.frame { border : 2px solid Red ; }\n</style>\n```\n\n![image](img/3b.jpg)现在，添加一条仅针对段落元素的覆盖之前的规则样式规则——为段落绘制蓝色边框并设置其宽度\n\
  \n```html\np.frame { border : 2px solid Blue ; width : 50% ; }\n```\n\n![image](img/4b.jpg)保存\
  \ HTML 文档，然后在浏览器中打开网页，以查看由类选择器样化的元素\n\n\n\n\n![image](img/pg174_2.jpg)\n\n![image](img/hot.jpg)\n\
  \n如果两个规则选中了同一个元素，则将应用样式表中靠后位置的规则。但这些规则在样式表中的出现顺序并不重要。与类型选择器结合的类选择器将被应用，因为它具有更高的特性。请查看此处以了解如何计算特性。\n\
  \n## 选择标识选择 (Select Identity)\n\n与类选择器类似，标识选择器可以选取包含 `id` 属性的 HTML 元素，该属性的值必须与选择器匹配。标识选择器以\
  \ `#` 哈希字符开头，随后跟上要匹配的 `id` 值。这主要用于对一个特定元素应用样式规则，因为在 HTML 文档中每个 `id` 属性值必须是唯一的。\n\
  \n![image](img/pg175_1.jpg)\n\n可选地，标识选择器可以与类型选择器结合，只需识别元素类型。在这种情况下，选择器首先指定元素类型，然后是哈希字符和要匹配的\
  \ `id` 值：\n\n![image](img/1b.jpg)创建一个包含一个段落和两个 span 短语的 HTML 文档——它们都具有唯一的 `id` 值\n\
  \n```html\n<p id=”para1”>You may only be someone\n<span id=”span1”>in the world</span><br>\n\
  but to someone else you may\n<span id=”span2”>be the world</span></p>\n```\n\n![image](img/htmlb.jpg)\n\
  \nidentity.html\n\n![image](img/2b.jpg)添加一个样式表，其样式规则为每个 `span` 元素中的文本背景绘制彩色背景\n\n\
  ```css\n<style>\n#span1 { color : White ; background : Red ; }\n#span2 { color :\
  \ White ; background : Lime ; }\n</style>\n```\n\n![image](img/3b.jpg)现在，添加一条样式规则为段落的其余部分绘制彩色背景并设置其宽度\n\
  \n```css\np#para1 { background : Yellow ; width : 70% ; }\n```\n\n![image](img/4b.jpg)保存\
  \ HTML 文档，然后在浏览器中打开网页，查看由标识选择器样式的元素\n\n![image](img/pg175_2.jpg)\n\n![image](img/hot.jpg)\n\
  \n如果类选择器和标识选择器都尝试设置一个元素的同一个属性，则标识选择器的值将被应用，因为它具有更高的权重。请查看此处了解更多关于选择器权重评级的信息。\n\n\
  ## 选择关系元素 (Select Relatives)\n\n除了通过类型、类或标识（如此处所示）选取目标元素外，CSS 还允许组合选择器以相对于 HTML\
  \ 文档中其他元素来选取元素。这些“组合器”提供了四种选项：\n\n![image](img/pg176_1.jpg)\n\n### 后代选择器 (*space*)\n\
  \n这选取父元素的所有后代元素。CSS 选择器首先指定父元素，然后是一个空格，最后是后代元素。例如，要选取 `<div>` 区域元素内任何层级下的所有 `<p>`\
  \ 段落元素：\n\n```css\ndiv p { }\n```\n\n### 子元素选择器 ( > )\n\n这选取父元素的所有子元素。CSS 选择器首先指定父元素，然后是一个\
  \ `>` 字符，最后是子元素。例如，选取所有作为 `<div>` 的直接子元素的 `<p>` 元素：\n\n```css\ndiv > p { }\n```\n\
  \n![image](img/snake.jpg)\n\n### 相邻兄弟选择器 ( + )\n\n这选取跟随某个元素的元素。CSS 选择器首先指定前一个元素，然后是\
  \ `+` 字符，最后是兄弟元素。例如，选取所有紧跟在 `<div>` 之后的 `<p>` 元素：\n\n```css\ndiv + p { }\n```\n\n\
  ### 通用兄弟选择器 ( ~ )\n\n这选取跟随某个元素元素。CSS 选择器首先指定前一个元素，然后是一个 `~` 字符，最后是兄弟元素。例如，选取所有与\
  \ `<div>` 具有相同父元素的 `<p>` 元素：\n\n```css\ndiv ~ p { }\n```\n\n![image](img/1b.jpg)创建一个包含一个段落和两个\
  \ span 短语的 HTML 文档——它们都具有唯一的 `id` 值\n\n```html\n<p id=”para1”>You may only be someone\n\
  <span id=”span1”>in the world</span><br>\nbut to someone else you may\n<span id=”span2”>be\
  \ the world</span></p>\n```\n\n![image](img/2b.jpg)添加一个样式表，其样式规则为每个 `span` 元素中的文本绘制彩色背景\n\
  \n```css\n<style>\n#span1 { color : White ; background : Red ; }\n#span2 { color\
  \ : White ; background : Lime ; }\n</style>\n```\n\n![image](img/3b.jpg)现在，添加一条样式规则为段落的其余部分绘制彩色背景并设置其宽度\n\
  \n```css\np#para1 { background : Yellow ; width : 70% ; }\n```\n\n![image](img/4b.jpg)保存\
  \ HTML 文档，然后在浏览器中打开网页，查看由标识选择器样式的元素\n\n## 选择属性 (Select Attributes)\n\n除了通过类型、类、标识或关系（如此处所示）选取目标元素外，CSS\
  \ 选择器还可以选取具有特定属性的 HTML 元素。属性选择器有七种选项：\n\n### 属性名选择器 [attribute]\n\n通过在 `[]` 括号内指定属性来选取具有该属性元素：\n\
  \n```css\n[attribute] { }\n```\n\n### 属性值选择器 [attribute=\"value\"]\n\n选取具有指定属性和指定值的元素：\n\
  \n```css\n[attribute=\"value\"] { }\n```\n\n### 属性包含值选择器 [attribute~=\"value\"]\n\
  \n选取具有指定属性且值列表包含指定单词的元素：\n\n```css\n[attribute~=\"item\"] { }\n```\n\n### 属性开头单词选择器\
  \ [attribute|=\"value\"]\n\n选取具有指定属性且值以指定单词开头的元素：\n\n```css\n[attribute|=\"word\"\
  ] { }\n```\n\n### 属性包含字符串选择器 [attribute*=\"value\"]\n\n选取具有指定属性且值包含指定子字符串的元素：\n\n\
  ```css\n[attribute*=\"substring\"] { }\n```\n\n### 属性开头字符串选择器 [attribute^=\"value\"\
  ]\n\n选取具有指定属性且值以指定子字符串开头的元素：\n\n```css\n[attribute^=\"substring\"] { }\n```\n\n\
  ### 属性结尾字符串选择器 [attribute$=\"value\"]\n\n选取具有指定属性且值以指定子字符串结尾的元素：\n\n```css\n[attribute$=\"\
  substring\"] { }\n```\n\n\n\n\n\n```html\n<li class=\"cat-family\">狮子</li>\n<li\
  \ class=\"sea fish\">梭鱼</li>\n<li class=\"topcat\">卡通</li>\n<li class=\"domestic\
  \ bird\">虎比鸟</li>\n</ol>\n```\n\n![image](img/htmlb.jpg)\n\nattribute.html\n\n![image](img/2b.jpg)添加一个带有样式规则的样式表，该规则通过其属性选择列表元素\n\
  \n```html\n<style>\nol[ id ] { border : 2px solid Red ; }\n</style>\n```\n\n![image](img/3b.jpg)现在，添加样式规则以分别通过它们的属性值选择所有列表项\n\
  \n```css\nli[class=\"reptile\"]  { background : Red ; }\nli[class~=\"animal\"] {\
  \ background : Blue ; }\nli[ class|==\"cat\" ] { background : Green ; }\nli[class*=\"\
  fi\"]      { background : Yellow ; }\nli[class^=\"top\"]     { background : Orange\
  \ ; }\nli[class$==\"ird\"]    { background : Purple ; }\n```\n\n![image](img/4b.jpg)保存\
  \ HTML 文档，然后在浏览器中打开网页，查看由属性选择器样化的元素\n\n![image](img/pg179_1.jpg)\n\n![image](img/forget.jpg)\n\
  \n为三个子字符串选择器指定的值不需要完整的单词。\n\n## 权重重要性\n\n当多个样式规则针对同一个元素的属性时，CSS 级联通过检查其选择器的“优先级”（specificity）来评估它们的重要性——即考虑每个选择器定位元素的具体程度，以确定它们的相对重要性。\n\
  \n![image](img/pg180_1.jpg)\n\n有四类定义了选择器的重要性。按重要性降序排列如下：\n\n- **Inline（内联）**：直接在元素\
  \ `style` 属性中声明的样式规则——例如，`style=\"color:White;\"`。\n- **Identity（标识）**：针对元素 `id`\
  \ 属性的选择器——例如 `h2#header`。\n- **Class, Attribute（类、属性）**：针对元素 `class` 或 `[*attribute*]`\
  \ 的选择器——例如 `h2.head`。\n- **Element（元素）**：通过名称针对元素类型的选择器——例如 `h2`。\n\n优先级评估过程为每个选择器组件加分，这些分数存储在四个权重“寄存器”中，以便稍后与冲突选择器的优先级值进行比较。因此，优先级值可以表示为逗号分隔的列表——其中\
  \ `0,0,0,0` 是零优先级值。选择器组件的分分配如下：\n\n- 对于内联 `style` 属性声明，添加 `1,0,0,0`。\n- 对于选择器中的每个\
  \ `id` 属性，添加 `0,1,0,0`。\n- 对于选择器或属性值选择中的每个 `class` 属性，添加 `0,0,1,0`。\n- 对于选择器中的每个元素（或伪元素），添加\
  \ `0,0,0,1`。\n\n如果两个选择器的优先级权重评分相同，则遵循“后来的规则有效”，因此样式表中较靠后的规则将被应用。\n\n![image](img/forget.jpg)\n\
  \n嵌入样式表规则的优先级高于外部样式表规则，且 `*` 通用选择器的优先级值为零 `0,0,0,0`。\n\n![image](img/hot.jpg)\n\n\
  伪元素描述见此处。\n\n![image](img/1b.jpg)创建一个包含三个标题的 HTML 文档\n\n```html\n<h2 style=\"color:White;\"\
  >元素样式</h2>\n<h2 id=\"header\">标识样式</h2>\n<h2 class=\"head\">类样式</h2>\n```\n\n![image](img/htmlb.jpg)\n\
  \nspecificity.html\n\n![image](img/2b.jpg)添加一个带有样式规则的样式表，该规则通过类型选择所有标题元素\n\n```html\n\
  <style>\nh2 { color : Yellow ; }\n</style>\n```\n\n![image](img/3b.jpg)现在，添加样式规则，每条规则以不同的方式针对标题元素的背景（background）属性\n\
  \n```css\nh2        { background : Red ; } /* 0,0,0,1 */\nbody h2 { background :\
  \ Blue ; } /* 0,0,0,2 */\n#header   { background : Green ; } /* 0,1,0,0 */\nh2#header\
  \ { background : Red ; } /* 0,1,0,1 */\nh2.head           { background : Red ; }\
  \ /* 0,0,1,1 */\nbody h2.head { background : Green ; } /* 0,0,1,2 */\n```\n\n![image](img/hot.jpg)\n\
  \n`/* */` 语法可用于在 CSS 样式表中添加单行和多行注释。\n\n![image](img/4b.jpg)保存 HTML 文档然后在浏览器中打开网页，查看在考虑优先级评估重要性后样化的元素\n\
  \n![image](img/pg181_1.jpg)\n\n![image](img/hot.jpg)\n\n可以看到第一个标题的颜色来自内联声明——覆盖了样式表中的类型选择器。每个标题的背景都是通过权重分最高的规则应用的。\n\
  \n## 颜色\n\n![image](img/pg182_1.jpg)\n\n网页浏览器识别这些表格中列出的所有颜色名称。你可以在 CSS 规则中使用这些名称来设置\
  \ HTML 元素的颜色。这些名称不区分大小写，因此也可以写成全小写字母——例如 `background : aqua ;`。\n\n![image](img/pg182_2.jpg)\n\
  \n![image](img/hot.jpg)\n\n颜色也可以作为组成颜色的红（Red）、绿（Green）、蓝（Blue）组件写入——例如，红色为 `rgb(\
  \ 255, 0, 0)`。另一种，颜色可以写为十六进制数——例如，红色的十六进制为 `#FF0000`。\n\n![image](img/pg183_1.jpg)\n\
  \n![image](img/hot.jpg)\n\n颜色也可以以色相（Hue）、饱和度（Saturation）、亮度（Lightness）（HSL）值写入——例如，红色为\
  \ `hsl(0, 100%, 50%)`。\n\n![image](img/hot.jpg)\n\n颜色规格中可以添加第四个 Alpha 值来确定颜色的透明度——例如，半透明的红色指定为\
  \ `rgba(255, 0, 0, 0.5)` 或 `hsla(0, 100%, 50%, 0.5)`。\n\n## 设置背景\n\n就像每个元素都可以对其\
  \ `background` 属性指定背景颜色一样，也可以通过 `url(*filename*)` 值对其 `background` 属性指定背景图像。这里，`*filename*`\
  \ 是图像文件的路径——例如 `background : url(bg.png) ;`。\n\n![image](img/pg184_1.jpg)\n\n`background`\
  \ 属性还可以用空格分隔的值同时指定背景图像和颜色——例如，`background : LightBlue url( bg.png ) ;`。任何指定的背景图像通常会位于元素的左上角，浏览器默认会按行在元素区域内重复地“平铺”（tile）图像。这种行为可以通过为\
  \ **background** 属性分配不同的值来修改，其中 `repeat-x` 值将平铺模式限制为单行水平行，而 `repeat-y` 将模式限制为单列垂直列。也可以通过分配\
  \ `no-repeat` 值来防止平铺，使图像的单个副本出现在内容框的左上角。\n\n可以通过 **background** 属性指定背景图像的位置，使用 `left`、`center`\
  \ 和 `right` 值控制其水平位置，使用 `top`、`center` 和 `bottom` 值控制其垂直位置。将水平和垂直值与 `no-repeat`\
  \ 值结合使用，可以可以在元素区域内的给定位置设置单个版本的图像——例如 `background : url( bg.png ) no-repeat top right\
  \ ;`。\n\n`background` 属性默认有一个 `scroll` 值，该值相对于视口而非元素，因此默认情况下背景图像会随页面滚动。如果你倾向于附加背景页面图像，使其不随页面滚动，可以为\
  \ **background** 属性指定 `fixed` 值，这样当页面滚动时，背景图像将保持相对于视口的指定位置。\n\n\n\n\n\n所有的背景值都可以以空格分隔的列表指定给\
  \ `background` 简写属性，或者单独指定给 `background-color`、`background-image`、`background-repeat`、`background-position`\
  \ 和 `background-attachment` 属性。\n\n![image](img/snake.jpg)\n\n在选择背景图像时，请确保它不会让文本内容难以阅读。\n\
  \n![image](img/hot.jpg)\n\n使用 `background` 简写属性而不是各种单独属性——以保持样式表更加简洁。值的列表应该按照此处列出的顺序出现，但可以选择地省略这些值中的任何一个。\n\
  \n![image](img/1b.jpg)创建一个包含两个段落的 HTML 文档\n\n`<p=”repeat”></p>`\n\n`<p=”repeat-y”></p>`\n\
  \n![image](img/htmlb.jpg)\n\n`background.html`\n\n![image](img/2b.jpg)添加一个包含规则的样式表，这些规则设置每个段落的尺寸和背景属性\n\
  \n```\n<style>\np.repeat { width : 384px ; height : 128px ;\nbackground : LightBlue\
  \ url( crab.png ) ; }\np.repeat-y { width : 384px ; height : 128px ; background\
  \ :\nDeepSkyBlue url( crab.png ) repeat-y top right ; }\n</style>\n```\n\n![image](img/pngs.jpg)\n\
  \n![image](img/pg185_1.jpg)\n\n`crab.png` – 64px x 64px\n\n灰色区域是透明的。\n\n![image](img/3b.jpg)现在，添加一条样式规则，将背景图像固定固定固定到页面上\n\
  \n```\nbody { background : url( crab.png )\nno-repeat bottom right fixed ; }\n```\n\
  \n![image](img/4b.jpg)保存 HTML 文档，然后在浏览器中打开网页以查看背景——滚动页面查看固定的页面背景图像\n\n![image](img/pg185_2.jpg)\n\
  \n![image](img/pg185_3.jpg)\n\n**总结**\n\n•CSS 是 W3C 提供的一种语言，通过将文档结构与表现分离来重新获得对标记的控制。\n\
  \n•级联允许样式规则从一个样式表传递到另一个样式表，并决定应用哪种样式规则。\n\n•每个样式规则由一个选择器和一个声明块组成。\n\n•每个声明指定一个属性和一个应用于该属性的值——用冒号\
  \ `:` 隔开。\n\n•一个样式规则集可能包含多个声明——每个声明都用分号 `;` 结束。\n\n•样式规则可以在内部样式表中指定、内联到 HTML 元素的\
  \ `style` 属性中，或在外部样式表中指定。\n\n•类型选择器选择所有匹配选择器的元素。\n\n•类选择器选择包含 `class` 属性且其属性值与选择器匹配的元素。\n\
  \n•标识选择器选择包含 `id` 属性且其属性值与选择器匹配的元素。\n\n•相对选择器是组合器，它们相对于其他元素作为后代、子元素或兄弟元素来选择元素。\n\
  \n•属性选择器选择具有特定属性或特定属性值的元素。\n\n•级联评估选择器的特异性，通过每个选择器目标元素的具体程度来评估重要性。\n\n•颜色值可以通过名称、十六进制值、红绿蓝值或色相、饱和度、亮度值来指定。\n\
  \n•背景简写属性可以指定元素的背景颜色、图像、重复、位置和链接方式。\n\n| 9 管理盒模型 | ![image](img/pg235_1.jpg) |\n\
  \n*本章演示了如何设置围绕所有 HTML 元素的内容盒。*\n\n**识别盒子**\n\n**内联显示**\n\n**定义尺寸**\n\n**控制边框**\n\
  \n**添加内边距**\n\n**设置外边距**\n\n**定位盒子**\n\n**固定位置**\n\n**堆叠盒子**\n\n**浮动盒子**\n\n**处理溢出**\n\
  \n**布局页面**\n\n**总结**\n\n**识别盒子**\n\n网页上的内容显示在浏览器生成的若干个不可见的矩形盒子中。这些内容盒可以是“块级”的或“内联的”。\n\
  \n![image](img/pg188_1.jpg)\n\n块级内容盒通常在盒子前后有换行符，例如段落、标题和除元素。\n\n相反，内联内容盒不添加换行符，而是创建在内容行内部，例如\
  \ span、强调和链接元素。\n\n每个块级内容盒由一个核心内容区域组成，周围环绕着可选的内边距、边框和外边距区域：\n\n![images](img/pg188_2.jpg)\n\
  \n样式规则可以指定内边距、边框和外边距属性的值以控制内容盒的外。这些都适用于块级盒，但某些属性（如宽度和高度）不适用于内联盒。此外，内边距、边框和外边距在内联盒上的表现可能与预期不同。\n\
  \n内边距、边框和外边距是盒模型的重要组成部分。内边距是内容与边框之间的区域。边框是内边距与外边距之间的区域。外边距是边框与相邻元素之间的区域。\n\n盒模型决定了元素的大小。计算尺寸的公式如下：\n\
  \n宽度 = 内容 + 内边距 + 边框 + 外边距\n\n高度 = 内容 + 内边距 + 边框 + 外边距\n\n灰色区域是透明的。\n\n![image](img/3b.jpg)现在，添加一条样式规则，将背景图像固定位置附加到页面上\n\
  \n```\nbody { background : url( crab.png )\nno-repeat bottom right fixed ; }\n```\n\
  \n![image](img/4b.jpg)保存 HTML 文档，然后在浏览器中打开网页以查看背景——滚动页面查看固定的页面背景图像\n\n![image](img/pg185_2.jpg)\n\
  \n![image](img/pg185_3.jpg)\n\n\n\n\n\n# 盒模型\n\n如果你指定了元素的宽度和高度，你只是设置了内容区域的宽度和高度。你必须加上内边距、边框和外边距区域，才能计算出元素占据的总空间。在这种情况下，元素占据的总宽度为\
  \ `300px`（宽度）+ `20px`（左右内边距）+ `10px`（左右边框）+ `40px`（左右外边距）= 370 像素。\n\n# 内联显示\n\n\
  网页依赖于创建块级内容框来确定其整体布局，并在块内创建内联内容框来确定其精确布局。\n\n![image](img/pg190_1.jpg)\n\n这非常强调元素是块级还是内联，以确定显示格式。通常，每个元素的默认显示格式是最合适的。例如，通常希望将列表项显示在块级列表的单独行上。\n\
  \n元素的显示格式也可以通过样式规则显式确定，该规则将 `block` 或 `inline` 关键字分配给该元素的 `display` 属性。这意味着无需更改\
  \ HTML 标签即可以不同格式显示内容。例如，列表项可以通过 `display : inline ;` 声明显示在一行上。\n\n此外，内联内容框的 `display`\
  \ 属性可以赋值为 `inline-block`，使其显示方式类似于块级内容框。`inline-block` 仍然像往常一样内联显示，但与常规内联内容框不同，其宽度和高度属性可以赋值以控制其大小。\n\
  \n![images](img/pg190_2.jpg)\n\n使用 `display:inline ;` 声明时，上下外边距和内边距不会生效——但使用 `inline-block`\
  \ 时会生效。另外，请注意 `display : block ;` 声明会在元素后添加一个换行符——而 `inline-block` 不会。\n\n![images](img/forget.jpg)\n\
  \n为元素分配非默认显示类型只会改变其显示方式——在文档树中，内联元素始终是块级元素的后代。\n\n![images](img/hot.jpg)\n\n如果每个列表项元素都设置为\
  \ `inline-block`，则列表项可以水平显示，而不是垂直显示。这通常用于创建水平链接的导航栏——请参见此处。\n\n![image](img/1r.jpg)\n\
  \n创建一个包含三个无序列表的 HTML 文档\n\n```html\n<ul class=\"block\">\n<li>Block</li><li>Block</li><li>Block</li>\n\
  </ul>\n<ul class=\"inline\">\n<li>Inline</li><li>Inline</li><li>Inline</li>\n</ul>\n\
  <ul class=\"inline-block\">\n<li>Inline Block</li><li>Inline Block</li><li>Inline\
  \ Block</li>\n</ul>\n```\n\n![image](img/htmlr.jpg)\n\n`display.html`\n\n![image](img/2r.jpg)\n\
  \n添加一个样式表，其中包含设置每个列表边框和列表项元素的规则\n\n```css\nul         { border : 2px solid Tomato\
  \ ; }\nul > li  { background : MistyRose ; margin : 10px ;\npadding : 5px ; width\
  \ : 100px ; height : 20px ; }\n```\n\n![image](img/3r.jpg)\n\n现在，添加样式规则以指定每个列表项元素的显示类型\n\
  \n```css\nul.block > li { display : block ; }\nul.inline > li { display : inline\
  \ ; }\nul.inline-block > li { display : inline-block ; }\n```\n\n![image](img/4r.jpg)\n\
  \n保存 HTML 文档，然后在浏览器中打开网页，查看以特定格式显示的内容\n\n![images](img/pg191_1.jpg)\n\n![images](img/snake.jpg)\n\
  \n`Inline` 框不会包含顶部内边距或外边距值。`Inline Block` 框会包含顶部内边距或外边距值。\n\n# 定义尺寸\n\n当为属性分配任何非零值时，声明必须包含一个两个字母的单位名称，以指定要应用的测量单位。CSS\
  \ 规范提供了以下表示现实世界测量的单位名称：\n\n![image](img/pg192_1.jpg)\n\n| 单位 | 描述 | 示例 |\n|------|------|------|\n\
  | `in`（英寸） | 美国标准长度测量单位 | `div { width : 1in ; }` |\n| `cm`（厘米） | 公制长度单位，2.54 厘米等于\
  \ 1 英寸 | `div { height : 2.54cm ; }` |\n| `mm`（毫米） | 公制长度单位（一厘米的十分之一），25.4 毫米等于\
  \ 1 英寸 | `div { height : 25.4mm ; }` |\n| `pt`（点） | 字体高度的印刷单位，72 点等于 1 英寸 | `div\
  \ { font-size : 12pt ; }` |\n| `pc`（派卡） | 字体高度的印刷单位，6 派卡等于 1 英寸 | `div { font-size\
  \ : 2pc ; }` |\n\nCSS 规范还提供了以下表示根据显示设备的相对值的单位名称：\n\n| 单位 | 描述 | 示例 |\n|------|------|------|\n\
  | `em`（字体大小） | 字体大小的抽象印刷单位，1em 等于给定字体的高度 | `div { font-size : 12pt ; }`（1em = 12pt）\
  \ |\n| `ex`（字体大小） | 字体大小的抽象印刷单位，1ex 等于字体中小写字母“x”的高度（通常为 1em 的 50%） | `div { font-size\
  \ : 12pt ; }`（1ex = 6pt） |\n| `px`（像素） | 抽象单位，表示计算机显示器上的点，当显示器分辨率为 1024x768 时，每行有\
  \ 1024 个像素 | `div { height : 100px ; }` |\n\n![images](img/forget.jpg)\n\n零值可以仅使用数字“0”来分配——无需指定单位名称。\n\
  \n![images](img/hot.jpg)\n\n百分比值也可以指定相对大小——例如，50% 的值使目标元素的大小为其包含元素的一半。\n\n![image](img/1r.jpg)\n\
  \n创建一个包含四个 div 元素的 HTML 文档\n\n```html\n<div id=\"absolute\">3in x &half;in</div>\n\
  <div id=\"container\">400px x 150px\n<div id=\"percent\">50% x 50%</div>\n<div id=\"\
  relative\">20em x 2em</div>\n</div>\n```\n\n![images](img/htmlr.jpg)\n\n`dimensions.html`\n\
  \n![image](img/2r.jpg)\n\n添加一个样式表，其中包含使用绝对单位设置元素大小的规则\n\n```css\ndiv#absolute {\
  \ width : 3in ; height : 0.5in ;\nbackground : Tomato ; }\n```\n\n![image](img/3r.jpg)\n\
  \n接下来，添加使用显示器分辨率设置元素大小的规则\n\n```css\ndiv#container { width : 400px ; height : 150px\
  \ ;\nbackground : MistyRose ; }\n```\n\n![image](img/4r.jpg)\n\n现在，添加使用百分比设置元素大小的规则\n\
  \n```css\ndiv#percent { width : 50% ; height : 50% ;\nbackground : Tomato ; }\n\
  ```\n\n![image](img/5r.jpg)\n\n然后，添加相对于字体高度设置元素大小的规则\n\n```css\ndiv#relative { width\
  \ : 20em ; height : 2em ;\nbackground : LightSalmon ; }\n```\n\n![image](img/6r.jpg)\n\
  \n保存 HTML 文档，然后在浏览器中打开网页，查看元素大小\n\n![images](img/pg193_1.jpg)\n\n![images](img/hot.jpg)\n\
  \n`em` 单位的名称源自印刷术，在印刷术中它表示当前字体集中字母“M”的宽度。但在 CSS 中有所不同，因为它表示当前字体的高度。通常认为，在可能的情况下，对文本大小使用\
  \ `em` 单位是一种良好实践——以实现最大的灵活性。\n\n# 控制边框\n\n每个内容框都可以有一个边框，由 `border-width`、`border-color`\
  \ 和 `border-style` 属性组成。可以为这些单独属性中的每一个指定一个值，以对内容框的所有四个边应用统一的边框，或者可以指定一个空格分隔的值列表，以对每一边应用不同的边框：\n\
  \n![images](img/pg194_1.jpg)\n\n- 当列出两个值时，第一个值应用于顶部和底部边框。\n- 当列出三个值时，第一个值应用于顶部边框，第二个值应用于左右边框，第三个值应用于底部边框。\n\
  - 当列出四个值时，它们按顺时针方向应用于顶部、右侧、底部和左侧边框。\n\n\n\n\n\n默认的 `border-width` 值为 `medium`（一个计算值），默认的\
  \ `border-color` 值继承自元素的 `color` 属性，但默认的 `border-style` 为 `none`。这意味着在赋值之前，边框将是不可见的——可能的\
  \ `border-style` 值有 `solid`、`double`、`dotted`、`dashed`、`groove`、`ridge`、`inset`、`outset`、`hidden`\
  \ 和 `none`。\n\n与其为 `border-width`、`border-color` 和 `border-style` 属性分别创建样式规则，使用\
  \ CSS 简写技术更为简单，通过一个空格分隔的列表为 `border` 属性指定这三个属性中的每一个值。这可以统一地为内容框的每一边应用指定宽度、颜色和样式的边框。例如，样式规则声明\
  \ `border : 0.5in dotted Red ;` 将为内容框的四边都应用半英寸宽的红色点线边框。\n\n如果需要不同的样式，可以通过为元素的 `border-top`、`border-right`、`border-bottom`\
  \ 和 `border-left` 属性创建规则，单独对内容框每边的边框进行样式设置。CSS 简写技术也可用于这些属性，通过空格分隔的列表为单边指定宽度、颜色和样式。例如，样式规则声明\
  \ `border-bottom : 0.5in red dotted` 将仅为内容框的底部应用半英寸宽的红色点线边框。\n\n![images](img/hot.jpg)\n\
  \n创建一个包含四个段落的 HTML 文档\n\n```\n<p id=”no1”>Solid - Inherit - Medium</p>\n<p id=”no2”>Top:\
  \ Dotted - LightSalmon - 0.5em\n<br>Bottom: Dashed - DarkSalmon - 0.5em</p>\n<p\
  \ id=”no3”>Ridge Double - MistyRose - 1em</p>\n<p id=”no4”>Outset - Tomato - 1em</p>\n\
  ```\n\n![images](img/htmlr.jpg)\n\nborder.html\n\n![image](img/2r.jpg)保存 HTML 文档，然后创建一个带有规则的链接样式表，以添加一个继承颜色的边框\n\
  \n```\np#no1 { color : Tomato ; border : solid ; }\n```\n\n![image](img/3r.jpg)接下来，添加带有简写声明的规则，仅在内容区域的上下创建边框\n\
  \n```css\np#no2 { border-top : 0.5em dotted LightSalmon ;\nborder-bottom : 0.5em\
  \ dashed DarkSalmon ; }\n```\n\n![image](img/4r.jpg)现在，添加通过独立属性创建边框的规则\n\n```css\n\
  p#no3 { border-width : 1em ;\nborder-style : ridge double ;\nborder-color : MistyRose\
  \ ; }\n```\n\n![image](img/5r.jpg)然后，使用推荐的 CSS 简写技术添加一个在四边创建边框的规则\n\n```css\np#no4\
  \ { border : 1em outset Tomato ; }\n```\n\n![image](img/6r.jpg)保存 HTML 文档，然后在浏览器中打开网页以查看边框\n\
  \n![images](img/pg195_1.jpg)\n\n![images](img/hot.jpg)\n\n注意浏览器如何在边框相交处进行对角处理——这提供了一些创意可能。\n\
  \n### 添加内边距 (Padding)\n\n通过样式规则为 `padding` 属性赋值，每个内容框都可以在核心内容区域周围添加“padding”空间。可以指定单个值为内容区域的所有四边应用统一的内边距宽度，也可以指定一个空格分隔的值列表，为每边应用不同的内边距宽度：\n\
  \n![image](img/pg196_1.jpg)\n\n• 当列出两个值时，第一个应用于顶部和底部，第二个应用于左侧和右侧。\n• 当列出三个值时，第一个应用于顶部，第二个应用于左侧和右侧，第三个应用于底部。\n\
  • 当列出四个值时，它们按顺时针应用于顶部、右侧、底部和左侧。\n\n内边距区域围绕核心内容区域，如果指定了边框，它延伸到边框区域的外边缘——一直到外边距区域的开始。元素的背景填充核心内容区域和内边距区域，因此指定的背景颜色将自动应用于核心内容区域和内边距区域。\n\
  \n`padding` 属性可以指定为单位值或百分比值。当指定百分比时，内边距宽度是使用包含元素的宽度和高度计算的——如果包含元素的大小发生变化，内边距区域的大小也将调整。\n\
  \n通常在为元素添加边框时会指定内边距区域，以增加内容与边框之间的空间。\n\n如果内容框的每边需要不同的内边距宽度，可以通过为元素的 `padding-top`、`padding-right`、`padding-bottom`\
  \ 和 `padding-left` 属性创建规则来单独进行样式设置。例如，样式规则 `padding-top : 0.5in ; padding-bottom\
  \ : 0.5in ;` 将为顶底部应用半英寸的内边距区域。另一种方法也可以使用 CSS 简写声明 `padding : 0.5in 0 0.5in 0 ;`\
  \ 实现相同效果。\n\n![images](img/snake.jpg)\n\n当用户缩放窗口时，将内边距设置为百分比可能会产生意外的结果——你可以指定单位值。\n\
  \n![images](img/hot.jpg)\n\n`outset` 边框样式可以创建凸按钮的效果，而 `inset` 边框样式可以创建凹按钮的效果。\n\n\
  ![image](img/1r.jpg)创建一个包含三个段落的 HTML 文档，每个段落包含一个 span 元素并由水平线分隔\n\n```\n水平\n垂直\n\
  水平和垂直\n```\n\n![images](img/htmlr.jpg)\n\npadding.html\n\n![image](img/2r.jpg)添加一个样式表，为段落和\
  \ span 元素上色\n\n```css\np { background : LightSalmon ; }\nspan { background : MistyRose\
  \ ;\nborder : 0.3em dashed Tomato ; }\n```\n\n![image](img/3r.jpg)接下来，添加样式规则为第一个内容框的左右边添加内边距\n\
  \n```css\nspan#pad-h { padding : 0 3em 0 3em ; }\n```\n\n![image](img/4r.jpg)现在，添加样式规则为第二个内容框的上下边添加内边距\n\
  \n```css\nspan#pad-v { padding : 1em 0 1em 0 ; }\n```\n\n![image](img/5r.jpg)然后，添加样式规则为第三个元素的所有边添加统一的内边距\n\
  \n```css\nspan#pad-hv { padding : 1em ; }\n```\n\n![image](img/6r.jpg)保存 HTML 文档，然后在浏览器中打开网页以查看添加的内边距\n\
  \n![images](img/pg197_1.jpg)\n\n![images](img/forget.jpg)\n\n注意背景颜色如何填充内容区域和内边距区域——延伸到边框区域的外边缘。\n\
  \n### 设置外边距 (Margins)\n\n![image](img/pg198_1.jpg)\n\n通过样式规则为 `margin` 属性赋值，每个内容框都可以在整个内容、内边距和边框区域周围添加外部透明的“margin”空间。`margin`\
  \ 属性的默认值为零，但实际上浏览器应用了自己的内置默认值以允许元素之间产生间距。例如，标题元素总是在其后的段落元素之前留出外边距区域。\n\n\n\n\n\n\
  `margin` 属性可以指定为单位值、百分比值，或使用 `auto` 关键字让浏览器计算合适的边距。当对元素的 `margin` 属性指定 `auto` 关键字时，浏览器会首先计算该元素到左侧和右侧的距离（直到其容器元素的边界），然后将总和平分以计算每个侧边边距的值。例如，对宽度为\
  \ `80px` 的段落元素应用 `margin : auto ;` 规则，而该元素包含在一个宽度为 `400px` 的外部 `div` 元素中，浏览器会将 `320px`\
  \ 的总差值平分，然后在段落元素的两侧应用 `160px` 宽的边距——从而使其在容器 `div` 元素中居中定位。\n\n如果希望内容框的每个边具有不同的边距宽度，可以通过为元素的\
  \ `margin-top`、`margin-right`、`margin-bottom` 和 `margin-left` 属性创建规则来单独设置 `margin`。例如，`margin-top\
  \ : 0.5in ; margin-bottom : 0.5in ;` 的样式规则声明将在顶部和底部应用半英寸的边距区域。或者，也可以使用 CSS 简写声明\
  \ `margin : 0.5in 0 0.5in 0 ;` 实现相同的效果。\n\n![images](img/hot.jpg)\n\n每个侧边的边距宽度始终可以使用\
  \ CSS `margin` 简写进行设置，只需将不需要边距的侧边设置为零——始终使用简写。\n\n![image](img/1r.jpg)\n\n创建一个 HTML\
  \ 文档，其中包含一个外部 `div` 元素，该元素包含三个内部 `div` 元素\n\n```html\n<div class=”container”> Centered\
  \ Block\n<div class=”zero”>Default Position</</div>\n<div class=”center”>Centered\
  \ Block</</div>\n<div class=”offset”>Offset Block</</div>\n</div>\n```\n\n![images](img/htmlr.jpg)\n\
  \nmargin.html\n\n![image](img/2r.jpg)\n\n添加样式表，通过规则将外部 `div` 在页面内居中，并为该 `div` 周围创建一个边框\n\
  \n```css\ndiv.container { margin : auto ;\nborder : 0.3em dashed Tomato ; }\n```\n\
  \n![image](img/3r.jpg)\n\n接下来，添加样式规则移除第一个内部 `div` 的所有边距，并为其设置背景颜色\n\n```css\ndiv.zero\
  \ { margin : 0 ; width : 10em ;\nbackground : LightSalmon ; }\n```\n\n![image](img/4r.jpg)\n\
  \n现在，添加样式规则使第二个内部 `div` 居中，创建一个边框并为其设置背景颜色\n\n```css\ndiv.center { margin : auto\
  \ ; border : 0.3em dashed Tomato ;\nwidth : 10em ; background : MistyRose ; }\n\
  ```\n\n![image](img/5r.jpg)\n\n然后，添加样式规则为第三个内部 `div` 添加顶部和左侧边距，并为其设置背景颜色\n\n```css\n\
  div.offset { margin : 20px 0 0 20px ;\nbackground : LightSalmon ; }\n```\n\n![image](img/6r.jpg)\n\
  \n保存 HTML 文档，然后在浏览器中打开网页查看边距样式\n\n![images](img/pg199_1.jpg)\n\n![images](img/forget.jpg)\n\
  \n自动计算边距大小的能力对于内容居中至关重要。\n\n![images](img/snake.jpg)\n\n注意 `margin:auto;` 使块居中，但不会使块内的文本居中。文本对齐样式请参见此处。\n\
  \n## 定位 (Position Boxes)\n\n在布局网页元素内容框时，CSS `position` 属性的默认值为 `static`——代表标准流布局方案。为元素的\
  \ `position` 属性分配不同的值可以使该元素的位置离开标准流，从而可以独立进行定位。\n\n![image](img/pg200_1.jpg)\n\n\
  可以使用 `absolute`、`relative`、`fixed` 和 `sticky` 关键字指定默认 `static` 值的替代方案，以指定区别于标准流布局的定位方案。\n\
  \n`absolute`、`relative`、`fixed` 和 `sticky` 定位方案分别使用一个或多个 CSS “偏移”属性 `top`、`right`、`bottom`\
  \ 和 `left` 来定义元素的位置。\n\n当 `position` 属性指定为 `absolute` 时，定位方案会将元素放置在距离容器元素边界指定的偏移距离处。例如，一个\
  \ `top` 和 `left` 值为 `100px` 的绝对定位 `div` 元素将放置在其容器元素边界的下方 100 像素和右侧 100 像素处。\n\n\
  当 `position` 属性指定为 `relative` 时，定位方案相对于元素在标准流布局中原本应占据的位置来调整元素的位置。例如，指定 `top` 值为\
  \ `-18px` 会使选定元素向上，指定 `left` 值为 `100px` 会使其向右移动——但关键在于，其原始布局位置所占据的空间会被保留。在段落内的 `span`\
  \ 元素应用这些相对位置值具有这种效果：\n\n![images](img/pg200_2.jpg)\n\n注意原始内容如何从其标准流布局位置移动到一个新创建的内容框，该框相对于其原始位置按指定的距离进行定位。即使外部容器元素的位置发生变化，这种相对位置也会保持不变。\n\
  \n因此，虽然绝对定位可以控制外部元素的位置，但相对定位方案通常用于控制内部元素的位置。\n\n![images](img/forget.jpg)\n\n绝对定位元素和相对定位元素在页面滚动时会随页面移动。\n\
  \n![images](img/snake.jpg)\n\n注意这里使用了负值——这些值可以与其他属性配合使用但可能会产生意想不到的结果。\n\n![image](img/1r.jpg)\n\
  \n创建一个 HTML 文档，包含两个 `div` 元素，每个元素都包含一个 `span` 元素\n\n```html\n<div class=”left”>\n\
  <span>Normal Flow Element</span></>\n<div class=”right”>\n<span class=”offset”>Relatively\
  \ Positioned Element</span></span>\n</div>\n```\n\n![images](img/htmlr.jpg)\n\n\
  position.html\n\n![image](img/2r.jpg)\n\n添加样式表，通过规则指定 `div` 元素的大小并为所有元素添加边框\n\n\
  ```css\ndiv { width : 250px ; height : 100px ; }\ndiv,span { border : 2px solid\
  \ Tomato ; }\n```\n\n![image](img/3r.jpg)\n\n接下来，添加样式规则对 `div` 元素进行绝对定位\n\n```css\n\
  div.left { position : absolute ; top : 20px ; left : 20px ; }\ndiv.right { position\
  \ : absolute ; top : 80px ; left : 245px ; }\n```\n\n![image](img/4r.jpg)\n\n现在，添加样式规则对\
  \ `span` 元素进行相对定位\n\n```css\nspan.offset { position : relative ; top : 70px ; left\
  \ : 25px ; }\n```\n\n![image](img/5r.jpg)\n\n保存 HTML 文档，然后在浏览器中打开网页查看 `div` 元素在页面上的绝对坐标定位，并查看\
  \ `span` 相对于其容器的定位\n\n![images](img/pg201_1.jpg)\n\n![images](img/hot.jpg)\n\n记住位置值指定的是目标元素左上角的位置。在这里，它向下偏移\
  \ 70 像素并向右偏移 25 像素。\n\n## 固定定位 (Fix Positions)\n\n固定定位方案像绝对定位方案一样，完全将选定元素的内容框从标准流布局中移除。但与绝对定位（偏移值相对于容器元素的边界）不同，在固定定位中，偏移值相对于视口（viewport）——位置相对于浏览器窗口，而不是文档的任何部分。\n\
  \n![images](img/pg202_1.jpg)\n\n很有用，固定元素位置可以模拟框架式界面，在这种界面中，无论页面如何滚动，某些框架都保持固定位置。例如，Logo\
  \ 框架可以固定在页面的底部角落，即使页面滚动时它也始终保持可见。\n\n\n\n\n\n粘性定位（sticky positioning）方案也可用于确保元素在用户滚动页面时保持可见。这最初是将一个元素相对于页面上的其他元素进行放置，并在页面滚动时保持此位置，直到它到达视口中指定的偏移位置。在这一点上，元素将变为固定位置并固定在原处。滚动回指定的偏移位置时，元素将恢复其相对定位。\n\
  \n与固定定位（fixed positioning）一样，元素的位置可以是粘性的，以模拟框架式的界面。例如，一个横幅框架框可以固定在视口的顶部，使其即使在页面滚动时也能保持持续可见。\n\
  \n要使用粘性定位方案，你必须为元素的 `top`、`bottom`、`left` 或 `right` 属性至少一个指定阈值偏移位置，否则当用户滚动页面时，它将保持相对定位。\n\
  \n![images](img/snake.jpg)\n\n在编写本文时，Safari 网页浏览器尚不支持 `position : sticky ;` 规则。在\
  \ Safari 实现此功能之前，你必须为该浏览器包含 `position : -webkit-sticky ;` 规则。\n\n![image](img/1r.jpg)\
  \ 创建一个包含标题、两个 div 元素和一个大图片的 HTML 文档\n\n```html\n<h1>Fixing Elements</h1>\n<div class=\"\
  sticky\">Sticky Banner Element</div\n<div class=\"fixed\">Fixed Logo Element</div\n\
  <img src=\"ruler.png\" alt=\"Tall Ruler\">\n```\n\n![images](img/htmlr.jpg)\n\n\
  fixed.html\n\n![image](img/2r.jpg) 添加一个包含规则的样式表，以指定 div 元素的尺寸和颜色\n\n```css\ndiv\
  \ { width : 150px ; padding : 10px ; background : Tomato ; color : White ; }\n```\n\
  \n![image](img/3r.jpg) 接下来，添加样式规则，使第一个 div 元素在滚动时居中固定在页面顶部\n\n```css\ndiv.sticky\
  \ { position : sticky ; top : 10px ; margin : auto ; }\n```\n\n![image](img/4r.jpg)\
  \ 现在，添加样式规则，在滚动时将第二个 div 元素固定在页面的右下角\n\n```css\ndiv.fixed { position : fixed ; bottom\
  \ : 0px ; right : 0px ; }\n```\n\n![image](img/5r.jpg) 保存 HTML 文档，然后在浏览器中打开网页并滚动页面，查看\
  \ div 元素保持可见\n\n![images](img/pg203_1.jpg)\n\n![images](img/pg203_2.jpg)\n\n![images](img/pngr.jpg)\n\
  \n![images](img/pg203_3.jpg)\n\nruler.png – 70px x 525px\n\n## 堆叠盒 (Stack Boxes)\n\
  \n改变默认的 `static` 定位方案，通过给 `position` 属性分配 `absolute` 值，允许元素重叠——按照它们在 HTML 代码中列出的顺序相互堆叠。\n\
  \n![image](img/pg204_1.jpg)\n\n然而，在 CSS 中通过为每个元素的 `z-index` 属性分配整数值，可以显式指定堆叠顺序。值最高的元素显示在最上方，下方是下一个高值的元素，依此类推。\n\
  \n因此，`absolute` 定位方案允许使用 XYZ 坐标在三个维度精确控制元素位置——沿 X 轴使用 `left` 和 `right` 偏移属性，沿 Y\
  \ 轴使用 `top` 和 `bottom` 偏移属性，沿 Z 轴使用 `z-index` 堆叠顺序属性。\n\n![images](img/pg204_2.jpg)\n\
  \n为堆叠元素的 `z-index` 属性指定值，允许你控制元素出现在其他元素的前还是后面——无论它们在 HTML 文档中列出的顺序如何。\n\n将包含文本的元素堆叠在图像元素之上通常很有用，可以为图像添加文本标签。\n\
  \n![image](img/1r.jpg) 创建一个包含三个 div 元素和一个图像元素的 HTML 文档\n\n```html\n<div class=\"\
  container\">\n  <img src=\"scene.png\" alt=\"Street Scene\">\n  <div class=\"btm-label\"\
  >Street Scene</div\n  <div class=\"top-label\">Paris, 1966</div\n</div\n```\n\n\
  ![images](img/htmlr.jpg)\n\nstack.html\n\n![images](img/hot.jpg)\n\n指定给 `z-index`\
  \ 属性的值用于确定堆叠顺序可以是正整数（如 1），也可以是负整数（如 -1）。\n\n![image](img/2r.jpg) 添加一个包含规则的样式表，将外部\
  \ div 元素位于堆叠的底部\n\n```css\ndiv.container { position : absolute ; top : 0px ; left\
  \ : 0px ; z-index : 0 ; }\n```\n\n![image](img/3r.jpg) 接下来，添加规则将 div 元素置于堆叠的下一层\n\
  \n```css\ndiv.top-label { position : absolute ; color : Red ; top : 10px ; right\
  \ : 20px ; z-index : 1 ; }\n```\n\n![image](img/4r.jpg) 现在，添加规则将 div 元素置于堆叠的最顶层\n\
  \n```css\ndiv.btm-label { position : absolute ; color : Red ; bottom : 10px ; left\
  \ : 220px ; z-index : 2 ; }\n```\n\n![image](img/5r.jpg) 保存 HTML 文档，然后在浏览器中打开网页并滚动页面查看\
  \ div 元素\n\n![images](img/pg205_3.jpg)\n\n## 浮动盒 (Float Boxes)\n\nCSS `float` 属性允许内容框定位在其父元素的一侧，通常允许文字环绕它。你可以使用\
  \ `float: left;`、`float: right;` 或 `float: none;`。`clear` 属性随后防止元素环绕浮动对象。\n\n![image](img/1r.jpg)\
  \ 创建一个包含三个段落两个图片的 HTML 文档\n\n```html\n<p>巨大的加速度——禁忌之果！这辆由 500 马力 V10 引擎驱动的 3300\
  \ 磅跑车诱使你对沥油路咬一口。</p>\n<img src=\"viper-front.png\" alt=\"Viper Front\">\n<p>但这辆车对大多数人来说太疯狂了、太震撼了。</p>\n\
  <img src=\"viper-rear.png\" alt=\"Viper Rear\">\n<p class=\"clear\">如果你买得起……买一台吧。你会喜欢它的。</p>\n\
  ```\n\n![images](img/htmlr.jpg)\n\nfloat.html\n\n![images](img/pngr.jpg)\n\nviper-front.png\
  \ - 150px x 128px\n\n![images](img/pngr.jpg)\n\nviper-rear.png - 155px x 115px\n\
  \n![image](img/2r.jpg) 添加一个包含规则的样式表来给段落上色\n\n```css\np { background : LightSalmon\
  \ ; }\n```\n\n![image](img/3r.jpg) 接下来，添加样式规则将第一张图片浮在其容器元素的右侧并添加边框\n\n```css\nimg[src=\"\
  viper-front.png\"] { float : right ; border : 2px dashed Tomato ; }\n```\n\n![image](img/4r.jpg)\
  \ 现在，添加样式规则将第二张图片浮在其容器元素的左侧并添加边框\n\n```css\nimg[src=\"viper-rear.png\"] { float\
  \ : left ; border : 2px dashed Tomato ; }\n```\n\n![image](img/5r.jpg) 保存 HTML 文档，然后在浏览器中打开网页查看浮动图片\n\
  \n![images](img/pg206_1.jpg)\n\n![image](img/6r.jpg) 编辑样式表添加规则，防止最后一个段落环绕第二个浮动图片\n\
  \n```css\np.clear { clear : both ; }\n```\n\n![image](img/7r.jpg) 再次保存 HTML 文档并刷新浏览器查看最后的段落现在位于第二张图片下方\n\
  \n![images](img/pg207_2.jpg)\n\n\n\n\n\n# CSS 浮动与溢出\n\n通过 CSS，任何元素都可以通过设置其 `float`\
  \ 属性浮动到其包含元素的侧面。\n\n## 处理溢出\n\n尽管 CSS 提供了许多控制来指定内容框的精确大小和位置，但并不能保证在所有情况下内容都能整齐地容纳在其边界内。例如，考虑增加文本内容的字体大小，该文本原本恰好适合块级内容框——此时文本可能会“溢出”到框边界之外。\n\
  \n![图片](img/pg208_1.jpg`)\n\n默认情况下，溢出的内容通常是可见的，但 CSS 的 `overflow` 属性可以使用 `hidden`\
  \ 或 `scroll` 关键字指定替代的处理行为。使用 `overflow : hidden ;` 时，溢出的内容将不可见；而使用 `overflow : scroll\
  \ ;` 时，浏览器将提供水平和垂直滚动条，用户可以使用它们查看溢出的内容。\n\n你可以通过 `overflow-x` 和 `overflow-y` 属性控制浏览器是否仅提供水平滚动条或仅提供垂直滚动条，以便用户查看隐藏的内容。这些属性接受\
  \ `hidden` 值来隐藏单个滚动条，或接受 `scroll` 值来提供单个滚动条。例如，使用样式规则 `overflow-x : hidden ;` 时，不提供水平滚动条；而\
  \ `overflow-y : scroll ;` 则提供垂直滚动条。\n\n文本内容通常会在块级内容框内的单词断点处自动换行到下一行，因为 `white-space`\
  \ 属性默认设置为 `normal`。但是，你可以通过 `white-space : nowrap ;` 样式规则禁用文本换行。由于默认情况下溢出的内容通常是可见的，文本将显示在单行上，并延伸到内容框的边界之外。\n\
  \n![图片](img/snake.jpg`)\n\n`overflow` 属性仅对具有指定高度的块级元素有效，否则块会自动适应内容。\n\n如果不想显示溢出的文本，可以像处理其他内容一样使用\
  \ `overflow : hidden ;` 规则将其隐藏。此外，你可以使用 `text-overflow` 属性的样式规则指定如何处理溢出的文本。该属性可以接受\
  \ `clip` 值，它会截断文本字符而不考虑单词断点；或者接受 `ellipsis` 值，它会用省略号 ... 替换最后被截断的字母——以指示文本已溢出。\n\
  \n![图片](img/1r.jpg`)\n\n创建一个包含六个 division 元素的 HTML 文档\n\n```html\n<div class=\"\
  vis\"><img src=\"berry.png\" alt=\"浆果\"></div>\n<div class=\"hid\"><img src=\"berry.png\"\
  \ alt=\"浆果\"></div>\n<div class=\"scr\"><img src=\"berry.png\" alt=\"浆果\"></div>\n\
  <div class=\"ver\"><img src=\"berry.png\" alt=\"浆果\"></div>\n<div class=\"hor\"\
  ><img src=\"berry.png\" alt=\"浆果\"></div>\n<div class=\"txt\">CSS 代表层叠样式表</div>\n\
  ```\n\n![图片](img/htmlr.jpg`)\n\n`overflow.html`\n\n![图片](img/2r.jpg`)\n\n添加一个样式表，其中包含指定\
  \ division 的块类型和大小的规则——使其小于图片大小\n\n```css\ndiv { display : inline-block ; width\
  \ : 80px ; height : 130px ; border : 2px dashed Tomato ; margin-right : 60px ; }\n\
  ```\n\n![图片](img/pngr.jpg`)\n\n![图片](img/3r.jpg`)\n\n接下来，添加样式规则来处理图片溢出\n\n```css\n\
  div.vis { overflow : visible ; }\ndiv.hid { overflow : hidden ; }\ndiv.scr { overflow\
  \ : scroll ; }\n```\n\n![图片](img/pg209_1.jpg`)\n\n`berry.png`\n\n`100px x 130px`\n\
  \n![图片](img/4r.jpg`)\n\n现在，添加样式规则来控制单个滚动条\n\n```css\ndiv.ver { width : 120px ; overflow-x\
  \ : hidden ; overflow-y : scroll ; }\ndiv.hor { height : 150px ; overflow-x : scroll\
  \ ; overflow-y : hidden ; }\n```\n\n![图片](img/5r.jpg`)\n\n然后，添加样式规则来处理文本溢出\n\n```css\n\
  div.txt { white-space : nowrap ; overflow : hidden ; text-overflow : ellipsis ;\
  \ }\n```\n\n![图片](img/6r.jpg`)\n\n保存 HTML 文档，然后在浏览器中打开网页，查看溢出是如何处理的\n\n![图片](img/hot.jpg`)\n\
  \n注意溢出的不同处理方式...\n\n![图片](img/pg209_2.jpg`)\n\n## 页面布局\n\n网页上内容框的排列可以创建许多不同的布局，但最常见的布局方案之一是将网页划分为页眉、导航栏、侧边栏、主要内容区域和页脚——如下图所示。\n\
  \n![图片](img/pg210_1.jpg`)\n\n![图片](img/pg210_2.jpg`)\n\n- **页眉** – 网站名称，通常还有徽标图片\n\
  - **导航栏** – 指向网站页面的超链接。\n- **主要内容** – 网页最重要的部分。\n- **侧边栏** – 补充信息或广告。\n- **页脚**\
  \ – 版权和联系信息等详细信息。\n\n为了最好地实现网页布局，包含一个通用的 `margin : 0px ;` 样式规则以覆盖浏览器的默认边距大小非常重要。\n\
  \n你还应该包含一个通用的 `box-sizing : border-box ;` 样式规则，该规则允许内容框的内边距和边框包含在每个元素的总宽度和高度内。这意味着边框和内边距不会添加到你为每个元素指定的大小之外——因此你可以更好地控制。\n\
  \n![图片](img/hot.jpg`)\n\n你可以在此处了解更多关于 `box-sizing` 属性的信息：这里。\n\n![图片](img/1r.jpg`)\n\
  \n创建一个包含六个 division 元素的 HTML 文档\n\n```html\n<div>页眉</div>\n<div>导航栏</div>\n<div\
  \ class=\"column side\">侧边<br>栏</div>\n<div class=\"column main\">主要内容</div>\n<div\
  \ class=\"column side\">侧边<br>栏</div>\n<div class=\"footer\">页脚</div>\n```\n\n![图片](img/htmlr.jpg`)\n\
  \n`layout.html`\n\n![图片](img/2r.jpg`)\n\n添加一个包含通用覆盖规则的样式表\n\n```css\n* { margin\
  \ : 0px ; box-sizing : border-box ; }\n```\n\n![图片](img/3r.jpg`)\n\n接下来，添加样式规则为每个\
  \ division 元素添加内边距和边框——现在它们已包含在总大小内\n\n```css\ndiv { padding : 5px ; border : 1px\
  \ solid Tomato ; }\n```\n\n![图片](img/4r.jpg`)\n\n现在，添加规则来设置三个 division 元素的大小并使其浮动\n\
  \n```css\ndiv.column { float : left ; height : 200px ; }\ndiv.side { width : 15%\
  \ ; }\ndiv.main { width : 70% ; }\n```\n\n![图片](img/5r.jpg`)\n\n最后，添加一个样式规则来定位最后一个\
  \ division\n\n```css\ndiv.footer { clear : both ; }\n```\n\n![图片](img/6r.jpg`)\n\
  \n保存 HTML 文档，然后在浏览器中打开网页，查看布局\n\n![图片](img/pg211_1.jpg`)\n\n![图片](img/forget.jpg`)\n\
  \n你可以调整三个列 division 的百分比值，但它们加起来必须等于 `100%`。\n\n![图片](img/hot.jpg`)\n\n这是创建三列布局的传统\
  \ CSS 方法，但你将在本书后面了解更现代的响应式布局方法。\n\n## 总结\n\n- 网页上的内容显示在不可见的矩形框中，这些框要么是块级，要么是内联。\n\
  - 块级内容框在框前后添加换行，并具有可选的 `padding`、`border` 和 `margin` 区域。\n- 内联内容框不添加换行，也不支持 `width`、`height`、`top/bottom\
  \ margin` 和 `padding` 规则。\n- 内联块元素显示为内联，但与常规内联内容框不同，它们支持 `width` 和 `height` 规则。\n\
  - 当为属性分配任何非零值时，声明必须包含一个两个字母的单位名称。\n- 可以通过指定 `width`、颜色和 `border` 样式的规则在内容框周围添加 `border`。\n\
  - 可以通过指定 `padding` 大小的规则在核心内容区域周围添加 `padding` 空间。\n- `Padding` 和 `border` 添加在通过指定元素\
  \ `width` 和 `height` 的规则设置的核心内容区域之外。\n- 可以通过指定 `margin` 大小的规则在内容、`padding` 和 `border`\
  \ 周围添加透明的 `margin` 空间。\n- 内容框可以放置在网页上的 `absolute`、`relative` 或 `fixed` 位置。\n- 重叠内容框的堆叠顺序可以通过指定\
  \ `z-index` 整数值的规则来确定。\n\n\n\n\n\n* 一个内容框，通过指定左侧或右侧边的规则将其定位在其包含元素的侧边界处。\n* 溢出的内容通常是可见的，但可以通过指定隐藏（hidden）或滚动（scroll）选项的规则使其不可见。\n\
  * 为了最好实现网页布局，包含一个通用规则来覆盖浏览器的默认边距大小是非常重要的。\n* 通过通过指定 `box-sizing` 为 `border-box`\
  \ 的规则，可以将内边距和边框包含在元素的宽度高度中。\n\n| 10 操控文本内容 | ![image](img/pg235_1.jpg) |\n\n*本章演示了如何为\
  \ HTML 元素内的文本内容设置样式。*\n\n* 建议字体\n* 设置大小\n* 改变样式\n* 使用简写\n* 对齐文本\n* 控制空格\n* 修饰文本\n\
  * 改变方向\n* 增强文本\n* 数字章节\n* 总结\n\n## 建议字体\n\nCSS 样式规则可以通过向其 `font-family` 属性指定字体名称，建议浏览器在所选元素中显示文本内容时使用特定的字体。如果用户的系统中可用指定的字体，浏览器将使用该字体；否则，它将使用默认字体显示文本。\n\
  \n默认字体可能不是作者意图的最佳选择，因此 CSS 额外允许 `font-family` 属性从下表字体中建议一种通用字体族：\n\n| 字体族: | 描述:\
  \ | 示例: |\n| :--- | :--- | :--- |\n| serif | 比例衬线字体，字符的宽度不同以适应其大小，且笔画末端有衬线装饰 | Times\
  \ New Roman |\n| sans-serif | 不带衬线装饰的比例字体 | Arial |\n| monospace | 非比例字体，字符具有固定宽度，类似于打字机文本\
  \ | Courier |\n| cursive | 尝试模仿手写体的字体 | Seoe Script |\n| fantasy | 具有高度图形化外观的装饰性字体\
  \ | Castellar |\n\n![image](img/pg214_1.jpg)\n\n上方是字母的衬线（左侧）和无衬线（右侧）版本——衬线装饰被圆圈出来。衬线字体字符通常被认为更具读性，但无衬线字体更适合小字体和针对儿童的文本。\n\
  \n浏览器将首先尝试应用指定的字体，但如果不可用，将从可用字体中选择最符合通用偏好特征的字体。这样，即使没有特定的字体匹配，文本的外观也至少接近作者的意图。\n\
  \n在样式规则的 `font-family` 声明中，首选字体名称应通过逗号分隔出现在通用字体族偏好之前。可以以逗号分隔的列表指定多个具名字体——全部位于通用字体族偏好之前。包含空格的字体名称必须放在引号内，否则浏览器将无法识别。\n\
  \n![image](img/hot.jpg)\n\n养成将所有具名字体括在引号内的习惯。\n\n![image](img/1g.jpg) 创建一个包含带有多个跨度文本部分的段落的\
  \ HTML 文档。\n\n```html\n<p>The <span class=\"serif\">纽约市</span>引入职业足球的那天，与该市引入<span\
  \ class=\"fantasy\">纽约巨人队</span>是同一天。这是一个晴朗媚的<span class=\"mono\">1925 年 10 月的一个下午</span>，巨人队上场对阵<span\
  \ class=\"cursive\">法兰福德黄甲军</span>进行比赛。</p>\n```\n\n![image](img/htmlg.jpg)\n\n\
  family.html\n\n![image](img/2g.jpg) 添加一个包含建议整个段落默认字体的规则的样式表。\n\n```css\np { font-family\
  \ : “Arial Narrow”, sans-serif ; }\n```\n\n![image](img/3g.jpg) 接下来，添加为跨度文本建议字体的样式规则。\n\
  \n```css\nspan.serif { font-family : “Times New Roman”, serif ; }\nspan.fantasy\
  \ { font-family : “Castellar”, fantasy ; }\nspan.mono { font-family : “Courier”,\
  \ monospace ; }\nspan.cursive { font-family : “Segoe Script”, cursive ; }\n```\n\
  \n![image](img/4g.jpg) 保存 HTML 文档，然后在浏览器中打开网页，查看文本部分是否以具名字体或通用字体族出现。\n\n![image](img/pg215_1.jpg)\n\
  \n![image](img/forget.jpg)\n\n在每个 `font-family` 声明中指定通用字体族偏好是一个良好的做法。\n\n## 设置大小\n\
  \nCSS 提供了多种方法通过为 `font-size` 属性赋值，在样式规则声明中指定文本大小。最直观的方法是使用此处列出的任何单位作为绝对大小。\n\n![image](img/pg216.jpg)\n\
  \n| 关键字: | 等于: |\n| :--- | :--- |\n| xx-large | 24pt |\n| x-large | 17pt |\n| large\
  \ | 13.5pt |\n| medium | 12pt |\n| small | 10.5pt |\n| x-small | 7.5pt |\n| xx-small\
  \ | 7pt |\n\n使用左侧列出的关键字，medium 大是浏览器的默认字体大小，其余相对于该大小。\n\n使用 `em` 或百分比值来指定相对于浏览器默认字体的大小是更好的。例如，`1em`\
  \ (100%) 等同于 12pt；`1.5em` (150%) 等同于 18pt。\n\n![image](img/hot.jpg) 使用相对值而非绝对值来指定字体大小以获得最大的灵活性。\n\
  \n进一步的改进是在 `font-size` 属性中使用 `vw`（视口宽度）单位，其中 `1vw` 是当前视口的 1%。这允许文本大小适应显示设备或浏览器窗口。\n\
  \n文本的粗细或“权重”可以使用 `font-weight` 属性以及 `bold` 和 `normal` 关键字轻松调整。\n\n在所选元素的 `font-weight`\
  \ 属性上指定 `bold` 值会让普通文本显得较粗，而指定 `normal` 值会让粗体文本显得较细。实际上，浏览器使用不同的字体来实现这种效果——对于普通文本，它使用常规字重的字体（例如“Verdana”），但如果可用，对于粗体文本切换到该字体的加重变体（例如“Verdana\
  \ Bold”）。\n\n![image](img/1g.jpg) 创建包含四个段落的 HTML 文档\n\n```html\n<p>默认大小的中等大小文本</p>\n\
  <p class=\"lg\">150%的大号文本</p>\n<p class=\"sm\">60%的小号无衬线文本</p>\n<p class=\"huge\"\
  >双倍大小的粗体文本</p>\n```\n\nsize.html\n\n![image](img/2g.jpg) 添加一个包含相对于视口指定浏览器默认字体大小规则的样式表。\n\
  \n```css\nbody { font-size : 4vw ; }\n```\n\n![image](img/3g.jpg) 接下来，为第二个段落添加字体大小的规则。\n\
  \n```css\np.lg { font-size : 1.5em ; }\n```\n\n![image](img/4g.jpg) 现在，为第三个段落添加字体大小和通用字体族的规则。\n\
  \n```css\np.sm { font-size : 0.6em ; font-family : sans-serif ; }\n```\n\n![image](img/5g.jpg)\
  \ 最后，为第四个段落添加字体大小和字体字重的规则。\n\n```css\np.huge { font-size : 200% ; font-weight :\
  \ bold ; }\n```\n\n\n\n\n\n![image](img/6g.jpg)保存 HTML 文档，然后在浏览器中打开网页，查看每个段落的字体大小和字重\n\
  \n![image](img/pg217_1.jpg)\n\n![image](img/forget.jpg)\n\n无衬线字体被认为对于较小的文本更具可读性。\n\
  \n![image](img/hot.jpg)\n\n通过此示例，你可以调整浏览器窗口，查看字体大小变化如何适应当前的视口区域。\n\n## 变化样式\n\n\
  ### 倾斜文本\n\nCSS `font-style` 属性可以通过指定 `italic`（斜体）或 `oblique`（倾斜）关键字来请求浏览器使用当前字体的倾斜变体——这两者细有不同。\n\
  \n![image](img/pg218_1.jpg)\n\n当指定 `italic` 关键字时，浏览器会在字体数据库中寻找当前字体的斜体变体。这是一个真实的字体集，与当前的正体字体相似但在图形上有所不同，以产生每个正体字符的斜体版本。\n\
  \n当指定 `oblique` 关键字时，浏览器会在字体数据库中寻找当前字体的倾斜变体。这可能是一个真实的字体集——正体字体的倾斜版本——或者是一个生成的版本，即浏览器计算出的正体字体的倾斜版本。其中任一种都可以映射到浏览器字体数据库中的\
  \ `oblique` 关键字，并被 CSS `font-style` 属性调用。\n\n在现实中，使用 `italic` 或 `oblique` 关键字通常会产生相同的斜体文本外观，在任何情况下，都可以通过为元素的\
  \ `font-style` 属性指定 `normal` 关键字来恢复正体文本。\n\n### 小大写\n\n一个名为 `font-variant` 的 CSS\
  \ 属性可以指定 `small-caps`（小型大写）值，允许文本字符以流行的小型大写格式显示，使用两种不同大小的大写字母。所选元素中的大写文本将显示为大大写字母，但小写文本将显示为较小的大写字母。\n\
  \n浏览器可以使用字体集中的较小大写字母来实现小型大写效果，也可以通过生成计算出的较小版本。同样，通过指定 `normal` 作为 `font-variant`\
  \ 可以恢复普通文本。\n\n![image](img/hot.jpg)\n\n你可以为标题元素的 `font-variant` 属性指定 `small-caps`\
  \ 值，使文档标题更有趣。\n\n![image](img/1g.jpg)创建一个包含四个标题的 HTML 文档\n\n```html\n<h1>具有普通字体样式的标题</h1>\n\
  <h1 class=\"ital\">具有斜体字体样式的标题</h1>\n<h1 class=\"caps\">具有小型大写字母的标题</h1>\n<h1 class=\"\
  caps\">具有<span class=\"norm\">混合</span>变体的标题</h1>\n```\n\n![image](img/htmlg.jpg)\n\
  \nvariant.html\n\n![image](img/2g.jpg)添加一个包含规则的样式表，该规则用于为第二个标题指定斜体字体样式\n\n```css\n\
  h1h1.ital { font-style : italic ; }\n```\n\n![image](img/3g.jpg)接下来，添加一个规则为第三个标题指定小型大写字体变体\n\
  \n```css\nh1.caps { font-variant : small-caps; }\n```\n\n![image](img/4g.jpg)现在，添加规则指定第四个标题的某部分从小型大写字体变体恢复为正常，并添加背景以强调这种变化\n\
  \n```css\nspan.norm { font-variant : normal ;\nbackground : LightGreen ; }\n```\n\
  \n![image](img/5g.jpg)保存 HTML 文档，然后在浏览器中打开网页，查看每个标题的字体样式和变体\n\n![image](img/pg219_1.jpg)\n\
  \n## 使用简写\n\n非常有用的是，CSS 提供了一个 `font` 属性，可以在单个组合规则中指定各种字体偏好：\n\n`font-style | font-variant\
  \ | font-weight | font-size | font-family`\n\n![image](img/pg220_1.jpg)\n\n可以为组合字体简写属性的每个部分分配适当的值——例如，如下所示：\n\
  \n```css\np { font : italic small-caps bold medium \"Times\", serif ; }\n```\n\n\
  `font-size` 和 `font-family` 值是强制性的，但 `font-style`、`font-variant` 和 `font-weight`\
  \ 属性的前三个值是可选的，并且可以以任何顺序出现。这三个可选属性的每个值都可能完全省略，系统会自动假设一个普通值。\n\n重要的一点是，未显式指定的值仍将应用普通值——它不会继承自包含元素的值，这可能会产生一些意想不到的结果。例如，在由上述规则样式的包含段落元素（paragraph\
  \ element）中选择 `span` 元素的样式规则可能像这样：\n\n```css\nspan { font : large cursive ; }\n\
  ```\n\n此规则中显式指定的值将应用到 `span` 元素的 `font-size` 和 `font-family` 属性，而对其 `font-style`、`font-variant`\
  \ 和 `font-weight` 属性将应用普通值——因此，`span` 元素内的文本不会继承段落的斜体、小型大写或加粗值。\n\n组合字体规则提供的另一种可能性是，通过在\
  \ `font-size` 值之后添加正斜杠和单位值来指定 `line-height`（每行之间的间距）。这对于在出现各种字体大小的地方建立通用的行间距非常有用。\n\
  \n![image](img/snake.jpg)\n\n记住，除非显式指定，否则组合 `font` 规则的每个部分都将应用 `normal` 值——这将覆盖当前父元素的值。\n\
  \n![image](img/1g.jpg)创建一个包含多个部分的段落 HTML 文档\n\n```html\n<p><span class=\"head\"\
  >运动鞋比赛</span>\n1934 年<span class=\"giant\">纽约巨人队</span>击败了<span class=\"bears\"\
  >芝加哥熊队</span>，\n半场时比分为<span class=\"score\">30-13</span>，主教练<span class=\"coach\"\
  >Steve Owen</span>为球队提供了运动鞋，以增加在冰面的抓地力。球队在下半场获得了四达 touchdowns，将比赛变成了一场<span class=\"\
  giant\">巨人队</span>的大胜。</p>\n```\n\n![image](img/htmlg.jpg)\n\nfont.html\n\n![image](img/2g.jpg)添加带有段落和每个\
  \ span 元素字体规则样式表\n\n```css\np { font : normal small/1.3em \"Courier\",monospace\
  \ ; }\nspan.head { font : 350% \"Pristina\", cursive ; }\nspan.giant { font : small-caps\
  \ large \"Castellar\", fantasy ; }\nspan.bears { font : large \"Arial\", sans-serif\
  \ ; }\nspan.score { font : bold small \"Verdana\", sans-serif ; }\nspan.venue {\
  \ font : italic medium \"Arial\", sans-serif ; }\nspan.coach { font : medium \"\
  Comic Sans\", cursive ; }\n```\n\n## 对齐文本\n\n段落中的英文文本通常水平对齐到段落的左边缘，这是段落元素内容框中显示文本的默认行为。\n\
  \n![image](img/pg222_1.jpg)\n\n此外，CSS 提供了一个 `text-align` 属性可以明确指定文本在段落元素内容框内的水平对齐方式，使用\
  \ `left`、`center`、`right` 或 `justify` 关键字。正如预期，`left` 值将每行对齐到段落的左边缘，`right` 值将每行对齐到段落的右边缘，`center`\
  \ 值将每行在两个边缘之间居中对齐。\n\n也许更有趣的是，`justify` 值将每个整行对齐到内容框的左右边缘，并调整字符和单词之间的间距，使每行的长度相等。\n\
  \n\n\n\n\n在显示文本行时，浏览器会自动计算行高以适应内容大小——通常这将是字体高度的 1.2 倍。然后，浏览器将文本垂直居中显示在计算高度的不可“行框”（line\
  \ boxes）中。\n\nCSS `vertical-align` 属性可以使用 `baseline`、`sub` 和 `super` 关键字显式指定文本的垂直对齐方式。`baseline`\
  \ 值指定居中垂直对齐：这是默认行为。`sub` 和 `super` 值会增加行框所在的外层容器的边界，并将文本分别向下或向上移动，以显示下标或上标。\n\n\
  还可以通过向 `vertical-align` 属性指定正值或负的单位值或百分比值，来将内容向上或向下移动。或者，也可以使用 `top`、`middle` 和\
  \ `bottom` 关键字来指定与最顶部、中间或最底部内容的垂直对齐。\n\n还可以为 `vertical-align` 属性指定另外两个关键字 `text-top`\
  \ 和 `text-bottom`，以便将其他内联内容框（例如图像元素的框）垂直对齐到行框的顶部或底部。\n\n![image](img/forget.jpg)\n\
  \n`text-align` 属性仅控制内容框内的文本对齐——它不用于内容框居中。关于如何居中内容框的详情，请参见此处。\n\n![image](img/hot.jpg)\n\
  \n通常下标和上标比文本小得多——可以通过指定 `sub` 或 `super` 值来创建垂直偏移，然后应用 `font` 规则来减小偏移文本的大小。\n\n![image](img/1g.jpg)创建一个包含三个段落的\
  \ HTML 文档\n\n```html\n<p>Enjoy the sunsets, the restaurants, the fishing, the diving...\
  \ the lifestyle of the Florida Keys!</p>\n<p class=”just”>Enjoy the sunsets, the\
  \ restaurants, the fishing, the diving... the lifestyle of the Florida Keys!</p>\n\
  <p>Line <span class=”up”>Superscript</span**\n<span class=”down”>Subscript</span>\n\
  <span class=”top”>Top</span></p>\n```\n\n![image](img/htmlg.jpg)\n\nalign.html\n\
  \n![image](img/2g.jpg)添加一个带有指定字体和颜规则样式表\n\n```css\np, span { font : medium monospace\
  \ ;\nbackground : LightGreen ; border : 1px solid LimeGreen ; }\n```\n\n![image](img/3g.jpg)接下来，添加一条规则使第二个段落内容框内的文本两端对齐\n\
  \n```css\np.just { text-align : justify ; }\n```\n\n![image](img/4g.jpg)现在，添加规则调整第三段落内跨度文本的垂直对齐\n\
  \n```css\nspan.up { vertical-align : super ; }\nspan.down { vertical-align : sub\
  \ ; }\nspan.top { vertical-align : top ; }\n```\n\n![image](img/5g.jpg)保存 HTML 文档，然后在浏览器中打开网页以查看对齐效果\n\
  \n![image](img/pg223_1.jpg)\n\n![image](img/hot.jpg)\n\n注意 `justify` 关键字如何将每行完整内容对齐到内容框边缘，并调整字符和单词之间的间距。\n\
  \n### 控制间距\n\n打印文本最常见的特征之一是段落首行的缩进，以提高可读性。对于 HTML 段落中的文本，可以使用 `text-indent` 属性指定缩进大小（例如\
  \ `5em`）来轻松实现。\n\n![image](img/pg224_1.jpg)\n\n或者，缩进值可以是百分比，浏览器将相对于总行长度进行缩进。例如，在宽度为\
  \ 500px 的 `div` 容器元素内的段落元素中，指定 `text-indent` 值为 10% 将将首行开头缩进 50px（500 x 10% = 50）。\n\
  \n也可以为 `text-indent` 属性指定负值，但这可能会产生不一致的结果，因此最好避免。\n\n通过向 CSS `word-spacing` 属性显式指定值，可以从正常的默认间距调整每个单词之间的间距。请注意，所指定的值会加在默认间距上以增加间距。例如，指定单位值\
  \ `5em` 宽会将间距增加到“正常+5em”，而不是总共 5em 的间距。\n\n同样地，也可以通过向 CSS `letter-spacing` 属性显式指定值，从正常的默认间距调整每个字母之间的间距。这也会将指定的值加到默认间距上以确定总空间。例如，指定单位值\
  \ `5em` 将间距增加到“正常+5em”，而不是总共 5em 的间距。\n\n`word-spacing` 和 `letter-spacing` 属性均接受\
  \ `normal` 关键字来恢复正常间距。此外，它们都可能被此处描述的 `text-align` 属性覆盖，后者在决定整行的外观方面具有优先级。\n\n![image](img/hot.jpg)\n\
  \n`word-spacing` 和 `letter-spacing` 属性都可以接受负值——产生一些有趣的结果。\n\n![image](img/1g.jpg)创建一个包含两个跨度文本段落的\
  \ HTML 文档\n\n```html\n<p>The Geologic Story at the\n<span class=”spread”>Grand Canyon</span\n\
  attracts the attention of the world for many reasons, but perhaps its greatest significance\
  \ lies in the geologic record preserved and exposed here.</p><p>The rocks at <span\
  \ class=”spread”>Grand Canyon</span>\nare not inherently unique but\n<span class=”spread”>variety\
  \ of rocks clearly exposed.</p></p>\n```\n\n![image](img/htmlg.jpg)\n\nspace.html\n\
  \n![image](img/2g.jpg)添加一个带有缩进每个段落开头规则的样式表\n\n```css\np { text-indent : 5em ; }\n\
  ```\n\n![image](img/3g.jpg)接下来，添加样式规则增加字母间距并为跨区域设置背景颜色\n\n```css\nspan.spread {\
  \ letter-spacing : 1em ;\nbackground : LightGreen ; }\n```\n\n![image](img/4g.jpg)现在，添加样式规则增加单词间距并为跨度文本设置背景颜色\n\
  \n```css\nspan.space { word-spacing : 1.5em ;\nbackground : LawnGreen ; }\n```\n\
  \n![image](img/5g.jpg)保存 HTML 文档，然后在浏览器中打开网页查看缩进和间距\n\n### 装饰文本\n\n样式规则可以使用 CSS\
  \ `text-decoration` 属性配合 `underline`、`overline` 和 `line-through` 关键字为文本添加装饰线。这些行为分别是在文本下方添加线、上方添加线以及穿过文本。\n\
  \n![image](img/pg226_1.jpg)\n\n可以为 `text-decoration` 属性指定 CSS `none` 关键字以防止出现意外装饰——这对于显示不带下划线的链接非常流行\n\
  \n可以为 `text-decoration` 属性指定多个空格分隔的列表，以对文本应用多种装饰\n\n另一种增强文本的方法是使用 `text-transform`\
  \ 属性，通过 `uppercase`、`lowercase` 或 `capitalize` 关键字指定所选元素的大小写。\n\n![image](img/1g.jpg)创建一个包含跨度文本段落和另一个包含链接段落的\
  \ HTML 文档，由水平线分隔\n\n```html\n<p class=”main”>You know that it’s\n<span class=”under\
  \ caps”>important</span\nwhen it is\n<span class=”under”>underlined</span>\n<br>and\
  \ that it’s been\n<span class=”thru caps”>canceled</span>\nwhen<br>it has been\n\
  <span class = “thru”>struck through</span>\n<br>but you also must remember to<br>\n\
  <span class = “rails upper”>read between the lines</span>\n<br>\n<span class=“signature\
  \ lower”> - MIKE MCGRATH</span>\n</p>\n<hr>\n\n<p>\n<a href=“https://ineasysteps.com”>Regular\
  \ link</a> |\n<a class=“plain” href=“https://ineasysteps.com”>\nPlain link</a>\n\
  </p>\n```\n\n\n\n\n\n如果删除了默认下划线，某些用户可能无法识别链接。\n\n![image](img/2g.jpg)\n\n添加一个包含规则的样式表，以指定字体和颜色\n\
  \n```css\np.main { font : medium “Courier”, monospace ;\nbackground : LightGreen\
  \ ; }\nspan.signature { font : 2em “Lucida Handwriting”, cursive ;\ncolor : Green\
  \ ; }\n```\n\n![image](img/3g.jpg)\n\n接下来，添加样式规则为被跨的文本添加装饰线\n\n```css\nspan.under\
  \ { text-decoration : underline ; }\nspan.thru { text-decoration : line-through\
  \ ; }\nspan.rails { text-decoration : overline underline ; }\n```\n\n![image](img/4g.jpg)\n\
  \n现在，添加样式规则来转换被跨文本的大小写\n\n```css\nspan.lower { text-transform : lowercase ; }\n\
  span.upper { text-transform : uppercase ; }\nspan.caps { text-transform : capitalize\
  \ ; }\n```\n\n![image](img/5g.jpg)\n\n最后，添加样式规则从移除链接的默认下划线\n\n```css\na.plain {\
  \ text-decoration : none ; }\n```\n\n![image](img/6g.jpg)\n\n保存 HTML 文档，然后在浏览器中打开网页以查看文本装饰和大小写转换\n\
  \n![image](img/pg227_1.jpg)\n\n![image](img/hot.jpg)\n\n注意看小写是如何转换为大写的，以及大写是如何转换为小写的。\n\
  \n## 改变方向\n\n文本内容内空白的默认处理方式是将多个空格合并为单个空格，但可以通过 CSS 的 `white-space` 属性进行控制。指定 `pre`\
  \ 关键字将保留原始文本中出现的所有空格，包括任何换行符。相反，通过指定 `no-wrap` 关键字可以防止块级中文本的自动换行。此外，可以指定 `pre-wrap`\
  \ 关键字在保留空格的同时仍允许文本正常换行，或者指定 `pre-line` 关键字在保留换行符的同时合并多个空格。\n\n![image](img/pg228_1.jpg)\n\
  \n文本行的默认从左到右方向可以通过向 CSS `direction` 属性指定 `rtl` 关键字来更改为从右到左，并使用 `ltr` 关键字恢复正常方向。\n\
  \n有趣的是，当使用 `rtl` 关键字更改行方向时，单词从右向左出现，但英语语言字符的顺序被保留了，因此每个单词仍然能够从左到右正确读取。\n\n这种智能功能还允许文本在单行中以不同的方向呈现——例如，包含从右到左读取的语言，如希伯来语和阿拉伯语。浏览器使用复杂的双向算法（Bidirectional\
  \ algorithm）检查每个字符的 Unicode 值，以确定每个单词应该显示的方向——那些来自从右到左语言的字符会自动在该方向显示，即使它们在 HTML\
  \ 源代码中是从左到右逻辑编写的。然而，通过向 `unicode-bidi` 属性指定 `bidi-override` 关键字可以关闭自动的双向算法。\n\n\
  ![image](img/hot.jpg)\n\n你可以在 [www.unicode.org](http://www.unicode.org) 在线发现更多 Unicode\
  \ 的信息，可以在 [www.w3.org](http://www.w3.org) 在线发现更多字符实体的信息。\n\n![image](img/1g.jpg)\n\
  \n创建一个包含带有希伯来实体和阶进空白的段的 HTML 文档\n\n```html\n<p>Hebrew “Congratulations” with:</p>\n\
  ```\n\n![image](img/htmlg.jpg)\n\ndirection.html\n\n![image](img/2g.jpg)\n\n接下来，使用相同的实体开始一个定义列表\n\
  \n```html\n<dl>\n  <dt>LTR Default Direction (lines begin at the LEFT):</dt>\n \
  \ <dd class=\"ltr\">...</dd>\n\n  <dt>RTL Custom Direction (lines begin at the RIGHT):</dt>\n\
  \  <dd class=\"rtl\">...</dd>\n\n  <dt>LTR Explicit Direction + Bidirectional Override:</dt>\n\
  \  <dd class=\"bidi-off ltr\">No longer reads as</dd>\n</dl>\n```\n\n![image](img/4g.jpg)\n\
  \n添加一个包含规则的样式表，为段落设置背景色并保留空白\n\n```css\np,dd { background : LightGreen ; }\np {\
  \ whitespace : pre ; }\n```\n\n![image](img/5g.jpg)\n\n现在，添加样式规则来设置列表中每个定义的文本方向\n\
  \n```css\ndd.ltr { direction : ltr ; }\ndd.rtl { direction : rtl ; }\ndd.bidi-off\
  \ { unicode-bidi : bidi-override ; }\n```\n\n![image](img/6g.jpg)\n\n保存 HTML 文档，然后在浏览器中打开网页以查看保留的空白和改变的文本方向\n\
  \n![image](img/pg229_1.jpg)\n\n![image](img/hot.jpg)\n\n注意 `rtl` 值按从右到左的正确顺序显示字符。\n\
  \n![image](img/snake.jpg)\n\n通常，对从右到左语言字符的默认处理实现了预期效果。在实践中，很少需要覆盖 Unicode 双向算法。\n\
  \n## 增强文本\n\nCSS 提供了五个伪元素 `::before`、`::after`、`::first-letter`、`::first-line` 和\
  \ `::selection`，它们可以包含在样式规则选择器中以增强所选元素的内容\n\n![image](img/pg230_1.jpg)\n\n`::first-letter`\
  \ 和 `::first-line` 伪元素用于为文本开头添加样式。`::selection` 伪元素用于为用户选中的文本添加样式。\n\n![image](img/forget.jpg)\n\
  \n在 CSS 中，所有伪元素以两个冒号开头。`::before` 和 `::after` 伪元素用于在原始内容周围插入内容。例如，`p::before` 选择器在段落开始之前插入内容。生成的内容不仅限于文本字符串，因为\
  \ `url()` 函数可以用于向 `content` 属性指定非文本内容。此外，`attr()` 函数可以用于向 `content` 属性指定所选元素的属性名称，其赋值值应作为内容插入。\n\
  \n多个要插入的项目可以以空格分隔列表的形式指定给 `content` 属性——使用上述任何一种。\n\n![image](img/1g.jpg)\n\n创建一个包含标题和四个段落的\
  \ HTML 文档，每个段落都包含指向同一资源的链接\n\n```html\n<h1>Pseudo Elements</h1>\n<p>Get more <a\
  \ href=\"info.pdf\">info</a>s</p>\n<p>Get more <a href=\"info.pdf\" class=\"quote\"\
  >info</a>s</p>\n<p>Get more <a href=\"info.pdf\" class=\"pdf\">info</a>s</p>\n<p>Get\
  \ more <a href=\"info.pdf\" class=\"att\">info</a>s</p>\n```\n\n![image](img/htmlg.jpg)\n\
  \npseudo.html\n\n![image](img/pdfg.jpg)\n\ninfo.pdf\n\n![image](img/2g.jpg)\n\n\
  添加一个包含规则的样式表，设置标题的第一个字母和选中文本——如果被用户选中\n\n```css\nh1::first-letter { color : ForestGreen\
  \ ; }\nh1::selection { background : LawnGreen ; }\n```\n\n\n\n\n\n`a[href].quote::before\
  \ { content : open-quote ; color : Blue ; }`\n\n`a[href].quote::after { content\
  \ : close-quote ; color : Blue ; }`\n\n![image](img/5g.jpg)然后，添加一条规则在链接后插入图像\n\n\
  `a[href].pdf::after { content : url( pdf-ico.png ) ; }`\n\n![image](img/pngg.jpg)\n\
  \n`pdf-ico.png`\n\n32px x 32px\n\n![image](img/6g.jpg)最后，添加规则在链接后插入一个彩色属性值，以显示链接资源文件的名称\n\
  \n`a[href].att::after { content : “(“ attr(href) “)“ ; color : Blue ; }`\n\n![image](img/7g.jpg)保存\
  \ HTML 文档，然后在浏览器中打开网页，并选择标题文本的一部分以查看由 CSS 样式规则插入的内容\n\n![image](img/pg231_1.jpg)\n\
  \n![image](img/hot.jpg)\n\n插入的内容被添加到所选元素的内容框内 – 因此此示例中对链接的增强成为了链接的一部分。\n\n## 章节编号\n\
  \n在示例此处中引入的 CSS `::before` 伪元素可以使用 `counter( )` 函数插入生成的内容，为 HTML 文档的章节自动编号。这指定了要插入到\
  \ `( )` 括号内内容的计数器名称。\n\n![image](img/pg232_1.jpg)\n\n用于计算所选元素实例数的计数器必须首先通过指定选定的名称和作为空格分隔列表的\
  \ `counter-increment` 属性的增量值来创建。\n\n计数器默认从零开始计数，并且每有一个所选元素实例都会按指定的增量值增加。可选情况下，可以从规则中省略显式指定的增量值，此时假设\
  \ 1 为增量值。例如，声明 `counter-increment : num ;` 会创建一个名为“num”的计数器，它将从零开始计数并每次递 1。\n\n\
  此外，通过向 `counter-reset` 属性指定作为空格分隔列表的计数器名称和整数值，可以使计数器从当前计数数字以外的数字继续计数。通常，这会指定一个零整数值以重新开始计数。\n\
  \n一旦创建了计数器就可以作为 CSS 伪元素的生成内容插入到所选元素之前。\n\n![image](img/1g.jpg)创建一个具有不同尺寸标题的 HTML\
  \ 文档\n\n<h2>Topic</h2>\n<h3>Section</h3>\n<h3>Section</h3>\n<h3>Section</h2>  <!--\
  \ 注意：此处原文可能存在标签闭合错误(h2 应为 h3)，按原样保留 -->\n<h2>Topic</h2>\n<h3 class=”restart”>Section</h3>\n\
  <h3>Section</h3>\n<h3>Section</h3>\n\n![image](img/htmlg.jpg)\n\n`counter.html`\n\
  \n![image](img/2g.jpg)添加一个样式表，其中包含一条规则，为较大的标题元素创建一个计数器，该计数器将每次递增 1\n\n```css\nh2\
  \ { counter-increment : num 1 ; }\n```\n\n![image](img/3g.jpg)接下来，添加样式规则为较小的标题元素创建一个计数器，它将每次递增\
  \ 1\n\n```css\nh3 { counter-increment : sub 1 ; text-indent : 10% ; }\n```\n\n![image](img/4g.jpg)现在，添加样式规则在每个较大的标题之前插入当前的较大标题计数器值，并设置计数器的字体颜色背景色\n\
  \n```css\nh2::before { content : counter(num) “ ” ;\nbackground : Green ; color\
  \ : White ; }\n```\n\n![image](img/5g.jpg)然后，添加样式规则在每个较小的标题之前插入当前的较大和较小标题计数器值，并设置该背景颜色\n\
  \n```css\nh3::before { content : counter(num) “.” counter(sub) “ “ ;\nbackground\
  \ : LawnGreen ; }\n```\n\n![image](img/6g.jpg)最后，添加样式规则在每个较大的标题元素之后重置较小的标题计数器\n\n\
  ```css\nh3.restart { counter-reset : sub 0 ; }\n```\n\n![image](img/7g.jpg)保存 HTML\
  \ 文档然后在浏览器中打开网页，查看插入在每个标题之前的生成的计数器值\n\n![image](img/pg233_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n注意此示例中的生成内容包含一个用于格式化的空格。\n\n## 总结\n\n- 样式规则可以按名称建议特定的字体，以及通用的字体族，如 serif、sans-serif、monospace、cursive\
  \ 或 fantasy。\n- 可以使用关键字或绝对大小指定 `font-size`，但建议使用相对大小以获得灵活性。\n- `font-weight` 可以指定为加粗（bold）或正常（normal）。\n\
  - `font-style` 可以指定为斜体（italic）或正常（normal）。\n- `font-variant` 可以指定为小型大写（small-caps）或正常（normal）。\n\
  - 字体简写属性可以指定文本样式、变体、权重、大小和字体的值。\n- 使用字体简写属性时，需要 `font-size` 和 `font-family` 的值，但其他值是可选的。\n\
  - 通过指定 `text-align` 为左、中、右或两端，可以在文本在内容框内进行水平对齐。\n- 通过指定 `vertical-align` 为顶、中、底，可以在文本在内容框内进行垂直对齐。\n\
  - 文本间距可以通过 `text-indent`、`word-spacing` 和 `letter-spacing` 来指定。\n- 可以通过指定 `text-decoration`\
  \ 为下划线、上线或删除线对文本进行装饰。\n- 可以通过指定 `text-transform` 为大写、小写或首字母大写对文本进行转换。\n- 文本中的多个空格通常会被合并为一个空格，但可以使用\
  \ `white-space` 属性保留。\n- 文本默认从左到右的方向可以通过 `direction` 属性更改为从右到左。\n- CSS 伪元素可以包含在选择器之后以增强内容。\n\
  - 网页的章节可以使用 `counter( )` 函数自动编号。\n\n| 组织表格与列表 | ![image](img/pg235_1.jpg) | *本章演示了如何样式表格和列表。*\
  \ |\n\n## 构建列\n\n现在建议网页作者不要使用 HTML 表格进行布局，而是使用 CSS，但表格仍然是页面内容呈现信息的极具价值的格式。\n\n![image](img/pg236_1.jpg)\n\
  \n在显示 HTML 表格时，浏览器默认会自动创建一个适应内容的表格布局。这通常产生一个列宽不等的表格，每列的宽度由该列中任何单元格中最宽的内容决定。此过程需要浏览器在计算出表格布局之前对表格内容进行详细检查，对于大型表格，在能够绘制表格之前可能需要一段时间。\n\
  \nCSS 提供了一种替代方案，允许浏览器在不检查整个表格内容的情况下快速计算出表格布局——可以通过表格元素的 `table-layout` 属性指定 `fixed`\
  \ 关键字来设置固定布局。\n\n在固定布局中，浏览器只需要考虑表格本身的宽度以及第一行中列和单元格的宽度即可确定表格布局，如下：\n\n- 整体表格宽度将是指定的宽度值或所有列宽值之和中的较大者。\n\
  - 指定的列宽设置该列的宽度。\n- 当没有指定的列宽值时，指定的单元格宽度设置该列的宽度。\n- 任何未对列或单元格指定宽值的列，都将在表格宽度内等宽分布。\n\
  \n\n\n\n另一种，样式规则可以显式指定使用默认表格布局方案，在该方案下，浏览器通过为 `table-layout` 属性分配 `auto` 值，根据其内容计算列宽。\n\
  \n当表格包含 `caption` 元素时，可以通过为表格元素的 CSS `caption-side` 属性指定关键字 `top` 或 `bottom` 来建议标题的位置。\n\
  \n![image](img/hot.jpg)\n\n指定第一列的宽度并设置固定布局规则，以创建一个自定义宽度的第一列，以及宽度彼此相等的其他列。\n\n![image](img/1p.jpg)创建一个包含两个具有相似内容的表格的\
  \ HTML 文档\n\n```html\n<table><caption>Auto Layout</caption><tr><td>Text content</td><td>This\
  \ is text content wider than 130px</td><td>Text content</td></tr></table>\n<table\
  \ class=\"fixed”><caption>Fixed Layout</caption><tr><td>Text content</td><td>This\
  \ is text content wider than 130px</td><td>Text content</td></tr></table>\n```\n\
  \n![image](img/htmlp.jpg)\n\ncolumns.html\n\n![image](img/2p.jpg)添加一个包含指定表格宽度及其特征规则的样式表\n\
  \n```css\ntable { width : 500px ; border : 2px dashed DeepPink ;\ncaption-side :\
  \ top ; text-align : center ; margin : 0 0 30px ; }\n```\n\n![image](img/3p.jpg)接下来，添加样式规则为每个表格单元格和标题着色\n\
  \n```css\ntd { border : 2px solid DeepPink ; }\ncaption { background : Pink ; }\n\
  ```\n\n![image](img/4p.jpg)现在，添加样式规则为第二个表格指定固定尺寸的列方案\n\n```css\ntable.fixed { table-layout\
  \ : fixed ; }\n```\n\n![image](img/5p.jpg)保存 HTML 文档，然后在浏览器中打开网页，查看同时用自动布局和固定布局方案绘制的表格\n\
  \n![image](img/pg237_1.jpg)\n\n![image](img/forget.jpg)\n\n`caption-side` 属性可以建议标题可能出现，但对标题的实际处理取决于特定的浏览器。\n\
  \n### 单元单元\n\n表格单元格边界之间的距离可以指定为 CSS `border-spacing` 属性的单位值。这轻松地允许单元格在表格中保持一定的距离。\n\
  \n![image](img/pg238_1.jpg)\n\n指定的单个 `border-spacing` 值将均匀应用于所有单元格间隙——这与 HTML 的\
  \ `cellspacing` 属性非常相似。\n\n然而，CSS 提供了更大的灵活性，允许通过空格分隔的列表为 `border-spacing` 属性指定两个值。第一个将应用于每个表格单元格左侧和右侧的水平间距，第二个应用于每个单元格顶部和底部的垂直间距。这意味着可以为整个表格的水平和垂直间距指定不同的距离。\n\
  \nCSS 提供的另一种可能性是隐藏不包含内容的单元格。这些通常由于表格的网格格式导致，网格格式并不总是能方便地匹配所需的单元格数量——例如，在五行两列的表格中显示九个内容项。\n\
  \n使用 CSS `empty-cells` 属性创建一个样式规则并指定 `hide` 值，将导致浏览器不显示任何完全没有内容的单元格的边界和背景。包含任何内容的单元格，即使仅仅是一个\
  \ `&nbsp;`（不换行空格实体），仍然是可见的。\n\n相反，样式规则可以通过为 `empty-cells` 属性指定 `show` 值来显式确保显示空单元格。\n\
  \n被隐藏的空单元格在表格布局中仍然继续存在，因为它们的 `border-spacing` 值被保留了。例如，当 `border-spacing` 属性设置为\
  \ `20px` 且 `empty-cells` 属性指定为 `hide` 值时，单个空单元格将不显示，但周围的单元格仍保持 40 像素的距离——而不是如果隐藏单元格不存在时仅有的\
  \ 20 像素距离。\n\n![image](img/forget.jpg)\n\n`border-spacing` 属性不能指定负值。\n\n![image](img/snake.jpg)\n\
  \n当为 `border-collapse` 属性指定 `collapse` 值时，`empty-cells` 属性不生效——参见此处。\n\n![image](img/1p.jpg)创建一个包含两个具有相似内容的表格的\
  \ HTML 文档——包括一个空单元格\n\n```html\n<table><tr><td>1</td><td></td><td>3</td></tr></table>\n\
  <table class=\"space”><tr><td>1</td><td></td><td>3</td></tr></table>\n```\n\n![image](img/htmlp.jpg)\n\
  \nhide.html\n\n![image](img/2p.jpg)添加一个包含指定表格宽度及其特征的样式表\n\n```css\ntable { width\
  \ : 500px ;\nmargin : 20px ; border : 2px dashed DeepPink ; }\n```\n\n![image](img/3p.jpg)接下来，添加样式规则为每个表格单元格和边界着色\n\
  \n```css\ntd { border : 2px solid DeepPink ; }\n```\n\n![image](img/4p.jpg)现在，添加样式规则为第二个表格指定边界间距并隐藏空单元格\n\
  \n```css\ntable.space { border-spacing : 20px ; empty-cells : hide ; }\n```\n\n\
  ![image](img/5p.jpg)保存 HTML 文档，然后在浏览器中打开网页，查看绘制有可见和隐藏空单元格的表格\n\n![image](img/pg239_1.jpg)\n\
  \n### 合并边界\n\n相邻表格的边界以及表格单元格边界可以通过为 CSS `border-collapse` 属性指定 `collapse` 关键字来使其“合并”为单条边界。这需要浏览器执行一系列评估，比较现有的边界，以确定合并后的边界应该什么样：\n\
  \n![image](img/pg240_1.jpg)\n\n- **可见性评估**：如果待合并的边界之一的 `border-style` 值为 `hidden`，则该值具有优先级——因此该位置的合并边界将是隐藏。\n\
  - **宽度评估**：当两个具有不同 `border-width` 值的可见边界要合并时，最高值具有优先级——因此合并后的边界将是较大的宽度。\n- **样式评估**：当两个等宽的可见边界要合并时，其样式值按以下降序设置优先级：`double`、`solid`、`dashed`、`ridge`、`outset`、`groove`、`inset`。当等宽且样式相同的可见边界合并时，边界颜色按以下降序顺序确定：`cell`、`row`、`row\
  \ group`、`column`、`column group`、`table`。\n\n当表格边界宽 `2px` 与单元格边界宽 `5px` 比较时，合并边界的效果是宽度为\
  \ `5px`。\n\n比较相邻的 `border-style` 值 `dotted` 和 `double` 时，合并后的样式为 `double`——优先级更高。\n\
  \n同样，比较相邻的 `border-style` 值 `dotted` 和 `solid` 时，合并后的样式为 `solid`——优先级更高。\n\n![image](img/forget.jpg)\n\
  \n也可以为 `border-collapse` 属性指定 `separate` 关键字——显式防止边界合并。\n\n![image](img/1p.jpg)创建一个包含两个具有相似内容的表格的\
  \ HTML 文档\n\n```html\n<table><tr><td class=\"twin”>1</td><td class=\"dots”>2</td><td\
  \ class=\"full”>3</td></tr></table>\n<table class=\"fold”><tr><td class=\"twin”>1</td><td\
  \ class=\"dots”>2</td><td class=\"full”>3</td></tr></table>\n```\n\n![image](img/htmlp.jpg)\n\
  \ncollapse.html\n\n\n\n\n\n```css\ntable { border : 2px solid DeepPink ; }\ntd.twin\
  \ { border : 5px double DeepPink ; }\ntd.dots { border : 5px dotted DeepPink ; }\n\
  td.full { border : 5px solid DeepPink ; }\n```\n\n![image](img/4p.jpg)现在，添加一条样式规则来合并第二个表格的边框\n\
  \n```css\ntable.fold { border-collapse : collapse ; }\n```\n\n![image](img/5p.jpg)保存\
  \ `HTML` 文档，然后在浏览器中打开该网页，查看用普通边框和合并边框绘制的表格\n\n![image](img/pg241_1.jpg)\n\n## 分配特性\n\
  \nCSS `display` 属性可以接受一系列值，用于指定所选元素应视为表格组件——模拟浏览器自动应用于表格组件的 HTML 标签的默认行为：\n\n![image](img/pg242_1.jpg)\n\
  \n| **HTML 标签:** | **CSS 等效值:** |\n| :--- | :--- |\n| `<table>` | `table` |\n| `<tr>`\
  \ | `table-row` |\n| `<thead>` | `table-header-group` |\n| `<tbody>` | `table-row-group`\
  \ |\n| `<tfoot>` | `table-footer-group` |\n| `<col>` | `table-column` |\n| `<colgroup>`\
  \ | `table-column-group` |\n| `<th>` | ![image](img/bracket.jpg) table-cell |\n\
  | `<td>` | |\n| `<caption>` | `table-caption` |\n\n上表列出了可以指定给 `display` 属性的 CSS\
  \ 值，以及它们最接近的 HTML 标签。这些值可以用于为 `XML` 文档中的元素指定表格特性，以便浏览器像显示 `HTML` 表格一样显示其内容。\n\n\
  ![image](img/1p.jpg)创建一个 `XML` 文档，指定一个 CSS 样式表来格式化其元素内容\n\n```xml\n<?xml version=”1.0”\
  \ encoding=”UTF-8”?>\n<?xml-stylesheet href=”xtable.css” type=”text/css”?>\n<league><caption>西甲前三名</caption>\n\
  <headers>\n<lbl>排名</lbl> <lbl>球队</lbl> <lbl>积分</lbl>\n</headers>\n<rows>\n<team>\
  \ <pos>1</pos> <name>巴塞罗那</name>\n<pts>84</pts> </team>\n<team> <pos>2</pos> <name>皇家马德里</name>\n\
  <pts>80</pts> </team>\n<team> <pos>3</pos> <name>维利亚亚</name>\n<pts>65</pts> </team>\n\
  </rows>\n</league>\n```\n\n![image](img/xmlp.jpg)\n\nxtable.xml\n\n![image](img/2p.jpg)保存\
  \ `XML` 文档，创建一个包含规则的样式表，为 XML 标签分配表格特性\n\n```css\ncaption { display : table-caption\
  \ ; }\nleague { display : table ; }\nheaders { display : table-header-group ; }\n\
  rows { display : table-row-group ; }\nteam { display : table-row ; }\nname, pos,\
  \ pts, lbl { display : table-cell ; }\n```\n\n![image](img/cssp.jpg)\n\nxtable.xml\n\
  \n![image](img/3p.jpg)接下来，添加指定表格特性的样式规则\n\n```css\nleague { margin : auto ; margin-top:\
  \ 20px ; width : 300px ;\nborder-spacing : 3px ; border : 8px ridge DeepPink ; }\n\
  ```\n\n![image](img/4p.jpg)现在，添加样式规则为表头和行单元上色\n\n```css\nheaders { background :\
  \ DeepPink ; color : White ; }\nrows { background : Pink ; }\n```\n\n![image](img/5p.jpg)将样式表与\
  \ XML 文档保存在一起，然后在浏览器中打开 XML 文档查看表格\n\n![image](img/pg243_1.jpg)\n\n## 选择标记\n\n列表“标记”（marker）指示列表项的开始——通常是无序列表\
  \ `<ul>` 中的项目符号，或有序列表 `<ol>` 中的递增数字。浏览器在每种情况下都会对项目进行计数，但通常仅将其用于有序列表显示中的项目编号。\n\n\
  ![image](img/pg244_1.jpg)\n\nCSS `list-style-type` 属性可以为任何列表指定另一种类型的标记——因此无序列表可以有数字标记，有序列表也可以根据需要具有项目符号。\n\
  \n关键字允许将符号标记类型指定为 `disc`、`circle` 或 `square`，并将数字标记类型指定为 `lower-roman`、`upper-roman`、`decimal`\
  \ 或 `decimal-leading-zero`。\n\n字母标记类型可以使用 `lower-latin`、`upper-latin` 和 `lower-greek`\
  \ 关键字指定。此外，CSS 规范还为其他字母提供了关键字，如 `armenian`（亚美尼亚语）和 `georgian`）——但需要合适的字体才能让浏览器正确显示标记。\n\
  \n`list-style-type` 属性还可以指定 `none` 值来显式抑制标记使其不显示，尽管它们仍然保留在项目计数中。\n\n可选情况下，可以通过在\
  \ `list-style-image` 属性的 CSS `url()` 函数括号中指定路径，将图像作为标记。\n\n![image](img/1p.jpg)创建一个包含三个列表加一个嵌套列表的\
  \ HTML 文档\n\n```html\n<ol class=\"outside-markers\">\n<li>List<li>Markers<li>Outside\
  \ content box</li>\n</ol>\n```\n\n\n\n\n</ol>\n\n<ol class=\"inside-markers\">\n\
  <li>列表</li>\n<li>标记</li>\n<li>内容框内部</li>\n</ol>\n\n<ul>\n<li>列表</li>\n<li>样式</li>\n\
  <ol class=\"inside-markers\">\n<li>列表</li>\n<li>标记</li>\n<li>内容框内部</li>\n</ol>\n\
  <li>简写</li>\n</ul>\n\n![image](img/htmlp.jpg)\n\nlist.html\n\n![image](img/2p.jpg)\n\
  添加一个包含规则的样式表以显示列表边界\n\n```css\nli { background : Pink ; }\nol,ul { border : 2px\
  \ solid DeepPink ; }\n```\n\n![image](img/hot.jpg)\n\n### 嵌套列表\n\n嵌套列表可以使用 `inherit`\
  \ 关键字指定它们应该采用包含元素的 `list-style` 样式，或者使用 `none` 关键字抑制标记。\n\n![image](img/3p.jpg)\n\
  接下来，添加一条样式规则，指定某些有序列表标记应该出现在列表项目内容框之外。\n\n```css\nol.outside-markers { list-style-position\
  \ : outside ; }\n```\n\n![image](img/4p.jpg)\n现在，添加一条样式规则，指定其他有序列表标记应该出现在列表项目内容框之内。\n\
  \n```css\nol.inside-markers { list-style-position : inside ; }\n```\n\n![image](img/5p.jpg)\n\
  最后，添加一条简写样式规则，指定无序列表的位置、图像和项目符号类型。\n\n```css\nul { list-style : url(star.png) outside\
  \ square ; }\n```\n\n![image](img/pngp.jpg)\n\n![image](img/pg247_1.jpg)\n\nstar.png\
  \ – 20px x 20px\n\n灰色区域是透明的。\n\n![image](img/6p.jpg)\n保存 HTML 文档，然后在浏览器中打开网页以查看列表\n\
  \n![image](img/pg247_2.jpg)\n\n![image](img/forget.jpg)\n\n当指定的图像不可用时，将使用简写规则指定的\
  \ `square` 标记类型。\n\n### 提供导航\n\n导航栏仅仅是应用特定 CSS 样式规则的 HTML 列表元素的超链接列表。不需要标记，因此 `list-style-type`\
  \ 属性被指定为 `none`，并移除了浏览器的默认边距和内边距。列表中的超链接使用 `display : block ;` 进行样式处理，以便它们的整个内容框都是点击的（而不仅仅是链接文本），并使用\
  \ `text-decoration : none ;` 移除默认的下划线。\n\n![image](img/pg248_1.jpg)\n\n超链接可以通过添加用于样式的类来指示状态，以指示网站上的当前位置，并通过在选择器后添加\
  \ `:hover` 伪类。\n\n垂直导航栏通常为列表指定固定宽度值，而水平导航栏可以浮动列表项目并隐藏溢出部分以保持导航栏的可视性。\n\n![image](img/1p.jpg)\n\
  创建一个包含四个超链接项目列表的 HTML 文档\n\n```html\n<ul>\n<li><a href=\"#home\" class=\"current\"\
  >首页</a></li>\n<li><a href=\"#info\">信息</a></li>\n<li><a href=\"#extra\">更多</a></li>\n\
  <li><a href=\"#contact\">联系</a></li>\n</ul>\n```\n\n![image](img/htmlp.jpg)\n\n\
  navigation.html\n\n![image](img/2p.jpg)\n添加一个包含规则的样式表以移除标记、边距和内边距，然后指定颜色和固定宽度\n\n\
  ```css\nul { list-style-type : none ; margin : 0 ; padding : 0 ;\nbackground : Pink\
  \ ; width : 150px ; }\n```\n\n![image](img/3p.jpg)\n接下来，添加样式规则以块显示显示超链接并指定它们的显示方式。\n\
  \n```css\nli a { display : block ; text-align : center ;\ntext-decoration : none\
  \ ;\ncolor : Black ; padding : 10px ; }\n```\n\n![image](img/4p.jpg)\n现在，添加样式规则来指示超链接的状态\n\
  \n```css\nli a.current { background : HotPink ; }\nli a:hover { background : DeepPink\
  \ ; color : White ; }\n```\n\n![image](img/5p.jpg)\n保存 HTML 文档，然后在浏览器中打开网页以查看垂直导航栏\n\
  \n![image](img/pg249_1.jpg)\n\n![image](img/pg249_2.jpg)\n\n![image](img/hot.jpg)\n\
  \n伪类用于通过 `a:link`（默认）、`a:visited`、`a:hover` 和 `a:active` 指示超链接的状态。\n\n![image](img/6p.jpg)\n\
  编辑步骤 2 中的规则，将 width 替换为 overflow\n\n```css\nul { list-style-type : none ; margin\
  \ : 0 ; padding : 0 ;\nbackground : Pink ; overflow : hidden ; }\n```\n\n![image](img/7p.jpg)\n\
  同时编辑步骤 3 中的规则以添加一个浮动规则\n\n```css\nli a { display : block ; text-align : center ;\n\
  text-decoration : none ;\ncolor : Black ; padding : 10px ; float : left ; }\n```\n\
  \n![image](img/8p.jpg)\n再次保存 HTML 文档，然后在浏览器中刷新网页\n\n![image](img/pg249_4)\n\n###\
  \ 下拉菜单\n\n下拉菜单是一个在用户将鼠标悬停在活动元素上之前隐藏的容器。使用 `position : relative` 规则设置活动元素，使用 `position\
  \ : absolute` 规则设置下拉菜单，使其位于活动元素下方。使用 `z-index` 属性确保下拉菜单位于任何现有内容之上。使用 `display :\
  \ none` 规则隐藏下拉菜单，使用 `display : block` 规则在用户将鼠标悬停在活动元素上时显示它。\n\n创建一个带有标题和两个内部 div\
  \ 的 HTML 文档\n\n```html\n<h1>Banner</h1>\n<div class=\"container\">\nDropdown Menu\n\
  <div class=\"dropdown\">\n<a href=\"#option-1\">Option 1</a>\n<a href=\"#option-2\"\
  >Option 2</a>\n<a href=\"#option-3\">Option 3</a>\n</div>\n</div>\n<p>Random text\
  \ below the dropdown menu.</p>\n```\n\n![image](img/htmlp.jpg)\n\ndropdown.html\n\
  \n添加一个包含规则的样式表以包含所有元素的框框模型\n\n```css\n* { box-sizing: border ; }\n```\n\n![image](img/2p.jpg)\n\
  接下来，添加规则为标题创建边框以显示其宽度\n\n```css\nh1 { border : 2px dashed DeepPink ; }\n```\n\n\
  ![image](img/3p.jpg)\n现在，添加样式规则将容器设置为内联块\n\n```css\ndiv.container { position : relative\
  \ ; display : inline-block ; }\n```\n\n![image](img/hot.jpg)\n\n你可以在此了解更多关于 `box-sizing`\
  \ 属性的信息](chapter13.xhtml)。\n\n![image](img/5p.jpg)\n然后，添加规则为第一个内部 div 设置样式\n\n```css\n\
  div.active { padding : 15px ; background : Pink ; }\n```\n\n![image](img/6p.jpg)\n\
  接下来，添加规则对第二个内部 div 进行定位并隐藏它\n\n```css\ndiv.dropdown { position : absolute ; width\
  \ : 100% ;\nborder : 2px solid Pink ; background : White ;\nz-index : 1 ; display\
  \ : none ; }\n```\n\n![image](img/snake.jpg)\n\n如果你不为下拉内容指定 `background` 值，它可能是透明的——这样下方的内容将保持可见。\n\
  \n![image](img/7p.jpg)\n现在，添加规则使每个链接的内容框变为可点击\n\n```css\ndiv.dropdown a { display\
  \ : block ; padding : 15px ;\ntext-decoration : none ; color : Black ; }\n```\n\n\
  ![image](img/8p.jpg)\n然后，添加规则在用户将鼠标悬停在链接上时更改链接的外\n\n```css\ndiv.dropdown a:hover\
  \ { background : DeepPink ;\ncolor : White ; }\n```\n\n![image](img/9p.jpg)\n最后，添加一条样式规则，当用户将鼠标悬停在活动元素上时显示下拉框\n\
  \n```css\ndiv.container:hover div.dropdown { display : block ; }\n```\n\n![image](img/10p.jpg)\n\
  保存 HTML 文档，然后打开并将鼠标悬停在活动元素上以查看下拉菜单的出现\n\n\n\n\n*   网络浏览器可以通过评估表格宽度及其第一行单元格的宽度来快速绘制固定布局表格。\n\
  *   表格的 `caption-side` 可以指定为顶部或底部。\n*   `border-spacing` 可以指定表格单元格边界之间的距离为统一距离或水平和垂直距离。\n\
  *   `empty-cells` 属性可以隐藏任何没有任何内容的单元格。\n*   `border-collapse` 属性可以将表格及其单元格的相邻边界合并为单个边框。\n\
  *   `display` 属性可以指定所选元素应被浏览器视为表格组件。\n*   `list-style-type` 可以指定用于列表项目的标记类型，如项目符号、数字或字母。\n\
  *   CSS `url( )` 函数可以指定用于列表标记的图像路径。\n*   `list-style-position` 可以指定标记应该出现在列表内容框的内部还是外部。\n\
  *   导航栏是一组对 HTML 列表元素应用了特定 CSS 样式规则的超列表。\n*   当超链接显示为块级元素时，其整个内容框都是可点击的。\n*   伪类可以用于指示超链接的状态。\n\
  *   垂直导航栏指定列表宽度，但水平导航栏让列表项目浮动并隐藏溢出部分。\n*   下拉框是一个内容框，在用户将光标置于激活元素上之前它是隐藏的。\n*  \
  \ 下拉列表的激活元素应该是相对定位的，以便下拉框可以绝对定位在它下方。\n\n| 12 生成效果 | ![image](img/pg235_1.jpg) |\n\
  \n*本章演示了如何在 HTML 文档中制作样式时尚的效果。*\n\n*   选择光标\n*   显示焦点\n*   鼠标悬停效果\n*   按钮按钮\n* \
  \  显示元素\n*   绘制角落\n*   投射阴影\n*   混合渐变\n*   装饰边框\n*   变换形状\n*   制作过渡\n*   动画元素\n\
  *   适应对象\n*   总结\n\n## 选择光标\n\nCSS `cursor` 属性可以指定当指针悬停在所选元素上时显示的的光标类型。它的默认值 `auto`\
  \ 允许浏览器决定显示哪种光标，但指定默认关键字将显式强制浏览器使用操作系统的默认光标。\n\n![image](img/pg254_1.jpg)\n\n可选的光标关键字以及它们在\
  \ Windows 操作系统中代表的光标图标列如下：\n\n| **关键字:** | **光标:** | **关键字:** | **光标:** |\n\n| **default**\
  \ | ![image](img/pg254_2.jpg) | **n-resize** | ![image](img/pg254_10.jpg) |\n\n\
  | **pointer** | ![image](img/pg254_3.jpg) | **ne-resize** | ![image](img/pg254_11.jpg)\
  \ |\n| **crosshair** | ![image](img/pg254_4.jpg) | **e-resize** | ![image](img/pg254_12.jpg)\
  \ |\n| **move** | ![image](img/pg254_5.jpg) | **se-resize** | ![image](img/pg254_13.jpg)\
  \ |\n| **text** | ![image](img/pg254_6.jpg) | **s-resize** | ![image](img/pg254_14.jpg)\
  \ |\n| **wait** | ![image](img/pg254_7.jpg) | **sw-resize** | ![image](img/pg254_15.jpg)\
  \ |\n| **progress** | ![image](img/pg254_8.jpg) | **w-resize** | ![image](img/pg254_16.jpg)\
  \ |\n| **help** | ![image](img/pg254_9.jpg) | **nw-resize** | ![image](img/pg254_17.jpg)\
  \ |\n\n传统上，手光标图标表示超链接，移动光标图标表示可以拖动的项目，而文本光标图标表示可以选择文本的组件。由于大多数用户熟悉这些光标惯例，最好遵循这些习惯。\n\
  \n除了系统光标图标外，`cursor` 属性可以通过在 CSS `url( )` 函数的括号内说明其路径来指定一个图像作为自定义光标图标。可以以逗号分隔列表的形式指定多个图像，但列表应始终以常规光标关键字结尾，以便在指定的图像不可用时指定使用哪个系统光标图标。\n\
  \n![image](img/forget.jpg)\n\n默认情况下，Windows 对每个对角线（北-南）使用相同的缩放图标，但这些可以是单独不同的。\n\n\
  ![image](img/hot.jpg)\n\n默认情况下，Windows 对每个对角线（北-南）使用相同的缩放图标，但这些可以是单独不同的。\n\n![image](img/hot.jpg)\n\
  \n`wait` 光标意味着用户不应继续，而 `progress` 光标允许用户继续。\n\n![image](img/1o.jpg)\n\n创建一个包含多个交互组件的\
  \ HTML 文档\n\n```html\n<form action=\"echo.py\">\n  <fieldset>\n    <legend>发送详情</legend>\n\
  \    <label for=\"addr\">输入您的电子邮件地址:</label>\n    <input id=\"addr\" type=\"text\"\
  >>\n    <input type=\"submit\" value=\"发送\">\n    <a href=\"http://samples\">示例页面</a>\n\
  \  </fieldset>\n</form>\n```\n\n![image](img/htmlo.jpg)\n\n![image](img/2o.jpg)\n\
  \n![image](img/255_1.jpg)\n\n保存 HTML 文档，然后在浏览器中打开网页并依次选择每个交互组件以查看应用的样式。\n\n## 显示焦点\n\
  \nHTML 文档的交互组件由可以接受键盘输入的元素以及可以被用户激活的元素组成。当这些交互组件之一被选中时（通常通过鼠标点击或 Tab 键），该元素具有“焦点”。\n\
  \nCSS 提供了 `:focus` 伪类，可以用于为具有焦点的元素应用样式。当焦点转移到另一个元素时，样式将从该元素上移除。指示具有焦点的元素对于具有许多输入字段的长表单来说特别有用，因为它可以可以作为一个易于识别表单进度的标记。\n\
  \n```css\ninput:focus {\n  background: DarkOrange;\n}\n\na:focus {\n  background:\
  \ Orange;\n}\n```\n\n\n\n\n用户操作会触发界面“事件”，三个动态伪类 `:focus`、`:hover` 和 `:active` 就可以对这些事件做出响应。例如，当用户点击文本输入框时，会发生\
  \ `Focus` 事件——`:focus` 伪类可以通过应用样式对此响应。或许更有趣的是，当用户将光标移动到任何元素上时，会发生 `MouseOver` 事件——`:hover`\
  \ 伪类可以通过应用样式对此响应。当光标移出元素时，会发生 `MouseOut` 事件，移除应用的样式，从而创建动态的“悬停”（rollover）效果。\n\n\
  ![image](img/pg258_1.jpg)\n\n通常，悬停效果通过改变选中元素的文字颜色或背景颜色来突出显示，使其更加明显。悬停也可以指定不同的背景图像以创建图像切换——但这在较慢的连接上可能效果不佳，因为需要等待新图像下载。\n\
  \n一种更好的图像切换替代方案是将 `MouseOver` 和 `MouseOut` 状态的图像合并到单个图像文件中，然后通过为每个状态指定不同的背景位置，让悬停效果显示图片的相应部分。\n\
  \n![image](img/1o.jpg)创建一个 150x100 像素的图像文件，在透明背景上包含顶部和底部区域\n\n![image](img/pg258_2.jpg)\n\
  \n![image](img/pngo.jpg)\n\nprints.png\n\n灰色区域是透明的。\n\n![image](img/2o.jpg)接下来，创建一个\
  \ HTML 文档，包含两个带有 id 属性的空 div 元素，用于样式引用\n\n```html\n<div id=“active”</div> <div id=“prints”</div>\n\
  ```\n\n![image](img/htmlo.jpg)\n\nrollover.html\n\n![image](img/3o.jpg)添加样式表并包含设置\
  \ div 位置和大小的规则——高度正好是图像的一半\n\n```css\ndiv { position : absolute ; top : 10px ;\n\
  width : 150px ; height : 50px ; }\ndiv#active { left : 10px ; }\ndiv#prints { left\
  \ : 170px ; }\n```\n\n![image](img/4o.jpg)接下来，添加样式规则来设置背景颜色，并在光标不在 div 元素上时将背景位置设置为图像左上角\n\
  \n```css\ndiv#active { background : Bisque ; }\ndiv#prints { background : url(prints.png)\
  \ 0 0 Bisque ; }\n```\n\n![image](img/5o.jpg)现在，添加样式规则来更改背景颜色，并在光标位于 div 元素上时将背景位置设置为图像的左中间\n\
  \n```css\ndiv#active:hover { background-color : DarkOrange ; }\ndiv#prints:hover\
  \ {\nbackground : url(prints.png) 0 -50px DarkOrange ; }\n```\n\n![image](img/6o.jpg)保存\
  \ HTML 文档，然后在浏览器中打开网页，并将光标滑过 div 元素，查看它们的背景如何变化\n\n![image](img/pg259_1.jpg)\n\n\
  ![image](img/pg259_2.jpg)\n\n![image](img/pg259_3.jpg)\n\n![image](img/forget.jpg)\n\
  \n`:focus` 伪类只与可以输入的元素有关——但 `:hover` 伪类与几乎任何元素都有关。\n\n## 按钮\n\n如示例此处所示，悬停效果可以用于几乎任何\
  \ HTML 元素来创建 CSS 按钮——用于链接、脚本或表单提交。\n\n![image](img/pg260_1.jpg)\n\n![image](img/1o.jpg)创建一个带有表单的\
  \ HTML 文档，包含三个内部元素，它们将被样式化为按钮\n\n```html\n<a class=”button” href=”target.html” >链接按钮</</a>\n\
  <button class=”button”\nonclick=”alert(this.innerText + ‘ Clicked’”)>\n脚本按钮</button>\n\
  <form method=”GET” action=”http://localhost/echo.py”>\n<input class=”button” type=”submit”\n\
  name=”CSS” value=”提交按钮”>\n</form>\n```\n\n![image](img/pyo.jpg)\n\necho.py\n\n![image](img/htmlo.jpg)\n\
  \nbuttons.html & target.html\n\n![image](img/2o.jpg)添加样式表并包含规则为三个内部元素分别设置样式——移除任何默认样式\n\
  \n```css\n.button { display : inline-block ; font : 16px sans-serif ;\nbackground\
  \ : Orange ; color : White ;\nborder : none ; padding : 16px 32px ; margin : 5px\
  \ ;\ntext-align : center ; text-decoration : none ;\ncursor : pointer ; }\n```\n\
  \n![image](img/3o.jpg)接下来，添加规则为每个按钮创建悬停效果并简单地对齐表单\n\n```css\n.button:link, .button:visited\
  \ { color : White ; }\n.button:hover { background : Coral ; }\n.button:active {\
  \ background : OrangeRed ; }\nform { display : inline-block ; }\n```\n\n![image](img/4o.jpg)保存\
  \ HTML 文档，然后在浏览器中打开它，查看每个按钮上的悬停效果\n\n![image](img/pg260_2.jpg)\n\n![image](img/pg260_3.jpg)\n\
