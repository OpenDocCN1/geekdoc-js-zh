  - 13.30 字符输出函数 scanf()。像 printf() 一样，此函数需要一个通用的格式规格作为第一个参数，以描述使用的数量和变量。规格具有相同的形式："%d"
    用于 int，"%f" 用于 float，"%c" 用于 char，"%s" 用于字符串。输入语句 "scanf(\%%d%%d", &i, &j);" 将两个整数值读入
    int 变量 i 和 j。注意，这些值的地址被用作参数，而不是变量本身。未传递地址会导致程序运行时发生错误。这是初级 C 程序员中常见的错误来源。请考虑图
    13.31 所示的 scanf() 的有效用法。
