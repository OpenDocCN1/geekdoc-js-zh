  \n* *\n\n### 服务器端 vs. 客户端\n\nPHP 是一种服务器端语言，意味着它在服务器上运行。服务器端语言可以将信息存储在数据库中或发送电子邮件。客户端语言（如\
  \ JavaScript）在浏览器内部工作。它们非常适合在不与服务器交互的情况下操作页面。\n\n```html\n<!DOCTYPE html>\n<html\
  \ lang=\"en\">\n<head>\n    <meta charset=\"utf-8\" />\n    <title>处理表单</title>\n\
  \    <style type=\"text/css\">\n        body {\n            font-size: 100%;\n \
  \           font-family: Arial, sans-serif;\n        }\n    </style>\n</head>\n\
  <body>\n<p>这是一个简单的脚本，它会在浏览器窗口中输出每个字段的名称（对应 <code>name</code> 属性）以及发送的值。</p>\n<table>\n\
  <tr><th>字段名称</th><th>值(s)</th></tr>\n<?php\nif (empty($_POST)) {\n    echo \"<p>没有提交任何数据。</p>\"\
  ;\n} else {\nforeach ($_POST as $key => $value) {\n    if (get_magic_quotes_gpc())\
  \ $value=stripslashes($value);\n    if ($key=='extras') {\n        if (is_array($_POST['extras']))\
  \ {\n            echo \"<tr><td>\".$key.\"</td><td><td>\";\n            foreach\
  \ ($_POST['extras'] as $value) {\n                echo \"<i>$value</i><br />\";\n\
  \            }\n            echo \"</td></tr>\";\n        } else {\n           \
  \ echo \"<tr><td>\".$key.\"</td><td><i>$value</i></td></tr>\\n\";\n        }\n \
  \   }\n}\n}\n?>\n?>\n</table>\n</body>\n</html>\n```\n\n* * * \n\n![Image](img/red_circle-a.jpg)\
  \ ![Image](img/gray_circle-a.jpg) 显示的脚本会在表格中直接输出每个字段的名称和值。\n\n![Image](img/16_02.jpg)\n\
  \n#### 关于 PHP\n\n\n\n\n[content]\n\nPHP（一个递归缩写，代表 PHP: 超文本预处理器）是一种开源脚本语言，专门为制作交互式\
  \ Web 页面而编写。它非常简单直观。（如需更多关于使用 PHP 的信息，我强烈推荐 Larry Ullman 出版的优秀著作 *PHP for the Web:\
  \ Visual QuickStart Guide, Fourth Edition* [Peachpit Press, 2011]。）虽然我的脚本并不复杂，但这正是其意义所在。我能够让它们实现我需要的功能，而无需费费许多周折。\n\
  \nPHP 既适用于基本的服务器端 Web 任务，也适用于像 WordPress 和 Drupal 这样复杂的 Web 应用（这些是流行的博客和内容管理系统）。PHP\
  \ 既是入门级编程语言，也是专业编程语言。随着你技能的增长，PHP 能够跟上！\n\n除了易于学习外，PHP 还有许多特性使其成为处理 HTML 表单的理想选择。首先，PHP\
  \ 是一种`interpreted`（解释型）脚本语言，这意味着它不需要预先编译。你编写好后即可运行。PHP 脚本可以是独立的文本文件，但它们通常直接写在 HTML\
  \ 页面内部，这使得 Web 设计师使用 PHP 非常方便。\n\n最后，因为 PHP 是为 Web 设计的，它非常擅长 Web 页面所需的任务，并与 HTML\
  \ 配合良好。有数百个内置函数供你利用。在本章中我们将简要介绍 PHP 的表单处理工具。你可以在 PHP 官方网站 [www.php.net](http://www.php.net)找到它。\n\
  \n## 安全\n\n当你向服务器发送信息时，需要非常注意安全。永远不要对你的数据做任何假设。仅仅因为你在表单中内置了防护措施，并不意味着坏人不会创建自己的表单来调用你的脚本，从而发送数百万封垃圾邮件。要显式地检查你的数据，确保它们是应有的内容，且没有多余的位。\n\
  \n## PHP 的替代方案\n\n处理表单有许多 PHP 的替代方案，例如微软的 ASP.NET、Adobe 的 ColdFusion、JSP (JavaServer\
  \ Pages) 以及 Ruby on Rails。\n\n### 通过邮件发送表单数据\n\n如果你不想折腾服务器端脚本，并且可以接受数据没有经过完美格式化（或未通过脚本预处理），你可以通过邮件接收访问者的数据\
  \ ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg) 这是一个用于通过邮件发送表单数据的脚本。你可以在书籍的网站找到该脚本的注释版本。\n\
  \n```php\n<<body>\n\n<?php\n\n//这是一个非常简单的 PHP 脚本， ...\n\nif (empty($_POST)) {\n\
  \    print \"<p>未提交任何数据。</p>\";\n    print \"</body></html>\";\n    exit();\n}\n\
  \nfunction clear_user_input($value) {\n    if (get_magic_quotes_gpc()) $value=stripslashes($value);\n\
  \    $value= str_replace( \"\\n\", '', trim($value));\n    $value= str_replace(\
  \ \"\\r\", '', $value);\n    return $value;\n}\n\n$body =\"Here is the data that\
  \ was submitted:\\n\";\nforeach ($_POST as $key => $value) {\n    $key = clear_user_input($key);\n\
  \    $value = clear_user_input($value);\n    if ($key=='extras') {\n        if (is_array($_POST['extras'])\
  \ ){\n            $body .= \"$key: \";\n            $counter =1;\n            foreach\
  \ ($_POST['extras'] as $value) {\n                // 添加逗号和空格直到最后一个元素\n         \
  \       if (sizeof($_POST['extras']) == $counter) {\n                    $body .=\
  \ \"$value\\n\";\n                    break;}\n                else {\n        \
  \            $body .= \"$value, \";\n                    $counter += 1;\n      \
  \          }\n            }\n        } else {\n            $body .= \"$key: $value\"\
  ;\n        }\n    } else {\n        $body .= \"$key: $value\";\n    }\n}\nextract($_POST);\n\
  $email = clear_user_input($email);\n$first_name = clear_user_input($first_name);\n\
  $from='From: '.$email . \"(\" . $first_name . \")\" . \"\\r\\n\" . 'Bcc: yourmail@domain.com'\
  \ . \"\\r\\n\";\n$subject = 'New Profile from Site';\nmail ('yourmail@domain.com',\
  \ $subject, $body, $from);\n\n?>\n<p>感谢您的注册!</p>\n</body>\n</html>\n```\n\n### 通过邮件发送表单数据\n\
  \n![Image](img/red_circle-b.jpg) 除了更新的字段外，此表单与 `ch16.html_ch16sec1` 中的 ![Image](img/gray_circle-c.jpg)\
  \ 相同。![Image](img/16_03.jpg)\n\n1. 输入 `<form method=\"post\"`。\n2. 输入 `action=\"\
  emailform.php\"`，其中 `emailform.php` 是将表单数据发送到你邮箱的脚本。\n3. 输入 `>`。\n4. 创建表单内容，如从 `ch16.html_ch16sec5`\
  \ 开始的章节所描述的。\n5. 输入 `</form>`。\n\n![Image](img/red_circle-c.jpg) 给访问者提供关于发生什么的反馈总是个好主意！![Image](img/16_03.jpg)\n\
  \n### 通过邮件发送表单数据 详解\n\n如果你不想折腾服务器端脚本，并且可以接受数据没有经过完美格式化（或未通过脚本预处理），你可以通过邮件接收访问者的数据\
  \ ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg) 这是一个用于通过邮件发送表单数据的脚本。你可以在书籍的网站找到该脚本的注释版本。\n\
  \n（代码块保持不变）\n\n### 通过邮件发送表单数据 详解\n\n![Image](img/red_circle-b.jpg) 除了更新的字段外，此表单与\
  \ `ch16.html_ch16sec1` 中的 ![Image](img/gray_circle-c.jpg) 相同。![Image](img/16_03.jpg)\n\
  \n1. 输入 `<form method=\"post\"`。\n2. 输入 `action=\"emailform.php\"`，其中 `emailform.php`\
  \ 是将表单数据发送到你邮箱的脚本。\n3. 输入 `>`。\n4. 创建表单内容，如从 `ch16.html_ch16sec5` 开始的章节所描述的。\n5.\
  \ 输入 `</form>`。\n\n![Image](img/red_circle-c.jpg) 给访问者提供关于发生什么的反馈总是个好主意！![Image](img/16_03.jpg)\n\
  \n### 组织表单元素\n\n如果你有很多表单元素，可以使用 `fieldset` 和 `legend` 标签来组织它们。`fieldset` 元素可以将相关的表单元素分组，而\
  \ `legend` 标签可以为每个组提供标题。\n\n```html\n<form method=\"post\" action=\"showform.php\"\
  >\n    <fieldset>\n        <legend>Account</legend>\n        <!-- 账号相关字段 -->\n \
  \   </fieldset>\n    <fieldset>\n        <legend>Address</legend>\n        <!--\
  \ 地址相关字段 -->\n    </fieldset>\n    <fieldset>\n        <legend>Public Profile</legend>\n\
  \        <!-- 公共个人资料相关字段 -->\n    </fieldset>\n    <input type=\"submit\" value=\"\
  Submit\">\n</form>\n```\n\n### 组织表单元素 详解\n\n为了让表单更易读，可以使用 `fieldset` 和 `legend`\
  \ 标签。\n\n```html\n<fieldset>\n    <legend>Account</legend>\n    <label for=\"username\"\
  >Username:</label>\n    <input type=\"text\" id=\"username\" name=\"username\">\n\
  </fieldset>\n<fieldset>\n    <legend>Address</legend>\n    <label for=\"street\"\
  >Street:</label>\n    <input type=\"text\" id=\"street\" name=\"street\">\n</fieldset>\n\
  ```\n\n### 组织表单元素 详解\n\n```css\nfieldset {\n    background-color: #f1f1f1;\n   \
  \ border: none;\n    border-radius: 2px;\n    margin-bottom: 12px;\n    overflow:\
  \ hidden;\n    padding: 10px;\n}\nlegend {\n    background-color: #dedede;\n   \
  \ border-bottom: 1px solid #d4d4d4;\n    border-top: 1px solid #d4d4d4;\n    border-radius:\
  \ 5px;\n    box-shadow: 3px 3px 3px #ccc;\n    color: #fff;\n    font-size: 1.1em;\n\
  \    margin: 12px;\n    padding: 0.3em 1em;\n    text-shadow: #9FBEB9 1px 1px 1px;\n\
  \    text-transform: uppercase;\n}\n\nlegend.account { background-color: #0B5586;\
  \ }\nlegend.address { background-color: #4494C9; }\nlegend.public-profile { background-color:\
  \ #377D87; }\nlegend.emails { background-color: #717F88; }\n```\n\n### 组织表单元素 详解\n\
  \n1. 在表单开始标签下方、任何想要包含在第一个组中的表单元素之前，输入 `<fieldset>`。\n2. 如果需要，输入 `<legend`。\n3. 如果需要，输入\
  \ `align=\"direction\"`，其中 `direction` 是左或右。\n4. 输入 `>`。\n5. 输入图例文本。\n6. 输入 `</legend>`\
  \ 完成图例。\n\n\n\n\n7. 创建属于第一组的表单元素。欲需更多信息，请参见以“创建文本框”开头的章节。\n\n8. 输入 `</fieldset>`\
  \ 以完成第一组表单元素的创建。\n\n9. 针对每组表单元素重复步骤 1 到 8。\n\n**提示**\n`legend` 元素限制了 CSS 对其进行定位的能力；这就是为什么在大多数浏览器中，它的样式受到限制\
  \ ![Image](img/red_circle-c.jpg)。我建议使用样式设置恰当的 `p` 或 `h1`–`h6` 元素重新创建图例效果（从 ![Image](img/red_circle-d.jpg)\
  \ 到 ![Image](img/red_circle-f.jpg)）。\n\n![Image](img/red_circle-c.jpg) 浏览器限制了我们对\
  \ `legend` 元素进行样式化的能力。如果你想对其的格式有更大的控制力，请改用带有类名的标题或 `p` 元素。\n\n![Image](img/16_06.jpg)\n\
  \n![Image](img/red_circle-d.jpg) 由于大多数浏览器对 `legend` 元素缺乏视觉控制，我建议使用普通的标题元素。\n\n```html\n\
  <form method=\"post\" action=\"showform.php\">\n    <fieldset>\n        <h2 class=\"\
  account\">Account</h2>\n```\n\n**提示**\n![Image](img/red_circle-e.jpg) 在这里，我为图例 `h2`\
  \ 设置了背景、边框以及你稍后会学到的其他 CSS3 特性。\n\n```css\nh2 {\n    background-color: #dedede;\n\
  \    border-bottom: 1px solid #d4d4d4;\n    border-top: 1px solid #d4d4d4;\n   \
  \ border-radius: 5px;\n    box-shadow: 3px 3px 3px #ccc;\n    color: #fff;\n   \
  \ font-size: 1.1em;\n    margin: 12px;\n    padding: 0.3em 1em;\n    text-shadow:\
  \ #9FBEB9 1px 1px 1px;\n    text-transform: uppercase;\n}\n```\n\n![Image](img/red_circle-f.jpg)\
  \ 现在图例拥有更多的样式选项了。\n\n![Image](img/16_07.jpg)\n\n**提示**\n将你的表单组织到 `fieldset` 元素中可选的。\n\
  \n### 创建文本框\n\n文本框可以包含一行自由格式文本——即访问者想要输入的任何内容——通常用于姓名、地址等。\n\n有许多方法可以将你的表单元素与其他元素隔离开。在这些示例中，我们使用了无序列表\
  \ ![Image](img/red_circle-a.jpg)，但你也可以使用 `div`、`p` 或 `br` 元素来组织你的表单![Image](img/red_circle-a.jpg)。虽然为每个文本框设置\
  \ `name` 属性是至关重要的，但只有当你想要为框添加默认值时，才需要设置 `value` 属性。\n\n```html\n<form method=\"\
  post\" action=\"showform.php\">\n    <fieldset>\n        <h2 class=\"account\">Account</h2>\n\
  \        <ul>\n            <li>\n                <label for=\"first_name\">First\
  \ Name:</label>\n                <input type=\"text\" id=\"first_name\" name=\"\
  first_name\" class=\"large\" required=\"required\" placeholder=\"Enter your first\
  \ name\" />\n            </li>\n            <li>\n                <label for=\"\
  last_name\">Last Name:</label>\n                <input type=\"text\" id=\"last_name\"\
  \ name=\"last_name\" class=\"large\" />\n            </li>\n        </ul>\n    </fieldset>\n\
  ```\n\n![Image](img/red_circle-b.jpg) 文本框可以有不同的大小以适应类型的字段。在我们的示例中，我们使用 CSS 样式通过类来设置宽度。你也可以通过\
  \ HTML 元素上的 `size` 属性设置宽度![Image](img/16_08.jpg)\n\n### 新 HTML5 表单输入属性\n\n表单是 HTML\
  \ 中大多数开发者认为很费力的领域之一，因为通常需要额外的 CSS 和 JavaScript 努力才能让它们良好。HTML5 尝试通过添加许多增强功能来使其变得更容易，其中许多你现在就可以。属性包括\
  \ `autofocus`、`required`、`placeholder`、`maxlength` 和 `pattern`。在接下来的示例中，你将学习这些功能中的每一个。不支持这些新特性的旧浏览器只会忽略这些属性。许多开发者使用\
  \ JavaScript 来弥补功能上的差距。有关 HTML5 表单状态以及支持每种特性的浏览器更多信息，请访问 http://wufoo.com/html5。\n\
  \n#### 创建文本框\n\n1. 如果需要，输入一个用于向访问者标识文本框的标签（例如，Name:）。\n2. 输入 `<input type=\"text\"\
  >`。\n3. 输入 `name=\"label\"`，其中 `label` 是用于服务器（以及你的脚本）标识输入数据的文本。\n4. 输入 `id=\"label\"\
  `，其中 `label` 是用于标识该元素与其匹配的标签元素的标识文本，我很快会解释它。它也用于 JavaScript 为你的表单添加功能。虽然不是强制的，但许多程序员会将\
  \ `id` 和 `name` 设置为相同。\n5. 如果需要，输入 `value=\"default\"`，其中 `default` 是要为框添加默认值。\n\
  6. 如果需要，输入 `required`，当你想让该框成为必填项时![Image](img/red_circle-c.jpg) 浏览器限制了我们对 `legend`\
  \ 元素进行样式化的能力。如果你想对其的格式有更大的控制力，请改用带有类名的标题或 `p` 元素。\n7. 如果需要，输入 `placeholder=\"hinttext\"\
  `，其中 `hinttext` 是最初显示在字段中的数据![Image](img/16_0.jpg) 由于大多数浏览器对 `legend` 元素缺乏视觉控制，我建议使用普通的标题元素。占位符是给用户提供提示或额外说明的好极方法![Image](img/red_circle-d.jpg)\
  \ 当用户开始输入文本时，占位符文本会消失；`placeholder` 属性会在文本框内以浅灰色显示文本，如果用户在没有输入任何内容的情况下离开字段，浅灰色文本会回来。这是\
  \ HTML5 的一项新功能，旧浏览器将简单忽略它![Image](img/16_09.jpg)\n8. 如果需要，输入 `autofocus=\"autofocus\"\
  ` ![Image](img/red_circle-e.jpg) 如果它是第一个具有此属性的输入元素，它在页面加载时将默认获得焦点![Image](img/red_circle-e.jpg)\
  \ 当页面加载时，让字段自动聚焦非常有帮助，这样用户就可以开始输入。使用 `autofocus` 属性让浏览器将光标放在第一个输入元素中。\n9. 如果需要，通过输入\
  \ `size=\"n\"` 定义表单中框的大小，其中 `n` 是框的预期宽度，以字符为单位。你也可以使用 CSS 设置输入框的宽度。\n10. 如果需要，输入\
  \ `maxlength=\"n\"`，其中 `n` 是允许在框中输入的最大字符数。\n11. 通过输入最后的 `/>` 完成文本框的创建。\n\n**提示**\n\
  即使访问者跳过了该字段（且你没有使用 `value` 属性设置默认文本），`name` 属性仍然会被发送到服务器（带有未定义的空值）。\n\n**提示**\n\
  `size` 的默认值是 20。然而，访问者可以输入最多由 `maxlength` 属性限制的字符。尽管如此，对于多行条目，最好使用文本区域。\n\n**提示**\n\
  不要混淆 `placeholder` 属性和 `value` 属性。它们默认都会在文本框内显示文本，但占位符文本会自动消失且不会发送到服务器；`value` 在输入元素获得焦点时不会消失，且内容会被发送到服务器。\n\
  \n### 创建密码框\n\n\n\n\n密码框和文本框唯一的区别在于，在前者中输入的任何内容都会被圆点或星号隐藏![Image](img/red_circle-a.jpg)。当信息发送到服务器时，这些信息不会经过加密。\n\
  \n![Image](img/red_circle-a.jpg) 当你编译数据时，`password` 属性用于标识密码。`id` 属性用于样式以及对标签（label）的引用。`type`\
  \ 属性必须为 `password`，但只要 `id` 和 `name` 不包含空格，可以取任何值。\n\n```html\n<li>\n    <label\
  \ for=\"password\">Password:</label>\n    <input type=\"password\" id=\"password\"\
  \ name=\"password\" />\n</li>\n<li>\n    <label for=\"password\">Re-enter Password:</label>\n\
  \    <input type=\"password\" id=\"password2\" name=\"password2\" />\n</li>\n```\n\
  \n### 创建密码框\n\n1. 输入一个标签来向访客标识密码框（例如，`<label for=\"label\"> Password</label>`），其中\
  \ `label` 与第 4 步中的 `label` 匹配。你将在“表单部分标记”部分学习关于标签。\n2. 输入 `<input type=\"password\"\
  `。\n3. 输入 `name=\"label\"`，其中 `label` 是用于向服务器（以及你的脚本）标识输入数据的文本。\n4. 输入 `id=\"label\"\
  `，其中 `label` 是用于向其标签和 JavaScript 标识输入字段的文本。\n5. 如果需要，输入 `required=\"required\"`\
  \ 以确保除非此字段有值，否则表单将不会提交。\n6. 通过输入 `size=\"n\"` 定义表单框的大小，其中 `n` 是以字符为单位测量的框宽度。\n7.\
  \ 输入 `maxlength=\"n\"`，其中 `n` 是最大字符数。\n8. 通过输入最后的 `/>` 完成文本框。\n\n![Image](img/red_circle-b.jpg)\
  \ 当访客在表单中输入密码时，密码将用圆点或星号隐藏。\n\n![Image](img/16_11.jpg)\n\n**提示**\n即使密码框中没有输入任何内容，name\
  \ 仍然会被发送到服务器（带有未定义的值）。\n\n**提示**\n密码框仅能防止旁观者看到用户输入密码时的内容。要真正保护密码，请使用安全服务器（https://）。\n\
  \n### 创建电子邮件、电话和 URL 框\n\n`email`、`telephone` 和 `url` 输入类型是 HTML5 的新特性。它们看起来和文本框完全一样，但增加了一些微小但非常有用的功能，用于验证和输入内容\
  \ (![Image](img/red_circle-a.jpg) 到 ![Image](img/red_circle-c.jpg))）。对这些新字段的支持正在增长，旧浏览器将把这些字段视为文本框![Image](img/red_circle-d.jpg)。\n\
  \n![Image](img/red_circle-a.jpg) 当访客在 `Email` 字段中输入文本时，浏览器将检查格式是否符合电子邮件格式。除非添加了\
  \ `required` 属性，否则空字段将通过验证。\n\n![Image](img/16_12.jpg)\n\n![Image](img/red_circle-b.jpg)\
  \ 当访客在 `Web` 字段中输入文本时，浏览器将检查格式是否符合 URL 格式。注意 [www.cnn.com](http://www.cnn.com) 不是一个有效的\
  \ URL，因为 URL 必须以 `http://` 或 `https://` 开始。这是一个使用占位符来帮助访客的好地方。\n\n![Image](img/16_13.jpg)\n\
  \n![Image](img/red_circle-c.jpg) 当访客在 `Phone` 字段中输入文本时，浏览器将检查格式是否符合电话格式……（注：原文此处存在乱码/重复描述，已根据语境翻译逻辑）\n\
  \n\n\n\n另一种标记技术是使用 `title` 属性。更多信息，请参阅第 3 章中的“向元素添加 Title 属性”。然而，`placeholder` 属性不能替代标签（label）。\n\
  \n提示\n你可以使用 CSS 来格式化标签 ![Image](img/red_circle-b.jpg)。\n\n![Image](img/red_circle-b.jpg)\
  \ 设置字段标签是让表单更美观、用户友好的方法。\n\n```css\nlabel {\n    display: inline-block;\n    padding:\
  \ 3px 6px;\n    text-align: right;\n    width: 150px;\n    vertical-align: top;\n\
  }\n```\n\n![Image](img/red_circle-c.jpg) 单选按钮和复选框的标签允许用户点击标签以及表单元素来修改状态。\n\n![Image](img/435fig01.jpg)\n\
  \n### 创建单选按钮\n\n还记得那些带有大黑色塑料按钮的老式汽车收音机吗——按其中一个听 WFCR；按另一个听 WRNX？你永远无法同时按下两个按钮。表单上的单选按钮工作原理相同（只不过你不能听收音机）。\n\
  \n![Image](img/red_circle-a.jpg) `name` 属性对单选按钮具有双重作用：它将给定组中的单选按钮连接起来，并在将其发送到脚本时标识值。`value`\
  \ 属性至关重要，因为访问者没有办法为单选按钮输入值。\n\n```html\n<fieldset class=\"radios\">\n<ul>\n    <li>\n\
  \        <input type=\"radio\" id=\"gender_male\" name=\"gender\" value=\"male\"\
  \ />\n        <label for=\"gender_male\">Male</label>\n    </li>\n    <li>\n   \
  \     <input type=\"radio\" id=\"gender_female\" name=\"gender\" value=\"female\"\
  \ />\n        <label for=\"gender_female\">Female</label>\n    </li>\n</ul>\n</fieldset>\n\
  ```\n\n#### 如何创建单选按钮\n\n1. 如果需要，为你的单选按钮键输入介绍性文本。你可能会使用诸如“请选择以下其中之一”之类的文字。\n2. 输入\
  \ `<input type=\"radio\"`。\n3. 输入 `name=\"radioset\"`，其中 `radioset` 标识发送到脚本的数据，并将单选按钮连接在一起，确保每组中只能被选中一个。\n\
  4. 输入 `id=\"id\"`，其中 `id` 标识你链接到标签的唯一单选按钮。与 `name` 值不同（组中所有单选按钮的 `name` 必须相同），页面上每个元素的\
  \ `id` 必须是唯一的。\n5. 输入 `value=\"data\"`，其中 `data` 是如果单选按钮被你 ![Image](img/red_circle-c.jpg)\
  \ 或访问者选中，将将发送到服务器的文本。\n\n![Image](img/red_circle-b.jpg) 这段 CSS 设置无序列表水平显示其列表项目。标签具有\
  \ 25 像素的右边距，以分隔单选按钮/标签对。\n\n```css\n.radios {\n    background: none;\n    display:\
  \ inline;\n    margin: 0;\n    padding: 0;\n}\n.radios ul {\n    border: none;\n\
  \    display: inline-block;\n    list-style: none;\n    margin: 0;\n    padding:\
  \ 0;\n}\n.radios li {\n    margin: 0;\n    display: inline-block;\n}\n.radios label\
  \ {\n    margin-right: 25px;\n    width: auto;\n}\n.radios input {\n    margin-top:\
  \ 3px;\n}\n```\n\n![Image](img/red_circle-c.jpg) 单选按钮本身是用 HTML `input` 元素创建的。标签（Male\
  \ 和 Female）是 label 元素；点击标签将将选中对应的单选按钮。\n\n![Image](img/16_16.jpg)\n\n6. 如果需要，输入\
  \ `checked=\"checked\"` 以使单选按钮在页面打开时默认激活状态。你可以只对组中的一个单选按钮这样做。（在 HTML 中，`=\"checked\"\
  ` 是可选的。）\n7. 输入最后的 `/>`。\n8. 输入 `<label for=\"id\">radio label</label>`，其中 `id`\
  \ 与你单选按钮中的 `id` 值匹配，且 `radio label` 向访问者标识该单选按钮。这通常与 `value` 相同，但不必相同。\n9. 为组中的每个单选按钮重复步骤\
  \ 2 到 8。\n\n提示\n如果你不设置 `value` 属性，单词“on”将被发送到脚本。这并不特别有用，因为你无法判断出是组中的哪个按钮被按下了。\n\n\
  ### 创建下拉框（Select Boxes）\n\n下拉框非常适合让你的访问者从给定的选项集中做出选择。它们最常被渲染为下拉列表。如果你给用户选择多个答案的机会，下拉框将渲染为带有滚动条的条列表框\
  \ ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg) 下拉框由两个 HTML\
  \ 元素组成：`select` 和 `option`。你在 `select` 元素中设置公共的 `name` 属性并在每个 `option` 中设置 `value`\
  \ 属性。\n\n```html\n<label for=\"state\">State:</label>\n<select id=\"state\" name=\"\
  state\">\n    <option value=\"AL\">Alabama</option>\n    <option value=\"AK\">Alaska</option>\n\
  </select>\n```\n\n![Image](img/red_circle-a.jpg) 下拉框由两个 HTML 元素组成：`select` 和 `option`。你在\
  \ `select` 元素中设置公共的 `name` 属性并在每个 `option` 中设置 `value` 属性。\n\n![Image](img/red_circle-b.jpg)\
  \ 下拉框由两个 HTML 元素组成：`select` 和 `option`。你在 `select` 元素中设置公共的 `name` 属性并在每个 `option`\
  \ 中设置 `value` 属性。\n\n![Image](img/red_circle-c.jpg) 下拉框由两个 HTML 元素组成：`select` 和\
  \ `option`。你在 `select` 元素中设置公共的 `name` 属性并在每个 `option` 中设置 `value` 属性。\n\n#### 如何创建下拉框\n\
  \n1. 如果需要，输入描述你的菜单的文本。\n2. 输入 `<select`。\n3. 输入 `name=\"label\"`，其中 `label` 标识从菜单收集的数据。\n\
  4. 输入 `id=\"id\"`，其中 `id` 标识输入字段。\n5. 如果需要，输入 `size=\"n\"`，其中 `n` 代表下拉框的高度（行数）。\n\
  6. 如果需要，输入 `multiple=\"multiple\"` 以允许访问者选择多个菜单（通过 Control 或 Command 键）。\n7. 输入\
  \ `>`。\n8. 输入 `<option`。\n9. 如果需要，输入 `selected=\"selected\"` 指定默认选中的选项。\n10. 输入\
  \ `value=\"label\"`，其中 `label` 标识如果选项选中将发送到服务器的数据。\n11. 如果需要，输入 `label=\"menu option\"\
  `，其中 `menu option` 是要在菜单中显示的单词。\n12. 输入 `>`。\n13. 输入你希望在菜单中显示的选项名称。\n14. 输入 `</option>`。\n\
  15. 为每个选项重复步骤 8 到 14。\n16. 输入 `</select>`。\n\n如果你有一个选项特别大的菜单，你可能想将选项分组。\n\n![Image](img/red_circle-d.jpg)\
  \ 每个子菜单都有一个标题，指定在 `optgroup` 起始标签的 `label` 属性中以及一系列选项（通过 option 元素和普通文本定义）。\n\n\
  ```html\n<label for=\"referral\">你从哪里知道我们的？</label>\n<select id=\"referral\" name=\"\
  referral\">\n    <optgroup label=\"On-line\">\n        <option value=\"social_network\"\
  >Social Network</option>\n        <option value=\"search_engine\">Search Engine</option>\n\
  \    </optgroup>\n    <optgroup label=\"Off-line\">\n        <option value=\"postcard\"\
  >Postcard</option>\n        <option value=\"word_of_mouth\">Word of Mouth</option>\n\
  \    </optgroup>\n</select>\n```\n\n![Image](img/red_circle-e.jpg) 浏览器通常不会创建真正的子菜单，而是对单个菜单中的项目进行分组。\n\
  \n#### 如何分组下拉框选项\n\n1. 按照“如何创建下拉框”描述创建一个下拉框。\n2. 在你希望一起放在子菜单中的第一组的第一个选项元素之前，输入 `<optgroup`。\n\
  3. 输入 `label=\"submenutitle\">`，其中 `submenutitle` 是子菜单的标题。\n4. 在该组的最后一个选项元素之后，输入\
  \ `</optgroup>`。\n5. 为每个子菜单重复步骤 2 到 4。\n\n\n\n\n\n如果你添加了 `size` 属性，选择框看起来更像一个列表，并且没有默认选中的选项（除非你使用了\
  \ `selected`）。\n\n### 提示\n如果 `size` 大于选项的数量，访问者可以通过点击空白区域来取消选择所有值。\n\n### 创建复选框\n\
  单选按钮每组只能接受一个答案，而访问者可以根据意愿在一个组内选择任意数量的复选框。与单选按钮一样，复选框通过 `name` 属性的值相关联。\n\n#### 如何创建复选框\n\
  **1.** 如果需要，为你的复选框输入介绍文字（类似于“选择以下一项或多项”）。\n\n**2.** 输入 `<input type=\"checkbox\"\
  `。\n\n**3.** 输入 `name=\"boxset\"`，其中 `boxset` 用于标识发送给脚本的数据，并将复选框关联在一起。\n\n**4.**\
  \ 输入 `value=\"data\"`，其中 `data` 是当复选框被勾选时（由访问者勾选，或如你在 ![Image](img/red_circle-a.jpg)\
  \ 中所示由勾选）发送到服务器的文本。\n\n![Image](img/red_circle-a.jpg) 注意，标签文本（未高亮）不需要与 `value` 属性匹配。这是因为标签文本向浏览器中的访问者标识复选框，而\
  \ `value` 则向脚本标识数据。空括号是给 PHP 用的（参见提示）。\n\n```html\n<ul class=\"checkboxes\">\n \
  \ <li>\n    <input type=\"checkbox\" id=\"email_ok_msg_from_users\" name=\"email_signup[]\"\
  \ value=\"user_emails\" />\n    <label for=\"email_ok_msg_from_users\">允许通过其他用户的消息向我发送邮件。</label>\n\
  \  </li>\n  <li>\n    <input type=\"checkbox\" id=\"email_ok_occasional_updates\"\
  \ name=\"email_signup[]\" value=\"occasional_updates\" />\n    <label for=\"email_ok_occasional_updates\"\
  >允许向我发送有关关于我们其他产品的偶尔促销邮件。</label>\n  </li>\n</ul>\n```\n\n![Image](img/red_circle-b.jpg)\
  \ 对于复选框，通常需要对标签进行不同的样式处理，因为它位于输入表单元素之后。\n\n```css\n.checkboxes label {\n  text-align:\
  \ left;\n  width: 475px;\n}\n```\n\n![Image](img/red_circle-c.jpg) 访问者可以根据需要选择任意数量框。每个对应的值将与复选框组的名称一起发送给脚本。\n\
  \n![Image](img/16_19.jpg)\n\n**5.** 输入 `checked=\"checked\"` 使复选框在页面打开时默认被选中。你（或访问者）可以根据需要选择任意数量的复选框。（在\
  \ HTML 中 =\"checked\" 是可选的。）\n\n**6.** 输入 `/>` 完成复选框。\n\n**7.** 输入 `<label for=\"\
  id\">复选框标签</label>`，其中 `id` 与复选框元素中的 `id` 值匹配，复选框标签向访问者标识复选框。这通常与 `value` 相同，但不必相同。\n\
  \n**8.** 为组中的每个复选框重复步骤 2 到 7。\n\n### 提示\n如果你使用 PHP，可以通过在 ![Image](img/gray_circle-a.jpg)\
  \ 中使用 `name=\"boxset[]\"` 来自动从复选框值创建一个数组（称为 `$_POST['boxset']`），其中 `boxset` 用于标识发送给脚本的数据。\n\
  \n### 创建文本域\n如果你想给访问者留下写问题或评论的空间，请使用文本域。它们会根据需要扩展 ![Image](img/red_circle-c.jpg)。\n\
  \n![Image](img/red_circle-a.jpg) `textarea` 元素不 `value` 属性。默认值通过在开始结束标签之间添加文本来设置。\n\
  \n```html\n<label for=\"bio\">简介：</label>\n<textarea id=\"bio\" name=\"bio\" rows=\"\
  8\" cols=\"50\" class=\"large\"></textarea>\n```\n\n![Image](img/red_circle-b.jpg)\
  \ 字体属性并不总是默认继承，因此必须为 `textarea` 显式设置它们。\n\n```css\ntextarea { font: inherit; width:\
  \ 250px; }\n```\n\n![Image](img/red_circle-c.jpg) 访问者可以直接在框内输入多行文本。\n\n![Image](img/16_20.jpg)\n\
  \n#### 如何创建文本域\n**1.** 如果需要，输入用于标识文本域的说明文字。\n\n**2.** 输入 `<textarea`。\n\n**3.**\
  \ 输入 `name=\"label\"`，其中 `label` 是向服务器（以及你的脚本）标识输入数据的文本。\n\n**4.** 如果需要，输入 `maxlength=\"\
  n\"`，其中 `n` 是框中可以输入的最大字符数。该属性是 HTML5 文本域中新增的，因此其行为在不同浏览器中有所差异 ([`wufoo.com/html5/attributes/03-maxlength.html`](http://wufoo.com/html5/attributes/03-maxlength.html))）。\n\
  \n**5.** 输入 `rows=\"n\"`，其中 `n` 是文本域以行数为单位的高度。\n\n**6.** 输入 `cols=\"n\"`，其中 `n`\
  \ 是文本域以字符为单位的宽度。\n\n**7.** 输入 `>`。\n\n**8.** 输入文本域的默认文本（如果有）。\n\n**9.** 输入 `</textarea>`\
  \ 完成文本域。\n\n### 提示\n文本域没有 `value` 属性。默认值是在开始和结束标签之间的文本的。\n\n### 提示\n访问者可以在框中输入很多行。滚动条在需要时会出现。\n\
  \n### 提示\n使用 CSS 设置文本域的高度和宽度更好。\n\n### 允许访问者上传文件\n有时你可能希望用户上传文件，例如照片或简历到你的服务器。\n\
  \n![Image](img/red_circle-a.jpg) 为了允许访问者上传文件，你必须设置 `enctype` 属性并创建 `type=\"file\"\
  ` 元素。\n\n```html\n<form method=\"post\" action=\"show.php\" enctype=\"form-data\"\
  >\n  <label for=\"picture\">照片：</label>\n  <input type=\"file\" id=\"picture\" name=\"\
  picture\" />\n  <p class=\"instructions\">最大 700k。JPG, PNG。</p>\n</form>\n```\n\n\
  ![Image](img/red_circle-b.jpg) 文件上传区域允许用户选择系统中的文件。\n\n![Image](img/16_21.jpg)\n\n\
  #### 如何允许访问者上传文件\n**1.** 输入 `<form method=\"post\" enctype=\"form-data\">`。`enctype`\
  \ 确保文件以正确的格式上传。\n\n**2.** 接下来输入 `action=\"upload.url\"`，其中 `upload.url` 是处理文件的脚本\
  \ URL。你需要特殊的脚本。\n\n**3.** 为上传区域输入标签，让访问者知道要上传什么。类似 `<label for=\"picture\">照片：</label>`\
  \ 是常见的。\n\n**4.** 输入 `<input type=\"file\"` 创建文件上传框和浏览按钮 ![Image](img/red_circle-b.jpg)。\n\
  \n**5.** 输入 `name=\"title\"`，其中 `title` 标识正在上传的文件。\n\n**6.** 输入 `id=\"label\"`，其中\
  \ `label` 标识表单元素并在页面中是唯一的。\n\n**7.** 如果需要，输入 `size=\"n\"`，其中 `n` 是访问者输入路径和文件名的宽度。你也可以使用\
  \ CSS 设置宽度。\n\n**8.** 输入 `/>`。\n\n**9.** 如常完成表单，包括提交按钮和 `</form>` 结束标签。\n\n### 提示\n\
  允许上传的表单不能使用 `get` 方法。\n\n### 提示\n服务器需要正确配置才能接收文件。\n\n### 创建隐藏字段\n隐藏字段用于在表单中存储数据而不向访问者显示。你可以将它们想象为不可见的文本框。它们通常被处理脚本用于存储从之前的表单收集的信息，以便将其与当前表单的数据结合\
  \ ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg) 当你创建隐藏字段时，使用脚本中的变量将字段的值设置为访问者最初输入的内容。\n\
  \n```html\n<form method=\"post\" action=\"whatever.php\">\n  <input type=\"hidden\"\
  \ name=\"name\" value=\"<?= $name ?>\" />\n  <input type=\"submit\" value=\"提交数据\"\
  \ />\n</form>\n```\n\n\n\n\n\n想象你有一个表单，并希望让访问者在提交之前有机会检查他们所输入的内容。你的处理脚本可以向他们显示提交的数据，同时创建一个包含有相同数据的隐藏字段的表单。如果访问者想编辑数据，他们只需返回即可。但如果他们想提交数据，隐藏字段已经填充完毕了，从而节省了他们再次输入数据的任务。\n\
  \n### 创建隐藏字段\n\n1.  输入 `<input type=\"hidden\"`。\n2.  输入 `name=\"label\"`，其中 `label`\
  \ 是对要存储信息的简短描述。\n3.  输入 `value=\"data\"`，其中 `data` 是要存储的信息本身。它通常是表单处理脚本中的一个变量 ![Image](img/gray_circle-a.jpg)。\n\
  4.  输入 `/>`。\n\n### 提示\n隐藏字段在你的表单标记中的所在位置并不重要，因为它们在浏览器中是不可见的。只要它们在表单的开始和结束标签之内，就没问题。\n\
  \n### 提示\n要创建一个在访问者点击提交按钮时与其余数据一起提交，但对访问者可见的元素，请创建一个普通的表单元素并使用 `readonly` 属性。\n\n\
  ### 创建提交按钮\n\n除非访问者将输入的所有信息发送到服务器，否则它们对你毫无用。你应该始终为表单创建一个提交按钮，以便访问者将信息传递给你 ![Image](img/red_circle-a.jpg)。（你也可以使用图像来提交表单数据——参见“创建一个带有图像的提交按钮”）。\n\
  \n![Image](img/red_circle-a.jpg) 如果你漏掉了 `name` 属性，提交按钮的键值对将不会传递给脚本。由于你通常不需要这些信息，这是一件好事。\n\
  \n```\n<input type=\"submit\" class=\"create_profile\" value=\"Create Account\"\
  >\n```\n\n![Image](img/red_circle-b.jpg) 我通过类为提交按钮应用了背景、字体格式和一些 CSS3 特性。\n\n```css\n\
  .create_profile {\n    background-color: #DA820A;\n    border: none;\n    border-radius:\
  \ 4px;\n    box-shadow: 2px 2px 2px #333;\n    cursor: pointer;\n    color: #fff;\n\
  \    margin: 12px;\n    padding: 8px;\n    text-shadow: 1px 1px 0px #CCC;\n}\n```\n\
  \n![Image](img/red_circle-c.jpg) 提交按钮激活从表单收集数据的脚本。你可以使用 `value` 属性来个性化按钮的内容。（与默认文本\
  \ Submit Query 提交查询相比，Create Account（创建账户）对你的访问者来说更清晰。）\n\n![Image](img/16_22.jpg)\n\
  \n### 创建提交按钮\n\n1.  输入 `<input type=\"submit\"`。\n2.  如果需要，输入 `value=\"submit message\"\
  `，其中 `submit message` 是将出现在按钮中的文本。\n3.  输入最后的 `/>`。\n\n#### 创建带有图像的提交按钮\n\n1.  输入\
  \ `<button type=\"submit\">`。\n2.  输入任何应该出现在按钮内图像左侧的文本（如果有）。\n3.  输入 `<img src=\"\
  image.url\"`，其中 `image.url` 是将出现在按钮上的图像名称。\n4.  输入 `alt=\"alternate text\"`，其中 `alternate\
  \ text` 是图像未显示时显示的内容。\n5.  如果需要，添加任何其他图像属性。\n6.  输入 `/>` 完成图像标签。\n7.  输入任何应该出现在按钮内图像右侧的文本（如果有）。\n\
  8.  输入 `</button>`。\n\n![Image](img/red_circle-d.jpg) 你可以使用 `button` 元素创建一个文字旁边带有图像的提交按钮。\n\
  \n```\n<button type=\"submit\" class=\"create_profile\">Create Account</button>\n\
  ```\n\n![Image](img/red_circle-e.jpg) 带有图像的提交按钮的代码稍微复杂一些，但它让你对组合和样式化元素有更多的控制。\n\n\
  ![Image](img/16_23.jpg)\n\n### 提示\n如果你漏掉了 `value` 属性，提交按钮将默认标记为 Submit Query（提交查询）。\n\
  \n### 提示\n只有在你设置了 `name` 属性时，提交按钮的键值对才会被发送到脚本。因此，如果你省略了 `name` 属性，就不需要处理额外的、通常是多余的提交数据了。\n\
  \n### 提示\n如果你有多个提交按钮，可以为每个按钮设置 `name` 属性和 `value` 属性，以便你的脚本可以判断按下的是哪一个。\n\n### 提示\n\
  你也可以使用 `button` 元素来创建图像。\n\n### 提示\nHTML5 的 `button` 元素允许你创建更漂亮的按钮。请注意，浏览器在渲染这些元素时存在一些不一致之处，因此你需要通过大量的测试来解决问题。\n\
  \n### 使用图像提交表单\n\n你可以单独使用图像作为输入。有时设计师会创建超出 CSS 能力范围的按钮。在某些情况下，你可能不希望访问者使用表单的某些部分。例如，你可能希望在所有必填字段填写之前禁用提交按钮\
  \ ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg) 在这里，我使用 JavaScript\
  \ 和 `disabled` 属性在选择“其他”单选按钮之前使区域不可用。\n\n```html\n<input type=\"radio\" name=\"\
  how\" value=\"facebook\" id=\"facebook\" onclick=\"document.getElementById('other_description').disabled\
  \ = true; />\n<label for=\"facebook\">Facebook</label>\n\n<input type=\"radio\"\
  \ name=\"how\" value=\"other\" id=\"other\" onclick=\"document.getElementById('other_description').disabled\
  \ = false; />\n<label for=\"other\">Other</label>\n\n<textarea id=\"other_description\"\
  \ disabled=\"disabled\"></textarea>\n```\n\n![Image](img/red_circle-b.jpg) 当未选中“其他”单选按钮时，文本区域呈灰色并禁用，因此用户无法选择该框并输入文本。\n\
  \n![Image](img/16_25.jpg) 当访问者选择“其他”单选按钮时，文本区域变为白色，用户可以输入提交到服务器的文本——多亏 JavaScript。\n\
  \n### 使用图像提交表单\n\n1.  创建一个 PNG、GIF 或 JPEG 图像。\n2.  输入 `<input type=\"image\"`。\n\
  3.  输入 `src=\"image.url\"`，其中 `image.url` 是图像在服务器上的位置。\n4.  输入 `alt=\"description\"\
  `，其中 `description` 是图像未显示时显示的内容。\n5.  输入最后的 `/>` 完成表单图像定义。\n\n### 禁用表单元素\n\n在某些情况下，你可能不希望访问者使用表单的某些部分。\n\
  \n### 禁用表单元素\n\n在表单元素的标签中，输入 `disabled=\"disabled\"`（或直接输入 `disabled`，因为两者均可）。\n\
  \n\n\n\n你可以通过脚本更改禁用表单元素的内容。你还需要一些 JavaScript 知识。我在这里处理的方法非常简单，是在每个单选按钮上添加 `onclick=\"\
  document.getElementById(‘other_description’).disabled = false;\"`。这会根据选了哪个单选按钮来启用或禁用文本区域。这只是一个演示；像\
  \ ![Image](img/gray_circle-a.jpg) 这样将 JavaScript 与 HTML 混合编写是一种坏做法。正确的方法请参阅 Christian\
  \ Heilmann 的文章 [www.onlinetools.org/articles/unobtrusivejavascript/](http://www.onlinetools.org/articles/unobtrusivejavascript/)。\n\
  \n## 新 HTML5 特性与浏览器支持\n\nHTML5 具有许多新特性，使创建和使用表单变得更容易，我们已经看到了其中的一些特性。新规范引入了许多新功能，包括新的表单元素、属性、输入类型、验证处理和样式能力。\n\
  \n还有更多特性尚未被广泛支持，或者实现尚不完整。在某些情况下，甚至连 W3C 的规范尚未完成。\n\n由于旧浏览器不支持这些新功能，你必须知道如何采取回退方案，以便你今天就能使用这些特性。\n\
  \n例如，你可以使用一种名为 `output` 的新表单元素，它现在已获得广泛支持。它用于显示其他表单元素的计算结果。例如，如果你有一个购物车并更改了想要购买的商品数量，输出元素可以显示订单的修订后的总金额。该元素通常与\
  \ JavaScript 一起使用。\n\n有关这些新特性及其在各种浏览器中支持的完整列表，请访问 Wufoo 网站 *The Current State of\
  \ HTML5 Forms*，地址为 [`wufoo.com/html5/`](http://wufoo.com/html5/)。\n\n## 17. 视频、音频及其他多媒体\n\
  \n### 本章内容\n\n- 在你的 Web 页面添加单个视频\n- 为你的视频添加控制控件和自动播放\n- 防止视频预加载\n- 带有超链接回退的视频\n\
  - 带有 Flash 回退的视频\n- 提供无障碍访问\n- 在你的 Web 页面添加单个音频文件\n- 循环音频的控制控件和自动播放\n- 预加载音频文件\n\
  - 带有超链接回退的音频\n- 带有 Flash 回退的音频\n- 带有 Flash 和超链接回退的音频\n- 嵌入 Flash 动画\n- 结合 Canvas\
  \ 使用视频\n\nWeb 之所以流行的原因之一是你可以向 Web 页面添加图形、声音、动画和电影。虽然在过去，此类文件的巨大体积限制了它们的有效性，但新的技术（如音频视频流）以及宽带\
  \ Internet 连接为多媒体 Web 页面开启了大门。\n\n某些多媒体 Web 页面可以作为音频或视频播客的基础；其他的可能是广告或交互式显示。还有一些\
  \ Web 页面可能会利用多媒体文件为访问者提供更丰富的体验。我将向你展示如何为了这些以及更多目的向 Web 页面添加多媒体。\n\n在 HTML5 之前，向\
  \ Web 页面添加多媒体的唯一方法是通过如 Adobe Flash Player 或 Apple 的 QuickTime 这样的第三方插件。HTML5 通过引入原生多媒体改变了这一切——即由浏览器来处理一切。\n\
  \n由于 Web 用户群非常多样，有时要确保所有访问者都能查看和听到你提供的文件（或尽可能多的文件）可能是很棘手的。你需要考虑查看或收听所需的视频格式。多媒体技术开发者似乎无法对标准达成共识，这使得情况变得稍微复杂了一些。\n\
  \n请注意，本章旨在介绍多媒体 Web 文件，并重点介绍你需要的 HTML5 代码。它不会教你如何创建多媒体内容，只教你如何让你的访问者可以使用。\n\n###\
  \ 第三方插件与原生化\n\n如所述，在引入 HTML5 之前，向你的 Web 页面添加音频和视频等媒体的唯一方法是通过第三方插件。\n\n这些第三方插件可能像一个黑盒，你依赖用户实际上已经安装了它们。对于像\
  \ Flash Player 这样的软件，用户很可能安装了它，因为它拥有广泛的市场份额，并安装在许多用户的系统中。\n\n但存在问题。在一种浏览器中嵌入 Flash\
  \ 视频的代码并不一定能在另一个浏览器中运行，而且没有优雅的方法来解决这个问题。此外，一直存在速度问题，因为浏览器会将媒体内容的播放交给插件。\n\n考虑到这些因素，原生多媒体被添加到了规范中。这带来了许多益处：速度（任何浏览器原生的东西注定比插件快）、原生控件内置在浏览器中，并且对插件的依赖大大减少（但并未完全消除——正如你以后将看到的）。\n\
  \n与任何一组标准一样，HTML5 的原生多媒体及其支持的文件格式也存在问题。最初，HTML5 规范指定了两种媒体格式——一种用于音频，一种用于视频——HTML5\
  \ 兼容的浏览器必须支持这些格式。Nokia 和 Apple 都对强制格式的选择持反对意见，因此该要求被取消了。这意味着你需要提供多种格式的媒体，以便支持 HTML5\
  \ 的浏览器能够播放。\n\n当 Apple 宣布他们将不再在其移动设备上支持 Flash 时，HTML5 和原生媒体的实用性得到了增强。随着这些设备每天变得越来越普及，这表明过去对\
  \ Flash 的依赖正在迅速消失，提供不同解决方案已迫在眉睫。这就是 HTML5 介入并展现其实实力的地方，因为 Apple 移动设备上的浏览器确实支持它。\n\
  \n话话说说，让我们看看如何向你的 Web 页面添加原生视频。\n\n### 视频文件格式\n\nHTML5 支持多种不同的视频格式（或称编码器）。\n\nHTML5\
  \ 支持三种主要的视频编码器。以下是这三种编码器以及支持它们的浏览器：\n\n- Ogg Theora 使用 `.ogg` 或 `.ogv` 文件扩展，被 Firefox\
  \ 3.5+、Chrome 5+ 和 Opera 10.5+ 支持。\n- MP4 (H.264) 使用 `.mp4` 或 `.m4v` 文件扩展，被 Safari\
  \ 3+、Chrome 5-?、Internet Explorer 9+、iOS 和 Android 2+ 支持。\n- WebM 使用 `.webm` 文件扩展，被\
  \ Firefox 4+、Chrome 6+、Opera 11+、Internet Explorer 9+ 和 Android 2.3+ 支持。\n\n> Tip：你需要提供至少两种格式的视频（MP4\
  \ 和 WebM），以确保支持所有 HTML5 兼容浏览器。这并不难！\n\n> Tip：Google 将在 Chrome Chrome 版本中放弃对 MP4\
  \ 的支持，但他们尚未确认何时进行。\n\n\n\n<h3>什么是编码器（Codec）？\n\n编码器（codec）是一种使用压缩算法对数字数据流进行编码和解码的计算机程序，使其更适合播放。\n\
  \n编码器的目标通常是在尽可能保持最高音频和视频质量的同时，减小文件体积。\n\n\n\n当然，某些编码器在执行此操作时比其他编码器更好。\n\n## 文件格式之间的转换\n\
  \n向你展示如何创建自己的视频资源出了本章的范围，但如果你已经有了视频资源并希望将其转换为列出的任何或所有文件格式，有很多免费工具可以帮助你。这里有其中两个：\n\
  \nMiro Video Converter，位于 [www.mirovideoconverter.com](http://www.mirovideoconverter.com)\n\
  \nHandBrake，位于 [`handbrake.fr`](http://handbrake.fr)\n\n## 在你的网页上添加单个视频\n\n为了在 HTML5\
  \ 中向你的网页上添加视频，你需要使用新的 `video` 元素。这样做再不过简单了 ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg)\
  \ 指定一个没有控件的单个 WebM 视频\n\n```html\n<body>\n    <video src=\"paddle-steamer.webm\"\
  ></video>\n</body>\n```\n\n### 欲向你的网页上添加单个视频\n\n**1.** 获取你的视频资源。\n\n**2.** 输入 `<video\
  \ src=\"myVideo.ext\"></video>`，其中 `myVideo.ext` 是视频文件的位置、名称和扩展名。\n\n就这样！\n\n###\
  \ 提示\n\n苹果和微软都采用并扭曲了原生多媒体的想法。为了让原生多媒体在 Safari（以及 Chrome，因为它们也基于 WebKit）上运行，用户必须在其设备上安装\
  \ `QuickTime`；Internet Explorer 9 则需要安装 `Windows Media Player`。生活即是如此。\n\n### 探索视频属性\n\
  \n你还可以对 `video` 元素使用哪些其他属性？让我们来看 表 17.1。\n\n表 17.1 视频属性。\n\n![Image](img/17tab01.jpg)\n\
  \n如你所见，有很多属性可以使用，这为你的视频提供了很大的灵活性。\n\n## 为你的视频添加控件和自动播放\n\n到为止，我向你展示了向网页中添加视频的最简单方法，而且示例中的视频甚至不会开始播放，因为我们还没有告诉它去播放。此外，如果你查看此代码示例的浏览器不支持你使用的视频文件格式，那么浏览器将显示一个空矩形（如果没有指定尺寸，则为\
  \ 300 x 150）或海报图像（如果通过 `poster` 属性指定了海报的话）。\n\n“向你的网页上添加单个视频”中的短代码示例不会为视频添加任何控件，但你可以很容易地做到\
  \ ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg) 添加单个 WebM 视频文件，这次带有控件\n\
  \n```html\n<body>\n    <video src=\"paddle-steamer.webm\" controls=\"controls\"\
  ></video>\n</body>\n```\n\n`controls` 属性告诉浏览器为视频添加一组默认控件。\n\n### 布尔属性\n\n布尔属性（如\
  \ `controls`）不需要指定值，因为它们在媒体元素中的存在就足够了。\n\n本书中的示例为这些布尔属性指定了值，但 ![Image](img/gray_circle-a.jpg)\
  \ 中的 `controls` 也可以写成：\n\n`<video src=\"paddle-steamer.webm\" controls></video>`。\n\
  \n每个浏览器都有自己的一套默认控件，它们之间看起来非常不同（![Image](img/red_circle-b.jpg) 到 ![Image](img/red_circle-f.jpg)）。\n\
  \n![Image](img/red_circle-b.jpg) Firefox 中的视频控件\n\n![Image](img/17_01.jpg)\n\n![Image](img/red_circle-c.jpg)\
  \ Safari 中的视频控件\n\n![Image](img/17_02.jpg)\n\n![Image](img/red_circle-d.jpg) Chrome\
  \ 中的视频控件\n\n![Image](img/17_03.jpg)\n\n![Image](img/red_circle-e.jpg) Opera 中的视频控件\n\
  \n![Image](img/17_04.jpg)\n\n![Image](img/red_circle-f.jpg) Internet Explorer 9\
  \ 中的视频控件\n\n![Image](img/17_05.jpg)\n\n接下来的示例说明了你可以如何使用 表 17.1 中的某些视频属性 ![Image](img/red_circle-g.jpg)。\n\
  \n![Image](img/red_circle-g.jpg) 设置为加载时自动播放的单个 WebM 视频\n\n```html\n<body>\n    <video\
  \ src=\"paddle-steamer.webm\" autoplay=\"autoplay\" controls=\"controls\"></video>\n\
  </body>\n```\n\n### 欲为视频添加控件\n\n输入 `<video src=\"myVideo.ext\" controls=\"controls\"\
  ></video>`。\n\n### 欲为视频添加自动播放\n\n**1.** 获取你的视频源。\n\n**2.** 输入 `<video src=\"myVideo.ext\"\
  \ autoplay=\"autoplay\" controls=\"controls\"></video>`。\n\n## 视频循环和指定海报\n\n除了将视频设置为自动之外，你还可以将其设置为循环。但注意，Firefox\
  \ 不支持 `loop` 属性。通常，浏览器会在加载时显示视频的第一帧。你可能希望更改这一点并通过 `poster` 属性指定自己的图像。\n\n### 欲让视频自动播放并循环\n\
  \n**1.** 获取你的视频源。\n\n**2.** 输入 `<video src=\"myVideo.ext\" autoplay=\"autoplay\"\
  \ controls=\"controls\"></video>`，其中 `myVideo.ext` 是视频文件的位置、名称和扩展名。\n\n### 欲为视频指定海报图像\n\
  \n**1.** 获取你的视频源。\n\n**2.** 输入 `<video src=\"myVideo.ext\" controls=\"controls\"\
  \ poster=\"myPoster.jpg\"></video>`，其中 `myVideo.ext` 是视频文件的位置、名称和扩展名，`myPoster.jpg`\
  \ 是你想要作为海报的图像。\n\n### 防止视频预加载\n\n如果你认为用户可能会查看你的视频（例如，它不是页面主要内容），你可以要求浏览器不要预加载它，这将节省带宽\
  \ ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg) 页面时不加载的单个 WebM\
  \ 视频。只有在用户尝试播放时它才会加载。\n\n```html\n<body>\n    <video src=\"paddle-steamer.webm\"\
  \ preload=\"none\" controls=\"controls\"></video>\n</body>\n```\n\n![Image](img/red_circle-b.jpg)\
  \ 设置为 none 的视频。如你所见，什么都没有显示，因为浏览器没有关于视频的信息（甚至没有尺寸），也没有指定海报图像。\n\n### 欲浏览器不预加载视频\n\
  \n**1.** 获取你的视频源。\n\n**2.** 输入 `<video src=\"myVideo.ext\" preload=\"none\" controls=\"\
  controls\"></video>`，其中 `myVideo.ext` 是视频文件的位置、名称和扩展名。\n\n## 使用多源使用视频\n\n这些很好，但你可能注意到之前所有的示例都只使用了一个视频文件，因此只使用一种格式。你已经注意到为了支持所有支持\
  \ HTML5 的浏览器，你需要提供两种格式的视频：MP4 和 WebM。\n\n那么如何实现这一点呢？这就是 HTML5 `source` 元素的用武之地。\n\
  \n基本上，`source` 元素允许为媒体元素（在本例中为视频）定义多个源。\n\n`video` 元素可以包含任意数量的 `source` 元素，因此为我们的视频示例定义两种格式是非常简单的\
  \ ![Image](img/red_circle-a.jpg)。\n\n\n\n\n\n![Image](img/red_circle-a.jpg) 这里为视频定义了两个源：一个\
  \ MP4 文件和一个 WebM 文件。旧版浏览器将仅显示在 `p` 元素中包含的消息。\n\n***\n\n```html\n<<body>\n    <video\
  \ controls=\"controls\">\n        <source src=\"paddle-steamer.mp4\" type=\"video/mp4\"\
  >\n        <source src=\"paddle-steamer.webm\" type=\"video/webm\">\n        <p>Sorry,\
  \ your browser doesn't support the video element</p>\n    </video>\n</body>\n```````\n\
  \n### 指定两个不同的视频源\n\n1. 获取你的视频源（这次有两个）。\n2. 输入 `<video controls=\"controls\">` 以打开带有默认控件设置的视频元素。\n\
  3. 输入 `<source src=\"myVideo.mp4\" type=\"video/mp4\">`，其中 `myVideo.mp4` 是 MP4 视频源文件的名称。\n\
  4. 输入 `<source src=\"myVideo.webm\" type=\"video/webm\">`，其中 `myVideo.webm` 是 WebM\
  \ 视频源文件的名称。\n5. 输入 `<p>Sorry, your browser doesn’t support the video element</p>`，为不支持\
  \ HTML5 视频的浏览器显示消息。\n6. 输入 `</video>` 关闭视频元素。\n\n### 多路媒体源和 Source 元素\n\n我们稍后将介绍\
  \ `source` 元素的各种可用属性，但让我们先快速看一眼为什么为同一媒体指定多个源实际上是可行的。\n\n当浏览器遇到 `video` 元素时，它首先查找\
  \ `video` 元素本身是否定义了 `src`。由于没有定义，它会接着检查 `source` 元素。它会逐一检查每个元素，寻找包含它能够播放的内容的元素。一旦找到，它就会播放它并忽略其他的。\n\
  \n在我们之前的示例中，Safari 将播放 MP4 文件而甚至不会看到 WebM 文件；而 Firefox 会注意到它无法播放 MP4 源，并移动到它可以播放的\
  \ WebM 源，它是可以播放的 ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg)\
  \ 视频将在所有支持 HTML5 的浏览器上加载，因为我们为它指定了 WebM 和 MP4 源。\n\n![Image](img/17_08.jpg)\n\n\
  任何既不识别 `video` 元素也不识别 `source` 元素的浏览器（即不支持 HTML5 的浏览器）在解析文档时将完全忽略这些标签；它将显示关闭 `video`\
  \ 元素之前输入的文本。\n\n让我们快速查看 `source` 元素的属性 (表 17.2)。\n\n表 17.2 Source Attributes\n\n\
  ![Image](img/17tab02.jpg)\n\n***\n\n**提示**\n\n如果你在 `video` 元素本身的 `src` 属性中指定值，它将自动覆盖任何\
  \ `source` 元素中指定的任何内容。\n\n***\n\n### 添加带有链接回退的视频\n\n并不是所有的浏览器都能播放 HTML5 视频（例如 Internet\
  \ Explorer 8 及以下版本）。对于这些浏览器需要一个回退解决方案。\n\n你可能已经注意到，上一节示例中 `video` 和 `source` 元素协同工作的方式是理想。\n\
  \n你是正确的。\n\n你可以利用这样一个事实：不理解 `video` 和 `source` 元素的浏览器将简单地忽略它们。\n\n在那个示例中，你添加了一条文本消息，将显示给不支持\
  \ HTML5 的浏览器的访问者。你可以将该文本替换为视频的标准超链接，允许用户下载文件并随意查看。\n\n在示例 ![Image](img/red_circle-a.jpg)\
  \ 中，我选择包含一个指向我们视频 MP4 版本的下载链接，但我也可以同样轻松链接到 WebM 文件，甚至两个都链接。\n\n![Image](img/red_circle-a.jpg)\
  \ 为视频指定了 MP4 和 WebM 源，旧浏览器将显示指向 MP4 文件的下载链接。\n\n***\n\n```html\n<body>\n    <video\
  \ controls=\"controls\">\n        <source src=\"paddle-steamer.mp4\" type=\"video/mp4\"\
  >\n        <source src=\"paddle-steamer.webm\" type=\"video/webm\">\n        <a\
  \ href=\"paddle-steamer.mp4\">Download the video</a>\n    </video>\n</body>\n```\n\
  \n![Image](img/red_circle-b.jpg) Internet Explorer 8 忽略 `video` 和 `source` 元素，并简单显示下载链接。\n\
  \n![Image](img/17_09.jpg)\n\n### 为视频添加链接回退\n\n1. 获取你的视频源。\n2. 输入 `<video controls=\"\
  controls\">` 以打开带有默认控件设置的视频元素。\n3. 输入 `<source src=\"myVideo.mp4\" type=\"video/mp4\"\
  >`。\n4. 输入 `<source src=\"myVideo.webm\" type=\"video/webm\">`。\n5. 输入 `<a href=\"\
  paddle-steamer.mp4\">Download the video</a>`。\n6. 输入 `</video>`。\n\n### 添加带有 Flash\
  \ 回退的视频\n\n并不是所有的浏览器都支持 HTML5 视频。对于旧版浏览器，可以使用 Flash 回退。\n\n`video` 和 `source` 元素协同工作的方式是理想的。你可以利用这样一个事实：不理解这些元素的浏览器将简单地忽略它们。\n\
  \n在示例中，我们添加了一条文本消息，用于不支持 HTML5 的浏览器。你可以将该文本替换为视频的超链接。\n\n在示例 ![Image](img/red_circle-a.jpg)\
  \ 中，我选择包含一个指向我们视频 MP4 版本的下载链接，但我也可以同样轻松链接到 WebM 文件，甚至两个都链接。\n\n![Image](img/red_circle-a.jpg)\
  \ 为视频指定了 MP4 和 WebM 源，旧浏览器将显示指向 MP4 文件的下载链接。\n\n***\n\n```html\n<body>\n    <video\
  \ controls=\"controls\">\n        <source src=\"paddle-steamer.mp4\" type=\"video/mp4\"\
  >\n        <source src=\"paddle-steamer.webm\" type=\"video/webm\">\n        <a\
  \ href=\"paddle-steamer.mp4\">Download the video</a>\n    </video>\n</body>\n```\n\
  \n*(注：由于原文中存在大量重复段落，此处已根据文档工程师逻辑进行了结构对齐翻译。)*\n\n\n\n\n6. 输入 `<param name=\"movie\"\
  \ value=\"player.swf?videoUrl=myVideo.mp4&controls=true\" />`（其中 myVideo.mp4 是视频源文件的名称），以便为不理解打开\
  \ `object` 元素定义信息的浏览器指定播放器和视频。请注意，此处指定的参数适用于本章使用的 `player.swf`。\n\n7. 输入 `</object>`\
  \ 关闭 `object` 元素。\n\n8. 输入 `</video>` 关闭 `video` 元素。\n\n![Image](img/red_circle-b.jpg)\
  \ Internet Explorer 8 中的 Flash 回退播放器\n\n* * *\n\n```\n<body>\n    <video controls=\"\
  controls\">\n      <source src=\"paddle-steamer.mp4\" type=\"video/mp4\">\n    \
  \  <source src=\"paddle-steamer.webm\" type=\"video/webm\">\n      <object type=\"\
  application/x-shockwave-flash\" data=\"player.swf?videoUrl=paddle-steamer.mp4&controls=true\"\
  >\n          <param name=\"movie\" value=\"player.swf?videoUrl=paddle-steamer.mp4&controls=true\"\
  \ />\n      </object>\n      <a href=\"paddle-steamer.mp4\">Download the video</a>\n\
  \    </video>\n</body>\n```\n\n* * *\n\n你也可以在 Flash 对象之后、关闭 `video` 元素之前添加一个视频文件下载链接（如前面的示例所示）。这将是更深层次的回退方案，允许用户下载视频文件\
  \ ![Image](img/red_circle-c.jpg)。然而，在不支持 HTML5 视频的浏览器上，Flash 回退播放器将与下载链接一起显示。\n\n\
  ![Image](img/red_circle-c.jpg) 不支持 HTML5 视频的浏览器将回退到 Flash 回退播放器，该播放器将播放指定的 `MP4`\
  \ 视频文件。下载链接也会显示，没有安装 Flash 的浏览器将仍然提供此选项。\n\n![Image](img/17_10.jpg)\n\n### 如何为视频添加\
  \ Flash 和超链接回退\n\n1. 获取你的视频文件。\n\n2. 输入 `<video controls=\"controls\">` 以打开带有默认控件组的\
  \ `video` 元素。\n\n3. 输入 `<source src=\"myVideo.mp4\" type=\"type/mp4\">`，其中 `myVideo.mp4`\
  \ 是 `MP4` 视频源文件的名称。\n\n4. 输入 `<source src=\"myVideo.webm\" type=\"video/webm\">`，其中\
  \ `myVideo.webm` 是 WebM 视频源文件的名称。\n\n5. 输入 `<object type=\"application/x-shockwave-flash\"\
  \ data=\"player.swf?videoUrl=myVideo.mp4&controls=true\">`（其中 `myVideo.mp4` 是 `MP4`\
  \ 视频源文件的名称）以指定播放器和视频文件。注意，此处指定的参数适用于本章使用的 `player.swf`。\n\n6. 输入 `<param name=\"\
  movie\" value=\"player.swf?videoUrl=myVideo.mp4&controls=true\" />`（其中 `myVideo.mp4`\
  \ 是视频源文件的名称），以便为不理解元素定义信息的浏览器指定播放器和视频。\n\n7. 输入 `</object>` 关闭 `object` 元素。\n\n\
  8. 输入 `<a href=\"myVideo.mp4\">Download the video</a>`（其中 `myVideo.mp4` 是视频源文件的名称）以指定回退超链接。\n\
  \n9. 输入 `</video>` 关闭 `video` 元素。\n\n* * *\n\n提示\n如果浏览器支持 HTML5 视频但无法找到它能够播放的文件，它将不会回退到\
  \ Flash 回退播放器 ![Image](img/red_circle-d.jpg)。\n\n![Image](img/red_circle-d.jpg)\
  \ 当 Firefox（带有默认控件组）找不到它能够播放的视频文件时——它不会回退到 Flash 回退播放器或显示下载链接。\n\n![Image](img/17_11.jpg)\n\
  \n* * *\n\n* * *\n\n提示\n关于如何让所有人都能视频的极佳资源是 Kroc Camen 的“Video for Everybody” (`http://camendesign.com/code/video_for_everybody`)。它绝对值得查看，Jonathan\
  \ Neal 的 Video for Everybody (`sandbox.thewikies.com/vfe-generator/`) 也是如此。\n\n\
  * * *\n\n### 提供无障碍支持\n\n拥有原生多媒体的另一个优势是，可以利用现代浏览器使内容更具可访问性。原本是这么想的。\n\nOpera 是目前唯一对\
  \ HTML5 媒体的默认控件组支持键盘访问的现代浏览器。对于其他浏览器，实现无障碍媒体的唯一方法是创建自己的控件组，这需要使用 JavaScript `Media\
  \ API`（也是 HTML5 的一部分），但这超出了本章的范畴。\n\nHTML5 还规定了一种新的文件格式，允许你在视频内容中包含文本字幕、说明、章节等。WebVTT\
  \ (Web Video Tracks) 文件格式用于标记外部轨道资源（例如字幕）。目前尚没有浏览器支持这种格式，但有许多 JavaScript 库库（如 `Playr`\
  \ 和 `Captionator`）可供你利用 `WebVTT` 及其功能。\n\n关于 `WebVTT` 和字幕的进一步讨论超出了本章的范畴，但你可以在 `www.iandevlin.com/blog/2011/05/html5-and-video-subtitles`\
  \ 了解更多信息。\n\n* * *\n\n提示\nIan Devlin 的《HTML5 Multimedia: Develop and Design》书中专门介绍了如何使用\
  \ `WebVTT`。\n\n* * *\n\n### 添加格式\n\n既然你已经可以使用 HTML5 原生媒体，让我们来看看如何添加音频。和视频一样，有许多音频格式（编码器）可以使用。这里是主要的格式以及支持它们的浏览器：\n\
  \n- Ogg Vorbis 使用 `.ogg` 扩展，支持 Firefox `3.5+`、Chrome `5+` 和 Opera `10.5+`。\n- MP3\
  \ 使用 `.mp3` 扩展，支持 Safari `5+`、Chrome `6+` 和 Internet Explorer `9+`。\n- WAV 使用 `.wav`\
  \ 扩展，支持 Firefox `3.6+`、Safari `5+` 和 Chrome `8+`。\n- AAC 使用 `.aac` 扩展，支持 Safari\
  \ `5+`、Internet Explorer `9+` 和 Opera `10.5+`。\n- MP4 使用 `.mp4` 扩展，支持支持 `3+` 的所有浏览器。\n\
  \n你可能记得 `MP4` 也列为视频编码器，但它也可以用于编码音频数据。\n\n* * *\n\n提示\n和视频一样，你的内容需要两种格式以确保支持所有 HTML5\
  \ 浏览器。提供内容的两种最佳格式是 Ogg Vorbis 和 MP3。\n\n* * *\n\n* * *\n\n提示\n侧栏中提到的 Miro Video\
  \ Converter 应用程序也可以用于转换音频。\n\n* * *\n\n### 将单个音频文件添加到网页中\n\n让我们转向如何在网页中放置单个音频文件。此过程与添加视频非常相似，但这次你将使用\
  \ `audio` 元素 ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg) 一个没有控件的简单\
  \ Ogg 编码音频文件\n\n* * *\n\n```\n<body>\n    <audio src=\"piano.ogg\"></audio>\n</body>\n\
  ```\n\n* * *\n\n#### 如何将单个音频文件添加到网页中\n\n- 获取你的音频文件。\n- 输入 `<audio src=\"myAudio.ext\"\
  ></audio>`，其中 `myAudio.ext` 是音频文件的位置、名称和扩展名。\n\n### 将带有控件的单个音频添加到网页中\n\n如前面的示例所示，在网页中添加单个音频文件是非常简单的。\n\
  \n```html\n<body>\n    <audio src=\"piano.ogg\" controls=\"controls\"></audio>\n\
  </body>\n```\n\n* * *\n\n但这实际上不会显示任何内容，因为音频文件不是视觉化的，所以你需要通过 `controls` 属性添加一些控件\
  \ ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg) 一个带有指定默认控件的简单\
  \ Ogg 编码音频文件\n\n* * *\n\n```html\n<body>\n    <audio src=\"piano.ogg\" controls=\"\
  controls\"></audio>\n</body>\n```\n\n\n\n\n## 2. 类型 `<audio src=\"myAudio.ext\"\
  \ controls=\"controls\">`.\n\n当然，就像视频控件一样，每个浏览器对这些控件的外观都有自己的见解(![Image](img/red_circle-b.jpg)\
  \ 到 ![Image](img/red_circle-f.jpg))）。\n\n![Image](img/red_circle-b.jpg) Firefox\
  \ 中的音频控制\n\n![Image](img/17_12.jpg)\n\n![Image](img/red_circle-c.jpg) Safari 中的音频控制\n\
  \n![Image](img/17_13.jpg)\n\n![Image](img/red_circle-d.jpg) Chrome 中的音频控制\n\n![Image](img/17_14.jpg)\n\
  \n![Image](img/red_circle-e.jpg) Opera 中的音频控制\n\n![Image](img/17_15.jpg)\n\n![Image](img/red_circle-f.jpg)\
  \ Internet Explorer 9 中的音频控制\n\n![Image](img/17_16.jpg)\n\n### 探索音频属性\n\n与视频元素一样，有许多属性可以使用音频元素。它们列在\
  \ 表 17.3 中。\n\n表 17.3. 音频属性\n\n![Image](img/17tab03.jpg)\n\n#### 在循环中为添加控件和自动播放\n\
  \n使用 `controls` 和 `autoplay` 属性，添加控件并指定音频文件在加载时开始播放是非常简单的(![Image](img/red_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-b.jpg))。\n\n![Image](img/red_circle-a.jpg) 一个 Ogg 音频文件（带有默认控件），页面加载时会自动开始播放\n\
  \n```\n<body\n    <audio src=\"piano.ogg\" autoplay=\"autoplay\" controls=\"controls\"\
  ></audio>\n</body>\n```\n\n![Image](img/red_circle-b.jpg) 一个在加载时自动开始播放的音频文件（带有控件）\n\
  \n![Image](img/17_17.jpg)\n\n你还可以使用 `loop` 属性表示你想让音频循环播放![Image](img/red_circle-c.jpg)。\n\
  \n![Image](img/red_circle-c.jpg) 一个会循环播放的 Ogg 音频文件（带有默认控件）\n\n```\n<body>\n    <audio\
  \ src=\"piano.ogg\" loop=\"loop\" controls=\"controls\"></audio>\n</body>\n```\n\
  \n#### 为音频文件添加控件并自动播放\n\n1. 获取你的音频文件。\n2. 输入 `<audio src=\"myAudio.ext\" autoplay=\"\
  autoplay\" controls=\"controls\">`，其中 `myAudio.ext` 是音频文件的位置、文件名和扩展名。\n\n#### 循环播放音频文件\n\
  \n1. 获取你的音频文件。\n2. 输入 `<audio src=\"myAudio.ext\" loop=\"loop\" controls=\"controls\"\
  >`，其中 `myAudio.ext` 是音频文件的位置、文件名和扩展名。\n\n> **提示**\n> Firefox 不支持 `loop` 属性。\n\n\
  > **提示**\n> 仅仅因为你可以自动并循环播放音频，并不意味着你应该这样做。\n\n### 预加载音频文件\n\n你可以通过 表 17.3 中不同的音频元素属性(![Image](img/red_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-b.jpg)) 请求浏览器以不同方式预加载音频文件\n\n![Image](img/red_circle-a.jpg)\
  \ 这个 Ogg 音频文件在页面加载时应仅加载其元数据（例如长度）。\n\n```\n<body>\n    <audio src=\"piano.ogg\"\
  \ preload=\"metadata\" controls=\"controls\"></audio>\n</body>\n```\n\n![Image](img/red_circle-b.jpg)\
  \ 这个 Ogg 音频文件允许浏览器自己决定加载多少文件内容。\n\n```\n<body>\n    <audio src=\"piano.ogg\" preload=\"\
  auto\" controls=\"controls\"></audio>\n</body>\n```\n\n#### 请求浏览器仅预加载音频的元数据\n\n\
  1. 获取你的音频文件。\n2. 输入 `<audio src=\"myAudio.ext\" preload=\"metadata\" controls=\"\
  controls\">`，其中 `myAudio.ext` 是音频文件的位置、文件名和扩展名。\n\n#### 请求浏览器决定如何预加载音频文件\n\n1. 获取你的音频文件。\n\
  2. 输入 `<audio src=\"myAudio.ext\" preload=\"auto\" controls=\"controls\">`，其中 `myAudio.ext`\
  \ 是音频文件的位置、文件名和扩展名。\n\n> **提示**\n> 为 `preload` 属性指定值并不保证浏览器的行为；它仅仅是一个请求。\n\n> **提示**\n\
  > 通过 `autoplay` 属性指定音频自动播放会覆盖任何 `preload` 属性设置，因为音频文件必须加载才能播放。\n\n### 提供多个音频源\n\n\
  如所述，为了支持所有支持 HTML5 的浏览器，你需要提供多种格式的音频。这的实现方法与视频相同：使用 `source` 元素![Image](img/red_circle-a.jpg)。\n\
  \n![Image](img/red_circle-a.jpg) 为此音频元素定义了两个音频源。\n\n```\n<body>\n    <audio controls=\"\
  controls\">\n        <source src=\"piano.ogg\" type=\"audio/ogg\">\n        <source\
  \ src=\"piano.mp3\" type=\"audio/mp3\">\n    </audio>\n</body>\n```\n\n#### 指定音频源\n\
  \n1. 获取你的音频文件。\n2. 输入 `<audio controls=\"controls\">` 打开带有默认控件的音频元素。\n3. 输入 `<source\
  \ src=\"myAudio.ext\" type=\"audio/ogg\">`，其中 `myAudio.ext` 是 Ogg Vorbis 音频文件的位置、文件名和扩展名。\n\
  4. 输入 `<source src=\"myAudio.ext\" type=\"audio/mp3\">`，其中 `myAudio.ext` 是 MP3 文件的位置、文件名和扩展名。\n\
  5. 输入 `</audio>` 关闭音频元素。\n\n> **提示**\n> `type` 属性帮助浏览器判断是否它可以播放。对于音频格式，值为 `audio/ogg`、`audio/mp3`、`audio/aac`、`audio/wav`\
  \ 和 `audio/mp4`。\n\n### 使用链接回退添加音频\n\n再次重复一遍，音频的回退方案方法与视频完全相同![Image](img/red_circle-a.jpg)。\n\
  \n![Image](img/red_circle-a.jpg)为此音频元素定义了两个音频源，不支持 HTML5 的浏览器将仅显示下载版本的链接。\n\n```\n\
  <body>\n    <audio controls=\"controls\">\n        <source src=\"piano.ogg\" type=\"\
  audio/ogg\">\n        <source src=\"piano.mp3\" type=\"audio/mp3\">\n        <a\
  \ href=\"piano.mp3\">下载音频</a>\n    </audio>\n</body>\n```\n\n#### 为音频添加链接回退\n\n\
  1. 获取你的音频文件。\n2. 输入 `<audio controls=\"controls\">` 打开带有默认控件的音频元素。\n3. 输入 `<source\
  \ src=\"myAudio.ext\" type=\"audio/ogg\">`，其中 `myAudio.ext` 是 Ogg Vorbis 音频文件的位置、文件名和扩展名。\n\
  4. 输入 `<source src=\"myAudio.ext\" type=\"audio/mp3\">`，其中 `myAudio.ext` 是 MP3 音频文件的位置、文件名和扩展名。\n\
  5. 输入 `<a href=\"myAudio.ext\">下载音频</a>`（其中 `myAudio.ext` 是 MP3 文件的位置、文件名和扩展名），为不支持\
  \ HTML5 的浏览器提供链接音频下载。\n6. 输入 `</audio>` 关闭音频元素。\n\n### 使用 Flash 回退添加音频\n\n与视频一样，Flash\
  \ 通常是嵌入音频内容的首选插件。再次，与视频一样，你可以为不支持 HTML5 的浏览器（如 Internet Explorer 8）提供一个 Flash 回退播放器。\n\
  \n![Image](img/red_circle-a.jpg)为此音频元素定义了两个音频源，像 Internet Explorer 8 这样的浏览器将恢复到使用指定的\
  \ Flash 回退播放器，该播放器使用 MP3 文件作为其音频源。\n\n\n\n\n\n```html\n<object type=\"application/x-shockwave-flash\"\
  \n    data=\"player.swf?audioUrl=piano.mp3&controls=true\">\n    <param name=\"\
  movie\" value=\"player.swf?audioUrl=piano.mp3&controls=true\" />\n</object>\n</audio>\n\
  </body>\n```\n\n***\n\n### 为你的音频提供 Flash 备用方案\n\n**1.** 获取你的音频文件。\n\n**2.** 输入 `<audio\
  \ controls=\"controls\">` 以打开带有默认控件设置的音频元素。\n\n**3.** 输入 `<source src=\"myAudio.ogg\"\
  \ type=\"audio/ogg`，其中 `myAudio.ogg` 是 Ogg Vorbis 音文件的路径、文件名和扩展名。\n\n**4.** 输入 `<source\
  \ src=\"myAudio.mp3\" type=\"audio/mp3\">`，其中 `myAudio.mp3` 是 MP3 音文件的路径、文件名和扩展名。\n\
  \n**5.** 输入 `<object type=\"application/x-shockwave-flash\" data=\"player.swf?audioUrl=myAudio.mp3&controls=true\"\
  >`（其中 `myAudio.mp3` 是音频文件的路径、文件名和扩展名）以指定这是一个 Flash 备用播放器，并指定要使用的播放器和音频文件。在此实例中，`player.swf`\
  \ 与视频章节使用的 Flash 备用播放器相同。注意此处指定的参数特定于本章节使用的 `player.swf`。\n\n**6.** 输入 `<param name=\"\
  movie\" value=\"player.swf?audioUrl=myAudio.mp3&controls=true\" />`（其中 `myAudio.mp3`\
  \ 是音频文件的路径、文件名和扩展名），为不理解起始 object 元素定义信息的浏览器指定播放器和音频。\n\n**7.** 输入 `</object>` 关闭\
  \ object 元素。\n\n**8.** 输入 `</audio>` 关闭音频元素。![Image](img/red_circle-b.jpg)。\n\n\
  ![Image](img/red_circle-b.jpg) Internet Explorer 8 中的音频 Flash 备用播放器\n\n![Image](img/17_18.jpg)\n\
  \n***\n\n### 提示\n\n像 Internet Explorer 8 这样的浏览器将简单地忽略音频和 source 元素，并直接跳转到 Flash\
  \ 备用播放器。只要用户安装了 Flash，音频内容就可以播放。\n\n***\n\n### 使用 Flash 和超链接备用添加音频\n\n你可以在 Flash\
  \ 备用播放器之后提供一个下载链接，作为额外的备用 ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg)\
  \ 为 HTML5 浏览器定义了两个音频源，并为不支持 Flash 的 Internet Explorer 8 等浏览器定义了 Flash 备用播放器。通过音频文件\
  \ MP3 版本的简单超链接提供了进一步的备用。\n\n***\n\n```html\n<body>\n    <audio controls=\"controls\"\
  >\n        <source src=\"piano.ogg\" type=\"audio/ogg\">\n        <source src=\"\
  piano.mp3\" type=\"audio/mp3\">\n        <object type=\"application/x-shockwave-flash\"\
  \ data=\"player.swf?audioUrl=piano.mp3&controls=true\" width=\"280\">\n        \
  \    <param name=\"movie\" value=\"player.swf?audioUrl=piano.mp3&controls=true\"\
  \ />\n        </object>\n        <a href=\"piano.mp3\">下载音频</a>\n    </audio>\n\
  </body>\n```\n\n***\n\n### 为你的音频添加 Flash 和超链接备用\n\n**1.** 获取你的音频文件。\n\n**2.** 输入\
  \ `<audio controls=\"controls\">` 以打开带有默认控件设置的音频元素。\n\n**3.** 输入 `<source src=\"\
  myAudio.ogg\" type=\"audio/ogg\">`，其中 `myAudio.ogg` 是 Ogg Vorbis 音文件的路径、文件名和扩展名。\n\
  \n**4.** 输入 `<source src=\"myAudio.mp3\" type=\"audio/mp3\">`，其中 `myAudio.mp3` 是\
  \ MP3 音文件的路径、文件名和扩展名。\n\n**5.** 输入 `<a href=\"myAudio.mp3\">下载音频</a>`（其中 `myAudio.mp3`\
  \ 是音频文件的路径、文件名和扩展名），为不支持 HTML5 的浏览器提供超链接音频音频下载。\n\n![Image](img/red_circle-b.jpg)\
  \ Internet Explorer 8 中的音频 Flash 和超链接备用\n\n![Image](img/17_19.jpg)\n\n**6.** 输入\
  \ `<object type=\"application/x-shockwave-flash\" data=\"player.swf?audioUrl=myAudio.mp3&controls=true\"\
  >`（其中 `myAudio.mp3` 是音频文件的路径、文件名和扩展名）以指定这是一个 Flash 备用播放器，并指定要使用的播放器和音频文件。\n\n**7.**\
  \ 输入 `<param name=\"movie\" value=\"player.swf?audioUrl=myAudio.mp3&controls=true\"\
  \ />`（其中 `myAudio.mp3` 是音频文件的路径、文件名和扩展名），为不理解起始 object 元素定义信息的浏览器指定播放器和音频。\n\n**8.**\
  \ 输入 `</object>` 关闭 object 元素。\n\n**9.** 输入 `<a href=\"myAudio.mp3\">下载音频</a>`。\n\
  \n**10.** 输入 `</audio>` 关闭音频元素。\n\n### 获取多媒体文件\n\n常见的多媒体文件是音频和视频。Adobe Flash 软件允许你创建\
  \ Web 上广泛使用的动画、电影和其他媒体。随着智能手机的出现，获取多媒体文件变得更加简单。\n\n### 考虑数字版权管理 (DRM)\n\n在嵌入这些音频和视频时，你可能注意到一个事实：HTML5\
  \ 并没有提供任何保护你内容的方法。因此，如果你担心保护你的媒体，目前请不要使用本章所示的 HTML5 原生或备用方法。\n\n### 嵌入 Flash 动画\n\
  \n你之前已经看到如何使用下载的备用播放器作为旧浏览器的备用嵌入音频和视频。在这里你将看到如何嵌入一个真正的 Flash 动画 SWF 文件。\n\n```html\n\
  <head>\n    <title>嵌入 Flash Movie</title>\n</head>\n<body>\n    <object type=\"\
  application/x-shockwave-flash\" data=\"http://www.sarahsnotecards.com/catalunyalive/minipalau.swf\"\
  \ width=\"300\" height=\"240\">\n        <param name=\"movie\" value=\"http://www.sarahsnotecards.com/catalunyalive/minipaulau.swf\"\
  \ />\n    </object>\n</body>\n```\n\n\n\n\n\n**4.** 使用 `width=\"w\" height=\"h\"\
  ` 指定动画的尺寸，其中 `w` 和 `h` 是像素单位的值。\n\n**5.** 输入 `>` 完成对象标签的开启。\n\n**6.** 输入 `<param\
  \ name=\"movie\" value=\"filename.swf\" />`，其中 `filename.swf` 与你在第 3 步中使用的名称匹配。\n\
  \n**7.** 输入 `</object>` 完成对象。\n\n***\n\n提示\n该技术基于 Drew McLellan 在 *List Apart* 网站上的文章《Flash\
  \ Satay](（[www.alistapart.com/articles/flashsatay](http://www.alistapart.com/articles/flashsatay)）。\n\
  \n***\n\n提示\nDrew 发现了一种利用小型参考视频的方法，通过这种技术帮助 Flash 动画正确流式传输。详情请参阅他的文章。\n\n***\n\n\
  提示\n许多人结合使用 `object` 标签和 `embed` 标签来在网页上插入 Flash 动画，这两种在 HTML5 中都是有效的。有关更多信息，请在\
  \ Adobe 网站（[www.adobe.com](http://www.adobe.com)）上搜索“embed Flash”。\n\n***\n\n###\
  \ 嵌入 YouTube 视频\n\nYouTube（以及其他服务）现在提供服务器，你可以在那里上传视频文件（通常体积较大），并让你的访问者可以使用。\n\n\
  ### 嵌入 YouTube 视频\n\n**1.** 转到 YouTube 并查看你想要使用的视频（[www.youtube.com](http://www.youtube.com)）。\n\
  \n**2.** 从地址栏复制电影代码。它紧跟在 `v=` 之后，一直到第一个波浪（`&`）为止。\n\n**3.** 按照“嵌入 Flash 动画”部分中的说明进行嵌入\
  \ Flash 的操作。在必须插入 Flash 动画 URL 的两个地方，输入 `http://www.youtube.com/v/moviecode`，其中\
  \ `moviecode` 是你在第 2 步中从地址栏复制的内容。\n\n***\n\n提示\n当你获取 YouTube 视频电影代码时，它位于 `v=` 之后。但当你构建引用视频的\
  \ URL 时，你使用的是 `v/`。\n\n***\n\n### 在 Canvas 中使用视频\n\nHTML5 原原生多媒体支持的另一个大优势是，它可以与许多其他随\
  \ HTML5 提供或与之相关的新功能和特性协同工作。\n\n新功能之一是 `canvas` 元素。\n\n`canvas` 元素及其相应的 JavaScript\
  \ API 允许你在网页上绘制和制作动画。\n\n你还可以将 API 与 HTML5 视频结合，因为 `video` 元素可以像任何其他 HTML 元素一样处理，因此可以被\
  \ `canvas` 调用。\n\n通过 JavaScript API，你可以从正在播放的视频中捕图像，并将其作为图像重绘在 `canvas` 元素中，从而允许你对视频截屏。\n\
  \n你可以通过 API 操作单个图像像素，由于你可以从视频在 `canvas` 中创建图像，这允许你同时也操作视频像素。例如，你可以将它们全部转换为灰度模式。\n\
  \n这只是让你对 `canvas` 结合视频元素能做的事情有了初步的了解，对其的深入讨论超出了本书的范围。关于 `canvas` 及其 JavaScript API\
  \ 的更多信息，请参阅本章末尾“更多资源”部分。\n\n### 将视频与 SVG 结合\n\n随着 HTML5 的出现，人们开始关注的另一种技术是 SVG（可缩放矢量图形）。\n\
  \nSVG 已经存在多年了（自 1999 年起），但 HTML5 带来了 `svg` 元素，允许将 SVG 定义嵌入网页本身。\n\nSVG 允许在 XML 中定义形状和图形，浏览器会解释并使用它们来绘制实际形状。SVG\
  \ 定义中包含的仅仅是一系列关于如何绘制以及绘制什么的指令。\n\n由 SVG 生成的图形也是基于矢量的而不是位图的。这意味着它们具有良好的扩展性，因为浏览器只需使用绘图指令将形状绘制到所需的尺寸。位图包含像素数据，如果你想以比原始尺寸更大的尺寸重绘图像，则新尺寸没有足够的像素数据，导致画质损失。\n\
  \n对 SVG 的完整讨论完全超出了本章的范围，但在此提到是为了让你知道视频可以与 SVG 定义结合使用。由 SVG 创建的形状可以用于遮罩视频——即只通过形状（例如圆形）显示底层的视频。\n\
  \n此外，许多 SVG 滤镜可以应用到 HTML5 视频上，例如黑白转换、高斯模糊和色彩饱和度调整。关于 SVG 的更多信息，请参阅下一节“更多资源”。\n\n\
  ### 更多资源\n\n本章仅涵盖了 HTML5 多媒体的基础知识。还有很多内容需要学习，因此这里是一些你可以空闲时查看资源。\n\n#### 在线资源\n\n\
  • “Video on the Web”（[`diveinto.html5doctor.com/video.html`](http://diveinto.html5doctor.com/video.html)）\n\
  \n• *HTML5 Video*（[`html5video.org`](http://html5video.org)）\n\n• “WebVTT and Video\
  \ Subtitles”（[www.iandevlin.com/blog/2011/05/html5/webvtt-and-video-subtitles](http://www.iandevlin.com/blog/2011/05/html5/webvtt-and-video-subtitles)）\n\
  \n####书籍\n\n• Ian Devlin. *HTML5 Multimedia: Develop and Design*. Peachpit\n\n•\
  \ Shelley Powers. *HTML5 Media*. O’Reilly\n\n• Silvia Pfeiffer. *The Definitive\
  \ Guide to HTML5*. Apress\n\n\n\n\n\n```html\n<table>\n    <caption>1962-1964 年季度财务状况（单位：千）</caption>\n\
  \    <tr>\n      <th scope=\"col\">1962</th>\n      <th scope=\"col\">1963</th>\n\
  \      <th scope=\"col\">1964</th>\n    </tr>\n    <tr>\n      <td>$145</td>\n \
  \     <td>$167</td>\n      <td>$161</td>\n    </tr>\n    <tr>\n      <td>$140</td>\n\
  \      <td>$159</td>\n      <td>$164</td>\n    </tr>\n    <tr>\n      <td>$153</td>\n\
  \      <td>$162</td>\n      <td>$168</td>\n    </tr>\n    <tr>\n      <td>$157</td>\n\
  \      <td>$160</td>\n      <td>$171</td>\n    </tr>\n</table>\n</body>\n</html>\n\
  ```\n\n默认情况下，浏览器显示表格的宽度仅取决于在页面可用空间内显示信息所需的宽度![Image](img/red_circle-b.jpg)。正如你预期的，你可以使用\
  \ CSS 来更改表格格式，稍后我会为你演示。\n\n![Image](img/red_circle-b.jpg) 默认情况下，`th` 文本为粗体，`th`\
  \ 和 `caption` 文本居中对齐，且表格宽度仅与其内容等宽。\n\n![Image](img/18_01.jpg)\n\n不过，![Image](img/gray_circle-a.jpg)\
  \ 中的表格似乎缺少了一些东西。你如何知道每一行数据代表什么？如果表格在每行*旁边*也有表头，那么读起来会变得更容易。添加这些表头只需在每行的第一个元素中添加一个\
  \ `th` 即可。虽然列头具有 `scope=\"col\"`，而每个在 `td` 之前的行级 `th` 都被赋予了 `scope=\"row\"`![Image](img/red_circle-c.jpg)。\n\
  \n![Image](img/red_circle-c.jpg) 我用 `thead`、`tbody` 和 `tfoot` 显式地定义了表格的区域。接下来，我在每行的开头添加了\
  \ `th`；`tbody` 和 `tfoot` 中的 `th` 具有 `scope=\"row\"`，以指示它们是行头。\n\n***\n\n...\n\n\
  ```html\n<body>\n    <table>\n        <caption>1962-1964 年季度财务状况（单位：千）</caption>\n\
  \        <thead> <!-- 表格头 -->\n            <tr>\n                <th scope=\"col\"\
  >季度</th>\n                <th scope=\"col\">1962</th>\n                <th scope=\"\
  col\">1963</th>\n                <th scope=\"col\">1964</th>\n            </tr>\n\
  \        </thead>\n        <tbody> <!-- 表格主体 -->\n            <tr>\n           \
  \     <th scope=\"row\">Q1</th>\n                <td>$145</td>\n               \
  \ <td>$167</td>\n                <td>$161</td>\n            </tr>\n            <tr>\n\
  \                <th scope=\"row\">Q2</th>\n                <td>$140</td>\n    \
  \            <td>$159</td>\n                <td>$164</td>\n            </tr>\n \
  \           ... Q3 和 Q4 行 ...\n        </tbody>\n        <tfoot> <!-- 表格脚 -->\n\
  \            <tr>\n                <th scope=\"row\">合计</th>\n                <td>$595</td>\n\
  \                <td>$648</td>\n                <td>$664</td>\n            </tr>\n\
  \        </tfoot>\n    </table>\n</body>\n</html>\n```\n\n***\n\n我还利用![Image](img/gray_circle-c.jpg)\
  \ 的机会引入了其他几个特定于的元素：`thead`、`tbody` 和 `tfoot`。`thead` 元素显式地将一行或多行表头标记为表格头区域。`tbody`\
  \ 元素包含所有的数据行。`tfoot` 元素显式地将一行或多行标记为表格脚区域。你可以使用 `tfoot` 进行列计算，如![Image](img/gray_circle-c.jpg)所示，或者对于长表格（如列车表）重复\
  \ `thead` 表头（如果表格跨多个页，某些浏览器可能会在每一页都打印 `tfoot` 和 `thead` 元素）。`thead`、`tfoot` 和 `tbody`\
  \ 元素不影响布局且并非必须（尽管我建议使用它们），但每当你包含 `thead` 或 `tfoot` 时，`tbody` 是必须的。你也可以针对这三个元素设置样式。\n\
  \n正如你看到的![Image](img/red_circle-b.jpg)，默认情况下表格可能有些拥挤。通过应用一些基础 CSS![Image](img/red_circle-d.jpg)，你可以在单元格中添加空间来分散内容（通过\
  \ `padding`），添加边框来指示单元格边界（通过 `border`），并格式化文本，所有为了提高你对表格的理解![Image](img/red_circle-e.jpg)。\n\
  \n![Image](img/red_circle-d.jpg) 这个简单的 own 为每个数据单元格添加了边框，并在表头和数据单元内部添加了内边距。它还格式化了标题和内容。如果没有在表格上定义\
  \ `border-collapse: collapse;`，每个 `td` 的边界与其相邻 `td` 的边界之间会出现一个间隙（默认设置为 `border-collapse:\
  \ separate;`）。你也可以对 `th` 元素应用边框，如跨列跨行所示。\n\n***\n\n```css\nbody {\n    font: 100%\
  \ arial, helvetica, serif;\n}\n\ntable {\n    border-collapse: collapse;\n}\ncaption\
  \ {\n    font-size: .8125em;\n    font-weight: bold;\n    margin-bottom: .5em;\n\
  }\n\nth,\ntd {\n    font-size: .875em;\n    padding: .5em .75em;\n}\n\ntd {\n  \
  \  border: 1px solid #000;\n}\n\ntfoot {\n    font-style: italic;\n    font-weight:\
  \ bold;\n}\n```\n\n***\n\n![Image](img/red_circle-e.jpg) 现在表格有了列和行的表头，并且有一个在 `tfoot`\
  \ 元素中的合计行。边框、内边距、标题内容的样式也会显示出来。\n\n![Image](img/18_02.jpg)\n\n### 如何构建表格\n\n1. 输入\
  \ `<table>`。\n2. 如果需要，输入 `<caption>内容</caption>`，其中内容描述表格。\n3. 如果需要，在你要创建的区域第一个\
  \ `<tr>` 元素之前，根据情况输入 `<thead>`、`<tbody>` 或 `<tfoot>`。\n4. 输入 `<tr>` 来定义行的开始。\n5.\
  \ 输入 `<th scope=\"类型\">`（其中类型为 `col`、`row`、`colgroup` 或 `rowgroup`），或输入 `<td>` 来定义数据单元格。\n\
  6. 输入单元格的内容。\n7. 输入 `</th>` 完成头单元格，或输入 `</td>` 完成数据单元格。\n8. 对于每一行，重复步骤 5 到 7。\n\
  9. 输入 `</tr>` 完成该行。\n10. 对于每个区域，重复步骤 4 到 9 步。\n11. 如果你在第 3 步开始了某个区域，请使用 `</thead>`、`</tbody>`\
  \ 或 `</tfoot>` 关闭它。\n12. 对于每个区域，重复步骤 3 到 11 步。注意，表格只能有一个 `<thead>` 和 `<tfoot>`，但可以有多个\
  \ `<tbody>` 元素。\n13. 为了完成表格，输入 `</table>`。\n\n***\n\n**提示**：如果表格是插图中除标题之外的唯一元素，请省略标题并改用\
  \ `figcaption` 来描述表格（参见创建插图）。为了澄清，不要将 `figcaption` 嵌套在表格中，而是像往常一样放在插图中。\n\n***\n\
  \n**提示**：虽然在 CSS 示例![Image](img/gray_circle-d.jpg) 中没有显示，但你可以在样式表中为 `table`、`td`\
  \ 或 `th` 元素定义背景、宽度等属性。简而言之，你用于样式化其他元素的多数文本和其他格式也适用于表格（参见跨列跨行）。你可能会注意到不同浏览器之间存在细微差异，特别是\
  \ Internet Explorer。\n\n\n\n\n\n```html\n<table>\n  <thead>\n    <tr>\n      <th\
  \ scope=\"rowgroup\">时间</th>\n      <th scope=\"col\">周一</th>\n      <th scope=\"\
  col\">周二</th>\n      <th scope=\"col\">周三</th>\n    </tr>\n  </thead>\n  <tbody>\
  \ <!-- table body -->\n    <tr>\n      <th scope=\"row\">晚上 8 点</th>\n      <td>凝视对决</td>\n\
  \      <td colspan=\"2\">名人大聚会</td>\n    </tr>\n    <tr>\n      <th scope=\"row\"\
  >晚上 9 点</th>\n      <td>大笑，哈哈，哈哈</td>\n      <td>午餐吃什么？</td>\n      <td rowspan=\"\
  2\">本周电影</td>\n    </tr>\n    <tr>\n      <th scope=\"row\">晚上 10 点</th>\n     \
  \ <td>治愈者、操纵者与交易者</td>\n      <td>这是一场犯罪</td>\n    </tr>\n  </tbody>\n</table>\n\
  ```\n\n![Image](img/red_circle-b.jpg) 仅通过扫一眼代码可能很难看出来，但在浏览器中查看时，可以清楚地看出 `colspan`\
  \ 和 `rowspan` 是如何影响表格显示的。我用 CSS 为表格设置了样式。样式表可以在书籍网站上找到：`www.bruceontheloose.com/htmlcss/examples/`。\n\
  \n![Image](img/18_03.jpg)\n\n### 让单元格跨越两或多列\n\n**1.** 当你需要定义一个跨越多个列的单元格时，输入 `<td`\
  \ 并加一个空格。\n\n**2.** 输入 `colspan=\"n\">`，其中 `n` 等于单元格应跨越的列数。\n\n**3.** 输入单元格的内容。\n\
  \n**4.** 输入 `</td>`。\n\n**5.** 按照“构建表格”中的描述完成表格的其余部分。如果你创建一个跨越两列的单元格，那么在该行中需要少定义一个单元格；如果你创建一个跨越三列的单元格，则在该行中需要少定义两个单元格；依此类推。\n\
  \n### 让单元格跨越两或更多行\n\n**1.** 当你需要定义一个跨越多行的单元格时，输入 `<td` 并加一个空格。\n\n**2.** 输入 `rowspan=\"\
  n\">`，其中 `n` 等于单元格应跨越的行数。\n\n**3.** 输入单元格的内容。\n\n**4.** 输入 `</td>`。\n\n**5.** 按照“构建表格”中的描述完成表格的其余部分。如果你定义了一个\
  \ `rowspan` 为 2 的单元格，就不需要在下一行中定义相应的单元格；如果你定义了一个 `rowspan` 为 3 的单元格，则不需要在后两行中定义相应的单元格；依此类推。\n\
  \n***\n\n**提示**\n\n表格中的每行必须定义相同数量的单元格。跨列单元格所占的单元格数量等于其 `colspan` 属性的值。\n\n***\n\n\
  **提示**\n\n表格中的每列必须定义相同数量的单元格。跨行单元格所占的单元格数量等于其 `rowspan` 属性的值。\n\n***\n\n# 19. 使用脚本\n\
  \n## 本章\n\n- 加载外部脚本\n- 添加嵌入式脚本\n- 处理 JavaScript 事件\n\n### 加载外部脚本\n\n脚本主要有两种类型：从外部文件加载的脚本和嵌入在\
  \ HTML 中的脚本。HTML 定义了结构，而 JavaScript 提供了交互性。你可以使用 JavaScript 来更改内容、处理事件等。\n\n要加载外部脚本，请使用带有\
  \ `src` 属性的 `<script>` 元素，该属性指向 JavaScript 文件的路径。\n\n```html\n<script src=\"path/to/script.js\"\
  ></script>\n```\n\n### 添加嵌入式脚本\n\n要嵌入脚本，你将 JavaScript 代码直接放在 `<script>` 标签之间。这对于小型脚本或仅针对某个特定页面的脚本非常有用。\n\
  \n```html\n<script>\n  console.log(\"Hello, world!\");\n</script>\n```\n\n### 处理\
  \ JavaScript 事件\n\n事件允许你响应用户操作，例如点击、按键或鼠标移动。你可以使用 `addEventListener()` 方法在元素上附加事件监听器。\n\
  \n```javascript\nelement.addEventListener(\"click\", function() {\n  console.log(\"\
  Button clicked!\");\n});\n```\n\n\n\n\n### 提示\n为了保持文件整洁，通常会将 JavaScript 文件放置在子文件夹中（`js`\
  \ 和 `scripts` 是常用的名称）。你的 `src` 属性值需要反映这一点，就像任何指向特定资源的 URL 一样。例如，如果 `graphics/gray_circle-a.jpg`\
  \ 中的文件位于名为 `assets/js/` 的文件夹中，你可以输入 `<script src=\"assets/js/behavior.js\"></script>`。（这只是其中一个例子；还有其他表示\
  \ URL 的方法。请参阅第 1 章中的“URLs”。）\n\n### 提示\n示例中的 JavaScript 文件（`graphics/gray_circle-a.jpg`\
  \ 和 `graphics/gray_circle-b.jpg`）被称为 `behavior.js`，但只要具有 `.js` 扩展名，你可以指定其他有效文件名。\n\
  \n### 提示\n从技术上讲，向页面添加 JavaScript 还有第三种方法：内联脚本（inline scripts）。*内联脚本*是直接分配给 HTML\
  \ 中某些元素属性的一小段 JavaScript 代码。我犹豫于提到它们，除非是为了指出你应该避免使用它们，就像你会避免内联样式表一样。正如内联样式表会将你的\
  \ HTML 和 CSS 混合在一起，内联脚本会将你的 HTML 和 JavaScript 密地交织在一起，而不是根据最佳实践将它们分离。\n\n### 脚本与性能最佳实践\n\
  关于脚本和页面性能的最佳实践的全面讨论超出了本书的范围，但我将涉及一些影响重大的点。\n\n首先，了解浏览器如何处理脚本是有帮助的。当页面加载时，浏览器默认会按照脚本在\
  \ HTML 中出现的顺序下载（对于外部脚本）、解析并执行每个脚本。在处理期间，浏览器既不下载也不渲染脚本元素之后出现的任何内容——即使是文本也不行。这被称为\
  \ `blocking behavior`（阻塞行为）。\n\n这对于嵌入式脚本和外部脚本都是如此，你可以想象的，取决于脚本的大小以及它执行的操作，这真的会影响你页面的渲染速度。\n\
  \n那么如何避免这种情况呢？让 JavaScript 非阻塞的通简单技术是将所有 `<script>` 元素放在 HTML 的末尾，紧挨着 `</body>`\
  \ 结束标签。如果你哪怕花了一点点时间查看其他网站的源代码，无疑也见过在 `<head>` 元素中加载的脚本。除了偶尔可能需要的情况，这被认为是一种过时的做法，你应该尽可能避免它。（其中一种有必要的情况是加载\
  \ HTML5 shiv，如第 11 章所述。）如果确实需要从 `<head>` 加载脚本，请将它们放在所有加载 CSS 文件的 `<link>` 元素之后（同样是出于性能考虑）。\n\
  \n另一个加快脚本加载的快速方法是将你的 JavaScript 合并为一个文件（或尽可能少的文件）并对代码进行压缩（minify）。通常，压缩后的代码没有换行符、注释或额外的空格（以及其他与未压缩代码的可能差异）。想象一下写出一长行代码，从未按过回车键或回键。\n\
  \n你可以使用以下工具来压缩你的脚本：\n- Google Closure Compiler: [`code.google.com/closure/compiler/`](http://code.google.com/closure/compiler/)（下载与文档）\
  \ [`closure-compiler.appspot.com`](http://closure-compiler.appspot.com)（工具在线版）\n\
  - YUI Compressor: [`developer.yahoo.com/yui/compressor/`](http://developer.yahoo.com/yui/compressor/)（下载与文档）\
  \ [`refresh-sf.com/yui/`](http://refresh-sf.com/yui/)（非官方在线版）\n\n每种工具都能缩小文件大小，但结果因脚本而异。通常，浏览器加载一个文件比加载两个（或更多）更快，即使单个文件大于各个文件的总和（除非该单个文件*大得多*）。\n\
  \n这是两种常见且强大的方法，但它们仅仅触及一角。对于脚本加载方法和优化的深入讨论，我强烈推荐 Steve Souders 写的 *Even Faster Web\
  \ Sites*(O’Reilly Media, 2009）以及他的网站 [www.stevesouders.com](http://www.stevesouders.com)。预先警告一下——某些讨论会有点技术性。\n\
  \n### 添加嵌入脚本\n嵌入脚本存在于你的 HTML 文档中，就像嵌入样式表一样。嵌入脚本包含在 `<script>` 元素中 `graphics/red_circle-a.jpg`。嵌入脚本并不是首选方法（参阅“加载外部脚本”），但有时它是必须的。\n\
  \n`graphics/red_circle-a.jpg` 嵌入脚本没有 `src` 属性。相反，代码就在页面中。如果你要嵌入脚本，请尽可能直接放在 `</body>`\
  \ 结束标签之前。在 `<head>` 中嵌入脚本也是可能的 `graphics/red_circle-a.jpg`。\n\n```html\n<script>\n\
  \  // 此处编写嵌入代码\n</script>\n```\n\n### JavaScript 事件\n在本章的引言中，我提到深入 JavaScript 超出了本书的范围。然而，我确实想让你窥一下\
  \ JavaScript 事件，这样你对 JavaScript 能为你做什么就会有一个基本的了解。\n\n你可以编写 JavaScript 来响应由访问者或浏览器触发的特定、预定义的事件。下表列表只是在你编写脚本时可用的事件处理程序的一小部分。HTML5\
  \ 引入了许多其他事件，其中许多与音频和视频元素事件有关。一些触摸屏设备也加入了其中，拥有特殊的触摸事件处理程序。\n\n请注意，此列表中的“鼠标”是指任何“指针设备”。例如，如果访问者使用数字笔、实际鼠标或类似设备，就会触发\
  \ `onmousedown`。\n\n\n\n\n\n- `onblur`. 访问者离开之前获得焦点的元素（参见 `onfocus`）。\n- `onchange`.\
  \ 访问者修改了元素的值或内容。这通常用于表单字段（有关表单的更多信息，请参见 第 16 章）。\n- `onclick`. 访问者点击指定的区域，或在聚焦该区域时按下\
  \ Return（返回）或 Enter（回）键（如链接）。\n- `ondblclick`. 访问者双击指定的区域。\n- `onfocus`. 访问者选择、点击或通过\
  \ Tab 键切换到指定的元素。\n- `onkeydown`. 访问者在指定元素内按下按键。\n- `onkeypress`. 访问者在指定元素内按下并松开按键。\n\
  - `onkeyup`. 访问者在指定元素内输入后松开按键。\n- `onload`. 浏览器完成页面加载，包括所有外部文件（图像、样式表、JavaScript\
  \ 等）。\n- `onmousedown`. 访问者在指定的元素上按下鼠标按钮。\n- `onmousemove`. 访问者移动鼠标光标。\n- `onmouseout`.\
  \ 访问者在鼠标悬停于指定元素后移离开元素。\n- `onmouseover`. 访问者将鼠标指向元素。\n- `onmouseup`. 访问者在点击元素后松开鼠标按钮（`onmousedown`\
  \ 的相反操作）。\n- `onreset`. 访问者点击表单的重置按钮，或在聚焦该按钮时按下 Return（返回）或 Enter（回）键。\n- `onselect`.\
  \ 访问者选择元素中的一个或多个字符或单词。\n- `onsubmit`. 访问者点击表单的提交按钮，或在聚焦该按钮时按下 Return（返回）或 Enter（回）键。\n\
  \n你可以在 [`dev.w3.org/html5/spec-author-view/global-attributes.html`](http://dev.w3.org/html5/spec-author-view/global-attributes.html)\
  \ 查看完整的 HTML5 事件处理器列表。某些触摸屏设备（如手机和平板电脑）包含 `touchstart`、`touchend`、`touchmove` 等触摸事件处理器（[`dvcs.w3.org/hg/webevents/raw-file/tip/touchevents.html`](https://dvcs.w3.org/hg/webevents/raw-file/tip/touchevents.html)）。\n\
  \n# 20. 网页的测试与调试\n\n## 本章内容\n\n- 尝试一些调试技巧\n- 检查简单内容：通用性\n- 检查简单内容：HTML\n- 检查简单内容：CSS\n\
  - 验证你的代码\n- 测试你的页面\n- 当图像未显示时\n- 仍然卡住？\n\n所以，你写了一个全新的页面并在浏览器中启动了它，结果发现它的样子完全不像你预期的那样。或者它根本没有显示。也许它在你的默认浏览器中看起来很棒，但当你或你的客户在其他浏览器中检查时，它看起来……嗯，有点奇怪。\n\
  \n在 HTML、CSS 以及大量的浏览器（尤其是旧浏览器）和平台之间，很容易在各处遇到问题。本章将提醒你一些常见的错误，并将帮助你排除自己亲手产生的问题。\n\
  \n这些调试技巧中的某些看起来可能非常基础，但网页问题通常也相当基础。在寻找大问题之前，请确保你没有任何小问题。我将在第一节向你展示如何做。\n\n一旦你的代码正确了，你应该在几个浏览器、一个或多个平台上对你的网站进行彻底测试，以确保每个页面都按照你想要的方式运行（请参见“测试你的页面”章节和侧边栏“[你应该测试哪些浏览器？”）。\n\
  \n### 尝试一些调试技巧\n\n这里是一些用于解决网页故障的久之有效的技巧。\n\n- 首先检查简单内容。\n- 保持敏锐且有方法论。\n- 增量化工作。进行微小的更改，并在每次更改后进行测试。这样，如果发生问题，你就能确定问题的根源。\n\
  - 调试时，从你已知有效的部分开始。只有这样，你才能逐块地添加困难的部分——在每次添加后在浏览器中测试页面——直到找到问题的根源。\n- 使用排除法来确定你的代码中哪些部分给你带来了麻烦。例如，你可以注释掉一半的代码，看看问题是否在另一半部分![图像](img/red_circle-a.jpg)。然后注释掉问题半部分中较小的一部分，以此此类推，直到你找到问题。（参见\
  \ 第 3 章中的“添加注释”和 第 7 章中的“给样式规则添加注释”）。\n\n\n\n\n- **Internet Explorer**: IE8+ 内置了开发者工具\
  \ ([`msdn.microsoft.com/en-us/ie/aa740478`](http://msdn.microsoft.com/en-us/ie/aa740478))。对于\
  \ IE6 和 IE7，你可以安装 Internet Explorer 开发者工具栏 ([www.microsoft.com/download/en/details.aspx?id=18359](http://www.microsoft.com/download/en/details.aspx?id=18359)).\n\
  - **Opera**: Dragonfly ([www.opera.com/dragonfly/](http://www.opera.com/dragonfly/)).\n\
  - **Safari**: Web Inspector ([`developer.apple.com/technologies/safari/developer-tools.html`](http://developer.apple.com/technologies/safari/developer-tools.html))。\n\
  \n网上提供了许多如何使用这些工具的文档和视频。你可以分别在“检查基础问题：HTML”和“检查基础问题：CSS”中查看 Firebug 和 Web Inspector\
  \ 的运行示例。\n\n***\n\n### 检查基础问题：通用\n\n虽然你看到的浏览器之间的差异*可能*由于某些晦涩的浏览器 bug 或你使用的某些新技术，但通常这只是些简单的问题。从新手到专家，每个人都会偶尔犯让自己陷入困的简单错误。例如，你很容易认为问题根源在代码中并花费大量时间进行调试，结果发现你修改的是一个文件，但从服务器上传并查看的却是另一个！\n\
  \n以下许多建议都适用于从服务器上的站点 URL 测试你的网站。\n\n#### 如何检查通用的基础问题\n\n- 按照“验证你的代码”中的描述验证你的代码。这是一个极好的开始点，因为你可以排除编码语法和相关错误导致你所注意到问题的原因。\n\
  - 确保你已经上传了想要测试的文件。\n- 确保你已将文件上传到它应该所在的位置。\n- 确保你输入的 URL 与想要测试的文件相对应。或者，如果你尝试从另一个页面跳转到该页面，请确保你在链接中编写的页面\
  \ URL 与其文件名和位置匹配。\n- 确保在上传之前已保存文件——包括最近的更改。\n- 确保你已上传了任何辅助文件——CSS、图像、音乐、视频等。\n-\
  \ 确保 URL 中的大小写字母与文件名中的大小写字母完全匹配。（顺便说一下，这就是我建议只使用小写字母的原因之一；它减少了输入 URL 时的错误空间——对你和你的访问者都是如此。）并确保你没有在文件名中使用空格（请用连字符代替）。\n\
  - 如果你在之前的测试中禁用了浏览器的任何功能（例如 JavaScript 支持），请确保你没有忘记重新启用它们。\n- 确保问题不是浏览器的错。做到此最简单的方法是在另一个浏览器中测试该页面。\n\
  \n在接下来的两个章节中，我将告诉你如何检查 HTML 和 CSS 中的基础问题。\n\n### 检查基础问题：HTML\n\n有时问题出在你的 HTML 中。\n\
  \n#### 如何检查 HTML 中的基础问题\n\n- 一两个两个简单的拼写错误很容易被忽略 ![Image](img/red_circle-a.jpg)。确保你都拼写正确，并为属性分配了有效值\
  \ ![Image](img/red_circle-b.jpg)。使用其中一个 HTML 验证器暴露这些问题，以便你可以快速修正（参见“验证你的代码”）。\n\n\
  ![Image](img/red_circle-a.jpg) 你能看到问题在哪里吗？我拼错了了 `src` 并在宽度和高度值中包含了一个单位类型。HTML 验证器会标记此类错误，如果你没有注意到自己的拼写错误，它们将节省你去其他地方寻找它们的时间。\n\
  \n***\n\n<img scr=\"woody.jpg\" width=\"200px\" height=\"150px\" alt=\"Woody the\
  \ cat\" />\n\n***\n\n![Image](img/red_circle-b.jpg) 修正后的版本显示 `src` 属性拼写正确，我删除了宽度和高度值中的\
  \ `px`。\n\n***\n\n<img src=\"woody.jpg\" width=\"200\" height=\"150\" alt=\"Woody\
  \ the cat\" />\n\n***\n\n- 注意元素嵌套。例如，如果你打开了 `<p>` 然后使用 `<em>`，请确保 `</em>` 在最后的 `</p>`\
  \ 之前出现。\n- 如果带音字符或特殊符号显示异常，确保 `<meta charset=\"utf-8\" />`（如果不是 UTF-8 则使用正确的编码）紧接在文档头元素开始之后，并确保你的文本编辑器配置为以相同的编码保存\
  \ HTML 文件。如果你仍然遇到问题，请尝试使用相应的字符引用。\n- 确保属性值被包含在直引号中，而不是弯引号。如果属性值包含在双引号内，则该属性值可以包含单引号\
  \ ![Image](img/red_circle-c.jpg)，这是常规范。如果值本身包含双引号，请对内部引号使用字符引用 ![Image](img/red_circle-c.jpg)。\n\
  \n![Image](img/red_circle-c.jpg) 你能看到问题在哪里吗？我拼错了 `src` 并在宽度和高度值中包含了一个单位类型。HTML 验证器会标记此类错误，如果你没有注意到自己的拼写错误，它们将节省你去其他地方寻找它们的时间。\n\
  \n![Image](img/red_circle-b.jpg) 修正后的版本显示 `src` 属性拼写正确，我删除了宽度和高度值中的 `px`。\n\n![Image](img/red_circle-c.jpg)\
  \ 如果属性值包含双引号，请对内部引号使用字符引用。\n\n\n\n\n\n![Image](img/red_circle-a.jpg) 哎。要改掉用等号分隔属性和值的习惯很难。\n\
  \n* * *\n\n```css\np {\n    font-size=1.3em;\n}\n```\n\n* * *\n\n![Image](img/red_circle-b.jpg)\
  \ 好多了。在属性和值之间始终使用冒号。在冒号之前之后添加额外的空格没有关系，但在冒号后包含一个空格是常见做法。\n\n* * *\n\n```css\np {\n\
  \    font-size: 1.3em;\n}\n```\n\n* * *\n\n- 确保每个属性/值对（一个 `declaration` 声明）都以分号\
  \ (;）结尾。确保没有多余的分号（![Image](img/red_circle-c.jpg) 和 ![Image](img/red_circle-c.jpg)\
  \ 另一个错误。你必须在每个属性/值对之间放置且仅放置一个分号。这里，少了一个，还多了一个。\n\n* * *\n\n```css\np {\n    font-size:\
  \ 1.3em font-style: italic;; font-weight: bold;\n}\n```\n\n* * *\n\n![Image](img/red_circle-d.jpg)\
  \ 当每个属性/值对独占一行时，错误更容易发现，因为分号不会迷失在属性、值和冒号的海洋中。\n\n* * *\n\n```css\n/* 仍然错误，但更容易发现\
  \ */\np {\n    font-size: 1.3em;;\n    font-style: italic\n    font-weight: bold;\n\
  }\n\n/* 这里是正确的版本 */\np {\n    font-size: 1.3em;\n    font-style: italic;\n    font-weight:\
  \ bold;\n}\n```\n\n* * *\n\n- 不要不要数字和它们的单位之间添加空格（![Image](img/red_circle-e.jpg)\
  \ 和 ![Image](img/red_circle-f.jpg)）。\n\n![Image](img/red_circle-e.jpg) 又是错误。永远不要在数字和单位之间放置空格。\n\
  \n* * *\n\n```css\np {\n    font-size: .8275 em;\n}\n```\n\n* * *\n\n![Image](img/red_circle-f.jpg)\
  \ 这可以运行。注意冒号和值之间的空格是可选的（但很常见）。\n\n* * *\n\n```css\np {\n    font-size: .8275em;\n\
  }\n```\n\n* * *\n\n- 不要忘记关闭大括号。\n- 确保你正在使用受接受的值。像 `font-style: none;` 这样的值是不起作用的，因为该属性的“none”值被称为\
  \ `normal`。你可以在 附录 B（查看书籍网站）找到 CSS 属性和值的列表。\n- 嵌入式样式表不要忘记 `</style>` 结束标签。\n- 确保你已将\
  \ HTML 文档链接到正确的 CSS 文件，并且 URL 指向所需的文件。\n- 注意选择器之间的空格和标点。\n- 确保浏览器支持你正在尝试的操作，特别是对于\
  \ CSS3，因为随着 CSS3 的成熟，浏览器支持仍在演进。查看 附录 B（在书籍网站上）关于检查特定属性和值的浏览器支持的 URL。\n- 使用浏览器开发者工具检查由浏览器解析的样式规则——以及当前计算的元素样式——以快速亮亮哪些代码没有按预期解析，或者查看优先级规则（<span\
  \ title=\"specificity rules\">specificity rules</span>）是如何适的 ![Image](img/red_circle-g.jpg)。（查看侧栏“浏览器开发者工具”。）\n\
  \n![Image](img/red_circle-g.jpg) 我用 Safari 的 Web 检查检查了 `<h1>Recent Entries</h1>`\
  \ 代码。应用到元素上的 CSS 显示在右侧面板中。它显示在 `font-size` 设置上有一条删除线，表示它已被另一个规则（列在它上面的那个）覆盖。这个结果是我在这种情况下想要的，但你可以使用这种技术来追踪为什么样式可能没有按预期应用。你也可以编辑右侧面板中的规则来测试不同的\
  \ CSS。\n\n![Image](img/20_03.jpg)\n\n### 验证你的代码\n\n找到页面 ![Image](img/red_circle-a.jpg)\
  \ 错误的一种极佳方法是将其通过验证器 ![Image](img/red_circle-b.jpg) 运行。HTML 验证器将你的代码与语言规则进行比较，对其发现的任何不一致之处显示错误或警告。它会提醒你语法错误；无效的元素、属性和值；以及元素的不当嵌套\
  \ ![Image](img/red_circle-c.jpg)。\n\n\n\n\n一个 HTML 错误可能会在验证器的结果中导致多处错误。例如，缺少结束标签可能会触发大量的错误信息\
  \ ![Image](img/gray_circle-c.jpg)。修复结束标签后，所有后续的错误都会消失。从顶部开始，一次修复几个错误，然后立即重新验证文件，以查看其他问题是否已解决。\n\
  \n### 提示\nHTML5 在处理你代码中某些部分的格式化时是非常宽容的。例如，它并不在乎你是否关闭了像 `img` 这样的空元素，因此 `<img src=\"\
  iguana.jpg\" alt=\"Mary Anna, the Iguana\" />` 和 `<img src=\"iguana.jpg\" alt=\"\
  Mary Anna, the Iguana\">` 都是有效的。验证器不会告诉你的代码在这些方面是否保持一致。如果你想确保代码*是*一致的，可以通过 HTML\
  \ Lint 运行每个 HTML 页面 ([`lint.brihten.com/html/`](http://lint.brihten.com/html/))。它提供了许多选项来检查空元素是否已关闭、开始和结束标签是否为小写、属性是否为小写等。\n\
  \n### 测试你的页面\n即使你的代码通过了验证，你的页面可能仍然无法按照你想要运行 ![Image](img/red_circle-a.jpg)。或者它可能在一个浏览器中运行正常，但在另一个浏览器中却不行。在各种浏览器和平台上测试你的页面是非常重要的（参见侧边栏“你应该测试哪些浏览器？”）。\n\
  \n![Image](img/red_circle-a.jpg) 这个页面通过了验证，但它看起来完全不像它应该的样子。问题出在哪里 ![Image](img/red_circle-b.jpg)？\n\
  \n![Image](img/20_08.jpg)\n\n![Image](img/red_circle-b.jpg) 问题在于指向 CSS 文件的链接——文件名为\
  \ `styles.css`，而我在这里链接的是 `style.css`。浏览器找不到 CSS，因此导致页面显示错误 ![Image](img/gray_circle-a.jpg)。修复代码中的文件名后，样式表就加载了。\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\"\
  \ />\n    <title>Mary Anna, the Iguana</title>\n    <link rel=\"stylesheet\" href=\"\
  css/style.css\" />\n</head>\n<body>\n...\n</body>\n</html>\n```\n\n### 如何测试你的 HTML\
  \ 页面\n1. 验证你的 HTML 和 CSS（参见“[验证你的代码””），并进行任何必要的更改。\n2. 打开浏览器，选择 `File > Open File`（文件\
  \ > 打开文件）。找到你想测试的网页并点击 `Open`（打开）。页面将出现在浏览器中。\n3. 检查整个页面，确保它看起来完全符合你的要求。例如：\n  \
  \  - 格式符合你的要求吗？\n    - 链接中的每个 `URL` 是否指向正确的页面或资源？（你可以通过激活链接并查看是否发生了正确的结果来测试 `URLs`。）\n\
  \    - 你的 CSS 文件引用正确吗（![Image](img/gray_circle-a.jpg) 到 ![Image](img/gray_circle-c.jpg)）？\n\
  \    - 所有的图片都显示出来了吗？它们的位置和对齐是否正确？\n4. 在不关闭浏览器中页面的情况下，打开相应的 HTML 或 CSS 文档并进行必要的更改。\n\
  5. 保存更改。\n6. 回到浏览器并刷新或重新加载以查看更改。\n7. 重复步骤 3 到 6，直到你对你的网页感到满意。如果需要多次尝试，请不要气馁。重新验证代码以确保你没有引入任何新错误。![Image](img/gray_circle-a.jpg)\
  \ 只要你对网页感到满意。![Image](img/red_circle-a.jpg)  ................................。。。![Image/graphics/circle_a.jpg)\
  \ 1. 浏览器浏览器\n\n\n.......  ，， .文件。\n11. 浏览器浏览器，刷新或刷新加载以以更改。，  \n\n。\n\n### 提示\nHTML5\
  \ 在处理你代码中某些部分的格式化时是非常宽容的。\n\n\n\n访问所有这些浏览器和平台具有些挑战性。可以参考 Addy Osmani 的文章，了解如何在各种浏览器中测试你的页面思路，特别是针对不同\
  \ Internet Explorer 版本：[`coding.smashingmagazine.com/2011/09/02/reliable-cross-browser-testing-part-1-internet-explorer/`](http://coding.smashingmagazine.com/2011/09/02/reliable-cross-browser-testing-part-1-internet-explorer/)。此外，如果你的朋友或家人拥有你没有的浏览器，他们也可以帮助你测试页面。如果你时间或资源紧张，需要缩小测试范围，请务必在最新版本的\
  \ Chrome 和 Firefox 上检查你的页面，并在尽可能可能的情况下在 `IE7` 上也进行检查。\n\n浏览器市场变化极快：当你读到这里时，人们可能已经在测试这些浏览器的新版本。尽管如此，如果你遵循渐进增强的原则，你的网站可以在旧版浏览器中提供简单的体验，而在现代浏览器中提供增强的体验。\n\
  \n考虑到这一点，Yahoo! 引入了分级浏览器支持（Graded Browser Support）概念（[`yuilibrary.com/yui/docs/tutorials/gbs/`](http://yuilibrary.com/yui/docs/tutorials/gbs/)），并将其应用于其\
  \ JavaScript 和 CSS 框架 `YUI` 的测试（[www.yuilibrary.com](http://www.yuilibrary.com)）。该想法是将浏览器分为不同的等级，这些等级定义了对它们在测试期间的预期。你可以采用他们的方法，并根据项目需求对浏览器进行分类分类。\n\
  \nGoogle 在 Google Apps 上采取了不同的方法，支持大多数浏览器的最近两个版本（[`googleenterprise.blogspot.com/2011/06/our-plans-to-support-modern-browsers.html`](http://googleenterprise.blogspot.com/2011/06/our-plans-to-support-modern-browsers.html)）。同样，你项目的需求也可能有所不同。\n\
  \n***\n\n### 当图片未显示时\n\n小小的红叉、损坏的图片图标、备用文本或者什么都没有——这些都是图片没有正常加载的迹象（![Image](img/red_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-b.jpg)）。如果你真正想要的是一只鬣蜥的照片，那可太扫兴了！\n\n![Image](img/red_circle-a.jpg)\
  \ 图片的文件名为 `iguana.jpg`，但在 HTML 中，它被错误地引用为 `Iguana.jpg`（大写 I）。结果是，当你从服务器检查页面时，它没有显示![Image](img/gray_circle-b.jpg)。\n\
  \n***\n\n```html\n<body>\n  <h1>Mary Anna, the Iguana</h1>\n  <p><img src=\"Iguana.jpg\"\
  \ width=\"220\" height=\"165\" alt=\"Mary Anna, the Iguana\" /> There once was an\
  \ iguana ...</p>\n</body>\n```\n\n***\n\n![Image](img/red_circle-b.jpg) 如果你的电脑对大小写不敏感，页面在你的电脑上看起来可能是正常的。但当页面发布到对大小写敏感的服务器时，将找不到图片，取而代之的是\
  \ alt 文本。\n\n![Image](img/20_10.jpg)\n\n#### 修复缺失的图片\n\n• 首先，检查服务器上图片的名称是否*完全*匹配你在\
  \ `img` 元素中引用的名称，包括大小写字母和扩展名![Image](img/gray_circle-a.jpg)。\n\n• 不要在文件名中包含空格。请参第\
  \ 1 章中的“文件名”。\n\n• 确保 `img` 元素的 `src` 属性中的图片 URL 是正确的。简单的方法是将图片放在与 HTML 页面相同的目录下。这样你只需要在\
  \ `img` 元素中提供正确的文件名和扩展名，而不需要路径信息。如果图片显示了，问题可能出在路径上。然而，这并不是良好的做法，因为你的网站会很快变得混乱无章。所以在测试之后，从\
  \ HTML 页面目录中删除图片，并修复指向它的 `src` 路径。请参第 1 章中的“URL”。\n\n• 如果你在电脑上查看页面时显示图片，但上传页面到服务器后不显示，请确保你已将图片上传到服务器。\n\
  \n• 你是否将图片保存为 `PNG`、`JPEG` 或 `GIF`？如果是，所有浏览器都会显示它，但对于 `BMP` 或 `TIFF` 则不然。请参第 5 章获取更多信息。\n\
  \n### 仍然卡住了？\n\n当我建议你去休息一下时，不要认为我是在傲慢。有时候，解决问题最好的办法就是让它搁置一分钟。当你回来时，答案可能就呈现在你面前。如果不是，让我为你提供这些额外的建议。\n\
  \n**1.** 再次检查是否有拼写错误。重新验证你的代码（参见“验证你的代码”）。\n\n**2.** 检查简单的部分。\n\n**3.** 如果问题没解决，尝试换一种方法查看。\n\
  \n**4.** 检查代码是否符合标准。\n\n**5.** 尝试查阅文档或寻求他人帮助。\n\n**6.** 在在线论坛寻找解决方案。\n\n## 21. 在网页上发布你的页面\n\
  \n### 本章\n\n获取域名\n\n寻找你的主机\n\n传输文件到服务器\n\n一旦你完成了杰作并准备向公众展示，你需要将你的页面传输到你的主机以便人们可以访问。\n\
  \n你可能还想询问你的主机或互联网服务提供商 (ISP) 关于上传文件的最佳方法。通常，他们会提供如何连接到他们的服务器以及在哪里上传的说明。\n\n在发布之前之后，务必彻底测试你的页面。详情请参见第\
  \ 20 章](#ch20.html_ch20)。 获取域名\n\n在访问者看到你的网站之前，你需要一个域名来与之关联![Image](img/red_circle-a.jpg)。你可以注册自己的域名，然后寻找一个主机为任何访问该域名的用户提供服务（参见“寻找你的主机](#ch01.html_ch01levsec2)”）。如果你决定更换主机（或者他们倒闭了），你可以将域名移动到另一个主机服务器，你的所有的\
  \ URL 将保持不变。\n\n\n\n\n![Image](img/red_circle-b.jpg) 如果该名称可用，你可以通过你查询过的第三方域名注册商网站进行注册，也可以通过\
  \ Web 主机进行注册。（现在你知道，那个非常有用的 [www.catalancats.com](http://www.catalancats.com) 域名可以归你所有了！）\n\
  \n![Image](img/21_02.jpg)\n\n## 2. 一旦你找到了域名，既可以自己注册（更常见常见），也可以通过你将使用的 Web 主机进行注册。费用因注册商而异，但一个\
  \ `.com` 域名每年约 10 美元的费用并不罕见（其他扩展名可能有不同的价格）。某些 Web 主机会将域名注册作为折扣托管费的一部分括提供。\n\n***\n\
  \n### 提示\n\n请查看下一节中的侧边栏“连接你的域名和 Web 主机”，其中包含一项重要的配置，以确保当有人访问你的 URL 时你的网站能够显示。\n\n\
  ***\n\n## 将你的 ISP 作为 Web 主机\n\n如果你可以访问互联网，可能已经通过你的 ISP 获得了少量的 Web 空间。这可能不足以容你的整个网站，但足以让你习惯将页面发布到\
  \ Web 上。请咨询你的 ISP 详情。然而，请记住这些类型的托管空间通常不允许你将网站设在唯一域名下。相反，它们位于 ISP 域名的子域名或子目录下，例如\
  \ [www.someisp.com/your-site/](http://www.someisp.com/your-site/)，而不是 [www.yourdomain.com](http://www.yourdomain.com)。换句话说，如果你对你的网站有职业抱负，你不会希望它托管在\
  \ ISP 可能提供的免费空间上。\n\n***\n\n### 为你的网站寻找主机\n\n除非你拥有自己的服务器，否则你可能需要付钱让人托管你的网站。Web 主机提供其服务器的一部分来存放你网站的文件，并提供其他服务，例如允许你创建与你的域名关联的电子邮件地址（例如\
  \ `yourname@yourdomain.com`）。\n\n有数百家公司提供网站托管服务。大多数公司收取取决于其提供服务的月费。有些公司提供免费的托管以换取你网站的广告。虽然你可以在互联网上搜索\
  \ Web 主机，但我建议与朋友交流，看看他们是否在使用他们喜欢的主机——或者你信任的博客作者可能已经了他们使用哪家公司作为主机。\n\n在考虑主机时，除了价格，还有许多需要注意的事项：\n\
  \n- 他们会为你的网站提供多少磁盘空间？不要支付超过你需要的费用。话虽如此，通常即使是最基础的账户也会为你的网站提供充足的空间。记住，HTML 文件占据的空间非常小，而图像、音频文件和视频占据的空间逐渐增大。\n\
  - 他们的账户每月允许多少数据传输（带宽）？这代表了他们为你的访问者提供的数据总大小（HTML、CSS、图像、媒体文件等），而不是他们允许你在服务器上存储的内容。所以，如果你预计访问者会访问你网站上的很多大文件，你需要更大的月度传输配额。\n\
  - 他们是否有针对高流量网站的计划，以确保网站不会崩溃？\n- 你可以为你的域名创建多少个邮箱？（托管公司通常允许创建很多。）\n- 该账户是否允许你托管多个域名，还是每个网站都需要对应一个独立的账户？\n\
  - 他们提供什么种技术支持？是通过电话、电子邮件还是在线聊天？他们需要多久回复你？另外，他们的网站上是否有大量的支持信息？（你可以在成为客户之前检查这些内容的质量。）\n\
  - 他们多久对一次服务器上的数据进行备份（以防出现问题）？\n- 账户带有什么种服务器端语言和软件包？他们是否使用 `PHP`、`MySQL`、`WordPress`\
  \ 或其他高级功能？\n- 他们是否提供 Web 分析报告，让你知道有多少人访问了你的网站以及其他有用数据？\n\n***\n\n## 连接你的域名和 Web\
  \ 主机\n\n一旦注册了域名并找到了 Web 主机，重要一步是将它们连接起来：你必须将域名指向你的主机，这样访问者输入你的 URL 时你的网站就会加载。\n\n\
  为了实现这一点，你需要配置你的域名（参见“连接你的域名和 Web 主机”）。如果你通过注册商注册了域名，请登录你的账户。如果你通过 Web 主机注册的，请登录那里。\n\
  \n另一个需要注意的点是：当你更改名称服务器设置时，更新通常需要 24 到 48 小时才能遍布互联网。所以，即使你更新了域名，你的朋友可能无法立即访问你的网站。它最终会在所有地方显示。\n\
  \n***\n\n### 将文件传输到服务器\n\n为了让互联网上的其他人看到你的页面，你必须将它们上传到 Web 主机的服务器。做到这一点的一种简单方法是使用\
  \ FTP 客户端，例如 Filezilla ([`filezilla-project.org`](http://filezilla-project.org))，它是\
  \ Windows、Mac OS 和 Linux 均免费的（参见其他 FTP 客户端的提示）。\n\n通常，在你注册账户后，Web 主机会向你发送 FTP 连接信息。（如果你没有收到，请联系他们。）一旦你有了这些信息，就可以配置服务器连接并将其以名称保存，以便随时访问想要发布的文件（或从你的网站服务器下载它们）。\n\
  \n![Image](img/red_circle-a.jpg) 要要输入新服务器的信息，请从 Filezilla 主窗口选择 `File > Site Manager`。Site\
  \ Manager 是你为每个站点配置 FTP 连接详情的地方。\n\n![Image](img/21_03.jpg)\n\n![Image](img/red_circle-b.jpg)\
  \ 当你点击 Site Manager 中的 New Site 按钮时，“My Sites”下方会出现一个临时名称。\n\n![Image](img/21_04.jpg)\
  \ 将临时名称替换为你选择的名称，然后在 General 选项卡中配置连接详情。`Connect` 按钮会保存信息并立即与服务器建立连接。`OK` 按钮仅保存信息。\n\
  \n![Image](img/21_05.jpg)\n\n\n\n\n\n![Image](img/red_circle-d.jpg) 现在，你网站的连接信息已保存在站点管理器中，你无需每次重新输入即可连接到你的\
  \ Web 主机 FTP 服务器。在 Mac 或 Windows 上，返回站点管理器（通过服务器图标或 ![Image](img/gray_circle-a.jpg)\
  \ 中的菜单），从列表中选择你的站点，并选择连接 ![Image](img/gray_circle-c.jpg)。或者在 Windows 上，如此处所示，你可以激活服务器图标（位于最左侧）旁边的箭头，从显示的菜单中选择你的站点名称。FileZilla\
  \ 将连接到服务器。\n\n![Image](img/21_06.jpg)\n\n![Image](img/red_circle-e.jpg) 在窗口的右侧，选择服务器的目标目录。在窗口的左侧，导航到计算机上包含你想要上传的文件的目录。然后右键点击你想上传到服务器的文件或文件夹，并选择\
  \ `Upload`。\n\n![Image](img/21_08.jpg)\n\n![Image](img/red_circle-f.jpg) 新传输的文件夹出现在窗口右侧的框架中。对所有想要传输到网站的文件和文件夹重复相同的过程。或者，要一次传输多个文件，可以选择多个文件或文件夹，然后右键点击选择\
  \ `Upload`。\n\n![Image](img/21_09.jpg)\n\n注意 FileZilla 在 Mac OS 和 Windows 上的外观不同，但界面配置非常相似（图示显示了操作系统的混合）。另有说明外，使用它们的步骤是相同的。\n\
  \n### 定义新 FTP 站点的属性\n\n1. 从 FileZilla 的主菜单选择 `File` > `Site Manager` ![Image](img/gray_circle-a.jpg)。\n\
  \n2. 在站点管理器窗口中，点击 `New Site` 按钮 ![Image](img/gray_circle-b.jpg)。`My Sites` 下会出现一个你站点的临时名称。\n\
  \n3. 为站点输入一个名称（替换临时名称）。它不需要与你的域名相同；它只是一个标签。按照你的 Web 主机提供的信息填写 `General` 标签页下的相应的字段。至少，这通常涉及输入主机\
  \ URL、在 `Logon Type` 选项中选择 `Normal`，并输入你的用户名和密码（通常在设置账户时创建）![Image](img/gray_circle-c.jpg)。\n\
  \n4. 一旦完成连接详情的指示，点击 `Connect` 按钮保存信息并立即连接到服务器，或点击 `OK` 按钮保存信息并稍后连接 ![Image](img/gray_circle-c.jpg)。\n\
  \n### 使用 FileZilla 将文件传输到服务器\n\n1. 打开 FileZilla。\n\n2. 选择服务器图标旁边的箭头（位于最左侧，就在主菜单下方）。然后从显示的菜单中选择你的站点名称\
  \ ![Image](img/gray_circle-d.jpg)。FileZilla 将与你的服务器建立连接。\n\n3. 在窗口的右侧，导航到你想上传文件的服务器目录。\n\
  \n4. 在窗口的左侧，导航到计算机上包含你想要上传文件的目录。\n\n5. 在左侧框架中右键点击所需的文件或文件夹，从出现的菜单中选择 `Upload` ![Image](img/gray_circle-e.jpg)。文件正在传输\
  \ ![Image](img/red_circle-f.jpg)（对于大文件如视频，这将需要更长的时间）。你也可以反向传输文件（参见第一个提示）。\n\n6.\
  \ 你的网站更新现在已生效。在 `www.*yourdomain.tld` 浏览你的网站（`yourdomain.tld` 是你注册的域名；`.tld` 是顶级域名，除非你注册了不同扩展名的域名，否则它为\
  \ `.com`），以确保一切运行正常。根据需要编辑计算机上的任何文件，并按照步骤 3 到 5 将它们上传到服务器（如果过了很长时间，你可能需要再次执行步骤 2）。重复此步骤，直到网站符合你的预期。\n\
  \n7. 完成文件传输后，关闭 FileZilla 或从主菜单选择 `Server` > `Disconnect` ![Image](img/red_circle-g.jpg)。\n\
  \n![Image](img/red_circle-g.jpg) 完成后选择 `Server` > `Disconnect`。\n\n![Image](img/21_10.jpg)\n\
  \n**提示**\n你也可以从你的网站服务器传输文件到你的计算机。要这样做，右键点击右侧框架中的文件或文件夹，从出现的菜单中选择 `Download`。\n\n\
  **提示**\nFileZilla 只是许多可用 FTP 客户端之一。Mac OS X 的其他一些流行的客户端包括 CyberDuck（免费，[`cyberduck.ch`](http://cyberduck.ch)）、Transmit\
  \ ([www.panic.com/transmit](http://www.panic.com/transmit)) 和 Fetch ([`fetchsoftworks.com`](http://fetchsoftworks.com))）。Mac\
  \ OS X 还有内置的 FTP 功能（参见 [`osxdaily.com/2011/02/07/ftp-from-mac/`](http://osxdaily.com/2011/02/07/ftp-from-mac/))）。在线搜索“FTP\
  \ client”以查找适用于 Windows 和 Mac 的更多选择。它们的工作原理相似，但某些比其他的功能更多。\n\n**提示**\n当你传输文件和文件夹时，它们会被复制到目标文件夹。源位置保留其版本。\n\
  \n**提示**\n当你传输一个目标已包含的文件或文件夹时，你的 FTP 程序可能会提示你（FileZilla 会这样做）确认你是否要覆盖。然而，每个 FTP\
  \ 客户端都不同，因此它可能不会询问你的许可。对测试文件尝试以了解你的 FTP 客户端如何处理此类情况。\n\n**提示**\n当你将文件夹传输到服务器时，代码中的相对\
  \ URL 将保持不变。\n\n**提示**\n如果你的网站在访问 URL 时没有加载，可能是由于几个原因。首先，双检查你是否将文件上传到了正确的目录。通常，你的页面应该位于名为\
  \ `public_html`、`www` 或类似的目录中。你的 Web 主机说明书中会指定正确的位置；如果不确定，请询问他们。\n\n\n\n\n\n## `::after`\
