  \nCSS3 提供了两种渐变样式 `linear-gradient` 和 `radial-gradient`，它们可以作为 `background` 和 `background-image`\
  \ 属性的值。\n\n#### 表 B.4. 渐变\n\n![Image](img/app-b_tab04.jpg)\n\n### 媒体查询\n\n媒体查询评估媒体类型和特性，它是一个真或假的逻辑表达式。在标准语法中，使用\
  \ `and` 同时测试多个特性，并使用逗号分别测试组。例如，`screen and (max-width:800px)` 如果媒体类型为 `screen` 且显示区域不超过\
  \ 800 像素则为真，但 `screen, (max-width:800px)` 只要任一值为真即为真。\n\n下表描述了可以使用媒体查询检测的特性以及这些特性所测试的值。媒体查询可以作为\
