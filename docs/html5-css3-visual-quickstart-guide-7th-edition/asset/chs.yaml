  \n### 创建表单\n\n表单由三个部分组成：表单元素，它包含了处理表单的脚本 URL 及其处理方法（`post` 或 `get`）；表单单项元素，如字段和选择框（复选框、下拉菜单和单选按钮）；以及提交按钮，它触发将数据发送到服务器上监听的脚本\
  \ ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg) 每个表单都有三个部分：表单元素、访客输入信息的实际表单元素，以及将收集的信息发送到服务器的提交按钮（或活动图像）。\n\
  \n***\n\n* * *\n\n```html\n<form method=\"post\" action=\"showform.php\">\n    <fieldset>\n\
  \      <h2 class=\"account\">Account</h2>\n      <ul>\n        <li>\n          <label\
  \ for=\"first_name\">First Name:</label>\n          <input type=\"text\" id=\"first_name\"\
  \ name=\"first_name\" class=\"large\" />\n        </li>\n        <li>\n        \
  \  <label for=\"last_name\">Last Name:</label>\n          <input type=\"text\" id=\"\
  last_name\" name=\"last_name\" class=\"large\"/>\n        </li>\n...\n        <input\
  \ type=\"submit\" class=\"create_profile\" value=\"Create Account\">\n    </fieldset>\n\
  </form>\n```\n\n* * *\n\n关于选择表单应该使用 `method=\"post\"` 还是 `method=\"get\"`，有很多细节需要考虑。通常，我建议使用\
  \ `method=\"post\"`，因为你可以向服务器发送更多数据，而且表单中的信息不会显示在 URL 中。因此，如果你正在数据库中执行保存、添加和删除操作，`post`\
  \ 是正确的选择。如果你的表单使用 `method=\"get\"`，你的表单数据将显示在浏览器的地址栏中，这样用户可以收藏结果。大多数搜索引擎在它们的搜索表单中使用\
  \ `method=\"get\"`，以便你可以保存搜索查询或将其发送给朋友。\n\n### 创建表单\n\n1. 输入 `<form method=\"post\"\
  `。\n2. 输入 `action=\"script.url\">`，其中 `script.url` 是提交表单时运行的脚本在服务器上的位置。\n3. 创建表单内容（包括提交按钮），如从“创建文本框”开始的章节中所示。\n\
  4. 输入 `</form>` 完成表单。\n\n* * *\n\n**提示**\n\n你可以从书籍的网站（[www.bruceontheloose.com/htmlcss/examples/](http://www.bruceontheloose.com/htmlcss/examples/))\
  \ 下载 `showform.php` 脚本，并在第 2 步中使用它，在本章的学习过程中测试你的表单。它在 ![Image](img/gray_circle-a.jpg)\
  \ 的“处理表单”中也有展示。\n\n* * *\n\n* * * \n\n**提示**\n\n为了让访客向你发送表单中的数据，你需要包含一个按钮。\n\n*\
  \ * *\n\n* * * \n\n**提示**\n\n你可以使用 CSS 来布局你的表单元素 ![Image](img/red_circle-b.jpg)。我在本章中通过插图演示的表单示例显示于\
  \ ![Image](img/red_circle-c.jpg)。\n\n![Image](img/red_circle-b.jpg) 这是用于格式化表单的样式表的一部分。你可以在书籍网站上找到完整的样式表（[www.bruceontheloose.com/htmlcss/examples/](http://www.bruceontheloose.com/htmlcss/examples/)）。\n\
