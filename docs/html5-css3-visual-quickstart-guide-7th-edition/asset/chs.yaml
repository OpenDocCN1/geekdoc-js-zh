  \n## 指定时间\n你可以使用 `time` 元素标记精确的时间或日期。该元素是 HTML5 新引入的。（请参阅 datetime 格式 的更多细节。）\n\n\
  `time` 的常用的用途之一是指示 `article` 元素的发布日期。为此，请包含 `pubdate` 属性。带有 `pubdate` 的 `time` 元素代表最近祖先\
  \ `article` 元素的发布日期 ![Image](img/red_circle-a.jpg)。你也可以使用 `time`、`datetime` 和 `pubdate`\
  \ 为文章的读者评论标记时间，假设每条评论都嵌套在所属文章的 `article` 元素中（参见创建文章 中的示例 2）。\n\n```html\n...\n<body>\n\
  <article>\n  <header>\n    <h1>猎豹与羚羊成为好朋友</h1>\n    <p><time datetime=\"2011-10-15\"\
  \ pubdate=\"pubdate\">2011 年 10 月 15 日</time></p>\n  </header>\n  ... [文章内容] ...\n\
  </article>\n</body>\n</html>\n```\n\n![Image](img/red_circle-a.jpg) 正如所示，`datetime`\
  \ 属性和 `time` 元素的文本反映同一个日期，尽管它们的写法可能有所不同（参见 ![Image](img/gray_circle-c.jpg) 的更多示例）。\n\
  \n`time` 元素在 HTML5 中被称为分节根，这意味着它对文档大纲的 `h1–h6` 有贡献。参见文档大纲 的第 4 章。\n\n`time` 元素表示在\
  \ `figure` 中使用可选的 `figcaption`。\n\n\n\n\n\n![Image](img/red_circle-c.jpg) `time`\
  \ 元素有多种使用方法。最简单的形式（第一个示例）缺少 `datetime` 属性。但当省略 `datetime` 时，它*确实*提供了按照要求的有效格式的日期和时间。前三个示例在\
  \ `time` 标签内部包含了时间和和/或日期文本，这些内容将显示在屏幕上 ![Image](img/gray_circle-d.jpg)。我建议你始终包含这种人类可读的时间格式，因为目前浏览器否则不会显示值\
  \ ![Image](img/gray_circle-b.jpg)。\n\n* * *\n\n...\n\n```html\n<body>\n\n<p>火车将于\
  \ <time>08:45</time> 和 <time>16:20</time> 抵达 <time>2012-04-10</time>。</p>\n\n<p>我们于\
  \ <time datetime=\"1952-06-12T11: 05:00\">1952 年 6 月 12 日上午 11:05</time> 从珠穆朗玛峰开始下山。</p>\n\
  \n<p>他们为 <time datetime=\"2011-09-20T18: 30:00\">今晚 6:30</time> 预订了晚餐。</p>\n\n<p>唱片发布会于\
  \ <time datetime=\"2011-12-09\"></time>。</p>\n\n</body>\n\n</html>\n```\n\n* * *\n\
  \n![Image](img/red_circle-d.jpg) 前三个段落显示了时间。最后一个则没有（请参见最后一个提示）。\n\n![Image](img/04_05.jpg)\n\
  \n#### 若要指定精确的时间、日历日期或两者\n\n**1.** 输入 `<time` 以开始一个时间元素。\n\n**2.** 如果需要，输入 `datetime=\"\
  time\"`，其中 `time` 使用经批准的格式表示（请参见侧边栏“理解 `datetime` 格式””）。\n\n**3.** 如果时间代表文章或整个页面的发布日期，请输入\
  \ `pubdate=\"pubdate\"` 或 `pubdate`。\n\n**4.** 输入 `>` 完成起始标签。\n\n**5.** 如果你想让时间在浏览器中显示，请输入反映时间、日期或两者的文本（请参见关于允许的文本格式的第一个提示）。\n\
  \n**6.** 输入 `</time>`。\n\n* * *\n\n提示\n\n如果你省略了 `datetime` 属性，文本内容必须符合有效的日期或时间格式。换句话说，![Image](img/gray_circle-c.jpg)\
  \ 中的第一个示例不能编码为 `<p>火车将于 <time>8:45 a.m.</time> 和 <time>4:20 p.m.</time> 抵达 <time>2012\
  \ 年 10 月 4 日</time>。</p>`。然而，当你确实包含了 `datetime` 时，你可以随所欲地在文本内容中表示日期或时间，如 ![Image](img/gray_circle-c.jpg)\
  \ 中的第二个和第三个示例所示。\n\n* * *\n\n* * *\n\n提示\n\n不要使用 `time` 来标记不的日期或时间，例如“20 世纪 50 年代”、“午夜后不久”、“文艺复兴后期”或“上周初”。\n\
  \n* * *\n\n* * *\n\n提示\n\n如果你想让它在页面中显示，请始终在 `time` 元素内部包含时间和日期的文本版本。如果缺失，浏览器本应该显示基于\
  \ `datetime` 值的文本，但在本书期间这种支持非常匮乏 ![Image](img/gray_circle-d.jpg)。\n\n* * *\n\n*\
  \ * *\n\n### 理解 `datetime` 格式\n\n`time` 元素的时间基于 24 小时制，并带有可选的相对于 UTC（协调世界时）的时区偏移量。`datetime`\
  \ 属性提供了机器可读格式的日期和时间，我在这个初始示例中对其进行了简化：\n\n`YYYY-MM-DDThh:mm:ss`\n\n例如（本地时间）：\n\n\
  `2011-11-03T17:19:10`\n\n这意味着“本地时间 2011 年 11 月 3 日下午 5:19 之后 10 秒”。`T` 分隔了日期（`YYYY-MM-DD`）和时间（`hh:mm:ss`），如果你包含了时间，秒是可选的。（你也可以以\
  \ `hh:mm.sss` 的格式提供带有毫秒的时间。注意毫秒前的点。）\n\n如果你愿意，可以在全局语境中表示你的时间。在末尾添加 `Z`，时区即为 UTC。\n\
  \n例如（UTC 全局时间）：\n\n`2011-11-03T17:19:10Z`\n\n或者，你可以通过省略 `Z` 并在偏移量前加上 `-`（负）或 `+`（加）来指定相对于\
  \ UTC 的时区偏移量。\n\n例如（带有 UTC 偏移的全局时间）：\n\n`2011-11-03T17:19:10-03:30`\n\n这意味着“纽芬兰标准时间\
  \ 2011 年 11 月 3 日下午 5:19 之后 10 秒（它是负三个半小时）”。UTC 时区偏移列表可见 [`en.wikipedia.org/wiki/List_of_time_zones_by_UTC`](http://en.wikipedia.org/wiki/List_of_time_zones_by_UTC)。\n\
  \n当你包含了 `datetime` 时，你可以随所欲地在如 ![Image](img/gray_circle-c.jpg) 中的第二个和第三个示例所示的文本内容中表示日期或时间。\n\
  \n\n\n\n\n你可以将**粗体文本**嵌套在一个同样标记为粗体的短语中。如果你这样这样做，粗体文本每当成为另一个粗体的子元素时，其重要性就会增加。嵌套在另一个\
  \ *em* 元素中的强调文本的强调程度也是如此。例如，“在 11 月 17 日前提交”在语义上比该句子中的其他粗体文本更重要：<p><strong>记住条目**<strong>在\
  \ 11 月 17 日前提交</strong>。</strong></p>。\n\n* * *\n\n* * *\n\n### 提示\n你可以使用 CSS 将任何文本样式化为粗体或斜体，覆盖浏览器对\
  \ `strong` 和 `em` 等元素的默认样式 `![Image](img/gray_circle-b.jpg)`。更多细节，请参阅第 10 章中的“创建斜体”和“应用粗体格式”。\n\
  \n* * *\n\n* * *\n\n### 提示\n如果你在 HTML5 之前有过 HTML 经验，你可能知道在当时 `strong` 代表比 `em` 具有更强调的文本。然而，在\
  \ HTML5 中，`em` 是唯一表示强调的元素，而 `strong` 已转变为表示重要性。\n\n* * *\n\n* * *\n\n## `b` 和 `i`\
  \ 元素：在 HTML5 中重新定义\n\nHTML5 关注的是语义，而不是元素的呈现。`b` 和 `i` 元素是 HTML 早期阶段的遗留，当时它们被用于使文本加粗或倾斜（那时\
  \ CSS 还不存在）。由于它们的呈现性质，它们在 HTML 4 和 XHTML 1 中理所当然地不再流行。程序员被鼓励使用 `strong` 代替 `b`，使用\
  \ `em` 代替 `i`。事实证明，`em` 和 `strong` 并不总是语义上恰的。HTML5 通过重新定义 `b` 和 `i` 解决了这个问题。\n\n\
  传统出版中的某些排版规范在现有的 HTML 语义中被忽略。其中包括对某些科学名称使用斜体（例如，“*Ulmus americana* 是马萨诸塞州的州树。”）、命名的车辆（例如，“我们乘坐*东方快快号*。”）以及（对于英语而言的）外语短语（例如，“这对夫妇表现出具有感染力的\
  \ *joie de vivre*。”）。这些术语斜体并不是为了强调，而是根据惯例进行样式化。\n\nHTML5 并没有创建多个新的语义元素（并进一步增加混乱）来处理此类情况，而是采取了务实的态度，尝试利用现有的资源：`em`\
  \ 用于所有级别的强调，`strong` 用于重要性，而 `b` 和 `i` 则用于这些被语义遗漏的情况。\n\n这种理念是，尽管 `b` 和 `i` 不带有显式的语义含义，但读者会识别出隐含的差异，因为它们与周围文本不同。你仍然可以使用\
  \ CSS 改变它们的显示（变为粗体和斜体）。HTML5 强调，只有当其他元素（如 `strong`、`em`、`cite` 等）不起作用时，你才将最后手段使用\
  \ `b` 和 `i`。\n\n### `b` 元素简述\n\nHTML5 这样重新定义了 `b` 元素：\n\n`b` 元素代表一段文本，出于实用目的吸引了读者的注意力，但不传达任何额外的重要性，也不暗示替代的语气或情绪，例如文档摘要中的关键词、评论中的产品名称、交互式文本驱动软件中的可操作词汇，或文章的导语。\n\
  \n例如：\n\n<p><b>XR-5</b>（也被称为 <b>Extreme Robot 5</b>）是我们测试过的最好的机器人。</p>\n\n`b` 元素默认渲染为粗体。\n\
  \n### `i` 元素简述\n\nHTML5 这样重新定义了 `i` 元素：\n\n`i` 元素代表一段以另一种语气或情绪表示的文本，或者以某种方式偏离普通正文，这种方式表示了不同的文本质量，例如分类学名称、技术术语、来自另一种语言的习语短语、想法，或西方文本中的船名。\n\
  \n以下是一些示例：\n\n<p><i lang=\"la\">Ulmus americana</i> 是马萨诸塞州的州树。</p>\n\n<p><i>东方快快号</i>\
  \ 于 1883 年开始运营。</p>\n\n<p>这对夫妇表现出具有感染力的 <i lang=\"fr\">joie de vivre</i>。</p>\n\n\
  `i` 元素默认显示为斜体。\n\n* * *\n\n### 标示（引用）或参考\n\n使用 `cite` 元素对来源进行引用或参考。示例包括戏剧、剧本或书籍的标题；歌曲、电影、照片或雕塑的名字；演唱会或音乐之旅；规范；报纸或法律文件等（`![Image](img/red_circle-a.jpg)`\
  \ 和 `![Image](img/red_circle-b.jpg)`）。\n\n![Image](img/red_circle-a.jpg) `cite`\
  \ 元素适用于标记艺术品、音乐、电影和书籍的标题。\n\n* * *\n\n...\n\n<p>他在听 <cite>阿比路路</cite> 的同时，看着 <cite>电影艰难的一夜</cite>\
  \ 并阅读 <cite>《披头士全集</cite>。</p>\n\n<p>当他去卢浮宫时，他知道 <cite>蒙娜丽莎</cite> 也称为 <cite lang=\"\
  it\">La Gioconda</cite>。</p>\n\n...\n\n* * *\n\n![Image](img/red_circle-b.jpg) `cite`\
  \ 元素默认显示为斜体。\n\n![Image](img/04.jpg)\n\n#### 引用参考\n\n**1.** 输入 `<cite>`。\n\n**2.**\
  \ 输入参考。\n\n**3.** 输入 `</cite>`。\n\n* * *\n\n### 提示\n对于引用来源的情况，请适当使用 `blockquote`\
  \ 或 `q` 元素来标记（参见“引用文本”）。明确的是，`cite` 仅用于引用的来源。\n\n* * *\n\n* *\n\n### HTML5 与使用 `cite`\
  \ 元素表示名称\n\n在开发社区存在大量分歧的情况下，HTML5 明确声明使用 `cite` 表示名称是无效的，尽管之前的 HTML 版本允许这样做。\n\n\
  HTML 4 提供了以下示例（我将元素改为大写）：\n\n正如 <cite>哈里·杜鲁曼</cite> 所说<q lang=\"en-us\">责任在此</q>。\n\
  \n除了这些情况，网站经常使用 `cite` 表示博客文章留言者的名字（WordPress 默认主题也是如此）。\n\n许多开发者明确表示，他们打算在 HTML5\
  \ 页面中继续使用 `cite`，因为 HTML5 没有提供他们认可的替代方案（即 `span` 和 `b` 元素）。Jeremy Keith 在 [`24ways.org/2009/incite-a-riot/`](http://24ways.org/2009/incite-a-riot/)\
  \ 中激烈地主张了这一观点。\n\n\n\n\n\n![Image](img/red_circle-b.jpg) 浏览器默认通常会缩进引用块文本。从历史上看，浏览器不会显示\
  \ `cite` 属性的值（参见第二条提示中的相关建议）。而 `cite` 元素则受到所有浏览器的支持，并且通常以斜体显示，如图所示。所有这些默认样式都可以通过\
  \ CSS 覆盖。\n\n![Image](img/04_08.jpg)\n\n![Image](img/red_circle-c.jpg) 如果引用的文本与页面的默认语言（由\
  \ `html` 元素上的 `lang` 属性指定）不同，请向 `q` 元素添加 `lang` 属性。\n\n* * *\n\n...\n\n<body>\n\n\
  <p>然后她说：<q>你读过芭芭拉·金索尔沃的<cite>图森的高潮</cite>吗？它很鼓舞人心。</q></p>\n\n<p>她又试了一次，这次用法语说：<q\
  \ lang=\"fr\">Avez-vous lu le livre <cite>High Tide in Tucson</cite> de Kingsolver?\
  \ C'est inspirational.</q></p>\n\n</body>\n\n</html>\n\n* * *\n\n浏览器应该自动用特定语言的引号将\
  \ `q` 元素文本括起来，但 Internet Explorer 直到 `IE8` 才支持这一功能。一些浏览器在处理嵌套引用时也存在问题。请务必阅读提示，了解使用\
  \ `q` 元素之外的替代方案。\n\n### 引用一段文本\n\n**1.** 输入 `<blockquote` 开始一个块引用。\n\n**2.** 如果需要，输入\
  \ `cite=\"url\"`，其中 `url` 是引用来源的地址。\n\n**3.** 输入 `>` 完成开始标签。\n\n**4.** 输入你想要引用的文本，并根据需要将其包裹在段落和其他元素中。\n\
  \n**5.** 输入 `</blockquote>`。\n\n### 引用一个短短语\n\n**1.** 输入 `<q` 开始引用一个单词或短语。\n\n**2.**\
  \ 如果需要，输入 `cite=\"url\"`，其中 `url` 是引用来源的地址。\n\n**3.** 如果引用的语言与页面的默认语言（由 `html` 元素上的\
  \ `lang` 属性指定）不同，输入 `lang=\"xx\"`，其中 `xx` 是引用语言的两个字母代码。这个代码*应该*决定使用的引号类型（英语用“”，许多欧洲语言用«»，等等），但浏览器对此渲染的支持可能有所不同。\n\
  \n**4.** 输入 `>` 完成开始标签。\n\n**5.** 输入应该被引用的文本。\n\n**6.** 输入 `</q>`。\n\n* * *\n\n\
  ### 提示\n\n虽然允许，但避免将文本直接放在 `blockquote` 的开始和结束标签之间。相反，应将其包裹在 `p` 或其他语义合适的元素中，放在块引用内部。\n\
  \n* * *\n\n* * *\n\n### 提示\n\n你可以在 `blockquote` 和 `q` 上使用可选的 `cite` 属性，以提供所引用来源的\
  \ URL。不幸的是，浏览器传统上不会向用户显示 `cite` URL ![Image](img/gray_circle-b.jpg)，因此它本身并不是最有用的属性。因此，如果你确实包含了\
  \ `cite`，我建议你在内容中通过链接（`a` 元素）重复该 URL，以便访问者能够访问它。效果较差的方式是通过 `JavaScript` 暴露 `cite`\
  \ 的值。\n\n* * *\n\n* * *\n\n### 提示\n\n`blockquote` 元素在 HTML5 中被称为分区根（sectioning root），这意味着它可以包含\
  \ `h1–h6` 标题（因此有自己的大纲），但这些标题不会贡献给文档大纲。这与分区*内容*非常不同。请参阅第 3 章中的“理解 HTML5 的文档大纲”。\n\
  \n* * *\n\n* * *\n\n### 提示\n\n对于跨越一个段落以上的引用，`q` 元素是无效的。\n\n* * *\n\n* * *\n\n###\
  \ 提示\n\n确保不要仅仅因为想要在单词或短语周围加上引号就使用 `q`。例如，`<p>每次我听到<q>大豆</q>这个词，我都会高兴得跳起来。</p>` 是不正确的，因为“大豆”并不是来自某个来源的引用。\n\
  \n* * *\n\n* * *\n\n### 提示\n\n你可以嵌套 `blockquote` 和 `q` 元素。例如，`<p>这个短故事开头写道：<q>当她还是个孩子时，她会对她遇到的每个人说：<q>你好，陌生人！</q></q></p>`。嵌套的\
  \ `q` 元素应该自动具有适当的引号——在英语中，外层引号应为双引号，内层应为单引号——但浏览器支持情况各异。由于外层和内层引用在不同语言中处理方式不同，请根据需要向\
  \ `q` 添加 `lang` 属性（![Image](img/gray_circle-c.jpg) 和 ![Image](img/red_circle-d.jpg)）。\n\
  \n![Image](img/red_circle-d.jpg) 浏览器应该自动在 `q` 元素周围添加花体双引号（在嵌套的 `q` 元素周围添加花体单引号）。如图所示，Firefox\
  \ 做到了，但并非所有浏览器都如此（例如，旧版 Internet Explorer）。\n\n![Image](img/04_09.jpg)\n\n* * *\n\
  \n* * *\n\n### 提示\n\n由于 `q` 存在跨浏览器问题 ![Image](img/gray_circle-d.jpg)，许多（可能是大多数）程序员选择直接输入适当的引号或使用字符实体，而不是使用\
  \ `q` 元素。在 HTML5 Doctor 上，Oli Studholme 在其深入文章“使用 `<blockquote>`、`<q>`、`<cite>`\
  \ 和 `cite` 属性进行引用和引证”中讨论了这一点以及更多内容，例如 `html5doctor.com/blockquote-q/`。\n\n\n\n\n\
  \n![Image](img/red_circle-d.jpg) 带有标记的这段代码被标注出（call out）。\n\n![Image](img/04_11.jpg)\n\
  \n### 高亮文本\n\n1. 输入 `<mark>`。\n2. 输入你想要引起注意的单词或词组。\n3. 输入 `</mark>`。\n\n> 提示\n`mark`\
  \ 元素与 `em`（表示强调）或 `strong`（表示重要性）都不相同。这两个元素在本章中也会介绍。\n\n> 提示\n由于 `mark` 是 HTML5\
  \ 中引入的新元素，旧版浏览器默认不会渲染背景颜色 ![Image](img/gray_circle-b.jpg) 且 ![Image](img/gray_circle-d.jpg)。你可以通过在样式表中添加\
  \ `mark { background-color: yellow; }` 来让它们这样做。\n\n> 提示\n务必不要仅仅为了给文本添加背景颜色或其他视觉效果而使用\
  \ `mark`。如果你只是寻找一种美化文本的方法，并且没有合适的语义化 HTML 元素来包裹它，请使用 `span` 元素（在本章中介绍）并使用 CSS 进行样式设置。\n\
  \n### 解释缩写\n\n缩写随处可见，无论是如 `Jr.`、`M.D.` 还是老旧的 HTML。你可以使用 `abbr` 元素来标记缩写并解释它们的含义 (![Image](img/red_circle-a.jpg)\
  \ 到 ![Image](img/red_circle-c.jpg))。你不需要将每个缩写包裹在 `abbr` 中，只有当你认为为访问者提供全称会有帮助时才这样做。\n\
  \n![Image](img/red_circle-a.jpg) 使用可选的 `title` 属性提供缩写的完整版本。或者（也可以认为是更好的方法是），你可以将全称放在缩写后的括号里。或者混合使用。大多数人都会熟悉\
  \ *laser*（激光）和 *scuba*（水肺装备）之类的词，因此用 `abbr` 标记它们并提供标题 并不是真的必要，但为了演示，我在这里做了。\n\n\
  ```html\n<body>\n<p><abbr title=\"国家橄榄球联盟\">NFL</abbr> 承诺在每场晚间赛后晚上 9 点举行一场 <abbr\
  \ title=\"受激发射辐射激光放大\"> laser</abbr> 秀。</p>\n<p>但是，与 <abbr>MLB</abbr>（大联盟棒球）所做的相比，那不算什么。他们在雨停期间发放了免费的\
  \ <abbr title=\"封闭式水下呼吸器\">scuba</abbr> 装备。</p>\n</body>\n</html>\n```\n\n![Image](img/red_circle-b.jpg)\
  \ 当缩写具有 `title` 属性时，Firefox 和 Opera 用虚线下划线引起它们的注意（你可以通过 CSS 让其他浏览器也这样做；参见提示）。在除\
  \ IE6 之外的所有浏览器中，当访问者悬停在 `abbr` 上时，元素 `title` 的内容将以提示框的形式显示。\n\n![Image](img/04_12.jpg)\n\
  \n![Image](img/red_circle-c.jpg) Chrome 以及其他浏览器会将缩写的标题显示为提示框，但除非你自己应用了某些 CSS，否则它们对缩写本身的显示没有任何任何不同。\n\
  \n![Image](img/04_13.jpg)\n\n### 如何解释缩写\n\n1. 输入 `<abbr>`。\n2. 可选地，接下来输入 `title=\"\
  expansion\"`，其中 `expansion` 是代表缩写的单词。\n3. 输入 `>`。\n4. 然后输入缩写本身。\n5. 最后，用 `</abbr>`\
  \ 结束。\n6. 可选地，输入一个空格和 `(expansion)`，其中 `expansion` 是代表缩写的单词。\n\n> 提示\n一种常见的做法是只在缩写在页面上第一次出现时提供其全称（通过\
  \ `title` 属性或括号）![Image](img/gray_circle-a.jpg)。\n\n> 提示\n使用括号提供全称是描述缩写最明确的方式，使得更广泛的访问者能够看到\
  \ ![Image](img/gray_circle.jpg)。例如，手机和平板电脑等触摸屏设备上的用户可能无法悬停在 `abbr` 元素上查看标题。因此，如果你提供了全称，请考虑尽可能将其放在括号中。\n\
  \n> 提示\n如果你使用复数形式的缩写，请务必将全称也变为复数形式。\n\n> 提示\n作为给视力用户的视觉提示，Firefox 和 Opera 等浏览器如果\
  \ `abbr` 具有 `title`，会显示带有虚线下框的框 ![Image](img/gray_circle-b.jpg)。如果你想在所有浏览器中（除 IE6\
  \ 外）复制该效果，请在你的样式表中添加：`abbr[title] { border-bottom: 1px dotted #000; }`。无论 `abbr`\
  \ 是否设置了边框，浏览器都会将 `title` 属性的内容作为提示框 ![Image](img/gray_circle-c.jpg)。\n\n> 提示\n如果你在\
  \ Internet Explorer 7 中没有看到 `abbr` 的虚线下框，请尝试调整父元素的 CSS `line-height`（行高）属性（参见第 10\
  \ 章）。\n\n> 提示\nIE6 不支持 `abbr`，所以你看不到框或提示框，只有文本。如果你真的想在 IE6 中为 `abbr` 设置样式，你可以在 CSS\
  \ 之前，在针对 IE6 的 JavaScript 文件中放入 `document.createElement('abbr')`。我建议跳过它，让 IE6 作为一个特例吧。（参见第\
  \ 11 章了解更多关于与 IE8 中新样式相关的 `document.createElement`）。\n\n> 提示\n在 HTML5 之前，HTML 有\
  \ `acronym` 元素，但 HTML5 取消了 `acronym`，转而使用 `abbr` 用于所有实例。\n\n### 定义术语\n\n`dfn` 元素标记了你定义术语的地方\
  \ ![Image](img/red_circle-d.jpg)。将 `dfn` 仅包裹在你定义术语的处。\n\n![Image](img/red_circle-a.jpg)\
  \ 注意，尽管 *pleonasm* 在示例中出现了两次，但 `dfn` 只标记了其中一个，因为那是我定义术语的地方。同样，如果我在文档的后续使用 *pleonasm*，我不会将其包裹在\
  \ `dfn` 中，因为我已经定义过它。默认情况下，浏览器对 `dfn` 的样式不同于普通文本 ![Image](img/red_circle-b.jpg)。你不需要每次引用\
  \ `dfn` 时都使用 `cite` 元素。\n\n```html\n<body>\n<p>参赛者被要求拼出 \"pleonasm\"。她被告知 <dfn>pleonasm</dfn>\
  \ 的意思是“冗余词”（参考：<cite><a href=\"http://dictionary.com/browse/pleonasm\" rel=\"external\"\
  >dictionary.com</a></cite>）。</p>\n</body>\n</html>\n```\n\n![Image](img/red_circle-b.jpg)\
  \ `dfn` 元素在某些浏览器中默认以斜体显示（在本例中 Firefox），就像 `cite` 一样，但在基于 Webkit 的浏览器（如 Safari 和\
  \ Chrome）中不是。你可以通过在样式表中添加 `dfn { font-style: italic; }` 来使它们一致（参见第 8 章和第 10 章）。\n\
  \n### 术语的定义\n\n放置 `dfn` 相对于定义的位置很重要。HTML5 规定：“`dfn` 元素的最近祖先段落、描述列表组或章节必须包含该 `dfn`\
  \ 元素所给术语的定义。”这意味着 `dfn` 和它的定义应该相邻。在 ![Image](img/gray_circle-a.jpg) 和第三个提示中的示例中都是；`dfn`\
  \ 和定义在同一个段落内。\n\n### 标记术语的定义实例\n\n1. 输入 `<dfn>`。\n2. 输入你想要定义的术语。\n3. 输入 `</dfn>`。\n\
  \n> 提示\n你也可以在定义列表（`dl` 元素）中使用 `dfn`。参见第 15 章。\n\n> 提示\n如果你想引导用户到术语的定义实例，可以为 `dfn`\
  \ 添加 `id`，并从网站其他地方链接到它。\n\n\n\n\n### 提示\nHTML5 规定，如果在 `dfn` 上使用可选的 `title` 属性，其值应与\
  \ `dfn` 术语相同。如之前的提示所述，如果在 `dfn` 中嵌套单个 `abbr`，且 `dfn` 本身没有文本节点，则可选的 `title` 应仅放在\
  \ `abbr` 上。\n\n## 创建上标和下标\n\n相对于正文文本略微升高或降低的字母或数字分别称为上标和下标 ![Image](img/red_circle-a.jpg)。HTML\
  \ 包含用于定义这两种文本的元素。上标的常见用途包括标记商标符号、指数和脚注 ![Image](img/red_circle-b.jpg)。下标在化学符号中很常见。\n\
  \n![Image](img/red_circle-a.jpg) `sup` 元素的一个用途是表示脚注。我将脚注放在文章内的 `footer` 中，而不是放在整个页面上，因为它们相互关联。我还将文本中的每个脚注编号链接到页脚中的对应脚注，以便访问者更容易访问。另外，链接上的\
  \ `title` 属性也提供了额外的提示。\n\n```html\n<body>\n<article>\n    <h1>Famous Catalans</h1>\n\
  \    <p>When I was in the sixth grade, I played the cello. There was a teacher at\
  \ school who always used to ask me if I knew who \"Pablo Casals\" was. I didn't\
  \ at the time (although I had met Rostropovich once at a concert). Actually, Pablo\
  \ Casals' real name was <i>Pau</i> Casals, Pau being the Catalan equivalent of Pablo\
  \ <a href=\"#footnote-1\" title=\"Read footnote\"><sup>1</sup></a>.</p>\n    <p>In\
  \ addition to being an amazing cellist, Pau Casals is remembered in this country\
  \ for his empassioned speech against nuclear proliferation at the United Nations\
  \ <a href=\"#footnote-2\" title=\"Read footnote\"><sup>2</sup></a> which he began\
  \ by saying \"I am a Catalan. Catalonia is an oppressed nation.\"</p>\n    <footer>\n\
  \        <p><sup>1</sup>It means Paul in English.</p>\n        <p><sup>2</sup>In\
  \ 1963, I believe.</p>\n    </footer>\n</article>\n</body>\n</html>\n```\n\n![Image](img/red_circle-b.jpg)\
  \ 不幸的是，`sub` 和 `sup` 元素会破坏行间距。注意，第一段第 4 行和第 5 行之间、第二段第 2 行和第 3 行之间的间距比其他行之间的间距更大。不过，一点\
  \ CSS 就能解决这个问题；请参阅侧边栏“使用 sub 或 sup 时修复行间距”了解如何修复。您还可以更改链接上标的处理方式，使下划线不会离上标文本太远。\n\
  \n![Image](img/04_15.jpg)\n\n### 创建上标或下标\n\n1. 输入 `<sub>` 创建下标，或输入 `<sup>` 创建上标。\n\
  2. 输入代表下标或上标的字符或符号。\n3. 根据步骤 1 中使用的元素，输入 `</sub>` 或 `</sup>` 完成该元素。\n\n### 提示\n\
  大多数浏览器会自动将下标或上标文本的字体大小减小几个点。\n\n### 提示\n上标是标记某些外语缩写的理想方式，例如法语的 `M^(lle)` 表示 *Mademoiselle*，西班牙语的\
  \ `3^a` 表示 tercera，或者数字如 `2^(nd)` 和 `5^(th)`。\n\n### 提示\n下标的一个恰当用途是书写化学分子式，例如 `H[2]0\\\
  .`。例如：`<p>I’m parched. Could I please have a glass of H<sub>2</sub>O?</p>`。\n\n\
  ### 提示\n上标和下标字符会轻微破坏行间的均匀间距 ![Image](img/gray_circle-b.jpg)。请参阅侧边栏获取解决方案。\n\n##\
  \ 使用 `sub` 或 `sup` 时修复行间距\n\n`sub` 和 `sup` 元素往往会打乱文本行之间的行高 ![Image](img/gray_circle-b.jpg)。幸运的是，您可以通过一点\
  \ CSS 来解决这个问题。\n\n以下代码来自 Nicolas Gallagher 和 Jonathan Neal 的优秀 `normalize.css` ([`necolas.github.com/normalize.css/`](http://necolas.github.com/normalize.css/))。他们并没有发明下面的方法；他们从\
  \ [`gist.github.com/413930`](https://gist.github.com/413930) 借用了它并移除了代码注释。第二个 GitHub\
  \ 链接包含了对这段 CSS 作用的完整解释，所以我鼓励您去看看。我还建议您查看 `normalize.css`，您可以在自己的项目中使用它。它有助于在不同浏览器中实现一致的渲染基线，并且文档详尽（请参阅第\
  \ 11 章中的“重置或标准化默认样式”）。\n\n```css\n/*\n* Prevents sub and sup affecting line-height\
  \ in all browsers\n* gist.github.com/413930\n*/\nsub,\nsup {\n    font-size: 75%;\n\
  \    line-height: 0;\n    position: relative;\n    vertical-align: baseline;\n}\n\
  sup {\n    top: -0.5em;\n}\nsub {\n    bottom: -0.25em;\n}\n```\n\n您可能需要根据内容的字体大小稍微调整这段\
  \ CSS 以平衡行高，但这至少应该给您一个很好的起点。您将在第 8 章中学习如何创建样式表以及如何将这段 CSS 添加到您的网站。\n\n## 标注编辑和不准确的文本\n\
  \n有时您可能想要指示自上一版本以来发生的编辑，或标记不准确的文本。有两个用于标注编辑的元素：`ins` 元素表示已添加的内容，`del` 元素标记已删除的内容。\n\
  \n```html\n<body>\n<article>\n    <h1>Famous Catalans</h1>\n    <p>When I was in\
  \ the sixth grade, I played the cello. There was a teacher at school who always\
  \ used to ask me if I knew who \"Pablo Casals\" was. I didn't at the time (although\
  \ I had met Rostropovich once at a concert). Actually, Pablo Casals' real name was\
  \ <i>Pau</i> Casals, Pau being the Catalan equivalent of Pablo <a href=\"#footnote-1\"\
  \ title=\"Read footnote\"><sup>1</sup></a>.</p>\n    <p>In addition to being an\
  \ amazing cellist, Pau Casals is remembered in this country for his empassioned\
  \ speech against nuclear proliferation at the United Nations <a href=\"#footnote-2\"\
  \ title=\"Read footnote\"><sup>2</sup></a> which he began by saying \"I am a Catalan.\
  \ Catalonia is an oppressed nation.\"</p>\n    <footer>\n        <p><sup>1</sup>It\
  \ means Paul in English.</p>\n        <p><sup>2</sup>In 1963, I believe.</p>\n \
  \   </footer>\n</article>\n</body>\n</html>\n```\n\n\n\n同时，`s` 元素用于标记不再准确或相关的内容（它不用于编辑）(!![Image](img/red_circle-e.jpg)\
  \ 和 ![Image](img/red_circle-f.jpg))。\n\n![Image](img/red_circle-e.jpg) 此示例显示了一个关于放映时间的有序列表（`ol`\
  \ 元素）。票务情况已不再相关的时间段已用 `s` 元素标记。你可以在 `s` 包裹任何短语，而不仅仅是列表项（`li` 元素）中的文本，但不能用于整个段落或其他“块级”元素，就像你不能对\
  \ `del` 和 `ins` 那样。\n\n***\n\n...\n\n```html\n<body>\n\n<h1><h1>今日放映时间</h1>\n\n\
  <p>今天以下时段有票出售：</p>\n\n<ol>\n    <li><ins>下午 2 点（此场次刚添加！）</ins></li>\n    <li><s>下午\
  \ 5 点</s> 已售完</li>\n    <li><s>晚上 8:30</s> 已售完</li>\n</ol>\n\n</body>\n```\n\n***\n\
  \n![Image](img/red_circle-f.jpg) 在浏览器中，`s` 元素默认渲染为**删除线** 效果。\n\n![Image](img/04_18.jpg)\n\
  \n#### 如何标记涉及新插入文本的编辑\n\n1. 输入 `<ins>`。\n2. 输入新内容。\n3. 输入 `</ins>`。\n\n#### 如何标记涉及已删除文本的编辑\n\
  \n1. 将光标置在你想要标记为删除的文本或元素之前。\n2. 输入 `<del>`。\n3. 将光标置在你想要标记为删除的文本或元素之后。\n4. 输入 `</del>`。\n\
  \n#### 如何标记不再准确或相关的文本\n\n1. 将光标置在你想要标记为不再准确或相关的文本之前。\n2. 输入 `<s>`。\n3. 将光标置在你想要标记的文本之后。\n\
  4. 输入 `</s>`。\n\n***\n\n**提示**\n\n`del` 和 `ins` 都支持两个属性：`cite` 和 `datetime`。`cite`\
  \ 属性（与 `cite` 元素不同）用于提供解释为何进行编辑的来源 URL。例如：`<ins cite=\"http://www.movienews.com/ticket-demand-high.html\"\
  >下午 2 点（此场次刚添加！）</ins>`。使用 `datetime` 属性来指示编辑时间。（参见“指定时间””以了解 `datetime` 的接受格式。）浏览器不会显示你赋值给这两个任一属性的值，因此它们的使用并不广泛，但欢迎包含它们以为你的内容添加背景信息。这些值可以通过\
  \ JavaScript 或解析页面的程序提取。\n\n***\n\n***\n\n### 如何让 `del` 和 `ins` 显示保持一致\n\n浏览器在渲染块级\
  \ `del` 和 `ins` 中的内容时表现不一致。大多数浏览器会按预期对所有嵌套内容对 `del` 显示删除线，对 `ins` 显示下划线，但至少 Firefox\
  \ 并没有做到 ![Image](img/gray_circle-d.jpg)。\n\n你可以通过以下显式 CSS 规则来纠正（`*` 表示 `del` 和 `ins`\
  \ 内部的每个元素得到相应的处理）：\n\n```css\ndel * {\n    text-decoration: line-through;\n}\n\n\
  ins * {\n    text-decoration: underline;\n}\n```\n\n如果你不确定如何将此 CSS 添加到样式表中，请参考 第\
  \ 8 章。\n\n***\n\n***\n\n**提示**\n\n当你想要让访问者了解内容的演变时，随时可以使用 `del` 和 `ins`。例如，你经常会在\
  \ Web 开发或设计教程中看到它们被用来指示自最初发布以来新学到的信息，同时保留原始文案以保持完整性。博客、新闻网站等也是如此。\n\n***\n\n***\n\
  \n**提示**\n\n用 `ins` 元素标记的文本通常带有**下划线** ![Image](img/gray_circle-b.jpg)。由于链接通常也有下划线（即使在你的网站中没有，在许多其他网站也有），这可能会让访问者感到困惑。你可能希望使用样式来更改插入段落（或链接）的显示方式（参见第\
  \ 10 章）。\n\n***\n\n***\n\n**提示**\n\n用 `del` 元素标记的文本通常带有**删除线** ![Image](img/gray_circle-b.jpg)。为什么不直接删掉它呢？这取决于你内容的上下文。使用删除线可以让视力用户轻松地知道发生了什么。（此外，屏幕阅读器可以宣布内容已被移除，但从历史上来看，它们对此的支持一直缺乏。）\n\
  \n***\n\n***\n\n**提示**\n\n仅为了它们的语义价值使用 `del`、`ins` 和 `s`。如果你纯粹出于美观考虑给文本添加下划线或删除线，可以使用\
  \ CSS 实现（参见第 10 章中的““装饰文本””）。\n\n***\n\n***\n\n**提示**\n\nHTML5 指出：“在指示文档编辑时，`s`\
  \ 元素并不合适；要标记一段文本已从文档中删除，请使用 `del` 元素。”你可能会发现这种区别非常细微。由你决定哪种是适用于内容的语义选择。\n\n***\n\
  \n### 标记代码\n\n如果你的内容包含代码示例、文件名或程序名，`code` 元素供你使用(!Image](graphics/red_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-b.jpg))。要显示独立的代码块（句子之外），用 `pre` 元素包裹 `code` 元素以保持其格式（参见“使用预格式化文本”示例）。\n\
  \n![Image](img/red_circle-a.jpg) `code` 元素指示文本是代码或文件名。它默认以等宽字体渲染 ![Image](img/gray_circle-b.jpg)。如果你的代码需要显示\
  \ `<` 或 `>` 符号，请分别使用 `&lt;` 和 `&gt;` 实体。在这里，第二个 `code` 实例演示了这一点。如果你使用了 `<` 和 `>`，浏览器会将你的代码视为\
  \ HTML 元素而非文本。\n\n\n\n\n通常，浏览器会折叠所有额外的换行符和空格，并根据窗口大小自动换行。预格式文本（Preformatted text）允许你保留并显示在文本中插入的原始换行和间距。它对于计算机代码示例非常理想\
  \ ![Image](img/red_circle-a.jpg)，尽管你也可以用于文本（你好，ASCII 艺术！）。\n\n![Image](img/red_circle-a.jpg)\
  \ `pre` 元素适用于包含重要空格和换行的文本，例如此处显示的这段 CSS 代码。同样，请注意使用 `code` 元素来标记 `pre` 之外的代码段或与代码相关的文本（更多细节请参阅“标记代码”）。\n\
  \n* * *\n\n...\n\n```html\n<body\n\n<p>Add this to your style sheet if you want\
  \ to display a dotted border underneath the `<code>abbr</code> element whenever\
  \ it has a `<code>title</code> attribute.</p>\n\n<pre>\n      <code>\n      abbr[title]\
  \ {\n        border-bottom: 1px dotted #000;\n      }\n      </code>\n</pre>\n\n\
  </body>\n```\n\n* * *\n\n### 使用预格式文本\n\n**1.** 输入 `<pre>`。\n\n**2.** 输入或复制你希望按原样显示的文本，并包含所有必要的空格、回车符和换行。除非是代码，否则不要用任何\
  \ HTML（如 `p` 元素）标记该文本。\n\n**3.** 输入 `</pre>`。\n\n* * *\n\n### `pre` 的显示考虑因素\n\n\
  请注意，浏览器通常会禁用 `pre` 内部内容的自动换换行，因此如果内容太宽，可能会影响你的布局或强制出现水平滚动条。以下 CSS 规则可以在许多浏览器中启用\
  \ `pre` 内部的换行，但在 Internet Explorer 7 及以下版本中不起。\n\n```css\npre {\n    white-space:\
  \ pre-wrap;\n}\n```\n\n另外提到一点，在大多数情况下，我不建议你在 `div` 等元素上使用 `white-space: pre;` CSS\
  \ 声明来替代 `pre`，因为空格对包含内容的语义（尤其是代码）可能至关重要，而只有 `pre` 能保留它。（此外，如果用户在浏览器中禁用了 CSS，格式将会丢失。）\n\
  \n请参从第 7 章开始的 CSS 介绍。特别是文本格式在第 10 章中有讨论。\n\n* * *\n\n* * *\n\n提示\n\n预格式文本通常使用 Courier\
  \ 或 Courier New 等等宽字体显示 ![Image](img/red_circle-b.jpg)。如果你喜欢，可以使用 CSS 更改字体（参见第 10\
  \ 章）。\n\n![Image](img/red_circle-b.jpg) 注意 `pre` 内容中保持了缩进和换行。\n\n![Image](img/04_20.jpg)\n\
  \n* * *\n\n* * *\n\n提示\n\n如果你想要显示的内容（例如教程中的代码示例）包含 HTML 元素，你必须将元素名称周围每个 `<` 和 `>`\
  \ 替换为相应的字符实体，即 `&lt;` 和 `&gt;`（示例参见“标记代码”）。否则，浏览器可能会尝试显示这些元素。务必验证你的页面，查看是否在不应该嵌套的情况下\
  \ `pre` 中嵌套了 HTML 元素（参见第 20 章中的“验证你的代码”）。\n\n* * *\n\n* * *\n\n提示\n\n`pre` 元素并不是避免使用正确语义标记以及通过\
  \ CSS 样式化呈现内容的快捷方法。例如，如果你想发布在文字处理器中编写的文章，不要仅仅将其复制并粘贴到 `pre` 中，因为你喜欢它的间距。相反，将你的内容封装在\
  \ `p`（以及相关的文本元素）中，并编写 CSS 来按需要控制布局。\n\n* * *\n\n* * *\n\n提示\n\n`pre` 与段落一样，默认始终在新的一行显示\
  \ ![Image](img/gray_circle-b.jpg)。\n\n* * *\n\n### 指定细体字体（Fine Print）\n\n根据 HTML5，`small`\
  \ 代表侧边注释，如细字体，这些“通常包含免责声明、警告、法律限制或版权信息。细字体有时也用于归名或满足许可要求。”`small` 用于内联文本的简短部分，而不是跨越多个段落或其他元素的文本(!Image](graphics/red_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-b.jpg))。\n\n![Image](img/red_circle-a.jpg) 在所示两个实例中，`small`\
  \ 元素表示简短的法律通知。后者是页面页脚中的版权声明，这是一个常见的惯例。\n\n* * *\n\n...\n\n```html\n<body\n\n<p>Order\
  \ now to receive free shipping. <small>(Some restrictions may apply.) </small></p>\n\
  \n...\n\n<footer>\n    <p><small>&copy; 2011 The Super Store. All Rights Reserved.\
  \ </small></p>\n</footer>\n\n</body\n```\n\n* * *\n\n![Image](img/red_circle-b.jpg)\
  \ 在所示两个实例中，`small` 元素表示简短的法律通知。后者是页面页脚中的版权声明，这是一个常见的惯例。\n\n* * *\n\n### 指定小字体\n\n\
  **1.** 输入 `<small>`。\n\n**2.** 输入你想变小的文本。\n\n**3.** 输入 `</small>`。\n\n* * *\n\n\
  提示\n\n确保仅因为合适才使用 `small`，而不是因为你想缩小大小。如果你喜欢，可以使用 CSS 调整大小（参见第 10 章）。\n\n* * *\n\n\
  * * *\n\n提示\n\n`small` 是标记 ![Image](img/red_circle-a.jpg) 和 ![Image](img/red_circle-b.jpg))\
  \ 的常用选择。它用于内联文本的简短部分。\n\n* * *\n\n### 创建换行\n\n请注意，浏览器通常会禁用 `pre` 内部内容的自动换行，因此如果内容太宽，可能会影响你的布局或强制出现水平滚动条。以下\
  \ CSS 规则可以在许多浏览器中启用 `pre` 内部的换行，但在 Internet Explorer 7 及以下版本中不起。\n\n```css\npre\
  \ {\n    white-space: pre-wrap;\n}\n```\n\n另外提到一点，在大多数情况下，我不建议你在 `div` 等元素上使用 `white-space:\
  \ pre;` CSS 声明来替代 `pre`，因为空格对包含内容的语义（尤其是代码）可能至关重要，而只有 `pre` 能保留它。（此外，如果用户在浏览器中禁用了\
  \ CSS，格式将会丢失。）\n\n请参从第 7 章开始的 CSS 介绍。特别是文本格式在第 10 章中有讨论。\n\n* * *\n\n* * *\n\n提示\n\
  \n预格式文本通常使用 Courier 或 Courier New 等等宽字体显示 ![Image](img/red_circle-b.jpg)。如果你喜欢，可以使用\
  \ CSS 更改字体（参见第 10 章）。\n\n![Image](img/red_circle-b.jpg) 注意 `pre` 内容中保持了缩进和换行。\n\n\
  ![Image](img/04_20.jpg)\n\n* * *\n\n* * *\n\n提示\n\n如果你想要显示的内容（例如教程中的代码示例）包含 HTML\
  \ 元素，你必须将元素名称周围每个 `<` 和 `>` 替换为相应的字符实体，即 `&lt;` 和 `&gt;` 分别（示例参见“标记代码”）。否则，浏览器可能会尝试显示这些元素。务必验证你的页面，查看是否在不应该嵌套的情况下\
  \ `pre` 中嵌套了 HTML 元素（参见第 20 章中的“验证你的代码”）。\n\n* * *\n\n* * *\n\n提示\n\n`pre` 元素并不是避免使用正确语义标记以及通过\
  \ CSS 样式化呈现内容的快捷方法。例如，如果你想发布在文字处理器中编写的文章，不要仅仅将其复制并粘贴到 `pre` 中，因为你喜欢它的间距。相反，将你的内容封装在\
  \ `p`（以及相关的文本元素）中，并编写 CSS 来按需要控制布局。\n\n* * *\n\n* * *\n\n提示\n\n`pre` 与段落一样，默认始终在新的一行显示\
  \ ![Image](img/gray_circle-b.jpg)。\n\n* * *\n\n### 指定细体字体（Fine Print）\n\n根据 HTML5，`small`\
  \ 代表侧边注释，如细字体，这些“通常包含免责声明、警告、法律限制或版权信息。细字体有时也用于归名或满足许可要求。”`small` 用于内联文本的简短部分，而不是跨越多个段落或其他元素的(!Image](graphics/red_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-b.jpg))。\n\n![Image](img/red_circle-a.jpg) 在所示两个实例中，`small`\
