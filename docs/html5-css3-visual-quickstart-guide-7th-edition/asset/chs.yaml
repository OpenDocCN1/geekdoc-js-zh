  \n表 B.3 涵盖了 CSS3 中引入的颜色值：HSL、HSLA 和 RGBA。\n\n表 B.4 显示了 CSS 中定义渐变的语法。\n\n表 B.5 处理了媒体查询的语法，它可以用于针对特定媒体类型（如屏幕或打印）的样式，以及用于检测其他媒体特性（尺寸、设备方向等）。\n\
  \n表 B.6 展示了通过使用 `@font-face` 规则嵌入字体的语法。\n\n关于字体嵌入的更多信息，请参阅 第 13 章。关于“防弹级” `@font-face`\
  \ 语法的示例，请参阅 [www.fontspring.com/blog/fixing-ie9-font-face-problems](http://www.fontspring.com/blog/fixing-ie9-font-face-problems)。\n\
  \nCSS3 是一个不断演变的规范，浏览器持续更新以增加对规范内各种模块的额外支持。浏览器制造商还会引入自己的新功能，或实现仅为提案标准的 CSS3 特性。幸运的是，CSS\
  \ 提供了一种安全的方法来实现这一点：厂商前缀（vendor prefixes）。这允许不同的浏览器支持实验性实现，且不会与其他浏览器的实现冲突，也不会覆盖最终成为标准版本的属性（例如，使用\
  \ `-webkit-box-shadow` 而不是 `box-shadow`）。\n\n你最可能遇到的的前缀是：\n\n- `-moz-`（Firefox 以及其他使用\
  \ Mozilla 渲染引擎的浏览器）\n- `-webkit-`（Chrome、Safari 以及其他使用 WebKit 渲染引擎的浏览器）\n- `-o-`（Opera）\n\
  - `-ms-`（Internet Explorer 8 及更高版本）\n\n关于浏览器支持哪些 CSS3 属性和值的更多信息，请查阅 [www.quirksmode.org/css/contents.html](http://www.quirksmode.org/css/contents.html)、[`caniuse.com`](http://caniuse.com)\
  \ 和 [`findmebyip.com/litmus`](http://findmebyip.com/litmus)。此外，你可以使用如 Modernizr（[www.modernizr.com](http://www.modernizr.com））等\
  \ JavaScript 库来测试其中许多功能的浏览器支持情况。\n\n希望这些信息对你有帮助。\n\n### CSS 属性与值\n\n#### 表 B.1.\
