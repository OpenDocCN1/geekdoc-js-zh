  \ 构建适配媒体查询的页面\n\n一个最后时刻决定去看电影的决定。一个关于安罗朵官方语言的赌约。你所在某公司的电话号码……（注：输入文本以重复碎片结束；我已格式化了提供的唯一内容）。\n\
  \n\n\n\n![Image](img/red_circle-b.jpg) BART 的移动版网站保持了界面简洁，并省略了桌面版网站上常见的图像 ![Image](img/gray_circle-a.jpg)，以便访问者快速获取信息。如果你仔细查看页脚，你会发现一个“Desktop（桌面版）”链接，它指向\
  \ ![Image](img/gray_circle-a.jpg)所示的站点，另一个指向“Older Mobile Site（旧版移动站点）”的链接会将访问者引导至\
  \ [www.bart.gov/wireless/](http://www.bart.gov/wireless/) 上简单的移动站点。\n\n![Image](img/12_02.jpg)\n\
  \nNike 提供三种不同的体验——针对智能手机的、针对 iPad 的以及针对桌面的——而且图像内容越来越丰富。同样，Yahoo! 也有移动端、平板电脑和桌面端的体验。\n\
  \n## 一个站点适配所有\n\n随着每周似乎都有新设备上市，而且公司围墙内无疑在构思新类型的 `types` 设备，构建和维护独立的网站是否现实——甚至是理想的？我们无法预知未来会发生什么，因此这种方法主张为所有设备构建一个站点，然后根据此相应调整其布局。\n\
  \n对于我们大多数人来说，单站点可能很好地服务我们的访问者。而且——单一站点的论点之一是——今天预测某人在访问我们网站时的意图变得更加困难，尤其是智能手机及其浏览器已经变得越来越强大。例如，移动端访问者实际上处于移动状态并不总是一个稳妥之选。我确定我不是唯一一个坐在沙发上用手机浏览网站的人，即使笔记本电脑就在房间的另一侧。在大多数情况下，我查看的是完整站点，而不是桌面体验的移动版本。\n\
  \n然而，手机屏幕尺寸较小且带宽受限是无法避免的，因此提供一个适用于在这种情况下查看的站点仍然是我们的工作。\n\n## 一个站点适配所有：实现它\n\n好了，如果一个站点听起来很棒，你如何适应如此大量的设备呢？\n\
  \n这就是渐进式增强真正大放异彩的地方。（请回顾引言中的“渐进式增强：最佳实践”进行复习。）通过将 HTML 与 CSS 分离，你可以提供样式，从而为更高分辨率和更强大的设备逐步演进布局（![Image](img/red_circle-c.jpg)\
  \ 到 ![Image](img/red_circle-e.jpg)）。\n\n![Image](img/red_circle-c.jpg) 信不信，此处以及在\
  \ ![Image](img/gray_circle-d.jpg) 和 ![Image](img/gray_circle-e.jpg) 中显示的 Food Sense\
  \ 首页都来自同一个站点 [www.foodsense.is](http://www.foodsense.is)，而不是托管在各自 URL 独立站点。该站点使用响应式\
  \ Web 设计方法，因此其布局根据查看条件发生变化。iPhone（此处）和具有相似屏幕的设备根据特定的 CSS 规则显示布局。不同的 CSS 规则针对其他更大的浏览器视图（![Image](img/gray_circle-d.jpg)\
  \ 和 ![Image](img/gray_circle-e.jpg)），并相应调整布局。\n\n![Image](img/12_03.jpg)\n\n![Image](img/red_circle-d.jpg)\
  \ 这是在 iPad 和其他具有相似屏幕的设备上看到的 Food Sense。此视图的 CSS 更改了 Logo 和导航，因为浏览器有更多空间来显示。\n\n\
  ![Image](img/12_04.jpg)\n\n![Image](img/red_circle-e.jpg) 这是站点最宽的视图，显示在桌面浏览器上。该站点还有两种未在任何图中显示的布局。你可以通过在计算机访问\
  \ [www.foodsense.is](http://www.foodsense.is) 并拖动浏览器角来使其变窄或变宽。\n\n![Image](img/12_05.jpg)\
  \ Ethan Marcotte 为我们提供了这样一个蓝图，他将这种方法称为 `responsive Web`。他在 [www.alistapart.com/articles/responsive-design/](http://www.alistapart.com/articles/responsive-design/)\
  \ 的文章以及他的《Responsive Web Design》（A Book Apart, 2011）非常推荐。他的方法根植于三点：\n\n- 灵活的、基于网格的布局。这是你在\
  \ `Chapter 11`chch1 中看到的流式布局，经过了一些微调。响应式站点所有的 `width`、`margin` 和 `padding` 属性都设置为百分比，以便所有布局都是相对的。\n\
  - 灵活的图像和媒体。资源也以百分比设置尺寸，以便它们缩放。（参见 Ethan 在 [www.alistapart.com/articles/fluid-images/](http://www.alistapart.com/articles/fluid-images/)\
  \ 上的书籍摘录。）人们一直在开发技术，根据设备的屏幕尺寸提供不同尺寸的图像，以便手机手机的访问者无需等待大图下载。\n- 媒体查询（Media queries）。作为一种\
  \ CSS3 组件，它们允许你根据媒体特征调整设计，例如浏览器可视区域的宽度（请参见下一节中的 `Understanding the Viewport and\
  \ Using the Viewport meta Element]` 侧栏）。你将在 `Understanding and Implementing Media\
  \ Queries]` 中学习它们，然后在 `Building a Page that Adapts with Media Queries]` 中看到它们的应用。\n\
  \nWeb 社区围绕着响应式网站的概念聚集在一起，这种方法建立在响应式设计的基础之上。这种方法并不只适用于博客。`Boston Globe` ([www.bostng.com](http://www.bostng.com))\
  \ 在推出其新站点时成为了焦点。\n\nLuke Wroblewski 在 2009 年 11 月开始提倡“移动优先”的设计（[www.lukewro.com/entry.asp?933](http://www.lukewro.com/entry.asp?933)）。前提是针对移动端进行设计，然后将这些原则带到桌面端（如果那些站点是不同的）。通过这样做，他认为你更有可能识别哪些内容对用户至关重要。你可以在\
  \ [www.lukewro.com/entry.asp?1137](http://www.lukewro.com/entry.asp?1137) 查看他的演示。他还写了一本书，书名就叫《Mobile\
  \ First》（A Book Apart, 2011）。\n\nJeremy Keith 在他的“One Web”演示中完美地总结了一个站点适配的方法（[www.vimeo.com/2748362/](http://www.vimeo.com/2748362/)）。（对于那些更喜欢阅读的人，转录可在\
  \ [www.adactio.com/articles/4938/](http://www.adactio.com/articles/4938/) 获得。）这两部视频都非常推荐。事实上，你现在就可以去看它们吧。我等！\n\
  \n\n\n\n\n`Media queries`（媒体查询）增强了媒体类型方法，允许你针对特定的设备特征设置样式 ![Image](img/red_circle-a.jpg)。它们在调整网站的显示效果以适应不同的屏幕尺寸时特别有用。以下是你可以在媒体查询中包含的媒体特性的列表：\n\
  \n• width\n• height\n• device-width\n• device-height\n• orientation\n• aspect-ratio\n\
  • device-aspect-ratio\n• color\n• color-index\n• monochrome\n• resolution\n• scan\n\
  • grid\n\n![Image](img/red_circle-a.jpg) `base.css` 中的样式用于所有输出设备。`styles-480.css`\
  \ 中的样式仅用于支持媒体查询的浏览器，并且当视口（viewport）宽度至少为 480 像素时。\n\n* * *\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\" />\n    <title>Media\
  \ queries in link elements</title>\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\" />\n    <link rel=\"stylesheet\" media=\"all\" href=\"base.css\"\
  \ />\n    <!--\n      The logic is only.\n      The type is screen.\n      The feature:\
  \ value is min-width: 480px.\n    -->\n    <link rel=\"stylesheet\" media=\"only\
  \ screen and (min-width: 480px)\" href=\"styles-480.css\" />\n</head>\n<body>\n\
  ...\n</body>\n</html>\n```\n\n* * *\n\n还有一些非标准的媒体特性，例如：\n\n• -webkit-device-pixel-ratio\n\
  • -moz-device-pixel-ratio\n\n除了 orientation、scan 和 grid 之外，你都可以包含 `min-` 和 `max-`\
  \ 前缀。`min-` 前缀针对“大于或等于”的值，而 `max-` 针对“小于或等于”的值。在本章中我们将重点关注 `min-width` 和 `max-width`，因为这是你在制作响应式页面时反复使用的两个媒体特性。所有媒体特性的描述可以在\
  \ CSS3 媒体查询规范中找到（[www.w3.org/TR/css3-mediaqueries/#media1](http://www.w3.org/TR/css3-mediaqueries/#media1)）。\n\
  \n媒体查询在现代桌面和手机浏览器中得到了很好的支持。然而，Internet Explorer 8 及以下版本不支持它们（请参见第一个提示获取 `min-width`\
  \ 和 `max-width` 的解决方案）。\n\n### 媒体查询语法与示例\n\n致敬 Peter Gasston 的 *The Book of CSS3*（No\
  \ Starch Press, 2011），这本书对此总结得非常好。这里是媒体查询的基本语法。\n\n• 对于指向外部样式表的链接：\n```html\n<link\
  \ rel=\"stylesheet\" media=\"logic type and (feature: value)\" href=\"your-stylesheet.css\"\
  \ />\n```\n\n• 对于样式表内部的媒体查询：\n```css\n@media logic type and (feature: value) {\n\
  \    /* your targeted CSS rules go here */\n}\n```\n\n我很快会进一步解释这种语法，但几个快速的示例（![Image](img/gray_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-b.jpg)）将帮助你理解上下文。示例中的查询是相同的，但它们交付样式的方式是不同的。![Image](img/gray_circle-a.jpg)\
  \ 中的示例翻译为“仅当媒体类型为屏幕且视口最小宽度为 480 像素时，加载并使用 `styles-480.css` 中的规则。”![Image](img/red_circle-b.jpg)\
  \ 中的示例翻译为“仅当媒体类型为屏幕且视口最小宽度为 480 像素时，使用以下规则。”（查看侧边栏“Understanding the Viewport and\
  \ Using the Viewport meta Element”以了解 `viewport` 的含义）。我创建了一个测试页面 ![Image](img/red_circle-c.jpg)，它链接到一个包含\
  \ ![Image](img/red_circle-b.jpg) 中代码的样式表。你可以在 iPhone ![Image](img/red_circle-d.jpg)、iPad\
  \ ![Image](img/red_circle-e.jpg) 和狭窄的桌面浏览器 ![Image](img/red_circle-f.jpg) 上查看结果。\n\
  \n![Image](img/red_circle-b.jpg) 这个粗糙的示例包含了默认的段落样式，随后在媒体查询为真时对段落文字进行更改。我将此样式表保存在\
  \ `basic-media-query.css` 中，并将其加载到 ![Image](img/gray_circle-c.jpg) 显示的页面中。你可以通过\
  \ ![Image](img/gray_circle-d.jpg) 到 ![Image](img/gray_circle-f.jpg) 查看结果。\n\n* *\
  \ *\n\n```css\n/* 常规样式在这里。每个设备都会获取它们，除非它们被媒体查询中的规则覆盖。 */\nbody {\n    font-size:\
  \ 100%;\n}\np {\n    color: green;\n}\n\n/*\nThe logic is only.\nThe type is screen.\n\
  The feature: value is min-width: 480px.\n*/\n@media only screen and (min-width:\
  \ 480px) {\n    /* Your styles for this condition go here */\n    p {\n        color:\
  \ red;\n    }\n}\n```\n\n* * *\n\n![Image](img/red_circle-c.jpg) 该页面链接到一个包含 ![Image](img/red_circle-b.jpg)\
  \ 中代码的样式表，这是一个基础媒体查询。\n\n* * *\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
  <head>\n    <meta charset=\"utf-8\" />\n    <title>Media queries in link elements</title>\n\
  \    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n\
  \    <link rel=\"stylesheet\" media=\"all\" href=\"base.css\" />\n</head>\n<body>\n\
  \    <p>I'm a media query.</p>\n</body>\n</html>\n```\n\n* * *\n\n![Image](img/red_circle-c.jpg)\
  \ 该页面链接到 ![Image](img/gray_circle-b.jpg) 中的样式表，这是一个基础媒体查询。\n\n* * *\n\n![Image](img/red_circle-c.jpg)\
  \ 该页面链接到 ![Image](img/gray_circle-b.jpg) 中的样式表，这是一个基础媒体查询。\n\n* * *\n\n（注：提供的文本末尾存在重复部分，我已根据内容进行了清理。）\n\
  \n回到语法，让我们探索它的组件：\n\n• 逻辑部分是可选的，值可以是 `only` 或 `not`。`only` 关键字确保旧浏览器不会尝试读取媒体查询的剩余部分，完全忽略该样式表。`not`\
  \ 关键字否定媒体查询的结果，使其反转。例如，`media=\"not screen\"` 在媒体类型不是屏幕时加载样式表。\n\n• 类型部分是媒体类型，例如\
  \ `screen` 或 `print`。\n\n• 特性:值对是可选的，但如果存在，它必须在括号内并在 `and` 词之前。特性是预定义的媒体特性之一，如 `min-width`、`max-width`、`orientation`\
  \ 或其他。对于 `color`、`color-index` 和 `monochrome` 特性，值是可选的。\n\n你可以使用 `and` 组合特性值值，并通过逗号分隔每个媒体查询来创建一个媒体查询列表。如果逗号分隔列表中的任何一个媒体查询为真，则整个媒体查询列表为真。![Image](img/red_circle-g.jpg)\
  \ 和 ![Image](img/red_circle-h.jpg) 展示了各种媒体查询。\n\n![Image](img/red_circle-g.jpg)\
  \ 在为真时加载外部样式表的其他媒体查询示例。\n\n* * *\n\n```html\n<link rel=\"stylesheet\" media=\"only\
  \ screen and (min-width: 480px) and (max-width: 767px)\" href=\"styles.css\" />\n\
  <link rel=\"stylesheet\" media=\"only screen and (orientation: landscape)\" href=\"\
  styles.css\" />\n<link rel=\"stylesheet\" media=\"only print and (color)\" href=\"\
  color-pages.css\" />\n<link rel=\"stylesheet\" media=\"only print and (monochrome)\"\
  \ href=\"monochrome-pages.css\" />\n```\n\n\n\n\n\n```html\n<link rel=\"stylesheet\"\
  \ media=\"only screen and (color), projection and (color)\" href=\"styles.css\"\
  \ />\n</head>\n<body>\n...\n```\n\n![Image](img/red_circle-h.jpg) 这里的媒体查询与 ![Image](img/gray_circle-g.jpg)\
  \ 中的是相同的，但它们直接出现在样式表中。\n\n```css\n/* 基础样式\n------------------------------- */\n\
  /* 所有设备的基础规则 */\n/* 开始媒体查询\n------------------------------- */\n@media only screen\
  \ and (min-width: 480px) and (max-width: 767px) {\n    /* 你的规则 */\n}\n@media only\
  \ screen and (orientation: landscape) {\n    /* 你的规则 */\n}\n@media only print and\
  \ (color) {\n    /* 你的规则 */\n}\n@media only print and (monochrome) {\n    /* 你的规则\
  \ */\n}\n@media only screen and (color),\nprojection and (color) {\n    /* 你的规则\
  \ */\n}\n```\n\n### 在链接外部样式表时定义媒体查询\n\n1. 在你希望使用样式表的每个 HTML 页面的 `head` 部分中输入 `<link\
  \ rel=\"stylesheet\"`。\n2. 输入 `media=\"` 开始媒体查询。\n3. 按照“定义媒体查询”中的步骤创建你的媒体查询。\n4.\
  \ 输入 `\"` 结束媒体查询。\n5. 输入一个空格然后 `href=\"url.css\"`，其中 `url.css` 是当媒体查询为真时应用到页面的样式表的路径和名称。\n\
  6. 输入一个空格和最后的 `/>`。（或者如果你愿意，可以不输入空格，直接输入 `>`。HTML5 允许这两种方法，结果是相同的。）\n\n### 在样式表中定义媒体查询和关联规则\n\
  \n1. 在你的样式表中，输入 `@media` 并后跟一个空格。\n2. 按照“定义媒体查询”中的步骤创建你的媒体查询。\n3. 输入一个空格和 `{`。\n\
  4. 可选从新行开始，创建当媒体查询为真时应应用到页面的样式规则。\n5. 输入 `}`（可选地在新行上）以完成媒体查询块。\n\n### 如何定义媒体查询\n\
  \n1. 可选输入 `only` 并后跟一个空格。（虽然这是可选的，但我建议除非明确指定不是，否则包含它。）如果你没有指定 `only`，可选输入 `not`\
  \ 并后跟一个空格，表示你希望媒体查询结果的反面为真。\n2. 输入 `type`，其中 `type` 是媒体类型（通常为 `screen` 或 `print`；参见第\
  \ 8 章中的“使用特定媒体样式表”）。\n3. 可选输入一个空格，然后 `and`，另一个空格。接下来输入 `(feature: value)`，其中 `feature`\
  \ 是预定义的媒体特征之一：`width`、`height`、`device-width`、`device-height`、`orientation`、`aspect-ratio`、`device-aspect-ratio`、`color`、`color-index`、`monochrome`、`resolution`、`scan`\
  \ 或 `grid`，且 `value` 是适当的特征值（通常但不限于以像素或 em 表示；参见示例 ![Image](img/gray_circle-b.jpg)、![Image](img/gray_circle-g.jpg)\
  \ 和 ![Image](img/gray_circle-h.jpg)）。在允许且需要的情况下，在特征前加上 `min-` 以针对“大于或等于”的值，或加上 `max-`\
  \ 以针对“小于或等于”的值。对于 `color`、`color-index` 和 `monochrome` 特征，值是可选的。\n4. 如果你想创建一个媒体查询列表，请输入一个逗号然后重复步骤\
  \ 2 和 3。否则，你的媒体查询就完成了。\n\n**提示**\n参见“在 IE8 及以下版本中渲染媒体查询样式”以了解如何修复这些版本 IE 的缺陷。\n\n\
  **提示**\n你包含在媒体查询之外的任何基础样式规则将应用于所有设备。你可以根据需要使用媒体查询覆盖这些规则。需要说明的是，媒体查询规则内的声明只会覆盖普通样式中*冲突*的声明，例如在\
  \ ![Image](img/gray_circle-b.jpg) 情况下的 `color: green;`。如果媒体查询之前的 `p` 规则包含了 `font-style:\
  \ italic;`，那么当媒体查询为真时，段落文本仍然是斜体，因为媒体查询内的 `p` 规则没有指定 `font-style`。\n\n**提示**\niPhone\
  \ 在手机旋转到横屏模式时会增加页面缩放级别。因此，某些内容通常超出视图，需要访问者手动缩小以使宽度位于屏幕边界内。有一种方法可以防止这一点，但代价是非常遗憾的也会阻止访问者更改页面缩放级别。但是，如果你必须控制这种行为，请添加此代码中的高亮部分：`<meta\
  \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0,\
  \ user-scalable=no\" />`。我不建议这样做。相反，请省略那两个空格。\n\n*(注：原文中存在大量重复内容，译文已按逻辑结构进行整合)*\n\
  \n\n\n\n\n虽然没有显示，但存在其他三个属性。将 `minimum-scale` 设置为大于 0 且最高 10.0 的数字，可以有效设置页面的最小缩放级别。请查看提示获取有关\
  \ `maximum-scale` 和 `user-scalable` 属性的信息。\n\n* * *\n\n### 构建使用媒体查询的自适应页面\n\n上一节解释了媒体查询的工作原理。现在，你将看到如何将它们应用于整个页面，使其布局能够适应设备的视口大小。这与\
  \ Ethan Marcotte 的响应式 Web 设计方法中使用的技术相同。然而，我没有调整图像大小，尽管响应式设计通常会这样做（这并非强制性的）。我将使用第\
  \ 11 章中的页面作为示例。\n\n我不会向你展示我在每个媒体查询块中应用的所有样式规则，因为这些规则在网站之间是不同的。重要的是了解如何构建响应式网站，以及实现该目标所使用的媒体查询类型。你可以在\
  \ [www.bruceontheloose.com/htmlcss/examples/](http://www.bruceontheloose.com/htmlcss/examples/)\
  \ 查看完成的页面及其代码。\n\n![Image](img/red_circle-a.jpg) 我对所有设备应用的基础样式采样。这些规则与你在阅读本章之前看到的规则一样——它们没有被封装在媒体查询块中。\n\
  \n* * *\n\n```css\n/* Base Styles\n\n----------------------------------- */\n\n\
  body {\n    color: #1d3d76;\n    font: 100% \"Trebuchet MS\", Verdana, sans-serif;\n\
  }\n\nh1,\nh2,\nh3,\nh4,\nh5,\nh6,\n.logo {\n    color: #b74e07;\n    font-weight:\
  \ bold;\n}\n\nh1 {\n    font-size: 1.25em; /* 24px/16px */\n    text-transform:\
  \ lowercase;\n}\n\n.nav li {\n    display: inline;\n    font-size: .7em;\n}\n...\n\
  ```\n\n* * *\n\n#### 创建你的内容和 HTML\n\n一切都应该从坚实、经过仔细考虑的内容的内容开始。如果你尝试用占位文本（即备受推崇的 *lorem\
  \ ispum*）来设计和构建网站，你可能会发现当放入真实内容时，它们无法良好整合。因此，如果可能，请提前做好准备工作，这样你就有信心正在设计和开发一个能够很好服务访问者（以及你自己）的网站。\n\
  \n示例内容的底层 HTML 与第 11 章中的页面相同，但有三个例外：\n\n- 我在 head 元素中添加了 `<meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1.0\" />`。关于此操作的详情，请参侧栏“理解视口和使用 Viewport\
  \ 元元素”。如果你实现灵活布局，我建议在页面中包含此 meta 元素。\n- 我删除了页面最底部的微缩略图（有 20 多个）。考虑到带宽（以及设备能力），图像数量超过了我建议所有设备默认加载的范围。如果我想搞得花哨一点，可以写一些服务器端代码或\
  \ JavaScript 来为大屏幕动态加载图像。然而，这超出了我们在这里涵盖的范围。\n- 我在页面底部添加了对 `respond.js` 的调用，以便媒体查询在\
  \ IE8 及以下版本中生效。请查看“在 IE8 及以下版本中渲染媒体查询样式”。\n\n#### 选择设计实现方法\n\n构建响应式页面至少有几种方法。两种方法都使用相同的\
  \ HTML，但某些 CSS 是不同的。以下是总结：\n\n**方法 1：** 为所有设备建立一个基准，然后从小屏幕（移动端）到大屏幕（桌面端）逐步构建\n\n\
  1. 来说，为所有设备提供基准样式 ![Image](img/red_circle-a.jpg)。这通常包括基础字体格式、颜色，可能对默认的外边距和内边距设置进行调整，但没有元素的浮动或定位。内容按照正常的文档流从上到下运行。目标是让你的网站在单列中可读且美观\
  \ ![Image](img/red_circle-b.jpg)。结果是所有拥有 Web 浏览器的新旧设备都可以访问该网站。在不同设备上看起来可能略有不同，但这是意料之中的，且完全没问题。\n\
  \n![Image](img/red_circle-b.jpg) iPhone 支持媒体查询，但我还没有将它们添加到样式表中。我只做了基础样式，所以这些截图代表了不支持媒体查询的浏览器将渲染的内容。页面布局是线性的，图像右侧的部分出现在“最近文章（recent\
  \ entries）”下方。页脚在下方，但未显示。\n\n![Image](img/12_11.jpg)\n\n2. 从那里开始逐步向上，使用媒体查询为更大的屏幕尺寸（如方向）定义样式。`min-width`\
  \ 和 `max-width` 功能在大多数情况下是你的工具。\n\n```css\n/* Base Styles\n\n-----------------------------------\
  \ */\n...\n\n/* 320px 及以上\n----------------------------------- */\n@media only screen\
  \ and (min-width: 320px) {\n    .photo {\n        float: left;\n    }\n}\n```\n\n\
  **方法 2：** 构建桌面，*然后*处理不同的屏幕尺寸\n\n1. 构建你网站的桌面版本（参见第 11 章）。\n2. 使用媒体查询来覆盖样式。这种方法在 Web\
  \ 圈内获得了很大关注，因为它体现了渐进增强。我将在示例中使用这种方法，以便你看到如何操作。\n\n```css\n/* Base Styles\n\n-----------------------------------\
  \ */\n...\n\n/* 480px 及以上\n----------------------------------- */\n@media only screen\
  \ and (min-width: 480px) {\n    .intro {\n        margin: -.9% 0 0 110px;\n    }\n\
  \    .entry .date {\n        margin: 0;\n        text-align: right;\n        position:\
  \ relative;\n        top: -1em;\n    }\n    #main .continued {\n        margin-top:\
  \ -1%;\n        text-align: right;\n    }\n}\n```\n\n![Image](img/red_circle-f.jpg)\
  \ 这是在 480 像素宽下的页面中间部分。因为有了更多的屏幕空间，我停止了文字环绕图像，并将日期和“继续（continued）”链接右对齐。\n\n![Image](img/12_13.jpg)\n\
  \n\n\n\n\n好的，现在你已经准备好了内容，并用语义化的 HTML 进行了标记，你决定采用方案 1 来实现你的设计。![Image](img/gray_circle-a.jpg)\
  \ 到 ![Image](img/gray_circle-j.jpg) 展示了我是如何从所有设备的基础样式开始，逐步向上构建，直到拥有一个适用于各种视口尺寸（viewport\
  \ sizes）和设备的布局。\n\n在响应式 Web 设计的术语中，你利用媒体查询（media queries）为页面的每个 `breakpoint`（断点）定义样式——即你的内容从调整中受益的每个宽度。在示例中，我为后续列表中的断点创建了样式规则。请记住，对于每个没有对应最大宽度的最小宽度情况，样式将针对该最小宽度设备并*一直持续到更高宽度*，包括桌面设备。\n\
  \n- 最小宽度为 320 像素（![Image](img/gray_circle-c.jpg) 和 ![Image](img/gray_circle-d.jpg)）。这针对竖屏模式下的\
  \ iPhone、iPod touch 以及许多 Android 和其他手机手机。\n- 最小宽度为 480 像素（![Image](img/gray_circle-e.jpg)\
  \ 和 ![Image](img/gray_circle-f.jpg)）。这针对较大的手机，如多个 HTC 型号，以及横屏模式下的许多 320 像素设备（包括\
  \ iPhone、iPod touch 和某些 Android 机型）。\n- 最小宽度为 600 像素（![Image](img/gray_circle-g.jpg)\
  \ 和 ![Image](img/gray_circle-h.jpg)）。我设置这些规则主要是为了适应窄桌面浏览器，但一如既常，它们也适用于任何以此最小宽度显示的的设备。\n\
  - 在最小宽度 600 像素到最大宽度 767 像素的范围内（![Image](img/gray_circle-g.jpg) 和 ![Image](img/gray_circle-h.jpg)）。页眉（masthead）的布局在这个范围内会错乱——它主要在调整桌面浏览器大小时可见——所以我创建了这些样式来清理该问题，并填补到最后一个断点之间的差距。\n\
  \n![Image](img/red_circle-g.jpg) 这些媒体查询开始将页眉从线性布局到水平布局转换。这让页面在适中宽度下在桌面浏览器上看起来更美观\
  \ ![Image](img/gray_circle-h.jpg)。\n\n```css\n/* Base Styles\n-----------------------------------\
  \ */\n\n...\n\n/* 320px and up\n----------------------------------- */\n@media only\
  \ screen and (min-width: 320px) {\n    ...\n}\n\n/* 480px and up\n-----------------------------------\
  \ */\n@media only screen and (min-width: 480px) {\n    ...\n}\n\n/* 600px and up\n\
  ----------------------------------- */\n@media only screen and (min-width: 600px)\
  \ {\n    #container {\n        background: url(../img/bg-bluebench.jpg) repeat-y;\n\
  \        margin: 20px auto;\n        padding: 30px 10px 0 0;\n        width: 90%;\n\
  \    }\n    .logo {\n        float: left;\n        font-size: 2em; /* 32px/16px\
  \ */\n    }\n    ...\n}\n\n/* From 600px-767px, not beyond\n-----------------------------------\
  \ */\n@media only screen and (min-width: 600px) and (max-width: 767px) {\n    .logo\
  \ {\n        background: #eee;\n        font-size: 1.825em;\n    }\n    #masthead\
  \ form {\n        width: 235px;\n    }\n    input[type=\"text\"] {\n        width:\
  \ 130px;\n    }\n    .nav li {\n        font-size: .625em;\n        font-weight:\
  \ bold;\n        padding-left: 1%;\n    }\n    ...\n}\n```\n\n![Image](img/red_circle-h.jpg)\
  \ 配合 ![Image](img/gray_circle-g.jpg) 中的样式，页面正逐渐接近完整形态。内容布局仍然是单列，但现在搜索字段和主导航与 Logo\
  \ 并排。此外，页面周围的背景图首次出现了![Image](img/12_14.jpg)。\n\n![Image](img/red_circle-i.jpg)\
  \ 这是最后一个媒体查询，针对宽度至少为 768 像素的视口。对于大多数桌面浏览器都是如此（除非用户将其调窄，如 ![Image](img/gray_circle-h.jpg)\
  \ 所示），它也对应 iPad 以及其他平板电脑竖屏模式下的宽度 ![Image](img/gray_circle-j.jpg)。\n\n```css\n/*\
  \ Base Styles\n----------------------------------- */\n...\n/* 320px and up\n-----------------------------------\
  \ */\n@media only screen and (min-width: 320px) {\n    ...\n}\n\n/* 480px and up\n\
  ----------------------------------- */\n@media only screen and (min-width: 480px)\
  \ {\n    ...\n}\n\n/* 600px and up\n----------------------------------- */\n@media\
  \ only screen and (min-width: 600px) {\n    ...\n}\n\n/* From 600px-767px, not beyond\n\
  ----------------------------------- */\n@media only screen and (min-width: 600px)\
  \ and (max-width: 767px) {\n    ...\n}\n\n/* 768px and up\n-----------------------------------\
  \ */\n@media only screen and (min-width: 768px) {\n    #container {\n        max-width:\
  \ 950px;\n    }\n    #page {\n        padding-left: 0;\n        width: 97.9167%;\n\
  \    }\n    .nav li {\n        display: list-item;\n        float: left;\n     \
  \   font-size: .75em; /* 12px/16px */\n    }\n    #main {\n        float: left;\n\
  \        width: 71%;\n    }\n    #related {\n        margin-left: 72%;\n    }\n\
  \    #footer {\n        clear: both;\n    }\n    ...\n}\n```\n\n\n\n\n\n- 在初始开发阶段使用\
  \ `ProtoFluid` ([www.protofluid.com](http://www.protofluid.com))。这是一个免费的基于浏览器的工具，提供了映射到几种流行设备尺寸的视图。再次强调，它不是用于正式测试的，因为它的行为并不像手机或\
  \ iPad，但它初始编码阶段很有帮助。（顺便提醒一下，它并不是一个最直观的工具。你可能需要花点琢琢才能上手。）你的页面需要托管在服务器上才能在 `ProtoFluid`\
  \ 中查看它们。它可以是你的 Web 托管公司提供的服务器（参见第 21 章），也可以是你为了开发目的在电脑上运行的服务器（在网上搜索“set up localhost\
  \ server”）。\n\n- 使用 Apple 免费的 `iOS Simulator` 为你的 iPhone 和 iPad 页面进行测试。现在开始进入正题了。这是在实际设备上进行测试的最佳替代方案。你会注意到我在一些截图中使用了它。然而，它只运行在\
  \ `OS X` 上，且没有 Windows 对应版本。`iOS Simulator` 是免费 `Xcode` 下载包的一部分，可在 [`developer.apple.com/xcode/`](http://developer.apple.com/xcode/)\
  \ 获取。\n\n- 使用适用于 Windows 的 `Electric Mobile Simulator` ([www.electricplum.com/dlsim.html](http://www.electricplum.com/dlsim.html))，这可能是\
  \ Windows 上同类中最好的工具。为了明确起，这并不等同于 Apple 的 `iOS Simulator`。\n\n- 为其他设备和移动浏览器使用模拟器和仿真器。`Mobile\
  \ Boilerplate` 维护了一个包含 iOS、Android、Nokia Symbian 等更多移动模拟器和仿真器的链接列表，位于 [`github.com/h5bp/mobile-boilerplate/wiki/Mobile-Emulators-&-Simulators`](https://github.com/h5bp/mobile-boilerplate/wiki/Mobile-Emulators-&-Simulators)。\n\
  \n如果你运气不错，你可能有一些拥有不同设备的朋友，也可以在上面进行测试。问问大家吧！\n\n* *\n\n### 在 IE8 及以下版本中渲染媒体查询样式\n\
  \n编写基础样式然后使用媒体查询调整设计时有一个例外：Internet Explorer 8 及以下版本不支持媒体查询。这意味着它们只会渲染你在媒体查询之外定义的样式；即基础样式。`IE6`、`7`\
  \ 和 `8` 总计仍占了大多数网站很大比例的流量，因此你可能希望这些访问者按照你预期的方式看到设计。\n\nScott Jehl 致力于解决这个问题，他创建了一个轻量级脚本\
  \ `respond.js`，它让 `min-width` 和 `max-width` 媒体查询在旧版本的 IE 中生效。你可以在 [`github.com/scottjehl/Respond`](https://github.com/scottjehl/Respond)\
  \ 获取。激活 `respond.min.js` 链接查看代码，然后将其复制、粘贴到你的文本编辑器中并保存为 `respond.js`。\n\n虽然该脚本也让其他旧浏览器支持了\
  \ `min-width` 和 `max-width` 媒体查询，但已经没有什么重要的旧浏览器了。因此，你可能想使用条件注释来指示 `IE8` 及以下版本加载该脚本，如\
  \ ![Image](img/red_circle-k.jpg) 所示。\n\n![Image](img/red_circle-k.jpg) 通过将脚本元素放在此条件注释中，只有\
  \ `IE8` 及以下版本会加载 `respond.js`。将 `src` 值中的 `assets/js/` 部分替换为你网站上 `respond.js` 的路径（如果不同）。当一切完成后，`IE8`\
  \ 及以下版本将理解媒体查询并相应渲染样式。\n\n```html\n...\n<footer id=\"footer\" role=\"content\">\n\
  ...\n</footer>\n</div>\n<!--if lte IE 8]>\n<script src=\"assets/js/respond.js\"\
  ></script>\n<![endif]-->\n```\n\n或者，如果你计划在项目中使用 `Modernizr` ([www.modernizr.com](http://www.modernizr.com))，你可以通过\
  \ `Modernizr` 的配置工具包含 `respond.js`，而不是从你的 `HTML` 页面单独下载并调用它。参见第 14 章 中的“使用 Polyfills\
  \ 进行渐进式增强”了解少量关于 `Modernizr` 的信息，参见第 19 章了解更多关于脚本的内容。\n\n### 构建随媒体查询自适应的页面\n\n1.\
  \ 创建你的内容和 `HTML`。\n2. 在 `HTML` 页面的 `head` 元素中，输入 `<meta name=\"viewport\" content=\"\
  device-width, initial-scale=1.0\" />`。（参见“理解和实现媒体查询](#ch12.html_ch12levsec2)”部分中的侧边栏“理解视口和使用\
  \ Viewport 元元素”。）\n3. 选择一种设计实现方法。我建议你首先为所有设备创建一个基础样式，然后如示例所示通过媒体查询逐步完善。不过，如果你愿意，也可以先实现桌面布局（参见第\
  \ 11 章），然后为较小设备应用媒体查询。\n4. 根据你的内容，适当为不同的视口宽度调整你的布局。根据“理解和实现媒体查询](#ch12.html_ch12levsec2)”描述的步骤识别断点并创建相关的媒体查询。尽可能使用百分比的\
  \ `width`、`margin` 和 `padding` 来使页面布局流式。\n5. 如果你想让 `IE8` 及以下版本渲染 `min-width` 和 `max-width`\
  \ 媒体查询规则，请从“在 IE8 及以下版本中渲染媒体查询](#ch12.html_ch12sec1)”获取 `respond.js`。如果你执行了步骤 5，在\
  \ `</body>` 标签上方通过以下代码从你的页面链接 `respond.js` ![Image](img/red_circle.k)。\n\n```html\n\
  <!--if lte 8]>\n<script src=\"path/respond.js\"></script>\n<![endif]-->\n```\n\n\
  `path` 等于 JavaScript 文件的位置，`respond.js` 等于文件名。条件注释是可选的。\n7. 开始测试吧！（参见“移动开发测试工具](#ch12.html_ch12sb02)”侧边栏。）\n\
  8. 完善你的 `CSS` 和媒体查询，直到在系列设备上的渲染符合预期。\n\n**提示**: 如 ![Image](img/gray_circle.c)、![Image](img/gray_circle.e)、![Image](img/gray_circle.g)\
  \ 且 ![Image](img/gray_circle.i) 所示，所有的示例页面样式都在一个样式表中。或者，你可以使用“理解和实现媒体查询](#ch12.html_ch12lev2)”中的指令链接到单独样式表。通常，只要文件不是巨大，单个文件性能更好，因为浏览器下载的文件越少，渲染越快。\n\
  \n**提示**: Eivind Uggedal 的 [`mediaqueri.es`](http://mediaqueri.es) 网站是一个不断扩展的响应式网站库，值得参考灵感。\n\
  \n**提示**: `Mobile Boilerplate` ([www.html5boilerplate.com/mobile](http://www.html5boilerplate.com/mobile))\
  \ 是包含许多移动最佳实践的 Web 启动模板。其团队还提供了一个现代移动设备（智能手机和平板电脑）的方便矩阵，位于 [`github.com/h5bp/mobile-boilerplate/wiki/Mobile-Matrices`](https://github.com/h5bp/mobile-boilerplate/wiki/Mobile-Matrices)。正如页面所示，这些对于编写媒体查询非常有帮助。\n\
  \n**提示**: 如果你想针对高像素设备（例如 iPhone 4 和使用 Opera Mobile 11 浏览器的手机）目标样式，请使用以下媒体查询：\n\n\
  ```css\n@media only screen and (-webkit-min-device-pixel-ratio: 1.5), only screen\
  \ and (-o-min-device-pixel-ratio: 3/2), only screen and (min-device-pixel-ratio:\
  \ 1.5) {\n    /* your rules */\n}\n```\n\n此建议由 Mobile Boilerplate 提供。\n\n\n\n\n\n\
  ## Tip\n\n[320 and Up ([`stuffandnonsense.co.uk/projects/320andup/`](http://stuffandnonsense.co.uk/projects/320andup/))\
  \ 由 Andy Clarke 和 Keith Clark 创建，是另一个入门模板。它镜像了这里展示的方法：从一组默认样式开始，然后通过媒体查询在此基础上扩展布局。\n\
  \n* * *\n\n* * *\n\n## Tip\n\nLuke Wroblewski 在 [`www.lukew.com/ff/entry.asp?1436`](http://www.lukew.com/ff/entry.asp?1436)\
  \ 很好地总结了构建响应式网站的现状。他的文章还包含了几个供进一步阅读的链接。\n\n* * *\n\n* * *\n\n## Tip\n\nMaximiliano\
  \ Firtman 在 [`mobilehtml5.org`](http://mobilehtml5.org) 维护了一个现代移动设备对 HTML5 和 CSS3\
  \ 的支持矩阵。（许多信息涉及本书未涵盖的高级 HTML5 特性。）\n\n* * *\n\n* * *\n\n## Tip\n\n如果 `respond.js`\
  \ 没有工作，请查看 [`github.com/scottjehl/Respond`](https://github.com/scottjehl/Respond)\
  \ 中的“支持与注意事项”（Support & Caveats）部分。如果你仍然遇到问题，请尝试将 ![Image](img/gray_circle-k.jpg)\
  \ 中高亮的代码放在页面的 `</head>` 结束标签上方，而不是 `</body>` 结束标签之前。\n\n* * *\n\n* * *\n\n## Tip\n\
  \n在 [www.quirksmode.org/css/condcom.html](http://www.quirksmode.org/css/condcom.html)\
  \ 了解更多关于条件注释的内容。\n\n* * *\n\n## 13. 使用 Web 字体\n\n### 本章内容\n\n- 什么是 Web 字体？\n- 在哪里找到\
  \ Web 字体\n- 下载你的第一个 Web 字体\n- 使用 @font-face\n- 设置 Web 字体样式和管理文件大小\n\n在过去的几年里，我们观察到\
  \ Web 字体使用的再度复兴。过去我们对字体的选择非常有限，而现在得益于 Web 字体，我们在为 Web 项目选择字体时有了无数选择。见证这种变化的发生既引人入胜又令人极其兴奋。\n\
  \n选择字体曾经相对简单。默认情况下，你对用户在计算机上安装了哪些字体是有限制的。这就是为什么大多数网站的正文设置为 `Georgia`、`Arial`、`Verdana`\
  \ 或 `Trebuchet` 的原因。这些字体在小字号下看起来都很好看，而且在任何 Mac 或 Windows 电脑上都预装了。\n\n说我们现在处于一个全新的世界并不愚蠢或夸张。\n\
  \n### 什么是 Web 字体？\n\nWeb 字体的出现得益于 `@font-face` CSS 规则，该规则允许 CSS 链接到服务器上的字体并在网页中使用。\n\
  \n许多人认为 Web 字体是新的。事实上，Web 字体自 1998 年以来一直存在，那时 `Netscape` 和 `Internet Explorer` 开始使用这项技术。直到近十年后，它们才变得常见。\n\
  \n#### Web 字体格式\n\nWeb 字体有几种文件类型：\n\n- `eot`: Embedded OpenType；用于旧版 Internet Explorer。\n\
  - `ttf`: TrueType；Mac 和 Windows 使用的标准格式。\n- `otf`: OpenType；TrueType 的扩展。\n- `woff`:\
  \ Web Open Font Format；一种用于 Web 的压缩格式格式。\n- `woff2`: `woff` 的新版本，具有更好的压缩率。\n- `svg`:\
  \ Scalable Vector Graphics；用于 Safari 中的字体。\n\n### 在哪里找到 Web 字体\n\n在网站中使用 Web 字体你有两种选择：自托管（self-hosting）和\
  \ Web 字体服务。这两种都是完全行的方案；然而，它们非常不同，都有各自需要考虑的优缺点。当你权衡这些优缺点时，你还会发现并不是所有的 Web 字体在任何地方都可用。你可能会发现，尽管你想使用自托管，但需要的字体只能从\
  \ Web 字体服务获取。这可能需要寻找一个接近的替代品或重新考虑你的方法。在决定方向之前保持灵活性并权衡所有选项是明智的。\n\n#### 法律问题\n\n\
  从技术层面来说，字体是软件片段。我认识一些以设计和构建字体为生的人，这是一个艰辛且细致的过程，不适合心细脆弱的人。出于这个原因，引起某些人的反感是可以理解的。毕竟，如果浏览器可以链接并下载字体，那意味着任何人都可以下载并安装它，无论他们是否购买了它。这就是为什么我们作为设计师和开发者，必须确保我们使用的任何字体都经过了适当授权。你可以通过查看购买的任何字体的许可协议来实现。由于这是目前一个非常热门的话题，这些信息通常出现在你购买字体的字库网站上。如果有疑问，请联系字库以查看哪些是允许的。或者，你可以将使用的字体限制在免费字体上，例如\
  \ Font Squirrel ([www.fontsquirrel.com](http://www.fontsquirrel.com)) 或 The League\
  \ of Moveable Type ([www.theleaguemoveabletype.com](http://www.theleaguemoveabletype.com))\
  \ 提供的字体。无论何种方式，请确保在项目中使用 Web 字体时是完全合法合规的。\n\n如果你购买了字体，并且确定可以作为 Web 字体使用，一个派派用场的工具可能是\
  \ Font Squirrel 的免费 `@font-face` 生成器 ([www.fontsquirrel.com/fontface/generator](http://www.fontsquirrel.com/fontface/generator))。该工具会将你的字体转换为\
  \ Web 上使用所需的所有 Web 字体文件类型。\n\n\n\n\n\n自托管 Web 字体是一种更传统的方法，也是我们将在本章逐步操作部分将介绍的方法。字体从你自己的服务器提供，就像其他任何资源（如图像或\
  \ CSS 文件）一样。如果字体涉及费用，通常是一次性购买，并由你来上传字体文件并在网站上包含相关代码。\n\n寻找用于自托管的 Web 字体相对容易，因为市上有许多字体。它们的质量和价格范围很广（有些甚至是免费的）。一些流行的字体包括：\n\
  \n*   [Font Squirrel}([www.fontsquirrel.com](http://www.fontsquirrel.com))\n*  \
  \ [MyFonts}([`myfonts.com`](http://myfonts.com))\n*   [The League of Moveable Type}([www.theleagueofmoveabletype.com](http://www.theleagueofmoveabletype.com))\n\
  *   [FontShop}([www.fontshop.com](http://www.fontshop.com))\n\n## Web 字体服务\n\nWeb\
  \ 字体服务通常提供订阅制模式。你不需要直接购买字体，而是每月或每年支付使用字体的费用。这些服务托管字体，并为你提供一小段代码放入你的 Web 页面。根据服务的不同，这段代码可能是\
  \ JavaScript 或 CSS。它包含了所有必要的代码，以便字体文件从远程服务器提供并显示在你的网站上。许多人青睐这种方法，因为通常比单独购买字体便宜，而且它可以让你尝试许多不同的字体。\n\
  \n一些流行的 Web 字体服务有：\n\n*   [Typekit}([`typekit.com`](https://typekit.com))\n*   [Fontdeck}([`fontdeck.com`](http://fontdeck.com))\n\
  *   [Fonts.com}([www.fonts.com](http://www.fonts.com))\n*   [WebINK}([www.webink.com](http://www.webink.com))\n\
  *   [Google Web Fonts}([www.google.com/webfonts](http://www.google.com/webfonts))\n\
  \n从本质上说，Web 字体服务能够提供比自托管更多的功能。一切都托管在服务器上，包括字体文件。如果有更好的字体文件或改进的提供代码，这些服务可以轻松提供。\n\
  \n此外，这些服务中的许多使用 JavaScript 来嵌入提供 Web 字体的代码。这带来了一些优点，也有一些缺点。JavaScript 在此过程中可以做很多事情，例如检测哪个浏览器正在加载页面，并对字体本身的加载提供额外的控制。这种控制可以带来真正更好的体验，因为它允许\
  \ Web 字体服务自定义字体格式和提供这些字体的代码。例如，Typekit 最近宣布他们正使用基于 PostScript 的轮廓（仅针对 Windows 浏览器）提供某些显示字体，以使渲染更平滑\
  \ ([`blog.typekit.com/2011/09/15/improved-windows-rendering-for-more-typekit-fonts/`](http://blog.typekit.com/2011/09/15/improved-windows-rendering-for-more-typekit-字体/))。如果没有\
  \ JavaScript，就无法实现这种功能。\n\n这种奢侈的代价是你 100% 依赖 JavaScript。如果用户的浏览器没有启用 JavaScript，他们将无法查看你的\
  \ Web 字体。此外，JavaScript 可能会影响页面性能。用户必须在页面任何 Web 字体加载之前等待 JavaScript 加载。在决定如何将 Web\
  \ 字体引入你的网站时，这些都是需要考虑。\n\n## Web 字体质量与渲染\n\n遗憾的是，并不是所有的 Web 字体都是平等的。Web 字体在不同 Web\
  \ 浏览器中的外观可能有明显的差异。这在某些在旧版本 Internet Explorer 中看起来并不好的字体上最为明显。\n\n在你选择字体时，尽力通过检查它们在各种浏览器中的外观来审核潜在的\
  \ Web 字体选择 ![Image](img/red_circle-a.jpg)。这变得更容易了，因为许多 Web 字体公司现在提供 Web 字体的实时示例，有些公司还提供字体在各种浏览器和平台上的截图。\n\
  \n![Image](img/red_circle-a.jpg) 此截图组合显示了 Internet Explorer 6（顶部）和 Chrome 15（底部）渲染的相同代码。注意在\
  \ Internet Explorer 中，字母较细且不平滑。\n\n![Image](img/13_01.jpg)\n\n***\n\n**提示**：如果你在自己进行这些测试时遇到困难，请尝试使用\
  \ Web Font Specimen 提供的资源 (`webfontspecimen.com`。这是一个工具，可以让你查看 Web 字体在各种上下文和大小下的外观。\n\
  \n***\n\n## 下载你的第一个 Web 字体\n\n下载免费的 Web 字体快速又简单。我们将使用 Font Squirrel；他们甚至为你提供了一个\
  \ `demo.html` 文件，让你看到这些字体运行时的效果。\n\n在下一节中，我们将探索 `@font-face` 语法如何在页面中集成几个 Web 字体。\n\
  \n### 从 Font Squirrel 下载 Web 字体\n\n1.  进入 Font Squirrel 的 `@font-face` Kits 部分 ([www.fontsquirrel.com/fontface](http://www.fontsquirrel.com/fontface))，并选择你想要使用的字体。我选择了\
  \ League Gothic。\n2.  点击 `Get Kit` 链接 ![Image](img/red_circle-a.jpg)。\n3.  下载完成后，打开压缩包，你应该有一个\
  \ `demo.html` ![Image](img/red_circle-a.jpg)。\n\n### 在 demo.html 中查看选定的字体\n\n在浏览器中打开下载字体的\
  \ `demo.html` 文件 ![Image](img/red_circle-a.jpg)。（参见第二章中的“在浏览器中查看页面”\n\n## 使用 @font-face\n\
  \n你已经下载了 Web 字体包并在浏览器中测试了 `demo.html` 文件。现在是时候查看内部原理以及它是如何工作的了。让我们看看 `stylesheet.css`\
  \ 的代码 ![Image](img/red_circle-a.jpg)。\n\n```css\n@font-face {\n  font-family: 'LeagueGothicRegular';\n\
  \  src: url('League_Gothic-webfont.eot');\n  src: url('League_Gothic-webfont.eot?#iefix')\n\
  \  format('embedded-opentype');\n}\n```\n\n\n\n\n\n```css\nurl('League_Gothic-webfont.woff')\
  \ format('woff'),\nurl('League_Gothic-webfont.ttf') format('truetype'),\nurl('League_Gothic-webfont.svg#LeagueGothicRegular')\
  \ format('svg');\nfont-weight: normal;\nfont-style: normal;\n}\n```\n\n如你所示，样式表非常简单，只有一条规则。诚然，这一个规则非凡！\n\
  \n`@font-face` 语法与传统的 CSS 有些不同。首先，它似乎没有遵循你在第 8 章 开头读到的那种选择器后跟属性/值对的传统方法。这条规则以一个看起来奇怪的\
  \ `@font-face` 声明开头。\n\n理解 `@font-face` 如何工作的一种方法是：`@font-face` 规则只是在设置一个可以供 CSS\
  \ 其他部分使用的 `tool`。此规则不会影响任何特定元素的样式，但它为你的 CSS 使用 Web 字体提供了支持。\n\n该规则中的第一行是用于字体族的：`font-family:\
  \ ‘LeagueGothicRegular’;`。\n\n这为这个特定的 Web 字体确定了名称。在这种情况下，我们使用 `LeagueGothicRegular`，但可以是任何你喜欢的名称。你可以选择\
  \ `Banana` 或 `The Best Font Ever`。这取决于你。\n\n规则中接下来的几行用于告诉浏览器字体文件所在的位置。这些包含了支持所有支持\
  \ Web 字体的浏览器的字体文件格式。这种语法看起来有点吓人，但对于我们的目的来说，没有必要完全理解它。如果你想深入挖掘并找出为什么它看起来是这样，我推荐 Ethan\
  \ Dunham 在 Fontspring 上写的一篇文章（[www.fontspring.com/blog/further-hardening-of-the-bulletproof-syntax](http://www.fontspring.com/blog/further-hardening-of-the-bulletproof-syntax)），他在那里解释了关于\
  \ `@font-face` 语法的最新思考。\n\n#### 将 Web 字体引入网页\n\n我们已经涵盖了 `@font-face` 语法，但还没有实际上将\
  \ Web 字体放到页面上。查看 `demo.html` 的代码，让我们检查页面顶部的 CSS 代码 ![Image](img/red_circle-b.jpg)。\n\
  \n![Image](img/red_circle-b.jpg) 这是来自 `demo.html` 文件顶部的 CSS。Font Squirrel 将其放在这里是为了演示，但在实践中，将所有\
  \ CSS 保持在外部样式表中最好的。\n\n* * *\n\n```css\nh1.fontface {\n    font: 60px/68px 'LeagueGothicRegular',\
  \ Arial, sans-serif;\nletter-spacing: 0;\n}\n\np.style1 {\n    font: 18px/27px 'LeagueGothicRegular',\
  \ Arial, sans-serif;\n}\n```\n\n* * *\n\n包含的规则使用 League Gothic Web 字体对 HTML 进行样式处理。在第一个规则中，`60px/68px`\
  \ 指定了字体大小和行高。我们的示例使用像素进行尺寸设置，但欢迎你指定其他单位。尺寸之后指定了 ‘LeagueGothicRegular’、Arial、sans-serif。正如你在第\
  \ 10 章 的“指定备用字体”中学习到的那样，当我们像这样用逗号分隔多个字体族时，这就是所谓的字体栈（font stack）。如果浏览器不支持栈中的第一个字体，它会尝试列表中的下一个字体。由于我们在这里使用了\
  \ Web 字体，浏览器很有可能会直接渲染 Web 字体；然而，使用字体栈仍然是一个好习惯。毕竟，并不是每个浏览器都支持 Web 字体。\n\n在这段 CSS\
  \ 中，`font` 属性根据在 `@font-face` 规则中设置的 `font-family` 名称引用 `LeageGothicRegular`。此外，它引用该字体的方式就像引用任何其他字体一样。在浏览器眼里，League\
  \ Gothic 也许已经安装在访问该网站的计算机上了一样。\n\n既然你已经尝到了成功，也许你想用更多几个 Web 字体来一试？\n\n在下一个任务中，我们将使用\
  \ League Gothic 作为主标题，并使用 Crimson 作为页面上的其余文本。\n\n#### 处理多个 Web 字体\n\n回到 Font Squirrel，下载\
  \ Crimson Web 字体套件，它包含了六种不同的字体 ![Image](img/red_circle-c.jpg)。\n\n![Image](img/red_circle-c.jpg)\
  \ 与你之前做的一样，点击 `Get Kit` 下载 Web 字体套件的 ZIP 压缩包。一旦下载完成，解压压缩包。\n\n![Image](img/13_05.jpg)\n\
  \n#### 在同一项目中使用多个 Web 字体\n\n**1.** 文件夹里有很多字体。对于我们的目的，我们只需要几个。选择 `Crimson-Roman-webfont`\
  \ 的四个 Web 字体文件，并将它们复制到我们之前工作的 League Gothic 文件夹中。结果应该像 ![Image](img/red_circle-d.jpg)。\n\
  \n![Image](img/red_circle-d.jpg) 现在我们在同一个文件夹中有两个字体。\n\n![Image](img/13_06.jpg)\n\
  \n**2.** 在 `stylesheet.css` 中，输入以下：\n\n```css\n@font-face {\n    font-family: \"\
  Crimson\";\n    src: url('Crimson-Roman-webfont.eot') format('opentype'),\n    \
  \     url('Crimson-Roman-webfont.woff') format('woff'),\n         url('Crimson-Roman-webfont.ttf')\
  \ format('truetype'),\n         url('Crimson-Roman-webfont.svg#CrimsonRegular')\
  \ format('svg');\n}\n```\n\n**3.** 在你刚刚输入的 `@font-face` 规则之后，为 body 输入以下：\n\n```css\n\
  body {\n    font-family: \"Crimson\", Georgia, serif;\n}\n```\n\n**4.** 在新的一行，输入以下内容为\
  \ `h1` 设置样式：\n\n```css\nh1 {\n    font-family: \"LeagueGothicRegular\", Arial, sans-serif;\n\
  \    font-size: 4em;\n    font-weight: normal;\n}\n```\n\n**5.** 在同一个文件夹中，创建一个名为\
  \ `demo.html` 的新 HTML 文件。\n\n**6.** 在你的 `demo.html` 中输入以下代码：\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>Our\
  \ Font</title>\n    <link rel=\"stylesheet\" href=\"stylesheet.css\" />\n</head>\n\
  <body>\n    <article>\n        <h1>标题非常重要</h1>\n        <p>费城不仅仅有奶酪三明治、洛奇比和自由女神。你知道费城曾是美国这个国家的首都吗？你还会发现费城拥有我们国家第一个邮局、医院和免费图书馆。本杰明·富兰林真是一个忙碌的人！</p>\n\
  \    </article>\n</body>\n</html>\n```\n\n**7.** 在 Web 浏览器中打开 `demo.html` ![Image](img/red_circle-e.jpg)（查看结果）。你的字体现在看起来很不错。\n\
  \n![Image](img/red_circle-e.jpg) 标题使用 League Gothic，页面其余部分使用 Crimson 渲染。\n\n![Image](img/13_07.jpg)\n\
  \n* * *\n\n提示\n\n我们使用了套件自带字体族名称，例如 `LeagueGothicRegular`。这是一个很好的描述性名称，但另一种观点是使用更具*语义化*的命名方案，例如\
  \ `font-family: \"Headline\";`。选择这种方案的好处是，如果你改变主意并决定使用另一种 Web 字体（代替 League Gothic），你只需要将此\
  \ `@font-face` 规则替换为新的，并赋予它字体族名称 Headline 即可。\n\n* *\n\n* * *\n\n提示\n\n虽然步骤和示例假设字体文件、样式表和\
  \ HTML 页面在同一个目录下，但将它们组织在文件夹中是一个好习惯（参见第 2 章中的“组织文件”）。只需根据需要更改 HTML 中样式表的路径以及 CSS\
  \ 中 Web 字体的路径（参见第 1 章中的“URL”）即可。\n\n\n\n\n\nWeb 字体比使用普通字体要复杂一些，因此在使用它们时，有几点可能需要注意。\n\
  \nWeb 字体的一个潜在风险是，尤其是当你使用超过一两个字体时，它们可能会开始增加页面负担。我在这里指的不是培根和甜甜圈——说的是千字节（KB）和兆字节（MB）。\n\
  \n所有这些字体在页面上渲染之前，都需要下载到用户的计算机上。如果你在一个页面上有六种字体，这可能会减慢网站的速度，特别是对于移动用户而言。我的建议是，选择 Web\
  \ 字体时要谨慎。如果你发现自己使用了七种 Web 字体，请寻找方法合并你的字体选择。\n\n节省页面权重的一种方法是通过`subsetting`（子集化）。子集化是种通过仅包含你确定会用到的字符来减小字体文件体积的方法。例如，如果你在标题中使用`League\
  \ Gothic`，但网站设计要求标题始终为全大写，那么就不需要小写字母。通过使用`subsetting`，你可以从字体中移除这些字母，字体文件将显著减小。\n\
  \n此外，你还可以为许多字体选择特定语言的子集。如果你在 `Font Squirrel` 上浏览字体，只需点击特定字体的 `View Font` 而不是 `Get\
  \ Kit`。从该字体的页面，选择 `@font-face Kit` 以在下载包之前查看特定语言的选项。解释`subsetting`的原理超出了本书的范围，但\
  \ `Font Squirrel` 确实有一个工具可以帮助你进行专家级的子集化（[www.fontsquirrel.com/fontface/generator](http://www.fontsquirrel.com/fontface/generator)）。\n\
  \nWeb 字体表现得异常的另一种是你想要对它们进行看似最基本的样式设置时。需要注意的是，每种 Web 字体只有一种重量和一种样式。如果你想使用粗体或斜体，需要为它们创建单独的规则，每条规则都有自己的属性。\n\
  \n### 添加斜体和粗体\n\n1. 使用以下高亮代码更新 `demo2.html` 文件的第一段：\n\n```html\n<p>费城不仅仅有奶酪牛肉明治、洛奇和自由之钟。<em>Did\
  \ you know（你知道吗）</em>费城曾是美国合国的首都是？你还会发现，费城拥有我们国家的第一座邮局、医院和免费图书馆。本杰明·富兰克林是一个<b>`busy（忙碌）</b></b>家伙！</p>\n\
  ```\n\n2. 刷新你的网络浏览器。\n\n段落似乎出现了粗体和斜体。然而，并非一切都如看起来那样。事实上，`Crimson Roman` 的 Web 字体并没有内置粗体和斜体，浏览器通过让正文在粗体时变粗、斜体时倾斜一点来伪造粗体和斜体。\n\
  \n这种伪造效果是明显的，即使对于普通观众也是![Image](img/red_circle-a.jpg)。我们希望它使用的是为该字体设计的正确粗体和斜体。好消息是——这其实很容易！\n\
  \n![Image](img/red_circle-a.jpg) 哪一个是伪造的？注意小字母“k”、“a”和“f”。\n\n![Image](img/13_08.jpg)\n\
  \n为了给 `Crimson` 使用正确的粗体和斜体，我们必须获取那些 Web 字体文件并复制到此文件夹，就像我们在`在同一项目中使用多个 Web 字体`章节中所做的那样。\n\
  \n3. 找到 `Crimson-Bold` 和 `Crimson-Italic` Web 字体文件，并将每种字体的所有格式（共八个文件）复制到 demo 项目文件夹中![Image](img/red_circle-b.jpg)。\n\
  \n![Image](img/red_circle-b.jpg) 天，这里有点挤了！`Crimson` 的新粗体和斜体文件应该就应该待在罗马体文件旁边。（参见最后的提示。）\n\
  \n![Image](img/13_09.jpg)\n\n接下来，像之前一样，我们需要添加一些新的 `@font-face`规则来引入粗体和斜体文件。\n\n\
  4. 在 `stylesheet.css` 中输入以下内容：\n\n```css\n@font-face {\n   font-family: \"CrimsonBold\"\
  ;\n   src: url(\"Crimson-Bold-webfont.eot\");\n   src: url(\"Crimson-Bold-webfont.eot?#iefix\"\
  ) format(\"embedded-opentype\"),\n      url(\"Crimson-Bold-webfont.woff\") format(\"\
  woff\"),\n      url(\"Crimson-Bold-webfont.ttf\") format(\"truetype\"),\n      url(\"\
  Crimson-Bold-webfont.svg#CrimsonBold\") format(\"svg\");\n}\n\n@font-face {\n  \
  \ font-family: \"CrimsonItalic\";\n   src: url(\"Crimson-Italic-webfont.eot\");\n\
  \   src: url(\"Crimson-Italic-webfont.eot?#iefix\") format(\"embedded-opentype\"\
  ),\n      url(\"Crimson-Italic-webfont.woff\") format(\"woff\"),\n      url(\"Crimson-Italic-webfont.ttf\"\
  ) format(\"truetype\"),\n      url(\"Crimson-Italic-webfont.svg#CrimsonBold\") format(\"\
  svg\");\n}\n```\n\n5. 在 `stylesheet.css` 中添加以下内容：\n\n```css\nb {\n   font-family:\
  \ \"CrimsonBold\";\n   font-weight: bold;\n}\n\nem {\n   font-family: \"CrimsonItalic\"\
  ;\n   font-style: italic;\n}\n```\n\n如果你忘记设置 `font-family`，浏览器会尝试将其加粗，这会让情况更糟。\n\
  \n\n\n\n\n### 设置元素的透明度\n\n多年来，网站作者面临的挑战之一是使用 `CSS` 丰富布局的选项有限。在大多数情况下，这意味着需要使用额外的\
  \ HTML 和 `CSS` 以及大量的图片。这些因素共同导致页面变得更加复杂、可访问性更差、在浏览器中下载和显示耗时更长，而且仅仅变得更加脆弱且难以维护。\n\
  \n近年来，浏览器迅速采纳了许多新的 CSS3 属性，情况因此向好的方向发生了变化。今天，仅使用 `CSS` 就可以创建圆角、渐变和投影；调整透明度等，从而生成的\
  \ Web 页面使用了更少的标记和图片。最重要的是，这些页面在智能手机等性能较弱的设备以及台式机和笔记本电脑上的下载和显示速度更快。\n\n随着 CSS 的持续演进，仍然的挑战是并不是所有新的\
  \ CSS 属性在所有浏览器中都能获得完全相同的支持。\n\n在本章中，我将介绍几个流行且实用的 CSS3 属性，用于圆角、创建阴影和渐变、在单个元素上使用多个背景以及调整透明度。我还将向你展示浏览器厂商和进取的\
  \ Web 专业人士如何通过厂商前缀（vendor prefixes）和基于 JavaScript 的补丁程序（polyfills）利用渐进增强策略来弥补浏览器之间的差距。\n\
  \n本章所示的代码示例可以在书籍网站 [www.bruceontheloose.com/htmlcss/examples/](http://www.bruceontheloose.com/htmlcss/examples/)\
  \ 获取。该网站还包含一个结合了本章讨论的 CSS3 效果的额外示例。\n\n### 理解厂商前缀\n\n尽管许多属于 CSS3 范围的内容尚未达到 W3C 的候选建议（Candidate\
  \ Recommendation）阶段（这意味着规范已完成），但许多部分已经在 Firefox、Internet Explorer、Chrome、Safari\
  \ 和 Opera 的最新版本中得以实现。\n\n为了让那些可能发生变化的未完成（且有时存在竞争关系的）CSS 实现具有未来前瞻性，那些需要前缀的属性在浏览器中通过所谓的“厂商前缀”来实现。这允许每个浏览器在引入对某个属性的支持时引入其自己的支持，而不会与最终规范或其他浏览器发生冲突。此外，厂商前缀提供了一种方法，确保一旦规范成熟或确定，使用实验性实现的现有\
  \ Web 网站不会崩溃。\n\n每个主要的浏览器都有它们自己的前缀：`-webkit-`（Webkit/Safari/Chrome）、`-moz-`（Firefox）、`-ms-`（Internet\
  \ Explorer）、`-o-`（Opera）和 `-khtml-`（Konqueror）。正如你所料到的，它们通过将前缀放在 CSS 属性名称之前来使用，但你应该记住你并不总是需要所有前缀。在大多数情况下，你只需要\
  \ `-moz-` 和 `-webkit-` 前缀，正如你在本章示例中所看到的。为了确保你的工作具有未来前瞻性，建议将不带前缀的版本作为最后一个声明 ![Image](img/red_circle-a.jpg)。\n\
  \n![Image](img/red_circle-a.jpg) `border-radius` 属性的一个示例，它需要使用厂商前缀（如所示的前两个声明所示）来支持旧版本的\
  \ Firefox 以及基于 Webkit 的浏览器（如 Chrome 和 Safari）。这些浏览器的最新版本不再使用带前缀的属性，而是使用不带前缀的属性（即简单地使用\
  \ `border-radius: 10px;`）。像既常一样，规则中最后一个冲突的声明具有优先级，这就是为什么不带前缀的版本应该放在最后。\n\n```css\n\
  div {\n    -moz-border-radius: 10px;\n    -webkit-border-radius: 10px;\n    border-radius:\
  \ 10px;\n}\n```\n\n在实践中，正如你在本章中看到的，这意味着为了实现所需效果需要更少的 HTML 但更多的 CSS。\n\n虽然厂商前缀通常会在你的\
  \ CSS 中增加大量的重复，但这是为了进步所付出的很小代价——Web 专业人士在很大程度上接受了这一点，仅仅是因为他们找到了自动化向代码中添加带前缀属性的繁琐工作的方法（见最后的提示）![Image](img/red_circle-b.jpg)。\n\
  \n![Image](img/red_circle-b.jpg) CSS3 生成器 ([www.css3generator.com](http://www.css3generator.com))\
  \ 可以作为一个非常有用的学习工具，同时也可以消除为支持它们的浏览器编写带前缀和不带前缀的 CSS 属性的重复性工作。\n\n![Image](img/14_01.jpg)\n\
  \n> **提示**\n> 并不是所有的 CSS3 属性（例如 `text-shadow` 和 `opacity`）在任何浏览器中都需要使用前缀（分别参见“给文本添加阴影”和“设置元素的透明度”）。此外，并不是所有浏览器都要求对属性使用特定的前缀。\n\
  \n> **提示**\n> 如果一个属性的语法在确定之前发生变化，你可以在 CSS 中包含多个版本。你可以在本章对 `border-radius` 和 `gradient`\
  \ 属性的演示中找到这些示例（分别参见“将元素圆角”和“使用渐变背景”）。每个浏览器只会解释它理解的特定语法，忽略其他部分。\n\n> **提示**\n> 虽然包含带前缀属性没有定义的顺序，但请务始终将不带前缀的版本放在最后，以确保你的工作具有未来前瞻性\
  \ ![Image](img/gray_circle-a.jpg)。\n\n> **提示**\n> 像 CSS3 生成器 ([www.css3generator.com](http://www.css3generator.com))\
  \ 这样的服务可以轻松处理这些属性的创建，节省你的时间并减少打字工作。访问 [www.bruceontheloose.com/tools/](http://www.bruceontheloose.com/tools/)\
  \ 获取其他生成代码的工具列表。\n\n## 浏览器兼容性概览\n\n由于近年来浏览器演进的速度显著加快，了解何时可以获得这些新 CSS 属性的可靠支持是非常重要的。以下是本涵盖的每个属性开始基本支持的情况\
  \ ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg) 该表说明了本章讨论的每个属性何时首次引入支持。要查看更详细的分类，请在\
  \ `www.caniuse.com](http://www.caniuse.com) 或 `www.findmebyip.com/litmus/](http://www.findmebyip.com/litmus/)\
  \ 查询每个属性。\n\n![Image](img/14_02.jpg)\n\n## 使用补丁实现渐进增强\n\n如今创建 Web 网站的常用方法基于被称为*渐进增强*（progressive\
  \ enhancement）的策略，该策略强调无论 Web 浏览器如何，都要为所有用户创建在基础层面访问的内容和功能，同时为功能更强的浏览器提供增强体验。简单来说，渐进增强意味着\
  \ Web 网站在不同的 Web 浏览器中外观和行为不同是完全可以的。\n\n实践中的一个示例是 Dribbble 网站 ([`dribbble.com`](http://dribbble.com))\
  \ ![Image](img/red_circle-a.jpg)，它通过渐进增强利用 CSS3 为更现代的浏览器提供丰富的体验。旧浏览器（例如 Internet\
  \ Explorer 8 ![Image](graphics/red_circle-b.jpg））呈现略有不同的视觉体验，但不会丢失功能。\n\n\n\n\n\n\
  ![Image](img/red_circle-a.jpg) Dribbble 网站使用了多种 CSS3 属性，例如 `border-radius` 和 CSS3\
  \ 渐变背景，为使用更现代浏览器的用户提供更丰富的体验，但它的设计考虑了功能较弱的浏览器。\n\n![Image](img/14_03.jpg)\n\n![Image](img/red_circle-b.jpg)\
  \ 在不支持 `border-radius` 的旧浏览器（如 Internet Explorer 8）中查看时，体验发生了变化。圆角（例如胶囊型按钮中的圆角）变成了直角，但功能没有丢失。一切仍然可以工作。这就是渐进式增强的一个体现。\n\
  \n![Image](img/14_04.jpg)\n\n有时，你可能希望通过使用 `polyfills`（通常称为 `shims`）来弥补功能较弱的浏览器与其他浏览器之间的差距。\n\
  \n`polyfills` 通常使用 JavaScript 实现，它们能够在功能较弱的浏览器中对 HTML5 和 CSS3 API 及属性提供某种支持，同时当浏览器原生支持这些功能时，它们会静默回退到官方支持。需要注意的是，这些通常会带来性能损耗，因为\
  \ JavaScript 在功能较弱的 Web 浏览器中明显较慢（特别是旧版本的 Internet Explorer）。\n\n你可以在 Modernizr 网站上（[www.modernizr.com](http://www.modernizr.com)）了解更多关于渐进式增强、多种类型的\
  \ `polyfills` 以及如何负责任地连接旧浏览器与新 Web 技术，这是一个 JavaScript 库 ![Image](img/red_circle-c.jpg)。Faruk\
  \ Ateş 在 2009 年创建了 Modernizr，现在 Paul Irish、Alex Sexton 和 Ryan Seddon 是该团队的成员。查看提示获取更多关于\
  \ Modernizr 的信息。\n\n![Image](img/red_circle-c.jpg) Modernizr 是允许你检测浏览器是否支持特定的 HTML5、CSS3\
  \ 和其他功能的 JavaScript 库，以便根据可用功能创建网站体验。\n\n![Image](img/14_05.jpg)\n\n* * *\n\n> 提示\n\
  \n如今，Web 浏览器包含了鼓励用户定期下载更新版本的功能（如 Firefox、Safari 和 Internet Explorer），或者在后台静默下载更新的功能（如\
  \ Chrome）。\n\n* * *\n\n* * *\n\n> 提示\n\n基于 JavaScript 的工具（如 Modernizr）通过提供浏览器中是否有可用新或实验性\
  \ CSS 的线索来帮助，允许你使用 CSS 和 JavaScript 渐进式增强页面，并为功能更强的浏览器创建更丰富的体验，同时不忽略其他浏览器。\n\n*\
  \ * *\n\n* * *\n\n> 提示\n\n你可以在 GitHub 上找到一个由社区管理的实用 JavaScript `polyfills` 列表（[`github.com/Modernizr/Modernizr/wiki/HTML5-Cross-Browser-Polyfills`](https://github.com/Modernizr/Modernizr/wiki/HTML5-Cross-Browser-Polyfills)\
  \ ![Image](img/red_circle-d.jpg)，作为 Modernizr 项目的一部分。“CSS3 Styles”部分列出的条目特别值得关注，特别是\
  \ Jason Johnston 的 `PIE`（[www.css3pie.com](http://www.css3pie.com)），它为 Internet\
  \ Explorer 6–9 本章讨论的许多 CSS3 效果的支持（其中，IE9 仅需要 `PIE` 显示线性渐变；对其他效果具有原生支持）。请注意，使用 `PIE`\
  \ 可能会影响你的网站在这些旧浏览器中的性能。\n\n![Image](img/red_circle-d.jpg) 你可以找到不断增长的 JavaScript\
  \ `polyfills` 列表，用于在原生不支持这些功能的旧浏览器中连接 HTML5 和 CSS3 功能。\n\n![Image](img/14_06.jpg)\n\
  \n* * *\n\n### 圆角\n\n使用 CSS3，你可以实现大多数元素的圆角，包括表单元素、图像甚至文本段，而不需要额外的标记或图像（![Image](img/red_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-b.jpg)）。就像 `margin` 和 `padding` 属性一样，`border-radius`\
  \ 属性具有长格式和短格式语法。参考 ![Image](img/red_circle-e.jpg) 查看有关使用 `border-radius` 属性不同方式的一些基本示例。\n\
  \n![Image](img/red_circle-a.jpg) 此文档包含带有类属性的示例 div。每个 div 都用于说明 `border-radius`\
  \ 的不同用法，以及等等设置所有角、使用长格式语法单独设置单个角、创建椭圆圆角以及用于圆形等形状的不同语法。\n\n* * *\n\n...\n\n```html\n\
  <body>\n\n<div class=\"all-corners\"></</div>>\n\n<div class=\"one-corner\"></</div>>\n\
  \n<div class=\"elliptical-corners\"></</div>>\n<div class=\"circle\"></div>\n</body>\n\
  ```\n\n* * *\n\n![Image](img/red_circle-b.jpg) 支持带有或不带厂商前缀的 `border-radius` 属性的浏览器应该渲染类似于这些示例。注意实现之间存在细微的视觉差异，特别是在旧版本的\
  \ Safari 和 Firefox 中。\n\n![Image](img/14_07.jpg)\n\n#### 如何等圆元素的所有角\n\n**1.** 输入\
  \ `-moz-border-radius: r,`，其中 `r` 是角的半径值，以长度（带单位）表示 ![Image](img/red_circle-c.jpg)。\n\
  \n![Image](img/red_circle-c.jpg) 四个 `border-radius` 示例的 CSS 代码，包括为了支持旧版本 Firefox\
  \ 和 Safari 所需的厂商缀属性。注意 Opera 10 和 Internet Explorer 9 不需要前缀。参考 ![Image](img/gray_c.jpg)\
  \ 获取更多信息。\n\n```css\ndiv {\n  -moz-border-radius: r;\n  -webkit-border-radius: r;\n\
  \  border-radius: r;\n}\n```\n\n* * *\n\n**2.** 输入 `-webkit-border-radius: r,`，其中\
  \ `r` 是角的半径值，使用与 1 相同的值。\n\n**3.** 输入 `border-radius: r,`，其中 `r` 是角的半径值，使用与 1 相同的值。这是短格式语法。\n\
  \n#### 如何圆元素的单个角\n\n**1.** 输入 `-moz-border-radius-topleft: r,`，其中 `r` 是左上角的半径值，以长度（带单位）表示。这是\
  \ Firefox 4.0 之前使用的非标准语法（见倒第二个提示）。如果你不在意这些旧版本显示直角，可以跳过此步骤 ![Image](img/gray_c.jpg)。\n\
  \n**2.** 输入 `-webkit-border-top-left-radius: r,`，其中 `r` 是与 1 相同的值。\n\n**3.** 输入\
  \ `border-top-left-radius: r,`，其中 `r` 是左上角的半径值，以长度（带单位）表示。这是长格式语法。\n\n注意这些步骤仅描述了如何设置左上角，但你也可以单独设置其他角。方法如下：\n\
  \n- 要圆右上角：将步骤 2 和 3 中的 top-left 替换为 top-right。可选，将步骤 1 中的 topleft 替换为 topright。\n\
  - 要圆右下角：将步骤 2 和 3 中的 top-left 替换为 bottom-right。可选，将步骤 1 中的 topleft 替换为 bottomright。\n\
  - 要圆左下角：将步骤 2 和 3 中的 top-left 替换为 bottom-left。可选，将步骤 1 中的 topleft 替换为 bottomleft。\n\
  \n#### 如何创建椭圆圆角\n\n**1.** 输入 `-moz-border-radius: x / y,`，其中 `x` 是角的水平半径值，`y` 是角的垂直半径值，均以长度（带单位）表示。值之间应用正斜杠分隔。\n\
  \n\n\n\n\n![Image](img/red_circle-d.jpg) 支持 Firefox 3.6 和 Webkit (Safari/Chrome)\
  \ 的不同长格式圆角语法，以及最新发布浏览器版本使用的无前缀标准语法。\n\n![Image](img/14_08.jpg)\n\n#### 使用 border-radius\
  \ 创建圆形\n\n1. 输入 `-moz-border-radius: r`，其中 `r` 是元素的半径值（带有长度单位）。要创建一个圆形，可以使用简写形式语法，且\
  \ `r` 的值应该是元素高度或宽度的一半 ![Image](img/gray_circle-c.jpg)。\n\n2. 输入 `-webkit-border-radius:\
  \ r`，其中 `r` 是元素的半径值（带有长度单位）。这为 Chrome 和 Safari 等基于 Webkit 的旧版本浏览器提供了支持。\n\n3. 输入\
  \ `border-radius: r`，其中 `r` 是元素的半径值（带有长度单位）。这是标准的无前缀语法。\n\n***\n\n**提示**\n\n不支持\
  \ `border-radius` 的旧浏览器将简单地将元素渲染为直角。\n\n***\n\n**提示**\n\n类似于 CSS 的 `border`、`margin`\
  \ 和 `padding` 属性，`border-radius` 可以使用长格式或短格式样式，取决于你是否需要为每个角指定不同的值。\n\n***\n\n**提示**\n\
  \n如果你想用相同的半径值将元素的四个角圆角，可以使用更简单的 `border-radius` 简写语法，就像设置基础框样式属性一样 ![Image](img/red_circle-e.jpg)。例如，`border-radius:\
  \ 12px;` 会为元素的四个角赋予 12 像素的半径。\n\n![Image](img/red_circle-e.jpg) 这些示例展示了指定 `border-radius`\
  \ 值的几种方法——要么使用一对值，要么单独指定所有四个角。使用简写语法也就不需要担心更复杂的长格式语法，特别是当你需要支持 Firefox 4.0 之前的版本时。\n\
  \n***\n\n```css\ndiv {\n    /* 将左上角和右下角的半径设置为 5px，右上角和左下角设置为 10px */\n    border-radius:\
  \ 5px 10px;\n}\n\ndiv {\n    /* 将左上角的半径设置为 5px，右上角设置为 10px，右下角设置为 0，左下角设置为 20px\
  \ */\n    border-radius: 5px 10px 0 20px;\n}\n\ndiv {\n    /* 将左上角的半径设置为 20px，右上角设置为\
  \ 0，右下角设置为 0，左下角设置为 0 */\n    border-radius: 20px 0 0 0;\n}\n\ndiv {\n    /* 将左上角的半径设置为\
  \ 30px */\n    -moz-border-radius-topleft: 30px;\n    -webkit-border-top-left-radius:\
  \ 30px;\n    border-top-left-radius: 30px;\n}\n```\n\n***\n\n**提示**\n\n`border-radius`\
  \ 属性是不继承的。\n\n***\n\n**提示**\n\n虽然可以使用百分比来指定圆角的半径，但通常不建议这样做，因为某些浏览器可能会根据元素的计算尺寸对其进行不一致的处理。\n\
  \n***\n\n**提示**\n\n当 Firefox 和 Safari 支持 `border-radius` 时，Firefox 起初使用了非标准的长格式语法（`-moz-border-radius-topleft`、`-moz-border-radius-topright`、`-moz-border-radius-bottomleft`、`-moz-border-radius-bottomright`）来指定元素每个角的属性\
  \ ![Image](img/red_circle-d.jpg)，但从 Firefox 4.0 开始，它遵循了推荐的语法（`border-top-left-radius`、`border-top-right-radius`、`border-bottom-left-radius`、`border-bottom-right-radius`）。所有浏览器的最新版本现在都支持无前缀的\
  \ `border-radius` 属性。\n\n***\n\n**提示**\n\n如果编写 `border-radius` 的 CSS 看起来混乱或乏味，不要担心。由\
  \ Randy Jensen 提供的 Web 服务 CSS3 Generator ([www.css3generator.com](http://www.css3generator.com))\
  \ 可以帮助快速创建圆角并节省大量输入。你输入半径值，它会在示例元素上显示结果，你可以查看是否是你想要的效果。更好的是，它会为你编写所有的 CSS，你可以将其复制并粘贴到样式表中。它对其他\
  \ CSS3 属性也是如此。简单得多！\n\n***\n\n### 为文本添加阴影\n\n`text-shadow` 属性最初包含在 CSS2 规范中，在 CSS2.1\
  \ 中移除，后来在 CSS3 中复活，它允许你为文本添加阴影。\n\n```html\n<body>\n<h1 class=\"multiple\">Text\
  \ Shadow</h1>\n<h1 class=\"multiple\">Multiple Text Shadows</h1>\n</body>\n```\n\
  \n```css\nh1 {\n    text-shadow: 2px 2px 5px #999;\n}\n\n.multiple {\n    text-shadow:\
  \ 2px 2px 0 #999, 6px 6px 0 rgba(50,50,50,.25);\n}\n```\n\n#### 为文本添加阴影\n\n1. 在\
  \ CSS 中输入 `text-shadow:`。\n2. 输入水平偏移、垂直偏移、颜色和半径（带有长度单位），用空格隔开。\n3. 输入 `;`（分号）。\n\
  \n#### 为元素添加多个阴样式\n\n1. 在 CSS 中输入 `text-shadow:`。\n2. 输入水平偏移、垂直偏移、颜色和半径（带有长度单位），用空格隔开。\n\
  3. 输入 `,`（逗号）。\n4. 重复步骤 2 并使用不同的值。\n5. 输入 `;`（分号）。\n\n#### 将文本阴影重置为默认值\n\n1. 在 CSS\
  \ 中输入 `text-shadow:`。\n2. 输入 `none`。\n3. 输入 `;`（分号）。\n\n***\n\n**提示**\n\n`text-shadow`\
  \ 属性不需要厂商前缀。\n\n***\n\n**提示**\n\n虽然语法看起来相似，但无法像 border 那样单独指定 `text-shadow` 的四个值。\n\
  \n***\n\n**提示**\n\n如果没有设置，初始值为 `none`。\n\n***\n\n**提示**\n\n`text-shadow` 属性是继承的。\n\
  \n***\n\n**提示**\n\n该属性接受四个值：带有长度单位的水平偏移、带有长度单位的垂直偏移、可选的带有长度单位的半径，最后是颜色值。如果不指定半径，则假设为\
  \ 0。\n\n***\n\n**提示**\n\n水平偏移和垂直偏移值可以是正整数或负整数；也就是说，`1px` 和 `-1px` 都是有效的。半径值必须是正整数。这三个值都可以为零。\n\
  \n***\n\n**提示**\n\n颜色可以使用十六进制、RGB、RGBA 或 HSLA 值指定，并可以放在属性值顺序的开头或最后。\n\n### 为其他元素添加阴影\n\
  \n\n\n\n\n`text-shadow` 属性允许你对元素的文本应用阴影，而 `box-shadow` 属性允许你为元素本身添加阴影（![Image](img/red_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-b.jpg)）。尽管它们基于同一组基本属性，但 `box-shadow` 多了两个可选属性：`inset`\
  \ 关键字属性以及用于扩展或收缩阴影的 `spread` 属性。\n\n![Image](img/red_circle-a.jpg) 本文档包含了三个 `div`，演示了如何使用\
  \ `box-shadow` 添加一个或多个阴影。\n\n* * *\n\n```html\n<body>\n\n<div class=\"shadow\">\n\
  <h1>Single Shadow</h1>\n</div>\n\n<div class=\"inset-shadow\">\n<h1>Inset Shadow</h1>\n\
  </div>\n\n<div class=\"multiple\">\n<h1>Multiple Shadows</h1>\n</div>\n\n</body>\n\
  </html>\n```\n\n* * *\n\n![Image](img/red_circle-b.jpg) 这三个示例在支持 `box-shadow` 属性的浏览器中显示时的样子。\n\
  \n![Image](img/14_10.jpg)\n\n`box-shadow` 属性与 `text-shadow` 的不同之处在于，它的支持程度较低，并且在某些浏览器版本需要厂商前缀。\n\
  \n虽然你通常只使用四个值，但 `box-shadow` 属性接受六个值：带有长度单位的 `x-offset` 和 `y-offset`、可选的 `inset`\
  \ 关键字、可选的带有长度单位的 `blur-radius`、可选的带有长度单位的 `spread` 值以及颜色值。如果你不指定 `blur-radius` 或\
  \ `spread` 值，它们将被默认为零。\n\n### 为元素添加投影阴影\n\n1. 在 CSS 中，输入 `-moz-box-shadow:`。\n2.\
  \ 输入 `x-offset`、`y-offset`、`blur-radius`（均带有长度单位）和颜色 ![Image](img/red_circle-c.jpg)。\n\
  \n![Image](img/red_circle-c.jpg) 创建这三个示例所使用的 CSS。注意需要额外的两个带有厂商前缀的属性，以确保它们在旧版本的 Firefox\
  \ 和 Webkit 浏览器中正确显示。不理解 `box-shadow` 的浏览器将简单忽略这些 CSS 规则，页面将不带阴影地渲染。\n\n* * *\n\n\
  ```css\ndiv {\n    background: fff;\n    float: left;\n    height: 150px;\n    margin:\
  \ 10px;\n    width: 150px;\n}\n.shadow {\n    background: #ccc;\n    -moz-box-shadow:\
  \ 2px 2px 5px #000;\n    -webkit-box-shadow: 2px 2px 5px #000;\n    box-shadow:\
  \ 2px 2px 5px #000;\n}\n.inset-shadow {\n    -moz-box-shadow: inset 2px 2px 10px\
  \ #000;\n    -webkit-box-shadow: inset 2px 2px 10px #000;\n    box-shadow: inset\
  \ 2px 2px 10px #000;\n}\n.multiple {\n    -moz-box-shadow: 2px 2px 10px rgba(0,255,0,.75),\
  \ 5px 5px 20px rgba(125,0,0,.5);\n    -webkit-box-shadow: 2px 2px 10px rgba(0,255,0,.75),\
  \ 5px 5px 20px rgba(125,0,0,.5);\n    box-shadow: 2px 2px 10px rgba(0,255,0,.75),\
  \ 5px 5px 20px rgba(125,0,0,.5);\n}\n```\n\n* * *\n\n3. 输入 `-webkit-box-shadow:`\
  \ 并重复步骤 2。\n4. 输入 `box-shadow:` 并再次重复步骤 2。\n\n### 创建内嵌阴影\n\n1. 在 CSS 中，输入 `-moz-box-shadow:`。\n\
  2. 在冒号后输入 `inset`，后面跟一个空格。\n3. 输入 `x-offset`、`y-offset`、`blur-radius`（均带有长度单位）和颜色；例如\
  \ `2px 2px 5px #000`。\n4. 输入 `-webkit-box-shadow:` 并重复步骤 2 和 3。\n5. 输入 `box-shadow:`\
  \ 并重复步骤 2 和 3。\n\n### 为元素应用多个阴影\n\n1. 在 CSS 中，输入 `-moz-box-shadow:`。\n2. 输入 `x-offset`、`y-offset`、`blur-radius`（均带有长度单位）和颜色；例如\
  \ `2px 2px 5px #000`。\n3. 输入 `,`（逗号）。\n4. 为每个属性使用不同的值重复步骤 2 ![Image](img/gray_circle.jpg)\
  \ 。\n5. 输入 `-webkit-box-shadow:` 并重复步骤 2 到 4。\n6. 输入 `box-shadow:` 并重复步骤 2 到 4。\n\
  \n字体 将 box-shadow 重置为默认值\n\n1. 在 CSS 中，输入 `-moz-box-shadow: none`。\n2. 输入 `-webkit-box-shadow:\
  \ none`。\n3. 输入 `box-shadow: none`。\n\n* * *\n\n**提示**：Firefox 3.5 和 3.6 要求 `box-shadow`\
  \ 属性带有 `-moz-` 前缀，某些旧版本的基于 Webkit 的浏览器（如 Safari 和 Chrome）需要 `-webkit-` 前缀。Opera\
  \ 10.5 和 Internet Explorer 9 支持 `box-shadow` 属性，因此不需要厂商前缀。你可以在 `http://cssplease.com`\
  \ 找到关于何时需要 `box-shadow` 前缀的详细信息。\n\n* * *\n\n**提示**：如果没有设置，初始属性值为 `none`。\n\n* *\
  \ *\n\n**提示**：`box-shadow` 属性是不继承的。\n\n* * *\n\n**提示**：颜色可以使用十六、RGB 或 HSLA 值指定（参见第\
  \ 7 章中的“CSS 颜色”），并放在属性值顺序的开头或结尾。\n\n* * *\n\n**提示**：`x-offset` 和 `y-offset` 值可以是正负整数；`1px`\
  \ 和 `-1px` 都是有效的。`blur radius` 值必须是正整数。\n\n* * *\n\n**提示**：通过在元素上应用多个阴影，可以使用 `box-shadow`\
  \ 属性来实现高级效果。使用逗号分隔这些阴影，例如 `box-shadow: 2px 2px 0 #999, 6px 6px 0 rgba(50,50,50,.25);`。阴影的叠加顺序是第一个在最上方。\n\
  \n* * *\n\n**提示**：在旧版本的 Internet Explorer 中可以使用 `filter` 和 `-ms-filter` 属性来创建投影。\n\
  \n* * *\n\n### 应用背景\n\nCSS 最受期待的功能之一是可以在单个元素上指定多个背景（![Image](img/red_circle-b.jpg)\
  \ 和 ![Image](img/red_circle-c.jpg)）。这简化了你的 HTML 代码，减少了对额外标记元素的需求。多个背景可以应用于几乎任何元素。\n\
  \n![Image](img/red_circle-a.jpg) 应用多个背景。\n\n* * *\n\n```html\n<body>\n\n<div class=\"\
  night-sky\">\n<h1>夜空...</h1>\n</div>\n\n</body>\n</html>\n```\n\n* * *\n\n支持多个背景的浏览器将通过叠加图像来渲染我们的示例，逗号列表中的第一个位于顶层。为单个元素添加多个背景是简单的，但为了确保内容可见，你需要在\
  \ CSS 规则中提供一个简单的 `background-color` 回退。\n\n![Image](img/14_11.jpg)\n\n这是你在不支持多背景语法的浏览器中看到的内容。如果你遵循渐进增强的，可以在\
  \ `background-image` 规则之前包含 `background-color` 或单个 `background-image` 属性，作为能力较弱浏览器的安全保障。\n\
  \n![Image](img/14_12.jpg)\n\n### 为元素应用多个背景图像\n\n1. 输入 `background-color: b`，其中 `b`\
  \ 是你想作为元素回退背景的颜色 ![Image](img/red_circle-d.jpg)。\n\n![Image](img/red_circle-d.jpg)\
  \ 要使用多个背景，你需要使用四个独立的长格式属性：`background-color`、`background-image`、`background-position`\
  \ 和 `background-repeat`。通过每个属性，你可以调整图像的位置和重复方式。\n\n* * *\n\n```css\n.night-sky {\n\
  \    background-color: #333;\n    background-image: url(ufo.png), url(stars.png),\
  \ url(stars.png), url(sky.png);\n    background-position: 50% 102%, 100% -150px,\
  \ 0 -150px, 50% 100%;\n    background-repeat: no-repeat, no-repeat, no-repeat, repeat-x;\n\
  \    height: 300px;\n    margin: 0 auto;\n    padding-top: 36px;\n    width: 75%;\n\
  }\n```\n\n* * *\n\n\n\n\n\n2. 输入 `background-image: u`，其中 `u` 是由逗号分隔的绝对或相对路径图像引用列表。\n\
  \n3. 输入 `background-position: p`，其中 `p` 是一个带有长度单位的正负 `x` 偏移和 `y` 偏移量对的逗号分隔集合。每个背景图像都应该有一组坐标。\n\
  \n4. 输入 `background-repeat: r`，其中 `r` 是由逗号分隔的 `repeat-x`、`repeat-y` 或 `no-repeat`\
  \ 值列表（参见第 10 章中的“更改文本背景””），每个每个图像对应一个值。\n\n***\n\n提示\n在指定多个背景时，不需要厂商前缀。\n\n***\n\
  \n提示\n你可以通过用逗号分隔每组背景参数，使用标准的短格式语法来处理多个背景图像。例如，你可以使用 `background: url(image.jpg)\
  \ 0 0 no-repeat, url(image2.jpg) 100% 10% no-repeat;` 来实现与更冗长的长格式语法相同的效果。\n\n***\n\
  \n提示\n背景图像是堆叠的，第一张图像位于最顶部，最后一张图像位于堆叠顺序的底部。\n\n***\n\n提示\n如果指定了 `background-color`\
  \ 值，它将作为任何图像之后的最后一个背景层应用，并被不支持多个背景图像的浏览器使用。\n\n***\n\n提示\n不支持多个背景图像的浏览器将忽略 `background-image`\
  \ 属性，并尝试退回到 `background-color` 的值。\n\n***\n\n### 使用渐变背景\n\n渐变背景也是 CSS3 的新特性，它允许你在不使用图像的情况下创建从一种颜色到另一种颜色的过渡（如\
  \ ![Image](img/red_circle-a.jpg) 和 ![Image](img/red_circle-b.jpg)）。该规范仍在变动中，但随着规范趋于定型，浏览器的支持程度正在增加。\n\
  \n![Image](img/red_circle-a.jpg) 仅使用 CSS 实现渐变的五种方法。\n\n***\n\n```html\n<body><body>\n\
  <div class=\"horizontal\"></div>\n<div class=\"vertical\"></div>\n<div class=\"\
  diagonal\"></div>\n<div class=\"radial\"></div>\n<div class=\"multi-stop\"></div>\n\
  </body>\n```\n\n***\n\n![Image](img/red_circle-b.jpg) 支持渐变背景的浏览器应该以类似于所示的方式渲染这五个示例，前提是在示例代码中添加了适当的厂商前缀。目前的浏览器对背景渐变都需要厂商前缀。不理解渐变语法的浏览器将使用备选的\
  \ `background` 属性（如果已指定的话）。\n\n![Image](img/14_13.jpg)\n\n尽管背景渐变语法需要厂商前缀来支持最广泛的浏览器，但我将通过演示不带前缀的属性来让你逐渐熟悉如何使用渐变。更多信息可以在本节的提示中找到，你可以在本章的代码下载中找到完整示例，包括所需的厂商前缀属性。\n\
  \n根据渐进增强的哲学，为不支持 `background-gradient` 属性的浏览器包含一个回退方案是一个好主意。这可以是简单的背景颜色或图像，可以在 CSS\
  \ 中在背景渐变规则之前作为单独规则进行指定。\n\n使用 CSS 可以创建两种主要的渐变样式（线性线径向），每种样式都有一组不同的必需和可选参数（![Image](img/red_circle-c.jpg)\
  \ 和 ![Image](img/red_circle-d.jpg)）。\n\n![Image](img/red_circle-c.jpg) 使用标准线性渐变语法实现的简单双色水平渐变，并包含一个用于不支持\
  \ CSS 渐变的简单回退颜色。\n\n***\n\n```css\ndiv {\n    float: left;\n    height: 150px;\n\
  \    margin: 10px;\n    width: 150px;\n}\n.horizontal {\n    background: #cedce7;\n\
  \    background: linear-gradient(left, #cedce7,#596a72);\n}\n```\n\n***\n\n![Image](img/red_circle-d.jpg)\
  \ 创建垂直渐变只需将第一个属性的值改为 top 或 bottom。\n\n***\n\n```css\n.vertical {\n    background:\
  \ #cedce7;\n    background: linear-gradient(top, #cedce7,#596a72);\n}\n```\n\n***\n\
  \n#### 创建回退背景颜色\n\n输入 `background-color: color`，其中 `color` 是任何支持的颜色名称或十六进制、RGB、RGBA\
  \ 或 HSL 值。\n\n#### 定义渐变类型\n\n输入 `background: type(`，其中 `type` 是 `linear-gradient`\
  \ 或 `radial-gradient`。\n\n#### 定义渐变的起始位置\n\n输入 `left` 后紧跟 `,`，以从元素的左侧开始渐变。\n\n或输入\
  \ `right` 后紧跟 `,`，以从元素的右侧开始渐变。\n\n或输入 `top` 后紧跟 `,`，以从元素的顶部开始渐变。\n\n或输入 `bottom`\
  \ 后紧跟 `,`，以从元素的底部开始渐变。\n\n或输入角度值（如 `0deg`、`45deg`、`120deg`）后紧跟 `,` 来设置渐变的起点。\n\n\
  ![Image](img/red_circle-e.jpg) 多步渐变（使用两种以上颜色的渐变）遵循相同的模式，但需要颜色停止位置。\n\n或输入 `left`\
  \ 后紧跟 `,`，以从元素的左侧开始渐变。\n\n![Image](img/red_circle-e.jpg) 多步渐变（使用两种以上颜色的渐变）遵循相同的模式，但需要颜色停止位置。\n\
  \n***\n\n```css\n.diagonal {\n    background: #cedce7;\n    background: linear-gradient(45deg,\
  \ #cedce7,#596a72);\n}\n```\n\n***\n\n或输入 `center`（用于径向渐变）后紧跟 `,`，以从中心开始渐变。\n\n\
  ![Image](img/red_circle-f.jpg) 径向渐变包含额外的参数，但最简单的示例使用了与线性相同的参数。在这种情况下，渐变的起点是中心。\n\
  \n***\n\n```css\n.radial {\n    background: #cedce7;\n    background: radial-gradient(center,\
  \ #596a72);\n}\n```\n\n***\n\n#### 指定起始和结束颜色\n\n输入 `c1, c2)`，其中 `c1` 和 `c2` 是渐变中的起始和结束颜色。颜色可以使用颜色名称或十六进制、RGB、RGBA\
  \ 或 HSL 值指定。\n\n#### 创建多色渐变\n\n1. 重复创建线性或径向渐变的前两种技术，指定渐变类型和起始点（![Image](img/red_circle-b.jpg)\
  \ 到 ![Image](img/red_circle-d.jpg)）。\n2. 然后输入 `c1 p1, c2 p2, c3 p3)`，其中 `c#` 是颜色（使用颜色名称或十六进制、RGB、RGBA\
  \ 或 HSL 值指定），`p#` 是颜色的位置（指定为 0 到 100 的百分比）![Image](img/gray_circle-g.jpg)。\n\n***\n\
  \n```css\n.multi-stop {\n    background: url(multi-stop-gradient.jpg) 0 0 repeat-x;\n\
  \    background: linear-gradient(top, #ff0000 0%, #00ff00 50%, #0000ff 100%);\n\
  }\n```\n\n***\n\n提示\n早期版本的 Webkit 浏览器（例如 Safari 4）使用非标准语法指定渐变背景。Safari 5 和新版本的 Chrome\
  \ 都与 Firefox 使用相同的语法，但目前仍需要 -webkit- 和 -moz- 厂商前缀。\n\n***\n\n提示\n你可以从 Mozilla 团队（[`developer.mozilla.org/en/CSS/-moz-radial-gradient`](https://developer.mozilla.org/en/CSS/-moz-radial-gradient)）和\
  \ Webkit 团队（[`webkit.org/blog/1424/css3-gradients/`](http://webkit.org/blog/1424/css3-gradients/)）那里获取关于使用渐变属性的最新且详细的信息。\n\
  \n\n\n\n\n通过指定两种以上的颜色，并使用渐变语法中的一个额外可选参数（颜色停止点），你可以创建多颜色渐变![Image](img/red_circle-g.jpg)。\n\
  \n**提示**\n可以使用颜色名称或十六进制、`RGB`、`RGBA` 或 `HSLA` 值指定颜色。\n\n**提示**\n尽管最新的 Web 浏览器支持性不断提高，但渐变语法仍在变动中，并且需要供应商前缀，包括\
  \ Internet Explorer 和 Opera 的前缀。\n\n**提示**\n你可以使用视觉工具如 ColorZilla 的渐变生成器([`colorzilla.com/gradient-editor/`](http://colorzilla.com/gradient-editor/))\
  \ 或微软的 CSS 渐变背景生成器([`ie.microsoft.com/testdrive/graphics/cssgradientbackgroundmaker/`](http://ie.microsoft.com/testdrive/graphics/cssgradientbackgroundmaker/))\
  \ 来简化创建 CSS 渐变代码的琐工作。这些工具还将自动生成所有的供应商前缀属性，以确保与旧版本浏览器的最大兼容。\n\n**提示**\nInternet Explorer\
  \ 10 原生支持 CSS 渐变。10 之前的版本可以使用专有的过滤器：`progid:DXImageTransform.Microsoft.gradient\
  \ filter` 来创建渐变，或者通过使用额外的 HTML 标记和 SVG 创建（如 Internet Explorer 9 的情况）。上一个提示中提到的 ColorZilla\
  \ 渐变编辑器等工具可以生成你所需的所有代码，因此不必担心自己编写。\n\n**提示**\n你应该通过指定 `background-color` 或 `background-image`\
  \ 来适应不支持的浏览器，但请记住，CSS 中的图像无论是否被使用，浏览器都会下载它们。\n\n**提示**\nFirefox 和 Webkit 额外支持带前缀的\
  \ `repeating-linear-gradient` 和 `repeating-radial-gradient` 功能。\n\n### 设置元素的透明度\n\
  \n使用 `opacity` 属性，你可以更改元素的透明度，包括图像(![Image](img/red_circle-a.jpg) 和 ![Image](img/red_circle-b.jpg))。\n\
  \n![Image](img/red_circle-a.jpg) 此文档包含一个包含图片的 `div` 元素。\n\n```html\n<<body>\n\n\
  <div class=\"box\">\n\n    <img src=\"sleeves.jpg\" width=\"420\" height=\"296\"\
  \ alt=\"Record Sleeves\" />\n\n</div>\n\n</</body>\n```\n\n![Image](img/red_circle-b.jpg)\
  \ 这里是当我们将 `div` 元素的 `opacity` 设置为默认值 `1` 时，我们的示例看起来。\n\n![Image](img/14_14.jpg)\n\
  \n#### 更改元素的透明度\n\n输入 `opacity: o`，其中 `o` 是元素不透明水平，保留两位小数（不带单位）。\n\n**提示**\n`opacity`\
  \ 的默认值为 `1`。值可以从 `0.00`（完全透明）到 `1.00`（完全不透明）以两位小数增量进行设置(![Image](img/red_circle-c.jpg)\
  \ 和 ![Image](img/red_circle-d.jpg))。\n\n![Image](img/red_circle-c.jpg) 通过将 `opacity`\
  \ 值小于 `1`，你可以让元素及其子元素变为透明。在这种情况下，我将 `opacity` 改为 50%，即 `.5`。在小数点前包含零不是必须的。\n\n```css\n\
  img {\n    vertical-align: top;\n}\n.box {\n    background: #000;\n    opacity:\
  \ .5;\n    padding: 20px;\n}\n```\n\n![Image](img/red_circle-d.jpg) 这里是当 `div` 元素的\
  \ `opacity` 值设置为 `.5`（50% 不透明）时，我们的示例看起来。注意看，`div` 元素的纯黑色背景现在变成了灰色，而且图像是半透明的。\n\n\
  ![Image](img/14_15.jpg)\n\n**提示**\n通过将 `opacity` 属性配合 `:hover` 伪属性，你可以产生一些有趣且实的效果。例如，你可以在用户悬停在元素上时更改元素的\
  \ `opacity`，或者让元素（如可选表单字段）看起来像被禁用了一样。\n\n**提示**\n与 `RGBA` 和 `HSLA` 颜色单位的数值一样，在设置\
  \ `opacity` 值时不需要在小数点前包含前导零。\n\n**提示**\n尽管看起来如此，`opacity` 并不是一个继承属性。`opacity` 小于\
  \ `1` 的元素的子元素也会受到影响，但这些子元素的 `opacity` 值仍然为 `1`。\n\n**提示**\n`opacity` 属性在 9 之前的 Internet\
  \ Explorer 版本中无法原生工作，但可以通过使用专有的 `-ms-filter: progid:DXImageTransform.Microsoft.Alpha(opacity=50);`\
  \ 和 `filter: alpha(opacity=50);` 属性，结合在浏览器中触发 `hasLayout` 的元素上使用 `zoom: 1;` 来实现![Image](img/red_circle-e.jpg)。\n\
  \n\n\n\n\n![Image](img/red_circle-a.jpg) 官方并没有提供格式化列表标题的方法。大多数情况下，使用普通标题（参见第 3 章）或段落（参见第\
  \ 4 章）是像示例中这样的列表的合适引言。按照惯例但并非强制，可以对列表项进行缩进，以指示它们嵌套在 `ol` 中（使用 `ul` 时也是如此）。不过，这不会导致它们在显示时产生缩进；那完全取决于应用于列表的\
  \ CSS。\n\n* * *\n\n...\n\n```html\n<body>\n\n<h1>Changing a light bulb</h1>\n\n\
  <ol>\n    <li>Make sure you have unplugged the lamp from the wall socket.</li>\n\
  \    <li>Unscrew the old bulb.</li>\n    <li>Get the new bulb out of the package.</li>\n\
  \    <li>Check the wattage to make sure it's correct.</li>\n    <li>Screw in the\
  \ new bulb.</li>\n    <li>Plug in the lamp and turn it on!</li>\n</ol>\n\n</body>\n\
  </html>\n```\n\n* * *\n\n![Image](img/red_circle-b.jpg) 此列表使用默认的阿拉伯数字创建一个编号的有序列表。你可以通过\
  \ CSS 更改它。有序列表和无序列表无论在 HTML 本身中是否缩进，默认都会显示缩进![Image](img/gray_circle-a.jpg)。\n\n\
  ![Image](img/15_01.jpg)\n\n无序列表可能是 Web 上最常用的列表，因为它们被用于标记导航（![Image](img/red_circle-c.jpg)\
  \ 和 ![Image](img/red_circle-d.jpg)）。\n\n![Image](img/red_circle-c.jpg) 无序列表的列表项元素与有序列表的元素相同。不同的是\
  \ `ul` 元素。\n\n* * *\n\n...\n\n```html\n<body>\n\n<h1>PageWhacker, version 12.0:\
  \ Features</h1>\n\n<ul>\n    <li>New or improved features marked with a solid bullet.</li>\n\
  \    <li>One-click page layout</li>\n    <li>Spell checker for 327 major languages</li>\n\
  \    <li>Image retouching plug-in</li>\n    <li>Special HTML filters</li>\n    <li>Unlimited\
  \ Undo's and Redo's</li>\n    <li>Automatic book writing</li>\n</ul>\n\n</body>\n\
  </html>\n```\n\n* * *\n\n![Image](img/red_circle-d.jpg) 无序列表默认具有实心圆点。你可以通过 CSS 更改它们。\n\
  \n![Image](img/15_02.jpg)\n\n### 创建列表\n\n1.  输入 `<ol>` 创建有序列表，或输入 `<ul>` 创建无序列表。对于有序列表，你可以包含任何可选属性\
  \ `start`、`type` 和 `reversed`。（关于 `start` 参见“选择列表编号的起始位置”；关于 `type` 参见“选择你的标记符号”，以及查看最后一个贴士以了解\
  \ `reversed`，它尚未尚未支持，因此没有视觉效果。）\n\n2.  输入 `<li>`（这是“list”单词的前两个字母）来开始第一个列表项。对于有序列表，你可以包含可选的\
  \ `value` 属性（详情参见“选择列表编号的起始位置”）。\n\n3.  向列表项添加内容（如文本、链接或 `img` 元素）。\n\n4.  输入 `</li>`\
  \ 完成每个列表项。\n\n5.  对于每个新的列表项，重复步骤 2 到 4。\n\n6.  输入 `</ol>` 或 `</ul>` 以匹配第 1 步的起始标签并完成列表。\n\
  \n* * *\n\n**贴士**\n\n不要根据你想要在内容旁边显示的标记样式来决定使用哪种列表类型。毕竟你始终可以通过 CSS 更改（是的，你甚至可以在有序列表中显示圆点）。相反，请考虑列表的含义——如果列表项的顺序发生变化，含义改变吗？如果是，将列表标记为有序列表。否则，使用无序列表。\n\
  \n* * *\n\n* * *\n\n**贴士**\n\n关于使用列表标记链接组，使用无序列表来标记大多数链接组，例如主导航、视频或相关故事列表或页脚中的链接。使用有序列表来标记面包屑导航，因为链接表示了一个特定的序列（换句话说，顺序是有意义的）。面包屑导航通常显示在主内容区域上方，以指示当前页面在站点路径中的位置。例如，在提供特定手机详情的页面上，可以是：首页\
  \ > 产品 > 手机 > Phone 3.0。列表中的最后一个项之外的每个项目都是链接，因为访问者正处于 Phone 3.0 页面。我将此示例包含在“嵌套列表”图\
  \ ![Image](img/gray_circle-e.jpg) 中（面包屑导航位于顶部导航和大型产品名称标题之间）。\n\n* * *\n\n* * *\n\
  \n**贴士**\n\n第 11 章中的完整示例 Web 页面演示了各种列表的使用和展示方式。它包含了用于导航的无序列表（水平显示并带圆点）、用于图像列表的无序列表（水平显示且无标记），以及用于按时间顺序存档链接列表的有序列表（带圆点）。\n\
  \n第 3 章 也包含将 `ul` 作为导航的示例。\n\n\n\n\n\n### 选择你的标记\n\n在样式表规则中，输入 `list-style-type:\
  \ marker`，其中 `marker` 是以下值之一：\n\n• 实心圆 (disc (![Image](img/disc.jpg)))\n• 空心圆 (circle\
  \ (![Image](img/circle.jpg)))\n• 方形 (square (![Image](img/square.jpg)))\n• 十进制 (decimal\
  \ (1, 2, 3, . .))\n• 大写字母 (A, B, C, . . .)\n• 小写字母 (a, b, c, . . .)\n• 大写罗马数字 (I,\
  \ II, III, IV, . . .) (![Image](img/red_circle-b.jpg) 和 ![Image](img/red_circle-c.jpg))\n\
  \n![Image](img/red_circle-b.jpg) 你可以将 `list-style-type` 属性应用于任何列表项目。如果你在该页面上有两个列表，其中一个是无序列表，你可以通过将此示例中的选择器更改为\
  \ `ol li`，仅对有序列表应用大写罗马数字。\n\n```css\nli {\n    list-style-type: upper-roman;\n}\n\
  ```\n\n![Image](img/red_circle-c.jpg) 现在有序列表使用了大写罗马数字。注意，大多数浏览器会将数字标记向右对齐（但在列表项目内容的左侧，如所示）。\n\
  \n![Image](img/15_03.jpg)\n\n• 小写罗马数字 (i, ii, iii, iv, . . .)\n\n### 显示没有标记的列表\n\
  \n在样式表规则中，输入 `list-style-type: none`。\n\n**提示**\n默认情况下，无序列表的第一级使用 `discs`，第一个嵌套级使用\
  \ `circles`，第三级及后续列表使用 `squares`。关于此主题，请参阅“设置嵌套列表”获取更多信息。\n\n**提示**\n`disc`、`circle`\
  \ 和 `square` 项目符号在不同浏览器之间的尺寸和外观略有不同。\n\n**提示**\n你可以通过 `list-style-type` 将任何标记样式同时应用于\
  \ `ol` 和 `ul`。换句话说，一个 `ol` 可以具有正方形标记，而 `ul` 可以具有十进制标记。\n\n**提示**\n你还可以使用 `type`\
  \ 属性指定有序列表的标记类型，尽管我建议尽可能在 CSS 中定义列表样式类型。`type` 的接受值为 `A`、`a`、`I`、`i` 和 `1`，它们表示使用的数字类型（`1`\
  \ 是默认值）。例如，`<ol type=\"I\">` 指定使用大写罗马数字。\n\n### 选择列表编号的起始位置\n\n你可能希望从默认 1 ![Image](img/red_circle-a.jpg)\
  \ 的其他数字开始编号列表。\n\n![Image](img/red_circle-a.jpg) 在此示例中，我省略了一些步骤，但想保持剩余步骤的原始编号。因此，我让整个列表从\
  \ `2` 开始（使用 `start=\"2\"`），然后将第二个项目的值设置为 `5`（使用 `value=\"5\"`）。这两个属性都是可选的，并且不需要像这里这样一起使用。\n\
  \n```html\n<body>\n<h1>更换灯泡（缺少了几个步骤）</h1>\n<ol start=\"2\">\n    <li>卸下旧灯泡。</li>\n\
  \    <li value=\"5\">装上新灯泡。</li>\n    <li>插上灯并打开它！</li>\n</ol>\n</body>\n</html>\n\
  ```\n\n![Image](img/red_circle-b.jpg) 注意，不仅第一个和第二个项目按照我们指定的进行了编号，第三个项目（“插上灯并打开它！”）也受了影响。\n\
  \n![Image](img/15_04.jpg)\n\n### 确定整个列表编号方案的初始值\n\n在 `ol` 起始标签内，输入 `start=\"n\"\
  `，其中 `n` 代表列表的初始值。\n\n### 修改有序列表中给定列表项目的编号\n\n在所需的 `li` 项目中，输入 `value=\"n\"`，其中\
  \ `n` 代表该列表项目的值。该值始终以数字形式指定，并由浏览器自动转换为通过 CSS 或 `type` 属性指定的标记类型（详请参阅“选择你的标记”）。\n\
  \n**提示**\n如果你使用 `start`，请始终给它一个数字值，即使你决定让列表以字母或罗马数字显示（参阅“选择你的标记”）。浏览器将按预期显示标记。\n\
  \n**提示**\n`value` 属性会覆盖 `start` 值。\n\n**提示**\n当使用 `value` 属性更改给定列表项目的编号时，后续的列表项目也会随之进行重新编号。\n\
  \n**提示**\n使用 `value` 也非常便于指示有序列表中的两个或多个项目占据相同的位置。例如，考虑一个包含公路赛前名前五名参赛者的列表。通常，他们将显示为\
  \ 1, 2, 3, 4, 5。但如果有第二名并列，通过将*第三*个列表项目指定为 `<li value=\"2\">`，列表将显示为 1, 2, 3, 4,\
  \ 5。\n\n**提示**\n你也可以使用 `value` 来重置编号。\n\n### 使用自定义标记\n\n如果你厌倦了圆圈、正方形甚至罗马数字，你可以用图像创建自己的标记。![Image](img/red_circle-b.jpg)\
  \ 首先关闭默认标记（这样就不会看到符号）并调整列表项目的缩进。然后将图像分配给每个列表项目，使其距离顶部几像素。![Image](img/red_circle-a.jpg)\
  \ 这就像任何无序列表，但通过 CSS 实现。\n\n```html\n<body>\n<h1>第 12 页：特性</h1>\n<ul>\n    <li>点击</li>\n\
  \    <li>语言</li>\n    <li>自动</li>\n    <li>撤销</li>\n</ul>\n</body>\n</html>\n```\n\
  \n![Image](img/red_circle-b.jpg) 使用自定义标记：\n\n1. 在列表或列表项目的规则中，输入 `list-style: none`\
  \ 关闭普通标记。\n2. 在列表规则中，设置 `margin-left` 和/或 `padding-left` 属性来规定列表项目的缩进。（这两个属性对于跨浏览器效果是必要的。）\
  \ `margin-left: 0` 和 `padding-left: 0` 会消除所有缩进。但如果你的内容是 `dirrtl`，你应该调整 `margin-right`\
  \ 和 `padding-right` 属性。参阅“创建有序和无序列表”关于 `dir`、`lang` 和从右向左语言的详细信息。\n3. 在列表内部的 `li`\
  \ 元素规则中，输入 `background: url(image.ext) repeat-type horizontal vertical;`，其中 `image.ext`\
  \ 是你想作为自定义标记的图像路径和文件名；`repeat-type` 是 `no-repeat`（典型的）、`repeat-x` 或 `repeat-y` 的值；`horizontal`\
  \ 和 `vertical` 是背景在列表项目中的位置值![Image](img/\n    background: url(arrow-right.png)\
  \ no-repeat 0 2px;\n    /* 推开文本为箭头留出空间 */\n    padding-left: 25px;\n}\n```\n\n**提示**\n\
  `url` 与左括号之间不应有空格![Image](img/gray-circle-b.jpg)。URL 周围的引号是可选的。\n\n\n\n\n\n注意，相对\
  \ URL 是相对于样式表的位置，而不是 Web 页面的位置。\n\n**提示**\n如果你想对列表中的某些列表项应用自定义标记，可以为一个或多个 `li` 元素应用类，并为其定义样式规则。根据所需的样式，你可能需要调整\
  \ `li` 的左外边距（margin），而不是父元素 `ol` 或 `ul` 的外边距和内边距。\n\n**提示**\n显示自定义标记的另一种方法是使用 `list-style-image`\
  \ 属性。例如：`li { list-style-image: url(image.png); };` 但它并没有完全达到预期，因为浏览渲染并不一致。此外，你可以通过\
  \ ![Image](img/gray-b.jpg) 所示的方法更好地控制标记的位置，这也是人们倾向于使用该方法的原因。`list-style-image` 属性覆盖\
  \ `list-style-type`。但由于某些原因图像无法加载，则会使用 `list-style-type` 指定标记。\n\n### 控制标记悬挂位置\n\
  \n默认情况下，列表相对于父元素的左边距缩进。你的标记可以位于起始点的右侧 ![Image](img/red_circle-a.jpg)（这是默认值），也可以与文本对齐（称为\
  \ inside ![Image](img/gray-b.jpg) 和 ![Image](img/circle-c.jpg)）。\n\n![Image](img/red-circle-a.jpg)\
  \ 这一图演示了浏览器默认如何相对于标记渲染文本。标记位于内容外部（outside）。你可以通过 CSS 更改这一点 ![Image](img/red-circle-b.jpg)\
  \ 所示。\n\n![Image](img/15_06.jpg)\n\n![Image](img/red-circle-b.jpg) 将 `list-style-position`\
  \ 设置为 `inside` 会改变显示效果。\n\n```css\nli {\n    list-style-position: inside;\n}\n```\n\
  \n![Image](img/red-circle-c.jpg) 行的标记从列表项的左外边距开始，而不是悬挂在其左侧 ![Image](img/15_07.jpg)。\n\
  \n### 控制标记悬挂位置\n\n1. 在所需列表或列表项的样式表规则中输入 `list-style-position:`。\n2. 输入 `inside`\
  \ 使标记与列表项文本对齐 ![Image](img/gray-b.jpg)；或者输入 `outside` 使标记位于列表项文本的左侧（默认）。\n\n**提示**\n\
  默认情况下，标记悬挂在段落外部。\n\n**提示**\n`list-style-position` 属性是可以继承的。\n\n### 一次设置所有列表样式属性\n\
  \n正如背景、边框、字体等有简写属性一样，CSS 也有一个 `list-style` 属性 ![Image](img/red-a.jpg) 。该样式规则等同于将\
  \ `list-style-position` 设置为 `inside` 并将 `list-style-type` 设置为 `circle`。它更加简洁。你也可以在简写中指定\
  \ `list-style-image`。\n\n```css\nli {\n    list-style: inside circle;\n}\n```\n\n\
  ![Image](img/red-circle-b.jpg) 结果与“控制悬挂位置”中的 ![Image](img/gray-c.jpg) 相同，我将标记切换成了圆形\
  \ ![Image](img/15_08.jpg)。\n\n#### 设置所有列表样式属性\n\n1. 输入 `list-style:`。\n2. 如果需要，指定列表项旁边应显示的标记类型（如果有的话，见“选择标记”）。\n\
  3. 如果需要，指定用于列表项的自定义标记（见“使用自定义标记”）。\n4. 如果需要，指定标记标记应悬挂在段落外部还是与文本对齐（见“控制悬挂位置”）。\n\n\
  **提示**\n如果你想在简写属性中指定 `list-style-image`，那么 ![Image](img/gray-a.jpg) 中的示例应写为 `li\
  \ { list-style: url(arrow-right.png) inside square; };`。\n\n**提示**\n你可以指定任何或全部 `list-style`\
  \ 属性 ![Image](img/gray-a.jpg) 展示了两种。\n\n**提示**\n你可能认为省略这三个属性之一不会影响它，但情况并非总是如此。任何未显式设置的属性都会恢复到默认值（`list-style-type`\
  \ 为 `disc`，`list-style-image` 为 `none`，`list-style-position` 为 `outside`）。\n\n**提示**\n\
  属性可以以任何顺序指定。\n\n**提示**\n`list-style` 属性是可以继承的。\n\n### 列表样式化\n\n将一种列表插入另一种列表中；内部列表被称为*嵌套列表*。你可以对有序列表和无序列表执行此操作（合并或独立进行）。还有另一种类型的嵌套列表；参见“创建列表”获取示例。嵌套列表对于结构化为有序列表的大纲特别有用——你可能需要多个层级的项目\
  \ ![Image](img/red-a.jpg) 到 ![Image](img/red-c.jpg)——或者对于结构化为无序列表的子菜单导航 ![Image](img/red-d.jpg)\
  \ 和 ![Image](img/red-e.jpg)；详情请参侧栏）。如示例所示，你可以以多种方式对嵌套列表设置样式 ![Image](img/red-a.jpg)。这里有嵌套列表，一个在\
  \ Introduction 中，一个在 Development 中，一个在 Climax 中并加粗，且位于“Boy gives ultimatum”项目内部（即在\
  \ Climax 列表内）。\n\n```html\n<body>\n<h1>The Great American Novel</h1>\n<ol>\n   \
  \ <li>Introduction\n      <ol>\n        <li>Boy's childhood</li>\n        <li>Girl's\
  \ childhood</li>\n      </ol>\n    </li>\n    <li>Development\n      <ol>\n    \
  \    <li>Boy meets Girl</li>\n        <li>Boy and Girl fall in love</li>\n     \
  \   <li>Boy and Girl have fight</li>\n      </ol>\n    </li>\n    <li>Climax\n \
  \     <ol>\n        <li>Boy gives ultimatum\n          <ol>\n            <li>Girl\
  \ can't believe her ears</li>\n            <li>Boy is indignant at Girl's indignance</li>\n\
  \          </ol>\n        </li>\n        <li>Girl tells Boy to get lost</li>\n \
  \     </ol>\n    </li>\n    <li>Denouement</li>\n    <li>Epilogue</li>\n</ol>\n\
  </body>\n```\n\n**提示**\n![Image](img/red-b.jpg) 你可以单独格式化列表的每一层。如果你对列表字体大小使用 em 或百分比，请确保添加\
  \ `li li { font-size: 1em; }`（使用 100% 代替 1em），以免它在嵌套列表中缩小到无法阅读（见最后一个提示）。\n\n```css\n\
  ol li {\n    font-size: .75em;\n    list-style-type: upper-roman;\n}\nol ol li {\n\
  \    list-style-type: upper-alpha;\n}\nol ol ol li {\n    list-style-type: decimal;\n\
  }\nli li {\n    font-size: 1em;\n}\n```\n\n![Image](img/red-c.jpg) 第一级列表（ol li）使用大写罗马数字。第二级列表（ol\
  \ ol li）使用大写字母。第三级列表（ol ol ol li）使用阿拉伯数字![Image](img/15_09.jpg)。\n\n\n\n\n\n###\
  \ 3. 对于三级列表，输入 `toplevel 2ndlevel 3rdlevel li {style_rules}`，其中 `toplevel` 和 `2ndlevel`\
  \ 与步骤 1 和步骤 2 中使用的值匹配，`3rdlevel` 是用于第三层嵌套列表的列表类型。\n\n### 4. 对每个你想要样式的嵌套列表继续按照此方法操作。\n\
  \n![Image](img/red_circle-d.jpg) 这里是嵌套列表的另一个示例。在这种情况下，导航菜单被结构为一个无序列表，其中包含两个嵌套的无序列表用于子导航。注意，每个嵌套的\
  \ `ul` 都包含在它的父级起始标签 `<li>` 和结束标签 `</li>` 之间。通过少量 CSS，你可以让导航水平布局，默认隐藏子菜单，并根据访问者的交互来显示它们\
  \ ![Image](img/gray_circle-e.jpg)。\n\n```html\n<body>\n<nav role=\"navigation\"\
  >\n    <ul class=\"nav\">\n        <li><a href=\"/\">Home</a></li>\n        <li><a\
  \ href=\"/products/\">Products</a>\n            <ul>\n                <li><a href=\"\
  /products/phones.html\">Phones</a></li>\n                <li><a href=\"/products/accessories.html\"\
  >Accessories</a></li>\n            </ul>\n        </li>\n        <li><a href=\"\
  /support/\">Support</a>\n            <ul>\n                <li><a href=\"http://www.thephoneycompany.com/support/forum/\"\
  >Community Forum</a></li>\n                <li><a href=\"/support/contact-us.html\"\
  >Contact Us</a></li>\n                <li><a href=\"/support/how-to-guides.html\"\
  >How-to Guides</a></li>\n            </ul>\n        </li>\n        <li><a href=\"\
  /about-us/\">About Us</a></li>\n    </ul>\n</nav>\n</body>\n```\n\n![Image](img/red_circle-e.jpg)\
  \ 产品（Products）和支持（Support）列表项都包含嵌套在 `ul` 中的子菜单，但由于我所应用的 CSS，它们默认都不显示。在这种情况下，支持子菜单之所以显示，是因为我悬停在了包含了“支持”链接和相关子菜单嵌套列表的\
  \ `li` 上 ![Image](img/gray_circle-d.jpg)。完整的 CSS 可以在书籍网站找到。\n\n![Image](img/15_10.jpg)\n\
  \n**提示**：你的选择器应该反映文档中嵌套列表的类型；也就是说你可能需要类似 `ul ul ol li` 的内容。\n\n**提示**：或者，你可以为每个嵌套列表添加一个类并对其进行相应的样式处理。但这里显示的方法允许你在不更改\
  \ HTML 的情况下控制样式。\n\n**提示**：有序列表默认使用阿拉伯数字（1, 2, 3），无论它们的嵌套位置如何。使用 `list-style-type`\
  \ 来指定其他的编号方案（参见“选择你的项目标记”）。根据《芝加哥格式规范》，列表正确的嵌套顺序是 I, A, 1, a（从那时起重复 1 和 a 级级）。\n\
  \n**提示**：默认情况下，无序列表的第一层将具有实心圆点符号，下一层将具有空心圆点，第三层及后续层将具有正方形符号。同样，使用 `list-style-type`\
  \ 来指定你想要的符号类型（参见“选择你的项目标记”）。\n\n**提示**：由于列表项（`li` 元素）可以嵌套在其他列表项中，你在指定相对值的字体大小时需要稍微小心。如果你使用类似\
  \ `li {font-size: .75em; }`，最外层列表项的字体大小将是父级的 75%；如果父级是默认的 16 像素，最外层列表项将是 12 像素，这没有问题。然而，第一个嵌套项的字体大小将是其父级（第一个列表项，12\
  \ 像素）的 75%，因此仅为 9 像素。每一层都会迅速变差。一种解决方案是添加 `li {font-size: 1em; }` ![Image](img/gray_circle-b.jpg)（或用\
  \ 100% 代替 1em）。现在列表项的大小将始终与顶层项相同 ![Image](img/gray_circle-c.jpg)。（感谢 Eric Meyer，`www.meyerweb.com`）\n\
  \n### 使用嵌套列表制作导航\n\n嵌套列表的一个用途是构建下拉（或飞出式）菜单 ![Image](img/gray_circle-d.jpg)。你可以使用\
  \ CSS 对导航进行样式处理，使得每个子菜单仅在访问者悬停在父列表项上时显示 ![Image](img/gray_circle-e.jpg)，并在访问者移开时再次隐藏。你可以通过几种方法实现这种效果，但它总是涉及将\
  \ `:hover` 伪类作为显示子菜单的选择器的一部分。\n\n```css\n/* 子菜单的默认状态 */\n.nav ul {\n    left: -9999em;\
  \ /* 将子菜单移至屏幕外 */\n    position: absolute;\n    z-index: 1000;\n}\n\n/* 父级被悬停时子菜单的状态\
  \ */\n.nav li:hover ul {\n    display: block; /* 兼容旧版本 IE */\n    left: auto; /*\
  \ 将子菜单恢复自动布局 */\n}\n```\n\n在这种情况下，![Image](img/gray_circle-d.jpg) 显示了对应的 HTML。你需要更多的\
  \ CSS 来实现水平布局，移除列表项的符号，并根据需要调整呈现。完整的 HTML 和 CSS 可以在 `bruceontheloose.com/htmlcss/chapter-15/dropdown.html`\
  \ 找到。包含了一些注释用于飞出导航。\n\n### 创建描述列表\n\nHTML 提供了一种专门用于描述名称（术语）与值之间关联的列表。在 HTML5 中被称为描述列表（Description\
  \ Lists），在之前的版本中被称为定义列表。根据 HTML5 规范，“名称-值组可以是术语和定义、元数据和值、问题和答案，或任何名称-值数据。”每个列表包含在\
  \ `dl` 中，每个名称-值组有一个或多个 `dt` 元素（名称），后跟一个或多个 `dd` 元素（值）。red-circle-a.jpg 显示了一个基础的描述列表示例。除了通过简单的样式规则应用加粗\
  \ ![Image](img/red_circle-b.jpg)，它默认渲染为 ![Image](img/red_circle-c.jpg)。\n\n![Image](img/red_circle-a.jpg)\
  \ 是最基本的定义列表类型，每个 `dt` 与一个 `dd` 匹配。每个组之间有一个空行以提高代码的可读性。\n\n```html\n<body>\n<h1>恐怖电影传奇列表</h1>\n\
  <dl>\n    <dt>Boris Karloff</dt>\n    <dd>因在<cite>弗兰肯斯坦</cite>及相关恐怖电影中的角色而闻名，这位恐怖大师的真名叫\
  \ William Henry Pratt。</dd>\n    <dt>Christopher Lee</dt>\n    <dd>李在多部锤子恐怖经典中饰演德古拉，令观众大快快。</dd>\n\
  \    ...\n</dl>\n</body>\n```\n\n![Image](img/red_circle-b.jpg) 你可能想对 `dt` 元素中的术语进行格式化以便突出显示\
