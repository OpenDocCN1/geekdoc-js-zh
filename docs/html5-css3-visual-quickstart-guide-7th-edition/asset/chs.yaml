  ### 将文件传输到服务器\n\n# 引言\n无论你是刚刚开始构建网站的事业，还是已经构建过一些网站但想确保自己的知识与时同步，你都处于这个行业一个非常令人兴奋的时刻。\n\
  \n\n\n\n\n# 引言\n\n过去几年间，我们编写代码和设计页面的方式、浏览页面的浏览器以及查看浏览器的设备都取得了显著进步。曾经我们只能通过台式机或笔记本电脑浏览网页，如今我们可以随身携带网络，在任何设备上使用：手机、平板电脑，当然还有笔记本电脑和台式机，等等。\n\
  \n这本应如此，因为网络一直以来的承诺就是打破边界——从任何大都市、乡村社区或介于两者之间的任何地方，通过任何联网设备自由分享和获取信息。简而言之，网络的承诺在于其普遍性。随着技术逐渐渗透到曾经被隔绝的社区，网络的影响力也在持续扩大。\n\
  \n更让网络伟大的是，任何人都可以自由创建和发布网站。本书将教你如何做到这一点。它非常适合对 HTML 或 CSS 一无所知、想要开始创建网页的初学者。你将找到清晰易懂的指导，逐步带你完成创建页面的过程。最后，本书也是一本方便随时查阅的指南。你可以通过目录或索引查找主题，只查阅你需要更多信息的那些内容。\n\
  \n## HTML 与 CSS 简介\n\n网络成功的根基是一种简单、基于文本的标记语言，它易于学习，任何具备基本浏览器的设备都能读取：这就是 HTML。每个网页至少需要一些\
  \ HTML；没有它，就不能称之为网页。\n\n随着你深入学习本书，你将更详细地了解到，HTML 用于定义内容的含义，而 CSS 用于定义内容和网页的外观。HTML\
  \ 页面和 CSS 文件（*样式表*）都是文本文件，易于编辑。你可以在本引言末尾附近的“本书工作原理”中看到 HTML 和 CSS 的片段。\n\n你将在第 1\
  \ 章中立即开始学习基本的 HTML 页面，并在第 7 章中开始学习如何用 CSS 设计页面样式。有关所有章节的概述和涵盖主题的总结，请参阅“本书将教你什么”。\n\
  \n### 什么是 HTML5？\n\n为了理解 HTML5，了解一些 HTML 的起源基础知识会有所帮助。HTML 始于 20 世纪 90 年代初，当时是一份简短的文档，详细描述了一组用于构建网页的元素。其中许多元素用于描述网页内容，如标题、段落和列表。随着语言的发展，引入了其他元素并调整了规则，HTML\
  \ 的版本号也随之增加。当前最新版本是 HTML5。\n\nHTML5 是早期 HTML 版本的自然演进，力求反映当前和未来网站的需求。它继承了其前身的大部分特性，这意味着如果你在\
  \ HTML5 出现之前就已经编写过 HTML，那么你已经掌握了很多 HTML5 知识。这也意味着 HTML5 的大部分功能在旧版和新版浏览器中都能正常工作；向后兼容是\
  \ HTML5 的关键设计原则（参见[`www.w3.org/TR/html-design-principles/`](http://www.w3.org/TR/html-design-principles/)）。\n\
  \nHTML5 还增加了大量新功能。许多功能很直观，例如用于描述内容的额外元素（article、section、figure 等）。其他功能则相当复杂，有助于创建强大的\
  \ Web 应用程序。你需要扎实掌握创建网页的技能，才能进一步学习 HTML5 提供的更复杂功能。HTML5 还引入了原生音频和视频播放功能，本书也会介绍。\n\
  \n### 什么是 CSS3？\n\nCSS 的第一个版本直到 HTML 出现几年后才问世，于 1996 年正式成为标准。与 HTML5 及其与早期 HTML\
  \ 版本的关系类似，CSS3 是其之前 CSS 版本的自然延伸。\n\nCSS3 比早期版本的 CSS 更强大，引入了许多视觉效果，如投影、文字阴影、圆角和渐变。（有关涵盖内容的详细信息，请参阅“本书将教你什么”）。\n\
  \n### 网络标准与规范\n\n你可能想知道最初是谁创建了 HTML 和 CSS，以及谁在继续推动它们的发展。万维网联盟（W3C）——由网络和 HTML 的发明者蒂姆·伯纳斯-李领导——是负责引导网络标准发展的组织。*规范*（或简称*规范*）是定义\
  \ HTML 和 CSS 等语言参数的文档。换句话说，规范标准化了规则。关注 W3C 的活动，请访问[`www.w3.org`](http://www.w3.org)\
  \ ![图片](img/red_circle-a.jpg`)。\n\n![图片](img/red_circle-a.jpg`) W3C 网站是行业网络标准规范的主要来源。\n\
  \n![图片](img/intro_01_a.jpg`)\n\n出于多种原因，另一个组织——Web 超文本应用技术工作组（WHATWG，网址为[`www.whatwg.org`](http://www.whatwg.org)）——正在制定\
  \ HTML5 规范。W3C 将 WHATWG 的工作纳入其官方版本的进行中规范。\n\n有了标准，我们就可以根据公认的规则集构建页面，而浏览器——如 Chrome、Firefox、Internet\
  \ Explorer（IE）、Opera 和 Safari——也可以根据这些规则来显示我们的页面。（总体而言，浏览器对标准的实现情况良好。旧版 IE，尤其是 IE6，存在一些问题。）\n\
  \n规范在最终定稿之前会经历多个开发阶段，此时它们被称为*推荐标准*（[`www.w3.org/2005/10/Process-20051014/tr`](http://www.w3.org/2005/10/Process-20051014/tr)）。\n\
  \nHTML5 和 CSS3 规范的部分内容仍在最终确定中，但这并不意味着你不能使用它们。标准化过程需要时间（实际上需要数年）才能完成。浏览器在规范成为推荐标准之前很久就开始实现其功能，因为这本身也为规范开发过程提供了信息。因此，尽管\
  \ HTML5 和 CSS3 尚未成为推荐标准，但浏览器已经包含了其中的大量功能。\n\n总体而言，本书涵盖的功能在其各自规范中已经根深蒂固，因此它们在成为推荐标准之前发生变化的可能性很小。开发人员已经使用许多\
  \ HTML5 和 CSS3 功能一段时间了。你也可以。\n\n## 渐进增强：一种最佳实践\n\n我在引言开头提到了网络的普遍性——即网络上的信息应该对所有人可访问。*渐进增强*帮助你以普遍性为理念构建网站。它不是一种语言，而是\
  \ Steve Champeon 在 2003 年创建的一种构建网站的方法（[`http://en.wikipedia.org/wiki/Progressive_enhancement`](http://en.wikipedia.org/wiki/Progressive_enhancement)）。\n\
  \n这个想法简单但强大：从对所有访问者都可访问的 HTML 内容和行为开始构建你的网站 ![图片](img/red_circle-a.jpg`)。在*同一*页面上，用\
  \ CSS 添加设计 ![图片](img/red_circle-b.jpg`)，并用 JavaScript 添加额外行为，通常从外部文件加载它们（你将学习如何做到这一点）。\n\
  \n![图片](img/red_circle-a.jpg`) 一个没有应用自定义 CSS 的基本 HTML 页面。这个页面可能看起来不怎么样，但信息是可访问的——这才是重要的。即使是\
  \ 20 多年前网络诞生之初的浏览器也能显示这个页面；同样，最古老的带浏览器的手机也能做到。而*屏幕阅读器*——一种为视障访问者朗读网页内容的软件——也能轻松浏览它。\n\
  \n![图片](img/intro_02_a.jpg`)\n\n\n\n\n\n![Image](img/red_circle-b.jpg) 这是在支持 CSS\
  \ 的浏览器中看到的同一个页面。信息相同，只是呈现方式不同。使用更强大的设备和浏览器的用户在访问该页面时，将获得增强体验。\n\n![Image](img/intro_03_b.jpg)\n\
  \n结果是，能够访问基础页面的设备和浏览器将获得简化的默认体验；而能够查看更健壮网站的设备和浏览器将看到增强版本。你的网站体验并不一定对所有人都是相同的，只要你的内容是可访问的。从本质上说，渐进增强的核心思想是大家共赢。\n\
  \n本书将教你如何构建渐进式增强的网站，即使在构建过程中并不总是显式地指出这一点。这是书中传授的最佳实践的自然结果。\n\n然而，第 12 章和第 14 章确实直接讨论了渐进式增强。如果你感兴趣，可以先预览这些章节，看看渐进增强原则如何帮助你构建一个根据设备屏幕尺寸和浏览器能力调整布局的网站，或者旧版浏览器如何显示简化版的设计，而现代浏览器如何显示经\
  \ CSS3 效果增强后的设计。\n\n渐进增强是为所有人构建网站的核心最佳实践之一。\n\n### 这本书适合你吗？\n\n本书假设读者没有构建网站的先验知识。因此，从这个意义上来说，它是面向绝对初学者的。你将从零学习\
  \ HTML 和 CSS。在此过程中，你还将学习 HTML5 和 CSS3 中的新功能，并重点介绍设计师和开发人员在日常工作中使用的功能。\n\n但即使你*已经*熟悉\
  \ HTML 和 CSS，你仍然可以从书中受益，特别是如果你想跟上 HTML5、CSS3 以及最佳实践的许多最新进展的话。\n\n#### 本书将教你什么\n\n\
  自上一个版本以来，我们在书中增加了约 125 页的内容，以便尽可能为你提供更多材料。（本书的第一版于 1996 年出版，*总共*只有 176 页。）我们还对几乎每一个之前的页面进行了实质性的更新（或进行了完全的重写）。简而言之，这第七版代表了一次重大修订。\n\
  \n章节结构如下：\n\n- 第 1 章到第 6 章以及第 15 章到第 18 章涵盖创建 HTML 页面的原则以及你可以使用的 HTML 元素范围，清晰地演示了何时以及如何使用每一个元素。\n\
  - 第 7 章到第 14 章深入探讨 CSS，从创建第一个样式规则到使用 CSS3 应用增强视觉效果。\n- 第 19 章向你展示如何向页面添加预编写的 JavaScript。\n\
  - 第 20 章告诉你在发布到 Web 之前如何进行测试和调试。\n- 第 21 章解释了如何保护你的域名，然后将网站发布到 Web 上供所有人看到。\n\n\
  扩展来看，一些主题包括：\n\n- 创建、保存和编辑 HTML 和 CSS 文件。\n- 编写语义化 HTML 的含义以及它为什么很重要。\n- 如何将页面的内容（即\
  \ HTML）与其呈现形式（即 CSS）分离——这是渐进增强的关键方面。\n- 使用已存在多年的 HTML 元素和 HTML5 中的新元素以有意义的方式结构化你的内容。\n\
  - 使用 ARIA 地标角色和其他良好的编码实践改进网站的访问性。\n- 在页面中添加图像并针对 Web 对其优化。\n- 从一个 Web 页面链接到另一个页面，或从页面的一个部分链接到另一个部分。\n\
  - 文本样式化（大小、颜色、粗体、斜体等）；添加背景颜色和图像；以及实现可以缩小和扩展以适应不同屏幕尺寸的流式多列布局。\n- 利用 CSS3 中的新选择器，允许你比以前更广泛的方式定位样式。\n\
  - 学习如何处理移动设备访问者的方案。\n- 基于响应式 Web 设计的许多原则（某些利用了 CSS3 媒体查询），为所有用户构建单一网站——无论他们使用的是手机、平板电脑、笔记本电脑、桌面计算机或其他支持\
  \ Web 设备。\n- 使用 `@font-face` 在页面中添加自定义 Web 字体。\n- 使用 CSS3 效果，如不透明度、背景 Alpha 透明度、渐变、圆角、投影、元素内投影、文本阴影和多个背景图像。\n\
  - 构建表单以收集访问者的输入，包括使用 HTML5 中的一些新表单输入类型。\n- 使用 HTML5 的 `audio` 和 `video` 元素在页面中包含媒体。\n\
  \n以及更多。\n\n这些主题由几十个代码示例补充，这些示例向你展示如何根据行业最佳实践来实现这些功能。\n\n#### 本书*不会*教你什么\n\n遗憾的是，尽管自上一个版本以来增加了这么多页面，但在\
  \ HTML 和 CSS 方面有太多内容可以说了了，我们不得不忽略某些主题。\n\n除少数例外外，我们坚持省略了你可能不需要的项目。\n\n未涵盖的主题包括：\n\
  \n- HTML5 `details`, `summary`, `menu`, `command` 和 `keygen` 元素。\n- HTML5 `canvas`\
  \ 元素（允许你使用 JavaScript 绘制图形甚至创建游戏）。\n- HTML5 API 以及其他与 JavaScript 直接相关的新的语义 HTML\
  \ 元素。\n- CSS 雪碧图（sprites）。这种技术涉及将多个图像合并到一张图中，有助于减少页面加载的资源数量。请参阅 [bruceontheloose.com/sprites/](http://bruceontheloose.com/sprites/)\
  \ 获取更多信息。\n- CSS 图像替换。这些技术通常与雪碧图配合使用。请参阅 [bruceontheloose.com/ir/](http://bruceontheloose.com/ir/)\
  \ 获取更多信息。\n- CSS3 变换、动画和过渡。\n- CSS3 的新布局模块。\n\n### 本书如何运作\n\n书中几乎每个章节都包含了代码示例，演示了实际用法（![Image](img/red_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-b.jpg)）。通常，它们会配有截图，显示你在浏览器中查看 Web 页面的结果 ![Image](img/red_circle-c.jpg)。\n\
  \n![Image](img/red_circle-a.jpg) 你会在许多页面找到 HTML 代码片段，并突出显示关键部分。省略号 (...) 表示为了简洁而省略的代码或内容。通常，省略的部分会在另一个代码图图中显示。\n\
  \n---\n\n```html\n...\n<body>\n<header role=\"banner\">\n     ...\n       <nav role=\"\
  navigation\">\n          <ul class=\"nav\">\n             <li><a href=\"/\" class=\"\
  current\">home</a></li>\n             <li><a href=\"/about/\">about</a></li>\n \
  \            <li><a href=\"/resources/\">resources</a></li>\n             <li><a\
  \ href=\"/archives/\">archives</a></li>\n          </ul>\n       </nav>\n     ...\n\
  </header>\n...\n</body>\n</html>\n```\n\n---\n\n![Image](img/red_circle-b.jpg) 如果\
  \ CSS 代码与示例相关，它将显示在自己的框中，并突出显示关键部分。\n\n---\n\n```css\n/* 站点导航 */\n.nav li {\n  \
  \   float: left;\n     font-size: .75em; /* 让列表符号变小 */\n}\n.nav li a {\n     font-size:\
  \ 1.5em;\n}\n.nav li:first-child {\n     list-style: none;\n     padding-left: 0;\n\
  }\n```\n\n---\n\n\n\n\n![Image](img/red_circle-c.jpg) 某个或多个浏览器的截图展示了代码如何影响页面。\n\n\
  ![Image](img/intro_06_c.jpg)\n\n大部分截图都是当时发布的最新版本的 Firefox。然而，这并不意味着推荐 Firefox 优于任何其他浏览器。在\
  \ Chrome、Internet Explorer、Opera 或 Safari 的任何最新版本中，代码示例看起来都将非常相似。正如你将在第 20 章中所学习到的那样，在将页面发布到\
  \ Web 之前，你应该在各种浏览器中进行测试，因为你无法预知访问者会使用哪种浏览器。\n\n代码和截图均配有了对相关 HTML 元素或 CSS 属性的描述，既是为了为示例提供上下文，也是为了增加你对它们的理解。\n\
  \n在很多情况下，你可能会发现描述和代码示例足够让你开始使用 HTML 和 CSS 特性了。但如果你需要关于如何使用它们的显式指导，书中始终会分步骤的说明。\n\
  \n最后，大多数章节都包含提示，提供额外的用法信息、最佳实践、对书中相关部分的引用、指向相关资源的链接等。\n\n### 本书使用的约定\n\n本书使用了以下约定：\n\
  \n• *HTML* 一词是涵盖性的，泛指这种语言。在指代 HTML 的特定特定版本时，使用 *HTML5*，例如在讨论 HTML5 中新增而在之前的版本中不存在的特性时。同样的方法也适用于\
  \ *CSS*（通用）和 *CSS3*（特指 CSS3）术语的使用。\n\n• 作为你自行创建的值的占位符的文本或代码使用斜体表示。大多数占位符出现在分步骤说明中。例如，“或输入\
  \ `#rrggbb`，其中 `rrggbb` 是颜色的十六进制表示法。”\n\n• 你应该实际输入的代码或代表 HTML 或 CSS 代码将显示此字体。\n\n\
  • 代码图中的箭头（`→`）表示前一行的延续——该行为了适应书的列宽而换行了 ![Image](img/gray_circle-b.jpg)。箭头不是代码本身的一部分，因此它不是你需要输入的内容。相反，请连续地输入该行，就像它没有换行到另一行一样。\n\
  \n• 当一个单词被定义时，首次出现时会使用斜体。\n\n• *IE* 经常用作 *Internet Explorer*（互动浏览器）的常用缩写。例如，IE9\
  \ 等同于 Internet Explorer 9。\n\n• 每当浏览器版本号后跟着加号（+）时，它意味着列出的版本加上后续版本。例如，Firefox 8+\
  \ 指 Firefox 8 及其之后的所有版本。\n\n### 辅助网站\n\n本书的网站位于 [www.bruceontheloose.com/htmlcss/](http://www.bruceontheloose.com/htmlcss/)，包含目录、书中介绍的每一个完整代码示例（以及一些放不进书中额外示例）、书中引用的资源链接（以及额外的资源）、编写期间使用的参考信息、勘误列表等。\n\
  \n该网站还包含了参考章节（附录 A 和 B），这些内容在书中没有空间收录。这些内容对于快速查找 HTML 元素和属性，或 CSS 属性和值非常有用。（它们还包含一些书中未涵盖的信息）。\n\
  \n你可以在 [www.bruceontheloose.com/htmlcss/examples/](http://www.bruceontheloose.com/htmlcss/examples/)\
  \ 找到代码示例。你可以从那里浏览，也可以将它们下载到电脑上——所有的 HTML 和 CSS 文件都归你自由使用。\n\n在某些情况下，我在代码中加入了额外的注释，以进一步解释它的功能或如何使用。书中少数代码示例出于空间考虑被截断了，但完整版本位于书的网站上。请根据需要自由使用这些代码，并根据你自己的项目进行修改。\n\
  \n书中网站一些关键页面的 URL 如下如下：\n\n• 首页：[www.bruceontheloose.com/htmlcss/](http://www.bruceontheloose.com/htmlcss/)\n\
  \n• 代码示例：[www.bruceontheloose.com/htmlcss/examples/](http://www.bruceontheloose.com/htmlcss/examples/)\n\
  \n• 附录 A: HTML 参考：[www.bruceontheloose.com/ref/html/](http://www.bruceontheloose.com/ref/html/)\n\
  \n• 附录 B: CSS 属性和值：[www.bruceontheloose.com/ref/css/](http://www.bruceontheloose.com/ref/css/)\n\
  \n我希望你发现这个网站很有帮助。\n\n#### 视频培训\n\nVisual QuickStart Guides 现在更具视觉化了：在畅销的 Visual\
  \ QuickStart Guide 系列书籍成功的基础上，Peachpit 现在提供了 Video QuickStarts。作为本书的配套，Peachpit\
  \ 提供了一个多小时以任务为基础的短视频，这些视频将帮助你掌握 HTML5 的顶级特性和技术；你不仅仅是阅读如何使用 HTML5，还可以观看它的实际操作。这是学习\
  \ HTML5 所有基础知识以及一些较新或复杂特性的很好的方法。登录 [www.peachpit.com/register](http://www.peachpit.com/register)\
  \ 上的 Peachpit 网站注册你的书籍，你将发现一个免费的流媒体示例。\n\n\n\n\n\n注意：如引言所述，我使用 `HTML` 来泛指这门语言。当需要强调某个版本特有的特性时，我会使用具体的名称。例如，“`HTML5`\
  \ 引入了几个新元素，并重新定义或删除了 `HTML 4` 和 `XHTML 1.0` 中已有的其他元素。”更多细节请参阅引言中的“本书使用说明”。\n\n###\
  \ 一个基本的 HTML 页面\n\n让我们来看一个基本的 HTML 页面，以便为你理解本章及后续内容提供背景。图 ![Image](img/red_circle-a.jpg)\
  \ 展示了桌面浏览器通常如何渲染 ![Image](img/red_circle-b.jpg) 中的 HTML 代码。你将了解代码 ![Image](img/gray_circle-b.jpg)\
  \ 的一些基础知识，但如果你现在不能完全理解，也不必担心。这只是让你初步感受一下 `HTML`。你还有整本书的时间来深入学习。\n\n![Image](img/red_circle-a.jpg)\
  \ 页面的典型默认渲染效果。虽然这里显示的是 Firefox 浏览器中的效果，但其他浏览器中的显示也类似。\n\n![Image](img/01_01.jpg)\n\
  \n![Image](img/red_circle-b.jpg) 这是一个基本 HTML 页面的代码。我已将 HTML 部分高亮显示，以便你将其与页面的文本内容区分开来。如\
  \ ![Image](img/gray_circle-a.jpg) 所示，在浏览器中查看页面时，包围文本内容的 HTML 并不会显示。但正如你将学到的，这些标记至关重要，因为它们描述了内容的含义。另外请注意，每一行恰好用回车符分隔。这不是强制性的，也不会影响页面的渲染。\n\
  \n* * *\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
  utf-8\" />\n    <title>Blue Flax (Linum lewisii)</title>\n</head>\n<body>\n    <article>\n\
  \      <h1>The Ephemeral Blue Flax</h1>\n      <img src=\"blueflax.jpg\" width=\"\
  300\" height=\"175\" alt=\"Blue Flax (Linum lewisii)\" />\n      <p>I am continually\
  \ <em>amazed</em> at the beautiful, delicate <a href=\"http://en.wikipedia.org/wiki/Linum_lewisii\"\
  \ rel=\"external\" title=\"Learn more about Blue Flax\">Blue Flax</a> that somehow\
  \ took hold in my garden. They are awash in color every morning, yet not a single\
  \ flower remains by the afternoon. They are the very definition of ephemeral.</p>\n\
  \    </article>\n</body>\n</html>\n```\n\n* * *\n\n你可能已经猜到了代码中的一些内容，尤其是 body 部分。首先，我们来看看\
  \ body 之前的部分。\n\n`<body>` 开始标签之上的所有内容都是前面提到的为浏览器和搜索引擎提供的指令信息 ![Image](img/red_circle-c.jpg)。每个页面都以\
  \ `DOCTYPE` 声明开头，它告诉浏览器页面的 HTML 版本。\n\n![Image](img/red_circle-c.jpg) title 元素中的文本是\
  \ HTML 文档顶部区域中用户唯一能看到的部分。其余部分是关于页面的信息，供浏览器和搜索引擎使用。\n\n* * *\n\n```\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\" />\n    <title>The Ephemeral\
  \ Blue Flax (Linum lewisii)</title>\n</head>\n```\n\n* * *\n\n你应该始终使用 `HTML5` 的\
  \ `DOCTYPE`，即 `<!DOCTYPE html>`。文本的大小写无关紧要，但更常见的是使用全大写的 `DOCTYPE`。无论如何，请始终在页面中包含\
  \ `DOCTYPE`。（更多信息请参阅第 3 章中的边栏“HTML5 改进的 DOCTYPE”。）\n\n从 `<!DOCTYPE html>` 开始到 `</head>`\
  \ 结束的部分对用户是不可见的，只有一个例外：`<title>` 和 `</title>` 之间的文本——Blue Flax (Linum lewisii)——会显示在浏览器窗口最顶部的标题栏以及浏览器标签页上\
  \ ![Image](img/gray_circle-b.jpg)。此外，它通常是浏览器书签或收藏夹的默认名称，并且对搜索引擎来说也是宝贵的信息。第 3 章 解释了页面顶部区域其他部分的作用。\n\
  \n与此同时，页面的内容——即用户*确实*能看到的部分——位于 `<body>` 和 `</body>` 之间。最后，`</html>` 结束标签标志着页面的结束\
  \ ![Image](img/red_circle-d.jpg)。\n\n![Image](img/red_circle-d.jpg) 页面的内容存在于开始标签和结束标签之间。\n\
  \n* * *\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n...\n<body>\n...\n\
  </body>\n</html>\n```\n\n\n\n\n这是一个很好的问题。由于每个 Web 浏览器都内置了一个 CSS 文件（一个 `style sheet*`），它规定了每个\
  \ HTML 元素的默认显示方式，除非你创建了自己的样式表来覆盖它。默认显示方式在不同浏览器之间略有不同，但总来说是非常一致的。更重要的是，由你的 HTML 定义的内容的底层结构和含义保持不变。\n\
  \n## 块级元素、内联元素与 HTML5\n\n如你所见，某些 HTML 元素（例如 `article`、`h1` 和 `p`）像书籍中的段落一样单独占据一行，而另一些元素（例如\
  \ `a` 和 `em`）则与其他内容在同一行渲染 ![Image](img/gray_circle-b.jpg)。再次，这是浏览器默认样式规则的功能，而不是\
  \ HTML 元素本身的功能。允许我详细说明。在 HTML5 之前，大多数元素被归类为 `block-level`（块级，即单独占行的元素）或 `inline`（内联，即在文本行内显示的元素）。HTML5\
  \ 取消了这些术语，因为它们将元素与表现相关联，而你已经了解到这并不是 HTML 的职责。\n\n相反，通常情况下，以前被称为内联的元素在 HTML5 中被归类为\
  \ `phrasing content`（短语内容），即主要出现在段落内的元素及其包含的文本。（第 4 章几乎完全专注于短语内容。完整列表请参阅 [`dev.w3.org/html5/spec-author-view/content-models.html#phrasing-content-0`](http://dev.w3.org/html5/spec-author-view/content-models.html#phrasing-content-0)。）\n\
  \n旧的块级元素现在也属于 HTML5 中侧重于语义化的新类别。其中许多元素构成了你内容的主要结构块和标题（深入阅读 第 3 章 以了解更多关于分节内容和标题内容的元素）。\n\
  \n尽管如此，浏览器并没有改变这些元素的默认显示规则，也不应该改变。毕竟，你肯定不希望例如两个段落（`p` 元素）互相挤在一起，或者让 `em` 文本（“amazed”）通过单独成一行来打断句子（`em`\
  \ 是你用于添加强调的元素）。\n\n所以通常标题、段落和如 `article` 等结构化元素单独占据一行，而短语内容与周围内容在同一行显示。尽管 HTML5\
  \ 不再使用块级和内联这些术语，但了解它们的含义是有帮助的。教程中使用这些词很常见，因为它们在 HTML5 之前就已经根植于 HTML 术语中了。我可能会在书中偶尔使用这些词，以快速传达一个元素默认是单独占一行还是共享某一行。\n\
  \n我们将在后面的章节中详细介绍 CSS，但现在请知道样式表就像 HTML 页面一样只是文本，因此可以使用与 HTML 相同的文本编辑器创建它。\n\n## HTML5\
  \ 对语义的关注\n\nHTML5 强调 HTML 语义，将所有视觉样式留给 CSS。在早期的 HTML 版本中并不一直如此。\n\n在 Web 早期并不存在适当的页面样式方法；当\
  \ CSS1 在 1996 年 12 月正式引入时，HTML 已经存在了几年。为了填补这段空白，HTML 包含了一些表现元素，其目的是允许对文本进行基本样式设置，例如将其加粗、斜体或使用周围文本不同的字体。\n\
  \n这些元素在那个时代实现了其作用，但随着 Web 开发最佳实践的演进，它们理所当然地失去了宠。这种思维的核心是并仍然是——HTML 仅用于描述内容的含义，而不是它的显示方式。\n\
  \n表现性 HTML 元素破坏了这一最佳实践。因此，HTML 4 废弃了它们的使用，建议作者使用 CSS 来为文本和其他页面元素设置样式。\n\nHTML5 更进一步；它消除了一些表现元素并重新定义了其他元素，使其只携带语义价值，而不是规定表现。\n\
  \n`small` 元素就是这样一个例子。最初，它的目的是让文本比普通文本小。但在 HTML5 中，`small` 代表脚注，例如法律免责声明。如果你愿意，可以使用\
  \ CSS 让它成为页面上最大的文本，但这不会改变你的 `small` 内容含义。\n\n同时，`small` 的旧对手 `big` 元素在 HTML5 中不存在了。还有其他例子，你将在阅读这本书的过程中了解到。\n\
  \nHTML5 还定义了新元素，例如 `header`、`footer`、`nav`、`article`、`section` 以及许多丰富你内容语义的元素。你以后也会学习这些内容。\n\
  \n然而，无论你使用的是自语言诞生以来就存在的 HTML 元素还是 HTML5 中的新元素，你的目标都应该是：选择最能描述你内容含义的元素，而不考虑它们的表现形式。\n\
  \n## 我们基础 HTML 页面的语义\n\n现在你已经知道了 HTML 的角色，让我们深入研究一下标记示例内容背后的思维过程。正如你看到的，编写语义化 HTML\
  \ 并没有魔法。一旦你熟悉了可以使用的元素，这大部分都是常识。让我们回到基础页面的主体，体验一些最常用的 HTML 元素 ![Image](img/red_circle-c.jpg)。\n\
  \n![Image](img/red_circle-c.jpg) 我们基础页面的主体，包含了 `article`、`h1`、`img`、`p`、`em` 元素来描述内容。\n\
  \n\n\n\n段落是用——令人惊讶的——`p` 元素标记的 ![Image](img/red_circle-f.jpg)。就像印刷材料一样，一个段落可以包含一个句子或多个句子。如果我们的页面需要另一个段落，你只需要在第一个元素之后添加另一个\
  \ `p` 元素即可。\n\n![Image](img/red_circle-f.jpg) `p` 元素可以包含其他定义段落内短语语义的元素。`em` 和 `a`\
  \ 元素就是两个例子。\n\n<p>我不断对那些不知何生长在我花园里的、美丽而精致的<a href=\"http://en.wikipedia.org/wiki/Linum_lewisii\"\
  \ rel=\"external\" title=\"Learn more about Blue Flax\">亚亚麻（Blue Flax）</a>感到<em>惊讶</em>。它们每天早晨都色彩斑溢，但到了下午一朵花都不复了。它们是“转瞬即逝”的完美定义。</p>\n\
  \n在我们段落中，嵌套了两个定义文本片段含义的元素：`em` 和 `a` ![Image](img/gray_circle-f.jpg)。这些是 HTML5 提供的众多短语内容元素的示例，其中大多数改进了段落文本的语义。如所述，这些元素与\
  \ `p` 一样在第 4 章中进行了讨论。\n\n`em` 元素意味着“强调”。在我们页面中，它强调了花朵带来的惊讶感 ![Image](img/gray_circle-f.jpg)。记住，因为\
  \ HTML 描述的是内容的含义，所以 `em` 规定的是语义而非视觉强调，尽管用斜体渲染 `em` 文本很常见。\n\n最后，基础页面使用 `a` 元素（“锚点”）定义指向另一个页面的链接，这是\
  \ HTML 中最强大的元素，因为它让 Web 成为 Web：它将一个页面链接到另一个页面或资源，并将页面的一部分链接到页面的另一个部分（可以是同一页面或不同页面）。在示例中，它表示文本“Blue\
  \ Flax”是指向 Wikipedia 上页面的链接 ![Image](img/red_circle-g.jpg)。\n\n![Image](img/red_circle-g.jpg)\
  \ 这个 `a` 元素定义了指向关于亚亚麻的 Wikipedia 页面的链接。可选的 `rel` 属性通过指示链接指向另一个站点来增加语义。不过即使没有它链接也能正常工作。可选的\
  \ `title` 属性通过提供有关链接页面的信息增强了 `a` 的语义。当用户将鼠标悬停在链接上时，它会出现在浏览器中。\n\n<a href=\"http://en.wikipedia.org/wiki/Linum_lewisii\"\
  \ rel=\"external\" title=\"Learn more about Blue Flax\">亚亚麻（Blue Flax）</a>\n\n很简单，对吧？一旦你学习了更多可用的\
  \ HTML 元素，为你的内容选择正确的元素通常是一项简单的任务。偶尔，你会遇到一段可以合理地以多种方式标记的内容，这没关系。并不是总有绝对对错之分，只是大多数时候确实如此。\n\
  \n最后，HTML5 并没有尝试为可以想象的每种内容类型提供元素，否则语言会变得臃肿。相反，它采取了务实的现实态度，定义了涵盖绝大多数情况的元素。\n\nHTML\
  \ 的美之处在于，任何人都可以学习基础知识，构建一些页面，并在此基础上增长知识。所以，尽管大约有 100 个 HTML 元素，但不要被这个数字吓到。你会发现自己会反复使用少数核心元素，而其余元素则留给了不常见的情况。你已经学习了几个常用元素的基础知识，所以你正走在正确的道路上。\n\
  \n## 为什么语义化很重要\n\n现在你已经知道了语义化 HTML 的重要性并看到了它的实际应用，你需要知道它*为什么*重要的原因。\n\n以下是一些最重要的原因（这并不是一个详尽的列表），其中我们已经提到过了一些：\n\
  \n- 提高可访问性和互操作性（内容对于残障访问者的辅助技术，以及对于桌面、移动、平板和其他设备的浏览器均可用）\n- 提高搜索引擎优化 (SEO)\n- （通常）代码更轻、页面加载更快\n\
  - 更容易代码维护和样式设置\n\n如果你不熟悉*可访问性*（accessibility），它是指让你的内容对所有用户可用，无论他们的能力如何（参见 [www.w3.org/standards/webdesign/accessibility](http://www.w3.org/standards/webdesign/accessibility)）。Web\
  \ 的发明者蒂姆·伯纳斯-李曾著名地说：“Web 的力量在于它的通用性。无论是否有残障，每个人都能访问是至关重要的一方面。”\n\n任何带有浏览器的设备都能显示\
  \ HTML，因为它仅仅是文本。然而，用户访问内容的方式可能有所不同。例如，视力用户查看内容，而视障用户可能会增大页面或字体大小，或使用屏幕阅读器（一种向他们朗读内容的软件，辅助技术）。在某些情况下，屏幕阅读器会宣布内容周围的\
  \ HTML 元素类型，以便为用户提供后续内容的上下文。例如，在朗读各个列表项之前，系统会告知用户遇到了列表。同样，当遇到链接时，系统会告知用户，以便他们决定是否点击。\n\
  \n屏幕阅读器用户可以通过多种方式导航页面，例如通过键盘命令从一个标题跳转到下一个标题。这允许他们获取页面的关键主题，并更详细地听他们感兴趣的内容，而不是必须听整个页面。\n\
  \n## 标记：元素、属性和值\n\n现在你已经看到了一些 HTML，让我们仔细观察构成标记的内容。\n\nHTML 有三个主要的标记组件：*元素、属性和值*。你已经在基础页面中见过每种元素的示例。\n\
  \n### 元素\n\n元素就像小标签，描述了 Web 页面的不同部分：“这是一个标题，那里是一个段落，而那组链接是导航”。我们在上一节讨论了几个元素。某些元素具有一个或多个属性，进一步描述了元素的目的和内容（如果有）。\n\
  \n元素可以包含文本和其他元素，也可以为空。非空元素由*起始标签*（元素名称和属性，如果有的话，包含在小于和大于符号内）、内容和*结束标签*（正斜杠后跟元素名称，再次包含在小于和大于符号内）组成\
  \ ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg) 这是一个典型的 HTML\
  \ 元素。*起始标签*和*结束标签*围绕着元素所描述的文本。在这种情况下，由于 em 元素，“惊讶”一词被强调。习惯上将元素标签写小写。\n\n![Image](img/01_03.jpg)\n\
  \n*空元素*（也称为空元素）看起来像是起始和结束标签的组合，开头有一个小于符号、元素名称以及它可能具有任何属性、一个可选的空格、可选的正斜杠和一个最后的大于符号（这是必须的\
  \ ![Image](img/red_circle-b.jpg)。\n\n\n\n\n\n# HTML 元素与文档结构\n\n## 空元素\n\n![Image](img/red_circle-b.jpg)\
  \ 空元素（如这里所示的 img）不包含任何文本内容（alt 属性文本是元素的一部分，而非被元素包围）。它们只有一个标签，同时起到打开和关闭元素的作用。末尾的空格和斜杠在\
  \ HTML5 中是可选的，但通常都会包含它们。不过，结束元素的 `>` 是必需的。\n\n![Image](img/013fig00.jpg)\n\n空元素末尾的空格和斜杠在\
  \ HTML5 中是可选的。可以说，那些之前使用 XHTML（要求用斜杠关闭空元素）编码的人，在 HTML5 中也倾向于使用它，当然也有其他人放弃了它。我在代码中会包含它，但如果你选择省略，页面的表现将完全相同。无论你选择哪种方式，我建议保持一致。\n\
  \n习惯上，元素名称全部使用小写字母，尽管 HTML5 对此并不挑剔，也允许使用大写字母。然而，如今很少有人使用大写字母编码，除非你内心的叛逆无法抗拒，否则我不推荐这样做。这被视为一种过时的做法。\n\
  \n### 属性与值\n\n属性包含文档中内容的相关信息，而非内容本身（![Image](img/red_circle-c.jpg) 和 ![Image](img/red_circle-d.jpg)）。在\
  \ HTML5 中，属性的值可以选择用引号括起来，但习惯上会包含引号，因此我建议你始终这样做。与元素名称一样，我建议属性名称也使用小写字母。\n\n![Image](img/red_circle-c.jpg)\
  \ 这是一个 label 元素（将文本标签与表单字段关联），带有一个简单的属性-值对。属性始终位于元素的开始标签内。习惯上用引号将它们括起来。\n\n![Image](img/01_04.jpg)\n\
  \n![Image](img/red_circle-d.jpg) 某些元素（如这里所示的 a）可以包含一个或多个属性，每个属性都有自己的值。顺序不重要。每个属性-值对之间用空格分隔。\n\
  \n![Image](img/01_05.jpg)\n\n虽然你会在本书中找到大多数属性可接受值的详细信息，但让我先给你一个概念，了解随着学习深入你会遇到哪些类型的值。\n\
  \n有些属性可以接受任何值，而另一些则更受限制。最常见的可能是那些接受枚举值或预定义值的属性。换句话说，你必须从标准选项列表中选择一个值（![Image](img/red_circle-e.jpg)）。请确保枚举值全部使用小写字母。\n\
  \n![Image](img/red_circle-e.jpg) 有些属性只接受特定值。例如，link 元素中的 media 属性可以设置为 `all`、`screen`\
  \ 或 `print` 等，但你不能像对待 title 属性那样随意编造一个值。\n\n![Image](img/01_06.jpg)\n\n许多属性要求其值为数字，尤其是描述大小和长度的属性。数字值从不包含单位，只有数字。在适用单位的情况下（如图像或视频的宽度和高度），默认单位为像素。\n\
  \n有些属性（如 `href` 和 `src`）引用其他文件，因此其值必须采用 URL（统一资源定位符）的形式，即文件在 Web 上的唯一地址。你将在本章的“URL”部分了解更多关于\
  \ URL 的内容。\n\n### 父元素与子元素\n\n如果一个元素包含另一个元素，则前者被视为被包含元素（即子元素）的父元素。子元素中包含的任何元素都被视为外层父元素的后代（![Image](img/red_circle-f.jpg)）。实际上，你可以为网页创建一个家族树，显示页面上每个元素之间的层级关系，并唯一标识每个元素。\n\
  \n![Image](img/red_circle-f.jpg) article 元素是 h1、img 和 p 元素的父元素。反之，h1、img 和 p 元素是\
  \ article 的子元素（也是后代）。p 元素是 em 和 a 元素的父元素。em 和 a 是 p 的子元素，同时也是 article 的后代（但不是子元素）。而\
  \ article 是它们的祖先。\n\n```html\n<article>\n   <h1>The Ephemeral Blue Flax</h1>\n \
  \  <img src=\"blueflax.jpg\"... />\n   <p>... continually <em>amazed</em> ... delicate\
  \ <a ...>Blue Flax</a> ...</p>\n</article>\n```\n\n这种底层的类家族树结构是 HTML 代码的一个关键特性。它有助于对元素进行样式化（你将在第\
  \ 7 章中开始学习）以及应用 JavaScript 行为。\n\n需要注意的是，当元素包含其他元素时，每个元素必须正确嵌套，即完全包含在其父元素内。每当你使用结束标签时，它应该对应最后一个未闭合的开始标签。换句话说，先打开元素\
  \ 1，再打开元素 2，然后关闭元素 2，最后关闭元素 1（![Image](img/red_circle-g.jpg)）。\n\n![Image](img/red_circle-g.jpg)\
  \ 元素必须正确嵌套。如果你先打开 p 再打开 em，则必须在关闭 p 之前关闭 em。\n\n![Image](img/01_08.jpg)\n\n## 网页的文本内容\n\
  \n元素中包含的文本可能是网页最基本的组成部分。如果你曾经使用过文字处理器，那么你一定输入过文本。然而，HTML 页面中的文本有一些重要的区别。\n\n首先，当浏览器渲染\
  \ HTML 时，它会将多余的空格或制表符折叠为单个空格，并将回车和换行转换为单个空格或完全忽略它们（![Image](img/red_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-b.jpg)）。\n\n![Image](img/red_circle-a.jpg) 页面的文本内容（高亮部分）主要是除标记之外的所有内容。在此示例中，请注意每个句子之间至少有一个回车分隔，有些单词之间有几个空格（只是为了强调折叠回车和空格这一点）。此外，它还包含一个特殊字符引用（`&copy;`）来表示版权符号，以确保无论你以何种编码保存此文档，该符号都能正确显示。\n\
  \n```html\n<p>I am continually <em>amazed</em> at the beautiful,   delicate Blue\
  \ Flax that somehow took hold in my garden.\n\nThey are awash in    color every\
  \ morning, yet not a single flower remains by the afternoon.\n\nThey are the very\
  \ definition of ephemeral.</p>\n\n<p>&copy; Blue Flax Society.</p>\n```\n\n![Image](img/red_circle-b.jpg)\
  \ 请注意，当你在浏览器中查看文档时，多余的回车和空格被忽略，字符引用被替换为相应的符号（©）。\n\n![Image](img/01_09.jpg)\n\n\
  其次，HTML 过去仅限于 ASCII 字符——基本上只有英语字母、数字和少数最常见的符号。带重音的字符（西欧语言中常见）以及许多日常符号必须使用特殊的字符引用来创建，例如\
  \ `&eacute;`（表示 é）或 `&copy;`（表示 ©）。完整列表请参见 [www.elizabethcastro.com/html/extras/entities.html](http://www.elizabethcastro.com/html/extras/entities.html)。\n\
  \nUnicode 缓解了许多特殊字符的问题。标准做法是使用 UTF-8 编码页面，如基本页面所示（![Image](img/red_circle-c.jpg)），并以相同的编码保存\
  \ HTML 文件（参见第 2 章中的“保存网页”）。我建议你也这样做。\n\n![Image](img/red_circle-c.jpg) 在 head 开始标签之后直接指定文档的字符编码。`charset`\
  \ 属性设置编码类型。\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n     <meta\
  \ charset=\"utf-8\" />\n     <title>Blue Flax (Linum lewisii)</title>\n</head>\n\
  <body>\n...\n</body>\n</html>\n```\n\n\n\n\n由于 Unicode 是 ASCII 的超集——它包含 ASCII 的所有内容，并且远不止于此——因此\
  \ Unicode 编码的文档与现有浏览器和编辑器兼容，除非是特别老旧的版本。不支持 Unicode 的浏览器会正确解析文档中的 ASCII 部分，而支持 Unicode\
  \ 的浏览器也会显示非 ASCII 部分。即便如此，有时仍然会使用字符引用，例如版权符号，因为 `&copy;` 既容易记忆又容易输入 ![Image](img/gray_circle-a.jpg)。\n\
  \n## 链接、图像及其他非文本内容\n\n当然，网络之所以如此生动，部分原因在于页面之间的链接，以及图像、视频、音乐、动画等。这些外部文件（例如视频）并不会真正嵌入到\
  \ HTML 文件中，而是独立保存，仅在页面中引用 ![Image](img/red_circle-a.jpg)。由于引用本身只是文本，因此 HTML 文件几乎可以普遍访问。\n\
  \n![Image](img/red_circle-a.jpg) 在我们的基本 HTML 文档中，有一个对名为 `blueflax.jpg` 的图像文件的引用，浏览器在加载页面其余部分时会请求、加载并显示该图像。该页面还包含一个指向关于蓝亚麻的其他页面的链接。\n\
  \n***\n\n<article>\n    <h1>短暂的蓝亚麻</h1>\n    <img src=\"blueflax.jpg\" width=\"\
  300\" height=\"175\" alt=\"蓝亚麻（Linum lewisii）\" />\n    <p>我始终<em>惊叹</em>于美丽而精致的<a\
  \ href=\"http://en.wikipedia.org/wiki/Linum_lewisii\" rel=\"external\" title=\"\
  了解更多关于蓝亚麻的信息\">蓝亚麻</a>竟然在我的花园里扎根了。每天早晨它们色彩斑斓，但到了下午却一朵花也不剩。它们正是“短暂”一词的完美诠释。</p>\n\
  </article>\n\n***\n\n浏览器可以毫无障碍地处理链接和图像（纯文本浏览器除外）![Image](img/red_circle-b.jpg)。然而，它们不一定能处理所有其他类型的文件。如果你引用的文件是访问者浏览器无法识别的，浏览器通常会尝试查找插件或辅助应用程序——即访问者计算机上能够打开该类文件的合适程序。\n\
  \n![Image](img/red_circle-b.jpg) 图像和其他非文本内容从网页中引用，浏览器将它们与文本一起显示。\n\n![Image](img/01_10.jpg)\n\
  \n你还可以为浏览器提供额外信息，说明如何通过插件渲染需要插件支持的内容，或者如果访问者计算机上尚未安装该插件，如何下载它。\n\n所有这些下载和安装插件的操作都会破坏用户在你网站上的体验，前提是他们还会留下来。插件还可能带来性能问题，因为它们并非浏览器的原生部分。\n\
  \n例如，Flash 多年来一直是最广泛使用的插件。毫无疑问，你曾通过 Flash 观看过在线视频，并经历过电脑变慢或偶尔的浏览器崩溃（或两者兼有）。\n\n\
  HTML5 试图通过引入 `audio` 和 `video` 元素在浏览器中实现原生媒体播放来缓解这些问题。不幸的是，浏览器厂商之间对于支持哪些媒体格式存在争议，因此目前还不能完全摆脱插件。但这至少是一个开始。\n\
  \n你将在第 5 章中了解更多关于图像的内容，并在第 17 章中详细了解插件、HTML5 的媒体元素等。\n\n## 文件名\n\n与其他文本文档一样，网页也有一个文件名，用于向你自己、访问者以及访问者的浏览器标识自身。在为网页分配文件名时，有几个提示需要牢记，它们有助于你组织文件、方便访问者查找和访问你的页面、确保他们的浏览器正确显示页面，并改善\
  \ SEO（![Image](img/red_circle-a.jpg) 和 ![Image](img/red_circle-b.jpg)）。\n\n![Image](img/red_circle-a.jpg)\
  \ 记住，文件名应全部使用小写字母，单词之间用短横线分隔，并添加 `.html` 扩展名。大小写混用会使访问者更难输入正确的地址并找到你的页面。\n\n![Image](img/01_11.jpg)\n\
  \n![Image](img/red_circle-b.jpg) 目录和文件夹也应全部使用小写字母和短横线。关键在于一致性。如果不使用大写字母，你的访问者（以及你自己）就不必浪费时间猜测“那个字母是大写\
  \ B 还是小写 b？”。\n\n![Image](img/01_12.jpg)\n\n### 使用小写文件名\n\n由于你为网页选择的文件名决定了访问者必须输入什么才能访问你的页面，因此只使用小写字母可以避免访问者因无意中的拼写错误（以及头疼）而烦恼。当你在页面之间创建链接时，这也大有帮助。如果所有文件名都只有小写字母，你就少了一件需要担心的事。\n\
  \n### 用短横线分隔单词\n\n文件名中的单词之间切勿包含空格。相反，应使用短横线，例如 `company-history.html` 和 `my-favorite-movies.html`。你偶尔会遇到使用下划线（`_`）的网站，但不推荐这样做，因为短横线更受青睐。\n\
  \n### 使用正确的扩展名\n\n浏览器判断文档是否为网页的主要方式就是查看其扩展名。虽然 `.htm` 也可以，但 `.html` 是惯例，因此我建议你使用它。如果页面有其他扩展名，例如\
  \ `.txt`，浏览器会将其视为文本。\n\n***\n\n### 提示\n\n请注意，Mac 和 Windows 都不会显示文档的真实扩展名。如有必要，请更改文件夹选项，以便能够看到扩展名。\n\
  \n***\n\n## URL\n\n统一资源定位符（URL）是地址的别称。它包含文件所在位置以及浏览器应如何处理该文件的信息。互联网上的每个文件都有唯一的 URL。\n\
  \nURL 的第一部分称为*方案*。它告诉浏览器如何处理即将打开的文件。最常见的方案是 `HTTP`，即超文本传输协议，用于访问网页 ![Image](img/red_circle-a.jpg)。\n\
  \n![Image](img/red_circle-a.jpg) 基本 URL 包含方案、服务器名称、路径和文件名。\n\n![Image](img/01_13.jpg)\n\
  \nURL 的第二部分是文件所在服务器的名称，后跟指向该文件的路径以及文件名。有时，URL 会省略文件名，以路径结尾，该路径可能包含也可能不包含尾部斜杠 ![Image](img/red_circle-b.jpg)。在这种情况下，URL\
  \ 指向路径中最后一个目录下的默认文件，通常名为 `index.html`。\n\n![Image](img/red_circle-b.jpg) 带有尾部斜杠且没有文件名的\
  \ URL 指向最后一个命名目录（此处为 tofu 目录）中的默认文件。最常见的默认文件名是 index.html。因此，此 URL 与前一个示例中的 URL\
  \ 指向同一页面。\n\n![Image](img/01_14.jpg)\n\n其他常见方案包括：`https`，用于安全网页；`ftp`（文件传输协议），用于下载文件\
  \ ![Image](img/red_circle-c.jpg)；`mailto`，用于发送电子邮件 ![Image](img/red_circle-d.jpg)；以及\
  \ `file`，用于访问本地硬盘或本地文件共享网络上的文件（你很少有机会使用 file 方案，甚至可能根本用不到）![Image](img/red_circle-e.jpg)。\n\
  \n![Image](img/red_circle-c.jpg) 当用户点击此 URL 时，浏览器将开始对文件 `proposal.pdf` 进行 FTP 传输。\n\
  \n![Image](img/01_15.jpg)\n\n\n\n\n\n![Image](img/red_circle-d.jpg) 电子邮件地址的 URL\
  \ 包含 `mailto` 方案，后面跟着冒号但没有斜杠，然后是电子邮件地址本身。\n\n![Image](img/01_16.jpg)\n\n![Image](img/red_circle-e.jpg)\
  \ 要引用本地 Windows 机器上的文件，使用 `file` 方案。对于 Macintosh，使用 `file:///Harddisk/path/filename`。不需要竖线。（这在\
  \ Windows 上有时也有效。）\n\n![Image](img/01_17.jpg)\n\n方案后面通常跟着一个冒号和两个斜杠。`mailto` 和 `news`\
  \ 是例外；它们只需要一个冒号。\n\n注意，`file` 方案后面跟着一个冒号和三个斜杠。这是因为主机（在其他方案中位于第二个和第三个斜杠之间）被假设为本地计算机。始终使用小写字母输入方案。\n\
  \n在这些方案中，你将最频繁使用 `http` 和 `mailto`。其他的用于特殊情况。\n\n### 绝对 URL\n\nURL 可以是绝对的，也可以是相对的。**绝对\
  \ URL** 显示文件的完整路径，包括方案、服务器名称、完整路径以及文件名本身 ![Image](img/red_circle-f.jpg)。绝对 URL 类似于一个完整的街道地址，包括名称、街道和门牌号、城市、州、邮编和国家。无论信件从哪里寄出，邮局都能找到收件人。在\
  \ URL 方面，这意味着绝对 URL 本身的位置与所引实际文件的位置无关——无论它是在你服务器上的 Web 页面上还是另一个服务器上，指向特定文件的绝对 URL\
  \ 看起来都是完全相同的。\n\n![Image](img/red_circle-f.jpg) 包含 URL 的文档（在此例中为 `you-are-here.html`）是相对\
  \ URL 的引用点。换句话说，相对 URL 相对于该文件在服务器上的位置。绝对 URL 无论位于何处都能正常工作，因为它们始终包含指向资源的完整 URL。\n\
  \n![Image](img/01_18.jpg)\n\n当你从他人的服务器引用文件时，你将始终使用绝对 URL。对于 FTP 站点或泛而言的任何不使用 HTTP\
  \ 协议的 URL，你也需要使用绝对 URL。\n\n**表 1.1** 描述了你如何从 `you-are-here.html` 访问各种文件——包括与页面同一站点（`site.com`）的文件以及另一个站点（`remote.com`）的文件——以此说明相对\
  \ URL 和绝对 URL 之间的区别。\n\n表 1.1 绝对 URL 与 相对 URL\n\n![Image](img/01tab01.jpg)\n\n###\
  \ 相对 URL\n\n为了给你去邻居家的路，我可能不会给她完整的地址，而是说：“在右边三扇门之后。”这是一个相对地址——它指向哪里取决于信息源于何。如果在不同的城市使用相同的信息，你永远找不到我的邻居。\n\
  \n同样，相对 URL 通过引用包含 URL 引用本身的文件的位置来描述所需文件的位置。因此，你的 URL 可能会类似于“链接到与此页面相同目录下的 xyz 页面”。\n\
  \n与当前页面位于同一目录下的文件（即包含该 URL 的文件）的相对 URL 简单就是文件名和扩展名 ![Image](img/red_circle-g.jpg)。要创建当前目录子目录下的文件的\
  \ URL，只需输入子目录名称，后跟一个斜杠，然后是所需文件的名称和扩展名 ![Image](img/red_circle-h.jpg)。\n\n![Image](img/red_circle-g.jpg)\
  \ 链接同一文件夹内文件的相对 URL（参见 ![Image](img/gray_circle-f.jpg)）。URL 中只需要文件名和扩展名，而不需要在前面加上\
  \ `http://www.site.com/about/`（这两个文件共同所在的文件夹）。\n\n![Image](img/01_19.jpg)\n\n![Image](img/red_circle-h.jpg)\
  \ 要引用当前文件夹内部文件夹内的文件（此例中为 `data.html`）（参见 ![Image](img/gray_circle-f.jpg)），请在文件名前添加子文件夹名称和斜杠。\n\
  \n![Image](img/01_20.jpg)\n\n要引用文件层次结构更高目录中的文件，请使用两个点和一个斜杠 ![Image](img/red_circle-i.jpg)。你可以组合并重复这两个点和斜杠，以引用当前文件所在同一服务器或驱动器上的任何文件。\n\
  \n![Image](img/red_circle-i.jpg) 此文件，正如你在 ![Image](img/gray_circle-f.jpg) 中所示，位于一个文件夹\
  \ (`img`) 中，该文件夹与站点根目录下的当前文件夹 (`about`) 并列。在这种情况下，你使用两个点和一个斜杠返回上一级，然后指定子目录，后跟斜杠，最后是文件名。（在实际操作中，你会选择比\
  \ `image.png` 更具描述性的文件名，这里为了示例故意使用了通用的名称。）\n\n![Image](img/01_21.jpg)\n\n或者，如果你的文件在\
  \ Web 服务器上，你可以避免诸如 `../../img/family/vacation.jpg` 这样复杂的路径路径，而是直接跳转到网站根目录，然后从那里深入到目标文件。开头使用单个斜杠即可实现这一点，因此在这种情况下，“根相对”\
  \ URL 将是 `/img/family/vacation.jpg`（假设 `img` 文件夹位于站点根目录，这是惯做法）。再次，这仅在 Web 服务器上有效，例如提供你网站服务的托管供应商，或你在本地机器上运行的服务器（`Apache`\
  \ 是那里最流行的选择）。\n\n如果你不是在服务器上本地开发网站，那么通常你会想使用相对 URL（当然，指向他人服务器上的文件除外）。它们将让你易于将页面从本地系统移动到服务器。只要每个文件的相对位置保持不变，你就不需要更改任何路径，因此链接将正常工作。\n\
  \n### 核心要点\n\nHTML 的基础知识和一些关键的最佳实践为构建有效的网站奠定了基础。让我们回顾一下核心要点：\n\nHTML 的基础知识和一些关键的最佳实践是构建有效网站的基础。\n\
  \n• Web 页面主要由三个部分组成：文本内容、对其他文件的引用以及标记。\n\n• HTML 标记由元素、属性和值组成。\n\n• 习惯上使用全小写编写 HTML（`DOCTYPE`\
  \ 除外），用引号括属性值，并用空格和斜杠（ /`）关闭空元素。\n\n```\n<!DOCTYPE html>\n```\n\n• 页面的内容放在 `body`\
  \ 元素中。主要用于浏览器和搜索引擎的指令位于之前，主要在 `head` 中。\n\n• 使用语义化 HTML 标记内容，而不考虑它们在浏览器中如何显示。\n\n\
  • 语义化 HTML 提高了可访问性，并让你的网站更高效、更容易维护和设置样式。\n\n• CSS 控制 HTML 内容的呈现。\n\n• 每个浏览器都有自己的样式表，决定了\
  \ HTML 的默认呈现。你可以通过自己的 CSS 覆盖这些规则。\n\n• 创建文件和文件夹名称时使用全小写字母，并用连字符分隔单词，而不是空格或下划线。\n\
  \n\n\n\n\n在你开始编写 HTML 元素和属性之前，了解如何创建你将使用此类代码的文件是非常重要的。在本章中，你将学习如何创建、编辑和保存 Web 页面文件。我还会涉及一些规划和组织方面的考虑因素。\n\
  \n如果你无法忍受更长时间的等待，并且已经知道如何创建实际的文件，请直接跳到第 3 章，那里我将开始解释 HTML 代码本身。\n\n# 规划你的网站\n\n\
  虽然你可以直接开始编写 Web 页面，但先对你的网站进行思考和规划是一个好主意 ![Image](img/red_circle-a.jpg)。这样你就能给自己一个方向，后期需要重新调整的工作也会少少。\n\
  \n![Image](img/red_circle-a.jpg) 画出你的网站并思考它可能包含的内容，有助于你决定它需要什么样的结构。\n\n![Image](img/2_01.jpg)\n\
  \n# 规划你的网站\n\n* 弄清楚为什么要创建这个网站。你想传达什么？\n* 考虑你的受众。你如何调整内容来吸引这些受众？\n* 需要多少页面？你希望它具有什么样的结构？你希望访问者按照特定的顺序浏览你的网站，还是让他们能够方便地从任何方向进行探索？\n\
  * 在纸上画出你的网站草图。\n* 为你的页面、图像和其他外部文件制定简单、一致的命名规范（参见第 1 章中的“**文件名””）。\n\n> **提示**\n\
  > 不要过度沉溺于网站的规划阶段。在某个时刻，你必须投入进去并开始编写内容和代码了。\n\n> **提示**\n> 如果你对 Web 并不熟悉，请先浏览一下网页以了解各种可能性。你可以从你一些竞争对手的网站开始。\n\
  \n> **提示**\n> 将网站的文件夹结构映射到它在纸上的组织方式相对应是常见的，但并非必须的 ![Image](img/gray_circle-a.jpg)。参见“组织文件”。\n\
  \n> **提示**\n> 参见 Erin Kissane 的文章《内容工作清单》（[www.alistapart.com/articles/a-checklist-for-content-work/](http://www.alistapart.com/articles/a-checklist-for-content-work/))，获取关于你如何构建网站内容的思路。这是她书中的精华，书中详细阐述了内容策略的主题。\n\
  \n> **提示**\n> Jason Beaird 的*精美 Web 设计设计原理*（SitePoint, 2010）可能会让你感兴趣，如果你是一个正在寻找如何设计吸引人且有效的网站指导的非设计人员或新手设计师。\n\
  \n## 创建新的 Web 页面\n\n创建 Web 页面不需要任何特殊工具。你可以使用任何文本编辑器，甚至是 Windows 自带的**记事本**（![Image](img/red_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-c.jpg)），或者 **TextWrangler**（![Image](img/gray_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-b.jpg)），后者是 OS X 的一个免费下载软件（[www.barebones.com/products/textwrangler](http://www.barebones.com/products/textwrangler)）。Mac\
  \ 包含一个名为 TextEdit 的编辑器，但它在 OS X 的某些版本中存在一个 bug，导致处理 HTML 文件非常困难。）\n\n![Image](img/red_circle-a.jpg)\
  \ 打开你的文本编辑器。在出现的空白文档中输入你的 HTML，或者选择 `File > New`。具体的菜单选项可能会略有不同。如果你在使用 TextWrangler\
  \ (Mac)，则是 `File > New > Text Document`，如所示（顶部）。另一张图片是记事本 (Windows)（底部）。\n\n![Image](img/2_02.jpg)\n\
  \n![Image](img/red_circle-b.jpg) 在 Mac 上，你可以使用 TextWrangler 为你的页面编写 HTML 代码。请查看提示以获取一个具有更强大功能、更适合编写代码的\
  \ Mac 编辑器列表。\n\n![Image](img/2_03.jpg)\n\n## 创建新的 Web 页面\n\n1. **打开**任何文本编辑器。\n\
  2. **选择** `File > New` 创建一个新的空白文档 ![Image](img/gray_circle-a.jpg)。\n3. 按照本书其他部分的解释来**创建**\
  \ HTML 内容，从第 3 章开始。\n4. 确保按照“**保存你的 Web 页面”中的指示**保存**你的文件。\n\n![Image](img/red_circle-c.jpg)\
  \ 这是`记事本`，Windows 用户用来创建 HTML 页面最基础的程序。还有其他可用程序（参见提示）。\n\n![Image](img/2_04.jpg)\n\
  \n> **提示**\n> OS X 和 Windows 有各种文本编辑器，它们专门为编写 HTML（以及 CSS）量身定制。它们具有代码提示和代码补全功能，可以帮助你更准确更快速地编写代码，它们会对代码进行高亮，以便于区分\
  \ HTML 元素。\n\n> **提示**\n> OS X 上一些流行的编辑器有：`BBEdit`（[www.barebones.com/](http://www.barebones.com/))）、`Coda`（[www.panic.com/](http://www.panic.com/))）、`Espresso`（[www.drinkingcode.com/](http://www.drinkingcode.com/))）、`TextEdit`（[www.apple.com/](http://www.apple.com/))）、`TextWrangler`（[www.barebones.com/](http://www.barebones.com/))）、`Sublime\
  \ Text`（[www.sublimetext.com/](http://www.sublimetext.com/))）、`TextMate`（[www.apple.com/](http://www.apple.com/))，以及\
  \ `Notepad++`（[www.notepad-plus.org/](http://www.notepad-plus.org/)）。对于 Windows，`Visual\
  \ Studio Code`（[www.visualstudio.com/](http://www.visualstudio.com））是非常优秀的选择。\n\n\
  > **提示**\n> 如果你使用上文提到的编辑器，创建新页面的过程是类似的。编辑现有页面，只需在你的文本编辑器中选择 `File > Open`（参见“编辑\
  \ Web 页面”）。\n\n> 不要使用文字处理器（如 **Microsoft Word**）来编写 HTML。它们可能会向你的文件中添加不必要的无效代码。\n\
  \n## 保存你的 Web 页面\n\n你用文本编辑器创建 Web 页面，但它们旨在供多个浏览器查看。为了让所有这些不同的程序都能访问，你用通用的“纯文本”格式保存\
  \ Web 页面而不包含文字处理器可能会应用的任何专用格式。\n\n为了让浏览器（和服务器）识别 Web 页面并知道解释它们包含的标记，Web 页面文件具有 `.html`\
  \ 或 `.htm` 扩展；这也将这些文件与不是 Web 页面的纯文本文件区分来。虽然两者都可以，但习惯上使用 `.html` 扩展，因此建议你在文件中使用它。\n\
  \n由于该扩展，Web 页面的图标与系统的默认浏览器匹配——而不是编写该文件的编辑器。事实上，当你双击 Web 页面文件时，它会在浏览器中打开，而不是文本编辑器。这对于在浏览器中测试页面可能非常好，但为编辑\
  \ Web 页面增加了一个额外步骤。\n\n![Image] 一个 Excel 工作表具有 `.xlsx` 扩展并以 Excel 图标标识（顶部）。双击它，将在\
  \ Excel 中显示。Web 页面文件无论你用什么文本编辑器创建，都有 `.html` 或 `.htm` 扩展并以默认浏览器的图标标识（在本例中为 Firefox）。双击它，将在你的默认浏览器中显示（而不是在文本编辑器中）。\n\
  \n\n\n\n\n# 保存你的网页\n\n1. 一旦你创建了 Web 页面，从你的文本编辑器中选择`文件` > `另存为` ![Image](img/red_circle-b.jpg)。\n\
  \n![Image](img/red_circle-b.jpg) 从你的文本编辑器中选择`文件` > `另存为`。\n\n![Image](img/2_07.jpg)\n\
  \n2. 在弹出的对话框中，选择`Plain Text`纯文本）或`Text Document`文本文档）（取决于你的程序如何描述）作为格式。\n\n3. 给文档赋予\
  \ `.html`（优先）或 `.htm` 扩展名。（这非常！）\n\n4. 选择保存网页的文件夹。\n\n5. 点击`保存` (![Image](img/red_circle-c.jpg)\
  \ 和 ![Image](img/red_circle-d.jpg))。\n\n![Image](img/red_circle-c.jpg) 在记事本中，为文件指定带有\
  \ `.html` 或 `.htm` 扩展名的名称，在“保存类型”下拉菜单中选择`Text Documents”（文本文档），确保`编码`设置为 `UTF-8`（参见最后的提示），并点击保存。在其他文本编辑器中的选项可能不同（但相似）。\n\
  \n![Image](img/2_08.jpg)\n\n![Image](img/red_circle-d.jpg) 在 TextWrangler 中，为你的文件命名并选择保存位置。TextWrangler\
  \ 默认使用 `UTF-8`（这正是你需要的，特殊情况除外），但你可以从`Encoding`下拉菜单中做出不同的选择（参见最后的提示）。点击`Save`保存文件。\n\
  \n![Image](img/2_09.jpg)\n\n***\n\n### 提示\n\n使用 `.html` 还是 `.htm` 并不重要，但推荐使用 `.html`，因为它是常用的选择。无论你使用哪种，请保持一致，因为使用相同的扩展名将使你以后更容易记住你的\
  \ URL。\n\n***\n\n### 提示\n\nWindows 上的文本编辑器可能会向你的文件名添加默认扩展名，即使你已经指定了 `.html` 或 `.htm`。（注意，这对于大多数专门为编辑\
  \ HTML 页面设计的编辑器来说不应该是问题。）你的文件现在命名为 `webpage.html.txt`，在浏览器中无法正常显示。更糟糕的是，Windows\
  \ 经常会隐藏扩展名，导致问题并不完全明显，特别是对初学者来说。有两种解决方案。第一个是在第一次保存文档时，用双引号括起你的文件名。这应该阻止额外扩展名的添加。接下来，你可以告诉\
  \ Windows 显示文件扩展名 ![Image](img/red_circle-e.jpg)，这样你就可以看到那个问题的扩展名并从文件名中删除它。\n\n\
  ![Image](img/red_circle-e.jpg) 从 Windows 资源管理器中选择`组织 > 文件夹和搜索选项`或`工具 > 文件夹选项`取决于你的\
  \ Windows 版本）来查看此对话框。它看起来可能取决于你的 Windows 版本。点击`查看`选项卡并向下滚动直到看到“隐藏已知类型的扩展名”。如果你想在桌面上看到文件的扩展名（如\
  \ `.html`），请确保取消勾选。\n\n![Image](img/2_10.jpg)\n\n***\n\n### 提示\n\n当你选择纯文本格式时，你的文件通常以系统的默认字符编码保存。如果你想用另一种编码创建网页（可能是为了包含特殊符号或其他语言的文本），你必须使用允许你选择编码的文本编辑器。通常，`UTF-8`\
  \ 是最佳的编码选择。如果你的编辑器有将文件保存为“UTF-8, no BOM”、“UTF-8, without BOM”或类似的选项，请选择它。否则，选择 `UTF-8`\
  \ ![Image](img/red_circle-f.jpg)。在某些情况下，编辑器的 `UTF-8` 模式并不包含 BOM，即使它没有在编码菜单中显式说明这一点。（如果你对\
  \ BOM 的含义感兴趣，请查看 [`en.wikipedia.org/wiki/Byte_order_mark`](http://en.wikipedia.org/wiki/Byte_order_mark)。准备好被迷住吧！）\n\
  \n![Image](img/red_circle-f.jpg) 许多文本编辑器允许你选择文件的编码，以便在同一文档中保存来自不同语言的符号和字符。在大多数情况下，`UTF-8`\
  \ 是推荐的编码。如果你的编辑器提供 `UTF-8` no BOM 选项，请选择它。否则，选择 `UTF-8`。某些编辑器（如此处所示 TextWrangler）默认如此。\n\
  \n![Image](img/2_11.jpg)\n\n***\n\n### 指定默认页面或首页\n\n大多数 Web 服务器都有一套根据文件名识别每个文件夹中默认页的系统。在几乎所有情况下，`index.html`\
  \ 被识别为默认页 ![Image](img/red_circle-a.jpg)，尽管如果 `index.html` 不存在，服务器通常会寻找 `index.htm`\
  \ 和 `default.htm` 等文件名。如果访问者输入带有目录的 URL 但未指定文件名，则将使用默认文件 ![Image](img/red_circle-b.jpg)。\n\
  \n![Image](img/red_circle-a.jpg) 将文件保存为 `index.html`，以便将该文件指定为在该目录下打开的默认页。\n\n![Image](img/2_12.jpg)\n\
  \n![Image](img/red_circle-b.jpg) 当访问者输入路径但省略文件名本身时，将使用默认文件。\n\n### 为你的网站指定首页或落地页\n\
  \n在目标文件夹中将文件保存为 `index.html`（参见“保存网页”）（如果 index.html 在你的网站上作为默认页不起，请咨询你的 Web 服务商。）\n\
  \n由于网页通常使用 Web 浏览器查看，当你双击桌面上的文件时，默认浏览器会轻松打开并显示它们。如果你想编辑网页，则必须手动在文本编辑器中打开它。\n\n####\
  \ 编辑网页\n\n1. 打开你的文本编辑器。\n2. 选择`文件` > `打开`。\n3. 导航到包含所需文件的目录。\n4. 如果列表中没有显示你的文件，选择`All\
  \ Files`所有文件（或类似的描述） ![Image](img/red_circle-a.jpg) 和 ![Image](img/red_circle-b.jpg)。其名称和位置在不同程序和平台之间可能会有不同。\n\
  \n![Image](img/red_circle-a.jpg) Windows 上的某些编辑器（如记事本）无法自动看到 HTML 文件。必要时选择 `All\
  \ Files`（或类似的选项）以查看任何扩展名的文件。\n\n![Image](img/2_14.jpg)\n\n\n\n\n\n![Image](img/red_circle-b.jpg)\
  \ 一旦显示了任何扩展的文件，你就可以选择所需的 HTML 文件并点击“打开”。\n\n![Image](img/2_15.jpg)\n\n**5.** 点击打开。你的文件已准备好进行编辑。\n\
  \n![Image](img/red_circle-c.jpg) 在 Windows 中，你也可以右键点击文档图标或文件名，然后在弹出的菜单中选择“编辑”或“打开方式”。在\
  \ Mac 上，右键点击图标，在弹出的菜单中选择“打开方式”，然后选择所需的文本编辑器。\n\n![Image](img/2_16.jpg)\n\n* * *\n\
  \n### 提示\n\n一旦你对已保存的文档进行了更改，通常只需简单地选择 `File > Save` 即可保存更改，无需担心格式问题（如“保存你的网页”中所述）。\n\
  \n* * *\n\n### 组织文件\n\n在拥有太多文件之前，先想好要把它们放在哪里是个好主意。惯做法（但不是强制的）为你网站中的每个主要部分创建一个文件夹，以便你将相关的\
  \ HTML 页面分在一起。\n\n#### 如何组织你的文件\n\n**1.** 创建一个中央文件夹或目录，用于存放你的网站上提供的所有材料。在 Mac 上，在访达器中选择\
  \ `File > New Folder` ![Image](img/red_circle-a.jpg)。在 Windows 中，从桌面（或你选择的文件夹内）右键点击并选择\
  \ `New > Folder` ![Image](img/red_circle-b.jpg)。为文件夹命名。\n\n![Image](img/red_circle-a.jpg)\
  \ 在 Mac 上，选择 `New Folder` 然后为文件夹命名。为网站的每个部分创建一个单独的文件夹。\n\n![Image](img/2_17.jpg)\n\
  \n![Image](img/red_circle-b.jpg) 在 Windows 中，从桌面或 Windows 资源管理器中，右键点击并选择 `New >\
  \ Folder`。\n\n![Image](img/2_18.jpg)\n\n**2.** 以反映你网站结构的方式创建子文件夹（![Image 和 ![Image](img/red_circle-c.jpg)）。例如，你可能决定为网站的每个部分创建一个单独的文件夹，并根据需要在其中创建各个子文件夹。\n\
  \n![Image](img/red_circle-c.jpg) 如果需要，你可以将文件夹划分为子文件夹。\n\n![Image](img/2_19.jpg)\n\
  \n**3.** 通常做法是为网站的图片创建一个顶级文件夹，并可选地添加子文件夹来帮助你按部分或其他标准组织图片。另一种方法是创建一个名为 `Assets`（或类似名称）的顶级文件夹，并将你的图片文件夹放在其中，同时放入其他资产的文件夹，如视频、样式表等。（你将从第\
  \ 7 章开始学习样式表）。\n\n* * *\n\n### 提示\n\n为文件和文件夹使用简短且具描述性的名称，最好在名称中使用连字符（dash）而不是空格来分隔单词。使用所有小写字母，这样你的\
  \ URL 更容易输入，你的页面也更容易访问。关于如何创建良好文件名的更多细节，请参阅第 1 章中的“文件名”。\n\n* * *\n\n### 在浏览器中查看你的页面\n\
  \n一旦创建了页面，你就想看看它在浏览器中显示如何。事实上，由于你不知道访问者将使用哪种浏览器——而且浏览器渲染页面的方式并不完全相同——建议在多个浏览器中查看页面。\n\
  \n#### 如何在浏览器中查看你的页面\n\n**1.** 打开浏览器。\n\n**2.** 根据浏览器选择 `File > Open`、`> Open File`\
  \ 或 `> Open Page`（只要不是 Open Location 即可）![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg)\
  \ 从所需的浏览器（这里是 Firefox）中，选择 `File > Open File`。在 Internet Explorer 中，它被称为 `File >\
  \ Open`。\n\n![Image](img/2_20.jpg)\n\n**3.** 在出现的新对话框中，导航到计算机上包含目标 Web 页面的文件夹，选择该页面并点击“打开”![Image](img/red_circle-b.jpg)。页面将在浏览器中显示![Image](img/red_circle-c.jpg)，其显示效果与你实际上在\
  \ Web 服务器上发布它时显示的情的将完全一样（参见第 21 章。这些步骤在不同的浏览器中可能会略不同。\n\n![Image](img/red_circle-b.jpg)\
  \ 选择你想打开的文件，并点击“打开”按钮。\n\n![Image](img/2_21.jpg)\n\n![Image](img/red_circle-c.jpg)\
  \ 页面出现在浏览器中。仔细检查以查看它是否按照你的计划显示。\n\n![Image](img/2_22.jpg)\n\n* * *\n\n### 提示\n\n\
  你（通常）也可以双击 Web 页面的图标在浏览器中查看它。或者，如果你已经打开了浏览器，可以将文件图标或文件名拖入到浏览器窗口中。这通常是你在浏览器中查看页面最简单的方法。\n\
  \n* * *\n\n### 提示\n\n你（通常）也可以双击 Web 页面的图标在浏览器中查看它。或者，如果你已经打开了浏览器，可以将文件图标或文件名拖入到浏览器窗口中。这通常是你在浏览器中查看页面最简单的方法。\n\
  \n* * *\n\n### 提示\n\n某些浏览器没有“打开”菜单选项。请尝试使用拖放方法。\n\n* * *\n\n### 提示\n\n等等，我将继续下一节。\n\
  \n### 人的灵感\n\n提高 HTML 熟练度最简单的方法之一是观察页面开发者和设计师是如何创建他们的页面的。坦率地说，HTML 代码很容易查看和学习。然而，文本内容、图形、声音、视频、样式表和其他外部文件可能受版权保护。通常情况下，使用他人的页面作为你\
  \ HTML 的灵感，然后创建你自己的。\n\n#### 如何使用“查看源代码”查看其他设计的 HTML 代码\n\n**1.** 使用任何浏览器打开 Web\
  \ 页面。\n\n**2.** 选择查看源代码（或针对特定浏览器的相应选项）（![Image](img/red_circle-a.jpg) 和 ![Image](img/red_circle-b.jpg)）。HTML\
  \ 代码将显示![Image](img/red_circle-c.jpg)。\n\n![Image](img/red_circle-a.jpg) 所有桌面浏览器都有一个查看页面代码的菜单命令。名称从\
  \ View Source 到 Page Source（如 Firefox 所示）。在 Chrome 中，它是 `Tools > View page source`。\n\
  \n![Image](img/2_23.jpg)\n\n![Image](img/red_circle-b.jpg) 大多数浏览器还允许你右键点击页面，然后从弹出的菜单中选择源代码命令（无论它叫什么）。所示所示。这通常是查看源代码最简单的方法，因为在主菜单或子菜单中可能很难找到。\n\
  \n![Image](img/2_24.jpg)\n\n![Image](img/red_circle-c.jpg) 现代浏览器会在自己的标签或窗口中显示代码（如所示），旧浏览器可能会在指定的文本编辑器中显示。颜色区分页面内容与\
  \ HTML 元素、属性和属性值。这被称为语法高亮。左侧的行不是 HTML 代码的一部分，并不是所有浏览器都在查看源代码模式下显示它们。它们只是 Chrome\
  \ 在源代码窗口中包含的一个指示。\n\n![Image](img/2_25.jpg)\n\n**3.** 如果需要，保存文件以便进一步学习。\n\n####\
  \ 如何使用开发者工具查看其他设计的 HTML 代码\n\n查看源码的另一种方法是使用浏览器的开发者工具。每个浏览器厂商的工具都不同，但它们都有一些重叠的功能。\n\
  \n\n\n\n\n这些工具展示了源代码更具交互性的视图。你可以检查页面特定部分的 HTML 和 CSS，在浏览器中对其进行编辑，并立即看到更改反映在页面上。你可以在任何网站上使用它们，而不仅仅是你自己的网站。这些更改是临时的——它们不会覆盖页面加载的实际\
  \ HTML 和 CSS 文件。这对于学习非常有价值，因为你可以看到特定效果是如何实现的，或者随意摆弄代码看看会发生什么，而无需担心损坏任何东西。\n\n有关现代和旧版浏览器的开发者工具的信息，请参阅第\
  \ 20 章中的“浏览器开发者工具” 侧边栏。\n\n> 提示\n> 关于谁可以把网站放在 Web 上并没有规定。这正是它的迷人之处——它是一个门槛相对较低的开放媒介。你可以是新手、专家，或者介于两者之间的任何阶段。在查看其他网站的代码时，请记住这一点。如果某些代码看起来很可疑，不要因为他们的网站在\
  \ Web 上就假设其作者比你更懂。有很多网站可以作为编码最佳实践的绝佳示例，也有很多其他网站，我们可以说，并不理想。因此，请保持批判性的眼光，当对特定技术的适用性产生疑问时，请查阅本书和其他资源。\n\
  \n> 提示\n> 你也可以通过从“查看源代码”窗口复制并将其粘贴到你的文本编辑器中来保存源代码。然后你就可以保存文件。\n\n> 提示\n> 在大多数浏览器中，你可以通过选择“文件\
  \ > 另存为”（或“文件 > 保存页面为”）来保存源代码以及通常还有它的许多资产（如图像）。然而，浏览器在保存页面时可能会重写部分代码，因此它与你使用上一个技巧保存的并不完全相同。\n\
  \n> 提示\n> 要查看网页中的 CSS，请参阅第 8 章中的“他人的灵感：CSS”。\n\n## 3. 基础 HTML 结构\n\n### 本章内容介绍\n\
  - 开始你的网页\n- 创建标题\n- 创建标题级\n- 理解 HTML5 的文档大纲\n- 分组标题\n- 常见页面结构\n- 创建页头\n- 标记导航\n\
  - 创建文章\n- 定义区块\n- 指定侧边栏\n- 创建页脚\n- 创建通用容器\n- 使用 ARIA 提高可访问性\n- 使用类或 ID 为元素命名\n-\
  \ 为元素添加标题属性\n- 添加注释\n\n本章涵盖了你建立文档基础和结构所需的 HTML 元素。也就是说，内容的大纲和主要容器。你将学习到：\n- 开始网页\n\
  - HTML5 文档大纲\n- `h1`–`h6`, `group`, `header`, `nav`, `article`, `section`, `aside`,\
  \ `footer`, 和 `div` 元素（大部分是 HTML5 新增的）\n- ARIA 角色属性如何提高你页面的可访问性\n- 为元素应用 `class`\
  \ 或 `id`\n- 为元素应用 `title` 属性\n- 在代码中添加注释\n\n创建一个清晰且一致的结构不仅为你的页面奠定了良好的基础，还让你更更容易使用层级样式表（CSS）为文档应用样式（相关内容从第\
  \ 7 章开始）。如果你还没有这样做，我强烈建议你在继续之前先阅读第 1 章。它展示了一个简单的 HTML 页面并解释了一些基本概念。由于这是你首次接触网页，我将在这里重复一些（但不是全部）信息，并假设你已经熟悉其余内容，以便你可以在这些想法的基础上进行构建。此外，如果你读过我的《HTML\
  \ 口袋指南》（*The HTML Pocket Guide*），那么这部分材料对你来说是熟悉的。\n\n### 开始你的网页\n在最基础层面，你的每个 HTML\
  \ 文档都应该包含以下组件，如图 ![Image](img/red_circle-a.jpg) 所示：\n- `DOCTYPE`\n- `html` 元素（带有\
  \ `lang` 属性，可选的但推荐的）\n- `head` 元素\n- `meta` 元素中的字符编码\n- `title` 元素\n- `body` 元素\n\
  \n这是最基础的页面结构：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
  UTF-8\">\n  <title>Page Title</title>\n</head>\n<body>\n  <p>Hello, world!</p>\n\
  </body>\n</html>\n```\n\n上面的代码展示了一个基本的 HTML5 页面。\n- `<!DOCTYPE html>` 声明文档类型为 HTML5。\n\
  - `<html lang=\"en\">` 是根元素，`lang` 属性指定页面语言（这里是英语）。\n- `<head>` 包含页面的元数据，这些不会在页面上直接显示。\n\
  - `<meta charset=\"UTF-8\">` 设置字符编码为 UTF-8。\n- `<title>Page Title</title>` 定义了浏览器标签页上显示的标题。\n\
  - `<body>` 包含页面的可见内容。\n- `<p>Hello, world!</p>` 是一个段落元素。\n\n\n\n\n文档头部是定义页面标题、为搜索引擎（如\
  \ Google）提供页面信息、加载样式表以及偶尔加载 JavaScript 文件的地方（不过出于性能考虑，大多数情况下最好在页面底部 `</body>` 标签之前加载\
  \ JavaScript）。随着本书的深入，你会看到这些示例。除了标题（稍后会详细介绍）之外，头部的内容在用户访问页面时是不可见的。\n\n`body` 元素包含页面的内容，包括文本、图像、表单、音频、视频以及其他交互式内容。换句话说，就是访问者看到的东西。本书有多个章节专门介绍\
  \ HTML 的内容相关元素，其中一些你将在本章中提前了解。\n\n***\n\n**提示**\n\nHTML5 的 `DOCTYPE` 确保浏览器以可靠模式渲染，并告诉\
  \ HTML 验证器根据 HTML5 允许的元素和语法来评判你的代码。HTML 验证器将在第 20 章中讨论。\n\n***\n\n***\n\n**提示**\n\
  \nHTML5 的 `DOCTYPE` 不区分大小写。例如，有些人选择将其写成 `<!doctype html>`，但更常见的是使用 `<!DOCTYPE html>`\
  \ ![图片](img/gray_circle-a.jpg)。\n\n***\n\n***\n\n**提示**\n\n紧随 `DOCTYPE` 之后的 `html`\
  \ 元素必须包含页面中的所有其他元素 ![图片](img/gray_circle-a.jpg)。\n\n***\n\n***\n\n**提示**\n\n请确保你的代码编辑器配置为以\
  \ UTF-8 格式保存文件，以匹配代码中通过 `<meta charset=\"UTF-8\" />` 指定的字符编码 ![图片](img/gray_circle-a.jpg)。（如果你指定了其他\
  \ `charset`，请将文件保存为该编码。）并非所有编辑器默认都会以 UTF-8 保存页面，但大多数编辑器允许你从菜单或面板中选择编码（参见第 2 章中的“保存网页”）。如果没有设置\
  \ UTF-8，你可能会偶尔在内容中看到奇怪的字符，而不是预期的字母，例如带重音的 i 或带波浪线 (~) 的 n。\n\n***\n\n***\n\n**提示**\n\
  \n你不必缩进嵌套在 `head` 元素中的代码 ![图片](img/gray_circle-a.jpg)。但这样做的好处是，你可以一目了然地看到 head 从哪里开始、包含什么内容以及在哪里结束。在某些页面中，head\
  \ 变得很长的情况并不少见。\n\n***\n\n***\n\n## HTML5 改进的 `DOCTYPE`\n\n哦，有了 HTML5，开始编写网页变得多么简单。HTML5\
  \ 的 `DOCTYPE` 非常简短，尤其是与过去的 `DOCTYPE` 相比。\n\n在 HTML 4 和 XHTML 1.0 时代，有多个 `DOCTYPE`\
  \ 可供选择，每个都表示 HTML 的版本以及是过渡模式还是严格模式。你总是不得不从其他地方复制它们，因为它们太复杂而难以记住。\n\n例如，这是 XHTML\
  \ 严格文档的 `DOCTYPE`。\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \ \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\">\n```\n\n乱七八糟。\n\n幸运的是，所有浏览器——无论是旧的还是新的——都能理解\
  \ HTML5 的 `DOCTYPE`，因此你可以在所有页面中使用它，并忘记其他 `DOCTYPE` 曾经存在过。（它们可能相关的唯一情况是，如果你继承了一个旧网站，而所有者不允许你将\
  \ `DOCTYPE` 更改为 HTML5 版本。）\n\n***\n\n### 创建标题\n\n上一节中的 HTML 基础代码中，`<title></title>`\
  \ 只是一个占位符，直到现在才进一步讨论标题。现在正是时候！\n\n每个 HTML 页面都必须有一个 `title` 元素。标题应该简短、具有描述性，并且每个页面唯一\
  \ ![图片](img/red_circle-a.jpg)。在大多数浏览器中，标题会显示在窗口的标题栏中（Chrome 是一个例外）![图片](img/red_circle-b.jpg)。在支持标签页浏览的浏览器中（即过去几年发布的所有主流浏览器），标题也会显示在页面的标签页上。标题还会出现在访问者的浏览器历史记录列表和书签中\
  \ ![图片](img/red_circle-c.jpg)。\n\n`title` 元素必须放在 `head` 部分。将其放在指定字符编码的 `meta` 元素之后。\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
  \ />\n    <title>Antoni Gaudí - Introduction </title>\n</head>\n<body>\n</body>\n\
  </html>\n```\n\n![图片](img/red_circle-b.jpg) 在大多数浏览器（如 Firefox）中，网页的标题同时显示在窗口的标题栏和标签页上。然而，Chrome（底部）仅将标题显示在标签页上。\n\
  \n![图片](img/3_02.jpg)\n\n![图片](img/red_circle-c.jpg) 标题还会出现在访问者的浏览器历史记录列表和书签中 ![图片](img/red_circle-c.jpg)。等等，![图片](img/red_circle-c.jpg)\
  \ 标题还会出现在访问者的浏览器历史记录列表和书签中。\n\n![图片](img/3_02.jpg)\n\n![图片](img/red_circle-c.jpg)\
  \ 标题还会出现在访问者的浏览器历史记录列表和书签中。\n\n![图片](img/3_02.jpg)\n\n![图片](img/red_circle-c.jpg)\
  \ 标题还会出现在访问者的浏览器历史记录列表和书签中。\n\n![图片](img/3_02.jpg)\n\n![图片](img/red_circle-c.jpg)\
  \ 标题还会出现在访问者的浏览器历史记录列表和书签中。\n\n![图片](img/3_02.jpg)\n\n![图片](img/red_circle-c.jpg)\
  \ 标题还会出现在访问者的浏览器历史记录列表和书签中。\n\n![图片](img/red_circle-d.jpg) 也许最重要的是，搜索引擎会将标题用作搜索结果中的链接文本\
  \ ![图片](img/red_circle-d.jpg)。\n\n简而言之，为每个页面设置唯一的标题，以改善访问者的体验。\n\n## 深入探讨页面标题\n\n\
  许多开发者——即使是善意且相当有经验的——也很少考虑 `title` 元素。他们只是简单地输入网站名称，然后将其复制到所有页面。或者更糟的是，他们保留代码编辑器可能默认插入的标题文本。如果你的目标之一是增加网站流量，那么效仿这种做法将对你和潜在读者造成极大的伤害。\n\
  \n搜索引擎有不同的算法来确定页面的排名以及如何索引其内容。然而，标题普遍起着关键作用。搜索引擎可能会通过标题来了解页面的内容并索引其内容。\n\n作为最佳实践，选择能够简要总结文档内容的标题文本，以利于读者和搜索引擎排名。其次，可以选择在标题中指明网站名称。通常可以看到网站名称出现在标题的开头，但更好的做法是将唯一的、特定于页面的标题文本放在开头。\n\
  \n我建议你将标题的核心信息控制在前 60 个字符内（包括空格），因为搜索引擎通常会在结果中截断大约这个数量的字符（作为基准）。浏览器在标题栏顶部显示的字符数各不相同，但通常不超过\
  \ 60 个字符，之后就会截断文本。浏览器标签页由于空间更小，截断得更早。\n\n### 创建标题\n\n**1.** 将光标放在文档 `head` 中的 `<title>`\
  \ 和 `</title>` 之间。\n\n**2.** 输入网页的标题。\n\n***\n\n**提示**\n\n`title` 元素是必需的。\n\n***\n\
  \n***\n\n**提示**\n\n`title` 元素不能包含任何格式、HTML、图像或指向其他页面的链接。\n\n***\n\n***\n\n**提示**\n\
  \n某些代码编辑器在新建页面时会预填充默认标题文本，除非你已指示它使用特定的起始代码，如“开始你的网页”中所述。因此，请注意这一点，并确保将任何默认文本替换为你自己创建的标题。\n\
  \n\n\n\n\n如果你的标题包含像重音符号或某些符号之类的特殊字符，你必须将它们作为编码的一部分（如果你使用 UTF-8，这通常不会成为问题），或者使用引用来编写它们（可用字符实体引用请参见\
  \ [www.elizabethcastro.com/html/extras/entities.html](http://www.elizabethcastro.com/html/extras/entities.html)\
  \ 处的列表）。此外，不要忘记设置你的代码编辑器，使其以正确的编码（如 UTF-8）保存你的页面，这样特殊字符才能被正确保存（参见第 2 章中的“保存你的 Web\
  \ 页面”）。\n\n***\n\n### 创建标题\n\nHTML 提供了六级标题，用于在页面中建立信息的层级结构。使用 `h1`–`h6` 元素之一标记每个标题，其中\
  \ `h1` 是顶层标题，`h2` 是 `h1` 的子标题，`h3` 是 `h2` 的子标题，以此此类推。正如你将学到的，标题是任何页面中最重要的 HTML 元素之一。\n\
  \n将 `h1`–`h6` 标题想象成你编写的非 HTML 文档中的标题，例如销售报告、学期论文、产品说明书、新闻文章——你明白我的意思。当你编写这类文档时，你会根据情况用标题和任意数量的子标题（以及*子*-子标题，等等）来标识每个主要内容部分。这些标题共同构成了文档的大纲。你的\
  \ Web 页面也是如此 ![Image](img/red_circle-a.jpg)。我将在下一节中更详致、更深入地讨论这一点，即“理解 HTML5 的文档大纲”。\n\
  \n![Image](img/red_circle-a.jpg) 使用标题来定义你的文档结构，就像大纲一样。在这里，“La Casa Milà”和“La Sagrada\
  \ Família”被标记为 `h2` 元素是顶层标题“Antoni Gaudí”的子标题，因为它是 `h1`。（`lang=\"es\"` 部分表示内容是西班牙语；它不影响大纲。）如果“La\
  \ Sagrada Família”是 `h3` 而不是，那么它就是“La Casa Milà”的子标题（以及“Antoni Gaudí”的子-子标题）。每个标题之间的空行完全可选，且对内容的显示没有影响。如果我现在编写页面的其余部分，相关内容（段落、图像、视频等）将紧随每个标题。你将在随后的页面中看到这些示例。\n\
  \n***\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
  UTF-8\" />\n    <title>Antoni Gaudí - Introduction </title>\n</head>\n<body>\n<h1>Antoni\
  \ Gaudí</h1>\n<h2 lang=\"es\">La Casa Milà</h2>\n<h2 lang=\"es\">La Sagrada Família</h2>\n\
  </body>\n</html>\n```\n\n***\n\n### 使用标题来组织你的 Web 页面\n\n**1.** 在 HTML 文档的 body 部分，输入\
  \ `<hn>`，其中 `n` 是 1 到 6 之间的数字，取决于你想要创建的标题的重要性级别。`h1` 最重要，`h6` 最不重要。\n\n**2.** 输入标题的内容。\n\
  \n**3.** 输入 `</hn>`，其中 `n` 是步骤 1 中使用的相同数字。\n\n***\n\n**提示**\n\n你的 `h1`–`h6` 标题由于它们对定义页面大纲的影响而特别重要。默认情况下，浏览器会从\
  \ `h1` 到 `h6` 逐渐减小地显示标题 ![Image](img/red_circle-b.jpg)。但不要忘记完全根据内容适合的层级结构来选择标题级别，而不是根据你希望文本显示有多大或多小。这使得你的页面在语义上更强大，从而改进了\
  \ SEO 和可访问性。你可以随意使用特定的字体、大小、颜色等对标题进行样式处理。关于如何通过 `CSS` 实现此点的细节，请参阅第 10 章。\n\n![Image](img/red_circle-b.jpg)\
  \ 虽然所有标题默认加粗显示，但 `h1` 的字体比 `h2` 大，`h2` 比 `h3` 大，以此此类推。但正如你所知，在决定使用哪种标题级别时，外观并不相关。你可以用\
  \ `CSS` 改变呈现方式。\n\n![Image](img/3_05.jpg)\n\n***\n\n***\n\n**提示**\n\n搜索引擎非常看重你的标题，特别是\
  \ `h1` 之类的标题（这并不是说让你的页面堆满 `h1`；搜索引擎很精明，能看出这一点）。同时，屏幕阅读器用户通常通过键盘通过标题导航页面，因为这让他们能够快速评估页面内容并找到他们最感兴趣的内容，而无需听完整个页面。这更是要建立逻辑标题层级的充分理由。\n\
  \n***\n\n***\n\n**提示**\n\n在整个网站中使用一致的标题级别，以获得更好的用户体验。\n\n***\n\n***\n\n**提示**\n\n\
  如果你想创建一个直接指向某个标题的链接，可以为标题添加 `id`（参见第 6 章中的“创建锚点”）。\n\n***\n\n***\n\n**提示**\n\n顺便提一下，在\
  \ ![Image](img/gray_circle-a.jpg) 中，我在每个 `h2` 上使用了 `lang` 属性，以指示其内容与 `<html lang=\"\
  en\">` 声明的页面默认语言（英语）不同（西班牙语，用语言代码 `es` 表示）。\n\n***\n\n## 理解 HTML5 的文档大纲\n\n在上一节中，你学习了标题元素\
  \ `h1`–`h6` 有助于构建你的 HTML 页面大纲。在这一节中，你将更深入地研究，了解一些 HTML5 特有的元素也是如何影响大纲的。\n\n在继续之前有一个语法说明。在接下来的讨论和页面中，我经常使用“section”作为一个通用术语，指代页面的一个不同部分，而不是特指\
  \ `section` 元素（你将学习到它）。当我*确实*指的是 `section` 元素时，该单词将像代码一样设置样式。\n\n好，继续。\n\n所以你知道标题元素\
  \ `h1`–`h6` 构成了 HTML 文档的底层大纲。这个大纲就像目录，对搜索引擎和屏幕阅读器是有意义的。虽然浏览器可能不会显式显示它，但它们提供了方法。\n\
  \n在 HTML5 之前的 HTML 和 XHTML 版本中，`h1`–`h6` 元素是构建结构大纲的全部。HTML5 则包含了四个分区块元素——`article`、`aside`、`nav`\
  \ 和 `section`——它们划分了文档中的不同部分。这意味着每个区块元素都有它们自己的 `h1`–`h6` 层级结构，这是该语言以前版本的重大变化。此外，页面中存在多个\
  \ `h1` 是允许的，而且是 HTML5 规范通常建议的（然而，先留这个想法；很快我就会解释为什么你应该限制 `h1`）。\n\n所有这些内容都会影响大纲。让我们比较两个等效的大纲，看看它是如何运作的。对于两者，假设每个标题后面都紧跟了一系列段落和其他内容，代表该部分的信息。\n\
  \n第一个大纲是完全有效的 HTML5，对于有 HTML 经验的人来说很熟悉，它只使用了标题元素 ![Image](img/red_circle-a.jpg)。\n\
  \n![Image](img/red_circle-a.jpg) 版本 1 文档大纲\n\n***\n\n（HTML 代码块同上）\n\n***\n\n第二个版本\
  \ 同时也使用了标题和 HTML5 的 section 元素，包含一个嵌套 section。（注意：代码缩进并不重要，也不会影响大纲，但它确实让你清楚哪些元素包含在其他元素中。）![Image](img/red_circle-b.jpg)\
  \ 版本 2 文档大纲（与版本 1 大纲相同，但标记更具意义）\n\n***\n\n***\n\n```html\n<body>\n<section>\n```\n\
  \n\n\n\n\n# HTML5 文档大纲与标题最佳实践\n\n## 示例：带有分节元素的 HTML\n\n```html\n        <h1>Setting\
  \ it Up</h1>\n\n       </section>\n\n       <section>\n\n        <h1>Basic Features</h1>\n\
  \n        <section> <!-- 嵌套，因此它是父元素的子章节 -->\n\n           <h1>Video Playback</h1>\n\
  \n        </section>\n\n       </section>\n\n       <section>\n\n        <h1>Advanced\
  \ Features</h1>\n\n       </section>\n</body>\n\n</html>\n```\n\n早些时候，我提到过浏览器尚未向你展示大纲。不过，你可以使用\
  \ Geoffrey Sneddon 的 HTML 5 Outliner ([`gsnedders.html5.org/outliner/`](http://gsnedders.html5.org/outliner/))\
  \ 来检查，这是一个简单但极好的工具，可以展示你文档大纲的可视化表示。使用它生成版本 1 和版本 2 的大纲 (![Image](img/gray_circle-a.jpg)\
  \ 和 ![Image](img/gray_circle-b.jpg)) 显示，尽管它们的 h1–h6 标题级别不同，但两者都会生成如下大纲：\n\n**1.**\
  \ 产品用户指南\n**1.** 设置环境\n**2.** 基础功能\n**1.** 视频播放\n**3.** 高级功能\n\n如你所见，版本 2 ![Image](img/gray_circle-b.jpg)\
  \ 中的每个 `section` 元素都成为了其最近的 h1–h6 或分节内容祖先（在此例中也是 `section`）的子章节。我之前提到的所有四个 HTML5\
  \ 分节内容元素（article、aside、nav 和 section）都具有相同的行为，即使它们是混合在一起的也是如此。\n\n相比之下，如果版本 2 ![Image](img/gray_circle-b.jpg)\
  \ 没有 `section`——我们称之为版本 3 ![Image](img/red_circle-c.jpg)——它的大纲将会非常不同。\n\n![Image](img/red_circle-c.jpg)\
  \ 版本 3 文档大纲（与版本 1 和 2 的大纲不同）\n\n---\n\n## 示例：不带分节元素的 HTML\n\n```html\n<body>\n\n\
         <h1>Product User Guide</h1>\n\n       <h1>Setting it Up</h1>\n\n       <h1>Basic\
  \ Features</h1>\n\n       <h1>Video Playback</h1>\n\n       <h1>Advanced Features</h1>\n\
  \n</body>\n\n</html>\n```\n\n具体来说，每个标题将处于相同的重要性级别 h1，这意味着不会有*任何*子标题（或子子标题）：\n\n\
  **1.** 产品用户指南\n**2.** 设置环境\n**3.** 基础功能\n**4.** 视频播放\n**5.** 高级功能\n\n对于含义相同的大纲（即版本\
  \ 1 和版本 2），两者都是有效的 HTML5，但后者更优，因为 `section` 元素在语义上更显式。在实践中，你可以用一个 `article` 元素包裹版本\
  \ 2 的所有内容，因为在当前语境下这样更为合适（尽管生成的大纲略有不同）。图 ![Image](img/red_circle-d.jpg) 显示了一个示例。\n\
  \n![Image](img/red_circle-d.jpg) 具有显式语义的示例大纲\n\n---\n\n## 示例：带有 article 和 section\
  \ 的 HTML\n\n```html\n<body>\n\n       <article>\n\n         <h1>Product User Guide</h1>\n\
  \n         <section>\n\n           <h1>Setting it Up</h1>\n\n         </section>\n\
  \n         <section>\n\n           <h1>Basic Features</h1>\n\n           <section>\n\
  \n              <h1>Video Playback</h1>\n\n           </section>\n\n          </section>\n\
  \n          <section>\n\n            <h1>Advanced Features</h1>\n\n          </section>\n\
  \n       </article>\n\n</body>\n\n</html>\n```\n\n不要忘记，每个标题后面还会跟着相关的文本、图像和其他内容，你将在学习过程中了解到这些。但目前，我省略了这些内容，以便你专注于标题和大纲。\n\
  \n## 生态系统考虑\n\n等一下！你还需要对代码进行另一种调整。还记得我说过“等一下，我将解释你为什么要限制 h1”吗？虽然每个分节内容元素（article、aside、nav\
  \ 和 section）*可以*用 h1 开始层级，但这并不是强制的。事实上，在可预未来，如果它们是现有 h1 相关内容的子章节，你最好从 h2 或更低级别开始。\n\
  \n原因如下：\n\nWeb 世界有很多不断变化的部分。新规范（如 HTML5）每天都在变化，直到最终确定（这在 HTML5 上尚未发生）。新版本的浏览器正在发布。新版本的屏幕阅读器和其他辅助技术也在开发和发布。不仅如此，尽管现代浏览器支持许多\
  \ HTML5 功能，但目前还没有向屏幕阅读器暴露 HTML5 的大纲，屏幕阅读器也没有向用户暴露。\n\n简而言之，这意味着屏幕阅读器和其他辅助技术无法区分直接位于\
  \ body 中的 h1 与位于 article、aside、nav 或 section 之中的 h1。从它们的角度来看，它们都是顶层 h1。Opera 的 Web\
  \ Evangelist Bruce Lawson 是我第一个指出这一点的人（[www.brucelawson.co.uk/2009/headings-in-html-5-and-accessibility/](http://www.brucelawson.co.uk/2009/headings-in-html-5-and-accessibility/)）；注意该\
  \ URL 中的某些信息已过时，因为规范发生了变化。请看他最近的 *Introducing HTML5*（由 Remy Sharp 编写）。\n\n与此同时，屏幕阅读器用户没有奢侈等待\
  \ Web 跟上他们的需求。他们将继续像通常一样利用标题来获取页面概述并进行导航。有意义的标题层级会让这变得更容易，并为他们在网站上提供更好的体验。\n\n因此，在生态系统跟上之前，如果你使用\
  \ h1–h6 显式表示层级的标题，你和你的用户都会受益，就像没有分节元素一样。Lawson 和该领域的其他人都推荐这种方法，包括我在内。\n\n让我们看看如何\
  \ ![Image](img/red_circle-e.jpg)。\n\n![Image](img/red_circle-e.jpg) 版本 4（四个版本中推荐的标题方法）\n\
  \n---\n\n## 示例：推荐的标题级别\n\n```html\n<body>\n\n<article>\n\n      <h1>Product User\
  \ Guide</h1>\n\n      <section>\n\n        <h2>Setting it Up</h2>\n\n      </section>\n\
  \n      <section>\n\n        <h2>Basic Features</h2>\n\n         <section>\n\n            <h3>Video\
  \ Playback</h3>\n\n         </section>\n\n        </section>\n\n      <section>\n\
  \n        <h2>Advanced Features</h2>\n\n      </section>\n\n</article>\n\n</body>\n\
  \n</html>\n```\n\n过去在分节元素第一层级的 h1 现在现在是 h2，而嵌套在另一个 `section` 之中的“视频播放”标题现在是 h3 而不是\
  \ h1。文档大纲没有改变，只有标题级别变了。\n\n此示例仅演示了 h1–h3，但如果你的内容需要，请在页面中也使用 h4–h6。例如，“视频播放”的子标题将是\
  \ h4（带有或不父分节元素，视情况而定），依此类推。\n\n并记住，此建议适用于所有分节元素——article、aside、nav 和 section——而不仅仅是示例中显示的。\n\
  \n## 结论\n\n如果任何内容你还没有完全理解，我建议重新阅读这段关于 HTML5 文档大纲的讨论。它并没有看起来有那么复杂。我强烈建议你创建各种测试页面并对比\
  \ HTML5 Outliner 中的结果，以更好地感受大纲算法是如何运作的。在项目工作期间也使用该 Outliner，以确保你的结构符合预期。\n\n\n\n\
  \n请不要认为你必须始终使用 `article` 元素，或者一个 `section` 必须始终（且只能）嵌套在 `article` 中。我们之前讨论的示例只是使用这些元素的一种方式；事实上，相同的内容可以通过几种不同的方式进行标记，并且仍然是有效的\
  \ HTML5。我将在本章的稍后部分详细解释 `article` 和 `section`，正如你所看到的，取决于你的内容，它们有几种应用。\n\n* *\n\n\
  * *\n\n# HTML5 大纲算法如何帮助分发内容\n\n如果你一直关注到现在，你会发现——由于其作为分节内容的属性以及 HTML5 大纲算法的规则——每个\
  \ `article`、`aside`、`nav` 和 `section` 都有自己的大纲，该大纲可能从 `h1` 开始一直到 `h6`。\n\n除了为你的文档标题提供了很大的灵活性外，这还有一个不那么明显的益处：它允许你的内容出现在其他页面上，甚至是其他网站上，而不会破坏父级文档的大纲。而且它的大纲也依然保持完整。\n\
  \n如今，网站之间的内容共享比以往任何时候都要频繁。你有新闻聚合网站、带有 RSS 馈的博客、Twitter Feed 等等。正如你将在 `创建文章` 中学习到的那样，`article`\
  \ 元素代表一个自包含的组合作品，它可以被分发（不是必须的，只是这样做是合适的）。\n\n想象一下来自一个网站的以下文章显示在另一个网站上：\n\n...\n\n\
  ```html\n<h2>来自世界各地的新闻</h2>\n\n<article>\n    <h1>当地青少年更偏爱黑胶片而非数字</h1>\n    <p>当地一名青少年将她所有的数字曲目替换成了黑胶片。“这很酷，”她对着唱片说道。</p>\n\
  \    <h2>听完第一张专辑后痴迷了</h2>\n    ...\n</article>\n```\n\n...\n\n使用 HTML5 Outliner\
  \ 检查代码，后，你会看到这些：\n\n**1.** 来自世界各地的新闻\n**1.** 当地青少年更偏爱黑胶片而非数字\n**1.** 听完第一张专辑后痴迷了\n\
  \n所以，尽管青少年标题的级别（`h1`）比它所所属的 `h2` 高，但它是该 `h2` 的子标题，因为它包含在该标题下的一个 `article` 中。而“痴迷了”\
  \ `h2` 是新闻 `h2` 的子子标题，而不是平级关系。\n\n新闻标题可以是 `h3`、`h4` 或任何级别的标题，大纲将完全相同。“当地青少年”和“痴迷了”也是如此，只要“当地青少年”拥有更高的标题级别。\n\
  \n* *\n\n## 分组标题\n\n有时一个标题具有多个连续的级别，例如新闻副标题、备选标题或标语。将它们分组在一个 `hgroup` 元素中，表示它们是相关的\
  \ ![Image](img/red_circle-a.jpg)。每个 `hgroup` 只能包含两个或多个 `h1`–`h6` 标题；不允许包含其他元素。\n\
  \n![Image](img/red_circle-a.jpg) 两个相关的标题被分在一起。在这个示例中，`h2` 是文章 `h1` 标题的子标题。因为它使用了最高优先级的标题标记，因此只有“长颈鹿从动物园逃脱”出现在文档大纲中，两者在浏览器中都会显示，正如预期的那样\
  \ ![Image](img/gray_circle-b.jpg)。同样，如果第二个 `h1` 出现在它的 `hgroup` 中，它将像 `h2` 一样被从大纲中排除。此外，由于\
  \ `h2` 未出现在大纲中，文章中的下一个标题可以是 `h2`（而不是 `h3`），并被理解为 `h1`“长颈鹿从动物园逃脱”的直接子标题。\n\n* *\n\
  \n...\n\n```html\n<body>\n\n<article>\n    <hgroup>\n        <h1>长颈鹿从动物园逃脱</h1>\n\
  \        <h2>全世界范围内欢欣</h2>\n    </hgroup>\n    <p>... [文章内容] ...</p>\n</article>\n\
  </body>\n</html>\n```\n\n* *\n\n只有 `hgroup` 中最高优先级标题的第一个实例会出现在文档大纲中（参见 `理解 HTML5\
  \ 文档大纲`）。所以这可能是你选择使用 `hgroup` 时的另一个决定因素。不过，需要说明的是，`hgroup` 中的所有标题都会在浏览器中显示 ![Image](img/red_circle-b.jpg)。\n\
  \n![Image](img/red_circle-b.jpg) 两个标题在浏览器中的显示方式就像它们没有包含在 `hgroup` 中一样。\n\n![Image](img/3_07.jpg)\n\
  \n### 分组两个或多个标题\n\n1. 输入 `<hgroup>`。\n2. 输入 `<hn>`，其中 `n` 是 1 到 6 之间的数字，取决于你想创建的标题的重要性级别。\n\
  3. 输入标题的内容。\n4. 输入 `</hn>`，其中 `n` 是与第 2 步相同的数字。\n5. 重复步骤 2 到 4，直到包含你所有想要加入 `hgroup`\
  \ 的标题为止。\n6. 输入 `</hgroup>`。\n\n* *\n\n提示\n不要只对一个标题使用 `hgroup`。\n\n* *\n\n提示\n如所述，`hgroup`\
  \ 中最高优先级标题的第一个实例会出现在文档大纲中。因此，如果你的 `hgroup` 拥有 `h2`，顺序将会是。\n* *\n\n## 常见页面结构\n\n\
  无疑你访问过许多此类布局的网站 ![Image](img/red_circle-a.jpg)。剥离内容后，你可以看到四个主要部分：带有导航的页眉、内容区域、侧边栏和页脚\
  \ ![Image](img/red_circle-b.jpg)。\n\n![Image](img/red_circle-a.jpg) 一种常见的布局，顶部是导航，左侧是内容，右侧是侧边栏，底部是页脚。\n\
  \n![Image](img/3_08.jpg)\n\n![Image](img/red_circle-b.jpg) 页面常见的信息类型。\n\n![Image](img/3_09.jpg)\n\
  \n现在，没有 CSS，你无法像这样 ![Image](img/gray_circle-a.jpg) 样式化，或者像图中所示排列。你将在第 7 章 开始学习 CSS，在第\
  \ 10 章 查看如何格式文本并添加颜色，并在第 11 章 进行多列布局。\n\n然而，无论布局如何，适用于这些页面结构的语义是非常相似的。你将在本章剩余的页面中探索它们。从页面顶部开始，你将看到如何使用\
  \ `header`、`nav`、`article`、`section`、`aside` 和 `footer` 元素来定义页面结构，然后如何使用 `div` 作为额外样式和其他目的的通用容器。除了\
  \ `div` 之外，这些元素在 HTML5 出现之前并不存在。你已经在之前的代码示例中见过其中的一些。\n\n### 创建头部\n\n如果页面的某个部分包含引导或导航性内容，请使用\
  \ `header` 元素对其进行标记。\n\n页面可以包含任意数量的 `header` 元素，其含义取决于上下文。例如，页面顶部或靠近顶部的 `header`\
  \ 可能代表整个页面的头部（有时称为页眉）。\n\n\n\n\n![Image](img/red_circle-a.jpg) 此头部代表了整个页面的头部。它包含一个位于\
  \ `nav` 元素中的链接列表，用于表示页面上的主要导航集。请参见 ![Image](img/gray_circle-c.jpg) 以了解为了可访问性在页面级头部上应用可选的\
  \ `role=\"banner\"` 的示例。（请参见“标记导航”了解适用于 `nav` 元素的特定 role 值。）\n\n```html\n<body>\n\
  \  <header>\n    <nav>\n      <ul>\n        <li><a href=\"#gaudi\">Barcelona's Architect</a></li>\n\
  \        <li lang=\"es\"><a href=\"#sagrada-familia\">La Sagrada Família</a> </li>>\n\
  \        <li><a href=\"#park-guell\">Park Guell</a></li>\n      </ul>\n    </nav>\n\
  \  </header>\n</body>\n</html>\n```\n\n![Image](img/red_circle-b.jpg) 包含导航的页面级头部。\n\
  \n![Image](img/3_10.jpg)\n\n头部也适用于标记页面深处的一组介绍性或导航性内容。一个示例是章节目录 ![Image](img/red_circle-c.jpg)（在下一页）。\n\
  \n![Image](img/red_circle-c.jpg) 此页面有两个头部：一个作为整个页面的头部，另一个作为“常见问题”父文章元素的头部。请注意，第一个没有任何\
  \ `h1–h6` 标题，但第二个有。请参见本节的最后一个提示，以获取有关在第一个头部上显示的可选 role 属性的信息。\n\n```html\n<body>\n\
  \  <header role=\"banner\">\n    ... [网站标志、导航、等] ...\n  </header>\n  <article>\n\
  \    <header>\n      <h1>Frequently Asked Questions</h1>\n      <nav>\n        <ul>\n\
  \          <li><a href=\"#answer1\">What is your return policy?</a></li>\n     \
  \     <li><a href=\"#answer2\">How do I find a location?</a></li>\n          ...\n\
  \        </ul>\n      </nav>\n    </header>\n    <!-- header 链接指向这些内容 -->\n    <article\
  \ id=\"answer1\">\n      <h2>What is your return policy?</h2>\n      <p> ... [answer]\
  \ ... </p>\n    </article>\n    <article id=\"answer2\">\n      <h2>How do I find\
  \ a location?</h2>\n      <p> ... [answer] ... </p>\n    </article>\n    ...\n \
  \ </article> <!-- 父文章结束 -->\n</body>\n</html>\n```\n\nheader 元素是我提到的四种区块内容元素之一（在“[理解\
  \ HTML5 的文档大纲”中提到）。这意味着从文档大纲的角度来看，header 内部的任何 `h1–h6` 标题都被认为处于 header 的语文中——而不是整个页面。因此，header\
  \ 通常会包含其所在章节的标题（一个 `h1–h6` 或 `hgroup`），但这并不是强制的。例如，你在 ![Image](img/gray_circle-c.jpg)\
  \ 中看到了标题，但在 ![Image](img/gray_circle-a.jpg) 中没有。\n\n### 创建头部\n\n1. 将光标置于你想要创建头部的元素中。\n\
  2. 输入 `<header>`。\n3. 输入头部的内容，其中可以包含用各自的 HTML 元素标记的各种内容类型（大部分内容你将在书的其余部分学习）。例如，一个头部可能包含\
  \ `h1–h6` 标题、标志或系列标志、导航、搜索框等。\n4. 输入 `</header>`。\n\n**提示**：不要不必要使用 `header`。如果你只有\
  \ `h1–h6` 或 `hgroup`，且没有值得与其分组的伴随内容，那么在大多数情况下，没有必要将它们封装在 `header` 中。\n\n**提示**：`header`\
  \ 与 `h1–h6` 元素中的标题（heading）不是互换的（参见“创建标题”）。它们有各自的语义目的。\n\n**提示**：你不能在 `header` 内部嵌套\
  \ `footer` 元素或另一个 `header`，也不可以在 `footer` 或 `address` 元素中嵌套 `header`。\n\n**提示**：`header`\
  \ 并不总是必须像示例那样包含一个 `nav` 元素（![Image](img/gray_circle-a.jpg) 和 ![Image](img/gray_circle-c.jpg)），但在大多数情况下，如果\
  \ `header` 包含导航链接，它很可能会包含。在 ![Image](img/gray_circle-c.jpg) 的情况下，在常见问题列表周围使用 `nav`\
  \ 是合适的，正如“标记导航”中讨论的那样。\n\n**提示**：参见“创建通用容器”了解 `header` 如何取代 HTML5 时代之前 `div` 元素的作用之一的。\n\
  \n**提示**：参见“使用 ARIA 提高可访问性”了解如何通过 ARIA 提高可访问性。\n\n### 标记导航\n\n早期的 HTML 版本没有显式表示导航的元素，但\
  \ HTML5 有了：`nav` 元素。![Image](img/red_circle-a.jpg) 使用 `nav` 来表示页面的重要链接集，而不是所有的链接。![Image](img/red_circle-a.jpg)\
  \ `nav` 元素通常会将链接结构化为 `ul`（无序列表）中，除非链接的顺序具有意义（在这种情况下，你应该将它们结构化为 `ol`，有序列表）。请参见第 15\
  \ 章了解更多关于列表的信息。`role` 属性不是必须的，但可以提高可访问性。\n\n```html\n<body>\n  <header>\n    <nav\
  \ role=\"navigation\">\n      <ul>\n        <li><a href=\"#gaudi\">Barcelona's Architect</a></li>\n\
  \        <li lang=\"es\"><a href=\"#sagrada-familia\">La Sagrada Família</a> </li>>\n\
  \        <li><a href=\"#park-guell\">Park Guell</a></li>\n      </ul>\n    </nav>\n\
  \  </header>\n</body>\n</html>\n```\n\n如果你仔细查看上一节的代码，你就了解了 `nav` 元素的用法。我将该代码示例带到了此页面，同时突出了\
  \ ![Image](img/gray_circle-a.jpg)。`nav` 元素对其内容没有实施任何默认格式![Image](img/red_circle-b.jpg)。我们的导航默认看起来非常普通。列表符号出现是因为每个链接都在\
  \ `li` 元素（列表项）中。通过 CSS，你可以关闭符号或显示不同的符号，还可以水平布局链接、更改它们的颜色、使其看起来像按钮等。你将在第 7 章开始学习\
  \ CSS。\n\n![Image](img/3_11.jpg)\n\n### 将一组链接标记为重要导航\n\n1. 输入 `<nav>`。\n2. 输入结构化为\
  \ `ul`（无序列表）的链接列表，除非链接的顺序很重要（例如面包屑导航），在这种情况下，你应该将它们结构化为 `ol`（有序列表）。请分别参见第 6 章和第\
  \ 15 章以了解链接和列表。）\n3. 输入 `</nav>`。\n\n**提示**：如果你具有某些 HTML 或 XHTML 经验，你可能习惯于根据情况将链接结构化在\
  \ `ul` 或 `ol` 元素中。在 HTML5 中，`nav` 取代这种最佳实践；继续使用这些元素，并在它们周围封装一个 `nav` 即可![Image](img/gray_circle-a.jpg)。\n\
  \n**提示**：尽管屏幕阅读器整体仍在跟进 HTML5 的新语义，但 `nav` 元素可以帮助它们识别页面的重要导航，并允许用户通过键盘跳转到这些地方。这增加了你页面的可访问性，提高了访问者的体验。\n\
  \n\n\n\n\nHTML5 规范建议不要将像“使用条款”和“隐私政策”之类的辅助性页脚链接封装在 `nav` 中，这是有道理的。然而，有时你的页面页脚会重申顶部的全局导航，或者包含其他如“店铺查询器”和“职业机会”等重要链接。在大多数情况下，我建议将这些类型的页脚链接放在\
  \ `nav` 中。\n\n> 提示\n> HTML5 不允许在 `address` 元素中嵌套 `nav`。\n\n> 提示\n> 参阅“使用 ARIA 提高可访问性”来了解如何配合\
  \ `nav` 使用 `role=\"navigation\"` ![Image](img/gray_circle-a.jpg)。\n\n## 深入研究 `nav`\
  \ \n\n正如我之前提到的的，仅仅因为你的页面中有一组链接，并不意味着它们应该被包含在 `nav` 中。\n\n下面的示例新闻页面包含了四个链接列表，其中只有两个被认为足够重要，足以被封装在\
  \ `nav` 中。（正如你所看到的，我简写了部分代码。）\n\n```html\n<body>\n    <header>\n        <!-- site\
  \ logo could go here -->\n        <!-- site global navigation -->\n        <nav>\n\
  \            <ul> ... </ul>\n        </nav>\n    </header>\n    <div id=\"main\"\
  >\n        <h1>Arts &amp; Entertainment</h1>\n        <article>\n            <h1>画廊开幕式：激发灵感与启发</h1>\n\
  \            <p>... [story content] ... </p>\n            <aside>\n            \
  \    <h1>Other Stories</h1>\n                <!-- not wrapped in nav -->\n     \
  \           <ul> ... [story links] ... </ul>\n            </aside>\n        </article>\n\
  \    </div>\n    <aside id=\"sidebar\">\n        <nav><!-- secondary navigation\
  \ -->\n            <ul>\n                <li><a href=\"/arts/movies/\">Movies</a></li>\n\
  \                <li><a href=\"/arts/music/\">Music</a></li>\n                ...\n\
  \            </ul>\n        </nav>\n    </aside>\n    <footer>\n        <!-- Ancillary\
  \ links not wrapped in nav. -->\n        <ul> ... </ul>\n    </footer>\n</body>\n\
  </html>\n```\n\n`aside` 中的次级导航（参阅“指定 Aside”）允许用户导航到“艺术与娱乐”目录下的其他页面，因此它构成了页面的主要导航部分。然而，带有链接的“Other\
  \ Stories” `aside` 则不是。\n\n那么，你如何决定一组链接何时值得使用 `nav` 呢？归结底，这是基于你的内容进行的判断。至少，要用 `nav`\
  \ 标记你网站的全局导航（即允许用户跳转到网站不同部分的内容）。通常情况下（但并非总是），那个特定的 `nav` 会出现在页面层级的 `header` 元素中（参阅“创建\
  \ Header”）。\n\n## 创建 Article\n\n得益于 HTML5 的另一个元素是 `article` ![Image](img/red_circle-a.jpg)。你已经看到过它的一些运行示例。现在让我们学习更多关于它的运作原理。\n\
  \n![Image](img/red_circle-a.jpg) 为了保持简单，我简写了 `article` 的内容和上一节的 `nav` 代码。你可以在 `www.bruceontheloose.com/htmlcss/examples/`\
  \ 查看页面代码的完整版本。尽管这个示例包含了段落和图像，但 `article` 可以包含各种内容类型，例如视频、插图、列表等。\n\n```html\n<body>\n\
  \    <header>\n        <nav role=\"navigation\">\n            ... [ul with links]\
  \ ...\n        </nav>\n    </header>\n    <article>\n        <h1 id=\"gaudi\">巴塞罗的建筑师</h1>\n\
  \        <p>安东尼·高迪惊叹的建筑每年为巴塞罗纳吸引了数百万游客。</p>\n        <p>高迪不墨守规的在青少年时期就已显而易见，加之他对教会安静但坚定的奉献，为他的思想和理念奠定了独特的。。基于对自然的细致观察，对简单的追求在他的作品中表现得显而易见，从\
  \ <a href=\"#park-guell\">奎尔公园</a> 及其不可思议的雕塑和马赛克，到 <a href=\"#sagrada-familia\"\
  >圣家族教堂</a>及其有机的、泡状的塔。</p>\n        <h2 id=\"sagrada-familia\" lang=\"es\">La Sagrada\
  \ Família</h2>\n        ... [image and paragraphs] ...\n        <h2 id=\"park-guell\"\
  >奎尔公园</h2>\n        ... [image and paragraphs] ...\n    </article>\n</body>\n</html>\n\
  ```\n\n根据它的名字，你很可能猜到可以使用 `article` 来包含像报文章这样的内容。然而，它不仅限于此。在 HTML5 中，“article”更类似于“项目（item）”。以下是\
  \ HTML5 对它的定义：\n\n`article` 元素代表文档、页面、应用程序或网站中的一个自包含的组合，在原则上它是可以独立分发或重用的，例如在分发中。这可以是一个论坛帖子、杂志或报纸文章、博客文章、用户提交的评论、交互式组件或工具，或任何其他独立的内容项。\n\
  \n其他 `article` 示例可以是电影评论、案例研究、产品描述等。\n\n### 创建 article\n\n1. 输入 `<article>`。\n2.\
  \ 输入 `article` 的内容，可以是任何数量的元素，如段落、列表、音频、视频等。\n3. 输入 `</article>`。\n\n![Image](img/red_circle-b)\
  \ 现在页面拥有 `header`、`nav` 和 `article` 元素以及它们的内容。`article` 的标题默认大小取决于浏览器。你可以使用 CSS\
  \ 跨浏览器统一它们的外观（参阅第十章）。\n\n![Image](img/3_12.jpg) \n\n> 提示\n> 正如你在“HTML5 文档大纲”中中学到的，`article`\
  \ 是与 `header`、`section` 和 `aside` 并列的区块元素。\n\n> 提示\n> 只要内部的 `article` 与整体相关，就可以嵌套\
  \ `article`。但你不能在 `address` 元素中嵌套 `article`。\n\n> 提示\n> 页面可以包含多个 `article` 元素（或者一个都没有）。例如，博客首页通常包含几个最新的帖子；每个都可以是自己的\
  \ `article`。\n\n> 提示\n> 并不强制 `article` 必须包含一个或多个 `section` 元素。让 `article` 内部的 `h1`-`h6`\
  \ 元素独立存在也是完全有效的，通过定义 section，你使 `article` 的语义更加明确。而且每个 section 都有自己的标题层级，正如在“HTML5\
  \ 文档大纲”中所讨论的。\n\n> 提示\n> `article` 和 `section` 元素很容易混淆（这种混淆是合理的），这就是为什么我直接引用了 HTML5\
  \ 的定义；我不希望你通过过滤来学习它们。我在“定义 Section”中讨论了 `section` 以及在两者之间选择。\n\n> 提示\n> 参阅“使用 ARIA\
  \ 提高可访问性”来了解在特定情况下如何配合 `article` 使用 `role=\"main\"`。将其应用于 ![Image](img/gray_circle-a.jpg)\
  \ 中的 article 是合适的，因为它是页面主要内容的容器，但我省略它是为了避免给人 `role=\"main\"` 适用于所有 `article` 元素的印象。\n\
  \n## 更多 article 示例\n\n之前的示例 ![Image](img/gray_circle-a.jpg) 只是使用 `article` 的方法之一。让我们更多可能性。\n\
  \n**示例 1（基础 article）：**\n\n```html\n<article>\n    <h1>巴塞罗那的多样性</h1>\n    <p>巴布亚新内亚拥有\
  \ 800 多个部落和语言……</p>\n    ... [rest of story content] ...\n    <footer> <!--该 article\
  \ 的页脚，而不是页面的 --></footer>\n</article>\n```\n\n\n\n\nLeandra Allen 是一位自由职业记者，她在哥本哈根大学获得了人类学学位。\n\
  \n你可以通过 `leandra@therunningwriter.com` 联系她。\n\n请注意 `footer` 和 `address` 元素的使用（分别参见本章和第\
  \ 4 章中对它们的讨论）。在这里，`address` 仅适用于其父级文章（即显示的这个），而不适用于整个页面或该文章内嵌套的任何文章，例如示例 2 中的读者评论。\n\
  \n示例 2 以用户提交评论的形式展示了父文章中的嵌套文章元素，就像你在博客或新闻网站的评论区看到的内容。它还展示了 `section` 元素的一种用法（参见“定义一个章节”）以及\
  \ `time` 元素，后者在第 4 章中有所介绍。\n\n### 示例 2（嵌套文章）\n\n```html\n<article>\n    <h1>巴布亚·新几内亚的多样性</h1>\n\
  \    ... [父级文章内容] ...\n    <footer>\n        ... [父级文章页脚] ...\n    </footer>\n \
  \   <section>\n        <h2>读者评论</h2>\n        <article>\n            <footer>travelgal\
  \ 写于 <time datetime=\"2011-11-17\" pubdate>2011 年 11 月 17 日</time>：</footer>\n \
  \           <p>很棒的文章！我一直对巴布亚·新几内亚非常好奇。</p>\n        </article>\n        <article>\n\
  \            ... [下一条读者评论] ...\n        </article>\n    </section>\n</article>\n\
  ```\n\n这些只是利用 article 及其伴随元素的几种常用方式。\n\n### 定义一个章节\n\n`article` 元素有一个语义特定性较低的兄弟元素\
  \ `section`，它是 HTML5 另一个特有的元素。\n\n在某种程度上，HTML5 对 `section` 定义如下：\n\n`section` 元素代表文档或应用程序的通用章节。在此语文中，`section`\
  \ 是内容的主题分组，通常带有一个标题 ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg)\
  \ 代码与之前相同，只是我在引言之后文章的两个部分中的每一个周围包裹了一个 `section`。为了简洁起见，我再次简化了代码。\n\n```html\n<body>\n\
  <header>\n    <nav role=\"navigation\">\n        ... [带有链接的 ul] ...\n    </nav>\n\
  </header>\n<article>\n    <h1 id=\"gaudi\">塞罗那的建筑师</h1>\n    <p>安东尼·高迪不可思议的建筑每年吸引数百万游客来到塞罗那。</p>\n\
  \    ... [另一个引言段落] ...\n    <section>\n        <h2 id=\"sagrada-familia\" lang=\"\
  es\">圣家族堂</h2>\n        <p><img src=\"img/towers.jpg\" width=\"75\" height=\"100\"\
  \ alt=\"圣家族堂塔\" /> 这个命名复杂且奇特未完工的杰作——圣家族赎罪教堂，是塞罗那最受欢迎的建筑。在这里，高迪将对自然和建筑的愿景与对信仰的虔诚结合在一起。圣家族堂之所以吸引大量非宗教人士前来造访，很大程度上是因为其悲剧性的故事和仍然未完工的状态，而无处不在脚手架和吊机正是其永久的提醒。</p>\n\
  \    </section>\n    <section>\n        <h2 id=\"park-guell\">桂尔公园</h2>\n      \
  \  ... [另一个图像和段落] ...\n    </section>\n</article>\n</body>\n```\n\n`sections` 的示例可以是章节、标签页中的各种标签页，或论文中的编号章节。一个网站的主页可以分为介绍部分、新闻条目和联系信息等多个章节。\n\
  \n`article` 和 `section` 元素非常相似。如果你不确定如何区分两者，请参见侧边栏“如何在 article 和 section 之间做出选择”\n\
  \n#### 如何定义一个章节\n\n1. 输入 `<section>`。\n2. 输入章节的内容，可以包含任何数量的元素，例如段落、列表、音频、视频、图像等。\n\
  3. 输入 `</section>`。\n\n正如你在“理解 HTML5 的大纲”中所学习到的，`section` 是与 `nav`、`article` 和 `aside`\
  \ 共同的四个章节元素之一。\n\n默认情况下，当你查看带有 `sections`（或 articles，同理）的页面时可能看不出区别，但重要的是通过使用它们来增强文档的语义化\
  \ ![Image](img/red_circle-b.jpg)。当然，你可以使用 CSS 为 `section` 和 `article` 元素样式。\n\n\
  记住 `section` 不是像 `div` 那样的通用容器，因为 `section` 传达含义，而 `div` 完全没有含义（参见“创建容器”）。\n\n本书中有很多示例可以帮助你直观感受如何以多种方式使用\
  \ article 和 section。参见“通过 ARIA 提高可访问性”学习在特定情况下配合 `section` 使用 `role=\"main\"`。\n\
  \n### 你如何在 article 和 section 之间做出？\n\n我故意引用了 HTML5 对 `section` 和 `article` 的定义。这样想：你的内容是一个独立的整体，还是一个适合分发的小部件？如果是，使用\
  \ `article`。（否则，大多数情况下使用 `section`，尽管参见“创建容器”了解何时使用 `div`。）这并不意味着你*必须*分发或发布 `article`\
  \ 内容，只要它适合。\n\n如果你仍然觉得 `article` 和 `section` 有时相似，不要担心，你并不孤单。经验丰富的开发者也会不同的使用这两个元素。正如第\
  \ 1 章提到的，在标记内容时并不总是有对错之分，大部分取决于对 HTML 元素的个人判断。\n\n所以，在 article 和 section 之间做出选择时要仔细考虑，但不必担心是否每次都正确。有时是主观的，无论如何，你的页面都能正常工作。而且没人会在半夜敲你的门。嗯，*我*可能会，但那是因为天黑而且很可怕。\n\
  \n### 没有 article 的 section 示例\n\n到为止，你看到的都是嵌套在 article 中的 section 示例 ![Image](img/gray_circle-a.jpg)。这只是该元素的一种用法。在下面来自\
  \ HTML5 规范的经过修改示例中，你看到在没有 `article` 的情况下使用了 `section`。（你还早早预览了有序列表的操作。在第 15 章中学习更多关于\
  \ `ol` 和其他列表元素。）\n\n```html\n<body>\n    <h1>毕业典流程</h1>\n    <section>\n       \
  \ <h2>仪式</h2>\n        <ol>\n            <li>开场游行</li>\n            <li>优秀毕业生代表演讲</li>\n\
  \            <li>班级代表演讲</li>\n            <li>颁发证书</li>\n            <li>校长结束致辞</li>\n\
  \        </ol>\n    </section>\n    <section>\n        <h2>毕业生（按字母顺序）</h2>\n   \
  \     <ol>\n            <li>Molly Carpenter</li>\n            <li>Anastasia Luccio</li>\n\
  \            <li>Ebenezar McCoy</li>\n            <li>Karrin Murphy</li>\n     \
  \       <li>Thomas Raith</li>\n            <li>Susan Rodriguez</li>\n        </ol>\n\
  \    </section>\n</body>\n```\n\n\n\n\n```\n   </section>\n\n</body>\n\n</html>\n\
  ```\n\n---\n\n### 指定 Aside（侧边内容）\n\n有时，你有一部分内容与页面上的主要内容有相关性，但它也可以独立存在![Image](img/red_circle-a.jpg)。你该如何在语义上表示这种关系？\n\
  \n![Image](img/red_circle-a.jpg) 这个 `aside` 包含了关于巴塞罗纳建筑奇迹的信息，与页面关注的安东尼·高迪（Antoni\
  \ Gaudí）内容相关，但它也可以独立存在。由于它们之间存在联系，我本可以将其嵌套在文章内部，但我决定将其放在文章之后，以便以后在视觉上将其作为侧边栏处理![Image](img/gray_circle-c.jpg)。`aside`\
  \ 上的 `role=\"complementary\"` 是可选的，但可以提高无障碍性。更多信息请参见最后的提示。\n\n---\n\n...\n\n```html\n\
  <body><body>\n\n<header>\n\n     <nav role=\"navigation\">\n\n        ... [包含链接的\
  \ ul] ...\n\n     </nav>\n\n</header>\n\n<article>\n\n     <h1 id=\"gaudi\">巴塞罗纳的建筑师</h1>\n\
  \n     ... [引言段落] ...\n\n     <section>\n\n        <h2 id=\"sagrada-familia\" lang=\"\
  es\">圣家族堂</h2>\n\n        ... [图片和段落] ...\n\n     </section>\n\n     <section>\n\
  \n        <h2 id=\"park-guell\">高迪尔公园</h2>\n\n        ... [另一张图片和段落] ...\n\n   \
  \  </section>\n\n</article>\n\n<aside role=\"complementary\">\n\n     <h1>巴塞罗纳的建筑奇迹</h1>\n\
  \n     <p>巴塞罗纳除了高迪的作品外，还有许多建筑奇迹。其中包括：</p>\n\n     <ul>\n\n       <li lang=\"es\"\
  >凯旋门 (Arc de Triomf)</li>\n       <li>大主教堂 <span lang=\"es\">(La Seu)</span></li>\n\
  \       <li lang=\"es\">列赛大剧院 (Gran Teatre del Liceu)</li>\n       <li lang=\"es\"\
  >密斯·凡·德·罗哈展馆 (Pavilion Mies van der Rohe)</li>\n       <li lang=\"es\">圣玛利亚教堂 (Santa\
  \ Maria del Mar)</li>\n\n     </ul>\n\n     <p>鸣谢：<a href=\"http://www.barcelona.de/en/barcelona-architecture-buildings.html\"\
  \ rel=\"external\"><cite>Barcelona.de</cite></a>。</p>\n\n</aside>\n\n</body>\n\n\
  </html>\n```\n\n在 HTML5 之前，还没有方法显式地做到这一点。现在，你有了 `aside` 元素![Image](img/red_circle-b.jpg)。\n\
  \n![Image](img/red_circle-b.jpg) `aside` 出现在文章下方，因为它在 HTML 本身中跟在文章之后![Image](img/gray_circle-a.jpg)。如你所见，浏览器默认不会对\
  \ `aside` 应用任何特殊格式（除了让它们另起一行）。但是，你可以通过 CSS 完全控制它的外观![Image](img/gray_circle-c.jpg)。\n\
  \n![Image](img/3_14.jpg)\n\n将 `aside` 视为侧边栏![Image](img/red_circle-c.jpg) 是很常见的做法，但根据上下文，你可以将\
  \ `aside` 元素放置在页面的各种位置。它可以是主内容内部的一个（概念上或物理上的）框，位于同一列中但未嵌套在主内容中，或者位于（或作为）像侧边栏之类的辅助列。`aside`\
  \ 的示例包括引言、侧边栏、新闻网站上相关文章的链接框、广告、导航元素组（例如博客列表）、Twitter 馈以及电子商务网站上的相关产品列表。\n\n![Image](img/red_circle-c.jpg)\
  \ 当你对完成后的页面应用 CSS 时，你可以让 `aside`（以“巴塞罗纳的建筑奇迹”开始）出现在主内容旁边，而不是下方。因此，在这种情况下，你将 `aside`\
  \ 当作了侧边栏处理。（你将在第 11 章中学习如何实现双列 CSS 布局）。\n\n![Image](img/3_15.jpg)\n\n#### 指定 aside\n\
  \n1. 输入 `<aside>`。\n2. 输入 `aside` 的内容，它可以包含任意数量的元素，例如段落、列表、音频、视频、图像、图表等。\n3. 输入\
  \ `</aside>`。\n\n---\n\n**提示**\n\n虽然 `aside` 的一种用途是为侧边栏内容进行标记![Image](img/gray_circle-c.jpg)，但\
  \ `aside` 元素本身不会影响页面的布局![Image](img/red_circle-b.jpg)。\n\n---\n\n---\n\n**提示**\n\
  \n如果你在侧边栏中使用或作为侧边栏使用一个或多个 `aside`，请将侧边栏内容放在 HTML 中主内容的之后![Image](img/gray_circle-a.jpg)。为了\
  \ SEO 和无障碍性，将最重要的内容放在前面更好。你可以通过 CSS 更改它们在浏览器中的显示顺序。\n\n---\n\n---\n\n**提示**\n\n\
  使用 `figure` 元素（参见第 4 章）而不是 `aside` 来标记与内容相关的图表，例如图表、统计图或带有说明文字的插图。\n\n---\n\n---\n\
  \n**提示**\n\nHTML5 不允许在 `address` 元素内部嵌套 `aside`。\n\n---\n\n---\n\n**提示**\n\n参见“通过\
  \ ARIA 提高无障碍性”以了解如何将 `aside` 与 `role=\"complementary\"` 使用。\n\n---\n\n---\n\n**其他\
  \ `aside` 示例**\n\n如所述，`aside` 可以出现在与主内容相同的列中、嵌套在主内容内部，或者位于侧边栏中。\n\n示例 1 显示了嵌套在其相关内容中的\
  \ `aside`。\n\n**示例 1（嵌套在主内容中）：**\n\n```html\n...\n\n<body>\n\n<article>\n\n    <h1>巴内亚·新几内亚的多样性</h1>\n\
  \n    ... [文章内容] ...\n\n    <aside>\n\n        <h1>巴内亚·新几内亚快报</h1>\n\n        <ul>\n\
  \n            <li>该国拥有已知 43 种极乐鸟中的 38 种</li>\n            <li>虽然某些地区非常热带化，但其他地区偶尔会经历降雪。</li>\n\
  \n            ...\n\n        </ul>\n\n    </aside>\n\n    ... [更多文章内容] ...\n\n</article>\n\
  \n</body>\n\n</html>\n```\n\n同一篇文章可能还会包含一个来自文章正文的引言。那也是一个 `aside`。或者它也可以是包含“相关故事”的\
  \ `aside`（指向印度尼西亚、澳大利亚等页面）。或者，该 `aside` 位于不同的列，而不是嵌套在文章中。你已经见过一个侧边栏中的 `aside` 示例![Image](img/gray_circle-a.jpg)\
  \ 和![Image](img/gray_circle-c.jpg)。现在，让我们考虑一个包含 `nav` 的项目案例集 `aside`（如示例 2 所示）。\n\
  \n**示例 2（未嵌套在内容中且包含 `nav`）：**\n\n```html\n...\n\n<body>\n\n<!-- 页面主内容 -->\n\n<article>\n\
  \n    <h1>... [项目名称]</h1>\n\n    <figure>... [项目照片] ...</figure>\n\n    <p>... [项目介绍]\
  \ ...</p>\n\n</article>\n\n<!-- 此 aside 未嵌套在文章中 -->\n\n<aside>\n\n    <h1>其他项目</h1>\n\
  \n    <nav>\n\n        <ul>\n\n            <li><a href=\"habitat-for-humanity.html\"\
  >乐善会手册</a></li>\n            <li><a href=\"royal-philharmonic.html\">皇家乐响团网站</a></li>\n\
  \            ...\n\n        </ul>\n\n    </nav>\n\n</aside>\n\n</body>\n\n</html>\n\
  ```\n\n将这个特定的 `aside` 嵌套在文章中也是完全可以的，因为它们是相关的。\n\n---\n\n### 创建页脚\n\n当你考虑到页脚（footer）时，你可能指的是页面页脚。HTML5\
  \ 的 `footer` 元素适用于这一点，但像 `header` 一样，你也可以在其他地方使用它。\n\n`footer` 元素代表其嵌套的最近 `article`、`aside`、`blockquote`、`body`、`details`、`fieldset`、`figure`、`nav`、`section`\
  \ 或 `td` 元素的页脚。只有当它的最近祖先是 `body` 时，它才是整个页面的页脚![Image](img/red_circle-a.jpg) 和![Image](img/red_circle-b.jpg)。如果\
  \ footer 包裹其区域的所有内容（例如文章），它代表的是附录、索引、长跋或长期许可协议，取决于其内容。\n\n![Image](img/red_circle-a.jpg)\
  \ 由于其最近祖先是 `body` 元素，此页脚代表整个页面的页脚。我们的页面现在有了 `header`、`nav`、`article`、`section`、`aside`\
  \ 和 `footer` 元素。并不是每个页面都需要所有元素，但它们确实代表了了主要的页面结构。\n\n\n\n\n\n```html\n<body>\n<header>\n\
  \    <nav role=\"navigation\">\n        ... [包含链接的 ul] ...\n    </nav>\n</header>\n\
  <article>\n    <h1 id=\"gaudi\">巴塞罗尼亚建筑师</h1>\n    ... [引言段落] ...\n    <section>\n\
  \        <h2 id=\"sagrada-familia\" lang=\"es\">圣家族堂</h2>\n        ... [图片和段落] ...\n\
  \    </section>\n    <section>\n        <h2 id=\"park-guell\">高尔公园</h2>\n      \
  \  ... [另一张图片和段落] ...\n    </section>\n</article>\n<aside role=\"complementary\"\
  >\n    <h1>巴塞罗尼亚的建筑奇观</h1>\n    ... [aside 的其余部分] ...\n</aside>\n<footer>\n    <p><small>&copy;\
  \ 2011 版权所有</small> </p>\n</footer>\n</body>\n</html>\n```\n\n* *\n\n![Image](img/red_circle-b.jpg)\
  \ `footer` 元素本身默认不会对文本施加任何格式。在这里，版权声明比普通文本小，因为它被嵌套在 `small` 元素中，用在语义上表示法律脚注（参见第\
  \ 4 章）。就像其他所有内容一样，你可以用 CSS 更改字体大小。\n\n![Image](img/3_16.jpg)\n\n### 创建页脚\n\n**1.**\
  \ 将光标置于你想创建页脚的元素内部。\n\n**2.** 输入 `<footer>`。\n\n**3.** 输入页脚的内容。\n\n**4.** 输入 `</footer>`。\n\
  \n* *\n\n**提示**\n`footer` 通常包含有关其其所在区域的信息，例如通向相关文档的链接、版权信息、其作者以及类似项目。请参见“其他页脚示例（Other\
  \ footer Examples）”侧边栏中的示例 1 和 2。\n\n* *\n\n* *\n\n**提示**\n`footer` 不需要位于其包含元素的末尾，尽管通常情况下是这样的。\n\
  \n* *\n\n* *\n\n**提示**\n在 `footer` 内部嵌套 `header` 或另一个 `footer` 是无效的。此外，你不能将 `footer`\
  \ 嵌套在 `header` 或 `address` 元素中。\n\n* *\n\n* *\n\n**提示**\n参见“创建通用容器（Creating Generic\
  \ Containers](#ch03.html_ch03lev1sec13)）”，了解 `footer` 如何取代了 HTML5 时代 `div` 元素的角色之一。\n\
  \n* *\n\n* *\n\n**提示**\n参见“通过 ARIA 提高可访问性（Improving Accessibility with ARIA](#ch03.html_ch03lev1sec14)）”，了解在特定情况下你如何在\
  \ `footer` 中使用 `role=\"contentinfo\"`。在 ![Image](img/gray_circle-a.jpg) 的 `footer`\
  \ 中包含它是合适的，因为它代表了整个页面的页脚，但我省略了它，以避免给人一种 `role=\"contentinfo\"` 适用于所有 `footer` 元素的印象。参见“其他页脚示例（Other\
  \ footer Examples）”查看一个既显示了区别又正确使用了该角色的示例。\n\n* *\n\n* *\n\n### 其他 `footer` 示例\n\
  \n你看到了一个用于整个页面的 `footer` 的小示例（![Image](img/gray_circle-a.jpg) 和 ![Image](img/gray_circle-b.jpg)）。这是另一个页面页脚，但内容更多。\n\
  \n**示例 1（作为页面页脚）：**\n\n```html\n<body>\n... [页面页眉和内容] ...\n<!-- 这是一个页面页脚，因为 body\
  \ 是它最近的祖先 -->\n<footer role=\"contentinfo\">\n    <p><small>&copy; 2011 The Corporation,\
  \ Inc. 版权所有</small></p>\n    <ul>\n        <li><a href=\"terms-of-use.html\">使用条款</a></li>\n\
  \        <li><a href=\"privacy-policy.html\">隐私政策</a></li>\n    </ul>\n</footer>\n\
  </body>\n</html>\n```\n\n下一个示例演示了页面章节（在本例中为文章）语境下的 `footer`，以及用于整个页面的第二个 `footer`。（参见“更多文章示例（More\
  \ article Examples）”以获得此处此处 `address` 元素范围的说明。）\n\n**示例 2（作为页面章节和整个页面的页脚）：**\n\n\
  ```html\n<body>\n...\n<article>\n    <h1>... [文章页眉] ...</h1>\n    <p>... [文章内容]\
  \ ...</p>\n    <!-- 文章页脚 -->\n    <footer>\n        <p>Leandra Allen 是一位记者，她在哥本哈根大学获得了人类学学位。</p>\n\
  \        <address>\n            你可以通过邮箱 <a href=\"mailto:leandra@unningwriter.com\"\
  >leandra@unningwriter.com</a> 联系她。\n        </address>\n    </footer>\n</article>\n\
  <!-- 页面页脚 -->\n<footer id=\"footer-page\" role=\"contentinfo\">\n    ... [版权、使用条款、隐私政策]\
  \ ...\n</footer>\n</body>\n</html>\n```\n\n页面页脚上的 `id=\"footer-page\"`（你可以指定任何有效的\
  \ id）是可选的，仅为了在样式上将其与其他页脚区分开。注意，只有页面页脚使用了该属性。\n\n\n\n\n\n尽管我反复强调 HTML 描述的是你内容的含义，但\
  \ `div` 并不是唯一没有语义值的元素。`span` 元素是 `div` 的对应物。如果说 `div` 是用于块级内容的无语义容器，那么 `span`（写为\
  \ `<span>内容在此处</span>`）就是用于短语的容器，例如在 `<p>` 元素内部。关于 `span` 的更多信息，请参阅第 4 章。\n\n* *\
  \ *\n\n* * *\n\n### 提示\n\n查看“通过 ARIA 提高可访问性”学习如何在 `div` 中使用地标角色（landmark roles）。\n\
  \n* * *\n\n* * *\n\n### 关于 `div` 的历史以及在 HTML5 中何时使用\n\n在本章介绍的结构元素中，除了 `h1`–`h6`\
  \ 外，`div` 是唯一早于 `HTML5` 的元素。在 `HTML5` 出现之前，`div` 是包裹内容块（如页眉、页脚、主体内容、内边距和侧边栏）的默认选择，以便你可以使用\
  \ `CSS` 对其进行样式化。但那时 `div` 没有语义含义，现在也是如此。\n\n这就是为什么 `HTML5` 引入了 `header`、`footer`、`article`、`section`、`aside`\
  \ 和 `nav`。这些构建块在网页上太常见了，以至于它们应该拥有带有语义的独立元素。`div` 并没有在 `HTML5` 中消失，只是使用它的机会会比过去少。\n\
  \n让我们来看几个 `div` 是正确选择的常见场景。\n\n你已经见过其中一个：为了样式化目的，用一个容器包裹整个页面（![Image](img/gray_circle-b.jpg)\
  \ 和 ![Image](img/gray_circle-c.jpg)）。\n\n我是如何用 `div` 实现双栏布局的？我对 `article` 元素应用了一些\
  \ `CSS` 使其显示为第一列，对 `aside` 元素应用了 `CSS` 使其显示为第二列。（参阅第 7 章开始学习 `CSS`，参阅第 11 章了解使用\
  \ `CSS` 进行布局。）\n\n然而，大多数情况下，你的每一列都包含多个部分的内容。例如，你可能想在第一个 `article` 下方的主体区域放置另一个 `article`（或\
  \ `section`、`aside` 等）。你可能还想在第二列添加一个 `aside`，例如包含一个指向关于高迪的其他网站的链接列表。或者，你可能想在该列中使用另一种类型的元素。\n\
  \n你需要将想要表示每列的内容组合在一个 `div` 中 ![Image](img/red_circle-e.jpg)，然后对该 `div` 进行相应的样式化处理。（如果你在想\
  \ `section` 是否也是一个选项，其实它并没有被设计为通用的样式化容器。）我提供了一张图 ![Image](img/red_circle-f.jpg)\
  \ 来帮助你可视化代码 ![Image](img/gray_circle-e.jpg) 与潜在 `CSS` 布局之间的关系。请记住，这只是该 HTML 的一种布局可能性；`CSS`\
  \ 是非常强大的。\n\n![Image](img/red_circle-e.jpg) 此页面有一个包含整个页面的 `div`，以及两个新的 `div`。一个带有\
  \ `id=\"content\"` 的 `div` 组了主体内容，以便将其样式化为第一列。另一个带有 `id=\"sidebar\"` 的 `div` 包裹了你想显示为第二列的内容。然后你可以在\
  \ `CSS` 中使用 `id` 针对每个特定的 `div` 进行样式化。\n\n* * *\n\n...\n\n```html\n<<body>\n\n<!--\
  \ 页面容器开始 -->\n\n<div id=\"container\">\n    <header>\n        ...\n    </header>\n\
  \    <!-- 应用 CSS 后的第一列 -->\n    <div id=\"content\">\n        <article>\n      \
  \      ...\n        </article>\n        <article>\n            ...\n        </article>\n\
  \        ... [根据需要包含更多部分] ...\n    </div>\n    <!-- 第一列结束 -->\n    <!-- 应用 CSS 后第二列\
  \ -->\n    <div id=\"sidebar\">\n        <aside>\n            ...\n        </aside>\n\
  \        <aside>\n            ...\n        </aside>\n        ... [根据需要包含更多部分] ...\n\
  \    </div>\n</div>\n</body>\n```\n\n\n\n\n\n# ARIA 地标角色\n\n## 示例：页面布局\n\n```html\n\
  <div class=\"column\">\n    <article>\n        ...\n    </article>\n    <article>\n\
  \        ...\n    </article>\n    ... [根据需要添加更多章节] ...\n</div>\n<!-- 第一列结束 -->\n\
  \n<!-- 应用 CSS 后的第二列 -->\n<div id=\"sidebar\">\n    <aside role=\"complementary\"\
  >\n        ...\n    </aside>\n    <aside role=\"complementary\">\n        ...\n\
  \    </aside>\n    ... [根据需要添加更多章节] ...\n</div>\n<!-- 第二列结束 -->\n\n<footer role=\"\
  contentinfo\">\n    ...\n</footer>\n```\n\n以下是 ARIA 规范中找到的一些地标角色定义，随后是我推荐的用法。这些用法已在\
  \ ![Image](img/gray_circle-a.jpg) 和一个类似的 ![Image](img/red_circle-b.jpg) 图表中所示，该图与“#创建通用容器”中的图类似。这是来自“#创建通用容器”的布局图，但现在它包含了\
  \ ARIA 角色。如所述，sidebar div 可以使用 `role=\"complementary\"` 代替 `aside` 元素。\n\n## `role=\"\
  banner\"`\n\n一个包含大部分面向网站导向的内容，而非页面特定内容的区域。\n\n面向网站导向的内容通常包括网站赞助商的标志或身份，以及网站特定的搜索工具。banner\
  \ 通常出现在页面顶部，通常横跨整个宽度。\n\n用法：将其添加到页面级页眉（通常是 `header` 元素）中，并且每个页面上仅使用一次。\n\n## `role=\"\
  navigation\"`\n\n一组用于导航文档或相关文档的导航元素（通常是链接）集合。\n\n用法：这镜像了 HTML5 的 `nav` 元素，因此将其添加到每个\
  \ `nav` 元素中，如果不存在 `nav` 元素，则将其添加到包含链接的容器中。你可以在每个页面上多次使用此角色。\n\n## `role=\"main\"\
  `\n\n文档的主要内容。\n\n用法：将其添加到你主要内容区域的容器中。这通常是一个 `div` 元素，也可以是 `article` 或 `section`。在极少数情况下，你的页面应该只有一个标记为\
  \ `main` 的区域。\n\n## `role=\"complementary\"`\n\n文档的辅助部分，设计用于与主要内容互补……但该部分在与主要内容分离时仍然具有意义。\n\
  \n`complementary` 角色表示所包含的内容与主要内容相关。\n\n用法：这镜像了 HTML5 的 `aside` 元素，因此将其添加到包含所有辅助内容的\
  \ `aside` 或 `div` 中。你可以在每个页面中包含多个一个 `complementary` 角色。\n\n## `role=\"contentinfo\"\
  `\n\n一个包含父文档信息的宽型可感知区域。\n\n页面此区域包含的信息示例包括版权信息和指向隐私声明的链接。\n\n用法：在页面上添加一次到页面级页脚（通常是\
  \ `footer` 元素）中。\n\n总结来说，在你的 HTML 中添加 ARIA 地标角色通常是一个好主意。我已经在书中的其他示例中包含了它们，在书的网站上也包含了它们。明确的是，你的页面即使没有它们也能正常工作，但包含它们可以提高某些用户的体验。你可能会发现提示中列出的屏幕阅读器测试结果有助于决定是否要使用它们（在屏幕阅读器\
  \ Window-Eyes 7.5 之外的支持是非常稳定的）。\n\n* * *\n\n提示\n\n`form` 角色在语义上与 `form` 元素冗余，`search`\
  \ 标记一个搜索表单（BBC、Yahoo! 和 Google 在某些情况下也使用它以及其他地标角色），而 `application` 用于高级用法。\n\n*\
  \ * *\n\n* * *\n\n提示\n\n地标角色只是 ARIA 规范的众多功能之一（[www.w3.org/TR/wai-aria/](http://www.w3.org/TR/wai-aria/)）。你还可能对这个实现指南感兴趣：[www.w3.org/WAI/PF/aria-practices/](http://www.w3.org/WAI/PF/aria-practices/)。\n\
  \n* * *\n\n* * *\n\n提示\n\n无倡倡者 Steve Faulkner 和 Jason Kiss 分别在 [www.html5accessibility.com/tests/landmarks.html](http://www.html5accessibility.com/tests/landmarks.html)\
  \ 和 [www.accessibleculture.org/research/html5-aria-2011/](http://www.accessibleculture.org/research/html5-aria-2011/)\
  \ 发布了关于屏幕阅读器地标角色支持的独立测试。参见 Faulkner 的相关讨论 [www.paciellogroup.com/blog/2011/11/latest-aria-landmark-support-data/](http://www.paciellogroup.com/blog/2011/11/latest-aria-landmark-support-data/)\
  \ 和 [www.paciellogroup.com/blog/2011/07/html5-accessibility-chops-aria-landmark-support/](http://www.paciellogroup.com/blog/2011/07/html5-accessibility-chops-aria-landmark-support/)。\n\
  \n* * *\n\n* * *\n\n提示\n\nNVDA（Windows，可在 [www.nvda-project.org/](http://www.nvda-project.org/)\
  \ 免费下载）、VoiceOver（作为 Mac OSX 和 iOS 4+ 的免费部分）以及 JAWS（Windows，可在 [www.freedomscientific.com/](http://www.freedomscientific.com/)\
  \ 获取免费试用）是目前最先进的屏幕阅读器。我强烈建议你至少使用屏幕阅读器测试这些，以更好地理解 HTML 选择对用户体验的影响。\n\n* * *\n\n*\
  \ * *\n\n提示\n\n你可以在 CSS 选择中使用 ARIA 角色。事实上，通过使用这些角色，你可以让屏幕阅读器体验更好![Image](img/gray_circle-a.jpg)。\n\
  \n## 使用类或 ID 命名元素\n\n虽然不是强制的，但你可以给你的 HTML 元素一个唯一的标识符，为它们分配一个特定的类（或类），或者两者兼有。这样你可以一次性地对它们应用样式。\n\
  \n### 为元素命名一个唯一的 id\n\n- 在元素的起始标签内输入 `id=\"name\"`，其中 `name` 用于后续格式化、链接或 JavaScript\
  \ 行为标识该元素 ![Image](img/red_circle-a.jpg)。`name` 可以是任何内容，只要它不以数字开头或包含空格。\n\n![Image](img/red_circle-a.jpg)\
  \ 为元素添加一个 id 属性，以便进行格式化。\n\n\n\n\n\n在元素的起始标签内，输入 `class=\"name\"`，其中 `name` 是该类的标识名称\
  \ ![Image](img/gray_circle-a.jpg)。如果你想分配多个类，请用空格将每个类隔开，例如 `class=\"name anothername\"\
  `。（你可以分配两个或以上的类名。）\n\n* * *\n\n提示\n\nHTML 文档中的每个 `id` 必须是唯一的。换句话说，同一页面中不能有两个元素具有相同的\
  \ `id` 名称，且每个元素只能有一个 `id`。相同的 `id` 可以出现在多个页面中，并且并不要求每次都分配给同一个元素，尽管按照惯例是这么做的。\n\n\
  * * *\n\n* * *\n\n提示\n\n相反，一个特定的类名可以分配给页面上的任意数量的元素，且一个元素可以有多个类。\n\n* * *\n\n* *\
  \ *\n\n`class` 属性与微数据格式（Microformats）\n\n有一种常见的误解，认为 `class` 属性的创建仅仅是为了为元素组应用 CSS。事实并非如此。它的设计目的还在在不向标记语言中添加更多元素的情况下，丰富\
  \ HTML 的语义化。\n\n微数据格式正是为此设计的。它们使用约定的类名来标识一段 HTML 内容，例如标识一个活动或日历条目（hCalendar 微数据格式）；标识个人、组织和公司（hCard）；或描述人与人之间的关系（XFN）。这些今天定义的许多微数据格式中的几个，而且总有新的格式在开发中。\n\
  \n应用程序、搜索爬虫和其他软件可以读取并利用你 HTML 中的微数据格式。例如，Firefox 扩展程序 Operator 就可以显示任何页面中的微数据格式。\n\
  \n你可以在 [`microformats.org`](http://microformats.org) 学习更多关于实现微数据格式的知识。\n\n* * *\n\
  \n* * *\n\n提示\n\n`class` 和 `id` 属性可以添加到任何 HTML 元素。一个元素可以同时拥有 `id` 和任意数量的类。\n\n*\
  \ * *\n\n* * *\n\n提示\n\n有关如何对具有特定 `id` 或类的元素应用样式，请参阅第 9 章中的“按类名或 ID 选择元素”。\n\n*\
  \ * *\n\n* * *\n\n提示\n\n无论你打算如何使用，请为你的 `id` 和类选择有意义（即语义化的）名称。例如，如果你使用类来做样式化，请避免使用描述视觉呈现的名称，如\
  \ `class=\"red\"`——这是大忌（懂我吗，red 和 cardinal 是双关梗？）？认真地说，`class=\"red\"` 是一个糟糕的选择，因为你可能下周就决定将网站的配色方案改为蓝色。在\
  \ CSS 中更改分配给类的颜色非常简单，但这样你的 HTML 中就会有一个名为 `red` 的类，而渲染出来的却是另一种颜色。更改 HTML 中所有的类名通常不是易事。\n\
  \n* * *\n\n* * *\n\n提示\n\n在为了样式化目的选择为元素应用类还是 `id` 时，通常情况下使用类更好，因为你可以在其他具有相同类名的元素上复用与之相关的样式。不过，在某些情况下，你确实希望通过\
  \ `id` 将样式直接指向一个元素（以及可能的它的任何后代元素）。\n\n* * *\n\n* * *\n\n提示\n\n`id` 属性会自动将元素转换为具名的锚点，你可以将链接指向该点。更多详细信息，请参阅第\
  \ 6 章中的“创建锚点”。\n\n* * *\n\n* * *\n\n提示\n\n你可以使用 `class` 属性来实现微数据格式（更多细节见侧边栏）。\n\n\
  * * *\n\n* * *\n\n提示\n\n你可以使用 JavaScript 访问 `id` 和 `class` 属性，以便为特定元素应用行为。\n\n###\
  \ 为元素添加 title 属性\n\n你可以使用 `title` 属性——不要与 `title` *元素* 混淆——为你网站的几乎任何部分添加一个工具提示标签（![Image](img/red_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-b.jpg)）。不过，它们并不仅仅用于工具提示。屏幕阅读器可能会向用户读取 `title` 文本，从而提高可访问性。\n\
  \n![Image](img/red_circle-a.jpg) 你可以为任何想要的元素添加标题，尽管最常见的用法是在链接上。\n\n* * *\n\n```\n\
  <body>\n\n      <header role=\"banner\">\n\n        <nav role=\"navigation\">\n\n\
  \          <ul id=\"toc\" title=\"Table of\nContents\">\n\n            <li><a href=\"\
  #gaudi\" title=\"了解安东尼·高迪\">巴塞罗的建筑师</a></li>\n\n            <li><a href=\"#sagrada-familia\"\
  \ lang=\"es\">La Sagrada Família </a></li>\n            <li><a href=\"#park-guell\"\
  >桂尔公园</a></li>\n\n          </ul>\n\n        </nav>\n\n      </header>\n\n</body>\n\
  \n</html>\n```\n\n* * *\n\n![Image](img/red_circle-b.jpg) 当你的访问者悬停在标记元素上时，标题将会出现。如果你悬停在\
  \ Barcelona’s Architect 连接上，你会看到“Learn about Antoni Gaudí”，因为它有自己的 `title` 属性。\n\
  \n![Image](img/3_22.jpg)\n\n#### 为网页元素添加标题\n\n在想要标记标题的 HTML 元素中，添加 `title=\"label\"\
  `，其中 `label` 是访问者悬停元素时显示的简短文本，或由屏幕阅读器朗读。\n\n* * *\n\n提示\n\n旧版本的 Internet Explorer（IE7\
  \ 及更早）也会根据 `img` 元素中的 `alt` 属性生成工具提示。然而，如果 `img` 元素中同时存在 `title` 和 `alt` 属性，工具提示将设置为\
  \ `title` 属性的内容，而不是 `alt` 属性。\n\n* * *\n\n### 添加注释\n\n你可以在 HTML 文档中添加注释，以标记章节的开始或结束，向你自己（或未来的编辑器）说明某段代码的作用，防止内容显示![Image](img/red_circle-a.jpg)。这些注释只有在使用文本编辑器或浏览器的“查看源代码”打开文档时才会显示。否则在浏览器中是不可见的![Image](img/red_circle-b.jpg)。\n\
  \n![Image](img/red_circle-a.jpg) 此示例包含了四个注释。两个标记文章的开始和结束。另一个“注释掉”第一段，使其显示在页面上（如果你想长期移除该段落，最好从\
  \ HTML 中删除它）。最后一个注释提醒你在发布页面之前添加更多内容。在发布页面之前，务必移除任何像“待办”之类的临时注释，以防访问者查看你的代码。创建通用容器”中有更多示例注释。\n\
  \n* * *\n\n```\n...\n\n<body>\n\n      ...\n\n      <!-- ==== ARTICLE ====\n   \
  \   <article class=\"architect\">\n        <h1 id=\"gaudi\">巴塞罗的建筑师</h1>\n\n   \
  \     <!-- 此段落不显示，因为它被注释掉了。\n        <p>安东尼·高迪惊人的建筑每年吸引数百万游客来到巴塞罗那。</p>\n      \
  \  -->\n        <p>高迪青少年时期就表现出的不羁，加上他对教会安静但坚定的虔诚，为他的思想奠定了独特的字体。他对简单的追求...</p>\n\
  \        <section class=\"project\">\n          <h2 id=\"sagrada-familia\" lang=\"\
  es\">La Sagrada Família</h2>\n          ...\n        </section>\n        <section\
  \ class=\"project\">\n          <h2 id=\"park-guell\">桂尔公园</h2>\n          ...\n\
  \        </section>\n      </article>\n      <!-- end article -->\n      <!--\n\
  \      TO DO: 在发布页面之前，在此处添加关于其他著名建筑的文章。\n      -->\n      ...\n</body>\n\n</html>\n\
  ```\n\n* * *\n\n![Image](img/red_circle-b.jpg) 注释是不可见的（尽管在显示源代码时它们很容易出现）。同样，如果你用注释包裹了部分内容，它们将将被显示![Image](img/gray_circle-a.jpg)。在这里，代码中的第一段没有显示。\n\
  \n![Image](img/3_23.jpg)\n\n#### 为你的 HTML 页面添加注释\n\n**1.** 在你的 HTML 文档中，在你想要插入注释的地方输入\
  \ `<!--`。\n\n**2.** 输入注释内容。\n\n\n\n\n\n# 3. 输入 `-->` 以完成注释文本。\n\n* * *\n\n提示\n注释的一个良好用途是提醒自己（或未来的编辑）包含、删除或更新某些部分\
  \ ![Image](img/gray_circle-a.jpg)。\n\n* * *\n\n* * *\n\n提示\n注释的另一个用途是记录修订版本号。\n\n\
  * * *\n\n* * *\n\n提示\n通常会在代码主要部分的开始和结束处添加注释，以便你或同事日后修改（页面可能会变得很长）。我喜欢对起始注释使用一种更醒目的格式，与表示块结束的注释区分开来，这样在浏览代码时眼睛就能轻松区分这两点\
  \ ![Image](img/gray_circle-a.jpg)。\n\n* * *\n\n* * *\n\n提示\n在发布之前，你应该用浏览器查看带有注释的页面。这有助于避免因错误格式化注释而将（可能）私密的注释公之于众。\n\
  \n* * *\n\n* * *\n\n提示\n然而，要小心过于私密的注释。虽然在浏览器中正常访问页面时不可见，但用户可以通过浏览器的“查看源代码”功能或保存页面为\
  \ HTML 代码（源文件）看到它们。\n\n* * *\n\n* * *\n\n提示\n注释不能嵌套在其他注释中。\n\n* * *\n\n* * *\n\n\
  提示\n此处显示的语法仅适用于 HTML 注释。CSS 和 JavaScript 有不同的注释语法。CSS 和 JavaScript 都使用 `/* Comment\
  \ goes here */` 来表示覆盖一行或多行的注释，而 JavaScript 还有 `// Comment goes here` 用于单行注释。\n\n\
  * * *\n\n# 4. 文本\n\n本章内容\n- 开始新段落\n- 添加作者联系信息\n- 创建图形\n- 指定时间\n- 标记重要和强调文本\n- 指示引用或参考\n\
  - 引用文本\n- 高亮文本\n- 解释缩写\n- 定义术语\n- 创建上标和下标\n- 标记编辑和不准确的文本\n- 标记代码\n- 使用预格式化文本\n-\
  \ 指定小字\n- 创建换行\n- 创建跨度\n- 其他元素\n\n除非网站以视频或图片库为主，否则网页上的大部分内容都是文本。本章解释了哪些 HTML 语义适用于不同类型的文本，尤其是（但不限于）句子或短语中的文本。\n\
  \n例如，`em` 元素专门用于表示强调的文本，而 `cite` 元素的用途是引用艺术作品、电影、书籍等。\n\n浏览器通常会对许多文本元素应用与普通文本不同的样式。例如，`em`\
  \ 和 `cite` 元素都会显示为斜体。另一个元素 `code` 专门用于格式化脚本或程序中的代码行，默认以等宽字体显示。\n\n在决定如何标记内容时，内容的外观并不重要。因此，你不应该仅仅因为想要斜体文本就使用\
  \ `em` 或 `cite`。那是 CSS 的工作。\n\n相反，应专注于选择描述内容的 HTML 元素。如果浏览器默认的样式恰好与你用 CSS 设置的样式一致，那只是额外的好处。如果不一致，只需用你自己的\
  \ CSS 覆盖默认格式即可。\n\n### 开始新段落\n\nHTML 不会识别你在文本编辑器中输入的回车或其他多余空白。要在网页中开始新段落，你需要使用 `p`\
  \ 元素 ![Image](img/red_circle-a.jpg) 和 ![Image](img/red_circle-b.jpg)。\n\n![Image](img/red_circle-a.jpg)\
  \ 毫不意外，`p` 是最常用的 HTML 元素之一。\n\n* * *\n\n...\n\n```html\n<body>\n<article>\n    <h1>安东尼·高迪</h1>\n\
  \    <p>许多游客被吸引到巴塞罗那，欣赏安东尼·高迪令人惊叹的建筑。</p>\n    <p>巴塞罗那在 2002 年庆祝了高迪诞辰 150 周年。</p>\n\
  \    <h2>米拉之家</h2>\n    <p>高迪的作品本质上是实用的。<span lang=\"es\">米拉之家</span></p>\n    <h2>圣家堂</h2>\n\
  \    <p>圣家堂尚未完工。</p>\n</article>\n</body>\n```\n\n* * *\n\n### 添加作者联系信息\n\n你可能会认为\
  \ `address` 元素用于标记邮政地址，但事实并非如此（除特殊情况外）。实际上，`address` 定义了与文章相关的作者、个人或组织的联系信息（通常出现在页面末尾，如果有的话）。\n\
  \n```html\n<body>\n<article>\n    <h1>博物馆在水滨开幕</h1>\n    <p>新艺术博物馆不仅为城市带来了一系列当代作品，也是水滨更大开发项目的一部分。</p>\n\
  \    ... [故事其余内容] ...\n    <!-- 文章页脚，包含文章的联系信息 -->\n    <footer>\n        <p>特蕾西·王自三年前获得艺术史硕士学位以来，一直为《论文报》撰稿。</p>\n\
  \        <address>\n            给她发邮件：<a href=\"mailto:traceyw@thepaperofpapers.com\"\
  >traceyw@thepaperof.com</a>。\n        </address>\n    </footer>\n</article>\n\n\
  <!-- 页面页脚，包含整个页面的联系信息 -->\n<footer>\n    <p><small>&copy; 2011 论文报公司</small></p>\n\
  \    <address>\n        对网站有疑问或意见？<a href=\"site-feedback.html\">联系我们的网络团队</a>。\n\
  \    </address>\n</footer>\n</body>\n</html>\n```\n\n* * *\n\n![Image](img/red_circle-b.jpg)\
  \ `address` 元素默认以斜体显示。\n\n\n\n\n\n1. 如果你想为文章提供作者的联系方式，请将光标置在该文章内部。或者，如果你想为整个页面提供作者联系方式，请将光标置在正文中（或更常见的，是在页面级页脚中）。\n\
  \n2. 输入 `<address>`。\n\n3. 输入作者的邮箱地址、指向联系信息页面的链接等。\n\n4. 输入 `</address>`。\n\n**提示**\n\
  大多数时候，联系方式是以作者邮箱地址或指向包含更多联系信息的页面的链接形式存在的。联系方式也完全可能是作者的邮寄地址，在这种情况下，使用 `address` 进行标记是有效的。但如果你正在为你的业务创建“联系我们”页面并想包含你的办公室地址，那么用\
  \ `address` 来编写这些内容是不正确的。\n\n**提示**\n`address` 关联到最近的 `article` 元素祖先，或者如果 `address`\
  \ 没有嵌套在 `article` 内部，则关联到页面的 `body`。在注明整个页面的作者联系方式时，习惯上是将 `address` 放置在 `footer`\
  \ 元素中 ![Image](img/gray_circle-a.jpg)。\n\n**提示**\n文章中的 `address` 为该文章的作者提供联系信息 ![Image](img/gray_circle-a.jpg)，而不是嵌套在该文章内部的任何文章（例如用户评论）。\n\
  \n**提示**\n`address` 只能包含作者联系信息，而不包含任何其他内容，例如文档或文章的最后修改日期 ![Image](img/gray_circle-a.jpg)。此外，HTML5\
  \ 禁止在 `address` 内部嵌套任何以下元素：`h1–h6`、`article`、`address`、`aside`、`footer`、`header`、`hgroup`、`nav`\
  \ 和 `section`。\n\n**提示**\n查看第 3 章 更多关于文章和 footer 元素的信息。\n\n## 创建插图\n如你所知，在印刷领域将插图与文本关联是一种常见的约定。插图可以是图表、图形、照片、插画、代码段等。你已经在报纸、杂志、报告等处见过这些应用。事实上，这本书的大多数页面上都有插图。\n\
  \n在 HTML5 之前，没有专门为此目的设计的元素，因此开发人员不得不自己拼凑解决方案，通常涉及不理想的、非语义的 `div` 元素。HTML5 通过 `figure`\
  \ 和 `figcaption` 改变了这一点。根据定义，`figure` 是一个自包含的内容单元（带有可选的说明），它由你文档的正文内容所引用(![Image](img/red_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-b.jpg))。可选的 `figcaption` 是插图的说明或图例，可以出现在插图内容的开头或结尾 ![Image](img/gray_circle-a.jpg)。\n\
  \n![Image](img/red_circle-a.jpg) 这幅插图包含一个图表图像，尽管允许包含多幅图像或其他类型的内容（如数据表或视频）。`figcaption`\
  \ 元素不是强制要求的，但如果你包含了它，它必须是 `figure` 中的第一个或最后一个元素。在现代浏览器中，`figure` 并没有除了作为 `aside`\
  \ 之外另起一行的默认样式 ![Image](img/gray_circle-b.jpg)。\n\n```html\n...\n<body>\n<article>\n\
  \  <h1>2011 年各行业收入</h1>\n  ...\n  <figure>\n    <figcaption>图 3：2011 年各行业收入</figcaption>\n\
  \    <img src=\"chart-revenue.png\" width=\"180\" height=\"143\" alt=\"收入图：玩具 42%，食品\
  \ 36%，食品 22%\" />\n  </figure>\n</article>\n```\n\n![Image](img/red_circle-a.jpg)\
  \ 这幅插图包含一个图表图像，尽管允许包含多幅图像或其他类型的内容（如数据表或视频）。`figcaption` 元素不是强制要求的，但如果你包含了它，它必须是\
  \ `figure` 中的第一个或最后一个元素。在现代浏览器中，`figure` 并没有除了作为 `aside` 之外另起一行的默认样式 ![Image](img/gray_circle-b.jpg)。\n\
  \n```html\n...\n<body>\n<article>\n  <h1>2011 年各行业收入</h1>\n  ...\n  <figure>\n \
  \   <figcaption>图 3：2011 年各行业收入</figcaption>\n    <img src=\"chart-revenue.png\"\
  \ width=\"180\" height=\"143\" alt=\"收入图：玩具 42%，食品 36%，食品 22%\" />\n  </figure>\n\
  </article>\n</body>\n```\n\n![Image](img/red_circle-a.jpg) 这幅插图包含一个图表图像，尽管允许包含多幅图像或其他类型的内容（如数据表或视频）。`figcaption`\
  \ 元素不是强制要求的，但如果你包含了它，它必须是 `figure` 中的第一个或最后一个元素。在现代浏览器中，`figure` 并没有除了作为 `aside`\
  \ 之外另起一行的默认样式 ![Image](img/gray_circle-b.jpg)。\n\n![Image](img/red_circle-a.jpg)\
  \ 这幅插图包含一个图表图像，尽管允许包含多幅图像或其他类型的内容（如数据表或视频）。`figcaption` 元素不是强制要求的，但如果你包含了它，它必须是\
