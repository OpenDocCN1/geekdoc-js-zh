  \ {\n    white-space: pre-wrap;\n}\n```\n\n另外提到一点，在大多数情况下，我不建议你在 `div` 等元素上使用 `white-space:\
  \ pre;` CSS 声明来替代 `pre`，因为空格对包含内容的语义（尤其是代码）可能至关重要，而只有 `pre` 能保留它。（此外，如果用户在浏览器中禁用了\
  \ CSS，格式将会丢失。）\n\n请参从第 7 章开始的 CSS 介绍。特别是文本格式在第 10 章中有讨论。\n\n\n\n\n`hCard` 微格式 ([`microformats.org/wiki/hcard`](http://microformats.org/wiki/hcard))\
  \ 旨在以一种语义化的方式“表示人物、公司、组织和地点”，这种方式对人类和机器都是可读的。你可以用它来表示街道地址，而不是提供的示例 ![Image](img/gray_circle-a.jpg)。\n\
  \n***### 创建 Span\n\n`span` 元素像 `div` 一样，没有任何语义意义。区别在于，`span` 仅适用于单个单词或短语，而 `div`\
  \ 用于内容块（参见 第 3 章 中的“创建通用容器” ）。\n\n当你想要对某段内容片段应用以下任何一种操作，而 HTML 没能为该片段提供恰当的语义化元素时，`span`\
  \ 就很有用：\n\n• 属性，如 `class`、`dir`、`id`、`lang`、`title` 等（![Image](img/red_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-b.jpg) ）\n\n![Image](img/red_circle-a.jpg) 在这种情况下，我想指定部分文本的语言，但在句子语境下，没有哪个\
  \ HTML 元素的语义适合“La Casa Milà”。在段落之前，包含“La Casa Milà”的 `h1` 在语义上是合适的，因为该文本是后续内容的标题。因此，对于标题，我只是简单在\
  \ `h1` 上添加了 `lang` 属性，而不是为了这个目的而不必要地给标题文本封装一个 `span`。\n\n***\n\n```html\n<<body>\n\
  \n<h1 lang=\"es\">La Casa Milà</h1>\n\n<p>Gaudí 的作品本质上是有用的。<span lang=\"es\">La\
  \ Casa Milà</span>是一栋公寓楼，*真实的人们</em>住在在那里。</p>\n\n</body>\n\n</html>\n```\n\n***\n\
  \n![Image](img/red_circle-b.jpg) `span` 元素没有默认样式。\n\n![Image](img/04_23.jpg)\n\n\
  • 使用 CSS 设置样式\n\n• 使用 JavaScript 设置行为\n\n由于 `span` 没有语义意义，因此在没有其他元素可用的情况下，请将其作为最后的手段。\n\
  \n#### 添加 spans \n\n**1.** 输入 `<span`。\n\n**2.** 如果需要，输入 `id=\"name\"`，其中 `name`\
  \ 唯一标识被 span 的内容。\n\n**3.** 如果需要，输入 `class=\"name\"`，其中 `name` 是被 span 内容所属的类名。\n\
  \n**4.** 如果需要，输入其他属性（如 `dir`、`lang` 或 `title`）及其值。\n\n**5.** 输入 `>` 完成起始 span 标签。\n\
  \n**6.** 创建你希望包含在 `span` 中的内容。\n\n**7.** 输入 `</span>`。\n\n***\n\n提示\n\n`span` 没有默认格式\
  \ ![Image](img/gray_circle-b.jpg)，但与其他与其他 HTML 元素一样，你可以使用 CSS 应用你自定义的样式（参见 第 10\
  \ 章 和 第 11 章 ）。\n\n***\n\n***\n\n提示\n\n你可以在同一个 `span` 元素上同时应用 `class` 和 `id` 属性，尽管更常见的是只应用其中之一（如果应用了的话）。主要区别在于\
  \ `class` 用于一组元素，而 `id` 用于标识页面上单个、唯一的元素。\n\n***\n\n***\n\n提示\n\n微格式（Microformats）经常使用\
  \ `span` 为内容附带语义化类名，以填补 HTML 未提供合适语义化元素的空白。你可以在 [`microformats.org`](http://microformats.org)\
  \ 了解更多信息。\n\n***\n\n### 其他元素\n\n本节涵盖了你可以包含在文本中的其他元素，但这些元素通常用途较少，或者对器的支持有限（或两者兼有）。\n\
  \n#### u 元素\n\n像 `b`、`i`、`s` 和 `small` 一样，`u` 元素在 HTML5 中被重新定义，使其与其过去作为非语义、演示性元素的身份解耦。在过去，`u`\
  \ 元素用于文本下划线。现在，它用于未说明的注释。HTML5 对其定义如下：\n\n`u` 元素表示一段文本，该文本带有未说明但显式渲染的非文本注释，例如将文本标记为中文文本中的专有名词（中文专名标记），或将文本标记为拼写错误。\n\
  \n以下是一个使用 `u` 标记拼写错误单词的示例：\n\n```html\n<p>当他们 <u class=\"spelling\"> recieved</u>\
  \ 包时，他们把它和 <u class=\"spelling\">there </u> 其他包放在一起，打算稍后再打开它们。</p>\n```\n\n`class`\
  \ 是完全可选的，它的值（你可以设定为任何值）不会随内容一起渲染，以显式指示拼写错误。但你可以使用它来为拼写错误的单词设置不同的样式（尽管 `u` 默认仍渲染为带下划线的文本）。或者，你可以添加\
  \ `title` 属性并附上如“[sic]”之类的注释，这是某些语言中指示拼写错误的惯例。\n\n仅当 `cite`、`em` 或 `mark` 等元素不符合你所需的语义时才使用\
  \ `u`。此外，如果 `u` 文本会与链接文本混淆，最好更改其样式。`u` 元素默认是带下划线的 ![Image](img/red_circle-a.jpg)。\n\
  \n![Image](img/red_circle-a. ) \n\n![Image](img/04_23.jpg)\n\n#### wbr 元素\n\nHTML5\
  \ 引入了 `br` 的亲戚 `wbr`。它表示“换行点”。在单词或字母之间使用它来显示何时*可以* 换行。\n\n示例：\n\n```html\n<p>当他们\
  \ <u class=\"spelling\"> recieved</u> 包时，他们把它和 <u class=\"spelling\">there </u>\
  \ 其他包放在一起，打算稍后再打开它们。</p>\n```\n\n`class` 是完全可选的，它的值（你可以设定为任何值）不会随内容一起渲染，以显式指示拼写错误。但你可以使用它来为拼写错误的单词设置不同的样式（尽管\
  \ `u` 默认仍渲染为带下划线的文本）。或者，你可以添加 `title` 属性并附上如“[sic]”之类的注释，这是某些语言中指示拼写错误的惯例。\n\n仅当\
  \ `cite`、`em` 或 `mark` 等元素不符合你所需的语义时才使用 `u`。此外，如果 `u` 文本会与链接文本混淆，最好更改其样式。`u` 元素默认是带下划线的\
  \ ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg)\n\n#### ruby,\
  \ rp 和 rt 元素\n\n*ruby* 注释是东亚语言（如中文和日语）中的惯例，通常用于显示未知字的读音。这些较小的注释字符出现在被注释字符上方或右侧。它们通常被称为\
  \ *ruby* 或 *rubi*，而日语 ruby 字符被称为假名（furigana）。\n\n`ruby` 元素以及它的 `rt` 和 `rp` 元素是 HTML5\
  \ 将其添加到内容中的机制。`rt` 指定注释基础的 ruby 字符。可选的 `rp` 元素允许不支持 ruby 的浏览器在 文本周围显示括号。\n\n以下示例使用英语内容演示这种结构，以便理解代码和支持\
  \ ruby 的浏览器中的布局 ![Image](img/red_circle-b.jpg)。ruby 文本区域被高亮：\n\n```html\n<ruby>\n\
  \  base <rp>()rp><rt>ruby chars</rt><rp></rp>\n  base <rp>()rp><rt>ruby chars</rt><rp></rp>\n\
  </ruby>\n```\n\n![Image](img/red_circle-b.jpg) 支持 ruby 的浏览器会将 ruby 文本显示在基础上方（可能在侧面），而不带括号。\n\
  \n![Image](img/04_25.jpg)\n\n现在，一个包含“北京”两个中文基础字的真实示例，以及它们对应的 ruby 字符 ![Image](img/red_circle-c.jpg)：\n\
  \n```html\n<ruby>\n  ![Image](img/japan.jpg) <rp>()rp><rt>![Image](img/japan1.jpg)</rt><rp></rp>\n\
  \  ![Image](img/japan2.jpg) <rp>()rp><rt>![Image](img/japan3.jpg)</rt><rp></rp>\n\
  </ruby>\n```\n\n![Image](img/red_circle-c.jpg) 现在是在支持 ruby 的浏览器中看到的“北京”的 ruby 标记。\n\
  \n![Image](img/04_26.jpg)\n\n\n\n\n\n![Image](img/red_circle-d.jpg) 支持 ruby（注音符号）的浏览器会忽略\
  \ `rp` 括号，仅显示 `rt` 内容 ![Image](img/gray_circle-b.jpg) 和 ![Image](img/gray_circle-c.jpg)。然而，不支持\
  \ ruby 的浏览器会将 `rt` 内容显示在括号中，如下所示。\n\n![Image](img/04_27.jpg)\n\n***\n\n提示\n在撰写本文时，只有\
  \ Safari 5+、Chrome 11+ 以及所有版本的 Internet Explorer 具有基础的 ruby 支持（这进一步说明了在标记标记中使用 `rp`\
  \ 的理由）。与此同时，Firefox 的 Ruby 扩展程序 ([`addons.mozilla.org/en-US/firefox/addon/6812`](https://addons.mozilla.org/en-US/firefox/addon/6812))\
  \ 为 Firefox 提供了支持。\n\n***\n\n***\n\n提示\n你可以在 [`en.wikipedia.org/wiki/Ruby_character`](http://en.wikipedia.org/wiki/Ruby_character)\
  \ 了解更多关于 ruby 字符的知识。\n\n***\n\n### bdi 和 bdo 元素\n\n如果你的 HTML 页面混合了从左到右的字符（如大多数语言中的拉丁字母）和从右到左的字符（如阿拉伯语或希伯来语字符），那么\
  \ `bdi` 和 `bdo` 元素可能会让你感兴趣。\n\n但首先，来看一下背景。内容的基方向默认为从左到右，除非你在 `html` 元素上将 `dir` 属性设置为\
  \ `rtl`。例如，`<html dir=\"rtl\" lang=\"he\">` 指定内容的基方向是从右到左，且基础语言为希伯来语。\n\n正如我在书中多个示例中对\
  \ `lang` 所做的那样，当内容偏离页面基础设置时，你也可以在页面内的元素上设置 `dir`。因此，如果基础语言设置为英语（`<html lang=\"en\"\
  >`），而你想包含一个希伯来语段落，你可以将其标记为 `<p dir=\"rtl\" lang=\"he\">...</p>`。\n\n在有了这些设置后，内容大部分时候将以所需的方向显示；Unicode\
  \ 的双向（“bidi”）算法会处理这些问题。\n\n`bdo`（“双向覆盖”）元素用于那些算法未能按预期显示内容且你需要对其进行覆盖的情况。通常，当 HTML\
  \ 源代码中的内容是视觉顺序而非逻辑顺序时会出现这种情况。\n\n*视觉顺序*（Visual order）正如其名——HTML 源代码内容的顺序与你希望显示的顺序相同。*逻辑顺序*（Logical\
  \ order）对于希伯来语这种从右到左的语言则是相反；第一个从右向左的字符是先输入的，然后是第二个字符（换句话说，它左侧的字符），依此类推。\n\n根据最佳实践，Unicode\
  \ 期望双向文本遵循逻辑顺序。因此，如果它是视觉顺序，算法仍然会反转字符，导致显示结果与意图相反。如果你无法将 HTML 源代码中的文本改为逻辑顺序（例如，它可能来自数据库或馈送），你唯一的解决办法就是将其封装在\
  \ `bdo` 中。\n\n要使用 `bdo`，你必须包含 `dir` 属性并将其设置为 `ltr`（从左到右）或 `rtl`（从右到左），以指定你想要的方向。继续我们之前关于在英语页面中包含希伯来语段落的示例，你需要输入\
  \ `<p lang=\"he\"><bdo dir=\"rtl\">...</bdo></p>`。`bdo` 适用于段落内的短语或句子。你不会用它包裹多个段落。\n\
  \n`bdi` 元素是 HTML5 新出的元素，用于内容方向未知的情况。你不需要包含 `dir` 属性，因为它的默认值为 `auto`。HTML5 提供了以下示例，我对其进行了轻微修改：\n\
  \n当嵌入方向未知的用户生成内容时，该元素特别有用。\n\n在这个示例中，显示了用户名以及该用户提交的帖子数。如果没有使用 `bdi` 元素，阿拉伯用户的用户名将导致文本混乱（双向算法会将冒号和数字“3”放在“User”单词旁边，而不是“posts”单词旁边）。\n\
  \n```html\n<ul>\n    <li>User <bdi>jcranmer</bdi>: 12 posts.</li>\n    <li>User\
  \ <bdi>hober</bdi>: 5 posts.</li>\n    <li>User <bdi>![Image](img/141fig01.jpg)</bdi>:\
  \ 3 posts.</li>\n</ul>\n```\n\n***\n\n提示\n如果你想了解更多关于整合从右到左语言的知识，我建议阅读 W3C 的文章“创建阿拉伯语、希伯来语和其他从右到左脚本的\
  \ HTML 页面”（([www.w3.org/International/tutorials/bidi-xhtml/](http://www.w3.org/International/tutorials/bidi-xhtml/))）。\n\
  \n***\n\n### meter 元素\n\n`meter` 元素另一个由于 HTML5 而出现的新元素。可以使用它来表示已知范围内的分数值或测量值。或者通俗地说，它是你用于投票结果等情况（例如，“30%\
  \ Smith, 37% Garcia, 33% Clark”）的仪表盘类型。\n\n（注：输入文本中 meter 元素部分存在大量重复；我已根据提供的指令处理了其唯一内容。）\n\
  \n在撰写本文时，`meter` 仅受 Chrome 11+ 和 Opera 11+ 支持。这部分解释了为什么你目前在现实中并不常看到它。可以尽管使用它，但请理解大多数浏览器默认会渲染\
  \ meter 文本而非视觉仪表 ![Image](img/gray_circle-f.jpg)。\n\n每个支持的浏览器所显示的仪表样式可能有所不同。\n\n\
  有些人一直在尝试使用 CSS 为支持和不支持的浏览器设置 `meter` 样式。在线搜索“style HTML5 meter with CSS”可以查看一些结果（注意有些使用了\
  \ JavaScript）。\n\n`meter` 不用于标记没有已知范围的通用测量值，例如身高、重量、距离或周长。例如，你不能这样做：`<p>我昨天走路了 <meter\
  \ value=\"4.5\">4.5</meter> 英里。</p>`。\n\n\n\n\n确保不要混淆 `meter` 和 `progress` 元素的用法。\n\
  \n## progress 元素\n\n`progress` 元素是 HTML5 中的另一个新元素。你用它制作进度条，比如你在 Web 应用程序中看到的、用于指示在保存或加载大量数据时的进度。\n\
  \n与 `meter` 一一样，支持的浏览器会根据属性 ![Image](img/red_circle-g.jpg) 的值自动显示进度条。同样像 `meter`\
  \ 一样，最好在 `progress` 内部包含文本（例如示例所示的“0% 已保存”），以便旧版浏览器显示当前进度 ![Image](img/red_circle-h.jpg)，尽管这并非强制。\n\
  \n![Image](img/red_circle-g.jpg) 像 Chrome 这样支持 `progress` 的浏览器会自动显示进度条，并根据值着色。它不会显示\
  \ `<progress>` 和 `</progress>` 之间的文本。在本示例中，`value` 属性被设置为 0，因此整个条的颜色是相同的。\n\n![Image](img/04_30.jpg)\n\
  \n![Image](img/red_circle-h.jpg) Firefox 不支持 `progress`，因此它不是显示彩色条，而是显示元素内部的文本内容。你可以用\
  \ CSS 改变它的外观。\n\n![Image](img/04_31.jpg)\n\n这是一个示例：\n\n```html\n<p>Please wait while\
  \ we save your data. Current progress: <progress max=\"100\" value=\"0\">0% saved</progress></p>\n\
  ```\n\n关于 `progress` 的详细讨论超出了本书的范围，因为通常你会随着任务的进展用 JavaScript 动态更新 `value` 属性和内部文本（例如，指示已完成\
  \ 37%）。无论你是使用 JavaScript 这样做还是在 HTML 中硬编码，其视觉效果都是相同的，即 `<progress max=\"100\" value=\"\
  37\">37% saved</progress>` ![Image](img/red_circle-i.jpg)。当然，不支持的浏览器显示方式将类似于 ![Image](img/gray_circle-h.jpg)。\n\
  \n![Image](img/red_circle-i.jpg) 当 `value` 属性通过 JavaScript 程序化（或直接在 HTML 中）设置为 37\
  \ 时，Chrome 中的进度条（假设 `max=\"100\"`）。\n\n![Image](img/04_32.jpg)\n\n### 提示\n`progress`\
  \ 元素支持三个属性，它们都是可选的：`max`、`value` 和 `form`。`max` 属性指定任务的总工作量，必须大于 0。`value` 是相对于任务的完成量。如果你想将\
  \ `progress` 元素与其未嵌套的 `form` 元素关联，可以将 `form` 属性分配给页面上 `form` 元素的 `id`。\n\n### 提示\n\
  这是一个使用 JavaScript 修改 `progress` 元素的小示例。假设进度条使用你指定的 `id` 编码，如下所示：\n\n```html\n<progress\
  \ max=\"100\" value=\"0\" id=\"progressBar\">0% saved</progress>\n```\n\n如下所示 JavaScript\
  \ 将让你访问该元素：\n\n```javascript\nvar bar = document.getElementById('progressBar');\n\
  ```\n\n然后你可以根据需要通过 `bar.value` 获取或设置值。例如，`bar.value = 37;` 就会设置它。\n\n### 提示\n截至本文，`progress`\
  \ 元素在现代浏览器中得到了很好的支持：Chrome 11+、Firefox 6+、Internet Explorer 10（在本文写作期间仅作为平台预览可用）以及\
  \ Opera 11+。Safari 不支持它。\n\n### 提示\n每个支持的浏览器显示的进度条样式可能不同，尽管你可以在一定程度上使用 CSS 对其进行样式化。\n\
  \n## 5. 图像\n\n### 本章内容\n- 关于 Web \n- 获取图像\n- 选择图像编辑器\n- 保存你的图像\n- 在页面上插入图像\n- 提供替代文本\n\
  - 指定图像大小\n- 使用浏览器缩放图像\n- 使用图像编辑器缩放图像\n- 为你的网站添加图标\n\n为 Web 创建图像与为纸质输出创建图像有所不同。虽然\
  \ Web 图像和打印图像的基本特征相同，但有六个主要因素区分了它们：格式、颜色、大小/分辨率、速度、透明度和动画。本章将讨论这六个因素中每个因素的重要方面，并解释如何使用这些知识为你的网站创建最有效的图像。\n\
  \n一旦你创建了图像，我们将继续将它们插入到你的 Web 页面。\n\n### 关于 Web 图像\n让我们来看看创建 Web 图像时应该记住的六个因素。\n\n\
  #### 格式\n在纸质上打印图像的人不需要担心读者将用什么来查看图像。虽然 Web 图像和打印图像的基本特征相同，但有六个主要因素区分了它们：格式、颜色、大小/分辨率、速度、透明度和动画。本章将讨论这六个因素中每个因素的重要方面，并解释如何使用这些知识为你的网站创建最有效的图像。\n\
  \n一旦你创建了图像，我们将继续将它们插入到你的 Web 页面。\n\n\n\n\n或许思考图像尺寸更好的方式是相对于平均网页来考虑。由于分辨率为 1024 像素宽按\
  \ 768 像素高的显示器曾是长期的标准，网页设计师已经习惯了将页面宽度保持在 960 像素左右，这样用户无需水平滚动即可看到页面的全部内容。\n\n虽然拥有更大显示器的人确实越来越多（如今，超过\
  \ 85% 的屏幕大于 1024 x 768），但这并不意味着人们会用单个浏览器窗口来填满这些大显示器。除了需要参考其他程序（甚至是其他的浏览器窗口）外，在太宽的浏览器中阅读文本是非常繁琐的。尽管如此，设计师们倾向于加宽设计，并使用可随访问者浏览器窗口伸缩的灵活宽度设计。\n\
  \n此外，智能手机和平板电脑的使用迅速增加，因此你应该始终考虑屏幕尺寸和有限的下载速度。\n\n请注意，“分辨率”可以指两个完全不同的概念：显示器或图像上的实际像素数（例如\
  \ 640 x 480），以及该显示器或图像每英寸的像素数（例如 72 或 86 ppi）。无论如何，分辨率越高，像素就越多。在理论上，像素可以增加细节`or`\
  \ 或尺寸。在屏幕上，更多的像素`always`意味着更大的图像。\n\n## 速度\n\nWeb 图像与打印图像的另一个区别是，访问者必须等待 Web 图像下载。（想象一下等早晨报纸上的图片出现！）\n\
  \n如何将下载时间缩短到最短？最简单的方法是使用小图像。图像的文件越大，它在访问者面前出现所需的时间就越长。\n\n加快下载时间的第二方法是压缩图像。`JPEG`\
  \ 非常擅长大幅减少图像的文件大小，但 `JPEG` 有两个主要缺点。第一，它的压缩信息占据了大量空间，对于非常小的图像来说这不划算。其次，它是有损压缩——为了节省空间而永久地删除细节。解压缩图像无法恢复丢失的数据。如果你计划将来编辑该图像，应该保存一个未压缩格式的副本（例如，`PSD`\
  \ 或 `TIFF`），并仅在完成最终编辑后才将其保存为 `JPEG`。\n\n`PNG` 和 `GIF` 是无损格式，因此它们可以在不损失质量的情况下压缩你的图像。具有大单色区域的图像（如标志、渲染文本和插图）最适合这种格式。`PNG`\
  \ 的压缩效果比 `GIF` 好。\n\n## 透明度\n\n透明度很重要有两个原因。首先，你可以利用它让一个图像移动到另一个图像后面来创建复杂的布局。其次，你可以利用透明度赋予图像非矩形的轮廓，为你的页面增添视觉趣味。`PNG`\
  \ 和 `GIF` 都支持透明度；`JPEG` 不支持。\n\n在 `GIF` 格式中，像素可以是透明的也可以不透明。`PNG` 支持 Alpha 透明度，这是一种支持部分透明和全透明的方法。这意味着具有复杂透明背景的图像通常作为\
  \ `PNG` 比作为 `GIF` 好，因为边缘看起来平滑而不是锯齿状。\n\n## 动画\n\n你很快不会在纸上看到动态图像。在 Web 上，它们无处不在。动画图像可以保存为\
  \ `GIFs`，但不能保存为 `JPEGs` 或 `PNGs`。\n\n图像内部的动画变得越来越稀少。动画通常使用 `Flash`、`CSS Animations`\
  \ 和 `JavaScript` 创建。近年来，由于 iOS 不支持 `Flash` 以及 `JavaScript` 和 `CSS` 能力的增强，Web 上的\
  \ `Flash` 动画正在减少。\n\n## 获取图像\n\n那么，你如何获取可以用于你的网页的图像呢？有几种方法。你可以购买或下载现成的图像，使用扫描仪将照片或手绘图像数字化，使用数码相机，或者在\
  \ `Adobe Photoshop` 这样的图像编辑程序中从头绘制图像。一旦你把它们放入计算机，就可以对它们进行调整以供 Web 使用。\n\n### 获取图像\n\
  \n- 你可以使用 `Google` 查找 Web 上的图像，点击搜索框上方的 `Images` 链接并像照常输入标准。请查看 `知识产权共享许可` 侧边栏获取有关这些图像版权的更多信息。\n\
  - 通常，即使是在 Web 上找到的免费图像也受到某种形式的限制（参见 `知识产权共享许可` 侧边栏）。你购买的图像通常可以用于任何目的（转售图像本身除外）。仔细阅读任何免责声明或许可。\n\
  - 许多公司以非常合理的价格出售摄影和图像。他们通常针对不同的用途和分辨率提供每个图像的多个版本。\n- 扫描仪和数码相机是创建自己的图像流行且有效的方法。\n\
  \n***\n\n### 知识产权共享许可\n\nCreative Commons (`[www.creativecommons.org](http://www.creativecommons.org))`\
  \ 是一个非营利组织，开发了一套版权模板系统，允许艺术家以指定的方式分享他们的作品，而无需放弃作品的所有权利。网站设计师、音乐家和摄影师是许多使用知识产权共享许可将作品推向市场，同时不必担心会被以不同同意的方式使用的艺术家。\n\
  \n`Flickr` 是一个流行的照片共享 Web 应用程序（`[www.flickr.com](http://www.flickr.com)`），要求用户为其上传的每张照片指定一个\
  \ Creative Commons 许可。Flickr 然后允许访问者根据分配给它们的许可搜索照片。它是为你的网站寻找照片的好地方。\n\n你还可以使用 `Google`\
  \ 根据使用权限制搜索。（点击“高级搜索”，然后选择“使用权”下拉菜单。）\n\n***\n\n### 选择图像编辑器\n\n有很多许多不同的软件程序可以创建和保存图像。大多数现代图像编辑器都有创建\
  \ Web 图像的特殊工具，这些工具考虑了本章之前讨论的因素。\n\n行业标准无疑是 `Photoshop`，以及它的表兄弟 `Adobe Fireworks`（`[www.adobe.com](http://www.adobe.com)`）。Fireworks\
  \ 本身就是一个非常强大的程序。两者适用于 Macintosh 和 Windows。我用这两个程序说明了章中的一些技术。\n\n然而，我想强调的是，无论你选择什么软件，为\
  \ Web 优化图像的基本策略都是相同的。命令名称可能略有不同，步骤可能更多或更少，但理念保持不变。\n\n`Photoshop` 有许多替代品，包括 `Paint.NET`（适用于\
  \ Windows，`[www.getpaint.net](http://www.getpaint.net)`）和 `Acorn` 或 `Pixelmator`（适用于\
  \ Mac，`[www.pixelmator.com](http://www.pixelmator.com)`）。此外，如 `Photoshop.com` 和\
  \ `Aviary.com` 等在线编辑器变得越来越强大。尽管使用你最熟悉的程序。\n\n## 保存你的图像\n\n现在你已经创建了图像，是时候保存它们了。这个过程是图像视觉质量与文件大小之间的平衡。\n\
  \n如果你没有在计算机上安装这些软件，可以使用 `Photoshop` 和 `Fireworks` 的试用版。\n\n#### Adobe Photoshop\n\
  \n`Photoshop` 在文件菜单中提供了 `Save for Web & Devices` 命令。它允许你在视觉上比较原始图像与最多三个优化的版本，同时关注在文件大小和下载时间上的任何节省情况。\n\
  \n#### 使用 Photoshop 的 Save for Web & Devices 命令\n\n1. 打开 `Photoshop` 并创建你的图像。或者打开一个现有图像，通过裁剪、调整大小和编辑为发布做好准备。\n\
  2. 选择 `File > Save for Web & Devices`。`Save For Web & Devices` 对话框出现。\n\n\n\n\n\n\
  3. 点击 `2-Up` 标签页查看一个优化版本，或点击 `4-Up` 标签页查看三个。\n\n4. 如必要，点击其中一个优化版本。\n\n5. 选择所需的格式。\n\
  \n通常情况下，在计算机上创建的图像，包括标志、横幅、线条画、文本以及任何具有大面积单色和锐利细节的图形，应保存为 `PNG-8` 或 `GIF` 格式 ![Image](img/red_circle-a.jpg)。\n\
  \n![Image](img/red_circle-a.jpg) “用于 Web 和设备的存储存储”对话框显示了原始图像（左上角）和三个可能的压缩版本。此图像包含许多平色以及应当保持锐利的文本。请注意，`PNG-8`\
  \ 格式（左下角）对图像的压缩效果最好，略小于 10K。具有更多颜色的 `PNG-24` 为 35K。高质量的 `JPEG` 体积巨大。如果你将 `JPEG`\
  \ 调整为中等质量（未显示），它仍然很大且难看。\n\n![Image](img/5_05.jpg)\n\n具有连续色调的图像（如照片）应保存为 `JPEG`\
  \ 或 `PNG-24` 格式 ![Image](img/red_circle-b.jpg)。\n\n![Image](img/red_circle-b.jpg)\
  \ `JPEG`（左下角）提供了良好的图像和最小的文件大小（63K）。`PNG-8` 压缩会导致照片出现色彩带（右下角），且文件大小（114K）几乎是 `JPEG`\
  \ 的两倍。`PNG-24`（右上角）提供了高质量图像，但文件大得多（322K）。\n\n![Image](img/5_06.jpg)\n\n6. 调整出现的额外设置，直到获得具有可接受质量的最小文件。\n\
  \n7. 点击保存。选择一个目录并为新文件命名。它将自动带有所选格式的扩展名（因此通常不会替换原始图像）。\n\n### Adobe Fireworks\n\n\
  Photoshop 设计用于各种用途，而 Fireworks 设计用于为 Web 创建图像（![Image](img/red_circle-c.jpg) 和 ![Image](img/red_circle-d.jpg)）。它曾能通过优化\
  \ PNG 以获得比 Photoshop 更小的文件大小，但这种差距已经缩小。Fireworks 提供了一个额外的导出选项以获得更高质量的 PNG：`PNG-32`\
  \ 格式。\n\n![Image](img/red_circle-c.jpg) 注意 `PNG-8` 图像（左下角）的文件大小比其 Photoshop 对应版本略小。另外两种格式\
  \ `JPEG`（右上角）和 `PNG-24`（右下角）更大。\n\n![Image](img/5_07.jpg)\n\n![Image](img/red_circle-d.jpg)\
  \ Fireworks 对此图像的优化效果明显更好，`JPEG`（左下角）、`PNG-8`（右下角）和 `PNG-24`（右上角）的文件更小。`JPEG` 和\
  \ `PNG-8` 的文件大小只有 Photoshop 的一半！\n\n![Image](img/5_08.jpg)\n\n> 提示\n记住你的主要目标是在保持可接受图像质量的同时，获得尽可能的文件大小。\n\
  \n> 提示\n图像应该以 `RGB` 模式创建，而不是 `CMYK`（用于打印）。\n\n> 提示\n如果你不确定选择哪种格式，请比较两种优化结果，看看哪种格式压缩得更好。\n\
  \n> 提示\n`PNG-24` 是一种强大的无损格式，可用于计算机生成的图像和“自然”图像。它通常比 `PNG-8` 好，但不如 `JPEG`那么好。\n\n\
  > 提示\n如果你有一张包含两种类型内容的图像，可以将其切成块，分别压缩，并使用 `CSS` 重新组装；或者直接使用单一格式让其自行处理。\n\n> 提示\n\
  `用于 Web 和设备的存储` 命令创建一个新图像并保持原始图像完整——除非你以相同的名称保存在相同的文件夹中，覆盖之前。\n\n> 提示\n优化版本中仅保存图像的可见图层。\n\
  \n### 在页面上插入图像\n\n你可以在 Web 页面上放置各种图像，从标志到照片。像这里放置的图像当访问者跳转到你的页面时会自动显示，只要浏览器设置好可以查看它们。\n\
  \n#### 如何在页面上插入图像\n\n1. 在 HTML 代码中你想要让图像出现的地方放置光标。\n2. 输入 `<img src=\"image.url\"\
  >`，其中 `image.url` 表示文件在服务器上的位置。\n3. 输入一个空格然后是 `/>`。\n\n![Image](img/red_circle-a.jpg)\
  \ 此图像的 URL 因为只包含文件名而没有路径，表明图像位于与此页面相同的文件夹中。\n\n```html\n<body>\n  <h2>巴塞罗那市场</h2>\n\
  \  <img src=\"cornermarket.jpg\" />\n  <p>第一张照片显示了波奎利亚市场（Mercat de Boquería）的一个水果摊位，这是位于兰布拉大道旁的中央市场。这是一个不可思议的地方，充满了各种水果、肉类、鱼类或你可能需要的任何东西。我花了很长时间才鼓起勇气在那里拍了照。你可能会说我有点胆小，但因为我住在那里，所以这只是很奇怪。你们会给自己的超市拍照吗？</p>\n\
  </body>\n```\n\n![Image](img/red_circle-b.jpg) 图像对齐到页面左侧，以匹配文本的对齐方式。你可以使用 `CSS`\
  \ 属性（如 `float`，参见“制作元素](#ch11.html_ch11)”）更改对齐方式或让文本环绕图像。\n\n![Image](img/5_09.jpg)\n\
  \n> 提示\n图像必须上传到服务器，访问者才能看到它们。\n\n> 提示\n不要让你的访问者长时间等待页面加载和查看。测试一下（记住，你的连接可能比访问者快）。如果你等不了，他们也不会等。另一种方法是创建大图像的缩略图，让访问者通过链接选择大图像。\n\
  \n> 提示\n有一个弃用的 `border` 属性（`border=\"n\"`，其中 `n` 是像素宽度），它可以添加或消除图像周围的框，特别是链接中图像周围自动出现的框。更好，你可以使用样式来控制这以及图像的所有其他方面。\n\
  \n### 提供替代文本\n\n虽然图像在连接快速的大屏幕上效果很棒，但在手持设备、手机、慢连接或对于盲人来说，用处较小——甚至会产生问题。你可以添加描述性文本，当图像由于某种原因未显示时。同样的文本也会被阅读器读取。\n\
  \n#### 如何在图像显示时不提供替代文本\n\n1. 在 `img` 标签内，`src` 属性和值之后，输入 `alt=\"\"`。\n2. 输入如果由于某种原因图像没有\
  \ ![Image](img/red_circle-a.jpg) 显示且 ![Image](img/red_circle-b.jpg) 时应该显示的文本。\n\n\
  ![Image](img/red_circle-a.jpg) 虽然理论上替代文本可以随你多长，但大多数浏览器不会自动换行。因此，最好将其保持在 50 个字符左右。\n\
  \n```html\n<body>\n  <h2>巴塞罗那市场</h2>\n  <img src=\"cornermarket.jpg\" alt=\"市场中的水果摊\"\
  \ />\n  <p>第一张照片显示了波奎利亚市场（Mercat de Boquería）的一个水果摊位，这是位于兰布拉大道旁的中央市场。这是一个不可思议的地方，充满了各种水果、肉类、鱼类或你可能需要的任何东西。我花了很长时间才鼓起勇气在那里拍了照。你可能会说我有点胆小，但因为我住在那里，所以这只是很奇怪。你们会给自己的超市拍照吗？</p>\n\
  </body>\n```\n\n![Image](img/red_circle-b.jpg) 在 Internet Explorer 中，替代文本会显示在一个带有红色\
  \ x 的小框旁边。在其他浏览器中，文本单独显示。\n\n![Image](img/5_10.jpg)\n\n3. 输入 `\".\"`。\n\n> 提示\n\
  在 `HTML5` 中，所有 `img` 元素都需要 `alt` 属性。\n\n> 提示\n如 `JAWS` 等屏幕阅读器会大读替代文本，以便盲人或视觉受障访问者能够了解图像的内容。\n\
  \n\n\n\n\n如果图像对非视觉用户不相关，W3C 建议你使用 `alt=\"\"`。带有说明或附近有准确描述该图像文本的图像可以使用空白 `alt` 文本。\n\
  \n### 指定图像大小\n\n有时当你加载 Web 页面时，你会先看到文本，几秒钟后图像加载时，文本会发生跳动以适应图像。发生这种情况的原因是在 HTML 中没有指定图像的大小。\n\
  \n当浏览器处理到图像的 HTML 代码时，它必须加载图像以查看它有多大以及必须为其预留多少空间。如果你指定了图像的尺寸，浏览器将预留空间，并在图像加载时填充图像周围的文本，这样你的布局在页面加载时就能保持稳定。\n\
  \n你可以使用浏览器或图像编辑程序来获取图像的精确尺寸。\n\n浏览器还会拉伸或缩小图像，以适应你在 HTML（或 CSS）中指定的尺寸。如果你想在不同的场景下使用同一个图像文件，可以利用这一优势，但如果你编辑了图像文件并更改了其尺寸，请务必更新你的代码。\n\
  \n#### 使用浏览器查找图像尺寸\n\n**1.** 右键点击图像。会出现一个上下文弹出菜单 ![Image](img/red_circle-a.jpg)。\n\
  \n![Image](img/red_circle-a.jpg) 在浏览器中右键点击图像以上下文弹出菜单。浏览器将提供检查图像、显示其属性或获取尺寸的方法。\n\
  \n![Image](img/5_11.jpg)\n\n**2.** 选择“属性”或“查看图像信息”（取决于你的浏览器）![Image](img/gray_circle-a.jpg)。出现一个框显示以像素为单位的图像尺寸\
  \ ![Image](img/red_circle-b.jpg)。\n\n![Image](img/red_circle-b.jpg) 出现一个框（外观取决于你使用的浏览器），显示以像素为单位的图像尺寸。\n\
  \n![Image](img/5_12.jpg)\n\n#### 使用 Photoshop 查找图像尺寸\n\n**1.** 在 Photoshop 中打开图像。\n\
  \n**2.** 将文档窗口调宽，使文档信息栏在窗口左下角可见。\n\n**3.** 点击文档信息栏。出现一个小框，显示有关图像的信息，包括它的尺寸 ![Image](img/red_circle-c.jpg)。\n\
  \n![Image](img/red_circle-c.jpg) 在 Photoshop 中，点击文档窗口底部的文档信息栏以查看图像的属性。（如果文档信息栏未显示，请将窗口调宽。）\n\
  \n![Image](img/5_13.jpg)\n\n![Image](img/red_circle-d.jpg) 如果你以像素指定了精确的高度和宽度，浏览器将不必花费时间来处理，并将更快地显示图像。\n\
  \n***\n\n<<body>\n\n<h2>巴塞罗那市场</h2>\n\n<img src=\"cornermarket2.jpg\" alt=\"市场中的水果摊位\"\
  \ width=\"300\" height=\"399\" />\n\n<p>第一张照片展示了波盖利亚市场（Mercat de la Boquería）的一个水果摊位，这是位于兰布大道附近的中央市场。这是一个不可思议的地方，充满了各种水果、肉、鱼或你可能需要的任何东西。我花了很长时间才鼓起勇气在那里拍了照。你可以说我有点胆小，但因为我住在那里，这感觉只是有点奇怪。你会给你你常去的超市拍照吗？</p>\n\
  \n</body>\n\n</html>\n\n***\n\n#### 在 HTML 中指定图像尺寸\n\n**1.** 使用“使用浏览器查找图像尺寸”或“使用\
  \ Photoshop 查找图像尺寸”中描述的技术之一确定你的图像尺寸。\n\n**2.** 在 `img` 标签内，`src` 属性之后，输入 `width=\"\
  x\" height=\"y\"`，使用你在第 1 步中找到的值来指定 `x` 和 `y`（图像的宽度和高度）的像素值。\n\n***\n\n提示\n\n`width`\
  \ 和 `height` 属性并不一定反映图像的实际尺寸。\n\n***\n\n提示\n\n如果你有多个尺寸相同的图像，可以使用样式同时设置它们的 `height`\
  \ 和 `width`。\n\n***\n\n提示\n\n你也可以通过在独立窗口中打开图像来查找浏览器查找尺寸。尺寸显示在标题栏中 ![Image](img/red_circle-e.jpg)。\n\
  \n![Image](img/red_circle-e.jpg) 如果你直接在浏览器中打开图像（这是 Windows 版的 Firefox），其尺寸将显示在标题栏中。\n\
  \n![Image](img/5_14.jpg)\n\n***\n\n提示\n\n在 Photoshop 或 Fireworks 中，你可以选择整个图像，然后查看“信息”面板以获取图像尺寸。\n\
  \n***\n\n### 使用浏览器缩放图像\n\n你只需通过以像素指定新的 `height` 和 `width`（![Image](img/red_circle-a.jpg)\
  \ 穿 ![Image](img/red_circle-c.jpg)）即可更改图像的显示大小。然而，最好按原始尺寸显示图像。\n\n![Image](img/red_circle-a.jpg)\
  \ 以 440 比 341 的原始尺寸显示\n\n***\n\n<h1>塔</h1>\n\n<img src=\"stupa.jpg\" alt=\"塔\" width=\"\
  220\" height=\"170\" />\n\n<p>这些位于中国云南的塔是作为场所的佛教遗迹。</p>\n\n***\n\n![Image](img/red_circle-c.jpg)\
  \ 这张用数字相机默认设置拍摄的照片尺寸为 2048 比 1536 像素，在压缩为高质量 JPEG 后约为 211.3K（对于大多数浏览器）。\n\n![Image](img/5_17.jpg)\n\
  \n浏览器缩放图像的方法不如图像编辑器先进，因此请测试结果。为了减少加载时间，你可以通过调整 HTML 中的 `height` 和 `width` 来缩放大图像。但要小心——如果你把图像放大太大，它可能会看起来颗粒感。\n\
  \n#### 使用浏览器缩放图像\n\n**1.** 输入 `<img src=\"image.url\"` 其中 `image.url` 是图像在服务器上的位置。\n\
  \n**2.** 输入 `width=\"x\" height=\"y\"`，其中 `x` 和 `y` 分别为所需的像素宽度和高度。\n\n**3.** 根据需要添加其他图像属性，然后输入\
  \ `/>`。\n\n***\n\n提示\n\n你可以在第 2 步中使用百分比值，相对于窗口（而不是原始尺寸）。\n\n***\n\n提示\n\n使用 `width`\
  \ 和 `height` 属性是更改页面上显示方式的一种快速粗暴的方法。然而，由于文件本身没有改变，访问者总是被骗。减小的图像加载时间比实际尺寸要长；放大的图像会有颗粒感。更好的解决方案是使用你的图像编辑器更改尺寸。\n\
  \n***\n\n提示\n\n你可以只设置宽度或高度，让浏览器按比例调整另一个值。\n\n***\n\n### 使用图像编辑器缩放图像\n\n大多数图像对于 Web\
  \ 页面来说都太大了。虽然用于打印的图像可能宽达 1800 像素（以 300 dpi 打印且宽度为六英寸），但 Web 页面的图像宽度极少超过 600 像素，通常为\
  \ 200 像素。\n\n当你需要更大的图像时，找一个更大的原始图像并使用图像编辑器缩小它。如果没有其他选择，使用图像编辑器放大图像比使用浏览器效果更好。但这会增加图像的文件大小和页面的加载时间。\n\
  \n#### 使用 Photoshop 缩放图像\n\n**1.** 在“存储为 Web 用设备”窗口的右下部分，点击“图像大小”中的 `W`（宽度）框或 `H`（高度）框\
  \ ![Image](img/red_circle-a.jpg)。\n\n\n\n\n\n## 2. 输入以像素为单位的新宽度或高度或百分比，然后按 `Tab`\
  \ 键调整图像 ![Image](img/red_circle-b.jpg)。\n\n![Image](img/red_circle-b.jpg) 在 `W`\
  \ 字段中输入新宽度 400 像素，然后点击 `Apply`（应用）。缩小后的图像将恰当地适应页面，在 768Kbps 的速度下下载仅需 1 秒（如果连接更快，时间更短）。\n\
  \n![Image](img/5_18.jpg)\n\n## 3. 你可以继续上下调整大小直到满意为止。在按下 `Save`（保存）之前，图像不会被重采样。\n\
  \n* * *\n\n提示\n\n在执行`Save for Web & Devices`（用于 Web 和设备）之前，你也可以通过`Image`菜单下的`Image\
  \ Size` 命令更改图像大小。请记住，`Resolution` 框的内容是无关的（它指的是输出分辨率，由 Web 端决定，而不是由你或 Photoshop，而是取决于访问者的显示器）。相反，请根据图像的像素数来确定尺寸。你必须勾选`Resample\
  \ Image` 框来更改图像的大小（而不是它的输出分辨率）。\n\n* * *\n\n* * *\n\n提示\n\n缩小图像尺寸的另一个好方法是裁剪掉不需要的区域。\n\
  \n* * *\n\n### 为你的网站添加图标\n\n你在地址栏、标签页和书签中看到的小图标（与网站相关）被称为 `favicon`，它是 favorites\
  \ icon 的缩写。\n\nApple 要求为其设备（iPhone、iPod touch 和 iPad）的主屏幕提供更大的图标；他们建议尺寸为 114 像素\
  \ x 114 像素。不用担心添加花哨的圆角、投影和反光效果；设备的操作系统会自动为你完成这些。Android 操作系统也支持这些图标。\n\n#### 为你的网站添加图标\n\
  \n**1.** 创建一个 16 像素乘以 16 像素的图像，并将其保存为 `ICO` 格式 ![Image](img/red_circle-a.jpg)。你也可以将其保存为\
  \ `PNG` 和 `GIF` 格式。\n\n![Image](img/red_circle-a.jpg) 在现实生活中，Favicons 非常小。它们的尺寸只有可怜的\
  \ 16 x 16 像素。\n\n![Image](img/5_19.jpg)\n\n**2.** 为触控设备创建一个 114 像素乘以 114 像素的图像，并保存为\
  \ `PNG` 格式。\n\n**3.** 在你的 HTML5 文档的 head 部分，输入 `<link rel=\"shortcut icon\" href=\"\
  favicon.ico\" />`，其中 `favicon.ico` 是你的图标在服务器上的名称和位置。如果你的图像是 `PNG`，输入 `<link rel=\"\
  icon\" type=\"image/png\" href=\"favicon.png\" />`。如果你的图像是 `GIF`，输入 `<link rel=\"\
  icon\" type=\"image/gif\" href=\"favicon.gif\" />`。\n\n**4.** 在你的 HTML5 文档的 head\
  \ 部分，输入 `<link rel=\"apple-touch-icon\" href=\"/apple-touch-icon.png\" />`，其中 `apple-touch-icon.png`\
  \ 是你的图标在服务器上的名称和位置。\n\n* * *\n\n提示\n\nFavicons 通常应该保存为 `ICO` 格式（![Image](img/red_circle-b.jpg)\
  \ 和 ![Image](img/red_circle-c.jpg)）。有一个实用的 Photoshop 插件可以创建 `ICO` 格式的图标，由 Telegraphics\
  \ 制作（[www.telegraphics.com.au/sw/]）。\n\n![Image](img/red_circle-b.jpg) 如果你将文件命名为\
  \ `favicon.ico` 和 `apple-touch-icon.png` 并将它们放在网站的根目录下，大多数浏览器即使没有这个链接元素也会显示你的 favicon。\n\
  \n* * *\n\n...\n\n```\n<head>\n      <meta charset=\"utf-8\" />\n      <title>Farm\
  \ Training Podcasts</title>\n      <link rel=\"shortcut icon\" href=\"/favicon.ico\"\
  \ />\n      <link rel=\"apple-touch-icon\" href=\"/apple-touch-icon.png\" />\n \
  \     ...\n</head>\n```\n\n...\n\n* * *\n\n![Image](img/red_circle-c.jpg) Favicon\
  \ 通常用于地址栏、收藏和书签菜单以及标签页。因为浏览器经常在灰色或其他颜色背景上显示你的图标，所以你可能希望让图标的背景透明的。\n\n![Image](img/5_20.jpg)\n\
  \n* * *\n\n* * *\n\n提示\n\n你也可以创建 `PNG` 和 `GIF` 格式的 favicons。请务必对 type 使用正确的 MIME\
  \ 类型。\n\n* * *\n\n* * *\n\n提示\n\nInternet Explorer 最初要求将 `favicon.ico` 文件放置在 Web\
  \ 网站的根目录下。不再是这样，尽管如果不存在链接元素，浏览器仍然会在那里寻找。\n\n* * *\n\n![Image](img/red_circle-d.jpg)\
  \ 当你从 Safari 将你的网站添加到 iOS 设备的主屏幕上时，会使用 `apple-touch-icon`。\n\n![Image](img/5_21.jpg)\n\
  \n## 6. 链接\n\n本章内容\n\n- 链接的结构\n- 创建指向另一个 Web 页的链接\n- 创建锚点\n- 链接到特定锚点\n- 创建其他类型的链接\n\
  \n链接是 Web 的命脉。没有它们，每个页面都将孤立存在，互不联系。\n\n### 链接的结构\n\n链接有两个主要部分：目的地和标签。第一部分目的地无疑是最重要的。你用它来指定访问者触发链接时会发生什么。你可以创建指向另一个页面、页面跳转、显示图像、下载文件、发送电子邮件等的链接。然而，最常见的链接指向其他\
  \ Web 页 ![Image](img/red_circle-a.jpg)，有时指向其他 Web 页上的特定位置，称为锚点。目的地通过编写 URL（参见第 1\
  \ 章）来定义，通常仅对浏览器可见。\n\n链接的第二部分是标签，即访问者在浏览器中看到或屏幕阅读器听到并激活以到达目的地的部分。它可以是文本、图像或两者。浏览器默认将标签文本显示为蓝色下划线。你可以使用\
  \ CSS 轻松更改。\n\n注意，人们通常说用户`点击`链接，这是鼠标作为网页导航手段的体现。例如，使用触摸屏设备（如智能手机和平板）的用户点击链接，而其他移动用户通过轨迹球激活链接。同时，某些用户使用键盘导航页面，无论是出于喜好还是需要；他们可能有身体障碍，导致难以或无法使用鼠标、数字笔或类似设备。这些用户通常切切换到链接（使用\
  \ `Tab` 键向前移动，使用 `Shift-Tab` 向后移动），然后用 `Enter` 或 `Return` 键触发它们。\n\n\n\n\n\n![Image](img/red_circle-b.jpg)\
  \ 当访问者指向一个链接时（在大多数浏览器中默认显示为蓝色、带下划线的文本），目标 URL 将显示在状态栏中。你可以用 CSS 更改默认样式。如果用户激活一个链接...\n\
  \n![Image](img/06_02.jpg)\n\n![Image](img/red_circle-c.jpg) ...与该目标 URL 关联的将在用户的浏览器中显示。\n\
  \n![Image](img/06_03.jpg)\n\n![Image](img/red_circle-d.jpg) 这种链接在之前的 HTML 版本中是无效的，但\
  \ HTML5 允许使用。\n\n***\n\n...\n\n```html\n<body\n  <a href=\"giraffe-escapes.html\"\
  >\n    <hgroup>\n      <h1>长颈鹿从动物园逃脱</h1>\n      <h2>全世界的动物都在欢呼</h2>\n    </hgroup>\n\
  \  </a>\n</body>\n...\n</body>\n</html>\n```\n\n***\n\n### 节创建一个指向另一个 Web 页面的链接\n\
  \n1. 输入 `<a href=\"page.html\">`，其中 `page.html` 是目标 Web 页面的 URL。\n2. 输入标签文本，即默认高亮的文本\
  \ ![Image](img/gray_circle-b.jpg)，当激活时，它将把用户带到第 1 步中引用的页面。或者（或除了标签文本），添加一个 `img`\
  \ 元素作为标签。（参见本节中“创建其他类型的链接””中的 ![Image](img/gray_circle-a.jpg) ，以及该节中的“链接缩略图图像”）。）。\n\
  3. 输入 `</a>` 以完成链接的定义。\n\n### HTML5 的块级链接\n\nHTML5 允许将链接包裹在几乎任何类型的元素或元素组周围 ![Image](img/gray_circle-d.jpg)。示例包括段落、列表、整篇文章和章节——除了交互式内容（如其他链接、音频、视频、表单元素、iframe\
  \ 等）之外的任何内容。在 HTML 验证器中测试你的页面（参见 第 20 章 中的“验证你的代码”）将让你发现你何时将链接包裹在了不允许的元素周围。\n\n\
  这些被非正式称为`块级链接`的链接与之前的 HTML 版本很大不同，之前的版本只允许链接文本、图像以及所谓的 `inline`（内联）元素。也就是说，标记文本短语的元素，如\
  \ `em`、`strong`、`cite` 等（这些在 HTML5 中被归类为 `phrasing content` 内容）。\n\n有趣的是，尽管在之前的\
  \ HTML 规范中不允许块级链接，但浏览器仍然支持它们。这意味着你现在可以使用它们，而且它们在旧版和现代浏览器中都能正常工作。然而，使用它们时要加小心 (![Image](img/gray_circle-d.jpg)\
  \ 和 ![Image](img/red_circle-e.jpg))。\n\n![Image](img/red_circle-e.jpg) 不要过度使用。避免像此处所示的操作，即将链接包裹在大块内容周围。虽然链接可以正常且符合\
  \ HTML5 规范，但屏幕阅读器可能会多次读取所有内容，即使是这么多内容只读 `once` 次，也比访问者通常想听的链接信息多。最好将你的链接焦点缩小到最相关的内容上。\n\
  \n***\n\n...\n\n```html\n<body>\n  <a href=\"pioneer-valley.html\">\n    <article>\n\
  \      <h1>Cookie 和 Woody</h1>\n      <img src=\"img/cookiefora.jpg\" width=\"143\"\
  \ height=\"131\" alt=\"Cookie\" />\n      <img src=\"img/woodygran.jpg\" width=\"\
  202\" height=\"131\" alt=\"Woody\" />\n      <p>Cookie 和 Woody 通常被认为是先驱谷地最甜但也最独立的猫，它们一直被它们谦虚的人类所低估。</p>\n\
  \    </article>\n  </a>\n</body>\n</body>\n</html>\n```\n\n***\n\n有一些需要考虑的无障碍访问性问题，特别是关于不同的屏幕阅读器如何处理块级链接。这两篇文章分别由无障碍专家\
  \ Derek Featherstone 和 Steve Faulkner 撰写，更深入地讨论了这些问题：[`simplyaccessible.com/article/html5-block-links/`](http://simplyaccessible.com/article/html5-block-links/)\
  \ 和 [www.paciellogroup.com/blog/2011/06/html5-accessibility-chops-block-links/](http://www.paciellogroup.com/blog/2011/06/html5-accessibility-chops-block-links/)。他们建议将最相关的内容放在链接的开头，不要在一个链接中放入过多的内容。正如\
  \ Featherstone 指出的，随着屏幕阅读器和浏览器追上并正式支持块级链接，无障碍访问问题很可能是暂时的。\n\n通常情况下，你可能希望坚持第一个示例所示的更简单、传统的链接样式\
  \ ![Image](img/gray_circle-a.jpg)，但也要知道精心设计的块级链接也是你可用的。\n\n![Image](img/red_circle-f.jpg)\
  \ 如果你正在创建指向他人网站的链接，使用绝对 URL，包含 `http://`、服务器和路径。`rel` 属性是可选的，但建议使用 `rel=\"external\"\
  ` 来明示指向另一个站点。（参见第 4 章中的“链接”）。\n\n***\n\n...\n\n```html\n<body>\n  <article>\n  \
  \  <h1>猫的荣耀</h1>\n    <p><a href=\"http://en.wikipedia.org/wiki/Cat\">猫</a>是奇妙的伙伴。</p>\n\
  \    <p>事实上，它们拥有 T.S. 艾略特的 <cite>猫之书</cite></p>\n  </article>\n</body>\n</html>\n\
  ```\n\n![Image](img/red_circle-g.jpg) 当访问者指向一个链接时（在大多数浏览器中默认显示为蓝色、带下划线的文本）指向另一个站点，目标\
  \ URL 将显示在状态栏中。![Image](img/06_04.jpg)\n\n![Image](img/red_circle-h.jpg) ...与该目标\
  \ URL 关联的将在用户的浏览器中显示。\n\n![Image](img/06_05.jpg)\n\n\n\n\n\n无论你做什么，请避免使用“点击此处”（Click\
  \ here）作为标签。这种类型的链接文本在网络上太常见了，这对可用性、无障碍性以及你作为网站所有者来说都是糟糕的。当用户快速扫描页面上的链接时（无论是通过视觉视觉还是通过屏幕阅读器），“点击此处”缺乏上下文（“点击此处？为什么？”）。激活链接的动力不足，而且它依赖于访问者阅读链接周围的文本，并希望这些能解释链接的作用。可以理解，你的访问者很可能跳过它。此外，正如本章开头提到的，“点击”（click）一词并不适用于所有用户触发链接的方式。相反，请使用文本已有的关键词来标识链接。例如，使用“了解我们的促销活动”而不是“点击此处了解我们的促销活动”。\n\
  \n### 提示\n确保你网站上的每个页面都包含指向网站关键部分的导航，包括首页。这让访问者能够自由地浏览你的网站，无论他们是直接进入还是通过其他网站的链接进入。你永远不知道访问者会从哪里进入你的网站。它可能是通过一个“深度链接”到你某个内部页面的链接，因此你通常希望允许他们从那里访问网站的其他部分。\n\
  \n### 提示\n要创建一个指向页面特定位置的链接，请使用锚点（参见本章中的“创建锚点”）。\n\n### 提示\n正如本章引言所述，你可以通过键盘浏览页面。每当你按下\
  \ `Tab` 键，焦点就会移动到 HTML 代码中出现的下一个链接、表单控件或图像映射，这与它们在屏幕上显示的位置并不相同，因为页面的 CSS 布局可能不同。HTML\
  \ 的 `tabindex` 属性允许你更改制表顺序，但不建议你使用它，因为在大多数情况下这是一种不必要且过时的做法。（在某些情况下它是帮助的，但通常是在你使用\
  \ `JavaScript` 增强交互时，这是一个比较进阶的话题。）相反，请注意标记你的内容，使制表顺序符合逻辑。通过按 Tab 键遍历你自己的页面来测试这一点，看看你作为用户的感受如何，并相应调整\
  \ HTML。\n\n## `target` 属性\n让链接在新窗口或标签页中打开可能的（取决于浏览器），但这被认为是一种糟糕的做法，所以我建议你不要这样做。有几个反对它的理由。\n\
  \n首先，在不同的窗口或标签页中打开链接应该是用户的决定，而不是我们这些 HTML 开发者的决定。否则，我们就是在替用户独断了他们的浏览行为。\n\n还存在可用性和无障碍方面的问题。经验较少的用户在激活链接后没有看到结果显示在当前窗口中时，可能会感到困惑。使用浏览器对每个人来说都是浅易的；我曾向不同年龄的人展示过浏览器标签页，他们之前完全不知道可以同时打开多个页面。同样，屏幕阅读器等辅助设备的用户必须设法导航到那个新窗口或标签页，前提是他们能看出是哪一个加载了新内容。\n\
  \n如果这些还没有说服你避免在其他窗口和标签页中加载链接，或者你的老板或客户不听取你反对它的合理论点，那么方法如下：在你的链接定义中输入 `target=\"\
  window\"`，其中 `window` 是你指定的显示相应页面的窗口名称（你自定义）。\n\n例如，`<a href=\"some-page.html\"\
  \ target=\"doodad\">某些页面</a>` 会在名为 `doodad` 的新窗口或标签页中打开 `some-page.html`。\n\n如果你将多个链接目标指向同一个窗口（即使用相同的名称），则所有链接都将在该窗口中打开。或者，如果你始终希望链接在不同的窗口或标签页中打开（即使你多次激活同一个链接），请使用\
  \ HTML 的预定义名称 `_blank`，如 `target=\"_blank\"`。\n\n`target` 还有另一个用途，即在 `iframe` 中打开链接。你编写\
  \ `target` 的方式相同，但它的值应该匹配 `iframe` 的 `id`。你很少会有机会用到它，特别是因为 `iframe` 通常是不被推荐的（尽管它们有时有其用武之地）。可以在\
  \ `https://developer.mozilla.org/en/HTML/Element/iframe` 学习更多关于 `iframe` 元素的信息。\n\
  \n这里没有介绍图像映射，但你应该知道它们允许你向单张图像的一个多个区域添加链接。你可以将每个链接区域的形状定义为矩形、圆形或多边形。经验较少的程序员经常误用它们创建基于图像的导航，而不是使用首选的技术，如带有\
  \ CSS 样式的 HTML 文本（或者当 CSS 不够时使用图像替换技术）。图像映射的黄金时代是许多年前这些技术流行（甚至可行）之前。现在实践中很少看到图像映射，但偶尔会有合法的用例——例如，一张国家图片，你想在其中定义到不同地区、省份或州的链接。\n\
  \n### 创建锚点\n通常情况下，激活链接会将用户带到页面。如果你想让用户跳转到特定部分，请创建一个锚点并在链接中引用该锚点。\n\n\n\n\n\n![Image](img/red_circle-b.jpg)\
  \ 第一个示例 ![Image](img/gray_circle-a.jpg) 在设计上保持了简单，仅是为了演示基本的锚定。然而，你可以通过将每个答案封装在 `section`\
  \ 元素中进一步增强语义化，并将 `ids` 放在这些元素而不是标题上。这会将它们标记为父文章的章节。另一种标记此类内容的方法（未显示）是移除父文章并将每个 `section`\
  \ 替换为 `article`，从而将每个答案都视为一个独立的文章。这取决于你想要如何描述你内容的含义（你认为这些答案是一篇文章的内容，还是若干独立的文章？）。\n\
  \n***\n\n...\n\n```html\n<header>\n    <h2>Table of Contents</h2>\n    <nav>\n \
  \       <ul>\n            <li><a href=\"#intro\">Introduction</a></li>\n       \
  \     ...\n        </ul>\n    </nav>\n</header>\n\n<article>\n    <section id=\"\
  intro\">\n        <h2>Introduction</h2>\n        <p>This is the intro...</p>\n \
  \   </section>\n    <section id=\"main-characters\">\n        <h2>Description of\
  \ the Main Characters</h2>\n        ...\n    </section>\n    <section id=\"rising-action\"\
  >\n        <h2>Rising Action</h2>\n        ...\n    </section>\n</article>\n\n</body>\n\
  </html>\n```\n\n***\n\n***\n\n### Tip\n为你的锚点 `ids` 赋予意义的名字，以增加 HTML 文档的语义丰富性。句话说，避免使用像\
  \ `anchor1` 和 `item5` 这样通用的 `ids`。\n\n***\n\n***\n\n### Tip\n`ids` 中不允许包含空格。请使用连字符分隔多个单词的\
  \ `id` 值。\n\n***\n\n***\n\n### Tip\n在某些情况下，你可能希望每个内容章节下方包含一个链接，返回目录（你可能习惯了看到这些作为“返回顶部”链接）。但是，如果你的页面有多个长章节，你可能希望将其拆分为多个页面。\n\
  \n***\n\n***\n\n### 链接到特定锚点\n\n一旦你通过 `id` 创建了锚点，就可以定义链接，当用户触发它时，页面将直接跳转到包含锚点 ![Image](img/red_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-b.jpg) 的文档部分，而不是跳转到文档顶部。\n\n![Image](img/red_circle-a.jpg)\
  \ 当访问者指向引用锚点的链接时，URL 和锚点名称将出现在桌面浏览器的状态栏（窗口左下角）中。\n\n![Image](img/06_06.jpg)\n\n\
  ![Image](img/red_circle-b.jpg) 一旦访问者激活链接，锚点引用的页面特定部分将在浏览器窗口顶部显示。\n\n![Image](img/06_07.jpg)\n\
  \n#### 创建指向锚点的链接\n\n**1.** 输入 `<a href=\"#anchor-name\">`，其中 `anchor-name` 是目标 `id`\
  \ 属性的值（参见“[如何创建锚点””的第 2 步）。\n\n**2.** 输入标签文本，即被高亮的文本（通常默认为蓝色并带有下划线），激活后它将把用户带到第\
  \ 1 步中引用的章节。\n\n**3.** 输入 `</a>` 完成链接的定义。\n\n***\n\n***\n\n### Tip\n如果锚点在单独的文档中，使用\
  \ `<a href=\"page.html#anchor-name\">` 来引用该章节（URL 和 `#` 之间不应空格）。如果锚点在不同服务器的页面上，你必须输入\
  \ `<a href=\"http://www.site.com/path/page.html#anchor-name\">`（无空格）。\n\n***\n\n\
  ***\n\n### Tip\n虽然你显然无法给别人的页面添加锚点，但你可以利用他们已经创建的锚点。查看他们文档的源代码，查看哪些锚点对应哪些章节。（如需查看源代码的帮助，请参阅\
  \ 2 章 中的“他人的启发”）。\n\n***\n\n***\n\n### Tip\n如果锚点位于页面底部，它可能不会显示。\n\n***\n\n***\n\n\
  ### 创建其他类型的链接\n\n你不限于图片。你可以创建指向 Web 上任何文件的链接，包括图片、ZIP 文件、程序、PDF、Excel 表格等，只需输入 `http://www.site.com/path/file.ext`，其中\
  \ `www.site.com` 是服务器名称，`path/file.ext` 是目标文件的路径，包括其扩展名。\n\n你可以创建指向各种类型内容的链接：\n\n\
  - **图片：** ![Image](img/red_circle-a.jpg) ![Image](img/red_circle-b.jpg)\n- **电子邮件：**\
  \ `<a href=\"mailto:someone@somain.com\">someone@somain.com</a>`\n- **视频：** `<a\
  \ href=\"video.mov\">a video</a>`\n- **HTML5：** `<abbr title=\"HTML5\">HTML5</abbr>`\n\
  \n注意，无论链接导向哪里，在浏览器中默认看起来都几乎一样，除非你将其包裹在照片周围（某些浏览器会在图片周围显示边框，某些则不会）。\n\n```html\n\
  <body>\n<h1>Other Types of Links</h1>\n<p>有一个照片库页面，它显示了几个缩略图（你图片的微型版本），这些图链接到更大的版本。这让你在选择查看哪些全尺寸图片之前，一眼看到很多照片。</p>\n\
  </body>\n```\n\n\n\n注意不要让某个页面上的缩略图数量过大。虽然它们可能很小，但每个缩略图都是对 Web 服务器的独立请求，这些请求会累积并减慢页面加载速度。关于多少个合适并没有固定的规定。这在很大程度上取决于页面加载的其他资源的数量和大小，以及你的目标受众。例如，移动设备加载资源的速度通常较慢。\n\
  \n因此，如果你有很多缩略图，请考虑将它们拆分为多个页面。通常情况下，每页显示 20–30 个缩略图是合理的，同样需要考虑到我提到的那些因素。你可能需要测试你的页面以确定效果最佳的方案。\n\
  \n最后，我建议使用无序列表（`ul`）对你的缩略图列表进行标记，参见第 15 章。\n\n### 提示\n如果你创建一个浏览器无法处理的文件链接（例如 Excel\
  \ 文件），浏览器将尝试打开一个辅助程序来查看文件，或者尝试将其下载到访问者的驱动器中。\n\n### 提示\n虽然你可以链接到 PDF 和其他非 HTML 文档（Word、Excel\
  \ 等），但请尽可能避免这样做。相反，请链接到包含这些信息的 HTML 页面。PDF 加载可能需要长时间，而且某些浏览器和系统（尤其是旧版本）在尝试显示它们时可能会变得迟钝。在\
  \ PDF 是你唯一选择的情况下，请明确告知用户该链接指向 PDF 而不是另一个 HTML 页面，这样他们才不会感到意外（用户并不喜欢被骗去进行耗时的下载）。这一建议也适用于其他非\
  \ HTML 文档。你可以通过在括号中注明文件类型和大小来简单地传达这一点；显示图标也会有帮助。这里有一个示例（不带图标）：`<a href=\"q2-sales-report.pdf\"\
  >Q2 销售报告 (PDF, 725kb)</a>`。你可能还想在链接上添加 title 属性（例如 `title=\"打开 PDF\"`），特别是当你把括号内的注释放在链接外部时。\n\
  \n### 提示\n压缩你希望访问者下载的大文件或组是一个好主意。例如，一组保存为 `PSD` 文件的 Photoshop 模板。在网上搜索“ZIP and RAR”，可以找到使用这些流行压缩格式创建和打开文件存档的工具。\n\
  \n### 提示\n如果你想“创建指向 iTunes Store、App Store、iBookstore 和 Mac App Store 内容的链接”（参见随后的\
  \ URL），你可以使用 Apple 的 Link Maker ([`itunes.apple.com/linkmaker`](http://itunes.apple.com/linkmaker))\
  \ 来生成包含在你的 HTML 中的 URL。如果你是附属会员（`[www.apple.com/itunes/affiliates/](http://www.apple.com/itunes/affiliates/)`），当人们通过你的链接购买商品时，Apple\
  \ 将为你支付佣金。\n\n# 7. CSS 构建模块\n\n## 本章内容\n- 构建样式规则\n- 在样式规则中添加注释\n- 级联：当规则冲突时\n- 属性的值\n\
  \nHTML 定义了内容的含义并为你的 Web 页面提供了基本结构，而 CSS（层叠样式表）定义了外观。\n\n样式表仅仅是一个文本文件，其中包含一个或多个规则，这些规则通过属性和值决定了\
  \ Web 页面中某些元素应该如何显示。CSS 有用于控制基本格式（如字体大小和颜色）的属性，用于布局（如定位和浮动）的属性，以及用于打印控制（如决定访问者打印页面时在何处显示分页）的属性。CSS\
  \ 还有许多动态属性，允许项目出现和消失，这对于创建下拉列表和其他交互式组件非常有用。\n\nCSS2 是新旧浏览器中支持程度最好的版本，因此本书将对其进行广泛阐述。CSS3\
  \ 作为一个仍在演进的规范，它在 CSS2 的基础上构建，提供了设计人员和开发者长期渴望的功能。一个好消息是，现代浏览器已经实现了若干 CSS3 组件，因此你现在就可以开始使用它们。你将学习一些支持最好的实用功能。\n\
  \nCSS 的奇妙之处在于它可以在 Web 页面之外创建，然后一次性应用于你网站上的所有页面。它是灵活、强大且高效的，可以节省大量的时间和带宽。\n\n为了充分发挥\
  \ CSS 的优势，你的 Web 页面必须根据 HTML 章节中的建议进行良好且一致的标记。\n\n### 构建样式规则\n样式表中的每个样式规则有两个主要部分：`selector`（选择器），它决定哪些元素受影响；以及\
  \ `declaration block`（声明块），由一个或多个属性/值对（每个构成一个 `declaration`）组成，它指定了具体要做什么(!Image](graphics/red_circle-a.jpg)\
  \ 和 ![Image](img/red_circle-b.jpg))。\n\n![Image](img/red_circle-a.jpg) 样式规则由选择器（指示哪些元素将被格式化）和一个声明块（描述应执行的格式）组成。块中的每个声明都是由冒号分隔的属性/值对，并以分号结束。左大括号开始声明块，右大括号结束它。\n\
  \n![Image](img/181fig01.jpg)\n\n![Image](img/red_circle-b.jpg) 声明的顺序并不重要。在这个例子中，`color:\
  \ red` 在 `background: yellow` 之前的效果相同。注意额外的空格和缩进（可选，但建议）以保持可读性。\n\n![Image](img/181fig02.jpg)\n\
  \n### 构建样式规则\n1. 输入 `selector`，其中 `selector` 标识你想要格式化的元素。你将在第 9 章学习如何创建各种选择器。\n\
  2. 输入 `{`（左大括号）开始声明块。\n3. 输入 `property: value;`，其中 `property` 是描述想要格式的 CSS 属性名称，`value`\
  \ 是该属性允许选项之一。CSS 属性和值的描述见第 8 章。\n4. 根据需要重复步骤 3。通常，你会在每个 `property: value`（一个声明）单独占一行。\n\
  5. 输入 `}` 完成声明块和样式规则。\n\n### 提示\n你可以在样式规则中添加额外的空格、制表符或换行，以保持样式表易于阅读![Image](img/gray_circle-b.jpg)\
  \ 示例中的格式可能是编码人员中最常用的。\n\n### 提示\n虽然每个属性/值对应该用分号隔开，但你可以省略列表最后一个对后的分号。但我建议始终包含它，因为这是一种最佳实践。\n\
  \n### 提示\n缺失（或重复）分号会导致浏览器忽略该样式规则。\n\n### 在样式规则中添加注释\n在 CSS 中添加注释是一个好主意，可以标记样式表的主要部分，或者简单地解释特定规则或声明。注释不仅对你有帮助，也能帮助查看你代码的人。为了你自己，如果你在最初编写代码几个月后重新查看它，你会为自己留下的注释感到高兴。\n\
  \n#### 为样式规则添加注释\n1. 在你的样式表中，输入 `/*` 开始你的注释。\n2. 输入注释内容。\n3. 输入 `*/` 表示注释结束。\n\n\
  ### 提示\n注释可以包含换行符，因此可以跨多行![Image](img/red_circle-a.jpg)。\n\n\n\n\n![Image](img/red_circle-a.jpg)\
  \ 注释可以长也可以短，尽管它们通常是简短的。你可以根据需要使用它们来描述某个样式规则或一组相关规则的作用。注释有助于让你的样式表更易维护。\n\n```css\n\
  /* 这是一个 CSS 注释。它可以是单行，也可以跨多行。这一行比大多数都长。无论如何，CSS 注释永远不会在浏览器中与你的网站 HTML 内容一起显示。下一个则更符合注释的典型用法。\
  \ */\n\n/* 为旧版浏览器设置某些 HTML5 元素的默认渲染。 */\n\narticle, aside, details, figcaption,\
  \ figure, footer, header, hgroup, menu, nav, section {\n    display: block;\n}\n\
  ```\n\n### 提示\n你不能在注释内部放置另一个注释。换句话说，注释中不能包含 `*/`。\n\n### 提示\n你可以在单独的一行开始注释 ![Image](img/gray_circle-a.jpg)，也可以在声明块内部\
  \ ![Image](img/red_circle-b.jpg) 或在规则之后 ![Image](img/gray_circle-b.jpg) 开始注释。\n\n\
  ![Image](img/red_circle-b.jpg) 你也可以在声明块内部或规则之后插入注释。\n\n```css\n/* 在支持的浏览器中添加圆角 */\n\
  .box {\n    -webkit-border-radius: 12px; /* Safari 3-4 */\n    -moz-border-radius:\
  \ 12px; /* Firefox 3.6 及以下 */\n    border-radius: 12px; /* 现代浏览器 */\n} /* 再加一条注释以防！\
  \ */\n```\n\n### 提示\n注释作为组织工具非常有帮助。样式表可能会变得很长，因此对它们进行组织对于使你的 CSS 易于演进和维护至关重要。将相关的规则分组并在每组之前加上一个描述性注释是常见做法\
  \ ![Image](img/red_circle-c.jpg)。\n\n![Image](img/red_circle-c.jpg) 注释能让你在管理样式表时变得更轻松。只需对样式表中的主要规则部分进行注释即可保持其整洁。我发现，使用像这里的格式（全大写并带有下下划线）可以清楚地显示每个主要分组的开始位置。这种处理方式将它们与其他注释区分开，例如\
  \ ![Image](img/gray_circle-a.jpg) 和 ![Image](img/gray_circle-b.jpg) 中的注释。\n\n```css\n\
  /* 全局导航\n------------------------------- */\n... 全局导航的规则 ...\n\n/* 主体内容\n-------------------------------\
  \ */\n... 主体内容的规则 ...\n\n/* 注册表单\n------------------------------- */\n... 注册表单的规则\
  \ ...\n\n/* 页面页脚\n------------------------------- */\n... 页面页脚的规则 ...\n```\n\n###\
  \ 提示\n无论你如何格式化注释 ![Image](img/gray_circle-c.jpg)，我都建议决定约定并一致地使用它，特别是当你与团队合作时。\n\n\
  ### 提示\n你可以将注释放置在样式规则周围或内部，以便在浏览器中隐藏它们 ![Image](img/red_circle-d.jpg)。这是测试样式表的一种好方法，可以在你准备好（如果准备的话）之前，而无需永久删除被注释的部分。它是一个非常有用的调试工具；注释掉你认为可能导致问题的代码，在浏览器中刷新页面，查看问题是否得到解决。\n\
  \n![Image](img/red_circle-d.jpg) 你可以“注释掉”一个不想影响页面的声明。在这里，所有图像将获得四像素的实红色边框，但没有右边距处理，因为\
  \ `margin-right: 12px;` 位于注释内部。注释也可以包裹整个规则，只要注释内部没有其他注释即可。\n\n```css\nimg {\n  \
  \  border: 4px solid red;\n    /* margin-right: 12px; */\n}\n```\n\n### 提示\n虽然这些示例为了演示使用了大量的注释，但不要觉得需要注释所有内容。如果样式表中有太多注释，你可能会发现它们更难阅读。你可能会发现，良好的组合是组织性注释与需要时的描述性注释的结合。找到适合你和团队中其他人的平衡点。\n\
  \n### 级联：当规则发生冲突时\n样式来自许多来源。正如你在第 1 章中所学习到的，每个浏览器都有自己的默认样式。但你可以通过三种方式应用你自己的样式来覆盖或补充这些样式：你可以从外部文件加载一个或多个文件（推荐方法）![Image](img/red_circle-a.jpg)，将它们插入\
  \ HTML 文档的顶部，或者直接在代码中对特定的 HTML 元素应用样式（尽管应尽可能避免）。请查看下一章有关每种方法的细节。\n\n![Image](img/red_circle-a.jpg)\
  \ 这是 ![Image](img/red_circle-b.jpg) 中 HTML 文档的样式表。现在不需要过度担心细节，但请注意有一个针对 `p` 元素的规则。\n\
  \n```css\np {\n    color: #36c;\n    font-family: \"Trebuchet MS\", \"Helvetica\"\
  , sans-serif;\n    font-weight: bold;\n}\n\nimg {\n    float: left;\n    margin-right:\
  \ 10px;\n}\n```\n\n![Image](img/red_circle-b.jpg) `em` 和 `small` 元素包含在 `p` 中，因此它们是\
  \ `p` 的子元素。然而，`h1` 不是，所以它不像另一个蓝色。\n\n```html\n...\n<body>\n    <h1>转瞬即逝的花</h1>\n\
  \    <img src=\"img/blueflax.jpg\" width=\"300\" height=\"175\" alt=\"蓝花\" />\n\
  \    <p>我对我花园里不知何时占领的美丽蓝花感到非常*惊讶</em>。它们每个早晨都色彩斑斓，但到下午一朵花都不复存在。它们是转瞬即逝的定义。</p>\n\
  \    <p><small>&copy; 蓝花协会所有</small></p>\n</body>\n```\n\n![Image](img/red-c.jpg)\
  \ 在 ![Image](img/gray_circle-a.jpg) 中没有显式指定 `em` 和 `small` 规则的情况下，它们从父元素 `p` 继承字体和颜色。斜体来自浏览器对\
  \ `em` 的默认样式。使用 `small` 标记的法律声明（即“细字字体”）的大小由于同样的原因缩小了。\n\n\n\n\n继承决定了当对元素没有应用任何样式规则时会发生什么，而\
  \ `specificity`（优先级）则是当应用了多个规则时（![Image](img/red_circle-d.jpg) 直到 ![Image](img/red_circle-f.jpg)）的关键。优先级规则规定：选择器越具体，规则越强。这听起来很有道理，对吧？所以，如果一条规则规定所有\
  \ `h1` 元素应该是蓝色的，但第二条规则规定所有具有 `spanish` 类的 `h1` 元素应该是红色的，那么对于所有类名为 `spanish` 的 `h1`\
  \ 元素，第二条规则将覆盖第一条，因为 `h1.spanish` 比简单的 `h1` 更具体。\n\n![Image](img/red_circle-d.jpg)\
  \ 在这个示例中，有四条优先级不同的规则。第一条影响任何 `p` 元素，第二条只影响类名等于 `group` 的 `p` 元素，第三条和第四条则只影响 id 为\
  \ `last` 的单个 `p` 元素。\n\n```css\np {\n    color: red;\n}\n\np.group {\n    color:\
  \ blue;\n}\n\np#last {\n    color: green;\n}\n\np#last {\n    color: magenta;\n\
  }\n```\n\n![Image](img/red_circle-e.jpg) 三段文字：一个是通用的，一个只有一个类，另一个既有类又有 id。\n\n```html\n\
  ...\n<body>\n  <p>这是一个通用的 <code>p</code> 元素。它将是是红色的。</p>\n  <p class=\"group\">这是一个具有\
  \ <code>class</code> 属性且其置为 <code>group</code> 的 <code>p</code> 元素。有两条规则适用，但由于 <code>p.group</code>\
  \ 规则更具体，这段文字将是蓝色的。</p>\n  <p id=\"last\" class=\"group\">这是一个具有 <code>id</code>\
  \ 属性且其置为 <code>intro</code> 的 <code>p</code> 元素。有四条规则可以应用到这段文字上。前两条被更具体的后两条规则所覆盖。位置打破了后两条规则之间的平局：后出现的那个胜出，因此这段文字将是洋红色的。</p>\n\
  </body>\n```\n\n注意，`id` 属性被认为是最具体的（因为它们在文档中必须是唯一的），而 `class` 属性的存在使得选择器比没有任何属性的简单选择器更具体。事实上，拥有多个类的选择器比仅有一个类的选择器更具体。仅包含元素名称的选择器在优先级量上上随其后；继承规则被认为是最通用的，会被任何其他规则覆盖。\n\
  \n关于计算优先级的精确规则，请参阅 CSS 规范的第 6.4.3 节 ([www.w3.org/TR/CSS21/cascade.html#specificity](http://www.w3.org/TR/CSS21/cascade.html#specificity))）。\n\
  \n有时，优先级不足以在竞争规则中决定胜者。在这种情况下，规则的 `location`（位置）打破平局：后出现的规则权重更大（![Image](img/gray_circle-d.jpg)\
  \ 直到 ![Image](img/gray_circle-f.jpg)）。例如，直接内联在 HTML 元素的规则（再次，不建议这样做）被认为排在外部样式表或嵌入\
  \ HTML 文档顶部的等优先级规则之后（因此权重更高）。更多细节，请参阅第 8 章 中的“位置的重要性”。\n\n![Image](img/red_circle-f.jpg)\
  \  由于第三条和第四条规则的优先级相同，它们的位置成了一个影响因素——因此由于第四条规则最后出现，所以第四条规则胜出。\n\n![Image](img/7_02.jpg)\n\
  \n如果这还不够，你可以通过在规则末尾添加 `!important` 来声明某个特定规则比其他规则更重要，从而覆盖整个系统。（除非在异常情况下，否则这也不建议这样做。）\n\
  \n总结，在没有规则的情况下，许多样式会从父元素传递给子元素。当有两条竞争规则时，规则越具体，其权重或重要性就越高——无论其位置如何。对于两条优先级相等的规则，在样式表中后出现的那一个胜出。\n\
  \n如果以上这些内容听起来很困惑，现在不用担心。一旦你开始尝试 CSS 和不同的选择器，我认为你会发现在大多数情况下，级联的运行方式完全如你所预期那样。\n\n\
  ### 属性值\n\n每个 CSS 属性都有关于其可以接受哪些值的不同规则。某些属性只接受预定义值列表中的一个。其他属性接受数字、整数、相对值、百分比、URL\
  \ 或颜色。某些属性可以接受超过一种类型的值。每个属性的可接受值列在描述该属性的章节中（主要在第 10 章和第 11 章），但你在这里学习基础体系。\n\n####\
  \ 继承\n\n当你想要显式指定某个属性的值与其父元素相同时，你可以对任何属性使用 `inherit` 值。\n\n#### 预定义值\n\n大多数 CSS 属性都有几个可以使用的预定义值。例如，`float`\
  \ 属性可以设置为 `left`、`right` 或 `none`。与 HTML 不同，你不需要将预定义值放在引号内![Image](img/red_circle-a.jpg)。\n\
  \n![Image](img/red_circle.jpg) 许多属性只接受预定义列表中的值。请精确地输入它们，不要把它们放在引号内。\n\n![Image](img/188fig01.jpg)\n\
  \n#### 长度和百分比\n\n许多属性接受长度作为其值。长度值包含一个数量和一个单位。唯一的例外是 `0`，它可以带单位也可以不带单位。\n\n![Image](img/red_circle-b.jpg)\
  \ 长度必须始终标明单位。单位与数值之间不应空格。\n\n![Image](img/188fig02.jpg) 还有一些是相对于其他值的长度类型。`em` 大致等于元素的字体大小，所以\
  \ `2em` 意味着“字体大小的两倍”（当使用 `em` 设置 `font-size` 时，其值源自父元素的字体大小）。`ex` 应该等于字体的高度，即字母\
  \ x 的高度，但它的支持程度不同，所以你可能不会使用它。\n\n像素 (`px`) 不相对于其他样式规则。例如，`px` 中的值不受 `font-size`\
  \ 设置的影响，就像 `ems` 那样。一种设备上的像素在另一种设备上的尺寸并不相同（参见 Peter-Paul Koch 在 [www.quirksmode.org/archives/2010/04/a_pixel_is_not.html](http://www.quirksmode.org/archives/2010/04/a_pixel_is_not.html)\
  \ 中的详细描述）。\n\n还有一些显而易懂的绝对单位，例如点 (`pt`)，这应该是留给打印样式表的单位。（还有其他的，但没有必要提到它们，因为它们在实践中并没有使用。）通常，只有在输出尺寸已知时使用绝对长度（如\
  \ pt）。百分比值——例如 `65%`——工作方式与 `ems` 类似，它们相对于其他值![Image](img/red_circle-c.jpg)。\n\n\
  ![Image](img/red_circle-c.jpg) 百分比相对于父元素。所以在这个示例中，字体将设置为父字体大小的 80%。\n\n![Image](img/189fig01.jpg)\
  \ 在所有这些中，你用得最多的是 em、像素和百分比。\n\n#### 数字\n\n极少数 CSS 属性接受无单位数字的形式，如 `3`。最常见的是 `line-height`\
  \ ![Image](img/red_circle-d.jpg) 和 `z-index`（分别参见第 10 章中的“设置行高”和第 11 章中的“在 3D 空间中定位元素”）。（其他的大多用于打印和听觉样式表，且尚未得到良好的支持。）\n\
  \n\n\n![Image](img/red_circle-d.jpg) 不要将数字、整数与长度混淆。数字或整数没有单位（如 `px`）。在这种情况下，此处显示的值是一个因子，它将与字体大小相乘以得到行高。\n\
  \n![Image](img/189fig02.jpg)\n\n## URLs\n\n某些 CSS 属性允许你指定另一个文件的 URL，特别是图像。在这种情况下，使用\
  \ `url(file.ext)`，其中 `file.ext` 是所需资源的路径和文件名 ![Image](img/red_circle-e.jpg)。请注意，规范规定相对\
  \ URL 应该是相对于*样式表*，而不是相对于 HTML 文档。\n\n![Image](img/red_circle-e.jpg) CSS 属性中的 URL\
  \ 无需包含在引号中。\n\n![Image](img/190fig01.jpg)\n\n虽然你可以在文件名周围使用引号，但并不是必须的。另一方面，`url`\
  \ 单词和左括号之间不应该有空格。括号和地址之间的空白是允许的，但不是必须的（也不是惯例）。\n\n关于如何编写 URL 本身的更多信息，请参阅第 1 章中的“URLs”。\n\
  \n## CSS colors\n\n你可以通过多种方式为 CSS 属性指定颜色。首先，也是简单的方法是，值可以是预定义的颜色关键字之一。CSS3 规定了一个包含\
  \ 16 个名称的基础列表 ![Image](img/red_circle-f.jpg)，并额外增加了 131 个，以对应 147 个 SVG 1.0 颜色关键字名称。完整列表可以在\
  \ [www.w3.org/TR/css3-color/#svg-color](http://www.w3.org/TR/css3-color/#svg-color)\
  \ 找到。\n\n![Image](img/red_circle-f.jpg) CSS 中定义颜的最常用方法是通过十六进制数指定其中包含的红、绿、蓝的量。\n\n\
  ![Image](img/7_03.jpg)\n\n当然，除了显而易见的那些外，没有人能记得那些颜色名称。此外，你通常从 Adobe Photoshop 等工具获取颜色，而它们并不使用\
  \ CSS 颜色名称。因此，在实践中，使用十六进制格式（目前最常见的）或 RGB 格式定义你的 CSS 颜色更为常见。正如你将学的，你还可以使用 HSL 格式指定颜色，并使用\
  \ RGBA 和 HSLA 指定颜色透明度，这些都是 CSS3 中的新特性。\n\n### RGB\n\n你可以通过指定红、绿、蓝的量来构建自己的颜色（因此名为\
  \ `RGB`）。你可以将这些贡献颜色的每个值给出 0–255 之间的数字、百分比或数字的十六进制表示。例如，如果你想创建一个深紫色，可以使用 89 红色、无绿和\
  \ 127 蓝。该颜色可以写为 `rgb(89, 0, 127)`，如 ![Image](img/red_circle-g.jpg)所示。\n\n![Image](img/red_circle-g.jpg)\
  \ CSS 中表示颜色的另一种方法是使用 0–255 的 RGB 数值。先定义红色，然后是绿色，最后是蓝色。\n\n![Image](img/191fig01.jpg)\n\
  \n或者，你可以将每个值表示为百分比，尽管这样做要少得多，可能是因为像 Photoshop 这样的图像编辑器倾向于为你提供数值 RGB 值。但如果你确实想使用百分比，你可以将相同的颜色写为\
  \ `rgb(35%, 0%, 50%)`，因为 89 是 255 的 35%，127 是 255 的 50%。\n\n### Hexadecimal\n\n\
  我把最常用的方法放在最后 ![Image](img/red_circle-h.jpg)。将这些数值转换为十六进制，将它们连接在一起，并在值前加上 # 号，例如\
  \ `#59007F`。（59 是 89 的十六进制等值，00 是 0 的十六进制等值，7F 是 127 的十六进制等值）。你也可以将 `7F` 写为 `7f`（我的偏好，但有很多开发者和设计师选择相反）。\n\
  \n![Image](img/red_circle-h.jpg) CSS 中定义颜色的最常用方法是通过十六进制数指定其中包含的红、绿、蓝的量。\n\n![Image](img/191fig02.jpg)\n\
  \n当十六进制颜色由三对重复的数字组成时（如 `#ff3344`），你可以将颜色缩写为 `#f34`。事实上，这样做是最佳实践，因为没有理由让你的代码比实际需要的更长。\n\
  \n如果你对十六进制感到困惑，不要担心。就像 Photoshop 等类工具包含了选择颜色和显示其 RGB 值的工具一样，它们也提供了十六进制工具。\n\n###\
  \ CSS3 中的更多颜色选项：RGBA, HSLA, 和 HSL\n\nCSS3 引入了另一种指定颜色的方法——HSL，以及通过 RGBA 和 HSLA 设置\
  \ alpha 透明度的能力。（你无法用十六进制表示法 alpha 透明度）。\n\n#### RGBA\n\nRGBA 与 RGB 相同，但 `A` 代表 `alpha\
  \ transparency`（alpha 透明度）。你可以使用 RGBA 和 HSLA 指定透明度量。（你无法用十六进制表示法 alpha 透明度）。\n\n\
  \n\n\nHSL 代表 `hue`（色相）、`saturation`（饱和度）和 `lightness`（亮度），其中色相是一个 0–360 之间的数字，饱和度和亮度都是\
  \ 0 到 100 的百分比 ![Image](img/red_circle-k.jpg)。在 CSS 中，语法如下：\n\n```css\nproperty:\
  \ hsl(hue, saturation, lightness);\n```\n\n![Image](img/red_circle-k.jpg) HSL 格式的解析。\n\
  \n![Image](img/193fig01.jpg)\n\n而且，正如你猜的样，HSLA 格式如下：\n\n```css\nproperty: hsla(hue,\
  \ saturation, lightness, alpha transparency);\n```\n\n例如，这是 RGBA 和 RGB 示例中相同的紫色\
  \ ![Image](img/gray_circle-i.jpg)，改用 HSLA 和 HSL 表达：\n\n```css\n/* 25% 透明度 */\nh1\
  \ {\n    background: hsla(282,100%, 25%,0.75);\n}\n\n/* 60% 透明度 */\nh2 {\n    background:\
  \ hsla(282,100%, 25%,0.4);\n}\n\n/* 实色背景（不透明） */\nh3 {\n    background: hsl(282,100%,25%);\n\
  }\n```\n\n现代浏览器中的渲染结果与之前相同 ![Image](img/gray_circle-j.jpg)。\n\n将色相值想象成圆周上的角度，0 和\
  \ 360 在顶部汇合。这意味着 0 和 360 是同一种颜色——红色。（不要将 HSL 与 HSB 或 HSV 混淆。它们相似但不完全相同。）\n\n***\n\
  \n# 如何用 HSL 思考\n\n学习 HSL 的逻辑需要一些时间，但一旦你掌握了感觉，可能会发现它比其他格式更容易处理。在他的 *HSL 色选择器* 网站\
  \ ([`hslpicker.com`](http://hslpicker.com)) 的“为什么？”部分，Brandon Mathis 对 HSL 提供了一个非常好的解释。他写道：\n\
  \n“从 0 到 360 之间选择一个色相，当饱和度设为 100 亮度设为 50 时，你就拥有了该颜色最纯的形式。降低饱和度会让你向灰色移动。增加亮度会让你向白色移动，降低亮度则让你向黑色移动。”\n\
  \n例如，以下是你在圆周上移动时的一些核心颜色：\n\n• 红色是 `hsl(0,100%,50%)`\n• 黄色是 `hsl(60,100%,50%)`\n\
  • 绿色是 `hsl(120,100%,50%)`\n• 青色是 `hsl(180,100%,50%)`\n• 蓝色是 `hsl(240,100%,50%)`\n\
  • 品红色是 `hsl(300,100%,50%)`\n\n***\n\n并不是所有的图像编辑器都内置支持 HSL（你可以为 Photoshop 安装插件）。然而，Mathis\
  \ 的 *HSL 色选择器* 是一个很棒的免费在线工具，允许选择颜色并获取其 HSL、hex 和 RGB 值，或者你也可以输入任何格式的值来查看颜色的变化。另一个此类工具位于\
  \ [www.workwithcolor.com/hsl-color-picker-01.htm](http://www.workwithcolor.com/hsl-color-picker-01.htm)。它在圆上显示颜色，这可能帮助你对\
  \ HSL 有更好的感觉。（相比之下，*HSL 色选择器* 将它们显示在一条线上。）你可以通过在线搜索找到其他颜色工具。\n\n## Internet Explorer\
  \ 中的 RGBA, HSL 和 HSLA\n\n遗憾的是，正如标准领域最新进展常见的情况，IE9 之前的任何 Internet Explorer 版本不支持这些功能。相反，它们会忽略任何它们不理解的声明。\n\
  \n对于 IE9 之前的版本，RGBA 和 HSLA 有一种通通方法。但在 HSL 方面，你可能需要使用十六进制（或 RGB）来指定你的颜色。\n\n对于 IE9\
  \ 之前的版本的 RGBA 和 HSLA，你有三个选择（但一次只能用一个）：\n\n• 什么都不做，让你的页面在这些版本中看起来相当不同。\n• 为它们提供回退颜色声明，这意味着它们将显示实色而不是透明色\
  \ ![Image](img/red_circle-l.jpg)。\n\n![Image](img/red_circle-l.jpg) 现代浏览器会渲染 RGBA\
  \ 声明，因为它们位于默认十六进制背景设置之后（它们也能理解该设置，所以顺序很重要）。同时，IE9 之前的版本会忽略 RGBA 设置，因为它们不理解它，所以十六进制背景得以保留。你可以在第一行用\
  \ RGB（但不是 RGBA）代替十六进制，但正如所提到的，十六进制是表示非透明颜色的最常用方法。\n\n***\n\n```css\n/* 背景声明的顺序很重要。旧版本的\
  \ IE 使用第一行，而现代浏览器理解两行，但应用第二行，因为它是最后定义的。 */\nh1 {\n    background: #59007f;\n   \
  \ background: rgba(89,0,127,0.75);\n}\n```\n\n***\n\n• 通过包含专门针对它们的声明来模拟透明透明，其中大部分是\
  \ IE 专有的 CSS；现代浏览器仍然会使用标准 CSS，尽管如此 ![Image](img/red_circle-m.jpg)。\n\n![Image](img/red_circle-m.jpg)\
  \ 在眼睛燃烧之前移开目光！这种冗长的代码混合将 IE9 之前的声明（高亮部分）夹在标准 RGBA 记法（非高亮部分）周围。如常一样，旧版本的 IE 会忽略它们不理解的内容。同样，现代浏览器会忽略\
  \ `-ms-filter`、`filter` 和 `zoom` 值，因为它们不理解这些。声明的顺序对于这种技术的生效至关重要。\n\n***\n\n```css\n\
  /* 如果你和我一样，你已经开始哭了。除了第二行之外，每个声明都是为了让旧版本的 IE 模拟透明度。 */\nh1 {\n    background: transparent;\n\
  \    background: rgba(89,0,127,0.75);\n    /* IE8 */\n    -ms-filter: \"progid:DXImageTransform.Microsoft.gradient(startColorstr=#BF59007F,endColorstr=#BF59007F)\"\
  ;\n    /* IE6 & 7 */\n    filter: \"progid:DXImageTransform.Microsoft.gradient(startColorstr=#BF59007F,endColorstr=#BF59007F)\"\
  ;\n    zoom: 1;\n}\n```\n\n***\n\n最后这种选项将 Internet Explorer 的过滤器结合其他浏览器都不理解的代码。这意味着现代浏览器将忽略它并使用标准，在这种情况下是\
  \ `rgba(89,0,127,0.75)`。请注意，声明必须按照所示顺序排列，以便使透明效果跨浏览器生效 ![Image](img/gray_circle-m.jpg)。\n\
  \n\n\n\n\n# 创建嵌入样式表\n# 应用内联样式\n#位置的重要性\n# 使用媒体特定样式表\n# 提供备用样式表\n# 人的灵感：CSS\n\n在开始定义你的样式表之前，了解如何创建和使用包含这些样式的文件非常重要。在本章中，你将学习如何创建一个样式表文件，然后学习如何将\
  \ CSS 应用于多个 Web 页面（包括整个网站）、单个页面或单个 HTML 元素。你可以通过三种方法实现这些目标：外部样式表（首选方案）、嵌入样式表和内联样式（最不理想的）。\n\
  \n你将在接下来的章节中学习如何创建样式表的内容。\n\n### 创建外部样式表\n\n外部样式表是为你的 Web 网站的大部分或所有页面提供一致外观的理想选择。你可以在外部样式表中定义所有样式，然后告诉网站上的每个页面加载该外部样式表，从而确保每个页面都具有相同的设置。虽然你之后会学习到嵌入和内联样式，但从外部样式表为页面添加\
  \ CSS 是一种最佳实践，因此我强烈建议你使用这种方法（极少数例外除外）。\n\n### 创建外部样式表\n\n1. 在你任选的文本编辑器中创建一个新的文本文档\
  \ ![Image](img/red_circle-a.jpg)。\n\n![Image](img/red_circle-a.jpg) 使用你喜欢的任何文本编辑器来创建样式表。这是记事本（旧版本）。大多数人使用同一个编辑器创建\
  \ HTML 和 CSS 文档。`/* */` 之间的文本是 CSS 注释，既不会影响页面的显示，也不会出现在你的页面中。\n\n![Image](img/08_01.jpg)\n\
  \n2. 按照第 7 章 开始的描述为你的 Web 页面定义样式规则。根据你的需要包含 CSS 注释 ![Image](img/gray_circle-a.jpg)。\n\
  \n3. 将文档以文本格式保存在所需的目录中。任何名称都可以，但为文件指定 `.css` 扩展名以将其指定级联样式表 ![Image](img/red_circle-b.jpg)。\n\
  \n![Image](img/red_circle-b.jpg) 务必以 `.css` 扩展名和纯文本格式（如文本文档、纯文本、ASCII 或你的文本编辑器所称的任何格式）保存\
  \ CSS 文件。\n\n![Image](img/08_02.jpg)\n\n> 提示\n你可以随意为样式表命名。`base.css` 和 `global.css`\
  \ 是两个流行的名称，用于包含适用于网站所有或大部分页面显示规则的样式表。网站作者通常会创建额外的、特定区域的 CSS 文件来补充基础样式。例如，如果你正在构建一个电子商务网站，`products.css`\
  \ 可以包含与产品相关的页面的规则。无论你选择什么文件名，请确保它们不包含任何空格。\n\n> 提示\n外部样式表可以是链接的（如“链接到外部样式表”所示），也可以导入导入（通过\
  \ `@import`），但我不建议你导入它们。`@import` 指令会对页面下载和渲染速度产生不利影响，特别是在 Internet Explorer 中，正如\
  \ Steve Souders 在 [www.stevesouders.com/blog/2009/04/09/dont-use-import/](http://www.stevesouders.com/blog/2009/04/09/dont-use-import/)\
  \ 中讨论的那样。\n\n> 提示\n样式表开头的 `@charset` 声明并不总是需要的，但始终包含它并无害 ![Image](img/gray_circle-a.jpg)。然而，如果你的样式表包含非\
  \ ASCII 字符，则是*必须*的，如果你使用 CSS 生成的内容（一个相当高级的话题）或名称中带有特殊字符的 Web 字体，就会出现这种情况。出于这个原因，你可以选择始终包含\
  \ `@charset`，这样当样式表需要时，你就不必担心以后再添加它。只需确保它位于样式表的第一行即可。然而，*永远*不要嵌入或内联样式中包含 `@charset`（本章稍后介绍）。\n\
  \n## 链接到外部样式表\n\n现在你已经创建了样式表 ![Image](img/red_circle-a.jpg)，你需要将其加载到 HTML 页面中，以便将样式规则应用到内容上。最好的方法是链接到该样式表\
  \ ![Image](img/red_circle-b.jpg)。\n\n![Image](img/red_circle-a.jpg) 这是在本章较早创建的 `base.css`\
  \ 外部样式表（去除了“一个简单的样式表”注释，该注释对 HTML 的显示没有影响）。先不要担心属性和值（它们只是表示“为所有 img 元素创建一个实色的红色边框”）。\n\
  \n```css\n@charset \"UTF-8\";\n\nimg {\n    border: 4px solid red;\n}\n```\n\n![Image](img/red_circle-b.jpg)\
  \ `link` 元素位于 HTML 的 head 部分。你的页面可能包含多个 `link` 元素。\n\n```html\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>El Palau de\
  \ Música</title>\n    <link rel=\"stylesheet\" href=\"base.css\">\n</head>\n<body>\n\
  \    <article>\n        <h1>El Palau de Música</h1>\n        <img src=\"img/palau250.jpg\"\
  \ width=\"250\" height=\"163\" alt=\"El Palau de Música\">\n        <img src=\"\
  img/tickets.jpg\" width=\"87\" height=\"163\" alt=\"门票\">\n        <p>我热爱音乐大厅。它是华丽且浮夸的，包含了现代主义的一切美好。它还是加泰罗尼亚合唱团的所在地，我在那里学习了莫斯卡特的好处。</p>\n\
  \    </article>\n</body>\n</html>\n```\n\n### 链接外部样式表\n\n1. 在每个希望使用该样式表的 HTML 页面的\
  \ head 部分输入 `<link rel=\"stylesheet\"`。\n2. 输入一个空格，然后 `href=\"url.css\"`，其中 `url.css`\
  \ 是你的 CSS 样式表文件名（见上一节）。\n3. 输入一个空格，输入最后的 `/>`。\n\n> 提示\n当你对外部样式表进行更改时，引用它的所有页面也会自动更新\
  \ (![Image](img/red_circle-c.jpg) 和 ![Image](img/red_circle-d.jpg)。这就是外部样式表的强大之处！\n\
  \n\n\n\n\n为了简单起见，此处显示的链接示例假设 HTML 页面与 `base.css` 位于同一目录下![Image](img/gray_circle-b.jpg)。然而，在实践中，最好是将样式表组织在子文件夹中，而不是将它们与\
  \ HTML 页面混合在一起。常用的样式表文件夹名称包括 `css` 和 `styles`，但只要你在链接的 `href` 值中正确引用了它，你可以随意命名。例如，如果\
  \ `base.css` 在一个名为 `css` 的文件夹中，而你的 HTML 位于它的上级目录中，则链接元素将写为 `<link rel=\"stylesheet\"\
  \ href=\"css/base.css\" />`。\n\n* * *\n\n* * *\n\n提示\n\n外部样式表中的 URL 相对于样式表文件在服务器上的位置，而不是相对于\
  \ HTML 页面的位置。当你学习第 10 章中的 CSS 背景图像（“设置文本背景 ”）时，你将看到到这一用法。\n\n* * *\n\n* * *\n\n\
  提示\n\n外部样式表的规则可能会被 HTML 文档中的样式覆盖。以不同方式应用样式的相对影响在在本章后半部分的“位置重要性””中进行了总结。\n\n* * *\n\
  \n* * *\n\n提示\n\n你可以同时链接到多个样式表。如果在多个文件中出现冲突的显示规则，则后文件中的规则将优先于先文件中的。\n\n* * *\n\n\
  * * *\n\n提示\n\n你可以提供链接样式表的备用版本，并让访问者在其中进行选择。请参见本章后半部分的“提供备用样式表”。\n\n* * *\n\n* *\
  \ *\n\n提示\n\n你可以通过设置 `media` 属性将样式表限制为特定的输出类型。更多细节，请参阅本章后半部分的“使用特定媒体的样式表”。\n\n*\
  \ * *\n\n* * *\n\n提示\n\n旧版本的 HTML 要求你在链接元素定义中包含 `type=\"text/css\"`，但 HTML5 并不需要它，因此你可以像在本章的代码示例中那样省略它。\n\
  \n* * *\n\n### 创建嵌入式样式表\n\n嵌入式样式表是将 CSS 应用到页面的第二方法。它让你直接在想要影响的 HTML 文档中设置样式（通常放在\
  \ `head` 中）![Image](img/red_circle-a.jpg)。由于样式仅存在于该 HTML 文件中，CSS 不会像链接外部样式表那样应用于其他页面，你也无法获得相同的缓存优势。如前所述，对于大多数情况，外部样式表是推荐的方法，但在你需要偏离推荐做法时，了解你的其他方案是非常重要的。\n\
  \n![Image](img/red_circle-a.jpg) 嵌入样式表时，`style` 元素及其包含的样式规则通常位于文档的 `head` 部分。浏览器渲染页面的方式与从外部样式表加载样式完全相同![Image](img/gray_circle-b.jpg)。注意，嵌入式样式表绝不应在开头（或任何其他地方）带有\
  \ `@charset` 声明。\n\n* * *\n\n...\n\n```html\n<head>\n      <meta charset=\"UTF-8\"\
  \ />\n      <title>El Palau de la Música</title>\n      <style>\n      img {\n \
  \       border: 4px solid red;\n      }\n      </style>\n</head>\n<body>\n...\n\
  \      <img src=\"img/palau250.jpg\" width=\"250\" height=\"163\" alt=\"El Palau\
  \ de la Música\" />\n      <img src=\"img/tickets.jpg\" width=\"87\" height=\"163\"\
  \ alt=\"The Ticket Window\" />\n...\n\n</body>\n</html>\n```\n\n* * *\n\n![Image](img/red_circle-b.jpg)\
  \ 结果与你链接到外部样式表中的样式是完全相同的。区别在于，没有其他 Web 页面可以利用此页面上使用的样式。\n\n![Image](img/08_05.jpg)\n\
  \n#### 创建嵌入式样式表\n\n**1.** 在 HTML 文档的 `head` 部分输入 `<style>`。\n\n**2.** 定义尽可能多的样式规则（请参见第\
  \ 7 章中的“构造样式规则””）。\n\n**3.** 输入 `</style>` 完成嵌入式样式表![Image](img/gray_circle-a.jpg)。\n\
  \n* * *\n\n提示\n\n如果且仅当 `style` 元素位于 `link` 元素之后，应用在嵌入样式表中的冲突样式将覆盖外部样式表中的样式。更多细节，请参阅本章后半部分的“位置重要性”。\n\
  \n* * *\n\n* * *\n\n提示\n\n嵌入式样式表是页面添加 CSS 的次优方法。……更多细节，请参阅本章后半部分的“创建嵌入式样式表”。\n\n\
  * * *\n\n* * *\n\n提示\n\n……更多细节，请参阅本章后半部分的“提供备用样式表”。\n\n* * *\n\n* * *\n\n提示\n\n\
  ……更多细节，请参阅本章后半部分的“使用特定媒体的样式表”。\n\n* * *\n\n* * *\n\n### 应用内联样式\n\n内联样式是将 CSS 应用到页面的第三方法。然而，它们是最不可理想的，因为它们将\
  \ HTML 和 CSS 混织在了一起![Image](img/red_circle-a.jpg)。它们仅影响单个元素![Image](img/gray_circle-b.jpg)。……内联样式影响单个元素。\n\
  \n```html\n<head>\n      <meta charset=\"UTF-8\" />\n      <title>El Palau de la\
  \ Música</title>\n      <style>\n      img {\n        border: 4px solid red;\n \
  \     }\n      </style>\n</head>\n<body>\n...\n      <img src=\"img/palau250.jpg\"\
  \ width=\"250\" height=\"163\" alt=\"El Palau de la Música\" style=\"border: 4px\
  \ solid red;\" />\n      <img src=\"img/tickets.jpg\" width=\"87\" height=\"163\"\
  \ alt=\"The Ticket Window\" />\n...\n\n</body>\n</html>\n```\n\n* * *\n\n![Image](img/red_circle-b.jpg)\
  \ 只有第一张图片有边框。为了重复本章所示的效果，你必须单独为每个 `img` 元素添加 `style=\"border: 4px solid red\"`。如你所示，内联样式并不高效。\n\
  \n![Image](img/08_06.jpg)\n\n然而，如果你想快速尝试某些东西然后在将其从 HTML 中删除，那么内联样式可能是很有用的。\n\n####\
  \ 应用内联样式\n\n**1.** 在想要格式化的 HTML 元素内部输入 `style=`。（添加到非空元素的起始标签中。）\n\n**2.** 创建不带大括号或选择器的样式规则。\n\
  \n**3.** 要创建额外的样式定义，输入 `;`（分号）并重复步骤 2。\n\n**4.** 输入最后的引号 `\"`。\n\n* * *\n\n提示\n\n\
  注意不要将等号与冒号混淆。\n\n* * *\n\n* * *\n\n提示\n\n不要忘记在多个属性定义之间使用分号分隔。\n\n* * *\n\n* * *\n\
  \n提示\n\n不要忘记将你的样式定义包含在直引号中。\n\n\n\n\n内联样式的优先级高于所有其他样式，除非在其他地方的冲突样式被标记为 `!important`（参见本章中的“[[位置的重要性]”）。\n\
  \n* * *\n\n* *\n\n提示\n如果你在内联样式声明中指定了字体族（font family），你必须用单引号将多词字体名称括起来，以避免与样式元素的双引号产生冲突。你不能在两个地方都使用相同类型的引号。\n\
  \n* * *\n\n* *\n\n提示\n内联样式最常见的用途是作为 JavaScript 函数的一部分将其应用于元素，以使页面部分内容具有动态性。当你使用例如\
  \ Firebug 或 Chrome 开发者工具查看页面源代码时，可能会注意到这些生成的内联样式。在大多数情况下，应用这些样式的 JavaScript 与 HTML\
  \ 是分离的，因此它仍然保持了内容（HTML）、表现（CSS）和行为（JavaScript）之间的良好分离。\n\n* * *\n\n### 位置的重要性\n\n\
  同一个元素上可能应用了多个样式规则，这并不罕见，特别是在需要投入精力管理 CSS 的大型网站上。正如第 7 章中的“[[级联：当规则冲突时]”的提到的，样式的位置可以在继承和特异性的竞争中胜出。基本规则是，在其他条件相等的情况下，样式出现得越晚，它的优先级或重要性越高（![Image](img/red_circle-a.jpg)\
  \ 到 ![Image](img/red_circle-d.jpg)）。\n\n![Image](img/red_circle-a.jpg) 在此示例中，`<style>`元素最后出现。因此，它的规则将高于\
  \ `base.css` 样式表中的规则（只要冲突规则具有相同的继承和特异性因子）。\n\n* * *\n\n...\n\n```html\n<head>\n\
  \    <title>El Palau de la Música</title>\n    <link rel=\"stylesheet\" href=\"\
  base.css\" />\n    <style>\n      img {\n        border-style: dashed;\n      }\n\
  \    </style>\n</head>\n```\n\n...\n\n* * *\n\n![Image](img/red_circle-b.jpg) `<style>`元素的虚线边框胜过了链接的\
  \ `base.css` 中的实线边框。\n\n![Image](img/08_07.jpg)\n\n因此，内联样式具有最高优先级并将任何应用在其他地方的冲突样式。\n\
  \n在嵌入式样式元素中，任何存在的 `@import` 规则都会输给该样式元素中的任何单个样式规则（根据定义，这些规则必须在 `@import` 规则之后）。\n\
  \n嵌入式样式元素与任何链接外部样式表之间的关系取决于它们的相对位置。如果`<link>`元素在 HTML 代码中出现得晚，它将覆盖`<style>`元素。如果它出现得早，`<style>`元素（以及它包含的任何导入样式表）将覆盖链接样式表中的规则。\n\
  \n![Image](img/red_circle-c.jpg) 这里，链接的样式表最后出现，优先级高于`<style>`元素中的规则（在其他条件相等的情况下）。\n\
  \n* * *\n\n...\n\n```html\n<head>\n    <title>El Palau de la Música</title>\n  \
  \  <style>\n      img {\n        border-style: dashed;\n      }\n    </style>\n\
  \    <link rel=\"stylesheet\" href=\"base.css\" />\n</head>\n```\n\n* * *\n\n![Image](img/red_circle-d.jpg)\
  \ `base.css` 样式表中的实线边框胜过了内部样式元素的虚线边框。\n\n![Image](img/08_08.jpg)\n\n外部样式表也可以包含 `@import`\
  \ 规则（尽管如前面提到的，出于性能考虑，我不建议使用它们）。在这种情况下，导入的规则会被外部样式表中包含的其他规则覆盖（根据定义，它们必须在 `@import`\
  \ 规则之后）。它们与文档其他样式表的关系像往常一样是由指向外部样式表的`<link>`的位置决定的。\n\n冲突样式顺序影响胜出结果有一个例外。标记为 `!important`\
  \ 的样式总是胜出，无论它是在顺序的开头、结尾还是中间。这里有一个例子：`p { margin-top: 1em !important; }`。但请避免使用它。它会让你的声明过于强势，如果你需要覆盖它，你的\
  \ CSS 将由于更长的规则而变得混乱。\n\n唯一能胜过 `!important` 声明的是*用户*样式表。是的，你我作为网站访问者可以为浏览器创建自己的样式表，并且它具有优先级。例如，我们可能始终倾向于查看某些字体大小或文本与背景颜色之间的对比度。然而，大多数用户并不知道可以这样做。\n\
  \n### 使用媒体特定样式表\n\n你可以通过向`<link>`或`<style>`元素添加 `media` 属性来指定针对特定输出的样式表。这种方法允许你指定用逗号分隔的媒体类型（例如\
  \ `print`、`screen`、`all`）。\n\n**1.** 为`<link>`元素添加 `media=\"all\"`。此示例显示了影响所有类型（包括打印）的样式在顶部，打印特定的样式在底部。后后出现的规则胜出。\n\
  \n```html\n<head>\n    <meta charset=\"UTF-8\" />\n    <title>El Palau de la Música</title>\n\
  \    <link rel=\"stylesheet\" href=\"base.css\" media=\"screen\" />\n    <link rel=\"\
  stylesheet\" href=\"print.css\" media=\"print\" />\n</head>\n```\n\n**2.** 或者，在你的样式表中使用\
  \ `@media` 规则。这种方法不需要在`<link>`元素中指定媒体类型。此示例显示了影响所有类型（包括打印）的样式在顶部，打印特定的样式在底部。\n\n\
  ```css\n@charset \"UTF-8\";\n\n/* 所有媒体的样式 */\nimg {\n  border: 4px solid red;\n\
  }\n\np {\n  color: green;\n  font-style: italic;\n}\n\n/* 打印样式表 */\n@media print\
  \ {\n  img {\n    display: none;\n  }\n  p {\n    color: black;\n  }\n}\n```\n\n\
  \n\n请访问 Christian Krammer 的文章 [www.smashingmagazine.com/2011/11/24/how-to-set-up-a-print-style-sheet/](http://www.smashingmagazine.com/2011/11/24/how-to-set-up-a-print-style-sheet/)\
  \ 以了解更多关于创建打印样式表的信息。\n\n### 提供替代样式表\n\n你可以链接多个样式表 ![Image](img/red_circle-a.jpg)，让访问者选择他们喜欢的样式。规范允许一组基础\
  \ `persistent`（持久）样式 ![Image](img/red_circle-b.jpg)，无论访问偏好如何都会应用；一组默认或 `preferred`（首选）附加样式\
  \ ![Image](img/red_circle-c.jpg)，当访问者未做选择时应用；以及一个或多个 `alternate`（备用）样式表 ![Image](img/red_circle-d.jpg)，访问者可以选择它们\
  \ ![Image](img/red_circle-e.jpg)，此时首选集（但不是持久集）将被禁用并忽略。备用样式表允许你为网站提供不同的主题。\n\n![Image](img/red_circle-a.jpg)\
  \ 我依次定义了基础或持久样式表、首选或自动样式表以及备用样式表。每个样式表都需要自己的 `link` 元素。\n\n***\n\n```html\n<head>\n\
  \    <meta charset=\"UTF-8\" />\n    <title>Palau de la Música</title>\n    <link\
  \ rel=\"stylesheet\" href=\"base.css\" />\n    <link rel=\"stylesheet\" href=\"\
  preferred.css\" title=\"Dashed\" />\n    <link rel=\"alternate stylesheet\" href=\"\
  alternate.css\" title=\"Dotted\" />\n</head>\n```\n\n***\n\n![Image](img/red_circle-b.jpg)\
  \ 例如，此 CSS 文件 (`base.css`) 将作为持久样式表，无论访问者如何操作都会应用。\n\n***\n\n```css\nimg {\n   \
  \ border: 4px solid red;\n}\n```\n\n***\n\n![Image](img/red_circle-c.jpg) 此样式表 (`preferred.css`)\
  \ 将是在访问者跳转到页面时，除 `base.css` 之外默认加载的样式。\n\n***\n\n```css\nimg {\n    border-style:\
  \ dashed;\n}\n```\n\n***\n\n![Image](img/red_circle-d.jpg) 如果访问者愿意，他们将加载这个备用样式表。它的文件名是\
  \ `alternate.css`，但与其他文件一样，你可以随心地命名。\n\n***\n\n```css\nimg {\n    border-style:\
  \ dotted;\n}\n```\n\n***\n\n![Image](img/red_circle-e.jpg) 当页面加载时，它将具有虚线边框（首选值覆盖了基础值）。\n\
  \n\n\n\n\n一旦你定义了选择器，就可以在第 10 章–第 14 章中创建声明（带有实际属性和值）。本书的其余部分将讨论一些更专门的样式属性。在此之前，你将在示例中使用非常简单且相对直观的\
  \ `{color: red;}`。\n\n### 构建选择器\n\n选择器决定了样式规则应用于哪些元素。例如，如果你想用 Times 字体、12 像素行高来格式化所有的\
  \ `p` 元素，你只需要创建一个只识别 `p` 元素的选择器，同时忽略代码中的其他元素。如果你想为每个章节中的第一个 `p` 元素设置特殊的缩进，你将需要创建一个稍微复杂一点的选择器，只识别那些作为页面该部分中第一个元素的\
  \ `p` 元素。\n\n一个选择器可以定义最多五种不同的标准，用于选择需要格式化的元素：\n\n- 元素的类型或名称 ![Image](img/red_circle-a.jpg)。\n\
  \  ![Image](img/red_circle-a.jpg) 最简单的选择器就是需要格式化的元素类型的名称——在这种情况下，就是 `h1` 元素。\n \
  \ ![Image](img/9_01.jpg)\n\n- 元素所在的上下文 ![Image](img/red_circle-b.jpg)。\n  ![Image](img/red_circle-b.jpg)\
  \ 此选择器使用了上下文。样式只会应用于 `h1` 元素内部的 `em` 元素。在其他地方的 `em` 元素不受影响。\n  ![Image](img/9_02.jpg)\n\
  \n- 元素的 class 或 id (![Image](img/red_circle-c.jpg) 和 ![Image](img/red_circle-d.jpg))。\n\
  \  ![Image](img/red_circle-c.jpg) 第一个选择器选择属于该类的所有元素。句话说，任何 HTML 开始标签中带有 `class=\"\
  very\"` 的元素。第二个选择器根据其 HTML 开始标签中指定的 `id=\"gaudi\"`，选择 id 为 `gaudi` 的那个元素。你可能记得，id\
  \ 在每个页面中可以出现一次，而 class 可以出现任意次数。\n  ![Image](img/9_03.jpg)\n  ![Image](img/red_circle-d.jpg)\
  \ 你可以通过在类或 id 选择器前加上要目标元素名称来使其更具体。在这种情况下，第一个选择器只选择带有 `very` 类的 `em` 元素，而不是带有 `very`\
  \ 的类的元素。同样，第二个选择器选择 id 为 `gaudi` 的那个 `article` 元素。通常情况下，除非必要，否则不要使用这种方法；上一个示例中不具体的选择器\
  \ ![Image](img/gray_circle-c.jpg) 更为优。\n  ![Image](img/9_04.jpg)\n\n- 元素的伪类或伪元素\
  \ ![Image](img/red_circle-e.jpg)（我保证会解释这两者）。\n  ![Image](img/red_circle-e.jpg) 在此示例中，选择器选择属于链接伪类的元素（即尚未被访问过的\
  \ `a` 元素）。\n  ![Image](img/9_05.jpg)\n\n- 元素是否具有特定的属性和值 ![Image](img/red_circle-f.jpg)。\n\
  \  ![Image](img/red_circle-f.jpg) 你可以使用方括号向选择器添加有关所需元素属性、值或两者的信息。\n  ![Image](img/9_06.jpg)\n\
  \n选择器可以包含这些标准的任何组合，以精确确定所需的元素。大多数情况下，你一次使用一个或两个。此外，如果你需要对不同的元素组应用相同的样式规则，可以同时对多个选择器应用相同的声明（参见本章稍后部分的“指定元素分组””）。\n\
  \n本章的其余部分将详细解释如何定义定义选择器。\n\n### 通过名称选择元素\n\n选择要格式化的元素时，最常见的标准可能许是元素的名称或类型。例如，你可能想让所有的\
  \ `h1` 元素都变大并加粗，并用无衬线字体格式化所有的 `p` 元素。\n\n![Image](img/red_circle-a.jpg) 这段 HTML\
  \ 代码包含两个 `h2` 元素。（如果你在想的话，`lang` 属性表示内容与页面的默认语言不同，默认语言是在每个页面开头 `DOCTYPE` 之后的 `html`\
  \ 元素上指定的。在这种情况下，每个 `h2` 上的 `lang=\"es\"` 表示它们的内容是西班牙语。）\n\n***\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n...\n</head>\n<body>\n...\n<article class=\"\
  about\">\n    <h1>Antoni Gaudí</h1>\n    <p>Many tourists are drawn to Barcelona\
  \ to see Antoni Gaudí's incredible architecture.</p>\n    <p>Barcelona <a href=\"\
  http://www.gaudi2002.bcn.es/english/\" rel=\"external\">在 2002 年庆祝了 Gaudí 出生 150\
  \ 周年</a>。</p>\n    <section class=\"project\">\n        <h2 lang=\"es\">Antoni Gaudí\n\
  \        <p lang=\"es\">Gaudí's work was essentially\n        <p lang=\"es\">La\
  \ Casa Milà is an apartment building and\n    </section>\n    <section class=\"\
  project\">\n        <h2 lang=\"es\">Sagrada Família\n        <p lang=\"es\">The\
  \ Sacred Family is unfinished.</p>\n    </section>\n</article>\n```\n*(等待，源代码中提供的\
  \ HTML 是损坏或合并的，我将根据提供的文本清理视觉表示)*：\n\n```html\n<p>这个段落没有 `class=\"about\"`，所以当应用\
  \ CSS 时它不是红色的。</p>\n\n<article class=\"about\">\n    <h1>Lluís Domènech i Montaner</h1>\n\
  \    <p>Lluís Domènech i Montaner was a contemporary of Gaudí.</p>\n</article>\n\
  ```\n\n#### 通过类型选择元素\n\n类型选择器，即所需元素的名称 ![Image](img/red_circle-b.jpg)。\n![Image](img/red_circle-b.jpg)\
  \ 这将选择所有的 `h2` 元素。\n\n```css\nh2 {\n    color: red;\n}\n```\n\n在本章的其余部分如果没有指定名称，所有的\
  \ `h2` 元素将变为红色。\n\n### 通过类或 ID 选择元素\n\n如果你为元素标记了类 ![Image](img/red_circle-a.jpg)\
  \ 或 id（参见第 3 章），你可以在选择器中使用该标准，以便仅对这些元素应用格式化 ![Image](img/red_circle-b.jpg)。\n![Image](img/red_circle-b.jpg)\
  \ 有两个带有类的 article 元素。它们之间有一个没有该类的简短段落。\n\n#### 通配符\n\n`*`（星号），匹配任何元素名称。\n\n```css\n\
  * {\n    border: 2px solid green;\n}\n```\n\n你可以使用逗号来选择一组元素名称。更多细节，请参阅本章稍后部分的“指定元素分组””。\n\
  \n\n\n\n\n![Image](img/red_circle-b.jpg) 此选择器将选择类名等于 `about` 的元素。在这种情况下，它们都是 `article`\
  \ 元素，但你可以将这些类应用到任何元素上。如果你想在 `article` 元素具有此类时应用 `only` 样式，你将把选择器写为 `article.about`。但这通常比你实际需要的要具体得多。\n\
  \n* * *\n\n```css\n.about {\n    color: red;\n}\n```\n\n* * *\n\n### 根据类名选择要格式化的元素\n\
  \n**1.** 输入 `.`（点号）。\n\n**2.** 在中间没有空格的情况下，立即输入 `classname`，其中 `classname` 是你想要应用样式的类名。\n\
  \n![Image](img/red_circle-c.jpg) 带有 `about` 类的 `article` 显示为红色，但页面末尾的 `p` 元素不是。（如果你好奇的话，链接之所以是蓝色的是因为浏览器的默认样式，但你可以编写自己的规则来覆盖它。）\n\
  \n![Image](img/9_08.jpg)\n\n### 根据 id 选择要格式化的元素\n\n**1.** 输入 `#`（井号或磅号）。\n\n**2.**\
  \ 在中间没有空格的情况下，立即输入 `id`，其中 `id` 唯一标识你想要应用样式的元素。\n\n* * *\n\n提示\n\n你可以单独使用类选择器和 id\
  \ 选择器，也可以与其他选择标准结合使用。例如，`.news { color: red; }` 会影响所有带有 `news` 类的元素，而 `h1.news {\
  \ color: red; }` 则只会影响带有 `news` 类的 `h1` 元素。除非你必须针对性地指定它，否则最好从 id 或类选择器中省略元素名称。\n\
  \n* * *\n\n* * *\n\n提示\n\n注意在 ![Image](img/gray_circle-a.jpg) 和 ![Image](img/gray_circle-b.jpg)\
  \ 中，我使用的类名 `about` 传传达了所应用内容的含义，而不是称其为 `red`。最好避免创建一个描述事物外观的类名，因为你以后可能会更改样式（例如在本例中将文本改为绿色）。而且类像\
  \ HTML 元素一样为你的 HTML 增加了语义价值。\n\n* * *\n\n* * *\n\n提示\n\n如果 ![Image](img/gray_circle-b.jpg)\
  \ 中的示例被写为 `#gaudi { color: red; }`，则第一篇文章中的文本将是红色，因为它是唯一具有 `id=\"gaudi\"` 的。每个 id\
  \ 必须是唯一的，因此你不能关于 Lluís Domènech i Montaner 的文章重用该 id。\n\n* * *\n\n* * *\n\n提示\n\n\
  有关在 HTML 代码中为元素分配类的更多信息，请参阅第 3 章 中的“使用类或 ID 命名元素”。\n\n* * *\n\n* * *\n\n### 类选择器对比\
  \ ID 选择器\n\n在类选择器和 id 选择器之间做出选择时，我建议尽可能使用类，这在很大程度上是因为你可以复用它们。有些人主张完全不使用 id，我理解这种论点，但最终的选择取决于你开发网站时的个人决定。这是一个双方都可能产生非常强有力观点的话题。无论如何，以下是\
  \ id 选择器引入的两个问题：\n\n• 它们关联样式无法在其他元素上复用（记住，一个 id 在页面中只能出现一次）。这可能导致在其他元素上重复样式，而不是通过类来共享样式。\n\
  \n• 它们比类选择器具体得多。这意味着如果你以后需要覆盖用 id 选择器定义的样式，你将需要编写比它更具体的 CSS 规则。其中几个规则可能并不难管理，但一旦你开始处理一个相当规模的网站，你的\
  \ CSS 可能会变得比必要的更长、更复杂。\n\n随着你更多地使用 CSS，这两点可能会对你来说变得更加清晰。（另一方面，某些人喜欢使用 id 的原因之一是他们一眼就能看出某个元素是唯一的。）\n\
  \n因此，我建议寻找机会将共享样式合并到一个或多个类中以便复用，并且如果你确实使用 id 选择器，请将其减少到最少（参见第 11 章中的示例页以了解如何操作）。你可能会发现你的样式表更短、更更容易管理。\n\
  \n### 根据上下文选择元素\n\n在 CSS 中，你可以根据元素的祖先、父元素或兄弟元素来精确定元素（参见第 1 章中的“父级和子级”)![Image 到\
  \ ![Image](img/red_circle-d.jpg)。\n\n*祖先*是任何包含目标元素（*后代*）的元素，无论它们之间相隔了多少代。\n\n![Image](img/red_circle-a.jpg)\
  \ 我缩短了文本以便更容易看到元素之间的关系。每个缩进代表一代。请注意，在此代码段中，带有 `about` 类的 `article` 内部有两个第二代的 `p`\
  \ 元素，在项目部分（在 `article` 内部）中有一个第三代的 `p` 元素。完整代码中还有另一个第三代的 `p`，未显示。\n\n* * *\n\n```html\n\
  <article class=\"about\">\n    <h1>Antoni Gaudí</h1>\n    <p>Many tourists...</p>\n\
  \    <section class=\"project\">\n        <h2>Milà</h2>\n        <p>Gaudí's work...</p>\n\
  \    </section>\n    <section class=\"project\">\n        <h2>Sagrada Família</h2>\n\
  \        <p>...</p>\n    </section>\n</article>\n```\n\n* * *\n\n![Image](img/red_circle-b.jpg)\
  \ `article.about` 和 `p` 之间的空格意味着此选择器将找到任何带有 `about` 类的 `article` 的后代 `p` 元素，无论它是哪一代。然而，在类（特别是\
  \ id）之前加上元素名称通常比你需要的要具体。参见 ![Image](img/gray_circle-c) 中不具体的写法。\n\n* * *\n\n```css\n\
  article.about p {\n    color: red;\n}\n```\n\n* * *\n\n![Image](img/red_circle-c.jpg)\
  \ 构建选择器以获得所需效果通常有很多方法。这取决于你需要多具体。第一个示例中的选择器（`article p {`）比后续的 `.about p {}` 以及\
  \ ![Image](img/gray_circle-b) 中的不具体。第二个示例结合了类选择器和后代选择器；你也可以结合 id 选择器。\n\n* * *\n\
  \n```css\n/* 实现相同效果的其他方法\n---------------------- */\n\n/* 任何 article 的后代 p。最不具体的方法。\
  \ */\narticle p {\n    color: red;\n}\n\n/* 任何带有 about 类元素的后代 p。三种中第二具体的。 */\n.about\
  \ p {\n    color: red;\n}\n```\n\n* * *\n\n![Image](img/red_circle-d.jpg) 所有包含在\
  \ `about` 类元素内的 `p` 元素都是红色的，即使它们也位于 `about` 类元素的其他元素内部。![Image](img/gray_circle-b)\
  \ 和 ![Image](img/gray_circle-c) 中的每条样式规则都能产生所示的结果。\n\n![Image](img/9_09.jpg)\n\n\
  ### 根据祖先选择要格式化的元素\n\n**1.** 输入 `ancestor`，其中 `ancestor` 是包含你要格式化的元素的选择器。\n\n**2.**\
  \ 输入空格。\n\n**3.** 如果需要，重复步骤 1 和 2 处理每一代连续的祖先。\n\n**4.** 输入 `descendant`，其中 `descendant`\
  \ 是你要格式化的元素选择器。\n\n* * *\n\n提示\n\n基于元素祖先的选择器曾被称为*后代选择器*（descendant selector），但 CSS3\
  \ 将其重命名为*后代组合符*（descendant combinator）。（有些人仍称其为“选择器”。）\n\n* * *\n\n* * *\n\n\n\n\
  \n\n不要被示例中的 `article.about` 部分误导了![Image](img/gray_circle-b.jpg)。请记住，它仅仅意味着“类名（class）等于\
  \ about 的文章”。因此，`article.about p` 表示“包含在类名等于 about 的 `article` 元素中的任何 `p` 元素”。相比之下，优先级较低的\
  \ `.about p` 表示“包含在*任何*类名等于 about 的元素中的任何 `p` 元素”![Image](img/gray_circle-c.jpg)。因为在这种上下文中，`id`\
  \ 选择器比元素和类选择器更具特殊性。\n\n之前的示例展示了后代选择器。CSS 还有*子代选择器*（child combinators），它们允许你为父元素的直接后代（换句话说，即*子*）定义规则。你可能熟悉它们——CSS3\
  \ 之前的术语是*子选择器*（child selectors）。*父*元素是指直接包含另一个元素（`子`）的元素，这意味着它们只隔了一代。\n\n### 根据父元素选择要进行格式化的元素\n\
  \n1. 输入 `parent`，其中 `parent` 是直接包含你想要格式化的元素的选择器。\n2. 输入 `>`（大于号）![Image](img/red_circle-e.jpg)。\n\
  \n![Image](img/red_circle-e.jpg) 此选择器只会选择那些作为带有 `about` 类 `article` 元素元素（而不是孙元素、曾孙元素等）的\
  \ `p` 元素。为了符合条件，它们不能包含在任何其他元素内部。\n\n```\narticle.about > p {\n    color: red;\n\
  }\n```\n\n![Image](img/red_circle-f.jpg) 只有两个 `p` 元素是 `about` 类 `article` 的元素。另外两个\
  \ `p` 元素是 `article` 内部 `section` 元素的元素。此示例使用的 HTML 代码请参见![Image](img/gray_circle-a.jpg)。\n\
  \n![Image](img/9_10.jpg)\n\n3. 如必要，对每一连续代的父元素重复步骤 1 和 2。\n4. 输入 `child`，其中 `child`\
  \ 是你想要格式化的元素选择器。\n\n### 提示\n正如你在后代选择器中看到的那样，你可以省略类名之前的元素名称。事实上，我建议这么做（除非你需要额外的特殊性来实现所需的样式）。例如，在这种情况下，`.about\
  \ > p { color: red; }` 产生相同的效果。或者，为了进一步降低特殊性，可以完全省略类名，如 `article > p { color: red;\
  \ }`。在诉诸更具特殊性的选择器之前，尽可能使用这些简单的形式。本章后续的某些示例也可以以类似的方式进行简化。既然你已经了解了这种方法，我不会再指出这些替代方案，但请记住，通常保持*较低*的特殊性将使你的样式更容易复用。\n\
  \n### 提示\n你也可以在子代选择器器 `id` 选择器，尽管我建议尽可能使用元素类型或类等特殊性较低的选择器。\n\n### 提示\nInternet Explorer\
  \ 6 不支持子选择器。\n\n有时，能够只选择元素的*第一个*子元素而不是元素的所有子元素是很有用的。使用 `:first-child` 伪类来实现这一点（从\
  \ ![Image](img/red_circle-g.jpg) 到 ![Image](img/red_circle-j.jpg)）。\n\n![Image](img/red_circle-g.jpg)\
  \ `:first-child` 伪选择器只选择元素的第一个子，*而不是*作为子元素的第一个实例。因此，尽管你可能认为所示的规则会将示例页面中的第一个段落变为红色，但它并不会![Image](img/gray_circle-h.jpg)，因为\
  \ `h1` 是分配了 `about` 类的 `article` 的第一个元素。此示例使用的 HTML 代码请参见![Image](img/gray_circle-a.jpg)。\n\
  \n```css\n/* 你可能认为这会让第一个段落变红，但不会！ */\n.about > p:first-child {\n    color: red;\n\
  }\n```\n\n![Image](img/red_circle-h.jpg) 该规则对页面没有影响，因为没有一个 `p` 元素是带有 `about` 类元素的第一个子元素。\n\
  \n![Image](img/9_11.jpg)\n\n![Image](img/red_circle-i.jpg) 此选择器只选择 HTML 中分配了 `class=\"\
  about\"` 的元素的第一个子元素 `h1` 元素。这条规则*确实*影响了我们页面的显示![Image](img/gray_circle-j.jpg)。\n\
  \n```css\n/* h1 是第一个子，所以这有效。 */\n.about > h1:first-child {\n    color: red;\n}\n\
  ```\n\n![Image](img/red_circle-j.jpg) 包含在 `article` 中的 `h1` 元素是红色的，因为它是带有 `about`\
  \ 类元素的第一个子。如果 `article` 内部有其他 `h1` 元素，它们将不是红色的。\n\n![Image](img/9_12.jpg)\n\n####\
  \ 选择作为父元素第一个子元素的元素进行格式化\n\n1. 可选，输入 `parent`，其中 `parent` 是目标元素的选择器。\n2. 如果你在步骤 1\
  \ 中包含了父元素，请输入一个空格、一个 `>` 以及另一个空格。\n3. 可选，输入代表第一个元素的选择器（例如 `p`）。\n4. 输入 `:first-child`（就像\
  \ ![Image](img/gray_circle.jpg)）（注意不需要在步骤 1 中指定父元素。例如 `p:first-child { font-weight:\
  \ bold; }` 会让任何作为第一个元素的段加粗。）\n\n继续家族主题，*兄弟*元素（sibling）是指共享相同父元素的任何类型的元素。*相邻兄弟*是指相邻的元素，意味着它们之间没有其他兄弟。在下面的粗略示例中，`h1`\
  \ 和 `p` 是相邻兄弟，`p` 和 `h2` 是相邻的，但 `h1` 和 `h2` 不是。然而，它们都是兄弟（都是 `body` 的元素）：\n\n```html\n\
  <body>\n<h1>...</h1>\n<p>...</p>\n<h2>...</h2>\n</body>\n```\n\nCSS *相邻兄弟选择器*允许你定位紧跟在兄弟后面的兄弟元素。（参见关于\
  \ CSS3 新的通用兄弟选择器的最后一个提示。）\n\n### 根据相邻兄弟选择选择元素\n\n1. 输入 `sibling`，其中 `sibling` 是同一父元素内位于目标元素之前的元素选择器。\n\
  2. 输入 `+`（加号）。\n3. 如必要，对每个连续的兄弟重复步骤 1 和 2。\n4. 输入 `element`，其中 `element` 是你想要格式化的元素选择器![Image](img/red_circle-k.jpg)。\n\
  \n![Image](img/red_circle-k.jpg) 此相邻兄弟选择器只选择直接跟在兄弟 `p` 元素之后的 `p` 元素。\n\n```css\n\
  .about p+p {\n    color: red;\n}\n```\n\n![Image](img/red_circle-l.jpg) 只有直接跟在兄弟\
  \ `p` 元素之后的 `p` 元素是红色的。如果有三个、四个或更多连续的段落，它们也将是红色的。例如，相邻兄弟选择器对于缩进除第一个之外的所有段落非常有用。\n\
  \n![Image](img/9_13.jpg)\n\n### 提示\n另参见第一章中的“父元素与子元素”\n\n### 提示\n选择器中的 `:first-child`\
  \ 部分被称为*伪类*（pseudo-class），因为它可以在不需要你（设计师或开发者）在 HTML 代码中标记它们的情况下识别出一组元素。\n\n\n\n\n\
  CSS3 引入了`通用兄弟选择器`general sibling combinator），它允许你选择不一定紧跟在另一个元素后面的兄弟元素。语法上与相邻兄弟选择器的唯一区别是，你使用\
  \ `~`（波浪号）而不是 `+` 来分隔兄弟元素。例如，`h1~h2 { color: red; }` 只要父元素内某处有一个兄弟元素 `h1` 在前面，任何\
  \ `h2` 元素都会红色（它们可以是紧邻的，但不一定如此）。\n\n***\n\n## 选择元素的局部\n\n你也可以只选择元素的第一个字母或第一行，并对其应用格式设置。\n\
  \n### 选择元素的第一行\n\n**1.** 输入 `element`，其中 `element` 是你想要格式化行的元素的选择器。\n\n**2.** 输入\
  \ `:first-line` 来选择第 1 步引用元素的整个第一行。\n\n![Image](img/red_circle-a.jpg) 在浏览器中查看页面并看到内容的流向之前，无法确定哪些词受\
  \ `:first-line` 的影响。它并不是由 HTML 本身中单词所在的行决定的。\n\n***\n\n<article class=\"about\"\
  >\n    <h1>Antoni Gaudí</h1>\n    <p>许多游客被巴塞罗纳是为了参观安东尼·高迪（Antoni Gaudí）不可思议的建筑。</p>\n\
  \    <p>巴塞罗纳 <a href=\"http://www.gaudi2002.bcn.es/english/\" rel=\"external\">在\
  \ 2002 年庆祝了高迪出生 150 周年</a>。</p>\n    <section class=\"project\">\n        <h2 lang=\"\
  es\">La Casa Milà</h2>\n        <p>高迪的作品本质上是有实用性的。<span lang=\"es\">La Casa Milà</span>是一座公寓楼，有*真实的人*住在在那里。</p>\n\
  \    </section>\n    <section class=\"project\">\n        <h2 lang=\"es\">La Sagrada\
  \ Família</h2>\n        <p>名字复杂且奇特地未完工的圣家族赎罪堂是巴塞罗纳*访问人数最多*的建筑。</p>\n    </section>\n\
  </article>\n\n***\n\n![Image](img/red_circle-b.jpg) 这里选择器将选择每个 `p` 元素的第一行。\n\n***\n\
  \n```css\np:first-line {\n    color: red;\n}\n```\n\n***\n\n![Image](img/red_circle-c.jpg)\
  \ 调整窗口宽度会改变第一行的内容（从而改变被格式化的内容）。\n\n![Image](img/9_14.jpg)\n\n### 选择元素的第一个字母\n\n\
  **1.** 输入 `element`，其中 `element` 是你想要格式化的元素选择器。\n\n**2.** 输入 `:first-letter` 来选择第\
  \ 1 步引用元素的第一个字母。\n\n![Image](img/red_circle-d.jpg) 这里选择器将仅选择每个 `p` 元素的第一个字母。相应的\
  \ HTML 代码请参阅 ![Image](img/red_circle-a.jpg)。\n\n***\n\n```css\np:first-letter {\n\
  \    color: red;\n}\n```\n\n***\n\n![Image](img/red_circle-e.jpg) `:first-letter`\
  \ 选择器理论上可以用于创建首字母大（在你学习了颜色之外的属性之后）。\n\n![Image](img/9_15.jpg)\n\n***\n\n提示\n\n根据\
  \ CSS 规范，位于第一个字母之前的标点符号应该包含在选择器中。现代浏览器支持此，但旧版本的 IE 不支持。相反，它们将标点符号视为第一个字母。\n\n***\n\
  \n***\n\n提示\n\n只有某些 CSS 属性可以应用于 `:first-letter` 伪元素：`font`、`color`、`background`、`text-decoration`、`vertical-align`（只要\
  \ `:first-letter` 没有浮动）、`text-transform`、`line-height`、`margin`、`padding`、`border`、`float`\
  \ 和 `clear`。你将在第 10 章](#ch10.html_ch10)和第 11 章](#ch11.html_ch11)学习所有这些内容。\n\n***\n\
  \n***\n\n提示\n\n你可以将比示例中更复杂的器器 `:first-letter` 或 `:first-line`。例如，如果你只想选择 `project`\
  \ 类元素中每个段落的第一个字母，你的选择器将是 `.project p:first-letter`。\n\n***\n\n***\n\n## 伪元素、伪类以及\
  \ CSS3 的 `::first-line` 和 `::first-letter` 语法\n\n在 CSS3 中，`:first-line` 的语法是 `::first-line`，`:first-letter`\
  \ 的语法是 `::first-letter`。注意是双冒号而不是单冒号。\n\n\n\n\n\n由于链接可能同时处于多种状态之一（例如，同时处于激活状态和悬停状态），并且后定义的规则会覆盖之前的规则，因此按照以下顺序定义规则非常重要：`link`、`visited`、`focus`、`hover`、`active`\
  \ (LVFHA)。记忆这个顺序的一种口诀是“Lord Vader’s Former Handle Anakin”（维达勋爵的前名安纳金）。有些人主张将规则顺序改为\
  \ `LVHFA`；这同样可行。\n\n***\n\n### 根据属性选择元素\n\n你也可以对具有特定属性或属性值的元素应用格式设置。\n\n#### 根据属性选择要格式化的元素\n\
  \n**1.** 输入 `element`，其中 `element` 是你关注的元素的元素的选择器。\n\n**2.** 输入 `[attribute]`，其中\
  \ `attribute` 是元素被选中时必须具备的属性名称。\n\n![Image](img/red_circle-a.jpg) 为了演示，我将第二个 `section`\
  \ 元素的 `class` 值从 `project` 更改为了 `work`。\n\n***\n\n```html\n<article class=\"about\"\
  >\n    <h1>Antoni Gaudí</h1>\n    <p>Many tourists are drawn to Barcelona to see\
  \ Antoni Gaudí's incredible architecture.</p>\n    <p>Barcelona <a href=\"http://www.gaudi2002.bcn.es/english/\"\
  \ rel=\"external\">在 2002 年庆祝了高迪诞生的 150 周年纪念</a></p>\n    <section class=\"project\"\
  >\n        <h2 lang=\"es\">La Casa Milà</h2>\n        <p>Gaudí's work was essentially\
  \ useful. <span lang=\"es\">La Casa Milà</span> 是一栋公寓楼，<em>真实的人</em> 住在那里。</p>\n\
  \    </section>\n    <section class=\"work\">\n        <h2 lang=\"es\">La Sagrada\
  \ Família</h2>\n        <p>名字复杂且奇特地未完工的圣家族教堂是巴塞罗罗<em>访问人数最多</em>的建筑。</p>\n    </section>\n\
  </article>\n```\n\n***\n\n**3.** 如果你想指定属性值必须等于某个值时该元素才被选中，请输入 `=\"value\"`。\n\n\
  或者输入 `~=\"value\"` 来指定属性值必须包含某个精确值（以及其他用空格分隔的内容），该元素才被选中。它匹配的是一个完整的单词，而不是单词的一部分。\n\
  \n![Image](img/red_circle-b.jpg) 方括号包围了所需的属性和任何所需的值。在这种情况下，省略了值是为了选择任何带有任何 `class`\
  \ 属性的 `section`。\n\n***\n\n```css\nsection[class] {\n    color: red;\n}\n```\n\n\
  ***\n\n或者输入 `|=\"value\"`（那是一个管道符号，而不是数字“1”或字母“l”），来指定属性值必须等于 `value` 或以 `value`\
  \ 开头（即你输入的内容后跟一个连字符），该元素才被选中。（这在查找包含 `lang` 属性的元素时常见。）\n\n![Image](img/red_circle-c.jpg)\
  \ 每一个包含 `class` 属性的 `section` 元素无论 `class` 的值如何都是红色的。\n\n![Image](img/9_21.jpg)\n\
  \n或者输入 `^=\"value\"` 来指定属性值必须以 `value` 开头，无论是完整单词还是子字符串（CSS3 新功能；请参见本节的提示）。\n\n\
  或者输入 `=$=\"value\"` 来指定属性值必须以 `value` 结尾，无论是完整单词还是子字符串，该元素才被选中（CSS3 新功能；请参本节的提示）。\n\
  \n或者输入 `*=\"value\"` 来指定属性值必须包含至少一个 `value` 子字符串实例，该元素才被选中。换句话说，`value` 不需要是属性值中的一个完整单词（CSS3\
  \ 新功能；请参本节的提示）。\n\n**4.** 输入 `]`。\n\n***\n\n### 提示\n\n根据元素包含的属性（以及值）来选择元素受到目前所有主流浏览的支持（包括第\
  \ 7 版本的 IE）。IE7 和 IE8 对于步骤 3 中提到的三个作为 CSS3 新特性的属性选择器存在一些特殊情况。更多信息请参阅 [`reference.sitepoint.com/css/css3attributeselectors`](http://reference.sitepoint.com/css/css3attributeselectors)。\n\
  \n***\n\n***\n\n### 更多属性选择器示例\n\n属性选择器非常强大。这里有更多示例，展示了你使用它们的多种多样的方式。\n\n• 这选取任何\
  \ `rel` 属性等于 `external` 的 `a` 元素（必须完全匹配）。\n\n```css\na[rel=\"external\"] {\n  color:\
  \ red;\n}\n```\n\n• 假设你有一个带有两个类的 `section` 元素，例如 `<section class=\"project barcelona\"\
  >`，另一个带有一个类，即 `<section class=\"barcelona\">`。`~=` 语法可以生效：\n\n```css\nsection[class~=\"\
  barcelona\"] {\n  color: red;\n}\n```\n\n• 这选取任何 `class` 属性中包含 `barcelona` 的 `section`。`barcelona`\
  \ 不需要是属性值中的一个完整单词。\n\n```css\nsection[class*=\"barcelona\"] {\n  color: red;\n}\n\
  ```\n\n• 每一个包含 `class` 属性的 `section` 元素无论 `class` 的值如何都是红色的。\n\n```css\nsection[class]\
  \ {\n  color: red;\n}\n```\n\n• 这选取任何 `rel` 属性等于 `external` 的 `a` 元素。\n\n```css\n\
  a[rel=\"external\"] {\n  color: red;\n}\n```\n\n• 这选取任何 `class` 属性中包含 `project`\
  \ 的 `section`。\n\n```css\nsection[class*=\"project\"] {\n  color: red;\n}\n```\n\
  \n• 这选取任何 `class` 属性中包含 `work` 的 `section`。\n\n```css\nsection[class*=\"work\"]\
  \ {\n  color: red;\n}\n```\n\n• 这选取任何 `rel` 属性包含 `external` 的 `a` 元素。`external`\
  \ 匹配一个完整的单词，无论它出现在属性的哪个位置。\n\n```css\na[rel~=\"external\"] {\n  color: red;\n}\n\
  ```\n\n• 这选取任何 `lang` 属性以 `es` 开头的元素。\n\n```css\nsection[lang^=\"es\"] {\n  color:\
  \ red;\n}\n```\n\n• 这选取任何 `lang` 属性以 `es` 结尾的元素。\n\n```css\nsection[lang$=\"es\"\
  ] {\n  color: red;\n}\n```\n\n• 这选取任何 `lang` 属性包含 `es` 的元素。\n\n```css\nsection[lang*=\"\
  es\"] {\n  color: red;\n}\n```\n\n***\n\n### 指定元素组\n\n通常需要对多个元素应用相同的样式规则。你可以为每个元素重复规则，也可以组合选择器并一次性应用规则。当然，后的方法更高效，且通常会让你的样式表更易维护。\n\
  \n![Image](img/red_circle-a.jpg) 代码包含一个 `h1` 和两个 `h2` 元素。\n\n***\n\n#### 为元素组应用样式\n\
  \n**1.** 输入 `selector1`，其中 `selector1` 是第一个受该样式规则影响的元素名称。\n\n**2.** 输入 `,`（逗号）。\n\
  \n**3.** 输入 `selector2`，其中 `selector2` 是下一个受该样式规则影响的标签。\n\n**4.** 为每个额外的元素重复步骤 2\
  \ 和 3。\n\n***\n\n### 提示\n\n对元素进行分组样式仅仅是一种方便的快捷方式。`h1, h2 { color: red; }` 规则与两条规则\
  \ `h1 { color: red; }` 和 `h2 { color: red; }` 完全相同。\n\n\n\n\n你可以组合任何类型的选择器，从最简单的（如\
  \ ![Image](img/red_circle-b.jpg) 你可以列出任意数量的单独器（无论它们包含元素名称、ID 或类名），只要用逗号分隔每个即可。每个选择器并不非像显示的那样单独一行，但许多开发者使用这种惯例使其更易阅读。当选择器较长时，这种优势就更加明显。\n\
  \n* * *\n\n```css\nh1,\nh2 {\n    color: red;\n}\n```\n\n* * *\n\n* *\n\n![Image](img/red_circle-c.jpg)\
  \ 通过一条规则，`h1` 和 `h2` 元素就被染成了红色。\n\n![Image](img/9_22.jpg)\n\n* * *\n\n### 提示\n有时，创建一个适用于多个选择器的共同样式的单一样式规则，然后为它们不共有的样式创建单独的样式规则是有用的。请记住，样式表中后指定的规则会覆盖先指定的规则（请参见\
  \ 第 7 章 中的“级联：当规则发生冲突时” ）。\n\n* * *\n\n### 组合选择器\n本章中的示例都比较简单，以帮助你感受各种选择器类型。然而，真正的力量在于，你可以组合任何一种技术，以精确定位你感兴趣的格式化元素。\n\
  \n![Image](img/red_circle-a.jpg) 显示了一个极端的例子来演示这种可能性。这里是你可以实现相同结果的几种方法，按从不具体到具体的排序：\n\
  \n```css\nem {\n    color: red;\n}\n.project em {\n    color: red;\n}\n.about .project\
  \ em {\n    color: red;\n}\n#gaudi em {\n    color: red;\n}\n```\n\n![Image](img/red_circle-a.jpg)\
  \ 这里有一个非常复杂的例子。从右向左读，它的意思是：“在任何类名等于 `project` 的元素内部，仅选择位于 `h2` 元素紧相邻兄弟元素 `p` 之中的\
  \ `em` 元素，而这些 `h2` 元素的 `lang` 属性值以 `es` 开头。”明白了吗？你有机会写这么复杂的东西，但至少在必要时你知道你可以做到。或者你只是想吓唬看你代码的人。\n\
  \n* * *\n\n```css\n.project h2[lang|=\"es\"] + p em {\n    color: red;\n}\n```\n\
  \n* * *\n\n![Image](img/red_circle-b.jpg) 为了让 `em` 元素变红色，竟然用了这么多代码 ![Image](img/gray_circle-a.jpg)？！如果你认为直接写类似\
  \ `.about em { color: red; }` 的代码要好（也更简单），你是完全正确的。除非你需要极高的针对性，那种情况下可以使用那个复杂的例子。\n\
  \n![Image](img/9_23.jpg)\n\n* * *\n\n### CSS3 中的更多选择器\nCSS3 为你的工具箱添加了许多新选择器。你在本章中看到了其中一些。其他大多数新选择器是伪类，其中一些相当复杂，但也因此非常强大。你可以在此处找到\
  \ CSS3 选择器的表格和完整描述：[www.w3.org/TR/css3-selectors/#selectors](http://www.w3.org/TR/css3-selectors/#selectors)，简要描述和示例：[www.w3.org/wiki/CSS/Selectors](http://www.w3.org/wiki/CSS/Selectors)，以及浏览器支持情况：[`findmebyip.com/litmus`](http://findmebyip.com/litmus)。正如你所看到的，浏览器支持是稳固的，但\
  \ Internet Explorer 除外，它 直到 IE9 才开始支持大多数新的 CSS3 选择器（特别是伪类和伪元素）。\n\n* * *\n\n这些中的每一个都是你每天编写的典型选择器类型（尽管如之前提到的，尽量减少对\
  \ `id` 选择器的使用是一个好主意）。无论设计看起来多么复杂，实现大多数设计并不需要大量疯狂的选择器。\n\n所以，在合理的情况下组合选择器，但我建议你的样式规则只做到必要的具体即可。例如，如果你只想针对位于\
  \ `class=\"project\"` 的元素内的 `em` 元素，就使用 `.project em { color: red; }`。尽管 `em` 元素在\
  \ HTML 中嵌套在 `p` 元素内部，除非你有想要保留的段落之外的 em 元素，否则编写 `.project p em { color: red; }` 没有意义。简而言之，从简单开始，根据需要变得具体。\n\
  \n### 选择器总结\n总结一下，我们关注了这些选择器，其中任何一个都可以组合：\n- 按上下文选择元素\n- 按名称选择元素\n- 按类或 ID 选择元素\n\
  - 使用伪类或伪元素选择\n- 根据属性选择元素\n\n## 10. 使用样式格式化文本\n\n### 本章内容\n- 选择字体族\n- 本章\n- 选择字体族\n\
  - 本章\n- 选择字体族\n- 本章\n- 选择字体族\n- 本章\n- 选择字体族\n- 本章\n- 选择字体族\n- 本章\n- 选择字体族\n- 本章\n\
  - 选择字体族\n- 本章\n- 选择字体族\n- 本章\n- 选择字体族\n- 本章\n- 选择字体族\n- 本章\n- 选择字体族\n- 本章\n- 选择字体族\n\
