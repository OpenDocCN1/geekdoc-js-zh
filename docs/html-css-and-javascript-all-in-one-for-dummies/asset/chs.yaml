  \ **学习逻辑表达式**\n\n*你可能认为程序员不是艺术家，但编程是一项极具创造力的职业。它是基于逻辑的创造力。*\n\n—JOHN ROMERO\n\n\
  大量的 JavaScript 代码都涉及微小的计算：给这个数字加 5；将这两个项相乘；变量 A 的值是否大于变量 B 的值？给定一组布尔值，是否至少有一个为真？\n\
  \n这些示例都是 JavaScript 一项功能——表达式的英语等价。在编写 JavaScript 代码时，你不断使用表达式，因此了解它们是什么并熟悉各种表达式类型至关重要。\n\
  \n本章将带你了解表达式的所有知识。你将发现一些表达式的基础知识，然后探索使用数字、字符串和布尔值构建强大表达式的多种技术。\n\n\n\n\n尽可能模糊地说，一个\
  \ `expression`（表达式）是符号、单词和数字的集合，它们执行计算并产生一个结果。我知道这是一个非常模糊的定义，所以我会让它更具体一些。\n\n当你在餐厅吃完饭后拿到账单时，你可能做的第一件事之一就是拿出智能手机，使用计算器来计算小费金额。服务和食物都很棒，所以你认为\
  \ 20% 是合适的。手拿着手机，你输入账单总额，点击乘法按钮，点击 20%，然后点击等号。*搞定！* 小费金额就显示在屏幕上，你就可以离开了。\n\nJavaScript\
  \ 的 `expression` 就像这种过程，因为它接收一个或多个输入值（例如账单总额和小费百分比），并以某种方式将它们结合起来——例如，使用乘法。在表达式的术语中，输入值被称为\
  \ `operands`（操作数），它们通过称为 `operators`（运算符）的特殊符号结合在一起。\n\n- **operand（操作数）：** `expression`\
  \ 的输入值。换句话说，它是 `expression` 为了产生结果而处理的原始数据。它可以是一个数字、字符串、变量、函数结果（参见第 4 本，第 5 章）或对象属性（参见第\
  \ 4 本，第 6 章）。\n- **operator（运算符）：** 代表在一个或多个 `operands` 上执行特定操作的符号。例如，`*` 运算符表示乘法，`+`\
  \ 运算符表示加法。我将在本章中详细讨论各种 JavaScript `operators`。\n\n例如，这里有一个计算小费金额并将赋值给变量的 `expression`：\n\
  \n```\ntipAmount = billTotal * tipPercentage;\n```\n\n`expression` 是等号（`=`）右的所有内容。在这里，`billTotal`\
  \ 和 `tipPercentage` 是 `operands`，而乘号（`*`）是 `operator`。\n\n![技术细节](img/technicalstuff.png)\
  \ 表达式的结果始终具有特定的数据类型——数值、字符串或布尔值。因此，当你处理 `expressions` 时，务必记住你需要什么种类型的结果，然后据此选择合适的\
  \ `operands` 和 `operators`。\n\n![记住](img/remember.png) 我喜欢用来类比 `operands` 和 `operators`\
  \ 的另一个比喻是语法——也就是说，如果你把一个 `expression` 看作一个句子，`operands` 就是句子的名词（事物），而 `operators`\
  \ 就是句子的动词（动作）。\n\n### 构建数值表达式\n\n在餐厅账单上计算小费金额是一项数学计算，所以你可能认为 JavaScript `expressions`\
  \ 大部分将是数学性的。如果我站在你面前，并且碰巧带着一盒金星星，我肯定会给你一个，因为，是的，基于数学的 `expressions` 可能是你遇到的最常见的类型。\n\
  \n在 JavaScript 中，数学计算被称为 `numeric expression`（数值表达式），它结合了数值 `operands` 和算术 `operators`\
  \ 来产生数值结果。本节将讨论所有的 JavaScript 算术 `operators`，并向你展示如何最好使用它们来构建实用且方便的数值 `expressions`。\n\
  \n#### 快速查看算术运算符\n\nJavaScript 的基本算术 `operators` 与你手机计算器 App 或计算机键盘数字小键盘上的运算符基本相同，外加几个额外的\
  \ `operators` 用于更高级的工作。表 3-1 列出了你可以在 JavaScript `expressions` 中使用的基本算术 `operators`。（在随后的章节中，我将详细讨论每一个一个。）\n\
  \n| **Operator** | **Name** | **Example** | **Result** |\n| --- | --- | --- | ---\
  \ |\n| `+` | 加法 | `10 + 4` | `14` |\n| `++` | 递增 | `10++` | `11` |\n| `-` | 减法 |\
  \ `10 - 4` | `6` |\n| `-` | 负值 | `-10` | `-10` |\n| `--` | 递减 | `10--` | `9` |\n\
  | `*` | 乘法 | `10 * 4` | `40` |\n| `/` | 除法 | `10 / 4` | `2.5` |\n| `%` | 取模 | `10\
  \ % 4` | `2` |\n\n表 3-1 JavaScript 算术运算符\n\nJavaScript 还附带了一些额外的 `operators`，它们结合了一些算术\
  \ `operators` 和赋值 `operator`，后者是谦虚的等号（`=`），用于将值赋给 `variable`。表 3-2 列出了这些所谓的 `arithmetic\
  \ assignment`（算术赋值）`operators`。\n\n| **Operator** | **Example** | **Equivalent**\
  \ |\n| --- | --- | --- |\n| `+=` | `x += y` | `x = x + y` |\n| `-=` | `x -= y` |\
  \ `x = x - y` |\n| `*=` | `x *= y` | `x = x * y` |\n| `/=` | `x /= y` | `x = x /\
  \ y` |\n| `^=` | `x ^= y` | `x = x ^ y` |\n| `%=` | `x %= y` | `x = x % y` |\n\n\
  表 3-2 JavaScript 算术赋值运算符\n\n#### 使用加运算符 (+)\n\n使用加运算符 (`+`) 计算两个 `operands` 之和。这些\
  \ `operands` 通常是数值类型，例如如下 `expression`（参见 bk04ch03/example01.html）：\n\n```javascript\n\
  someVariable = someVariable + 1;\n```\n\n#### 使用递增运算符 (++)\n\n最常见的编程操作之一是给现有的 `variable`\
  \ 或其他 `operand` 加 1。这种操作被称为*递增*该值，通常的做法是使用如下语句（参见本章后文的算术赋值运算符）：\n\nJavaScript 提供了一种更紧凑的替代方案，直接在\
  \ `variable` 名称后面使用递增运算符（`++`）。在执行这些语句后，`someVariable` 的值将变为 1。\n\n![警告](img/warning.png)\
  \ 现在使用递增运算符被认为是一种糟糕的编程习惯。为什么？大多数原因是技术性的，但主要原因是这个运算符有点晦涩，会让代码难以阅读。\n\n也就是说，与其使用：\n\
  \n```javascript\nsomeVariable++;\n```\n\n不如使用：\n\n```javascript\nsomeVariable +=\
  \ 1;\n```\n\n#### 使用减法和负值运算符 (-)\n\n减法运算符（`-`）是从运算符右侧的数值值中减去运算符左侧的数值值。例如，请考虑以下语句（参见\
  \ bk04ch03/example03.html）：\n\n```javascript\nconst targetYear = 2025;\nconst birthYear\
  \ = 1985;\nconst yearsDifference = targetYear - birthYear;\n```\n\n第三条语句从 2025 中减去\
  \ 1985，结果 40 存储在 `yearsDifference` 变量中。\n\n负值运算符（`-`）是同一个符号，但工作方式完全不同。你将其作为一种前缀附加到\
  \ `operand` 的前面。结果是一个与原值符号相反的新值。换句话说，对 `operand` 应用负值运算符等同于将 `operand` 乘以 -1。这意味着以下两个语句是等价的：\n\
  \n```javascript\nnegatedValue = -originalValue;\nnegatedValue = originalValue *\
  \ -1;\n```\n\n#### 使用递减运算符 (--)\n\n另一个常见的编程操作是从现有的 `variable` 或其他 `operand` 减 1。这种操作被称为*递减*该值，通常的方法是使用如下语句：\n\
  \n```javascript\nthisVariable = thisVariable - 1;\n```\n\n\n\n\n然而（你早就知道会有一个“然而”），JavaScript\
  \ 提供了一种更简洁的替代方案，即利用递减运算符（`--`），你将其放置在变量名之后（`bk04ch03/example04.html`）：\n\n```javascript\n\
  let thisVariable = 1;\nthisVariable--;\n```\n\n执行这两条语句后，`thisVariable` 的值将变为 `0`。\n\
  \n![Warning](img/warning.png) 与递增运算符一样，如今使用递减运算符也是不推荐的。相反，使用减法赋值运算符（`-=`）而不是递减运算符会让你的代码可读性更好（请参考本章稍后的“使用算术赋值运算符”）。\n\
  \n也就是说，不要使用这种：\n\n```javascript\nthisVariable--;\n```\n\n而是使用这种：\n\n```javascript\n\
  thisVariable -= 1;\n```\n\n#### 使用乘法 (*) 运算符\n\n乘法运算符（`*`）将两个操作数相乘。这里有一个示例（`bk04ch03/example05.html`）：\n\
  \n```javascript\nconst columns = 8;\nconst columnWidth = 100;\nconst totalWidth\
  \ = columns * columnWidth;\n```\n\n当你想要计算使用多列的网页布局所占据的宽度时，可以使用这段代码。这段代码为变量 `columns`\
  \ 和 `columnWidth` 赋值字面数值。然后它使用一个数值表达式将这两个值相乘，并将结果赋值给变量 `totalWidth`。\n\n#### 使用除法\
  \ (/) 运算符\n\n除法运算符（`/`）将一个数值除以另一个数值。你可以通过记住这一点在派对上炫耀：斜杠（`/`）左侧的数字被称为被除数（`dividend`），`/`\
  \ 右侧的数字被称为除数（`divisor`）：\n\n`dividend` / `divisor`\n\n这里有一个示例（`bk04ch03/example06.html`）：\n\
  \n```javascript\nconst contentWidth = 600;\nconst windowWidth = 1200;\nconst contentRatio\
  \ = contentWidth / windowWidth;\n```\n\n你可以使用这段代码来计算页面内容当前使用的浏览器窗口宽度比例。在这段代码中，变量\
  \ `contentWidth` 和 `windowWidth` 被赋值了字面数值，然后通过一个数值表达式将第一个值除以第二个值，结果存储在变量 `contentRatio`\
  \ 中。\n\n![Warning](img/warning.png) 每只要你使用除法运算符，就必须防范除数为 0 的情况。如果发生这种情况，你的脚本将产生\
  \ `Infinity` 结果，这几乎会对你的计算造成破坏。在执行任何除法之前，你的脚本应该使用 `if()` 语句（参考第 4 卷第 4 章 运算符\n\n\
  模运算符（`%`）将一个数除以另一个数，并将余数作为结果：\n\n`dividend` % `divisor`\n\n例如，以下代码将值 `1` 存储在名为 `myRemainder`\
  \ 的变量中，因为 5（`myDivisor` 值，也称为模）除 16（`myDividend` 值）三次，余数为 1（`bk04ch03/example07.html`）：\n\
  \n```javascript\nconst myDividend = 16;\nconst myDivisor = 5;\nconst myRemainder\
  \ = myDividend % myDivisor;\n```\n\n在更实用的层，假设你正在尝试设计网页配色方案，并想使用两种互补的颜色。“互补”（Complementary）意味着两种色调位于色轮的对侧，因此计算第二种颜色的方法是在第一种颜色色调值上加上\
  \ 180。当第一种颜色色调在 0 到 179 之间时，这种方法有效，得到的第二种颜色色调值在 180 到 359 之间。然而，初始色调为 180、181 等会产生\
  \ 360、361 等第二色调，这些都是非法值。你可以通过使用这样的模表达式来解决这个问题（`bk04ch03/example07.html`）：\n\n```javascript\n\
  complementaryColor = (originalColor + 180) % 360;\n```\n\n该语句在原始颜色上加了 180，然后使用 `%\
  \ 360` 返回除以 360 的余数，以避免非法值。\n\n#### 使用算术赋值运算符\n\n你的网页编码脚本经常通过给变量值加上另一个操作数的值来更新变量值。这里有一个示例：\n\
  \n```javascript\ntotalInterestPaid = totalInterestPaid + monthlyInterestPaid\n```\n\
  \n程序员是一群追求效率的群体，所以 `totalInterestPaid` 变量在那个语句中出现两次的事实，对于普通程序员来说就像在嚼锡箔一样。JavaScript\
  \ 智库也讨厌那种事情，因此他们想出了加法赋值运算符（`+=`），你可以像这样使用它（`bk04ch03/example08.html`）：\n\n```javascript\n\
  totalInterestPaid += monthlyInterestPaid\n```\n\n是的，这条语句的作用与第一个完全相同，但它少了 19 个字符。太棒了！\n\
  \n如果你需要从一个操作数中减去另一个，你仍然可以用老办法：\n\n```javascript\nprincipleOwing = principleOwing\
  \ - monthlyPrincipalPaid\n```\n\n#### 为了避免其他程序员在背后嘲笑你效率低下，请使用减法赋值运算符（`-=`），它的工作方式如下（`bk04ch03/example08.html`）：\n\
  \n```javascript\nprincipleOwing -= monthlyPrincipalPaid\n```\n\n![Remember](img/remember.png)\
  \ 与递增和递减运算符一样，算术赋值运算符的设计是为了减少你手指的磨损，并减小脚本尺寸，特别是当你使用长变量名时。\n\n### 构建字符串表达式\n\n字符串表达式是指至少有一个操作数是字符串，且表达式的结果是另一个字符串的表达式。字符串表达式非常直观，因为只有一个运算符需要处理：拼接（`concatenation`）（`+`）。你使用这个运算符在表达式内组合（或`concatenate`）字符串。例如，表达式\
  \ `\"Java\" + \"Script\"` 返回字符串 `\"JavaScript\"`。但请注意，你也可以在下一节中讨论的比较运算符中使用字符串。\n\
  \n遗憾的是，拼接运算符与加法运算符相同，因为这种相似性可能会导致一些困惑。例如，表达式 `2 + 2` 返回数值 `4`，因为操作数是数值。然而，表达式 `\"\
  2\" + \"2\"` 返回字符串值 `\"22\"`，因为两个操作数都是字符串。\n\n为了使问题更加复杂，JavaScript 经常根据上下文将数字转换为字符串：\n\
  \n*   如果表达式中的第一个操作数是字符串，JavaScript 会将表达式中的任何数字转换为字符串。例如，以下表达式返回字符串 `\"222\"`：\n\n\
  \    ```javascript\n    \"2\" + 2 + 2\n    ```\n\n*   如果表达式中的前两个或多个操作数是数字，而表达式其余部分包含字符串，JavaScript\
  \ 会先处理表达式的数值部分，然后将结果转换为字符串。例如，以下表达式返回字符串 `\"42\"`，因为 `2 + 2` 的结果是 `4`，然后作为字符串拼接到\
  \ `\"2\"` 上：\n\n    ```javascript\n    2 + 2 + \"2\"\n    ```\n\n作为一个这种转换可能产生问题的示例，考虑以下代码中的脚本（`bk04ch03/example09.html`）：\n\
  \n```javascript\nconst preTipTotal = 10.00;\nconst tipAmount = preTipTotal * 0.15;\n\
  const message1 = \"Your tip is \";\nconst message2 = \"<br>Your total bill is \"\
  ;\ndocument.write(message1 + tipAmount +\nmessage2 + preTipTotal + tipAmount);\n\
  ```\n\n`preTipTotal` 变量存储餐厅账单的总额，`tipAmount` 变量存储总额的 15%。变量 `message1` 和 `message2`\
  \ 用字符串初始化，然后将结果写入页面。特别是，表达式 `preTipTotal + tipAmount` 被包含在 `document.write()` 方法中以显示总额。然而，如图\
  \ 3-1 所示，显示的“总额”实际上是 `101.5` 而不是 `11.5`（10 加上 1.5 的小费）。\n\n\n\n\n\n这里发生的情况是因为由于\
  \ `document.write()` 方法中表达式的第一部分是一个字符串，JavaScript 将 `preTipTotal` 和 `tipAmount`\
  \ 的值转换为字符串并对它们进行了拼接，而不是相加。\n\n![拼接而不是相加 preTipTotal 和 tipAmount 值的截图。](img/9781394164684-fg040301.png)\n\
  \nFIGURE 3-1: 拼接而不是相加 `preTipTotal` 和 `tipAmount` 值。\n\n要解决这个问题，你可以在单独的语句中执行加法运算，然后仅在\
  \ `document.write()` 表达式中使用该总和。下面的代码演示了这种方法（bk04ch03/example10.html）：\n\n```javascript\n\
  const preTipTotal = 10.00;\nconst tipAmount = preTipTotal * 0.15;\nconst totalBill\
  \ = preTipTotal + tipAmount;\nconst message1 = \"Your tip is \";\nconst message2\
  \ = \"<br>Your total bill is \";\ndocument.write(message1 + tipAmount + message2\
  \ + totalBill);\n```\n\n声明了一个名为 `totalBill` 的新变量，用于存储 `preTipTotal + tipAmount`\
  \ 的总和。然后使用 `totalBill` 在 `document.write()` 表达式中显示该总和，如图 3-2 所示，它现在显示了正确的答案。\n\n\
  ![分别计算 preTipTotal 和 tipAmount 解决了问题的截图。](img/9781394164684-fg040302.png)\n\nFIGURE\
  \ 3-2: 分别计算 `preTipTotal` 和 `tipAmount` 解决了问题。\n\n### 构建比较表达式\n\n你使用比较表达式来比较两个或多个数字、字符串、变量、属性或函数结果的值。如果表达式为真（true），则表达式结果被设置为布尔值\
  \ `true`；如果表达式为假（false），则表达式结果被设置为布尔值 `false`。你将在 JavaScript 代码中频繁地使用比较，因此理解它们是什么以及如何使用它们非常重要。\n\
  \n#### 比较运算符\n\n表 3-3 总结了 JavaScript 的比较运算符。\n\n| 运算符 | 名称 | 示例 | 结果 |\n| --- |\
  \ --- | --- | --- |\n| `==` | 等于 | `10 == 4` | `false` |\n| `!=` | 不等于 | `10 !=\
  \ 4` | `true` |\n| `>` | 大于 | `10 > 4` | `true` |\n| `<` | 小于 | `10 < 4` | `false`\
  \ |\n| `>=` | 大于等于 | `10 >= 4` | `true` |\n| `<=` | 小于等于 | `10 <= 4` | `false` |\n\
  | `===` | 严格相等 | `\"10\" === 10` | `false` |\n| `!==` | 严格不等于 | `\"10\" !== 10`\
  \ | `true` |\n\nTABLE 3-3 JavaScript 比较运算符\n\n#### 使用相等 (==) 运算符\n\n你使用相等运算符（`==`）（通常也称为等于运算符）来比较两个操作数的值。如果两个操作数的值相同，则比较返回\
  \ `true`；如果两个操作数的值不同，则比较返回 `false`。\n\n例如，在以下语句中，变量 `booksRead` 和 `weeksPassed`\
  \ 包含相同的值，因此表达式 `booksRead == weeksPassed` 返回 `true`（查看图 3-3 和 bk04ch03/example11.html）：\n\
  \n```javascript\nconst booksRead = 48;\nconst weeksPassed = 48;\nconst bookAWeek\
  \ = booksRead == weeksPassed;\ndocument.write(\"Me: I'm averaging a book a week,\
  \ amirite?<br>\");\ndocument.write(\"JavaScript: \" + bookAWeek);\n```\n\n![表达式\
  \ booksRead == weeksPassed 返回 true 的截图。](img/9781394164684-fg040303.png)\n\nFIGURE\
  \ 3-3: 表达式 `booksRead == weeksPassed` 返回 `true`。\n\n![Warning](img/warning.png)\
  \ 初学者和经验丰富的 JavaScript 程序员最常犯的错误之一是在比较表达式中使用 `=` 而不是 `==`。如果你的脚本没有正常运行或生成了错误，你应该检查的第一件事之一就是你的相等运算符是否有两个等号。\n\
  \n![Remember](img/remember.png) 这里的一点很重要，即即使两个操作数的数据类型不同，只要它们的值相同，相等运算符就会返回 `true`。（关于为什么发生这种情况的解释，请查看本章后面的“比较运算符和数据转换”。）例如，在以下代码中，`bookAWeek`\
  \ 变量最终获得了 `true` 的值：\n\n```javascript\nconst booksRead = 48;\nconst weeksPassed\
  \ = \"48\";\nconst bookAWeek = booksRead == weeksPassed;\n```\n\n这可能是你想要的，但你可能更希望比较返回\
  \ `false`。为此，你需要使用在本节稍后讨论的严格相等运算符（`===`）。\n\n#### 使用不等于 (!=) 运算符\n\n你使用不等于运算符（`!=`）来比较两个操作数的值，但其含义与相等运算符相反。也就是说，如果操作数的值不同，则比较返回\
  \ `true`；如果两个操作数的值相同，则比较返回 `false`。\n\n例如，在以下语句中，变量 `currentFontSize` 和 `defaultFontSize`\
  \ 包含不同的值，因此表达式 `currentFontSize!= defaultFontSize` 返回 `true`（bk04ch03/example12.html）：\n\
  \n```javascript\nconst currentFontSize = 19;\nconst defaultFontSize = 16;\nconst\
  \ usingCustomFontSize = currentFontSize != defaultFontSize;\n```\n\n![Remember](img/remember.png)\
  \ 即使两个操作数的数据类型不同，不等于运算符也会返回 `false`（意味着两个操作数的值相同）。这可能是你想要的，但你可能更希望比较返回 `true`。为此，你需要使用在本节稍后讨论的严格不等于运算符（`!==`）。\n\
  \n#### 使用大于 (>) 运算符\n\n你使用大于运算符（`>`）来比较两个操作数，以确定 `>` 左侧的操作数的值是否大于 `>` 右侧的操作数的值。如果是，则表达式返回\
  \ `true`；否则，返回 `false`。\n\n在下面的语句中，`contentWidth` 变量的值大于 `windowWidth` 变量，因此表达式\
  \ `contentWidth > windowWidth` 返回 `true`（bk04ch03/example13.html）：\n\n```javascript\n\
  const contentWidth = 1000;\nconst windowWidth = 800;\nconst tooBig = contentWidth\
  \ > windowWidth;\n```\n\n#### 使用小于 (<) 运算符\n\n你使用小于运算符（`<`）比较两个操作数，以确定 `<` 左侧的操作数的值是否小于\
  \ `<` 右侧的操作数的值。如果是，则表达式返回 `true`；否则，返回 `false`。\n\n例如，在后续的语句中，`kumquatsInStock`\
  \ 和 `kumquatsSold` 变量的值相同，因此表达式 `kumquatsInStock < kumquatsSold` 返回 `false`（查看图\
  \ 3-4 和 bk04ch03/example14.html）：\n\n```javascript\nconst kumquatsInStock = 3;\n\
  const kumquatsSold = 3;\nconst backordered = kumquatsInStock < kumquatsSold;\ndocument.write(\"\
  Are kumquats on back order? \" + backordered);\n```\n\n![表达式 kumquatsInStock < kumquatsSold\
  \ 返回 false 的截图。](img/9781394164684-fg040304.png)\n\nFIGURE 3-4: 表达式 `kumquatsInStock\
  \ < kumquatsSold` 返回 `false`。\n\n#### 使用大于等于 (>=) 运算符\n\n你使用大于等于运算符（`>=`）比较两个操作数，以确定\
  \ `>=` 左侧的操作数的值是否大于或等于 `>=` 右侧的操作数。如果这两个比较中有一个或两个都通过，则表达式返回 `true`；否则，返回 `false`。\n\
  \n例如，在以下语句中，`score` 变量的值大于 `prize1Minimum` 变量的值，并等于 `prize2Minimum` 变量的值。因此，表达式\
  \ `score >= prize1Minimum` 和 `score >= prize2Minimum` 都返回 `true`（bk04ch03/example15.html）：\n\
  \n```javascript\nconst score = 90;\nconst prize1Minimum = 80;\nconst prize2Minimum\
  \ = 90;\n```\n\n\n\n\n\n```javascript\nconst getsPrize1 = score >= prize1Minimum;\n\
  const getsPrize2 = score >= prize2Minimum;\n```\n\n#### 使用小于等于 (<=) 运算符\n\n你使用小于等于运算符\
  \ (`<=`) 来比较两个操作数，以确定 `<=` 左侧的操作数值是否小于或等于 `<=` 右侧的操作数值。如果这两个比较中有一个（或两个）通过了验证，则表达式返回\
  \ `true`；否则，返回 `false`。\n\n例如，在以下语句中，`defects` 变量的值小于 `defectsMaximumA` 变量的值，并且等于\
  \ `defectsMaximumB` 变量的值。因此，表达式 `defects <= defectsMaximumA` 和 `defects <= defectsMaximumB`\
  \ 均返回 `true` (bk04ch03/example16.html)：\n\n```javascript\nconst defects = 5;\nconst\
  \ defectsMaximumA = 10;\nconst defectsMaximumB = 5;\nconst getsBonus = defects <=\
  \ defectsMaximumA;\nconst getsRaise = defects <= defectsMaximumB;\n```\n\n#### 比较运算符和数据转换\n\
  \n在之前章节的示例中，我只使用了数字来演示各种比较运算符。然而，你也可以使用字符串和布尔值。如果你的表达式仅包含相同数据类型的操作数，这些比较是非常直观的；例如，比较两个字符串或两个布尔值。（不过，请参考我在本章稍后部分关于“在比较表达式中使用字符串”章节的讨论。）\n\
  \n![技术细节](img/technicalstuff.png) 如果你在单个比较表达式中混合数据类型，情况就会变得不那么直观了。在这种情况下，你需要记住 JavaScript\
  \ 在运行比较之前总是尝试将每个操作数转换为数字。工作原理如下：\n\n- 如果其中一个操作数是字符串而另一个是数字，JavaScript 会尝试将字符串转换为数字。例如，在以下语句中，字符串\
  \ `\"5\"` 被转换为数字 5，因此比较 `value1 == value2` 返回 `true`：\n\n```javascript\nconst value1\
  \ = \"5\";\nconst value2 = 5;\nconst result = value1 == value2;\n```\n\n如果字符串无法转换为数字（例如，字符串\
  \ `\"rutabaga\"` 无法转换为数字），比较始终返回 `false`。\n\n![记住](img/remember.png) 空字符串 (`\"\"\
  `) 被转换为 0。\n\n- 如果其中一个操作数是布尔值而另一个是数字，JavaScript 将布尔值转换为数字，如下：\n\n  - `true` — 该值被转换为\
  \ `1`。\n  - `false` — 该值被转换为 `0`。\n\n例如，在以下语句中，布尔值 `true` 被转换为数字 1，因此比较 `value1\
  \ == value2` 返回 `true`：\n\n```javascript\nconst value1 = true;\nconst value2 = 1;\n\
  const result = value1 == value2;\n```\n\n- 如果其中一个操作数是布尔值而另一个是字符串，JavaScript 将布尔值转换为数字（如上所示），并尝试将字符串转换为数字。例如，在以下语句中，布尔值\
  \ `false` 被转换为数字 0，字符串 `\"0\"` 被转换为数字 0，因此比较 `value1 == value2` 返回 `true`：\n\n```javascript\n\
  const value1 = false;\nconst value2 = \"0\";\nconst result = value1 == value2;\n\
  ```\n\n如果字符串无法转换为数字，比较始终返回 `false`。\n\n#### 使用严格相等 (===) 运算符\n\n严格相等运算符 (`===`)\
  \ 检查两个操作数是否完全相同，这意味着它不仅检查操作数的值是否相等，还检查操作数是否为相同的数据类型。（这就是为什么严格相等运算符有时也被恒等运算符。）\n\n\
  例如，在以下语句中，变量 `albumName` 包含一个字符串，变量 `albumReleaseDate` 包含一个数字。这些值的数据类型不同，因此表达式 `albumName\
  \ === albumReleaseDate` 返回 `false` (bk04ch03/example17.html)：\n\n```javascript\n\
  const albumName = \"1984\";\nconst albumReleaseDate = 1984;\nconst result = albumName\
  \ === albumReleaseDate;\n```\n\n相比之下，如果你使用不检查操作数数据类型的相等运算符 (`==`)，则表达式 `albumName\
  \ == albumReleaseDate` 将返回 `true`。\n\n![记住](img/remember.png) 那么，你什么时候应该使用相等 (`==`)，什么时候应该使用严格相等\
  \ (`===`) 呢？许多专业的 JavaScript 程序员完全忽略了这个问题，始终使用严格相等运算符。你也应该这样做。\n\n#### 使用严格不等于 (!==)\
  \ 运算符\n\n严格不等于运算符 (`!==`) 执行（某种程度上）严格相等运算符相反的功能。也就是说，它不仅检查两个操作数的值是否不同，还检查操作数是否为不同的数据类型。（这就是为什么严格不等于运算符有时被称为非恒等运算符。）\n\
  \n在以下语句中，变量 `hasBugs` 包含布尔值 `true`，变量 `totalBugs` 包含一个数字。这些值的数据类型不同，因此表达式 `hasBugs\
  \ !== totalBugs` 返回 `true` (bk04ch03/example18.html)：\n\n```javascript\nconst hasBugs\
  \ = true;\nconst totalBugs = 1;\nconst result = hasBugs !== totalBugs;\n```\n\n\
  #### 在比较表达式中使用字符串\n\n仅涉及数字的比较表达式很少惊喜，但仅涉及字符串的比较有时会让人感到困惑。正如你所预期的，比较是基于字母顺序的，所以“A”在“B”之前，“a”在“b”之前。啊，但这并不是你父亲熟悉的那个字母顺序。在\
  \ JavaScript 的世界里，所有大写字母都在所有小写字母之前，这意味着例如，“B”在“a”之前，因此以下表达式将返回 `false`：\n\n```javascript\n\
  \"a\" < \"B\"\n```\n\n另一个需要记住的是，大多数字符串比较涉及多个字母的操作数。在这些情况下，JavaScript 会逐字母比较每个字符串。例如，考虑以下表达式：\n\
  \n```javascript\n\"Smith\" < \"Smyth\"\n```\n\n每个字符串的前两个字母是相同的，但第三个字母不同。`Smith`\
  \ 中 `i` 的内部值小于 `Smyth` 中 `y` 的内部值，因此之前的比较将返回 `true`。（同样注意，在发现差异后，JavaScript 会忽略每个字符串中剩余的字母。）\n\
  \n此外，空格是比较目的的合法字符，它的内部值在所有其他字母和可打印符号之前。（如果你阅读了“Unicode 字符串值 [或，为什么 *a* 不小于 *B*”\
  \ 侧边栏，我可以告诉你空格字符的 Unicode 值为 32。）那么，考虑以下比较：\n\n```javascript\n\"Marge Simpson\"\
  \ > \"Margerine\"\n```\n\n该表达式返回 `false`，因为左侧操作数的第六个“字母”是空格，而 `\"Margerine\"` 的第六个字母是\
  \ `r`。\n\n#### 使用三元 (?:) 运算符\n\n![技术细节](img/technicalstuff.png) 了解比较运算符也让你可以使用我最喜欢的表达式工具之一——一个复杂但极其实用的项目，称为三元运算符\
  \ (`?:`)。以下是在表达式中使用三元运算符的基本语法：\n\n`expression ? result_if_true : result_if_false`\n\
  \n`expression` 是一个结果为 `true` 或 `false` 值的比较表达式。事实上，你可以使用任何具有 `true` 或 `false` 布尔值的变量、函数结果或属性。`result_if_true`\
  \ 是当 `expression` 求值为 `true` 时表达式返回的值；`result_if_false` 是当 `expression` 求值为 `false`\
  \ 时表达式返回的值。\n\n![提示](img/tip.png) 在 JavaScript 中，根据定义，以下值是 `false` 的等效值：\n\n- `0`（数字零）\n\
  - `\"\"`（空字符串）\n- `null`\n\n\n\n\n\n- `undefined`（例如，即未初始化变量的“值”）\n\n其他所有内容的内容都等同于\
  \ `true`。\n\n这里有一个示例（bk04ch03/example19.html）：\n\n```javascript\nconst screenWidth\
  \ = 768;\nconst maxTabletWidth = 1024;\nconst screenType = screenWidth > maxTabletWidth\
  \ ? \"Desktop!\" : \"Tablet!\";\n```\n\n变量 `screenWidth` 被初始化为 `768`，变量 `maxTabletWidth`\
  \ 被初始化为 `1024`，变量 `screenType` 存储条件表达式返回的值。对于后者，`screenWidth > maxTabletWidth` 是比较表达式，`\"\
  Desktop!\"` 是结果为 `true` 时返回的字符串，而 `\"Portable!\"` 是结果为 `false` 时返回的字符串。由于 `screenWidth`\
  \ 小于 `maxTabletWidth`，比较结果将为 `false`，因此结果将是 `\"Tablet!\"`。\n\n### 构建逻辑表达式\n\n你使用逻辑表达式来组合或操作布尔值，特别是比较表达式。例如，如果你的代码需要在继续执行之前测试两个不同的比较表达式是否均为\
  \ `true`，你可以通过逻辑表达式来实现这一点。\n\n#### 逻辑运算符\n\n表 3-4 列出了 JavaScript 的逻辑运算符。\n\n| **运算符**\
  \ | **名称** | **通用语法** | **返回值** |\n| --- | --- | --- | --- |\n| `&&` | 与 (AND) |\
  \ `expr1` `&&` `expr2` | 如果 `expr1` 和 `expr2` 均为 `true` 则返回 `true`；否则返回 `false`。\
  \ |\n| `&#124;&#124;` | 或 (OR) | `expr1` `&#124;&#124;` `expr2` | 如果 `expr1` 或 `expr2`\
  \ 至少有一个为 `true` 则返回 `true`；否则返回 `false`。 |\n| `!` | 非 (NOT) | `!expr` | 如果 `expr`\
  \ 为 `false` 则返回 `true`；如果 `expr` 为 `true` 则返回 `false`。 |\n\n表 3-4 JavaScript 逻辑运算符\n\
  \n#### 使用与 (&&) 运算符\n\n当你想要测试两个布尔操作数以确定它们是否都为 `true` 时，使用与运算符 (`&&`）。例如，考虑以下语句（bk04ch03/example20.html）：\n\
  \n```javascript\nconst finishedDinner = true;\nconst clearedTable = true;\nconst\
  \ getsDessert = finishedDinner && clearedTable;\n```\n\n由于 `finishedDinner` 和 `clearedTable`\
  \ 均为 `true`，逻辑表达式 `finishedDinner && clearedTable` 的结果为 `true`。\n\n另一方面，考虑这些语句：\n\
  \n```javascript\nconst haveWallet = true;\nconst haveKeys = false;\nconst canGoOut\
  \ = haveWallet && haveKeys;\n```\n\n在这个示例中，由于 `haveKeys` 为 `false`，逻辑表达式 `haveWallet\
  \ && haveKeys` 的结果为 `false`。如果只有 `haveWallet` 为 `false` 或者 `haveWallet` 和 `haveKeys`\
  \ 均为 `false`，该逻辑表达式也会返回 `false`。\n\n表 3-5 列出了你可以输入的各种操作数及其产生的结果（这被称为*真值表*）。\n\n\
  | `left_operand` | `right_operand` | `left_operand && right_operand` |\n| --- |\
  \ --- | --- |\n| `true` | `true` | `true` |\n| `true` | `false` | `false` |\n| `false`\
  \ | `true` | `false` |\n| `false` | `false` | `false` |\n\n表 3-5 与 (&&) 运算符真值表\n\
  \n#### 使用或 (||) 运算符\n\n当你想要测试两个布尔操作数以至少至少为 `true` 时，使用或运算符 (`||`）。例如，考虑以下语句（bk04ch03/example21.html）：\n\
  \n```javascript\nconst hasFever = true;\nconst hasCough = false;\nconst missSchool\
  \ = hasFever || hasCough;\n```\n\n由于 `hasFever` 为 `true`，逻辑表达式 `hasFever || hasCough`\
  \ 的结果为 `true`，因为只需要操作数中的一个为 `true`。如果只有 `hasCough` 为 `true` 或者两个操作数均为 `true`，你会得到相同的结果。\n\
  \n另一方面，考虑这些语句：\n\n```javascript\nconst salesOverBudget = false;\nconst expensesUnderBudget\
  \ = false;\nconst getsBonus = salesOverBudget || expensesUnderBudget;\n```\n\n在这个示例中，由于\
  \ `salesOverBudget` 和 `expensesUnderBudget` 均为 `false`，逻辑表达式 `salesOverBudget ||\
  \ expensesUnderBudget` 的结果为 `false`。\n\n表 3-6 显示了可以输入的各种操作数的真值表。\n\n| `left_operand`\
  \ | `right_operand` | `left_operand &#124;&#124; right_operand` |\n| --- | --- |\
  \ --- |\n| `true` | `true` | `True` |\n| `true` | `false` | `True` |\n| `false`\
  \ | `true` | `True` |\n| `false` | `false` | `False` |\n\n表 3-6 或 (||) 运算符真值表\n\n\
  #### 使用非 (!) 运算符\n\n非运算符 (`!`) 是在本节之前提到的否定运算符的逻辑等。在这种情况下，非返回操作数的相反布尔值。例如，考虑以下语句（bk04ch03/example22.html）：\n\
  \n```javascript\nconst dataLoaded = false;\nconst waitingForData = !dataLoaded;\n\
  ```\n\n`dataLoaded` 为 `false`，所以 `!dataLoaded` 的结果为 `true`。\n\n表 3-7 显示可以输入的各种操作数的真值表。\n\
  \n| `Operand` | `!Operand` |\n| --- | --- |\n| true | false |\n| false | true |\n\
  \n表 3-7 非 (!) 运算符真值表\n\n#### 关于 && 和 || 运算符的高级说明\n\n![技术细节](img/technicalstuff.png)\
  \ 我之前提到过 JavaScript 定义了多种等于 `false` 的值——包括 `0` 和 `\"\"`——以及所有其他值等于 `true`。这些等价关系意味着你可以对非布尔值使用与运算符或运算符。但是，如果你计划使用非布尔值，你需要确切\
  \ JavaScript 是如何评估这些表达式的。\n\n以与表达式开始：\n\n1. 评估左侧的操作数。\n2. 如果左操作数的值 `false` 或其等值，返回该值并停止；否则继续第\
  \ 3 步。\n3. 如果左操作数的值 `true` 或其等值，评估右侧的操作数。\n4. 返回右操作数的值。\n\n这确实是一种奇异的行为，有两个需要记住的关键概念：\n\
  \n- 如果左操作数的求值为 `false` 或其等值，则右操作数*永远不会*被评估。\n- 逻辑表达式返回左或右操作数的结果，这意味着表达式可能*不*返回 `true`\
  \ 或 `false`；相反，它可能返回等于 `true` 或 `false` 的值。\n\n要尝试这些概念，请使用以下代码（bk04ch03/example23.html）：\n\
  \n```javascript\nconst v1 = true;\nconst v2 = 10;\nconst v3 = \"testing\";\nconst\
  \ v4 = false;\nconst v5 = 0;\nconst v6 = \"\";\nconst leftOperand = eval(prompt(\"\
  输入左操作数（值或表达式）：\", true));\nconst rightOperand = eval(prompt(\"输入右操作数（值或表达式）：\",\
  \ true));\nconst result = leftOperand && rightOperand;\ndocument.write(result);\n\
  ```\n\n脚本首先声明并初始化六变量。前三个（`v1`、`v2` 和 `v3`）被等于 `true` 的值，后三个（`v4`、`v5` 和 `v6`）赋予等于\
  \ `false` 的值。脚本随后提示左操作数和右操作数，然后将其输入到与表达式中。这里的关键在于你可以为每个操作数输入任何值，或者使用 `v1` 到 `v6`\
  \ 变量输入比较表达式，例如 `v2 > v5`。在 `prompt()` 结果上使用 `eval()` 确保 JavaScript 按照输入的方式使用表达式。\n\
  \n表 3-8 列出了一些示例输入及其产生的结果。\n\n| `left_operand` | `right_operand` | `left_operand\
  \ && right_operand` |\n| --- | --- | --- |\n| `true` | `true` | `true` |\n| `true`\
  \ | `false` | `false` |\n| `5` | `10` | `10` |\n| `false` | `\"Yo\"` | `false` |\n\
  | `v2` | `v5` | `0` |\n| `true` | `v3` | `testing` |\n| `v5` | `v4` | `0` |\n| `v2\
  \ > v5` | `v5 == v4` | `true` |\n\n\n\n\n\nTABLE 3-8 上述代码的一些示例结果\n\n与 AND 运算符一样，JavaScript\
  \ 求值 OR 表达式的逻辑也很奇怪，需要理解，特别是当你将使用等价于 `true` 或 `false`的操作数时：\n\n1. 求值 OR 运算符左侧的操作数。\n\
  2. 如果左侧操作数的值为 `true` 或等价 `true`，则返回该值并停止；否则继续执行第 3 。\n3. 如果左侧操作数的值为 `false` 或等价\
  \ `false`，则求值 OR 运算符右侧的操作数（注：原文此处 AND，根据上下文应为 OR）。\n4. 返回右侧操作数的值。\n\n### 理解运算符优先级\n\
  \n你的 JavaScript 代码经常会使用一些极其简单的表达式：只有一或两个操作数和一个运算符。遗憾的是，这里的“经常”并不意味着“大部分”，因为你使用的许多表达式将包含多个值和运算符。在这些更复杂的表达式中，计算的顺序变得至关重要。例如，考虑表达式\
  \ `3+5*2`。如果你从左到右计算，得到的答案是 `16`（`3+5` 等于 `8`，`8*2` 等于 `16`）。然而，如果你先执行乘法后执行加法，结果是\
  \ `13`（`5*2` 等于 `10`，`3+10` 等于 `13`）。也就是说，一个表达式可以执行计算的顺序产生多个答案。\n\n为了控制这个顺序问题，JavaScript\
  \ 根据预定义的*优先级*对表达式求值。这种优先级让 JavaScript 通过确定表达式中哪个部分先计算、哪个部分后计算（以此类推），从而无歧地计算表达式。\n\
  \n#### 优先级顺序\n\nJavaScript 使用的优先级顺序由我在本章目前介绍的各种表达式运算符决定。表 3-9 总结了 JavaScript 使用的完整优先级。\n\
  \n例如，表 3-9 告诉你在 JavaScript 中加法之前执行乘法。因此，表达式 `3+5*2`（刚刚讨论过的）的正确答案是 `13`。\n\n同样注意，表\
  \ 3-9 中的某些运算符具有相同的优先级（例如乘法和除法）。优先级相同意味着 JavaScript 求值这些运算符的顺序无关。例如，考虑表达式 `5*10/2`。如果你先执行乘法，得到的答案是\
  \ `25`（`5*10` 等于 `50`，`50/2` 等于 `25`）。如果你先执行除法，你也得到答案 `25`（`10/2` 等于 `5`，`5*5` 等于\
  \ `25`）。\n\n然而，JavaScript 对这类表达式确实有定义的顺序，这就是“求值顺序”列告诉你的内容。`L -> R` 值意味着相同优先级的操作从左到右计算；`R\
  \ -> L` 意味着操作从右到左评估。\n\n| 运算符 | 操作 | 优先级 | 求值顺序 |\n| --- | --- | --- | --- |\n|\
  \ `++` | 递增 | 第一 | R -> L |\n| `--` | 递减 | 第一 | R -> L |\n| `—` | 否定 | 第一 | R ->\
  \ L |\n| `!` | 逻辑 | 第一 | R -> L |\n| `*`, `/`, `%` | 乘法、除法、取模 | 第二 | L -> R |\n\
  | `+`, `—` | 加法、减法 | 第三 | L -> R |\n| `+` | 字符串拼接 | 第三 | L -> R |\n| `<`, `<=` |\
  \ 小于、小于等于 | 第四 | L -> R |\n| `>`, `>=` | 大于、大于等于 | 第四 | L -> R |\n| `==` | 相等 |\
  \ 第五 | L -> R |\n| `!=` | 不相等 | 第五 | L -> R |\n| `===` | 严格相等 | 第五 | L -> R |\n\
  | `!==` | 严格不相等 | 第五 | L -> R |\n| `&&` | 与 | 第六 | L -> R |\n| `||` | 或或 | 第六 |\
  \ L -> R |\n| `?:` | 三元运算符 | 第七 | R -> L |\n| `=` | 赋值 | 第八 | R -> L |\n| `+=`,\
  \ `-=`, 等. | 算术赋值 | 第八 | R -> L |\n\nTABLE 3-9 JavaScript 运算符优先级表\n\n#### 控制优先级\n\
  \n有时你想要控制局面并覆盖优先级。这看起来像是一件相当奇怪的事情，所以可能需要一个例子。正如你可能知道的，你通过将零售价乘以税率，然后将该结果加到零售价上来计算零售物品的总成本：\n\
  \n`Total Price = Retail Price + Retail Price * Tax Rate`\n\n然而，如果你想反转这个计算呢？也就是说，假设你知道某个物品的最终价格，并且在给定税率的情况下想知道原始价格（即税前价格）。通过对前面的方程应用一些代数，结果证明你可以通过总价除以\
  \ 1 加税率来计算原始价格。因此，如果总价是 $11，税率是 10%，你会得到 $10。\n\n现在，我将把此计算转换为 JavaScript 代码。一个新方程可能像这样：\n\
  \n`retailPrice = totalPrice / 1 + taxRate;`\n\n以下代码实现了该公式，而图 3-5 显示了结果（bk04ch03/example24.html）：\n\
  \n```\nconst totalPrice = 11.00;\nconst taxRate = .1;\nconst retailPrice = totalPrice\
  \ / 1 + taxRate;\ndocument.write(\"The pre-tax price is \" + retailPrice);\n```\n\
  \n![第一次尝试计算税前价格的结果](img/9781394164684-fg040305.png)\n\nFIGURE 3-5: 第一次尝试计算税前价格的结果。\n\
  \n正如图 3-3 所示，结果是错误的。发生了什么？根据优先级规则，JavaScript 先执行除法后执行加法，所以 `totalPrice` 值首先除以 1，然后加上\
  \ `taxRate`，这并不是正确的顺序。\n\n为了得到正确答案，你必须覆盖优先级，以便先执行加法 `1 + taxRate`。你通过对表达式包裹该部分来覆盖优先级，如下代码所示。使用此修改后的脚本，你得到了正确答案，如图\
  \ 3-6 所示（bk04ch03/example25.html）：\n\n```\nconst totalPrice = 11.00;\nconst taxRate\
  \ = .1;\nconst retailPrice = totalPrice / (1 + taxRate);\ndocument.write(\"The pre-tax\
  \ price is \" + retailPrice);\n```\n\n![修改后的脚本正确计算税前价格的结果](img/9781394164684-fg040306.png)\n\
  \nFIGURE 3-6: 修改后的脚本正确计算了税前价格。\n\n\n\n\n\n![Bullet](img/check.png) 理解代码循环\n\n![Bullet](img/check.png)\
  \ 设置代码循环\n\n![Bullet](img/check.png) 避免可怕的无限循环\n\n*一个优秀的程序员在穿过单行道之前，总是会左右观察四周。*\n\
  \n—DOUG LINDER\n\n如果听任其发展，网络浏览器将以默认方式处理 HTML 和 JavaScript 代码。这种默认方式本身并没有问题，但如果你退后一步只让浏览器按它的标准方式运行，结果将只是一个标准的网页。\n\
  \n制作美观且生动的网页的秘密在于从网络浏览器手中夺取控制权，并将一切掌握在自己手中。你将在第 5 本书中学习如何打破浏览器默认的布局流。在这里，我指的是 JavaScript，所以你需要学习如何打破浏览器默认的脚本处理流。\n\
  \n默认的脚本流意味着浏览器逐条语句处理 `script` 元素内部或外部 JavaScript 文件代码。浏览器读取并执行第一条语句，读取并执行第二条语句，以此此类推，直到没有更多的\
  \ JavaScript 代码需要读取和执行。\n\n这种逐条语句的流看起来很合理，但它的局限性极大。如果想让代码测试某些条件，并根据测试结果跳转到特定的代码块该怎么办？如果想让代码重复执行某些语句，并且每次重复都发生一些变化该怎么办？运行测试的代码和重复的代码都属于控制\
  \ JavaScript 执行流的范畴。在本章中，你将探索这个迷人且强大的主题。\n\n### 使用 if 语句进行真/假决策\n\n一个智能的脚本会对环境进行测试，然后根据每项测试的结果决定下一步做什么。例如，假设你声明了一个变量，稍后在表达式中将其作为除数。在表达式中使用该变量之前，你应该对其进行测试，以确保变量的值不为\
  \ 0。\n\n最基本的测试是简单的真/假决策（也可以被认为是是/否或开启/关闭决策）。在这种情况下，你的程序查看某个条件，确定其当前是真还是假，并采取相应的行动。比较和逻辑表达式（在第\
  \ 4 本书 3 章中介绍）在这里起着很大作用，因为它们总是返回 `true` 或 `false` 结果。\n\n在 JavaScript 中，简单的真/假决策由\
  \ `if` 语句处理。你可以使用单行语法：\n\n```\nif (expression) statement;\n```\n\n或者块级语法：\n\n```\n\
  if (expression) {\n  statement1;\n  statement2;\n  …\n}\n```\n\n在两种情况下，`expression`\
  \ 是一个返回 `true` 或 `false` 的比较或逻辑表达式，而 `statement(s)` 代表如果 `expression` 返回 `true`\
  \ 则运行的 JavaScript 语句或语句。如果 `expression` 返回 `false`，JavaScript 将跳过这些语句。\n\n![Tip](img/tip.png)\
  \ 这里值得注意一点，JavaScript 将以下值视为 `false` 的等值：`0`、`\"\"`（即空字符串）、`null` 和 `undefined`。其他所有值都是\
  \ `true` 的等值。\n\n![Remember](img/remember.png) 这是你第一次遇到 JavaScript 的括号（`{` 和 `}`），花点时间理解它们的作用，因为它们经常出现。括号包围了一个或多个你想让\
  \ JavaScript 视为单个实体的语句。这个实体本身就是一种语句，所以整体——括号以及它们包含的代码——被称为块语句。此外，任何由语句（如 `if`）后跟一个块语句组成的\
  \ JavaScript 结构都称为复合语句。另外，为了让你保持警觉，注意包含括号的行末尾不需要分号。\n\n使用单行语法还是块级语法取决于当 `expression`\
  \ 返回 `true` 结果时你想运行的语句。如果你只有一条语句，可以使用任何一种语法。如果你有多条语句，请使用块级语法。\n\n考虑以下示例（查看此书示例文件中的\
  \ bk04ch04/example01.html）：\n\n```\nif (totalSales != 0) {\n  const grossMargin\
  \ = (totalSales - totalExpenses) / totalSales;\n}\n```\n\n这段代码假设脚本之前计算了总销售额和总支出，并分别存储在\
  \ `totalSales` 和 `totalExpenses` 变量中。代码现在计算毛利，定义为毛利润（即销售额减去支出）除以销售额。代码使用 `if` 测试\
  \ `totalSales` 变量的值是否不等于零。如果 `totalSales != 0` 表达式返回 `true`，则执行 `grossMargin` 计算；否则什么都不会发生。此示例中的\
  \ `if` 测试是正确的，因为它确保了计算中的除数——`totalSales` 永远不会为零。\n\n### 使用 if…else 语句进行分支\n\n使用\
  \ `if` 语句做出决策为你的 JavaScript 工具库增添了强大的新武器。然而，`if` 的简单版本有一个重要的局限性：`false` 结果只会跳过一条或多条语句；它不会执行自身的任何语句。在很多情况下这没问题，但有时你需要在条件返回\
  \ `true` 时运行一组语句，而在结果为 `false` 时运行另一组。为了处理这些场景，你需要使用 `if…else` 语句：\n\n```\nif (expression)\
  \ {\n  statements-if-true\n} else {\n  statements-if-false\n}\n```\n\n`expression`\
  \ 是返回 `true` 或 `false` 的比较或逻辑表达式。`statements-if-true` 代表当 `expression` 返回 `true`\
  \ 时你想让 JavaScript 运行的语句块，`statements-if-false` 代表当 `expression` 返回 `false` 时你想执行的语句块。\n\
  \n作为一个示例，考虑以下代码（查看 bk04ch04/example02.html）：\n\n```\nlet discountRate;\nif (currMonth\
  \ === \"December\") {\n  discountRate = 0.2;\n} else {\n  discountRate = 0.1;\n\
  }\nconst discountedPrice = regularPrice * (1 – discountRate);\n```\n\n这段代码计算物品的折后价格，折扣取决于当前月份是否为\
  \ 12 月。代码假设脚本之前设置了当前月份 (`currMonth`）和商品的原价 (`regularPrice`）。在声明 `discountRate` 变量后，`if…else`\
  \ 语句检查 `currMonth` 是否等于 12 月。如果是，将 `discountRate` 设置为 0.2；否则，将 `discountRate` 设置为\
  \ 0.1。最后，代码使用 `discountRate` 值计算 `discountedPrice`。\n\n![Tip](img/tip.png) 对每个块中的语句进行缩进（正如我在示例所示），`if…else`\
  \ 语句会易读得多。这种缩进让你能够轻松识别当存在 `true` 结果时将运行哪个块，以及当结果为 `false` 时将运行哪个块。我发现四个空格的缩进很好，但很多程序员更喜欢两个空格或制表符。\n\
  \n`if…else` 语句与我在第 4 本书 3 章中讨论的三元运算符 (`?:`) 非常相似。事实上，对于一一部分非常特定的 `if…else` 语句，两者是等价的。\n\
  \n`?:` 运算符评估一个比较表达式，如果表达式为 `true`，则返回一个值；如果为 `false`，则返回另一个值。例如，如果你有一个名为 `currentHour`\
  \ 的变量，它包含当天时间的小时部分，考虑以下语句：\n\n```\nlet greeting = currentHour < 12 ? \"Good morning!\"\
  \ : \"Good day!\";\n```\n\n\n\n\n\n如果 `currentHour` 小于 12，字符串 `\"Good morning!\"\
  ` 将存储在 `greeting` 变量中；否则，字符串 `\"Good day!\"` 将存储在该变量中。此语句的作用与以下 `if…else` 语句完全相同：\n\
  \n```javascript\nlet greeting;\n\nif (currentHour < 12) {\n  greeting = \"Good morning!\"\
  ;\n} else {\n  greeting = \"Good day!\";\n}\n```\n\n从输入的字符总数和使用的行数来看，三元运算符的版本显然更高效。因此，每当你发现自己只是测试一个条件是为了根据结果将内容存储在变量中，请使用三元运算符语句代替\
  \ `if…else`。\n\n### 做出多个决策\n\n`if…else` 控制结构只进行一次单一决策。`if` 部分计算单个逻辑结果并执行两个动作中的一个。然而，在许多情况下，在你决定采取哪种行动之前，需要进行多次决策。\n\
  \n例如，根据商品的总价和税率计算其税前价格，你需要将总价除以（税率加加 1）。在现实世界的 Web 开发中，开发者的工作之一就是确保你处理的数字是有意义的。对于税率来说，什么是有意义的？可能是大于等于\
  \ 0 且小于 1（即 100%）。对于代码中的任何税率值，这需要测试两个点，而 JavaScript 提供了多种方法来处理此类问题。\n\n#### 使用 AND\
  \ (&&) 和 OR (||) 运算符\n\n解决多决策问题的一种解决方案是在单个 `if` 语句中组合多个比较表达式。正如我在第四本书第 3 章中讨论的，你可以使用\
  \ JavaScript 的 AND (`&&`) 和 OR (`||`) 运算符来组合比较表达式。\n\n以下代码展示了一个使用 `&&` 运算符组合两个比较表达式的\
  \ `if` 语句示例（bk04ch04/example03.html）：\n\n```javascript\nif (taxRate >= 0 && tax\
  \ < 1) {\n  const retailPrice = totalPrice / (1 + taxRate);\n  document.write(retailPrice);\n\
  } else {\n  document.write(\"Please enter a tax rate between 0 and 1.\");\n}\n```\n\
  \n这里的关键在于 `if` 语句：\n\n`if (taxRate >= 0 && taxRate < 1);`\n\n这告诉浏览器，只有当 `taxRate`\
  \ 值大于或等于 0 且小于 1 时，才执行 true 块中的语句。如果其中任一个为 `false`（或者两者都为 `false`），浏览器将写入 false\
  \ 块中的消息。\n\n#### 串联多个 if 语句\n\n`if…else` 语句有第三种语法，允许你使用多块语句串联所需的任意逻辑测试（之所以被称为多块是因为它包含了多个\
  \ `if/else` 块）：\n\n```javascript\nif (expression1) {\n  statements-if-expression1-true\n\
  } else if (expression2) {\n  statements-if-expression2-true\n} etc.\nelse {\n  statements-if-false\n\
  }\n```\n\nJavaScript 首先测试 `expression1`。如果 `expression1` 返回 `true`，JavaScript 运行由\
  \ `statements-if-expression1-true` 表示的块并跳过其他所有内容。如果 `expression1` 返回 `false`，JavaScript\
  \ 接着测试 `expression2`。如果 `expression2` 返回 `true`，JavaScript 运行由 `statements-if-expression2-true`\
  \ 表示的块并跳过其他所有内容。否则，如果所有 `if` 测试都返回 `false`，JavaScript 运行由 `statements-if-false`\
  \ 表示的块。\n\n以下代码展示了一个串联了几个 `if` 语句的脚本（bk04ch04/example04.html）：\n\n```javascript\n\
  let greeting;\n\nif (currentHour < 12) {\n  greeting = \"Good morning!\";\n} else\
  \ if (currentHour < 18) {\n  greeting = \"Good afternoon!\";\n} else {\n  greeting\
  \ = \"Good evening!\";\n}\ndocument.write(greeting);\n```\n\n该代码假设在脚本之前的部分，当前小时值已存储在\
  \ `currentHour` 变量中。第一个 `if` 检查 `currentHour` 是否小于 12。如果是，字符串 `\"Good morning!\"\
  ` 将存储在 `greeting` 变量中；如果不是，下一个 `if` 检查 `currentHour` 是否小于 18（即小于下午 6:00）。如果是，则给\
  \ `greeting` 赋值字符串 `\"Good afternoon!\"`；否则，`greeting` 将赋值为 `\"Good evening\"`。\n\
  \n#### 使用 switch 语句\n\n使用 `if…else if` 进行多次测试是一种实用的技术——这是你经常会用 JavaScript 工具。然而，随着需要进行的测试数量的增加，它会迅速变得难以处理。对于两个或三个测试是可以的，但超过这个数字会让逻辑更难以追踪。\n\
  \n对于需要进行大量测试的情况（例如，四个或更多），JavaScript 的 `switch` 语句是更好的选择。其思想是在开头提供一个表达式，然后列出该表达式的一系列可能值。对于每个可能的结果：\n\
  \n```javascript\nswitch (expression) {\n  case value1:\n    statement1;\n    break;\n\
  \  case value2:\n    statement2;\n    break;\n  default:\n    default-statement;\n\
  }\n```\n\n如果你在 JavaScript 中大量处理日期，你的代码最终可能会计算每个月份有多少天，因此你需要构建如下自己的代码（bk04ch04/example05.html）：\n\
  \n```javascript\nlet daysInMonth;\n\nswitch (monthName) {\n  case \"January\":\n\
  \    daysInMonth = 31;\n    break;\n  case \"February\":\n    if (yearValue % 4\
  \ === 0) {\n      daysInMonth = 29;\n    } else {\n      daysInMonth = 28;\n   \
  \ }\n    break;\n  case \"March\":\n    daysInMonth = 31;\n    break;\n  case \"\
  April\":\n    daysInMonth = 30;\n    break;\n  case \"May\":\n    daysInMonth =\
  \ 31;\n    break;\n  case \"June\":\n    daysInMonth = 30;\n    break;\n  case \"\
  July\":\n    daysInMonth = 31;\n    break;\n  case \"August\":\n    daysInMonth\
  \ = 31;\n    break;\n  case \"September\":\n    daysInMonth = 30;\n    break;\n\
  \  case \"October\":\n    daysInMonth = 31;\n    break;\n  case \"November\":\n\
  \    daysInMonth = 30;\n    break;\n  case \"December\":\n    daysInMonth = 31;\n\
  \    break;\n}\n```\n\n\n\n\n\n![Technical stuff](img/technicalstuff.png) 时间极客们无疑会对我“如果一个年份能被\
  \ 4 整除就是闰年”的断言感到不满。事实上，这适用于 1901 年到 2099 年，这应该满足大多数人的需求。该公式对于 1900 年和 2100 年无效，因为这些年份虽然能被\
  \ 4 整除，但并不是闰年。通用规则是：如果一个年份能被 4 整除且不能被 100 整除，除非它也能被 400 整除，这就是闰年。\n\n### 理解代码循环\n\
  \n有些人会认为，程序员唯一的真正目标应该是完成工作。只要代码产生正确的结果或按正确的顺序执行正确的任务，其他一切都是多余的。也许如此，但真正的程序员知道，编程的真正目标不仅是完成工作，而且是以最高效率完成工作。高效的脚本运行速度更快，编码时间更短，而且通常（并非总是，但通常如此）更容易阅读和排除故障。\n\
  \n在编码中引入效率的最佳方法之一是避免重复造轮子。例如，考虑以下代码段：\n\n```javascript\nlet sum = 0;\nlet num =\
  \ prompt(\"Type a number:\", 1);\nsum += Number(num);\nnum = prompt(\"Type a number:\"\
  , 1);\nsum += Number(num);\nnum = prompt(\"Type a number:\", 1);\nsum += Number(num);\n\
  document.write(\"The total of your numbers is \" + sum);\n```\n\n这段代码首先声明了一个名为 `sum`\
  \ 的变量。代码提示用户输入一个数字（使用默认值为 `1` 的 `prompt` 方法），将其存储在变量 `num` 中，将该值加到 `sum` 上，然后重复这个“提示并求和”的例程两次。（注意我使用了\
  \ `Number` 函数，它确保了 `prompt` 返回的值被处理为数字而不是字符串。）最后，将三个数字之和显示给用户。\n\n这段代码不仅有点没用，而且处处散发着低效的气息，因为大部分代码由以下出现三次的两行组成：\n\
  \n```javascript\nnum = prompt(\"Type a number:\", 1);\nsum += Number(num);\n```\n\
  \n如果在代码中只写一次这两个语句，然后以某种方式让 JavaScript 按照需要重复这些语句，不是会更高效吗？\n\n是的，确实会更高效。好消息是，这不仅可以做到，JavaScript\
  \ 还提供了多种不同的方法来执行这种所谓的“循环”。我将在本章的剩余部分中研究这些这些方法。\n\n### 使用 while 循环\n\nJavaScript\
  \ 循环结构中最简单直观的是 `while` 循环，它使用以下语法：\n\n```javascript\nwhile (expression) {\nstatements\n\
  }\n```\n\n在这里，`expression` 是一个比较或逻辑表达式（即返回 `true` 或 `false` 的表达式），只要它返回 `true`，就会告诉\
  \ JavaScript 继续执行块内的 `statements`。\n\n从本质上，JavaScript 对 `while` 循环的解释如下：“好的，只要 `expression`\
  \ 保持为 `true`，我就一直运行循环体语句，但一旦 `expression` 变成 `false`，我就离开那里。”\n\n下面是 `while` 循环工作原理的详细说明：\n\
  \n1. 求值 `while` 语句中的 `expression`。\n2. 如果 `expression` 为 `true`，继续执行第 3 步；如果 `expression`\
  \ 为 `false`，则跳到第 5 步。\n3. 执行块中的每个语句。\n4. 返回到第 1 步。\n5. 退出循环（即执行 `while` 块之后的下一条语句）。\n\
  \n以下代码演示了如何使用 `while` 重写上一节所示的低效代码（bk04ch04/example06.html）：\n\n```javascript\n\
  let sum = 0;\nlet counter = 1;\nlet num;\nwhile (counter <= 3) {\n  num = prompt(\"\
  Type a number:\", 1);\n  sum += Number(num);\n  counter += 1;\n}\ndocument.write(\"\
  The total of your numbers is \" + sum);\n```\n\n为了控制循环，代码声明了一个名为 `counter` 的变量并将其初始化为\
  \ `1`，这意味着表达式 `counter <= 3` 为 `true`，因此代码进入块，执行提示并求和的操作，然后增加 `counter`。这个过程会一直重复到循环第三次结束，此时\
  \ `counter` 增加到 `4`，此时表达式 `counter <= 3` 变为 `false`，循环结束。\n\n![Tip](img/tip.png)\
  \ 为了让你的循环代码具有最大的可读性，始终对 `while` 块中的每个语句使用两个或四个空格的缩进。这同样适用于本章稍后提到的 `for` 和 `do…while`\
  \ 循环。\n\n当你确切知道要运行循环次数时，`while` 语句并不是最好的循环选择。对于这种情况，请使用下一节介绍的 `for` 语句。`while` 语句的最佳用法是脚本具有某些自然发生的条件，你可以将其转换为比较表达式。一个很好的例子是当你提示用户输入值时。你通常希望一直提示用户，直到他们点击“取消”按钮。设置这种逻辑最简单的方法是将\
  \ `prompt` 包含在 `while` 循环内部，所示（bk04ch04/example07.html）：\n\n```javascript\nlet sum\
  \ = 0;\nlet num = prompt(\"Type a number or click Cancel:\", 1);\nwhile (num !=\
  \ null) {\n  sum += Number(num);\n  num = prompt(\"Type a number or click Cancel:\"\
  , 1);\n}\ndocument.write(\"The total of your numbers is \" + sum);\n```\n\n第一个 `prompt`\
  \ 方法显示一个类似于图 4-1 所示的对话框来获取初始值，并存储在变量 `num` 中。\n\n![Screenshot of set up your while\
  \ expression so that the prompting stops when the user clicks the Cancel button.](img/9781394164684-fg040401.png)\n\
  \nFIGURE 4-1: 设置你的 while 表达式，以便在用户点击取消按钮时停止提示。\n\n然后，`while` 语句检查以下表达式：\n\n`num\
  \ != null`\n\n这里会有两种情况：\n\n- 如果用户输入数字，此表达式返回 `true`，循环继续。在这种情况下，`num` 的值被加到 `sum`\
  \ 中，并提示下一个数字。\n- 如果用户点击取消，`prompt` 返回 `null`，表达式变为 `false`，循环停止。\n\n### 使用 for 循环\n\
  \n尽管 `while` 是最直观的循环，但最常用的类型是 `for` 循环。当你考虑到（稍后就会看到）`for` 循环的语法比 `while` 循环复杂一点时，这一事实可能会让人惊讶。然而，`for`\
  \ 循环擅长一件事：在你确切知道要重复一组语句次数时进行循环。这在所有类型的编程中都极其常见，难怪 `for` 在脚本中如此常用。\n\n典型的 `for` 循环结构如下：\n\
  \n```javascript\nfor (let counter = start; counterExpression; counterUpdate) {\n\
  \  statements\n}\n```\n\n这里有很多内容，所以我逐一说明：\n\n- `counter`: 作为循环计数器的数值变量。循环计数器是一个记录过程循环次数的数字。（注意，如果这是你第一次在脚本中使用该变量，则需要包含\
  \ `let`。）\n- `start`: `counter` 的初始值。这个值通常是 1，但你可以根据脚本的需要使用任何值。\n- `counterExpression`:\
  \ 决定循环次数的比较或逻辑表达式。该表达式通常将 `counter` 的当前值与某个最大值进行比较。\n- `counterUpdate`: 改变 `counter`\
  \ 的表达式。该表达式在每次循环后都会求值。大多数情况下，你会使用表达式 `counter += 1` 来增加计数器的值。\n\n\n\n\n\n*   `statements`:\
  \ 你希望 JavaScript 在每次循环时执行的语句。\n\n当 JavaScript 遇到 `for` 语句时，它会切换到 for 循环模式并遵循以下七个步骤：\n\
  \n1.  将 `counter` 设置为 `start`。\n2.  评估 `for` 语句中的 `counterExpression`。\n3.  如果 `counterExpression`\
  \ 为 `true`，则继续执行第 4 步；如果 `counterExpression` 为 `false`，则跳转到第 7 步。\n4.  执行块中的每个语句。\n\
  5.  使用 `counterUpdate` 增加（或进行任何操作）`counter`。\n6.  返回第 2 步。\n7.  退出循环（即执行 `for` 块之后的下一个语句）。\n\
  \n例如，以下代码展示了如何使用 `for` 重写本章之前所示的高效代码（bk04ch04/example08.html）：\n\n```\nlet sum =\
  \ 0;\nlet num;\nfor (let counter = 1; counter <= 3; counter += 1) {\n    num = prompt(\"\
  Type a number:\", 1);\n    sum += Number(num);\n}\ndocument.write(\"The total of\
  \ your numbers is \" + sum);\n```\n\n这是目前最高效的版本，因为 `counter` 变量的声明、初始化和递增均在 `for`\
  \ 语句内部完成。\n\n![记住](img/remember.png) 为了让脚本中声明的变量尽可能少，请始终尝试在所有的 `for` 循环计数器中使用相同的名称。在编程中，字母\
  \ `i` 到 `n` 通常用于计数器。为了更加清晰，你可能更喜欢使用完整的单词，例如 `count` 或 `counter`。\n\n![技术细节](img/technicalstuff.png)\
  \ 这一点并不明显，但你在 `for` 语句中声明任何变量（特别是计数器变量）的作用范围仅限于 `for` 块。\n\n这里有一个稍微复杂一点例子（bk04ch04/example09.html）：\n\
  \n```\nlet sum = 0;\nfor (let counter = 1; counter < 4; counter += 1) {\n    let\
  \ num;\n    let ordinal;\n    switch (counter) {\n        case 1:\n            ordinal\
  \ = \"first\";\n            break;\n        case 2:\n            ordinal = \"second\"\
  ;\n            break;\n        case 3:\n            ordinal = \"third\";\n     \
  \       break;\n    }\n    num = prompt(\"Enter the \" + ordinal + \" number:\"\
  , 1);\n    sum += Number(num);\n}\ndocument.write(\"The average is \" + sum / 3);\n\
  ```\n\n该脚本目的是向用户询问三个数字，然后显示这些值的平均值。`for` 语句被设置为循环三次（注意 `counter < 4` 等同于 `counter\
  \ <= 3`）。循环块的第一件事是使用 `switch` 来确定 `ordinal` 变量的值：如果 `counter` 为 1，则 `ordinal` 设置为\
  \ `\"first\"`；如果 `counter` 为 2，`ordinal` 变为 `\"second\"`；依此类推。这些值使得脚本能够在每次循环时自定义\
  \ `prompt` 消息（请查看图 4-2）。每次循环中，用户输入一个数字，该值会被加到 `sum` 变量中。当循环退出时，将显示平均值。\n\n![此脚本使用计数器变量的当前值自定义提示消息的截图](img/9781394164684-fg040402.png)\n\
  \n图 4-2： 此脚本使用 `counter` 变量的当前值来自定义提示消息。\n\n也可以使用 `for` 进行倒计时。你通过使用减法赋值运算符代替加法赋值运算符来实现：\n\
  \n```\nfor (let counter = start; counterExpression; counter -= 1) {\n    statements\n\
  }\n```\n\n在这种情况下，你必须将 `counter` 变量初始化为想要作为循环计数器的最大值，并使用 `counterExpression` 将 `counter`\
  \ 的值与结束循环所需的最小值比较。\n\n在下面的示例（bk04ch04/example10.html）中，我使用了一个递减计数器让用户按倒序对他们前三个 CSS\
  \ 颜色进行排名（关于使用颜色的详情请参见第 3 本第 6 章）：\n\n```\nfor (let rank = 3; rank >= 1; rank -=\
  \ 1) {\n    let ordinal;\n    let color;\n    switch (rank) {\n        case 1:\n\
  \            ordinal = \"first\";\n            break;\n        case 2:\n       \
  \     ordinal = \"second\";\n            break;\n        case 3:\n            ordinal\
  \ = \"third\";\n            break;\n    }\n    color = prompt(\"What is your \"\
  \ + ordinal + \"-favorite CSS color?\", \"\");\n    document.write(rank + \". \"\
  \ + color + \"<br>\");\n}\n```\n\n`for` 循环通过将 `rank` 变量从 `3` 递减到 `1` 来运行。循环的每次迭代都会提示用户输入喜欢的\
  \ CSS 颜色，该颜色会被写入页面，并使用 `rank` 的当前值创建一个倒序列表，如图 4-3 所示。\n\n![rank 变量的递减值用于创建倒序列表的截图](img/9781394164684-fg040403.png)\n\
  \n图 4-3： `rank` 变量的递减值用于创建倒序列表。\n\n![提示](img/tip.png) `for` 循环计数器没有必须递增或递减。你实际上可以使用任何表达式来调整循环计数器的值。例如，假设你想让\n\
  \n\n\n\n\n```javascript\nnum = prompt(\"Type a number; when you're done, click Cancel:\"\
  , 1);\nsum += Number(num);\n}\nwhile (num !== null || sum === 0);\ndocument.write(\"\
  The total of your numbers is \" + sum);\n```\n\n这段代码与我在本节早些展示的 `while` 代码非常相似。唯一的变化是\
  \ `while` 语句及其表达式被移动到了语句块之后，这样在评估表达式之前，循环必须执行一次。\n\n### 控制循环执行\n\n执行（Controlling\
  \ Loop Execution）\n\n大多数循环都会按照自然流程运行，然后程序继续执行。然而，有时你可能想要提前退出循环，或者跳过某些语句并继续下一次循环。你可以分别使用\
  \ `break` 和 `continue` 语句来处理每种情况。\n\n#### 使用 break 语句退出循环\n\n当你的循环遇到某个值或条件，导致剩余语句无法正常执行，或者满足了循环试图实现的目标时，你就使用\
  \ `break`。以下代码通过一个简单的示例（`bk04ch04/example12.html`）演示了 `break`：\n\n```javascript\n\
  let sum = 0;\nfor (let counter = 1; counter <= 3; counter += 1) {\n    let num =\
  \ prompt(\"Type a positive number:\", 1);\n    if (num < 0) {\n        sum = 0;\n\
  \        break;\n    }\n    sum += Number(num);\n}\nif (sum > 0) {\n    document.write(\"\
  The average of your numbers is \" + sum / 3);\n}\n```\n\n此脚本设置了一个 `for` 循环来提示用户输入正数。对于本节而言，关键代码是\
  \ `if` 测试：\n\n```javascript\nif (num < 0) {\n    sum = 0;\n    break;\n}\n```\n\n\
  如果用户输入负数，变量 `sum` 将被重置为 `0`（以防止在脚本稍后的部分将消息写入页面）。此外，`break` 语句告诉 JavaScript 彻底退出循环。\n\
  \n这是一个更复杂的示例（`bk04ch04/example13.html`）：\n\n```javascript\nconst numberToGuess =\
  \ Math.ceil(Math.random() * 10);\nlet promptMessage = \"Guess a number between 1\
  \ and 10:\";\nlet totalGuesses = 1;\ndo {\n    const guess = Number(prompt(promptMessage,\
  \ \"\"));\n    if (guess === 0) {\n        break;\n    } else if (guess === numberToGuess)\
  \ {\n        document.write (\"You guessed it in \" + totalGuesses +\n        (totalGuesses\
  \ === 1 ? \" try.\" : \" tries.\"));\n        break;\n    } else if (guess < numberToGuess)\
  \ {\n        promptMessage = \"Sorry, your guess was too low. Try again:\";\n  \
  \  } else {\n        promptMessage = \"Sorry, your guess was too high. Try again:\"\
  ;\n    }\n    totalGuesses += 1;\n}\nwhile (true);\n```\n\n此脚本是一个游戏，其中生成一个 1 到 10\
  \ 之间的数字，用户必须尝试猜出它。前四行设置了一些变量。这里让人困惑的是 `numberToGuess` 变量的表达式。该表达式使用了 `Math` 对象的几个方法，我在第\
  \ 4 卷第 8 章 中讨论过。目前，只需要说该表达式会生成一个 1 到 10（包含边界）之间的随机整数。\n\n然后设置了一个具有如下结构的 `do…while`\
  \ 循环：\n\n```javascript\ndo {\n    // statements\n}\nwhile (true);\n```\n\n这告诉 JavaScript\
  \ 在不考虑比较表达式的情况下运行循环。正如你将学到的，循环本身将通过使用 `break` 语句来处理退出循环。\n\n接下来，提示用户输入猜测，并将其存储在\
  \ `guess` 变量中。脚本随后检查 `guess` 是否等于 `0`，这意味着用户点击了“取消”（点击“取消”返回 `null`，但 `Number` 函数会将\
  \ `null` 转换为 `0`）。如果是，则使用 `break` 通过退出循环来停止游戏：\n\n```javascript\nconst guess = Number(prompt(promptMessage,\"\
  \"));\nif (guess === 0) {\n    break;\n}\n```\n\n否则，一系列 `if` 语句将对猜的数字与实际数字进行比较。第一个测试检查它们是否相同。如果是，则将消息写入页面，然后通过另一个\
  \ `break` 语句退出循环，因为游戏已经结束：\n\n```javascript\nelse if (guess === numberToGuess) {\n\
  \    document.write(\"You guessed it in \" + totalGuesses +\n    (totalGuesses ===\
  \ 1 ? \" try.\" : \" tries.\"));\n    break;\n}\n```\n\n![提示](img/tip.png) 注意 `document.write`\
  \ 语句包含一个三元运算符表达式：\n\n```javascript\ntotalGuesses === 1 ? \" try.\" : \" tries.\"\
  \n```\n\n这说明了一种极其常见的编程情况：你必须向用户显示一个单词，但该单词根据某些变量或表达式的值，可能是单数也可能是复数。在这种情况下，如果 `totalGuesses`\
  \ 等于 1，你就想显示单词 `try`（或 `tries`）。\n\n\n\n\n\n如果你遇到了无限循环且不确定原因，可以在循环语句块内插入一个或多个 `debugger`\
  \ 和 `console.log` 语句，以便你能够逐条语句执行脚本，并显示计数器或比较变量的当前值。（想知道“debugger”和“console.log”到底是什么鬼鬼吗？我会在第\
  \ 4 卷第 10 章中介绍它们。）这个过程能让你了解变量在每次循环执行时发生了什么变化。\n\n## 第 5 章\n\n# 驾驭函数的力量\n\n### 本章内容\n\
  \n*   了解 JavaScript 函数\n*   创建和使用自定义函数\n*   传递和返回函数值\n*   使用匿名函数和箭头函数\n*   深入理解变量作用域\n\
  *   理解递归函数\n\n*简化能力意味着消除不必要的因素，以便必要的因素得以表达。*\n—HANS HOFMANN\n\n在早之前的第 1 卷第 1 章中，我介绍了两种方法：`alert()`\
  \ 和 `document.write()`。虽然它们不是 JavaScript 标准的一部分（它们来自不同的 Web API；请参阅第 4 卷第 6 章），但网络浏览器提供了它们，以便你可以在\
  \ JavaScript 代码中使用它们。`alert()` 和 `document.write()` 都是开箱即用功能的示例，你无需了解它们的内部工作原理即可使用。\n\
  \n当你将所有内置的 JavaScript 特性与所有 Web API 结合时，你将拥有数百种操作，执行的任务涵盖了从不可或缺到晦涩的各种类型。这听起来似乎涵盖了代码可能采取的所有操作，但实际上还遠未如此。除了简单的脚本外，几乎每个\
  \ JavaScript 项目都需要一个或多个（通常是更多）任务或计算，而这些任务并不属于 JavaScript 语言或任何 Web API。程序员该怎么办？你只能卷起袖子，编写自己的代码来完成任务或运行计算。\n\
  \n本章将向你展示如何创建此类自制的代码。在接下来的页面中，你将探索自定义函数这个强大且无限实用的领域，在那里，你可以构建出可重用的代码，执行原生 JavaScript\
  \ 无法完成的任务。\n\n### 什么是函数？\n\n`function` 是一组 JavaScript 语句，它们与脚本的其他部分分离，并执行指定的任务。（从技术上讲，一个函数可以执行任何数量的任务，但作为一条通用规则，最好让每个函数专注于一个特定的任务。）当你的脚本需要执行该任务时，你告诉它运行——或者用术语说*执行*（execute）——`function`。\n\
  \n函数对于那些你需要精确控制特定任务何时发生（如果发生的话）的情况也非常有用。如果你只是在页面的 `<script>` 和 `</script>` 标签之间输入一些语句，浏览器会在页面加载时自动运行这些语句。然而，函数内部的语句不会被浏览器自动执行。（实际上该规则有一些例外，我会在本章稍后的部分简要提到。）相反，除非你的代码要求运行函数，或者发生了某些事件（例如用户点击按钮，且你已经设置了页面以响应该事件运行函数），否则函数将不会执行。\n\
  \n### 的结构\n\n函数的基本结构如下：\n\n```\nfunction functionName([arguments]) {\n    JavaScript\
  \ statements\n}\n```\n\n以下是函数各个部分的总结：\n\n*   `function`：标识随随其后的代码块为一个函数。\n*   `functionName`：函数的唯一名称。我在第\
  \ 4 卷第 2 章中为变量概述的命名规则和指南也适用于函数名。\n*   `arguments`：传递给函数的一个或多个值，并在函数内部充当变量。参数（有时称为\
  \ *parameters*）通常是函数用作其任务或计算的原材料的一个或多个值。你始终在函数名后的括号内输入参数，并用逗号分隔多个参数。如果你不使用参数，也必须在函数名后包含括号。\n\
  *   `JavaScript statements`：执行函数任务或计算的代码。\n\n注意示例中的 `JavaScript statements` 这一行相对于左边距略有缩进。这是一种标准且高度推荐的编程习惯，因为它让你的代码更易读。此示例缩进了四个空格，足以完成工作但并不过度。有些程序员使用两个空格，另一些人则使用单个制表符缩进。\n\
  \n同样，注意大括号（`{` 和 `}`）的使用。它们将函数语句封装在一个块中，这告诉你（以及浏览器）函数代码开始和结束的位置。大括号出现的位置只有两条规则：\n\
  \n*   左括号必须出现在函数括号之后、第一个函数语句之前。\n*   右括号必须出现在最后一个函数语句之后。\n\n并没有规定大括号必须出现在何切位置的硬性规定。之前的函数语法中使用的位置是传统的，但如果你愿意，也可以自由尝试其他位置。\n\
  \n```\nfunction functionName([arguments]) {\n    JavaScript statements\n}\n```\n\
  \n### 你把函数放在哪里？\n\n对于大多数应用程序，将函数放在哪里并不重要，只要它们位于 `<script>` 块内即可。然而，函数最常见的用途之一是在事件被触发时处理它们。特定的事件可能会在页面加载时触发，如果这种情况在浏览器解析相应函数之前发生，你可能会得到奇怪的结果或错误。为了防止这种情况，良好的做法是将包含所有函数的脚本放在页面的头部部分（或放在\
  \ JavaScript 文件中）。\n\n另请注意，你可以在单个 `<script>` 块中添加任意数量的函数，但要确保每个函数都有唯一的名称。事实上，页面中存在或被页面引用的所有函数都必须具有唯一名称。\n\
  \n### 调用函数\n\n在定义函数之后，你最终需要告诉浏览器执行——或*调用*（call）——该函数。此此三种主要方法：\n\n*   当浏览器解析 `<script>`\
  \ 标签时\n*   在页面加载后\n*   响应事件，例如用户点击按钮\n\n接下来的三个章节将涵盖每种这种情况。\n\n#### 在解析 <script>\
  \ 标签时调用函数\n\n调用函数最简单的方法是在你的脚本中包含一个仅由函数名组成的语句，后面跟着括号（假设你的函数暂时不使用参数）。以下代码（查看此书示例文件中的\
  \ bk04ch05/exaample01.html）提供了一个示例。（我列出了整个页面，以便向你展示函数以及调用它的语句出现在页面代码中的位置。）\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>在解析\
  \ <script> 标签时调用函数</title>\n<script>\nfunction displayGreeting() {\n    const currentHour\
  \ = new Date().getHours();\n    if (currentHour < 12) {\n        console.log(\"\
  Good morning!\");\n    } else {\n        console.log(\"Good day!\");\n    }\n}\n\
  displayGreeting();\n</script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\n\n\n\n\
  \n`<script>` 标签包含一个名为 `displayGreeting` 的函数，它确定当前的小时，然后根据当前是否为早晨向控制台写入问候（参见图 5-1）。该函数由紧随函数之后的\
  \ `displayGreeting` 语句调用。\n\n![记住](img/remember.png) 控制台是每个网页浏览器开发者工具的一部分。使用控制台显示消息（如本节示例所示）、动态运行\
  \ JavaScript 代码并查找脚本错误信息。你将在第 4 本的第 10 章中学习控制台的所有知识。\n\n![提示](img/tip.png) 在大多数网页浏览器中显示控制台，请右键点击网页，点击“检查”（在\
  \ Windows 上按 Ctrl+Shift+I，或在 macOS 上按 Option+⌘  +I），然后点击“控制台”（Console）选项卡。\n\n![解析\
  \ <script> 标签时调用函数的示例截图](img/9781394164684-fg040501.png)\n\n图 5-1: 解析 `<script>`\
  \ 标签时调用函数的示例。\n\n#### 在页面加载后调用函数\n\n如果你的函数引用了页面元素，那么从页面的 `head` 部分内部调用该函数将不起作用，因为当浏览器解析脚本时，页面的其他部分尚未加载，因此你的元素引用将失败。\n\
  \n为了解决这个问题，请在 `body` 部分的末尾、即闭合的 `</body>` 标签之前放置另一个 `<script>` 标签，如下所示（参见 bk04ch05/example02.html）：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  >\n  <title>在页面加载后调用函数</title>\n  <script>\n    function makeBackgroundRed() {\n\
  \      document.body.style.backgroundColor = \"red\";\n      console.log(\"The background\
  \ is now red.\");\n    }\n  </script>\n</head>\n<body>\n  <!-- 其他 body 元素放在这里 -->\n\
  \  <script>\n    makeBackgroundRed();\n  </script>\n</body>\n</html>\n```\n\n`makeBackgroundRed`\
  \ 函数做了两件事：它使用 `document.body.style.backgroundColor` 将 `body` 元素的背景颜色更改为红色，并使用 `console.log`\
  \ 在控制台上写入该效果的消息。\n\n在函数中，`document.body` 是 `body` 元素的引用，它在页面完全加载之前是不“存在”的。这意味着如果你尝试用初始脚本调用该函数，将会得到错误。为了正确执行该函数，在\
  \ `body` 元素的底部会出现第二个 `<script>` 标签，该脚本通过以下语句调用该函数：\n\n```javascript\nmakeBackgroundRed();\n\
  ```\n\n当浏览器执行该语句时，`body` 元素已经存在，因此函数可以无错误地运行（参见图 5-2）。\n\n![在页面加载后调用函数的示例截图](img/9781394164684-fg040502.png)\n\
  \n图 5-2: 在页面加载后调用函数的示例。\n\n#### 响应事件调用函数\n\nJavaScript 函数调用的常用方式之一是响应某些事件。事件是一个如此重要的主题，以至于我在第\
  \ 4 本的第 6 章中专门大量介绍了它们。现在，请看一个相对简单的应用程序：当用户点击按钮时执行函数。以下代码展示了实现此的一种方法（bk04ch05/example03.html）：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  >\n  <title>响应事件调用函数</title>\n  <script>\n    function makeBackgroundRed() {\n \
  \     document.body.style.backgroundColor= \"red\";\n    }\n    function makeBackgroundWhite()\
  \ {\n      document.body.style.backgroundColor= \"white\";\n    }\n  </script>\n\
  </head>\n<body>\n  <button onclick=\"makeBackgroundRed()\">\n    Make Background\
  \ Red\n  </button>\n  <button onclick=\"makeBackgroundWhite()\">\n    Make Background\
  \ White\n  </button>\n</body>\n</html>\n```\n\n我在这里所做的是在脚本中放置两个函数：`makeBackgroundRed`\
  \ 像之前一样将页面背景变为红色，而 `makeBackgroundWhite` 将背景颜色改回白色。\n\n按钮是标准的 HTML `button` 元素（参见图\
  \ 5-3），每个按钮都包含 `onclick` 属性。该属性为事件定义了一个*处理器*（handler）——即用户点击按钮时发生事件要执行的函数。例如，考虑第一个按钮：\n\
  \n```html\n<button onclick=\"makeBackgroundRed()\">\n```\n\n这里的 `onclick` 属性实际上是在说：“当有人点击此按钮时，调用名为\
  \ `makeBackgroundRed` 的函数。”\n\n![警告](img/warning.png) 我在这里使用的示例有点过时，因为它在 HTML 标签内部定义了事件处理程序，这在现在被认为是不良的编程实践。现代的方法是使用\
  \ JavaScript 设置事件监听器。我将在本章稍后的部分向你展示使用事件监听器的示例修订版本（即“理解匿名函数”章节）。我将在第 4 本的第 6 章中详细介绍事件监听器。\n\
  \n![响应事件调用函数的示例截图](img/9781394164684-fg040503.png)\n\n图 5-3: 响应事件调用函数的示例。\n\n###\
  \ 向函数传递值\n\n使用函数的主要原因之一是控制某些 JavaScript 代码段执行的时机。例如，上一节讨论了如何方便地使用函数来设置使得代码在用户点击按钮之前不运行。\n\
  \n然而，使用函数的另一个主要原因是避免不必要的重复代码。为了理解我的意思，考虑上一节中的两个函数：\n\n```javascript\nfunction makeBackgroundRed()\
  \ {\n  document.body.style.backgroundColor= \"red\";\n}\nfunction makeBackgroundWhite()\
  \ {\n  document.body.style.backgroundColor= \"white\";\n}\n```\n\n这些函数执行相同的任务——更改背景颜色——唯一的区别在于一个是改为红色，另一个改为白色。当你发现两个多个执行相同任务的函数时，你就知道代码效率很低。\n\
  \n那么如何让代码更高效呢？这就是前面提到的参数（arguments）用用场。*参数*是“发送”到函数的值（在编程术语中称为*传递*）。参数的作用就像变量一样，它会自动存储所发送的值。\n\
  \n#### 向函数传递单个值\n\n作为一个示例，你可以将之前的两个函数合并为一个函数，并将颜色值作为参数。这里有一个执行此操作的新函数：\n\n```javascript\n\
  function changeBackgroundColor(newColor) {\n  document.body.style.backgroundColor\
  \ = newColor;\n}\n```\n\n参数名为 `newColor`，并位于函数名后的括号内。JavaScript 会自动声明 `newColor`\
  \ 为变量，因此你不需要单独的 `let` 或 `const` 语句。然后函数使用 `newColor` 值更改背景颜色。那么如何向函数传递值呢？以下代码展示了一个实现此操作的文件（bk04ch05/example04.html）：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  >\n  <title>向函数传递单个值</title>\n  <script>\n    function changeBackgroundColor(newColor)\
  \ {\n      document.body.style.backgroundColor = newColor;\n    }\n  </script>\n\
  </head>\n<body>\n  <button onclick=\"changeBackgroundColor('red')\">\n    Make Background\
  \ Red\n  </button>\n  <button onclick=\"changeBackgroundColor('white')\">\n    Make\
  \ Background White\n  </button>\n</body>\n</html>\n```\n\n这里的关键是出现在两个 `<button>`\
  \ 标签中的 `onclick` 属性。例如：\n\n\n\n\n\n```\nonclick=\"changeBackgroundColor('red')\"\
  \n```\n\n字符串 `'red'` 被插入到函数名后的括号中，这样该值就会传递给函数本身。另一个按钮传递了值 `'white'`，函数的结果也随之改变。\n\
  \n![Warning](img/warning.png) 在示例代码的两个 `onclick` 属性中，请注意传递给函数的数值被单引号（'）括起来。这是必要的，因为\
  \ `onclick` 的值作为一个整体是用双引号（\"）括的。\n\n#### 向函数传递多个值\n\n对于更复杂的函数，你可能需要使用多个参数，以便传递不同类型的值。如果你使用多个参数，请用逗号将每个参数隔开，如下：\n\
  \n```javascript\nfunction changeColors(newBackColor, newForeColor) {\n  document.body.style.backgroundColor\
  \ = newBackColor;\n  document.body.style.color = newForeColor;\n}\n```\n\n在这个函数中，`document.body.style.color`\
  \ 语句改变前景颜色（即页面文本的颜色）。以下代码显示了一个修改后的页面，其中按钮向函数传递了两个值（bk04ch05/example05.html）：\n\n\
  ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  >\n  <title>Passing multiple values to a function</title>\n  <script>\n    function\
  \ changeColors(newBackColor, newForeColor) {\n      document.body.style.backgroundColor\
  \ = newBackColor;\n      document.body.style.color = newForeColor;\n    }\n  </script>\n\
  </head>\n<body>\n  <h1>Passing Multiple Values to a Function</h1>\n  <button onclick=\"\
  changeColors('red', 'white')\">\n    Red Background, White Text\n  </button>\n \
  \ <button onclick=\"changeColors('white', 'red')\">\n    White Background, Red Text\n\
  \  </button>\n</body>\n</html>\n```\n\n![Warning](img/warning.png) 如果你定义了一个具有多个参数的函数，你必须始终为该函数的每个参数传递值。如果不这样做，传递的将是值”\
  \ `undefined`，这可能会导致问题。\n\n![Technical stuff](img/technicalstuff.png) 如果你使用变量向函数传递数据，发送的是该变量的当前值，而不是变量本身。因此，如果你在函数内部更改参数的值，原始变量的值就不会改变。这里有一个例子：\n\
  \n```javascript\nlet passThis = 10;\nfunction sendMe(acceptThis) {\n  acceptThis\
  \ = 5;\n}\nsendMe(passThis);\nconsole.log(passThis);\n```\n\n变量 `passThis` 的初始值为\
  \ `10`。函数 `sendMe` 定义为接受一个名为 `acceptThis` 的参数，并将该参数的值改为 `5`。调用 `sendMe` 时将 `passThis`\
  \ 变量的值传递给它。然后 `console.log` 语句显示 `passThis` 的值。如果你运行这段代码，显示的值将是 `10`，即 `passThis`\
  \ 的原始值。换句话说，在函数内部更改 `acceptThis` 的值对 `passThis` 变量的值没有影响。\n\n#### 使参数变为可选\n\n在你的大多数函数中，参数是必须的，如果在调用函数时没有包含所有参数，函数将以某种方式失败。然而，将参数设为可选并不罕见。你的函数可能仍需要某种值来产生正确的结果，但你可以指定一个默认值，以便在函数调用未包含该参数时使用。\n\
  \n例如，考虑以下计算小费的函数：\n\n```javascript\nfunction calculateTip(preTip, tipPercent) {\n\
  \  const tipResult = preTip * tipPercent;\n  return tipResult;\n}\n```\n\n这里有一个调用示例：\n\
  \n```javascript\ncalculateTip(100, 0.15);\n```\n\n如果你通常给 15% 的小费，如果不需要在每次调用调用时都指定\
  \ `tipPercent` 参数，就太好了。你可以这样设置它——即让 `tipPercent` 参数变为可选——通过为 `tipPercent` 参数设置一个默认值，如下：\n\
  \n```javascript\nfunction calculateTip(preTip, tipPercent = 0.15) {\n  const tipResult\
  \ = preTip * tipPercent;\n  return tipResult;\n}\n```\n\n现在你可以这样调用此函数：\n\n```javascript\n\
  calculateTip(100);\n```\n\nJavaScript 注意到缺少了 `tipPercent` 参数，因此它在计算时使用了 `0.15` 作为默认值。\n\
  \n![Tip](img/tip.png) 如果你的函数有多个可选参数，在调用函数时如何跳过中间的一个参数呢？问得好！这是一个此类函数的例子，其中第二个和三个参数是可选的：\n\
  \n```javascript\nfunction addEmUp(argA, argB = 10, argC = 15) {\n  return argA +\
  \ argB + argC;\n}\n```\n\n如何在函数调用中仅跳过第二个参数？你只需传递值 `undefined`，如下：\n\n```javascript\n\
  addEmUp(100, undefined, 200);\n```\n\n![Remember](img/remember.png) 指定默认值以使函数参数可选是\
  \ ES6 (ECMAScript 2015) 的特性。\n\n#### 从函数返回返回值\n\n到目前为止，我已经概述了使用函数的两个主要优势：\n\n* \
  \  可以使用它们来控制代码的执行时机。\n*   可以使用它们来合并重复的代码。\n\n函数带来的第三个主要好处是，你可以执行计算并返回结果。例如，这里有一个计算小费的函数（bk04ch05/example05.html）：\n\
  \n```javascript\nfunction calculateTip(preTip, tipPercent) {\n  const tipResult\
  \ = preTip * tipPercent;\n  return tipResult;\n}\n```\n\n`const preTipTotal = 100.00;`\n\
  `const tipPercentage = 0.15;`\n`const tipCost = calculateTip(preTipTotal, tipPercentage);`\n\
  `const totalBill = preTipTotal + tipCost;`\n`document.write(\"Your total bill is\
  \ $\" + totalBill);`\n\n函数 `calculateTip` 接收两个参数：`preTip` 是账单总额，`tipPercent` 是用于计算的百分比。该函数声明了一个变量\
  \ `tipResult` 并使用它来存储计算结果。这个例子的关键在于函数的第二行：\n\n```javascript\nreturn tipResult;\n\
  ```\n\n`return` 语句是 JavaScript 将值传回调用函数语句的方式。该语句位于函数之后：\n\n```javascript\ntipCost\
  \ = calculateTip(preTipTotal, tipPercentage);\n```\n\n该语句首先将 `preTipTotal` 的值（在脚本早些时候初始化为\
  \ `100.00`）和 `tipPercentage`（早些时候初始化为 `0.15`）传递给 `calculateTip` 函数。当该函数返回结果时，整个表达式\
  \ `calculateTip(preTipTotal, tipPercentage)` 会被该结果替换，这意味着它被存储在 `tipCost` 变量中。\n\n\
  #### 理解匿名函数\n\n让我们再次看本章早些前的函数语法：\n\n```javascript\nfunction functionName(arguments)\
  \ {\n  // statements\n}\n```\n\n这种版本的函数语法创建了一个所谓的*具名函数*，因为——你猜得没错——这个函数有一个名字。\n\n\
  然而，创建一个没有名字的函数也是可能的：\n\n```javascript\nfunction (arguments) {\n  // statements\n\
  }\n```\n\n这种函数语法创建了一个所谓的*匿名函数*，因为——没错——这个函数没有名字。\n\n\n\n\n\n##### 为什么要使用匿名函数？嗯，首先，如果你不想用，就不用。其次，使用匿名函数的主要原因是在不需要的时候避免创建命名对象。每个大型\
  \ Web 项目都有一个巨大的 `namespace`（命名空间），指的是你分配给变量和函数等内容的标识符完整集合。命名空间越大，发生 `namespace collision`（命名空间冲突）的可能性就越大，即你为两个不同的事物使用了相同的标识符。坏消息是！\n\
  \n![记住](img/remember.png) 匿名函数是在 ES6 中引入的，如果你需要支持非常旧的浏览器（例如 Internet Explorer 11），请不要使用它们。\n\
  \n如果你有一个在项目中只使用一次的函数，将其变为匿名函数被认为是一种良好的现代编程实践，这样你的命名空间中就会少一个标识符。\n\n好了，我听出你在想：你之前说过我们通过使用函数名来调用函数。如果一个匿名函数没有名字，我们该如何运行它呢？非常棒的问题！主要有两种方法可以来看：\n\
  \n*   将函数赋值给变量\n*   用函数本身替换函数调用\n\n#### 将匿名函数赋值给变量\n\n再次，这里是上一个节的示例代码：\n\n```javascript\n\
  const preTipTotal = 100.00;\nconst tipPercentage = 0.15;\nfunction calculateTip(preTip,\
  \ tipPercent) {\nconst tipResult = preTip * tipPercent;\n  return (tipResult);\n\
  }\nconst tipCost = calculateTip(preTipTotal, tipPercentage);\nconst totalBill =\
  \ preTipTotal + tipCost;\ndocument.write(\"Your total bill is $\" + totalBill);\n\
  ```\n\n这段代码定义了命名函数 `calculateTip()`，稍后使用 `tipCost` 变量来存储函数结果。这是一个不需要命名函数的完美示例，因为你只使用过该命名函数来计算\
  \ `tipCost` 值。在不需要时向命名空间添加身份标识符被称为“污染”命名空间，这在现代 JavaScript 编程中是一个大忌。\n\n你可以重写这段代码，改用匿名函数（bk04ch05/example07.html）：\n\
  \n```javascript\nconst preTipTotal = 100.00;\nconst tipPercentage = 0.15;\n// 使用匿名函数声明\
  \ tipCost\nconst tipCost = function (preTip, tipPercent) {\nconst tipResult = preTip\
  \ * tipPercent;\n  return (tipResult);\n}\nconst totalBill = preTipTotal + tipCost(preTipTotal,\
  \ tipPercentage);\ndocument.write(\"Your total bill is $\" + totalBill);\n```\n\n\
  这里的巨大变化是，现在我将 `tipCost` 变量的值声明为一个匿名函数。这个匿名函数与之前的 `calculateTip()` 命名函数相同，只是没有名字。在倒数第二条语句中，我通过使用\
  \ `tipCost(preTipTotal, tipPercentage)` 调用了匿名函数。\n\n#### 用匿名函数替换函数调用\n\n匿名函数最常用的用途之一是将将函数作为参数传递给另一个函数时。传递的函数被称为\
  \ `callback`（回调）函数。\n\n首先，这里有一个使用命名函数的示例（bk04ch05/example08.html）：\n\n```html\n\
  <body\n<button id=\"bgRed\">\n背景变红色\n</button>\n<button id=\"bgWhite\">\n背景变白色\n\
  </button>\n<script>\nfunction makeBackgroundRed() {\ndocument.body.style.backgroundColor=\
  \ 'red';\n}\nfunction makeBackgroundWhite() {\ndocument.body.style.backgroundColor=\
  \ 'white';\n}\ndocument.getElementById('bgRed').addEventListener(\n'click',\nmakeBackgroundRed\n\
  );\ndocument.getElementById('bgWhite').addEventListener(\n'click',\nmakeBackgroundWhite\n\
  );\n</script>\n</body>\n```\n\n该脚本声明了两个命名函数：`makeBackgroundRed()` 和 `makeBackgroundWhite()`。代码随后了两个事件监听器。其中一个监听\
  \ `id` 值为 `bgRed` 的按钮点击，当检测到点击时，运行 `makeBackgroundRed()` 回调函数。另一个事件监听器监听 `id` 值为\
  \ `bgWhite` 的按钮点击，当检测到点击时，运行 `makeBackgroundWhite()` 回调函数。参考第 4 册第 6 章 获取有关 `document`\
  \ 对象以及 `getElementById()` 和 `addEventListener()` 方法的细节。\n\n再次，你有两个不需要命名的函数，因此可以通过将回调替换为匿名函数来将它们从命名空间中移除。以下是修改后的代码（bk04ch05/example09.html）：\n\
  \n```html\n<body\n<button id=\"bgRed\">\n背景变红色\n</button>\n<button id=\"bgWhite\"\
  >\n背景变白色\n</button>\n<script>\ndocument.getElementById('bgRed').addEventListener(\n\
  'click',\nfunction() {\ndocument.body.style.backgroundColor= 'red';\n}\n);\ndocument.getElementById('bgWhite').addEventListener(\n\
  'click',\nfunction() {\ndocument.body.style.backgroundColor= 'white';\n}\n);\n</script>\n\
  </body>\n```\n\n### 转向箭头函数\n\n随着你不断学习 JavaScript，你会发现自己不断地使用匿名函数。当你达到那个阶段时，你会很高兴知道\
  \ ES6 还提供了一种更简单的匿名函数语法。也就是说，与其使用这种：\n\n```javascript\nfunction ([arguments]) {\n\
  \  JavaScript 语句\n}\n```\n\n你可以使用这种：\n\n```javascript\n([arguments]) => {\n  JavaScript\
  \ 语句\n}\n```\n\n我在这里做的只是删除了 `function` 关键字，并在参数和左大括号之间替换为 `=` 和 `>`。字符 `=>` 看起来像一个箭头（JavaScript\
  \ 程序员称之为 `fat arrow`，粗箭头），因此这种版本的语法被称为 `arrow function`（箭头函数）。\n\n![记住](img/remember.png)\
  \ 箭头函数是 ES6 的发明，如果你需要支持非常旧的浏览器（例如 Internet Explorer 11），请不要使用它们。\n\n例如，这里是之前的一个匿名函数（来自“将匿名函数结果赋值给变量”部分）：\n\
  \n```javascript\n// 使用匿名函数声明 tipCost\nconst tipCost = function (preTip, tipPercent)\
  \ {\nconst tipResult = preTip * tipPercent;\n  return (tipResult);\n}\n```\n\n你可以使用箭头函数对其进行重写（bk04ch05/example10.html）：\n\
  \n```javascript\n// 使用箭头函数声明 tipCost\nconst tipCost = (preTip, tipPercent) => {\n\
  const tipResult = preTip * tipPercent;\n  return (tipResult);\n}\n```\n\n如果你的匿名函数由单个语句组成，你可以利用箭头函数的一个名为\
  \ `implicit return`（隐式返回）的特性：\n\n```javascript\n([arguments]) => statement\n```\n\
  \n在这里，JavaScript Assume 单语句函数意味着函数在执行语句后立即返回，因此你可以省略大括号和 `return` 关键字。这是一个示例：\n\n\
  ```javascript\n// 使用带有隐式返回的箭头函数声明 tipCost\nconst tipCost = (preTip, tipPercent)\
  \ => preTip * tipPercent;\n```\n\n同样，这里是上一个节中的一个匿名回调函数：\n\n```javascript\ndocument.getElementById('bgRed').addEventListener(\n\
  'click',\nfunction() {\ndocument.body.style.backgroundColor= 'red';\n}\n);\n```\n\
  \n你可以按照如下重写这段代码，使用带有隐式返回的箭头函数（bk04ch05/example11.html）：\n\n```javascript\ndocument.getElementById('bgRed').addEventListener(\n\
  'click',\n() => document.body.style.backgroundColor= 'red'\n);\n```\n\n### 在未来运行函数\n\
  \n在本书为止介绍的脚本中，代码通过三种方式之一执行：\n\n*   在页面加载时自动执行\n*   当你的脚本调用函数时\n*   响应某些事件，例如用户点击按钮\n\
  \nJavaScript 还提供了第四种基于时间的执行方法。这有两种可能：\n\n*   在指定的毫秒数后运行一次代码。这被称为 `timeout`（超时）。\n\
  *   在指定的毫秒数后运行代码，然后在每次该毫秒数过期后重复运行。这被称为 `interval`（间隔）。\n\n\n\n\n接下来的几个章节将向你展示如何设置这两个过程。\n\
  \n#### 使用超时执行一次未来的动作\n\n要设置 JavaScript 超时，请使用 `setTimeout()` 方法：\n\n```javascript\n\
  setTimeout(`function`, `delay`, `arg1`, `arg2`, …)\n```\n\n*   `function`: 你希望 JavaScript\
  \ 在超时到达后运行的匿名函数或具名函数。除了函数外，你也可以使用用引号括起来 JavaScript 语句。\n*   `delay`: JavaScript\
  \ 在执行 `function` 之前等待的毫秒数。\n*   `arg1, arg2, …`: 传递给 `function` 的可选参数。\n\n请注意，`setTimeout()`\
  \ 返回一个唯一标识该超时的值。你可以存储这个值，以防稍后需要取消该超时（在本节稍后的部分描述）。\n\n以下代码展示了 `setTimeout()` 如何工作（`bk04ch05/example12.html`）：\n\
  \n```javascript\n// 创建一条消息\nconst str = \"Hello World!\";\n\n// 设置超时\nconst timeoutId\
  \ = setTimeout(function (msg) {\n  document.write(msg);\n}, 5000, str);\n```\n\n\
  该脚本首先创建一个消息字符串并将其存储在变量 `str` 中。然后，`setTimeout()` 方法告诉 JavaScript 在五秒钟（5,000 毫秒）后运行一个匿名函数，并将\
  \ `str` 变量传递给该函数。匿名函数接收 `msg` 参数并使用 `document.write()`将其显示在页面上。\n\n如果你设置了超时，但由于某种原因决定最终不再执行该代码，你可以通过运行\
  \ `clearTimeout()` 方法来取消超时：\n\n```javascript\nclearTimeout(`id`)\n```\n\n*   `id`:\
  \ 用于存储 `setTimeout()` 方法返回值的变量名。\n\n例如，假设你使用以下语句设置了超时：\n\n```javascript\nconst timeoutId\
  \ = setTimeout(function (msg) {\n  document.write(msg);\n}, 5000, str);\n```\n\n\
  你将使用以下语句取消超时：\n\n```javascript\nclearTimeout(timeoutId);\n```\n\n#### 使用间隔重复地执行未来的动作\n\
  \n在指定的秒数运行后运行一次代码只是一个偶尔有用的过程。一个更实用的技能是能够在指定的间隔内重复代码。这使你能够设置倒计时、计时器、动画、图片幻灯片等。要设置间隔，请使用\
  \ `setInterval()` 方法：\n\n```javascript\nsetInterval(`function`, `delay`, `arg1`,\
  \ `arg2`, …)\n```\n\n*   `function`: 你希望 JavaScript 在每个间隔结束时运行的匿名函数或具名函数。除了函数外，你也可以使用用引号括起来\
  \ JavaScript 语句。\n*   `delay`: 每个间隔的毫秒数，在此之后 JavaScript 执行 `function`。\n*   `arg1,\
  \ arg2, …`: 传递给 `function` 的可选参数。\n\n与 `setTimeout()` 类似，`setInterval()` 方法返回一个唯一标识该间隔的值。你使用该值通过\
  \ `clearInterval()` 方法取消间隔：\n\n```javascript\nclearInterval(`id`);\n```\n\n*   `id`:\
  \ 用于存储 `setInterval()` 方法返回值的变量名。\n\n例如，假设你使用以下语句设置了间隔：\n\n```javascript\nconst\
  \ intervalId = setInterval(countdown, 5000);\n```\n\n你将使用以下语句取消间隔：\n\n```javascript\n\
  clearInterval(intervalId);\n```\n\n请注意，虽然在 `setTimeout()` 中 `clearTimeout()` 方法是可选的，但在使用\
  \ `setInterval()` 时应始终使用 `clearInterval()`。否则，间隔将一直执行。\n\n以下代码演示了 `setInterval()`\
  \ 和 `clearInterval()`（`bk04ch05/example13.html`）：\n\n```javascript\nlet counter\
  \ = 10;\n// 设置间隔\nconst intervalId = setInterval(function () {\n  // 显示倒计时然后递减计数器\n\
  \  document.open();\n  document.write(counter);\n  counter -= 1;\n  // 在达到 0 后取消间隔\n\
  \  if (counter < 0) {\n    clearInterval(intervalId);\n  }\n});\n```\n\n### 理解作用域\n\
  \n在编程中，*作用域*（scope）定义了变量何时是可以访问的。你可能关注作用域的原因有两个：\n\n*   你可能想要限制变量的作用域。\n*   你可能需要在不同的函数中使用相同的名称。\n\
  \nJavaScript 允许你建立三种作用域：\n\n*   块作用域（Block scope）\n*   函数作用域（Function scope）\n*\
  \   全局作用域（Global scope）\n\n接下来的三个章节将详细描述每种作用域。\n\n#### 使用块作用域\n\n当一个变量具有*块作用域*时，意味着它是在语句块内部（即一组大括号\
  \ `{ }` 之间）使用 `let` 或 `const` 声明的，并且可以访问该变量的语句只有块内部的语句。块外的语句无法访问该变量。\n\n```javascript\n\
  if (true) {\n  const myMessage = \"I'm in the scope!\";\n  console.log(\"Inside\
  \ the if block: \" + myMessage);\n}\n\nconsole.log(\"Outside the if block: \" +\
  \ myMessage);\n```\n\n这段代码使用 `if` 结构来创建一个语句块。在该块内部，代码声明了一个名为 `myMessage` 的变量，将其值设置为文本字符串，并使用\
  \ JavaScript 的 `console.log` 方法在控制台中显示该字符串。\n\n在 `if` 块之后，另一个 `console.log` 语句尝试显示\
  \ `myMessage` 变量。然而，如图 5-5 所示，JavaScript 会生成一个错误，显示 `myMessage is not defined`。为什么呢？因为\
  \ `myMessage` 变量的作用域仅延伸到 `if` 块。块外的语句无法“看到” `myMessage` 变量，因此它无可显示。事实上，在 `if` 语句执行完成后，JavaScript\
  \ 会完全从内存中移除 `myMessage` 变量，这就是为什么最后一行引用的 `myMessage` 变量是未定义的。\n\n![尝试在 if 块之外显示\
  \ myMessage 变量导致错误的截图](img/9781394164684-fg040505.png)\n\n图 5-5： 在 if 块之外显示 `myMessage`\
  \ 变量会导致错误。\n\n#### 使用函数作用域\n\n当一个变量具有*函数作用域*（通常也称为*局部*作用域）时，意味着该变量是在函数内部声明的，且可以访问该变量的语句只有该函数内部的语句。函数外的语句以及其他函数中的语句无法访问该变量。\n\
  \n```javascript\nfunction A() {\n```\n\n\n\n\n```javascript\nconst myMessage = \"\
  I'm in the scope!\";\n\nconsole.log(\"Function A: \" + myMessage);\n\n}\n\nfunction\
  \ B() {\nconsole.log(\"Function B: \" + myMessage);\n}\n\nA();\nB();\n```\n\n这里有两个函数，分别命名为\
  \ `A()` 和 `B()`。函数 `A()` 声明了一个名为 `myMessage` 的变量，将其值设置为文本字符串，并使用 JavaScript 的 `console.log()`\
  \ 方法在控制台中显示该字符串。\n\n函数 `B()` 同样使用 `console.log` 尝试显示 `myMessage` 变量。如图 5-6 所示，JavaScript\
  \ 生成了一个错误，显示 `myMessage is not defined`。这是为什么？因为 `myMessage` 变量的作用域仅延伸到函数 `A()`；函数\
  \ `B()` 无法“看到” `myMessage` 变量，该变量在函数 `A()` 执行完毕后立即从内存中被删除了。\n\n![在函数 B() 中使用 myMessage\
  \ 变量导致报错的截图](img/9781394164684-fg040506.png)\n\n图 5-6： 在函数 `B()` 中使用 `myMessage`\
  \ 变量会导致错误。\n\n如果你尝试在任何函数之外使用 `myMessage` 变量，也会相同的结果，如下代码所示：\n\n```javascript\nfunction\
  \ A() {\nconst myMessage = \"I'm in the scope!\";\nconsole.log(\"Function A: \"\
  \ + myMessage);\n}\n\nA();\n// 下述语句会产生错误：\nconsole.log(myMessage);\n```\n\n####\
  \ 使用全局作用域\n\n如果你想在多个函数中、甚至是同一个页面的多个脚本块中使用同一个变量怎么办？在这种情况下，你需要使用 `global` 作用域，它使得变量对页面上的任何语句或函数可见。（这就是为什么全局作用域也被称为页面级作用域的原因。）要设置一个具有全局作用域的变量，请在任何块或函数之外声明它。以下代码对此进行了尝试（bk04ch05/example16.html）：\n\
  \n```javascript\nconst myMessage = \"I've got global scope!\";\n\nif (true) {\n\
  console.log(\"Inside the if block: \" + myMessage);\n}\n\nfunction C() {\nconsole.log(\"\
  Function C: \" + myMessage);\n}\n\nC();\nconsole.log(\"Outside any block or function:\
  \ \" + myMessage);\n```\n\n脚本首先声明 `myMessage` 变量并将其赋值为字符串字面量。然后，一个 `if` 块使用 `console.log`\
  \ 语句尝试显示 `myMessage` 的值。接下来，创建一个名为 `C()` 的函数，并显示一条尝试显示 `myMessage` 值的控制台消息。调用调用函数后，另一个\
  \ `console.log` 语句尝试在任何块或函数之外显示 `myMessage` 的值。\n\n\n\n\n\n该函数首先计算 `netProfit`，然后使用该值来计算新的\
  \ `profitSharing` 数字。记住，你这里的目标是让 `netProfit` 和 `profitSharing` 的和等于 `grossProfit`。`if`\
  \ 语句会测试这一结果，如果和不等于 `grossProfit`，则会再次调用 `calculateProfitSharing()` 函数（这里就是递归），这次会传递新的\
  \ `profitSharing` 值。当最终找到正确的值时，函数将退出并显示结果，如图 5-8 所示。\n\n![记住](img/remember.png)\
  \ 注意，上一个示例中的所有变量都被声明为全局变量。这是因为如果你在 `calculateProfitSharing()` 函数内部声明它们，它们在每次调用时都会被清空并重置，而这不是你在进行递归时想要的结果。\n\
  \n![使用递归计算利润分值的截图](img/9781394164684-fg040508.png)\n\n图 5-8: 使用递归计算利润分值。\n\n## 第\
  \ 6 章\n\n# 玩转文档对象模型 (DOM)\n\n### 本章内容\n\n![列表](img/check.png) **理解对象**\n\n![列表](img/check.png)\
  \ **操作对象的属性和方法**\n\n![列表](img/check.png) **深入研究文档对象模型**\n\n![列表](img/check.png)\
  \ **弄懂事件**\n\n![列表](img/check.png) **处理鼠标点击、按键等操作**\n\n*程序员就像诗人一样，他们的工作离纯粹的思想物质只有一点点。他们通过想象力的努力，在空中用空气建造自己的城堡。很少有创作媒介能如此灵活、如此易于打磨和重做、如此能够实现宏大的概念结构。*\n\
  \n——弗雷德·布鲁克斯 (FRED BROOKS)\n\n在过去的几个章节中，我讨论了很多 JavaScript，但从现实意义上说，这一切都只是编程意义上的几道开菜。现在是时候坐下来吃主菜了：编程文档对象模型。我很快会解释它到底是什么，但目前只要知道它意味着控制网页页的每一个方面就足够了。想要动态更改网页上的某些文本吗？JavaScript\
  \ 可以做到。想要向页面添加一个元素吗？JavaScript 能够胜任。想要修改元素的 CSS 吗？JavaScript 极其擅长。想要根据用户点击某些内容或按下组合键来执行某些操作吗？JavaScript\
  \ 会举起手说：“噢，噢，选我，选我！”\n\n在本章中，你将探索文档对象模型迷人的世界。你将学习许多强大的编码技巧，这些技巧让你让你的网页执行几乎任何你想让它做的事情。你还会发现，这就是\
  \ Web 编程变得有趣甚至可能让人稍微上瘾的地方（我保证是那种好的方面）。\n\n### 与对象交互\n\n在我讨论文档对象模型之前，你需要熟悉该名称中可以认为是最重要的词：`object`（对象）。在接下来的几页中，你将学习什么是对象、你对它们可以做什么，以及它们为什么重要。\n\
  \n#### 到底什么是对象？\n\n只有最简单的 JavaScript 程序才会只做给变量赋值和计算表达式。要超越这些基础的编程起步——即编写真正实用的脚本——你必须做\
  \ JavaScript 设计之初就要的事情：操纵它所显示的网页。这正是 JavaScript 的核心所在，而这种操纵可以以多种形式出现：\n\n*   向 `element`（元素）添加文本和\
  \ HTML 属性。\n*   修改类或其他选择器的 CSS `property`（属性）。\n*   在浏览器的内部 `storage`（存储）中存储数据。\n\
  *   在提交 `form`（表单）数据之前对其进行验证。\n\n列表中的粗体是可以处理的“实体”示例，它们之所以特殊，仅仅是因为它们是可编程的。在 JavaScript\
  \ 术语中，这些“可编程实体”被称为 `objects`。\n\n你可以通过以下三种方式之一在 JavaScript 中处理对象：\n\n*   你可以读取并更改对象的\
  \ `properties`。\n*   你可以通过激活与对象相关的 `method` 让对象执行任务。\n*   你可以定义一个程序，每当对象发生特定的 `event`\
  \ 时就会运行。\n\n为了帮助你理解对象及其属性、方法和事件，我将使用现实世界的术语。具体来说，把你的电脑想象成一个对象：\n\n*   如果你想描述整个电脑，你会提到制造商名称、价格、硬盘大小和内存容量。这些每一项都是电脑的\
  \ `property`。\n*   你还可以使用电脑执行任务，如写信、计算数字和编写网页。这些是与你的电脑相关的 `methods`。\n*   电脑上会发生很多事情，导致它以预定义的方式做出响应。例如，当按下电源按钮时，电脑会运行开机自检、初始化组件等。电脑自动响应的动作就是它的\
  \ `events`。\n\n所有这些属性、方法和事件都构成了你对电脑的整体描述。\n\n但你的电脑也是一组对象的集合，每个对象都有自己的属性、方法和事件。例如，硬盘有各种属性。硬盘的方法（methods）是如存储和检索数据等操作。硬盘事件可能是一个定时任务，例如检查硬盘错误。\n\
  \n最终，你对电脑有了一个完整的描述：它看起来像什么样（它的属性），你如何与它交互（它的方法），以及它对哪些操作做出响应（事件）。\n\n#### 操纵属性\n\
  \n所有的 JavaScript 对象都至少有一个属性，有些甚至还有几十个属性。你如何处理这些属性取决于对象，但你通常用它们执行以下任务：\n\n*   收集有关对象当前设置的信息：例如，对于一个元素（如\
  \ `div` 或 `p` 元素），你可以使用 `textContent` 属性来获取元素中当前的任何文本。\n*   更改对象的当前设置：例如，你可以使用 `document`\
  \ 对象的 `location` 属性将网络浏览器发送到不同的 URL。\n*   更改对象的外观：例如，通过元素的 `style` 对象，你可以使用 `fontSize`\
  \ 属性来更改字体大小。\n\n##### 引用属性\n\n无论任务是什么，你都通过以下通用表达式中的语法来引用属性：\n\n`object.property`\n\
  \n*   `object`: 拥有该属性的对象。\n*   `property`: 你想要处理的属性的名称。\n\n中间的点（`.`）称为属性访问运算符。\n\
  \n例如，考虑以下表达式：\n\n`document.location`\n\n这个表达式引用 `document` 对象的 `location` 属性，该属性持有当前在浏览器窗口中显示的文档地址。（在口语中，你把这个表达式读作“document\
  \ dot location”。）下面的代码显示了一个简单的单行脚本，在控制台中显示此属性，如图 6-1 所示。\n\n```\nconsole.log(document.location);\n\
  ```\n\n![提示](img/tip.png) 在大多数网络浏览器中显示控制台，右键点击网页，点击“检查”（或在 Windows 中按 Ctrl+Shift+I，在\
  \ macOS 中按 Option+⌘  +I），然后点击“控制台”标签页。\n\n\n\n\n\n因为属性始终包含一个值，所以你可以在几乎任何类型的 JavaScript\
  \ 语句中使用属性表达式，并将其作为 JavaScript 表达式中的操作数。（要了解什么是操作数，请参阅第 4 本第 3 章。）例如，以下语句将 `document.location`\
  \ 属性当前值赋值给名为 `currentUrl` 的变量：\n\n```javascript\nconst currentUrl = document.location;\n\
  ```\n\n同样，以下语句将 `document.location` 作为字符串表达式的一部分包含：\n\n```javascript\nconst message\
  \ = \"The current address is \" + document.location + \".\";\n```\n\n#### 某些属性是对象\n\
  \n为了让你保持警惕，当你处理对象时，会不断地遇到一个常见但令人困惑的概念：某些属性兼具双重职能，充当完整的对象！这是对象与属性之间关系中最令人困惑的方面之一，但也是最重要的方面之一，因此我将深入探讨一下，以确保你理解正在发生什么。\n\
  \n基本思想是，属性返回的值通常是一个字面量（程序员术语，意为“它就是什么”），例如字符串或数字，但它通常也是对象。后者的例子是 `document` 对象的\
  \ `location` 属性，它实际上返回一个 `Location` 对象。因为 `location` 是一个对象，它也有它自己的属性。例如，它有一个 `hostname`\
  \ 属性，引用地址中的主机名部分（例如，`paulmcfedries.com`）。要操作此属性，你需相应地扩展表达式语法：\n\n```javascript\n\
  document.location.hostname\n```\n\n#### 修改属性的值\n\n某些属性是“只读”的，这意味着你的代码只能读取当前值而不能更改它。然而，许多属性是“可读/写”的，这意味着你也可以更改它们的值。要更改属性的值，请使用以下通用语法：\n\
  \n`object.property = value`\n\n- `object`: 拥有该属性的对象\n- `property`: 你想要更改的属性名称\n\
  - `value`: 一个字面量值（如字符串或数字）或返回要设置的属性之值的表达式\n\n这里有一个示例：\n\n```javascript\nconst newAddress\
  \ = prompt(\"Enter the address you want to surf to:\");\ndocument.location = newAddress;\n\
  ```\n\n此脚本提示用户输入一个网页地址，并将结果存储在 `newAddress` 变量中。然后，使用该值来更改 `document.location` 属性，在这种情况下，它告诉浏览器打开指定的地址。\n\
  \n#### 使用对象方法\n\n每个 JavaScript 对象都有至少一两个方法，你可以利用这些方法让对象执行某些操作。这些操作通常属于以下类别：\n\n\
  - **模拟用户操作：** 例如，`form` 对象的 `submit()` 方法向服务器提交表单，就像用户点击了表单提交按钮一样。\n- **执行计算：**\
  \ 例如，`Math` 对象的 `sqrt()` 方法计算数字的平方根。\n- **操作对象：** 例如，`String` 对象的 `toLowerCase()`\
  \ 方法将字符串的所有字母改为小写。\n\n要运行方法，从最简单的情况开始，即不接受任何参数的方法：\n\n`object.method()`\n\n- `object`:\
  \ 拥有你想要操作的对象\n- `method`: 你想要执行的方法名称\n\n例如，考虑以下语句：\n\n```javascript\nhistory.back();\n\
  ```\n\n这运行 `history` 对象的 `back()` 方法，它告诉浏览器返回上一个访问的页面。以下代码显示了方法的作用：\n\n```javascript\n\
  const goBack = confirm(\"Do you want to go back?\");\nif (goBack === true) {\n \
  \   history.back();\n}\n```\n\n首先询问用户是否想要返回。如果用户点击确定，布尔值 `true` 将存储在 `goBack` 变量中，比较表达式\
  \ `goBack === true` 变为 `true`，因此运行了 `history.back()` 方法。\n\n我在第 4 本第 5 章中提到，你可以定义一个函数使其接受一个或多个参数，这些参数随后被作为函数执行的任何计算或操作的输入值。方法与其相似之处在于它们也可以接受一个或多个参数，并将这些值作为原始数据使用。\n\
  \n如果方法需要参数，你使用以下通用语法：\n\n`object.method(argument1, argument2, ...)`\n\n例如，考虑在以下语句中使用的\
  \ `confirm()` 方法，它接受单个参数 ——一个指定显示给用户的文本的字符串：\n\n```javascript\nconfirm(\"Do you\
  \ want to go back?\")\n```\n\n最后，与属性一样，如果方法返回一个值，你可以将该值赋值给变量（正如我在前面的示例中对 `confirm()`\
  \ 方法所做的那样），或者将方法整合到表达式中。\n\n#### 编写自己的对象\n\n虽然你主要处理的是预制对象，例如 JavaScript 内置的对象或由\
  \ Web API 暴露的对象（请见下一节），但你也可以创建自己的对象。为什么要这样做呢？有很多原因，但就你这里的目的而言，最大的原因是自定义对象允许你在单个结构中存储多个值。\n\
  \n例如，假设你的脚本需要处理以下内容：\n\n```javascript\nconst userColor = \"darkgreen\";\nconst userTextColor\
  \ = \"antewhite\";\nconst userSize = \"1.25em\";\nconst userTypeface = \"Comic Sans\"\
  ;\n```\n\n这种方法并不糟糕，但如果偏好数量增加到 10 或 15 个，就会显得有些臃肿。处理此类数据更简单、更灵活的方法是使用以下代码将所有内容放入自定义对象：\n\
  \n```javascript\nconst userPrefs = {\n    bgColor: \"darkgreen\",\n    textColor:\
  \ \"antewhite\",\n    textSize: \"1.25em\",\n    typeface: \"Comic Sans\"\n};\n\
  ```\n\n- `objectName`: 对象的变量名。\n- `propertyName1` 到 `propertyNameN`: 对象的属性的名称。\n\
  - `value1` 到 `valueN`: 分配给属性的值。每个值可以是字面量值（如字符串、数字或布尔值）、数组、函数结果、变量名（假设该变量已声明并初始化），甚至是另一个对象字面量。\n\
  \n这种数据结构被称为*对象字面量*（object literal）。以下是你如何使用对象字面量来存储之前的用户偏好的方法：\n\n```javascript\n\
  const userPrefs = {\n    bgColor: \"darkgreen\",\n    textColor: \"antewhite\",\n\
  \    textSize: \"1.25em\",\n    typeface: \"Comic Sans\"\n};\n```\n\n然后你可以使用标准的\
  \ `property.value` 语法引用属性值：\n\n```javascript\ndocument.body.style.backgroundColor\
  \ = userPrefs.bgColor;\n```\n\n你也可以用通常的方式更改属性值：\n\n```javascript\nuserPrefs.textColor\
  \ = \"papayawhip\";\n```\n\n![Remember](img/remember.png) 等等，什么！？我用 `const` 声明了\
  \ `userPrefs` 然后又更改了属性值？这怎么可能？这是一个常见的问题，它直击用 `const` 声明变量的真正含义。在这种情况下，`const` 的作用是将\
  \ `userPrefs` 绑定到特定的对象上，你不能更改这种绑定。但是，你可以自由更改该对象的*内容*。\n\n那么自定义对象方法呢？是的，你也可以添加它们：\n\
  \n```javascript\nconst objectName = {\n    propertyName1: value1,\n    propertyName2:\
  \ value2,\n    ...,\n    propertyNameN: valueN,\n    methodName: function(arguments)\
  \ {\n        code\n    }\n};\n```\n\n- `methodName`: 方法的名称\n\n\n\n\n\n* `arguments`:\
  \ 一个可选的（逗号分隔）列表，包含了该方法接收的参数。\n* `code`: 调用该方法时运行的 JavaScript 代码。\n\n这是一个示例（请参本书中的示例文件\
  \ `bk04ch06/example00.html`）：\n\n```javascript\nconst userPrefs = {\n  bgColor:\
  \ \"darkolivegreen\",\n  textColor: \"antiquewhite\",\n  textSize: \"1.25em\",\n\
  \  typeface: \"Comic Sans\",\n  resetDefaults: function() {\n    document.body.style.backgroundColor\
  \ = 'white';\n    document.body.style.color = 'black';\n    document.body.style.fontSize\
  \ = '1em';\n    document.body.style.fontFamily = 'initial';\n  }\n};\n```\n\n这段代码定义了一个\
  \ `resetDefaults()` 方法，在运行时，它会将背景颜色、文本颜色、文本大小和字体重置为默认值。你的代码可以通过如下方式调用此方法：\n\n`userPrefs.resetDefaults();`\n\
  \n### Web APIs：一些特殊对象\n\nJavaScript 有它自己的内置对象，包括 `String`、`Date` 和 `Math` 对象，这些对象是第四本书第\
  \ 8 章的主题。然而，在 JavaScript 之外还存在大量的对象集合，这些对象对你的脚本可用。这个集合被称为 Web 编程接口，简称 Web APIs。\n\
  \n为了理解 Web APIs 是如何工作的，请考虑你的汽车（如果你有一辆的话；如果没有，考虑别人的车）。汽车内部的引擎是一个极其复杂的工程产，但启动汽车时不需要担心其中任何细节。相反，你只需要将钥匙（或遥应器，等等）插入点火开关并旋转（或按下按钮，等等）。引擎及其启动过程的复杂性对你是隐藏的，它被简化为将钥匙（或遥应器等）插入点火开关。\n\
  \n从编程的角度来看，汽车引擎是一个对象，而点火开关就是所谓的接口（interface）：即一种访问对象属性和方法的方法（例如启动引擎的“方法”）。\n\n简单来说，应用程序编程接口（API）是你的\
  \ JavaScript 代码通过暴露该对象的属性和方法，来访问隐藏的（且假设复杂的）对象的一种方式。幸运的是，许多 Web APIs 直接构建在网络浏览器中，因此你的\
  \ JavaScript 代码开箱即可访问许多复杂的对象。\n\n一个很好的例子是 Web Storage API，它允许你的 JavaScript 代码在用户的网络浏览器中存储和检索数据。这是一个非常实用的\
  \ API，这就是为什么我专门用了一整章来介绍它（参见第四本书第 9 章）。\n\n其他 Web APIs 允许你访问设备的电池状态（Battery API）、剪贴板（Clipboard\
  \ API）、服务器数据（Fetch API）、地理位置数据（Geolocation API）、音频（Web Audio API）和通知（Web Notifications）。\n\
  \n然而，出于本章的目的（实际上，对于本书的大部分内容），最重要的 API 是文档对象模型（Document Object Model），我接下来介绍介绍。\n\
  \n### 了解文档对象模型\n\n以下是一个简单网页的源代码：\n\n```html\n<html lang=\"en\">\n<head>\n  <title>So\
  \ Many Kale Recipes</title>\n</head>\n<body>\n  <header>\n    <h1>Above and Beyond\
  \ the Kale of Duty</h1>\n  </header>\n  <main>\n    <p>Do you love to cook with\
  \ <a href=\"kale.html\">kale</a>?</p>\n  </main>\n</body>\n</html>\n```\n\n检查这段代码的一种方法是按层级结构。也就是说，`html`\
  \ 元素在某种意义上是顶层元素，因为所有其他元素都包含在其中。层级中的下一层包含 `head` 和 `body` 元素。`head` 元素包含一个 `title`\
  \ 元素，该元素包含文本 `So Many Kale Recipes`。同样，`body` 元素包含一个 `header` 元素和一个 `main` 元素。`header`\
  \ 元素包含一个文本为 `Above and Beyond the Kale of Duty` 的 `h1` 元素，而 `main` 元素包含一个文本为 `Do\
  \ you love to cook with kale?` 的 `p` 元素。\n\n层级通过视觉形式更容易理解，因此图 6-2 以层级方式绘制了页面元素。\n\
  \n![Remember](img/remember.png) 当提到对象层级结构时，如果对象 P 包含对象 C，则称对象 P 是对象 C 的父对象，对象 C\
  \ 是对象 P 的元素。在图 6-2 中，箭头代表父子关系。此外，处于同一层级的元素——例如 `header` 和 `main` 元素——被称为兄弟元素。\n\n\
  你这里有几个关键点需要考虑：\n\n* 图 6-2 中的每个框都代表一个对象。\n* 图 6-2 中的每个对象都是三类型类型之一：元素、文本或属性。\n* 图\
  \ 6-2 中的每个对象，无论其类型如何，都称为节点（node）。\n* 整个页面由 `document` 对象表示。\n\n因此，这种层级对象表示法被称为文档对象模型，或者通常称为\
  \ DOM。DOM 是一个 Web API，允许你的 JavaScript 代码访问 HTML 文档的完整结构。这种访问是 JavaScript 最基础功能之一的来源：它为\
  \ Web 开发者提供了即使在页面加载后也能读取和更改网页元素的能力。为此，本节将向你快速介绍一些处理 DOM 和 `document` 对象的极其有用且强大的\
  \ JavaScript 技术。\n\n![Schematic illustration of the web page code as a hierarchy.](img/9781394164684-fg040602.png)\n\
  \n图 6-2： 层级结构化的网页代码。\n\n为了让你开始，表 6-1 描述了 `document` 对象的几个常用属性。\n\n| 属性 | 作用 |\n\
  | --- | --- |\n| `activeElement` | 返回一个表示当前网页上拥有焦点的元素的对象 |\n| `body` | 返回一个表示当前网页\
  \ `body` 元素的对象 |\n| `childElementCount` | 返回当前网页中子元素的数量 |\n| `children` | 返回一个包含当前网页所有元素的集合\
  \ |\n| `forms` | 返回一个包含当前网页所有 `form` 元素的集合 |\n| `head` | 返回一个表示当前网页 `head` 元素的对象\
  \ |\n| `images` | 返回一个包含当前网页所有 `img` 元素的集合 |\n| `lastModified` | 返回当前网页最后更改的日期 |\n\
  | `links` | 返回一个包含当前网页所有 `a` 元素的集合 |\n| `location` | 返回一个表示当前网页 URL 的对象 |\n| `title`\
  \ | 返回一个表示当前网页 `title` 元素的对象 |\n| `URL` | 返回一个包含当前网页 URL 的字符串 |\n\n表 6-1 document\
  \ 对象的常用属性\n\n### 指定元素\n\n元素代表文档中的标签，因此你会在代码中频繁使用它们。本节将向你展示引用一个或多个元素的方法。\n\n####\
  \ 通过 id 指定元素\n\n如果你在脚本中想要处理某个特定的元素，可以先通过 `id` 属性为其分配一个标识符来直接引用该元素：\n\n`<div id=\"\
  kale-quotations\">`\n\n完成后，你可以通过 `document` 对象的 `getElementById()` 方法在代码中引用该元素：\n\
  \n`document.getElementById(\"id\")`\n\n* `id`: 代表你想要处理的元素的 `id` 属性的字符串\n\n例如，以下语句返回了一个\
  \ `<div>` 标签的引用（即 `id=\"` `kale-quotations\"` 的那个）：\n\n`document.getElementById(\"\
  kale-quotations\")`\n\n\n\n\n\n![Warning](img/warning.png) 当你编写 `document` 对象的代码时，不要将\
  \ `<script>` 标签放在网页的 `head` 区域（即 `<head>` 和 `</head>` 标签之间）。如果你将代码放在那里，网络浏览器将在还没有机会创建\
  \ `document` 对象之前运行该代码，这意味着你的代码将彻底失败。相反，请将 `<script>` 标签放在网页的底部，紧接 `</body>` 标签之前。\n\
  \n#### 通过标签名指定元素\n\n除了处理单个元素外，你还可以处理元素集合。其中一种集合是页面中所有使用相同标签名的元素构成的集合。例如，你可以引用所有的\
  \ `<a>` 标签或所有的 `<div>` 标签。这是对这些标签进行大规模更改的方便方法（例如，更改链接中所有的 `target` 属性）。\n\n返回具有相同标签的元素集合的机制是\
  \ `getElementsByTagName()` 方法：\n\n`document.getElementsByTagName(\"tag\")`\n\n*\
  \   `tag`: 一个字符串，表示你想要操作的标签所使用的 HTML 名称\n\n此方法返回一个类数组的集合，其中包含文档中所有使用指定标签的元素。（参阅第\
  \ 4 册，第 7 章 了解数组是如何工作的。另请查看本章稍后的“操作元素集合”。）例如，要返回一个包含当前页面中所有 `div` 元素的集合，你会使用以下语句：\n\
  \n`const divs = document.getElementsByTagName(\"div\");`\n\n#### 通过类名指定元素\n\n你可以处理的另一个集合是页面中所有使用相同类的元素构成的集合。返回所有共享特定类名的元素的\
  \ JavaScript 工具是 `getElementsByClassName()` 方法：\n\n`document.getElementsByClassName(\"\
  class\")`\n\n*   `class`: 一个字符串，表示你想要操作的元素所使用的类名\n\n此方法返回一个类数组的集合，其中包含文档中所有使用指定类名的元素。集合的顺序与元素在文档中出现的顺序相同。这里有一个示例：\n\
  \n`const keywords = document.getElementsByClassName(\"keyword\");`\n\n#### 通过选择器指定元素\n\
  \n在第 3 册的第 2 章 和第 3 章中，我讨论了 CSS 选择器，包括 id、标签、类、后代和子选择器。你可以在 JavaScript 代码中使用这些相同的选择器，通过\
  \ `document` 对象的 `querySelector()` 和 `querySelectorAll()` 方法来引用页面元素：\n\n`document.querySelector(\"\
  selector\")`\n\n`document.querySelectorAll(\"selector\")`\n\n*   `selector`: 一个字符串，表示你想要操作的元素或元素的选择器\n\
  \n这些方法之间的区别在于，`querySelectorAll()` 返回匹配你选择器的所有元素的集合，而 `querySelector()` 只返回匹配你选择器的第一个元素。\n\
  \n例如，以下语句返回所有作为 `article` 元素直接子元素的 `section` 元素集合：\n\n`const articles = document.querySelectorAll(\"\
  article > section\");`\n\n![Remember](img/remember.png) 与其使用三个不同的 `document` 对象方法通过\
  \ id、标签和类来引用页面元素——即 `getElementById()`、`getElementsByTagName()` 和 `getElementsByClassName()`——许多\
  \ 开发者更倾向于使用 `querySelector()` 和 `querySelectorAll()` 提供的更通用方法。\n\n#### 操作元素集合\n\n\
  `getElementsByTagName()`、`getElementsByClassName()` 和 `querySelectorAll()` 方法分别返回一个类数组的集合，其中包含文档中所有使用指定标签、类或选择器的元素。集合的顺序与元素在文档中出现的顺序相同。例如，考虑以下\
  \ HTML 代码（查看此书中的示例文件 bk04ch06/example01.html）：\n\n```html\n<div id=\"div1\">\n \
  \ This, of course, is div 1.\n</div>\n<div id=\"div2\">\n  Yeah, well <em>this</em>\
  \ is div 2!\n</div>\n<div id=\"div3\">\n  Ignore those dudes. Welcome to div 3!\n\
  </div>\n```\n\n现在考虑以下语句：\n\n`divs = document.getElementsByTagName(\"div\");`\n\n\
  在生成的集合中，第一个项（`divs[0]`）将是 `id` 等于 `div1` 的 `<div>` 元素；第二个项（`divs[1]`）将是 `id` 等于\
  \ `div2` 的 `<div>` 元素；第三个项（`divs[2]`）将是 `id` 等于 `div3` 的 `<div>` 元素。\n\n你也可以直接使用它们的\
  \ `id` 值引用元素。例如，以下语句是等效的：\n\n`const firstDiv = divs[0];`\n\n`const firstDiv = divs.div1;`\n\
  \n要学习集合中有多少个项，请使用 `length` 属性：\n\n`const totalDivs = divs.length;`\n\n要对集合中的每个项执行一次或多次操作，你可以使用\
  \ `for…of` 循环逐个遍历集合。在 JavaScript 行业中，这被称为对集合进行*迭代*（iterating）。以下是其使用的语法：\n\n```javascript\n\
  for (const item of collection) {\n  statements\n}\n```\n\n*   `item`: 一个持有集合中某一项的变量。第一次循环时，`item`\
  \ 被设置为集合中的第一个元素；第二次循环时，`item` 被设置为集合中的第二个元素；依此类推。\n*   `collection`: 你想要遍历的元素集合。\n\
  *   `statements`: 你想要用于操作（或查看、或其他）`item` 的 JavaScript 代码。\n\n例如，这里有一些代码遍历前面的 `div`\
  \ 元素并在控制台中显示每个项的 `id` 值（控制台详情请参阅第 4 册第 10 章），所示图 6-3;\nfor (const d of divs) {\n\
  \  console.log(d.id);\n}\n```\n\n![遍历 div 元素的脚本输出。](img/9781394164684-fg040603.png)\n\
  \n图 6-3： 遍历 div 元素的脚本输出。\n\n![Warning](img/warning.png) `for…of` 循环是 ECMAScript\
  \ 2015 (ES6) 新的特性。如果你需要支持如 Internet Explorer 11 这样的旧版浏览器，可以使用普通的 `for` 循环来代替：\n\n\
  ```javascript\nfor (var i = 0; i < collection.length; i += 1) {\n  statements\n\
  \  // 使用 collection[i] 引用每一项\n}\n```\n\n### 遍历 DOM\n\nJavaScript 代码中的一个常见任务是处理页面中某些元素的子元素、父元素或兄弟元素。这被称为*遍历\
  \ DOM*（traversing the DOM），因为你正在使用这些技术在 DOM 层次结构中向上、向下和水平移动。\n\n在接下来的章节中，我为每个示例技术都使用了以下\
  \ HTML 代码（bk04ch06/example02.html）：\n\n```html\n<html lang=\"en\">\n  <head>\n \
  \   <title>So Many Kale Recipes</title>\n  </head>\n  <body>\n    <header id=\"\
  page-banner\">\n      <h1>Above and Beyond the Kale of Duty</h1>\n    </header>\n\
  \    <main id=\"page-content\">\n      <p>\n        Do you love to cook with <a\
  \ href=\"kale.html\">kale</a>?\n      </p>\n    </main>\n  </body>\n</html>\n```\n\
  \n#### 获取父元素的元素\n\n当你处理一个特定元素时，通常想要对该元素的元素执行一次或多次操作。每个父元素都提供了几个属性，允许你处理其全部或部分子节点：\n\
  \n*   所有的子节点\n*   第一个子节点\n*   最后一个子节点\n\n##### 获取所有的子节点\n\n要返回父元素的所有子节点集合，请使用 `childNodes`\
  \ 属性：\n\n`parent.childNodes`\n\n*   `parent`: 你正在处理的父元素\n\n例如，以下语句将 `body` 元素的所有子节点存储在变量中：\n\
  \n\n\n\n\n```javascript\nconst bodyChildren = document.body.childNodes;\n```\n\n\
  结果是一个 `NodeList` 对象，它是节点的集合。如果你使用控制台（参见第 4 册，第 10 章）来显示 `bodyChildren` 的值，将得到如图\
  \ 6-4 所示的输出。\n\n![提示](img/tip.png) 如果你需要遍历 `NodeList` 集合，可以使用我在本章之前介绍过的 `for…of`\
  \ 循环（回到“操作元素集合”）。\n\n![控制台中中显示的 bodyChildren 变量值的截图。](img/9781394164684-fg040604.png)\n\
  \n图 6-4： 控制台中显示的 `bodyChildren` 变量的值。\n\n以下是控制台中显示的输出：\n\n```\nNodeList(5) [ #text,\
  \ header, #text, main, #text ]\n```\n\n`(5)` 部分告诉你 `NodeList` 中有五个项目，根据方括号内的值，你知道这些节点包含\
  \ `header` 和 `main` 元素（如预期的那样），但还有三个文本节点。这些文本节点是从哪里来的？它们代表了（在本例中）元素之间的空白。例如，第一个文本节点是出现在\
  \ `<body>` 标签结束和 `<header>` 标签开始之间的回车和八个空格。其他文本节点代表 `</header>` 和 `<main>` 标签之间，以及\
  \ `</main>` 和 `</body>` 标签之间的空白。\n\n如果你真正想要的是元素的子节点集合，你需要切换到另一个属性：\n\n`parent.children`\n\
  \n*   `parent`: 父元素\n\n例如，以下语句将 `body` 元素的所有子元素节点存储在变量中：\n\n```javascript\nconst\
  \ bodyChildElements = document.body.children;\n```\n\n结果是一个 `HTMLCollection` 对象，它是一个元素节点的类数组集合。如果你使用控制台（参见第\
  \ 4 册，第 10 章）来显示 `bodyChildElements` 的值，将得到如图 6-5 所示的输出。\n\n![控制台中显示的 bodyChildElements\
  \ 变量值的截图。](img/9781394164684-fg040605.png)\n\n图 6-5： 控制台中显示的 `bodyChildElements`\
  \ 变量的值。\n\n以下是输出：\n\n```\nHTMLCollection { 0: header, 1: main, length: 2 }\n```\n\
  \n数字 `0` 和 `1` 是每个子元素的索引数字。例如，你可以使用 `bodyChildElements[0]` 来引用集合中的第一个元素，在本例中它是 `header`\
  \ 元素。\n\n#### 获取第一个子节点\n\n如果你使用父元素的 `childNodes` 或 `children` 属性来返回父元素的子节点，正如我在上一节中描述的那样，你可以在集合变量名后加上\
  \ `[0]` 来引用结果集合中的第一项。例如：\n\n```javascript\nbodyChildren[0]\nbodyChildElements[0]\n\
  ```\n\n然而，DOM 提供了一个更直接的方法来获取第一个子节点：\n\n`parent.firstChild`\n\n*   `parent`: 父元素\n\
  \n例如，假设你想处理本节开头 HTML 示例中 `main` 元素的第一个子节点。以下是可以完成此任务的代码（bk04ch06/example03.html）：\n\
  \n```javascript\nconst content = document.getElementById(\"page-content\");\nconst\
  \ firstContentChildNode = content.firstChild;\n```\n\n在本例中，结果得到的节点是一个文本节点（`<main>`\
  \ 和 `<p>` 标签之间的空白）。如果你想获取第一个子元素节点，请使用 `firstElementChild` 属性：\n\n`parent.firstElementChild`\n\
  \n*   `parent`: 父元素\n\n要获取本节开头代码中 `main` 元素的第一个子元素节点，你可以这样操作（bk04ch06/example04.html）：\n\
  \n```javascript\nconst content = document.getElementById(\"page-content\");\nconst\
  \ firstContentChildElement = content.firstElementChild;\n```\n\n在本例中，这段代码返回了 `p`\
  \ 元素。\n\n#### 获取最后一个子节点\n\n如果你的代码需要处理最后一个子节点，请使用父元素的 `lastChild` 属性：\n\n`parent.lastChild`\n\
  \n*   `parent`: 父元素\n\n例如，假设你想处理本节开头 HTML 示例中 `p` 元素的最后一个子节点。以下是可以完成此任务的代码（bk04ch06/example05.html）：\n\
  \n```javascript\nconst para = document.querySelector(\"main > p\");\nconst lastParaChildNode\
  \ = para.lastChild;\n```\n\n在本例中，结果得到的节点是一个代表问号（`?`）以及 `</p>` 标签空白的文本节点。如果你想获取最后一个子元素节点，请使用\
  \ `lastElementChild` 属性：\n\n`parent.lastElementChild`\n\n*   `parent`: 父元素\n\n要获取本节开头代码中\
  \ `p` 元素的最后一个子元素节点，你可以这样做（bk04ch06/example06.html）：\n\n```javascript\nconst para\
  \ = document.querySelector(\"main > p\");\nconst lastParaChildElement = para.lastElementChild;\n\
  ```\n\n在示例中，这段代码返回了 `a` 元素。\n\n#### 获取子元素的父元素\n\n如果你的代码需要处理子元素的父元素，请使用子元素的 `parentNode`\
  \ 属性：\n\n`child.parentNode`\n\n*   `child`: 子元素\n\n例如，假设你想处理本节开头 HTML 示例中 `h1` 元素的父元素。以下是可以完成此任务的代码（bk04ch06/example07.html）：\n\
  \n```javascript\nconst childElement = document.querySelector(\"h1\");\nconst parentElement\
  \ = childElement.parentNode;\n```\n\n#### 获取元素的兄弟元素\n\n在代码中处理元素的兄弟元素通常是非常重要的。请记住，元素的兄弟元素是\
  \ DOM 中共享相同父元素的那些元素。\n\n父元素的子节点在 DOM 中出现的顺序与它们在 HTML 中出现的顺序相同，这意味着兄弟元素也按此顺序出现。因此，对于给定的子元素，有两种兄弟元素的情况：\n\
  \n-   **前一个兄弟元素 (Previous sibling)**：紧接出现在该子元素之前的兄弟元素。如果该子元素是第一个兄弟元素，它将没有前一个兄弟元素。\n\
  -   **后一个兄弟元素 (Next sibling)**：紧接出现在该子元素之后的兄弟元素。如果该子元素是最后一个兄弟元素，它将没有后一个兄弟元素。\n\n\
  ##### 获取前一个兄弟元素\n\n要返回特定元素的前一个兄弟元素，请使用 `previousElementSibling` 属性：\n\n`element.previousElementSibling`\n\
  \n*   `element`: 你正在处理的元素\n\n例如，以下语句将 `main` 元素的前一个兄弟元素存储在变量中（bk04ch06/example08.html）：\n\
  \n```javascript\nconst currElement = document.querySelector(\"main\");\nconst prevSib\
  \ = currElement.previousElementSibling;\n```\n\n##### 获取后一个兄弟元素\n\n要返回特定元素的后一个兄弟元素，请使用\
  \ `nextElementSibling` 属性：\n\n`element.nextElementSibling`\n\n*   `element`: 你正在处理的元素\n\
  \n例如，以下语句将 `header` 元素的后一个兄弟元素存储在变量中（bk04ch06/example09.html）：\n\n```javascript\n\
  const currElement = document.querySelector(\"header\");\nconst nextSib = currElement.nextElementSibling;\n\
  ```\n\n\n\n\n1. 为你想要添加的元素类型创建一个对象。\n2. 将第 1 步中创建的新对象作为子元素添加到现有元素。\n3. 在第 1 步创建的新对象中插入一些文本和标签。\n\
  \n##### 步骤 1：创建元素\n\n对于第 1 步，你使用 `document` 对象的 `createElement()` 方法：\n\n```javascript\n\
  document.createElement(elementName)\n```\n\n* `elementName`: 包含你想要创建的元素类型的 HTML\
  \ 元素名称的字符串\n\n该方法创建元素并返回它，这意味着你可以将新元素存储在变量中。这里有一个示例：\n\n```javascript\nconst newArticle\
  \ = createElement(\"article\");\n```\n\n##### 步骤 2：将新元素作为子元素添加\n\n创建元素后，第 2 步将其添加到现有的父元素。你有四种选择：\n\
  \n* **将新元素添加到父元素子元素集合的末尾：** 使用 `append()` 方法：\n\n  ```javascript\n  parent.append(child)\n\
  \  ```\n\n  * `parent`: 指向父元素的引用，新元素将追加到该元素。\n  * `child`: 你要追加的子元素的引用。注意，你可以通过逗号分隔每个元素来同时追加多个元素。`child`\
  \ 参数也可以是一个文本字符串。\n\n* **将新元素插入父元素子元素集合的开头：** 使用 `prepend()` 方法：\n\n  ```javascript\n\
  \  parent.prepend(child)\n  ```\n\n  * `parent`: 指向父元素的引用，新元素将插入到该元素之前。\n  * `child`:\
  \ 你要插入的子元素的引用。注意，你可以通过逗号分隔每个元素来同时插入多个元素。`child` 参数也可以是一个文本字符串。\n\n* **将新元素插入到父元素现有子元素之后：**\
  \ 使用 `after()` 方法：\n\n  ```javascript\n  child.after(sibling)\n  ```\n\n  * `child`:\
  \ 指向子元素的引用，新元素将插入在该元素之后。\n  * `sibling`: 你要插入的新元素的引用。注意，你可以通过逗号分隔每个元素来同时插入多个元素。`sibling`\
  \ 参数也可以是一个文本字符串。\n\n* **将新元素插入到父元素现有子元素之前：** 使用 `before()` 方法：\n\n  ```javascript\n\
  \  child.before(sibling)\n  ```\n\n  * `child`: 指向子元素的引用，新元素将插入在该元素之前。\n  * `sibling`:\
  \ 你要插入的新元素的引用。注意，你可以通过逗号分隔每个元素来同时插入多个元素。`sibling` 参数也可以是一个文本字符串。\n\n以下示例创建了一个新的\
  \ `article` 元素并将其追加到 `main` 元素（bk04ch06/example10.html）：\n\n```javascript\nconst\
  \ newArticle = document.createElement(\"article\");\ndocument.querySelector(\"main\"\
  ).append(newArticle);\n```\n\n以下示例创建了一个新的 `nav` 元素并将其插入到 `main` 元素的开头：\n\n```javascript\n\
  const newNav = document.createElement(\"nav\");\ndocument.querySelector(\"main\"\
  ).prepend(newNav);\n```\n\n##### 步骤 3：向新元素添加文本和标签\n\n创建元素并将其添加到父元素后，最后一步是使用 `innerHTML`\
  \ 属性添加一些文本和标签：\n\n```javascript\nelement.innerHTML = text\n```\n\n* `element`: 指向新元素的引用，你想在其中添加文本和标签。\n\
  * `text`: 包含你想插入的文本和 HTML 标签的字符串\n\n![Warning](img/warning.png) 赋值给 `innerHTML`\
  \ 属性的任何值都会完全覆盖元素现有的文本和标签，因此在使用 `innerHTML` 时要小心。查看下一节了解如何插入文本和标签而不是覆盖它们。\n\n在这个示例中，代码创建了一个新的\
  \ `nav` 元素，将其插入到 `main` 元素的开头，然后添加了一个标题（bk04ch06/example10.html）：\n\n```javascript\n\
  const newNav = document.createElement(\"nav\");\ndocument.querySelector(\"main\"\
  ).prepend(newNav);\nnewNav.innerHTML = \"<h2>Navigation</h2>\";\n```\n\n##### 向元素插入文本或\
  \ HTML\n\n正如我在上一节中描述的，你可以使用元素的 `innerHTML` 属性来覆盖该元素的标签和文本。然而，通常你希望保留元素现有的标签和文本，并插入新的标签和文本。每个元素提供了几种方法可以实现这一点：\n\
  \n* **向元素中仅插入文本：** 使用 `insertAdjacentText()` 方法：\n\n  ```javascript\n  element.insertAdjacentText(location,\
  \ text)\n  ```\n\n  * `element`: 指向将插入新文本的元素引用。\n  * `location`: 指定你想插入文本位置的字符串。我稍后会概述你的选择。\n\
  \  * `text`: 包含你想插入的文本的字符串。\n\n* **向元素中插入标签和文本：** 使用 `insertAdjacentHTML()` 方法：\n\
  \n  ```javascript\n  element.insertAdjacentHTML(location, data)\n  ```\n\n  * `element`:\
  \ 指向将插入新标签和文本的元素引用。\n  * `location`: 指定你想插入标签和文本位置的字符串。我稍后会概述你的选择。\n  * `data`:\
  \ 包含你想插入的标签和文本的字符串。\n\n对于这两种方法，你可以使用以下字符串之一作为 `location` 参数：\n\n* `\"beforebegin\"\
  `：将数据插入到元素外部且紧邻元素之前\n* `\"afterbegin\"`：将数据插入到元素内部，在元素第一个子元素之前\n* `\"beforeend\"\
  `：将数据插入到元素内部，在元素最后一个元素之后\n* `\"afterend\"`：将数据插入到元素外部且紧邻元素之后\n\n例如，假设你的文档有以下元素：\n\
  \n`<h2 id=\"nav-heading\">Navigation</h2`\n\n如果你想将标题更改为 `Main Navigation`，以下代码将完成任务（bk04ch06/example10.html）：\n\
  \n```javascript\nconst navHeading = document.getElementById(\"nav-heading\");\n\
  navHeading.insertAdjacentText(\"afterbegin\", \"Main \");\n```\n\n#### 移除元素\n\n\
  如果你不再需要页面上的某个元素，可以使用该元素的 `remove()` 方法将其从 DOM 中删除：\n\n```javascript\nelement.remove()\n\
  ```\n\n例如，以下语句删除了页面上 `id` 值为 `temp-div` 的元素：\n\n```javascript\ndocument.getElementById(\"\
  temp-div\").remove();\n```\n\n### 使用 JavaScript 修改 CSS\n\n尽管你在静态样式表（`.css`）文件中指定了\
  \ CSS 规则，但并不意味着规则本身必须是静态的。通过 JavaScript 操作，你可以以多种方式修改元素的 CSS。你可以：\n\n* 读取 CSS 属性的当前值\n\
  * 修改 CSS 属性的值\n* 添加或移除类（class）\n* 切换类（class）的开启或关闭\n\n为什么要对你的 CSS 进行这些更改？你已经知道，设计良好的网页很大一部分是强大的\
  \ CSS 组件，它使用字体、颜色和间距创建一个易于阅读、导航合理且赏心眼目的页面。但所有这些都适用于显示给用户的初始页面。在你正在学习构建的动态 Web 应用中，页面会根据某些条件的变化而变化，例如用户点击按钮或按下按键。这种动态行为需要配合页面的动态变化，包括更改\
  \ CSS 以突出显示或反映发生的情况。\n\n#### 修改元素的样式\n\n\n\n\n\n大多数 HTML 标签都可以有一个 `style` 属性，你可以使用它来设置内联样式。由于标准属性都有对应的元素对象属性（我稍后会在“[使用\
  \ JavaScript 调整 HTML 属性”节中进行解释），你不会惊讶地发现，大多数元素也有一个 `style` 属性，允许你获取和修改标签的样式。它的工作原理如下：`style`\
  \ 属性实际上返回一个 `style` 对象，该对象拥有每个 CSS 属性对应的属性。在引用这些样式属性时，你需要记住两点：\n\n- 对于单单词 CSS 属性（如\
  \ `color` 和 `visibility`），使用全小写字母。\n- 对于多单词的 CSS 属性，去掉连字符，并将第二个单词（以及如果属性超过两个单词的后续每个单词）的首字母大写。例如，`font-size`\
  \ 和 `border-left-width` CSS 属性将变为 `style` 对象的 `fontSize` 和 `borderLeftWidth` 属性。\n\
  \n这是一个示例 (`bk04ch06/example12.html`)：\n\n```\nconst pageTitle = document.querySelector(\"\
  h1\");\npageTitle.style.fontSize = \"64px\";\npageTitle.style.color = \"maroon\"\
  ;\npageTitle.style.textAlign = \"center\";\npageTitle.style.border = \"1px solid\
  \ black\";\n```\n\n这段代码获取了页面上第一个 `<h1>` 元素的引用。获取该引用后，代码使用 `style` 对象为标题的四个属性设置了样式：`fontSize`、`color`、`text-align`\
  \ 和 `border`。\n\n#### 为元素添加类\n\n如果你在 CSS 中定义了一个类规则，你可以通过向元素标签上添加 `class` 属性，并将 `class`\
  \ 属性的值设置为你的类规则名称，从而将该规则应用到元素。\n\n首先，你可以使用 `classList` 属性获取元素已分配的类列表：\n\n`element.classList`\n\
  \n- `element`: 你正在操作的元素\n\n返回的类列表是一个类数组对象，包含一个 `add()` 方法，你可以使用该方法为元素现有的类添加新类：\n\
  \n`element.classList.add(\"class\")`\n\n- `element`: 你正在操作的元素。\n- `class`: 一个字符串，表示你想添加到\
  \ `element` 中的类名。你可以通过逗号分隔每个类名来添加多个类。\n\n这是一个示例 (`bk04ch06/example13.html`)，图 6-6\
  \ 显示了结果。\n\nCSS:\n```css\n.my-class {\n  display: flex;\n  justify-content: center;\n\
  \  align-items: center;\n  border: 6px dotted black;\n  font-family: Verdana, serif;\n\
  \  font-size: 2rem;\n  background-color: lightgray;\n}\n```\n\nHTML:\n```html\n\
  <div id=\"my-div\">\n  Hello World!\n</div>\n```\n\nJavaScript:\n```javascript\n\
  document.getElementById('my-div').classList.add('my-class');\n```\n\n![此代码使用 add()\
  \ 方法为 <div> 标签添加了名为 my-class 的类的截图。](img/9781394164684-fg040606.png)\n\n图 6-6： 此代码使用\
  \ `add()` 方法为 `<div>` 标签添加了名为 `my-class` 的类。\n\n![记住](img/remember.png) 如果元素中不存在\
  \ `class` 属性，`addClass()` 方法会将其插入标签。因此，在上一个示例中，代码执行后，`<div>` 标签现在如下：\n\n```html\n\
  <div id=\"my-div\" class=\"my-class\">\n```\n\n##### 移除类\n\n要从元素的 `class` 属性中移除类，`classList`\
  \ 对象提供了 `remove()` 方法：\n\n`element.classList.remove(\"class\")`\n\n- `element`:\
  \ 你正在操作的元素。\n- `class`: 一个字符串，表示你想从 `element` 中移除的类。你可以通过逗号分隔每个类名来移除多个类。\n\n这是一个示例：\n\
  ```javascript\ndocument.getElementById('my-div').classList.remove('my-class');\n\
  ```\n\n##### 切换类\n\nWeb 开发中非常常见的一个场景是网页元素在两种不同状态之间切换。例如，你可能希望根据复选框被选中或取消选中来更改元素的样式，或者你可能希望在用户点击元素标题时在显示和隐藏元素文本之间切换。\n\
  \n处理这种情况的一种方法是使用 `classList` 对象的 `add()` 方法在元素处于一种状态时添加特定类（例如，用户第一次点击元素头部），然后在元素处于另一种状态时使用\
  \ `remove()` 方法移除该类（例如，用户第二次点击元素头部）。\n\n### 使用 JavaScript 调整 HTML 属性\n\nDOM 的关键特性之一是每个标签都有属性。你可能在想，这些属性有属性吗？是的，它们有很多属性。例如，考虑以下\
  \ `<img>` 标签：\n\n```html\n<img id=\"header-image\" src=\"mangeen.png\" alt=\"Drawing\
  \ of a mangeen\">\n```\n\n该标签有三个属性：`id`、`src` 和 `alt`。在 DOM 对 `<img>` 标签的表示中，这些属性变成了属性。\n\
  \n然而，DOM 不为自定义属性或动态添加的属性创建属性。幸运的是，每个对象还提供了方法，允许你读取任何属性，并添加、修改或删除元素的属性。接几节将详细介绍。\n\
  \n#### 读取属性值\n\n如果你想读取元素某个属性的当前值，请使用元素对象的 `getAttribute()` 方法：\n\n`element.getAttribute(\"\
  attribute\")`\n\n- `element`: 你想要操作的元素\n- `attribute`: 你想要读取的属性名称\n\n这是一个示例，获取 `id`\
  \ 值为 `header-image` 的元素的 `src` 属性：\n\n```javascript\nconst headerImage = document.getElementById(\"\
  header-image\");\nconst srcHeaderImage = headerImage.getAttribute(\"src\");\n```\n\
  \n#### 设置属性值\n\n要为元素设置属性值，请使用元素对象的 `setAttribute()` 方法：\n\n`element.setAttribute(\"\
  attribute\", \"value\")`\n\n- `element`: 你想要操作的元素\n- `attribute`: 你想要设置的属性名称\n-\
  \ `value`: 你想赋值给 `attribute` 的字符串值\n\n如果属性已存在，`setAttribute` 将覆盖该属性的当前值；如果属性不存在，`setAttribute`\
  \ 将将其添加到元素中。\n\n\n\n\n\n```javascript\nconst headerImage = document.getElementById(\"\
  header-image\");\nheaderImage.setAttribute(\"alt\", \"Lithograph of a mangosteen\"\
  );\n```\n\n### 移除属性\n\n要从元素中移除属性，请使用元素对象的 `removeAttribute()` 方法：\n\n```javascript\n\
  element.removeAttribute(attribute);\n```\n\n*   `element`: 你想要操作的元素\n*   `attribute`:\
  \ 一个字符串，指定你想要从元素中移除的属性名称\n\n这里有一个示例：\n\n```javascript\nconst headerImage = document.getElementById(\"\
  header-image\");\nheaderImage.removeAttribute(\"id\");\n```\n\n### 使用事件构建响应式页面\n\
  \n当你买了一辆车，无论你付了多少钱，无论它的技术有多先进，除非你做些什么，否则汽车只会停呆在那里。（如果你是在所有汽车都是自动驾驶的未来阅读这段文字，我深表歉。）如果是一辆漂亮的车，停呆在那里可能没关系，但你可能想让车做些什么，任何事情。以下是你为了实现该目标可以采取的操作短列表：\n\
  \n*   启动汽车。\n*   将变速箱挂入档。\n*   按下加速板。\n*   打开收音机。\n\n所有这些的共同点是它们建立了一个汽车必须以某种方式做出响应的情境：开启、接合档位、移动、播放声音。从这个角度来看，汽车是一台对外部刺激做出响应的机器，或者说，是对事件做出响应的机器。\n\
  \n令人惊讶的是，网页也是一台对外部刺激做出响应的机器。继续阅读以了解我的意思。\n\n#### 什么是事件？\n\n在 Web 开发中，*事件*是响应某些外部刺激而发生的动作。外部刺激的一种常见类型是用户与网页的交互。以下是一些示例：\n\
  \n*   浏览到页面或重新加载页面\n*   点击按钮\n*   按下按键\n*   滚动页面\n\n你的网页如何可能知道这些动作中的任何一个何时发生？秘密在于\
  \ JavaScript 在设计时就考虑了事件。正如计算机科学教授所说的，JavaScript 是一种*事件驱动*的语言。\n\n那么，为什么网页不自动对事件做出响应呢？它们为什么只停呆在那里？因为网页默认是*静态的*，这意味着它们忽略了周围不断触发的事件。作为\
  \ Web 开发人员，你的工作是通过让你的网页“监听”特定事件的发生来改变这种行为。你通过设置称为*事件处理器*的特殊代码块来实现这一点，这些代码实际上是在说：“亲，请留意事件\
  \ X 的发生，好吗？当它发生时，请好心执行我在这里为你放置的代码。非常感谢。”一个事件处理器由两部分组成：\n\n*   **事件监听器 (Event listener):**\
  \ 一个给浏览器的指令，让它关注（“监听”）在特定元素上发生的特定事件。\n*   **回调函数 (Callback function):** 当浏览器检测到事件已发生时所执行的代码。\n\
  \n在本章的剩余部分中，我将介绍如何使用 JavaScript 构建你自己的事件处理器，并将你的脚本提升到更具交互性的水平。\n\n#### 理解事件类型\n\n\
  你的网页可以响应的事件有几十种，但幸运的是，在大多数的日常 Web 开发中，只需要这些事件中的一小部分子集。我将它们分为以下五类：\n\n*   **Document（文档）：**\
  \ 与 `document` 对象加载相关的触发事件。在这里你需要担心的唯一事件是 `DOMContentLoaded`，它在 `document` 对象完成加载时触发。\n\
  *   **Mouse（鼠标）：** 当用户使用鼠标（或类似设备，如触控板或触摸屏）进行操作时触发的事件。此类类别中最重要的事件是 `click`（用户点击鼠标）；`dblclick`（用户双击鼠标）；以及\
  \ `mouseover`（用户将鼠标指针移动到元素上方）。\n*   **Keyboard（键盘）：** 当用户与键盘交互时触发的事件。此类类别中的主要事件是\
  \ `keypress`，它在用户按下按键时触发。\n*   **Form（表单）：** 与网页表单相关的事件。重要的有 `focus`（元素获得焦点，例如用户通过\
  \ Tab 键切换到表单控件时）；`blur`（元素失去焦点）；`change`（用户更改表单控件的值）；以及 `submit`（用户提交表单）。查看第 4 本书的第\
  \ 11 章 了解表单和表单事件。\n*   **Browser window（浏览器窗口）：** 当用户与浏览器窗口交互时触发的事件。这里的两个主要事件是 `scroll`（用户垂直或水平滚动窗口时触发）和\
  \ `resize`（当更改更改窗口宽度或高度时触发）。\n\n你通过使用元素对象的 `addEventListener()` 方法设置事件处理器，来配置你的代码去监听并响应事件。以下是语法：\n\
  \n```javascript\nelement.addEventListener(event, callback);\n```\n\n*   `element`:\
  \ 要监控该事件的网页元素。该事件被认为*绑定*到该元素。\n*   `event`: 一个字符串，指定你希望让浏览器监听的事件名称。对于我在上一节中提到的主要事件，请使用以下括在内的内容之一：`DOMContentLoaded`,\
  \ `click`, `dblclick`, `mouseover`, `keypress`, `focus`, `blur`, `change`, `submit`,\
  \ `scroll` 或 `resize`。\n*   `callback`: JavaScript 在事件发生时执行的回调函数。回调可以是匿名函数或指向命名函数的引用。\n\
  \n这里有一个示例 (bk04ch06/example15.html)：\n\nHTML:\n```html\n<div id=\"my-div\"></div>\n\
  <button id=\"my-button\">Click to add some text, above</button>\n```\n\nJavaScript:\n\
  ```javascript\nconst myButton = document.getElementById('my-button');\nmyButton.addEventListener('click',\
  \ function() {\n  const myDiv = document.getElementById('my-div');\n  myDiv.innerHTML\
  \ = '<h1>Hello Click World!</h1>';\n});\n```\n\nHTML 设置了一个空的 `div` 元素和一个 `button`\
  \ 元素。JavaScript 代码在按钮上挂载了一个 `click` 事件监听器，回调函数将 HTML 字符串 `<h1>Hello Click World!</h1>`\
  \ 添加到 `div` 中。图 6-7 显示了点击按钮后的结果页面。\n\n![点击事件回调函数向 div 元素添加了一些 HTML 和文本的截图](img/978139416484-fg04607.png)\n\
  \n![提示](img/tip.png) 如果你想在网页文档加载后运行某些代码，请向 `document` 对象添加一个监听 `DOMContentLoaded`\
  \ 事件的事件处理器 (bk04ch06/example16.html)：\n\n```javascript\ndocument.addEventListener('DOMContentLoaded',\
  \ function() {\n  console.log('We are loaded!');\n});\n```\n\n#### 获取有关事件的数据\n\n\
  当一个事件被触发时，DOM 会创建一个 `Event` 对象，其属性包含有关事件的信息，包括：\n\n*   `target`: 事件发生时的网页元素。例如，如果你为\
  \ `div` 元素设置了 `click` 处理器，那么该 `div` 就是点击的目标。\n*   `which`: 一个数字代码，用于指定在 `keypress`\
  \ 事件期间按下的按键。\n*   `pageX`: 事件触发时，鼠标指针距离浏览器内容区域左边缘的距离（像素）。\n*   `pageY`: 事件触发时，鼠标指针距离浏览器内容区域顶边缘的距离（像素）。\n\
  *   `metaKey`: 一个布尔值，如果在事件触发时用户按住了 Windows 键 (![image](img/windows.png)) 或 Mac Command\
  \ 键 (⌘  )，则该值为 `true`。\n*   `shiftKey`: 一个布尔值，如果事件触发时用户按住了 Shift 键，则该值为 `true`。\n\
  \n要访问这些属性，你需要在事件处理器的回调函数中将 `Event` 对象的名称作为参数插入：\n\n\n\n\n\n```javascript\nelement.addEventListener(event,\
  \ function(e) {\n  // 此代码在事件触发时运行\n});\n```\n\n*   `e`: DOM 在事件触发时生成的 `Event` 对象的名称。你可以使用任何喜欢的名称，但大多数编码人员使用\
  \ `e`（尽管 `evt` 和 `event` 也很常见）。\n\n例如，在处理 `keypress` 事件时，你需要访问 `which` 属性来查找用户按下的按键代码。这里有一个示例页面，可以帮助你确定应该使用哪种代码值（bk04ch06/example17.html）：\n\
  \n#### HTML:\n```html\n<div>\n  输入一个按键：\n</div>\n<input id=\"key-input\" type=\"\
  text\">\n<div>\n  这里是你按下的按键的代码：\n</div>\n<div id=\"key-output\">\n</div>\n```\n\n\
  #### JavaScript:\n```javascript\nconst keyInput = document.getElementById('key-input');\n\
  keyInput.addEventListener('keypress', function(e) {\n  const keyOutput = document.getElementById('key-output');\n\
  \  keyOutput.innerHTML = e.which;\n});\n```\n\nHTML 设置了一个 `<input>` 标签来接收按键输入，以及带有\
  \ `id=\"key-output\"` 的 `div` 标签用于输出。JavaScript 代码为 `input` 元素添加了 `keypress` 事件监听器，当事件触发时，回调函数会将\
  \ `e.which` 写入输出 `div`。图 6-8 显示了该页面的运行情况。\n\n![在输入框中输入按键的截图，keypress 事件回调函数使用 e.which\
  \ 将按下按键的数字代码写入 div 元素](img/9781394164684-fg040608.png)\n\n图 6-8： 在输入框中输入一个按键，`keypress`\
  \ 事件回调函数使用 `e.which` 将按下按键的数字代码写入 `div` 元素。\n\n#### 防止默认事件动作\n\n![提示](img/tip.png)\
  \ 某些事件在触发时会执行默认动作。例如，链接的 `click` 事件会打开目标 URL，而表单的 `submit` 事件会将表单数据发送到服务器上的脚本。大多数时候，这些默认动作正是你所想要的，但并非总是如此。例如，你可能想拦截链接点击以执行某些自定义操作，例如显示菜单。同样，与其让浏览器提交表单，你可能更喜欢处理表单数据然后通过你的脚本发送数据。\n\
  \n对于这些以及许多类似的情况，你可以通过运行 `Event` 对象的 `preventDefault()` 方法来告诉浏览器不要执行事件的默认动作：\n\n\
  ```javascript\nevent.preventDefault();\n```\n\n*   `event`: DOM 在事件触发时创建的 `Event`\
  \ 对象的引用。\n\n例如，查看以下代码（bk04ch06/example18.html）：\n\n#### HTML:\n```html\n<a href=\"\
  https://wiley.com/\">Wiley</a><br>\n<a href=\"https://262.ecma-international.org/6.0/\"\
  >ECMAScript 2015 Spec</a><br>\n<a href=\"https://webdev.mcfedries.com/tools/workbench/\"\
  >WebDev Workbench</a>\n<div id=\"output\">\n  Link URL:\n</div>\n```\n\n#### JavaScript:\n\
  ```javascript\nconst links = document.getElementsByTagName('a')\nfor (const link\
  \ of links) {\n  link.addEventListener('click', function(e) {\n    e.preventDefault();\n\
  \    strURL = e.target.href;\n    document.getElementById('output').innerHTML =\
  \ 'Link URL: ' + strURL;\n  })\n}\n```\n\nHTML 定义了三个链接（样式为内联块，我在此处未显示）和一个 `div`\
  \ 元素。JavaScript 使用 `for...of` 循环为所有 `a` 元素设置了 `click` 事件监听器，回调函数执行了三件事：\n\n*   它使用\
  \ `e.preventDefault()` 方法告诉浏览器不要导航到链接地址。\n*   它使用 `e.target.href` 获取链接的 URL。\n*\
  \   它在 `div` 元素中显示该 URL。图 6-9 显示了一个示例。\n\n![使用 e.preventDefault() 停止浏览器导航到链接 URL\
  \ 的截图](img/9781394164684-fg00609.png)\n\n图 6-9： 你可以使用 `e.preventDefault()` 停止浏览器导航到链接\
  \ URL。\n\n## 第 7 章\n### 数组操作\n\n### 本章内容\n\n*   学习数组能为你做什么\n*   声明数组变量\n*   为数组填充数据\n\
  *   遍历数组\n*   尝试多维数组\n*   使用 JavaScript 的 `Array` 对象\n\n#### 什么是数组？\n\n不必要的重复的一个常见来源是变量的使用。例如，考虑以下声明（查看\
  \ bk0407/example01.html）：\n\n```javascript\nconst dog1 = \"dog-1\";\nconst dog2\
  \ = \"dog-2\";\nconst dog3 = \"dog-3\";\nconst dog4 = \"dog-4\";\nconst dog5 = \"\
  dog-5\";\n```\n\n这些是字符串变量，存储了某些狗照片的名字。这段代码看起来可能并不低效，但如果你拥有的不是 5 张图片，而是 10 张、20 张甚至\
  \ 100 张呢？我确定，输入 100 个 `const` 声明绝不是你想要的好办法。\n\n要理解解决此办法的方法，首先要理解 `dog1` 到 `dog5`\
  \ 都包含相关的值。也就是说，每个变量都持有某个狗的文件名，而该文件名又是该图片完整 URL 的一部分。在 JavaScript（或者实际上在几乎任何编程语言）中，每当你有一组具有相关数据的变量时，你就可以将它们组合成名为*数组*的单个变量。你可以向数组中输入任意多个值，JavaScript\
  \ 通过使用*索引数字*来跟踪每个值。例如，你添加的第一个值赋予索引 0（出于某些模糊的原因，自古以来程序员的数字列表从 0 开始而不是 1 开始）。你放入数组的第二个值赋予索引\
  \ 1；第三个赋予 2；以此此类推。然后你可以通过指定索引数字来访问数组中的任何值。\n\n#### 声明数组\n\n由于数组是一种变量类型，你需要在使用它之前对其进行声明。事实上，与那些并不需要声明（但始终应该声明）的普通数字、字符串或布尔变量不同，JavaScript\
  \ 强制要求预先声明数组。你再次使用 `const`（或 `let`）语句，但这次使用的语法稍有不同。实际上，有四种你可以使用的语法。这里是信息量最大的语法：\n\
  \n```javascript\nconst arrayName = new Array();\n```\n\n在这里，`arrayName` 是你想要数组变量使用的名称。\n\
  \n\n\n\n\n在 JavaScript 中，数组实际上是一个对象，因此 `new` 关键字在这里的作用是创建一个新的 `Array` 对象。语句中的 `Array()`\
  \ 部分被称为*构造函数*（constructor），因为它的工作是在内存中构建该对象。例如，若要创建一个名为 `dogPhotos` 的新数组，你可以使用以下语句：\n\
  \n```javascript\nconst dogPhotos = new Array();\n```\n\n如果你预先知道要放入数组中的值（或*元素*）的数量，那么第二种语法就会很有用：\n\
  \n```javascript\nconst arrayName = new Array(num);\n```\n\n* `arrayName`: 你想要为数组变量使用的名称\n\
  * `num`: 你将放入数组中的值数量 \n\n例如，这里有一条声明具有五个元素的新型 `dogPhotos` 数组的语句：\n\n```javascript\n\
  const dogPhotos = new Array(5);\n```\n\n如果你不确定需要多少个元素，不用担心，因为 JavaScript 乐意让你根据需要向数组中添加或删除元素，并且它会自动扩展或缩小数组以进行补偿。我将在下一节中介绍另外两种数组声明语法。\n\
  \n### 为数组填充数据\n\n在声明数组之后，你可以开始向其填充想要存储的数据值。这是执行此操作的通用语法：\n\n```javascript\narrayName[index]\
  \ = value;\n```\n\n* `arrayName`: 数组变量的名称\n* `index`: 你想要存储值的数组索引数字\n* `value`:\
  \ 你存储在数组中的值\n\nJavaScript 乐意在数组放入几乎任何类型的数据，包括数字、字符串、布尔值甚至是其他数组！你甚至可以在单个数组中混合多种数据类型。\n\
  \n![Tip](img/tip.png) 你最常见的操作是在数组末尾添加新元素。幸运的是，`Array` 对象有一个特殊的方法可以执行此操作。它被称为 `push()`，我将在本章后面的部分讨论它（具体是在“向数组末尾添加元素：push()”部分）。\n\
  \n作为一个示例，这里有几条声明名为 `dogPhotos` 的新数组并然后向数组输入五个字符串值的语句：\n\n```javascript\nconst dogPhotos\
  \ = new Array(5);\ndogPhotos[0] = \"dog-1\";\ndogPhotos[1] = \"dog-2\";\ndogPhotos[2]\
  \ = \"dog-3\";\ndogPhotos[3] = \"dog-4\";\ndogPhotos[4] = \"dog-5\";\n```\n\n要引用数组值（例如，为了在表达式中使用它），你需要指定相应的索引：\n\
  \n```javascript\nstrURL + dogPhotos[3]\n```\n\n以下代码提供了一个完整的示例（查看 bk04ch078/example02.html）：\n\
  \nHTML:\n\n```html\n<div id=\"output\"></div>\n```\n\nJavaScript:\n\n```javascript\n\
  // Declare the array\nconst dogPhotos = new Array(5);\n// Initialize the array values\n\
  dogPhotos[0] = \"dog-1\";\ndogPhotos[1] = \"dog-2\";\ndogPhotos[2] = \"dog-3\";\n\
  dogPhotos[3] = \"dog-4\";\ndogPhotos[4] = \"dog-5\";\n// Display an example\ndocument.getElementById('output').innerHTML\
  \ = '<img src=\"images/' + dogPhotos[0] + '.png\" alt=\"\">';\n```\n\n#### 同时声明并填充数组\n\
  \n之前我提到 JavaScript 有其他两种声明数组语法。这两种方法都允许你仅使用一条语句声明数组*并*为其填充值。\n\n第一种方法使用以下通用格式的 `Array()`\
  \ 构造函数：\n\n```javascript\nconst arrayName = new Array(value1, value2, ...);\n```\n\
  \n* `arrayName`: 你想要为数组变量使用的名称\n* `value1`, `value2`, ...`: 你想要填充数组的初始值\n\n这是一个示例：\n\
  \n```javascript\nconst dogPhotos = new Array(\"dog-1\", \"dog-2\", \"dog-3\", \"\
  dog-4\", \"dog-5\");\n```\n\nJavaScript 还支持创建*数组字面量*（array literals），它们与字符串、数字和布尔字面量类似。就像你通过引号包含值来创建字符串字面量一样，你通过用方括号包含一个或多个值来创建数组字面量。其通用格式如下：\n\
  \n```javascript\nconst arrayName = [value1, value2, ...];\n```\n\n* `arrayName`:\
  \ 你想要为数组变量使用的名称\n* `value1`, `value2`, ...`: 你想要填充数组的初始值\n\n一个示例：\n\n```javascript\n\
  const dogPhotos= [\"dog-1\", \"dog-2\", \"dog-3\", \"dog-4\", \"dog-5\"];\n```\n\
  \n![Remember](img/remember.png) 在数组字面量的声明中包含值是可选的，这意味着你可以使用以下语句声明空数组：\n\n```javascript\n\
  const arrayName = [];\n```\n\n大多数 JavaScript 程序员更倾向于使用这种语法而不是 `Array` 构造函数。\n\n\
  #### 使用循环填充数组\n\n到目前为止，你可能认为数组并没有比使用单独的变量高效多少。这是因为你还没有学习处理数组最强大的一个方面：使用循环和某种计数器变量通过程序方式访问数组的索引号。\n\
  \n例如，这里有一个 `for()` 循环替换了之前用于声明和初始化 `dogPhotos` 数组的六条语句：\n\n```javascript\nconst\
  \ dogPhotos = [];\nfor (let counter = 0; counter < 5; counter += 1) {\n    dogPhotos[counter]\
  \ = \"dog-\" + (counter + 1);\n}\n```\n\n`for()` 循环内部的语句使用变量 `counter` 作为数组的索引。例如，当\
  \ `counter` 为 `0` 时，语句看起来如下：\n\n```javascript\ndogPhotos[0] = \"dog-\" + (0 + 1);\n\
  ```\n\n在这种情况下，等号右边的表达式求值为 `\"dog-1\"`。以下代码显示了这个循环的运行（bk04ch08/example03.html）：\n\
  \nHTML:\n\n```html\n<div id=\"output\"></div>\n```\n\nJavaScript:\n\n```javascript\n\
  // Declare the array\nconst dogPhotos = [];\n// Initialize the array values using\
  \ a loop\nfor (let counter = 0; counter < 5; counter += 1) {\n    dogPhotos[counter]\
  \ = \"dog-\" + (counter + 1);\n}\n// Display an example\ndocument.getElementById('output').innerHTML\
  \ = '<img src=\"images/' + dogPhotos[0] + '.png\" alt=\"\">';\n```\n\n### 如何迭代？让我数数方法\n\
  \n使用大量变量的真正问题不在于声明它们，而是在如何操作它们。这里有一个示例（bk04ch07/example01.html）：\n\n```javascript\n\
  const dog1 = \"dog-1\";\nconst dog2 = \"dog-2\";\nconst dog3 = \"dog-3\";\nconst\
  \ dog4 = \"dog-4\";\nconst dog5 = \"dog-5\";\n\nconst promptNum = prompt(\"Enter\
  \ the dog you want to see (1-5):\", \"\");\n\nif (promptNum !== \"\" && promptNum\
  \ !== null) {\n    const promptDog = \"dog-\" + promptNum;\n    if (promptDog ===\
  \ dog1) {\n        document.body.style.backgroundImage = \"url('images/\" + dog1\
  \ + \".png')\";\n    } else if (promptDog === dog2) {\n        document.body.style.backgroundImage\
  \ = \"url('images/\" + dog2 + \".png')\";\n    } else if (promptDog === dog3) {\n\
  \        document.body.style.backgroundImage = \"url('images/\" + dog3 + \".png')\"\
  ;\n    } else if (promptDog === dog4) {\n        document.body.style.backgroundImage\
  \ = \"url('images/\" + dog4 + \".png')\";\n    } else if (promptDog === dog5) {\n\
  \        document.body.style.backgroundImage = \"url('images/\" + dog5 + \".png')\"\
  ;\n    }\n}\n```\n\n在这个示例中，脚本必须使用五个独立的 `if()` 测试来将输入值与五个变量进行比较。数组可以真正帮助让你的代码更高效，因为它允许你将这类类冗长的程序精简为位于函数内部的短小例程。这些例程是\
  \ `Array` 对象的迭代方法，其中*迭代*意味着该方法遍历数组中的项，并且对于每个项，一个函数（称为*回调*函数）会对该项执行或结合项执行某些操作。\n\n\
  \n\n\n\n`Array` 对象实际上有十四种迭代方法。我没有对它们全部介绍，但在接下来的几个章节中，我将介绍最实用的方法。\n\n#### 遍历数组：forEach()\n\
  \n`Array` 对象的 `forEach()` 方法为数组中的每个元素执行一次回调函数。该回调最多接受三个参数：\n\n* `value`：元素的值\n*\
  \ `index`:（可选）元素的数组索引\n* `array`:（可选）正在被迭代的数组\n\n你可以使用以下任何一种语法：\n\n* `array.forEach(namedFunction);`\n\
  * `array.forEach(function (value, index, array) { code });`\n* `array.forEach((value,\
  \ index, array) => { code }); });`\n\n* `array`：你想要遍历的 `Array` 对象。\n* `namedFunction`：一个现有函数的名称。该函数应该接受\
  \ `value` 参数，可能还会接收可选的 `index` 和 `array` 参数。\n* `code`：在每次迭代期间执行的语句。\n\n这是一个示例（`bk04ch07/example04.html`）：\n\
  \n```javascript\n// Declare the array\nconst dogPhotos= [\"dog-1\", \"dog-2\", \"\
  dog-3\", \"dog-4\", \"dog-5\"];\n// Iterate through the array\ndogPhotos.forEach((value,\
  \ index) => {\n  console.log(\"Element \" + index + \" has the value \" + value);\n\
  });\n```\n\n声明数组后，代码使用 `forEach()` 遍历数组。在每次迭代期间，`console.log()`（参见第 4 本，第 10 章）会显示包含\
  \ `index` 和 `value` 参数的字符串。图 7-1 显示了结果。\n\n![Tip](img/tip.png) 要在大多数网页浏览器中显示控制台，请右键点击网页，点击“检查”（在\
  \ Windows 上按 Ctrl+Shift+I，或在 macOS 上按 Option+⌘  +I），然后点击“控制台”标签页。\n\n![使用 forEach()\
  \ 每次迭代时显示的控制台消息截图](img/9781394164684-fg040701.png)\n\n图 7-1： 使用 `forEach()` 每次迭代时显示的控制台消息。\n\
  \n#### 遍历数组：for…of\n\n虽然你通常使用 `forEach()` 方法遍历数组，但有时你可能需要更传统的循环来遍历每个数组元素。那种循环类型是\
  \ `for…of` 循环：\n\n```javascript\nfor (element of array) {\n  code\n}\n```\n\n* `array`：你想要遍历的\
  \ `Array` 对象\n* `element`：循环每次通过期间的当前数组元素\n* `code`：在每次迭代期间执行的语句\n\n![Remember](img/remember.png)\
  \ `for…of` 循环是在 ECMAScript 2015 (ES6) 中引入的，如果你需要支持旧版浏览器（如 Internet Explorer 11），请不要使用它。\n\
  \n这是一个示例（`bk04ch07/example04a.html`）：\n\n```javascript\n// Declare the array\nconst\
  \ dogPhotos= [\"dog-1\", \"dog-2\", \"dog-3\", \"dog-4\", \"dog-5\"];\n// Iterate\
  \ through the array\nfor (const currentPhoto of dogPhotos) {\n  console.log(\"The\
  \ current element has the value \" + currentPhoto);\n}\n```\n\n声明数组后，代码使用 `for…of`\
  \ 循环遍历数组。在每次迭代期间，`console.log()`（参见第 4 本，第 10 章）会显示包含当前元素值的字符串。\n\n#### 遍历测试数组元素：every()\
  \ 和 some()\n\n一种常见的数组模式是检查每个数组元素的值，以判断某些或所有值是否通过了某个测试。例如，如果你有一个以十进制值表示的利率数组，你可能想测试它们是否都在一个合理的范围内（例如，在\
  \ 0.01 到 0.1 之间）。同样，假设你有一个数字数组，这些数字在脚本的某处将用作计算的除数。在进行该操作之前，你可能想确定数组中至少有一个数字为零，如果是这样，你的脚本将跳过计算。\n\
  \n##### 测试是否所有元素都通过测试：every()\n\n要检查数组中的所有元素是否都通过了某个测试，请使用 `Array` 对象的 `every()`\
  \ 方法。有三种语法可以使用：\n\n* `array.every(namedFunction);`\n* `array.every(function (value,\
  \ index, array) { code });`\n* `array.every((value, index, array) => { code });`\n\
  \n* `array`：你想要遍历的 `Array` 对象。\n* `namedFunction`：一个现有函数的名称。该函数应该接受 `value` 参数，可能还会接收可选的\
  \ `index` 和 `array` 参数。\n* `code`：在每次迭代期间执行的语句。\n\n这是一个示例（`bk04ch07/example05.html`）：\n\
  \n```javascript\n// Declare the array\nconst rates = [0.05, 0.07, 0.01, 0.1];\n\
  // Test whether 所有 elements 均在 0.01 到 0.1 之间\nconst allInRange = rates.every(currentValue\
  \ => {\n  return currentValue >= 0.01 && currentValue <= 0.1;\n});\n// 输出 the result\n\
  console.log(allInRange);\n```\n\n声明数组后，代码使用 `forEach()` 遍历数组。在每次迭代期间，`console.log()`（参见第\
  \ 4 本，第 10 章）会显示包含 `index` 和 `value` 参数的字符串。图 7-1 显示了结果。\n\n![Remember](img/remember.png)\
  \ `for…of` 循环是在 ECMAScript 2015 (ES6) 中引入的，如果你需要支持旧版浏览器（如 Internet Explorer 11），请不要使用它。\n\
  \n（注：原文中 `every()` 示例提供的文本被截断或错乱；我已根据提供的上下文重新构建了逻辑，以维护文档质量。）\n\n\n\n\n\n![some()\
  \ 方法最终结果（在此例中为 true）的截图](img/9781394164684-fg040703.png)\n\n图 7-3： `some()` 方法的最终结果（在此例中为\
  \ `true`）。\n\n#### 遍历并创建新数组：`map()`\n\n当你遍历数组时，通常会对每个元素值应用某些操作。然而，在某些情况下，你希望保留原始数组的值，并创建一个包含更新后值的新数组。\n\
  \n创建一个存储现有数组更新后值的新数组的最简单方法是使用 `Array` 对象的 `map()` 方法。你可以使用三种语法：\n\n* `array`.map(`namedFunction`);;\n\
  * `array`.map(function (`value`, `index`, `array`) { `code` });\n* `array`.map((value`,\
  \ `index`, `array`) => { `code` });\n\n* `array`: 包含你想要使用的值的 `Array` 对象。\n* `namedFunction`:\
  \ 对每个数组值执行操作的现有函数名称。该函数应该接受 `value` 参数，可能还可以接收可选的 `index` 和 `array` 参数。\n* `code`:\
  \ 在每次迭代期间运行的语句，用于对每个值执行操作。\n\n`map()` 方法返回一个包含更新后值的 `Array` 对象，因此务必将结果存储在变量中。\n\n\
  这是一个示例 (bk04ch07/example07.html)：\n\n```javascript\n// 声明一个华华氏温度数组\nconst tempsFahrenheit\
  \ = [-40, 0, 32, 100, 212];\n// 将每个数组值转换为摄氏度\nconst tempsCelsius = tempsFahrenheit.map(currentTemp\
  \ => {\n  return (currentTemp - 32) * 0.5556;\n});\n// 输出结果\nconsole.log(tempsCelsius);\n\
  ```\n\n这段代码声明了一个华华氏温度数组，然后 `map()` 方法遍历 `tempsFahrenheit` 数组，并在每次通过时将当前的华华氏值（存储在参数\
  \ `currentTemp` 中）转换为摄氏度。结果是一个名为 `tempsCelsius` 的新数组，该数组显示在控制台中，如图 7-4 所示。\n\n![map()\
  \ 方法通过对原始数组中的每个值应用操作创建一个新数组的截图](img/9781394164684-fg040704.png)\n\n图 7-4： `map()`\
  \ 方法通过对原始数组中的每个值应用操作创建一个新数组。\n\n#### 将数组归约为单个值：`reduce()`\n\n一种常见的迭代模式是对数组中的每个元素执行累加操作以产生一个值。例如，你可能想知道数组中所有值的和。\n\
  \n以这种方式遍历数组并产生值是 `Array` 对象的 `reduce()` 方法的工作。你可以使用三种语法：\n\n* `array`.reduce(`namedFunction`,\
  \ `initialValue`);\n* `array`.reduce(function (`accumulator`, `value`, `index`,\
  \ `array`) { `code` }, `initialValue`);\n* `array`.reduce((accumulator`, `value`,\
  \ `index`, `array`) => { `code` }, `initialValue`);\n\n* `array`: 包含你想要归约值的 `Array`\
  \ 对象。\n* `namedFunction`: 对每个数组值执行归约操作的现有函数名称。该函数应该接受 `accumulator` 和 `value` 参数，可能还可以接收可选的\
  \ `index` 和 `array` 参数。\n* `code`: 在每次迭代期间运行的语句，用于对每个值执行归约操作。\n* `initialValue`:\
  \ `accumulator` 的起始值。如果你省略了 `initialValue`，JavaScript 将使用 `array` 中第一个元素的值。\n\n\
  这是一个示例 (bk04ch07/example08.html)：\n\n```javascript\n// 声明产品库存数组\nconst unitsInStock\
  \ = [547, 213, 156, 844, 449, 71, 313, 117];\n// 获取库存总数\nconst initialUnits = 0;\n\
  const totalUnits = unitsInStock.reduce((accumulatedUnits, currentInventoryValue)\
  \ => {\n  return accumulatedUnits + currentInventoryValue;\n}, initialUnits);\n\
  // 输出结果\nconsole.log(\"Total units in stock: \" + totalUnits);\n```\n\n这段代码声明了一个产品库存数组，并声明了值为\
  \ `0` 的 `initialUnits`。然后 `reduce()` 方法（使用 `initialUnits` 作为累加器的起始值）遍历 `unitsInStock`\
  \ 数组，并在每次通过时将当前产品库存值（存储在参数 `currentInventoryValue` 中）加到累加器（存储在参数 `accumulatedUnits`\
  \ 中）。生成的总和存储在变量 `totalUnits` 中，然后显示在控制台中，如图 7-5 所示。\n\n![reduce() 方法将数组值归约为单个值的截图](img/9781394164684-fg040705.png)\n\
  \n图 7-5： `reduce()` 方法将数组值归约为单个值。\n\n#### 遍历以定位元素：`find()`\n\n要在数组中搜索符合某些条件的第一个元素，请使用\
  \ `Array` 对象的 `find()` 方法。你可以使用三种语法：\n\n* `array`.find(`namedFunction`);\n* `array`.find(function\
  \ (`value`, `index`, `array`) { `code` });\n* `array`.find((value`, `index`, `array`)\
  \ => { `code` });\n\n* `array`: 包含你想要使用的值的 `Array` 对象。\n* `namedFunction`: 对每个数组值执行操作的现有函数名称。该函数应该接受\
  \ `value` 参数，可能还可以接收可选的 `index` 和 `array` 参数。\n* `code`: 在每次迭代期间运行的语句，用于对每个值执行操作。\n\
  \n`find()` 方法返回测试为 `true` 的第一个元素，如果没有元素通过测试，则返回 `undefined`。\n\n这是一个示例 (bk04ch07/example08a.html)：\n\
  \n```javascript\n// 声明一个对象数组\nconst products = [\n  { name: 'doodad', units: 547\
  \ },\n  { name: 'gizmo', units: 213 },\n  { name: 'gimcrackery', units: 156 },\n\
  \  { name: 'knickknack', units: 844 },\n  { name: 'bric-a-brac', units: 449 },\n\
  \  { name: 'thingamajig', units: 71 },\n  { name: 'watchamacallit', units: 313 },\n\
  \  { name: 'widget', units: 117 }\n];\n// 查询数组\nconst strQuery = \"gizmo\";\nconst\
  \ stock = products.find((currentProduct) => {\n  return currentProduct.name ===\
  \ strQuery;\n});\n// 输出结果\nif (stock) {\n  console.log(\"Product \" + stock.name\
  \ + \" has \" + stock.units + \" units in stock.\");\n} else {\n  console.log(\"\
  Product \" + strQuery + \" not found.\");\n}\n```\n\n这段代码声明了一个对象字面量数组。然后 `find()`\
  \ 方法遍历 `products` 数组，并在每次通过时检查当前数组元素值（通过参数 `currentProduct` 传递给回调函数）的 `name` 属性是否与变量\
  \ `strQuery` 中存储的值相等。结果存储在变量 `stock` 中。通过 `if` 测试检查结果：如果 `stock` 已定义，则在控制台中显示产品名称和库存；否则，显示一条未找到产品的消息。\n\
  \n![提示](img/tip.png) 如果你想知道符合条件的数组项的索引数字，请使用 `findIndex()` 代替 `find()`。\n\n### 创建多维数组\n\
  \n*多维数组*是指每个数组元素中存储了两个或多个值的数组。例如，如果你想创建一个数组来存储用户数据，你可能需要每个元素存储名字、姓氏、用户名、密码等。坏消息是\
  \ JavaScript 不支持多维数组。好消息是，你可以使用技巧来模拟多维数组。\n\n\n\n\n这种技巧是这样填充你的数组：使得每个元素本身也是一个数组。为了理解这个奇特的想法是如何运作的，首先回想数组字面量的通用语法：\n\
  \n`[value1, value2, …]`\n\n现在回想给数组元素赋值的通用语法：\n\n`arrayName[index] = value;`\n\n\
  在在一个一维数组中，`value` 通常是字符串、数字或布尔值。现在，想象一下，如果 `value` 是一个数组字面量。对于二维数组，将数组字面量赋值给数组元素的通用语法如下：\n\
  \n`arrayName[index] = [value1, value2];`\n\n例如，假设你想存储一个包含背景颜色和前景色的数组。以下是你如何声明并填充这样一个数组：\n\
  \n```javascript\nconst colorArray = [];\ncolorArray[0] = ['white', 'black'];\ncolorArray[1]\
  \ = ['aliceblue', 'midnightblue'];\ncolorArray[2] = ['honeydew', 'darkgreen'];\n\
  ```\n\n或者，你也可以仅数组字面量符号来声明并填充数组：\n\n```javascript\nconst colorArray = [\n  ['white',\
  \ 'black'],\n  ['aliceblue', 'midnightblue'],\n  ['honeydew', 'darkgreen']\n];\n\
  ```\n\n无论哪种方式，你都可以使用双方括号引用单个元素，如这些示例所示：\n\n```\ncolorArray[0][0]; // 返回 'white'\n\
  colorArray[0][1]; // 返回 'black'\ncolorArray[1][0]; // 返回 'aliceblue'\ncolorArray[1][1];\
  \ // 返回 'midnightblue'\ncolorArray[2][0]; // 返回 'honeydew'\ncolorArray[2][1]; //\
  \ 返回 'darkgreen'\n```\n\n左括号中的数字是整个数组的索引，而右括号中的数字是元素数组的索引。\n\n### 数组操作\n\n像任何良好的对象一样，`Array`\
  \ 都带有一大量的属性和方法，你可以对其进行处理和操作。本章的其余部分将介绍这些属性和方法中最实用的几个。\n\n#### length 属性\n\n`Array`\
  \ 对象只有几个属性，但你最频繁使用的一个是 `length` 属性：\n\n`array.length`\n\n`length` 属性返回指定数组中当前元素的数量。这在遍历数组时非常有用，因为这意味着你不需要指定字面量作为循环计数的最大值。例如，考虑以下\
  \ `for` 语句：\n\n```\nfor (let counter = 0; counter < 5; counter += 1) {\n  dogPhotos[counter]\
  \ = \"dog-\" + (counter + 1);\n}\n```\n\n该语句假设 `dogPhotos` 数组有五个元素，但事实可能并非如此。为了让循环适用于任意数量元素，将\
  \ `5` 替换为 `dogPhotos.length`：\n\n```javascript\nfor (let counter = 0; counter <\
  \ dogPhotos.length; counter += 1) {\n  dogPhotos[counter] = \"dog-\" + (counter\
  \ + 1);\n}\n```\n\n同样注意，循环在变量 `counter` 小 `dogPhotos.length` 时运行。这是因为数组索引从 0 运行到数组\
  \ `length` 值减 1。换句话说，之前的 `for` 循环示例等同于：\n\n```\nfor (let counter = 0; counter <=\
  \ dogPhotos.length - 1; counter += 1)\n```\n\n#### 合并创建新数组：concat()\n\n`concat()`\
  \ 方法获取一个或多个现有数组的元素，并将它们合并到一个现有数组中以创建一个新数组：\n\n`array.concat(array1, array2, …)`\n\
  \n*   `array`: 你想要处理的数组名称。\n*   `array1, array2, …`: 你想要合并到 `array` 中的数组。这些也可以是值。\n\
  \n注意，原始数组保持不变。以下代码 (`bk04ch07/example09.html`) 展示了如何使用 `concat()` 将两个数组合并到第三个数组，每个元素都会打印到页面，如图\
  \ 7-6;\n\n// 显示合并后的数组\nconsole.log(array3);\n```\n\n![合并 array1 和 array2 产生此处所示值的\
  \ array3 的截图](img/9781394164684-fg040706.png)\n\n图 7-6： 合并 `array1` 和 `array2` 产生此处所示值的\
  \ `array3`。\n\n#### 从数组元素创建字符串：join()\n\n`join()` 方法允许你获取数组中现有的值并将它们连接在一起形成一个字符串。查看其语法：\n\
  \n`array.join(separator)`\n\n*   `array`: 你想要处理的数组名称。\n*   `separator`: 在形成字符串时插入在每个数组元素之间的可选字符或字符串。如果你省略了此参数，则会在每个元素之间插入逗号。\n\
  \n在以下代码 (`bk04ch07/example10.html`) 中，创建了三个数组，然后分别对每个数组使用 `join()`，使用空格作为分隔符，然后是空字符串\
  \ (`\"\"`），最后是不分隔符。图 7-7 显示了生成的页面输出。\n\nHTML:\n```html\n<div id=\"output\"></div>\n\
  ```\n\nJavaScript:\n\n```javascript\n// 声明数组\nconst array1 = [\"Make\", \"this\"\
  , \"a\", \"sentence.\"];\nconst array2 = [\"antid\", \"isest\", \"arian\"];\nconst\
  \ array3 = [\"John\", \"Paul\", \"Ringo\"];\n\n// 将它们转换为字符串\nconst string1 = array1.join(\"\
  \ \");\nconst string2 = array2.join(\"\");\nconst string3 = array3.join();\n\n//\
  \ 显示结果\ndocument.getElementById('output').innerHTML = string1 + '<br>' + string2\
  \ + '<br>' + string3;\n```\n\n![使用空格、空字符串和不分隔符连接数组的截图](img/9781394164684-fg040706.png)\n\
  \n\n\n\n\n执行这些语句后，`myArray` 包含了六个值：`\"First\"`、`\"Second\"`、`\"Third\"`、`\"Fourth\"\
  `、`\"Fifth\"` 和 `\"Sixth\"`。为什么我不直接一次性添加整个 `pushArray` 呢？比如这样：\n\n```\nmyArray.push(pushArray);\n\
  ```\n\n这是完全合法的，但这意味着 `myArray` 将包含以下四个元素：`\"First\"`、`\"Second\"`、`\"Third\"` 和\
  \ `pushArray`，这意味着你创建了一种混合多维数组，这可能不是你在这种情况下想要的结果。\n\n![记住](img/remember.png) 运行\
  \ `push()` 方法后，JavaScript 会根据添加的新元素数量增加数组的 `length` 属性值。\n\n### 反转数组元素的顺序：reverse()\n\
  \n`reverse()` 方法获取数组中的现有元素并反转它们的顺序：第一个移动到最后一个，最后一个移动到第一个，依此类推。其语法一眼就能懂：\n\n```\n\
  array.reverse()\n```\n\n以下代码 (bk04ch07/example11.html) 使用了 `reverse()` 方法，图 7-8\
  \ 显示了发生的情况。\n\n```\nconst myArray = [\"Show\", \"Place\", \"Win\"];\nmyArray.reverse();\n\
  console.log(myArray);\n```\n\n![使用 reverse() 方法反转数组元素顺序的截图](img/9781394164684-fg040708.png)\n\
  \n图 7-8： 使用 `reverse()` 方法反转数组元素的顺序。\n\n### 移除数组的第一个元素：shift()\n\n`shift()` 方法从数组中移除第一个元素并返回该元素的值：\n\
  \n```\narray.shift()\n```\n\n例如，考虑以下语句：\n\n```\nconst myArray = [\"First\", \"Second\"\
  , \"Third\"];\nconst myString = myArray.shift();\n```\n\n`myArray` 的第一个元素是 `\"First\"\
  `，所以 `myArray.shift()` 会从数组中移除该值并将其存储在 `myString` 变量中。\n\n![记住](img/remember.png)\
  \ 运行 `shift()` 方法后，JavaScript 会将数组的 `length` 属性值减一。\n\n### 返回数组的子集：slice()\n\n`slice()`\
  \ 方法返回一个新数组，其中包含现有数组元素的子集。以下是语法：\n\n```\narray.slice(start, end)\n```\n\n*   `array`:\
  \ 你想要操作的数组名称。\n*   `start`: 一个数字，指定你想要包含在子集中 `array` 中第一个元素的索引。如果此数字是负数，子集的起始点将从\
  \ `array` 的末尾计算（例如，-1 是数组的最后一个元素）。如果你留空此值，JavaScript 将使用 0（即数组的第一个元素）。\n*   `end`:\
  \ 一个可选的数字，指定你希望子集结束的 `array` 元素索引之前。如果你留空此值，子集将包含 `array` 从 `start` 到最后一个元素的所有元素。此值可以是负数。\n\
  \n![提示](img/tip.png) 快速复制数组的一种方法是使用不带任何参数的 `slice()`：\n\n```\nconst thisArray =\
  \ [\"alpha\", \"beta\", \"gamma\"];\nconst thatArray = thisArray.slice();\n// thatArray()\
  \ 是 [\"alpha\", \"beta\", \"gamma\"];\n```\n\n![提示](img/tip.png) 你也可以通过展开运算符（…）来快速复制数组，正如侧边栏之前描述的那样，“快速一览展开运算符（…](#c24.xhtml_c24-fea-0001)”：\n\
  \n```\nconst thisArray = [\"alpha\", \"beta\", \"gamma\"];\nconst thatArray = […thisArray];\n\
  // thatArray() 是 [\"alpha\", \"beta\", \"gamma\"];\n```\n\n以下代码 (bk04ch07/example12.html)\
  \ 定义了一个数组，然后尝试了 `slice()` 参数的不同值。结果显示在图 7-9 中。\n\nHTML:\n```html\n<div id=\"output\"\
  ></div>\n```\n\nJavaScript:\n```javascript\nconst myArray = [\"A\", \"B\", \"C\"\
  , \"D\", \"E\", \"F\"];\nconst array1 = myArray.slice(0, 4);\nconst array2 = myArray.slice(3);\n\
  const array3 = myArray.slice(-3, -1);\nlet str = \"array1: \" + array1 + \"<br>\"\
  ;\nstr += \"array2: \" + array2 + \"<br>\";\nstr += \"array3: \" + array3;\ndocument.getElementById('output').innerHTML\
  \ = str;\n```\n\n![使用 slice() 方法从另一个数组的子集创建新数组的截图](img/9781394164684-fg040709.png)\n\
  \n图 7-9： `slice()` 方法从另一个数组的子集创建一个新数组。\n\n### 对数组元素进行排序：sort()\n\n`sort()` 方法是处理常见编程问题的简单方法：重新排列数组元素，使其按字母顺序、数字或其他顺序进行排列。你有四种可以使用的语法：\n\
  \n```\narray.sort()\narray.sort(namedFunction)\narray.sort(namedFunction(a, b))\
  \ { code });\narray.sort((a, b) => { code });\n```\n\n*   `array`: 你想要排序的数组名称。\n\
  *   `namedFunction`: 执行排序操作的现有函数名称，该函数通过每次比较两个数组项来执行，其中比较中的第一个数组项作为参数 `a` 传递，第二个数组项作为参数\
  \ `b` 传递。\n*   `code`: 在每次迭代期间运行的用于对每个值执行排序操作的语句。\n\n不带参数使用 `sort()` 可以为你提供简单直接的字母排序：\n\
  \n```\nmyArray.sort();\n```\n\n如果你想根据其他标准对数组进行排序，你需要创建一个函数来定义排序顺序。你的函数必须设置如下：\n\n\
  *   函数必须接受两个参数，代表两个要比较的数组值，以便它们可以相互排序。为了这个列表列表，我将这些参数称为 `a` 和 `b`。\n*   使用这些参数，函数必须定义一个返回数值的表达式。\n\
  *   对于你希望 `a` 排序在 `b` 之前的情况，函数必须返回一个负值。\n*   对于你希望 `a` 排序在 `b` 之后的情况，函数必须返回一个正值。\n\
  *   对于你希望 `a` 和 `b` 被视为相等的情况，函数必须返回零。\n\n以下代码 (bk04ch07/example13.html) 显示了一个名为\
  \ `numericSort` 的函数，如果你想从低到高进行数字排序，可以使用它。图 7-10 显示了原始数组然后是排序后的数组。\n\nHTML:\n```html\n\
  <div id=\"output\"></div>\n```\n\nJavaScript:\n```javascript\n// 此函数从高到低排序数字\nfunction\
  \ numericSort(a, b) {\n  return b - a;\n}\nconst myArray = [3, 5, 1, 6, 2, 4];\n\
  // 在排序前写入数组\nlet str = \"myArray (before sorting): \" + myArray + \"<br>\";\n//\
  \ 对数组排序\nmyArray.sort(numericSort);\n// 在排序后写入数组\nstr+= \"myArray (after sorting):\
  \ \" + myArray;\ndocument.getElementById('output').innerHTML = str;\n```\n\n![提示](img/tip.png)\
  \ 要获得从低到高的数字排序，可以使用不带参数的 `sort()`，或者使用以下 `return` 表达式：\n\n```javascript\nreturn\
  \ a - b;\n```\n\n![使用 sort() 和函数从高到低对项目数字排序的截图](img/9781394164684-fg040710.png)\n\
  \n图 7-10： 使用 `sort()` 和函数从高到低对项目进行数字排序。\n\n### 移除、替换和插入元素：splice()\n\n`splice()`\
  \ 方法是一个复杂的函数，在各种情况下都非常有用。首先，这是语法：\n\n```\narray.splice(start, elementsToDelete,\
  \ value1, value2, ...)\n```\n\n*   `array`: 你想要操作的数组名称。\n*   `start`: 一个数字，指定 splice\
  \ 发生元素的索引。\n\n\n\n\n\n* `elementsToDelete`: 一个可选数字，指定从 `array` 的 `start` 位置开始删除的元素数量。如果你不包含此参数，则将删除从\
  \ `start` 到数组末尾的元素。\n*   `value1`, `value2`, `…`: 可选值，指定从 `array` 的 `start` 位置开始插入的中的值。\n\
  \n有了 `splice()` 的帮助，你可以执行以下一项或多个任务：\n\n*   **删除：** 如果 `elementsToDelete` 大于 0 或未指定且未包含插入值，`splice()`\
  \ 将从索引 `start` 开始删除元素。被删除的元素将在一个单独的数组中。\n*   **替换：** 如果 `elementsToDelete` 大于 0\
  \ 或未指定且包含一个或多个插入值，`splice()` 将先从索引 `start` 开始删除元素，然后在索引 `start` 处插入指定的值。\n*   **插入：**\
  \ 如果 `elementsToDelete` 为 `0`，`splice()` 将在索引 `start` 处插入指定的值。\n\n以下代码（`bk04ch07/example14.html`）演示了所有三项任务，结果显示在图\
  \ 7-11 中。\n\nHTML:\n```html\n<div id=\"output\">\n</div>\n```\n\nJavaScript:\n```javascript\n\
  const array1 = [\"A\", \"B\", \"C\", \"D\", \"E\", \"F\"];\nconst array2 = [\"A\"\
  , \"B\", \"C\", \"D\", \"E\", \"F\"];\nconst array3 = [\"A\", \"B\", \"C\", \"D\"\
  , \"E\", \"F\"];\n// 删除\n// 在 array1 中，从索引 2 开始删除到末\n// 将删除的元素返回 delete1 数组\nconst\
  \ delete1 = array1.splice(2);\n// 写入 array1\nlet str = \"array1: \" + array1 + \"\
  <br>\";\n// 写入 delete1\nstr += \"delete1: \" + delete1 + \"<br>\";\n// 替换\n// 在\
  \ array2 中，从索引 3 开始删除 2 个元素\n// 插入 2 个元素来替换它们\n// 将删除的元素返回 delete2 数组\nconst delete2\
  \ = array2.splice(3, 2, \"d\", \"e\");\n// 写入 array2\nstr += \"array2: \" + array2\
  \ + \"<br>\";\n// 写入 delete2\nstr += \"delete2: \" + delete2 + \"<br>\";\n// 插入\n\
  // 在 array3 中，从索引 1 开始插入 3 个元素\narray3.splice(1, 0, \"1\", \"2\", \"3\")\n// 写入\
  \ array3\nstr += \"array3: \" + array3;\ndocument.getElementById('output').innerHTML\
  \ = str;\n```\n\n![splice() 方法可以删除、替换和插入数组元素的截图。](img/9781394164684-fg040711.png)\n\
  \n图 7-11： `splice()` 方法可以删除、替换和插入数组元素。\n\n#### 在数组开头插入元素：unshift()\n\n`unshift()`\
  \ 方法是 `shift()` 方法的相反数：它在数组的开头插入一个或多个值。完成后，`unshift()` 返回数组的新 `length`。其语法如下：\n\n\
  `array.unshift(value1, value2, …)`\n\n*   `array`: 你想要操作的数组名称\n*   `value1`, `value2`,\
  \ `…`: 你想要添加到 `array` 开头的值\n\n例如，考虑以下语句：\n\n```javascript\nconst myArray = [\"First\"\
  , \"Second\", \"Third\"];\nconst newLength = myArray.unshift(\"Fourth\", \"Fifth\"\
  , \"Sixth\");\n```\n\n在执行这些语句后，`myArray` 包含六个值——`\"Fourth\"`、`\"Fifth\"`、`\"Sixth\"\
  `、`\"First\"`、`\"Second\"` 和 `\"Third\"`，且 `newLength` 的值为 6。\n\n## 第章：处理字符串、日期和数字\n\
  \n本章\n\n![项目](img/check.png) **处理字符串**\n![项目](img/check.png) **处理日期和时间**\n![项目](img/check.png)\
  \ **执行数学计算**\n\n*所有伟大的程序员都以相同的方式学习。他们不断地尝试。他们写一些代码，看看电脑做了什么。他们修改代码，看看电脑做了什么。他们反复重复这一过程，直到弄清楚盒子是如何工作的。*\
  \ ——塞斯·戈德林 (SETH GODIN)\n\n尽管你的 JavaScript 代码大部分时间都在处理 HTML 标签和 CSS 属性等网页小细节，但它还会执行许多后台任务，这些任务需要处理字符串、处理日期时间以及执行数学计算。为了帮助你完成这些任务，在本章中你将探索\
  \ JavaScript 的三个内置对象：`String` 对象、`Date` 对象和 `Math` 对象。你将研究每个对象最重要的属性，掌握最常用的方法，并在此遇到许多实用的示例。\n\
  \n### 使用 String 对象处理文本\n\n到目前为止，我在书中使用了几十个字符串示例。这些不仅包括字符串字面量（例如 `\"HTML, CSS, and\
  \ JavaScript For Dummies\"`），还包括返回字符串的方法（例如 `prompt()` 方法）。因此，现在应该很清楚，字符串在所有 JavaScript\
  \ 编程中都起着重要作用，很少有脚本不需要以某种方式处理字符串。\n\n正因于此，精通处理字符串是有意义的，这包括在字符串中定位文本以及从字符串中提取文本。你将在本节中了解到这些以及更多内容。\n\
  \n你处理的任何字符串——无论是字符串字面量还是返回字符串的方法或函数的结果——都是一个 `String` 对象。例如，以下两个语句是等价的：\n\n```javascript\n\
  const bookName = new String(\"HTML, CSS, and JavaScript For Dummies\");\nconst bookName\
  \ = \"HTML, CSS, and JavaScript For Dummies\";\n```\n\n这意味着在应用 `String` 属性时，你有很大的活性。例如，以下都是使用该属性的合法表达式：\n\
  \n```javascript\nbookName.length;\n\"HTML, CSS, and JavaScript For Dummies\".length;\n\
  prompt(\"Enter the name:\").length;\nmyFunction().length;\n```\n\n最后一个示例假设 `myFunction()`\
  \ 返回一个字符串值。\n\n#### 使用字符串模板\n\n在深入研究 `String` 对象的属性和方法之前，花几秒检查一种特殊的字符串类型，它是为了解决你职业生涯中反复出现的三个字符串问题：\n\
  \n*   **处理内部引号：** 字符串字面量由引号包裹，但当你需要在字符串内部使用相同类型的引号时该怎么办？\n    一种解决方案是使用不同类型的引号来界定。例如，以下是不合法的：\n\
  \    `'There's got to be some way to do this.'`\n    但这种是允许的：\n    `\"There's got\
  \ to be some way to do this.\"`\n    第二种解决方案是用反斜杠转义内部引号，如下：\n    `'There\\'s got\
  \ to be some way to do this.'`\n    这些解决方案可行，但*记住*使用它们比你想象的要难！\n\n*   **合并变量值：**\
  \ 当需要在字符串内部使用变量值时，通常会得到笨拙的结果，例如：\n    ```javascript\n    const adjective = \"better\"\
  ;\n    const lament = \"There's got to be some \" + adjective + \" way to do this.\"\
  ;\n    ```\n*   **多行字符串：** 有时使用多行定义字符串。但如果你尝试以下操作，将得到 `string literal contains an\
  \ unescaped line break` 错误：\n    ```javascript\n    const myHeader = '\n    <nav\
  \ class=\"banner\">\n    <h3 class=\"nav-heading\">Navigation</h3>\n    <ul class=\"\
  nav-links\">\n    <li>Home</li>\n    <li>Away</li>\n    <li>In Between</li>\n  \
  \  </ul>\n    </nav>';\n    ```\n\n    你可以通过使用*字符串模板*（也称为*模板字面量*）来解决所有三个问题，它是一种字符串字面量，其中界定引号被替换为反引号（``\
  \ ` ``）：\n\n    `` ` ``*`你的字符串放在这里`*`` ``\n\n![记住](img/remember.png) 字符串模板作为 ECMAScript\
  \ 2015 (ES6) 的一部分引入的，因此只有在你不需要支持 Internet Explorer 11 等旧网络浏览器时才使用它们。\n\n\n\n\n\n\
  以下是如何使用字符串模板（string template）来解决前面描述的三个问题：\n\n*   **处理内部引号：** 你可以在字符串模板内部随意放置任意数量的单引号或双引号：\n\
  \n    `` `Ah, here's the better way to do this!` ``\n\n*   **引入变量值：** 字符串模板支持一种名为*变量插值*（variable\
  \ interpolation）的技术，即在字符串内部直接引用变量的值。这里有一个示例：\n\n    `const adjective = \"better\"\
  ;`\n\n    `const paean = `Ah, here's the ${adjective} way to do this!`;`\n\n   \
  \ 在任何字符串模板中，使用 `${variable}` 都会插入 `variable` 的值，无需疑问。实际上，你并不局限于使用变量。字符串模板还可以插值任何\
  \ JavaScript 表达式，包括函数的结果。\n\n*   **多行字符串：** 字符串模板可以很好地无错误地处理跨多行的字符串：\n\n```javascript\n\
  const myHeader = `\n<nav class=\"banner\">\n<h3 class=\"nav-heading\">Navigation</h3>\n\
  <ul class=\"nav-links\">\n<li>Home</li>\n<li><li>Away</li>\n<li>In Between</li>\n\
  \ </ul>\n</nav>`\n```\n\n#### 确定字符串的长度\n\n`String` 对象最基本的属性是 `length`，它告诉你字符串中包含多少个字符：\n\
  \n`string.length`\n\n字符串中的所有字符——包括空格和标点符号——都计入长度内。唯一的例外是转义序列（例如 `\\n`），它们始终计为一个字符。以下代码获取了各种\
  \ `String` 对象类型的 `length` 属性值。\n\n```javascript\nfunction myFunction() {\n  return\
  \ \"filename.htm\";\n}\n\nconst bookName = \"HTML, CSS, and JavaScript For Dummies\"\
  ;\nlength1 = myFunction().length; // 返回 12\nlength2 = bookName.length; // 返回 37\n\
  length3 = \"123\\n5678\".length; // 返回 8\n```\n\n`String` 对象在属性上的缺失在方法上得到了充分的补偿。有几十种方法，它们让你的代码能够执行许多有用任务，从字母的大小写之间进行转换，到在字符串中查找文本，再到提取字符串的部分内容。\n\
  \n#### 查找子串\n\n**子串*（substring）是现有字符串的一部分。例如，“JavaScript”字符串的某些子串可以是“Java”、“Script”、“vaSc”和“v”。在脚本中处理字符串时，你通常需要判断给定的字符串是否包含给定的子串。例如，如果你正在验证用户的电子邮件地址，你应该检查它是否包含\
  \ @ 符号。\n\n[表 8-1] 列出了几种用于在较大字符串中查找子串的 `String` 对象方法。\n\n你将在脚本中频繁频繁使用这些方法中的每一个，因此我在接下来的章节中对它们进行了详细的介绍。\n\
  \n| 方法 | 功能 |\n| --- | --- |\n| `string.endsWith(substring, start)` | 测试 `substring`\
  \ 是否出现在 `string` 的末尾 |\n| `string.includes(substring, start)` | 测试 `substring` 是否出现在\
  \ `string` 中 |\n| `string.indexOf(substring, start)` | 在 `string` 中搜索 `substring`\
  \ 第一次出现的位置 |\n| `string.lastIndexOf(substring, start)` | 在 `string` 中搜索 `substring`\
  \ 的最后一次出现的位置 |\n| `string.startsWith(substring, start)` | 测试 `substring` 是否出现在 `string`\
  \ 的开头 |\n\n[表 8-1] 用于查找子串的 String 对象方法\n\n##### startsWith(), includes(), 和 endsWith()\
  \ 方法\n\n如果你只想知道某个子串是否存在于较大的字符串中，请使用以下方法之一：\n\n* `string.startsWith(substring, position)`\n\
  * `string.includes(substring, position)`\n* `string.endsWith(substring, position)`\n\
  \n* `string`：你想要在其中搜索的字符串。\n* `substring`：你想要在 `string` 中搜索的子串。\n* `position`：可选的数值值，用于定义搜索的起始字符位置（对于\
  \ `startsWith()` 和 `includes()` 方法）或搜索的结束字符位置（对于 `endsWith()` 方法）。如果你省略此参数，JavaScript\
  \ 将从字符串的开头（对于 `startsWith()` 和 `includes()` 方法）或字符串的结尾（对于 `endsWith()` 方法）开始搜索。\n\
  \n搜索是区分大小写的。如果这些方法在 `string` 中找到了 `substring`，它们将返回 `true`；否则返回 `false`。以下是一些示例（请查看本书中示例文件\
  \ `bk04ch08/example01.html`）：\n\n```javascript\nconst bookName = \"HTML, CSS, and\
  \ JavaScript For Dummies\";\nbookName.startsWith(\"HTML\"); // 返回 true\nbookName.startsWith(\"\
  CSS\", 6); // 返回 true\nbookName.includes(\"JavaScript\"); // 返回 true\nbookName.includes(\"\
  And\"); // 返回 false\nbookName.endsWith(\"Dummies\"); // 返回 true\nbookName.endsWith(\"\
  JavaScript\", 25); // 返回 true\n```\n\n从更实用的角度来说，以下代码（查看 `bk04ch08/example01a.html`）了一个使用\
  \ `includes()` 的简单验证脚本：\n\n```javascript\nlet emailAddress = \"\";\ndo {\n  emailAddress\
  \ = prompt(\"Enter a valid email address:\");\n}\nwhile (!emailAddress.includes(\"\
  @\"));\n```\n\n脚本提示用户输入有效的电子邮件地址，并存储在 `emailAddress` 变量中。任何有效的地址都会包含 @ 符号，因此 `do…while()`\
  \ 循环的 `while()` 部分会检查输入的字符串是否包含 @：\n\n```javascript\nwhile (!emailAddress.includes(\"\
  @\"));\n```\n\n如果不是（即 `emailAddress.includes(\"@\")` 返回 `false`），循环将继续并再次提示用户。![记住](img/remember.png)\
  \ `startsWith()`、`endsWith()` 和 `includes()` 方法作为 ECMAScript 2015 (ES6) 的一部分引入，因此只有在你不需要支持像\
  \ Internet Explorer 11 这样的旧浏览器时才使用它们。\n\n##### indexOf() 和 lastIndexOf() 方法\n\n\
  当你想找到子串的第一次出现时，请使用 `indexOf()` 方法；如果你需要找到子串的最后一次出现，请使用 `lastIndexOf()` 方法：\n\n`string.indexOf(substring,\
  \ start)`\n`string.lastIndexOf(substring, start)`\n\n* `string`：你想要在其中搜索的字符串。\n\
  * `substring`：你想要搜索的子串。\n* `start`：从搜索的可选字符位置。如果你省略此参数，JavaScript 将从字符串的开头（对于 `indexOf()`\
  \ 方法）或结尾（对于 `lastIndexOf()` 方法）开始搜索。\n\n在使用 `indexOf()` 或 `lastIndexOf()` 时，你应该记住以下几点：\n\
  \n* 字符串中的每个字符都被赋予了一个索引数字，这与字符在字符串中的位置相同。\n* 字符串像数组一样是从零开始的，这意味着第一个字符的索引为 0，第二个字符的索引为\
  \ 1，依此类推。\n* 这两个方法都是区分大小写的。例如，如果你搜索 `B`，这两种方法都找不到任何 `b` 的实例。\n* 如果任一方法找到了 `substring`，它们将返回\
  \ `substring` 第一个字符的索引位置。\n* 如果任一方法没有找到 `substring`，它们将返回 -1。\n\n以下代码（bk04ch08/example02.html）在几种不同的情况下尝试了这些方法：\n\
  \nHTML:\n\n```html\n<pre>\nHTML, CSS, and JavaScript For Dummies\n0123456789012345678901234567890123456\n\
  </pre>\n```\n\nJavaScript:\n\n```javascript\nconst bookName = \"HTML, CSS, and JavaScript\
  \ For Dummies\";\nlet str = \"\\\"C\\\" is at index \" + bookName.indexOf(\"C\"\
  ) + \"<br>\";\nstr += \"\\\"v\\\" is at index \" + bookName.indexOf(\"v\") + \"\
  <br>\";\nstr += \"The first space is at index \" + bookName.indexOf(\" \") + \"\
  <br>\";\nstr += \"The first \\\"S\\\" is at index \" + bookName.indexOf(\"S\") +\
  \ \"<br>\";\n```\n\n\n\n\n```\nstr += \"The last \\\"S\\\" is at index \" + bookName.lastIndexOf(\"\
  S\") + \"<br>\";\nstr += \"The first \\\"a\\\" after index 12 is at index \" + bookName.indexOf(\"\
  a\", 12) + \"<br>\";\nstr += \"The substring \\\"Script\\\" begins at index \" +\
  \ bookName.indexOf(\"Script\");\ndocument.getElementById(\"output\").innerHTML =\
  \ str;\n```\n\n如图 8-1 所示，这些数字显示了脚本中每个字符的索引位置。\n\n![显示脚本中每个字符索引位置的数字截图。](img/9781394164684-fg040801.png)\n\
  \n图 8-1： `indexOf()` 和 `lastIndexOf()` 方法在字符串内搜索子字符串。\n\n#### 提取子字符串的方法\n\n找到子字符串是一回事，但你通常也需要提取子字符串。例如，如果用户输入了电子邮件地址，你可能只需要提取用户名（@\
  \ 符号左侧的部分）或域名（@ 符号右侧的部分）。对于这类操作，JavaScript 提供了六种方法，列在表 8-2 中。\n\n| 方法 | 功能 |\n|\
  \ --- | --- |\n| `string.charAt(index)` | 返回 `string` 中由 `index` 指定索引位置的字符 |\n|\
  \ `string.charCodeAt(index)` | 返回 `string` 中由 `index` 指定索引位置的字符的编码 |\n| `string.slice(start,\
  \ end)` | 返回 `string` 中从 `start` 指定索引位置开始、在 `end` 指定索引位置之前一个位置结束的子字符串 |\n| `string.split(separator,\
  \ limit)` | 返回一个数组，数组中的每项都是 `string` 中的一个子字符串，这些子字符串由 `separator` 字符分隔 |\n| `string.substr(start,\
  \ length)` | 返回 `string` 中从 `start` 指定索引位置开始且长度为 `length` 个字符的子字符串 |\n| `string.substring(start,\
  \ end)` | 返回 `string` 中从 `start` 指定索引位置开始、在 `end` 指定索引位置之前一个位置结束的子字符串 |\n\n表 8-2\
  \ 用于提取子字符串的字符串对象方法\n\n##### charAt() 方法 方法你使用 `charAt()` 方法返回字符串内指定位置的单个字符：\n\n\
  ```\nstring.charAt(index)\n```\n\n* `string`: 包含该字符的字符串\n* `index`: 你想要的字符在 `string`\
  \ 中的位置\n\n以下是关于该方法的一些说明：\n\n* 要返回 `string` 中的第一个字符，请使用以下代码：\n    `string.charAt(0)`\n\
  * 要返回 `string` 中的最后一个字符，使用此代码：\n    `string.charAt(string.length - 1)`\n* 如果 `index`\
  \ 值为负数或大于等于 `string.length`，JavaScript 将返回空字符串 (`\"\"`)）。\n\n以下代码展示了一个示例（bk04ch08/example03.html）：\n\
  \nHTML:\n```\n<div id=\"output\"></div>\n```\n\nJavaScript:\n```javascript\n// 设置一个测试字符串数组\n\
  const stringArray = [];\nstringArray[0] = \"Not this one.\";\nstringArray[1] = \"\
  Not this one, either.\";\nstringArray[2] = \"1\\. Step one.\";\nstringArray[3] =\
  \ \"Shouldn't get this far.\";\n// 遍历数组\nfor (const currentString of stringArray)\
  \ {\n  // 获取字符串的第一个字符\n  const firstChar = currentString.charAt(0);\n  // 是数字吗？\n\
  \  if (!isNaN(firstChar)) {\n    // 如果是，则显示该字符串，因为我们要这个\n    document.getElementById(\"\
  output\").innerHTML = `Here's the one: \"${currentString}\"`;\n    // 到这里结束，所以跳出循环\n\
  \    break;\n  }\n}\n```\n\n这里的思路是检查一组字符串并找到以数字开头的那个。该集合存储在名为 `stringArray` 的数组中，并设置了一个\
  \ `for…of` 循环遍历数组中的每一项。`charAt()` 方法应用于数组的每一项（存储在变量 `currentString` 中），以返回第一个字符，并将其存储在变量\
  \ `firstChar` 中。在 `if` 测试中，逻辑表达式 `!isNaN(firstChar)` 当 `firstChar` 值为数字时返回 `true`，此时正确的字符串显示在网页上并中断循环。\n\
  \n![提示](img/tip.png) JavaScript 字符串中的每个字符都有一个索引数字，第一个字符是索引 0，第二个字符是索引 1，依此类推。你使用方括号表示法指定特定字符。例如，表达式\
  \ `myString[5]` 引用 `myString` 变量中存储的字符串的索引为 5 的字符。\n\n因此，使用 `charAt()` 的替代方案是通过其索引数字引用你想要的字符。例如，以下两个表达式引用的是同一个字符：\n\
  \n```\ncurrentString.charAt(0)\ncurrentString[0]\n```\n\n##### slice() 方法\n\n使用\
  \ `slice()` 方法从截取字符串的一部分：\n\n```\nstring.slice(start, end)\n```\n\n* `string`: 你想要处理的字符串。\n\
  * `start`: `string` 中你想要提取的第一个字符的位置。\n* `end`: `string` 中紧接在你想要提取的字符之后的位置（可选参数）。如果你省略此参数，`slice()`\
  \ 将提取从 `start` 到字符串末尾的子字符串。此外，此参数可以是负数，此时表示从末尾开始的偏移。\n\n以下代码（bk04ch08/example04.html）运行了一些示例（查看图\
  \ 8-2）：\n\nHTML:\n```\n<pre>\nHTML, CSS, and JavaScript Dummies\n</pre>\n<div id=\"\
  output\"></div>\n```\n\nJavaScript:\n```javascript\n// 设置一个测试字符串数组\nconst bookName\
  \ = \"HTML, CSS, and JavaScript Dummies\";\nlet str = \"\";\n// 显示最后一个 \"S\" 的索引\n\
  str += \"The last \\\"S\\\" is at index \" + bookName.lastIndexOf(\"S\") + \"<br>\"\
  ;\n// 显示索引 122 之后第一个 \"a\" 的索引\nstr += \"The first \\\"a\\\" after index 12 is at\
  \ index \" + bookName.indexOf(\"a\", 12) + \"<br>\";\n// 显示子字符串 \"Script\" 的索引\n\
  str += \"The substring \\\"Script\\\" begins at index \" + bookName.indexOf(\"Script\"\
  );\ndocument.getElementById(\"output\").innerHTML = str;\n```\n\n![slice() 方法运行的一些示例截图。](img/9781394164684-fg040802.png)\n\
  \n图 8-2： `slice()` 方法运行的一些示例。\n\n##### split() 方法\n\n`split()` 方法分解字符串并返回一个存储这些片段的数组：\n\
  \n```\nstring.split(separator, limit)\n```\n\n* `separator`: 用于标记分割 `string` 位置的字符。例如，如果\
  \ `separator` 是逗号，则将在 `string` 中的每个逗号处分割。\n* `limit`: 一个可选值，设置存储在数组中的最大数量。例如，如果\
  \ `limit` 为 5，`split()` 将前五个片段存储在数组中，然后忽略字符串的其余部分。\n\n当你有一个“结构良好”的字符串时，`split()`\
  \ 方法非常有用。这意味着字符串包含一个分隔符，分隔着你想要设置为数组项的每个字符串片段。例如，我们经常处理*逗号分隔*的字符串：\n\n```javascript\n\
  string1 = \"Sunday,Monday,Tuesday,Wednesday,Thursday,Friday,Saturday\";\n```\n\n\
  方便的是，字符串中的每一天都由逗号分隔，这使得使用 `split()` 方法变得显而易见：\n\n```javascript\nconst string1Array\
  \ = string1.split(\",\");\n```\n\n\n\n\n当你运行此语句时，`string1Array[0]` 将包含 `\"Sunday\"\
  `，`string1Array[1]` 将包含 `\"Monday\"`，依此类推。同样请注意，JavaScript 会自动为你设置数组。你不需要使用 `new\
  \ Array()` 来声明数组。\n\n以下代码（`bk04ch08/example05.html`）使用几个示例字符串测试了 `split()`：\n\n\
  HTML:\n```html\n<div id=\"output\"></div>\n```\n\nJavaScript:\n```javascript\nconst\
  \ string1 = \"Sunday,Monday,Tuesday,Wednesday,Thursday,Friday,Saturday\";\nconst\
  \ string2 = \"ABCDEF\";\nlet str = \"\";\nconst string1Array = string1.split(\"\
  ,\");\nstring1Array.forEach((value, index) => {\n  str += `string1Array[${index}]\
  \ = ${value}<br>`;\n});\nconst string2Array = string2.split(\"\", 4);\nstring2Array.forEach\
  \ ((value, index) => {\n  str += `string2Array[${index}] = ${value}<br>`;\n});\n\
  document.getElementById(\"output\").innerHTML = str;\n```\n\n在 `string1` 被拆分为 `string1Array`\
  \ 之后，该数组的 `forEach()` 方法会遍历数组并将项写入全局变量 `str`。对于 `string2`，它使用空字符串作为分隔符，并对 `string2Array`\
  \ 的大小设置了 4 的限制。同样，该数组的 `forEach()` 方法将数组值写入 `str` 变量。脚本通过将 `str` 写入页面来结束。图 8-3 显示了发生的情况。\n\
  \n![split() 方法的一些示例截图。](img/9781394164684-fg040803.png)\n\n图 8-3： `split()` 方法的一些示例。\n\
  \n#### substr() 方法\n\n如果你想提取一个子字符串，并且知道你想要该子字符串有多长，那么 `substr()` 方法通常是最佳方法：\n\n\
  `string.substr(index, length)`\n\n*   `string`: 你想要处理的字符串。\n*   `index`: `string`\
  \ 中你想要提取的第一个字符的索引。\n*   `length`: 可选值，指定子字符串的长度。如果你省略此参数，JavaScript 将提取到字符串的末尾。\n\
  \n以下代码（`bk04ch08/example06.html`）通过一些示例运行了 `substr()`；结果显示在图 8-4。\n\nHTML:\n```html\n\
  <pre>\nHTML, CSS, and JavaScript For Dummies\n0123456789012345678901234567890123456\n\
  </pre>\n<div id=\"output\"></div>\n```\n\nJavaScript:\n```javascript\nconst bookName\
  \ = \"HTML, CSS, and JavaScript For Dummies\";\nlet str = \"substr(0, 9) = \" +\
  \ bookName.substr(0, 9)+\"<br>\";\nstr += \"substr(15, 10) = \" + bookName.substr(15,\
  \ 10) + \"<br>\";\nstr += \"substr(26) = \" + bookName.substr(26);\ndocument.getElementById(\"\
  output\").innerHTML = str;\n```\n\n![substr() 方法的一些示例截图。](img/9781394164684-fg040804.png)\n\
  \n图 8-4： `substr()` 方法的一些示例。\n\n#### substring() 方法\n\n使用 `substring()` 方法从字符串中提取子字符串：\n\
  \n`string.substring(start, end)`\n\n*   `string`: 你想要处理的字符串。\n*   `start`: `string`\
  \ 中你想要提取的第一个字符的索引。\n*   `end`: 可选值，指定 `string` 中紧接你想要提取的最后一个字符之后的位置。如果你省下了此参数，JavaScript\
  \ 将提取从 `start` 到字符串末尾的子字符串。\n\n以下代码（`bk04ch08/example07.html`）尝试了 `substring()`\
  \ 方法，结果显示在图 8-5。\n\nHTML:\n```html\n<pre>\nHTML, CSS, and JavaScript For Dummies\n\
  0123456789012345678901234567890123456\n</pre>\n<div id=\"output\"></div>\n```\n\n\
  JavaScript:\n```javascript\nconst bookName = \"HTML, CSS, and JavaScript For Dummies\"\
  ;\nlet str = \"substring(0, 9) = \" + bookName.substring(0, 9) + \"<br>\";\nstr\
  \ += \"substring(11, 14) = \" + bookName.substring(11, 14) + \"<br>\";\nstr += \"\
  substring(30) = \" + bookName.substring(30);\ndocument.getElementById(\"output\"\
  ).innerHTML = str;\n```\n\n![substring() 方法的一些示例截图。](img/9781394164684-fg040805.png)\n\
  \n图 8-5： `substring()` 方法的一些示例。\n\n#### 理解 splice(), substr(), 和 substring() 之间的区别\n\
  \n`splice()`、`substr()` 和 `substring()` 方法非常相似，即使是经验丰富的 JavaScript 程序员也经常混淆它们。以下是帮助你理解这三种字符串提取方法区别的笔记：\n\
  \n*   `splice()` 和 `substring()` 方法执行相同的任务。唯一的区别是 `splice()` 允许在 `end` 参数中使用负值。如果你想从原始字符串的末尾跳过特定数量的字符，这非常有用。例如，如果你想提取最后三个字符以外的所有内容，你可以使用：\n\
  \    `string.splice(0, -3)`\n*   当你不确定提取出的字符串有多长时，请使用 `splice()` 或 `substring()`。这通常意味着你将使用\
  \ `indexOf()` 和 `lastIndexOf()` 方法来找到标记你所需的子字符串起点和终点的特定字符。然后你将这些值作为 `splice()` 或\
  \ `substring()` 的 `start` 和 `end` 参数。例如，假设你有一个格式如 [`www.domain.com`](http://www.domain.com)\
  \ 的字符串，并且你只想提取 `domain` 部分。这里有一个可以实现该功能的短例程序：\n    ```javascript\n    const hostName\
  \ = \"www.domain.com\";\n    const firstDot = hostName.indexOf(\".\");\n    const\
  \ lastDot = hostName.lastIndexOf(\".\");\n    const domainName = hostName.substring(firstDot\
  \ + 1, lastDot);\n    ```\n    ![提示](img/tip.png) 这种提取域名的技术具有说明性，但效率极低。这里有一行利用 `split()`\
  \ 方法的单行代码（我在本章早些时候讨论过它；查看“The split() 方法”）：\n    ```javascript\n    const domainName\
  \ = hostName.split('.')[1];\n    ```\n*   另一方面，如果你预先知道提取出的字符串必须有多长，请使用 `substr()`\
  \ 方法。\n\n### 处理日期和时间\n\n日期和时间似乎应该是非常直观的编程命题。毕竟，一年只有 12 个月，每月 28 到 31 天，每周 7 天，每天\
  \ 24 小时，每小时 60 分钟，每分钟 60 秒。如此如此板上钉钉的事情怎么可能有一点点奇怪吧？\n\n你会感到惊讶的。日期和时间可能会变得奇怪，但如果你始终记住这三个关键点，处理起来就会变得容易得多：\n\
  \n*   JavaScript 时间是以毫秒（即秒的千分之一）衡量的。具体来说，JavaScript 通过计算从 1970 年 1 月 1 日到目标日期和时间之间经过的毫秒数来测量时间。例如，你可能会遇到\
  \ 2001 年 1 月 1 日这个日期，并想：“是的，新千年的开始。”然而，JavaScript 遇到该日期想的是 `978220800000`。\n*  \
  \ 在 JavaScript 的世界里，时间始于格林尼标准时间 1970 年 1 月 1 日午。在此之前的日期毫值为负值。\n*   由于你的 JavaScript\
  \ 程序运行在用户的浏览器中，因此日期和时间几乎总是用户的本地日期和时间。也就是说，你的脚本操作的日期时间将不是页面所在服务器的时间。这意味着你永远无法知道用户查看页面时的时间。\n\
  \n#### Date 对象使用的参数\n\n在深入研究 `Date` 对象及其相关方法之前，我将花一点时间过一遍 JavaScript 许多日期相关功能所需的各种参数。这可以避免我以后冗味地重复这些参数。表\
  \ 8-3 提供了详细信息。\n\n| **参数** | **代表什么** | **可能的值** |\n\n| --- | --- | --- |\n\n\n\n\
  \n\n| `date` | 变量名 | `Date` 对象 |\n| --- | --- | --- |\n| `yyyy` | 年份 | 四位整数 |\n\
  | `yy` | 年份 | 二位整数 |\n| `month` | 月份 | 从 `\"January\"` 到 `\"December\"` 的完整月份名称\
  \ |\n| `mth` | 月份 | 从 0（一月）到 11（十二月）的整数 |\n| `dd` | 几中的几 | 从 1 到 31 的整数 |\n| `hh`\
  \ | 小时 | 从 0（午夜）到 23（晚上 11:00）的整数 |\n| `mm` | 分钟 | 从 0 到 59 的整数 |\n| `ss` | 秒 |\
  \ 从 0 到 59 的整数 |\n| `ms` | 毫秒 | 从 0 到 999 的整数 |\n\n**表 8-3** 与 `Date` 对象相关的参数\n\n\
  #### 使用 `Date` 对象\n\n每当你在 JavaScript 中处理日期和时间时，你都在操作一个 `Date` 对象的实例。更准确地说，当你在 JavaScript\
  \ 中处理 `Date` 对象时，你处理的是时间中的特定时刻，精确到毫秒。`Date` 对象永远不会是一段时间，它也不是一个在你的脚本运行期间持续滴答作答的时钟。相反，`Date`\
  \ 对象是一个时间快照，你用它来提取拍摄快照时的具体时间信息：年份、月份、日期、小时等。\n\n##### 指定当前日期和时间\n\n`Date` 对象最常见的用途是存储当前日期和时间。你可以通过调用\
  \ `Date()` 函数来实现这一点，该函数是创建新 `Date` 对象的构造函数。以下是通用格式：\n\n```\nconst dateToday = new\
  \ Date();\n```\n\n##### 指定任何日期和时间\n\n如果你需要处理特定的日期或时间，则需要使用 `Date()` 函数的参数。`Date()`\
  \ 函数的语法有五种版本（请参阅本章开头的参数列表）：\n\n```javascript\nconst date = new Date(\"monthdd,yyyyhh:mm:ss\"\
  );\nconst date = new Date(\"monthdd,yyyy\");\nconst date = new Date(yyyy,mth,dd,hh,mm,ss);\n\
  const date = new Date(yyyy,mth,dd);\nconst date = new Date(ms);\n```\n\n以下语句为每种语法都提供了示例：\n\
  \n```javascript\nconst myDate = new Date(\"August 23, 2023 3:02:01\");\nconst myDate\
  \ = new Date(\"August 23, 2023\");\nconst myDate = new Date(2023, 8, 23, 3, 2, 1);\n\
  const myDate = new Date(2023, 8, 23);\nconst myDate = new Date(1692763200000);\n\
  ```\n\n#### 提取关于日期的信息\n\n当你的脚本直接抛出存储在变量中的任何 `Date` 对象值时，结果并不理想。如果你想以更吸引人的格式显示日期，或者如果你想对日期进行算术运算，你就需要更深入地研究\
  \ `Date` 对象，以提取特定信息，如月份、年份、小时等。你可以通过使用表 8-4 中列出的 `Date` 对象方法来实现。\n\n利用这些方法的方法之一是使用你想要的任何格式向用户显示时间或日期。以下是一个示例（bk04ch08/example08.html）：\n\
  \nHTML:\n\n```html\n<div id=\"output\"></div>\n```\n\n| 方法语法 | 返回值 |\n| --- | ---\
  \ |\n| `date.getFullYear()` | 四位数字形式的年份（1999、2000 等） |\n| `date.getMonth()` | 年份月份；从\
  \ 0（一月）到 11（十二月） |\n| `date.getDate()` | 月份中的日期；从 1 到 31 |\n| `date.getDay()` |\
  \ 星期几；从 0（星期日）到 6（星期六） |\n| `date.getHours()` | 一天的小时；从 0（午夜）到 23（晚上 11:00） |\n\
  | `date.getMinutes()` | 小时内的分钟；从 0 到 59 |\n| `date.getSeconds()` | 分钟内的秒；从 0 到 59\
  \ |\n| `date.getMilliseconds()` | 秒内的毫秒；从 0 到 999 |\n| `date.getTime()` | 自 1970\
  \ 年 1 月 1 日以来的毫秒 |\n\n```javascript\nconst timeNow = new Date();\nconst hoursNow\
  \ = timeNow.getHours();\nconst minutesNow = timeNow.getMinutes();\nlet message =\
  \ \"It's \";\nlet hoursText;\nif (minutesNow <= 30) {\n  message += minutesNow +\
  \ (minutesNow === 1 ? \" minute past \" : \" minutes past \");\n  hoursText = hoursNow;\n\
  } else {\n  message += (60 - minutesNow) + ((60 - minutesNow) === 1 ? \" minute\
  \ before \" : \" minutes before \");\n  hoursText = hoursNow + 1;\n}\nif (hoursNow\
  \ == 0 && minutesNow <= 30) {\n  message += \"midnight.\";\n} else if (hoursNow\
  \ == 11 && minutesNow > 30) {\n  message += \"noon.\";\n} else if (hoursNow < 12)\
  \ {\n  message += hoursText + \" in the morning.\";\n} else if (hoursNow == 12 &&\
  \ minutesNow <= 30) {\n  message += \"noon.\";\n} else if (hoursNow < 18) {\n  message\
  \ += parseInt(hoursText - 12) + \" in the afternoon.\";\n} else if (hoursNow ==\
  \ 23 && minutesNow > 30) {\n  message += \"midnight.\";\n} else {\n  message +=\
  \ parseInt(hoursText - 12) + \" in the evening.\";\n}\ndocument.getElementById(\"\
  output\").innerHTML = message;\n```\n\n该脚本首先将用户的本地时间存储在 `timeNow` 变量中。然后使用 `getHours()`\
  \ 提取当前小时并存储在 `hoursNow` 变量中，使用 `getMinutes()` 提取当前分钟并存储在 `minutesNow` 变量中。初始化一个名为\
  \ `message` 的变量，用于存储显示在网页上的消息。变量 `hoursText` 将持有非 24 小时制（例如，4 而不是 16）。\n\n检查 `minutesNow`\
  \ 的值以确定它是否小于或等于 30，因为这决定了消息的第一部分以及 `hoursText` 的值。以下是消息显示出的两个示例：\n\n`It's 20 minutes\
  \ past 10 // minutesNow is less than equal to 30 (10:20)`\n`It's 1 minute to 11\
  \ // minutesNow is greater than 30 (10:59)`\n\n然后脚本检查 `hoursNow` 的值：\n\n- 如果它等于\
  \ 0 且 `minutesNow` 小于等于 30，则向消息中添加字符串 `midnight`。\n- 如果它等于 11 且 `minutesNow` 大于\
  \ 30，则向消息中添加字符串 `noon`。\n- 如果它小于 12，则向消息添加 `hoursText + \" in the morning.\"`。\n\
  - 如果它等于 12 且 `minutesNow` 小于等于 30，则向消息添加 `noon.`。\n- 如果它小于 18，则向消息添加 `parseInt(hoursText\
  \ - 12) + \" in the afternoon.\"`。\n- 如果它等于 23 且 `minutesNow` 大于 30，则向消息添加 `midnight.`。\n\
  - 否则，则向消息添加 `parseInt(hoursText - 12) + \" in the evening.\"`。\n\n最后，将结果写入页面，如图\
  \ 8-6 所示。\n\n\n\n\n\n```javascript\ndocument.getElementById(\"output\").innerHTML\
  \ = `The date is ${dateNow}<br>The month name is ${dateNow.toLocaleDateString('default',\
  \ { month: 'long' })})}`;\n```\n\n#### 从日期中提取星期名称\n\n在使用 `getDay()` 时，你面临的问题与使用\
  \ `getMonth()` 类似：需要将返回的数字转换为“易读”的名称，例如在本例中，0 代表星期日，1 代表星期一，以此此类推。正如你所想象的，解决方案也是类似的：使用\
  \ `toLocaleDateString()` 方法，但这次将对象 `{ weekday: 'long' }` 作为 `options` 参数。这里是一个示例\
  \ (bk04ch08/example10.html)：\n\nHTML:\n```html\n<div id=\"output\"></div>\n```\n\
  \nJavaScript:\n```javascript\nconst dateNow = new Date();\ndocument.getElementById(\"\
  output\").innerHTML = `The date is ${dateNow}<br>The month name is ${dateNow.toLocaleDateString('default',\
  \ { weekday: 'long' })}`;\n```\n\n#### 设置日期\n\n当你执行日期算术时，通常需要更改现有 `Date` 对象的值。例如，一个电子商务脚本可能需要计算从销售发生日期起\
  \ 90 天的日期。最简单的方法是创建一个 `Date` 对象，然后使用表达式或字面量来更改年份、月份或日期的其他组件。你可以通过使用 表 8-5 中列出的 `Date`\
  \ 对象方法来实现。\n\n| 方法语法 | 设置的内容 |\n| --- | --- |\n| `date`.setFullYear(`yyyy`) | 四位数数字年份（1999、2000\
  \ 等） |\n| `date`.setMonth(`mth`) | 年份中的月份；从 0（1 月）到 11（12 月） |\n| `date`.setDate(`dd`)\
  \ | 月中的日期；从 1 到 31 |\n| `date`.setHours(`hh`) | 天中的小时；从 0（午夜）到 23（晚上 11:00） |\n\
  | `date`.setMinutes(`mm`) | 小时中的分钟；从 0 到 59 |\n| `date`.setSeconds(`ss`) | 分钟中的秒；从\
  \ 0 到 59 |\n| `date`.setMilliseconds(`ms`) | 秒中的毫秒；从 0 到 999 |\n| `date`.setTime(`ms`)\
  \ | 自 GMT 1970 年 1 月 1 日以来的毫秒数 |\n\n表 8-5 设置日期值值的 Date 对象方法\n\n以下代码 (bk04ch08/example11.html)\
  \ 尝试了其中一些方法：\n\nHTML:\n```html\n<div>\n  <label for=\"user-year\">输入年份:</label>\n\
  \  <input type=\"text\" id=\"user-year\" size=\"4\" value=\"2024\">\n</div>\n<div>\n\
  \  <label for=\"user-month\">输入月份 (1-12):</label>\n  <input type=\"text\" id=\"\
  user-month\" size=\"2\" value=\"1\">\n</div>\n<div>\n  <label for=\"user-day\">输入日期\
  \ (1-31):</label>\n  <input type=\"text\" id=\"user-day\" size=\"2\" value=\"1\"\
  >\n</div>\n<div id=\"output\"></div>\n```\n\nJavaScript:\n```javascript\n// 获取输入\n\
  const inputs = document.querySelectorAll('input');\n// 为每个输入框添加 `change` 事件监听器\n\
  inputs.forEach( input => {\n  input.addEventListener('change', makeDate);\n});\n\
  // 每当输入发生变化时运行此函数\nfunction makeDate() {\n  // 获取年份、月份（减 1）和日期\n  const userYear\
  \ = document.querySelector('#user-year').value;\n  const userMonth = document.querySelector('#user-month').value\
  \ - 1;\n  const userDay = document.querySelector('#user-day').value;\n  // 创建一个新的\
  \ Date 对象\n  const userDate = new Date();\n  // 设置年份、月份和日期\n  userDate.setFullYear(userYear);\n\
  \  userDate.setMonth(userMonth);\n  userDate.setDate(userDay);\n  // 将日期信息转换为字符串\n\
  \  const dateString = userDate.toLocaleDateString('default', { month: 'long', day:\
  \ 'numeric', year: 'numeric' });\n  const dayName = userDate.toLocaleDateString('default',\
  \ { weekday: 'long' });\n  // 显示消息\n  document.getElementById(\"output\").innerHTML\
  \ = `The date entered is: ${dateString}<br>The day of the week is: ${dayName}`;\n\
  }\n// 页面加载后立即运行函数\nmakeDate();\n```\n\nHTML 定义了三个 `input` 元素，用于收集年份、月份和日期。JavaScript\
  \ 将 `input` 元素存储在 `inputs` 列表中，然后遍历这些元素，为每个元素添加 `change` 事件处理器，该处理器将 `makeDate`\
  \ 定义为回调函数。\n\n`makeDate` 回调函数将每个输入元素的值存储在变量中。注意，脚本从月份值中减去了 `1`，以获得 JavaScript 使用的正确月份数字。\n\
  \n接下来的四条语句是此示例的关键。一个新的 `Date` 对象被存储在 `userDate` 变量中。然后脚本运行了 `setFullYear()`、`setMonth()`\
  \ 和 `setDate()` 方法。\n\n此时，`userDate` 变量包含一个与提供的日期相对应的新日期。这意味着你可以使用 `toLocaleDateString`\
  \ 方法将日期转换为你需要的任何字符串。脚本首先定义了完整日期的字符串 (`dateString`)，然后定义了仅包含星期名称的字符串 (`dayName`)。完成后，脚本显示该日期及其对应的星期（查看\
  \ 图 8-7）。\n\n![记住](img/remember.png) 所有的“set”方法也会返回值。具体而言，它们返回的是从 GMT 1970 年 1 月\
  \ 1 日到方法结果的新新日期之间的毫秒数。因此，你可以使用“set”方法的返回值创建一个新的 `Date` 对象：\n\n```javascript\nnewDate\
  \ = new Date(userDate)\n```\n\n![脚本显示给定年份、月份和日期的星期](img/9781394684-fg0408.png) 图\
  \ 8-7 脚本显示给定年份、月份和日期的星期。\n\n#### 执行日期算术\n\n许多日期相关的脚本需要进行算术运算。例如，你可能需要计算两个日期之间的数，或者计算从今天起六周后的日期。到目前为止你学的方法以及\
  \ JavaScript 表示日期的方式，使得日期算术变得简单。\n\n最简单的计算是涉及整数日期和时间单位的计算：年、月、日、小时、分钟和秒。例如，假设你需要计算当前日期之后五年的日期。这里是实现此操作的代码片段：\n\
  \n```javascript\nconst myDate = new Date();\nconst myYear = myDate.getFullYear()\
  \ + 5;\nmyDate.setFullYear(myYear);\n```\n\n你使用 `getFullYear()` 获取年份，加上 5，然后使用 `setFullYear()`\
  \ 更改日期。\n\n作为一个实际示例，以下代码展示了一个计算年龄的脚本 (bk04ch08/example12.html)：\n\nHTML:\n```html\n\
  <label for=\"date-picker\">选择你的出生日期:</label>\n<input type=\"date\" id=\"date-picker\"\
  \ value=\"2000-01-01\">\n<div id=\"output\"></div>\n```\n\nJavaScript:\n```javascript\n\
  // 为日期选择器添加 `change` 事件监听器\nconst datePicker = document.querySelector('#date-picker');\n\
  datePicker.addEventListener('change', calculateAge);\n// 当日期变化时运行此函数\nfunction calculateAge()\
  \ {\n  // 根据日期选择器的值创建一个新的 Date 对象\n  const birthDate = new Date(datePicker.value);\n\
  \  // 存储用户的出生年份\n  const birthYear = birthDate.getFullYear();\n  // 创建一个 Date 对象并将其\n\
  \  // 设置为今年的生日\n  const birthdayDate = new Date();\n  birthdayDate.setMonth(birthDate.getMonth());\n\
  \  birthdayDate.setDate(birthDate.getDate());\n  // 存储当前日期和当前年份\n  const currentDate\
  \ = new Date();\n  const currentYear = currentDate.getFullYear();\n  // 计算用户的年龄\n\
  \  let userAge = currentYear - birthYear;\n  // 今年还没过生日吗？\n  if (currentDate < birthdayDate)\
  \ {\n    // 如果，将年龄减一岁\n    userAge -= 1;\n  }\n  // 输出结果\n  document.getElementById(\"\
  output\").innerHTML = `你今年 ${userAge} 岁。`;\n}\n```\n\n\n\n\n\nHTML 设置了一个日期选择器以获取用户的出生日期。JavaScript\
  \ 为日期选择器添加了 `change` 事件监听器，并在每次日期选择器变化时运行 `calculateAge` 函数。`calculateAge` 函数将日期选择器的值转换为\
  \ `Date` 对象，然后将出生年份提取到 `birthyear` 变量中。\n\n脚本创建了一个新的 `Date` 对象并将其存储在 `birthdayDate`\
  \ 中。使用 `setMonth()`（设置为 `birthDate.getMonth()`）和 `setDate()`（设置为 `birthDate.getDate()`）来更改日期，但没有使用\
  \ `setFullYear()`。这让你获取了用户今年当年的生日。然后，将当前日期存储在 `currentDate` 中，并将年份存储在 `currentYear`\
  \ 中。\n\n现在，脚本通过从 `currentYear` 中减去 `birthYear` 来计算用户的年龄。然而，如果用户的生日在今年还没有到，这个结果将是不准确的。因此，脚本会比较\
  \ `currentDate` 和 `birthdayDate`：如果 `currentDate` 小，意味着用户的生日还没到，脚本会在用户的年龄上减去 `1`。\n\
  \n#### 执行复杂的日期计算\n\n其他的日期计算更为复杂。例如，你可能需要计算两个日期之间的天数。对于这种计算，你需要利用 JavaScript 在内部将日期存储为毫秒值的这一特性。换句话说，它们是以数字的形式存储的，而当你处理数值时，可以使用数值表达式来对这些值进行计算。\n\
  \n这里的关键是将基础的日期单位——秒、分钟、小时、天和周——转换为毫秒。这里是一些可以帮助你的代码：\n\n```javascript\nconst ONESECOND\
  \ = 1000;\nconst ONEMINUTE = ONESECOND * 60;\nconst ONEHOUR = ONEMINUTE * 60;\n\
  const ONEDAY = ONEHOUR * 24;\nconst ONEWEEK = ONEDAY * 7;\n```\n\n![Remember](img/remember.png)\
  \ 在编程中，每当你拥有 `constants`（常量）变量时——即它们的值在整个脚本运行过程中永远不会改变——传统做法是将它们完全写成大写字母，以将其与普通变量区分开。\n\
  \n由于一秒等于 1000 毫秒，所以 `ONESECOND` 变量被赋值为 1000；因为一分钟等于 60 秒，所以 `ONEMINUTE` 变量被赋值为 `ONESECOND\
  \ * 60`，即 60,000 毫秒。其他值也是以此得出的。\n\n#### 计算两个日期之间的天数\n\n常见的日期计算涉及找出任意两个日期之间的天数。以下代码展示了一个执行此计算的函数（bk04ch08/example13.html）：\n\
  \n```javascript\nfunction daysBetween(date1, date2) {\n  // 将两个日期都转换为毫秒\n  const\
  \ date1Ms = date1.getTime();\n  const date2Ms = date2.getTime();\n  // 计算毫秒差\n \
  \ const differenceMs = Math.abs(date1Ms - date2Ms);\n  // 一天的毫秒数\n  const ONEDAY\
  \ = 1000 * 60 * 60 * 24;\n  // 转换为天数并返回\n  return Math.round(differenceMs/ONEDAY);\n\
  }\n```\n\n此函数接受两个 `Date` 对象参数——`date1` 和 `date2`。注意，哪个日期在前哪个日期在后并不重要，因为此函数计算的是它们差值的绝对值。常量\
  \ `ONEDAY` 存储了一天的毫秒数，然后使用 `getTime()` 方法将两个日期转换为毫秒。结果存储在变量 `date1Ms` 和 `date2Ms`\
  \ 中。\n\n接下来，以下语句计算两个日期之间差值的绝对值（毫秒）：\n\n```javascript\nconst differenceMs = Math.abs(date1Ms\
  \ - date2Ms);\n```\n\n然后，通过除以 `ONEDAY` 常量将此差值转换为天。`Math.round()`（我将在下一节中讨论）确保了结果为整数。\n\
  \n### 数字数字：Math 对象\n\n很少有 JavaScript 程序员永远不需要处理数字。我们大多数人都必须拼凑一些脚本来处理订单总额、生成销售税和运费、计算抵押贷款还款，并执行其他数字计算任务。尽管如此，必须说，JavaScript\
  \ 的数字工具在编程世界中并不是顶尖的，但它们有足够的功能让大多数脚本编写者感到满意。本节将为你介绍这些功能，并特别强调 `Math` 对象。\n\n你首先需要知道的是，JavaScript\
  \ 喜欢保持简单，特别是在处理数字时。例如，JavaScript 仅限于处理两种数值数据类型：`integers`（整数）——没有分数或小数部分的数字，如 1、759\
  \ 和 -50——以及 `floating-point numbers`（浮点数）——带有分数或小数部分的值，如 2.14、0.01 和 -25.3333。\n\
  \n#### 字符串与数字之间的转换\n\n在 JavaScript 中处理数值表达式时，确保所有的操作数都是数值是非常关重要的。例如，如果你提示用户输入一个值，你需要检查结果以确保它不是字母或\
  \ `undefined`（`prompt()` 的默认值）。如果你尝试使用后者（例如），JavaScript 将报告其值为 `NaN`（不是一个数字）。\n\n\
  同样地，如果你知道某个值是数字的字符串表示形式，你需要的某种方法将该字符串转换为对应的数值等价物。\n\n针对这些情况，JavaScript 提供了几种技术来确保你的操作数是数值。\n\
  \n##### parseInt() 函数\n\n我从 `parseInt()` 函数开始，你用它将字符串转换为整数：\n\n```javascript\nparseInt(string,\
  \ base);\n```\n\n*   `string`: 你想要转换的字符串值。\n*   `base`: `string` 中数字使用的可选基数。如果你忽略此值，JavaScript\
  \ 将使用 10 基数。\n\n注意，如果 `string` 参数包含浮点值的字符串表示形式，`parseInt()` 只返回整数部分。此外，如果字符串以数字开头并跟着某些文本，`parseInt()`\
  \ 将返回数字（或至少是它的整数部分）。下表显示了各种 `string` 值的 `parseInt()` 结果。\n\n| `string` | `parseInt(string)`\
  \ |\n| --- | --- |\n| \"5\" | 5 |\n| \"5.1\" | 5 |\n| \"5.9\" | 5 |\n| \"5 feet\"\
  \ | 5 |\n| \"take 5\" | `NaN` |\n| \"five\" | `NaN` |\n\n##### parseFloat() 函数\n\
  \n`parseFloat()` 函数与 `parseInt()` 类似，但你用它将字符串转换为浮点值：\n\n```javascript\nparseFloat(string);\n\
  ```\n\n注意，如果 `string` 参数包含整数值的字符串表示形式，`parseFloat()` 只返回整数。同样，与 `parseInt()` 一样，如果字符串以数字开头并跟着某些文本，`parseFloat()`\
  \ 将返回该数字。下表显示了某些 `string` 值的 `parseFloat()` 结果。\n\n| `string` | `parseFloat(string)`\
  \ |\n| --- | --- |\n| \"5\" | 5 |\n| \"5.1\" | 5.1 |\n| \"5.9\" | 5.9 |\n| \"5.2\
  \ feet\" | 5.2 |\n| \"take 5.0\" | `NaN` |\n| \"five-point-one\" | `NaN` |\n\n#####\
  \ + 运算符\n\n为了快速将字符串转换为数字，我最常用的是 `+` 运算符，它告诉 JavaScript 将包含数字的字符串视为真正的数值。例如，考虑以下代码：\n\
  \n```javascript\nconst numOfShoes = '2';\nconst numOfSocks = 4;\nconst totalItems\
  \ = +numOfShoes + numOfSocks;\n```\n\n通过在 `numOfShoes` 变量前面加上 `+`，我强制 JavaScript\
  \ 将该变量的值设置为 2，加法结果将为 6。\n\n#### Math 对象的属性和方法\n\n`Math` 对象与你在书中遇到的其他对象都不同。这是因为你不会创建一个存储在变量中的\
  \ `Math` 对象的实例。相反，`Math` 对象是一个内置的 JavaScript 对象，你可以直接使用它。本章的剩余部分将探索与 `Math` 对象相关的某些属性和方法。\n\
  \n\n\n\n\n`Math` 对象的属性都是在数学运算中常用的常量。表 8-6 列出了所有可用的 `Math` 对象属性。\n\n| 属性语法 | 代表的含义\
  \ | 近似值 |\n| --- | --- | --- |\n| `Math.E` | 欧勒常数 | 2.718281828459045 |\n| `Math.LN10`\
  \ | 10 的自然对数 | 2.302585092994046 |\n| `Math.LN2` | 2 的自然对数 | 0.6931471805599453\
  \ |\n| `Math.LOG2E` | `E` 的底数为 2 对数 | 1.4426950408889633 |\n| `Math.LOG10E` | `E`\
  \ 的底数为 10 对数 | 0.4342944819032518 |\n| `Math.PI` | 常数 π | 3.141592653589793 |\n\
  | `Math.SQRT1_2` | 1/2 的平方根 | 0.7071067811865476 |\n| `Math.SQRT2` | 2 的平方根 | 1.4142135623730951\
  \ |\n\n表 8-6 Math 对象的某些属性\n\n#### Math 对象的方法\n\n`Math` 对象的方法允许你执行数学运算，如平方根、幂、四舍入、三角函数等。`Math`\
  \ 对象的许多方法已总结在表 8-7 中。\n\n| 方法语法 | 返回值 |\n| --- | --- |\n| `Math.abs(number)` | `number`\
  \ 的绝对值（即不带任何符号的数字） |\n| `Math.cbrt(number)` | `number` 的立方根 |\n| `Math.ceil(number)`\
  \ | 大于或等于 `number` 的最小整数（`ceil` 是 `ceiling` 的缩写） |\n| `Math.cos(number)` | `number`\
  \ 的余弦；返回值的范围从 -1 到 1 弧度 |\n| `Math.exp(number)` | `E` 的 `number` 次方 |\n| `Math.floor(number)`\
  \ | 小于或等于 `number` 的最大整数 |\n| `Math.log(number)` | `number` 的自然对数（底数为 `E`） |\n|\
  \ `Math.max(number1, number2)` | `number1` 和 `number2` 中较大的值 |\n| `Math.min(number1,\
  \ number2)` | `number1` 和 `number2` 中较小的值 |\n| `Math.pow(number1, number2)` | `number1`\
  \ 的 `number2` 次方 |\n| `Math.random()` | 0 到 1 之间的随机数 |\n| `Math.round(number)` |\
  \ 离 `number` 最近的整数 |\n| `Math.sin(number)` | `number` 的正弦；返回值的范围从 -1 到 1 弧度 |\n\
  | `Math.sqrt(number)` | `number` 的平方根（必须大于或等于 0） |\n| `Math.tan(number)` | `number`\
  \ 的正切值（弧度） |\n| `Math.trunc(number)` | `number` 的整数部分 |\n\n表 8-7 Math 对象的某些方法\n\n\
  ## 第 9 章\n\n# 在浏览器中存储用户数据\n\n### 本章内容\n\n- 掌握 Web Storage API\n- 初步接触 JSON\n- 向存储器添加内容\n\
  - 从存储器中获取内容\n- 从存储器中移除内容\n\n*数据就像垃圾。在收集它们之前，你最好知道你打算如何处理它们。*\n— 马克·吐因（相传）\n\n大型网站的标志之一是，作为网站访问者看到的大部分内容都是从服务器获取的数据。这些数据由数据库专家创建并管理，而请求所需数据并将其返回给网络浏览器的代码则由后端\
  \ Web 开发人员创建。\n\n遗憾的是，后端编码超出了本书的范围（但它是我的同类书籍 *Web Coding and Development All-in-One\
  \ For Dummies* [Wiley] 的重要部分）。本书完全关于前端 Web 开发，但这是否意味着在处理数据时你就没机会了呢？\n\n例如，假设你的网页允许每个用户设置自定义的背景颜色和文本颜色。这只是两条数据，因此为了存储这些数据而建立一个极其复杂的后端架构，就好像为了存几条毛巾而建造了泰姬陵。\n\
  \n幸运的是，你不需要为了给每个用户保存少量数据而启动一项大型建设工程。相反，你可以利用一种名为 web storage（网络存储）的技术，它允许你直接在用户的\
  \ Web 浏览器中存储数据。这非常文明，你将在本章了解到你需要的所有知识。\n\n### 理解 Web Storage\n\n网络存储是通过一种名为 Web\
  \ Storage API（应用程序编程接口）的技术实现的，它定义了 `Window` 对象（引用用户浏览器窗口的对象）的两个属性：\n\n- `localStorage`：在\
  \ 浏览器内部为你的域名创建的存储空间（这意味着只有你的本地代码可以访问此存储器）。该存储器中的数据不能大于 5MB。这些数据永久留在浏览器中，直到你将其删除。\n\
  - `sessionStorage`：与 `localStorage` 相同，但数据仅在当前浏览器会话中持久。当用户关闭浏览器窗口时，浏览器会删除这些数据。\n\
  \n用户还可以通过浏览器移除网站数据的命令来删除网络存储数据。如果你的网页确实需要用户数据是永久的（或者至少完全受你控制），你需要将其存储在服务器上。\n\n\
  `localStorage` 和 `sessionStorage` 都充当对象的角色，实现了多种方法，你的代码可以使用这些方法来添加、检索和删除用户数据。每个数据项都作为\
  \ JSON 对象的一部分以键值对的形式存储。你问到底什么是“JSON 对象”？亲爱的读者，请继续读下去。\n\n### 介绍 JSON\n\n很久以前，一位额头很高的人意识到，JavaScript\
  \ 世界需要一种简单的方法在脚本之间传输数据（例如，在 Web 服务器之间，或在 Web 浏览器之间）。这种格式必须是纯文本，具有相对简单的语法，并且是一个开放标准，这样在使用时就不会限制。\n\
  \n结果就是名为 JavaScript 对象表示法（JavaScript Object Notation），简称为 `JSON`（读音同名字 Jason）的数据格式。名称中的“JavaScript”部分告诉你\
  \ JSON 是 JavaScript 标准的一部分，该标准包含一个用于处理 JSON 字符串的 `JSON` 对象。名称中的“Object”部分告诉你（正如我在下一节中描述的那样），JSON\
  \ 的语法与 JavaScript 对象的语法非常相似。\n\n#### 学习 JSON 语法\n\n我在书的多个地方提到了 JavaScript 对象字面量，如果你了解对象字面量，那么\
  \ JSON 对象看起来会非常熟悉。以下是通用语法：\n\n```\n{\n  \"property1\": \"value1\",\n  \"property2\"\
  : \"value2\",\n  ...\n  \"propertyN\": \"valueN\"\n}\n```\n\nJSON 数据看起来像一个对象，但它实际上只是文本，由一个或多个键值对组成，具有以下特征：\n\
  \n- 每个属性名都用双引号（`\"`）包围。\n- 每个值可以是以下之一：\n    - 数字\n    - 字符串（在这种情况下值必须用双引号包围）\n \
  \   - 布尔值（`true` 或 `false`）\n    - `null`（即没有值）\n    - JavaScript 数组字面量（用方括号 `[`\
  \ 和 `]` 包围的逗号分隔的值）\n    - JavaScript 对象字面量（用大括号 `{` 和 `}` 包围的逗号分隔的*属性*:*值*对）\n-\
  \ 键值对之间用逗号分隔。\n- 键值对块用大括号（`{` 和 `}`）包围。\n\n这是一个示例：\n\n```\n{\n  \"account\": 853,\n\
  \  \"name\": \"Alfreds Futterkiste\",\n  \"supplier\": false,\n  \"recentOrders\"\
  : [28394, 29539, 30014],\n  \"contact\": {\n    \"name\": \"Maria Anders\",\n  \
  \  \"phone\": \"030-0074321\",\n    \"email\": \"m.anders@futterkiste.com\"\n  }\n\
  }\n```\n\n#### 声明和使用 JSON 变量\n\n\n\n\n\n在下一节中，我将讨论 JSON 对于在网页存储（web storage）之间传输数据时有多用。不过，你也可以在非网页存储的代码中使用\
  \ JSON 数据。首先，你需要声明一个 JSON 变量（请查看本书中示例文件中的 `bk04ch09/example01.html`）：\n\n```javascript\n\
  const customer = {\n  \"account\": 853,\n  \"name\": \"Alfreds Futterkiste\",\n\
  \  \"supplier\": false,\n  \"recentOrders\": [28394,29539,30014],\n  \"contact\"\
  : {\n    \"name\": \"Maria Anders\",\n    \"phone\": \"030-0074321\",\n    \"email\"\
  : \"anders@futterkiste.com\"\n  }\n}\n```\n\n然后，你可以使用 `variable.property` 语法引用 JSON\
  \ 数据中的任何属性。以下是一些示例：\n\n`customer.account // 返回 853`\n\n`customer.name // 返回 \"Alfreds\
  \ Futterkiste\"`\n\n`customer.recentOrders[1] // 返回 29539`\n\n`customer.contact.email\
  \ // 返回 \"anders@futterkiste.com\"`\n\n![提示](img/tip.png) JSON 语法可能有点复杂，因此在代码中使用数据之前，检查数据是否有效是一个好主意。最简单的方法是使用\
  \ JSONLint ([`jsonlint.com``](https://jsonlint.com)) 验证工具。复制你的 JSON 代码，粘贴到 JSONLint\
  \ 文本区域中，然后点击 Validate JSON。\n\n#### 将 JavaScript 对象转换为 JSON\n\n虽然你可以在代码中直接使用 JSON\
  \ 数据，但你更有可能将数据存储在 JavaScript 对象中。如果你随后需要将该对象转换为 JSON 格式，可以通过调用 `JSON` 对象的 `stringify()`\
  \ 方法将对象进行字符串化。以下是可以使用的简写语法：\n\n`JSON.stringify(object, replacer, spaces)`\n\n* \
  \  `object`: 你想要转换为 JSON 格式的 JavaScript 对象。\n*   `replacer`: 以某种方式修改字符串化过程的函数或数组。此参数超出了本书的讨论范围，因此在示例中我将此参数设置为\
  \ `null`。\n*   `spaces`: 可选值，用于指定你希望 JSON 字符串为了可读性而缩进的空格数。（如果你永远不需要查看生成的 JSON 字符串，可以省略\
  \ `null` 和 `spaces` 参数，只使用 `object` 参数。）\n\n这是一个示例（请查看 `bk04ch09/example02.html`）：\n\
  \nHTML:\n```html\n<pre id=\"output\"></pre>\n```\n\nJavaScript:\n```javascript\n\
  // 一个 JavaScript 对象\nconst userData = {\n  bgColor: \"darkolivegreen\",\n  textColor:\
  \ \"antiquewhite\",\n  textSize: \"1.25em\",\n  typefaces: [\"Georgia\", \"Verdana\"\
  , \"serif\"],\n  subscriber: true,\n  subscriptionType: 3\n};\n\n// 将其字符串化\nconst\
  \ userDataJSON = JSON.stringify(userData, null, \" \");\n\n// 显示结果\ndocument.querySelector('#output').innerHTML\
  \ = userDataJSON;\n```\n\n图 9-1 显示了输出。\n\n![将 JavaScript 对象转换为 JSON 字符串的截图](img/9781394164684-fg040901.png)\n\
  \n图 9-1: 转换为 JSON 字符串的 JavaScript 对象。\n\n#### 将 JSON 字符串转换为 JavaScript 对象\n\n当你的脚本接收到\
  \ JSON 字符串时（来自服务器，或者在本章中，来自网页存储），你通常希望将该字符串转换为一个标准的、老式的 JavaScript 对象。你可以通过调用 `JSON`\
  \ 对象的 `parse()` 方法来实现这种转换：\n\n`JSON.parse(json)`\n\n*   `json`: 你想要转换为 JavaScript\
  \ 对象的 JSON 字符串。\n\n这是一个示例（`bk04ch09/example03.html`）：\n\n```javascript\n// 声明一个\
  \ JSON 字符串\nconst userDataJSON = `{\n  \"bgColor\": \"darkolivegreen\",\n  \"textColor\"\
  : \"antiquewhite\",\n  \"textSize\": \"1.25em\",\n  \"typefaces\": [\n    \"Georgia\"\
  ,\n    \"Verdana\",\n    \"serif\"\n  ],\n  \"subscriber\": true,\n  \"subscriptionType\"\
  : 3}`;\n\n// 解析\nconst userData = JSON.parse(userDataJSON);\n\n// 显示结果\nconsole.log(userData);\n\
  ```\n\n注意 `userDataJSON` 字符串中使用了反引号（```）分隔符，这允许我为了可读性在多行显示 JSON 数据。图 9-2 显示了控制台中的输出（参见第\
  \ 4 本 第 10 章）。\n\n![提示](img/tip.png) 在大多数网页浏览器中显示控制台，请右键点击网页，点击“检查”（在 Windows 中按\
  \ Ctrl+Shift+I，或在 macOS 中按 Option+⌘  +I），然后点击“控制台”标签页。\n\n![将 JSON 字符串转换为 JavaScript\
  \ 对象的截图](img/9781394164684-fg040902.png)\n\n图 9-2: 转换为 JavaScript 对象的字符串。\n\n####\
  \ 向网页存储添加数据\n\n当你的脚本接收到 JSON 字符串（来自服务器，或者为了本章的目的，来自网页存储）时，你通常希望将该字符串转换为一个传统的 JavaScript\
  \ 对象。你通过调用 `JSON` 对象的 `parse()` 方法进行该转换：\n\n`JSON.parse(json)`\n\n*   `json`: 想要转换为\
  \ JavaScript 对象的 JSON 字符串。\n\n这是一个示例（`bk04ch09/example03.html`）：\n\n```javascript\n\
  // 声明一个 JavaScript 对象\nconst userData = {\n  \"bgColor\": \"darkolivegreen\",\n\
  \  \"textColor\": \"antiquewhite\",\n  \"textSize\": \"1.25em\",\n  \"typefaces\"\
  : [\"Georgia\", \"Verdana\", \"serif\"],\n  \"subscriber\": true,\n  \"subscriptionType\"\
  : 3\n};\n```\n\n在将此类对象添加到网页存储之前，你必须使用 `stringify()` 方法将其字符串化（`bk04ch09/example04.html`）：\n\
  \n`localStorage.setItem('user-data', JSON.stringify(userData));\n\n![提示](img/tip.png)\
  \ 当你测试网页时，可能想要检查数据是否存储正确。你可以打开浏览器的开发工具（参见第 4 本，第 10 章;`\n\n当你使用网页存储存储数据时，将相关的键值对转换为字符串。例如：\n\
  \n`localStorage.setItem(key, value)`\n\n或者：\n\n`sessionStorage.setItem(key, value)`\n\
  \n*   `key`: 指定网页存储键的字符串。\n*   `value`: 与网页存储关联的值。\n\n网页存储只能存储字符串，因此当你使用 `localStorage`\
  \ 存储数据时，必须将其转换为字符串。\n\n`localStorage.setItem(key, value)`\n\n存储存储是是存储的。例如：\n\n`customer.account\
  \ // 返回 853`\n\n使用 `setItem()` 方法：\n\n*   `key`: 指定网页存储键的字符串。\n*   `value`: 与网页存储关联的值。\n\
  \n当你不再需要某些存储的数据时，最好从 `localStorage` 或 `sessionStorage` 对象中移除它。\n\n网页存储是有限的。\n\n\n\
  \n要删除某些数据，使用 `removeItem()` 方法：\n\n`localStorage.removeItem(key)`\n\n或者：\n\n`sessionStorage.removeItem(key)`\n\
  \n\n\n\n\n*   `key`: 一个指定存储项键的字符串\n\n这是一个示例：\n\n```\nlocalStorage.removeItem('fave-color');\n\
  ```\n\n如果你想从头开始并删除网络存储中的所有内容，请使用 `clear()` 方法：\n\n```javascript\nlocalStorage.clear()\n\
  ```\n\n或者：\n\n```javascript\nsessionStorage.clear()\n```\n\n## 第 10 章\n\n# 调试你的代码\n\
  \n本章内容\n\n* ![Bullet](img/check.png) 学习 JavaScript 的错误类型\n* ![Bullet](img/check.png)\
  \ 使用控制台（Console）调试错误\n* ![Bullet](img/check.png) 设置断点\n* ![Bullet](img/check.png)\
  \ 观察变量和表达式的值\n* ![Bullet](img/check.png) 学习 JavaScript 最常见的错误和错误信息\n\n*测试证明了程序员的失败。调试是程序员的辩护。*\n\
  \n—BORIS BEIZER\n\n让短脚本和函数运行起来通常不需要花费长时间。然而，随着你的代码变得越来越庞大复杂，错误不可避免地会出现。事实上，数学上已经证明，任何超过最低复杂度水平的代码都会包含至少一个错误，而且可能比这多得多。\n\
  \n侵入你代码的许多错误是简单的语法问题，你可以快速修复它们，但其他错误会更加微妙且更难发现。对于后者——无论是函数返回了错误值还是脚本整体逻辑出现问题——你都需要能够“进入”代码内部以找出哪里出了问题。好消息是，JavaScript\
  \ 和现代网络浏览器提供了大量的顶尖调试工具，可以减轻解决程序问题的某些负担。在本章中，你将深入研究这些工具，探索它们如何帮助你发现并修复大多数编程错误。你还将研究许多技巧和方法，这些方法可以在很大程度上帮助你从源源上避免编码错误。\n\
  \n### 理解 JavaScript 的错误类型\n\n当问题发生时，你首先需要确定你正在处理的是哪种错误。基本有三种：语法错误、运行时错误和逻辑错误。\n\n\
  #### 语法错误\n\n语法错误源于拼写错误、缺失关键字或标点符号不正确。JavaScript 几乎会在加载页面时捕捉到这些错误（这就是为什么语法错误也被加载时错误）。也就是说，当\
  \ JavaScript 读取脚本语句时，它会检查每条语句是否有语法错误。如果发现错误，将停止处理脚本并显示错误信息。这里有一个示例语句（请查看书中示例文件中的\
  \ `bk04ch10/example01.html`），包含一个典型的语法错误（你能发现吗？），图 10-1;\n```\n\n![Firefox 控制台窗口显示了有关典型语法错误数据的截图。](img/9781394164684-fg041001.png)\n\
  \n图 10-1： 显示有关典型语法错误数据的 Firefox 控制台窗口。\n\n#### 运行时错误\n\n运行时错误发生在脚本执行期间。它们通常意味着 JavaScript\
  \ 遇到了一个它无法理解的语句。这可能是由于尝试在表达式中使用未初始化的变量（即尚未赋值的变量），或者在错误的对象上使用属性或方法导致的。\n\n如果你的脚本中有在页面加载时执行的语句，且没有发现语法错误，JavaScript\
  \ 将尝试运行这些语句。如果遇到有问题的语句，它将停止脚本执行并显示错误。如果你的脚本中有一个或多个函数，JavaScript 在你调用它们之前不会在这些函数中寻找运行时错误。\n\
  \n这里有一些代码（查看 `bk04ch10/example02.html`），我在第三行拼错了一个变量名（是 `pagefooter` 而不是 `pageFooter`），图\
  \ 10-2;\nconst currDate = new Date();\npagefooter.innerHTML = \"Copyright \" + currDate.getFullYear()\
  \ + \" Logophilia Limited.\";\n```\n\n![Chrome 控制台显示了有关典型运行时错误数据的截图。](img/9781394164684-fg041002.png)\n\
  \n图 10-2： 显示有关典型运行时错误数据的 Chrome 控制台。\n\n#### 逻辑错误\n\n如果你的代码运行结果偏离了预期，原因通常是脚本逻辑中的缺陷。它可能是一个永远不会结束的循环，或者一个没有切换到任何内容的\
  \ `switch` 测试。\n\n逻辑错误最难确定，因为你不会得到任何错误信息来告诉你哪里出了问题以及在哪里。你通常需要设置调试代码，帮助你监控值并跟踪程序的执行情况。我将在本章后面的部分介绍最有用的调试技术。\n\
  \n### 认识你的调试工具\n\n所有主要的网络浏览器都带有一套复杂的调试工具，这可以让你作为 Web 开发者的生活变得更容易、更理性。大多数 Web 开发者使用\
  \ Google Chrome 调试脚本，因此在本章中关注该浏览器。但在本节，我将为你概述所有主要浏览器中提供的工具以及如何进入它们。\n\n以下是在 Chrome、Firefox、Microsoft\
  \ Edge 和 Safari 中打开 Web 开发工具的方法：\n\n*   **Windows 版 Chrome:** 点击“自定义并控制 Google Chrome”（地址栏右侧的三个垂直点），然后选择“更多工具⇒  开发者工具”。快捷键：`Ctrl+Shift+I`。\n\
  *   **Mac 版 Chrome:** 选择“查看⇒  开发者⇒  开发者工具”。快捷键：`Option+⌘  +I`。\n*   **Windows 版\
  \ Firefox:** 点击“应用程序菜单”（工具栏最右侧的三个水平线），然后选择“更多工具 ⇒  Web 开发者工具”。快捷键：`Ctrl+Shift+I`。\n\
  *   **Mac 版 Firefox:** 选择“工具⇒  浏览器工具⇒  Web 开发者工具”。快捷键：`Option+⌘  +I`。\n*   **Microsoft\
  \ Edge:** 点击“设置和更多”（地址栏右侧的三个垂直点），然后选择“更多工具⇒  开发者工具”。快捷键：`Ctrl+Shift+I`。\n*   **Safari:**\
  \ 选择“开发⇒  显示网页检查器”。快捷键：`Option+⌘  +I`。如果没有开发菜单，选择 Safari⇒ 设置，点击高级标签页，然后勾选“在菜单栏显示开发菜单”。\n\
  \n这些开发工具提供的功能各异，但每个都提供的相同的基础工具。这些基础 Web 开发工具包括：\n\n*   **HTML 查看器:** 此标签页（在 Firefox\
  \ 中称为 `Inspector`，在其他浏览器中称为 `Elements`）显示网页中使用的 HTML 源代码。当你将鼠标指针悬停在标签上时，浏览器会在显示页面中突出显示该元素并显示其宽度和高度，如图\
  \ 10-3 所示。当你点击标签时，浏览器会显示应用该标签的 CSS 样式，以及标签的盒模型尺寸（再次参考图 10-3）。查看第三本书的第 4 章以了解更多关于使用开发工具检查\
  \ CSS 的知识。![HTML 查看器（如 Chrome 的 Elements 标签）允许你检查每个元素的样式和盒模型尺寸。](img/9781394164684-fg041003.png)\n\
  \n    图 10-3： HTML 查看器（如 Chrome 的 Elements 标签）允许你检查每个元素的样式和盒模型尺寸。\n*   **控制台 (Console):**\
  \ 此标签页允许你查看错误信息、日志消息、测试表达式并执行语句。我将在下一节更详细地介绍 `Console`。\n\n\n\n\n\n-   **调试工具：**\
  \ 此标签页（在 Firefox 中称为 `Debugger`，在其他浏览器中称为 `Sources`）允许你暂停代码执行、单步执行代码、观察变量和属性的值等等。这是最重要的\
  \ JavaScript 调试工具，因此我将在本章后后详细介绍它。\n-   **网络：** 此标签页可以告诉你你的网页引用的每个文件加载需要多长时间。如果你发现页面加载缓慢，此标签页可以帮你找到瓶颈。\n\
  -   **Web 存储：** 此标签页（在 Chrome 和 Edge 中称为 `Application`，在 Firefox 和 Safari 中称为 `Storage`）允许你使用\
  \ `Web Storage API` 查看存储在浏览器的数据，我将在第 4 卷第 9 章中讨论它。\n\n### 使用控制台调试\n\n如果你的网页运行异常——例如，页面是空白或缺少元素——你应该首先检查你的\
  \ HTML 代码以确保它是正确的。（常见的 HTML 错误包括没有用大于号（`>`）结束标签、未包含闭合标签，以及属性值缺少闭合引号。）如果你的 HTML 检查没问题，那么很有可能是你的\
  \ JavaScript 代码有问题。你如何知道呢？访问控制台（Console）窗口是你的第一步。\n\n控制台是一个交互式浏览器窗口，可以显示警告和错误、显示\
  \ `console.log()` 语句的输出，并允许你在无需运行整个脚本的情况下执行表达式和语句。控制台是最实用的 Web 浏览器调试工具之一，因此你需要熟悉如何操作它。\n\
  \n#### 在各种浏览器中显示控制台\n\n要显示控制台，请打开网络浏览器的开发者工具，然后点击 Console 标签页。你也可以使用以下快捷键：\n\n-\
  \   **Windows 版 Chrome：** 按 `Ctrl+Shift+J`。\n-   **Mac 版 Chrome：** 按 `Option+⌘  +J`。\n\
  -   **Windows 版 Firefox：** 按 `Ctrl+Shift+K`。\n-   **Mac 版 Firefox：** 按 `Option+⌘  +K`。\n\
  -   **Microsoft Edge：** 按 `Ctrl+Shift+J`。\n-   **Safari：** 按 `Option+⌘  +C`。\n\n\
  #### 向控制台记录数据\n\n你可以使用特殊 `Console` 对象的 `console.log()` 方法在控制台中打印文本和表达式值：\n\n```\n\
  console.log(\"output\")\n```\n\n-   `output`：你想要在控制台中打印的表达式。\n\n`output` 表达式可以是文本字符串、变量、对象属性、函数结果，或这些者的任何组合。\n\
  \n![Tip](img/tip.png) 你还可以使用实用的 `console.table()` 方法以易于阅读的表格格式输出数组或对象的值：\n\n```javascript\n\
  console.table(\"output\")\n```\n\n-   `output`：你想要在控制台中查看的数组或对象（作为变量或字面量形式）。\n\n\
  出于调试目的，你最经常使用控制台来监控变量、对象属性和表达式的值。也就是说，当你的代码设置或更改某个值的值时，你插入一个 `console.log()`（或 `console.table()`）语句来输出新值。当脚本执行完成后，你可以打开控制台，然后检查记录的单个或多个值。\n\
  \n#### 在控制台中执行代码\n\n控制台的强大功能之一是它是交互式的，这意味着你不仅可以读取由浏览器或你的 `console.log()` 语句生成的消息，还可以直接在控制台中输入代码。也就是说，你可以使用控制台执行表达式和语句。该功能有许多用途：\n\
  \n-   你可以尝试一些实验性的表达式或语句来确定它们对脚本的影响。\n-   当脚本暂停时，你可以输出变量或属性的当前值。\n-   当脚本暂停时，你可以更改变量或属性的值。例如，如果你发现值为零的变量即将用作除数，你可以将该变量改为非零值避免脚本崩溃。\n\
  -   当脚本暂停时，你可以运行函数或方法，以判断它在当前条件下运行是否符合预期。\n\n每个浏览器的 Console 标签页都包含一个文本框（通常由大于号 `>`\
  \ 提示标记），你可以用它输入你的表达式或语句。\n\n![Tip](img/tip.png) 你可以通过分号分隔每个语句在控制台中执行多个语句。例如，你可以通过输入类似下面的语句来测试\
  \ `for…` 循环：\n\n```javascript\nfor (let i=1; i < 10; i += 1){console.log(i**2);\
  \ console.log(i**3);}\n```\n\n![Tip](img/tip.png) 如果你想在控制台中重复执行之前的代码，或者想运行某些与之前运行的代码非常相似的代码，你可以调回当前浏览器会话中使用的语句和表达式。按向上箭头键可以向上滚动之前执行的代码；按向下箭头可以向前滚动代码。\n\
  \n### 暂停你的代码\n\n在执行过程中暂停代码允许你检查某些元素，例如变量和属性的当前值。它还允许你一次执行一条程序代码，以便监控脚本的执行流。\n\n\
  当你暂停代码时，JavaScript 会进入 `break mode`（中断模式），这意味着浏览器会显示其调试工具并突出显示当前语句（JavaScript 将要执行的语句）。图\
  \ 10-4 显示了 Chrome 调试器（`Sources` 标签页）中断点模式下的脚本。\n\n#### 进入断点模式\n\nJavaScript 提供了两种进入断点模式的方法：\n\
  \n-   通过设置断点\n-   使用 `debugger` 语句\n\n![调用断点模式时的截图，网络浏览器显示了调试工具并突出显示了它将执行的语句。](img/9781394164684-fg041004.png)\n\
  \n图 10-4： 当你调用断点模式时，网络浏览器显示其调试工具并突出显示它将执行的语句。\n\n#### 设置断点\n\n如果你大致知道错误或逻辑缺陷发生的位置，可以通过设置断点在脚本的特定语句处进入断点模式。以下是设置断点的步骤：\n\
  \n1. **显示你的网络浏览器开发者工具并切换到调试工具（例如 Chrome 中的 `Sources` 标签页）。**\n2. **打开包含你想调试的 JavaScript\
  \ 代码的文件。**\n   操作方法取决于浏览器：在 Chrome（以及大多数浏览器）中，你有两个选择：\n   - 在左侧面板中，点击 HTML 文件（如果你的\
  \ JavaScript 代码位于 HTML 文件的 `script` 元素中）或 JavaScript (`.js`) 文件（如果你的代码存在于外部 JavaScript\
  \ 文件中）。\n   - 按 `Ctrl+P` (Windows)或 `⌘  +P` (macOS)，然后点击出现列表的文件。\n3. **找到你想要进入断点模式的语句。**\n\
  \   JavaScript 将运行直到该语句之前（但不包括该语句）的每一行代码。\n4. **点击语句左侧的行号来设置断点，如图 10-5 所示。**\n\n\
  ![浏览器调试工具的截图，点击行号以在该语句上设置断点。](img/9781394164684-fg041005.png)\n\n图 10-5： 在浏览调试工具中，点击行号在该语句上设置断点。\n\
  \n要移除断点，大多数浏览器为你提供了三个选择：\n\n-   要临时禁用断点，取消勾选断点列表中断点的复选框。\n-   ![image](img/9781394164684-ma003.png)\
  \ 要临时禁用你的所有断点，点击“禁用断点”按钮。Chrome 版本的该按钮显示在侧边栏。再次点击此按钮可重新激活所有断点。\n-   要完全移除断点，点击语句的行号。\n\
  \n#### 使用 debugger 语句进入断点模式\n\n\n\n\n\n在开发网页时，你经常会通过向脚本发送各种测试值或在不同条件下进行尝试来测试脚本的健壮性。在许多情况下，你可能想要进入断点模式（break\
  \ mode）以确保一切看起来正常。你可以在特定的语句上设置断点（breakpoints），但如果你关闭了文件，断点就会丢失。如果想使用更持久的方法，你可以在脚本中包含一个\
  \ `debugger` 语句。JavaScript 每当遇到 `debugger` 语句时，会自动进入断点模式。\n\n这里有一段包含 `debugger`\
  \ 语句的代码（`bk04ch10/example03.html`）：\n\n```javascript\n// 将句子添加到 <div> 标签中\ndocument.querySelector('div').innerHTML\
  \ = sentence;\n\n// 生成随机颜色（使用小于 128 的值以保持文字颜色为深色）\nconst randomRed = parseInt(Math.random()\
  \ * 128);\nconst randomGreen = parseInt(Math.random() * 128);\nconst randomBlue\
  \ = parseInt(Math.random() * 128);\ndebugger;\n```\n\n#### 退出断点模式\n\n要退出断点模式，你可以在浏览器的调试工具中使用以下方法之一：\n\
  \n*   ![image](img/9781394164684-ma004.png) **点击恢复（Resume）按钮。** Chrome 版本的此按钮显示在侧边栏。\n\
  *   **按下浏览器的“恢复”快捷键。** 在 Chrome（以及大多数浏览器）中，按按 `F8` 或按 `Ctrl+\\`（Windows）或 `⌘  +\\\
  `（macOS）。\n\n### 逐步执行代码\n\n最常用（也最有用）的调试技术之一是逐语句单步执行代码。这样做可以让你熟悉程序的流程，以确保循环和函数调用等操作执行正常。你可以使用四种技术：\n\
  \n*   逐语句单步执行\n*   单步进入代码（Step into）\n*   跳过某些代码（Step over）\n*   跳出某些代码（Step out）\n\
  \n#### 逐语句单步执行\n\n逐执行代码最常用的方法是每次执行一条语句。在断点模式下，逐语句执行意味着两点：\n\n*   你执行当前语句，然后在下一语句处暂停。\n\
  *   如果当前要执行的语句是一个函数调用，单步执行将带你进入函数，并在函数的第一语句处暂停。然后你可以继续单步执行该函数，直到执行最后一条语句，此时浏览器会将你返回函数调用之后的语句。\n\
  \n要逐语句单步执行代码，请设置一个断点，然后在代码进入断点模式后，执行以下操作之一来单步执行单个语句：\n\n*   ![image](img/9781394164684-ma005.png)\
  \ **点击单步（Step）按钮。** Chrome 版本的此按钮显示在侧边栏。\n*   **按下浏览器的“单步”快捷键。** 在 Chrome（以及大多数浏览器，但\
  \ Firefox 除外，截至本文时 Firefox 不支持“单步”；请改用“单步进入”按钮）中，按 `F9`。\n\n继续单步执行，直到脚本结束或你准备好恢复正常执行（通过点击“恢复”）。\n\
  \n#### 单步进入代码\n\n在所有主流浏览器中（Firefox 除外），单步进入某些代码与逐语句单步执行代码完全相同。区别在于语句异步执行时（即它在延迟后后执行操作，而不是立即执行）。\n\
  \n为了理解这种区别，请考虑以下代码（我在左侧添加了行号；它们不是代码的一部分；请查看 `bk04ch10/example04.html`）：\n\n```javascript\n\
