  \ 4-4 所示。\n\n![较小视口的截图，main 元素变为单列（左侧），因为 aside 元素已换行（右侧）。](img/9781394164684-fg050404.png)\n\
  \n图 4-4： 在较小的视口中，`main` 元素变为单列（左侧），因为 `aside` 元素已换行（右侧）。\n\n#### CSS Grid 如何让页面变为流式\n\
  \n根据你的页面内容，CSS Grid 是将静态布局转换为流式布局的极佳选择。（查看第 5 本第 3 章 了解 CSS Grid 的工作原理。）Grid 在构建响应式布局方面有很多选项，但以下三种技术在大多数情况下都能帮你达到目标：\n\
  \n*   使用 `fr` 单位允许网格项目填充网格容器中的可用空间。\n*   通过仅指定列模板或行模板（而不是两者都指定），让浏览器为你完成部分工作。\n\
  *   在你的模板中，使用 `auto-fit` 关键字让浏览器自动执行列宽或行高的计算。\n\n例如，以下声明告诉浏览器自动用等宽（`1fr`）列来适应容器宽度，这些列的宽度不小于\
  \ `15rem`：\n\n`grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));`\n\n\
  这是一个应用该声明的示例（bk05ch04/example04.html）：\n\nHTML（缩写）：\n\n```html\n<header>\n  <h1>语言的生动边缘</h1>\n\
  \  <p class=\"subtitle\">在这里，我们无畏的作家们尽情谈论各种形式的文字游戏</p>\n</header>\n<main>\n  <p>\n\
  \    我们对英语单词的幽默效果深感兴趣，这不仅是在广告口号中，而且是在最高水平的努力中。<br>——比尔·布莱森，《母语》，1990 年。\n  </p>\n\
  \  <p>等等等。</p>\n</main>\n```\n\nCSS:\n\n```css\nmain {\n  display: grid;\n  grid-template-columns:\
  \ repeat(auto-fit, minmax(15rem, 1fr));\n  gap: 2rem;\n}\nmain > p:nth-child(even)\
  \ {\n  background: hsl(208deg 50% 80%);\n}\n```\n\n在较大的屏幕上，`main` 元素是一个四列网格，如图图\
  \ 4-5 所示。\n\n稍微减小视口宽度，布局会自动切换到三列网格，如图图 4-6 所示。\n\n![桌面浏览器视口中网格布局的截图](img/9781394164684-fg050405.png)\n\
