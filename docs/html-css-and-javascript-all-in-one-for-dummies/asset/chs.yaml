  **作者致谢**\n每当我完成一本书时，出版社都会给我寄装满所谓“作者”副本的重盒子。打开那个盒子，拿出一本书，感受那种一直到为止都是数字世界的重量感，看到自己的名字印在封面上——老实话，那种感觉极了。这很酷，但你知道什么更酷吗？我在职业生涯中做过上百次这种事，看到自己的名字出现在封面上并不新鲜了。但封面上只有我的名字，并不意味着这本书是我一个人的产物。远非如此。确实，我编写了书的文字并截了图，但这仅是构成“书”的一部分。其余部分得益于\
