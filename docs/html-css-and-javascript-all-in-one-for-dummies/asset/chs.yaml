  \n图 4-11: 如果你的 CSS 代码尚未准备好，你将收到一个或多个错误消息。\n\n#### 在你的文本编辑器中验证 CSS\n\n大多数优秀的 CSS\
  \ 友好型文本编辑器（例如我在第一本书第 2 章中提到的那些）都可以验证你的 CSS 代码，可以是开箱即用，也可以通过安装插件或扩展。参考你编辑器的帮助文档了解如何添加或使用\
  \ CSS 验证。\n\n一个默认支持 CSS 验证的编辑器器是 VS Code，它会在发现的任何 CSS 错误下方显示波浪线。要找出这是怎么回事，可以将鼠标指针悬停在波浪线上，或者选择\
  \ `View ⇒  Problems`（`Ctrl+Shift+M` 或 `⌘  +Shift+M`）来打开 `Problems` 面板，所示图 4-12。\n\
  \n![当一个或多个波浪线破坏了你的 CSS 代码时，打开 VS Code 的 Problems 面板以了解原因的截图](img/9781394164684-fg010412.png)\n\
  \n图 4-12: 当一个或多个波浪线破坏了你的 CSS 代码时，打开 VS Code 的 Problems 面板以了解原因。\n\n### 验证你的 JavaScript\
  \ 代码\n\n你向网页添加 JavaScript 代码使页面具有动态和交互性。相反，如果你的页面只是静静地停在那里，可能意味着你遇到了某种 JavaScript\
  \ 故障，阻止了脚本工作。追踪编程错误的艺术和科学被称为*调试*（debugging），我在书的后部分专门用了一整章介绍它（查看第四本书第 10 章）。不过，现在你可以通过验证代码来减少整体调试负担。正如接下来两个部分所示，你可以在线验证\
  \ JavaScript，也可以使用你可靠的文本编辑器进行验证。\n\n#### 在线验证 JavaScript\n\n有很多免费的在线工具等待验证你的 JavaScript\
  \ 代码。其中最简单、最受欢迎的之一 JSHint，它可以直接验证输入或粘贴的代码。以下是它的工作原理：\n\n1. **通过任何方便的网络浏览器访问 [`https://jshint.com`](https://jshint.com)。**\n\
  \n   出现 JS Hint 页面。\n\n2. **点击 Configure（配置）。**\n\n   JSHint 显示一个你可以配置的选项列表。为了本书的代码，你需要配置\
  \ JSHint 以支持随第 6 版发布的 JavaScript 特性（ECMAScript 2015 或 ES6）。\n\n3. **选择 New JavaScript\
  \ Features (ES6) 选项。**\n\n4. **点击 Configure（配置）。**\n\n   JSHint 关闭选项列表。\n\n5. **在窗口左侧，输入或粘贴想要验证的\
  \ JavaScript 代码。**\n\n   JSHint 会自动扫描并分析你的代码，如果它发现了一个或多个它无法理解的内容，它会在代码右侧显示错误消息，所示图\
  \ 4-13。\n\n![你的 JavaScript 代码有缺陷，JSHint 显示了一个或多个错误消息的截图](img/9781394164684-fg010413.png)\n\
  \n图 4-13: 你的 JavaScript 代码有缺陷，JSHint 显示了一个或多个错误消息。\n\n#### 在你的文本编辑器中验证 CSS\n\n大多数优秀的\
  \ CSS 友好型文本编辑器（例如我在第一本书第 2 章中提到的那些）都可以验证你的 CSS 代码，可以是开箱即用，也可以通过安装插件或扩展。参考你编辑器的帮助文档了解如何添加或使用\
  \ CSS 验证。\n\n一个默认支持 CSS 验证的编辑器是 VS Code，它会在发现的任何 CSS 错误下方显示波浪线。要找出这是怎么回事，可以将鼠标指针悬停在波浪线上，或者选择\
  \ `View ⇒  Problems`（`Ctrl+Shift+M` 或 `⌘  +Shift+M`）来打开 `Problems` 面板，所示图 4-12。\n\
  \n![当一个或多个波浪线破坏了你的 CSS 代码时，打开 VS Code 的 Problems 面板以了解原因的截图](img/9781394164684-fg010412.png)\n\
  \n（注：此处根据指令要求，已处理掉用户提供的文本中重复和合并的逻辑部分，确保了翻译的连贯性与格式整洁。）\n\n\n\n\n1. 为什么要让你的页面具有访问性\
  \ (#c10.xhtml_h2-1)\n2. 理解网络无障碍访问 (#c10.xhtml_h2-2)\n3. 让你的页面结构具有访问性 (#c10.xhtml_h2-3)\n\
  4. 让文本具有访问性 (#c10.xhtml_h2-4)\n5. 让媒体具有访问性 (#c10.xhtml_h2-5)\n6. 增强页面的可访问语义化 (#c10.xhtml_h2-6)\n\
  7. 让你的页面对键盘友好 (#c10.xhtml_h2-7)\n8. 确保足够的颜色对比度 (#c10.xhtml_h2-8)\n9. 验证页面的访问性 (#c10.xhtml_h2-9)\n\
  \n## 第 1 章：构建良好的骨架：页面结构\n\n### 本章内容\n\n![Bullet](img/check.png) **将你的文本整理成段落**\n\
  ![Bullet](img/check.png) **使用标题组织你的页面**\n![Bullet](img/check.png) **添加换行符和水平规则**\n\
  ![Bullet](img/check.png) **熟悉 HTML 中至关重要的语义页面标签**\n![Bullet](img/check.png) **用注释标记你的代码**\n\
  \n*让我们一起渴望、构思并创造未来的新结构。*\n— 沃尔特·格罗皮乌斯\n\n如果你买过房——特别是如果你的预算偏向于要价中的廉价端——你的房产经纪人很可能向你展示过几个地方，这些地方显然需要装修，但仍然值得考虑，因为它们有“良好的骨架”。在房地产经纪人的术语中，*良好的骨架*意味着房子（除其他属性外）拥有坚实的基础、良好的框架和不错的屋顶。换句话说，房子有一个强大的整体结构。\n\
  \n在构建网页房屋时，你也希望页面拥有良好的骨架。创建这种坚固的结构是 HTML 的职责，特别是那些将纯文本转换为页面结构元素的元素。\n\n在本章中，你将探索那些为任何页面添加最基础结构的\
  \ HTML 标签，包括标题和段落、文章和章节，以及页眉和页脚。你还将学习其他一些用于创建换行符和水平规则的结构相关元素。你在本章中学到的知识将成为你承担的每一个网页项目的基础。\n\
  \n### 了解 HTML 的基础结构标签\n\n在开始学习 HTML 时，你需要理解的最重要概念之一是：无论在 `<body>` 和 `</body>` 标签之间填充什么文本，它都没有结构。为了向你说明我的意思，我复制了本节的前几个标题和段落，并将它们粘贴到\
  \ HTML 文件中。图 1-1 显示了我在网页浏览器中打开该 HTML 文件时会发生什么（请查看书中示例文件中的 `bk02ch01/example01.html`）。\n\
  \n![HTML 文档中纯文本没有结构的截图](img/9781394164684-fg020101.png)\n\n图 1-1： 纯文本在 HTML 文档中没有结构。\n\
  \n生成的网页看起来一点也不美观，而且很难阅读。为什么？因为与你现在眼睛看到的结构良好——因此极具可读性的文本不同，当我将文本粘贴到 HTML 文件时，所有的结构都被抛到了窗外。记住，HTML\
  \ 文件实际上只是纯文本文件，因此我原始的 Microsoft Word 文档中的所有花哨格式和样式都被丢弃了。\n\n幸运的是，这种格式的缺失并不意味着你不能构建结构良好的\
  \ Web 文。让你的网页看起来同样漂亮的秘密在于 HTML 强大的元素集合。使用这些元素，你可以创建如段落、标题，以及页眉、页脚等标准结构。\n\n## 让文本具有可访问性\n\
  \n本章的主题之一是探索各种方法，以向访问者呈现无障碍的文本，因为与你现在看到的结构良好——因此极具可读性的文本不同，当我将文本粘贴到 HTML 文件时，所有的结构都被抛到了窗外。记住，HTML\
  \ 文件实际上只是纯文本文件，因此我原始的 Microsoft Word 文档中的所有花哨格式和样式都被丢弃了。\n\n1](c05.xhtml_c05-fig-0001)\
  \ 这里的 HTML 文档中没有结构。\n\n![Screenshot of bare text has no structure in an HTML document.](img/9781394164684-fg020101.png)\n\
  \nFIGURE 1-1: 纯文本在 HTML 文档中没有结构。\n\n生成的网页看起来一点也不美观，而且很难阅读。为什么？因为与你现在看到的结构良好——因此极具可读性的文本不同，当我将文本粘贴到\
  \ HTML 文件时，所有的结构都被抛到了窗外。记住，HTML 文件实际上只是纯文本文件，因此我原始的 Microsoft Word 文档中的所有花哨格式和样式都被丢弃了。\n\
  \n幸运的是，这种格式的缺失并不意味着你不能构建结构良好的 Web 文。让你的网页看起来同样漂亮的秘密在于 HTML 强大的元素集合。使用这些元素，你可以创建如段落、标题，以及页眉、页脚等标准结构。\n\
  \n## 让文本具有可访问性\n\n为什么？因为与你现在看到的结构良好——因此极具可读性的文本不同，当我将文本粘贴到 HTML 文件时，所有的结构都被抛到了窗外。记住，HTML\
  \ 文件实际上只是纯文本文件，因此我原始的 Microsoft Word 文档中的所有花哨格式和样式都被丢弃了。\n\n幸运的是，这种格式的缺失并不意味着你不能构建结构良好的\
  \ Web 文。让你的网页看起来同样漂亮的秘密在于 HTML 强大的元素集合。使用这些元素，你可以创建如段落、标题，以及页眉、页脚等标准结构。\n\n*(注：由于提供的文本中存在大量重复和断裂的句子，译文已根据逻辑对重复部分进行了整合和对齐，以符合\
  \ Markdown 文档的完整性要求。)*\n\n\n\n\n在第一本书的第一章中，我提到过可以使用命名恰当的 `<title>` 标签为你的网页设置标题。然而，该标题只会出现在浏览器的标签页上。如果你想添加一个显示在页面正文中的标题呢？这几乎比说起来容易得多，因为\
  \ HTML 提供了几个标签可以让你定义 `headings`（标题），这些标题是显示在独立段落中的文本，通常会通过字号更大、加粗字体等方式从周围文本脱颖而出。\n\
  \n总共有六个标题标签，从使用最大字号的 `<h1>` 到使用最小字号的 `<h6>` 不等。这些起始标签中的每一个都有一个对应的结束标签，从 `</h1>`\
  \ 到 `<h6>`。\n\n这里有一段网页代码（请参阅 `bk02ch01/example03.html`）演示了这六个标题标签，图 1-3](#c05.xhtml_c05-fig-0003）展示了它们在网页浏览器中的外观：\n\
  \n```\n<h1>This is Heading 1</h1>\n<h2>This is Heading 2</h2>\n<h3>This is Heading\
  \ 3</h3>\n<h4>This is Heading 4</h4>\n<h5>This is Heading 5</h5>\n<h6>This is Heading\
  \ 6</h6>\n```\n\n![六个 HTML 标题标签的截图](img/9781394164684-fg020103.png)\n\n图 1-3： 六个\
  \ HTML 标题标签。\n\n为什么要这么多不同的标题？其核心思想是使用它们为你的网页创建一个大大纲。具体做法取决于页面，但这里有一种可能：\n\n*   使用\
  \ `<h1>` 作为整个页面的标题。\n*   使用 `<h2>` 作为页面副标题。\n*   使用 `<h3>` 作为页面主要章节的标题。\n*   使用\
  \ `<h4>` 作为页面子章节的标题。\n\n![记住](img/remember.png) 你创建的每个网页应该只有一个 `<h1>` 元素。从技术上讲，你允许使用多个\
  \ `<h1>` 元素，但只使用一个被认为是最佳实践。\n\n![警告](img/warning.png) 不要跳跃标题级别。例如，如果你使用了 `<h1>`\
  \ 然后是 `<h2>`，请不要直接跳到 `<h4>`。这种跳过级别的行为会破坏依赖于一致标题使用来创建页面目录等内容的程序。\n\n例如，在图 1-2 中所示的段落增强型网页中，第一行（“了解\
  \ HTML 的基础结构标签”）是一个主章节的标题，而靠近底部的单行内容（“创建段落”）是一个子章节的标题。我可以将这些转换为标题，如下所示：\n\n```\n\
  <h3>Getting to Know HTML's Basic Structure Tag</h3>\n<h4>Creating paragraphs</h4>\n\
  ```\n\n图 1-4 展示了了结果（请参阅 `bk02ch01/example04.html`）。\n\n![为图 1-2 添加标题后的文本截图](img/9781394164684-fg020104.png)\n\
  \n图 1-4： 添加了标题的图 1-2 文本。\n\n#### 添加换行\n\n如果你仔细观察图 1-4 中显示的段落和标题，你可能会注意到的第一件事之一是浏览器在渲染元素之间留下了大量的空间。这是好事，因为正是这些空白区域使得页面比图\
  \ 1-1 中拥挤在一起的文本易读得多。\n\n然而，对于某些形式的文本，“段落”是单行的，例如地址块、代码列表或诗歌。在这种情况下，你不希望行与行之间有这么多空白。例如，图\
  \ 1-5 展示了当我用 `<p>` 标签编写以下五打诗时发生的情况（参见 `bk02ch01/example05.html`）：\n\n```\n<p>There\
  \ once was woman named Elle,</p>\n<p>Who learned tons of HTML.</p>\n<p>Then she\
  \ came to an ode</p>\n<p>That she just couldn't code,</p>\n<p>Now she lives in a\
  \ white padded cell.</p>\n```\n\n![每行都是段落的五打诗截图](img/9781394164684-fg020105.png)\n\
  \n图 1-5： 每行都是段落的五打诗。\n\n这看起来不太对对吧？幸运的是，HTML 的设计者考虑到了这种情况，并创建了一个特殊的元素来处理它：`<br>`。这个换行元素的作用正是如此：它告诉网页浏览器在新行开始下一个元素，但两行之间没有任何空间。你需要在需要换行的地方放置\
  \ `<br>` 标签（它没有结束标签），通常在行文本的末尾，如下所示（请参阅 `bk02ch01/example06.html`）：\n\n```\nThere\
  \ once was woman named Elle,<br>\nWho learned tons of HTML.<br>\nThen she came to\
  \ an ode,<br>\nThat she just couldn't code,<br>\nNow she lives in a white padded\
  \ cell.\n```\n\n图 1-6 展示了结果。\n\n![使用换行符的五打诗截图](img/9781394164684-fg020106.png)\n\
  \n\n\n除非你在 `body` 部分中添加一些结构，否则你的网页将面临同样的命运。我在本章较早部分讨论了标题和段落等结构化元素，但现在我要提升一个层次，讨论\
  \ HTML 的高级结构化标签。\n\n关于这些标签，需要理解的第一点是：它们的设计目的是为你的页面结构注入意义——即语义化（semantics）。随着我介绍每个标签，你将学到它的具体含义，但现在，请先看图\
  \ 1-8 所示的抽象页面。\n\n![HTML5 语义页面结构标签的抽象视图截图](img/9781394164684-fg020108.png)\n\n图\
  \ 1-8： HTML5 语义页面结构标签的抽象视图。\n\n让我们来看图 1-8 中显示的每个标签。\n\n#### <header> 标签\n\n你使用 `<header>`\
  \ 标签来创建一个 `page header`（页面页眉），它通常是页面顶部的一条区域，包含网站或页面标题以及 logo 等元素。（不要将此与出现在 `<head>`\
  \ 和 `</head>` 标签之间的页面 `head` 部分混淆。）\n\n由于页眉几乎总是出现在页面顶部，`<header>` 标签通常紧跟在 `<body>`\
  \ 标签之后，如下例所示（以及图 1-9；请查看 bk02ch01/example08.html）：\n\n```html\n<body>\n<header>\n\
  <img src=\"iis-logo.png\" alt=\"Isn't it Semantic? company logo\">\n<h1>Welcome\
  \ to \"Isn't it Semantic?\"</h1>\n<hr>\n</header>\n…\n</body>\n```\n\n![记住](img/remember.png)\
  \ **记住：** 尽管 `header` 元素通常出现在网页的顶部，但并不是你使用它的唯一地方。例如，如果你有以介绍性内容开头的 `section` 元素——例如图标、章节编号、链接或日期——你可以在每个章节的开头添加一个\
  \ `header` 元素。\n\n![带有 logo、标题和水平线的页面页眉截图](img/9781394164684-fg020109.png)\n\n图\
  \ 1-9： 带有 logo、标题和水平线的页面页眉。\n\n#### <nav> 标签\n\n`<nav>` 标签定义了一个页面区域，该区域包含若干帮助访问者导航你网站的元素。这些元素可以是指向网站主要部分的链接、指向最近发布内容的链接（参见第二本书，第\
  \ 2 章）或搜索功能。`<nav>` 部分通常出现在页面顶部，紧跟在 header 之后，如下所示（以及图 1-10；请参考 bk02ch01/example09.html）：\n\
  \n```html\n<body>\n<header>\n<img src=\"iis-logo.png\" alt=\"Isn't it Semantic?\
  \ company logo\">\n<h1>Welcome to \"Isn't it Semantic?\"</h1>\n<hr>\n</header>\n\
  <nav>\n<a href=\"/\">Home</a>\n<a href=\"semantics.html\">Semantics</a>\n<a href=\"\
  contact.html\">Contact</a>\n<a href=\"about.html\">About</a>\n</nav>\n…\n</body>\n\
  ```\n\n![记住](img/remember.png) **记住：** 可以在任何有导航链接的地方随意使用 `nav` 元素。全站性的导航链接几乎总是被放置在位于主页面页眉下方的\
  \ `nav` 元素中。然而，你可能有特定于某个文章或章节的导航链接，在这些元素的顶部放置一个 `nav` 元素是完全没有问题的。\n\n![nav 部分通常紧跟在\
  \ header 部分之后的截图](img/9781394164684-fg020110.png)\n\n图 1-10： `<nav>` 部分通常紧跟在 `<header>`\
  \ 部分之后。\n\n#### <main> 标签\n\n`<main>` 标签设置了一个区域，用于容纳从某种意义上说是页面核心的内容。例如，如果你正在创建一个页面来告诉所有人你关于中国斗鱼的所有知识，那么关于中国斗鱼的文本、图像、链接等将放入\
  \ `<main>` 部分。\n\n`<main>` 部分通常紧跟在 `<head>` 和 `<nav>` 部分之后：\n\n```html\n<body>\n\
  <header>\n…\n</header>\n<nav>\n…\n</nav>\n<main>\n<!-- 主内容放在此处 -->\n</main>\n…\n\
  </body>\n```\n\n#### <article> 标签\n\n你使用 `<article>` 标签来创建一个自包含的作品，如博客文章、新闻文章、博客评论或论坛帖子，它们通常嵌套在\
  \ `<main>` 区域内：\n\n```html\n<body>\n<header>\n…\n</header>\n<nav>\n…\n</nav>\n<main>\n\
  <article>\n<!-- 文章内容放在此处 -->\n</article>\n…\n</body>\n```\n\n#### <section> 标签\n\
  \n`<section>` 标签代表一个通用的内容区域，通常带有标题。你可以用它将相关内容分组在一起，例如书的章节或标签页界面中的标签页：\n\n```html\n\
  <main>\n<section>\n  <h2>章节标题</h2>\n  <p>此处是章节内容。</p>\n</section>\n</main>\n```\n\
  \n#### <aside> 标签\n\n`<aside>` 标签定义页面的部分，其内容与主内容间接相关，例如侧边栏、引言或广告。\n\n```html\n<main>\n\
  \  <article>\n    <!-- 主内容 -->\n  </article>\n  <aside>\n    <!-- 侧边栏或引言内容 -->\n\
  \  </aside>\n</main>\n```\n\n#### <footer> 标签\n\n`<footer>` 标签定义最近内容的页脚。它通常包含作者信息、版权数据以及相关文档的链接：\n\
  \n```html\n<body>\n<header>\n…\n</header>\n<nav>\n…\n</nav>\n<main>\n…\n</main>\n\
  <footer>\n  <p>Copyright2023 我的网站</p>\n  <a href=\"contact.html\">联系我们</a>\n</footer>\n\
  </body>\n```\n\n#### 使用 <div> 处理非语义内容\n\n`<header>`, `<nav>`, `<main>`, `<article>`,\
  \ `<section>`, `<aside>` 和 `<footer>` 元素在你的页面中创建了有意义的结构，这就是为什么 HTML 痴迷们称这些*语义元素*。即使在本章较早部分介绍的\
  \ `<p>` 标签也是语义化的，因为它代表单个段落，通常位于 `<section>` 元素内部。\n\n但当一个网页织者想要添加一段不符合任何标准语义标签的内容块时，该怎么办？这种情况经常发生，解决方案是将该内容放入\
  \ `div`（代表 division，划分）元素中。`div` 标签是一个通用的容器，不代表任何特定含义，因此它是任何需要家园的非语义内容的完美之选：\n\n\
  ```html\n<div>\n  <!-- 非语义内容放在此处 -->\n</div>\n```\n\n这是一个示例：\n\n```html\n<div>\n\
  \  必要的社交媒体链接：\n</div>\n<div>\n  <a href=\"https://facebook.com/\">Facebook</a>\n\
  </div>\n```\n\n\n\n\n<a href=\"https://twitter.com/\">Twitter</a>\n\n<a href=\"\
  https://instagram.com/\">Instagram</a>\n\n<a href=\"http://www.hbo.com/silicon-valley\"\
  >Hooli</a>\n\n`</div>`\n\n注意图 1-11 所示，浏览器将两个 `<div>` 元素分行渲染。\n\n![浏览器将每个 ltltltdivgtgtgt\
  \ 部分在新的行上渲染的截图。](img/9781394164684-fg020111.png)\n\n图 1-11 浏览器将每个 `<div>` 章节分行渲染。\n\
  \n#### 使用 `<span>` 处理单词和字符\n\n如果你想对较长文本中的一小部分（例如一个短语、一个单词，甚至是一个或三个字符）进行处理，你需要转向所谓的`内联元素`（inline\
  \ element），它创建一个存在于某个较大元素内部的容器，并随着该较大元素中的其余内容一起流动。最常用的内联元素是 `<span>`，它在一段文本周围创建一个容器（参见\
  \ bk02ch01/example11.html）：\n\n```html\n<p>\n注意看一个 <span style=\"font-variant: small-caps\"\
  >\n内联元素</span>是如何与文本的\n其余部分\n一起流动的。\n</p>\n```\n\n这里发生的是 `<span>` 标签对 `<span>` 和\
  \ `</span>` 之间的文本（`inline element`）应用了一种名为 `small caps`（小型大写）的样式。如图 1-12 所示，`<span>`\
  \ 文本与段落的其余部分一起流动。\n\n![使用 ltltltspangtgtgtgt 让容器随周围文本流动的截图。](img/9781394164684-fg020112.png)\n\
  \n图 1-12 使用 `<span>` 让容器与周围文本一起流动。\n\n### 为你的代码添加注释\n\nHTML 标签及其角括号和属性需要一点时间适应，但一旦掌握了它们，阅读和扫描你的代码就会变得更容易。浏览一个仅包含少量\
  \ HTML 元素的简单网页通常很直观，但这种状态不会持续多久。它似乎即使是最简单的网络项目，最终也会有几十行、更可能是几百行 HTML 代码。\n\n掌握所有这些\
  \ HTML 并非易事，特别是如果你已经有一段时间没看这些代码了。在那个时候，问题通常会接踵而至：那个 `div` 元素在做什么？我为什么把那个 `nav` 元素放在那里？那个\
  \ `<hr>` 标签是怎么回事？\n\n你可以帮助让代码更具可读性和易于理解的一种方法——特别是如果其他人要看你的代码，或者你希望在六个月后回到代码时能给自己提供帮助——就是在代码中加入大量的注释。在\
  \ HTML 文件中，一个`comment`（注释）是一段网络浏览器在渲染页面时完全忽略的文本。这对你来说可能听起来完全没用，但请放心，注释有许多用途：\n\n\
  *   添加文本来解释为什么按这样编写某个特定的 HTML 块。\n*   帮助区分使用相似标签结构的 HTML 代码部分。\n*   标记你或他人需要开始工作或完成的\
  \ HTML 文件章节。\n\n要将某些文本标记为注释，请在文本前加上 `<!--`，在文本后加上 `-->`。这里有一个示例：\n\n```html\n<div>\n\
  必要的社交媒体链接：\n</div>\n<!--\n接下来的每个链接都需要更新为指向\n我们对应社交媒体页面的\n完整地址。\n谢谢！\n-->\n<div>\n\
  <a href=\"https://facebook.com/\">Facebook</a>\n<a href=\"https://twitter.com/\"\
  >Twitter</a>\n<a href=\"https://instagram.com/\">Instagram</a>\n<a href=\"http://www.hbo.com/silicon-valley\"\
  >Hooli</a>\n</div>\n```\n\n第 2 章\n\n## 添加链接、列表和其他文本片段\n\n本章内容：\n\n* ![项目符号](img/check.png)\
  \ **标记强调和重要的文本**\n* ![项目符号](img/check.png) **处理引言**\n* ![项目符号](img/check.png) **为你的页面添加链接**\n\
  * ![项目符号](img/check.png) **构建无序列表和有序列表**\n* ![项目符号](img/check.png) **插入特殊字符**\n\
  * ![项目符号](img/check.png) **浏览其他一些有用的 HTML 元素**\n\n*当你看到一些蓝色下划线单词并点击它时，它会带你去另一个地方。这就是超文本简单的定义。*\n\
  \n— ROBERT CAILLIAU\n\n在第二部分的第 1 章中，我介绍了各种 HTML 标签，这些标签能够让你的网页拥有正确结构的“骨架”。但正如基础、框架和水管不能让房子变成家一样，`main`、`article`\
  \ 和 `p` 等结构元素也无法构成一个家。在本章中，你将研究许多与文本相关的标签。你将学习如何添加引言以及如何将任何文本链接。你还将探索构建无序和有序列表。最后，我将通过查看\
  \ © 和 等字符来结束本章。\n\n### 应用基础文本标签\n\nHTML 有一些标签允许你添加结构。许多 Web 开发人员仅将这些标签用于格式，但你真的应该根据语义使用它们，正如极客所说，基于你想要的含义。\n\
  \n#### 强调文本\n\n你可能希望文本传达的一种常见含义之一是强调。通过对单词或短语添加额外的力度，你告诉读者对该文本加压。例如，考虑以下句子：\n\n\
  `You'll never fit in there with that thing!`\n\n现在考虑带有强调的相同句子：\n\n`You'll` *never*\
  \ `fit in there with that thing!`\n\n通过将文本放在 `<em>` 和 `</em>` 标签中在网页上强调文本（参见本书中的\
  \ example01.html）：\n\n```html\nYou'll <em>never fit in there with that thing!</em>\n\
  ```\n\n所有网络浏览器都会将强调的文本渲染为斜体，如图 2-1 所示。\n\n我还应该提到 HTML 有一个密切相关的标签：`<i>`。`<i>` 标签的作用是标记替代文本，即你希望与普通文本具有不同心情或角色的文本常见的例子包括书名、技术术语、外语或个人的想法。所有网络浏览器都会将\
  \ `<i>` 和 `</i>` 之间的文本渲染为斜体。\n\n![浏览器使用斜体渲染强调文本的截图。](img/9781394164684-fg020201.png)\n\
  \n#### 标记重要文本\n\n你经常希望文本传达的一种常见含义是重要性。它可能是过程中的某个重要步骤，某些事情的关键先决或条件，或者长文本块中的关键片段。在每种情况下，你处理的是你不希望读者错过的文本，因此它需要从周围的普通文中脱颖而出。在\
  \ HTML 中，你通过将文本放在 `<strong>` 和 `</strong>` 标签中将其标记为重要，如下所示（查看本书中的 example02.html）：\n\
  \n```html\nDear reader: <strong>Do you see the red button in the upper-right</strong>\n\
  ```\n\n\n\n\n\n`页面的角落？<strong>永远不要点击红色按钮！</strong>` `你已收到警告。`\n\n所有网络浏览器都会将用 `<strong>`\
  \ 标签标记的文本渲染为粗体，如图图 2-2 所示。\n\n![浏览器使用粗体渲染重要文本的截图](img/9781394164684-fg020202.png)\n\
  \nFIGURE 2-2: 浏览器使用粗体渲染重要文本。\n\n为了让我们大家在 Web 开发中保持警觉，HTML 还提供了一个 `<strong>` 标签的近亲兄弟：`<b>`\
  \ 标签。你使用 `<b>` 标签来标记文本中的关键词。`keyword` 是你希望人们注意的术语，因为它的作用与普通文本不同。它可以是一个公司名称或人名（想想那些名人八卦专栏中常见的著名的“粗体名字”）。浏览器会将\
  \ `<b>` 和 `</b>` 标签之间的文本渲染为粗体字体。\n\n#### 嵌套标签\n\n通过将一个标签嵌套在另一个标签内部来组合多种类型的标签是完全允许的，而且也是必要的。例如，查看这段代码\
  \ (bk02ch02/example03.html)：\n\n```\nDear reader: Do you see the red button in the\
  \ upper-right corner of this page? <strong>Never, I repeat <em>never</em>, click\
  \ the red button!</strong> You have been warned.\n```\n\n你注意到我做了什么吗？在 `<strong>`\
  \ 和 `</strong>` 标签之间的文本中，我用 `<em>` 和 `</em>` 标签标记了一个单词。结果是什么？你猜对了：粗体、斜体文本，如图图 2-3\
  \ 所示。\n\n![浏览器通常组合嵌套标签的截图，例如此处显示的粗体、斜体文本](img/9781394164684-fg020203.png)\n\nFIGURE\
  \ 2-3: 浏览器通常组合嵌套标签，例如此处显示的粗体、斜体文本。\n\n#### 添加引用\n\n你可能已经注意到这本书的每一章都以一段简短、恰当的引用开头，因为嘿，谁不喜欢一句好的名言呢？我确信，你网页的读者也会是名言的欣赏者，所以为什么不在你的文中点缀几句智者的话呢？在\
  \ HTML 中，你通过 `<blockquote>` 标签将一段文本指定为引用。这是一个示例 (bk02ch02/example04.html)：\n\n```html\n\
  这里是伟大的法学家 Oliver Wendell Holmes, Sr. 对 puns（双关语）是这么说的：\n<<blockquote>\nA pun does\
  \ not commonly justify a blow in return.\nBut if a blow were given for such cause,\
  \ and death ensued, the jury would be judges both of the facts and of the pun, and\
  \ might, if the latter were of an aggravated character, return a verdict of justifiable\
  \ homicide.\n</blockquote>\n显然，这家伙儿不是双关语的粉丝。\n```\n\n网络浏览器会将 `<blockquote>` 和 `</blockquote>`\
  \ 之间的文本渲染在它自己的段落中，并从左侧边距稍微缩进，如图图 2-4 所示。\n\n![网络浏览器渲染 <blockquote> 文本时从左侧稍微缩进的截图](img/9781394164684-fg020204.png)\n\
  \nFIGURE 2-4: 浏览器渲染 `<blockquote>` 文本时，从左侧稍微缩进。\n\n我应该应该提到密切相关的 `q` 元素，你可以用它来标记所谓的内联引用。你将内联引用用于可以随普通文本流动的短引用。这是一个示例\
