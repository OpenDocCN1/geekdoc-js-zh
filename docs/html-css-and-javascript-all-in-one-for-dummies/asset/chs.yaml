  \ 除外），单步进入某些代码与逐语句单步执行代码完全相同。区别在于语句异步执行时（即它在延迟后执行操作，而不是立即执行）。\n\n为了理解这种区别，请考虑以下代码（我在左侧添加了行号；它们不是代码的一部分；请查看\
