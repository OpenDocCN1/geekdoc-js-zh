  \n![浏览器渲染由引号包围的 <q> 文本的截图](img/9781394164684-fg020205.png)\n\nFIGURE 2-5: 浏览器渲染由引号包围的\
  \ `<q>` 文本。\n\n![提示](img/tip.png) `q` 元素支持 `cite` 属性，这是一个指定引用来源的网页地址，可以被屏幕阅读器和其他辅助技术读取。这是一个示例\
  \ (bk02ch02/example05a.html)：\n\n```html\nWHATWG 认为使用 q 元素是可选的，且 <q cite=\"https://html.spec.whatwg.org/#the-q-element\"\
  >在没有 q 元素的情况下使用显示引用标点同样是正确的。</q>\n```\n\n#### 锚点起航：内部链接\n\n当冲浪点击一个标准链接时，页面加载并浏览器显示页面的顶部部分。然而，可以设置一种特殊的链接，强制浏览器最初显示页面的其他部分，例如页面中间的一个章节。对于这些特殊链接，我使用术语*内部链接*，因为它们将读者直接带到页面的内部部分。\n\
  \n\n\n\n\n## 你什么时候会使用内部链接？\n\n你的大多数 HTML 页面可能都短小精悍，路过的网页浏览者在导航时不会遇到任何困难。但如果你像我一样，深受终端冗长症的困扰，并伴有极度的啰嗦，那么你最终得到的网页至少可其说是非常冗长的。与其强迫读者翻完你那些像巨著一样的作品，你还可以设置指向文档各个部分的链接。例如，你可以将这些链接汇集在页面顶部，形成一种“超级目录”。\n\
  \n内部链接实际上链接到你所在页面中某一个经过特殊标记的区域——称为 `anchor`（锚点），你将其插入同一页面的某个地方。要理解锚点是如何工作的，可以想象你在读书时如何标记某个位置。你可以折页角、贴上便签，或者在页之间放置某些东西，比如书签或你猫的尾巴。锚点的功能相同：它“标记”了网页中的某个特定位置，然后你可以使用普通的\
  \ `<a>` 标签链接到该位置。以下是锚点标签的标准格式：\n\n```html\n<element id=\"name\">\n```\n\n锚点标签看起来和普通标签非常相似，不同在于它包含了\
  \ `id` 属性，该属性被设置为你想给锚点的名称。这是一个示例：\n\n```html\n<section id=\"section1\">\n```\n\n\
  ![Remember](img/remember.png) 你可以使用任何你喜欢的名称，但它必须以字母开头，并包含字母、数字、下划线（`_`）和连字符（`-`）的组合。此外，`id`\
  \ 值区分大小写，因此浏览器处理 `id` 值 `section1` 与处理 `id` 值 `Section1` 的方式不同。要设置锚点链接，创建一个普通的 `<a>`\
  \ 标签，但 `href` 值变为锚点的名称，并在前面加一个哈希符号（`#`）：\n\n```html\n<a href=\"#name\">\n```\n\n\
  这是一个链接到我之前显示的锚点的示例：\n\n```html\n<a href=\"#section1\">\n```\n\n虽然你大部分时候会使用锚点链接到同一个网页的不同部分，但并没有法律禁止使用它们链接到其他页面的特定部分。你可以在另一个页面上添加适当的锚点，然后通过在页面文件名末尾添加锚点名称（照旧例，前面加\
  \ `#`）来链接到它。这是一个示例：\n\n```html\n<a href=\"chapter57.html#section1\">\n```\n\n###\
  \ 构建无序列表和有序列表\n\n出于某种原因，人们喜欢列表：最美（及最丑）穿搭列表、十大列表、我一直以来最喜欢的 *X* 列表，其中 *X* 是你想要的任何内容：电影、歌曲、书籍、《露西和一家》剧集——随你怎么说。出于各种原因，人们喜欢列表。好吧，让我们来列一些列表吧。很容易，对吧？嗯，任何一个网页高手都可以通过一个接一个输入每个项目，在页面上丢出一个“有史以来最棒棒棒糖口味”列表。也许我们的列表制作者还会聪明一点，在每个项目之间插入\
  \ `<br>` 标签，让它们在不同的行中显示。噢。\n\n是的，你可以用那种方式创建列表，我想它运行得还不错，但有一种更好的方法。HTML 有几个专门为你设计的标签，可以让你在构建列表的任务中拥有更多的控制权。例如，你可以创建一个无序列表，每个项目前面实际上真的有那些小圆点。太棒了！想要一个十大列表吗？HTML\
  \ 也会通过提供有序列表的特殊标签来支持你。\n\n#### 使用无序列表表达你的观点\n\n一个没有任何修饰、用 `<br>` 分隔的列表并不实用，也不易于阅读，因为它没有任何有助于区分一个项目和下一个项目的视觉元素。一个正式的、HTML\
  \ 认可的无序列表通过在每个项目开头加一个圆点——一个可爱的小黑点来解决这个问题。无序列表使用两种标签：\n\n*   整个列表被 `<ul>` 和 `</ul>`\
  \ 标签包围。为什么是“ul”？嗯，世界上其他地方称为 bulleted list，HTML 专家称之为 unordered list（无序列表）。\n*  \
  \ 列表中的每个项目都由 `<li>`（列表项）标签开头，并用 `</li>` 结束标签关闭。（从技术上讲，只要下一个是另一个 `<li>` 标签或 `</ul>`\
  \ 结束标签，`</li>` 结束标签是可选的。）\n\n通用的设置如下：\n\n```html\n<ul>\n  <li>无序列表文本放在这里</li>\n\
  \  <li>这里有</li>\n  <li>这里这里有</li>\n  <li>你懂意思了……</li>\n</ul>\n```\n\n注意我将列表项缩进了四个空格，这让人们更容易意识到它们是\
  \ `<ul></ul>` 容器的一部分。这里有一个可以仔细品味的示例（bk02ch02/example07.html）：\n\n```html\n<h3>我一直以来最喜欢的矛盾修辞</h3>\n\
  <ul>\n  <li>美得丑</li>\n  <li>军事情报</li>\n  <li>大虾</li>\n  <li>原始复印</li>\n  <li>随机顺序</li>\n\
  \  <li>自然地行动</li>\n  <li>紧身裤</li>\n  <li>冷冻</li>\n</ul>\n```\n\n#### 有序列表\n\n如果你想要一个有序列表，可以使用\
  \ `<ol>` 和 `</ol>` 标签。设置方法与无序列表非常相似：\n\n```html\n<ol>\n  <li>第一个项目</li>\n  <li>第二个项目</li>\n\
  \  <li>第三个项目</li>\n</ol>\n```\n\n\n\n\n它看起来可能不像，但那个标签为你的网页增添了一些魔力。这种“魔法”在于，你现在可以将\
  \ `©` 和 `™` 等特殊字符直接添加到你的网页文本中，网络浏览器会毫无埋怨地显示它们。诀窍在于你如何将这些字符直接添加到文本中，而这取决于你的操作系统。首先，如果你正在使用\
  \ Windows，你有两个选择：\n\n*   按住 `Alt` 键，然后使用键盘上的数字键盘输入该字符的四位 ASCII 代码。例如，通过按下 `Alt+0151`\
  \ 来输入破折号（—）。\n*   从 Windows 自带的“字符表”（Character Map）应用程序中粘贴字符。\n\n如果你是 Mac 用户，也有两个选择：\n\
  \n*   输入字符的特殊键盘快捷键。例如，通过按下 `Option+Shift+-`（连字符）来输入破折号（—）。\n*   从 macOS 自带的“符号查看器”（Symbols\
  \ Viewer）粘贴字符。\n\n话虽如此，我应该指出，还有另一种向页面添加特殊字符的方法。创建 HTML 的网页巫师们发明了“字符实体”（character\
  \ entities）（这显然只有真正的极客才会喜欢的名称）来表示这些奇特的符号。这些代码有两种类型：`character reference`（字符引用）和\
  \ `entity name`实体名称）。字符引用基本上就是数字，而实体名称是更友好的符号，描述了你尝试显示的字符。例如，你可以使用字符引用 `&#174;`\
  \ 或实体名称 `&reg;` 来显示注册商标符号（™），如下所示：\n\n`Print-On-Non-Demand&#174;`\n\n或者\n\n`Print-On-Non-Demand&reg;`\n\
  \n请注意，所有的字符引用和实体名称都以安培符号（`&`）开头，并以分号（`;`）结束。在自己的页面中使用特殊符号时，不要忘记任何一个字符。\n\n![Remember](img/remember.png)\
  \ 字符引用的一个非常常见的用途是显示 HTML 标签，而不让网络浏览器将其渲染为标签。要做到这一点，请将标签的小于号（`<`）替换为 `&lt;`（或 `&#060;`），并将标签的大于号（`>`）替换为\
  \ `&gt;`（或 `&#062;`）。\n\n### 需要了解的更多 HTML 文本标签\n\n很有可能，在你整个 HTML 职业生涯中，只会使用我在本章中为止介绍过的\
  \ HTML 文本元素：`em`、`i`、`strong`、`b`、`blockquote`、`q`、`a`、`ul`、`ol` 和 `li`。然而，HTML\
  \ 还提供了许多文本相关的标签。诚然，其中许多标签是晦涩的，使用其中大多数标签感觉有点语义过度，但你永远不知道某个特定元素何时恰好是某个 Web 项目所需的。带着这种精神，接下来的几节将带你浏览一系列广泛（但绝非完整）的文本标签集合，这些标签值得被添加到你的\
  \ HTML 工具箱中。\n\n![Remember](img/remember.png) 在接下来的章节中，我提到了网络浏览器应用于每个元素内文本的默认样式（如果有的话）。但是，你始终可以使用\
  \ CSS 覆盖元素的默认样式，所以不要因为你不喜欢浏览器的默认渲染方式就而避开某个特定标签。\n\n#### <abbr>: 缩写文本标签\n\n你使用 `abbr`\
  \ 元素来标记缩写或首字母词。使用此元素有两种方法：\n\n```\n<abbr>abbreviation</abbr> (`expansion`)\n```\n\
  \n```\n<abbr title=\"expansion\">abbreviation</abbr>\n```\n\n在这两种情况下，`abbreviation`\
  \ 是你正在标记的缩写，而 `expansion` 是该缩写的完整扩展。第一种方法将扩展直接放在文本中供用户阅读；第二种方法隐藏扩展，直到读者将鼠标指针悬停在缩写上，此时扩展将出现在工具提示中，如下例所示，以及\
  \ 图 2-9 (bk02ch02/example09.html)：\n\n```\n那些向上流动的夫妻在生完孩子后，其中一方停止工作照顾孩子会发生什么？\n\
  当然，他们的生活变成了一个\n<abbr title=\"single income, two children, oppressive mortgage\"\
  >SITCOM</abbr>。\n```\n\n![当你在包含 title 属性时的截图，将鼠标悬停在缩写上会在工具提示中显示扩展内容。](img/9781394164684-fg020209.png)\n\
  \n图 2-9： 当包含 `title` 属性时，将鼠标悬停在缩写上会在工具提示中显示扩展内容。\n\n#### <address>: 地址文本标签\n\n你的网页——或网页的某些部分，例如\
  \ `article` 元素——可能包含联系信息，其中可能包括电子邮件地址、电话和邮寄地址。你可以通过用 `<address>` 和 `</address>`\
  \ 标签包裹这些联系信息来对其语义化标记，如下（bk02ch02/example10.html）：\n\n```\n<p>\n有问题吗？请在此处“联系我们”：\n\
  </p>\n<address>\n投诉部门<br>\n0 Blackwood<br>\n</address>\n```\n\n如图 2-10 就 `cite`\
  \ 元素的目的而言，“创作作品”一词具有广泛的含义，包括以下列表：书籍、论文、文章、诗、乐谱、歌曲、剧本、电影、电视节目、游戏、雕塑、绘画、戏剧制作、戏剧、歌剧、展览、法律报告、计算机程序。\n\
  \n如[图 2-11](#c06.xhtml_c06-fig-0011）所示，`cite` 标签以斜体显示。\n\n#### <code>: 代码文本标签\n\n\
  如果你的网页包含单词、短语或行代码——例如 HTML 元素名称、CSS 声明（属性值对）或 JavaScript 语句——你可以恰当地将其封装在 `code`\
  \ 元素中。这是一个示例（bk02ch02/example12.html）：\n\n```\n<p>\n远在 1994 年，Netscape（原始浏览器之一）的某人产生了一个并不高明的想法，认为闪烁的文本是好事。因此\n\
  <code><blink></blink>` 标签——史上最受招厌的标签——诞生了。\n</p>\n```\n\n\n\n\n如图 2-12 所示，浏览器用等宽字体渲染\
  \ `code` 文本。\n\n![浏览器用等宽字体显示代码文本的截图。](img/9781394164684-fg020212.png)\n\n图 2-12：\
  \ 浏览器用等宽字体显示 `code` 文本。\n\n![记住](img/remember.png) `<code>` 标签是一个内联元素，这意味着 `code`\
  \ 文本会随周围的文本流动。如果你想在页面上包含多行计算机代码，需要用到 `<pre>` 标签。请参阅本章稍后部分的“<pre>: 预格式化文本标签”。\n\n\
  ![提示](img/tip.png) 如果你的代码中包含变量名，可以使用 `var` 元素（代表“variable”）来对该名称进行语义化标记：\n\n`假设变量\
  \ <var>x</var> 和 <var>y</var> 为正值，中国的茶价是多少？`\n\n网页浏览器用斜体渲染 `var` 文本。\n\n![提示](img/tip.png)\
  \ 另一种稍微不同的场景是你想在网页中包含某种计算机程序的示例输出（例如错误消息）。这种情况下，此选的 HTML 元素是 `samp` 元素（“samp”是“sample\
  \ output”的缩写）：\n\n`输入该 URL 产生了可怕的 <samp>404 Not Found</samp> 错误。`\n\n#### <dfn>:\
  \ 定义文本标签\n\n术语的*定义实例*（defining instance）是指紧跟在术语定义之后的的该术语的用法。你注意到刚才发生了什么吗？我使用的“定义实例”一词正是术语\
  \ *defining instance*（定义实例）的定义实例！这些语言小技巧的意义在于，每当你在网页中使用定义实例时，都可以使用 `dfn` 元素对其进行语义化标记（bk02ch02/example13.html）：\n\
  \n`术语的 <dfn>定义实例</dfn> 是该`\n\n`术语紧跟其定义之后的`\n\n`用法。`\n\n如图 2-13 所示，浏览器用斜体渲染 `dfn`\
  \ 文本。\n\n![浏览器用斜体渲染 dfn 文本的截图。](img/9781394164684-fg020213.png)\n\n图 2-13： 浏览器用斜体渲染\
  \ `dfn` 文本。\n\n#### <dl>: 描述列表标签\n\n在本章前面的部分（参阅“构建无序列表和有序列表”），我提到了可以添加到网页中的两种列表：无序列表和有序列表。然而，HTML\
  \ 认为支持第三种列表类型，称为*描述列表*（description list），其中每个条目都是一个名称-值对。最初，人们使用描述列表制作词汇表或字典，每个名称-值对由一个术语和该术语的定义组成。但正如你将学到的，描述列表比仅仅定义要有用得多。为了标记这些列表中每个条目的名称-值对，你需要不同的标签。名称封装在\
  \ `dt` 元素中，而值封装在 `dd` 元素中，如下所示：\n\n```\n<dt>name</dt>\n<dd>value</dd>\n```\n\n对每个名称-值对重复此操作，并将整个列表用\
  \ `<dl>` 和 `</dl>` 包围即可完成你的描述列表。整个结构看起来如下：\n\n```\n<dl>\n<dt>A name</dt>\n<dd>Its\
  \ value</dd>\n<dt>Another name</dt>\n<dd>Another value</dd>\n<dt>Yet another name</dt>\n\
  <dd>Another value</dd>\n<dt>Etc.</dt>\n<dd>拉丁短语的缩写，意为“以此类推”。</dd>\n</dl>\n```\n\n\
  这里有一个更真实的例子（bk02ch02/example14.html）：\n\n```html\n<h3> 辱骂大赏</h3>\n<dl>\n<dt>disingenlect</dt>\n\
  <dd>以虚伪的奴性或崇拜方式行为。</dd>\n<dt>dudussing</dt>\n<dd>假装努力而进行许多细微的调整，尤其是指男性时。</dd>\n\
  <dt>escalefter</dt>\n<dd>站在电扶梯左侧的人，从而阻挡了想向上或向下走的人。</dd>\n<dt>nerdsplaining</dt>\n\
  <dd>用一种过度理智化、痴迷于细节的方式进行解释，特别是当主题晦涩或高度技术化时。</dd>\n<dt>omnishambles</dt>\n<dd>一种在所有可能的方面都一团糟的状况或人。</dd>\n\
  </dl>\n```\n\n图 2-14 展示了这些内容在浏览器中的外观。\n\n![在描述列表中排列的几个定义的截图。](img/9781394164684-fg00214.png)\n\
  \n图 2-14： 描述列表排列中的几个定义。\n\n#### <kbd>: 键盘输入标签\n\n如果你的网页包含带有快捷键或类似键盘输入的指令或步骤，你可以使用\
  \ `kbd` 元素对这些按键进行语义化标记。这是一个示例：\n\n```\n要取消倒计时并防止爆炸，请 <kbd>Esc</kbd>\n```\n\n对于快捷键组合，你可以用\
  \ `kbd` 元素对每个键进行标记，如下（bk02ch02/example15.html）：\n\n```\n按下 <kbd>Ctrl</kbd>+<kbd>R</kbd>\
  \ 重启\n```\n\n如图 2-15 所示，浏览器用等宽字体渲染按键。\n\n![浏览器用等宽字体渲染 kbd 文本的截图。](img/9781394164684-fg020215.png)\n\
  \n图 2-15： 浏览器用等宽字体渲染 `kbd` 文本。\n\n#### <mark>: 标记标签\n\n如果你想让读者注意页面上的某些文本，HTML 提供了多种方法。例如，如果文本非常重要，你不希望读者错过它，可以使用\
  \ `strong` 元素进行标记。如果你想对某些文本应用强调，可以使用 `em` 元素。另一种你希望读者注意的文本类型是与页面相关的文本，可以使用 `mark`\
  \ 元素。例如，在一个主题是比喻的页面中，你可以使用 `mark` 元素来标记引言。这里有一个例子（bk02ch02/example16.html）：\n\n\
  ```html\n<blockquote>正如约翰逊所说，言语是理性思维的<mark>'装饰'</mark>，词汇是智力的<mark>货币</mark>——Hilary\
  \ Bower</blockquote>\n<blockquote>语言不仅是口语和文字，它还是意识的<mark>货币</mark>。无法用语言表达——Nicholas\
  \ Wade</blockquote>\n```\n\n浏览器用黄色背景显示 `mark` 元素文本。\n\n#### <pre>: 预格式化文本标签\n\n\
  在之前的“<code>: 代码标签”部分中，我提到了使用 `code` 元素标记代码单词或短语。然而，许多代码片段是多行的，因此为了标记这些较长的代码块，你需要用到\
  \ `pre` 元素。为什么用 `pre`？因为它提供了两个非常有用的特性，使其非常适合渲染此类代码：\n\n*   浏览器用等宽字体渲染 `pre` 文本。\n\
  *   浏览器在渲染时包含多个空白字符（如空格），而不是忽略它们（这是大多数其他标签的默认行为）。\n\n结果是？你的代码按照你在 HTML 文件中编写的方式渲染，保留了所有让代码更易读的多空格缩进。例如，这里是来自第\
  \ 1 卷第 1 章的的一些 CSS 代码，用 `pre` 元素标记（bk02ch02/example17.html）：\n\n```html\n<pre>\n\
  <style>\nh1 {\nborder-width: 2px;\nborder-style: solid;\nborder-color: black;\n\
  }\nh2 {\nborder-width: 2px;\nborder-style: dotted;\nborder-color: black;\n}\n</style>\n\
  </pre>\n```\n\n如图 2-16 所示，`pre` 元素忠实地渲染了代码中的所有空格。\n\n\n\n\n\n![pre 元素显示的文本与其编写完全一致，包括多个空格在内。](img/9781394164684-fg020216.png)\n\
  \n图 2-16: `pre` 元素显示的文本与其编写完全一致，包括多个空格在内。\n\n![记住](img/remember.png) 为了为你的计算机代码列表添加一些语义化的美感，请用\
  \ `code` 元素包裹文本，如下所示：\n\n```html\n<pre><code>\n`你的代码写在此处`\n</code></pre>\n```\n\n\
  #### `<s>`: 插入（删除线）文本标签\n\n在你发布网页后，页面上的某些信息可能会变得不准确或不再相关。大多数情况下，你只会修复不准确之处、删除文本或更新文本以使其相关。然而，在某些情况下，你可能想在保留旧文本的同时添加新的或更新的文本。为什么要这样做呢？通常，这是因为你想让读者能够对比新旧文本差异。例如，如果一个产品现在的价格更低，如果用户还能看到旧的较高价格，那么这个优惠价就会更具冲击力。在\
  \ HTML 中，你使用 `s` 元素来表示不准确或不再相关的文本，如下例所示（`bk02ch02/example18.html`）：\n\n```html\n\
  <h3>谁需要票？</h3>\n<hr>\n<h4>德国胡桃夹子剧</h4>\n<p>\n<s>所有场次：每张票 950 美元</s>\n</p>\n<p>\n\
  已售罄！\n</p>\n<hr>\n<h4>睡眠药美容</h4>\n<p>\n<s>所有场次：每张票 15,000 美元</s>\n</p>\n<p>\n现在仅\
  \ 9.99 美元！\n</p>\n<hr>\n```\n\n结果显示在图 2-17 中，其中网页浏览器使用删除线效果渲染 `s` 元素的文本。\n\n![s\
  \ 元素渲染带有删除线效果的文本的截图。](img/9781394164684-fg020217.png)\n\n图 2-17: `s` 元素以删除线效果渲染文本。\n\
  \n![记住](img/remember.png) 你可能想用 `s` 元素来表示（也许带有讽刺意味）已删除的文本，如下所示：\n\n```html\n哪个<s>傻瓜</s>人会花这么多钱去看芭蕾舞？\n\
  ```\n\n然而，这种标记（markup）的优选方法是使用 `del` 元素，它专门设计用于指示被删除的文本（并且同样使用删除线效果渲染文本）：\n\n```html\n\
  哪个<del>傻瓜</del>人会花这么多钱去看芭蕾舞？\n```\n\n#### `<sub>`: 下标文本标签\n\n如果你的网页包含数学公式或化学符号（嘿，这完全可能发生），一个或多个术语可能需要下标。*下标*是一个缩小了尺寸的字符（通常是数字或字母），它稍微向下移动，使得字符的某部分出现在文本基线下方。例如：H[2]O（水的化学方程式）。你通过\
  \ `sub` 元素将一个或三个字符标记为下标。这里有一个示例（`bk02ch02/example19.html`）：\n\n```html\n<p>\n今天心情不错吗？也许你的大脑正在泡多巴胺浴\n\
  (C<sub>8</sub>H<sub>11</sub>NO<sub>2</sub>）。\n</p>\n```\n\n图 2-18 显示了这些内容在浏览器中看起来什么样。\n\
  \n![使用 sub 元素将字符标记为下标的截图。](img/9781394164684-fg020218.png)\n\n图 2-18: 你可以使用 `sub`\
  \ 元素将字符标记为下标。\n\n#### `<sup>`: 上标文本标签\n\n*上标*是一个缩小了尺寸的字符（通常是数字或字母），它稍微向上移动，使得字符的顶部部分出现在正文上方。例如：e\
  \ = mc²（爱因斯坦展示质量与能量等效性的著名公式）。现在，当然，你的网页可能包含像这样的公式，但下标更常见的用途是标记脚注。无论是为了指定公式的幂还是脚注标记，你都可以使用\
  \ `sup` 元素告诉浏览器将一个或多个字符显示为上标。这是一个脚注示例（`bk02ch02/example20.html`）：\n\n```html\n<p>\n\
  从工厂工人到教职员工，每个人\n都欣赏语言的某些方面；每个人以某种\n方式方式都“被言语所困扰”<sup>1</sup>。\n</p>\n<hr>\n<p>\n\
  <sup>1</sup>这句短语源自莎士比亚：\n<blockquote>\n作死！我从未如此被言语困扰过<br>\n自从我叫我哥哥的父亲为爸爸以来。<br>\n\
  ——《亨王》，1596 年，第二幕第二场\n</blockquote>\n</p>\n```\n\n注意，我将上标既用于文本中的脚注标记，也用于脚注本身的开头。图\
  \ 2-19 显示了网页浏览器如何处理这段代码。\n\n![使用 sup 元素为页面标记脚注的截图。](img/9781394164684-fg020219.png)\n\
  \n## 第 3 章：处理图像、视频和其他媒体\n\n### 本章内容\n\n- ![Bullet](img/check.png) 使用图像装点你的页面\n-\
  \ ![Bullet](img/check.png) 学习语义元素\n- ![Bullet](img/check.png) 使用视频让你的页面活跃起来\n- ![Bullet](img/check.png)\
  \ 为你的页面添加音频文件\n\n用视觉故事是一门古老的艺术。几个世纪以来我们一直在画画——就像俗话所说。\n\n清楚的是，我并不是说页面上有很多文字一定是一件坏事。那些旧页面真正的问题在于它们将文本与糟糕的排版结合在一起，包括丑字体、杂乱的背景和糟糕的间距。你将在第\
  \ 7 章中学习顶级排版的所有原则，因此即使页面有很多文字，你也能让它们看起来很美观。\n\n\n\n\n\n-   **JPEG**: 命名于发明它的联合图像专家小组（Joint\
  \ Photographic Experts Group）。`JPEG`（读音为“jay-peg”）支持具有数百万颜色的复杂图像。`JPEG` 文件的主要优势在于，对于相同的图像，它们比\
  \ `GIFs` 更小，因此下载所需的时间更短。但要注意：`JPEG` 使用**有损**（lossy）压缩，这意味着它通过丢弃冗余像素来缩小图像。压缩率越高，丢弃的像素越多，图像看起来就越不清晰。尽管如此，如果你有一张照片或类似的图像，`JPEG`\
  \ 几乎总是最佳选择，因为它提供的文件大小最小。\n\n-   **PNG**: 可移植网络图形格式支持数百万颜色。`PNG`（读音为“p-n-g”或“ping”）是一种压缩格式，但与\
  \ `JPEG` 不同，`PNG` 使用的是**无损**（lossless）压缩。这意味着图像保留了锐度，但文件大小可能会变得很大。如果你有一个使用纯色的插图或图标，或者一张包含大面积近纯色的区域照片，`PNG`\
  \ 是一个很好的选择。`PNG` 还支持透明度。\n\n-   **SVG**: 使用可缩放矢量（Scalable Vector Graphics）格式，图像是通过\
  \ `vectors`（基于网格上点和形状的数学公式）而不是像素生成的。惊讶的是，这些矢量以一组指令的形式存在特殊的基于文本的格式中，这意味着你可以使用文本编辑器编辑图像！`SVG`\
  \ 是插图的良好选择，特别是如果你有支持 `SVG` 格式的软件，如 `Inkscape` 或 `Adobe Illustrator`。\n\n#### 插入图像\n\
  \n好了，关于这些就够了。是时候开始把一些图像挤到你的网页上了。正如前面提到的，有一段 HTML 代码告诉浏览器显示图像。它是 `<img>` 标签，它的工作原理如下：\n\
  \n```\n<img src=\"filename\" alt=\"description\" title=\"title\">\n```\n\n在这里，`src`\
  \ 是 source（源）的缩写；`filename` 是你想显示的图形文件的名称（通常也是位置）；`description` 是图像的简短描述（由屏幕阅读器读取，并在未显示图像或图像加载失败的用户看到）；`title`\
  \ 是当用户将鼠标指针悬停在图像上时显示的提示框。注意，这里没有需要添加的结束标签。\n\n![警告](img/warning.png) `alt` 属性是必须的，如果你有的图像没有\
  \ `alt` 值，那么你的网页就不是有效的 HTML。这是因为 `alt 文本`（通常被称为 `alt` 值）是你页面可访问性的关键方面；有关关于 alt 文本和可访问性的更多信息，请参阅第\
  \ 2 卷，第 6 章。尽管如此，如果你使用的图像纯是装饰性的，则不需要描述它们。在每种情况下，请在 `<img>` 标签中包含 `alt` 属性，但将其值设置为空字符串（\"\
  \ \"），如下所示：\n\n```\n<img src=\"filename\" alt=\"\" title=\"title\">\n```\n\n这里有一个可以观察的示例。假设你有一个名为\
  \ `logo.png` 的图像。要将其添加到页面中，你使用以下行：\n\n```\n<img src=\"logo.png\" alt=\"The Logophilia\
  \ Ltd. company logo\" title=\"Logophilia Ltd.\">\n```\n\n实际上，这个标签告诉浏览器：“请问一下？你能不能请你去取名为\
  \ `logo.png` 的图像文件，并将其插入到页面中 `<img>` 标签所在的位置？”浏览器会尽职地从你的 Web 服务器获取图像并在页面中显示。\n\n\
  为了让这个简单的示例生效，请记住你的 HTML 文件和你的图形文件需要位于同一个目录。许多网站管理员会专门为图像创建一个子目录，这可以保持内容整洁有序。如果你计划这样做，请务必学习我在第\
  \ 1 卷中关于使用目录和子目录的说明，第 2 章。\n\n这是一个在网页中包含图像的示例，图 3-1 显示了内容在 Web 浏览器中的显示情况（参考本书中示例文件中的\
  \ `bk02ch03/example01.html`）：\n\n```\nTo see a World in a Grain of Sand<br>\nAnd\
  \ a Heaven in a Wild Flower<br>\n—William Blake<br>\n<img src=\"images/flower-and-ant.jpg\"\
  \ alt=\"Macro photo showing an ant exploring a flower\" title=\"Flower and Ant\"\
  >\n```\n\n![插入了图像的网页截图。](img/9781394164684-fg020301.png)\n\n图 3-1： 插入了图像的网页。\n\n\
  #### 插入带有说明的图 在在整书中，当我想要你查看附近的屏幕截图时，我会说类似“图 3-1 显示了内容在 Web 浏览器中的显示情况。”这是你的提示，让你找到说明中带有“图\
  \ 3-1”的图像。\n\n通常，`figure` 是在正文中以某种方式引用的图像。\n\n\n\n\n\n我这样做是因为，否则浏览器会将图像与文本内联对齐。为什么呢？因为可能让你感到惊讶的是，`img`\
  \ 是一个内联元素，而不是块级元素。幸运的是，如果你确实想让图像随文本流动，你可以对图像和文本的对齐方式进行一些控制，但这需要快速地涉入 CSS 领域。要控制对象的垂直对齐，你需使用\
  \ `vertical-align` 属性：\n\n```css\n`selector` {\n  vertical-align: value;\n}\n```\n\
  \n或者，作为一种属性使用：\n\n```html\nstyle=\"vertical-align: value;\"\n```\n\n对于 `value`，你可以输入一个长度（例如，像素），正值长度会将图像向上移动，负值长度则将图像向下移动。`vertical-align`\
  \ 属性还支持许多预定义值，其中以下是你需要了解的：\n\n*   `baseline`：将图像的底部与图像所在文本行的基线（baseline）垂直对齐。（`baseline`\
  \ 是一条穿过如 `c` 和 `i` 等不含降部部分的字母底方的虚拟水平线。）这是默认值。\n*   `bottom`：将图像的底部与图像所在文本行的底部垂直对齐。（`bottom`\
  \ 行是一条穿过如 `g` 和 `y` 等字母最低部分的虚拟水平线。这些在基线以下的部分被称为降部（descenders）。）\n*   `middle`：将图像的中间与图像所在文本行的基线垂直对齐，并加上当前字体\
  \ x 高（x-height）的一半。（字体的 `x-height` 是不含升部或降部的字母（如 `c` 和 `x`）的字母。）\n*   `top`：将图像的顶部与图像所在文本行的顶部垂直对齐。（`top`\
  \ 行是一条穿过如 `h` 和 `t` 等字母最顶部部分的虚拟水平线。这些在 x 高以上的部分被称为升部（ascenders）。）\n\n这是一个示例，图 3-3\
  \ 显示了在浏览器中的视觉效果（bk02ch03/example04.html）：\n\n```html\n<div>\n  <img src=\"images/image01.jpg\"\
  \ alt=\"\" style=\"vertical-align: baseline;\">Baseline\n</div>\n<div>\n  <img src=\"\
  images/image02.jpg\" alt=\"\" style=\"vertical-align: bottom\">Bottom\n</div>\n\
  <div>\n  <img src=\"images/image03.jpg\" alt=\"\" style=\"vertical-align: middle\"\
  >Middle\n</div>\n<div>\n  <img src=\"images/image04.jpg\" alt=\"\" style=\"vertical-align:\
  \ top\">Top\n</div>\n```\n\n![vertical-align 属性值的效果截图。](img/9781394164684-fg020303.png)\n\
  \n图 3-3： `vertical-align` 属性值的实际效果。\n\n![记住](img/remember.png) 想知道如何为页面定义背景图像吗？我想到了。这是通过\
  \ CSS 实现的，我将在第三本书的第 6 章中详细介绍。\n\n### 嵌入视频\n\n如果说一画胜过千言，那么视频又值多少呢？我不知道，但考虑到网络上海量的视频内容，这一定是一个巨大的数字。似乎每个拥有主页的\
  \ Tom、Diego 和 Harriette 都在提供视频内容。如果你想加入他们的行列，那么你来对地方了。\n\n如何将视频嵌入网页，取决于视频的类型：\n\n\
  *   **第三方视频：**对于来自 YouTube、Vimeo 和 Dailymotion 等第三方网站的视频，你可以在页面中插入一些 HTML 代码，自动播放来自第三方网站的视频。\n\
  *   **你自己的视频：**对于你自己创建的视频文件，你将文件上传到服务器，然后使用 `video` 元素将视频插入页面。\n\n接下来的几个章节将提供有时繁琐的细节。\n\
  \n#### 嵌入第三方视频\n\n到目前为止，用视频内容让网页丰富起来的最简单方法是嵌入一些 HTML 代码，播放来自第三方在线视频提供商（如 YouTube）的视频。这是一条捷径，因为这意味着你不需要担心视频格式、上传视频文件以及处理提供视频时往往高昂的带宽成本。\n\
  \n几乎每个在线视频提供商都为每个视频提供了“分享”（Share）功能，该分享功能通常包含一个“嵌入”（Embed）组件，允许你复制所需的代码将视频嵌入到页面中。以下是从三个主要在线视频提供商获取所需\
  \ HTML 代码的说明：\n\n*   ![image](img/9781394164684-ma002.png) **Dailymotion：** 访问 dailymotion.com\
  \ 并找到你想嵌入页面的视频。点击分享图标（如侧边所示），然后点击“嵌入视频”，显示所需代码的对话框。根据需要开启或关闭自动播放（Autoplay）开关。（开启自动播放时，意味着视频每次都会自动开始。）\n\
  *   **Vimeo：** 访问 vimeo.com 并找到你想嵌入页面的视频。点击分享图标（如侧边所示），然后点击“嵌入视频”，显示所需代码的对话框。根据需要开启或关闭自动播放开关。\n\
  *   **YouTube：** 访问 youtube.com 并找到你想嵌入页面的视频。点击分享图标（如侧边所示），然后点击“嵌入视频”，显示所需代码的对话框。根据需要开启或关闭自动播放开关。\n\
  \n#### 嵌入你自己的视频\n\n如果你倾向于（或需要）走 DIY 视频路线，我对比你既有好消息也有坏消息，但我恐怕后者的比例更倾向于坏消息。\n\n好消息是\
  \ HTML 提供了 `video` 元素，你可以用它将视频播放器嵌入页面，它不仅可以显示你的视频，还提供了播放控制。坏消息是，如今网页友视频文件格式有些杂乱，因此并不总是清楚哪种是最佳方法。\n\
  \n##### 关于网络媒体文件格式的一些说明\n\n![技术细节](img/technicalstuff.png) 在继续之前，你需要知道网络媒体文件格式有两个重要的方面：\n\
  \n*   **容器（container）：** 媒体的文件格式。为什么称之为*容器*？因为它是一个归档文件——类似于 Zip 文件，包含了媒体所需的多个项目，包括解码器（codecs，参见下一项）和元数据。\n\
  \n\n\n\n\n- **编解码器 (codec):** 用于将媒体编码并压缩为数字格式，以及解码和解压缩媒体以便播放的算法。（因此，`codec` 是一个结合了\
  \ `code/decode` 且和 `compress/decompress` 的组合词。）\n\n这意味着每个网络媒体文件都采用特定的媒体格式，该格式使用特定的容器，而在容器内部（除其他内容外）包含了该格式支持的所有编解码器。这极其复杂，但当你发现根本没有所谓的“标准视频格式”时，情况会变得更加糟糕。\n\
  \n### 坏消息：Web 视频格式\n\n当你需要在页面中嵌入视频时，主要有三种格式需要你处理：\n\n- **MPEG-4：** 使用 `MPEG-4` 容器，其中包含\
  \ `H.264` 视频编解码器以及 `AAC` 音频解码器。该格式受专利保护，但对终端用户免费。MPEG-4 视频文件使用扩展名 `.mp4`。\n- **Ogg：**\
  \ 使用 `Ogg` 容器，其中包含 `Theora` 视频编解码器，以及 `Vorbis` 或 `Opus` 音频解码器。该格式是开源且免版税的。Ogg 视频文件使用扩展名：`.ogg`\
  \ 或 `.ogv`。\n- **WebM：** 使用 `WebM` 容器，其中包含 `VP8` 或 `VP9` 视频编解码器，以及 `Vorbis` 或 `Opus`\
  \ 音频解码器。该格式是开源且免版税的。WebM 视频文件使用扩展名 `.webm`。\n\n![提示](img/tip.png) 有大量的在线工具可以将视频转换为我在这里列出的格式。两个值得尝试的网站是\
  \ Zamzar ([`www.zamzar.com`](http://www.zamzar.com)) 和 Online-Convert ([`www.online-convert.com/`](http://www.online-convert.com/))。\n\
  \n我希望自己指向其中一种格式并说：“只用那一个。”然而，有两点阻碍我这样做：\n\n- **浏览器支持：** `MPEG-4` 和 `WebM` 都得到了所有主流浏览器的完全支持，但对\
  \ `Ogg` 的支持还没有到位。\n- **版税：** `Ogg` 和 `WebM` 都是免版税的，但受专利的 `MPEG-4` 需要浏览器公司支付版税才能使用。MPEG-4\
  \ 视频的极佳质量意味着所有主流浏览器都支持它，但未来可能不再如此。\n\n底线情况是，尽管你使用 `MPEG-4` 处理你自己的视频文件可能没问题，但如果你还能制作\
  \ `WebM` 版本，你应该为你的访问者提供两种文件格式。要学习如何操作，请继续阅读关于 HTML `video` 元素的详细说明。\n\n### 好消息：`<video>`\
  \ 标签\n\n鉴于我在上一节中对 Web 视频格式的复杂性所做的抱怨，发现得益于方便 `video` 元素，将自己的视频嵌入网页实际上相对简单，这真是令人欣慰。你如何使用\
  \ `video` 元素取决于你提供的是单一视频格式还是多种格式。\n\n首先，如果你只提供一种视频文件格式，这里是通用的 `video` 元素语法：\n\n\
  ```html\n<video src=\"source\"\nposter=\"poster\"\nwidth=\"width\"\nheight=\"height\"\
  \nautoplay\ncontrols\nloop\n</video>\n```\n\n以下是每个属性的含义：\n\n- `src`：视频文件的名称，如果该文件与\
  \ HTML 文件位于相同位置。如果视频文件位于不同的目录，你需要包含该信息，以便浏览器知道去哪里查找该文件。\n- `poster`：你希望浏览器在视频播放开始前显示的图像名称（以及目录，目录）。大多数情况下，你会使用视频的标题帧或静态帧。\n\
  - `width`：视频播放窗口的宽度，以像素为单位。\n- `height`：视频播放窗口的高度，以像素为单位。\n- `autoplay`：包含此属性，让浏览器在下载了足够的文件以便流畅播放后自动开始播放视频。如果你不想让视频自动开始，请省略\
  \ `autoplay` 属性。\n- `controls`：包含此属性，让浏览器在视频窗口中显示播放控件。如果你不希望访问者能够控制播放，请省略 `controls`\
  \ 属性。\n- `loop`：包含此属性，让浏览器在每次视频结束时自动从头开始播放。如果你希望视频只播放一次，请省略 `loop` 属性。\n\n这是一个嵌入视频的示例，图\
  \ 3-5 显示了嵌入网页中的视频（bk02ch03/example05.html）。\n\n```html\n<video src=\"videos/bear.mp4\"\
  \nposter=\"images/bear.png\"\nwidth=\"640\"\nheight=\"480\"\nautoplay\ncontrols\n\
  loop\n</video>\n```\n\n![嵌入网页的 MPEG-4 视频截图](img/9781394164684-fg020305.png)\n\n\
  图 3-5： 嵌入网页的 MPEG-4 视频。\n\n如果你想提供多种格式，请从 `<video>` 标签中移除 `src` 属性，并添加多个 `source`\
  \ 元素，为每种你想要提供的格式对应一个：\n\n```html\n<video poster=\"poster\"\nwidth=\"width\"\nheight=\"\
  height\"\nautoplay\ncontrols\nloop>\n<source src=\"filename\" type=\"video/mp4\"\
  >\n<source src=\"filename\" type=\"video/webm\">\n<source src=\"filename\" type=\"\
  video/ogg\">\n</video>\n```\n\n浏览器会按照你指定的顺序遍历 `source` 元素，并播放它遇到的第一个兼容格式。\n\n\n\n\
  \n\n*   **Bandcamp:** 访问 `bandcamp.com` 并打开你想嵌入页面的音频。点击 `Share/Embed` 按钮，点击 `Embed\
  \ This Album`，然后点击播放器样式以显示代码。根据需要自定义播放器，然后复制 `Embed` 文本框中出现的代码。将该代码粘贴到 HTML 文件中你想显示音频播放器的位置。\n\
  \n*   **Mixcloud:** 访问 `mixcloud.com` 并显示你想嵌入页面的音频。点击 `Share` 按钮，在弹出的对话框中点击 `Embed\
  \ Player` 标签页。点击你想使用的音频小组件样式，然后复制对话框中出现的代码。（你也可以点击 `More Options` 来自定义你的播放器。）将代码粘贴到\
  \ HTML 文件中你想显示音频小组件的位置。\n\n*   **SoundCloud:** 访问 `soundcloud.com` 并找到你想嵌入页面的音频。点击\
  \ `Share` 按钮，在弹出的对话框中点击 `Embed` 标签页以显示代码，如图 3-6 所示。根据需要调整选项，从 `Code` 文本框中复制代码，然后将代码粘贴到\
  \ HTML 文件中你想显示音频播放器的位置。\n\n![SoundCloud 音频轨道嵌入代码和选项的截图](img/9781394164684-fg020306.png)\n\
  \n图 3-6： SoundCloud 音频轨道的嵌入代码和选项。\n\n![警告](img/warning.png) 除非你清楚自己在做什么，否则不要编辑在线音频提供商提供的\
  \ HTML 代码。仅仅一个轻率的更改就可能导致你的嵌入音频无法播放。\n\n#### 嵌入你自己的音频\n你有想要提供到页面上的音频文件吗？没问题！音频文件格式比视频格式简单一些，且\
  \ HTML 提供了 `audio` 元素来实现相对免费的嵌入。\n\n##### Web 音频格式\n对于 Web 音频，你有以下格式需要处理：\n\n* \
  \  **MP3:** 这种格式既是容器也是音频编码器。该格式受专利保护，但对终端用户免费。这些音频文件使用 `.mp3`。\n*   **WAV:** 这种格式既是容器又是音频编码器。这些音频文件使用\
  \ `.wav`。\n*   **WebM:** 这种格式使用 `WebM` 容器，内部是 `Vorbis` 或 `Opus` 音频编码器。该格式开源且免版税。这些音频文件使用\
  \ `.webm`。\n*   **Ogg:** 这种格式使用 `Ogg` 容器，内部是 `Vorbis` 或 `Opus` 音频编码器。该格式开源且免版税。这些音频文件使用\
  \ `.ogg` 或 `.oga`。\n*   **MPEG-4:** 这种格式使用 `MPEG-4` 容器，内部是 `AAC` 音频编码器。该格式受专利保护，但对终端用户免费。这些音频文件使用\
  \ `.m4a`。\n\n![提示](img/tip.png) 有许多在线工具可以将音频文件转换为此处列出的格式。三个值得尝试的网站是 Zamzar（``www.zamzar.com`）、`Online-Convert`（``www.online-convert.com`）和\
  \ `Media.io` (`https://media.io`)。\n\n![记住](img/remember.png) 所有主流浏览器都长期支持 MP3 格式，所以你几乎只需要一种\
  \ MP3 文件就能搞定。\n\n##### `<audio>` 标签\n首先，如果你只提供单一音频格式，这里是通用的 `audio` 元素语法：\n\n```html\n\
  <audio src=\"\" controls loop></audio>\n```\n\n以下是每个属性的含义：\n\n*   `src`: 音频文件名，如果该文件与\
  \ HTML 文件位于相同位置。如果音频文件位于不同的目录，你需要包含该信息，以便浏览器知道去哪里查找文件。\n*   `autoplay`: 包含此属性可让浏览器在文件下载了足够用于平滑播放的内容后自动开始播放音频。如果你不想让音频自动开始，请省略\
  \ `autoplay` 属性。\n*   `controls`: 包含此属性可让浏览器在音频窗口中显示播放控制。如果你不想让访问者能够控制播放，请省略 `controls`\
  \ 属性。\n*   `loop`: 包含此属性可让浏览器在每次音频结束时都自动从头开始播放。如果你只想让音频播放一次，请省略 `loop` 属性。\n\n这是一个嵌入音频的示例，图\
  \ 3-7 显示了嵌入网页中的音频（`bk02ch03/example07.html`）。\n\n```html\n<audio src=\"audio/jabberwocky.mp3\"\
  \ controls loop></audio>\n```\n\n![嵌入网页的 MP3 音频文件截图](img/9781394164684-fg02307.png)\n\
  \n图 3-7： 嵌入网页的 MP3 音频文件。\n\n如果你想提供多种音频格式，请去掉 `<audio>` 标签的 `src` 属性，并为你想提供的每个格式添加一个\
  \ `source` 元素：\n\n```html\n<audio>\n  <source src=\"\" type=\"\">\n  <source etc>\n\
  </audio>\n```\n\n`audio` 属性与我之前描述的相同，但这里你需要了解 `<source>` 标签的属性：\n\n*   `src`: 音频文件名，如果该文件与\
  \ HTML 文件位于相同位置。如果音频文件位于不同的目录，你需要包含该信息，以便浏览器知道去哪里查找文件。\n*   `type`: 音频格式类型，例如 `audio/mp3`\
  \ 或 `audio/wav`。\n\n浏览器会按照你指定的顺序遍历 `source` 元素，并播放遇到的第一个兼容的音频格式。\n\n这是一个示例（`bk02ch03/example08.html`）：\n\
  \n```html\n<audio autoplay controls loop>\n  <source src=\"audio/jabberwocky.mp3\"\
  \ type=\"audio/mp3\">\n  <source src=\"audio/jabberwocky.m4a\" type=\"audio/mp4\"\
  >\n  <source src=\"audio/jabberwocky.webm\" type=\"audio/webm\">\n  <source src=\"\
  audio/jabberwocky.ogg\" type=\"audio/ogg\">\n  <source src=\"audio/jabberwocky.wav\"\
  \ type=\"audio/wav\">\n</audio>\n```\n\n\n\n\n\nHTML `table` 是一种以矩形结构呈现数据的结构，由一个或多个列和一或多行组成。从这个意义上说，你可以将表格看作一种数据库：表格的每一列等同于数据库字段，包含单一类型的信息，例如名称、地址或电话号码；每一行等同于数据库记录，持有一组相关的字段值，例如单个联系人的信息。图\
  \ 4-1 显示了一个典型的表格，并指出了几个关键特征（关于代码，请查看此书中示例文件中的 `bk02ch04/example01.html`）。\n\n![HTML\
  \ 表格的示意图，将数据在行、列和单元格中进行矩形排列。](img/9781394164684-fg020401.png)\n\n图 4-1: HTML 表格是将数据在行、列和单元格中进行矩形排列。\n\
  \n为了确保你理解正在发生什么（毕竟这是我的工作），请查看一下表格术语：\n\n*   **行 (Row)：** 横跨表格的单行数据。\n*   **列 (Column)：**\
  \ 数据的单列垂直部分。在图 4-1 表格中，共有五列。\n*   **单元格 (Cell)：** 行和列的交叉点。单元格存储你用于表格展示的单个数据项。\n\
  *   **标题 (Caption)：**（通常）出现在表格上方的，用于描述表格内容。\n*   **表头 (Headers)：** 表格的第一行。表头是可选的，但许多人使用它们来标记每一列。\n\
  \n这些没什么高科技的。到此时，你脑海中可能会出现两个问题。首先，考虑到 `pre` 元素（参见第 2 卷，第 2 章](#c06.xhtml)）在让文本对齐齐方面非常出色，既然\
  \ `pre` 可以可以做类似的工作，为什么还要用表格呢？问得好。以下是表格为这个……呃，表格带来的几个优势：\n\n*   **文本对齐非常简单。** 使用\
  \ `pre` 让文本对齐充其量是令人沮丧的，最坏的情况下是一项让人抓狂、头痛、诅咒这该死的 @#$%&!-网络存在的苦差。但使用表格，你可以毫不费力地让文本像训练营的新兵一样对齐。\n\
  *   **单元格之间互不影响。** 每个表格单元格都是自包含的。你可以编辑和样式化某个单元格的内容，而不会干扰其他表格元素的布局。\n*   **文本换行效果完美。**\
  \ 文本在每个单元格内换行，使得创建多行条目变得轻而易举。\n*   **你可以放入任何东西。** 表格不仅可以包含文本，还可以包含图像和链接（甚至是其他表格！）。\n\
  *   **它们很好看。** 在 `pre` 元素内换行的文本使用的是等宽字体，看起来并不好看，但表格使用的是页面字体，看起来好看得多。而且，作为一个额外的奖励，表格带有许多你可以利用的\
  \ CSS 属性，可以让你的表格看起来非常酷。\n\n其次，考虑到表格在精确定位文本方面非常出色，而且表格不仅支持文本还支持图像和其他内容，是否可以使用一个巨大的表格来布局我的页面？另一个极佳的问题！你越来越入状态了！\n\
  \n让我先说，使用表格组织页面元素是多年来的标准布局技术。然而，没有人非常喜欢这样使用表格，因为表格太僵化、太笨重，而且难以在大屏幕和小屏幕上良好地渲染。如今，没有人使用表格来布局页面了，而是倾向于更新、更强大的技术，例如\
  \ Flexbox（参见第 5 卷，第 2 章](#c30.xhtml））和 Grid（参见第 5 卷，第 3 章](#c31.xhtml)).\n\n## Web\
  \ 木工：如何构建表格\n\n好了，是时候给 HTML 加油门，开始制作这些表格内容了。接下来的几节将带你完成构建基础表格的步骤。\n\n### 最简单的情况：单行表格\n\
  \n作为一个示例，我将创建一个与食物相关的有趣的城镇名称简单表格。为什么不呢？表格总是从以下容器开始：\n\n```\n<table>\n</table>\n\
  ```\n\n所有其他表格标签都放在这两个标签之间。接下来，你添加表格主体（body）的容器（即行和列，不包括表头，你稍后会学到）。\n\n```html\n\
  <table>\n  <tbody>\n  </tbody>\n</table>\n```\n\n在你搭建好这个基本结构后，剩余的大部分表格工作涉及以下四个步骤的过程：\n\
  \n1.  **添加一行。**\n2.  **将该行分为你需要的列数。**\n3.  **向每个单元格中插入数据。**\n4.  **重复步骤 1 到 3 直到完成。**\n\
  \n要添加一行，你在 `<tbody>` 和 `</tbody>` 之间丢入一个 `<tr>`（表格行）标签和一个 `</tr>` 标签（其相应的结束标签）：\n\
  \n```html\n<table>\n  <tbody>\n    <tr>\n    </tr>\n  </tbody>\n</table>\n```\n\n\
  现在，你通过在 `<tr>` 和 `</tr>` 之间放置 `<td>`（表格数据）和 `</td>` 标签来将该行分成若干列。每个 `<<td>></</td>>`\
  \ 组合代表一列（更具体地说，是行中的一个单独单元格），例如，如果你想要一个三列表格，你可以这样做：\n\n```html\n<table>\n  <tbody>\n\
  \    <tr>\n      <td></td>\n      <td></td>\n      <td></td>\n    </tr>\n  </tbody>\n\
  </table>\n```\n\n现在，你通过在每个 `<td>` 标签及其 `</td>` 结束标签之间输入文本来输入行的单元格数据：\n\n```html\n\
  <table>\n  <tbody>\n    <tr>\n      <td>Candy Kitchen</td>\n      <td>New Mexico</td>\n\
  \      <td>59</td>\n    </tr>\n  </tbody>\n</table>\n```\n\n图 4-2 显示了目前的情况。\n\n\
  ![单行表格的截图。](img/9781394164684-fg020402.png)\n\n图 4-2: 一个简单的单行表格。\n\n记住你可以在 `<td>`\
  \ 和 `</td>` 标签内放入任何以下内容：\n\n*   文本\n*   链接\n*   列表\n*   图像和其他媒体\n\n### 添加更多行\n\n\
  当你的第一行就就位置后，你对其他行重复该程序。对于我的示例，这里是包含数据的 HTML：\n\n```html\n<table>\n  <tbody>\n  \
  \  <tr>\n      <td>Candy Kitchen</td>\n      <td>New Mexico</td>\n      <td>59</td>\n\
  \    </tr>\n    <tr>\n      <td>Hot Coffee</td>\n      <td>Mississippi</td>\n  \
  \    <td>2586</td>\n    </tr>\n    <tr>\n      <td>Ketchuptown</td>\n      <td>South\
  \ Carolina</td>\n      <td>84</td>\n    </tr>\n    <tr>\n      <td>Sandwich</td>\n\
  \      <td>New Hampshire</td>\n      <td>1354</td>\n    </tr>\n    <tr>\n      <td>Two\
  \ Egg</td>\n      <td>Florida</td>\n      <td>3683</td>\n    </tr>\n  </tbody>\n\
  </table>\n```\n\n为了让代码更易读，我将每行的 `td` 元素放在了同一行中。图 4-3 显示了目前目前的进展（查看 `bk02ch04/example02.html`）。\n\
  \n![完成的表格主体截图。看起来很不错！](img/9781394164684-fg020403.png)\n\n图 4-3: 完成的表格主体。看起来很不错！\n\
  \n## 添加更多表格元素\n\n一个具有一或多个行和一或多列主体的表格是 HTML 表格俱乐部的完全成员，所以如果你只需要这样来展示数据，你就可以进入网页待办事项中的下一项了。然而，HTML\
  \ 表格提供了许多你可能考虑的功能。例如，你的表格可能需要列标题或行标题（或两者都有），表格内容的描述，或者以某种方式总结表格的行。所有这些功能在接下来的几节中所示。\n\
  \n\n\n\n\n你可以通过在每列的顶部添加描述该列内容的标签，来让读者的生活变得更轻松。（你不需要冗长的解释；在大多数情况下，一两个单词就足够了。）要添加这些标签，你首先需要创建一个名为\
  \ `head: ` 的新表格部分：\n\n```html\n<thead>\n\n</thead>\n```\n\n将此部分放在 `<tbody>` 标签的正上方。\n\
  \n现在，你来创建一个 `header row`（表头行）。这与普通行类似，不同之处在于将 `<td>` 和 `</td>` 替换为 `<th>`（表格表头）和\
  \ `</th>`，如下所示：\n\n```html\n<thead>\n<tr>\n<th>第一列表头</th>\n<th>第二列表头</th>\n<th>以此类推，直到厌烦</th>\n\
  </tr>\n</thead>\n```\n\n如代码所示，`th` 元素与 `td` 元素非常相似。区别在于，浏览器会将出现在 `<th>` 和 `</th>`\
  \ 标签之间的文本显示为**粗体**，并且在单元格内是*居中对齐*的。这有助于助帮助读者将表头与表格的其余数据区分开来。但请记住，表头是可选的；如果你的表格不需要表头，可以跳过它们。\n\
  \n好了，现在为你的示例表格添加表头部分和表头行：\n\n```html\n<table>\n<thead>\n<tr>\n<th>城市</th>\n<th>州</th>\n\
  <th>人口</th>\n</tr>\n</thead>\n<tbody>\netc.\n```\n\n[图 4-4] 显示了带有列标题的表格（bk02ch04/example03.html）。\n\
  \n![示例表格的截图，现在添加了列标题。](img/9781394164684-fg020404.png)\n\n[图 4-4::]: ] 示例表格，现在添加了列标题。\n\
  \n### 添加标题 (Caption)\n\n下一个基本的表格元素是 `caption`（标题）。标题是一个简短的描述（一到两句话），告诉读者表格的。你使用\
  \ `<caption>` 元素来定义标题：\n\n```html\n<caption>\n在此处输入标题文本\n</caption>\n```\n\n你只需在\
  \ `<table>` 标签之后添加标题代码。默认情况下，网页浏览器会将标题居中显示在表格上方，但你可以通过一些 CSS 来更改这一默认设置（查看本章后部分的“更改标题的位置””）。这是我添加了标题的表格代码的第一部分：\n\
  \n```html\n<table>\n<caption>\n有趣的基于食物的城市名称\n</caption>\n<thead>\netc.\n```\n\n\
  [图 4-5] 显示了标题现在出现在表头行上方的表格（bk02ch04/example04.html）。\n\n![添加了标题的示例表格截图。](img/9781394164684-fg020405.png)\n\
  \n[图 4-5:] 添加了标题的示例表格。\n\n### 创建表头列 (Header Column)\n\n在某些表格中，第一列的值充当标签，描述每行其余部分的内容。HTML\
  \ 没有专门用于这种表头列的元素，但你可以通过将第一列中的 `<td>` 和 `</td>` 标签替换为 `<th>` 和 `</th>` 标签来自己实现它。这告诉浏览器将第一列中的项目显示为**粗体文本**并在列中*居中对齐*。这里有一个示例（bk02ch04/example05.html）：\n\
  \n```html\n<table>\n<caption>\n各分类的第四季度销售额\n</caption>\n<thead>\n<tr>\n<th></th><th>销售数量</th><th>总销售额</th>\n\
  </tr>\n</thead>\n<tbody>\n<tr>\n<th>小玩意儿</th><td>5,732</td><td>$28,603</td>\n</tr>\n\
  <tr>\n<th>小零件</th><td>8,502</td><td>$59,429</td>\n</tr>\n<tr>\n<th>奇巧小件</th><td>10,468</td><td>$41,767</td>\n\
  </tr>\n<tr>\n<th>各种奇妙物</th><td>4,498</td><td>$40,437</td>\n</tr>\n<tr>\n<th>不名之物</th><td>7,165</td><td>$57,248</td>\n\
  </tr>\n</tbody>\n</table>\n```\n\n需要注意的一点小细节是，表头部分的第一个单元格使用了代码 `<th></th>`。这告诉浏览器不要在该单元格中显示任何内容。[图\
  \ 4-6] 显示了该表格在浏览器中的显示情况。\n\n![带有列表头的表格截图。](img/9781394164684-fg020406.png)\n\n[图\
  \ 4-6:] 带有列表头的表格。\n\n### 创建表格页脚 (Table Footer)\n\n如果你的表格数据适合某种总结——例如，另外几列的总和或平均值——你可以将该总结放在表格的脚部。你从一个由\
  \ `<tfoot>` 和 `</tfoot>` 标签构建的容器开始：\n\n```html\n<tfoot>\n</tfoot>\n```\n\n将此部分放在\
  \ `<tbody>` 标签的正下方。现在，你创建一个 `footer row`（页脚行）。这类似于普通行，但你使用 `<td>`（或 `<th>`）元素来创建，如下：\n\
  \n```html\n<tfoot>\n<tr>\n<td>第一列页脚</td>\n<td>第二列页脚</td>\n</tr>\n</tfoot>\n```\n\
  \n将 `<tfoot>` 元素放在 `<tbody>` 下方，所示（bk02ch04/example06.html）：\n\n```html\n<table>\n\
  <caption>\n各分类的第四季度销售额\n</caption>\n<thead>\n<tr>\n<th></th><th>销售数量</th><th>总销售额</th>\n\
  </tr>\n</thead>\n<tbody>\n<tr>\n<th>小玩意儿</th><td>5,732</td><td>$28,603</td>\n</tr>\n\
  <tr>\n<th>小零件</th><td>8,502</td><td>$59,429</td>\n</tr>\n<tr>\n<th>奇巧小件</th><td>10,468</td><td>$41,767</td>\n\
  </tr>\n<tr>\n<th>各种奇妙物</th><td>4,498</td><td>$40,437</td>\n</tr>\n<tr>\n<th>不名之物</th><td>7,165</td><td>$57,248</td>\n\
  </tr>\n</tbody>\n<tfoot>\n<tr>\n<td>合计</td>\n<td>36,465</td>\n<td>$207,404</td>\n\
  </tr>\n</tfoot>\n</table>\n```\n\n[图 4-7] 显示了带有页脚行的表格。\n\n![带有页脚行的表格的截图。](img/9781394164684-fg020407.png)\n\
  \n[图 4-7:] 带有页脚行的表格。\n\n## 表格样式化：美化表格\n\n在本章之前讨论的标签足以让你能够构建健壮的表格。然而，如果你对表格的布局和外观有更多控制需求，接下来的几节将介绍一些实用的。\n\
  \n### 单元格内文本对齐\n\n当涉及到单元格内数据的对齐时，你有两种考虑：\n\n- **水平对齐**：指的是文本相对于单元格左右边缘的对齐方式。数据单元（td）的默认水平对齐是左对齐，表头单元（th）是居中。\n\
  - **垂直对齐**：指的是文本相对于单元格顶部和底部的对齐方式。所有表格单元的默认垂直对齐是在中间。\n\n如果你希望对一个或多个单元格覆盖这些默认设置，有一些属性可以实现。接下来的几节将解释。\n\
  \n#### 水平对齐文本\n\n你通过使用 CSS `text-align` 属性来自定义单元格的水平对齐：\n\n```css\nselector {\n\
  \  text-align: value;\n}\n```\n\n或者作为属性：\n\n```html\nstyle=\"text-align: value;\"\
  \n```\n\n对于 `value`，你可以使用以下值：\n\n- `left`：与单元格左边缘对齐。\n- `center`：与单元格水平中间对齐。\n-\
  \ `right`：与单元格右边缘对齐。\n- `justify`：与单元格左右边缘都对齐。\n\n例如，如果你想让你所有的 `th` 元素左对齐而不是居中，你可以在你的\
  \ CSS 中添加以下规则：\n\n```css\nth {\n  text-align: left;\n}\n```\n\n这里有一个较大的示例，演示了四个\
  \ `text-align` 值（bk02ch04/example07.html）：\n\n```html\n<table>\n<thead>\n<tr>\n\
  <th>习语</th><th>词性</th><th>首次使用时间</th><th>定义</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n\
  <td style=\"text-align: left;\">\ngoat cheese curtain\n</td>\n<td style=\"text-align:\
  \ center;\">\nnoun\n</td>\n<td style=\"text-align: right;\">\n2012\n</td>\n<td style=\"\
  text-align: justify; width: 200px;\">\n```\n\n\n\n\n一条将城市老练人士与简单、传统或缺乏文化品味的人隔开来的虚拟边界。\n\
  \n如图 4-8 所示，第一列左对齐，第二列居中对齐，第三列右对齐，第四列端对齐。\n\n![text-align 值的实际演示截图](img/9781394164684-fg020408.png)\n\
  \n图 4-8： `text-align` 值的实际演示。\n\n![技术细节](img/technicalstuff.png) 注意，我在第四个 `<td`\
  \ 标签中添加了声明 `width: 200px;`。如果不限制宽度，该列将占据浏览器窗口中的所有可用宽度，从而无法显示端对齐效果。请参阅第 3 部分的 1 章以了解更多关于\
  \ `width` 属性的信息。同样注意，我还为每个单元格添加了边框，以便更容易观察对齐情况。查看本章后面的“添加边框”，学习如何处理表格边框。\n\n###\
  \ 单元格文本的垂直对齐\n\n你也可以在单元格内对文本进行垂直对齐。当某个单元格很大（因为它包含了大量文本或较大的图像），并且你想调整同一行其他单元格的垂直位置时，这非常有用。要控制单元格内的垂直对齐，你可以使用\
  \ CSS 的 `vertical-align` 属性：\n\n```css\nselector {\n  vertical-align: value;\n}\n\
  ```\n\n或者作为属性：\n\n```html\nstyle=\"vertical-align: value;\"\n```\n\n对于 `value`，`vertical-align`\
  \ 属性支持许多预定义关键字，以下是你需要了解的：\n\n- `bottom`: 将文本与单元格底部对齐。\n- `middle`: 将文本与单元格的垂直中心对齐。这是默认的垂直对齐方式。\n\
  - `top`: 将文本与单元格顶部对齐。\n\n例如，如果你想让所有的 `td` 元素与单元格顶部对齐而不是居中对齐，你需要在 CSS 中添加以下规则：\n\n\
  ```css\ntd {\n  vertical-align: top;\n}\n```\n\n这里有一个展示所有三个 `vertical-align` 值的较大示例（bk02ch04/example08.html）：\n\
  \n```html\n<table>\n  <thead>\n    <tr>\n      <th>Idiom (习语)</th>\n      <th>Part\
  \ of Speech (词性)</th>\n      <th>First Used (首次使用)</th>\n      <th>Definition (定义)</th>\n\
  \    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td style=\" vertical-align:\
  \ top;\">goat cheese curtain</td>\n      <td style=\" vertical-align: middle;\"\
  >noun (名词)</td>\n      <td style=\" vertical-align: bottom;\">2012</td>\n      <td\
  \ style=\"text-align: justify; width: 200px;\">\n        一条将城市老练人士与简单、传统或缺乏文化品味的人隔开来的虚拟边界。\n\
  \      </td>\n    </tr>\n  </tbody>\n</table>\n```\n\n如图 4-9 所示，第一列顶端对齐，第二列中对齐，第三列底对齐。\n\
  \n![vertical-align 值的演示截图](img/9781394164684-fg020409.png)\n\n图 4-9： `vertical-align`\
  \ 值的演示。\n\n### 添加边框\n\n默认情况下，网页浏览器显示的表格不带有任何边框，无论是表格整体还是行与列之间。这种没有边框的状态通常不是什么大问题，因为由于单元格内宽宽度不同，大多数单元格内部都有足够的空白。\n\
  \n然而，如果表格项目在每列中的宽度大致相同，表格可能会开始看起来非常拥挤，如图 4-10 (bk02ch04/example09.html) 所示。\n\n\
  ![某些表格看起来可能非常拥挤的截图](img/9781394164684-fg020410.png)\n\n图 4-10： 某些表格看起来可能非常拥挤。\n\n\
  使此类表格更容易阅读的一种方法是在表格本身以及每行每列之间都添加边框。要构建边框，你需要使用 CSS。具体来说，你可以对 `border` 属性使用以下简化语法：\n\
  \n```css\nselector {\n  border: width style color;\n}\n```\n\n在这里，`selector` 是你想要样式的元素，`border`\
  \ 取以下值：\n\n- `width`: 边框的厚度，用任何 CSS 支持的测量单位表示。\n- `style`: 边框的类型，可以是以下关键字之一：`dotted`\
  \ (点线)、`dashed` (虚线)、`double` (双线)、`groove` (凹槽)、`inset` (内凹)、`outset` (凸出)、`solid`\
  \ (实线)。\n- `color`: 边框的颜色，可以是任何颜色，例如 `black` (黑色)。\n\n\n\n\n例如，为了给表格的 `th` 和 `td`\
  \ 元素添加 5 像素的间距，你需要在 CSS 中添加以下规则：\n\n```css\nth, td {\n  padding: 5px;\n}\n```\n\n\
  图 4-13 显示更新后的表格（`bk02ch04/example12.html`）。啊，这样好多了。\n\n![每个单元格都添加了内边距的表格截图。](img/9781394164684-fg020413.png)\n\
  \n图 4-13： 我们为每个单元格添加了内边距的表格。\n\n### 更改标题的位置\n\n如果你为表格添加了标题（caption），默认情况下，浏览器会将标题文本放置在表格上方。如果你希望表格标题出现在表格下方，可以使用\
  \ `caption-side` 属性来实现这一目标：\n\n```css\ncaption {\n  caption-side: bottom;\n}\n```\n\
  \n图 4-14 显示了一个标题位于表格底部的表格（`bk02ch04/example13.html`）。\n\n![标题在底部的表格截图。](img/9781394164684-fg020414.png)\n\
  \n图 4-14： 标题在底部的表格。\n\n## 第 5 章\n\n# 使用表单使页面交互\n\n本章内容\n\n![Bullet](img/check.png)\
  \ **理解 Web 表单基础**\n\n![Bullet](img/check.png) **添加一个或两个按钮**\n\n![Bullet](img/check.png)\
  \ **插入文本框和文本区域**\n\n![Bullet](img/check.png) **添加复选框和单选按钮**\n\n![Bullet](img/check.png)\
  \ **配合列表和标签使用**\n\n![Bullet](img/check.png) **在你的页面上放置选择器**\n\n*HTML5 表单从微不起起家，现在已极其灵活且强大，原生提供了许多我们作为开发者多年来一直通过\
  \ JavaScript 添加的功能。*\n\n— PETER GASSTON\n\n在 Web 上发布页面绝对是一次令人兴奋的体验。但在最初的兴奋消退后，你可能会注意到一个发布后的影响，即你的页面就那样静静地待在那里。诚然，对于页面来说，待在那里并不是糟糕的状态，因为发布到\
  \ Web 的真正意义是发布别人想看的信息。在这种情况下，让页面静静地待在那里是件好事。\n\n尽管如此，如果你的某些页面能为好奇的访客提供更多内容，那就更好了。与其让人们总是冲进来，读一会儿你的东西然后离开，如果你还能提供一些能让他们多留一会儿的东西，那不是很棒吗？想个办法让你的页面更具交互性怎么样呢？\n\
  \n啊，你现在说对了，因为 HTML *确实* 提供了一种将静止止的网页转换为交互式页面的机制：Web 表单。在本章中，你将探索 Web 表单所提供的所有功能。在掌握基础之后，你将研究\
  \ HTML Web 表单提供的惊人功能，这些不仅包括按钮、文本框和列表等标准小组件，还包括用于选择日期和颜色等更高级的控件。这是一场真正的表单盛宴，准备好大快享用吧！\n\
  \n### 什么是 Web 表单？\n\n大多数现代程序在需要从你提取某些信息时，会弹出一个对话框。例如，选择程序的 `Print`（打印）命令很可能会显示某种\
  \ `Print` 对话框。该对话框的目的是请求信息，例如你需要的副本数量、想要打印的页面、想要使用的打印机等。\n\n表单本质上是 Web 页面版的对话框。它是一个填充了文本框、列表、复选框、命令按钮和其他控件的页面区域，用于从用户处获取信息。例如，图\
  \ 5-1 显示了我网站上的表单。这是一个可以使用向我发送消息的表单。该表单包含一个姓名的文本框、另一个电子邮件地址框、一个用于信息的较大的文本区域，以及一个将数据发送到我服务器的命令按钮。\n\
  \n![典型的 Web 表单截图。](img/9781394164684-fg020501.png)\n\n图 5-1： 典型的 Web 表单。\n\nWeb\
  \ 表单是一个小型数据收集机器。它可以收集什么类型的数据？随你所欲：\n\n*   文本，从单个单词到长篇帖子\n*   数字、日期和时间\n*   列表中选择了哪个（或哪些）项目\n\
  *   是否选中了复选框\n*   一组单选按钮中选择了哪一个\n\n在你收集到数据后，这些数据会发生什么？数据可以走两条路：服务器街（Server Street）和本地巷（Local\
  \ Lane）。\n\n#### 在服务器街上巡航\n\n服务器街道路线意味着你的 Web 服务器参与了进来。以下是基本步骤：\n\n1.  用户点击按钮提交表单。\n\
  2.  你的 JavaScript 代码收集表单数据。\n3.  将表单发送到服务器。\n4.  服务器提取表单数据。\n5.  服务器以某种方式处理表单数据（例如通过数据库）。\n\
  6.  服务器输出结果。\n7.  你的 JavaScript 代码处理结果并更新。\n\n![Tip](img/tip.png) 如果这听起来极其复杂，你是对的：确实如此，而且这超出了本书的范围。如果你对将表单数据提交到服务器感兴趣，我有另一本书可以告诉你一切——*Web\
  \ Coding and Development All-in-One Dummies》。\n\n#### 在本地巷漫步\n\n本地巷路线完全不涉及服务器：\n\
  \n1.  用户以某种方式更改表单数据。\n2.  你的 JavaScript 代码检测到更改。\n3.  与更改字段关联的代码更新网页。\n\n啊，这要简单得多，不是吗？但通过这种有限的表单处理你能做什么？实际上有很多：\n\
  \n*   **添加过滤器**：如果你的页面很长，你可以给读者提供一个过滤内容的表单。\n*   **隐藏和显示内容**：如果你的页面包含许多披露组件（点击时显示隐藏内容的对象，也称为折叠面板），你可以添加一次性显示或隐藏所有内容的按钮。\n\
  *   **自定义页面**：你可以提供一个表单，让访客以某种方式自定义页面（例如通过更改颜色或字体）。\n*   **存储用户偏好**：你可以使用表单获取访客的个人信息或偏好，并将这些数据存储在浏览器中。\n\
  *   **计算某些值**：你可以构建一个带有一个或输入的表单，然后显示计算结果（例如抵押贷款付款或从英制单位到公制的转换）。\n*   **增强可访问性**：你可以使用表单让访客激活某些可访问功能，如高对比度颜色和较大的字体。\n\
  \n\n\n\n![Remember](img/remember.png) 因为你使用表单只是为了给网页添加本地交互，而不会向服务器提交任何表单数据，从技术上讲，你完全不需要\
  \ `<form>` 标签。然而，在大多数情况下你仍然应该使用它，因为包含 `<form>` 标签允许用户通过按 Enter 或 Return 键提交表单，而且在移动浏览器中还能为你提供一个提交按钮（如“Go”）。\n\
  \n### 添加表单按钮\n\n大多数表单都包含一个按钮，用户在完成表单并想要启动表单底层操作时点击它。这被称为`提交`（submitting）表单，该术语传统上是指将表单数据发送到服务器端脚本进行处理。然而，在今天，也无疑在本书书中，“提交”表单也可以意味着更新网页上的某些内容而无需向服务器发送任何内容。例如，点击按钮可能会设置页面的背景颜色。\n\
  \n提交表单的旧样式是使用 `<input>` 标签并将 `type` 属性设置为 `submit`：\n\n```html\n<input type=\"submit\"\
  \ value=\"buttonText\">\n```\n\n这里的 `buttonText` 是按钮表面显示的文本的占位符。\n\n例如：\n\n```html\n\
  <input type=\"submit\" value=\"Submit Me!\">\n```\n\n这种样式在现代 Web 开发中很少使用，因为给这种按钮设置样式比较棘手。由于这个原因，大多数\
  \ Web 开发者使用 `<button>` 标签：\n\n```html\n<button type=\"submit\">buttonText</button>\n\
  ```\n\n这里的 `buttonText` 再次代表按钮表面显示的文本。\n\n例如：\n\n```html\n<button type=\"submit\"\
  >Ship It</button>\n```\n\n![Tip](img/tip.png) 为了让按钮更好看，请使用 CSS 对以下内容进行样式化：\n\n*\
  \   **圆角：** 要控制按钮角的圆润度，请使用 `border-radius` 属性，将其设置为测量值（例如像素）或百分比。例如：\n\n    ```css\n\
  \    button {\n      border-radius: 15px;\n    }\n    ```\n\n*   **投影：** 要给按钮添加投影，请应用\
  \ `box-shadow:x y blur color` 属性，其中 `x` 是阴影的水平偏移，`y` 是阴影的垂直偏移，`blur` 是阴影的模糊程度，`color`\
  \ 是阴影颜色。例如：\n\n    ```css\n    button {\n      box-shadow: 3px 3px 5px grey;\n \
  \   }\n    ```\n\n### 使用文本字段\n\n基于文本的字段是最常用的表单元素，大多数字段都使用 `<input>` 标签：\n\n```html\n\
  <input type=\"textType\" name=\"textName\" value=\"textValue\" placeholder=\"textPrompt\"\
  >\n```\n\n*   `textType`：你想在表单中使用的文本类型。\n*   `textName`：你分配给字段的名称。\n*   `textValue`：字段的初始值（如果有）。\n\
  *   `textPrompt`：页面首次加载时临时显示在字段中的文本，用于提示用户所需的输入。当用户开始在字段中输入时，占位符文本就会消失。\n\n以下是你可以用于\
  \ `type` 属性的可用文本类型类型列表：\n\n*   `text`：显示一个文本框，用户可以在其中输入一行文本。添加 `size` 属性可以以字符为单位指定字段宽度（默认为\
  \ `20`）。这里是一个示例：\n\n    ```html\n    <input type=\"text\" name=\"company\" size=\"\
  50\">\n    ```\n\n*   `number`：显示一个文本框，用户可以在其中输入数值。大多数浏览器会添加一个数字调节器（spin box），允许用户通过点击向上或向下箭头分别增加或减少数字。查看这个示例：\n\
  \n    ```html\n    <input type=\"number\" name=\"points\" value=\"100\">\n    ```\n\
  \n    我还应该提到 `range` 类型，它显示一个滑块控件，允许用户点击并拖动在指定的最小和最大值之间选择数值：\n\n    ```html\n  \
  \  <input type=\"range\" name=\"transparency\" min=\"0\" max=\"100\" value=\"100\"\
  >\n    ```\n\n*   `email`：显示一个文本框，用户可以在其中输入电子邮件地址。添加 `multiple` 属性允许用户输入两个或多个用逗号分隔的地址。添加\
  \ `size` 属性以字符为单位指定字段宽度。给你的示例：\n\n    ```html\n    <input type=\"email\" name=\"\
  user-email\" placeholder=\"you@yourdomain.com\">\n    ```\n\n*   `url`：显示一个文本框，用户可以在其中输入\
  \ URL。添加 `size` 属性以字符为单位指定字段宽度。例如：\n\n    ```html\n    <input type=\"url\" name=\"\
  homepage\" placeholder=\"e.g., http://domain.com/\">\n    ```\n\n*   `tel`：显示一个文本框，用户可以在其中输入电话号码。使用\
  \ `size` 属性以字符为单位指定字段宽度。这里有一个示例：\n\n    ```html\n    <input type=\"tel\" name=\"\
  mobile\" placeholder=\"(xxx)xxx-xxxx\">\n    ```\n\n*   `time`：显示一个文本框，用户可以在其中输入时间，通常是小时和分钟。\n\
  \n    ```html\n    <input type=\"time\" name=\"start\">\n    ```\n\n*   `password`：显示一个文本框，用户可以在其中输入密码。添加\
  \ `autocomplete` 属性来指定浏览器是否可以自动填充密码。需要示例吗？\n\n    ```html\n    <input type=\"password\"\
  \ name=\"userpassword\" autocomplete=\"off\">\n    ```\n\n*   `search`：显示一个文本框，用户可以在其中输入搜索词。添加\
  \ `size` 属性以字符为单位指定字段宽度。为什么，例如：\n\n    ```html\n    <input type=\"search\" name=\"\
  q\" placeholder=\"Type search\">\n    ```\n\n*   `hidden`：向表单添加一个输入字段，但你不希望用户注意到它。这里有一个示例：\n\
  \n    ```html\n    <input id=\"userSession\" name=\"session\" type=\"hidden\" value=\"\
  jwr274\">\n    ```\n\n>! 一些旧浏览器不支持 `email` 和 `time` 等文本字段，但你仍然可以在页面中使用它们，因为那些笨的浏览器只会将其显示为\
  \ `text` 字段。\n\n有很多文本字段，但还没结束！还有两个你需要知道：\n\n*   `<textarea>`：此标签显示一个用户可以在其中输入多行文本的框。添加\
  \ `rows` 属性指定显示的行数。如果你希望框中显示默认文本，请在 `<textarea>` 和 `</textarea>` 标签之间添加文本。\n\n \
  \   ```html\n    <textarea name=\"message\" rows=\"5\">默认文本在此处。</textarea>\n   \
  \ ```\n\n*   `<label>`：将标签与表单字段关联。有两种使用标签的方法：\n\n    方法 #1 — 用 `<label>` 和 `</label>`\
  \ 标签围绕表单字段，并将标签文本插入字段之前之后，如下：\n\n    ```html\n    <label>\n      邮箱：\n      <input\
  \ type=\"email\" name=\"user-email\" placeholder=\"you@yourdomain.com\">\n    </label>\n\
  \    ```\n\n    方法 #2 — 在字段标签上添加 `id` 值，将 `<label>` 标签的 `for` 属性设置为相同的值，并将标签文本插入\
  \ `<label>` 和 `</label>` 标签之间，我在这里所示：\n\n    ```html\n    <label for=\"useremail\"\
  >邮箱:</label>\n    <input id=\"useremail\" type=\"email\" name=\"user-email\" placeholder=\"\
  you@yourdomain.com\">\n    ```\n\n[图 5-2] 展示了这些文本字段中的每一个（代码请查看书中示例文件中的 bk02ch05/example01.html）。\n\
  \n![你可以在表单中使用的各种文本输入类型的截图。](img/9781394164684-fg020502.png)\n\n[FIGURE 5-2::] 你可以在表单中使用的各种文本输入类型。\n\
  \n\n\n\n\n你在 Web 表单中使用复选框来切换设置的开启（即复选框被选中）和关闭（即复选框未被字体）。通过在表单中包含以下版本的 `<input>`\
  \ 标签创建一个复选框：\n\n```html\n<input type=\"checkbox\" name=\"checkName\" value=\"checkValue\"\
  \ [checked]>\n```\n\n*   `checkName`: 你想要赋予复选框的名称。\n*   `checkValue`: 你想要赋予复选框的值。\n\
  *   `checked`: 当此可选属性存在时，复选框初始为被选中状态。\n\n这里有一个示例（查看 `bk02ch05/example02.html`）：\n\
  \n```html\n<fieldset>\n  <legend>你恐症什么？（请勾选所有适用项）：</legend>\n  <label>\n    <input\
  \ type=\"checkbox\" name=\"phobia\" value=\"Ants\">蚁恐惧症（害怕蚂蚁）\n  </label>\n  <label>\n\
  \    <input type=\"checkbox\" name=\"phobia\" value=\"Bald\">秃恐惧症（害怕秃头）\n  </label>\n\
  \  <label>\n    <input type=\"checkbox\" name=\"phobia\" value=\"Beards\" checked>胡须恐惧症（害怕胡子）\n\
  \  </label>\n  <label>\n    <input type=\"checkbox\" name=\"phobia\" value=\"Bed\"\
  >床恐惧症（害怕睡觉）\n  </label>\n  <label>\n    <input type=\"checkbox\" name=\"phobia\"\
  \ value=\"Chins\" checked>下巴恐惧症（害怕下巴）\n  </label>\n  <label>\n    <input type=\"\
  checkbox\" name=\"phobia\" value=\"Flowers\">花恐惧症（害怕花）\n  </label>\n  <label>\n\
  \    <input type=\"checkbox\" name=\"phobia\" value=\"Flying\">飞行恐惧症（害怕飞行）\n  </label>\n\
  \  <label>\n    <input type=\"checkbox\" name=\"phobia\" value=\"Purple\">紫色恐惧症（害怕紫色）\n\
  \  </label>\n  <label>\n    <input type=\"checkbox\" name=\"phobia\" value=\"Teeth\"\
  \ checked>牙恐惧症（害怕牙齿）\n  </label>\n  <label>\n    <input type=\"checkbox\" name=\"\
  phobia\" value=\"Thinking\">思维恐惧症（害怕思考）\n  </label>\n  <label>\n    <input type=\"\
  checkbox\" name=\"phobia\" value=\"Vegetables\">蔬菜恐惧症（害怕蔬菜）\n  </label>\n  <label>\n\
  \    <input type=\"checkbox\" name=\"phobia\" value=\"Fear\" checked>恐惧恐惧症（害怕恐惧）\n\
  \  </label>\n  <label>\n    <input type=\"checkbox\" name=\"phobia\" value=\"Everything\"\
  >泛恐恐惧症（害怕一切）\n  </label>\n</fieldset>\n```\n\n关于此代码的几点说明：\n\n*   你使用 `<fieldset>`\
  \ 标签将一组相关的表单字段组合在一起。\n*   你使用 `<legend>` 标签为父级 `fieldset`元素创建一个标题。图 5-3 显示了它在浏览器中的外观。\n\
  *   由于 `<input>` 标签被封装在它们各自的 `<label>` 标签中，用户可以通过点击复选框本身或点击其标签来选择或取消选择每个复选框。\n*\
  \   为了让每个复选框单独占一行，我在 `label` 元素的 CSS 中添加了 `display: block` 声明。查看第三本书的第 1 章 了解 `display`\
  \ 属性的工作原理。\n\n#### 使用单选按钮\n\n如果你想为用户提供一组相关选项，且每次只能选择其中一个，那么单选按钮（有时称为选项按钮）是最佳选择。表单单选按钮以两个或多个为一组聚集，该组内任何时候只能有一个按钮被选中。如果用户点击该组中的另一个按钮，它将被选中，而之前选中的按钮将变为未选中。\n\
  \n![一些复选框表单字段的截图，封装在带有 legend 元素的 fieldset 组中。](img/9781394164684-fg020503.png)\n\
  \n图 5-3： 一些复选框表单字段，封装在带有 `legend` 元素的 `fieldset` 组中。\n\n你使用以下 `<input>` 标签的变体创建一个单选按钮：\n\
  \n```html\n<input type=\"radio\" name=\"radioGroup\" value=\"radioValue\" [checked]>\n\
  ```\n\n*   `radioGroup`: 你想要赋予单选按钮组的名称。所有使用相同 `name` 值的单选按钮属于该组。\n*   `radioValue`:\
  \ 你想要赋予单选按钮的值。如果在提交表单时该单选按钮被选中，则将发送此值。\n*   `checked`: 当此可选属性存在时，单选按钮初始为被选中状态。\n\
  \n这里有一个示例，图 5-4](#c09.xhtml_c09-fig-0004) 显示了发生了什么（`bk02ch05/example03.html`）：\n\
  \n```html\n<fieldset>\n  <legend>选择配送方式</legend>\n  <div>\n    <input type=\"radio\"\
  \ id=\"carrier-pigeon\" name=\"delivery\" value=\"pigeon\">\n  </div>\n  <div>\n\
  \    <input type=\"radio\" id=\"pony\" name=\"delivery\" value=\"pony\" checked>\n\
  \    <label for=\"pony\">马</label>\n  </div>\n  <div>\n    <input type=\"radio\"\
  \ id=\"snail\" name=\"delivery\" value=\"snail\">\n    <label for=\"snail\">蜗</label>\n\
  \  </div>\n  <div>\n    <input type=\"radio\" id=\"some-punk\" name=\"delivery\"\
  \ value=\"bike\">\n    <label for=\"some-punk\">朋克</label>\n  </div>\n</fieldset>\n\
  ```\n![单选按钮字段截图](img/9781394164684-fg02504.png)\n\n#### 添加选择列表\n\n选择列表在表单中很常见，因为它们允许用户进行选择。创建列表容器，你使用\
  \ `<select>` 标签：\n\n```html\n<select name=\"selectName\"\n```\n\n*   `selectName`:\
  \ 你想要赋予选择列表的名称。\n*   `size`: 列表中可见的行数。如果省略此值，浏览器将以下拉框的形式显示列表。\n*   `multiple`: 当此属性存在时，允许选择多个选项。\n\
  \n对于列表中的每一项，你在 `<select>` 和 `</select>` 标签之间添加一个 `<option>` 标签：\n\n```html\n<option\
  \ value=\"optionValue\"\n```\n\n*   `optionValue`: 你想要赋予列表选项的值。\n*   `selected`:\
  \ 当此可选属性存在时，该列表选项初始为被选中。\n\n这里是一些示例（`bk02ch05/example04.html`）：\n\n```html\n<form>\n\
  \  <div>\n    <label for=\"hair-color\">选择你的发色:</label>\n    <select id=\"hair-color\"\
  \ name=\"hair-color\">\n      <option value=\"black\">黑色</option>\n      <option\
  \ value=\"blonde\">金色</option>\n      <option value=\"brunette\" selected>棕色</option>\n\
  \      <option value=\"red\">红色</option>\n      <option value=\"neon\">荧光色</option>\n\
  \      <option value=\"none\">无</option>\n    </select>\n  </div>\n  <div>\n   \
  \ <label for=\"hair-style\">选择你的发型：</label>\n    <select id=\"hair-style\" name=\"\
  hair-style\" size=\"4\">\n      <option value=\"bouffant\">蓬头</option>\n      <option\
  \ value=\"mohawk\">莫霍克</option>\n      <option value=\"page-boy\">少年头</option>\n\
  \      <option value=\"permed\">波波头</option>\n      <option value=\"shag\">碎发</option>\n\
  \      <option value=\"straight\" selected>直发</option>\n      <option value=\"none\"\
  >发型？什么发型？</option>\n    </select>\n  </div>\n  <div>\n    <label for=\"hair-products\"\
  >过去一年使用的产品：</label>\n    <select id=\"hair-products\" name=\"hair-products\" size=\"\
  5\" multiple>\n      <option value=\"gel\">发胶</option>\n      <option value=\"grecian-formula\"\
  >古腊发水</option>\n    </select>\n  </div>\n</form>\n```\n\n\n\n\n\n```html\n<option\
  \ value=\"mousse\">Mousse</option>\n\n<option value=\"peroxide\">Peroxide</option>\n\
  \n<option value=\"shoe-black\">Shoe black</option>\n\n</select>\n\n</div>\n\n</form>\n\
  ```\n\n这里有三个列表（请参考 图 5-5）：\n\n*   `hair-color`: 此列表未指定大小，因此浏览器将其显示为下拉列表。\n*   `hair-style`:\
  \ 此列表使用的 `size` 值为 `4`，因此列表中可见四个选项。\n*   `hair-products`: 此列表使用的 `size` 值为 `5`，因此列表中可见五个选项。此外，还设置了\
  \ `multiple` 属性，因此你可以在列表中选择多个选项。\n\n![选择列表示例的截图。](img/9781394164684-fg020505.png)\n\
  \n图 5-5： 选择列表的示例。\n\n#### 引入选择器\n\nHTML 还提供了许多其他 `<input>` 标签类型，我将它们归为“选择器”（pickers），这意味着在每情况下，字段都会显示一个按钮，点击后会打开一个允许用户选择某个值的控件。以下是可用选择器的快速览：\n\
  \n*   `color`: 打开颜色选择器对话框，允许用户选择颜色。颜色选择器取决于不同的浏览器和操作系统；图 5-6 显示了 Mac 版 Google Chrome。设置\
  \ `#rrggbb` 格式的 `value` 属性来指定初始颜色（默认为黑色：`#000000`）。这是一个示例 (`bk02ch05/example05.html)：\n\
  \n    ```html\n    <input type=\"color\" name=\"bg-color\" value=\"#4f5392\">\n\
  \    ```\n\n*   如果你觉得文本 `#rrggbb` 对你没有意义，不用担心：我将在第三本书 第 6 章 中详尽地解释它。![Mac 版 Google\
  \ Chrome 中出现的颜色选择器截图。](img/9781394164684-fg020506.png)\n\n    图 5-6： Mac 版 Google\
  \ Chrome 中出现的颜色选择器。\n\n*   `date`: 打开日期选择器对话框，让用户可以选择日期。图 5-7 显示了 Microsoft Edge\
  \ 版本。设置 `yyyy-mm-dd` 格式的 `value` 属性来指定初始日期。注意，用户看到的日期可能使用不同的格式（例如 图 5-7 所示所示 `mm/dd/yyyy`），但元素返回的值始终是\
  \ `yyyy-mm-dd` 格式。这是一个示例 (`bk02ch05/example06.html`)\n\n    ```html\n    <input\
  \ type=\"date\" name=\"appt-date\" value=\"2023-08-23\">\n    ```\n\n    ![Microsoft\
  \ Edge 中出现的日期选择器截图。](img/9781394164684-fg020507.png)\n\n    图 5-7： Microsoft Edge\
  \ 中出现的日期选择器。\n\n*   `file`: 显示一个“选择文件”按钮（请参考 图 5-8），点击后会打开用户操作系统的文件选择器对话框，以便用户可以选择文件。你可以添加\
  \ `multiple` 属性来允许用户选择多个文件。这是一个示例 (`bk02ch05/example07.html`)：\n\n    ```html\n\
  \    <input type=\"file\" name=\"user-photo\">\n    ```\n\n    ![Chrome 中出现的日期选择器截图。](img/9781394164684-fg020508.png)\n\
  \n    图 5-8： Chrome 中出现的日期选择器。\n\n*   `month`: 打开月份选择器对话框（请参考 图 5-9），允许用户选择月份和年份。设置\
  \ `yyyy-mm` 格式的 `value` 属性来指定初始月份和年份。用户看到的数值可能是不同的格式（例如 `August 2023`），但元素返回的值始终是\
  \ `yyyy-mm` 格式。这是一个示例 (`bk02ch05/example08.html`)：\n\n    ```html\n    <input type=\"\
  month\" name=\"birthday-month\" value=\"2023-08\">\n    ```\n\n    ![Microsoft Edge\
  \ 中出现的月份选择器截图。](img/9781394164684-fg020509.png)\n\n    图 5-9： Microsoft Edge 中出现的月份选择器。\n\
  \n\n\n\n\n![Remember](img/remember.png) 在在线讨论和文章中，accessibility（无障碍）通常缩写为 `a11y`：即字母\
  \ `a` 后面跟着数字 `11`，然后是字母 `y`。为什么是 11？因为在 `accessibility` 这个单词中，`a` 和 `y` 之间有 11 个字母。此外，`a11y`\
  \ 看起来像单词 `ally`，这强调了一个观点：任何实现无障碍功能的人都是残障人士的盟友。\n\n## 无障碍带来的其他好处\n\n我相信，让你的网页对所有人开放在道德和伦理上都是正确的，这应该是你所需的全部动力。然而，让页面具有无障碍性确实会带来其他好处。\n\
  \n例如，考虑到无障碍构建的页面也是对搜索引擎友好的页面，这意味着你的无障碍页面在搜索结果中的排名将高于类似的非无障碍页面。\n\n无障碍页面也为非残障群体提供便利，例如那些关闭图片进行上网的人，或者必须应对极慢网速的人。\n\
  \n最后，为实施无障碍设计提供商业理由很容易的：\n\n*   **无障碍让你即刻进入巨大的市场：** 根据世界卫生组织的数据，约有 13 亿人患有某种形式的严重残疾，估计这\
  \ 13 多亿人的消费能力超过了 6 万亿美元。那可是一个惊人的零！如果你想在你的网站上销售产品，为什么要排除如此巨大的市场份额呢？\n*   **无障碍可能是法律要求的做法：**\
  \ 在许多司法管辖区，商业网站无法提供访问服务现在是非法的。大多数国家都有政策，要求企业为所有人提供平等机会。如果你的业务网站具有全球影响力，未能使网站无障碍化将使你的公司面临巨大的法律风险。\n\
  *   **无障碍让你形象良好：** 让你的业务页面对所有人开放可以营造好感，为你的品牌增色，并让你成为解决方案的一部分而不是问题的一部分。\n\n![Remember](img/remember.png)\
  \ 无论是什么促使你让页面变得无障碍，都是棒的。然而，重要的是，让你的网站对百分之百的访问者实现百分之百无障碍虽然可能是一个高尚且值得的目标，但从实践上来说，几乎是不可能的，接下来的章节将解释这一点。\n\
  \n## 理解网络无障碍\n\n必须在页面上添加功能以实现无障碍难道不是一种负担吗？不，完全不是。只要你从一开始就考虑到平等访问来构建页面，那么整合无障碍功能对你来说只需要极少的精力。\n\
  \n正如你在本章后面部分看到的，网络无障碍的实现并不困难或繁重。或者，我应该说，如果你理解了谁需要无障碍功能以及他们为什么需要，以及残障人士使用哪些类型的辅助技术，那么实现并不困难或繁重。接下来的几节告诉你你需要的所有信息。\n\
  \n### 理解谁需要无障碍服务\n\n如今对网络创新的主要抱怨之一是，网页开发者正在构建仅解决开发者自己问题的应用程序和服务。外卖、送货上门和宠物照顾上门服务只是许多例子之一。这里的问题在于，认为如果我有一个需要解决的问题，世界上其他人也一定想解决这个问题。从更广泛地说，这些应用程序是网页开发者假设每个使用网站的人基本上和开发者完全一样的例子。\n\
  \n要真正*理解*无障碍，第一步是深刻理解一个简单的事实：\n\n*你的用户不是你*。\n\n特别是，访问你网站的人中，比例惊人的部分（估计在 5%到 20%之间）将以不同程度带有某种形式的残疾生活。\n\
  \n我指的是哪种类型的残疾？规划无障碍意味着要考虑以下情况：\n\n*   **视觉：** 包括全盲或部分盲、、色盲和视力下降。\n*   **听觉：** 包括全聋或部分耳聋、听力困难、无法听见某些频率的声音以及耳鸣。\n\
  *   **运动：** 包括无法使用鼠标等指向设备、活动受限、缺乏精细的动作控制、过度颤抖或抖动，以及反应迟钝或响应时间缓慢。\n*   **认知：** 包括学习障碍、注意力问题、记忆力受损和极易分心。\n\
  \n在每种情况下，残疾可能是出生时就有的，也可能是通过疾病或创伤引起的。然而，同样重要的是，这些残疾中的一个或多个可能仅仅是年龄老化的结果。不再是“活力小鸡”（甚至不是夏天的小鸡了）的人可能会出现视力下降、部分或完全耳聋、运动控制能力下降以及轻度到重度的认知障碍。由于我们的人口（除少数例外外）正在老龄化，带着某种形式残疾上网的人数只会增加。\n\
  \n### 学习用于上网的辅助技术\n\n知道许多访问你页面的人会有各种类型的残疾是一回事。然而，除非你还知道这种残疾如何改变这些人的网络体验，否则这些知识对你没有太大帮助。视力有限的人如何“阅读”网页？无法控制鼠标的人如何“点击”链接？\n\
  \n这些以及类似问题的答案是，大多数残障人士使用某种形式的软件或硬件工具来帮助他们浏览、阅读、导航和与网页进行交互。这些工具属于*辅助技术*（AT）的范畴，了解残障人士所求助于的工具，对于帮助你设计无障碍的网页至关重要。\n\
  \n#### 针对视觉障碍的辅助技术\n\n视力有限的人使用各种辅助技术来让屏幕元素更容易看：\n\n*   **屏幕放大器：** 放大屏幕部分的硬件设备或软件程序。Windows\
  \ 提供放大器程序；macOS 具有缩放功能。\n*   **网页浏览器的缩放功能：** 所有主流浏览器都提供缩放整个面的命令。\n*   **自定义浏览器字体大小：**\
  \ 所有主流浏览器都允许用户设置自定义字体大小。\n\n#### 针对听觉障碍的辅助技术\n\n听力不佳的人经常使用特殊的耳机或助听器来增强声音输入。然而，对于聋人或近乎聋的人来说，你可以做几项措施：\n\
  \n*   如果你的页面有视频内容，视频应该包含开启字幕的功能。\n*   如果你的页面有音频内容，你应该提供一个指向音频转录文本的链接。\n\n#### 针对运动障碍的辅助技术\n\
  \n\n\n\n\n一些患有严重运动障碍的人只能通过头部指针设备浏览网页（或使用任何计算机功能）。然而，对于大多数运动障碍人士来说，主要的障碍问题是他们缺乏足够的控制力来操作鼠标或触控板。相反，他们依赖键盘与网页交互，因此你的页面需要支持通过键盘输入进行导航。请参见本章后后的“让你的页面对键盘友好”。\n\
  \n### 针对认知障碍的辅助技术\n\n某些患有特定类型认知障碍的人使用软件工具来帮助他们专注于当前任务。你也可以设置你的网页来帮助人们集中注意力并避免不必要的混淆：\n\
  \n*   不要为了炫酷而给页面添加各种花哨。保持你的页面设计尽可能简单。\n*   保持所有页面中导航和布局的一致性。\n*   为填写表单等任务提供清晰、简洁的说明。\n\
  *   尽可能遵循 Web 惯例，例如使用带下划线的链接文本。\n\n## 让你的页面结构具有可访问性\n\n到目前，提高网页可访问性最简单的方法是将可访问性直接构建到\
  \ HTML 结构中。这是否意味着要经历许多新关卡并学习许多新标签和属性？并不是。恰恰相反：它实际上意味着使用标题和语义化分段元素，就像我在书中早期讨论使用它们的方式一样（参见第二本书，第\
  \ 1 章）。\n\n### 分级化使用标题\n\n屏幕阅读器用户通常通过导航标题来感知页面的结构。为了帮助这类用户，你应该首先确保你的标题在朗读时是有意义的，并准确描述后续章节的内容。你还应该以符合其内置层级的方式使用标题：\n\
  \n*   每个页面仅使用一个 `h1` 元素：该 `h1` 元素应该是页面标题。\n*   使用 `h2` 作为标题：对于页面上的所有主标题，请使用 `h2`\
  \ 元素。\n*   使用 `h3` 作为子标题，依此类推：在每个 `h2` 元素内部，主要的子标题应该是 `h3` 元素。同样，在 `h3` 内部，主要的子子标题应该是\
  \ `h4` 元素；在 `h4` 内部，主要的子子子标题应该是 `h5` 元素；在 `h5` 内部，主要的子子子子标题应该是 `h6` 元素。\n*   不要跳跃标题：不要仅仅因为你觉得想这样做或更喜欢文本的外观，就从\
  \ `h2` 直接跳到 `h4`（参见下一项）。\n*   不要为了装饰目的而使用标题：不要仅仅因为你需要加粗效果或你喜欢该标题字体的大小就使用标题。那是 CSS\
  \ 要的工作。\n\n### 使用语义化分段元素\n\n你完全可以只用带样式的 `div` 元素来构建页面（而且令人震惊的 Web 编码人员正是这么做的！），但结果不仅混乱且缺乏结构，而且是一场可访问性的噩梦。为什么呢？因为屏幕阅读器或其他辅助技术可以说没有什么可以“抓取”。当然，它仍然会朗读（或处理）页面内容，但将没有任何上下文。\n\
  \n幸运的是，使用语义化分段元素（如 `header`、`nav`、`main`、`article` 和 `footer`）来构建页面并不会额外消耗时间，我在第二本书第\
  \ 1 章中讨论过这些。这种方法不仅为页面布局提供了欢迎的结构，还免费带给了你可访问性，因为这些所谓的“地标”有助于辅助技术理解页面，屏幕阅读器会将底层的语义含义作为朗读内容的一部分。\n\
  \n例如，当屏幕阅读器遇到 `nav` 元素时，它通常会说“导航（navigation）”，当它遇到 `header` 元素时，它通常会说“横幅（banner）”。\n\
  \n## 让文本具有可访问性\n\n几乎所有的网页都是文本，如果你能让文本具有可访问性，那么你在让页面可访问性方面就迈了一大步。这里有一些需要注意的点：\n\n\
  *   不要对字体大小使用绝对测量单位：视力困难的人在浏览网页之前可能做的第一件事就是为浏览器自定义更大的默认字体大小。如果你使用像像素（pixels）这样的绝对测量单位对文本设置样式，你就会覆盖了那个更大的默认值。你会突然变得那个人以及所有其他费力调整浏览器文本的人极度不受欢迎。可访问的文本应从使用相对测量单位（如\
  \ `em` 或 `rem`）的字体大小开始。（对这些感到困惑吗？别担心：我在第三本书第 5 章中将以近乎痛苦的细节详尽介绍 CSS 测量单位。）\n*   确保文本是可读的：不要让你的文本小得离谱，并确保文本颜色与背景颜色之间有足够的对比（参见本章后后的“确保足够的色彩对比”）。\n\
  *   让链接文本具有描述性：对于页面上的每个链接，链接文本都应该描述链接另一侧的内容。屏幕阅读器会读出链接文本，如果你的链接只说“点击”或“点击此处”，你并没有告诉访客任何关于链接去向何处的有用信息。\n\
  \n    这样做：\n\n    `<a href=\"kumquats.html\">了解更多关于金橘的信息</a>`\n\n    不要这样做：\n\n\
  \    `要了解更多关于金橘的信息，请<a href=\"kumquats.html\">点击这里</a>`\n\n*   除非，否则不要隐藏文本：可以使用\
  \ CSS 或 JavaScript 临时隐藏不需要显示的文本。例如，你可以创建一个标签页，其中一个标签的内容可见，而其他标签的内容不可见。\n\n## 让媒体具有可访问性\n\
  \n网页文本本质上是具有可访问性的，因为屏幕阅读器默认会朗读它们，只要你稍加留意就能为视力不佳的人提供帮助。遗憾的是，这种特性并不适用于网页媒体，包括图像、视频和音频片段。这些元素更难实现可访问，但你仍然可以做很多来确保所有的访客都能享受页面元素。\n\
  \n### 为图像指定 alt 文本\n\n为了帮助视障用户或关闭图片浏览的用户，你可以使用 `img` 标签的 `alt` 属性为页面上的每张重要图像提供描述。对于视障人士，屏幕阅读器会朗读每个\
  \ `img` 标签的 `alt` 属性值，因此重要的或结构性的图像应包含简短描述：\n\n`<img src=\"twitter.png\" alt=\"指向\
  \ Twitter 的图标\">`\n\n关于编写有效的 alt 文本，这些建议：\n\n*   保持简洁。冗长的描述通常不需要或没用。\n*   直接说明图像代表的内容。\n\
  *   包含有意义的细节。在这里，“有意义”意味着与上下文或周围文本相关。\n*   不要重复周围文本已经包含的信息。\n*   对于纯装饰性的图像，不需要添加\
  \ `alt` 值，但必须包含 `alt` 标签（设置为空字符串：`alt=\"\"`），否则你的 HTML 代码将无法验证。\n\n\n\n\n\n- **视频内容：**\
  \ 视力障碍的用户无法看到通过 `video` 元素传递的内容，而听力障碍的用户无法听见 `video` 元素的音频轨道。对于后者，应该提供视频音频轨的转录文本。对于前者，你的视频应该带有在播放时显示的闭路字幕（closed\
  \ captions）或字幕（subtitles）。\n\n在视频播放时显示字幕的方法是创建一个 Web 视频文本轨道（WebVTT）文件，这是一个包含时间标记和在这些标记期间显示的文本的文本文件。\n\
  \n![Tip](img/tip.png) 构建 WebVTT 文本文件非常简单，但这超出了本书的范围。幸运的是，Mozilla 开发者网络对该格式有极佳的描述：[`https://developer.mozilla.org/en-US/docs/Web/API/WebVTT_API`](https://developer.mozilla.org/en-US/docs/Web/API/WebVTT_API)\n\
  \n在你拥有 WebVTT 文件（使用 `.vtt` 扩展名）后，你可以使用 `track` 元素让浏览器知道该文件可供 `video` 元素使用：\n\n```\n\
  <track kind=\"type\" src=\"filename\">\n```\n\n- `kind`: 指定轨道的类型。对于 `value`，你可以使用以下任何一个关键字：`subtitles`（默认值）、`captions`（说明字幕）、`descriptions`（视频内容的描述）或\
  \ `chapters`（仅章节标题）。\n- `src`: WebVTT 文件的文件名（如果文件位于存储 HTML 文件的其他目录，则包含路径）。\n\n你将\
  \ `<track>` 标签插入 `<video>` 和 `</video>` 标签之间，如下：\n\n```html\n<video src=\"/media/videos/kumquats.mp4\"\
  \ controls>\n  <track kind=\"captions\" src=\"/media/cc/kumquats-captions.vtt\"\
  >\n</video>\n```\n\n## 增强页面的可访问性语义\n\n每当你戴上“可访问性”帽子时，对于页面上的每个元素，你需要问自己的关键问题之一是：“辅助技术可能需要了解该元素的什么？”也就是说，你需要提供什么信息，以便屏幕阅读器或类似的辅助技术（AT）确定该元素的用途？\n\
  \n换句话说，你想要让每个元素的*含义*变得清晰，而你提供的关于每个元素含义的信息被称为*可访问性语义*（accessibility semantics）。在接下来的几个章节中，我将介绍增强页面可访问性语义的几种方法。\n\
  \n### 添加表单字段标签\n\n在第二本书的第 5 章中，我提到了 `label` 元素，你可以用它将文本标签或说明与表单字段关联。你可以使用两种方法：\n\
  \n- **隐式标签：** 用 `<label>` 和 `</label>` 标签包围表单字段，并在字段之前之后插入标签文本。这是一个示例：\n\n```html\n\
  <label>\n  最喜欢的蔬菜:\n  <input type=\"text\">\n</label>\n```\n\n- **显式标签：** 在字段标签中插入一个\
  \ `id` 值，将 `<label>` 标签的 `for` 属性设置为相同的值，并在 `<label>` 和 `</label>` 标签之间插入标签文本。例如：\n\
  \n```html\n<label for=\"fave-veg\">最喜欢的蔬菜:</label>\n<input id=\"fave-veg\" type=\"\
  text\">\n```\n\n添加 `<label>` 标签提供了两个可访问性方面的优势：\n\n- 它允许用户通过点击标签来选择字段。这增加了点击目标区域，有助于手部不稳的用户。\n\
  - 标签文本现在与字段关联，这意味着当用户选择字段时，屏幕阅读器将读出标签文本。\n\n确保为每个 `<input>` 标签以及每个 `<select>` 和\
  \ `<textarea>` 标签添加标签。\n\n### 理解 ARIA 角色、状态和属性\n\n万网联盟（W3C）是 Web 可访问性倡议（WAI）的所在地，该倡议旨在让\
  \ Web 成为所有人都可以的地方。WAI 的关键技术之一是可访问富交互应用程序（ARIA），它是一系列角色、状态和属性的集合，旨在为网页用户界面的每个元素提供可访问性语义：\n\
  \n- **ARIA 角色（role）：** 定义页面元素代表什么类型的用户界面控件的关键字。例如，如果你编写了一个 `div` 元素使其看起来和操作像一个命令按钮，那么该元素的角色就是\
  \ `button`。你使用 `role` 属性为元素分配角色，如下：\n\n```html\n<div role=\"button\">应用更改</div>\n\
  ```\n\n- **ARIA 属性（property）：** 描述用户界面控件某些方面的值。例如，如果你想在可编辑的 `div` 元素中包含占位符文本，可以通过\
  \ `aria-placeholder` 属性让辅助技术知道占位符：\n\n```html\n<div contenteditable role=\"textbox\"\
  \ aria-placeholder=\"user@domain.com\"></div\n```\n\n- **ARIA 状态（state）：** 指定用户界面控件当前状态的键盘或值。例如，如果你的\
  \ Web 应用使用 `div` 元素作为开关，但该元素目前被禁用，你可以通过将 `aria-disabled` 属性设置为 true 向辅助技术信号该禁用状态：\n\
  \n```html\n<div role=\"switch\" aria-disabled=\"true\"></</div>\n```\n\nARIA 角色主要分为三类：\n\
  \n- 地标性角色（Landmark roles）\n- 区域结构角色（Section structure roles）\n- 组件角色（Widget roles）\n\
  \n有三类 ARIA 角色：\n\n- 地标性角色\n- 区域结构角色\n- 组件角色\n\n![Remember](img/remember.png) 我将讨论这些类别中的每种角色。但重要的是，如果你使用了语义化的\
  \ HTML 元素，就不需要使用 ARIA 角色。例如，`<button>` 元素具有隐式的 `button` 角色，所以不需要在其中包含 `role=\"button\"\
  `。参见[`https://developer.mozilla.org/en-US/docs/Web/Accessibility/Roles/`](https://developer.mozilla.org/en-US/docs/Web/Accessibility/Roles/)\
  \ 获取对 ARIA 角色的深入了解。\n\n#### 地标性角色（Landmark roles）\n\n*地标性* ARIA 角色识别页面的主要结构元素，辅助技术利用这些地标使用户能够快速导航页面的主要部分。表\
  \ 6-1 列出了地标角色及其对应的 HTML 语义元素。\n\n**表 6-1 地标 ARIA 角色**\n\n| ARIA 角色 | HTML 元素 |\n\
  | --- | --- |\n| `banner` | `header` |\n| `complementary` | `aside` |\n| `contentinfo`\
  \ | `footer` |\n| `form` | `form` |\n| `main` | `main` |\n| `navigation` | `nav`\
  \ |\n| `region` | `section` |\n| `search` | 无\n|\n\n`search` 角色没有等效的 HTML 元素，但大多数情况下会在\
  \ `form` 元素中使用它，如下：\n\n```html\n<form role=\"search\">\n  你的搜索控件在此\n</form>\n```\n\
  \n![Warning](img/warning.png) 地标角色（以及对应的 HTML 区域划分元素）的作用是为辅助技术提供一种“森林而非树木”的视图。因此，不要过度使用地标角色，否则你可能会面临页面看起来全是树的风险！\n\
  \n#### 区域结构 ARIA 角色（Section structure roles）\n\n*区域结构* ARIA 角色识别具有特定目的页面内容区域。大多数区域结构\
  \ ARIA 角色都有语义化的 HTML 元素，但有几个没有，我在表 6-2 中列出了它们。\n\n| ARIA 角色 | 描述 |\n| --- | ---\
  \ |\n| `feed` | 识别一个可滚动的项目列表，当用户滚动到列表底部时会添加新项目 |\n| `math` | 识别数学表达式 |\n| `none`（或\
  \ `presentation`） | 从辅助技术中隐藏元素的隐式 ARIA 角色 |\n| `note` | 识别与页面主主题相关的辅助内容区域 |\n| `toolbar`\
  \ | 识别一组旨在作为工具栏使用的控件区域 |\n\n\n\n\n\n| `tooltip` | 标识当用户将鼠标悬停在元素上或通过键盘为元素提供焦点时显示的文本\
  \ |\n\n## 表 6-2 无 HTML 等效项的区域结构角色\n\n表 6-3 列出了具有语义化 HTML 等效项的区域结构 ARIA 角色。在任何情况下，使用语义化\
  \ HTML 元素都比使用 ARIA 角色更好。\n\n| ARIA role | HTML 语义元素 |\n| --- | --- |\n| `article`\
  \ | `article` |\n| `cell` | `td` |\n| `definition` | `dfn` |\n| `figure` | `figure`\
  \ |\n| `heading` | `h1` 到 `h6` |\n| `img` | `img` 或 `picture` |\n| `list` | `ol`\
  \ 或 `ul` |\n| `listitem` | `li` |\n| `meter` | `meter` |\n| `row` | `tr` |\n| `rowgroup`\
  \ | `tbody`, `thead`, 或 `tfoot` |\n| `rowheader` | `th` |\n| `table` | `table` |\n\
  | `term` | `dfn` 或 `dt` |\n\n## 表 6-3 有 HTML 等效项的区域结构角色\n\n### 组件 ARIA 角色\n\n组件\
  \ ARIA 角色标识交互式用户界面元素。表 6-4 列出了这些没有语义化 HTML 等效项的组件 ARIA 角色。\n\n| ARIA role | 标识 |\n\
  | --- | --- |\n| `combobox` | 允许用户输入值或从列表中选择值的输入控制控件 |\n| `menu` | 允许用户从选项列表中选择某项的控件\
  \ |\n| `menubar` | 包含一组 `menu` 组件的控件 |\n| `scrollbar` | 控制视图内垂直或水平滚滚的页面对象 |\n| `searchbox`\
  \ | 专门用于输入搜索操作文本的文本框控件 |\n| `slider` | 允许用户从值范围内选择值的输入控制控件 |\n| `spinbutton` | 允许用户增加或减少某个值的输入控制控件\
  \ |\n| `switch` | 用户可以在“开启”和“关闭”状态之间切换的输入控制控件 |\n| `tab` | 选中时显示其关联的 `tabpanel`\
  \ 组件的控件 |\n| `tablist` | 包含一组 `tab` 组件的控件 |\n| `tabpanel` | 包含当前选中 `tab` 组件内容的控件\
  \ |\n| `tree` | 允许用户从分级结构集合中选择一个或多个项的组件 |\n| `treegrid` | `tree` 组件的表格版本 |\n| `treeitem`\
  \ | `tree` 组件中的某项 |\n\n## 表 6-4 无 HTML 等效项的组件角色\n\n某些组件 ARIA 角色也具有语义化 HTML 等效项，正如我在表\
  \ 6-5 中概述的那样。在任何情况下，使用语义化 HTML 元素都比使用 ARIA 角色更好。\n\n| ARIA role | HTML 语义元素 |\n\
  | --- | --- |\n| `button` | `button` |\n| `checkbox` | `input type=\"checkbox\"\
  ` |\n| `link` | `a` |\n| `option` | `option` |\n| `progressbar` | `progress` |\n\
  | `radio` | `input type=\"radio\"` |\n| `textbox` | `input type=\"text\"` |\n\n\
  ## 表 6-5 有 HTML 等效项的组件角色\n\n### 区分相同类型的语义化页面元素\n\n在尝试让代码适配屏幕阅读器时，你会遇到的问题之一是有多个相同类型的语义化页面元素。例如，你的页面可能有两个\
  \ `nav` 元素：一个在页面 `header` 中，另一个在页面 `article` 中，所示：\n\n```html\n<header>\n  <nav>\n\
  \    <h3>Site Navigation</h3>\n    Site navigation code goes here\n  </nav>\n</header>\n\
  <main>\n  <article>\n    <nav>\n      <h3>Article Navigation</h3>\n      Article\
  \ navigation code goes here\n    </nav>\n  </article>\n</main>\n```\n\n屏幕阅读器用户如何知道每个\
  \ `nav` 元素的作用？一种方案是遍历元素以查看每个元素包含的内容，这个过程既耗时又麻烦。更好的方法是在每个 `nav` 元素内部的 `h3` 元素添加 `id`\
  \ 属性，然后使用 `nav` 元素中使用 `aria-labelledby` 属性来指定关联标题的 id。这是更新后的示例：\n\n```html\n<header>\n\
  \  <nav aria-labelledby=\"site-navigation\">\n    <h3 id=\"site-navigation\">Site\
  \ Navigation</h3>\n    Site navigation code goes here\n  </nav>\n</header>\n<main>\n\
  \  <article>\n    <nav aria-labelledby=\"article-navigation\">\n      <h3 id=\"\
  article-navigation\">Article Navigation</h3>\n      Article navigation code goes\
  \ here\n    </nav>\n  </article>\n</main>\n```\n\n## 让你的页面对键盘友好\n\n许多残障用户缺乏使用鼠标的灵活性或能力，因此让你的页面对键盘友好至关重要。HTML\
  \ 默认提供了以下键盘支持：\n\n- 表单控件和链接是可导航的。\n- 所有其他 HTML 元素均不可导航。\n- 按 Tab 键会将焦点移动到下一个元素，其中“向前”是指元素出现的方向。\n\
  - 按 Shift+Tab 键会将焦点后移到上一个元素，其中“向后”是指元素在代码中出现的反向方向。\n- 对于具有多个组件的可导航元素——例如单选按钮组或选择列表——在用户将焦点置于元素后，用户可以通过箭头键导航内部的组件。\n\
  - 按空格键选中当前元素。例如，当按钮获得焦点时，按空格键等同于点击按钮；当复选框获得焦点时，按空格键会在选中（已勾选）和未选中（未勾选）状态之间切换复选框。\n\
  \n当你按下 Tab 时，页面元素接收焦点的顺序——意不意料——被称为*标签顺序*（tab order）。令人惊讶的是，标签顺序并不是固定不变的，这意味着既可以向其中添加元素，也可以移除元素。接下来的章节将细节。\n\
  \n**提示：** 提高网页键盘友好性的另一种方法是为用户界面控件分配快捷键。定义键盘快捷键属于 JavaScript 的范畴，所以我将该解决方案留给第 4 本第\
  \ 11 章。\n\n### 向标签顺序添加元素\n\n如果你坚持使用原生 HTML 元素，你可能不需要为了无障碍键盘访问做任何额外工作。但是，如果你有一个例如\
  \ `div` 或 `span` 元素想要通过按 Tab 或 Shift+Tab 来访问怎么办？没问题——只需在标签中放入 `tabindex=\"0\"`，如下：\n\
  \n```html\n<div role=\"tablist\" tabindex=\"0\">\n```\n\n当网络浏览器看到标签内部有 `tabindex=\"\
  0\"` 时，它会自动将该元素添加到标签顺序中，因此用户将能够 Tab 或 Shift+Tab 导航到该元素。这有多棒吗？\n\n### 从标签顺序中移除元素\n\
  \n偶尔，你可能会得到一个不希望出现在标签顺序中的可导航页面元素。例如，如果一个元素被禁用了，那么就没有必要让用户通过 Tab 或 Shift+Tab 导航到它。\n\
  \n\n\n\n\n要从制表顺序中移除元素，请在元素的标签中插入 `tabindex=\"-1\"`，如下所示：\n\n```html\n<button tabindex=\"\
  -1\">\n无法触碰这里\n</button>\n```\n\n当 浏览器在标签内部遇到 `tabindex=\"-1\"` 时，它会将该元素从制表顺序中移除，因此按下\
  \ `Tab` 或 `Shift+Tab` 的用户将直接跳过它。\n\n## 确保足够的色彩对比\n\n对于这些人——即使是视力良好的人——如果文本颜色与背景颜色之间没有足够的对比，阅读网页文本时就会遇到困难。例如，如今非常常见的一种现象是在在稍浅一点的灰色背景上使用浅灰色文字（参见图\
  \ 6-1，左侧），或在稍深一点的灰色背景上使用深灰色文字（参见图 6-1，右侧）。有些网页设计师认为这很“酷”，但我们其他人可能会用更尖锐的词汇来描述它。\n\
  \n![浅色背景上的浅色文字（左侧）和深色背景上的深色文字（右侧）的截图](img/9781394164684-fg020601.png)\n\n图 6-1：\
  \ 浅色背景上的浅色文字（左侧）和深色背景上的深色文字（右侧）。\n\n承认，图 6-1 中的例子确实有些极端，但不应该认为仅仅因为你能轻松阅读你的文本，每个人都能读得一样轻松。许多有视觉障碍或视力衰老的人在阅读看起来比背景颜色不够深或不够亮的文本时会遇到困难。\n\
  \n那么，你如何知道选择的前景颜色和背景颜色是否有足够的色彩对比度呢？你可以参考一种名为 `contrast ratio`（对比率）的测量方法，它将一种颜色的色调和亮度与另一种颜色的进行对比。结果是一个大于等于一的数字，具有以下属性：\n\
  \n* 数字越小，两种颜色之间的对比度越低。\n* 数字越大，两种颜色之间的对比度越高。\n* 对比率为 `1` 意味着两种颜色相同（或足够相同）。\n\n好了，什么是*足够*的色彩对比度呢？全球网页无障碍专家们规定，你应当的目标是达到\
  \ `4.5` 或更高的色彩对比率。幸运的是，你不需要自己去计算对比率。相反，你可以使用一个名为 `WebAim` (Web Accessibility In\
  \ Mind) 对比检查器的在线工具，可以在此处访问：\n\n[`https://webaim.org/resources/contrastchecker/`](https://webaim.org/resources/contrastchecker/)\n\
  \n在“前景颜色”和“背景颜色”框中，可以输入 RGB 十六进制颜色代码或点击颜色色块选择颜色。页面会立即输出对比率（参见图 6-2）。\n\n![使用 WebAIM\
  \ 对比检查器查找任意两种颜色之间对比率的截图](img/9781394164684-fg020602.png)\n\n图 6-2： 使用 WebAIM 对比检查器查找任意两种颜色之间的对比率。\n\
  \n![提示](img/tip.png) 要了解“RGB 十六进制颜色代码”到底意味着什么，请参见第三本书，第 6 章。\n\n## 验证网页的无障碍性\n\n\
  我在本章中讨论的所有无障碍调整似乎需要记录很多内容。如果我漏掉了某些内容呢？这是一个合理的担忧，但网页可以提供帮助。一旦你的页面发布到网上，你可以访问网页无障碍评估工具\
  \ (WAVE) 来检查其无障碍性，地址为 [`http://wave.webaim.org`](http://wave.webaim.org)，所示于图 6-3。\n\
  \n![网页无障碍评估工具的截图将告诉你你的页面是否存在任何无障碍方面的错误](img/9781394164684-fg020603.png)\n\n图 6-3：\
  \ 网页无障碍评估工具将告诉你的页面是否存在任何无障碍方面的错误。\n\n将你的网页地址粘贴到文本框中并按下 `Enter/Return`，即可查看包含以下内容的报告：\n\
  \n* 缺失的语义化元素\n* 跳过的标题层级\n* 字体过小的文本\n* 色彩对比率过低\n\n第三本书\n\n## 学习 CSS 基础\n\n### 内容概览\n\
  \n1. 第 1 章：理解 CSS 盒模型\n    1. 跳出“盒模型”进行思考（也要从“盒模型”内部思考）\n    2. 关于空白的简短插叙\n    3.\
  \ 添加内边距\n    4. 为它加上边框\n2. 第 2 章：认识选择器\n    1. 进入页面\n    2. 选择器到底是什么\n    3. 学习标准选择器\n\
  \    4. 选择后代、子元素和兄弟元素\n    5. 通过属性选择元素\n3. 第 3 章：伪类和伪元素\n    1. 研究伪类\n    2. 熟悉伪元素\n\
  4. 第 4 章：理解 CSS\n    1. 为代码注释\n    2. 使用 CSS 重置\n    3. 调试 CSS\n    4. 揭秘内部：样式是如何应用的\n\
  5. 第 5 章：衡量 CSS\n    1. 熟悉 CSS 单位\n    2. 查看绝对单位\n    3. 认识相对单位\n    4. 视口单位\n \
  \   5. 使用 CSS 计算\n6. 第 6 章：用色彩和背景美化网页\n    1. 在 CSS 中指定颜色\n    2. 使用色彩装饰文本\n   \
  \ 3. 设置元素背景\n    4. 用渐变惊艳众人\n    5. 设置边框颜色\n    6. 在开发工具中玩转色彩\n7. 第 7 章：用网页排版提升文本水平\n\
  \    1. 照顾好文本\n    2. 排版三剑客：设置字号、行高和行长度\n    3. 应用文本样式\n    4. 更多排版技巧\n    5. 为你的链接新装\n\
  \    6. 调整对齐方式\n\n\n\n\n\n我不打算对你撒谎：当你刚开始学习 CSS 时，页面上的元素有时会完全违背你的每一条指令。它们就像脾气暴躁的青少年，忽视你最好的建议，并拒绝理解你才是——或者说本该是——它们的老板。好吧，我确实对你撒了一点小谎：这种情况甚至会发生在经验丰富的网页编码员身上。为什么会有这种态度呢？因为虽然网页浏览器是浏览网页的优秀软件，但默认情况下，它们并不非常擅长布局网页。它们就像过度溺爱的的祖父母，直接让页面元素随心所欲。你作为父母——呃，我的意思是，作为网页开发者的任务是给页面引入一些纪律。\n\
  \n幸运的是，CSS 提供了大量的工具和技术，你可以利用它们来让顽固的页面元素乖听话。这些工具和技术构成了本书的大部分，也是第 2 卷](#p02.xhtml)、第\
  \ 5 章](#p05.xhtml)和第 6 章的主题。但你作为 CSS 开发人员所做的几乎所有工作都会以某种方式涉及（或影响）CSS 盒模型，而这正是你在本章中深入探讨的主题。盒模型对于\
  \ CSS 中的几乎所有内容都是如此基础，以至于你应该将本章视为书中几乎所有其他 CSS 主题的基石。\n\n### 跳出（也要在内部）盒模型进行思考\n\n\
  每个网页由一系列 HTML 标签组成，每个标签都代表页面上的一个元素。在名为“样式表之地”（Style Sheet Land）的奇特且极客的世界里，这些每个元素都被认为周围都有一个不可见的盒子（好吧，这是一个非常奇怪的世界）。这听起来可能不是什么大不了，但这些盒子是通往\
  \ CSS 精通的王道。\n\n#### 理解盒模型的组件\n\n图 1-1 显示了上述不可见盒子在抽象状态下的样子，图 1-2 显示了一个真实的页面元素。\n\
  \n![CSS 盒模型组件的示意图。](img/9781394164684-fg030101.png)\n\n图 1-1： CSS 盒模型的组件。\n\n![应用于实际页面元素的\
  \ CSS 盒模型示意图。](img/9781394164684-fg030102.png)\n\n图 1-2： 应用于实际页面元素的 CSS 盒模型。\n\n\
  图 1-1 和 1-2 显示了以下盒子组件：\n\n*   **内容 (Content):** 盒子内部的东西，如文本、链接、列表、图像和视频。换句话说，你页面中所有盒子的内容无非你添加到页面上的实际内容。内容区域的四边——即它的顶、左、底、右边缘——定义了\
  \ `content box`（内容盒）。\n*   **内边距 (Padding):** 环绕内容的空间。也就是说，它是内容外部、但边框（下文将讨论）内部的空间。参考本章后部分的“添加内边距”了解更多关于调整内边距的内容。内边距区域的四边定义了\
  \ `padding box`（内边距盒）。\n*   **边框 (Border):** 环绕内边距的空间。也就是说，它是内边距外部、但外边距（下文将讨论）内部的空间。参考本章后部分的“添加边框”详细查看如何使用\
  \ CSS 操纵边框。边框的四边定义了 `border box`（边框盒）。\n*   **外边距 (Margin):** 环绕边框的空间。也就是说，它是边框外部的空间。外边距的四边定义了\
  \ `margin box`（外边距盒）。\n\n注意，内边距、边框和外边距都是“可选的”，这意味着你可以 CSS 规则将它们缩小到零。此外，内边距盒、边框盒和外边距盒的顶、左、底、右边缘都有对应的\
  \ CSS 属性供尝试。\n\n#### 理解块级和行内级盒子\n\n你可能想认为这些不可见盒子只包围块级元素，即那些开启新文本段落的元素：`p`、`blockquote`、`h1`\
  \ 到 `h6`、`div`、所有页面布局语义标签（如 `header`、`article` 和 `section` 等）。这很有道理，但实际上每一个标签，即使是像\
  \ `a` 和 `span` 这样的行内元素，周围也有一个盒子。因此，最后你处理的始终是两种类型的盒子：\n\n*   **块级盒子 (Block boxes):**\
  \ 这种类型的盒子在网页上的渲染具有以下特征：\n    *   盒子从新的一行开始。\n    *   如果你不为盒子设置宽度，它将填充其父元素的整个水平空间。\n\
  \    *   如果你设置了盒子的宽度和高度，这些属性就会生效。\n    *   增大盒子内边距、边框和外边距尺寸会导致周围元素被推开。\n    *  \
  \ 根据定义，块级盒子的 `display` 属性为 `block`：\n    ```css\n    display: block;\n    ```\n\
  *   **行内级盒子 (Inline boxes):** 这种类型的盒子在网页上的渲染方式如下：\n    *   盒子与内容一同流动。\n    *   盒子的宽度仅与内容等宽。\n\
  \    *   如果你设置盒子的宽度和高度，这些属性无效。\n    *   增大垂直内边距、边框和外边距对周围元素没有影响。\n    *   根据定义，行内级盒子的\
  \ `display` 属性为 `inline`：\n    ```css\n    display: inline;\n    ```\n\n#### 修改盒的显示类型\n\
  \n仅仅因为像 `h1` 或 `div` 这样的元素默认是块级，而 `a` 或 `span` 默认是行内级，并不意味着这些元素永远不能更改显示类型。例如，在创建一组链接时，许多开发者会将链接放在\
  \ `li`（列表项）元素中，并将这些元素更改为行内级，以便链接呈水平排列。我稍后向你展示一个示例。\n\n你可以使用 `display` 属性来更改元素的显示类型：\n\
  \n```css\nselector {\n  display: value;\n}\n```\n\n*   `selector`: 指定你想要样化的元素或项目的\
  \ CSS 选择器。\n*   `value`: 指定显示类型的关键字。你可以使用任何一个：\n    *   `block`: 将显示类型更改为块级。\n \
  \   *   `inline`: 将显示类型更改为行内。\n    *   `inline-block`: 将显示类型更改为行内，但浏览器会尊重你对元素 `width`\
  \ 和 `height` 属性的任何修改。\n\n![记住](img/remember.png) *选择器* 是一种 CSS 功能，允许你通过元素名称、类、HTML\
  \ 属性等来选择页面对象。查看第 3 卷第 2 章](#c12.xhtml)和第 3 章](#c13.xhtml)详细了解 CSS 选择器。\n\n这是一个使用选择器更改\
  \ `li` 元素显示类型的示例（查看本书示例文件中的 `bk03ch01/example01.html`）：\n\nHTML:\n\n```html\n<ul>\n\
  \  <li>首页</li>\n  <li>博客</li>\n  <li>联系我们</li>\n  <li>惊喜！</li>\n  <li>支持</li>\n\
  </ul>\n```\n\nCSS:\n\n```css\nli {\n  display: inline;\n  margin-right: 8px;\n}\n\
  ```\n\n\n\n\nHTML 代码定义了一个无序列表。在 CSS 中，`li` 元素的 `display` 属性被设置为 `inline`，这导致列表项水平显示，如图\
  \ 1-3 所示。（我添加了 `margin-right: 8px` 声明，为每个 `li` 项目右侧留出一点空间；请参考本章后面的“操作元素外边距”。）\n\n\
  ![列表项现在显示为内联框的截图](img/9781394164684-fg030103.png)\n\n图 1-3: 列表项现在显示为内联框。\n\n![记住](img/remember.png)\
  \ `display` 属性还有许多其他可能的值。例如，如果你想临时隐藏一个元素，可以使用 `display: none` 对该元素进行样式化。在使用 Flexbox（见第\
  \ 5 册，第 2 章）和 Grid（见第 5 册，第 3 章中详细介绍 CSS 相关的开发工具。现在，你可以通过右键点击元素并点击“检查”（或“检查元素”，取决于你使用的浏览器）在开发工具中查看元素。在出现的面板中，点击右侧出现的\
  \ `Computed` 标签。如图 1-4 所示，此标签包含了所选元素框模型的表示。内层框告诉你内容框的尺寸，同心框则显示每个内边距区域、边框和外边距的大小。\n\
  \n![开发工具 Computed 标签显示所选元素框模型尺寸的截图](img/9781394164684-fg030104.png)\n\n图 1-4: 开发工具的\
  \ Computed 标签显示了所选元素框模型的尺寸。\n\n### 关于空白的短插记\n\n一个主要的网页设计概念是*空白*（whitespace）的概念：页面上空白的、无内容的区块。空白的颜色是可选的：只要它不包含任何内容，空白可以是你喜欢的任何颜色；在设计上，是空白的*留白*起到了关键作用。\n\
  \n为什么空白如此重要？因为当慷慨且审慎地使用时，空白可以让你的页面变得开放，使其更具吸引力、更容易导航，并且阅读起来更愉快。\n\n例如，看看图 1-5 所示的页面。这个页面几乎没有任何空白区域，因此呈现出来就像一堵文字墙。谁想读那个呢？现在将其与图\
  \ 1-6 所示的相同页面的版本进行比较。啊，好多了。是什么产生了区别？在图 1-5 所示的页面版本中，我故意将所有外边距设置为 `0`。在图 1-6 中，我删除了该设置，让浏览器使用默认规则对内容进行样式处理，这些规则包括大多数块元素周围的空白。\n\
  \n![空白极少的网页截图](img/9781394164684-fg030105.png)\n\n图 1-5: 空白极少的网页。\n\n![相同页面现在添加了空白的截图](img/9781394164684-fg030106.png)\n\
  \n图 1-6: 相同的页面，现在添加了空白！\n\n你如何控制页面中的空白？CSS 实际上有许多你可以利用的技术，但以下两个将成为你处理空白的主力：\n\n\
  *   **控制每个元素内部的空白：**这意味着给每个元素慷慨的内边距（padding），确保元素的内容不被边框挤压。\n*   **控制每个元素外部的空白：**这意味着给每个元素留慷慨的外边距（margin），确保元素不被周围元素挤压。\n\
  \n### 添加内边距\n\n在 CSS 框模型中，*padding*（内边距）是内容到边框的空间。\n\n内边距四个部分：上方、右侧、下方和左侧——因此 CSS\
  \ 提供了四个对应的属性：\n\n```css\nselector {\n  padding-top: value1;\n  padding-right: value2;\n\
  \  padding-bottom: value3;\n  padding-left: value4;\n}\n```\n\n每个属性都需要一个值（例如 `px`、`em`、`rem`、`vw`、`vh`\
  \ 或百分比；参考第 5 册第 2 章以了解它们的含义）。图 1-7 显示了一些带有边框的文本。\n\n![带有边框的文本截图](img/9781394164684-fg030107.png)\n\
  \n图 1-7: 带有边框的文本。\n\n这是使用内边距简写重写之前的示例的方法：\n\n```css\np {\n  padding: 16px 12px 16px\
  \ 20px;\n}\n```\n\n### 添加边框\n\n现代网页设计弃用了垂直和水平线作为分割内容的手段，而是通过让大量的空白完成这项工作。然而，这并不意味着你不应该在设计中使用线条，特别是边框。元素的*border*（边框）是围绕元素内容和内边距的虚拟线条集。边框通常是一种非常有用的方法，可以使元素与页面上周围元素区分开来。\n\
  \n#### 应用边框\n\n元素的边框与四条线相关——内边距上方、右侧、下方和左侧——因此 CSS 提供了四个属性为元素添加边框：\n\n```css\nselector\
  \ {\n  border-top: top-width top-style top-color;\n  border-right: right-width right-style\
  \ right-color;\n  border-bottom: bottom-width bottom-style bottom-color;\n  border-left:\
  \ left-width left-style left-color;\n}\n```\n\n每个边框需要三个值：\n\n\n\n\n*   **Width**:\
  \ 边框线的厚度，你可以使用数字加上 CSS 测量单位（如 `px`、`em`、`rem`、`vw` 或 `vh`）来指定。但是，大多数边框宽度是以像素为单位的，通常为\
  \ `1px`。你也可以指定以下关键词之一：`thin`、`medium` 或 `thick`（注意每个关键字相关的厚度在 CSS 标准中并未定义，因此效果可能会因浏览器而异）。\n\
  \n*   **Style**: 边框线的类型，必须是以下关键词之一：\n\n    *   `dotted`: 将边框显示为一系列点。\n    *   `dashed`:\
  \ 将边框显示为一系列虚线。\n    *   `solid`: 将边框显示为一条不连续的实线。\n    *   `double`: 将边框显示为两条平行的实线。\n\
  \    *   `groove`: 将边框显示为像刻在页面上的 V 形凹槽（与 `ridge` 的效果相反）。\n    *   `ridge`: 将边框显示为像从页面上隆起的\
  \ V 形凸起（与 `groove` 的效果相反）。\n    *   `inset`: 将边框显示为像嵌入页面中一样（与 `outset` 的效果相反）。\n\
  \    *   `outset`: 将边框显示为像在页面上浮雕一样（与 `inset` 的效果相反）。\n\n图 1-9 显示了每样的示例。（我在 `groove`、`ridge`、`inset`\
  \ 和 `outset` 样式中使用 `24px` 作为边框宽度，因为这些效果在较窄宽度下很难辨；请查看 `bk03ch01/example03.html`。）\n\
  \n![Tip](img/tip.png) **Color**: 边框线的颜色。你可以使用颜色关键字、`rgb()` 函数、`hsl()` 函数或 RGB 代码，正如我在第三本书第\
  \ 6 章中描述的那样。\n\n以下是一个示例，为 `header` 元素添加了一个 1 像素宽、虚线的红色底部边框：\n\n```css\nheader {\n\
  \  border-bottom: 1px dashed red;\n}\n```\n\n在进行 CSS 工作时，你可能需要关注边框的某个特定部分。例如，你可能只想处理底部边框的样式或左侧边框的颜色。没问题！\n\
  \n![边框样式关键词生效的截图。](img/9781394164684-fg030109.png)\n\n图 1-9： 边框样式关键词的应用。\n\n你可以使用以下任何属性，例如，处理特定的边框宽度（其中\
  \ `border-width` 是任何 CSS 测量单位的宽度）：\n\n```css\nborder-top-width: border-width;\n\
  border-right-width: border-width;\nborder-bottom-width: border-width;\nborder-left-width:\
  \ border-width;\n```\n\n同样，你可以使用以下任何属性来处理特定的边框样式（其中 `border-style` 是任何有效的边框样式关键词，如\
  \ `solid` 或 `dashed`）：\n\n```css\nborder-top-style: border-style;\nborder-right-style:\
  \ border-style;\nborder-bottom-style: border-style;\nborder-left-style: border-style;\n\
  ```\n\n最后，你可以使用以下任何属性来处理特定的边框颜色（其中 `border-color` 是任何有效的 CSS 颜色）：\n\n```css\nborder-top-color:\
  \ border-color;\nborder-right-color: border-color;\nborder-bottom-color: border-color;\n\
  border-left-color: border-color;\n```\n\n如果你想为元素添加一个完整的边框，并且希望四个边都使用相同的宽度、样式和颜色，你会很高兴发现\
  \ CSS 仁地提供了一个使用 `border` 属性的简写版本：\n\n```css\nborder: width style color;\n```\n\n\
  这是我用于为图 1-5 和 1-6 中所示元素添加边框的声明：\n\n```css\nborder: 4px solid black;\n```\n\n![Tip](img/tip.png)\
  \ 技术上，`border` 简写属性唯一要求的值是 `style`。如果你声明类似 `border: solid` 的内容，浏览器将绘制宽度为 `3px`、深灰色的实边框。\n\
  \n![Tip](img/tip.png) 为了帮助视觉化页面上的各种框，你可能认为给某些或所有元素添加边框是件好主意。然而，出于两个原因，这不是个好主意。首先，这工作量很大。第二，添加边框会影响布局，因此你并没有真正看到页面真实的盒模型状态。更好的解决方案是……\n\
  \n\n\n\n\n`border-bottom-left-radius: radiusBL;`\n\n}\n\n例如，以下两条 CSS 规则实现了相同的圆角效果：\n\
  \n```css\naside {\n  border: 1px solid black;\n  border-radius: 50px 100px 10px;\n\
  }\n```\n\n```css\naside {\n  border: 1px solid black;\n  border-top-left-radius:\
  \ 50px;\n  border-top-right-radius: 100px;\n  border-bottom-right-radius: 10px;\n\
  \  border-bottom-left-radius: 100px;\n}\n```\n\n#### 根据椭圆弧圆化边框\n\n圆化元素边角的另一种方法是基于椭圆的弧进行圆角处理，这通过指定水平半径和垂直半径来定义。在这种情况下使用的\
  \ `border-radius` 语法如下：\n\n```css\nselector {\n  border-radius: horizontal vertical;\n\
  }\n```\n\n*   `selector`: 指定你想要样化的项目（或项目）的 CSS 选择器。\n*   `horizontal`: 作为值的水平半径（使用标准\
  \ CSS 测量单位之一，如 `px`、`em`、`rem`、`vw` 或 `vh`）或百分比（元素宽百分比）。\n*   `vertical`: 作为值的垂直半径（使用标准\
  \ CSS 测量单位之一，如 `px`、`em`、`rem`、`vw` 或 `vh`）或百分比（元素高的百分比）。\n\n水平和垂直半径定义了一个椭圆。图 1-11\
  \ 显示了其原理（bk03ch01/example04.html）。左侧的元素没有圆角，因此它具有标准的直角。右侧的元素右上角设置了 `100px 50px`\
  \ 的圆角。注意边框的圆角是如何遵循内切椭圆的弧的。\n\n例如，假设你有一个 `div` 元素，其边框你想根据椭圆进行轻微圆化。以下是实现该效果的 CSS：\n\
  \n```css\ndiv {\n  border: 3px outset darkgreen;\n  border-radius: 10px 20px;\n\
  }\n```\n\n![CSS 根据椭圆弧圆化边框的截图](img/9781394164684-fg030111.png)\n\n图 1-11： CSS 如何根据椭圆弧圆化边框。\n\
  \n如果你想对单个角角进行操作，语法会略有不同：\n\n```css\nselector {\n  border-top-left-radius: horizontalTL\
  \ verticalTL;\n  border-top-right-radius: horizontalTR verticalTR;\n  border-bottom-right-radius:\
  \ horizontalBR verticalBR;\n  border-bottom-left-radius: horizontalBL verticalBL;\n\
  }\n```\n\n这是一个示例：\n\n```css\naside {\n  border: 5px dashed red;\n  border-top-left-radius:\
  \ 50px 75px;\n  border-top-right-radius: 100px 50px;\n  border-bottom-right-radius:\
  \ 75px 100px;\n  border-bottom-left-radius: 50px 25px;\n}\n```\n\n###操控元素外边距\n\n\
  CSS 盒模型的最后一个组件是外边距（margin），它是盒子边框周围的空间。外边距是 Web 设计中的一个重要细节，因为它可以防止元素贴浏览器内容区域的边缘，确保两个元素之间不会重叠（除非你希望重叠），并在元素之间创建令人悦目的空白。\n\
  \n与内边距（padding）一样，外边距分为四个部分——边框上方、右侧、下方和左侧——因此 CSS 提供了四个相应的属性为元素添加外边距：\n\n```css\n\
  selector {\n  margin-top: top-value;\n  margin-right: right-value;\n  margin-bottom:\
  \ bottom-value;\n  margin-left: left-value;\n}\n```\n\n*   `selector`: 指定你想要样化的项目（或项目）的\
  \ CSS 选择器\n*   `top-value` 等：数字后跟 CSS 测量单位（如 `px`、`em`、`rem`、`vw` 或 `vh`；请参考第 3\
  \ 本的第 5 章 了解这些单位的含义）或百分比\n\n这是一个示例：\n\n```css\naside {\n  margin-top: 16px;\n  margin-right:\
  \ 8px;\n  margin-bottom: 32px;\n  margin-left: 24px;\n}\n```\n\n![警告](img/warning.png)\
  \ 使用百分比时要小心\n\n\n\n\n\n不，你没有幻觉：`header` 和 `nav` 元素之间的空间一点也没有变！欢迎来到 CSS 的奇诡世界！在这种情况下，奇诡源于一种名为“外边距合并”（collapsing\
  \ margins）的 CSS “特性”。当一个元素的下边距紧贴另一个元素的上边距时，按照常识，浏览器会将这两个外边距值相加。哈，你想多了！相反，浏览器会使用两个值较大的较大的，并丢弃较的值。也就是说，它将两个外边距值“合并”为一个单一的值。\n\
  \n所以，这意味着你没办法了吗？完全不是。要在两个元素之间获得额外的垂直空间，你有四个选择：\n\n*   增加下方元素的 `margin-top` 值。\n\
  *   增加上方元素的 `margin-bottom` 值。\n*   如果你已经在下方元素上定义了 `margin-top`，且上方元素没有使用边框，则为上方元素添加\
  \ `padding-bottom` 值。\n*   如果你已经在上方元素上定义了 `margin-bottom`，且下方元素没有使用边框，则为下方元素添加 `padding-top`\
  \ 值。\n\n在最后两个项目点中，将一个元素的顶部或底部外边距与另一个元素的底部或顶部内边距结合是有效的，因为浏览器不会合并外边距/内边距组合。\n\n![Remember](img/remember.png)\
  \ 如果你使用浮动或绝对定位的元素（正如我在第 5 本第 1 章]中解释的那样），这些元素的边距永远不会合并。此外，外边距在 flex 容器中不会合并（查看第\
  \ 5 本第 2 章]了解什么是“flex 容器”）。\n\n#### 处理负外边距\n\n我目前为止关于外边距合并的所有描述都适用于正外边距值，但负外边距呢？在这种情况下，有两种场景需要考虑：\n\
  \n*   **两个边距均为负值：** 浏览器合并边距并使用“最负”的边距作为合并后的值。例如，如果一个元素的下边距为 `-20px`，它下方的元素上边距为 `-10px`，那么它们之间的垂直边距将合并为\
  \ `-20px`。\n*   **一个边距为负值，另一个为正值：** 浏览器合并边距并取两个边距之间的净值作为合并后的值。例如，如果一个元素的下边距为 `24px`，它下方的元素上边距为\
  \ `-8px`，那么它们之间的垂直边距将为 `16px`。\n\n#### 其他外边距合并场景\n\n![Technical stuff](img/technicalstuff.png)\
  \ 相邻元素之间垂直空间空间的合并是一个令人头疼的问题，完全不符合直觉。然而，还有两种边距会合并的场景，而且你信不信，这些场景其实是有道理的：\n\n*   **当元素与其容器元素顶部或底部之间没有任何内容时：**\
  \ 假设元素 A 包含元素 B。如果元素 A 的上边距和元素 B 的上边距之间没有任何——没有内容、内边距或边框——这些边距就会合并。同样，如果元素 A 的下边距和元素\
  \ B 的下边距之间没有内容、内边距或边框，这些边距就会合并。\n*   **当元素为空时：** 如果一个元素是空的——也就是说，它不包含任何内容，没有任何内边距或边框，且没有设置其\
  \ `height` 或 `min-height` 属性（参见下一节）——该元素的顶部和底部边距就会合并。\n\n### 设置元素大小样式\n\n当网页浏览器渲染页面时，它会检查每个元素并设置该元素的维度。对于如\
  \ `<header>` 和 `<div>` 等块级元素，浏览器按如下设置维度：\n\n*   **宽度 (Width)：** 设置为元素包含块的宽度。因为默认情况下\
  \ `<body>` 元素的宽度设置为浏览器内容区域的宽度，在实践中，所有块级元素的宽度都被设置为内容区域的宽度。\n*   **高度 (Height)：**\
  \ 设置为恰好容纳元素的所有内容。\n\n你可以通过样式化 `width` 和 `height` 属性来更改元素的维度：\n\n```css\nselector\
  \ {\n  width: width-value;\n  height: height-value;\n}\n```\n\n*   `selector`：CSS\
  \ 选择器，用于指定你想样化的项目（或多个项目）。\n*   `width-value`, `height-value`：以下值之一：\n    *   **数字：**\
  \ 确保在数字后面跟随我在第 3 本第 5 章]中提到的 CSS 测量单位（例如 `px`、`em`、`rem`、`vw` 或 `vh`）。\n    *  \
  \ **百分比：** 结果是元素包含块对应维度的百分比。如果你正在设置宽度，该值为百分比乘以包含元素的宽度；如果你正在设置高度，该值为百分比乘以包含元素的高度。\n\
  \    *   **关键字：** 对于 `width` 属性，这里有三个选择：\n        *   `fit-content`：设置宽度足够以包含元素的所有文本。如果文本多于包含元素宽度能容纳范围，文本将在包含元素内换行。\n\
  \        *   `max-content`：设置宽度足够以包含元素的所有文本。如果文本多于包含元素宽度能容纳范围，文本将在包含元素内换行。\n   \
  \     *   `min-content`：宽度设置为元素中最长的单词。\n\n![Remember](img/remember.png) 如果你使用浮动或绝对定位的元素（正如我在第\
  \ 5 本第 1 章]中解释的那样），这些元素的边距永远不会合并。此外，外边距在 flex 容器中不会合并（查看第 5 本第 2 章]了解什么是“flex 容器”）。\n\
  \n![Technical stuff](img/technicalstuff.png) 相邻元素之间垂直空间空间的合并是一个令人头疼的问题，完全不符合直觉。然而，还有两种边距会合并的场景，而且你信不信，这些场景其实是有道理的：\n\
  \n![Screenshot of putting different values of width to work.](img/97813946484-fg0301)\n\
  \n![Remember](img/remember.png) 大多数时候你会调整宽度；搞定高度是非常困难的，因为它太多因素：内容、窗口大小、用户的默认字体大小等。\n\
  \n![Tip](img/tip.png) 想把一个元素变成完美的圆形吗？当然可以！只需给元素相同的 `height` 和 `width` 值，然后将 `border-radius`\
  \ 属性（我之前在“圆角边框”部分中讨论过）设置为 `50%`：\n\n```css\ndiv {\n  border-radius: 50%;\n  height:\
  \ 100px;\n  width: 100px;\n}\n```\n\n#### 设置最小或最大高度或宽度\n\n有时（实际上非常经常），为了让页面设计生效，你需要一个元素始终以某个指定的高度或宽度渲染，即使元素的内容通常会决定更小的维度。如果元素最终的内容比指定的高度或宽度能容纳的更多，元素根据需要扩展也是允许的。我在这里谈论的是为元素设置最小高度或宽度，你可以像操作\
  \ `min-height` 和 `min-width` 属性一样执行操作：\n\n```css\nselector {\n  min-height: height-value;\n\
  \  min-width: width-value;\n}\n```\n\n\n\n\n\n例如，如果一个 `section` 元素无论包含什么内容，高度至少为\
  \ 200 像素，请使用以下规则：\n\n```css\nsection {\n  min-height: 200px;\n}\n```\n\n相反的情况是，你不希望一个元素的高度或宽度超过某个特定值。元素的高度或宽度可以小于该值，但绝不能大于该值，即使它的内容超出了容纳范围。\n\
  \n为了实现这一目标，你需要为元素设置最大高度或最大宽度，可以通过使用 `max-height` 和 `max-width` 属性来实现：\n\n```css\n\
  selector {\n  max-height: height-value;\n  max-width: width-value;\n}\n```\n\n*\
  \   `selector`: CSS 选择器，用于指定你想要样化的项目（或多个项目）。\n*   `width-value`, `height-value`:\
  \ 使用数字（后跟单位如 `px`、`em`、`rem`、`vw` 或 `vh`；参见第 3 第 5 章）、百分比或关键字（`max-content`、`min-content`\
  \ 或 `auto`，由浏览器决定）。\n\n例如，如果一个 `aside` 元素无论包含什么内容，高度不超过 200 像素且宽度不超过 150 像素，请使用以下规则：\n\
  \n```css\nfooter {\n  max-height: 200px;\n  max-width: 150px;\n}\n```\n\n![Tip](img/tip.png)\
  \ 使用 `max-height` 和 `max-width` 属性时遇到的一个问题是，当设置的最大高度或宽度太小无法包含内容时，内容会溢出元素。幸运的是，CSS\
  \ 有几个属性可以让你优雅地处理此类溢出问题。从 [`www.dummies.com/go/htmlcss&javascriptaiofd`](http://www.dummies.com/go/htmlcss&javascriptaiofd)\
  \ 下载额外章节 4 以深入研究这些属性。\n\n#### 让宽度和高度变得合理\n\n宽度和高度似乎是非常直接的概念，但你现在就可以发现，CSS 擅长将简单的事情变得扭曲。块级元素的尺寸就是一个例子，因为你会认为块级元素的“尺寸”应该是其框到边框的大小：即内容加上内边距，再加上边框本身。并不是的。默认情况下，块元素框的尺寸仅仅是框的内容部分。\n\
  \n这听起来可能并不严重，但意味着当你处理元素的尺寸时，如果你想确保正确，就必须考虑它的内边距宽度和边框大小。相信我，考虑到所有这些因素并不是易事。幸运的是，帮助就在身边。你可以通过强制网络浏览器变得明智并定义元素的大小不仅包含内容，还包含内边距和边框来避免所有的额外计算。名为\
  \ `box-sizing` 的 CSS 属性是这里的英雄：\n\n```css\nselector {\n  box-sizing: border-box;\n\
  }\n```\n\n`box-sizing: border-box` 告诉浏览器将元素的高度和宽度设置为包含内容、内边距和边框。你可以将此声明添加到所有的块级元素规则中，但那样工作量太大了。相反，你可以使用一种技巧，即使用星号\
  \ (`*`) 选择器，这是引用页面上每个元素的简写方式：\n\n```css\n* {\n  box-sizing: border-box;\n}\n```\n\
  \n将此置于样式表顶部，以后你就再也不需要担心它了。\n\n#### 魔法般将行内元素转换为块级元素\n\n高度和宽度只适用于 `<article>`、`<div>`\
  \ 和 `<p>` 等块级元素，而不适用于 `<span>` 和 `<a>` 等行内元素。然而，将行内元素转换为块是可能的。CSS 提供了两种方法来实现这种行内到块的蜕变：\n\
  \n*   **变为行内块。** 如果你想设置行内元素的宽度、高度或其他块相关的属性，但仍允许元素随周围文本流动，请在元素的 CSS 声明中添加以下内容：\n\n\
  \    ```css\n    display: inline-block;\n    ```\n*   **变为真正的块级。** 如果你想设置行内元素的块相关属性，并且不再希望元素随周围文本流动，请在元素的\
  \ CSS 声明中添加以下内容，将其变成一个真正的块级元素：\n\n    ```css\n    display: block;\n    ```\n\n第\
  \ 2 章\n\n## 了解 CSS 选择器\n\n本章内容\n\n*   ![Bullet](img/check.png) **找出父元素、子元素、兄弟元素和其他\
  \ CSS 亲属**\n*   ![Bullet](img/check.png) **理解为什么选择器如此重要**\n*   ![Bullet](img/check.png)\
  \ **按类型、类或 ID 选择元素**\n*   ![Bullet](img/check.png) **定位子元素和兄弟元素**\n*   ![Bullet](img/check.png)\
  \ **按属性选择元素**\n\n*或许理解 CSS 最大的关键在于理解选择器。*\n*—CHRIS COYIER*\n\n在第 1 本中，第 1 章，## 向网络家族介绍你自己\n\
  \n本章的一个核心概念（实际上是所有实用概念之一）是每个元素之间存在的关系。为了帮助你理解这些关系，参考下一页的示例是有用的：\n\n```html\n<html\
  \ lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>许多羽衣菜谱</title>\n</head>\n\
  <body>\n  <header>\n    <h1>超越羽衣的职责</h1>\n  </header>\n  <main>\n    <p>你喜欢用羽衣做菜吗？</p>\n\
  \    <p>你了解羽衣的历史吗？</p>\n    <p>你对羽衣着迷吗？</p>\n  </main>\n</body>\n</html>\n```\n\n\
  如图 2-1 所示，可以将此代码看作一组嵌套容器：\n\n*   `html` 元素包含了页面上的所有其他元素，因此它的容器包裹了一切。\n*   在 `html`\
  \ 元素内部有两个较小的容器：`head` 和 `body` 元素。\n*   在 `head` 元素内部有 `meta` 和 `title` 元素的容器。\n\
  *   在 `body` 元素内部有 `header` 和 `main` 元素的容器。\n*   在 `header` 元素内部有一个 `h1` 元素的容器。\n\
  *   在 `main` 元素内部有三个 `p` 元素的容器。\n\n![网页代码作为一组嵌套容器的示意图](img/9781394164684-fg030201.png)\n\
  \nFIGURE 2-1: 网页代码作为一组嵌套容器。\n\n这里的关键点是这些容器的嵌套，因为正是嵌套决定了每个元素与其他所有元素之间的关系。\n\n\n\n\
  \n\n*   如果元素 `P` 包含元素 `C`，则元素 `P` 被称为元素 `C` 的`parent`（父级）。例如在图 2-1 中，`body` 元素是\
  \ `header` 和 `main` 元素的父。\n\n*   如果元素 `C` 被包含在元素 `P` 中，则元素 `C` 被称为元素 `P` 的`child`（子）。例如在图\
  \ 2-1 中，`h1` 元素是 `header` 元素的子。\n\n*   如果元素 `C1` 和 `C2` 都包含在元素 `P` 中，则 `C1` 和 `C2`\
  \ 彼此称为`siblings`（兄弟）。例如在图 2-1 中，`main` 元素中的三个 `p` 元素是兄弟。\n\n*   如果元素 `C` 被包含在元素\
  \ `P` 中，且元素 `D` 被包含在元素 `C` 中，则元素 `D` 被称为元素 `P` 的`descendant`（后代），而元素 `P` 是元素 `D`\
  \ 的`ancestor`（祖先）。例如在图 2-1 中，`h1` 元素是 `body` 元素的后代。同样，`body` 元素是任何 `p` 元素的祖先。\n\n\
  我在那个列表中向你介绍了许多新术语，所以如果还没有完全理解，请不要担心。当你通用的使用 CSS（尤其是选择器）时，这些概念会迅速成为你的本能。\n\n### 选择器到底是做什么的？\n\
  \n好了，选择器（selector）到底是什么呢？`selector`是你使用的一种模式，用于尽可能准确地定义你想对页面上的哪些元素或元素元素设置样式。\n\n\
  一个通用的 CSS 规则看起来如下：\n\n```css\nselector {\n  one or more CSS declarations go here\n\
  }\n```\n\n这条规则实际上表达是：“打扰一下！对于匹配 `selector` 的任何元素或元素，请应用后续声明块中给出的所有。非常感谢。”\n\n任何被选择器引用的元素都称为选择器的\
  \ `subject`（主体）。\n\n#### 来看一些选择器的示例\n\n我们在这里讨论的是什么类型的主体？各种类型都有：\n\n*   元素名称（例如 `header`\
  \ 或 `p`）\n*   具有特定 `id` 的元素\n*   具有特定属性或属性值的元素\n*   当前被选中的复选框\n*   用户鼠标指针当前悬停在其上的元素\n\
  *   特定父元素的子\n*   特定祖先的后代\n*   特定元素的兄弟\n\n考虑到最后三点，你可以理解为什么学习页面中元素之间的关系是重要的，正如我在上一节讨论的那样。\n\
  \n#### 使用选择器列表\n\n选择器最强大的方面之一是你可以将单个 CSS 声明块应用于多个选择器。例如，你可能需要对页面的 `nav` 和 `footer`\
  \ 元素应用完全相同的样式。\n\n对多个元素应用相同的样式并不是问题，因为你可以创建一个`selector list`（选择器列表），允许你添加任意数量的选择器，而无需为每个元素创建独立的（且相同的）CSS\
  \ 规则。在你的列表中，每个选择器之间用逗号隔开：\n\n```css\nselectorA, selectorB, …, selectorN {\n  one\
  \ or more CSS declarations go here\n}\n```\n\n为了方便阅读，大多数 Web 开发会将每个选择器放在单独的一行，如下：\n\
  \n```css\nselectorA,\nselectorB,\n…,\nselectorN {\n  one or more CSS declarations\
  \ go here\n}\n```\n\n好了，理论够了。是时候开始实际选择东西了。\n\n![Remember](img/remember.png) 在接下来的页面中，我为你提供了大多数选择器的示例代码。问题是，为了让示例既有用又有趣，我使用了许多你可能不熟悉的属性名。在大多数情况下，你可以参考以下章节的解释：\n\
  \n*   任何与 padding（内边距）、borders（边框）、margins（外边距）和 sizes（尺寸）有关的内容，参考第 3 本第 1 章。\n\
  *   任何与颜色和背景有关的内容，前往第 3 本第 6 章。\n*   任何与文本和对齐有关的内容，请翻阅第 3 本第 7 章。\n\n### 学习标准选择器\n\
  \n关于 CSS 选择器的好消息是，虽然 CSS 标准中有几十种选择器，但只有少数“骨干”是你编写大多数 CSS 规则时使用的。特别是我在接下来的几节中涵盖的选择器，可能值得你纹在身体某处以便方便参考。\n\
  \n#### 类型选择器 (type selector)\n\n`type selector` 通过元素名称匹配页面项目（因此它有时也被称为`element selector`元素选择器或\
  \ `tag selector` 标签选择器）：\n\n```css\nelement {\n  property1: value1;\n  property2:\
  \ value2;\n  …\n}\n```\n\n例如，如果你想给每个 `aside` 元素加上边框，你可以使用这样的 CSS 规则（查看 bk03ch02/example01.html）：\n\
  \n```css\naside {\n  border: 3px solid black;\n}\n```\n\n#### 类选择器 (.)\n\n如果你只掌握一种\
  \ CSS 选择器，请选择类选择器，因为你会在 Web 项目中反复使用它。`class selector`（类选择器）是针对特定网页类的样式选择器。那么，什么是类（class）？我很高兴你这么问。`class`是分配给一个或多个标签的属性，允许你对这些标签创建某种分组。这里是为元素添加类的语法：\n\
  \n```html\n<element class=\"class-name\">\n```\n\n*   `element`: 你正在处理的元素名称。\n*\
  \   `class-name`: 你想分配给类的名称。该名称必须以字母开头，其余可以是字母、数字、连字符 (-) 和下划线 (_) 的任何组合。\n\n这是一个示例：\n\
  \n```html\n<h2 class=\"subtitle\">\n```\n\n在根据需要为你的标签分配了类后，你就可以准备开始选择它们了。你通过在样式规则中类名前名前加一个点\
  \ (`.`) 来选择类：\n\n```css\n.class-name {\n  property1: value1;\n  property2: value2;\n\
  \  …\n}\n```\n\n例如，这是针对 `subtitle` 类的规则（bk03ch02/example02.html）：\n\n```css\n.subtitle\
  \ {\n  color: royalblue;\n  font-style: italic;\n}\n```\n\n##### 结合类型和类选择器\n\n当你在\
  \ CSS 规则中使用 `.subtitle` 等选择器时，你是在请求匹配使用 `subtitle` 类的页面元素。然而，假设你的页面不仅在所有 `h2` 元素中使用该类，还用于所有\
  \ `h3` 元素。你如何只针对那些使用 `subtitle` 类的 `h3` 元素？通过在类选择器加上元素名称：\n\n```css\nelement.class\
  \ {\n  property1: value1;\n  property2: value2;\n  …\n}\n```\n\n例如，以下规则匹配具有 `subtitle`\
  \ 类的 `h3` 元素（bk13ch02/example02.html）：\n\n```css\nh3.subtitle {\n  border: 2px dashed\
  \ royalblue;\n}\n```\n\n##### 匹配多个类\n\n元素有两个或多个类是可能的（事实上非常常见）。为标签添加多个类仍然使用 `class`\
  \ 属性，但在值中，用空格分隔每个类名。这是一个示例：\n\n```html\n<h4 class=\"subtitle aside-title\">\n```\n\
  \n你可以通过链用类选择器如下（bk03ch02/example02.html）来定位包含这两个类的任何元素：\n\n```css\n.subtitle.aside-title\
  \ {\n  color: red;\n}\n```\n\n#### ID 选择器 (#)\n\n在第 2 本第 2 章中，我谈到了通过向标签添加唯一的 `id`\
  \ 属性来创建锚点，这允许你创建一个指向锚点的链接：\n\n```html\n<element id=\"id-name\">\n```\n\n这是一个示例：\n\
  \n```html\n<h1 id=\"page-title\">\n```\n\n你也可以将 `id` 属性作为 CSS 选择器，这允许你极其精确地定位特定元素。通过在\
  \ CSS 规则中 `id` 值前加哈号符号 (`#`) 来设置此 `id selector`：\n\n```css\n#id-name {\n  property1:\
  \ value1;\n  property2: value2;\n}\n```\n\n\n\n\n\n```\n…\n```\n\n```\n}\n```\n\n\
  例如，这里有一个针对 `page-title` id (bk03ch02/example03.html) 的规则：\n\n```css\n#page-title\
  \ {\ncolor: maroon;\nfont-family: \"Times New Roman\", serif;\ntext-transform: uppercase;\n\
  }\n```\n\n这种方法并不像标签或类选择器那样实用，因为它可以只能针对单个元素，这就是为什么 Web 开发者很少使用 id 选择器的原因。\n\n![Warning](img/warning.png)\
  \ 你可能正在考虑在多个元素上使用相同的 `id` 值，以便于应用某些 CSS 规则。请，离开文本编辑器！在同一个 HTML 文档中为两个或多个元素使用相同的\
  \ `id` 将导致你的代码无效，并可能引发无尽的、无法预见的 CSS 烦恼。更好的解决方案是在这些元素上使用相同的 `class` 值，然后使用该类来应用 CSS\
  \ 规则。\n\n#### 通用选择器 (*)\n\n`通用选择器`（universal selector）是类型选择器的一种特殊实例，因为你用它来匹配页面上的每一个元素：\n\
  \n```css\n* {\nproperty1: value1;\nproperty2: value2;\n…\n}\n```\n\n一些 Web 开发者使用通用选择器来对他们的\
  \ CSS 进行简单的重置：\n\n```css\n* {\npadding: 0;\nmargin: 0;\nbox-sizing: border-box;\n\
  }\n```\n\n要了解更多关于在项目中使用重置的知识，请查看第 3 本的第 4 章。\n\n### 选择后代、子元素和兄弟元素\n\nCSS 选择器中最强大且实用的类别之一是所谓的`组合器`（combinators）集合。这些是操作符（例如\
  \ `>` 和 `~`），它们允许你将其他类型的选择器结合起来，以匹配选择器之间特定类型的关系：后代、子元素或兄弟元素。\n\n![Remember](img/remember.png)\
  \ 组合器的强大之处源于你可以将它们与在本章中学到的任何其他类型的选择器配合使用。这种灵活性让你能够创建真正实用的 CSS 规则，只针对你想要样式的元素。\n\n\
  #### 后代组合器 ( )\n\n与其针对特定的标签、类或 id，不如你可能需要针对包含在另一个元素中的特定元素的每一个实例。我在这里说的不仅仅是某些父级元素的子元素，还包括该元素的后代。\n\
  \n为了对祖先元素的所有后代应用样式，CSS 提供了`后代组合器`。要设置使用后代组合器的选择器，你在规则中包含要样式的祖先类型和后代类型，并用空格隔开：\n\n\
  ```css\nancestor descendant {\nproperty1: value1;\nproperty2: value2;\n…\n}\n```\n\
  \n例如，考虑以下 HTML (bk03ch02/example04.html)：\n\n```html\n<aside>\n<h4>链接:</h4>\n<div>\n\
  <a href=\"example01.html\">类型选择器</a><br>\n<a href=\"example02.html\">类选择器</a><br>\n\
  <a href=\"example03.html\">id 选择器</a>\n</div>\n</aside>\n```\n\n这里有一条规则，它为作为 `<aside>`\
  \ 标签的后代的 `<a>` 标签应用了几种样式：\n\n```css\naside a {\ncolor: red;\nfont-style: italic;\n\
  text-decoration: none;\n}\n```\n\n#### 子组合器 (>)\n\n我在上一节中讨论的后代组合器是 CSS 王国中最强大的之一，因为它针对位于祖先元素内的特定类型的所有后代，无论这些后代在页面层级中处于多少层之下。然而，仅针对那些位于下一层级的后代（简而言之，即某些父级元素的子元素）通常更合适也更易管理。\n\
  \n要对父元素的子元素应用某些样式，你使用`子组合器`，其中你用大于号（`>`）分隔父元素和子元素：\n\n```css\nparent > child {\n\
  property1: value1;\nproperty2: value2;\n…\n}\n```\n\n例如，这里有一条规则针对任何作为 `aside` 元素子元素的\
  \ `<h4>` 元素 (bk03ch02/example05.html)：\n\n```css\naside > h4 {\ncolor: green;\n\
  border-top: 3px solid black;\nborder-bottom: 5px double black;\npadding: 4px 0;\n\
  text-transform: uppercase;\n}\n```\n\n#### 相续兄弟元素组合器 (~)\n\n一个常见的 CSS 任务是对符合以下标准的特定主体应用样式规则：\n\
  \n*   目标元素出现在 HTML 中指定元素之后，该元素被称为`引用`（reference）元素。\n*   目标元素和引用元素是兄弟元素。\n\n为了对这类主体应用某些样式，你使用`相继兄弟元素组合器`，其中你用波浪号（`~`）分隔引用元素和目标元素：\n\
  \n```css\nreference ~ target {\nproperty1: value1;\nproperty2: value2;\n…\n}\n```\n\
  \n例如，这里有一条规则，针对任何作为 `<h2>` 元素后续兄弟元素的 `<ul>` 元素 (bk03ch02/example06.html)：\n\n```css\n\
  h2 ~ ul {\nbackground: lightpink;\nborder: 5px outset;\nlist-style-type: square;\n\
  }\n```\n\n#### 下一个兄弟元素选择器 (+)\n\n与其像后续兄弟元素组合器那样针对位于引用元素之后的所有兄弟元素，你可能需要针对位于引用元素之后的*下一个*兄弟元素。\n\
  \n例如，假设你有一个布满了 `<h2>` 元素，每个元素后面都跟着 `<p>` 元素。\n\n```css\nh2 + p {\nfont-style: italic;\n\
  }\n```\n\n### 通过属性选择元素\n\n属性（attribute），正如我在第 1 本第 1 章](#c01.xhtml)中讨论的，是插入标签的某些额外代码。例如在\
  \ `<a>` 标签中，`href` 属性被设置为字符串。\n\n属性还可以让你区分页面中的元素。例如，你的页面有很多 `<a>` 元素，但只有一个 `href`\
  \ 属性等于 [`https://www.w3.org/`](https://www.w3.org/) 的 `<a>` 元素。\n\nCSS 利用这种差异性提供了多种`属性选择器`，允许你针对特定属性的存在、特定属性的值或该值的子集。\n\
  \n这是属性选择器的通用语法：\n\n```css\nelement[expression] {\nproperty1: value1;\nproperty2:\
  \ value2;\n…\n}\n```\n\n*   `element`: 你想要目标的元素名称\n*   `expression`: 指定要匹配的 `element`\
  \ 属性或属性值的表达式\n\n这里的 `expression` 部分是关键，它通常是属性名、操作符和值的组合。表 2-1 为你介绍了可用的表达式类型。\n\n\
  | **选择器名称** | **语法** | **匹配内容** |\n| --- | --- | --- |\n| 仅属性 | `element[attr]`\
  \ | 包含名为 `attr` 属性的 `element` 实例。以下示例样式了具有 `title` 属性的所有 `abbr` 元素 (bk03ch02/example08.html)：`abbr[title]\
  \ {border: 1px dotted gray;}` |\n\n\n\n\n| 属性等于 | `element`[`attr`=\"value\"]` |\
  \ 任何属性名为 `attr` 的 `element` 实例，其值等于 `value`。以下示例样式了所有 `href` 属性等于 [`https://www.w3.org/`](https://www.w3.org/)\
  \ (bk03ch02/example09.html) 的 `a` 元素：`a[href=\"https://www.w3.org/\"] {color: green;}`\
  \ |\n| 属性开头为 | `element`[`attr`^=\"value\"]` | 任何属性名为 `attr` 的 `element` 实例，其值以\
  \ `value` 开。以下示例样式了所有 `href` 属性以 `http://` 开头的 `a` 元素 (bk03ch02/example10.html)：`a[href^=\"\
  http://\"] {color: red;}` |\n| 属性包含 | `element`[`attr*=\"value\"]` | 任何属性名为 `attr`\
  \ 的 `element` 实例，其值包含 `value`。以下示例样式了所有 `id` 属性包含字符串 `navbar` 的 `div` 元素 (bk03ch02/example11.html)：`div[id*=\"\
  navbar\"] {font-size: 14px;}` |\n| 属性结尾为 | `element`[`attr$`=\"value\"]` | 任何属性名为\
  \ `attr` 的 `element` 实例，其值以 `value` 结尾。以下示例样式了所有 `href` 属性以 `.org` 结尾的 `a` 元素 (bk03ch02/example12.html)：`a[href$=\"\
  .org\"] {color: firebrick;}` |\n| 属性是第一个 | `element`[`attr|=\"value\"]` | 任何属性名为\
  \ `attr` 的 `element` 实例，其值等于 `value` 或以 `value`-` 开头（即 `value` 后面跟一个连字符 [`-]`）。以下示例匹配了所有\
  \ `lang` 属性等于 `en` 或以 `en-` 开头的 `div` 元素 (bk03ch02/example13.html)：`div[lang|=\"\
  en\"] {color: blue;}` |\n| 属性包含 | `element`[`attr`~=\"value\"]` | 任何属性名为 `attr`\
  \ 的 `element` 实例，其值包含完整单词的 `value`。以下示例匹配了所有 `alt` 属性包含 `photo` 作为完整单词的 `img` 元素\
  \ (bk03ch02/example14.html)：`img[alt~=\"photo\"] {border: 12px ridge saddlebrown;}`\
  \ 注意，此选择器不会匹配包含 `photograph` 或 `telephoto` 等单词的 `alt` 属性（假设它们在 `alt` 字符串的其他地方没有完整单词\
  \ `photo`）。 |\n\n[表 2-1] CSS 属性选择器\n\n## 第 3 章\n\n# 伪类学校：学习伪类和伪元素\n\n### 本章内容\n\n\
  - 掌握伪类\n- 选择子元素\n- 根据类型、状态或用户操作为元素设置样式\n- 使用功能性伪类提升你的选择器技巧\n- 尝试一些伪元素\n\n*pseudo:\
  \ 形容词，接近的，几乎的，或试图成为。* — DICTIONARY.COM\n\n当你使用 CSS 时，你本质上是在为你用于构建页面结构的 HTML 应用样式。你的\
