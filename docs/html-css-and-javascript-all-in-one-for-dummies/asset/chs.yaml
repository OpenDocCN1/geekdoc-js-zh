  \ block);\n```\n\n假设当前要执行的语句是一个函数调用，单步执行将带你进入函数并在函数的第一语句处暂停。你可以继续单步执行该函数，直到执行最后一条语句，此时浏览器会将你返回到函数调用之后的语句。\n\
