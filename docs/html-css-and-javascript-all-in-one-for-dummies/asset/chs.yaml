  \ 实例，其值以 `value` 开。以下示例样式了所有 `href` 属性以 `http://` 开头的 `a` 元素 (bk03ch02/example10.html)：`a[href^=\"\
  http://\"] {color: red;}` |\n| Attribute contains | `element`[`attr*=\"value\"]`\
  \ | 任何属性名为 `attr` 的 `element` 实例，其值包含 `value`。以下示例样式了所有 `id` 属性包含字符串 `navbar` 的\
