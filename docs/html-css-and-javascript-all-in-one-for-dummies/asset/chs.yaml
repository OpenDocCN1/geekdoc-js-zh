  图 4-6： 平板电脑视口中的网格布局。\n\n进一步减小视口宽度，布局最终会自动切换到两列布局，然后切换到单列布局，如图图 4-7 所示。\n\n![智能手机视口中网格布局的截图](img/9781394164684-fg050407.png)\n\
  \n图 4-7： 智能手机视口中的网格布局。\n\n#### 利用视口单位\n\n为布局构建流式效果最简单的方法之一是通过我在第 3 本第 5 章中提到的视口单位。这里再次列出（参见表\
