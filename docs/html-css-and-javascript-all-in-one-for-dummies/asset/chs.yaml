  \ 9. 处理表单数据（FormData）\n\n## 第 1 章\n# JavaScript：鸟瞰视角\n\n### 本章内容\n\n- 感受编程的概念，特别是\
  \ JavaScript\n- 学习使用 JavaScript 可以做什么（以及不能做什么）\n- 检查编写代码所需的工具\n- 处理旧版浏览器\n- 在你的\
  \ JavaScript 代码中添加注释\n- 将你的代码存储在独立的 JavaScript 文件中\n\n*大多数优秀的程序员之所以编程，并不是因为他们获得报酬或公众的赞誉，而是因为编程本身很有趣。*\n\
  \n—林斯·托瓦兹（LINUS TORVALDS）\n\nHTML（我在第 2 本 中介绍）和 CSS（我在第 3 本 中介绍）都是非常棒的技术，你可以用它们创建看起来惊人的页面。但当你把页面发布到\
  \ Web 服务器并查看几次（几十次）后，你可能会发现一种微妙的失望感悄然而至。为什么？这很难解释，但那丝沮丧源于一个残酷的事实：你的网页只是在那儿呆着。\n\n\
  当然，你可能有一两个三个链接可以点击，但大多数可能这些链接只是带你到你的更多页面，而它们也只是那样呆在那里。或者，某个链接带你进入另一个网站，一个感觉是动态、活跃且具有交互性的网站。啊，参与感！噢，兴奋感！\n\
  \n一个无所事的页面和一个似乎始终在跳舞的页面有什么区别？只有一个词：JavaScript。在极少数例外情况下（请查看我在额外章节 1 到 3 中关于 CSS\
  \ 动画的介绍，网址为 `www.dummies.com/go/htmlcss&javascriptaiofd`(http://www.dummies.com/go/htmlcss&javascriptaiofd)），HTML\
  \ 和 CSS 创建的是静态页面。如果你想让页面变得动态且具有交互性，你需要一些后台 JavaScript 来来实现。\n\n我在第 1 本第 1 章中介绍了一些\
  \ JavaScript 基础，但现在是时候开始编写真正的代码了。如果你从未写过程序，不要担心。在接下来的几个章节中，我将循序渐进地带你了解一切。正如你即将发现的，编程真的很有趣。\n\
  \n### 什么是 Web 编程？\n\n当人们谈论 Web 编程时，他们实际上说的是 JavaScript。是的，你需要 HTML 和 CSS 来创建网页，需要\
  \ `PHP` 和 `MySQL` 等工具来让 Web 服务器为你的页面提供数据，但将所有这些技术结合在一起的胶水（有时也是胶带）是 JavaScript。结果是，JavaScript\
  \ 现在（而且已经很一段时间了）是 Web 开发的默认编程语言。如果你想用代码控制页面（我知道你想这样做），你必须使用 JavaScript 来完成。\n\n\
  我在书中没有介绍服务端的内容——特别是 `PHP` 和 `MySQL`。如果你对 Web 的这一端感兴趣，请参阅我的伴侣书《自学 Web 编程与开发》（Web\
  \ Coding and Development All-in-One For Dummies）（Wiley）。\n\n这也意味着 JavaScript 在 Web\
  \ 上（而且已经很一段时间了）是通用的。当然，你可以在那里发现只有 HTML 和点星 CSS 的简陋主页，但其他一切——从简陋的个人博客到花哨的设计师作品，再到大型企业的电子商务运营——都依赖\
  \ JavaScript 来让事物看起来良好并按预期运行（至少大多数时候是如此）。\n\n所以，涉及到你 Web 开发教育的培养和维护，JavaScript 是你需要学习的主题中最重要的之一——可以说是是最重要的主题。\n\
  \n### 什么是编程语言？\n\nJavaScript 是一种编程语言。好了，不错，但把某物称为“编程语言”意味着什么？要理解这个术语，你只需要观察你说话和写作的语言。在最基础层面，人类语言由两个部分组成：单词和规则：\n\
  \n- 单词是对于相同语言的人来说具有共同含义的字母集合。例如，`book` 这个词表示一种对象；`heavy` 这个词表示一种质量，而 `read` 这个词表示一个动作。\n\
  - 规则是组合单词以创建连贯且理解的概念的方法。如果你想被其他语言的说话者理解，你组合两个或多个单词的方法是有限的。“I read a heavy book”是一句立刻就能懂的句子，但“book\
  \ a I read heavy”是乱码。\n\n人类语言的主要目标是让听你说话或阅读你写的内容的人理解。如果你使用正确的单词来指代事物和动作，并根据规则组合单词，别人就能理解你。\n\
  \n编程语言的工作原理大相同。也就是说，它也有单词和规则：\n\n- 单词是一一组指向你的程序处理的特定事物或处理这些事物的特定方法的术。它们被称为*保留字*或*关键字*。\n\
  - 规则是组合单词以产生预期效果的方法。在编程领域，这些规则被称为语言的*语法*。\n\n\n\n\n\n在 JavaScript 中，你使用的许多单词都非常直观。有些指代浏览器的方面，另一些指代网页的组成部分，而一些是\
  \ JavaScript 内部使用的。例如，在 JavaScript 中，`document` 一词指的是一个特定的对象（整个网页），而 `write()` 一词指的是一个特定的动作（向页面写入数据）。\n\
  \n这里的关键概念是：就像人类语言的根本目的是让另一个人理解一样，编程语言的根本目的是让任何处理该语言的机器理解。对于 JavaScript 来说，这台机器就是读取页面的机器：网络浏览器。\n\
  \n你可以通过使用正确的 JavaScript 单词并使用正确的 JavaScript 语法将它们组合，让页面读取机器理解你的意思。例如，JavaScript\
  \ 的语法规则告诉你可以像这样组合 `document` 和 `write()` 单词：`document.write()`。如果你使用 `write().document`\
  \ 或 `document` `write()` 或任何其他组合，页面读取机器都无法理解你的意思。\n\n然而，关键在于，被页面读取机器“理解”实际上意味着能够*控制*这台机器。也就是说，你的\
  \ JavaScript“句子”实际上是你让机器执行的命令。例如，如果你想用 JavaScript 在网页上添加“Hello World!”文本，你可以在代码中包含以下语句：\n\
  \n```\ndocument.write(\"Hello World!\");\n```\n\n当页面读取机器艰难地穿过 HTML 文件并遇到这条语句时，它将直接将其插入页面中。\n\
  \n### JavaScript 难学吗？\n\n我认为很多人对创建网页感到兴奋还有第二个原因：它并不那么难学。HTML 听起来像是一件困难的事，而且如果你在对\
  \ HTML 一无所知的情况下查看典型网页的源代码，代码看起来比你能想象的任何东西都要令人生畏。\n\n然而，我发现只要从基础标签开始学习，研究大量它们工作方式的示例，并逐渐过渡到更复杂的页面，任何人都可以学习\
  \ HTML。这只是建立一个坚实基础并在此基础上进行构建的问题。\n\n我深信 JavaScript 可以以非常相似的方式处理。我绝对不会告诉你 JavaScript\
  \ 学习起来像 HTML 一样简单。那是彻彻裸裸的谎言。但是，我会告诉你，JavaScript 本身并没有什么困难之处。用我们的语言来类比，它只是多了一些需要认识的单词和一些需要学习的规则。但我相信，如果你从基础单词和规则开始，学习大量的示例来了解它们是如何工作的，然后慢慢构建出更复杂的脚本，你就能学习\
  \ JavaScript 编程。我在此刻预言，当你读完这本书时，你甚至会对自己以及你所能做的一切感到惊讶。\n\n### 用 JavaScript 可以做什么\n\
  \n我教过的创建网页的人们是一群非常友好的人，他们喜欢给我写信告诉我他们的网页进展得如何。在很多情况下，他们告诉我他们遇到了网页版的“路障赛”。也就是说，他们有某些想做的事，但他们不知道如何在\
  \ HTML 中实现。所以，我最终会收到很多这样的问题：\n\n*   我如何显示那些弹窗之一？\n*   我如何动态地向页面添加内容？\n*   我如何让用户点击按钮时发生某些事情？\n\
  *   我如何让鼠标悬停在图像上时图像发生变化？\n*   我如何计算我的订单表单的总额？\n\n对于每个问题，答案的开头总是这一句：“抱歉，你无法使用 HTML\
  \ 实现这一点；你必须使用 JavaScript。”然后我为他们提供一些代码，他们可以将其“剪切粘贴”到自己的网页中，然后继续自己的生活。\n\n如果你刚刚开始学习\
  \ JavaScript，我在书中的目标是帮助你从“剪切粘贴”转向“编写并加载”。也就是说，你最终将能够创建自己的脚本来解决你自己独特的 HTML 和网页问题。我希望向你证明，学习\
  \ JavaScript 是值得的，因为你可以用它做许多其他事情：\n\n*   添加、修改或删除页面文本、HTML 标签，甚至是 CSS 属性。\n*   向用户显示消息并向用户询问信息。\n\
  *   “监听”并根据事件（如访问者点击鼠标或按下键盘）执行操作。\n*   将用户的浏览器引导到另一个页面。\n*   在将表单提交到服务器之前验证表单中的值。例如，你可以确保某些字段已填写。\n\
  *   为每个用户收集、保存和检索数据，例如网站个性化设置。\n\n在这本书中，你将学习如何做所有事情以及更多事情。\n\n### 用 JavaScript 不能做什么\n\
  \nJavaScript 很好，但它并没那么好。JavaScript 可以做很多事情，但有一长串事情是它根本无法做的。以下是它不能做的事情的示例：\n\n* \
  \  向现有文件永久写入数据。例如，你不能从访客簿中获取数据并将其添加到存储消息的文件中。\n*   访问服务器上的文件。\n*   收集有关用户的任何信息，包括电子邮箱或\
  \ IP 地址。\n*   提交信用卡购买进行授权和支付。\n*   创建多人游戏。\n*   直接从服务器数据库中获取数据。\n*   处理文件上传。\n\n\
  JavaScript 无法做这些大多数事情，因为它是行业内所谓的客户端编程语言，这意味着它运行在用户的浏览器上（编程人员喜欢称之为*客户端*）。\n\n有一些所谓的服务器端\
  \ JavaScript 工具可以实现其中的某些事情，但它们非常复杂，因此超出了本书的范围。\n\n\n\n\n\n你不需要担心网络浏览器无法处理 JavaScript，因为所有现代浏览器已经支持\
  \ JavaScript 很多时候了。然而，你可能需要担心那些不支持 JavaScript 的人。虽然很罕见，但有些人确实关闭了浏览器的 JavaScript\
  \ 功能。人们为什么要这样做呢？许多人禁用 JavaScript 是因为他们担心安全问题，不希望 cookie 被写入他们的硬盘等。\n\n为了处理这些“不墨成规者”，请在页面的\
  \ `body` 内部放置 `<noscript>` 标签：\n\n```html\n<noscript>\n<p>\n  嘿，你的浏览器禁用了 JavaScript！\n\
  </p>\n<p>\n  好的，没问题，也许你更倾向于此页面的 <a href=\"no-js.html\">非 JavaScript 版本</a>。\n</p>\n\
  </noscript>\n```\n\n如果浏览器启用了 JavaScript，浏览器将不会显示 `<noscript>` 标签内的任何文本。但是，如果禁用了\
  \ JavaScript，浏览器就会向用户显示 `<noscript>` 标签内部的文本和标签。\n\n为了在禁用 JavaScript 的情况下测试你的网站，以下是在一些流行浏览器中使用的技术：\n\
  \n*   **Chrome（桌面版）：** 打开“设置”，点击“隐私和安全”，点击“网站设置”，点击“JavaScript”，然后选择“不允许网站使用 JavaScript”选项，如图图\
  \ 1-1 所示。![Google Chrome 中禁用 JavaScript 的截图](img/9781394164684-fg040101.png)\n \
  \   图 1-1： 在 Google Chrome 中禁用了 JavaScript。\n*   **Chrome（Android）：** 打开“设置”，点击“网站设置”，点击“JavaScript”，然后将\
  \ JavaScript 开关拨至关闭。\n*   **Edge：** 打开“设置”，点击“设置菜单”，点击“Cookie 和网站权限”，点击“JavaScript”，然后将“允许”开关拨关闭。\n\
  *   **Safari (macOS)：** 打开“设置”，点击“高级”选项卡，选择“在菜单栏中显示开发菜单”，然后关闭“设置”。选择“开发” ⇒ 禁用禁用\
  \ JavaScript”。\n*   **Safari (iOS 或 iPadOS)：** 打开“设置”，点击“Safari”，点击“高级”，然后将 JavaScript\
  \ 开关拨至关闭。\n*   **Firefox（桌面版）：** 在地址栏中输入 `about:config` 并按回车键。如果 Firefox 显示警告页面，点击“接受风险并继续”以显示高级偏好页面。在“偏好名称搜索”框中输入\
  \ `javascript`。在搜索结果中查找 `javascript.enabled` 偏好。在该偏好的最右侧，点击切换按钮将偏好值从 `true` 改为 `false`，如图图\
  \ 1-2 所示。\n    ![Firefox 中禁用 JavaScript 的截图](img/9781394164684-fg040102.png)\n \
  \   图 1-2： 在 Firefox 中禁用了 JavaScript。\n\n### 处理非常老旧浏览器\n\n在书中，你将学习被称为 ECMAScript\
  \ 2015 的 JavaScript 版本，也称为 ECMAScript 6，或者简称为 ES6。为什么特别选择这个版本，而不是之后的任何版本？原因有两个：\n\
  \n*   ES6 具有极佳的浏览器支持，超过 98% 的当前浏览器支持 ES 6 发布的功能。JavaScript 的后续版本支持程度较少。\n*   ES6\
  \ 包含了你为页面添加各种有用且有趣的动态功能所需的所有内容。除非你是一个专业程序员，否则 JavaScript 后续版本中发布的功能远超你的需求。\n\n那么，那百分之二不支持\
  \ ES6 的浏览器该怎么办？\n\n首先，要知道，被 ES6 特性卡死的浏览器数量每天都在减少。确实，现在是百分之二（实际上大约是 1.7%），但六个月后将变为百分之一，一年后将变为百分之五，以此类推，直到这些数字小到无法测量。\n\
  \n其次，不支持 ES6 的浏览器比例因地区而异（例如，在非洲许多国家比例更高）并因环境而异。大多数运行不支持不支持 ES6 浏览器的人在使用 Internet\
  \ Explorer 11，而这些人中的大多数处于无法升级的环境中（例如某些企业环境）。\n\n如果运气不好，你的网页吸引了极高比例的这些旧浏览器，你可能需要放弃\
  \ ES6 的强大功能，转而采用久经考验的 ECMAScript 5 特性。为此，当我介绍每个新的 JavaScript 特性时，我会指出哪些是随 ES6 引入的，如果你倾向于使用\
  \ ES5，我会告诉你是否有简单的回退方案或变通方法（在 JavaScript 领域称为 polyfill 补丁）。\n\n### 在代码中添加注释\n\n只有几行的脚本通常易于阅读和理解。然而，你的脚本不会一直那么简单，这些更长、更复杂的创建读起来会相应地变得困难。（如果你在首次编写代码几周或几个月后再次查看代码，这种难度会尤为显著。）为了帮助你解读代码，在整个脚本中大量使用注释是良好的编程习惯。“注释`\
  \ 是描述或解释语句或一组语句的文本。浏览器会忽略注释，因此你可以根据需要添加任意数量的注释。\n\n对于简短的单行注释，请使用双斜杠（`//`）。将 `//`\
  \ 放在行开头，然后输入你的注释。这是一个示例：\n\n```javascript\n// 显示页面最后修改日期和时间\ndocument.write(\"This\
  \ page was last modified on \" + document.lastModified);\n```\n\n你也可以使用 `//` 注释二三行文本，只要每行都以\
  \ `//` 开头即可。然而，如果你的注释超过了这些，最好使用以 `/*` 字符开头并以 `*/` 字符结束的多行注释。这是一个示例：\n\n```javascript\n\
  /*\n此脚本演示了 JavaScript 的能力，\n通过 document.write() 方法向网页写入文本，\n显示网页文件最后修改的日期和时间。\n\
  此脚本版权所有 Paul McFedries。\n*/\n```\n\n![警告](img/warning.png) 虽然在刚开始学习时添加很多注释没有关系，但你不需要对每个内容都添加注释。如果一个语句非常微不足道或其目的显而易见，就忽略注释继续下去吧。\n\
  \n### 创建外部 JavaScript 文件\n\n在第一书中第 1 章中，我讨论了如何通过在页面头部插入 `<script>` 和 `</script>`\
  \ 标签（即在 `<head>` 和 `</head>` 标签之间），有时或插入页面主体（即在 `<body>` 和 `</body>` 标签之间）来向网页添加\
  \ JavaScript 代码。你可以在 `<script>` 和 `</script>` 标签之间编写代码。\n\n如果脚本较短，以这种方式将脚本放在页面内没有问题。然而，如果你的脚本（或多个脚本）占据数十或上百行，你的\
  \ HTML 代码看起来就会很杂乱。你可能遇到的另一个问题是在多个页面上需要相同的代码。当然，你可以只需将代码复制到每个需要的页面中，但如果你以后需要更改，你需要更新每个使用该代码的页面。\n\
  \n这两个问题的解决方案是将代码从 HTML 文件中移动出来并放入外部 JavaScript 文件中。移动代码可以将 HTML 文件中 JavaScript 的存在感减少到单行（你很快就会学会），并且意味着你可以通过编辑外部文件来更新代码。\n\
  \n关于使用外部 JavaScript 文件，有几点：\n\n*   文件必须使用纯文本格式。\n*   命名文件时使用 `.js` 扩展名。\n*   不要在文件中使用\
  \ `<script>` 标签。只需像在 HTML 文件中那样输入语句即可。\n\n\n\n\n\n*   浏览器执行外部文件中语句的规则与其在 HTML 文件内执行语句的规则相同。也就是说，函数之外的语句会在浏览器遇到你的文件引用时自动执行，而函数内部的语句在函数被调用之前不会执行。（不确定什么是“函数”吗？你可以在第\
  \ 4 册的第 5 章中了解详细信息。）\n\n要让浏览器知道存在外部 JavaScript 文件，请向 `<script>` 标签中添加 `src` 属性。例如，如果外部文件名为\
  \ `myscripts.js`，你的 `<script>` 标签设置如下：\n\n```html\n<script src=\"myscripts.js\"\
  >\n```\n\n此示例假设 `myscripts.js` 文件与 HTML 文件位于同一目录下。如果文件位于不同的目录，请相应调整 `src` 值。例如，如果\
  \ `myscripts.js` 文件位于名为 `scripts` 的子目录中，你应该使用以下代码：\n\n```html\n<script src=\"scripts/myscripts.js\"\
  >\n```\n\n你甚至可以通过指定完整的 URL 作为 `src` 值，来指定另一个网站（推测是你自己的！）的文件：\n\n```html\n<script\
  \ src=\"http://www.host.com/myscripts.js\">\n```\n\n作为一个示例，下面的代码显示了一个名为 `footer.js`\
  \ 的单行外部 JavaScript 文件：\n\n```javascript\ndocument.write(\"This page is Copyright\
  \ \" + new Date().getFullYear());\n```\n\n该语句写入文本“Copyright”，并在其跟上当前年份。（我知道：这段代码现在看起来可能像是一堆乱码。别担心，当我在第\
  \ 4 册的第 8 章中讨论 JavaScript Date 对象时，你将确切知道这里发生了什么。）\n\n下面的代码显示了一个包含外部 JavaScript\
  \ 文件引用的 HTML 文件（请查看本书示例文件中的 bk04ch01/example01.html）：\n\n```html\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Using an External JS\
  \ File</title>\n</head>\n<body>\n<p>\n普通的页面内容放在这里。\n</p>\n<hr>\n<footer>\n<script\
  \ src=\"footer.js\">\n</script>\n</footer>\n</body>\n</html>\n```\n\n当你加载该页面时，浏览器会逐行运行\
  \ HTML。当它运行 `<footer>` 标签时，它会注意到 `<script>` 标签引用的外部 JavaScript 文件。浏览器加载该文件，然后运行文件中的代码，将版权信息写入页面，如图\
  \ 1-3 所示。\n\n![此页面使用外部 JavaScript 文件显示页脚信息的截图。](img/9781394164684-fg040103.png)\n\
  \n图 1-3： 此页面使用外部 JavaScript 文件显示页脚信息。\n\n## 第 2 章：理解变量\n\n本章内容\n\n- ![Bullet](img/check.png)\
  \ 掌握变量\n- ![Bullet](img/check.png) 为变量命名\n- ![Bullet](img/check.png) 引入 JavaScript\
  \ 数据类型\n- ![Bullet](img/check.png) 弄懂数字\n- ![Bullet](img/check.png) 将字符串连接在一起\n\n\
  *一个人的常数是另一个人的变量。*\n—ALAN·PERLIS\n\n你可能听说过——甚至可能知道——某些人由于意外或不幸，失去了保留短期记忆的能力。如果你向其中某人介绍自己，他们会在五分钟后再次询问你叫什么。他们生活在永恒的当下，在每一天、每一分钟都重新体验世界。\n\
  \n我确信你现在已经在问，以上内容与编码有什么关系吗？仅仅是，默认情况下，你的 JavaScript 程序也过着没有短期记忆的生活。浏览器一次执行一条语句运行你的代码，直到没有更多语句需要处理为止。这一切都发生在永恒的当下。啊，但注意，我将这种缺乏短期记忆称为你脚本的“默认”状态。它并不是唯一的状态，这意味着情况可以有所不同。你有权赋予你的脚本短期记忆的礼物，而你通过使用被称为“变量”的方便小代码块来实现这一点。在本章中，你将深入研究变量，这是一个基础且至关重要的编程主题。你将研究变量是什么、你可以用它们做什么，以及如何在你的\
  \ JavaScript 代码中运用它们。\n\n### 理解变量\n\n为什么脚本需要短期记忆呢？因为编码时出现的最常见概念之一就是存储一个临时值以备后用。在大多数情况下，你希望在同一个脚本稍后时候使用该值。然而，你可能还需要在其他脚本中使用它，用于填充\
  \ HTML 表单，或者作为更大或更复杂计算的一部分。例如，你的页面可能有一个按钮，可以在大字号和普通字号之间切换页面文本，因此你需要某种方式来“记住”那个选择。同样，如果你的脚本执行计算，你可能需要留出一个或多个计算出的值以供以后使用。例如，如果你正在编写一个购物车脚本，你可能需要计算订单税。为了做到这一点，你必须先计算订单的总值，存储该值，然后取其百分比来计算税费。\n\
  \n在编程中，你为以后使用保存值的方法将其存储在变量中。`variable` 是一块留用于存放程序数据的计算机小内存区域。好消息是，数据从内存中存储和检索的具体细节都在幕后完成的，所以你永远不需要担心这个问题。作为一名编码员，处理变量仅涉及三件事：\n\
  \n- 创建（或`声明`）变量\n- 为这些变量赋值\n- 将变量包含在代码的其他语句中\n\n接下来的三个部分将介绍细节。\n\n 使用 let 声明变量\n\
  \n在编程术语中，创建变量的过程被称为`声明`。所有声明的意义其实是你为变量提供一个名称，并告诉浏览器在内存中留出一小块空间用于存放你最终存储在变量中的任何值。在\
  \ JavaScript 中声明变量，你使用 `let` 关键字，后面跟着一个空格、变量名以及通常的行尾分号。例如，要声明名为 `interestRate` 的变量，你使用以下语句：\n\
  \n```javascript\nlet interestRate;\n```\n\n![记住](img/remember.png) 在你的脚本中声明变量时，有几点需要记住：\n\
  \n- **只声明一次变量：** 虽然你可以在脚本中根据需要多次使用变量，但你只需声明一次变量。尝试多次声明同一个变量会导致错误。\n- **使用注释描述每个变量：**\
  \ 变量往往会激增，以至于通常很难记住每个变量代表什么。你可以在变量声明之后立即添加注释，使每个变量的目的变得清晰，如下：\n\n  ```javascript\n\
  \  let interestRate; // 用于贷款计算的年利率\n  ```\n- **在运行变量之前声明它：** 如果你在声明变量之前使用它，你将得到一个错误![记住](img/remember.png)\
  \ 在这里的前两个项目中中，当我说你会“得到一个错误”时，我的不是指屏幕上弹出一个错误消息。你唯一注意到的是脚本没有运行。要读取错误消息，你需要访问浏览器的网络开发工具，这项任务我在第\
  \ 4 册的第 10 章中进行了详尽的讲解。\n- **在第一次使用变量之前声明它：** 如果你遵循这一简单规则，将使你的编程和调试（请参考第 4 册的第 10\
  \ 章）生活变得容易得多：在第一次使用变量之前（或尽可能靠近第一次使用的地方）声明每个变量。\n\n\n\n\n\n![技术细节](img/technicalstuff.png)\
  \ `let` 关键字是在 ECMAScript 2015 (ES6) 中引入的。如果你需要支持非常老的浏览器——我说的*你,*Internet Explorer\
  \ 11 及早期版本——请改用 `var` 关键字。\n\n#### 在变量中存储值\n\n在声明变量之后，你的下一个任务是给它一个值。你使用赋值运算符——等号（`=`）——将值存储在变量中，如下通用语句所示：\n\
  \n`variableName` = `value;`\n\n这是一个将值 `0.06` 赋值给名为 `interestRate` 变量的示例：\n\n`interestRate\
  \ = 0.06;`\n\n另外，如果你提前知道变量的初始值，可以将声明和初始赋值合并为一条语句，如下：\n\n`let interestRate = 0.06;`\n\
  \n重要的是记住，对于使用 `let` 关键字声明的变量，你可以随时更改该变量的值。例如，如果你赋值给 `interestRate` 变量的值是年利率，稍后你的代码可能需要处理月率，即年率除以\
  \ 12。与其手动计算，不如直接在代码中使用除法运算符（`/`）进行计算：\n\n`interestRate = 0.06 / 12;`\n\n关于使用变量赋值的最后一点，请看这种经常让新程序员感到困惑的变体。具体来说，你可以设置一条语句，通过更改现有值来为变量赋新值。这是一个示例：\n\
  \n`interestRate = interestRate / 12;`\n\n如果你以前从未见过这种语句，它看起来可能有点不符合逻辑。一个东西怎么能等于自己除以\
  \ 12 的结果？理解此类语句的秘密在于记住，浏览器总是先评估语句的右侧——即等号（`=`）右侧的表达式。换句话说，它获取 `interestRate` 的当前值（即\
  \ `0.06`），并将其除以 12。大功完成后，得到的结果将存储在 `interestRate` 中。关于运算符和表达式的更深入的讨论，请参阅第四部分 第 3\
  \ 章。\n\n![记住](img/remember.png) 由于这种“先评估表达式后存储结果”的行为，JavaScript 的赋值语句不应被读为“变量*等于*表达式”。相反，将它们理解为“变量*被设置为*表达式”或“变量*采用表达式所给出的值”更符合逻辑。这样读取赋值语句有助于强化一个重要概念：表达式的结果正在被存储在变量中。\n\
  \n#### 另一种声明变量的方法：const\n\n“variable”（变量）一词意味着赋值给变量的值是允许*变化*的，你声明的大多数变量都是如此。大多数是，但不是所有。有时，你的脚本需要使用一个保持不变的值。例如，假设你正在构建一个将英里转换为公里的计算器。转换因子是\
  \ 1.60934，该值在整个脚本运行期间将保持不变。\n\n将此类值存储在变量中以便阅读是一种良好的编程习惯。然而，如果你使用 `let` 进行这种声明，你可能会在代码的某处意外更改该值，因为用\
  \ `let` 声明的变量是可以改变的。\n\n为了避免意外更改你想要保持不变的值，你可以使用 `const` 关键字声明变量。这是通用语法：\n\n`const\
  \ variableName` = `value;`\n\n注意，与 `let` 不同，当你用 `const` 声明变量时必须为它赋值。这是一个声明名为 `milesToKilometers`\
  \ 的变量并赋值为 `1.60934` 的示例：\n\n`const milesToKilometers = 1.60934;`\n\n![记住](img/remember.png)\
  \ 在变量值必须永远不改变的情况下，使用 `const` 替代 `let` 是否有真正的优势？是的，有两个非常好的优点：\n\n*   使用 `const` 关键字是一个提醒，提醒你正在处理一个不改变的值，这有助于你记住不要给该变量赋新值。\n\
  *   如果你尝试更改用 `const` 声明的变量的值，将产生错误，这是另一种提醒你变量值是不允许被动的方式。\n\n![提示](img/tip.png) 考虑到这些优势，许多\
  \ JavaScript 程序员用 `const` 声明每个变量，并仅对他们知道会改变的变量使用 `let`。随着代码的进展，如果你发现某个 `const` 变量需要更改，你可以回去将\
  \ `const` 改为 `let`。\n\n#### 在语句中使用变量\n\n声明变量并赋值后，你就可以在其他语句中使用该变量了。当浏览器遇到该变量时，它会进入计算机内存，检索变量的当前值，然后将该值替换到语句中。以下代码展示了一个示例（查看此书示例文件\
  \ bk04ch02/example01.html）：\n\n```\nlet interestRate = 0.06;\ninterestRate = interestRate\
  \ / 12;\ndocument.write(interestRate);\n```\n\n这段代码声明了一个值为 `0.06` 的变量 `interestRate`；然后它将其除以\
  \ 12 并将结果存储在变量中。接着 `document.write()` 语句显示该值。\n\n\n\n\n\n*   变量名的其余部分可以包含任何字母、数字或下划线。你不能使用任何其他字符，包括空格、符号和标点符号。\n\
  *   与 JavaScript 的其他部分一样，变量名是区分大小写的。也就是说，名为 `InterestRate` 的变量被视为与名为 `interestRate`\
  \ 的变量完全不同的变量。\n*   变量名的长度没有限制。\n*   你不能使用 JavaScript 的 `reserved words`（保留字）作为变量名（例如\
  \ `let`、`const`、`var`、`alert` 或 `prompt`）。所有的编程语言都有一些语言内部使用的词，这些词不能作为变量名，因为这样做会导致混乱（或更糟）。请查看本章稍后介绍“JavaScript\
  \ 保留字”以获取完整列表。\n\n#### 良好变量命名的建议\n\n声明变量的过程并不怎么费精力，但这并不意味着你应该随手输入脑子里想到的任何变量名。多花几秒钟时间，遵循这些指南想出一个好名字：\n\
  \n*   **让你的名称具有描述性。** 然，使用只有几个字符的名字会让它们更容易输入，但我向你保证，当你以后查看脚本时，你将忘记这些变量代表什么。例如，如果你想让一个变量代表账户，请使用\
  \ `accountNumber` 或 `accountNum`，而不是 `acnm` 或 `accnum`。\n*   ![记住](img/remember.png)\
  \ **尽量避免单字母命名。** 尽管最好避免单字母变量名，但在某些地方这种短名称是可以接受的，例如在构建循环时，正如第四部分第四章所示。\n*   **使用没有空格的单词。**\
  \ 创建描述性变量名的方法是使用多个单词。然而，因为 JavaScript 不允许名称中出现空格，你需要某种方法分隔单词以保持名称的可读性。使用多单词变量名的两种标准约定是\
  \ `camelCase`（驼峰命名法），将单词挤在一起并将第一个单词以外的所有单词字母大写（例如 `lastName`），或者用下划线分隔每个单词（例如 `last_name`）。我更喜欢前者，因此在整本书中一直使用它。\n\
  *   **使用不同的命名规范。** 为 JavaScript 变量使用一种命名规范，为 HTML 标识符和 CSS 类使用另一种规范。例如，如果你对 JavaScript\
  \ 变量使用 `camelCase`，则对 `id` 值和类名使用连字符。\n*   **将你的变量名与 JavaScript 关键字区分开。** 尽量让你的变量名看起来与\
  \ JavaScript 的关键字和其他内置术语（如 `alert`）尽可能不同。区分变量名有助于避免混乱——当你看到一个术语却不记得它是变量还是 JavaScript\
  \ 单词时，就会这种情况。\n*   **不要让你的名字太长。** 虽然应该摒弃短小且晦涩的变量名，转而使用更具描述性的名称，但这并不意味着你应该使用整个句子。极长的名字效率很低，因为输入的时间太长，而且它们很危险，因为名称越长，你就越容易拼写错误。2\
  \ 到 4 个单词、8 到 20 个字符的名字就足够。\n\n#### 理解字面量数据类型\n\n在编程中，变量的 `data type` 指定了变量中存储的数据类型。数据类型是一个核心概念，因为它不仅决定两个变量如何组合（例如在数学上），还决定了它们是否可以组合。`Literals`（字面量）是数据类型的一种特殊类型，它们涵盖了那些固定（即使是暂时的）的值。例如，考虑下面的变量赋值语句：\n\
  \n```\nlet todaysQuestion = \"What color is your parachute?\";\n```\n\n在这里，文本 `\"\
  What color is your parachute?\"` 是一个字符串字面值。JavaScript 支持三种字面量数据类型：数字、字符串和布尔（Boolean）。接下来的三个部分将讨论每种类型。\n\
  \n#### 使用数字字面量\n\n与许多其他编程语言不同，JavaScript 对所有数字视为相同，因此在处理两个基本数字字面量（整数和浮点数）时，你不需要任何特殊操作：\n\
  \n*   **整数：** 这些没有分数或小数部分的数字。因此，你使用一个或多个数字的序列来表示整数，例如这些示例：\n    ```\n    0\n   \
  \ 42\n    2001\n    -20\n    ```\n*   **浮点数：** 这些具有分数或小数部分的数字。因此，你通过先写整数部分，后面是小数点，然后是分数或小数部分来表示浮点数，例如这些示例：\n\
  \    ```\n    0.07\n    3.14159\n    -16.6666667\n    7.6543e+21\n    1.234567E-89\n\
  \    ```\n\n##### 指数计数法\n\n最后两个浮点数示例需要更多的解释。这两个使用了 `exponential notation`（指数计数法），这是一种表示非常大或非常小的浮点数的有效方法。指数计数法使用\
  \ `e`（或 `E`）后跟 `exponent`（指数），指数是一个带有加号（`+`）或减号（`-`）的数字。\n\n将数字部分（即 `e` 或 `E` 之前的部分）乘以\
  \ 10 的指数幂。这是一个例子：\n\n```\n9.87654e+5;\n```\n\n指数是 5，10 的 5 次方是 100,000。因此，将 9.87654\
  \ 乘以 100,000 得到值 987,654。\n\n这是另一个例子：\n\n```\n3.4567e-4;\n```\n\n指数是 -4，10 的 -4\
  \ 次方是 0.0001。因此，将 3.4567 乘以 0.0001 得到值 .00034567。\n\nJavaScript 拥有许多执行数学计算的内置功能。要获取这些细节，请查看第四部分第八章。\n\
  \n![技术细节](img/technicalstuff.png) 我之前提到 JavaScript 对所有数字字面量视为相同，实际上意味着 JavaScript\
  \ 将数字字面量视为浮点值。这是可以的（毕竟 2 和 2.0 之间没有实际区别），但这对你可以安全处理的最大值和最小值产生了限制。最大是 9007199254740992，最小是\
  \ -9007199254740992。如果你使用了范围之外的数字（虽然不太，但你永远不知道），JavaScript 将无法保持准确。一种解决方案是使用 BigInt\
  \ 值，可以通过在整数值末尾附加 `n` 或使用 `BigInt(value)`，其中 `value` 是一个包含大整数值的变量。\n\n##### 十进制整数值\n\
  \n在你大部分 JavaScript 职业生涯中，你可能一直在处理常用的十进制（基 10）数字系统。然而，以防你需要处理十六进制（基 16）数字，此节向你展示\
  \ JavaScript 如何处理它们。\n\n十六进制数字系统使用数字 0 到 9 和字母 `A` 到 `F`（或 `a` 到 `f`），这些字母代表十进制\
  \ 10 到 15。因此，十进制中的 16 在十六进制中实际上是 10。在 JavaScript 中指定十六进制数，以 `0x`（或 `0X`）开头，如下所示：\n\
  \n```\n0x23;\n0xff;\n0X10ce;\n```\n\n#### 使用字符串字面量\n\n*字符串字面量*是一个或多个字母、数字或标点符号的序列，包含在双引号（`\"\
  `）或单引号（`'`）中。以下示例：\n\n```\n\"HTML, CSS, and JavaScript\";\n'August 23, 1959';\n\"\
  \"\n\"What's the good word?\";\n```\n\n![记住](img/remember.png) 字符串 `\"\"`（或 `''`\
  \ —— 两个连续的单引号）被称为空字符串（null string）。它表示一个不包含任何字符的字符串。\n\n##### 在字符串中使用引号\n\n\n\n\n\
  前一节的最后一个示例表明，在由另一种引号（如 `\"`）括起的字符串内部插入一个或多个实例的某种引号（如 `'`）是允许的。当你需要将一个字符串嵌入另一个字符串中时，嵌套引号的能力会非常有用，这种情况非常常见（特别是在\
  \ HTML 标签中使用少量的 JavaScript 代码时）。这里有一个示例：\n\n```\nonsubmit=\"processForm('testing')\"\
  ;\n```\n\n然而，在字符串内部插入与封装该字符串相同的同一个或多个引号实例是非法的，如下例所示：\n\n```\n\"This is \"illegal\"\
  \ in JavaScript.\";\n```\n\n#### 理解转义序列\n\n如果你必须在一个由双引号括的字符串中包含一个双引号，该怎么办？嵌套相同类型的引号的情况很少见，但如果你在双引号之前加上一个反斜杠（`\\\
  `），它是可以实现的，如下：\n\n```\n\"The double quotation mark (\\\") encloses this string.\"\
  ;\n```\n\n`\\\"` 组合被称为 `转义序列`。你可以将反斜杠与其他字符组合形成其他的转义序列，每个序列都能让浏览器表示一个本身非法或无法通过其他方式表示的字符。表\
  \ 2-1 列出了最常用的转义序列。\n\n| 转义序列 | 它代表的字符 |\n| --- | --- |\n| `\\'` | 单引号 |\n| `\\\"\
  ` | 双引号 |\n| `\\b` | 退格符 |\n| `\\f` | 换页 |\n| `\\n` | 换行 |\n| `\\r` | 回车 |\n| `\\\
  t` | 制表符 |\n| `\\\\` | 反斜杠 |\n\n表 2-1 常见的 JavaScript 转义序列\n\n以下代码显示了一个示例脚本，它使用 `\\\
  n` 转义序列在警框框中显示多行文本。\n\n```\nalert(\"This is line 1.\\nSo what. This is line 2.\"\
  );\n```\n\n图 2-4 显示了结果。\n\n要学习如何组合两个或多个字符串字面量，请查看第 4 本第 3 章。此外，JavaScript 有一组很好的字符串处理功能，我在第\
  \ 4 本第 8 章 中讨论了它们。\n\n![使用 \\n 转义序列允许你格式化文本以便在不同的行显示。](img/9781394164684-fg040204.png)\n\
  \n图 2-4： 使用 `\\n` 转义序列允许你格式化文本以便在不同的行显示。\n\n#### 使用布尔字面量\n\n布尔是所有字面数据类型中最简单的，因为它们只能取两个值之一：`true`\
  \ 或 `false`。这种简单可能让布尔值看起来并不特别有用，但在 JavaScript 编程中，测试特定变量或条件是否为真或为假是非常无价的。\n\n你可以直接将布尔字面量赋值给变量，如下：\n\
  \n```\ntaskCompleted = true;\n```\n\n或者，你可以使用表达式隐式地处理布尔值：\n\n```\ncurrentMonth ===\
  \ \"August\"\n```\n\n比较表达式 `currentMonth === \"August\"` 询问：变量 `currentMonth` 的值是否等于字符串\
  \ `\"August\"`？如果是，该表达式的求值结果布尔值 `true`；如果不是，该表达式的求值结果 `false`。我在第 4 本第 3 章 中讨论了更多关于比较表达式的内容。\n\
  \n### JavaScript 保留字\n\n如前面提到的，JavaScript 有许多在命名变量时需要避免的保留字。表 2-2 给出了 JavaScript\
  \ 保留字的列表。将这些词中的任何一个用作变量名或函数名是非法的。\n\n| `abstract` | `arguments` | `await` | `boolean`\
  \ |\n| `break` | `byte` | `case` | `catch` |\n| `char` | `class` | `const` | `continue`\
  \ |\n| `debugger` | `default` | `delete` | `do` |\n| `double` | `else` | `enum`\
  \ | `eval` |\n| `export` | `extends` | `false` | `final` |\n| `finally` | `float`\
  \ | `for` | `function` |\n| `goto` | `if` | `implements` | `import` |\n| `in` |\
  \ `instanceof` | `int` | `interface` |\n| `let` | `long` | `native` | `new` |\n\
  | `null` | `package` | `private` | `protected` |\n| `public` | `return` | `short`\
  \ | `static` |\n| `super` | `switch` | `synchronized` | `this` |\n| `throw` | `throws`\
  \ | `transient` | `true` |\n| `try` | `typeof` | `var` | `void` |\n| `volatile`\
  \ | `while` | `with` | `yield` |\n\n表 2-2 JavaScript 的保留字\n\n### JavaScript 和 HTML\
  \ 关键字\n\n表 2-3 列出了 JavaScript 和 HTML 中使用的完整关键字列表，你应该避免将它们用作变量和函数名。使用这些词并非非法，但在它们自然的栖息之外使用它们可能会导致混淆。\n\
  \n| `alert` | `all` | `anchor` | `anchors` |\n| `area` | `Array` | `assign` | `blur`\
  \ |\n| `button` | `checkbox` | `clearInterval` | `clearTimeout` |\n| `clientInformation`\
  \ | `close` | `closed` | `confirm` |\n| `constructor` | `crypto` | `Date` | `decodeURI`\
  \ |\n| `decodeURIComponent` | `defaultStatus` | `document` | `element` |\n| `elements`\
  \ | `embed` | `embeds` | `encodeURI` |\n| `encodeURIComponent` | `escape` | `eval`\
  \ | `event` |\n| `fileUpload` | `focus` | `form` | `forms` |\n| `frame` | `frameRate`\
  \ | `frames` | `function` |\n| `hasOwnProperty` | `hidden` | `history` | `image`\
  \ |\n| `images` | `Infinity` | `innerHeight` | `innerWidth` |\n| `isFinite` | `isNaN`\
  \ | `isPrototypeOf` | `layer` |\n| `layers` | `length` | `link` | `location` |\n\
  | `Math` | `mimeTypes` | `name` | `NaN` |\n| `navigate` | `navigator` | `Number`\
  \ | `Object` |\n| `offscreenBuffering` | `onblur` | `onclick` | `onerror` |\n| `onfocus`\
  \ | `onkeydown` | `onkeypress` | `onkeyup` |\n| `onload` | `onmousedown` | `onmouseover`\
  \ | `onmouseup` |\n| `onsubmit` | `open` | `opener` | `option` |\n| `outerHeight`\
  \ | `outerWidth` | `packages` | `pageXOffset` |\n| `pageYOffset` | `parent` | `parseFloat`\
  \ | `parseInt` |\n| `password` | `pkcs1` | `plugin` | `prompt` |\n| `propertyIsEnum`\
  \ | `prototype` | `radio` | `reset` |\n| `screenX` | `screenY` | `scroll` | `secure`\
  \ |\n| `select` | `self` | `setInterval` | `setTimeout` |\n| `status` | `String`\
  \ | `submit` | `taint` |\n| `text` | `textarea` | `top` | `toString` |\n| `undefined`\
