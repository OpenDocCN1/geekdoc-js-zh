  \ | 视口宽度的 1/100 |\n| `vh` | 视口高度 | 视口高度的 1/100 |\n| `vmin` | 视口最小 | 视口较小维度的 1/100\
  \ |\n| `vmax` | 视口最大 | 视口较大维度的 1/100 |\n\n（注：后续重复内容已按要求剔除）\n\n\n\n这样的计算适用于正文。对于标题，你可能需要一些尝试以找到适合你页面的样式。例如，`h1`\
  \ 元素可以使用以下声明：\n\n```css\nfont-size: calc(1.75rem + 2vmax);\n```\n\n#### 介绍你最流体的好朋友：`clamp()`\n\
  \n使用视口单位（viewport units）处理长度和字体大小的问题在于，你会失去对所处理属性的最终值的部分控制权。当然，这是设计使然的，因为流式布局的价值所在之一就是将部分控制权交给浏览器，让它承担更多响应式设计的繁重工作。\n\
  \n然而，基于视口的尺寸，虽然在中间屏幕尺寸下看起来良好，但在最小的视口宽度下可能会小到无法阅读，而在面对最大的视口时则会变得大得滑稽。幸运的是，你可以转向强大的\
  \ `clamp()` 函数（查看第 3 本，第 5 章）来为你的流式计算设置最小值和最大值。例如，如果你希望正文的最小尺寸是 `1.25rem`，最大尺寸是\
  \ `1.75rem`，那么以下 `clamp()` 函数将胜任（0504/example6.html）：\n\n```css\nfont-size: clamp(1.25rem,\
  \ 2vmax, 1.75rem);\n```\n\n### 通过查询实现响应式：自适应布局\n\n在第 4 本 第 4 章 中，我讨论了如何使用 `if...else`\
  \ 语句来控制布局，如果指定表达式为真，脚本运行一段代码；如果为假，则运行另一段代码。CSS 有一种被称为“查询”（query）的东西，你在其中测试特定条件，如果条件为真，浏览器将应用一个或多个样式；如果为假，浏览器将跳过这些样式。（因此，查询就像是一个没有\
  \ `else` 部分的 `if` 语句。）\n\nCSS 提供了许多查询类型，但对于你这里的目的，你可以只考虑以下三种：\n\n- 媒体查询（Media query）：询问屏幕某些方面的查询，通常是视口宽度。\n\
  - 容器查询（Container query）：检查父元素或祖先元素特征的查询，例如元素的宽度或方向。\n- 用户偏好查询（User preference query）：一种特殊的媒体查询，用于检查用户是否声明了对特定功能（如深色模式）的偏好。\n\
  \n在每种情况下，关键在于使用查询创建一个根据查询结果而改变的自适应布局。这使得自适应布局比流式布局更强大，因为当查询为真时，你可以应用任何 CSS 规则：\n\
  \n- 你隐藏一个元素或显示一个隐藏的元素。\n- 你修改现有布局，例如将三列网格改为单列网格。\n- 你切换到完全不同的布局，例如从 Grid 切换到 Flexbox。\n\
  - 如果你使用 Flexbox，你可以更改元素的顺序。\n- 你修改任何 CSS 属性，如 `font-size`、`width` 和 `margin`。\n\n\
  #### 使用媒体查询询问屏幕\n\n到为止最常见的自适应布局类型使用一种名为媒体查询的 CSS 特性，这是一个 `@media` 规则，是一个评估为真或假的表达式以及由一个或多个样式规则组成的代码块。表达式询问视口的某些特征，通常是其宽度。如果表达式对当前设备为真，浏览器将应用媒体查询的样式规则；如果为假，浏览器将忽略媒体查询的规则。其语法如下：\n\
  \n```css\n@media (expression) {\n  declarations\n}\n```\n\n- `expression`：浏览器用于测试当前设备的属性-值对。\n\
  - `declarations`：当表达式为真时浏览器应用的样式声明。\n\n`expression` 有许多不同的可能性，但绝大多数媒体查询测试的视口宽度小于或等于某个值，或大于等于某个值。要测试视口宽度大于或等于某个值，请使用\
  \ `min-width` 属性：\n\n```css\n@media (min-width: value) {\n  declarations\n}\n```\n\
  \n- `value`：使用任何标准 CSS 单位的长度值。\n\n要测试视口宽度小于或等于某个值，请使用 `max-width` 属性：\n\n```css\n\
  @media (max-width: value) {\n  declarations\n}\n```\n\n- `value`：使用任何标准 CSS 单位的长度值。\n\
  \n这是一个示例（0504/example07.html）：\n\n```html\n<header>\n  <img src=\"images/notw.png\"\
  \ alt=\"News of the Word logo\" class=\"site-logo\">\n  <h1>News of the Word</h1>\n\
  \  <p class=\"subtitle\">Language you won't find anywhere else (for good reason!)</p>\n\
  </header>\n```\n\n```css\n@media (max-width: 40rem) {\n  .site-logo {\n    display:\
  \ none;\n  }\n}\n```\n\n此媒体查询查找 `40rem` 或更小的视口宽度。当其为真时，媒体查询块内部的规则运行，将 `header` 图像的\
  \ `display` 属性设置为 `none`（该图像使用了 `site-logo` 类）。如图 4-8 所示，logo 在平板电脑尺寸的视口中出现，但在图\
  \ 4-9 所示的手机尺寸视口中不出现。\n\n![头部 logo 在平板尺寸视口中出现的截图。](img/9781394164684-fg050408.png)\n\
  \n图 4-8： 头部 logo 在平板尺寸的视口中出现。\n\n![手机尺寸视口的截图，媒体查询表达式为真，因此头部 logo 被隐藏。](img/9781394164684-fg050409.png)\n\
  \n图 4-9： 在手机尺寸的视口上，媒体查询表达式为真，因此头部 logo 被隐藏。\n\n![提示](img/tip.png) 你可以在媒体查询中指定多个表达式。例如，如果你用关键字\
  \ `and` 分隔表达式，只有当所有表达式都为真时，浏览器才会应用样式规则：\n\n```css\n@media (expression1) and (expression2)\
  \ {\n  declarations\n}\n```\n\n同样，如果你用关键字 `or` 分隔表达式，那么当一个或多个表达式为真时，浏览器将应用样式规则：\n\
  \n```css\n@media (expression1) or (expression2) {\n  declarations\n}\n```\n\n例如，如果你想针对\
  \ `40rem` 到 `60rem` 之间的视口尺寸，你可以这样做：\n\n```css\n@media (min-width: 40rem) and (max-width:\
  \ 60rem) {\n  declarations\n}\n```\n\n#### 使用容器查询布局“树木”而非“森林”\n\n我在前一节中提到的媒体查询至少从\
  \ 2009 年以来就是 CSS 布局的主流，并且受到了 Internet Explorer 9 及更高版本的支持。媒体查询相比于我之前介绍的流式技术的主要优势是，当媒体查询表达式为真时，你可以编写非常具体的样式规则，让浏览器应用于一个或多个元素。\n\
  \n但媒体查询虽然仍然有用且相关，由于以下两个原因已开始显显老态：\n\n- 媒体查询几乎总是询问整个视口的大小。\n- 现代 Web 设计关注“组件”（component）的概念，它是一组独立的元素集合，特别是那些在不同上下文下被复用的元素。\n\
  \n例如，一个产品组件可能包含产品照片、一个带有产品名称的标题、描述产品的正文以及与产品相关的动作按钮。以下是该组件可能使用的一些示例上下文：\n\n- 在产品落地页上，此组件可能占据视口的大部分。\n\
  - 在网站首页上，该产品可能会以大卡片形式展示。\n\n\n\n\n\n*   在产品目录页面上，组件可能是一个中尺寸的卡片。\n*   在网站的导航侧边栏中，组件可能是一个小卡片，也许没有图片。\n\
  \n这些不同的场景需要组件有不同的布局。媒体查询在这种场景下工作并不良好，因为它们只检查整个视口的大小，而在上述的每个场景中，视口的大小可能不会发生变化。\n\n\
  因此，整个 CSS 社区对一种名为`container queries`（容器查询）的新型自适应布局技术感到兴奋也并不奇。这些查询允许你检查父元素的宽度（以及其他几个属性，这个元素就是这些查询命名的来源），并且每当该宽度（或任何属性）满足你指定的标准时，对子元素和后代元素应用样式规则。\n\
  \n例如，假设你的产品组件被封装在一个父元素（如 `div`）中，那么容器查询将检查例如该 `div` 的宽度，并根据结果对子元素和后代元素——图片、标题、文本和链接——应用不同的样式。\n\
  \n![Warning](img/warning.png) 在我写这段文字时，容器查询才刚刚被所有主流浏览器支持，因此它们还没有准备好投入生产环境。然而，当你读到这里时，容器查询可能已经几乎全范围内支持（例如，超过\
  \ 90%），所以请查看以下 Can I Use 页面以了解最新进展：[`https://caniuse.com/css-container-queries`](https://caniuse.com/css-container-queries)。\n\
  \n#### 设置查询容器\n\n要使用容器查询，你首先需要将一个元素设置为查询容器。它将是你想要样式的子元素或后代元素的父元素或祖先。要将元素设置为查询容器，请使用\
  \ `container-type` 属性：\n\n```css\n`element` {\n  container-type: `value`;\n}\n```\n\
  \n*   `element`: 你想要样元素的父元素或祖先。\n*   `value`: 如果你在容器查询中只想检查容器的宽度（假设水平内联方向），请使用 `inline-size`。如果你想在容器查询中检查宽度和/或高度，请使用\
  \ `size`。\n\n这是一个示例 (`bk05ch04/example08.html`)，它为产品卡片设置了默认布局：\n\nHTML:\n```html\n\
  <div class=\"card-container\">\n  <div class=\"card-wrapper\">\n    <img class=\"\
  card-image\" src=\"images/inflatable-dartboard.png\" alt=\"充气飞镖盘产品照片\">\n    <div>\n\
  \      <h3 class=\"card-title\">充气飞镖盘</h3>\n      <p class=\"card-description\"\
  >\n        是的，这就是世界闻名的充气飞镖盘！安装无需烦恼！带有一个易于使用的充气管。只需深吸气并吹。继续吹。继续。总之，在几小时内，你就可以准备好玩飞镖了。现在仅需\
  \ 1,999 美！补丁包单独出售。\n      </p>\n      <div class=\"card-actions\">\n        <button\
  \ class=\"card-button learn-more\">了解更多</button>\n        <button class=\"card-button\
  \ add-to-cart\">加入购物车</button>\n      </div>\n    </div>\n  </div>\n</div>\n```\n\
  \nCSS:\n```css\n.card-container {\n  container-type: inline-size;\n}\n.card-wrapper\
  \ {\n  display: grid;\n  gap: 1.5rem;\n  grid-template-columns: auto auto;\n  grid-template-rows:\
  \ auto;\n}\n.card-image {\n  min-width: auto;\n  height: auto;\n  object-fit: cover;\n\
  \  object-position: center;\n  overflow: hidden;\n}\n.card-title {\n  text-align:\
  \ left;\n}\n.card-actions {\n  display: flex;\n  gap: 1rem;\n  justify-content:\
  \ flex-start;\n}\n```\n\n特别感兴趣的是类为 `card-container` 的父 `div`。该 `div` 在 CSS 中被设置为查询容器：\n\
  \n```css\n.card-container {\n  container-type: inline-size;\n}\n```\n\n图 4-10 显示了默认卡片。\n\
  \n![默认布局的产品卡片截图](img/9781394164684-fg05010.png)\n\n图 4-10: 默认布局的产品卡片。\n\n![提示](img/tip.png)\
  \ 我应该指出，如果你想在页面上有多个查询容器，你需要通过添加 `container-name` 属性为每个容器命名：\n\n```css\n`element`\
  \ {\n  container-type: `value`;\n  container-name: `name`;\n}\n```\n\n#### 查询容器\n\
  \n设置好容器后，你就可以使用 `@container` 规则对其进行查询：\n\n```css\n@container (`expression`) {\n\
  \  `declarations`\n}\n```\n\n*   `expression`: 浏览器用于测试某些属性（如宽度）的表达式。\n*   `declarations`:\
  \ 如果 `expression` 为真，浏览器应用的样式声明。\n\n例如，这里有一个容器查询，当容器宽度小于 `25rem` 时应用样式规则：\n\n```css\n\
  @container (width < 25rem) {\n  .card-wrapper {\n    align-items: center;\n    display:\
  \ block;\n    padding: 1rem;\n  }\n  .card-image {\n    display: none;\n  }\n  .card-title\
  \ {\n    margin-top: 0;\n  }\n}\n```\n\n图 4-11 显示了容器小于 `25rem` 时的结果卡片。\n\n![父元素小于\
  \ 25rem 的卡片布局截图](img/9781394164684-fg05011.png)\n\n图 4-11: 父元素小于 25rem 时的卡片布局。\n\
  \n与媒体查询一样，你可以在容器查询中使用多个表达式。使用 `and` 分隔表达式在所有表达式均为真时应用规则；使用 `or` 分隔表达式在至少一个表达式为真时应用规则。\n\
  \n这里有一个产品卡片的容器查询，当容器宽度大于 `25rem` 且小于 `35rem` 时应用样式规则：\n\n```css\n@container (width\
  \ > 25rem) and (width < 35rem) {\n  .card-wrapper {\n    grid-template-columns:\
  \ auto;\n    grid-template-rows: auto auto;\n  }\n  .card-image {\n    width: 100%;\n\
  \    height: 10rem;\n  }\n  .card-title {\n    text-align: center;\n  }\n  .card-actions\
  \ {\n    justify-content: center;\n  }\n}\n```\n\n图 4-12 显示了容器在 `25rem` 到 `35rem`\
  \ 之间的结果卡片布局。\n\n![父元素在 25rem 到 35rem 之间的卡片布局截图](img/9781394164684-fg05012.png)\n\
  \n图 4-12: 父元素在 25rem 到 35rem 之间的卡片布局。\n\n#### 使用容器查询单位\n\n在你将一个元素设置为查询容器后，你就可以自由地使用`容器查询单位`来调整该元素子元素和后代元素的大小，这些测量单位是相对于查询容器尺寸的。表\
  \ 4-3 列出了你可以使用的容器查询单位。\n\n| **单位** | **名称** | **测量对象** |\n| --- | --- | --- |\n\
  | `cqw` | 容器宽度 | 容器宽度的 1/100 |\n| `cqh` | 容器高度 | 容器高度的 1/100 |\n| `cqmin` | 容器最小值\
  \ | 容器较小维度的 1/100 |\n| `cqmax` | 容器最大值 | 容器较大维度的 1/100 |\n\n表 4-3 CSS 容器查询测量单位\n\
  \n通过操作系统的设置，用户可以表达对其设备外观和运行的某些偏好。例如，许多人选择浅色方案或深色方案，如图 4-13 所示。\n\n![在 macOS 中选择浅色方案或深色方案的截图](img/9781394164684-fg05013.png)\n\
  \n\n\n\n你可以使用 CSS 媒体查询来检测这些用户偏好中的，并据此设置页面样式。以下是通用语法：\n\n```css\n@media (preference:value)\
  \ {\n  declarations\n}\n```\n\n*   `preference`: 一个关键字，用于指定你正在检测哪种偏好。\n*   `value`:\
  \ 查询正在查找的偏好设置。\n*   `declarations`: 当 `preference` 匹配 `value` 时，浏览器将应用的样式声明。\n\n\
  尽管未来会有更多偏好问世，但目前你可以检测到三个。以下是相关的关键字和值：\n\n*   `prefers-color-scheme`: 检测用户是否设置了颜色方案的偏好。你可以查询的两个值是\
  \ `dark`（深色）或 `light`（浅色）。这里的通常做法是假设使用浅色颜色方案来设置页面，然后使用类似下面的代码，在检测到深色颜色方案偏好时应用更深色的颜色：\n\
  \n    ```css\n    @media (prefers-color-scheme: dark) {\n      /* 深色颜色方案的颜色放在这里\
  \ */\n    }\n    ```\n    ![Tip](img/tip.png) 如果你使用 `hsl()` 函数处理颜色，将一种浅色转换为深色变体的一种简单方法是从\
  \ 100 中减去亮度值，同时保持色相和饱和度值。例如，如果浅色是 `hsl(180deg 50% 80%)`，相应的深色模式颜色将是 `hsl(180deg\
  \ 50% 20%)`。\n\n*   `prefers-contrast`: 检测用户是否设置了使用更高或更低对比度颜色的偏好。你可以查询的值有 `no-preference`（用户未设置对比度偏好）、`more`（用户倾向于高对比度）、`less`（用户倾向于低对比度）或\
  \ `custom`（用户设置了自定义对比度水平）。大多数设置此项偏好的用户都倾向于高对比度颜色，你可以按照如下方式进行检测：\n\n    ```css\n\
  \    @media (prefers-contrast: more) {\n      /* 高对比度颜色放在这里 */\n    }\n    ```\n\
  *   `prefers-reduced-motion`: 检测用户是否设置了减少动画效果和屏幕上类似的非本质运动的偏好。你可以查询的值有 `no-preference`（用户未设置减少运动偏好）或\
  \ `reduced`（用户倾向于减少运动）。这里是一个媒体查询，用于检测用户是否倾向于减少运动，如果是，则将所有动画设置为最小值：\n\n    ```css\n\
  \    @media (prefers-reduced-motion: reduce) {\n      *,\n      ::after,\n     \
  \ ::before {\n        animation-duration: 0.01ms;\n        animation-iteration-count:\
  \ 1;\n        transition-duration: 0.01ms;\n        scroll-behavior: auto;\n   \
  \   }\n    }\n    ```\n\n![Tip](img/tip.png) ![image](img/9781394164684-ma009.png)\
  \ 你可以使用浏览器开发者工具来测试这些偏好，而无需在操作系统的设置应用中反复切换它们。在 Chrome 中，打开开发者工具，点击“自定义并控制开发者工具”图标（显示在边距中），选择“更多工具\
  \ ⇒  渲染”，然后使用模拟每个用户偏好的控件。\n\n### 响应式处理图像\n\n在规划网页时，你始终需要考虑图像的影响，包括对你的设计和对用户的影响。\n\
  \n#### 使图像响应式\n\n在设计方面，你需要确保图像能够根据屏幕宽度或高度进行响应式缩放。例如，如果用户的屏幕宽度为 1024 像素，一张宽度为 800\
  \ 像素的图像将没有问题地适应，但同一张图像将溢出 400 像素宽的屏幕。使用以下 CSS 规则创建响应式图像：\n\n```css\nimage {\n  max-width:\
  \ 100%;\n  height: auto;\n}\n```\n\n在这里，`image` 是引用你想要响应式的图像或多个图像的选择器。设置 `max-width:\
  \ 100%` 允许图像宽度随视口（或图像容器）的大小变化而缩小或放大，但同时也强制图像缩放比例不能大于其原始宽度。设置 `height: auto` 则引导浏览器通过根据图像当前宽度自动计算高度，以保持图像的原始比例。\n\
  \n![Tip](img/tip.png) 有时，你可能希望图像的高度而不是宽度是响应式的。要做到这一点，你对前面的规则使用以下变体：\n\n```css\n\
  image {\n  max-height: 100%;\n  width: auto;\n}\n```\n\n#### 响应式交付图像\n\n在用户端，交付远大于屏幕尺寸的图像可能会是一个大问题。当然，你可以让图像响应式，但你仍然在网络中传输一个巨大的文件，对于那些使用慢连接和有限流量套餐的移动用户来说，这并不受欢迎。\n\
  \n相反，你需要向用户交付与设备屏幕大小合适的图像文件版本。例如，你可能为桌面用户交付全尺寸图像，为平板用户交付中尺寸版本，为智能手机用户交付小版本。这听起来像是一项复杂的业务，但\
  \ HTML5 让你可以在 `<img>` 标签中轻松地处理一切。秘密在于？`sizes` 和 `srcset` 属性。\n\n![Remember](img/remember.png)\
  \ `sizes` 属性是 `expression-width` 对的集合：\n\n*   `expression` 部分指定屏幕特征，例如最小或最大宽度，并用括号包裹。\n\
  *   `width` 部分指定在匹配 `expression` 的屏幕上你希望显示的宽度。\n\n例如，为了指定在 600 像素以内的屏幕上宽度为 `90vw`，你需要使用以下\
  \ expression-width 对：\n\n典型的 `sizes` 属性是用逗号分隔的 `expression-width` 对。这里是使用的通用语法：\n\
  \n```html\nsizes=\"(expression1)width1,\n(expression2)width2,\netc.\"\n```\n\n注意最后一个项没有\
  \ expression。这告诉浏览器指定的宽度适用于不匹配任何 `expression` 的屏幕。\n\n这里有一个例子：\n\n```html\nsizes=\"\
  (max-width: 600px) 90vw,\n(max-width: 1000px) 60vw,\n30vw\"\n```\n\n![Remember](img/remember.png)\
  \ `srcset` 属性是图像文件位置的逗号列表，每个位置后面跟着图像宽度和字母 `w`。这里是通用语法：\n\n```html\nsrcset=\"location1width1,\n\
  location2width2,\netc.\"\n```\n\n这为浏览器提供了尺寸选择，它根据你在 `sizes` 中指定的建议宽度选择最佳的一个。这是一个完整的示例，图\
  \ 4-14 显示了浏览器如何为不同的屏幕提供不同的图像：\n\n```html\n<img src=\"/images/img-small.jpg\" alt=\"\
  \"\n  sizes=\"(max-width: 600px) 90vw,\n  (max-width: 1000px) 60vw,\n  30vw\"\n\
  \  srcset=\"/images/img-small.jpg 450w,\n  /images/img-medium.jpg 900w,\n  /images/img-large.jpg\
  \ 1350w\">\n```\n\n![带有 <img> 标签的 `sizes` 和 `srcset` 属性的截图，浏览器为不同的屏幕提供不同版本的图像。](img/9781394164684-fg050414.png)\n\
  \n图 4-14：  <img> 标签的 `sizes` 和 `srcset` 属性，浏览器为不同的屏幕提供不同版本的图像。\n\n### 探索移动优先开发的原则\n\
  \n\n\n\n\n如果你在网络上混迹了一段时间，可能还记得那些日子：你使用智能手机或类似的便携设备等小屏幕访问网站时，获取到的不是网站的普通版本，而是“移动端”版本。在少数情况下，这种替代版本会针对移动端的查看和导航进行优化，但更多情况下，它只是普通网站的一个拙劣仿品，更改了一些字体，并删除了所有有趣且实用的功能。\n\
  \n从 Web 开发者的角度来看，这些移动端网站的低质量并不令人意外。毕竟，谁想构建并维护两个版本的同一个网站呢？幸运的是，需要完全不同的网站来支持移动用户的时代早已一去了。是的，使用响应式\
  \ Web 设计可以让你创建一个站点，它在从墙挂显示器到手持设备的所有设备上都能表现良好且运行流畅。但在现代 Web 开发中，有一个强力的理由认为，所有的网页都应该从零开始构建，就像它们将只显示在移动设备上一样。在本章的剩余部分，你将探索这种移动优先\
  \ Web 开发方法背后的原理和技术。\n\n#### 什么是移动优先 Web 开发？\n\n正如我在本章早期讨论的那样，当你开发一个网页，使其在桌面尺寸的屏幕上看起来良好且运行良好时，你可以采用许多响应式技巧，让相同的代码在移动设备屏幕上同样看起来良好且运行良好：\n\
  \n*   设置一个 `Flexbox` 或 `Grid` 布局，它可以自动适应任何尺寸的屏幕。\n*   使用 `viewport units`（视单位），特别是在字体大小上。\n\
  *   使用 `media queries`（媒体查询）在屏幕宽度低于指定阈值时移除元素。\n\n![Remember](img/remember.png) 这第三种技术——即移除不适合小屏幕的元素——在\
  \ Web 代码行业中被称为 `regressive enhancement`（回归性增强，`RE`）。`RE` 统治了 Web 开发世界多年，但最近对其出现了反弹。原因如下：\n\
  \n*   `RE` 将移动端屏幕降级为二等网络公民。\n*   `RE` 导致了缺乏规范的开发，因为程序员和设计师不可避免地会将桌面尺寸的屏幕塞满内容、小组件以及各种\
  \ Web 花点缀。\n\n![Remember](img/remember.png) 解决方案是什么？你现在可能猜到了：`progressive enhancement`（渐进式增强），这意味着从你需要支持的最小屏幕尺寸能够容纳的内容开始，然后随着屏幕变大逐步添加组件。当原始内容代表了你页面的核心本质，并且当基础屏幕宽度针对移动设备（尤其是今天最流行的智能手机）进行了优化时，你就拥有了一套`mobile-first`的\
  \ Web 开发方法。\n\n让我开门见山地说：移动优先 Web 开发是令人畏惧的，因为如果你习惯了在桌面屏幕巨大的画布上进行创作，转而从一个宽度仅为 360\
  \ 或 400 像素的屏幕开始可能会感到有些幽闭。然而，我可以向你保证，之所以看起来是，仅仅是因为人们天性地好奇你到底如何将你庞大的页面挤进如此狭小的空间。移动优先思维采取了相反的方法，即忽略（至少在开始时）大屏幕，而是关注最适合移动端屏幕的内容，毕竟，移动端代表了你大部分的访问者。以移动优先的方式思考并不困难：它只是意味着记住几个关键的设计原则。\n\
  \n#### 移动优先意味着内容优先\n\n采用移动优先 Web 开发方法的最大优势之一是，它迫使你进行优先级排序。也就是说，移动优先的设计意味着在初始布局中只包含对用户页面体验至关重要的页面元素。这种“仅保留核心内容”的想法部分是为了应对较小的屏幕尺寸来显示这些内容，但对于许多在使用网络连接缓慢且流量套餐有限的移动用户来说，这也是必要的。你的工作——不，改掉，这是你作为一个尽职的\
  \ Web 开发者的`duty`——是确保那些用户不会看到任何多余、轻浮或以其他方式非必要的内容。\n\n这些都很好，我听到你在想，但请定义一下什么是“多余”和“轻浮”。问得好。当然，问题在于，一个\
  \ Web 开发者的无不足道小菜可能是另一个人的核心主食。只有你能够根据你的页面目标和潜在受众，决定什么是无关紧要的，什么是至关重要的。\n\n所以，迈向移动优先设计的第一步是决定以下内容类别中什么是最重要的：\n\
  \n*   ![Remember](img/remember.png) **文本：** 决定哪些词对于传达你的页面信息是必要的。易用性专家 Steve Krug\
  \ 告诉 Web 设计师：“删掉每个页面一半的词，然后再删掉剩余部分的一半。”对于移动优先的页面，你可能需要再次减半字数。要狠。用户真的需要来自 CEO 的信息或你的“关于我们”文本吗？可能不需要。\n\
  *   **图像：** 决定哪些图像对用户来说是必要的，或者是否根本不需要任何图像。图像的问题在于，虽然每个人都喜欢一点视觉享受，但这种甜美是以屏幕空间和带宽为代价的。如果你确实需要在你的移动优先页面中包含一两张图像，至少为移动访问者提供较小的图像。要学习如何这样做，请查看本章早前的`Working\
  \ with images responsively`。\n*   **导航：** 所有用户都需要能够导航你的网站，但最近的趋势是创建包含每个章节和页面的巨大菜单。决定哪些链接对导航真正重要，并将它们包含在你的移动优先布局中。\n\
  *   **小组件：** 现代网页充满了社交媒体、内容滚动条、灯箱、自动视频播放以及广告。移动用户想要内容优先，所以考虑完全放弃小组件。如果你真的需要包含某个组件，并且确定它不会给页面加载时间或用户带宽造成过大负担，请将其推到页面底部。\n\
  \n\n\n\n\n当你准备好开始为页面编写 CSS 时，请记住你编写的样式定义和规则将成为你页面的默认样式——也就是说，这些是浏览器在所有设备上显示的样式，除非你定义了一个或多个媒体查询（或容器查询）来覆盖这些默认值。只要你遵循响应式网页设计的几项基本原则，就不需要编写任何特殊规则：\n\
  \n*   ![记住](img/remember.png) 使用视口单位（viewport units）测量宽度和内边距。\n*   字体大小使用 `rem`\
  \ 单位。\n*   让你的所有图片都是响应式的。\n*   使用 Grid 或 Flexbox 进行页面布局。如果你使用 Flexbox，请确保对任何 flex\
  \ 容器应用 `flex-wrap: wrap`。\n\n此外，确保你的移动优先布局渲染内容的方式与你希望在移动屏幕上显示的方式一致也是重要的。这意味着要避免任何技巧，例如使用\
  \ Flexbox 的 `order` 属性来打乱页面元素的顺序。\n\n最后，也许最重要的一点，务必通过对该内容设置 `display: none` 来隐藏任何不需要的内容。\n\
  \n最终，你的移动优先 CSS 应该是简单且高效的典范。\n\n#### 为你的内容选择一个合理的“非移动端”断点\n\n你的移动优先 CSS 代码可能包含几个你用\
  \ `display: none` 隐藏的元素。我假设你最终会显示这些元素（否则你会直接把它们删掉），因此你需要决定在何时显示它们。具体来说，你需要决定能够成功显示你内容的最小屏幕宽度。\n\
  \n注意，我并没有说你应该根据目标设备的宽度来决定何时显示隐藏内容。例如，多年来，开发者认为屏幕只要至少与 iPad 竖屏模式下的屏幕一样宽就是“足够宽”，而这在很长一段时间内是\
  \ 768 像素。这很有道理，尽管 iPad mini 仍然使用该宽度，但新的 iPad 现在宽得多（例如，iPad Pro 在竖屏模式下宽度为 1024 像素）。\n\
  \n![提示](img/tip.png) 设备不断变化，试图跟上它们是愚蠢的。忘记掉这些吧。相反，决定当隐藏内容可见时，你的页面最最小宽度是多少。你如何做到这一点？这里有一个简单的方法：\n\
  \n1.  **在 Chrome 浏览器中加载你的页面。**\n2.  **显示 Chrome 开发者工具。**\n    按下 `Ctrl+Shift+I`\
  \ (Windows) 或 `⌘  +Shift+I` (Mac)。\n3.  **使用鼠标调整浏览器窗口的大小：**\n    *   如果开发者工具位于浏览器视口下方或未停靠，拖动浏览器窗口的右边缘或左边缘。\n\
  \    *   如果开发者工具停靠在浏览器视口的右侧或左侧，拖动分离开发者工具与视口的垂直条。\n4.  **读取当前的视口尺寸，Chrome 显示在视口的右上角。**\n\
  \    尺寸以像素为单位宽 x 高的形式显示。\n5.  **将窗口缩小到你的移动优先测试宽度（例如 360px）。**\n6.  **增加宽度，并在增加的过程中观察布局如何变化。**\n\
  \    特别要关注内容第一次看起来像你希望在大屏幕上呈现的样子的宽度。记下那个宽度。\n\n![记住](img/remember.png) 你的完整内容看起来良好的宽度就是\
  \ CSS 媒体查询断点的基础，你将它来显示在移动优先布局中隐藏的元素。例如，假设你的移动优先布局隐藏了 `aside` 元素，并且你发现完整内容在宽度为 `742px`\
  \ 时看起来很合适。你就可以设置以下媒体查询（使用 `750px` 取整数）：\n\n```css\n@media (min-width: 750px) {\n\
  aside {\n  display: block;\n}\n}\n```\n\n此媒体查询告诉浏览器，当屏幕宽度为 `750px` 或更多时，显示 `aside`\
  \ 元素。\n\n## 索引\n\n### 符号\n\n*   `+` (加法运算符), 430, 613–614\n*   `&` (与符号), 109\n\
