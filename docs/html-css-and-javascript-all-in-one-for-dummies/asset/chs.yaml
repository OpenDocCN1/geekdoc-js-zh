- "# 傻瓜的 HTML、CSS 和 JavaScript 全能指南\n\n### 引言\n\n多年来，我与许多聪明人交流过，他们相信所有这一切，但甚至梦都不想过构建一个网页。有多少出色的网站因为那些潜在的构建者认为这超出了他们的能力范围，而从未问世呢？在不断反复质问自己这些问题后，我终于决定采取行动。我决定写这本书，其目标是向每个人证明——是的，甚至是像你这样持怀疑态度的人——Web\
  \ 背后的技术是易于上手的、直观的且容易学习的。\n\n### 关于本书\n\n那么，欢迎阅读 `HTML, CSS, and JavaScript All-in-One\
  \ For Dummies`。本书将让你对让任何人都能创建专业级网页的技术接受全面的教育。你将学习如何配置所需的工具，如何使用 `HTML` 和 `CSS` 来设计和构建你的网站，以及如何使用\
  \ `JavaScript` 为你的页面编写程序。我的目标是向你展示，这些技术并不难学习，即使是最纯的新手 Web 设计师也能学会如何组合出让他们的家人、朋友（以及他们自己）感到惊讶的页面。\n\
  \n如果你在寻找大量的编程历史、计算机科学理论以及对概念的冗长解释，我很抱歉，你在这里找不到这些。我整本书的哲学思想源于 Linux 系统的创建者 Linus\
  \ Torvalds：“空谈是廉价的。给我看代码。”我会解释需要解释的内容，然后不再多话（或者在大多数时候，完全不废话），直接进入示例和脚本，这些内容比我能想出的任何啰嗦解释都能更好地解释一个概念（相信我，我写起冗长的话来可比谁都强）。\n\
  \n#### 开始阅读本书\n\n你如何阅读这本书取决于你目前的 Web 编码专业水平（或缺乏该水平）：\n\n*   如果你才刚刚起步，请从开头的 `Book\
  \ 1` (`p01.xhtml`) 开始起，并按照自己的节奏顺序阅读 `Books 2` (`p02.xhtml`) 和 `3` (`p03.xhtml`)。这将赋予你所需的所有知识，以便在书的其余部分挑选你想要学习的内容。\n\
  \n\n\n\n\n*   如果你了解 HTML 和 CSS，可能只需要快速浏览一下第 2 部分和第 3 部分，然后开始学习第 4 部分及后续内容即可。\n*\
  \   如果你已经做过一些 JavaScript 编码，我建议快速过一遍第 4 部分中的材料，然后根据你的需要探索其他迷你短书的内容。\n\n#### 我的“无\
  \ AI”保证\n\n当我开始更新这本书的版本时，世界范围内充斥着关于人工智能的帖子、讨论和无休止的推测，以至于似乎我们很快就要迎接新的 AI 领主了。这种情况在短期内不太可能发生，但\
  \ AI 已经来了常驻，并且已经成为许多人工作日常的重要组成部分。\n\n我曾像最大的 AI 拥护者一样痴迷于 ChatGPT 及其类产品。我将 AI 用于娱乐和满足好奇心，但我不会用它来工作。这意味着，书中使用的文本、代码或示例中，没有任何一个字是由\
  \ AI 生成的。你在这里读到的所有内容，无论好坏，都是我那从与生就扭曲大脑的产物。\n\n### 愚的假设\n\n这本书并不是一本关于互联网或如何使用世界维网的入门书。这是一本关于构建网页的书，纯粹且简单。这意味着我假设了以下内容：\n\
  \n*   你知道如何操作基础文本编辑器，以及如何在电脑的操作系统和文件系统中进行操作。\n*   你拥有互联网连接。\n*   你知道如何使用网络浏览器。\n\
  \n是的，就是这些。\n\n我应该在这里提一下，这本书完全关于编码网络发迷们所谓的`front end`（前端），这意味着你在你在网络浏览器中看到的内容。网页也有`back\
  \ end`（后端），指的是在 Web 服务器上发生的事情。在本书中我没有涉及任何后端编码。如果你对网页的这部分感兴趣，请不谦虚地推荐我的书《Web Coding\
  \ and Development All-in-One For Dummies》（Wiley 出版）。\n\n### 本书中使用的图标\n\n![Remember](img/remember.png)\
  \ 这个图标指出了可能对你反复有用的有用秘诀 —— 所以请不要忘记它们。\n\n![Tip](img/tip.png) 将这些图标看作建议栏的素材。它们提供了（希望是）明智的建议，或者关于正在讨论的主题更多信息。\n\
  \n![Warning](img/warning.png) 注意！在本书中，当你看到这个图标时，我正试图帮助你避免可能浪费时间、金钱或尴尬的错误。\n\n![Technical\
  \ stuff](img/technicalstuff.png) 当你看到这个图标时，你遇到了并不是理解至关重要、但能满足好奇心的材料。看到这个图标时，请想想“好奇的心想知道”。\n\
  \n### 本书之外\n\n这本书的一些额外内容可以在网上找到。请在线查找以下内容：\n\n*   **书中使用的示例：** 你可以在以下两个地方之一找到它们：\n\
  \    *   **我的个人网站：** [`https://paulmcfedries.com/htmlcssjsfd`](https://paulmcfedries.com/htmlcssjsfd)\n\
  \    *   **GitHub：** [`https://github.com/paulmcfe/html-css-js-fd`](https://github.com/paulmcfe/html-css-js-fd)\n\
  \n示例按书籍组织，然后按每个迷你短书中的章节组织。对于每个示例，你可以查看代码，将其复制到电脑的剪贴板，并在浏览器中运行代码。\n\n*   **Web 开发工作：**\
  \ 为了尝试你自己的 HTML、CSS 和 JavaScript 代码并查看即时结果，请启动网站：\n    *   [`https://webdevworkshop.io/wb`](https://webdevworkshop.io/wb)\n\
  \n你不会破坏任何东西，所以尽管使用该网站运行一些实验并玩玩 HTML、CSS 和 JavaScript。\n\n*   **额外章节：** 我想告诉你的比这本书装下的多，所以前往\
  \ [`www.dummies.com/go/htmlcss&javascriptaiofd`](http://www.dummies.com/go/htmlcss&javascriptaiofd)\
  \ 下载额外的章节，这些章节将向你展示一些强大的技术和动画，提升你的 CSS 水平。\n*   **备查表：** 前往 [`www.dummies.com`](http://www.dummies.com)\
  \ 并搜索 *HTML, CSS, & JavaScript All-in-One For Dummies* 来查找这本书的备查表。在这里你将找到一个现用的基础网页\
  \ HTML 模板、一组 15 个核心 CSS 选择器，以及十种强大的 JavaScript 调试策略。\n\n第 1 卷\n\n## 入门\n\n### 目录摘要\n\
  \n1.  第 1 章：熟悉 HTML、CSS 和 JavaScript\n    1.  HTML、CSS 和 JavaScript 到底是做什么什么？\n\
  \    2.  为什么要学习 HTML、CSS 和 JavaScript？\n    3.  看看这一切是如何运作的\n    4.  使用 HTML 增加结构\n\
  \    5.  使用 CSS 增加样式\n2.  第 2 章：准备好编码\n    1.  设置你的浏览器\n    2.  创建文件夹\n    3.  选择你的文本编辑器\n\
  \    4.  你还需要什么？\n    5.  使用 Web 工作台\n3.  第 3 章：寻找并设置主机\n    1.  理解提供商\n    2. \
  \ 主机购买指南\n    3.  寻找主机\n    4.  熟悉你的新家\n4.  第 4 章：测试和验证你的代码\n    1.  跨浏览器测试你的代码\n\
  \    2.  理解验证\n    3.  不要跳过验证\n    4.  验证你的 HTML\n    5.  验证你的 CSS\n\n\n\n\n\n从宏观来看，HTML、CSS\
  \ 和 JavaScript 是当你访问网页时所看到内容的背后的技术。诚然，你可靠的网页浏览器向你展示了页面文本和图像，但这些文本和图像呈现给你的方式是由页面底层的\
  \ HTML、CSS 和 JavaScript 代码决定的。这些技术具有三个独立但相互关联的功能：\n\n*   **结构（Structure）：** 页面的基本骨架，例如页面标题、文本段落以及图像出现的位置。这是\
  \ `HTML` 的领域。\n*   **样式（Style）：** 页面的外观，包括字体、颜色和页边距。这是 `CSS` 的职权范围。\n*   **动态性（Dynamism）：**\
  \ 让页面执行动作的额外功能，例如与用户交互、“监听”鼠标点击和按键按下，以及根据特定条件向页面写入内容。这是 `JavaScript` 的工作。\n\n这就是大局。我将在本章稍后的部分更详细地介绍这些内容（从使用\
  \ HTML 添加结构 节的 `HTML` 开始）。\n\n### 为什么要学习 HTML、CSS 和 JavaScript？\n\n我在引言中提到学习 `HTML`、`CSS`\
  \ 和 `JavaScript` 并不困难。事实依然如此，但我必须承认这并没有说明全部情况。是的，学习这些技术并不困难，但它们也绝非易事。虽然你可能在一个下午就能背下\
  \ `HTML` 的每一个元素，但 `CSS` 和 `JavaScript` 都是巨大的课题，需要时间来掌握。尽管 `HTML`、`CSS` 和 `JavaScript`\
  \ 的基础知识具有非常平缓的学习曲线，但在你过了这些基础知识之后，很快就会遇到许多怪癖和陷阱，让攀登之路变得陡峭。\n\n所以，开篇就问一个基本问题是合理的：你为什么想要费力学习\
  \ `HTML`、`CSS` 和 `JavaScript` 呢？毕竟，有很多模板、网页生成器、内容管理系统和网页设计师，它们可以以不同的简易程度、成本和成功率，将你的文字和图像变成实实在在的网页。为什么不采取这些更简单的路径来建立网络存在感呢？\n\
  \n问得好。事实确实可能是，如果你长期缺乏时间或动力，这些“让别人代大部分大部分”的解决方案之一可能适合你。但对于其他人，这里是我学习 `HTML`、`CSS`\
  \ 和 `JavaScript` 来手工制作你自己的网页的理由——我称之为“四个 C”：\n\n*   **完全自主（Carte blanche）：** 当你使用\
  \ `HTML`、`CSS` 和 `JavaScript` 亲手构建网页时，你对创作的每一个方面都拥有完全的自由：内容、颜色、字体、布局，所有这一切。新网页是一个你可以随心所欲填充的空白`tabula\
  \ rasa`）。\n*   **创造力（Creativity）：** 打造你自己的网页意味着你不仅对你说什么，对你*如何*说拥有最终决定权（不用说第一、第二选择了）。你没有被他人的设计或愿景所束缚。相反，你可以以任何你想向世界展示的方式来表达自己。\n\
  *   **定制（Customization）：** 几乎任何预制网页都是僵化的结构，在创建时仅提供最有限的自定义，而且在页面发布后通常无法进行进一步定制。忘记这些吧！当你的页面是手工制作时，从开始每种可能性都对你开放，而且，你的页面始终是无限自定义的。\n\
  *   **成本（Cost）：** 你可能会惊讶地发现，使用 `HTML`、`CSS` 和 `JavaScript` 制作自己网页的成本实际上为零。没错：零（0）美元（或欧元、比索等）。这怎么可能呢？因为正如我在接下来的章节中讨论的，手工制作网页真正只需要文本编辑器，而大多数都是免费的。是的，你通常需要付钱让人将你的页面托管在网上（详情请查看第一部分的第\
  \ 3 章），但制作这些页面是免费的。\n\n### 它是如何运作的\n\n你了解网络。你浏览到手指发蓝。你体验过那些真正壮观的网站带来的惊喜。现在，当你准备开启学习创建自己网页的之旅时，你可能认为为了实现那些惊人的效果，你需要一些复杂的软件。也许是一个大型页面布局程序，或者是一个带有特殊插件和模板用于制作网页的高端文字处理器。又或者你你需要一个极其复杂且昂贵的“网页处理器”应用，它提供了制作出完美且看起来专业的页面所需的各种功能。\n\
  \n嗯，我很高兴地向你报告，你不需要任何那些东西。你开始制作网页真正需要的的是一个谦虚的文本编辑器。你手里只有 Windows 的记事本或 Mac 的文本编辑？是的，任何一个都可以。（谢天，你不必非要使用这两个低级程序，因为世界上充斥着为了让输入和编辑\
  \ `HTML`、`CSS` 和 `JavaScript`——当然还有文本——变得简单而设计的编辑器。而且大多数都是免费的！更多信息请参考第一部分的第 2 章。）\n\
  \n我看到你挑起眉毛，只需要一个文本编辑器让你感到惊讶。你问，网络上奇妙的网页怎么可能是一个卑微文本编辑器的产物？你如何从纯文本获得网络的华丽？这些问题的答案在于你用来上网的程序：浏览器。简单来说，网页只是带有经过策略性放置的\
  \ `HTML`（用于结构）、`CSS`（用于样式）和 `JavaScript`（用于动态性）代码的文本。浏览器然后使用这些代码来显示——或者像网页极客所说的，*渲染*——该页面。\n\
  \n例如，你可以在文本文件中添加特殊代码，指定你想让一组特定的单词或短语显示为项目列表。当网页浏览器到达文件的该部分时，它会忠实地将这些项目作为一个列表。浏览你页面的人并不会得到“将这些项目渲染为项目列表”的代码；他们只得到了项目列表。网页浏览器在后台执行了这些以及许多其他转换。只要你在正确的位置拥有了正确的\
  \ `HTML`、`CSS` 和 `JavaScript` 标记，浏览器就会按照你想要的方式渲染你的页面。\n\n#### 要开始，请启动一个新的文本文件\n\n\
  所以，终于说到了点，每当你想创建一个网页时，第一步都是开始一个新的文本文件。为了做到这一点，并不意外，你需要启动你最喜欢的文本编辑器：\n\n*   **记事本\
  \ (Windows)：** 在 Windows 11 中，选择开始⇒所有应用⇒�记事本。当你启动程序时，记事本会自动显示一个全新的文本文件。你也可以通过选择文件⇒�新建来启动一个新文档。\n\
  *   **文本编辑 (Mac)：** 点击菜单栏中的搜索（放大镜），开始输入 `textedit`，然后在它出现在搜索结果中时立即点击“文本编辑”。在出现的对话框中，点击“新建文档”。你可以在任何需要的时候通过选择文件⇒�新建来启动一个新的文本文件。\n\
  *   **其他工具：** 如果你有另一个文本编辑器，按照你通常的方式启动它并创建一个新文件。\n\n> [!WARNING]\n> 如果用文字处理器呢？嗯，从技术上说你可以使用像\
  \ Microsoft Word 或 Apple Pages 之类的程序，但不推荐这样做。这些程序倾向于产生复杂的网页文件，并带有许多未知用途的额外文件。帮自己个忙，通过使用文本编辑器来保持简单。\n\
  \n\n\n\n\n![Tip](img/tip.png) 如果你希望立即开始尝试，而又不想创建任何文件，可以使用一些在线工具来毫不费力地玩玩 HTML、CSS\
  \ 和 JavaScript。查看第一本书的最后章节，第 2 章，来了解如何在线进行网页编码。\n\n#### 关于保存 HTML 文件的注意事项\n\n在埋头编写将成为网页的文本文件时，请务必遵守安全计算习惯。也就是说，确保定期保存你的工作。然而，根据我收到的数千条读者反馈，我可以告诉你，让那些新手网页大师最容易栽跟的问题就是没有正确保存\
  \ HTML 文件。\n\n为了帮助你轻松跨越这些保存障碍，这里有几点需要仔细研究的笔记：\n\n* **保存（Save）命令：** 通过选择 `File⇒  Save`\
  \ 来保存文件。第一次对新文件执行此操作时会弹出“另存为”（Save As）对话框。你使用该对话框来指定三点：文件名、文件类型以及文件在硬盘上的位置。接下来的几点将讨论关于名称和类型的一些小知识。\n\
  \n* **使用正确的扩展扩展名：** 对于普通的网页，你的文件名必须以 `.htm` 或 `.html` 文件扩展名结尾（例如，`mypage.html`）。因此，在命名文件时，请务必指定\
  \ `.htm` 或 `.html`。\n\n    ![Remember](img/remember.png) 许多 HTML 初学者在命名文件时会对使用 `.htm`\
  \ 还是 `.html` 感到困惑。实际上，你可以自由使用其中任何一个，因为没有区别。尽管如此，大多数人选择使用 `.html` 扩展名。无论如何，在本章和整本书中，我都此类此类称为“HTML\
  \ 文件”。\n\n* **使用小写文件名：** 大多数网络服务器（存储网页的计算机）在处理大写字母和小写字母时非常敏感。例如，典型的服务器认为 `index.html`\
  \ 和 `INDEX.HTML` 是两个不同的文件。我知道这很蠢。所以为了安全起见，始终仅使用小写字母输入文件名。\n\n* **不要使用空格：** Windows\
  \ 和 macOS 处理包含空格的文件名。然而，如果网络服务器和网页浏览器遇到带有一个或多个空格的文件名，可能会混乱。所以不要在文件名中使用空格。如果你想在文件和目录名中分隔单词，请使用下划线\
  \ (`_`) 或连字符 (`-`）。\n\n* **使用正确的文件类型：** 在“另存为”对话框中，你需要为你的 HTML 文件选择正确的文件类型。这取决于你使用的程序。在大多数程序（包括\
  \ TextEdit）中，你使用“文件格式”（或“另存为类型”）列表选择网页（`.html`）或类似的内容，如图 1-1\n\nFIGURE 1-1: 大多数文本编辑器允许你选择网页文件类型。\n\
  \n因此，假设你已经按照上一节的描述创建并保存了 HTML 文件，你的首要任务是在文本编辑器和网页浏览器中打开该 HTML 文件：\n\n* **文本编辑器：**\
  \ 运行 `Open` 命令（几乎总是通过 `File⇒  Open` 或按下 `Ctrl+O` 或 `⌘  +O`）来打开你想处理的 HTML 文件（如果尚未打开的话）。\n\
  \n    ![Tip](img/tip.png) 当你运行 `Open` 命令时，出现的“打开”对话框可能不会显示你的 HTML 文件，因为默认情况下，编辑器只显示使用\
  \ `.txt` 扩展名的普通文本文件。要让你的 HTML 文件显示出来，请使用“文件类型”列表选择所有文档（`*.*`）或所有文件（`*.*`）。\n\n*\
  \ **网页浏览器：** 运行 `Open` 命令加载你在文本编辑器中打开的同一个 HTML 文件。寻找 `Open` 命令可能是易事也可能是难题，取决于你的操作系统：\n\
  \n    * **Windows：** 无论你使用 Edge、Chrome 还是 Firefox，按下 `Ctrl+O` 显示“打开”对话框；然后选择 HTML\
  \ 文件并点击“打开”。\n\n    * **macOS：** 无论你使用 Safari、Chrome 还是 Firefox，选择 `File⇒  Open`，然后选择\
  \ HTML 文件并点击“打开”。\n\n\n\n\n\n*   **超文本 (HyperText):** 在史前时代——即 1980 年代——老古板们将任何在被选中时会带你进入另一个文档的文本称为\
  \ `hypertext`。所以，这只是对网页定义性特征——“链接”的一种委婉指代。\n*   **标记 (Markup):** 这些指定网页内容在 Web 浏览器中如何显示的指令。\n\
  *   **语言 (Language):** 这个词指的是构成页面所有标记可能的代码集。\n\n但尽管 `HTML` 这个名字听起来很吓人，但 `HTML` 使用的代码其实一点都不难学。它们只有寥几个，而且在很多情况下，它们甚至非常有意义！\n\
  \n#### 掌握 HTML 元素和标签\n\n从最基础的来说，`HTML` 不过是一组被称为 `elements`（元素）的标记代码，这些代码定义了你网页的结构。在\
  \ `HTML` 中，“结构”是一个灵活的概念，可以指从页面的整体布局一直到单个单词，甚至仅仅一两个字符。\n\n对于大多数的 `HTML` 工作，你实际上是在创建一种容器。这个容器里可以存放什么的内容？主要是文本，尽管它们通常是整个网页的区块，甚至是其他元素。\n\
  \n大多数 `HTML` 容器使用以下通用格式：\n\n```\n<element>content</element>\n```\n\n你在这里看到的是几个定义了特定\
  \ `HTML` 元素容器的代码。许多元素是一个或两个字母的缩写，但有时它们是完整的单词。你总是用角括号 `<>` 包围这些元素；这些括号告诉 Web 浏览器它正在处理的是一段\
  \ `HTML` 而不仅仅是一些随机文本。被角括号包围的元素被称为 `tag`（标签）。\n\n![Remember](img/remember.png) `HTML`\
  \ 代码本身被称为 `element`；被角括号包围的元素则被称为 `tag`。\n\n这些代码中的第一个——`<element>` 称为 `start tag`（起始标签），它标记了容器的开始；第二个代码——`</element>`\
  \ 称为 `end tag`（结束标签），它标记了容器的结束。（注意结束标签中出现的额外斜杠 (`/`)。）\n\n在起始标签和结束标签之间，你有 `content`（内容），它指的是标签中包含的任何内容。例如，这里有一个可能出现在网页中的简单句子：\n\
  \n```\nThis is a web page with something important to say.\n```\n\nFigure 1-2 显示了这在\
  \ Web 浏览器中可能的样子。\n\n![Screenshot of the sample sentence as it appears in a web browser.](img/9781394164684-fg010102.png)\n\
  \nFIGURE 1-2: 浏览器中显示的示例句子。\n\n呵，对吧？假设你想通过强调“important”来加强一下视觉效果。在 `HTML` 中，用于强调的元素是\
  \ `em`，所以你可以这样修改你的句子：\n\n```\nThis is a web page with something <em>important</em>\
  \ to say.\n```\n\n注意我是如何将 `important` 这个单词用 `<em>` 和 `</em>` 包围的？第一个 `<em>` 是起始标签，它告诉浏览器：“嘿，浏览器小哥！你知道接后面的文本吗？听话，把它当作强调文本处理。”这会一直持续到浏览器遇到结束标签\
  \ `</em>`，它让浏览器知道应该停止当前操作。所以 `</em>` 告诉浏览器：“好了，好了，强调已经足够了！”\n\n所有的 Web 浏览器都会用斜体显示强调文本，所以这个单词现在看起来是这样，正如你可以从\
  \ Figure 1-3 中看到的。\n\n![Screenshot of the sentence revised to italicize the word\
  \ important.](img/9781394164684-fg010103.png)\n\nFIGURE 1-3: 修改后将单词 `important`\
  \ 斜体的句子。\n\n还有许多其他结构的标签，包括重要文本、段落、标题、页面标题、链接和列表。`HTML` 就是所有这些标签的总和。\n\n![Warning](img/warning.png)\
  \ 新手网页制作最常见的错误之一是忘记标识结束标签的斜杠 (/)。如果你在浏览器中查看页面时看起来不对，请检查是否有斜杠缺失。还要检查是否使用了反斜杠 (\\\
  ) 而不是斜杠，这是另一个常见错误。\n\n#### 理解标签属性\n\n你经常会直接使用标签，但所有标签都可以以各种方式进行修改。这种修改可能仅仅是为标签提供一个唯一标识符以便在脚本或样式中使用，也可能是更改标签运行的方式。无论如何，你通过在起始标签上添加一个或多个\
  \ `attributes`（属性）来修改标签。大多数属性使用以下通用语法：\n\n```\n<tag attribute=\"value\">\n```\n\n\
  在这里，你用 `attribute` 替换为你想要应用到标签上的属性名称，用 `value` 替换为你想要的值。\n\n\n\n\n接下来，你添加 `<html\
  \ lang=\"en\">` 标签。这个标签并没有太大作用，只是告诉任何尝试读取该文件的浏览器，它正在处理一个包含 HTML 元素的文件。它还使用 `lang`\
  \ 属性来指定文档的语言，在这种情况下是英语。\n\n同样，文档的最后一行将始终是对应的结束标签：`</html>`。你可以将此标签看作 HTML 版本的“剧终”。因此，你的每个网页都将在第二行包含此内容：\n\
  \n`<html lang=\"en\">`\n\n并在最后一行包含此内容：\n\n`</html>`\n\n接下来的项目用于将页面分为两个部分：头部（head）和主体（body）。`head`\
  \ 部分就像是页面的介绍。网络浏览器使用 `head` 来收集有关页面的各种类型的信息。`head` 部分可以出现许多项目，但在这一早期阶段，唯一具有实际意义的是页面标题，我将在下一节中讨论它，即“为你的页面命名标题”。\n\
  \n要定义 `head`，请在你稍后输入的 `<html>` 标签下方立即添加 `<head>` 和 `</head>` 标签。因此，你的网页现在应该像这样：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n</head>\n</html>\n```\n\n\
  ![记住](img/remember.png) 虽然从技术上讲，使用大写或小写字母输入标签名称没有区别，但 HTML 官方机构建议使用小写字母 HTML 标签，这就是我在本书中使用的风格，我也鼓励你这样做。\n\
  \n![记住](img/remember.png) 注意到我对 `<head>` 和 `</head>` 标签稍微缩进了（实际上是缩进了四个空格）。每当你有位于另一个\
  \ HTML 容器内部的 HTML 标签时，这种缩进都是良好的做法，因为它使你的代码更易读且更易排除故障。\n\n当你位于 `head` 部分时，这里有一个额外的令人头疼的问题（meta）：\n\
  \n`<meta charset=\"utf-8\">`\n\n你将此元素放在 `<head>` 和 `</head>` 标签之间（为了方便阅读又缩进了四个空格）。它告诉网络浏览器你的网页使用了\
  \ UTF-8 字符集，你大部分可以忽略它，只需知道 UTF-8 包含了人类知的几乎每一个字符（国内和外国）、标点符号和符号。\n\n`body` 部分是你输入文本以及浏览器实际将显示的其他有趣内容的地方。要定义\
  \ `body`，请将 `<body>` 和 `</body>` 标签放在 `head` 部分之后（即 `</head>` 标签下方）：\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n![警告](img/warning.png) 一个常见的页面错误是包含两个或多个这些基础标签的副本，特别是\
  \ `<body>` 标签。为了获得最佳效果，请确保在每个页面上这五个基本结构标签中的—— `<!DOCTYPE>`、`<html>`、`<head>`、`<meta>`\
  \ 和 `<body>` ——都只使用一次。\n\n#### 为你的页面命名标题\n\n当你浏览网页时，你可能注意到浏览器在当前标签页中显示某些文本。该标签页文本就是页面标题，它是一个短（有时很长）的短语，用于给页面命名。你可以通过向页面的\
  \ `head` 部分添加 `<title>` 标签为你自己的网页命名。\n\n要定义标题，用 `<title>` 和 `</title>` 标签围绕标题文本。例如，如果你想让页面的标题为“My\
  \ Home Sweet Home Page”，请按如下输入：\n\n`<title>My Home Sweet Home Page</title>`\n\n\
  注意，你始终将标题放在 `head` 部分内部，所以你的基础 HTML 文档现在看起来像这样（查看 bk01ch01/example03.html）：\n\n\
  ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n\
  <title>My Home Sweet Home Page</title>\n</head>\n<body>\n</body>\n</html>\n```\n\
  \n图 1-6 显示了加载到网络浏览器中的此 HTML 文件。注意标题是如何出现在浏览器的标签栏中的。\n\n![你插入到 title 标签中的文本显示在浏览器标签页中](img/9781394164684-fg010106.png)\n\
  \n图 1-6： 你插入到 `<title>` 标签中的文本显示在浏览器标签页中。\n\n在为你的页面考虑标题时，请记住以下几点：\n\n*   确保你的标题描述了页面的全部内容。\n\
  *   不要让标题太长。如果太，浏览器可能会将其截断，因为标签页没有足够的空间显示它。通常 50 或 60 个字符是上限。\n*   使用在离开上下文查看时也有意义的标题。例如，如果有人非常喜欢你的页面，那个人可能会将其添加到收藏列表或书签中。浏览器会在收藏列表中显示页面标题，因此当观众以后查看书签时，标题具有意义很重要。\n\
  \n#### 添加一些文本\n\n现在是时候通过输入你想在 `body` 中显示的文本来为骨架添加肌肉了。在大多数情况下，你只需将文本添加到 `<body>`\
  \ 和 `</body>` 标签之间，如下：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  <meta charset=\"utf-8\">\n<title>My Home Sweet Home Page</title>\n</head>\n<body>\n\
  Hello World!\n</body>\n</html>\n```\n\n图 1-7 显示了浏览器如何显示此 HTML。\n\n![你添加到页面主体的文本显示在浏览器窗口中](img/9781394164684-fg010107.png)\n\
  \n图 1-7： 你添加到页面主体的文本显示在浏览器窗口中。\n\n#### 关于结构与样式的一些笔记\n\n\n\n\n前端 Web 开发的关键点之一是将网页的结构与其样式分离。这使得页面构建更快、更易于维护，并且在各种浏览器和操作系统中具有更可预测性。`HTML`\
  \ 提供结构部分，而 `CSS` 负责处理样式。\n\n就这部分而言这没问题，但 `HTML` 在执行其结构职责时有几个你需要了解的特性：\n\n*   **这可不是你父亲辈眼中的结构。**\
  \ 换句话说，当你考虑文档的结构时，你可能会想到文章、章节和段落等较大的块。`HTML` 涵盖了所有这些，但它也会在句子、单词甚至字符层面上处理结构。\n* \
  \  **HTML 的结构通常附带了一些样式。** 或者，我应该说，所有的网页浏览器都带有了预定义的样式，它们在渲染某些 `HTML` 标签时会使用这些样式。是的，我知道我刚刚说过分离结构和样式最好，所以这可能会让人有点困惑。可以这样想：当你用雪松木建造一个新的甲板时，完成后的甲板具有天然的“雪松木”外观，但你可以自由地涂上一层清漆或油漆。`HTML`\
  \ 是雪松木，而 `CSS` 就是油漆。\n\n我提到这些特性是因为它们可以帮助回答在你处理 `HTML` 标签时可能会出现的一些问题。\n\n![Remember](img/remember.png)\
  \ 理解为什么 `HTML` 之所以这样运行的另一个关键在于，大部分 `HTML` —— 特别是最新版本 `HTML5` —— 被设计成使得网页在某种程度上是可以被分析页面的软件“理解”的。一个重要的例子是某些视障网民使用的屏幕阅读器。如果屏幕阅读器能够从其\
  \ `HTML` 标签轻松地识别出整个页面的结构，它就能向用户正确地呈现页面。同样，寻求索引、读取或其他分析页面的软件，只有当页面的 `HTML` 标签是对页面预设结构的忠实表示时，才能成功地做到。\n\
  \n## 使用 CSS 添加样式\n\n使用 `HTML` 进行 Web 编码之所以如此痴迷的原因之一是，你可以使用几个基础标签就搭建出一个页面，并发现在浏览器中查看结果时，它通常运行得相当不错。它虽然不是艺术品，但不会让你的眼睛酸疼。这种基本功能和外观得益于所有网页浏览器应用于各种\
  \ `HTML` 元素的默认格式。例如，`<strong>` 文本以粗体字体显示，`<p>`（段落）元素之间有一定的垂直空间，而 `<h1>`（一级标题）文本显示得比普通文本大得多。\n\
  \n浏览器的默认格式意味着即使是基础页面看起来也算合理，但我打赌你读这本书是因为你想追求一些比“合理”更深层次的目标。在这一节中，你将发现创建精美页面的秘密在于用自己的样式来覆盖浏览器的默认格式。你通过为你的页面添加一些\
  \ `CSS` 来来实现。\n\n### 了解级联样式表\n\n如果你想控制网页的外观，实现这一目标的王径是一种被称为级联样式表（`cascading style\
  \ sheets`）或 `CSS` 的 Web 编码技术。正如我在上一节中提到的，在构建任何 Web 项目时，你的设计目标应该始终分离结构和格式。`HTML`\
  \ 的工作是处理结构部分，但要处理页面的格式，你必须转向 `CSS`。在进入细节之前，我先回答三个简单的问题：什么是样式？什么是表？什么是级联？\n\n####\
  \ 样式：格式选项的组合\n\n如果你曾经用过像 `Microsoft Word`、`Google Docs` 或 `Apple Pages` 这样高级的文字处理器，你可能在过程中遇到过一两个样式。简而言之，一个\
  \ `style`（样式）是一个组合成一个美观、整洁包的格式选项包。例如，你可能有一个“标题”样式，它结合了四个格式选项：粗体、居中、24 点字号和 Verdana\
  \ 字体。然后你可以将此样式“应用”到任何文本上，程序就会尽职地使用这四个选项对文本进行格式化。如果你以后改变了主意，决定标题应该使用 18 号字体，你所做的只是重新定义“标题”样式。然后程序会自动遍历整个文档，并更新每处使用该“标题”样式的文本。\n\
  \n在网页中，样式的执行着类似的功能。也就是说，它允许你为给定的页面元素（如 `<div>` 或 `<h1>` 等标签）定义一系列格式选项。像文字处理器的样式一样，网页样式有两个主要优势：\n\
  \n*   它们节省了时间，因为你只需要创建一次样式格式的定义，浏览器会在每次你使用相应的页面元素时都应用该格式。\n*   它们让你的页面更易修改，因为你只需编辑样式定义，然后页面中所有该样式的所有地方都会自动更新。\n\
  \n例如，图 1-8 显示了网页浏览器默认格式下的某些 `<h1>` 文本（查看 `bk01ch01/example05.html`）。图 1-9 显示了相同的\
  \ `<h1>` 文本，但现在我用几种样式增强了文本，包括边框、72 像素字号、Verdana 字体和页面居中（参考 `bk01ch01/example06.html`）。\n\
  \n![以网页浏览器默认格式显示的 h1 标题的截图。](img/97813941684-fg010108.png)\n图 1-8： 以网页浏览器默认格式显示的\
  \ `<h1>` 标题。\n\n![图 1 中相同文本的截图，但现在增加了样式。](img/97813941684-fg010109.png)\n图 1-9：\
  \ 相同的 `<h1>`，但现在增加了样式。\n\n#### 表：样式的集合\n\n到目前为止一切良好，但“表”（sheet）到底是什么？`style sheet`（样式表）这个词回到了过去，那时旧时代的出版公司会记录他们对字体、字号、边距等内容的偏好。所有所谓的“内部样式”都存储在一个名为\
  \ `style sheet` 的手册中。在 Web 上，`style sheet` 也是类似的：它是可以应用于页面的样式集合。\n\n#### 级联：样式如何传播\n\
  \n`cascading style sheets` 名称中的“级联”（cascading）有点技术性，但它指的是 `CSS` 内的一种在元素间传播样式的机制。例如，假设你希望页面上的所有文本都是蓝色而不是默认的黑色。这意味着你需要为页面上的每一个文本相关标签创建一个“显示为蓝色”的\
  \ `CSS` 指令吗？不，谢天谢地！相反，你只需要应用一次，比如到 `<body>` 标签上，`CSS` 就会确保 `<body>` 标签内的每个文本标签都显示为蓝色。这被称为样式的*级联*\n\
  \n### 掌握 CSS 规则和声明\n\n在我向你展示如何在网页中实际使用 `CSS` 之前，花一点时间熟悉一下样式的样子。\n\n最简单的情况是向元素应用单个格式选项。这种方法的通用语法如下：\n\
  \n```css\nelement {\n  property: value;\n}\n```\n\n在这里，`element` 是你想要应用样式的网页元素的引用。这个引用通常是标签名（如\
  \ `h1` 或 `div`），但 `CSS` 拥有一套强大的工具箱可以引用各种事物，我在第三卷第 2 章](#c12.xhtml) 中讨论过这些。\n\n\n\
  \n\n\n`property` 部分是你想要应用的 CSS 属性的名称。CSS 提供了大量的属性集合，每个属性都是一个简短的字母关键字，例如用于字体的 `font-family`、用于文本颜色的\
  \ `color`，以及用于边框宽度的 `border-width`。属性名后面跟着一个冒号（`:`）、一个为了可读性留的空格、是你想要赋值给该属性的 `value`，最后是一个分号（`;`）。这行代码在行业内被称为\
  \ `CSS declaration`（CSS 声明）（尽管 `property-value pair` 这种描述也很常见）。\n\n![Remember](img/remember.png)\
  \ 记住，始终使用小写字母输入 `property` 名称。如果 `value` 包含字母或连字符以外的任何字符，你需要用引号（单引号或双引号）将值括起来。\n\
  \n同时，请注意，声明被花括号（`{` 和 `}`）括起来。你可以在花括号之间放置多个声明，这种集合被称为 `declaration block`（声明块）。应用到页面项目（如\
  \ HTML 元素）的声明块被称为 `style rule`（样式规则）。\n\n例如，以下规则对 `<h1>` 标签应用了 72 像素（由 `px` 单位表示）的字体大小：\n\
  \n```\nh1 {\nfont-size: 72px;\n}\n```\n\n接下来的示例展示了我之前为 `<h1>` 元素使用的规则，如图 1-9（再次，这段代码出现在\
  \ `bk01ch01/example06.html` 中）：\n\n```\nh1 {\nborder-width: 1px;\nborder-style:\
  \ solid;\nborder-color: black;\nfont-family: Verdana;\nfont-size: 72px;\ntext-align:\
  \ center;\n}\n```\n\n![Remember](img/remember.png) 记住，如果使用制表符或两个四个空格对声明进行缩进，声明块将更容易阅读。声明的顺序并不关键；有些开发者使用字母顺序，而另一些人会将相关的属性分组在一起。\n\
  \n除了对单个项目应用多种样式外，也可以将单个样式应用于多个项目。你按照通常的方式设置样式，但在规则开头不是单个项目，而是用逗号列出所有想要样式的项目。在下面的示例中，黄色背景色应用于\
  \ `<header>`、`<aside>` 和 `<footer>` 元素：\n\n```\nheader,\naside,\nfooter {\nbackground-color:\
  \ yellow;\n}\n```\n\n#### 为页面添加样式\n\n通过 HTML 标签，你只需要将标签放在让它出现的地方，但样式并不那么简单。事实上，有三种主要方法可以为网页设置样式：内联样式、内部样式表和外部样式表。\n\
  \n##### 插入内联样式\n\n`inline style`（内联样式）直接插入到想要格式化的标签中的样式规则。其通用格式如下：\n\n```\n<element\
  \ style=\"property1:value1;property2:value2\">\n```\n\n即，你为标签添加 `style` 属性，然后用分号设置一个或多个声明。例如，为了对\
  \ `<h1>` 标题应用 72 像素的字体，你可以添加 `font-size` 属性：\n\n```\n<h1 style=\"font-size:72px;\"\
  >\n```\n\n![Remember](img/remember.png) 记住，内联样式仅应用于它所在的标签。考虑以下代码（检查 `bk01ch01/example07.html`）：\n\
  \n```\n<h1 style=\"font-size:72px;\">The Big Cheese</h1>\n<h1>How Big Is Cheese?</h1>\n\
  <h1>Why Cheese, Of Things?</h1>\n```\n\n如图 1-10 所示，较大的字体应用于第一个 `<h1>` 标签，而另外两个 `<h1>`\
  \ 元素显示浏览器的默认尺寸。\n\n##### 嵌入内部样式表\n\n内联样式是有用的工具，但由于它们散落在页面的 HTML 代码中，不容易维护。为了更容易维护样式，并利用\
  \ CSS 提供的将单个样式规则应用于多个项目的方法，你需要转向样式表，可以是内部的（在这里讨论）或外部的（在下一节讨论）。\n\n`internal style\
  \ sheet`（内部样式表）是位于页面 HTML 代码同一文件的样式表。具体来说，样式表嵌入页面的 `<style>` 和 `</style>` 标签之间，如下：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<style>\n你的样式规则写在这里\n</style>\n\
  </head>\n<body>\n...\n</body>\n</html>\n```\n\n其通用语法如下：\n\n```\n<style>\nitemA {\n\
  propertyA1:valueA1;\npropertyA2:valueA2;\n...\n}\nitemB {\npropertyB1:valueB1;\n\
  propertyB2:valueB2;\n...\n}\n</style>\n```\n\n如前面的代码所示，内部样式表由嵌入 `<style>` 标签内的一个或多个样式规则组成，这就是为什么内部样式表被称为\
  \ `embedded style sheet`（嵌入样式表）。在下面的代码中（参考 `bk01ch01/example08.html`），我对 `<h1>`\
  \ 和 `<h2>` 元素分别应用了实线和虚线边框。图 1-11 显示了结果。\n\nHTML:\n\n```html\n<h1>solid having no\
  \ break or interruption</h1>\n<h2>crazy or eccentric.</h2>\n<h2>feeble or unsteady.</h2>\n\
  <h2>enthusiastic.</h2>\n```\n\nCSS:\n\n```css\n<style>\nh1 {\nborder-width: 2px;\n\
  border-style: solid;\nborder-color: black;\n}\nh2 {\nborder-width: 2px;\nborder-style:\
  \ dotted;\nborder-color: black;\n}\n</style>\n```\n\n![Screenshot of an internal\
  \ style sheet that applies different border styles to the h1 (top) and h2 elements.](img/9781394164684-fg01011.png)\n\
  \n图 1-11 内部样式表对 `<h1>`（顶部）和 `<h2>` 元素应用不同的边框样式。\n\n特别注意，我为 `<h2>` 元素的单个样式规则应用于网页中所有的\
  \ `<h2>` 标签。这就是样式表的力量：你只需要一条规则即可为特定元素的每个实例应用一个或多个样式声明。\n\n当你只想为单个网页应用特定的样式规则时，内部样式表方法是最好的。如果你有需要应用于多个页面的规则，你需要采用外部样式表。\n\
  \n##### 链接到外部样式表\n\n当你使用 `external style sheet`（外部样式表）时，样式表会变得异常强大，它是一个包含你样式规则的独立文件。要在任何网页中使用这些规则，你需要在页面头部内部添加一个特殊的\
  \ `<link>` 标签。该标签指定外部样式表文件的名称，然后浏览器使用该文件获取样式规则。\n\n以下是你设置外部样式表需要遵循的步骤：\n\n1. 使用你喜欢的文本编辑器创建一个全新的文本文件。\n\
  2. 将你的样式规则添加到此文件中。注意你不需要 `<style>` 标签或任何其他 HTML 标签。\n3. 保存文件。传统上使用 `.css` 扩展名保存样式表文件（例如\
  \ `styles.css`），这有助于你以后记住这是一个样式表文件。你可以将文件保存在与 HTML 文件相同的文件夹中，也可以创建一个子文件夹（命名为 `css`\
  \ 或 `styles`）。\n4. 对于每个想要使用这些样式的页面，在页面的头部内部添加 `<link>` 标签。\n\n其通用格式如下（其中 `filename.css`\
  \ 是你的外部样式表文件名）：\n\n```\n<link rel=\"stylesheet\" href=\"filename.css\">\n```\n\n\
  \n\n\n\n如果你为 CSS 文件创建了子文件夹，请务必将该子文件夹添加到 `href` 值中（例如，`href=\"styles/filename.css\"\
  `）。\n\n例如，假设你创建一个名为 `styles.css` 的样式表文件，该文件包含以下样式规则：\n\n```css\nh1 {\n  color: blue;\n\
  }\n\np {\n  font-size: 24px;\n}\n```\n\n然后你通过 `<link>` 标签来引用该文件，如下所示（查看 `bk01ch01/example09.html`）：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <link rel=\"stylesheet\"\
  \ href=\"styles.css\">\n</head>\n<body>\n  <h1>This Heading Will Appear Blue</h1>\n\
  \  <p>This text will be displayed in a 24-pixel font.</p>\n</body>\n</html>\n```\n\
  \n为什么这种对样式表的使用如此强大？你可以将同一个 `<link>` 标签添加到任意数量的网页中，它们都将使用相同的样式规则，这为你的网站创建统一的视觉效果和感觉变得轻而易举。如果你决定\
  \ `<h1>` 文本应该是绿色的，你只需要编辑样式表文件（`styles.css`）。自动地，每一个链接到此文件的页面都将更新为新样式！\n\n## 使用 JavaScript\
  \ 添加动态效果\n\nJavaScript 在 Web 上是（而且长期以来都是）通用的。诚然，网上有很多简陋的主页除了 HTML 和少量的 CSS 之外空一无物，但其他一切——从简单的个人博客到华丽的设计师作品集，再到大型企业电子商务运营——都依赖\
  \ JavaScript 来让内容看起来良好并按预期方式运行（至少大多数情况下是这样）。\n\n### 什么是 JavaScript？\n\n当 浏览器遇到一个\
  \ HTML 文件时，它会经历一个简单但枯燥的过程：它逐行读取文件，从（通常是）顶部的 `<html>` 标签开始，到底部的 `</html>` 标签结束。在此过程中，它可能需要跳出这种逐行的处理单调模式，根据它读取的内容来执行某些操作。例如，如果它遇到\
  \ `<img>` 标签，浏览器将立即要求 Web 服务器发送 `src` 属性中指定的图形文件副本（查看第二本书，第 3 章）。\n\n这里的重点是，从核心上说，浏览器实际上只是一个页面读取机器，除了遵循\
  \ HTML 文件中的指令（标记）之外，它几乎做不了任何事情。（为了方便起见，我忽略了浏览器的其他功能，如保存书签。）\n\n很多人痴迷于创建网页的原因之一是因为他们从一开始就意识到他们对这个页面读取机器拥有控制权。在\
  \ `<b>` 标签及其相应的 `</b>` 标签之间放置一些文本，浏览器就会顺从地将文本显示为粗体。创建一个 CSS 网格结构（查看第五本书，第 3 章），浏览器就会将你原本杂乱无章的文本以整齐的行和列显示出来，没有任何任何疑问。这两个例子表明，你现在不仅仅是从外部查看页面，你还拥有了进入机器*内部*的钥匙，并开始操作它的控件。*这*正是吸引人们并对网页设计产生浓厚兴趣的关键。\n\
  \n想象一下，如果你能将控制页面读取机器的想法提升到下一个水平。想象一下，如果你不再是命令机器处理简单的标签和规则，而是发出更复杂的命令，实际上可以控制页面读取机器的内部运作。谁会不想呢？\n\
  \n嗯，这就是 JavaScript 的背后的前提。它本质上是一组你可以用来控制浏览器的命令。像 HTML 标签一样，JavaScript 命令被直接插入到网页文件中。当浏览器对文件进行逐行读取并遇到\
  \ JavaScript 命令时，它就会执行该命令，就如此。\n\n然而，这里的关键在于，JavaScript 对页面读取机器赋予的控制权远大于你通过 HTML\
  \ 标签获得的控制权。原因是 JavaScript 是一门真正的*编程语言*。HTML 中的“L”可能代表“language”（语言），但 HTML 中甚至没有一点点与编程语言相关的迹象。然而，JavaScript\
  \ 才是真正的编程手段。\n\n### 在页面中添加脚本\n\n好了，理论已经足够了。现在是卷起袖子，活动活动指关节，开始编码了。本节描述了构建和测试脚本的标准程序，并将带你通过几个示例。\n\
  \n### <script> 标签\n\n脚本的基本容器自然是 HTML 的 `<script>` 标签及其关联的 `</script>` 结束标签：\n\n\
  ```html\n<script>\n  // JavaScript 语句放在这里\n</script>\n```\n\n![技术内容](img/technicalstuff.png)\
  \ 在 HTML5 中，你可以不带任何属性使用 `<script>`，但在 HTML5 之前，该标签看起来像这样：\n\n```html\n<script type=\"\
  text/javascript\">\n```\n\n`type` 属性告诉浏览器脚本中使用的编程语言，但现在 JavaScript 是默认的，所以你不再需要它。你仍然会在许多页面上遇到带有\
  \ `type` 属性的 `<script>` 标签，所以我我想最好还是让你知道它的含义。\n\n### 你把 <script> 标签放在哪里？\n\n在某些例外情况下，你把\
  \ `<script>` 标签放在哪里并不太重要。HTML 标准建议将 `<script>` 标签放在页面的头部（即，`<head>` 和 `</head>`\
  \ 之间），这就是我在这里使用的样式：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta\
  \ charset=\"utf-8\">\n  <title>Where do you put the tag?（把标签放在哪里？)</title>\n  <script>\n\
  \    // JavaScript 语句放在这里\n  </script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\
  \n这里是“随处放置标签”技术的例外：\n\n*   如果你的脚本设计用于向页面写入数据，则 `<script>` 标签必须位于页面主体内（即，`<body>`\
  \ 和 `</body>` 之间）。\n*   如果你的脚本引用页面上的项目（例如表单对象），则脚本必须放在该项目之后。\n*   对于许多 HTML 标签，你可以直接作为属性添加一个或多个\
  \ JavaScript 语句。\n\n![记住](img/remember.png) 在页面中插入多个 `<script>` 标签是完全可以的，只要每个标签都有相应的\
  \ `</script>` 结束标签，并且你没有将一个 `<script>` 块放在另一个。\n\n### 示例 1：向用户显示消息\n\n你现在准备好构建并尝试你的第一个脚本了。这个示例为你展示了最简单的\
  \ JavaScript 操作：向用户显示基础消息。以下代码显示了文件中的脚本（参考 bk01ch01/example10.html）：\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Displaying\
  \ a Message to the User（向用户显示消息）</title>\n  <script>\n    alert(\"Hello JavaScript\
  \ World!\");\n  </script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\n此脚本仅由一行组成：\n\
  \n`alert(\"Hello JavaScript World!\");`\n\n这被称为*语句*（statement），每个语句都设计用于执行单一 JavaScript\
  \ 任务。\n\n你可能会好奇语句末尾的分号（`;`）。眼光真不错。你使用分号来标记每个 JavaScript 语句的结束。\n\n\n\n\n在示例中，该语句运行\
  \ JavaScript 的 `alert()` 方法，该方法会向用户显示括号内的任何消息（可以是欢迎信息、你网站新功能的公告、促销活动广告等）。图 1-12\
  \ 显示了你打开文件时出现的消息。\n\n![技术内容](img/technicalstuff.png) `method`（方法）是一种特殊的 JavaScript\
  \ 特性，你用它来指定你想让代码执行的操作。\n\n![打开包含示例脚本的 HTML 文件时出现的此“alert”消息截图](img/9781394164684-fg010112.png)\n\
  \n图 1-12： 当你打开包含示例脚本的 HTML 文件时，会出现此“alert”消息。\n\n浏览器是如何知道要运行该 JavaScript 语句的？当浏览器处理（通俗说是解析\
  \ `parses`）一个页面时，正如我之前提到的，它基本上是从 HTML 文件的开头开始，一行一行地向下工作。如果它遇到了 `<script>` 标签，它就知道有一条或多个\
  \ JavaScript 语句即将出现，并在读取到它们后立即按顺序执行这些语句。例外情况是 JavaScript 语句被封装在 `function` 内部，我在第\
  \ 4 册第 5 章 中解释这一点。\n\n![警告](img/warning.png) JavaScript 编程的基本准则之一是“一条语句一行”。也就是说，每个语句必须只出现在单行中，且每行不应超过一个语句。我在上一句的后半部分说“应该”，是因为只要你用分号（`;`）分隔每个语句，将多个语句放在同一行是完全可能的。在极少数情况下，必要在一行中放置两个或多个语句，但在大多数编程情况下，你应该避免这样做，因为包含多个语句的行难以阅读且难以排查故障。\n\
  \n### 示例 #2：向页面写入文本\n\nJavaScript 最强大的功能之一就是就是动态向网页上写入文本，甚至是 HTML 标签和 CSS 规则。也就是说，文本（或任何内容）会在网络浏览器加载页面时被插入到页面。这有什么用呢？首先，它对于时间敏感的数据是非常理想的。例如，你可能希望显示网页最后修改的日期和时间，以便访问者知道页面有多旧（或多新）。这里是几段展示此类脚本的代码（查看\
  \ bk01ch01/example11.html）：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  <meta charset=\"utf-8\">\n<title>向页面写入数据</title>\n</head>\n<body>\n这是一行普通的文本。<br>\n\
  <script>\ndocument.write(\"Last modified: \" + document.lastModified)\n</script>\n\
  <br>这是另一行普通的文本。\n</body>\n</html>\n```\n\n注意该脚本是如何出现在 HTML 文档的 `body` 内部的，每当你想向页面写入数据时，这都是必要的。图\
  \ 1-13 显示了结果。\n\n![打开文件时，文本显示了文件最后修改的日期和时间的截图](img/9781394164684-fg010113.png)\n\
  \n图 1-13： 当你打开文件时，文本显示了文件最后修改的日期时间和。\n\n此脚本使用了 `document` 对象，这是一个内置的 JavaScript\
  \ 结构，指向脚本所在的任何 HTML 文件（文档）（有关 `document` 对象的更多信息，请查看第 4 册第 6 章）。`document.write()`语句告诉浏览器将括号内的任何内容插入网页。`document.lastModified`\
  \ 部分返回文件最后更改并保存的日期和时间。\n\n## 第 2 章\n\n# 准备编码\n\n### 本章内容\n\n- ![项目](img/check.png)\
  \ 安装多种用于测试的网络浏览器\n- ![项目](img/check.png) 设置你的文件夹\n- ![项目](img/check.png) 学习在优秀的文本编辑器中要寻找什么\n\
  - ![项目](img/check.png) 确保你拥有所需的一切东西\n- ![项目](img/check.png) 使用 WebDev Workbench\
  \ 构建代码\n\n*提防那些要求新衣服的企业。*\n—— 亨利·戴卫·梭罗\n\n对于开始新爱好或消遣的人来说，快速让人感到沮丧之一就是很早意识到要把某事做好，你需要大量的新东西：新工具、新材料，而且是的，也许可能还需要新衣服。这就足以扼灭对烘焙、跑步或麦织结的新奇兴趣了。\n\
  \n学习使用 HTML、CSS 和 JavaScript 构建网页最具吸引力的特征之一，是你不需要昂贵或复杂的设置即可开始。事实上，你可能什么新东西都不需要，因为如果你有一台\
  \ Windows PC 或 Mac，几乎可以肯定你已经拥有了所需的一切。\n\n尽管如此，有几项基础工作是你应该做的，以确保你有一个良好的开端，在本章中你将探索这些内容。你还将深入探讨文本编辑器的世界，以防你的\
  \ Windows 或 Mac 默认编辑器无法满足。最后，本章还将介绍用于测试 HTML、CSS 的有用工具。\n\n### 设置你的浏览器\n\n在第 1 册第\
  \ 1 章中，我讲解了“编辑-保存-刷新”循环，即你修改并保存代码，然后在网络浏览器中加载文件以检查效果。这是一个良好的习惯，但我还敦促你在各种浏览器中练习这种习惯。为什么？因为现在的桌面浏览器渲染网页的方式通常相似，但并非总是如此。页面越大越复杂，它在一个或多个浏览器中显示不同的可能性就越高。\n\
  \n好消息是，你不需要为 Windows 和 macOS 提供的几十种浏览器测试你的页面。相反，安装并使用以下“四大”浏览器就足够了，它们合占桌面市场 90%\
  \ 以上份额：\n\n- **Google Chrome:** [`https://www.google.com/chrome/`](https://www.google.com/chrome/)\n\
  - **Apple Safari（仅限 macOS）:** [`https://support.apple.com/downloads/safari`](https://support.apple.com/downloads/safari/)\n\
  - **Microsoft Edge:** [`https://support.microsoft.com/microsoft-edge`](https://support.microsoft.com/microsoft-edge/)\n\
  - **Mozilla Firefox:** [`https://www.mozilla.org/firefox/new/`](https://www.mozilla.org/firefox/new/)\n\
  \n智能手机和平板浏览器呢？是的，它们同样，但在你把页面发布到网上之前我会先不讨论它们。我将在第 1 册第 4 章](#c04.xhtml)中详细介绍如何测试页面。\n\
  \n### 创建你的本地文件夹\n\n你可能只想创建一个单个网页，在这种情况下，你不需要太担心将 HTML 文件存储在计算机上的位置。例如，只需将文件放在你用户账户的“文档”（Documents）文件夹中即可。\n\
  \n\n\n\n然而，你购买这本相当厚的书告诉我，你可不是那种看一页就去尝试下一个爱好的人。不，你是为了创建很多 `bunch` 页面来到这里的，我说的对吧？如果是这样，那么在你开始之前，你需要先考虑一下你想要如何在本地（即在你的计算机上）存储你的网页内容。\n\
  \n#### 第一步，创建本地根文件夹\n\n你首先创建一个文件夹，作为你所有 Web 项目的基地。在 Web 开发行业中，这个文件夹被称为 `root`（根目录），因为你所有的\
  \ Web 项目都从这个文件夹“分支”出来。\n\n在哪里创建这个 `root` 文件夹或给它起什么名字其实并不重要。这里有几点需要考虑：\n\n* **易于查找。**\
  \ 文件夹应该相对容易找到，通常意味着不要把它深埋埋在硬盘的文件夹层次结构中。在用户账户的“文档”文件夹下创建一个子文件夹作为 `root` 是一个不错的做法。\n\
  * **起一个好记的名字。** 名字应该具有足够的描述性，让你一眼看出它是你的网页根目录。`public_html` 这个名字非常常见，因为（正如你在第一本书第\
  \ 3 章 中学到的）这是许多 Web 托管提供商自动分配给你服务器根目录的名称。另一个常见的根文件夹名称是 `htdocs`（`hypertext documents`\
  \ 的缩写）。\n\n#### 现在创建本地子文件夹（如果有的话）\n\n接下来的操作取决于你打算构建多少个 Web 开发项目以及每个项目中的文件数量：\n\n\
  * **仅包含几个文件的单个 Web 开发项目。** 在这种情况下，只需将所有文件放入 `root` 文件夹即可。\n* **包含许多文件的单个 Web 开发项目。**\
  \ 典型的 Web 开发项目更有可能包含多个 HTML、CSS 和 JavaScript 文件，以及许多如图像和字体之类的辅助文件。虽然将所有 HTML 文件放在\
  \ `root` 文件夹中也可以，但为了你自己的方便，请按文件类型将所有其他文件组织到子文件夹中：用于 CSS 文件的 `css` 子文件夹，用于 JavaScript\
  \ 文件的 `js` 子文件夹，用于图形的 `images` 文件夹，以此此类推。\n* **多个 Web 开发项目。** 作为一名 Web 开发人员，你几乎会创建大量的\
  \ Web 项目，因此组织这些项目至关重要。理想的方法是为每个项目创建一个独立的根子文件夹。然后在每个这些子文件夹内部，你可以为 CSS、JavaScript、图像等文件类型创建子子子文件夹。\n\
  \n### 选择你的文本编辑器\n\n前端 Web 开发真正令人惊叹的一点是，你所处理的都是基础文本文件。（在这里我忽略了图像、视频和字体等文件。）但难道你通过\
  \ HTML 标签添加的所有结构都需要某些晦涩且复杂的类型类型吗？没门：从头到尾都是文本。那么与 CSS 关联的所有格式内容呢？不：只有文本。JavaScript？也是文本。\n\
  \n这种纯文本的格局意味着，你不需要任何高大上、昂贵的软件来开发 Web。你只需要一个简陋的文本编辑器就能在 Web 编码领域中浅尝浅水。\n\n然而，说代码只需要文本编辑器，就像是说生存只需要食物一样：这无疑是正确的，但细节上有些过于匮乏。毕竟，在很大程度上，你的生活质量取决于你所吃的食物。如果你只靠面包和水生存，那么，你只是在“苟活”。你真正需要的是能提供身体所需所有营养的均衡饮食。还有饼。\n\
  \n“面包水版”的文本编辑器就是计算机自带的精简程序：如果你运行 Windows，则是 `Notepad`；如果你有 Mac，则是 `TextEdit`。你可以使用这些程序作为\
  \ Web 开发人员生存，但听我的，那不叫生活。如果你想作为一名 Web 程序员蓬勃发展，你需要编辑等同于维生素和矿物质（是的，还有饼）。这些营养素是成为高效且有组织的开发者至关重要的功能和工具：\n\
  \n* **语法高亮：** `Syntax` 指创建正确编程代码的字符和符号安排，而 `syntax highlighting` 是一种编辑功能，它对某些语法元素进行颜色编码，以便于阅读。例如，普通文本可能显示为黑色，而所有的\
  \ HTML 标签可能显示为蓝色，CSS 属性可能显示为红色。最好的文本编辑器让你选择语法颜色，可以通过提供预设主题或允许你应用自定义颜色。\n* **行号：**\
  \ 这看起来像是个小事，但拥有一个能为每行编号的文本编辑器（如图 2-1），它会给你一条错误信息，至关重要的是还有错误的行号。这些信息让你能够快速定位罪魁祸首并（祈祷好运）立即解决问题![行号的截图，如窗口左侧所示，是文本编辑器的一项关键功能](img/9781394164684-fg010201.png)\n\
  * **代码预览：** 一个好的文本编辑器会让你预览代码在 Web 浏览器中的外观。预览可能会出现在与代码相同的窗口中，或者出现在单独的窗口中，并且在你修改和保存代码时自动更新。\n\
  * **代码补全：** 这是一个实用的功能，当你开始输入某些内容时，它会显示一个可以完成你输入的代码项列表。然后你可以选择想要的项并按 `Tab` 或 `Enter`\
  \ 将其添加到代码中，而无需输入整个内容。\n* **拼写检查：** 你总是希望展现最好的一面，这在部分意味着页面不包含任何打印错误或拼写错误。良好的文本编辑器内置拼写检查器，会在你将页面发布到网上之前捕捉这些失误。\n\
  * **文本处理：** 最好的文本编辑器提供多种文本处理功能，如代码自动缩进、将制表符转换为空格反之亦然、移动代码块向左或向右、删除行尾不需要的空格、隐藏代码块等。\n\
  \n消息是，支持所有这些及更多功能的文本编辑器并不稀缺。这也是坏消息，因为这意味着你有大量的程序可以选择。为了帮助你开始，这里按字母顺序排列了一些可以试运行的编辑器：\n\
  \n* **Atom：** 支持 Windows 和 Mac。免费的！[`atom.io`](http://atom.io)\n* **Brackets：**\
  \ 支持 Windows 和 Mac。也是免费！[`brackets.io/`](http://brackets.io/)\n* **Notepad++：**\
  \ 仅支持 Windows。另一个免费工具。[`notepad-plus-plus.org/`](https://notepad-plus-plus.org/)\n\
  * **Nova：** 支持 Mac，价格为 99 美元，但提供免费试用。[`nova.app`](https://nova.app)\n* **Sublime\
  \ Text：** 支持 Windows 和 Mac，价格为 99 美元，但提供免费试用。[www.sublimetext.com](http://www.sublimetext.com)\n\
  * **Visual Studio Code：** 支持 Windows 和 Mac。没错，这一个也是免费的。[`code.visualstudio.com/`](https://code.visualstudio.com/)\n\
  \n### 你还需要什么？\n\n虽然编写网页代码确实只需要一个文本编辑器，但在你将“发布网页”从你的愿望清单上勾掉之前，你可能还需要其他一些东西：\n\n\n\
  \n\n\n*   **照片编辑器：** 如果你计划在网页上包含自己的照片（请参阅第 2 册的 第 3 章 学习如何在 HTML 文件中引用图像），你可能需要一些照片编辑软件来执行基础的照片改进任务，如裁剪掉不需要的部分、增强色彩和添加特殊特效。你可能还需要添加注释、调整图像大小并将图像文件格式更改为\
  \ JPEG。Windows 和 macOS 自带的“照片”应用可以完成基础杂活，但对于更专业的工作，你可能需要更高级的软件，例如 Adobe Photoshop（昂贵；[`https://www.adobe.com/products/photoshop.html`](https://www.adobe.com/products/photoshop.html)）或\
  \ GIMP（免费；[`https://www.gimp.org/`](https://www.gimp.org/)））。\n\n*   **设计软件：** 如果你想创建自己的图像并用于网页，你需要一个拥有实现你愿思蓝图所具备的工具的设计应用。你可以使用\
  \ Windows 画画板处理基础图像，但对于更具野心的工作，你可能需要功能齐全的软件，例如 Adobe Illustrator（昂贵；[`https://www.adobe.com/products/illustrator.html`](https://www.adobe.com/products/illustrator.html)）或\
  \ Inkscape（免费；[`https://inkscape.org/`](https://inkscape.org/)）。\n\n*   **FTP 客户端：**\
  \ 许多托管服务要求你将文件上传到服务器，这几乎意味着要使用 FTP（文件传输协议）程序。关于 FTP 和 FTP 客户端的更多信息，请参考第 1 册的 第 3\
  \ 章。\n\n### 使用 WebDev Workbench\n\n用于 HTML、CSS 和 JavaScript 构建网页的“编辑-保存-重新加载”工作流非常好，但有时你只是想尝试一个快速的实验或微调。这没有问题。（相反，学习\
  \ HTML、CSS 和 JavaScript 的最佳方法是频繁进行实验，并对代码进行小调整以观察会发生什么。）然而，创建一个新的 HTML 文件、保存它然后加载到浏览器中，取决于你的实验或微调的大小，可能会显得大材小用。\n\
  \n每当你只想尝试快速的网页编码时，最好的方法通常是使用在线环境，它允许你输入标签、规则或脚本并立即获得结果。CodePen ([`https://codepen.io/`](https://codepen.io/))\
  \ 是一个流行的在线网页开发工具。不过，我是否也可以谦虚推荐一个我自己构建的交互式在线开发沙箱？它被称为 WebDev Workbench，你可以在这里找到它：\n\
  \n[`https://webdevworkshop.io/wb`](https://webdevworkshop.io/wb) [`https://webdevworkshop.io/wb`](https://webdevworkshop.io/wb)\n\
  \n如图 2-2\n\n图 2-2： WebDev Workbench 是一个可以在其中玩玩的在线网页编码沙箱。\n\n当你准备好让你的作品运转时，点击 Run\
  \ 按钮，WebDev Workbench 会在底部框中渲染 HTML、CSS 和 JavaScript 结果（如图 2-2 **理解 Web 托管提供商**\n\
  \n![项目](img/check.png) **考察托管网站的各种选择**\n\n![项目](img/check.png) **选择适合你的主机**\n\n\
  ![项目](img/check.png) **环顾你的新家**\n\n![项目](img/check.png) **将你的网站文件传输到 Web 主机**\n\n\
  *没有什么比一堆未发表的文章更令人难闻的。*\n\n— 希尔维娅·普拉斯 (SYLVIA PLATH)\n\n你可以在 Mac 或 PC 上舒适地构建网页，如果你选择了良好的文本编辑器（正如我在第\
  \ 1 册 第 2 章 中所述的那样），你甚至可以使用电脑预览你的网页在浏览器中的外观。这很完美，但……\n\n\n\n\n\n如果你的资金紧张，少数几个托管提供商会出于好心将你的网站从“寒中”救出来。在某些情况下，这些服务仅对特定群体开放，例如学生、艺术家、非营利组织等。然而，许多提供商会免费提供个人网站。这有什么猫腻呢？嗯，几乎对你能存储的数据量以及存储的数据类型都有限制（不允许有广告、不允许有色情图片等）。你还可能被要求在页面上显示某种针对托管提供商的“横幅”广告。或者，也有很多网站可以免费托管你的页面且没有烦人的横幅广告。之处在于，这些网站只托管“静态”文件，这意味着不需要服务器处理数据的\
  \ HTML、CSS 和 JavaScript 文件。是一些值得关注的完全免费静态网站托管：\n\n* `Cloudflare Pages`: [`https://pages.cloudflare.com/`](https://pages.cloudflare.com/)\n\
  * `GitHub Pages`: [`https://pages.github.com/`](https://pages.github.com/)\n* `Netlify`:\
  \ [`https://www.netlify.com/`](https://www.netlify.com/)\n\n#### 注册商业托管提供商\n\n对于个人和业务相关的网站，许多\
  \ Web 工匠最终会从商业托管提供商那里租用一部分 Web 服务器。你通常需要支付笔设置费用来启动账户，然后就要面对月费。既然有这么多免费网站在周围，为什么还要花那笔钱呢？因为正如生活中的大多数事情一样，一分钱一分货。通过为你的主机付费，你通常可以获得更多的功能、更好的服务以及更少的困扰（例如某些免费网站显示的广告）。\n\
  \n### Web 托管购买指南\n\n遗憾的是，选择 Web 托管并不像你想象的那样简单。一方面，有数百个托管商在争夺你的业务；另一方面，普通 Web 托管商所采用的推销和手段充满了术语和技术词汇。我无法帮你减少\
  \ Web 托管商的数量，但我可以帮你理解这些托管商在说什么。以下是你在研究 Web 托管时最可能遇到的术语列表：\n\n* `存储空间`：指在托管商 Web\
  \ 服务器上分配给你的存储文件空间大小。你获得的容量大小决定了你可以存储的数据量。例如，如果你获得 1MB（1 兆字节）的限制，那么你就无法在服务器上存储超过\
  \ 1MB 的文件。HTML 文件并不占用多少空间，但大型图形确实会，所以你需要关注你的限制。例如，你可能可以在 1MB 的存储中存储大约 200 个页面（假设每页约\
  \ 5KB），但只能存储大约 20 张图像（假设每张图像约 50KB）。通常情况下，为主机付得越多，获得的存储空间就越多。\n\n* `带宽`：衡量服务器传输了多少数据的指标。例如，假设你页面的\
  \ HTML 文件是 1KB（1 千字节），页面相关的图形消耗 9KB。如果有人访问你的页面，服务器将总共发送 10KB；如果有 10 人访问该页面（无论是同时还是在一段时间内），总带宽就是\
  \ 100KB。大多数托管商会给你一个带宽限制（或“上限”），通常是每月若干兆字节或千字节。（1 千字节等于约 1000 兆字节）。同样，你付得越多，获得的带宽就越大。\n\
  \n![Warning](img/warning.png) 如果你超过了带宽限制，用户通常仍然能够访问你的页面（尽管某些托管商会关闭对违规站的访问）。然而，几乎所有的\
  \ Web 托管商都会对超出带宽的情况收取额外费用，因此在注册前请检查这种可能性。通常的罚金是每超出上限一个兆字节或千字节收取固定费用。\n\n* `域名`：通用的互联网地址，例如\
  \ `wiley.com` 或 `whitehouse.gov`。它们往往比大多数 Web 托管商默认为你提供的冗长地址更容易记忆，因此是一个很受欢迎的功能。有两种类型的域名可供选择：\n\
  \n    * 普通域名（如 `yourdomain.com` 或 `yourdomain.org`）\n    * 子域名（如 `yourdomain.webhostdomain.com`）\n\
  \n要获得普通域名，你需要使用许多域名注册服务之一，如 GoDaddy ([`www.godaddy.com/``](https://www.godaddy.com/))\
  \ 或 Register.com ([`www.register.com/``](https://www.register.com/))。更方便的方法是选择一个会为你处理此事的\
  \ 托管提供商。无论哪种方式，通常都需要花费 35 美元（尽管有些托管商提供廉价域名作为“引流产品”，并通过托管费收回成本；此外，像 GoDaddy 这样的折扣域名注册商提供的域名每年低至\
  \ 9.99 美元）。如果你选择直接购买，几乎所有的 Web 托管商都会托管你的域名，这意味着使用你域名的人将被重定向到托管商 Web 服务器上的你的网站。为了使之生效，你必须调整与域名关联的注册商域名系统（`DNS`；此系统将域名转换为互联网上资源的实际地址）服务器上的域名设置，使其指向托管商的域名。你的\
  \ Web 托管商会给你如何操作的说明。\n\n    使用子域名，“webhostdomain.com”是托管公司的域名，它会在开头加上你想要的任何名称。许多托管商会提供这种类型的域名，通常是免费的。\n\
  \n* `电子邮件地址`：大多数托管商会在提供 Web 空间的同时提供一个或多个电子邮件地址。你付得越多，获得的邮箱就越多。有些托管商提供 `邮件转发`，让你可以将发送到你的\
  \ Web 托管地址的消息重定向到其他邮箱地址。\n\n* `共享服务器`：如果托管商提供共享服务器（虚拟服务器），意味着你将与其他网站共享服务器——有几十个到数百个。Web\
  \ 托管商负责所有的技术服务器管理工作，所以你只需要维护自己的网站。对于个人或小企业类型来说，这无疑是最好的（也是商业选项中最便宜的）选择。\n\n* `专用服务器`：你在托管商处拥有自己的服务器计算机。这听起来可能是件好事，但通常由你来管理服务器，这可能是一项极其技术挑战性的任务。此外，专用服务器比共享服务器贵得多。\n\
  \n* `操作系统`：Web 服务器上的操作系统。你通常有两个选择：Unix（或 Linux）和 Windows Server。Unix 系统以可靠和快速著称，即使在高流量负载下也是如此，因此通常是共享服务器的最佳选择。Windows\
  \ 系统更适合专用服务器，因为它们比 Unix 同类更容易管理。此外，Unix 服务器对文件和目录的大小敏感，而 Windows 服务器不是。\n\n* `数据库`：你的账户可以创建的数据库数量。Unix\
  \ 系统通常提供 MySQL 数据库，而 Windows 服务器提供 SQL Server 数据库。\n\n* `管理界面`：这是用于执行服务器任务的托管应用程序，例如上传文件或创建用户。许多托管商提供优秀的\
  \ `cPanel` 界面，大多数基于 Unix 的系统提供 `phpMyAdmin` 应用来管理你的 MySQL 数据。\n\n\n\n\n\n*   **广告要求：**\
  \ 少数免费 Web 主机要求你在页面上显示某种类型的广告。这可能是页面顶部的横幅广告、每当有人访问你的页面时出现的“弹出式”广告，或者是“水印”广告（通常是悬浮在页面上的一个半透明标志）。幸运的是，如今坚持要投放广告的免费主机已经很少**了。\n\
  \n*   **可用性（Uptime）：** 主机服务器运行并提供服务的时间百分比。不存在 100% 的可用性，因为所有服务器在某些时候都需要进行维护和升级。然而，最好的主机可用性数字通常超过\
  \ 99%。（如果主机不宣传其可用性，很可能是因为该数值很低。在决定之前，请务必询问。）\n\n*   **技术支持：** 如果你在设置或访问网站时遇到问题，你希望知道以\
  \ `tech support` 形式提供的帮助触手可及的。最好的主机提供 24/7 技术支持，这意味着你可以通过电话、聊天或电子邮件每天 24 小时每周 7\
  \ 天与公司联系。\n\n*   **FTP 支持：** 你通常使用互联网的 `FTP` 服务将文件从计算机传输到 Web 主机。如果主机提供 `FTP access`（某些主机有自己的文件传输方法），请确保你可以随随地使用它，并且对单次传输的数据量没有限制。\n\
  \n*   **网站统计：** 告知你许多信息，例如有多少人访问了你的网站、哪些页面最受欢迎、你的页面消耗了多少带宽、访问者使用什么浏览器和浏览器版本等。大多数良好的主机都提供现成的统计数据包，但最好的主机还会提供访问“原始”日志文件的权限，以便你可以自己处理这些数据。\n\
  \n*   **电子商务：** 某些主机提供一种服务，让你建立一个网络“商店”，以便你可以在网站上销售商品。该服务通常包括一个“购物脚本”、信用卡授权和其他支付系统的访问权限，以及建立安全连接的能力。你通常在更昂贵的托管方案中才能获得这种功能，而且你通常需要支付设置费用来构建你的商店。\n\
  \n*   **可扩展性：** 主机可以根据需要修改你网站的功能。例如，如果你的网站变得非常受欢迎，你可能需要增加带宽限制。如果主机具有扩展性，它可以轻松地更改你的限制（或网站的任何其他功能）。\n\
  \n### 寻找 Web 主机\n\n好了，你准备好研究各种主机以寻找一个适合你网站风格的了。正如我之前提到的，有数百个甚至数千个主机，那么人该如何将它们缩减为短名单呢？这里有一些建议：\n\
  \n*   **询问你的朋友和同事。** 寻找好主机的最好方法是那个老掉牙的——口碑。如果你信任的人说某个主机很好，那么你可能不会失望。这有一个前提是你和你的朋友有相似的托管需求。如果你想要建立一个功能全面的电子商务网站，不要向那些只有一个简陋主页的人索求建议。\n\
  \n*   **向专家索取主机评论。** 询问现有的网站管理员和其他“圈内人士”他们推荐哪些主机，或者听过哪些主机的好评。寻找此类专家的好地方是 Web Hosting\
  \ Talk ([`www.webhostingtalk.com`](http://www.webhostingtalk.com))，这是一个与 Web 托管相关的论坛集合。\n\
  \n*   **联系 Web 主机客户。** 访问使用特定 Web 主机的网站，并向网站管理员发送电子邮件，询问他们对该主机服务的看法。\n\n*   **浏览\
  \ Web 主机列表。** 许多网站都会跟踪和比较 Web 主机，因此是获取大量研究信息的简单方法。不过要小心，因为那里有很多不可靠的列表，它们只是试图通过让你点击广告来赚钱。以下是一些值得信誉的起点：\n\
  \n    *   **CNET Web 托管解决方案：** [`www.cnet.com/web-hosting`](http://www.cnet.com/web-hosting)\n\
  \n    *   **PC Magazine 网站托管服务评测：** [`www.pcmag.com/reviews/web-hosting-services`](http://www.pcmag.com/reviews/web-hosting-services)\n\
  \n    *   **Review Hell：** [`www.reviewhell.com`](http://www.reviewhell.com)\n\n\
  \    *   **Review Signal Web 托管评论：** [`http://reviewsignal.com/webhosting`](http://reviewsignal.com/webhosting)\n\
  \n### 在你的新网络家中穿行\n\n在你注册 Web 托管提供商并建立账户后，网站管理员会为你创建两个东西：一个你可以用来存储网站文件的服务器目录，以及一个属于你自己的自己的\
  \ Web 地址。（如果你使用与公司或学校网络关联的 Web 服务器，也是如此。）该目录——在业内被称为 `root directory`——通常采取以下形式之一：\n\
  \n```\n`/`yourname`/`\n`/home/`yourname`/\n`/`yourname``/public_html/`\n```\n\n\
  在每情况下，`yourname` 是提供商分配给你的登录名（或用户名），也可能是你的域名（带有或不带 .com 部分）。记住，你的根目录是主机 Web 服务器的一个切片，这个切片由你随意操作。\n\
  \n#### 你的目录和你的地址\n\n在你注册 Web 托管提供商并建立账户后，网站管理员会为你创建两个东西：一个你可以用来存储网站文件的服务器目录，以及一个属于你自己的自己的\
  \ Web 地址。（如果你使用与公司或学校网络关联的 Web 服务器，也是如此。）该目录——在业内被称为 `root directory`——通常采取以下形式：\n\
  \n```\n`/`yourname`/`\n`/home/`yourname`/\n`/`yourname``/public_html/`\n```\n\n\
  在每情况下，`yourname` 是提供商分配给你的登录名（或用户名），也可能是你的域名（带有或不带 .com 部分）。记住，你的根目录是主机 Web 服务器的一个切片，这个切片由你随意操作。\n\
  \n#### 目录和地址\n\n在你注册 Web 托管提供商并建立账户后，网站管理员会为你创建两个东西：一个你可以用来存储网站文件的服务器目录，以及一个属于你自己的自己的\
  \ Web 地址。（如果你使用与公司或学校网络关联的 Web 服务器，也是如此。）该目录——在业内被称为 `root directory`——通常采取以下形式：\n\
  \n```\n`/`yourname`/`\n`/home/`yourname`/\n`/`yourname``/public_html/`\n```\n\n\
  在每情况下，`yourname` 是提供商分配给你的登录名（或用户名），也可能是你的域名（带有或不带 .com 部分）。记住，你的根目录是主机 Web 服务器的一个切片，这个切片由你随意操作。\n\
  \n（等等，提供的文本有重复章节/冲突结构。我将根据提示中提供的最终逻辑提供干净的版本。）\n\n### 在你的新网络家中穿行\n\n在你注册 Web 托管提供商并建立账户后，网站管理员会为你创建两个东西：一个你可以用来存储网站文件的服务器目录，以及一个属于你自己的自己的\
  \ Web 地址。（如果你使用与公司或学校网络关联的 Web 服务器，也是如此。）该目录——在业内被称为 `root directory`——通常采取以下形式：\n\
  \n```\n`/`yourname`/`\n`/home/`yourname`/\n`/`yourname``/public_html/`\n```\n\n\
  在每情况下，`yourname` 是提供商分配给你的登录名（或用户名），也可能是你的域名（带有或不带 .com 部分）。记住，你的根目录是主机 Web 服务器的一个切片，这个切片由你随意操作。\n\
  \n#### 让你的硬盘镜像你的家\n\n作为一名开发者，保持项目有序的关键方法之一是在计算机上设置目录，然后在 Web 主机上镜像这些目录。\n\n![记住](img/remember.png)\
  \ 将文件从计算机传输到远程位置（例如 Web 主机服务器）被称为 `uploading`。这个过程从根开始。\n\n\n\n\n![Tip](img/tip.png)\
  \ 为了避免混淆，考虑将你的本地根文件夹重命名，使其与 Web 主机的根目录名称相同。例如，如果你的 Web 主机分配给你的根目录名为 `public_html`，那么将你的本地根文件夹重命名为\
  \ `public_html` 是一个好主意。为了帮助你理解为什么镜像本地和远程目录结构如此有用，假设你在本地根文件夹中设置了一个名为 `graphics` 的子文件夹，用于存储图像文件。要在你的页面中插入该文件夹中名为\
  \ `mydog.jpg` 的文件，你将使用以下引用（请参阅第 2 本，第 3 章）：\n\n```\n`graphics/mydog.jpg`\n```\n\n\
  当你将 HTML 文件发送到服务器并在浏览器中显示该文件时，它会在 `graphics` 子目录中查找 `mydog.jpg`。如果你没有这样的子目录——要么是你没有创建它，要么是你使用了不同的名称（例如\
  \ `images`）——浏览器将找不到 `mydog.jpg`，你的图片也将无法显示。换句话说，如果你将 Web 服务器上的根子目录与计算机上的根子文件夹匹配，你的页面在本地和网络上都无需修改即可正常运行。\n\
  \n![Warning](img/warning.png) Web 开发者初学者犯的一个常见错误是在引用文件时包含了本地驱动器路径和所有文件夹名称。这是一个示例：\n\
  \n```\n`C:\\users\\paul\\documents\\public_html\\graphics\\mydog.jpg`\n```\n\n这张图片在你的计算机上查看时会正常显示，但当你将其上传到服务器并在网页上查看时，它会彻底失败。这是因为\
  \ `C:\\users\\paul\\documents\\` 部分仅存在于你的计算机上。\n\n![Warning](img/warning.png) 托管绝大多数\
  \ Web 服务器的 Unix（或 Linux）计算机在处理文件和目录名称中的大小写字母时非常挑剔。检查你代码中的文件引用至关重要，以确保你使用的文件和目录名称与服务器上使用的大小写组合匹配。例如，假设你的服务器上有一个名为\
  \ `styles.css` 的 CSS 文件。如果你的 HTML 以 `STYLES.CSS` 等引用了该文件，服务器将找不到该文件，你的样式也将无法应用。\n\
  \n#### 上传你的网站文件\n\n当你的网页或网站准备好首次秀场时，是时候将文件发送到主机的 Web 服务器了。如果服务器位于你的公司或学校网络上，你通过网络将文件发送到系统管理员设置的目录。否则，你将文件上传到托管提供商\
  \ Web 服务器上为你创建的根目录。你如何上传网站文件取决于 Web 主机，但这里有四种常见的场景：\n\n* **使用 FTP 程序。** 很少有 Web\
  \ 主机不支持文件传输协议（简称 FTP），这是互联网上从这里传输文件到那里最流行的方法。要使用 FTP，你通常需要获取名为 `FTP client` 的软件，它允许你连接到你的\
  \ Web 主机的 FTP 服务器（你的主机可以提供相关指令），并为标准文件任务提供界面，例如导航和创建文件夹、上传文件、删除和重命名文件等。适用于 Windows\
  \ 和 macOS 版本的流行（且免费！）FTP 应用程序有 Cyberduck ([`cyberduck.io`](https://cyberduck.io))\
  \ 和或 FileZilla ([`filezilla-project.org`](https://filezilla-project.org))。\n\n*\
  \ **使用文本编辑器的文件上传功能。** 某些文本编辑器内置了 FTP 客户端，因此你可以编辑文件并立即通过单个命令将其上传。Nova 文本编辑器 ([`nova.app`](https://nova.app)；仅限\
  \ macOS) 也支持这种非常方便的功能。\n\n* **使用 cPanel 的文件管理器功能。** 我之前提到过，许多 Web 主机提供一种名为 `cPanel`\
  \ 的管理工具，它提供了电子邮件和域名管理等托管任务的界面。`cPanel` 还提供了 `File Manager` 功能，你可以用它来上传文件并执行其他文件管理工作。\n\
  \n* **使用 Web 主机的专用上传工具。** 出于某些原因，少数 Web 主机提供自己的专用界面来上传和处理文件及目录。请查看你主机的帮助或支持页面获取说明。\n\
  \n#### 修改你的网页文件\n\n如果你将 Web 开发文件发送到 Web 主机，然后发现自己写错了拼写或发现了一个编码错误会怎样？或者如果你有更多信息要添加到其中一个网页中？该如何修改已经发送的文件？嗯，简单的答案是：你不需要。没错，在你发送文件之后，你再也不需要操心它们了。但这并不意味着你永远无法更新网站。相反，你对计算机上的文件进行修改，然后将这些修订后的文件发送到你的\
  \ Web 主机。这些文件将替换旧文件，你的网站就此更新了。\n\n![Warning](img/warning.png) 确保将更新后的文件发送到服务器上正确的目录。否则，你可能会疑惑为什么在浏览器中刷新页面时你的更改没有出现（并且还有你可能覆盖了某些其他目录中同名的文件）。\n\
  \n\n\n\n\n新手 Web 开发者会犯的最大错误之一就是使用单一网页浏览器来检查页面的进度。最常见的是开发者使用运行在 Windows 上的 Google\
  \ Chrome 作为唯一的测试浏览器。当然，该页面在 Chrome 上看起来非常完美，但当那些使用 Mac 上的 Firefox 或 iPad 上的 Safari\
  \ 的用户遇到页面问题时，开发者就会大吃一惊！\n\n诚然，Chrome 是目前最流行的网页浏览器，但作为 Web 开发者，令人苦恼的事实之一是并不是所有人都使用\
  \ Chrome，也不是所有人都使用桌面电脑上网。\n\n#### 查看浏览器市场份额\n\n为了证明并非所有人都使用 Chrome 浏览器或桌面式电脑，表 4-1\
  \ 列出了整体市场前四名的浏览器市场份额，并按桌面端、平板和智能手机进行了分类。\n\n| **市场** | **第一** | **第二** | **第三**\
  \ | **第四** |\n| --- | --- | --- | --- | --- |\n| 整体 | Chrome (64.5%) | Safari (18.8%)\
  \ | Edge (4.1%) | Firefox (3.4%) |\n| 桌面 | Chrome (65.8%) | Edge (11.1%) | Safari\
  \ (10.9%) | Firefox (6.5%) |\n| 平板 | Chrome (49.3%) | Safari (35.2%) | Android (13.3%)\
  \ | Opera (0.7%) |\n| 智能手机 | Chrome (64.6%) | Safari (25.1%) | Samsung Internet\
  \ (4.5%) | Opera (1.8%) |\n\n来源：StatCounter ([`https://gs.statcounter.com/browser-market-share`](https://gs.statcounter.com/browser-market-share))\n\
  \n表 4-1 浏览器市场份额（2023 年 3 月）\n\n这些数字证实了 Chrome 的流行，但它们也表明 Chrome 并没有*绝对*主导网页浏览器市场。是的，拥有大约三分之二的市场份额（整体、桌面和智能手机）确实令人印象深刻，但如果你只为\
  \ Chrome 编写代码，那么对于整整三分之一的访问者（以及超过一半的平板电脑访问者）来说，你完全是在盲目飞行。\n\n#### 你的跨浏览器测试套件\n\n\
  为了确保大多数访问你网站的人获得良好的体验，你需要扩展浏览器测试。一个最小的测试套件应包含以下内容：\n\n*   **Windows:** Chrome, Safari,\
  \ Edge 和 Firefox\n*   **Mac:** Chrome, Safari 和 Firefox\n*   **iPadOS:** Chrome\
  \ 和 Safari\n*   **Android 平板电脑:** Chrome\n*   **iOS:** Chrome 和 Safari\n*   **Android\
  \ 智能手机:** Chrome\n\n![Remember](img/remember.png) 几乎每个 Android 浏览器都是使用 Chromium\
  \ 构建的，它是 Google Chrome 的开源版本。这意味着这些浏览器都会像 Chrome 一样加载和渲染网页，因此你只使用 Chrome 作为 Android\
  \ 测试浏览器也是没问题的。\n\n#### 在线跨浏览器测试\n\n好了，我听到了你们对上一节提出的测试套件的*非常*强烈的反对：并不是所有人都拥有 Windows\
  \ PC 和 Mac！并不是所有人都同时拥有 Apple 和 Android 平板电脑以及智能手机！老鬼，并不是所有人同时拥有平板电脑和智能手机！\n\n这些都是合理的反对。那么如果你真的想进行广泛的跨浏览器测试，但无法访问各种浏览器、操作系统和设备，你该怎么办呢？\n\
  \n别担心：在线跨浏览器测试来了！有很多在线网站可以获取你的页面 URL 许多不同的（虚拟）浏览器上进行测试，然后向你显示结果。这些网站中的大多数在频繁使用时需要付费订阅，但它们每月每月提供限制次数的免费访问。以下是最流行的在线跨浏览器测试网站：\n\
  \n*   **BrowserStack:** [`www.browserstack.com/screenshots`](http://www.browserstack.com/screenshots)\n\
  *   **Comparium:** [`https://comparium.app/`](https://comparium.app/)\n*   **LambdaTest:**\
  \ [`www.lamdatest.com`](http://www.lamdatest.com)\n*   **Sauce Labs:** [`https://saucelabs.com`](https://saucelabs.com/)\n\
  \n### 理解验证（Validation）\n\n*验证*是一个检查代码是否存在错误和非标准语法的自动化过程。拥有有效的 HTML、CSS 和 JavaScript\
  \ 代码并不保证网页完美无缺，但它确实可以确保所有现代浏览器都能正确地解析和解释你的代码。如果你的代码是有效的但页面仍然看起来奇怪，你就知道问题出在其他地方（例如你页面的整体设计）。\n\
  \n那么，我所说的“有效”网页代码是指什么？这取决于语言：\n\n*   **HTML:** 网页超文本应用技术工作组（幸运的是，它几乎总是被缩写为更合理的 WHATWG）维护着所谓的\
  \ HTML 活标准（Living Standard），有些人也将其称为 HTML5。“活”的这部分意味着该标准在不断演进，因此没有大型的新版本发布，也没有子版本（如\
  \ 5.1 或 5.2.129）。当你验证 HTML 时，你正在将你的标签、属性和其他 HTML 内容与活标准中概述的规范进行比较（你可以在此处找到：[`https://html.spec.whatwg.org/`](https://html.spec.whatwg.org/)）；查看图\
  \ 4-1）。\n*   **CSS:** 世界维网联盟（W3C）维护着关于 CSS 各方面的大型规范集。这些方面被称为*模块*，涵盖了了颜色、字体、选择器和盒模型等\
  \ CSS 内容。当前版本是 CSS 3 修订版。当你验证 CSS 时，你正在将你的属性、声明和其他内容与 W3C 概述的规范进行比较（起始点：[`https://www.w3.org/TR/css/`](https://www.w3.org/TR/css/)）。\n\
  *   **JavaScript:** 非营利组织 Ecma International 维护维护一套不断演进的 JavaScript 标准，所有这些标准都属于\
  \ ECMAScript。每个版本都有版本号和发布年份。例如，第 6 版于 2015 年发布，因此也被称为 ECMAScript 2015（尽管这个重要的版本也被称为\
  \ JavaScript 6 或 JS 6）。在我写这里时，当前版本是第 13 版，ECMAScript 2022（图 4-3）。验证 JavaScript 意味着运行检查器（*linter*），它不仅会根据指定的\
  \ ECMAScript 版本查找错误，还会检查代码中的某些风格错误（例如不正确的缩进）。\n\n### 不要跳过验证！\n\n关于语法，有两种主要的流派：\n\
  \n*   **语法不重要：** 如果你想要表达的意思很清楚，没必要纠结语法。\n*   **语法至关重要：** 你可能偶尔写出语法糟糕但仍保留含义的内容，但更有可能的结果是写出难以解析、完全错误或令读者反感的内容。\n\
  \n\n\n\n\n与语法一样，关于验证也存在两种观点：\n\n*   **验证并不重要：** 如果你的网页能够正常渲染，就没有必要对你的代码进行验证。\n*\
  \   **验证至关重要：** 即使你的网页看起来渲染正常，包含无效的 HTML 或 CSS 代码意味着你的整体结构更加脆弱；读取你代码的程序（包括搜索引擎爬虫和如屏幕阅读器等辅助技术）可能会在解析代码时遇到困难；你可能会为某些访问者提供糟糕的用户体验。\n\
  \n因此，我认为我的立场很明确：你的写作应该是符合语法的，你的网页也应该使用经过验证的 HTML 和 CSS。好消息是，虽然编写完全语法的句子可能很难，但发布完全有效的\
  \ HTML 和 CSS 代码一点也不难，因为正如你将在接下来的章节中中学到的，有大量的免费工具可以提供帮助。\n\n### 验证你的 HTML 代码\n\n\
  HTML 为你的网页创建结构，因此，如果你的标签出错或属性错位，你的页面很可能会因此受到影响。幸运的是，保持 HTML 代码整洁比你想象的要简单得多，因为你可以在线进行验证，也可以在任何支持\
  \ HTML 文件的、足够强大的文本编辑器中直接进行验证。\n\n#### 在线验证 HTML\n\nW3C 运行着一个名为“标记验证服务”（查看图 4-4\n\
  \n图 4-4： W3C 的标记验证服务允许你通过地址、文件上传或代码输入来验证页面。\n\nW3C 的标记验证服务提供了三种验证 HTML 代码的：\n\n\
  *   **通过地址：** 如果你已将页面发布到网上，输入或粘贴页面的地址。\n*   **通过文件上传：** 将你的 HTML 文件上传到该服务。\n*  \
  \ **通过代码输入：** 输入或粘贴你的 HTML 代码。\n\n以下是其工作原理：\n\n1.  **使用你喜欢的 浏览器访问 [`validator.w3.org`](https://validator.w3.org)。**\n\
  \    标记验证服务的界面。\n2.  **告诉验证器你想要如何检查 HTML：**\n    *   **通过地址：** 确保选中了“Validate By\
  \ URI”选项卡（默认通常如此），然后使用 Address 文本框输入或粘贴想要验证的页面地址。\n        ![技术细节](img/technicalstuff.png)\
  \ URI 是 Uniform Resource Identifier（统一资源标识符）的缩写，指的是识别 Web 上使用的某些资源的任何字符集。URL（Uniform\
  \ Resource Locator，又称 Web 地址）就是 URI 的示例。\n    *   **通过文件上传：** 点击“Validate By File\
  \ Upload”选项卡，点击“Choose File”，使用打开对话框选择要验证的 HTML 文件，然后点击“Open”。\n    *   **通过代码输入：**\
  \ 点击“Validate By Direct Input”选项卡；然后使用大文本框输入或粘贴想要验证的 HTML 代码。\n3.  **点击 Check。**\n\
  \    标记验证服务会深入分析你的 HTML 代码并显示结果。如果你完美地处理了 HTML 中的每一个 `i` 和 `t`，你将看到如图 4-5 所示的 `No\
  \ errors or warnings to show` 信息。相反，如果你的代码出现问题，你将收到一个或多个错误消息，如图 4-6 所示。（在此示例中，验证器正在抱怨页面的\
  \ `head` 部分不包含 `title` 元素。）\n\n![截图显示如果你的 HTML 检查通过，会出现此页面？](img/9781394164684-fg010405.png)\n\
  \n图 4-5： 如果你的 HTML 通过，会出现此页面。\n\n#### 在你的文本编辑器中验证 HTML\n\n我在第一本书第 2 章中列了一份顶级文本编辑器列表。大多数应用程序都支持额外功能——被称为*插件*（add-ins）或*扩展*（extensions）——它们允许你安装并非默认包含在的功能。其中一个此类功能就是\
  \ HTML 验证，它可以实时检查你的 HTML 代码，并在你走错时立即通知你。\n\n![截图显示如果你的 HTML 不符合规范，你会收到一个或多个错误消息？](img/9781394164684-fg010406.png)\n\
  \n图 4-6： 如果你的 HTML 不符合规范，你会收到一个或多个错误消息。\n\n参考你编辑器的帮助文档了解如何安装 HTML 验证。由于 Visual Studio\
  \ Code 是目前 HTML 最流行的编辑器，以下是安装 HTML 验证的遵循步骤：\n\n1.  **启动 Visual Studio Code。**\n\
  2.  **打开扩展视图（Extensions view）。**\n3.  **搜索 `htmlhint`。**\n4.  **点击安装（Install）。**\n\
  [/content] [content]\n5.  **打开一个 HTML 文件。**\n6.  **该扩展现在会高亮显示代码中的错误。**\n\n\n\n1.\
  \ **使用最近的网络浏览器，导航至 [`https://jigsaw.w3.org/css-validator/`](https://jigsaw.w3.org/css-validator/)。**\n\
  \n   出现标记验证服务（Markup Validation Service）。\n\n2. **告诉验证器你想要如何检查 CSS：**\n\n   * **通过地址：**\
  \ 点击 `By URI` 标签页，然后使用 `Address` 文本框输入或粘贴想要验证的 HTML 文件地址（如果你的 CSS 位于该处）或 CSS 文件的地址。\n\
  \   * **通过文件上传：** 点击 `By File Upload` 标签页，点击 `Choose File`，使用 `Open` 对话框选择想要验证的\
  \ HTML 文件（如果你的 CSS 位于该处）或 CSS 文件，然后点击 `Open`。\n   * **通过代码输入：** 点击 `By Direct Input`\
  \ 标签页，然后使用文本框输入或粘贴想要验证的 CSS 代码。\n\n3. **点击 Check（检查）。**\n\n   CSS 验证服务将将你的 CSS 与官方规范进行比较，然后显示结果。如果你的\
  \ CSS 非常棒，你将看到这条俏皮的消息 `Congratulations! No error found`（祝喜！未发现错误），所示图 4-10。遗憾的是，如果你的\
  \ CSS 很糟糕，你将收到一个或多个错误消息，所示图 4-11。\n\n![如果你的 CSS 代码通过所有检查，将显示此页的截图](img/9781394164684-fg010410.png)\n\
