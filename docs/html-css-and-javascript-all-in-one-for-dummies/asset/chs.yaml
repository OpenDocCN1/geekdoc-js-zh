  \n图 10-6： 在断点模式下，将鼠标悬停在变量名上即可显示变量的当前值。\n\n#### 查看所有变量值\n\n你想要监控的大多数值都是变量，它们分为三种（或作用域）：\n\
  \n* **块级作用域（Block scope）：** 这些是在当前语句块内声明的变量，仅对该块可用。\n* **局部作用域（Local scope）：** 这些是在当前函数中声明的变量，仅对该函数可用。\n\
  * **全局作用域（Global scope）：** 这些是在任何函数之外声明的变量，使得它们页面上的任何脚本或函数可用。\n\n关于变量作用域的更详细介绍，请参考第\
  \ 4 本书，第 5 章。\n\n当你处于断点模式时，Chrome 调试工具（与所有主流浏览器调试器一样）会在右侧显示一个面板，其中包含一个显示你所有声明的变量当前值的区域。在\
  \ Chrome 中，该区域命名为 `Scope`，并包含几个列表：`Block`（块作用域变量）、`Local`（局部变量）和 `Script`（全局变量）。令人混淆的是，还有一个\
  \ `Global` 部分，它仅引用 `Window` 对象。Chrome 的 `Scope` 部分在图 10-4 中出现。\n\n在图 10-7 中，注意到某些局部变量显示值为\
  \ `undefined`。这些变量之所以未定义，是因为脚本尚未到达为变量赋值的点。\n\n![断点模式截图，Firefox 的 Scopes 部分显示了局部和全局变量的当前值。](img/9781394164684-fg041007.png)\n\
  \n图 10-7： 在断点模式下，Firefox 的 `Scopes` 部分显示了局部和全局变量的当前值。\n\n#### 添加观察表达式\n\n除了监控变量值外，JavaScript\
  \ 还允许你监控任何表达式的结果或对象属性的当前值。要做到这一点，你需要设置一个观察表达式（watch expression）来定义你想要监控的内容。这些观察表达式出现在浏览器调试工具的特殊区域中。以下是在\
  \ Chrome 中添加观察表达式的步骤（其他主流浏览器的步骤类似）：\n\n1. **将你的代码进入断点模式。**\n2. **在右侧面板中打开 Watch\
  \ 部分。**\n3. **点击 Add Watch Expression (+)。**\n会出现一个空白文本框。\n4. **在文本框中输入你的表达式，然后按\
  \ Enter 或 Return 键。**\n\n浏览器会添加该表达式并在右侧显示该表达式的当前值。图 10-8 显示了一个示例。\n\n![为你的代码定义观察表达式的截图。](img/9781394164684-fg041008.png)\n\
  \n图 10-8： 你可以为你的代码定义观察表达式。\n\n你可以使用以下技术来处理你的观察表达式：\n\n* **编辑观察表达式。** 双击表达式，对其进行编辑，然后按\
  \ Enter 或 Return 键。\n* **更新观察表达式的值。** 点击刷新观察表达式按钮（位于图 10-8 的右上角）。\n* **删除观察表达式。**\
  \ 将鼠标悬停在想要移除的观察表达式上；然后点击表达式右侧出现的删除图标 (X)。\n\n### 更多调试策略\n\n调试你的脚本可能是一项令人沮丧的工作，即使对于较小的脚本也是如此。在追踪编程问题时，记住以下几点：\n\
  \n* **缩进代码以提高可读性。** 当对每个语句块内的代码进行缩进时，JavaScript 代码的可读性会极大地提高。可读的代码更容易被追踪和解读，因此你的调试工作就少了一个障碍。缩进多少取决于个人风格，但通常是两个或四个空格：\n\
  \n```javascript\nfunction myFunction() {\n// 此函数块中的每条语句都缩进了四个空格。\n}\n```\n\n如果你在一个块内部嵌套另一个块，请将嵌套块再缩进四个空格：\n\
  \n```javascript\nfunction myFunction() {\n  // 此函数块中的每条语句都缩进了四个空格。\n  for (const\
  \ item of someArray) {\n    // 此嵌套 for…of 块中的每条语句又缩进了四个空格。\n  }\n}\n```\n\n* **拆解复杂任务。**\
  \ 不要试图一次性解决所有问题。如果你有一个运行不正常的大脚本或函数，请分块进行测试以尝试缩小问题范围。\n* **拆分长语句。** 脚本调试最复杂的方面之一是理解长语句（尤其是表达式）。Console\
  \ 窗口可以帮助（你可以使用它来打印语句的一部分），但通常最好是保持语句尽可能短。在你让程序正常运行之后，你通常可以重新组合语句以获得更高效的代码。\n* **注释掉问题语句。**\
  \ 如果某个特定语句给你带来问题，可以通过在行开头放置两个斜杠（`//`）来临时禁用它。斜杠告诉 JavaScript 将该视为注释。如果你有若干条语句想要跳过，在第一条语句的开头放置\
  \ `/*`，在最后一条语句的结尾放置 `*/`。\n* **使用注释来记录你的脚本。** 说到注释，有一个编程真理：良好的代码——意味着至少在部分使用了清晰的变量和函数名以及逻辑结构的代码——应该是自解释的。然而，几乎每个非复杂的代码段都包含当你以后检查它们时并不显而易见的区域。对于这些部分，另一个编程真理是解释性注释永远不够。你对代码中复杂且可能晦涩的部分添加的注释，你的脚本就越容易调试。\n\
  \n### 十种常见的 JavaScript 错误\n\n当你遇到脚本问题时，你应该做的第一件事是检查代码是否存在常见错误。为了帮助你这一点，这里列出了初学者和资深程序员常犯的十种常见错误：\n\
  \n* **将 JavaScript 关键字作为变量名。** JavaScript 有许多内置保留字和关键字，因此经常无意中将这些词用变量或函数名。双击你的名称，确保你没有使用任何保留字，或任何对象、属性或方法的名称。\n\
  * **变量或其他名称拼写错误。** 检查你的变量和函数名，确保它们在整个脚本中拼写一致。还要检查你使用的对象、属性和方法的拼写。\n* **误用大小写字母。**\
  \ JavaScript 是一种区分大小写的语言，这意味着它根据字母是大写还是小写来采取不同的对待。例如，考虑以下两个语句：\n\n```javascript\n\
  const firstName = \"Millicent\";\nconst message = \"Welcome \" + firstname;\n```\n\
  \n第一条语句声明了一个名为 `firstName` 的变量，但第二条语句使用了 `firstname`。这段代码会产生错误 `firstname is not\
  \ defined`（或类似的错误信息），因为 JavaScript 认为 `firstname` 是另一个（未初始化的）变量。\n\n\n\n\n\n*  \
  \ **引号不匹配。** 在任何语句中，如果你用引号（`\"` 或 `'`）开始了一个字符串字面量，请务必检查你是否在字符串末尾包含了相应的结束引号。此外，检查你是否在字符串内部使用了一个或多个相同的引号。如果是这样，请编辑字符串以使用正确的转义序列（`\\\
  \"` 或 `\\'`），或者切换到反引号（`` ` ``）：\n\n    ```javascript\n    // Bad\n    const myString\
  \ = \"There are no \"bad\" programs.\";\n\n    // Better\n    const myString = \"\
  There are no \\\"bad\\\" programs.\";\n\n    // Best\n    const myString = `There\
  \ are no \"bad\" programs.`;\n    ```\n\n*   **括号不匹配。** 检查你的-`code`-中的 `for` 语句，查看它们是否包含左括号\
  \ — `(` —— 并确保有相应的右括号：`)`。这同样适用于方括号 — `[` 和 `]` 以及大括号 — `{` 和 `}`。\n\n    ![Tip](img/tip.png)\
  \ 对于包含三或更多组括号的复杂表达式，快速的匹配检查方法是计算表达式中左括号的数量，然后计算右括号的数量。如果这些数字不匹配，你就知道表达式的某处存在不匹配的情况。\n\
  \n*   **函数名后漏掉括号。** 提到括号，如果你的脚本调用了一个不接受任何参数的函数或方法，请检查你是否在函数或方法名后包含了括号 — `()`：\n\n\
  \    ```javascript\n    function tryThis() {\n      alert(\"Parentheses travel in\
  \ pairs!\");\n    }\n\n    // This won't work\n    tryThis;\n\n    // This will\n\
  \    tryThis();\n    ```\n\n*   **大括号使用不当。** JavaScript 使用大括号来标记语句块的开始（`{`）和结束（`}`），关联于函数、涉及\
  \ `if` 和 `switch` 的测试以及循环（包括 `for…of`、`for`、`while` 和 `do…while`）。在块中很容易漏掉一个或两个大括号，而在一个测试或循环内部嵌套另一个时，混淆大括号会变得更容易。双重检查你的大括号，确保每个块都有起始括号和结束括号。\n\
  \n    ![Tip](img/tip.png) 一种确保你没有遗漏任何大括号的方法是在整个脚本中一致地放置它们。例如，许多人倾向于使用大括号位置的传统样式：\n\
  \n    ```javascript\n    `keyword` {\n      statements\n    }\n    ```\n\n    （在这里，`keyword`\
  \ 意味着定义该块的语句——例如 `function` 或 `if`。）如果你喜欢这种样式，请在整个脚本中一直使用，这样你就能确切知道在哪里找到每个大括号。\n\
  \n    确保你永远不会忘记结束大括号的简单方法是在输入起始括号后立即输入结束括号。也就是说，你输入 `{`，按两次回车键，然后输入 `}`。\n\n   \
  \ 此外，对块内的语句使用一致的缩进。一致的缩进使得查看大括号变得容易，特别是当你有一个块嵌套在另一个块内部时。\n\n*   **使用 `=` 或 `==`\
  \ 代替 `===`。** 恒等运算符（`===`）是 JavaScript 最不直观的特征之一，因为赋值运算符（=`）看起来要自然得多。相等运算符（`==`）可能会引起问题，因为它在进行比较之前通常会转换数据类型。因此，检查你所有的比较表达式，确保你始终使用\
  \ `===` 代替 `=` 或 `==`。\n\n*   **全局变量与块或局部变量之间的冲突。** 全局变量在整个页面中可用，即使在块和函数内部也是。因此，在块或函数内部，确保你没有声明并使用与全局变量同名的变量。\n\
  \n*   **在元素加载之前使用页面元素。** JavaScript 逐行运行页面的 HTML，并在遇到每个 JavaScript 语句时检查其语法。如果你的代码引用了\
  \ JavaScript 尚未处理到的元素（例如表单字段），它将生成错误。因此，如果你的代码处理某个元素，请务必将脚本放在 HTML 文件中该元素之后。\n\n\
  ### 十大常见 JavaScript 错误信息\n\n为了帮助你解读 JavaScript 抛出的错误信息，这里是十种常见错误列表及其含义：\n\n*   `Syntax\
  \ error`（语法错误）。这种加载时错误意味着 JavaScript 在语句中检测到了不当的语法。错误信息几乎总是会告诉你错误发生的确切行号和字符。例如，如果你参考图\
  \ 10-1 所示所示错误消息，请注意在错误消息的右侧你会看到以下内容：\n\n    ```text\n    example01:17:18\n    ```\n\
  \n    这段文字表示错误发生在 `example01` 文件中、第 17 行、第 18 个字符位置（从语句开始计算）。\n\n*   `Expected (`（预期\
  \ `(`）或 `Missing (`（缺失 `(`）。这些消息意味着你忘记包含左括号：\n\n    ```javascript\n    function\
  \ changeBackgroundColor newColor) {\n    ```\n\n    如果你忘记的是右括号，你将得到 `Expected )`\
  \ 或 `Missing )`：\n\n    ```javascript\n    function changeBackgroundColor (newColor{\n\
  \    ```\n\n*   `Expected {`（预期 `{`）或 `Missing { before function body`（函数体前缺失 `{`）。这些错误告诉你你的代码缺少了函数的起始大括号：\n\
  \n    ```javascript\n    function changeBackgroundColor (newColor)\n      statements\n\
  \    }\n    ```\n\n    如果你缺少的是结束大括号，你将得到 `Expected }` 或 `Missing } after function\
  \ body` 错误。\n\n*   `Unexpected end of input`（输入意外结束）或 `Missing } in compound statement`（复合语句中缺失\
  \ `}`）。这些消息意味着你忘记了 `if` 块或其他复合语句中的结束大括号：\n\n    ```javascript\n    if (currentHour\
  \ < 12) {\n      console.log(\"Good morning!\");\n    } else {\n      console.log(\"\
  Good day!\");\n    }\n    ```\n\n    如果你忘记的是起始大括号，反而会得到一个 `Syntax error` 消息，它令人困惑地指向块的结束大括号（这是浏览器首次意识到错误的地方）。\n\
  \n*   `Missing ;`（缺失 `;`）或 `Missing ; after for-loop initializer|condition`（for\
  \ 循环初始化器|条件后缺失 `;`）。这些错误意味着 `for` 循环定义缺少分号（`;`），要么是你忘记了分号，要么是因为你使用了其他字符（如逗号）：\n\n\
  \    ```javascript\n    for (let counter = 1; counter < 5, counter += 1) {\n   \
  \ ```\n\n*   `Unexpected identifier`（意外标识符）或 `Missing ; before statement`（语句前缺失\
  \ `;`）。这些错误告诉你上一个语句由于某种原因没有正常结束，或者你用无效的值开始了一个新语句。在 JavaScript 中，语句应该以分号（`;`）结束，但使用分号是可选的。因此，如果\
  \ JavaScript 认为你没有完成语句，它会假设缺少分号。例如，这发生在你忘记包含开始多行注释的 `/*` 时：\n\n    ```javascript\n\
  \    Start the comment (oops!)\n    Close the comment */\n    ```\n\n*   `X is not\
  \ defined`（X 未定义）。此消息通常指的是一个名为 `X` 的未声明或初始化的变量，你正尝试在表达式中使用它。如果是这种情况，请声明并初始化该变量。另一个原因是未包含引号的字符串字面量。最后，还要检查你是否拼写了变量名：\n\
  \n    ```javascript\n    const grossProfit = 100000;\n    const profitSharing =\
  \ grossPrifit * profitSharingPercent;\n    ```\n\n*   `X is not an object`（X 不是对象）或\
  \ `X has no properties`（X 没有属性）。这些消息意味着你的代码引用了一个不存在的对象，或者引用了不属于指定对象的属性。检查你是否拼写了对象或属性，或者对于后者，检查你是否使用了错误的对象：\n\
  \n    ```javascript\n    document.alert(\"Nope!\")\n    ```\n\n*   `terminated string\
  \ constant`（字符串常量终止）或 `Unterminated string literal`（未终止的字符串字面量）。这两个消息都意味着你用引号开始了一个字符串字面量，但忘记包含结束引号：\n\
  \n    ```javascript\n    const greeting = \"Welcome to my Web site!\n    ```\n\n\
  \n\n\n\n*   `此页面上的脚本导致 [browser name] 运行缓慢。你是否要中止脚本？` 或 `JavaScript 仍在运行。继续吗？`。这些错误告诉你，代码可能陷入了无限循环。你无法获得关于导致问题的具体信息，因此你需要仔细检查代码以寻找可能的原因。\n\
  \n## 第 11 章\n\n### 处理表单数据\n\n本章内容\n\n![Bullet](img/check.png) **编码文本框**\n\n![Bullet](img/check.png)\
  \ **编写复选框和单选按钮**\n\n![Bullet](img/check.png) **处理选择列表**\n\n![Bullet](img/check.png)\
  \ **监控和触发表单事件**\n\n![Bullet](img/check.png) **处理表单数据**\n\n*编程比其他活动需要更集注意力。这就是为什么程序员对“快速中断”感到恼源——这种中断等同于让一个杂技演员在保持三个球在空中的同时，还要提着你的杂物。*\n\
  \n—STEVE MCCONNELL\n\n构建 HTML 表单（本书 2 的主题，第 5 章）是很酷且有趣的，但你可能已经注意到你的表单中有些微令人沮丧的地方：它们并没有真正做什么！诚然，切换复选框、从列表中选择值以及从颜色选择器中选择色调确实会有某种成就感，但这种成就感是转瞬即逝的。这就像装修厨房，转动新烤箱的旋钮，结果什么都没有发生。为什么呢？没电！为什么你的\
  \ HTML 表单没有任何反应？因为没有 JavaScript！\n\n在本章中，你将学习如何通过将 HTML 表单接入某些 JavaScript 代码来“接线”。你将探索各种与表单相关的对象，然后直接开始编写文本字段、复选框、单选按钮和选择列表。你还将深入学习实用的表单事件世界，甚至学习如何使用快捷键增强你的表单控件。最后，你还可以尽情发挥，学习如何使用我在本书\
  \ 4 第 9 章 中介绍的 Web 存储 API 来存储表单数据。\n\n### 查看 HTMLFormElement 对象\n\n`form` 元素是一个\
  \ `HTMLFormElement` 对象，它提供了几个可能有用的属性（在每情况下，假设 `form` 是 `form` 元素对象的引用）：\n\n*   `form`.action`:\
  \ 表单 `action` 属性的值\n*   `form`.elements`: 返回表单所有控件的集合（一个 `HTMLFormControlsCollection`\
  \ 对象）\n*   `form`.length`: 表单中控件的数量\n*   `form`.method`: 表单 `method` 属性的值\n*   `form`.name`:\
  \ 表单 `name` 属性的值\n*   `form`.target`: 表单 `target` 属性的值\n\n### 预览 HTMLInputElement\
  \ 对象\n\n任何基于 `input` 元素的表单字段都是 `HTMLInputElement` 对象，它提供了许多实用的属性（在每情况下，假设 `input`\
  \ 是 `input` 元素对象的引用）：\n\n*   `input`.form: 元素所在的表单（一个 `HTMLFormElement` 对象）\n* \
  \  `input`.labels: 返回与元素相关的 `label` 元素的 `NodeList`\n*   `input`.name: 元素的 `name`\
  \ 属性的值\n*   `input`.type: 元素的 `type` 属性\n*   `input`.value: 元素的当前值\n*   `input`.valueAsDate:\
  \ 元素的当前值，解释为日期\n*   `input`.valueAsNumber: 元素的当前值，解释为时间值，然后是数字\n\n### 编写文本字段\n\n\
  基于文本的字段是最常用的表单元素，大多数大多数使用 `<input>` 标签。`input` 元素有许多属性（参见本书 2 第 5 章），但从编码的角度来看，你通常对感兴趣四个：\n\
  \n`<input id=\"textId\" type=\"textType\" name=\"textName\" value=\"textValue\"\
  >`\n\n*   `textId`: 文本字段的唯一标识符\n*   `textType`: 你在表单中使用的文本字段类型\n*   `textName`:\
  \ 你分配给字段的名称\n*   `textValue`: 字段的初始值（如果有）\n\n#### 通过字段类型引用文本字段\n\n一种常见的表单脚本技术是对相同类型的每个字段执行操作。例如，你可能想对所有\
  \ URL 字段应用样式。以下是用于选择给定类型的所有 `input` 元素的 JavaScript 选择器：\n\n`document.querySelectorAll('input[type=fieldType]')`\n\
  \n*   `fieldType`: 你想要选择的 `type` 属性值，例如 `text` 或 `url`\n\n这里是一个示例，JavaScript 返回所有使用类型\
  \ `url` 的 `input` 元素的集合（查看本书的示例文件中的 bk04ch11/example01.html）：\n\nHTML:\n\n```html\n\
  <label for=\"url1\">站点 1:</label>\n<input id=\"url1\" type=\"url\" name=\"url1\"\
  \ value=\"https://\">\n<label for=\"url2\">站点 2:</label>\n<input id=\"url2\" type=\"\
  url\" name=\"url2\" value=\"https://\">\n<label for=\"url3\">站点 3:</label>\n<input\
  \ id=\"url3\" type=\"url\" name=\"url3\" value=\"https://\">\n```\n\nJavaScript:\n\
  \n```javascript\nconst urlFields = document.querySelectorAll('input[type=url]');\n\
  console.log(urlFields);\n```\n\n#### 获取文本字段值\n\n你的脚本可以使用字段对象的任与值相关的属性来获取任何文本字段的当前值：\n\
  \n*   `field`.value\n*   `field`.valueAsDate\n*   `field`.valueAsNumber\n\n*   `field`:\
  \ 你想要处理的表单字段对象的引用\n\n这是一个示例（查看 bk04ch11/example02.html）：\n\nHTML:\n\n```html\n<label\
  \ for=\"search-field\">搜索站点:</label>\n<input id=\"search-field\" name=\"q\" type=\"\
  search\">\n```\n\nJavaScript:\n\n```javascript\nconst searchString = document.getElementById('search-field').value;\n\
  console.log(searchString);\n```\n\n#### 设置文本字段值\n\n要更改文本字段的值，将新字符串分配给字段对象的 `value`\
  \ 属性：\n\n`field`.value = value`\n\n*   `field`: 你想要处理的表单字段对象的引用\n*   `value`: 你想分配给文本字段的字符串\n\
  \n这是一个示例（bk04ch11/example03.html）：\n\nHTML:\n\n```html\n<label for=\"homepage-field\"\
  >输入你的首页地址:</label>\n<input id=\"homepage-field\" name=\"homepage\" type=\"url\"\
  \ value=\"HTTPS://PAULMCFEDRIES.COM/\"\">\n```\n\nJavaScript:\n\n```javascript\n\
  const homepageField = document.getElementById('homepage-field');\nconst homepageURL\
  \ = homepageField.value;\nhomepageField.value = homepageURL.toLowerCase();\n```\n\
  \nHTML 定义了一个 `url` own `input` 元素，其默认值为大写。JavaScript 代码获取一个 URL，将其转换为全小写字母，然后将其返回同一个\
  \ `url` 字段。如图 11-1 所示，文本框现在显示全小写字母。\n\n![默认文本转换为全小写字母的截图。](img/9781394164684-fg041101.png)\n\
  \n图 11-1： 脚本将 `input` 元素的默认文本转换为全小写字母。\n\n### 编写复选框\n\n你在 Web 表单中使用复选框切换设置的开启（即复选框被选中）和关闭（即复选框未被选中）。你通过在表单包含以下版本的\
  \ `<input>` 标签来创建复选框：\n\n`<input id=\"checkId\" type=\"checkbox\" name=\"checkName\"\
  \ value=\"checkValue\" [checked]>`\n\n*   `checkId`: 复选框的唯一标识符。\n*   `checkName`:\
  \ 你分配给复选框的名称。\n*   `checkValue`: 你分配给复选框的值。注意，这是一个隐藏值，你的脚本在表单提交时可以访问它；用户永远不会遇到它。\n\
  \n*   `checked`: 当此可选属性存在时，复选框初始为被选中状态。\n\n\n\n\n\n![Remember](img/remember.png)\
  \ 复选框字段的一个奇怪之处是，它只有在被选中时才会包含在表单提交中。如果复选框未被选中，它就不会包含在提交中。\n\n#### 引用复选框\n\n如果你的代码需要引用页面所有的复选框，请使用以下选择器（bk04ch11/example04.html）：\n\
  \n`document.querySelectorAll('input[type=checkbox]')`\n\n只想获取特定表单中的复选框，可以在表单的 `id`\
  \ 值使用后代或子选择器：\n\n`document.querySelectorAll('#*formid* input[type=checkbox]')`\n\
  \n或者：\n\n`document.querySelectorAll('#*formid* > input[type=checkbox]')`\n\n####\
  \ 获取复选框状态\n\n在讨论复选框的“值”时你需要小心。如果你想处理的是 `value` 属性，那么通过复选框对象的 `value` 属性获取它，与获取文本字段的\
  \ `value` 没有区别。\n\n然而，你可能更感兴趣复选框是否被选中或取消。这被称为复选框状态。在这种情况下，你需要检查复选框对象的 `checked`\
  \ 属性：\n\n`checkbox.checked`\n\n*   `checkbox`: 你想要处理的复选框对象的引用\n\n如果复选框被选中，`checked`\
  \ 返回 `true`；如果未选中，则返回 `false`。\n\n这是一个示例（bk04ch11/example05.html）：\n\nHTML:\n\n\
  ```html\n<label>\n  <input id=\"autosave\" type=\"checkbox\" name=\"autosave\">\n\
  \  自动保存此项目\n</label>\n```\n\nJavaScript:\n```javascript\nconst autoSaveCheckBox\
  \ = document.querySelector('#autosave');\nif (autoSaveCheckBox.checked) {\n  console.log(`${autoSaveCheckBox.name}\
  \ is checked`);\n} else {\n  console.log(`${autoSaveCheckBox.name} is unchecked`);\n\
  }\n```\n\nJavaScript 代码在 `autoSaveCheckBox` 变量中存储了复选框对象的引用。然后，一个 `if` 语句检查对象的 `checked`\
  \ 属性，并根据 `checked` 返回 `true` 还是 `false` 在控制台中显示不同的消息。\n\n#### 设置复选框状态\n\n要将复选框字段设置为选中或未选中状态，请将布尔表达式赋值给\
  \ `checked` 属性：\n\n`checkbox.checked = Boolean`\n\n*   `checkbox`: 你想要处理的复选框对象的引用。\n\
  *   `Boolean`: 你想要赋值给复选框的布尔值或表达式。使用 `true` 选中复选框；使用 `false` 取消选中。\n\n例如，假设你有一个有很多复选框的表单，你想设置该表单让使用户最多选择三个复选框。以下是实现该功能的代码（bk04ch11/example06.html）：\n\
  \n```javascript\ndocument.querySelector('form').addEventListener('click', event\
  \ => {\n  // 确保点击的是复选框\n  if (event.target.type === 'checkbox') {\n    // 获取已选中复选框的总数\n\
  \    const totalSelected = document.querySelectorAll('input[type=checkbox]:checked').length;\n\
  \    // 是否选中了超过三个复选框？\n    if (totalSelected > 3) {\n      // 如果是，取消刚点击的复选框的选择\n\
  \      event.target.checked = false;\n    }\n  }\n});\n```\n\n当点击 `form` 元素内的任何内容时，该事件处理器就会运行，并将点击事件的引用作为参数\
  \ `event` 传递。然后代码使用 `:checked` 选择器返回所有具有 `checked` 属性的 `checkbox` 元素集合，`length`\
  \ 属性告诉你有集合中的多少元素。一个 `if` 测试检查现在是否选中了三个以上的复选框。如果真的，代码将取消刚点击的复选框的选择。\n\n### 处理单选按钮\n\
  \n如果你想为用户提供一组相关选项，且一次只能选择一个，那么单选按钮（radio buttons）是最佳选择。表单单选按钮以两个或多个组成一组，每组在任何时候只能有一个按钮被选中。如果用户点击该组中的另一个按钮，该按钮将变为选中，而之前选中的按钮将变为未选中。\n\
  \n使用以下 `<input>` 标签的变体创建单选按钮：\n\n`<input id=\"radioId*\" type=\"radio\" name=\"\
  radioGroup*\" value=\"radioValue*\" [checked]>`\n\n*   `radioId`: 单选按钮的唯一标识符。\n\
  *   `radioGroup`: 你分配给单选按钮组的名称。所有使用相同 `name` 值的单选按钮都属于该组。\n*   `radioValue`: 你想要分配给单选按钮的值。如果表单提交时此单选按钮被选中，则该值将包含在提交中。\n\
  *   `checked`: 当此可选属性存在时，单选按钮初始为选中状态。\n\n#### 引用单选按钮\n\n如果你的代码需要处理页面所有的单选按钮，请使用此\
  \ JavaScript 选择器：\n\n`document.querySelectorAll('input[type=radio]')`\n\n如果你想要特定表单中的单选按钮，可以在表单的\
  \ `id` 值使用后代或子选择器：\n\n`document.querySelectorAll('#*formid* input[type=radio]')`\n\
  \n或者：\n\n`document.querySelectorAll('#*formid* > input[type=radio]')`\n\n如果你只需要特定组的单选按钮，请使用以下\
  \ JavaScript 选择器，其中 `radioGroup` 是组的共同名称：\n\n`document.querySelectorAll('input[name=radioGroup*]')`\n\
  \n#### 获取单选按钮状态\n\n如果你的代码需要知道某个特定的单选按钮是被选中还是未选中，你需要确定单选按钮的状态。你可以通过检查单选按钮的 `checked`\
  \ 属性来实现，如下：\n\n`radio.checked`\n\n*   `radio`: 你想要处理的单选按钮对象的引用\n\n如果单选按钮被选中，`checked`\
  \ 属性返回 `true`；如果未选中，则返回 `false`。\n\n例如，考虑以下 HTML（bk04ch11/example07.html）：\n\n```html\n\
  <form>\n  <fieldset>\n    <legend>选择一种交付方式</legend>\n    <label>\n      <input type=\"\
  radio\" id=\"carrier-pigeon\" name=\"delivery\" value=\"pigeon\" checked>信鸽\n  \
  \  </label>\n    <label>\n      <input type=\"radio\" id=\"pony-express\" name=\"\
  delivery\" value=\"pony\">马马快递\n    </label>\n    <label>\n      <input type=\"\
  radio\" id=\"snail-mail\" name=\"delivery\" value=\"postal\">蜗牛信件\n    </label>\n\
  \    <label>\n      <input type=\"radio\" id=\"some-punk\" name=\"delivery\" value=\"\
  bikecourier\">骑自行车的朋子\n    </label>\n  </fieldset>\n</form>\n```\n\n以下语句存储了 `id`\
  \ 值为 `pony-express` 的单选按钮的状态：\n\n`const ponySelected = document.querySelector('#pony-express').checked;`\n\
  \n然而，你的代码可能更想知道组中哪一个单选按钮被选中了。你可以通过对组应用 `:checked` 选择器，然后获取返回对象的 `value` 属性来实现：\n\
  \n`const deliveryMethod = document.querySelector('input[name=delivery]:checked').value;`\n\
  \n![Tip](img/tip.png) 要获取与单选按钮关联的标签（label）文本，请使用 `input` 元素的 `labels` 属性获取 `label`\
  \ 元素的引用，然后使用 `innerText` 属性获取标签文本：\n\n`document.querySelector('input[name=delivery]:checked').labels[0].innerText;`\n\
  \n#### 设置单选按钮状态\n\n要将单选按钮字段设置为选中或未选中状态，请将布尔表达式赋值给 `checked` 属性：\n\n`radio.checked\
  \ = Boolean`\n\n*   `radio`: 你想要更改的单选按钮对象的引用。\n*   `Boolean`: 你想要赋值给单选按钮的布尔值或表达式。使用\
  \ `true` 选中单选按钮；使用 `false` 取消选中。\n\n\n\n\n\n例如，在上一节的 HTML 代码中，表单组的初始状态是选中了第一个单选按钮。你可以通过选择该按钮来重置该组。你可以获取第一个单选按钮的\
  \ `id` 引用，但如果以后你更改（或其他人更改）了单选按钮的顺序怎么办？更安全的方法是获取组中第一个单选按钮的引用（无论它是什么），然后选择该元素。这里是实现此操作的代码（bk04ch11/example08.html）：\n\
  \n```javascript\nconst firstRadioButton = document.querySelectorAll('input[name=delivery]')[0];\n\
  firstRadioButton.checked = true;\n```\n\n这段代码使用 `querySelectorAll()` 返回 `delivery`\
  \ 组中所有单选按钮的 `NodeList` 集合；然后使用 `[0]` 引用集合中的第一个元素。接着，将该元素的 `checked` 属性设置为 `true`。\n\
  \n### 编程中的选择列表\n\n选择列表在 HTML 表单中非常常见，因为它们允许 Web 开发人员在大多数用户都知道如何操作的紧凑控件中显示较多的选项。\n\
  \n要创建列表容器，你使用 `<select>` 标签：\n\n`<select id=\"selectId\" name=\"selectName\" size=\"\
  selectSize\" [multiple]>`\n\n*   `selectId`: 选择列表的唯一标识符。\n*   `selectName`: 你想要分配给选择列表的名称。\n\
  *   `selectSize`: 选择列表框中可见的行数（可选）。如果你省略此值，浏览器将列表显示为下拉框。\n*   `multiple`: 当存在此可选属性时，用户被允许在在列表中选择多个选项。\n\
  \n对于列表中的每个项目，你需要在 `<select>` 和 `</select>` 标签之间添加一个 `<option>` 标签：\n\n`<option value=\"\
  optionValue\" [selected]>`\n\n*   `optionValue`: 你想要分配给列表选项的值。\n*   `selected`:\
  \ 当存在此可选属性时，该列表选项初始为被选中状态。\n\n#### 检查 HTMLSelectElement 对象\n\n选择列表是一个 `HTMLSelectElement`\
  \ 对象，它提供了许多实用的属性（在每种情况下，假设 `select` 是选择列表对象的引用）：\n\n*   `select.form`: 选择列表所在的表单（一个\
  \ `HTMLFormElement` 对象）。\n*   `select.length`: 选择列表中 `option` 元素的数量。\n*   `select.multiple`:\
  \ 一个布尔值，如果选择列表包含 `multiple` 属性，则返回 `true`；否则返回 `false`。\n*   `select.name`: 选择列表\
  \ `name` 属性的值。\n*   `select.options`: 选择列表中包含的 `option` 元素（一个 `HTMLOptionsCollection`\
  \ 对象）。\n*   `select.selectedIndex`: 第一个选中 `option` 元素的索引（第一个 `option` 元素的索引值从 `0`\
  \ 开始）。如果没有选中任何 `option` 元素，此属性返回 `-1`。\n*   `select.selectedOptions`: 选择列表中当前选中的\
  \ `option` 元素（一个 `HTMLCollection` 对象）。\n*   `select.type`: 选择列表类型：普通列表为 `select-one`，应用了\
  \ `multiple` 属性的列表为 `select-multiple`。\n*   `select.value`: 第一个选中 `option` 元素的 `value`\
  \ 属性。如果没有选中任何 `option` 元素，此属性返回空字符串。\n\n#### 检查 HTMLOptionElement 对象\n\n选择列表中的每个\
  \ `option` 元素都是一个 `HTMLOptionElement` 对象。这里有几个需要记住的 `HTMLOptionElement` 属性（在每种情况下，假设\
  \ `option` 是 `option` 元素对象的引用）：\n\n*   `option.defaultSelected`: 一个布尔值，如果 `option`\
  \ 元素默认包含 `selected` 属性，则返回 `true`；否则返回 `false`。\n*   `option.form`: `option` 元素所在的表单（一个\
  \ `HTMLFormElement` 对象）。\n*   `option.index`: `option` 元素在选择中的索引（第一个 `option` 元素的索引值从\
  \ `0` 开始）。\n*   `option.selected`: 一个布尔值，如果 `option` 元素当前被选中，则返回 `true`；否则返回 `false`。\n\
  *   `option.text`: `option` 元素的文本内容。\n*   `option.value`: `option` 元素的 `value` 属性的值。\n\
  \n#### 引用选择列表选项\n\n如果你的代码需要处理选择列表中的所有选项，请使用选择列表对象的 `options` 属性（bk04ch11/example09.html）：\n\
  \n```javascript\ndocument.querySelector('list').options\n```\n\n*   `list`: 指定你想要处理的\
  \ `select` 元素的选择器。\n\n要处理列表中的特定选项，请使用 JavaScript 的方括号运算符（`[]`）来指定选项在列表中的位置索引（bk04ch11/example09.html）：\n\
  \n```javascript\ndocument.querySelector('list').options[n]\n```\n\n*   `list`: 指定你想要处理的\
  \ `select` 元素的选择器。\n*   `n`: 列表中第 n 个选项的索引。\n\n要获取选项的文本，请使用选项对象的属性：\n\n```javascript\n\
  document.querySelector('list').options[2].text\n```\n\n#### 获取选中的选项\n\n如果你的代码需要知道列表中的特定选项是否被选中，请检查\
  \ `selected` 属性，如下：\n\n```javascript\noption.selected\n```\n\n*   `option`: 你想要处理的\
  \ `option` 元素的引用。\n\n如果选项被选中，`selected` 属性返回 `true`；如果选项未选中，则返回 `false`。例如，考虑以下选择列表：\n\
  \n```html\n<select id=\"hair-color\" name=\"hair-color\">\n  <option value=\"black\"\
  >Black</option>\n  <option value=\"blonde\">Blonde</option>\n  <option value=\"\
  brunette\" selected>Brunette</option>\n  <option value=\"red\">Red</option>\n  <option\
  \ value=\"neon\">Something neon</option>\n  <option value=\"none\">None</option>\n\
  </select>\n```\n\n下面的 JavaScript 语句存储了选择列表中第一个项目的状态：\n\n```javascript\nlet black\
  \ = document.querySelector('#hair-color').options[0].selected;\n```\n\n然而，你更有可能想知道列表中哪个选项被选中了。你通过列表的\
  \ `selectedOptions` 属性来实现：\n\n```javascript\nconst hairColor = document.querySelector('#hair-color').selectedOptions[0];\n\
  ```\n\n这不是一个多选列表，因此指定 `selectedOptions[0]` 返回选中的 `option` 元素。在这个示例中，你的代码可以使用 `hairColor.text`\
  \ 获取选中选项的文本。\n\n如果列表包含 `multiple` 属性，`selectedOptions` 属性可能会返回包含多个元素的 `HTMLCollection`。你的代码需要允许这种可能性，例如通过遍历集合（bk04ch11/example10.html）：\n\
  \n```html\n<select id=\"hair-products\" name=\"hair-products\" size=\"5\" multiple>\n\
  \  <option value=\"gel\" selected>Gel</option>\n  <option value=\"grecian-formula\"\
  \ selected>Grecian Formula</option>\n  <option value=\"mousse\">Mousse</option>\n\
  \  <option value=\"peroxide\">Peroxide</option>\n  <option value=\"shoe-black\"\
  >Shoe black</option>\n</select>\n```\n\n```javascript\nconst selectedHairProducts\
  \ = document.querySelector('#hair-products').selectedOptions;\nfor (const hairProduct\
  \ of selectedHairProducts) {\n  console.log(hairProduct.text);\n}\n```\n\n#### 修改选中的选项\n\
  \n要将选择列表选项设置为选中或未选中状态，请将布尔表达式分配选项对象的 `selected` 属性：\n\n`option.selected = Boolean`\n\
  \n*   `option`: 你想要修改的 `option` 元素的引用。\n*   `Boolean`: 你想要分配给选项的布尔值或表达式。使用 `true`\
  \ 选中选项；使用 `false` 取消选中。\n\n\n\n\n\n使用上一节中的 HTML 代码，以下语句选择了列表中的第三个选项：\n\n```javascript\n\
  document.querySelector('#hair-products').options[2].selected = true;\n```\n\n你可以通过取消选择所有选项来重置列表。这可以通过将选择选择列表对象的\
  \ `selectedIndex` 属性设置为 `-1` 来实现：\n\n```javascript\ndocument.querySelector('#hair-products').selectedIndex\
  \ = -1\n```\n\n### 处理和触发表单事件\n\n由于存在大量的点击、输入、标签页切换和拖拽操作，Web 表单是副其实的事件工厂。幸运的是，你可以忽略大多数此类事件，但有少数几个确实非常有用，无论是在事件发生时运行代码，还是由你手动触发这些事件。\n\
  \n大多数表单事件都是点击，因此你可以通过使用 JavaScript 的 `addEventListener()` 方法设置 `click` 事件处理程序来处理它们（我将在第\
  \ 4 卷第 6 章] 中介绍）。这里是一个示例（`bk04ch11/example11.html`）：\n\nHTML:\n```html\n<form>\n\
  \  <label for=\"user\">Username:</label>\n  <input id=\"user\" type=\"text\" name=\"\
  username\">\n  <label for=\"pwd\">Password:</label>\n  <input id=\"pwd\" type=\"\
  password\" name=\"password\">\n</form>\n```\n\nJavaScript:\n```javascript\ndocument.querySelector('form').addEventListener('click',\
  \ () => {\n  console.log('Thanks for clicking the form!');\n});\n```\n\n这个示例监听了整个\
  \ `form` 元素的点击，但你也可以为按钮、`input` 元素、复选框、单选按钮等等创建 `click` 事件处理程序。\n\n#### 设置焦点\n\n\
  一个可以提高表单页面用户体验的简单功能是在页面加载时，为第一个表单字段设置焦点。设置焦点可以避免用户在第一个字段内进行那次恼人的点击。\n\n要实现这一点，请在你希望启动时获取焦点的元素上运行\
  \ JavaScript 的 `focus()` 方法：\n\n`field.focus()`\n\n- `field`: 你希望获取焦点的表单字段的引用。\n\
  \n这是一个示例，在启动时为 `id` 等于 `user` 的文本框设置焦点（`bk04ch11/example12.html`）：\n\nHTML:\n```html\n\
  <form>\n  <label for=\"user\">Username:</label>\n  <input id=\"user\" type=\"text\"\
  \ name=\"username\">\n  <label for=\"pwd\">Password:</label>\n  <input id=\"pwd\"\
  \ type=\"password\" name=\"password\">\n</form>\n```\n\nJavaScript:\n```javascript\n\
  document.querySelector('#user').focus();\n```\n\n#### 监控焦点事件\n\n与其设置焦点，你可能更想监控特定字段何时获得焦点（例如，通过用户点击或使用标签键进入该字段）。你可以通过在字段上设置\
  \ `focus` 事件处理程序来监控这一点：\n\n```javascript\nfield.addEventListener('focus', () =>\
  \ {\n  // 焦点代码写在这里\n});\n```\n\n- `field`: 你想要监控 `focus` 事件的表单字段的引用。\n\n这里是一个示例（`bk04ch11/example13.html`）：\n\
  \n```javascript\ndocument.querySelector('#user').addEventListener('focus', () =>\
  \ {\n  console.log('The username field has the focus!');\n});\n```\n\n#### 监控失去焦点（blur）事件\n\
  \n设置元素焦点的反面是让元素*失去焦点*（blur），这会移除元素上的焦点。你通过在元素上运行 `blur()` 方法来使其失去焦点，会导致失去焦点：\n\n\
  ```javascript\nfield.blur()\n```\n\n- `field`: 你不再希望拥有焦点的表单字段的引用。\n\n然而，与其让元素失去焦点，你可能更想在特定元素失去焦点时运行某些代码（例如，通过用户点击或使用标签键离开字段）。你可以通过设置\
  \ `blur()` 事件处理程序来监控特定的失去焦点的元素：\n\n```javascript\nfield.addEventListener('blur',\
  \ () => {\n  // 失去焦点代码写在这里\n});\n```\n\n- `field`: 你想要监控 `blur` 事件的表单字段的引用。\n\n\
  这里是一个示例（`bk04ch11/example14.html`）：\n\n```javascript\ndocument.querySelector('#user').addEventListener('blur',\
  \ () => {\n  console.log('The username field no longer has the focus!');\n});\n\
  ```\n\n#### 监听元素变化\n\n最用的表单事件之一是 `change` 事件，它在字段的值或状态以某种方式被修改时触发。该事件的触发取决于元素的类型：\n\
  \n- 对于 `textarea` 元素和各种与文本相关的 `input` 元素，`change` 事件在元素失去焦点时触发。\n- 对于复选框、单选按钮、选择列表和选择器，`change`\
  \ 事件在用户点击元素以修改选择或值时立即触发。\n\n你通过设置 `change()` 事件处理程序来监听字段的 `change` 事件：\n\n```javascript\n\
  field.addEventListener('change', () => {\n  // 变化代码写在这里\n});\n```\n\n- `field`:\
  \ 你想要监控 `change` 事件的表单字段的引用。\n\n这里是一个示例（`bk04ch11/example15.html`）：\n\nHTML:\n```html\n\
  <label for=\"bgcolor\">Select a background color</label>\n<input id=\"bgcolor\"\
  \ type=\"color\" name=\"bg-color\" value=\"#ffffff\">\n```\n\nJavaScript:\n```javascript\n\
  document.querySelector('#bgcolor').addEventListener('change', (event) => {\n  const\
  \ backgroundColor = event.target.value;\n  document.body.bgColor = backgroundColor;\n\
  });\n```\n\nHTML 代码设置了一个颜色选择器。JavaScript 代码为选择器应用了 `change` 事件处理程序。当选择器触发 `change`\
  \ 事件时，代码通过引用 `event.target.value` 将新颜色值存储在 `backgroundColor` 变量中，其中 `event.target`\
  \ 指向绑定事件监听器的元素（在此例中为颜色选择器）。然后代码将该颜色应用到 `body` 元素的 `bgColor` 属性。\n\n### 为表单控件创建快捷键\n\
  \n![Remember](img/remember.png) 网页是一种非常适合点击（或触摸）的介质，但这并不意味着你不能为你的界面构建一些键盘支持。例如，为任何\
  \ HTML 标签添加 `tabindex=\"0\"` 属性会自动使该元素变为“可标签聚焦的”（这意味着用户可以通过按一次或多次 Tab 键为该元素设置焦点）。\n\
  \n另一个很好的例子是出现在你大多数或所有页面上的按钮。在那种情况下，你可能还可以通过使用 `document` 对象的 `keydown` 事件（在用户按下但尚未释放按键时触发）或\
  \ `keyup` 事件（在用户释放按键时触发）来定义快捷键。你通过设置事件处理程序来为网页定义键盘快捷键。你的事件处理程序需要寻找两种键：\n\n- **特殊键：**\
  \ 这些包括 Alt、Ctrl（或 Mac 上的 Control）、Shift 和 Meta（即 Mac 上的 ⌘）。当用户按下特殊键时，`KeyboardEvent`\
  \ 对象会将下列属性之一设为 true：`altKey`、`ctrlKey`、`shiftKey` 或 `metaKey`。\n- **任何其他键：** 这包括典型键盘上的字母、数字和符号。在这种情况下，被按下的键将作为\
  \ `KeyboardEvent` 对象的 `key` 属性返回。\n\n这里是一个示例（`bk04ch11/example16.html`）：\n\nHTML:\n\
  ```html\n<button type=\"button\">Run Me!</button>\n<p>Keyboard shortcut: Ctrl+Shift+E</p>\n\
  ```\n\nJavaScript:\n```javascript\n// 为按钮的 'click' 事件添加监听器\ndocument.querySelector('button').addEventListener('click',\
  \ (event) => {\n  // 修改按钮文本\n  event.target.innerText = 'Thanks!';\n  // 3 秒后重置按钮\n\
  \  setTimeout(() => {\n    document.querySelector('button').innerText = 'Run Me!';\n\
  \  }, 3000);\n});\n\n// 为 'keydown' 事件添加监听器\ndocument.addEventListener('keydown',\
  \ function(event) {\n  // 检查 Ctrl+Shift+E 是否都被按下\n  if(event.ctrlKey && event.shiftKey\
  \ && event.key === 'E') {\n    // 如果是，触发按钮的 'click' 事件\n    document.querySelector('button').click();\n\
  \  }\n});\n```\n\n\n\nHTML 创建了一个简单的按钮。JavaScript 为按钮的 `click` 事件设置了事件处理器，该处理器会更改按钮的文本，然后使用\
  \ `setTimeout()` 在三秒后将文本改回。代码还设置了一个 `keydown` 事件处理器，用于检查是否同时按下了 `Ctrl`、`Shift` 和\
  \ `E` 键。如果是的话，代码将调用按钮的 `click()` 方法，从而触发 `click` 事件并执行 `click` 事件处理器。\n\n### 处理表单数据\n\
  \n我之前没有提到过另外一个表单相关的事件，而且它非常重要：`submit` 事件，当表单数据准备发送到服务器时，该事件就会触发。\n\n然而，如果你的脚本仅在本地处理表单数据——也就是说，你从不将数据发送到服务器——那么你就不需要费心提交表单了。相反，更直接的方法是在你的表单中添加一个按钮，然后使用该按钮的\
  \ `click` 事件处理器以你需要的任何方式处理表单数据。\n\n![提示](img/tip.png) 将表单数据提交到服务器超出了本书的范围。如果你感兴趣，我在我的配套书籍《Web\
  \ Coding and Development All-in-One For Dummies》（Wiley）中详细介绍了了这些内容。\n\n这是一个示例（bk04ch11/example17.html）：\n\
  \nHTML:\n\n```html\n<form>\n<fieldset>\n<legend>\n设置\n</legend>\n<label for=\"background-color\"\
  >选择背景颜色</label>\n<input id=\"background-color\" type=\"color\" name=\"bg-color\"\
  \ value=\"#ffffff\">\n<label for=\"text-color\">选择文字颜色</label>\n<input id=\"text-color\"\
  \ type=\"color\" name=\"text-color\" value=\"#000000\">\n<label for=\"font-stack\"\
  >选择字体：</label>\n<select id=\"font-stack\" name=\"font-stack\">\n<option value=\"\
  Georgia, 'Times New Roman', serif\" selected>衬线体</option>\n<option value=\"Verdana,\
  \ Tahoma, sans-serif\">无衬线体</option>\n<option value=\"'Bradley Hand', Brush Script\
  \ MT, cursive\">草体</option>\n<option value=\"Luminari\">幻想字体</option>\n<option value=\"\
  Monaco, Courier, monospace\">等宽字体</option>\n</select>\n<button>\n保存你的设置\n</button>\n\
  </fieldset>\n</form>\n```\n\nJavaScript:\n\n```javascript\n// 监听 #background-color\
  \ 颜色选择器的变化\ndocument.querySelector('#background-color').addEventListener('change',\
  \ function() {\n  const backgroundColor = this.value;\n  document.body.style.backgroundColor\
  \ = backgroundColor;\n});\n\n// 监听 #text-color 颜色选择器的变化\ndocument.querySelector('#text-color').addEventListener('change',\
  \ function() {\n  const textColor = this.value;\n  document.body.style.color = textColor;\n\
  });\n\n// 监听 #font-stack 选择列表的变化\ndocument.querySelector('#font-stack').addEventListener('change',\
  \ function() {\n  const fontStack = this.selectedOptions[0].value;\n  document.body.style.fontFamily\
  \ = fontStack;\n});\n\n// 监听按钮点击\ndocument.querySelector('button').addEventListener('click',\
  \ () => {\n  // 将表单数据存储在 JavaScript 对象中\n  const userSettings = {\n    backgroundColor:\
  \ document.querySelector('#background-color').value,\n    textColor: document.querySelector('#text-color').value,\n\
  \    fontStack: document.querySelector('#font-stack').selectedOptions[0].value\n\
  \  };\n  // 将设置保存在本地存储中\n  localStorage.setItem('user-settings', JSON.stringify(userSettings));\n\
  });\n```\n\nHTML 设置了一个表单（查看图 11-2）来收集一些用户设置——背景颜色、文字颜色和字体样式——以及一个按钮。JavaScript 为两个颜色选择器选择列表设置了\
  \ `change` 事件处理器。最后，代码监听按钮上的 `click` 事件，处理器将表单数据存储在 JavaScript 对象中，然后将数据保存到本地存储（参见第\
  \ 4 卷，第 9 章）。\n\n![收集页面用户设置的截图](img/9781394164684-fg041102.png)\n\n图 11-2： 用于收集页面用户设置的表单。\n\
  \n第 5 卷\n\n## 使用布局变得美观\n\n### 目录\n\n1.  第 1 章：探索布局基础\n    1.  掌握页面流\n    2.  浮动元素\n\
  \    3.  定位元素\n    4.  堆叠元素\n2.  第 2 章：玩转 Flexbox\n    1.  引入 Flexbox\n    2.  既然\
  \ CSS Grid 已经出现，我还需要 Flexbox 吗？\n    3.  设置和配置 Flex 容器\n    4.  控制 Flex 项目\n3. \
  \ 第 3 章：使用 CSS Grid 布局页面\n    1.  引入 CSS Grid\n    2.  设置网格容器\n    3.  指定网格行和列\n\
  \    4.  控制网格项目\n    5.  对齐网格\n4.  第 4 章：创建响应式布局\n    1.  什么是响应式布局？\n    2.  顺流：流式布局\n\
  \    3.  通过查询实现响应式：适应布局\n    4.  响应式处理图像\n    5.  探索移动优先开发原则\n\n第 1 章\n\n## 探索布局基础\n\
  \n本章内容\n\n*   掌握页面流\n*   通过浮动元素打破流\n*   定位元素\n*   将元素堆叠在一起\n\n*将链接颜色、页面布局、导航系统和视觉层级等基本背景斥为无聊或平庸，等于嘲笑汽车的方向盘缺乏想象力。*\n\
  ——JEFFRY VEEN\n\n\n\n\n![记住](img/remember.png) 这些规则假设当前语言文本是从左到右、从上到下阅读的（例如英语）。在某些语言（如希伯来语和阿拉伯语）中，默认文本流是从右到左、从上到下的。在垂直布局语言中，默认文本流是从上到下，然后是从右到左（如日语和中文）或从左到右（如蒙古语）。\n\
  \n这被称为 `page flow`（页面流）。例如，考虑以下 HTML 代码（参考本书示例文件中的 `bk05ch01/example01.html`）：\n\
  \n```html\n<header>\n`页眉放在在这里。`\n</header>\n<nav>\n`导航组件放在在这里。`\n</nav>\n<section>\n\
  `这是页面的第一部分。`\n</section>\n<section>\n`这是——你猜得了——页面的第二部分。`\n</section>\n<aside>\n\
  `这是一个幽默或极其有趣的侧边栏。`\n</aside>\n<footer>\n`页脚放在在这里。`\n</footer>\n```\n\n这段代码是六个块级元素的集合——一个\
  \ `header`、一个 `nav`、两个 `section` 标签、一个 `aside` 和一个 `footer`——图 1-1 显示了网页浏览器如何将它们渲染为堆叠盒子。\n\
  \n![网页浏览器将块级元素渲染为堆叠盒子的示意图。](img/9781394164684-fg050101.png)\n\n图 1-1： 网页浏览器将块级元素渲染为堆叠盒子。\n\
  \n默认的页面流本身没有问题，但让你的网页渲染为一堆盒子就缺乏某种风味。幸运的是，由于你的创意，你并不受限于默认的、一个接一个堆叠流。CSS 提供了许多实用的方法来打破正常的页面流，并为你的页面增添活力。在本章中，你将学习其中三种方法：浮动、定位和堆叠。\n\
  \n### 浮动元素 (Floating Elements)\n\n当你对一个元素进行 `float`（浮动）时，网页浏览器会将该元素移出默认页面流。元素在页面上的位置取决于你是向左浮动还是向右浮动：\n\
  \n* **左浮动 (Float left)：** 浏览器将元素放置在其父容器内尽可能靠左且尽可能靠的位置。\n* **右浮动 (Float right)：**\
  \ 浏览器将元素放置在其父容器内尽可能靠右且尽可能靠的位置。\n\n在两种情况下，未浮动的元素都会环绕浮动元素流动。\n\n你通过添加 `float` 属性来说服网页浏览器浮动一个元素：\n\
  \n```css\n`element` {\nfloat: left|right|none;\n}\n```\n\n例如，考虑以下代码（查看 `bk05ch01/example02.html`）及其在图\
  \ 1-2 中的渲染效果：\n\n```html\n<header>\n<img src=\"images/notw.png\" alt=\"News of the\
  \ Word logo\">\n<h1>News of the Word</h1>\n<h2>你可以在任何地方都找不到的语言新闻（这有道理！）</h2>\n</header>\n\
  <nav>\n<a href=\"#\">首页</a>\n<a href=\"#\">更新内容</a>\n<a href=\"#\">旧内容</a>\n<a href=\"\
  #\">内容是什么</a>\n<a href=\"#\">那是<em>什么</em>？</a>\n</nav>\n```\n\n![如往常，浏览器将块级元素显示为堆叠盒子的截图。](img/9781394164684-fg050102.png)\n\
  \n图 1-2： 如既往一样，浏览器将块级元素显示为堆叠盒子。\n\n在图 1-2 中，注意网页浏览器正在使用它通常的页面流技巧：将所有块级元素堆叠在一起。然而，我认为如果标题和副标题（`h1`\
  \ 和 `h2` 元素）出现在 Logo 的右侧，这个页面看起来会更好。为了做到，我可以将 `img` 元素向左浮动（`bk05ch01/example03.html`）：\n\
  \n```css\nheader > img {\nfloat: left;\nmargin-right: 2em;\n}\n```\n\n图 1-3 显示了结果。随着\
  \ Logo 向左浮动，标题和副标题——`h1` 和 `h2` 元素——现在环绕（或者准确地说，位于……右侧）`img` 元素。\n\n![当 Logo 向左浮动时，标题和副标题环绕着它的截图。](img/9781394164684-fg050103.png)\n\
  \n图 1-3： 当 Logo 向左浮动时，标题和副标题环绕着它。\n\n#### 示例：创建引言 (pull quote)\n\n`pull quote`（引言）是从当前页面文本中复制（“拉取”）的简短摘录。摘录应该是具有启发性或趣味性的，且引言与正文隔离开来。一个选择得且设计良好的引言可以吸引犹豫不决的访客去阅读（或至少开始阅读）文章。\n\
  \n你通过复制文章摘录并将其放在 `aside` 等元素内部来创建引言。然后你浮动该元素，通常是向右。根据需要对元素进行样式处理，使其与正文区分开来就完成了。\n\
  \n这是一个示例（`bk05ch01/example04.html`）：\n\nHTML（部分）：\n\n```html\n<p>\n“这些话完全没什么道理，”他说。\n\
  </p>\n<aside class=\"pullquote\">\n他们无法理解任何人发给他们的短信内容。\n</aside>\n<p>\n长期以来，人们认为青少年即时消息包含缩写（例如用\
  \ <i>LOL</i> 表示“大笑”，用 <i>MAIBARP</i> 表示“我的青春痘正变成一个严重的问题”）、短形式（如用 <i>L8R</i> 表示“以后”，用\
  \ <i>R2D2</i> 表示“R2D2”）以及俚语（如用 <i>whassup</i> 表示“怎么了”，用 <i>yo</i> 表示“你好，很高兴认识你。你想聊聊天吗？”）。然而，报告显示，这种所谓的“青少年语言”变化得如此快，以至于孩子们根本跟不上。每个青少年都发展了自己的行话，即时消息系统陷入了混乱状态。\n\
  </p>\n```\n\nCSS:\n\n```css\n.pullquote {\nborder-top: 4px double black;\nborder-bottom:\
  \ 4px double black;\nfloat: right;\ncolor: hsl(0deg, 0%, 40%);\nfont-size: 1.9rem;\n\
  font-style: italic;\nmargin: 0 0 0.75rem 0.5rem;\npadding: 8px 0 8px 16px;\nwidth:\
  \ 50%;\n}\n```\n\n图 1-4 显示了效果。\n\n#### 清除浮动 (Clearing floats)\n\n非浮动内容的默认行为是环绕任何浮动内容，这通常是你想要的。然而，你有时并不希望元素环绕你的浮动元素。例如，考虑以下代码（`bk05ch01/example05.html`）以及它的渲染效果，如图\
  \ 1-5 所示：\n\n```html\n<header>\n<h1>你能读懂告示牌吗？</h1>\n</header>\n<nav>\n<a href=\"\
  /\">首页</a>\n<a href=\"semantics.html\">符号</a>\n<a href=\"contact.html\">联系我们</a>\n\
  <a href=\"about.html\">建议告示牌</a>\n</nav>\n<article>\n<img src=\"/images/keep-off-grass.jpg\"\
  \ alt=\"草地上的一条小路旁有一块写着请勿践草的告示牌。\">\n</article>\n<footer>\n&copy; Can't You Read?,\
  \ Inc.\n</footer>\n```![当图像向左浮动时，页脚环绕着它并出现在奇怪的地方的截图。](img/9781394164684-fg050105.png)\n\
  \n图 1-5： 当图像向左浮动时，页脚环绕着它并出现在奇怪的地方。\n\n由于 `img` 标签向左浮动，其余内容环绕着它，包括 `footer` 标签的内容，它现在出现在图像的顶部。\n\
  \n你自然希望页脚出现在页面底部，那么该如何修复这个问题呢？通过告诉网页浏览器定位 `footer` 元素，使其*清除*（clear）浮动的图像，这意味着它在页面流中图像之后。你通过添加\
  \ `clear` 属性来清除元素：\n\n```css\n`element` {\nclear: left|right|both|none;\n}\n```\n\
  \n\n\n\n使用 `clear: left` 可以清除所有左浮动元素，使用 `clear: right` 清除所有右浮动元素，或使用 `clear: both`\
  \ 清除所有元素。当我向 `footer` 元素添加 `clear: left`（`bk05ch01/example06.html`）时，你可以从图 1-6 中注意到页脚内容现在出现在页面的底部。\n\
  \n```css\nfooter {\nclear: left;\n}\n```\n\n![显示向 footer 元素添加 clear: left 会导致页脚清除左浮动图像并出现在页面底部的截图](img/9781394164684-fg050106.png)\n\
  \n图 1-6： 在 `footer` 元素上添加 `clear: left` 会导致页脚清除左浮动图像并出现在页面底部。\n\n#### 容器塌陷发生在前！\n\
  \nCSS 的怪异显然是无止尽的，浮动就是又一个例子。考虑以下 HTML（`bk05ch01/example07.html`）以及它在图 1-7 中的结果：\n\
  \n```html\n<article>\n<section>\n在很久很久以前……\n</section>\n<aside>\n<b>注意：</b> 通过……创建一个新词。\n\
  </aside>\n</article>\n```\n\n![显示包含一个 ltltltsectiongtgtgt 标签和一个 ltltltasidegtgtgt\
  \ 标签的 ltltltarticlegtgtgt 标签，使用默认页面流渲染](img/9781394164684-fg050107.png)\n\n图 1-7：\
  \ 一个包含 `<section>` 标签和 `<aside>` 标签的 `<article>`，使用默认页面流渲染。\n\n请特别注意，我为 `article`\
  \ 元素设置了边框样式。\n\n与图 1-10 所示的堆块相比，你可能更希望 `section` 和 `aside` 元素并排出现。好主意！于是你为它们都添加了\
  \ `width` 属性，并将 `section` 元素向左浮，将 `aside` 元素向右浮。这里是规则（`bk05ch01/example08.html`），图\
  \ 1-8 显示了结果。\n\n```css\nsection {\nfloat: left;\nwidth: 25rem;\n}\naside {\nfloat:\
  \ right;\nwidth: 16rem;\n}\n```\n\n![显示由于其内容浮动，ltltltarticlegtgtgt 元素塌陷到仅剩边框](img/9781394164684-fg050108.png)\n\
  \n图 1-8： 在内容浮动后，`<article>` 元素塌陷到仅剩边框。\n\n好吧，这太奇怪了！顶部的横线是 `article` 元素的剩余部分。发生了什么？因为我同时浮动了\
  \ `section` 和 `aside` 元素，浏览器将它们移出了页面流，这导致 `article` 元素的表现就像没有任何内容一样。结果是什么？被称为“容器塌陷”的\
  \ CSS 异常。\n\n要修复这个问题，你必须强制父容器清除自己的子元素。\n\nHTML:\n```html\n<article class=\"self-clear\"\
  >\n```\n\nCSS:\n```css\n.self-clear::after {\ncontent: \"\";\ndisplay: block;\n\
  clear: both;\n}\n```\n\n`::after` 伪元素告诉浏览器添加一个空字符串（因为你不想在页面上添加任何实质性内容），这个空字符串被显示为一个块，使用\
  \ `clear: both` 来清除容器的子元素。这很奇怪，但它有效，如图 1-9（`bk05ch01/example09.html`）所示。\n\n![显示在\
  \ ltltltarticlegtgtgt 标签上添加 self-clear 类后，article 元素现在清除了自己的子元素且不再塌陷](img/9781394164684-fg050109.png)\n\
  \n图 1-9： 在 `<article>` 标签上添加 `self-clear` 类后，`article` 元素现在清除了自己的子元素且不再塌陷。\n\n###\
  \ 元素定位\n\n打破网络浏览器默认“堆叠框”页面流的第二个主要方法是使用 CSS 属性自行定位元素。例如，你可以告诉浏览器将图像放置在窗口的左上角，无论该元素的\
  \ `<img>` 标签出现在页面 HTML 代码的什么位置。在 CSS 世界中，这被称为定位（positioning），它是一个非常强大的工具，以至于大多数\
  \ Web 开发者只克制地使用它。\n\n你需要了解的第一个定位魔法是，名副其实的 `position` 属性：\n\n```css\nelement {\n\
  position: static|relative|absolute|fixed|sticky;\n}\n```\n\n*   `static`：将元素放在页面流中的默认位置。\n\
  *   `relative`：在保持元素留在页面流中的同时，相对于其默认位置偏移。\n*   `absolute`：相对于其父容器（有时是更早的祖先容器）从默认位置偏移，同时将元素移出页面流。\n\
  *   `fixed`：相对于浏览器视口（viewport）从其默认位置偏移，同时将元素移出页面流。\n*   `sticky`：元素从相对定位开始，直到元素的父元素相对于浏览器视口越过了指定的偏移量（通常是因为用户正在滚动页面），此时元素切换到固定定位。如果元素父块的边界随后滚动到元素固定住的位置，则元素将恢复为相对定位并随父元素滚动。\n\
  \n由于 `static` 定位是浏览器的默认行为，我将不再多说它的内容。对于其他四个定位值——`relative`、`absolute`、`fixed` 和\
  \ `sticky`，请注意每一个值都偏移了元素。这些偏移从哪里来？来自以下 CSS 属性：\n\n```css\nelement {\ntop: top-value;\n\
  right: right-value;\nbottom: bottom-value;\nleft: left-value;\n}\n```\n\n*   `top`：将元素向下移动\n\
  *   `right`：将元素从右侧移动\n*   `bottom`：将元素向上移动\n*   `left`：将元素从左侧移动\n\n在每情况下，你提供的值要么是数字加上一个\
  \ CSS 测量单位（如 `px`、`em`、`rem`、`vw` 或 `vh`），要么百分比。\n\n#### 使用相对定位\n\n相对定位有点奇怪，因为它不仅相对于父容器偏移元素，而且仍然保持元素在页面流中默认空间的完整性。\n\
  \n这是一个示例（`bk05ch01/example10.html`）：\n\nHTML:\n```html\n<h1>\nholloway\n</h1>\n\
  <div>\n<i>n.</i> 凹陷的小径或道路；两边由高堤包围的路径。\n</div>\n<img src=\"/images/holloway1.jpg\"\
  \ alt=\"Photo of a holloway\">\n<img src=\"/images/holloway2.jpg\" alt=\"Photo of\
  \ a holloway\" class=\"offset-image\">\n<img src=\"/images/holloway3.jpg\" alt=\"\
  Photo of a holloway\">\n```\n\nCSS:\n```css\n.offset-image {\nposition: relative;\n\
  left: 200px;\n}\n```\n\nCSS 为名为 `offset-image` 的类定义了一个规则，该规则应用相对定位并将元素从左侧偏移 `200px`。在\
  \ HTML 中，`offset-image` 类应用于中间的图像。如图 1-10\n\n图 1-10： 中间图像使用相对定位从左侧偏移，但其在页面流中的位置保持完整。\n\
  \n#### 尝试绝对定位\n\n*绝对定位*（Absolute positioning）不仅相对于其默认位置偏移元素，还将元素移出页面流。听起来很有用，但如果元素不再是页面流的一部分，它是相对于哪个元素偏移的呢？好问题，短答案是：相对于使用非静态定位的最近祖先元素。\n\
  \n\n\n\n如果这让你感到困惑，我有一个更详细的答案可以帮助。为了确定使用哪个祖先元素作为绝对定位元素的偏移依据，浏览器会执行下面的过程：\n\n1. 在页面层级中向上移动一级到达上一个祖先元素。\n\
  2. 检查该祖先元素的 `position` 属性。\n3. 如果祖先元素的 `position` 值为 `static`，则返回第 1 步，对层级结构的下一层重复此过程；否则（即如果父元素的\
  \ `position` 值是 `static` 的任何值），则相对于该祖先对原始元素进行偏移。\n4. 如果在重复执行第 1 到 3 步后，你到达了页面层级的顶端——即\
  \ `html` 元素——则使用 `html` 元素来偏移该元素，这在实践中意味着该元素是相对于浏览器视口（viewport）进行偏移的。\n\n我在上一节中提到，相对定位很奇怪，因为它保持了元素在页面流中的默认位置。然而，现在这种奇怪之处转化了优势，因为如果你想让子元素使用绝对定位，只需向父元素的样式规则中添加\
  \ `position: relative`。因为你没有为父元素提供偏移量，它会留在页面流中，但现在你为子元素拥有了 CSS 痴迷者所谓的“定位上下文”（positioning\
  \ context）。\n\n我想现在正需要一个示例（`bk05ch01/example11.html`）：\n\nHTML:\n```html\n<section>\n\
  \  <img src=\"images/new.png\" alt=\"\">\n  <h1>holloway</h1>\n  <div>\n    <i>n.</i>\
  \ 凹陷的小径或道路；一条两侧被高土堤包围的路径。\n  </div>\n  <div>\n    创建凹陷路（holloways）有两种主要方法：通过多年（几十年、世纪）持续的人流量磨损路径（这一过程通常会被水侵蚀略微加速）；或者通过在两个物业之间挖掘出一条路，并在两侧堆放土壤。\n\
  \  </div>\n</section>\n```\n\nCSS:\n```css\nsection {\n  position: relative;\n \
  \ border: 1px double black;\n}\nimg {\n  position: absolute;\n  top: 0;\n  right:\
  \ 0;\n}\n```\n\n在 CSS 中，`section` 元素使用了 `position: relative` 声明进行样式，而 `img` 元素使用了\
  \ `position: absolute`，并将 `top` 和 `right` 偏移量设置为 `0`。在 HTML 中，请注意 `<section>` 标签是\
  \ `<img>` 标签的父元素，因此后者的绝对定位将相对于前者。由于 `top` 和 `right` 偏移量设置为 `0`，图像现在将出现在 `section`\
  \ 元素的右上角，而且确实如此，如图 1-11 所示。\n\n![警告](img/warning.png) 因为绝对定位的元素现在位于普通页面流之外，该元素不再遵守“两个元素不应重叠”的默认“规则”。因此，在对元素进行绝对定位时需要小心，以确保它不会意外落在你的页面文本或其他元素之上。\n\
  \n![img 元素使用绝对定位将其发送到 section 元素的右上角的截图。](img/9781394164684-fg050111.png)\n\n图 1-11：\
  \ `img` 元素使用绝对定位将其发送到 `section` 元素的右上角。\n\n#### 尝试固定定位\n\n使用 `fixed positioning`（固定定位），元素会被从普通页面流中取出，并相对于浏览器视口进行偏移，这意味着当你滚动页面时，元素不会移动，即使是微小的移动（即元素被“固定”在了它的新位置）。\n\
  \n固定定位最常用的用途之一是将页眉放置在页面顶部，并让它在用户滚动其余内容时留在那里。这里有一个示例（`bk05ch01/exmple12.html`），向你展示了如何创建这样的页眉：\n\
  \nHTML:\n```html\n<header>\n  <img src=\"images/holloway3.jpg\" alt=\"凹陷路的照片\">\n\
  \  <h1>holloway</h1>\n</header>\n<main>\n  …\n</main>\n```\n\nCSS:\n```css\nheader\
  \ {\n  position: fixed;\n  top: 0;\n  left: 0;\n  width: 100%;\n  height: 4rem;\n\
  \  border: 1px double black;\n  background-color: hsl(101, 38%, 63%);\n}\nmain {\n\
  \  margin-top: 4rem;\n}\n```\n\nHTML 包含一个带有图像和标题的 `header` 元素，后面是一个较长的 `main` 部分（为了简单起见我在这里没有包含它）。在\
  \ CSS 代码中，`header` 元素使用了 `position: fixed` 样式，并将偏移量 `top` 和 `left` 设置为 `0`。这些偏移量将页眉固定在浏览器视口的左上角。我还添加了\
  \ `width: 100%` 以让页眉占据整个窗口宽度。我还设置了 `margin-top: 4rem`（为了给页眉留空）。为了确保页眉在顶部，我为 `main`\
  \ 元素设置了 `margin-top`。图 1-12 显示了结果。\n\n![页眉固定在屏幕顶部的截图。](img/9781394164684-fg050112.png)\n\
  \n#### 让元素粘住\n\n`Sticky positioning`（粘性定位）是相对定位和固定定位的一种结合。也就是说，元素开始是相对定位的，直到它的包含块越过了指定的阈值（通常是滚动页面时），此时它会变为固定定位。\n\
  \n假设你的页面有一个 `section` 元素，在 `section` 内部有一个 `h2` 元素，你将其设置为 `sticky`。为了简单起见，这里是简化的代码（完整版本查看\
  \ `bk05ch01/example13.html`）：\n\n```html\n<section>\n  <h2>Lorem ipsum</h2>\n  <p><a\
  \ href=\"http://www.catsum.com/\">http://www.catsum.com/</a></p>\n  <p>示例：</p>\n\
  \  <p class=\"sample-text\">\n    Lorem ipsum sit amet, prance along on top of the\
  \ garden fence, annoy the neighbor's dog and make it stuck in the dog's ear please\
  \ stop looking at your phone and pet me everywhere, but not in my bed get my belly\
  \ roll over Ooh, are those sandals?\n  </p>\n</section>\n```\n\n```css\nh2 {\n \
  \ position: sticky;\n  top: 0;\n}\n```\n\n在 CSS 中，注意对于 `h2` 元素设置了 `position: sticky`。为了指定元素粘住的阈值，设置了\
  \ `top: 0`，这意味着当 `section` 元素的顶部碰到视口顶部时，该元素将固定在。。\n\n当用户向页面底部滚动时会发生什么：\n\n1. 最初，`section`\
  \ 和 `h2` 元素一起滚动，如图 1-13 所示。注意我为 `section` 元素添加了轮廓，以便你观察它的边缘。\n2. 当 `section` 元素的顶部碰到视口顶部时（因为我设置\
  \ `top: 0` 为粘性阈值），`h2` 停止滚动并“粘”在原地，如图 1-14 所示。\n3. 当用户继续滚动时，`section` 内容继续向上滚动，如图\
  \ 1-15 所示。\n4. 当 `section` 元素的底部到达粘住的 `h2` 元素的底部时，`h2` 变得“不再粘”（即它变回相对定位）并恢复随 `section`\
  \ 一起向上滚动，如图 1-16 所示。\n\n![section 和 h2 元素一起向上滚动的截图。](img/9781394164684-fg050113.png)\n\
  \n\n\n\n\nFIGURE 1-13: 起初，`section` 和 `h2` 元素一起向上滚动。\n\n![section 元素顶部到达视口顶部时，h2\
  \ “固定”在原处的截图](img/9781394164684-fg050114.png)\n\nFIGURE 1-14: 当 `section` 元素的顶部到达视口顶部时，`h2`\
  \ “固定”在原处。\n\n![显示继续滚动，section 内容继续向上滚动截图](img/9781394164684-fg050115.png)\n\nFIGURE\
  \ 1-15: 随着你继续滚动，`section` 内容继续向上滚动。\n\n![显示当 section 底部到达固定的 h2 元素时，h2 变为“取消固定”的截图](img/9781394164684-fg050116.png)\n\
  \nFIGURE 1-16: 当 `section` 底部到达固定的 `h2` 元素时，`h2` 变为“取消固定”。\n\n### 元素的堆叠\n\n当你使用\
  \ `position: fixed` 或 `position: sticky` 定位元素时（正如我在上一节描述的那样），会发生一件奇怪的事情：当你滚动过固定或粘元素时，随后的文本和其他页面小装饰会滑到该元素的*下方*。\n\
  \n同样，如果你使用 `position: relative` 或 `position: absolute` 定位元素，可以将元素放置在页面上（通过操作 `top`、`right`、`bottom`\
  \ 和 `left` 属性），使其位于某些其他元素的*上方*。\n\n浏览器是如何知道哪些元素应该放在其他元素之上的？浏览器使用以下默认层级结构：\n\n1.\
  \ `html` 元素的背景和边框渲染在最底层。\n2. 所有非定位元素（即所有 `position` 属性为 `static` 的元素）被放置在下一层。\n\
  3. 所有定位元素（即 `position` 值为 `relative`、`absolute`、`fixed` 或 `sticky` 的元素）按照它们在 HTML\
  \ 中出现的顺序放置在后续层中。\n\n这些层代表了浏览器的默认设置，但 CSS 提供了一种按照*你*想要的方式对内容分层的方法，这是下一节的主题。\n\n####\
  \ 使用 z-index 进行元素分层\n\n如果你回想起高中几何几何（如果这让你很痛苦，请向我道歉），你会想起二维笛卡尔平面的概念，其中 x 轴代表水平值，\
  \ y 轴代表垂直值。你可能还遇到过三维版本，它增加了一个垂直于平面的 z 轴，代表相对于你（观察者）离你更近（正值）或更远（负值）的点。\n\n这种点离你更或更远的想法可以应用于浏览器的渲染层：页面背景最远，非定位元素离你近一层，而定位元素又近一层。\n\
  \nCSS 允许你通过设置一个*堆栈*（stack）来覆盖浏览器的默认层级，其中较高堆栈层级的元素将渲染在较低堆栈层元素之上。你通过在定位元素上设置 `z-index`\
  \ 属性来指定元素的堆栈层级（`z-index` 对非定位元素无效）：\n\n`z-index: value;`\n\n*   `value`: 指定堆栈层级的整数。`0`（或\
  \ `auto`）是默认级别。具有较大 `z-index` 值的定位元素渲染在具有较小 `z-index` 值的定位元素之上。允许负值。\n\n这是一个示例 (bk05ch01/example14.html)：\n\
  \nHTML:\n```html\n<body>\n  <div id=\"div1\">\n    <span>div1</span>\n  </div>\n\
  \  <div id=\"div2\">\n    <span>div2</span>\n  </div>\n</body>\n```\n\nCSS:\n```css\n\
  #div1 {\n  position: relative;\n  z-index: 2;\n}\n#div2 {\n  position: relative;\n\
  \  bottom: 100px;\n  left: 100px;\n  z-index: 1;\n}\n```\n\nHTML 创建了两个 id 为 `div1`\
  \ 和 `div2` 的 `div` 元素。在 CSS 中，`div2` 是相对定位的并向上移动了 `100px`，向左移动了 `100px`。由于 `div2`\
  \ 在 HTML 中位于 `div1` 之后，默认 `div2` 应该出现在 `div1` 之上。然而，我在 `div1` 上设置了 `z-index: 2`，它比\
  \ `div2` 上声明的 `z-index: 1` 高，因此 `div1` 现在出现在 `div2` 之上，如图 1-17 所示。\n\n![显示元素 div1\
  \ 现在出现在 div2 之上的截图，因为其 z-index 值 (2) 更高](img/9781394164684-fg050117.png)\n\nFIGURE\
  \ 1-17: 元素 `div1` 现在出现在 `div2` 之上，因为它的 `z-index` 值 (`2`) 更高。\n\n#### 理解堆叠上下文\n\n\
  具有较高 `z-index` 值的元素渲染在具有较低 `z-index` 值元素之上的通用想法似乎非常直观。啊，但这里有陷阱！为了了解 `z-index` 如何可能变得极其离谱，让我们来看这段代码\
  \ (bk05ch01/example15.html)：\n\nHTML:\n```html\n<body>\n  <div id=\"div1\">\n  \
  \  <span>div1</span>\n  </div>\n  <div id=\"div2\">\n    <span>div2</span>\n   \
  \ <aside>\n      <span>aside</span>\n    </aside>\n  </div>\n</body>\n```\n\nCSS:\n\
  ```css\n#div1 {\n  position: relative;\n  z-index: 2;\n}\n#div2 {\n  position: relative;\n\
  \  bottom: 100px;\n  left: 100px;\n  z-index: 1;\n}\naside {\n  position: relative;\n\
  \  top: 25px;\n  left: 80px;\n  z-index: 3;\n}\n```\n\n这段代码与上一节的代码相同，但有两点：\n\n*\
  \   HTML 在第二个 `div` 元素中添加了一个 `aside` 子元素。\n*   `aside` CSS 将元素相对定位，添加了垂直和水平偏移，并将\
  \ `z-index` 属性设置为 `3`。\n\n`aside` 现在拥有这三个元素中最高的 `z-index` 值，因此你可能认为 `aside` 会渲染在所有内容之上。图\
  \ 1-18 显示了实际发生的情况。\n\n![显示新的 aside 元素尽管具有更高的 z-index 值 (3)，但出现在 div1 背方的截图](img/9781394164684-fg050118.png)\n\
  \nFIGURE 1-18: 新的 `aside` 元素尽管具有更高的 `z-index` 值 (`3`)，但出现在 `div1` 后面。\n\n等等，什么？！浏览器正在将\
  \ `z-index` 值为 `3` 的 `aside` 元素渲染在 `z-index` 值为 `2` 的 `div1` *后面*！这怎么可能？\n\n要理解这里发生的情况，你需要熟悉一个被称为*堆叠上下文*（stacking\
  \ context）的概念，它是父元素的子元素相互堆叠的能力。\n\n默认的堆叠上下文由 `html` 元素创建，并在此堆叠上下文中适用以下规则：\n\n* \
  \  非定位元素渲染在堆叠顺序的底部。\n*   定位元素渲染在非定位元素之上，其堆叠层级反映了定位元素在 HTML 中出现的顺序。\n*   定位元素可以使用\
  \ `z-index` 在堆叠顺序中向上或向下。\n\n如果只有一个堆叠上下文，这一切就没大问题了。啊，如果 CSS 世界有那么简单！事实上，当满足以下任一条件时，CSS\
  \ 会创建*新的*堆叠上下文：\n\n*   元素使用 `position: relative` 或 `position: absolute` 并且将其 `z-index`\
  \ 值设置为 `auto` 以外的任何值。\n*   元素使用 `position: fixed` 或 `position: sticky`。\n\n![技术内容](img/technicalstuff.png)\
  \ 实际上还有更多创建堆叠上下文的场景。要查看完整列表，请访问 [`https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Positioning/Understanding_z_index/The_stacking_context`](https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Positioning/Understanding_z_index/The_stacking_context)。\n\
  \n\n\n\n\n在页面的整体层叠顺序中，任何创建层叠上下文的元素的定位子元素或后代，其层级永远无法高于该元素的层级。\n\n再次查看代码，但这次用全新的视角来看：\n\
  \nHTML:\n```html\n<body>\n  <div id=\"div1\">\n    <span>div1</span>\n  </div>\n\
  \  <div id=\"div2\">\n    <span>div2</span>\n    <aside>\n      <span>aside</span>\n\
  \    </aside>\n  </div>\n</body>\n```\n\nCSS:\n```css\n#div1 {\n  position: relative;\n\
  \  z-index: 2;\n}\n#div2 {\n  position: relative;\n  bottom: 100px;\n  left: 100px;\n\
  \  z-index: 1;\n}\naside {\n  position: relative;\n  top: 25px;\n  left: 80px;\n\
  \  z-index: 3;\n}\n```\n\n` `div2` 元素使用了 `position: relative` 和 `z-index: 1`，因此它创建了层叠上下文。`aside`\
  \ ` 元素是 `div2` 元素的子元素，因此它的 `z-index: 3` 仅相对于 `div2` 内部有效。由于 `div2` 声明的 `z-index`\
  \ 为 1，因此 `aside` 在整个页面的层叠顺序中永远无法高于这个值。这就是为什么 `aside` 在图 1-18 中出现在 `div1` 元素后面。\n\
  \n## 第 2 章\n\n# 玩转 Flexbox\n\n本章内容\n- **认识 Flexbox**\n- **设置你的 flex 容器**\n- **对齐\
  \ flex 项目**\n- **使用 Flexbox 居中内容**\n- **让 flex 项目听你号差遣**\n\n*Flexbox 是第一种适用于现代网页的\
  \ CSS 布局技术。*\n—PADDI MACDONNELL\n\n网页设计极客使用*脆性*（brittle）一词来描述任何过于巴洛克且过度工程化的页面布局系统，这种系统仅在非常受限的条件下运行，一旦这些条件发生即使是细微的变化就会崩溃。相反的设计哲学可以被称为*刚性*（rigid）页面布局，其中所有代码的写法使得无论你向页面引入什么设备、屏幕或其他变量，内容都不可能发生变化。\n\
  \n脆性和刚性页面布局设计共同缺乏的是简单而美丽的特性——*灵活性*。刚性布局完全没有弹性，而脆性布局在即使引入一点点弹性时也会分崩离析。网页设计极客们当然清楚这一切，并渴望一种能够让他们创建灵活布局、能够处理各种环境而不会引起任何麻烦的技术。\n\
  \n这项技术几年前以 Flexbox 的形式出现了，但最初受到了浏览器支持不佳且冲突的阻碍。然而，如今 Flexbox 已经是一项成熟的技术，享受到几乎通用的浏览器支持。这是一个极佳的消息，因为\
  \ Flexbox 是任何人页面布局工具箱的完美补充。在本章中，你将探索 Flexbox 的所有功能，并学习如何将 Flexbox 整合到你的整体页面布局中。\n\
  \n### 介绍 Flexbox\n\n多年来，大多数 CSS 专业人士的首选布局技术要么是浮动元素（floating），要么是内联块（即将块元素的 `display`\
  \ 属性设置为 `inline-block`，以便该元素在布局上表现得内联元素）。这两种技术在路径上都布下了许多“香蕉皮”，绊倒了许多开发者，包括忘记清除浮动导致容器塌陷（请查看第\
  \ 5 卷，第 1 章 了解更多这些陷阱）。\n\n然而，除了这些烦扰之外，基于浮动或内联块的布局在一些更重要的事情上存在困难，导致非常难实现：\n\n- 让元素的内容在元素容器内垂直居中\n\
  - 让元素在父容器的整个宽度内（或整个高度内）水平均匀分布\n- 让页脚元素出现在浏览器内容区域底部\n\n幸运的是，如果你使用一种名为弹性框布局模块（Flexible\
  \ Box Layout Module，简称 *Flexbox*）的 CSS 技术，这些问题就会消失。这里的关键在于名称中的“flex”（弹性）部分。与使用浮动和内联块的默认页面流和布局（它们都使用刚性区块来渲染内容）不同，Flexbox\
  \ 使用可以伸缩和收缩的容器——我指的是宽度和高度——来响应内容的变化或浏览器窗口大小的变化。但 Flexbox 还提供了强大的属性，可以轻而易举地对父容器的子元素进行布局、对齐、分布和调整大小。\n\
  \n我很快就会介绍 Flexbox 的细节，但首先我需要回答这如今最常见的页面布局问题。\n\n### 既然已经有了 CSS Grid，我还需要 Flexbox\
  \ 吗？\n\nCSS Grid 是较新的页面布局工具，你将在第 5 卷第 3 章中深入，但目前可以说，它将你的页面变为网格，让你对网格内元素的水平和垂直位置进行精细控制。CSS\
  \ Grid 比 Flexbox 新得多，但它已经拥有与 Flexbox 几乎相同的浏览器支持。所以，如果 Grid 那么好，为什么费劲学习 Flexbox 呢？\n\
  \n答案是，在某种意义上，这里的比较并不是同等对比。是的，Flexbox 和 Grid 都是页面布局工具，但它们关注页面的不同方面：\n\n- Flexbox\
  \ 擅长处理你想在*一个*方向上布局的页面元素：即**水平*或*垂直。\n- Grid 擅长处理你想在*两个*方向上布局的页面元素：即*同时*水平*和*垂直。\n\
  \n在大多数非复杂的网页中，这两个方面可以很容易地共存。例如，如果你有一个 `nav` 元素，其中包含你想要跨越网页布局的链接列表，Flexbox 是完美人选。在同一个页面上，你可能还会有复杂但规律的文本和图像交织。Grid\
  \ 可能是按你想要的方式布局这些内容的完美工具。\n\n所以，高兴的是，Flexbox 与 Grid 的选择并不是二选一的。你既可以拥有 Flex，也可以拥有\
  \ Grid。\n\n### 设置和配置 Flex 容器\n\n要开始使用 Flexbox，你从一开始就需要知道 Flexbox 将其世界分为两类：\n\n-\
  \ **Flex 容器（Flex container）：** 这是一个块级元素，作为内部弹性元素的父元素。\n- **Flex 项目（Flex items）：**\
  \ 这些是位于 flex 容器内部的子元素。\n\n我将在本章稍后部分详细地讨论 flex 项目（请查看“控制 Flex 项目”）。但现在，接下来的几节将向你展示什么是\
  \ flex 容器。\n\n#### 设置 flex 容器\n\n要指定一个 flex 容器，将其 `display` 属性设置为 `flex`：\n\n```css\n\
  element {\n  display: flex;\n}\n```\n\n通过这一个声明，该元素的子元素自动变成了 flex 项目，就这么。太棒了！\n\n\
  #### 预览 flex 容器布局\n\nFlexbox 令人困惑的问题之一是它在容器的方向性和维度之间所区分。我的意思是：\n\n- **方向性（Directionality）：**\
  \ Flex 容器是单向的，这意味着 flex 项目在它们的 flex 容器内要么水平流动（即行），要么垂直流动（即列）。\n- **维度（Dimensionality）：**\
  \ Flex 容器是二维的，这意味着作为一个块级元素，它定义了两个垂直的轴。首先，flex 容器的流向沿着*主轴*（primary axis，也称为主轴）运行。因此，如果流向是水平的，主轴也是水平的。其次，与主轴垂直的轴被称为*次轴*（secondary\
  \ axis，也称为交叉轴）。因此，如果流向是水平的，次轴将是垂直的。\n\n\n\n\n\n同时拥有主轴和次轴可以操作，意味着你可以对 flex 容器中项目的排列方式进行细粒度的控制。我稍后会介绍这一点，但首先你需要选择一个\
  \ flex 方向。\n\n#### 设置 flex 方向\n\n在你设置好 flex 容器之后，Flexbox 任务列表的下一项是决定你想让 flex 项目在容器内沿什么方向流动。你使用\
  \ `flex-direction` 属性指定该方向：\n\n```css\nelement {\n  display: flex;\n  flex-direction:\
  \ row|row-reverse|column|column-reverse;\n}\n```\n\n* `row`: 主轴是水平方向的，flex 项目从左到右排列。这是默认值。\n\
  * `row-reverse`: 主轴是水平方向的，flex 项目从右到左排列。\n* `column`: 主轴是垂直方向的，flex 项目从上到排列。\n*\
  \ `column-reverse`: 主轴是垂直方向的，flex 项目从下上排列。\n\n下面是一个示例。首先，是一些 HTML 和 CSS 代码（查看 `bk05ch02/example01.html`），图\
  \ 2-1 显示了如果你让浏览器进行布局，它看起来如下：\n\nHTML:\n```html\n<div class=\"container\">\n  <div\
  \ class=\"item item1\">1</div>\n  <div class=\"item item2\">2</div>\n  <div class=\"\
  item item3\">3</div>\n  <div class=\"item item4\">4</div>\n  <div class=\"item item5\"\
  >5</div>\n</div>\n```\n\nCSS:\n```css\n.container {\n  border: 5px double black;\n\
  }\n.item {\n  font-family: Verdana, sans-serif;\n  font-size: 5rem;\n  padding:\
  \ .1rem;\n  text-align: center;\n}\n.item1 {\n  background-color: hsl(0, 0%, 94%);\n\
  }\n.item2 {\n  background-color: hsl(0, 0%, 88%);\n}\n.item3 {\n  background-color:\
  \ hsl(0, 0%, 82%);\n}\n.item4 {\n  background-color: hsl(0, 0%, 76%);\n}\n.item5\
  \ {\n  background-color: hsl(0, 0%, 70%);\n}\n```\n\n![让浏览器布局元素，你会得到默认的块堆叠。](img/9781394164684-fg050201.png)\n\
  \n图 2-1： 让浏览器布局元素，你会得到默认的块堆叠。\n\n浏览器会执行默认操作，将 `div` 块堆叠在一起，并让每个块占据父 `div`（带有 `container`\
  \ 类的那个）的完整宽度，在图 2-1 中，它的边界由双线边框标记。\n\n现在将父 `div` —— 再次是带有 `container` 类的那个 —— 配置为具有水平主轴的\
  \ flex 容器（查看 `bk05ch02/example02.html`）：\n\n```css\n.container {\n  display: flex;\n\
  \  flex-direction: row;\n  border: 5px double black;\n}\n```\n\n这会自动将子 `div` 元素\
  \ —— 带有 `item` 类的那些 —— 配置为 flex 项目。如图 2-2 所示，flex 项目现在水平对齐，并且仅占据内容所需的水平空间。\n\n![显示父容器作为\
  \ flex 容器，子元素成为 flex 项目。](img/9781394164684-fg050202.png)\n\n图 2-2： 父容器作为 flex 容器，子元素成为\
  \ flex 项目。\n\n#### 沿主轴对齐 flex 项目\n\n注意图 2-2，flex 项目聚集在 flex 容器的左侧（其边界由双边框显示）。这是沿主轴的默认对齐方式，但你可以通过修改\
  \ `justify-content` 属性的值来更改这种对齐方式：\n\n```css\ncontainer {\n  display: flex;\n  justify-content:\
  \ flex-start|flex-end|center|space-around|space-evenly;\n}\n```\n\n* `flex-start`:\
  \ 将所有 flex 项目与 flex 容器的起点对齐（“start”意味着 `flex-direction` 为 `row` 时向左，当 `flex-direction`\
  \ 为 `row-reverse` 时向右，当 `flex-direction` 为 `column` 时向上，当 `flex-direction` 为 `column-reverse`\
  \ 时向下）。这是默认值，所以如果你需要的对齐方式是 `flex-start`，可以省略 `justify-content` 属性。\n* `flex-end`:\
  \ 将所有 flex 项目与 flex 容器的终点对齐（“end”意味着 `flex-direction` 为 `row` 时向右，当 `flex-direction`\
  \ 为 `row-reverse` 时向左，当 `flex-direction` 为 `column` 时向下，当 `flex-direction` 为 `column-reverse`\
  \ 时向上）。\n* `center`: 将所有 flex 项目与 flex 容器的中间对齐。\n* `space-around`: 在每个 flex 项目的前后分配等量的空间，空间量的计算是为了使\
  \ flex 项目沿主轴均匀分布。实际上，分布并不完全均匀，因为内部 flex 项目（图 2-3 中的 2、3 和 4）之间有两个单位的空间，而起始和结束的 flex\
  \ 项目（图 2-3 中的 1 和 5）外部只有一个单位的空间（即 item 1 的左侧和 item 5 的右侧）。\n* `space-between`: 将第一个\
  \ flex 项目放在 flex 容器的起点，最后一个 flex 项目放在终点，然后在之间均匀分配剩余 flex 项目。\n* `space-evenly`:\
  \ 在每个 flex 项目的前后分配等量的空间，空间量的计算是为了使 flex 项目沿主轴均匀分布。与 `space-around` 不同，这次间距真的是均匀的！\n\
  \n图 2-3（查看 `bk05ch02/example03.html`）展示了当 `flex-direction` 属性设置为 `row` 时，`justify-content`\
  \ 属性的所有可能值。\n\n![当主轴为水平时（flex-direction: row），justify-content 值如何对齐 flex 项目。](img/9781394164684-fg050203.png)\n\
  \n图 2-3： 当主轴为水平时（flex-direction: row`），`justify-content` 值如何对齐 flex 项目。\n\n####\
  \ 沿次轴对齐 flex 项目\n\n除了沿主轴对齐 flex 项目外，你还可以沿次轴对齐它们。例如，如果你将 `flex-direction` 设置为 `row`，得到水平主轴，那么次轴就是垂直的，这意味着你也可以垂直对齐\
  \ flex 项目。\n\n这看起来很奇怪（我听到你在想），当我检查图 2-3 中的示例时，似乎没有任何垂直空间可以进行操作，更不用说对齐 flex 项目了。\n\
  \n没错！默认情况下，flex 项目始终占据 flex 容器的整个高度，如果你没有指定高度（如我在图 2-3 所示示例中那样），Flexbox 只会让容器足够高以容纳最高的内容。\n\
  \n当你为具有垂直次轴的 flex 容器设置高度（或为具有水平次轴的 flex 容器设置宽度）时，可以通过更改 `align-items` 属性的值来获得不同的次轴对齐：\n\
  \n```css\ncontainer {\n  display: flex;\n  align-items: stretch|flex-start|flex-end|center|baseline;\n\
  }\n```\n\n* `stretch`: 在次轴方向扩展每个 flex 项目，直到填充 flex 容器的整个（如果次轴是垂直的）或宽度（如果次轴是水平的）。这种对齐是默认值，所以如果你需要的对齐方式是\
  \ `stretch`，可以省略 `align-items` 属性。\n* `flex-start`: 将所有 flex 项目与 flex 容器次轴的起点对齐（“start”意味着\
  \ `flex-direction` 为 `row` 或 `row-reverse` 时向顶部，当 `flex-direction` 为 `column` 或\
  \ `column-reverse` 时向左）。\n* `flex-end`: 将所有 flex 项目与 flex 容器次轴的终点对齐（“end”意味着 `flex-direction`\
  \ 为 `row` 或 `row-reverse` 时向底部，当 `flex-direction` 为 `column` 或 `column-reverse`\
  \ 时向右）。\n\n\n\n\n\n* `center`: 将所有 flex 项目在 flex 容器次轴的中间对齐。\n* `baseline`: 沿项目文本的底部边缘对齐\
  \ flex 项目。（从技术上讲，对于一行文本，`baseline` 是让小小写字母（如 `o` 和 `x`）看起来落在其上的那条隐线。）如果 flex 项目包含多行文本，则\
  \ flex 项目将沿每个项目第一行的 `baseline` 对齐。\n\n图 2-4（请查看 `bk05ch02/example04.html`）展示了 `align-items`\
  \ 属性在次轴为垂直方向（即在这种情况下，`flex-direction` 属性设置为 `row`）且每个 flex 容器的高度被设为 `30vh` 时（每个容器的边缘都设置了双线边框）的所有可能值。为了让\
  \ `baseline` 示例更有用，我为每个 flex 项目添加了随机数量的顶部和底部内边距。\n\n![次轴为垂直方向时 align-items 值如何对齐\
  \ flex 项目的截图。](img/9781394164684-fg050204.png)\n\nFIGURE 2-4: 当次轴为垂直方向时，align-items\
  \ 值如何对齐 flex 项目。\n\n![提示](img/tip.png) 如果你想为单个 flex 项目设置次轴对齐，可以使用 `align-self` 属性，它接受与\
  \ `align-items` 相同的值，但仅应用于指定的 flex 项目：\n\n```css\nitem {\n  align-self: stretch|flex-start|flex-end|center|baseline;\n\
  }\n```\n\n#### 水平和垂直居中一个元素\n\n在 CSS 的早期时代，在父元素内水平和垂直居中一个元素是众所周知的难题。样式大师们熬到深夜寻找实现这一成就的方法。他们成功了，但这些技术晦涩又复杂。随后，Flexbox\
  \ 的出现改变了一切，让将东西直接放在页面正中间变得几乎简单得荒谱：\n\n```css\ncontainer {\n  display: flex;\n  justify-content:\
  \ center;\n  align-items: center;\n}\n```\n\n是的，全部就是这些。这里有一个示例（请查看 `bk05ch02/example05.html`）：\n\
  \nHTML:\n```html\n<div class=\"container\">\n  <div class=\"item\">看，妈妈，我居中了！</div>\n\
  </div>\n```\n\nCSS:\n```css\n.container {\n  border: 5px double black;\n  display:\
  \ flex;\n  justify-content: center;\n  align-items: center;\n  height: 50vh;\n}\n\
  .item {\n  font-family: Georgia, serif;\n  font-size: 2rem;\n}\n```\n\n如图 2-5 所示，flex\
  \ 项目正位于其 flex 容器的正中央。\n\n![居中一个项目，将容器的 justify-content 和 align-items 属性设置为 center\
  \ 的截图。](img/9781394164684-fg050205.png)\n\nFIGURE 2-5: 要居中一个项目，将容器的 `justify-content`\
  \ 和 `align-items` 属性设置为 `center`。\n\n#### 允许 flex 项目换行\n\n默认情况下，flex 容器要么单行（如果你将\
  \ `flex-direction` 设置为 `row` 或 `row-reverse`），要么单列（如果你将 `flex-direction` 设置为 `column`\
  \ 或 `column-reverse`）。如果 flex 项目太大而无法放入容器的行或列中，Flexbox 会沿主轴缩小 flex 项目直到恰好适应。如果由于某种原因，Flexbox\
  \ 无法足够缩小一个或多个项目以适应容器（例如，项目可能有一个 `min-width` 值，或其内容可能强制了最小宽度），项目将沿主轴溢出。\n\n让 Flexbox\
  \ 缩小 flex 项目可能会导致问题，如宽度过窄或我刚才提到的溢出场景。与其让 Flexbox 缩小项目以适应，不如请求浏览器将容器的项目换行到多行（如果主轴是水平方向）或多列（如果主轴是垂直方向）。通过使用容器的\
  \ `flex-wrap` 属性来启用换行：\n\n```css\nelement {\n  display: flex;\n  flex-wrap: nowrap|wrap|wrap-reverse;\n\
  }\n```\n\n* `nowrap`: 不对容器的项目换行。这是默认行为。\n* `wrap`: 根据需要将项目换到多行（如果主轴是水平方向）或多列（如果主轴是垂直方向）。\n\
  * `wrap-reverse`: 从次轴的末尾开始换行项目。\n\n这里有一个示例（请查看 `bk05ch02/example06.html`）：\n\nHTML:\n\
  ```html\n<div class=\"container\">\n  <div class=\"item item1\">1</div>\n  <div\
  \ class=\"item item2\">2</div>\n  <div class=\"item item3\">3</div>\n  <div class=\"\
  item item4\">4</div>\n  <div class=\"item item5\">5</div>\n</div>\n<div><code>wrap</code></div>\n\
  <div class=\"container wrap\">\n  <div class=\"item item1\">1</div>\n  <div class=\"\
  item item2\">2</div>\n  <div class=\"item item3\">3</div>\n  <div class=\"item item4\"\
  >4</div>\n  <div class=\"item item5\">5</div>\n</div>\n<div><code>wrap-reverse</code></div>\n\
  <div class=\"container wrap-reverse\">\n  <div class=\"item item1\">1</div>\n  <div\
  \ class=\"item item2\">2</div>\n  <div class=\"item item3\">3</div>\n  <div class=\"\
  item item4\">4</div>\n  <div class=\"item item5\">5</div>\n</div>\n```\n\nCSS:\n\
  ```css\n.container {\n  border: 5px double black;\n  display: flex;\n  flex-direction:\
  \ row;\n  align-items: flex-start;\n  height: 40vh;\n  width: 85vw;\n}\n.wrap {\n\
  \  flex-wrap: wrap;\n}\n.wrap-reverse {\n  flex-wrap: wrap-reverse;\n}\n.item {\n\
  \  height: 50%;\n  width: 25%;\n}\n```\n\n`container` 类设置了 `height` 和 `width`。我还使用\
  \ `wrap` 和 `wrap-reverse` 类来应用 `flex-wrap` 值。图 2-6 展示了结果。\n\n![三种 flex-wrap 值的截图。](img/4684-fg5026.png)\n\
  \n#### 沿次轴对齐行或列\n\n当 flex 容器内有多行列后，你需要决定如何沿次轴对齐这些行或列。这类似于使用 `justify-content` 属性沿主轴对齐\
  \ flex 项目，只是现在你处理的是整行或列。\n\n要在次轴上对齐整行或列，请使用容器的 `align-content` 属性：\n\n```css\nelement\
  \ {\n  display: flex;\n  align-content: stretch|center|flex-start|flex-end|space-around|space-between|space-evenly;\n\
  }\n```\n\n* `stretch`: 沿次轴拉伸行或列以填充容器的高度或宽度。这是默认值。\n* `center`: 将行或列在次轴的中间对齐。\n*\
  \ `flex-start`: 将行或列在次轴的起点对齐。\n* `flex-end`: 将行或列在次轴的终点对齐。\n* `space-around`: 通过在每个行或列两侧提供固定空间，在容器内均匀分布大部分行或列，但第一个项目在前面留一半空间，最后一个项目在后面留一半。\n\
  * `space-between`: 将第一行或列放在次轴起点，最后最后行或列放在终点，并在其余行或列之间均匀分布。\n* `space-evenly`: 通过在每个行或列的前后提供相同数量的空间，在容器内均匀分布行或列。\n\
  \n图 2-7（请查看 `bk05ch02/example07.html`）展示了当次轴为垂直方向时 `align-content` 属性的所有可能值。\n\n\
  你可以通过使用 `place-content` 属性将 `align-content` 和 `justify-content` 属性合并到一个声明中：\n\n\
  `place-content:` `align-value` [`justify-value``\n\n\n\n\n将 `align-value` 替换为你想要使用的\
  \ `align-content` 值；将 `justify-value` 替换为你想要使用的 `justify-content` 值。如果你只指定一个值，浏览器会将该值同时用于\
  \ `align-content` 和 `justify-content`。\n\n![当次要轴为垂直时，align-content 值如何对齐多行的截图。](img/9781394164684-fg050207.png)\n\
  \nFIGURE 2-7: 当次要轴为垂直时，`align-content` 值如何对齐多行。\n\n#### 在项目之间添加间隙\n\n默认情况下，当你使用\
  \ `stretch`、`flex-start`、`flex-end` 和 `center` 等对齐值时，Flexbox 会将所有 flex 项目挤在一起。这可能正是你想要的效果，但有时你可能希望在\
  \ flex 项目之间留出空间。添加外边距（margins）是让项目之间留出呼吸空间的方法之一，但如果你不想担心处理外边距，可以让 Flexbox 为你完成工作，自动在行、列或两者之间创建间隙——通常称为*槽*（gutters）。以下是你可以使用的属性：\n\
  \n`row-gap:` `row-gap-value`;`\n\n`column-gap:` `column-gap-value`;`\n\n`gap:` `row-gap-value`\
  \ [`column-gap-value`];`\n\n*   `row-gap-value`: 一个长度值，指定 flex 容器中每行项目之间的空间。\n*\
  \   `column-gap-value`: 一个长度值，指定 flex 容器中每列项目之间的空间。\n\n![记住](img/remember.png) 当你使用使用\
  \ `gap` 简写属性时，如果你只指定了 `row-gap-value`，Flexbox 会将该值同时应用于行和列。\n\n这是一个示例（查看 bk05ch02/example08.html）：\n\
  \n```css\n.container {\n  border: 5px double black;\n  display: flex;\n  flex-direction:\
  \ row;\n  flex-wrap: wrap;\n  gap: 1rem;\n  height: 50vh;\n  width: 50vw;\n}\n```\n\
  \n这段代码使用 `gap` 属性在 flex 容器的行和列之间应用了 `1rem` 的空间，如图图 2-8\n\nFIGURE 2-8: 使用 `gap` 属性为\
  \ flex 容器的行和列留出个人空间。\n\n### 控制 flex 项目\n\n到目前为止，这段 Flexbox 之之旅主要是关于控制 flex 容器各个方面（如方向、对齐和换行）的宏观层面。但如果没有\
  \ flex 项目，容器就毫无意义，因此有一个整个“微观”Flexbox 世界，你在其中处理单个 flex 项目。本章的其余部分将带你了解 Flexbox 提供的用于控制\
  \ flex 项目的各种属性。\n\n#### 允许 flex 项目增长\n\n默认情况下，当你将 `justify-content` 属性设置为 `flex-start`、`flex-end`\
  \ 或 `center` 时，flex 项目在主轴上占据的空间仅为其内容所需的空间，如之前的图 2-3\n\nFIGURE 2-9: 默认情况下，所有 flex\
  \ 项目的 `flex-grow` 值为 `0`，导致产生空间。\n\n对于 `flex-grow` 的正值，你有三种情况需要考虑：\n\n*   **你只为一个\
  \ flex 项目分配了正的 `flex-grow` 值。** 该 flex 项目会增长，直到 flex 容器没有空空间。例如，这里有一个规则为类名为 `item1`\
  \ 的元素设置 `flex-grow` 为 `1`，图 2-10\n\nFIGURE 2-10: 使用 `flex-grow: 1` 时，项目增长直到容器不再有空空间。\n\
  \n*   **你为两个或多个 flex 项目分配了相同的正 `flex-grow` 值。** flex 项目等等增长，直到 flex 容器中不再有空空间。例如，这里有一个规则为项目\
  \ 1 的元素设置 `flex-grow` 为 `1`，图 2-11 显示项目 1、2 和 3 已经增长，直到 flex 容器中不再有空空间（查看 bk05ch02/example11.html）：\n\
  \n```css\n.item1 {\n  flex-grow: 1;\n}\n```\n\n![显示设置 flex-grow: 1 后，项目增长直到容器内不再有空空间的截图。](img/9781394164684-fg050211.png)\n\
  \nFIGURE 2-11: 设置 `flex-grow: 1` 后，项目增长直到容器内不再有空空间。\n\n*   **你为多个 flex 项目分配了不同的正\
  \ `flex-grow` 值。** flex 项目根据 `flex-grow` 值按比例增长，直到 flex 容器不再有空空间。例如，如果你给一个项目设置 `flex-grow`\
  \ 值为 `1`，第二个项目设置 `flex-grow` 值为 `2`，第三个项目设置 `flex-grow` 值为 `1`，那么分配给它们的比例分别为 25%、50%\
  \ 和 25%。图 2-12 显示了类 `item1`、`item2` 和 `item3` 的结果：\n\n```css\n.item1 {\n  flex-grow:\
  \ 1;\n}\n.item2 {\n  flex-grow: 2;\n}\n.item3 {\n  flex-grow: 1;\n}\n```\n\n![显示项目\
  \ 1 和 3 占据容器 25% 的空间，项目 2 占据 50% 的截图。](img/9781394164684-fg050212.png)\n\nFIGURE\
  \ 2-12: 项目 1 和 3 占据容器 25% 的空间，项目 2 占据 50%。\n\n#### 允许 flex 项目缩小\n\nFlexbox 的灵活性不仅意味着\
  \ flex 项目可以增长填充容器的空空间，还意味着当空间不足以容纳项目时，它们还可以缩小。flex 项目缩小以适应容器是 Flexbox 的默认行为，但你可以通过在项目上使用\
  \ `flex-shrink` 属性来对哪些项目缩小以及缩小的程度进行控制：\n\n```css\nitem {\n  flex-shrink: value;\n\
  }\n```\n\n*   `value`: 一个大于或等于 `0` 的数字。默认值为 `1`，告诉浏览器等比例缩小所有 flex 项目以适应 flex 容器。\n\
  \n例如，考虑以下代码：\n\n```html\n<div class=\"container\">\n  <div class=\"item item1\"\
  >1</div>\n  <div class=\"item item2\">2</div>\n  <div class=\"item item3\">3</div>\n\
  \  <div class=\"item item4\">4</div>\n  <div class=\"item item5\">5</div>\n</div>\n\
  ```\n\n```css\n.container {\n  display: flex;\n  width: 600px;\n}\n```\n\n\n\n\n\
  \n```css\nborder: 5px double black;\n}\n\n.item {\n  width: 200px;\n}\n```\n\nflex\
  \ 容器（`container` 类）宽度为 `600px`，但每个 flex 项目（`item` 类）的宽度为 `200px`。为了让所有内容都能适应，浏览器会等比例缩小每个项目，结果如图\
  \ 2-13 所示（查看 `bk05ch02/example13.html`）。\n\n![默认情况下，浏览器沿主轴等比例缩小项目，直到它们适应容器。](img/9781394164684-fg050213.png)\n\
  \n图 2-13： 默认情况下，浏览器沿主轴等比例缩小项目，直到它们适应容器。\n\n![技术细节](img/technicalstuff.png) 只有当每个项目在主轴上的尺寸相同时（例如，当主轴为水平方向时宽度相同），浏览器才会真正等比例缩小每个\
  \ flex 项目（即缩小的量相同）。如果 flex 项目的尺寸不同，浏览器将根据其尺寸大致比例缩小每个项目：较大的项目缩小得更多，而较小的项目缩小得较少。我在这里使用“大致”一词，是因为实际上，浏览器用于确定收缩系数的计算过程复杂得令人头疼。如果你想了解更多（别说我没警告过你！），请查看[`https://madebymike.com.au/writing/understanding-Flexbox`](https://madebymike.com.au/writing/understanding-Flexbox)。\n\
  \n你有三种方法来控制 flex 项目的收缩：\n\n*   **为项目分配一个 0 到 1 之间的 `flex-shrink` 值。** 浏览器缩小该项目的程度比其他\
  \ flex 项目少。例如，这里的规则为类名为 `item1` 的元素设置 `flex-shrink` 为 `0.5`，图 2-14 显示项目 1 的缩小程度比容器中的其他项目少（查看\
  \ `bk05ch02/example14.html`）：\n\n```css\n.item1 {\n  flex-shrink: 0.5;\n}\n```\n\
  \n![为项目 1 设置 flex-shrink: 0.5 使其缩小程度比其他项目少](img/9781394164684-fg050214.png)\n\n\
  图 2-14： 为项目 1 设置 `flex-shrink: 0.5` 使其缩小程度比其他项目少。\n\n*   **为项目分配一个大于 1 的 `flex-shrink`\
  \ 值。** 浏览器缩小该项目的程度比其他 flex 项目多。例如，以下规则为类名为 `item1` 的元素设置 `flex-shrink` 为 `2`，图 2-15\
  \ 显示项目 1 的缩小程度比容器中的其他项目多（查看 `bk05ch02/example15.html`）：\n\n```css\n.item1 {\n  flex-shrink:\
  \ 2;\n}\n```\n\n![为项目 1 设置 flex-shrink: 2 使其缩小程度比其他项目多](img/9781394164684-fg050215.png)\n\
  \n图 2-15： 为项目 1 设置 `flex-shrink: 2` 使其缩小程度比其他项目多。\n\n*   **为项目分配 `flex-shrink` 值为\
  \ `0`。** 浏览器不缩小该项目。以下规则为类名为 `item1` 的元素设置 `flex-shrink` 为 `0`，图 2-16 显示浏览器不缩小项目\
  \ 1（查看 `bk05ch02/example16.html`）：\n\n```css\n.item1 {\n  flex-shrink: 0;\n}\n```\n\
  \n![警告](img/warning.png) 如果 flex 项目在主轴上的尺寸大于 flex 容器，且你对其设置了 `flex-shrink: 0`，就会出现糟糕的情况。也就是说，flex\
  \ 项目会溢出容器，取决于它在容器中的位置，可能会占据一个或多个项目。如果你不希望 flex 项目缩小，请确保 flex 容器足够容纳它。\n\n![设置 flex-shrink:\
  \ 0 不缩小项目 1](img/9781394164684-fg050216.png)\n\n图 2-16： 为项目 1 设置 `flex-shrink: 0`\
  \ 不缩小。\n\n#### 指定 flex 项目尺寸\n\nflex 项目有一个*初始尺寸*（Flexbox 标准称之为*假设尺寸*），即项目根据其内容自然地在主（主）轴上占据的空间量。当你对一个项目声明\
  \ `flex-grow: 1` 和 `flex-shrink: 1` 时，该项目会从这个初始尺寸增长或缩小。\n\n![记住](img/remember.png)\
  \ 为了减少本部分的文字，我假设 `flex-direction: row`，因此主轴是水平的，初始尺寸是项目的宽度。然而，如果在大容器上声明了 `flex-direction:\
  \ column`，则主轴是垂直的，初始尺寸是项目的高度。因此，如果容器的主轴是垂直的，请将本部分所有的“width”改为“height”。\n\n你可以通过设置\
  \ `flex-basis` 属性为项目建议不同的初始尺寸：\n\n```css\nitem {\n  flex-basis: value;\n}\n```\n\
  \n*   `value`：初始尺寸的长度或百分比值。你也可以使用以下关键词：\n    *   `auto`：将初始尺寸设置为项目的 `width` 值。如果项目没有声明宽度，`auto`\
  \ 将初始尺寸设置为内容的大小（`auto` 是 `flex-basis` 的默认值）。\n    *   `content`：根据项目内容设置初始尺寸。此关键词会覆盖项目声明\
  \ `width` 值（如果有）。\n    *   `max-content`：将初始尺寸设置为不换行所需的最大宽度（或 flex 容器中允许的最大宽度，取较小者）。\n\
  \    *   `min-content`：根据项目可能的宽度设置初始尺寸。\n    *   `fit-content`：根据项目内容在 `max-content`\
  \ 和 `min-content` 之间设置初始尺寸。\n\n![记住](img/remember.png) 除了 `auto` 关键词外，在 `flex-basis`\
  \ 属性上设置任何值都会覆盖你应用于同一项目的 `width` 值。\n\nCSS 弹性布局标准（查看[`https://www.w3.org/TR/css-flexbox-1/`](https://www.w3.org/TR/css-flexbox-1/)`）将\
  \ `flex-basis`、`flex-grow` 和 `flex-shrink` 称为“弹性组件”。这并不意外，因为这三个属性密切相关：\n\n*   `flex-basis`\
  \ 为项目创建一个新的初始主尺寸。但注意，`flex-basis` 值（或 `width` 值）只是一个建议的宽度。\n*   `flex-grow` 允许项目从初始尺寸的最小值扩展到初始尺寸加上主轴上的可用空间。\n\
  *   `flex-shrink` 允许项目从初始尺寸的最大值缩小到基于内容的最小尺寸。\n\n为了帮助你理解 `flex-basis` 属性，这里有四个常见场景：\n\
  \n*   **你希望 flex 项目有一个最小宽度。** 将 `flex-basis` 设置为你想要的最小宽度；将 `flex-grow` 设置为正值，以便在有可用空间时项目超过\
  \ `flex-basis` 值；并声明 `flex-shrink: 0` 以防项目缩小到 `flex-basis` 值以下。示例所示（查看图 2-17\n\n\
  图 2-17： 为项目 1 设置最小宽度。\n\n*   **你希望 flex 项目有一个最大宽度。** 将 `flex-basis` 设置为你想要的最大宽度；将\
  \ `flex-grow` 设置为 `0` 以防止项目超过 `flex-basis` 值；并声明 `flex-shrink:` 为非零值，允许项目缩小到 `flex-basis`\
  \ 值以下。示例所示（查看图 2-18 和 `bk05ch02/example18.html`）：\n\n```css\n.item1 {\n  flex-grow:\
  \ 0;\n  flex-shrink: 1;\n  flex-basis: 200px;\n}\n```\n\n\n\n\n\n![设置项目 1 具有最大宽度的截图](img/9781394164684-fg050218.png)\n\
  \n图 2-18: 设置项目 1 具有最大宽度。\n\n*   **你希望一个 flex 项目具有固定不变的宽度。** 将 `flex-basis` 设置为任何你想要作为固定宽度的值；设置\
  \ `flex-grow: 0` 以防止项目增长到超过 `flex-basis` 的值；并声明 `flex-shrink: 0` 以防止项目收缩到 `flex-basis`\
  \ 值以下。这里有一个示例（请查看图 2-19 和 `bk05ch02/example19.html`）：\n\n```css\n.item1 {\n  flex-grow:\
  \ 0;\n  flex-shrink: 0;\n  flex-basis: 200px;\n}\n```\n\n![设置项目 1 具有固定不变宽度的截图](img/9781394164684-fg050219.png)\n\
  \n图 2-19: 设置项目 1 具有最大宽度。\n\n*   **你希望一个 flex 项目具有最小和最大宽度。** 将 `flex-basis` 设置为任何你想要作为初始主宽的值；将\
  \ `flex-grow` 设置为正值以允许项目增长超过 `flex-basis` 的值；将 `flex-shrink` 设置为非零值以允许项目收缩到 `flex-basis`\
  \ 值以下；将 `min-width` 设置为任何你想要作为最小宽的值；并将 `max-width` 设置为任何你想要作为最大宽的值。这里有一个示例（请查看图\
  \ 2-20 和 `bk05ch02/example19a.html`）：\n\n```css\n.item1 {\n  flex-grow: 1;\n  flex-shrink:\
  \ 1;\n  flex-basis: 300px;\n  min-width: 200px;\n  max-width: 400px;\n}\n```\n\n\
  ![设置项目 1 具有固定不变宽度的截图](img/9781394164684-fg050220.png)\n\n图 2-20: 设置项目 1 具有固定不变宽度。\n\
  \n#### 使用 flex 简写属性\n\n`flex-grow`、`flex-shrink` 和 `flex-basis` 属性对于 Flexbox 工作是如此基础，以标准定义了一个\
  \ `flex` 简写属性，你可以一次性设置这三个属性。`flex` 简写可以接受一个、两个或三个值，我在表 2-1 中详细列出了这些每种语法。\n\n![记住](img/remember.png)\
  \ 当你使用 `flex` 简写时，至关重要的是记住，如果你只指定了一个或两个值，Flexbox 会为缺失的属性或属性应用默认值。例如，考虑以下代码：\n\n\
  ```css\n.item1 {\n  flex-shrink: 0;\n  flex-basis: 10rem;\n  flex: 1;\n}\n```\n\n\
  | **语法** | **描述** | **示例** | **等于** |\n| --- | --- | --- | --- |\n| `flex: grow;`\
  \ | 将 `flex-grow` 设置为 `grow`；将 `flex-shrink` 设置为 `1` 并将 `flex-basis` 设置为 `0` | `flex:\
  \ 2;` | `flex-grow: 2; flex-shrink: 1; flex-basis: 0;` |\n| `flex: basis;` | 将 `flex-basis`\
  \ 设置为 `basis`；将 `flex-grow` 设置为 `1` 并将 `flex-shrink` 设置为 `1` | `flex: 10rem;` |\
  \ `flex-grow: 1; flex-shrink: 1; flex-basis: 10rem;` |\n| `flex: grow basis;` |\
  \ 将 `flex-grow` 设置为 `grow`；将 `flex-basis` 设置为 `basis`；将 `flex-shrink` 设置为 `1` |\
  \ `flex: 2 12vw;` | `flex-grow: 2; flex-shrink: 1; flex-basis: 12vw;` |\n| `flex:\
  \ grow shrink basis;` | 将 `flex-grow` 设置为 `grow`；将 `flex-shrink` 设置为 `shrink`；将\
  \ `flex-basis` 设置为 `basis` | `flex 0 0 200px;` | `flex-grow: 0; flex-shrink: 0;\
  \ flex-basis: 200px;` |\n\n表 2-1 `flex` 简写属性\n\n从表面上看，这段代码似乎是在为 `item` 设置一个 `10rem`\
  \ 的最小尺寸。然而，通过使用 `flex: 1` 简写，Flexbox 为 `flex-shrink` 和 `flex-basis` 应用了默认值：\n\n\
  ```css\n.item1 {\n  flex-shrink: 0;\n  flex-basis: 10rem;\n  flex: 1;\n}\n```\n\n\
  \n\n\n\n## Flexbox Order 属性\n\n- `value`: 默认情况下，flex 容器的项目被分配的 `order` 值为 `0`。你可以这样更改项目的顺序：\n\
  \n- flex 项目的 `order` 值越高，该项目在 flex 容器中出现的时间就越晚。\n- `order` 值最大的 flex 项目出现在 flex\
  \ 容器的最后面。\n- `order` 值最小的 flex 项目出现在 flex 容器的最前面。\n- 负数 `order` 值也是很有用的，你可以通过将 `order`\
  \ 值设置为 `-1` 将一个 flex 项目移动到其 flex 容器的前。\n\n这是一个示例（查看 `bk05ch02/example21.html`）：\n\
  \n```css\n.item1 {\n  order: 1;\n}\n```\n\n在这个示例中，通过对类名为 `item1` 的项目声明 `order: 1`，浏览器会将该项目移动到容器的末尾，如图图\
  \ 2-22\n\n图 2-22： 通过在项目 1 上设置 `order: 1`，该项目移动到了其 flex 容器的末尾。\n\n---\n\n## 第 3 章：使用\
  \ CSS Grid 布局\n\n### 本节内容\n- 熟悉 CSS Grid\n- 设置网格容器\n- 将网格划分为行和列\n- 创建网格间隙\n- 对齐网格项目\n\
  \n*如果你还没有学习 CSS Grid（而且是一个写 CSS 的人），那你真的大失所。* — JEN SIMMONS\n\n也许我有些老了，但当我开始制作网页时，布局页面的兴奋新技术是创建一个巨大的\
  \ `table` 元素，并将页面的各个部分插入一个或多个表格单元格中。这使我们能够像训练营的新兵一样对齐内容，这很棒，但我们的页面看起来像训练营教官一样僵硬且毫无吸引力，这并不好。\n\
  \n从那时起，Web 开发者一直梦想着一种 CSS 解决方案，既能让我们控制布局，又能保留某些灵活性和创造力。这个目标在以前通过 Flexbox 部分实现（查看第\
  \ 5 本的第 2 章），它让在一个维度上布局网页元素变得轻而易举。但网页本质是坚决的二维生物，所以尽管我们热爱 Flexbox，但也知道我们还没有完全到位。\n\
  \n最终，既精确又灵活的现代全页面布局方法的梦想在几年前以 CSS Grid 的形式实现了。噢，Web 开发的极客们简直都兴奋不已！但他们也很不耐烦，因为浏览器实现大型且复杂的\
  \ Grid 规范需要一些时间。但现在 Grid 已经拥有近乎通用的浏览器支持，准备好让你页面布局提升到更高水平。在本章中，我将向你介绍 CSS Grid 并帮助你探索它所提供的一切。\n\
  \n### 介绍 CSS Grid\n\nCSS Grid Layout Module Level 1 —— 这是一个拗口的官方名称，我在本书中将其简称为 CSS\
  \ Grid 或只需 Grid —— 它提供了一种直接的方法，将容器划分为一个或多个列和一个或多个行——即一个*网格*（grid），然后可以选择地将容器的元素分配到网格的特定区域。使用\
  \ CSS Grid，你可以给 浏览器提供如下指令：\n\n- 将 `<body>` 标签设置为一个具有四行三列的网格。\n- 将 `header` 元素放在第一行，并使其跨越所有三列。\n\
  - 将 `nav` 元素放在第二行，并使其跨越所有三列。\n- 将 `article` 元素放在第三行的第 1 列和第 2 列。\n- 将 `aside` 元素放在第三行的第\
  \ 3 列。\n- 将 `footer` 元素放在第四行，并使其跨越所有三列。\n\n在学习如何执行这一切及更多操作之前，你需要知道网格（Grid）使用了两类元素：\n\
  \n- **网格容器 (Grid container)：** 这是一个块级元素作为内部元素的父元素，你对其配置固定数量的行和列。\n- **网格项目 (Grid\
  \ items)：** 这些是存在于网格容器内的元素，你将它们（或由浏览器自动分配）到网格的特定部分。\n\n### 设置网格容器\n\n要将一个元素指定为网格容器，你需要将其\
  \ `display` 属性设置为 `grid`：\n\n```css\n.container {\n  display: grid;\n}\n```\n\n\
  完成第一步后，该元素的子会自动变为网格项目。\n\n查看这段代码（你可以在本书的示例文件的 `bk05ch03/example01.html` 中找到）：\n\n\
  HTML:\n```html\n<div class=\"container\">\n  <div class=\"item item1\">1</div>\n\
  \  <div class=\"item item2\">2</div>\n  <div class=\"item item3\">3</div>\n  <div\
  \ class=\"item item4\">4</div>\n  <div class=\"item item5\">5</div>\n  <div class=\"\
  item item6\">6</div>\n</div>\n```\n\nCSS:\n```css\n.container {\n  border: 5px double\
  \ black;\n  display: grid;\n  text-align: center;\n}\n.item {\n  font-family: Verdana,\
  \ sans-serif;\n  font-size: 3rem;\n}\n.item1 {\n  background-color: hsl(0, 0%, 94%);\n\
  }\n.item2 {\n  background-color: hsl(0, 0%, 88%);\n}\n.item3 {\n  background-color:\
  \ hsl(0, 0%, 82%);\n}\n.item4 {\n  background-color: hsl(0, 0%, 76%);\n}\n.item5\
  \ {\n  background-color: hsl(0, 0%, 70%);\n}\n.item6 {\n  background-color: hsl(0,\
  \ 0%, 64%);\n}\n```\n（等等，提供的文本在结尾处断开了，我根据现有的片段进行了格式化）。\n\n\n\n\n\n![仅通过设置三个属性：display、grid-template-columns\
  \ 和 grid-template-rows 创建的基础网格截图。](img/9781394164684-fg050302.png)\n\n图 3-2： 仅通过设置三个属性：`display`、`grid-template-columns`\
  \ 和 `grid-template-rows` 创建的基础网格。\n\n### 让列或行根据需要增长或收缩\n\n请注意图 3-2 所示，两行没有占据网格容器的整个宽度。这是因为我为列宽设置了固定的像素值，而这些值的总和没有达到网格容器的宽度。如果网格容器小于列宽的总和，列将会在右侧溢出容器。\n\
  \n以上所有这些都是说明我们不应该总是使用像素来设置列和行大小的理由。通常，更好的方法是使用一种名为 `fr` 的新单位来指定列或行的大小，该单位是 Grid\
  \ 特有的，代表网格容器中可用剩余空间的比例（水平方向针对列，或垂直方向针对行）。例如，这里是上一节中的 CSS 代码，将第三列的原始值 `200px` 替换为\
  \ `1fr` (bk05ch03/example03.html)：\n\n```css\n.container {\n  display: grid;\n \
  \ grid-template-columns: 100px 300px 1fr;\n  grid-template-rows: 100px 200px;\n\
  }\n```\n\n如图 3-3 所示，第三列现在扩展以填充右侧可用的网格容器空间。\n\n![截图显示通过将第三列的大小改为 1fr，该列扩展填充了容器的剩余空间。](img/9781394164684-fg050303.png)\n\
  \n图 3-3： 通过将第三列的大小更改为 `1fr`，该列扩展以填充容器的剩余空间。\n\n如果你为多个列（或行）分配比例大小，浏览器将按比例分配剩余空间。例如，如果你给一列分配\
  \ `1fr` 空间，另一列分配 `2fr`，浏览器会将水平剩余空间的三之一分给第一列，将水平剩余空间的三之二分给第二列。\n\n### 简化 Grid 繁琐操作：repeat()\
  \ 函数\n\n根据你想要的布局，你可能会指定多个使用相同大小的连续行或列。这是一个示例：\n\n```css\ngrid-template-columns:\
  \ 250px 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 300px;\n```\n\n此声明在左侧创建了一个 250 像素的列，右侧创建了一个\
  \ 300 像素的列，中间有八个比例大小的列。所有这些 `1fr` 实例不仅输入起来很痛苦，而且很难一眼看出你总共定义了几列。编写此类声明的更简单、更清晰的方法是将重复的值替换为恰当的\
  \ `repeat()` 函数：\n\n```css\nrepeat(number, size)\n```\n\n* `number`：你希望浏览器重复 `size`\
  \ 的次数。\n* `size`：你想要重复的列或行大小。\n\n所以，代替之前的声明，你可以使用以下代码 (bk05ch03/example04.html)：\n\
  \n```css\ngrid-template-columns: 250px repeat(8, 1fr) 300px;\n```\n\n![提示](img/tip.png)\
  \ 你用于 `number` 参数的一个经常非常有用的关键字是 `auto-fill`，它要求浏览器根据 `size` 参数自动在网格容器中填充尽可能多的列或行。在接下来的示例中，浏览器将创建尽可能多容纳在网格容器宽度内的\
  \ `100px` 列：\n\n```css\ngrid-template-columns: repeat(auto-fill, 100px);\n```\n\n\
  ### 设置值范围：minmax() 函数\n\n在列或行上设置一个不可灵活的大小（例如，使用像素）会创建一个不适应内容变化的僵硬结构。采取相反的方法，在列或行上使用灵活的大小（即使用\
  \ `fr` 单位），如果列或行扩展到远大于内容的尺寸，可能会导致问题。\n\n我在下一节中提到了一些可以解决此问题的关键词，但另一种解决方案是使用 `minmax()`\
  \ 函数设置大小值范围：\n\n```css\nminmax(min, max)\n```\n\n* `min`：列或行允许收缩的最小大小\n* `max`：列或行允许扩展的最大大小\n\
  \n例如，在下面的声明中，第三列的宽度不小于 `200px`，也不大于 `500px` (bk05ch03/example05.html)：\n\n```css\n\
  grid-template-columns: 150px 200px minmax(200px, 500px);\n```\n\n在下面的示例中，第一列可以扩展以填充可用空间，但其宽度永远不会小于\
  \ `250px` (bk05ch03/example06.html)：\n\n```css\ngrid-template-columns: minmax(250px,\
  \ 1fr) repeat(5, 10vw);\n```\n\n### 使用 auto 关键字进行尺寸\n\n你可以使用 `auto` 关键字设置 `grid-template-columns`\
  \ 或 `grid-template-rows` 的大小。`auto` 关键字向网络浏览器发送以下指令：\n\n* **对于列：** 缩小列是可以接受的，但不能小于最小可能的宽度（通常是该列中最长单词的长度）。同样，扩展列是可以接受的，但不能大于最大可能的宽度（如果有空间，通常是该列中最长未换行条目的长度）。如果容器有额外的水平空间，扩展列以填充额外空间是可以接受的（因此在这种场景下，`auto`\
  \ 的作用与 `1fr` 相同）。\n* **对于行：** 缩小行是可以接受的，但不能小于行中最高的条目。同样，扩展行是可以接受的，但不能大于行中最高的内容。\n\
  \n这里是一个使用 `auto` 关键字的示例 (bk05ch03/example07.html)：\n\n```css\ngrid-template-columns:\
  \ repeat(3, auto);\ngrid-template-rows: auto auto;\n```\n\n### 让浏览器完成部分工作：隐式网格\n\
  \n与显式网格一起工作——即在网格容器上指定 `grid-template-columns` 和 `grid-template-rows` 属性——意味着在定义网格布局时你正在完成所有的繁重工作。大多数情况下，这是你想要的，因为显式网格给了你对网格结构的显式控制。\n\
  \n然而，有时你可以采取更放手的方法，让网络浏览器承担部分工作。例如，如果你忽略 `grid-template-columns` 和 `grid-template-rows`\
  \ 属性，浏览器将创建一个单列网格，行数等于网格容器中子项目的数量（示例请查看本章早前的“设置网格容器”）。这就是*隐式网格*的示例，在缺少一个或多个网格模板属性的情况下，网络浏览器会自动设置网格结构。\n\
  \n你并不经常完全不需要网格模板，但有时你的设计可能要求仅指定列模板或行模板。\n\n#### 遗漏网行模板\n\n如果你指定了 `grid-template-columns`\
  \ 属性并漏掉了 `grid-template-rows` 属性，浏览器会自动执行两件事：\n\n* 创建所需的行数，以将网格容器的所有子元素放入列模板中\n\
  * 使用 `auto` 值配置行高（查看使用 auto 关键字进行尺寸），这通常意味着将每行的高度设置为行中最高元素的高度\n\n这是一个示例 (bk05ch03/example08.html)：\n\
  \n```html\n<div class=\"container\">\n  <div class=\"item item1\">1</div>\n  <div\
  \ class=\"item item2\">2</div>\n  <div class=\"item item3\">3</div>\n  <div class=\"\
  item item4\">4</div>\n  <div class=\"item item5\">5</div>\n  <div class=\"item item6\"\
  >6</div>\n  <div class=\"item item7\">7</div>\n  <div class=\"item item8\">8</div>\n\
  </div>\n```\n\n```css\n.container {\n  border: 5px double black;\n  display: grid;\n\
  \  grid-template-columns: 1fr 3fr 2fr;\n}\n```\n\n\n\n\n\n此示例仅设置了三列网格，而没有指定行模板。如图\
  \ 3-4 所示，浏览器会自动创建所需的行数以适应所有子 `div` 元素（第三行最后留有一个空白单元格）。\n\n### 省略网格列模板\n\n如果你指定了\
  \ `grid-template-rows` 属性而省略了 `grid-template-columns` 属性，浏览器会自动执行两件事：\n\n*   为网格容器的所有子元素创建一个单列\n\
  *   使用 `auto` 值配置列宽（参阅“**使用 auto 关键字进行尺寸调整**”）\n\n![截图显示，在没有行模板的情况下，浏览器创建了所需的行数以适应所有子元素。](img/9781394164684-fg050304.png)\n\
  \n图 3-4： 在没有行模板的情况下，浏览器创建了所需的行数以适应所有子元素。\n\n这是一个示例（参阅图 3-5 和 bk05ch03/example09.html）：\n\
  \nHTML:\n```html\n<div class=\"container\">\n  <div class=\"item item1\">1</div>\n\
  \  <div class=\"item item2\">2</div>\n  <div class=\"item item3\">3</div>\n  <div\
  \ class=\"item item4\">4</div>\n  <div class=\"item item5\">5</div>\n  <div class=\"\
  item item6\">6</div>\n  <div class=\"item item7\">7</div>\n  <div class=\"item item8\"\
  >8</div>\n</div>\n```\n\nCSS:\n```css\n.container {\n  border: 5px double black;\n\
  \  display: grid;\n  grid-template-rows: repeat(8, auto);\n}\n```\n\n你可能会奇怪，为什么在图\
  \ 3-5 中的列宽默认为 `auto` 时，列的宽度并没有与其最宽的项一样。这是因为网格列的默认对齐方式是 `stretch`，这会导致列占据网格容器中所有可水平空间。要学习如何控制列和行的对齐，请参阅本章节后部分的“**让你的网格鸭子排队（或对齐）：对齐元素**”。\n\
  \n![截图显示，在没有列模板的情况下，浏览器创建了一个跨越网格容器宽度的单列。](img/9781394164684-fg050305.png)\n\n图 3-5：\
  \ 在没有列模板的情况下，浏览器创建了一个跨越网格容器宽度的单列。\n\n### 为隐式或列指定尺寸\n\n当你省略 `grid-template-rows`\
  \ 或 `grid-template-columns` 属性时，浏览器会使用 `auto` 关键字分别对隐式列或行进行定价。如果这些自动尺寸不符合你的设计，你可以使用以下属性覆盖它们：\n\
  \n`grid-auto-rows: value;`\n`grid-auto-columns: value;`\n\n*   `value`: 一个长度、百分比或\
  \ `minmax()` 函数，用于指定你偏好的尺寸。\n\n例如（参阅 bk05ch03/example10.html），这里是隐式行代码的更新（参阅“**省略网格行模板**”），指示浏览器对每行应用\
  \ 100px 的高度（如图 3-6 所示）。\n\n```css\n.container {\n  border: 5px double black;\n \
  \ display: grid;\n  grid-template-columns: 1fr 3fr 2fr;\n  grid-auto-rows: 100px;\n\
  }\n```\n\n![使用 grid-auto-rows 为隐式行设置高度的截图。](img/9781394164684-fg050306.png)\n\n\
  图 3-6: 使用 `grid-auto-rows` 为隐式行设置高度。\n\n### 创建网格间隙\n\n默认情况下，浏览器不包含任何*间距（gutters）*：即每列之间的水平空间或每行之间的垂直空间。如果你希望在网格项目之间留有一些空白，可以为你的网格容器添加以下属性：\n\
  \n`row-gap: row-gap-value;`\n`column-gap: column-gap-value;`\n`gap: row-gap-value\
  \ [column-gap-value];`\n\n*   `row-gap-value`: 一个长度值，指定网格容器中每行项目之间的空间。\n*   `column-gap-value`:\
  \ 一个长度值，指定网格容器中每列项目之间的空间。\n\n![记住](img/remember.png) 当你使用 `gap` 简写属性时，如果省略了 `row-gap-value`，它默认为\
  \ `column-gap-value`。如果省略了 `column-gap-value`，它默认为 `row-gap-value`。\n\n### 接管控制：分配分配\n\
  \nGrid 中最重要的概念之一是单元格。单元格是行和列的交叉点。与其让浏览器使用默认的每个项目一个单元格的算法填充网格，不如自己接管过程并分配项目。Grid\
  \ 提供了两种分配项目的方法：\n\n*   将项目分配到特定的列和行\n*   将项目分配到命名网格区域\n\n#### 将网格项目分配到列和行\n\n打破默认单项目单元格网格布局更直接的方法是将网格项目分配到设计所需的任何矩形列行集合。我为什么在句子中加入了*矩形*这个词？因为非矩形分配是不允许的。例如，你不能将网格项目分配到\
  \ L 形的单元格集合或不连续的单元格集合。\n\n例如，查看图 3-7 所示的网格设计，这是 Grid 发挥威力的地方。无论通过在网格容器上指定 `grid-template-columns`\
  \ 和 `grid-template-rows` 来建立式网格，还是通过省略一个或两个属性建立隐式网格，浏览器都会通过将每个项目放入单个单元格中来填充网格。\n\
  \n 理解网格线、轨道和轴\n\n在 CSS 规范中，网格容器并不像你预期的那样分为列和行。相反，网格容器被分为一系列被称为*网格线（grid lines）*的垂直和水平线。在图\
  \ 3-8 中，每条虚线代表一条网格线。在每个网格容器中，网格线具有以下特征：\n\n*   *网格轨道（grid track）*是网格列或网格行的通用术语，定义为两条相邻网格线之间的空间。\n\
  \n\n\n\n\n*   垂直网格轨道——即你我之间的一列——由左侧的垂直网格线和右侧的垂直网格线限定。\n*   水平网格轨道——即一行——由上方的水平网格线和下方的水平网格线限定。\n\
  *   垂直网格线从最左侧的网格线开始编号为 1，直到最右侧的网格线，其编号比列数加 1（例如，在三列网格中，最右侧的垂直网格线编号为 4）。\n*   水平网格线从顶部的网格线开始编号为\
  \ 1，直到底部网格线，其编号比行数加 1（例如，在三行网格中，底部的水平网格线编号为 4）。\n\n图 3-9 显示了应用到图 3-8 网格容器上的网格线编号。\n\
  \n![显示 CSS 网格通过带编号的垂直和水平线划分网格容器的屏幕截图。](img/9781394164684-fg050309.png)\n\n图 3-9：\
  \ CSS 网格通过带编号的垂直和水平线划分网格容器。\n\n因此，我在上一节中提出的特定列和行的项目分配，实际上应该是特定的 `column-line-` 和\
  \ `row-line-` 分配：\n\n*   将项目 A 分配为从列线 1 跨到列线 4，并从行线 1 跨到行线 2。\n*   将项目 B 分配为从列线\
  \ 1 跨到列线 2，从行线 2 跨到行线 4。\n*   将项目 C 分配为从列线 2 跨到列线 4，从行线 2 跨到行线 4。\n\n由于 CSS Grid\
  \ 是二维布局机制，当你发现网格容器有两个轴时完全不会感到意外：\n\n*   **块轴（Block axis）：** 网格容器列网格线运行的垂直轴\n*  \
  \ **内联轴（Inline axis）：** 网格容器行网格线运行的水平轴\n\n![记住](img/remember.png) 这些定义假设当前语言是文字从水平且从上到下阅读的语言（如英语）。在垂直语言中（如日语和中文），块轴是水平的，内联轴是垂直的）。\n\
  \n如果你在心里想：“哇，这听起来一点也不直观”，请知道我完全赞同你的观点！好消息是，CSS Grid 确实提供了一种更直观的方法来分配网格项目（请查看“将网格项目分配到命名的网格区域””）；坏消息是，我应该先完成对你介绍行号分配方法的讲解，这是下一节的任务。\n\
  \n##### 使用行号分配网格项目\n\n要将网格项目放置在网格容器内的任何位置，你需要指定起始和结束列线编号，以及起始和结束行线编号。因此，对于每个网格项目，你设置四个属性值：\n\
  \n```css\nitem {\n  grid-column-start: column-start-value;\n  grid-column-end: column-end-value;\n\
  \  grid-row-start: row-start-value;\n  grid-row-end: row-end-value;\n}\n```\n\n\
  *   `grid-column-start`：指定你想让项目开始的列线的数字。\n*   `grid-column-end`：指定你想让项目结束的列线的数字。例如，如果将\
  \ `grid-column-end` 设置为 `4`，则该网格项目结束在第 3 列。注意几点：\n    *   如果你省略此属性，该项目将仅使用起始列。\n\
  \    *   值 `-1` 始终指向最右侧的列线。因此，当你声明 `grid-column-end: -1` 时，项目将从它的起始列线跨到网格中最右侧列（即使你之后向网格添加了更多列）。\n\
  \    *   你可以使用关键字 `span` 后面跟一个空格，然后是一个数字指定你想让项目跨越网格的列数。例如，以下两组声明是等效的：\n        ```css\n\
  \        grid-column-start: 1;\n        grid-column-end: 4;\n\n        grid-column-start:\
  \ 1;\n        grid-column-end: span 3;\n        ```\n*   `grid-row-start`：指定你想让项目开始的行线的数字。\n\
  *   `grid-row-end`：指定你想让项目结束的行线的数字。例如，如果将 `grid-row-end` 设置为 `3`，则该网格项目结束在第 2 行。注意几点：\n\
  \    *   如果你省略此属性，该项目将仅使用起始行。\n    *   值 `-1` 始终指向底部行线。因此，当你声明 `grid-row-end: -1`\
  \ 时，项目将从它的起始行线跨到网格中的底部行（即使你之后向网格添加了更多行）。\n    *   你可以使用关键字 `span` 后面跟一个空格，然后是一个数字指定你想让项目向下跨越网格的行数。例如，以下两组声明是等效的：\n\
  \        ```css\n        grid-row-start: 1;\n        grid-row-end: 4;\n\n      \
  \  grid-row-start: 1;\n        grid-row-end: span 3;\n        ```\n\n这里有一个示例，结果如图\
  \ 3-10 所示：\n\n```html\n<div class=\"container\">\n  <div class=\"item\">1</div>\n\
  \  <div class=\"item\">2</div>\n  <div class=\"item\">3</div>\n  <div class=\"item\"\
  >4</div>\n  <div class=\"item\">5</div>\n  <div class=\"item\">6</div>\n</div>\n\
  ```\n\nCSS:\n```css\n.container {\n  display: grid;\n  grid-template-columns: repeat(3,\
  \ 1fr);\n  grid-template-rows: 15vh 1fr;\n}\n\n.item1 {\n  grid-column-start: 1;\n\
  \  grid-row-end: 2;\n}\n\n.item2 {\n  grid-column-start: 1;\n  grid-row-end: span\
  \ 2;\n}\n\n.item3 {\n  grid-column-start: 2;\n  grid-row-end: span 2;\n}\n\n.item4\
  \ {\n  grid-column-start: 2;\n  grid-row-end: -1;\n}\n\n.item5 {\n  grid-column-start:\
  \ 3;\n  grid-row-end: -1;\n}\n\n.item6 {\n  grid-column-start: 3;\n  grid-row-start:\
  \ 3;\n}\n```\n\n\n\n\nCSS Grid 面临着直观性问题。也就是说，虽然 Grid 的基础非常很容易掌握，但你的代码实际在执行的操作往往难以理解。例如，考虑上一节中的网格容器定义：\n\
  \n```css\n.container {\n  display: grid;\n  grid-template-columns: 15vw repeat(3,\
  \ 1fr) 20vw;\n  grid-template-rows: 15vh 1fr 1fr;\n}\n```\n\n当你第一次看到这样的代码时，你可能大致感觉到它的作用，但大概率这种大概的感知与图\
  \ 3-10 中所示的最终成品完全不像。\n\n提到图 3-10 中的网格，你可能多或少能直观判断出每个网格项目（grid item）的用途：项目 1 可能是网站\
  \ Logo；项目 2 可能是页眉；项目 3 可能是导航区域；项目 4 可能是主内容；而项目 5 和 6 可能是侧边栏或广告。\n\n以项目 3 为例，现在看看上一节中的分配代码：\n\
  \n```css\n.item3 {\n  grid-column-start: 1;\n  grid-row-start: 2;\n  grid-row-end:\
  \ -1;\n}\n```\n\n这能告诉你什么关于该项目的信息？没多少！诚然，只要花一点精力，你可以算出该项目在网格中的尺寸和位置，但这正是我说的观点：这需要*费力*。现在想象一下将这种精力乘以网格中所有的六个项目。想象一下如果你的网格包含十几个项目。别想了！\n\
  \n幸运的是，CSS 大师们怜悯了我们所有人，设计了第二种分配网格项目的方法：*命名网格区域（named grid areas）*。这正如其字面意思：为你提供带有语义或描述性名称网格矩形区域。然后你将每个网格项目分配到每个命名区域，任务就完成了。这是一个非常棒且直观的\
  \ Grid 特性，接下来的两节将解释你需要的所有知识。\n\n#### 设置命名网格区域\n\n当你使用命名网格区域时，首要任务是进行实际命名。在确定好网格模板后，对网格容器应用\
  \ `grid-template-areas` 属性：\n\n```css\ngrid-template-areas:\n  \"first row named\
  \ areas\"\n  \"second row named areas\"\n  \"etc.\"\n  \"bottom row named areas\"\
  ;\n```\n\n*   `row named areas`：为行中的每个单元格提供一个名称，并遵循以下指南：\n    *   值中每个用引号括起来的行代表你网格中的一行。\n\
  \    *   如果一个命名区域跨越 *X* 列，则在相应行的字符串中重复该名称 *X* 次。\n    *   如果命名区域跨越 *X* 行，则在连续的行字符串中重复该名称\
  \ *X* 次。\n    *   为了方便网视化网格结构，请在声明中将每行的命名区域单独写在一行。\n    *   若要留空某个单元格，请使用点（`.`）代替名称。\n\
  \    *   为网格中的每个单元格输入名称（或点）。\n    *   你只能定义矩形的命名区域。\n    *   如果你在网格某部分定义了命名区域，则不能在网格其他地方使用相同的名称。\n\
  \n命名网格区域在抽象情况下很难解释，但在实践中很容易掌握。为此，以下是我将如何为之前在图 3-10 中显示的网格命名区域的方法：\n\n```css\n.container\
  \ {\n  display: grid;\n  grid-template-columns: 15vw repeat(3, 1fr) 20vw;\n  grid-template-rows:\
  \ 15vh 1fr 1fr;\n  grid-template-areas:\n    \"logo header header header header\"\
  \n    \"nav content content content sidebar\"\n    \"nav content content content\
  \ ad\";\n}\n```\n\n以下是 `grid-template-area` 值中发生的情况：\n\n*   **第一行**：第一个单元格是一个名为\
  \ `logo;` 的区域；接下来的四个单元格组成一个名为 `header.` 的区域。\n*   **第二行**：第一个单元格是名为 `nav;` 的区域的一部分；接下来的三个单元格是名为\
  \ `content;` 的区域的一部分；最右侧的单元格是一个名为 `sidebar.` 的区域。\n*   **第三行**：第一个单元格是名为 `nav;`\
  \ 区域的第二部分；接下来的三个单元格形成了名为 `content;` 区域的其余部分；最右侧的单元格是一个名为 `ad.` 的区域。\n\n接下来将每个项目分配到一个命名区域。\n\
  \n#### 将项目分配到区域\n\n定义好命名区域后，你的最后一个任务是使用 `grid-area` 属性将每个网格项目分配到这些命名区域之一：\n\n```css\n\
  .item {\n  grid-area: name;\n}\n```\n\n*   `name`：你想要分配给项目的命名区域。该名称必须是你在网格容器的 `grid-template-areas`\
  \ 属性中指定的名称之一。\n\n例如（查看 `bk05ch03/example13.html`），以下代码将六个网格项目分配到上一节中的命名区域：\n\n```css\n\
  .item1 { grid-area: logo; }\n.item2 { grid-area: header; }\n.item3 { grid-area:\
  \ nav; }\n.item4 { grid-area: content; }\n.item5 { grid-area: sidebar; }\n.item6\
  \ { grid-area: ad; }\n```\n\n我想你会同意，这段代码比使用列线和行线分配项目要易读得多。\n\n#### 在浏览器开发者工具中显示命名区域\n\
  \n命名网格区域是一种令人耳一新的直观的网格设置方法。然而，网格越复杂，越容易在命名区域结构中引入问题。当这种情况发生时，或者你只是想检查命名区域是否按你预期的方式工作，可以使用\
  \ 浏览器的开发工具将命名区域叠加在你的网格容器上，以便视觉化布局。\n\n在 Google Chrome 中遵循以下步骤（所有主流浏览器的步骤大体相同），可以在开发工具中叠加网格容器的命名区域：\n\
  \n1.  **在网格容器内部任何地方右键点击，然后点击检查（Inspect）。** 开发者工具打开。\n2.  **在 Elements（元素）选项卡中，点击\
  \ Layout（布局）子选项卡。**\n3.  **在 Grid 区域的 Display Settings（显示设置）中，选择 Hide Line Labels（隐藏标签）。**\n\
  2.  **选择 Area Names（区域名称）。**\n5.  **在 Grid Overlays 列表中，勾选网格容器旁的复选框。**\n\n浏览器会将命名区域叠加在你的网格上，如图\
  \ 3-12 所示。\n\n![使用开发者工具查看网格容器命名区域的截图。](img/9781394164684-fg050312.png)\n\n图 3-12：\
  \ 使用开发者工具查看网格容器命名区域。\n\n### 让元素排成行（或列）：对齐内容\n\nCSS Grid 提供了几种属性用于对齐网格中的内容。Grid 的对齐属性分为两个大类：\n\
  \n*   **Direction（方向）**：执行对齐的轴：\n    *   **Justify（对齐）**：沿网格容器的内联轴（inline axis）设置。\n\
  \    *   **Align（对齐）**：沿网格容器的块轴（block axis）设置。\n*   **Target（目标）**：应用对齐的网格部分：\n\
  \    *   **Content（内容）**：对网格中的所有列或所有行进行对齐。\n    *   **Items（项目）**：对已分配区域内的单个网格项目进行对齐。\n\
  \n根据上述分类，CSS Grid 定义了四个对齐属性：\n\n*   `justify-content`：沿网格所有列的内联轴对齐。其语法如下（图 3-13\
  \ 演示了每个值）：\n\n    ```css\n    .container {\n      justify-content: start|center|end|stretch|space-around|space-between|space-evenly;\n\
  \    }\n    ```\n\n*   `align-content`：沿网格所有行的块轴对齐。其语法如下（图 3-14 演示了这些值）：\n\n   \
  \ ```css\n    .container {\n      align-content: start|center|end|stretch|space-around|space-between|space-evenly|baseline;\n\
  \    }\n    ```\n\n\n\n\n![Remember](img/remember.png) 为了让 `align-content`（或下方的\
  \ `align-items`）生效，你必须为网格容器设置一个高度——具体来说，是一个大于所有行自然高度总和的高度。如果没有这个自定义高度，浏览器将设置容器高度，恰好能容纳这些行，因此没有额外的空间让\
  \ `align-content`（或 `align-items`）发挥作用。此外，在图 3-14（以及图 3-16）中，对于 `baseline` 示例，我为网格项目应用了不同的高度，以便更容易看出每个项目现在都沿着文本基线对齐。\n\
  \n*   `justify-items`: 设置每个网格项目在其网格区域内沿内联轴（inline axis）的对齐方式。其语法如下（图 3-15 显示了每个值的用法）：\n\
  \n    ```\n    container {\n      justify-items: start|center|end|stretch;\n   \
  \ }\n    ```\n\n*   `align-items`: 设置每个网格项目在其网格区域内沿块级轴（block axis）的对齐方式。其语法如下（图\
  \ 3-16 测试了每个值）：\n\n    ```\n    container {\n      align-items: start|center|end|stretch|baseline;\n\
  \    }\n    ```\n\n![justify-content 属性值的实际效果截图。](img/9781394164684-fg050313.png)\n\
  \n图 3-13： `justify-content` 属性值的实际效果。\n\n![align-content 属性值的展示截图。](img/9781394164684-fg050314.png)\n\
  \n图 3-14： `align-content` 属性值的展示。\n\n![justify-items 属性值的实际应用截图。](img/9781394164684-fg050315.png)\n\
  \n图 3-15： `justify-items` 属性值的实际应用。\n\n![align-items 属性值的展示截图。](img/9781394164684-fg050316.png)\n\
  \n图 3-16： `align-items` 属性值的展示。\n\n## 第 4 章：创建响应式布局\n\n### 本章内容\n\n*   ![Bullet](img/check.png)\
  \ **使用 Flexbox、Grid 和视口单位实现流式布局**\n*   ![Bullet](img/check.png) **使用媒体查询、容器查询和用户偏好查询实现自适应布局**\n\
  *   ![Bullet](img/check.png) **让你的页面排版具有响应式**\n*   ![Bullet](img/check.png) **响应式交付图像**\n\
  *   ![Bullet](img/check.png) **了解移动优先的布局方法**\n\n*我们可以为最佳的视觉体验进行设计，但要将基于标准的技术嵌入到我们的设计中，使它们不仅更灵活，而且更能自适应渲染它们的媒体设备。简而言之，我们需要实践响应式网页设计。*\n\
  \n— ETHAN MARCOTTE\n\n很有可能你所有的或大部分网页编码都是在一个相对较大的屏幕上完成的，无论是使用全尺寸桌面显示器还是笔记本屏幕。当然，这没有问题，但它可能会（而且经常如此）导致一个大问题：你构建的网页只在较大的屏幕上看起来良好且运行正常。为什么这是一个问题呢？原因很简单，你页面的访问者将使用各种尺寸的设备，从\
  \ 60 英寸智能电视到 27 英寸桌面显示器、17 英寸笔记本显示器，一直到 2.5 英寸的智能手机。在现代网页中，一种尺寸绝对不适用于所有人，因此你需要构建页面，使其用户体验（`UX，内行人士知道的`）——即访问者遇到和/或交互的内容——对所有人都是积极的。\n\
  \n在本章中，你将探索响应式网页设计的丰富世界。你将学习如何使用 Flexbox 和/或 Grid 仅通过几个属性就让你的布局变为流式；如何使用查询让你的布局具有自适应性；如何以响应式的方式交付图像；你还将深入页面布局中最大的趋势：移动优先方法。\n\
  \n### 什么是响应式布局？\n\n为了让页面在任何屏幕上都看起来良好且运行正常，你需要考虑到响应式。响应式网页是指能够根据屏幕尺寸改变布局的。为了理解为什么需要响应式，请考虑以下两种主要的非响应式布局：\n\
  \n*   **固定宽度**：一种设置了宽度的布局。在这种情况下，如果页面的宽度大于屏幕宽度，用户可能需要水平滚动查看，如图 4-1 所示（`0504/example01`）。\n\
  *   **无宽度**：一种没有设置宽度的布局。这种布局可以根据屏幕大小很好地适应，但问题是，在较大的屏幕上，文本行可能会变得非常长，如图 4-2 所示（`0504/example02`）。\n\
  \n你可以将上述两种场景描述为“不关心”的布局，因为它们并不关注正在使用的屏幕尺寸。如果你不想成为一个“不关心”的开发者，你从开始就需要为你的网页加入“关注”。如何做到这一点？通过考虑到以下所有（不是部分）情况：\n\
  \n![固定宽度时，小屏幕用户可能需要水平滚动。](img/9781394164684-fg050313.png)\n\n图 4-1： 固定宽度时，小屏幕用户可能需要水平滚动。\n\
  \n![无宽度时，文本行可能会变得非常长，导致难以阅读。](img/9781394164684-fg050314.png)\n\n图 4-2： 无宽度时，文本行可能会变得非常长，导致难以阅读。\n\
  \n*   **设备类型**：如今，访问你网页的人可能在使用手机、平板电脑、笔记本电脑、桌面电脑以及各种“智能”设备：电视、手表、冰箱、割草机等。所有这些设备都有不同的屏幕尺寸，你的目标应该是设计一个在任何屏幕上看起来良好的页面。\n\
  *   **浏览器窗口大小**：并不是每个访问页面的电脑用户都会最大化浏览器窗口。有些人倾向于使用较小的窗口；有些人选择使用操作系统的分屏功能；还有人可能会根据页面内容动态调整浏览器窗口。关键在于，你不能假设访问者只会使用常见的视口尺寸来设计页面。\n\
  *   **屏幕方向**：智能手机和平板用户可以轻松将设备从竖屏切换到横屏，某些可旋转显示器也可以进行同样的切换。你的页面需要优雅地处理这种方向的切换，而不崩溃。\n\
  *   **用户缩放级别**：有些人在浏览网页时使用了浏览器缩放功能。也就是说，而不是默认的 100% 缩放，有些人会使用 125%、150% 甚至 200%。即使用户调高缩放级别，你的页面仍然应该是可读易用的。\n\
  \n\n\n\n\n- **用户默认字体大小：** 有些人并不是提高缩放比例（有时也是作为额外），而是将默认字体大小从 `16px` 增加到 `20px`、`24px`、`32px`\
  \ 甚至更高。你的页面不仅应该尊重这种变化（通过不使用绝对单位（如像素）来设置你的字体大小），还应该在这些较大的字体下看起来良好且运行正常。\n- **用户偏好：**\
  \ 访问你页面的许多人已经自定义了他们的操作系统，使用了如深色模式、高对比度颜色和动画效果中的减少运动等设置。你的页面应该通过检查这些偏并在检测到它们时实施必要的\
  \ CSS 来尊重这些偏好。\n- **设备和网络性能：** 许多人使用性能不足的设备、缓慢的网络连接和有限的带宽在网上浏览。你的页面不应该因给这些人带来不必要的数据或功能而将他们落下。\n\
  \n![Tip](img/tip.png) 你可以使用浏览器的开发工具来模拟较慢的网络速度。在 Chrome（以及大多数其他浏览器也类似）中，打开开发工具（例如，右键点击页面并点击“检查”），点击\
  \ Network 标签页，点击 Throttling 列表（默认显示 No Throttling），然后选择一种网络速度：Fast 3G、Slow 3G 甚至\
  \ Offline。你也可以点击 Add 创建自定义的节流配置。要模拟较慢的设备 CPU，点击 Performance 标签，点击 Capture Settings（齿轮图标），然后使用\
  \ CPU 列表选择减速选项（4x slowdown 或 6x slowdown）。现在你可以重新加载页面以测试在这些模拟减速生效下的性能。\n\n响应式网页是指能够成功处理所有这些不同场景的页面。这听起来可能是一项艰的任务，但现代\
  \ CSS 足够强大，你可以通过采用以下方法之一来实现响应式目标的全部或大部分：\n\n- **流式布局（Fluid layout）：** 一种响应浏览器环境的小小变化（如视口大小的变化）而平滑调整的布局。\n\
  - **自适应布局（Adaptive layout）：** 仅在满足某些预定义标准时（例如视口宽度超过特定阈值）才会调整的布局。\n\n![Remember](img/remember.png)\
  \ 注意，这些不是二选一的选择。相对简单的页面可能只使用流式或仅使用自适应技术，但更复杂的页面可能会结合这两种技术的元素。\n\n接下来的两个部分将详细解释流式布局和自适应布局。\n\
  \n### 顺势而为：流式布局（Going with the Flow: Fluid Layouts）\n\n响应式设计的早期完全关于桌面端与移动用户，以至于\
  \ CSS 设计师需要构建两个完全独立的网站：一个在桌面电脑上运行良好的网站，另一个是为移动用户优化的网站。\n\n这种策略无疑是疯狂的，但在现代 Web 开发圈中仍然留有桌面/移动二元论的余味，在那里人们经常使用响应式技术（通常是媒体查询；请查看本章稍后的“通过查询实现响应式设计：自适应布局”部分）来确保页面在移动设备屏幕和桌面显示器上最大化的浏览器窗口中看起来良好，但仅此而已。但我向你保证，很大一部分用户将使用介于这些尺寸之间的浏览器窗口访问你的页面。\n\
  \n为了确保无论用户使用多大的浏览器窗口，甚至当用户动态更改窗口大小时，你的页面看起来良好并按预期方式工作，你需要使用流式布局技术来构建页面。到底什么是流式布局呢？这是一个大课题，但就本节而言，我可以将其缩小为以下内容：\n\
  \n- 块级元素自然地填充可用空间。\n- 块级元素随视口的扩大而扩展，随视口的缩小而收缩。\n- 当视口变小时，块级元素自然地换到多行（或多列）。\n- 大文本（非正文文本）随视口伸缩。\n\
  - 图像大小随视口伸缩。\n\n在理想的流式布局中，你使用 CSS 为 Web 浏览器提供关于你希望布局如何工作的几条指南，然后让浏览器来处理其余部分。\n\n\
  #### Flexbox 如何让页面变为流式\n\n创建流式布局你可以使用的最佳策略是为一维布局部署 Flexbox，为二维布局部署 CSS Grid。我将在下一节讨论\
  \ CSS Grid，但在这里我关注基于 Flexbox 布局的固有的响应性。（所有 Flexbox 细节请参阅第 5 卷 第 2 章）。\n\n首先，你可以通过为每个\
  \ flex 项目添加单条声明，让 flex 项目自然地填充 flex 容器中的可用空间*并*随视口伸缩：\n\n```css\nflex: 1;\n```\n\
  \n这相当于设置了以下三个声明：\n\n```css\nflex-grow: 1;\nflex-shrink: 1;\nflex-basis: 0;\n```\n\
  \n`flex-grow: 1` 允许项目随视口大小的变化沿主轴线扩展；`flex-shrink: 1` 允许项目随视口大小的变化沿主轴线收缩；`flex-basis:\
  \ 0` 对项目的大小没有任何限制（除了不会收缩到最小内容尺寸更小之外）。\n\n如果你所有的 flex 项目具有相似的内容和相似的盒模型属性（padding\
  \ 等），那么在每个项目上设置 `flex: 1` 意味着你最终得到了等大小的列（如果你使用的是 `flex-direction: row`）或行（如果你使用的是\
  \ `flex-direction: column`）。\n\n在所有 flex 项目上设置 `flex: 1` 意味着如果你在使用 `flex-direction:\
  \ row`，你得到了等大小的列；如果你在使用 `flex-direction: column`，则得到了等大小的行。\n\n在所有 flex 项目上设置 `flex:\
  \ 1` 意味着如果你在使用 `flex-direction: row`，你得到了等大小的列；如果你在使用 `flex-direction: column`，则得到了等大小的行。\n\
  \n在所有 flex 项目上设置 `flex: 1` 意味着如果你在使用 `flex-direction: row`，你得到了等大小的列；如果你在使用 `flex-direction:\
  \ column`，则得到了等大小的行。\n\n在所有 flex 项目上设置 `flex: 1` 意味着如果你在使用 `flex-direction: row`，你得到了等大小的列；如果你在使用\
  \ `flex-direction: column`，则得到了等大小的行。\n\n在所有 flex 项目上设置 `flex: 1` 意味着如果你在使用 `flex-direction:\
