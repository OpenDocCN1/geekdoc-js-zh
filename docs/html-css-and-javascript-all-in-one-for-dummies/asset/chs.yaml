  \ 实例，其值以 `value` 结尾。以下示例样式了所有 `href` 属性以 `.org` 结尾的 `a` 元素 (bk03ch02/example12.html)：`a[href$=\"\
  .org\"] {color: firebrick;}` |\n| Attribute is first | `element`[`attr|=\"value\"\
  ]` | 任何属性名为 `attr` 的 `element` 实例，其值等于 `value` 或以 `value`-` 开头（即 `value` 后面跟一个连字符\
  \ [`-]`）。以下示例匹配了所有 `lang` 属性等于 `en` 或以 `en-` 开头的 `div` 元素 (bk03ch02/example13.html)：`div[lang|=\"\
  en\"] {color: blue;}` |\n| Attribute includes | `element`[`attr`~=\"value\"]` |\
  \ 任何属性名为 `attr` 的 `element` 实例，其值包含完整单词的 `value`。以下示例匹配了所有 `alt` 属性包含 `photo` 作为完整单词的\
  \ `img` 元素 (bk03ch02/example14.html)：`img[alt~=\"photo\"] {border: 12px ridge saddlebrown;}`\
  \ 注意，此选择器不会匹配包含 `photograph` 或 `telephoto` 等单词的 `alt` 属性（假设它们在 `alt` 字符串的其他地方没有完整单词\
  \ `photo`）。 |\n\n[表 2-1] CSS 属性选择器\n\n## 第 3 章\n\n# 伪类学校：学习伪类和伪元素\n\n### 本章内容\n\n\
  - 掌握伪类\n- 选择子元素\n- 根据类型、状态或用户操作为元素设置样式\n- 使用功能性伪类提升你的选择器技巧\n- 尝试一些伪元素\n\n*pseudo:\
  \ 形容词，接近的，几乎的，或试图成为。* — DICTIONARY.COM\n\n当你使用 CSS 时，你本质上是在为你用于构建页面结构的 HTML 应用样式。你的\
  \ CSS 规则处理的是真实的实体（如果 HTML 标签可以被视为“真实”的话），例如标题（`h1`、`h2` 等）、段落（`p` 元素）、链接（`a` 元素）和图像（`img`\
  \ 元素）。\n\n然而，你的页面有一个在 HTML 代码中并不明显的（至少不是显式的）隐藏世界。页面访问者是否选中了复选框或单选按钮？用户是否将鼠标指针悬停在图像上？用户过去是否访问过你的某个链接？某个元素是否是其父元素的第一个子？（如果你不确定我对\
  \ `parent` 和 `child` 术语的意思，请参考第 3 本的第 2 章。）\n\n好了，也许你可以肉眼观察最后一个，但重点是“父元素的第一个子”并不是\
  \ HTML 中的显式内容。尽管这些状态具有隐蔽性，但如果能够针对它们进行样式设置不是很好吗？也许你想在用户鼠标悬停在图像上时临时为其设置样式。也许那个父元素的第一个子是……（等一下，提供的文本似乎有重复或碎片化，重新初始化并聚焦于提供的内容）。\n\
  \n（等一下，提供的文本中间包含一些明显的重复。我将在下方提供完整的处理后的版本。）\n\n\n\n\n\n```css\nelement:pseudo-class\
  \ {\n  property1: value1;\n  property2: value2;\n  …;\n}\n```\n\n例如，以下规则将样式应用于每一个作为父元素第一个子元素的\
  \ `p` 元素：\n\n```css\np:first-child {\n  font-style: italic;\n}\n```\n\n你可以将伪类与其他选择器结合，特别是组合选择器。例如，以下规则将样式应用于每一个作为\
  \ `article` 元素第一个子元素的 `p` 元素：\n\n```css\narticle > p:first-child {\n  font-style:\
  \ italic;\n}\n```\n\n另一种结合伪类和选择器的常用方法是使用类名修改元素名称，如下所示：\n\n```css\nelement.class:pseudo-class\
  \ {\n  property1: value1;\n  property2: value2;\n  …;\n}\n```\n\n例如，以下规则将样式应用于每一个使用了\
  \ `intro` 类且是其父元素第一个子元素的 `p` 元素：\n\n```css\np.intro:first-child {\n  font-style:\
  \ italic;\n}\n```\n\nCSS 提供了几十种伪类。没错，几十种。如果这听起来多得惊人，请不要担心：许多——可能甚至是大多数——伪类都比较冷门，即使是专业人士也偶尔使用一次。在接下来的章节中，我将为你介绍最常用的伪类的细节，并顺带提到其他一些实用的类。\n\
  \n![Remember](img/remember.png) 如果在后面的页面中，示例代码包含了你不熟悉的属性名，在大多数情况下，你可以参考以下章节的解释：\n\
  \n- 对于与内边距（padding）、边框（borders）、外边距（margins）和尺寸（sizes）相关的内容，请查看第 3 卷第 1 章。\n- 对于与颜色和背景相关的内容，请前往第\
  \ 3 卷第 6 章。\n- 对于与文本和对齐相关的内容，请查阅第 3 卷第 7 章。\n\n### 匹配子元素\n\n你在 CSS 代码中最常用的伪类是那些匹配符合某些条件的子元素的类。这与我在章开头提到的子选择器（`>`）有什么区别？子组合选择器针对的是指定父元素的*每一个*子元素。而与元素相关的伪元素提供了一种通过位置定位特定子元素的方法，例如第一个、第三或最后一个子元素。\n\
  \n#### :first-child\n\n`:first-child` 伪类针对任何作为父元素子元素中第一个子元素：\n\n```css\nelement:first-child\
  \ {\n  property1: value1;\n  property2: value2;\n  …;\n}\n```\n\n- `element`：（可选）你想要定位的元素类型名称。如果你省略\
  \ `element`，你的规则将针对页面上所有第一个子元素的元素。\n\n例如，在网页排版中（参考第 3 卷第 7 章），使用 `text-indent` 属性对所有段落进行缩进是很常见的（例如\
  \ `text-indent: 16px`）。这意味着所有的段落除了第一段外，都不应该有缩进。这里有一个使用 `:first-child` 来实现这一点的规则（可以查看本书示例文件中的\
  \ `bk03ch03/example01.html`）：\n\n```css\np:first-child {\n  text-indent: 0;\n}\n\
  ```\n\n![Tip](img/tip.png) 当你单独使用 `:first-child`（即不带元素名称前缀）时，你匹配每一个作为父元素第一个子元素的元素。这与使用通用选择器（`*`）配合伪类相同：`*:first-child`。当你想要使用如下选择器时，这种等性非常有用：\n\
  \n```css\narticle :first-child\n```\n\n这个选择器匹配每一个作为第一个子元素的 `article` 后代。在阅读 CSS\
  \ 时，你或其他人可能会很容易将这个选择器误认为下面这个：\n\n```css\narticle:first-child\n```\n\n这个选择器匹配每一个作为第一个子元素的\
  \ `article` 元素，这完全不同！为了避免此类混淆，你可以通过显式使用通用选择器让你的第一个选择器更易读：\n\n```css\narticle *:first-child\n\
  ```\n\n#### :last-child\n\n`:last-child` 伪类针对任何作为父元素子元素中最后一个子元素：\n\n```css\nelement:last-child\
  \ {\n  property1: value1;\n  property2: value2;\n  …;\n}\n```\n\n- `element`：（可选）你想要定位的元素类型名称。如果你省略\
  \ `element`，你的规则将针对页面上所有最后一个子元素的元素。\n\n例如，一个实用的设计技巧是在标题之前的最后一个段落底部添加一些额外的空白。这里有一个使用\
  \ `:last-child` 为每个 `p` 元素下方设置额外外边距的规则。\n\n#### :nth-child()\n\n`:nth-child()` 伪类根据公式匹配元素。指定\
  \ `n` 有五种主要方式：\n\n- `A`（整数）：匹配第 `A` 个子元素。\n- `even`（关键字）：匹配每一个索引为偶数的子元素。\n- `odd`（关键字）：匹配每一个索引为奇数的子元素。\n\
  - `An`（表达式）：匹配每第 `A` 个子元素。\n- `An+B`（表达式）：从第 `B` 个开始每第 `A` 个子元素。\n\n`:nth-child()`\
  \ 还有你可能觉得有用的第二语法：\n\n```css\n:nth-child(n of list) {\n  property1: value1;\n  property2:\
  \ value2;\n  …;\n}\n```\n\n\n\n\n\n*   `n`: 一个数字、表达式或关键字，用于指定你想要匹配的子元素的位置或多个位置。\n\
  *   `list`: 用逗号分隔的选择器列表。\n\n使用这种语法，`:nth-child(n of list)` 仅对匹配 `list` 中其中一个选择器的子元素匹配表达式\
  \ `n`。例如，以下选择器会匹配那些是 `h1` 或 `h2` 的偶数元素：\n\n```css\n:nth-child(even of h1, h2)\n\
  ```\n\n#### :nth-last-child()\n\n`:nth-last-child()` 伪类根据元素在父元素兄弟节点集合中的位置（从后部计数）选择一个或多个元素。以下是使用的通用语法：\n\
  \n```css\nelement:nth-last-child(n [of list]) {\n  property1: value1;\n  property2:\
  \ value2;\n  …\n}\n```\n\n*   `element`:（可选）你想要定位的元素类型名称。如果省略 `element`，你的规则将针对所有作为倒数第\
  \ n 个元素的元素。\n*   `n`: 一个数字、表达式或关键字，用于指定你想要匹配的子元素的位置或多个位置。你指定 `n` 的方法与我在上一节概述 `:nth-child()`\
  \ 伪类的方法相同。\n*   `list`:（可选）用逗号分隔的选择器列表。\n\n简而言之，`:nth-last-child()` 与 `:nth-child()`\
  \ 相同，但父元素子元素的位置是从最后一个元素开始计数的，最后一个子元素是位置 1，倒数第二个元素是位置 2，依此类推。\n\n#### :only-child\n\
  \n`:only-child` 伪类针对任何作为父元素唯一子元素的元素：\n\n```css\nelement:only-child {\n  property1:\
  \ value1;\n  property2: value2;\n  …\n}\n```\n\n*   `element`:（可选）你想要定位的元素类型名称。如果省略\
  \ `element`，你的规则将针对所有作为唯一子元素的元素。\n\n例如，这里的规则样式化任何作为唯一子元素的 `section` 元素后代（bk03ch03/example05.html）：\n\
  \n```css\nsection *:only-child {\n  color: plum;\n}\n```\n\n#### 按类型匹配子元素\n\n我在上一节中反复谈到的各种与元素相关的伪类，其特点之一是它们在计算父元素子元素的位置时，并不考虑元素的类型。这里有一个值得思考的例子：\n\
  \n```html\n<section>\n  <p>Some paragraph text</p>\n  <aside>Some sidebar text</aside>\n\
  \  <p>More paragraph text</p>\n  <aside>Some sidebar text</aside>\n</section>\n\
  ```\n\n从子元素伪类的角度来看，第一个 `p` 元素位于位置 1，`aside` 元素位于位置 2，第二个 `p` 元素位于位置 3，第二个 `aside`\
  \ 元素位于位置 4。现在考虑以下规则，它为任何作为第一个子元素的 `aside` 元素添加边框：\n\n```css\naside:first-child {\n\
  \  border: 5px double black;\n}\n```\n\n该规则不会应用到示例 HTML 代码上，因为第一个 `aside` 元素并不是\
  \ `section` 元素的第一个子元素。当然，你可以使用 `aside:nth-child(2)`，但如果在该 `aside` 之前添加了一个或多个子元素，该规则就会失效。你在这里真正想要的是一种匹配特定元素类型第一个**实例**的方法。更通用地说，能够通过父元素中属于指定元素类型的子元素子集来按位置匹配元素是非常实用的。例如，在前面的代码中，你可能只想处理\
  \ `p` 元素或仅处理 `aside` 元素。你可以使用与类型相关的伪类来实现。\n\n#### :first-of-type\n\n`:first-of-type`\
  \ 伪类针对父元素子元素中同种类型的中的第一个子元素：\n\n```css\nelement:first-of-type {\n  property1: value1;\n\
  \  property2: value2;\n  …\n}\n```\n\n*   `element`:（可选）你想要定位的元素类型名称。如果省略 `element`，你的规则将针对所有同种类型中的第一个元素。\n\
  \n例如，再次考虑上一节中的这段 HTML 代码段：\n\n```html\n<section>\n  <p>Some paragraph text</p>\n\
  \  <aside>Some sidebar text</aside>\n  <p>More paragraph text</p>\n  <aside>Some\
  \ sidebar text</aside>\n</section>\n```\n\n以下规则成功定位了 `aside` 元素，因为它是该类型类型中的第一个子元素（bk03ch03/example06.html）：\n\
  \n```css\naside:first-of-type {\n  border: 5px double black;\n}\n```\n\n#### :last-of-type\n\
  \n`:last-of-type` 伪类针对父元素中同种类型的最后一个元素：\n\n```css\nelement:last-of-type {\n  property1:\
  \ value1;\n  property2: value2;\n  …\n}\n```\n\n*   `element`:（可选）你想要定位的元素类型名称。如果省略\
  \ `element`，你的规则将针对所有同种类型中的最后一个元素。这里有一个针对最后一个 `p` 元素的示例（bk03ch03/example07.html）：\n\
  \n```css\np:last-of-type {\n  color: red;\n}\n```\n\n#### :nth-of-type\n\n`:nth-of-type`\
  \ 伪类根据元素在同类型兄弟节点中的位置选择一个或多个元素：\n\n```css\nelement:nth-of-type(n) {\n  property1:\
  \ value1;\n  property2: value2;\n  …\n}\n```\n\n*   `element`:（可选）你想要定位的元素类型名称。如果省略\
  \ `element`，你的规则将针对所有同种类型中的第 n 个元素。\n*   `n`: 一个数字、表达式或关键字，用于指定你想要匹配的子元素的位置或多个位置。你指定\
  \ `n` 的方法与我在上一节概述 `:nth-child()` 伪类的方法相同。\n\n#### :nth-last-of-type\n\n`:nth-last-of-type()`\
  \ 伪类根据元素在同类型兄弟节点中的位置（从后计数）选择一个或多个元素：\n\n```css\nelement:nth-last-of-type(n) {\n\
  \  property1: value1;\n  property2: value2;\n  …\n}\n```\n\n*   `element`:（可选）你想要定位的元素类型名称。如果省略\
  \ `element`，你的规则将针对所有同种类型中的倒数第 n 个元素。\n*   `n`: 一个数字、表达式或关键字，用于指定你想要匹配的子元素的位置或多个位置。\n\
  \n#### :only-of-type\n\n`:only-of-type` 伪类针对任何作为父元素中唯一类型元素的元素：\n\n```css\nelement:only-of-type\
  \ {\n  property1: value1;\n  property2: value2;\n  …\n}\n```\n\n*   `element`:（可选）你想要定位的元素类型名称。如果省略\
  \ `element`，你的规则将针对所有作为该类型唯一子元素的元素。\n\n\n\n\n\n*   元素的当前值对于该元素来说是合适的（例如，当元素的 `type`\
  \ 属性设置为 `number` 时，其值为数值），即有效状态；或者是不适的（即无效状态）。\n*   复选框、单选按钮或选择列表选项已勾选（选中状态）。\n\
  *   元素的当前值在元素 `min` 和 `max` 属性指定的范围内（在范围内状态），或在这些范围之外（范围外状态）。\n\n在所有这些情况下，良好的用户界面设计都会根据表单元素的当前状态，对其进行某种方式的样式化。例如，一个禁用的文本框可能有灰色背景和较浅的文本，而具有无效值的元素可能有红色边框和红色文本。\n\
  \n你可以使用针对每状态的各种 CSS 伪类为表单元素的状态设置样式。通用语法如下：\n\n```css\nform-element:state {\n  property1:\
  \ value1;\n  property2: value2;\n  ...\n}\n```\n\n*   `form-element`:（可选）想要针对的表单元素或元素的选择器。如果你省略了\
  \ `element`，则你的规则将针对所有第一个子元素。\n*   `state`: 代表你想要样化的 `form-element` 状态的伪类。\n\n例如，以下规则使用\
  \ `:disabled` 伪类来针对任何文本框的禁用状态：\n\n```css\ninput[type=\"text\"]:disabled {\n  background-color:\
  \ lightgray;\n  color: darkgray;\n}\n```\n\n[表 3-1] 列出了最常用的、允许你针对表单元素状态的伪元素。\n\n\
  | 伪类 | 匹配内容 | 示例 |\n| --- | --- | --- |\n| `:checked` | 任何已选中的复选框、单选按钮或选择列表选项（bk03ch03/example11.html）。\
  \ | `input[type=\"checkbox\"]:checked {box-shadow: 0 0 10px 3px red;}`-`input[type=\"\
  checkbox\"]:checked + label {color: red;}` |\n| `:default` | 任何处于默认状态的表单元素，包括带有\
  \ `checked` 属性的复选框或单选按钮、带有 `selected` 属性的选择列表选项，或 `type` 属性设置为 `submit` 的按钮元素（bk03ch03/example12.html）。\
  \ | `input[type=\"radio\"]:default {box-shadow: 0 0 5px 1px forestgreen;}`-`input[type=\"\
  radio\"]:default + label {color: forestgreen;}` |\n| `:disabled` | 任何设置了 `disabled`\
  \ 属性的表单元素（bk03ch03/example13.html）。 | `button:disabled {cursor: not-allowed;opacity:\
  \ .5;}` |\n| `:enabled` | 任何未设置 `disabled` 属性的表单元素（bk03ch03/example14.html）。 | `button:enabled\
  \ {box-shadow: 0 0 5px 3px seagreen;color: seagreen;}` |\n| `:in-range` | 任何当前值在元素\
  \ `min` 和 `max` 属性设置范围内的表单元素（bk03ch03/example15.html）。 | `input[type=\"range\"]:in-range\
  \ {background-color: lawngreen;}` |\n| `:invalid` | 任何当前值无法通过验证的表单元素，例如带有文本值的 `number`\
  \ 字段或带有无效电子邮件地址的 `email` 字段（例如缺少 `@` 符号）（bk03ch03/example16.html）。 | `input[type=\"\
  email\"]:invalid {background: lavenderblush;}` |\n| `:optional` | 任何未设置 `required`\
  \ 属性的表单元素（bk03ch03/example17.html）。 | `input[type=\"text\"]:optional {background-color:\
  \ lightgoldenrodyellow;}` |\n| `:out-of-range` | 任何当前值不在元素 `min` 和 `max` 属性设置范围内的表单元素（bk03ch03/example18.html）。\
  \ | `input[type=\"range\"]:out-of-range {background-color: tomato;}` |\n| `:read-only`\
  \ | 任何设置了 `readonly` 属性的表单元素（bk03ch03/example19.html）。 | `textarea:read-only {border:\
  \ 0;resize: none;}` |\n| `:read-write` | 用户可以编辑的任何元素。 | `span:read-write {background:\
  \ honeew;color: crimson;}` |\n| `:required` | 任何带有 `required` 属性的表单元素。 | `input[type=\"\
  text\"]:required {background: yellow;}` |\n| `:valid` | 任何当前值通过验证的表单元素。 | `input[type=\"\
  email\"]:valid {background: palegreen;}` |\n\n\n\n\n\n![Tip](img/tip.png) 要匹配本身具有焦点或其后代元素具有焦点的元素（例如，包含后代\
  \ `input` 元素的 `fieldset` 元素），请使用 `:focus-within` 伪类而不是 `:focus`。但请注意，`:focus-within`\
  \ 是一个较新的伪类，因此不支持 Internet Explorer 11 等旧版浏览器。\n\n### :hover\n\n要在用户将鼠标悬停在元素上时对该元素设置样式，请使用\
  \ `:hover` 伪类：\n\n```css\nelement:hover {\n  property1: value1;\n  property2: value2;\n\
  \  …\n}\n```\n\n*   `element`：（可选）你希望在鼠标悬停时想要的目标元素。如果你省略 `element`，则你的规则将针对任何被悬停的元素。\n\
  \n这是一个示例，用于在用户悬停在按钮元素上时添加框阴影（bk03ch03/example25.html）：\n\n```css\nbutton:hover {\n\
  \  box-shadow: 10px 5px 5px grey;\n}\n```\n\n![Warning](img/warning.png) 不要依赖 `:hover`\
  \ 伪类来进行关键样式，因为你的许多网站访问者可能在使用触摸屏、屏幕阅读器或其他无法进行悬停操作的设备。\n\n### 匹配链接\n\nCSS 提供了几种链接相关的伪类，你可以使用它们为设置样式，而无需求助于复杂的类。首先，在开始尝试设置链接样式之前，你需要了解以下一些概念：\n\
  \n*   **链接元素 (Link element)：** 指任何具有 `href` 属性的元素，特别是 `a` 元素，也包括 `area` 元素。\n* \
  \  **访问过的元素 (Visited element)：** 指用户已经访问过的网页的链接元素。出于隐私考虑，所有网络浏览器仅允许你对访问过的链接使用一小部分\
  \ CSS 属性：`color`、`background-color`、`border-color`、`border-bottom-color`、`border-left-color`、`border-right-color`、`border-top-color`、`column-rule-color`、`outline-color`、`text-decoration-color`\
  \ 和 `text-emphasis-color`。\n*   **目标 (Target)：** 当用户访问页面锚点时（参见第 2 卷，第 2 章），锚点标签的\
  \ `id` 属性会被附加到 URL 上，前面带有井号 (`#`)）。例如，这里有一个锚点 `id` 为 `section1` 的 `section` 元素：\n\
  \n```html\n<section id=\"section1\">\n```\n\n当用户点击链接访问此锚点时，URL 将尾添加 `#section1`，如下：\n\
  \n`https://www.mysite.com/chapter57.html#section1`\n\n页面锚点——此示例中的 `<section>` 标签——被称为目标，添加到地址中的部分被称为\
  \ *URL 碎片 (URL fragment)*。\n\n表 3-2 列出了四个主要的链接相关伪类。\n\n| 伪类 | 匹配内容 | 示例 |\n| ---\
  \ | --- | --- |\n| `:any-link` | 任何链接元素 (bk03ch03/example26.html) | `aside a:any-link\
  \ { text-decoration-color: mediumvioletred; text-decoration-style: wavy; }` |\n\
  | `:link` | 用户尚未访问过的任何链接元素 (bk03ch03/example27.html) | `a:link { color: red; text-decoration-color:\
  \ red; }` |\n| `:target` | `id` 属性值匹配当前 URL 碎片的元素 (bk03ch03/example28.html) | `button:target\
  \ { cursor: not-allowed; opacity: .5; }` |\n| `:visited` | 用户已经访问过的任何链接元素 (bk03ch03/example29.html)\
  \ | `a:visited { color: pink; text-decoration-color: pink; }` |\n\n*旧版网络浏览器（如 Internet\
  \ Explorer 11）不支持伪类。*\n\n表 3-2 链接相关伪类\n\n![Warning](img/warning.png) 在用户点击你的任何一个链接后，网络浏览器会认为该链接已“访问”，且该状态永远不会改变。换句话说，当用户点击你的任何一个链接时，你的\
  \ `:visited` 伪类规则将始终生效。如果你的样式表中 `:visited` 伪类规则出现在你的 `:active` 和 `:hover` 伪类规则之后，这种情况可能会搞乱你的样式。一个常用的经验是按照以下顺序添加链接相关规则：`:link`、`:visited`、`:hover`、`:active`。\n\
  \n### 使用函数伪类\n\n随着你的 Web 项目不断增长以及你对选择器的操作变得复杂，你可能会开始怀疑 CSS 是否提供了任何简写方法来简化你的某些选择器工作。是的，提供的！CSS\
  \ 提供了几种简写方法可以简化你的某些选择器工作。\n\n#### 快速查看选择器列表\n\n选择器列表是一个用逗号分隔的选择器集合。例如，考虑以下内容：\n\n\
  ```css\nh1 {\n  margin: 20px;\n}\nh2 {\n  margin: 20px;\n}\nh3 {\n  margin: 20px;\n\
  }\n```\n\n选择器列表的巨大好处之一是你可以将它们合并为一个声明：\n\n```css\nh1, h2, h3 {\n  margin: 20px;\n\
  }\n```\n\n#### :is()\n\n`:is()` 伪类被称为 *匹配任意 (matches-any)*，因为它匹配列表中的任何一个选择器。其语法如下：\n\
  \n```css\nelement:is(selector-list) {\n  property1: value1;\n  property2: value2;\n\
  \  …\n}\n```\n\n*   `element`：（可选）你希望通过选择器列表定位的元素。如果你省略 `element`，则你的规则将针对任何匹配选择器列表的元素。\n\
  *   `selector-list`：用逗号分隔的选择器列表。\n\n在不带 `element` 参数使用时，`:is()` 针对匹配列表中至少一个项的任何元素。这是一个示例（bk03ch03/example30）：\n\
  \n```css\n:is(h1, h2, h3) {\n  margin: 20px 16px;\n}\n```\n\n该规则适用于任何 `h1`、`h2`\
  \ 或 `h3` 元素。\n\n当带有 `element` 参数使用时，`:is()` 针对匹配列表中至少一个项的任何 `element` 类型元素。这是一个示例：\n\
  \n```css\np:is(:first-child, :last-child, :only-child) {\n  margin: 24px;\n}\n```\n\
  \n该规则匹配任何作为第一个元素、最后一个元素或唯一元素的 `p` 元素。\n\n![Remember](img/remember.png) `:is()` 伪类使用容错的选择器列表，即使一个或多个选择器无效，浏览器也会处理剩余部分。\n\
  \n![Warning](img/warning.png) `:is()` 函数伪类是新的，因此不支持 Internet Explorer 11 等旧浏览器。\n\
  \n### :not()\n\n`:not()` 函数伪类被称为 *匹配无 (matches-none)*，因为它针对不匹配列表中任何选择器的元素。其语法如下：\n\
  \n```css\nelement:not(selector-list) {\n  property1: value1;\n  property2: value2;\n\
  \  …\n}\n```\n\n*   `element`：（可选）你希望通过选择器列表定位的元素。如果你省略 `element`，则你的规则将针对列表中列表中匹配项。\n\
  *   `selector-list`：用逗号分隔的选择器列表。\n\n在不带 `element` 参数使用时，`:not()` 针对不匹配列表中任何项的任何元素。这是一个示例（bk03ch03/example31）：\n\
  \n```css\n:not(.decorative) {\n}\n```\n\n\n\n\n\n```css\nfont-family: Georgia, serif;\n\
  }\n```\n\n该规则将 `font-family` 样式应用于任何不使用 `decorative` 类的元素。\n\n![Warning](img/warning.png)\
  \ 在不带带 `element` 参数的情况下使用 `:not()` 时，你需要格外小心，因为你可能会撒下一个范围非常广的样式网，捕获许多非预期的元素（例如 `html`\
  \ 或 `body` 元素）。\n\n当与 `element` 参数配合使用时，`:not()` 针对不匹配选择器列表中任何项的任何 `element` 类型元素。这是一个示例：\n\
  \n```css\np:not(:first-child, :last-child, :only-child) {\n  margin: 24px;\n}\n\
  ```\n\n该规则匹配任何不是第一个子元素、最后一个子元素或唯一子元素的 `p` 元素。\n\n![Tip](img/tip.png) 在本书的第 6 章 中，我提到过在你的每个\
  \ `<<img>>` 标签中不包含 `alt` 属性会使你的页面不仅无效，而且降低可访问性。然而，在激烈的编码战斗中，很容易忘记那些 `alt` 属性。当我处于自己页面的开发阶段时，我会在\
  \ CSS 中包含以下规则，让没有 `alt` 的图片脱颖而出：\n\n```css\nimg:not(img[alt]) {\n  outline: 3px\
  \ solid red;\n}\n```\n\n此规则针对没有 `alt` 属性的 `img` 元素并用红色轮廓将其包围。\n\n![Remember](img/remember.png)\
  \ `:not()` 伪类使用不严格的选择器列表，因此如果一个或多个选择器无效或不支持，浏览器将丢弃整个规则。\n\n#### :where()\n\n`:where()`\
  \ 伪类匹配指定选择器列表中的任何选择器。其语法如下：\n\n```css\nelement:where(selector-list) {\n  property1:\
  \ value1;\n  property2: value2;\n  …\n}\n```\n\n* `element`:（可选）你想要用选择器列表定位的元素。如果你省略\
  \ `element`，则你的规则将针对所有第一个子元素的元素。\n* `elector-list`: 逗号分隔的选择器列表。\n\n等一下，我听到你说，这和\
  \ `:is()` 功能伪类完全一样！这到底是怎么回事呢？\n\n首先，眼光不错！其次，CSS 拥有两个看起来完全相同的功能伪类，原因是非常技术性的，在你读完第\
  \ 3 本的第 4 章` 和 `:where()` 是相同的，但有例外：\n\n* 分配给 `:is()` 伪类的优先级是其选择器列表中选择器的最高优先级。\n\
  * 分配给 `:where()` 伪类的优先级始终为 0。\n\n要了解为什么这很重要，请参阅第 3 本第 4 章 `:where()` 伪类使用宽松的选择器列表，因此即使一个或多个选择器无效或不支持，浏览器仍然会处理剩余的选择器。\n\
  \n#### :has()\n\n如果你从 CSS 在 20 世纪 90 年代末出现以来每年对 CSS 开发者进行调查，并问每个开发者最希望实现哪个缺失的功能，那么每年的顶级答案无疑都是“父级选择器”。也就是说，给定一个元素、一个类或其他选择器，哪个元素是该选择器的父级（或祖先）？\n\
  \n这看起来是如此有用且显而易见，以至于大多数初学 CSS 的人发现 CSS 中竟然没有所谓的“父级选择器”。也就是说，直到全新的 `:has()` 功能伪类的出现。`:has()`\
  \ 伪类实际上设计用于执行以下几件事：\n\n* 匹配任何作为子元素选择器列表中任何项的父元素。换句话说，你会说：“匹配一个在列表中*有*子元素的父元素”。\n\
  * 匹配任何作为后代元素选择器列表中任何项的祖先元素。换句话说，你会说：“匹配一个在列表中*有*后代的祖先元素”。\n* 匹配任何作为兄弟元素选择器列表中任何项的前一个兄弟的元素。换句话说，你会说：“匹配一个在列表中*有*后一个兄弟的兄弟元素”。\n\
  * 匹配任何作为兄弟元素选择器列表中任何项的更早兄弟的元素。换句话说，你会说：“匹配一个在列表中*有*后一个兄弟的兄弟元素”。\n\n这是 `:has()` 的语法：\n\
  \n```css\nelement:has(relative-selector-list) {\n  property1: value1;\n  property2:\
  \ value2;\n  …\n}\n```\n\n* `element`:（可选）你想要用选择器列表定位的父元素、祖先或兄弟元素。如果你省略 `element`，则你的规则将针对选择器列表中包含内容的父元素、祖先或兄弟元素。\n\
  * `relative-selector-list`: 逗号分隔的项列表，每项都是`相对选择器`，它由一个组合运算符（参见第 3 本第 2 章）后跟一个选择器。\n\
  \n相对选择器的用法如下：\n\n* **父级**：相对选择器是子元素组合器（`>`）后跟一个匹配你相对于父级的元素的类型的选择器。例如，`> p` 匹配那些\
  \ `p` 元素。为了匹配相对于 `aside` 元素的那些 `p` 元素，你会使用 `aside:has(> p)`。\n\n```css\naside:has(>\
  \ p) {\n  border: 1px solid black;\n}\n```\n\n* **祖先**：相对选择器是后代组合器（空格）后跟一个匹配你相对于祖先元素的类型的选择器。例如，空格匹配任何后代\
  \ `div` 元素。为了匹配相对于 `article` 元素的那些 `div` 元素，你会使用 `article:has(div)`。\n\n```css\n\
  article:has(div) {\n  margin-top: 20px;\n}\n```\n\n* **前一个兄弟**：相对选择器是相邻兄弟组合器（`+`）后跟一个匹配你相对于前一个兄弟元素的类型的选择器。例如，`+\
  \ h2` 匹配那些相邻的 `h2` 元素。为了匹配相对于 `h1` 元素的那些 `h2` 元素，你会使用 `h1:has(+ h2)`。\n\n```css\n\
  h1:has(+ h2) {\n  margin-bottom: 24px;\n}\n```\n\n* **后一个兄弟**：相对选择器是后续兄弟组合器（`~`）后跟一个一个匹配你相对于更早兄弟元素的类型的选择器。例如，`~\
  \ blockquote` 匹配那些后续的 `blockquote` 元素。为了匹配相对于 `h3` 元素的那些 `blockquote` 元素，你会使用 `h3:has(~\
  \ blockquote)`。\n\n```css\nh3:has(~ blockquote) {\n  font-style: italic;\n}\n```\n\
  \n这些示例每个都使用单个相对选择器，但你可以使用包含两个或多个相对选择器的列表。\n\n\n\n\n\n![Remember](img/remember.png)\
  \ 在我写这段文字时，`:has()` 伪类尚未被所有主流浏览器实现。然而，整体支持率正在迅速增长，所以当你读到此内容时，`:has()` 应该在每个现代浏览器中都得到了良好的支持。要关注当前的支持情况，请使用以下\
  \ Can I Use 页面：[`https://caniuse.com/css-has`](https://caniuse.com/css-has)。不言而喻，旧版浏览器（如\
  \ `Internet Explorer 11`）并未实现 `:has()`，所以如果你需要支持这些古老的浏览器，请不要使用 `:has()`。\n\n## 快速上手伪元素\n\
  \n### 引言\n\n随着你 CSS 职业的发展，迟早或晚（几乎总是更早），你将会遇到两个自从第一天起就困扰网页设计者的难题：\n\n*   我该如何根据元素的当前状态动态插入并样式化内容？\n\
  *   我该如何对元素的特定部分（例如它的第一行）进行样式化？\n\n这两个问题的共同点是，你想要对并非原始页面 HTML 部分进行样式化。在第一种情况下，你想添加新内容；在第二种情况下，你想对一个没有\
  \ HTML 等效对应物进行样式化。换句话说，你想要处理的是并非真正元素的页面项，它们在 CSS 世界中被称为*伪元素*（pseudo-elements）。\n\
  \n### 使用伪元素\n\n所有的伪元素都以两个冒号（`::`）开头，后跟着一个关键字。以下是通用语法：\n\n```css\nelement::pseudo-element\
  \ {\n  property1: value1;\n  property2: value2;\n  ...\n}\n```\n\n*   `element`:\
  \ 你想要目标的元素类型名称\n*   `pseudo-element`: 伪元素的名称\n\n在接后的章节中，我将讨论 `::after` 和 `::before`，你用它们动态添加内容——即*生成内容*（generated\
  \ content）；以及 `::first-letter` 和 `::first-line`，你用它们来对元素的片段进行样式化。\n\n### 使用 ::after\
  \ 生成最后一个元素\n\n你可以使用 `::after` 伪元素为目标元素生成新内容。虽然“after”（之后）一词意味着生成的内容被插入在目标元素之后（如果是这样，那么新元素将成为目标元素的下一个兄弟元素），但事实并非如此。相反，“after”在这里是指“在目标元素的所有现有子元素之后”。也就是说，你使用\
  \ `::after` 为某些目标父元素生成一个新的最后一个子元素。\n\n以下是使用的语法：\n\n```css\nparent::after {\n  content:\
  \ 'content';\n  property1: value1;\n  property2: value2;\n  ...\n}\n```\n\n*   `parent`:\
  \ 你想要在其生成一个新的最后一个子元素的父元素。\n*   `content`: 你希望出现在生成的最后一个元素中的内容。如果你不希望新的最后一个子元素中包含任何内容，请将\
  \ `content` 属性设置为空字符串（`''` 或 `\"\"`）。\n\n`::after` 伪元素的一个常见用例是使用特殊图标指示外部链接（即指向站点外页面的链接）。当然，你可以手动在每个外部链接后插入图标的\
  \ `img` 元素，但当链接超过几个处时，这可不是什么乐事。既然 CSS 乐意为你完成所有工作工作（bk03ch03/example33.html），就没必要费那个劲：\n\
  \n```css\na[href^='http']::after {\n  content: url(images/Icon_External_Link.png);\n\
  \  padding-left: 2px;\n}\n```\n\n这里的父元素是所有 `href` 属性以 `http` 开头的 `a` 元素，这适用于所有的外部链接。对于\
  \ `::after` 生成的内容，`content` 属性是图像的本地地址（`images/Icon_External_Link.png`）。（参阅第三册第\
  \ 6 章 了解更多关于 CSS `url()` 函数的信息。）该规则还使用 `padding-left: 2px` 在链接文本结束与图像之间产生一点空间。图\
  \ 3-2 显示了添加到几个外部链接上的图标。\n\n![使用 ::after 伪元素在外部链接后生成图标的截图](img/9781394164684-fg030302.png)\n\
  \n图 3-2： 使用 `::after` 伪元素在外部链接后生成图标。\n\n对于不能作为父元素的元素，另一种实用技术是在元素后添加一个空的 `<span></span>`\
  \ 标签，并使用该 `span` 元素创建生成内容。这里有两个 `input` 元素的示例，第一个是 `text` 字段，第二个是 `email` 字段（bk03ch03/example33.html）：\n\
  \n```html\n<input type=\"text\"><span></span>\n<input type=\"email\"><span></span>\n\
  ```\n\n（注：原文中包含一些重叠/乱码片段，已根据逻辑流进行了清理。）\n\n### 使用 ::before 生成第一个元素\n\n你可以使用 `::before`\
  \ 伪元素为目标元素生成新内容。在这里，“before”（之前）是指“在目标元素的所有现有子元素之前”。也就是说，你使用 `::before` 为某些目标父元素生成一个新的第一个子元素。\n\
  \n是使用的语法：\n\n```css\nparent::before {\n  content: 'content';\n  property1: value1;\n\
  \  property2: value2;\n  ...\n}\n```\n\n*   `parent`: 你想要在其生成一个新的第一个子元素的父元素。\n*\
  \   `content`: 你希望出现在生成的最后一个元素中的内容。如果你不希望新的最后一个元素中包含任何内容，请将 `content` 属性设置为空字符串（`''`\
  \ 或 `\"\"`）。\n\n这里有一个示例（bk03ch03/example34.html）：\n\n```html\n<aside class=\"tip\"\
  >\n  由 :::before 伪元素生成的内容是内行的，因此它会随着周围元素流动。如果你希望让生成的内容成为块级元素（例如，以便你样式化伪元素的宽度和/或高度），请在伪元素的声明块中添加\
  \ `display: block` 或 `display: inline-block`。\n</aside>\n```\n\n```css\n.tip::before\
  \ {\n  content: 'TIP';\n  display: block;\n  color: green;\n  font-size: 12px;\n\
  }\n```\n\n\n\n\n该 CSS 规则使用 `::before` 将文本 `TIP` 作为一个块级元素添加，它是任何使用 `tip` 类的元素的第一个子元素。图\
  \ 3-4 显示了该示例的运行效果。\n\n![使用 ::before 伪元素生成内容的截图](img/9781394164684-fg030304.png)\n\
  \n图 3-4： 使用 `::before` 伪元素生成内容。\n\n![警告](img/warning.png) 许多辅助技术无法读取或处理由 `::before`\
  \ 生成的内容，因此不要使用 `::before` 添加核心内容。\n\n#### 使用 ::first-letter 样式化首字母字母\n\n一种常见的设计范式是提取文章或其他长文本开头段落的首字母，并对该字母进行某种样式化处理，通常使用比正文字体更大且/或颜色不同的字体。\n\
  \n是的，你可以将字母包裹在 `span` 元素中并对该元素进行样式化，但 CSS 提供了一种更直接、更易于维护的途径：`::first-letter` 伪元素，它针对指定块级元素的第一个字母。其语法如下：\n\
  \n```\nelement::first-letter {\n  property1: value1;\n  property2: value2;\n  …\n\
  }\n```\n\n*   `element`: 一个选择器，指定包含你想要样式化的首字母的元素。\n\n这是一个示例 (bk03ch03/example35.html)：\n\
  \nHTML:\n```html\n<article>\n  <h2>青少年的词汇量缩减到只有一个单词</h2>\n  <p>当地青少年 Dylan Geronimo\
  \ 现在只用 \"whatever\" 一词与他的父母和老师交流。通过微妙的语气变化，Geronimo 先生可以传达他全范围的情绪：阴沉、厌恶、挫败以及一种内心翻腾的、无名的愤怒。</p>\n\
  \  …\n</article>\n```\n\nCSS:\n```css\nh2 + p::first-letter {\n  color: crimson;\n\
  \  font-size: 32px;\n}\n```\n\n该 CSS 规则针对任何作为 `h2` 元素相邻兄弟的 `p` 元素的首字母。声明块使用颜色和字体大小对字母进行样式化。图\
  \ 3-5 显示了结果。\n\n![使用 ::first-letter 伪元素样式化段落首字母的截图](img/9781394164684-fg030305.png)\n\
  \n图 3-5： 使用 `::first-letter` 伪元素样式化段落的首字母。\n\n![记住](img/remember.png) 并不是所有的 CSS\
  \ 属性都适用于你的 `::first-letter` 声明块。你可以使用所有可用 padding、border、margin、background、font\
  \ 和 text decoration 属性，`color` 属性以及 `float` 属性。\n\n#### 使用 ::first-line 样式化首行\n\n\
  在更复杂的文本设计中，散文的第一行通常会进行某种样式化处理，例如使用斜体或大写字母。（当第一行以样式化的首字母开始，如落体字 drop cap 或悬升字母 raised\
  \ cap 时，这类样式特别常见；请参见上一节。）\n\n但你可能会问，考虑到各种迥然不同的屏幕尺寸、显示方向和默认字体大小，如何可能预先知道文本的第一“行”会是什么？简短的答案是：“你不能。”稍长一点的答案是：“你不能，也不需要这样做，因为你可以使用\
  \ `::first-line` 伪元素来帮你解决。”\n\n`::first-line` 伪元素对指定块元素中的第一行进行样式化，无论该行由于显示宽度、页面宽度、字体大小以及所有影响网页行长度的因素有多长多短。其语法如下：\n\
  \n```\nelement::first-line {\n  property1: value1;\n  property2: value2;\n  …\n\
  }\n```\n\n*   `element`: 一个选择器，指定包含你想要样式化的第一行的元素。\n\n这是一个示例 (bk03ch03/example36.html)：\n\
  \nHTML:\n```html\n<article>\n  <h2>青少年的词汇量缩减到只有一个单词</h2>\n  <p>当地青少年 Dylan Geronimo\
  \ 现在只用 \"whatever\" 一词与他的父母和老师交流。通过微妙的语气变化，Geronimo 先生可以传达他全范围的情绪：阴沉、厌恶、挫败以及一种内心翻腾的、无名的愤怒。</p>\n\
  \  …\n</article>\n```\n\nCSS:\n```css\nh2 + p::first-line {\n  text-transform: uppercase;\n\
  }\n```\n\n该 CSS 规则针对任何作为 `h2` 元素相邻兄弟的 `p` 元素的第一行。声明块使用颜色和字体大小对该行进行样式化。\n\n\n\n\n\
  \n如有需要，你可以自由地将注释扩展到多行：\n\n```css\n/* 这是注释的第一行\n以及这是第二行。 */\n```\n\n#### 为不那么显而易见的代码添加注释\n\
  \n每当你编写某些 CSS 且其代码的作用并不十分直观时，请直接在规则上方添加注释，如代码所示：\n\n```css\n/* 为没有 alt 属性的图像添加红色轮廓\
  \ */\nimg:not(img[alt]) {\n  outline: 3px solid red;\n}\n```\n\n现在，当其他人审查你的代码，或者你稍后回来查看代码时，这些\
  \ CSS 将变得易理解得多。你还可以在声明块内部插入注释：\n\n```css\ndiv {\n  /*为不支持渐变的浏览器设置背景颜色 */\n  background-color:\
  \ white;\n  background-image: linear-gradient(to bottom, white 0%, crimson 100%);\n\
  }\n```\n\n#### 使用注释标记样式表章节\n\n驯服大型且混乱的样式表的方法是将代码组织成一组组相关的规则。你划分的章节将取决于你的页面以及你用于其样化的\
  \ CSS，但对于大多数网站，采用如下组织方式是合适的：\n\n* 通用或全局样式\n* 字体样式\n* 布局样式\n* 排版样式\n* 针对特定网站功能的样式\n\
  \n为了清楚一个章节的结束和另一个的开始，请使用多行注释来标记每个章节的开头：\n\n```css\n/*==========================**\n\
  通用样式\n**********************************\n通用规则在此处\n\n/*==========================**\n\
  字体样式\n**********************************\n字体规则在此处\n\n/*==========================**\n\
  布局样式\n**********************************\n布局规则在此处\n等等。\n*/\n```\n\n### 使用 CSS 重置\
  \ (CSS Reset)\n\n所有的网络浏览器都内置了一套被称为`用户代理样式表`（user agent stylesheet）的内部样式。我稍后会详细介绍这种样式表（请参阅“打开引擎盖：样式是如何应用的””），但目前只需要知道这些样式是浏览器应用于页面上发现的\
  \ HTML 元素的默认样式就足够了。换句话说，即使你没有定义任何 CSS 规则，得益于浏览器定义的外边距（margins）、内边距（padding）和其他样式，你的页面元素看起来依然还可以（尽管有点无聊）。\n\
  \n多年来，这些浏览器样式表一直是各地 CSS 开发者最头疼的难题源之一。为什么呢？原因有很多，但有两个尤为突出：\n\n* 某些浏览器（Internet Explorer，请举手！）在某些默认样式上做出了非常奇怪的选择。\n\
  * 不同浏览器之间的默认样式之间往往存在明显的不一致，这意味着页面看起来可能会根据所使用的浏览器不同而产生显著差异。\n\n最后，几位 CSS 大师认为受够了，并提出了`CSS\
  \ 重置`（CSS reset）的想法。这种重置（通常情况下）是一个外部 CSS 文件，其中包含了旨在解决上述问题的规则：\n\n* 重置包含了规则，这些规则会覆盖开发者认为的某些浏览器所做出的糟糕样式选择。\n\
  * 重置包含了规则，通过覆盖某些默认浏览器样式，强制要求浏览器之间具有更高的一致性。\n\n这些重置通常被描述为“带有主观色彩”（opinionated），因为创建者的选择是主观的。尽管如此，大多数\
  \ CSS 编码员都拥抱了重置，全球的样式表因此恢复了秩序。\n\n如今，情况已没那么糟糕了，因为那些有问题的旧浏览器（Internet Explorer，请再次举手！）要么已经消失，要么市场份额已经小到几乎无法衡量，而且现代浏览器在定义其默认样式方面要一致得得多。而且，在任何情况下，现代方法是认为：如果不同浏览器渲染页面的方式存在细微差异，也是没关系的。毕竟，用户不会用\
  \ Chrome 浏览你的网站，然后说：“让我们看看这小小家伙在 Safari 里长什么样！”\n\n结论是，如今你可能不需要 CSS 重置也能应付。为什么是“可能”呢？因为虽然浏览器的默认设置现在好多了，但它们并不完美。仍然存在足够的不一致和奇怪的样式选择，因此建议使用\
  \ CSS 重置。\n\n好了，是哪一个呢？因为世界上似乎有几十种 CSS 重置。幸运的是，这并不是一个难回答的问题，因为有一种 CSS 重置到目前为止是最流行的，并且被广泛认为在修复问题和保留有用默认样式之间取得了最好的平衡。而且，它的大小仅为\
  \ 6KB，足够小，不会减慢你的页面加载。那个重置被称为 `Normalize.css`，你可以在这里下载：\n\n[`https://necolas.github.io/normalize.css/latest/normalize.css`](https://necolas.github.io/normalize.css/latest/normalize.css)\n\
  \n下载文件后，将其移动到你网络项目的 CSS 文件夹中，然后向页面的 `<head>` 部分在任何其他样式表 `<link>` 标签*之前*以及 `<style>`\
  \ 标签之前（如果有的话）添加一个 `<link>` 标签。例如，如果你将 `normalize.css` 存储在与 HTML 文件相同文件夹下的 `css`\
  \ 子文件夹中，你的 `<link>` 标签将如下所示：\n\n```html\n<link rel=\"stylesheet\" href=\"css/normalize.css\"\
  >\n```\n\n![记住](img/remember.png) 为什么我强调你应该将 Normalize.css 的 `<link>` 标签放在 `<head>`\
  \ 部分中任何其他 CSS 内容之前？因为浏览器按顺序处理 CSS，从它找到的第一个开始。通过将你的 Normalize.css `<link>` 标签放在任何其他内容之前，你确保了浏览器首先执行重置，这恰好是你想要的。\n\
  \n![提示](img/tip.png) Normalize.css 的伟大特性之一是代码中随处充满了注释，解释了每个样式规则的设计意图。在文本编辑器中打开该文件并进行研究，以了解重置的作用。\n\
  \n### 调试 CSS\n\nCSS 是很棒的。只需几条规则，你就能将一个枯燥、死死的页面变成一件艺术品，让访问者求之无厌。但 CSS 也会让人非常抓狂。你向\
  \ CSS 中添加了一个看起来很直接的规则，保存工作，刷新浏览器然后……什么都没有变化！或者也许发生了变化，但不是以你预期的方式发生。开始想象脑子里冒出蒸汽的卡通画面吧。在此，我想说，尽管这类挫败感是\
  \ CSS 社区中的传奇，但它们并不意味着正如某些人所说的，CSS 是“不符合逻辑的”、“愚蠢的”或“坏的”。有一群非常专注且非常聪明的人创建了 CSS 标准，相信我，这些人清楚自己在做什么。这可能是一个难以接受的的事实，但事实是，如果你的\
  \ CSS 表现得不符合逻辑、愚蠢或坏掉，说明是你的代码有问题，而不是 CSS 本身。\n\n\n\n\n大多数网页开发者都使用 Google Chrome 调试\
  \ CSS，因此在本节中我将重点关注该浏览器。但以下是在不仅 Chrome 中，而且在各种版本的 Firefox、Microsoft Edge 和 Safari\
  \ 中打开网页开发工具的方法：\n\n* **Windows 版 Chrome：** 点击 `Customize and Control Google Chrome`（地址栏右侧的三个垂直点），然后选择\
  \ `More Tools`  ⇒  `Developer Tools`。快捷键：`Ctrl+Shift+I`。\n\n* **Mac 版 Chrome：**\
  \ 选择 `View`  ⇒ `Developer`  ⇒ `Developer Tools`。快捷键：`Option+⌘+I`。![我将调试的网页示意图](img/9781394164684-fg030401.png)\n\
  \    图 4-1： 我将调试的网页。\n\n* **Windows 版 Firefox：** 点击 `Open Application Menu`（工具栏右侧的三条横线），然后选择\
  \ `More Tools`  ⇒ `Web Developer Tools`。快捷键：`Ctrl+Shift+I`。\n\n* **Mac 版 Firefox：**\
  \ 选择 `Tools`  ⇒ `Browser Tools`  ⇒ `Web Developer Tools`。快捷键：`Option+⌘+I`。\n\n*\
  \ **Microsoft Edge：** 点击 `Settings and More`（地址栏右侧的三个垂直点），然后选择 `More Tools`  ⇒ `Developer\
  \ Tools`。快捷键：`Ctrl+Shift+I`。\n\n* **Safari：** 选择 `Develop`  ⇒ `Show Web Inspector`。快捷键：`Option+⌘+I`。如果没有看到\
  \ `Develop` 菜单，选择 `Safari`  ⇒ `Settings`，点击 `Advanced` 标签页，然后勾选 `Show Develop Menu\
  \ in Menu Bar` 复选框。\n\n![提示](img/tip.png) ![image](img/9781394164684-ma009.png)\
  \ 在所有浏览器开发工具中，你都可以配置面板相对于浏览器窗口出现的位置。在 Chrome 中，点击 `Customize` 图标（如页边所示），然后点击 `Dock\
  \ to Right`、`Dock to Bottom` 或 `Dock to Left`，如图 4-2 所示。如果你喜欢可以移动的浮动面板，点击 `Undock`。\n\
  \n![选择开发工具面板在浏览器窗口中出现位置的示意图](img/9781394164684-fg030402.png)\n\n图 4-2： 选择开发工具面板在浏览器窗口中出现的位置。\n\
  \n#### 检查元素\n\n如果页面上的元素看起来不对或以其他方式出现了异常，最基本的 CSS 调试技术是检查网页浏览器如何解释你的 CSS 代码。这被称为*检查*（inspect）元素。\n\
  \n要开始对网页上的任何元素进行检查，可以使用以下技术：\n\n* 如果你还没有打开浏览器的网页开发工具，右键点击该元素，然后点击 `Inspect`（在 Safari\
  \ 中为 `Inspect Element`）。这会打开浏览器的开发工具，显示 `Elements` 标签页（在 Firefox 中称为 `Inspector`），并突出显示元素的\
  \ HTML。\n\n* 如果你浏览器的网页开发工具已经打开，点击 `Elements` 标签页（Firefox 中的 `Inspector` 标签页），然后点击你想要检查的元素标签。\n\
  \n* ![image](img/9781394164684-ma010.png)如果网页开发工具已经打开，点击 `Select an Element` 图标（如页边所示）；然后点击渲染页面上的元素。\n\
  \n图 4-3 显示了图 4-1 中的页面，并选择了标题中的 `img` 元素。\n\n这里有两点需要注意：\n\n* 标签页的左侧显示浏览器解释的页面 HTML\
  \ 代码。\n\n* 当将鼠标指针悬停在元素上时，浏览器会在渲染的页面中突出显示该元素并显示元素的尺寸。\n\n![检查 img 元素的截图](img/9781394164684-fg030403.png)\n\
  \n图 4-3： 检查 `img` 元素。\n\n##### 检查元素的样式\n\n当你点击 HTML 代码中的元素时，右侧的 `Styles` 子标签页会显示应用到元素的样式规则。（在某些浏览器中，特别是\
  \ Safari 和 Firefox，中间有一个独立的 `Styles` 面板。）通常有两种三种类型的样式规则：\n\n* 你创建的样式规则。在每条规则的右侧，浏览器会显示规则源文件的文件名以及该规则在该文件中出现的行号。\n\
  \n* 如果你使用了 CSS 重置（reset），则来自该部分的规则。\n\n* 位置为 `user agent stylesheet` 的规则，这意味着这些是默认规则。\n\
  \n![提示](img/tip.png) ![image](img/9781394164684-ma009.png) 在所有浏览器开发工具中，你都可以配置面板相对于浏览器窗口出现的位置。在\
  \ Chrome 中，点击 `Customize` 图标（如页边所示），然后点击 `Dock to Right`、`Dock to Bottom` 或 `Dock\
  \ to Left`，如图 4-2 所示。如果你喜欢可以移动的浮动面板，点击 `Undock`。\n\n\n\n\n\n## 图 4-6： 浏览器将元素的盒模型显示为一系列同心矩形。\n\
  \n这一切对调试有什么帮助呢？特别是查看浏览器为 `padding` 和 `margin` 实际使用的实际值，可以帮助你解决间距问题。例如，在图 4-1 中，注意左上角的标题图像周围没有任何空间。为了理解为什么，我可以检查\
  \ `img` 元素。你目所见，如图 4-7 所示，该元素*没有* `padding` 或 `margins`（也就是说，浏览器显示的是折线而不是数值），这解释了为什么图像会被网页的邻居元素挤压。\n\
  \n![img 元素的盒模型截图告诉我们没有设置外边距或内边距。](img/9781394164684-fg030407.png)\n\n图 4-7： `img`\
  \ 元素的盒模型告诉我们没有设置外边距或内边距。\n\n#### 检查元素的计算样式\n\n元素的*计算样式*（computed styles）是浏览器在权衡所有可用\
  \ CSS 规则（如默认的用户代理样式、你的 CSS 重置以及你定义的样式）后计算出的最终属性值。如果元素的显示方式不像你预想的那样，它的计算样式至少可以告诉你浏览器为什么要这样渲染元素。\n\
  \n在浏览器的 Web 开发工具中，`Elements` 标签页包含一个 `Computed` 子标签页，它显示所选元素的计算样式，如图 4-8 所示。要弄清楚浏览器从哪里获取其计算值，点击属性左侧的曝光三角形，这将显示浏览器正在使用的规则位置。\n\
  \n![提示](img/tip.png) 如果 `Computed` 标签页有一个长长的属性列表，你可以通过勾选 `Group` 复选框按类别（例如 `Layout`、`Text`\
  \ 和 `Appearance`）组织属性，从而更容易找到你想要的内容。\n\n![提示](img/tip.png) 默认情况下，`Computed` 标签页只显示浏览器计算出的与浏览器默认值不同的属性。要检查每个属性（包括未更改的默认值），选择\
  \ `Show All` 复选框。\n\n![Computed 标签页截图显示了所选元素的计算样式。(images/9781394164684-fg030408.png)图\
  \ 4-8： `Computed` 标签页显示所选元素的计算样式。## 检查元素的布局`Elements` 标签页中你可能发现有助于 CSS 故障的最后一个功能是\
  \ `Layout` 标签页，它提供了可视化使用以下技术的布局工具：*   **CSS Grid：** 允许你添加一个显示网格及其轨道编号的叠加层。你还可以选择性查看轨道大小、命名区域和扩展网格线。参考第\
  \ 5 本第 3 章，不仅学习如何使用 CSS Grid 布局页面，还学习检查网格的细节。*   **Flexbox：** 允许你添加一个简单的叠加层，帮助你视觉化\
  \ flex 容器及其项目。参考第 5 本第 2 章，学习如何使用 Flexbox 布局页面，以及如何使用叠加层检查 flex 布局。## 编辑属性值如果 Web\
  \ 开发工具仅仅用于检查 CSS，那么它们确实很有用，但谈不上改变游戏规则。幸运的是，你浏览器的开发工具不仅允许你查看当前的 CSS，还可以*修改它*。也就是说，你可以对几乎任何属性值进行临时的、即时的调整。一旦你编辑了现有的属性值，浏览器就会自动更新渲染页面以反映更改。为什么这改变了游戏规则？因为通常情况下要进行更改，你必须回到\
  \ HTML 或 CSS 文件，根据需要编辑 CSS，保存工作，可能还要上传编辑后的文件，切换到浏览器，然后刷新页面。如果编辑没有得到你想要的结果，而你决定尝试其他的，你还需要回到\
  \ CSS 并撤销你刚刚做的更改。对于大多数时候只是对属性值进行微调来说，这工作量太大了。而通过 Web 开发工具，你可以快速地进行该更改，而不会破坏你的原始代码。完全毫不费力。以下是其工作原理：1.\
  \  **在浏览器开发工具的 `Elements` 标签页中，点击你想修改的元素。**2.  **在 `Styles` 子标签页上，点击你想要编辑的属性值。**\
  \    浏览器会打开该值进行编辑。3.  **编辑值。**    你可以通过以下方式编辑属性值：    *   要替换整个值，只需输入新值即可。这种有效是因为当你第一次点击属性值时，浏览器会选中整个条目，因此你的输入会替换该选择。\
  \    *   要从列表中选择新值，按 `Delete` 键删除当前值，然后点击浏览器显示的列表中的新值。注意，这种技术仅适用于接受定义关键字集的值。   \
  \ *   要仅编辑值的一部分，再次点击该值以在字段内放置插入光标；然后进行编辑。    *   要增加当前的数值值，按 `Up` 方向键；要减小当前的数值值，按\
  \ `Down` 方向键。4.  **当你完成更改后，按 Enter 键。**对于盒模型属性，你也可以直接在 `Computed` 标签页中的盒模型表示上（早些在图\
  \ 4-6 所示）编辑值。以下是其工作原理：1.  **在浏览器开发工具的 `Elements` 标签页中，点击你想修改的元素。**2.  **点击 `Computed`\
  \ 标签页。**3.  **在盒模型中，双击你想编辑的值。**    在内容框中，双击 `width` 或 `height` 来编辑这些值。否则，在 `padding`、`border`\
  \ 或 `margin` 矩形中，双击现有的 `top`、`right`、`bottom` 或 `left` 值。    浏览器会打开该值进行编辑。4.  **输入新值然后按\
  \ Enter 键。**### 禁用声明调试 CSS 时可以问自己一个很有用的“假设”问题是：“如果声明 A 不在规则 B 中呢？”换句话说，如果元素的规则不包含某个特定的声明，浏览器渲染元素的方式会有不同吗？不需要回到\
  \ CSS 源代码并注释掉该声明。相反，你浏览器的开发环境使得禁用任何非默认用户样式表的规则变得轻而易举。以下是操作方法：1.  **在浏览器开发工具的 `Elements`\
  \ 标签页中，点击你想修改的元素。**2.  **在 `Styles` 子标签页上，将鼠标指针悬停在包含你想禁用的声明的规则上。**    规则中的每个声明左侧都会显示一个复选框，如图\
  \ 4-9 所示。    ![鼠标指针悬停在规则上会在每个声明旁边添加复选框的截图](img/9781394164684-fg030409.png)\n\n \
  \   图 4-9： 鼠标指针悬停在规则上会在每个声明旁边添加复选框。\n3.  **取消勾选你想禁用的声明的复选框。**\n    当你准备好重新启用该声明时，重复步骤\
  \ 1 和 2，然后勾选。\n\n#### 为元素添加内联声明\n\n与其像我在上一个节描述的那样禁用一个现有声明，你的 CSS 故障排除任务可能还需要你为元素添加一个新声明。幸运的是，与禁用声明一样，你不需要修改现有的\
  \ CSS 来添加声明，因为你可以在 Web 开发工具的便利范围内完成此任务。\n\n\n\n\n\n以下是添加声明需要遵循的步骤：\n\n1. **在浏览器开发工具的\
  \ Elements（元素）选项卡中，点击你想要修改的元素。**\n\n2. **在 Styles（样式）子选项卡中，点击 `element.style` 规则（它位于样式列表的最顶部，紧位于\
  \ Filter（过滤器）框正下方）。**\n\n   浏览器会创建一个空的 CSS 声明，并将光标放在属性字段中，紧挨冒号（:`）之前。\n\n3. **开始输入你想要使用的\
  \ CSS 属性。在与你输入的内容匹配的属性列表中，当属性出现时点击它；然后按 Tab 键。**\n\n   浏览器会将光标移动到空值字段。\n\n4. **输入你想要使用的属性值，或者从出现的列表（如果有）中选择该值。**\n\
  \n   浏览器会在元素的标签上添加一个新的内联声明，并使用新的属性值更新已渲染的元素，如图 4-10 所示。\n\n#### 向检检查器样式表添加元素声明\n\
  \n如图 4-10 所示，浏览器会在元素的标签上添加一个 `style` 属性。这很好，但内联样式会产生大量的权重（在 CSS 意义上；更多信息请参阅“打开引擎盖：样式是如何应用的””），这可能无法让你准确了解整体状况。一种更好的方法——即产生较少权重的方法——是将新规则添加到名为\
  \ `inspector stylesheet`（检查器样式表）的特殊样式表中。这是一组临时样式，浏览器仅在你正在检查元素时使用它。你添加到检查器样式表中的任何规则都将覆盖你自己的规则，这正是你所希望的。\n\
  \n![向元素添加新声明的截图。](img/9781394164684-fg030410.png)\n\n图 4-10： 你可以为元素添加新声明。\n\n以下是向检查器样式表添加新规则需要遵循的步骤：\n\
  \n1. **在浏览器开发工具的 Elements（元素）选项卡中，点击你想要修改的元素。**\n\n2. ![image](img/9781394164684-ma011.png)\
  \ **在 Styles（样式）子选项卡工具栏上，点击 New Style Rule（新样式规则）图标（如边边所示）。**\n\n   浏览器将使用优先级最高的元素选择器启动新规则。它还会打开用于编辑的选择器字段。\n\
  \n3. **根据需要修改规则的选择器；然后按 Tab 键。**\n\n   浏览器会创建一个空的 CSS 声明，并将光标放在属性字段中，紧挨冒号（:`）之前。\n\
  \n4. **开始输入你想要使用的 CSS 属性。在与你输入的内容匹配的属性列表中，当属性出现时点击它；然后按 Tab 键。**\n\n   浏览器会将光标移动到空值字段。\n\
  \n5. **输入你想要使用的属性值，或者从出现的列表（如果有）中选择该值。**\n\n   浏览器会将新规则添加到检查器样式表中，并使用新声明更新已渲染的元素，如图\
  \ 4-11 所示。\n\n![向检查器样式表添加新规则的截图。](img/9781394164684-fg030411.png)\n\n图 4-11： 你可以向检查器样式表添加新规则。\n\
  \n![提示](img/tip.png) 你可以通过点击新规则右侧出现的 `inspector-stylesheet` 链接来编辑检查器样式表。打开检查器样式表进行编辑后，可以根据任何你喜欢的选择器随意添加新规则。这包括添加新的类规则，你可以像我在下一节中描述的那样将它们添加到元素中。\n\
  \n#### 为元素添加类\n\n在调试顽固的元素时，另一个有用的“如果……”问题是：“如果我给那个元素应用一个类呢？”也就是说，如果某个特定类已经定义在 CSS\
  \ 的某处，那么将该类添加到元素上——即将类名插入标签的 `class` 属性中——是否能解决问题？问得好！\n\n要向元素添加已有的类——即一个使用该类作为选择器的规则（该规则可能位于你自己的\
  \ CSS、第三方 CSS 文件或检查器样式表中），请遵循以下步骤：\n\n1. **在浏览器开发工具的 Elements（元素）选项卡中，点击你想要修改的元素。**\n\
  \n2. **在 Styles（样式）子选项卡工具栏上，点击 `.cls` 按钮。**\n\n   浏览器会显示 Add New Class（添加新类）文本框。\n\
  \n3. **输入类名然后按 Enter 或 Return 键。**\n\n   如图 4-12 所示，浏览器会为元素添加 `class` 属性（如果该属性不存在），并将类名作为值。浏览器还会在\
  \ Styles 子选项卡上添加该类的复选框，允许你快速禁用和启用该类。\n\n![为元素添加类的截图。](img/9781394164684-fg030412.png)\n\
