  md: '# Chapter 2: Python Basics


    # Variables, Data Types, and Operators


    When you start programming in Python, one of the first things you need to understand
    how to store and manipulate data. Python makes this process simple with variables,
    data types, and operators. Let''s break these concepts down into easy-to-understand
    sections.


    # What is a Variable?


    A variable is like a labeled box where you can store information. In Python, you
    don''t have to declare the type of a variable beforehand, unlike in other languages
    such as C++ or Java. Python figures it out for you.


    For example:


    ```

    name = "Alice" # A string variable age = 25 # An integer variable height = 5.9
    # A float variable is_student = True # A boolean variable Here, Python automatically
    recognizes name as a string, age as an integer, height as a float, and is_student
    as a boolean.

    ```


    # Data Types in Python'
