    #  Variables, Data Types, and Operators in Java


    Java is a statically typed language, meaning you must declare a variable’s type
    before using it. This makes Java a little more structured than dynamically typed
    languages like Python. If you want to store a number, you need to specify whether
    it''s an integer, a floating-point number, or something else.


    Variables in Java


    A variable is a name given to a memory location where data is stored. Every variable
    in Java has three key properties: 1. Data type – Defines the kind of data the
    variable will hold.


    +   - 2. Name (Identifier) – The unique name assigned to the variable.


    +   - 3. Value – The actual data stored in the variable.


    Declaring Variables


    To declare a variable in Java, follow this format: int age = 25; // A variable
    named age storing an integer double price = 99.99; // A floating-point number
    boolean isFun = true; // A boolean variable storing true/false'
