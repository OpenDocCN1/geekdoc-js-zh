    # 1. What are Stored Procedures?


    A **Stored Procedure** is a **pre-written SQL query** saved in the database and
    executed when needed.


    +   - Benefits:

    - Speeds up execution

    - Reduces repetition

    - Enhances security (restricts direct table access)

    - **Example:** A stored procedure to retrieve all customer orders: CREATE PROCEDURE
    GetCustomerOrders @CustomerID INT


    AS


    BEGIN


    ```

    SELECT * FROM Orders WHERE CustomerID = @CustomerID; END;

    ```


    To execute the stored procedure: EXEC GetCustomerOrders @CustomerID = 5;'
  - "[PAGE 142]\n\n# 2. What are Triggers?\n\nA Trigger is a special stored procedure\
    \ that executes automatically when a specific event occurs in a table.\n\n+  \
    \ * Common Uses:\n  * Automatically update audit logs\n  * Prevent incorrect data\
    \ entry\n  * Enforce business rules Example: A trigger to update a TotalSales\
    \ table when a new order is inserted: CREATE TRIGGER UpdateSales ON Orders AFTER\
    \ INSERT\n\nAS\n\nBEGIN\n\n```\nUPDATE SalesSummary\n\nSET TotalSales = TotalSales\
    \ + (SELECT SUM(Amount)\nFROM inserted); END;\n```\n\nThis ensures that every\
    \ new order automatically updates the total sales.\n\n# 3. When to Use Triggers?"
