- md: "\n## 2. Changing Content with JavaScript\n\nWe can change the text inside elements\
    \ using .innerText or .innerHTML:\n```javascript\nlet heading = document.getElementById(\"\
    myHeading\");\nheading.innerText = \"Hello, JavaScript\"; // Changes the text\
