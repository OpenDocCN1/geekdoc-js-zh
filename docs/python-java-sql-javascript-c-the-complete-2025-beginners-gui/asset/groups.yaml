    \ = m;\n    speed = s;\n    cout << \"Car created!\" << endl;\n  }\n\n  // 析构函数\n\
    \  ~Car() {\n    cout << \"Car destroyed!\" << endl;\n  }\n};\n\nint main() {\n\
    \    Car myCar(\"Red\", \"Toyota\", 0); \n} // 析构函数在这里被自动调用\n```\n\n在上面的示例中，当\
    \ `myCar` 对象离开作用范围（在 `main()` 函数结束时）时，析构函数 `~Car()` 被调用，并打印消息 \"Car destroyed!\"\
    。\n\n## 继承\n\n继承是面向对象编程（OOP）的核心特征之一，允许你基于现有类创建新类。\n\n新类（称为派生类）从现有类（称为基类）继承属性和行为。这让你能够重用代码并扩展功能。\n\
    \n例如，假设我们有一个 `Vehicle` 类，我们创建一个继承自 `Vehicle` 的 `Car` 类。我们不需要重写共同属性；只需继承它们即可。\n\
    \n这里有一个示例：\n\n```cpp\nclass Vehicle {\npublic:\n  string color; \n  int speed;\n\
    \n  void accelerate() {\n    speed += 5;\n    cout << \"The vehicle is now going\
    \ at \" << speed << \" mph.\" << endl; \n  }\n};\n\nclass Car : public Vehicle\
