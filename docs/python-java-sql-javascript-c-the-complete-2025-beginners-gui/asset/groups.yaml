    \ 2)\nprint(my_car.display_info()) # Output: 2023 Ford Mustang with 2 doors.\n\
    ```\n\nInheritance eliminates redundant code, making programs cleaner and more\
    \ maintainable.\n\n# Polymorphism: Same Interface, Different Behavior\n\nPolymorphism\
    \ means the same method name can have different behaviors depending on the object\
