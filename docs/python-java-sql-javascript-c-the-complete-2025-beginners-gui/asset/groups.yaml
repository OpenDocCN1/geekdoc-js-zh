- md: "\nWith this solid foundation in place, you can now move forward to explore\
    \ more advanced features of C++ and start building complex, high-performance applications.\
    \ Whether you're working on system-level programming, game development, or high-frequency\
    \ trading systems, C++ will continue to be an essential tool in your programming\
    \ toolbox.\n\n# Chapter 21: C++ Fundamentals\n\n## Data Types, Variables, and\
    \ Operators\n\nWhen you start learning C++, the first thing you'll encounter are\
    \ **data types** and **variables**. These are fundamental concepts that help you\
    \ store and manipulate data in your program. Every piece of data in C++ needs\
    \ to have a specific type so the computer knows how to handle it.\n\n### Data\
    \ Types\n\nIn C++, **data types** define the type of data that can be stored in\
    \ a variable. The two main types are **primitive types** and **derived types**.\
    \ Let's look at the basic primitive data types.\n\n**Integer types** (int, short,\
    \ long, long long): These are used to store whole numbers (positive or negative).\
    \ For example:\n\n```\nint age = 30;\n```\n\n```\nshort year = 2025;\n```\n\n\
    ```\nlong long population = 7800000000;\n```\n\n- 1. Floating-point types (float,\
    \ double): These store real numbers, or numbers with decimal points. double has\
    \ more precision than float.\n\n```\nfloat price = 19.99;\n```\n\n```\ndouble\
    \ distance = 1345.6789;\n```\n\n- 2. Character types (char): This type is used\
    \ for storing single characters, like letters or digits.\n\n```\nchar grade =\
    \ 'A';\n```\n\n- 3. Boolean type (bool): This type is used to store truth values,\
    \ either true or false.\n\n```\nbool isRaining = true;\n```\n\n- 4. String type\
    \ (string): While char stores individual characters, string is used to store sequences\
    \ of characters, such as words or sentences.\n\n```\nstring name = \"John\";\n\
    ```\n\n- 5. C++ allows you to define more complex types as well, but these basic\
    \ types form the foundation of nearly every C++ program.\n\n### Variables\n\n\
    A variable is simply a named location in memory where data can be stored. To declare\
    \ a variable, you specify its data type, followed by the name of the variable.\
    \ The variable must be initialized (assigned a value) before it can be used in\
    \ a program.\n\nExample:\n\n```\nint num = 10; // Declaration and initialization\
    \ of a variable\nYou can change the value of a variable after it's been declared:\
    \ num = 15; // Reassigning a new value to the variable\n```\n\n### Operators\n\
