    # # Chapter 12: SQL Fundamentals


    # ## Basic SQL Queries (SELECT, INSERT, UPDATE, DELETE)


    If you want to work with databases, you need to speak their language, and SQL
    (Structured Query Language) is exactly that—a language designed for managing and
    manipulating data. Whether you''re retrieving information, adding new records,
    modifying existing data, or removing unnecessary entries, these four fundamental
    SQL commands—SELECT, INSERT, UPDATE, and DELETE—are your building blocks.


    #  1. SELECT: Retrieving Data from a Database


    The SELECT statement is the most used command in SQL. It allows you to retrieve
    specific data from one or more tables in a database. Think of it as asking a librarian
    to fetch a particular book from a vast collection.


    Basic Syntax:'
  - '[PAGE 124]


    ```

    SELECT column1, column2 FROM table_name; If you want to select all columns from
    a table, you use an asterisk (*):

    SELECT * FROM employees; This will return all the data from the employees table.

    ```


    # Adding Conditions with WHERE


    Sometimes, you don''t want all the records. You only want specific data based
    on a condition. This is where the WHERE clause comes in.


    ```

    SELECT * FROM employees WHERE department = ''Sales'';

    This query fetches all employees working in the Sales department.

    ```


    # Sorting Results with ORDER BY


    If you need your data in a specific order, use ORDER BY:

    SELECT * FROM employees ORDER BY salary DESC; This retrieves all employees but
    sorts them in descending order of salary.


    # 2. INSERT: Adding Data to a Table'
  - '[PAGE 125]


    When you create a database, it starts as an empty shell. The **INSERT** command
    is used to add new data into the tables.


    # Basic Syntax:


    ```

    INSERT INTO table_name (column1, column2) VALUES (value1, value2);

    ```


    # Example:


    INSERT INTO employees (name, department, salary) VALUES (''John Doe'', ''Marketing'',
    55000); This command adds a new employee named John Doe to the **Marketing** department
    with a salary of **$55,000.**


    If you''re adding multiple records, you can use bulk insertion: INSERT INTO employees
    (name, department, salary) VALUES


    (''Alice Brown'', ''Finance'', 60000), (''David Smith'', ''HR'', 50000), (''Emma
    Jones'', ''IT'', 70000); This adds three employees at once, saving time and reducing
    execution overhead.'
  - '[PAGE 126]


    # 3. UPDATE: Modifying Existing Data


    At some point, you''ll need to modify an existing record—maybe an employee got
    a raise or changed departments.

    The UPDATE statement allows you to modify existing data.


    Basic Syntax:


    ```

    UPDATE table_name


    SET column1 = value1, column2 = value2


    WHERE condition;

    ```


    Example:


    ```

    UPDATE employees


    SET salary = 65000

    ```


    WHERE name = ''John Doe''; This updates John Doe''s salary to $65,000.'
  - '[PAGE 127]


    > Warning: Always include a WHERE clause! If you forget to add WHERE, it updates
    all rows in the table, which can be disastrous.


    # 4. DELETE: Removing Unnecessary Data


    Over time, some data may become outdated or irrelevant. The DELETE statement allows
    you to remove specific records.


    Basic Syntax:


    ```

    DELETE FROM table_name WHERE condition;

    ```


    Example:


    DELETE FROM employees WHERE department = ''HR''; This removes all employees in
    the HR department.'
