    > Caution: If you run DELETE FROM employees; without a WHERE clause, it deletes
    all records from the table. Always double-check before executing a delete statement.


    # Filtering and Sorting Data


    Now that you know how to retrieve and manipulate data, the next step is refining
    your queries to extract only the relevant information. This is where filtering
    and sorting come into play.


    # 1. Filtering Data with WHERE Clause


    Filtering helps you narrow down the results to only those that meet specific conditions.


    Examples:


    ```

    SELECT * FROM employees WHERE salary > 50000; This returns only employees earning
    more than $50,000.

    ```


    You can also use **multiple conditions**: SELECT * FROM employees WHERE department
    = ''IT'' AND salary > 60000; This retrieves employees with a salary **above $60,000.**


    For flexible filtering, use **OR**: SELECT * FROM employees WHERE department =
    ''Sales'' OR department = ''Marketing''; This returns all employees in **either
    Sales or Marketing.**


    # 2. Sorting Data with ORDER BY


    Sorting makes your data **more readable**. You can sort by **ascending (ASC)**
    or **descending (DESC)** order.


    Examples:


    ```

    SELECT * FROM employees ORDER BY name ASC; This arranges employees alphabetically.

    ```


    ```

    SELECT * FROM employees ORDER BY salary DESC; This sorts employees from **highest
    to lowest salary.**

    ```


    If you want multiple sorting conditions, you can do:

    SELECT * FROM employees ORDER BY department ASC, salary DESC; This first arranges
    employees by department, then sorts by highest salary within each department.


    # Aggregate Functions and Grouping


    When dealing with large amounts of data, you often need to summarize information.
    Aggregate functions help analyze and interpret data efficiently.


    # 1. Common Aggregate Functions


    SUM(): Adding Up Values


    SELECT SUM(salary) FROM employees WHERE department = ''IT''; This returns the
    total salary of all IT employees.


    AVG(): Calculating Average Values


    SELECT AVG(salary) FROM employees; This calculates the average salary of all employees.


    MAX() and MIN(): Finding Highest and Lowest Values


    SELECT MAX(salary) FROM employees; This gives the highest salary.


    SELECT MIN(salary) FROM employees; This gives the lowest salary.


    COUNT(): Counting Records


    SELECT COUNT(*) FROM employees WHERE department = ''Finance''; This counts how
    many employees in Finance.


    # 2. Grouping Data with GROUP BY


    Sometimes, you want to summarize data **by categories**. The **GROUP BY** clause
    helps with this.


    # Example:


    ```

    SELECT department, AVG(salary) FROM employees

    GROUP BY department; This calculates the **average salary per department.**

    ```


    # Example with COUNT():


    ```

    SELECT department, COUNT(*) FROM employees

    GROUP BY department; This counts **how many employees** are in each department.

    ```


    > **Important Note:** If you use GROUP BY, every column in SELECT must be **either
    grouped or aggregated.**


    Mastering these SQL fundamentals gives you **the power to control and analyze
    data efficiently.** Whether you''re querying records, inserting new data, updating
    information, or removing outdated entries, these skills form the **foundation**
    of working with databases.


    Once you’re comfortable with these concepts, the next step is **writing more advanced
    queries** that combine multiple tables, optimize performance, and automate repetitive
    tasks.


    # Now it’s time to get hands-on—open up a database and start practicing!


    # Chapter 13: Advanced SQL Concepts


    ## Understanding Joins and Relationships


    When working with databases, **retrieving data efficiently** is just as important
    as storing it correctly. Most real-world applications involve multiple tables,
    and to make sense of the data, you must understand how to **link** them together.
    This is where **Joins and Relationships** come into play.


    ### 1. What Are Table Relationships?


    A **relationship** in SQL refers to the way **two or more tables** are connected
    through a common field. The most common relationships are:


    - **One-to-One (1:1)** - A single record in Table A relates to **only one** record
    in Table B. Example: A country and its capital.

    - **One-to-Many (1:M)** - A record in Table A can relate to **multiple** records
    in Table B. Example: A customer and their orders.

    - Many-to-Many (M:M) – A record in Table A can relate to multiple records in Table
    B, and vice versa. Example: Students and courses (a student can enroll in multiple
    courses, and a course can have many students).


    # 2. Understanding SQL Joins


    SQL Joins help you retrieve data from multiple related tables in a meaningful
    way. There are four main types of joins you’ll use frequently:


    ### a) INNER JOIN


    This is the most commonly used join. It returns only the matching records between
    two tables based on a common field.


    Example: Suppose you have two tables, Customers and Orders, and you want to retrieve
    only customers who have placed orders.


    ```

    SELECT Customers.CustomerID, Customers.Name, Orders.OrderID, Orders.Amount FROM
    Customers

    INNER JOIN Orders ON Customers.CustomerID = Orders.CustomerID; This will return
    only customers who have made at least one order.

    ```


    ### b) LEFT JOIN (or LEFT OUTER JOIN)


    This retrieves all records from the left table, and matching records from the
    right table. If there''s no match, NULL values are returned for the right table.


    ```

    SELECT Customers.CustomerID, Customers.Name, Orders.OrderID, Orders.Amount FROM
    Customers

    LEFT JOIN Orders ON Customers.CustomerID = Orders.CustomerID; This returns all
    customers even if they haven''t placed an order.

    ```


    ### c) RIGHT JOIN (or RIGHT OUTER JOIN)


    Similar to LEFT JOIN, but it returns all records from the right table, matching
    from the left.


    ```

    SELECT Customers.CustomerID, Customers.Name, Orders.OrderID, Orders.Amount FROM
    Customers

    RIGHT JOIN Orders ON Customers.CustomerID = Orders.CustomerID; This returns all
    orders even if they don''t have a customer.

    ```


    ### d) FULL JOIN (or FULL OUTER JOIN)


    A FULL JOIN retrieves all records from both tables, filling in NULLs where there
    is no match.


    ```

    SELECT Customers.CustomerID, Customers.Name, Orders.OrderID, Orders.Amount FROM
    Customers

    FULL JOIN Orders ON Customers.CustomerID = Orders.CustomerID; This shows all customers
    and orders, regardless of whether they match.

    ```


    # 3. When to Use Joins?


    - Use INNER JOIN when you want only matching records.

    - Use LEFT JOIN when you need all records from one table.

    - Use RIGHT JOIN when the priority is the right table.

    - Use FULL JOIN when you need everything.


    # Indexing for Performance Optimization


    Databases slow down when dealing with millions of records. This is where Indexing
    comes in—it helps the database locate and retrieve data faster, just like an index
    in a book.


    # 1. What is an Index?


    An index is a special lookup table that the database uses to speed up data retrieval.
    Instead of scanning every row, an index helps SQL jump straight to the needed
    records.


    # 2. Types of Indexes in SQL


    a) Primary Index (Clustered Index)


    - A primary key automatically creates a clustered index.

    - It physically arranges data in a table according to the index.


    ```

    CREATE INDEX idx_customer ON Customers(CustomerID);

    This speeds up queries searching for customers by CustomerID.

    ```


    b) Non-Clustered Index


    - A non-clustered index keeps a separate structure with pointers to the actual
    data.

    - Best for searching columns that are not primary keys.


    ```

    CREATE INDEX idx_lastname ON Customers(LastName);

    This helps queries that frequently search by LastName run faster.

    ```


    c) Composite Index


    - An index on multiple columns to optimize searches involving both.


    ```

    CREATE INDEX idx_name_city ON Customers(LastName, City);

    This speeds up queries filtering both last names and city together.

    ```


    # 3. When to Use Indexing?


    - Use indexes on large tables to improve query speed.

    - Use indexes on columns used frequently in WHERE, ORDER BY, or JOIN conditions.

    - Avoid too many indexes—they slow down INSERT and UPDATE operations.


    # Stored Procedures and Triggers

