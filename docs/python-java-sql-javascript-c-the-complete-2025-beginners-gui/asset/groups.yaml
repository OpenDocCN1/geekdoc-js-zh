    \ a Red Toyota Camry.\nprint(car2.display_info()) # Output: This is a Blue Honda\
    \ Civic.\n```\n\nEach object (car1, car2) has its own data but follows the same\
    \ blueprint. This approach makes code more organized and reusable.\n\n# Inheritance\
    \ and Polymorphism\n\n### Inheritance: Reusing Code Efficiently\n\nImagine you’re\
