    > 注意：如果你运行 DELETE FROM employees; 而不带 WHERE 子句，它将删除表中的所有记录。在执行删除删除语句之前，请务必双重检查。


    # 过滤与排序


    现在你已经知道了如何检索和处理数据，下一步是精炼你的查询以仅提取相关信息。这就是过滤和排序大显身场。


    # 1. 使用 WHERE 子句过滤数据


    过滤可以帮助你缩小结果范围，只保留符合特定条件的记录。


    示例：


    ```

    SELECT * FROM employees WHERE salary > 50000; 这将只返回工资高于 $50,000 的员工。

    ```


    你还可以使用**多个条件**：SELECT * FROM employees WHERE department = ''IT'' AND salary >
    60000; 这将检索工资**高于 $60,000** 的员工。


    为了进行灵活过滤，请使用 **OR**：SELECT * FROM employees WHERE department = ''Sales'' OR department
    = ''Marketing''; 这将返回**销售部或市场部**的所有员工。


    # 2. 使用 ORDER BY 排序数据


    排序让你的数据**更具可读性**。你可以按**升序 (ASC)** 或**降序 (DESC)** 排序。


    示例：


    ```

    SELECT * FROM employees ORDER BY name ASC; 这将按字母顺序排列员工。

    ```


    ```

    SELECT * FROM employees ORDER BY salary DESC; 这将按**从工资从高到低**对员工排序。

    ```


    如果你有多个排序条件，可以这样做：

    SELECT * FROM employees ORDER BY department ASC, salary DESC; 这先按部门安排员工，然后在每个部门内按工资高低排序。


    # 聚合函数与分组


    在处理大量数据时，你通常需要对信息进行汇总。聚合函数有助于高效地分析和解释数据。


    # 1. 常用聚合函数


    SUM(): 累加值


    SELECT SUM(salary) FROM employees WHERE department = ''IT''; 这返回所有 IT 员工的总工资。


    AVG(): 计算平均值


    SELECT AVG(salary) FROM employees; 这计算所有员工的平均工资。


    MAX() 和 MIN(): 寻找最大值和最小值


    SELECT MAX(salary) FROM employees; 这提供了最高工资。


    SELECT MIN(salary) FROM employees; 这提供了最低工资。


    COUNT(): 统计记录数


    SELECT COUNT(*) FROM employees WHERE department = ''Finance''; 这统计财务部有多少员工。


    # 2. 使用 GROUP BY 分组数据


    有时，你想按**类别**汇总数据。**GROUP BY** 子句可以实现这一点。


    # 示例：


    ```

    SELECT department, AVG(salary) FROM employees

    GROUP BY department; 这计算了**每个部门的平均工资**。

    ```


    # 使用 COUNT() 的示例：


    ```

    SELECT department, COUNT(*) FROM employees

    GROUP BY department; 这统计每个部门**有多少员工**。

    ```


    > **重要说明：** 如果使用 GROUP BY，SELECT 中的每一列必须**要么分组，要么被聚合**。


    精通这些 SQL 基础知识将赋予你**高效控制和分析数据的能力**。无论是查询记录、插入新数据、更新信息还是删除过时的条目，这些技能构成了操作数据库的**基础**。


    一旦你熟悉了这些概念，下一步就是**编写更高级的查询**，结合多个表、优化性能并自动化重复性任务。


    # 现在是时候上手实践了——打开数据库并开始练习吧！


    # 第 13 章：高级 SQL 概念


    ## 理解连接与关系


    在处理数据库时，**高效检索数据**与正确存储数据同样重要。大多数真实世界的应用涉及多个表，为了让数据有意义，你必须理解如何将它们**链接**在一起。这就是**连接（Joins）与关系**发挥用场的地方。


    ### 1. 什么是表关系？


    SQL 中的**关系**指的是**两个或多个表**通过公共字段连接起来的方式。最常见的关系有：


    - **一对一 (1:1)** - 表 A 中的单条记录与表 B 中的**仅一个**记录相关。

    - **一对多 (1:N)** - 表 A 中的单条记录与表 B 中的多条记录相关。**

    - **多对多 (M:M)** - 表 A 中的多条记录与表 B 中的多条记录相关。


    # 2. 理解 SQL 连接


    SQL 连接帮助你从表中检索数据。有四种主要类型：


    ### a) 内连接 (INNER JOIN)


    这是最常用的连接。它返回两个表中都有匹配项的记录。


    ```sql

    SELECT * FROM employees

    INNER JOIN departments ON employees.department_id = departments.id;

    ```


    ### b) 左连接 (LEFT JOIN)


    返回左表的所有记录，以及右表的匹配记录。如果右表没有匹配，则显示为 NULL。


    ```sql

    SELECT * FROM employees

    LEFT JOIN departments ON employees.department_id = departments.id;

    ```


    ### c) 右连接 (RIGHT JOIN)


    返回右表的所有记录，以及左表的匹配记录。如果左表没有匹配，则显示为 NULL。


    ```sql

    SELECT * FROM employees

    RIGHT JOIN departments ON employees.department_id = departments.id;

    ```


    ### d) 全连接 (FULL JOIN)


    返回两个表的所有记录。当某一方没有匹配时，对应的字段显示为 NULL。


    ```sql

    SELECT * FROM employees

    FULL JOIN departments ON employees.department_id = departments.id;

    ```


    # 3. 何时使用连接？


    - 当你需要匹配的记录时，使用 INNER JOIN。

    - 当你需要左表的所有记录时，使用 LEFT JOIN。

    - 当你需要右表的所有记录时，使用 RIGHT JOIN。

    - 当你需要两个表的所有记录时，使用 FULL JOIN。


    # 索引优化优化


    数据库在处理数百万记录时速度会变慢。这就是索引的用场——它帮助数据库更快地定位和检索数据，就像索引一样。


    # 1. 什么是索引？


    索引是一个特殊的查找表，数据库利用它来加速数据检索。与其扫描所有行，索引帮助 SQL 直接跳转到所需的记录。


    # 2. SQL 索引类型


    a) 聚集索引 (Clustered Index)


    - 主键会自动创建一个聚集索引。

    - 它根据索引物理地排列表中的数据。


    ```

    CREATE INDEX idx_customer ON Customers(CustomerID);

    这加速了通过 CustomerID 查询客户。

    ```


    b) 非聚集索引 (Non-Clustered Index)


    - 非聚集索引维护一个指向实际数据的独立结构。

    - 适用于搜索不是主键的列。


    ```

    CREATE INDEX idx_lastname ON Customers(LastName);

    这有助于经常按 LastName 查询的查询运行更快。

    ```


    c) 复合索引 (Composite Index)


    - 在多个列上的索引，用于优化涉及多个列的搜索。


    ```

    CREATE INDEX idx_name_city ON Customers(LastName, City);

    这加速了同时过滤姓氏和城市的查询。

    ```


    # 3. 何时使用索引？


    - 在大表上使用索引以提高查询速度。

    - 在经常用于 WHERE、ORDER BY 或 JOIN 条件的列上使用索引。

    - 避免过多的索引——它们会减慢 INSERT 和 UPDATE 操作。


    # 存储过程与触发器


