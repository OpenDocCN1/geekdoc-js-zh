    \ << endl; \n    }\n};\n\nint main() {\n    Car myCar;\n    myCar.color = \"Red\"\
    ;\n    myCar.make = \"Toyota\";\n    myCar.speed = 0;\n\n    myCar.accelerate();\n\
    \    myCar.honk();\n}\n```\n\n在这种情况下，`Car` 类**继承**了来自 `Vehicle` 类的 color、speed\
    \ 和 `accelerate()` 方法。这意味着 `Car` 对象拥有 `Vehicle` 的所有属性，但也可以拥有额外的功能，例如 `honk()`\
    \ 方法。\n\n## 指针与动态内存分配\n\n在 C++ 中，**指针**是存储另一个变量内存地址的变量。指针允许访问并修改存储在特定内存位置的数据。指针在处理动态内存时特别有用，例如当你需要在运行时分配内存时。\n\
    \n让我们来看这个简单的示例：\n\n```cpp\nint main() {\n    int* ptr = new int; // 为整数分配内存\n\
    \    *ptr = 10;\n    cout << \"Value: \" << *ptr << endl;\n    delete ptr; //\
    \ 释放内存\n}\n```\n"
