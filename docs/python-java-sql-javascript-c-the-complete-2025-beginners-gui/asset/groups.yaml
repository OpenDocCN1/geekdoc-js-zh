  mdcn: "\n\n# 1. 什么是存储过程？\n\n**存储过程**是保存在数据库中并在需要时执行的**预先编写的 SQL 查询语句**。\n\n- 优势：\n\
    - 加快执行速度\n- 减少重复\n- 增强安全性（限制对表的直接访问）\n- **示例：** 一个用于检索所有客户订单的存储过程：\nCREATE PROCEDURE\
    \ GetCustomerOrders @CustomerID INT AS\nBEGIN\n```sql\nSELECT * FROM Orders WHERE\
    \ CustomerID = @CustomerID; END;\n```\n执行该存储过程：`EXEC GetCustomerOrders @CustomerID\
    \ = 5;`\n\n# 2. 什么是触发器？\n\n触发器是一种特殊的存储过程，当表中发生特定事件时它会自动执行。\n\n- 常见用途：\n  - 自动更新审计日志\n\
    \  - 防止错误数据输入\n  - 强制执行业务规则\n\n示例：一个在插入新订单时更新 TotalSales 表的触发器：\nCREATE TRIGGER\
    \ UpdateSales ON Orders AFTER INSERT AS\nBEGIN\n```sql\nUPDATE SalesSummary\n\
    SET TotalSales = TotalSales + (SELECT SUM(Amount) FROM inserted); END;\n```\n\
    这确保了每笔新订单都会自动更新总销售额。\n\n# 3. 何时使用触发器？\n\n使用触发器进行**自动数据库维护**。\n将它们用于**安全和验证规则**。\n\
    避免复杂的触发器——它们可能会**降低性能**。\n\n**连接（Joins）、索引以及存储过程/触发器**对于编写**高效的 SQL 查询**至关重要。\n\
    \n- **连接有助于从多个表中检索相关数据**。\n- **索引通过优化搜索速度来提升性能**。\n- **存储过程和触发器可以自动化**数据库流程并**增强安全性**。\n\
    \n通过应用这些概念，你将**构建更快速、更智能且更具扩展性的数据库**。\n\n# 第 14 章：SQL 的现实应用\n\n## 管理小型企业数据库\n\n\
    在当今的商业世界，数据就是一切。无论你经营的是一家小型零售店、当地餐厅还是自由职业业务，跟踪客户、销售和库存都是关重要的。SQL（结构化查询语言）是现代数据库管理的骨干，是小企业主和员工的必备工具。如果你理解\
    \ SQL，就可以构建一个组织良好的数据库，从而节省时间、减少错误并改进决策。\n\n## 为什么小企业需要 SQL\n\n小型企业经常在数据组织方面挣扎。许多企业仍然依赖电子表格，随着业务的增长，电子表格会迅速变得混乱且不可靠。另一方面，数据库允许你高效地存储、检索和更新数据。SQL\
    \ 帮助你在不同信息集之间建立建立关系，确保所有内容都易于访问并正确链接。\n\n例如，假设你拥有一家小型面包店。你的数据库可能包括：**客户表**（存储姓名、电话和电子邮件）、**订单表**（跟踪客户购买了什么以及何时）、**产品表**（列出所有烘焙及其价格）、**库存表**（监控原料的库存水平）。通过\
    \ SQL，你可以无缝地管理这些方面。\n\n# 创建小型企业数据库\n\n要建立数据库，你首先需要定义你的表。这里是一个基础结构的示例：\n\n```sql\n\
    CREATE TABLE Customers (\n    CustomerID INT PRIMARY KEY AUTO_INCREMENT,\n   \
    \ Name VARCHAR(100),\n    Phone VARCHAR(20),\n    Email VARCHAR(255)\n);\n\nCREATE\
    \ TABLE Orders (\n    OrderID INT PRIMARY KEY AUTO_INCREMENT,\n    CustomerID\
    \ INT,\n    OrderDate DATE,\n    TotalAmount DECIMAL(10,2),\n    FOREIGN KEY (CustomerID)\
    \ REFERENCES Customers(CustomerID)\n);\n```\n\n## 查询数据\n\n一旦填充了数据，你就可以检索特定信息。例如，要查找特定客户的所有订单：\n\
    \n```sql\nSELECT Customers.Name, Orders.OrderDate, Orders.TotalAmount\nFROM Customers\n\
    JOIN Orders ON Customers.CustomerID = Orders.CustomerID\nWHERE Customers.CustomerID\
