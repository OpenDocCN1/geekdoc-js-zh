- md: "\n# 1. What are Stored Procedures?\n\nA **Stored Procedure** is a **pre-written\
    \ SQL query** saved in the database and executed when needed.\n\n- Benefits:\n\
    - Speeds up execution\n- Reduces repetition\n- Enhances security (restricts direct\
    \ table access)\n- **Example:** A stored procedure to retrieve all customer orders:\
    \ \nCREATE PROCEDURE GetCustomerOrders @CustomerID INT AS\nBEGIN\n```sql\nSELECT\
    \ * FROM Orders WHERE CustomerID = @CustomerID; END;\n```\nTo execute the stored\
    \ procedure: `EXEC GetCustomerOrders @CustomerID = 5;`\n\n# 2. What are Triggers?\n\
    \nA Trigger is a special stored procedure that executes automatically when a specific\
    \ event occurs in a table.\n\n- Common Uses:\n  - Automatically update audit logs\n\
    \  - Prevent incorrect data entry\n  - Enforce business rules\n\nExample: A trigger\
    \ to update a TotalSales table when a new order is inserted: \nCREATE TRIGGER\
    \ UpdateSales ON Orders AFTER INSERT AS\nBEGIN\n```sql\nUPDATE SalesSummary\n\
    SET TotalSales = TotalSales + (SELECT SUM(Amount) FROM inserted); END;\n```\n\
    This ensures that every new order automatically updates the total sales.\n\n#\
    \ 3. When to Use Triggers?\n\nUse triggers for **automatic database maintenance.**\n\
    Use them for **security and validation rules.**\nAvoid complex triggers—they can\
    \ **slow down performance.**\n\n**Joins, Indexing, and Stored Procedures/Triggers**\
    \ is crucial for writing **efficient SQL queries.**\n\n- **Joins help retrieve\
    \ related data from multiple tables.**\n- **Indexes boost performance** by optimizing\
    \ search speed.\n- **Stored Procedures & Triggers automate** database processes\
    \ and **enhance security.**\n\nBy applying these concepts, you’ll **build faster,\
    \ smarter, and more scalable databases.**\n\n# Chapter 14: Real-World Applications\
    \ of SQL\n\n## Managing a Small Business Database\n\nIn today’s business world,\
    \ data is everything. Whether you run a small retail store, a local restaurant,\
    \ or a freelance business, keeping track of customers, sales, and inventory is\
    \ critical. SQL (Structured Query Language) is the backbone of modern database\
    \ management, making it an essential tool for small business owners and employees.\
    \ If you understand SQL, you can build a well-organized database that saves time,\
    \ reduces errors, and improves decision-making.\n\n## Why Small Businesses Need\
    \ SQL\n\nSmall businesses often struggle with data organization. Many still rely\
    \ on spreadsheets, which can quickly become messy and unreliable as the business\
    \ grows. A database, on the other hand, allows you to store, retrieve, and update\
    \ data efficiently. SQL helps you create relationships between different sets\
    \ of information, ensuring that everything is easily accessible and properly linked.\n\
    \nFor example, let's say you own a small bakery. Your database might include:\
    \ **Customers Table** (storing names, phone numbers, and emails), **Orders Table**\
    \ (tracking what customers have purchased and when), **Products Table** (listing\
    \ all baked goods and their prices), **Inventory Table** (monitoring stock levels\
    \ of ingredients). By SQL, you can manage these aspects seamlessly.\n\n# Creating\
    \ a Small Business Database\n\nTo set up a database, you first need to define\
    \ your tables. Here is an example of a basic structure:\n\n```sql\nCREATE TABLE\
    \ Customers (\n    CustomerID INT PRIMARY KEY AUTO_INCREMENT,\n    Name VARCHAR(100),\n\
    \    Phone VARCHAR(20),\n    Email VARCHAR(255)\n);\n\nCREATE TABLE Orders (\n\
    \    OrderID INT PRIMARY KEY AUTO_INCREMENT,\n    CustomerID INT,\n    OrderDate\
    \ DATE,\n    TotalAmount DECIMAL(10,2),\n    FOREIGN KEY (CustomerID) REFERENCES\
