    export const add = (a, b) => a + b; export const subtract = (a, b) => a - b;\n\
    ```\n\n### Importing a Module (app.js)\n\n```javascript\nimport { add, subtract\
    \ } from './math.js'; console.log(add(5, 3)); // Output: 8\n```\n\n```javascript\n\
    console.log(subtract(5, 3)); // Output: 2\n```\n\nModules organize code, improve\
    \ reusability, and enhance maintainability.\n\n## 2. Async/Await - Handling Asynchronous\
    \ Code\n\nBefore async/await, JavaScript used callbacks and Promises, which often\
    \ led to callback hell (nested functions that are hard to read).\n\n### Example\
    \ of a Promise-Based Function\n\n```javascript\nfunction fetchData() {\n  return\
    \ new Promise((resolve) => {\n    setTimeout(() => resolve(\"Data received\"),\
    \ 2000);\n  });\n}\n```\n\nfetchData().then((data) => console.log(data)); // Output\
    \ after 2 sec: Data received.With async/await, handling asynchronous code becomes\
    \ simpler and more readable.\n\n### Example Using Async/Await\n\n```javascript\n\
    async function fetchData() {\n  let data = await new Promise((resolve) => {\n\
    \    setTimeout(() => resolve(\"Data received\"), 2000);\n  });\n  console.log(data);\n\
    }\n\nfetchData();\n```\n\n- The await keyword pauses execution until the Promise\
    \ resolves.\n- async/await makes asynchronous code look synchronous, improving\
    \ readability.\n\nModern JavaScript (ES6 and beyond) has transformed the language,\
