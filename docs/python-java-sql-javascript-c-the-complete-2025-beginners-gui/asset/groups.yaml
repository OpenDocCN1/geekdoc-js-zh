    ```\n\n模块组织了代码，提高了重用性并增强了维护性。\n\n## 2. Async/Await - 处理异步代码\n\n在 async/await 之前，JavaScript\
    \ 使用回调函数和 Promises，这通常会导致回调地狱（难以阅读的嵌套函数）。\n\n### 基于 Promise 的函数示例\n\n```javascript\n\
    function fetchData() {\n  return new Promise((resolve) => {\n    setTimeout(()\
    \ => resolve(\"Data received\"), 2000);\n  });\n}\n```\n\nfetchData().then((data)\
    \ => console.log(data)); // 2秒后输出：Data received. 使用 async/await，处理异步代码变得更加简单且易读。\n\
    \n### 使用 Async/Await 的示例\n\n```javascript\nasync function fetchData() {\n  let\
    \ data = await new Promise((resolve) => {\n    setTimeout(() => resolve(\"Data\
