    # # Chapter 22: Object-Oriented Programming in C++


    # ## Understanding Classes and Objects


    Object-Oriented Programming (OOP) is one of the most powerful concepts in C++
    programming. It allows you to structure your code in a way that mimics real-world
    objects, making your code easier to understand and maintain. The two most important
    concepts in OOP are **classes** and **objects**.


    A **class** is essentially a blueprint or template for creating objects. It defines
    the properties (called **attributes**) and behaviors (called **methods**) that
    the objects created from the class will have. Think of a class as the "plan" and
    the object as the "actual thing." For instance, imagine you have a class called
    *Car*. The class would define what attributes every *Car* should have, such as
    *color*, *make*, and *speed*. It might also define behaviors like *accelerate()*
    or *brake()`.


    An **object** is an instance of a class. It is created based the template provided
    by the class, and it holds actual values for the attributes and can perform the
    behaviors defined in the class. In our example, if *Car* is a class, then *myCar*
    might be an object created from that class. You can think of it as a specific
    car, like a red Toyota Corolla, with its own values for color, speed, *etc.*'
- md: "\nHere’s an example of a simple class in C++: #include <iostream> using namespace\
    \ std;\n\n```cpp\nclass Car {\npublic:\n  string color;\n\n  string make;\n\n\
    \  int speed;\n\n  void accelerate() {\n    speed += 5;\n\n    cout << \"The car\
    \ is now going at \" << speed << \" mph.\" << endl;\n  }\n\n  void brake() {\n\
    \    speed -= 5;\n    cout << \"The car is now going at \" << speed << \" mph.\"\
    \ << endl; \n  }\n\n};\n\nint main() {\n  Car myCar;\n\n  myCar.color = \"Red\"\
    ;\n  myCar.make = \"Toyota\";\n  myCar.speed = 0; \n  myCar.accelerate(); // Output:\
    \ The car is now going at 5 mph.\n\n  myCar.brake(); // Output: The car is now\
    \ going at 0 mph.\n}\n```\n\nIn the above example, Car is the class, and myCar\
    \ is an object. The accelerate() and brake() methods change the object's speed\
    \ attribute. This illustrates how a class acts as a template, and objects are\
    \ instances that hold data and can execute functionality.\n\n## Constructors,\
    \ Destructors, and Inheritance\n\n### Constructors\n\nA constructor is a special\
    \ type of function in C++ that is automatically called when an object is created\
    \ from a class. Its main purpose is to initialize the object's data members (attributes)\
    \ with default or user-defined values.\n\nConsider a scenario where you want to\
    \ create an object of a class, and you want to make sure it has some initial values\
    \ set. The constructor takes care of this automatically.\n\nHere's an example:\n\
    \n```cpp\nclass Car {\npublic:\n  string color;\n  string make;\n  int speed;\n\
    \n  // Constructor\n  Car(string c, string m, int s) {\n    color = c;\n    make\
    \ = m;\n    speed = s;\n  }\n\n  void accelerate() {\n    speed += 5;\n    cout\
    \ << \"The car is now going at \" << speed << \" mph.\" << endl;\n  }\n};\n\n\
    int main() {\n    Car myCar(\"Red\", \"Toyota\", 0); // Constructor is called\n\
    \    myCar.accelerate();\n}\n```\n\nIn this case, the constructor Car(string c,\
    \ string m, int s) is used to initialize the color, make, and speed attributes\
    \ of the Car object when it is created. Constructors are important because they\
    \ ensure that objects are always in a valid state when they are created.\n\n###\
    \ Destructors\n\nA destructor is the opposite of a constructor. It is a special\
    \ function that is automatically called when an object goes out of scope or is\
    \ deleted. The primary purpose of a destructor is to clean up any resources that\
    \ the object may have used during its lifetime. This is especially useful for\
    \ managing dynamic memory (more on that in a moment).\n\nHere’s an example:\n\n\
    ```cpp\nclass Car {\npublic:\n  string color;\n  string make;\n  int speed;\n\n\
    \  Car(string c, string m, int s) {\n    color = c;\n    make = m;\n    speed\
    \ = s;\n    cout << \"Car created!\" << endl;\n  }\n\n  // Destructor\n  ~Car()\
    \ {\n    cout << \"Car destroyed!\" << endl;\n  }\n};\n\nint main() {\n    Car\
    \ myCar(\"Red\", \"Toyota\", 0); \n} // The destructor is automatically called\
    \ here\n```\n\nIn the above example, when the myCar object goes out of scope (at\
    \ the end of the main() function), the destructor ~Car() is called, and the message\
    \ \"Car destroyed!\" is printed.\n\n## Inheritance\n\nInheritance is one of the\
    \ key features of OOP that allows you to create a new class based on an existing\
    \ class.\n\nThe new class (called a derived class) inherits attributes and behaviors\
    \ from the existing class (called the base class). This enables you to reuse code\
    \ and extend functionality.\n\nFor example, let's say we have a Vehicle class,\
    \ and we want to create a Car class that inherits from Vehicle. We don't need\
    \ to rewrite the common properties; we can simply inherit them.\n\nHere's an example:\n\
    \n```cpp\nclass Vehicle {\npublic:\n  string color; \n  int speed;\n\n  void accelerate()\
    \ {\n    speed += 5;\n    cout << \"The vehicle is now going at \" << speed <<\
    \ \" mph.\" << endl; \n  }\n};\n\nclass Car : public Vehicle {\npublic:\n    string\
    \ make;\n\n    void honk() {\n        cout << \"Beep beep!\" << endl; \n    }\n\
    };\n\nint main() {\n    Car myCar;\n    myCar.color = \"Red\";\n    myCar.make\
    \ = \"Toyota\";\n    myCar.speed = 0;\n\n    myCar.accelerate();\n    myCar.honk();\n\
    }\n```\n\nIn this case, the Car class **inherits** the color, speed, and `accelerate()`\
    \ method from the Vehicle class. This means that Car objects have all the properties\
    \ of a Vehicle but can also have additional features, such as the `honk()` method.\n\
    \n## Pointers and Dynamic Memory Allocation\n\nIn C++, **pointers** are variables\
    \ that store the memory address of another variable. A pointer allows you to access\
    \ and modify the data stored at a specific memory location. Pointers are especially\
    \ useful when working with dynamic memory, such as when you need to allocate memory\
    \ during runtime.\n\nLet’s look at a simple example:\n\n```cpp\nint main() {\n\
    \    int* ptr = new int; // Allocate memory for an integer\n    *ptr = 10;\n \
