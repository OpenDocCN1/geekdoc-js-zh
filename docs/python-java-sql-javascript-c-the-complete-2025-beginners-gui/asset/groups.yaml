    # 了解数据库与关系模型


    **数据库**是数据的组织集合。你可以将其想象成一个数字档案柜，在其中存储信息并在需要时进行检索。数据库的结构和组织方式决定了访问、修改和维护数据的效率。


    ## 数据库的类型：


    - 1. **关系型数据库（基于 SQL）** - 这些数据库使用**表**来以结构化的格式存储数据，其中行表示记录，列表示属性。示例包括 **MySQL、PostgreSQL
    和 Oracle。**

    - 2. **NoSQL 数据库** - 这些数据库使用**键值对、文档、图谱或宽列存储**来存储数据，而不是使用表。示例包括 **MongoDB、Cassandra
    和 Redis。**

    - 3. **扁平文件数据库** - 简单的基于文本的存储系统，通常用于小型应用程序。示例包括 CSV 和 JSON 文件。


    对于本书来说，我们将关注关系型数据库，因为它们是最广泛使用的，并且依赖 SQL 进行数据管理。


    # 了解关系模型


    关系模型基于表（关系）的概念。每张表都由行（记录）和列（字段/属性）组成。


    例如，考虑公司数据库中的一张员工表：


    | Employee_ID | Name | Age | Department | Salary |

    |---|---|---|---|---|

    | 101 | Alice | 30 | HR | 50000 |

    | 102 | Bob | 35 | IT | 70000 |

    | 103 | Charlie | 28 | Marketing | 55000 |


    # 关系型数据库中的核心概念：


    - **主键** – 表中每个记录的唯一标识符。示例：Employee_ID 唯一标识每位员工。

    - **外键** – 其中一张表中的列，通过引用另一张表中的主键来建立关系。示例：员工表中的 Department_ID 可能引用部门表。

    - **规范化** – 对数据进行结构化处理以**减少冗余**并**提高一致性**的过程。

    - **索引** – 特殊查找表，可加速大型数据库中的查询。


    关系型数据库允许**数据完整性**，这意味着数据保持准确、一致和可靠。它们还支持强大的**查询和报告**功能，使其成为复杂应用程序的理想选择。


    **理解关系模型至关重要，因为它构成了 SQL 数据库的基础。**


    # 安装 MySQL 和 PostgreSQL


    在开始使用 SQL 之前，你需要一个**数据库管理系统 (DBMS)** 来存储和管理你的数据。两个最流行的开源 SQL 数据库是 **MySQL** 和
    **PostgreSQL**。


    ## MySQL vs. PostgreSQL：你应该选择哪一个？


    两者都是很好的选择，但它们存在关键差异：


    | 特性 | MySQL | PostgreSQL |

    | --- | --- | --- |

    | 性能 | 读密集型操作更快 | 适合复杂查询和写密集型负载 |

    | 可扩展性 | 自定义有限 | 通过自定义函数高度可扩展 |


    | ACID 遵循（使用完全符合的 InnoDB 引擎） | |

    | 使用场景 | 最佳适用于 |

    |---|---|

    | 适用于 Web 应用 | 数据与 CMS 平台分析、企业级应用（例如 WordPress） |


    对于 Web 应用，通常首选 MySQL。对于复杂的数据处理和分析，PostgreSQL 是更好的选择。


    # 如何安装 MySQL


    Windows 安装：


    - **下载 MySQL** - 访问官方网站：https://dev.mysql.com/downloads/

    - **运行安装程序** - 选择 "MySQL Installer for Windows" 并按照引导进行设置。

    - **选择组件** - 选择 "Server"、Workbench”（GUI 工具）和 "Shell”（命令行）。

    - 4. **配置服务器** - 设置 root 密码，选择默认设置，并完成安装。

    - 5. **验证安装** - 打开 MySQL Workbench 并连接到服务器。


    Mac 安装（通过 Homebrew）：


    1. 打开终端并输入：`brew install mysql`

    2. 启动 MySQL 服务：`brew services start mysql`

    3. 强化安装：`mysql_secure_installation`


    Linux 安装（Ubuntu/Debian）：


    1. 更新包列表：`sudo apt update`

    2. 安装 MySQL：`sudo apt install mysql-server`

    3. 强化安装：`sudo mysql_secure_installation`


    # 如何安装 PostgreSQL


    Windows 安装：


    - 1. **下载 PostgreSQL** - 访问 https://www.postgresql.org/download/

    - 2. **运行安装程序** - 选择服务器、pgAdmin (GUI) 等组件。

    - 3. **设置** - 为超级用户选择密码。

    - 4. **配置服务器** - 设置端口、数据和语言区域（locale）。

    - 5. **验证安装** - 打开 pgAdmin 并连接到服务器。


    Mac 安装（通过 Homebrew）：


    `brew install postgresql`


    Linux 安装（Ubuntu/Debian）：


    1. 更新包列表：`sudo apt update`

    2. 安装 PostgreSQL：`sudo apt install postgresql postgresql-contrib`


