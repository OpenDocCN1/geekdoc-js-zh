    \ self._balance = balance # Private variable (double underscore)\n\n    def deposit(self,\
    \ amount):\n        if amount > 0:\n            self._balance += amount\n    \
    \        return f\"New Balance: {self._balance}\"\n\n    def withdraw(self, amount):\n\
    \        if 0 < amount <= self._balance:\n            self._balance -= amount\n\
    \            return f\"New Balance: {self._balance}\"\n\n    def get_balance(self):\n\
