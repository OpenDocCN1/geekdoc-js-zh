    \ C++ 中的一种特殊函数，当从类中创建对象时会被自动调用。它的主要目的是用默认值或用户定义的值来初始化对象的数据成员（属性）。\n\n考虑这样一种场景：你想创建一个类的对象，并想确保它设置了一些初始值。构造函数会自动处理这个问题。\n\
