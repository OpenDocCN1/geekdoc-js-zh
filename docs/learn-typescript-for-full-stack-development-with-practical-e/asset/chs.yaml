  \nlet isDone = false; // 推断为 boolean\n\nlet numbers = [1, 2, 3]; // 推断为 number[]\n\
  \nlet person = { name: \"Alice\", age: 30 }; // 推断为 { name: string; age: number;\
  \ }\n\nfunction greet(name) { // 推断返回类型\n\nreturn \"Hello, \" + name;\n```\n\n##\
