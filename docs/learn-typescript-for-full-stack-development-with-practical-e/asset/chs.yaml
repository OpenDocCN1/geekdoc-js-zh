  \n# 附录\n\n## TypeScript 速查表\n\n### 基本类型\n\nTypeScript 支持多种基本数据类型：\n\n- `number`：表示数值。\n\
  - `string`：表示文本。\n- `boolean`：表示真或假值。\n- `null` 和 `undefined`：表示值的缺失。\n- `any`：表示任意类型。谨慎使用！\n\
  \n```typescript\nlet age: number = 30;\nlet price: number = 9.99;\n\nlet name: string\
  \ = \"Alice\";\nlet message: string = `Hello, ${name}!`;\n\nlet isLoggedIn: boolean\
  \ = true;\nlet isAdult: boolean = age >= 18;\n\nlet x: null = null;\nlet y: undefined\
  \ = undefined;\n\nlet value: any = \"Hello\";\nvalue = 42;\n```\n\n### 类型推断\n\n\
  TypeScript 通常可以自动推断类型：\n\n```typescript\nlet message = \"Hello\"; // 推断为 string\n\
  let count = 10; // 推断为 number\n```\n\n### 数组\n\n```typescript\nlet numbers: number[]\
  \ = [1, 2, 3];\nlet strings: string[] = [\"apple\", \"banana\", \"orange\"];\n```\n\
  \n### 对象\n\n```typescript\nlet person: { name: string; age: number } = {\n  name:\
  \ \"Bob\",\n  age: 35\n};\n```\n\n### 接口\n\n```typescript\ninterface Person {\n\
  \  name: string;\n  age: number;\n}\n\nlet person: Person = {\n  name: \"Charlie\"\
  ,\n  age: 28\n};\n```\n\n### 函数\n\n```typescript\nfunction greet(name: string):\
  \ string {\n  return \"Hello, \" + name + \"!\";\n}\n\nlet result = greet(\"David\"\
  );\n```\n\n### 可选参数\n\n```typescript\nfunction greet(name: string, greeting?: string):\
  \ string {\n  return (greeting || \"Hello\") + \", \" + name + \"!\";\n}\n```\n\n\
  ### 默认参数\n\n```typescript\nfunction greet(name: string, greeting: string = \"Hello\"\
  ): string {\n  return greeting + \", \" + name + \"!\";\n}\n```\n\n### 剩余参数\n\n\
  ```typescript\nfunction sum(...numbers: number[]): number {\n  return numbers.reduce((total,\
  \ num) => total + num, 0);\n}\n```\n\n### 类\n\n```typescript\nclass Car {\n  color:\
  \ string;\n  model: string;\n\n  constructor(color: string, model: string) {\n \
  \   this.color = color;\n    this.model = model;\n  }\n\n  drive(): void {\n   \
  \ console.log(\"Driving a \" + this.color + \" \" + this.model);\n  }\n}\n```\n\n\
  ### 泛型\n\n```typescript\nfunction identity<T>(arg: T): T {\n  return arg;\n}\n```\n\
  \n### 枚举\n\n```typescript\nenum Direction {\n  Up,\n  Down,\n  Left,\n  Right\n\
  }\n```\n\n### 模块\n\n```typescript\n// file1.ts\nexport interface Person {\n  name:\
  \ string;\n}\n\n// file2.ts\nimport { Person } from './file1';\n```\n\n### 类型断言\n\
  \n```typescript\nlet value: any = \"Hello\";\nlet strLength: number = (value as\
  \ string).length;\n```\n\n### 接口与类型的区别\n\n- **接口**：主要用于描述对象的形状。\n- **类型**：更加灵活，可用于任何类型。\n\
  \n### 常见类型别名\n\n```typescript\ntype StringArray = string[];\ntype NumberOrString\
  \ = number | string;\n```\n\n### 箭头函数\n\n```typescript\nlet greet = (name: string):\
  \ string => {\n  return \"Hello, \" + name + \"!\";\n};\n```\n\n### Async/Await\n\
  \n```typescript\nasync function fetchData(): Promise<any> {\n  // ...\n}\n```\n\n\
  ### 模块（ES6/CommonJS）\n\n```typescript\n// ES6 模块\nimport { Person } from './person';\n\
  \n// CommonJS 模块\nconst person = require('./person');\n```\n\n### TypeScript 编译器选项\n\
  \n- `tsc --help` 获取完整列表\n\n常用选项：\n\n- `--target`：指定 ECMAScript 目标版本\n- `--module`：指定模块系统（`commonjs`、`es6`、`amd`）\n\
  - `--outDir`：指定输出目录\n- `--sourceMap`：生成源映射\n- `--declaration`：生成声明文件\n\n注意：本速查表提供基本概览。有关深入信息和示例，请参阅官方\
  \ TypeScript 文档。\n\n请记住用实际数据替换占位值，并根据特定项目需求调整代码。\n"
