  \ number): number;\nfunction calculateArea(shape: number | { width: number; height:\
  \ number }): number {\n  if (typeof shape === 'number') {\n    return Math.PI *\
  \ Math.pow(shape, 2); // Circle\n  } else {\n    return shape.width * shape.height;\
  \ // Rectangle\n  }\n}\n```\n\n### 练习 5：箭头函数\n\n**5.1** 将以下函数转换为箭头函数：\n\n```typescript\n\
  // Before:\nfunction greet(name: string): string {\n  return `Hello, ${name}!`;\n\
