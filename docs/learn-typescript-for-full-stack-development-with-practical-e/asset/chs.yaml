  \n- 使用**交叉类型**来组合多个接口。\n- 使用**联合类型**来表示可能是多种类型的值。\n- 使用**字面量类型**将值限制为特定的常量。\n\n\
  TypeScript\n\n```\ninterface Person\n\nname: string;\n\nage: number;\n\n}\n\ninterface\
