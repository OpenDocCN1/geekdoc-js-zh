  \n}\n\nclass ProductImpl implements Product\n\nname: string;\n\nprice: number;\n\
  \navailability: boolean;\n\nconstructor(name: string, price: number, availability:\
  \ boolean)\n\nthis.name = name;\n\nthis.price = price;\n\nthis.availability = availability;\
