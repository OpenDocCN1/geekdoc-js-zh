  \n## 练习 3：泛型\n\n- 创建一个泛型函数来交换任意类型的两个值。\n- 创建一个泛型类来表示可以容纳任何类型元素的容器。\n\nTypeScript\n\
  \n```\nfunction swap<T>(a: T, b: T): [T, T]\n\nreturn [b, a];\n\n}\n\nclass Container<T>\n\
