  \ y: number) => number;\n```\n\n**6.2** 创建一个函数，接受一个函数类型作为参数，并将其应用于两个数字。\n\n```typescript\n\
  ```\n\n\n \n ```\nfunction applyOperation(operation: MathOperation, x: number, y:\
  \ number): number {\n  return operation(x, y);\n}\n```\n\n### 附加练习\n\n- 创建一个检查数字是否为质数的函数。\n\
  - 创建一个计算数字阶乘的函数。\n- 创建一个计算两个数字最大公约数（`GCD`）的函数。\n- 创建一个检查字符串是否为回文的函数。\n- 创建一个按升序对数字数组进行排序的函数。\n\
  \n请记住：这些练习只是一个起点。你可以通过添加更多参数、返回类型或错误处理来增加复杂度。\n\n## 技巧\n\n- 从简单的函数开始，逐步增加复杂度。\n\
  - 使用不同的输入彻底测试你的函数。\n- 利用 TypeScript 的类型系统尽早发现潜在错误。\n- 探索不同的函数风格（声明式、表达式式、命令式），找到最适合你的方式。\n\
  \n通过练习这些题目，你将打下扎实的 TypeScript 函数基础，并为应对更复杂的挑战做好充分准备。\n\n# 第六章\n\n## 使用 TypeScript\
  \ 进行面向对象编程\n\n### TypeScript 中的类与对象\n\n#### 理解类与对象\n\n在 TypeScript 中，类是创建对象的蓝图。它定义了该类的对象将拥有的属性和方法。对象是类的实例，拥有自己的一组属性值。\n\
  \n#### 创建类\n\n```\nclass Person {\n  firstName: string;\n  lastName: string;\n \
  \ age: number;\n\n  constructor(firstName: string, lastName: string, age: number)\
  \ {\n    this.firstName = firstName;\n    this.lastName = lastName;\n    this.age\
  \ = age;\n  }\n\n  greet() {\n    console.log(`Hello, my name is ${this.firstName}\
  \ ${this.lastName} and I am ${this.age} years old.`);\n  }\n}\n```\n\n在这段代码中：\n\n\
  - 我们定义了一个名为 `Person` 的类。\n- 它有三个属性：`firstName`、`lastName` 和 `age`。\n- `constructor`\
  \ 方法用于在创建新实例时初始化对象的属性。\n- `greet` 方法是一个可以在任何 `Person` 对象上调用的函数。\n\n#### 创建对象\n\n\
  ```\nconst person1 = new Person(\"John\", \"Doe\", 30);\nconst person2 = new Person(\"\
  Jane\", \"Smith\", 25);\n\nperson1.greet(); // Output: Hello, my name is John Doe\
  \ and I am 30 years old.\nperson2.greet(); // Output: Hello, my name is Jane Smith\
  \ and I am 25 years old.\n```\n\n这里，我们使用 `new` 关键字创建了两个对象 `person1` 和 `person2`。每个对象都有自己的一组属性值。\n\
  \n#### 访问属性和方法\n\n```\nconsole.log(person1.firstName); // Output: John\nconsole.log(person2.age);\
  \ // Output: 25\n\nperson1.greet(); // Output: Hello, my name is John Doe and I\
  \ am 30 years old.\n```\n\n你可以使用点号表示法来访问对象的属性和方法。\n\n### 继承\n\nTypeScript 支持继承，这允许你基于现有类创建新类。\n\
  \n```\nclass Employee extends Person {\n  salary: number;\n\n  constructor(firstName:\
  \ string, lastName: string, age: number, salary: number) {\n    super(firstName,\
  \ lastName, age);\n    this.salary = salary;\n  }\n\n  getAnnualSalary() {\n   \
  \ return this.salary * 12;\n  }\n}\n```\n\n在这段代码中：\n\n- `Employee` 类继承了 `Person`\
  \ 类。\n- 它继承了 `Person` 的所有属性和方法。\n- 它添加了一个新属性 `salary` 和一个新方法 `getAnnualSalary`。\n\
  - `super` 关键字用于调用父类的构造函数。\n\n### 访问修饰符\n\nTypeScript 支持访问修饰符来控制类成员的可见性。\n\n```\n\
  class Car {\n  private color: string;\n  protected model: string;\n  public year:\
  \ number;\n\n  constructor(color: string, model: string, year: number) {\n    this.color\
  \ = color;\n    this.model = model;\n    this.year = year;\n  }\n\n  startEngine()\
  \ {\n    console.log(\"Engine started.\");\n  }\n}\n```\n\n在这段代码中：\n\n- `private`\
  \ 成员只能在类内部访问。\n- `protected` 成员可以在类及其子类中访问。\n- `public` 成员可以从任何地方访问。\n\n### 静态成员\n\
  \n静态成员属于类本身，而不是单独的对象。\n\n```\nclass MathUtils {\n  static PI = 3.14159;\n\n  static\
  \ calculateArea(radius: number) {\n    return MathUtils.PI * radius * radius;\n\
  \  }\n}\n```\n\n你可以直接使用类名来访问静态成员，无需创建对象。\n\n### 接口与类\n\n接口可用于定义对象的形状，而类可以实现接口。\n\
  \n```\ninterface Shape {\n  getArea(): number;\n}\n\nclass Circle implements Shape\
  \ {\n  radius: number;\n\n  constructor(radius: number) {\n    this.radius = radius;\n\
  \  }\n\n  getArea(): number {\n    return Math.PI * this.radius * this.radius;\n\
  \  }\n}\n```\n\n### 其他特性\n\nTypeScript 还提供了许多与类相关的其他特性，例如抽象类、 getter 和 setter 等。\n\
  \n通过理解这些概念，你可以有效地使用类和对象来创建结构良好且易于维护的 TypeScript 应用程序。\n\n## 深入探索 TypeScript 中的类与对象\n\
  \n### 抽象类\n\n抽象类是其他类的蓝图。它们不能直接实例化。它们通常包含抽象方法，即没有实现的方法声明。子类必须为这些抽象方法提供实现。\n\n```\n\
  abstract class Shape {\n  abstract getArea(): number;\n}\n\nclass Rectangle extends\
  \ Shape {\n  width: number;\n  height: number;\n\n  constructor(width: number, height:\
  \ number) {\n    super();\n    this.width = width;\n    this.height = height;\n\
  \  }\n\n  getArea(): number {\n    return this.width * this.height;\n  }\n}\n```\n\
  \n### 接口\n\n接口定义了类必须遵守的契约。它们指定了类必须实现的方法和属性。\n\n```\ninterface Printable {\n  print():\
  \ void;\n}\n\nclass Book implements Printable {\n  title: string;\n  author: string;\n\
  \n  constructor(title: string, author: string) {\n    this.title = title;\n    this.author\
  \ = author;\n  }\n\n  print() {\n    console.log(`Title: ${this.title}, Author:\
  \ ${this.author}`);\n  }\n}\n```\n\n### Getter 和 Setter\n\nGetter 和 setter 提供对对象属性的受控访问。\n\
  \n```\nclass Person {\n  private _age: number;\n\n  get age(): number {\n    return\
  \ this._age;\n  }\n\n  set age(value: number) {\n    if (value >= 0) {\n      this._age\
  \ = value;\n    } else {\n      throw new Error('Age cannot be negative');\n   \
  \ }\n  }\n}\n```\n\n### 静态属性和方法\n\n静态成员属于类本身，而不是类的实例。\n\n```\nclass MathUtils {\n\
  \  static PI = 3.14159;\n\n  static calculateArea(radius: number) {\n    return\
  \ MathUtils.PI * radius * radius;\n  }\n}\n```\n\n### 进阶主题\n\n- **继承层次结构**：理解多重继承（使用接口）、层次继承以及菱形问题。\n\
  - **多态性**：运行时多态、方法重写和方法重载。\n- **设计模式**：将类和对象概念应用于工厂模式、单例模式、观察者模式等设计模式。\n- **泛型**：创建可重用、能够与不同类型工作的组件。\n\
  \n### 示例：一个简单的银行系统\n\n```\nabstract class Account {\n  protected balance: number;\n\
  \n  constructor(initialBalance: number) {\n    this.balance = initialBalance;\n\
  \  }\n\n  abstract deposit(amount: number): void;\n  abstract withdraw(amount: number):\
  \ void;\n  abstract getBalance(): number;\n}\n\nclass SavingsAccount extends Account\
  \ {\n  interestRate: number;\n\n  constructor(initialBalance: number, interestRate:\
  \ number) {\n    super(initialBalance);\n    this.interestRate = interestRate;\n\
  \  }\n\n  deposit(amount: number): void {\n    this.balance += amount;\n  }\n\n\
  \  withdraw(amount: number): void {\n    if (this.balance >= amount) {\n      this.balance\
  \ -= amount;\n    } else {\n      console.log(\"Insufficient funds\");\n    }\n\
  \  }\n\n  getBalance(): number {\n    return this.balance;\n  }\n}\n```\n\n这个示例展示了抽象类、继承和多态性。\n\
  \n### TypeScript 中的继承\n\n\n \n继承是面向对象编程（OOP）中的一个核心概念，它允许你基于现有类（基类或父类）创建新的类（派生类或子类）。这促进了代码的可重用性、模块化以及类之间的层次关系。\n\
  \n## 理解继承\n\n在 TypeScript 中，你使用 `extends` 关键字来建立类之间的继承关系。子类继承父类的属性和方法，同时也可以引入新成员或覆盖现有成员。\n\
  \n```\nclass Animal\n  name: string;\n  constructor(name: string)\n    this.name\
  \ = name;\n  }\n\n  makeSound(): void\n    console.log('Generic animal sound');\n\
  \  }\n}\n\nclass Dog extends Animal\n  breed: string;\n\n  constructor(name: string,\
  \ breed: string)\n    super(name); // Call the parent constructor\n    this.breed\
  \ = breed;\n  }\n\n  makeSound(): void\n    console.log('Woof!');\n  }\n}\n```\n\
  \n在这个例子中，`Dog` 继承自 `Animal`。它拥有自己的 `breed` 属性，并覆盖了 `makeSound` 方法以提供狗特有的叫声。\n\n\
  ## 继承的关键点\n\n- `super` 关键字用于调用父类的构造函数并访问其成员。\n- 子类可以覆盖父类的方法。\n- 继承创建了一种\"是一个\"的关系。`Dog`\
  \ 是 `Animal`。\n- TypeScript 支持单继承，意味着一个类只能继承一个父类。\n\n## 受保护成员和访问修饰符\n\n为了控制继承层次结构中成员的可访问性，TypeScript\
  \ 提供了访问修饰符：\n\n- `public`：从任何地方都可以访问。\n- `protected`：在类内部及其子类中可以访问。\n- `private`：仅在类内部可以访问。\n\
  \n```\nclass Animal\n  protected age: number; // Accessible within Animal and its\
  \ subclasses\n\n  constructor(protected name: string, age: number)\n    this.name\
  \ = name;\n    this.age = age;\n  }\n}\n\nclass Dog extends Animal\n  // Can access\
  \ protected members of Animal\n  getInfo()\n    console.log(`Name: ${this.name},\
  \ Age: ${this.age}`);\n  }\n}\n```\n\n## 方法覆盖\n\n当子类对从父类继承的方法提供不同的实现时，这被称为方法覆盖。\n\
  \n```\nclass Shape\n  area(): number\n    return 0; // Default implementation\n\
  \  }\n}\n\nclass Rectangle extends Shape\n  constructor(private width: number, private\
  \ height: number)\n    super();\n  }\n\n  area(): number\n    return this.width\
  \ * this.height;  \n  }\n}\n```\n\n## 多态性\n\n继承实现了多态性，使得不同类的对象可以被当作同一类型来处理。\n\n\
  ```\nfunction printAnimalSound(animal: Animal)\n  animal.makeSound.basicEmailTemplate();\n\
  }\n\nlet dog = new Dog(\"Buddy\", \"Golden Retriever\");\nlet cat = new Animal(\"\
  Whiskers\");\n\nprintAnimalSound(dog); // Output: Woof!\nprintAnimalSound(cat);\
  \ // Output: Generic animal sound\n```\n\n### 接口继承\n\nTypeScript 也支持使用 `extends`\
  \ 关键字进行接口继承。接口可以继承其他接口以创建更具体的契约。\n\n```\ninterface Shape\n  area(): number;\n}\n\
  \ninterface ColoredShape extends Shape\n  colour: string;\n}\n```\n\n### 最佳实践\n\n\
  - 谨慎使用继承。过度使用可能导致复杂的类层次结构。\n- 在可能的情况下，**优先选择组合而非继承**。\n- 使基类尽可能抽象。\n- 谨慎使用 `protected`\
  \ 成员以控制继承层次结构内的访问。\n- 考虑使用抽象类来定义通用行为的基类。\n\n### 其他考虑因素\n\n- TypeScript 提供了 `super`\
  \ 关键字，用于在子类中访问父类成员。\n- `instanceof` 运算符可用于在运行时检查对象的类型。\n- 继承可以与其他 OOP 概念如多态性和封装结合使用。\n\
  \n继承是 TypeScript 中代码组织和可重用性的强大工具。通过理解这些概念和最佳实践，你可以有效地利用继承来创建结构良好、可维护的面向对象应用程序。\n\
  \n# TypeScript 中的多态性\n\n多态性是面向对象编程（OOP）的基石之一，它允许不同类的对象被当作同一类型来处理。这种灵活性增强了代码的可重用性、适应性和可维护性。在\
  \ TypeScript 中，多态性通过接口、抽象类和方法覆盖来实现。\n\n## 理解多态性\n\n多态性主要表现为两种形式：\n\n### 1. 编译时多态性（重载）\n\
  \n重载是指在类中定义多个同名但参数不同的方法的能力。编译器根据提供的参数 Salvador 确定要调用的适当方法。\n\n```\nclass Shape\n\
  \  area(shape: number): number\n    return Math.PI * shape * shape; // Assuming\
  \ a circle\n  }\n\n  area(shape: { width: number; height: number }): number\n  \
  \  return shape.width * shape.height; // Assuming a rectangle\n  }\n}\n```\n\n在这个例子中，`Shape`\
  \ 类有两个参数类型不同的 `area` 方法。编译器根据传递的参数选择正确的方法。\n\n### 2. 运行时多态性（覆盖）\n\n覆盖发生在子类为从父类继承的方法提供特定实现时。这允许不同类型的对象在运行时被当作同一类型来处理。\n\
  \n```\nabstract class Animal\n  abstract makeSound(): void;\n}\n\nclass Dog extends\
  \ Animal\n  makeSound(): void\n    console.log(\"Woof!\");\n  }\n}\n\nclass Cat\
  \ extends Animal\n  makeSound(): void\n    console.log(\"Meow!\");  \n  }\n}\n\n\
  function animalSound(animal: Animal)\n  animal.makeSound();\n}\n```\n\n在这段代码中，`Animal`\
  \ 类是抽象的，并将 `makeSound` 方法定义为抽象方法。`Dog` 和 `Cat` 类继承自 `Animal`，并为 `makeSound` 提供自己的实现。`animalSound`\
  \ 函数可以接受任何 `Animal` 对象，展示了多态性。\n\n## 多态性与接口\n\n接口在实现 TypeScript 的多态性方面起着关键作用。通过定义通用契约，接口允许不同类型的对象被当作同一类型来处理。\n\
  \n```\ninterface Shape\n  area(): number;\n}\n\nclass Circle implements Shape\n\
  \  constructor(public radius: number) {}\n\n  area(): number\n    return Math.PI\
  \ * this.radius * this.radius;  \n  }\n}\n\nclass Rectangle implements Shape\n \
  \ constructor(public width: number, public height: number) {}\n\n  area(): number\n\
  \    return this.width * this.height;  \n  }\n}\n\nfunction printArea(shape: Shape)\n\
  \  console.log(shape.area());\n}\n```\n\n在这个例子中，`Shape` 接口为计算面积定义了通用契约。`Circle`\
  \ 和 `Rectangle` 都实现了这个接口，使它们可以在 `printArea` 函数中互换使用。\n\n## 多态性的好处\n\n- **代码可重用性**：多态代码可以处理不同类型的对象，减少代码重复。\n\
  - **灵活性**：多态函数对对象层次结构的变化更具适应性。\n- **可扩展性**：新类可以添加到多态系统中而不会影响现有代码。\n- **可读性**：多态代码通常更具可读性和表达力。\n\
  \n### 最佳实践\n\n- 使用接口为多变行为定义契约。\n- 在可能的情况下，**优先选择组合而非继承**。\n- 避免过度使用重载，因为它可能降低代码可读性。\n\
  - 考虑使用泛型类型来实现更灵活的多态代码。\n\n### 其他考虑因素\n\n- TypeScript 支持隐式和显 crowed 类型断言来实现多态性。\n\
  - 多态性可以与其他 OOP 概念如继承和封装结合使用。\n- 理解里氏替换原则（LSP）对于有效使用多态性至关重要。\n\n\n \n多态性是一个强大的概念，它能增强\
  \ TypeScript 代码的**灵活性**、**可复用性**和**可维护性**。掌握多态性，你就能创建出更加健壮、适应性更强的软件系统。\n\n## TypeScript\
  \ 中的里氏替换原则（LSP）\n\n里氏替换原则（LSP）是面向对象编程的基石之一，它确保了软件系统的**可靠性**和**健壮性**。该原则指出：\n\n-\
  \ 程序中的对象应该能够用其子类的实例替换，而不会改变程序的正确性。\n\n简单来说，如果你有一个基类和一个派生类，任何使用基类对象的代码都应该能够使用派生类对象，而不会产生任何问题。\n\
  \n### 理解 LSP\n\n让我们考虑一个实际的例子：\n\n```typescript\nabstract class Shape {\n    abstract\
  \ area(): number;\n}\n\nclass Rectangle extends Shape {\n    constructor(public\
  \ width: number, public height: number) {}\n\n    area(): number {\n        return\
  \ this.width * this.height;\n    }\n}\n\nclass Square extends Rectangle {\n    constructor(public\
  \ side: number) {\n        super(side, side); // 强制实现正方形行为\n    }\n}\n```\n\n乍一看，这似乎是对的。正方形是一种特殊的矩形，对吧？然而，这违反了\
  \ LSP。为什么？\n\n考虑一个计算矩形面积的函数：\n\n```typescript\nfunction calculateArea(shape: Shape)\
  \ {\n    // 一些逻辑\n    shape.width = 10;\n    shape.height = 5;\n    return shape.area();\n\
  }\n```\n\n如果我们传入 `Rectangle` 实例，它能按预期工作。但如果我们传入 `Square` 实例，改变宽度也会改变高度，从而破坏正方形的不变性。这就是对\
  \ LSP 的违反。\n\n### 遵守 LSP\n\n为了纠正这一点，我们需要重新定义 `Rectangle` 和 `Square` 之间的关系：\n\n```typescript\n\
  class Rectangle {\n    constructor(protected width: number, protected height: number)\
  \ {}\n\n    area(): number {\n        return this.width * this.height;\n    }\n\
  }\n\nclass Square {\n    constructor(public side: number) {}\n\n    area(): number\
  \ {\n        return this.side * this.side;\n    }\n}\n```\n\n现在，`Square` 不再继承 `Rectangle`，两个类都有自己的\
  \ `area` 方法实现。这遵守了 LSP，因为你可以在不产生意外行为的情况下互换使用 `Rectangle` 或 `Square`。\n\n### LSP\
  \ 的重要性\n\n- **代码可靠性**：遵守 LSP 使你的代码更可预测，更少出错。\n- **可维护性**：对子类的修改不太可能破坏现有代码。\n- **可测试性**：遵循\
  \ LSP 的代码更容易测试。\n\n### 额外考虑\n\n- **前置条件和后置条件**：LSP 还涉及确保基类的前置条件和后置条件在子类中得以保持。\n\
  - **契约式设计**：这种方法可以帮助规范方法的期望和返回值。\n- **接口隔离原则（ISP）**：通常，将 LSP 与 ISP 结合使用可以实现更灵活的设计。\n\
  \n里氏替换原则是编写健壮、可维护的面向对象代码的基本概念。通过理解和应用 LSP，你可以创建更易于理解、修改和扩展的软件系统。\n\n## TypeScript\
  \ 中的访问修饰符\n\nTypeScript 中的访问修饰符是控制类成员（属性和方法）可见性的关键字。它们对于封装数据和强化面向对象原则至关重要。TypeScript\
  \ 提供了三种主要的访问修饰符：`public`、`private` 和 `protected`。\n\n### Public 访问修饰符\n\n`public`\
  \ 访问修饰符是 TypeScript 中的默认可访问级别。被声明为 `public` 的成员可以从代码中的任何地方访问，包括在类内部、从其他类，以及类外部。\n\
  \n```typescript\nclass Person {\n    public name: string;\n    public age: number;\n\
  \n    constructor(name: string, age: number) {\n        this.name = name;\n    \
  \    this.age = age;\n    }\n\n    public greet(): void {\n        console.log(`Hello,\
  \ my name is ${this.name} and I am ${this.age} years old.`);\n    }\n}\n\nlet person\
  \ = new Person('John Doe', 30);\nconsole.log(person.name); // Output: John Doe\n\
  person.greet(); // Output: Hello, my name is John Doe and I am 30 years old.\n```\n\
  \n### Private 访问修饰符\n\n`private` 访问修饰符将成员的可见性限制在类本身内部。被声明为 `private` 的成员不能从类外部访问。这有助于数据封装，防止意外修改。\n\
  \n```typescript\nclass Person {\n    private socialSecurityNumber: string;\n\n \
  \   constructor(ssn: string) {\n        this.socialSecurityNumber = ssn;\n    }\n\
  \n    public getSSN(): string {\n        return this.socialSecurityNumber;\n   \
  \ }\n}\n\nlet person = new Person('123-456-7890');\nconsole.log(person.socialSecurityNumber);\
  \ // Error: Property 'socialSecurityNumber' is private and only accessible within\
  \ class 'Person'\nconsole.log(person.getSSN()); // Output: 123-456-7890\n```\n\n\
  ### Protected 访问修饰符\n\n`protected` 访问修饰符类似于 `private`，但额外允许在派生类中访问。被声明为 `protected`\
  \ 的成员可以在类本身及其子类中访问。这对于实现继承层次结构特别有用，因为子类需要访问父类的某些成员。\n\n```typescript\nclass Animal\
  \ {\n    protected name: string;\n\n    constructor(name: string) {\n        this.name\
  \ = name;\n    }\n\n    protected makeSound(): void {\n        console.log('Generic\
  \ animal sound');\n    }\n}\n\nclass Dog extends Animal {\n    bark(): void {\n\
  \        console.log(`${this.name} says: Woof!`);\n    }\n}\n\nlet dog = new Dog('Buddy');\n\
  dog.bark(); // Output: Buddy says: Woof!\nconsole.log(dog.name); // Error: Property\
  \ 'name' is protected and only accessible within class 'Animal' and its subclasses\n\
  ```\n\n### 访问修饰符与继承\n\n当一个类继承另一个类时，基类成员的访问修饰符会影响它们在派生类中的可访问性：\n\n- **Public members**：可以从任何地方访问。\n\
  - **Protected members**：可以在基类及其派生类中访问。\n- **Private members**：在派生类中不可访问。\n\n###\
  \ 最佳实践\n\n- 默认使用 `private` 来封装数据并保护类不变量。\n- 当成员需要在类层次结构中访问时，使用 `protected`。\n- 谨慎使用\
  \ `public`，仅对真正需要从类外部访问的成员使用。\n- 考虑使用 getter 和 setter 来控制对属性的访问，即使它们是 public 的。\n\
  \n### 额外考虑\n\n- TypeScript 还支持 `readonly` 关键字，它可以防止属性在初始化后被修改，无论其访问修饰符如何。\n- 虽然严格来说不是访问修饰符，但\
  \ TypeScript 中的接口可用于定义类的公共契约。\n\n通过有效使用访问修饰符，你可以提高 TypeScript 项目的代码组织性、可维护性和安全性。\n\
  \n## TypeScript 中的抽象类\n\nTypeScript 中的抽象类是可以被其他类继承的基类。与普通类不同，抽象类不能直接实例化。它们的主要目的是为派生类定义共同的结构和行为。抽象类通常包含抽象方法，即没有实现的方法声明。\n\
  \n### 定义抽象类\n\n要定义抽象类，请在类声明前使用 `abstract` 关键字。你也可以在类中使用 `abstract` 关键字声明抽象方法。\n\n\
  ```typescript\nabstract class Shape {\n    abstract getArea(): number;\n\n    public\
  \ getColor(): string {\n        return 'red';\n    }\n}\n```\n\n在上面的例子中，`Shape`\
  \ 是一个带有抽象方法 `getArea()` 的抽象类。`getColor()` 方法是一个具有实现的具体方法。\n\n### 抽象方法\n\n抽象方法没有方法体，由\
  \ `abstract` 关键字标识。派生类必须为从基类继承的所有抽象方法提供实现。\n\n```typescript\nabstract class Shape\
  \ {\n    abstract getArea(): number;\n    // 其他成员\n}\n\nclass Rectangle extends\
  \ Shape\n```\n\n\n ```typescript\nsuper();\n\n}\n```\n\n```typescript\ngetArea():\
  \ number\n```\n\n```typescript\nreturn this.width * this.height;\n\n}\n```\n\n```typescript\n\
  getPerimeter(): number\n```\n\n```typescript\nreturn 2 * (this.width + this.height);\n\
  \n}\n\nclass Circle extends Shape\n\nconstructor(private radius: number)\n```\n\n\
  ```typescript\nsuper();\n\n}\n```\n\n```typescript\ngetArea(): number\n```\n\n```typescript\n\
  return Math.PI * this.radius * this.radius;\n\n}\n```\n\n```typescript\ngetPerimeter():\
  \ number\n```\n\n```typescript\nreturn 2 * Math.PI * this.radius;\n\n}\n\nclass\
  \ Triangle extends Shape\n\nconstructor(private base: number, private height: number,\
  \ private side1: number, private side2: number)\n```\n\n```typescript\nsuper();\n\
  \n}\n```\n\n```typescript\ngetArea(): number\n```\n\n```typescript\nreturn 0.5 *\
  \ this.base * this.height;\n\n}\n```\n\n```typescript\ngetPerimeter(): number\n\
  ```\n\n```typescript\nreturn this.side1 + this.side2 + this.base;\n```\n\n### 练习\
