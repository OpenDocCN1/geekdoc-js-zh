  md: '# Higher-order component(HOC)


    Higher-order components (HOC) are an advanced technique in React for reusing component
    logic. Meaning a higher-order component is a function that takes a component and
    returns a new component. They are patterns that emerge from React''s compositional
    nature. While a component transforms props into UI, a higher-order component transforms
    a component into another component, and they tend to be popular in third-party
    libraries.


    # Context


    In a typical React app, data is passed down via props, but this can be cumbersome
    for some types of props that are required by many components within an application.
    Context provides a way to share these types of data between components without
    having to explicitly pass a prop through every level of hierarchy. Meaning with
    context, we can avoid passing props through intermediate elements.'
  merge: -1
