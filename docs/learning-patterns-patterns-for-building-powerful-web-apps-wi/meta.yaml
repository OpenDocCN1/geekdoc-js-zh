  md: '# # Optimizing for the Core Web Vitals on a Next.js app


    A case study optimizing a Next.js app for performance


    Next.js by Vercel is a React meta-framework that enhances the React development
    experience. It enables the creation of production-ready apps and supports static
    site generation and server-side rendering, easy configuration, fast refresh, image
    optimization, file-system routing, and optimized code-splitting and bundling.


    To evaluate how to optimize a React + Next.js application using third-party dependencies,
    we created the Next.js Movies app. This is a non-trivial movie browsing application
    and a fully-featured client of TMDB. It incorporates a rich set of features that
    allow you to search and browse through a comprehensive and categorized movie listing,
    view details and manage personal favorites through membership and authentication.'
  merge: -1
  pgno: 281
- img_proc: false
  md: '![](bbox=[0.119, 0.087, 0.88, 0.452])


    Subsequently, the Next.js Movies app was the benchmark that we used to implement
    a series of performance tweaks and identify the ones that were beneficial from
    an overall user experience perspective. Today, I want to talk about the performance
    improvement achieved on the whole and dig into each of the tweaks that we tried
    with their outcomes.


    # Cumulative Improvements


    We were able to achieve a significant aggregate performance improvement with all
    optimizations in place. This automatically translated to a better user experience.
    The metrics depicted here were captured before and after the implementation of
    all the code changes meant to optimize the performance.'
