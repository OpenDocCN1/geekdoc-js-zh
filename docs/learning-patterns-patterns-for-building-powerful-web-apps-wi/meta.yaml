  md: 'In addition to the overall performance improvement, metrics were captured using
    Lighthouse and WPT after every code change for relevant pages. The tests were
    repeated multiple times to eliminate any lags due to sleeping servers or other
    conditions both before and after the change. The average calculated for each parameter
    thus gave us a reliable value to use for our analysis.


    With that background, let''s talk about every change implemented and how it contributed
    to the overall performance improvement we achieved.


    # Packages Switched


    Initially, a number of third-party React components helped to quickly implement
    the different features required for the Movies app. We decided to analyze the
    impact on metrics by trying other available alternatives for individual third-party
    components especially those that were heavy or blocking the main thread.


    Most of these attempts were extremely fruitful in bringing down the values of
    different metrics


    +   - Using @svgr/webpack instead of Font-Awesome for SVG icons helped to boost
    Speed Index by 34%, LCP by 23%, and TBT by 51%

    - Using a custom-built component to replace react-burger-menu and removing the
    resize-observer-polyfill from react-sicky-box led to a reduction in bundle size
    by 34.28 kB (gZipped).'
  merge: -1
