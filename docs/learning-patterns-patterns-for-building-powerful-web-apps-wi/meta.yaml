  md: "# # Factory Pattern\n\nUse a factory function in order to create objects\n\n\
    With the factory pattern we can use factory functions in order to create new objects.\
    \ A function is a factory function when it returns a new object without the use\
    \ of the new keyword!\n\nSay that we need many users for our application. We can\
    \ create new users with a firstName, lastName, and email property. The factory\
    \ function adds a fullName property to the newly created object as well, which\
    \ returns the firstName and the lastName.\n\n```\nconst createUser = ({ firstName,\
    \ lastName, email }) => ({\n  firstName,\n  lastName,\n  email,\n  fullName()\
    \ {\n    return `${this.firstName} ${this.lastName}`;\n  }\n});\n```\n\nPerfect!\
    \ We can now easily create multiple users by invoking the createUser function."
  merge: -1
  pgno: 186
