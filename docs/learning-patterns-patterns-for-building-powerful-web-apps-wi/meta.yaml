  md: '# # Overview of React.js


    A UI library for building reusable user interface components


    Over the years, there has been an increased demand for straight-forward ways to
    **compose** using JavaScript. **React**, also referred to as React.js, is an open-source
    JavaScript library designed by Facebook, used for building user interfaces or
    UI components.


    React is of course not the only library used out there. **Preact**, **Vue**, **Angular**,
    **Svelte**, **Lit** and many others are all great for composing interfaces from
    reusable elements. Given React''s popularity, it''s worth walking through how
    it works we will be using it to walk through some of the design, rendering and
    performance patterns in this guide.


    When front-end developers talk about code, it''s often in the context of designing
    interfaces for the web. And the way we think of interface composition is in elements,
    like buttons, lists, navigation, and the likes. React provides an optimized and
    simplified way of expressing interfaces in these elements. It also helps build
    complex and tricky interfaces by organizing your interface into three key concepts—*components*,
    *props*, and *state*.


    Because React is composition-focused, it can, perfectly map to the elements of
    your design system. So, in essence, designing for React actually rewards you for
    thinking in a modular way. It allows you to design individual components before
    putting together a page or view, so you fully understand each component''s scope
    and purpose—a process referred to as *componentization*.'
  merge: -1
