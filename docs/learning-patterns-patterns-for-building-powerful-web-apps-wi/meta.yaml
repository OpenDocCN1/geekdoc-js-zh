- img_proc: false
  md: 'Following are the key takeaways from this table.


    +   - CSS and Fonts are loaded with the highest priority. This should help us
    prioritize critical CSS and fonts.

    - Scripts get different priorities based on where they are in the document and
    whether they are async, defer, or blocking. Blocking scripts requested before
    the first image ( or an image early in the document) are given higher priority
    over blocking scripts requested after the first image is fetched.


    Async/defer/injected scripts, regardless of where they are in the document, have
    the lowest priority. Thus we can prioritize different scripts by using the appropriate
    attributes for async and defer.


    +   - Images that are visible and in the viewport have a higher priority (Net:
    Medium) than those that are not in the viewport (Net: Lowest). This helps us prioritize
    ABT images over BTF images.


