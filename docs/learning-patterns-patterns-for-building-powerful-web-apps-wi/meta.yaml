  md: '# Implementing Islands


    The Island architecture borrows concepts from different sources and aims to combine
    them optimally. Template-based static site generators such as Jekyll and Hugo
    support the rendering of static components to pages. Most modern JavaScript frameworks
    also support isomorphic rendering, which allows you to use the same code to render
    elements on the server and client.


    Jason''s post suggests the use of requestIdleCallback() to implement a scheduling
    approach for hydrating components. Static isomorphic rendering and scheduling
    of component level partial hydration can be built into a framework to support
    Islands architecture. Thus, the framework


    +   - Support static rendering of pages on the server with zero JavaScript.

    - Support embed of independent dynamic components via placeholders in static content.
    Each dynamic component contains its scripts and can hydrate itself using requestIdleCallback()
    as soon as the main thread is free.

    - Allow isomorphic rendering of components on the server with hydration on the
    client to recognize the same component at both ends.


    You can use one of the out-of-the-box options discussed next to implement this.


    # Frameworks


    Different frameworks today are capable of supporting the Islands architecture.
    Notable among them are'
  merge: -1
  pgno: 316
- img_proc: false
  md: '+   * **Marko** is an open-source framework developed and maintained by eBay
    to improve server rendering performance. It supports Islands architecture by combining
    streaming rendering with automatic partial hydration. HTML and other static assets
    are streamed to the client as soon as they are ready. Automatic partial hydration
    allows interactive components to hydrate themselves. Hydration code is only shipped
    for interactive components which can change the state on the browser. It is isomorphic,
    and the Marko compiler generates optimized code depending on where it will run
    (client or server).


    +   * **Astro** is a static site builder that can generate lightweight static
    HTML pages from UI components built in other frameworks such as React, Preact,
    Svelte, Vue, and others. Components that need client-side JavaScript are loaded
    individually with their dependencies. Thus it provides built-in partial hydration.
    Astro can also lazy-load components depending on when they become visible. We
    have included a sample implementation using Astro in the next section.


    +   * **Eleventy + Preact**: Markus Oberlehner demonstrates the use of Eleventy,
    a static site generator with isomorphic Preact components that can be partially
    hydrated. It also supports lazy hydration. The component itself declaratively
    controls the hydration of the component. Interactive components use WithHydration
    wrapper so that they are hydrated on the client.'
