  md: '# React Components


    ![](bbox=[0.116, 0.147, 0.873, 0.483])


    Components are the building blocks of any React app. They are like JavaScript
    functions that accept arbitrary input (Props) and return React elements describing
    what should be displayed on the screen.


    The first thing to understand is that everything on screen in a React app is part
    of a component. Essentially, a React app is just components within components
    within components. So developers don''t build pages in React; they build components.


    Components let you split your UI into independent, reusable pieces. If you''re
    used to designing pages, thinking in this modular way might seem like a big change.
    But if you use a design system or style guide? Then this might not be as big of
    a paradigm shift as it seems.'
  merge: -1
  pgno: 10
