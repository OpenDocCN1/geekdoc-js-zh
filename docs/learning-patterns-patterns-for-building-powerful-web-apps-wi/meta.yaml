  md: "# Hooks\n\nIn many cases, the Container/Presentational pattern can be replaced\
    \ with React Hooks. The introduction of Hooks made it easy for developers to add\
    \ statefulness without needing a container component to provide that state.\n\n\
    Instead of having the data fetching logic in the DogsImagesContainer component,\
    \ we can create a custom hook that fetches the images, and returns the array of\
    \ dogs.\n\n```\nexport default function useDogImages() {\n  const [dogs, setDogs]\
    \ = useState([]);\n\n  useEffect(() => {\n    fetch(\"https://dog.ceo/api/breed/labrador/images/random/6\"\
    )\n      .then(res => res.json())\n      .then(({ message }) => setDogs(message));\n\
    \  }, []);\n\n  return dogs;\n}\n```\n\nBy using this hook, we no longer need\
    \ the wrapping DogsImagesContainer container component to fetch the data, and\
    \ send this to the presentational DogsImages component. Instead, we can use this\
    \ hook directly in our presentational DogsImages component!"
