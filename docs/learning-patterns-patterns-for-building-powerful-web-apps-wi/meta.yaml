  md: '# # Static Rendering


    Deliver pre-rendered HTML content that was generated when the site was built


    Based on our discussion on SSR, we know that a high request processing time on
    the server negatively affects the TTFB. Similarly, with CSR, a large JavaScript
    bundle can be detrimental to the FCP, LCP and TTI of the application due to the
    time taken to download and process the script.


    Static rendering or static generation (SSG) attempts to resolve these issues by
    delivering pre-rendered HTML content to the client that was generated when the
    site was built.


    A static HTML file is generated ahead of time corresponding to each route that
    the user can access. These static HTML files may be available on a server or a
    CDN and fetched as and when requested by the client.


    ![](bbox=[0.116, 0.606, 0.786, 0.906])'
  merge: -1
  pgno: 232
- img_proc: false
  md: '![](bbox=[0.121, 0.048, 0.792, 0.335])


    Static files may also be cached thereby providing greater resiliency. Since the
    HTML response is generated in advance, the processing time on the server is negligible
    thereby resulting in a faster TTFB and better performance. In an ideal scenario,
    client-side JS should be minimal and static pages should become interactive soon
    after the response is received by the client. As a result, SSG helps to achieve
    a faster FCP/TTI


    ![](bbox=[0.121, 0.577, 0.878, 0.908])'
