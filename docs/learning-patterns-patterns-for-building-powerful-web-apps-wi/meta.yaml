  md: "Perfect, let's create an observable! An easy way of creating one, is by using\
    \ an ES6 class.\n\n```\nclass Observable {\n  constructor() {\n    this.observers\
    \ = [];\n  }\n\n  subscribe(func) {\n    this.observers.push(func);\n  }\n\n \
    \ unsubscribe(func) {\n    this.observers = this.observers.filter(observer =>\
    \ observer !== func);\n  }\n\n  notify(data) {\n    this.observers.forEach(observer\
    \ => observer(data));\n  }\n}\n```\n\nAwesome! We can now add observers to the\
