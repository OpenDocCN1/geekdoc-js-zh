    # Import-on-interaction for first-party code as part of progressive loading


    Loading code on interaction also happens to be a key part of how Google handles
    progressive loading in large applications like Flights and Photos. To illustrate
    this, let''s take a look at an example previously presented by Shubhnik Panicker.


    Imagine a user is planning a trip to Mumbai, India and they visit Google Hotels
    to look at prices. All of the resources needed for this interaction could be loaded
    eagerly upfront, but if a user hasn''t selected any destination, HTML/CSS/JS required
    for the map would be unnecessary.'
  merge: -1
  pgno: 372
- img_proc: false
  md: '# Google Hotels


    In the simplest download scenario, imagine Google Hotels is using naive client-side
    rendering (CSR). All the code would be downloaded and processed upfront: HTML,
    followed by JS, CSS and then fetching the data, only to render once now we have
    everything. However, this leaves the user waiting a long time with nothing displayed
    on-screen. A big chunk of the JavaScript and CSS may be unnecessary.'
  merge: -1
  pgno: 373
- img_proc: false
  md: '![](bbox=[0.117, 0.047, 0.882, 0.381])


    Next, imagine this experience moved to server-side rendering (SSR). We would allow
    the user to get a visually complete page sooner, which is great, however it wouldn''t
    be interactive until the data is fetched from the server and the client framework
    completes hydration.


    SSR can be an improvement, but the user may have an uncanny valley experience
    where the page looks ready, but they are unable to tap on anything. Sometimes
    this is referred to as rage clicks as users tend to click over and again repeatedly
    in frustration.


    Returning to the Google Hotels search example, if we zoom in to the UI a little
    we can see that when a user clicks on "more filters" to find exactly the right
    hotel, the code required for that component is downloaded.


    Only very minimal code is downloaded initially and beyond this, user interaction
    dictates which code is sent down when.'
  merge: -1
  pgno: 374
- img_proc: false
  md: 'Let''s take a closer look at this loading scenario.


    ![](bbox=[0.119, 0.157, 0.88, 0.542])


    There are a number of important aspects to interaction-driven late-loading:


    First, we download the minimal code initially so the page is visually complete
    quickly.


    Next, as the user starts interacting with the page we use those interactions to
    determine which other code to load. For example the code for the "more filters"
    component. This means code for many features on the page are never sent down to
    the browser, as the user didn''t need to use them.'
  merge: -1
