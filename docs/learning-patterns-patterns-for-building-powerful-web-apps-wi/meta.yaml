  md: "# # Proxy Pattern\n\nShare a single global instance throughout our application\n\
    \nWith a Proxy object, we get more control over the interactions with certain\
    \ objects. A proxy object can determine the behavior whenever we're interacting\
    \ with the object, for example when we're getting a value, or setting a value.\n\
    \nGenerally speaking, a proxy means a stand-in for someone else. Instead of speaking\
    \ to that person directly, you'll speak to the proxy object who will represent\
    \ the person you were trying to reach. The same happens in JavaScript: instead\
    \ of interacting with the target object directly, we'll interact with the Proxy\
    \ object.\n\nLet's create a person object, that represents John Doe.\n\n```\n\
    const person = {\n  name: \"John Doe\",\n  age: 42,\n  nationality: \"American\"\
    \n};\n```\n\nInstead of interacting with this object directly, we want to interact\
    \ with a proxy object. In JavaScript, we can easily create a new proxy by creating\
    \ a new instance of Proxy."
  merge: -1
