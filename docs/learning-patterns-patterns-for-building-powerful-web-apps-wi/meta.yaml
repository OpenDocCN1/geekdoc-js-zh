  md: '# Overview of Next.js


    Vercel''s framework for hybrid React applications


    Next.js, created by Vercel, is a framework for hybrid React applications. It is
    often difficult to understand all the different ways you might load content. Next.js
    abstracts this to make it as easy as possible. The framework allows you to build
    scalable, performant React code and comes with a zero-config approach. This allows
    developers to focus on building features.


    Let us explore the Next.js features that are relevant to our discussion


    # Basic Features


    Pre-rendering


    By default, Next.js generates the HTML for each page in advance and not on the
    client-side. This process is called pre-rendering. Next.js ensures that JavaScript
    code required to make the page fully interactive gets associated with the generated
    HTML. This JavaScript code runs in a Shadow DOM to ensure that the rendered content
    matches with what the React application would render without actually manipulating
    it. This process is called hydration.


    Each page is a React component exported from a .js, .jsx, or .ts file in the pages
    directory. The route is determined based on the file name. E.g., pages/about.js
    corresponds to the route /about. Next.js supports pre-rendering through both Server-Side
    Rendering (SSR) and Static generation. You can also mix different rendering methods
    in the same app'
  merge: -1
  pgno: 213
