  md: 'By using the useQuery hook, we reduced the amount of code that was needed in
    order to provide the data to the component.


    # Pros


    Sharing logic and data among several components is easy with the render props
    pattern. Components can be made very reusable, by using a render or children prop.
    Although the Higher Order Component pattern mainly solves the same issues, namely
    reusability and sharing data, the render props pattern solves some of the issues
    we could encounter by using the HOC pattern.


    The issue of naming collisions that we can run into by using the HOC pattern no
    longer applies by using the render props pattern, since we don''t automatically
    merge props. We explicitly pass the props down to the child components, with the
    value provided by the parent component.


    Since we explicitly pass props, we solve the HOC''s implicit props issue. The
    props that should get passed down to the element, are all visible in the render
    prop''s arguments list. This way, we know exactly where certain props come from.


    We can separate our app''s logic from rendering components through render props.
    The Stateful component that receives a render prop can pass the data onto stateless
    components, which merely render the data.'
  merge: -1
  pgno: 135
- img_proc: false
  md: '# Cons


    The issues that we tried to solve with render props, have largely been replaced
    by React Hooks. As Hooks changed the way we can add reusability and data sharing
    to components, they can replace the render props pattern in many cases.


    Since we can''t add lifecycle methods to a render prop, we can only use it on
    components that don''t need to alter the data they receive.'
