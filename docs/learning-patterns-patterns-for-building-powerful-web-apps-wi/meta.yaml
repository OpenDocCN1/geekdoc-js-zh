  md: "# Basic Structure\n\nAs the name suggests, static rendering is ideal for static\
    \ content, where the page need not be customized based on the logged-in user (e.g\
    \ personalized recommendations). Thus static pages like the 'About us', 'Contact\
    \ us', and Blog pages for websites or product pages for e-commerce apps, are ideal\
    \ candidates for static rendering. Frameworks like Next.js, Gatsby, and VuePress\
    \ support static generation. Let us start with this simple Next.js example of\
    \ static content rendering without any data.\n\n```\n```javascript\nexport default\
    \ function About() {\n  return <div>\n    <h1>About Us</h1>\n    {/* ... */}\n\
    \  </div>\n}\nn```\n```\n\nWhen the site is built, this page will be pre-rendered\
    \ into an HTML file about.html accessible at the route /about.\n\n# SSG with Data\n\
    \nStatic content like that in 'About us' or 'Contact us' pages may be rendered\
    \ as without getting data from a data-store. However, for content like individual\
    \ blog pages or product pages, the data from a data-store has to be merged with\
    \ a specific template and then rendered to HTML at build time."
  merge: -1
  pgno: 234
- img_proc: false
  md: "The number of HTML pages generated will depend on the number of blog posts\
    \ or the number of products respectively. To get to these pages, you may also\
    \ have listing pages which will be HTML pages that contain a categorized and formatted\
    \ list of data items. These scenarios can be addressed using Next.js static rendering.\
    \ We can generate listing pages or individual item based on the available items.\
    \ Let us see how.\n\n# Listing Page - All Items\n\nGeneration of a listing page\
    \ is a scenario where the content to be displayed on the page depends on external\
    \ data. This data will be fetched from the database at build time to construct\
    \ the page. In Next.js this can be achieved by exporting the function getStaticProps()\
    \ in the page component. The function is called at build time on the builder server\
    \ to fetch the data. The data can then be passed to the page's props to pre-render\
    \ the page component.\n\n```\n// This function runs at build time on the builder\
    \ server\nexport async function getStaticProps() {\n  return {\n    props: {\n\
    \      products: await getProductsFromDatabase()\n    }\n  };\n}\n\n// The page\
    \ component receives props from getStaticProps at build time\nexport default function\
    \ Products({ products }) {\n  return (\n    <h1>Products</h1>\n    <ul>\n    \
    \  {products.map((product) => (\n        <li key={product.id}>{product.name}</li>\n\
    \      ))}\n    </ul>\n  );\n}\n```"
  merge: -1
