  md: '# React Hooks vs Classes


    When Hooks were introduced to React, it created a new problem: how do we know
    when to use function components with Hooks and class lifecycle? With the help
    of Hooks, it is possible to get state and partial lifecycle Hooks even in function
    components. Hooks also allow you to use local state and other React features without
    writing a class.


    Here are some differences between Hooks and Classes to help you decide:


    | React Hooks | Classes |

    |---|-|

    | It helps avoid multiple hierarchies and make code clearer | Generally, when
    you use HOC or renderProps, you have to restructure your App HOC with multiple
    hierarchies when you try to see it in DevTools |

    | It provides uniformity across React components. | Classes confuse both humans
    and machines due to the need to understand binding and the context in which functions
    are called. |'
