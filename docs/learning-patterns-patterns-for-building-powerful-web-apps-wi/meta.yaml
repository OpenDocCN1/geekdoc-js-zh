- img_proc: false
  md: '# Inline the critical, defer the non-critical


    Our Lighthouse audits were consistently generating this suggestion that we certainly
    needed to act upon.


    | Opportunity | Estimated Savings |

    |---|---|

    | Eliminate render-blocking resources | 0.18 s ^ |


    Resources are blocking the first paint of your page. Consider delivering critical
    JS/CSS inline and deferring all non-critical JS/styles. [Learn more]()


    CSS is a render-blocking resource, i.e., it must be loaded and processed before
    the page is rendered. Some of the CSS may be required to style the content that
    is visible on the initial page load. This is the critical CSS that needs to be
    inlined to optimize the page. There may be other CSS that is not initially and
    can be deferred.


    As part of our optimizations, we in-lined the CSS required for dark/light modes
    transition which was identified as critical CSS.


    As per Next.js documentation, we had initially imported all our node module CSS
    files in the /pages/_app.js file. We are using two components reactglider and
    react-modal-video that require CSS import from node modules. Importing this CSS
    through _app.js would be render-blocking for the app as these components are not
    required on all the pages.


    The CSS required by these components was inlined in the files where the component
    was used. For example, after optimization, the code in our cast component includes
    the syntax to render the Glider along with the styles that it uses.'
  merge: -1
