  md: '# Pros and Cons


    Progressive hydration provides server-side rendering with client-side hydration
    while also minimizing the cost of hydration. Following are some of the advantages
    that can be gained from this.


    +   1. Promotes code-splitting: Code-splitting is an integral part of progressive
    hydration because chunks of code need to be created for individual components
    that are lazy- loaded.


    +   2. Allows on-demand loading for infrequently used parts of the page: There
    may be components of the page that are mostly static, out of the viewport and/or
    not required very often. Such components are ideal candidates for lazy hydration.
    Hydration code for these components need not to be sent when the page loads. Instead,
    they may be hydrated based on a trigger.


    +   3. Reduces bundle size: Code-splitting automatically results in a reduction
    of bundle size. Less code to execute on load helps reduce the time between FCP
    and TTI.


    On the downside, progressive hydration may not be suitable for dynamic apps where
    every element on the screen is available to the user and needs to be made interactive
    on load. This is because, if developers do not know where the user is likely to
    click first, they may not be able to identify which components to hydrate first.'
  merge: -1
  pgno: 255
