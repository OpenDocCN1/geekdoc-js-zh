- img_proc: false
  md: 'Modules that are prefetched are requested and loaded by the browser even before
    the user requested the resource. When the browser is idle and calculates it''s
    got enough bandwidth, it will make a request in order to load the resource, and
    cache it. Having the resource cached can reduce the loading time significantly,
    as we don''t have to wait for the request to finish after the user has clicked
    the button. It can simply get the loaded resource from cache.


    Although prefetching is a great way to optimize the loading time, don''t overdo
    it. If the user ended up never requesting the EmojiPicker component, we unnecessarily
    loaded the resource. This could potentially cost a user money, or slow down the
    application. Only prefetch the necessary resources.'
