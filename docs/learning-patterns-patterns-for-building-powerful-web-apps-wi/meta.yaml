  md: "# Hooks\n\nIn some cases, we can replace the HOC pattern with React Hooks.\n\
    \nLet's replace the withHover HOC with a useCustom hook. Instead of having\n higher\
    \ order component, we export a hook that adds\na mouseover and mouseLeave event\
    \ listener to the element. We cannot\npass the element anymore like we did with\
    \ the HOC. Instead, we'll return\na ref from the hook that should get the mouseover\
    \ and\nmouseLeave events.\n\n```\nimport { useState, useRef, useEffect } from\
    \ 'react';\n\nexport default function useHover() {\n  const [hovering, setHover]\
    \ = useState(false);\n  const ref = useRef(null);\n\n  const handleMouseEnter\
    \ = () => setHover(true);\n  const handleMouseOut = () => setHover(false);\n\n\
    \  useEffect(() => {\n    const node = ref.current;\n    if (node) {\n      node.addEventListener(\"\
    mouseover\", handleMouseEnter);\n      node.addEventListener(\"mouseout\", handleMouseOut);\n\
    \    }\n\n    return () => {\n      node.removeEventListener(\"mouseover\", handleMouseEnter);\n\
    \      node.removeEventListener(\"mouseout\", handleMouseOut);\n    };\n  }, [ref.current]);\n\
    \n  return [ref, hovering];\n}\n```\n\n![](bbox=[0.837, 0.878, 0.911, 0.933])"
