  md: '# Provider Pattern


    Make data available to multiple child components


    In some cases, we want to make available data to many (if not all) components
    in an application. Although we can pass data to components using props, this can
    be difficult to do if almost all in your application need access to the value
    of the props.


    We often end up with something called prop drilling, which is the case when we
    pass props far down the component tree. Refactoring the code that relies on the
    props becomes almost impossible, and knowing where certain data comes from is
    difficult.


    Let''s say that we have one App component that contains certain data. Far down
    the component tree, we have a ListItem, Header and Text component that all need
    this data. In order to get this data to these components, we''d have to pass it
    through multiple layers of components.'
  merge: -1
  pgno: 54
- img_proc: false
  md: "In our codebase, that would look something like the following:\n\n```\nfunction\
    \ App() {\n  const data = { ... }\n\n  return (\n    <div>\n      <Sidebar data={data}\
    \ />\n      <Content data={data} />\n    </div>\n  )\n}\n\nconst Sidebar = ({\
    \ data }) => <List data={data} />\nconst List = ({ data }) => <ListItem data={data}\
    \ />\nconst ListItem = ({ data }) => <span>{data.listItem}</span>\n\nconst Content\
    \ = ({ data }) => (\n  <div>\n    <Header data={data} />\n    <Block data={data}\
    \ />\n  </div>\n)\nconst Header = ({ data }) => <div>{data.title}</div>\nconst\
    \ Block = ({ data }) => <Text data={data} />\nconst Text = ({ data }) => <h1>{data.text}</h1>\n\
    ```\n\nPassing props down this way can get quite messy. If we want to rename the\
    \ data prop in the future, we'd have to rename it in all components. The bigger\
    \ your application gets, the trickier prop drilling can be."
