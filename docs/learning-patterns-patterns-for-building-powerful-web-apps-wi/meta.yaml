  md: "# Case Study\n\nExpress.js is a popular web application server framework. We\
    \ can add callbacks to certain routes that the user can access.\n\nSay we want\
    \ add a header to the request if the user hits the root / . We can add this header\
    \ in a middleware callback.\n\n```\nconst app = require(\"express\")();\n\napp.use(\"\
    /\", (req, res, next) => {\n  req.headers[\"test-header\"] = 1234;\n  next();\n\
    });\n```\n\nThe next' method calls the next callback in the request-response cycle..\
    \ We'd effectively be creating a chain of middleware functions that sit between\
    \ the request and the response, or vice versa.\n\n![](bbox=[0.119, 0.599, 0.823,\
    \ 0.911])"
