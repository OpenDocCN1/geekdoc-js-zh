  md: 'Using React Hooks just made it much clearer to separate the logic of our component
    into several smaller pieces. Reusing the same stateful logic just became much
    easier, and we no longer have to rewrite functional components into class components
    if we want to make the component stateful. A good knowledge of ES2015 classes
