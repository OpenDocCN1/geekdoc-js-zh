    # (Dis)advantages


    Restricting the instantiation to just one instance could potentially save a lot
    of memory space. Instead of having to set up memory for a new instance each time,
    we only have to set up memory for one instance, which is referenced throughout
    the application. However, Singletons are actually considered an anti-pattern,
    and can (or..) should be avoided in JavaScript.


    In many programming languages, such as Java or C++, it''s not possible to directly
    create objects the way we can in JavaScript. In those object-oriented programming
    languages, we need to create a class, which creates an object. That created object
    has the value of the instance of the class, just like the value of instance in
    the JavaScript example.


