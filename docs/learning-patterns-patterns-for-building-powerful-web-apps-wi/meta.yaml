  md: '# PRPL Pattern


    Optimize initial load through precaching, lazy loading, and minimizing roundtrips


    Making our applications globally accessible can be a challenge! We have to make
    sure the application performant on low-end devices and in regions with a poor
    internet connectivity. In order to make sure our application can load as efficiently
    as possible in difficult conditions, we can use the PRPL pattern.


    The PRPL pattern focuses on four main performance considerations:


    +   - Pushing critical resources efficiently, which minimizes the amount of roundtrips
    to the server and reducing the loading time.


    +   - Rendering the initial route as soon as possible to improve the user experience


    +   - Pre-caching assets in the background for frequently visited routes to minimize
    the amount of requests to the server and enable a better offline experience


    +   - Lazily loading routes or assets that aren''t requested as frequently


    When we want to visit a website, we first have to make a request to the server
    in order to get those resources. The file that the entrypoint points to gets returned
    from the server, which is usually our application''s initial HTML file!'
  merge: -1
  pgno: 392
- img_proc: false
  md: 'The browser''s HTML parser starts to parse this data as soon as it starts receiving
    it from the server. If the parser discovers that more resources are needed, such
    as stylesheets or scripts, another HTTP request is sent to the server in order
    to get those resources!


    ![](bbox=[0.121, 0.241, 0.878, 0.569])


    ![](bbox=[0.121, 0.593, 0.878, 0.921])'
