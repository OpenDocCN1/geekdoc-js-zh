  md: 'Although pushing resources reduces the amount of time to receive additional
    resources, server push is not HTTP cache aware! The pushed resources won''t be
    available to us the next time we visit the website, and will have to be requested
    again. In order to solve this, the PRPL pattern uses service workers after the
    initial load to cache those resources in order to make sure the client isn''t
    making unnecessary requests.


    The authors of a site, we usually know what resources are critical to fetch early
    on, while browsers do their best to guess this. Luckily, we can help the browser
    by adding a preload resource hint to the critical resources!


    By telling the browser that you''d like to preload a certain resource, you''re
    telling the browser that you would like to fetch it sooner than the browser would
    otherwise discover it! Preloading is a great way to optimize the time it takes
    to load resources that are critical for the current route.


    Although preloading resources are a great way to reduce the amount of roundtrips
    and optimize loading time, pushing too many files can be harmful. The browser''s
    cache is limited, and you may be unnecessarily using bandwidth by requesting resources
    that weren''t actually needed by the client.'
