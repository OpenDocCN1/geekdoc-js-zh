  md: '# Preconnects


    Preconnects allow you to provide hints to the browser on what resources are going
    to be required by the page shortly. Adding "rel=preconnect" informs the browser
    that the page will need to establish a connection to another domain so that it
    can start the process sooner. The hints help load resources quicker because the
    browser may have already set up the connection by the time the resources are required.


    There was a small but discernible difference in the values of performance parameters
    after this change as tabulated here.


    | Performance Metric | FCP (s) | Speed Index (s) | LCP (s) | TTI (s) | TBT (ms)
    | CLS | Performance (%) |

    |---|---|---|---|---|---|---|--|

    | Before | 0.9 | 3.9 | 3.43 | 2.93 | 60 | 0 | 88 |

    | After | 0.83 | 3.5 | 2.86 | 2.63 | 53.33 | 0 | 93.33 |

    | % Change | 7.77 | 10.25 | 16.61 | 10.23 | 6.67 | 0 | |


    # Optimize the API call sequence


    Being a TMDB client, the movies app makes several API calls to get the list of
    movies, genres, cast, and other details along with related images. The principle
    used to optimize the API call sequence should ensure that calls to fetch data
    be used for rendering the main page area are not put off until the other API calls
    have finished. With this in mind, we changed our sequence of execution as follows.'
  merge: -1
  pgno: 302
- img_proc: false
  md: "| Before | After |\n| --- | --- |\n| Fetch the metadata like genres and configuration\
    \ while the API call for movie posters was put off until they were finished. |\
    \ Fetch the metadata (used for populating the side menu) and simultaneously fetch\
    \ the movie poster data. |\n| Fetch the movie poster data | Render the home page\
    \ with the fetched movie poster data. |\n| Render the home page with the fetched\
    \ movie poster data. | |\n\n# Preloading API response\n\nWhen a user visits the\
    \ home page of the Movies app for the first time, we already know that we will\
    \ be showing page 1 of the ‘Popular’ movies list. The actual list itself comes\
    \ from the TMDB API, but the API call can be created based on these two values\
    \ Genre = \"popular\" and page = 1\n\nWith this knowledge, we were able to preload\
    \ the data for the home page as follows.\n\n```\n<link\n  rel='preload'\n  as='fetch'\n\
    \  href='https://api.themoviedb.org/3/movie/popular?api_key=...5&page=1'\n  crossOrigin='true'\n\
    />\n```"
  merge: -1
