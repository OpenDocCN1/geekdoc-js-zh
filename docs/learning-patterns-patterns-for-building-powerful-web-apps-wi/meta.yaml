  md: '# Other techniques used for Optimization


    Experimenting with alternate libraries was one part of the performance analysis
    and optimization project. We also tried other mechanisms that have been known
    to enhance performance. Let''s talk about what was attempted and what worked or
    didn''t work for us.


    # Code-Splitting


    We used code-splitting to lazy-load the Menu component - being collapsed by default
    on mobile, this was an opportunity to only do when a user actually needed it.
    We had initially tried lazy loading with the Burger Menu sidebar and observed
    some gain in performance. After we replaced it with a custom component for the
    sidebar menu, we lazy-loaded the custom component.


    We used the LazyLoadingErrorBoundary component which acts as a wrapper for react
    lazy and react suspense. While FCP and LCP remained about the same, there was
    a substantial reduction in TBT by 71% as can be seen in the following comparison.


    | Performance Metric | FCP (s) | Speed Index (s) | LCP (s) | TBT (ms) | CL S |
    Performance (%) |

    |---|---|---|---|---|---||}{

    | Before | 0.86 | 4.2 | 3.46 | 2.53 | 70 | 0 | 87.66 |

    | After | 0.83 | 3.63 | 3.3 | 1.73 | 20 | 0 | 90.33 |

    | % Change | 3.48 | 13.57 | 4.62 | 31.62 | 71.42 | 0 |'
  merge: -1
