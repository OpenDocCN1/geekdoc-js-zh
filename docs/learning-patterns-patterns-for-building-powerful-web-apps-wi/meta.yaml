  md: 'Here, we have used fallback: true. Now if the page corresponding to a specific
    product is unavailable, we show a fallback version of the page, eg., a loading
    indicator as shown in the Product function above. Meanwhile, Next.js will generate
    the page in the background. Once it is generated, it will be cached and shown
    instead of the fallback page. The cached version of the page will now be shown
    to any subsequent visitors immediately upon request. For both new and existing
    pages, we can set an expiration time for when Next.js should revalidate and update
    it. This can be achieved by using the revalidate property as shown in the following
    section.


    # Update Existing pages


    To re-render an existing page, a suitable timeout is defined for the page. This
    will ensure that the page is revalidated whenever the defined timeout period has
    elapsed. The timeout could be set to as low as 1 second. The user will continue
    to see the previous version of the page, till the page has finished revalidation.
    Thus, iSSG uses the stale-while-revalidate strategy where the user receives the
    cached or stale version while the revalidation takes place. The revalidation takes
    place completely in the background without the need for a full rebuild.


    Let us go back to the example for generating a static listing page for products
    based on the data in the database. To make it serve a relatively dynamic list
