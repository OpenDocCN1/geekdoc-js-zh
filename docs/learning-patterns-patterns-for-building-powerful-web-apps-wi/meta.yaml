  md: '# Dynamic Import


    Import parts of your code on demand


    In our chat application, we have four key components: UserInfo, ChatList, ChatInput
    and EmojiPicker. However, only three of these components are used instantly on
    the initial page load: UserInfo, ChatList and ChatInput


    The EmojiPicker isn''t directly visible, and may not even be rendered at all the
    user won''t even click on the emoji to toggle the EmojiPicker. This would mean
    that we unnecessarily added the EmojiPicker module to our initial bundle, which
    potentially increased the loading time!


    In order to solve this, we can dynamically import the EmojiPicker component. Instead
    of statically importing it, we''ll only import it when we want to show the EmojiPicker.


    An easy way to dynamically import components in React is by using React Suspense.
    The React.Suspense component receives the component that should be dynamically
    loaded, which makes it possible for the App component can render its contents
    faster by suspending the import of the EmojiPicker module!


    When the user clicks on the emoji, the EmojiPicker component gets rendered for
    the first time. The EmojiPicker component renders a Suspense component, which
    receives the lazily imported module:'
  merge: -1
  pgno: 347
- img_proc: false
  md: 'the EmojiPicker in this case. The Suspense component accepts a fallback prop,
    which receives the component that should get rendered while the suspended component
    is still loading!


    Instead of unnecessarily adding EmojiPicker to the initial bundle, we can split
    it up into its own bundle and reduce the size of the initial bundle! A smaller
    initial bundle size means a faster initial load: the user doesn''t have to stare
    at a blank loading screen for as long. The fallback component lets the user know
    that our application hasn''t frozen: they simply need to wait a little while for
    the module to be processed and executed.


    | Asset | Size | Chunks | Chunk Names |

    |---|---|---|---||

    | emoji-picker.bundle.js | 1.48 KiB | 1 | [emitted] | emoji-picker |

    | main.bundle.js | 1.33 MiB | main | [emitted] | main |

    | vendors-emoji-picker.bundle.js | 171 KiB | 2 | [emitted] | vendors-emoji-picker
    |


    Whereas previously the initial bundle was 1.5 MiB, we''ve been able to reduce
    it to 1.33 MiB by suspending the import of the EmojiPicker!'
