  md: '# Replacing interactive embeds with a static variant


    We have discussed the import-on-interaction pattern and progressive loading, but
    what about going entirely static for the embeds use-case?


    The final rendered content from an embed may be needed immediately in some cases
    e.g a social media post that is visible in the initial viewport. This can also
    introduce its own challenges when the embed brings in 2-3MB of JavaScript. Because
    the embed content is needed right away, lazy-loading and facades may be less applicable.


    If optimizing for performance, it''s possible to entirely replace an embed with
    a static variant that looks similar, linking out to a more interactive version
    (e.g the original social media post). At build time, the data for the embed can
    be pulled in and transformed into a static HTML version.


    ![](bbox=[0.119, 0.529, 0.88, 0.881])'
  merge: -1
  pgno: 380
- img_proc: false
  md: 'This is the approach @wongmjane leveraged on their blog for one type of social
    media embed, improving both page load performance and removing the Cumulative
    Layout Shift due to the embed code enhancing the fallback text, causing layout
    shifts.


    While static replacements can be good for performance, they do often require doing
    something custom to keep this in mind when evaluating your options.


    # Conclusions


    First-party JavaScript often impacts the interaction readiness of modern pages
    on the web, but it can often get delayed on the network behind non-critical JS
    from either first or third-party sources that keep the main thread bus.


    In general, avoid synchronous third-party scripts in the document head and aim
    to load non-blocking third-party scripts after first-party JS has finished loading.
    Patterns like import-on-interaction give us a way to defer the loading of non-critical
    resources to a point when a user is much more likely to need the UI they power.


    With special thanks to Shubie Panicker, Connor Clark, Patrick Hulce, Anton Karlovskiy
    and Adam Raine for their input.'
  merge: -1
