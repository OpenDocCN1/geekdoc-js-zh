    # Progressive Hydration Implementation


    In the section on implementing SSR with React, we discussed client-side hydration
    for an app that is rendered on the server. Hydration allows client-side React
    to recognize the ReactDOM components that are rendered on the server and attach
    events to these components. Thus, it introduces continuity and seamlessness for
    an SSR app to function like a CSR app once it is'
  merge: -1
  pgno: 249
- img_proc: false
  md: 'available on the client.


    For all components on the page to become interactive via hydration, the React
    code for these components should be included in the bundle that gets downloaded
    to the client. Highly interactive SPAs that are largely controlled by JavaScript
    would need the entire bundle at once. However, mostly static websites with a few
    interactive elements on the screen, may not need all components to be active immediately.
    For such websites sending a huge React bundle for each component on the screen
    becomes an overhead.


    Progressive Hydration solves this problem by allowing us to hydrate only certain
    parts of the application when the page loads. The other parts are hydrated progressively
    as required.


    ![](bbox=[0.118, 0.526, 0.879, 0.859])'
  merge: -1
  pgno: 250
- img_proc: false
  md: 'With Progressive hydration, the "You may also like" and "Other content" components
    can be hydrated later.


    Instead of initializing the entire application at once, the hydration step begins
    at the root of the DOM tree, but the individual pieces of the server-rendered
    application are activated over a period of time. The hydration process may be
    arrested for various branches and resumed when they enter the viewport or based
    on some other trigger. Note that, the loading of resources required to perform
    each hydration is also deferred using code-splitting techniques, thereby reducing
    the amount of JavaScript required to make pages interactive.


    The idea behind progressive hydration is to provide a great performance by activating
    your app in chunks. Any progressive hydration solution should also take into account
    how it will impact the overall user experience. You cannot have chunks of screen
    popping up one after the other but blocking any activity or user input on the
    chunks that have already loaded. Thus, the requirements for a holistic progressive
    hydration implementation are as follows.


    +   * Allows usage of SSR for all components.

    * Supports splitting of code into individual components or chunks.

    * Supports client side hydration of these chunks in a developer sequence.

    * Does not block user input on chunks that are already hydrated.\

    * Allows usage of some sort of a loading indicator for chunks with deferred hydration.'
  merge: -1
  pgno: 251
- img_proc: false
  md: 'React concurrent mode will address all these requirements once it is available
    to all. It allows React to work on different tasks at the same time and switch
    between them based on the given priority. When switching, a partially rendered
    tree need not to be committed, so that the rendering task can continue once React
    switches back to the same task.


    Concurrent mode can be used to implement progressive hydration. In this case,
    hydration of each of the chunks on the page, becomes a task for React concurrent
    mode. If a task of higher priority user input needs to be performed, React will
    pause the hydration task and switch to accepting the user input. Features like
    lazy(), Suspense() allow you to use declarative loading states. These can be used
    to show the loading indicator while chunks are being lazy loaded. SuspenseList()
    can be used to define the priority for lazy loading components. This demo shared
    by Dan Abramov shows concurrent mode in action and implements progressive hydration.


    React concurrent mode can also be combined with another React feature Server Components.
    This will allow you to refetch components from the server and render them on the
    client as they stream instead of waiting for the whole fetch to finish. Thus,
    the client''s CPU is put to work even as we wait for the network fetch to finish.


    While the React concurrent mode based progressive hydration implementation is
