  md: '# # React Server Components


    Server Components compliment SSR, rendering to an intermediate abstraction without
    needing to add to the JavaScript bundle


    The React team are working on zero-bundle-size React Server Components, which
    aim to enable modern UX with a server-driven mental model. This is quite different
    from Server-side Rendering (SSR) of components and could result in significantly
    smaller JavaScript bundles.


    The direction of this work is exciting, and while it isn''t yet production ready,
    is worth keeping on your radar. The RFC is worth reading as is Dan and Lauren''s
    talk worth watching for more detail.


    # ## Server-side rendering limitations


    Today''s Server-side rendering of client-side JavaScript can be suboptimal. JavaScript
    for your components is rendered on the server into an HTML string. This HTML is
    delivered to the browser, which can appear to result in a fast First Contentful
    Paint or Largest Contentful Paint.


    However, JavaScript still needs to be fetched for interactivity which is often
    achieved via a hydration step. Server-side rendering is generally used for the
    initial page load, so post-hydration you''re unlikely to see it used again.'
  merge: -1
  pgno: 266
- img_proc: false
  md: "Note: While it's true that one could build a server-only app leveraging SSR\
    \ and avoiding hydrating on the client at all, heavy interactivity in the model\
    \ often involves stepping outside of React. The hybrid model that Server Components\
    \ enable will allow deciding on a per-component basis. With React Server Components,\
    \ our components can be refetched regularly. An application with components which\
    \ rerender when there is new data can be run on the server, limiting how much\
    \ code needs to be sent to the client.\n\n```\n// *Before* Server Components\n\
