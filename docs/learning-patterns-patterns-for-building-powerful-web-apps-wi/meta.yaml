  md: '# #Progressive Hydration


    Delay loading JavaScript for less important parts of the page


    A server rendered application uses the server to generate the HTML for the current
    navigation. Once the server has completed generating the HTML contents, which
    also contains the necessary CSS and JSON data to display the static UI correctly,
    it sends the data to the client. Since the server generated the markup for us,
    the client can quickly parse this and display it on the screen, which produces
    a fast First Contentful Paint!


    Although server rendering provides a faster First Contentful Paint, it doesn''t
    always provide a faster Time To Interactive. The necessary JavaScript in order
    to be able to interact with our website hasn''t been loaded.

    Buttons may look interactive, but they are not interactive (yet). The handlers
    only get attached once the JavaScript bundle has been loaded and processed. This
    process is called hydration: React checks the current DOM nodes, and hydrates
    the nodes with the corresponding JavaScript.


    The time that the user sees non-interactive UI on the screen is also referred
    to as the uncanny valley: although users may think that they can interact with
    the website, there are no handlers attached to the components yet. This can be
    a frustrating experience for the user, as the UI may like it it''s frozen!


    It can take a while before the DOM components that were received from the server
    are fully hydrated. Before the components can be hydrated, the'
