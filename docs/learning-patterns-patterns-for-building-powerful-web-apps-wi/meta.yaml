    traditional design patterns.


    Modern web development involves lots of different kinds of patterns. This project
    covers the implementation, benefits and pitfalls of common design patterns using
    ES2015+, React-specific design patterns and their possible modification and implementation
    using React Hooks, and many more patterns and optimizations that can help improve
    your modern web app!'
