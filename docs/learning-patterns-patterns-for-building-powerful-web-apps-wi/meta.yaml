  md: '# # Module Pattern


    Split up your code into smaller, reusable pieces


    As your application and codebase grow, it becomes increasingly important to keep
    your code maintainable and separated. The module pattern allows you to split up
    your code into smaller, reusable pieces.


    Besides being able to split your code into smaller reusable pieces, modules allow
    you to keep certain values within your file private. Declarations within a module
    are scoped (encapsulated) to that module , by default. If we don''t explicitly
    export a certain value, that value is not available outside that module. This
    reduces the risk of name collisions for values declared in other parts of your
    codebase, since the values are not available on the global scope.


    # ## ES2015 Modules


    ES2015 introduced built-in JavaScript modules. A module is a file containing JavaScript
    code, with some difference in behavior compared to a normal script.'
  merge: -1
  pgno: 94
