  md: '# Concepts


    Like progressive hydration, streaming is another rendering mechanism that can
    be used to improve SSR performance. As the name suggests, streaming implies chunks
    of HTML are streamed from the node server to the client as they are generated.
    As the client starts receiving "bytes" of HTML earlier for large pages, the TTFB
    is reduced and relatively constant. All major browsers start parsing and rendering
    streamed content or the partial response earlier. As the rendering is progressive,
    it results in a fast FP and FCP. Streaming responds well to network backpressure.
    If the network is clogged and not able to transfer more bytes, the renderer gets
    a signal and stops streaming till the network is cleared up. Thus, the server
    uses less memory and is more responsive to I/O conditions. This enables your Node.js
    server to render multiple requests at the same time and prevents heavier requests
    from blocking lighter requests for a long time. As a result, the site stays responsive
    even in challenging conditions.


    # React for streaming


    React introduced support for streaming in React 16 released in 2016. The following
    API''s were included in the ReactDOMServer to support streaming.


    +   - ReactDOMServer.renderToNodeStream(element): The output HTML from this function
    is the same as ReactDOMServer.renderToNodeStream(element) but is in a Node.js
    readablestream format instead of a string. The function will only work on the
    server to render HTML as a stream. The client receiving this'
  merge: -1
  pgno: 261
- img_proc: false
  md: "stream can subsequently call ReactDOM.hydrate() to hydrate the page and make\
    \ it interactive.\n\n+   * ReactDOMServer.renderToStaticNodeStream(element): This\
    \ corresponds to ReactDOMServer.renderToStaticNodeStream(element). The HTML output\
    \ is the same as in a stream format. It can be used for rendering Frontend, static,\
    \ non-interactive pages on the server and then streaming them to the client.\n\
    \n```\nimport { renderToStream } from 'react-dom/server';\nimport Frontend from\
    \ '../client';\n\napp.use('*', (request, response) => {\n  // Send the start of\
    \ your HTML to the browser\n  response.write('<html><head><title>Page</title></head><div\
    \ id=\"root\"></div>');\n\n  // Render your frontend to a stream and pipe it to\
    \ the response\n  const stream = renderToNodeStream(<Frontend/>);\n  stream.pipe(response,\
    \ { end: false });\n  // Tell the stream not to automatically end the response\
    \ when the renderer\n  finishes.\n\n  // When React finishes rendering send the\
    \ rest of your HTML to the browser\n  stream.on('end', () => {\n    response.end('</div></body></html>');\n\
    \  });\n});\n```\n\n![](bbox=[0.823, 0.693, 0.897, 0.756])"
