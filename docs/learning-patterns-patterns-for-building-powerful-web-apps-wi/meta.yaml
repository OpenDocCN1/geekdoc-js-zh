- img_proc: false
  md: 'Some of the challenges with code-splitting are:


    +   - Outside of a meta-framework (like Next.js), you often have to tackle the
    optimization manually, replacing import statements with dynamic imports.

    - It might delay when the application begins loading the component impacting the
    user-experience.


    Server Components introduce automatic code-splitting treating all normal imports
    in Client components as possible code-split points. They also allow developers
    to select which component to use much earlier (on the server), allowing the client
    to fetch it earlier in the rendering process.


    # Will Server Components replace Next.js SSR?


    No. They are quite different. Initial adoption of Server Components will actually
    be experimented with meta-frameworks such as Next.js as research and experimentation
    continue.


    To summarize a good explanation of the differences between Next.js SSR and Server
    Components from Dan Abramov:


    +   - Code for Server Components is never delivered to the client. In many implementations
    of SSR using React, component code gets sent to the client via JavaScript bundles
    anyway. This can delay interactivity.

    - Server components enable access to the back-end from anywhere in the tree. When
    using Next.js, you''re used to accessing the back-end via getServerProps() which
    has the limitation of only working at the top-level page. Random npm components
    are unable to do this.'
  merge: -1
  pgno: 269
- img_proc: false
  md: '+   - Server Components may be refetched while maintaining Client-side state
    inside of the tree. This is because the main transport mechanism is much richer
    than just HTML, allowing the refetching of a server-rendered part (e.g such as
    a search result list) without blowing away state inside (e.g search input text,
    focus, text selection)


    Some of the early integration work for Server Components will be done via a webpack
    plugin in which:


    +   - Locates all Client components

    - Creates a mapping between IDs => chunk URLs

    - A Node.js loader replaces imports to Client components with references to this
    map.

    - Some of this work will require deeper integrations (e.g with pieces such as
    Routing) which is why getting this to work with a framework like Next.js will
    be valuable.


    As Dan notes, one of the goals of this work is to enable meta-frameworks to get
    much better.'
  merge: -1
