  md: "# Presentational Component\n\nA presentational component receives its data\
    \ through props. Its primary function is to simply display the data it receives\
    \ the way we want them to, including styles, without modifying that data.\n\n\
    Let's take a look at the example that displays the dog images. When rendering\
    \ the dog images, we simply want to map over each dog image that was fetched from\
    \ the API, and render those images. In order to do so, we can create a functional\
    \ component that receives the data through props, and renders the data it received.\n\
    \n```\nimport React from \"react\";\n\nexport default function DogImages({ dogs\
    \ }) {\n  return dogs.map((dog, i) => <img src={dog} key={i} alt=\"Dog\" />);\n\
    }\n```\n\nThe DogsImages component is a presentational component. Presentational\
    \ components are usually stateless: they do not contain their own React state,\
    \ unless they need a state for UI purposes. The data they receive, is not altered\
    \ by the presentational components themselves."
  merge: -1
  pgno: 76
- img_proc: false
  md: 'Presentational components receive their data from container components.


    # Container Components


    The primary function of container components is to pass data to functional components,
    which they contain. Container components themselves usually don''t render any
    other components besides presentational components that care about their data.
    Since they don''t render anything themselves, they usually do not contain any
    styling either.


    In our example, we want to pass dog images to the DogsImages presentational component.
    Before being able to do so, we need to fetch the images from an external API.
    We need to create a container component that fetches this data, and passes this
    data to the presentational component DogsImages in order to display it on the
    screen.'
