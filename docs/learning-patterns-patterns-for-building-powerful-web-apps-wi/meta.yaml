  md: 'This resulted in a 5-6% improvement in FCP and Speed Index.


    # Making the site responsive


    The movies app uses Next.js SSR to render the wrapper for the UI. Since the app
    can be accessed on both desktop and mobile devices, responsive design was essential.
    Combining responsive design with SSR has been a challenge because:


    +   1. The server where the content is rendered does not recognize the client
    window element. This methods like window.match() cannot be used to determine client
    details. Additionally, client hints are not supported across all browsers.

    2. Using CSS media query would result in rendering all of the elements regardless
    of whether they are used either on desktop or mobile.


    To address these challenges we used the @arts/fresnel library. The approach used
    here is that the server would still render all elements in the DOM with CSS breakpoints.
    Only components that match the breakpoints would be mounted. We were thus able
    to avoid duplicate markup and unnecessary rendering


    The following images compare the difference in markup rendered before and after
    the change for the same content.'
