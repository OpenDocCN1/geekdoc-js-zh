  md: 'Having global variables is generally considered as a bad design decision. Global
    scope pollution can end up in accidentally overwriting the value of a global variable,
    which can lead to a lot of unexpected behavior.


    In ES2015, creating global variables is fairly uncommon. The new let and const
    keyword prevent developers from accidentally polluting the global scope, by keeping
    variables declared with these two keywords-scoped. The new module system in JavaScript
    makes creating globally accessible values easier without polluting the global
    scope, by being able to export values from a module, and import those values in
    other files.


    However, the common usecase for a Singleton is to have some sort of state throughout
    your application. Having multiple parts of your codebase rely on the same mutable
    object can lead to unexpected behavior.


    Usually, certain parts of the codebase modify the values within this global state,
    whereas others consume that data. The order of execution here is important: we
    don''t want to accidentally consume data first, when there is no data to consume
    (yet)! Understanding the data flow when using a global state can get very tricky
    as your application grows, and dozens of components rely on each other.


    # State management in React


    In React, we often rely on a global state through state management tools such
    as Redux or React Context instead of Singletons. Although their global state behavior
    might seem similar to that of a Singleton, these tools provide a read-only state
    rather than the mutable state of the Singleton. When using'
