  md: '# Optimize your loading sequence


    Learn how to optimize your loading sequence to improve how quickly your app is
    usable


    Note: This article is heavily influenced by insights from the Aurora team in Chrome,
    in particular Shubhie Panicker who has been researching the optimal loading sequence.


    In every successful web page load, some critical components and resources become
    available at just the right time to give you a smooth loading experience. This
    ensures users perceive the performance of the application to be excellent. This
    excellent user experience should generally also translate to passing the Core
    Vitals.


    Key metrics such as First Content Paint, Largest Contentful Paint, First Input
    Delay, etc used to measure performance are directly dependent on the loading sequence
    of critical resources. For example, the page cannot have its LCP if a critical
    resource like the hero image is not loaded. This article talks about the relationship
    between the loading sequence of resources and web vitals. Our objective is to
    provide clear guidance on how to optimize the loading sequence for better web
    vitals.


    Before we establish an ideal loading sequence, let us first try to understand
    why it is so difficult to get the loading sequence right.'
  merge: -1
  pgno: 325
- img_proc: false
  md: '# Why is optimal loading difficult to achieve?


    We have had the unique opportunity to work on performance analysis for many of
    our partner''s websites. We identified multiple similar issues that plagued the
    efficient loading of pages across different partner sites.


    There is often a critical gap between developers'' expectations and how the browser
    prioritizes resources on the page. This often results in sub-optimal performance
    scores. We analyzed further to discover what caused this gap and the following
    points summarize the essence of our analysis.


    # Sub-optimal sequencing


    Webitals optimization requires not only a good understanding of what metrics stands
    for but also the order in which they occur and how they relate to different critical
    resources. FCP occurs before LCP which occurs before FID. As such, resources required
    for achieving FCP should be prioritized over those required by LCP followed by
    those required by FID.


    Resources are often not sequenced and pipelined in the correct order. This may
    be because developers are not aware of the dependency of metrics on resource loads.
    As a result, relevant resources are sometimes not available at the right time
    for the corresponding metric to trigger.


    # Examples:


    +   a) By the time FCP fires, the hero image should be available for firing LCP.

    b) By the time LCP fires, the JavaScript (JS) should be downloaded, parsed and
    ready (or already executing) to unblock interaction (FID).'
  merge: -1
  pgno: 326
- img_proc: false
  md: '# Network/CPU Utilization


    Resources are also not pipelined appropriately to ensure full CPU and Network
    utilization. This results in "Dead Time" on the CPU when the process is network
    bound and vice versa.


    A great example of this is scripts that may be downloaded concurrently or sequentially.
    As the bandwidth gets divided during concurrent download, the total time for downloading
    all scripts is the same for both sequential and concurrent downloads. If you download
    scripts concurrently, the CPU is underutilized during the download. However, if
    you download the scripts sequentially, the CPU can start processing the first
    one as soon as it is downloaded. This results in better CPU and Network utilization.


    # Third-Party (3P) Products


    3P libraries are often required to add common features and functionality to the
    website. Third parties include ads, analytics, social widgets, live chat, and
    other embeds that power a website. A third party library comes with its own JavaScript,
    images, fonts etc.


    3P products don''t usually have an incentive to optimize for and support the consumer
    site''s loading performance. They could have a heavy JavaScript execution cost
    that delays interactivity, or gets in the way of other critical resources being
    downloaded.


    Developers who include 3P products may tend to focus more on the value they add
    in terms of features rather than performance implications. As a result, 3P resources
    are sometimes added haphazardly, without full'
  merge: -1
  pgno: 327
- img_proc: false
  md: 'consideration in terms of how it fits into the overall loading sequence. This
    makes them hard to control and schedule.


    # Platform Quirks


    Browsers may differ in how they prioritize requests and implement hints. Optimization
    is easier if you have a deep knowledge of the platform and its quirks. Behavior
    particular to a specific browser makes it difficult to achieve the desired loading
    sequence consistently.


    An example of this is the preload bug on the chromium platform. The Preload (<link
    rel=preload>) instruction can be used to tell the browser to download key resources
    as soon as possible. It should only be used when you are sure that the resource
    will be used on the current page. The bug in Chromium causes it to behave such
    that requests issued via <link rel=preload> always start before other requests
    seen by the preload scanner even if those have higher priority. Issues such as
    these put a wrench in optimization plans.


    # HTTP2 Prioritization


    The protocol itself does not provide many options or knobs for adjusting the order
    and priority of resources. Even if better prioritization primitives were to be
    made available, there are underlying problems with HTTP2 prioritization that make
    optimal sequencing difficult. Mainly, we cannot predict in what order servers
    or CDN''s will prioritize requests for individual resources. Some CDN''s re-prioritize
    requests while others implement partial, flawed, or no prioritization.'
  merge: -1
  pgno: 328
- img_proc: false
  md: '# Resource level optimization


    Effective sequencing needs that the resources that are being sequenced to be served
    optimally so that they will load quickly. Critical CSS should be inlined, Images
    should be sized correctly and JS should be code-split and delivered incrementally.


    The framework itself is lacking constructs that allow code-splitting and serve
    JS and data incrementally. Users must rely on one of the following to split large
    chunks of 1P JS


    +   1. Modern React (Suspense / Concurrent mode / Data Fetching) - This is still
    available for experimentation only


    +   2. Lazy loading using dynamic imports - This is not intuitive and developers
    need to manually identify the boundaries along which to split the code.


    When code-splitting, developers need to achieve just the right granularity of
    chunks because of a granularity vs performance trade-off.


    Higher granularity is desirable because it


    +   1. Minimizes JS needed for individual route and on subsequent user interactions


    +   2. Allows for caching of common dependencies. This ensures that a change in
    the library doesn''t require re-fetching of the entire bundle.


    At the same time too much granularity when code-splitting can be bad because too
    many small chunks lower compression rates for individual chunks and affect browser
    performance.'
  merge: -1
  pgno: 329
- img_proc: false
  md: 'Resource optimization also requires the elimination of dead or unused code.
    Unnecessary or obsolete JS may be often shipped to modern browsers which negatively
    affects performance. JS transpiled to ES5 and bundled with polyfills is unnecessary
    for modern browsers. Libraries and npm packages are often not published in ES
    module format. This makes it hard for bundlers to tree shake and optimize.


    As you might have noticed, these issues are not limited to a particular set of
    resources or platforms. To work around these problems, one requires an understanding
    of the entire tech stack and how different resources can be coalesced to achieve
    optimal metrics. Before we define an overall optimization strategy, let us look
    at how individual resource requirements can defeat our purpose.


    # More on Resources - Relations, Constraints, and Priorities


    In the previous section, we gave a few examples of how certain resources are required
    for a specific event like FCP or LCP to fire. Let us try to understand all such
    dependencies first before we discuss a way to work with them. Following is a resource-wise
    list of recommendations, constraints, and gotchas that need to be considered before
    we define an ideal sequence.'
  merge: -1
  pgno: 330
- img_proc: false
  md: '# Critical CSS


    Critical CSS refers to the minimum CSS required for FCP. It is better to inline
    such CSS within HTML rather than import it from another CSS file. Only the CSS
    required for the route should be downloaded at any given time and all critical
    CSS should be split accordingly.


    If inlining is not possible, critical CSS should be preloaded and served from
    the same origin as the document. Avoid critical CSS from multiple domains or direct
    use of 3rd party critical CSS like Google Fonts. Your own server could serve as
    a proxy for 3rd party critical CSS instead.


    Delay in fetching CSS or incorrect order of fetching CSS could impact FCP and
    LCP. To avoid this, non-inlined CSS should be prioritized and ordered above 1P
    JS and ABT images on the network.


    Too much inlined CSS can cause HTML bloating and long style parsing times on the
    main thread. This can hurt the FCP. As identifying what is critical and code-splitting
    is essential.


    Inlined CSS cannot be cached. One workaround for this is to have a duplicate request
    for the CSS that can be cached. Note however, that this can result in multiple
    full-page layouts which could impact FID.


    # Fonts


    Like critical CSS, the CSS for critical fonts should also be inlined. If inlining
    is not possible the script should be loaded with a preconnect specified. Delay
    in fetching fonts, e.g., google fonts or fonts from a different domain can affect'
  merge: -1
  pgno: 331
- img_proc: false
  md: 'FCP. Preconnect tells the browser to set up connections to these resources
    earlier.


    Inlining fonts bloat the HTML significantly and delay initiating other critical
    resource fetches. Font fallback may be used to unblock FCP and make the text available.
    However, using font fallback can affect CLS due to jumping fonts. It can also
    affect FID due to a potentially large style and layout task on the main thread
    when the real font arrives.


    # Above the Fold (ABT) Images


    This refers to images that are initially visible to the user on page load because
    they are within the viewport. A special case for ABT images is the hero image
    for the page. All ABT images should be sized. Unsized images hurt the CLS metric
    because of the layout shift that occurs when they are fully rendered. Placeholders
    for ABT images should be rendered by the server.


    Delayed hero image or blank placeholders would result in a late LCP. Moreover,
    LCP will re-trigger, if the placeholder size does not match with the intrinsic
    size of the actual hero image and the image is not overlaid on replacement. Ideally,
    there should be no impact on FCP due to ABT images but in practice, an image can
    fire FCP.


    # Below the Fold (BTF) Images


    These are images that are not immediately visible to the user on page load. As
    such they are ideal candidates for lazy loading. This ensures that they do not
    contend with 1P JS or important 3P needed on the page. If BTF images were to be
    loaded before 1P JS or important 3P resources, FID would get delayed.'
  merge: -1
  pgno: 332
- img_proc: false
  md: '# 1P JavaScript


    1P JS impacts the interaction readiness of the application. It can get delayed
    on the network behind images & 3P JS and on the main thread behind 3P JS. As such
    it should start loading before ABT images on the network and execute before 3P
    JS on the main thread. 1P JS does not block FCP and LCP in pages that are rendered
    on the server-side.


    # 3P JavaScript


    3P sync script in HTML head block CSS & font parsing and therefore FCP. Sync script
    in the head also blocks HTML body parsing. 3P script execution on the main thread
    can delay 1P script execution and push out hydration and FID. As such, better
    control is required for loading 3P scripts.


    These recommendations and constraints would generally apply irrespective of the
    tech stack and browser. Note, how something that is a recommendation can also
    become a constraint. For example, inlining fonts and CSS is great, but too much
    of it can cause bloating. The trick is to find a balance between ''Too little
    Too late'' and ''Too much Too soon''.


    The following chart gives us an understanding of Chrome''s priorities for loading
    different resources. Combining the information on priorities and the discussion
    on resource types will help to better understand the loading sequence that is
    proposed in the next section.'
  merge: -1
