  md: '# Hooks


    It''s quite clear that class components aren''t always a great feature in React.
    In order to solve the common issues that React developers can run into when using
    class components, React introduced React Hooks. React Hooks are functions that
    you can use to manage a components state and lifecycle methods. React Hooks make
    it possible to:


    +   - add state to a functional component

    - manage a component''s lifecycle without having to use lifecycle methods such
    as componentDidMount and componentWillUnmount

    - reuse the same stateful logic among multiple components throughout the app


    First, let''s take a look at how we can add state to a functional component, using
    React Hooks.


    # State Hook


    React provides a hook that manages state within a functional component, called
    useState.


    Let''s see how a class component can be restructured into a functional component,
    using the useState hook. We have a class component called Input, which simply
