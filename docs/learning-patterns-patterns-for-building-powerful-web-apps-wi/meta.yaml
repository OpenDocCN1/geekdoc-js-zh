  md: "One way of exporting the functions, is by using named exports: we can simply\
    \ add the export keyword in front of the parts that we want to publicly expose.\
    \ In this case, we'll want to add the export keyword in front of every function,\
    \ since index.js should have access to all four functions.\n\n```\nexport function\
    \ add(x, y) {\n  return x + y;\n}\n\nexport function multiply(x) {\n  return x\
    \ * 2;\n}\n\nexport function subtract(x, y) {\n  return x - y;\n}\n\nexport function\
    \ square(x) {\n  return x * x;\n}\n```\n\nWe just made the add, multiply, subtract,\
    \ and square functions exportable! However, just exporting the values from a module\
    \ is not enough to make them publicly available to all files. In order to be able\
