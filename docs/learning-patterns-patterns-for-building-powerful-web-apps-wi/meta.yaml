  md: '# Key Considerations


    As discussed, SSG results in a great performance for websites as it cuts down
    the processing required both on the client and the server. The sites are also
    SEO friendly as the content is already there and can be rendered by web-rawlers
    with no extra effort. While performance and SEO make SSG a great rendering pattern,
    the following factors need to be considered when assessing the suitability of
    SSG for specific applications.


    +   1. A large number of HTML files: Individual HTML files need to be generated
    for every possible route that the user may access. For example, using it for a
    blog, an HTML file will be generated for every blog post available in the data
    store. Subsequently, edits to any of the posts will require a rebuild for the
    update to be reflected in the static HTML files. Maintaining a large number of
    HTML files can be challenging.


    +   2. Hosting Dependency: For an SSG site to be super-fast and respond quickly,
    the hosting platform used to store and serve the HTML files should also be good.
    Superlative performance is possible if a well-tuned SSG website is hosted on multiple
    CDNs to take advantage of edge-caching.


    +   3. Dynamic Content: An SSG site needs to be built and re-deployed every time
    the content changes. The content displayed may be stale if the site has not been
    built + deployed after any content change. This makes SSG unsuitable for highly
    dynamic content.'
  merge: -1
  pgno: 238
- img_proc: false
  md: '# # Incremental Static Generation


    Update static content after you have built your site


    Static Generation (SSG) addresses most of the concerns of SSR and CSR but is suitable
    for rendering mostly static content. It poses limitations when the content to
    be rendered is dynamic or changing frequently.


    Think of a growing blog with multiple posts. You wouldn''t possibly want to rebuild
    and redeploy the site just because you want to correct a typo in one of the posts.
    Similarly, one new blog post should also not require a rebuild for all the existing
    pages. Thus, SSG on its own is not enough for rendering large websites or applications.


    The Incremental Static Generation (iSSG) pattern was introduced as an upgrade
    to SSG, to help solve the dynamic data problem and help static sites scale for
    large amounts of frequently changing data. iSSG allows you to update existing
    pages and add new ones by pre-rendering a subset of pages in the background even
    while fresh requests for pages are coming in.'
  merge: -1
  pgno: 239
- img_proc: false
  md: '# Sample Code


    iSSG works on two fronts to incrementally introduce updates to an existing static
    site after it has been built.


    +   1. Allows addition of new pages

    2. Allows updates to existing pages also known as Incremental Static "Re"generation


    # Adding New pages


    The lazy loading concept is used to include new pages on the website after the
    build. This means that the new page is generated immediately on the first request.
    While the generation takes place, a fallback page or a loading indicator can be
    shown to the user on the front-end. Compare this to the SSG scenario discussed
    earlier for individual details page per product. The 404 error page was shown
    here as a fallback for non-existent pages.


    Let us now look at the Next.js code required for lazy-loading the non-existent
    page with iSSG.'
