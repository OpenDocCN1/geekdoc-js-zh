  md: '# Proposed Sequence without 3P


    Following is a loading sequence that takes into account all of the constraints
    discussed previously. Let us first tackle a sequence without 3P. We will then
    see how 3P resources can be interleaved in this sequence. Note that, we have considered
    Google Fonts as 1P here.


    | Sequence of events on the main browser thread | Sequence of requests on the
    network. |

    |---|---|---||

    | 1 | Parse the HTML | Small inline 1P scripts. | 1 |

    | 2 | Execute small inline 1P scripts | Inlined critical CSS (Preload if external)
    | 2 |

    | | | Inlined critical Fonts (Preconnect if external) | 3 |

    | 3 | Parse FCP resources (critical CSS, font) | LCP Image (Preconnect if external)
    | 4 |

    | First Contentful Paint (FCP) | | Fonts (triggered from inline font-css (Preconnect))
    | 5 |

    | 4 | Render LCP resources (Hero image, text) | Non-critical (async) CSS | 6 |

    | | | First-party JS for interactivity | 7 |

    | | | Above the fold images (preconnect) | 8 |

    | Largest Contentful Paint (LCP) | | Below the fold images | 9 |

    | 5 | Render important ABT images | | |

    | Visually Complete | | | |'
  merge: -1
  pgno: 337
- img_proc: false
  md: '| 6 | Parse Non-critical (async) CSS | | |

    | 7 | Execute 1P JS and hydrate | Lazy-loaded JS chunks | 10 |


    While some parts of this sequence may be intuitive, the following points will
    help to justify it further.


    +   1. We recommend avoiding preload as much as possible because it forces manual
    preload on every preceding resource and also causes manual curation of ordering.
    Preload should be especially avoided on fonts, as it is tricky to detect critical
    fonts.

    2. Font-CSS should be ideally inlined. Fonts from another origin should be fetched
    using preconnect.

    3. Preconnect is recommended for all resources from another origin. This will
    ensure that a connection is established in advance for downloading these resources.

    4. Non-critical CSS should be fetched before user interaction begins (FID). This
    would avoid styling problems due to subsequent rendering of such CSS.

    5. Start fetching first-party JS before ABT images on the network. It will take
    some time to download and parse the JS.

    6. Parsing of the HTML on the main thread and download of ABT images can continue
    in parallel while 1P JS is parsed.'
  merge: -1
  pgno: 338
- img_proc: false
  md: '# Proposed Sequence with 3P


    Finally, we have reached the stage where we can propose a sequence for all key
    resources that are commonly loaded in a modern web application. Following is what
    the sequence for events on the main browser thread and network fetch requests
    will look like with 3P resources in the picture.


    | Sequence of events on the main browser thread | Sequence of requests on the
    network. | |

    |---|---|-|

    | 1 | Parse the HTML | FCP blocking 3P resources | 1 |

    | | | Small inline 1P scripts. | 2 |

    | 2 | Execute small inline 1P scripts | Inlined critical CSS (Preload if external)
    | 3 |

    | 3 | Parse FCP blocking 3P resources | Inlined critical Fonts (Preconnect if
    external) | 4 |

    | 4 | Parse FCP resources (critical CSS, font) | 3P personalized ABT image required
    for LCP | 5 |

    | First Contentful Paint (FCP) | LCP Image (Preconnect if external) | 6 |'
  merge: -1
  pgno: 339
- img_proc: false
  md: '| 5 | Render 3P personalized ABT image required for LCP | Fonts (triggered
    from inline font-css (Preconnect) | 7 |

    | | | Non-critical (async) CSS | 8 |

    | 6 | Render LCP resources (Hero image, text) | 3P that must execute before first
    user interaction | 9 |

    | | | First-party JS for interactivity | 10 |

    | Largest Contentful Paint (LCP) | | Above the fold images (preconnect) | 11 |

    | 7 | Render important ABT images | Default 3P JS | 12 |

    | 8 | Parse Non-critical (async) CSS | Below the fold images | 13 |

    | 9 | Execute 3P required for first user interaction | | |

    | 10 | Execute 1P JS and hydrate | Lazy-loaded JS chunks | 14 |

    | First Input Delay (FID) | | Less important 3P JS | 15 |


    The main concern here is how do you ensure that 3P scripts are downloaded optimally
    and in the required sequence.

    Since the script request goes to another domain, preconnect is recommended for
    the following 3P requests. This helps to optimize the download.


    +   #1 - FCP blocking 3P resources

    #5 - 3P personalized ABT image required for LCP

    #9 - 3P that must execute before first user interaction

    #12 - Default 3P JS'
