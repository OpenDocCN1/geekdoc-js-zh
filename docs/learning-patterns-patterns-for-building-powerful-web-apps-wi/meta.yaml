  md: "```\nimport React from 'react';\nimport ReactDOM from 'react-dom';\nimport\
    \ { FixedSizeGrid as Grid } from 'react-window';\n\nconst itemsArray = [\n  [{},{},{},...],\n\
    \  [{},{},{},...],\n  [{},{},{},...],\n  [{},{},{},...],\n];\n\nconst Cell = ({\
    \ columnIndex, rowIndex, style }) => (\n<div\n  className={n    columnIndex %\
    \ 2 === 0\n    ? 'GridItemOdd'\n    : 'GridItemEven'\n  }\n{\n    rowIndex % 2\n\
    \    ? 'GridItemOdd'\n    : 'GridItemEven'\n  }\n  style={style}>\n  {itemsArray[rowIndex][columnIndex].name}\n\
    </div>\n);\n\nconst Example = () => (\n<Grid\n  className=\"Grid\"\n  columnCount={5}\n\
    \  columnWidth={100}\n  height={150}\n  rowCount={5}\n  rowHeight={35}\n  width={300}\n\
