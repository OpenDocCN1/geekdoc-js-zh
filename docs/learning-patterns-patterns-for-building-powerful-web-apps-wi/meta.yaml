  md: '# Rendering with JSX


    We will be using JSX in a number of our examples. JSX is an extension of JavaScript
    which embed template HTML in JS using XML-like syntax. It is meant to be transformed
    into valid JavaScript, though the semantics of transformation are implementation-specific.
    JSX rose to popularity with the React library, but has since seen other implementations
    as well.


