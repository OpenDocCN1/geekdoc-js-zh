    # How do we avoid losing early clicks?


    In the framework stack used by these Google teams, we can track clicks early because
    the first chunk of HTML includes a small event library (JSAction) which tracks
    all clicks before the framework is bootstrapped. The events are used for two things:


    +   - Triggering download of component code based on user interactions


    +   - Replaying user interactions when the framework finishes bootstrapping'
  merge: -1
