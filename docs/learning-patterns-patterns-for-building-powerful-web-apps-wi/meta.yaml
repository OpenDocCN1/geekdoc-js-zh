  md: 'and TTI are pushed forward. This implies that the user will see a blank screen
    for the entire duration between FP and FCP.


    # Client-side React - Pros and Cons


    With React most of the application logic is executed on the client and it interacts
    with the server through API calls to fetch or save data. Almost all of the UI
    is thus generated on the client. The entire web application is loaded on the first
    request. As the user navigates by clicking on links, no new request is generated
    to the server for rendering the pages. The code runs on the client to change the
    view/data.


    CSR allows us to have a Single-Page Application that supports navigation without
    page refresh and provides a great user experience. As the data processed to change
    the view is limited, routing between pages is generally faster making the CSR
    application seem more responsive. CSR also allows developers to achieve a clear
    separation between client and server code. Despite the great interactive experience
    that it provides, there are a few pitfalls to this CSR.


    +   1. SEO considerations: Most web crawlers can interpret server rendered websites
    in a straight-forward manner. Things get slightly complicated in the case of client-side
    rendering as large payloads and a waterfall of network requests (e.g for API responses)
    may result in meaningful content not being rendered fast enough for a crawler
    to index it. Crawlers may understand JavaScript but there are limitations. As
    such, some workarounds are required'
  merge: -1
  pgno: 219
- img_proc: false
  md: 'to make a client-rendered website SEO friendly.


    +   2. **Performance**: With client-side rendering, the response time during interactions
    is greatly improved as there is no round trip to the server. However, for browsers
    to render content on client-side the first time, they have to wait for the JavaScript
    to load first and start processing. Thus users will experience some lag before
    the initial page loads. This may affect the user experience as the size of JS
    bundles get bigger and/or the client does not have sufficient processing power.


    +   3. **Code Maintainability**: Some elements of code may get repeated across
    client and server (APIs) in different languages. In other cases, clean separation
    of business logic may not be possible. Examples of this could include validations
    and formatting logic for currency and date fields.


    +   4. **Data Fetching**: With client-side rendering, data fetching is usually
    event-driven. The page could initially be loaded without any data. Data may be
    subsequently fetched on the occurrence of events like page-load or button-clicks
    using API calls. Depending on the size of data this could add to the load/interaction
    time of the application.


    The importance of these considerations may be different across applications. Developers
    are often interested in finding SEO friendly solutions that can serve pages faster
    without compromising on the interaction time. Priorities assigned to the different
    performance criteria may be different based on application requirements. Sometimes
    it may be enough to use client-side rendering with some tweaks instead of going
    for a completely different pattern.'
  merge: -1
