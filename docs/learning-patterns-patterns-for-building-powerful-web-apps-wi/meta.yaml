  md: 'When a component needs access to multiple resolvers, we need to compose multiple
    graphql() higher order components in order to do so. Composing multiple HOCs can
    make it difficult to understand how the data is passed to your components. The
    order of the HOCs can matter in some cases, which can easily lead to bugs when
    refactoring the code.


    After the release of Hooks, Apollo added Hooks support to the Apollo Client library.
    Instead of using the graphql() higher order component, developers can now directly
    access the data through the hooks that the library provides.


    # Pros


    Using the Higher Order Component pattern allows us to keep logic that we want
    to re-use all in one place. This reduces the risk of accidentally spreading bugs
    throughout the application by duplicating code over and over, potentially introducing
    new bugs each time. By keeping the logic all in one place, we can keep our code
    DRY and easily enforce separation of concerns


    # Cons


    The name of the prop that a HOC can pass to an element, can cause a naming collision.'
