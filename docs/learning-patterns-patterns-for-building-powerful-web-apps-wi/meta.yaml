  md: 'React 18 solves these problems by allowing us to combine streaming server-side
    rendering with a new approach to hydration: Selective Hydration!


    Instead of using the renderToString method that we covered earlier, we can now
    stream render HTML using the new pipeToNodeStream method on the server.


    This method, in combination with the createRoot method and Suspense, makes it
    possible to start streaming HTML without having to wait for the larger components
    to be ready. This means we can lazy-load components when using SSR, which wasn’t
    (really) possible before!


    ```

    index.js

    import { hydrateRoot } from ''react-dom'';

    import App from ''./App'';


    hydrateRoot(document, <App />);

    ```'
