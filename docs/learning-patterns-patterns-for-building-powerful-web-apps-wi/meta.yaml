  md: '# # Streaming Server-Side Rendering


    Generate HTML to be rendered on the server in response to a user request


    We can reduce the TTI while still server rendering our application by streaming
    server rendering the contents of our application. Instead of generating one large
    HTML file containing the necessary markup for the current navigation, we can split
    it up into smaller chunks! Node streams allow us to data into the response object,
    which means that we can continuously send data down to the client. The moment
    the client receives the chunks of data, it can start rendering the contents.


    React''s built-in renderToNodeStream makes it possible for us to send our application
    in smaller chunks. As the client can start painting the UI when it''s still receiving
    data, we can create a very performant first-load experience. Calling the hydrate
    method on the received DOM nodes will attach the corresponding event handlers,
    which makes the UI interactive!'
  merge: -1
