  md: '# SEO enabled


    Search engine crawlers are easily able to crawl the content of an SSR application
    thus ensuring higher search engine optimization on the page. SSR works great for
    static content due to the above advantages. However, it does have a few disadvantages
    of which it is not perfect for all scenarios.


    # Slow TTFB


    Since all processing takes place on the server, the response from the server may
    be delayed in case of one or more of the following scenarios


    +   - Multiple simultaneous users causing excess load on the server.

    - Slow network

    - Server code not optimized.


    # Full page reloads required for some interactions


    Since all code is not available on the client, frequent round trips to the server
    are required for all key operations causing full page reloads. This could increase
    the time between interactions as users are required to wait longer between operations.
    A single-page application is thus not possible with SSR.


    To address these drawbacks, modern frameworks and libraries allow rendering on
    both server and client for the same application. We will go into details of these
    in the following sections. First, let''s look at a simpler form of SSR with Next.js.'
