  md: 'Although we use the observer pattern in many ways, it can be very useful when
    working with asynchronous, event-based data. Maybe you want certain components
    to get notified whenever certain data has finished downloading, or whenever users
    sent new messages to a message board and all other members should get notified.


    # Pros


    Using the observer pattern is a great way to enforce separation of concerns and
    the single-responsibility principle. The observer objects aren’t tightly coupled
    to the observable object, and can be (de)coupled at any time. The observable object
    is responsible for monitoring the events, while the observers simply handle the
    received data.


    # Cons


    If an observer becomes too complex, it may cause performance issues when notifying
    all subscribers.


    # Case study


    A popular library that uses the observable pattern is RxJS.


    ReactiveX combines the Observer pattern with the Iterator pattern and functional
    programming with collections to fill the need for an ideal way of managing sequences
    of events. - RxJS'
