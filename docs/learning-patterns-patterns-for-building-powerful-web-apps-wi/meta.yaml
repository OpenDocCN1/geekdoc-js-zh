  md: '# Hooks Pattern


    Use functions to reuse stateful logic among multiple components throughout the
    app


    React 16.8 introduced a new feature called Hooks. Hooks make it possible to use
    React state and lifecycle methods, without having to use a ES2015 class component.


    Although Hooks are not necessarily a design pattern, Hooks play a very important
    role in your application design. Many traditional design patterns can be replaced
    by Hooks.


    # Class components


    Before Hooks were introduced in React, we had to use class components in order
    to add state and lifecycle methods to components. A typical class component in
    React can look something like:'
