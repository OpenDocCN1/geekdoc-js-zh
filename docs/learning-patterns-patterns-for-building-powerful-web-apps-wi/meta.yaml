  md: '+   - React Select Search was used instead of React Select which led to a 35%
    improvement in the LCP with a 100% improvement in CLS and 18% in TBT.

    - The use of React Glider instead of React Slick improved TBT by 77%.

    - Usage of React Scrolling instead of native smooth scrolling provided cross-browser
    compatibility for the scrolling feature.

    - React Stars component was used instead of React Rating which helped to boost
    TBT by 33%.


    # SVG icon library


    SVG icons were the obvious choice for all our icon across the Movies app. We initially
    chose Font-Awesome due to its popularity and ease of use as a scalable vector
    icon library with icons that are customizable using CSS. However, there had been
    concerns that Font-Awesome may be slow to load on web pages due to the large transfer
    sizes when loading the library. This affects Lighthouse performance score.


    We replaced Font-Awesome with @svggr as our SVG icon provider. Another change
    was to import individual icons on all our pages instead of the library itself
    even if the page uses multiple icons. For example:


    ```

    import { FontAwesomeIcon } from ''@fortawesome/react-fontawesome'';


    // replaced by

    import HeartIcon from ''public/assets/svgs/icons/heart.svg'';

    import PollIcon from ''public/assets/svgs/icons/poll.svg'';

    import CalendarIcon from ''public/assets/svgs/icons/calendar.svg'';

    import DotCircleIcon from ''public/assets/svgs/icons/dot-circle.svg'';

    ```'
