  md: '# # Selective Hydration


    How to use combine streaming server-side rendering with a new approach to hydration,
    selective hydration


    In previous articles, we covered how SSR with hydration can improve user experience.
    React is able to (quickly) generate a tree on the server using the renderToString
    method that the react-dom/server library provides, which gets sent to the client
    after the entire tree has been generated. The rendered HTML is not interactive,
    until the JavaScript bundle has been fetched and loaded, after which React walks
    down the tree to hydrate and attaches the handlers. However, this approach can
    lead to some performance issues due to some limitations with the current implementation.


    Before the server-rendered HTML tree is able to get to the client, all components
    need to be ready. This means that components that may rely on an external API
    call or any process that could cause some delays, might end up blocking smaller
    components from being rendered quickly.


    Besides a slower tree generation, another issue is the fact that React only hydrates
    the tree once. This means that before React is able to hydrate any of the components,
    it needs to have fetched the JavaScript for all of the components before it''s
    able to hydrate any of them. This means that smaller components (with smaller
    bundles) have to wait for the larger components''s code to be fetched and loaded,
    until React is able to hydrate anything on your website. During this time, the
    website remained non-interactive.'
  merge: -1
  pgno: 271
