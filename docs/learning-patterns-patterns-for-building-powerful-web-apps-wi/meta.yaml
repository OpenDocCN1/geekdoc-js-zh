    We can also import all exports from a module, meaning all named exports and the
    default export, by using an asterisk * and giving the name we want to import the
    module as. The value of the import is equal to an object containing all the imported
    values.


    Say that you want to import the entire module as math.


    ```

    import * as math from "./math.js";

    ```


    The imported values are properties on the math object.'
