    \ {\n  return x * 2;\n}\nfunction subtract(x, y) {\n  return x - y;\n}\nfunction\
    \ square(x) {\n  return x * x;\n}\n```\n\nWe have a math.js file containing some\
    \ simple mathematical logic. We have functions that allow users to add, multiply,\
