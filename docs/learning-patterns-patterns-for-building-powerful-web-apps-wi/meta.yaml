  md: "# Reflect\n\nJavaScript provides a built-in object called Reflect, which makes\
    \ it easier for us to manipulate the target object when working with proxies.\n\
    \nPreviously, we tried to modify and access properties on the target object within\
    \ the proxy through directly getting or setting the values with bracket notation.\
    \ Instead, we can use the Reflect object. The methods on the Reflect object have\
    \ the same name as the methods on the handler object.\n\nInstead of accessing\
    \ properties through obj[prop] or setting properties through obj[prop] = value,\
    \ we can access or modify properties on the target object through Reflect.get()\
    \ and Reflect.set(). The methods receive the same arguments as the methods on\
    \ the handler object.\n\n```\nconst personProxy = new Proxy(person, {\n  get:\
    \ (obj, prop) => {\n    console.log(`The value of ${prop} is ${Reflect.get(obj,\
    \ prop)}`);\n  },\n  set: (obj, prop, value) => {\n    console.log(`Changed ${prop}\
    \ from ${obj[prop]} to ${value}\\`);\n    Reflect.set(obj, prop, value);\n  }\n\
    });\n```\n\nPerfect! We can access and modify the properties on the target object\
    \ easily with the Reflect object."
  merge: -1
  pgno: 52
