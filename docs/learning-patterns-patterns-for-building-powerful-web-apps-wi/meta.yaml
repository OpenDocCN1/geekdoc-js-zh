  md: '# # Bundle Splitting


    Split your code into small, reusable pieces


    When building a modern web application, bundlers as Webpack or Rollup take an
    application''s source code, and bundle this together into one or more bundles.
    When a user visits a website, the bundle is requested and loaded in order to display
    the data to the user''s screen.


    JavaScript engines such as V8 are able to parse and compile data that''s been
    requested by the user as it''s being loaded. Although modern browsers have evolved
    to parse and compile the code as quickly and performant as possible, the developer
    is still in charge of optimizing two steps in the process: the loading time and
    execution time of the requested data. We want to make sure we''re keeping the
    execution time as short as possible to prevent blocking the main thread


    Even though modern browsers are able to stream the bundle as it arrives, it can
    still take a significant time before the first pixel is painted on the user''s
    device. The bigger the bundle the longer it can take before the engine reaches
    the line on which the first rendering call has been made. Until that time, the
    user has to stare at a blank screen for quite some time, which can be.. highly
    frustrating!'
  merge: -1
  pgno: 384
