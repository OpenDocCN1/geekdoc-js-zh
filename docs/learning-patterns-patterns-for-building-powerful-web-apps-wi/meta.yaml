  md: "After the release of Hooks, Apollo added Hooks support to the Apollo Client\
    \ library. Instead of the Mutation and Query render props, developers can now\
    \ directly access the data through the hooks that the library provides.\n\nLet's\
    \ look at an example that uses the exact same data as we previously saw in the\
    \ example with the Query render prop. This time, we'll provide the data to the\
    \ component by using the use hook that Apollo Client provided for us.\n\n```\n\
    import React, { useState } from \"react\";\nimport \"./styles.css\";\n\nimport\
    \ { useMutation } from \"@apollo/react-hooks\";\nimport { ADD_MESSAGE } from \"\
    ./resolvers\";\n\nexport default function Input() {\n  const [message, setMessage]\
    \ = useState(\"\");\n  const [addMessage] = useMutation(ADD_MESSAGE, {\n    variables:\
    \ { message }\n  });\n\n  return (\n    <div className=\"input-row\">\n      <input\n\
    \        onChange={(e) => setMessage(e.target.value)}\n        type=\"text\"\n\
    \        placeholder=\"Type something...\"\n      />\n      <button onClick={addMessage}>Add</button>\n\
    \    </div>\n  );\n}\n```\n\n![](bbox=[0.786, 0.903, 0.877, 0.971])"
