  md: "# Mixin Pattern\n\nAdd functionality to objects or classes without inheritance\n\
    \nA mixin is an object that we can use in order to add reusable functionality\
    \ to another object or class, without using inheritance. We can't use mixins on\
    \ their own: their sole purpose is to add functionality to objects or classes\
    \ without inheritance.\n\nLet's say that for our application, we need to create\
    \ multiple dogs. However, the basic dog that we create doesn't have any properties\
    \ but a name property.\n\n```\nclass Dog {\n  constructor(name) {\n    this.name\
    \ = name;\n  }\n}\n```\n\nA dog should be able to do more than just have a name.\
    \ It should be able to bark, wag its tail, and play! Instead of adding this directly\
    \ to the Dog, we can create a mixin that provides the bark, wagTail and play property\
    \ for us."
