  md: '# Patterns - A Quick Look


    Client-Side Rendering (CSR) and Server-Side Rendering (SSR) form the two extremes
    of the spectrum of choices available for rendering. The other patterns listed
    in the following illustration use different approaches to provide some combination
    of features borrowed from both CSR and SSR.


    | | Server | "Static SSR" | SSR with (Re)hydration | CSR with Prendering | Full
    CSR |

    |---|---|---|---|---||

    | Overview | An application where input is navigation requests and the HTML is
    respond to them. | Built as a Single Page App, but all pages rendered to static
    HTML, but JS is rendered on the client. | Built as a Single Page App. The server
    renders pages, the full page is rendered on the client. | A Single Page App, where
    the initial shell/skeleton is rendered to static HTML at build time. | A Single
    Page App, and booting is done on the client. enhanced by script & style tags.
    |

    | Authoring | Entirely server-side | Built as client-side | Built as client-side
    | Client-side | Client-side |

    | Rendering | Dynamic HTML | Static HTML | Dynamic HTML and/DOM | Partial static
    HTML then JS/DOM | Entirely JS/DOM |

    | Server role | Controls all aspects. | Delivers static HTML | Renders pages |
    Delivers static HTML | Delivers static HTML |

    | Pros | + FCP Fully streaming | + Fast TTLB + FCP Fully streaming | + Flexible
    | Flexible Fast TTLB | Flexible Fast TTLB |

    | Cons | - Slow TTLB Inflexible | - Waterfall leads to hydration | - Slow TTLB
    TTI >>> Usually used | - TTI >> Limited streaming | - TTI >>> No streaming |

    | Scales via | Infra size / cost | build/deploy size | Infra size & JS size |
    JS size | JS size |

    | Examples | Gmail HTML, Hacker News | Docusaurus, Netflix* | Next.js, Racelle
    | Gatsby, Vuepress, etc | Most apps |


    We will explore each of these patterns. After that, let us talk about Next.js
    which is a React-based framework. Next.js is relevant to our discussion because
    it can be used to implement all of the patterns.


    +   - SSR'
