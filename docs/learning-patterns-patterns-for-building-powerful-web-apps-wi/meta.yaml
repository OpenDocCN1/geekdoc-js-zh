    \  lastName,\n  email,\n  fullName() {\n    return `${this.firstName} ${this.lastName}`;\n\
    \  }\n};\n\nconst user1 = createUser({\n  firstName: \"John\",\n  lastName: \"\
    Doe\",\n  email: \"john@doe.com\"\n});\n\nconst user2 = createUser({\n  firstName:\
    \ \"Jane\",\n  lastName: \"Doe\",\n  email: \"jane@doe.com\"\n});\n\nconsole.log(user1);\n\
    console.log(user2);\n```\n\nThe factory pattern can be useful if we're creating\
    \ relatively complex and configurable objects. It could happen that the values\
    \ of the keys and values are dependent on a certain environment or configuration.\
    \ With the factory pattern, we can easily create new objects that contain the\
    \ custom keys and values!\n\n```\nconst createObjectFromArray = ([key, value])\
    \ => ({\n  [key]: value\n});\n\ncreateObjectFromArray([\"name\", \"John\"]); //\
    \ name: { \"John\" }\n```"
  merge: -1
