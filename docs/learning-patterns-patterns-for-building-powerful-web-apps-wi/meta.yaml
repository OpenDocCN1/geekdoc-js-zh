  md: "# # Command Pattern\n\nDecouple methods that execute tasks by sending commands\
    \ to a commander\n\nWith the Command Pattern, we can decouple objects that execute\
    \ a certain task from the object that calls the method.\n\nLet's say we have an\
    \ online food delivery platform. Users can place, track, and cancel orders.\n\n\
    ```\nclass OrderManager() {\n  constructor() {\n    this.orders = []\n  }\n\n\
    \  placeOrder(order, id) {\n    this.orders.push(id);\n    return `You have successfully\
    \ ordered ${order} (${id})`;`;\n  }\n\n  trackOrder(id) {\n    return `Your order\
    \ ${id} will arrive in 20 minutes.`;\n  }\n\n  cancelOrder(id) {\n    this.orders\
    \ = this.orders.filter(order => order.id !== id);\n    return `You have canceled\
    \ your order ${id}`;\n  }\n}\n```"
  merge: -1
  pgno: 199
- img_proc: false
  md: 'On the OrderManager class, we have access to the placeOrder, trackOrder and
    cancelOrder methods. It would be totally valid JavaScript to just use these methods
    directly!


    ```

    const manager = new OrderManager();


    manager.placeOrder("Pad Thai", "1234");

    manager.trackOrder("1234");

    manager.cancelOrder("1234");

    ```


    However, there are downsides to invoking the methods directly on the manager instance.
    It could happen that we decide to rename certain methods later on, or the functionality
    of the methods change.


    Say that instead of calling placeOrder, we now rename it to addOrder! This would
    mean that we would have to make sure that we don''t call the placeOrder method
    anywhere in our codebase, which could be very tricky in larger applications.


    Instead, we decouple the methods from the manager object, and create separate
    command functions for each command!


    Let''s refactor the OrderManager class: instead of having the placeOrder, cancelOrder
    and trackOrder methods, it will have one single method: execute. This method will
    execute any command it''s given.'
  merge: -1
