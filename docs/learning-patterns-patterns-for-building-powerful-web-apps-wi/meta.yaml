  md: '# Trade-offs


    Shifting costly work closer to user-interaction can optimize how quickly pages
    initially load, however the technique is not without trade-offs.


    # What happens if it takes a long time to load a script after the user clicks?


    In the Google Hotels example, small granular chunks minimize the chance a user
    is going to wait long for code and data to fetch and execute. In some of the other
    cases, a large dependency may indeed introduce this concern on slower networks.


    One way to reduce the chance of this happening is to better break-up the loading
    of, or prefetch these resources after critical content in the page is done loading.
    I''d encourage measuring the impact of this to determine how much it''s a real
    application in your apps.


    # What about lack of functionality before user interaction?


    Another trade-off with facades is a lack of functionality prior to user interaction.
    An embedded video player for example will not be able to autoplay media. If such
    functionality is key, you might consider alternative approaches to loading the
    resources, such as lazy-loading these third-party iframes on the user scrolling
    them into view rather than deferring load until interaction.'
  merge: -1
  pgno: 379
