  md: '# Mediator/

    Middleware Pattern


    Use a central mediator object to handle communication between components


    The mediator pattern makes it possible for components to interact with each other
    through a central point: the mediator. Instead of directly talking to each other,
    the mediator receives the requests, and sends them forward! In JavaScript, the
    mediator is often nothing more than an object literal or a function.


    You can compare this pattern to the relationship between an air traffic controller
    and a pilot. Instead of having the pilots talk to each other directly, which would
    probably end up being quite chaotic, the pilots talk the air traffic controller.
    The air traffic controller makes sure that all planes receive the information
    they need to fly safely, without hitting the other airplanes.


    Although we are hopefully not controlling airplanes in JavaScript, we often have
    to deal with multidirectional data between objects. The communication between
    the components can get rather confusing if there is a large number of components.'
