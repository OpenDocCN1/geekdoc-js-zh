  md: 'Extracting components seems like a tedious job, but having reusable components
    makes things easier when coding for larger apps. A good criterion to consider
    when simplifying components is this: if a part of your UI is used several times
    (Button, Panel, Avatar), or is complex enough on its own (App, FeedStory, Comment),
    it is a good candidate to be extracted to a separate component.


    # Props


    Props are a short form for properties, and they simply refer to the internal data
    of a component in React. They are written inside component calls and passed into
    components. They also use the syntax as HTML attributes, e.g. prop="value". Two
    things are worth remembering about props; Firstly, we determine the value of a
    prop and use it as part of the blueprint before the component is built. Secondly,
    the value of a prop will never change, i.e. props are read-only once they are
    passed into components.


    The way you access a prop is by referencing it via the "this.props" property that
    every component has access to.


    # State


    State is an object that holds some information that may change over the lifetime
    of the component. Meaning it is just the current snapshot of data stored in a
    component''s Props. The data can change over time, so techniques to manage the
    way that data changes become necessary to ensure the component looks the way engineers
    want it to, at just the right time — this is called State management.'
  merge: -1
