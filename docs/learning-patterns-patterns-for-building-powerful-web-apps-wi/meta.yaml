  md: "# # Flyweight Pattern\n\nReuse existing instances when working with identical\
    \ objects\n\nThe flyweight pattern is a useful way to conserve memory when we're\
    \ creating a large number of similar objects.\n\nIn our application, we want users\
    \ to be able to add books. All books have a title, an author, and an isbn number!\
    \ However, a library usually doesn't have just one copy of a book: it usually\
    \ has multiple copies of the same book.\n\nIt wouldn't be very useful to create\
    \ a new book instance each time if there are multiple copies of the exact same\
    \ book. Instead, we want to create multiple instances of the Book constructor,\
    \ that represent a single book.\n\n```\nclass Book {\n  constructor(title, author,\
    \ isbn) {\n    this.title = title;\n    this.author = author;\n    this.isbn =\
    \ isbn;\n  }\n}\n```\n\nLet's create the functionality to add new books to the\
    \ list. If a book has the same ISBN number, thus is the exact same book type,\
    \ we don't want to create"
  merge: -1
  pgno: 181
- img_proc: false
  md: "an entirely new Book instance. Instead, we should first check whether this\
    \ book already exists.\n\n```\nconst isbnNumbers = new Set();\n\nconst createBook\
    \ = (title, author, isbn) => {\nconst book = isbnNumbers.has(isbn);\n\nif (book)\
    \ {\n  return book;\n}\n}\n```\n\nIf it doesn't contain the book's ISBN number\
    \ yet, we'll create a new book and add its ISBN number to the isbnNumbers set.\n\
    \n```\nconst createBook = (title, author, isbn) => {\nconst book = isbnNumbers.has(isbn);\n\
    \nif (book) {\n  return book;\n}\n\nconst book = new Book(title, author, isbn);\n\
    isbnNumbers.add(isbn);\n\nreturn book;\n}\n```"
  merge: -1
  pgno: 182
- img_proc: false
  md: "The createBook function helps us create new instances of one type of book.\
    \ However, a library usually contains multiple copies of the same book! Let's\
    \ create an addBook function, which allows us to add multiple copies of the same\
    \ book. It should invoke the createBook function, which returns either a newly\
    \ created Book instance, or returns the already existing instance.\n\nIn order\
    \ to keep track of the total amount of copies, let's create a bookList array that\
    \ contains the total amount of books in the library.\n\n```\nconst bookList =\
    \ [];\nconst addBook = (title, author, isbn, avallibility, sales) => {\nconst\
    \ book = {\n  ...createBook(title, author, isbn),\nsales,\navallibility,\nisbn\n\
    };\n\nbookList.push(book);\nreturn book;\n}\n```\n\nPerfect! Instead of creating\
    \ a new Book instance each time we add a copy, we can effectively use the already\
    \ existing Book instance for that particular copy. Let's create 5 copies of 3\
    \ books: Harry Potter, To Kill a Mockingbird, and The Great Gatsby."
