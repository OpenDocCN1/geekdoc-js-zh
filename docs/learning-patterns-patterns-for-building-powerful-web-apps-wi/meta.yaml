    # Adding Hooks


    Like other components, there are special functions that are used when you want
    to add Hooks to the code you have written. Here''s a brief overview of some common
    Hook functions:


    # useState


    The useState Hook enables developers to update and manipulate state inside function
    components without needing to convert it to a class component. One advantage of
    this Hook is that it is simple and does not require as much complexity as other
    React Hooks.


    # useEffect


    The useEffect Hook is used to run code during major lifecycle events in a function
    component. The main body of a function component does not allow mutations, subscriptions,
    timers, logging, and other side effects. If they are allowed, it could lead to
    confusing bugs and inconsistencies within the UI. The useEffect hook prevents
    all of these "side effects" and allows the UI to run'
  merge: -1
  pgno: 157
- img_proc: false
  md: 'smoothly. It is a combination of componentDidMount, componentDidUpdate, and
    componentWillUnmount, all in one place.


    # useContext


    The useContext Hook accepts a context object, which is the value returned from
    React.createContext, and returns the current context value for that context. The
    useContext Hook also works with the React Context API in order to share data throughout
    the app without the need to pass your app props through various levels.


    It should be noted that the argument passed to the useContext hook must be the
    context object itself and any component calling the useContext always re-render
    whenever the context value changes.


    # useReducer


    The useReducer Hook gives an alternative to useState and is especially preferable
    to it when you have complex state logic that involves multiple values or when
    the next state depends on the previous one. It takes a reducer function and an
    initial state input and returns the current state and a destructuring dispatch
    function as output by means of array useReducer also optimizes the performance
    of components that trigger deep updates.'
