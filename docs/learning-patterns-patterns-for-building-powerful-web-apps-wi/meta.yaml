- img_proc: false
  md: 'Let us explore the Islands architecture in further detail with the different
    options available to implement it at present.


    # Islands of dynamic components


    Most pages are a combination of static and dynamic content. Usually, a page consists
    of static content with sprinkles of interactive regions that can be isolated.
    For example:


    +   - Blog posts, news articles, and organization home pages contain text and
    images with interactive components like social media embeds and chat.

    - Product pages on e-commerce sites contain static product descriptions and links
    to other pages on the app. Interactive components such as image carousels and
    search are available in different regions of the page.

    - A typical bank account details page contains a list of static transactions with
    filters providing some interactivity.


    Static content is stateless, does not fire events, and does not need rehydration
    after rendering. After rendering, dynamic content (buttons, search bar) has to
    be rewired to its events. The DOM has to be regenerated on the client-side (virtual
    DOM). This regeneration, rehydration, and event handling functions contribute
    to the JavaScript sent to the client.


    The Islands architecture facilitates server-side rendering of pages with all of
    their static content. In this case, the rendered HTML will include placeholders
    for dynamic content. The dynamic content placeholders contain'
  merge: -1
  pgno: 314
- img_proc: false
  md: 'self-contained component widgets. Each widget is similar to an app and combines
    server-rendered output and JavaScript used to hydrate the app on the client.


    In progressive hydration, the hydration architecture of the page is top-down.
    The page controls the scheduling and hydration of individual components. Each
    component has its hydration script in the Islands architecture that executes asynchronously,
    independent of any other script on the page. A performance issue in one component
    should not affect the other.


    | Page Layout (Server Rendered) |

    | --- |

    | Blog Title (Server rendered HTML) |

    | Blog Content (Text + Static images HTML) |

    | Comment placeholder (server rendered) | SocialButtons placeholder |

    | Comments App = server rendered HTML + hydration script | SocialButtons App =
    server rendered HTML + hydration script |'
