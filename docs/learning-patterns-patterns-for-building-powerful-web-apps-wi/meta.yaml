    \ to still be fast. We SSR the Client components which the Server components emit,\
    \ similar to how SSR is used with other data-fetching mechanisms.\n\nThis time\
    \ however, the JavaScript bundle will be significantly smaller. Early explorations\
    \ have shown that bundle size wins could be significant (-18-29%), but the React\
    \ team will have a clearer idea of wins in the wild once infrastructure work is\
    \ complete.\n\n```\nimport marked from \"marked\"; // zero bundle size\nimport\
    \ sanitizeHtml from \"sanitize-html\"; // zero bundle size\n\nfunction NoteWithMarkdown({text})\
    \ {\n  // same as before\n}\n```\n\n# Automatic Code-Splitting\n\nIt's been considered\
    \ a best-practice to only serve code users need as they need it by using code-splitting.\
    \ This allows you to break your app down into smaller bundles requiring less code\
    \ to be sent to the client. Prior to Server Components, one would manually use\
    \ React.lazy() to define \"split-points\" or rely on a heuristic set set by a\
    \ meta-framework, such as routes/pages to create new chunks."
