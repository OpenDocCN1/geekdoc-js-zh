    \ {\n  const html = sanitizeHtml(marked(text));\n  return (/* render */);\n}\n\
    ```\n\n# Server Components\n\nReact's new Server Components compliment Server-side\
    \ rendering, enabling rendering into an intermediate abstraction format without\
    \ needing to add to the JavaScript bundle. This both allows merging the server-tree\
    \ with the client-side tree without a loss of state and enables scaling up to\
    \ more components.\n\nServer Components are not a replacement for SSR. When paired\
    \ together, they support quickly rendering in an intermediate format, then having\
    \ Server-"
