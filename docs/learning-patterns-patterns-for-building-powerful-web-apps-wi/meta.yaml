    \ that returns the current value of the counter variable\n\nan increment method\
    \ that increments the value of counter by one\n\na decrement method that decrements\
    \ the value of counter by one\n\nHowever, this class doesn't meet the criteria\
    \ for a Singleton! A Singleton should only be able to get instantiated once. Currently,\
    \ we can create multiple instances of the Counter class.\n\n```\nlet counter =\
    \ 0;\n\nclass Counter {\n  getInstance() {\n    return this;\n  }\n\n  getCount()\
    \ {\n    return counter;\n  }\n\n  increment() {\n    return ++counter;\n  }\n\
    \n  decrement() {\n    return --counter;\n  }\n}\n\nconst counter1 = new Counter();\n\
    const counter2 = new Counter();\n\nconsole.log(counter1.getInstance()) === counter2.getInstance());\
    \ // false\n```"
