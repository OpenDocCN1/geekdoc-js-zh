  md: "# # Prototype Pattern\n\nShare properties among many objects of the same type\n\
    \nThe prototype pattern is a useful way to share properties among many objects\
    \ of the same type. The prototype is an object that's native to JavaScript, and\
    \ can be accessed by objects through the prototype chain.\n\nIn our applications,\
    \ we often have to create many objects of the same type. a useful way of doing\
    \ this is by creating multiple instances of the ES6 class.\n\nLet's say we want\
    \ to create many dogs! In our example, dogs can't do that much: they simply have\
    \ a name, and they can bark!\n\n```\nclass Dog {\n  constructor(name) {\n    this.name\
    \ = name;\n  }\n\n  bark() {\n    return 'Woof!';\n  }\n}\n\nconst dog1 = new\
    \ Dog(\"Daisy\");\nconst dog2 = new Dog(\"Max\");\nconst dog3 = new Dog(\"Spot\"\
    );\n```"
  merge: -1
  pgno: 66
- img_proc: false
  md: 'Notice how the constructor contains a name property, and the class itself contains
    a bark property. When using ES6 classes, all properties that are defined on the
    class itself, bark in this case, are automatically added to the prototype.


    We can see the prototype directly through accessing the prototype property on
    a constructor, or through the __proto__ property on any instance.


    ```

    console.log(Dog.prototype);

    // constructor: f Dog(name, breed) bark: f bark()


    console.log(dog1.__proto__);

    // constructor: f Dog(name, breed) bark: f bark()

    ```


    The value of __proto__ on any instance of the constructor, is a direct reference
    to the constructor''s prototype! Whenever we try to access a property on an object
    that doesn''t exist on the object directly, JavaScript will go down the prototype
    chain to see if the property is available within the prototype chain.'
  merge: -1
  pgno: 67
- img_proc: false
  md: '![](bbox=[0.116, 0.089, 0.853, 0.406])


    The prototype pattern is very powerful when working with objects that should have
    access to the same properties. Instead of creating a duplicate of the property
    each time, we can simply add the property to the prototype, since all instances
    have access to the prototype object.


    Since all instances have access to the prototype, it''s easy to add properties
    to the prototype even after creating the instances.


    Say that our dogs shouldn''t only be able to bark, but they should also be able
    to play! We can make this possible by adding a play property to the prototype.'
