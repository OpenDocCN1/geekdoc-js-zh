  md: '# Dependency hiding


    When importing another module, superCounter.js in this case, it may not be obvious
    that module is importing a Singleton. In other files, such as index.js in this
    case, we may be importing that module and invoke its methods. This way, we accidentally
    modify the values in the Singleton. This can lead to unexpected behavior, since
    multiple instances of the Singleton can be shared throughout the application,
    which would all get modified as well.


    ```

    import Counter from "./counter";nimport SuperCounter from "./superCounter";nconst
    counter = new SuperCounter();


    counter.increment();

    counter.increment();

    counter.increment();


    console.log("Counter in index.js", Counter.getCount())

    ```


    # Global behavior


    A Singleton instance should be able to get referenced throughout the entire app.
    Global variables essentially show the same behavior: since global variables are
    available on the global scope, we can access those variables throughout the application.'
