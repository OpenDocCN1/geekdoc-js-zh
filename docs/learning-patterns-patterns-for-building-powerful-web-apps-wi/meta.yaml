- img_proc: false
  md: 'Rendering content on the web can be done in many ways today. The decision on
    how and where to fetch and render content is key to the performance of an application.
    The available frameworks and libraries can be used to implement different rendering
    patterns like Client-Side Rendering, Static Rendering, Hydration, Progressive
    Rendering and Server-Side Rendering. It is important to understand the implications
    of each of these patterns before we decide which is best suited for our application.


    The Chrome team has encouraged developers to consider static rendering or server-side
    rendering over a full hydration approach. Over time, progressive loading and rendering
    techniques by default may help strike a good balance of performance and feature
    delivery when using a modern framework


    The following sections will provide a guideline for measuring the performance
    requirements for an application with respect to web rendering and suggest patterns
    that best satisfy each of these requirements. Subsequently, we will explore each
    pattern in-depth and learn how it can be implemented. We will also talk a bit
    about Next.js which can be used to implement these patterns. However, before we
    go into the available patterns or Next.js, let''s take a look at how we got here
    and what were the drivers that resulted in the creation of the React framework
    and Next.js.


    # A brief history of web rendering


    Web technologies have been continuously evolving to support changing application
    requirements. The building blocks for all websites HTML, CSS and'
  merge: -1
  pgno: 206
- img_proc: false
  md: 'JavaScript have also evolved over time to support changing requirements and
    utilize browser advancements.


    In the early 2000''s we had sites where HTML content was rendered completely by
    the server. Developers relied on server-side scripting languages like PHP and
    ASP to render HTML. Page reloads were required for all key navigations and JavaScript
    was used by clients minimally to hide/show or enable/disable HTML elements.


    In 2006, Ajax introduced the possibility of Single-Page Applications (SPA), Gmail
    being the most popular example. Ajax allowed developers to make dynamic requests
    to the server without loading a new page. Thus, SPAs could be built to rebuild
    desktop applications. Soon developers started using JavaScript to fetch and render
    data. JavaScript libraries and frameworks were created that could be used to build
    the view layer functionality in the MVC framework. Client-side frameworks like
    JQuery, Backbone.js and AngularJS made it easier for developers to build core
    features using JavaScript.


    React was introduced in 2013 as a flexible framework for building user interfaces
    and UI components and provided a base for developing both single-page web and
    mobile applications. From 2015 to 2020 the React ecosystem has evolved to include
    supporting data-flow architecture libraries (Redux), CSS frameworks (React-Bootstrap),
    routing libraries and mobile application framework (React Native). However, there
    are some drawbacks of a pure Client-Side rendering framework. As a result, developers
    have started exploring new ways to get the best of both the Client-side and Server-side
    rendering worlds.'
  merge: -1
  pgno: 207
- img_proc: false
  md: '# Rendering - Key Performance Indicators


    Before we talk about drawbacks, let us understand how we could measure the performance
    of a rendering mechanism. A basic understanding of the following terms will help
    us to compare the different patterns discussed here.


    | Acronym | Description |

    |---|---|n| TTFB | Time to First Byte - the time between clicking a link and the
    first bit of content coming in. |

    | FP | First Paint - First time any content becomes visible to the user or the
    time when the first few pixels are painted on the screen |

    | FCP | First Contentful Paint - When all the requested content becomes visible
    |

    | LCP | Largest Contentful Paint - When the main page content becomes visible.
    This refers to the largest image or text block visible within the viewport. |

    | TTI | Time to Interactive - When the page becomes interactive e.g., events are
    wired up, etc. |

    | TBT | Total Blocking Time - The total amount of time between FCP and TTI. |


    Some important notes about these performance parameters are as follows.


    +   - A large JavaScript bundle could increase how long a page takes to reach
    FCP and LCP. The user will be required to wait for some time to go from a mostly
    blank page to a page with content loaded.

    - Larger JavaScript bundles also affect TTI and TBT as the page can only become
    interactive once the minimal JavaScript is loaded and events are wired.

    - The time required for the first byte of content to reach the browser (TTFB)
    is dependent on the time taken by the server to process the request.'
  merge: -1
  pgno: 208
- img_proc: false
  md: '+   Techniques such as preload, prefetch and script attributes can affect the
    above parameters as different browsers interpret them differently. It is helpful
    to understand the loading and execution priorities assigned by the browser for
    such attributes before using them.


    We can now use these parameters to understand what exactly each pattern has to
    offer with respect to rendering requirements.'
