  md: '# Best use-cases for a HOC:


    +   - The same, uncustomized behavior needs to be used by many components throughout
    the application.


    +   - The component can work standalone, without the added custom logic.


    # Best use-cases for Hooks:


    +   - The behavior to be customized for each component that uses it.


    +   - The behavior is not spread throughout the application, only one or a few
    components use the behavior.


    +   - The behavior adds many properties to the component


    # Case Study


    Some libraries that relied on the HOC pattern added Hooks support after the release.
    A good example of this is Apollo Client.


    One way to use Apollo Client is through the graphql() higher order component.'
