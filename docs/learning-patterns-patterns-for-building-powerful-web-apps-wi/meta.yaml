  md: 'Other potential heuristics one could use include, loading component code:


    +   - A period after idle time

    - On user mouse hover over the relevant UI/button/call to action

    - Based on a sliding scale of eagerness based on browser signals (e.g network
    speed, Data Saver mode etc).


    ![](bbox=[0.118, 0.337, 0.881, 0.663])


    # What about data?


    The initial data which is used to render the page is included in the initial page’s
    SSR HTML and streamed. Data that is late loaded is downloaded based on user interactions
    as we know what component goes with.'
