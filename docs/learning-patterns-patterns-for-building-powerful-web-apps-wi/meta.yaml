  md: "A great benefit of having modules, is that we only have access to the values\
    \ that we explicitly exported using the export keyword. Values that we didn't\
    \ explicitly export using the export keyword, are only available within that module.\n\
    \nLet's create a value that should only be referenceable within the math.js file,\
    \ called privateValue.\n\n```\nconst privateValue = \"This is a value private\
    \ to the module!\";\n\nexport function add(x, y) {\n  return x + y;\n}\n\nexport\
    \ function multiply(x) {\n  return x * 2;\n}\n\nexport function subtract(x, y)\
    \ {\n  return x - y;\n}\n\nexport function square(x) {\n  return x * x;\n}\n```"
  merge: -1
