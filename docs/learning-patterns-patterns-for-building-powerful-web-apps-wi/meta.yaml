- img_proc: false
  md: 'The difference between named exports and default exports, is the way the value
    is exported from the module, effectively changing the way we have to import the
    value.


    Previously, we had to use the brackets for our named exports: import { module
    } from ''module''. With a default export, we can import the value without the
    brackets: import module from ''module''.


    ```

    import * as math from "./math.js";


    math.default(7, 8);

    math.multiply(8, 9);

    math.subtract(10, 3);

    math.square(3);

    ```


    The value that''s been imported from a module without the brackets, is always
    the value of the default export, if there is a default export available.


    Since JavaScript knows that this value is always the value that was exported by
    default, we can give the imported default value another name than the name we
    exported it with. Instead of importing the add function using the name add, we
    can call it addValues, for example.'
