    Travis Scott\" },\n  { name: \"Bazzi\" }\n];\n\nconst Row = ({ index, style })\
    \ => (\n  <div className={index % 2 ? \"ListItemOdd\" : \"ListItemEven\" style={style}>\n\
    \    {itemsArray[index].name}\n  </div>\n);\n\nconst Example = () => (\n  <div\
    \ className=\"List\">\n    {itemsArray.map((item, index) => Row({index}))}\n \
    \ </div>\n);\n\nReactDOM.render(<Example />, document.getElementById(\"root\"\
    )););\n```"
