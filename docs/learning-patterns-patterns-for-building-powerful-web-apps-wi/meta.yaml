    # How to add State in React


    When designing, Including state is a task that you should save for last. It is
    much better to design everything as stateless, using props and events. Adding
    states should be done through either state containers such as Redux and MobX,
    or a container/wrapper component. Redux is a popular state management system for
    other reactive frameworks. It implements a centralized state machine driven by
    actions.


