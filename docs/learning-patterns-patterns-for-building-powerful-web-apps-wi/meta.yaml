  md: "# React.Children.map\n\nWe can also implement the Compound Component pattern\
    \ by mapping over the children of the component. We can add the open and toggle\
    \ properties to these elements, by cloning them with the additional props.\n\n\
    ```\nexport function FlyOut(props) {\n  const [open, toggle] = React.useState(false);\n\
    \n  return (\n    <div>\n      {React.Children.map(props.children, child =>\n\
    \        React.cloneElement(child, { open, toggle })\n      )}\n    </div>\n \
    \ );\n}\n```\n\nAll children components are cloned, passed the value of open and\
    \ toggle. Instead of having to use the Context API like in the previous example,\
    \ we now have access to these two values through props."
