- img_proc: false
  md: "Notice how we didn't add the export keyword in front of privateValue. Since\
    \ we didn't export the privateValue variable, we don't have access to this value\
    \ outside of the math.js module!\n\nBy keeping the value private to the module,\
    \ there is a reduced risk of accidentally polluting the global scope. You don't\
    \ have to fear that you will accidentally overwrite values created by developers\
    \ using your module, that may have had the same name as your private value: it\
    \ prevents naming collisions.\n\nSometimes, the names of the exports could collide\
    \ with local values.\n\n```\nimport { add, multiply, subtract, square } from \"\
    ./math.js\";\n\nfunction add(...args) {\n  return args.reduce((acc, cur) => cur\
    \ + acc);\n /* Error: add has already been declared */\n\nfunction multiply(...args)\
    \ {\n  return args.reduce((acc, cur) => cur * acc);\n}\n/* Error: multiply has\
    \ already been declared */\n```\n\nIn this case, we have functions called add\
    \ and multiply in index.js. If we would import values with the same name, it would\
    \ end up in a naming collision: add and multiply have already been declared! Luckily,\
    \ we can rename the imported values, by using the as keyword."
