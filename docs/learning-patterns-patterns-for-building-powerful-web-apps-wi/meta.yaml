- img_proc: false
  md: "# Pros\n\nThe factory pattern is useful when we have to create multiple smaller\
    \ objects that share the same properties. A factory function can easily return\
    \ a custom object depending on the current environment, or user-specific configuration.\n\
    \n# Cons\n\nIn JavaScript, the factory pattern isn't much more than a function\
    \ that returns an object without using the new keyword. ES6 arrow functions allow\
    \ us to create small factory functions that implicitly return an object each time.\n\
    \nHowever, in many cases it be more memory efficient to create new instances instead\
    \ of new objects each time.\n\n```\nclass User {\n  constructor(firstName, lastName,\
    \ email) {\n    this.firstName = firstName;\n    this.lastName = lastName;\n \
    \   this.email = email;\n  }\n\n  fullName() {\n    return `${this.firstName}\
    \ ${this.lastName}`;\n  }\n}\n\nconst user1 = new User({\n  firstName: \"John\"\
    ,\n  lastName: \"Doe\",\n  email: \"john@doe.com\"\n});\n\nconst user2 = new User({\n\
    \  firstName: \"Jane\",\n  lastName: \"Doe\",\n  email: \"jane@doe.com\"\n});\n\
    ```"
  merge: -1
