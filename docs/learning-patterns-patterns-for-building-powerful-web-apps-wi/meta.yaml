  md: '# iSSG Advantages


    iSSG provides all the advantages of SSG and then some more. The following list
    covers them in detail.


    +   1. **Dynamic data**: The first advantage is obviously why iSSG was envisioned.
    Its ability to support dynamic data without a need to rebuild the site.


    +   2. **Speed**: iSSG is at least as fast as SSG because data retrieval and rendering
    still takes place in the background. There is little processing required on the
    client or the server.


    +   3. **Availability**: A fairly recent version of any page will always be available
    online for users to access. Even if the regeneration fails in the background,
    the old version remains unaltered.


    +   4. **Consistent**: As the regeneration takes place on the server one page
    at a time, the load on the database and the backend is low and performance is
    consistent. As a result, there are no spikes in latency.


    +   5. **Ease of Distribution**: Just like SSG sites, iSSG sites can also be distributed
    through a network of CDN''s used to serve pre-rendered web pages.'
