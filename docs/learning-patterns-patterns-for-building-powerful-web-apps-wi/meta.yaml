  md: '# Compound Pattern


    Create multiple components that work together to perform a single task


    In our application, we often have components that belong to each other. They''re
    dependent on each other through the shared state, and share logic together. You
    often see this with components like select, dropdown components, or menu items.
    The compound pattern allows you to create components that all work together to
    perform a task.


    # Context API


    Let''s look at an example: we have a list of squirrel images! Besides just showing
    squirrel images, we want to add a button that makes it possible for the user to
    edit or delete the image. We can implement a Flyout component that shows a list
    when the user toggles the component.


    In a Flyout component, we essentially have three things:


    +   - The Flyout wrapper, which contains the toggle button and the list

    - The Toggle button, which toggles the List

    - The List , which contains the list of menu items'
  merge: -1
  pgno: 189
