  md: 'We tried replacing this with native image lazy-loading. Based on subsequent
    testing, we noticed that TBT increased from 10 ms to 117 ms for a negligible reduction
    in LCP. It is possible that native image loading loads a few images that are near
    the viewport while react lazy-load only loads those that are within the viewport
