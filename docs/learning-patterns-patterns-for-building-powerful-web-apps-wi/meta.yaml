  md: "# Dynamic import\n\nWhen importing all modules on the top of a file, all modules\
    \ get loaded before the rest of the file. In some cases, we only need to import\
    \ a module based on a certain condition. With a dynamic import, we can import\
    \ modules on demand.\n\n```\nimport(\"module\").then(module => {\n  module.default();\n\
    \  module.namedExport();\n});\n\n// Or with async/await\n(async () => {\n  const\
    \ module = await import(\"module\");\n  module.default();\n  module.namedExport();\n\
    })();\n```\n\nLet's dynamically import the math.js example used in the previous\
    \ paragraphs. The module only gets loaded, if the user clicks on the button."
