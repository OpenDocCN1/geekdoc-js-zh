    \ the render prop. Instead, we usually want to pass data from the component that\
    \ takes the render prop, to the element that we pass as a render prop!\n\n```\n\
    function Component(props) {\n  const data = { ... }\n\n  return props.render(data)\n\
    }\n```\n\nThe render prop can now receive this value that we passed as its argument.\n\
    \n```\n<Component render={data => <ChildComponent data={data} />}/>\n```\n\nLet's\
    \ look at an example! We have a simple app, where a user can type a temperature\
    \ in Celsius. The app shows the value of this temperature in Fahrenheit and Kelvin."
