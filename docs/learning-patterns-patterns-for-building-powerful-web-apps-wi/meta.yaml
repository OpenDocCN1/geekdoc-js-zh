  md: '# Pros and cons


    Streaming aims to improve the speed of SSR with React and provides the following
    benefits


    +   1. **Performance Improvement**: As the first byte reaches the client soon
    after rendering starts on the server, the TTFB is better than that for SSR. it
    is also more consistent irrespective of the page size. Since the client can start
    parsing HTML as soon as it receives it, the FP and FCP are also lower.


    +   2. **Handling of Backpressure**: Streaming responds well to network backpressure
    or congestion and can result in responsive websites even under challenging conditions.


    +   3. **Supports SEO**: The streamed response can be read by search engine crawlers,
    thus allowing for SEO on the website.


    It is important to note that streaming implementation is not a simple find-replace
    from renderToString to renderToStream(). There are cases where the code that works
    with SSR may not work as-is with streaming. Following are some examples where
    migration may not be easy.


    +   1. Frameworks that use the server-render-pass to generate markup that needs
    to be added to the document before the SSR-ed chunk. Examples frameworks that
    dynamically determine which CSS to add to the page in a preceding <style> tag,
    or frameworks that add elements to the document <head> while rendering. A workaround
    for this has been discussed here.'
  merge: -1
  pgno: 264
- img_proc: false
  md: '2. Code, where renderToStaticMarkup is used to generate the page template and
    renderToString calls are embedded to generate dynamic content. Since the string
    corresponding to the component is expected in these cases, it cannot be replaced
    by a stream. An example of such code provided here is as follows.


    Both Streaming and Progressive Hydration can help to bridge the gap between a
    pure SSR and a CSR experience. Let us now compare all the patterns that we have
    explored and try to understand their suitability for different situations.'
