  md: '# Code Splitting


    Code splitting ensures that only the required JavaScript is sent to the client
    which helps to improve performance. Next.js supports two types of code splitting.


    +   - Route-based: This is implemented by default in Next.js. When a user visits
    a route, Next.js only sends the code needed for the initial route. The other chunks
    are downloaded as required when the user navigates around the application. This
    limits the amount of code that needs to be parsed and compiled at once thereby
    improving the page load times.

    - Component-based: This type of code splitting allows splitting large components
    into separate chunks that can be lazy-loaded when required. Next.js supports component-based
    code splitting through dynamic import(). This allows you to import JavaScript
    modules (including React components) dynamically and load each import as a separate
    chunk.'
  merge: -1
