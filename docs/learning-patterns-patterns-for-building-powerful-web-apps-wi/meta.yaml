  md: "Besides named exports, which are exports defined with just the export keyword,\
    \ you can also use a default export. You can only have one default export per\
    \ module.\n\nLet's make the add function our default export, and keep the other\
    \ functions as named exports. We can export a default value, by adding export\
    \ default in front of the value.\n\n```\nmath.js\nexport default function add(x,\
    \ y) {\n  return x + y;\n}\n\nexport function multiply(x) {\n  return x * 2;\n\
    }\n\nexport function subtract(x, y) {\n  return x - y;\n}\n\nexport function square(x)\
    \ {\n  return x * x;\n}\n```\n\n![](bbox=[0.778, 0.781, 0.871, 0.846])"
