  md: '# Browser Idle


    # Executing Script


    In many cases, we know that users will request certain resources soon after the
    initial render of a page. Although they may not be visible instantly, thus shouldn''t
    be included in the initial bundle, it would be great to reduce the loading time
    as much as as possible to give a better user experience!'
