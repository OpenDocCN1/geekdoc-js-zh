- img_proc: false
  md: 'To achieve the desired sequence, we recommend using the ScriptLoader component
    for Next. This component is designed to "optimize the critical rendering path
    and ensure external scripts don''t become a bottleneck to optimal page load."
    The feature most relevant to our discussion is Loading Priorities. This allows
    us to schedule the scripts at different milestones to support different use cases.
    Following are the loading priority values available **After-Interactive**: Loads
    the specific 3P script after the next hydration. This can be used to Tag-managers,
    Ads, or Analytics scripts that we want to execute as early as possible but after
    1P scripts.


    **Before-Interactive**: Loads the specific 3P script before hydration. It can
    be used in cases where we want the 3P script to execute before the 1P script.
    Eg., polyfill.io, bot detection, security and authentication, user consent management
    (GDPR), etc.


    **Lazy-Onload**: Prioritize all other resources over the specified 3P script and
    lazy load the script. It can be used for CRM components like Google Feedback or
    Social Network specific scripts like those used for share buttons, comments, etc.


    Thus, preconnect, script attributes and ScriptLoader for Next.js together can
    help us get the desired sequence for all our scripts.


    # Conclusion


    The responsibility of optimizing apps falls on the shoulders of the creators of
    the platforms used as well as the developers who use it. Common issues need to
    be addressed. We aim to make sequencing easier from the inside out.'
  merge: -1
