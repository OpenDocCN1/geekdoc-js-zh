  md: "It would be optimal of we could skip all the layers of components that don't\
    \ need to use this data. We need to have something that gives the components that\
    \ need access to the data direct access to it, without relying on prop drilling.\n\
    \nThis is where the Provider Pattern can help us out! With the Provider Pattern,\
    \ we can make data available to multiple components. Rather than passing that\
    \ data down each layer through props, we can wrap all components in a Provider.\
    \ A Provider is a higher order component provided to us by the Context object.\
    \ We can create a Context object, using the createContext method that React provides\
    \ for us.\n\nThe Provider receives a value prop, which contains the data that\
    \ we want to pass down. All components that are wrapped within this provider have\
    \ access to the value of the value prop.\n\n```\nconst DataContext = React.createContext()\n\
    \nfunction App() {\n  const data = { ... }\n\n  return (\n    <div>\n      <DataContext.Provider\
    \ value={data}>\n        <Sidebar />\n        <Content />\n      </DataContext.Provider>\n\
    \    </div>\n  );\n}\n```"
  merge: -1
