  md: "Using the Compound pattern with React's Context API is perfect for this example!\n\
    \nFirst, let's create the FlyOut component. This component keeps the state, and\
    \ returns a FlyOutProvider with the value of the toggle to all the children receives.\n\
    \n```\nconst FlyOutContext = createContext();\n\nfunction FlyOut(props) {\n  const\
    \ [open, toggle] = useState(false);\n\n  const providerValue = { open, toggle\
    \ };\n\n  return (\n    <FlyOutContext.Provider value={providerValue}>\n     \
    \ {props.children}\n    </FlyOutContext.Provider>\n  );\n}\n```\n\nWe now have\
    \ a stateful FlyOut component that can pass the value of open and toggle to its\
    \ children!\n\nLet's create the Toggle component. This component simply renders\
    \ the component on which the user can click in order to toggle the menu."
  merge: -1
  pgno: 190
- img_proc: false
  md: "```\nfunction Toggle() {\n  const { open, toggle } = useContext(FlyOutContext);\n\
    \n  return (\n    <div onClick={() => toggle(!open)}>\n      <Icon />\n    </div>\n\
    \  );\n}\n```\n\nIn order to actually give Toggle access to the FlyOutContext\
    \ provider, we need to render it as a child component of FlyOut! We could just\
    \ simply render this as a child component. However, we can also make the Toggle\
    \ component a property of the FlyOut component!\n\n```\nconst FlyOutContext =\
    \ createContext();\n\nfunction FlyOut(props) {\n  const [open, toggle] = useState(false);\n\
    \n  return (\n    <FlyOutContext.Provider value={{open, toggle}}>\n      {props.children}\n\
    \    </FlyOutContext.Provider>\n  );\n}\n\nfunction Toggle() {\n  const { open,\
    \ toggle } = useContext(FlyOutContext);\n\n  return (\n    <div onClick={() =>\
    \ toggle(!open)}>\n      <Icon />\n    </div>\n  );\n}\n\nFlyOut.Toggle = Toggle;\n\
    ```"
