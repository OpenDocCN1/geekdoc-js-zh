    # # Conclusion


    We have covered four patterns that are essentially variations of SSR. These variations
    use a combination of techniques to lower one or more of the performance parameters
    like TTFB (Static and Incremental Static Generation), TTI (Progressive Hydration)
    and FCP/FP (Streaming). The patterns build upon existing client-side frameworks
    like React and allow for some sort of rehydration to achieve the interactivity
    levels of CSR. Thus, we have multiple options to achieve the ultimate goal of
    combining both SSR and CSR benefits.


