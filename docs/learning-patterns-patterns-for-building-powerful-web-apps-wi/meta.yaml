  md: '![](bbox=[0.116, 0.091, 0.873, 0.423])


    Having to repeatedly request the resources isn''t optimal, as we''re trying to
    minimize the amount of round trips between the client and the server!


    For a long time, we used HTTP/1.1 in order to communicate between the client and
    the server. Although HTTP/1.1 introduced many improvement compared to HTTP/1.0,
    which such being able to keep the TCP connection between the client and the server
    alive before a new HTTP requests gets sent with the keep-alive header, there were
    still some issues that had to be solved!


    HTTP/2 introduced some significant changes compared to HTTP/1.1, which make it
    easier for us to optimize the message exchange between the client and the server.'
  merge: -1
  pgno: 394
- img_proc: false
  md: 'Whereas HTTP/1.1 used a newline delimited plaintext protocol in the requests
    and responses, HTTP/2 splits the requests and responses up in smaller pieces called
    frames. An HTTP request that contains headers and a body field gets split into
    at least two frames: a headers frame, and a data frame!


    HTTP/1.1 had a maximum amount of 6 TCP connections between the client and the
    server. Before a new request can get sent over the same TCP connection, the previous
    request has to be resolved! If the previous request is taking a long time to resolve,
    this request is blocking the other requests from being sent. This common issue
    is called head of line blocking, and can increase the loading time of certain
    resources!


    HTTP/2 makes use of bidirectional streams, which makes it possible to have one
    single TCP connection that includes multiple bidirectional streams, which can
    carry multiple request and response frames between the client and the server!


    Once the server has received all request frames for that specific request, it
    reassembles them and generates response frames. These response frames are sent
    back to the client, which reassembles them. Since the stream is bidirectional,
    we can send both request and response frames over the same stream.'
  merge: -1
  pgno: 395
- img_proc: false
  md: '![](bbox=[0.121, 0.091, 0.878, 0.413])


    HTTP/2 solves head of line blocking by allowing multiple requests to get sent
    on the same TCP connection before the previous request resolves!'
  merge: -1
