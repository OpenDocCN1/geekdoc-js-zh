  md: '# # Import on Interaction


    Load non-critical resources when a user interacts with UI requiring it


    Your page may contain code or data for a component or resource that isn''t immediately
    necessary. For example, part of the user-interface a user doesn''t see unless
    they click or scroll on parts of the page. This can apply to many kinds of first-party
    code you, but this also applies to third-party widgets such as video players or
    chat widgets where you typically need to click a button to display the main interface.


    Loading these resources eagerly (right away) can block the main thread if they
    are costly, pushing out how soon a user can interact with more critical parts
    of a page. This can impact interaction readiness metrics like **First Delay, Total
    Blocking Time** and **Time to Interactive**. Instead of loading these resources
    immediately, you can load them at a more opportune moment, such as:


    +   - When the user clicks to interact with that component for the first time


    +   - The component scrolls into view


    +   - Deferring load of that component until the browser is idle (via requestIdleCallback).'
  merge: -1
  pgno: 360
- img_proc: false
  md: 'The different ways to load resources are, at a high-level:


    +   - Eager: load resource right away (the normal way of loading scripts)

    - Lazy (Route-based): load when a user navigates to a route or component

    - Lazy (On interaction): load when the user clicks UI (e.g Show Chat)

    - Lazy (In viewport): load when the user scrolls towards the component

    - Prefetch: load prior to needed, but after critical resources are loaded

    - Preload: eagerly, with a greater level of urgency


    Import on interaction for first-party code should only be done if you''re unable
    to prefetch resources prior to interaction. The pattern is however very relevant
    for third-party code, where you generally want to defer it if non-critical to
    a later point in time. This can be achieved in many ways (defer until interaction,
    until the browser is idle or using other heuristics).


    Lazily importing feature code on interaction is a pattern used in many contexts
    we will cover in this post. One place you may have used it before is Google Docs,
    where they save loading 500KB of script for the share feature by deferring its
    load until user-interaction.'
  merge: -1
  pgno: 361
- img_proc: false
  md: '![](bbox=[0.117, 0.073, 0.882, 0.497])


    Another place where import-on-interaction can be a good fit is loading third-party
    widgets.


    # "**Fake** loading third-party UI with facade


    You might be importing a third-party script and have less control over what it
    renders or when it loads code. One option for implementing load-on-interaction
    is straightforward: use a facade. A facade is a simple "preview" or "placeholder"
    for a more costly component where you simulate the basic experience, such as with
    an image or screenshot. It''s terminology we''ve been using for this idea on the
    Lighthouse team.'
  merge: -1
  pgno: 362
- img_proc: false
  md: '![](bbox=[0.118, 0.087, 0.862, 0.483])


    When a user clicks on the "preview" (the facade), the code for the resource is
    loaded. This limits users needing to pay the experience cost for a feature that
    they''re not going to use it. Similarly, facades can preconnect to necessary resources
    on hover.


    Third-party resources are often added to pages without full consideration for
    how they fit into the overall loading of a site. Synchronously-loaded third-party
    scripts block the browser parser and can delay hydration. If possible, 3P script
    should be loaded with async/defer (or other approaches) to ensure 1P scripts aren''t
    starved of network bandwidth. Unless they are critical, they can be a good candidate
    for shifting to deferred late-loading using patterns like import-on-interaction.'
  merge: -1
  pgno: 363
