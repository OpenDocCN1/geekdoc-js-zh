  md: "# Pros\n\nCompound components manage their own internal state, which they share\
    \ among the several child components. When implementing a compound component,\
    \ we don't have to worry about managing the state ourselves.\n\nWhen importing\
    \ a compound component, we don't have to explicitly import the child components\
    \ that are available on that component.\n\n```\nimport { FlyOut } from \"./FlyOut\"\
    ;\n\nexport default function FlyoutMenu() {\n  return (\n    <FlyOut>\n      <FlyOut.List>\n\
    \        <FlyOut.Item>Edit</FlyOut.Item>\n        <FlyOut.Item>Delete</FlyOut.Item>\n\
    \      </FlyOut.List>\n    </FlyOut>\n  );\n}\n```\n\n# Cons\n\nWhen using the\
    \ React.children.map to provide the values, the component nesting is limited.\
    \ Only direct children of the parent component will have access to the open and\
    \ toggle props, meaning we can't wrap any of these components in another component."
