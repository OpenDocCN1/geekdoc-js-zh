  md: '# Improving CSR performance


    Since performance for CSR is inversely proportional to the size of the

    JavaScript bundle, the best thing we can do is structure our JavaScript code

    for optimal performance. Following is a list of pointers that could help.


    +   1. **Budgeting JavaScript**: Ensure that you have a reasonably tight JavaScript

    budget for your initial page loads. An initial bundle of < 100-170KB minified

    and gzipped is a good starting point. Code can then be loaded on-demand as

    features are needed


    +   2. **Preloading**: This technique can be used to preload critical resources
    that

    would be required by the page, earlier in the page lifecycle. Critical resources

    may include JavaScript which can be preloaded by including the following

    directive in the <head> section of the HTML


    ```

    <link rel="preload" as="script" href="critical.js">

    ```


    This informs the browser to start loading the critical.js file before the page

    endering mechanism starts. The script will thus be available earlier and will

    not block the page rendering mechanism thereby improving the performance.'
  merge: -1
  pgno: 221
- img_proc: false
  md: '+   1. Lazy loading: With lazy loading, you can identify resources that are
    non-critical and load these only when needed. Initial page load times can be improved
    using this approach as the size of resources loaded initially is reduced. For
    example., a chat widget component would generally not be needed immediately on
    page load and can be lazy loaded.


    +   2. Code Splitting: To avoid a large bundle of JavaScript code, you could start
    splitting your bundles. Code-Splitting is supported by bundlers like Webpack where
    it can be used to create multiple bundles that can be dynamically loaded at runtime.
    Code splitting also enables you to lazy load JavaScript resources.


    +   3. Application shell caching with service workers: This technique involves
    caching the application shell which is the minimal HTML, CSS, and JavaScript powering
    a user interface. Service workers can be used to cache the application shell offline.
    This can be useful in providing a native single-page app experience where the
    remaining content is loaded progressively as needed.


    With these techniques, CSR can help to provide a faster Single-Page Application
    experience with a decent FCP and TTI. Next, we will see what is available at the
    other end of the spectrum with Server-Side Rendering.'
  merge: -1
