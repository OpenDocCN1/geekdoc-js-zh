  md: '# Islands Architecture


    The islands architecture encourages small, focused chunks of interactivity within
    server-rendered web pages


    he islands architecture encourages small, focused chunks of interactivity within
    server-rendered web pages. The output of islands is progressively enhanced HTML,
    with more specificity around how the enhancement occurs. Rather than a single
    application being in control of full-page rendering, there are multiple entry
    points. The script for "islands" of interactivity can be delivered and hydrated
    independently, allowing the rest of the page to be just static HTML.


    Loading and processing excess JavaScript can hurt performance. However, some degree
    of interactivity and JavaScript is often required, even in primarily static websites.
    We have discussed variations of Server Side Rendering (SSR) that enable you to
    build applications that try to find the balance between:


    +   - Interactivity comparable to Client-Side Render (CSR) applications


    +   - SEO benefits that are comparable to SSR applications.


    The core principle for SSR is that HTML is rendered on the server and shipped
    with necessary JavaScript to rehydrate it on the client. Hydration is the process
    of regenerating the state of UI components on the client-side after the server
    renders it. Since hydration comes at a cost, each variation of SSR tries to optimize
    the rehydration process. This is mainly achieved'
  merge: -1
  pgno: 312
- img_proc: false
  md: 'by partial hydration of critical components or streaming of components as they
    get rendered. However, the net JavaScript shipped eventually in the above techniques
    remains the same.


    The term Islands architecture was popularized by Katie Sylor-Miller and Jason
    Miller to describe a paradigm that aims to reduce the volume of JavaScript shipped
    through "islands" of interactivity that can be independent delivered on top of
    static HTML. Islands are a component-based architecture that suggests a compartmentalized
    view of the page with static islands. The static regions of the page are pure
    non-interactive HTML and do not need hydration. The dynamic regions are a combination
    of HTML and scripts capable of rehydrating themselves after rendering.


    | SSR | Progressive Hydration | Islands Architecture |

    | --- | --- | --- |

    | Header | Header | Header App |

    | Static Menu | Static Menu | Menu HTML |

    | Filters <> Image Carousel | Filters <> Image Carousel | Filters <> Image Carousel
    |

    | ... Config-Add-to-cart | ... Config-Add-to-cart | ... Config-Add-to-App |

    | ... Filters-App | ... Config-Add-to-cart | ... Config-Add-to-App |

    | **Product details** | **Products** | **Products HTML** |

    | **You may also like** | **You may also like** | **You may also like (HTML)**
    |


    Render all components together and hydrate Render all components, hydrate key
    components first and then progressively hydrate others Static components are server
    rendered HTML. Script is required only for interactive components'
  merge: -1
