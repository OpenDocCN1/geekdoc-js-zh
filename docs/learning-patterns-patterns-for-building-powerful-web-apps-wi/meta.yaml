    # Props vs State


    Props and state can sometimes be confused with each other because of how similar
    they are. Here are some key differences between them:


    | Props | State |

    | --- | --- |

    | The data remains unchanged from component to component. | Data is the current
    snapshot of data stored in a component''s Props. It changes over the lifecycle
    of the component. |

    | The data is read-only | The data can be asynchronous |

    | The data in props cannot be modified | The data in state can be modified using
    this.setState |

    | Props are what is passed on to the component | State is managed within the component


    # Other Concepts in React


    Components, props, and state are the three key concepts for everything you''ll
    be doing in react. But there are also other concepts to learn about:


    # Lifecycle


    Every react component goes through three stages; mounting, rendering, and dismounting.
    The series of events that occur during these three stages can be referred to as
    the component''s lifecycle. While these events are partially related to the component''s
    state (its internal data), the lifecycle is a bit'
  merge: -1
  pgno: 21
- img_proc: false
  md: 'different. React has internal code that loads and unloads components as needed,
    and a component can exist in several stages of use within that internal code.


    There are a lot of lifecycle methods, but the most common ones are:


    **render()** This method is the only required method within a class component
    in React and is the most used. As the name suggests, it handles the rendering
    of your component to the UI, and it happens during the mounting and rendering
    of your component.


    When the component is created or removed:


    +   * componentDidMount() runs after the component output has been rendered to
    the DOM.


    +   * componentWillWillUnmount() is invoked immediately before a component is
    unmounted and destroyed


    When the props or states get updated:


    +   * shouldComponentUpdate() is invoked before rendering when new props or state
    are being received.


    +   * componentDidUpdate() is invoked immediately after updating occurs. This
    method is not called for the initial render.'
  merge: -1
