    # Preload in single-page apps


    While prefetching is a great way to cache resources that may be requested some
    time soon, we can preload resources that need to be used instantly. Maybe it''s
    a certain font that is used on the initial render, or certain images that the
    user sees right away.


    Say our EmojiPicker component should be visible instantly on the initial render.
    Although it should not be included in the main bundle, it should get loaded in
    parallel. Just like prefetch, we can add a magic comment in order to let Webpack
    know that this module should be preloaded.


    ```

    const EmojiPicker = import(/* webpackPreload: true */ ".//EmojiPicker");

    ```'
