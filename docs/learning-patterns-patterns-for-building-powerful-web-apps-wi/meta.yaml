  md: "Perfect! Instead of wrapping the DogImages component with the withHover component,\
    \ we can simply use the useHover hook within the component directly.\n\nGenerally\
    \ speaking, React Hooks don't replace the HOC pattern. As the React docs tell\
    \ us, using Hooks can reduce the depth of the component tree. Using the HOC pattern,\
    \ it's easy to end up with a deeply nested component tree.\n\n```\n<withAuth>\n\
    \  <withLayout>\n    <withLogging>\n      <Component />\n    </withLogging>\n\
    \  </withLayout>\n</withAuth>\n```\n\nBy adding a Hook to the component directly,\
    \ we no longer have to wrap components.\n\nUsing Higher Order Components makes\
    \ it possible to provide the same logic to many components, while keeping that\
    \ logic in one single place. Hooks allow us to add custom behavior from within\
    \ the component, which could potentially increase the risk of introducing bugs\
    \ compared to the HOC pattern if multiple components rely on this behavior."
  merge: -1
