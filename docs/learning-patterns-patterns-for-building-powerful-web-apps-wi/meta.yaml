  md: "# # Singleton Pattern\n\nShare a single global instance throughout our application\n\
    \nSingletons are classes which can be instantiated once, and can be accessed globally.\
    \ This single instance can be shared throughout our application, which makes Singletons\
    \ great for managing global state in an application.\n\nFirst, let's take a look\
    \ at what a singleton can look like using an ES2015 class. For this example, we're\
    \ going to build a Counter class that has:\n\n```\nlet counter = 0;\n\nclass Counter\
    \ {\n  getInstance() {\n    return this;\n  }\n\n  getCount() {\n    return counter;\n\
    \  }\n\n  increment() {\n    return ++counter;\n  }\n\n  decrement() {\n    return\
    \ --counter;\n  }\n}\n```"
  merge: -1
  pgno: 34
