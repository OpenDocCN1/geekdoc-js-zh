  md: "# Testing\n\nTesting code that relies on a Singleton can get tricky. Since\
    \ we can't create new instances each time, all tests rely on the modification\
    \ to the global instance of the previous test. The order of the tests matter in\
    \ this case, and one small modification can lead to an entire test suite failing.\
    \ After testing, we need to reset the entire instance in order to reset the modifications\
    \ made by the tests.\n\n```\nimport Counter from \"../src/counterTest\";\n\ntest(\"\
    incrementing 1 time should be 1\", () => {\n  Counter.increment();\n  expect(Counter.getCount()).toBe(1);\n\
    });\n\ntest(\"incrementing 3 extra times should be 4\", () => {\n  Counter.increment();\n\
    \  Counter.increment();\n  Counter.increment();\n  expect(Counter.getCount()).toBe(4);\n\
    });\n\ntest(\"decrementing 1 times should be 3\", () => {\n  Counter.decrement();\n\
