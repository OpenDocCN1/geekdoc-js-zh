    In the preceding example, Aditya is an instance that was created from the child
    constructor function. Here, child is both a function and an object, because functions
    ARE objects in JavaScript. This instance can have its own data/properties and
    functionalities from the child object, which we will discuss in the coming section.


    There exist several ways of creating objects in JavaScript. The most fundamental
    and easy to understand method is using ubiquitous object literal pattern. For
    example:


    var student = {


        name: “ritesh”,


        age: “19”,


        branch: “cse”


    };


    Here, we have created an object “student” with name, age and branch as its properties.


    The second method is using the constructor pattern. For example:


    function student (name, age, branch) {


    this.name = name;


    this.age = age;


    this.branch = branch;


    } // student () is the constructor function because we use the new keyword below
    to invoke it.


    var rahul = new student(“rahul”, 19 , “cse”) // Rahul is a new object that we
    have created from the student () constructor function.


    console.log(rahul.name); // Rahul


    console.log(student.branch); // cse


    In the methods detailed above, we observe a major difference between the two.
    In the literal pattern, we have already created an object while declaring it.
    In the constructor pattern, we need to explicitly call the constructor along with
    the “new” keyword in order to create an instance of a student.


    The third and the last method is using the prototype pattern, where we directly
    add each property and method to the object’s prototype as the method’s name suggest.
    For example:


    function student ()


    {


    student.prototype.firstName = "Ritesh";


    student.prototype.lastName = "Kumar";


    student.prototype.age =19;


    student.prototype.branch = “cse”;


    student.prototype.fullName = function () {


    console.log (this.firstName + " " + this.lastName);


    };


    var ritest = new student () // creating instance of student using new keyword


    console.log(ritesh.fullName()); // This logs into the console of the browser with
    the value “Ritesh Kumar”


    You might be confused with the “prototype” keyword being used in the above example.
    This is the most important part of this method. We define prototype as an internal
    object which is used by other objects to inherit properties. This allows multiple
    instances of the same object to share common properties. Therefore, the properties
    which are defined using the prototype object are inherited by all of its instances.


    Now, among the three methods that are available to you for creating objects, “which
    one is the most suitable?” and “in which situation?” needs to be discussed. We
    will try to find the answer to this question in our next section, focused on Encapsulation.


    Why Do We Need Encapsulation?


    The literal method is handy when you want to have only a single copy of a particular
    object, and it is only going to store data. This method is ineffective however,
    when you want to have several instances of the same object with different data
    available to all of them.


    When we want to create many objects with the same properties? We can encapsulate
    the common properties shared by all of them into a function, then use the constructor
    to create multiple objects. This is where we utilize encapsulation.


    The practical implementation in JavaScript uses the constructor and prototype
    method combined. For example:


    function student (name, age, branch) {


        this.name = name;


        this.age = age;


        this.branch= branch;


        this.marks = [];


    }


    With the help of the code above, we created the constructor function for the student
    object using the constructor method. This only contains the data that is associated
    with a student. In the following code snippet, we are going to add the functionalities
    that are associated with the student using the prototype method.


    student.prototype = {


        showName:function ()  {


            return this.name;


        },


        addMarks:function (mark)  {


            this.marks.push(mark);


        }


    }


    Here we end up writing code for defining an object. The next task involves creating
    instances of the object we just created.


    // First instance of the object


    rishabh = new student("rishabh", 20, “cse”);


    rishabh.addMarks(98); // adds 98 to the marks array


    rishabh.showName();  //returns “rishabh”


    // Another instance


    mitul = new student("Mitul", 19, “mechanical”);


    mitul.addMarks(100); // adds 100 to the marks array


    mitul.showName (); // returns “mitul”


    With the example above, the importance and benefits of having encapsulation in
    your hands might be very clear. We encapsulated all the data and functionalities
    of a student into one function, and later created instances of it (rishabh and
    mitul) which share the same properties that a student does. This reduces the whole
    task of defining each property for similar object instances repeatedly.


    That’s it for encapsulation! The next section will be focused on broadening the
    implementation of objects by using inheritance, so that different objects can
    share or inherit properties from a parent element.


    Inheritance in JavaScript


    This feature brings us much closer to the real world. Let us take a look at humans,
    for this example. Human beings inherit some properties from the Hominid class,
    which itself inherits some properties from its parent class that further goes
    on to the Mammal class. Objects inherit properties from its parent’s class. Inheritance
    comes to be very handy when coding to address similar problems. We create an object
    for the Mammal class, which is later inherited by the Hominid class, and human
    beings inherit from the Hominid’s class. While doing so, human beings get the
    properties of both the Hominid’s and Mammal’s classes. Since humans reproduce
    like other mammals, this approach seems to be completely fine. Moreover, the human
    beings’ class can have other properties added to it which might not be available
    to other mammals.


    So far, we have only discussed the real-life implementation of inheritance. Let’s
    dive into coding and flesh it out.


    Let’s make a car object.


    var car = {


        Color: “black”,


        Seats: “4”


    };


    // inheriting from the car object


    var myCar = Object.create (cars); // now myCar inherits the properties from car


    console.log(myCar.color); // black


    We can also add more properties to the instance we created.


    Now comes the meat of the inheritance section. We use the inheritPrototype function
    for inheriting from the parent class.


    function inheritPrototype(child, parent) {


        var parentCopy = Object.create(parent.prototype);


        parentCopy.constructor = child;


       child.prototype = parentCopy;


    }


    Let’s understand how this code works. Initially, we started off by creating an
    instance of the parent child (parentCopy). We store the child instance into the
    constructor of the parentCopy. This is done because in the next step, we will
    be storing the parentCopy into the child’s prototype. When we do this, we override
    the previous contents of the child’s prototype, and hence lose the actual values.
    To keep this from happening, we created a copy of the child’s constructor. While
    we store the parentCopy into child’s constructor, it doesn’t lose its old values.


    Creating a new object, which will later inherit from our parent object i.e., car.


    var audi = {


        name = “audi”


    };


    inheritPrototype(audi, car);


    Audi will have the same properties as a car, but it needs to define its own unique
    property, which is “name”.


    Chapter 2: The ‘this’ keyword in JavaScript


    In JavaScript, the keyword ‘this’ behaves differently than when compared to other
    programming languages. The value of ''this'' is determined by how an object is
    instantiated, or “where the keyword is actually being used”. The ''this'' keyword
    in simple words returns the current local scope object.


    If you are using this on global scope, it will refer to the window object. The
    window object is the only globally available object in JS.'
