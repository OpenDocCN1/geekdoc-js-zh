    by the server. In this step, we are going to learn about its functionality in
    detail.


    The first thing the function needs to do is to check the response’s state. There
    are five response states defined. These are:


    Value State Description


    0 UNSENT Request client created but open method isn’t called yet


    1 OPENED Open method is called


    2 HEADERS_RECEIVED    Send method is called


    3 LOADING Loading the data


    4 DONE Request is complete


    From the table, we can figure out that value 4 is the successful state. We need
    to check whether the response returned was successful or not. In other words,
    we need to check if it state’s value is 4\.


    This can be done by comparing the state’s value to XMLHttpRequest.DONE, which
    has a value of 4.


    if (requestObject.readyState === XMLHttpRequest.DONE) {


        //The request has been successfully completed and can be processed further


    } else {


        // Not yet ready


    }


    Once we are done with the above step, our next step is to check the response code.
    Similar to the response’s state, there are several response codes which can be
    sent by the server. Response code 200 evaluates that it was a successful AJAX
    call. We need to check for code 200 to proceed further.


    if (requestObject.status === 200) {


        // Successful


    } else {


        // The request was unsuccessful


        // 404 (Not Found)


        // 500 (Internal Server Error)


        // 204 (No content)


        // and so on.


    }


    After checking for a successful AJAX request, you can do anything with the returned
    data as required.


    Let’s look into some of its usages.


    • Login forms: You might have observed that some websites pop-up a small login
    window, and upon login notify you that you have been logged in, while the page
    remains unchanged during the process.


    • Auto-complete forms: The most common example of this usage is Google. When you
    type in the search box, it suggests you for a probable term or set of terms you
    might be looking for. This is done using AJAX.


    • Form submission and validation: Almost all websites nowadays validate forms
    on the go using AJAX.


    • Chat rooms and instant messaging: The best example for this is Facebook. While
    chatting, the new messages come up without reloading the whole page. This is AJAX’s
    magic.


    • External Widgets: Google AdSense is a popular example for this. It shows you
    content based on the website you are on and changes accordingly without refreshing
    the whole page.


    Chapter 7: Closures and Callbacks in JavaScript


    The chapter will deal with two very basic concepts of JavaScript, closures and
    callbacks. They allow us to make our code concise, crisp and creative. You will
    encounter these concepts in your development repeatedly. Let us have a look.


    Closures in JavaScript


    Closures, in their most basic form, are inner functions that have access to variables
    from outside its scope. The concept of closures requires a legit understanding
    of nested functions.


    Nested functions are “functions containing functions”. Let’s look at an example
    to expand upon the point:


    //function 1 is an outer function


    function outer(){ //definition of function 1


    //body of outer()


    //function 2 is an inner function


    function inner(){//definition of function 2


    //body of inner()


    }


    }


    In above example, function 2(  inner() ) resides inside the body of function 1(outer())
    and hence is called a nested function. Similarly, we can have more than one nested
    function inside an outer function.


    //function 1 is an outer function


    function outer(){ //definition of function 1


    //body of outer()


    //function inner1 is an inner function


    function inner1(){//definition of inner function 1


    //body of inner()


    }


    //function inner2 is an inner function


    function inner2(){//definition of inner function 2


    //body of inner()


    }


    .


    .


    //function innerN is an inner function


    function innerN(){//definition of Nth inner function


    //body of inner()


    }


    }


    The ability of the inner function to evaluate or perform calculations on the variables
    or parameters defined in outer function is closure.


    Let us take a very basic example of JavaScript code.


    //Example 1


    //define a variable a = 5


    var a = 5;


    //define function add which adds 5 to a and returns value


    var add = function(val){


    a = a + val;//adding val to a


    return a;//return a


    }


    var result = add(5); //will make result = 10


    In above code, the function  add() will take the value of variable a from its
    outer scope, and will add 5 to it and return the result. So, our output will show
    10\. This is the most basic use of closures. Surprised? You might have used it
    multiple times while developing code by now.


    Closures are popular, as the inner functions are able to retrieve variables from
    outside their scope, modify their values, and return the result. The closures
    have access to only the following variables:


    ● variables inside its scope, i.e. variables defined inside the function body


    ● variables of outer function, i.e. variables of containing function


    ● global variables


    Let us move to a more complicated scenario:


    //Example 2


    //define function addTo() which takes a parameter


    var addTo = function(param_outer){


    //define a variable sample of value 10


    var sample = 10;


    //define function add which takes another parameter


    var add = function(){


    return sample + param_outer;


    }


    //return the inner function


    return add;


    }'
