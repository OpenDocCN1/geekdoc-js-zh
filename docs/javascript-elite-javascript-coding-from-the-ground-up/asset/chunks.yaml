    Chapter 12: Memory leaks in JavaScript


    Problems in computing are almost inevitable, and programming is no exception.
    There are several problems that a developer faces every day one of which is Memory
    Leaks. Even though the language you are working on is a memory-managed language,
    there may be instances where memory leaks go undetected by the many algorithms
    that are implemented to detect EXACTLY those memory blocks which can be freed
    up.


    The automatic garbage collection process in high-level languages creates an impression
    on the developer to not worry about memory management in their applications, which
    unfortunately is a widespread misconception. Memory leaks become much more severe
    by giving rise to problems like application crashing, high latency, and slowdowns
    which act as obstacles to a hassle-free user experience.


    Diving into memory leaks


    What are memory leaks? To accomplish a task, applications occupy a certain amount
    of memory from the free memory pool. Generally, this memory should be returned
    after the accomplishment of the task, since a system has fixed amount of memory.
    For reasons still unknown, these garbage memory blocks may still be occupied by
    the application. These instances are termed “memory leaks”. The memory management
    process depends on the language you are working on. The language can employ several
    methods for memory management.


    Many programming languages don’t use a memory management algorithm, but rather
    leave the entire process to the developers. The programming language C has memory
    management primitives like calloc(), malloc(), realloc() and free(). The whole
    task of memory management falls on the developer to call these functions as per
    his/her understanding of the program, to free up memory blocks that should be
    unused.


    Finding unused memory blocks is a very troublesome problem. Those memory blocks
    which can’t be reached by the program can be detected using the garbage collection
    algorithms stated earlier. Despite the language or programmer’s attempts to mitigate
    the problem, there are often cases where some unused memory blocks remain captured
    by the program. The whole logic for memory management depends on the application
    and its developer. The capability of an individual block of memory to be freed
    or not can be readily determined by going through the code and its logic. This
    cannot be done by an algorithm, and has to be done manually by the developer himself/herself.
    For now, we will only concentrate on JavaScript, its memory management process,
    and certain algorithms which are used to reduce memory leaks.


    Memory life-cycle


    Regardless of the language you are working on, memory life-cycle pretty much remains
    the same. The life-cycle of memory consists of three phases:


    •   Memory allocation.


    •   Use the allocated memory either by writing or reading.


    •   Free up the memory when not in use.'
