- fmt: "\nTo make an HTTP request, we need an object that handles the necessary functionalities\
    \ for the request. As we already know that `JavaScript` supports OOPS, making\
    \ an object isn’t a challenging task for us. The only thing we need to handle\
    \ is the various object types that different browsers support. Microsoft’s `Internet\
    \ Explorer` supports `ActiveX` object. Other browsers like `Chrome`, `Mozilla`,\
    \ etc. support `XMLHttpRequest` object. Meanwhile, Microsoft also implemented\
    \ the `XMLHttpRequest` object in its later browsers, but for increased compatibility,\
    \ we are going to consider `ActiveX` object, too.\n\n```javascript\n//browsers\
    \ supporting XMLHttpRequest object\nif (window.XMLHttpRequest) {\n    requestObject\
    \ = new XMLHttpRequest();\n//browsers supporting ActiveX object\n} else if (window.ActiveXObject)\
    \ {\n    requestObject = new ActiveXObject(\"Microsoft.XMLHTTP\");\n}\n```\n\n\
    As covered in our previous section, the server returns a response after processing\
    \ the input. We need to define the function which is going to handle the response.\n\
    \nThe object we have created has a property named `onreadystatechange` which handles\
    \ the response sent back by the server.\n\n`requestObject.onreadystatechange =\
    \ functionName;`\n\nYou might observe that we haven’t put parenthesis after `functionName`.\
    \ This is because we are only assigning a reference to the function.\n\nYou can\
    \ also define a function like this:\n\n```javascript\nrequestObject.onreadystatechange\
    \ = function(){\n    //Body of the function which will handle the response\n};\n\
    ```\n\nNow we are all set to make the request. This can be done by calling the\
    \ `open()` and `send()` methods of the object we just created.\n\n```javascript\n\
    requestObject.open('GET’, ‘http://www/websiteExample.com/file-name’, true);\n\
    requestObject.send();\n```\n\n### Let’s discuss the parameters for the `open`\
    \ method\n\n*   This is known as the HTTP request method. There are several other\
    \ methods that can be passed like `POST`, `HEAD`, `DELETE`, and many others. These\
    \ vary from server to server, as all servers do not support every method defined.\
    \ As per standards, the method should always be in capitals. Otherwise, some browsers\
    \ might not support your request.\n*   The second parameter is the URL you’re\
    \ sending the request to.\n*   The third parameter is for determining whether\
    \ the request is asynchronous or not, and is optional. The default value is “true”,\
    \ which means the script continues and the user is allowed to use the web page\
    \ while the request is being processed. Alternatively, “false” stops the script\
    \ and waits for the server to send a response.\n\n### Step 2- Handling the server’s\
    \ response\n\nIn the first step, we defined a function which would handle the\
    \ responses sent by the server. In this step, we are going to learn about its\
    \ functionality in detail.\n\nThe first thing the function needs to do is to check\
    \ the response’s state. There are five response states defined. These are:\n\n\
    | Value | State | Description |\n| :--- | :--- | :--- |\n| 0 | UNSENT | Request\
    \ client created but `open` method isn’t called yet |\n| 1 | OPENED | `open` method\
    \ is called |\n| 2 | HEADERS_RECEIVED | `send` method is called |\n| 3 | LOADING\
    \ | Loading the data |\n| 4 | DONE | Request is complete |\n\nFrom the table,\
    \ we can figure out that value 4 is the successful state. We need to check whether\
    \ the response returned was successful or not. In other words, we need to check\
    \ if it state’s value is 4\\.\n\nThis can be done by comparing the state’s value\
    \ to `XMLHttpRequest.DONE`, which has a value of 4.\n\n```javascript\nif (requestObject.readyState\
    \ === XMLHttpRequest.DONE) {\n    //The request has been successfully completed\
    \ and can be processed further\n} else {\n    // Not yet ready\n}\n```\n\nOnce\
    \ we are done with the above step, our next step is to check the response code.\
    \ Similar to the response’s state, there are several response codes which can\
    \ be sent by the server. Response code 200 evaluates that it was a successful\
    \ AJAX call. We need to check for code 200 to proceed further.\n\n```javascript\n\
    if (requestObject.status === 200) {\n    // Successful\n} else {\n    // The request\
    \ was unsuccessful\n    // 404 (Not Found)\n    // 500 (Internal Server Error)\n\
    \    // 204 (No content)\n    // and so on.\n}\n```\n\nAfter checking for a successful\
    \ AJAX request, you can do anything with the returned data as required. Let’s\
    \ look into some of its usages:\n\n*   **Login forms**: You might have observed\
    \ that some websites pop-up a small login window, and upon login notify you that\
    \ you have been logged in, while the page remains unchanged during the process.\n\
    *   **Auto-complete forms**: The most common example of this usage is Google.\
    \ When you type in the search box, it suggests you for a probable term or set\
    \ of terms you might be looking for. This is done using AJAX.\n*   **Form submission\
    \ and validation**: Almost all websites nowadays validate forms on the go using\
    \ AJAX.\n*   **Chat rooms and instant messaging**: The best example for this is\
    \ Facebook. While chatting, the new messages come up without reloading the whole\
    \ page. This is AJAX’s magic.\n*   **External Widgets**: Google AdSense is a popular\
    \ example for this. It shows you content based on the website you are on and changes\
    \ accordingly without refreshing the whole page.\n\n# Chapter 7: Closures and\
    \ Callbacks in JavaScript\n\nThe chapter will deal with two very basic concepts\
    \ of JavaScript, closures and callbacks. They allow us to make our code concise,\
    \ crisp and creative. You will encounter these concepts in your development repeatedly.\
    \ Let us have a look at.\n\n## Closures in JavaScript\n\nClosures, in their most\
    \ basic form, are inner functions that have access to variables from outside its\
    \ scope. The concept of closures requires a legit understanding of nested functions.\n\
    \nNested functions are “functions containing functions”. Let’s look at an example\
    \ to expand upon the point:\n\n```javascript\n//function 1 is an outer function\n\
    function outer(){ //definition of function 1\n//body of outer()\n//function 2\
    \ is an inner function\nfunction inner(){//definition of function 2\n//body of\
    \ inner()\n}\n}\n```\n\nIn above example, function 2(`inner()`) resides inside\
    \ the body of function 1(`outer()`) and hence is called a nested function. Similarly,\
    \ we can have more than one nested function inside an outer function.\n\n```javascript\n\
    //function 1 is an outer function\nfunction outer(){ //definition of function\
    \ 1\n//body of outer()\n//function inner1 is an inner function\nfunction inner1(){//definition\
    \ of inner function 1\n//body of inner()\n}\n//function inner2 is an inner function\n\
    function inner2(){//definition of inner function 2\n//body of inner()\n}\n.\n\
    .\n//function innerN is an inner function\nfunction innerN(){//definition of inner\
    \ function\n//body of inner()\n}\n}\n```\n\nThe ability of the inner function\
    \ to evaluate or perform calculations on the variables or parameters defined in\
    \ outer function is closure. Let us take a very basic example of JavaScript code.\n\
    \n```javascript\n//Example 1\n//define a variable a = 5\nvar a = 5;\n//define\
    \ function add which adds 5 to a and returns value\nvar add = function(val){\n\
    a = a + val;//adding val to a\nreturn a;//return a\n}\nvar result = add(5); //will\
    \ make result = 10\n```\n\nIn above code, the function `add()` will take the value\
    \ of variable `a` from its outer scope, and will add 5 to it and return the result.\
    \ So, our output will show 10\\. This is the most basic use of closures. Surprised?\
    \ You might have used it multiple times while developing code by now.\n\nClosures\
    \ are popular, as the inner functions are able to retrieve variables from outside\
    \ their scope, modify their values, and return the result. The closures have access\
    \ to only the following variables:\n\n*   variables inside its scope, i.e. variables\
    \ defined inside the function body\n*   variables of outer function, i.e. variables\
    \ of containing function\n*   global variables\n\nLet us move to a more complicated\
    \ scenario:\n\n```javascript\n//Example 2\n//define function addTo() which takes\
    \ a parameter\nvar addTo = function(param_outer){\n//define a variable sample\
    \ of value 10\nvar sample = 10;\n//define function add which takes another parameter\n\
    var add = function(){\nreturn sample + param_outer;\n}\n//return the inner function\n\
    return add;\n}\n```\n"
