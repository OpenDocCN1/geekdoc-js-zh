    As you can see, ‘After’ was printed before ‘Promise settled’ on the console screen.
    Without knowing any better, it may seem that it would have been be printed after
    it.


    Getting Promise to execute when we want it to


    As explained earlier, promise starts executing the task as soon as it is created.
    However, we often want the promise code to be predefined and to execute when we
    want it to. This is performed by wrapping the promise inside a function and returning
    the promise object from that function.


    The above example would convert to this:


    var friendPromise = function() {


    return new Promise( function(resolve, reject) {


    /* usually an asynchronous task goes here */


    if( isHomeworkCompleted() ) resolve();


    else reject();


    });


    }


    And now we can consume it like this:


    friendPromise().then( function() {


    console.log( ''Promise settled'' );


    }).catch( function() {


    console.log( ''Promise settled'' );


    });


    Passing information from the task to then() or catch() method


    We can achieve this by passing the information as the parameter(s) of resolve()
    or reject() functions. The parameters passed in the resolve() or reject() method
    gets passed as parameters to the function passed as argument of the then() and
    catch() methods, respectively.


    Let’s explore this concept with an example:


    var promiseSum = function() {


    return new Promise( function(resolve, reject) {


    var x = 5 + 5;


    if( someCondition() ) resolve( x + 5 );


    else reject( x * 5 );


    });


    }


    promiseSum().then( function(y) {


    console.log( y ); // prints ‘15’ on the console screen if promise is fulfilled


    }).catch(function(y) {


    console.log( y ); // prints ‘50’ on the console screen if promise is rejected


    });


    Chaining multiple promises


    We can chain the then() methods of multiple promises one after another to execute
    asynchronous tasks one after another. This is because then() returns a promise
    itself.


    If we return a value from the function in the then() method, that value gets passed
    onto the next then() method’s argument function in the chain, if any.


    var examplePromise = function() {


    return new Promise( function(resolve, reject) {


    resolve();


    });


    }


    examplePromise().then( function() {


    return 5 + 7;


    }).then(function( y ) { // chaining


    console.log( y ); // prints ‘12’ on the console screen


    return y + 15;


    }).then(function( y ) { // chaining


    console.log( y ); // prints ‘27’ on the console screen


    });


    If we return a promise from the function in the then() method, the next then()
    method in the chain acts as the then() method of the promise object returned earlier.


    var examplePromise = function() {


    return new Promise( function(resolve, reject) {


    resolve(7);


    });


    }


    var someOtherPromise = function(x) {


    return new Promise( function(resolve, reject) {


    resolve( x * 10 );


    });


    }


    examplePromise().then( function(x) {


    console.log( x ); // prints ‘7’ on the console screen


    return someOtherPromise(x); // returning a NEW promise


    }).then(function( y ) { // chaining


    console.log( y ); // prints ‘70’ on the console screen


    return y + 15;


    }).then(function( y ) { // chaining


    console.log( y ); // prints ‘85’ on the console screen


    });


    The Promise.all() method


    General Syntax:


    Promise.all( [ [ Promise1 [, Promise2 [, Promise3 [, Promise4 … ] ] ] ] ] );


    This method returns a single promise when all of the promises passed as its argument
    have been settled, or one of them is rejected. The resulting promise’s then()
    method function argument’s parameter is an array containing all values passed
    by all the promise’s resolve method, and in the order that they were resolved.


    Let’s see an example:


    var promise1 = new Promise( function(resolve, reject) { resolve(9); });


    var promise2 = new Promise( function(resolve, reject) { resolve(8); });


    var promise3 = new Promise( function(resolve, reject) { resolve(7); });


    var promise4 = new Promise( function(resolve, reject) { resolve(6); });


    var result = Promise.all( [ promise1, promise2, promise3, promise4] );


    result.then( function(x) {


    console.log( x );


    });


    The output of the above code will be:


    [9, 8, 7, 6]


    If a promise in the stack is rejected, the catch() method of the promise is used.
    The function passed as the .catch() argument contains a single value, which is
    the value from the rejected promise in the stack.


    Now let’s see what happens when we change the above example to make a rejected
    promise:


    var promise1 = new Promise( function(resolve, reject) { resolve(9); });


    var promise2 = new Promise( function(resolve, reject) { resolve(8); });


    var promise3 = new Promise( function(resolve, reject) {


    reject(7); // REJECTING


    });


    var promise4 = new Promise( function(resolve, reject) { resolve(6); });


    var result = Promise.all( [ promise1, promise2, promise3, promise4] );


    result.then( function(x) {


    console.log( x ); // prints nothing on the console screen


    }).catch( function(x) {


    console.log( x ); // prints ‘7’ on the console screen


    });


    The Promise.race() method


    General Syntax:


    Promise.race( [ [ Promise1 [, Promise2 [, Promise3 [, Promise4 … ] ] ] ] ] );


    This method takes in an array of promises and returns a single promise. The returned
    promise is the one which is first to settle, either to be resolved or rejected,
    from the stack of the promises passed.


    Promises are a very useful feature of JavaScript and are widely used since it
    provides a clean and manageable method to handle asynchronous tasks in JavaScript.


    Chapter 6: AJAX


    You might have developed a lot of web pages containing images, videos, etc. All
    of them probably lacked a common functionality. They were all perhaps static web
    pages, which had to be refreshed to display new content. There is always an alternative,
    a better way to do any task when you code. Why not have a dynamic web page? This
    is where AJAX comes into the picture. AJAX stands for Asynchronous JavaScript
    And XML.


    AJAX is an important frontend web technology which plays a crucial role in the
    development of several sites you visit all day. This technology helps you update
    a particular part of the web page without the need to refresh the complete page.
    This creates a better and faster web experience for your site’s visitors, and
    also decreases the amount of data exchanged between the host computer and the
    server.


    AJAX helps JavaScript communicate with a web server. Now your site isn’t static
    anymore, but completely dynamic. Gmail, Facebook, Twitter, and Youtube are only
    a few websites to name who utilize AJAX heavily in their frontend code.


    Understanding the AJAX Call Process


    This involves a number of steps to get the task done. We will list those steps
    in this section, and explore the concepts in the next section.


    •    Triggering the event: This happens when you click on a button, submit a form,
    or any type action that initiates a response.


    •    AJAX call fires up and a request is sent to the web server using XML


    •    The server side script (PHP, ASP, etc.) takes the input and processes it
    accordingly. It also accesses the database if required.


    •    The script then sends back the output of the processing performed using XML
    to the client side page which made the particular request to the server.


    •    A JavaScript callback function receives the data, processes it accordingly,
    and then updates the relevant section of the web page.


    Let’s Code!


    Step 1- Making an HTTP request'
