    line.


    ● . CanvasRenderingContext2D.arc()


    Adds an arc to the path centered at (A, B) position with radius r. starts at startAngle
    and ends at endAngle going in the given direction by anticlockwise.


    ● .  CanvasRenderingContext2D.ellipse()


    An ellipse is added to the path centered at (A, B) position


    having radiusX and radiusY as radii, start at startAngle and ends at endAngle
    going in the given direction by anticlockwise.


    ● . CanvasRenderingContext2D.fill()


    subpaths get filled with the current fill style.


    ● .  CanvasRenderingContext2D.rect()


    A path for a rectangle at position (A, B) is created with a size determined by
    respective width and height.


    ● .  CanvasRenderingContext2D.quadraticCurveTo()


    A quadratic Bézier curve is added to the current path.


    ● .  CanvasRenderingContext2D.arcTo()


    An arc to the path is added, including the given radius and the control points
    connected by a straight line to the previous point.


    3\. closePath()


    Closes the path. Let the next drawing commands to direct again.


    4.fill()


    By fill() method we can draw a solid shape filled with the content area.


    5.stroke()


    By stroke() method we can draw a border around the shape.


    Following these steps will help you to draw any shape you can imagine using paths:


    1\. Create a new path


    2\. Draw into the path with the Drawing commands listed above.


    3\. Close the path, once it has drawn. Your path has now been created.


    4\. Once the creation of path is complete, you can easily manipulate it by either
    stroking or filling it.


    5\. The path is now ready to render.


    Drawing a triangle with paths


    This section shows how to draw a triangle with paths. Take a look at the code
    examples below.


    HTML code:


    <!DOCTYPE HTML>


    <HTML>


    <body onload="drawTriangle();">


       <canvas id="idCanvas" width="100" height="100"></canvas>


    </body>


