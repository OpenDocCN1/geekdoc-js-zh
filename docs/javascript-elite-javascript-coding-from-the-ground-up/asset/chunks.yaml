    the window object.


    To get a better understanding of ‘this’, let’s define an object as follows:


    <code>


    var obj = {


    someProperty1: “Hi”,


    someProperty2: function(name) {


    // here ‘this’ will scope to the obj object as it is the current local scope object
    out


    // it''s scope there exists the window object


    return this.someProperty1 + name;


    }


    }


    var myObj = obj.someProperty2(“ John”);


    console.log(myObj); // === “Hi John”


    </code>


    In the code above, in someProperty2 property of obj , we used ‘this’ keyword to
    access another property of current object that is someProperty1, and hence the
    function returned “Hi John” as a result.


    The results would not have been affected if we used arrow functions of JavaScript.
    The results would have bene the same.


    With the help of the ‘this’ operator, we can make constructors of objects in JS
    as follows:


    <code>


    function obj(name) {


    this.name = name;


    this.someMethod = function() {


    console.log(this.name);


    }


    }


    var myObj = new obj(“John”);


    myObj.someMethod(); // === John


    </code>


    You can also use ‘this’ on object prototypal chain like:


    <code>


    var obj = function() {


    return this.a + this.b;


    };


    var myObj = Object(obj);


    myObj.a = 5;


    myObj.b = 6;


    myObj(); // === 11


    </code>


    Similarly as before, we used the this keyword to access the current object, and
    to instantiate its data members and functions.


    I would like to conclude saying that the ‘this’ keyword in JavaScript is something
    you’ll find need of frequently. It will make your work easier and give you much
    flexibility in your coding style.


    Chapter 3: JSON


    JSON or JavaScript  Object Notation, originally specified by Douglas Crockford,
    is one of the most commonly used data-interchange format. JSON is nothing but
    a simple medium of storing and exchanging the data. This exchange happens between
    the browser and the server.


    The format of data can only be text and any JavaScript Object can be converted
    into JSON format for sending data to the server. Likewise, any JSON text can be
    converted into JavaScript Object when receiving data from the server.


    JSON is a lightweight format which is easy to understand for humans, as well as
    easy to parse for machines. It is language independent, meaning that it is not
    only restricted for use with JavaScript, although, JSON uses JavaScript syntax,
    Since the format is text only, it can be read and used by any programming language.
    Its filename extension is .json. JSON is widely preferred over other data-transferring
    notations such as XML due to its easy-to-parse characteristics.


    JSON Syntax


    JSON syntax somewhat resembles JavaScript syntax, with the minor difference that
    keys must be strings written in double quotes “ ” which include the following
    notations:


    1.  The data to be exchanged should be in the pairs of Name & Value. Each Name
    has a Value corresponding to it, which can be accessed with a JavaScript object
    through its Name.


    Ex: “name”: “Mark”


    1.  The objects are placed inside the Curly braces ‘{ }’. Each name field is followed
    by a colon ‘:’, then its value. Each name-value pair is followed by a comma ‘,’
    in case the user wants to enter another name-value pair.


    Ex: {


    “name”: “Mark”,


    “age”: “20”


    }


    1.  The arrays of these objects are contained in square brackets ‘[ ]’ and each
    object is itself separated by a comma in an array.


    Ex: [


    {


    “name”: “Mark”,


    “age”: “20”


    },


    {


    “name”: “Anthony”,


    “age”: “40”


    }]


    Data Types


    JSON can be written with the values having following data types:


    1.  Number - In JSON, numbers used must be integers or floating-point numbers


    Ex: { “age”: 20 }


    1.  String


    Ex: { “firstName”: “Mark” }


    1.  Boolean


    Ex: { “vegetarian”: true }


    1.  Array


    Ex: { “children”: [“Henry”, “Emma”, “Joe”] }


    1.  Another JSON object


    Ex: {


    “details”: {


    “lastName”: “Lucas”,


    “bankAccount”: “savings”


    }


    }


    1.  Null


    Ex: { “middleName”: null }


    Note: Do not confuse JSON data types with JavaScript data types. Do not use any
    of the following data types:


    1.  Functions


    2.  Dates


    3.  undefined


    Objects in JSON


    JSON Object values can be accessed using dot(.) notation as follows:


    Ex: If we want to access only the firstName of the variable fullName, it can be
    done as such:


    var fullName = {


    “firstName”: “Mark”,


    “lastName”: “Anthony”


    };


    var firstname = fullName.firstName;


    Another way is to use square bracket [ ] notation:


    var firstname = fullName[“firstName”];


    Similarly, we can access the nested JSON objects by moving down the hierarchy
    name by name.


    Ex: var fullName = {


    “name”: {


    “firstName”: “Mark”,


    “lastName”: “Anthony”


    },


    “age”: 25,


    “profession”: “Business”


    }


    var firstname = fullName.name.firstName;


    Values can also be set using dot or square bracket notation by simply equating
    the desired key with the required value:


    Ex: fullName.name.firstName = “Ross”;


    Or fullName.name[“firstName”] = “Ross”;


    Arrays in JSON


    JSON array values can be accessed using the index number of the key/value of that
    specific array.


    Ex: var fullName = {


    “name”: [


    “firstName”: “Mark”,


    “middleName”: null,


    “lastName”: “Anthony”


    ],


    “age”: 25,


    “profession”: “Business”


    }


    var firstname = fullName.name[0];


    Similarly, we can access the nested JSON arrays by moving down the hierarchy name
    by name.


    Ex: var fullName = {


    “details”: [


    {


    “name”: [


    “firstName”: “Mark”,


    “lastName”: “Anthony”


    ],


    },


    { “age”: 25 },


    { “profession”: “Business”}


    ]


    }


    var firstname = fullName.details[0].name[0];


    In arrays, values can only be set using square bracket notation by equating the
    desired key with the required value:


    Ex: fullName.details[0].name[0] = “Ross”;


    JSON Methods


    The JSON data received from the server-side to the client-side will always a string.
    Since we require the data to be a JavaScript object to access the values from
    the keys, the JSON data is parsed using the JSON.parse() method.


    Ex: JSON.parse(‘{ “children”: { “Henry”, “Emma”, “Joe” } }’); will give us the
    JSON object { “children”: { “Henry”, “Emma”, “Joe” } }


    Note: Text must be written in JSON format to avoid a syntax error.


    Similarly, the JSON data to be sent from the client-side to the server-side is
    must always be a string. Since our data is a JavaScript object, we need to convert
    it to a string before sending it to the server. The JSON object is converted to
    a string using the JSON.stringify() method.


    Ex: JSON.stringify({ “children”: { “Henry”, “Emma”, “Joe” } }); will give us the
    string ‘{ “children”: { “Henry”, “Emma”, “Joe” } }’


    Arrays can also be stringified in the same way using “JSON.stringify(arr)”, where
    arr is an array of JSON objects.


    Chapter 4: Synchronous and Asynchronous JavaScript


    Understanding the concept of asynchronous and synchronous in terms of programming
    is a rather difficult task. There can be a steep learning curve, but after getting
    a good grasp of this concept, you will be able to understand other advanced concepts
    easily. Most of the advanced concepts in JavaScript are based on asynchronous
    behaviors within JavaScript.


    What do synchronous and asynchronous mean?


    “Synchronous” refers to actions occurring simultaneously, happening at the same
    time as one another. Asynchronous is simply opposite of synchronous.


    In terms of programming, synchronous behavior means that the code is executed
    in the same order that it is written in, and asynchronous means that code is not
    necessarily executed in the same order that it is written in.


    Let us understand this with the help of a real-life scenario.'
