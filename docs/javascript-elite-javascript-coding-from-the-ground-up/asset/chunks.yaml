  trans: "\n\n为了发送 HTTP 请求，我们需要一个能够处理请求所需功能的对象。由于我们已经知道 `JavaScript` 支持面向对象编程（OOPS），创建一个对象对我们来说并不是一项挑战性任务。我们需要处理的是不同浏览器支持的各种对象类型。微软的\
    \ `Internet Explorer` 支持 `ActiveX` 对象。其他浏览器如 `Chrome`、`Mozilla` 等支持 `XMLHttpRequest`\
    \ 对象。同时，微软在其后的浏览器中也实现了 `XMLHttpRequest` 对象，但为了提高兼容性，我们也将考虑 `ActiveX` 对象。\n\n```javascript\n\
    //支持 XMLHttpRequest 对象的浏览器\nif (window.XMLHttpRequest) {\n    requestObject =\
    \ new XMLHttpRequest();\n//支持 ActiveX 对象的浏览器\n} else if (window.ActiveXObject)\
    \ {\n    requestObject = new ActiveXObject(\"Microsoft.XMLHTTP\");\n}\n```\n\n\
    正如我们在上一个节中提到的，服务器在处理输入后会返回响应。我们需要定义一个用于处理该响应的函数。\n\n我们创建的对象有一个名为 `onreadystatechange`\
    \ 的属性，它负责处理服务器返回的响应。\n\n`requestObject.onreadystatechange = functionName;`\n\n\
    你可能会注意到我们在 `functionName` 后面没有加括号。这是因为我们只是在赋值一个函数的引用。\n\n你也可以这样定义函数：\n\n```javascript\n\
    requestObject.onreadystatechange = function(){\n    //处理响应的函数体\n};\n```\n\n现在我们已经准备好发送请求了。这可以通过调用我们创建对象的\
    \ `open()` 和 `send()` 方法来实现。\n\n```javascript\nrequestObject.open('GET’, ‘http://www/websiteExample.com/file-name’,\
    \ true);\nrequestObject.send();\n```\n\n### 让我们讨论一下 `open` 方法的参数\n\n*   这被称为 HTTP\
    \ 请求方法。还可以传递其他几种方法，如 `POST`、`HEAD`、`DELETE` 等。这些方法因服务器而异，因为并非所有服务器都支持定义的每种方法。根据标准，方法应始终保持大写。否则，某些浏览器可能不支持你的请求。\n\
    *   第二个参数是你正在发送请求的 URL。\n*   第三个参数用于确定请求是否为异步请求，它是可选的。默认值为“true”，这意味着脚本将继续执行，允许用户在请求处理期间使用网页。相应地，“false”会停止脚本并等待服务器发送响应。\n\
    \n### 第 2 步 - 处理服务器的响应\n\n在第一步中，我们定义了一个处理服务器发送响应的函数。在这一步中，我们将详细学习它的功能。\n\n函数需要执行的第一件事是检查响应的状态。定义了五种响应状态，它们是：\n\
    \n| 值 | 状态 | 描述 |\n| :--- | :--- | :--- |\n| 0 | UNSENT | 请求客户端已创建，但尚未调用 `open`\
    \ 方法 |\n| 1 | OPENED | `open` 方法已被调用 |\n| 2 | HEADERS_RECEIVED | `send` 方法已被调用\
    \ |\n| 3 | LOADING | 正在加载数据 |\n| 4 | DONE | 请求完成 |\n\n从表中可以推出值 4 是成功状态。我们需要检查返回的响应是否成功。换句话说，我们需要检查其状态值是否为\
    \ 4。\n\n这可以通过将状态值与 `XMLHttpRequest.DONE`（其值为 4）进行比较来实现。\n\n```javascript\nif (requestObject.readyState\
    \ === XMLHttpRequest.DONE) {\n    // 请求已成功完成，可以进行进一步处理\n} else {\n    // 尚未就绪\n\
    }\n```\n\n一旦完成了上述步骤，我们的下一步是检查响应码。与响应状态类似，服务器可以发送几种响应码。响应码 200 表示这是一次成功的 AJAX 调用。我们需要检查代码是否为\
    \ 200 以继续后续。\n\n```javascript\nif (requestObject.status === 200) {\n    // 成功\n\
    } else {\n    // 请求失败\n    // 404 (未找到)\n    // 500 (内部服务器错误)\n    // 204 (无内容)\n\
    \    // 等此类推。\n}\n```\n\n在检查 AJAX 请求是否成功后，你可以根据需要对返回的数据进行任何操作。让我们来看看它的一些用法：\n\n\
    *   **登录表单**：你可能观察到某些网站会弹出一个小的登录窗口，并在登录后通知你已登录，而在此过程中页面保持不变。\n*   **自动补全表单**：这种用法最常见的例子是\
    \ Google。当你向搜索框中输入内容时，它会为你建议你可能正在寻找的词或一组词。这是使用 AJAX 实现的。\n*   **表单提交与验证**：如今几乎所有的网站都使用\
    \ AJAX 实时验证表单。\n*   **聊天室和即时消息**：这最好的例子是 Facebook。在聊天时，新消息会出来而无需重新加载整个页面。这就是 AJAX\
    \ 的魔力。\n*   **外部组件**：Google AdSense 是此的一个流行例子。它根据你所在的网站向你显示内容并进行相应更改，而无需刷新整个页面。\n\
    \n# 第 7 章：JavaScript 中的闭包和回调\n\n本章将涉及 JavaScript 的两个非常基础的概念：闭包（closures）和回调（callbacks）。它们允许我们使代码更加简洁、干练且富有创意。你将在开发中反复遇到这些概念。\n\
    \n## JavaScript 中的闭包\n\n闭包在最基础的形式下，是指能够访问作用域之外变量的内部函数。闭包的概念需要对嵌套函数有合法的理解。\n\n\
    嵌套函数是“包含函数的函数”。让我们来看一下：\n\n```javascript\n//函数 1 是外部函数\nfunction outer(){ // 定义函数\
    \ 1\n    //函数 2 是内部函数\n    function inner(){ // 定义函数 2\n    }\n}\n\n```\n\n在上面的示例中，函数\
    \ 2 (`inner()`) 位于函数 1 (`outer()`) 内部，因此被称为嵌套函数。同样，我们可以在外部函数内部有多个一个嵌套函数。\n\n```javascript\n\
    //函数 1 是外部函数\nfunction outer(){ // 定义函数 1\n    //函数 1 是内部函数\n    function inner1(){\
    \ // 定义函数 1\n    }\n    //函数 2 是内部函数\n    function inner2(){ // 定义函数 2\n    }\n\
    \    .\n    //函数 N 是内部函数\n    function innerN(){ // 定义函数 N\n    }\n}\n```\n\n\
    内部函数对外部函数定义的变量或参数进行求值或计算的能力就是闭包。让我们来看一个非常基本的 JavaScript 代码示例。\n\n```javascript\n\
    //示例 1\n//定义变量 a = 5\nvar a = 5;\n//定义函数 add，将 5 加到 a 并返回值\nvar add = function(val){\n\
    a = a + val;// 将 val 加到 a\nreturn a;// 返回 a\n}\nvar result = add(5); // 将使 result\
    \ 等于 10\n```\n\n在上面的代码中，函数 `add()` 从其外部作用域获取变量 `a` 的值，并将其加 5 后返回结果。因此，我们的输出将显示\
    \ 10。这就是闭包的最基本用法。感到惊讶吗？到目前为止，你可能已经多次使用了它。\n\n闭包非常流行，因为内部函数能够从其作用域之外检索变量、修改其值并返回结果。闭包可以访问以下变量：\n\
    \n*   作用域内部的变量，即函数体内部定义的变量\n*   外部函数的变量，即包含函数的变量\n*   全局变量\n\n让我们进入一个更复杂的场景：\n\
    \n```javascript\n//示例 2\n//定义接收一个参数的函数 addTo\nvar addTo = function(param_outer){\n\
    //定义一个值为 10 的变量 sample\nvar sample = 10;\n//定义接收另一个参数的函数 add\nvar add = function(){\n\
    return sample + param_outer;\n}\n//返回内部函数\nreturn add;\n}\n```\n\n"
- fmt: "\nHere, we have a nested function `add()` which can take in parameters from\
    \ the outer function `addTo()`. When user makes a call to `addTo()` with some\
    \ parameter, he will get the inner function as a return for it, which in turn\
    \ will execute the addition and return the value.\n\n```javascript\nvar test =\
    \ addTo(10);\n```\n\nInternally, `param_outer` will be equal to 10, and `add`\
    \ will take value of addition of `param_outer` and `sample` and will evaluate\
    \ to 20.\n\n```javascript\nvar add = 20 ;\n```\n\nWhen the `addTo()` call returns\
    \ `add`, the value of `test` will equal to that of `add`, which is 20.\n\nLet\
    \ us take an even more complicated example:\n\n```javascript\n//Example 3\n\n\
    //define function addTo() which takes a parameter\n\nvar addTo = function(param_outer){\n\
    \n//define function add which takes another parameter\n\nvar add = function(param_inner){\n\
    \nreturn param_inner + param_outer;\n\n}\n\n//return the inner function\n\nreturn\
    \ add;\n}\n\nvar test = addTo(10); //value will not be 20\n```\n\nHere, `test`\
    \ will take the value of inner function and will become a function itself, which\
    \ will have a preserved variable, `param_outer` equal to 10, set by us.\n\nSo,\
    \ `test` will internally look like this:\n\n```javascript\n//this is only a representation\
    \ of how it will internally look\n\nvar test = function(param_inner){\n\nreturn\
    \ param_inner + 10;\n\n}\n```\n\nIf we want to add 10 to any number, we can simply\
    \ write:\n\n```javascript\nvar x =10;\n\nvar y = test(x);\n```\n\nThis will make\
    \ the value of `y` equal to 20, or 10 + 10.\n\nA good use case is when we want\
    \ to add a constant to some numbers. We can use this approach for closures.\n\n\
    Example:\n\n```javascript\nvar addThree = addTo(3);\n\nvar a = addThree(10);//a\
    \ will have 3 + 10 = 13   \n\nvar a = addThree(20);//a will have 3 + 20 = 13 \
    \  \n\nvar a = addThree(30);//a will have 3 + 30 = 33\n```\n\n### Features of\
    \ Closures\n\n- The inner functions have access to outer function variables even\
    \ after they have been executed, as we saw in our third example. We called the\
    \ outer function before calling the inner function and even after returning the\
    \ value, we could use the outer function parameters inside the inner function\
    \ as it was preserved.\n- Closures store references and not actual values to outer\
    \ functions variables and can be edited, if needed (refer example 4).\n- Closures\
    \ provide a secure way of dealing with certain data, as we can save references\
    \ to variables and prevent accidental changes.\n\n```javascript\n//Example 4\n\
    \n//define a variable a = 5\n\nvar a = 5;\n\n//define function add which adds\
    \ 5 to a and returns value\n\nvar add = function(val){\n\na = a + val;//adding\
    \ val to a\n\nreturn a;//return a\n}\n\na = 10; //update value of a\n\nvar result\
    \ = add(5); //will make result equal to 15 and not 10 as //value of a is updated\
    \ before the closure is called so saved //reference is updated with new reference\n\
    ```\n\nClosures are powerful but due care needs to be taken, as updated references\
    \ can make your code full of bugs. Always make sure to use the capability carefully.\n\
    \n**Note:** Closures are functions or inner function which have preserved data\
    \ referenced inside them from global or outer scopes. \n\n### Callbacks in JavaScript\n\
    \nJavaScript functions are first-class objects. “First-class objects” mean that\
    \ they can be used like other objects in the body. Like variables, we can save\
    \ their references, pass them as arguments, declare nested functions (refer to\
    \ previous sections), and can be return values of functions as we saw earlier.\n\
    \nThe capability of a function to be passed as argument to another function makes\
    \ JavaScript functions special. A passed function can be executed at a later stage,\
    \ or be returned as a function to be executed later by some other function. This\
    \ is what constitutes the JavaScript Callbacks.\n\nCallbacks are functions which\
    \ are passed as parameters to another function and is executed from the body of\
    \ the containing function. Since the scenarios where such capabilities are of\
    \ use is limited, they can be referred to as callback patterns.\n\n```javascript\n\
    //define a callback function sum()\n\nvar sum = function ( num1 , num2 ){\n\n\
    return num1 + num2;\n\n}\n\n//define a function that will use sum() as parameter\n\
    \nvar calling_func = function ( a , b , callback ){\n\nreturn callback ( a , b\
    \ //calling the callback function with //parameters\n\n}\n\nvar sample = calling_func(\
    \ 5 , 5 , sum);//new will be assigned 10\n```\n\nLet us walk through the code\
    \ above. First, we declare a simple function that adds two values and return the\
    \ result. Next, we define a function which takes in two parameters and a third\
    \ parameter which is “callback”. Callback is basically a variable which will store\
    \ the name of function we will pass and execute it accordingly. It can be called\
    \ any name. For ease of understanding, I have named it `callback`.\n\nThe important\
    \ thing to note is that when we pass a function as variable, we only send the\
    \ definition of callback function as in the name (say `sum`), not the function\
    \ call with parenthesis. The function is executed only when it is called inside\
    \ the body of the containing function.\n\nAs we have seen, callback functions\
    \ are not called immediately, but are preserved as references and are only called\
    \ when specified by the calling function, thus making them closures as detailed\
    \ in the previous section.\n\nCallback functions not only can take existing functions\
    \ as parameters, but can also define a completely new function in the parameter.\n\
    \n```javascript\n//define a callback function sum()\n\nvar sum = function ( num1\
    \ , num2 ){\n\nreturn num1 + num2;\n\n}\n\n//define a function that will use sum()\
    \ as parameter\n\nvar calling_func = function ( a , b , callback ){\n\nreturn\
    \ callback ( a , b //calling the callback function with //parameters\n\n}\n\n\
    var sample = calling_func( 5 , 5 , sum);//new will be assigned 10\n```\n\nWait,\
