    \n我们可以通过这种方式实现许多高级动画。\n\n## 事件处理\n\nJavaScript 中的动画可以根据用户的操作来触发。\n\n以下是一些常见触发事件及其用途的列表。\n\
    \n示例：\n\n1. 用户点击按钮时，按钮应立即执行动画。\n2. 当用户点击特定按钮时，下拉菜单应执行动画。\n3. 用户滚动页面时，背景过渡应发生变化。\n\
    \n根本上，每当用户执行特定操作时，任何基础动画都应该发生。\n\n### 鼠标常用事件\n\n● `onclick`: 当用户点击鼠标时执行给定的任务。\n\
    ● `oncontextmenu`: 当用户右键点击鼠标时执行特定任务。\n● `ondblclick`: 当用户双击鼠标时执行特定任务。\n● `onmouseover`:\
    \ 当鼠标指针移动到元素上时执行特定任务。\n● `onmousemove`: 当鼠标指针在移动时执行特定任务。\n● `onmouseup`: 当用户从元素上释放鼠标键时执行特定任务。\n\
    \n### 键盘常用事件\n\n● `onkeydown`: 当用户按下任何指定的按键时执行特定任务。\n● `onkeypress`: 当用户按下键时执行特定任务。\n\
    ● `onkeyup`: 当用户释放按键时执行特定任务。\n\n## 在 JavaScript 中使用 canvas 动画\n\n在 canvas 上动画或移动任何之前绘制的形状的基本规则是：通过逻辑或硬编码的方式重新重绘它。\n\
    \n### 简单动画步骤\n\n在本节中，我们将看到如何使用预定义方法创建帧并动画对象。\n\n### 创建帧的步骤\n\n1. 使用 `clearReact()`\
    \ 方法 -\n   当画布被这些形状填充时，你需要清除之前绘制的形状。`clearReact()` 方法有助于清除画布。\n2. 每次操作前保存。\n \
    \  当你创建一个新设置并希望之前绘制的形状保留在画布上时，在每次创建新帧时都必须保存原始状态。\n3. 添加动画\n   在这一步中，完成了帧的实际渲染。\n\
    4. 恢复过程。\n   最后但同样重要的是，在你目前所做的一切之后，在创建新帧之前允许画布进行恢复。\n\n### 由你定义的动画\n\n在本节中，我们将检查一些控制动画的方法。\n\
    \n1. `setInterval(method, delay)`\n   每隔 `delay` 毫秒重复执行由 `method` 指定的方法。\n2. `setTimeout(method,\
    \ delay)`\n   执行由 `method` 指定的方法，延迟以毫秒为单位。\n3. `requestAnimationFrame(function\
    \ callback)`\n   请求浏览器在下一次绘制之前调用指定的方法来更新动画，根据你的需求。\n4. `windowRequestAnimationFrame()`\n\
    \   当画布准备绘制帧时，可以通过更平滑高效的方式完成动画。回调函数的通常为每秒 60 次，在后台运行时可能会降低频率。\n\n### 示例：\n\n在以下示例中，我们将使用\
    \ JavaScript 对 canvas 元素进行动画。\n\nHTML 代码：\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<canvas id=\"idCanvas\"></canvas>\n</body>\n</html>\n```\n\nCSS 代码：\n\
    ```css\nhtml{\nheight: 100%;\nwidth: 100%;\nmargin: 0;\npadding: 0;\n}\nbody{\n\
    height: 100%;\nwidth: 100%;\nmargin: 0;\npadding: 0;\n}\ncanvas{\nposition: absolute;\n\
    }\n```\n\nJavaScript 代码：\n```javascript\nconst canvas = document.getElementById('idCanvas');\n\
    const context = canvas.getContext('2d');\nlet height, width, s = 1;\nwindow.onresize\
    \ = function resize() {\n  height = canvas.height = document.body.offsetHeight;\n\
    \  width = canvas.width = document.body.offsetWidth;\n};\nwindow.onresize();\n\
    \ncontext.fillStyle = 'white';\ncontext.fillRect(0, 0, width, height);\n(function\
    \ loop() {\n  context.save();\n  context.translate(width/2, height/2);\n  context.fillStyle\
    \ = 'rgba(0,0,0,0.09)';\n  context.fillRect(-width/2, -height/2, width, height);\n\
    \  let j = 0, k = 0;\n  s += 0.001;\n  for( let i = 0; i < 512; i++ ) {\n    const\
    \ r = i * ((j / k) / 5);\n    context.beginPath();\n    context.fillStyle = `hsl(${i%360},\
    \ 100%, 50%)`;\n    context.globalAlpha = r/(512 * ((2 / 3) / 5) / 2) + 0.1;\n\
    \    context.translate(Math.sin(i * s) * (i * j++), Math.cos(i * s) * (i * k++));\n\
    \    context.fillRect(0, 0, r, r);\n    context.closePath();\n    if( j > 2 )\
    \ j = 0;\n  }\n  context.restore();\n  requestAnimationFrame(loop);\n})();\n```\n\
    \n"
- fmt: "\nEfficient usage of memory has always been troublesome for developers, and\
    \ will always be. However, the first and third steps differ in low-level and high-level\
    \ languages. High-level languages implement it implicitly (done by the language\
    \ automatically), whereas low-level languages implement it explicitly (has to\
    \ be done by the programmer himself/herself).\n\n## Memory allocation\n\nMemory\
    \ can be allocated mainly in two ways:\n\n- **Value Initialization**: JavaScript\
    \ allocates memory while declaring values.\n\n```javascript\nvar number = 1234;//This\
    \ allocates memory for a variable `number` of type number\nvar name = ‘John’;\
    \ //This allocates memory for a variable `name` of type string\nvar obj = {\n\
    \    x: ‘name’,\n    y: 8\n}//This allocates memory for an object `obj` and the\
    \ values contained in it.\nvar arr = [2, 3, 4, 5];//This allocates memory for\
    \ an array of numbers\nfunction add5(num1){\nreturn num1+5;\n}//allocated memory\n\
    ```\n\n- **Function Calls**: Some function calls also result in the allocation\
    \ of memory for an object.\n\n```javascript\nvar date = new Date(); //This allocates\
    \ memory for date object\n```\n\n## Garbage collection\n\nAs mentioned before,\
    \ certain algorithms are implemented to find the memory blocks which are unused\
    \ by the application and available to be freed up. Here, we are going to look\
    \ into the two most important garbage collection algorithms and their limitations:\n\
    \n- Reference Counting Garbage Collection\n- Mark-and-Sweep Algorithm\n\n### Reference\
    \ counting garbage collection\n\nMany popular languages, such as `PHP` and `Python`,\
    \ implement this algorithm. It’s based on the idea that if there are no references\
    \ to an object, it can be freed up. It considers an object with zero references\
    \ to be an object which is no longer in use by the application.\n\n```javascript\n\
    var obj = {obj1: {x:3}, c:3, d: 4};\nobj -----> obj1 //As one object references\
    \ another, neither of them can be freed up\nobj = 0; //Now, no object references\
    \ to 'obj1' and hence this can be freed up\n```\n\n**LIMITATION:**\n\nThis algorithm\
    \ tends to fail when objects create a reference cycle, as explained in the example\
    \ below:\n\n```javascript\nvar obj1 = {}\nvar obj2 = {}\nobj1.x = obj2;\nobj2.x\
    \ = obj1;\n```\n\nThis creates a reference cycle between objects `obj1` and `obj2`.\
    \ Let this code snippet be a part of a function, or any local scope. When the\
    \ program goes out of this scope, both these objects become useless and hence\
    \ should be freed up as they are no longer in use. The reference counting algorithm\
    \ fails to free the memory taken by these objects as they both have at least one\
    \ reference to them.\n\n### Mark-and-sweep algorithm\n\nWhen an individual object\
    \ is unreachable by the application, the mark-and-sweep algorithm returns the\
    \ memory occupied by that object to the free memory pool.\n\nThough the reference\
    \ cycle problem no longer prevails in this algorithm, there can be instances when\
    \ some zombie memory blocks aren’t released as the algorithm considers them to\
    \ be reachable.\n\n## Common mistakes in JavaScript leading to memory leaks\n\n\
    - Accidental Global Variables\n- Closures\n- DOM References to Removed Elements\n\
    - Forgotten Callbacks\n\nWhile some languages do provide garbage collection mechanisms,\
    \ they do not prove to be universally effective. It ultimately depends on the\
    \ programmer to keep track of the memory usage and try to free up memory explicitly\
    \ wherever possible. Doing so adds to the potential of the garbage collection\
    \ mechanism employed by the language to reduce any such error of memory leaks.\n\
    \n## Chapter 13: Recursion in JavaScript\n\nRecursion is a programming technique,\
    \ which can be used in almost all programming languages. It is not a function\
    \ or a data type. It is a type of architecture, a design pattern, or a type of\
    \ coding style to solve a particular problem.\n\n### What is Recursion?\n\nRecursion\
    \ is the act of calling a function from within the function itself. It may sound\
    \ simple, but can be a complex concept to grasp in practice. Many programmers\
    \ struggle to understand on how to use this technique properly. This process of\
    \ calling the function from within itself goes on until the desired goal is achieved.\n\
    \nRecursion is a loop. You repeat the same set of code again and again, as the\
    \ function calls itself from within itself. You can generally achieve the same\
    \ goal using recursion or using a loop. Most recursive algorithms can be recreated\
    \ by using loops.\n\n### Recursion Examples\n\nLet us take a look at some examples\
    \ of loops, and the equivalent recursion for accomplishing the same goal.\n\n\
    We will start by printing numbers from 0 to 10. When using a loop, the code will\
    \ look something like this:\n\n```javascript\nfor(var i = 0; i <= 10; i++) {\n\
    \    console.log( i );\n}\n```\n\nNow let us take a look at the recursive technique\
    \ to print all the numbers from 0 to 10:\n\n```javascript\nfunction printNumbers(x)\
    \ {\nconsole.log( x );\nX++; // incrementing x’s value\nif(x < 10)printNumbers(x);\n\
    }\nprintNumbers(0); // calling function once to initialize process\n```\n\nBoth\
    \ pieces of code do the same thing. With the recursion technique, you can see\
    \ that we have an `if` statement that checks whether `x`’s value is less than\
    \ 10. If it is less than 10, the function is called again. We need to have these\
    \ types of checks if using the recursion technique, or else the recursion process\
    \ will go on forever.\n\nLet us move onto more difficult problems. We will try\
    \ getting the factorial of a number, which is the product of all numbers. First,\
    \ let us do it with help of a loop:\n\n```javascript\nvar number = 6;\nfunction\
    \ getFactorial(x) {\n    var r = 1;\n    for(var i = 1; i <= number; i++) {\n\
    \        r = i * r;\n    }\n    return r;\n}\nvar result = getFactorial( number\
    \ );\nconsole.log( 'Factorial of ' + number + ' is ' + result );\n```\n\nNow,\
    \ let us see how to do it via recursion:\n\n```javascript\nvar number = 6;\nfunction\
    \ getFactorial(x) {\n    if(x == 1) return x;\n    return x * getFactorial( --x\
    \ ); // recursion!\n}\nvar result = getFactorial( number );\nconsole.log( 'Factorial\
    \ of ' + number + ' is ' + result );\n```\n\nWhat happens here is that we decrease\
    \ `x`’s value by 1 every instance before we make the recursive call. We check\
    \ to “if `x`’s value is 1, then return `x`”. Until the value of `x` reaches 1\
    \ there is a stack of calls:\n\nCall `getFactorial(6)`\n- Return `6 x getFactorial(5)`\
    \ step i\n- Return `5 x getFactorial(4)` step ii\n- Return `4 x getFactorial(3)`\
    \ step iii\n- Return `3 x getFactorial(2)` step iv\n- Return `2 x getFactorial(1)`\
    \ step v\n\n`getFactorial(1)` returns 1 because of the check, so now values go\
    \ up the queue is mentioned above:\n- Control moves to step v which now becomes:\
    \ `2 x 1` or `2`\n- Control moves to step iv which now becomes: `3 x 2` or `6`\n\
    - Control moves to step iii which now becomes: `4 x 6` or `24`\n- Control moves\
    \ to step ii which now becomes: `5 x 24` or `120`\n- Control moves to step i which\
    \ now becomes: `6 x 120` or `720`\n\nFinally, the factorial of 6, i.e., 720, is\
    \ returned.\n\n### Recursion disadvantages\n\nWhile recursion can make a complex\
    \ problem’s code shorter, it still has some major disadvantages that should be\
    \ kept in mind when utilizing it in practice:\n\n- It makes the code more difficult\
    \ to understand.\n- Each call to function gets stacked up in memory. A very long\
    \ recursive chain can lead to filling all of the memory that the JavaScript engine\
    \ is allocated, thus leading to unforeseen errors. Different machines may have\
    \ different memory capacity.\n- Recursion is slower than loops, as there must\
    \ be a new call to function in each iteration. Every function call consumes some\
    \ time.\n\n## Where to use Recursion?\n"
