    \nThank you for downloading JavaScript: Elite JavaScript Coding from The Ground\
    \ Up! This book is the fourth entry of the DIY JavaScript series. It is preceded\
    \ by the books:\n\n- JavaScript: Beginner JavaScript Coding from The Ground Up\n\
    - JavaScript: Intermediate JavaScript Coding from The Ground Up\n- JavaScript:\
    \ Advanced JavaScript Coding from The Ground Up\n\n…and assumes that the user\
    \ is familiar with the contents of those books, including JavaScript code, syntax,\
    \ and beginner to advanced concepts. The books should be taken in chronological\
    \ order for optimal results. This book will cover high level JavaScript manipulation\
    \ techniques, with code examples to match the topics explained.\n\nThank you again\
    \ for downloading this book! You have many choices available to you for furthering\
    \ your JavaScript coding knowledge. Thank you for selecting the DIY JavaScript\
    \ series as your tool of choice!\n\n## Chapter 1: Object-oriented programming\
    \ in JavaScript\n\nAmong a chest-full of programming languages, choosing one of\
    \ them needs to be done wisely. There are a lot of factors that affect the choice\
    \ of language, ranging from efficiency to reliability. A significant part of the\
    \ whole discussion also depends on the paradigm the language follows.\n\nA programming\
    \ paradigm is a model to classify programming languages based on the features\
    \ it provides. It is a fundamental style of building the structure and elements\
    \ of the language. The styles and capabilities of the programming languages are\
    \ defined by their paradigms. A language can even implement multiple paradigms.\
    \ For example, Haskell uses only a single paradigm to define itself i.e., functional\
    \ programming. JavaScript supports functional, object-oriented and imperative\
    \ programming styles. Different programming paradigms are:\n\n- Imperative\n-\
    \ Object-oriented\n- Logic\n- Symbolic\n- Declarative\n- Functional\n\nWhy do\
    \ we have so many paradigms? The answer to this basic question is because we have\
    \ a lot of problems to solve and different paradigms work more efficiently when\
    \ tackling particular sets of problems. The object-oriented paradigm is a good\
    \ way to handle complexities, while concurrency can be avoided by using the functional\
    \ paradigm. It is quite easy to understand that multiple paradigm languages will\
    \ in most cases over-rule single paradigm languages.\n\n### Paradigm Used in JavaScript\n\
    \nWe already know that JavaScript implements multiple paradigms, such as functional,\
    \ object-oriented and imperative. We are going to look into the object-oriented\
    \ nature of JavaScript. Before completely diving into its implementation in the\
    \ language, let’s understand what it is and what its advantages are.\n\n### Object-Oriented\
    \ Programming\n\nObject-oriented programming is a programming language model which\
    \ is focused on objects, rather than on performing actions, and data rather than\
    \ on logic involved. In such a style of programming, the programmer only cares\
    \ about implementing objects. Here, objects can be anything from human beings\
    \ to dinosaurs, bricks to buildings, and anything else you can think of. Each\
    \ object has a set of data associated with it, and different methods which can\
    \ be used to manipulate it. As an example, let’s take a car as an object. A car\
    \ has its color, size, the number of seats, and much more as its data, while moving,\
    \ stopping and starting can be considered as the methods associated with a car.\n\
    \nThe big problem arises when implementing it in a program. We start off by identifying\
    \ all the objects that we are going to use, as well as the relations they share\
    \ among each other; this is known as data modeling. The second step involves generalizing\
    \ the object as a class of objects, which defines the data associated with it\
    \ and the different methods/abilities of the object.\n\nThe concepts of object-oriented\
    \ programming provide us with these benefits:\n\n- For every class, we can define\
    \ subclasses which can inherit properties and functionalities from its main class.\
    \ This is called inheritance. The real world follows an inheritance tree where\
    \ the child element inherits some, or all, of the parent’s properties added with\
    \ some of its own unique properties which might not be available with its sibling\
    \ elements. This helps in reducing development time, as well as increasing the\
    \ efficiency of the programmer.\n- While defining classes, we are only concerned\
    \ with the class’s data. Hence, when an instance of the class i.e., an object\
    \ is run, it won’t be able to modify any data which is not part of it. This process\
    \ is known as data-hiding, which provides system security, and also helps in avoiding\
    \ unintended data-corruption.\n- A class can be used again and again. It is reusable\
    \ not only by its own program, but also by other programs.\n- Found an error in\
    \ your program? No problem! You need only to check your code for the class which\
    \ throws the error. This helps to make testing easier, debugging and maintaining\
    \ of the whole program.\n\n### OOPS in JavaScript\n\nIn the earlier section, we\
    \ briefly learned about different concepts of object-oriented languages. While\
    \ we focus directly on its implementation in our language of interest i.e., JavaScript,\
    \ which is dynamic in nature, we are only concerned with Inheritance and Encapsulation.\
    \ Why don’t we care about Polymorphism then? JavaScript, being a dynamically typed\
    \ programming language, makes observing the effects of polymorphism much more\
    \ difficult because it is more evident in statically-typed languages like C or\
    \ C++. There no point of discussing method or function overloading in JavaScript,\
    \ because we do not have any data-type being specified while we code. Therefore,\
    \ the machine can’t differentiate between two definitions of the same function.\
    \ In JavaScript, a lot of concepts are implemented with the help of functions.\
    \ Object-oriented coding is no exception to it. An instance is an implementation\
    \ of the function.\n\n```javascript\nfunction child(name){\n    // code here\n\
    } // child is a constructor because we will use the keyword “new” to invoke it.\n\
    ```\n\nNow, this may seem to be similar to languages like Java, where we use the\
    \ new keyword to create instances.\n\n```javascript\nvar aditya = new child(\"\
    aditya\"); // Aditya is an instance of child\n```\n"
