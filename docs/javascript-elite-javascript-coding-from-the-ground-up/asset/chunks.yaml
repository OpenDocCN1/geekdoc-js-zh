  trans: "\n相反，`var arr = Array(10);` 将创建一个名为 `arr` 的数组，它没有元素，但长度被设置为 10。\n\n### 填充数组\n\
    \n填充数组简单意味着在不同的索引处为数组赋值。默认情况下，单个值被填充在数组的第 0 个索引处，如下：\n\n```javascript\narr[0]\
    \ = ‘0th value’;\n```\n\n我们也可以创建数组时对其进行填充，如下：\n\n```javascript\nvar fruitsArray\
    \ = [apple, mango, banana, orange];\n```\n\n然后通过索引访问每个元素，例如：\n\n`console.log(fruitsArray[0]);`\
    \ 将带我们得到结果 ‘Apple’。\n\n但通常，我们不会手动遍历每个索引。相反，我们可以使用循环来实现，循环会自动遍历每个索引，并据此访问数组的每个值。\n\
    \n例如（例：`var fruitsArray = [apple, mango, banana, orange];`\n\n```javascript\n\
    for(i = 0; i < fruitsArray.length; i++)\n{\n  console.log(fruitsArray[i]);\n}\n\
    ```\n\n上述代码将输出：\n\napple\nmango\nbanana\norange\n\n在这里，`.length` 是一个预定义的数组方法，用于确定数组的长度。它对于遍历数组非常有益。也可以通过\
    \ `forEach` 循环代替 `For` 循环获得上述输出，如下：\n\n例如（例：`fruitsArray.forEach(function(fruit){\
    \  console.log(fruit);  });`）\n\n### 有用的方法\n\n我们已经讨论了预定义的 `Array` 方法之一，即 `.length`\
    \ 方法。还有许多其他方法。这些方法在 `Array` 对象上的定义如下：\n\n- `push()`：此方法用于向数组中添加元素。所有元素都会被添加到数组的末尾。\n\
    例如（例：`var fruitsArray = [apple, mango, banana, orange];`\n```javascript\nfruitsArray.push(‘litchi’);\n\
    ```\n现在，结果 `fruitsArray` 将是 `[apple, mango, banana, orange, litchi]`\n\n- `pop()`：此方法用于从数组中删除最后一个元素，并返回被删除的元素。\n\
    例如（例：`var fruitsArray = [apple, mango, banana, orange];`\n```javascript\nvar removedFruit\
    \ = fruitsArray.pop();\n```\n现在，结果 `fruitsArray` 将是 `[apple, mango, banana]`，且\
    \ `removedFruit` = `orange`。\n\n- `concat()`：此方法用于将一个数组与另一个数组合并成新数组。\n例如（例：`var\
    \ fruitsArray = [apple, mango, banana, orange];`\n`var carsArray = [honda, suzuki,\
    \ toyota];`\n```javascript\nvar fruitsAndCars = fruitsArray.concat(carsArray);\n\
    ```\n现在，结果 `fruitsAndCars` 将是 `[apple, mango, banana, orange, honda, suzuki, toyota];`\n\
    \n- `sort()`：此方法用于升序排序数组。\n例如（例：`var fruitsArray = [apple, mango, banana, orange];`\n\
    ```javascript\nfruitsArray.sort();\n```\n现在，结果 `fruitsArray` 将是 `[apple, banana,\
    \ mango, orange]`\n\n- `reverse()`：此方法用于反转数组元素的顺序，即第一个元素变成最后一个元素，最后一个元素变成第一个元素。\n\
    例如（例：`var fruitsArray = [apple, mango, banana, orange];`\n```javascript\nfruitsArray.reverse();\n\
    ```\n现在，结果 `fruitsArray` 将是 `[orange, banana, mango, apple]`\n\n- `indexOf(reqdElement,\
    \ [fromIndex])`：此方法用于搜索数组中特定元素的索引。\n例如（例：`var fruitsArray = [apple, mango, banana,\
    \ orange];`\n`fruitsArray.indexOf(‘mango’);` 将得到结果 1。\n\n如果数组中有多个同名的元素，我们还可以作为可选参数指定我们想要从哪个索引开始查找所需的元素。\n\
    例如（例：`var fruitsArray = [apple, mango, banana, orange, mango];`\n`fruitsArray.indexOf(‘mango’,\
    \ 2);` 将得到结果 4。\n\n### 多维数组\n\n多维数组可以通过将一个数组嵌套在另一个数组中的方式创建，并为一个维度的每个元素填充另一个维度的每个元素。多维数组可以如下所示创建并填充：\n\
    \n例如（例）：\n```javascript\nvar arr = new Array(5);\nfor (i = 0; i < 5; i++) {\n\
    \  arr[i] = new Array(5);\n  for (j = 0; j < 5; j++) {\n    a[i][j] = i + j;\n\
    \  }\n}\n```\n\n上述代码在 `console` 打印时将给出以下输出：\n\n00 01 02 03 04\n10 11 12 13 14\n\
    20 21 22 23 24\n30 31 32 33 34\n40 41 42 43 44\n\n这完成了对 JavaScript 中集合概念的解释。请明智地运用知识！在编写代码之前，始终思考你的代码。到达特定路径终点有很多。结构结构一切。\n\
    \n# 第 10 章：在 JavaScript 中使用 Canvas\n\nHTML 中的 `canvas` 元素负责显示许多图形元素，如绘制、动画、交互等。\n\
    \n一个简单的 canvas 元素如下：\n\n```html\n<canvas id=\"idCanvas\" width=\"300\" height=\"\
    300\"></canvas>\n```\n\n起初，它看起来像 <img> 元素，缺少 `src` 和 `alt` 属性。`canvas` 元素的默认高度和宽度分别为\
    \ 300px 和 150px。\n\n### JavaScript 在 canvas 中的作用\n\n我们在刚才的 HTML 部分已经预览了 JavaScript\
    \ 与 canvas 的基本用法，即使用 DOM 属性选择 canvas。\n\n```javascript\nvar canvas = document.getElementById(\"\
    idCanvas\");\n```\n\n现在我们将讨论 JavaScript 在 canvas 实际用法。最初，canvas 是完全空白的。要在 canvas\
    \ 上绘制内容，需要 JavaScript 通过 `getContext()` 方法访问渲染上下文。\n\n该方法有一个参数，用于定义上下文类型。\n\n\
    例如（例：`getContext(\"2d\")`\n\n要在 JavaScript 中引入此方法，我们首先需要选择 canvas 并存储在变量中，就像之前那样。其次，我们需要使用同一个变量连接\
    \ `getContext` 方法。最后，我们将其存储在另一个变量中（通常命名为 `ctx`），我们将在项目的剩余部分用它操作 canvas 元素。\n\n\
    ```javascript\nvar canvas = document.getElementById(\"idCanvas\");\nvar ctx =\
    \ canvas.getContext(\"2d\");\n```\n\n注意，`getContext` 方法是由我们创建的存储 canvas 的变量（`canvas`）连接的。现在上下文已经创建，我们就可以通过变量\
    \ `ctx` 轻松地为画布 设置不同的值。\n\n例如：\n1. `ctx.fillStyle=\"blue\";`\n2. `ctx.fillRect(8,\
    \ 8, 40, 40);`\n\n上述代码将在第 2 行指定的坐标处绘制矩形，并如第 1 行所示提供蓝色。\n\n"
- fmt: "\n# Drawing rectangles\n\nThere are three methods that draw rectangles:\n\n\
    - `fillRect(A, B, width, height)`: It draws a filled rectangle.\n- `strokeRect(A,\
    \ B, width, height)`: It draws a rectangular outline.\n- `clearRect(A, B, width,\
    \ height)`: Clears the specified rectangular area, draws a fully transparent rectangle.\n\
    \nThe above three methods take some parameters in the format of:\n\n- `A`, `B`\
    \ – specifies the relative position of the rectangle in the canvas grid.\n- `width`\
    \ – specifies the width of the rectangle.\n- `height` – specifies the height of\
    \ the rectangle.\n\n### Example:\n\n```html\n<!DOCTYPE HTML>\n<HTML>\n<head>\n\
    <title>drawing rectangle</title>\n</head>\n<body>\n<canvas id=\"idCanvas\" width=\"\
    200\" height=\"100\">\nthis browser does not support the canvas element.\n</canvas>\n\
    <script>\nvar canvas = document.getElementById(\"idCanvas\");\nvar ctx = canvas.getContext(\"\
    2d\");\nctx.fillStyle = \"blue\";\nctx.fillRect(0,0,150,75);\n</script>\n</body>\n\
    </HTML>\n```\n\n# Drawing the paths\n\nA path is basically a list of points or\
    \ dots connected by a segment of lines. The shapes can be different or the same,\
    \ different heights, widths, colors, etc. It can even be closed or open.\n\n###\
    \ Note about rectangles and paths:\n\nThe rectangle and path are the only primitive\
    \ shapes in the canvas. To draw any other shape of your choice and mind, you must\
    \ draw it by connecting several paths.\n\n### How to draw any shape using paths:\n\
    \nThe following methods are required to create, connect, and manipulate paths\
    \ to form shapes.\n\n1. `beginPath()` method: used to create a new path.\n2. `path`\
    \ functions:\n- `CanvasRenderingContext2D.moveTo()`: Moves the starting index\
    \ of a newly created path to the `(A, B)` coordinates.\n- `CanvasRenderingContext2D.bezierCurveTo()`:\
    \ Adds a curve to the path (also known as `cubic Bézier curve`).\n- `CanvasRenderingContext2D.lineTo()`:\
    \ connects the subpath to the `A, B` coordinates and the last point with a straight\
    \ line.\n- `CanvasRenderingContext2D.arc()`: Adds an arc to the path centered\
    \ at `(A, B)` position with `radius`. starts at `startAngle` and ends at `endAngle`\
    \ going in the direction.\n- `CanvasRenderingContext2D.ellipse()`: An ellipse\
    \ is added to the path centered at `(A, B)` position having `radiusX` and `radiusY`\
    \ as radii, start at `startAngle` and ends at `endAngle` going in the direction.\n\
    - `CanvasRenderingContext2D.fill()`: subpaths filled with the current style.\n\
    - `CanvasRenderingContext2D.rect()`: A path for a rectangle at `(A, B)` is created\
    \ with size determined by `width` and `height`.\n- `CanvasRenderingContext2D.quadraticCurveTo()`:\
    \ A quadratic Bézier curve is added to the path.\n- `CanvasRenderingContext2D.arcTo()`:\
    \ An arc to the path is added, including the control points connected by a straight\
    \ line.\n3. `closePath()`: Closes the path.\n4. `fill()`: By `fill()` method we\
    \ can draw a solid shape filled with the content area.\n5. `stroke()`: By `stroke()`\
    \ method we can draw border around the shape.\n\nFollowing these steps will help\
    \ you to draw any shape you imagine using paths:\n1. Create a new path.\n2. Draw\
    \ into the path with drawing commands listed above.\n3. Close the path, once it\
    \ has drawn.\n4. Once the creation of path is complete, you can easily manipulate\
    \ it by either stroking or filling it.\n5. The path is now ready to render.\n\n\
    # Drawing a triangle with paths\n\nThis section shows how to draw a triangle with\
    \ paths. Take a look at the code below.\n\nHTML code:\n```html\n<!DOCTYPE HTML>\n\
    <HTML>\n<body onload=\"drawTriangle();\">\n<canvas id=\"idCanvas\" width=\"100\"\
    \ height=\"100\"></canvas>\n</body>\n<script type=\"text/JavaScript\" src=\"new.js\"\
    ></script>\n</HTML>\n```\n\nJavaScript code:\n```javascript\nfunction drawTriangle()\
    \ {\n  var canvas = document.getElementById('idCanvas');\n  if (canvas.getContext)\
    \ {\n    var ctx = canvas.getContext('2d');\n    ctx.beginPath();\n    ctx.moveTo(50,\
    \ 75);\n    ctx.lineTo(95, 72);\n    ctx.lineTo(101, 26);\n    ctx.fill();\n \
    \ }\n}\n```\n\n# Applying styles and colors to context\n\nNext, we will take a\
    \ look at how to add colors and style the shapes or contexts, to our wishes.\n\
    \n### The two important attributes\n\nIn order to add colors and style our shapes\
    \ in the canvas, we must consider two important attributes:\n1. `fillStyle = \"\
    color\"`\n2. `strokeStyle = \"color\"`\n\nThe `fillStyle` attribute sets the style\
    \ while filling shapes and contexts. The `strokeStyle` attribute sets the style\
    \ of the shape's border. Notice the `\"color\"` written after the equals sign\
    \ inside the quotes. It represents the color of your choice. This space must be\
    \ filled by a string. The color represents the CSS color. Color can accept values\
    \ of the following type:\n- Predefined colors name such as `\"red\"`, `\"blue\"\
    `, `\"green\"` etc.\n- Can accept Hex codes of colors, for example- `\"#232323\"\
    `, `\"#ffffff\"` etc\n- Can accept the rgb codes for example-\"`rgb(255, 60, 16)\"\
    `\n\nExample of valid values of `fillStyle` and `strokeStyle` attributes:\n```javascript\n\
    ctx.fillStyle=\"green\";\nctx.fillStyle=\"#232323\";\nctx.fillStyle=\"rgb(233,\
    \ 30, 25)\";\n```\n\nExample of `fillStyle` attribute:\n```html\n<!DOCTYPE HTML>\n\
    <HTML>\n<body onload=\"usingFillStyle();\">\n<canvas id=\"idCanvas\" width=\"\
    100\" height=\"100\"></canvas>\n</body>\n<script type=\"text/JavaScript\" src=\"\
    new.js\"></script>\n</HTML>\n```\n\nJavaScript code:\n```javascript\nfunction\
    \ usingFillStyle() {\n  var ctx = document.getElementById('idCanvas').getContext('2d');\n\
    \  for (var i = 1; i <= 6; i++) {\n    for (var j = 1; j <= 6; j++) {\n      ctx.fillStyle\
    \ = 'rgb(' + Math.floor(245 - 42.5 * i) + ', ' +\n                      Math.floor(245\
    \ - 42.5 * j) + ', 0)';\n      ctx.fillRect(j * 35, i * 25, 25, 25);\n    }\n\
    \  }\n}\n```\n\nExample of `strokeStyle` attribute:\n```html\n<!DOCTYPE HTML>\n\
    <HTML>\n<body onload=\"usingStrokeStyle();\">\n<canvas id=\"idCanvas\" width=\"\
    100\" height=\"100\"></canvas>\n</body>\n</HTML>\n```\n\nJavaScript code:\n```javascript\n\
    function usingStrokeStyle() {\n  var ctx = document.getElementById('idCanvas').getContext('2d');\n\
    \  for (var i = 1; i <= 6; i++) {\n    for (var j = 1; j <= 6; j++) {\n      ctx.strokeStyle\
    \ = 'rgb(' + Math.floor(245 - 42.5 * i) + ', ' +\n                      Math.floor(245\
    \ - 42.5 * j) + ')';\n      ctx.beginPath();\n      ctx.arc(12.4 + j * 25, 12.4\
    \ + i * 25, 10, 0, Math.PI * 2, true);\n      ctx.stroke();\n    }\n  }\n}\n```\n\
    This concludes our examination of the concept of canvas in JavaScript. I hope\
    \ you found it useful!\n\n# Chapter 11: Animations in JavaScript\n\nWhen animating\
    \ objects with JavaScript, the first two options available to us are:\n1. Using\
    \ pure JavaScript with DOM properties.\n2. Using Canvas.\n\n## Animations with\
    \ DOM properties\n\nAnimations with DOM properties are our easiest tool. We don't\
    \ have to worry about the frames and grid management, which we would need to if\
    \ we were using canvas. Animation with DOM properties is done by manipulating\
    \ the objects under certain interval or timer.\n\n### Simple animation using JavaScript\n\
    \nIn the following example, we will move a ball from one position to another with\
    \ the help of DOM properties.\n\nHTML code:\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<p>\n<button onclick=\"movingBall()\">Click to move ball</button>\n</p>\n\
    <div id=\"content\">\n<div id=\"object\"></div>\n</div>\n</body>\n</html>\n```\n\
    \nCSS code:\n```css\nbody{\n  background-color: #fff;\n}\n#content {\n  width:\
    \ 400px;\n  height: 400px;\n  position: relative;\n  background: #232323;\n}\n\
    #object {\n  width: 50px;\n  height: 50px;\n  border-radius: 50%;\n  position:\
    \ absolute;\n  background-color: yellow;\n}\n```\n\nJavaScript code:\n```javascript\n\
    function movingBall() {\n  var elementA = document.getElementById(\"object\");\n\
    \  var positionA = 0;\n  var id = setInterval(frame, 5);\n  function frame() {\n\
    \    if (positionA == 350) {\n      clearInterval(id);\n    } else {\n      positionA++;\n\
    \      elementA.style.top = positionA + 'px';\n      elementA.style.left = positionA\
    \ + 'px';\n    }\n  }\n}\n```\n"
