    \ for iterating over arrays. We will also cover various array methods like `push`,\
    \ `pop`, `sort`, `concat`, `indexOf`, etc. Moreover, we will be discussing multi-dimensional\
    \ arrays along with single-dimensional arrays.\n\nAn array is a data-structure\
    \ containing ordered set of values which can be referred to with its name or index.\
    \ In JavaScript, we do not need to define specific data-type for each array during\
    \ its declaration like in C, C++ or Java. Instead, we can use predefined `Array`\
    \ object and its various methods. An array can be created in any of the following\
    \ ways:\n\n```javascript\nvar fruitsArray = new Array(apple, mango, banana, orange);\n\
    var fruitsArray = Array(apple, mango, banana, orange);\nvar fruitsArray = [apple,\
    \ mango, banana, orange];\n```\n\nIn general, the third way of implementing Array\
    \ is most commonly used (the one in square-bracket notation), and is known as\
    \ ‘Array Literal’ or ‘Array Initializer’.\n\nRemember that passing a single number\
    \ value while declaring the array in the square-bracket notation `[ ]` denotes\
    \ the value of that array, whereas passing a single number value to the `Array`\
    \ function `()` notation denotes the length of that array and allocates the number\
    \ of empty locations for that array accordingly.\n\n```javascript\nvar arr = [10];\
    \ // will create an array named arr with value 10\n```\n"
  raw: 'Before diving into the details of apply(), call(), and bind() methods, we
    need to know about the keyword “this” in JavaScript.


    In terms of global context


    The keyword “this” refers to the global object outside of any method. In the following
    example, we will see the scope of this keyword in the global context. We will
    just console.log the “this” keyword in the browser.


    console.log(this);


    The result in the console is “window”, which is nothing but the global object.
    This result implies that:


    console.log(this === window); // is true


    In the example above, we entered console.log(this) which gave us window object.


    In this example, we will use strict mode and check the value of the “this” keyword.


    function abc(){


    ''use strict''; // the strict mode


    return this;


    }


    console.log(abc()); // undefined


    This time, the value of the ‘this” keyword is undefined because it was not defined
    inside the function abc().


    In terms of function context


    Addressing the “this” keyword in terms of function context, we have the three
    methods call(), apply(), and bind().


    Let’s talk about these methods in detail.


    The apply method


    The apply() method invokes a function with the value of “this” keyword, and parameters
    provided as an array (or an array-like object).


    Syntax:


    The method apply() has the following syntax:


    functionName.apply(thisArgument, argsArray[])


    Parameters


    Let''s have a look at the arguments provided to the apply() method.


    ● thisArgument: The value of keyword "this" provided for the invoke the functionName.


    Note: The value of the keyword "this" may not be the original value seen by the
    function when working in non-strict mode. The primitive values and the global
    object will be replaced by “undefined” and “null”.


    ● argsArray[]:  An argument of an array-like object that specifies the arguments
    with which functionName should be called, or undefined or null if no arguments
    should be provided to the method.


    Example:


    In the following example, we will take a look at the basic functionality of the
    apply() method.


    var student1 = {firstName: ''Abhishek'', lastName: ''Kumar''};


    var student2 = {firstName: ''Ashok'', lastName: ''Mehta''};


    function text(hello) {


        console.log(hello + '' '' + this.firstName + '' '' + this.lastName + '' ?'' 
    );


    }


    text.apply(student1, [''How are you'']); // How are you Abhishek Kumar ?


    text.apply(student2, [''How are you'']); // How are you Ashok Mehta ?


    The call method


    The call() method invokes a particular function with the help of the "this" keyword
    and an individual argument.


    Syntax:


    The method call() has the following syntax:


    functionName.call (thisArgument, argument1, argument2, ....)


    Parameters


    Let''s have a look at the arguments provided to the apply() method.


    ● thisArgument:  The value of keyword "this" provided for the invoke the functionName.


    Note: As with the apply() method, the value of keyword "this" may not be the original
    value seen by the function when working in non-strict mode. The primitive values
    and the global object will again be replaced by undefined and null.


    ● Argument1, 2 … :Arguments for the different functions


    Example:


    var student1 = {firstName: ''Abhishek'', lastName: ''Kumar''};


    var student2 = {firstName: ''Ashok'', lastName: ''Mehta''};


    function text(hello) {


        console.log(hello + '' '' + this.firstName + '' '' + this.lastName + '' ?''
    );


    }


    text.call(student1, [''How are you'']); // How are you Abhishek Kumar ?


    text.call(student2, [''How are you'']); // How are you Ashok Mehta ?


    The bind method


    The method bind() calls a newly created function (created by the method itself),
    which has the value of the keyword "this" set to the specified value, with a given
    pattern of parameters.


    Syntax:


    The method call() has the following syntax:


    function.bind (thisArgument[, argument1[, argument2[, ...]]])


    Parameters


    Let''s have a look at the arguments provided to the apply() method.


    ● thisArgument: The value to be passed as the keyword this argument to the specified
    function when the bound function is invoked.


    If the bound function is created using the new operator, the value will be ignored.


    ● argument1,[, argument2[, ...]]]: Arguments attached to arguments provided to
    the bound function when calls the specified function.


    Example:


    var student1 = {firstName: ''Abhishek'', lastName: ''Kumar''};


    var student2 = {firstName: ''Ashok'', lastName: ''Mehta''};


    function text() {


        console.log(''hello'' + '' '' + this.firstName + '' '' + this.lastName + ''
    ?'');


    }


    var textHelloAbhishek = text.bind(student1);


    var textHelloAshok = text.bind(student2);


    textHelloAbhishek(); // How are you Abhishek Kumar ?


    textHelloAshok(); // How are you Ashok Mehta ?


    Difference between apply, call and bind


    The apply() method calls the function and allows you to pass in parameters as
    an array or an array-like object.


    The call() method calls the function and allows you to pass in parameters one
    by one.


    The bind() method returns a newly created function and allows you to pass in any
    number of arguments.


    Now that we know what the call(), apply(), and bind() methods in JavaScript are,
    the question still remains “when do I use which methods”?


    In this section, we will clear this confusion by comparing all of them based on
    a few parameters.


    The method call(), and apply() are somewhat interchangeable, depending on how
    you as the programmer decide to utilize them. You have a choice to determine whether
    it is easier to send a list of arguments separated by commas, or an array of arguments.


    The bind() method is a bit different from the other two.


    Where the apply() and call() methods execute the current function on the spot,
    the bind() method returns a newly created function.


    A bind() method can be used for events such as onClick, where the firing of such
    events is uncertain.


    We as programmers can''t predict when those events will be fired, but we can serve
    the context to them.


    Chapter 9: Collections in JavaScript


    In JavaScript, a collection refers to the grouping of data. More specifically,
    it refers to incorporating the data in such a structure that we can access every
    value by its index, or by the key if it is in a key/value pair. Collections in
    JavaScript can be in many forms, like objects, arrays, functions, maps, and sets.


    In this chapter, we will be focusing on data structures like objects and arrays
    to explore the concept. We will be learning about how to create an object/array,
    how to populate those arrays, and methods for iterating over arrays. We will also
    cover various other array methods like push, pop, sort, concat, indexOf, etc.
    Moreover, we will be discussing multi-dimensional arrays along with the single-dimensional
    arrays.


    An array is a data-structure containing ordered set of values which can be referred
    to with its name or index. In JavaScript, we do not need to define specific data-type
    for each array during its declaration like in C, C++ or Java. Instead, we can
    use a predefined Array object and its various methods. An array can be created
    in any of the following ways:


    For Ex: var fruitsArray = new Array(apple, mango, banana, orange);


    OR var fruitsArray = Array(apple, mango, banana, orange);


    OR var fruitsArray = [apple, mango, banana, orange];


    In general, the third way of implementing Array is most commonly used (the one
    in square-bracket notation), and is known as ‘Array Literal’ or ‘Array Initializer’.


    When we are not sure about the items to be populated in the array and want to
    push them into the array afterwards (but want to declare a non-zero length array
    right now), we can perform that action with:


    var arr = [];


    Remember that passing a single number value while declaring the array in the square-bracket
    notation [ ] denotes the value of that array, whereas passing a single number
    value to the Array function “()” notation denotes the length of that array and
    allocates the number of empty locations for that array accordingly.


    For Ex: var arr = [10]; will create an array named arr with value 10'
