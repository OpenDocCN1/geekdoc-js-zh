  trans: "\n\n```\nalert(typeof(aditya)); //displays \"object\"\n```\n\n在前面的示例中，`aditya`\
    \ 是一个从子构造函数创建的实例。在这里，`child` 既是一个函数又一个对象，因为在 JavaScript 中函数确实也是对象。这个实例可以从子对象拥有它自己的数据/属性和功能，我们将在接下来的章节中讨论。\n\
    \n在 JavaScript 中有多种创建对象的方法。最基础且易于理解的方法是使用通用的对象字面量模式。例如：\n\n```javascript\nvar\
    \ student = {\n    name: “ritesh”,\n    age: “19”,\n    branch: “cse”\n};\n```\n\
    \n在这里，我们创建了一个名为 `student` 的对象，`name`、`age` 和 `branch` 是它的属性。\n\n第二种方法是使用构造函数模式。例如：\n\
    \n```javascript\nfunction student (name, age, branch) {\nthis.name = name;\nthis.age\
    \ = age;\nthis.branch = branch;\n} // student () 是构造函数，因为我们在下面使用了 new 关键字来调用它。\n\
    \nvar rahul = new student(“rahul”, 19 , “cse”) // Rahul 是我们从 student () 构造函数创建的一个新对象。\n\
    \nconsole.log(rahul.name); // Rahul\nconsole.log(student.branch); // cse\n```\n\
    \n在上述详细的方法中，我们观察到两者之间主要区别。在字面量模式中，我们在声明对象的同时已经创建了它。在构造函数模式中，我们需要显式地带有 `new` 关键字调用构造函数来创建一个\
    \ `student` 实例。\n\n第三种也是最后一种方法是使用原型模式，正如方法名所示，我们直接将每个属性和方法添加到对象的原型上。例如：\n\n```javascript\n\
    function student ()\n{\nstudent.prototype.firstName = \"Ritesh\";\nstudent.prototype.lastName\
    \ = \"Kumar\";\nstudent.prototype.age =19;\nstudent.prototype.branch = “cse”;\n\
    student.prototype.fullName = function () {\nconsole.log (this.firstName + \" \"\
    \ + this.lastName);\n};\n\nvar ritest = new student () // 使用 new 关键字创建 student\
    \ 的实例\n\nconsole.log(ritesh.fullName()); // 这将在浏览器控制台中输出值“Ritesh Kumar”\n```\n\
    \n你可能对上面示例中使用的 `prototype` 关键字感到困惑。这是该方法最重要的部分。我们将 `prototype` 定义为一个内部对象，其他对象通过它来继承属性。这允许同一个对象的多个实例共享公共属性。因此，使用原型对象定义的属性会被它的所有实例继承。\n\
    \n现在，在可供你使用的三种创建对象的方法中，需要讨论“哪一种最合适？”以及“在什么情况下使用？”我们将在下一个章节（重点关注封装）中尝试找到这个问题的答案。\n\
    \n## 为什么我们需要封装？\n\n当你只需要某个对象的一个副本且该对象仅存储数据时，字面量方法非常方便。然而，当你想要拥有同一个对象的多个实例，并让它们拥有不同的数据时，这种方法是无效的。\n\
    \n当我们创建许多具有相同属性的对象时？可以将所有对象共享的共同属性封装在一个函数中，然后使用构造函数创建多个对象。这就是我们利用封装的地方。\n\nJavaScript\
    \ 中的实际实现使用了构造函数和原型方法的结合。例如：\n\n```javascript\nfunction student (name, age, branch)\
    \ {\n    this.name = name;\n    this.age = age;\n    this.branch= branch;\n  \
    \  this.marks = [];\n}\n```\n\n借助上面的代码，我们使用构造函数方法创建了 `student` 对象的构造函数。它只包含了与\
    \ `student` 关联的数据。在接下来的代码段中，我们将使用原型方法添加与 `student` 关联的功能。\n\n```javascript\nstudent.prototype\
    \ = {\n    showName:function () {\n        return this.name;\n    },\n    addMarks:function\
    \ (mark) {\n        this.marks.push(mark);\n    }\n}\n```\n\n在这里我们完成了定义对象的代码编写。下一个任务是创建我们刚刚创建的对象实例。\n\
    \n```javascript\n// 对象的第一个实例\nrishabh = new student(\"rishabh\", 20, “cse”);\n\
    rishabh.addMarks(98); // 向 marks 数组中添加 98\nrishabh.showName();  //返回“rishabh”\n\
    \n// 另一个实例\nmitul = new student(\"Mitul\", 19, “mechanical”);\nmitul.addMarks(100);\
    \ // 向 marks 数组中添加 100\nmitul.showName (); // 返回“mitul”\n```\n\n通过上面的示例，掌握封装的重要性和益处可能非常清晰了。我们将\
    \ `student` 的所有数据和功能封装到一个函数中，稍后创建了它的实例（`rishabh` 和 `mitul`），它们共享与学生相同的属性。这减少了重复为相似对象实例定义每个属性的所有工作。\n\
    \n封装就到此为止！下一节将侧重于通过继承来扩展对象的实现，以便不同的对象可以共享或从父元素继承属性。\n\n## JavaScript 中的继承\n\n\
    这一特性使我们更接近现实世界。让我们以人类为例。人类从 `Hominid` 类中继承了一些属性，而该类本身又从其父类继承了一些属性。人类从 `Hominid`\
    \ 类中继承了一些属性，而该类本身又从其父类继承了一些属性。人类从 `Hominid` 类中继承了一些属性。继承在代码中以解决类似问题时变得非常有用。由于人类像其他哺乳动物一样繁殖，这种方法完全可行。此外，人类类可以添加其他属性，这可能对其他人类有用。\n\
    \n目前为止，我们只讨论了继承的现实实现。让我们深入代码并完善它。\n\n让我们创建一个 car 对象。\n\n```javascript\nvar car\
    \ = {\n    Color: “black”,\n    Seats: “4”\n};\n\n// 继承 car 对象\nvar myCar = Object.create\
    \ (cars); // 现在 myCar 继承了 car 的属性\nconsole.log(myCar.color); // black\n```\n\n\
    还可以向创建的实例添加更多属性。现在是继承的核心。我们使用 `inheritPrototype` 函数继承父类。\n\n```javascript\nfunction\
    \ inheritPrototype(child, parent) {\n    var parentCopy = Object.create(parent.prototype);\n\
    \    parentCopy.constructor = child;\n    child.prototype = parentCopy;\n}\n```\n\
    \n让我们理解这段代码是如何工作的。最初，我们创建一个父类的实例（`parentCopy`）。我们将子实例存储到 `parentCopy` 的构造函数中。这样做是因为下一步我们将\
    \ `parentCopy` 存储到子类的原型中。当我们这样做时，我们会覆盖子类原型之前的内容，从而丢失实际值。为了防止这种情况发生，我们创建了子构造函数的副本。当我们把\
    \ `parentCopy` 存储到子构造函数时，它不会丢失旧值。\n\n创建一个新对象，它稍后将继承我们的父对象即 `car`。\n\n```javascript\n\
    var audi = {\n    name = “audi”\n};\n\ninheritPrototype(audi, car);\n```\n\n`Audi`\
    \ 将拥有与汽车相同的属性，但它需要定义自己的独特属性，即 `name`。\n\n## 第二章：JavaScript 中的 ‘this’ 关键字\n\n在\
    \ JavaScript 中，`this` 关键字的行为与与其他编程语言相比不同。`this` 的值取决于对象是如何实例化的，或者说“关键字实际在哪里被使用”。简单来说，`this`\
    \ 关键字返回当前的作用域对象。\n\n如果你在全局作用域中使用它，它将引用 `window` 对象。`window` 对象是 JS 中唯一的全局可用对象。\n\
    \n"
- fmt: "\nTherefore, the result of `console.log(this)` on global scope will be returning\
    \ the `window` object.\n\nTo get a better understanding of `this`, let’s define\
    \ an object as follows:\n\n```javascript\nvar obj = {\n  someProperty1: “Hi”,\n\
    \  someProperty2: function(name) {\n    // here ‘this’ will scope to the obj object\
    \ as it is the current local scope out\n    // it's scope there exists the window\
    \ object\n    return this.someProperty1 + name;\n  }\n}\n\nvar myObj = obj.someProperty2(“\
    \ John”);\nconsole.log(myObj); // === “Hi John”\n```\n\nIn the code above, in\
    \ `someProperty2` property of `obj` , we used `this` keyword to access another\
    \ property of current object that is `someProperty1`, and hence the function returned\
    \ “Hi John” as a result.\n\nThe results would not have been affected if we used\
    \ arrow functions of JavaScript. The results would have bene the same.\n\nWith\
    \ the help of the `this` operator, we can make constructors of objects in JS as\
    \ follows:\n\n```javascript\nfunction obj(name) {\n  this.name = name;\n  this.someMethod\
    \ = function() {\n    console.log(this.name);\n  }\n}\n\nvar myObj = new obj(“John”);\n\
    myObj.someMethod(); // === John\n```\n\nYou can also use `this` on object prototypal\
    \ chain like:\n\n```javascript\nvar obj = function() {\n  return this.a + this.b;\n\
    };\n\nvar myObj = Object(obj);\nmyObj.a = 5;\nmyObj.b = 6;\nmyObj(); // === 11\n\
    ```\n\nSimilarly as before, we used the `this` keyword to access the current object,\
    \ and to instantiate its data members and functions.\n\nI would like to conclude\
    \ saying that the `this` keyword in JavaScript is something you’ll find need of\
    \ frequently. It will make your work easier and give you much flexibility in your\
    \ coding style.\n\n# Chapter 3: JSON\n\nJSON or JavaScript Object Notation, originally\
    \ specified by Douglas Crockford, is one of the most commonly used data-interchange\
    \ format. JSON is nothing but a simple medium of storing and exchanging the data.\
    \ This exchange happens between the browser and the server.\n\nThe format of data\
    \ can only be text and any JavaScript Object can be converted into JSON format\
    \ for sending data to the server. Likewise, any JSON text can be converted into\
    \ JavaScript Object when receiving data from the server.\n\nJSON is a lightweight\
    \ format which is easy to understand for humans, as well as easy to parse for\
    \ machines. It is language independent, meaning that it is not only restricted\
    \ for use with JavaScript, although, JSON uses JavaScript syntax, Since the format\
    \ is text only, it can be read and used by any programming language. Its filename\
    \ extension is `.json`. JSON is widely preferred over other data-transferring\
    \ notations such as `XML` due to its easy-to-parse characteristics.\n\n## JSON\
    \ Syntax\n\nJSON syntax somewhat resembles JavaScript syntax, with the minor difference\
    \ that keys must be strings written in double quotes “ ” which include the following\
    \ notations:\n\n1. The data to be exchanged should be in the pairs of Name & Value.\
    \ Each Name has a Value corresponding to it, which can be accessed with a JavaScript\
    \ object through its Name.\n   Ex: `“name”: “Mark”`\n\n2. The objects are placed\
    \ inside the Curly braces `{ }`. Each name field is followed by a colon `:` ,\
    \ then its value. Each name-value pair is followed by a comma `,` in case the\
    \ user wants to enter another name-value pair.\n   Ex: `{ “name”: “Mark”, “age”:\
    \ “20” }`\n\n3. The arrays of these objects are contained in square brackets `[\
    \ ]` and each object is itself separated by a comma in an array.\n   Ex: `[ {\
    \ “name”: “Mark”, “age”: “20” }, { “name”: “Anthony”, “age”: “40”}]`\n\n## Data\
    \ Types\n\nJSON can be written with the values having following data types:\n\n\
    1. **Number** - In JSON, numbers used must be integers or floating-point numbers.\n\
    \   Ex: `{ “age”: 20 }`\n\n2. **String**\n   Ex: `{ “firstName”: “Mark” }`\n\n\
    3. **Boolean**\n   Ex: `{ “vegetarian”: true }`\n\n4. **Array**\n   Ex: `{ “children”:\
    \ [“Henry”, “Emma”, “Joe”] }`\n\n5. **Another JSON object**\n   Ex: `{ “details”:\
