    ### Getting Promise to execute when we want it to


    As explained earlier, promise starts executing the task as soon as it is created.
    However, we often want the promise code to be predefined and to execute when we
    want it to. This is performed by wrapping the promise inside a function and returning
    the promise object from that function.


    The above example would convert to this:


    ```javascript

    var friendPromise = function() {


    return new Promise( function(resolve, reject) {


    /* usually an asynchronous task goes here */


    if( isHomeworkCompleted() ) resolve();


    else reject();


    });


    }

    ```


    And now we can consume it like this:


    ```javascript

    friendPromise().then( function() {


    console.log( ''Promise settled'' );


    }).catch( function() {


    console.log( ''Promise settled'' );


    });

    ```


    ### Passing information from the task to then() or catch() method


    We can achieve this by passing the information as the parameter(s) of `resolve()`
    or `reject()` functions. The parameters passed in the `resolve()` or `reject()`
    method gets passed as parameters to the function passed as argument of the `then()`
    and `catch()` methods, respectively.


    Let’s explore this concept with an example:


    ```javascript

    var promiseSum = function() {


    return new Promise( function(resolve, reject) {


    var x = 5 + 5;


    if( someCondition() ) resolve( x + 5 );


    else reject( x * 5 );


    });


    }


    promiseSum().then( function(y) {


    console.log( y ); // prints ‘15’ on the console screen if promise is fulfilled


    }).catch(function(y) {


    console.log( y ); // prints ‘50’ on the console screen if promise is rejected


    });

    ```


    ### Chaining multiple promises


    We can chain the `then()` methods of multiple promises one after another to execute
    asynchronous tasks one after another. This is because `then()` returns a promise
    itself.


    If we return a value from the function in the `then()` method, that value gets
    passed onto the next `then()` method’s argument function in the chain, if any.


    ```javascript

    var examplePromise = function() {


    return new Promise( function(resolve, reject) {


    resolve();


    });


    }


    examplePromise().then( function() {


    return 5 + 7;


    }).then(function( y ) { // chaining


    console.log( y ); // prints ‘12’ on the console screen


    return y + 15;


    }).then(function( y ) { // chaining


    console.log( y ); // prints ‘27’ on the console screen


    });

    ```


    If we return a promise from the function in the `then()` method, the next `then()`
    method in the chain acts as the `then()` method of the promise object returned
    earlier.


    ```javascript

    var examplePromise = function() {


    return new Promise( function(resolve, reject) {


    resolve(7);


    });


    }


    var someOtherPromise = function(x) {


    return new Promise( function(resolve, reject) {


    resolve( x * 10 );


    });


    }


    examplePromise().then( function(x) {


    console.log( x ); // prints ‘7’ on the console screen


    return someOtherPromise(x); // returning a NEW promise


    }).then(function( y ) { // chaining


    console.log( y ); // prints ‘70’ on the console screen


    return y + 15;


    }).then(function( y ) { // chaining


    console.log( y ); // prints ‘85’ on the console screen


    });

    ```


    ### The Promise.all() method


    General Syntax:


    `Promise.all( [ [ Promise1 [, Promise2 [, Promise3 [, Promise4 … ] ] ] ] );`


    This method returns a single promise when all of the promises passed as its argument
    have been settled, or one of them is rejected. The resulting promise’s `then()`
    method function argument’s parameter is an array containing all values passed
    by all the promise’s `resolve` method, and in the order that they were resolved.


    Let’s see an example:


    ```javascript

    var promise1 = new Promise( function(resolve, reject) { resolve(9); });


    var promise2 = new Promise( function(resolve, reject) { resolve(8); });


    var promise3 = new Promise( function(resolve, reject) { resolve(7); });


    var promise4 = new Promise( function(resolve, reject) { resolve(6); });


    var result = Promise.all( [ promise1, promise2, promise3, promise4] );


    result.then( function(x) {


    console.log( x );


    });

    ```


    The output of the above code will be:


    `[9, 8, 7, 6]`


    If a promise in the stack is rejected, the `catch()` method of the promise is
    used. The function passed as the `.catch()` argument contains a single value,
    which is the value from the rejected promise in the stack.


    Now let’s see what happens when we change the above example to make a rejected
    promise:


    ```javascript

    var promise1 = new Promise( function(resolve, reject) { resolve(9); });


    var promise2 = new Promise( function(resolve, reject) { resolve(8); });


    var promise3 = new Promise( function(resolve, reject) {


    reject(7); // REJECTING


    });


    var promise4 = new Promise( function(resolve, reject) { resolve(6); });


    var result = Promise.all( [ promise1, promise2, promise3, promise4] );


    result.then( function(x) {


    console.log( x );


    }).catch(function(y) {


    console.log( y );


    });

    ```


