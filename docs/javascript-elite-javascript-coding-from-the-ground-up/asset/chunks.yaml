    Animations with canvas in JavaScript


    The basic rule to animate or move any previously drawn shape on canvas is to redraw
    it, either logically or hard coded.


    Simple animation steps


    In this section, we will see how we can create a frame and animate the objects
    using predefined methods.


    Steps to create a frame


    1\. Use clearReact() method-


    You need to clear the previously drawn shapes when the canvas gets filled by them.
    The method clearReact() helps in clearing the canvas.


    2\. Save every time before you manipulate.


    When you create a new setting and you want your previously drawn shape to be saved
    on the canvas, you must save your original state every time a new frame is created.


    3\. Add animations


    In this step, the actual rendering of the frame is completed.


    4\. The restoration process.


    Last but not the least, with whatever you have done so far, allow the canvas to
    restore before you create a new frame.


    Animations according to you


    In this section, we will examine some methods to control the animations.


    1\. setInterval(method, delay)


    Starts repeatedly executing the method specified by method every delay milliseconds.


    2\. setTimeout(method, delay)


    Executes the method specified by “method”, with the delay interpreted in milliseconds.


    3\. requestAnimationFrame(function callback)


    Asks the browser to call a specified method to update an animation before the
    next restoration, on your demand of performing the animation.


    * 4\. windowRequestAnimation()


    Animations can be done in a more smooth and effective manner by calling the frame
    of animation when the canvas is ready to paint the frame. The number of function
    callbacks is generally 60 times/second, which might get reduced to a lower rate
    while running in the background.


    Example:


    In the following example, we will use the canvas element with JavaScript for animation.


