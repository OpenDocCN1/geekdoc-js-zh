    # 递归


    当循环出现分支或嵌套过深时，应该使用递归。使用递归可以让搜索动态结构、遍历图等操作变得简单易行。你永远不要为可以通过循环轻松解决的简单问题使用递归，因为循环的运行速度快得多且占用的内存更少。


    ## JavaScript 中的性能


    许多复杂算法都使用递归。这是一种非常强大的技术。JavaScript 编译器会将递归的每个函数调用压入栈。这可能是非常危险的，但在 `ES6` (`ECMAScript
    6`) 中，情况将不再如此。递归将不再进行堆栈，而是导致代码的立即执行，这使得使用递归变得安全得多。


