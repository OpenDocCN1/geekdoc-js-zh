  trans: "\n\n在深入研究 `apply()`、`call()` 和 `bind()` 方法的细节之前，我们需要了解 JavaScript 中的关键字\
    \ `this`。\n\n### 从全局上下文中角度\n\n`this` 关键字指向任何方法之外的全局对象。在接接的示例中，我们将看到 `this` 关键字在全局上下文中的作用范围。我们将在浏览器中使用\
    \ `console.log` 输出 `this` 关键字。\n\n```\nconsole.log(this);\n```\n\n控制台的输出结果为“window”，这本质上就是全局对象。这个结果意味着：\n\
    \n```javascript\nconsole.log(this === window); // is true\n```\n\n在上面的示例中，我们进入了\
    \ `console.log(this)`，得到了 `window` 对象。\n\n在这个示例中，我们将使用严格模式并检查 `this` 关键字的值。\n\n\
    ```javascript\nfunction abc(){\n  'use strict'; // 严格模式\n  return this;\n}\n\n\
    console.log(abc()); // undefined\n```\n\n这一次，`this` 关键字的值为 `undefined`，因为在函数 `abc()`\
    \ 内部没有定义它。\n\n### 从函数上下文中角度\n\n从函数上下文中处理 `this` 关键字，我们有 `call()`、`apply()` 和 `bind()`\
    \ 这三个方法。让我们详细讨论一下这些方法。\n\n#### apply 方法\n\n`apply()` 方法通过 `this` 关键字的值来调用函数，并以数组（或类数组）的形式提供参数。\n\
    \n**语法：**\n\n`apply()` 方法具有以下语法：\n\n```\nfunctionName.apply(thisArgument, argsArray[])\n\
    ```\n\n#### 参数\n\n让我们来看看传递给 `apply()` 方法的参数。\n\n- `thisArgument`：为调用 `functionName`\
    \ 提供的 `this` 关键字的值。\n  注意：在非严格模式下工作时，`this` 关键字的值可能与函数执行时看到的原始值不符。原始类型值和全局对象将被替换为\
    \ `undefined` 和 `null`。\n- `argsArray[]`：类数组对象的参数，用于指定调用 `functionName` 时使用的参数；如果不需要向方法提供任何参数，则传入\
    \ `undefined` 或 `null`。\n\n**示例：**\n\n在接下来的示例中，我们将查看 `apply()` 方法的基本功能。\n\n```javascript\n\
    var student1 = {firstName: 'Abhishek', lastName: 'Kumar'};\nvar student2 = {firstName:\
    \ 'Ashok', lastName: 'Mehta'};\n\nfunction text(hello) {\n    console.log(hello\
    \ + ' ' + this.firstName + ' ' + this.lastName + ' ? ');\n}\n\ntext.apply(student1,\
    \ ['How are you']); // How are you Abhishek Kumar ?\ntext.apply(student2, ['How\
    \ are you']); // How are you Ashok Mehta ?\n```\n\n#### call 方法\n\n`call()` 方法通过\
    \ `this` 关键字和单个参数来调用一个特定的函数。\n\n**语法：**\n\n`call()` 方法具有以下语法：\n\n```\nfunctionName.call\
    \ (thisArgument, argument1, argument2, ....)\n```\n\n#### 参数\n\n让我们来看看传递给 `apply()`\
    \ 方法（注：此处原文误应为 call）的参数。\n\n- `thisArgument`：为调用 `functionName` 提供的 `this` 关键字的值。\n\
    \  注意：与 `apply()` 方法一样，在非严格模式下工作时，`this` 关键字的值可能与函数执行时看到的原始值不符。原始类型值和全局对象再次被替换为\
    \ `undefined` 和 `null`。\n- `Argument`：...\n\n**示例：**\n\n```javascript\nvar student1\
    \ = {firstName: 'Abhishek', lastName: 'Kumar'};\nvar student2 = {firstName: 'Ashok',\
    \ lastName: 'Mehta'};\n\nfunction text(hello) {\n    console.log(hello + ' ' +\
    \ this.firstName + ' ' + this.lastName + ' ? ');\n}\n\ntext.call(student1, 'How\
    \ are you'); // How are you Abhishek Kumar ?\ntext.call(student2, 'How are you');\
    \ // How are you Ashok Mehta ?\n```\n\n#### bind 方法\n\n`bind()` 方法创建一个新函数，允许你显式设置\
    \ `this` 关键字。\n\n**语法：**\n\n```\nfunctionName.bind(thisArgument, argument1, argument2,\
    \ ...)\n```\n\n**参数**\n\n- `thisArgument`：为调用 `functionName` 提供的 `this` 关键字的值。\n\
    - `argument1, argument2, ...`：在调用函数时将传递给函数的参数。\n\n**示例：**\n\n```javascript\nvar\
    \ student1 = {firstName: 'Abhishek', lastName: 'Kumar'};\nvar student2 = {firstName:\
    \ 'Ashok', lastName: 'Mehta'};\n\nfunction text(hello) {\n    console.log(hello\
    \ + ' ' + this.firstName + ' ' + this.lastName + ' ? ');\n}\n\nvar bound1 = text.bind(student1);\n\
    bound1('How are you'); // How are you Abhishek Kumar ?\n\nvar bound2 = text.bind(student2);\n\
    bound2('How are you'); // How are you Ashok Mehta ?\n```\n\n---\n\n### 第 9 章：JavaScript\
    \ 中的集合 (Collections)\n\n在 JavaScript 中，集合（collection）指的是数据的分组。具体来说，它指的是将数据整合到结构中，使得我们可以通过索引访问每个值。集合可以有许多形式，如对象、数组、map、set。\n\
    \n在本章中，我们将专注于对象和数组等数据结构以探索这一概念。我们将学习如何创建对象/数组、如何填充这些数组，以及遍历数组的方法。我们还将涵盖各种数组方法，如\
    \ `push`、`pop`、`sort`、`concat`、`indexOf` 等。此外，我们将讨论多维数组以及一维数组。\n\n数组是一种包含有序值的数据结构，可以通过其名称或索引进行引用。在\
    \ JavaScript 中，我们不需要在声明时为数组定义特定的数据类型，这与 C、C++ 或 Java 不同。相反，我们可以使用预定义的 `Array`\
    \ 对象及其各种方法。可以通过以下任何一种方式创建数组：\n\n```javascript\nvar fruitsArray = new Array(apple,\
    \ mango, banana, orange);\nvar fruitsArray = Array(apple, mango, banana, orange);\n\
    var fruitsArray = [apple, mango, banana, orange];\n```\n\n通常，第三种实现数组的方式是最常用的（方括号表示法），被称为“数组字面量”（Array\
    \ Literal）或“数组初始化器”（Array Initializer）。\n\n请记住，在方括号表示法 `[ ]` 中声明数组时传递单个数值表示该数组的值，而在\
    \ `Array` 函数表示法 `()` 中传递单个数值则表示该数组的长度，并据此分配相应数量的空位置。\n\n```javascript\nvar arr\
    \ = [10]; // 将创建一个名为 arr 值为 10 的数组\n```\n\n"
- fmt: "\nWhereas, `var arr = Array(10);` will create an array named `arr` with no\
    \ elements but its length set to 10.\n\n### Populating an Array\n\nPopulating\
    \ an array simply means assigning values to the array at different indices. A\
    \ single value by default is populated at the 0th index of the array as:\n\n```javascript\n\
    arr[0] = ‘0th value’;\n```\n\nWe can also populate the array at the time we create\
    \ it as:\n\n```javascript\nvar fruitsArray = [apple, mango, banana, orange];\n\
    ```\n\nAnd then access each element from their index as:\n\n`console.log(fruitsArray[0]);`\
    \ will give us ‘Apple’ as a result.\n\nBut generally, we do not iterate over each\
    \ index manually. Rather, we can use loops for that which automatically iterates\
    \ over each index and each value of the array can be accessed accordingly.\n\n\
    For Ex: `var fruitsArray = [apple, mango, banana, orange];`\n\n```javascript\n\
    for(i = 0; i < fruitsArray.length; i++)\n{\n  console.log(fruitsArray[i]);\n}\n\
    ```\n\nThe above code will give the output as:\n\napple\nmango\nbanana\norange\n\
    \nHere, `.length` is a predefined array method used to determine the length of\
    \ the array. It is beneficial for iterating over the arrays. The above output\
    \ can also be obtained by using `forEach` loop instead of `For` loop as follows:\n\
    \nFor Ex: `fruitsArray.forEach(function(fruit){  console.log(fruit);  });`\n\n\
    ### Useful methods\n\nWe have already discussed one of the predefined `Array`\
    \ methods, the `.length` method. There are many other methods too. These methods\
    \ are defined over the `Array` object as follows:\n\n- `push()`: This method is\
    \ used for adding elements in an array. All the elements get added at the end\
    \ of the array.\nFor Ex: `var fruitsArray = [apple, mango, banana, orange];`\n\
    ```javascript\nfruitsArray.push(‘litchi’);\n```\nNow, the resulting `fruitsArray`\
    \ would be `[apple, mango, banana, orange, litchi]`\n\n- `pop()`: This method\
    \ is used for removing the last element from an array and also returns the removed\
    \ element.\nFor Ex: `var fruitsArray = [apple, mango, banana, orange];`\n```javascript\n\
    var removedFruit = fruitsArray.pop();\n```\nNow, the resulting `fruitsArray` would\
    \ be `[apple, mango, banana]` and `removedFruit` = `orange`.\n\n- `concat()`:\
    \ This method is used for combining one array with another into a new array.\n\
    For Ex: `var fruitsArray = [apple, mango, banana, orange];`\n`var carsArray =\
    \ [honda, suzuki, toyota];`\n```javascript\nvar fruitsAndCars = fruitsArray.concat(carsArray);\n\
    ```\nNow, the resulting `fruitsAndCars` would be `[apple, mango, banana, orange,\
    \ honda, suzuki, toyota];`\n\n- `sort()`: This method is used for sorting the\
    \ array in an increasing order.\nFor Ex: `var fruitsArray = [apple, mango, banana,\
    \ orange];`\n```javascript\nfruitsArray.sort();\n```\nNow, the resulting `fruitsArray`\
    \ would be `[apple, banana, mango, orange]`\n\n- `reverse()`: This method is used\
    \ for reversing the order of elements of the array i.e first element becomes the\
    \ last element and the last element becomes the first.\nFor Ex: `var fruitsArray\
    \ = [apple, mango, banana, orange];`\n```javascript\nfruitsArray.reverse();\n\
    ```\nNow, the resulting `fruitsArray` would be `[orange, banana, mango, apple]`\n\
    \n- `indexOf(reqdElement, [fromIndex])`: This method is used to search for the\
    \ index of a particular element in an array.\nFor Ex: `var fruitsArray = [apple,\
    \ mango, banana, orange];`\n`fruitsArray.indexOf(‘mango’);` will give 1 as result.\n\
    \nIf there is more than one element with the same name in an array, we can also\
    \ specify which index we want to start looking for the required element, as an\
    \ optional parameter.\nFor Ex: `var fruitsArray = [apple, mango, banana, orange,\
    \ mango];`\n`fruitsArray.indexOf(‘mango’, 2);` will give 4 as result.\n\n### Multi-Dimensional\
    \ Arrays\n\nA multi-dimensional array can be created by the nesting of one array\
    \ into another array, and populating each element for one dimension to each element\
    \ of another dimension. A multi-dimensional array can be created and populated\
    \ as follows:\n\nFor Ex:\n```javascript\nvar arr = new Array(5);\nfor (i = 0;\
    \ i < 5; i++) {\n  arr[i] = new Array(5);\n  for (j = 0; j < 5; j++) {\n    a[i][j]\
    \ = i + j;\n  }\n}\n```\n\nThe above code, when logged at `console`, will give\
    \ the following output:\n\n00 01 02 03 04\n10 11 12 13 14\n20 21 22 23 24\n30\
    \ 31 32 33 34\n40 41 42 43 44\n\nThis completes the explanation of the concept\
    \ of collections in JavaScript. Use the knowledge wisely! Always think your code\
    \ out before you write it. There are many ways to reach the end of a particular\
    \ path. Structure is everything.\n\n# Chapter 10: Working with Canvas in JavaScript\n\
    \nThe `canvas` element in HTML is responsible for displaying many graphics elements,\
    \ such as drawing, animations, interactivities etc.\n\nA simple canvas element\
    \ looks like this:\n\n```html\n<canvas id=\"idCanvas\" width=\"300\" height=\"\
    300\"></canvas>\n```\n\nAt first, it looks like an `<img>` element, with the absence\
    \ of `src` and `alt` attributes. The default height and width of the `canvas`\
    \ element is 300px and 150px, respectively.\n\n### Role of JavaScript in canvas\n\
    \nWe have already seen a basic use of JavaScript with canvas in the glimpse we\
    \ just took into the HTML section, which was the selection of canvas using DOM\
    \ properties.\n\n```javascript\nvar canvas = document.getElementById(\"idCanvas\"\
    );\n```\n\nNow we will discuss the actual use of JavaScript on the canvas. Initially,\
    \ the canvas is completely blank. To draw something onto the canvas, JavaScript\
    \ is needed to access the rendering context, with the help of a method `getContext()`.\n\
    \nThis method has one parameter which defines the type of context.\n\nFor Ex:\
    \ `getContext(\"2d\")`\n\nTo include this method in JavaScript, we first need\
    \ to select the canvas and store it into a variable, just like we did earlier\
    \ with the DOM properties. Secondly, we have to use the same variable to connect\
    \ the `getContext` method. Finally, we must store this into another variable (usually\
    \ named as `ctx`), which we will be using for the rest of the project to manipulate\
    \ canvas elements.\n\n```javascript\nvar canvas = document.getElementById(\"idCanvas\"\
    );\nvar ctx = canvas.getContext(\"2d\");\n```\n\nNotice that the `getContext`\
    \ method is connected by the same variable (`canvas`) which we have created to\
    \ store the selected canvas. As the context has been created now, we can easily\
    \ set different values for our canvas with the help of the variable `ctx`.\n\n\
    For example:\n1. `ctx.fillStyle=\"blue\";`\n2. `ctx.fillRect(8, 8, 40, 40);`\n\
    \nThe above code will draw a rectangle with the given coordinates in line 2 and\
    \ will provide a blue color as stated in line 1.\n"
