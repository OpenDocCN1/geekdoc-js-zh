    \ 'Ashok', lastName: 'Mehta'};\n\nfunction text(hello) {\n    console.log(hello\
    \ + ' ' + this.firstName + ' ' + this.lastName + ' ? ');\n}\n\nvar bound1 = text.bind(student1);\n\
    bound1('How are you'); // How are you Abhishek Kumar ?\n\nvar bound2 = text.bind(student2);\n\
    bound2('How are you'); // How are you Ashok Mehta ?\n```\n\n---\n\n### Chapter\
    \ 9: Collections in JavaScript\n\nIn JavaScript, a collection refers to the grouping\
    \ of data. More specifically, it refers to incorporating data in such structure\
    \ that we can access every value by its index. Collections can be in many forms,\
    \ like objects, arrays, maps, sets.\n\nIn this chapter, we will be focusing on\
    \ data structures like objects and arrays to explore the concept. We will be learning\
