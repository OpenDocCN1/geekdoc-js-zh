    Callbacks in JavaScript


    JavaScript functions are first-class objects. “First-class objects” mean that
    they can be used like other objects in the body. Like variables, we can save their
    references, pass them as arguments, declare nested functions (refer to previous
    sections), and can be return values of functions as we saw earlier.


    The capability of a function to be passed as argument to another function makes
    JavaScript functions special. A passed function can be executed at a later stage,
    or be returned as a function to be executed later by some other function. This
    is what constitutes the JavaScript Callbacks.


    Callbacks are functions which are passed as parameters to another function and
    is executed from the body of the containing function. Since the scenarios where
    such capabilities are of use is limited, they can be referred to as callback patterns.


    //define a callback function sum()


    var sum = function ( num1 , num2 ){


    return num1 + num2;


    }


    //define a function that will use sum() as parameter


    var calling_func = function ( a , b , callback ){


    return callback ( a , b );//calling the callback function with //parameters


    }


    var sample = calling_func( 5 , 5 , sum);//new will be assigned 10


    Let us walk through the code above. First, we declare a simple function that adds
    two values and return the result. Next, we define a function which takes in two
    parameters and a third parameter which is “callback”. Callback is basically a
    variable which will store the name of function we will pass and execute it accordingly.
    It can be called any name. For ease of understanding, I have named it callback.


    The important thing to note is that when we pass a function as variable, we only
    send the definition of callback function as in the name (say  sum), not the function
    call with parenthesis. The function is executed only when it is called inside
    the body of the containing function.


    As we have seen, callback functions are not called immediately, but are preserved
    as references and are only called when specified by the calling function, thus
    making them closures as detailed in the previous section.


    Callback functions not only can take existing functions as parameters, but can
    also define a completely new function in the parameter. It will be called as a
    callback by the containing function. Let’s go through an example:


    //no callback function is defined


    //define a function that will use sum() as parameter


    var sum = function(a,b){


    return a+b;


    }


    var some_func= function( a , b , callback ){


    return callback(a,b);


    }


    console.log(some_func(5,5,function(a,b){


    return a-b;


    }));


    //output


    0


    Here, the function is specified directly with a return value. This works fine,
    and is used when we have situations where we know a certain function will only
    be used once or twice during our development.


    Another important point to learn is that we can pass parameters to callback functions
    from inside the containing function.


    var sum = function(a,b){


    return a+b;


    }


    var b = 10; //define a global variable


    var some_func= function( a , callback ){


    return callback(a,b);//pass global var as a parameter


    }


    console.log(some_func(5,sum));


    //output


    //15


    Here, we can pass in some reserved or pre-defined parameters to the callback function
    which can consume it. This results in better code quality and more security.


    There is a necessary condition that whatever the callback function is should legitimately
    be a function. To prevent accidentally passing callback variables as something
    other than a function, we can put an “if” condition to check  typeof callback,
    and only execute further if it is of type “function”.


    If(typeof callback === “function”){


    //body of our function


    }


    Callbacks can be more than one function and can be passed as a parameter, as for
    a single callback.


    var sum = function(a,b){


    console.log("Callback")


    }


    var sum1 = function(a,b){


    console.log("Callback2")


    }


    var b = 10;


    var some_func= function( smthn , callback ){


    console.log("containign func")


    callback();


      smthn();


    }


    some_func(sum,sum1);


    //output


    containing func


    Callback


    Callback2


    Here, we are passing in two callbacks and executing them one after another, as
    per our needs. This is the basic concept of callbacks.


    Closures and callbacks are developed to facilitate ease of development for us
    and should be used as needed. Due attention needs to be paid while using them.
    Remember, closures are nothing but functions with preserved data. Similarly, callbacks
    can be generalized to “functions containing functions as parameters”.


    Chapter 8: Apply, call, and bind methods in JavaScript


    The apply(), call(), and bind() methods in JavaScript allow us to change the value
    of the "this" keyword with the help of some arguments. These methods are useful
    for calling a specified or targeted function. All three of these methods are closely
    related.


    In this section, we will review these three methods of JavaScript in brief.


    The ‘this’ keyword'
