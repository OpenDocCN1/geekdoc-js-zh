    {


    console.log(fruitsArray[i]);


    }


    The above code will give the output as:


    apple


    mango


    banana


    orange


    Here, .length is a predefined array method used to determine the length of the
    array. It is beneficial for iterating over the arrays. The above output can also
    be obtained by using forEach loop instead of For loop as follows:


    For Ex: fruitsArray.forEach(function(fruit){


    console.log(fruit);


      });


    Useful methods


    We have already discussed one of the predefined Array methods, the .length method.
    There are many other methods too. These methods are defined over the Array object
    as follows:


    push( ): This method is used for adding elements in an array. All the elements
    get added at the end of the array.


    For Ex: var fruitsArray = [apple, mango, banana, orange];


    fruitsArray.push(‘litchi’);


    Now, the resulting fruitsArray would be


    [apple, mango, banana, orange, litchi]


    pop( ): This method is used for removing the last element from an array and also
    returns the removed element.


    For Ex: var fruitsArray = [apple, mango, banana, orange];


    var removedFruit = fruitsArray.pop();


    Now, the resulting fruitsArray would be


    [apple, mango, banana] and removedFruit = orange.


    concat( ): This method is used for combining one array with another into a new
    array.


    For Ex: var fruitsArray = [apple, mango, banana, orange];


    var carsArray = [honda, suzuki, toyota];


    var fruitsAndCars = fruitsArray.concat(carsArray);


    Now, the resulting fruitsAndCars would be


    [apple, mango, banana, orange, honda, suzuki, toyota];


    sort( ): This method is used for sorting the array in an increasing order.


    For Ex: var fruitsArray = [apple, mango, banana, orange];


    fruitsArray.sort();


    Now, the resulting fruitsArray would be


    [apple, banana, mango, orange]


    reverse( ): This method is used for reversing the order of elements of the array
    i.e first element becomes the last element and the last element becomes the first.


    For Ex: var fruitsArray = [apple, mango, banana, orange];


    fruitsArray.reverse();


    Now, the resulting fruitsArray would be


    [orange, banana, mango, apple]


    indexOf(reqdElement, [fromIndex]): This method is used to search for the index
    of a particular element in an array.


    For Ex: var fruitsArray = [apple, mango, banana, orange];


    fruitsArray.indexOf(‘mango’); will give 1 as result.


    If there is more than one element with the same name in an array, we can also
    specify which index we want to start looking for the required element, as an optional
    parameter.


    For Ex: var fruitsArray = [apple, mango, banana, orange, mango];


    fruitsArray.indexOf(‘mango’, 2); will give 4 as result.


    Multi-Dimensional Arrays


    A multi-dimensional array can be created by the nesting of one array into another
    array, and populating each element for one dimension to each element of another
    dimension. A multi-dimensional array can be created and populated as follows:


    For Ex: var arr = new Array(5);


    for (i = 0; i < 5; i++) {


     arr[i] = new Array(5);


     for (j = 0; j < 5; j++) {


       a[i][j] = i + j;


     }


    }


    The above code, when logged at console, will give the following output:


    00 01 02 03 04


    10 11 12 13 14


    20 21 22 23 24


    30 31 32 33 34


    40 41 42 43 44


    This completes the explanation of the concept of collections in JavaScript. Use
    the knowledge wisely! Always think your code out before you write it. There are
    many ways to reach the end of a particular path. Structure is everything.


    Chapter 10: Working with Canvas in JavaScript


    The canvas element in HTML is responsible for displaying many graphics elements,
    such as drawing, animations, interactivities etc.


    A simple canvas element looks like this:


    <canvas id="idCanvas" width="300" height="300"></canvas>


    At first, it looks like an <img> element, with the absence of src and alt attributes.


    The default height and width of the canvas element is 300px and 150px, respectively.
    The height and width attributes of the canvas are optional and can be changed
    using DOM manipulations. The styling and appearance of the canvas can also be
    manipulated using CSS.


    The id="idCanvas" plays a crucial role in selecting the canvas. The name of "id"
    can be anything you choose it to be. The canvas element is selected in this way:


    var canvas = document.getElementById("idCanvas");


    Once the canvas element has been selected, it can be easily modified using JavaScript''s
    object-oriented methodology.


    For example:


    canvas.height= 100;


    canvas.width=  100;


    The fallback content


    Canvas doesn''t work in some old browsers, such as older versions of Internet
    Explorer or certain textual browsers.


    To avoid any uncertainty, we generally include fallback content inside the canvas
    element. To do so, we need only to insert alternative text inside the canvas block.


    For example:


    <canvas id="idCanvas" width="300" height="300">


       The alternative text goes here.


    </canvas>


    If the browser doesn''t recognize the canvas, it will render the alternative text
    and vice versa.


    The required closing tag:


    Like every other tag in HTML, the canvas tag also requires the closing tag. When
    using canvas elements, if the closing canvas tag is not provided, the rest of
    the document would be considered fallback content. It would then only display
    if a browser doesn''t recognize the canvas.


    Role of JavaScript in canvas


    We have already seen a basic use of JavaScript with canvas in the glimpse we just
    took into the HTML canvas section, which was the selection of canvas using DOM
    properties.


    var canvas = document.getElementById("idCanvas");


    Now we will discuss the actual use of JavaScript on the canvas.


    Initially, the canvas is completely blank. To draw something onto the canvas,
    JavaScript is needed to access the rendering context, with the help of a method
    called getContext();


    This method has one parameter which defines the type of context.


    For example:


    getContext("2d");


    To include this method in JavaScript, we first need to select the canvas and store
    it into a variable, just like we did earlier with the DOM properties.


    Secondly, we have to use the same variable to connect the getContext method.


    Finally, we must store this into another variable (usually named as ''ctx''),
    which we will be using for the rest of the project to manipulate canvas elements.


    var canvas = document.getElementById("idCanvas");


    var ctx    = canvas.getContext("2d");


    Notice that the getContext method is connected by the same variable (''canvas'')
    which we have created to store the selected canvas.


    As the context has been created now, we can easily set different values for our
    canvas with the help of the variable ''ctx''.


    For example:


    1\. ctx.fillStyle="blue";


    2\. ctx.fillRect(8,  8,  40,  40);


    The above code will draw a rectangle with the given coordinates in line 2 and
    will provide a blue color as stated in line 1.


    Drawing shapes in canvas


    So far, we have discussed how to set up the canvas environment with basics of
    JavaScript. We will now advance our knowledge and learn how to draw shapes in
    canvas using JavaScript.


    The canvas grid


    The canvas grid or coordinate space helps us to draw shapes and figures precisely.


    "1 unit or 1 block of canvas grid system is equivalent to 1 pixel."'
