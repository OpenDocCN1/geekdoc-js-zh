    JavaScript code:


    function drawTriangle() {


      var canvas = document.getElementById(''idCanvas'');


      if (canvas.getContext) {


        var ctx = canvas.getContext(''2d'');


        ctx.beginPath();


        ctx.moveTo(50, 75);


        ctx.lineTo(95, 72);


        ctx.lineTo(101, 26);


        ctx.fill();


      }


    }


