  trans: "\n在这里，我们有一个嵌套函数 `add()`，它可以接收来自外部函数 `addTo()` 的参数。当用户带有某些参数调用 `addTo()`\
    \ 时，他将获得该内部函数作为返回值，该函数反过来将执行加法并返回值。\n\n```javascript\nvar test = addTo(10);\n\
    ```\n\n在内部，`param_outer` 将等于 10，而 `add` 将取 `param_outer` 和 `sample` 的加值，并结果为 20。\n\
    \n```javascript\nvar add = 20 ;\n```\n\n当 `addTo()` 调用返回 `add` 时，`test` 的值将等于\
    \ `add` 的值，即 20。\n\n让我们来看一个更复杂的例子：\n\n```javascript\n//Example 3\n\n//定义一个接收参数的函数\
    \ addTo()\n\nvar addTo = function(param_outer){\n\n//定义接收另一个参数的函数 add\n\nvar add\
    \ = function(param_inner){\n\nreturn param_inner + param_outer;\n\n}\n\n//返回内部函数\n\
    \nreturn add;\n}\n\nvar test = addTo(10); //value 将不是 20\n```\n\n在这里，`test` 将取内部函数的值并本身成为一个函数，它将保留一个由我们设置的变量\
    \ `param_outer`，等于 10。\n\n所以，`test` 在内部看起来像这样：\n\n```javascript\n//这仅仅是其内部形式的表示\n\
    \nvar test = function(param_inner){\n\nreturn param_inner + 10;\n\n}\n```\n\n\
    如果我们想给任何数字加 10，我们可以简单地写：\n\n```javascript\nvar x =10;\n\nvar y = test(x);\n```\n\
    \n这将使得 `y` 的值等于 20，或者说 10 + 10。\n\n一个很好的用例是我们想要给某些数字加上常数时。我们可以利用这种方法来实现闭包。\n\n\
    示例：\n\n```javascript\nvar addThree = addTo(3);\n\nvar a = addThree(10);//a 将为\
    \ 3 + 10 = 13   \n\nvar a = addThree(20);//a 将为 3 + 20 = 23   \n\nvar a = addThree(30);//a\
    \ 将为 3 + 30 = 33\n```\n\n### 闭包的特性\n\n- 内部函数在执行后仍然可以访问外部函数的变量，正如我们在第三个示例中看到的。我们在调用内部函数之前调用了外部函数，即使在返回值之后，我们仍然可以在内部函数内部使用外部函数的参数，因为它们被保留了。\n\
    - 闭包存储的是对外部函数变量的引用而非实际值，如果需要，可以进行修改（参见示例 4）。\n- 闭包提供了一种处理某些数据的安全方法，因为我们可以保存变量的引用并防止意外更改。\n\
    \n```javascript\n//Example 4\n\n//定义变量 a = 5\n\nvar a = 5;\n\n//定义一个向 a 加 5 并返回值的函数\
    \ add\n\nvar add = function(val){\n\na = a + val;//将 val 加到 a\n\nreturn a;//返回\
    \ a\n}\n\na = 10; //更新 a 的值\n\nvar result = add(5); //将使 result 等于 15 而不是 10，因为在调用闭包之前\
    \ a 的值已更新，所以保存的引用被新引用更新了\n```\n\n闭包是强大的，但需要小心，因为更新的引用可能会让你的代码充满错误。始终确保仔细地使用这种能力。\n\
    \n**注意：** 闭包是函数或内部函数，它们保留了从全局或外部作用域引用的数据。\n\n### JavaScript 中的回调函数\n\nJavaScript\
    \ 函数是一等对象。“一等对象”意味着它们可以在函数体中像其他对象一样使用。像变量一样，我们可以保存它们的引用，将它们作为参数传递，声明嵌套函数（参见前面的章节），并可以像我们之前看到的，作为函数的返回值返回。\n\
    \n函数可以作为参数传递给另一个函数的能力使得 JavaScript 函数变得特殊。被传递的函数可以在稍后的阶段执行，或者作为函数返回，由其他函数稍后执行。这就是构成的\
    \ JavaScript 回调（Callbacks）。\n\n回调是指作为参数传递给另一个函数的函数，并在包含该函数的体内执行执行。由于此类能力的应用场景有限，它们可以被称为回调模式。\n\
    \n```javascript\n//定义一个回调函数 sum()\n\nvar sum = function ( num1 , num2 ){\n\nreturn\
    \ num1 + num2;\n\n}\n\n//定义一个使用 sum() 作为参数的函数\n\nvar calling_func = function (\
    \ a , b , callback ){\n\nreturn callback ( a , b //带有参数调用回调函数\n\n}\n\nvar sample\
    \ = calling_func( 5 , 5 , sum);//new 将被赋值为 10\n```\n\n让我们遍历上面的代码。首先，我们声明了一个简单的函数，相两个值并返回结果。接下来，我们定义了一个接收两个参数以及第三个参数“callback”的函数。回调本质上是一个变量，用于存储我们将传递的函数名并相应地执行它。它可以命名为任何名称。为了方便理解，我将其命名为\
    \ `callback`。\n\n需要注意的是，当我们把函数作为变量传递时，我们只发送回调函数的定义名称（例如 `sum`），而不是带括号的函数调用。该函数只有在包含它的函数体内被调用时才会被执行。\n\
    \n正如我们看到的，回调函数不会被立即调用，而是以引用的形式保留，并且只有在调用函数指定时才被调用，这使得它们成为我们在上一节介绍的闭包。\n\n回调函数不仅可以接受现有函数作为参数，还可以在参数中定义全新的函数。\n\
    \n```javascript\n//定义一个回调函数 sum()\n\nvar sum = function ( num1 , num2 ){\n\nreturn\
    \ num1 + num2;\n\n}\n\n//定义一个使用 sum() 作为参数的函数\n\nvar calling_func = function (\
    \ a , b , callback ){\n\nreturn callback ( a , b //带有参数调用回调函数\n\n}\n\nvar sample\
    \ = calling_func( 5 , 5 , sum);//new 将被赋值为 10\n```\n"
- fmt: "\nBefore diving into the details of `apply()`, `call()`, and `bind()` methods,\
    \ we need to know about the keyword `this` in JavaScript.\n\n### In terms of global\
    \ context\n\nThe keyword `this` refers to the global object outside of any method.\
    \ In the following example, we will see the scope of this `this` keyword in the\
    \ global context. We will just `console.log` the `this` keyword in the browser.\n\
    \n```\nconsole.log(this);\n```\n\nThe result in the console is “window”, which\
    \ is nothing but the global object. This result implies that:\n\n```javascript\n\
    console.log(this === window); // is true\n```\n\nIn the example above, we entered\
    \ `console.log(this)` which gave us `window` object.\n\nIn this example, we will\
    \ use strict mode and check the value of the `this` keyword.\n\n```javascript\n\
    function abc(){\n  'use strict'; // the strict mode\n  return this;\n}\n\nconsole.log(abc());\
    \ // undefined\n```\n\nThis time, the value of the `this` keyword is `undefined`\
    \ because it was not defined inside the function `abc()`.\n\n### In terms of function\
    \ context\n\nAddressing the `this` keyword in terms of function context, we have\
    \ the three methods `call()`, `apply()`, and `bind()`. Let’s talk about these\
    \ methods in detail.\n\n#### The apply method\n\nThe `apply()` method invokes\
    \ a function with the value of `this` keyword, and parameters provided as an array\
    \ (or an array-like object).\n\n**Syntax:**\n\nThe method `apply()` has the following\
    \ syntax:\n\n```\nfunctionName.apply(thisArgument, argsArray[])\n```\n\n#### Parameters\n\
    \nLet's have a look at the arguments provided to the `apply()` method.\n\n- `thisArgument`:\
    \ The value of keyword `this` provided for the invoke the `functionName`.\nNote:\
    \ The value of the keyword `this` may not be the original value seen by the function\
    \ when working in non-strict mode. The primitive values and the global object\
    \ will be replaced by `undefined` and `null`.\n- `argsArray[]`: An argument of\
    \ an array-like object that specifies the arguments with which `functionName`\
    \ should be called, or `undefined` or `null` if no arguments should be provided\
    \ to the method.\n\n**Example:**\n\nIn the following example, we will take a look\
    \ at the basic functionality of the `apply()` method.\n\n```javascript\nvar student1\
    \ = {firstName: 'Abhishek', lastName: 'Kumar'};\nvar student2 = {firstName: 'Ashok',\
    \ lastName: 'Mehta'};\n\nfunction text(hello) {\n    console.log(hello + ' ' +\
    \ this.firstName + ' ' + this.lastName + ' ? ');\n}\n\ntext.apply(student1, ['How\
    \ are you']); // How are you Abhishek Kumar ?\ntext.apply(student2, ['How are\
    \ you']); // How are you Ashok Mehta ?\n```\n\n#### The call method\n\nThe `call()`\
    \ method invokes a particular function with the help of the `this` keyword and\
    \ an individual argument.\n\n**Syntax:**\n\nThe method `call()` has the following\
    \ syntax:\n\n```\nfunctionName.call (thisArgument, argument1, argument2, ....)\n\
    ```\n\n#### Parameters\n\nLet's have a look at the arguments provided to the `apply()`\
    \ method.\n\n- `thisArgument`: The value of keyword `this` provided for the invoke\
    \ the `functionName`.\nNote: As with the `apply()` method, the value of keyword\
    \ `this` may not be the original value seen by the function when working in non-strict\
    \ mode. The primitive values and the global object will again be replaced by `undefined`\
    \ and `null`.\n- `Argument`: ...\n\n**Example:**\n\n```javascript\nvar student1\
    \ = {firstName: 'Abhishek', lastName: 'Kumar'};\nvar student2 = {firstName: 'Ashok',\
    \ lastName: 'Mehta'};\n\nfunction text(hello) {\n    console.log(hello + ' ' +\
    \ this.firstName + ' ' + this.lastName + ' ? ');\n}\n\ntext.call(student1, 'How\
    \ are you'); // How are you Abhishek Kumar ?\ntext.call(student2, 'How are you');\
    \ // How are you Ashok Mehta ?\n```\n\n#### The bind method\n\nThe `bind()` method\
    \ creates a new function that allows you to set the `this` keyword explicitly.\n\
    \n**Syntax:**\n\n```\nfunctionName.bind(thisArgument, argument1, argument2, ...)\n\
    ```\n\n**Parameters**\n\n- `thisArgument`: The value of keyword `this` provided\
    \ for the invoke the `functionName`.\n- `argument1, argument2, ...`: Arguments\
