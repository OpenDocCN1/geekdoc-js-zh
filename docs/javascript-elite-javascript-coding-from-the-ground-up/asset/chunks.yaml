    General Syntax:


    `Promise.race( [ Promise1 [, Promise2 [, Promise3 [, Promise4 … ] ] ] ] );`


    ### Chapter 6: AJAX


    You might have developed a lot of web pages containing images, videos, etc. All
    of them probably lacked a common functionality. They were all static web pages,
    which had to be refreshed to display new content. There is always an alternative,
    a better way to do any task when you code. This is where `AJAX` comes into the
    picture. AJAX stands for Asynchronous JavaScript and XML.


    AJAX is an important frontend web technology which plays a crucial role in the
    development of several sites you visit all day. This technology helps you update
    a particular part of the web page without the need to refresh the complete page.
    This also decreases the amount of data exchanged between the host computer and
    the server.


    AJAX helps JavaScript communicate with a web server. Now your site isn’t static
    anymore, but completely dynamic. Gmail, Facebook, Twitter, and Youtube are only
    a few websites to name who utilize AJAX heavily in their frontend code.


    ### Understanding the AJAX Call Process


    This involves a number of steps to get the task done. We will list those steps
    in this section, and explore the concepts in the next section.


    - Triggering the event: This happens when you click on a button, submit a form,
    or any type action that initiates a response.

    - AJAX call fires up and a request is sent to the web server using XML.

    - The server side script (PHP, ASP, etc.) takes the input and processes it accordingly.
    It also accesses the database if required.

    - The script then sends back the output of the processing performed using XML
    to the client side page which made the particular request to the server.

    - A JavaScript callback function receives the data, processes it accordingly,
    and then updates the relevant section of the web page.


