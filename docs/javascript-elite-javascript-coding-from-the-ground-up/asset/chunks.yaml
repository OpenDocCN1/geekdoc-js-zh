  trans: "\n因此，在全局作用域执行 `console.log(this)` 的结果将返回 `window` 对象。\n\n为了更好地理解 `this`，让我们定义如下一个对象：\n\
    \n```javascript\nvar obj = {\n  someProperty1: “Hi”,\n  someProperty2: function(name)\
    \ {\n    // 在这里 ‘this’ 将作用域到 obj 对象，因为它是当前的局部作用域\n    // 在该作用域中存在 window 对象\n\
    \    return this.someProperty1 + name;\n  }\n}\n\nvar myObj = obj.someProperty2(“\
    \ John”);\nconsole.log(myObj); // === “Hi John”\n```\n\n在上面的代码中，在 `obj` 的 `someProperty2`\
    \ 属性中，我们使用了 `this` 关键字来访问当前对象的另一个属性 `someProperty1`，因此函数返回了结果为“Hi John”。\n\n如果我们使用\
    \ JavaScript 的箭头函数，结果将不会受到影响。结果将是相同的。\n\n借助 `this` 操作符的帮助，我们可以如下所示编写 JS 中的对象构造函数：\n\
    \n```javascript\nfunction obj(name) {\n  this.name = name;\n  this.someMethod\
    \ = function() {\n    console.log(this.name);\n  }\n}\n\nvar myObj = new obj(“John”);\n\
    myObj.someMethod(); // === John\n```\n\n你也可以在对象的原型链上使用 `this`，如下：\n\n```javascript\n\
    var obj = function() {\n  return this.a + this.b;\n};\n\nvar myObj = Object(obj);\n\
    myObj.a = 5;\nmyObj.b = 6;\nmyObj(); // === 11\n```\n\n与之前一样，我们使用 `this` 关键字来访问当前对象，并实例化它的数据成员和函数。\n\
    \n我想总结说，JavaScript 中的 `this` 关键字是你经常会发现需要它的东西。它会让你的工作变得更简单，并在你的编码风格中提供许多的灵活性。\n\
    \n# 第 3 章：JSON\n\nJSON 或 JavaScript Object Notation（JavaScript 对象表示法），最初由 Douglas\
    \ Crockford 规范，是最常用的数据交换格式之一。JSON 无非是用于存储和交换数据的简单媒介。这种交换发生在浏览器和服务器之间。\n\n数据的格式只能是文本，任何\
    \ JavaScript 对象都可以转换为 JSON 格式以向服务器发送数据。同样，从服务器接收数据时，任何 JSON 文本都可以转换为 JavaScript\
    \ 对象。\n\nJSON 是一种轻量级格式，人类容易理解，也便于机器解析。它是语言无关的，这意味着它不仅局限于用于 JavaScript，尽管 JSON\
    \ 使用了 JavaScript 语法，但由于该格式仅为文本，它可以被任何编程语言读取和使用。它的文件扩展名为 `.json`。由于其易于解析的特性，JSON\
    \ 广泛优于如 `XML` 等其他数据传输表示。\n\n## JSON 语法\n\nJSON 语法与 JavaScript 语法相似，细微区别在于键（keys）必须是用双引号\
    \ “ ” 写的字符串，包含以下表示法：\n\n1. 交换的数据应该以名称（Name）和值（Value）成对的形式存在。每个名称都有一个对应的值，可以通过\
    \ JavaScript 对象通过其名称进行访问。\n   示例：`“name”: “Mark”`\n\n2. 对象被放在大括号 `{ }` 中。每个名称字段后跟着一个冒号\
    \ `:`，然后是它的值。每个键值对后面都跟着一个逗号 `,`，以防用户想要输入另一个键值对。\n   示例：`{ “name”: “Mark”, “age”:\
    \ “20” }`\n\n3. 这些对象的数组包含在方括号 `[ ]` 中，数组中的每个对象本身用逗号隔开。\n   示例：`[ { “name”: “Mark”,\
    \ “age”: “20” }, { “name”: “Anthony”, “age”: “40”}]`\n\n## 数据类型\n\nJSON 可以具有以下数据类型的值：\n\
    \n1. **Number（数字）** - 在 JSON 中，使用的数字必须是整数或浮点数。\n   示例：`{ “age”: 20 }`\n\n2. **String（字符串）**\n\
    \   示例：`{ “firstName”: “Mark” }`\n\n3. **Boolean（布尔值）**\n   示例：`{ “vegetarian”:\
    \ true }`\n\n4. **Array（数组）**\n   示例：`{ “children”: [“Henry”, “Emma”, “Joe”] }`\n\
    \n5. **另一个 JSON 对象**\n   示例：`{ “details”: { “lastName”: “Lucas”, “bankAccount”:\
    \ “savings” } }`\n\n6. **Null（空）**\n   示例：`{ “middleName”: null }`\n\n**注意：**\
    \ 不要将 JSON 数据类型与 JavaScript 数据类型混淆。不要使用以下任何数据类型：\n1. 函数\n2. 日期\n3. `undefined`\n\
    \n## JSON 中的对象\n\n可以使用点 `.` 表示法按照如下方式访问 JSON 对象的值：\n\n示例：如果只想只想访问变量 `fullName`\
    \ 的 `firstName`，可以这样操作：\n\n```javascript\nvar fullName = {\n  “firstName”: “Mark”,\n\
    \  “lastName”: “Anthony”\n};\n\nvar firstname = fullName.firstName;\n```\n\n另一种方法是使用方括号\
    \ `[ ]` 表示法：\n\n```javascript\nvar firstname = fullName[“firstName”];\n```\n\n\
    同样，我们可以通过逐层向下移动名称来访问嵌套的 JSON 对象。\n\n示例：\n```javascript\nvar fullName = {\n  “name”:\
    \ {\n    “firstName”: “Mark”,\n    “lastName”: “Anthony”\n  },\n  “age”: 25,\n\
    \  “profession”: “Business”\n} // 注意：原文此处缺少闭合大括号，已在翻译中补全逻辑\n\nvar firstname =\
    \ fullName.name.firstName;\n```\n（注：此处根据上下文逻辑修正了示例代码的结构）\n\n值也可以通过点或方括号表示法通过简单等值所需的键来设置：\n\
    \n示例：`fullName.name.firstName = \"New\"` 或 `fullName[\"name\"][\"firstName\"]\
    \ = \"New\"`\n\n## JSON 中的数组\n\n同样，我们可以通过逐层向下移动名称来访问嵌套的 JSON 对象。\n\n示例：\n```javascript\n\
    var fullName = {\n  “name”: {\n    “firstName”: “Mark”,\n    “lastName”: “Anthony”\n\
    \  },\n  “age”: 25,\n  “profession”: “Business”\n}\n\nvar firstname = fullName.name.firstName;\n\
    ```\n\n## JSON 方法\n\n从服务器接收到客户端的 JSON 数据始终是字符串。由于我们需要 JavaScript 对象来访问键，因此使用 `JSON.parse()`\
    \ 方法解析 JSON 数据。\n\n示例：`JSON.parse('{ “children”: { “Henry”, “Emma”, “Joe” } }’`\n\
    \n**注意：** 必须是 JSON 格式以避免语法错误。\n\n同样，从客户端发送到服务器的 JSON 数据必须是字符串。由于我们的数据是 JavaScript\
    \ 对象，我们需要将其转换为字符串。使用 `JSON.stringify()` 方法将 JSON 对象转换为字符串。\n\n示例：`JSON.stringify({\
    \ “children”: { “Henry”, “Emma”, “Joe” } });`\n\n# 第 4 章：同步与异步 JavaScript\n\n\
    在编程术语下理解异步和同步的概念是一项相当困难的任务。可能会有一个陡峭的学习曲线，但在良好掌握这一概念后，你将能够轻松地理解其他高级概念。JavaScript\
    \ 中的大多数高级概念都基于 JavaScript 中的异步行为。\n\n### 什么是同步和异步？\n\n在编程术语中，同步行为意味着代码按照其编写的顺序执行，而异步意味着代码不一定按照其编写的顺序执行。\n\
    \n让我们通过现实生活场景来理解这一点。\n\n"
- fmt: '

    Imagine you are ordering a pizza by making a phone call, but there is only one
    in the pizza shop who can take the call. If someone else is also placing a phone
    order while you call, you will get a busy tone. You will have to wait for the
    current phone call to finish until you can place your order and cannot do other
    things while waiting for your turn! This scenario shows a synchronous behavior,
    where you cannot move onto your next task until the current one is finished.


    Now let us alter some circumstances in the same scenario. Say that the person
    taking pizza orders gets an answering machine, which records the call when the
    phone is busy and reports it to the person taking the order after they finishes
    the current call. Now if the phone is busy when you call, you simply leave the
    order on the answering machine and continue with your activities. When the person
    taking the orders receives your order, the call will be returned, and the order
    will be filled. This scenario details asynchronous behavior, as you do not have
    to wait for the other call to be finished. You can fulfill your side of the transaction,
    and complete it with any details necessary (expected time of receipt, payment
    method, address, etc) when the other party is ready to participate.


    There are simpler examples to detail this behavior. Your body can perform multiple
    tasks at once, like playing the guitar while singing. This is an example of asynchronous
    behavior. Conversely, all other actions stop while sneezing. This is an example
    of synchronous behavior, as you must wait for the sneeze action to be completed
    for other actions to resume or begin.


    Similarly, in programming, if you do not have to wait for an action to finish
    and can move onto another task, then the action is said to be asynchronous. The
    action started earlier running in parallel may report its progress, like the person
    taking order may return back to you with more details after he gets your order.


    Let us see examples code of both synchronous and asynchronous JavaScript.


    ### Synchronous


    ```javascript

    console.log(''how'');

    console.log(''are'');

    console.log(''you'');

    ```


    The output of the above code will be:


    how

    are

    you


    This is simple! The output is as you would expect it to be.


    ### Asynchronous


    ```javascript

    console.log(''how'');

    setImmediate(function() {

    console.log(''are'');

    });

    console.log(''you'');

    ```


    The output of the above code will be:


    how

    you

    are


    Notice that there is a difference in output here. This is because of the asynchronous
    nature of the `setImmediate()` method.


    ### Why Asynchronous?


    Whenever you do some heavy or time-consuming operation in synchronous mode, the
    rest of the code won’t execute until that code finishes executing. This leads
    to a condition known as I/O blocking. When this happens, the UI, also known as
    the “frontend” of your website or web application, will become non-responsive
    for the time being. This is because the UI and the JavaScript code run in the
    same thread! In cases like these, we use asynchronous methods. That way, the heavy
    task keeps running and it doesn''t cause the user interface of the application
    to be unresponsive.


    Here’s an example usage scenario.


    Let’s imagine that you have a very long loop. Say the loop is:


    ```javascript

    for( var i = 0; i < 99999999; i++) {

    // doing some task here

    }

    ```


    While this loop is running, nothing else will run and the web application’s frontend
    will become unresponsive. In order to solve this problem, we will use `setImmediate()`.
    Here is the converted version of the loop:


    ```javascript

    function longLoop(i) {

    // doing some task here

    if( i < 99999999) setImmediate(longLoop, i + 1); // increasing value of i and
    calling function again to create a loop

    }


    setImmediate(longLoop, 0); // starting the loop

    ```


    Running the above code won’t cause the UI to go unresponsive. The call to each
    iteration of the loop is asynchronous, thereby allowing other functions to be
    executed as well.


    The concept of synchronous and asynchronous is the core of JavaScript and the
    base of almost all advanced concepts in JavaScript. Be it timers, AJAX, or any
    number of other concepts, it becomes important to understand this concept to establish
    a base for your continued knowledge.


    # Chapter 5: Promises in JavaScript


    Promises in JavaScript provide an alternative for managing asynchronous requests.
    Another alternative is to use callbacks.


    You can interpret promises in JavaScript like the promises that you make in your
    real life. For example, if your friend promises to do your homework on your behalf
    by the end of the day? He would have either done your homework for you or not.
    There are only a set number of outcomes to his promise, right? Similarly, promises
    in JavaScript can have three states:


    - **Pending**: This means that the `Promise` is still waiting to be fulfilled.
    It can have any output, such as “it''s not the end of day yet, and you don’t know
    whether your friend will complete your homework or not.”

    - **Rejected**: This means that you have gotten the result of the promise and
    it was negative, like “your friend didn’t do your homework after all.”

    - **Resolved**: This means that you have gotten the result of the promise and
    it was positive, yielding the desired output. “Your friend did your homework!”


    Once the promise is either Resolved or Rejected, it is said to have been settled.


    `Promise` is a class in JavaScript. You create a new object of this class by using
    the keyword `new` to create a new `Promise` object.


    ECMAScript 5 or ES5 standards for JavaScript, which is currently used in all major
    browsers at the time of this publication, does not natively have standards for
    Promises. However, some browsers still support Promises. ES6 natively supports
    Promises. Promises will soon be supported by all major browsers.


    ### Creating Promise


    As stated earlier we will use the keyword `new` to create a new object of the
    `Promise`. The constructor of this object takes in a closure function. Here is
