    will always be. However, the first and third steps differ in low-level and high-level
    languages. High-level languages implement it implicitly (done by the language
    automatically), whereas low-level languages implement it explicitly (has to be
    done by the programmer himself/herself).


    Memory allocation


    Memory can be allocated mainly in two ways:


    •    Value Initialization: JavaScript allocates memory while declaring values.


    var number = 1234;//This allocates memory for a variable ‘number’ of type number


    var name = ‘John’; //This allocates memory for a variable ‘name’ of type string


    var obj = {


        x: ‘name’,


        y: 8


    }//This allocates memory for an object ‘obj’ and the values contained in it.


    var arr = [2, 3, 4, 5];//This allocates memory for an array of numbers


    function add5(num1){


    return num1+5;


    }//allocated memory


    •     Function Calls: Some function calls also result in the allocation of memory
    for an object.


    var date = new Date(); //This allocates memory for date object


    Garbage collection


    As mentioned before, certain algorithms are implemented to find the memory blocks
    which are unused by the application and available to be freed up. Here, we are
    going to look into the two most important garbage collection algorithms and their
    limitations:


    •    Reference Counting Garbage Collection


    •    Mark-and-Sweep Algorithm


    Reference counting garbage collection


    Many popular languages, such as PHP and Python, implement this algorithm. It’s
    based on the idea that if there are no references to an object, it can be freed
    up. It considers an object with zero references to be an object which is no longer
    in use by the application.


    var obj = {obj1: {x:3}, c:3, d: 4};


    obj -----> obj1 //As one object references another, neither of them can be freed
    up


    obj = 0; //Now, no object references to ''obj1'' and hence this can be freed up


    LIMITATION:


    This algorithm tends to fail when objects create a reference cycle, as explained
    in the example below:


    var obj1 = {}


    var obj2 = {}


    obj1.x = obj2;


    obj2.x = obj1;


    This creates a reference cycle between objects ''obj1'' and ''obj2''. Let this
    code snippet be a part of a function, or any local scope. When the program goes
    out of this scope, both these objects become useless and hence should be freed
    up as they are no longer in use. The reference counting algorithm fails to free
    the memory taken by these objects as they both have at least one reference to
    them.


    Mark-and-sweep algorithm


    When an individual object is unreachable by the application, the mark-and-sweep
    algorithm returns the memory occupied by that object to the free memory pool.


    Though the reference cycle problem no longer prevails in this algorithm, there
    can be instances when some zombie memory blocks aren’t released as the algorithm
    considers them to be reachable.


    Common mistakes in JavaScript leading to memory leaks


    •    Accidental Global Variables


    •    Closures


    •    DOM References to Removed Elements


    •    Forgotten Callbacks


    While some languages do provide garbage collection mechanisms, they do not prove
    to be universally effective. It ultimately depends on the programmer to keep track
    of the memory usage and try to free up memory explicitly wherever possible. Doing
    so adds to the potential of the garbage collection mechanism employed by the language
    to reduce any such error of memory leaks.


    Chapter 13: Recursion in JavaScript


    Recursion is a programming technique, which can be used in almost all programming
    languages. It is not a function or a data type. It is a type of architecture,
    a design pattern, or a type of coding style to solve a particular problem.


    What is Recursion?


    Recursion is the act of calling a function from within the function itself. It
    may sound simple, but can be a complex concept to grasp in practice. Many programmers
    struggle to understand on how to use this technique properly. This process of
    calling the function from within itself goes on until the desired goal is achieved.


    Recursion is a loop. You repeat the same set of code again and again, as the function
    calls itself from within itself. You can generally achieve the same goal using
    recursion or using a loop. Most recursive algorithms can be recreated by using
    loops.


    Recursion Examples


    Let us take a look at some examples of loops, and the equivalent recursion for
    accomplishing the same goal.


    We will start by printing numbers from 0 to 10\. When using a loop, the code will
    look something like this:


    for(var i = 0; i <= 10; i++) {


    console.log( i );


    }


    Now let us take a look at the recursive technique to print all the numbers from
    0 to 10:


    function printNumbers(x) {


    console.log( x );


    X++; // incrementing x’s value


    if(x < 10)printNumbers(x);


    }


    printNumbers(0); // calling function once to initialize process


    Both pieces of code do the same thing. With the recursion technique, you can see
    that we have an ‘if’ statement that checks whether x’s value is less than 10\.
    If it is less than 10, the function is called again. We need to have these types
    of checks if using the recursion technique, or else the recursion process will
    go on forever.


    Let us move onto more difficult problems. We will try getting the factorial of
    a number, which is the product of all the natural numbers up to that number.


    First, let us do it with help of a loop:


    var number = 6; // number to get the factorial of


    function getFactorial(x) {


    var r = 1;


    for(var i = 1; i <= number; i++) {


    r = i * r;


    }


    return r;


    }


    var result = getFactorial( number );


    console.log( ''Factorial of number '' + number + '' is '' + result );


    Now, let us see how to do it via recursion:


    var number = 6; // number to get the factorial of


    function getFactorial(x) {


    if(x == 1) return x;


    return x * getFactorial( --x ); // recursion!


    }


    var result = getFactorial( number );


    console.log( ''Factorial of number '' + number + '' is '' + result );


    What happens here is that we decrease x’s value by 1 every instance before we
    make the recursive call. We check to see “if x’s value is 1, then return x” which
    is 1\. Until the value of x reaches 1 there is a stack of calls that multiply
    each number up to 1. As soon as 1 is returned, recursion stops and the factorial
    is returned.


    Call getFactorial(6)


    ● Return 6 x getFactorial(5)step i


    ● Return 5 x getFactorial(4)step ii


    ● Return 4 x getFactorial(3)step iii


    ● Return 3 x getFactorial(2)step iv


    ● Return 2 x getFactorial(1)step v


    ● getFactorial(1) one returns 1 because of the check, so now values go up the
    queue that is mentioned above.


    ● Control moves to step v which now becomes: return 2 x 1 or return 2


    ● Control moves to step iv which now becomes: return 3 x 2 or return 6


    ● Control moves to step iii which now becomes: return 4 x 6 or return 24


    ● Control moves to step ii which now becomes: return 5 x 24 or return 120


    ● Control moves to step i which now becomes: return 6 x 120 or return 720


    ● Finally, the factorial of 6, i.e., 720, is returned.


    Recursion disadvantages


    While recursion can make a complex problem’s code shorter, it still has some major
    disadvantages that should be kept in mind when utilizing it in practice:


    ● It makes the code more difficult to understand.


    ● Each call to function gets stacked up in memory. A very long recursive chain
    can lead to filling all of the memory that the JavaScript engine is allocated,
    thus leading to unforeseen errors. Different machines may have different memory
    capacity.


    ● Recursion is slower than loops, as there must be a new call to function in each
    iteration. Every function call consumes some time.


    Where to use Recursion?'
