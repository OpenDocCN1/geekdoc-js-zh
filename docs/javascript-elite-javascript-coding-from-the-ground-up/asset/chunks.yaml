    \ 2017 Keith Dvorjak - 版权所有。\n\n无论是以电子形式还是印刷形式，对以下任何作品（包括特定信息）的传输、复制或转载都将被视为非法行为。这延伸到创建作品的二级或三级副本或录制副本，并且在获得出版者明确书面许可的情况下才允许。保留所有其他权利。\n\
    \n后续页面中的信息被广泛认为是对事实的真实准确的描述，因此，读者对相关信息的任何疏忽、使用或误用，其产生的后果将完全由其自行负责。在任何情况下，出版者或本作品的原始作者对读者在采纳本文所述的信息后可能遭受的任何困难或损害不承担任何责任。\n\
    \n此外，后续页面中的信息仅供参考，因此应被视为是通用的。根据其性质，这些信息的呈现不不对其长效有效性或中间质量提供保证。\n\n## 目录\n\n- 第一章：JavaScript\
    \ 中的 OOP（面向对象编程）\n- 第二章：JavaScript 中的 `this` 关键字\n- 第三章：JSON\n- 第四章：同步与异步 JavaScript\n\
    - 第五章：JavaScript 中的 Promises\n- 第六章：AJAX\n- 第七章：JavaScript 中的闭包与回调\n- 第八章：Apply,\
    \ call 和 bind 方法\n- 第九章：JavaScript 中的集合\n- 第十章：在 JavaScript 中操作 Canvas\n- 第十一章：JavaScript\
    \ 中的动画\n- 第十二章：JavaScript 中的内存泄漏\n- 第十三章十三章：递归\n\n## 引言\n\n感谢下载《JavaScript: 从零开始的精英\
    \ JavaScript 编码》！本书是 DIY JavaScript 系列的第四部。之前的书籍有：\n\n- JavaScript: 从零开始的入门级 JavaScript\
    \ 编码\n- JavaScript: 从零开始的中级 JavaScript 编码\n- JavaScript: 从零开始的高级 JavaScript 编码\n\
    \n……并假设用户已经熟悉这些书籍的内容，包括 JavaScript 代码、语法以及从入门到高级的概念。为了获得最佳效果，应按时间顺序阅读这些书籍。本书将涵盖高级\
    \ JavaScript 操作技术，并提供与所解释主题匹配的代码示例。\n\n再次感谢下载本书！在进一步提升 JavaScript 编码知识方面，你有许多选择。感谢选择\
    \ DIY JavaScript 系列作为你的学习工具！\n\n## 第一章：JavaScript 中的面向对象编程\n\n在琳琅满目的编程语言中，选择其中一种是明智的。影响语言选择的因素有很多，从效率到可靠性不一。整个讨论的很大一部分也取决于语言所遵循的范式。\n\
    \n编程范式是一种根据其提供的特征对编程语言进行分类的模型。它是构建语言结构和元素的基本风格。编程语言的风格和能力由其范式定义。一种语言甚至可以实现多种范式。例如，Haskell\
    \ 只使用单一范式来定义其本身，即函数式编程。JavaScript 支持函数式、面向对象和命令式编程风格。不同的编程范式包括：\n\n- 命令式 (Imperative)\n\
    - 面向对象式 (Object-oriented)\n- 逻辑式 (Logic)\n- 符号式 (Symbolic)\n- 声明式 (Declarative)\n\
    - 函数式 (Functional)\n\n为什么我们这么多范式？这个基础问题的答案是因为有很多问题需要解决，而不同的范式在处理特定问题组时效率更高。面向对象范式处理复杂性的良好方法，而通过使用函数范式可以避免并发问题。很容易理解，在大多数情况下，多范式语言会胜过单一范式语言。\n\
    \n### JavaScript 中使用的范式\n\n我们已经知道 JavaScript 实现了多种范式，如函数式、面向对象和命令式。我们将研究 JavaScript\
    \ 的面向对象特性。在完全深入其在语言中的实现之前，让我们先了解它是什么以及它的优势。\n\n### 面向对象编程\n\n面向对象编程是一种编程语言模型，它关注的是对象而不是执行操作，关注的是数据而不是涉及的逻辑。在这样的编程风格中，程序员只关心对象的实现。在这里，对象可以是从人类到恐龙、从砖块到建筑，以及你能想到的任何东西。每个对象都有一组关联的数据，以及可以用于操作它的不同方法。例如，让我们把汽车比作对象。汽车有颜色、尺寸、座椅数量等作为其数据，而移动、停止和启动可以被视为与汽车相关的方法。\n\
    \n程序中实现它时会出现大问题。我们首先识别将要使用的所有对象，以及它们彼此之间的关系；这被称为数据建模。第二步是将对象泛化为对象的类（class），它定义了与其关联的数据以及对象的不同方法/能力。\n\
    \n面向对象编程的概念为我们带来了这些益处：\n\n- 对于每个类，我们都可以定义子类，子类可以从主类继承属性和功能。这被称为继承。现实世界遵循一个继承树，子元素继承父元素的部分或全部属性，再加上它自己特有的属性（这些属性在兄弟元素中可能并不具备）。这有助于缩短开发时间，并提高程序员的效率。\n\
    - 在定义类时，我们只关心类的数据。因此，当类的实例（即对象）运行时，它将无法修改任何不属于它的数据。这个过程被称为数据隐藏，它提供了系统安全性，并也有助于避免意外的数据损坏。\n\
    - 一个类可以反复使用。它不仅可以被它自己的程序重用，也可以被其他程序重用。\n- 程序中发现错误？没问题！你只需要检查抛出错误的类的代码。这有助于简化整个程序的测试、调试和维护。\n\
    \n### JavaScript 中的 OOP\n\n在前面的章节中，我们简要学习了面向对象语言的不同概念。当我们直接关注其在感兴趣的语言（即 JavaScript，它是动态的）中的实现时，我们只关注继承和封装。那么，我们为什么不关心多态呢？JavaScript\
    \ 作为一种动态类型编程语言，使得观察多态的效应变得困难得多，因为它在 C 或 C++ 等静态类型语言中更为明显。在 JavaScript 中讨论方法重载或函数重载没有意义，因为我们在编写代码时没有指定任何数据类型。因此，机器无法区分同一个函数的两个定义。在\
    \ JavaScript 中，许多概念都是通过函数实现的。面向对象编码也不例外。实例是函数的实现。\n\n```javascript\nfunction child(name){\n\
    \    // 此处编写代码\n} // child 是一个构造函数，因为我们将使用 “new” 关键字来调用它。\n```\n\n现在，这看起来类似于 Java\
    \ 等语言，我们使用 new 关键字来创建实例。\n\n```javascript\nvar aditya = new child(\"aditya\");\
    \ // Aditya 是 child 的一个实例\n```\n\n"
- fmt: "\n```\nalert(typeof(aditya)); //displays \"object\"\n```\n\nIn the preceding\
    \ example, `aditya` is an instance that was created from the child constructor\
    \ function. Here, `child` is both a function and an object, because functions\
    \ ARE objects in JavaScript. This instance can have its own data/properties and\
    \ functionalities from the child object, which we will discuss in the coming section.\n\
    \nThere exist several ways of creating objects in JavaScript. The most fundamental\
    \ and easy to understand method is using ubiquitous object literal pattern. For\
    \ example:\n\n```javascript\nvar student = {\n    name: “ritesh”,\n    age: “19”,\n\
    \    branch: “cse”\n};\n```\n\nHere, we have created an object `student` with\
    \ `name`, `age` and `branch` as its properties.\n\nThe second method is using\
    \ the constructor pattern. For example:\n\n```javascript\nfunction student (name,\
    \ age, branch) {\nthis.name = name;\nthis.age = age;\nthis.branch = branch;\n\
    } // student () is the constructor function because we use the new keyword below\
    \ to invoke it.\n\nvar rahul = new student(“rahul”, 19 , “cse”) // Rahul is a\
    \ new object that we have created from the student () constructor function.\n\n\
    console.log(rahul.name); // Rahul\nconsole.log(student.branch); // cse\n```\n\n\
    In the methods detailed above, we observe a major difference between the two.\
    \ In the literal pattern, we have already created an object while declaring it.\
    \ In the constructor pattern, we need to explicitly call the constructor along\
    \ with the `new` keyword in order to create an instance of a `student`.\n\nThe\
    \ third and the last method is using the prototype pattern, where we directly\
    \ add each property and method to the object’s prototype as the method’s name\
    \ suggest. For example:\n\n```javascript\nfunction student ()\n{\nstudent.prototype.firstName\
    \ = \"Ritesh\";\nstudent.prototype.lastName = \"Kumar\";\nstudent.prototype.age\
    \ =19;\nstudent.prototype.branch = “cse”;\nstudent.prototype.fullName = function\
    \ () {\nconsole.log (this.firstName + \" \" + this.lastName);\n};\n\nvar ritest\
    \ = new student () // creating instance of student using new keyword\n\nconsole.log(ritesh.fullName());\
    \ // This logs into the console of the browser with the value “Ritesh Kumar”\n\
    ```\n\nYou might be confused with the `prototype` keyword being used in the above\
    \ example. This is the most important part of this method. We define `prototype`\
    \ as an internal object which is used by other objects to inherit properties.\
    \ This allows multiple instances of the same object to share common properties.\
    \ Therefore, the properties which are defined using the prototype object are inherited\
    \ by all of its instances.\n\nNow, among the three methods that are available\
    \ to you for creating objects, “which one is the most suitable?” and “in which\
    \ situation?” needs to be discussed. We will try to find the answer to this question\
    \ in our next section, focused on Encapsulation.\n\n## Why Do We Need Encapsulation?\n\
    \nThe literal method is handy when you want to have only a single copy of a particular\
    \ object, and it is only going to store data. This method is ineffective however,\
    \ when you want to have several instances of the same object with different data\
    \ available to all of them.\n\nWhen we want to create many objects with the same\
    \ properties? We can encapsulate the common properties shared by all of them into\
    \ a function, then use the constructor to create multiple objects. This is where\
    \ we utilize encapsulation.\n\nThe practical implementation in JavaScript uses\
    \ the constructor and prototype method combined. For example:\n\n```javascript\n\
    function student (name, age, branch) {\n    this.name = name;\n    this.age =\
    \ age;\n    this.branch= branch;\n    this.marks = [];\n}\n```\n\nWith the help\
    \ of the code above, we created the constructor function for the `student` object\
    \ using the constructor method. This only contains the data that is associated\
    \ with a `student`. In the following code snippet, we are going to add the functionalities\
    \ that are associated with the `student` using the prototype method.\n\n```javascript\n\
    student.prototype = {\n    showName:function () {\n        return this.name;\n\
    \    },\n    addMarks:function (mark) {\n        this.marks.push(mark);\n    }\n\
    }\n```\n\nHere we end up writing code for defining an object. The next task involves\
    \ creating instances of the object we just created.\n\n```javascript\n// First\
    \ instance of the object\nrishabh = new student(\"rishabh\", 20, “cse”);\nrishabh.addMarks(98);\
    \ // adds 98 to the marks array\nrishabh.showName();  //returns “rishabh”\n\n\
    // Another instance\nmitul = new student(\"Mitul\", 19, “mechanical”);\nmitul.addMarks(100);\
    \ // adds 100 to the marks array\nmitul.showName (); // returns “mitul”\n```\n\
    \nWith the example above, the importance and benefits of having encapsulation\
    \ in your hands might be very clear. We encapsulated all the data and functionalities\
    \ of a `student` into one function, and later created instances of it (`rishabh`\
    \ and `mitul`) which share the same properties that a student does. This reduces\
    \ the whole task of defining each property for similar object instances repeatedly.\n\
    \nThat’s it for encapsulation! The next section will be focused on broadening\
    \ the implementation of objects by using inheritance, so that different objects\
    \ can share or inherit properties from a parent element.\n\n## Inheritance in\
    \ JavaScript\n\nThis feature brings us much closer to the real world. Let us take\
    \ a look at humans, for this example. Human beings inherit some properties from\
    \ the `Hominid` class, which itself inherits some properties from its parent class\
    \ that further goes on to the `Mammal` class. Objects inherit properties from\
    \ its parent’s class. Inheritance comes to be very handy when coding to address\
    \ similar problems. We create an object for the `Mammal` class, which is later\
    \ inherited by the `Hominid` class, and human beings inherit from the `Hominid`’s\
    \ class. While doing so, human beings get the properties of both the `Hominid`’s\
    \ and `Mammal`’s classes. Since humans reproduce like other mammals, this approach\
    \ seems to be completely fine. Moreover, the human beings’ class can have other\
    \ properties added to it which might not be available to other mammals.\n\nSo\
    \ far, we have only discussed the real-life implementation of inheritance. Let’s\
    \ dive into coding and flesh it out.\n\nLet’s make a car object.\n\n```javascript\n\
    var car = {\n    Color: “black”,\n    Seats: “4”\n};\n\n// inheriting from the\
    \ car object\nvar myCar = Object.create (cars); // now myCar inherits the properties\
    \ from car\nconsole.log(myCar.color); // black\n```\n\nWe can also add more properties\
    \ to the instance we created.\n\nNow comes the meat of the inheritance section.\
    \ We use the `inheritPrototype` function for inheriting from the parent class.\n\
    \n```javascript\nfunction inheritPrototype(child, parent) {\n    var parentCopy\
    \ = Object.create(parent.prototype);\n    parentCopy.constructor = child;\n  \
    \  child.prototype = parentCopy;\n}\n```\n\nLet’s understand how this code works.\
    \ Initially, we started off by creating an instance of the parent child (`parentCopy`).\
    \ We store the child instance into the constructor of the `parentCopy`. This is\
    \ done because in the next step, we will be storing the `parentCopy` into the\
    \ child’s prototype. When we do this, we override the previous contents of the\
    \ child’s prototype, and hence lose the actual values. To keep this from happening,\
    \ we created a copy of the child’s constructor. While we store the `parentCopy`\
    \ into child’s constructor, it doesn’t lose its old values.\n\nCreating a new\
    \ object, which will later inherit from our parent object i.e., `car`.\n\n```javascript\n\
    var audi = {\n    name = “audi”\n};\n\ninheritPrototype(audi, car);\n```\n\n`Audi`\
    \ will have the same properties as a car, but it needs to define its own unique\
    \ property, which is `name`.\n\n## Chapter 2: The ‘this’ keyword in JavaScript\n\
    \nIn JavaScript, the keyword `this` behaves differently than when compared to\
    \ other programming languages. The value of `this` is determined by how an object\
    \ is instantiated, or “where the keyword is actually being used”. The `this` keyword\
    \ in simple words returns the current local scope object.\n\nIf you are using\
    \ this on global scope, it will refer to the `window` object. The `window` object\
    \ is the only globally available object in JS.\n"
