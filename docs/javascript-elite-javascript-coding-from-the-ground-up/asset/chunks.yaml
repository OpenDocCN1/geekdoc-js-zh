    # Recursion


    Recursion should be used where there is a branching of loops, or too much nesting
    of loops. Operations such as searching through dynamic structures, traversing
    graphs, etc. can be made easy by using recursion. You should never use recursion
    for simple problems that can easily be solved by loops, as they are much faster
    and don’t use as much memory.


    ## Performance in JavaScript


    Many complex algorithms use recursions. It is a very powerful technique. JavaScript
    compilers stack each function call in recursion. This can be very dangerous, but
    in `ES6` (`ECMAScript 6`), this will no longer be the case. Instead of stacking,
    recursion will lead to immediate execution of code, which will make using recursion
    much safer.


