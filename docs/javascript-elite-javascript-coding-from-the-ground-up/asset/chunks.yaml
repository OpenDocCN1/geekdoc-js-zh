    Why Asynchronous?


    Whenever you do some heavy or time-consuming operation in synchronous mode, the
    rest of the code won’t execute until that code finishes executing. This leads
    to a condition known as I/O blocking. When this happens, the UI, also known as
    the “frontend” of your website or web application, will become non-responsive
    for the time being. This is because the UI and the JavaScript code run in the
    same thread! In cases like these, we use asynchronous methods. That way, the heavy
    task keeps running and it doesn''t cause the user interface of the application
    to be unresponsive.


    Here’s an example usage scenario.


    Let’s imagine that you have a very long loop. Say the loop is:


    for( var i = 0; i < 99999999; i++) {


