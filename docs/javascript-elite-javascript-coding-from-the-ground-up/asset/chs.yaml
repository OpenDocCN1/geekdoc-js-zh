- "# JavaScript：从零开始的高级 JavaScript 编程\n\n\n\n![](img/00004.jpeg)\n\n\n\n\n\n## 引言\n\
  \n感谢下载《JavaScript: 从零开始的精英 JavaScript 编码》！本书是 DIY JavaScript 系列的第四部。之前的书籍有：\n\n\
  - JavaScript: 从零开始的入门级 JavaScript 编码\n- JavaScript: 从零开始的中级 JavaScript 编码\n- JavaScript:\
  \ 从零开始的高级 JavaScript 编码\n\n……并假设用户已经熟悉这些书籍的内容，包括 JavaScript 代码、语法以及从入门到高级的概念。为了获得最佳效果，应按时间顺序阅读这些书籍。本书将涵盖高级\
  \ JavaScript 操作技术，并提供与所解释主题匹配的代码示例。\n\n再次感谢下载本书！在进一步提升 JavaScript 编码知识方面，你有许多选择。感谢选择\
  \ DIY JavaScript 系列作为你的学习工具！\n\n## 第一章：JavaScript 中的面向对象编程\n\n在琳琅满目的编程语言中，选择其中一种是明智的。影响语言选择的因素有很多，从效率到可靠性不一。整个讨论的很大一部分也取决于语言所遵循的范式。\n\
  \n编程范式是一种根据其提供的特征对编程语言进行分类的模型。它是构建语言结构和元素的基本风格。编程语言的风格和能力由其范式定义。一种语言甚至可以实现多种范式。例如，Haskell\
  \ 只使用单一范式来定义其本身，即函数式编程。JavaScript 支持函数式、面向对象和命令式编程风格。不同的编程范式包括：\n\n- 命令式 (Imperative)\n\
  - 面向对象式 (Object-oriented)\n- 逻辑式 (Logic)\n- 符号式 (Symbolic)\n- 声明式 (Declarative)\n\
  - 函数式 (Functional)\n\n为什么我们这么多范式？这个基础问题的答案是因为有很多问题需要解决，而不同的范式在处理特定问题组时效率更高。面向对象范式处理复杂性的良好方法，而通过使用函数范式可以避免并发问题。很容易理解，在大多数情况下，多范式语言会胜过单一范式语言。\n\
  \n### JavaScript 中使用的范式\n\n我们已经知道 JavaScript 实现了多种范式，如函数式、面向对象和命令式。我们将研究 JavaScript\
  \ 的面向对象特性。在完全深入其在语言中的实现之前，让我们先了解它是什么以及它的优势。\n\n### 面向对象编程\n\n面向对象编程是一种编程语言模型，它关注的是对象而不是执行操作，关注的是数据而不是涉及的逻辑。在这样的编程风格中，程序员只关心对象的实现。在这里，对象可以是从人类到恐龙、从砖块到建筑，以及你能想到的任何东西。每个对象都有一组关联的数据，以及可以用于操作它的不同方法。例如，让我们把汽车比作对象。汽车有颜色、尺寸、座椅数量等作为其数据，而移动、停止和启动可以被视为与汽车相关的方法。\n\
  \n程序中实现它时会出现大问题。我们首先识别将要使用的所有对象，以及它们彼此之间的关系；这被称为数据建模。第二步是将对象泛化为对象的类（class），它定义了与其关联的数据以及对象的不同方法/能力。\n\
  \n面向对象编程的概念为我们带来了这些益处：\n\n- 对于每个类，我们都可以定义子类，子类可以从主类继承属性和功能。这被称为继承。现实世界遵循一个继承树，子元素继承父元素的部分或全部属性，再加上它自己特有的属性（这些属性在兄弟元素中可能并不具备）。这有助于缩短开发时间，并提高程序员的效率。\n\
  - 在定义类时，我们只关心类的数据。因此，当类的实例（即对象）运行时，它将无法修改任何不属于它的数据。这个过程被称为数据隐藏，它提供了系统安全性，并也有助于避免意外的数据损坏。\n\
  - 一个类可以反复使用。它不仅可以被它自己的程序重用，也可以被其他程序重用。\n- 程序中发现错误？没问题！你只需要检查抛出错误的类的代码。这有助于简化整个程序的测试、调试和维护。\n\
  \n### JavaScript 中的 OOP\n\n在前面的章节中，我们简要学习了面向对象语言的不同概念。当我们直接关注其在感兴趣的语言（即 JavaScript，它是动态的）中的实现时，我们只关注继承和封装。那么，我们为什么不关心多态呢？JavaScript\
  \ 作为一种动态类型编程语言，使得观察多态的效应变得困难得多，因为它在 C 或 C++ 等静态类型语言中更为明显。在 JavaScript 中讨论方法重载或函数重载没有意义，因为我们在编写代码时没有指定任何数据类型。因此，机器无法区分同一个函数的两个定义。在\
  \ JavaScript 中，许多概念都是通过函数实现的。面向对象编码也不例外。实例是函数的实现。\n\n```javascript\nfunction child(name){\n\
  \    // 此处编写代码\n} // child 是一个构造函数，因为我们将使用 “new” 关键字来调用它。\n```\n\n现在，这看起来类似于 Java\
  \ 等语言，我们使用 new 关键字来创建实例。\n\n```javascript\nvar aditya = new child(\"aditya\"); //\
  \ Aditya 是 child 的一个实例\n```\n\n\n\n\n\n```\nalert(typeof(aditya)); //displays \"\
  object\"\n```\n\n在前面的示例中，`aditya` 是一个从子构造函数创建的实例。在这里，`child` 既是一个函数又一个对象，因为在 JavaScript\
  \ 中函数确实也是对象。这个实例可以从子对象拥有它自己的数据/属性和功能，我们将在接下来的章节中讨论。\n\n在 JavaScript 中有多种创建对象的方法。最基础且易于理解的方法是使用通用的对象字面量模式。例如：\n\
  \n```javascript\nvar student = {\n    name: “ritesh”,\n    age: “19”,\n    branch:\
  \ “cse”\n};\n```\n\n在这里，我们创建了一个名为 `student` 的对象，`name`、`age` 和 `branch` 是它的属性。\n\
  \n第二种方法是使用构造函数模式。例如：\n\n```javascript\nfunction student (name, age, branch) {\n\
  this.name = name;\nthis.age = age;\nthis.branch = branch;\n} // student () 是构造函数，因为我们在下面使用了\
  \ new 关键字来调用它。\n\nvar rahul = new student(“rahul”, 19 , “cse”) // Rahul 是我们从 student\
  \ () 构造函数创建的一个新对象。\n\nconsole.log(rahul.name); // Rahul\nconsole.log(student.branch);\
  \ // cse\n```\n\n在上述详细的方法中，我们观察到两者之间主要区别。在字面量模式中，我们在声明对象的同时已经创建了它。在构造函数模式中，我们需要显式地带有\
  \ `new` 关键字调用构造函数来创建一个 `student` 实例。\n\n第三种也是最后一种方法是使用原型模式，正如方法名所示，我们直接将每个属性和方法添加到对象的原型上。例如：\n\
  \n```javascript\nfunction student ()\n{\nstudent.prototype.firstName = \"Ritesh\"\
  ;\nstudent.prototype.lastName = \"Kumar\";\nstudent.prototype.age =19;\nstudent.prototype.branch\
  \ = “cse”;\nstudent.prototype.fullName = function () {\nconsole.log (this.firstName\
  \ + \" \" + this.lastName);\n};\n\nvar ritest = new student () // 使用 new 关键字创建 student\
  \ 的实例\n\nconsole.log(ritesh.fullName()); // 这将在浏览器控制台中输出值“Ritesh Kumar”\n```\n\n\
  你可能对上面示例中使用的 `prototype` 关键字感到困惑。这是该方法最重要的部分。我们将 `prototype` 定义为一个内部对象，其他对象通过它来继承属性。这允许同一个对象的多个实例共享公共属性。因此，使用原型对象定义的属性会被它的所有实例继承。\n\
  \n现在，在可供你使用的三种创建对象的方法中，需要讨论“哪一种最合适？”以及“在什么情况下使用？”我们将在下一个章节（重点关注封装）中尝试找到这个问题的答案。\n\
  \n## 为什么我们需要封装？\n\n当你只需要某个对象的一个副本且该对象仅存储数据时，字面量方法非常方便。然而，当你想要拥有同一个对象的多个实例，并让它们拥有不同的数据时，这种方法是无效的。\n\
  \n当我们创建许多具有相同属性的对象时？可以将所有对象共享的共同属性封装在一个函数中，然后使用构造函数创建多个对象。这就是我们利用封装的地方。\n\nJavaScript\
  \ 中的实际实现使用了构造函数和原型方法的结合。例如：\n\n```javascript\nfunction student (name, age, branch)\
  \ {\n    this.name = name;\n    this.age = age;\n    this.branch= branch;\n    this.marks\
  \ = [];\n}\n```\n\n借助上面的代码，我们使用构造函数方法创建了 `student` 对象的构造函数。它只包含了与 `student` 关联的数据。在接下来的代码段中，我们将使用原型方法添加与\
  \ `student` 关联的功能。\n\n```javascript\nstudent.prototype = {\n    showName:function\
  \ () {\n        return this.name;\n    },\n    addMarks:function (mark) {\n    \
  \    this.marks.push(mark);\n    }\n}\n```\n\n在这里我们完成了定义对象的代码编写。下一个任务是创建我们刚刚创建的对象实例。\n\
  \n```javascript\n// 对象的第一个实例\nrishabh = new student(\"rishabh\", 20, “cse”);\nrishabh.addMarks(98);\
  \ // 向 marks 数组中添加 98\nrishabh.showName();  //返回“rishabh”\n\n// 另一个实例\nmitul = new\
  \ student(\"Mitul\", 19, “mechanical”);\nmitul.addMarks(100); // 向 marks 数组中添加 100\n\
  mitul.showName (); // 返回“mitul”\n```\n\n通过上面的示例，掌握封装的重要性和益处可能非常清晰了。我们将 `student`\
  \ 的所有数据和功能封装到一个函数中，稍后创建了它的实例（`rishabh` 和 `mitul`），它们共享与学生相同的属性。这减少了重复为相似对象实例定义每个属性的所有工作。\n\
  \n封装就到此为止！下一节将侧重于通过继承来扩展对象的实现，以便不同的对象可以共享或从父元素继承属性。\n\n## JavaScript 中的继承\n\n这一特性使我们更接近现实世界。让我们以人类为例。人类从\
  \ `Hominid` 类中继承了一些属性，而该类本身又从其父类继承了一些属性。人类从 `Hominid` 类中继承了一些属性，而该类本身又从其父类继承了一些属性。人类从\
  \ `Hominid` 类中继承了一些属性。继承在代码中以解决类似问题时变得非常有用。由于人类像其他哺乳动物一样繁殖，这种方法完全可行。此外，人类类可以添加其他属性，这可能对其他人类有用。\n\
  \n目前为止，我们只讨论了继承的现实实现。让我们深入代码并完善它。\n\n让我们创建一个 car 对象。\n\n```javascript\nvar car =\
  \ {\n    Color: “black”,\n    Seats: “4”\n};\n\n// 继承 car 对象\nvar myCar = Object.create\
  \ (cars); // 现在 myCar 继承了 car 的属性\nconsole.log(myCar.color); // black\n```\n\n还可以向创建的实例添加更多属性。现在是继承的核心。我们使用\
  \ `inheritPrototype` 函数继承父类。\n\n```javascript\nfunction inheritPrototype(child,\
  \ parent) {\n    var parentCopy = Object.create(parent.prototype);\n    parentCopy.constructor\
  \ = child;\n    child.prototype = parentCopy;\n}\n```\n\n让我们理解这段代码是如何工作的。最初，我们创建一个父类的实例（`parentCopy`）。我们将子实例存储到\
  \ `parentCopy` 的构造函数中。这样做是因为下一步我们将 `parentCopy` 存储到子类的原型中。当我们这样做时，我们会覆盖子类原型之前的内容，从而丢失实际值。为了防止这种情况发生，我们创建了子构造函数的副本。当我们把\
  \ `parentCopy` 存储到子构造函数时，它不会丢失旧值。\n\n创建一个新对象，它稍后将继承我们的父对象即 `car`。\n\n```javascript\n\
  var audi = {\n    name = “audi”\n};\n\ninheritPrototype(audi, car);\n```\n\n`Audi`\
  \ 将拥有与汽车相同的属性，但它需要定义自己的独特属性，即 `name`。\n\n## 第二章：JavaScript 中的 ‘this’ 关键字\n\n在 JavaScript\
  \ 中，`this` 关键字的行为与与其他编程语言相比不同。`this` 的值取决于对象是如何实例化的，或者说“关键字实际在哪里被使用”。简单来说，`this`\
  \ 关键字返回当前的作用域对象。\n\n如果你在全局作用域中使用它，它将引用 `window` 对象。`window` 对象是 JS 中唯一的全局可用对象。\n\
  \n\n\n\n因此，在全局作用域执行 `console.log(this)` 的结果将返回 `window` 对象。\n\n为了更好地理解 `this`，让我们定义如下一个对象：\n\
  \n```javascript\nvar obj = {\n  someProperty1: “Hi”,\n  someProperty2: function(name)\
  \ {\n    // 在这里 ‘this’ 将作用域到 obj 对象，因为它是当前的局部作用域\n    // 在该作用域中存在 window 对象\n  \
  \  return this.someProperty1 + name;\n  }\n}\n\nvar myObj = obj.someProperty2(“\
  \ John”);\nconsole.log(myObj); // === “Hi John”\n```\n\n在上面的代码中，在 `obj` 的 `someProperty2`\
  \ 属性中，我们使用了 `this` 关键字来访问当前对象的另一个属性 `someProperty1`，因此函数返回了结果为“Hi John”。\n\n如果我们使用\
  \ JavaScript 的箭头函数，结果将不会受到影响。结果将是相同的。\n\n借助 `this` 操作符的帮助，我们可以如下所示编写 JS 中的对象构造函数：\n\
  \n```javascript\nfunction obj(name) {\n  this.name = name;\n  this.someMethod =\
  \ function() {\n    console.log(this.name);\n  }\n}\n\nvar myObj = new obj(“John”);\n\
  myObj.someMethod(); // === John\n```\n\n你也可以在对象的原型链上使用 `this`，如下：\n\n```javascript\n\
  var obj = function() {\n  return this.a + this.b;\n};\n\nvar myObj = Object(obj);\n\
  myObj.a = 5;\nmyObj.b = 6;\nmyObj(); // === 11\n```\n\n与之前一样，我们使用 `this` 关键字来访问当前对象，并实例化它的数据成员和函数。\n\
  \n我想总结说，JavaScript 中的 `this` 关键字是你经常会发现需要它的东西。它会让你的工作变得更简单，并在你的编码风格中提供许多的灵活性。\n\n\
  ## 第 3 章：JSON\n\nJSON 或 JavaScript Object Notation（JavaScript 对象表示法），最初由 Douglas\
  \ Crockford 规范，是最常用的数据交换格式之一。JSON 无非是用于存储和交换数据的简单媒介。这种交换发生在浏览器和服务器之间。\n\n数据的格式只能是文本，任何\
  \ JavaScript 对象都可以转换为 JSON 格式以向服务器发送数据。同样，从服务器接收数据时，任何 JSON 文本都可以转换为 JavaScript\
  \ 对象。\n\nJSON 是一种轻量级格式，人类容易理解，也便于机器解析。它是语言无关的，这意味着它不仅局限于用于 JavaScript，尽管 JSON 使用了\
  \ JavaScript 语法，但由于该格式仅为文本，它可以被任何编程语言读取和使用。它的文件扩展名为 `.json`。由于其易于解析的特性，JSON 广泛优于如\
  \ `XML` 等其他数据传输表示。\n\n## JSON 语法\n\nJSON 语法与 JavaScript 语法相似，细微区别在于键（keys）必须是用双引号\
  \ “ ” 写的字符串，包含以下表示法：\n\n1. 交换的数据应该以名称（Name）和值（Value）成对的形式存在。每个名称都有一个对应的值，可以通过 JavaScript\
  \ 对象通过其名称进行访问。\n   示例：`“name”: “Mark”`\n\n2. 对象被放在大括号 `{ }` 中。每个名称字段后跟着一个冒号 `:`，然后是它的值。每个键值对后面都跟着一个逗号\
  \ `,`，以防用户想要输入另一个键值对。\n   示例：`{ “name”: “Mark”, “age”: “20” }`\n\n3. 这些对象的数组包含在方括号\
  \ `[ ]` 中，数组中的每个对象本身用逗号隔开。\n   示例：`[ { “name”: “Mark”, “age”: “20” }, { “name”:\
  \ “Anthony”, “age”: “40”}]`\n\n## 数据类型\n\nJSON 可以具有以下数据类型的值：\n\n1. **Number（数字）**\
  \ - 在 JSON 中，使用的数字必须是整数或浮点数。\n   示例：`{ “age”: 20 }`\n\n2. **String（字符串）**\n   示例：`{\
  \ “firstName”: “Mark” }`\n\n3. **Boolean（布尔值）**\n   示例：`{ “vegetarian”: true }`\n\
  \n4. **Array（数组）**\n   示例：`{ “children”: [“Henry”, “Emma”, “Joe”] }`\n\n5. **另一个\
  \ JSON 对象**\n   示例：`{ “details”: { “lastName”: “Lucas”, “bankAccount”: “savings”\
  \ } }`\n\n6. **Null（空）**\n   示例：`{ “middleName”: null }`\n\n**注意：** 不要将 JSON 数据类型与\
  \ JavaScript 数据类型混淆。不要使用以下任何数据类型：\n1. 函数\n2. 日期\n3. `undefined`\n\n## JSON 中的对象\n\
  \n可以使用点 `.` 表示法按照如下方式访问 JSON 对象的值：\n\n示例：如果只想只想访问变量 `fullName` 的 `firstName`，可以这样操作：\n\
  \n```javascript\nvar fullName = {\n  “firstName”: “Mark”,\n  “lastName”: “Anthony”\n\
  };\n\nvar firstname = fullName.firstName;\n```\n\n另一种方法是使用方括号 `[ ]` 表示法：\n\n```javascript\n\
  var firstname = fullName[“firstName”];\n```\n\n同样，我们可以通过逐层向下移动名称来访问嵌套的 JSON 对象。\n\
  \n示例：\n```javascript\nvar fullName = {\n  “name”: {\n    “firstName”: “Mark”,\n\
  \    “lastName”: “Anthony”\n  },\n  “age”: 25,\n  “profession”: “Business”\n} //\
  \ 注意：原文此处缺少闭合大括号，已在翻译中补全逻辑\n\nvar firstname = fullName.name.firstName;\n```\n（注：此处根据上下文逻辑修正了示例代码的结构）\n\
  \n值也可以通过点或方括号表示法通过简单等值所需的键来设置：\n\n示例：`fullName.name.firstName = \"New\"` 或 `fullName[\"\
  name\"][\"firstName\"] = \"New\"`\n\n## JSON 中的数组\n\n同样，我们可以通过逐层向下移动名称来访问嵌套的 JSON\
  \ 对象。\n\n示例：\n```javascript\nvar fullName = {\n  “name”: {\n    “firstName”: “Mark”,\n\
  \    “lastName”: “Anthony”\n  },\n  “age”: 25,\n  “profession”: “Business”\n}\n\n\
  var firstname = fullName.name.firstName;\n```\n\n## JSON 方法\n\n从服务器接收到客户端的 JSON\
  \ 数据始终是字符串。由于我们需要 JavaScript 对象来访问键，因此使用 `JSON.parse()` 方法解析 JSON 数据。\n\n示例：`JSON.parse('{\
  \ “children”: { “Henry”, “Emma”, “Joe” } }’`\n\n**注意：** 必须是 JSON 格式以避免语法错误。\n\n\
  同样，从客户端发送到服务器的 JSON 数据必须是字符串。由于我们的数据是 JavaScript 对象，我们需要将其转换为字符串。使用 `JSON.stringify()`\
  \ 方法将 JSON 对象转换为字符串。\n\n示例：`JSON.stringify({ “children”: { “Henry”, “Emma”, “Joe”\
  \ } });`\n\n## 第 4 章：同步与异步 JavaScript\n\n在编程术语下理解异步和同步的概念是一项相当困难的任务。可能会有一个陡峭的学习曲线，但在良好掌握这一概念后，你将能够轻松地理解其他高级概念。JavaScript\
  \ 中的大多数高级概念都基于 JavaScript 中的异步行为。\n\n### 什么是同步和异步？\n\n在编程术语中，同步行为意味着代码按照其编写的顺序执行，而异步意味着代码不一定按照其编写的顺序执行。\n\
  \n让我们通过现实生活场景来理解这一点。\n\n\n\n\n想象一下你正在通过电话订披萨，但披萨店只有一个人能接听。如果你在你拨号时，也有人正在通过电话下单，你就会听到占线音。你必须等待当前的通话结束才能下订单，而在等待期间你不能做任何其他事情！这种场景展示了**同步（synchronous）**行为，即在当前任务完成之前，你无法进入下一个任务。\n\
  \n现在让我们在同一个场景中改变一些条件。假设接听披萨订单的人有了一个自动答录机，当电话忙时它会记录通话，并在完成当前通话后将其报告给接单员。现在，如果你拨号时电话正忙，你只需将订单留在答录机上，然后继续你的其他活动。当接单员收到你的订单后，会回给你电话并完成订单。这种场景详细描述了**异步（asynchronous）**行为，因为你不需要等待另一个通话完成。你可以完成你那部分的交易，并在对方准备好参与时，完成任何必要的细节（预计接收时间、支付方式、地址等）。\n\
  \n还有更简单的例子可以描述这种行为。你的身体可以同时执行多个任务，比如边唱歌边弹吉他。这就是异步行为的一个例子。相反，在打喷嚏时所有其他动作都会停止。这就是同步行为的一个例子，因为你必须等待打喷嚏动作完成后才能恢复或开始其他动作。\n\
  \n同样，在编程中，如果你不需要等待一个操作完成就可以进入另一个任务，那么这个操作就被说是异步的。较早开始并并行运行的操作可能会报告它的进度，就像接单员在收到你的订单后可能会带着更多细节回复你。\n\
  \n让我们来看看同步和异步 JavaScript 的示例代码。\n\n### 同步 (Synchronous)\n\n```javascript\nconsole.log('how');\n\
  console.log('are');\nconsole.log('you');\n```\n\n上述代码的输出将是：\n\nhow\nare\nyou\n\n\
  这很简单！输出正如你预期的的一样。\n\n### 异步 (Asynchronous)\n\n```javascript\nconsole.log('how');\n\
  setImmediate(function() {\nconsole.log('are');\n});\nconsole.log('you');\n```\n\n\
  上述代码的输出将是：\n\nhow\nyou\nare\n\n注意，这里的输出存在差异。这是由于 `setImmediate()` 方法的异步性质。\n\n###\
  \ 为什么要用异步？\n\n无论你在同步模式下执行某些繁重或耗时的操作，其余代码在这些代码执行之前都不会执行。这导致了被称为 **I/O 阻塞（I/O blocking）**的情况。当这种情况发生时，UI（即你网站或\
  \ Web 的“前端”）将暂时变得无响应。这是因为 UI 和 JavaScript 代码运行在同一个线程中！在这种情况下，我们使用异步方法。这样，繁重任务就会继续运行，而不会导致应用程序的用户界面无响应。\n\
  \n这是一个使用场景的示例。\n\n假设你有一个非常长的循环。假设循环是：\n\n```javascript\nfor( var i = 0; i < 99999999;\
  \ i++) {\n// 在这里执行某些任务\n}\n```\n\n当这个循环运行时，其他任何东西都不会运行，Web 应用的前端将变得无响应。为了解决这个问题，我们将使用\
  \ `setImmediate()`。以下是转换后的循环：\n\n```javascript\nfunction longLoop(i) {\n// 在这里执行某些任务\n\
  if( i < 99999999) setImmediate(longLoop, i + 1); // 增加 i 的值并再次调用函数以创建循环\n}\n\nsetImmediate(longLoop,\
  \ 0); // 开始循环\n```\n\n运行上述代码不会导致 UI 变得无响应。循环的每次迭代调用都是异步的，从而允许其他函数的执行。\n\n同步和异步的概念是\
  \ JavaScript 的核心，也是 JavaScript 中几乎所有高级概念的基础。无论是定时器、AJAX 还是任何其他概念，理解这个概念对于你建立后续知识奠基础至关重要。\n\
  \n## 第 5 章：JavaScript 中的 Promises\n\nJavaScript 中的 `Promises` 为管理异步请求提供了替代方案。另一种替代方案是使用回调函数（callbacks）。\n\
  \n你可以将 JavaScript 中的 `promises` 理解为你在现实生活中做出的承诺。例如，如果你的朋友承诺在今天结束前代你完成家庭作业呢？他要么已经为你做完了作业，要么没有完成。他的承诺只有几种固定的结果，对吧？同样，JavaScript\
  \ 中的 `promises` 可以有三种状态：\n\n-   **Pending（待定中）**：这意味着 `Promise` 仍在等待被履行。它可以有任何输出，例如“现在还没到深夜，你不知道朋友是否会完成你的作业。”\n\
  -   **Rejected（已拒绝）**：这意味着你已经得到了承诺的结果，且结果是负面的，比如“你的朋友终究没有帮你做作业。”\n-   **Resolved（已解决）**：这意味着你已经得到了承诺的结果，且结果是正面的，产生了预期的输出。“你的朋友帮你做完作业了！”\n\
  \n一旦承诺变为 Resolved 或 Rejected，就被认为已 **settled（已处理）**。\n\n`Promise` 是 JavaScript 中的一个类。你通过使用关键字\
  \ `new` 来创建该类的新对象，从而创建一个新的 `Promise` 对象。\n\nJavaScript 的 ECMAScript 5 或 ES5 标准（在本书出版时所有主要浏览器中都在使用）原生并不包含\
  \ `Promises` 标准。然而，某些浏览器仍然支持 `Promises`。ES6 原生支持 `Promises`。\n\n### 创建 Promise (Creating\
  \ Promise)\n\n正如前面所述，我们使用 `new` 关键字来创建一个 `Promise` 对象。该对象的构造函数接收一个回调函数。以下是创建和使用\
  \ promise 的语法。\n\n**ES5 语法：**\n\n```javascript\nnew Promise( function(resolve, reject)\
  \ { /* 执行任务 */ }).then(function() { } ).catch(function() { } );\n```\n\n**ES6 语法：**\n\
  \n```javascript\nnew Promise( (resolve, reject) => { /* 执行任务 */ } ).then( () =>\
  \ {} ).catch( () => {} );\n```\n\n作为回调函数参数的两个参数 `resolve` 和 `reject` 用于处理承诺。这两个参数本身都是函数。调用\
  \ `resolve()` 方法会将承诺状态设置为已解决，并调用作为 `then()` 方法参数的函数。调用 `reject()` 方法会将承诺状态设置为已拒绝，并调用作为\
  \ `.catch()` 方法参数的函数。\n\n现在让我们之前的作业示例创建一个 promise：\n\n```javascript\nvar friendPromise\
  \ = new Promise( function(resolve, reject) {\n/* 通常在这里有一个异步任务 */\nif( isHomeworkCompleted()\
  \ ) resolve();\nelse reject();\n});\n```\n\n这里注意以下几点：\n\n- Promise 在创建时就开始执行任务。在上面的示例中，一旦创建\
  \ Promise，它就会调用函数 `isHomeworkCompleted()` 来检查作业是否完成。\n- 一旦承诺处理（一旦在内部使用了 `resolve()`\
  \ 或 `reject()` 方法），再次使用它们将产生任何影响。\n\n### 获取 Promise 结果 (Getting the Promise result)\n\
  \n在承诺处理后，我们可以使用 `` 对象的 `then()` 和 `catch()` 方法获取结果。其语法已在上一节中定义。\n\n现在让我们考虑上一节中编写示例代码并看看如何使用它：\n\
  \n```javascript\nfriendPromise.then( function() {\nconsole.log( 'Promise fullfilled!'\
  \ );\n\n}).catch( function() {\n\nconsole.log( 'Promise rejected :( ' );\n});\n\
  ```\n\n### Promises 是异步的 (Promises are Asynchronous)\n\n获取 promise 结果的过程是异步的。为了理解这一点，请考虑以下示例：\n\
  \n```javascript\nconsole.log('Before');\n\nfriendPromise.then( function() {\n```\n\
  \n\n\n\n```javascript\nconsole.log( 'Promise settled' );\n\n}).catch( function()\
  \ {\n\nconsole.log( 'Promise settled' );\n\n});\n\nconsole.log('After');\n```\n\n\
  上述代码的输出将是：\n\nBefore\nAfter\nPromise settled\n\n如你所见，“After”在控制台屏幕上打印在“Promise settled”之前。在不了解更多情况的情况下，它看起来似乎应该是在它之后打印的。\n\
  \n### 如何让 Promise 在我们想要的时候执行\n\n正如之前解释的那样，promise 一旦被创建就会开始执行任务。然而，我们通常希望 promise\
  \ 代码是预先定义的，并在我们想要的时候再执行。这通过将 promise 封装在一个函数内部，并从该函数返回 promise 对象来实现。\n\n上面的示例将转换为：\n\
  \n```javascript\nvar friendPromise = function() {\n\nreturn new Promise( function(resolve,\
  \ reject) {\n\n/* 通常这里会包含一个异步任务 */\n\nif( isHomeworkCompleted() ) resolve();\n\n\
  else reject();\n\n});\n\n}\n```\n\n现在我们可以像这样使用它：\n\n```javascript\nfriendPromise().then(\
  \ function() {\n\nconsole.log( 'Promise settled' );\n\n}).catch( function() {\n\n\
  console.log( 'Promise settled' );\n\n});\n```\n\n### 将信息从任务传递到 then() 或 catch()\
  \ 方法\n\n我们可以通过将信息作为 `resolve()` 或 `reject()` 函数的参数来实现这一点。传递给 `resolve()` 或 `reject()`\
  \ 方法的参数将分别作为参数传递给作为 `then()` 和 `catch()` 方法参数的函数。\n\n让我们通过示例来探索这个概念：\n\n```javascript\n\
  var promiseSum = function() {\n\nreturn new Promise( function(resolve, reject) {\n\
  \nvar x = 5 + 5;\n\nif( someCondition() ) resolve( x + 5 );\n\nelse reject( x *\
  \ 5 );\n\n});\n\n}\n\npromiseSum().then( function(y) {\n\nconsole.log( y ); // 如果\
  \ promise 成功完成，在控制台屏幕上打印‘15’\n\n}).catch(function(y) {\n\nconsole.log( y ); // 如果\
  \ promise 被拒绝，在控制台屏幕上打印‘50’\n\n});\n```\n\n### 链式多个 promises\n\n我们可以将多个 promise\
  \ 的 `then()` 方法一个一个地链起来，以便一个接一个地执行异步任务。这是因为 `then()` 本身返回一个 promise。\n\n如果我们在 `then()`\
  \ 方法的函数中返回一个值，该值将传递给链中的下一个 `then()` 方法的参数函数（如果存在）。\n\n```javascript\nvar examplePromise\
  \ = function() {\n\nreturn new Promise( function(resolve, reject) {\n\nresolve();\n\
  \n});\n\n}\n\nexamplePromise().then( function() {\n\nreturn 5 + 7;\n\n}).then(function(\
  \ y ) { // 链式调用\n\nconsole.log( y ); // 在控制台屏幕上打印‘12’\n\nreturn y + 15;\n\n}).then(function(\
  \ y ) { // 链式调用\n\nconsole.log( y ); // 在控制台屏幕上打印‘27’\n\n});\n```\n\n如果我们在 `then()`\
  \ 方法的函数中返回一个 promise，则链中的下一个 `then()` 方法将作为之前返回的 promise 对象的 `then()` 方法。\n\n```javascript\n\
  var examplePromise = function() {\n\nreturn new Promise( function(resolve, reject)\
  \ {\n\nresolve(7);\n\n});\n\n}\n\nvar someOtherPromise = function(x) {\n\nreturn\
  \ new Promise( function(resolve, reject) {\n\nresolve( x * 10 );\n\n});\n\n}\n\n\
  examplePromise().then( function(x) {\n\nconsole.log( x ); // 在控制台屏幕上打印‘7’\n\nreturn\
  \ someOtherPromise(x); // 返回一个新的 promise\n\n}).then(function( y ) { // 链式调用\n\n\
  console.log( y ); // 在控制台屏幕上打印‘70’\n\nreturn y + 15;\n\n}).then(function( y ) {\
  \ // 链式调用\n\nconsole.log( y ); // 在控制台屏幕上打印‘85’\n\n});\n```\n\n### Promise.all()\
  \ 方法\n\n通用语法：\n\n`Promise.all( [ [ Promise1 [, Promise2 [, Promise3 [, Promise4\
  \ … ] ] ] ] ] );`\n\n当作为参数传递的所有 promise 都已就绪（settled），或者其中一个被拒绝时，该方法将返回单个 promise。结果\
  \ promise 的 `then()` 方法的函数参数是一个数组，包含了所有 promise 的 `resolve` 方法传递的值，并按照它们解析的顺序排列。\n\
  \n让我们来看一个示例：\n\n```javascript\nvar promise1 = new Promise( function(resolve, reject)\
  \ { resolve(9); });\n\nvar promise2 = new Promise( function(resolve, reject) { resolve(8);\
  \ });\n\nvar promise3 = new Promise( function(resolve, reject) { resolve(7); });\n\
  \nvar promise4 = new Promise( function(resolve, reject) { resolve(6); });\n\nvar\
  \ result = Promise.all( [ promise1, promise2, promise3, promise4] );\n\nresult.then(\
  \ function(x) {\n\nconsole.log( x );\n\n});\n```\n\n上述代码的输出将是：\n\n`[9, 8, 7, 6]`\n\
  \n如果栈中的某个 promise 被拒绝，则使用该 promise 的 `catch()` 方法。作为 `.catch()` 参数传递的函数包含单个值，即栈中被拒绝的\
  \ promise 的值。\n\n现在让我们看看当修改上面的示例产生一个被拒绝的 promise 时会发生什么：\n\n```javascript\nvar promise1\
  \ = new Promise( function(resolve, reject) { resolve(9); });\n\nvar promise2 = new\
  \ Promise( function(resolve, reject) { resolve(8); });\n\nvar promise3 = new Promise(\
  \ function(resolve, reject) {\n\nreject(7); // 拒绝\n\n});\n\nvar promise4 = new Promise(\
  \ function(resolve, reject) { resolve(6); });\n\nvar result = Promise.all( [ promise1,\
  \ promise2, promise3, promise4] );\n\nresult.then( function(x) {\n\nconsole.log(\
  \ x );\n\n}).catch(function(y) {\n\nconsole.log( y );\n\n});\n```\n\n### Promise.race()\
  \ 方法\n\n通用语法：\n\n`Promise.race( [ Promise1 [, Promise2 [, Promise3 [, Promise4 …\
  \ ] ] ] );`\n\n## 第六章：AJAX\n\n你可能开发过许多包含图像、视频等的网页。它们可能都缺少共同的功能。它们都是静态网页，必须刷新才能显示新内容。在编写代码时，总有另一种更好的方法来执行任何任务。这就是\
  \ `AJAX` 出现的地方。AJAX 代表异步 JavaScript 和 XML。\n\nAJAX 是一项重要的前端技术，在你每天访问的多个网站开发中起着至关重要的作用。这项技术帮助你更新页面的特定部分，而无需刷新整个页面。这还减少了主机和服务器之间交换的数据量。\n\
  \nAJAX 帮助 JavaScript 与 Web 服务器通信。现在你的网站不再是静态的，而是完全动态的。Gmail、Facebook、Twitter 和 YouTube\
  \ 只是在前端代码中大量使用 AJAX 的几个网站。\n\n### 理解 AJAX 调用过程\n\n这涉及到多个步骤来完成任务。我们将在本节列出这些步骤，并在下一节中探索这些概念。\n\
  \n- 触发事件：发生在你点击按钮、提交表单或任何触发响应的操作时。\n- AJAX 调用触发并使用 XML 向 Web 服务器发送请求。\n- 服务器端脚本（PHP、ASP\
  \ 等）获取输入并进行相应的处理。如果需要，它还会访问数据库。\n- 脚本随后将处理后的输出结果通过 XML 返回给向服务器发出特定请求的客户端页面。\n- JavaScript\
  \ 回调函数接收数据，进行相应的处理，然后更新网页的相关部分。\n\n### 步骤 1- 发起 HTTP 请求\n\n\n\n\n\n为了发送 HTTP 请求，我们需要一个能够处理请求所需功能的对象。由于我们已经知道\
  \ `JavaScript` 支持面向对象编程（OOPS），创建一个对象对我们来说并不是一项挑战性任务。我们需要处理的是不同浏览器支持的各种对象类型。微软的 `Internet\
  \ Explorer` 支持 `ActiveX` 对象。其他浏览器如 `Chrome`、`Mozilla` 等支持 `XMLHttpRequest` 对象。同时，微软在其后的浏览器中也实现了\
  \ `XMLHttpRequest` 对象，但为了提高兼容性，我们也将考虑 `ActiveX` 对象。\n\n```javascript\n//支持 XMLHttpRequest\
  \ 对象的浏览器\nif (window.XMLHttpRequest) {\n    requestObject = new XMLHttpRequest();\n\
  //支持 ActiveX 对象的浏览器\n} else if (window.ActiveXObject) {\n    requestObject = new\
  \ ActiveXObject(\"Microsoft.XMLHTTP\");\n}\n```\n\n正如我们在上一个节中提到的，服务器在处理输入后会返回响应。我们需要定义一个用于处理该响应的函数。\n\
  \n我们创建的对象有一个名为 `onreadystatechange` 的属性，它负责处理服务器返回的响应。\n\n`requestObject.onreadystatechange\
  \ = functionName;`\n\n你可能会注意到我们在 `functionName` 后面没有加括号。这是因为我们只是在赋值一个函数的引用。\n\n\
  你也可以这样定义函数：\n\n```javascript\nrequestObject.onreadystatechange = function(){\n \
  \   //处理响应的函数体\n};\n```\n\n现在我们已经准备好发送请求了。这可以通过调用我们创建对象的 `open()` 和 `send()` 方法来实现。\n\
  \n```javascript\nrequestObject.open('GET’, ‘http://www/websiteExample.com/file-name’,\
  \ true);\nrequestObject.send();\n```\n\n### 让我们讨论一下 `open` 方法的参数\n\n*   这被称为 HTTP\
  \ 请求方法。还可以传递其他几种方法，如 `POST`、`HEAD`、`DELETE` 等。这些方法因服务器而异，因为并非所有服务器都支持定义的每种方法。根据标准，方法应始终保持大写。否则，某些浏览器可能不支持你的请求。\n\
  *   第二个参数是你正在发送请求的 URL。\n*   第三个参数用于确定请求是否为异步请求，它是可选的。默认值为“true”，这意味着脚本将继续执行，允许用户在请求处理期间使用网页。相应地，“false”会停止脚本并等待服务器发送响应。\n\
  \n### 第 2 步 - 处理服务器的响应\n\n在第一步中，我们定义了一个处理服务器发送响应的函数。在这一步中，我们将详细学习它的功能。\n\n函数需要执行的第一件事是检查响应的状态。定义了五种响应状态，它们是：\n\
  \n| 值 | 状态 | 描述 |\n| :--- | :--- | :--- |\n| 0 | UNSENT | 请求客户端已创建，但尚未调用 `open`\
  \ 方法 |\n| 1 | OPENED | `open` 方法已被调用 |\n| 2 | HEADERS_RECEIVED | `send` 方法已被调用 |\n\
  | 3 | LOADING | 正在加载数据 |\n| 4 | DONE | 请求完成 |\n\n从表中可以推出值 4 是成功状态。我们需要检查返回的响应是否成功。换句话说，我们需要检查其状态值是否为\
  \ 4。\n\n这可以通过将状态值与 `XMLHttpRequest.DONE`（其值为 4）进行比较来实现。\n\n```javascript\nif (requestObject.readyState\
  \ === XMLHttpRequest.DONE) {\n    // 请求已成功完成，可以进行进一步处理\n} else {\n    // 尚未就绪\n\
  }\n```\n\n一旦完成了上述步骤，我们的下一步是检查响应码。与响应状态类似，服务器可以发送几种响应码。响应码 200 表示这是一次成功的 AJAX 调用。我们需要检查代码是否为\
  \ 200 以继续后续。\n\n```javascript\nif (requestObject.status === 200) {\n    // 成功\n\
  } else {\n    // 请求失败\n    // 404 (未找到)\n    // 500 (内部服务器错误)\n    // 204 (无内容)\n\
  \    // 等此类推。\n}\n```\n\n在检查 AJAX 请求是否成功后，你可以根据需要对返回的数据进行任何操作。让我们来看看它的一些用法：\n\n\
  *   **登录表单**：你可能观察到某些网站会弹出一个小的登录窗口，并在登录后通知你已登录，而在此过程中页面保持不变。\n*   **自动补全表单**：这种用法最常见的例子是\
  \ Google。当你向搜索框中输入内容时，它会为你建议你可能正在寻找的词或一组词。这是使用 AJAX 实现的。\n*   **表单提交与验证**：如今几乎所有的网站都使用\
  \ AJAX 实时验证表单。\n*   **聊天室和即时消息**：这最好的例子是 Facebook。在聊天时，新消息会出来而无需重新加载整个页面。这就是 AJAX\
  \ 的魔力。\n*   **外部组件**：Google AdSense 是此的一个流行例子。它根据你所在的网站向你显示内容并进行相应更改，而无需刷新整个页面。\n\
  \n## 第 7 章：JavaScript 中的闭包和回调\n\n本章将涉及 JavaScript 的两个非常基础的概念：闭包（closures）和回调（callbacks）。它们允许我们使代码更加简洁、干练且富有创意。你将在开发中反复遇到这些概念。\n\
  \n### JavaScript 中的闭包\n\n闭包在最基础的形式下，是指能够访问作用域之外变量的内部函数。闭包的概念需要对嵌套函数有合法的理解。\n\n嵌套函数是“包含函数的函数”。让我们来看一下：\n\
  \n```javascript\n//函数 1 是外部函数\nfunction outer(){ // 定义函数 1\n    //函数 2 是内部函数\n \
  \   function inner(){ // 定义函数 2\n    }\n}\n\n```\n\n在上面的示例中，函数 2 (`inner()`) 位于函数\
  \ 1 (`outer()`) 内部，因此被称为嵌套函数。同样，我们可以在外部函数内部有多个一个嵌套函数。\n\n```javascript\n//函数 1 是外部函数\n\
  function outer(){ // 定义函数 1\n    //函数 1 是内部函数\n    function inner1(){ // 定义函数 1\n\
  \    }\n    //函数 2 是内部函数\n    function inner2(){ // 定义函数 2\n    }\n    .\n    //函数\
  \ N 是内部函数\n    function innerN(){ // 定义函数 N\n    }\n}\n```\n\n内部函数对外部函数定义的变量或参数进行求值或计算的能力就是闭包。让我们来看一个非常基本的\
  \ JavaScript 代码示例。\n\n```javascript\n//示例 1\n//定义变量 a = 5\nvar a = 5;\n//定义函数 add，将\
  \ 5 加到 a 并返回值\nvar add = function(val){\na = a + val;// 将 val 加到 a\nreturn a;//\
  \ 返回 a\n}\nvar result = add(5); // 将使 result 等于 10\n```\n\n在上面的代码中，函数 `add()` 从其外部作用域获取变量\
  \ `a` 的值，并将其加 5 后返回结果。因此，我们的输出将显示 10。这就是闭包的最基本用法。感到惊讶吗？到目前为止，你可能已经多次使用了它。\n\n闭包非常流行，因为内部函数能够从其作用域之外检索变量、修改其值并返回结果。闭包可以访问以下变量：\n\
  \n*   作用域内部的变量，即函数体内部定义的变量\n*   外部函数的变量，即包含函数的变量\n*   全局变量\n\n让我们进入一个更复杂的场景：\n\n\
  ```javascript\n//示例 2\n//定义接收一个参数的函数 addTo\nvar addTo = function(param_outer){\n\
  //定义一个值为 10 的变量 sample\nvar sample = 10;\n//定义接收另一个参数的函数 add\nvar add = function(){\n\
  return sample + param_outer;\n}\n//返回内部函数\nreturn add;\n}\n```\n\n\n\n\n在这里，我们有一个嵌套函数\
  \ `add()`，它可以接收来自外部函数 `addTo()` 的参数。当用户带有某些参数调用 `addTo()` 时，他将获得该内部函数作为返回值，该函数反过来将执行加法并返回值。\n\
  \n```javascript\nvar test = addTo(10);\n```\n\n在内部，`param_outer` 将等于 10，而 `add`\
  \ 将取 `param_outer` 和 `sample` 的加值，并结果为 20。\n\n```javascript\nvar add = 20 ;\n```\n\
  \n当 `addTo()` 调用返回 `add` 时，`test` 的值将等于 `add` 的值，即 20。\n\n让我们来看一个更复杂的例子：\n\n```javascript\n\
  //Example 3\n\n//定义一个接收参数的函数 addTo()\n\nvar addTo = function(param_outer){\n\n//定义接收另一个参数的函数\
  \ add\n\nvar add = function(param_inner){\n\nreturn param_inner + param_outer;\n\
  \n}\n\n//返回内部函数\n\nreturn add;\n}\n\nvar test = addTo(10); //value 将不是 20\n```\n\
  \n在这里，`test` 将取内部函数的值并本身成为一个函数，它将保留一个由我们设置的变量 `param_outer`，等于 10。\n\n所以，`test`\
  \ 在内部看起来像这样：\n\n```javascript\n//这仅仅是其内部形式的表示\n\nvar test = function(param_inner){\n\
  \nreturn param_inner + 10;\n\n}\n```\n\n如果我们想给任何数字加 10，我们可以简单地写：\n\n```javascript\n\
  var x =10;\n\nvar y = test(x);\n```\n\n这将使得 `y` 的值等于 20，或者说 10 + 10。\n\n一个很好的用例是我们想要给某些数字加上常数时。我们可以利用这种方法来实现闭包。\n\
  \n示例：\n\n```javascript\nvar addThree = addTo(3);\n\nvar a = addThree(10);//a 将为\
  \ 3 + 10 = 13   \n\nvar a = addThree(20);//a 将为 3 + 20 = 23   \n\nvar a = addThree(30);//a\
  \ 将为 3 + 30 = 33\n```\n\n### 闭包的特性\n\n- 内部函数在执行后仍然可以访问外部函数的变量，正如我们在第三个示例中看到的。我们在调用内部函数之前调用了外部函数，即使在返回值之后，我们仍然可以在内部函数内部使用外部函数的参数，因为它们被保留了。\n\
  - 闭包存储的是对外部函数变量的引用而非实际值，如果需要，可以进行修改（参见示例 4）。\n- 闭包提供了一种处理某些数据的安全方法，因为我们可以保存变量的引用并防止意外更改。\n\
  \n```javascript\n//Example 4\n\n//定义变量 a = 5\n\nvar a = 5;\n\n//定义一个向 a 加 5 并返回值的函数\
  \ add\n\nvar add = function(val){\n\na = a + val;//将 val 加到 a\n\nreturn a;//返回 a\n\
  }\n\na = 10; //更新 a 的值\n\nvar result = add(5); //将使 result 等于 15 而不是 10，因为在调用闭包之前\
  \ a 的值已更新，所以保存的引用被新引用更新了\n```\n\n闭包是强大的，但需要小心，因为更新的引用可能会让你的代码充满错误。始终确保仔细地使用这种能力。\n\
  \n**注意：** 闭包是函数或内部函数，它们保留了从全局或外部作用域引用的数据。\n\n### JavaScript 中的回调函数\n\nJavaScript\
  \ 函数是一等对象。“一等对象”意味着它们可以在函数体中像其他对象一样使用。像变量一样，我们可以保存它们的引用，将它们作为参数传递，声明嵌套函数（参见前面的章节），并可以像我们之前看到的，作为函数的返回值返回。\n\
  \n函数可以作为参数传递给另一个函数的能力使得 JavaScript 函数变得特殊。被传递的函数可以在稍后的阶段执行，或者作为函数返回，由其他函数稍后执行。这就是构成的\
  \ JavaScript 回调（Callbacks）。\n\n回调是指作为参数传递给另一个函数的函数，并在包含该函数的体内执行执行。由于此类能力的应用场景有限，它们可以被称为回调模式。\n\
  \n```javascript\n//定义一个回调函数 sum()\n\nvar sum = function ( num1 , num2 ){\n\nreturn\
  \ num1 + num2;\n\n}\n\n//定义一个使用 sum() 作为参数的函数\n\nvar calling_func = function ( a\
  \ , b , callback ){\n\nreturn callback ( a , b //带有参数调用回调函数\n\n}\n\nvar sample =\
  \ calling_func( 5 , 5 , sum);//new 将被赋值为 10\n```\n\n让我们遍历上面的代码。首先，我们声明了一个简单的函数，相两个值并返回结果。接下来，我们定义了一个接收两个参数以及第三个参数“callback”的函数。回调本质上是一个变量，用于存储我们将传递的函数名并相应地执行它。它可以命名为任何名称。为了方便理解，我将其命名为\
  \ `callback`。\n\n需要注意的是，当我们把函数作为变量传递时，我们只发送回调函数的定义名称（例如 `sum`），而不是带括号的函数调用。该函数只有在包含它的函数体内被调用时才会被执行。\n\
  \n正如我们看到的，回调函数不会被立即调用，而是以引用的形式保留，并且只有在调用函数指定时才被调用，这使得它们成为我们在上一节介绍的闭包。\n\n回调函数不仅可以接受现有函数作为参数，还可以在参数中定义全新的函数。\n\
  \n```javascript\n//定义一个回调函数 sum()\n\nvar sum = function ( num1 , num2 ){\n\nreturn\
  \ num1 + num2;\n\n}\n\n//定义一个使用 sum() 作为参数的函数\n\nvar calling_func = function ( a\
  \ , b , callback ){\n\nreturn callback ( a , b //带有参数调用回调函数\n\n}\n\nvar sample =\
  \ calling_func( 5 , 5 , sum);//new 将被赋值为 10\n```\n\n\n\n\n在深入研究 `apply()`、`call()`\
  \ 和 `bind()` 方法的细节之前，我们需要了解 JavaScript 中的关键字 `this`。\n\n### 从全局上下文中角度\n\n`this`\
  \ 关键字指向任何方法之外的全局对象。在接接的示例中，我们将看到 `this` 关键字在全局上下文中的作用范围。我们将在浏览器中使用 `console.log`\
  \ 输出 `this` 关键字。\n\n```\nconsole.log(this);\n```\n\n控制台的输出结果为“window”，这本质上就是全局对象。这个结果意味着：\n\
  \n```javascript\nconsole.log(this === window); // is true\n```\n\n在上面的示例中，我们进入了\
  \ `console.log(this)`，得到了 `window` 对象。\n\n在这个示例中，我们将使用严格模式并检查 `this` 关键字的值。\n\n\
  ```javascript\nfunction abc(){\n  'use strict'; // 严格模式\n  return this;\n}\n\nconsole.log(abc());\
  \ // undefined\n```\n\n这一次，`this` 关键字的值为 `undefined`，因为在函数 `abc()` 内部没有定义它。\n\n\
  ### 从函数上下文中角度\n\n从函数上下文中处理 `this` 关键字，我们有 `call()`、`apply()` 和 `bind()` 这三个方法。让我们详细讨论一下这些方法。\n\
  \n#### apply 方法\n\n`apply()` 方法通过 `this` 关键字的值来调用函数，并以数组（或类数组）的形式提供参数。\n\n**语法：**\n\
  \n`apply()` 方法具有以下语法：\n\n```\nfunctionName.apply(thisArgument, argsArray[])\n```\n\
  \n#### 参数\n\n让我们来看看传递给 `apply()` 方法的参数。\n\n- `thisArgument`：为调用 `functionName` 提供的\
  \ `this` 关键字的值。\n  注意：在非严格模式下工作时，`this` 关键字的值可能与函数执行时看到的原始值不符。原始类型值和全局对象将被替换为 `undefined`\
  \ 和 `null`。\n- `argsArray[]`：类数组对象的参数，用于指定调用 `functionName` 时使用的参数；如果不需要向方法提供任何参数，则传入\
  \ `undefined` 或 `null`。\n\n**示例：**\n\n在接下来的示例中，我们将查看 `apply()` 方法的基本功能。\n\n```javascript\n\
  var student1 = {firstName: 'Abhishek', lastName: 'Kumar'};\nvar student2 = {firstName:\
  \ 'Ashok', lastName: 'Mehta'};\n\nfunction text(hello) {\n    console.log(hello\
  \ + ' ' + this.firstName + ' ' + this.lastName + ' ? ');\n}\n\ntext.apply(student1,\
  \ ['How are you']); // How are you Abhishek Kumar ?\ntext.apply(student2, ['How\
  \ are you']); // How are you Ashok Mehta ?\n```\n\n#### call 方法\n\n`call()` 方法通过\
  \ `this` 关键字和单个参数来调用一个特定的函数。\n\n**语法：**\n\n`call()` 方法具有以下语法：\n\n```\nfunctionName.call\
  \ (thisArgument, argument1, argument2, ....)\n```\n\n#### 参数\n\n让我们来看看传递给 `apply()`\
  \ 方法（注：此处原文误应为 call）的参数。\n\n- `thisArgument`：为调用 `functionName` 提供的 `this` 关键字的值。\n\
  \  注意：与 `apply()` 方法一样，在非严格模式下工作时，`this` 关键字的值可能与函数执行时看到的原始值不符。原始类型值和全局对象再次被替换为\
  \ `undefined` 和 `null`。\n- `Argument`：...\n\n**示例：**\n\n```javascript\nvar student1\
  \ = {firstName: 'Abhishek', lastName: 'Kumar'};\nvar student2 = {firstName: 'Ashok',\
  \ lastName: 'Mehta'};\n\nfunction text(hello) {\n    console.log(hello + ' ' + this.firstName\
  \ + ' ' + this.lastName + ' ? ');\n}\n\ntext.call(student1, 'How are you'); // How\
  \ are you Abhishek Kumar ?\ntext.call(student2, 'How are you'); // How are you Ashok\
  \ Mehta ?\n```\n\n#### bind 方法\n\n`bind()` 方法创建一个新函数，允许你显式设置 `this` 关键字。\n\n**语法：**\n\
  \n```\nfunctionName.bind(thisArgument, argument1, argument2, ...)\n```\n\n**参数**\n\
  \n- `thisArgument`：为调用 `functionName` 提供的 `this` 关键字的值。\n- `argument1, argument2,\
  \ ...`：在调用函数时将传递给函数的参数。\n\n**示例：**\n\n```javascript\nvar student1 = {firstName:\
  \ 'Abhishek', lastName: 'Kumar'};\nvar student2 = {firstName: 'Ashok', lastName:\
  \ 'Mehta'};\n\nfunction text(hello) {\n    console.log(hello + ' ' + this.firstName\
  \ + ' ' + this.lastName + ' ? ');\n}\n\nvar bound1 = text.bind(student1);\nbound1('How\
  \ are you'); // How are you Abhishek Kumar ?\n\nvar bound2 = text.bind(student2);\n\
  bound2('How are you'); // How are you Ashok Mehta ?\n```\n\n---\n\n## 第 9 章：JavaScript\
  \ 中的集合 (Collections)\n\n在 JavaScript 中，集合（collection）指的是数据的分组。具体来说，它指的是将数据整合到结构中，使得我们可以通过索引访问每个值。集合可以有许多形式，如对象、数组、map、set。\n\
  \n在本章中，我们将专注于对象和数组等数据结构以探索这一概念。我们将学习如何创建对象/数组、如何填充这些数组，以及遍历数组的方法。我们还将涵盖各种数组方法，如\
  \ `push`、`pop`、`sort`、`concat`、`indexOf` 等。此外，我们将讨论多维数组以及一维数组。\n\n数组是一种包含有序值的数据结构，可以通过其名称或索引进行引用。在\
  \ JavaScript 中，我们不需要在声明时为数组定义特定的数据类型，这与 C、C++ 或 Java 不同。相反，我们可以使用预定义的 `Array` 对象及其各种方法。可以通过以下任何一种方式创建数组：\n\
  \n```javascript\nvar fruitsArray = new Array(apple, mango, banana, orange);\nvar\
  \ fruitsArray = Array(apple, mango, banana, orange);\nvar fruitsArray = [apple,\
  \ mango, banana, orange];\n```\n\n通常，第三种实现数组的方式是最常用的（方括号表示法），被称为“数组字面量”（Array Literal）或“数组初始化器”（Array\
  \ Initializer）。\n\n请记住，在方括号表示法 `[ ]` 中声明数组时传递单个数值表示该数组的值，而在 `Array` 函数表示法 `()` 中传递单个数值则表示该数组的长度，并据此分配相应数量的空位置。\n\
  \n```javascript\nvar arr = [10]; // 将创建一个名为 arr 值为 10 的数组\n```\n\n\n\n\n相反，`var\
  \ arr = Array(10);` 将创建一个名为 `arr` 的数组，它没有元素，但长度被设置为 10。\n\n### 填充数组\n\n填充数组简单意味着在不同的索引处为数组赋值。默认情况下，单个值被填充在数组的第\
  \ 0 个索引处，如下：\n\n```javascript\narr[0] = ‘0th value’;\n```\n\n我们也可以创建数组时对其进行填充，如下：\n\
  \n```javascript\nvar fruitsArray = [apple, mango, banana, orange];\n```\n\n然后通过索引访问每个元素，例如：\n\
  \n`console.log(fruitsArray[0]);` 将带我们得到结果 ‘Apple’。\n\n但通常，我们不会手动遍历每个索引。相反，我们可以使用循环来实现，循环会自动遍历每个索引，并据此访问数组的每个值。\n\
  \n例如（例：`var fruitsArray = [apple, mango, banana, orange];`\n\n```javascript\nfor(i\
  \ = 0; i < fruitsArray.length; i++)\n{\n  console.log(fruitsArray[i]);\n}\n```\n\
  \n上述代码将输出：\n\napple\nmango\nbanana\norange\n\n在这里，`.length` 是一个预定义的数组方法，用于确定数组的长度。它对于遍历数组非常有益。也可以通过\
  \ `forEach` 循环代替 `For` 循环获得上述输出，如下：\n\n例如（例：`fruitsArray.forEach(function(fruit){\
  \  console.log(fruit);  });`）\n\n### 有用的方法\n\n我们已经讨论了预定义的 `Array` 方法之一，即 `.length`\
  \ 方法。还有许多其他方法。这些方法在 `Array` 对象上的定义如下：\n\n- `push()`：此方法用于向数组中添加元素。所有元素都会被添加到数组的末尾。\n\
  例如（例：`var fruitsArray = [apple, mango, banana, orange];`\n```javascript\nfruitsArray.push(‘litchi’);\n\
  ```\n现在，结果 `fruitsArray` 将是 `[apple, mango, banana, orange, litchi]`\n\n- `pop()`：此方法用于从数组中删除最后一个元素，并返回被删除的元素。\n\
  例如（例：`var fruitsArray = [apple, mango, banana, orange];`\n```javascript\nvar removedFruit\
  \ = fruitsArray.pop();\n```\n现在，结果 `fruitsArray` 将是 `[apple, mango, banana]`，且 `removedFruit`\
  \ = `orange`。\n\n- `concat()`：此方法用于将一个数组与另一个数组合并成新数组。\n例如（例：`var fruitsArray = [apple,\
  \ mango, banana, orange];`\n`var carsArray = [honda, suzuki, toyota];`\n```javascript\n\
  var fruitsAndCars = fruitsArray.concat(carsArray);\n```\n现在，结果 `fruitsAndCars` 将是\
  \ `[apple, mango, banana, orange, honda, suzuki, toyota];`\n\n- `sort()`：此方法用于升序排序数组。\n\
  例如（例：`var fruitsArray = [apple, mango, banana, orange];`\n```javascript\nfruitsArray.sort();\n\
  ```\n现在，结果 `fruitsArray` 将是 `[apple, banana, mango, orange]`\n\n- `reverse()`：此方法用于反转数组元素的顺序，即第一个元素变成最后一个元素，最后一个元素变成第一个元素。\n\
  例如（例：`var fruitsArray = [apple, mango, banana, orange];`\n```javascript\nfruitsArray.reverse();\n\
  ```\n现在，结果 `fruitsArray` 将是 `[orange, banana, mango, apple]`\n\n- `indexOf(reqdElement,\
  \ [fromIndex])`：此方法用于搜索数组中特定元素的索引。\n例如（例：`var fruitsArray = [apple, mango, banana,\
  \ orange];`\n`fruitsArray.indexOf(‘mango’);` 将得到结果 1。\n\n如果数组中有多个同名的元素，我们还可以作为可选参数指定我们想要从哪个索引开始查找所需的元素。\n\
  例如（例：`var fruitsArray = [apple, mango, banana, orange, mango];`\n`fruitsArray.indexOf(‘mango’,\
  \ 2);` 将得到结果 4。\n\n### 多维数组\n\n多维数组可以通过将一个数组嵌套在另一个数组中的方式创建，并为一个维度的每个元素填充另一个维度的每个元素。多维数组可以如下所示创建并填充：\n\
  \n例如（例）：\n```javascript\nvar arr = new Array(5);\nfor (i = 0; i < 5; i++) {\n  arr[i]\
  \ = new Array(5);\n  for (j = 0; j < 5; j++) {\n    a[i][j] = i + j;\n  }\n}\n```\n\
