  \n## 第 10 章：在 JavaScript 中使用 Canvas\n\nHTML 中的 `canvas` 元素负责显示许多图形元素，如绘制、动画、交互等。\n\
  \n一个简单的 canvas 元素如下：\n\n```html\n<canvas id=\"idCanvas\" width=\"300\" height=\"\
  300\"></canvas>\n```\n\n起初，它看起来像 <img> 元素，缺少 `src` 和 `alt` 属性。`canvas` 元素的默认高度和宽度分别为\
  \ 300px 和 150px。\n\n### JavaScript 在 canvas 中的作用\n\n我们在刚才的 HTML 部分已经预览了 JavaScript\
  \ 与 canvas 的基本用法，即使用 DOM 属性选择 canvas。\n\n```javascript\nvar canvas = document.getElementById(\"\
  idCanvas\");\n```\n\n现在我们将讨论 JavaScript 在 canvas 实际用法。最初，canvas 是完全空白的。要在 canvas\
  \ 上绘制内容，需要 JavaScript 通过 `getContext()` 方法访问渲染上下文。\n\n该方法有一个参数，用于定义上下文类型。\n\n例如（例：`getContext(\"\
  2d\")`\n\n要在 JavaScript 中引入此方法，我们首先需要选择 canvas 并存储在变量中，就像之前那样。其次，我们需要使用同一个变量连接 `getContext`\
  \ 方法。最后，我们将其存储在另一个变量中（通常命名为 `ctx`），我们将在项目的剩余部分用它操作 canvas 元素。\n\n```javascript\n\
  var canvas = document.getElementById(\"idCanvas\");\nvar ctx = canvas.getContext(\"\
  2d\");\n```\n\n注意，`getContext` 方法是由我们创建的存储 canvas 的变量（`canvas`）连接的。现在上下文已经创建，我们就可以通过变量\
  \ `ctx` 轻松地为画布 设置不同的值。\n\n例如：\n1. `ctx.fillStyle=\"blue\";`\n2. `ctx.fillRect(8,\
  \ 8, 40, 40);`\n\n上述代码将在第 2 行指定的坐标处绘制矩形，并如第 1 行所示提供蓝色。\n\n\n\n\n\n### 绘制矩形\n\n有三种方法绘制矩形：\n\
  \n- `fillRect(A, B, width, height)`：绘制一个填充的矩形。\n- `strokeRect(A, B, width, height)`：绘制一个矩形的轮廓。\n\
  - `clearRect(A, B, width, height)`：擦除指定的矩形区域，绘制一个完全透明的矩形。\n\n上述三种方法接受格式如下的参数：\n\n\
  - `A`, `B` – 指定矩形在画布网格中的相对位置。\n- `width` – 指定矩形的宽度。\n- `height` – 指定矩形的高度。\n\n###\
  \ 示例：\n\n```html\n<!DOCTYPE HTML>\n<HTML>\n<head>\n<title>drawing rectangle</title>\n\
  </head>\n<body>\n<canvas id=\"idCanvas\" width=\"200\" height=\"100\">\nthis browser\
  \ does not support the canvas element.\n</canvas>\n<script>\nvar canvas = document.getElementById(\"\
  idCanvas\");\nvar ctx = canvas.getContext(\"2d\");\nctx.fillStyle = \"blue\";\n\
  ctx.fillRect(0,0,150,75);\n</script>\n</>\n</HTML>\n```\n\n### 绘制路径\n\n路径基本上是一组由线段连接的点或点列表。形状可以是不同的或相同的，具有不同的高度、宽度、颜色等。它甚至可以是闭合的或开放的。\n\
  \n### 关于矩形和路径的说明：\n\n矩形和路径是画布中唯一的原始形状。要绘制你想象的任何其他形状，必须通过连接多条路径来绘制。\n\n### 如何使用路径绘制任何形状：\n\
  \n需要以下方法来创建、连接和操作路径以形成形状。\n\n1. `beginPath()` 方法：用于创建一个新路径。\n2. `path` 函数：\n- `CanvasRenderingContext2D.moveTo()`：将新创建路径的起始索引移动到\
  \ `(A, B)` 坐标。\n- `CanvasRenderingContext2D.bezierCurveTo()`：向路径中添加曲线（也称为三次贝塞尔曲线）。\n\
  - `CanvasRenderingContext2D.lineTo()`：用直线将子路径与 `A, B` 坐标以及上一点连接起来。\n- `CanvasRenderingContext2D.arc()`：在路径上添加一个以\
  \ `(A, B)` 位置为中心、`radius` 为半径的弧。从 `startAngle` 开始并按方向在 `endAngle` 结束。\n- `CanvasRenderingContext2D.ellipse()`：在路径上添加一个以\
  \ `(A, B)` 位置为中心、`radiusX` 和 `radiusY` 为半径的椭圆，从 `startAngle` 开始并按方向在 `endAngle`\
  \ 结束。\n- `CanvasRenderingContext2D.fill()`：用当前样式填充子路径。\n- `CanvasRenderingContext2D.rect()`：创建一个位于\
  \ `(A, B)` 的矩形路径，其大小由 `width` 和 `height` 决定。\n- `CanvasRenderingContext2D.quadraticCurveTo()`：向路径中添加二次贝塞尔曲线。\n\
  - `CanvasRenderingContext2D.arcTo()`：向路径中添加一条弧，包括由直线连接的控制点。\n3. `closePath()`：关闭路径。\n\
  4. `fill()`：通过 `fill()` 方法，我们可以绘制填充内容区域的实心形状。\n5. `stroke()`：通过 `stroke()` 方法，我们可以在形状周围绘制边框。\n\
  \n遵循这些步骤将帮助你使用路径绘制你想象的任何形状：\n1. 创建新路径。\n2. 使用上述列出的绘制命令在路径中绘制。\n3. 绘制完成后关闭路径。\n4.\
  \ 路径创建完成后，你可以通过描边或填充来轻松操作它。\n5. 路径现在可以渲染了。\n\n### 使用路径绘制三角形\n\n本节展示了如何使用路径绘制三角形。查看下面的代码。\n\
  \nHTML 代码：\n```html\n<!DOCTYPE HTML>\n<HTML>\n<body onload=\"drawTriangle();\">\n\
