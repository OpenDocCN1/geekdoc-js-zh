  \  if (canvas.getContext) {\n    var ctx = canvas.getContext('2d');\n    ctx.beginPath();\n\
  \    ctx.moveTo(50, 75);\n    ctx.lineTo(95, 72);\n    ctx.lineTo(101, 26);\n  \
  \  ctx.fill();\n  }\n}\n```\n\n### 在上下文中应用样式和颜色\n\n接下来，我们将查看如何根据我们的为形状或上下文添加颜色和样式。\n\
