  \ 方法：\n\n\n\n\n```\n import React, {PropTypes} from 'react';\nimport Box from '../atoms/Box';\n\
  import Heading from '../atoms/Heading';\nimport Markdown from '../atoms/Markdown';\n\
  import Link from '../atoms/Link';\nimport {State} from '../utils/actions';\n\nexport\
  \ default\nclass Comment extends React.Component {\n  static propTypes = {\n   \
  \ comment: PropTypes.object.isRequired,\n    targetScore: PropTypes.number.isRequired\n\
    };\n\n  render(){\n      let comment = this.props.comment;\n      let targetScore\
  \ = this.props.targetScore;\n      let replies = comment.replies || [];\n      return\
  \ (\n        <Box\n          key={comment.id}\n          padding=\"0.5em\"\n   \
  \       margin=\"0.5em\"\n          style={{\n            background: comment.score\
  \ >= targetScore ? '#ffffaa' : '#efefef'\n          }}\n        >\n          <Box\
  \ direction=\"row\">\n            <Heading level=\"title\">{comment.score_hidden\
  \ ? '?' : comment.score}</Heading>\n            <Box margin={{right: \"1em\"}} />\n\
              <Box style={{maxWidth: '80em', lineHeight: '1.5'}}>\n              <Markdown\
  \ content={comment.body} />\n            </Box>\n          </Box>\n          <Box\
  \ margin={{top: '0.5em'}} direction=\"row\">\n            <span>\n             \
  \ by <Link to={`/user/${comment.author}`}>{comment.author}</Link>\n            </span>\n\
              <Box\n              id=\"replyBox\"\n              margin=\"0 1em\"\n\
                onClick={() => {\n                State.setEditing({\n           \
  \       type: 'comment',\n                  id: comment.id,\n                })\n\
                }}\n              style={{cursor: 'pointer'}}\n            >\n   \
  \           Reply\n            </Box>\n          </Box>\n          {replies.map((reply)\
  \ => <Comment comment={reply} targetScore={targetScore} />)}\n        </Box>\n \
  \     );\n  }\n}\n```\n\n`Comment` 的 `render` 方法与传递给 `Comments` 组件中 `map` 调用的函数非常相似。当你保存\
  \ `Comment.js` 并返回终端时，Jest 应该会显示测试通过：\n\n```\n PASS  src/utils/__tests__/shallowCompareWithChildrenId.test.js\
  \ (0.366s)\nPASS  src/atoms/__tests__/Box.test.js (1.079s)\nPASS  src/molecules/__tests__/Comment.test.js\
  \ (1.307s)\n8 tests passed (8 total in 3 test suites, run time 2.335s)\n```\n\n\
  ### 对函数和 DOM 事件进行断言\n\n让我们在 `Comment.test.js` 中添加一个新测试，断言当点击回复按钮时，应用状态会被更新。这个测试应该无需修改就能第一次通过。\n\
  \n```\n describe('molecules/Comment', () => {\n  ...\n  it('should should call State.setEditing\
  \ when the reply button is clicked', () => {\n    let wrapper = mount(<Comment comment={comment}\
  \ targetScore={1} />);\n    let replyBox = wrapper.find('#replyBox');\n    State.setEditing\
  \ = jest.fn();\n    replyBox.simulate('click');\n    expect(State.setEditing).toBeCalledWith({\n\
        type: 'comment',\n      id: comment.id,\n    });\n  });\n});\n```\n\n这个测试中有几个新内容，我们来分析一下：\n\
  \n1.  首先，使用 Enzyme 的 `mount` 将一个 `Comment` 组件渲染到 DOM 中。\n2.  使用返回的 Enzyme `wrapper`\
  \ 的 `find` 方法，选择 id 为 `replyBox` 的元素。\n3.  用 `jest.fn()` 创建一个模拟函数，并赋值给 `State.setEditing`。\n\
  4.  使用 `wrapper` 在 `replyBox` 元素上模拟一个 `click` 事件。\n5.  最后，断言 `State.setEditing`\
  \ 应该被调用，并且传入提供的对象。\n\nReact 组件通常会根据用户交互或其他生命周期事件执行函数。Jest 和 Enzyme 使得测试组件行为是否符合预期变得简单。\n\
  \n### 对子组件进行断言\n\n既然我们已经实现了新的 `Comment` 组件，让我们编写一个测试来验证 `Comments` 组件会为其 `comments`\
  \ prop 中的每个对象渲染一个 `Comment` 组件。\n\n```\n import React from 'react';\nimport {shallow,\
  \ mount, render} from 'enzyme';\n\nimport Comments from '../Comments';\nimport Comment\
  \ from '../Comment';\n\njest.unmock('../Comments');\njest.unmock('../Comment');\n\
  \ndescribe('molecules/Comments', () => {\n  it('<Comments comments={comments}/>',\
  \ () => {\n    let comments = [{\n        id: 1,\n        replies: [],\n       \
  \ score: 1,\n        score_hidden: 0,\n        body: \"Test Driven Development,\
  \ yeah!\",\n        author: \"Jeremiah Hall\"\n    }, {\n        id: 2,\n       \
  \ score: 0.5,\n        score_hidden: 0.25,\n        body: \"React is great!\",\n\
          author: \"Jeremiah Hall\"\n    }];\n\n    let wrapper = shallow(<Comments\
  \ comments={comments} />);\n    let childComments = wrapper.find(Comment);\n\n \
  \   expect(childComments.length).toEqual(comments.length);\n  });\n});\n```\n\n\
  这个测试定义了一个包含两个评论对象的数组，并使用 `shallow` 渲染一个 `Comments` 组件，并将该数组作为 prop 传入。然后使用返回的 `wrapper`\
  \ 的 `find` 方法来查找类型为 `Comment` 的子组件。你可以用这种方式查找任何类型的 React 组件。Enzyme 支持使用 CSS 选择器（如\
  \ `.class-name` 或 `#replyBox`）、组件构造函数（如上例所示）、组件的 displayName 或组件 props 进行搜索。\n\n\
  你可以在 GitHub 上查看 Enzyme 的 API 文档：\n\n[`github.com/airbnb/enzyme`](https://github.com/airbnb/enzyme)\n\
  \n## Enzyme 中的 Shallow、Mount 和 Render\n\nEnzyme 的 `shallow` 函数将渲染的组件视为一个独立单元，这样你的测试就不会受到子组件的影响。`mount`\
  \ 函数会渲染到 DOM，并确保在适当时调用组件的生命周期方法（如 `componentDidUpdate` 等）。`render` 函数则更进一步，渲染为静态\
  \ HTML，然后你可以对其进行分析。\n\n这个 `Comments` 测试最初会失败，因为我们需要修改组件以使用新的 `Comment`：\n\n```\n\
  \ ...\nimport Comment from './Comment';\n\nexport default\nclass Comments extends\
  \ React.Component {\n  ...\n  render(){\n    // find the average comment score\n\
      var targetScore = this.getGoodScoreThreshold();\n\n    return (\n      <Box>\n\
          {this.props.comments.map((comment) => <Comment key={comment.id} comment={comment}\
  \ targetScore={targetScore} />)}\n      </Box>\n    );\n  }\n}\n```\n\n在文件顶部添加了\
  \ `Comment` 的导入语句，并修改了 `map` 函数，使其为 `props` 中的每个评论返回一个 `Comment` 组件。\n\n让我们扩展测试，验证子\
  \ `Comment` 组件是否接收到了正确的 `comment` prop。\n\n```\n describe('molecules/Comments',\
  \ () => {\n  it('<Comments comments={comments}/>', () => {\n    ...\n    expect(childComments.length).toEqual(comments.length);\n\
      expect(childComments.at(0).prop('comment')).toEqual(comments[0]);\n    expect(childComments.at(1).prop('comment')).toEqual(comments[1]);\n\
      ...\n  });\n});\n```\n\n这两个新断言从每个子组件中获取 `comment` prop，并断言它们与示例评论数组中相同索引的评论相等。\n\
  \n## 总结\n\n本章涵盖了测试概念的旋风：渲染、自动模拟、取消模拟、包装器、模拟事件、元素查找器和测试驱动开发！现在你已经准备好在实际应用中测试你的 React\
  \ 组件了。\n\n既然我们已经介绍了如何对 React 应用进行单元测试，接下来让我们学习一些可以用来构建 React 应用的架构模式。\n\n^(1) http://blog.8thlight.com/uncle-bob/2014/05/08/SingleReponsibilityPrinciple.html\n\
  \n^(2) http://www.ccs.neu.edu/research/demeter/demeter-method/LawOfDemeter/paper-boy/demeter.pdf\n\
  \n^(3) https://www.youtube.com/watch?v=1wHr-O6gEfc\n\n# 第 15 章 架构模式\n\n\n\n\n有许多架构模式可以与\
  \ `React` 一起使用。从标准的 `Flux` 模式，到 `Flux` 的变体（如 `Reflux`），再到完全不同的语言和生态系统（如 `Om` 和 `ClojureScript`），`React`\
  \ 已被证明具有相当强的适应性。在本章中，我们将探讨示例 `React` 应用的结构，以及这种结构如何帮助管理随着项目增长而增加的复杂性。我们还将探讨一些流行的替代方案。\n\
  \n通常认为，你可以将 `React` 视为 `MVC` 中的 `V`。它可以与内联的 `AJAX` 请求一起使用，如下所示，但这很快就会变得难以理解：\n\n\
  ```\n export default\nclass Reply extends React.Component {\n  getInitialState()\
  \ {\n    return {\n      text: \"\"\n    };\n  }\n  submitReply() {\n    $.ajax({\
  \ url: '/replies', type: 'POST',\n      contentType: 'application/json',\n     \
  \ dataType: 'json',\n      data: JSON.stringify(this.state.text)}, (json) => {\n\
  \        this.setState({ text: \"\" });\n      });\n  }\n  render() {\n    return\
  \ (\n      <div>\n        <textarea\n          value={this.state.text}\n       \
  \   onChange={(e) => this.setState({text:e.target.value})}\n        />\n       \
  \ <input value=\"Submit\" type=\"button\" onClick={() => this.submitReply()} />\n\
  \      </div>\n    );\n  }\n}\n```\n\n例如，你如何处理更新其他可能需要知道这条新回复的组件？\n\n`React` 足够灵活，可以与许多\
  \ `MVC` 框架很好地配合使用。让我们从研究 `react-router` 开始。\n\n## 路由\n\n路由是一种直观的方式，将 URL 与应用的视图层次结构关联起来。路由器将单页应用中的\
  \ URL 定向到特定的视图或组件。\n\n你可以想象，对于 URL `/items`，你可能希望运行一个函数，从服务器加载 items 并渲染一个 `<ItemsList\
  \ />` 组件。\n\n有许多不同类型的路由器。它们也存在于服务器端。有些路由器既可以在客户端工作，也可以在服务器端工作。\n\n`React` 只是一个渲染库，并不提供路由器。`React`\
  \ 社区的爆炸式增长催生了多种路由解决方案。在本节中，我们将介绍 `react-router`，这是示例应用中使用的一种路由解决方案。\n\n### react-router\n\
  \n本书的示例应用使用了 `react-router`。它与其他路由器的不同之处在于，路由器是由 `JSX` 元素组成的。\n\n路由被定义为 `Route`\
  \ 组件，每个路由都有一个 `component` 属性，该属性是一个 `React` 组件。\n\n这是示例应用中的路由器：\n\n```\n export\
  \ default (\n  <Route component={App}>\n    <Route component={MainLayout}>\n   \
  \   <Route path=\"/\" component={require('./pages/HomePage/HomePage')} />\n     \
  \ <Route path=\"/user/:id\" component={require('./pages/UserPage/UserPage')} />\n\
        <Route path=\"/r/:id\" component={require('./pages/BoardPage/BoardPage')}\
  \ />\n      <Route path=\"/item/:id\" component={require('./pages/DetailsPage/DetailsPage')}\
  \ />\n    </Route>\n  </Route>\n);\n```\n\n要让路由器运行，你需要将其渲染为顶层组件：\n\n```\n var root\
  \ = document.getElementById('app-root');\nReactDOM.render(\n  <Router history={createBrowserHistory()}>{routes}</Router>\n\
  , root);\n```\n\n与其他路由器一样，`react-router` 也有类似的参数概念。例如，路由 `'/user/:id'` 会将 `id` 属性传递给\
  \ `UserPage` 组件。\n\n`react-router` 的一个很酷的特性是它提供了一个 `Link` 组件，你可以用它进行导航，它会将其映射到路由。在示例应用中，`react-router`\
  \ 的 `Link` 组件被封装在文件 `src/atom/Link.js` 中，但属性基本上只是传递给 `react-router` 组件。\n\n以下是我们的\
  \ `<MainNavigation/>` 组件使用 `Link` 组件的样子：\n\n```\n ...\nexport default\nclass MainNavigation\
  \ extends React.Component {\n  render(){\n    return (\n      <Box>\n        <Box\
  \ direction=\"row\">\n          {tabs.map((tab) => {\n            return (\n   \
  \           <Box margin={{left: \"0.1em\"}} key={tab.name}>\n                <Link\
  \ unstyled to={tab.to}>\n                  <Button which={tab.which}>{tab.name}</Button>\n\
                  </Link>\n              </Box>\n            );\n          })}\n \
  \       </Box>\n      </Box>\n    );\n  }\n}\n```\n\n在此处阅读更多关于 `react-router` 的信息并下载：[`github.com/reactjs/react-router`](https://github.com/reactjs/react-router)。\n\
  \n## Flux\n\n`Flux` 是 Facebook 引入的一种客户端应用架构模式。它通过单向数据流补充了 `React`，这种数据流易于理解，并且几乎不需要任何脚手架即可启动和运行。\n\
  \n`Flux` 由四个主要部分组成：store、dispatcher、action creators 和视图（`React` 组件）。Action creators\
  \ 是辅助方法，用于为 dispatcher 创建语义接口。\n\n你可以将最顶层的 `React` 组件视为 View-Controller。View-Controller\
  \ 组件与 store 交互，并促进与其子组件的通信。这与 iOS 世界中的 `ViewController` 类似。\n\n`Flux` 模式中的每个节点都是独立的，强制实现了严格的关注点分离，并且使每个节点易于单独测试。\n\
  \n### 数据流\n\n`Flux` 的一个关键方面是信息的单向流动。与其他事件处理不够结构化或复杂的双向数据绑定的方法相比，这可能看起来非常不同。\n\n\
  `Flux` 在其组件之间具有明确定义的流程。\n\n1. 当你的应用启动时，Stores 会向 Dispatcher 注册回调或事件监听器。\n\n2. 当你的应用中的\
  \ `React` 组件被渲染时，它们会向 Stores 注册自己的回调或事件监听器。\n\n3. 当用户与视图交互并点击某个可能触发 Action Creator\
  \ 的内容时。\n\n4. Action Creator 可能会执行一个 `AJAX` 请求，然后通过 Dispatcher 分发一个 Action。\n\n\
  5. Dispatcher 然后将该 Action 传递给所有已向其注册回调的 Stores。\n\n6. Stores 会根据 Action 的内容更新其状态，如果状态发生变化，它们会通知所有监听变更事件的组件。\n\
  \n7. 被通知的视图随后会从 stores 请求更新后的状态，并在必要时重新渲染，使应用进入一个新的、更新后的状态。\n\n这种单向流动以及组件之间明确定义的职责分离，使得理解应用中的状态变化变得更加容易。\n\
  \n![替代文本](img/flux-diagram-white-background.png)\n\n图片来源：[Facebook](https://github.com/facebook/flux/)\n\
  \n### Flux 的组成部分\n\n`Flux` 由具有特定职责的不同部分组成。在信息的单向流动中，每个 `Flux` 部分从下游接收输入，进行处理，然后将输出发送到上游。\n\
  \n* Dispatcher——应用中的中央枢纽。\n\n* Actions——应用的领域特定语言。\n\n* Store——业务逻辑和数据交互。\n\n* Views——用于渲染应用的组件树。\n\
  \n让我们讨论每个部分，它的职责，以及如何在你的 `React` 应用中有效地使用它。\n\n#### Dispatcher\n\n我们选择从 dispatcher\
  \ 开始，因为它是所有用户交互和数据流经的中央枢纽。Dispatcher 是 `Flux` 模式中的单例。\n\nDispatcher 负责在 stores 上注册回调，并管理它们之间的依赖关系。Actions\
  \ 流经 dispatcher，然后进入已为其注册的 stores。\n\n我们的示例应用包含多个 stores。随着应用的增长，你不可避免地会遇到需要管理多个\
  \ stores 及其相互依赖关系的情况。我们将在下面讨论这种情况。\n\n#### Actions\n\n从用户的角度来看，这是 `Flux` 的起点。他们通过\
  \ UI 执行的每个操作都会创建一个 action，该 action 被发送到 dispatcher。\n\n\n\n\n\n虽然动作并非 Flux 模式的正式组成部分，但它们构成了应用程序的领域特定语言。动作创建器将用户交互转化为有意义的调度器动作——即存储可以处理的语句。\n\
  \n#### 存储\n\n存储负责封装业务逻辑以及与应用程序数据的交互。存储通过向调度器注册，选择要响应的动作。存储通过其变更事件将数据发送到 React 组件层级中。\n\
  \n保持存储的严格关注点分离非常重要。\n\n*   存储保存应用程序的*所有*数据。\n*   应用程序的其他部分不应知道如何与数据交互——存储是应用程序中唯一发生数据变更的地方。\n\
  *   存储没有设置器——所有更新都通过调度器流入存储。新数据通过存储的变更事件流回应用程序。\n\n下面是一个存储向调度器注册以接收帖子评论的示例。\n\n\
  ```\n Dispatcher.register(function(payload) {\n  switch(payload.actionType) {\n\
      ...\n    case CommentConstants.RECEIVE_COMMENTS:\n      CommentStore.setComments(payload.comments,\
  \ payload.parentPostId);\n      break;\n  }\n});\n```\n\n存储接收动作，执行保存评论的工作，完成后触发变更事件。\n\
  \n```\n CommentStore.prototype.setComments = function(comments, parentPostId) {\n\
    // 在此处处理保存结果\n  this.emitChange();\n}\n```\n\n然后，React 视图处理此变更事件。新状态将流经 React\
  \ 组件层级，组件将根据需要重新渲染。\n\n#### 视图控制器\n\n应用程序的组件层级通常有一个负责与存储交互的高层组件。简单的应用程序可能只有一个。更复杂的应用程序可能有多个。\n\
  \n连接存储的过程很简单。\n\n1.  当组件挂载时，添加变更监听器。\n2.  当存储发生变化时，请求新数据并进行相应处理。\n3.  当组件卸载时，清理变更监听器。\n\
  \n以下是处理存储交互的示例。\n\n```\n export default\nclass App extends React.Component {\n \
  \ handleChange() {\n    PostStore.getPosts((posts) => {\n      this.setState({ posts:\
  \ posts });\n    });\n  }\n  componentDidMount() {\n    PostStore.addChangeListener(this.handleChange);\n\
    }\n  componentWillUnmount() {\n    PostStore.removeChangeListener(this.handleChange);\n\
    }\n  ...\n}\n```\n\n### 管理多个存储\n\n随着应用程序的发展，不可避免地需要多个存储。当一个存储依赖于另一个存储时，情况会变得棘手，因为第二个存储需要先完成其动作，第一个存储才能执行自己的动作。\n\
  \n例如，我们可能创建一个单独的存储来维护调查结果摘要，统计所有调查受访者的结果。这个摘要存储需要主存储先完成其记录动作，然后我们才能安全地更新摘要存储。\n\n\
  Facebook 的标准 Flux 实现包含一个名为 `waitFor` 的方法，它可以帮助我们指示存储等待其他存储完成事件处理后再继续。\n\n#### 注册依赖动作\n\
  \n假设我们有两个存储关注 `CREATE_COMMENT` 动作。\n\n*   `CommentStore` 需要存储评论。\n*   `PostStore`\
  \ 需要重新统计帖子的评论总数。\n\n这意味着 `PostStore` 依赖于 `CommentStore` 先完成 `CREATE_COMMENT` 动作，然后才能完成其工作。\n\
  \n当我们在应用程序顶部注册 `CommentStore` 时，我们存储了对调度器令牌的引用。\n\n```\n // 将 CommentStore 与动作调度器连接\n\
  CommentStore.dispatchToken = Dispatcher.register(function(payload) {\n  switch(payload.actionType)\
  \ {\n    ...\n    case CommentConstants.CREATE_COMMENT:\n      CommentStore.saveComment(payload.comment,\
  \ payload.parentPostId);\n      break;\n    ...\n  }\n});\n```\n\n然后我们注册新的 `PostStore`，在访问\
  \ `CommentStore` 数据之前调用 `waitFor`。\n\n```\n PostStore.dispatchToken = Dispatcher.register(function(payload)\
  \ {\n  switch(payload.actionType) {\n    case CommentConstants.CREATE_COMMENT:\n\
        Dispatcher.waitFor(CommentStore.dispatchToken);\n      // 此时保证 `CommentStore`\
  \ 的回调已执行\n      // 我们可以安全地访问其数据进行汇总。\n      var commentCount = CommentStore.getCommentsFor(payload.parentPostId);\n\
        PostStore.setCommentCount(commentCount, payload.parentPostId);\n      break;\n\
      }\n  }\n});\n```\n\n### Reflux\n\n示例应用使用了一个流行的受 Flux 启发的库，名为 Reflux。Reflux 与\
  \ Flux 的不同之处在于，存储直接订阅动作。这消除了检查动作类型的大型 switch 语句的需要。存储也可以类似地监听其他存储，从而消除了 Flux 部分中描述的\
  \ `waitFor` 调用。动作创建器被消除，因为 Reflux 动作只是将接收到的 `payload` 传递给监听器的函数。\n\n示例应用在 `src/stores`\
  \ 目录中定义了许多存储。应用的所有动作都在 `src/utils/actions.js` 中定义。\n\n你可以在此处了解更多关于 Reflux 的信息：[`github.com/reflux/refluxjs`](https://github.com/reflux/refluxjs)。\n\
  \n### Redux\n\n受 ClojureScript 的 Om 和函数式响应式编程的影响，Redux 是另一个受 Flux 启发的用于 React 应用的库。Redux\
  \ 旨在帮助你编写易于推理的应用程序，并提供出色的开发者体验。\n\n与 Om 类似，Redux 将整个应用程序的状态收集到一个单一对象中，作为一个大型数据树。Redux\
  \ 的设计使得你的所有代码（包括存储）都可以热加载，即在应用运行时更新。\n\nRedux 有一个单一的存储，由响应动作的 Reducer 更新。Redux Reducer\
  \ 是纯函数，返回状态树的一个更新片段。Reducer 通常与存储向 `Dispatcher` 注册的函数非常相似。Redux 不使用 Flux 中存储的 getter\
  \ 方法，而是有一个选择器的概念。选择器是从状态树中检索数据的函数。然后，组件使用一个名为 `connect` 的函数来注册存储的更新，并使用选择器检索所需数据。这些选中的数据作为\
  \ props 传递给连接的组件。Redux 中的动作创建器与 Flux 中的类似，但可以通过中间件增强。\n\n你可以在此处了解更多关于 Redux 的信息：[`redux.js.org`](http://redux.js.org)。\n\
  \n### Relay\n\nRelay 是 Facebook 为 React 应用创建的数据驱动框架。Relay 使得在组件内部将组件所需的数据指定为 GraphQL\
  \ 片段或查询成为可能。当 Relay 渲染你的 React 应用时，它会从所有要渲染的组件上的 GraphQL 片段构建一个大型复合查询，然后向服务器发出一个请求。将数据需求与组件放在一起，使得跟踪变化的数据需求变得简单，而批处理网络请求则提高了性能。使用\
  \ Relay 要求你有一个支持响应 GraphQL 查询的服务器，但对于具有复杂数据需求或视图层级的应用程序来说，它可能是一个很好的选择。\n\n你可以在此处了解更多关于\
  \ Relay 的信息：[`facebook.github.io/relay/`](https://facebook.github.io/relay/)。\n\n\
  ### Om 和 Om Next (ClojureScript)\n\n\n\n\nOm 及其后继者 Om Next 是非常流行的 ClojureScript\
  \ React 接口。ClojureScript 的持久化数据结构使得实现诸如撤销等原本复杂的功能变得非常简单。Om Next 融合了 Om 社区的经验，提供了更好的体验。与\
  \ Relay 类似，Om Next 允许你直接在组件上指定组件的数据需求。在 Om Next 中，这些查询使用 Datomic Pull 语法指定，这是一种用于\
  \ Datomic 的查询语法，Datomic 是 ClojureScript 项目中常用的数据库。\n\n下面是一个完整的 Om Next 应用！\n\n```\n\
  \ (ns om-tutorial.core\n  (:require [goog.dom :as gdom]\n            [om.next :as\
  \ om :refer-macros [defui]]\n            [om.dom :as dom]\n            [datascript.core\
  \ :as d]))\n\n(def app-state\n  (atom\n    {:app/title \"Animals\"\n     :animals/list\n\
  \     [[1 \"Crow\"] [2 \"Antelope\"] [3 \"Bird\"] [4 \"Cat\"] [5 \"Dog\"]\n    \
  \  [6 \"Lion\"] [7 \"Mouse\"] [8 \"Monkey\"] [9 \"Snake\"] [10 \"Zebra\"]]}))\n\n\
  (defmulti read (fn [env key params] key))\n\n(defmethod read :default\n  [{:keys\
  \ [state] :as env} key params]\n  (let [st @state]\n    (if-let [[_ value] (find\
  \ st key)]\n      {:value value}\n      {:value :not-found})))\n\n(defmethod read\
  \ :animals/list\n  [{:keys [state] :as env} key {:keys [start end]}]\n  {:value\
  \ (subvec (:animals/list @state) start end)})\n\n(defui AnimalsList\n  static om/IQueryParams\n\
  \  (params [this]\n    {:start 0 :end 10})\n  static om/IQuery\n  (query [this]\n\
  \    '[:app/title (:animals/list {:start ?start :end ?end})])\n  Object\n  (render\
  \ [this]\n    (let [{:keys [app/title animals/list]} (om/props this)]\n      (dom/div\
  \ nil\n               (dom/h2 nil title)\n               (apply dom/ul nil\n   \
  \                   (map\n                        (fn [[i name]]\n             \
  \             (dom/li nil (str i \". \" name)))\n                        list))))))\n\
  \n(def reconciler\n  (om/reconciler\n    {:state app-state\n     :parser (om/parser\
  \ {:read read})}))\n\n(om/add-root! reconciler\n              AnimalsList (gdom/getElement\
  \ \"app\"))\n```\n\n这段代码渲染了一个无序列表，列出了文件顶部附近定义为 `app-state` 的动物名称。\n\n你可以在这里了解更多关于\
  \ Om 和 ClojureScript 的信息：[`github.com/omcljs/om`](https://github.com/omcljs/om)。\n\
  \n## 总结\n\n到目前为止，你已经看到了许多可以与 React 一起使用的架构模式。从标准的 Flux 模式，到像 Reflux 这样的 Flux 变体，再到像\
  \ Om 和 ClojureScript 这样完全不同的语言和生态系统，React 已经证明了自己具有很强的适应性。\n\n接下来，你可以阅读关于在 React\
  \ 应用中使用不可变性的内容，这是 Redux 和 Om 的核心概念。\n\n# 第 16 章 不可变性\n\n一种越来越流行的使用 React 的方式是与不可变数据结构结合——即那些在实例化后永远不会改变的数据结构。\n\
  \n不可变性是否适合你的应用，以及如果适合，应该采用哪个不可变库，取决于你的具体用例。在本章中，我们将介绍不可变性的优点和代价，并介绍三个不同的库，你可以用它们将不可变性集成到你的\
  \ React 应用中。\n\n## 性能优势\n\n在 React 应用中，不可变性最明显的好处体现在 `shouldComponentUpdate` 上。虽然\
  \ `shouldComponentUpdate` 可以带来巨大的性能提升，但随着 `shouldComponentUpdate` 处理程序本身复杂性的增加，这些提升往往会减弱甚至消失。\n\
  \n假设你有一个 `shouldComponentUpdate`，它只需要检查 `props` 中的一个字段就能决定返回 `true` 还是 `false`。那会运行得很快！现在假设它需要检查十几个字段，其中一些字段包含的对象需要多次比较，因为所有这些检查会迅速累积起来。\n\
  \n问题的根源在于，判断两个可变对象是否代表相同的值是很耗时的。但如果这是一个快速检查呢？\n\n使用不可变的 `props` 和 `state`，确实有一个快速检查的方法。当你的\
  \ `props` 表示为不可变对象时，它们就不能再原地更新；要获得新的 props，你必须实例化一个新的不可变对象，并用新对象替换旧对象。因此，使用 `oldProps\
  \ !== newProps` 作为 `shouldComponentUpdate` 的检查，可以非常快速地告诉你是否绝对需要更新。\n\n值得注意的是，尽管这个检查非常快，但它可能会产生误报。例如，如果你的旧状态是\
  \ `{ username: \"Don Jacko\", active: true }`，并且你调用了 `replaceState` 传入一个新实例化的对象\
  \ `{ username: \"Don Jacko\", active: true }`，那么旧 `state` 显然与新 `state` 相同，但使用 `oldState\
  \ !== newState` 作为测试的 `shouldComponentUpdate` 函数仍然会认为它们不同，并导致不必要的重新渲染。\n\n在实践中，这种情况很少出现，即使出现，唯一的代价也只是不必要的重新渲染。漏报（组件实际上需要重新渲染但判断为不需要）会更令人担忧，但幸运的是，这种方法不会出现这个问题。\n\
  \n## 性能代价\n\n虽然不可变数据结构可以让你实现极其简单且闪电般快速的 `shouldComponentUpdate`，从而节省大量的渲染性能，但它们并非没有性能代价。可变对象更新快但比较慢，而不可变对象比较快但更新慢。\n\
  \n不可变库不会在原地进行更改，而是必须实例化至少一个新对象，并根据需要修改它，直到它在除更改字段外的所有方面都与旧对象匹配。这在更新过程中以及垃圾回收过程中（当额外的对象被不可避免地清理时）都会消耗时间。\n\
  \n对于绝大多数 React 应用来说，这是一个很好的权衡。请记住，一次更新通常会导致多次渲染函数的调用，而渲染函数在构建返回值的过程中本身也会实例化不少对象。牺牲一点更新速度来节省大量的渲染函数调用，几乎总是性能上的胜利。\n\
  \n除了性能之外，另一个需要考虑的代价是你失去了 `setState` 和 `setProp` 的便利性。由于这两者分别依赖于能够修改你的 `state` 和\
  \ `props` 对象，当你将它们切换为不可变对象时，你唯一的选择就变成了 `replaceState` 和 `replaceProps`。\n\n## 架构优势\n\
  \n除了性能优势之外，更多地使用不可变数据还会带来额外的架构优势。这些优势超越了 `props` 和 `state`，更广泛地适用于你的整个应用。\n\n与可变数据相比，不可变数据通常更不容易出错。当将可变数据从一个函数传递到另一个函数，并期望它返回时保持不变时，你有两个选择：一是提前克隆对象并传递克隆体，二是祈祷另一个函数不会修改它。（因为如果它修改了，你就得开始调试了！）\n\
  \n防御性克隆在这种情况下是有效的，但通常不如不可变库在相同情况下所做的效率高。知道你的初始数据已经被假定为不可变，可以允许比全程可变时更快的克隆。\n\n拥抱不可变性意味着你不必在逐个案例的基础上记住进行防御性克隆；相反，通过以通常的方式使用不可变数据，你将获得相同的安全传递特性。这使得不可变数据在操作时更不容易出错。\n\
  \n## 使用不可变性辅助插件\n\n\n\n\n向 React 应用引入不可变性最简单的方法是使用不可变性辅助插件（Immutability Helpers\
  \ Addon）。它让你能够继续使用现有的可变数据结构，就像它们是不可变的一样，通过轻松创建新的（同样是可变的）对象，而不是就地更新。\n\n虽然这实际上并没有给你带来任何新的保证，但它允许你像上面描述的那样编写一个快速的\
  \ `shouldComponentUpdate` 函数。\n\n让我们更新示例，使用不可变性辅助插件：\n\n```\n var update = React.addons.update;\n\
  \nvar SurveyEditor = React.createClass({\n  // ...\n\n  handleDrop: function (ev)\
  \ {\n    var questionType = ev.dataTransfer.getData('questionType');\n    var questions\
  \ = update(this.state.questions, {\n      $push: [{ type: questionType }]\n    });\n\
  \n    this.setState({\n      questions: questions,\n      dropZoneEntered: false\n\
  \    });\n  },\n\n  handleQuestionChange: function (key, newQuestion) {\n    var\
  \ questions = update(this.state.questions, {\n      $splice: [[key, 1, newQuestion]]\n\
  \    });\n\n    this.setState({ questions: questions });\n  },\n\n  handleQuestionRemove:\
  \ function (key) {\n    var questions = update(this.state.questions, {\n      $splice:\
  \ [[key, 1]]\n    });\n\n    this.setState({ questions: questions });\n  }\n\n \
  \ // ...\n});\n```\n\n接下来，我们将尝试一个不同的库，这个库确实对不可变性做出了保证。\n\n## 使用 seamless-immutable\n\
  \nseamless-immutable 库并非官方 React 家族的一部分，但它是为与 React 一起使用而设计的。它创建了普通对象和数组的不可变版本，这些版本可以像它们的可变对应物一样传递、访问和迭代，但会阻止任何会改变它们的操作。\n\
  \n与不可变性辅助插件类似，seamless-immutable 提供了处理不可变数据的便捷函数。然而，在 seamless-immutable 中，这些函数是作为对象自身的方法实现的。例如，seamless-immutable\
  \ 对象获得了一个 `.merge()` 方法，其作用类似于不可变性辅助插件中的 `$merge` 选项。\n\n```\n var update = React.addons.update;\n\
  \nvar SurveyEditor = React.createClass({\n  // ...\n\n  handleDrop: function (ev)\
  \ {\n    var questionType = ev.dataTransfer.getData('questionType');\n    var questions\
  \ = this.state.questions.concat(\n      [{ type: questionType }]\n    );\n\n   \
  \ this.replaceState(this.state.merge({\n      questions: questions,\n      dropZoneEntered:\
  \ false\n    }));\n  },\n\n  handleQuestionChange: function (key, newQuestion) {\n\
  \    var questions = this.state.questions.map(\n        function(question, index)\
  \ {\n            return index === key ? newQuestion : question;\n        }\n   \
  \ );\n\n    this.setState({ questions: questions });\n  },\n\n  handleQuestionRemove:\
  \ function (key) {\n    var questions = this.state.questions.filter(\n        function(question,\
  \ index) {\n            return index !== key;\n        }\n    );\n\n    this.setState({\
  \ questions: questions });\n  }\n\n  // ...\n\n});\n```\n\n## 使用 Immutable.js\n\n\
  前两个库提供了围绕普通 JavaScript 对象和数组的工具，而 Immutable.js 则采用了不同的方法：它提供了对象和数组的替代数据结构。\n\n这些数据结构中最常用的是\
  \ `Immutable.Map`（类似于 Object）和 `Immutable.Vector`（类似于 Array）。在一般情况下，这两者都不能随意替代 JavaScript\
  \ 对象或数组，尽管你可以轻松地在 Immutable.js 数据结构与其可变的 JavaScript 对应物之间进行转换。\n\n`Immutable.Map`\n\
  \n`Immutable.Map` 可以用作普通 JavaScript 对象的替代品：\n\n```\n var question = Immutable.Map({description:\
  \ 'who is your favorite superhero?'});\n// 使用 .get 从 Map 中获取值\nquestion.get('description');\n\
  \n// 使用 .set 更新值会返回一个新对象。\n// 原始对象保持不变。\nquestion2 = question.set('description',\
  \ 'Who is your favorite comicbook hero?');\n\n// 使用 .merge 合并两个对象得到第三个对象。\n// 同样，原始对象都不会被修改。\n\
  var title = { title: 'Question #1' };\nvar question3 = question.merge(question2,\
  \ title);\nquestion3.toObject(); // { title: 'Question #1', description: 'who is\
  \ your favorite comicbook hero' }\n```\n\n`Immutable.Vector`\n\n使用 `Immutable.Vector`\
  \ 处理数组：\n\n```\n var options = Immutable.Vector('Superman' , 'Batman');\nvar options2\
  \ = options.push('Spiderman');\noptions2.toArray(); // ['Superman', 'Batman', 'Spiderman']\n\
  ```\n\n你还可以嵌套这些数据结构：\n\n```\n var options = Immutable.Vector('Superman' , 'Batman');\n\
  var question = Immutable.Map({\n  description: 'who is your favorite superhero?',\n\
  \  options: options\n});\n```\n\nImmutable.js 还有更多功能。有关 Immutable.js 的更多信息，请访问 [`github.com/facebook/immutable-js`](https://github.com/facebook/immutable-js)。\n\
  \n## 总结\n\n在本章中，我们了解了在 React 应用中使用不可变性的好处和代价。我们涵盖了它对 `shouldComponentUpdate` 的影响、对更新时间的意义，以及三种将不可变性引入\
  \ React 代码库的方法。\n\n接下来，我们将探讨 React 在传统 Web 应用之外的其他用途。\n\n# 第 17 章 其他用途\n\nReact\
  \ 是一个强大的交互式 UI 渲染库，但它也提供了一种处理数据和用户输入的绝佳方式。它鼓励编写可重用且易于单元测试的小型组件。这些都是很好的特性，你可以将它们应用于\
  \ Web 之外的其他技术。\n\n在本章中，我们将了解如何使用 React 实现：\n\n*   桌面应用程序\n\n*   游戏\n\n*   电子邮件\n\
  \n*   图表\n\n## 桌面\n\n借助 Electron 或 node-webkit 等项目，你可以在桌面上运行 Web 应用程序。来自 GitHub\
  \ 的 Atom 编辑器就是使用 Electron 构建的，你也可以将其与 React 一起使用。\n\n示例应用已经包含了 Electron，要启动它，请在示例应用的根目录中运行以下命令：\n\
  \n```\n ./node_modules/.bin/electron desktop.html\n```\n\n使用 `desktop.html` 运行 Electron\
  \ 会在一个窗口中打开应用程序。\n\n![](img/Electron.png)\n\n你可以在 [`electron.atom.io`](http://electron.atom.io)\
  \ 上阅读更多关于 Electron 的信息。\n\n借助 Electron 和 node-webkit 等项目，你可以使用与 Web 相同的技术构建桌面应用程序。就像在\
  \ Web 上一样，React 可以帮助你为桌面构建强大的交互式应用程序。\n\n## 游戏\n\n游戏通常需要高水平的用户交互，用户需要响应游戏不断变化的状态。这与大多数\
  \ Web 应用程序形成对比，在 Web 应用程序中，用户要么消费内容，要么生产内容。游戏本质上是一个状态机，具有两个基本角色：\n\n1.  更新视图\n\n\
  2.  响应事件\n\n在本书的引言中，你了解到 React 的范围非常狭窄，只关注两件事：\n\n1.  更新 DOM\n\n2.  响应事件\n\nReact\
  \ 与游戏的相似之处并不仅限于此。React 的虚拟 DOM 架构很大程度上归功于高性能的 3D 游戏引擎，在给定预期视图状态的情况下，渲染引擎确保视图/DOM\
  \ 的高效更新。\n\n作为 React 在游戏中的一个例子，让我们看看游戏 2048 的一个实现。这个游戏的目标是合并棋盘上匹配的数字，直到达到 2048。\n\
  \n![2048](img/2048.png)\n\n让我们深入了解一下这个实现（[`jsfiddle.net/jeremiahrh`](https://jsfiddle.net/jeremiahrhall/6wa8djju/)[all/6wa8djju/](https://jsfiddle.net/jeremiahrhall/6wa8djju/)）。\n\
  \n源代码分为两部分。第一部分是游戏逻辑，作为全局命名空间中的函数实现；第二部分是 React 组件。你首先会看到棋盘的初始数据结构。\n\n\n\n\n\n\
  ```\n var initial_board = {\n    a1:null, a2:null, a3:null, a4:null,\n    b1:null,\
  \ b2:null, b3:null, b4:null,\n    c1:null, c2:null, c3:null, c4:null,\n    d1:null,\
  \ d2:null, d3:null, d4:null\n};\n```\n\n棋盘的数据结构是一个对象，其中的`keys`直接对应 CSS 中定义的视觉网格位置。在初始数据结构之后，你将看到一系列操作该数据结构的函数。所有这些函数都以不可变的方式运行，因此返回一个新棋盘，而不会改变输入。这为游戏逻辑提供了一些灵活性，因为它能够比较移动前后的棋盘，并在不改变游戏状态的情况下推测性地执行移动。\n\
  \n该数据结构的另一个有趣特性是棋盘的结构共享。所有棋盘共享对棋盘上未改变方块的引用。这使得创建新棋盘非常快速，并允许使用引用相等性来比较棋盘。\n\n游戏由两个`React`组件组成：`Tiles`和`GameBoard`。\n\
  \n`Tiles`是一个基本的`React`组件。当给定一个棋盘作为`props`时，它会一致地渲染所有方块。这允许你利用 CSS3 过渡来实现动画。\n\n\
  ```\n class Tiles extends React.Component {\n  render() {\n    var board = this.props.board;\n\
      //先对棋盘键排序，以停止 DOM 元素的重新排序\n    var tiles = used_spaces(board).sort((a, b) =>\
  \ {\n      return board[a].id - board[b].id;\n    });\n    return <div className=\"\
  board\">{\n      tiles.map((key) => {\n        var tile = board[key];\n        var\
  \ val = tile_value(tile);\n        return <span key={tile.id} className={key + \"\
  \ value\" + val}>\n          {val}\n        </span>;\n      })}\n    </div>\n  }\n\
  }\n```\n\n```\n <!-- Tiles 渲染输出的示例 -->\n<div class=\"board\" data-reactid=\".0.1\"\
  >\n  <span class=\"d2 value64\" data-reactid=\".0.1.$2\">64</span>\n  <span class=\"\
  d1 value8\" data-reactid=\".0.1.$27\">8</span>\n  <span class=\"c1 value8\" data-reactid=\"\
  .0.1.$28\">8</span>\n  <span class=\"d3 value8\" data-reactid=\".0.1.$32\">8</span>\n\
  </div>\n```\n\n```\n /* 应用于方块动画的 CSS 过渡 */\n.board span{\n  /* ... */\n  transition:\
  \ all 100ms linear;\n}\n```\n\n`GameBoard`是状态机，响应用户事件（方向键和按钮点击），并与游戏逻辑函数交互，然后用新棋盘更新状态。\n\
  \n```\n class GameBoard extends React.Component {\n    constructor(props) {\n   \
  \   super(props);\n      this.state = this.addTile(this.addTile(initial_board));\n\
      }\n\n    keyHandler(e) {\n        var directions = {\n            37: left,\n\
              38: up,\n            39: right,\n            40: down\n        };\n\
          if (directions[e.keyCode]\n        && this.setBoard(fold_board(this.state,\
  \ directions[e.keyCode]))\n        && Math.floor(Math.random() * 30, 0) > 0){\n\
              setTimeout(() => {\n                 this.setBoard(this.addTile(this.state));\n\
              }, 100);\n        }\n    }\n\n    setBoard(new_board) {\n        if\
  \ (!same_board(this.state, new_board)){\n            this.setState(new_board);\n\
              return true;\n        }\n        return false;\n    }\n\n    addTile(board)\
  \ {\n        var location = available_spaces(board).sort(() => {\n          return\
  \ .5 - Math.random();\n        }).pop();\n        if (location) {\n            var\
  \ two_or_four = Math.floor(Math.random() * 2, 0) ? 2 : 4;\n            return set_tile(board,\
  \ location, new_tile(two_or_four));\n        }\n        return board;\n    }\n\n\
      newGame() {\n        this.setState(this.addTile(this.addTile(initial_board)));\n\
      }\n\n    componentDidMount() {\n        window.addEventListener(\"keydown\"\
  , this.keyHandler.bind(this), \n          false);\n    }\n\n    render() {\n   \
  \     var status = !can_move(this.state)?\" - 游戏结束！\":\"\";\n        return <div\
  \ className=\"app\">\n            <span className=\"score\">\n                分数：{score_board(this.state)}{status}\n\
              </span>\n            <Tiles board={this.state}/>\n            <button\
  \ onClick={this.newGame.bind(this)}>新游戏</button>\n        </div>\n    }\n} \n```\n\
  \n在`GameBoard`组件中，我们设置了用于与棋盘交互的键盘处理程序。每次按下方向键时，我们都会用游戏逻辑生成的新棋盘调用`setBoard`。如果新棋盘与旧棋盘不同，我们就更新`GameBoard`组件的状态。这避免了不必要的循环并提高了性能。\n\
  \n在渲染函数中，你根据当前棋盘渲染`Tiles`组件，并渲染由游戏逻辑根据当前棋盘计算出的分数。\n\n`addTile`函数在你使用方向键时不断向棋盘添加新方块，使游戏持续进行，直到棋盘满且无法合并数字时游戏结束。\n\
  \n基于上述实现，为游戏添加撤销功能是轻而易举的。你可以在`GameBoard`组件的状态中保存所有棋盘更改的历史记录，并通过一个撤销按钮更改当前棋盘：[`jsfiddle.net/jeremiahrhall/9fbjgnt6/`](https://jsfiddle.net/jeremiahrhall/9fbjgnt6/)。\n\
  \n这个游戏的实现相当简单，因为`React`让你专注于游戏逻辑和用户交互，而无需担心保持视图同步。\n\n## 电子邮件\n\n尽管`React`是为构建交互式\
  \ Web UI 而优化的，但其核心是渲染 HTML。这意味着你可以获得通常为编写`React`应用程序而获得的许多相同好处，甚至用于像编写 HTML 电子邮件这样糟糕的事情。\n\
  \n构建 HTML 电子邮件需要一系列表格才能在各个电子邮件客户端中正确渲染。要编写电子邮件，你需要将时钟拨回几年，像 1999 年那样编写 HTML。\n\n\
  在多种电子邮件客户端中成功渲染电子邮件绝非易事。为了用`React`构建我们的设计，我们只会触及构建电子邮件时遇到的一些挑战，无论它们是否使用`React`渲染。\n\
  \n用`React`为电子邮件渲染 HTML 的核心原则是`React.renderToStaticMarkup`。该函数返回一个包含完整组件树的 HTML 字符串，给定一个顶级组件。`React.renderToStaticMarkup`和`React.renderToString`之间的唯一区别是，`React.renderToStaticMarkup`不会创建额外的\
  \ DOM 属性，如`data-react-id`，这些属性是`React`在客户端用来跟踪 DOM 的。由于电子邮件不在浏览器中运行客户端，我们不需要这些属性。\n\
  \n让我们根据这个桌面和移动端的设计，用`React`构建一封电子邮件：\n\n![替代文本](img/Portrait.png)![替代文本](img/Mobile_Portrait.png)\n\
  \n为了渲染电子邮件，我们编写了一个小脚本，输出可用于发送电子邮件的 HTML：\n\n```\n // render_email.js\nvar ReactDOMServer\
  \ = require('react-dom/server');\nvar SurveyEmail = require('survey_email');\nvar\
  \ survey = {};\n\nconsole.log(\n  ReactDOMServer.renderToStaticMarkup(<SurveyEmail\
  \ survey={survey}/>)\n);\n```\n\n让我们开始构建`SurveyEmail`的核心结构。首先，构建一个`Email`组件：\n\n\
  ```\n class Email extends React.Component {\n  render() {\n    return (\n      <html>\n\
  \        <body>\n          {this.prop.children}\n        </body>\n      </html>\n\
  \    );\n  }\n}\n```\n\n`<SurveyEmail/>`组件使用`<Email/>`：\n\n```\n class SurveyEmail\
  \ extends React.Component {\n  render() {\n    var survey = this.props.survey;\n\
  \    return (\n      <Email>\n        <h2>{survey.title}</h2>\n      </Email>\n\
  \    );\n  }\n}\n\nSurveyEmail.propTypes = {\n  survey: React.PropTypes.object.isRequired\n\
  };\n```\n\n接下来，根据设计，在桌面客户端上并排渲染两个 KPI，在移动设备上堆叠渲染。每个 KPI 在结构上相似，因此它们可以共享同一个组件：\n\n\
  ```\n class SurveyEmail extends React.Component {\n  render() {\n    return (\n\
  \      <table className='kpi'>\n        <tr>\n          <td>{this.props.kpi}</td>\n\
  \        </tr>\n        <tr>\n          <td>{this.props.label}</td>\n        </tr>\n\
  \      </table>\n    );\n  }\n}\n```\n\n\n\n\n让我们将它们添加到 `<SurveyEmail/>` 组件中：\n\n\
  ```\n class SurveyEmail extends React.Component {\n  render() {\n    var survey\
  \ = this.props.survey;\n    var completions = survey.activity.reduce((memo, ac)\
  \ => {\n      return memo + ac;\n    }, 0);\n    var daysRunning = survey.activity.length;\n\
  \n    return (\n      <Email>\n        <h2>{survey.title}</h2>\n        <KPI kpi={completions}\
  \ label='Completions'/>\n        <KPI kpi={daysRunning} label='Days running'/>\n\
  \      </Email>\n    );\n  }\n}\n\nSurveyEmail.propTypes = {\n  survey: React.PropTypes.object.isRequired\n\
  };\n```\n\n这样会堆叠我们的 KPI，但设计上希望它们在桌面端并排显示。现在的挑战是让它在桌面端和移动端都能正常工作。要解决这个问题，我们首先需要了解一些注意事项。\n\
  \n让我们为 `<Email/>` 增加一种添加 CSS 文件的方式：\n\n```\n var fs = require(‘fs’);\nclass Email\
  \ extends React.Component {\n  render() {\n    var responsiveCSSFile = this.props.responsiveCSSFile;\n\
  \    var styles;\n    if (responsiveCSSFile) {\n      styles = <style>{fs.readFileSync(responsiveCSSFile)}</style>;\n\
  \    }\n    return (\n      <html>\n        <body>\n          {styles}\n       \
  \   {this.prop.children}\n       </body>\n     </html>\n    );\n  }\n}\n\nEmail.propTypes\
  \ = {\n  responsiveCSSFile: React.PropTypes.string\n};\n```\n\n完整的 `<SurveyEmail/>`\
  \ 如下所示：\n\n```\n class SurveyEmail extends React.Component {\n  render() {\n   \
  \ var survey = this.props.survey;\n    var completions = survey.activity.reduce((memo,\
  \ ac) => {\n      return memo + ac;\n    }, 0);\n\n    var daysRunning = survey.activity.length;\n\
  \n    return (\n      <Email responsiveCSS='path/to/mobile.css'>\n        <h2>{survey.title}</h2>\n\
  \        <table className='for-desktop'>\n          <tr>\n            <td>\n   \
  \           <KPI kpi={completions} label='Completions'/>\n            </td>\n  \
  \          <td>\n              <KPI kpi={daysRunning} label='Days running'/>\n \
  \           </td>\n          </tr>\n        </table>\n        <div className='for-mobile'>\n\
  \          <KPI kpi={completions} label='Completions'/>\n          <KPI kpi={daysRunning}\
  \ label='Days running'/>\n        </div>\n      </Email>\n    );\n  }\n}\n\nSurveyEmail.propTypes:\
  \ {\n  survey: React.PropTypes.object.isRequired\n};\n```\n\n我们将 Email 分成了桌面端和移动端两组。遗憾的是，在邮件中不能使用类似\
  \ `float: left` 这样的属性，因为大多数浏览器不支持。而且 HTML 规范指出 `align` 和 `valign` 属性已过时，因此 React\
  \ 也不支持这些属性。不过，它们本可以提供类似浮动两个 `div` 的实现方式。现在我们只能保留两组内容，通过响应式样式表根据屏幕尺寸来隐藏或显示。\n\n尽管必须使用表格，但很明显，使用\
  \ React 渲染邮件能带来与为浏览器编写交互式 UI 相同的诸多好处：可复用、可组合且可测试的组件。\n\n## 图表\n\nReact 支持 SVG 标签，因此制作一个简单的\
  \ SVG 变得轻而易举。\n\n要渲染一个迷你图（我们以此为例），你只需要一个带有指令集的 `<Path/>`。\n\n完整的示例如下：\n\n```\n class\
  \ Sparkline extends React.Component {\n  render() {\n    var width = 200;\n    var\
  \ height = 20;\n    var path = this.generatePath(width, height, this.props.points);\n\
  \n    return (\n      <svg width={width} height={height}>\n        <path d={path}\
  \ stroke='#7ED321' strokeWidth='2' fill='none'/>\n      </svg>\n    );\n  },\n\n\
  \  generatePath(width, height, points) {\n    var maxHeight = arrMax(points);\n\
  \    var maxWidth = points.length;\n\n    return points.map((p, i) => {\n      var\
  \ xPct = i / maxWidth * 100;\n      var x = (width / 100) * xPct;\n      var yPct\
  \ = 100 - (p / maxHeight * 100);\n      var y = (height / 100) * yPct;\n\n     \
  \ if (i === 0) {\n        return 'M0,' + y;\n      }\n      else {\n        return\
  \ 'L' + x + ',' + y;\n      }\n    }).join(' ');\n  }\n}\n\nSparkline.propTypes\
  \ = {\n  points: React.PropTypes.arrayOf(React.PropTypes.number).isRequired\n};\n\
  ```\n\n上面的 Sparkline 组件需要一个表示数据点的数字数组。然后它会构建一个带有路径的简单 SVG。\n\n有趣的部分在于 `generatePath`\
  \ 函数，它计算每个点的渲染位置并返回一个 SVG 路径描述。\n\n它返回类似这样的字符串：“M0,30 L10,20 L20,50”。SVG 路径将其转换为绘图命令。每个命令由空格分隔。“M0,30”表示将光标移动到\
  \ x0 和 y30。然后“L10,20”表示从当前光标画一条线到 x10 和 y20，以此类推。\n\n对于更大的图表，手动编写这样的缩放函数可能会很繁琐，但引入像\
  \ D3 这样的库并使用其提供的缩放函数来替代手动创建路径则相当简单：\n\n```\n class Sparkline extends React.Component\
  \ {\n  render() {\n    var width = 200;\n    var height = 20;\n    var points =\
  \ this.props.points.map((p, i) => {\n      return { y: p, x: i };\n    });\n\n \
  \   var xScale = d3.scale.linear()\n      .domain([0, points.length])\n      .range([0,\
  \ width]);\n\n    var yScale = d3.scale.linear()\n      .domain([0, arrMax(this.props.points)])\n\
  \      .range([height, 0]);\n\n    var line = d3.svg.line()\n      .x(function (d)\
  \ { return xScale(d.x) })\n      .y(function (d) { return yScale(d.y) })\n     \
  \  .interpolate('linear');\n\n    return (\n      <svg width={width} height={height}>\n\
  \        <path d={line(points)} stroke='#7ED321' strokeWidth='2' fill='none'/>\n\
  \      </svg>\n    );\n  }\n}\n\nSparkline.propTypes = {\n  points: React.PropTypes.arrayOf(React.PropTypes.number).isRequired\n\
  };\n```\n\n## 总结\n\n在本章中，我们学到了：\n\n1.  React 不仅限于浏览器，还可以用于构建桌面应用和邮件。\n\n2.  如何使用\
  \ React 辅助游戏开发。\n\n3.  React 是图表开发的绝佳选择，并且与 D3 等库配合得很好。\n\n现在你已经完成了本书的学习，应该能够使用\
  \ React 创建各种有趣的应用程序了。\n"
