- "# React.js 前沿开发（第二版）：用于用户界面的JavaScript库\n\n# 前言\n\n## 什么是 React，为什么要使用它？\n\nReact\
  \ 是 Facebook 内部开发并于 2013 年开源的一个 JavaScript 库，用于构建交互式 Web 用户界面。它引入了一种处理浏览器 DOM 的新方式。手动更新\
  \ DOM 并费力地跟踪每一块状态的日子已经一去不复返了，这种做法使得可扩展性和新功能开发充其量只是一项冒险。相反，React 以一种非常新颖的方式处理 DOM。你可以声明式地定义任意时间点的用户界面。React\
  \ 消除了担心数据变化时 DOM 的哪一部分需要更新的问题，并让你能够在任意时间点以最少的 DOM 更改重新渲染整个应用程序。\n\n## 本书如何提供帮助\n\
  \nReact 引入了挑战当前实践的新颖且令人兴奋的概念。本书将帮助你驾驭所有这些概念，并帮助你理解它们为何有益，以及如何帮助你构建可扩展的单页应用程序（SPA）。\n\
  \nReact 主要关注应用程序的“视图”部分，因此不规定服务器通信或代码组织方式。在本书中，我们将介绍当前的最佳实践和补充工具，以帮助你使用 React 构建完整的应用程序。\n\
  \n## 阅读本书前需要了解什么？\n\n为了充分利用本书，你需要具备 JavaScript 和 HTML 的经验。如果你有编写 SPA 的经验（无论使用 Backbone.js、AngularJS\
  \ 还是 Ember.js 等框架），那会很有帮助，但并非必需。\n\n## 源代码和示例应用程序\n\n在本书中，我们将引用示例应用程序的片段：reddit\
  \ 克隆版。你可以在 [`git.io/vlcpa`](http://git.io/vlcpa) 阅读完整源代码，并在 [`git.io/vlCUI`](http://git.io/vlCUI)\
  \ 查看在线演示。\n\n## 写作过程\n\n本书是在一两个月内以专注的虚拟书籍冲刺方式写成的。这个过程有助于创建新鲜且当前的内容，而传统书籍往往落后于前沿趋势和技术的报道。\n\
  \n在第二版中，所有内容都已更新到 React 0.14，并创建了一个新的示例应用程序。\n\n## 作者\n\n本书由经验丰富且专注的 JavaScript\
  \ 开发者团队编写：\n\n![Richard Feldman](img/rtfeldman125.png)\n\n**Richard Feldman** 是\
  \ NoRedInk 的首席前端工程师，这是一家位于旧金山的教育科技公司。他是函数式编程爱好者、会议演讲者，以及 `seamless-immutable` 的作者，这是一个提供与普通\
  \ JavaScript 对象和数组向后兼容的不可变数据结构的开源库。他在 Twitter 和 GitHub 上的账号都是 @rtfeldman。\n\n* *\
  \ *\n\n![Frankie Bagnardi](img/fbagnardi125.png)\n\n**Frankie Bagnardi** 是一名高级前端开发人员，为各种客户创建用户体验。在空闲时间，他在\
  \ StackOverflow（FakeRainBrigand）和 IRC（GreenJello）上回答问题，并喜欢做小项目。你可以通过 f.bagnardi@gmail.com\
  \ 联系他。\n\n* * *\n\n![Simon Højberg](img/hojberg125.png)\n\n**Simon Højberg** 是罗德岛州普罗维登斯\
  \ Swipely 公司的高级 UI 工程师。他是 Providence JS 聚会小组的联合组织者，曾任波士顿 Startup Institute 的 JavaScript\
  \ 讲师。他致力于使用 JavaScript 构建功能性用户界面，并从事像 cssarrowplease.com 这样的副项目。Simon 的推特账号是 [@shojberg](https://twitter.com/shojberg)。\n\
  \n* * *\n\n![Jeremiah Hall](img/HallPic125.jpg)\n\n**Jeremiah Hall** 目前是 OpenGov\
  \ Inc. 的高级软件工程师/架构师。他还是 Aspect Apps 的创始人，正在构建一个使用 React Native 和 JavaScript 作为 UI\
  \ 的日志记录应用程序。你可以在 Twitter 上找到他 [@jeremiahrhall](https://twitter.com/jeremiahrhall)。\n\
  \n# 第 1 章 React 简介\n\n## 背景\n\n在 Web 开发的早期，前端代码库很小，JavaScript 功能不足。得益于多年来浏览器在 JavaScript\
  \ 性能上相互超越、不断突破极限，如今的 Web 应用能够提供与原生应用相媲美的用户体验。随着 Web 应用变得越来越丰富和雄心勃勃，在保持强大性能的同时扩展\
  \ JavaScript 代码库现在比以往任何时候都更具挑战性。\n\n历史上，许多 JavaScript 库优先考虑性能或代码组织——通过使跨浏览器的高性能\
  \ DOM 操作更容易，或通过提供使代码更易于扩展的组织模式。React 通过同时轻松实现性能改进和代码扩展而迅速流行起来。这种强大的组合使其成为 GitHub\
  \ 上最受欢迎的十大库之一。\n\nReact 最初是 Facebook 的一个 PHP 框架 XHP 的移植版本。作为一个 PHP 框架，XHP 被设计为每次请求时渲染整个页面。React\
  \ 的诞生是为了将重新渲染整个页面的 PHP 风格工作流引入客户端应用程序。\n\nReact 本质上是一个“状态机”，帮助你管理随时间变化的状态的复杂性。它通过拥有非常狭窄的范围来实现这一点。它只关心两件事：\n\
  \n1.  更新 DOM\n\n2.  响应事件\n\nReact 对 AJAX、路由、存储或如何组织数据没有意见。它不是模型-视图-控制器框架；如果非要归类，它只是\
  \ MVC 中的 V。这种狭窄的范围让你可以自由地将 React 集成到各种系统中。事实上，它已被用于在几个流行的 MVC 框架中渲染视图。\n\n每次状态变化时重新渲染整个页面在\
  \ JavaScript 中非常慢，因为读取和更新 DOM 会带来性能损失。React 有一个非常强大的渲染系统，使用虚拟 DOM，使得 React 只需要更新\
  \ DOM 而无需读取 DOM。\n\n就像高性能的 3D 游戏引擎一样，React 围绕渲染函数构建，这些函数获取世界状态并将其转换为结果页面的虚拟表示。每当\
  \ React 被告知状态变化时，它会重新运行这些函数以确定页面的新虚拟表示，然后自动将该结果转换为必要的 DOM 更改以反映新的呈现。\n\n乍一看，这听起来应该比通常的按需更新每个元素的\
  \ JavaScript 方法更慢。然而，在幕后，React 正是这样做的：它有一个非常高效的算法来确定当前虚拟页面表示与新表示之间的差异。根据这些差异，它对\
  \ DOM 进行最小必要的一组更新。\n\n这对性能有利的原因在于，它最大限度地减少了回流和不必要的 DOM 突变，这两者都是性能不佳的常见原因。\n\n\n\n\
  \n\n你的界面越大，就越有可能出现一个交互触发更新，进而触发另一个更新，再触发另一个更新的情况。当这些级联更新没有正确批处理时，性能就会大幅下降。更糟糕的是，有时\
  \ DOM 元素在到达最终状态之前会被多次更新。\n\nReact 的虚拟表示差异比较不仅通过单次执行最小更新集来最大程度地减少这些问题，还简化了应用程序的维护。当世界状态因用户输入或外部更新而发生变化时，你只需通知\
  \ React 状态变化，它就会自动处理其余部分。无需微观管理整个过程。\n\nReact 为整个应用程序使用单个事件处理程序，并将所有事件委托给该事件处理程序。这也提升了\
  \ React 的性能，因为拥有许多事件处理程序可能会带来显著的性能损失。\n\n你可以在 [`git.io/vlcpa`](http://git.io/vlcpa)\
  \ 阅读本书中使用的示例应用程序的完整源代码。\n\n# 第 2 章 JSX\n\n在 React 中，组件用于分离关注点，而不是模板和显示逻辑。使用 React\
  \ 时，你必须接受这样一个理念：标记及其生成代码本质上是紧密相连的。这让你在构建标记时能够拥有 JavaScript 的全部表达能力，而无需诉诸笨拙或繁琐的模板语言。\n\
  \n\n\n\n\nReact 与一种可选的标记语法配合良好，并且与 HTML 非常相似。但在继续之前，我们先澄清一点——对于那些因 JavaScript 中标记的明显笨拙而感到反感的人，以及那些不相信\
  \ `JSX` 有用性的人，请考虑一下这种方法在 React 中的诸多好处：\n\n* 它允许使用熟悉的标记来定义元素树\n* 提供更具语义、更易于理解的标记\n\
  * 更容易可视化应用程序的结构\n* 抽象了 React 元素的创建\n* 将标记和生成标记的代码紧密联系在一起\n* 它只是纯 JavaScript\n\n\
  在本章中，我们将探讨 `JSX` 的诸多好处，以及如何使用它，同时还会介绍一些使其与 HTML 有所区别的注意事项。请记住，`JSX` 是可选的。如果你选择不使用\
  \ `JSX`，可以跳到本章末尾，了解如何在不使用它的情况下使用 React。\n\n本书将使用最新版本的 JavaScript，即 ES6（或 ES2015）。你可以在这里找到很好的入门介绍：[`babeljs.io/docs/learn-es2015/`](https://babeljs.io/docs/learn-es2015/)。\n\
  \n## 什么是 JSX？\n\n`JSX` 代表 JavaScript XML——一种类似 XML 的语法，用于在 React 组件中构建标记。React 可以在没有\
  \ `JSX` 的情况下工作，但使用它可以使你的组件更具可读性，因此推荐使用。\n\n例如，在纯 React 中创建一个标题的函数调用可能如下所示：\n\n```\n\
  \ React.createElement('h1', {className: 'question'}, 'Questions');\n```\n\n但使用 `JSX`\
  \ 后，它变成了更熟悉且简洁的标记：\n\n```\n <h1 className=\"question\">Questions</h1>\n```\n\n与过去尝试将标记嵌入\
  \ JavaScript 的做法相比，`JSX` 有几个显著的特点：\n\n1. `JSX` 是一种语法转换——每个 `JSX` 节点都映射到一个 JavaScript\
  \ 函数。\n2. `JSX` 既不提供也不要求运行时库。\n3. `JSX` 不会改变或增加 JavaScript 的语义——它只是简单的函数调用。\n\n\
  `JSX` 与 HTML 的相似性赋予了它在 React 中强大的表达能力。这里我们将讨论 `JSX` 的好处及其在应用程序中的用途，以及 `JSX` 与 HTML\
  \ 之间的关键区别。\n\n## JSX 的好处\n\n许多人在考虑 `JSX` 时会问：为什么？既然有大量现有的模板语言，为什么还要使用它？为什么不直接使用纯\
  \ JavaScript？毕竟，`JSX` 只是映射到 JavaScript 函数。\n\n使用 `JSX` 有很多好处，而且随着代码库的增大和组件复杂度的提高，这些好处会变得更加明显。现在我们来讨论其中的一些好处。\n\
  \n### 熟悉性\n\n许多开发团队包括非开发人员，从熟悉 HTML 的 UI 和 UX 设计师，到负责全面测试产品的质量保证团队。这些团队成员可以更轻松地阅读和贡献\
  \ `JSX` 项目的代码。任何熟悉基于 XML 的语言的人都可以轻松上手 `JSX`。\n\n此外，由于 React 组件捕获了 DOM 的所有可能表示（稍后会详细介绍），`JSX`\
  \ 提供了一种紧凑而简洁的方式来表示和可视化这种结构。\n\n### 语义性\n\n除了熟悉性之外，`JSX` 还将你的 JavaScript 代码转换为更具语义、更有意义的标记。这让你能够使用类似\
  \ HTML 的语法声明组件结构和信息流，同时知道它稍后会转换为纯 JavaScript。\n\n`JSX` 允许你在应用程序的标记中使用所有预定义的 HTML5\
  \ 标签名称，以及你自己的自定义组件。稍后你会读到关于定义自定义组件的内容，这里你只需看到 `JSX` 如何让你的 JavaScript 更具可读性。\n\n\
  例如，让我们考虑一个 `Divider` 元素，它在左侧渲染一个标题，右侧渲染一个水平分隔线。这个分隔线的 `JSX` 如下所示：\n\n```\n <div\
  \ className=\"divider\">\n  <h2>Questions</h2><hr />\n</div>\n```\n\n将其包装到 `Divider`\
  \ React 组件后，你可以像使用任何其他 HTML 元素一样使用它，同时还能获得更丰富语义的标记。\n\n```\n <Divider>Questions</Divider>\n\
  ```\n\n### 易于可视化\n\n`JSX` 甚至让像这样的小例子也更清晰、更简洁。然而，在拥有数百个组件和深层标记树的大型项目中，这种好处会被放大。\n\
  \n以下是上面提到的 `Divider` 组件。请注意，在 JavaScript 函数的上下文中，标记的意图比纯 JavaScript 版本更清晰、更易读。\n\
  \n纯 JavaScript 版本：\n\n```\n render: function () {\n  return React.createElement('div',\
  \ {className:\"divider\"},\n    \"Label Text\",\n    React.createElement('hr')\n\
  \  );\n}\n```\n\n`JSX` 标记版本：\n\n```\n render: function () {\n  return (\n    <div\
  \ className=\"divider\">\n      Label Text<hr />\n    </div>\n  );\n}\n```\n\n大多数人都认为\
  \ `JSX` 标记更易于理解和调试。\n\n### 关注点分离\n\n最后，React 的核心思想是标记和生成标记的代码本质上是紧密相连的。在 React 中，你不会将应用程序的技术分离成视图文件和模板文件。相反，React\
  \ 鼓励你创建离散的组件，将所有逻辑和标记封装在一个定义中。\n\n`JSX` 提供了一种干净而简洁的方式，将组件的标记与业务逻辑分开。它不仅为描述组件树提供了一种清晰的视觉语言，还使你的应用程序更易于推理。\n\
  \n## 复合组件\n\n现在你已经了解了 `JSX` 的一些好处，并看到了如何使用它来以紧凑的标记格式表达组件，让我们看看它如何帮助组装多个组件。\n\n本节内容包括：\n\
  \n* 设置一个包含 `JSX` 的 JavaScript 文件\n* 引导你完成组件的组装\n* 讨论组件所有权和父子关系\n\n让我们逐一来看。\n\n###\
  \ 定义自定义组件\n\n继续使用前面提到的页面分隔线，这里再次是我们期望输出的 HTML。\n\n```\n <div class=\"divider\">\n\
  \  <h2>Questions</h2><hr>\n</div>\n```\n\n要将此 HTML 表达为 React 组件，只需像下面这样包装它，使 `render`\
  \ 函数返回标记（稍后会解释一些小的更改）。\n\n```\n class Divider extends React.Component {\n  render()\
  \ {\n    return (\n      <div className=\"divider\">\n        <h2>Questions</h2><hr\
  \ />\n      </div>\n    );\n  }\n};\n```\n\n当然，这目前是一个一次性组件。要使其真正有用，你需要能够动态表达 `h2`\
  \ 标签中的文本。\n\n### 动态值\n\n`JSX` 使用花括号 `{...}` 渲染动态值。花括号表示 JavaScript 上下文——你放在它们之间的任何内容都会被求值，结果将作为节点渲染到标记中。\n\
  \n对于简单的值，如文本或数字，你可以直接引用变量。你可以像这样渲染动态的 `h2` 标签：\n\n```\n var text = 'Questions';\n\
  <h2>{text}</h2>\n\n// <h2>Questions</h2>\n```\n\n对于更复杂的逻辑，你可能希望将计算委托给一个函数。你可以通过在花括号内调用该函数来渲染其结果：\n\
  \n```\n function dateToString(d) {\n  return [\n    d.getFullYear(), \n    d.getMonth()\
  \ + 1, \n    d.getDate()\n  ].join('-');\n};\n\n<h2>{dateToString(new Date())}</h2>\n\
  \n// <h2>2014-10-18</h2>\n```\n\nReact 会自动求值数组，将数组中的每个项渲染为一个节点。\n\n```\n var text\
  \ = ['hello', 'world'];\n<h2>{text}</h2>\n\n// <h2>helloworld</h2>\n```\n\n通常你可能希望渲染比简单值更复杂的内容。例如，你可能希望将数据数组渲染为\
  \ `<li>` 元素。这就引出了子节点的概念。\n\n### 子节点\n\n在 HTML 中，你使用 `<h2>Questions</h2>` 渲染一个标题，其中文本\
  \ \"Questions\" 成为 `h2` 元素的子文本节点。所以这里的目标是在 `JSX` 中表达分隔线，如下所示：\n\n\n\n\n\n```\n <Divider>Questions</Divider>\n\
  ```\n\nReact 会将开闭标签之间的所有子节点捕获到一个特殊的组件属性 `this.props.children` 中。在这个例子中，`this.props.children\
  \ == \"Questions\"`。`children` 属性的实际结构并未文档化，因此不要尝试访问其内容，只需原样传递即可。\n\n掌握了这一点，你就可以将硬编码的文本“Questions”替换为变量\
  \ `this.props.children`。现在，React 会渲染你放在 `<Divider>` 标签内的任何内容。\n\n```\n class Divider\
  \ extends React.Component {\n  render() {\n    return (\n      <div className=\"\
  divider\">\n        <h2>{this.props.children}</h2><hr />\n      </div>\n    );\n\
  \  }\n};\n```\n\n现在，你可以像使用任何 HTML 元素一样使用 `<Divider>` 组件。\n\n```\n <Divider>Questions</Divider>\n\
  ```\n\n当通过 JSX 转换器运行时，上述声明将转换为以下 JavaScript（假设目标为 ES6）。\n\n```\n class Divider extends\
  \ React.Component {\n  render() {\n    return (\n      React.createElement(\"div\"\
  , {className: \"divider\"}, \n        React.createElement(\"h2\", null, this.props.children),\
  \ \n        React.createElement(\"hr\", null)\n      )\n    );\n  }\n};\n```\n\n\
  输出结果将完全符合你的预期。\n\n```\n <div className=\"divider\">\n  <h2>Questions</h2><hr />\n\
  </div>\n```\n\n## JSX 与 HTML 有何不同？\n\nJSX 类似 HTML，但它并非 HTML 语法的完美复制（这是有充分理由的）。事实上，JSX\
  \ 规范指出：\n\n> 本规范不试图符合任何 XML 或 HTML 规范。JSX 被设计为 ECMAScript 特性，与 XML 的相似性仅是为了熟悉感。^(1)\n\
  \n下面我们将探讨 JSX 与 HTML 语法之间的一些关键区别。\n\n### 属性\n\n在 HTML 中，你以内联方式设置每个节点的属性，如下所示：\n\n\
  ```\n <div id=\"some-id\" class=\"some-class-name\">...</div>\n```\n\nJSX 以相同的方式实现属性，其巨大优势在于你可以将属性设置为动态的\
  \ JavaScript 变量。只需将 JavaScript 变量用花括号括起来，而不是引号。\n\n```\n var surveyQuestionId =\
  \ this.props.id;\nvar classes = 'some-class-name';\n...\n<div id={surveyQuestionId}\
  \ className={classes}>...</div>\n```\n\n对于更复杂的情况，你可以将属性设置为函数调用的结果。\n\n```\n <div\
  \ id={this.getSurveyId()} >...</div>\n```\n\n现在，每次 React 选择渲染组件时，变量和函数调用都会被求值，生成的\
  \ DOM 将反映这一新状态。\n\n你可以在 [`git.io/vlcpa`](http://git.io/vlcpa) 阅读我们的示例应用（一个调查问卷构建器）的完整源代码。\n\
  \n### 条件语句\n\n在 React 中，组件的标记和生成它的逻辑本质上是紧密相连的。这意味着你可以充分利用 JavaScript 的全部逻辑能力，例如循环和条件语句。\n\
  \n由于 if/else 逻辑难以用标记表达，因此向组件添加条件逻辑可能会有些棘手。直接将 `if` 语句添加到 JSX 中会导致无效的 JavaScript：\n\
  \n```\n <div className={if(isComplete) { 'is-complete' }}>...</div>\n```\n\n因此，解决方案是使用以下方法之一：\n\
  \n*   使用三元逻辑\n*   设置一个变量并在属性中引用它\n*   将切换逻辑委托给一个函数\n*   使用 `&&` 运算符\n\n以下是一个快速示例，展示每种方法可能的样子。\n\
  \n#### 使用三元运算符\n\n```\n ...\nrender() {\n  return (\n    <div \n      className={this.state.isComplete\
  \ ? 'is-complete' : ''}\n    >\n      ...\n    </div>\n  );\n}\n...\n```\n\n虽然三元运算符在文本处理中效果不错，但当你想在两种情况下都使用\
  \ React 组件时，它可能会变得冗长且难以阅读。对于这些情况，最好使用以下方法。\n\n#### 使用变量\n\n```\n ...\ngetIsComplete()\
  \ {\n  return this.state.isComplete ? 'is-complete' : '';\n}\nrender() {\n  var\
  \ isComplete = this.getIsComplete();\n  return (\n    <div className={isComplete}>...</div>\n\
  \  );\n}\n...\n```\n\n#### 使用函数调用\n\n```\n ...\ngetIsComplete() {\n  return this.state.isComplete\
  \ ? 'is-complete' : '';\n}\nrender() {\n  return (\n    <div className={this.getIsComplete()}>...</div>\n\
  \  );\n}\n...\n```\n\n#### 使用双与（`&&`）运算符\n\n由于 React 不会为 null 或 false 值输出任何内容，你可以使用一个布尔值，后跟所需的输出字符串。如果布尔值为\
  \ true，则使用后面的字符串。\n\n```\n render() {\n  return (\n    <div className={this.state.isComplete\
  \ && 'is-complete'}>\n      ...\n    </div>\n  );\n}\n```\n\n### 非 DOM 属性\n\nJSX\
  \ 中存在以下特殊属性名称：\n\n*   `key`\n*   `ref`\n*   `dangerouslySetInnerHTML`\n\n下面我们将详细探讨它们。\n\
  \n#### 键（Keys）\n\n`key` 是一个可选的唯一标识符。项目或列表可能会相对于其兄弟元素发生变化，例如当用户执行搜索，或者列表中的项目被添加、删除或重新排序时。发生这种情况时，你的组件可能会被不必要地销毁和重建，或者\
  \ React 可能会执行幼稚的更新。\n\n通过在组件上设置一个在渲染过程中保持一致的唯一键，你可以告知 React，使其更智能地决定何时重用或销毁组件，从而提高渲染性能。然后，当\
  \ DOM 中已有的两个项目交换位置时，React 可以匹配键并移动它们，而无需完全重新渲染它们的 DOM。\n\n#### 引用（References）\n\n\
  `ref` 允许父组件在渲染函数之外保留对子组件的引用。\n\n你可以在 JSX 中通过将属性设置为所需的引用名称来定义 ref。\n\n```\n ...\n\
  render() {\n  return <div>\n    <input ref=\"myInput\" ... />\n  </div>;\n}\n...\n\
  ```\n\n之后，你可以在组件中的任何位置使用 `this.refs.myInput` 来访问这个 ref。对于像 input 这样的 DOM 组件，ref\
  \ 就是对应的 DOM 节点。对于复合组件，ref 是组件实例。在实践中，你很少会在 React 中使用 refs，它们充当了从 React 声明式特性中逃逸的出口。\n\
  \n更多细节请参见第 6 章中关于父/子关系与所有权关系的讨论。\n\n#### 设置原始 HTML\n\n`dangerouslySetInnerHTML`——有时你需要将\
  \ HTML 内容设置为字符串，尤其是在与通过字符串操作 DOM 的第三方库一起工作时。为了提高 React 的互操作性，这个属性允许你使用 HTML 字符串，但如果可以避免，不建议使用。要使用此属性，请将其设置为一个对象，其中键\
  \ `__html` 被设置，如下所示：\n\n```\n ...\nrender() {\n  var htmlString = {\n    __html:\
  \ \"<span>an html string</span>\"\n  };\n  return <div dangerouslySetInnerHTML={htmlString}\
  \ ></div>;\n}\n...\n```\n\n### dangerouslySetInnerHTML\n\n`dangerouslySetInnerHTML`\
  \ 可能很快会发生变化，如下所述：\n\n[`github.com/facebook/react/issues/2134`](https://github.com/facebook/react/issues/2134)\n\
  \n[`github.com/facebook/react/pull/1515`](https://github.com/facebook/react/pull/1515)\n\
  \n### 事件\n\n事件名称在所有浏览器中都是标准化的，并以驼峰式表示。例如，`change` 变为 `onChange`，`click` 变为 `onClick`。在\
  \ JSX 中捕获事件就像将属性分配给组件上的方法一样简单。\n\n```\n ...\nhandleClick(event) {...}\nrender()\
  \ {\n  return (\n    <div \n      onClick={(e) => this.handleClick(e)}\n    >\n\
  \      ...\n    </div>\n  );\n}\n...\n```\n\n注意，这里使用了箭头函数，因为它保留了 `this`。否则，`this`\
  \ 在 `handleClick` 中将是未定义的。它还让你可以轻松控制传递给函数的参数。\n\n有关 React 事件系统的更多详细信息，请参考第 9 章。\n\
  \n### 注释\n\nJSX 是 JavaScript，因此你可以在 JSX 标记中添加普通的 JavaScript 注释。注释可以添加在两个位置：\n\n\
  1.  作为元素的子节点\n2.  内联在节点的属性中\n\n#### 作为子节点\n\n\n\n\n子节点注释只需用花括号包裹，并且可以跨越多行。\n\n```\n\
  \ <div>\n  {/* 关于这个输入框的注释\n      跨越多行 */}\n  <input name=\"email\" placeholder=\"\
  邮箱地址\" />\n</div>\n```\n\n**内联属性**\n\n内联注释有两种形式。首先，你可以使用多行注释：\n\n```\n <div>\n \
  \ <input \n    /* \n      关于输入框的说明 \n    */ \n    name=\"email\"\n    placeholder=\"\
  邮箱地址\" />\n</div>\n```\n\n或者，你可以使用单行注释：\n\n```\n <div>\n  <input\n    name=\"email\"\
  \ // 单行注释\n    placeholder=\"邮箱地址\" />\n</div>\n```\n\n### 特殊属性\n\n由于 JSX 会转换为普通的\
  \ JavaScript 函数调用，因此有一些关键字你不能使用：`class` 和 `for`。\n\n要创建带有 `for` 属性的表单标签，请使用 `htmlFor`。\n\
  \n```\n <label htmlFor=\"for-text\" ... >\n```\n\n要渲染自定义的 `class`，请使用 `className`。如果你习惯了\
  \ HTML，这可能会觉得奇怪，但它与原生 JavaScript 更加一致——在原生 JavaScript 中，你可以通过 `elem.className` 访问元素的类。\n\
  \n```\n <div className={classes} ... >\n```\n\n### 样式\n\n最后，我们来探讨内联样式属性。React 将所有样式规范化为驼峰命名，与\
  \ DOM 样式的 JavaScript 属性保持一致。\n\n要定义自定义样式属性，只需传入一个 JavaScript 对象，其中包含驼峰命名的属性名和所需的\
  \ CSS 值。\n\n```\n var styles = {\n  borderColor: \"#999\",\n  borderThickness: \"\
  1px\"\n};\nReact.renderComponent(<div style={styles}>...</div>, node);\n```\n\n\
  ## 不使用 JSX 的 React\n\n所有 JSX 标记最终都会转换为普通的 JavaScript。因此，使用 React 并不*必须*使用 JSX。然而，JSX\
  \ 隐藏了一些复杂性。如果你打算在不使用 JSX 的情况下使用 React，你需要了解在 React 中创建元素的三个部分：\n\n1.  定义组件类\n\n\
  2.  创建用于生成组件类实例的工厂函数\n\n3.  使用工厂函数创建 `ReactElement` 实例\n\n### 创建 React 元素\n\n回想一下我们之前如何定义\
  \ `Divider` 组件类。这里为了明确其用途，将其重命名为 `DividerClass`。\n\n```\n class DividerClass extends\
  \ React.Component\n  render() {\n    return (\n      React.createElement(\"div\"\
  , {className: \"divider\"}, \n        React.createElement(\"h2\", null, this.props.children), \n\
          React.createElement(\"hr\", null)\n      )\n    );\n  }\n});\n```\n\n要在不使用\
  \ JSX 的情况下使用这个 `DividerClass`，可以调用 `React.createElement` 或 `React.createFactory`。\n\
  \n要直接创建元素，只需调用 `createElement`。\n\n```\n var divider = React.createElement(DividerClass,\
  \ null, '问题');\n```\n\n要创建工厂函数，首先使用 `createFactory` 函数。\n\n```\n var Divider = React.createFactory(DividerClass);\n\
  ```\n\n现在你有了一个工厂函数，就可以用它来创建 `ReactElement` 了。\n\n```\n var divider = Divider(null,\
  \ '问题');\n```\n\n### 延伸阅读与参考资料\n\n即使你不喜欢在 JavaScript 中混入标记，希望你现在也能理解 JSX 如何为 JavaScript\
  \ 与其渲染的标记之间的紧密关系提供解决方案。随着其日益流行，JSX 已经拥有了自己的规范，提供了深入的技术定义。如果你仍然不确定或对其工作原理感到困惑，有一些工具可以帮助你进行实验。\n\
  \n### 官方 JSX 规范\n\n2014 年 9 月，Facebook 发布了 [JSX 官方规范](http://facebook.github.io/jsx/)，阐述了创建\
  \ JSX 的理由以及语法的技术细节。\n\n你可以在 [`facebook.github.io/jsx/`](http://facebook.github.io/jsx/)\
  \ 阅读更多内容。\n\n### 浏览器内实验\n\n还有许多用于实验 JSX 的工具。React 文档的[入门](http://facebook.github.io/react/docs/getting-started.html)页面链接了支持和不支持\
  \ JSX 的 JSFiddle 游乐场。\n\n[`facebook.github.io/react/docs/getting-started.html`](http://facebook.github.io/react/docs/getting-started.html)\n\
  \n对于实际项目，官方工具是 babel，它还提供了几乎完整的 ES6 支持。\n\n[`babeljs.io/`](https://babeljs.io/)\n\
  \n在下一章中，我们将探讨 React 中的组件生命周期。\n\n^(1) 摘自 http://facebook.github.io/jsx/\n\n# 第 3\
  \ 章 组件生命周期\n\n在组件的生命周期中，随着其 props 或 state 的变化，其 DOM 表示也可能发生变化。组件是一个状态机；对于给定的输入，它总是返回相同的输出。\n\
  \nReact 提供了生命周期钩子，使组件能够响应不同的时刻——创建、存在和销毁。我们将按照它们出现的顺序来介绍：首先是实例化，然后是组件的生命周期，最后是组件的销毁。\n\
  \n## 生命周期方法\n\nReact 组件拥有一个最小的生命周期 API，只提供你所需的内容，不会让你感到不知所措。让我们按照它们在组件上被调用的顺序来逐一了解每个方法。\n\
  \n**实例化**\n\n首次创建实例时调用的生命周期方法与后续每个实例调用的方法略有不同。对于组件类的首次使用，你会看到以下方法按顺序被调用：\n\n*  \
  \ `constructor`\n\n*   `componentWillMount`\n\n*   `render`\n\n*   `componentDidMount`\n\
  \n**生命周期**\n\n当应用状态发生变化并影响到你的组件时，你会看到以下方法按顺序被调用：\n\n*   `componentWillReceiveProps`\n\
  \n*   `shouldComponentUpdate`\n\n*   `componentWillUpdate`\n\n*   `render`\n\n*\
  \   `componentDidUpdate`\n\n**销毁与清理**\n\n最后，当你使用完组件时，会调用 `componentWillUnmount`，让实例有机会进行自我清理。\n\
  \n现在，我们将依次介绍这三个阶段：实例化、生命周期和清理。\n\n## 实例化\n\n每当创建新组件并首次渲染时，你可以使用一系列方法来设置和准备组件。每个方法都有特定的职责，如下所述。\n\
  \n### constructor(props, context)\n\n构造函数允许你为组件设置实例属性和状态。一个典型的构造函数如下所示：\n\n```\n\
  \ class Foo extends React.Component {\n  constructor(props){\n    super(); // 调用父类构造函数，必须\n\
      this.state = {x: 'y'};\n  }\n  render(){ ... }\n}\n```\n\n### componentWillMount\n\
  \n在初始渲染之前立即调用。这是在 `render` 方法被调用之前影响组件状态的最后机会。这里只是提一下以保持完整性；它是 `createClass` 的遗留产物，现在已被构造函数取代。\n\
  \n### render\n\n在这里，你构建代表组件输出的虚拟 DOM。Render 是组件唯一必需的方法，并且有特定的规则。`render` 方法的要求如下：\n\
  \n*   它只能访问 `this.props` 和 `this.state` 中的数据。\n\n*   你可以返回 `null`、`false` 或任何 React\
  \ 元素。\n\n*   只能有一个顶级元素（你不能返回一个元素数组）。\n\n*   它必须是*纯的*，意味着它不会改变状态或修改 DOM 输出。\n\nrender\
  \ 返回的结果并不是实际的 DOM，而是一个虚拟表示，React 稍后会将其与真实 DOM 进行差异比较，以确定是否需要做出任何更改。\n\n### componentDidMount\n\
  \n在渲染成功并且实际 DOM 已被渲染之后，你可以通过 `act.findDOMNode(this)` 或使用 ref 在 `componentDidMount`\
  \ 内部访问它。\n\n这是你将用来访问原始 DOM 的生命周期钩子。例如，如果你需要测量渲染输出的高度、使用定时器操作它，或者运行自定义的 jQuery 插件，你都可以在这里进行挂钩。\n\
  \n例如，假设你想在 React 渲染的输入元素上使用 jQuery UI Autocomplete 插件。你可以像这样附加该插件：\n\n\n\n\n\n```\n\
  \ // 用于自动补全的字符串列表\nvar datasource = [...];\n\nclass MyComponent extends React.Component\
  \ {\n  render() {\n    return (\n      <input ... />\n    );\n  }\n  componentDidMount()\
  \ {\n    $(React.findDOMNode(this)).autocomplete({\n      sources: datasource\n\
  \    });\n  }\n});\n```\n\n注意，在服务器端运行时不会调用 `componentDidMount` 方法。\n\n## 生命周期\n\n\
  此时，你的组件已经渲染给用户，用户可以与之交互。通常，这涉及通过点击、触摸或按键事件触发某个事件处理程序。当用户改变组件或整个应用的状态时，新状态会流经组件树，你就有机会对其做出响应。\n\
  \n### componentWillReceiveProps\n\n组件的 props 随时可能通过父组件发生变化。当这种情况发生时，会调用 `componentWillReceiveProps`，你就有机会修改新的\
  \ props 对象并更新状态。\n\n例如，在示例应用中，当用户在不同面板之间导航时，你可以通过从服务器获取相关数据来响应这一变化。\n\n```\n componentWillReceiveProps(nextProps)\
  \ {\n  var boardId = nextProps.params.boardId;\n  if(boardId !== this.props.params.boardId)\
  \ {\n    Actions.State.changeBoard({type: 'board', name: boardId});\n  }\n}\n```\n\
  \n你可以在 [`git.io/vlcpa`](http://git.io/vlcpa) 上阅读我们的示例应用（一个调查构建器）的完整源代码。\n\n## shouldComponentUpdate\n\
  \nReact 很快。但你可以通过使用 `shouldComponentUpdate` 来优化组件渲染的时机，使其更快。\n\n如果你确定新的 props 或\
  \ state 不需要你的组件或其任何子组件重新渲染，则返回 `false`。\n\n*此方法在初始渲染或使用* `forceUpdate` *后不会被调用。*\n\
  \n通过返回 false，你告诉 React 跳过调用 `render` 以及前后的钩子：`componentWillUpdate` 和 `componentDidUpdate`。\n\
  \n此方法不是必需的，在大多数情况下，你在开发过程中不需要使用它。过早使用此方法可能导致微妙的 bug，因此最好等到你能正确评估瓶颈后再选择优化位置。\n\n\
  如果你小心地将 state 视为不可变的，并且只在 render 方法中读取 props 和 state，那么可以放心地重写 `shouldComponentUpdate`\
  \ 来比较旧的 props 和 state 与新的替换值。\n\n另一个性能调优选项是 React 附加组件提供的 `PureRenderMixin`。如果你的组件是*纯的*，即对于相同的\
  \ props 和 state 总是渲染相同的 DOM，那么这个 mixin 会自动使用 `shouldComponentUpdate` 对 props 和 state\
  \ 进行浅比较，如果它们匹配则返回 false。本书后面会介绍使用此 mixin 的示例。\n\n### componentWillUpdate\n\n与 `componentWillMount`\
  \ 类似，当接收到新的 props 或 state 时，此方法会在渲染之前立即触发。\n\n注意，你*不能*在此方法中更新 state 或 props。你应该依赖\
  \ `componentWillReceiveProps` 在运行时更新 state。\n\n### componentDidUpdate\n\n与 `componentDidMount`\
  \ 类似，此方法为你提供了更新已渲染 DOM 的机会。\n\n## 拆卸与清理\n\n当 React 完成对组件的处理后，它必须从 DOM 中卸载并销毁。你有一个钩子来响应这一时刻，执行任何必要的清理和拆卸工作。\n\
  \n### componentWillUnmount\n\n最后，当组件从组件层级中移除时，我们迎来了组件生命的终点。此方法在组件即将被移除之前调用，让你有机会进行清理。你在\
  \ `componentDidMount` 中可能执行的任何自定义工作（例如创建定时器或添加事件监听器）都应在此处撤销。否则会导致错误（如果你在已卸载的组件上调用\
  \ `setState`）以及各种类型的泄漏（内存、监听器等）。\n\n## 反模式：将计算值作为状态\n\n考虑到可以在构造函数中从 `this.props`\
  \ 创建状态，有必要指出一种反模式。你应该非常关注维护单一数据源。React 的设计使得重复数据源更加明显，这是 React 的关键优势之一。\n\n当考虑从\
  \ props 派生的计算值时，将这些值存储为状态被认为是一种反模式。例如，组件可能在渲染前将日期转换为字符串表示形式，或将字符串转换为大写。这些不是状态，而应该在渲染时计算。\n\
  \n当你在 render 函数中无法判断状态值是否与它所基于的 prop 同步时，就可以识别出这种反模式。\n\n```\n class Day extends\
  \ React.Component {\n  constructor(props){\n    super();\n    // 反模式。计算值不应存储为状态。\n\
  \    this.state = {day: props.date.getDay()};\n  }\n  render(){\n    return (\n\
  \       <div>Day: {this.state.day}</div>\n    );\n  }\n}\n```\n\n正确的模式是在渲染时计算值。这保证了计算值永远不会与它所派生的\
  \ props 不同步。\n\n```\n class Day extends React.Component {\n  render(){\n    return\
  \ (\n      <div>Day: {this.props.date.getDay()}</div>\n    );\n  }\n```\n\n## 总结\n\
  \nReact 的生命周期方法为组件的生命周期提供了设计良好的钩子。作为状态机，每个组件都设计为在其生命周期内输出稳定、可预测的标记。\n\n没有组件是孤立存在的。当父组件将\
  \ props 推送给子组件，并且这些子组件渲染它们自己的子组件时，你必须仔细考虑数据如何在应用中流动。每个子组件*真正*需要知道多少？谁拥有应用状态？哪些组件（如果有）需要本地状态？这是我们下一章关于数据流的主题。\n\
  \n# 第 4 章 数据流\n\n在 React 中，数据只朝一个方向流动——从父组件到子组件。这使得组件非常简单且可预测。它们从父组件获取 props 并渲染它们。如果顶层组件的\
  \ prop 发生变化，React 会将该变化一直传播到组件树，并重新渲染所有使用了该属性的组件。\n\n组件也可以拥有内部状态，该状态只能在组件内部修改。React\
  \ 组件本质上是简单的，你可以将它们视为一个函数，接收 `props` 和 `state`，并输出虚拟 DOM 表示。\n\n在本章中，我们将探讨：\n\n*\
  \   什么是 props\n*   什么是 state\n*   何时使用 props，何时使用 state\n\n## Props\n\n`props` 是“属性”的缩写，被传递给组件，可以包含你想要的任何数据。\n\
  \n你可以在实例化组件时设置 props：\n\n```\n var comments = [{ author: 'Example', body: 'Hey'\
  \ }];\n<Comments comments={comments}/\n```\n\n你可以在 [`git.io/vlcpa`](http://git.io/vlcpa)\
  \ 上阅读我们的示例应用（一个调查构建器）的完整源代码。\n\n你可以通过 `this.props` 访问 props，但绝不应该通过这种方式写入 props。组件永远不应修改自己的\
  \ props。\n\n当与 JSX 一起使用时，props 可以设置为字符串：\n\n```\n <Link to=\"/user/example\">示例</Link>\n\
  ```\n\n也可以使用 `{}` 语法设置，这是一个常规的 JavaScript 表达式：\n\n```\n <Link to={'/user/' + comment.author}>{comment.author}</a>\n\
  ```\n\n还可以使用 JSX 展开语法将对象用作 props：\n\n```\n class Button extends React.Component\
  \ {\n  render() {\n    // 这里我们展开所有传入的 props\n    // 但确保使用我们自己的 className 版本\n  \
  \  var className = ['Button', this.props.className].join(' ');\n    return <button\
  \ {...this.props} className={className} />;\n  }\n};\n```\n\nProps 对于事件处理程序也很有用：\n\
  \n\n\n\n\n```javascript\nclass SaveButton extends React.Component {\n  render()\
  \ {\n    return (\n      <Button \n        onClick={() => this.handleClick()}\n\
  \      >\n        Save\n      </Button>\n    );\n  }\n  handleClick() {\n    //\
  \ ...\n  }\n};\n```\n\n这里我们向 `Button` 组件传递了 `onClick` 属性，其值为一个调用 `this.handleClick`\
  \ 的函数。每当用户点击按钮时，`handleClick` 方法就会被调用。\n\n## PropTypes\n\nReact 提供了一种通过组件上定义的配置对象来验证\
  \ props 的方式。这些配置同时也作为快速参考文档。\n\n```javascript\nclass Post extends React.Component\n\
  \  static propTypes = {\n    data: PropTypes.shape({\n      id: PropTypes.string,\n\
  \      url: PropTypes.string,\n      author: PropTypes.string,\n      title: PropTypes.string,\n\
  \      createdAt: PropTypes.number,\n    }).isRequired,   \n  };\n  // ...\n};\n\
  ```\n\n如果组件实例化时未满足 `propTypes` 的要求，则会记录一条 `console.error`。\n\n对于可选的 props，只需去掉 `.isRequired`\
  \ 即可。\n\n你并非必须在应用中使用 `propTypes`，但它们提供了一种描述组件 API 的好方法。\n\n## defaultProps\n\n在组件上提供\
  \ `defaultProps` 对象，以设置一组默认属性。这仅适用于非必需的 props。\n\n```javascript\nvar Button = React.createClass({\n\
  \  static propTypes = {\n    which: PropTypes.oneOf(['primary', 'secondary', 'normal'])\n\
  \  };\n  static defaultProps = {\n    which: 'normal'\n  };\n  // ...\n};\n```\n\
  \n## State\n\nReact 中的每个组件都可以拥有状态（state）。状态与 props 的不同之处在于，它是组件内部的。\n\n状态对于决定元素上的视图状态非常有用。请注意，这个组件包含了你需要了解的关于\
  \ React 的大部分内容，所以[×](https://atlas.oreilly.com/crudloff/reactjs-book/editor/master/04.data.flow.html#)不要指望现在就能完全理解它。\n\
  \n```javascript\nclass SimpleSelect extends React.Component {\n  static propTypes\
  \ = {\n    options: PropTypes.arrayOf(PropTypes.shape({\n      id: PropTypes.any,\n\
  \      name: PropTypes.string,\n    })).isRequired,\n    value: PropTypes.any,\n\
  \    valueText: PropTypes.any,\n    onSelect: PropTypes.func,\n  };\n\n  constructor(){\n\
  \    super();\n    this.state = {open: false,};\n  }\n\n  toggleOpen(){\n    this.setState({open:\
  \ !this.state.open});\n  }\n\n  render(){\n    return (\n      <div>\n        <Button\
  \ onClick={() => this.toggleOpen()}>\n          {this.props.valueText || 'Select\
  \ an option'}\n        </Button>\n        {this.renderItems()}\n      </div>\n \
  \   );\n  }\n\n  renderItems(){\n    if (!this.state.open) return null;\n    return\
  \ (\n      <ul>\n        {this.props.options.map((item, i) => {\n          return\
  \ (\n            <li key={i} onClick={() => this.handleSelect(item)}>\n        \
  \      {item.name}\n            </li>\n          );\n        })}\n      </ul>\n\
  \    );\n  }\n\n  handleSelect(item){\n    this.props.onSelect(item);\n    this.setState({open:\
  \ false});\n  }\n};\n```\n\n在上面的例子中，状态用于跟踪是否显示下拉选项。\n\n我们在构造函数中将初始状态的 `open` 设置为\
  \ `false`。当下拉按钮被点击时，切换 open 状态（`toggleOpen`）。当某个选项被点击时，将 open 状态设置为 `false`（`handleSelect`）。\n\
  \n我们可以快速浏览代码中的 `this.state.open`，并看到它在 `renderItems` 中被使用。如果 `this.state.open` 为\
  \ `false`，则不会渲染选项。每次你调用 `setState` 或从父组件获取新的 props 时，`render`（以及 `renderItems`）都会重新执行。在\
  \ React 中引起变化是通过影响状态或 props 来实现的，而不是直接修改。\n\n**永远不要**通过 `this.state` 直接更新状态。相反，始终使用\
  \ `this.setState` 方法。\n\n状态总是会让你的组件变得更复杂，但如果你将状态隔离到特定的组件中，你的应用程序就会更容易调试。\n\n## 什么应该放在状态中，什么应该放在\
  \ props 中？\n\n不要将计算后的值或组件存储在状态中，而应专注于组件运行直接需要的简单数据，比如下拉菜单的 open 状态。没有它，你就无法打开或关闭下拉菜单。这也可以是输入字段的值、用户的鼠标位置或\
  \ AJAX 请求的结果。\n\n尽量不要将 props 数据复制到状态中。尽可能将 props 视为唯一数据源。\n\n## 无状态函数式组件\n\n你可以利用单一数据源的概念来简化你的组件。函数式组件（在\
  \ React 0.14 中引入）不是通过包含多个方法的类来定义，而是作为一个单一的函数。这个函数接受 props 作为参数并返回所需的元素，很像传统组件中独立的\
  \ `render` 函数。\n\n下面是我们 `Day` 组件作为函数式组件的样子：\n\n```javascript\nfunction Day(props)\
  \ {\n  return (\n    <div>Day: {props.day}</div>\n  );\n}\n```\n\n这种风格在几个方面与传统组件不同。它显然更简洁，但这很大程度上是因为传统组件的某些特性不再可用。具体来说，函数式组件不支持以下特性：\n\
  \n*   状态（参见前面的章节）\n*   生命周期方法（参见第 3 章）\n*   refs 或 `findDOMNode`（参见第 8 章）\n\n然而，函数式组件不仅仅是函数。它们仍然支持\
  \ `propTypes` 和 `defaultProps`，这些与函数的 props 参数一起使用。\n\n鉴于这一特性集，函数式组件最适合作为仅定义了 `render`\
  \ 方法（以及可选的 `propTypes` 和 `defaultProps`）的组件的直接替代品。由于典型的 React 用户界面主要由符合这种描述的组件组成，以这种风格编写更多组件可以使代码库更简洁，同时不牺牲清晰度。\n\
  \n## 总结\n\n在本章中，你学习了以下概念：\n\n1.  使用 props 通过组件树传递数据和设置。\n2.  永远不要在组件内部修改 `this.props`；将\
  \ props 视为不可变的。\n3.  使用 props 作为事件处理程序与子组件通信。\n4.  使用状态存储简单的视图状态，例如下拉选项是否可见。\n5.\
  \  永远不要直接修改 `this.state`，而是使用 `this.setState`。\n6.  当不需要本地状态、refs 或生命周期方法时，将组件表示为函数式组件可以减少冗余和复杂性。\n\
  \n我们在本章中简要介绍了事件处理，你将在下一章中更详细地了解它。\n\n# 第 5 章 事件处理\n\n在用户界面中，呈现只是等式的一半。另一半是响应用户输入，在\
  \ JavaScript 中这意味着处理用户生成的事件。\n\nReact 处理事件的方法是将事件处理程序附加到组件上，然后在处理程序触发时更新这些组件的内部状态。更新组件的内部状态会导致它重新渲染，因此用户界面要反映事件的结果，只需在组件的\
  \ render 函数中读取内部状态即可。\n\n虽然通常仅根据事件类型来更新状态，但有时需要利用事件中的额外信息来确定如何更新状态。在这种情况下，传递给处理程序的事件对象将提供关于事件的额外信息，处理程序可以利用这些信息来更新内部状态。\n\
  \n结合这些技术以及 React 的高效渲染，可以轻松响应用户输入，并根据这些输入的结果更新用户界面。\n\n## 附加事件处理程序\n\n\n\n\n\n在基本层面上，React\
  \ 处理的事件与常规 JavaScript 中看到的事件相同：用于点击处理器的 `MouseEvents`、表单元素变化时的 `Change` 事件等。这些事件与常规\
  \ JavaScript 中的事件名称相同，并在相同的情况下触发。\n\nReact 附加事件处理器的语法与 HTML 的语法非常相似。例如，在我们的示例应用中，以下代码为“保存”按钮附加了一个\
  \ `onClick` 处理器。\n\n```\n <button className=\"btn btn-save\" onClick={this.handleSaveClicked}>Save</button>\n\
  ```\n\n当用户点击按钮时，按钮的 `handleSaveClicked` 方法将运行。该方法将包含解决保存操作所需的逻辑。\n\n你可以在 [`git.io/vlcpa`](http://git.io/vlcpa)\
  \ 查看我们示例应用（一个 Reddit 克隆）的完整源代码。\n\n请注意，尽管这段代码类似于在 HTML 中使用 `onclick` 等属性指定事件处理器这种被广泛不推荐的做法，但它实际上并未在底层使用\
  \ HTML 的 `onclick` 属性。React 仅将此语法用作指定处理器的方式，并在内部妥善地管理事件监听器。\n\n如果你不使用 JSX，则需将处理器指定为选项对象中的一个字段。例如：\n\
  \n```\n React.DOM.button({className: \"btn btn-save\", onClick: this.handleSaveClicked},\
  \ \"Save\");\n```\n\nReact 对处理多种事件类型提供了一流支持，这些事件类型在其文档的 [事件系统](http://facebook.github.io/react/docs/events.html)\
  \ 页面中列出。\n\n## 事件与状态\n\n假设你有一个 Markdown 编辑器，并且希望实时预览 Markdown 内容。\n\n在 React 中，这是通过监听变化并用最新值更新状态来实现的。\n\
  \n```\n class CommentEditor extends React.Component {\n  constructor(){\n    super();\n\
  \    this.state = {text: ''};\n  }\n  render(){\n    return (\n      <div>\n   \
  \     <input \n          value={this.state.text}\n          onChange={(e) => this.setState({text:\
  \ e.target.value})}\n        />\n      </div>\n    );\n  }\n}\n```\n\n### 基于状态渲染\n\
  \n这是一个基本的双向绑定实现。由于我们的数据在状态中，我们可以轻松渲染 Markdown 预览。\n\n```\n render(){\n    return\
  \ (\n      <div>\n        <input \n          value={this.state.text}\n         \
  \ onChange={(e) => this.setState({text: e.target.value})}\n        />\n        <Markdown\
  \ content={this.state.text} />\n      </div>\n    );\n  }\n```\n\n与 `this.props`\
  \ 一样，渲染函数可以根据 `this.state` 的值进行或多或少的更改。它可以渲染相同的元素，但属性略有不同，或者渲染完全不同的元素集合。两种方式都同样有效。\n\
  \n### 更新状态\n\n由于更新组件的内部 `state` 会导致组件重新渲染，因此 Markdown 预览始终是最新的。当我们调用 `setState`\
  \ 时，`render` 将再次运行，但它会读取 `this.state` 的当前值。Markdown 组件也会更新，新内容将被刷新到 DOM 中。\n\n更新组件状态有两种方式：组件的\
  \ `setState` 方法和 `replaceState` 方法。`replaceState` 会用全新的状态对象覆盖整个状态对象，如果你使用不可变数据结构来保存状态，这会很有用，但除此之外很少需要。更常见的是使用\
  \ `setState`，它只是将你提供的对象合并到现有状态对象中。\n\n例如，假设你当前的状态如下：\n\n```\n {\n  title: \"My Title\"\
  ,\n  text: \"Hello\",\n}\n```\n\n在这种情况下，调用 `this.setState({title: \"Other Title\"\
  })` 只会影响 `this.state.title` 的值，而 `this.state.text` 不受影响。\n\n调用 `this.replaceState({title:\
  \ \"Other Title\"})` 则会用新对象 `{title: \"Fantastic Survey 2.0\"}` 替换整个状态对象，完全擦除 `this.state.text`。这很可能会破坏渲染函数，因为渲染函数期望\
  \ `this.state.text` 是一个字符串，而不是 `undefined`。\n\n重要的是，除了调用 `setState` 或 `replaceState`\
  \ 之外，绝不要以任何其他方式修改 `state` 对象。像 `this.state.saveInProgress = true` 这样的操作通常是个坏主意，因为它不会通知\
  \ React 可能需要重新渲染，并且可能导致下次调用 `setState` 时出现意外结果。\n\n### 状态没有更新！\n\n同样值得注意的是，`setState`\
  \ 是异步的。因此，如果你的状态是 `{x: 1}`，并且你运行以下代码，控制台将显示 1。\n\n```\n this.setState({x: 2})\n\
  console.log(this.state.x);\n```\n\n如果你需要在状态更新、渲染被调用且更改已刷新到 DOM 后执行某些操作，你可以将回调作为\
  \ `setState` 的第二个参数传递。\n\n```\n this.setState({x: 2}, () => {\n  console.log(this.state.x);\
  \ // 2\n})\n```\n\n这也意味着在单个 tick 内多次更新状态可能会导致问题。\n\n```\n this.state.xs // []\n\
  this.setState({xs: this.state.xs.concat([1])}\nthis.setState({xs: this.state.xs.concat([2])}\n\
  ```\n\n最终状态将是 `[2]`，而不是期望的 `[1, 2]`。\n\n你可以通过使用原子性的 `setState` 变体来避免此问题。通常你会使用表达式箭头函数，但为了清晰起见，我们详细地写出来。\n\
  \n```\n this.state.xs // []\nthis.setState((state) => {\n  var xs = state.xs.concat([1]);\n\
  \  return {xs: xs};\n});\nthis.setState((state) => {\n  var xs = state.xs.concat([2]);\n\
  \  return {xs: xs};\n});\n```\n\n请注意，你应该使用 `state` 参数而不是 `this.state`。React 会将这些函数排队，并使用前一个函数更新后的状态依次调用每个函数。通常你知道两次更新不会在单个\
  \ tick 内发生，或者你可能不关心第一个更新被隐藏，因此这个特性在实践中很少使用。\n\n## 事件对象\n\n许多处理器只需触发即可达到目的，但有时你需要更多关于用户输入的信息。\n\
  \n看看示例应用中的 `CommentEditor` 类。\n\n```\n onChange={(e) => {\n  this.props.onChange({text:\
  \ e.target.value, type: 'comment'})\n}}\n```\n\nReact 的事件处理函数总是会接收到一个事件对象，这与原生 JavaScript\
  \ 事件监听器的方式非常相似。在这里，事件处理器接收一个事件对象，并通过访问 `event.target.value` 从中提取输入的当前值。在事件处理器中使用\
  \ `event.target.value` 是从表单输入中获取值的常见方式，尤其是在 `onChange` 处理器中。\n\nReact 不会将浏览器提供的原始\
  \ Event 对象直接传递给处理器，而是将原始事件包装在一个 `SyntheticEvent` 实例中。`SyntheticEvent` 的设计使其在外观和功能上与浏览器创建的原始事件相同，只是平滑处理了某些跨浏览器的不一致性。你应该能够像使用普通事件一样使用\
  \ `SyntheticEvent`，但如果需要浏览器发送的原始事件，你可以通过 `SyntheticEvent` 的 `nativeEvent` 字段访问它。\n\
  \n## 总结\n\n在用户界面中反映用户输入变化的步骤如下：\n\n1.  为 React 组件附加一个事件处理器。\n\n2.  在该事件处理器中，更新组件的内部状态。更新组件的状态将导致其重新渲染。\n\
  \n3.  修改组件的 `render` 函数，以适当方式纳入 `this.state`。\n\n到目前为止，你已经使用单个组件来响应用户交互。接下来，你将学习如何组合多个组件，以创建一个超越各部分之和的界面。\n\
  \n# 第 6 章 组合组件\n\n\n\n\n\n在传统 HTML 中，每个页面的基本构建块是元素。而在 React 中，你通过组件来组装页面。你可以将 React\
  \ 组件视为一个融合了 JavaScript 全部表达能力的 HTML 元素。事实上，使用 React 时，你*唯一*要做的事情就是构建组件，就像 HTML 文档完全由元素构成一样。\n\
  \n由于整个 React 应用程序都是通过组件构建的，因此整本书都可以被描述为一本关于 React 组件的书。因此，在本章中，我们不会涵盖与组件相关的*所有*内容。相反，你将了解其中一个特定方面——它们的可组合性。\n\
  \n组件本质上是一个 JavaScript 函数，它接收 `props` 和 `state` 作为参数，并输出渲染后的 HTML。它们通常被设计用来表示和表达应用程序中的某段数据，因此你可以将\
  \ React 组件视为 HTML 的扩展。\n\n在本章中，我们将使用 reddit 克隆示例应用程序中未出现的代码，因为一个 CRUD（创建、读取、更新、删除）应用程序能更好地说明这一点。\n\
  \n## 扩展 HTML\n\nReact + JSX 是强大且富有表现力的工具，允许你创建自定义元素，这些元素可以使用类似 HTML 的语法来表达。它们远远超越了纯\
  \ HTML，让你能够在其整个生命周期中控制其行为。这一切都始于从 `React.Component` 继承。\n\nReact 推崇组合而非继承，这意味着你将小而简单的组件和数据对象组合成更大、更复杂的组件。使用\
  \ EcmaScript 6，你可以从 `React.Component` 继承，但它不鼓励更深层次的继承。相反，它鼓励构建可复用的、可组合的组件。\n\nReact\
  \ 拥抱可组合性，允许你将各种子组件混合搭配，形成一个复杂而强大的新组件。为了演示这一点，让我们考虑用户如何回答一个调查问题。\n\n你可以在 [`git.io/vlcpa`](http://git.io/vlcpa)\
  \ 阅读我们示例应用程序（一个 reddit 克隆）的完整源代码。\n\n## 通过示例理解组合\n\n让我们考虑一个表示多项选择题的组件。它有几个要求：\n\n\
  *   接收一个选项列表作为输入\n*   向用户渲染这些选项\n*   只允许用户选择一个选项\n\n我们知道 HTML 提供了一些基本元素来帮助实现，即单选类型的输入和输入组。从上到下思考，组件层次结构大致如下：\n\
  \n```\n MultipleChoice → RadioInput → Input (type=\"radio\")\n```\n\n你可以将这些箭头理解为表示“拥有”关系。`MultipleChoice`\
  \ 组件*拥有*一个 `RadioInput`。`RadioInput` *拥有*一个输入。这是组合模式的一个识别特征。\n\n### 组装 HTML\n\n\
  让我们从下往上组装组件。DOM 组件（以小写字母开头）由 React 提供。因此，你要做的第一件事就是将其包装在一个 `RadioInput` 组件中。该组件将负责定制通用的\
  \ `input`，将其范围缩小为类似单选按钮的行为。我们将其命名为 `AnswerRadioInput`。\n\n首先，创建脚手架，其中包括必需的 `render`\
  \ 方法和描述所需输出的基本标记。当组件成为一种专门的输入类型时，你已经可以开始看到组合模式。\n\n```\n class AnswerRadioInput\
  \ extends React.Component {\n  render() {\n    return (\n      <div className=\"\
  radio\">\n        <label>\n          <input type=\"radio\" />\n          Label Text\n\
  \        </label>\n      </div>\n    );\n  }\n}\n```\n\n**添加动态属性**\n\n我们的 `input`\
  \ 目前还没有任何动态内容，因此你需要定义父组件必须传递给单选输入的属性。\n\n*   这个输入代表什么值或选项？（必需）\n*   我们用什么文本来描述它？（必需）\n\
  *   输入的 name 是什么？（必需）\n*   我们可能想要自定义 `id`。\n*   我们可能想要覆盖默认值。\n\n根据这个列表，你现在可以为自定义输入定义属性类型。将这些添加到类定义的\
  \ `propTypes` 哈希中。\n\n```\n class AnswerRadioInput extends React.Component {\n \
  \   ...\n}\n\nAnswerRadioInput.propTypes = {\n  id: React.PropTypes.string,\n  name:\
  \ React.PropTypes.string.isRequired,\n  label: React.PropTypes.string.isRequired,\n\
  \  value: React.PropTypes.string.isRequired,\n  checked: React.PropTypes.bool,\n\
  };\n```\n\n对于每个可选属性，你需要定义默认值。将这些添加到 `defaultProps` 静态成员中。当父组件未提供这些值时，这些值将应用于每个新实例。\n\
  \n```\n class AnswerRadioInput extends React.Component {\n  ...\n}\n\nAnswerRadioInput.PropTypes\
  \ = {...};\nAnswerRadioInput.defaultProps = {\n  id: null,\n  checked: false\n};\n\
  ```\n\n### 跟踪状态\n\n我们的组件需要跟踪随时间变化的数据。具体来说，`id` 对于每个实例是唯一的，并且用户可以随时更新 `checked` 值。因此，让我们定义初始状态。\n\
  \n这发生在 React 组件的 `constructor` 中。我们只需使用默认状态设置 `this.state` 哈希。\n\n注意，我们还调用了 `super(props)`\
  \ 以使用默认的 prop 行为。\n\n```\n class AnswerRadioInput extends React.Component {\n  constructor(props)\
  \ {\n    super(props);\n    var id = props.id ? props.id : uniqueId('radio-');\n\
  \    this.state = {\n      checked: !!props.checked,\n      id: id,\n      name:\
  \ id\n    };\n\n  }\n  ...\n}\n\nAnswerRadioInput.PropTypes = {...};\nAnswerRadioInput.defaultProps\
  \ = {...};\n```\n\n现在你可以更新渲染的标记以访问新的动态状态和 props。\n\n```\n class AnswerRadioInput\
  \ = React.createClass({\n\n  constructor(props) {...}\n\n  render() {\n    return\
  \ (\n      <div className=\"radio\">\n        <label htlmFor={this.props.id}>\n\
  \          <input type=\"radio\"\n            name={this.props.name}\n         \
  \   id={this.props.id}\n            value={this.props.value}\n            checked={this.state.checked}\
  \ />\n          {this.props.label}\n        </label>\n      </div>\n    );\n  }\n\
  }\n\nAnswerRadioInput.PropTypes = {...};\nAnswerRadioInput.defaultProps = {...};\n\
  ```\n\n### 集成到父组件中\n\n至此，你已经有了一个足够完整的组件，可以在父组件中使用它，因此你可以开始构建下一层，即 `AnswerMultipleChoiceQuestion`。它的主要职责是显示一个选项列表供用户选择。按照上面介绍的模式，让我们为这个组件铺设基本的\
  \ HTML 和默认 props。\n\n```\n class AnswerMultipleChoiceQuestion extends React.Component\
  \ {\n  constructor(props) {\n    super(props);\n    this.state = {\n      id: uniqueId('multiple-choice-'),\n\
  \      value:props.value\n    };\n  }\n  render() {\n    return (\n      <div className=\"\
  form-group\">\n        <label className=\"survey-item-label\" htmlFor={this.state.id}>{this.props.label}</label>\n\
  \        <div className=\"survey-item-content\">\n              <AnswerRadioInput\
  \ ... />\n          ...\n          <AnswerRadioInput ... />\n        </div>\n  \
  \    </div>\n    );\n  }\n}\n\nAnswerMultipleChoiceQuestion.propTypes = {\n  value:\
  \ React.PropTypes.string,\n  choices: React.PropTypes.array.isRequired,\n  onCompleted:\
  \ React.PropTypes.func.isRequired\n};\n```\n\n为了生成子单选输入组件的列表，你必须对选项数组进行 `map` 操作，将每个选项转换为一个组件。这可以通过一个辅助函数轻松处理，如下所示。\n\
  \n\n\n\n```\nclass AnswerMultipleChoiceQuestion = React.createClass({\n\n  ...\n\
  \  renderChoices() {\n    return this.props.choices.map((choice, i) => {\n     \
  \ return (\n        <AnswerRadioInput\n          id={\"choice-\" + i}\n        \
  \  name={this.state.id}\n          label={choice}\n          value={choice}\n  \
  \        checked={this.state.value === choice}\n        />\n      );\n    });\n\
  \  }\n\n  render() {\n    return (\n      <div className=\"form-group\">\n     \
  \   <label className=\"survey-item-label\" htmlFor={this.state.id}>{this.props.label}</label>\n\
  \        <div className=\"survey-item-content\">\n          {this.renderChoices()}\n\
  \        </div>\n      </div>\n    );\n  }\n}\n```\n\n现在，React 的组合性变得更加清晰了。你从一个通用输入组件开始，将其定制为单选输入组件，最后封装成一个多项选择组件——这是一个高度精炼且特定化的表单控件版本。现在，渲染一组选项变得非常简单：\n\
  \n```\n<AnswerMultipleChoiceQuestion choices={arrayOfChoices} ... />\n```\n\n敏锐的读者可能已经注意到还缺少一个环节——我们的单选输入组件无法将变化通知给父组件。你需要将\
  \ `AnswerRadioInput` 子组件连接起来，以便父组件能够感知它们的变化，并将其处理成合适的调查结果数据负载。这就引出了父/子关系。\n\n##\
  \ 父/子关系\n\n到目前为止，你应该能够使用我们的示例在屏幕上渲染一个表单，但请注意，你还没有赋予组件共享用户更改的能力。`AnswerRadioInput`\
  \ 组件目前还无法与其父组件通信。\n\n子组件与父组件通信的最简单方式是通过 props。父组件需要通过 props 传入一个回调函数，子组件在需要时调用它。\n\
  \n首先，你需要定义 `AnswerMultipleChoiceQuestion` 如何处理来自其子组件的变化。添加一个 `handleChanged` 方法，并将其传递给每个\
  \ `AnswerRadioInput`。\n\n当我们使用 EcmaScript 6 类时，方法默认不会自动绑定到实例。你可以在 `constructor`\
  \ 中设置绑定，如下所示，或者在将其作为 `onChanged` prop 传入时进行绑定。\n\n```\nclass AnswerMultipleChoiceQuestion\
  \ extends React.Component {\n  constructor(props) {\n    ...\n    this.handleChanged\
  \ = this.handleChanged.bind(this);\n  }\n\n  handleChanged(value) {\n    this.setState({value:\
  \ value});\n    this.props.onCompleted(value);\n  }\n\n  renderChoices() {\n   \
  \ return this.props.choices.map((choice, i) => {\n      return (\n        <AnswerRadioInput\n\
  \          id={\"choice-\" + i}\n          name={this.state.id}\n          label={choice}\n\
  \          value={choice}\n          checked={this.state.value === choice}\n   \
  \       onChanged={this.handleChanged}\n        />\n      );\n    });\n  }\n  ...\n\
  }\n```\n\n现在，每个单选输入组件都可以监听用户的变化，并将值传递给父组件。这需要将事件处理程序连接到输入组件的 `onChange` 事件上。\n\n\
  ```\nclass AnswerRadioInput extends React.Component {\n  constructor(props) {\n\
  \    ...\n    this.handleChanged = this.handleChanged.bind(this);\n  }\n\n  handleChanged(e)\
  \ {\n    var checked = e.target.checked;\n    this.setState({checked: checked});\n\
  \    if (checked) {\n      this.props.onChanged(this.props.value);\n    }\n  }\n\
  \n  render() {\n    return (\n      <div className=\"radio\">\n        <label htmlFor={this.state.id}>\n\
  \          <input type=\"radio\"\n            ...\n            onChange={this.handleChanged}\
  \ />\n          {this.props.label}\n        </label>\n      </div>\n    );\n  }\n\
  }\n\nAnswerRadioInput.propTypes: {\n  ...\n  onChanged: React.PropTypes.func.isRequired\n\
  };\n```\n\n## 总结\n\n你已经看到了 React 如何使用组合性模式，允许你包装 HTML 元素或自定义组件，并根据需要定制它们的行为。随着你使用组件，它们会变得更加具体且语义化。因此，React\
  \ 将通用输入组件：\n\n```\n<input type=\"radio\" ... />\n```\n\n转化为更有意义的组件：\n\n```\n<AnswerRadioInput\
  \ ... />\n```\n\n最终，你得到一个单一的组件，可以将数据数组转换为用户交互的有用 UI。\n\n```\n<AnswerMultipleChoiceQuestion\
  \ choices={arrayOfChoices} ... />\n```\n\n组合只是 React 提供的一种定制和特化组件的方式。Mixin 提供了另一种方法，允许你定义可以在多个组件之间共享的方法。接下来，我们将展示如何定义\
  \ mixin，以及如何使用它们来共享公共代码。\n\n# 第 7 章 高阶组件与 Mixin\n\nReact 中有两种特殊的抽象方式。高阶组件是接受一个组件作为参数并返回另一个组件的组件。\n\
  \n以前，高阶组件的角色是通过 mixin 来实现的。有些功能仍然只能通过 mixin 完成，我们将在下面介绍。\n\n## 简单示例\n\n让我们编写一个高阶函数，通过\
  \ props 向子组件传递一个随机数。Props 是高阶组件与子组件通信的方式。你还需要确保使用 `{...this.props}` 语法传递任何额外的 props。\n\
  \n```\nfunction providesRandomNumber(Component) {\n  return class RandomNumberProvider\
  \ extends React.Component {\n    render(){\n      return <Component {...this.props}\
  \ randomNumber={4} />;\n    }\n  }\n}\n```\n\n然后我们可以使用这个函数来包装一个组件。\n\n```\nvar MyComponent\
  \ = providesRandomNumber(\n  class MyComponent extends React.Component {\n    render(){\n\
  \      return (\n        <div>\n          The random number is {this.props.randomNumber}\n\
  \        </div>\n      );\n    }\n  }\n);\n```\n\n使用 [es7 装饰器](https://medium.com/@goncalvesjoao/react-es7-decorators-how-to-inject-props-to-your-render-method-27a0a7973106#.aji1vmw3g)\
  \ 提案会更简洁一些。\n\n```\n@providesRandomNumber\nclass MyComponent extends React.Component\
  \ {\n  render(){\n    return (\n      <div>\n        The random number is {this.props.randomNumber}\n\
  \      </div>\n    );\n  }\n}\n```\n\n### 技巧与提示\n\n通常，高阶组件会接受选项。你可以对其进行柯里化，这意味着它可以像\
  \ `hoc(Component)`、`hoc({}, Component)` 或 `hoc({})(Component)` 这样调用。\n\n```\nfunction\
  \ hoc(options, Component){\n  if (typeof options === 'function') return hoc({},\
  \ options);\n  if (arguments.length < 2) return hoc.bind(null, options || {});\n\
  \n  return class ...\n}\n```\n\n如果你有一个 mixin，你可以从 mixin 创建一个高阶组件，并将内容作为 props 传递下去。\n\
  \n```\nimport {History} from 'react-router';\n\nfunction providesRouter(Component){\n\
  \  return React.createClass({\n    mixins: [History],\n\n    render(){\n      return\
  \ <Component \n        {...this.props} \n        router={{\n          pushState:\
  \ this.pushState,\n        }}\n      />\n    }\n  });\n}\n```\n\n作为一般规则，静态属性应该传递给创建的组件。\n\
  \n```\nfunction providesFoo(Component){\n  return Object.assign(class Foo extends\
  \ React.Component {\n    render(){\n      ...\n    }\n  }, Component);\n}\n```\n\
  \n#### 常见用例\n\n高阶组件通常用于全局事件、绑定到 flux 存储、定时器以及任何你想以声明方式使用的命令式 API。\n\n## 总结\n\n高阶组件是消除代码重复、保持组件专注于其独特功能的最强大工具之一。它们允许你使用强大的抽象，有些问题如果没有它们就无法优雅地解决。\n\
  \n即使你只打算在单个组件中使用高阶组件，它也能让你描述某种行为或角色，并将其提供给该组件。它们减少了你在理解组件之前需要阅读的代码量，并允许你做一些丑陋的事情（例如管理\
  \ `__intervals`），而不会让你的组件变得丑陋。\n\n在阅读下一章关于 DOM 的内容时，思考你可以从组件中提取哪些行为和角色，甚至自己尝试一下。\n\
  \n# 第 8 章 DOM 操作\n\n\n\n\n\n在大多数情况下，React 的虚拟 DOM 足以创建你想要的用户体验，而无需直接操作底层的实际 DOM。通过组合组件，你可以将复杂的交互编织成一个连贯的整体呈现给用户。\n\
  \n然而，在某些情况下，你无法避免操作底层 DOM 来完成所需功能。最常见的场景是：你需要集成一个不使用 React 的第三方库，或者需要执行 React 本身不支持的操作。\n\
  \n为此，React 提供了一套系统，用于操作由 React 管理的 DOM 节点。这些节点仅在组件生命周期的特定阶段可访问，但使用它们能赋予你处理这些场景所需的能力。\n\
  \n## 访问受管理的 DOM 节点\n\n要访问由 React 管理的 DOM 节点，你首先需要能够访问负责管理这些节点的组件。在子组件上添加 `ref` 属性即可实现这一点。\n\
  \n```\nclass DoodleArea extends React.Component\n  render() {\n    return <canvas\
  \ ref=\"mainCanvas\" />;\n  }\n}\n```\n\n这将使底层的 `<canvas>` DOM 节点可以通过 `this.refs.mainCanvas`\
  \ 访问。可以想象，你给子组件指定的 `ref` 必须在所有子组件中唯一；给另一个子组件也指定 `ref` 为 `mainCanvas` 是行不通的。\n\n\
  注意，你不能在 `render` 方法中可靠地直接访问 `<canvas>` 节点，因为底层的 DOM 节点可能尚未更新（甚至尚未创建！），直到 `render`\
  \ 完成并且 React 执行其更新。\n\n在组件挂载后，你可以可靠地访问 `<canvas>`，此时 `componentDidMount` 处理函数将会运行。\n\
  \n```\nvar DoodleArea = React.createClass({\n  render: function() {\n    // 我们在\
  \ render() 内部尚未挂载，所以这不会顺利！\n    doSomethingWith(this.refs.mainCanvas);\n\n    return\
  \ <canvas ref=\"mainCanvas\" />\n  },\n\n  componentDidMount: function() {\n   \
  \ doSomethingWith(this.refs.mainCanvas);\n    // 这将会生效！我们现在可以访问 HTML5 Canvas 节点，\n\
  \    // 并可以按需调用其绘制方法。\n  }\n});\n```\n\n请注意，`componentDidMount` 并不是唯一可以使用 `refs`\
  \ 的地方。事件处理函数也会在组件挂载后触发，因此你可以像在 `componentDidMount` 处理函数中一样轻松地在它们内部使用 `refs`。\n\n\
  ```\nvar RichText = React.createClass({\n  render: function() {\n    return <div\
  \ ref=\"editableDiv\" contentEditable=\"true\" onKeyDown={this.handleKeyDown}>\n\
  \  },\n\n  handleKeyDown: function() {\n    var editor = this.refs.editableDiv;\n\
  \    var html = editor.innerHTML;\n\n    // 现在我们可以持久化用户输入的 HTML 内容。\n  }\n});\n\
  ```\n\n上面的示例创建了一个启用了 `contentEditable` 的 `div`，允许用户在其中输入富文本。\n\n尽管 React 本身不提供访问组件原始\
  \ HTML 内容的方式，但 `keyDown` 处理函数可以访问该 div 的底层 DOM 节点，进而访问原始 HTML。由此，你可以保存用户已输入内容的副本、计算要显示的单词数等。\n\
  \n## 通过组件查找 DOM 节点\n\n虽然 refs 是访问底层 DOM 节点的首选方式，但有时你可能希望编写一些与任何组件（无论其 refs 如何）都能配合的\
  \ DOM 修改逻辑，或者你可能需要为某个未设置任何 refs 的导入第三方组件查找其底层 DOM 节点。\n\n在这种情况下，`ReactDOM.findDOMNode`\
  \ 就是答案。\n\n```\nvar RichText = React.createClass({\n  render: function() {\n   \
  \ return <div contentEditable=\"true\" onKeyDown={this.handleKeyDown}>\n  },\n\n\
  \  handleKeyDown: function() {\n    // 注意：这里最好使用 ref 而不是 findDOMNode。\n    var editor\
  \ = ReactDOM.findDOMNode(this);\n    var html = editor.innerHTML;\n\n    // 现在我们可以持久化用户输入的\
  \ HTML 内容。\n  }\n});\n```\n\n请注意，上述做法并非首选方式。更好的做法是像上一节那样使用 ref，因为如果 `render` 函数被修改而引入了包装元素之类的结构，使用\
  \ ref 的逻辑不会中断。`findDOMNode` 只应在 ref 无法工作或引入 ref 过于繁琐时使用。\n\n请记住，尽管 `refs` 和 `findDOMNode`\
  \ 功能强大，但只应在没有其他方式实现所需功能时使用。使用它们会妨碍 React 优化性能的能力，并增加应用程序的复杂性，因此只有在常规技术无法满足需求时才应使用它们。\n\
  \n## 集成非 React 库\n\n有许多有用的 JavaScript 库并非为 React 而构建。有些库不需要访问 DOM（例如日期和时间操作库），但对于那些需要访问\
  \ DOM 的库，保持它们的状态与 React 同步对于成功集成至关重要。\n\n假设你想使用一个自动补全库，它包含以下示例代码：\n\n```\nautocomplete({\n\
  \  target: document.getElementById(\"cities\"),\n  data: [\n    \"San Francisco\"\
  ,\n    \"St. Louis\",\n    \"Amsterdam\",\n    \"Los Angeles\"\n  ], \n  events:\
  \ {\n    select: function(city) {\n      alert(\"You have selected the city of \"\
  \ + city);\n    }\n  }\n});\n```\n\n这个 `autocomplete` 函数需要一个目标 DOM 节点、一个用作数据的字符串列表以及一些事件处理函数。为了同时利用\
  \ React 和这个库的优势，你可以先构建一个提供这些内容的 React 组件。\n\n```\nclass AutocompleteCities extends\
  \ React.Component {\n  render() {\n    return <div ref=\"autocompleteTarget\" />\n\
  \  }\n\n  static defaultProps = {\n    data: [\n      \"San Francisco\",\n     \
  \ \"St. Louis\",\n      \"Amsterdam\",\n      \"Los Angeles\"\n    ]\n  };\n\n \
  \ handleSelect: function(city) {\n    alert(\"You have selected the city of \" +\
  \ city);\n  }\n});\n```\n\n为了将这个库完全封装到 React 中，添加一个 `componentDidMount` 处理函数，通过\
  \ `autocompleteTarget` 子组件的底层 DOM 节点将两个实现连接起来。\n\n```\nclass AutocompleteCities\
  \ extends React.Component {\n  render() {\n    return <div id=\"cities\" ref=\"\
  autocompleteTarget\" />\n  }\n\n  static defaultProps = {...};\n\n  handleSelect(city)\
  \ {\n    alert(\"You have selected the city of \" + city);\n  }\n\n  componentDidMount()\
  \ {\n    autocomplete({\n      target: this.refs.autocompleteTarget,\n      data:\
  \ this.props.data,\n      events: {\n        select: this.handleSelect\n      }\n\
  \    });\n  }\n};\n```\n\n请注意，`componentDidMount` 每个 DOM 节点只会被调用一次。因此，你无需担心对同一个节点调用两次\
  \ `autocomplete`（在此示例中）会产生任何不良影响。\n\n话虽如此，请记住，这个组件可能会被移除，并在之后重新渲染到不同的 DOM 节点上。如果你的\
  \ `componentDidMount` 具有在 DOM 节点移除后仍然存在的副作用，这可能会导致内存泄漏或其他问题。如果这是一个问题，请确保指定一个 `componentWillUnmount`\
  \ 处理函数，以便在 DOM 节点即将消失时让组件自行清理。\n\n## 越界插件\n\n在我们的自动补全示例中，我们假设 autocomplete 是一个行为良好的插件，只修改其子元素。实际上，情况往往并非如此。\n\
  \n为了处理这些插件，你需要将它们对 React 隐藏起来，以避免因 DOM 被意外修改而引发错误。你可能还需要进行额外的清理工作。\n\n在这个示例中，我们处理的是一个虚构的\
  \ jQuery 插件，它会触发自定义事件，并修改它所附加的元素。如果你遇到一个非常糟糕的插件，它会修改父元素，那么你无能为力，并且它与 React 不兼容。最好的做法是寻找另一个插件或修改其源代码。\n\
  \n\n\n\n保护 React 免受这个越界插件影响的方法是，完全由你自己管理它的 DOM 节点。React 认为该组件渲染了一个没有子节点和属性的单个 `div`。\n\
  \n```\n class SuperSelect extends React.Component {\n  render: function(){ \n  \
  \  return <div ref=\"holder\"/>;\n  } \n};\n```\n\n让我们在 `componentDidMount` 中完成设置这些脏活。\n\
  \n```\n class SuperSelect extends React.Component {\n  render(){\n    return <div\
  \ ref=\"holder\" />;\n  }\n\n  componentDidMount(){ \n    var el = document.createElement('div');\n\
  \    this.refs.holder.appendChild(el);\n    $(el).superSelect(this.props);\n   \
  \ $(el).on('superSelect', this.handleSuperSelectChange);   \n  }\n\n  handleSuperSelectChange()\
  \ {\n    // 在此处放置适当的处理逻辑...\n  }\n};\n```\n\n现在，你在组件渲染的 div 内部有了一个由你管理的 `div`。这意味着你需要负责清理工作。\n\
  \n```\n componentWillUnmount(){\n    // 移除 superSelect 的监听器以及我们自己的监听器\n    $(this.refs.holder).children().off();\n\
  \n    // 从 DOM 中移除节点\n    $(this.refs.holder).empty()\n  }\n```\n\n除了清理之外，还要检查插件的文档，了解清理节点所需的任何额外要求。它可能设置了全局事件监听器、定时器或启动了需要终止的\
  \ AJAX 请求。\n\n这个过程还有一步。你需要处理更新。这可以通过两种方式之一实现：模拟卸载和重新挂载，或者使用插件的更新 API。前者更可靠，后者性能更好且更干净。\n\
  \n这是卸载/重新挂载的解决方案。\n\n```\n componentDidUpdate(){\n    this.componentWillUnmount();\n\
  \    this.componentDidMount();\n  }\n```\n\n这是一个假设的替代方案。\n\n```\n componentWillReceiveProps(nextProps){\n\
  \    $(this.refs.holder).children().superSelect('update', nextProps);\n  }\n};\n\
  ```\n\n封装其他库和插件的难度取决于变量的数量。有时是一个简单的 jQuery 插件，有时是一个带有自己插件的富文本编辑器。对于某些简单的插件，最好的答案是在封装所需的时间内将其重写为\
  \ React 组件，而对于其他插件，这完全不可行。\n\n## 总结\n\n当仅使用虚拟 DOM 不够时，`ref` 属性允许你访问特定元素，并在 `componentDidMount`\
  \ 运行后使用 `findDOMNode` 修改其底层 DOM 节点。\n\n这使你能够利用 React 本身不支持的功能，或者集成那些并非为与 React 互操作而设计的第三方库。\n\
  \n接下来，我们将学习如何使用 React 创建和管理表单。\n\n# 第 9 章 表单\n\n表单是任何需要用户哪怕少量输入的应用程序的基本组成部分。传统上，在单页应用中，表单很难做到“正确”，因为它们充满了用户不断变化的状态。管理这种状态既复杂又容易出错。React\
  \ 帮助你管理应用程序中的状态，这也扩展到了你的表单。\n\n到目前为止，你会意识到可预测性和可测试性是 React 组件的核心方面。给定相同的 props 和\
  \ state，任何 React 组件每次都应该渲染完全相同的内容。表单也不例外。\n\nReact 中有两种类型的表单组件：`受控组件` 和 `非受控组件`。在本章中，你将了解受控组件和非受控组件之间的区别，以及在什么情况下你会选择其中一种。\n\
  \n本章还涵盖：\n\n*   如何在 React 中使用表单事件。\n*   使用受控表单组件控制数据输入。\n*   React 如何改变某些表单组件的接口。\n\
  *   在 React 中命名表单组件的重要性。\n*   处理多个受控表单组件。\n*   创建自定义可复用的表单组件。\n*   在 React 中使用 AutoFocus。\n\
  *   构建可用应用程序的技巧。\n\n在上一章中，你学习了如何访问 React 组件的 DOM。React 帮助你从 DOM 中提取状态并将其放入组件中。即使有了这种帮助，你仍然需要为某些复杂的表单组件访问\
  \ DOM。\n\n你可以在 [`git.io/vlcpa`](http://git.io/vlcpa) 阅读我们示例应用程序的完整源代码。\n\n## 非受控组件\n\
  \n在大多数非平凡的表单中，你*不会*想要使用非受控组件。然而，它们对于理解受控组件非常有用。非受控组件对于 React 中大多数其他组件的构建方式来说是一种反模式。\n\
  \n在 HTML 中，表单的工作方式与 React 组件不同。当 HTML `<input/>` 被赋予一个值时，`<input/>` 可以改变该 `<input/>`\
  \ 的值。这就是名称的由来，因为表单组件的值不受你的 React 组件控制。\n\n在 React 中，这种行为类似于设置 `<input/>` 的 `defaultValue`。\n\
  \n要在 React 中设置 `<input/>` 的默认值，你可以使用 `defaultValue` 属性。\n\n```\n //http://jsfiddle.net/pmsy5y2u/\n\
  class MyForm extends React.Component {\n  render() {\n    return (\n      <input\n\
  \        type=\"text\"\n        defaultValue=\"Hello World!\"\n      />\n    )\n\
  \  }\n};\n```\n\n上面的例子被称为非受控组件。`value` 不是由父组件设置的，而是允许 `<input/>` 控制自己的值。\n\n除非你能访问该值，否则非受控组件并不是很有用。为了访问该值，你需要为\
  \ `<input/>` 添加一个 `ref`，然后访问 DOM 节点的值。\n\n正如你在第 8 章中看到的，`ref` 是一个特殊的非 DOM 属性，用于在\
  \ `this` 上下文中标识组件。组件中的所有 ref 都会被添加到 `this.refs` 中以便于访问。\n\n让我们也将 `<input/>` 添加到一个表单中，并在\
  \ `submit` 时读取该值。\n\n```\n //http://jsfiddle.net/opfktus4/\nclass MyForm extends\
  \ React.Component {\n  submitHandler(event) {\n    event.preventDefault();\n   \
  \ //通过 ref 访问输入框\n    var helloTo = this.refs.helloTo.value;\n    alert(helloTo);\n\
  \  }\n  render() {\n    return (\n      <form onSubmit={(e) => this.submitHandler(e)}>\n\
  \        <input \n          ref=\"helloTo\" \n          type=\"text\" \n       \
  \   defaultValue=\"Hello World!\" />\n        <br />\n        <button type=\"submit\"\
  >Speak</button>\n      </form>\n    );\n  }\n};\n```\n\n非受控组件很少适合使用。它们不允许你根据输入的当前值进行渲染，并且你的代码是以\
  \ DOM 为中心的方式编写的，而不是以数据为中心的方式。它们还使得组合更加困难，因为在复合组件中没有标准的方法来获取输入的值。\n\n## 受控组件\n\n\
  受控组件遵循与其他 React 组件相同的模式。表单组件的状态由你的 React 组件控制，其值存储在你的 React 组件的 state 中。\n\n如果你希望对表单组件有更多控制，你会想要使用受控组件。\n\
  \n受控组件是指父组件设置输入值的组件。\n\n让我们将上面的例子转换为使用受控组件。\n\n```\n //http://jsfiddle.net/1a8xr2z6/\n\
  class MyForm extends React.Component {\n  constructor() {\n    super();\n    this.state\
  \ = {\n      helloTo: \"Hello World!\"\n    };\n  }\n  handleChange(value) {\n \
  \   this.setState({\n      helloTo: value\n    });\n  }\n  submitHandler(event)\
  \ {\n    event.preventDefault();\n    alert(this.state.helloTo);\n  }\n  render()\
  \ {\n    return (\n      <form onSubmit={(e) => this.submitHandler(e)}>\n      \
  \  <input \n          type=\"text\"\n          value={this.state.helloTo}\n    \
  \      onChange={(e) => this.handleChange(e.target.value)} />\n        <br />\n\
  \        <button type=\"submit\">Speak</button>\n      </form>\n    );\n  }\n};\n\
  ```\n\n这里的主要变化是 `<input/>` 的值现在存储在父组件的 state 中。因此，数据流现在被清晰地定义了。\n\n\n\n\n`constructor`\
  \ 现在设置 `defaultValue`\n\n`<input/>` 的值在渲染时设置\n\n`<input/>` 的 `onChange` 会调用变更处理函数\n\
  \n变更处理函数更新状态\n\n`<input/>` 的值在渲染时更新\n\n这比非受控版本的代码多得多。然而，这让你能够控制数据流，并在数据输入时修改状态。\n\
  \n示例：你可能希望在输入时将所有字符转换为大写。\n\n```\n handleChange(value) {\n  this.setState({\n  \
  \  helloTo: value.toUpperCase()\n  });\n}\n```\n\n你会注意到，在输入数据时，不会出现小写字符闪烁后再将大写字符添加到输入框的情况。这是因为\
  \ React 拦截了原生的浏览器变更事件。然后，在调用 `setState` 后，该组件会重新渲染输入框。接着 React 执行 DOM diff 并更新输入框的值。\n\
  \n你可以使用同样的模式来限制可输入的字符，或者不允许在电子邮件地址中输入非法字符。\n\n你可能还希望在数据输入时，在其他组件中使用该值。\n\n示例：\n\n\
  *   显示大小受限输入框中剩余的字符数。\n*   显示正在输入的十六进制值的颜色。\n*   显示自动补全选项。\n*   使用输入值更新其他 UI 元素。\n\
  \n## 表单事件\n\n访问表单事件是控制表单不同方面的关键。\n\nReact 支持 HTML 产生的所有事件。它们遵循驼峰命名约定，并被转换为合成事件。这些事件是标准化的，具有跨浏览器的通用接口。\n\
  \n所有合成事件都允许你通过 `event.target` 访问触发事件的 DOM 节点。\n\n```\n handleEvent: function (syntheticEvent)\
  \ {\n  var node = syntheticEvent.target;\n  var newValue = node.value;\n}\n```\n\
  \n这是访问受控组件值的最简单方法之一。\n\n对于包含子元素的元素，你需要使用 `event.currentTarget`。\n\n## 标签\n\n表单元素上的标签对于清晰传达你对用户的要求非常重要，并且为单选按钮和复选框提供可访问性。\n\
  \n`for` 属性存在冲突。使用 JSX 时，属性会被转换为 JavaScript 对象，并作为第一个参数传递给组件构造函数。为了兼容 ES3（IE8），保留字不会用作属性。\n\
  \n在 React 中，就像 `class` 变成 `className` 一样，`for` 也变成了 `htmlFor`。\n\n```\n //JSX\n\
  <label htmlFor=\"name\">Name:</label>\n\n//渲染后\n<label for=\"name\">Name:</label>\n\
  ```\n\n## Textarea 和 Select\n\nReact 对 `<textarea/>` 和 `<select/>` 的接口做了一些更改，以提高一致性并使其更易于操作。\n\
  \n`<textarea/>` 被修改得更接近 `<input/>`，允许你指定 `value` 和 `defaultValue`。\n\n```\n //非受控\n\
  <textarea defaultValue=\"Hello World\" />\n\n//受控\n<textarea \n  value={this.state.helloTo}\n\
  \  onChange={this.handleChange} />\n```\n\n`<select/>` 现在接受 `value` 和 `defaultValue`\
  \ 来设置选中的选项。这使得值的操作更加容易。\n\n```\n //非受控\n<select defaultValue=\"B\">\n  <option value=\"\
  A\">First Option</option>\n  <option value=\"B\">Second Option</option>\n  <option\
  \ value=\"C\">Third Option</option>\n</select>\n\n//受控\n<select value={this.state.helloTo}\
  \ onChange={this.handleChange}>\n  <option value=\"A\">First Option</option>\n \
  \ <option value=\"B\">Second Option</option>\n  <option value=\"C\">Third Option</option>\n\
  </select>\n```\n\nReact 支持多选。要使用多选，你必须向 `value` 和 `defaultValue` 传递一个数组。\n\n```\n\
  \ //非受控\n<select multiple=\"true\" defaultValue={[\"A\",\"B\"]}>\n  <option value=\"\
  A\">First Option</option>\n  <option value=\"B\">Second Option</option>\n  <option\
  \ value=\"C\">Third Option</option>\n</select>\n```\n\n使用多选时，当选项被选中时，select 组件的值**不会**更新。只有选项的\
  \ `selected` 属性会改变。使用给定的 `ref` 或 `syntheticEvent.target`，你可以访问选项并检查它们是否被选中。\n\n\
  在下面的示例中，`handleChange` 遍历 DOM 以找出当前选中的选项。\n\n```\n //http://jsfiddle.net/yddy2ep0/\n\
  class MyForm extends React.Component {\n  constructor() {\n    super();\n    this.state\
  \ = {\n      options: [\"B\"]\n    };\n  }\n  handleChange(event) {\n    var checked\
  \ = [];\n    var sel = event.target;   \n    for(var i=0; i < sel.length; i++){\n\
  \      var option = sel.options[i];\n      if (option.selected){\n        checked.push(option.value);\n\
  \      }\n    }     \n    this.setState({\n      options: checked\n    });\n  }\n\
  \  submitHandler(event) {\n    event.preventDefault();\n    alert(this.state.options);\n\
  \  },\n  render: function () {\n    return (\n      <form onSubmit={(e) => this.submitHandler(e)}>\n\
  \        <select multiple=\"true\"\n            value={this.state.options}\n   \
  \         onChange={(e) => this.handleChange(e)}\n        >\n          <option value=\"\
  A\">First Option</option>\n          <option value=\"B\">Second Option</option>\n\
  \          <option value=\"C\">Third Option</option>\n        </select>\n      \
  \  <br />\n        <button type=\"submit\">Speak</button>\n      </form>\n    );\n\
  \  }\n};\n```\n\n## 复选框和单选按钮\n\n复选框和单选按钮有不同的控制机制。\n\n就像在 HTML 中一样，类型为 `checkbox`\
  \ 或 `radio` 的 `<input/>` 与类型为 `text` 的 `<input/>` 行为截然不同。通常，复选框或单选按钮的值不会改变。只有 `checked`\
  \ 状态会改变。要控制复选框或单选按钮输入，你需要控制 `checked` 属性。你也可以在非受控的复选框或单选按钮输入中使用 `defaultChecked`。\n\
  \n```\n // 非受控\nclass MyForm extends React.Component {\n  submitHandler(event) {\n\
  \    event.preventDefault();\n    alert(this.refs.mycheckbox.checked);\n  }\n  render()\
  \ {\n    return (\n      <form onSubmit={(e) => this.submitHandler(e)}>\n      \
  \  <input \n          ref=\"mycheckbox\"\n          type=\"checkbox\"\n        \
  \  value=\"A\"\n          defaultChecked=\"true\" />\n        <br />\n        <button\
  \ type=\"submit\">Speak</button>\n      </form>\n    );\n  }\n};\n\n// 受控\nvar MyForm\
  \ = React.createClass({\n  constructor() {\n    super();\n    this.state = {\n \
  \     checked: true\n    };\n  }\n  handleChange(event) {\n    this.setState({\n\
  \      checked: event.target.checked\n    });\n  }\n  submitHandler(event) {\n \
  \   event.preventDefault();\n    alert(this.state.checked);\n  }\n  render() {\n\
  \    return (\n      <form onSubmit={(e) => this.submitHandler(e)}>\n        <input\
  \ \n          type=\"checkbox\"\n          value=\"A\"\n          checked={this.state.checked}\n\
  \          onChange={this.handleChange} \n        />\n        <br />\n        <button\
  \ type=\"submit\">Speak</button>\n      </form>\n    );\n  }\n};\n```\n\n在这两个示例中，`<input/>`\
  \ 的值始终是 `A`，因为只有 checked 状态会改变。\n\n### 表单元素上的名称\n\n在 React 中，当受控表单元素的值存储在状态中并且表单提交事件被拦截时，名称在表单元素上的重要性较低。访问表单值不需要名称。对于非受控表单元素，你可以使用\
  \ `refs` 直接访问表单元素。\n\n然而，名称是表单组件的一个关键方面。\n\n*   名称允许第三方表单序列化器在 React 中仍然正常工作。\n\
  *   如果表单要以原生方式提交，也需要名称。\n*   客户端浏览器使用名称来自动填充常见信息，例如用户的地址。\n*   名称对于非受控的单选按钮输入至关重要，因为通过名称对它们进行分组，以确保表单中同一名称的单选按钮一次只能选中一个。使用受控的单选按钮输入，可以在没有名称的情况下复制相同的行为。\n\
  \n\n\n\n以下示例通过将状态存储在 `MyForm` 组件中，复现了非受控单选按钮组的功能。你会注意到 `name` 并未被使用。\n\n```\n class\
  \ MyForm extends React.Component {\n  constructor(){\n    super();\n    this.state\
  \ = {\n      radio: \"B\"\n    };\n  }\n  handleChange(event) {\n    this.setState({\n\
  \      radio: event.target.value\n    });\n  }\n  submitHandler(event) {\n    event.preventDefault();\n\
  \    alert(this.state.radio);\n  }\n  render() {\n    return (\n      <form onSubmit={(e)\
  \ => this.submitHandler(e)}>\n        <input\n          type=\"radio\"\n       \
  \   value=\"A\"\n          checked={this.state.radio == \"A\"}\n          onChange={(e)\
  \ => this.handleChange(e)} /> A\n        <br />\n        <input \n          type=\"\
  radio\"\n          value=\"B\"\n          checked={this.state.radio == \"B\"}\n\
  \          onChange={(e) => this.handleChange(e)} /> B\n        <br />\n       \
  \ <input \n          type=\"radio\"\n          value=\"C\"\n          checked={this.state.radio\
  \ == \"C\"}\n          onChange={(e) => this.handleChange(e)} /> C\n        <br\
  \ />\n        <button type=\"submit\">Speak</button>\n      </form>\n    );\n  }\n\
  };\n```\n\n## 多个表单元素与变更处理器\n\n在使用受控表单元素时，你并不想为每个表单元素都编写一个变更处理器。幸运的是，有几种不同的方法可以在\
  \ React 中复用变更处理器。\n\n一个示例：箭头函数。\n\n```\n class MyForm extends React.Component {\n\
  \  constructor() {\n    super();\n    this.state = {\n      given_name: \"\",\n\
  \      family_name: \"\"\n    };\n  }\n  handleChange(name, event) {\n    var newState\
  \ = {};\n    newState[name] = event.target.value;\n    this.setState(newState);\n\
  \n    // or the es6 version\n    this.setState({\n      [name]: event.target.value,\n\
  \    });\n  }\n  submitHandler(event) {\n    event.preventDefault();\n    var words\
  \ = [\n      \"Hi\",\n      this.state.given_name,\n      this.state.family_name\n\
  \    ];\n    alert(words.join(\" \"));\n  }\n  render() {\n    return (\n      <form\
  \ onSubmit={this.submitHandler}>\n        <label htmlFor=\"given_name\">Given Name:</label>\n\
  \        <br />\n        <input\n          type=\"text\"\n          name=\"given_name\"\
  \n          value={this.state.given_name}\n          onChange={(e) => this.handleChange('given_name',\
  \ e)}/>\n        <br />\n        <label htmlFor=\"family_name\">Family Name:</label>\n\
  \        <br />\n        <input\n          type=\"text\"\n          name=\"family_name\"\
  \n          value={this.state.family_name}\n          onChange={(e) => this.handleChange('family_name',\
  \ e)}/>\n        <br />\n        <button type=\"submit\">Speak</button>\n      </form>\n\
  \    );\n  }\n};\n```\n\n另一个示例：使用 `DOMNode` 的 `name` 来识别要更改的状态。\n\n```\n //http://jsfiddle.net/q3g0sk84/\n\
  class MyForm extends React.Component {\n  constructor() {\n    super();\n    this.state\
  \ = {\n      givenName: \"\",\n      familyName: \"\",\n    };\n  }\n  handleChange(event)\
  \ {\n    this.setState({\n      [event.target.name]: event.target.value\n    });\n\
  \  }\n  submitHandler(event) {\n    event.preventDefault();\n    var words = [\n\
  \      \"Hi\",\n      this.state.givenName,\n      this.state.familyName,\n    ];\n\
  \    alert(words.join(\" \"));\n  }\n  render() {\n    return (\n      <form onSubmit={this.submitHandler}>\n\
  \        <label htmlFor=\"givenName\">Given Name:</label>\n        <br />\n    \
  \    <input\n          type=\"text\"\n          name=\"givenName\"\n          value={this.state.givenName}\n\
  \          onChange={(e) => this.handleChange(e)}/>\n        <br />\n        <label\
  \ htmlFor=\"familyName\">Family Name:</label>\n        <br />\n        <input\n\
  \          type=\"text\"\n          name=\"familyName\"\n          value={this.state.familyName}\n\
  \          onChange={this.handleChange}/>\n        <br />\n        <button type=\"\
  submit\">Speak</button>\n      </form>\n    );\n  }\n};\n```\n\n## 自定义表单组件\n\n创建自定义表单组件是在应用程序中复用通用功能的绝佳方式。它也是改善复选框和单选按钮等更复杂表单组件接口的好方法。\n\
  \n在编写自定义表单组件时，你应该尝试创建与其他表单组件相同的接口。这将提高代码的可预测性，使理解组件的工作方式变得更加容易，而无需查看其实现细节。\n\n让我们创建一个自定义单选按钮组件，使其具有与\
  \ React 的 select 组件相同的接口。我们不会实现多选功能，因为单选按钮组件不支持多选。\n\n```\n class Radio extends\
  \ React.Component {\n  static propTypes = {\n    onChange: React.PropTypes.func\n\
  \  };\n\n  constructor(){\n    super();\n    this.state = {\n      value: this.props.defaultValue\n\
  \    };\n  }\n  handleChange(event) {\n    if (this.props.onChange) {\n      this.props.onChange(event);\n\
  \    }\n    this.setState({\n      value: event.target.value\n    });\n  }\n  render()\
  \ {\n    var value = this.props.value || this.state.value;\n\n    var children =\
  \ React.Children\n      .map(this.props.children, (child, i) => {\n      return\
  \ (\n        <label key={i}>\n          <input\n            type=\"radio\"\n   \
  \         name={this.props.name}\n            value={child.props.value}\n      \
  \      checked={child.props.value == value}\n            onChange={this.handleChange}\
  \ />\n          {child.props.children}\n          <br/>\n        </label>\n    \
  \  );\n    });\n\n    return this.transferPropsTo(<span>{children}</span>);\n  }\n\
  };\n```\n\n本质上，我们正在创建一个支持受控和非受控接口的受控组件。\n\n首先要确保如果提供了 `onChange`，它始终是一个函数。然后将 `defaultValue`\
  \ 存储在状态中。\n\n每次组件渲染时，它会根据作为子元素提供给组件的选项创建新的标签和单选按钮。确保动态子元素具有一致的键值。这可以确保 React 将你的\
  \ `<input/>` 保留在 DOM 中，并在使用键盘控制时保持当前焦点。\n\n然后设置 `value`、`name` 和 `checked` 状态。附加你的\
  \ `onChange` 处理器，然后渲染新的子元素。\n\n```\n //Uncontrolled\n//http://jsfiddle.net/moyfLkfv/\n\
  var MyForm = React.createClass({\n  submitHandler: function (event) {\n    event.preventDefault();\n\
  \    alert(this.refs.radio.state.value);\n  },\n  render: function () {\n    return\
  \ <form onSubmit={this.submitHandler}>\n        <Radio ref=\"radio\" name=\"my_radio\"\
  \ defaultValue=\"B\">\n          <option value=\"A\">First Option</option>\n   \
  \       <option value=\"B\">Second Option</option>\n          <option value=\"C\"\
  >Third Option</option>\n        </Radio>\n        <button type=\"submit\">Speak</button>\n\
  \      </form>;\n  }\n});\n```\n\n当将值存储在组件的状态中时，你无需访问 `DOMNode` 即可知道当前值。你可以直接访问状态。\n\
  \n```\n //Controlled\n//http://jsfiddle.net/cwabLksg/\nvar MyForm = React.createClass({\n\
  \  getInitialState: function () {\n    return {my_radio: \"B\"};\n  },\n  handleChange:\
  \ function (event) {\n    this.setState({\n      my_radio: event.target.value\n\
  \    });\n  },\n  submitHandler: function (event) {\n    event.preventDefault();\n\
  \    alert(this.state.my_radio);\n  },\n  render: function () {\n    return <form\
  \ onSubmit={this.submitHandler}>\n        <Radio name=\"my_radio\" \n          \
  \  value={this.state.my_radio}\n            onChange={this.handleChange}>\n    \
  \      <option value=\"A\">First Option</option>\n          <option value=\"B\"\
  >Second Option</option>\n          <option value=\"C\">Third Option</option>\n \
  \       </Radio>\n        <button type=\"submit\">Speak</button>\n      </form>;\n\
  \  }\n});\n```\n\n作为一个受控组件，它的操作方式与 select 框完全相同。传递给 `onChange` 的事件是来自活动 `<input/>`\
  \ 的事件，因此你可以用它来读取当前值。\n\n作为练习，你可能想尝试实现 `valueLink` 属性的支持，以便将此组件与 `React.addons.LinkedStateMixin`\
  \ 一起使用。\n\n## 焦点\n\n\n\n\n\n利用对表单组件的焦点控制，是引导用户了解表单中下一步逻辑操作的绝佳方式。这也有助于减少用户交互，提升可用性。其优点将在下一节中进一步讨论。\n\
  \n由于 React 表单并非总是在浏览器加载时渲染，因此表单输入的自动聚焦需要以略有不同的方式运作。React 实现了 `autoFocus`，当组件首次挂载时，如果其他表单输入没有获得焦点，React\
  \ 会将焦点置于该输入上。这正是带有 `autoFocus` 的简单 HTML 表单应有的行为方式。\n\n```\n //jsx\n<input type=\"\
  text\" name=\"given_name\" autoFocus=\"true\" />\n```\n\n你也可以通过调用 DOM 节点上的 `focus()`\
  \ 来手动设置表单字段的焦点。\n\n## 可用性\n\nReact 在提升开发者生产力方面非常出色，但这也有其弊端。\n\n很容易创建出缺乏可用性的组件。例如，你可能有一些键盘支持较差的表单，只能通过点击超链接的\
  \ `onClick` 事件来提交表单。这阻止了用户通过键盘按 `enter` 键来提交表单，而这是 HTML 表单的默认行为。\n\n同样，也很容易创建出高度可用的优秀组件。在构建组件时需要投入时间和思考。正是那些细微之处，才让组件变得高度可用且体验良好。\n\
  \n以下是一些创建可用表单的最佳实践。它们并非 React 所特有。\n\n### 清晰传达你的需求\n\n良好的沟通在应用程序的各个方面都很重要，尤其是在表单中。\n\
  \n使用 HTML 标签是向用户传达表单元素期望输入内容的绝佳方式。对于某些输入类型（如单选按钮和复选框），这些标签还为用户提供了与表单元素交互的额外方式。\n\
  \n占位符旨在显示示例输入或未输入数据时的默认值。曾经有一种潮流是将验证提示放在占位符中。但这可能带来问题，因为当用户开始输入时，验证提示就会消失。通常更好的做法是将验证提示显示在输入框旁边，或者在验证要求未满足时以弹出框形式显示。\n\
  \n### 持续提供反馈\n\n这一点与清晰传达需求紧密相关。尽快向用户提供反馈非常重要。\n\n验证错误是持续提供反馈的完美示例。众所周知，在错误发生时显示验证错误能提升表单的可用性。在早期\
  \ Web 应用时代，所有用户都必须等到填写完整个表单才能知道输入是否正确。浏览器端的验证是可用性方面的一次巨大飞跃。提供验证错误反馈的理想时机是在输入框失去焦点（`blur`）时。\n\
  \n向用户表明你正在处理他们的请求也很重要。对于需要一些时间才能完成的操作尤其如此。显示旋转加载图标、进度条、通知消息等，是告知用户你的应用程序没有冻结的好方法。用户有时会非常不耐烦，但如果他们知道你的应用程序正在处理他们的请求，他们也能保持耐心。\n\
  \n过渡和动画是告知用户应用程序中正在发生什么的另一种好方法。它们是应用程序中某些内容发生变化的视觉提示。请参阅第 10 章，了解如何在 React 中利用这一点。\n\
  \n### 快速响应\n\nReact 拥有非常强大的渲染引擎。它能让你的应用程序开箱即用，速度相当快。然而，有时更新 DOM 的速度并不是拖慢应用程序的原因。\n\
  \n过渡效果就是一个很好的例子。长时间运行的过渡可能会让用户感到沮丧，因为他们被迫等待过渡完成才能继续使用应用程序。\n\n应用程序之外的其他因素也会影响其运行速度，例如长时间的\
  \ AJAX 调用和糟糕的网络性能。如何解决这类问题可能非常依赖于你的应用程序，并且可能超出你的控制范围，比如第三方服务。在这种情况下，更重要的是向用户反馈他们请求的状态。\n\
  \n请记住，速度是相对的。它是用户的一种感知。看起来快比实际快更重要。例如，当用户在你的应用程序中点击“点赞”时，你可以在向服务器发送 AJAX 调用之前先增加点赞数。这样，即使\
  \ AJAX 调用耗时较长，用户也不会看到延迟。然而，这可能会在处理错误时引发其他问题。\n\n### 可预测\n\n用户对事物如何运作有预先的认知。这基于他们以往的经验。在大多数情况下，他们以往的经验**并非**来自使用你的应用程序。\n\
  \n如果你的应用程序与用户所在的平台相似，用户会期望你的应用程序遵循该平台的默认行为。\n\n考虑到这一点，你有两个选择。要么遵循平台的默认行为，要么彻底改变你的用户界面，使其不再像该平台。\n\
  \n一致性是另一种可预测性。如果你的交互在应用程序的不同部分始终如一，用户将学会预测新部分中的交互方式。这与应用程序所运行平台的一致性密切相关。\n\n###\
  \ 可访问性\n\n开发人员和设计人员在创建用户界面时常常忽视可访问性。在考虑用户界面的各个方面时，牢记用户的需求非常重要。如前所述，用户对事物如何运作有预先的期望，这基于*他们*以往的经验。\n\
  \n他们以往的经验也决定了他们对不同输入类型的偏好。在某些情况下，用户可能在使用特定输入设备（如键盘或鼠标）时存在身体上的困难。他们也可能在使用输出设备（如显示器或扬声器）时遇到问题。\n\
  \n为所有不同类型的输入和输出设备提供支持，可能并不适用于应用程序的每个方面。了解用户的需求和偏好，然后优先处理这些领域，这一点很重要。\n\n测试应用程序可访问性的一个好方法是尝试仅通过一种输入设备（键盘/鼠标/触摸屏）来导航你的应用程序。这将突显该设备的可用性问题。\n\
  \n你还可能需要考虑视力受损的用户如何与你的应用程序交互。屏幕阅读器是视力受损人士的“眼睛”。\n\nHTML5 有一个可访问的富互联网应用程序（ARIA）规范，它提供了一种方法，可以为屏幕阅读器等辅助技术添加缺失的语义。这允许你提示\
  \ UI 组件的 `role`，在屏幕阅读器激活时隐藏或显示元素，以及更多功能。\n\n有一些很好的工具可以帮助你提升应用程序的可访问性，例如 Google Chrome\
  \ 的 Accessibility Developer Tools。\n\n### 减少用户输入\n\n减少用户需要输入的数据量是提升应用程序可用性的好方法。用户需要输入的信息越少，他们犯错的可能性就越小，需要思考的内容也越少。\n\
  \n与**快速响应**一样，用户感知很重要。用户面对包含许多输入字段的大型表单会感到畏惧，因此他们的思维难以应对。将表单拆分成更小、更易于管理的块，会给人一种用户输入更少的印象。这反过来使用户能够更专注于数据输入。\n\
  \n\n\n\n`Autofill` 是减少数据输入的另一种绝佳方式。利用用户的浏览器自动填充数据，可以避免用户重新输入地址或支付详情等常见信息。这通过在输入字段上使用标准名称来实现。\n\
  \n`Autocomplete` 可以在用户输入信息时提供引导，这与持续反馈的理念相契合。例如，在搜索电影时，`autocomplete` 有助于缓解因电影名称拼写错误带来的问题。\n\
  \n另一种减少输入的有效方法是根据先前输入的数据推导信息。例如，如果用户正在输入信用卡详细信息，你可以查看前 4 位数字来确定卡的类型，然后为用户选择卡类型。这既减少了输入，又向用户提供了验证反馈，表明他们正在正确输入卡号。\n\
  \n`Autofocus` 是一个虽小但非常有效的方法，可以提升表单的可用性。`Autofocus` 有助于引导用户找到数据输入的起点，从而避免他们自行摸索。这个小工具对用户开始输入数据的速度有着显著影响。\n\
  \n## 总结\n\n`React` 通过将状态管理从 DOM 中抽离到组件中，帮助你管理表单的状态。这让你能够更紧密地控制表单元素的操作方式，并创建可在应用中使用的复杂组件。\n\
  \n表单是用户在你的应用中最复杂的交互之一。在创建和组合表单组件时，务必牢记表单的可用性。\n\n接下来，你将学习如何为 React 组件添加动画，以创建更具吸引力的应用。\n\
  \n# 第 10 章 动画\n\n现在你已经能够组合复杂的 React 组件，是时候进行一些润色了。动画可以让用户体验更流畅、更自然，而 React 的 Transition\
  \ Groups 插件结合 CSS3，使得在 React 项目中轻松集成动画过渡成为可能。\n\n历史上，浏览器中的动画采用非常命令式的 API。你需要获取一个元素并主动移动它或更改其样式来实现动画。这种方法与\
  \ React 的组件渲染和重新渲染方式相悖，因此 React 采用了更声明式的方法。\n\nCSS Transition Groups 通过在适当的渲染和重新渲染时机策略性地添加和移除类，来促进\
  \ CSS 动画应用于过渡。这意味着你唯一需要做的就是为这些类指定合适的 CSS 样式。\n\nInterval Rendering 提供了更大的灵活性和控制力，但会牺牲性能。它需要更多的重新渲染，但允许你动画化不仅仅是\
  \ CSS 属性，例如滚动位置和 Canvas 绘图。\n\n## CSS Transition Groups\n\n在本例中，我们将为示例应用中的评论编辑面板添加进出动画。`editingPane`\
  \ 要么是一个 React 元素，要么是 null。\n\n```\n<ReactCSSTransitionGroup \n  transitionName='EditingPaneTransition'\n\
  \  transitionEnterTimeout={300}\n  transitionLeaveTimeout={1200}\n>\n  {editingPane}\n\
  </ReactCSSTransitionGroup>\n```\n\n这个 `ReactCSSTransitionGroup` 组件来自一个插件，在文件顶部附近通过\
  \ `var ReactCSSTransitionGroup = require('react-addons-css-transition-group')` 引入。\n\
  \n它会自动在适当的时间处理组件的重新渲染，并根据过渡所处的阶段，更改过渡组的类，以便根据情境进行样式设置。\n\n你可以在以下地址阅读示例应用的完整源代码：[`git.io/vlcpa`](http://git.io/vlcpa)。\n\
  \n### 样式化过渡类\n\n按照惯例，`transitionName='EditingPaneTransition'` 属性将该元素与四个 CSS 类关联起来：`EditingPaneTransition-enter`、`EditingPaneTransition-enter-active`、`EditingPaneTransition-leave`\
  \ 和 `EditingPaneTransition-leave-active`。`CSSTransitionGroup` 插件会在子组件进入或离开 `ReactCSSTransitionGroup`\
  \ 组件时自动添加和移除这些类。\n\n以下是 CSS 示例。\n\n```\n.EditingPaneTransition-enter {\n  transform:\
  \ scale(1.2);\n  transition: transform 0.3s cubic-bezier(.97,.84,.5,1.21);\n}\n\n\
  .EditingPaneTransition-enter-active {\n  transform: scale(1);\n}\n\n.EditingPaneTransition-leave\
  \ {\n  transform: translateY(0);\n  opacity: 0;\n  transition: opacity 1.2s, transform\
  \ 1s cubic-bezier(.52,-0.25,.52,.95);\n}\n\n.EditingPaneTransition-leave-active\
  \ {\n  opacity: 0;\n  transform: translateY(-100%);\n}\n```\n\n### 过渡生命周期\n\n`EditingPaneTransition-enter`\
  \ 和 `EditingPaneTransition-enter-active` 的区别在于：`EditingPaneTransition-enter` 类在组件添加到组时立即应用，而\
  \ `EditingPaneTransition-enter-active` 类在下一个 tick 时应用。这让你可以轻松指定过渡的起始样式、结束样式以及如何执行过渡。\n\
  \n默认情况下，过渡组同时启用进入和离开动画，但你可以通过向组件添加 `transitionEnter={false}` 或 `transitionLeave={false}`\
  \ 属性来禁用其中任意一个或全部。除了让你控制想要启用哪个动画之外，你还可以根据可配置的值来情境性地完全禁用动画，如下所示：\n\n```\n<ReactCSSTransitionGroup\
  \ \n  transitionName='EditingPaneTransition'\n  transitionEnter={this.props.enableAnimations}\n\
  \  transitionLeave={this.props.enableAnimations}\n  // ...\n>\n  {questions}\n</ReactCSSTransitionGroup>\n\
  ```\n\n## 过渡组的陷阱\n\n使用过渡组时需要注意两个重要陷阱。\n\n首先，过渡组会延迟移除子组件，直到动画完成。这意味着如果你将一个组件列表包裹在过渡组中，但没有为\
  \ `transitionName` 类指定任何 CSS，那么这些组件将无法被移除，即使你尝试停止渲染它们也不行！\n\n其次，过渡组的每个子组件都必须设置唯一的\
  \ `key` 属性。过渡组使用这些值来确定组件何时进入或离开组，因此如果缺少 `key` 属性，动画可能无法运行，组件也可能变得无法移除。\n\n请注意，即使过渡组只有一个子组件，它也必须具有\
  \ `key` 属性。\n\n## 间隔渲染\n\nCSS3 动画可以提供出色的性能和简洁的代码，但它们并非总是适合所有任务。有时你需要支持不支持 CSS3 动画的旧浏览器。其他时候，你可能想要动画化非\
  \ CSS 属性，例如滚动位置或 Canvas 绘图。在这些情况下，间隔渲染可以满足你的需求，但与 CSS3 动画相比，会牺牲性能。\n\n间隔渲染的基本思想是定期触发组件状态更新，以指定动画在其总运行时间中的进度。通过将此状态值纳入组件的渲染函数，组件可以在每次状态变化导致重新渲染时表示动画的适当阶段。\n\
  \n由于这种方法涉及大量重新渲染，通常最好与 `requestAnimationFrame` 结合使用，以避免不必要的渲染。然而，在 `requestAnimationFrame`\
  \ 不可用或不受欢迎的环境中，退而使用不太可预测的 `setTimeout` 可能是唯一的选择。\n\n### 使用 requestAnimationFrame\
  \ 进行间隔渲染\n\n\n\n\n\n假设你想使用间隔渲染在屏幕上移动一个 `div`。你可以通过给它设置 `position: absolute`，然后随时间更新它的\
  \ `left` 或 `top` 样式属性来实现。在 `requestAnimationFrame` 上执行此操作，并根据经过的时间量来决定变化幅度，应该能实现平滑的动画效果。\n\
  \n下面是一个示例实现。\n\n```\n class Positioner extends React.Component {\n  constructor()\
  \ { super(); this.state = {position: 0} }\n\n  resolveAnimationFrame() {\n    var\
  \ timestamp = new Date();\n    var timeRemaining = Math.max(0, this.props.animationCompleteTimestamp\
  \ - timestamp);\n\n    if (timeRemaining > 0) {\n      this.setState({position:\
  \ timeRemaining});\n    }\n  }\n\n  componentWillUpdate: function() {\n    if (this.props.animationCompleteTimestamp)\
  \ {\n      requestAnimationFrame(() => this.resolveAnimationFrame());\n    }\n \
  \ }\n\n  render() {\n    var divStyle = {left: this.state.position};\n\n    return\
  \ <div style={divStyle}>This will animate!</div>\n  }\n});\n```\n\n在这个示例中，组件在其 `props`\
  \ 中有一个 `animationCompleteTimestamp` 值，它结合 `requestAnimationFrame` 回调返回的时间戳来计算剩余移动量。结果值存储为\
  \ `this.state.position`，然后 `render` 方法使用它来定位 `div`。\n\n由于 `componentWillUpdate`\
  \ 处理程序调用了 `requestAnimationFrame`，因此组件 props 的任何更改（例如 `animationCompleteTimestamp`\
  \ 的更改）都会触发它，这包括 `resolveAnimationFrame` 内部对 `this.setState` 的调用。这意味着一旦设置了 `animationCompleteTimestamp`，组件将自动连续触发后续的\
  \ `requestAnimationFrame` 调用，直到当前时间超过 `animationCompleteTimestamp` 的值。\n\n请注意，此逻辑仅围绕时间戳展开。对\
  \ `animationCompleteTimestamp` 的更改会启动它，而 `this.state.position` 的值完全取决于当前时间与 `animationCompleteTimestamp`\
  \ 之间的差值。因此，`render` 方法可以自由地使用 `this.state.position` 进行任何类型的动画，从设置滚动位置到在画布上绘制，以及介于两者之间的任何操作。\n\
  \n### 使用 setTimeout 进行间隔渲染\n\n尽管 `requestAnimationFrame` 很可能以最小的开销为你带来最流畅的动画，但它在旧版浏览器中不可用，并且可能比你期望的更频繁（或更不可预测地）触发。在这些情况下，你可以改用\
  \ `setTimeout`。\n\n```\n var Positioner = React.createClass({\n  getInitialState:\
  \ function() { return {position: 0}; },\n\n  resolveSetTimeout: function() {\n \
  \   var timestamp = new Date();\n    var timeRemaining = Math.max(0, this.props.animationCompleteTimestamp\
  \ - timestamp);\n\n    if (timeRemaining > 0) {\n      this.setState({position:\
  \ timeRemaining});\n    }\n  },\n\n  componentWillUpdate: function() {\n    if (this.props.animationCompleteTimestamp)\
  \ {\n      setTimeout(this.resolveSetTimeout, this.props.timeoutMs);\n    }\n  },\n\
  \n  render: function() {\n    var divStyle = {left: this.state.position};\n\n  \
  \  return <div style={divStyle}>This will animate!</div>\n  }\n});\n```\n\n由于 `setTimeout`\
  \ 接受一个明确的时间间隔，而 `requestAnimationFrame` 自行决定该间隔，因此该组件额外依赖 `this.props.timeoutMs`，它指定了要使用的间隔。\n\
  \n开源库 [React Tween State](https://github.com/chenglou/react-tween-state) 为这种动画风格提供了一个方便的抽象层。\n\
  \n### 弹簧动画\n\nCSS 过渡使用简单，有时也足够好。但它们有很多局限性，从仅支持贝塞尔曲线到无法在动画中途停止或过渡到新值。Web 在支持弹簧动画方面已经落后于移动端和其他原生应用的潮流。\n\
  \n这时，像 react-motion（[`github.com/chenglou/react-motion`](https://github.com/chenglou/react-motion)）这样的工具就派上了用场。我们这里使用的是\
  \ react-motion 0.3.1，所以请务必查看与你版本对应的文档。\n\n首先，我们需要导入 react-motion 对过渡组的处理：\n\n```\n\
  \ import {TransitionMotion, spring} from 'react-motion';\n```\n\n然后我们可以在 `render`\
  \ 中使用它。它的 API 有些奇特，我们传递一个函数作为子元素，而不是直接传递元素。然后它将样式值的当前进度传递给该函数，并基于此进行渲染。\n\n```\n\
  \ <TransitionMotion\n  willEnter={() => ({ opacity: spring(0) })}\n  willLeave={()\
  \ => ({ opacity: spring(0) })}\n  styles={this.state.show ? {x: {opacity: spring(1)}}\
  \ : {}}\n>\n  {() => {\n    var {x} = styles;\n    if (!x) return null;\n    return\
  \ <div styles={x}>Hello world</div>;\n  }}\n</TransitionMotion>\n```\n\n当 `this.state.show`\
  \ 变为 `true` 时，它会以基于物理的平滑过渡动画进入，并以相同方式动画退出。如果过渡未完成，它会平滑地动画到新值。\n\n你可以完全用弹簧物理效果替换\
  \ CSS 过渡，以改善用户体验。\n\n## 总结\n\n使用这些动画技术，你现在可以：\n\n1.  使用 CSS3 和过渡组高效地实现状态之间的过渡动画。\n\
  \n2.  使用 `requestAnimationFrame` 在 CSS 之外进行动画，例如滚动位置和 Canvas 绘制。\n\n3.  在 `requestAnimationFrame`\
  \ 不可行的情况下，回退到 `setTimeout`。\n\n4.  实现弹簧动画。\n\n接下来，你将学习如何微调你的 React 性能！\n\n# 第 11\
  \ 章 性能调优\n\nReact 的 DOM diffing 允许你在任何时间点有效地丢弃整个 UI，而对 DOM 的影响最小。然而，在某些情况下，对组件进行精细调优以渲染新的虚拟\
  \ DOM 表示，可以帮助你的应用运行得更快。例如，当你有一个非常深的嵌套组件树时，这很有用。在本章中，我们将介绍一个简单的配置，你可以将其提供给组件以帮助加速应用。\n\
  \n## shouldComponentUpdate\n\n当组件更新时（无论是通过接收新的 `props` 还是调用 `setState`），React 都会调用该组件的每个子组件的\
  \ `render` 方法。在大多数情况下，这可以毫无问题地执行，但在具有深层嵌套组件树或复杂 `render` 方法的页面上，你可能会遇到一些卡顿。\n\n\
  有时，组件的 `render` 方法会在不需要时被调用。当你的组件不使用 `state` 或 `props`，或者当父组件重新渲染时 `props` 或 `state`\
  \ 没有变化时，就可能发生这种情况。因此，再次渲染组件会产生与现有虚拟 DOM 完全相同的表示，这是不必要的。\n\nReact 提供了组件生命周期方法 `shouldComponentUpdate`，它让你能够帮助\
  \ React 做出正确决策，决定是否调用特定组件的 `render` 方法。\n\n`shouldComponentUpdate` 应返回一个布尔值。`false`\
  \ 告诉 React 不要调用组件的 `render` 方法，并使用之前渲染的虚拟 DOM。返回 `true` 将告诉 React 调用组件的 `render`\
  \ 方法以获取新的虚拟 DOM 表示。默认情况下，`shouldComponentUpdate` 返回 `true`，因此组件总是会重新渲染。\n\n请注意，`shouldComponentUpdate`\
  \ 在组件的初始渲染时不会被调用。\n\n`shouldComponentUpdate` 接收新的 `props` 和 `state` 作为参数，以帮助你决定是否重新渲染。例如，一个只有一个\
  \ `prop` 且没有 `state` 的组件可以这样写：\n\n```\n shouldComponentUpdate(nextProps, nextState){\n\
  \    if (this.props.data !== nextProps.data) {\n      return true;\n    }\n    return\
  \ false;\n  }\n```\n\n\n\n\n\n对于始终根据相同 props 和 state 渲染相同内容的纯组件，你可以添加 `react-addons-pure-render-mixin`。由于我们使用的是\
  \ ES6 类，我们需要一个名为 `react-mixin` 的库（[`github.com/brigand/react-mixin`](https://github.com/brigand/react-mixin)），它允许你使用\
  \ mixin。这是少数应该使用 mixin 而非高阶组件的场景之一。\n\n你可以在 [`git.io/vlcpa`](http://git.io/vlcpa)\
  \ 阅读我们示例应用（一个 Reddit 克隆）的完整源代码。\n\n该 mixin 会覆盖 `shouldComponentUpdate`，将新的 props\
  \ 和 state 与旧的进行比较，如果它们相等则返回 false，就像上面的例子一样。\n\n有几个组件非常简单，比如 `EditEssayQuestion`，你可以将\
  \ `React.addons.PureRenderMixin` 与它一起使用：\n\n```\nimport reactMixin from 'react-mixin';\n\
  import PureRenderMixin from 'react-addons-pure-render-mixin';\nclass Foo extends\
  \ React.Component {\n  render(){\n    ...\n  }\n}\nreactMixin.onClass(Foo, PureRenderMixin);\n\
  ```\n\n当你有深层嵌套的复杂 props 或 state 时，比较可能会变慢。为了缓解这个问题，考虑使用不可变数据结构，比如第 16 章中讨论的那些。\n\
  \n## 键（Key）\n\n大多数情况下，你会在列表中使用 `key` prop。它的目的是通过比组件类更多的信息来向 React 标识一个组件。例如，如果你有一个\
  \ `div` 带有 `key=\"foo\"`，后来变为 `\"bar\"`，React 将跳过 diff 并完全丢弃子元素，从头开始渲染。\n\n这在渲染大型子树以避免\
  \ diff 时非常有用，因为你知道 diff 是浪费时间。除了告诉 React 何时丢弃节点外，在许多情况下，它还可以在元素顺序发生变化时使用。例如，考虑以下基于排序函数显示项目的渲染：\n\
  \n```\nvar items = sortBy(this.state.sortingAlgorithm, this.props.items);\nreturn\
  \ items.map(function (item) {\n  return <img src={item.src} />;\n});\n```\n\n如果顺序发生变化，React\
  \ 会对这些进行 diff，并确定最高效的操作是更改某些 `img` 元素的 `src` 属性。这非常低效，并且会导致浏览器查询其缓存，可能引发新的网络请求。\n\
  \n为了解决这个问题，你可以简单地使用每个项目唯一的字符串（或数字）作为 key：\n\n```\nreturn <img src={item.src} key={item.id}\
  \ />;\n```\n\n现在 React 会查看这个，而不是更改 `src` 属性，它会意识到要执行的最小 `insertBefore` 操作，这是移动 DOM\
  \ 节点最有效的方式。\n\n除了顺序变化外，非末尾的插入也适用。如果没有正确的 key 属性，在数组前面插入一个项目会导致所有后续 `<img>` 标签的 `src`\
  \ 属性发生变化。\n\n同样值得注意的是，虽然你看起来将 key 作为 prop 传递，但在组件内部无法以任何方式访问它。\n\n## 总结\n\n在本章中，你学习了如何：\n\
  \n1. 修改 `shouldComponentUpdate` 以返回 true/false 来提高性能。\n\n2. 使用 `key` 帮助 React 了解子组件列表的最小变化。\n\
  \n到目前为止，我们专注于在浏览器中使用 React，接下来你将学习通用（也称为同构）应用：在服务器上使用 JavaScript 和 React。\n\n# 第\
  \ 12 章 服务器端渲染\n\n如果你希望搜索引擎抓取你的网站，服务器端渲染至关重要。它还能提供性能提升，因为浏览器可以在 JavaScript 仍在加载时就开始显示你的网站。\n\
  \nReact 中的虚拟 DOM 是 React 能够用于服务器端渲染的核心。每个 React 组件首先渲染到虚拟 DOM，然后 React 获取虚拟 DOM\
  \ 并用任何更改更新真实 DOM。虚拟 DOM 作为 DOM 的内存表示，使得 React 能够在非浏览器环境（如 Node.js）中工作。React 不是更新真实\
  \ DOM，而是从虚拟 DOM 生成字符串。这允许你在客户端和服务器上使用相同的 React 组件。\n\nReact 提供了两个可用于在服务器端渲染组件的函数：`React.renderToString`\
  \ 和 `React.renderToStaticMarkup`。\n\n组件的服务器端渲染需要在设计组件时具有前瞻性。你需要考虑：\n\n* 使用哪个渲染函数最好。\n\
  \n* 如何支持组件的异步状态。\n\n* 如何将应用的初始状态传递给客户端。\n\n* 服务器端有哪些生命周期函数可用。\n\n* 如何支持应用的同构路由。\n\
  \n* 你对单例、实例和上下文的使用。\n\n## 渲染函数\n\n在服务器端渲染 React 组件时，你不能使用标准的 `React.render` 方法，因为服务器端没有\
  \ DOM。React 通过提供两个支持标准 React 组件生命周期方法子集的渲染函数来实现服务器端渲染。\n\n### React.renderToString\n\
  \n可以在服务器端使用的两个渲染函数中的第一个是 `React.renderToString`。这是你最常使用的函数。\n\n与 `React.render`\
  \ 不同，此函数不接受渲染位置的参数，而是返回一个字符串。这是一个同步（阻塞）函数，速度非常快。\n\n```\nvar MyComponent = React.createClass({\n\
  \  render: function () {\n    return <div>Hello World!</div>;\n  }\n});\n\nvar world\
  \ = React.renderToString(<MyComponent/>);\n\n//单行输出 - 为示例格式化\n<div \n  data-reactid=\"\
  .fgvrzhg2yo\" \n  data-react-checksum=\"-1663559667\"\n>Hello World!</div>\n```\n\
  \n你会注意到 React 在 `<div>` 上添加了两个 data 属性。\n\n`data-reactid` 被 React 用于在浏览器环境中标识 DOM\
  \ 节点。这样它就知道当 state 和 props 发生变化时要更新哪个 DOM 节点。\n\n`data-react-checksum` 仅在服务器端添加。顾名思义，它是所创建\
  \ DOM 的校验和。这允许 React 在客户端渲染相同组件时重用来自服务器的 DOM。这仅添加到根元素。\n\n### React.renderToStaticMarkup\n\
  \n`React.renderToStaticMarkup` 是可以在服务器端使用的第二个渲染函数。\n\n它与 `React.renderToString`\
  \ 相同，只是不包含 React 的 data 属性。\n\n```\nvar MyComponent = React.createClass({\n  render:\
  \ function () {\n    return <div>Hello World!</div>;\n  }\n});\n\nvar world = React.renderToStaticMarkup(<MyComponent/>);\n\
  \n//单行输出\n<div>Hello World!</div>\n```\n\n### 字符串还是静态标记\n\n每个渲染函数都有其用途，因此你需要根据需求来决定使用哪个渲染函数。\n\
  \n仅当你*不*打算在客户端渲染相同的 React 组件时，才使用 `React.renderToStaticMarkup`。\n\n以下是一些示例：\n\n\
  * 生成 HTML 邮件。\n\n* 通过 HTML 转 PDF 生成 PDF。\n\n* 测试组件。\n\n在大多数情况下，你会希望使用 `React.renderToString`。这将允许\
  \ React 使用 `data-react-checksum` 来使客户端上相同 React 组件的初始化更快。由于 React 可以重用服务器提供的 DOM，它可以跳过生成\
  \ DOM 节点并将其附加到文档的昂贵过程。对于复杂的网站，这可以显著减少加载时间，使用户能够更快地与你的网站交互。\n\n你的 React 组件在服务器和客户端上渲染*完全*相同非常重要。如果\
  \ `data-react-checksum` 不匹配，React 将销毁服务器提供的 DOM 并生成新的 DOM 节点，然后将其附加到文档。在这种情况下，你将失去服务器端渲染的大部分性能优势。\n\
  \n## 服务器端组件生命周期\n\n\n\n\n\n当渲染为字符串时，只有 `before` 渲染的生命周期方法会被调用。关键在于，`componentDidMount`\
  \ 和 `componentWillUnmount` 在渲染过程中不会被调用，而 `componentWillMount` 会在两端都被调用。\n\n在创建将在服务器和客户端上渲染的组件时，你需要牢记这一点。尤其是在创建事件监听器时，因为没有组件生命周期方法能让你知道\
  \ React 组件何时完成渲染。\n\n在 `componentWillMount` 中启动的任何事件监听器或定时器都可能导致服务器上的内存泄漏。\n\n最佳实践是仅在\
  \ `componentDidMount` 中创建事件监听器和定时器，并在 `componentWillMount` 中停止它们。\n\n### 设计组件\n\n\
  在服务器端渲染时，你需要特别考虑如何将状态传递给客户端，以充分利用服务器端渲染的性能优势。这意味着在设计组件时就要考虑到服务器端渲染。\n\n你应该始终这样设计\
  \ React 组件：当向组件传递相同的 props 时，总能得到相同的 `初始` 渲染结果。如果始终这样做，就能提高组件的可测试性，并且可以保证在服务器和客户端上渲染的结果一致。这对于确保获得服务器端渲染的性能优势非常重要。\n\
  \n假设你想要一个打印随机数的组件。这会带来问题，因为结果几乎总是不同的。如果这个组件先在服务器上渲染，然后在客户端上渲染，校验和就会失败。\n\n```\n\
  var MyComponent = React.createClass({\n  render: function () {\n    return <div>{Math.random()}</div>;\n\
  \  }\n});\n\nvar result = React.renderToStaticMarkup(<MyComponent/>);\nvar result2\
  \ = React.renderToStaticMarkup(<MyComponent/>);\n\n//result\n<div>0.5820949131157249</div>\n\
  \n//result2 \n<div>0.420401572631672</div>\n```\n\n如果你修改组件，让它通过 props 接收随机数，那么你就可以将\
  \ props 传递给客户端用于渲染。\n\n```\nvar MyComponent = React.createClass({\n  render: function\
  \ () {\n    return <div>{this.props.number}</div>;\n  }\n});\n\nvar num = Math.random();\n\
  \n//服务器端\nReact.renderToString(<MyComponent number={num}/>);\n\n//将 num 传递给客户端\n\
  React.render(<MyComponent number={num}/>, document.body);\n```\n\n有多种方法可以将服务器上使用的\
  \ props 发送给客户端。\n\n最简单的方法之一是通过 JavaScript 对象将初始 props 传递给客户端。\n\n```\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<title>示例</title>\n<!-- bundle 包含 MyComponent、React 等 -->\n\
  <script type=\"text/javascript\" src=\"bundle.js\"></script>\n</head>\n<body>\n\
  <!-- MyComponent 服务器端渲染的结果 -->\n<div data-reactid=\".fgvrzhg2yo\" data-react-checksum=\"\
  -1663559667\">\n0.5820949131157249</div>\n\n<!-- 注入服务器端使用的初始 props -->\n<script\
  \ type=\"text/javascript\">\n  var initialProps = {\"num\": 0.5820949131157249};\n\
  </script>\n\n<!-- 使用来自服务器的初始 prop -->\n<script type=\"text/javascript\">\n  var\
  \ num = initialProps.num;\n  React.render(<MyComponent number={num}/>, document.body);\n\
  </script>\n</body>\n</html>\n```\n\n### 异步状态\n\n许多应用程序需要从远程数据源（如数据库或 Web 服务）获取数据。在客户端上，这不成问题。React\
  \ 组件可以在等待异步数据返回时显示加载视图。但在服务器端，这种行为无法直接用 React 复制，因为渲染函数是同步的。为了使用异步数据，你需要先获取数据，然后在渲染时将数据传递给组件。\n\
  \n**示例：**\n\n你可能希望从异步存储中获取用户记录，以便在组件中使用。\n\n**并且**\n\n出于 SEO 和性能考虑，你希望获取用户记录后的组件状态在服务器端渲染。\n\
  \n**并且**\n\n你希望组件在客户端监听变化并重新渲染。\n\n**问题：** 由于 `React.renderToString` 是同步的，你无法使用任何组件生命周期方法来获取异步数据。\n\
  \n**解决方案：** 使用静态函数来获取异步数据，然后将其传递给组件进行渲染。将 `initialState` 作为 props 传递给客户端。使用组件生命周期方法监听变化并更新状态，同时使用相同的\
  \ `statics` 函数。\n\n```\nvar Username = React.createClass({\n  statics: {\n    getAsyncState:\
  \ function (props, setState) {\n      User.findById(props.userId)\n        .then(function\
  \ (user) {\n          setState({user:user});\n        })\n        .catch(function\
  \ (error) {\n          setState({error: error});\n        });\n    }\n  },\n  //客户端和服务器端\n\
  \  componentWillMount: function () {\n    if (this.props.initialState) {\n     \
  \ this.setState(this.props.initialState);\n    }\n  },\n  //仅客户端\n  componentDidMount:\
  \ function () {\n    //如果 props 中没有 initialState，则获取异步状态\n    if (!this.props.initialState)\
  \ {\n      this.updateAsyncState();\n    }\n    //监听变化\n    User.on('change', this.updateAsyncState);\n\
  \  },\n  //仅客户端\n  componentWillUnmount: function () {\n    //停止监听变化\n    User.off('change',\
  \ this.updateAsyncState);\n  },\n  updateAsyncState: function () {\n    //从实例内部访问静态函数\n\
  \    this.constructor.getAsyncState(this.props, this.setState);\n  },\n  render:\
  \ function () {\n    if (this.state.error) {\n      return <div>{this.state.error.message}</div>;\n\
  \    }\n    if (!this.state.user) {\n      return <div>加载中...</div>;\n    }\n  \
  \  return <div>{this.state.user.username}</div>;\n  }\n});\n\n//在服务器上渲染\n\nvar props\
  \ = {\n  userId: 123 //也可以从路由中获取\n};\n\nUsername.getAsyncState(props, function(initialState){\n\
  \  props[initialState] = initialState;\n  var result = React.renderToString(Username(props));\n\
  \n  //将结果和 initialState 一起发送给客户端\n});\n```\n\n使用上述解决方案，仅在服务器上需要预取异步数据。在客户端上，只需在初始渲染时查找从服务器传递的\
  \ `initialState`。后续客户端上的路由变化（例如 HTML5 pushState 或片段变化）应忽略来自服务器的任何 `initialState`。你还希望在获取数据时显示加载信息。\n\
  \n### 同构路由\n\n路由是任何非平凡应用程序的重要组成部分。要在服务器端使用路由器渲染 React 应用程序，你需要确保路由器支持在没有 DOM 的情况下进行渲染。\n\
  \n获取异步数据是路由器和其路由控制器的职责。假设一个深层嵌套的组件需要一些异步数据。如果这些数据是 SEO 所需的，那么获取数据的责任应该上移到路由控制器，并将数据向下传递给深层嵌套的组件。如果不需要用于\
  \ SEO，那么只需在客户端的 `componentDidMount` 中获取数据即可。这类似于经典的 AJAX 加载数据。\n\n在寻找 React 的同构路由解决方案时，请确保它支持异步状态，或者可以轻松修改以支持异步状态。理想情况下，你还希望路由器处理将\
  \ `initialState` 传递给客户端。\n\n### 单例、实例和上下文\n\n在浏览器中，你的应用程序被封装在一个隔离的“气泡”中。应用程序的每个实例不能与其他实例混合状态，因为每个实例通常位于不同的计算机上，或者在同一台计算机上被沙箱隔离。这使得你可以轻松地在应用程序架构中使用单例。\n\
  \n\n\n\n\n当你开始将代码迁移到服务器上运行时，需要格外小心，因为同一作用域内可能同时运行着应用的多个实例。这可能导致应用的两个实例修改单例的状态，从而引发意外行为。\n\
  \nReact 的渲染是同步的，因此你可以在服务器端渲染应用之前重置所有使用的单例。如果异步状态需要使用单例，就会遇到问题。此外，在获取异步状态用于渲染时，你也需要考虑这一点。\n\
  \n即使重置了单例，在渲染之前，隔离运行你的应用始终是更好的选择。像 Contextify 这样的包允许你在服务器上彼此隔离地运行代码。这类似于在客户端使用 webworker。Contextify\
  \ 的工作原理是获取你的应用代码，并在一个独立的 Node.js V8 实例中运行它。一旦代码加载完成，你就可以在该上下文中调用函数。这种方法让你可以自由使用单例，但会带来性能开销，因为每个请求都需要启动一个新的\
  \ Node.js V8 实例。\n\nReact 核心开发团队不鼓励在组件树中传递上下文和实例。这会使你的组件可移植性降低，并且应用中深层某个组件的依赖关系变化会向上影响组件层级中的所有组件。这反过来增加了应用的复杂性，随着应用的增长，可维护性也会降低。\n\
  \n在决定使用单例还是实例来控制上下文时，每种方法都有其权衡。你需要评估自己的具体需求，然后决定采用哪种方法。你还需要考虑所使用的第三方库的架构方式。\n\n\
  ## 总结\n\n服务端渲染是构建搜索引擎优化的网站和 Web 应用的重要组成部分。React 支持在服务器和客户端浏览器上渲染相同的 React 组件。为了有效实现这一点，你需要确保整个应用的架构能够支持服务端渲染。\n\
  \n接下来，你将学习 React 家族中的开发和构建工具。\n\n# 第 13 章 开发工具\n\nReact 利用了几层抽象来帮助简化组件的开发并理解应用的状态。这些抽象在调试、构建和发布应用时存在缺点。\n\
  \n幸运的是，有一些出色的开发工具可以帮助你调试和构建应用。在本章中，我们将探讨可以与 React 有效配合使用的构建工具和调试工具。\n\n## 构建工具\n\
  \n构建工具帮助你简化重复性任务，使运行代码的过程更加容易。React 开发中最重复的任务之一是对所有 React 组件运行 JSX 解析器。另一个重要任务是将所有模块打包成一个或多个包，以便发送到浏览器。\n\
  \n让我们看看如何将两个流行的 JavaScript 构建工具 Browserify 和 Webpack 与 React 结合使用。\n\n### Browserify\n\
  \nBrowserify 是一个 JavaScript 打包工具，允许在浏览器中使用 Node.js 风格的 `require()` 调用。在不深入细节以免迷失方向的前提下，Browserify\
  \ 将所有 require 打包成一个适合在浏览器环境中运行的 JavaScript 文件。对任何包含 `require` 语句的 JavaScript 文件运行\
  \ Browserify，都会自动打包所需的 JavaScript。\n\n虽然功能强大，但 Browserify 仅适用于 JavaScript，与 Bower、Webpack\
  \ 或其他打包解决方案不同。\n\n#### 设置 Browserify 项目\n\n要让 Browserify 运行起来，你必须初始化一个 node 项目。假设你已经安装了\
  \ node 和 npm，可以在终端中使用以下命令初始化一个新项目。这将创建一个包含必要资源的 `package.json` 文件。\n\n```\n npm\
  \ init\n# ... 根据需要回答问题以完成初始化\nnpm install --save-dev browserify babelify \\\nbabel-preset-es2015\
  \ babel-preset-react \\\nbabel-preset-stage-1 \\\nreact uglify-js\n```\n\n将以下构建脚本添加到\
  \ `package.json` 文件的底部，使其看起来类似这样：\n\n```\n ...\n  \"devDependencies\": {\n    \"\
  browserify\": \"⁵.11.2\",\n    \"babelify\": \"⁶\",\n    \"react\": \"⁰.11.1\",\n\
  \    \"uglify-js\": \"².4.15\",\n     ...\n  },\n  \"scripts\": {\n    \"build\"\
  : \"browserify --debug index.js > bundle.js\",\n    \"build-dist\": \"NODE_ENV=production\
  \ browserify index.js | uglifyjs -m > bundle.min.js\"\n  },\n  \"browserify\": {\n\
  \    \"transform\": [\"babelify\"]\n  }\n}\n```\n\n另外，创建一个名为 `.babelrc` 的文件，告诉 babel\
  \ 使用哪些转换。\n\n```\n {\n  \"presets\": [\"es2015\", \"react\", \"stage-1\"]\n}\n```\n\
  \n默认的构建任务可以通过 `npm run build` 运行，它会创建一个带有 source map 的包。这让你可以检查错误消息并设置断点，就像每个文件单独引入一样。你还会看到包含\
  \ JSX 的原始代码，而不是编译后的输出。\n\n对于生产构建，你需要指定环境为 production。React 使用一个名为 envify 的转换，当与\
  \ uglify 这样的压缩工具结合使用时，可以移除调试代码和详细的错误消息，以获得更好的性能和更小的文件体积。\n\n现在你可以编写一些 React 代码并打包了。\n\
  \n#### 添加一些 React 内容\n\n创建以下 React + JSX JavaScript 文件，命名为 `index.js`。\n\n```\n\
  \ var React = require('react');\nvar ReactDOM = require('react-dom');\n\nvar root\
  \ = document.getElementById('root');\nReactDOM.render(<h1>Hello World</h1>, root);\n\
  ```\n\n并添加一个基本的 `index.html` 文件：\n\n```\n <html>\n  <head>\n    <title>React + Browserify\
  \ Demo</title>\n  </head>\n  <body>\n\n    <div id=\"root\"></div>\n    <script\
  \ src=\"bundle.js\"></script>\n  </body>\n</html>\n```\n\n现在你的项目根目录下将包含以下文件和文件夹：\n\
  \n*   `index.html`\n*   `index.js`\n*   `node_modules/`\n*   `package.json`\n\n\
  如果你现在尝试加载 `index.html` 文件，它将无法渲染 JavaScript，因为你还没有构建最终的包。运行 `npm run build` 并重新加载页面，即可看到你的\
  \ hello world 示例。\n\n#### Watchify\n\n你可以选择添加一个 watch 任务，这对开发很有帮助。Watchify 是 Browserify\
  \ 的一个包装器，当文件发生变化时会重新构建你的包。它使用缓存来加速重建。\n\n```\n npm install --save-dev watchify\n\
  ```\n\n将其添加到 `package.json` 的 scripts 对象中：\n\n```\n \"watch\": \"watchify --debug\
  \ index.js -o bundle.js\"\n```\n\n现在，你可以使用 `npm run watch` 代替 `npm run build`，以获得更流畅的开发体验。\n\
  \n#### 构建\n\n现在，只需运行构建脚本，将你的 React + JSX 文件打包成浏览器可用的脚本。\n\n```\n npm run-script\
  \ build\n```\n\n你应该会看到一个新的 `bundle.js` 文件出现。如果打开 `bundle.js`，你会注意到顶部有一些压缩后的 JavaScript，后面跟着转换后的\
  \ React + JSX 代码。这个文件现在包含了所有支持代码以及你的 `index.js` 文件，可以在浏览器中运行，加载 `index.html` 将会成功。\n\
  \n### Webpack\n\nWebpack 类似于 Browserify，它将你的 JavaScript 打包成一个单独的包。然而，将 Browserify\
  \ 和 Webpack 直接比较并不完全公平，因为 Webpack 拥有更多功能，而 Browserify 通常不会单独使用。\n\nWebpack 还可以：\n\
  \n*   将 CSS、图片和其他资源打包到同一个包中。\n*   在打包之前预处理文件（less、coffee、jsx 等）。\n*   根据入口位置将包拆分为多个文件。\n\
  *   支持开发环境的功能标志。\n*   执行“热”模块替换。\n*   支持异步加载。\n\n\n\n\n\n因此，Webpack 可以完成 Browserify\
  \ 的工作，同时结合其他构建工具（如 grunt 或 gulp）。\n\nWebpack 是一个模块系统，通过添加和替换插件来支持。默认情况下，它启用了 CommonJS\
  \ 解析器插件。\n\n我们不会在这里详细讨论 Webpack 的每个方面，但会涵盖基础知识以及让 Webpack 与 React 配合使用所需的内容。\n\n\
  #### Webpack 与 React\n\nReact 帮助你为应用程序创建组件。Webpack 不仅帮助你打包 JavaScript，还打包应用程序所需的所有其他资源。这使你能够创建包含所有资源依赖项的组件。这样一来，组件可以自带依赖项，从而更具可移植性。此外，随着应用程序的增长和变化，当你移除组件时，它们的资源依赖项也会被移除。这意味着不再有废弃的\
  \ CSS 或孤立的图片。\n\n让我们看看一个 React 组件在引入自身资源依赖项时是什么样子。\n\n```\n //logo.js\nrequire('./logo.css');\n\
  \nvar React = require('react');\n\nvar Logo = React.createClass({\n    render: function\
  \ () {\n        return <img className=\"Logo\" src={require('./logo.png')} />\n\
  \    }\n});\n\nmodule.exports = Logo;\n```\n\n要打包这个组件，你需要为应用程序设置一个入口点。\n\n```\n\
  \ //app.js\nvar React = require('react');\nvar ReactDOM = require('react-dom');\n\
  var Logo = require('./logo.js');\n\nvar root = document.getElementById('root');\n\
  React.render(<Logo/>, root);\n```\n\n现在，你需要创建一个 Webpack 配置文件，告诉 Webpack 对不同文件类型使用哪些加载器。同时，我们将展示应用程序的入口点以及所有打包文件的存放位置。\n\
  \n```\n //webpack.config.js\nmodule.exports = {\n    //应用程序的起始点\n  entry: './app.js',\n\
  \  output: {\n\n    //所有打包资源的存放位置\n    path: './public/build',\n\n    //所有 url-loader\
  \ 资源的前缀\n    publicPath: './build/',\n\n    //打包后应用程序的文件名\n    filename: 'bundle.js'\n\
  \  },\n  module: {\n    loaders: [\n      {\n\n        //加载器支持的文件类型的正则表达式\n\n  \
  \      test: /\\.(js)$/, \n        loader: 'babel-loader'\n      },\n\n      {\n\
  \n        test: /\\.(css)$/,\n\n        //多个加载器用 \"!\" 串联\n\n        loader: 'style-loader!css-loader'\n\
  \n      },\n\n      {\n\n        test: /\\.(png|jpg)$/,\n\n        //url-loader\
  \ 支持内联资源的 base64 编码\n\n        loader: 'url-loader?size=8192'\n\n      }\n    ]\n\
  \  }\n};\n```\n\n现在你需要安装 Webpack 和所有加载器。你可以通过命令行使用 npm，或者使用 package.json。\n\n确保在本地安装加载器，而不是全局安装（-g）。\n\
  \n```\n npm install webpack react\nnpm install url-loader jsx-loader style-loader\
  \ css-loader\n```\n\n一切安装完成后，你可以运行 Webpack：\n\n```\n //为开发环境构建一次\nwebpack \n\n//构建并生成\
  \ source maps\nwebpack -d \n\n//为生产环境构建，压缩、混淆、移除死代码\nwebpack -p\n\n//快速增量构建，可与其他选项结合使用\n\
  webpack --watch\n```\n\n## 调试工具\n\n无论你多么小心，错误总是难免的。我们不会介绍如何调试 JavaScript，但会讨论一些让调试\
  \ React 应用程序更轻松的工具。\n\n### 入门\n\n在本章中，请打开 Chrome 并安装 [React 开发者工具](https://chrome.google.com/webstore/detail/react-developer-tools/fmkadmapgofadopljbjfkapdkoienihi?hl=en)\
  \ 插件。\n\n右键点击一个元素，选择“检查元素”。你会看到熟悉的 DOM 结构视图，即元素标签页。\n\n不过，你并不是来查看 DOM 的。你想看到的是组件、它们的\
  \ props 和 state。如果操作完成，下一步你应该会在最右侧看到一个名为 React 的标签页。\n\n![选择元素后的 React 开发者工具截图](img/001.png)\n\
  \n左侧是组件的层级结构，右侧是所选实例的信息。\n\n仅查看这些信息，就能让你了解 React 中组件的 state、props 以及绑定的事件监听器。开发者工具还能做更多事情。\n\
  \n![React 开发者工具显示传递的 props 的树状视图截图](img/003.png)\n\n你可以看到你的 SurveyTable 组件接收了一个包含时间戳的调查数组。在实际视图中，它们以人类可读的格式呈现。双击其中一个时间戳并输入一个新值，这会导致组件用新值更新。\n\
  \n开发者工具有助于缩小问题范围，并帮助团队中的新成员找到需要编辑和完成任务的组件。\n\n### JSBin 和 JSFiddle\n\n在调试或头脑风暴时，像\
  \ JSFiddle 和 JSBin 这样的在线演示网站是非常有用的资源。在寻求帮助时，可以用它们创建测试用例，或者与他人分享原型。\n\n这是一个已配置好 Babel\
  \ 和 React 的 jsbin，供你创建内容：[`jsbin.com/ledaqefuya/1/edit?js,output`](http://jsbin.com/ledaqefuya/1/edit?js,output)。\n\
  \n## 总结\n\n你现在应该已经看到，在使用 React 开发时，调试和构建工具能为你带来的好处。在下一章中，你将了解如何在 React 中使用自动化测试。\n\
  \n# 第 14 章 测试\n\n现在你已经学习了如何使用 React 构建 Web 应用程序的方方面面，让我们在学习架构模式（将在第 15 章中介绍）之前先退一步。当你开始一个新应用程序时，生产力非常简单，因为你只需不断编写代码。但随着应用程序的发展，如果不小心，你可能会发现自己陷入一个混乱的代码库，难以修改。这就是为什么在你的工具箱中拥有一个强大的工具——自动化测试——非常重要。自动化测试通常通过测试驱动开发（TDD）工作流程来实施，可以帮助你实现更简单、更模块化、更不易因变更而脆弱、并且可以更自信地进行变更的代码。\n\
  \n## 但我以前从未测试过 JavaScript？\n\n没关系！如果你以前从未做过，自动化测试可能看起来像是一个遥不可及的外来概念。本章不会作为 JavaScript\
  \ 测试的详尽资源，因为这本身就需要一本书来介绍，但我们会提供足够的背景知识，以便你能够跟上并在需要时自行研究特定主题。\n\n## 入门\n\n你可能会问：“但我有一个出色的\
  \ QA 团队专注于测试。为什么我要关心测试？我不能跳过这一章吗？”好问题！自动化测试能帮助你的主要原因与 bug 或回归无关，尽管那是测试的一个有益副作用。自动化测试的真正目标是帮助你编写*更好*的代码。通常情况下，写得糟糕的代码很难测试。因此，如果你在编写代码的同时开始编写测试，测试会鼓励你不要编写草率的代码。你会自然而然地被推向遵循单一职责原则^(1)、迪米特法则^(2)以及保持代码模块化。\n\
  \n当我们提到测试驱动开发（TDD）时，我们指的是一种采用“红、绿、重构”流程的测试风格。首先，你编写一个会失败的测试（测试为红色），然后编写应用程序代码使测试通过（测试变为绿色），接着重构应用程序代码使其更简洁，同时保持测试为绿色。这是一个让你以小批量方式工作的过程，每次迭代在测试变绿时都会带来积极的感觉。\n\
  \n### 测试类型\n\n\n\n\n既然你已经确信自动化测试的重要性，那么我们来了解一下测试的类型：单元测试。还有许多其他类型的自动化测试（集成测试、功能测试、性能测试、安全测试和视觉测试^(3)），但这些不在本书的讨论范围之内。\n\
  \n*   **单元测试**：一种测试，用于验证应用程序中最小功能单元。通常，它会直接调用一个函数，传入特定输入，并验证输出或副作用。\n\n这听起来很多，但当你深入其中时，你会发现它不仅易于管理，而且第一次看到测试通过时也会非常有趣。\n\
  \n## 工具\n\n幸运的是，JavaScript 社区拥有一个健康的测试工具生态系统，因此我们可以利用它们快速搭建测试套件。本书的测试使用了 `Jest`\
  \ 和 `Enzyme`。`Jest` 使用 `Jasmine` 运行测试，因此如果你熟悉 `Jasmine`，你可能会觉得这些测试很熟悉。下面列出了一些流行的替代方案。\n\
  \n*   `Karma`\n*   `Mocha`\n*   `Chai`\n*   `Sinon`\n*   `Casper.js`\n*   `Qunit`\n\
  \n那么，让我们开始编码吧！\n\n## 使用 Jest 和 Enzyme 对 React 组件进行单元测试\n\n在编写 React 组件时，唯一的要求是定义一个\
  \ `render` 函数。让我们开始为一个新的 `<Comment />` 组件编写测试，该测试将验证组件是否渲染出期望的输出。\n\n`Jest` 会自动扫描名为\
  \ `__tests__` 的目录中的测试文件。按照惯例，这些测试目录放在被测试文件所在的文件夹中。\n\n### 对组件内容进行断言\n\n遵循这一惯例，在示例项目的\
  \ `/src/molecules/__tests__/Comment.test.js` 中为你的测试创建一个新文件。\n\n我们首先导入 `React`、从\
