  ```\n\n拆分会创建一个名为 `photoPathArr` 的数组。该数组包含两条信息：`photoPathArr[0]` 中的 `photos` 和 `photoPathArr[1]`\
  \ 中的 `thumb_ka1.jpg`。\n\n**4.** 将斜杠连接到 `photos`（包含在 `photoPathArr[0]` 中）。需要斜杠来正确表示图片的路径：\n\
