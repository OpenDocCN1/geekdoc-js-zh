  \n这个 `colorText` 插件是一个简单的示例，展示了如何构建 jQuery 插件。你可以将这些基本原则应用于任何你想在 jQuery 中创建的插件。现在，你已经将多个\
  \ jQuery 小部件和插件整合到了小木屋网站中，你已经学会了如何开始创建自己的 jQuery 代码来分享。\n\n### 总结\n\n本章充满了 jQuery\
  \ 小部件（来自官方 jQuery UI 库），你可以使用它们来增强访问者与网站的交互。这些小部件包括日期选择器、进度条和对话框。你只需包含 jQuery UI\
  \ 库文件，并通常用一两行脚本调用每个小部件，即可在网页和应用程序中使用它们。\n\n接下来，你的视野扩展到了被称为 jQuery 插件的全球小部件农场。来自全球各地的开发者开发并维护他们自己的\
  \ jQuery 库扩展，提供从表格排序器和工具提示到图片缩放器和图表绘制器等交互式小部件。\n\n最后，你学习了如何为 jQuery 库创建自己的扩展，并获得了一个模板，你可以用它来支持自己的插件库，这些插件可以保留或与世界分享。\n\
  \n在下一章中，你将应用本书到目前为止学到的所有技能和工具，创建一个类似于软件而非网站的 Web 应用程序界面。让我们继续前进吧！\n\n## 6. 创建应用程序界面\n\
  \njQuery 库通过提供擅长支持协同作用的方法和函数，使创建强大、交互式的 Web 应用程序界面变得更加容易，这些协同作用可以将枯燥、无生气的 Web 应用程序界面转变为功能丰富、以用户为中心的强大工具，帮助你创建直观且有趣的\
  \ Web 应用程序界面。\n\n在本章中，你将学习如何应用前几章学到的技术，以及其他的 jQuery、HTML 和 CSS 技术，为基于 Web 的应用程序界面打下坚实的基础。你将首先详细地了解基本的标记和样式信息，并在界面开发过程中逐步添加内容。在此过程中，你将学习使用精灵图和\
  \ AJAX 为界面注入活力的高级技术。\n\n### 建立基础\n\n图 6.1 Web 应用程序界面的基本布局。\n\n![Image](img/06-01.jpg)\n\
  \n对于任何 Web 应用程序，你需要完成的第一步是确定应用程序的需求，然后定义数据模型。一旦这些完成，你就可以开始为应用程序所需的每个用户界面定义布局。\n\n\
  在设计布局时，必须始终牢记 Web 应用程序的用户。导航项必须逻辑分组，内容必须一致。用户应该能够依靠直觉轻松找到元素。例如，你可能在界面顶部有一个主导航组件。当点击主项时，会加载反映用户初始选择的次级导航。这些选择必须对用户有意义，同时支持应用程序所需的操作。\n\
  \n一旦确定了布局，你就可以建立一些基础的 HTML 标记和 CSS。本章将要构建的界面非常基础：主导航位于浏览器窗口顶部，次级导航位于窗口左侧，主要内容显示在右侧的大区域中（**图\
  \ 6.1**）。\n\n通过在浏览器窗口中提供一个页脚区域，可以显示额外的目的驱动内容，从而完成基本布局。\n\n此布局的主要目标是保持每个元素在浏览器中可见，以避免滚动。必要时允许滚动，但仅限于包含的内容超出该元素显示范围的容器内。\n\
  \n有了布局计划，接下来你将开始创建项目的基础标记。\n\n#### 创建 HTML\n\nHTML 标记构成了界面其余部分的基础。你将定义用于容纳内容和导航元素的容器，这些容器将通过\
  \ CSS 和 jQuery 得到增强。\n\n在定义了基本的 HTML 标记之后，除了添加额外的 jQuery 和 CSS 函数声明外，你不需要对其进行太多修改。与之前的标记布局一致，应用程序界面的\
  \ HTML 将非常简单。让我们开始吧。\n\n**1.** 创建一个名为 `6-1.php` 的文件，并将其保存在 `chap6` 文件夹中。以 DOCTYPE\
  \ 声明（此处为 HTML5 声明）打开 HTML：\n\n```\n<!DOCTYPE html>\n\n    <html>\n\n        <head>\n\
  \n            <meta http-equiv=\"Content-Type\" content=\"text/html;\n\n       \
  \     ![Image](img/ccc.jpg) charset=UTF-8\" />\n```\n\n**2.** 应用无缓存指令，以防止缓存应用程序的内容。对于\
  \ Web 应用程序，最好不缓存任何数据（保存在临时存储中）：\n\n```\n            <meta http-equiv=\"pragma\"\
  \ content=\"no-cache\" />\n```\n\n\n\n\n\n`<meta http-equiv=\"cache-control\"` ![Image](img/ccc.jpg)\
  \ `content=\"no-cache\" />`\n\n**3.** 声明应用程序的标题：\n\n`<title>jQuery Application Interface</title>`\n\
  \n**4.** 创建 CSS 和 jQuery/JavaScript 文件的声明，首先从你将创建的样式表开始：\n\n`<link rel=\"stylesheet\"\
  \ href=\"css/interface.css\"` ![Image](img/ccc.jpg) `type=\"text/css\" />`\n\n`<link\
  \ type=\"text/css\" rel=\"stylesheet\"` ![Image](img/ccc.jpg) `href=\"css/ui/jquery-ui-1.8.12.custom.css\"\
  \ />`\n\n`<script type=\"text/javascript\"` ![Image](img/ccc.jpg) `src=\"inc/jQuery/jquery-1.5.min.js\"\
  ></script>`\n\n`<script type=\"text/javascript\"` ![Image](img/ccc.jpg) `src=\"\
  inc/jQuery/jquery-ui-1.8.12.custom.min.` ![Image](img/ccc.jpg) `js\"></script>`\n\
  \n`</head>`\n\n标准 jQuery 文件以及 jQuery UI 的 CSS 和 JavaScript 文件都已包含在基础标记中，因此你无需担心后续添加它们。\n\
  \n**5.** 添加将容纳应用程序界面导航和内容的元素：\n\n```\n<body>\n    <div id=\"mainNavBar\"></div>\n\
  \    <div id=\"content1\">\n        <div id=\"contentArea1\">\n            <!--\
  \ nav items -->\n        </div>\n    </div>\n    <div id=\"content2\">\n       \
  \ <div id=\"contentArea2\">\n            <!-- content items -->\n        </div>\n\
  \    </div>\n    <div id=\"footer\"></div>\n</body>\n</html>\n```\n\nHTML 主体中包含的标记非常简单且易于阅读。每个元素都清晰声明，注释使标记易于理解。\n\
  \n接下来，你将为基础 HTML 标记添加一些样式。\n\n### 应用 CSS\n\n应用程序界面的样式表定义了用于显示内容的区域的属性。你需要清晰地描述这些区域，以便\
  \ CSS 能够有效地应用于你的标记。\n\n让我们先设置基本的 CSS 属性，并添加一些额外的属性，为每个区域添加边框以提供视觉引导。设计完成后，你可以移除这些边框。\n\
  \n**1.** 在你的文本编辑器中创建一个名为 `interface.css` 的文件，将其保存在 `chap6/css` 文件夹中，然后建立整体布局：\n\n\
  ```\nbody, html {\n    height:100%;\n    margin: 0px auto;\n    overflow-y: hidden\
  \ ! important;\n    overflow-x: auto ! important;  \n}\n```\n\n---\n\n> **注意**\n\
  > \n> CSS 属性 `! important` 始终应用于标记，无论其他任何 CSS 条目是否试图覆盖该属性。CSS 是从上到下读取的，标记为 `! important`\
  \ 的 CSS 属性无论出现在 CSS 文档中的哪个位置，都将始终被应用。\n\n---\n\n```\nbody  {\n    margin: 0px;\n\
  \    font-family: Tahoma, Arial, Helvetica, sans-serif;\n    font-size: 11px;\n\
  \    background-color: #000000;\n}\n```\n\n这里建立的 CSS 规则确保文档主体与浏览器窗口允许的高度一致，并将所有外边距设置为\
  \ 0。所有溢出内容将被隐藏，界面文档主体上不会出现滚动条。最后，使用十六进制表示法将背景声明为黑色。\n\n**2.** 将 `:focus` 伪选择器设置为无轮廓，这将防止在可点击项周围出现轮廓：\n\
  \n```\n:focus {\n    outline: 0;\n}\n```\n\n---\n\n> **注意**\n> \n> 这里需要提醒一下：在公共网站上，你绝不应该关闭\
  \ `:focus` 元素上的轮廓，因为该元素有助于提高网页的可访问性。如果你的 Web 应用程序需要让使用屏幕阅读器的人能够访问，你应该从 CSS 文档中省略这条\
  \ `:focus` CSS 规则。\n\n---\n\n**3.** 设置二级导航的容器。有两个部分：外部容器和内部容器。先声明外部容器：\n\n```\n\
  #content1 {\n    width: 20%;\n    height: 80%;\n    background-color: transparent;\n\
  \    vertical-align: bottom;\n    float: left;\n    margin: 5px 5px 0px 10px;\n\
  \    position: relative;\n    bottom: 0px;\n}\n\n#contentArea1 {\n    position:\
  \ relative;\n    padding: 10px;\n}\n```\n\n外部容器 `#content1` 设计用于容纳将出现在界面左侧的导航项。由于应用程序界面设计为流式布局（所有元素随屏幕调整大小以保持比例），因此使用百分比来配置高度和宽度。\n\
  \n**4.** 构建用于容纳主内容的 CSS，使用一个外部容器：\n\n```\n#content2 {\n    position: relative;\n\
  \    width: 77%;\n    height: 80%;  \n    background-color: transparent;\n    vertical-align:\
  \ top;\n    float: left;\n    margin: 5px 5px 0px 0px;\n}\n```\n\n**5.** 创建主内容区域的内部容器，并将\
  \ `overflow` 属性设置为 `auto`。当内容长度超过外部容器允许的范围时，内部容器将出现滚动条：\n\n```\n#contentArea2 {\n\
  \    position: relative;\n    padding: 10px;\n    overflow: auto;\n}\n```\n\n**6.**\
  \ 声明主导航区域的空间，包括将用作导航背景的图像：\n\n```\n#mainNavBar {\n    height: 75px;\n    background-image:\
  \ url('../grfx/large_gray_gradient.png');\n    background-repeat: repeat-x;\n  \
  \  padding: 0px 0px 0px 25px;\n}\n```\n\n**7.** 为页脚部分创建规则和属性：\n\n```\n#footer {\n\
  \    position: absolute;\n    bottom: 0px;\n    height: 75px;\n    width: 99%;\n\
  \    margin: 5px 5px 0px 5px;\n}\n```\n\n页脚与浏览器窗口底部对齐，这样稍后你在本章中创建的窗口调整大小功能就可以考虑到页脚元素所占据的已知固定空间。\n\
  \n图 6.2 主导航和二级导航区域以及内容和页脚区域已创建完毕，可供修改。\n\n![Image](img/06-02.jpg)\n\n**8.** 创建 CSS\
  \ 样式表的最后一部分，其中包含用于在界面开发过程中提供视觉引导的边框规则：\n\n```\n#content1, #content2, #footer {\n\
  \    border: 1px dashed #FFFF00;\n}\n\n#contentArea1, #contentArea2 {\n    border:\
  \ 1px dashed #00FF00;\n}\n```\n\n界面完成后，你可以移除这些规则。\n\n基础 CSS 并不复杂，但它是实现应用程序界面所需的布局和交互性所必需的。\n\
  \n有了基本的 CSS 和 HTML 后，你可以将 `chap6/6-1.php` 加载到浏览器中（**图 6.2**）。你应该会看到应用程序界面每个主要区域的黄色边框（外部容器）和绿色边框（内部容器）。\n\
  \n请注意，某些导航和内容区域略有重叠。你将在下一节添加 jQuery 调整大小函数时纠正这种重叠。\n\n### 使界面可调整大小\n\n对于应用程序界面来说，每个元素不仅在浏览器打开时，而且在用户决定调整浏览器窗口大小时，都处于正确的位置并具有正确的大小，这一点非常重要。使用\
  \ jQuery 的 `resize` 方法可以让你完成这个微妙但重要的任务。\n\n为了确保浏览器窗口初始打开时元素具有正确的大小，你需要知道窗口打开后的总高度。然后你可以将适当的高度应用于内容容器元素。\n\
  \n在本练习中，你将创建 jQuery 函数，根据浏览器窗口打开时的大小自动为所有容器元素应用适当的高度。然后，你将创建当用户更改浏览器窗口大小时调整容器元素大小的\
  \ jQuery 函数。\n\n**1.** 创建一个名为 `interface.js` 的新文件，并将其保存在 `chap6/inc/jQuery` 文件夹中。然后创建文档就绪包装函数：\n\
  \n```\n$(document).ready(function() {\n```\n\n\n\n\n\n```\n$(document).ready(function()\
  \ {\n```\n\n2. 使用 jQuery 的 `height` 方法获取浏览器窗口的高度，并将该信息存入名为 `windowHeight` 的变量中：\n\
