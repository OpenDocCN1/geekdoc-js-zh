  **5.** 为了让插件能够与其他 jQuery 方法链式调用，返回 `this` 对象，同时继续使用插件中的方法对其进行操作：\n\n```\n    return\
  \ this.each(function(){\n\n        $this = $(this);\n```\n\n**6.** 插入 `colorText`\
