  \n图 2.9. 主导航精灵相当基础，但你可以通过该技术获得惊人的效果。\n\n![Image](img/02-09.jpg)\n\n关闭包含照片的模态窗口的函数与“创建和调用模态窗口”一节中创建的函数相同。\n\
  \n将事件绑定到元素是让 Web 应用程序生动起来的激动人心的工具。结合 jQuery 事件（如 `click`、`hover`、`fade` 和 `animate`）的能力，为网站访问者创造高度交互的体验提供了丰富的机会。\n\
  \n其中一个最流行的交互机会源于老式游戏设计——使用精灵。\n\n#### 创建基于精灵的导航\n\n电子游戏在过去大约 30 年里一直风靡一时，任何玩过早期版本游戏（如《马里奥兄弟》或《塞尔达传说》）的人，都玩过以精灵作为动画基础的游戏。\n\
  \n简单来说，*精灵*是一种描述多个项目的图形，每个项目位于图形中的特定位置。精灵中的每个项目都可以通过其相对于精灵中某个点的位置来访问。通常，精灵的左上角（通常描述为\
  \ 0, 0）是用于引用每个项目相对位置的点。\n\nCSS 布局对于基于精灵的导航的成功至关重要。样式表规则包含了精灵中所有项目的位置信息。**图 2.9**\
  \ 显示了摄影师交流网站上使用的精灵。该精灵由六个项目组成，分为两行，每行三个项目。行和列仅用于保持精灵中项目的组织；元素可以放置在精灵中的任何位置。该精灵将用于弹出网站的多个模态对话框窗口。\n\
  \n`mainNav.jpg` 精灵（位于网站代码的 `chap2/grfx` 文件夹中）分为两类。第一类包含处于自然状态（无悬停）的项目。第二类（第二行项目）是显示用户用鼠标光标悬停在其上的组。\n\
  \n图 2.10. 精灵 `mainNav.jpg` 的测量尺寸。该精灵按行和列排列，使得识别精灵元素非常容易。\n\n![Image](img/02-10.jpg)\n\
  \n确定精灵的测量尺寸至关重要。你将在 CSS 中使用这些测量信息来定义项目的位置。获取每列的宽度（例如，搜索列）和每行的高度。**图 2.10** 展示了导航精灵的测量尺寸。\n\
  \n请注意，列的宽度可能不同；行的高度在行与行之间是一致的，并且必须一致才能使动画效果正常工作。\n\n* * *\n\n注意\n\n在用于页面侧面（垂直）导航的精灵中，列宽必须在列与列之间保持一致，但高度可以不同。\n\
  \n* * *\n\n##### 定义标记\n\n导航的 HTML 标记非常简单，由 `chap2/2-2.php` 中的一个无序 HTML 列表组成。每个列表项包含一个锚点标签和一个\
  \ span 标签：\n\n```\n<ul id=\"spriteNav\">\n    <li><a href=\"search.php\" rel=\"\
  searchWindow\" class=\"modal\"\n    ![Image](img/ccc.jpg) id=\"search\"><span>Search</span></a></li>\n\
  \    <li><a href=\"register.php\" rel=\"registerWindow\" class=\"modal\"\n    ![Image](img/ccc.jpg)\
  \ id=\"register\"><span>Register</span></a></li>\n    <li><a href=\"login.php\"\
  \ rel=\"loginWindow\" class=\"modal\"\n    ![Image](img/ccc.jpg) id=\"login\"><span>Login</span></a></li>\n\
  </ul>\n```\n\n\n\n\n\n尽管标记语言极其简单，但 CSS 却要复杂得多，不过并不难懂。样式表中必须描述每个图像的状态，这些状态还包括每个图像的位置信息。\n\
  \n#### 为精灵图创建 CSS\n\n现在让我们深入探讨 CSS（`chap2/css/spritenav.css`）。样式表首先进行基本的清理工作。\n\n\
  **1.** 在 `spriteNav` 规则中定义精灵图的高度：\n\n```\n#spriteNav {\n    height: 30px;\n    list-style:\
  \ none;\n    margin: 0;\n    padding: 0;\n}\n```\n\n**2.** 将每个列表项设置为左浮动，使它们并排显示：\n\
  \n```\n#spriteNav li {\n    float: left;\n}\n```\n\n**3.** 为列表项中的锚点标签定义背景图像：\n\n\
  ```\n#spriteNav li a {\n    background: url(../grfx/mainNav.jpg) no-repeat;\n  \
  \  display: block;\n    height: 30px;\n    position: relative;\n}\n```\n\n**4.**\
  \ 现在为嵌套在每个列表项锚点标签中的 `span` 标签定义背景图像：\n\n```\n#spriteNav li a span {\n    background:\
  \ url(../grfx/mainNav.jpg) no-repeat;\n    display: block;\n    position: absolute;\n\
  \    top: 0;\n    left: 0;\n    height: 30px;\n    width: 100%;\n}\n```\n\n精灵图被设置为锚点链接和\
  \ span 元素的背景图像。这是整个高亮效果在从一个精灵图淡入到另一个时的工作原理的基础：\n\n每一列项目都必须有宽度和位置。位置通过 `x` 和 `y`\
  \ 坐标定义。由于处理的是第一行项目，每个项目的 y 轴均为 0。每个项目的 x 轴定义为鼠标光标当前悬停项目之前所有项目的总宽度。\n\n再看一下图 2.10。在精灵图中，顶行的“搜索”项目的起始坐标为\
  \ x 轴 0，y 轴 0。“搜索”宽度为 100 像素，因此“注册”项目的 y 轴仍为 0，但 x 轴为 -100 像素。“注册”项目宽度为 115 像素，因此“登录”项目的\
  \ x 轴值为“搜索”宽度加上“注册”宽度，即 -215 像素。\n\n**1.** 定义每个列表元素的 `width` 和 `background-position`：\n\
  \n```\n#spriteNav li a#search {\n    width: 100px;\n}\n#spriteNav li a#register\
  \ {\n    width: 110px;\n    background-position: -100px 0px;\n}\n#spriteNav li a#login\
  \ {\n    width: 90px;\n    background-position: -215px 0px;\n}\n```\n\n---\n\n位置，位置，还是位置！\n\
  \n示例中的精灵图组织得非常有序，通过行和列以逻辑方式定义和容纳项目。然而，这种组织程度并非必需。\n\n你可以将项目放置在精灵图中的任何位置。你只需要知道每个项目相对于坐标\
  \ (0,0) 的偏移量即可。有了这些信息，你就可以创建 CSS 规则来处理位置细节。\n\n掌握了这些知识，你就可以为各种用途设置精灵图，有时甚至可以将许多小项目合并到一个大精灵图中。包含多个项目的大精灵图可以节省带宽，既体现在下载大小上，也体现在减少获取多个小图像所需的服务器请求数量上。\n\
  \n---\n\n**2.** 现在定义每个 span 元素的 `background-position`：\n\n```\n#spriteNav li a#search\
  \ span {\n    background-position: 0px -30px;\n}\n#spriteNav li a#register span\
  \ {\n    background-position: -100px -30px;\n}\n#spriteNav li a#login span {\n \
  \   background-position: -215px -30px;\n}\n```\n\n为什么要使用负数？想象每个列表元素是一个盒子，盒子的左上角由坐标\
  \ (0,0) 定义。为了让精灵图的每个项目与其列表项的左边缘对齐，精灵图项目必须向左偏移相应的像素数。\n\n对于第二行的精灵图项目，精灵图不仅向左偏移，还以类似方式向上偏移所需的量。\n\
  \n现在 CSS 已正确定义，你可以将注意力转向创建 jQuery 来为精灵图的变换添加动画效果。\n\n#### 添加 jQuery 动画\n\n你可以仅使用\
  \ HTML 和 CSS 来实现从一个精灵图项目到另一个的即时切换，但这有什么乐趣呢？是时候添加一些 jQuery 来为精灵图的过渡提供平滑的动画效果了。\n\n\
  **1.** 创建函数，首先确保 `spriteNav` 的 span 元素设置为默认状态：\n\n```\n$(function() {\n    $(\"\
  #spriteNav span\").css(\"opacity\", \"0\");\n    $(\"#spriteNav span\").text('');\n\
  ```\n\n注意，通过将 `span` 元素的不透明度降低到 0 使其不可见。`span` 元素包含精灵图项目，当鼠标光标悬停在 `span` 上时，这些项目将显示出来。\n\
  \n**2.** 将 `span` 元素绑定到 jQuery 的 `hover` 方法，并设置函数的 `mouseover` 和 `mouseout` 部分：\n\
  \n```\n    $(\"#spriteNav span\").hover(function() {\n        $(this).stop().animate({\n\
  \            opacity: 1\n        }, 100);\n    }, function(){\n        $(this).stop().animate({\n\
  \            opacity: 0\n        }, 500);\n    });\n});\n```\n\n图 2.11 通过精灵图不透明度的动画，span\
  \ 元素获得了完全可见性。\n\n![Image](img/02-11.jpg)\n\n你之前已经见过作为轮播图需求一部分的悬停效果。这里的区别在于，`hover`\
  \ 方法淡入由 `#spriteNav span` 描述的精灵图部分。在正常情况下，span 是完全透明的，让你可以看到由 `#spriteNav li` 描述的精灵图项目。当鼠标光标进入\
  \ span 的空间时，精灵图元素的不透明度被动画化为完全可见。图 2.11 展示了悬停效果，但我鼓励你将代码加载到浏览器中，以充分欣赏动画效果。\n\n在第\
  \ 6 章“创建应用程序界面”中，我将向你展示如何使用精灵图创建更复杂的交互和动画。\n\n### 总结\n\n本章充满了基于将网页元素绑定到事件（如 `click`\
  \ 或 `hover`）的操作。一旦绑定到事件，jQuery 就可以基于这些事件执行任意数量的方法，包括动画或向 DOM 追加新元素。你从使用单个事件平滑地过渡到组合事件和方法来创建小部件，例如模态窗口、无限图像轮播图和基于精灵图的交互式导航。\n\
  \n本章为你使用和组合事件提供了坚实的基础，但还有许多其他事件值得探索。让我们在探索可用于表单的事件的同时，将你的 jQuery 开发技能提升到新的水平。\n\n\
  ## 3. 让表单更生动\n\n访问你网站的用户不仅限于与点击和悬停等基本事件进行交互。你可能希望让用户通过填空式表单提供信息。作为准确数据的守护者，你希望确保用户通过引导他们完成表单填写过程（验证）来提供适当的信息。作为设计师，你希望表单直观且易于使用。作为开发者，你希望利用\
  \ jQuery 提供的工具和事件来帮助你的内部数据守护者和设计师创建有效、高质量的表单。\n\n在本章中，你将使用为摄影师交流网站开发的表单，并添加 jQuery\
  \ 的表单事件，以在验证用户提供的数据的同时增强用户交互。\n\n### 利用表单事件\n\n乍一看，jQuery 为表单方法公开的五个事件（`blur`、`change`、`select`、`focus`\
  \ 和 `submit`）似乎相当少。虽然列表很短，但将这些方法与其他 jQuery 函数结合使用将产生广泛的功能。\n\n\n\n\n\n为了引导访客，你需要给他们一些提示（或明确的指引），告诉他们你期望他们下一步做什么。为了避免网站用户只是假设自己应该往表单里输入信息，你可以直接将焦点放在他们应该首先填写的表单元素上。\n\
  \n### 聚焦表单输入\n\n最简短实用的 jQuery 方法之一是 `focus` 函数。使用这个 jQuery 方法，你可以将光标直接放在你希望用户填写的表单元素中。\n\
  \n要使用 `focus` 函数，了解 HTML 元素的 `tabindex` 属性会很有帮助，这些元素包括锚标签、表单元素和按钮。`tabindex` 定义了这些元素基于计算机键盘上\
  \ Tab 键被点击时的选中顺序（从具有 `tabindex` 值的最低编号项开始）。你可以像这样在每个元素中手动设置 `tabindex` 值：\n\n```\n\
  <input type=\"text\" name=\"penewuser\" size=\"24\" tabindex=\"0\" />\n```\n\n在许多情况下，每个页面只有一个表单，这样你就可以使用该函数的最简短形式：\n\
  \n```\n$('input[tabindex=\"0\"]').focus();\n```\n\n选择器会选择 `tabindex` 为 0 的表单输入，并将光标放在该字段中。\n\
  \n这很简单，但如果有多个表单呢？Photographer's Exchange 网站的 `chap3/3-1.php` 就是这种情况。用户最常使用的三个表单包含在网站主页面中的隐藏元素中。通常情况下，第一个\
  \ `tabindex` 很可能是第一个表单中的第一个输入。那么，如何将光标放入当前显示的表单的第一个输入中呢？\n\n打开 `jqpe.js`，找到注释 `/*\
  \ focus on the first form element */`。接下来的几行包含一个函数，你将用它来识别在模态窗口中打开的任何表单中的第一个输入项。\n\
  \n图 3.1\\. 用户点击登录元素后，jQuery 定位到第一个 HTML 输入元素 `object`。\n\n![Image](img/03-01.jpg)\n\
  \n该函数的开场动作是查找所有可见的表单输入，并开始遍历它们：\n\n```\n$(':input:visible').each(function(i,e){\n\
  ```\n\n由于表单最初将其 CSS `display` 属性设置为 `none`，因此只会遍历当前可见的表单元素。当模态窗口打开时，表单变为可见。\n\n\
  `each` 方法包含几个额外的变量：一个用于标识正在处理的表单元素，另一个是迭代器或计数器，从 0 开始。如果你设置一个每次循环时触发的警告（`alert(i+'\
  \ '+e);`），它会显示计数器和表单输入对象。图 3.1 显示了该警告。\n\n函数中唯一的一行代码为每个可见表单元素的 `tabindex` 属性赋值，从\
  \ 1000 开始：\n\n```\n    $(e).attr(1000, i);\n});\n```\n\n`tabindex` 值设置得足够高，以避免与网页中可能存在的其他\
  \ `tabindex` 值冲突。当你对表单应用 `focus` 方法时，光标将落在当前显示的表单的第一个元素中。\n\n一旦可见表单正确分配了 `tabindex`\
  \ 值，你就可以使用 focus 方法将光标放在第一个输入字段中：\n\n```\n$('input[tabindex=\"1000\"]').focus();\n\
  ```\n\n你在这里使用的 `focus` 方法实际上会将光标放在某个元素上。你还可以在用户通过 Tab 键切换到某个元素或通过鼠标点击选中该元素时触发一个事件。\n\
  \n现在你已经掌握了焦点，让我们来处理一些更具挑战性的事情：使用 jQuery 验证电子邮件地址。\n\n### 验证电子邮件地址\n\n在你喜欢的文本编辑器中打开\
  \ `chap3/3-1.php`，找到 `id` 为 `registerForm` 的 `div`。在该表单中，你会找到一行描述电子邮件地址输入的 HTML：\n\
  \n```\n<label class=\"label\" for=\"email\">Email: </label><input type=\"text\"\n\
  ![Image](img/ccc.jpg) name=\"email\" id=\"email\" size=\"48\" /><span class=\"error\"\
  >please\n![Image](img/ccc.jpg) enter a valid email address</span><br />\n```\n\n\
  HTML 错误 span 通常通过 CSS 规则（`chap3/css/modal.css`）隐藏：\n\n```\n.error {\n    display:\
  \ none;\n    color: #FF0000;\n    font-size: 0.7em;\n    margin: 0px 0px 0px 5px;\n\
  }\n```\n\n如果执行基本的电子邮件验证时出现错误，错误 span 将通过 jQuery 函数更改其显示属性来显示，该函数用于测试表单中输入的电子邮件地址。\n\
  \n基本的表单验证不使用 AJAX（我将在第 4 章“有效使用 AJAX”中向你展示如何使用 AJAX 验证某些表单元素）。开始使用 jQuery 电子邮件验证：\n\
  \n1. 打开 `chap3/inc/jqpe.js` 文件。你将在文档就绪函数包装器的结束括号之前开始创建此函数。\n\n### 征服正则表达式\n\n你会发现有很多方法可以使用正则表达式来测试和验证输入到表单中并在函数中使用的数据。深入讨论正则表达式超出了本书的范围，因此我将推荐一些查找和学习正则表达式的好资源：\n\
  \n- [`www.webreference.com/js/column5`](http://www.webreference.com/js/column5)\
  \ 提供了一个有效的教程，重点介绍如何在 JavaScript 中使用正则表达式。\n- [`developer.mozilla.org/en/Core_JavaScript_1.5_Guide/Regular_Expressions`](https://developer.mozilla.org/en/Core_JavaScript_1.5_Guide/Regular_Expressions)\
  \ 是用于 Web 浏览器的 JavaScript 正则表达式的权威指南。\n- [`regexpal.com`](http://regexpal.com) 提供了一个在线工具，通过提供视觉线索帮助你正确编写正则表达式。输入一个测试字符串，然后编写正则表达式来匹配该字符串。\n\
  \n2. 将 `blur` 方法绑定到电子邮件输入：\n\n```\n$('#email').blur(function() {\n```\n\n当通过 Tab\
  \ 键或点击离开输入元素时，会触发 `blur` 方法，导致输入失去焦点。\n\n当失去焦点发生时，你需要采用一种方法来验证电子邮件。最强大的验证方法之一是使用一种称为*正则表达式*的编程结构。我现在就能听到恐惧的尖叫声！尖叫声！哭喊声！\n\
  \n然而，一旦你理解了正则表达式，就没什么好害怕的了。正则表达式是一种灵活的文本字符串匹配方式，非常适合执行验证电子邮件地址所需的匹配。这里使用的正则表达式很容易分解。\n\
  \n3. 插入用于匹配大多数电子邮件地址的正则表达式，并将其存储在变量 `regexEmail` 中：\n\n```\n    var regexEmail =\
  \ /^[a-zA-Z0-9._-]+@[a-zA-Z0-9.-]+\n    ![Image](img/ccc.jpg) \\.[a-zA-Z]{2,4}$/;\n\
  ```\n\n正则表达式的第一部分 `/^[a-zA-Z0-9._-]+` 表示要匹配的内容应以字母数字字符开头，并且字母字符可以是大写或小写。也允许使用句点、下划线和连字符。`+`\
  \ 号表示此语句应匹配前面的字符一次或多次。\n\n在初始字符之后，必须有一个 `@` 符号，也称为 *at*。\n\n在 *at* 符号之后，允许另一组字母数字字符\
  \ `[a-zA-Z0-9.-]+`，以及仅限句点和连字符。接下来，应该有一个句点 `\\.` 来分隔域名和子域名。\n\n正则表达式以 `[a-zA-Z]{2,4}$`\
  \ 结尾。这表示要匹配的项的最后一部分必须只有字母，长度可以是 2 到 4 个字符。这对于匹配当前可用的 Web 域名非常合适。\n\n4. 将表单输入元素的值放入变量\
  \ `inputEmail` 中：\n\n```\n    var inputEmail = $(this).val();\n```\n\n5. 现在，让我们使用\
  \ JavaScript 的 test 方法，将输入到表单中的值与正则表达式进行测试：\n\n\n\n\n\n`var resultEmail = regexEmail.test(inputEmail);`\n\
  \n```\nvar resultEmail = regexEmail.test(inputEmail);\n```\n\n`test` 方法在电子邮件地址有效时返回\
  \ `true`，无效时返回 `false`。这样你就可以使用条件测试来判断是否应该显示错误消息。\n\n**6.** 创建一个条件语句，利用正则表达式测试的结果来决定是否向用户显示错误消息：\n\
  \n```\nif(!resultEmail){\n```\n\n图 3.2. 用户在姓名中留了一个空格。这与用于验证电子邮件地址的正则表达式匹配时无效。\n\n\
  ![Image](img/03-02.jpg)\n\n这里的感叹号本质上表示：*如果变量的条件不成立，则测试失败*。\n\n**7.** 如果测试失败，通过更改其\
  \ CSS display 属性，在此元素（`#email`）旁边显示错误：\n\n```\n$(this).next('.error').css('display',\
  \ 'inline');\n```\n\n**8.** 如果测试成功（无论是用户首次输入信息，还是用户返回并更正信息），将错误的 CSS display 属性设置为不显示：\n\
  \n```\n} else {\n    $(this).next('.error').css('display', 'none');\n}\n```\n\n\
  **9.** 用正确的花括号和方括号关闭 jQuery 电子邮件验证函数：\n\n```\n});\n```\n\n当输入格式不正确的电子邮件时，在 `blur`\
  \ 事件发生时显示错误 span，使焦点离开电子邮件输入区域。结果如 **图 3.2** 所示。\n\n如果你仔细查看 `chap3/3-1.php` 中的代码，会发现有多个\
  \ span 元素被分配了 `error` 类。为什么当出现错误时，所有这些 span 不会都变得可见？答案在于函数条件语句中使用的方法。再看这一行：\n\n\
  ```\n$(this).next('.error').css('display', 'inline');\n```\n\n关键在于 `.next()` 方法。jQuery\
  \ 对象 `$(this)` 表示 `id` 为 `#email` 的对象。`#email` 的一个兄弟元素是 `#error`。如果你按层级方式编写 HTML，可以更清楚地看到这种关系：\n\
  \n```\n<form name=\"register\" id=\"registerForm\" action=\"inc/peregister.php\"\
  \nmethod=\"post\">\n    /* 其他表单元素 */\n    <label class=\"label\" for=\"email\">Email:\
  \ </label>\n    <input type=\"text\" name=\"email\" id=\"email\" size=\"48\" />\n\
  \    <span class=\"error\">please enter a valid email address</span>\n    /* 更多表单元素\
  \ */\n</form>\n```\n\n每个高亮显示的元素都是 `form` 元素的子元素，并且与标记中同一层级的所有元素互为兄弟元素。`#email` 的下一个兄弟元素正是代码中紧随其后的错误\
  \ `span`。使用 `next` 方法只会更改这个错误 span 的属性，使其变得可见。\n\n现在，让我们将表单的 `change` 方法与 `next`\
  \ 方法结合起来，在表单密码字段填写完毕后关闭错误提示。\n\n#### 确保输入完整\n\n确保表单字段在提交前不为空，是表单输入验证最基本的方法。有几种方法可以创建函数来确保\
  \ HTML 表单中的字段已填写。你可以使用正则表达式强制用户使用特定字符，或者确保密码满足最小长度要求。\n\n图 3.3. 用户被警告不要将密码字段留空。\n\
  \n![Image](img/03-03.jpg)\n\n对于摄影师交流网站，唯一的要求是密码字段不能留空。警告会在表单加载时显示，如 **图 3.3** 所示。\n\
  \n**1.** 打开 `chap3/inc/jqpe.js`，首先在文档就绪包装器的结束括号之前创建函数：\n\n```\n$(function() {\n\
  ```\n\n**2.** 获取 id 为 `penewpass` 的表单元素中包含的值的长度。将该长度存储在一个名为 `passwordLength` 的变量中：\n\
  \n```\nvar passwordLength = $('#penewpass').val().length;\n```\n\n**3.** 代码中的第一项测试密码字段值的长度。如果长度为零，则显示警告：\n\
  \n```\nif(passwordLength == 0){\n    $('#penewpass').next('.error').css('display',\n\
  \    'inline');\n```\n\n**4.** 设置 jQuery 代码以监听密码输入字段中发生的 `change` 事件。如果发生更改，CSS\
  \ 方法将错误的 display 设置为 `none`，从而使警告消息消失：\n\n```\n$('#penewpass').change(function()\
  \ {\n    $(this).next('.error').css('display', 'none');\n});\n```\n\n**5.** 正确关闭函数的括号和大括号：\n\
  \n```\n}\n});\n```\n\n尽管你执行了大量客户端数据验证，但始终应该通过删除表单中用户提供的可能有害的语法甚至代码语句，在数据到达服务器时对其进行适当的清理。接下来，当用户能够向摄影师交流网站上传图片时，我们来看看其中一些清理技术。\n\
  \n### 处理上传\n\n图 3.4. 文件上传表单，网站用户一次最多可以上传五张图片。\n\n![Image](img/03-04.jpg)\n\n你可能已经知道，不能使用\
  \ AJAX 上传文件。阻止像 AJAX 这样的客户端技术执行文件上传，可以堵住一个潜在的重大安全漏洞。\n\n那么，如何允许用户向你的网站上传文件呢？在本节中，你将学习一种使用\
  \ HTML `iframe` 元素和 PHP 进行文件上传的可靠（且安全）的方法，同时保持你期望从 jQuery 获得的流畅交互性。\n\n为了使上传过程有效且安全，你将结合\
  \ jQuery 和 PHP。确保用户上传正确的文件是首要任务。你将使用的上传表单位于文件 `chap3/3-4.php` 中，如 **图 3.4** 所示。\n\
  \n#### 执行客户端验证\n\n由于该网站面向摄影师，文件上传将限制为 *JPG、JPEG*（联合图像专家组）和 *PNG*（便携式网络图形）。这些文件类型特别适合数码摄影。如果用户选择了其他文件类型，上传表单需要提示用户。HTML\
  \ 包含一个隐藏的错误 span，当选择的文件类型不正确时会显示：\n\n```\n<label class=\"label\" for=\"pUpload1\"\
  >Select File: </label><input\ntype=\"file\" name=\"pUpload[]\" id=\"pUpload1\" value=\"\
  \" size=\"48\"\n/><span class=\"error\">extension must be jpg, jpeg or png</span>\n\
  ```\n\n这与之前表单中应用的错误消息类似。将捕获错误的 jQuery 代码放在一个名为 `pePhotoUp.js` 的文件中，该文件将保存在 `chap3/inc`\
  \ 文件夹中。\n\n**1.** 通过选择上传表单的输入并将它们绑定到 `each` 方法来启动函数：\n\n```\n$('input[name*=\"pUpload\"\
  ]').each(function(){\n```\n\n这里使用的选择器称为 *属性选择器*。属性选择器允许你指定一个或多个属性及其各自的值来过滤一组元素。这里选择器包装了所有名称以\
  \ `pUpload` 开头的输入。\n\n**2.** 将输入绑定到 `change` 方法，以便捕获输入字段中的任何更改来触发函数的其余部分：\n\n```\n\
  $(this).change(function(){\n```\n\n**3.** 设置一个正则表达式来测试正确的文件扩展名文本。然后函数将获取更改后的输入的值，并针对该正则表达式测试该值：\n\
  \n```\nvar regexPhotoExt = /\\.(jpg|jpeg|png)$/i;\nvar photoName = $(this).val();\n\
  var resultPhoto = regexPhotoExt.test(photoName);\n```\n\n\n\n\n让我们剖析一下这里使用的正则表达式。从右向左看，`i`\
  \ 表示测试不区分大小写。美元符号（`$`）确保测试针对的是被测试字符串的结尾。表达式的核心部分 `(jpg|jpeg|png)` 是一个包含三个可接受文件扩展名的字符串数组。句点（由反斜杠转义）表示成功的测试字符串将以句点开头。文件扩展名\
  \ `.jpg`、`.jpeg` 或 `.png` 将通过测试。\n\n图 3.5 如果用户选择了不合适的文件扩展名，将会看到的错误消息。\n\n![Image](img/03-05.jpg)\n\
  \n**4.** 创建条件检查，用于显示或隐藏错误消息：\n\n```\nif(!resultPhoto){\n    $(this).next('.error').css('display',\
  \ 'inline');\n} else {\n    $(this).next('.error').css('display', 'none');\n}\n\
  });\n```\n\n如果用户选择的文件扩展名与正则表达式数组中的某个值不匹配，则会显示错误，如图 3.5 所示。\n\n* * *\n\n注意\n\n提醒一句：向用户提供视觉提示实际上并不能阻止文件被上传！\n\
  \n* * *\n\n如果设计师和开发者只需在网站访问者试图做他们不希望的事情时提供一条警告消息，那么他们的工作就会轻松很多。但现实是，你还必须在信息到达服务器时对其进行验证，因为有些访问者可能会尝试提交可能危害服务器的数据或上传文件，甚至更糟的是，将带有病毒的文件传播给其他网站访问者。接下来你将学习如何验证这些信息。\n\
  \n#### 开发服务器端验证\n\n在摄影师交流网站中，服务器端验证由文件上传过程中的几行 PHP 代码处理。让我们先单独看看这些代码，了解验证是如何执行的，然后再创建图像上传功能。\n\
  \n在摄影师交流网站的 `chap3/inc` 文件夹中找到 `photoUpload.php` 文件并打开它。该文件包含几个不同的函数，但本节的重点是用于验证上传文件的代码。\n\
  \n* * *\n\n注意\n\n本书中的所有服务器端处理都将使用 PHP 代码，但你可以轻松地用任何语言复制这些功能。\n\n* * *\n\n找到注释 `/*\
  \ set up the file for validation */`。该注释后面的几行代码是确保上传的文件符合预期（即图像文件）的关键。\n\nPHP 为上传的文件设置了一个临时文件名。PHP\
  \ 使用这个临时名称来引用该文件，直到上传完成。文件的真实名称也是可用的。这两个名称被保存到变量中，以便于使用：\n\n```\n$tmpName = $_FILES[\"\
  pUpload\"][\"tmp_name\"][$key];\n$photoName = $_FILES[\"pUpload\"][\"name\"][$key];\n\
  ```\n\n在下一行中，你会看到一个熟悉的内容。这段代码是用于客户端验证的正则表达式；之所以使用它，是因为你应该始终验证用户提供的数据，而且 jQuery 并没有阻止用户点击“上传”按钮，即使选择了不正确的文件类型：\n\
  \n```\n$regexFileExt = \"/\\.(jpg|jpeg|png)$/i\";\n```\n\nPHP 函数 `preg_match` 提供了与\
  \ JavaScript 的 `test` 方法相同的测试能力：\n\n```\nif(preg_match($regexFileExt, $photoName)){\n\
  ```\n\n这种测试级别对某些开发者来说可能已经足够，但你确实希望更安全。在 PHP 中添加额外测试层的一种方法是使用一个函数来读取文件的前几个字节，以确定文件的实际类型。这个函数就是\
  \ `exif_imagetype`。\n\n`exif_imagetype` 函数可以返回十多种不同的常量，例如测试有效时返回 `IMAGETYPE_JPEG`。在摄影师交流网站上，用户只允许使用两种不同的文件类型（从二进制角度看，`jpg`\
  \ 和 `jpeg` 是相同的），因此将两个常量放入一个数组中，用于测试：\n\n```\n$arrEXIFType = array(IMAGETYPE_JPEG,\
  \ IMAGETYPE_PNG);\n```\n\n* * *\n\n提示\n\n如果你使用 PHP，请确保你的 PHP 版本包含 EXIF（可交换图像信息）扩展。你需要该扩展才能使用\
  \ EXIF 函数。\n\n* * *\n\n临时文件 `$tmpName` 由函数 `exif_imagetype` 进行测试。然后 PHP 函数检查返回的常量是否在数组\
  \ `$arrEXIFType` 中。如果常量与数组中的某个值匹配，则允许继续上传文件：\n\n```\nif(in_array(exif_imagetype($tmpName),\
  \ $arrEXIFType)){\n    // 执行文件上传\n```\n\n现在文件可以被正确验证了，是时候将注意力转向实际执行上传了。\n\n* * *\n\
  \n注意\n\n当测试失败时，`exif_imagetype` 返回常量 FALSE。\n\n* * *\n\n图 3.6 正常文件上传的路径从一个网页开始，在上传处理完成后结束于另一个网页。\n\
  \n![Image](img/03-06.jpg)\n\n#### 上传文件\n\n由于 AJAX 不能用于上传文件，你将学习如何运用一些 jQuery 魔法，使应用程序能够将文件从用户的计算机移动到网站的服务器上。\n\
  \n通常，上传表单会直接调用处理文件上传的脚本。一旦服务器处理完上传，就会加载另一个网页。图 3.6 展示了该过程如何从浏览器中的表单开始。表单将数据发送到服务器上的脚本（本例中为\
  \ PHP 上传脚本）进行处理，然后将用户重定向到一个新的网页。\n\n图 3.7 此屏幕揭示了 jQuery 上传过程背后的魔法。一个 `iframe` 被临时创建，用于容纳文件上传处理脚本。\n\
  \n![Image](img/03-07.jpg)\n\n新的上传函数使用一个临时且隐藏的 HTML `iframe`，该 `iframe` 由 jQuery\
  \ 函数动态创建。从典型的文件上传表单开始，jQuery 过程随后打开 `iframe`（为清晰起见，如图 3.7 所示），PHP 上传脚本被定向到该 `iframe`\
  \ 中。当上传脚本完成后，`iframe` 会被 jQuery 过程移除，并显示一个模态窗口，告知用户过程已完成。\n\n##### 编写上传脚本\n\n整个文件上传过程需要两部分：在服务器端处理上传文件的\
  \ PHP 代码，以及在客户端由 Web 浏览器使用的 jQuery 代码。你将首先创建客户端 jQuery 代码。\n\n**1.** 打开你在其中创建了客户端文件扩展名验证的\
  \ jQuery 文件 `chap3/inc/pePhotoUp.js`。在文件扩展名验证函数的结束括号之后立即开始上传函数。将 jQuery 的 `submit`\
  \ 方法绑定到上传表单：\n\n```\n$(function(){\n    $('#uploadForm').submit(function(){\n```\n\
  \n**2.** 设置一个 `iframe` 并将其附加到网页的 body 中。将 `iframe` 的 display 属性设置为 none；用户永远不会看到它：\n\
  \n```\nvar iframeName = ('iframeUpload');\nvar iframeTemp = $('<iframe name=\"'+iframeName+'\"\
  \n![Image](img/ccc.jpg) src=\"about:blank\" />');\niframeTemp.css('display', 'none');\n\
  $('body').append(iframeTemp);\n```\n\n现在 `iframe` 已准备好使用，submit 函数提供了正确的属性，将 PHP\
  \ 上传脚本定向到该 `iframe`。这就是上传发生的地方。\n\n**3.** 为 submit 函数设置要传递给 `iframe` 的属性：\n\n```\n\
  $(this).attr({\n    action: 'inc/photoUpload.php',\n    method: 'post',\n    enctype:\
  \ 'multipart/form-data',\n    encoding: 'multipart/form-data',\n    target: iframeName\n\
  });\n```\n\n现在图像文件已上传到服务器。\n\n\n\n让我们为文件上传过程的客户端部分画上句号。你需要让用户知道过程已完成，并执行一些清理工作：清除表单并移除\
  \ `iframe`。\n\n### 创建回调风格的功能\n\njQuery 上传脚本的最后一部分被放入一个短暂的（1 秒）`setTimeout` 函数中。这个超时时间（你可以自行调整时长）允许几个函数依次执行，而不会给网站访客带来突兀的过渡效果。\n\
  \n1. 创建 `setTimeout` 函数：\n\n```\nsetTimeout(function(){\n```\n\n2. 移除临时的 `iframe`，因为它不再需要：\n\
  \n```\n    iframeTemp.remove();\n```\n\n3. 创建一个小型函数，用于确定 `input` 字段中文本的长度。长度信息将被存入\
  \ `inputLength` 变量，供文件上传函数后续使用：\n\n```\n    inputLength = 0;\n    $('input[name*=\"\
  pUpload\"]').each(function() {\n        inputLength += $(this).val().length;\n \
  \   });\n```\n\n你不希望在“上传”按钮被意外点击且 `input` 字段中没有数据时显示确认弹窗。为了防止意外确认，需要进行一次检查，确保 `inputLength`\
  \ 大于零。\n\n4. 打开一个条件语句，检查 `inputLength` 变量的值：\n\n```\n    if(0 < inputLength){\n\
  ```\n\n图 3.8 访客收到过程已完成的确认信息。\n\n![Image](img/03-08.jpg)\n\n5. 如果 `inputLength` 大于零，则在页面主体中追加一个包含确认信息的\
  \ `div`：\n\n```\n        $('body').append('<div id=\"ty\" class=\"thankyouModal\"\
  >\n        ![Image](img/ccc.jpg) <h3>感谢您！上传已完成...\n        ![Image](img/ccc.jpg)\
  \ </h3></div>');\n```\n\n6. 为了确保弹窗显示在浏览器窗口中央，获取该 `div` 的高度和宽度，然后加上额外的外边距和内边距宽度。此技术曾在第\
  \ 2 章中用于居中弹窗和轮播图片：\n\n```\n        var modalMarginTop = ($('#ty').height() + 60)\
  \ / 2;\n        var modalMarginLeft = ($('#ty').width() + 60) / 2;\n        $('#ty').css({\n\
  \            'margin-top' : -modalMarginTop,\n            'margin-left' : -modalMarginLeft\n\
  \        });\n```\n\n7. 淡入确认消息（**图 3.8**），让用户知道过程已完成：\n\n```\n        $('.thankyouModal').fadeIn('slow',\
  \ function(){\n```\n\n8. 清空 `input` 字段，使表单恢复干净，可供再次使用：\n\n```\n            $('input[name*=\"\
  pUpload\"]').val('');\n```\n\n---\n\n> **注意**  \n> 文件上传表单中提供给用户的消息仅确认过程已完成。它既不确认文件已发送到服务器，也不报告错误。有许多方法可以使此过程更加健壮。例如，你可以修改脚本以提供错误消息，或使用\
  \ AJAX 轮询文件应存放的目录。\n\n---\n\n9. 缓慢淡出确认消息，给网站访客一种视觉上的动作感：\n\n```\n            $(this).fadeOut(1500,\
  \ function() {\n```\n\n10. 从 DOM 中移除确认弹窗：\n\n```\n                $(this).remove();\n\
  ```\n\n11. 确保条件语句的所有花括号和圆括号都正确匹配并闭合：\n\n```\n            });\n        });\n    };\n\
  ```\n\n`setTimeout` 函数的时间（毫秒，1000 毫秒等于 1 秒）放在函数关闭之前，随后是剩余的闭合花括号、圆括号和分号：\n\n```\n\
  }, 1000);});});});\n```\n\n---\n\n> **提示**  \n> 一个好的集成开发环境（IDE）编辑器会内置括号匹配功能。\n\n\
  ---\n\n何时才能将照片正确显示为全尺寸图像和缩略图？让我们转向处理上传文件的 PHP 脚本 `chap3/inc/photoUpload.php`。\n\n\
  ### 处理上传的文件\n\nPHP 照片上传脚本所做的远不止上传文件并验证它们以确保用户不会向你的服务器发送恶意文件。该脚本将全尺寸照片放入正确的目录，创建适当大小的缩略图，并将与上传文件对应的数据存入数据库。\n\
  \n1. 创建到 MySQL 数据库的连接：\n\n```\nif(!$dbc = mysql_connect('localhost', 'username',\
  \ 'password')){\n    echo mysql_error() . \"\\n\";\n    exit();\n}\n```\n\n---\n\
  \n> **注意**  \n> 你需要根据你的安装配置，使用特定的服务器、用户名和密码信息来建立此连接。本应用所需的各种表的设置脚本位于代码下载的 `chap3/sql`\
  \ 目录中，可从 [www.appliedjquery.com](http://www.appliedjquery.com) 获取。\n\n---\n\n2.\
  \ 你将把所有照片和缩略图存储在一个名为（我绞尽脑汁想出来的）`photos` 的目录中。该目录的路径是 `chap3/photos/`。将该路径赋值给 `$photoPath`\
