  \ {\n            $(this).dialog(\"close\");\n        }\n```\n\n15. 添加 `dialog` 函数的闭合括号：\n\
  \n```\n    }\n});\n```\n\n16. 导航到“与我们同住”选项卡，填写表单，然后点击“提交”。jQuery UI Dialog 小部件弹出，并提供提交日期的选项（图\
  \ 5.7）。\n\njQuery UI Dialog 小部件提供的交互效果很好，但可能会让用户疑惑是否发生了任何操作。数据突然从表单中消失，对话框也消失了。如果用户能看到并感知到某个操作正在进行，他们可能会更安心。而这正是\
  \ jQuery UI Progressbar 的完美用武之地！\n\n### 使用进度条通知用户\n\n使用 jQuery UI Progressbar 小部件为用户提供进程正在进行的视觉提示，可以简单也可以复杂，完全取决于你的需求。在某些情况下，你只需显示一个动画进度条，向用户指示某个操作正在发生。在其他情况下，你可以设置与\
  \ jQuery UI Progressbar 小部件的复杂交互，使其能够接收来自某些操作的增量信息，然后利用这些信息将进度条从左向右移动。\n\nAJAX 请求不会返回执行这种移动所需的增量信息，因为\
  \ AJAX 请求是异步的。你可以猜测增量值（不推荐），也可以寻找其他方式来使用 jQuery UI Progressbar 小部件达到预期效果。\n\n> **注意：**\
  \ AJAX 通常直到 XMLHttpRequest 完成时才会向浏览器返回任何信息（请参阅第 4 章）。你可以强制浏览器通过 AJAX 请求返回增量信息，但这是一个非常复杂的过程，在某些情况下可能会导致用户浏览器“锁定”，直到请求完成。\n\
  \n使用 jQuery UI Progressbar 小部件的一种方法是让它显示一个动画图像来表示操作。这就是你将在这里使用的方法。\n\n你将使用之前学到的技术，在模态窗口中显示\
  \ jQuery UI Progressbar。一旦收到提交日期信息的确认，进度条将在 `ajaxStart` 函数中被调用。AJAX 请求完成后，进度条将淡出并消失。\n\
  \n1. 要配置 jQuery UI Progressbar 和模态窗口的 CSS，请打开 `chap5/css/lamf.css` 并插入 `shade` 属性：\n\
  \n```\n#progressShade {\n```\n\n2. 通过将 `display` 属性设置为 `none` 来初始隐藏遮罩层：\n\n```\n\
  \    display: none;\n```\n\n3. 设置遮罩层的颜色和 `position`：\n\n```\n    background: #323232;\n\
  \    position: fixed;\n    left: 0;\n    top: 0;\n```\n\n4. 配置遮罩层的 `height`、`width`\
  \ 以及 `z-index`：\n\n```\n    width: 100%;\n    height: 100%;\n    z-index: 100;\n\
  }\n```\n\n5. 为容纳 jQuery UI Progressbar 小部件的元素设置 CSS 规则：\n\n```\n#progressbar {\n\
  ```\n\n6. 在需要之前隐藏进度条：\n\n```\n    display: none;\n```\n\n7. 配置 `position`、`height`\
  \ 和 `width`：\n\n```\n    position: fixed;\n    height: 12px;\n    width: 200px;\n\
  ```\n\n8. 设置正确的 `margin` 和位置数据，使 jQuery UI Progressbar 小部件在浏览器窗口中居中：\n\n```\n  \
  \  margin: auto;\n    top: 50%;\n    left: 50%;\n```\n\n9. 将 `z-index` 设置为足够高的数字，以确保它出现在所有其他元素的*上方*：\n\
  \n```\n    z-index: 200;\n}\n```\n\n\n\n\n\n现在你需要准备 jQuery 来显示 jQuery UI 进度条小部件。\n\
  \n1. 将 `chap5/5-3.php` 的副本另存为 `chap5/5-4.php`。\n\n2. 将 `ajaxStart` 绑定到 body：\n\n\
  ```javascript\n$('body').ajaxStart(function() {    \n```\n\n3. 使用本书前面演示的用于设置模态窗口的相同技术，将模态窗口代码添加到\
  \ `ajaxStart` 函数中。\n\n```javascript\n    $('body').append('<div id=\"progressbar\"\
  ></div>\n    ![Image](img/ccc.jpg) <div id=\"progressShade\"></div>');\n    var\
  \ modalMarginTop = ($('#progressbar').height()) / 2;\n    var modalMarginLeft =\
  \ ($('#progressbar').width()) / 2;\n    $('#progressbar').css({\n        'margin-top'\
  \ : -modalMarginTop,\n        'margin-left' : -modalMarginLeft\n    });\n    $('#progressShade').css('opacity',\
  \ '0.4');\n```\n\n4. 在 `ajaxStart` 函数中调用 jQuery UI 进度条小部件：\n\n```javascript\n  \
  \  $( \"#progressbar\" ).progressbar({\n```\n\n5. 将进度条的 `value` 选项初始化为 100。这意味着进度条将在网页上占据的空间中从左到右完全展开：\n\
  \n```javascript\n        value: 100\n    });\n```\n\n6. 淡入带有动画图像的进度条，给人一种正在执行操作的视觉效果：\n\
  \n```javascript\n    $('#progressbar, #progressShade').fadeIn(250);    \n});\n```\n\
  \n图 5.8 jQuery UI 进度条小部件向用户指示进程正在运行。\n\n![Image](img/05-08.jpg)\n\n7. 在 AJAX 请求完成后的\
  \ `ajaxStop` 函数中移除 jQuery UI 进度条小部件：\n\n```javascript\n$('body').ajaxStop(function()\
  \ {\n    $('#progressbar, #progressShade').fadeOut(400, function(){\n        $('#progressbar,\
  \ #progressShade').remove();\n    });\n});\n```\n\n在正常情况下，驱动 jQuery UI 进度条小部件在网站中显示和消失的\
  \ AJAX 请求和响应循环会非常快，以至于进度条几乎来不及出现就会淡出。这就是在“与访客建立‘对话框’”一节中将 `sleep` 函数放入 PHP 文件的原因。`sleep`\
  \ 函数为请求增加了一点时间，从而延长了进度条在屏幕上的显示时间。**图 5.8** 展示了进度条的实际效果。\n\n以 jQuery UI 进度条小部件的方式为用户提供视觉线索，是保持网站访客参与度的宝贵方法。Web\
  \ 应用程序的用户喜欢知道他们对自己与应用程序的交互有一定程度的控制。\n\n另一种可以用来保持用户参与度的方法是 jQuery UI 自动完成小部件。接下来我们看看如何使用这个小部件。\n\
  \n#### 自动完成字段\n\n用户将信息输入表单并点击按钮等待结果的盲目搜索在今天的互联网上几乎已成为历史。许多网站，包括像 Google 这样的大型网站，都选择根据用户在输入字段中输入的内容立即提供建议。\n\
  \njQuery UI 自动完成小部件让你能够轻松实现即时建议功能。接下来我们将把这个小部件添加到网站中。\n\n1. 打开 `chap5/5-4.php` 并将其副本另存为\
  \ `chap5/5-5.php`。找到第二个选项卡的 HTML 标记。该标记位于 `id` 为 `play` 的 `div` 中。\n\n2. 设置支持 jQuery\
