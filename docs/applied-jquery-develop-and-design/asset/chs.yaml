  <li><a id=\"security\"><span></span></a></li>\n</ul>  \n</div>\n```\n\n精灵图导航已完成，可以测试了。\n\
  \n**6.** 在浏览器中加载 `chap6/6-3.php` 以查看导航（**图 6.5**）。\n\n应用程序界面随着主导航的建立开始成形。你不再需要修改在\
  \ `chap6/6-3.php` 中定义的基本布局。从此刻起，所有更改都在文件（CSS 和 jQuery 文件）中进行，这些文件将从其他文件加载内容到界面中。\n\
  \n接下来，你将学习如何让主导航加载次级导航项和主要内容。\n\n图 6.6. 点击任意一个标题，内容将以手风琴效果展开，根据需要上下滑动内容和标题。\n\n\
  ![Image](img/06-06.jpg)\n\n#### 使用 AJAX 加载内容\n\n使用 jQuery 选择器可以轻松定位 Web 应用程序界面的内容区域。一旦定位了某个区域，就可以使用\
  \ jQuery 的 AJAX 方法之一将外部内容调用到界面中。\n\n你可以加载到这些内容区域的内容没有限制。你创建的内容，以及 jQuery 插件和 jQuery\
  \ UI 小部件，都可以包含到应用程序界面中。\n\n\n\n\n你可以同时将内容加载到多个区域。例如，通过一次`click`事件，你可以在将内容加载到主要内容区域的同时，将内容加载到辅助导航区域。\n\
  \n我们先来看一种将 jQuery UI 折叠面板（Accordion）组件加载到导航区域的技术。\n\n### 包含 jQuery UI 组件\n\n一种在有限空间内显示大量内容的流行组件是\
  \ jQuery UI 折叠面板（Accordion）组件。折叠面板占用固定空间，通过点击面板的标题可以滑动显示内容窗口。**图 6.6** 展示了一个包含三个部分的\
  \ jQuery UI 折叠面板，并显示了内容 C 部分的内容。\n\n你将使用 jQuery UI 折叠面板组件来辅助导航。让我们先准备这个组件，然后添加从主导航调用该组件的代码，以便打开折叠面板。\n\
  \n**1.** 在 `chap6/inc/nav` 中创建一个名为 `users.php` 的新页面。此文件夹将用于存储所有辅助导航文件。\n\n**2.**\
  \ 添加以下 jQuery 代码，将 jQuery UI 的 `accordion` 方法绑定到 `id` 为 `accordion` 的元素上：\n\n```html\n\
  <script type=\"text/javascript\">\n    $(document).ready(function() {\n        $('#accordion').accordion();\n\
      });\n</script>\n```\n\n**3.** 创建用于容纳 `accordion` 元素的 `div`：\n\n```html\n<div\
  \ id=\"accordion\">\n```\n\n**4.** 为折叠面板的每个部分添加标题和内容。注意，标题包含在标题（`h3`）标签中：\n\n```html\n\
      <h3><a href=\"#\">管理用户</a></h3>\n    <div>\n        <ul>\n            <li><a\
  \ href=\"#\" id=\"addUser\">添加用户</a></li>\n            <li><a href=\"#\" id=\"addUser\"\
  >编辑用户</a></li>\n        </ul>\n    </div>\n    <h3><a href=\"#\">管理角色</a></h3>\n\
      <div>\n        <ul>\n            <li><a href=\"#\" id=\"addUser\">添加角色</a></li>\n\
              <li><a href=\"#\" id=\"addUser\">编辑角色</a></li>\n        </ul>\n    </div>\n\
  ```\n\n**5.** 添加最后一个折叠面板部分，并关闭 `accordion` 元素：\n\n```html\n    <h3><a href=\"#\"\
  >管理群组</a></h3>\n    <div>\n        <ul>\n            <li><a href=\"#\" id=\"addUser\"\
  >添加群组</a></li>\n            <li><a href=\"#\" id=\"addUser\">编辑群组</a></li>\n       \
  \ </ul>\n    </div>\n</div>\n```\n\njQuery UI 库（包括库自带的 CSS）负责处理创建折叠面板和管理动画的细节；剩下的工作就是添加\
  \ jQuery 代码，将折叠面板加载到界面中。\n\n与其创建一个新文件来编写将项目加载到应用程序界面的 jQuery 代码，不如将代码添加到之前创建的脚本文件\
  \ `chap6/inc/jQuery/interface.js` 中。\n\n**1.** 打开 `interface.js` 文件，并准备在之前放入文件的窗口\
  \ `resize` 函数之后添加代码。\n\n**2.** 在第一行，将 `click` 函数绑定到包含在 `#spritenav` 列表项锚点标签中的主导航元素上：\n\
  \n```javascript\n$('#spriteNav li a').click(function(){\n```\n\n**3.** 获取被点击项的 `id`\
  \ 属性值，并将其放入变量 `clicked` 中：\n\n```javascript\n    var clicked = $(this).attr('id');\n\
  ```\n\n如果你在命名文件时足够聪明，就可以利用属性值（如上一行代码中的 `id` 属性）来创建适用于多种事件的单一函数。在本例中，要加载的导航文件名为 `users.php`。这意味着文件名与被点击项关联得很好。\n\
  \n图 6.7\\. jQuery UI 折叠面板组件已准备好作为 Web 应用程序界面的辅助导航元素。\n\n![Image](img/06-07.jpg)\n\
  \n**4.** 创建一个名为 `loadNav` 的变量，用于保存要加载的文件名和路径。注意，变量 `clicked` 用于补全路径文本：\n\n```javascript\n\
      var loadNav = 'inc/nav/' + clicked + '.php';\n```\n\n**5.** 使用 jQuery AJAX 的简写方法\
  \ `load` 将折叠面板加载到 `contentArea1` 中，完成该函数：\n\n```javascript\n    $('#contentArea1').load(loadNav);\n\
  });\n```\n\n**图 6.7** 展示了你的辛勤工作成果。jQuery UI 折叠面板组件已加载到辅助导航区域，并准备就绪。\n\n需要注意的是，你无需修改主界面，因为\
  \ jQuery UI 脚本文件和 CSS 已经包含在内。此外，将 UI 组件绑定在其使用文件中的技术是避免复杂脚本文件的最佳方式。\n\n在加载的文件中会使用额外的\
  \ jQuery 代码，因为这是组织应用程序的更好方式。将 jQuery 代码隔离在各自需要的文件中，有助于将函数模块化，以便在调用它们的地方使用，而不是将所有函数始终加载到界面中。这样可以减少加载时间，并且更容易追踪代码中的问题。应用程序界面也更容易扩展，因为新代码可以放入扩展应用程序的模块中。\n\
  \n### 同时加载多个项目\n\n使用 jQuery，可以轻松扩展函数，使其能够同时处理多个事件。为了演示这一能力，你将创建一个小的表单，该表单将在 jQuery\
  \ UI 折叠面板组件加载到 Web 应用程序界面的辅助导航区域的同时，加载到主要内容区域。\n\n**1.** 创建一个名为 `users_search.php`\
  \ 的表单，并将其保存在 `chap6/inc/content` 文件夹中。\n\n**2.** 添加一个小表单的 HTML 标记：\n\n```html\n\
  <form action=\"#\" method=\"post\" id=\"search_form\">\n    <fieldset>\n       \
  \ <label>名字</label><input type=\"text\"\n        ![Image](img/ccc.jpg) name=\"first_name\"\
  \ id=\"first_name\" /><br />\n        <label>姓氏</label><input type=\"text\"\n       \
  \ ![Image](img/ccc.jpg) name=\"last_name\" id=\"last_name\" /><br />\n        <label></label><input\
  \ type=\"submit\" name=\"search\"\n        ![Image](img/ccc.jpg) id=\"search\" value=\"\
  搜索\" /><br />\n    </fieldset>\n</form>\n```\n\n**3.** 扩展上一节（`chap6/inc/jQuery/interface.js`）中定义的\
  \ click 函数，添加两行代码：一行定义要加载的路径和文件名，另一行用于应用于新文件的 `load` 方法：\n\n```javascript\n$('#spriteNav\
  \ li a').click(function(){\n    var clicked = $(this).attr('id');\n    var loadNav\
  \ = 'inc/nav/' + clicked + '.php';\n    var loadContent = 'inc/content/' + clicked\
  \ + '_search.php';\n    $('#contentArea1').load(loadNav);\n    $(\"#contentArea2\"\
  ).load(loadContent);\n});\n```\n\n图 6.8\\. 多个项目已由 `load` 方法处理，并放置到 Web 应用程序界面的不同部分。\n\
  \n![Image](img/06-08.jpg)\n\n**图 6.8** 显示了点击主导航区域中*用户*图标的结果。表单被加载到主要内容区域，而 jQuery\
  \ UI 折叠面板组件出现在辅助导航区域。\n\n可以想象，只要规划得当并保持代码组织有序，从不同来源将内容加载到 Web 应用程序界面的内容区域并不复杂。即使是大量内容，也能轻松显示在界面中。\n\
  \n### 处理大量内容\n\n当你有包含多个部分的表单或扩展到数百行的表格数据时，最好将这些信息保持在 Web 应用程序界面内显示，而无需滚动整个窗口内容。滚动整个窗口会使导航元素和标识内容的标题移出视野，可能会让用户感到困惑，或者至少导致用户上下滚动以辨别数据的某些信息。任何相关的页脚都不会立即可见，用户可能永远不会向下滚动足够远以获取该元素的信息。\n\
  \n\n\n\n这并不是说你不应该构建会导致整个内容窗口滚动的界面。如果你确实在某个设计元素中允许这样做，就需要确保无论用户滚动到何处，都能有一种方式来识别内容和数据。大多数设计师会通过在内容旁边紧邻放置内容标识，或者每隔几行重复表格的列标题来实现这一点。\n\
  \n你为 Web 应用程序界面构建的 CSS 提供了恰当的结构，既能保持内容的可用性，又不会失去显示主要和次要导航区域以及页脚（如果包含任何内容）的能力。\n\n\
  下载包中提供了一个名为 `users_add.php` 的大表单，你可以用它来测试你的界面。该表单位于 `chap6/inc/content` 文件夹中，并包含一些\
  \ jQuery 函数，包括 jQuery UI Tabs 小部件。\n\n要将表单加载到内容区域，你需要修改之前在 `chap6/inc/nav` 中创建的\
  \ `users.php` 文件。\n\n**1.** 打开 `users.php` 文件，并添加以下（高亮显示的）jQuery 代码：\n\n```\n$(document).ready(function()\
  \ {\n\n    $('#accordion').accordion();\n\n    $('#addUser').click(function(event)\
  \ {\n\n        event.preventDefault();\n\n        $('#contentArea2').load('inc/content/users_add.php');\n\
  \n    });\n\n});\n```\n\n由 `addUser` 标识的元素被绑定到 jQuery 的 `click` 方法，以将表单 `inc/content/users_add.php`\
  \ 加载到 `contentArea2` 中。\n\n图 6.9. 加载到 Web 应用程序界面中的表单。\n\n![Image](img/06-09.jpg)\n\
  \n**2.** 在浏览器中重新加载 `6-4.php`，并点击 *Users* 图标。\n\n**3.** 当 jQuery UI Accordion 小部件加载后，你可以点击\
  \ *Add User*。带选项卡的表单应出现在内容区域中（**图 6.9**）。\n\n图 6.10. 由于内容超出了其所定位屏幕区域的大小，滚动条会自动出现。\n\
  \n![Image](img/06-10.jpg)\n\n通常超出浏览器窗口底部的内容现在被限制在内容区域的边界内。该界面区域在需要时会获得一个滚动条。**图\
  \ 6.10** 显示了当点击 Security 选项卡时，由于该选项卡包含的内容量较大，滚动条出现的情况。\n\n现在你已经配置好了基本的 Web 应用程序界面，并且能够轻松地将内容加载到各个区域，接下来让我们看看一些能够增强\
  \ Web 应用程序界面的附加功能。\n\n图 6.11. Mozilla Firefox 浏览器中的标准上下文菜单。在大多数基于 Web 的应用程序中，这些选项作用不大。\n\
  \n![Image](img/06-11.jpg)\n\n#### 配置附加增强功能\n\n由于你正在构建一个 Web 应用程序，你需要关注用户如何与你的应用程序交互。他们是否使用了鼠标右键功能？他们是否点击了后退按钮而不是使用导航元素？你是否想限制或修改用户访问浏览器内置功能的能力？有了这些问题的答案，你可以应用一些\
  \ jQuery 技术来实现这些增强功能。\n\n##### 禁用右键上下文菜单\n\n通过鼠标右键激活的上下文菜单（**图 6.11**）中的许多操作项在基于\
  \ Web 的应用程序中并不适用。因此，你可以选择禁用用户右键点击时出现的上下文菜单。使用 jQuery，你只需应用一小段代码即可实现。\n\n打开你之前创建的\
  \ jQuery 脚本文件 `interface.js`（位于 `chap6/inc/jQuery` 中），并在文档就绪包装函数的结束括号之前插入以下代码：\n\
  \n```\n$(document).bind(\"contextmenu\",function(e){\n\n    e.preventDefault();\n\
  \n});\n```\n\n这段 jQuery 代码将 `contextmenu` 事件绑定到文档，然后对上下文菜单应用 `preventDefault` 处理程序。这将阻止右键点击时弹出上下文菜单。\n\
  \n你可能已经猜到，还有一些 jQuery 上下文菜单插件可用。这些插件允许你为 Web 应用程序创建自定义上下文菜单。请查看我最喜欢的 jQuery 上下文菜单插件：[`abeautifulsite.net/blog/2008/09/jquery-context-menu-plugin`](http://abeautifulsite.net/blog/2008/09/jquery-context-menu-plugin)。让我们为其中一个界面元素添加一个自定义上下文菜单。\n\
  \n**1.** 打开 `chap6/inc/jQuery` 文件夹中的 `interface.js`，并将你之前创建的用于禁用右键上下文菜单的代码用注释括起来：\n\
  \n```\n/*$(document).bind(\"contextmenu\",function(e){\n\n    e.preventDefault();\n\
  \n});*/\n```\n\n添加注释后，你可以保存文件。现在右键功能再次可用；自定义上下文菜单需要用到它。\n\n**2.** 打开 `6-3.php`，并将其另存为\
  \ `chap6` 文件夹中的 `6-4.php`。你也可以将代码添加到 `6-3.php` 中，但为了保持一致性（以及备份原始工作），复制一份是更稳妥的做法。\n\
  \n**3.** 将 jQuery Context Menu CSS 和 jQuery 文件的源引用添加到 `chap6/6-4.php` 的 head 部分（高亮显示）：\n\
