  \ `notes.php` 文件中：\n\n```\n<script type=\"text/javascript\">\n\n    $(document).ready(function()\
  \ {\n\n        $('#accordion').accordion();\n```\n\n**6.** 将 `click` 方法绑定到 `addNotes`\
