  \ 预订请求\">和我们一起住...</a></li>\n\n</ul>\n```\n\n请务必访问 TinyTips 插件网站，了解其他选项以及在网站和应用程序中使用\
  \ TinyTips 的方法。\n\n在为旅馆网站访问者添加更多信息的同时，为他们提供地图信息也是合理的，许多商业网站都这样做。由于在网站上展示地图数据非常流行，Google\
  \ 提供了一个 API，你可以用它来与地图应用进行交互。下一个 jQuery 插件 gMap 为你提供了在网站中轻松有效地使用 Google Maps API\
  \ 所需的工具。\n\n##### 将业务放在地图上\n\n使用 Google Maps API 显示各种类型地图的网站数量惊人。网站使用地图来提供路线指引、突出显示所有位置，甚至指导玩家进行实时互动游戏。\n\
  \n只有一个问题：Google Maps API 使用起来可能很棘手，尤其是当设计师只想包含一张地图来显示零售商或服务的位置时。\n\nCedric Kastner\
  \ 通过他的 Google 地图 jQuery 插件（他称之为 gMap，可从 [`gmap.nurtext.de`](http://gmap.nurtext.de)\
  \ 下载）消除了这种复杂性。使用 gMap 的唯一要求（除了在标记中包含正确的文件外）是你拥有一个 Google 帐户，以便注册 Google Maps API\
  \ 密钥。你可以在 [`code.google.com/intl/en-US/apis/maps/signup.html`](http://code.google.com/intl/en-US/apis/maps/signup.html)\
  \ 注册密钥。\n\n让我们把旅馆的位置放在地图上。\n\n1. 将 `chap5/5-7.php` 另存为 `chap5/5-8.php`。确保在 `chap5/5-8.php`\
