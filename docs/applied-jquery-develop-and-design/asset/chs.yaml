  \n        });\n\n    });\n\n</script>\n```\n\n**8.** 构建导航手风琴的 HTML 标记：\n\n```\n\
  <div id=\"accordion\">\n\n    <h3><a href=\"#\">管理笔记</a></h3>\n\n    <div>\n\n       \
