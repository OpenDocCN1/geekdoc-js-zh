  \n```\n    var photoInfoArr = photoInfo.split('_');\n```\n\n全尺寸图片的名称将包含在 `photoInfoArr[1]`\
  \ 中。\n\n**6.** 重新组合这两部分以提供全尺寸图片的路径，例如 `photos/ka1.jpg`：\n\n```\n    var photoSrc\
  \ = photoPath+photoInfoArr[1];\n```\n\n请注意，像刚才那样操作文本在 jQuery（以及其他编程语言）中经常发生。事实上，稍后在此函数中将\
  \ `click` 事件绑定到缩略图时，你会看到类似的文本操作。随着你技能的增长，你将能够编写快速处理此类文本操作的函数，更重要的是，作为可重用的代码片段。\n\
  \n**7.** 通过使用 `$('<img/>')` 选择器创建新图片，并将图片绑定到 load 函数：\n\n```\n    $('<img/>').load(function(){\n\
  ```\n\n**8.** 将一个 `div` 追加到 HTML 文档的 body 中，以容纳全尺寸图片：\n\n```\n        $('body').append('<div\
