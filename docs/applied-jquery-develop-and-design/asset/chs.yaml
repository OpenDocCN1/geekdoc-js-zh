  \ '#FFFFFF'\n\n    };\n```\n\n当用户将 `colorText` 元素绑定到某个元素时，可以通过传递一个 JavaScript 对象字面量来扩展默认设置。jQuery\
  \ 用于合并默认选项与传递的对象字面量的方法是 `extend` 方法。\n\n`extend` 方法的第一个参数被称为目标对象。目标对象是在调用 `extend`\
  \ 时将被修改的对象。\n\n**4.** 在这种情况下，保持目标对象为空，以便保留 `defaults` 和 `options` 的属性。将 `extend`\
