  \ 中构建了基于精灵的可靠导航函数，现在你可以在浏览器中加载 `chap6/6-4.php`，并点击 Notes 使 `note.php` 出现在界面的左侧内容区域。完成这一步后，你就可以着手创建内容，以展示\
  \ jQuery Context Menu 插件。\n\n**1.** 在 `chap6/inc/content` 文件夹中创建一个名为 `notes_add.php`\
