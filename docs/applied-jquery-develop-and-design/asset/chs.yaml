  \ `mainNavBar` 元素（75 像素）加上 `footer` 元素（75 像素）的高度。再额外增加 25 像素作为内边距：\n\n```\n    $(\"\
  #content1\").height(windowHeight - 175 + \"px\");\n    $(\"#contentArea1\").height(windowHeight\
