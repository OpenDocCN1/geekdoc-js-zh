  \n### 使用 AJAX 更新内容\n\n在许多情况下，你会希望使用各种 jQuery AJAX 函数来更新可见的网站内容。有些内容更新可能基于当前用户的信息，另一些则可能基于任何用户发起的请求，例如网站访客执行的搜索信息。\n\
  \n让我们来看一些使用 jQuery 的 AJAX 方法更新内容的技术。\n\n#### 基于当前用户获取内容\n\n即使你只开发过很短时间的网站，也很可能知道\
  \ URL 中的查询字符串。除非网站开发者使用了隐藏字符串的方法，否则你可能见过类似这样的内容：\n\n`http://www.website.com/?user=me&date=today`\n\
  \n问号之后的所有内容都是查询字符串，可以在向服务器发送 GET 请求时使用。每个项都以 `name=value` 对的形式设置，可以轻松地被 jQuery 和\
  \ PHP 等脚本语言解析。\n\n> **注意：** 大多数表单使用 POST 方法向服务器请求数据，但 URL 仅限于 GET 方法。大多数 Web 开发者遵循这样的规则：仅在检索数据时使用\
  \ GET，在向服务器发送数据以触发服务器端更改时使用 POST。\n\nGET 请求不仅限于 URL。你可以将 GET 用作表单方法或 AJAX 中的方法。jQuery\
  \ 提供了一个简写方法调用来向服务器发起此类请求，方便起见，它被称为 `get`。\n\n1. 打开 `chap4/4-2.php`，设置一个 `get` 函数，将当前用户的图片检索到\
  \ Web 浏览器中。与其将 jQuery 代码存储在另一个文件中并包含进来，不如使用一种略有不同的技术，这种技术在使用小型 jQuery 脚本时非常有用。\n\
  \n2. 找到闭合的 `</body>` 标签。就在该标签之前，将设置 jQuery AJAX `get` 方法来检索用户的图片。首先插入 script 标签：\n\
  \n   ```html\n   <script type=\"text/javascript\">\n   ```\n\n3. 确保文档（当前网页的 DOM\
  \ 信息）完全加载后，打开函数：\n\n   ```javascript\n   $(document).ready(function() {\n   ```\n\
  \n4. 确保从数据库获取正确信息的第一个关键步骤是，将登录时设置的 cookie 值赋给一个 jQuery 可以使用的变量。cookie 中的信息是用户名：\n\
  \n   ```javascript\n   var cookieUser = '<?php echo $_COOKIE['photoex'];?>';\n \
  \  ```\n\n5. 如前所述，`get` 方法依赖于 `name=value` 对来正常工作。确保 `get` 请求将 cookie 数据作为 `name=value`\
  \ 对发送到服务器：\n\n   ```javascript\n   $.get('inc/userPhoto.php', {photoUser: cookieUser},\n\
  \   ```\n\n   ![Image](img/ccc.jpg)\n\n   ```javascript\n   function(data){\n  \
  \ ```\n\n6. 将返回的信息加载到 `id` 为 `myPhotos` 的 `div` 中：\n\n   ```javascript\n   $('#myPhotos').html(data);\n\
  \   ```\n\n7. 关闭 `get` 函数，并指定 PHP 脚本预期返回的数据类型。关闭后，设置闭合的 `</script>` 标签（`</body>`\
  \ 标签仅作参考）：\n\n   ```javascript\n   }, 'html');\n   });\n   </script>\n   ```\n\n\
  \   ```html\n   </body>\n   ```\n\n8. 在从数据库获取照片之前，你需要创建照片表。因此，运行代码下载中 `chap4/sql`\
  \ 文件夹内的 `pephoto.sql` 文件。该 SQL 文件还会为 `chap4/photos` 文件夹中的照片插入默认数据。\n\n   在 PHP 文件\
  \ `chap4/inc/userPhoto.php` 中，SQL 查询使用了 `photoUser` 变量中包含的信息：\n\n   ```php\n   $getImg\
  \ = \"SELECT `imgName`,`imgThumb` \";\n   $getImg .= \"FROM `photoex`.`pephoto`\
  \ \";\n   $getImg .= \"WHERE `username` = '\".$_GET['photoUser'].\"' \";\n   ```\n\
  \n   图 4.6：用户的照片以表格形式呈现。\n\n   ![Image](img/04-06.jpg)\n\n   用户的照片被检索出来并放入一个表格中供查看。结果如**图\
  \ 4.6**所示。\n\n将用户数据与 `get` 方法结合使用，对于需要显示用户特有数据的页面非常有效。那么，对于非用户特有的内容呢？`get` 方法有一个很酷的小兄弟，叫做\
  \ `load`。\n\n#### 基于请求加载内容\n\n在 jQuery AJAX 简写方法中，`load` 是从服务器检索信息最简单、最容易的方法。当你想要调用不需要像\
  \ `get` 或 `post` 方法那样传递数据的新信息时，它特别有用。`load` 的语法也非常简洁：\n\n```javascript\n$('a[href=\"\
  writeNew\"]').click(function(e){\n    e.preventDefault();\n    $('#newArticle').load('inc/userWrite.php');\n\
  });\n```\n\n图 4.7：表单已加载到页面中，以便用户撰写新文章。\n\n![Image](img/04-07.jpg)\n\n点击“撰写”链接（**图\
  \ 4.7**）会调用 `load` 函数，导致 `chap4/inc/userWrite.php` 被加载到 `id` 为 `newArticle` 的 `div`\
  \ 中。\n\n`load` 还提供了另一个非常酷的功能：你可以用它只加载其他页面的部分内容。例如，要加载另一个页面中 `id` 为 `part1` 的 `div`，语法如下：\n\
  \n```javascript\n$('#newArticle').load('inc/anotherPage.html #part1');\n```\n\n\
  能够加载页面部分内容，可以为你提供极大的设计和组织灵活性。\n\n> **注意：** 在第 6 章“创建应用程序界面”中，你将看到一个示例，其中多个小部件包含在一个文件中，该文件将根据需要由\
  \ `load` 调用以完成界面。\n\n并非每个网站都能使用 jQuery 提供的所有 AJAX 功能，因此我们在此将暂时放下 Photographer's\
  \ Exchange 网站。我们将开发独立的示例来演示 jQuery AJAX 库中其他一些可用的功能和事件。\n\n#### 动态加载脚本\n\n在某些情况下，你需要在网页和应用程序中一次性加载\
  \ JavaScript 或 jQuery 脚本。jQuery 提供了一个专门的 AJAX 简写方法来实现这一点，即 `getScript`。\n\n在这个示例中，你将使用\
  \ `chap3/dvdCollection` 中包含的代码，这是一个小型个人网站，旨在作为你拥有的所有 DVD 和蓝光光盘的目录。\n\n有时你会想知道自己有多少张\
  \ DVD 和蓝光光盘，但每次使用网站时都加载执行计数并显示结果的脚本并不必要。jQuery 的 `getScript` 方法是加载不常用脚本的完美解决方案。\n\
  \n1. 创建一个名为 `dvdcount.js` 的脚本，并将其放在 DVD 收藏网站的 `inc` 目录中。这是 `getScript` 在被调用时将加载的脚本。\n\
  \n2. 包含文档就绪功能：\n\n   ```javascript\n   $(document).ready(function(){\n   ```\n\n\
  3. 每部电影都包含在一个 `class` 为 `dvd` 的 `div` 中。将这些 `div` 的数量赋给变量 `totalCount`：\n\n   ```javascript\n\
  \   var totalCount = $('.dvd').length;\n   ```\n\n4. 使用 jQuery 的 `:contains` 选择器来帮助统计收藏中光盘的类型。`:contains`\
