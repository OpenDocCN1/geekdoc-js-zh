  \n\n\n\n\n- 源点的 `x` 和 `y` 坐标。这告诉重采样函数在源图像中从哪个点开始工作。它从左上角开始。\n- 目标宽度和高度。\n- 源宽度和高度。\n\
  \n```\nimagecopyresampled($newThumbnail, $workingImg, 0, 0, 0, 0,\n![Image](img/ccc.jpg)\
  \ $thumbW, $thumbH, $oldX, $oldY);\n```\n\n**10.** 重采样完成后，将图像输出到适当的位置，从而将其移动到网站文件结构中的永久位置。如果图像是\
