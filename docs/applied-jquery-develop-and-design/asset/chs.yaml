- "# jQuery应用：开发与设计\n\n\n## 致谢\n\n没有许多人的支持和理解，这样的项目是不可能完成的，而我在开始写书之旅时并未真正理解这一点。说“谢谢”远远不够，但我希望你们都能明白我有多么感激你们！\n\
  \n即使生活的搅拌机在我们周围轰鸣，康妮·凯、凯特琳、布列塔尼、扎克、卡拉和摩根给予我的爱与支持超乎想象。我爱你们！\n\n致丽贝卡·古利克，感谢你信任我，帮助我实现梦想！\n\
  \n致安妮·玛丽·沃克，你的温和坚定、指导和微妙的幽默感，我无法用言语表达。我永远感激你！\n\n致杰西·卡斯特罗，感谢你让我走在正道上。你的洞察力、技术能力和鼓励让我惊叹不已！\n\
  \n致拉里·厄尔曼，感谢你像福特·普里弗克特之于亚瑟·登特一样，引导我穿越银河系！我的毛巾一直放在桌上！\n\n致弗朗西斯·戈弗斯，知道只需一个电话或一封邮件就能联系到你，我生活中的曲折变得更容易忍受。最好的朋友莫过于此！\n\
  \n致那些日复一日与我共事的开发团队伙伴们，感谢你们让我成为更好的程序员和更好的人！你们愿意在我身边指导我、教我新东西，这份情谊无比珍贵。\n\n致 jQuery\
  \ 社区，你们是一群了不起的人，我很荣幸能与你们共享电子世界！\n## 引言\n\n作为网页设计师，你不得不竭尽全力尽快吸引网络浏览者的注意力，然后让他们留在你的网站上吸收内容。除了你提供的产品、服务或信息之外，网站还必须具有视觉吸引力，并提供刺激（且有价值）的交互。jQuery\
  \ 库是为你的网站蛋糕增添糖霜的主要原料。如果运用得当，jQuery 的效果将说服访客和应用用户点击浏览并品尝你的所有内容。\n\n诀窍在于学习如何有效地将 jQuery\
  \ 与其他标记和语言结合起来。你必须掌握广泛领域的知识，比如 HTML（超文本标记语言）和 CSS（层叠样式表），才能知道如何恰当地混合适量的 jQuery。本书的目标是让你掌握将\
  \ HTML、CSS 和 jQuery 这些要素结合在一起的知识，从而为你的网站和应用创建引人入胜的交互性。\n\n在整本书中，我还会向你展示如何使用 PHP（一种流行的服务器端脚本语言）和\
  \ MySQL（一种关系数据库产品）来增强你的整体开发能力，并为你的应用注入强大动力。这两种技术都很容易迁移到其他 Web 开发语言中。\n\n### 什么是\
  \ jQuery？\n\njQuery 由 John Resig 于 2006 年发布，它作为一种使用 JavaScript 与 HTML 和 CSS 交互的新方式迅速获得了流行和支持。jQuery\
  \ 的简单选择器模仿了 CSS 选择器，使得这个库对设计师和开发者来说既熟悉又易于学习。jQuery 库通过在后端处理大多数浏览器兼容性问题，消除了 Web 开发者在尝试跨多种浏览器创建交互式网站时所遭受的担忧。\n\
  \n除了这两个特性之外，jQuery 还使用了简化的语法。下面的例子展示了如何使用 jQuery 根据元素的 `id` 属性来选择它：\n\n`$('#foo');`\n\
  \n与老式 JavaScript 中的相同示例相比，jQuery 选择器要简短得多：\n\n`document.getElementByID('foo');`\n\
  \n难怪 Web 开发社区会拥抱 jQuery“写得更少，做得更多”的口号。将 jQuery 的简洁性与它支持复杂动画和实现惊人效果的能力相结合，你就得到了一个灵活且功能强大的\
  \ JavaScript 库，它能够让你为网站访客提供出色的交互体验。\n\n### 本书面向的读者\n\n本书面向初级到中级的 Web 开发者，但无论你作为设计师或开发者处于哪个阶段，都不影响阅读。你应该能在本书中找到一些示例，帮助你用\
  \ jQuery 让网页和应用变得生动起来。如果你具备 HTML、CSS、JavaScript 和 jQuery 的基础知识会有所帮助，但并非必需，因为示例都是完整且可直接使用的。\n\
  \n### 我所使用的工具\n\n在撰写本书时，jQuery 1.5 已经发布，并且本书中的所有示例都使用了该版本。你可以从 [www.jquery.com](http://www.jquery.com)\
  \ 下载它。它也可以在本书的网站 [www.appliedjquery.com](http://www.appliedjquery.com) 上找到。\n\n\
  HTML、CSS 和 JavaScript 文件都是纯文本文件，你可以在任何纯文本编辑器中创建和编辑它们。\n\n所有示例均在 Firefox 3 和 Internet\
  \ Explorer 8 中测试过，偶尔也在 Safari 和 Google Chrome 中查看。\n\n### 代码在哪里获取\n\n本书的所有代码示例都可以从\
  \ Applied jQuery 网站 [www.appliedjquery.com/downloads](http://www.appliedjquery.com/downloads)\
  \ 获取。在那里你可以下载一个包含所有示例、图形和其他所需附件的 Zip 文件。\n\n示例在 Zip 文件中按章节排列，并包含所有必要的 jQuery 文件，以便示例开箱即用。\n\
  \n不过，尽管所有文件都可以下载，我还是鼓励你在阅读本书的过程中亲自输入每个示例。动手实践将帮助你理解所有技术如何协同工作，并加深你对这些概念的记忆。\n\n\
  ### 让我们开始吧\n\n是时候让你直接投入并开始学习如何使用 jQuery 了。在第一章中，我将为你提供一些好的规则和工具，帮助你朝着正确的方向前进，用 jQuery\
  \ 为你的 Web 开发工作增色添彩。\n\n## 欢迎使用 jQuery\n\n### 欢迎使用 jQuery\n\njQuery 是当今最流行的 JavaScript\
  \ 库之一，因为它让你能够快速轻松地构建 JavaScript 网页和 Web 应用，用一行代码就能完成原本需要几十行 JavaScript 代码才能完成的工作。\n\
  \n准备好一台电脑和下面列出的几个工具，然后深入阅读接下来的六个章节。\n\n#### jQuery\n\njQuery 可以免费下载和使用，它以一个单独的 .js\
  \ 文件形式存在，你从网页中链接该文件，然后你的代码通过调用各种 jQuery 函数来访问这个库。前往 jquery.com 下载 jQuery 库。\n\n\
  ![图片](img/jquery_icon.jpg)\n\n#### jQuery UI\n\n接下来，你需要从 jQueryUI.com 下载 jQuery\
  \ UI 库。这将为你提供一些核心交互插件以及许多 UI 小部件，我将在本书后面讨论它们。\n\n![图片](img/jqueryui_icon.jpg)\n\n\
  #### 文本编辑器\n\n你将进行一些脚本编写，所以请准备一个好的文本编辑器。Windows 用户通常选择 Microsoft Notepad 或 Notepad++，而\
  \ Mac 用户则经常依赖 Bare Bones Software 的 BBEdit。\n\n![图片](img/bbedit_icon.jpg)\n\n####\
  \ 浏览器\n\n很可能你已经安装了一个符合标准的浏览器。流行的选择包括最新版本的 Microsoft Internet Explorer、Mozilla Firefox、Apple\
  \ Safari、Google Chrome 和 Opera。\n\n![图片](img/chrome_icon.jpg)\n\n#### 故障排查工具\n\n\
  我严重依赖 Firebug Web 开发工具进行故障排查。前往 [`getfirebug.com`](http://getfirebug.com) 获取一个针对你浏览器的版本。它是\
  \ 100% 免费且开源的，当出现问题时，你会庆幸已经安装了它。\n\n![图片](img/firebug_icon.jpg)\n\n#### 测试环境\n\n\
  不要使用实际的托管网站来测试你的 jQuery 作品，而是使用你自己计算机上的本地测试环境。我使用 XAMPP，你可以从 [`apachefriends.org`](http://apachefriends.org)\
  \ 下载它。\n\n![图片](img/xampp_icon.jpg)\n\n## 1. 初识 jQuery\n\n使用语义化标记和诸如层叠样式表（CSS）与\
  \ JavaScript 等非侵入式技术的丰富交互式网站，正成为 Web 开发的事实标准。设计师和开发者正在寻找新的、更好的方式来让他们的作品生动起来，而像 jQuery\
  \ 这样的库使得这一目标易于实现。\n\n为了正确开始使用 jQuery，你需要配备合适的工具和概念。因此，我为你收集了这些工具，并帮助你学习如何使用它们。\n\
  \n本章将让你牢固掌握 jQuery 的基础知识以及使 jQuery 使用起来简单明了的工具。此外，还包含一些充分利用 jQuery 的技巧。但首先要做的是；让我们从一个“Hello\
  \ World”示例开始，采用 jQuery 风格。\n\n### 让 jQuery 工作起来\n\njQuery 库的强大之处在于它能够与你网页中已经熟悉的元素进行交互。通过使用简单的选择器概念，可以轻松地将网页中的标记标签、类声明和属性信息与\
  \ jQuery 连接起来。\n\n\n\n\njQuery 选择器会将一个元素或一组元素封装成一个对象。一旦创建了 jQuery 对象，你就可以有效地对该对象应用大量\
  \ jQuery 方法，以创建动画、与服务器收发信息或执行对象操作。\n\n任何一本编程书，如果没有“Hello World!”示例，那就不算完整。为了展示 jQuery\
  \ 选择器的强大和灵活性，我们来创建一个“Hello World!”示例。\n\n* * *\n\n注意\n\nHello World 代码是本书网站下载中唯一没有提供的代码示例。原因是我认为你自己亲手输入这段代码非常重要。示例中也包含了注释。\n\
  \n* * *\n\n1. 首先建立 HTML 页面的基本标记：\n\n   ```html\n   <!DOCTYPE>\n   <html lang=\"\
  en\">\n       <head>\n           <meta charset=\"utf-8\" />\n           <title>Hello\
  \ World - jQuery 风格</title>\n   ```\n\n2. 确保包含 jQuery 源文件。没有这个文件，任何 jQuery 代码都无法运行：\n\
  \n   ```html\n           <script type=\"text/javascript\"\n           ![Image](img/ccc.jpg)\
  \ src=\"jquery-1.5.min.js\"></script>\n   ```\n\n3. 打开一个 script 标签，为 jQuery 代码在页面中提供一个位置：\n\
  \n   ```html\n           <script type=\"text/javascript\">\n   ```\n\n4. 你创建的 jQuery\
  \ 函数需要在网页加载完所有元素后才能运行。为此，你需要将 jQuery 代码包裹在一个 *文档就绪* 函数中。顾名思义，当 Web 文档就绪时，包裹在该函数中的代码就可以运行了：\n\
  \n   ```javascript\n           $(document).ready(function() {\n   ```\n\n5. 创建第一个选择器。这个选择器将获取页面中\
  \ `id` 属性等于 `first` 的标记元素。所有 `id` 属性在 jQuery（和 CSS）中都是通过在 `id` 属性包含的信息前加上井号（`#`）来选择的。你将在选择器后面通过链式调用\
  \ jQuery 的 `html` 方法。该方法会将标记 `<h1>Hello World!</h1>` 放入选中的元素中：\n\n   ```javascript\n\
  \               /* 向第一个 div 写入 'Hello World!' */\n               $('#first').html('<h1>Hello\
  \ World!</h1>');\n   ```\n\n   *链式调用* 是用来描述将一个或多个方法应用于 jQuery 对象的术语。链式调用为你提供了多种可能性，可以组合方法，为网站访问者创建独特的交互效果。\n\
  \n6. 在本示例中，你将创建另一个方法，用于连接（或 *绑定*）一个事件处理程序到选择器上，以创建一个动作。事件处理程序将接受一个动作，并对其他选中的元素执行额外的\
  \ jQuery 函数。首先，将 jQuery 的 `click` 处理程序绑定到 `id` 为 `link` 的元素上：\n\n   ```javascript\n\
  \               $('#link').click(function() {\n   ```\n\n   `click` 方法暴露了一个处理函数，允许你构建一系列将由\
  \ `click` 方法触发的动作。\n\n7. 为 `id` 为 `greeting` 的元素设置一个选择器，并对其应用 `html` 方法：\n\n   ```javascript\n\
  \                   $('#greeting').html('<h1>Hello Again!</h1>');\n   ```\n\n8.\
  \ 用正确的花括号、方括号和 script 标签关闭 jQuery 代码：\n\n   ```javascript\n               });\n\
  \           });\n           </script>\n   ```\n\n   在创建 jQuery 代码时，要特别注意花括号和方括号。每个开括号或开大括号都必须有对应的闭括号或闭大括号，这一点至关重要。\n\
  \n9. 完成标记的 `head` 部分，并打开网页的 `body`：\n\n   ```html\n       </head>\n       <body>\n\
  \   ```\n\n10. 创建一个 `id` 为 `first` 的 HTML `div`。你之前创建的初始 jQuery 选择器将与此元素交互，添加在 `div`\
  \ 标签之间指定的 HTML 标记：\n\n    ```html\n            <div id=\"first\"></div>\n    ```\n\
  \n11. 创建另一个 `id` 为 `second` 的 HTML `div`。你没有为这个元素编写任何选择器；它只是用作其他元素的容器：\n\n    ```html\n\
  \            <div id=\"second\">\n    ```\n\n12. 创建一个锚点标签，并赋予它 `id` 为 `link`。你之前编写的\
  \ jQuery 代码将处理用户点击该链接时的操作：\n\n    ```html\n                <a href=\"#\" id=\"link\"\
  >点击我！</a><br />\n    ```\n\n13. 创建一个 `id` 为 `greeting` 的 span 元素。当链接被点击时，`greeting`\
  \ 的选择器会将你在 `span` 标签之间指定的 HTML 标记应用进去：\n\n    ```html\n            <span id=\"greeting\"\
  ></span>\n    ```\n\n14. 通过正确关闭标记标签来完成页面：\n\n    ```html\n            </div>\n \
  \       </body>\n    </html>\n    ```\n\n15. 图 1.1。页面加载时显示“Hello World!”消息，点击链接时显示“Hello\
  \ Again!”消息。\n\n    ![Image](img/01-01.jpg)\n\n    将文件保存为 `hello_world.html`，并在\
  \ Web 浏览器中加载。如果你输入得足够仔细，你将看到一个与 **图 1.1** 完全相同的网页。\n\n这个示例只是让你初步了解如何将 jQuery 连接到网页中的元素，以提供信息和交互性。该示例还演示了如何使用\
  \ jQuery 向网页添加元素。\n\n要有效地使用 jQuery，你需要了解如何处理网页中的所有元素，以及它们是如何组合成一个文档的。\n\n一个文档？\n\
  \n完全正确：网页是旨在 Web 浏览器中显示的文档。由于网页是文档，它们遵循一些与纸质文档相同的规则，而这些规则由主文档——文档对象模型（DOM）提供。\n\n\
  ### 使用 DOM\n\n图 1.2。使用 Firefox 的 Firebug 检查 DOM。\n\n![Image](img/01-02.jpg)\n\n\
  所有网页的核心是一个 API（应用程序编程接口），它描述了页面上的所有内容。这就是 DOM。DOM 为页面上的每个元素提供信息，包括与元素关联的样式。DOM 中的信息以树状结构存储。\n\
  \n有几种 DOM 检查器应用程序，既可以作为独立应用程序，也可以作为许多流行 Web 浏览器的插件使用。**图 1.2** 显示了 Firebug 中可用的\
  \ DOM 检查器。\n\n图 1.3。列表中元素之间关系的轮廓。\n\n![Image](img/01-03.jpg)\n\nDOM API 允许像 JavaScript\
  \ 这样的语言和像 jQuery 这样的库与网页中的元素进行交互。你可以使用像 jQuery 这样的库在 DOM 树中上下移动，以定位、添加、删除和修改元素。由于你将使用\
  \ jQuery 与 DOM 交互，包括从中添加和删除元素，因此你需要熟悉 DOM 的构造方式。你不需要成为 DOM 专家，但你应该对 DOM 有足够的了解，以便在使用\
  \ jQuery 操作它时能够识别发生了什么。\n\n当你开始使用 jQuery 的父级和子级类型选择器时，了解 DOM 变得至关重要。你必须理解 DOM 中元素之间的关系，才能有效地操作这些元素。考虑以下\
  \ HTML 标记：\n\n```html\n<div id=\"information\">\n    <ul>\n        <li><a href=\"\
  foo.html\"><img src=\"bar.jpg\" /></a></li>\n        <li><a href=\"glorp.html\"\
  ><img src=\"murkle.jpg\" /></a></li>\n    </ul>\n</div>\n```\n\n要知道如何在 DOM 树中上下移动，你必须知道元素之间的关系是什么。**图\
  \ 1.3** 显示了这些关系是如何定义的。\n\n* * *\n\n#### 换行和注释\n\n由于 JavaScript 允许你通过换行继续代码，jQuery\
  \ 也是如此。这意味着你可以将链式调用的 jQuery 方法分散到多行。将较长的链式调用分散到多行可以使 jQuery 方法在视觉上更容易跟踪和调试。你经常会看到类似以下示例的\
  \ jQuery 链式调用：\n\n\n\n\n```\nvar nextImage = $('img[src=\"bar.jpg\"]') // 定义起始点\n\
  \n![Image](img/ccc.jpg) 起始点\n\n    .closest('li') // 向上遍历到最近的列表项\n\n    .next()\
  \ // 移动到下一个列表项\n\n    .find('img') // 在下一个列表项中找到图片标签\n\n    .attr('src'); // 获取找到的图片的\
  \ src 属性\n\n    ![Image](img/ccc.jpg) 图片标签\n```\n\n我无论如何强调代码注释的重要性都不为过。虽然出于篇幅考虑，本书中不会对大量代码进行注释，但你可以期待在网站上的代码示例中看到大量注释。我个人的风格是：当注释简短时，在行末使用双斜杠；当需要更详细的描述时，则使用较大的注释块（以\
  \ `/*` 开头，以 `*/` 结尾）。\n\n```\n// 这是一个短注释\n\n/* 这个注释可以跨越多行，并且可以非常详细\n\n![Image](img/ccc.jpg)\
  \ 描述性 */\n```\n\n* * *\n\n掌握了这些知识，你就可以遍历这个列表的 DOM 元素了。假设你知道第一个列表项中的图片源，你可以轻松地获取列表中第二张图片的\
  \ src 属性，如下所示：\n\n```\nvar nextImage = $('img[src=\"bar.jpg\"]') // 定义起始点\n\n   \
  \ .closest('li') // 向上遍历到最近的列表项\n\n    .next() // 移动到下一个列表项\n\n    .find('img')\
  \ // 在下一个列表项中找到图片标签\n\n    .attr('src'); // 获取找到的图片的 src 属性\n\n    ![Image](img/ccc.jpg)\
  \ 图片标签\n```\n\n变量 `nextImage` 现在包含值 `murkle.jpg`。\n\n### 学习一些 jQuery 技巧\n\n随着我不断使用和学习\
  \ jQuery 库，我积累了一些好的经验法则，包括精确指定 jQuery 选择器、缓存选择器以及打包代码以提高效率。这里提供的这些技巧以及其他技巧将使你的代码更高效，为你提供一些好用的工具，并缩短开发时间。\n\
  \n#### 精确选择元素\n\n为了找到你想要操作的元素，jQuery 需要遍历 DOM 树。根据页面的长度和复杂度，DOM 可能相当庞大。使用粗糙的选择器会降低性能并导致挫败感。\n\
  \njQuery 从右向左读取选择器，所以如果你有一个像这样的选择器：\n\n`$(\"div ul li a\");`\n\njQuery 会先收集所有锚点，然后判断它们是否在列表项内，再找出列表项是否包含在无序列表中，而该无序列表又包含在\
  \ `<div>` 中。\n\n呼！最好给这一组中的某个元素添加一个 class 或 id 属性，这样你就可以更直接地识别所涉及的一个或多个元素。例如，这一组中的锚点标签可能是导航元素，并赋予一个\
  \ `navigation` 类（`<a href=\"nav1.html\" class=\"navigation\">`）。这样你就可以将选择器缩短为 `$(\"\
  .navigation\")`。额外的好处是，该元素在 CSS 中也能更容易地被引用和设置样式！\n\n* * *\n\n提示\n\n感谢非常支持我们的 jQuery\
  \ 社区，本节中的技巧来自他们。你可以通过参与 jQuery 论坛（[`forum.jquery.com`](http://forum.jquery.com)）学到很多东西。论坛参与者总是乐于帮助你解决\
  \ jQuery 和 JavaScript 问题。\n\n* * *\n\n#### 快速完成 DOM 遍历\n\n有时，你可能需要升级一个由他人开发的、规划不佳的旧网站或应用程序。上一节中提到的选择器\
  \ `$(\"div ul li a\")` 可能需要反复使用才能达到你试图用 jQuery 实现的效果。如果是这样，你应该缓存该选择器，这样你只需要为该选择器遍历一次\
  \ DOM：\n\n```\nvar myNavLinks = $(\"div ul li a\"); // 执行遍历并\n\n![Image](img/ccc.jpg)\
  \ 存储它\n\n$(myNavLinks) // 新的选择器无需再次遍历\n\n![Image](img/ccc.jpg) DOM 树\n```\n\n当你想要操作数十甚至数百个表格行和单元格时，缓存就成了一种宝贵的性能工具。\n\
  \n#### 使用 Firebug 进行故障排除\n\nFirebug 几乎适用于所有浏览器，是调试和分析 JavaScript 的领先工具。它绝对应该出现在你的\
  \ Web 开发工具箱中。\n\nFirebug 允许你执行多项任务，包括“实时”观察代码，看看当事件在网页上触发时代码的行为。例如，在**图 1.4** 中，一个链接被点击了。如果你仔细看，可以看到几行\
  \ HTML 被黄色高亮显示。这些行就是受点击链接影响的 HTML 部分。\n\nFirebug 最方便的功能之一是能够准确识别 JavaScript（以及 jQuery）错误，让你能够快速排查和纠正问题。\n\
  \n我将在本书中多次使用 Firebug 的一些功能。要讨论和演示 Firebug 的所有功能，恐怕需要一整本书！\n\n* * *\n\n提示\n\nFirebug\
  \ 可从 [`getfirebug.com`](http://getfirebug.com) 免费下载。\n\n* * *\n\n图 1.4. 使用 Firebug，你可以检查\
  \ jQuery 的动作。\n\n![Image](img/01-04.jpg)\n\n#### 打包你的代码\n\n在编写代码时，使用大量空白和注释是有帮助的。但所有注释和空白都会占用空间，因此当你准备将代码投入生产环境时，最好将其打包。你可能已经注意到，官方\
  \ jQuery 网站以及插件开发者都提供了两个版本的脚本：普通版和压缩版。压缩版去掉了大部分空白和注释。这确保了你的网站能够更高效地交付。\n\n有多种工具可用于打包代码。我最喜欢的一个是\
  \ Google 提供的免费工具——Google Closure Compiler（[`code.google.com/closure/compiler`](http://code.google.com/closure/compiler)）。Google\
  \ 的 Closure Compiler 提供了一种快速压缩代码的方法，并具有一些额外优势，比如检查非法 JavaScript。\n\n为了好玩，让我们打包文件\
  \ `spritenav.js` 中的一些代码，你将在本书后面用到它。包含空白和注释的代码如下所示：\n\n```\n/*\n\n * 名称: SpriteNav(jQuery)\n\
