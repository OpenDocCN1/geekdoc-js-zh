  \ 对），这一点非常重要，因为 `getJSON` 将在请求中使用这些参数。向 Twitter 发送三个选项：你的 Twitter `screen_name`、要返回的推文数量\
  \ `count`，以及最重要的 `callback`。正是 `callback` 选项让 Twitter 知道你期望返回的数据是 JSONP。\n\n**3.**\
  \ 一旦 URL 形成，通过发送 URL 并定义 `getJSON` 的回调选项来打开 `getJSON` 请求方法：\n\n```\n           \
  \ $.getJSON(twitterURL, function(data){\n```\n\n* * *\n\n注意\n\n查询字符串的回调选项与 `getJSON`\
  \ 请求的回调不同。\n\n* * *\n\n**4.** 此时 JSONP 已从 Twitter 返回。设置一个循环遍历函数中包含的数据。将数据视为名为 `item`\
  \ 的数组的成员：\n\n```\n                $.each(data, function(i, item){\n```\n\n**5.**\
  \ 将推文包含在一个 *名称:值* 对中，*名称* 为 `text`。将此项目赋值给变量 `tweetText`：\n\n\n\n\n\n`var tweetText\
  \ = item.text;`\n\n**6.** 使用正则表达式定位推文中的 URL、@标签和井号(#)标签，以便对每个标签进行适当处理。首先查找 URL：\n\
  \n```\ntweetText = tweetText.replace\n![Image](img/ccc.jpg) (/http:\\/\\/\\S+/g,\
  \ '<a href=\"$&\"\n![Image](img/ccc.jpg) target=\"_blank\">$&</a>');\n```\n\n正则表达式\
  \ `/http:\\/\\/\\S+/g` 匹配以 `http://` 开头、以空格结尾的文本，这通常表示一个 URL。`/g`（全局）表示匹配 `tweetText`\
  \ 字符串中的所有 URL。通过将 URL 替换为包含 URL 作为 `href` 和链接文本的锚标签，将 URL 转换为链接。在 JavaScript 中，`$&`\
  \ 属性包含正则表达式最后匹配的项目。由于 URL 是最后匹配的项目，因此可以使用 `$&` 属性将其替换到锚标签中。\n\n**7.** Twitter 在用户名前加上\
  \ @ 符号。因此，搜索 `tweetText` 中以 @ 符号开头的单词：\n\n```\ntweetText = tweetText.replace(/(@)(\\\
  w+)/g,\n![Image](img/ccc.jpg) ' $1<a href=\"http://twitter.com/$2\"\n![Image](img/ccc.jpg)\
  \ target=\"_blank\">$2</a>');\n```\n\n这里，正则表达式 `/(@)(\\w+)/g` 表示所有以 @ 符号开头的单词都被替换为适当的锚标签，以便为用户推文打开浏览器窗口。`$1`\
  \ 和 `$2` 包含每个括号中匹配的信息，用于在替换文本中包含这些匹配项。\n\n**8.** 现在将注意力转向井号标签，并使用类似于替换 @ 符号的技术：\n\
  \n```\ntweetText = tweetText.replace(/(#)(\\w+)/g,\n![Image](img/ccc.jpg) ' $1<a\
  \ href=\"http://search.twitter.com/\n![Image](img/ccc.jpg) search?q=%23$2\" target=\"\
  _blank\">$2\n![Image](img/ccc.jpg) </a>');\n```\n\n**9.** 一旦 `tweetText` 被完全处理以插入所有锚标签，将其放入一个\
  \ `div` 中。然后将新的 `div` 追加到作为页面原始内容一部分而设置的现有 `div`（`id=\"tw\"`）中：\n\n```\n$(\"#tw\"\
  ).append('<div class=\"tweet\">\n![Image](img/ccc.jpg) '+tweetText+'</div>');\n\
  ```\n\n**10.** 关闭页面的 jQuery 函数和 HTML 标签：\n\n```\n});\n});\n});\n</script>\n</body>\n\
  </html>\n```\n\n图 4.13\\. Twitter 小部件检索你最近发布的几条推文。\n\n![Image](img/04-13.jpg)\n\n\
  **11.** 将页面上传到服务器，并在浏览器中加载页面。你应该会看到 **图 4.13** 中所示的结果。\n\n由于客户端和服务器之间（包括不受你控制的服务器）有大量数据来回传输，因此担心你和网站访问者在\
  \ AJAX 请求中发送的信息的安全性是很自然的。接下来我们来解决这些问题。\n\n### 保护 AJAX 请求\n\n网站和应用程序的一个棘手问题是，用户可能会无意或故意通过你的网站提交可能对数据库和服务器造成损害的数据。尽可能采取措施防止输入和传输错误或格式错误的数据非常重要。\n\
  \n其中一些步骤已经介绍过，包括使用正则表达式引导用户输入正确类型的数据，以及确保为每个网站访问者唯一设置 cookie。正如一位年长且更有智慧的导师对我说的：“用这种方式锁门只能阻止诚实的人翻越栅栏。”\n\
  \n即使表单字段中使用了正则表达式，你仍然无法阻止数据的传输，因为表单仍然可以提交。那么，你可以采取哪些措施来防止用户提交潜在有害的数据呢？\n\n- 通过“灰显”表单上的提交按钮来阻止表单提交，直到每个表单字段的所有正则表达式规则都满足为止。\n\
  - 使用 cookie 根据注册信息唯一标识用户（更准确地说，是用户的计算机），并在传输用户提供的数据期间对照数据库检查 cookie 数据。\n- 在后端处理过程中清理用户提供的数据，确保数据不包含有害的语句或字符。\n\
  - 通过安全连接（HTTPS [超文本传输协议安全]）传输数据，以防止外部人员“嗅探”进出 Web 浏览器的信息。\n\n* * *\n\n注意\n\n有关 HTTPS\
  \ 的更多信息，请访问电子前哨基金会的网站：[www.eff.org/https-everywhere](http://www.eff.org/https-everywhere)。\n\
  \n* * *\n\n这些技术应相互结合使用，为用户和网站所有者提供最安全的体验。让我们逐步了解其中一些技术。\n\n#### 阻止表单提交\n\n让我们回到摄影师交流网站，对包含注册表单的\
  \ HTML 文件以及支持该表单的 jQuery 脚本进行一些更改。\n\n**1.** 打开 `chap4/4-2.php`，找到脚本中包含 jQuery 脚本的部分。你会在\
  \ `head` 标签之间找到这些包含声明。\n\n**2.** 将以下高亮行更改为指向更新后的 `jqpe.js` 文件：\n\n```\n<script type=\"\
