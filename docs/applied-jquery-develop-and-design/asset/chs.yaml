  inc/jQuery/excanvas.min.js\"></script><![endif]-->\n```\n\n**11.** 对于柱状图以及图表轴上会使用文本的图表，你必须引用\
  \ `jqplot.barRenderer.min.js` 和 `jqplot.categoryAxisRenderer.min.js` 文件：\n\n```\n\
  <script type=\"text/javascript\"\n\n![Image](img/ccc.jpg) src=\"inc/jQuery/jqplot.barRenderer.min.js\"\
  ></script>\n\n<script type=\"text/javascript\"\n\n![Image](img/ccc.jpg) src=\"inc/jQuery/jqplot.categoryAxisRenderer.min.js\"\
  >\n\n![Image](img/ccc.jpg) </script>\n```\n\n**12.** 编写 jQuery 代码来显示图表。启用 jqPlot\
  \ 的附加组件：\n\n```\n$.jqplot.config.enablePlugins = true;\n```\n\n**13.** 从 PHP 函数中获取数据，并将其插入\
  \ JavaScript 变量 `line1` 中：\n\n```\nline1 = [<?php echo $ra; ?>];\n```\n\n**14.**\
  \ 调用 `jqplot` 函数。将该函数绑定到显示图表的元素上，并提供变量 `line1` 中包含的数据：\n\n```\n$.jqplot('requestChart',\
  \ [line1], {\n```\n\n图 5.15\\. 边距为零会导致每个柱形填满可用空间，可能使图表难以阅读。\n\n![Image](img/05-15.jpg)\n\
  \n**15.** 将 `$.jqplot.BarRenderer` 附加组件声明为 `seriesDefaults` 选项的一部分。这样做是为了显示柱状图：\n\
  \n```\n            seriesDefaults: {\n\n                renderer: $.jqplot.BarRenderer,\n\
  ```\n\n现在 jqPlot 知道了将使用的图表渲染器附加组件。\n\n**16.** 设置渲染器的选项：`barDirection` 为水平方向，`barMargin`\
  \ 为 10：\n\n```\n                    rendererOptions: {\n\n                       \
  \ barDirection: 'horizontal',\n\n                        barMargin: 5\n\n                   \
  \ }\n\n                },\n```\n\n`barMargin` 选项设置柱形之间的间距。**图 5.15** 显示了边距为零的柱形；重叠效果不佳。\n\
  \n接下来，你将设置图表每个轴的详细信息，从 y 轴开始。y 轴将显示月份名称。\n\n**17.** 设置 y 轴的渲染器：\n\n```\n               \
  \ axes: {\n\n                    yaxis: {\n\n                        renderer: $.jqplot.CategoryAxisRenderer,\n\
  ```\n\n**18.** 提供 `ticks` 选项的信息，在本例中是月份的名称：\n\n```\n                        ticks:\
  \ '一月', '二月', '三月',\n\n                        ![Image '四月', '五月', '六月', '七月',                       \
  \ ![Image](img/ccc.jpg) '八月', '九月', '十月',\n\n                        ![Image](img/ccc.jpg)\
  \ '十一月', '十二月']\n\n                    },\n```\n\n图 5.16\\. 每个刻度递增 10，图表 x 轴最大值为\
  \ 100。\n\n![Image](img/05-16.jpg)\n\n**19.** 提供图表 x 轴的信息。旅馆老板认为他每月通过网站会收到大约 100\
  \ 个请求。将 x 轴配置为从最小 0 个请求开始，最大 100 个请求：\n\n\n\n`xaxis: {min: 0, max: 100, numberTicks:11}`\n\
  \n**20.** 在 x 轴上指定 11 个刻度，以显示十个均匀分布的柱形（**图 5.16**）。\n\n如果你需要创建复杂的仪表板——显示各种类型的图表和图形——来报告企业中的各项指标，并且希望高效地完成，那么你无需再寻找其他工具，jqPlot\
  \ jQuery 插件就是最佳选择。凭借其丰富的图表类型和众多可用选项，你一定能找到展示数据的完美元素。\n\n有数百个非常实用的插件可用于你的网站和 Web\
  \ 应用程序。然而，还有另一类 jQuery 插件，它们可能不那么实用，但用起来很有趣。接下来我们看看其中一些。\n\n#### 让你的网站更炫酷\n\n对于某些\
  \ jQuery 插件而言，实用与酷炫之间的界限很模糊。在互联网上搜索，你会发现许多处于技术前沿的 jQuery 插件。这类插件可能提供先进的动画技术，但并非在所有浏览器上都能正常工作，或者进行密集的数据操作，导致浏览器运行不畅。其中一些高级插件并不适合日常使用，而且许多前沿插件仍处于实验阶段，稳定性较差。\n\
  \n本节中你将使用的插件都是一流的，质量足够高，可以日复一日地用于你的网站。与大多数 jQuery 插件一样，它们很容易集成到你的设计中。\n\n首先介绍一种向旅馆网站访客提供天气信息的方法。\n\
  \n图 5.17\\. 旅馆当前的天气状况。\n\n![Image](img/05-17.jpg)\n\n##### 预测天气\n\nzWeatherFeed\
  \ jQuery 插件（[www.zazar.net/developers/zweatherfeed](http://www.zazar.net/developers/zweatherfeed)）可以非常轻松地将\
  \ Yahoo 的天气信息包含到你的网站中（**图 5.17**）。让我们将 zWeatherFeed jQuery 插件添加到旅馆网站中。\n\n**1.**\
  \ 打开 `chap5/5-7.php` 并将其另存为 `chap5/5-10.php`。在 `chap5/5-10.php` 的 head 部分包含对 zWeatherFeed\
  \ CSS 和 jQuery 脚本的引用（高亮部分）：\n\n```\n<link type=\"text/css\" rel=\"stylesheet\" href=\"\
  css/lamf.css\" />\n<link type=\"text/css\" rel=\"stylesheet\"\n![Image](img/ccc.jpg)\
  \ href=\"css/ui/jquery-ui-1.8.12.custom.css\" />\n<link type=\"text/css\" rel=\"\
  stylesheet\"\n![Image](img/ccc.jpg) href=\"css/tinyTips/tinyTips.css\" />\n<link\
  \ type=\"text/css\" rel=\"stylesheet\"\n![Image](img/ccc.jpg) href=\"css/weatherfeed/jquery.zweatherfeed.css\"\
  \ />\n<script type=\"text/javascript\" src=\"inc/jQuery/jquery\n![Image](img/ccc.jpg)\
  \ -1.5.min.js\"></script>\n<script type=\"text/javascript\" src=\"inc/jQuery/jquery-ui\n\
  ![Image](img/ccc.jpg) -1.8.12.custom.min.js\"></script>\n<script type=\"text/javascript\"\
  \n![Image](img/ccc.jpg) src=\"inc/jQuery/attractions.js\"></script>\n<script type=\"\
  text/javascript\"\n![Image](img/ccc.jpg) src=\"inc/jQuery/jquery.tinyTips.js\"></script>\n\
  <script type=\"text/javascript\"\n![Image](img/ccc.jpg) src=\"inc/jQuery/jquery.zweatherfeed.min.js\"\
  ></script>\n```\n\n**2.** 在 jQuery 代码的文档就绪函数部分包含以下 jQuery 脚本：\n\n```\n$('#weather').weatherfeed(\n\
  \    ['USTX0207'],\n    {unit: 'f'}\n);\n```\n\n该代码将 `weatherfeed` 方法绑定到一个 `id`\
  \ 为 `weather` 的元素上，例如 `<div id=\"weather\"></div>`。这里包含的 `weatherfeed` 方法选项包括 RSS（简易信息聚合）位置代码以及你希望使用的度量单位，此处为华氏度。\n\
  \n要获取 RSS 位置代码，请访问 [`weather.yahoo.com`](http://weather.yahoo.com) 并输入位置信息。如 **图\
  \ 5.18** 所示，将鼠标悬停在 RSS 图标上，即可在浏览器状态栏中看到 URL。你可以在该 URL 中找到位置代码，然后将其放入你的 jQuery `weatherfeed`\
  \ 函数中。\n\n* * *\n\n注意\n\n请务必阅读并理解 Yahoo 关于天气信息的使用条款。\n\n* * *\n\n图 5.18\\. 查找 RSS\
  \ 位置代码。\n\n![Image](img/05-18.jpg)\n\n由于你正在向网站访客提供更多关于旅馆的信息，很可能你还想展示一些旅馆及周边地区的照片。一种有趣的方式是使用一个插件，让访客能够放大并更仔细地查看照片细节。\n\
  \n##### 放大查看图片\n\n许多购物和摄影网站上流行一种效果，允许用户将鼠标悬停在图片上并放大查看。Raff Cecco 的 Cloud Zoom 插件（可在\
  \ [www.professorcloud.com/mainsite/cloud-zoom.htm](http://www.professorcloud.com/mainsite/cloud-zoom.htm)\
  \ 获取）是用 jQuery 实现这一效果的完美工具。\n\n**1.** 打开 `chap5/5-0.php` 并将其另存为 `chap5/5-11.php`。\n\
  \n**2.** 在 HTML 文件的 `head` 部分包含对 Cloud Zoom CSS 文件和 jQuery 文件的引用（高亮部分）：\n\n```\n\
  <link rel=\"stylesheet\" href=\"css/primary.css\" type=\"text/css\" />\n<link rel=\"\
  stylesheet\" href=\"css/cloudZoom/cloud-zoom.css\"\n![Image](img/ccc.jpg) type=\"\
  text/css\" />\n<script type=\"text/javascript\" src=\"inc/jQuery/jquery\n![Image](img/ccc.jpg)\
  \ -1.5.min.js\"></script>\n<script type=\"text/javascript\" src=\"inc/jQuery/cloud\n\
  ![Image](img/ccc.jpg) -zoom.1.0.2.min.js\"></script>\n```\n\n**3.** 设置一个容器来放置照片：\n\
  \n```\n<div class=\"bigPhoto\">\n```\n\n**4.** 添加引用大图和小图的锚点标签和图片标签：\n\n```\n<a href='images/lodge_hummingbirds.jpg'\
  \ class='cloud-zoom'\n![Image](img/ccc.jpg) id='zoom1' rel=\"position: 'inside',\
  \ smoothMove: 4,\n![Image](img/ccc.jpg) adjustX: -1, adjustY:-4\">\n    <img src=\"\
  images/lodge_hummingbirds_small.jpg\" alt=''\n    ![Image](img/ccc.jpg) title=\"\
  Hummingbirds at the Lodge\" border=\"0\" />\n</a>\n```\n\n这个插件的一个巧妙之处在于，你无需在页面中添加任何\
  \ jQuery 代码。Cloud Zoom 插件的所有选项（高亮部分）都在锚点标签的 `rel` 属性中指定。\n\n**5.** 关闭放置照片的容器：\n\n\
  ```\n</div>\n```\n\n**6.** 通过向 `chap5/css/lamf.css` 添加 CSS 规则来居中照片容器：\n\n```\n.bigPhoto\
  \ {\n    position: relative;\n    width: 800px;\n    margin: auto;\n}\n```\n\n图\
  \ 5.19\\. 大图被调用到原始图片所在的空间中。移动光标可以让用户更仔细地查看图片的各个部分。\n\n![Image](img/05-19.jpg)\n\n\
  缩放效果（**图 5.19**）是通过使用两张图片副本实现的：一张正常显示的小图和一张由 Cloud Zoom 插件调用的大图。大图（此处为 `images/lodge_hummingbirds.jpg`）在锚点标签中引用，而缩略图（`images/lodge_hummingbirds_small.jpg`）则包含在图片标签中。\n\
  \n为此 Cloud Zoom 实例指定的选项包括 `position: 'inside'`，它告诉 Cloud Zoom 插件在缩略图内部显示放大的图像。选项\
  \ `smoothMove: 4` 设置了一种光标缓动方法，使放大图片的移动具有流畅效果。选项 `adjustX: -1` 和 `adjustY:-4` 用于微调放大图像相对于缩略图的位置。\n\
  \njQuery Cloud Zoom 插件还有许多其他选项，当你在网站中使用该插件时，这些选项将为你提供极大的创作灵活性。\n\n在网站和应用程序中处理图像的另一种方法是添加一个随浏览器大小调整的背景图像。接下来我们看看这个。\n\
  \n图 5.20\\. 一个渐变填充的背景图像，非常适合作为网站或应用程序的底层。\n\n![Image](img/05-20.jpg)\n\n\n\n\n\n\
  ##### 使用浏览器调整背景图片大小\n\n多年来，网页设计师和开发者一直在寻找改善网站背景显示效果的方法。缩放背景图片一直是个难题，尤其是当你预见到浏览器窗口大小可能会改变时。jQuery\
  \ Easy Background Resize 插件解决了这个问题。事实上，你会发现你会想方设法在所有网站和应用中使用背景图片。\n\n背景调整插件结合你的一张图片，可以为你的网站和应用带来微妙（如\
  \ **图 5.20** 中的渐变背景）或强烈的视觉效果。它无疑是你能添加到网站中最巧妙的插件之一。\n\n该插件由 J.P. Given 开发，jQuery\
  \ Easy Background Resize（可在 [`johnpatrickgiven.com/jquery/background-resize`](http://johnpatrickgiven.com/jquery/background-resize)\
  \ 获取）允许你在网站上放置背景图片，并使该背景图片随浏览器一起调整大小。\n\n让我们将这个插件添加到旅馆网站中。\n\n**1.** 打开 `chap5/5-10.php`\
  \ 并将其另存为 `chap5/5-13.php`。\n\n图 5.21. 渐变背景已应用于网站主体。当浏览器调整大小时，渐变会按需扩展和收缩。\n\n![Image](img/05-21.jpg)\n\
  \n**2.** 在 HTML 文件的 head 部分插入包含该插件的代码行：\n\n```\n<script type=\"text/javascript\"\
  \ src=\"inc/jQuery/jquery.ez-bg-resize.js\"></script>\n```\n\n**3.** 将 `ezBgResize`\
  \ 方法绑定到 HTML 的 `body` 标签，并指定要用作背景的图片路径：\n\n```\n$(\"body\").ezBgResize({\n    img\
  \ : \"grfx/lodge_gradient_background.jpg\"\n});\n```\n\n**4.** 将页面加载到浏览器中（**图 5.21**）并调整大小以查看效果。就这么简单！\n\
  \n图 5.22. 使用蜂鸟图片作为背景的旅馆网站视图。这展示了在图片之上叠加其他图形和网页元素是多么容易。\n\n![Image](img/05-22.jpg)\n\
  \n一旦你看到 jQuery Easy Resize 插件的实际效果，你无疑会想出许多创造性的方法将其应用到你的网站和应用中。例如，**图 5.22** 显示渐变背景已被之前使用的蜂鸟图片所取代。\n\
  \n现在你已经让背景变得更加生动，你可以在前景中添加一个小插件来吸引眼球。\n\n图 5.23. 页面卷角效果。\n\n![Image](img/05-23.jpg)\n\
  \n##### 与一个好网站一起“卷”起来\n\n当前旅馆网站的设计并不够新潮。旅馆老板希望在不影响现有网站的情况下，让访问者知道新网站设计即将推出。\n\n\
  本质上，你将“翻页”到一个新网站。一个支持翻页概念的 jQuery 插件（**图 5.23**）是 jQuery Sexy Curls 插件。卷页“背后”显示的信息是对即将到来的新网站的预览。\n\
  \nElliot Kember 的 Sexy Curls jQuery 插件（可在 [`elliottkember.com/sexy_curls.html`](http://elliottkember.com/sexy_curls.html)\
  \ 获取）是创建页面卷角效果的理想插件。现在让我们将其包含到网站中。\n\n**1.** 创建 `chap5/5-13.php` 的副本并另存为 `chap5/5-14.php`。确保所需的\
  \ CSS 和 jQuery 文件已包含在 `chap5/5-14.php` 的 head 部分：\n\n```\n<link type=\"text/css\"\
  \ rel=\"stylesheet\" href=\"css/lamf.css\" />\n<link type=\"text/css\" rel=\"stylesheet\"\
  \ href=\"css/ui/jquery-ui-1.8.12.custom.css\" />\n<link type=\"text/css\" rel=\"\
  stylesheet\" href=\"css/tinyTips/tinyTips.css\" />\n<link type=\"text/css\" rel=\"\
  stylesheet\" href=\"css/turn/turn.css\" />\n<link type=\"text/css\" rel=\"stylesheet\"\
  \ href=\"css/weatherfeed/jquery.zweatherfeed.css\" />\n<script type=\"text/javascript\"\
  \ src=\"inc/jQuery/jquery-1.5.min.js\"></script>\n<script type=\"text/javascript\"\
  \ src=\"inc/jQuery/jquery-ui-1.8.12.custom.min.js\"></script>\n<script type=\"text/javascript\"\
  \ src=\"inc/jQuery/attractions.js\"></script>\n<script type=\"text/javascript\"\
  \ src=\"inc/jQuery/jquery.tinyTips.js\"></script>\n<script type=\"text/javascript\"\
  \ src=\"inc/jQuery/turn.js\"></script>\n<script type=\"text/javascript\" src=\"\
  inc/jQuery/jquery.zweatherfeed.min.js\"></script>\n```\n\n页面卷角图片存储在 `turn.css` 文件所在的同一文件夹中，即\
  \ `chap5/css/turn`。\n\n**2.** 在结束 body 标签之前添加包含“隐藏”信息的图片标签：\n\n```\n<img id=\"foldGraphic\"\
  \ src=\"grfx/lodge_new.jpg\">\n```\n\n**3.** 在文档就绪包装器中添加 jQuery 代码，将 `fold` 方法绑定到将显示在页面卷角后面的元素：\n\
  \n```\n$('#foldGraphic').fold();\n```\n\n在这个例子中，绑定到 `fold` 方法的元素是一张图片。\n\njQuery\
  \ Sexy Curls 插件是我遇到的少数几个需要开发者打开插件（位于 `chap5/inc/jQuery/turn.js` 文件夹中）来设置选项的插件之一。\n\
  \n**4.** 打开插件，找到以注释 `//default awesomeness.` 开头的代码部分（Kember 先生很有幽默感！）。接下来的几行是你可以为插件设置的选项。在这个例子中，设置的选项包括用于翻页的图片位置、起始和最大尺寸：\n\
  \n```\nturnImage: 'css/turn/fold.png', // 三角形翻页图片\nmaxHeight: 450, // 最大高度。显而易见。\n\
  startingWidth: 40, // 起始宽度和高度\nstartingHeight: 40, // （这些应该用驼峰命名法，哎呀。）\n```\n\n\
  此外，`autoCurl` 函数被设置为 `true`，这样当你鼠标悬停在小卷角图片上时，效果就会运行：\n\n```\nautoCurl: true // 如果设置为\
  \ true，则鼠标悬停/移出时卷角会卷起/展开。\n```\n\n**5.** 将页面加载到你的 Web 浏览器中，测试卷角效果。\n\n现在你已经安装并配置了许多插件，你可能想尝试开发自己的插件。在下一节中，我将向你展示如何布局基础知识，以便你可以制作自己的\
  \ jQuery 插件。\n\n### 打造你自己的插件\n\n创建自己的插件可以非常有成就感，而且并不难。让我们编写一个非常基础的插件，并将其应用到旅馆网站中。\n\
  \n**1.** 创建一个名为 `jquery.colorText.js` 的文件，并将其保存在 `chap5/inc/jQuery` 文件夹中。通过声明一个函数来开始编写插件：\n\
