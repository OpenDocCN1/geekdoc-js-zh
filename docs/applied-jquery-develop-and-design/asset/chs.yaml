  \ jQuery UI 小部件一样，`Datepicker` 提供了大量用于自定义小部件的选项，包括动画、一次显示多个月份的能力，以及通过选择适当的语言将日历本地化到特定区域的功能。\n\
  \n将 `Datepicker` 添加到表单并配置好你想要的选项后，你可以使用 AJAX 提交表单。接下来我们设置这一点，并使用 jQuery UI 的 `Dialog`\
  \ 小部件让网站访问者有机会确认他们的提交。\n\n### 与访客建立“对话框”\n\n你可以与网站或应用程序的用户建立的交互部分以对话框的形式提供。你可以使用对话框来通知或警告用户。你也可以使用它们来收集用户的额外信息，即使这些信息只是简单的表单提交确认。\n\
  \njQuery UI 的 `Dialog` 小部件非常灵活，并提供了许多自定义选项。让我们设置一个对话框来确认预订请求的提交。即使是一个简单的对话框，也需要几个部分：包括\
  \ HTML、PHP 和 jQuery。为了提供交互，你将依次设置每个部分，首先从 HTML 开始。\n\n**1.** 打开 `chap5/5-2.php`\
  \ 并将其另存为 `chap5/5-3.php`。\n\n**2.** 在 HTML 的结束 body 标签之前，添加以下标记行以建立对话框的标记：\n\n```html\n\
  <div id=\"dialog\" title=\"验证提交\">\n\n    <p>您确定要查询这些日期吗？</p>\n\n</div>\n```\n\n\
  由于这是一个简单的确认对话框，HTML 非常简单。`div` 标签中的 `title` 属性将用作对话框的标题，而 `div` 的内容将用于对话框的主体。\n\n\
  **3.** 在你的数据库包上运行 SQL 文件 `chap5/sql/lodge.sql`（可在代码下载中找到），以设置数据库并创建用于保存预订请求的表。\n\
  \n现在 HTML 标记已完成，数据库表也已建立，你可以将注意力转向创建用于处理预订查询的 PHP 代码。\n\n**4.** 创建 `chap5/inc/reserve.php`\
  \ 并设置与数据库的连接。确保使用正确的用户名和密码进行数据库连接：\n\n```php\nif(!$dbc = mysql_connect('localhost',\
  \ 'username', 'password')){\n\n    echo '连接数据库时出错('.mysql_errno().')：\n\n    ![Image](img/ccc.jpg)\
  \ '.mysql_error() . \"\\n\";\n\n    exit();\n\n}\n```\n\n\n\n\n\n5. 为进程添加一个 `sleep`\
