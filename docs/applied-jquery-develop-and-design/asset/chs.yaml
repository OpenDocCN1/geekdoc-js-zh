  </div>');`\n\n**9.** 将分配给类 `photoHolder` 的每个元素的 CSS `display` 属性设置为 `none`。这是为了确保每个新添加的元素对网站访问者不可见：\n\
  \n```\n$('.photoHolder').css('display','none');\n```\n\n**10.** 为新的 `$('<img/>')`\
  \ 提供其源信息：\n\n```\n}).attr('src', photoSrc);\n```\n\n当 `each` 函数遍历无序图片列表时，每个全尺寸图片将被放置到其对应的元素中，并对用户隐藏。\n\
