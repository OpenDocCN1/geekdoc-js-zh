  \n你会发现，在许多情况下，动态加载和运行脚本可以增强你的网站和应用程序。\n\n接下来，你将把注意力转向 jQuery 的许多 AJAX 扩展功能，并学习如何实际应用它们。\n\
  \n##### 使用 jQuery 的 AJAX 扩展功能\n\n除了简写方法之外，jQuery 还提供了许多有用的方法和辅助工具，让你能够高效地使用 AJAX。这些方法从底层接口到全局事件处理程序，只要应用得当，都能让你的程序和网站更高效。\n\
  \n让我们从底层接口开始，看看这些扩展功能。\n\n###### 使用底层接口\n\njQuery 的底层 AJAX 接口提供了最详细的 AJAX 函数实现方式。这种详细程度使得底层接口非常灵活，但由于所有可用的选项，也增加了额外的复杂性。\n\
  \n应对大量选项带来的复杂性的一种方法是使用一个方法来设置不经常更改的选项。看看最简单的底层接口 `ajaxSetup`：\n\n```\n$.ajaxSetup({\n\
  \    url: ajaxProcessing.php,\n    type: 'POST'\n});\n```\n\n`ajaxSetup` 方法允许你提供将用于每个\
  \ AJAX 请求的选项。你可以使用 `ajaxSetup` 设置所有可用的 AJAX 选项（超过 25 个！）。如果你需要重复向同一个 URL 发送 AJAX\
  \ 请求，或者每次请求都使用相同的密码，这会非常方便。在许多情况下，开发者会将所有服务器端 AJAX 处理程序放在服务器上的同一个文件中。使用 `ajaxSetup`\
  \ 可以缩短他们的 AJAX 调用，包括简写方法。根据当前的 `ajaxSetup` 示例，你的 `post` 方法可以这样配置：\n\n```\n$.post({\
  \ data: formData });\n```\n\n你只需要向 `post` 函数提供要由 `ajaxProcessing.php` 处理的数据。使用 `ajaxSetup`\
  \ 方法的一个优点是，你可以在单个 AJAX 调用中覆盖任何 `ajaxSetup` 选项。\n\n你最常见到的底层接口是直接的 `ajax` 方法。它是简写方法所包装的函数，也是所有\
  \ jQuery AJAX 调用的核心。`ajax` 方法能够接受所有可用于 jQuery AJAX 请求的选项。理解底层 AJAX 方法的最佳方式可能是将其与你之前使用的某个简写方法进行比较。下面是你用来检查用户名是否可用的\
  \ `post` 方法：\n\n```\n$.post('inc/peRegister.php', {\n    formName: 'register',\n\
  \    penewuser: newName\n}, function(data){\n    var usernameCount = data;\n   \
  \ if(1 == usernameCount){\n        $('#penewuser').next('.error').css('display',\
  \ 'inline');\n    } else {\n        $('#penewuser').next('.error').css('display',\
  \ 'none');\n    }\n}, 'html');\n```\n\n下面是使用 jQuery 底层 `ajax` 方法的相同请求：\n\n```\n\
  $.ajax({\n    type: 'POST',\n    url: 'inc/peRegister.php',\n    data: 'formName=register&penewuser='+newName+'',\n\
  \    success: function(data){\n        var usernameCount = data;\n        if(1 ==\
  \ usernameCount){\n            $('#penewuser').next('.error').css('display', 'inline');\n\
  \        } else {\n            $('#penewuser').next('.error').css('display', 'none');\n\
  \        }\n    },\n    dataType: 'html'\n});\n```\n\n差异相当明显，例如声明 AJAX 应该使用的方法将信息传递给服务器（`type:\
  \ 'POST'`），指定原始数据的格式（`data: 'formName=register&penewuser= '+newName+'`），以及确保成功方法被隐式定义（`success:\
  \ function(data){...`）。\n\n浏览 jQuery 的 `ajax` API 文档 [`api.jquery.com/jQuery.ajax`](http://api.jquery.com/jQuery.ajax)，查看所有可用于此方法的选项。\n\
  \n既然你可以向服务器发送信息并从服务器端进程接收信息，那么你需要确保用户知道正在发生 AJAX 操作。jQuery 提供了几个辅助函数，让你可以轻松做到这一点。\n\
  \n###### 在 AJAX 调用前后触发事件\n\n在许多情况下，你的 jQuery AJAX 函数会执行得非常快，以至于用户可能甚至不知道他们的操作已经达到了预期效果。在其他情况下，AJAX\
  \ 过程可能很长，需要用户等待结果。jQuery 提供了四种方法让你可以随时通知用户：`ajaxStart`、`ajaxSend`、`ajaxComplete`\
  \ 和 `ajaxStop`。\n\n理解这四个函数的顺序很重要。在任何给定事件中，你可以调用任意数量的 AJAX 进程。因此，你可能不仅想知道第一个 AJAX\
  \ 函数何时开始，还想知道每个后续 AJAX 方法何时被调用和完成。然后你可能需要记录所有 AJAX 调用都已完成。如果你将 jQuery AJAX 事件想象成\
  \ **图 4.9** 中的项目堆栈，你就会看到 jQuery AJAX 引擎如何定义事件及其调用的顺序。\n\n图 4.9 初始的 jQuery 事件由开发者堆叠起来，然后由\
  \ jQuery 的 AJAX 引擎排序和处理。\n\n![Image](img/04-09.jpg)\n\n\n\n\n让我们仔细看看如何通过在使用 DVD\
  \ 收藏目录进行数据和文件提交事件时为用户提供视觉提示，来使用 `ajaxStart` 和 `ajaxStop` 方法。\n\n**1.** 打开 `chap4/4-6.php`。\n\
  \n在 `4-6.php` 中，你会看到一个表单（下一页的**图 4.10**），该表单接受用户输入并提供上传文件的方法。这种组合并不罕见，但需要你在编写 PHP\
  \ 和 jQuery 处理数据传输和文件上传时格外小心。\n\n图 4.10\\. 用户填写以将电影添加到个人数据库的表单。\n\n![Image](img/04-10.jpg)\n\
