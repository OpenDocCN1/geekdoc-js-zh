  \    $(\"#contentArea2\").height(windowHeight - 205 + \"px\");\n```\n\n确保内部容器 `contentArea1`\
  \ 和 `contentArea2` 的总高度设置正确，使其保持在外部容器内部，方法是从内部容器的高度中再减去 30 像素。\n\n接下来，你将创建一个 jQuery\
  \ `resize` 函数，以确保当浏览器窗口大小改变时，内容区域能够随之调整大小。用于在浏览器打开时设置内容容器大小的相同函数，也会在调整大小事件中使用。\n\
  \n4. 将浏览器窗口绑定到 jQuery 的 `resize` 函数：\n\n```\n    $(window).resize(function() {\n\
