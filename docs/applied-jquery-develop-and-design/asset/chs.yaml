  \n![Image](img/05-09.jpg)\n\n9. 使用 JavaScript 的 `split` 方法将 `selectedAttraction`\
  \ 变量拆分为数组。数组的第一个单词 `arrayAttractName` 用于标识 `chap5/inc/attractionInfo.php` 中将要检索的元素：\n\
