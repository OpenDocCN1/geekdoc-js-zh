  ></script>\n<script type=\"text/javascript\"\n![Image](img/ccc.jpg) src=\"inc/carousel.js\"\
  ></script>\n<script type=\"text/javascript\"\n![Image](img/ccc.jpg) src=\"inc/jqpe.js\"\
