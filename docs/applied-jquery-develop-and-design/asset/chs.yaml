  \ 3.9**显示了通过该过程创建的缩略图，以及它与原图相比如何保持比例。\n\n让我们深入探讨并在`chap3/inc/photoUpload.php`中创建\
  \ PHP 函数，该函数将从你的图片生成缩略图。\n\n1. 首先声明函数及其参数：\n\n    ```\n    function createThumbnail($name,\
  \ $filename, $newWidth, $newHeight){\n    ```\n\n2. 通过*拆分*变量将图片名称放入数组。使用示例中的图片名称*cameras.jpg*，用`explode`方法创建一个包含两个条目`cameras`和`jpg`的数组（`$arrPhotoName`）。使用下一行将`jpg`放入变量`$fileExtPosition`：\n\
  \n    ```\n    $arrPhotoName = explode('.',$name);\n    $fileExtPosition = count($arrPhotoName)\
  \ - 1;\n    ```\n\n    PHP 的`explode`方法接受两个参数：分隔符和要*拆分*的项目。此处的分隔符是句点。\n\n3. 根据图片类型（基于文件扩展名），调用相应的\
  \ PHP 函数以正确格式创建工作图像。将使用此工作图像代替原始图像。使用图像的副本有助于确保不会破坏或损坏原始图像：\n\n    ```\n    if (preg_match('/(jpg|jpeg)/i',\n\
  \    ![Image](img/ccc.jpg) $arrPhotoName[$fileExtPosition])){\n        $workingImg\
  \ = imagecreatefromjpeg($name);\n    } elseif (preg_match('/(png)/i',\n    ![Image](img/ccc.jpg)\
  \ $arrPhotoName[$fileExtPosition])){\n        $workingImg = imagecreatefrompng($name);\n\
  \    }\n    ```\n\n    注意再次使用了正则表达式。你现在应该已经习惯它们了。\n\n* * *\n\n> **提示**\n> \n> 此函数中用于操作图像的\
  \ PHP 函数由 GD 库提供，这只是 PHP 可用的图像操作库之一。如果你想使用此处使用的图像操作函数，请确保你的 PHP 版本已编译 GD 库。\n\n\
  * * *\n\n4. 现在可以开始这个函数真正有趣的部分了。首先需要获取工作图像的宽度和高度。以下计算将确定缩略图的新高度和宽度：\n\n    ```\n\
  \    $oldX = imagesx($workingImg); // 宽度\n    $oldY = imagesy($workingImg); // 高度\n\
  \    ```\n\n5. 如果工作图像的宽度大于高度，则将宽度设置为 160 像素，并计算使高度成比例的像素数：\n\n    ```\n    if ($oldX\
  \ > $oldY) {\n        $thumbW = $newWidth;\n        $thumbH = ($oldY * $newWidth)\
  \ / $oldX;\n    }\n    ```\n\n6. 如果工作图像的高度大于宽度，则将缩略图的高度设置为 128 像素，并计算使宽度成比例的像素数：\n\
  \n    ```\n    if ($oldX < $oldY) {\n        $thumbW = ($oldX * $newHeight) / $oldY;\n\
  \        $thumbH = $newHeight;\n    }\n    ```\n\n7. 对于正方形图像，可以将高度和宽度设置为轮播中使用的最大高度：\n\
  \n    ```\n    if($oldX == $oldY) {\n        $thumbW = $newHeight;\n        $thumbH\
  \ = $newHeight;\n    }\n    ```\n\n8. 使用 PHP 的`ImageCreateTrueColor`函数，并将新确定的缩略图宽度和高度传递给它：\n\
  \n    ```\n    $newThumbnail = ImageCreateTrueColor($thumbW,$thumbH);\n    ```\n\
  \n    缩略图现已创建。\n\n* * *\n\n> **注意**\n> \n> 缩略图创建函数是为简单起见而设计的。该函数对于通常在轮播最大尺寸范围内的图片效果良好。当图片宽度和高度值接近但尚未成为正方形时，这些简单的算法将无法使缩略图保持在轮播设计的最大高度和宽度范围内。解决方法是查看计算出的缩略图高度和宽度，如果任一测量值超出范围，则再次调整高度或宽度。\n\
  \n* * *\n\n9. 重新采样图像以保持缩略图质量；你将使用 PHP 的`imagecopyresampled`来实现。你需要为此函数提供多个参数才能使其正常工作：\n\
