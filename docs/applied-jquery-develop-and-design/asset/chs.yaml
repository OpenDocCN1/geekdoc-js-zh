  \n#### 使用 RETURN FALSE\n\n任何做过 JavaScript 编程（包括使用 jQuery 编程）的人，都遇到过`return false;`。大多数情况下，很多人都用错了。让我们看一个例子，一个\
  \ HTML 锚标签链接：\n\n```\n<div><a href=\"inc/content.html\">点击这里！</a></div>\n```\n\n\
  通常，你可能会应用类似下面的 jQuery 代码来处理锚标签：\n\n```\n$(\"div a\").click(function() {\n\n    var\
  \ link = $(this).attr(\"href\");\n\n    $(\"#content\").load(link);\n\n    return\
  \ false;\n\n});\n```\n\n在这个例子中，你希望能够点击链接，但链接不执行其正常行为；你只想让链接中的内容加载到`id`为`content`的元素中。于是，你在函数中插入了`return\
  \ false;`。它起作用了！但你真的知道它是如何工作的吗？\n\n因为`return false`工作得很好，你可能没有意识到它以后会给你带来麻烦。`return\
  \ false`函数首先调用`preventDefault();`，然后调用`stopPropogation()`。`stopPropogation()`函数会阻止*click*事件在\
  \ DOM 中冒泡，这可能会阻止你以后添加的祖先元素上的后续*click*事件。当你看似完美的代码无法按你的要求执行，且没有任何错误提示时，你会感到非常困惑。\n\
  \n大多数情况下，你应该使用的是`preventDefault()`，如下面高亮显示的代码所示：\n\n```\n$(\"div a\").click(function(e)\
  \ {\n\n    var link = $(this).attr(\"href\");\n\n    $(\"#content\").load(link);\n\
  \n    e.preventDefault();\n\n});\n```\n\n花几分钟时间熟悉其他相关函数`stopPropogation()`和`stopImmediatePropogation()`，因为你可能会发现它们非常有用且能揭示问题！\n\
  \n#### 摆弄 jQuery 代码\n\n多年来我见过的最有用、最酷的工具之一是一个名为 jsFiddle 的 Web 应用程序（[`jsFiddle.net`](http://jsFiddle.net)）。由\
  \ Piotr Zalewa 开发，作为“Web 开发者的游乐场”，jsFiddle 是一个很棒的网站，你可以在其中结合 HTML 和 CSS，并用 jQuery\
  \ 对代码进行实验（**图 1.6**）。该工具支持多个不同版本的 jQuery，是一个极好的故障排除工具。\n\n使用 jsFiddle 网站是与其它开发者分享代码进行讨论、故障排除或炫耀的好方法。该网站还允许你在实验中包含最新的\
  \ jQuery UI（用户界面）代码。\n\n图 1.6 使用 jsFiddle，你可以测试 jQuery 代码片段。\n\n![图片](img/01-06.jpg)\n\
  \n### 将 jQuery 与其他代码结合\n\n在本书中，你将使用多种技术来让你的 Web 应用程序生动起来。首先，你将使用 HTML、CSS 和 JavaScript，然后混合使用\
  \ PHP 和 MySQL 来支持进一步的交互。\n\n#### 从 HTML 开始\n\nHTML 是你用来启动所有网页的基础。最新版本的 HTML（HTML5）的使用正在增加，本书中的示例在适当的地方使用了它。由于\
  \ HTML5 仍在开发中，浏览器支持有限。我建议在使用 HTML5 时进行大量的跨浏览器测试。\n\njQuery 可以轻松选择 HTML DOM 元素。例如，如果你有一个表单输入元素：\n\
  \n```\n<input name=\"username\" type=\"text\" size=\"48\" />\n```\n\n你可以使用 jQuery\
  \ 选择器`$('input[name=\"username\"]')`与该元素进行交互。\n\n#### 使用 CSS 设计网页样式\n\nCSS 可能是一个棘手的领域，因为不同的浏览器对\
  \ CSS 提供的属性支持程度不同。仍然需要进行跨浏览器测试，以确保在一个浏览器中显示的内容也能在另一个浏览器中显示。理解这一点非常重要：你的网站在不同浏览器中看起来不完全一样是可以接受的。\n\
  \njQuery 将支持最新、最强大的 CSS 版本（CSS3）及其所有属性，但请确保在多个浏览器中进行测试，因为这是确定你所看到的内容是否可接受的唯一方法。\n\
  \n#### 使用 PHP 和 MySQL\n\n作为 Web 上最流行的服务器端语言之一，PHP 在你每天使用和了解的技术上留下了印记。对于本书中的示例和项目，你将使用\
  \ PHP 不仅支持对服务器的异步数据请求（AJAX），而且还能通过 jQuery 缩短开发时间。\n\n你将把 PHP 与 MySQL 数据库结合起来，以支持和增强你的\
  \ jQuery 项目。\n\n请记住，你可以使用任何数量的语言和数据库产品与 jQuery 结合，正如我在本书中将要介绍的那样——选择完全取决于你。\n\n\
  ### 渐进增强\n\n2003 年，Steve Champeon 在德克萨斯州奥斯汀非常流行的 SXSW 互动会议上发表演讲时，创造了术语*渐进增强*。这个概念几乎与一些早期的\
  \ JavaScript 库同时出现。\n\n渐进增强的过程是：首先开发你的标记，然后为标记添加样式（CSS），最后通过 JavaScript 引入增强的交互。\n\
  \n在 Web 开发的“美好旧时光”里，设计师和编码人员被一种称为*优雅降级*的范式所束缚。每个人都使用最新技术为最新浏览器设计网站，然后通过插入 hack 或移除\
  \ JavaScript 功能来“修复”页面，以便它们能够优雅地降级，并在较旧、功能较弱的浏览器或用户禁用 JavaScript 的情况下仍可使用。开发者试图使用\
  \ JavaScript 进行浏览器检测，以便在每个可用的浏览器中提供炫酷的交互。这既繁琐又令人沮丧。Steve Champeon 的概念改变了这一切。\n\n\
  \n\n\n有一种更好的方式来描述渐进增强。在 2008 年发表于 A List Apart 网站的文章《理解渐进增强》（[www.alistapart.com/articles/understandingprogressiveenhancement](http://www.alistapart.com/articles/understandingprogressiveenhancement)）中，Aaron\
  \ Gustafson 描绘了我最喜欢的关于渐进增强的比喻，他写道：“如果你是个糖果爱好者，可以把它想象成一颗花生 M&M 巧克力豆：从你的内容花生开始，用丰富的、语义化的(X)HTML\
  \ 进行标记。然后给这颗花生裹上一层浓郁丝滑的 CSS。最后，加上 JavaScript 作为硬糖外壳，制成一颗美味可口的糖果（并且防止它在手中融化）。”\n\n\
  让我们快速看一个渐进增强的例子。以下是`1-1.html`的一部分（可在代码下载中找到，地址为[www.appliedjquery.com](http://www.appliedjquery.com)的`chap1/1-1.html`文件夹）：\n\
  \n```\n<body>\n    <div id=\"header\"><h2>渐进增强示例</h2></div>\n    <div id=\"clear\"\
  ></div>\n    <div id=\"leftContent\">\n        <a href=\"1-2.html\" id=\"anchor\"\
  \ >新内容</a><br />\n        <a href=\"http://www.google.com\" rel=\"external\">Google</a>\n\
  \    </div>\n    <div id=\"rightContent\"></div>\n</body>\n```\n\n图 1.7 仅使用 HTML\
  \ 和 CSS 的基本渐进增强页面。\n\n![Image](img/01-07.jpg)\n\n图 1.8 点击`1-2.html`中的“新内容”链接后的结果。\n\
  \n![Image](img/01-08.jpg)\n\n标记非常标准。添加一些基本的 CSS 后，就会得到**图 1.7**中显示的效果。\n\n我还为第二个页面`1-2.html`生成了\
  \ HTML 和 CSS，它位于`chap1/1-2.html`文件夹中。如果你点击“新内容”链接，该页面将正常加载（**图 1.8**）。除了为此示例添加了一些内容外，唯一的变化在于\
  \ CSS，它使内容显示在焦橙色框中：\n\n```\n#rightContent {\n    width: 75%;\n    margin-left: 20px;\n\
  \    padding-top: 10px;  \n    padding-left: 10px;  \n    background-color: #FFCC66;\n\
  \    vertical-align: top;\n    float: left;\n}\n```\n\n网站运行完美，尽管略显单调。现在让我们在不改动任何现有标记的情况下，添加一点\
  \ jQuery。\n\n**1.** 在`1-1.html`的`<head>`部分添加一个标签来引入 jQuery 库：\n\n```\n<head>\n \
  \   <meta http-equiv=\"Content-Type\" content=\"text/html;\n    ![Image](img/ccc.jpg)\
  \ charset=ISO-8859-1\" />\n    <title>渐进增强示例 1-1</title>\n    <script type=\"text/javascript\"\
  \ src=\"../inc/jQuery/8\njquery-1.5.min.js\"></script>\n```\n\n**2.** 同样在`<head>`标签内添加一个代码块（尽管并非必须，后续示例中你会看到）：\n\
  \n```\n<script type=\"text/javascript\">\n$(document).ready(function(e) {\n    $(\"\
  #anchor\").click(function() {\n        $(\"#rightContent\").load(\"1-2.html #rightContent\
  \ > p\");\n        e.preventDefault();\n    });\n});\n</script>\n```\n\n基本上，这段代码指定了：*每当点击标识为\
  \ anchor 的元素时，将`1-2.html`文件中`rightContent`区域的段落加载到`1-1.html`文件的内容区域中*。\n\n图 1.9\
  \ 来自第二个页面的内容出现，没有令人分心的背景颜色。\n\n![Image](img/01-09.jpg)\n\n现在当你点击“新内容”链接时，页面不会重新加载，内容会按预期显示，没有难看的背景颜色（**图\
  \ 1.9**）。\n\n在不使用内联 JavaScript 标签的情况下添加 jQuery，被称为*非侵入式 JavaScript*，并且遵循渐进增强的原则。无需更改任何\
  \ HTML 标签，如果 JavaScript 被禁用，页面仍能按设计继续工作。不再需要在 HTML 标签中嵌入 JavaScript 调用！\n\n此外，这里的\
  \ CSS 也是非侵入式的。HTML 标签中没有样式属性，但 jQuery 确实为你提供了动态改变样式的能力，通过添加和移除类以及直接操作页面上每个元素的 CSS。在本书中，你将频繁使用这些函数。\n\
  \n### 规划设计与交互\n\n任何好的 Web 应用程序都始于纸上，也许是一些基本的草图。到本书结束时，你将能够使用 jQuery 极大地增强你的网站，因此规划尤为重要。你不想在没有计划的情况下随意将\
  \ jQuery 代码扔进网页，否则很快就会导致交互过载。屏幕上会有太多页面元素发生变化和移动，虽然能吸引访问者的注意力，但并非以你期望的方式。\n\n创建故事板是规划如何引导访问者浏览网站的好方法。绘制故事板不需要任何特殊技能。你可以使用便签、草图、流程图，甚至\
  \ UML（统一建模语言）来展示潜在交互的行为以及页面之间的连接。一定要多问“如果……会怎样”。如果查看者点击这里会怎样？如果鼠标滚动到页面的这个区域会怎样？如果总额超过\
  \ 100 美元会怎样？如果你把旋转的、带火焰的 logo 放在页面正中央会怎样？\n\n提出诸如此类的问题并创建网站的基本布局，将让你了解访问者如何看待你的网页并与它们交互。同时，它也会给你一些想法，让你能够构建更多为网站增加价值的\
  \ jQuery 小部件。\n\n### 总结\n\n在本章中，你了解了 jQuery JavaScript 库，学习了如何编写正确的 jQuery 语法，以及\
  \ jQuery 选择器如何与 CSS 选择器类似。你学习了 jQuery 如何与 DOM 交互，以及如何使用 jQuery 遍历 DOM。你掌握了 Firebug、jsFiddle\
  \ 和 Google Closure Compiler 等工具的知识，这些工具可以帮助你排查问题、测试并使 jQuery 脚本准备好用于实时网站和应用程序。最后，你学习了如何使用渐进增强技术将\
  \ jQuery 与 HTML、CSS 和其他语言结合，使所有代码和脚本保持模块化，便于维护，并让使用功能较弱浏览器的访问者也能有限地使用你的内容。\n\n现在你已经掌握了一些好工具并理解了\
  \ jQuery 的基础知识，是时候深入实践了。要了解 jQuery 如何与浏览器及与浏览器相关的事件交互，只需翻到下一页！\n\n## 2. 处理事件\n\n\
  jQuery 的核心能力在于它与各种浏览器和物理事件交互的能力，包括鼠标移动、表单交互和键盘事件。你可以使用 jQuery 控制这些事件，为网站访问者提供更丰富的交互体验。\n\
  \n通过将鼠标点击或按键等事件绑定到文本、链接、图像和其他 DOM 元素，你可以触发从动画到 AJAX 的无数函数。函数可以组合起来创建复杂的连锁反应，这是一件非常酷的事情。\n\
  \n在本章中，我将向你展示如何在创建一个名为“摄影师交流”的虚构网站时，控制许多此类事件。你将组合这些事件来创建效果，让网站观众为之瞩目。其他事件则非常微妙，将为你的\
  \ Web 应用程序增添风味。\n\n### 使用“摄影师交流”网站\n\n图 2.1 “摄影师交流”的首页。文本用作占位符，供你后续开发使用。\n\n![Image](img/02-01.jpg)\n\
  \n\n\n\n您将设计摄影师交流网站，让摄影师能够展示他们的照片和技巧。用户将能够上传照片并编辑这些照片的信息。此外，用户还可以提交关于摄影的文章。访客将能够使用不同的条件搜索网站。网站首页将展示精选的照片和摄影师的文章。**图\
  \ 2.1** 展示了准备编辑的网站基本布局。\n\n---\n\n注意\n\n本书中的所有代码均可从本书网站 [www.appliedjquery.com/download](http://www.appliedjquery.com/download)\
  \ 下载。\n\n---\n\n### 让导航更优雅\n\n如果您想将渐进增强的原则（如第 1 章所述）应用到您的网站，您需要让导航尽可能优雅。最简单的方法是完整地构建链接，就好像您的访客无法使用\
  \ JavaScript（以及 jQuery）一样。\n\n打开 `chap2/2-1.php` 文件。您会看到一个包含三个链接的无序 HTML 列表：\n\n\
  ```\n<a href=\"search.php\" rel=\"searchWindow\" class=\"modal\"\n\n![Image](img/ccc.jpg)\
  \ id=\"search\"><span>Search</span></a>\n\n<a href=\"register.php\" rel=\"registerWindow\"\
  \ class=\"modal\"\n\n![Image](img/ccc.jpg) id=\"register\"><span>Register</span></a>\n\
  \n<a href=\"login.php\" rel=\"loginWindow\" class=\"modal\"\n\n![Image](img/ccc.jpg)\
  \ id=\"login\"><span>Login</span></a>\n```\n\n每个链接在没有 JavaScript 的情况下也能正常工作。点击任意链接都会将相应的页面加载到浏览器中。\n\
  \n---\n\n注意\n\n为了节省本书的时间和篇幅，我没有创建额外的网页。每个模态窗口的内容（包含在 `1-1.php` 中）可以放在单独的页面中，如果您担心用户无法使用\
  \ JavaScript 的话。\n\n---\n\n这组链接将用于在浏览器中调用模态窗口。\n\n#### 创建并调用模态窗口\n\n模态窗口是用户与网站和应用程序交互的一种巧妙方式。它们通过将内容“置于”当前网页之上来提供平滑的过渡，可以向用户提供信息，也可以通过表单或确认对话框接收用户的信息。一旦模态窗口关闭，用户将返回到之前在浏览器中查看的相同内容。\n\
  \n每个模态窗口用于在网站上执行特定操作：搜索、注册或登录。您无需对链接的 HTML 进行任何修改；只需添加适当的 jQuery 即可。\n\n**1.** 创建一个\
  \ jQuery 语句，选择所有具有 `modal` 类的锚标签：\n\n```\n$('a.modal').click(function() {\n```\n\
  \n现在，您已将 `click` 事件的控制权交给了 jQuery，或者将 jQuery 的 `click` 事件绑定到了锚标签上。这种绑定允许 jQuery\
  \ 处理 `click` 事件以及分配给该事件的任何函数。\n\n函数的其余部分决定打开哪个模态窗口、将窗口放置在哪里以及如何关闭模态窗口。此外，该函数还会在整个网站上放置一个半透明的“遮罩”，使模态窗口更加突出。您可以在\
  \ `chap2/inc/jqpe.js` 文件中找到完整代码，位于注释 `/* modal windows */` 部分。\n\n**2.** 将当前点击项的\
  \ `rel` 属性值存储在一个变量中，该变量将在函数后面使用：\n\n```\n        var modalID = $(this).attr('rel');\n\
  ```\n\n**3.** 淡入您选择的模态窗口，并添加一个允许您关闭模态窗口的链接。使用图形元素（`close_button.png`）使关闭按钮看起来更美观：\n\
  \n```\n    $('#' + modalID).fadeIn().prepend('<a href=\"#\"\n\n    ![Image](img/ccc.jpg)\
  \ class=\"close\"><img src=\"grfx/close_button.png\"\n\n    ![Image](img/ccc.jpg)\
  \ class=\"close_button\" title=\"Close Window\"alt=\n\n    ![Image](img/ccc.jpg)\
  \ \"Close\" /></a>');\n```\n\n在文件 `chap2/inc/modal.css` 中，为每个模态窗口定义了外边距和内边距。要使它们在屏幕上居中，您需要考虑内边距和外边距产生的额外空间，以便应用正确的偏移量。在这种情况下，每个模态窗口周围有\
  \ 20 像素的外边距和 20 像素的内边距。这意味着您必须将高度和宽度增加 80 像素。设置好高度和宽度后，再除以 2 即可得到正确的边距。\n\n**4.**\
  \ 将计算出的水平和垂直边距值分别赋给变量 `modalMarginTop` 和 `modalMarginLeft`：\n\n```\n    var modalMarginTop\
  \ = ($('#' + modalID).height() + 80) / 2;\n\n    var modalMarginLeft = ($('#' +\
  \ modalID).width() + 80) / 2;\n```\n\n图 2.2\\. 模态窗口框，包括内边距和外边距。模态窗口的左上角最初位于窗口高度和宽度的\
  \ 50% 处。使用负数设置上边距和左边距可将模态框移动到浏览器窗口的中心。\n\n![Image](img/02-02.jpg)\n\n**5.** 现在将边距信息添加到模态窗口的\
  \ CSS 中以使其居中：\n\n```\n    $('#' + modalID).css({\n\n        'margin-top' : -modalMarginTop,\n\
  \n        'margin-left' : -modalMarginLeft\n\n    });\n```\n\n**图 2.2** 展示了模态框的模型，以及需要将其向浏览器窗口的顶部和左侧偏移多少才能居中。\n\
  \n如果您不计算框的中心位置，框的左上角将位于浏览器窗口的中心，如**图 2.3**所示。\n\n图 2.3\\. 未计算框中心位置的模态框。模态框的左上角位于浏览器窗口高度和宽度的\
  \ 50% 处，即 (0, 0)。\n\n![Image](img/02-03.jpg)\n\n---\n\n动画评估\n\n在创建模态窗口时，您使用 jQuery\
  \ 方法 `fadeIn()` 调用了第一个动画。jQuery 有许多内置的动画方法，包括 `fadeIn` 和 `slideDown`，以及允许您创建自定义动画的\
  \ `animate` 方法。\n\n什么是动画？\n\n在 jQuery 中，动画是将元素从一个 CSS 状态平滑地移动到另一个 CSS 状态的行为。动画只能应用于具有数值属性的\
  \ CSS 规则。jQuery 使用一组算法来计算从一个状态开始到另一个状态结束的每个点。一个简单的例子是不透明度。\n\n如果一个元素不可见，其不透明度为 0。要使元素完全可见，您将其不透明度设置为\
  \ 1。根据分配给过渡的时间长度，jQuery 将计算所需的离散步骤，使元素看起来淡入（或淡出），将不透明度从 0 移动到 1，反之亦然。\n\njQuery\
  \ 还支持队列，以便您可以组合动画来创建复杂的移动和变化。\n\njQuery 用户界面（UI）扩展了 jQuery 的基本动画事件，并添加了几个额外的效果方法，包括颜色动画。\n\
  \n---\n\n图 2.4\\. 用于注册的模态窗口已打开，并正确居中，带有半透明背景。\n\n![Image](img/02-04.jpg)\n\n#####\
  \ 创建半透明背景\n\n打开模态窗口的最后一步是创建半透明背景。这个遮罩实际上是一个半透明的 `div`，您仍然可以通过它看到网站。这是一个非常酷的效果，有助于用户理解他们仍然在您的网站上，但注意力应该集中在为他们高亮显示的内容上。您将在网站的其他小部件中使用类似版本的半透明\
  \ `div`。\n\n**1.** 向 `body` 追加一个新的 `div` 来创建遮罩：\n\n```\n    $('body').append('<div\
  \ id=\"modalShade\"></div>');\n```\n\n**2.** 将半透明背景动画化为部分不透明度，使其变得有些透明：\n\n```\n\
  \    $('#modalShade').css('opacity', 0.7).fadeIn();\n```\n\n\n\n\n\n**3.** 使用 `return\
  \ false;` 方法关闭 `click` 函数，以防止链接尝试在浏览器中加载另一个页面。\n\n```\n    return false;\n});\n\
  ```\n\n完成后，jQuery 代码会在浏览器窗口中央打开模态窗口，并带有阴影背景，使用户能够看到其下方的网页（**图 2.4**）。\n\n---\n\n\
  ### 使用 live( ) 和 delegate( ) 控制未来元素\n\njQuery 提供了两种方法用于将事件绑定到当前或未来创建的元素上：`live`\
  \ 和 `delegate`。这两种方法都能省去你在动态添加新元素时额外绑定新事件的工作。两者主要区别在于：`live` 不支持 DOM 遍历，而 `delegate`\
  \ 支持将事件绑定到特定的 DOM 元素。\n\n要使用 `live`，你必须在选择器之后立即使用它来绑定事件，就像你在关闭模态窗口的代码中所做的那样：\n\n\
  ```\n$('a.close, #modalShade').live('click', function() {...\n```\n\n另一方面，`delegate`\
  \ 可以这样使用：\n\n```\n$('ul#myList').delegate('li', 'click', function() {...\n```\n\n\
  这会将 `click` 事件绑定到当前及未来的每个列表项 `(<li>`) 上。如果你向无序列表追加更多列表项，它们都将绑定 `click` 函数。\n\n---\n\
  \n现在不必担心处理表单信息或处理这些信息。我将在第 3 章“让表单更生动”和第 4 章“高效使用 AJAX”中介绍表单处理。\n\n#### 关闭模态窗口\n\
  \n用户必须能够关闭窗口并移除遮罩，因此你需要为用户提供返回网站的方法。\n\n**1.** 通过将关闭图形和模态遮罩绑定到 jQuery 的 `click`\
  \ 方法来启动关闭函数：\n\n```\n$('a.close, #modalShade').live('click', function() {\n```\n\
  \n这两个元素最初都不存在于 DOM 中（关于 DOM 的简要讨论请参见第 1 章），因此你必须使用特殊的 jQuery 函数 `live` 将 `click`\
  \ 绑定到这些元素上。\n\n**2.** 通过获取 `a.close` 的 `parent` 的 `id` 来确定要关闭哪个模态窗口：\n\n```\n  \
  \  var thisModalID = $('a.close').parent().attr('id');\n```\n\n**3.** 现在淡出模态窗口和遮罩。淡出完成后，使用\
  \ `fadeOut` 提供的回调函数移除包含遮罩的 `div` 以及预先附加到模态窗口的链接：\n\n```\n    $('#modalShade, #'+thisModalID).fadeOut(function()\
  \ {\n        $('#modalShade, a.close').remove();\n    });\n    return false;\n});\n\
  ```\n\n简单来说，*回调* 是一段可执行的代码块，作为参数传递给另一个函数。回调中的代码块会在原始函数完成后执行。你向 `fadeOut` 函数发出了一个回调，如下所示：\n\
  \n```\n    $('#modalShade, #'+thisModalID).fadeOut(function() {\n        $('#modalShade,\
  \ a.close').remove();\n    });\n```\n\n淡出完成后，才会发出回调，从 DOM 中移除 `#modal-Shade` 和 `a.close`\
  \ 元素。\n\n以这种方式组合多个 jQuery 方法，使得点击链接成为一个相当强大的事件。你能将 `click` 事件或其他事件绑定到非链接元素上吗？当然可以，而且你已经做到了。再看下面这一行：\n\
  \n```\n$('a.close, #modalShade').live('click', function() {\n```\n\n高亮的值是包含遮罩的 `div`\
  \ 的 `id`，它也被绑定到了 `live click` 函数上。这允许用户点击遮罩上的任意位置来淡出模态窗口并执行函数中的其他操作。在使用 jQuery 时，绑定到非链接类型的元素是很常见的。\n\
  \n### 将事件绑定到其他元素\n\njQuery 让你能够灵活地将事件绑定到 DOM 中可用的任何元素。这使你能够创建高度交互的用户界面。创建真正有趣且直观的用户体验比以往任何时候都更容易，因为你不再将用户局限于点击网站上的链接或按钮。\n\
  \n摄影师交流网站需要一种展示会员照片的方式。一个简单的图片轮播将提供展示会员才华的绝佳方法，同时让你作为开发者能够发挥创意。\n\n#### 构建图片轮播\n\
  \n现在让我们为网站添加一个简单版本的图片轮播。\n\n轮播的概念非常简单，基于一个缩略图的无序列表。你可以在 `chap2/2-2.php` 中看到添加到网站的列表：\n\
  \n```\n<div id=\"carouselContainer\">\n    <div id=\"carouselOuter\">\n        <div\
  \ id=\"scrollLeft\"><img src=\"photos/arrowLeft.jpg\" /></div>\n        <div id=\"\
  carouselInner\">\n            <ul id=\"carouselUL\">\n            <li><img class=\"\
  carThumb\" src=\"photos/thumb_ka1.jpg\" /></li>\n            <li><img class=\"carThumb\"\
  \ src=\"photos/thumb_ka2.jpg\" /></li>\n            <li><img class=\"carThumb\"\
  \ src=\"photos/thumb_ka3.jpg\" /></li>\n            <li><img class=\"carThumb\"\
  \ src=\"photos/thumb_ka4.jpg\" /></li>\n            <li><img class=\"carThumb\"\
  \ src=\"photos/thumb_ka11.jpg\" /></li>\n            <li><img class=\"carThumb\"\
  \ src=\"photos/thumb_ka12.jpg\" /></li>\n            <li><img class=\"carThumb\"\
  \ src=\"photos/thumb_ka13.jpg\" /></li>\n            <li><img class=\"carThumb\"\
  \ src=\"photos/thumb_ka14.jpg\" /></li>\n            </ul>\n        </div>\n   \
  \     <div id=\"scrollRight\"><img src=\"photos/arrowRight.jpg\" /></div>\n    </div>\n\
  </div>\n```\n\n现在你有了图片列表，需要添加以下轮播功能：\n\n- 自动滚动。\n- 当鼠标光标悬停在轮播的任何部分时，滚动停止。\n- 当鼠标光标未悬停在轮播的任何部分时，滚动继续。\n\
  - 当鼠标光标悬停在缩略图上时，高亮该图片。\n- 控制手动滚动。\n- 点击缩略图时显示该图片的更大版本。\n\n在开始添加这些功能之前，你需要使用 CSS\
  \ 创建轮播的容器。我们先来介绍这个。\n\n##### 设置轮播 CSS\n\n为了使轮播效果良好，它必须有一个稳固的容器。容器将由 CSS 和你之前创建的标记共同定义。\n\
  \n**1.** 设置 `#carouselInner` 规则，使得一次只显示一定数量的缩略图：\n\n```\n#carouselInner {\n    float:\
  \ left;\n    width: 510px;\n    overflow: hidden;\n    background: #000000;\n}\n\
  ```\n\n`#carouselInner` 规则设置了一个 510 像素的可视区域。任何超出此规则所分配元素的内容都将不可见。510 像素区域是通过三个缩略图的宽度（每个\
  \ 160 像素）加上每个缩略图 10 像素计算得出的。额外的像素用于每个图片周围的填充。\n\n**2.** 创建一个左边距，使得两张图片可以隐藏在轮播的左侧。设置这个边距是\
  \ `#carouselUL` 规则中最重要的部分。在轮播左侧保留两张图片可以确保滚动平滑进行。确保整个轮播足够宽，以容纳你计划显示的缩略图数量。在本例中，`#carouselUL`\
  \ 设计为最多容纳 50 个缩略图：\n\n```\n#carouselUL {\n    position: relative;\n    list-style-type:\
  \ none;\n    left: -340px;\n    margin: 0px;\n    padding: 0px;\n    width: 8500px;\n\
  \    padding-bottom: 10px;\n}\n```\n\n**3.** 现在设置列表项的高度和宽度：\n\n```\n#carouselUL\
  \ li{\n    float: left;\n    width: 160px;\n    height: 128px;\n    padding: 0px;\n\
  \    background: #000000;\n    margin-top: 10px;\n    margin-bottom: 10px;\n   \
  \ margin-left: 5px;\n    margin-right: 5px;\n    text-align: center;\n}\n```\n\n\
  \n\n\n\n图 2.5. 旋转木马中可见与不可见的部分。你还可以看到图片如何移动以实现“无限”旋转。当最后一张缩略图显示后，缩略图将从列表开头重新开始。\n\
  \n![Image](img/02-05.jpg)\n\n**图 2.5** 展示了列表项将如何移动。当旋转木马向左滚动时，第一个列表项在不可见状态下被移动到列表末尾。当旋转木马向右滚动时，则发生相反的情况（最后一个列表项被移动到第一个位置）。用户会感觉图片在旋转木马上不停地循环转动。\n\
  \n定义好样式信息后，你就可以开始使用 jQuery 为旋转木马添加功能了。\n\n---\n\n注意\n\n旋转木马的 CSS（`chap4/css/carousel.css`）内容远不止这些，但大部分是装饰性的，或者为用于手动控制旋转木马的箭头预留空间。此外，还定义了用于显示大图的模态窗口的样式信息。\n\
  \n---\n\n##### 添加自动滚动\n\n现在可以开始为旋转木马添加定义好的功能了。首先创建一个自动滚动旋转木马的函数。创建一个名为 `carousel.js`\
  \ 的文件，并将其保存在 `chap2/inc` 文件夹中。\n\n**1.** 使用 `function` 关键字创建函数，并命名为 `autoCarousel`。然后将变量\
  \ `itemWidth` 设置为旋转木马中一个列表项的宽度，并加上 10 以留出内边距空间：\n\n```javascript\nfunction autoCarousel()\
  \ {\n    var itemWidth = $('#carouselUL li').outerWidth() + 10;\n```\n\n**2.** 确定旋转木马需要向左移动的距离。回想一下，CSS\
  \ 的左边距最初设置为 -340，因此 `moveFactor` 将为 -510。将计算结果赋值给变量 `moveFactor`：\n\n```javascript\n\
  \    var moveFactor = parseInt($('#carouselUL').css('left'))\n    ![Image](img/ccc.jpg)\
  \ - itemWidth;\n```\n\n**3.** 现在真正有趣的部分开始了！将 `animate` 方法绑定到由 `#carouselUL` 标识的无序列表上。然后将图片列表向左移动，使图片的左边距与\
  \ `moveFactor` 相同。添加 `slow` 持续时间和 `linear` 缓动过渡，以便更精确地控制动画：\n\n```javascript\n \
  \       $('#carouselUL').animate(\n            {'left' : moveFactor}, 'slow', 'linear',\n\
  \            ![Image](img/ccc.jpg) function(){\n```\n\n**4.** 将第一个列表项移动到列表末尾，即最后一个列表项之后。这行代码包含在动画的回调函数中，是实现无限旋转木马的秘诀：\n\
  \n```javascript\n         $(\"#carouselUL li:last\").after($(\"#carouselUL\n   \
  \      ![Image](img/ccc.jpg) li:first\"));\n```\n\n通过移动列表项并整体改变 HTML 列表的顺序，可以使图片看起来在旋转木马上不断循环。\n\
  \n---\n\n提示\n\n在 jQuery 中，缓动（Easing）用于控制动画在不同时间点的移动速度。jQuery 包含两种默认缓动方法：`linear`\
  \ 和 `swing`。`Linear` 使动画从 A 点到 B 点匀速移动，速度不变。`Swing` 使动画开始时缓慢，接近中点时加快，到达终点时再减慢。这两种缓动方法都有助于使动画更平滑，减少卡顿感。你可以使用\
  \ George Smith 的 jQuery Easing 插件创建一些酷炫的效果。该插件提供了数十种额外的缓动类型，可用于你的 jQuery 应用程序。该插件可从\
  \ GSGD 网站获取：[`gsgd.co.uk/sandbox/jquery/easing`](http://gsgd.co.uk/sandbox/jquery/easing)。\n\
  \n---\n\n**5.** 通过将左边距重置为原始值并关闭所有括号和大括号来结束函数：\n\n```javascript\n         $('#carouselUL').css({'left'\
  \ : '-340px'});\n    });\n };\n```\n\n如果不重置左边距，旋转木马会继续向左滚动，最终图片将移出视野。\n\n**6.**\
  \ 将 `autoCarousel` 函数放入 `setInterval` 函数中调用。通过将 `setInterval` 方法赋值给一个变量来为其指定标识符。将间隔设置为\
  \ 2000 毫秒（2 秒）：\n\n```javascript\nvar moveCarousel = setInterval(autoCarousel, 2000);\n\
  ```\n\n现在你可以加载页面了。你会看到旋转木马自动启动，并在每次动画之间暂停 2 秒。\n\n**7.** 使用下一行代码使所有缩略图和箭头图形呈现淡出效果：\n\
  \n```javascript\n$('.carThumb, #scrollLeft, #scrollRight').css({opacity: 0.5});\n\
  ```\n\n在创建 `hover` 函数时，你将利用这种设置为淡出状态的不透明度。\n\n##### 添加悬停函数\n\n你将把 `hover` 函数绑定到由类\
  \ `carThumb` 标识的缩略图以及包含用于手动控制滚动箭头的 `div` 元素上。`hover` 函数需要执行三个操作：\n\n- 当鼠标光标悬停在旋转木马的任何部分时，停止滚动。\n\
  - 当鼠标光标悬停在缩略图上时，高亮显示该图片。\n- 当鼠标光标未悬停在旋转木马的任何部分时，继续滚动。\n\n图 2.6. 鼠标光标悬停在旋转木马中的一张图片上。图片已淡出至完全不透明，旋转木马已停止滚动。\n\
  \n![Image](img/02-06.jpg)\n\n**1.** 将 `hover` 函数绑定到类 `carThumb` 以及 `id` 为 `scrollLeft`\
  \ 和 `scrollRight` 的元素上：\n\n```javascript\n$('.carThumb, #scrollLeft, #scrollRight').hover(function()\
  \ {\n```\n\n`hover` 函数包含两部分，一部分用于 `mouseover`，一部分用于 `mouseout`。jQuery 的 `hover`\
  \ 方法将这两部分功能结合在一起，提供了极大的灵活性。\n\n**2.** 将 jQuery 的 `stop` 和 `animate` 方法绑定到由 `$(this)`\
  \ 表示的元素上，用于函数的 `mouseover` 部分。`stop` 确保当你移开鼠标或执行其他操作时，当前动画会立即停止。如果没有 `stop`，动画会继续排队并运行，这对于\
  \ `hover` 函数来说是不可取的：\n\n```javascript\n    $(this).stop().animate({\n        opacity:\
  \ 1\n    }, 75);\n```\n\n该动画使图片在极短时间（75 毫秒）内淡出至完全不透明。这实现了图片高亮的效果，满足了其中一个要求。在 **图\
  \ 2.6** 中，光标悬停在一张缩略图上，使其看起来比相邻的缩略图更亮。\n\n**3.** 通过清除 `setInterval` 函数来停止旋转木马的滚动动画。通过将标识符\
  \ `moveCarousel` 传递给 `clearInterval` 函数来指定要清除的间隔：\n\n```javascript\n    clearInterval(moveCarousel);\n\
  ```\n\n**4.** 在 `hover` 函数的 `mouseout` 部分添加淡入图片的代码：\n\n```javascript\n    }, function()\
  \ {\n        $(this).stop().animate({\n            opacity: 0.5\n        }, 250);\n\
  ```\n\njQuery `hover` 函数的 `mouseout` 部分反转了不透明度的淡出效果，并且速度更慢（250 毫秒），只是为了视觉效果。请注意，你没有在\
  \ `hover` 函数的任何一侧应用缓动。缓动在这里也可以工作，但从不透明到完全不透明或半透明的移动时间非常短，大多数缓动方法几乎无法察觉。\n\n**5.**\
  \ 通过在 `hover` 函数 `mouseout` 部分的最后一行调用 `setInterval` 函数来重新启动旋转木马的自动滚动：\n\n```javascript\n\
  \        moveCarousel = setInterval(autoCarousel, 2000);\n});\n```\n\n旋转木马的需求很快就得到了满足。接下来，你将让网站访问者能够手动控制旋转木马的滚动。\n\
  \n##### 控制手动滚动\n\n\n\n\n网站访问者需要能够手动滚动轮播，以便查找特定图片。添加手动控制相当简单，尽管轮播的移动方向可能与点击的图片看起来相反。换句话说，点击右箭头会使轮播向左移动，点击左箭头则使轮播向右移动。\n\
  \n手动控制的部分功能已在自动滚动函数 `autoCarousel` 中完成（以下高亮代码）。你只需将代码包装在一个函数中，该函数将 `click` 函数绑定到标识为\
