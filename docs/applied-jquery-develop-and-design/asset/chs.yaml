  \ 5.11** 显示了单击“到达日期”表头时发生的排序操作。\n\n* * *\n\n注意\n\n\n\n\n我特意省略了用户如何通过选中“已回复”列中的复选框来从表格中移除记录。一个好的练习是为复选框添加\
