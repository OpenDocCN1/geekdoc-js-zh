  \    exit();\n}\n```\n\n对于此表单，AJAX 进程不需要也不期望从数据库返回任何内容，因此除了可能发生的错误外，查询不会返回任何信息。至此\
  \ PHP 部分完成，接下来可以继续处理 jQuery 脚本。\n\njQuery 脚本包含两个函数：一个绑定到表单的“提交”按钮，用于调用 `dialog`\
  \ 函数；另一个是 `dialog` 函数本身。\n\n1. 打开 `chap5/5-3.php`，找到 HTML 头部中的文档就绪函数。\n\n2. 通过为预订表单绑定一个\
  \ `submit` 方法来启动对话框进程：\n\n```\n$('#reservationForm').submit(function(e){\n```\n\n\
  3. 对之前在本练习中创建的 HTML 标记调用 jQuery UI Dialog 的 `open` 方法：\n\n```\n    $('#dialog').dialog('open');\n\
