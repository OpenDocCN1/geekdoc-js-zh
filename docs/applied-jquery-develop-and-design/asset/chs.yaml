  #paste\">粘贴</a>\n    </li>\n    <li class=\"delete\">\n        <a href=\"#delete\"\
  >删除</a>\n    </li>\n    <li class=\"quit separator\">\n        <a href=\"#quit\"\
  >退出</a>\n    </li>\n</ul>\n```\n\n6. 在 Web 浏览器中重新加载 `chap6/6-4.php`，然后点击“笔记”以加载“管理笔记”菜单。\n\
  \n7. 点击“添加笔记”，即可在主内容区域看到笔记界面。\n\n图 6.12. 新的 jQuery 自定义上下文菜单小部件显示在 Web 应用程序界面上。\n\
  \n![Image](img/06-12.jpg)\n\n由于您已将自定义上下文菜单绑定到 `noteBody` 元素，现在可以在界面的文本区域内右键单击，以查看自定义上下文菜单（图\
  \ 6.12）。\n\n由于 jQuery 自定义上下文菜单基于基本的无序 HTML 列表构建，因此您可以轻松地将功能绑定到列表中的所有元素。jQuery 自定义上下文菜单的\
  \ CSS 易于理解，并且可以轻松扩展，添加额外的图标以支持您想要添加到菜单中的任何操作。您可以声明自定义上下文菜单并将其分配给任何界面。\n\n比上下文菜单更令人头疼的问题是经常令人困扰的“后退”按钮。处理“后退”按钮以及随之而来的浏览器历史记录，是开发\
  \ Web 应用程序界面的一个重要因素。\n\n### 处理后退按钮\n\n如果您想成为创建 Web 应用程序的专家，就必须考虑浏览器的“后退”按钮以及浏览器管理历史记录的方式。“后退”按钮是\
  \ Web 浏览器的一项无法禁用的功能，因此最好在规划 Web 应用程序时，就考虑好如何处理浏览器历史记录以及用户将如何操作“后退”按钮。\n\n与其从头开始处理“后退”按钮，不如直接使用一个\
  \ jQuery 插件——由开发者“牛仔”Ben Alman 编写的“后退按钮与查询（BBQ）库”。该插件可在 [`benalman.com/projects/jquery-bbq-plugin`](http://benalman.com/projects/jquery-bbq-plugin)\
  \ 获取，它是一个小巧但非常有效的插件，允许您在 Web 应用程序中控制浏览器历史记录。jQuery BBQ 插件还允许您为 Web 应用程序中的“页面”设置书签（如果您选择启用该功能）。\n\
  \n由于 BBQ 插件的灵活性，它为开发者提供了多种选项，用于引导用户浏览 Web 应用程序的历史记录。jQuery BBQ 插件将使您能够管理页面上多个小部件的历史记录（例如，您可以同时控制用于导航的手风琴和用于数据输入的选项卡界面的历史记录）。更重要的是，当正确使用\
  \ BBQ 插件时，它允许您在 Web 应用程序界面中保留“后退”按钮的启用状态。\n\n由于应用 jQuery BBQ 插件的方法有很多，我鼓励您访问 Ben\
  \ 的网站，阅读文档并查看示例。然后下载该插件，构建一些小规模的示例，以了解插件的工作方式以及 BBQ 提供的选项。一旦您完成了这些，就可以将 jQuery BBQ\
  \ 插件应用到一些更大的 Web 应用程序界面项目中了。\n\n在开发 Web 应用程序界面时，您需要处理的最后一项内容是向应用程序的用户提供有用的提示。\n\n\
  ### 提供上下文帮助\n\n当您设计复杂的 Web 应用程序界面时，应该为用户提供文档（无论是印刷版还是在线版）。文档旨在引导他们完成使用应用程序的过程。您经常会听到人们抱怨：“我不需要看说明书！”然后用户仅凭直觉就开始使用应用程序。\n\
  \n图 6.13. 将鼠标悬停在 Web 应用程序界面的元素上，会显示一个上下文帮助框。\n\n![Image](img/06-13.jpg)\n\n作为 Web\
  \ 应用程序开发者，当应用程序可能不像用户（或您）想象的那么直观时，您可以向使用应用程序的访问者提供优雅的提示。为此，您可以提供上下文帮助。\n\n上下文帮助功能会在用户将鼠标光标悬停在已分配特定类和属性的元素上时，提供更多信息（图\
  \ 6.13）。上下文帮助窗口仅在鼠标光标停留在元素上时出现，以避免因信息过多和弹出窗口过多而让用户感到困扰。\n\n要设置上下文帮助功能，您需要先设置 CSS。打开您之前创建的\
  \ CSS 文件 `interface.css`，它位于 `chap6/css` 文件夹中。在文件末尾添加以下两条 CSS 规则：\n\n```\n.contextHelp\
  \ {\n    cursor: help;\n    position: relative;\n}\n\n.contextHelpWrapper {\n  \
  \  width: 175px;\n    padding: 10px;\n    border: 4px solid #0066CC;\n    background-color:\
  \ #FFFFCC;\n    color: #000000;\n    position: absolute;\n    top: 20px;\n    display:\
  \ none;\n    font-weight: bold;\n    font-size: 9pt;\n    z-index: 10000;\n}\n```\n\
  \nCSS 规则将光标更改为帮助样式，以提醒用户某个元素提供了上下文帮助，并设置了上下文帮助框的样式。\n\n接下来，让我们创建支持上下文帮助界面的 jQuery\
  \ 函数。\n\n1. 打开您之前在 `chap6/inc/jQuery` 文件夹中创建的 `interface.js` 文件，以添加上下文帮助函数。\n\n\
  2. 使用 `delegate` 方法将 `mouseover` 和 `mouseout` 事件附加到 `contextHelp` 类选择器：\n\n```\n\
  $('body').delegate('.contextHelp', 'mouseover mouseout',\n![Image](img/ccc.jpg)\
  \ function(event){\n```\n\n这里使用 `delegate` 方法是为了确保上下文帮助函数对所有具有正确类的元素都可用，即使这些元素尚未存在于\
  \ DOM 中。例如，当您通过单击链接加载一个具有 `contextHelp` 类的界面元素时，`delegate` 方法会确保该元素被附加到上下文帮助函数上。\n\
  \n3. 测试是否发生了 `mouseover` 事件：\n\n```\n    if(event.type == 'mouseover'){\n```\n\n\
  4. 从元素中获取 `title` 信息，并将其存储在变量 `this.helpText` 中：\n\n```\n        this.helpText =\
  \ $(this).attr('title');\n```\n\n5. 向当前元素追加一个 `div`，该 `div` 的 `class` 为 `contextHelp`：\n\
  \n```\n        $(this).append('<div class=\"contextHelpWrapper\">' +\n        ![Image](img/ccc.jpg)\
  \ this.helpText + '</div>');\n```\n\n该 `div` 用于包含来自 `title` 属性的文本。这些文本是将会显示给用户的上下文帮助信息。\n\
  \n6. 移除 title 属性以阻止默认行为：\n\n\n\n\n\n`$(this).removeAttr('title');`\n\n在正常情况下，浏览器会将\
  \ `title` 属性显示为一个小工具提示。\n\n**7.** 将具有 `class` 为 `contextHelp` 的元素的 `width` 存入变量\
  \ `helpWidth`：\n\n```\nvar helpWidth = $(this).width();\n```\n\n宽度信息将用于设置上下文帮助相对于当前元素的显示位置。\n\
  \n**8.** 应用 CSS，根据变量 `helpWidth` 定义上下文帮助框的左边缘：\n\n```\n$('.contextHelpWrapper').css({left:helpWidth-25});\n\
  ```\n\n**9.** 创建一个函数来容纳上下文帮助元素的 `fadeIn` 方法：\n\n```\nfunction helpDisplay() {\n\
  \    $('.contextHelpWrapper').fadeIn(400);\n}\n```\n\n`helpDisplay` 函数将被 JavaScript\
  \ 的 `setTimeout` 方法使用，以延迟上下文帮助元素的出现。\n\n**10.** 设置 `setTimeout` 方法，调用 `helpDisplay`\
  \ 函数并将可见性延迟 1250 毫秒：\n\n```\nsetTimeout(helpDisplay, 1250);\n```\n\n**11.** 测试 `mouseout`\
  \ 方法是否已被调用：\n\n```\n} else if (event.type == 'mouseout') {\n```\n\n**12.** 将 `title`\
  \ 属性恢复到 `contextHelp` 元素，以便可以再次使用：\n\n```\n$(this).attr('title', this.helpText);\n\
  ```\n\n**13.** 使用 jQuery 的 `fadeOut` 方法使上下文帮助元素消失：\n\n```\n$('.contextHelpWrapper').fadeOut(100);\n\
  ```\n\n**14.** 移除上下文帮助框，并用正确的花括号和方括号关闭函数：\n\n```\n$('.contextHelpWrapper').remove();\n\
  };\n```\n\n要使用上下文帮助功能，你需要将 `contextHelp` 类与 `title` 属性一起应用于任何你想要显示帮助提示的元素。请看以下两个标记示例：\n\
  \n```\n<label class=\"contextHelp\" title=\"Make sure to use a strong\n\n![Image](img/ccc.jpg)\
  \ password\">Password</label>\n```\n\n```\n<a href=\"#\" class=\"contextHelp\" title=\"\
  Add, edit and manage\n\n![Image](img/ccc.jpg) application users\">\n```\n\n图 6.14。上下文帮助功能附加到一个表单元素上，以提示用户提供强密码。\n\
  \n![Image](img/06-14.jpg)\n\n`class` 属性是 jQuery 函数的钩子，而 `title` 属性包含将显示给用户的文本（**图\
  \ 6.14**）。\n\n你可以调整上下文帮助框的位置和延迟时间，以适应你的喜好，并在你的 Web 应用程序和网站中使用。\n\n### 总结\n\nWeb\
  \ 应用程序界面为你提供了许多额外的 jQuery 技术，可以应用于你的网站和基于 Web 的应用程序。你还可以应用本书前面提供的工具，为你的客户在使用你的应用程序和网站时创建令人兴奋的交互性。\n\
  \n在本章中，你学习了如何将所有 jQuery 知识组合成一个包，以满足高度交互式 Web 应用程序的需求。你应用了 jQuery UI 小部件和开发者插件，以及手工制作的\
  \ jQuery 脚本，创建了一个有吸引力且实用的 Web 应用程序模板。\n\n请务必访问本书的网站 [www.appliedjquery.com](http://www.appliedjquery.com)，获取更多示例、文章、插件以及关于\
