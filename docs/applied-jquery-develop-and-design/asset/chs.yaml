  ```\n\n小部件的 body 部分非常简单：添加一个 `id` 为 `tw` 的 `div`，推文将被追加到其中：\n\n```\n    <body>\n\
  \n        <div id=\"tw\"></div>\n```\n\n获取推文的 jQuery 脚本非常简短，但需要你注意细节。我们将使名称和话题标签可点击，使其具有与\
  \ Twitter 网站上相同的功能。推文中包含的任何链接也将可点击，并打开一个新的浏览器窗口显示信息。\n\n**1.** 通过打开 script 标签并插入文档就绪函数来启动\
