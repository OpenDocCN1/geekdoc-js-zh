  \ = $(window).height();\n        $(\"#content1\").height(windowHeight - 175 + \"\
  px\");\n        $(\"#contentArea1\").height(windowHeight - 205 + \"px\");\n    \
  \    $(\"#content2\").height(windowHeight - 175 + \"px\");\n        $(\"#contentArea2\"\
  ).height(windowHeight - 205 + \"px\");\n    });\n```\n\n6. 关闭文档就绪函数：\n\n```\n});\n\
  ```\n\n现在，你已准备好将 `interface.js` 包含到 HTML 声明中。\n\n7. 复制 `chap6/6-1.php`，另存为 `chap6/6-2.php`，并在\
  \ HTML 的 head 部分添加一个 script 标签，以调用 `chap6/inc/jQuery/interface.js` 的源文件：\n\n```\n\
  <script type=\"text/javascript\"\n![Image](img/ccc.jpg) src=\"inc/jQuery/interface.js\"\
  ></script>\n```\n\n图 6.3 展示了在应用处理内容区域大小的 jQuery 函数之前，内容区域与页脚元素重叠的情况。\n\n![Image](img/06-03.jpg)\n\
  \n8. 在浏览器窗口中打开 `chap6/6-2.php`。你会看到内容区域不再与页脚部分重叠（图 6.3）。调整浏览器窗口大小，观察内容区域是否正确调整大小。\n\
  \n基本布局已完成，可以进一步开发为你的 Web 应用程序界面。让我们通过引入一个强大的精灵元素作为应用程序的主要导航来开始开发。\n\n***\n\n注意\n\
  \n如果你将浏览器窗口调整得非常小，以至于实际上无法使用，内容区域将再次开始相互重叠，因为在浏览器分配的空间内没有它们可放置的位置。\n\n***\n\n###\
  \ 改进应用程序界面\n\n图 6.4 展示了将在 Web 应用程序界面中使用的精灵。\n\n![Image](img/06-04.jpg)\n\n在 Web\
  \ 应用程序界面的基本框架建立之后，你可以开始应用 jQuery 函数和小部件，为应用程序用户创造丰富的交互体验。\n\n你将应用在前几章中学到的一些技术，包括处理事件和使用\
  \ jQuery UI 小部件。这些技术和小部件将为你的应用程序提供直观的用户交互，同时利用 jQuery 库提供的效率，使你的应用程序能够流畅运行。\n\n\
  首先，让我们采用你在第 2 章中学到的简单精灵导航技术，并提升该技术的能力，使其在 Web 软件应用程序中以不同但更有效的方式运行。\n\n#### 创建更好的精灵\n\
  \n你在第 2 章中使用的精灵交互相当简单：将鼠标悬停在一个元素上，它就会改变；将光标移开，它就会恢复为正常外观。对于本章中创建的 Web 应用程序界面，交互需要稍微复杂一些。精灵不仅需要反映悬停状态，还需要反映用户选择在应用程序中工作的区域的第三种状态（选中状态）。\n\
  \n因此，你需要配置一个包含三行的精灵图像（图 6.4）。你可以在下载文件的 `chap6/grfx/main_nav.png` 中找到此图像。\n\n当鼠标光标悬停在精灵中的某个项目上时，图标将变为黄色，然后当光标移开该图标时，图标会逐渐变回灰色。这与之前创建的精灵发生的动作相同。不同之处在于，选中的项目在光标悬停时不会改变，而点击的精灵项目将获得选中状态，图标变为白色。\n\
  \n要使精灵按你期望的方式做出反应，有两个关键方面：CSS 和 jQuery。在准备好 CSS 和 jQuery 代码后，你将把精灵添加到 HTML 中。让我们先创建\
  \ CSS。\n\n##### 为精灵设置样式\n\n使精灵正常工作关键在于在页面中为精灵容器设置样式，并确保精灵的每个元素都在 CSS 中定义。\n\n1.\
  \ 在文件夹 `chap6/css/spritenav` 中创建一个名为 `spritenav.css` 的 CSS 文件，并设置第一个属性，该属性将设置精灵的高度。该规则还将包含一个属性，用于移除将用于精灵的无序列表的默认样式：\n\
  \n```\n   #spriteNav {\n      height: 75px;\n      list-style: none;\n      margin:\
  \ 0;\n      padding: 0;\n   }\n```\n\n2. 确保所有列表项向左浮动，以便它们能够并排排列：\n\n```\n   #spriteNav\
  \ li {\n      float: left;\n   }\n```\n\n3. 为精灵容器内的锚点标签设置样式。锚点标签的背景图像是定义精灵的图形：\n\
  \n```\n   #spriteNav li a {\n      background: url(../../grfx/main_nav.png) no-repeat;\n\
  \      display: block;\n      height: 75px;\n      position: relative;\n   }\n```\n\
  \n4. 添加精灵的 span 元素的样式。span 元素是精灵中的图像项，当光标悬停在元素上时会出现。span 的背景图像与锚点元素使用的精灵图形相同，即 `chap6/grfx/main_nav.jpg`：\n\
  \n```\n   #spriteNav li a span {\n      background: url(../../grfx/main_nav.png)\
  \ no-repeat;\n      display: block;\n      position: absolute;\n      top: 0;\n\
  \      left: 0;\n      height: 75px;\n      width: 100%;\n   }\n```\n\n5. 为每个项目设置起始基础\
  \ `width` 和 `background-position`。精灵中的每个导航项目都必须有起始宽度和位置。由于起始位置是精灵的顶行，每个项目的 `y` 坐标为\
  \ `0px`。所有精灵项目的宽度均为 100 像素：\n\n```\n   #spriteNav li a#users {\n      width: 100px;\n\
  \   }\n   #spriteNav li a#notes {\n      width: 100px;\n      background-position:\
  \ -100px 0px;\n   }\n   #spriteNav li a#stats {\n      width: 100px;\n      background-position:\
  \ -200px 0px;\n   }\n   #spriteNav li a#processes {\n      width: 100px;\n     \
  \ background-position: -300px 0px;\n   }\n   #spriteNav li a#security {\n      width:\
  \ 100px;\n      background-position: -400px 0px;\n   }\n```\n\n6. 添加下一组样式规则，以定义\
  \ span 元素的精灵项目位置。span 元素提供悬停效果。精灵项目位于精灵的第二行，因此这些项目的 `y` 坐标必须为 `-75px`：\n\n```\n\
  \   #spriteNav li a#users span {\n      background-position: 0px -75px;\n   }\n\
  ```\n\n\n\n\n\n```\n   #spriteNav li a#notes span {\n      background-position:\
  \ -100px -75px;\n   }\n   #spriteNav li a#stats span {\n      background-position:\
  \ -200px -75px;\n   }\n   #spriteNav li a#processes span {\n      background-position:\
  \ -300px -75px;\n   }\n   #spriteNav li a#security span {\n      background-position:\
  \ -400px -75px;\n   }\n```\n\n**7.** 准备精灵图的最后一行——即当某个项目被选中时显示的图像——其 `y` 坐标为 `-150px`：\n\
  \n```\n   #spriteNav li a#users span.selected {\n       background-position: 0px\
  \ -150px;\n   }\n   #spriteNav li a#notes span.selected {\n       background-position:\
  \ -100px -150px;\n   }\n   #spriteNav li a#stats span.selected {\n       background-position:\
  \ -200px -150px;\n   }\n   #spriteNav li a#processes span.selected {\n       background-position:\
  \ -300px -150px;\n   }\n   #spriteNav li a#security span.selected {\n       background-position:\
  \ -400px -150px;\n       text-decoration: none;\n   }\n```\n\n基于精灵图的导航样式现已完成。接下来，你需要将注意力转向\
  \ jQuery，它将为精灵图增添亮点。\n\n##### 创建精灵图交互\n\n精灵图的 jQuery 代码由两个函数定义，一个用于处理悬停操作，另一个用于处理点击或选中的精灵图项目。\n\
  \n**1.** 在文件夹 `chap6/inc/jQuery` 中创建一个名为 `spreitenav.js` 的文件，并建立文档就绪函数：\n\n```\n\
  $(document).ready(function() {\n```\n\n**2.** 将 `hover` 函数和 `click` 函数包装到一个单一的函数调用中，使它们相互关联：\n\
  \n```\n$(function() {\n```\n\n这一步并非必须，但在代码组织方面会带来极大的好处。\n\n**3.** 为 `span` 和 `span\
  \ selected` 元素的可见性设置默认值：\n\n```\n$(\"#spriteNav span\").css(\"opacity\", \"0\");\n\
  $(\"#spriteNav span.selected\").css(\"opacity\", \"1\");\n```\n\n**4.** 开始编写 `hover`\
  \ 函数，将 `hover` 方法绑定到 `#spritenav span` 元素：\n\n```\n$(\"#spriteNav span\").hover(function()\
  \ {\n```\n\n**5.** 创建一个条件判断，测试当前悬停的 span 元素是否定义了 CSS 类属性。如果没有定义 CSS 类，则应用 jQuery\
  \ 动画，淡入该元素的黄色精灵图项目：\n\n```\nif($(this).attr(\"class\").length == 0) {\n    $(this).stop().animate({\n\
  \        opacity: 1\n    }, 75);\n```\n\n**6.** 如果鼠标光标所在的元素附加了 CSS 类，则将该元素的不透明度设置为\
  \ 1，使其完全可见：\n\n```\n} else {\n    $(this).css(\"opacity\", \"1\"); // 结束鼠标进入\n};\n\
  ```\n\n`hover` 方法的 `mouseover` 部分现已完全定义，接下来将进入 `hover` 事件的 `mouseout` 部分。\n\n**7.**\
  \ 如果元素没有附加 CSS 类，则将淡出时间设置为 250 毫秒，使淡出持续时间稍长：\n\n```\n}, function(){\n    if($(this).attr(\"\
  class\").length == 0) {\n        $(this).stop().animate({\n            opacity:\
  \ 0\n        }, 250);\n```\n\n**8.** 如果元素附加了类，则无论鼠标光标位置如何，都保持项目完全可见。该类表示该项目是当前选中的元素：\n\
  \n```\n} else {\n    $(this).css(\"opacity\", \"1\"); // 结束鼠标离开\n};\n```\n\n**9.**\
  \ 使用正确的结束括号和花括号关闭 `hover` 方法：\n\n```\n}); // 结束 hover 函数\n```\n\n**10.** 开始定义 `click`\
  \ 函数，将 jQuery 的 `click` 方法绑定到 `#spritenav span` 元素：\n\n```\n$(\"#spriteNav span\"\
  ).click(function() {\n```\n\n**11.** 首先从所有 `#spritenav` 元素中移除选中的类，使当前元素成为唯一选中的元素：\n\
  \n```\n$(\"#spriteNav span\").removeClass(\"selected\");\n```\n\n**12.** 使用 jQuery\
  \ 的 `addClass` 方法将 `selected` 类添加到该元素：\n\n```\n$(this).addClass(\"selected\");\n\
  ```\n\n**13.** 将所有没有 `selected` 类的 `#spritenav` 元素淡化为灰色状态：\n\n```\n$(\"#spriteNav\
  \ span:not(.selected)\").stop().animate({\n    opacity: 0\n}, 0);\n```\n\n这会将之前选中的项目恢复为灰色（即未选中或悬停状态）。\n\
  \n**14.** 添加适当的结束括号和花括号：\n\n```\n        });\n    });\n});\n```\n\n现在 CSS 和 jQuery\
  \ 已就位，为精灵图提供了功能，剩下的工作就是添加标记，将精灵图放入应用程序界面。\n\n##### 将精灵图添加到界面\n\n你已经做了大量准备工作，现在可以开始向\
