  \ 过程完成，`ajaxStop` 方法被触发，导致模态等待指示器淡出。\n\n现在你已经学会了处理 AJAX 调用及其返回的数据，接下来需要学习如何处理 Web\
  \ 上增长最快的数据类型之一——JSON。\n\n* * *\n\n提示\n\n如果你需要动画图形来向用户指示后台正在发生某些操作，请查看 [www.ajaxload.info](http://www.ajaxload.info)。在那里你可以生成多种不同颜色的动画图形。\n\
  \n* * *\n\n#### 使用 JSON\n\nJSON（JavaScript 对象表示法）已成为一种流行且轻量级的方式，用于在互联网上传输各种用途的数据包。在许多方面，JSON\
  \ 比 XML 更受欢迎，因为它能快速高效地传递数据。JSON 数据可以轻松地与 jQuery AJAX 简写方法配合使用，该方法专门设计用于处理 JSON 数据类型，即\
  \ `getJSON`。\n\n那么 JSON 到底是什么？\n\n要理解 JSON，你需要先了解 JavaScript 的对象字面量表示法。*对象字面量表示法*\
  \ 是一种显式创建对象的方式，也是设置 JavaScript 对象最健壮的方法。以下是一个示例：\n\n```\nvar person = {\n\n    name:\
  \ \"Jay\",\n\n    occupation: \"developer\",\n\n    stats: [\"blonde\", \"blue\"\
  , \"fair\"],\n\n    walk: function (){alert(this.name+ 'is walking');}\n\n};\n```\n\
  \nperson 对象被字面定义为名称:值对，包括一个嵌套数组（stats）和一个使对象行走的方法。这是一种非常简洁的描述对象的方式。\n\n以下命令与 person\
  \ 对象交互：\n\n```\nperson.walk(); // 弹出 'Jay is walking'\n\nalert(person.stats[1]);\
  \ // 弹出 'blue'\n```\n\nJSON 是对象字面量表示法的一个子集，本质上是描述对象的 *名称:值* 对。一个 JSON 数组可以包含多个对象。成功使用\
  \ JSON 的关键是确保其格式正确。JSON 必须具有匹配数量的开闭方括号和花括号（括号顺序必须正确）；*名称:值* 对中的名称和值必须正确引用；并且每个 *名称:值*\
  \ 对之间必须用逗号分隔。\n\n为了说明这一点，请看 person 对象的 JSON：\n\n```\nvar myJSONobject = {\"person\"\
  :[{\n\n    \"name\":\"Jay\",\n\n    \"occupation\":\"developer\",\n\n    \"stats\"\
  :[{\n\n        \"hair\":\"blonde\",\n\n        \"eyes\":\"blue\",\n\n        \"\
  skin\":\"fair\"\n\n    }]\n\n  }]\n\n};\n```\n\n需要注意的是，JSON 对象不包含任何可执行的方法或函数。JSON\
  \ 特意将这些排除在表示法之外，因为 JSON 仅作为传输数据的载体。\n\n##### 设置 JSON 请求\n\n自互联网诞生以来，Twitter 无疑已成为最受欢迎的社交媒体之一。Twitter\
  \ 提供了一个 API，供那些希望将 Twitter 功能扩展到自己的网页和应用程序的人使用。Twitter API 最流行的用途之一是在个人网站和博客中包含最近的推文。\n\
  \n利用 API 可以简单也可以复杂，完全取决于你的需求。让我们构建一个简单的小部件，获取你最近的十条推文并嵌入到网页中。\n\n推文数据以 JSONP 格式从\
  \ Twitter 返回。JSONP 被称为“带填充的 JSON”。在正常情况下，你无法向请求来源域之外的域发出 AJAX 请求（下一页的 **图 4.12**）。JSONP\
  \ 依赖于 JavaScript 的一个特性：`<script>` 元素允许进行跨域请求。\n\n图 4.12. 进行跨域请求的唯一方法是使用 JSONP。\n\
  \n![Image](img/04-12.jpg)\n\n为了实现这一点，JSON 必须在一个函数中返回。使用之前创建的 JSON 对象，JSONP 看起来像这样：\n\
  \n```\nmyJSONfunction({\"person\":{\"name\":\"Jay\", \"occupation\":\"developer\"\
  ,\n\n![Image \"stats\":[{\"hair\":\"blonde\",\"eyes\":\"blue\",\"skin\":\"fair\"\
  }]}]});\n```\n\n如果现在看起来像乱码，别担心；当你逐步构建从 Twitter 获取 JSON 数据的函数时，一切都会变得清晰。\n\n让我们从头开始构建整个文件，包括\
  \ CSS。\n\n**1.** 在 `chap4` 文件夹中创建一个名为 `4-7.php` 的文件。\n\n**2.** 设置 `DOCTYPE` 并包含基本的\
