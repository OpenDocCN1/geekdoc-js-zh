  md: "*Website Using PHP & MySQL*. Kevin lives in Melbourne, Australia, and enjoys\
    \ \n\nperforming improvised comedy theater and flying light aircraft. \n\n**About\
    \ SitePoint **\n\nSitePoint specializes in publishing fun, practical, and easy-to-understand\
    \ content \n\nfor web professionals. Visit http://www.sitepoint.com/ to access\
    \ our books, \n\nnewsletters, articles, and community forums. \n\n**The Online\
    \ Reference **\n\nThe online version of this reference is located at http://reference.sitepoint.com/html.\
    \ \n\nThe online version contains everything in this book, and is fully hyperlinked\
