    The default value (which is assumed, and doesn’t need to be set explicitly) is


    `"application/x-www-form-urlencoded"`. It ensures that all characters are encoded


    before they’re sent to the server. The other possible values are


    `"multipart/form-data"`, which is required when you’re using forms that have a


    file upload control (it ensures that no character conversion takes place, and
    transfers


    `form` data as a compound MIME document), and `"text/plain"`, which converts


    spaces to `"+"` symbols, but doesn’t HEX-encode special characters such as


    apostrophes.'
