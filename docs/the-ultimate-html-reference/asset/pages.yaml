  md: "■ partial where the browser provides a tooltip on hover, but doesn’t display\
    \ an \n\nunderline (though it can be styled with CSS and accessed using JavaScript\
    \ and \n\nthe DOM) \n\n■ none where no visual rendering is provided, and the attribute\
    \ isn’t recognized \n\nin the DOM \n\nSPEC \n\nversion \n\nempty\n\ndeprecated\
    \ \n\nHTML 4\n\nNO\n\nNO \n\nBROWSER SUPPORT \n\nOp9.2+\n\nSaf1.3+\n\nFF1+\n\n\
    IE6+ \n\nFULL\n\nFULL\n\nFULL\n\nFULL \n\n`**acronym **`\n\n`<acronym title=\"\
    ``*string*``\"> `\n\n`</acronym> `\n\n**Example **\n\nAn acronym is marked up\
    \ as follows: \n\n`<p>He marvelled at how fluid the ``**<acronym title=\"Graphical\
    \ User**`\n\n`** Interface\">GUI</acronym>**`` was. It truly was a gooey GUI.</p>\
    \ `\n\nThe `acronym` element is similar to the `abbr` (p. 162) element, but takes\
    \ matters one \n\nstep further. Whereas the `abbr` element is used to describe\
    \ any abbreviated phrase, \n\n`acronym` is used only where the phrase comprises\
    \ initial letters that make a word. \n\nOften, the acronym can be spoken as if\
    \ it were a word—consider NASA, pronounced \n\n“nassa,” or GUI, pronounced “gooey.”\
    \ The intention is that browsers and assistive \n\ntechnologies will interpret\
    \ this information and present it to the user in an \n\nappropriate format as\
    \ and when requested. \n\nThe fact that this element is an acronym rather than\
    \ an abbreviation offers benefits \n\nfor users of assistive technologies such\
    \ as screen readers, who may prefer to have \n\nthe abbreviated phrase announced\
    \ as a word—“nassa” instead of “enn-ay-ess-ay.” \n\nSome documents, by their very\
    \ nature, may include numerous abbreviations or \n\nacronyms. Marking up each\
    \ and every one could cause the document to become \n\nvery unsightly in some\
    \ browsers, and would be tedious for the document’s author. \n\nA general convention\
    \ is to mark up the first instance of an acronym."
