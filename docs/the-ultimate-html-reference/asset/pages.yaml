  md: "SPEC\n\n`**dl **`\n\ndeprecated \n\nempty \n\nversion \n\n`<dl> `\n\nHTML 2\n\
    \nNO\n\nNO \n\nBROWSER SUPPORT \n\nOp9.2+\n\nSaf1.3+\n\nFF1+\n\nIE5.5+ \n\nFULL\n\
    \nFULL\n\nFULL\n\nFULL \n\n`</dl> `\n\n**Example **\n\nIn the example below, a\
    \ definition list is used to format a number of definitions related \n\nto the\
    \ topic of spam: \n\n`**<dl>**`\n\n` <dt>Spam</dt>`\n\n` <dd>unsolicited email\
    \ sent in the hope of increasing sales of`\n\n` some product, or simply for the\
    \ purposes of annoying people</dd>`\n\n` <dt>Spammer</dt>`\n\n` <dd>someone who\
    \ sends out spam email and therefore deserves to`\n\n` develop a nasty incurable\
    \ disease of some kind</dd>`\n\n` <dt>Spam Filter</dt>`\n\n` <dd>a tool used in\
    \ email to 'filter out' likely spam messages,`\n\n` usually placing them in a\
    \ dedicated junk messages folder`\n\n` or similar</dd> `\n\n`**</dl> **`\n\nIf\
    \ you want to list a series of items that essentially have a title and a description\
    \ of \n\nsome kind (that is, each item has two parts), use the definition list\
    \ `dl` element. This \n\nelement contains a series of definition term (`dt` (p.\
    \ 122)) and definition description \n\n(`dd` (p. 121)) pairings. \n\nA definition\
    \ list would display as illustrated in Figure 4.1. \n\n![](img/281615fd250106ce6876c73aa0b8de9a_127_0.png)\n\
    \nFigure 4.1: A description list of spam"
  merge: -1
