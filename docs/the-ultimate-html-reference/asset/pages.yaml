  md: "![](img/281615fd250106ce6876c73aa0b8de9a_31_0.png)\n\nFigure 1.3: A mismatched\
    \ tag breaking an XHTML document when served as `\"application/xhtml+xml\" `\n\
    \nWhat’s important about this exercise is that the behavior displayed by these\
    \ browsers \n\nwhen they open a local file that’s not well formed, and has the\
    \ `.xhtml` extension, \n\nis *exactly* the same as the error that they’d present\
    \ if they encountered a malformed \n\npage on the web that was served with the\
    \ MIME type `\"application/xhtml+xml\"`. \n\nBear in mind that even if you take\
    \ the utmost care with your own code, it only takes \n\none poorly formed user\
    \ comment to do the necessary damage! I’m sure you can see \n\nwhat a tricky problem\
    \ this can be!"
