    \ to mark up paragraphs of text: \n\n`<p>This is a paragraph of text``…``</p>\
    \ `\n\n`<p>``…``and this is another paragraph.</p> `\n\nThe `p` element is one\
    \ of the most commonly used building blocks of HTML. When \n\nyou use the `p`\
    \ element to begin a new paragraph in HTML, it automatically creates \n\nsome\
    \ space above and below the content. This space is applied by the browser’s \n\
    \nbuilt-in style sheets, but you can override it as you see fit using CSS. \n\n\
    In XHTML, it’s necessary to wrap the contents of a paragraph in opening `<p>`\
    \ and \n\nclosing `</p>` tags, while in HTML 4 and earlier versions, it was enough\
    \ to signify a \n\nnew paragraph using the opening `<p>`—no closing tag was needed.\
    \ \n\nFor example, this markup would be perfectly valid in HTML 3.2: \n\n`<p>So,\
    \ having failed miserably to manage something as simple as `\n\n` \"order a breakfast\
    \ and pay for it,\" we set about our next task: `\n\n` submitting a visa application\
    \ for our impending visit to `\n\n` Thailand. Heaven help us! We're not normally\
    \ scatty like this, `\n\n` so we really must have needed that breakfast! `\n\n\
    `<p>Thankfully, the rest of the day was nothing like our poor start. `\n\n` We\
    \ got the visa submitted and approved without a hitch, so `\n\n` that's one less\
    \ task for us to do now. `"
