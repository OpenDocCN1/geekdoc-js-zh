    \ for use (it’s included here for \n\ninformation only). \n\n`**<!DOCTYPE HTML\
    \ PUBLIC \"-//W3C//DTD **`\n\n➥`** HTML 3.2 Final//EN\"> **`\n\nHTML 3.0 is an\
    \ archaic doctype that’s no longer \n\nrecommended for use (it’s included here\
    \ for \n\ninformation only). \n\n`**<!DOCTYPE HTML PUBLIC \"-//IETF//DTD **`\n\
    \n➥`** HTML 3.0//EN\"> **`\n\nHTML 2.0 is an archaic doctype that’s no longer\
    \ \n\nrecommended for use (it’s included here for \n\n`**<!DOCTYPE HTML PUBLIC\
    \ \"-//IETF//DTD **`\n\n➥`** HTML 2.0 Level 2//EN\"> **`\n\ninformation only).\
    \ Note that there are actually \n\n12 variants of this old doctype, all of which\
    \ can \n\nbe found in RFC1866² (refer to section 9.6). \n\nHTML Concepts\n\n**Doctype\
    \ Switching or Sniffing **\n\nThe way in which a web browser renders a page’s\
    \ content is often affected by the \n\ndoctype that’s defined. Browsers use various\
    \ modes to determine how to render a \n\nweb page: \n\n■ **Quirks Mode **\n\n\
    In this mode, browsers violate normal web formatting specifications as a way to\
    \ \n\navoid the poor rendering (or “breaking,” to use the vernacular) of pages\
    \ that have \n\nbeen written using practices that were commonplace in the late\
    \ 1990s. The quirks \n\ndiffer from browser to browser. In Internet Explorer 6\
    \ and 7, the Quirks Mode \n\ndisplays the document as if it were being viewed\
    \ in IE version 5.5. In other \n\nbrowsers, Quirks Mode contains a selection of\
    \ deviations that are taken from \n\nAlmost Standards mode (explained below).\
    \ \n\n■ **Standards Mode **\n\n2 http://www.ietf.org/rfc/rfc1866.txt"
  merge: -1
  pgno: 18
- img_proc: true
  md: "In this mode, browsers attempt to give conforming documents an exact treatment\
    \ \n\naccording to the specification (but this is still dependent on the extent\
    \ to which \n\nthe standards are implemented in a given browser). \n\n■ **Almost\
    \ Standards Mode **\n\nFirefox, Safari, and Opera (version 7.5 and above) add\
    \ a third mode, which is \n\nknown as Almost Standards Mode. This mode implements\
    \ the vertical sizing of \n\ntable cells in a traditional fashion—not rigorously,\
    \ as defined in the CSS2 \n\nspecification. (Internet Explorer versions 6 and\
    \ 7 don’t need an Almost Standards \n\nMode, because they don’t implement the\
    \ vertical sizing of table cells rigorously, \n\naccording to the CSS2 specification,\
    \ in their respective Standards Modes). \n\nDepending on the doctype that’s defined,\
    \ and the level of detail contained inside \n\nthe doctype (for example, whether\
    \ it does or doesn’t include a Public Identifier), \n\ndifferent browsers trigger\
    \ different modes from the list above. Doctype switching \n\nor sniffing refers\
    \ to the task of swapping one doctype for another, or changing the \n\nlevel of\
    \ detail in the doctype, in order to coax a browser to render in one of Quirks,\
    \ \n\nStandards, or Almost Standards Modes. \n\nAn example of a situation in which\
    \ doctype sniffing was put to use most frequently \n\nwas to address rendering\
    \ differences between Internet Explorer 6 and earlier versions \n\nof the browser,\
    \ which calculated content widths differently when widths, padding, \n\nborders,\
    \ and margins were applied in CSS. (This topic is not something we’ll cover \n\
    \nin this HTML reference, but you can find out more in The Ultimate CSS reference³.)\
    \ \n\nIn Internet Explorer 6, depending on the doctype defined, a different rendering\
    \ \n\nmode, namely “the correct way,” or “the old IE way,” would be used to calculate\
    \ \n\nthese widths. \n\nAs an example, imagine that you specify the doctype as\
    \ HTML 4.01 Strict, like so: \n\n`<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
    \ `\n\n` \"http://www.w3.org/TR/html4/strict.dtd\"> `\n\n3 http://reference.sitepoint.com/css/ie5boxmodel/"
