    `**"hidden"**`


    A hidden form `input` is one that, though it doesn’t appear on the page,


    can be used for storing a `value` (p. 274). The `value` in a hidden field


    may be set at page-load time (it may be written using server-side


    scripting, as in the example below), or it may be entered or changed


    dynamically, via JavaScript.


    Here’s an example in which the `"hidden"` input element obtains its


    `value` from a PHP variable called `$strCustomerId`:


    `<input ``**type="hidden"**`` name="hdnCustId"`


    ` value="<?php echo $strCustomerId; ?>"/>`


    `**"image"**`


    The image `input` type is used in place of a standard submit button,


    which may be a bit boring and conservative for your form design (or


    perhaps your marketing department is demanding something a little


    more “on brand”). When using an `input` of type `"image"`, you’ll also


    need to specify a `src` (p. 264) (where the image can be found) and an


    `alt` (p. 256) attribute (alternative text for the image, in case it’s missing


    or cannot be viewed for some other reason):


    `<input ``**type="image"**`` src="submit.jpg"`


    ` alt="Submit your details"/> `


    `**"password"**`


    The password field is almost identical to the standard text input (p. 272):


    `<input ``**type="password"**`` name="pin" id="pin"`


    ` maxlength="4" size="6"/>`


    The password input has exactly the same set of attributes as the text


    input, but differs visually in that characters entered in this type of field


    are masked in the browser, so that entered characters appear as asterisks


    or blobs, as shown in Figure 6.9.


