  md: "SPEC \n\nversion \n\nrequired \n\ndeprecated \n\nHTML 3.02 \n\nNO\n\nNO \n\n\
    BROWSER SUPPORT \n\nOp9.2+\n\nSaf1.3+\n\nFF1+\n\nIE5.5+ \n\nFULL\n\nFULL\n\nFULL\n\
    \nFULL \n\n`**tabindex**`* for <a> *\n\n`tabindex=\"``*number*``\" `\n\n**Example\
    \ **\n\nThe `tabindex` is set to `\"3\"` for the link below: \n\n`<p>You can try\
    \ our <a href=\"cakes.html\" ``**tabindex=\"3\"**``\\>lovely`\n\n` range of cakes</a>.</p>\
    \ `\n\nThe `tabindex` is used to define a sequence that users follow when they\
    \ use the Tab \n\nkey to navigate through a page. By default, the natural tabbing\
    \ order will match the \n\nsource order in the markup. In certain circumstances\
    \ it may be necessary to override \n\nthe default tabbing order, but it’s strongly\
    \ recommended that you craft a page in a \n\nlogical flow and let the browser\
    \ work through it in the default order—an approach \n\nthat negates the need for\
    \ the `tabindex` attribute. \n\nA `tabindex` can start at 0 and increment in any\
    \ value. As such, the sequence 1, 2, \n\n3, 4, 5 would be fine, as would 10, 20,\
    \ 30, 40, 50. If you need to introduce a `tabindex`, \n\nit’s advisable to use\
    \ a sequence that contains intervals (like the second example \n\nprovided), as\
    \ this will give you the opportunity to inject other controls later if need \n\
    \nbe (for example, 10, 15, 20) without having to reindex all the `tabindex` values\
    \ on \n\nthe page. Should a given `tabindex` value be applied to more than one\
    \ element in \n\nerror, the tabbing order of those affected elements will be as\
    \ per the source markup \n\norder. \n\nIf a `tabindex` is set anywhere on a page—even\
    \ if it’s the hundredth link or the fiftieth \n\nform control—the tab order will\
    \ start at the element with the lowest `tabindex` value, \n\nand work through\
    \ the increments. Only *then* will the tab order take in the remaining \n\nelements\
    \ for which no `tabindex` has been set. As such, great care must be taken to \n\
    \nensure that adding a `tabindex` doesn’t harm the usability of the page as a\
    \ whole. \n\nIf the `disabled` attribute is set on an element which has a `tabindex`,\
    \ that `tabindex `\n\nwill be ignored."
