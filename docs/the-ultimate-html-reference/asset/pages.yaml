    \n6.0\n\n5.5 \n\nFull\n\nNone\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\
    \nFull\n\nFull\n\nFull \n\nThe `hr` element display varies between browsers, as\
    \ is support for the `color` attribute. \n\nWhile most browsers render the horizontal\
    \ line with a `color`, when that attribute \n\nis combined with the `size` attribute,\
    \ the browsers’ interpretation of `color` becomes \n\ninconsistent. Some display\
    \ just a colored outline, others fill the space. However, \n\ngiven that `color`\
    \ is a deprecated attribute for this element—in fact it was never in \n\nany HTML\
    \ specification to begin with—it’s best to avoid using it altogether, and \n\n\
    thereby avoid the potential for validation failure and consistency problems. \n\
    \nSPEC \n\nversion \n\nrequired \n\ndeprecated \n\nHTML 3.2\n\nNO\n\nYES \n\n\
    BROWSER SUPPORT \n\nOp9.2+\n\nSaf1.3+\n\nFF1+\n\nIE5.5+ \n\nFULL\n\nFULL\n\nFULL\n\
    \nFULL \n\n`**noshade**`* for <hr> *\n\n`noshade=\"``*noshade*``\" `\n\n**Example\
    \ **\n\nThis code sets an unshaded horizontal line after the paragraph, as depicted\
    \ in Figure 2.11: \n\n`<p>And with that the actress and the bishop made their\
    \ excuses`\n\n` and disappeared into the night.</p> `\n\n`<hr ``**noshade=\"noshade\"\
    **``/> `\n\n`<div id=\"footer\">&copy; All content copyright 2007. Even the`\n\
    \n` unfunny stuff.</div> `\n\n![](img/281615fd250106ce6876c73aa0b8de9a_74_0.png)\n\
    \nFigure 2.11: An unshaded horizontal line \n\nStructural Elements \n\nBy default,\
