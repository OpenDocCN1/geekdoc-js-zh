  md: 'We use the `area` element to define each hotspot that’s clickable or actionable
    and


    will act as a link within a client-side image `map` . The behavior of a hotspot
    is similar


    to a normal link (the `a` (p. 144) element) in that it can be activated with a
    mouse click


    or the keyboard, and it’s used to link to another web page or resource; it’s also


    similar to the image element because, as it defines a specific area of a larger
    image,


    it requires us to set an `alt` (p. 321) attribute for those using non-visual browsers.


    The hit, or actionable, area of the image is defined using a combination of the
    `shape`


    (p. 326) and `coords` (p. 323) attributes, which create the hit area boundaries
    as a


    sequence of *x*,*y* coordinate pairings.


    **Use This For ****…**


    This element is used to create clickable or actionable areas on an image. For
    example,


    you might use it to create a graphically rich navigation mechanism such as a map


    on which the different countries or regions are the clickable areas.


    Note that not every `area` needs to be actionable. It’s perfectly acceptable to
    use `area`


    *without* an `href` attribute for the purposes of outlining a given area, and
    for providing


    additional help in the form of a tooltip created using the `title` (p. 504) attribute.


    However, this technique is inaccessible to people who use anything other than
    a


    mouse to navigate the web page, since there will be no mouse hover event for those


    users—the usual trigger for the tooltip display.


