  md: 'though, so if users chose `"XFM"` as their favorite radio station in the


    example above, that would be the `value` associated with the field name


    of `"station"`. Also note that, unlike all the other `form` markup


    examples, the `name` and `id` values differ for *this* type of control. The `id`


    is used for the purposes of linking the control to its `label` text, and


    *must* be unique.


    `**"reset"**`


    The `"reset"` input is visually similar to the `"button"` and `"submit"`


    types—it’s like a button control that can be clicked on or pressed, and


    accepts no data from the user. However, a `reset` control is a very


    destructive control to introduce to a web page, as pressing it will clear


    all the data already entered into the `form` in which the `reset` button


    resides, usually causing a fair amount of user rage! While the use of


    this control constitutes perfectly valid HTML, it’s used less and less


    these days, as it’s too easy for users to accidentally action the reset


    button with either a mouse click or while tabbing through the page


    with the keyboard. If you do feel that a `"reset"` button is warranted,


    consider adding some JavaScript to the page—something that can


    double-check the pressing of the button with a message that asks, “Are


    you sure you want to clear everything and start again?” However, it’s


    probably best to avoid this input, letting users easily refresh or reload


    a page to start again, if they want to. The markup below shows a reset


    button:


    `<input ``**type="reset"**`` name="cmdReset" id="cmdReset"`


    ` value="Clear form data"/>`


    `**"submit"**`


    This is the magic button—the one that users press to send all the form


    data they’ve entered. Once it’s clicked, there’s no going back! The


    `"submit"`` input` displays the text that you specify in the `value` (p. 274)


    attribute, but if no `value` is specified, the button face will simply display


    the word Submit. The markup below creates a submit button that


    displays the words **Send this Application**:


    `<input ``**type="submit"**`` name="cmdSubmit" id="cmdSubmit"`


    ` value="Send this application"/>`


    Form Elements'
