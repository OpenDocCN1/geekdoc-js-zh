  md: "In IE6, the doctype above will cause the browser to render in Standards Mode,\
    \ \n\nwhich includes using the W3C method for box model calculations. However,\
    \ you \n\nsee an entirely different result if you use the following doctype: \n\
    \n`<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"> `\n\nIn this\
    \ scenario, IE6 will use its old, incorrect, non-W3C method for making box \n\n\
    model calculations. \n\nNote that this is not the *only* difference between Quirks\
    \ and Standards Mode—it’s \n\n*just one* example of the differences between the\
    \ two modes (but one that caused a \n\ngreat deal of problems because of the disastrous\
    \ effect it could have on page layout). \n\nFor a complete reference of how different\
    \ browsers behave when different doctypes \n\nare provided, refer to the chart\
    \ at the foot of Henri Sivonen’s article “Activating \n\nBrowser Modes with Doctype.”^(4\
    \ )\n\n**HTML and XHTML Syntax **\n\nWriting valid HTML (or XHTML) is not a terribly\
    \ difficult task once you know what \n\nthe rules are, although the rules are\
    \ slightly more stringent in XHTML than in HTML. \n\nThe list below provides a\
    \ quick reference to the rules that will ensure your markup \n\nis well-formed\
    \ and valid. Note that there are other differences between HTML and \n\nXHTML\
    \ which go beyond simple syntax requirements; those differences are covered \n\
    \nin HTML Versus XHTML (p. 15). \n\n**The Document Tree **\n\nA web page is, at\
    \ its heart, little more than a collection of HTML elements—the \n\ndefining structures\
    \ that signify a paragraph, a table, a table cell, a quote, and so on. \n\nThe\
    \ element is created by writing an opening tag, and completed by writing a closing\
    \ \n\ntag. In the case of a paragraph, you’d create a `p` (p. 70) element by typing\
    \ `<p>Content `\n\n`goes here</p>`. \n\n4 http://hsivonen.iki.fi/doctype/ \n\n\
    HTML Concepts"
  merge: -1
  pgno: 20
- img_proc: true
  md: "The elements in a web page are contained in a tree structure in which `html`\
    \ is the \n\nroot element that splits into the `head` and `body` elements (as\
    \ explained in Basic \n\nStructure of a Web Page (p. 1)). An element *may* contain\
    \ other nested elements \n\n(although this very much depends on what the parent\
    \ element is; for example, a `p `\n\nelement can contain `span`, `em`, or `strong`\
    \ elements, among others). Where this occurs, \n\nthe opening and closing tags\
    \ must be symmetrical. If an opening paragraph tag is \n\nfollowed by the opening\
    \ `em` element, the closing tags must appear in the reverse \n\norder, like so:\
    \ `<p>Content goes here, <em>and some of it needs emphasis</em> `\n\n`too</p>`.\
    \ If you were to type `<p>Content goes here, <em>and some of it needs `\n\n`emphasis\
    \ too</p></em>`, you’d have created invalid markup. \n\n**Case Sensitivity **\n\
    \nIn HTML, tag names are case *in*sensitive, but in XHTML they’re case sensitive.\
    \ As \n\nsuch, in HTML, you can write the markup in lowercase, mixed case, or\
    \ uppercase \n\nletters. So `**<p>**``this is a paragraph``**</p>**`, as is `**<P>**``this\
    \ example``**</P>**`, and even \n\n`**<P>**``this markup would be valid``**</p>**`.\
    \ In XHTML, however, you *must* use lowercase \n\nfor markup: `<p>This is a valid\
    \ paragraph in XHTML</p>`. \n\n**Opening and Closing Tags **\n\nIn HTML, it’s\
    \ possible to omit some closing tags (check each element’s reference to \n\nsee\
    \ whether an HTML closing tag is required), so this is valid markup: `<p>This\
    \ is `\n\n`my first paragraph.<p>This is my second paragraph.<p>And here``’``s\
    \ the `\n\n`last one.`. \n\nIn XHTML, all elements must be closed. Hence the paragraph\
    \ example above would \n\nneed to be changed to: `<p>This is my first paragraph.</p><p>This\
    \ is my `\n\n`second paragraph.</p><p>And here``’``s the last one.</p> `\n\nAs\
    \ well as letting you omit some closing tags, HTML allows you to omit *start *\n\
    \ntags—but only on the `html`, `head`, `body`, and `tbody` elements. This is not\
    \ a \n\nrecommended practice, but is technically possible. \n\nFor empty elements\
    \ such as `img` (p. 331), XHTML requires us to use the XML empty \n\nelement syntax:\
    \ `<elementname attribute=\"attributevalue\"``**/**``\\>`."
