  md: "The `href` defines the location of the resource. This may be a style sheet\
    \ in the same \n\ndirectory (as shown in the example), a page located elsewhere\
    \ on the same server, \n\nor a resource held on another server. \n\nIf the referenced\
    \ resource resided in a directory that was one level higher than the \n\nreferencing\
    \ document, the syntax would be as follows: \n\n`<link rel=\"stylesheet\" type=\"\
    text/css\" ``**href=\"../basic.css\"**``/> `\n\nHere, `../` equates to the instruction\
    \ “move up one directory level in the hierarchy.” \n\nYou can also reference a\
    \ document relative to the web site’s root (that is, the folder \n\nor file after\
    \ the domain name) like so: \n\n`<link rel=\"stylesheet\" type=\"text/css\" ``**href=\"\
    /stylesheets/basic.css\"**``/> `\n\nThis code basically says “refer to the document\
    \ **basic.css** that can be found in \n\n**www.mydomain.com/stylesheets**.” This\
    \ is a very handy way of referencing a \n\ndocument, as you can move the document\
    \ containing the `link` to any location on \n\nthe file system without changing\
    \ the reference. \n\nIf you are linking to a resource that’s held on some other\
    \ server, you’d express the \n\n`href` using a complete URI, as follows: \n\n\
    `<link rel=\"stylesheet\" type=\"text/css\" `\n\n`**href=\"http://www.somedomainname.com/stylesheets/basic.css\"\
    **``/> `\n\n**Value **\n\nThis attribute takes as its value the location of the\
    \ destination document relative to \n\nthe referencing document, relative to the\
    \ server root, or as a complete URI containing \n\nthe `http://` protocol, the\
    \ server name, and the path to the document on that server. \n\nIt’s also possible\
    \ to use as values an `ftp://` location (though it’s not common) or \n\ndata,\
    \ like so: \n\n`<link rel=\"stylesheet\" type=\"text/css\" `\n\n`**href=\"data:text/css,body%20{%20background%3A%20green%3B%20}\"\
    **``/> `\n\nHead Elements"
  merge: -1
