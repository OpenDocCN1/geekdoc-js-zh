    ></script> `\n\nThe `language` attribute tells the browser which scripting language\
    \ is to be used \n\ninside the `script` block (or in the file referred to by the\
    \ `src` attribute, as shown in \n\nthe example). It may be the name of the scripting\
    \ language, or a version-specific \n\nimplementation of the language (see the\
    \ values below). \n\nNote that the `language` attribute is nonstandard, and harks\
    \ back to the days of what \n\nwere known as the “browser wars.” The appropriate\
    \ way to identify the contents \n\nof the script element is through the `type`\
    \ (p. 107) attribute (for example, you might \n\nspecify the content as `\"text/javascript\"\
    `), and use JavaScript object/feature \n\ndetection techniques within the script\
    \ rather than assume that all browsers which \n\nsupport a given version of a\
    \ scripting language support all of the features of that \n\nlanguage—no questions\
    \ asked. \n\n**Value **\n\nThe values that can be used in this attribute are:\
    \ \n\n■ `\"JavaScript\"`, `\"JavaScript1.1\"`, `\"JavaScript1.2\"`, `\"JavaScript1.3\"\
    \ `\n\n■ `\"JScript\" `\n\n■ `\"VBScript\" `\n\n■ `\"vbs\" `\n\nHead Elements"
