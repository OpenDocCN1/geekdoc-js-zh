  md: "The argument against using XHTML is basically this: if you’re not using XHTML\
    \ \n\nfor the purposes of creating an XML-based web application of some kind,\
    \ there’s \n\nno real reason to use XHTML—you may as well stick to HTML. And if\
    \ you’re intent \n\non creating a web page that validates as XHTML, but it is\
    \ served with the \n\n`\"text/html\"` MIME type, you won’t really reap any kind\
    \ of benefit either. So if you \n\nwant to use XHTML, learn it properly and be\
    \ sure to understand the pitfalls. \n\nOtherwise, you may be better off with HTML.\
    \ \n\n**XHTML: Encouraging Good Practices? **\n\nI advise people to learn XHTML,\
    \ not HTML, regardless of whether the web page is \n\ngoing to be treated as an\
    \ XML web application of some kind or as a simple web page \n\n(for more on this\
    \ thorny topic, see the section entitled Serving the Correct MIME \n\nHTML Concepts\n\
    \nType (p. 20)). By taking this approach, you’re encouraged to nest elements properly,\
    \ \n\nclose all your tags properly, and use quotes around all your attributes.\
    \ This is my \n\npreference, but I’m under no illusion as to the fact that if\
    \ I serve one of these web \n\npages as `\"application/xhtml+xml\"` and it contains\
    \ even a slight error, all my good \n\nwork will end with the fatal error mentioned\
    \ above. That said, should I later wish \n\nto incorporate XML features into my\
    \ pages, I will have a good starting point to work \n\nfrom. \n\nGiven that this\
    \ is a reference, rather than a guide aimed at total beginners, you likely \n\n\
    already know a certain amount about HTML and XHTML; you may feel more \n\ncomfortable\
    \ taking the same approach, and using the XHTML syntax. If you’re a \n\nbeginner,\
    \ however, you may prefer to start with HTML 4.01, but you should still \n\nfollow\
    \ the rules for that version of HTML. \n\n**HTML/XHTML Accessibility Features\
    \ **\n\nThe topic of web accessibility is a detailed and complicated one that\
    \ can’t be \n\nexplored to the full in this reference. However, many of the HTML\
    \ elements covered \n\nin this reference are designed to improve the accessibility\
    \ of the content, or have \n\nspecific attributes that support this goal. Where\
    \ these elements occur, their \n\naccessibility features will be mentioned."
  merge: -1
  pgno: 32
- img_proc: true
  md: "In a nutshell, the concept of accessibility focuses on making your web content\
    \ easy \n\nfor a wide range of users to access. This may include people with vision\
    \ impairments \n\n(which can include a wide variety of such impairments, from\
    \ simple \n\nshort-sightedness, to complete blindness), people with mobility problems\
    \ (from a \n\nshaky hand resulting from illness, or temporary impairment such\
    \ as wearing a cast \n\non a broken wrist, to permanent impairments like those\
    \ experienced by amputees \n\nor people suffering paralysis), and those with cognitive\
    \ issues. While it may seem \n\nas if there are a lot of people for whom you may\
    \ need to make adjustments, the \n\nreality is that HTML (or XHTML) is actually\
    \ a fairly accessible medium to begin \n\nwith, and is usually made less accessible\
    \ through the use of harmful techniques. \n\nMany of these techniques were introduced\
    \ many years ago as workarounds to \n\nperceived shortcomings in browsers; many\
    \ developers still use them today, much \n\nto the chagrin of more standards-aware\
    \ web developers. \n\nIf you stick to using the right markup for the job—applying\
    \ headings, lists, \n\nparagraphs, and blockquotes as they were intended to be\
    \ applied—you’ll be well \n\non the way to creating accessible content. However,\
    \ in addition to these basics, a \n\nnumber of HTML elements or attributes that\
    \ were introduced in HTML 4.01 may \n\nbe used to enhance the content’s accessibility\
    \ even further. In order to save you \n\ntime and effort hunting these items down,\
    \ I’ve compiled the list below to provide \n\npointers to the most relevant areas.\
    \ \n\n**Tables **\n\n■ `table` -` summary` attribute (p. 417) \n\nprovides a non-visual\
    \ summary of the table’s content or purpose, which may be \n\nuseful to people\
    \ accessing the table using assistive technology \n\n■ `th`/`td` -` scope` attribute\
    \ (p. 469) \n\nspecifies the direction of the table cells that the header cell\
    \ relates to \n\n■ `th`/`td` -` headers` attribute (p. 436) \n\nindicates which\
    \ table headers are related to a given table data cell, providing \n\ncontext\
    \ for the data for users of non-visual browsers"
  merge: -1
  pgno: 33
- img_proc: true
  md: "**Forms **\n\n■ `fieldset` (p. 239) and `legend` (p. 280) elements \n\nlogically\
    \ group related form controls, and provide a title for the grouping via the \n\
    \n`legend` element \n\n■ `label` element (p. 275) \n\nlinks a form control to\
    \ the associated descriptive text in a totally unambiguous \n\nway—a great aid\
    \ for users of non-visual browsers, such as those using screen \n\nreaders to\
    \ interact with forms \n\n**Images **\n\nHTML Concepts\n\n■ `alt` attribute (p.\
    \ 335) \n\nprovides a text alternative for an important image; can be applied\
    \ to `img` element \n\nor to an `input` of `type \"image\"` (p. 267) \n\n■ `longdesc`\
    \ attribute (p. 344) \n\nprovides a link to additional information, contained\
    \ in a separate text file, about \n\nthe image \n\n**General Aids **\n\n■ a well-written\
    \ document `title` (p. 114) \n\nAlthough it’s not an accessibility feature as\
    \ such, it’s worth noting that the `title `\n\nis what will be read out first\
    \ for screen reader users; hence it provides a golden \n\nopportunity for explaining\
    \ what is to follow. \n\n■ headings (`h1` (p. 46)-`h6` (p. 59)) \n\nHeadings provide\
    \ users of such assistive devices as screen readers with an \n\nadditional—and\
    \ quick—method for navigating through a document by skipping \n\nfrom heading\
    \ to heading. \n\n■ list items (in `ul` (p. 136) or `ol` (p. 129) elements)"
  merge: -1
  pgno: 34
