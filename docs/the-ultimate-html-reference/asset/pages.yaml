  md: "The `start` attribute lets the web page author define the start point in the\
    \ numbering \n\nsequence, rather than using the default of `\"1\"` (or `\"a\"\
    `, `\"A\"`, `\"i\"`, or `\"I\"`, depending \n\non the `type` (p. 133) attribute’s\
    \ value), as demonstrated in Figure 4.10. \n\n![](img/281615fd250106ce6876c73aa0b8de9a_144_0.png)\n\
    \nFigure 4.10: The `start` attribute lets you set the starting number for an `ol\
    \ `\n\nThis attribute is now deprecated; however, the fact that it is presentational\
    \ in nature \n\nis a matter of heated debate. The fact that a list continues on\
    \ from a previous list, \n\nfor instance, could certainly fall under the heading\
    \ of semantically meaningful \n\nList Elements\n\ninformation, worthy of including\
    \ in the HTML code of the page. Because of this, \n\nrumor has it that `start`\
    \ will make a reappearance as a fully-endorsed attribute in \n\nHTML 5. \n\n**Value\
    \ **\n\nThe `start` attribute’s value is always expressed as a number, regardless\
    \ of which \n\n`type` attribute is set. In the examples below, the start points\
    \ would be `\"iv\"`, `\"D\"`, \n\nand `\"4\"`, respectively: \n\n`<ol type=\"\
    i\" ``**start=\"4\"**``\\> `\n\n`<ol type=\"A\" ``**start=\"4\"**``\\> `\n\n`<ol\
    \ type=\"1\" ``**start=\"4\"**``\\> `\n\n**Compatibility **\n\n**Opera **\n\n\
    **Safari**\n\n**Firefox **\n\n**Internet Explorer **\n\n9.5\n\n9.2\n\n3.0\n\n\
    2.0\n\n1.3\n\n2.0\n\n1.5\n\n1.0\n\n7.0\n\n6.0\n\n5.5 \n\nFull\n\nFull\n\nFull\n\
    \nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull \n\nGood support\
    \ is provided for the `start` attribute, but given that it’s a deprecated \n\n\
    attribute, you should avoid using it if you can."
