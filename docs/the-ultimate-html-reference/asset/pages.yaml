    \nFigure 4.2: A nested definition list \n\n**Use This For ****…** \n\nTypical\
    \ uses (and hence values) for definition lists include: \n\n■ glossaries, such\
    \ as the example shown above (term: definition) \n\n■ event listing (title of\
    \ event: description of event) \n\n■ web site directory (web site name with link:\
    \ description of web site) \n\nSome people use definition lists for the purposes\
    \ of marking up dialogues (using \n\n`dt` to denote the speakers, and `dd` for\
    \ the words they say). This approach has come \n\nstraight from the horse’s mouth—the\
    \ W3C HTML recommendation states that"
