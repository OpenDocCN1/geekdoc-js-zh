  md: '`**"text"**`


    This is the most common kind of `input` that you’ll encounter on the


    Web, and that you’ll need most often as you’re building your own


    forms. The `"text"`` input` creates a single-line box that the user can


    enter text into, and has a number of attributes, such as `size` (p. 263),


    `maxlength` (p. 260), `disabled` (p. 259), `readonly` (p. 262), `name` (p. 261),


    and `tabindex` (p. 266).


    **Value**


    The possible values for `type` include `"button"`, `"checkbox"`, `"file"`, `"hidden"`,


    `"image"`, `"password"`, `"radio"`, `"reset"`, `"submit"`, and `"text"`.


