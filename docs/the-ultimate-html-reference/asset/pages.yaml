  md: "If no additional styles are applied using CSS, links will appear as follows:\
    \ \n\n■ An unvisited link appears in blue underlined text. \n\n■ A visited link\
    \ displays in purple underlined text. \n\n■ An active link—the link state during\
    \ the (usually) *very* brief moment between \n\nthe link’s activation and the\
    \ loading of the next page—appears in red underlined \n\ntext. \n\nThese color\
    \ codes are replicated in the border of any image that’s contained inside \n\n\
    an `a` element (unless it’s disabled in CSS). The example code referenced above\
    \ \n\ndisplays in all browsers, as shown in the image Figure 5.1. \n\n![](img/281615fd250106ce6876c73aa0b8de9a_154_0.png)\n\
    \nFigure 5.1: An example link \n\n**Use This For ****…** \n\nThis element is used\
    \ to contain a—preferably short—link text phrase, or an image \n\n(with an appropriate\
    \ `alt` attribute) that defines the destination of the link. \n\n**Compatibility\
    \ **\n\n**Opera **\n\n**Safari**\n\n**Firefox **\n\n**Internet Explorer **\n\n\
    9.5\n\n9.2\n\n3.0\n\n2.0\n\n1.3\n\n2.0\n\n1.5\n\n1.0\n\n7.0\n\n6.0\n\n5.5 \n\n\
    Full\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\
    \nFull \n\nText Formatting Elements \n\nIt causes no compatibility issues, and\
    \ has excellent support across all tested browsers."
