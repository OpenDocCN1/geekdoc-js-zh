  md: "said, I’ve never actually seen an author do this—most people live within the\
    \ \n\nlimitations of the defined HTML/XHTML specifications (or plug the gaps using\
    \ \n\nMicroformats¹). Here’s the `PUBLIC` statement: \n\n`<!DOCTYPE html ``**PUBLIC**``\
    \ \"-//W3C//DTD XHTML 1.0 Transitional//EN\" `\n\n` \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
    > `\n\nThe next section is known as the Public Identifier, and provides information\
    \ about \n\nthe owner or guardian of the DTD—in this case, the W3C. The Public\
    \ Identifier, \n\nwhich is shown here, is *not* case sensitive: it also includes\
    \ the level of the language \n\nthat the DTD refers to (XHTML 1.0), and identifies\
    \ the language of the DTD—*not *\n\nthe content of the web page, it’s important\
    \ to note. This language is defined as \n\nEnglish, or `EN` for short. Authors\
    \ should not change this `EN` reference, regardless of \n\nthe language contained\
    \ in the web page. \n\nNote that if the doctype contains the keyword `SYSTEM`,\
    \ the Public Identifier section \n\nis omitted. \n\nAll of this information is\
    \ highlighted in the short fragment below: \n\n`<!DOCTYPE html PUBLIC ``**\"-//W3C//DTD\
    \ XHTML 1.0 Transitional//EN\" **`\n\n` \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
    > `\n\nFinally, the doctype includes a URL, known as the System Identifier, which\
    \ refers \n\nto the location of the DTD. If you want to really geek out, you can\
    \ copy and paste \n\nthe address into your web browser’s location bar and download\
    \ a copy of the DTD, \n\nbut be warned that it doesn’t make for light reading!\
    \ Here’s the System Identifier: \n\n`<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
    \ 1.0 Transitional//EN\" `\n\n`**\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
    **``\\> `\n\nTable 1.1 shows the doctypes available in the WC3 recommendations.\
    \ \n\nHTML Concepts \n\n1 http://reference.sitepoint.com/html/microformats/"
