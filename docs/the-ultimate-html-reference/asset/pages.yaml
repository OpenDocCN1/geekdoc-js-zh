  md: "SPEC \n\nversion \n\nempty\n\ndeprecated \n\nHTML 2\n\nNO\n\nNO \n\nBROWSER\
    \ SUPPORT \n\nOp9.2+\n\nSaf1.3+\n\nFF1+\n\nIE5.5+ \n\nFULL\n\nFULL\n\nFULL\n\n\
    FULL \n\n`**a **`\n\n`<a href=\"``*uri*``\"> `\n\n`</a> `\n\n**Example **\n\n\
    The `a` element is used here to link to a page that lists cakes for sale: \n\n\
    `<p>You can try our ``**<a href=\"cakes.html\">lovely range of cakes</a>**``.</p>\
    \ `\n\nAt one character long, this is one of the smallest elements, but `a` is\
    \ the lifeblood of \n\nthe World Wide Web. It’s this element that links the billions\
    \ of web pages together, \n\nallowing you to surf from page to page almost endlessly.\
    \ To say that it’s the most \n\nimportant element of all those presented here\
    \ would not be an exaggeration. \n\nThe `a` element is usually referred to as\
    \ a link (not to be confused with the `link `\n\n(p. 80) element, which has a\
    \ different purpose), or even a hyperlink—although \n\npeople who refer to hyperlinks\
    \ probably also talk about “the information \n\nsuperhighway” and think that the\
    \ film *Tron* is cutting-edge! This element’s purpose \n\nis simple: it wraps\
    \ around text, or an image, or both, and refers to another web page, \n\nor another\
    \ section on the same web page; the user can click on the contained text \n\n\
    or image, or tab to it and activate with the keyboard’s Enter key. The enclosed\
    \ text \n\nwill be underlined by default in all browsers, which signifies that\
    \ it’s a clickable \n\nlink. It’s for this reason that you shouldn’t use the `u`\
    \ (p. 225) element; underlines are \n\nbest left on links, and links alone. In\
    \ most browsers, an image that’s contained inside \n\nan `a` element will display\
    \ a border, unless this default is overridden using CSS; the \n\nexception is\
    \ Opera, which doesn’t apply a border in this scenario. \n\nThe `a` element has\
    \ a number of special attributes, which are detailed below, but the \n\none that\
    \ you’ll use most of the time—if it’s not the *only* one you’ll use—is the `href\
    \ `\n\nattribute. This attribute indicates the link’s destination, be that another\
    \ web page, \n\na section of the same web page, or some other type of document,\
    \ such as an image, \n\na spreadsheet, or a PDF document."
  merge: -1
