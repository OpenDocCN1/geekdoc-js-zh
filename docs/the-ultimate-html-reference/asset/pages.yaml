  md: "`**rel**`* for <link> *\n\nSPEC \n\ndeprecated \n\nrequired \n\nversion \n\n\
    `rel=\"`` { ``alternate`` | ``bookmark`` | ``chapter`` | ``contents`` | `\n\n\
    HTML 2\n\nNO\n\nNO \n\nBROWSER SUPPORT \n\n`copyright`` | ``glossary`` | ``help``\
    \ | ``index`` | ``next`` | ``prev`` | `\n\nPARTIAL \n\nPARTIAL \n\nPARTIAL \n\n\
    PARTIAL \n\nIE5.5+ \n\nFF1+ \n\nSaf1.3+ \n\nOp9.2+ \n\n`section`` | ``start``\
    \ | ``stylesheet`` | ``subsection`` | ``icon`` | `\n\n`alternate`` | ``license``\
    \ | ``*other*`` } ``\" `\n\n**Example **\n\nIn this example, the `rel` attribute\
    \ indicates that the referenced document is a style sheet: \n\n`<link ``**rel=\"\
    stylesheet\"**`` href=\"basic.css\"/> `\n\nThe `rel` attribute defines the relationship\
    \ that the linked resource has to the \n\ndocument from which it’s referenced.\
    \ In most cases, this resource will simply be \n\n`\"stylesheet\"`, which means,\
    \ not surprisingly, “the referenced document is a style \n\nsheet.” Related to\
    \ this value is `\"alternate\"`, which is used alongside the \n\n`\"stylesheet\"\
    ` value (`rel=\"alternate stylesheet\"`) to indicate that there’s another \n\n\
    style associated with the page. In fact, you can define several alternative styles,\
    \ \n\nalthough the main issue with this approach lies in making it clear to the\
    \ user that \n\nan alternative style sheet is available. In Firefox, you can chose\
    \ **View** > **Page Style **\n\nand pick from the available style sheets on offer,\
    \ but there’s no obvious indication \n\nin any browser that these alternatives\
    \ exist—it’s usually left to the developer to \n\nprovide some kind of JavaScript-based\
    \ style switcher that renders as a control on \n\nthe page. The following markup\
    \ shows a page that has one main style sheet and \n\ntwo alternatives: \n\n`<link\
    \ rel=\"stylesheet\" href=\"main.css\" `\n\n` type=\"text/css\" media=\"screen\"\
    /> `\n\n`<link rel=\"``**alternate**`` stylesheet\" ``**title=\"Higher Contrast\"\
    \ **`\n\n` href=\"contrast.css\" type=\"text/css\" media=\"screen\"/> `\n\n`<link\
    \ rel=\"``**alternate**`` stylesheet\" ``**title=\"Gratuitous CSS\" **`\n\n` href=\"\
    hot.css\" type=\"text/css\" media=\"screen\"/> `"
