  md: 'Just as you can logically group all the header content in a table using `thead`
    (p. 474),


    you can do the same for the main body of the table data using `tbody` (`tbody`
    is a


    shortening of *t*able *body*). By default, a `tbody` will not affect the display
    of the table


    in any way. However, you may use this element to affect the table’s display via
    CSS


    (for example, you may choose to set the `height` of the `tbody` area to a fixed
    amount,


    and let the content in that area scroll, so that the table’s header and footer
    sections


    remain visible on screen even when the main bulk of the table content is quite


    lengthy).


    **Use This For ****…**


    This element is used to group the bulk of the table’s content (that is, anything
    other


    than the headers, which are contained in the `thead` (p. 474), and the footer
    area,


    which is contained by `tfoot` (p. 444)).


