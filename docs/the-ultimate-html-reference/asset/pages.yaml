    \ `b` element is shown below. Here, it’s used to show that the text is \n\nbold\
    \ in appearance—it’s not signifying importance: \n\n`<p>The MrBigStuff logo was\
    \ a mixture of normal and bold`\n\n` characters: \"Mr ``**<b>Big</b>**`` Stuff\"\
    </p> `\n\nThe `b` (short for bold) element simply styles the text it encloses\
    \ in a bold \n\ntypeface—assuming it’s not already presented a bold typeface—but\
    \ offers no semantic \n\nmeaning about the contained text. \n\nWhile the `b` element\
    \ isn’t deprecated—even in XHTML 1.1—its use is declining, as \n\nin many cases\
    \ it’s more appropriate to use either an emphasis (`em` (p. 187)) or strong \n\
    \nemphasis (`strong` (p. 221)) element instead. \n\nThe example above would appear\
    \ as shown in Figure 5.6. \n\nText Formatting Elements \n\n![](img/281615fd250106ce6876c73aa0b8de9a_180_0.png)\n\
    \nFigure 5.6: An example of `b` in action \n\n**Use This For ****…** \n\nThis\
    \ element is used to mark up text which needs to be stylistically offset from\
    \ the \n\nnormal prose in a way that doesn’t confer any extra importance on that\
    \ text. The `b `\n\nelement should, therefore, be used only as a last resort when\
    \ no other element is \n\nmore appropriate. For the examples above, it’s preferable\
    \ to use a `b` element rather \n\nthan a `span` (p. 218) with a bold style applied\
    \ through CSS."
