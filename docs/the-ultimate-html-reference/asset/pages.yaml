  md: "The example shows a link between two documents in the same directory, but if\
    \ the \n\ncake list document was in a directory that’s one level higher than the\
    \ referencing \n\ndocument, the syntax would be as follows: \n\n`<a href=\"``**../**``cakes.html\"\
    >lovely range of cakes</a> `\n\nHere, `../` equates to the instruction, “move\
    \ up one directory in the hierarchy.” \n\nYou can also reference a document relative\
    \ to the web site’s root (the file or folder \n\nafter the domain name): \n\n\
    `<a href=\"``**/**``cakes.html\">lovely range of cakes</a> `\n\nThis link basically\
    \ instructs the browser to “link to the document **cakes.html** that \n\ncan be\
    \ found in **www.mydomain.com/**.” This is a very handy way of referencing \n\n\
    documents, as you could move the document containing the link to any location\
    \ \n\non the file system without breaking the link. \n\nIf you’re linking to a\
    \ document (of whatever type) that’s held on another server, \n\nyou’d express\
    \ the `href` using a complete URI, like so: \n\n`<a href=\"``**http://www.cakebrothers.com/cakes.html**``\"\
    >lovely range of `\n\n` cakes</a> `\n\nIn a link to another section within the\
    \ same page, the destination is identified in \n\nthe `href` attribute by a hash\
    \ symbol combined with the `id` attribute of the destination. \n\nThis notation\
    \ is known as a fragment identifier, and is shown below: \n\n`<!-- Here is the\
    \ link --> `\n\n`<p>You can check the facts by reading the `\n\n`**<a href=\"\
    #refs\">**``references at the end of this article``**</a>**``</p> `\n\n⋮ \n\n\
    `<!-- Here is the link's destination --> `\n\n`<h3>``**<a id=\"refs\" href=\"\
    #refs\">**``References``**</a>**``</h3> `\n\nNote these points from the example\
    \ above: \n\n■ The `href` attribute is repeated in the second `a` element. This\
    \ isn’t a mistake—it’s \n\nthere because *without* it, Internet Explorer users\
    \ who navigate to the destination"
