  md: 'The `th` element renders the text content it contains slightly differently
    from the


    `td`—in the case of the browsers tested, the rendered style makes the font bold
    and


    centered (and this convention is unlikely to change soon). Centered headings are


    not always desirable, though, and you can use the `align` (p. 455) attribute to
    override


    this (or better still, use CSS to change the alignment).


    As a structural element which conveys some orientation information about the data


    that may follow, the `th` has some special attributes that reinforce the relationship


    between header and data cells, namely the `axis` (p. 456), `headers` (p. 463),
    `id` (p. 499),


    and `scope` (p. 469) attributes.


    Finally, this element uses the `colspan` (p. 461) and `rowspan` (p. 467) attributes
    when


    the content of the cell needs to run across multiple columns or rows.


    **Use This For ****…**


    This element is used to identify a table cell whose content is a header of some
    kind;


    for example, you might use it to identify the top-most cell, containing the words


    “Make of Car,” in a column that contains a list of car manufacturers.


