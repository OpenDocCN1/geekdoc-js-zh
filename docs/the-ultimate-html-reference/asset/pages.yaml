  md: "Of those browsers tested, only Opera provides a facility to navigate pages\
    \ using a \n\ntoolbar that activates certain options, such as “previous” and “next,”\
    \ when a `link `\n\nelement with a matching `rel` attribute is found (but even\
    \ then, this toolbar is hidden \n\nby default because it would do nothing for\
    \ the majority of web sites). Firefox doesn’t \n\nhave this capability by default,\
    \ but you can install an extension that reveals these \n\nnavigation features.\
    \ \n\nWith the exceptions of IE 5.5 and IE 6, all the browsers were able to understand\
    \ and \n\ndo something useful with a `link` to an XML feed, be that RSS or Atom,\
    \ usually by \n\nindicating the presence of the feed with an icon in the address\
    \ bar. \n\nThe favicon shortcut is well supported, but the way in which it’s treated,\
    \ cached, \n\ndisplayed in your browser’s favorites, and so on, differs between\
    \ browsers and \n\noperating systems. \n\nYou may get better value from this attribute\
    \ if you plug in extra functionality using \n\nJavaScript and the DOM, or if you\
    \ use a centralized web service of some kind that’s \n\nable to make use of the\
    \ attribute’s content (perhaps for analytical purposes, or for \n\nrefining search\
    \ results). \n\n`**rev**`* for <link> *\n\n`rev=\"`` { ``alternate`` | ``bookmark``\
    \ | ``chapter`` | ``contents`` | `\n\n`copyright`` | ``glossary`` | ``help`` |\
    \ ``index`` | ``next`` | ``prev`` | `\n\nIE7 \n\nFF2 \n\nSaf3 \n\nOp9.5 \n\nNONE\
    \ \n\nNONE \n\nNONE \n\nNONE\n\n`section`` | ``start`` | ``stylesheet`` | ``subsection``\
    \ | ``*other*`` } ``\" `\n\nversion \n\nrequired \n\ndeprecated \n\nSPEC \n\n\
    HTML 2\n\nNO\n\nNO \n\nBROWSER SUPPORT \n\n**Example **\n\nHere, the `rev` is\
    \ used to identify the page as the parent for the categories page: \n\n`<link\
    \ rel=\"subsection\" ``**rev=\"parent\"**`` href=\"categories.html\"/> `\n\nHead\
    \ Elements \n\nWhile the `rel` attribute (p. 86) defines the relationship of the\
    \ referenced document \n\nor resource to the referencing document, the `rev` attribute\
    \ is effectively the *rev*erse \n\nof that: it defines the relationship that the\
    \ referenced document would classify itself \n\nas having with this document.\
    \ To use a simple example, let’s assume that our site"
  merge: -1
