  md: "`<html ``**xmlns=\"http://www.w3.org/1999/xhtml\"**``\\> `\n\nHere’s an example\
    \ of an XHTML transitional page: \n\n`<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
    \ 1.0 Transitional//EN\" `\n\n` \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
    > `\n\n`**<html xmlns=\"http://www.w3.org/1999/xhtml\"> **`\n\n` <head> `\n\n\
    ` <title>Page title</title> `\n\n` </head> `\n\n` <body> `\n\n` </body> `\n\n\
    `**</html> **`\n\nThe `html` element breaks the document into two main sections:\
    \ the `head` (p. 61) and \n\nthe `body` (p. 32). \n\n`**head **`\n\nThe `head`\
    \ element contains meta data—information that describes the document \n\nitself,\
    \ or associates it with related resources, such as scripts and style sheets. \n\
    \nThe simple example below contains the compulsory `title` (p. 114) element, which\
    \ \n\nrepresents the document’s title or name—essentially, it identifies what\
    \ this document \n\nis. The content inside the `title` may be used to provide\
    \ a heading that appears in \n\nthe browser’s title bar, and when the user saves\
    \ the page as a favorite. It’s also a \n\nvery important piece of information\
    \ in terms of providing a meaningful summary \n\nof the page for the search engines,\
    \ which display the `title` content in the search \n\nresults. Here’s the `title`\
    \ in action: \n\n`<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
    \ `\n\n` \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"> `\n\n`<html\
    \ xmlns=\"http://www.w3.org/1999/xhtml\"> `\n\n` <head> `\n\n`**<title>Page title</title>\
    \ **`\n\n` </head> `\n\n` <body> `\n\n` </body> `\n\n`</html> `\n\nIn addition\
    \ to the `title` element, the `head` may also contain:"
