    `class="``*string*`` …``"`


    **Example**


    The `div` (p. 44) element in this example has two classes assigned to it, which
    identify it


    both as an `"aside"` and as `"salescopy"`:


    `<div ``**class="aside salescopy"**``\>This is a sidebar.</div>`


    While the name of an element specifies its type, the `class` attribute lets you
    assign


    to it one or more subtypes. These subtypes may then be used in CSS code for styling


    purposes, or by JavaScript code (via the Document Object Model, or DOM) to make


    changes, or add behavior, to elements belonging to a particular subtype.


    **Value**


    This attribute takes as its value a space-delimited list of one or more `class`
    names.


    Unlike the `id` attribute, the `class` attribute’s value may begin with a number;
    for


    example, `<div class="3-col-wide"> ``…`` </div>`.


    While there have been numerous calls from the developer community to specify a


    standard set of class names and associated meanings, at the moment you’re free
