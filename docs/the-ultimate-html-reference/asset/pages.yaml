  md: "4.01 is somehow backwards. That said, you should be aware of the differences\
    \ \n\nbetween HTML and XHTML, as these may affect your choice of markup. \n\n\
    **Main Differences Between XHTML and HTML **\n\nThe following list details the\
    \ main differences between XHTML and HTML. Most \n\nof them are related to syntax\
    \ differences, although there are some less obvious \n\nvariations that you may\
    \ not be aware of: \n\n■ XHTML is more choosy than HTML—there are some elements\
    \ that absolutely \n\nmust appear in the XHTML markup, but which may be omitted\
    \ if you’re using \n\nHTML 4 and earlier versions. These elements include the\
    \ `html` (p. 69), `head `\n\n(p. 61), and `body` (p. 32) elements (although why\
    \ you’d want to omit any of them \n\nis a mystery to me). In addition, every element\
    \ you use in XHTML must have \n\nboth an opening and closing tag (for example,\
    \ you’d write `**<p>**``This is a `\n\n`paragraph``**</p>**` in XHTML, but `**<p>**``This\
    \ is all you need` in HTML, as no end \n\ntag is required). \n\n■ For empty elements—those\
    \ that hold no content but refer to a resource of some \n\nkind, such as an `img`\
    \ (p. 331), `link` (p. 80), or `meta` (p. 92) element—the tag must \n\nhave a\
    \ trailing closing slash, like so: `<img src=\"moo.jpg\" alt=\"moo\"``**/**``\\\
    >`. \n\nEvidently, this makes XHTML a little more verbose than HTML, but not to\
    \ the \n\nextent that it has an adverse effect on the page weight. \n\n■ XHTML\
    \ allows us to indicate any element as being empty—for example, an \n\nempty paragraph\
    \ can be expressed as `<p/>`—but this isn’t valid when the page \n\nis served\
    \ as text/html⁷. To that end, you should restrict your use of this syntax \n\n\
    to elements that are defined to be empty in the HTML specifications. \n\n■ In\
    \ XHTML, all tags must be written in lowercase. In HTML, you can use capital \n\
    \nletters for elements, lowercase letters for attributes, or whatever convention\
    \ you \n\nlike! \n\n■ All attributes in XHTML must be contained in quotes (single\
    \ or double, but \n\nusually double), hence `<input type=submit name=cmdGo/>`\
    \ would be valid in \n\nHTML 4.01, but would be invalid in XHTML. To be valid,\
    \ it would need to be \n\n`<input type=\"submit\" name=\"cmdGo\"/>`. \n\n7 http://reference.sitepoint.com/html/mime-types/"
  merge: -1
  pgno: 25
- img_proc: true
  md: "■ In XHTML, all attributes must be expressed in attribute-name and attribute-value\
    \ \n\nparings with quote marks surrounding the attribute value part, like so:\
    \ \n\n`class=\"fuzzy\"`. \n\n■ In HTML, some elements have attributes that do\
    \ not *appear* to require a value—for \n\nexample, the `checked` attribute for\
    \ checkbox `input` elements (p. 267). I stressed \n\nthe word “appear” because\
    \ technically it’s the attribute *name* that’s omitted, not \n\nthe value. These\
    \ are known as Boolean attributes, and in HTML you could specify \n\nthat a checkbox\
    \ should be checked simply by typing `<input type=\"checkbox\" `\n\n`name=\"chkNewsletter\"\
    \ ``**checked**``\\>`. In XHTML, though, you must supply both \n\nan attribute\
    \ and value, which results in seemingly needless repetition: `<input `\n\n`type=\"\
    checkbox\" name=\"chkNewsletter\" ``**checked=\"checked\"**``\\>`. \n\n■ In XHTML,\
    \ the opening `<html>` tag requires an `xmlns` attribute (XML NameSpace) \n\n\
    as follows: `<html ``**xmlns=\"http://www.w3.org/1999/xhtml\"**``\\>`. However,\
    \ \n\nstrangely, if you omit it, the W3C validator doesn’t protest as it should.\
    \ \n\n■ XHTML requires certain characters to appear as named entities. For example,\
    \ \n\nyou can’t use the `&` character: it must be expressed using an HTML entity\
    \ \"`&amp;`\". \n\n■ In XHTML, languages in the document must be expressed using\
    \ the `xml:lang `\n\nattribute instead of `lang`. \n\n■ A MIME type must be declared\
    \ appropriately in the HTTP headers as \n\n`\"application/xhtml+xml\"` (this is\
    \ the best option), `\"application/xml\" `\n\n(acceptable), or `\"text/xml\"`\
    \ (which isn’t recommended). The MIME type is set \n\nas a configuration option\
    \ on the server, and is usually Apache or IIS. \n\n■ DTDs don’t support the validation\
    \ of mixed namespace documents very well. \n\n■ If you use XHTML and set the proper\
    \ MIME type (see the section below called \n\nServing the Correct MIME Type (p.\
    \ 20)), you’ll encounter a small snag: Internet \n\nExplorer. At the time of writing,\
    \ this browser—which still holds the lion’s share \n\nof the market—is the only\
    \ one of the browsers tested for this reference that can’t \n\nhandle a document\
    \ set with a MIME type of `\"application/xhtml+xml\"`. When \n\nIE encounters\
    \ a page that contains this HTTP header, it doesn’t render the page \n\non screen,\
    \ but instead prompts the user to download or save the document. \n\n■ When you’re\
    \ using XHTML, text encoding should be set within the XML \n\ndeclaration, not\
    \ in the HTTP headers. \n\nHTML Concepts"
  merge: -1
