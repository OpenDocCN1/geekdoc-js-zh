    FULL \n\n`**i **`\n\n`<i> `\n\n`</i> `\n\n**Example **\n\nThe correct usage of\
    \ the `i` element is shown below, where it’s used to show that the text \n\nin\
    \ a logo uses italics: \n\n`<p>The logo for the Left-Leaning organization uses\
    \ italic text on`\n\n` the word leaning, as shown here: \"left-``**<i>leaning</i>**``\"\
    </p> `\n\nThe `i` (short for italic) element styles the text it contains in italics,\
    \ but offers no \n\nsemantic meaning about the contained text. \n\nWhile the `i`\
    \ element isn’t deprecated—even in XHTML 1.1—its use is declining as, \n\nin many\
    \ cases, it’s more appropriate to use either an emphasis (`em` (p. 187)) or strong\
    \ \n\nemphasis (`strong` (p. 221)) element instead. However, there are instances\
    \ where a \n\nsuitable HTML alternative isn’t available, and `i` must be used.\
    \ \n\n**Use This For ****…** \n\nThis element should be applied to text that needs\
    \ to be stylistically offset from the \n\nnormal prose, but in a way that doesn’t\
    \ confer any extra importance on that text. \n\nText Formatting Elements \n\n\
    Such applications include: \n\n■ the name of a boat \n\n■ a technical term \n\n\
    ■ an idiomatic phrase from another language \n\n■ a thought \n\nThe `i` element\
    \ should, therefore, be used only as a last resort when no other element \n\n\
    is more appropriate. For the examples above, it’s preferable to use an `i` element\
    \ \n\nrather than a `span` (p. 218) to which an italic style is applied via CSS."
