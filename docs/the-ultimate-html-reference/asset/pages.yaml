  md: "`**nobr **`\n\nSPEC \n\ndeprecated \n\nempty \n\nversion \n\n`<nobr> `\n\n\
    Op9.2+\n\nSaf1.3+\n\nFF1+\n\nIE5.5+ \n\nFULL\n\nFULL\n\nFULL\n\nFULL \n\nN/A\n\
    \nNO\n\nYES \n\nBROWSER SUPPORT \n\n`</nobr> `\n\n`nobr` is a proprietary element\
