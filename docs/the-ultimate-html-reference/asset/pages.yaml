    \ \n\nversion \n\n`type=\"`` { ``circle`` | ``disc`` | ``square`` | ``a`` | ``A``\
    \ | ``i`` | ``I`` | `\n\nOp9.2+\n\nSaf1.3+\n\nFF1+\n\nIE5.5+ \n\nFULL\n\nFULL\n\
    \nFULL\n\nPARTIAL \n\n`1`` } ``\" `\n\n**Example **\n\nThe example below shows\
    \ one item in an unordered list with the `type` set to `\"circle\"`: \n\n`<ul>`\n\
    \n` <li>Eggs</li>`\n\n` <li ``**type=\"circle\"**``\\>Cheese</li>`\n\n` <li>Milk</li>`\n\
    \n` <li>Papadums</li>`\n\n` <li>Tickle-me Elmo</li>`\n\n` <li>Dr Who Remote Control\
    \ Dalek</li> `\n\n`</ul> `\n\nWhen the `type` attribute is applied to an `li`,\
    \ it lets the web page author change the \n\nstyle of the glyph for this list\
    \ item, overriding the style set with the `type` attribute \n\nat the parent `ul`\
    \ or `ol` level, as shown in Figure 4.5. \n\n![](img/281615fd250106ce6876c73aa0b8de9a_135_0.png)\n\
    \nFigure 4.5: Changing one list item glyph style using the `type` attribute \n\
    \nThis attribute is now deprecated, and is highly presentational in its nature.\
    \ The \n\ndesired visual effects can all be achieved with CSS and, as such, this\
    \ attribute \n\nshouldn’t be used—it’s presented here for informational purposes\
    \ only."
