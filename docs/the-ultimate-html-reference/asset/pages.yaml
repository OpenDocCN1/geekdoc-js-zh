    \ the town at his**`\n\n`** favorite drag queen show</del>**`` <ins`\n\n` datetime=\"\
    2007-11-05T23:33:32Z\">quiet night in with a warm cup of`\n\n` cocoa.</ins></p>\
    \ `\n\nThe `del` element is used to indicate a change that saw the author delete\
    \ content \n\nwhich appeared in an earlier version of a document. \n\n`del` can\
    \ be used to identify any removed content, from a specific word or phrase \n\n\
    that’s been removed (in which case the `del` is deemed to be an inline element)\
    \ to \n\nan entire block of content, which could include a number of nested block-level\
    \ \n\nelements (in this case, the `del` is deemed to be a block-level element).\
    \ \n\nThe `del` element has a counterpart in the `ins` (p. 190) element, which\
    \ is used to \n\nidentify an insertion of content into a document. \n\nBoth elements\
    \ have optional attributes that provide extra information about the \n\nchange\
    \ that has been made to the document, namely the `cite` (p. 182) and `datetime\
    \ `\n\n(p. 183) attributes. \n\nThe example code above would render on screen\
    \ as shown in Figure 5.10. \n\n![](img/281615fd250106ce6876c73aa0b8de9a_189_0.png)\n\
    \nFigure 5.10: The `del` element in action \n\nWhether a `del` element is determined\
    \ to be inline or block level depends on the \n\ncontext in which it’s used. If\
    \ the `del` is an immediate child of `body` (p. 32) (with a"
