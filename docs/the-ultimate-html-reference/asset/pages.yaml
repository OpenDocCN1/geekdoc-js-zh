  md: "The `ins` element has a counterpart in the `del` (p. 180) element, which is\
    \ used to \n\nidentify a deletion from a document. \n\nBoth elements have optional\
    \ attributes that provide extra information about the \n\nchange to the document,\
    \ namely the `cite` (p. 192) and `datetime` (p. 193) attributes. \n\nThe example\
    \ HTML above would render as shown in Figure 5.15. \n\n![](img/281615fd250106ce6876c73aa0b8de9a_200_0.png)\n\
    \nFigure 5.15: A browser interpretation of the `ins` element \n\nWhether an `ins`\
    \ element is determined to be inline or block-level depends on the \n\ncontext\
    \ in which it’s used. If the `ins` is an immediate child of `body` (p. 32) (with\
    \ a \n\nStrict doctype (p. 6) declaration), it’s a block-level element. If it’s\
    \ a child of a `p `\n\n(p. 70) element, it’s deemed to be an inline element. \n\
    \nNote that a `ins` element can’t contain block-level child elements when it’s\
    \ used in \n\na context that would make it inline (for example, an `ins` contained\
    \ inside a `p` can’t \n\ncontain a block-level element). \n\n**Use This For ****…**\
    \ \n\nThis element can be applied to inline text content, or blocks of content.\
    \ \n\n**Compatibility **\n\nText Formatting Elements \n\n**Opera **\n\n**Safari**\n\
