  md: "The `title` element is arguably one of the most important elements in the whole\
    \ \n\ndocument—and it’s a required element for all flavors of HTML/XHTML. The\
    \ contents \n\nof this element are used for all of the following purposes: \n\n\
    ■ displaying a title in the browser toolbar or in the task bar (on Windows) \n\
    \n■ providing for the document a name that’s used by the browser when you add\
    \ \n\nthe page as a favorite or bookmark \n\n■ displaying a title of the page\
    \ when it appears in search engine results (this is \n\nreason enough to take\
    \ time to ensure that you create a sensible title; otherwise, \n\nyou risk not\
    \ being found in search engines for the appropriate search phrase) \n\nFor web\
    \ sites that are hand-coded, and maintained on a page-by-page basis by the \n\n\
    web developer, this element can easily fall foul of copy/paste actions (for example,\
    \ \n\nyou may all too easily create a new page about products by copying the Press\
    \ \n\nInformation page and forgetting to amend the contents of the `title` element\
    \ to \n\nreflect the new content). \n\nHere’s one tip regarding the contents of\
    \ the title element: it’s prudent to include \n\nyour company or organization\
    \ name in the `title` for all pages; however, avoid \n\nfront-loading the title\
    \ with this phrase. For example, if your company is the XYZ \n\nCorp, avoid the\
    \ following: \n\n■ XYZ Corp—Our water treatment products \n\n■ XYZ Corp—About\
    \ the company \n\n■ XYZ Corp—Contact us \n\nWhen pages are bookmarked, they’ll\
    \ appear in one alphabetical block. It would be \n\npreferable to use the following\
    \ title content: \n\n■ Water treatment products—XYZ Corp \n\n■ About XYZ Corp\
    \ \n\n■ Contact us—XYZ Corp \n\nHead Elements"
  merge: -1
  pgno: 124
- img_proc: true
  md: "**Use This For ****…** \n\nThe `title` is used to summarize the content or\
    \ purpose of the document. This \n\ncontent represents “elevator pitch” for your\
    \ document, so be succinct and \n\nmeaningful, and avoid stuffing keywords into\
    \ the title for the sake of search results \n\nalone. \n\n**Compatibility **\n\
