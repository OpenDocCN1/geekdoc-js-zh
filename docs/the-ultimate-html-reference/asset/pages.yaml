    `**height**`* for <img>*


    `height="`` { ``*number*`` | ``*percentage*`` } ``"`


    **Example**


    Here, the `height` attribute is set to `"30"`:


    `<img src="giant-prawn.jpg" alt="The Giant Prawn at Ballina"`


    `**height="30"**``/>`


    An image doesn’t require a `height` attribute, but it has its uses. The main use
    for


    specifying the `height` (and `width` (p. 351)) is to improve the user experience
    while


    a page is loading. If the dimensions are specified in the markup, as the page
    is


    loaded, the space required for the images is reserved by the browser; without
    this


    information, the browser doesn’t know how big the image is, and can’t allocate
    the


    appropriate space to it. On a slow-loading page, the effect can be quite disturbing,


    as content is constantly reflowed as each new image appears on the page.


    The downside of specifying a `height` (and `width`) is that if you later decide
    to update


    an image that’s used site-wide—for example, a company logo—you’d need to change


    the dimension attributes for each page of the site. Depending on how your web
    site


    is managed (manually, in a template-driven way, via a CMS, or through server-side


    includes), this may either be a minor niggle, or a real issue for you. It’s a
    case of


    weighing up the pros and cons in each situation.


    If the `height` attribute is set by itself, but no `width` attribute is set, the
    image will


    be rescaled proportionally, as shown by the three images (set to `"30"`, `"100"`,
    and


    `"200"` pixel widths, respectively) in Figure 7.6.


