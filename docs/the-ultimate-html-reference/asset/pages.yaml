  md: "The same markup would not be acceptable in XHTML, but this would: \n\n`<p>So,\
    \ having failed miserably to manage something as simple as `\n\n` \"order a breakfast\
    \ and pay for it,\" we set about our next task: `\n\n` submitting a visa application\
    \ for our impending visit to `\n\n` Thailand. Heaven help us! We're not normally\
    \ scatty like this, `\n\n` so we really must have needed that breakfast!``**</p>\
    \ **`\n\n`<p>Thankfully, the rest of the day was nothing like our poor start.\
    \ `\n\n` We got the visa submitted and approved without a hitch, so `\n\n` that's\
    \ one less task for us to do now.``**</p> **`\n\nImportantly, while the first\
    \ example would fail validation as XHTML, the second \n\nexample will pass, and\
    \ will *also* pass validation as HTML 3.2. \n\nFor the purposes of forwards-compatibility\
    \ and general good coding practice, it’s \n\nadvisable to use both the opening\
    \ and closing tags even if you’re writing a document \n\nthat uses an earlier,\
    \ looser HTML DTD, such as 3.2 or 4.01—this approach supports \n\ncompleteness,\
    \ rather than shortcuts. \n\nSome developers perceive similarities between the\
    \ `p` and the `div` elements, seeing \n\nthem as being interchangeable, but this\
    \ isn’t the case. The `p` element offers more \n\nsemantic information (“this\
    \ is a paragraph of text, a small collection of thoughts \n\nthat are grouped\
    \ together; the next paragraph outlines some different thoughts”), \n\nwhile the\
    \ `div` element can be used to group almost any elements together. Indeed, \n\n\
    it can contain almost any other element, unlike `p`, which can only contain inline\
    \ \n\nelements. \n\n**Use This For ****…** \n\nThis element may contain any text\
    \ content, but it can’t include any block-level \n\nelements: only inline or phrase\
    \ elements can be included. \n\n**Compatibility **\n\nStructural Elements \n\n\
