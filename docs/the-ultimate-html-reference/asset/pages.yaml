    \ is intended to identify the character set used in the document \n\nthat’s referenced\
    \ within the `link` element. \n\n**Value **\n\nThe value taken by `charset` is\
    \ a standard character set encoding name¹ (e.g. `\"UTF-8\"`) \n\ndefined by IANA.\
    \ \n\n**Compatibility **\n\n**Opera **\n\n**Safari**\n\n**Firefox **\n\n**Internet\
