    `**onselect**`


    `onselect="``*script*``"`


    **Example**


    This attribute might be used when the users have submitted a `form` (p. 241) and
    are presented


    with something that they then need to copy in order to use—for example, some code
    to


    paste into their web page. The form control (`input` or `textarea`) could use
    the `onselect`


    attribute to trigger some kind of JavaScript function that would automatically
    copy the


    text and notify the user that it was saved to the clipboard, ready for them to
    paste:


    `<textarea rows="10" name="generatedCode"`


    `**onselect="copyToClipBoard();"**``\>Text content inside the`


    ` textarea</textarea>`


    The `onselect` attribute is used in forms, specifically on the text `input` (p.
    251) and


    `textarea` (p. 304) form controls. When the user selects any text inside these
    elements,


    either by clicking and dragging the cursor, or using keyboard text selection


    commands (such as pressing Shift + Right arrow key), the `onselect` attribute
    captures


    this event.


