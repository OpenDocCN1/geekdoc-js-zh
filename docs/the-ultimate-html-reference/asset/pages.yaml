  md: 'When you’re introducing a `colspan` attribute, take care to ensure that each
    row is


    equivalent to the number of cells that would ordinary appear in the row. Some


    tables can become quite complicated with a mixture of `colspan` and `rowspan`
    (p. 439)


    attributes, and this is not something that you’re advised to hand-code—that’s
    just


    asking for trouble! It’s much better to use a WYSIWYG editor, such as Dreamweaver,


    MS Expression, or something similar, which will allow you to merge and unmerge


    cells very easily, and takes care of these attributes for you.


    Note that when you use the `rowspan` attribute, you can’t span a cell beyond the


    boundary of its containing rowgroup (namely the `thead` (p. 474), `tfoot` (p.
    444), or


    `tbody` (p. 419) elements). So if the `tbody` comprises ten rows, the `rowspan`
    of a cell


    that’s defined in the first row can’t have a value greater than `"10"`.


    **Value**


    This attribute takes a number, which should equal the number of cells that this


    single `td` should replace. There’s also a special value of `"0"`, which should
    inform


    the browser to span the cell to the end of the current group of columns.


