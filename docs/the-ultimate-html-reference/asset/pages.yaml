    \ cite=\"``*uri*``\" datetime=\"``*datetime*``\"> `\n\n`</ins> `\n\n**Example\
    \ **\n\nThe following text was hastily revised, yet the author chose to identify\
    \ what was changed: \n\n`<p>Bernie enjoyed nothing more than a <del`\n\n` datetime=\"\
    2007-11-05T23:31:05Z\">night out on the town at his`\n\n` favorite drag queen\
    \ show</del> ``**<ins**`\n\n`** datetime=\"2007-11-05T23:33:32Z\">quiet night\
    \ in with a warm cup of**`\n\n`** cocoa</ins>**``</p> `\n\nThe `ins` element is\
    \ used to indicate a change to the document that saw the author \n\ninsert content\
    \ which wasn’t included in an earlier version. If you’re familiar with \n\nthe\
    \ Track Changes tool in Microsoft Word, you can think of `ins` as HTML’s slightly\
    \ \n\nsimplified equivalent. \n\n`ins` can be used to identify anything from a\
    \ specific word or phrase that’s been \n\ninserted (in which case the `ins` is\
    \ deemed to be an inline element) to an entire block \n\nof content, which could\
    \ include a number of nested block-level elements (in this \n\ncase, the `ins`\
    \ is deemed to be a block-level element)."
