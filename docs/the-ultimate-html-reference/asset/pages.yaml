  md: 'The `checked` attribute is also used for radio `input` controls. Unlike the
    checkbox,


    only one in a range of related radio inputs can be selected (see the section on
    radio


    inputs in `type` (p. 267) for more on this), and the `checked` attribute is used
    to identify


    which one is selected. If you accidentally mark as `"checked"` a number of radio


    inputs that share a given `name` attribute, the last one that’s marked as such
    will be


    selected.


    Note that the checkbox’s appearance differs between browsers and operating


    systems—in some, the checked checkbox appears as a ticked or checked box, while


    in others, it’s a crossed box. A radio `input` that’s `"checked"` will almost
    certainly


    *not* look like a tick or a check, but let’s not get hung up on appearances. The
    key is


    to know that the right control is selected!


