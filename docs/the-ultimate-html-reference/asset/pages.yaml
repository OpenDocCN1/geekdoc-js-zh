    FULL \n\n`**hr **`\n\n`<hr/> `\n\n**Example **\n\nIn this example, an `hr` is\
    \ used to separate body content from footer information: \n\n`<p>And with that\
    \ the actress and the bishop made their`\n\n` eventful departure.</p> `\n\n`**<hr/>\
    \ **`\n\n`<div id=\"footer\">&copy; All content copyright 2007. Even`\n\n` the\
    \ unfunny stuff.</div> `\n\nThe `hr` element creates in the document a highly\
    \ visible break that renders as a slim \n\nhorizontal line running the width of\
    \ the area to which it’s applied. While it’s still \n\nperfectly valid to use\
    \ this element in XHTML strict pages, as it’s not on the list of \n\ndeprecated\
    \ elements, it isn’t used a great deal these days, because: \n\n■ It’s difficult\
    \ to style consistently across browsers through CSS, or via its own \n\npresentational\
    \ attributes. \n\n■ In many cases, it may be better to use a combination of headings\
    \ and lists to \n\ndefine the document structure, as this will promote ease of\
    \ navigation for users \n\nof assistive technology; the CSS `border` property\
    \ can be used to visually style a \n\nbreak in the document. \n\nStructural Elements\
    \ \n\n**Use This For ****…** \n\nThe `hr` element can be used to create a break\
    \ in a document at a point where there \n\nmay be a change of thought or meaning,\
    \ but where it may not necessarily be \n\nappropriate to introduce a subheading.\
    \ A real-world equivalent for this element can \n\nbe found in books where a divider\
    \ may appear as three asterisks, or some other \n\ncollection of characters to\
    \ indicate a change of scene or momentum."
