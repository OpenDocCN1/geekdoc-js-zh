    \ comment; don't use hyphens or <> characters to format comment text *\n\n`<p\
    \ <!-- class=\"lively\" -->>Wowzers!</p> `\n\n*It's not possible to comment out\
    \ attributes inside an HTML element *\n\n**HTML Versus XHTML **\n\nThe argument\
    \ about whether to use HTML or XHTML is one that comes up time \n\nand time again.\
    \ Not so long ago, everyone was advising the use of XHTML almost \n\nwithout question,\
    \ for no other reason than that it’s a newer implementation of HTML \n\nand therefore\
    \ the better option. However, many people who once recommended \n\nusing XHTML\
    \ have since changed their minds on the topic—including some \n\nSitePoint authors\
    \ who made very strong arguments as to why examples in their \n\nbooks should\
    \ be presented in HTML 4 rather than XHTML 1.1.^(5 )\n\nIt seems that we need\
    \ to clarify what HTML and XHTML are, what their differences \n\nare, and why\
    \ one or the other should be used. \n\nThe first thing you should realize is that\
    \ using HTML is not wrong as long as you \n\nspecify that you’re using HTML with\
    \ the appropriate doctype (p. 6), and the HTML \n\nyou use is valid for that doctype.\
    \ If you want to use HTML 4.01, no one can stop \n\nyou! Ignore anyone who tells\
    \ you that XHTML is way to go, and that using HTML \n\n5 This is a topic that\
    \ I’ve had to address, as my beginners’ book on HTML and CSS, Build Your Own \n\
    \nWeb Site The Right Way Using HTML & CSS \\[http://www.sitepoint.com/books/html1/\\\
    ], used \n\nXHTML, while the SitePoint Forums members argued about which flavor\
    \ of HTML should be \n\nused. This argument prompted more than a few people who\
    \ bought my book as complete beginners \n\nto ask me directly, “Why do you recommend\
    \ using XHTML while some people say not to use it?” \n\nHTML Concepts"
