    \n`</code> `\n\n**Example **\n\nA snippet of HTML on a reference web site, in\
    \ this case explaining how to use the `cite `\n\nelement, would be marked up like\
    \ this: \n\n`<p>To indicate a reference to a printed work, you'd use`\n\n` the\
    \ ``**<code>cite</code>**`` attribute as follows: ``**<code>&lt;p&gt;My**`\n\n\
    `** favorite book is &lt;cite&gt;The Two**`\n\n`** Towers&lt;/cite&gt;&lt;/p&gt;</code>**``.</p>\
    \ `\n\nThe `code` element’s purpose is to identify computer code—for example,\
    \ a snippet \n\nof HTML or XML, or some other machine-readable code, be that a\
    \ server-side \n\nlanguage such as PERL, or client-side JavaScript. Most browsers\
    \ will render `code `\n\ncontent in a fixed-width font, such as Courier, but this\
    \ style can be overridden using \n\nCSS. \n\nThe `code` element is often used\
    \ in conjunction with the `pre` (p. 200) element (denoting \n\npreformatted text),\
    \ which is used to preserve in source markup important whitespace \n\nand carriage\
    \ returns that HTML and XHTML would otherwise ignore. \n\nThe example shown above\
    \ would display in the browser as depicted in Figure 5.9. \n\n![](img/281615fd250106ce6876c73aa0b8de9a_187_0.png)\n\
    \nFigure 5.9: HTML markup displayed using `code `\n\nNote that because the example\
    \ is one for which an HTML snippet is rendered on \n\nscreen—and is marked up\
    \ with the `code` element—the opening and closing `p` tags"
