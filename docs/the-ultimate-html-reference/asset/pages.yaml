  md: "The `clear` attribute is a deprecated (presentational) attribute that’s used\
    \ to clear \n\nany preexisting right or left alignments. It ensures that the content\
    \ after the `br `\n\nelement appears beneath the baseline of the previously aligned\
    \ element; the `br `\n\ndoesn’t just create a line break in the content that’s\
    \ flowing around the right- or \n\nleft-aligned element. \n\nIn the past, this\
    \ approach would most often have been used to stop content wrapping \n\naround\
    \ a right- or left-aligned image or table. \n\nThe correct way of managing alignment\
    \ issues is to use the CSS `float` property, \n\nrather than the HTML `align`\
    \ attribute. To clear elements, we use the CSS `clear `\n\nproperty like so: \n\
    \n`<br clear=\"left\"/> `*the old-fashioned HTML way *\n\n`<br style=\"clear:left;\"\
    /> `*the CSS way *\n\nNote that you should avoid inline CSS styles—the inline\
    \ style above is provided \n\nfor direct comparison purposes only. \n\n**Value\
    \ **\n\nThis attribute can take a number of values: `\"left\"` or `\"right\"`,\
    \ to clear previous left \n\nor right alignments respectively; `\"all\"`, to clear\
    \ both alignments; and `\"none\"`, to \n\nclear nothing. \n\n**Compatibility **\n\
    \nStructural Elements \n\n**Opera **\n\n**Safari**\n\n**Firefox **\n\n**Internet\
    \ Explorer **\n\n9.5\n\n9.2\n\n3.0\n\n2.0\n\n1.3\n\n2.0\n\n1.5\n\n1.0\n\n7.0\n\
