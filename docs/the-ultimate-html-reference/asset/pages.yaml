  md: '**Chapter ****10**


    **Common Attributes**


    In this section, you’ll find all the attributes that may be applied to all the
    HTML


    elements (unless otherwise stated). These include the core attributes (p. 496)
    that


    may be used for the purposes of styling elements with CSS or scripting to specify


