  md: "Good support is provided for the `value` attribute, but given that it’s a deprecated\
    \ \n\nattribute, you should simply avoid using it. \n\n`**menu **`\n\n`<menu>\
    \ `\n\n`</menu> `\n\nversion \n\nempty\n\ndeprecated \n\nSPEC \n\nList Elements\n\
    \nHTML 2\n\nNO\n\nYES \n\nBROWSER SUPPORT \n\nOp9.2+\n\nSaf1.3+\n\nFF1+\n\nIE5.5+\
    \ \n\nFULL\n\nFULL\n\nFULL\n\nFULL \n\nThe `menu` element was originally intended\
    \ to be used to display lists of menu choices, \n\nand is almost identical in\
    \ its purpose to the `dir` (p. 123) element (except that, unlike \n\n`dir`, the\
    \ `menu` element was *not* intended for multicolumn display). \n\nFor more information,\
    \ visit http://reference.sitepoint.com/html/menu/. \n\nSPEC \n\nversion \n\nempty\n\
    \ndeprecated \n\nHTML 2\n\nNO\n\nNO \n\nBROWSER SUPPORT \n\nOp9.2+\n\nSaf1.3+\n\
    \nFF1+\n\nIE5.5+ \n\nFULL\n\nFULL\n\nFULL\n\nFULL \n\n`**ol **`\n\n`<ol> `\n\n\
    `</ol> `\n\n**Example **\n\nThe `ol` is used here to mark up a list of maintenance\
    \ instructions: \n\n`**<ol>**`\n\n` <li>Remove the outer casing by pushing the\
    \ plastic rivets`\n\n` through.</li>`\n\n` <li>Disconnect the main power harness\
    \ from the inner unit`\n\n` (unclip).</li>`\n\n` <li>Remove connection to the\
    \ glow plug.</li>`\n\n` <li>Extract unit, keeping upright at all times.</li> `\n\
    \n`**</ol> **`\n\nThe `ol` element is similar to the `ul` (p. 136) element in\
    \ that it’s used to group a \n\ncollection of items together in a list. Each list\
    \ item is defined by a `li` (p. 124) element, \n\nwhich suggests an order of importance\
    \ or sequence, as `ol` is an abbreviation of \n\nordered list. The `ol` may be\
    \ used to mark up a series of steps that someone has to \n\nundertake, a table\
    \ of contents, or a numbered list of references."
