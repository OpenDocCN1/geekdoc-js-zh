  md: "This attribute isn’t well supported. Safari and Firefox correctly position\
    \ the links \n\nover the image referenced in the object element, but Internet\
    \ Explorer and Safari \n\ndon’t position the links at all, rendering the technique\
    \ useless. \n\nThe idea behind the technique seems like a good one: you create\
    \ a list of links for \n\nbasic browsers, with the `object` element taking over\
    \ where it’s supported, allowing \n\nthe links to be positioned appropriately\
    \ (an example of progressive enhancement). \n\nHowever, the reality is that although\
    \ most browsers support the `object` element \n\nreasonably well, not all support\
    \ the `coords` and `shape` attributes. Therefore, the \n\nfallback—a basic list—isn’t\
    \ used, and the positioned links fail to have any effect. \n\nIf you wish to achieve\
    \ this kind of effect, use a series of `area` elements contained \n\nwithin a\
    \ `map`, and a simple `img` element (a client-side image map). Alternatively,\
    \ \n\nyou may consider a technique that uses CSS to position links absolutely\
    \ over a \n\nbackground image. \n\nSPEC \n\nversion \n\nrequired \n\ndeprecated\
    \ \n\nHTML 2\n\nNO\n\nNO \n\nBROWSER SUPPORT \n\nOp9.2+\n\nSaf1.3+\n\nFF1+\n\n\
    IE5.5+ \n\nFULL\n\nFULL\n\nFULL\n\nFULL \n\n`**href**`* for <a> *\n\n`href=\"\
    ``*uri*``\" `\n\n**Example **\n\nThe example below shows a link between two documents\
    \ in the same directory on the \n\nserver’s file system: \n\n`<a href=\"cakes.html\"\
    >lovely range of cakes</a> `\n\nText Formatting Elements \n\nThe `href` defines\
    \ the document to which the link leads. This may be a web page in \n\nthe same\
    \ directory, a page somewhere else on the same server, a location within \n\n\
    the current page, or a web page—or any another kind of document—stored on \n\n\
    another server."
