    The `coords` attribute tells the browser the shape of the hotspot. Its use depends
    on


    the type of `shape` (p. 326) that’s being applied, as detailed below.


    **Value**


    The values that are used in the `coords` attribute are as follows:


    ■For rectangular shapes (`"rect"`), the `coords` attribute will take four values:
    *x*1,


    *y*1, *x*2, and *y*2\. These values define the top-left corner of the rectangle
    (how many


    pixels along and down from the image’s top-left corner the boundary will appear),


    and the bottom-right corner (how many pixels along and up from the image’s


    bottom-right corner the boundary will appear).


    ■For circular shapes (`"circ"`), three values are required: *x*, *y*, and *r*.
    The *x* and *y*


    coordinates tell the browser where the circle’s center point is, while the *r*
    value


    specifies the radius of the circle.


    ■Polygonal shapes (`"poly"`), which are almost always created using a WYSIWYG


    HTML editor such as Dreamweaver, are defined by a series of *x*, *y* coordinates,


    each of which relates to a point on the polygon’s outline.


