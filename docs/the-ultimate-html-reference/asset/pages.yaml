  md: "**Chapter ****2 **\n\n**Structural Elements **\n\nThe elements in this section\
    \ are used to provide structure in a web page, for instance, \n\nindicating sections\
    \ on a page with a heading, creating a paragraph, and so on. These \n\nare the\
    \ basic building blocks that you’ll find yourself using on any web page. \n\n\
    Structural Elements"
