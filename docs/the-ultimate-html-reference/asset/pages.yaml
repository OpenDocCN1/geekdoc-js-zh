  md: "The `datetime` attribute contains the time stamp that reflects the time and\
    \ date at \n\nwhich the change was made to the content using the `ins` or `del`\
    \ elements. This \n\nattribute must be formatted precisely, right down to the\
    \ minute and second. \n\n**Value **\n\nThe `datetime` attribute is defined as\
    \ follows (using the ISO8601 date format^(13)): \n\nYYYY-MM-DDThh:mm:ssTZD \n\n\
    Here’s what the various components mean: \n\n■ YYYY: year (e.g. 2007) \n\n■ MM:\
    \ month (e.g. 11 for November) \n\n■ DD: day of the month (e.g. 05) \n\n■ T: required\
    \ character, a separator \n\n■ hh: hour (e.g. 23 for 11.00pm) \n\n■ mm: minutes\
    \ (e.g. 31) \n\n■ ss: seconds (e.g. 05) \n\n■ TZD: Time Zone Designator (Z, which\
    \ appears in the example HTML above, \n\ndenotes Zulu, better known as Greenwich\
    \ Mean Time.) \n\n**Compatibility **\n\nNone of the browsers in the support chart\
    \ do anything useful with the `datetime `\n\nattribute. It would be possible to\
    \ use DOM scripting to retrieve this information for \n\nsome purpose, but natively,\
    \ the most that any of the browsers we tested can do is \n\nshown in the Firefox\
    \ screenshot in Figure 5.12. To access this information, I had \n\nto right-click\
    \ on the text and select **Properties** from the menu that displayed. \n\n13 http://www.w3.org/TR/NOTE-datetime"
