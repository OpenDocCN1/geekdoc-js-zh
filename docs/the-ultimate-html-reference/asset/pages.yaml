    in a


    logical flow and let the browser work through it in the default order—an approach


    that negates the need for the `tabindex` attribute.


    A `tabindex` can start at 0 and increment in any value. As such, the sequence
    1, 2,


    3, 4, 5 would be fine, as would 10, 20, 30, 40, 50. If you need to introduce a
    `tabindex`,


