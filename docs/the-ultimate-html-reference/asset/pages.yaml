  md: "SPEC \n\nversion \n\nempty\n\ndeprecated \n\nHTML 3.2\n\nNO\n\nNO \n\nBROWSER\
    \ SUPPORT \n\nOp9.2+\n\nSaf1.3+\n\nFF1+\n\nIE5.5+ \n\nFULL\n\nFULL\n\nFULL\n\n\
    FULL \n\n`**div **`\n\n`<div> `\n\n`</div> `\n\n**Example **\n\nThe HTML below\
    \ shows two `div`s being used in conjunction with `id` attributes to identify\
    \ \n\ndifferent sections of a web page: \n\n`**<div id=\"main\\_navigation\">\
    \ **`\n\n⋮ \n\n`**</div> **`\n\n`**<div id=\"body\\_content\">**`\n\n` <h1>Page\
    \ heading</h1>`\n\n` <p>Body content</p> `\n\n`**</div> **`\n\nThe `div` is a\
    \ generic block-level element. It doesn’t convey any meaning about its \n\ncontents\
    \ (unlike a `p` element that signifies a paragraph, or an `h1` (p. 46) or `h2`\
    \ (p. 50) \n\nelement that would indicate a level 1 or level 2 heading, respectively);\
    \ as such, it’s \n\neasy to customize it to your needs. The `div` element is currently\
    \ the most common \n\nmethod for identifying the structural sections of a document\
    \ and for laying out a \n\nweb page using CSS. \n\nSome developers perceive similarities\
    \ between the `p` and the `div` elements, seeing \n\nthem as being interchangeable,\
    \ but this isn’t the case. The `p` element offers more \n\nsemantic information\
    \ (“this is a paragraph of text, a small collection of thoughts \n\nthat are grouped\
    \ together; the next paragraph outlines some different thoughts”), \n\nwhile the\
    \ `div` element can be used to group almost any elements together. Indeed, \n\n\
    it can contain almost any other element, unlike `p`, which can only contain inline\
    \ \n\nelements. \n\n**Use This For ****…** \n\nThe `div` is an “anything-goes”\
    \ element—it can contain any inline or block-level \n\nelements you choose, so\
    \ it has no typical content."
