  md: "Every browser listed supports this element type. \n\n**Other Relevant Stuff\
    \ **\n\n`link` (p. 80) \n\n*defines the relationship between the current document\
    \ and other documents or resources *\n\n`**media**`* for <style> *\n\nSPEC\n\n\
    deprecated \n\nrequired \n\nversion \n\n`media=\"`` { ``all`` | ``aural`` | ``braille``\
    \ | ``embossed`` | ``handheld `\n\nOp9.2+\n\nSaf1.3+\n\nFF1+\n\nIE5.5+ \n\nFULL\n\
    \nFULL\n\nFULL\n\nFULL \n\nHTML 4\n\nNO\n\nNO \n\nBROWSER SUPPORT \n\n`| ``print``\
    \ | ``projection`` | ``screen`` | ``tty`` | ``tv`` } ``\" `\n\n**Example **\n\n\
    In this example, we have two different media types to which two different styles\
    \ are \n\napplied: \n\n`<style type=\"text/css\" ``**media=\"screen\"**``\\>`\n\
    \n` #nav {background:#006; padding:2em;} `\n\n⋮ \n\n`</script> `\n\n`<style type=\"\
    text/css\" ``**media=\"print\"**``\\>`\n\n` #nav {display:none} `\n\n⋮ \n\n`</script>\
    \ `\n\nIf your page is to be viewed on a variety of media, you may want to apply\
    \ to it a \n\nnumber of separate styles that are specific to each medium. \n\n\
    For example, a typical web page might include a header area, a block of navigation\
    \ \n\nrunning down the left-hand side, and a sidebar containing related links.\
    \ None of \n\nthis content is of any use to users who print the page—after all,\
    \ you can’t click on \n\na printout of related links to access those resources.\
    \ As such, you might choose to \n\napply certain styles to the page for the screen\
    \ medium (show navigation areas, and \n\nset position, colors, and so on), while\
    \ applying a different set of rules to the page \n\nfor the occasions when it’s\
    \ viewed in a printed medium (perhaps hiding the \n\nnavigation areas entirely).\
    \ \n\nHead Elements"
  merge: -1
