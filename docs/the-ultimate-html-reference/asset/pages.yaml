- img_proc: true
  md: 'When you wrap text with an opening `<span>` and closing `</span>`, you’re simply


    providing a hook—one that allows you to add styles (by adding a `class` attribute


    and using CSS to define the look of that class), or interact with the element
    via


    JavaScript and the Document Object Model (DOM).


    In the example shown here, the author has decided that all brand names should
    be


    classed as `"brandname"` and styled differently via CSS, in italic, uppercase
    letters,


    as Figure 5.27 shows.


    ![](img/281615fd250106ce6876c73aa0b8de9a_228_0.png)


    Figure 5.27: Company names styled via `span` elements


    A `span` is an inline element, and must only contain text content or nested inline
    or


    phrase elements. It shouldn’t be used to surround block-level elements—a usage


    that’s often seen in Content Management Systems which attempt to apply styling


    to almost any element by throwing a span around it.


    The `span` is closely related to the `div` (p. 44) element, which is a block-level
    generic


    container, as opposed to `span`, which is an inline generic container.


    A note of caution: it’s not unheard of for people to go crazy with `span`s, using
    them


    all over the place. `span`\-itis is a bad practice—it’s just as bad as a dose
    of `div`\-itis.


    Be sure to check that you’re using the span element appropriately. For example,
    if


    you find yourself applying spans like this, you’re in trouble:


    `He said it was ``**<span class="important">really</span>**`` important`


    ` to know the difference.`


    It’s clear that in the example above, the `em` (p. 187) element would have been
    more


    appropriate, as it implies emphasis in all browsers. On the other hand, without
    CSS


    styling, `<span class="important">` would be all but meaningless.


    **Use This For ****…**


    This element can be used to mark up text content of any kind.


    Text Formatting Elements'
