  md: "Note that when you use an alternate style sheet, you should also provide a\
    \ title \n\nattribute that briefly describes the style—this will appear in the\
    \ browser’s page style \n\nmenu options, as shown in Figure 3.1. \n\n![](img/281615fd250106ce6876c73aa0b8de9a_96_0.png)\n\
    \nFigure 3.1: The title of the style sheet, as shown in Firefox \n\nOpera also\
    \ offers us the ability to change the page style from the **View** menu option,\
    \ \n\nbut doesn’t otherwise draw attention to the alternate style—you have to\
    \ go hunting \n\nfor it! \n\nThe `\"alternate\"` attribute value may also be used\
    \ in the context of XML feeds, \n\nnamely RSS or Atom, which are indicated with\
    \ the `type` attribute: \n\n`<link rel=\"alternate\" ``**type=\"application/rss+xml\"\
    \ **`\n\n` href=\"/rss.xml\" title=\"RSS 2.0\"> `\n\n`<link rel=\"alternate\"\
    \ ``**type=\"application/atom+xml\" **`\n\n` href=\"/atom.xml\" title=\"Atom 1.0\"\
    > `\n\nIf you want to associate a custom icon with your web site (in most browsers,\
    \ the \n\nicon will appear alongside the URL in the address bar, but may also\
    \ be used when \n\nsaving a page as a favorite or as a shortcut on the desktop,\
    \ depending on the browser \n\nor operating system), you can use the `rel` attribute\
    \ as follows: \n\n`<link rel=\"``**shortcut icon**``\" href=\"/favicon.ico\"/>\
    \ `\n\nHead Elements"
  merge: -1
  pgno: 96
- img_proc: true
  md: "The `link` refers to an icon that sits in the web server’s document root folder,\
    \ and \n\nthe convention is to name it `favicon.ico` (must be a **.ico** file,\
    \ not a **.gif**, **.jpg** or \n\n**.png**). You could place the favorite icon\
    \ elsewhere on the web server, but you’d \n\nhave to amend the location specified\
    \ in the `href` attribute accordingly. \n\nThe relationship aspect of `rel` really\
    \ becomes more rich in terms of context and \n\norientation when the attribute\
    \ is used to define how pages are related to each other. \n\nFor example, in a\
    \ sequence of pages that have a logical, linear flow, you can use \n\nthe `rel`\
    \ attribute to define the `\"next\"` and `\"prev\"` pages in the sequence. \n\n\
    The `rel` attribute can also be used to indicate the license that applies to the\
    \ content \n\non the page, using `rel=\"license\" href=\"link-to-license.html\"\
    `. Refer to \n\nMicroformats’ use of `rel`² for more information about this. \n\
    \nYou could define many custom relationships between pages with the `link` element,\
    \ \n\nby moving beyond the predefined values to specify your own. \n\n**Value\
    \ **\n\nRefer to the syntax diagram for the acceptable predefined values. Remember,\
    \ though, \n\nthat you’re not limited to these alone: you can define your own\
    \ `rel` attribute value, \n\nbut it won’t be of much use to any web browser (although\
    \ you might be able to use \n\nthat information for some other purpose, for example,\
    \ for querying or accessing the \n\nattribute’s value using JavaScript and the\
    \ DOM). \n\n**Compatibility **\n\n**Opera **\n\n**Safari**\n\n**Firefox **\n\n\
    **Internet Explorer **\n\n9.5\n\n9.2\n\n3.0\n\n2.0\n\n1.3\n\n2.0\n\n1.5\n\n1.0\n\
    \n7.0\n\n6.0\n\n5.5 \n\nPartial \n\nPartial \n\nPartial \n\nPartial \n\nPartial\
    \ \n\nPartial \n\nPartial \n\nPartial \n\nPartial \n\nPartial \n\nPartial \n\n\
    The support charts for this element show that partial support is provided by most\
    \ \n\nbrowsers, as some (Firefox and Opera) are able to provide access to alternate\
    \ style \n\nsheets when they’re encountered, but do not alert the user to the\
    \ fact that the \n\nalternatives are present. \n\n2 http://reference.sitepoint.com/html/rel-mf/"
