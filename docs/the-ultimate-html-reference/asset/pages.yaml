    \nFF1+\n\nIE5.5+ \n\nFULL\n\nFULL\n\nFULL\n\nFULL \n\n`**media**`* for <link>\
    \ *\n\n`media=\"`` { ``all`` | ``aural`` | ``braille`` | ``embossed`` | ``handheld\
    \ `\n\n`| ``print`` | ``projection`` | ``screen`` | ``tty`` | ``tv`` } ``\" `\n\
    \n**Example **\n\nThis example shows the application of two different styles for\
    \ two different media: \n\n`<link rel=\"stylesheet\" href=\"basic.css\" ``**media=\"\
    screen\"**``/> `\n\n`<link rel=\"stylesheet\" href=\"print.css\" ``**media=\"\
    print\"**``/> `\n\nIf your page is to be viewed on a variety of media, you may\
    \ want to apply to it a \n\nnumber of separate styles that are specific to each\
    \ medium. \n\nFor example, a typical web page might include a header area, a block\
    \ of navigation \n\nrunning down the left-hand side, and a sidebar containing\
    \ related links. None of \n\nthis content is of any use to users who print the\
    \ page—after all, you can’t click on \n\na printout of related links to access\
    \ those resources. As such, you might choose to \n\napply certain styles to the\
    \ page for the screen medium (show navigation areas, and \n\nset position, colors,\
    \ and so on), while applying a different set of rules to the page \n\nfor the\
    \ occasions when it’s viewed in a printed medium (perhaps hiding the \n\nnavigation\
    \ areas entirely)."
