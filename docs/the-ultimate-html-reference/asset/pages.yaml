  md: 'The `lang` attribute is helpful to users of assistive technology such as screen
    readers


    that can adjust the pronunciation depending on the language used. For example,


    the word *penchant*, meaning “a strong and continued inclination,” is French in


    origin. When the screen reader JAWS encounters the word, it pronounces it similar


    to “pen-chunt,” but when the word is marked up as `<span`


    `lang="fr">penchant</span>`, JAWS reads it using the proper French pronunciation,


    “pon-shont.”


    It may also be possible that marking up documents or sections of a document in


    this way benefits search engines that display results to users who have filtered
    their


    searches on the basis of language preferences. However, the way in which search


    engines *actually* deal with content marked up in this way is a secret they tend
    to


    keep to themselves. As such, the potential for this attribute to make content
    more


    search engine friendly should be considered little more than a lucky bonus.


