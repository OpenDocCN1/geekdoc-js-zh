    \ when all the letters are reversed. `\n\n`**<bdo dir=\"rtl\">Canoe</bdo>**``,\
    \ it seems, is not a`\n\n` palindrome.</p> `\n\nThe `bdo` element is used to reverse\
    \ the direction of text enclosed between the opening \n\n`<bdo>` and closing `</bdo>`\
    \ tags. It will often be used with the `lang` (p. 501) or `xml:lang `\n\n(p. 506)\
    \ attributes, given that a common application of this element is to indicate a\
    \ \n\nchange of language from the rest of the document. \n\n**Use This For ****…**\
    \ \n\nThis element may be used to embed in a page some text that’s in a language\
    \ that \n\ndiffers from the bulk of the document (for example, embedding a phrase\
    \ in Hebrew \n\ninside a paragraph of English); it may also be used for purely\
    \ aesthetic reasons. \n\n**Compatibility **\n\n**Opera **\n\n**Safari**\n\n**Firefox\
    \ **\n\n**Internet Explorer **\n\n9.5\n\n9.2\n\n3.0\n\n2.0\n\n1.3\n\n2.0\n\n1.5\n\
