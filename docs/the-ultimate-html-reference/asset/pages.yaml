    `**value**`* for <input>*


    `value="``*value*``"`


    **Example**


    This code sets a predefined `value` of `"Enter search phrase"` for a text input:


    `<input type="text" name="search" value="Enter search phrase"/>`


    The `value` attribute is used and displayed differently depending on the type
    of form


    control (p. 267) to which it’s applied, as detailed below:


    ■`type` = `"button"`, `"submit"`, `"reset"`


    The text stated in the `value` attribute is used as the button’s text, and can’t
    be


    changed by the user (although it could be changed dynamically via JavaScript).


    ■`type` = `"text"`, `"password"`


    The `value` will appear inside the `form` control and may be overtyped, copied,


    or cut by the user. Note that if it’s displayed in the password field, it will
    be


    obfuscated, but the correct number of characters will appear nonetheless.


    ■`type` = `"radio"`, `"checkbox"`, `"image"`, `"hidden"`


    The `value` won’t be displayed to the user, nor can it be changed, but it will
    be


    associated with the control, and it’s the `value` that’s passed on when the `form`


    is submitted.


    Note that the properties chart doesn’t show the `value` attribute as being required


    for all input types, but in the case of radio and checkbox input types, `value`*
    is*


    required.


    **Value**


    This attribute can take any name or value of the developer’s choosing.'
