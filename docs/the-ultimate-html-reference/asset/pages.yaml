  md: 'a required attribute for the `abbr` (p. 162) and `acronym` (p. 166) elements,
    as it’s used


    to provide the expanded version of the abbreviations contained in those elements.


    The way in which browsers have traditionally rendered `title` content—in a tooltip


    that appears as users mouse over the element in question—has encouraged many


    developers to use it as a space-saving mechanism. They see it as a way to provide


    help without cluttering up the page with extra words, and to make content easy
    to


    find if a user pauses for thought while mousing over a given element. However,
    this


    is not a good technique, for several reasons:


    ■Not everyone uses a mouse, and few browsers render the tooltip content if the


    user has tabbed to that element with the keyboard.


    ■The tooltip content doesn’t appear for long in all browsers. It times out after
    a


    short while, which can potentially prevent the user from reading it properly


    (Opera’s treatment of the tooltip is the exception to this rule).


    ■The tooltip content is often truncated, so it may not be possible to convey the


    desired information in the space provided.


    ■Users who are having difficulty with a section on a page may not move their


    cursor over that specific section, so they may not see the tooltip at all.


    ■The nature of the tooltip means that it’s not possible for the user to print
    out the


    content contained inside the `title`, nor is there any way of copying and pasting


    that text anywhere.


    As such, the `title` attribute should be considered as one that can be used to
    offer


    additional information, but it shouldn’t be *relied* upon. If you have key information


    to present to the user, it should be written directly into the document for all
    to


    see—don’t rely on the browser to display it on the fly.


    **Value**


    Any value can appear within this attribute, but given the problems associated
    with


    the ways browsers present this information, it’s good practice to keep the information


    concise. This will increase your chances of having the content read by the user.


    Common Attributes'
