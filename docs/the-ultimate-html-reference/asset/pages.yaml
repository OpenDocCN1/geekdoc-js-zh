    `**onreset**`


    `onreset="``*script*``"`


    **Example**


    If the `form` must have a **Reset** button, a good use of the `onreset` attribute
    would be to check


    whether the user *really* wanted to clear the form details:


    `<form name="frmPersonalDetails" action="/personal.php"`


    ` onsubmit="checkPersonalDetails();"`


    `**onreset="checkIfReallyWantToReset();"**``\> `⋮` </form>`


    The `onreset` attribute is used only within the context of forms, and is applied


    directly to the `form` (p. 241) element. When the user activates the form’s **Reset**
    button


    (if indeed it has one), the event is captured by this attribute, and can be used
    for


    whatever purpose the developer chooses.


    Note that this attribute is used less commonly these days. **Reset** buttons on
    forms


    themselves have become increasingly rare, since they make it all too easy to


    accidentally wipe out all the details the user has spent time entering.


    **Value**


    This attribute has no fixed value. It’s up to the author to decide on the scripting


    that’s included here, be that a call to one or more defined functions, or a simple


