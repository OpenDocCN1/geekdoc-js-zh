- img_proc: true
  md: "These subtle changes are made possible by the `media` attribute. Indeed, in\
    \ the \n\nexample HTML, we see that the attribute specifies one style sheet for\
    \ the screen \n\nmedium (`\"basic.css\"`), and another for the print medium (`\"\
    print.css\"`). \n\n**Value **\n\nThe acceptable values for `media` are shown in\
    \ the syntax section. You aren’t limited \n\nto just one `media` type per `style`\
    \ element—it’s possible to apply multiple `media `\n\ntypes using a comma-separated\
    \ list. For example, you may wish to apply the main \n\nstyle sheet to `\"screen\"\
    ` and `\"projection\"` (for kiosk, or full-screen displays), like \n\nso: \n\n\
    `<style type=\"text/css\" ``**media=\"screen, projection\"**``\\> `\n\n` #nav\
    \ {background:#006; padding:2em;} `\n\n⋮ \n\n`</script> `\n\n`<style type=\"text/css\"\
    \ ``**media=\"print\"**``\\> `\n\n` #nav {display:none} `\n\n⋮ \n\n`</script>\
    \ `\n\n**Compatibility **\n\n**Opera **\n\n**Safari**\n\n**Firefox **\n\n**Internet\
    \ Explorer **\n\n9.5\n\n9.2\n\n3.0\n\n2.0\n\n1.3\n\n2.0\n\n1.5\n\n1.0\n\n7.0\n\
    \n6.0\n\n5.5 \n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\
    \nFull\n\nFull\n\nFull \n\nThe browsers tested honor the `media` types that they\
    \ are capable of \n\nprocessing—basically the `\"screen\"`, `\"print\"`, and `\"\
    all\"` values. However, once you \n\nstep beyond these values, specifying `\"\
    handheld\"`, `\"tv\"`, and so on, all bets are off. \n\nWhile it’s not the aim\
    \ of this reference to cover all the different media that might \n\nrender web\
    \ content (the handheld part alone, represented by mobile phones, PDAs, \n\nand\
    \ so on, is a minefield of varied support), it would be remiss of me not to warn\
    \ \n\nyou that support for the other media types is unreliable. For example, if\
    \ you specify \n\nthat a style sheet that you’ve crafted to look good on your\
    \ nice, 24-inch, flat-screen \n\nmonitor should only be for `\"screen\"`, and\
    \ you specify a bare, stripped-down version \n\nfor `\"handheld\"`, the chances\
    \ are that many mobile phones will ignore your request \n\nand will try to apply\
    \ your screen style on the handheld device anyway—and they’ll \n\nprobably mangle\
    \ it in the process."
