    mouse to navigate the web page, since there will be no mouse hover event for those


    users—the usual trigger for the tooltip display.


    **Use This For ****…**


    This element is used to create specific clickable hotspots within a single larger


    image, and provides an alternative to the process whereby a larger image is sliced


    into smaller images, and numerous links are created using the `a` (p. 144) element.


    In the past, the `map` and `area` elements have often been used to create navigation


    bars and the like. However, that approach is used with decreasing frequency, as


    CSS support is excellent, and in most cases provides a more suitable mechanism


    for creating navigation blocks.


    Other examples for the usage of the `map` element include:


    ■identifying regions on a map, be they countries on a world map or areas on


    regional maps


    ■outlining locations in a floor plan—for example, a shopping mall or theme park


    ■creating an overlay for a photo whose different components or features need


    identification—for example, highlighting the parts of the inside of a laptop


    computer for the purposes of repair


