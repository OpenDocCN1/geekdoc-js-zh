  md: "SPEC \n\nversion \n\nrequired \n\ndeprecated \n\nHTML 4\n\nNO\n\nNO \n\nBROWSER\
    \ SUPPORT \n\nOp9.2+\n\nSaf1.3+\n\nFF1+\n\nIE5.5+ \n\nFULL\n\nFULL\n\nFULL\n\n\
    FULL \n\n`**accesskey**`* for <a> *\n\n`accesskey=\"``*key*``\" `\n\n**Example\
    \ **\n\nIn this example, an `accesskey` has been defined on the link to the cake\
    \ sales page: \n\n`<a href=\"cakes.html\" ``**accesskey=\"c\"**``\\>lovely range\
    \ of cakes</a> `\n\nThe `accesskey` attribute allows the user to activate a control\
    \ on a page using a \n\nkeyboard shortcut. This may save time for users who would\
    \ otherwise need to tab \n\nthrough a series of form controls or move the mouse\
    \ to get to the desired link. The \n\nkey combination that activates the link\
    \ to which the `accesskey` is applied varies \n\ndepending on the platform and\
    \ browser combination. For IE/Windows, users press \n\nAlt + `accesskey`, while\
    \ Firefox/Windows users press Alt + Shift + `accesskey`; users \n\nof most Mac\
    \ browsers press Ctrl + `accesskey`; in Opera, pressing Shift + Esc displays \n\
    \na list of links for which `accesskey` attributes are defined, allowing users\
    \ to choose \n\nthe key they want to use. \n\nGenerally speaking, browsers do\
    \ not provide any indication to users that an \n\n`accesskey` attribute is defined\
    \ on the link, which is a big issue with the `accesskey`. \n\nMost commonly, the\
    \ `accesskey` value is indicated within a `title` (p. 504) attribute, \n\nbut\
    \ this solution still relies on the user mousing over the element to which the\
    \ \n\naccesskey is applied. As such, you may wish to state the `accesskey` value\
    \ in some \n\nother way, for example: \n\n`<a href=\"cakes.html\" ``**accesskey=\"\
    c\"**``\\>lovely range of cakes `\n\n`** \\[access key = c\\]**``</a> `\n\nAdmittedly,\
    \ this may not be practical or cosmetically pleasing, but without this \n\nhint,\
    \ the user may never realize that an `accesskey` is available."
  merge: -1
