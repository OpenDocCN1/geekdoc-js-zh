- img_proc: true
  md: "would find that, although the document had moved to the correct position on\
    \ \n\nthe screen, the focus will not have shifted. If the user were to tab to\
    \ the next link, \n\nthe focus would move to the link immediately after the link\
    \ the user had selected \n\nfurther up the page, rather than the next link after\
    \ the point in the page at which \n\nthe references are included. \n\n■ It’s possible\
    \ to simply apply an `id` attribute to another element—for example, \n\n`<h3 id=\"\
    refs\">References</h3>`—and some browsers will allow you to activate \n\na link\
    \ and jump to that point. However, not all browsers allow this, the notable \n\
    \ncase being Internet Explorer. That’s why we need the seemingly superfluous \n\
    \nsecond `a` element as an anchor, which is wrapped *around* the text inside the\
    \ `h3`. \n\nThe syntax for this simplified (but not IE-friendly) markup is shown\
    \ below: \n\n`<p>You can check the facts by reading the `\n\n`**<a href=\"#refs\"\
    >**``references at the end of this article``**</a>**``</p> `\n\n⋮ \n\n`<h3 ``**id=\"\
    refs\"**``\\>References</h3> `\n\nIn your own work, you may spot examples that\
    \ include both a `name` and `id` inside \n\nthe anchor `a` element. This approach\
    \ is designed to ensure that the link works in \n\nolder browsers which may not\
    \ allow the user to jump from one part of a document \n\nto another if the `name`\
    \ attribute isn’t present. However, the last of the common \n\nbrowsers that weren’t\
    \ able to link to a section of a page in this way was Netscape \n\n4, which, thankfully,\
    \ is now almost completely obsolete. Also, note that in HTML \n\n5 the `name`\
    \ attribute has been removed, so it’s a good idea to break the habit of using\
    \ \n\n`name`. \n\nIn addition to links to documents (such as web pages or other\
    \ document types), the \n\n`href` attribute may specify a different protocol,\
    \ including: \n\n**ftp **\n\ntyped as `<a href=\"ftp://someftpserver.com/\">Browse\
    \ the FTP `\n\n`server</a>`, which will open a connection to an FTP server \n\n\
    **mailto **\n\ntyped as `<a href=\"mailto:mrwhatever@somedomain.com\">Email `\n\
    \n`me!</a>`, which will trigger an email client to open and create a new \n\n\
    message whose To address matches whatever appears after the `mailto: `\n\nprotocol\
    \ (in this case, an email to mrwhatever@somedomain.com) \n\nText Formatting Elements"
