    ` <label for="chknewsletter">Send me the monthly`


    ` newsletter</label>`


    ![](img/281615fd250106ce6876c73aa0b8de9a_277_0.png)


    Figure 6.7: A checked (or ticked) checkbox


    `**"file"**`


    This input type is used for file uploads. When the attribute is set to


    `"file"`, two controls appear in the browser: a field that looks similar


    to a text input, and a button control that’s labeled **Browse****…**. The text


    that appears on this button can’t be changed, and a file upload control


    is generally difficult to style with CSS. The file upload control has an


    optional attribute, `accept` (p. 252), which is used to define the kinds of


    files that may be uploaded.


    Figure 6.8 shows the rendering of the below markup, which creates a


    file upload control:


    `<input ``**type="file"**`` name="picture" id="picture"`


    ` accept="image/jpeg, image/gif"/>`'
