    `**small**`


    `<small>`


    `</small>`


    **Example**


    Here’s an example of the `small` element in use (nested):


    `<p>Mark tried to get out of buying a round of drinks by getting`


    ` progressively quieter as he talked: "Right, I''m off to stretch my`


    ` legs and then get a bag of peanuts ... ``**<small>back in a minute ...**`


    `** <small>everyone OK for a drink?</small></small>**``</p>`


    The `small` element is a text formatting control that reduces the size of the
    enclosed


    text by one size decrement (based on the old HTML font sizes 1 through 7). Each


    nested `small` element will further decrement the size.


    This element is not deprecated, but is used less frequently now, as there are
    better


    methods for controlling text size (such as CSS), and because the `small` element


    provides no semantic value for any enclosed text—it simply states that the text


    needs to be smaller.


    The example code above would render as shown in Figure 5.26.


    ![](img/281615fd250106ce6876c73aa0b8de9a_226_0.png)


    Figure 5.26: Displaying text to which `small` is applied


    Some people argue that `small` can be used to indicate content that’s less important


    than that nearby. While there is nothing in the current HTML specification to
    support


    it, the HTML5 draft proposal states that, “The `small` element represents small
    print


    (part of a document often describing legal restrictions, such as copyrights or
    other


    disadvantages), or other side comments.” As such, its meaning and usage appears


    to be changing.


    Text Formatting Elements'
