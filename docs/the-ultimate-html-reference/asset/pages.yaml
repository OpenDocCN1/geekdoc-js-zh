  md: "**Readability Considerations **\n\nA browser doesn’t care whether you use a\
    \ single space to separate attributes, ten \n\nspaces, or even complete line breaks;\
    \ it doesn’t matter, as long as some space is \n\npresent. As such, all of the\
    \ examples below are perfectly acceptable (although the \n\nmore spaces you include,\
    \ the larger your web page’s file size will be—each \n\noccurrence of whitespace\
    \ takes up additional bytes—so the first example is still the \n\nmost preferable):\
    \ \n\n`<img src=\"/images/burj.jpg\" alt=\"Burj Al Arab, iconic hotel in `\n\n\
    `Dubai\" class=\"gallery\"/> `\n\n`<img `\n\n` src=\"/images/burj.jpg\" `\n\n\
    ` alt=\"Burj Al Arab, iconic hotel in Dubai\" `\n\n` class=\"gallery\" `\n\n`/>\
    \ `\n\n`<img `\n\n` src=\"/images/burj.jpg\" `\n\n` alt=\"Burj Al Arab, iconic\
    \ hotel in Dubai\" `\n\n` class=\"gallery\"/> `\n\nIn XHTML all attribute values\
    \ must be quoted, so you’ll need to write \n\n`class=\"gallery\"` rather than\
    \ `class=gallery`. It’s valid to omit the quotes from \n\nyour HTML, though it\
    \ *may* make reading the markup more difficult for developers \n\nrevisiting old\
    \ markup (although this really depends on the developer—it’s a \n\nsubjective\
    \ thing). It’s simply easier *always* to add quotes, rather than to have to \n\
    \nremember in which scenarios attribute values require quotes in HTML, as the\
    \ \n\nfollowing piece of HTML demonstrates: \n\n`<a href=\"http://example.org\"\
    > `*needs to be quoted because it contains a / *\n\n`<a href=index.html> `*acceptable\
    \ without quotes in HTML *\n\nAnother reason why it’s a good idea always to quote\
    \ your attributes, even if you’re \n\nusing HTML 4.01, is that your HTML editor\
    \ may be able to provide syntax coloring \n\nthat makes the code even easier to\
    \ scan through. Without the quotes, the software \n\nmay not be able to identify\
    \ the difference between elements, attributes, and attribute \n\nHTML Concepts"
  merge: -1
