    **Example**


    The event handler for the `onmousedown` event calls the function `highlightThis`:


    `<div ``**onmousedown="highlightThis();"**``\>Holiday dates for 2008</div>`


    The `onmousedown` attribute is similar to the `onclick` attribute, but differs
    in that the


    event is triggered the moment the mouse button is pressed on the element, rather


    than at the point at which the mouse button is released (`onclick` is effectively
    a


    combination of `onmousedown` and `onmouseup` event on the element in question).
    This


    event isn’t often seen in practice, possibly because it can so easily cause events
    to


    be triggered accidentally. If you’re using an `onclick` event, the user can move
    the


    cursor off the element, release the mouse button, and avoid triggering the action
    if


    it was an accidental button press; this is not the case with `onmousedown`.


