  md: 'The `button` form control is an attempt at improving the humble `"submit"`
    button


    (`input type="submit"`), which can only contain one line of text (the `value`
    attribute


    (p. 274)), and places certain limitations on the possibilities for CSS styling.
    It’s


    possible to wrap the `button` element around a whole collection of HTML elements,


    encapsulating the entire area as a single, clickable element. Of course, it’s
    not


    necessarily wise to cram too much into the button, but some helpful effects *are*


    possible. For example, this control could be used to add emphasis to part of the


    button text, as Figure 6.1 shows.


    ![](img/281615fd250106ce6876c73aa0b8de9a_239_0.png)


    Figure 6.1: Formatting part of the button text differently from the rest


    By default, the `button` will act as a `"submit"` button, but we can set it, via
    the `type`


    (p. 237) attribute, to be a `"reset"` or a simple `"button"` (with no default
    action—we’d


    need to use JavaScript to add behavior in this case).


    **Use This For ****…**


    This control is used in cases where a simple `"submit"` button isn’t capable of


    containing the information required, or where CSS styling requirements can’t be


    met by a simple `"submit"` button.


