    Despite the fact that the image is absent, both of these browsers honor the `height`


    and `width` attributes of the missing image (if they’re set) and display a placeholder


    frame. If the `alt` text takes up more space than the image’s dimensions, neither


    shows the alternative text properly—it’s a little like looking through a letterbox.


    Safari is even worse, displaying a question mark where the image should appear,


    and no alternative text. Arguably the best of the bunch is Firefox, which doesn’t


    display a placeholder frame, and allows whatever space is required for the alternative


    text, making it a much more usable implementation.


