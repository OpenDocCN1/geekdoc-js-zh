  md: "**About the Author **\n\n**Ian Lloyd** runs Accessify.com, a web accessibility\
    \ site that he started in 2002, and \n\nhas written or co-written a number of\
    \ books on the topic of web standards and \n\ndevelopment, including SitePoint's\
    \ best-selling beginners’ title, *Build Your Own *\n\n*Web Site The Right Way\
    \ using HTML & CSS*. Ian was previously a member of the \n\nWeb Standards Project\
    \ and is a regular speaker at web development conferences, \n\nincluding the highly\
    \ regarded South By Southwest (SXSW) and @media events. He \n\nlives in Swindon,\
    \ UK, with wife Manda and lively terrier Fraggle, and has a bit of \n\na thing\
    \ for classic Volkswagen camper vans. \n\n**About the Expert Reviewers **\n\n\
    **Lachlan Hunt** (http://lachy.id.au/) worked as a front-end web developer, primarily\
    \ \n\ndeveloping with HTML, CSS, and JavaScript, for four years before joining\
    \ Opera \n\nSoftware in late 2007. \n\nAs a developer and advocate of web standards,\
    \ he has participated in the WHATWG \n\n(http://www.whatwg.org/) and various W3C\
    \ working groups, including Web API, \n\nWeb Application Formats, and HTML Working\
    \ Groups, where he actively contributes \n\nto the work on HTML5. \n\n**Tommy\
    \ Olsson** is a pragmatic evangelist for web standards and accessibility who \n\
    \nlives in the outback of central Sweden. Visit his blog at \n\nhttp://www.autisticcuckoo.net/.\
    \ \n\n**About the Technical Editor **\n\n**Toby Somerville** is a serial webologist\
    \ who caught the programming bug back in \n\n2000\\. For his sins, he has been\
    \ a pilot, a blacksmith, a web applications architect, \n\nand a freelance web\
    \ developer. In his spare time he likes to kite buggy and climb \n\nstuff. \n\n\
    **About the Technical Director **\n\nAs Technical Director for SitePoint, **Kevin\
    \ Yank** oversees all of its technical \n\npublications—books, articles, newsletters,\
    \ and blogs. He has written over 50 articles \n\nfor SitePoint, but is best known\
    \ for his book, *Build Your Own Database Driven *"
