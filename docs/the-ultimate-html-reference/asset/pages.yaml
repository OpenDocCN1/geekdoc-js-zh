    **Example **\n\nThe `compact` attribute is applied to a simple definition list\
    \ in the example below: \n\n`<dl ``**compact=\"compact\"**``\\>`\n\n` <dt>Spam</dt>`\n\
    \n` <dd>unsolicited email sent in the hope of increasing sales of some`\n\n` product,\
    \ or simply for the purposes of annoying people</dd>`\n\n` <dt>Spammer</dt>`\n\
