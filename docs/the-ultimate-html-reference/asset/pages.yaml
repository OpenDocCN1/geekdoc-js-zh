  md: "**Chapter ****5 **\n\n**Text Formatting Elements **\n\nThis is easily the largest\
    \ section in this reference, in terms of the number of elements \n\nthat it includes.\
    \ The text formatting elements listed here range from the extremely \n\nuseful\
    \ and oft-used `em` (p. 187) (emphasis) and `strong` (p. 221) (strong emphasis),\
    \ \n\nthrough the peculiar and little-known Ruby markup elements (`ruby` (p. 214),\
    \ `rb `\n\n(p. 204), `rbc` (p. 206), and so on), to the deprecated elements from\
    \ days long gone, \n\nwhich include `marquee` (p. 196), `tt` (p. 224), and `big`\
    \ (p. 175)/`small` (p. 217). \n\nAll the elements included here are inline elements\
    \ elements—they can’t be wrapped \n\naround any block-level elements (with the\
    \ exception of `del` (p. 180) and `ins` (p. 190), \n\nwhose properties allow them\
    \ a special dispensation). \n\nThe `span` (p. 218) element is also listed here.\
    \ Strictly speaking, it’s not a text \n\nformatting element, as it doesn’t offer\
    \ any semantic information on its own. That \n\nsaid, the `span` can’t be wrapped\
    \ around a block element, and is primarily used to \n\nsurround text content for\
    \ the purposes of styling or scripting. It is for this reason \n\nthat it has\
    \ been included in this index rather than in the Structural Elements (p. 27).\
    \ \n\nText Formatting Elements"
