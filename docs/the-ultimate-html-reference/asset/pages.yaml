    PARTIAL \n\nPARTIAL \n\n`**blockquote **`\n\n`<blockquote cite=\"``*uri*``\">\
    \ `\n\n`</blockquote> `\n\n**Example **\n\nThe example below is a quote from an\
    \ as yet unidentified source who despairs about the \n\nstupidity of stock photography:\
    \ \n\n`<blockquote>`\n\n` <p>It's missing alt text, so it's difficult to determine\
    \ what it's`\n\n` supposed to mean. Presumably \"oooh, there's been a global`\n\
    \n` ecological catastrophe and we``’``ve got the last four leaves in the`\n\n\
    ` world and we've patented the DNA\". Or they're rubbing ganja`\n\n` leaves together\
    \ to extract the resin, but are too stupid to`\n\n` recognise Marijuana so are\
    \ trying it with willow or silver`\n\n` birch.</p> `\n\n`</blockquote> `\n\nThe\
    \ `blockquote` element is a mechanism for marking up a block of text quoted from\
    \ \n\na person or another document or source. It may be just a few lines, or it\
    \ may contain \n\nseveral paragraphs (which you’d mark up using nested p (p. 70)\
    \ elements). \n\nThe W3C recommendation states that web page authors should not\
    \ type quotation \n\nmarks in the text when they’re using `blockquote`—we can\
    \ leave it to the style sheets \n\nto take care of this element of presentation\
    \ (just as it should be when the `q` (p. 202) \n\nelement is used for short, inline\
    \ quotations). In practice, though, many authors do \n\nchoose to include quote\
    \ marks, as browser support for automatically inserting the \n\nlanguage-appropriate\
    \ quotation marks is extremely poor. \n\nBy default, most browsers’ basic built-in\
    \ style sheets render `blockquote` content \n\nwith left and right indentations,\
    \ as shown in Figure 2.1. As a consequence, many \n\npeople learned to use `blockquote`\
    \ to indent the text as a way to draw attention to \n\na paragraph or section\
    \ of a page. Of course, this is bad practice—it’s simply the \n\nwrong markup\
    \ for the job. Only use `blockquote` if you’re actually quoting a source; \n\n\
    to visually indent a block of text that’s *not* a quotation, use CSS (`margin-left`,\
    \ or \n\nany other style property you care to choose)."
