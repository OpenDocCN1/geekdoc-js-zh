    This reference covers event attributes that would be used to capture an event,
    and


    trigger an action with a client-side scripting language such as JavaScript.


    A note of caution, though. You might intend to apply any of these inline event


    handlers like so:


    `<span ``**onmouseover="showhoverhelp"**``\>view details</span> `


    However, this is *no longer a recommended technique*, as it mixes the document’s


    structure and content (the HTML) with the behavior (JavaScript). The preferred


    option is to use unobtrusive JavaScript, which negates the need for inline event


    handlers of this type, and keeps the document structure and content layers separate


