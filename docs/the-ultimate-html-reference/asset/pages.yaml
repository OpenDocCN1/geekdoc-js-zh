    The `abbr` attribute is another one that makes no visual difference to the `table`
    and


    its contents but, like the table’s `summary` attribute (p. 417), provides additional


    information that may be useful for people accessing the content using assistive


    technology, such as a screen reader. Its purpose is to provide a shorter version
    of


    the contents of the `th`, so that when content further down the table is put into
    context


    (for example, when a screen reader announces the table header to which a given


    cell relates), it’s not necessary to have to go through what might be a very


    long-winded repetition of the header content. So, in this example, a screen reader


    may announce, “Make: Volkswagen, Model: Golf 2.8 GTi, Revised: June 2007” rather


    than “Car manufacturer (make): Volkswagen, Vehicle model (name/spec): Golf 2.8


    GTi, Date of last revision: June 2007”.


    **Value**


    This attribute takes as its value an abbreviated (but still meaningful) form of
    the `th`


    content.'
