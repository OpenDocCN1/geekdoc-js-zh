  md: "`<p>Well, hello there, ``**<script>writeUserName();</script>**``, `\n\n` how's\
    \ your day been so far?</p> `\n\nNote that there are some important differences\
    \ in the way that HTML 4 and XHTML \n\n1 deal with the content inside scripts.\
    \ \n\nIn HTML 4, the content type is declared as CDATA, which means entity references\
    \ \n\nwon’t be parsed. The first occurrence of `</` followed by a name start character\
    \ \n\nactually terminates the `script` element, so something like this should\
    \ fail: \n\n`document.write(\"<p>Hello!</p>\")`. In practice, although it’s invalid,\
    \ browsers \n\nrecover from that error and don’t terminate the script until they\
    \ reach the `</script> `\n\ntag. Actually, using the `document.write()` statement\
    \ is, in itself, a problem in \n\nXHTML: `document.write()` can’t be used in XHTML\
    \ documents that are served as \n\nXML, due to the way XML is parsed and processed\
    \ (using it modifies the input \n\nstream in a way that isn’t compatible with\
    \ XML parsing requirements). \n\nIn an XHTML 1 document that’s properly served\
    \ using the MIME type \n\n`\"application/xhtml+xml\"`, the content type is declared\
    \ as (`#PCDATA`), so entities \n\nwill be parsed and only a `</script>` tag will\
