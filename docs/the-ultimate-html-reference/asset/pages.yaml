    FULL \n\n`**color**`* for <hr> *\n\n`color=\"``*color*``\" `\n\n**Example **\n\
    \nThis code adds a blue horizontal line below the paragraph: \n\n`<p>And with\
    \ that the actress and the bishop made a rather`\n\n` nice soufflé.</p> `\n\n\
    `<hr ``**color=\"blue\"**``/> `\n\n`<div id=\"footer\">&copy; All content copyright\
    \ 2007. Even`\n\n` the unfunny stuff.</div> `\n\nThe `color` attribute brightens\
    \ up the otherwise dull `hr` element by filling in the hole \n\ncreated by the\
    \ default beveled appearance. \n\n**Value **\n\nThis attribute takes as its value\
    \ a recognized color name (for example, `\"blue\"` or \n\n`\"red\"`)⁸, or a value\
    \ specified in hexadecimal notation (such as `\"#003366\"`). Note \n\nthat it’s\
    \ *not* possible to use shorthand hexadecimal values in HTML as you can in \n\n\
