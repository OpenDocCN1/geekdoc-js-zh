  md: "**Does XHTML Reduce Your Markup Toolset? **\n\nYou may have heard or read that\
    \ choosing XHTML means that you can’t use certain \n\npresentational elements\
    \ such as `center` (p. 176), `font` (p. 188), `basefont` (p. 172), or \n\n`u`\
    \ (p. 225). But this isn’t strictly true. You may use these elements in XHTML\
    \ \n\nTransitional and Frameset just as you could in HTML Transitional and Frameset—the\
    \ \n\ndifference is that they’re not allowed in the Strict versions of these markup\
    \ languages. \n\nHopefully that’s a myth busted! \n\nIf you do opt to use XHTML\
    \ Strict (or HTML Strict), and you thereby lose these \n\npresentational elements,\
    \ you’ll definitely need to rely on CSS to do the work of \n\nprettying things\
    \ up; this approach also places just a little more emphasis on the use \n\nof\
    \ more structurally orientated elements available in HTML and XHTML. But don’t\
    \ \n\nbe led to believe that XHTML is in some way *more* structural than HTML\
    \ 4.01. \n\nYou’re not going to be adding new structural features through your\
    \ use of \n\nXHTML—headings, paragraphs, block quotes, and so on were all present\
    \ in HTML \n\n4.01. \n\nRegardless of the flavor of markup you choose—HTML or\
    \ XHTML—you can easily \n\nmark up your page using a series of `div` (p. 44) and\
    \ `span` (p. 218) elements, style it \n\nentirely in CSS, validate it, and still\
    \ be left with a document that offers no apparent \n\nmeaning or structure about\
    \ the content it contains. In short, the language is only as \n\ngood as the pair\
    \ of hands responsible for crafting it, and thus XHTML doesn’t \n\nguarantee a\
    \ better end result! \n\n**Opting for HTML for Optimized Page Weights **\n\nOne\
    \ possible reason for using HTML 4.01 over XHTML (of any kind or level of \n\n\
    strictness) might be that page size is a very important consideration. For example,\
    \ \n\nyou may be creating a page that needs to be downloaded over a restricted\
    \ connection, \n\nperhaps to a mobile device of some kind. By using HTML 4.01,\
    \ you’re able to reduce \n\nthe markup by not using quote marks and not using\
    \ closing tags where the spec \n\nindicates that they’re optional. \n\nIf you’re\
    \ building your own personal web site, or you’re building a site for an \n\norganization\
    \ that doesn’t have (or expect) huge amounts of traffic, the aim of \n\nachieving\
    \ slightly leaner page weights probably won’t be a *strong* case for using \n\n\
    HTML Concepts"
  merge: -1
  pgno: 28
- img_proc: true
  md: "HTML 4.01. However, if we’re talking about a site that receives a significant\
    \ amount \n\nof traffic, the savings may well add up, so you might need to get\
    \ your calculator \n\nout! For example, if your use of HTML 4.01 means that you\
    \ can omit 100 bytes of \n\ncharacters from a given document (without those deletions\
    \ having an adverse effect \n\non the document’s presentation in the browser),\
    \ and if that document receives one \n\nmillion hits a day, over the course of\
    \ a month that saving will amount to almost \n\n3GB of bandwidth. Now, this is\
    \ just a hypothetical scenario, and this is but one \n\npage in a web site, but\
    \ depending on the number of visitors your site attracts, a \n\nshaving of markup\
    \ here, and a corner cut there—all the while ensuring that your \n\npage validates\
    \ as HTML 4.01—really can encourage you to use HTML rather than \n\nXHTML. \n\n\
    **Serving the Correct MIME Type **\n\nIf you intend to create a web page that\
    \ can be treated as XML and parsed accordingly, \n\nyou’d probably create that\
    \ page in XHTML. You may also want to take this course \n\nof action for the purposes\
    \ of including another XML-based technology such as \n\nMathML or CML (Chemical\
    \ Markup Language) in your page. If you do find yourself \n\nneeding to use those\
    \ technologies, you’re almost certainly not a “typical” web page \n\nauthor, and\
    \ as such, most of what follows won’t really concern you too much … \n\nIn order\
    \ for your page to be interpreted as proper XML, you must serve it with a \n\n\
    MIME type of `\"application/xhtml+xml\"` (normally, web pages are served as \n\
    \n`\"text/html\"`). Once you do so, you’ll have to be *very* careful with the\
    \ coding of \n\nyour web page. One validation slip-up—for example, an unquoted\
    \ attribute value, \n\na non-symmetrical opening and closing of tags, or an unclosed\
    \ tag—and your web \n\npage won’t render at all. Users will be presented with\
    \ a fatal server error of some \n\nkind, which will tell them that the page couldn’t\
    \ be parsed or understood. It’s very \n\nunforgiving! \n\nHere’s a simple test\
    \ that you can try for yourself. Create a simple HTML page using \n\nthe markup\
    \ below: \n\n`<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
    \ `\n\n` \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"> `\n\n`<html\
    \ xmlns=\"http://www.w3.org/1999/xhtml\"> `\n\n` <head> `"
  merge: -1
  pgno: 29
- img_proc: true
  md: "`<title>Page title</title> `\n\n` </head> `\n\n` <body> `\n\n` <h1>Hello world</h1>\
    \ `\n\n` <p>This is a web page.</p> `\n\n` </body> `\n\n`</html> `\n\nNow save\
    \ this document with the file extension `.xhtml`, rather than `.htm` or `.html`.\
    \ \n\nNext, open the file in Firefox, Opera, or Safari. Is everything looking\
    \ okay? Now, \n\nmake a subtle change: amend the closing `</h1>`—and *only* the\
    \ closing `</h1>`—to \n\nuse an uppercase H. Refresh the page and see what happens.\
    \ If everything’s gone \n\nto plan, you’ll now be looking at a broken web page,\
    \ similar to the one shown in \n\nFigure 1.3. \n\nHTML Concepts"
