- img_proc: true
  md: "![](img/281615fd250106ce6876c73aa0b8de9a_158_0.png)\n\nFigure 5.2: A pack of\
    \ stylish mustaches; the linked mustaches are clearly outlined \n\nIf we used\
    \ the client-side image map method to achieve this result, the markup \n\nwould\
    \ be as follows: \n\n`<img src=\"mustaches.png\" alt=\"Mustaches\" width=\"276\"\
    \ `\n\n` height=\"375\" border=\"0\" usemap=\"#Map\"/> `\n\n`<map name=\"Map\"\
    \ id=\"Map\"> `\n\n` <area shape=\"rect\" coords=\"132,117,270,185\" href=\"the-hero.html\"\
    \ `\n\n` alt=\"Monday's mustache - 'The Hero'\"/> `\n\n` <area shape=\"poly\"\
    \ coords=\"136,238,137,301,3,306,3,242\" `\n\n` href=\"the-weasel.html\" alt=\"\
    Thursday's mustache -`\n\n`'The Weasel'\"/> `\n\n`</map> `\n\nThis example code\
    \ consists of `area` elements to which `alt`, `coords`, and `shape `\n\nattributes\
    \ are applied. All of these attributes apply to the `map` element. \n\nNow, let’s\
    \ look at the alternative code, in which the `coords` and `shape` attributes \n\
    \nare applied to `a` elements instead: \n\n`<object data=\"mustaches.png\" alt=\"\
    Mustaches\" type=\"image/png\" `\n\n` width=\"276\" height=\"375\" border=\"0\"\
    \ usemap=\"#Map2\"> `\n\n` <map name=\"Map2\" id=\"Map2\"> `\n\nText Formatting\
    \ Elements"
  merge: -1
  pgno: 158
- img_proc: true
  md: "`<ul> `\n\n` <li><a href=\"the-hero.html\" shape=\"rect\" `\n\n` coords=\"\
    132,117,270,185\">Monday's mustache -`\n\n`'The Hero'</a></li> `\n\n` <li><a href=\"\
    the-weasel.html\" shape=\"poly\" `\n\n` coords=\"136,238,137,301,3,306,3,242\"\
    >Thursday's `\n\n` mustache - 'The Weasel'</a></li> `\n\n` </ul> `\n\n` </map>\
    \ `\n\n`</object> `\n\nIn the second example, the links have been placed inside\
    \ a `ul` (p. 136), and instead \n\nof the `alt` attributes we used for the `area`\
    \ in the first example, the text is contained \n\nwithin the link. The idea is\
    \ that the user will be presented with a list of links in \n\nbrowsers that don’t\
    \ support the `object` element properly. \n\n**Value **\n\nThe values that can\
    \ be entered into the `coords` attribute are as follows: \n\n■ For rectangular\
    \ shapes (`\"rect\"`), the `coords` attribute will take four values: *x*1, \n\n\
    *y*1, *x*2, and *y*2\\. These values define the top-left corner of the rectangle\
    \ (how many \n\npixels along and down from the image’s top-left corner the boundary\
    \ will appear), \n\nand the bottom-right corner (how many pixels along and up\
    \ from the image’s \n\nbottom-right corner the boundary will appear). \n\n■ For\
    \ circular shapes (`\"circ\"`), three values are required: *x*, *y*, and *r*.\
    \ The *x* and *y *\n\ncoordinates tell the browser where the circle’s center point\
    \ is, while the *r* value \n\nspecifies the radius of the circle. \n\n■ Polygonal\
    \ shapes (`\"poly\"`), which are almost always created using a WYSIWYG \n\nHTML\
    \ editor such as Dreamweaver, are defined by a series of *x*, *y* coordinates,\
    \ \n\neach of which relates to a point on the polygon’s outline. \n\n**Compatibility\
    \ **\n\n**Opera **\n\n**Safari**\n\n**Firefox **\n\n**Internet Explorer **\n\n\
