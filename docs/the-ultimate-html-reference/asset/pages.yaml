    `**style**`


    `style="``*css-property*``:``*css-value*``;``…``"`


    **Example**


    If you want to set a paragraph to display in blue and bold, you could use the
    following


    code:


    `<p ``**style="color:blue;font-weight:bold;"**``\>This is a very short`


    ` paragraph. No Booker Prize for me.</p>`


    In Cascading Style Sheets (CSS), a key feature is the cascade itself. In the cascade,


    styles set at different levels take different levels of importance, so a style
    that’s set


    in a globally linked style sheet can be overridden by a style for the same `class`
    or


    `id` that’s included in an embedded style sheet. The `style` (p. 503) attribute
    goes a


    level further, to override styles set in linked or embedded style sheets.


    However, the use of the `style` attribute is generally considered to be a bad
    practice,


    as it causes the presentation to become intrinsically mixed with the content of
    the


    document—a practice that’s almost as bad as using the `font` (p. 188) element
    to style


    text. One way in which you might use inline styles is to debug CSS display issues


    (applying the style at its lowest level in the cascade, and progressively moving


    higher up the cascade until the problem is isolated). You should, therefore, avoid


    using inline `style` attributes in your markup.


    **Value**


    The `style` attribute includes a series of CSS property and value pairs. Each


    `"property"`:`"value"` pair is separated by a semicolon, just as it is when it’s
    typed


    into an embedded or linked style sheet (although there should not be a carriage


    return after the semicolon when the pair is used inside the `style` attribute.


