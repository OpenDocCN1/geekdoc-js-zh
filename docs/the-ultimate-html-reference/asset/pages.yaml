  md: "There’s very little difference between the way browsers render a list that’s\
    \ marked \n\nup with a `ul` and one that’s marked up with an `ol`—with one exception:\
    \ the bullets \n\nin an unordered list are replaced with a series of incrementing\
    \ numbers, as shown \n\nin Figure 4.7. \n\n![](img/281615fd250106ce6876c73aa0b8de9a_139_0.png)\n\
    \nFigure 4.7: Rendering an ordered list with a series of incrementing numbers\
    \ \n\nSome level of customization is provided with the `ol` in terms of the numbering\
    \ style \n\nthat’s used (you can set this style using the `type` (p. 133) attribute),\
    \ but the preferred \n\nmethod for setting the sequence notation is through CSS.\
    \ \n\nThe example above shows a fairly simple set of instructions, but you can\
    \ also nest \n\none or more lists inside a parent list item, perhaps to expand\
    \ upon one of the points. \n\nIf we wanted to expand the “Remove outer casing\
    \ …” section in the list shown in \n\nFigure 4.7, we could start a new unordered\
    \ list inside that list item. The closing \n\n`</li>` for the first list item\
    \ doesn’t appear until after the nested list is completed \n\n(see the notes in\
    \ the markup below): \n\n`<ol> `\n\n` <li>Remove the outer casing by pushing the\
    \ plastic rivets through. `\n\n*<!**—** note that this list item is not closed\
    \ here **—**\\> *\n\n`**<ul> **`\n\n`** <li>They break easily**``**—**``**be gentle!</li>\
    \ **`\n\n`** <li>Avoid pushing them through with a sharp edge, in case **`\n\n\
    `** you slip (it may hurt).</li> **`\n\n`** </ul> **`\n\n` </li> `*<!**—** the\
    \ parent for the nested list is actually closed here **—**\\>*\n\n` <li>Disconnect\
    \ the main power harness from the inner unit `\n\n` (unclip).</li> `\n\n` <li>Remove\
    \ connection to the glow plug.</li> `\n\n` <li>Extract unit, keeping upright at\
    \ all times.</li> `\n\n`</ol> `\n\nThe result of this nesting can be seen in Figure\
    \ 4.8."
