  md: "In addition to these points, there are a number of differences between the\
    \ way that \n\nan XHTML document handles scripts and the way it handles style\
    \ sheets, including: \n\n■ There are requirements for the way in which comments\
    \ inside scripts should be \n\nhandled; Lachlan Hunt covers this topic thoroughly\
    \ in his blog entry, “HTML \n\nComments in Scripts.”^(8 )\n\n■ `document.write()`\
    \ and `document.writeln()` do not work in XHTML. \n\n■ `innerHTML` property is\
    \ also ignored by some user agents. \n\n■ As XHTML is case sensitive, there can\
    \ be an issue with element and attribute \n\nnames in DOM methods. For example,\
    \ `onClick` and `onSubmit` are invalid, while \n\n`onclick` and `onsubmit` are\
    \ valid. \n\nThe list above might discourage some newcomers from learning the\
    \ XHTML \n\nsyntax—it does certainly appear that, at the very least, XHTML requires\
    \ more \n\ndiscipline and thought than HTML! However, one advantage of learning\
    \ XHTML \n\nsyntax rather than the looser HTML syntax it is that if you stick\
    \ to the rules I’ve \n\noutlined above, you’ll be creating pages that render just\
    \ as HTML would in the \n\nbrowser, but which also validate as XHTML. The presence\
    \ of some XHTML-specific \n\nattributes—namely the `xmlns` attribute in the root\
    \ element, and the use of `xml:lang `\n\nrather than `lang`—does mean that you\
    \ can’t simply change the doctype (p. 6) of a \n\nvalid XHTML document back to\
    \ an HTML doctype and have the page validate, \n\nthough. It will contain features\
    \ that are not understood by, or accepted in, the HTML \n\nspecifications. \n\n\
    So, there’s nothing wrong with learning the HTML 4.01 syntax to begin with, and\
    \ \n\nprogressing to XHTML when you feel more comfortable doing so. The transition\
    \ \n\nfrom HTML to XHTML doesn’t have to be a massive step, although some of the\
    \ \n\nhabits you’ll have picked up while you were marking up HTML documents will\
    \ \n\nneed to be unlearned to make this a successful transition. Learning HTML\
    \ 4.0 is \n\nnot a bad thing, and it doesn’t make you a lazy coder—it’s just *different*\
    \ from XHTML. \n\n8 http://lachy.id.au/log/2005/05/script-comments/"
  merge: -1
