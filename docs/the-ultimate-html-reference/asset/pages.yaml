  md: 'by the body of the table wrapped in a `tbody` (p. 419), the footer content
    should


    naturally follow that . But this is not the case. Oddly enough, like a biology


    experiment gone wrong, the correct order for these elements is head, foot, body
    (or


    `thead`, `tfoot`, `tbody`, to use the correct element names).


    There are reasons for this apparently illogical approach. By providing the table’s


    header and footer content up-front in the `thead` and `tfoot` elements, respectively,


    the browser has the opportunity to render that information first, then incrementally


    fill the body of the table. This approach is often desirable when you’re accessing


    the content over a very slow connection, or when the table runs to a considerable


    length (or both!).


    Despite the `tfoot` content coming before the body of the table, the browsers
    we


    tested correctly identify that it’s intended as footer content, and place it in
    the


    appropriate location—at the end of the table—as Figure 8.13 shows.


    ![](img/281615fd250106ce6876c73aa0b8de9a_454_0.png)


    Figure 8.13: The footer content appears after the body, despite coming before
    it in the source


