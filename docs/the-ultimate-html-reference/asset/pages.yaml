  md: "The `base` element, which is contained in the head of the document, provides\
    \ a \n\nmethod for defining the base URL (p. 77) for all links and form submissions\
    \ on a \n\npage. It also provides a common target (p. 79) (in the form of a named\
    \ window) for \n\nall of these links or form submissions. \n\nThis element isn’t\
    \ used very often these days, as making links is usually a simple \n\ncase of\
    \ creating links to documents relative to the web server root, like so: \n\n`I've\
    \ published my <a href=\"``**/travel-writing/**``\">holiday diaries</a>, `\n\n\
    ` including the <a `\n\n`href=\"``**/travel-writing/prague/2006/day2.html**``\"\
    >crazy `\n\n` bone church at Kutna Hora</a> `\n\nWhen the links are accessed,\
    \ the server will look for the document’s reference in \n\nthe domain root, regardless\
    \ of the location of the page that contains these links. It \n\ndoesn’t matter\
    \ one iota whether the referencing page is in the web server’s document \n\nroot\
    \ folder, or ten directory levels down—the server still looks in the root because\
    \ \n\nthe links begin with a `\"/\"` character. \n\n**Use This For ****…** \n\n\
    Using the `\"/\"` character to signify a link relative to the server’s document\
    \ root is \n\nfine, provided you’re running the pages from a server. However,\
    \ there are many \n\nscenarios where this isn’t going to be the case—documents\
    \ that are installed and \n\nrun locally (for example, a set of help files that\
    \ are installed on a machine) will not \n\nwork with this technique. The `base`\
    \ element allows you achieve the effect of smaller \n\nlink `href` attributes\
    \ by supplying a domain and even subdirectories. \n\nThe `base` element is only\
    \ going to be useful to you if *all* your relative links or form \n\nsubmissions\
    \ go to the same location. If your web page contains a mixture of links \n\nto\
    \ different domains or subdirectories on the same server, the `base` element will\
    \ be \n\na hindrance, not a help. \n\n**Compatibility **\n\n**Opera **\n\n**Safari**\n\
