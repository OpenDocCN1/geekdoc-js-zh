  md: "**Chapter ****1 **\n\nHTML Concepts \n\n**HTML Concepts **\n\nConfused about\
    \ when to use HTML and when to use XHTML? Want to know what \n\nthe syntax differences\
    \ are between the two? Do doctypes and DTDs leave you all \n\ndiscombobulated?\
    \ Or perhaps you’d simply like to understand the basic structure \n\nof a web\
    \ page? \n\nThis section deals with the high-level concepts relating to HTML and\
    \ XHTML, \n\nrather than the specific elements or attributes. Even if you think\
    \ you know HTML \n\nreally well, there may be one or two surprises in this section\
    \ (yes, even for you, \n\nthere, at the back—the hardened HTML hacker who’s been\
    \ doing it for years!). \n\n**Basic Structure of a Web Page **\n\nWhile this reference\
    \ aims to provide a thorough breakdown of the various HTML \n\nelements and their\
    \ respective attributes, you also need to understand how these \n\nitems fit into\
    \ the bigger picture. A web page is structured as follows."
  merge: -1
  pgno: 10
- img_proc: true
  md: "**The Doctype **\n\nThe first item to appear in the source code of a web page\
    \ is the doctype (p. 6) \n\ndeclaration. This provides the web browser (or other\
    \ user agent) with information \n\nabout the type of markup language in which\
    \ the page is written, which may or may \n\nnot affect the way the browser renders\
    \ the content. It may look a little scary at first \n\nglance, but the good news\
    \ is that most WYSIWYG web editors will create the doctype \n\nfor you automatically\
    \ after you’ve selected from a dialog the type of document you’re \n\ncreating.\
    \ If you aren’t using a WYSIWYG web editing package, you can refer to the \n\n\
    list of doctypes contained in this reference (p. 6) and copy the one you want\
    \ to \n\nuse. \n\nThe doctype looks like this (as seen in the context of a very\
    \ simple HTML 4.01 page \n\nwithout any content): \n\n`**<!DOCTYPE html PUBLIC\
    \ \"-//W3C//DTD HTML 4.01//EN\" **`\n\n`** \"http://www.w3.org/TR/html4/strict.dtd\"\
    > **`\n\n`<html> `\n\n` <head> `\n\n` <title>Page title</title> `\n\n` </head>\
    \ `\n\n` <body> `\n\n` </body> `\n\n`</html> `\n\nIn the example above, the doctype\
    \ relates to HTML 4.01 Strict. In this reference, \n\nyou’ll see examples of HTML\
    \ 4.01 and also XHTML 1.0 and 1.1, identified as such. \n\nWhile many of the elements\
    \ and attributes may have the same names, there are \n\nsome distinct syntactic\
    \ differences between the various versions of HTML and \n\nXHTML. You can find\
    \ out more about this in the sections entitled HTML Versus \n\nXHTML (p. 15) and\
    \ HTML and XHTML Syntax (p. 11). \n\n**The Document Tree **\n\nA web page could\
    \ be considered as a document tree that can contain any number \n\nof branches.\
    \ There are rules as to what items each branch can contain (and these \n\nare\
    \ detailed in each element’s reference in the “Contains” and “Contained by” \n\
    \nsections). To understand the concept of a document tree, it’s useful to consider\
    \ a"
  merge: -1
  pgno: 11
- img_proc: true
  md: "simple web page with typical content features alongside its tree view, as shown\
    \ in \n\nFigure 1.1. \n\n![](img/281615fd250106ce6876c73aa0b8de9a_12_0.png)\n\n\
    HTML Concepts\n\n**g**\n\nFigure 1.1: The document tree of a simple web page \n\
    \nIf we look at this comparison, we can see that the `html` element in fact contains\
    \ two \n\nelements: `head` and `body`. `head` has two subbranches—a `meta` element\
    \ and a `title`. \n\nThe `body` element contains a number of headings, paragraphs,\
    \ and a `blockquote`. \n\nNote that there’s some symmetry in the way the tags\
    \ are opened and closed. For \n\nexample, the paragraph that reads, “It has lots\
    \ of lovely content …” contains three \n\ntext nodes, the second of which is wrapped\
    \ in an `em` element (for emphasis). The \n\nparagraph is closed after the content\
    \ has ended, and before the next element in the \n\ntree begins (in this case,\
    \ it’s a `blockquote`); placing the closing `</p>` after the \n\n`blockquote`\
    \ would break the tree’s structure. \n\n`**html **`\n\nImmediately after the doctype\
    \ comes the `html` (p. 69) element—this is the root \n\nelement of the document\
    \ tree and everything that follows is a descendant of that \n\nroot element. \n\
    \nIf the root element exists within the context of a document that’s identified\
    \ by its \n\ndoctype as XHTML, then the `html` element also requires an `xmlns`\
    \ (XML Namespace) \n\nattribute (this isn’t needed for HTML documents):"
  merge: -1
