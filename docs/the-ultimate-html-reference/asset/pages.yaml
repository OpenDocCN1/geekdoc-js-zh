    \ to you to look like some kind`\n\n` of circus freak?</p> `\n\nThe `em` element\
    \ is used to emphasize text content, and displays in italics in all \n\ncurrent\
    \ browsers. It provides semantic meaning about the text it contains, effectively\
    \ \n\nsaying, “this text is slightly more important than other text here.” This\
    \ differentiates \n\n`em` from the `i` (p. 189) element, which merely sets the\
    \ font to italics. In most cases, \n\n`em` is the preferred element to use. \n\
    \nThe example code above would render as shown in Figure 5.14. \n\n![](img/281615fd250106ce6876c73aa0b8de9a_196_0.png)\n\
    \nFigure 5.14: Displaying text marked up with `em` in the browser \n\nThe `em`\
    \ element shouldn’t be used simply to italicize text; the fact that emphasized\
    \ \n\nText Formatting Elements \n\ntext is rendered in italics is coincidental.\
    \ If you have a burning desire to make text \n\nitalic, but not for the purposes\
    \ of emphasis, use CSS instead. \n\n**Use This For ****…** \n\nThis element is\
    \ used to mark up text content of any kind that needs moderate \n\nemphasis. \n\
