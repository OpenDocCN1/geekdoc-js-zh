    There is some variety in the way that the `accesskey` is activated. The biggest
    problem


    with this attribute is that the keystrokes you’ve defined may clash with other


    technologies. For example, a user may have assistive technology (such as a screen


    reader or screen magnifier) that shares keystrokes with those that you’ve defined


    in the `accesskey` attribute. In addition, different language browsers use different


    “accelerator keys” for their own menu options, and these may also clash with the


    access keys you’ve defined. In such cases, the `accesskey` may not work as you


    intended for all users, and as such, many web standards advocates strongly


    discourage its use. However, `accesskey` can have a role in documents that are
    used


    in controlled environments, such as intranets or for point-of-sale environments,
    in


    which you know exactly which browsers and languages the users can access. In


    such cases, using a standard set of `accesskey` attributes may be of great benefit.'
