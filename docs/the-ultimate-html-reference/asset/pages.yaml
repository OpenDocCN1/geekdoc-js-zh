    `**lang**`


    `lang="``*language code*``"`


    **Example**


    This markup specifies the language of a page as English:


    `<html ``**lang="en"**``\>`


    The `lang` attribute is used to identify the language of the content on a web
    page,


    when it’s applied to the `html` element, or within a given section on a web page,


    when it’s applied to a `div`, `span`, `a`, or any other element that may contain
    content


    in a language that differs from that used on the rest of the page. Changing the


    language at a lower level in the document tree overrides the language code that’s


    set higher up, but *only* for the nested element to which the different language
    code


    is applied.


    The intention of the `lang` attribute is to allow browsers (and other user agents)
    to


    adjust their displays. For example, if you use the `q` (p. 202) element, a browser
    should


    be able to identify the language in use and present the appropriate style of quotation


    marks. In practice, though, poor support for the `q` element sees few developers
    use


    it—instead, many hard-code quotation marks. This is something of a catch-22


    situation.


