    `**col**`


    `<col align="`` { ``center`` | ``char`` | ``justify`` | ``left`` |`


    `right`` } ``"span="``*number*``" valign="`` { ``baseline`` | ``bottom`


    `| ``middle`` | ``top`` } ``" width="`` { ``*number*`` | ``*percentage*`` } ``">`


    `</col>`


    **Example**


    Below, the `col` element is used to set different `class` (p. 496) attributes
    on the first three


    columns in the table (which can then be styled with CSS):


    `<table border="1">`


    `**<col class="col1"/>**`


    `** <col class="col2"/>**`


    `** <col class="col3"/>**`


    `** <col/>**`


    ` <tr>`


    ` <th colspan="4" scope="col">Work Contact Points</th>`


    ` </tr>`


    ⋮


    `</table>`


    Tables are primarily constructed by defining rows, but it’s often useful to define


    their structure as columns as well. Unlike rows, columns don’t directly contain
    any


    cells; rather, they implicitly group adjacent cells between rows. This may not
    seem


    important, but it means that there isn’t an easy way to select a column for styling


    purposes (the best you could do was to set a `width` attribute on the top-most
    table


    cells, be they `th` or `td` elements).


    The `col` element aims to solve the problem by providing a mechanism for selecting


    columns and applying the necessary attributes. The idea is that you can use the
    `col`


    element to define all of your columns’ attributes—alignment, colors, and so on,


    up-front, before you begin the process of writing out each row.


    The `col` element can appear on its own (as shown in the HTML example above,


    there’s one `col` for each of the subsequent rows’ cells, with alignments set
    only for


    the first three columns), but it can also appear inside a `colgroup` (p. 394)
    element.


    Table Elements'
