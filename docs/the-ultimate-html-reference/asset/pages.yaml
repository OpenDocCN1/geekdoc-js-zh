  md: "![](img/281615fd250106ce6876c73aa0b8de9a_173_0.png)\n\nFigure 5.4: The `title`\
    \ attribute of `abbr` shown in Opera 9.2 \n\nAs a result of the compatibility\
    \ issues associated with it, many people prefer not to \n\nuse this element. Instead,\
    \ they write it out in full in the document in the first \n\ninstance, as follows:\
    \ \n\n`<p>The page had the phrase ``**PTO (Please Turn Over)**`` written on it.\
    \ If `\n\n` only I knew what PTO meant! So I turned the page to see if that `\n\
    \n` revealed the answer.</p> `\n\nThe ways in which browsers deal with the `abbr`\
    \ element—presenting it in a tooltip, \n\nunderlined, italicized, and so on—do\
    \ little to help users reading the content in \n\nprinted form. This provides\
    \ yet another reason to simply write out the abbreviation \n\nin the text, as\
    \ shown in the HTML above. You may consider using generated content \n\nin CSS\
    \ instead, but that approach is hindered by some browser support limitations.\
    \ \n\nDespite variations in the presentation of `abbr` content, the support chart\
    \ shows that \n\nfull support is provided by all browsers (except for IE 6 and\
    \ earlier), as there are no \n\nguidelines in the W3C specifications to indicate\
    \ how browsers should treat such \n\ncontent. If the element is exposed in the\
    \ DOM tree, and if the browser does something \n\nwith it, that constitutes full\
    \ support. \n\n**Other Relevant Stuff **\n\n`acronym` (p. 166) \n\n*an abbreviation\
    \ comprising the initial letters of a given phrase *"
