  md: "The `rev` attribute is essentially the reverse of the `rel` (p. 156) attribute.\
    \ The `rev `\n\ndefines what *this* document is in relation to the document to\
    \ which it links (as \n\ndefined in the `href` (p. 151) attribute). To put this\
    \ in colloquial terms (note that these \n\nvalues are not real values!): \n\n\
    ■ `rel` = \"*This is what I call that fellow over there.*\" \n\n■ `rev` = \"*This\
    \ is what that fellow over there thinks I am.*\" \n\n**Value **\n\nThis attribute\
    \ can take any value—even a series of space-separated values. Some \n\nconventions\
    \ are beginning to form around the use of the `rel` attribute (there’s more \n\
    \nabout this in Microformats⁴). \n\n**Compatibility **\n\n**Opera **\n\n**Safari**\n\
    \n**Firefox **\n\n**Internet Explorer **\n\n9.5\n\n9.2\n\n3.0\n\n2.0\n\n1.3\n\n\
    2.0\n\n1.5\n\n1.0\n\n7.0\n\n6.0\n\n5.5 \n\nNone\n\nNone\n\nNone\n\nNone\n\nNone\n\
    \nNone\n\nNone\n\nNone\n\nNone\n\nNone\n\nNone \n\nThe support charts for this\
    \ element show that there’s no support, as no browser \n\nrenders the links that\
    \ use this attribute any differently from normal links. The real \n\nvalue of\
    \ adding a `rev` (or `rel`) attribute is gained either by utilizing it to add\
