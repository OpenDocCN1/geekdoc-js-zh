    The `disabled` attribute stops the user from interacting with the `form` control.
    In this


    case, it stops the user clicking on the `button`, or tabbing to it using the keyboard—it


    prevents the user from activating the control.


    The most likely use for this attribute is to disable a `button` until such a time
    as some


    other condition has been met (for instance, a checkbox is ticked to confirm the


    acceptance of terms and conditions). At that point, JavaScript would be required


    to removed the `"disabled"` value and make the form control usable.


