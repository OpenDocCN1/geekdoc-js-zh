  md: "The `type` attribute allows the developer to apply some basic alternative styling\
    \ to \n\nthe bullet point that accompanies each list item. \n\nThis attribute\
    \ is now deprecated, and is highly presentational in its nature. The \n\ndesired\
    \ visual effects can all be achieved with CSS and, as such, this attribute \n\n\
    shouldn’t be used—it’s presented here for informational purposes only. \n\n**Value\
    \ **\n\nThe options are `\"disc\"` (the browser default: a filled circle), `\"\
    circle\"` (an outline \n\nof a circle that’s not filled in), and `\"square\"`\
    \ (a filled square, not an outline). \n\n**Compatibility **\n\n**Opera **\n\n\
    **Safari**\n\n**Firefox **\n\n**Internet Explorer **\n\n9.5\n\n9.2\n\n3.0\n\n\
    2.0\n\n1.3\n\n2.0\n\n1.5\n\n1.0\n\n7.0\n\n6.0\n\n5.5 \n\nFull\n\nFull\n\nFull\n\
    \nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull \n\nGood support\
    \ is provided for the `type` attribute. However, given that it’s a deprecated\
    \ \n\nattribute whose effects can be achieved—and massively improved upon (for\
    \ example, \n\nyou can use background imagery of your choosing, rather than picking\
    \ from a small \n\nselection of basic glyphs)—using CSS, you can avoid using this\
    \ attribute altogether."
