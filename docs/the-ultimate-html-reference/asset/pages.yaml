    **Example**


    Here’s an example of the `q` element in use:


    `<p>Heck, even Bill Gates is quoted as saying <q>We need`


    ` Microformats,</q> which can only be a good thing for the cause.</p>`


    The `q` element is little brother (or sister) to the `blockquote` (p. 28) element.
    Where


    `blockquote` creates a distinct block of quoted text, the more svelte `q` element
    is used


    for inline quotations. It’s intended that the browser should insert the necessary


    quotation marks, the style of which should depend on the language of the document


    or that section of the document, rather than the author adding quotation marks,


    which can cause double quotation marks to appear.


    The example code above would render as shown in Figure 5.20.


    ![](img/281615fd250106ce6876c73aa0b8de9a_211_0.png)


    Figure 5.20: `q` in action


    **Use This For ****…**


    This element is used to mark up a quotation, possibly with attribution in the
    form


    of a `cite` attribute, although this is optional.'
