  md: "**Value **\n\nThis attribute takes a standard character set encoding name (such\
    \ as `\"UTF-8\"`). \n\n**Compatibility **\n\n**Opera **\n\n**Safari**\n\n**Firefox\
    \ **\n\n**Internet Explorer **\n\n9.5\n\n9.2\n\n3.0\n\n2.0\n\n1.3\n\n2.0\n\n1.5\n\
    \n1.0\n\n7.0\n\n6.0\n\n5.5 \n\nNone\n\nNone\n\nNone\n\nNone\n\nNone\n\nNone\n\n\
    None\n\nNone\n\nNone\n\nNone\n\nNone \n\nNone of the browsers tested appear to\
    \ do anything to notify the user that the linked \n\ndocument would be presented\
    \ in any special (or different) character encoding. As \n\nsuch, this attribute\
    \ has no real use, and can safely be ignored at this time. \n\nSPEC \n\nversion\
    \ \n\nrequired \n\ndeprecated \n\nHTML 3.2\n\nNO\n\nNO \n\nBROWSER SUPPORT \n\n\
    Op9.2+\n\nSaf3\n\nFF1+\n\nIE7 \n\nFULL\n\nNONE\n\nFULL\n\nNONE \n\n`**coords**`*\
    \ for <a> *\n\n`coords=\"``*coordinates*``\" `\n\n**Example **\n\nThis `coords`\
    \ attribute defines the top-left and bottom-right coordinates for a rectangular\
    \ \n\nshape: \n\n`<a href=\"the-hero.html\" shape=\"rect\" ``**coords=\"132,117,270,185\"\
    **``\\>`\n\n` Monday's mustache - 'The Hero'</a> `\n\nThe `coords` attribute is\
    \ applied to a link (`a` (p. 144) element) when the link is \n\ncontained inside\
    \ an `object` (p. 355) element. It’s used to position the link over the \n\ntop\
    \ of an image. If you think this sounds like an image map, you’re right. You can\
    \ \n\nuse the `coords` and `shape` (p. 159) attributes with an `a` element to\
    \ create the same \n\neffect you’d achieve using a series of `area` (p. 318) elements\
    \ in conjunction with a \n\n`map` (p. 352). Although they do much the same thing,\
    \ it’s useful to compare the two \n\nmethods. First, let’s see the image, which\
    \ is shown in Figure 5.2."
