    The `accesskey` attribute allows the user to activate a control on a page using
    a


    keyboard shortcut. This may save time for users who would otherwise need to tab


    through a series of form controls or move the mouse to get to the desired link.
    The


    key combination that activates the link to which the `accesskey` is applied varies


    depending on the platform and browser combination. For IE/Windows, users press


    Alt + `accesskey`, while Firefox/Windows users press Alt + Shift + `accesskey`;
    users


    of most Mac browsers press Ctrl + `accesskey`; in Opera, pressing Shift + Esc
    displays


    a list of links for which `accesskey` attributes are defined, allowing users to
    choose


    the key they want to use.


    Generally speaking, browsers don’t indicate that an `accesskey` attribute is defined


    for a form control, and this lack of discoverability is a problem. The most common


    method for indicating the `accesskey` value is to place it in a `title` (p. 504)
    attribute


    of the element to which it’s applied. However, for this approach to work, the
    user


    must mouse over the element in question. You may want to state the `accesskey`


    value in some other way—for example:


    `<label for="favoritefood">Favorite food ``**\[access key = f\]**``</label>`


