  md: "**Compatibility **\n\nBrowser support is generally good, but you can’t rely\
    \ on support for scripting \n\nlanguage version numbers alone to decide whether\
    \ to execute a piece of script or \n\nnot. \n\nSPEC \n\nversion \n\nrequired \n\
    \ndeprecated \n\nHTML 4\n\nNO\n\nNO \n\nBROWSER SUPPORT \n\nOp9.2+\n\nSaf1.3+\n\
    \nFF1+\n\nIE5.5+ \n\nFULL\n\nFULL\n\nFULL\n\nFULL \n\n`**src**`* for <script>\
    \ *\n\n`src=\"``*uri*``\" `\n\n**Example **\n\nIn this example, the `src` attribute\
    \ refers to a script file named `\"complex.js\"`: \n\n`<script type=\"text/javascript\"\
    \ ``**src=\"/scripts/complex.js\"**``\\></script> `\n\nThe power of JavaScript\
    \ is revealed when common functionality can be shared \n\nacross a web site, rather\
    \ than needing to be embedded at the page level over and \n\nover again. To achieve\
    \ this goal, all you need to do is create your JavaScript in a \n\nstandalone\
    \ file, save it with the **.js** extension, and then refer to it using the `src\
    \ `\n\nattribute in the `script` element. The same rules about locating the resource\
    \ apply \n\nas they do to other external resources (images, links to other pages,\
    \ and so on). \n\nIncluding `\"../\"` in the `src` indicates that the browser\
    \ should request the file from \n\na directory one level above the current directory\
    \ (that is, the directory in which the \n\nreferring page resides), and `\"/\"\
    ` indicates that the browser should start looking in \n\nthe domain document root.\
    \ \n\nIf the `src` attribute contains a valid URI, the browser should ignore any\
    \ content \n\nthat’s found inside the opening `<script>` and closing `</script>`\
    \ tags, as illustrated \n\nin this code: \n\n`<script type=\"text/javascript\"\
    \ src=\"/scripts/complex.js\"> `\n\n` //the next line should be ignored if /scripts/complex.js\
    \ exists `\n\n` alert(\"Well howdi ho, pardners!\"); `\n\n`</script> `"
