    `**caption**`


    `<caption>`


    `</caption>`


    **Example**


    Here’s a table `caption` that provides a visual summary and heading all in one:


    `<table border="1">`


    `**<caption>Interest Rates for Young Saver Accounts</caption>**`


    ` <tr>`


    ` <th>Account Type</th>`


    ` <th>Interest Rate</th>`


    ` </tr>`


    ` <tr>`


    ` <td>Smart</td>`


    ` <td>From 2%</td>`


    ` </tr>`


    ` <tr>`


    ` <td>Young Saver</td>`


    ` <td>From 1.6%</td>`


    ` </tr>`


    `</table>`


    The `caption` element provides a means for labeling the following table’s content


    in a visual manner (unlike the `table`’s `summary` attribute, (p. 417) which is


    non-visible). It has one element-specific attribute, `align` (p. 383), which is
    very


    rudimentary and not entirely supported (it’s also deprecated, so it should generally


    be avoided).


    The `caption` element can only be used once per `table` and must immediately follow


    the `table` start tag.


    While the `caption` element seems like the most appropriate markup for labeling
    a


    `table`, many people instead choose to precede tables with heading elements 1-6


    (for example, an `h3` (p. 52) element). This makes it easier for people using
    assistive


    technology, such as screen readers, to jump from heading to heading in the


    document, and arguably offers more semantic information than the `caption`, which


    doesn’t provide any indication of importance or hierarchy within the document.'
