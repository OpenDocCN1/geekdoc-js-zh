    \ of the `big` element in use. The tags are nested to show the incremental \n\n\
    increase of the text’s size: \n\n`<p>It's ``**<big>bigger, <big>better, and now\
    \ with <big>20% more**`\n\n`** beetroot goodness!</big></big></big>**``</p> `\n\
    \nThe `big` element is a text formatting control that increases the enclosed text\
    \ by one \n\nsize increment, based on the old HTML font sizes 1 through 7. Each\
    \ nested `big `\n\nelement will further increase the size by one increment. \n\
    \nThis element isn’t deprecated, but it’s used less and less frequently, as there\
    \ are \n\nnow better methods for controlling text size (through CSS), and the\
    \ `big` element \n\nprovides no semantic value for any enclosed text— it simply\
    \ states that the text \n\nneeds to be bigger. \n\nThe example shown in the HTML\
    \ above would render in the browser as depicted \n\nin Figure 5.7. \n\n![](img/281615fd250106ce6876c73aa0b8de9a_184_0.png)\n\
    \nText Formatting Elements \n\nFigure 5.7: Displaying content marked up using\
    \ the `big` element \n\n**Use This For ****…** \n\n`big` is used to affect text\
    \ content of any kind."
