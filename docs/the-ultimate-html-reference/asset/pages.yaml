  md: "`<base ``**href=\"http://lloydi.com/travel-writing/\"**``/> `\n\n⋮ \n\n`I've\
    \ published my `\n\n` <a href=\"``**./**``\">holiday diaries</a>, `\n\n` including\
    \ the `\n\n` <a href=\"``**./prague/2006/day2.html**``\"> `\n\n` crazy bone church\
    \ at Kutna Hora</a>, and our recent trip to `\n\n` <a href=\"``**./portugal/algarve/day1.html**``\"\
    > `\n\n` Portugal</a>. `\n\nNote that the syntax dictates that the `a` (p. 144)\
    \ element’s `href` values begins with \n\n`\"./\"`. \n\nThere’s one flaw with\
    \ using the `base` element for this purpose, though. Consider a \n\nscenario in\
    \ which you set a `base href` to be a domain root, like so: \n\n`<base href=\"\
    http://example.org/\"> `\n\nThen, in the document, you have a link to a fragment\
    \ identifier called `foo`: a section \n\nwithin the same page that you’d like\
    \ the user to be able to jump to: \n\n`<a href=\"#foo\">Foo</a> links to foo `\n\
    \n⋮ \n\n`<h1 id=\"foo\">Foo</h1> here is the desired destination `\n\nThe problem\
    \ is that the browser won’t jump to that section on the page; instead, it \n\n\
    will load the URL `http://example.org/#foo`. \n\nSo while the `base` element may\
    \ have its uses, you must be careful to avoid a situation \n\nlike this. Using\
    \ a `base href` value may be akin to using a sledgehammer to knock \n\nin a nail.\
    \ \n\n**Value **\n\nThe value in the `base href` must be an absolute URI that\
    \ acts as the base URI for \n\nresolving relative URIs, such as `\"http://www.domain-name.com/\"\
    `."
