  md: "**Value **\n\nThis attribute takes as its value a single character, which can\
    \ be numerical, \n\nalphabetical, or even a symbol. \n\n**Compatibility **\n\n\
    **Opera **\n\n**Safari**\n\n**Firefox **\n\n**Internet Explorer **\n\n9.5\n\n\
    9.2\n\n3.0\n\n2.0\n\n1.3\n\n2.0\n\n1.5\n\n1.0\n\n7.0\n\n6.0\n\n5.5 \n\nFull\n\n\
    Full\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull \n\
    \nThere’s some variety in the way that the `accesskey` is activated, but it can\
    \ work \n\nwell. The downside of using this attribute is that the keystrokes you\
    \ define may \n\nclash with those defined by other technologies such as screen\
    \ readers or magnifiers. \n\nIn addition, different language browsers use different\
    \ accelerator keys for their own \n\nmenu options, and these, too, may clash with\
    \ the accesskeys you’ve defined. As \n\nsuch, `accesskey` may not work as expected\
    \ for all users. It may, however, be very \n\nuseful in controlled environments,\
    \ such as intranets, where you know exactly which \n\nbrowsers and languages users\
    \ are running. \n\nText Formatting Elements \n\n`**charset**`* for <a> *\n\nSPEC\
    \ \n\ndeprecated \n\nrequired \n\nversion \n\n`charset=\"``*character encoding\
    \ scheme*``\" `\n\nHTML 4\n\nNO\n\nNO \n\nBROWSER SUPPORT \n\nIE7 \n\nFF2 \n\n\
    Saf3 \n\nOp9.5 \n\nNONE \n\nNONE \n\nNONE \n\nNONE \n\n**Example **\n\nMore cakes!\
    \ Here, a `charset` is defined, as they’re special Japanese cakes: \n\n`<a href=\"\
    cakes-ja.html\" ``**charset=\"euc-jp\"**``\\>lovely range of`\n\n` Japanese cakes\
    \ (note: this link will take you to a page in Japanese`\n\n` language)</a> `\n\
    \nThe `charset` attribute is used to identify the character set used in the document\
    \ \n\nthat’s being linked to (that is, referenced in the `href` attribute)."
