  md: '![](img/281615fd250106ce6876c73aa0b8de9a_279_0.png)


    Figure 6.9: A masked password field


    `**"radio"**`


    The `"radio"` button control is arguably the most complex type of `input`


    control. To explain how this control works, it’s worth thinking about


    the origin of its name. In old-fashioned radio sets, tuning between


    stations wasn’t achieved by using the “scan” facility, or even rotating


    a dial. Rather, a series of buttons that were linked to a handful of radio


    stations could be chosen, one at a time—pressing one button in the


    range would cause any other button to pop out. The same effect is in


    play here. Only one control can be selected from a range, and if you


    select another, the previously selected input is deselected. For this


    control to work, though, each radio button in the range that you want


    users to choose from must have the same `name` (p. 261) attribute, as


    shown below. With a radio `input`, the control should come first,


    followed by the associated text:


    `<div><input ``**type="radio" name="station"**`` id="rad1"`


    `**value="Radio 1"**``/> <label for="rad1">Radio `


    `1</label></div>`


    `<div><input ``**type="radio" name="station"**`` id="rad2"`


    `**value="Radio 2"**``/> <label for="rad2">Radio `


    `2</label></div>`


    `<div><input ``**type="radio" name="station"**`` id="rad3"`


    `**value="XFM"**``/> <label for="rad3">XFM</label></div>`


    `<div><input ``**type="radio" name="station"**`` id="rad4"`


    `**value="4Music"**``/> <label for="rad4">4Music</label></div>`


    The browser representation is shown in Figure 6.10.


    ![](img/281615fd250106ce6876c73aa0b8de9a_279_1.png)


    Figure 6.10: Radio buttons


    Because each control has the same `name` (in this case, `"station"`), only


    one can be picked from the list. The `value` for each control differs,'
