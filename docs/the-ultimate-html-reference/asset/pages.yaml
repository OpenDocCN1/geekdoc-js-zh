    `coords="``*coordinates*``"`


    **Example**


    This `coords` attribute defines the top-left and bottom-right coordinates for
    a rectangular


    shape:


    `<map name="bigthings" id="bigthings">`


    ` <area shape="rect" ``**coords="35,4,205,108"**`


    ` href="http://en.wikipedia.org/wiki/Australia''s\_Big\_Things"`


    ` alt="Australia''s Big Things (on Wikipedia)"/>`


