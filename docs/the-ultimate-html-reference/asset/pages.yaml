  md: "The `abbr` element is used to provide a fully expanded alternative to an abbreviated\
    \ \n\nphrase. The intention is that browsers and other assistive technologies\
    \ will interpret \n\nthis information and present it to the user in an appropriate\
    \ format when requested. \n\nSome documents, by their very nature, may include\
    \ numerous abbreviations or \n\nacronyms. Marking up each and every one could\
    \ cause the document to become \n\nvery unsightly in some browsers—and would be\
    \ tedious for the author having to \n\nmark each one up! A general convention\
    \ is to mark up the first instance of any \n\nabbreviation or acronym. \n\n**Use\
    \ This For ****…** \n\nThe `abbr` element contains the text that’s part of the\
    \ abbreviation, and has just one \n\nattribute: the `title` (p. 165) attribute.\
    \ \n\n**Compatibility **\n\n**Opera **\n\n**Safari**\n\n**Firefox **\n\n**Internet\
    \ Explorer **\n\n9.5\n\n9.2\n\n3.0\n\n2.0\n\n1.3\n\n2.0\n\n1.5\n\n1.0\n\n7.0\n\
    \n6.0\n\n5.5 \n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\nFull\n\
    \nFull\n\nNone\n\nNone \n\nSupport for `abbr` is varied. Internet Explorer versions\
    \ 6 and earlier don’t understand \n\nthe element at all, or make it available\
    \ in the DOM tree for interrogation. \n\nIn all other browsers, the `abbr` is\
    \ supported, but in varying visual styles. Firefox \n\nand Opera underline a marked-up\
    \ abbreviation with a light dotted line (this can be \n\nstyled using CSS); Safari\
    \ recognizes the `abbr` content, but doesn’t draw attention \n\nText Formatting\
    \ Elements \n\nto it with an underline. Firefox, Opera, and Safari all display\
    \ the `title` attribute \n\nfor the abbreviation as a tooltip (hence, it’s available\
    \ to mouse users, but not keyboard \n\nusers). \n\nIn Firefox, an `abbr` would\
    \ display as shown in Figure 5.3 when moused over. \n\n![](img/281615fd250106ce6876c73aa0b8de9a_172_0.png)\n\
    \nFigure 5.3: The `title` attribute of `abbr` shown in Firefox \n\nIn Opera 9.2,\
    \ the tooltip appears in a similar fashion, but with the text “Title:” \n\nappended\
    \ to it, as shown in Figure 5.4."
