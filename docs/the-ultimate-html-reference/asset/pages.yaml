    \ might use a series \n\nof `br` elements in succession to create a new paragraph\
    \ effect, instead of simply \n\nusing a (p. 70) or a `blockquote` (p. 28), and\
    \ applying CSS to set the layout. \n\n■ Using `br` elements becomes a real headache\
    \ if, later, you want to correct visual \n\ninconsistencies and have to sweep\
    \ through hundreds of files to strip them out. \n\nThere are some exceptional\
    \ cases in which you might be forced to use a `br` element: \n\n■ In poetry, a\
