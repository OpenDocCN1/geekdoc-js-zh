  md: "SPEC \n\nversion \n\nempty\n\ndeprecated \n\nHTML 2\n\nNO\n\nNO \n\nBROWSER\
    \ SUPPORT \n\nOp9.2+\n\nSaf1.3+\n\nFF1+\n\nIE5.5+ \n\nFULL\n\nFULL\n\nFULL\n\n\
    FULL \n\n`**ul **`\n\n`<ul> `\n\n`</ul> `\n\n**Example **\n\nThe `ul` can be used\
    \ to mark up a simple shopping list of everyday items, like so: \n\n`**<ul>**`\n\
    \n` <li>Eggs</li>`\n\n` <li>Cheese</li>`\n\n` <li>Milk</li>`\n\n` <li>Papadums</li>`\n\
    \n` <li>Tickle-me Elmo</li>`\n\n` <li>Dr Who Remote Control Dalek</li> `\n\n`**</ul>\
    \ **`\n\nThe `ul` element, the name for which is an abbreviation of unordered\
    \ list, is used to \n\ngroup a collection of items together in a list, but in\
    \ a way that doesn’t suggest an \n\norder of precedence or importance. The `ul`\
    \ might be used for anything from a simple \n\nshopping list to a collection of\
    \ links. \n\nLists have become a very popular mechanism for defining a web site’s\
    \ navigation. \n\nThis approach constitutes an appropriate use of markup (navigation\
    \ is, after all, a \n\ncollection of related items), but was shunned for this\
    \ purpose for many years, \n\nprimarily because the default appearance of lists,\
    \ which sees them rendered as a \n\nseries of bulleted items, doesn’t lend itself\
    \ to navigation applications. However, \n\nwith the excellent support provided\
    \ by current browsers for Cascading Style Sheets \n\n(CSS), it’s now possible\
    \ to transform lists to take on almost any appearance. \n\nUsing lists for blocks\
    \ of navigation benefits users who are navigating the Web with \n\nassistive technology\
    \ (such as visually impaired users accessing the web page using \n\na screen reader).\
    \ By wrapping a site’s navigation in a list, we give users the ability \n\nto\
    \ easily skip entire blocks of navigation, jumping from one navigation level to\
    \ \n\nanother—a clear advantage over having to move from link to link while trying\
    \ to \n\nget a feel for the web page’s structure."
  merge: -1
