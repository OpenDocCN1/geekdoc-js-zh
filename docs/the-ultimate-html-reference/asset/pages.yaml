  md: '**Chapter ****8**


    **Table Elements**


    Table markup is used for presenting data in a grid-like fashion, *not* for the
    purposes


    of laying out a web page, or the sections within a web page. The elements and


    attributes listed in this section will provide you with all the tools you need
    to ensure


    that your table markup is valid, logically presented, and accessible.


    Table Elements'
