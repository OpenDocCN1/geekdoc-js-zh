    `**name**`* for <button>*


    `name="``*string*``"`


    **Example**


    The `name` attribute is used here to specify a name by which to reference form
    data:


    `<form>`


    ` <button ``**name="btnProceed"**``\>I am`


    ` <em>really</em> sure I want to proceed</button>`


    `</form>`


    The `name` attribute is used to reference `form` data after it’s submitted, and
    to reference


    the data using JavaScript on the client side. Unlike the `id` attribute, which
    must be


    given a unique value each time it’s applied to a new form control, a `name` attribute


    with a given value may be applied to numerous form controls (although in practice


    this approach is *only* used with radio `input` buttons). Note that only `form`
    elements


    which have a `name` attribute will have their values passed through to the page
    or


    script specified in the `form`’s `action` attribute.


    You may wish to apply the same name to multiple buttons. In the example below,


    two `button`s have the same `name` value (`"dowhat"`), but each submits a different


    `"value"` (`"save"` or `"publish"`):


    `<button ``**name="dowhat"**`` value="save"`


    ` id="action-save">Save Draft</button>`


    `<button ``**name="dowhat"**`` value="publish"`


    ` id="action-publish">Publish</button>`


    Using the same `name` value ensures that only one of the two possible `value`s
    is


    submitted, and each button can be uniquely identified (perhaps for the purposes


    of rendering the different actions with different CSS styles).'
