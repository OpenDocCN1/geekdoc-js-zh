  md: "The `dir` element was originally intended to be used specifically to display\
    \ *directory *\n\nlists, rather than to act as a generic list in which any content\
    \ could be placed. Like \n\nthe `ol` (p. 129) and `ul` (p. 136) list types, the\
    \ `dir` element contains a series of `li` (p. 124) \n\nitems. \n\nNote that although\
    \ the `li` is a block-level lement, which would normally be able to \n\ncontain\
    \ other block-level elements, when it’s used in the context of a `dir`, a child\
    \ \n\n`li` element can only contain inline elements. \n\nFor more information\
    \ visit http://reference.sitepoint.com/html/dir/. \n\nOp9.2+\n\nSaf1.3+\n\nFF1+\n\
    \nIE5.5+ \n\nFULL\n\nFULL\n\nFULL\n\nFULL \n\nHTML 2\n\nNO\n\nNO \n\nBROWSER SUPPORT\
    \ \n\nSPEC\n\n`**li **`\n\ndeprecated \n\nempty \n\nversion \n\n`<li> `\n\n`</li>\
    \ `\n\n**Example **\n\nHere’s the `li` element in action, being used within a\
    \ `ol` element: \n\n`<ol> `\n\n`**<li>**``Remove the outer casing by pushing the\
    \ plastic rivets`\n\n` through.``**</li>**`\n\n` <li>Disconnect the main power\
    \ harness from the inner unit`\n\n` (unclip).</li>`\n\n` <li>Remove connection\
    \ to the glow plug.</li>`\n\n` <li>Extract unit, keeping upright at all times.</li>\
    \ `\n\n`</ol> `\n\nThe `li` element defines an individual list item and can only\
    \ appear inside the \n\nhandful of list-related elements detailed above. Each\
    \ list item is represented by a \n\nbullet (for unordered lists, defined by the\
    \ `ul` (p. 136) element) or a number or letter \n\n(in the case of ordered lists,\
    \ defined by the `ol` (p. 129) element). \n\nThe example above shows the `li`\
    \ as it’s used in an ordered list (`ol`), but it could be \n\napplied identically\
    \ inside an unordered list (`ul`):"
