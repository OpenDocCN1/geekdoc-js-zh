    FULL \n\n`**noscript **`\n\n`<noscript> `\n\n`</noscript> `\n\n**Example **\n\n\
    This example shows a typical application of `noscript`: \n\n`**<noscript>**`\n\
    \n` <h1>Houston, we have a problem</h1>`\n\n` <p>It appears that your web browser\
    \ does not support JavaScript,`\n\n` or you have temporarily disabled scripting.\
    \ Either way, this site`\n\n` won't work without it. Please take a look at our`\n\
    \n` <a href=\"/support/browsers/\">browser support page</a> for more help. `\n\
    \n`**</noscript> **`\n\nThe `noscript` element has but one purpose: to provide\
    \ content for people accessing \n\nthe web page with a browser that either doesn’t\
    \ support client-side scripting, or \n\nthat has had its script support disabled\
    \ by the user, perhaps for security reasons. \n\nInside `noscript` you can use\
    \ the same HTML elements that you’d include the `body `\n\n(p. 32) element; for\
    \ example, headings, paragraphs, and other elements which are \n\nappropriate\
    \ to the doctype (p. 6) that you specify. However, you can’t use `noscript `\n\
    \ninside the `head` (p. 61) to provide alternatives for JavaScript functions,\
    \ as that would \n\ninvolve writing content inside the `head` element. \n\nNote\
    \ that it’s not just humans who might benefit from `noscript` content. If you\
    \ have \n\na web page that uses client-side scripting to create navigation, for\
    \ example, those \n\nlinks will be all but hidden from search engines, which won’t\
    \ parse the scripts \n\ncontained in the `script` (p. 100) element. A simplified\
    \ navigation block within the \n\n`noscript` element can provide a route for search\
    \ engines to follow when they’re \n\nindexing your site, regardless of whether\
    \ the users ever see that content. \n\nThere’s one gray area that you should be\
    \ aware of. The content inside the `noscript `\n\nwill only appear if scripts\
    \ aren’t supported, or are disabled in the user’s browser. \n\nThere are scenarios\
    \ in which a script won’t be actioned—for example, when security \n\nsettings\
    \ on a firewall detect potentially malicious code in an external script file,"
