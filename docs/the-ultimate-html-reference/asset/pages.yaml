  md: "**g**\n\n■ `base` (p. 75) \n\ndefines base URLs for links or resources on the\
    \ page, and target windows in \n\nwhich to open linked content \n\n■ `link` (p.\
    \ 80) \n\nrefers to a resource of some kind, most often to a style sheet that\
    \ provides \n\ninstructions about how to style the various elements on the web\
    \ page \n\n■ `meta` (p. 92) \n\nprovides additional information about the page;\
    \ for example, which character \n\nencoding the page uses, a summary of the page’s\
    \ content, instructions to search \n\nengines about whether or not to index content,\
    \ and so on \n\n■ `object` (p. 355) \n\nrepresents a generic, multipurpose container\
    \ for a media object \n\n■ `script` (p. 100) \n\nused either to embed or refer\
    \ to an external script \n\n■ `style` (p. 109) \n\nprovides an area for defining\
    \ embedded (page-specific) CSS styles \n\nAll of these elements are optional and\
    \ can appear in any order within the `head`. \n\nNote that none of the elements\
    \ listed here actually appear on the rendered page, \n\nbut they are used to affect\
    \ the content on the page, all of which is defined inside \n\nthe `body` element.\
    \ \n\n`**body **`\n\nThis is where the bulk of the page is contained. Everything\
    \ that you can see in the \n\nbrowser window (or viewport) is contained inside\
    \ this element, including \n\nparagraphs, lists, links, images, tables, and more.\
    \ The `body` (p. 32) element has some \n\nunique attributes of its own, all of\
    \ which are now deprecated, but aside from that, \n\nthere’s little to say about\
    \ this element. How the page looks will depend entirely \n\nHTML Concepts"
