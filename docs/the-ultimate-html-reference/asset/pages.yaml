    \nHowever, the way that the `hr` element renders differs greatly between browsers,\
    \ so \n\nit doesn’t pay to be too precious about design consistency in this case.\
    \ \n\nSPEC \n\nversion \n\nrequired \n\ndeprecated \n\nN/A\n\nNO\n\nYES \n\nBROWSER\
