  md: "As one of the earliest formatting elements, `em` has full browser support.\
    \ \n\n**Other Relevant Stuff **\n\n`strong` (p. 221) \n\n*signifies strongly emphasized\
    \ content *\n\n`**font **`\n\nSPEC \n\ndeprecated \n\nempty \n\nversion \n\n`<font\
    \ color=\"``*color*``\" face=\"``*font-family*``,``…``\" `\n\nHTML 3.2\n\nNO\n\
    \nYES \n\nBROWSER SUPPORT \n\n`size=\"``*number*``\"> `\n\nIE5.5+ \n\nFF1+ \n\n\
    Saf1.3+ \n\nOp9.2+ \n\n`</font> `\n\nFULL\n\nFULL\n\nFULL\n\nFULL \n\nThe `font`\
    \ element is one that inspires a certain amount of loathing in these days of \n\
    \nstandards-based web design and construction. It was originally introduced as\
    \ a \n\nmechanism for applying arbitrary inline styles, but was basically misused\
    \ as authors \n\ntried to squeeze the most out of their web pages. The problem\
    \ with `font` is that it \n\noffers no semantic meaning about its contents. A\
    \ page heading should be marked \n\nup using a heading element (for example, `h1`\
    \ (p. 46), `h2` (p. 50), and so on), while \n\na quoted block of text should use\
    \ `blockquote` (p. 28). The problem with `font` was \n\nthat it encouraged page\
    \ authors to use `font` to achieve those effects. Hence, we saw \n\nmarkup like\
    \ `<font size=\"7\">Today``’``s news</font>`, rather than the more \n\nappropriate\
    \ `<h1>Today``’``s news</h1>`. \n\nFor more information, visit http://reference.sitepoint.com/html/font/."
