    FULL \n\n`**h5 **`\n\n`<h5> `\n\n`</h5> `\n\n**Example **\n\nIn this example,\
    \ an `h5` element is used to define a section heading: \n\n`<h5>Credits for this\
    \ page</h5> `\n\nThe `h5` element is used to indicate a heading whose level of\
    \ importance is exceeded \n\nby `h1`, `h2`, `h3`, and `h4`. A document may have\
    \ several `h5` elements, all of which share \n\nthe same level of importance.\
    \ The default heading size is shown in Figure 2.9. \n\n![](img/281615fd250106ce6876c73aa0b8de9a_66_0.png)\n\
    \nFigure 2.9: A level 5 heading \n\nIn total, we have six heading levels to choose\
    \ from—`h1` to `h6`—to add structure to \n\nthe web page. `h1` is the highest\
    \ heading level (and, by default, the largest in terms \n\nof font size) and `h6`\
    \ the lowest (and smallest). \n\nA document’s first heading should be an `h1`,\
    \ followed by one or more `h2` headings; \n\nStructural Elements \n\neach of these\
    \ `h2` headings can then have a further series of `h3` headings below them, \n\
    \nand so on, right on down to heading level 6. The HTML 4 spec states that heading\
    \ \n\nlevels should not be skipped (that is, you shouldn’t have a series of headings\
    \ in the \n\norder `h1`, `h2`, `h2`, `h4`, which skips the `h3` entirely), although\
    \ it isn’t always possible \n\nto guarantee such rigidity in the markup, particularly\
    \ if your pages are generated \n\nby a CMS. However, this goal is certainly one\
    \ for which you should *aim*. \n\nHeadings add semantic richness to a document,\
    \ which can help with search engines’ \n\nunderstanding of the makeup of that\
    \ document, and provide users of assistive \n\ndevices (such as screen readers)\
    \ with an additional—and quick—method by which \n\nto navigate through a document:\
    \ they can skip from heading to heading."
