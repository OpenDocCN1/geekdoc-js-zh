    \ just in case this important information is not sent by the server. \n\nTypical\
    \ uses for the `http-equiv` attribute include managing cache control, page \n\n\
    refreshes, and page content safety ratings. If the `http-equiv` attribute is used\
    \ in the \n\n`meta` element, the `name` attribute shouldn’t be used. \n\nNote\
    \ that supplying an HTTP equivalent in a `meta` element is only effective if the\
    \ \n\nserver doesn’t send the corresponding real header; you can’t override an\
    \ HTTP \n\nheader with a `meta` element. So using this attribute is only of value\
    \ when the server \n\ndoesn’t send that particular header, or when there is no\
    \ server involved—for instance, \n\nwhen you’re viewing a document from the local\
    \ file system. \n\n**Value **\n\nThe value of `http-equiv` varies depending on\
    \ the way you use it. It may contain \n\nany of the following values: \n\n■ `\"\
    Allow\" `\n\n■ `\"Content-Encoding\" `"
