    \ listing of \n\nall HTML elements to ascertain what these contents might be.\
    \ \n\n**Doctypes **\n\nThe doctype declaration, which should be the first item\
    \ to appear in the source \n\nmarkup of any web page, is an instruction to the\
    \ web browser (or other user agent) \n\nthat identifies the version of the markup\
    \ language in which the page is written. It \n\nrefers to a known Document Type\
    \ Definition, or DTD for short. The DTD sets out \n\nthe rules and grammar for\
    \ that flavor of markup, enabling the browser to render the \n\ncontent accordingly.\
    \ \n\nThe doctype contains a lot of information, none of which you will be likely\
    \ to find \n\nyourself being tested on in a job interview, so don’t worry if it\
    \ all seems too difficult \n\nto remember. Besides, most web authoring packages\
    \ will insert a syntactically correct \n\ndoctype for you anyway, so there’s little\
    \ chance of you getting it wrong. \n\nThe doctype begins with the string `<!DOCTYPE`,\
    \ which should be written in uppercase: \n\n`**<!DOCTYPE**`` html PUBLIC \"-//W3C//DTD\
    \ XHTML 1.0 Transitional//EN\" `\n\n` \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
    > `\n\nThe next part, which reads `html` (for XHTML) or `HTML`, refers to the\
    \ name of the root \n\nelement for the document. This information is included\
    \ for validation purposes, \n\nsince the DTD itself doesn’t say which element\
    \ is the root element in the document \n\ntree: \n\n`<!DOCTYPE ``**html**`` PUBLIC\
    \ \"-//W3C//DTD XHTML 1.0 Transitional//EN\" `\n\n` \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
    > `\n\nThe `PUBLIC` statement informs the browser that the DTD is a publicly available\
    \ \n\nresource. If you had decided that the various flavors of HTML or XHTML were\
    \ \n\nlacking in some way, and you wanted to extend the language beyond the defined\
    \ \n\nspecifications, you could go to the effort of creating a custom DTD. This\
    \ would \n\nallow you to define custom elements, and would enable your documents\
    \ to validate \n\naccording to that DTD; in this case, you’d change the `PUBLIC`\
    \ value to `SYSTEM`. That"
  merge: -1
  pgno: 15
