    **``/> `\n\n⋮ \n\n`<p>`\n\n` I've published my <a href=\"/travel-writing/\">holiday\
    \ diaries</a>,`\n\n` including the <a href=\"/travel-writing/prague/2006/day2.html\"\
    >`\n\n` crazy bone church at Kutna Hora</a>. `\n\n`</p> `\n\nThe `target` attribute\
    \ in the `base` element is almost certainly going to be used in the \n\ncontext\
    \ of a `frameset` (p. 492), where you want all links from a document in one \n\
    \n`frame` (p. 491) to open in another named `frame`. You might also use it in\
    \ the context \n\nof an `iframe` (p. 492), where you wish all links from the “host”\
    \ document (which \n\ncontains the `iframe`) to open the destination of the links\
    \ inside that floating frame \n\n(although this is a much less likely scenario\
    \ than that outlined for `frameset`). \n\n**Value **\n\n`target` (p. 161) for\
    \ all the values that can be included in the `target`, and their \n\nmeanings\
    \ and uses. \n\nHead Elements"
