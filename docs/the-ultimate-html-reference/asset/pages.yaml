    \ \n\nquoted and unquoted syntax coloring in the Mac text editor TextMate. \n\n\
    ![](img/281615fd250106ce6876c73aa0b8de9a_23_0.png)\n\nFigure 1.2: TextMate’s syntax\
    \ coloring taking effect to display quoted attributes \n\n**Commenting Markup\
    \ **\n\nYou may add comments in your HTML, perhaps to make it clear where sections\
    \ \n\nstart or end, or to provide a note to remind yourself why you approached\
    \ the creation \n\nof a page in a certain way. What you use comments for isn’t\
    \ important, but the way \n\nthat you craft a comment *is* important. The HTML\
    \ comment looks like this: `<!--`\n\n`this is a comment -->`. It’s derived from\
    \ SGML, which starts with an `<!` and ends \n\nwith an `\\>`; the actual comment\
    \ is, in effect, inside the opening `\\--` and the closing \n\n`\\--` parts. These\
    \ hyphens tell the browser when to start ignoring text content, and \n\nwhen to\
    \ start paying attention again. The fact that the `\\--` characters signify the\
    \ \n\nbeginning and end of the comment means that you *should not use them anywhere\
    \ *\n\n*inside a comment*, even if you believe that your usage of these characters\
    \ conforms \n\nto SGML rules. Note that you can’t use hyphens inside XML comments\
    \ at all, which \n\nis an even stronger reason not to get into the habit. \n\n\
    The markup below shows examples of good and bad HTML comments—see the \n\nremark\
    \ associated with each example for more information:"
