    \nTake a second to check your progress at this point. You should see the site\
    \ being rendered with a nice hero element. If you test it out in your browser,\
    \ you should see that it’s responsive, too.\n\n![](Images/Front-end-Web-School.png)\
    \ \n\n#### Blog.vue\n\nThis is our most complex component, which will render the\
    \ blog posts for each collection. It will also find and filter the taxonomies\
    \ (categories and tags) we set in the `Front Matter` sections of the Markdown\
    \ files:"
