  trans: "\n\n*   它拥有一个非常有帮助的社区支持。\n\n你将最频繁使用的 API 特性有：\n\n*   [TweenLite](https://greensock.com/docs/TweenLite)，它是\
    \ GSAP 的基础。该对象的实例负责处理随时间变化的任何对象的一个或多个属性的补动画。\n*   [TweenMax](https://greensock.com/docs/TweenMax)，它扩展了\
    \ `TweenLite` 并增加了额外的功能。\n*   [TimelineLite](https://greensock.com/docs/TimelineLite)，这是一个强大的序列工具，你可以在其中封装补动画和其他时间轴，以实现对复杂动画的完全控制。\n\
    *   [TimelineMax](https://greensock.com/docs/TimelineMax)，它扩展了 `TimelineLite`\
    \ 并增加了更多如 `repeat`、`repeatDelay`、`yoyo` 等优秀功能。\n\n使用 GSAP API 所需语法在上述四个对象中非常相似，这确实有助于帮助在较短的时间内熟悉该库：\n\
    \n```\n/* 在 1 秒内将元素从完全不透明变为透明度为 0，\n并延迟 2 秒 */\nTweenLite.to(element,  1,  {opacity:\
    \ 0, delay: 2});\nTweenMax.to(element,  1,  {opacity: 0, delay: 2});\n\n/* 创建一个名为\
    \ tl 的 TimelineLite 实例，\n 它重复初始动画两次，在两次动画之间有 1\n 秒的延迟 */\nconst tl =  new  TimelineLite({repeat:\
    \ 2, repeatDelay: 1});\n// 向时间轴添加一个 TweenLite 实例，该实例在 1 秒内\n // 将元素从完全不透明变为透明度为\
    \ 0\ntl.add(  TweenLite.to(element,  1,  {opacity: 0})  );\n\n// 执行上述相同的操作，但使用\
    \ TimelineMax\nconst tl =  new  TimelineMax({repeat: 2, repeatDelay: 1});\ntl.add(\
    \  TweenLite.to(element,  1,  {opacity: 0})  );\n```\n\n你可以对一个属性向结束值制作动画，在这种情况下你像上面的代码段一样使用\
    \ `.to()`。如果你想定义起始值而不是结束值，请使用 `.from()`。最后，为了指定补动画的起始和结束值，请使用 `.fromTo()`。\n\n\
    查看库网站上的 [GSAP 入门](https://greensock.com/get-started-js) 以获取一个友好的介绍。\n\n### 实时代码\n\
    \n尝试通过[这个演示来感受你可以用 GSAP 和 Vue 做什么](https://codepen.io/SitePoint/pen/dwXPYB/)。\n\
    \n## #5 Anime.js\n\n[Anime.js](http://animejs.com/) 是由 Julian Garnier 创建的轻量级且快速的动画引擎。这也是一个功能齐全库，你可以轻松地与\
    \ Vue.js 集成，创建一些非常酷的 Web 动画。\n\nAnime 适用于 CSS 属性、CSS 变换、SVGs、DOM 属性和 JavaScript\
    \ 对象。它也得到了很好的支持，[文档](http://animejs.com/documentation/)非常精美。\n\n这里有一个摘取自该库 GitHub\
    \ 页面的代码片段，帮助你熟悉语法：\n\n```javascript\nanime({\n  targets: 'div',\n  translateX:\
    \ [\n    { value: 100, duration: 1200 },\n    { value: 0, duration: 800 }\n  ],\n\
    \  rotate: '1turn',\n  backgroundColor: '#FFF',\n  duration: 2000,\n  loop: true\n\
    });\n```\n\n*   `targets` 允许你指定想要动画的 DOM 元素。\n*   `translateX`、`rotate` 和 `backgroundColor`\
    \ 表示你想对元素上制作动画的属性。虽然这并不是 Anime 特有的，而是通用的 JavaScript，但请注意 CSS 复合名称（在你的 CSS 文档中通常用连字符连接——例如\
    \ `background-color`）在 JavaScript 中是如何驼峰命名法的：`backgroundColor`。\n*   此外，注意 `translateX`\
    \ 被赋予了特定的 `duration` 值，既相对于初始状态和结束状态，也相对于同一对象上的其他属性——例如 `rotate` 和 `backgroundColor`。\n\
    *   `duration` 表示补动画将持续多长时间。\n*   `loop` 设置为 true 意味着动画将无限持续循环。\n\n### 实时代码\n\n\
    [这里有一个 Anime.js 与 Vue 运行的实时演示](https://codepen.io/SitePoint/pen/RERNaN/)。\n\n\
    ## 结论\n\n我觉得 Vue 是一个真正对动画友好的框架。你已经看到无论是否使用外部库，都可以非常直接地创建出出色的动画效果。然而，将这里列出的任何一个库集成到\
    \ Vue 中都将赋予你动画超能力。你可以构思并分享给世界的创意是无止尽的！\n\n# 第 3 章：使用 VuePress 构建你的第一个静态网站\n\n\
    作者：Ivaylo Gerchev\n\n在本教程中，我们将使用 [VuePress](https://vuepress.vuejs.org/) 构建一个静态网站，并将其部署到\
    \ [GitHub Pages](https://pages.github.com/)。该网站将是一个简单的技术博客，提供通过集合、类别和标签对内容进行组织和导航可能。\n\
    \n### 代码和实时站点\n\n本教程的代码[可以在 GitHub 上找到](https://github.com/sitepoint-editors/vuepress)。你也可以查看[在\
    \ GitHub Pages 上运行的站点](https://sitepoint-editors.github.io/vuepress/)。\n\n## 什么是\
    \ VuePress？\n\nVuePress 是一个简单而强大的静态站点生成器，由 [Vue.js](https://vuejs.org/) 驱动。它由\
    \ Evan You（Vue 的创建）创建，旨在方便文档密集型网站的编写。作为一个 SPA，VuePress 使用了 Markdown 文件和 Vue 组件的混合。\n\
    \n## 静态网站的优势\n\n静态网站具有一些显著优势：\n\n*   **简单性**：静态网站使用纯 HTML。由于所有文件物理存在服务器上（与数据库驱动站点相比），你可以快速地移动、部署和备份。\n\
    *   **速度**：由于文件已经编译并准备就绪，静态网站的页面加载速度很快。\n*   **SEO 友好**：富元数据加上人类可读的 URL 和纯文本内容使得静态网站更容易被搜索引擎访问。\n\
    *   **安全性**：静态网站比动态站点安全得多。根据 [WP WhiteSecurity 的报告](https://www.wpwhitesurity.com/statistics-70-percent-wordpress-installations-vulnerable/)，70%\
    \ 的 WordPress 安装面临安全风险。由于静态网站不依赖数据库、CMS 和插件，被黑攻击的概率极小。\n*   **可扩展性**：静态网站可以通过增加带宽来轻松扩展。\n\
    *   **版本控制支持**：为静态网站添加版本控制非常简单。\n\n## 为什么使用 VuePress？\n\n那里有很多静态站点生成器。那么，我们为什么要选择\
    \ VuePress 而不是其他呢？\n\n嗯，对我来说，这些是 VuePress 两个强大的卖点：\n\n1.  VuePress 是用 Vue 构建的。这意味着我们在构建网站时，可以使用\
    \ Vue 的所有超能力。\n2.  我们可以随时将 VuePress 站点添加到任何现有项目中。\n\n上述的优势已经足够强大了，但让我们探索一下让 VuePress\
    \ 发光发热的完整功能 set：\n\n*   Vue 组件与 Markdown 文件之间有紧密的集成。我们可以直接在 Markdown 中使用 Vue 组件，这为我们提供了了极大的灵活性。\n\
    \n"
- fmt: "\n*   VuePress has a Vue-powered [custom theme system](https://v0.vuepress.vuejs.org/guide/custom-themes.html),\
    \ with which we can create a full-featured theme by using [Vue SFC (single file\
    \ components)](https://vuejs.org/v2/guide/single-file-components.html). The sky’s\
    \ the limit.\n*   VuePress offers multi-language support. So we can turn our site\
    \ multilingual fairly easily.\n*   VuePress has Google Analytics integration.\n\
    *   VuePress has a responsive default theme, specifically tailored for technical\
    \ documentation, with a great set of features out of the box. These include:\n\
    \    *   Optional home page\n    *   Header-based search functionality (optional\
    \ [Algolia search](https://community.algolia.com/docsearch/))\n    *   Customizable\
    \ navbar and searchbar\n    *   Auto-generated GitHub link and page edit links.\n\
    \n## Getting Started\n\n### VuePress Versions\n\nIn this tutorial, we’ll use the\
    \ stable VuePress version, which is `0.14.8` at the time of writing. There is\
    \ also a new version, with great new features, including ones for blogging, but\
    \ it’s still in alpha stage and it’s not secure to be used yet.\n\nBefore we get\
    \ started, you’ll need a recent version of Node.js installed on your system (version\
    \ 8 or greater). If you don’t have Node installed, you can download the binaries\
    \ from the [official website](https://nodejs.org/), or use a [version manager](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/).\
    \ This is probably the easiest way, as it allows you to manage multiple versions\
    \ of Node on the same machine.\n\nNext, create a new directory `vuepress-blog`\
    \ and initialize a new Node project inside:\n\n```\nmkdir vuepress-blog && cd\
    \ vuepress-blog\nnpm init -y\n```\n\nNext, install VuePress locally, as a dependency:\n\
    \n```bash\nnpm install -D vuepress\n```\n\nFinally, edit the scripts section of\
    \ the `package.json` file to include the `dev` and `build` commands:\n\n```json\n\
    \"scripts\": {\n  \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\"\
    ,\n  \"docs:dev\": \"vuepress dev docs\",\n  \"docs:build\": \"vuepress build\
    \ docs\"\n},\n```\n\nNow we can run the dev server with the following command:\n\
    \n```bash\nnpm run docs:dev\n```\n\nIf you’ve set up everything correctly, the\
    \ site will build and be available at [http://localhost:8080](http://localhost:8080).\
    \ Currently there isn’t a whole lot to see apart from a 404 message, but we’ll\
    \ change that in the next sections.\n\n### Exploring the Directory Structure of\
    \ the Final Project\n\nRight now, our project is empty. But, in this section I\
    \ want to give you a glimpse of the directory structure of the final project.\
    \ Our site will be built inside a `docs` directory. The docs directory will contain\
    \ a `blog` directory and a `.vuepress` directory.\n\n```\n.\n├── docs\n│   ├──\
    \ blog\n│   ├── README.md\n│   └── .vuepress\n├── package.json\n└── package-lock.json\n\
    ```\n\nAs you can see, the `docs` directory, serves as a root of our VuePress\
    \ site. A `README.md` file is required for the root directory and for all directories\
    \ containing Markdown files. It will be automatically transformed into an `index.html`\
    \ file, which will serve as a starting point/page for the current directory.\n\
    \n### The `blog` Directory\n\nThe `blog` directory will house all our blog posts\
    \ and content. This is what it will look like:\n\n```\n.\n├── css\n│   ├── lists.md\n\
    │   └── README.md\n├── html\n│   ├── lists.md\n│   └── README.md\n├── http.md\n\
    ├── javascript\n│   ├── functions.md\n│   ├── objects.md\n│   ├── README.md\n\
    │   ├── strings.md\n│   └── variables.md\n└── README.md\n```\n\nThere’s not too\
    \ much going on here. The posts are represented by Markdown files and the three\
    \ subfolders (`css`, `html` and `javascript`) represent collections. You’ll hear\
    \ more about these later.\n\n### The `.vuepress` Directory\n\nThis will contain\
    \ all files and folders necessary for the development and building of our site.\
    \ This is what it will look like:\n\n```\n.\n├── components\n│   ├── Footer.vue\n\
    │   ├── Hero.vue\n│   ├── Message.vue\n│   └── Navbar.vue\n├── config.js\n└──\
    \ theme\n    ├── layouts\n    │   ├── Blog.vue\n    │   ├── Home.vue\n    │  \
    \ └── Post.vue\n    ├── Layout.vue\n    └── styles\n        ├── code.styl\n  \
    \      └── custom-blocks.styl\n```\n\nAs you can see, the `.vuepress` directory\
    \ contains the following:\n\n*   A `components` directory for our custom components.\
    \ All components put in this folder are globally registered, and [dynamic and\
    \ async](https://vuejs.org/v2/guide/components-dynamic-async.html) by default.\n\
    *   A `config.js` file, used for site and theme configuration.\n*   A `theme`\
    \ directory to hold our custom theme.\n\nThe `theme` directory contains:\n\n*\
    \   a `layouts` directory, where we put our custom layouts\n*   a `Layout.vue`\
    \ file, which is required to create a custom theme\n*   a `styles` directory for\
    \ the theme\n\n### Following Along\n\nIf you’d like to follow along with this\
    \ tutorial, https://github.com/sitepoint-editors/vuepress, let’s create the following.\n\
    \n**Project root**\n```bash\nmkdir -p docs\n```\n\n**`blog` directory**\n```bash\n\
    mkdir -p docs/blog/{css,html,javascript}\n```\n\n**`.vuepress` directory**\n```bash\n\
    mkdir -p docs/.vuepress/{components,theme}\n```\n\n### Configuring Your Site/Theme\n\
    \nFinally, before we start building the blog, let’s establish some settings. In\
    \ `.vuepress/config.js`:\n\n```javascript\nmodule.exports = {\n  title: \"Front-end\
    \ Web School\",\n  description: \"Learn HTML, CSS, and JavaScript\",\n  head:\
    \ [\n    [\n      \"link\",\n      {\n        rel: \"stylesheet\",\n        href:\
    \ \"https://cdnjs.cloudflare.com/ajax/libs/bulma/0.7.1/css/bulma.min.css\"\n \
    \     }\n    ],\n    [\n      \"link\",\n      {\n        rel: \"stylesheet\"\
    ,\n        href: \"https://use.fontawesome.com/releases/5.6.1/css/all.css\"\n\
    \      }\n    ]\n  ]\n};\n```\n\nHere, we provide a site title and description.\
    \ And we also add [Bulma](https://bulma.io/) and [Font Awesome](https://fontawesome.com/)\
    \ to the head. We’ll use them to develop our custom theme.\n\n## Building Your\
    \ Site\n\nNow we’re going to build our blog.\n\n### Preparing the Blog Content\n\
    \nLet’s start by preparing some content for our blog.\n\nIn the `blog` directory,\
    \ we’ve have `html`, `css`, and `javascript` subdirectories. Each blog subdirectory\
    \ will play the role of a collection. So we’ll have the ability to organize the\
    \ blog’s content by collections and to explore each collection individually.\n\
    \nThe `blog` directory and all of its subdirectories each have a `README.md` file.\
    \ This file will contain only a [Front Matter](https://v0.vuepress.vuejs.org/guide/markdown.html#front-matter)\
    \ section with a `title` property containing the name of the directory. So for\
    \ the `blog` directory, the `README.md` file will contain:\n\n```yaml\n---\ntitle:\
    \ Blog\n---\n```\n\nFor the `css` directory:\n\n```yaml\n---\ntitle: CSS\n---\n\
    ```\n\nAnd so on.\n"
