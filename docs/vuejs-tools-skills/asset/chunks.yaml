    categories: [Intermediate]\ntags: [JavaScript, Function, Callback Function]\n\
    ---\n\n<!-- Your Markdown content here -->\n```\n\n## Grabbing the Content\n\n\
    As mentioned above, we’ll not fill out all of the blog posts here. If you’d like\
    \ to copy any of the content from the finished site, [you can find it here](https://github.com/sitepoint-editors/vuepress/tree/master/docs/blog).\n\
    \n## Creating the `Layout.vue` Component\n\nAfter we get our content done, let’s\
    \ start creating our custom theme. In `.vuepress/theme/Layout.vue` add this:\n\
    \n```html\n<template>\n  <div class=\"container\">\n    <Navbar/>\n    <Component\
    \ :is=\"currentLayout\"/>\n    <Footer/>\n  </div>\n</template>\n\n<script>\n\
    import Home from \"./layouts/Home.vue\";\nimport Blog from \"./layouts/Blog.vue\"\
    ;\nimport Post from \"./layouts/Post.vue\";\nexport default {\n  components: {\n\
    \    Home,\n    Blog,\n    Post\n  },\n  computed: {\n    currentLayout() {\n\
    \      const { path } = this.$page;\n      if (path === \"/\") {\n        return\
    \ \"Home\";\n      } else if (path.endsWith(\"/\")) {\n        return \"Blog\"\
    ;\n      } else if (path.endsWith(\".html\")) {\n        return \"Post\";\n  \
    \    }\n    }\n  }\n};\n</script>\n```\n\n`Layout.vue` will be invoked for each\
    \ Markdown file. It’s like a root component in a Vue application. The code in\
    \ this file checks the current page’s path (via the `currentLayout` computed property)\
    \ and according to the result loads the needed layout. For that, we use Vue’s\
    \ built-in `<Component/>` element, which swaps the displayed component via its\
    \ `is` property. In the template, we also put `<Navbar/>` and `<Footer/>` components,\
    \ which we’ll be creating in the following section.\n\nVuePress exposes two variables—`this.$page`\
    \ and `this.$site`—which give us access to [data about the page and the site](https://v0.vuepress.vuejs.org/guide/custom-themes.html#site-and-page-metadata)\
    \ respectively. In `currentLayout`, `this.$page` is used to get the path of the\
    \ current page.\n\n## Creating the Partial Components\n\nIn this section, we’ll\
    \ look at the partial components, which we’ll import into our layout. These partials\
    \ are in the `.vuepress/components` folder.\n\n### Navbar.vue\n\nIn this component,\
    \ we use [Bulma’s Navbar component](https://bulma.io/documentation/components/navbar/)\
    \ to create a navbar for our blog:\n\n```html\n<template>\n  <nav class=\"navbar\
    \ is-dark\" role=\"navigation\" aria-label=\"main navigation\">\n    <div class=\"\
    navbar-brand is-marginless\">\n      <a class=\"navbar-item\" :href=\"$withBase('/')\"\
    >\n        <span class=\"icon is-large has-text-warning\">\n          <i class=\"\
    fas fa-2x fa-laptop-code\"></i>\n        </span>\n      </a>\n      <a\n     \
    \   role=\"button\"\n        class=\"navbar-burger\"\n        :class=\"{'is-active':\
    \ isActive}\"\n        @click=\"isActive = !isActive\"\n        aria-label=\"\
    menu\"\n        aria-expanded=\"false\"\n        data-target=\"navbarMenu\"\n\
    \      >\n        <span aria-hidden=\"true\"></span>\n        <span aria-hidden=\"\
    true\"></span>\n        <span aria-hidden=\"true\"></span>\n      </a>\n    </div>\n\
    \n    <div id=\"navbarMenu\" class=\"navbar-menu\" :class=\"{'is-active': isActive}\"\
    >\n      <div class=\"navbar-end\">\n        <a class=\"navbar-item\" :href=\"\
    $withBase('/')\">HOME</a>\n        <a class=\"navbar-item\" :href=\"$withBase('/blog/')\"\
    >BLOG</a>\n        <a\n          class=\"navbar-item\"\n          :href=\"$withBase(collection.path)\"\
    \n          v-for=\"collection in collections\"\n        >{{collection.path |\
    \ formatNavItems}}</a>\n      </div>\n    </div>\n  </nav>\n</template>\n\n<script>\n\
    export default {\n  data: function() {\n    return {\n      isActive: false\n\
    \    };\n  },\n  computed: {\n    collections() {\n      let pages = this.$site.pages.filter(page\
    \ => {\n        return page.path.match(/(blog\\/).+(\\/$)/);\n      });\n    \
    \  return pages;\n    }\n  },\n  filters: {\n    formatNavItems(value) {\n   \
    \   if (!value) return \"\";\n      let pos = value.search(/\\w+\\/$/);\n    \
    \  let res = value.slice(pos, value.length - 1);\n      return res.toUpperCase();\n\
    \    }\n  }\n};\n</script>\n\n<style>\n.navbar {\n  padding-right: 1em;\n}\n</style>\n\
    ```\n\nIn this file, we create a computed `collections` property, which filters\
    \ all pages and matches only the blog directory and subdirectories. We use that\
    \ property in the template to populate the navbar with a link for each collection.\
    \ We also use the [withBase](https://v0.vuepress.vuejs.org/guide/custom-themes.html#site-and-page-metadata)\
    \ helper.\n\n### Hero.vue\n\nIn this component, we use [Bulma hero element](https://bulma.io/documentation/layout/hero/):\n\
    \n```html\n<template>\n  <section class=\"hero is-success\">\n    <div class=\"\
    hero-body\">\n      <div class=\"container\">\n        <h1 class=\"title\">Front-end\
    \ School</h1>\n        <h2 class=\"subtitle\">Learn to code in HTML, CSS, and\
    \ JavaScript</h2>\n      </div>\n    </div>\n  </section>\n</template>\n```\n\n\
    ### Message.vue\n\nIn this component, we create a message box, which we’ll display\
    \ on the home. We use [Bulma’s component](https://bulma.io/components/message/)\
    \ for this:\n\n```html\n<template>\n  <article class=\"message is-info\" :class=\"\
    {hidden: dismiss}\">\n    <div class=\"message-header\">\n      <p>Welcome to\
    \ Our Blog</p>\n      <button @click=\"hide\" class=\"delete\"></button>\n   \
    \ </div>\n    <div class=\"message-body\">Lorem ipsum sit amet...</div>\n  </article>\n\
    </template>\n\n<script>\nexport default {\n  data: function() {\n    return {\n\
    \      dismiss: false\n    };\n  },\n  methods: {\n    hide() {\n      this.dismiss\
    \ = true;\n    }\n  }\n};\n</script>\n\n<style>\n.hidden {\n  display: none;\n\
    }\n</style>\n```\n\n### Footer.vue\n\nThis is a simple footer created with [Bulma’s\
    \ footer](https://bulma.io/documentation/layout/footer/):\n\n```html\n<template>\n\
    \  <footer class=\"footer has-background-darker\">\n    <div class=\"content has-text-centered\"\
    >\n      <p>Copyright 2018 All rights reserved.</p>\n    </div>\n  </footer>\n\
    </template>\n\n<style>\n.footer {\n  margin-top: 2em;\n}\n</style>\n```\n\n##\
    \ Creating the Layout Components\n\nNow it’s time to create the custom layouts\
    \ for our blog. In this section, we’ll look at the files in the `.vuepress/theme/layouts`\
    \ folder: `Home.vue`, `Blog.vue`, and `Post.vue`.\n\n### Home.vue\n\nThis will\
    \ be our home template. It’s super simple:\n\n```html\n<template>\n  <div>\n \
    \   <Hero/>\n    <Content/>\n  </div>\n</template>\n```\n\nWe just add the `<Hero/>`\
    \ partial and the [VuePress’ `<Content/>` global component](https://v0.vuepress.vuejs.org/guide/custom-themes.html#content-outlet).\n\
    \nTake a second to check your progress at this point. You should see the site\
    \ being rendered with a nice hero element. If you test it out in your browser,\
    \ you should see that it’s responsive, too.\n\n![](Images/Front-end-Web-School.png)\n\
    \n### Blog.vue\n\nThis is our most complex component, which will render the blog\
    \ posts for each collection. It will also find and filter the taxonomies (categories\
    \ and tags) we set in the `Front Matter` sections of the Markdown files:\n"
