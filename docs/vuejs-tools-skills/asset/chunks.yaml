  trans: "\n\n*   VuePress 拥有一个由 Vue 驱动的[自定义主题系统](https://v0.vuepress.vuejs.org/guide/custom-themes.html)，通过我们可以使用\
    \ [Vue SFC（单文件组件）](https://vuejs.org/v2/guide/single-file-components.html) 来创建一个功能齐全的主题。它的上限是无限。\n\
    *   VuePress 支持多语言。因此，我们可以相当容易地将网站转变为多语言版本。\n*   VuePress 集成了 Google Analytics。\n\
    *   VuePress 有了一个响应式的默认主题，专门为技术文档量身定制，并开箱即用了一系列强大的功能。这些包括：\n    *   可选的首页\n  \
    \  *   基于 Header 的搜索功能（可选的 [Algolia 搜索](https://community.algolia.com/docsearch/)）\n\
    \    *   自定义的导航栏和搜索栏\n\n## 开始学习\n\n### VuePress 版本\n\n在本教程中，我们将使用稳定的 VuePress\
    \ 版本。在开始之前，你需要在系统中安装 [Node.js](https://nodejs.org/) 8 或更高版本。如果你还没有安装 Node.js，你可以从\
    \ [Node 官网](https://nodejs.org/) 下载，或者使用 [nvm](https://github.com/nvm-sh/nvm)\
    \ 来管理版本。\n\n接下来，创建一个 `vuepress-blog` 目录并初始化：\n\n```bash\nmkdir vuepress-blog\n\
    cd vuepress-blog\nnpm init -y\n```\n\n然后，本地安装 VuePress：\n\n```bash\nnpm install\
    \ -D vuepress\n```\n\n最后，编辑 `package.json` 文件中的 `scripts` 部分，添加 `dev` 和 `build`\
    \ 命令：\n\n```json\n\"scripts\": {\n  \"test\": \"echo \\\"Error: no test specified\\\
    \" && exit 1\",\n  \"dev\": \"vuepress dev\",\n  \"build\": \"vuepress build\"\
    \n}\n```\n\n现在，通过以下命令启动服务器：\n\n```bash\nnpm run dev\n```\n\n### 目录结构\n\n你可以看到，VuePress\
    \ 的目录结构如下：\n\n```\n.\n├── docs\n│   └── blog\n│       ├── css\n│       │   └──\
    \ README.md\n│       ├── html\n│       │   └── README.md\n│       └── javascript\n\
    │           └── README.md\n├── .vuepress\n│   ├── components\n│   ├── theme\n\
    │   └── README.md\n├── package.json\n└── package-lock.json\n```\n\n`docs` 目录包含了所有的文档内容。`docs/blog`\
    \ 目录包含了 `css`、`html` 和 `javascript` 子目录，每个子目录代表一个集合。\n\n`.vuepress` 目录包含了：\n\n\
    *   `components`：用于存放全局组件。\n*   `theme`：用于自定义主题。\n*   `config.js`：用于站点和主题配置。\n\
    \n### 配置站点/主题\n\n在开始构建博客之前，让我们先建立一些设置。编辑 `.vuepress/config.js`：\n\n```javascript\n\
    module.exports = {\n  title: \"前端 Web 学校\",\n  description: \"学习 HTML, CSS 和 JavaScript\"\
    ,\n  head: [\n    [\n      \"link\",\n      {\n        rel: \"stylesheet\",\n\
    \        href: \"https://cdnjs.cloudflare.com/ajax/libs/bulma/0.7.1/css/bulma.min.css\"\
    \n      }\n    ],\n    [\n      \"link\",\n      {\n        rel: \"stylesheet\"\
    ,\n        href: \"https://use.fontawesome.com/releases/5.6.1/css/all.css\"\n\
    \      }\n    ]\n  ]\n};\n```\n\n## 构建你的站点\n\n现在我们将开始构建博客。\n\n### 准备博客内容\n\n让我们先为博客准备一些内容。\n\
    \n在 `blog` 目录下，我们有了 `html`、`css` 和 `javascript` 子目录。每个博客子目录都扮演一个集合的角色。\n\n`blog`\
    \ 目录及其所有子目录各有一个 `README.md` 文件。该文件仅包含一个 `Front Matter` 章节，其中 `title` 属性包含目录名称。因此，对于\
    \ `blog` 目录，`README.md` 文件将包含：\n\n```yaml\n---\ntitle: Blog\n---\n```\n\n对于 `css`\
    \ 目录：\n\n```yaml\n---\ntitle: CSS\n---\n```\n\n以此此类推。\n\n"
