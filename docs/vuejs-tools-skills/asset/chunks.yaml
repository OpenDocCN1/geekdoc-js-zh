    \ is a simple and lightweight design library built exactly according to the Google\
    \ Material Design specs. They offer a wide range of form elements to build your\
    \ mobile application. For example, the [Input & Textarea](https://vuematerial.io/components/input)\
    \ section offers many input options, such as password fields, fields with a maximum\
    \ length, built-in error validation, or prefixes and suffixes. All of this is\
    \ well documented with all properties the element accepts and the events it fires.\n\
    \nVue Material even provides different classes to change the layout of your component.\
