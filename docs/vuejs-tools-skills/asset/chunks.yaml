    │   ├── Footer.vue\n│   ├── Hero.vue\n│   ├── Message.vue\n│   └── Navbar.vue\n\
    ├── config.js\n└── theme\n    ├── layouts\n    │   ├── Blog.vue\n    │   ├── Home.vue\n\
    \    │   └── Post.vue\n    ├── Layout.vue\n    └── styles\n        ├── code.styl\n\
    \        └── custom-blocks.styl\n```\n\nAs you can see, the `.vuepress` directory\
    \ contains the following:\n\n*   A `components` directory for our custom components.\
    \ All components put in this folder are globally registered, and [dynamic and\
    \ async](https://vuejs.org/v2/guide/components-dynamic-async.html) by default.\n\
    \n*   A `config.js` file, used for site and theme configuration.\n\n*   A `theme`\
    \ directory to hold our custom theme.\n\nThe `theme` directory contains:\n\n*\
    \   a `layouts` directory, where we put our custom layouts\n\n*   a `Layout.vue`\
    \ file, which is required to create a custom theme\n\n*   a `styles` directory\
    \ for the theme’s styles\n\n### Following Along at Home\n\nIf you’d like to follow\
    \ along with this tutorial, it’d be a good idea to create most of these folders\
    \ and files now. For those of you on ’nix-based systems, you can do that with\
    \ the following code.\n\n**Project root**\n\n```\nmkdir -p docs/{blog,.vuepress}\n\
    touch docs/README.md\n```\n\n**`blog` directory**\n\n```\nmkdir docs/blog/{css,html,javascript}\n\
    touch docs/blog/{css,html}/{lists.md,README.md}\ntouch docs/blog/javascript/{functions.md,objects.md,README.md,strings.md,variables.md}\n\
    touch docs/blog/{README.md,http.md}\n```\n\nPlease note that we won’t fill all\
    \ of these posts (Markdown files) with content during the tutorial. That will\
    \ be left to you.\n\n**`.vuepress` directory**\n\n```\nmkdir docs/.vuepress/{components,theme}\n\
    touch docs/.vuepress/components/{Footer.vue,Hero.vue,Message.vue,Navbar.vue}\n\
    touch docs/.vuepress/config.js\nmkdir docs/.vuepress/theme/{layouts,styles}\n\
    touch docs/.vuepress/theme/Layout.vue\ntouch docs/.vuepress/theme/layouts/{Blog.vue,Home.vue,Post.vue}\n\
    touch docs/.vuepress/theme/styles/{code.styl,custom-blocks.styl}\n```\n\nAlternatively,\
    \ you could [clone the repo](https://github.com/sitepoint-editors/vuepress) and\
    \ work with the finished project.\n\n### Configuring Your Site/Theme\n\nFinally,\
    \ before we start building the blog, let’s establish some settings. In `.vuepress/config.js`:\n\
    \n```\nmodule.exports = {\n  title: \"Front-end Web School\",\n  description:\
    \ \"Learn HTML, CSS, and JavaScript\",\n  head: [\n    [\n      \"link\",\n  \
    \    {\n        rel: \"stylesheet\",\n        href:\n          \"https://cdnjs.cloudflare.com/ajax/libs/bulma/0.7.1/css/bulma.min.css\"\
    \n      }\n    ],\n    [\n      \"link\",\n      {\n        rel: \"stylesheet\"\
    ,\n        href: \"https://use.fontawesome.com/releases/v5.6.1/css/all.css\"\n\
    \      }\n    ]\n  ]\n};\n```\n\nHere, we provide a site title and description.\
    \ And we also add [Bulma](https://bulma.io/) and [Font Awesome](https://fontawesome.com/)\
    \ to the project. They’ll be injected into the head tag of each compiled HTML\
    \ page. We’ll use them to develop our custom theme.\n\n## Building Your Site\n\
    \nNow we’re going to build our blog. In the version we’ll be using, VuePress doesn’t\
    \ offer blogging features (such as tags and categories), but we’ll try to improvise.\n\
    \n### Preparing the Blog Content\n\nLet’s start by preparing some content for\
    \ our blog.\n\nIn the `blog` directory, we have `html`, `css`, and `javascript`\
    \ subdirectories. Each blog subdirectory will play the role of a collection. So\
    \ we’ll have the ability to organize the blog’s content by collections and to\
    \ explore each collection individually.\n\nThe `blog` directory and all of its\
    \ subdirectories each have a `README.md` file. This file will contain only a [Front\
    \ Matter](https://v0.vuepress.vuejs.org/guide/markdown.html#front-matter) section\
    \ with a `title` property containing the name of the directory. So for the `blog`\
    \ directory, the `README.md` file will contain:\n\n```\n---\ntitle: Blog\n---\n\
    ```\n\nFor the `css` directory:\n\n```\n---\ntitle: CSS\n---\n```\n\nAnd so on.\n\
    \nNext, let’s look at our blog posts—the Markdown files. Each file must contain\
    \ a `Front Matter` section, where we put the necessary settings and metadata in\
    \ [YAML](https://en.wikipedia.org/wiki/YAML) format. Here’s an example from the\
    \ `functions.md` file:"
