- fmt: "\n*   It’s got a super helpful community for support.\n\nThe API features\
    \ you’re going to use the most are:\n\n*   [TweenLite](https://greensock.com/docs/TweenLite),\
    \ which is GSAP’s foundation. An instance of this object handles tweening one\
    \ or more properties of any object over time.\n*   [TweenMax](https://greensock.com/docs/TweenMax),\
    \ which extends `TweenLite` adding extra bells and whistles.\n*   [TimelineLite](https://greensock.com/docs/TimelineLite),\
    \ a powerful sequencing tool inside which you can wrap tweens and other timelines\
    \ to get full control of complex animations.\n*   [TimelineMax](https://greensock.com/docs/TimelineMax),\
    \ which extends `TimelineLite` adding more goodies like `repeat`, `repeatDelay`,\
    \ `yoyo`, etc.\n\nThe syntax you need to use GSAP’s API is very similar in all\
    \ four of the above objects, which really helps getting familiar with the library\
    \ in a relatively short period of time:\n\n```\n/* tween an element from full\
    \ opacity to opacity 0\nin 1 second with a 2 second's delay */\nTweenLite.to(element,\
    \  1,  {opacity: 0, delay: 2});\nTweenMax.to(element,  1,  {opacity: 0, delay:\
    \ 2});\n\n/* create an instance of TimelineLite called tl\n which repeats the\
    \ initial animation twice with 1\n second's delay in between tweens */\nconst\
    \ tl =  new  TimelineLite({repeat: 2, repeatDelay: 1});\n// add a TweenLite instance\
    \ to the timeline that animates\n// an element from full opacity to opacity 0\
    \ over 1 seconds\ntl.add(  TweenLite.to(element,  1,  {opacity: 0})  );\n\n//\
    \ do the same as above, but using TimelineMax\nconst tl =  new  TimelineMax({repeat:\
    \ 2, repeatDelay: 1});\ntl.add(  TweenLite.to(element,  1,  {opacity: 0})  );\n\
    ```\n\nYou can animate a property towards an end value, in which case you use\
    \ `.to()` like in the snippets above. If you want to define the starting values\
    \ instead of the end values, use `.from()`. Finally, to specify both starting\
    \ and ending values of the tween, use `.fromTo()`.\n\nCheck out [Getting Started\
    \ with GSAP](https://greensock.com/get-started-js) on the library’s website for\
    \ a friendly introduction.\n\n### Live Code\n\nTry playing with [this demo to\
    \ get a sense of what you can do with GSAP and Vue](https://codepen.io/SitePoint/pen/dwXPYB/).\n\
    \n## #5 Anime.js\n\n[Anime.js](http://animejs.com/) is a lightweight and fast\
    \ animation engine created by Julian Garnier. This is also a full-featured library\
    \ you can pain painlessly integrate with Vue.js to create some really cool web\
    \ animations.\n\nAnime works with CSS properties, CSS transforms, SVGs, DOM attributes\
    \ and JavaScript objects. It’s also very well supported and the [docs](http://animejs.com/documentation/)\
    \ are pretty sleek.\n\nHere’s a snippet taken from the library’s GitHub page to\
    \ get you started with the syntax:\n\n```javascript\nanime({\n  targets: 'div',\n\
    \  translateX: [\n    { value: 100, duration: 1200 },\n    { value: 0, duration:\
    \ 800 }\n  ],\n  rotate: '1turn',\n  backgroundColor: '#FFF',\n  duration: 2000,\n\
    \  loop: true\n});\n```\n\n*   `targets` lets you specify the DOM elements you\
    \ want to animate.\n*   `translateX`, `rotate`, and `backgroundColor` indicate\
    \ the properties on the element that you want to animate. Although this is not\
    \ specific to Anime but to JavaScript more generally, notice how the CSS compound\
    \ names, which in your CSS document are usually hyphenated—such as `background-color`—in\
    \ JavaScript are camelcased: `backgroundColor`.\n*   Also, notice how `translateX`\
    \ has been given specific `duration` values, both with respect to the initial\
    \ and ending states and with respect to the other properties on the same object—for\
    \ example, `rotate` and `backgroundColor`.\n*   `duration` indicates how long\
    \ the tween is going to last.\n*   `loop` set to true means that the animation\
    \ keeps repeating indefinitely.\n\n### Live Code\n\n[Here’s a live demo of Anime.js\
    \ with Vue in action](https://codepen.io/SitePoint/pen/RERNaN/).\n\n## Conclusion\n\
    \nI find Vue to be a truly animation-friendly framework. You’ve seen how you can\
    \ create nice animation effects quite straightforwardly both with and without\
    \ the use of an external library. However, integrating any one of the libraries\
    \ listed here with Vue will give you animation super powers. There’s no end to\
    \ what you can come up with and share with the world!\n\n# Chapter 3: Build Your\
    \ First Static Site with VuePress\n\nby Ivaylo Gerchev\n\nIn this tutorial, we’ll\
    \ build a static site with [VuePress](https://vuepress.vuejs.org/) and we’ll deploy\
    \ it to [GitHub Pages](https://pages.github.com/). The site will be a simple,\
    \ technical blog which offers the possibility to organize and navigate the content\
    \ by collections, categories, and tags.\n\n### Code and Live Site\n\nThe code\
    \ for this tutorial [can be found on GitHub](https://github.com/sitepoint-editors/vuepress).\
    \ You can also view [the site running live on GitHub Pages](https://sitepoint-editors.github.io/vuepress/).\n\
    \n## What Is VuePress?\n\nVuePress is a simple yet powerful static site generator,\
    \ powered by [Vue.js](https://vuejs.org/). It was created by Evan You (the creator\
    \ of Vue) to facilitate the writing of technical, documentation-heavy sites. As\
    \ an SPA, VuePress uses a mixture of Markdown files and Vue templates/components.\n\
    \n## The Benefits of a Static Site\n\nA static site has some significant benefits:\n\
    \n*   **Simplicity**: A static site is written in plain HTML. As all files are\
    \ physically present on the server—in contrast to a database-driven site—you can\
    \ move them, deploy them, and back them up quickly.\n*   **Speed**: Because the\
    \ files are already compiled and ready to be served, the page load time of a static\
    \ site is fast.\n*   **SEO friendly**: Metadata-rich pages plus human-readable\
    \ URLs and plain text content make a static site extremely accessible to search\
    \ engines.\n*   **Security**: A static site is far more secure than a dynamic\
    \ one. According to a [WP WhiteSecurity report](https://www.wpwhitesecurity.com/statistics-70-percent-wordpress-installations-vulnerable/),\
    \ about 70% of WordPress sites are at risk of getting hacked. Because a static\
    \ site doesn’t rely on a database, CMS and/or plugins, the chances of getting\
    \ hacked is minimal.\n*   **Salability**: A static site can be easily scaled up\
    \ by just increasing the bandwidth.\n*   **Version Control Support**: Adding version\
    \ control to a static site is super easy.\n\n## Why Use VuePress?\n\nThere’s an\
    \ abundance of [static site generators](https://www.staticgen.com/) out there.\
    \ So why might we choose VuePress over the others?\n\nWell, for me, these are\
    \ the two strongest selling points of VuePress:\n\n1.  VuePress is built with\
    \ Vue. This means that we can use all the superpowers of Vue while we build our\
    \ site.\n2.  We can add a VuePress site to any existing project, at any time.\n\
    \nThe above benefits are already strong enough, but let’s explore the full feature\
    \ palette that makes VuePress shine:\n\n*   There’s close integration between\
    \ Vue templates/components and Markdown files. We can use Vue templates/components\
    \ directly in Markdown, which give us great flexibility.\n"
