    \ 的五个实用技巧\n\n### 作者：David Bush\n\n我最初是从 [ReactJS](https://reactjs.org/) 进入 [Vue](https://vuejs.org/)\
    \ 世界的。学习如何将页面拆分为小型的、可复用的组件，以及如何利用组件生命周期代表了解决问题方式的转变，但我很快就精通了。\n\n[React Native](https://facebook.github.io/react-native/)\
    \ 允许我为两个主要的智能手机平台编写应用，这对我来说简直是杀手锏。但我不断听到人们说 Vue 多么棒。关键是，我注意到我接触到的所有人中，没有人对它有任何负面评价。经验告诉我，当没有多个个人对某门语言或框架有意见时，意味着应该立即对其进行调查，于是我这样做了。\n\
    \n这些都是我希望在刚开始时就知道的事情。\n\n## 增量式采用\n\n在我多年的编程生涯中，我很少发现更换整个视图层是一件轻而易举的事情。虽然我非常想尝试\
    \ Vue，但我并没有准备好为此开始一个全面的重写。我非常高兴地得知，通过 Vue，你不需要这样做！你只需要包含库文件并添加组件，就可以通过局部重写的方式将其增量地添加到项目中。这允许你添加新功能并利用它的许多优势，而无需丢弃现有的代码，所以没有理由不尝试！\n\
    \n## Devtools\n\n我发现非常有用的一点是在浏览器中添加 [Vue Devtools](https://github.com/vuejs/vue-devtools)（在\
    \ [Firefox](https://addons.mozilla.org/en-US/firefox/addon/vue-js-devtools/) 和\
    \ [Chrome](https://chrome.google.com/webstore/detail/vuejs-devtools/nhdogjmejiglipccpnnnanhbledajbpd?hl=en)\
    \ 中均可用）。它通过在开发工具面板中显示每个组件的内容，消除了那些繁琐的 `console.log()` 调试调用。它还让你了直接在编辑器中跳转到组件的能力（诚然需要[微调](https://github.com/vuejs/vue-devtools/blob/dev/docs/open-in-editor.md)），我发现这是一个绝对的杀手级，特别是在大型项目中。这是它的运行截图：\n\
    \n![Vue Devtools 截图](img/vue-dev-tools.png)\n\n如你所见，传递给组件的所有内容都是可见的；无需进行任何类型的代码调试。但不仅如此！就像你可能习惯处理渲染后的\
    \ HTML 或 CSS 一样，你可以直接在浏览器中编辑 Vue 组件：给 props 添加值、修改它们，或者可能完全删除它们以查看你的应用的响应。我几乎所有的开发工作都在终端窗口中进行，但我发现自己越来越频繁地利用这种浏览器内的即时反馈循环。在我看来，没有比乐意修改自己的工作流来利用工具更高的赞誉了。\n\
    \n此外，组件导航也非常出色。不仅在右键菜单中有“检查 Vue 组件”选项，还有模糊搜索可以按名称过滤组件，这是一个非常棒的细节。你还可以查看 Vuex 状态的历史，并“时间旅行”回到任何给定的点（在调试根源于复杂状态变化的问题时，这是一个无价的工具）。另一个实用的功能是一个标签，用于跟踪来自你自己组件的[自定义事件](https://vuejs.org/v2/guide/components-custom-events.html)（那些\
    \ `this.$emit('YourEvent')` 类的），但遗憾的是不是原生事件，如 `<button v-on:click=\"counter +=\
    \ 1\">Add 1</button>`：\n\n![事件历史截图](img/vue-event-history.png)\n\n## 避免事件总线\n\n\
    我认为 Vue 传递状态的原生机制非常好，但不可避免的是，随着应用的扩展，你会在多个地方需要相同的数据，这将变得非常难以管理。这方面的典型例子是兄弟组件之间的数据共享，甚至是两个完全没有关系的组件之间。我最近工作的一个项目需要访问\
    \ `category` 字段，一个在列表项中，另一个在其他地方的分组”视图中。Vuex 经常是这类问题的优雅解决方案，因为它巧妙地避开了通过父子关系传递数据时固有的限制。\n\
    \n我必须承认，在我生命中曾有一段时间，我会直接去用事件总线，而不是研究 [Flux](https://facebook.github.io/flux/)\
    \ 架构。我曾在 [Hacker News](https://news.ycombinator.com/) 上从几个人那里读到 Flux，以及延伸出的 [Redux](https://redux.js.org/introduction/getting-started)\
    \ 和 [Vuex](https://vuex.vuejs.org/) 学习起来很复杂，因此我尽可能长时间避开它们。最后，我坐下来努力理解它，我真希望有人告诉我这一点：“它只是[命令模式](https://en.wikipedia.org/wiki/Command_pattern)。”这基本上就是全部。正如你可能知道的，你编写命令（在\
    \ Flux 术语中称为“Actions”），它们被执行（在这种情况下由“分发器”执行），然后结果被传递给 Store。我很高兴地报告，一旦我需要管理更复杂的状态，就会选择\
    \ Vuex。试试吧：它真的没有你想象的那么复杂。\n\n## Vue CLI\n\n[Vue CLI](https://cli.vuejs.org/) 是\
    \ Vue 的较新的特性，但我对其赞誉有加。在过去的几年里，我花了很多时间在配置和集成库上，因此能够轻松地脚手应用并运行简直令人清爽。只需运行 `vue create\
    \ <app_name>`，你就会被提示选择各种安装的选项。开箱即用，它将为你设置好 `Babel` 和 `ES`：\n\n- 使用 [Typescript](https://www.typescriptlang.org/)\
    \ 为项目引入类型安全\n- 利用 [渐进式应用](https://en.wikipedia.org/wiki/Progressive_web_applications)\
    \ 支持移动端\n- 使用 [Vue Router](https://router.vuejs.org/) 无缝路由你的[单页应用]\n- 使用 [Vuex](https://vuex.vuejs.org/)\
    \ 管理更复杂的状态\n- 通过 [CSS 处理器](https://vue-loader.vuejs.org/guide/pre-processors.html)\
    \ 让编写 CSS 更加愉快，包括 [Sass/SCSS](https://sass-lang.com/)、[Less](http://lesscss.org/)\
    \ 和 [Stylus](https://stylus-lang.com/) \n- 从 Typescript 选择不同程度的 ESLint 严格选项（从“仅防止错误”到我最喜欢的\
    \ Airbnb 配置）\n- 使用 `Mocha](https://mochajs.org/) 及其 BDD 兄弟 `Chai](https://www.chaijs.com/)，或\
    \ Facebook 的 `Jest](https://jestjs.io/)` 确保代码稳定性\n- 甚至还有 [Cyprus](https://www.cypress.io/)\
    \ 或 [Nightwatch](http://nightwatchjs.org/) 的端到端测试选项\n\n这种设置甚至提供了“将此保存为预设以供未来项目使用”的选项，在你开发出偏的技术栈后非常有用。查看本\
    \ Vue 系列中的“Vuex 入门：新手指南”获取更多 Vue CLI 的妙用。\n\n### 计算属性\n\n"
- fmt: "\nWhen I first started using Vue, I put all my rendering helpers in functions\
    \ and called them from the template. As my projects grew, this quickly became\
    \ unwieldy and I searched for a better way. Enter [computed properties](https://vuejs.org/v2/guide/computed.html),\
    \ which are the idiomatic way of declaring more complex logic relating to calculation\
    \ of anything to be rendered on the page. They have the added benefit of de-cluttering\
    \ your template (and while it may be an unpopular opinion in modern JS, I firmly\
    \ believe in separating the concerns of my presentation logic and rendering code\
    \ where possible). Let’s walk through it with a quick example.\n\nHere’s the [VueJS\
    \ subreddit](https://www.reddit.com/r/vuejs/). I’m going to `wget https://www.reddit.com/r/vuejs.json`\
    \ and put that in a file, but if you’re playing along at home, there’s nothing\
    \ to stop you using this as a basis for writing your own Vue-based Reddit interface\
    \ and registering for an API key.\n\nLet’s render it on the page:\n\n![Reddit\
    \ interface app screenshot](Images/vue-app-screenshot.png)\n\nSo far, so good.\
    \ Now let’s add an option to sort by score. Here’s my code, in case you’d like\
    \ to emulate it (you’ll want to add [Bootstrap](https://getbootstrap.com/) to\
    \ your project).\n\n### App.vue\n\n```\n<template>\n  <div id=\"app\" class=\"\
    container\">\n    <h1 class=\"list-title\">r/vuejs</h1>\n    <button v-on:click=\"\
    sortHottest = !sortHottest\" class=\"btn btn-primary btn-sort\">\n      {{ sortHottest\
    \ ? \"Sort by Best\" : \"Sort by Hottest\" }}</button>\n    <div v-for=\"story\
    \ in sortHottest ? sortByHottest : sortByBest\" v-bind:key=\"story.data.id\" >\n\
    \      <Story v-bind:story=\"story.data\" />\n    </div>\n  </div>\n</template>\n\
    \n<script>\nimport Story from './components/Story.vue'\nimport stories from './vue_stories.json'\n\
    \nexport default {\n  name: 'app',\n  data: () => {\n    return {\n      // Submissions\
    \ from JSON file (but you can switch it for an API call if you set up an API key):\n\
    \      stories: stories.data.children,\n      // Initial sort order of stories:\n\
    \      sortHottest: true\n    }\n  },\n  components: {\n    Story\n  },\n  computed:\
    \ {\n    sortByBest: function () {\n      // Sorts by score, descending. We use\
    \ slice() to make a copy of the list to avoid mutating state:\n      return this.stories.slice().sort((a,\
    \ b) => b.data.score - a.data.score)\n    },\n    sortByHottest: function () {\n\
    \      // The real Reddit 'Hottest' algorithm is a function of votes and submission-time\
    \ over a delta.\n      // We'll skip all that for this example and just return\
    \ the list as we got it (which was already\n      // sorted by 'hottest'!)\n \
    \     return this.stories\n    }\n  }\n}\n</script>\n\n<style>\n#app {\n  font-family:\
    \ 'Avenir', Helvetica, Arial, sans-serif;\n  -webkit-font-smoothing: antialiased;\n\
    \  -moz-osx-font-smoothing: grayscale;\n  text-align: center;\n  color: #656568;\n\
    \  margin-top: 1.5em;\n}\n.list-title {\n  margin-bottom: 0.5em;\n  font-size:\
    \ 3em;\n}\n\n.btn-sort {\n  margin-bottom: 0.6em;\n  background-color: #8064A2\
    \ !important;\n  border-color: #8064A2 !important;\n}\n</style>\n```\n\n### components/Story.vue\n\
    \n```\n<template>\n    <div class=\"row border rounded story\">\n      <div class=\"\
    col-2\">\n        <p class=\"score\">{{ story.score }}</p>\n      </div>\n   \
    \   <div class=\"col-10 text-left title\">\n        <h4>{{ story.title }}</h4>\n\
    \      </div>\n    </div>\n</template>\n\n<script>\nexport default {\n  name:\
    \ 'Story',\n  props: {\n    story: Object\n  }\n}\n</script>\n\n<style scoped>\n\
    .score {\n  margin-left: 0.3em;\n  margin-top: 0.5em;\n  font-size: 2.8em;\n \
    \ color: #8064A2;\n}\n.title {\n  margin-top: 1.5em;\n}\n\n.story {\n  margin-top:\
    \ 0.5em;\n  border-width: 3px;\n}\n</style>\n```\n\nNow although my sorting example\
    \ is pretty concise (thanks, ES6!), the benefits should be readily apparent: with\
    \ this implementation, we enjoy uncluttered content in the template and neatly\
    \ compartmentalized, self-documenting (mostly!) code in the script. This comes\
    \ with the usual advantages of Vue’s data model in that, by avoiding side effects\
    \ (like mutating the `stories` data), we can leverage Vue’s data binding to ensure\
    \ this is fully reactive. For example, in the event a comment got upvoted sufficiently\
    \ to overtake the one above it, this would be reflected in our `sortByBest()`\
    \ result! So far, this is the same as calling a function directly in your template\
    \ code, but this is where Vue shines: computed properties are only evaluated in\
    \ the event that their dependencies change (in this case, `stories`). If you called\
    \ this as a function, it would be run on every render, which could be costly in\
    \ any number of ways (frequently rendered component, large lists to sort, expensive\
    \ computations on list items, etc.). This is often an easy win when optimizing\
    \ slow pages, so I always look out for it.\n\n## Wrapping Up\n\nThose are the\
    \ five things I wish I’d known earlier when learning Vue. I hope they help you!\n"
