    \ for this tutorial [can be found on GitHub](https://github.com/sitepoint-editors/vuepress).\
    \ You can also view [the site running live on GitHub Pages](https://sitepoint-editors.github.io/vuepress/).\n\
    \n## What Is VuePress?\n\nVuePress is a simple yet powerful static site generator,\
    \ powered by [Vue.js](https://vuejs.org/). It was created by Evan You (the creator\
    \ of Vue), who made it to facilitate the writing of technical, documentation-heavy\
    \ sites for the Vue ecosystem. But as we’ll see in this tutorial, with a little\
    \ tweaking the use cases for VuePress can be broadened.\n\nA site made with VuePress\
    \ is served as a single page application (SPA), powered by Vue, [Vue Router](https://router.vuejs.org/),\
    \ and [webpack](https://webpack.js.org/) as underlying technologies. As an SPA,\
    \ VuePress uses a mixture of Markdown files and Vue templates/components to generate\
    \ a static HTML site.\n\n## The Benefits of a Static Site.\n\nA static site has\
    \ some significant benefits:\n\n*   **Simplicity**. A static site is written in\
    \ plain, simple HTML files. As all files are physically present on the server—in\
    \ contrast to a database-driven site—you can move them, deploy them, and back\
