  trans: "\n\n正如你在 [VS Code 网站](https://code.visualstudio.com/docs/editor/userdefinedsnippets)上看到的，代码片段（snippets）是模板，可以让你更容易输入重复的代码模式，例如循环或条件语句。Vetur\
    \ 让你能够在单文件组件（SFC）中使用这些代码片段。\n\n它自带了一些代码片段。例如，尝试在语言区域之外的地方输入“scaffold”（不带引号），它将生成启动\
    \ SFC 所需的所有代码：\n\n```\n<template>\n\n</template>\n\n<script>\nexport default {\n\
    \n}\n</script>\n\n<style>\n\n</style>\n```\n\n## Emmet\n\n[Emmet](https://www.emmet.io/)\
    \ 将代码片段的概念提升到了全新的高度。如果你从未听过它，并且在文本编辑器中度过大量时间，我建议你去 Emmet 网站花点时间熟悉一下。它具有极大提高你生产力的潜力。\n\
    \n简而言之，Emmet 允许你将各种缩写扩展成 HTML 或 CSS 块。Vetur 默认开启了此功能。\n\n尝试点击 `<template>` 区域并输入以下内容：\n\
    \n```\ndiv#header>h1.logo>a{site Name}\n```\n\n然后按 `Tab` 键。它应该展开为：\n\n```\n<div\
    \ id=\"header\">\n  <h1 class=\"logo\"><a href=\"\">sitename</a></h1>\n</div>\n\
    ```\n\n## 错误检查/代码规范性检查 (Linting)\n\nVetur 默认提供一些基本的错误检查。这对于发现代码中的拼写错误非常有帮助。\n\n\
    ![使用 Vetur 进行 Linting](img/vs-code-4.png) \n\n在上面的示例中，Vetur 注意到我忘记了对象属性名后面的冒号，并因此用红色下划线标记了。打开错误面板（点击左下角的小叉号）可以查看错误描述。\n\
    \nVetur 还使用 [eslint-plugin-vue](https://github.com/vuejs/eslint-plugin-vue) 对模板进行检查。我们将在下一节中详细介绍为什么检查代码是一个好主意，但现在，让我们看看它的运行效果。\n\
    \n让我们在 `data` 属性中添加一个 `items` 键：\n\n```\nexport default {\n  data () {\n    return\
    \ {\n      message: \"Vetur is awesome!\",\n      items: [\n        { message:\
    \ 'Foo' },\n        { message: 'Bar' }\n      ]\n    }\n  }\n}\n```\n\n然后在我们的模板中添加一些代码来输出它：\n\
    \n```html\n<template>\n  <div>\n    <h1>Hello, World!</h1>\n    <p>{{ message\
    \ }}</p>\n\n    <ul>\n      <li v-for=\"item in items\">\n        {{ item.message\
    \ }}\n      </li>\n    </ul>\n  </div>\n</template>\n```\n\n我们立即会看到 `&lt;li v-for=\"\
    quot;item in items&quot;&gt;` 被标了红色下划线。这是怎么回事？\n\n哦，这解释了，你可以将鼠标悬停在错误代码上，或者打开错误控制台查看是什么在困扰\
    \ Vetur。\n\n![VS Code 中高亮的代码错误](img/vs-code-6.png) \n\n错误似乎是因为我们[忘记声明 key](https://vuejs.org/v2/style-guide/#Keyed-v-for-essential)。让我们修复它：\n\
    \n```html\n<li v-for=\"(item, i) in items\" :key=\"i\">\n  {{ item.message }}\n\
    </li>\n```\n\n错误从我们的编辑器中消失了。\n\n## IntelliSense\n\n[IntelliSense](https://code.visualstudio.com/docs/editor/intellisense)\
    \ 是我在 VS Code 中喜欢的功能之一，但它仅限于编辑器可以理解的少数格式。安装 Vetur 可以让 IntelliSense 在你的 `.vue`\
    \ 文件中可用，这非常方便。\n\n你可以尝试这样做：点击进入 Vue 组件的 `<template>` 区域，并在任何标签上输入“v-”（不带引号）。你应该能看到这个：\n\
    \n![使用 Vetur 的 IntelliSense](img/vs-code-5.png) \n\n这允许你从列出的任何指令中进行选择，并为你提供每个指令作用的解释。\n\
    \n这并不是 Vetur 能做的全部，但我们将扩展部分先留到这里，将注意力转向使用 Vue 的 CLI 搭建项目。\n\n## 使用 Vue CLI 的示例项目\n\
    \n在构建新的 Vue 应用时，快速运行的最佳方法是使用 [Vue CLI](https://cli.vuejs.org/)。这是一个命令行工具，允许你从一系列构建工具中进行选择，然后它将为你安装并配置这些工具。它还会脚手你的项目，为你提供一个预配置的起点，你可以在此基础上进行构建，而不是从零开始。\n\
    \n### 快速上手 Vue CLI\n\n如果 CLI 对你来说是新的，你可能想查看我们这个 Vue 系列中的教程“Vue CLI 初学者指南”。\n\n\
    要开始之前，你需要在系统中安装 Node。你可以通过从[官方网站](https://nodejs.org) 下载适用于你系统的二进制文件来完成安装，或者使用[版本管理器](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)。我推荐这两种方法中的第二种。\n\
    \n安装 Node 后，执行以下命令：\n\n```bash\nnpm install -g @vue/cli\n```\n\n然后使用命令创建一个新的 Vue\
    \ 项目：\n\n```bash\nvue create my-project\n```\n\n这将打开一个向导程序，要求你选择一个预设。选择手动选择功能，除了在要求选择\
    \ linter/格式化器配置时，其余全部接受默认值。在这一步中，务必选择 `ESLint + Prettier` 和 `Lint on save`，并将配置文件放在\
    \ `package.json` 中。\n\n### 使用 ESLint 检查你的代码\n\n如果你打开这个新创建的项目并查看一眼 `package.json`\
    \ 文件，你会发现 CLI 已经为你设置了 [ESLint](https://eslint.org/)。这是一个可以自动检查你代码中潜在问题的工具。这提供了许多益处，例如：\n\
    \n*   保持代码风格的一致\n*   发现潜在的错误和不良模式\n*   在遵循[样式指南](https://www.sitepoint.com/why-use-javascript-style-guide/)时强制执行质量\n\
    *   由于上述所有原因节省时间\n\n#### 学习 ESLint\n\n如果你想深入研究 ESLint，可以查看我们的文章“[启动并运行 ESLint\
    \ —— 可插件的检查器](https://www.sitepoint.com/up-and-running-with-eslint-the-pluggable-linter/)”。\n\
    \n如果你查看 `package.json` 中的 `devDependencies` 属性，你会发现 CLI 还在使用 eslint-plugin-vue。这是\
    \ Vue 的官方 ESLint 插件，能够检测 `.vue` 文件中的问题。\n\n让我们测试一下。\n\n使用 `npm run serve` 启动 Vue\
    \ 服务器并访问 [localhost:8080](http://localhost:8080)。\n\n在 `App.vue` 实例中添加以下内容：\n\n\
    ```vue\n<script>\nexport default {\n  name: 'App',\n  props: {\n    msg: String\n\
    \  },\n  methods: {\n    sayHi() {\n      console.log(\"Hello, \" + this.msg +\
    \ \"!\");\n    }\n  }\n}\n</script>\n```\n\n现在，如果你查看运行开发服务器的终端窗口，你会看到 Vue 在报错。\n\
    \n![开发服务器控制台中的 Lint 错误](img/vs-code-7.png) \n\n这是因为在底层，Vue CLI 配置了 ESLint 使用 `eslint:recommended`\
    \ 规则集。这启用了 [ESLint 规则页面](https://eslint.org/docs/rules/)上标记为勾选的所有规则，其中 `no-console](https://eslint.org/docs/rules/no-console)\
    \ 就是其中之一。\n\n虽然 CLI 在终端中显示我们 ESLint 错误很好，但如果我们能在编辑器中也看到它们不是更好吗？哦，幸运的是我们可以这样做。回到\
    \ VS Code，点击扩展图标并输入“ESLint”（不带引号）。顶部的结果应该是 [来自 Dirk Baeumer 的 ESLint 包](https://marketplace.visualstudio.com/items?itemName=dbaeumer.vscode-eslint)。安装它并重启\
    \ VS Code。\n\n最后，你需要编辑 VS Code 偏好。进入*文件* > *偏好* > *设置* 并编辑*用户设置文件*，添加以下配置：\n\n\
    ```json\n\"eslint.validate\": [\n  \"vue\"\n]\n```\n\n这将告诉刚刚安装的 ESLint 插件对 `.vue`\
    \ 文件进行验证。\n\n"
- fmt: "\nShould you desire, you can turn this (or any) rule off in the `rules: {}`\
    \ section of `package.json`:\n\n```\n\"eslintConfig\": {\n  ...\n  \"rules\":\
    \ {\n    \"no-console\": 0\n  },\n  ...\n}\n```\n\n## Formatting Your Code with\
    \ Prettier\n\nPrettier is an opinionated code formatter. As you can read on [the\
    \ project’s home page](https://github.com/prettier/prettier), it enforces a consistent\
    \ style by parsing your code and re-printing it with its own rules that take the\
    \ maximum line length into account, wrapping code when necessary.\n\nThat might\
    \ sound a little draconian at first, but once you get used to it, you literally\
    \ never have to think about code formatting again. This is very useful if you’re\
    \ part of a team, as Prettier will halt all the on-going debates over styles in\
    \ their tracks.\n\n### Look Prettier\n\nIf you’re not convinced, you can [read\
    \ more about why you should use Prettier here](https://prettier.io/docs/en/why-prettier.html).\n\
    \nThe way Prettier works in conjunction with Vue CLI is similar to ESLint. To\
    \ see it in action, let’s remove the semicolon from the end of the `console.log(\"\
    hi\");` statement from our previous example. This should display a warning in\
    \ the terminal:\n\n```\nwarning: Insert `;` (prettier/prettier) at src/components/HelloWorld.vue:41:24:\n\
    \  39 |   methods: {\n  40 |     sayHi() {\n> 41 |       console.log(\"hi\")\n\
    \     |                        ^\n  42 |     }\n  43 |   }\n  44 | };\n\n1 error\
    \ and 1 warning found.\n1 warning potentially fixable with the `--fix` option.\n\
    ```\n\nIt will also display a warning in VS Code, thanks to the ESLint plugin\
    \ we installed previously.\n\nWe can also have Prettier fix any formatting errors\
    \ for us whenever we save a file. To do this, go to `File` > `Preferences` > `Settings`\
    \ and edit the `User Settings file` to add the following configuration:\n\n```\n\
    \"editor.formatOnSave\": true\n```\n\nNow when you press save, everything will\
    \ be formatted according to [Prettier’s standard rule set](https://prettier.io/docs/en/rationale.html).\n\
    \nNote, you can configure a handful of rules in Prettier via a `\"prettier\"`\
    \ key in your `package.json` file:\n\n```\n\"prettier\": {\n  \"semi\": false\n\
    }\n```\n\nThe above, for example, would turn the semicolon rule off.\n\nYou can\
    \ read more about configuration options [here](https://prettier.io/docs/en/options.html).\n\
    \n## Vue Browser Tools\n\nIn this section, I want to take a look at the the Vue.js\
    \ devtools, which are available as a browser plugin for both [Chrome](https://chrome.google.com/webstore/detail/vuejs-devtools/nhdogjmejiglipccpnnnanhbledajbpd)\
    \ and [Firefox](https://addons.mozilla.org/en-US/firefox/addon/vue-js-devtools/),\
    \ and as [a cross-platform Electron app](https://github.com/vuejs/vue-devtools/blob/master/shells/electron/README.md),\
    \ which can also debug Vue apps running on mobile devices.\n\nOnce you have them\
    \ installed, you can access them by visiting a running Vue app, opening your browser’s\
    \ console and hitting the `Vue` button. You’ll then see three further sections:\
    \ `Components`, `Vuex` and `Events`.\n\nThe first section gives you a hierarchical\
    \ view of all the components that make up your application. Selecting a component\
    \ from the tree allows you to inspect its state (for example, the `props` it received)\
    \ in the right-hand pane. Some of its values (such as its `data` object) can be\
    \ dynamically edited while the app runs.\n\n![Vue browser tools displaying a component\
    \ tree](Images/vs-code-9.png)\n\nThe `Vuex` tab is only active if a Vuex store\
    \ is detected in the application. (For more information on this, check out “Getting\
    \ Started with Vuex: a Beginner’s Guide” in this Vue series.) It allows you to\
    \ examine the state of the store at any point in time, and all the mutations that\
    \ have been committed. You can even move back and forth through the mutations,\
    \ effectively time traveling through the state of your application.\n\nThe `Events`\
    \ tab aggregates all the events emitted by your application, from anywhere in\
    \ the component tree. Selecting an event will display more information about it\
    \ in the right-hand pane, allowing you to see which component emitted it and any\
    \ payload that was sent.\n\nThere’s a lot more to Vue’s browser tools than I’ve\
    \ demonstrated here, so I encourage you to install them and experiment with them\
    \ as your application grows.\n\n## Conclusion\n\nAnd that’s a wrap. In this guide,\
    \ I’ve demonstrated how to install the Vetur plugin for VS Code and highlighted\
    \ several of its features. I’ve also shown how to use Vue CLI to generate a project\
    \ and how to use ESLint and Prettier to ensure code quality and consistency. We\
    \ also took a brief look at Vue’s browser tools and saw how to inspect the state\
    \ of a running Vue application, something which is important for debugging purposes.\n\
    \nThis should see you well on the way to having a sensible environment for writing\
    \ Vue applications and hopefully make you a productive and happy developer.\n\n\
    # Chapter 2: Five Top Vue Animation Libraries\n\n### by Maria Antonietta Perna\n\
    \nIn this article, we’ll look at what Ethereum nodes are, and explore one of the\
    \ most popular ones, called Geth.\n\nAnimation can be your powerful tool in your\
    \ toolbox. It keeps web users engaged, and it’s lots of fun to create. Vue.js\
    \ is a progressive JavaScript framework that lets you build user interfaces and\
    \ powerful apps.\n\nFollow me as I show you you can quickly set Vue in motion\
    \ with five great animation libraries.\n\n## Why Animation on the Web?\n\nOur\
    \ brains are hardwired to pay attention and react to things that move around us.\
    \ This is a survival mechanism, but also part of the way we understand the world.\
    \ Websites are communication tools, and animation is part of the communication\
    \ strategy. As such, web animation, far from simply decorative, is functional\
    \ to the success of a website’s goals, and therefore plays a number of roles.\n\
    \n### A Few Words of Caution about Web Animation\n\nWhen it comes to web animation,\
    \ usually less is more. Going overboard with your animations is tempting, but\
    \ it’s often a consequence of poor design. To avoid falling into this trap, it’s\
    \ useful to keep in mind that animation should have a point and should facilitate\
    \ what users are expected to do on your website. In other words, animation must\
    \ not be in the way.\n\nAnother aspect of animation you should be aware of is\
    \ that motion on the Web can have some serious accessibility implications:\n\n\
    > It’s no secret that a lot of people consider scrolljacking and parallax effects\
    \ annoying and overused. But what if motion does more than just annoy you? What\
    \ if it also makes you ill? — *Val Head, [Designing Safer Web Animation for Motion\
    \ Sensitivity](https://alistapart.com/article/designing-safer-web-animation-for-motion-sensitivity)*\n\
    \nVal Head refers to visually triggered vestibular disorders, which can cause\
    \ symptoms of nausea, dizziness, headaches and even worse, at the sight of large-scale\
    \ motion on screen. One way in which you can minimize discomfort to your users\
    \ is to give them control over whether they want to start an animation, and at\
    \ what speed. For more details on this topic, check out [More Resources for Accessible\
    \ Animations](https://alistapart.com/blog/post/more-resources-for-accessible-animations)\
    \ by Val Head, which, together with the article cited above, covers a great deal\
    \ of ground and goes a long way towards helping you craft animations designed\
    \ with accessibility and respect for your website’s users.\n\n### What Web Animation\
    \ Is Good For\n"
