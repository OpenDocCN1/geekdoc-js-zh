    ### Build the Site


    Phew, this was a long ride. So finally our blog is ready to go and we can build
    it.


    Run the following in the terminal:


    ```

    npm run docs:build

    ```


    This will generate a `dist` folder, inside the `.vuepress` directory, with all
    files compiled and ready to be deployed.


    ## Internationalize Your Site


    As I mentioned before, we can make our site multilingual. However, I’m not going
    to explore this feature here. For more information, please [consult the documentation](https://v0.vuepress.vuejs.org/guide/i18n.html).


    ## Deploy Your Site to GitHub Pages


    Once your site is done, you have plenty of options for deploying. You can read
    about the different choices [in the documentation](https://v0.vuepress.vuejs.org/guide/deploy.html).
    I deployed my version of the blog to GitHub Pages. Here is how.


    1. I created a repo `vuepress`.

    2. Then, I set the `base` property in the `config.js` to be `/vuepress/`.

    3. Next, I created a `deploy.sh` file with the following code:


    ```bash

    # abort on errors

    set -e


    # build

    npm run docs:build


    # navigate into the build output directory

    cd docs/.vuepress/dist


    # if you are deploying to a custom domain

    # echo ''www.example.com'' > CNAME


    git init

    git add -A

    git commit -m ''deploy''


    # if you are deploying to https://<USERNAME>.github.io

    # git push -f git@github.com:<USERNAME>/<USERNAME>.github.io.git master


    # if you are deploying to https://<USERNAME>.github.io/<REPO>

    git push -f git@github.com:codeknack/vuepress.git master:gh-pages


    cd -

    ```

    4. Finally, I ran it. And that’s all.


    ## Conclusion


    In this tutorial, we learned what VuePress is, why we should use it, and how to
    create a simple blog with it. We also deployed the blog to GitHub Pages. All this
    gave us a solid understanding of the VuePress system and its capabilities. So
    now we’re ready to apply this knowledge in our future projects, creating more
    beautiful VuePress-powered sites.


    # Chapter 4: Five Vue UI Libraries for Your Next Project


    ### by Michiel Mulders


    According to [the official Vue.js website](https://vuejs.org/v2/guide/), Vue is
    a progressive framework for building user interfaces. It’s designed from the ground
    up to be incrementally adoptable, and the core library is focused on the view
    layer only. This makes it easy for devs to pick it up and quickly become productive.


    When starting a new project, designing a whole set of UI elements can be a time-consuming
    business. In this guide, I’m going to introduce you to five UI libraries that
    you can integrate with Vue in a few lines of code.


    ## What Is a UI Library?


    Before we get into things, let’s pause for a quick definition.


    A UI library usually consists of easy-to-use components which you can include
    in your Vue application using custom elements. You benefit from using a library
    like this, as you can create elements such as forms much faster, with most libraries
    offering a great range of input components with added functionality and events.


    Besides that, most libraries come with a proper and simple design which you can
    easily modify to your needs. In short, a UI library saves you time and helps you
    develop your application much faster.


    ## 1. Ant Design for Vue


    **Pros:**


    * Its components support a lot of functionality and modifications via API options.

    * It has a very minimal but beautiful design.

    * It offers a wide range of data entry and display components.

    * It has great ES6 support.


    **Cons:**


    * While it can be used in mobile applications via its [Col and Row components](https://vuecomponent.github.io/ant-design-vue/components/grid/#API),
    it’s more suitable for desktop web applications.


    With over 5,000 stars on GitHub, [Ant Design for Vue](https://github.com/vueComponent/ant-design-vue)
    is part of the bigger Ant Design library covering other frameworks like Angular
    and React. In my opinion, Ant Design has a very minimal but beautiful design which
    you can customize if needed. Ant Design is best known for its wide variety of
    data entry and data display components. Just their [data table](https://vuecomponent.github.io/ant-design-vue/components/table/)
    page shows more than 15 different data table examples you can implement in your
    web application.


    Ant Design for Vue is great if you like to work with the JavaScript ES6 standard.
    Besides that, it comes with a webpack-based debug build solution supporting ES6.


    In addition, Ant Design for Vue is known for its [great documentation](https://vuecomponent.github.io/ant-design-vue/docs/vue/getting-started/).
    It provides tons of API options that influence the behavior or design of your
    component. For example, [a simple checkbox](https://vuecomponent.github.io/ant-design-vue/components/checkbox/)
    has 5 properties: `autoFocus`, `checked`, `disabled`, `defaultChecked`, and `intermediate`
    (which can help you to achieve a “check all” effect).


    Also, the documentation always provides an event section for each component, which
    displays the type of events you can catch and what values are emitted. Every property
    in the documentation mentions its importance.


    As you can see, it’s a pleasure to work with Ant Design. The first snippet I selected
    is to the [timeline](https://vuecomponent.github.io/ant-design-vue/components/timeline/)
    which has a loading state. It shows the history of certain objects.


    #### Live Code


    ![-](Images/uilibs1.png)


    See the Pen [Ant Design Timeline](https://codepen.io/pen/QzGeKy).


    The second element shows an [upload](https://vuecomponent.github.io/ant-design-vue/components/upload/)
    that registers files, and you can even push the files to an endpoint. It’s a very
    useful component which is mostly hard to configure, but Ant Design just gets it.


    #### Live Code


    ![-](Images/uilibs2.png)


    See the Pen [Ant Design Upload](https://codepen.io/pen/roWXww/).


    ## 2. Element UI


    **Pros:**


    * It has a very large range of components.

    * It offers extensive documentation with version management.


    **Cons:**


    * The default language of Element is Chinese. If you want to use another language,
    you’ll need to do some i18n configuration.


    With over 35,000 stars on GitHub, [Element](https://github.com/ElemeFE/element)
    is one of the leading UI frameworks for Vue.js 2.0. Element is focused on web
    applications. Built upon a strong community of over 400 contributors, the library
    provides a rich selection of customizable components along with a full style guide
    and more resources.


    Element is quite similar to Ant Design, as it provides the same minimal style
    with a beautiful touch. But Element provides better capabilities for designers
    to change the style and layout of all components using an easy [style guide](https://element.eleme.io/#/en-US/component/custom-theme)
    where you can change things such as the primary color of the theme.


    Element offers 16 components for building nice, easy-to-understand forms. Besides
    that, it offers several components for things such as data display, navigation,
    and message.


    ### Code Snippets


    The first element I want to bring to your attention is the [tree select](https://element.eleme.io/#/en-US/component/tree).
    It allows you to display and select data in a hierarchical structure. Here’s an
    example implementation of this tree component in Vue which shows how to load node
    data asynchronously.


    #### Live Code


    ![-](Images/uilibs3.png)


    See the Pen [Element - Tree select](https://codepen.io/pen/oJYKyQ).

