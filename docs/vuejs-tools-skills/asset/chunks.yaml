    \ a `posts` data property to hold our blog posts. Then, we create an `allPosts`\
    \ computed property to get all the posts from the current collection and sort\
    \ them by date. We use the `created` hook to populate the sorted posts in the\
    \ `posts` data property.\n\nWe then go through the posts with a `v-for` directive\
    \ and populate each one by extracting data from its `Front Matter`. We use a `formatDate`\
    \ filter to display the date in human-readable format.\n\nWe implement tags and\
    \ category features by creating two filters:\n\n*   `filterTaxonomies` filters\
    \ all pages which have a particular taxonomy type and search term.\n\n*   `findTaxonomy`\
    \ goes through each page and collects the desired taxonomy. Then, it extracts\
    \ and returns only the unique terms from the collected taxonomies.\n\nThe above\
    \ two filters are used in the template to create the `Categories` and `Tags` panels,\
    \ which display all existing categories and tags.\n\nFinally, we use the [`<transition-group>`\
    \ component](https://vuejs.org/v2/guide/transitions.html#List-Transitions) to\
    \ add a smooth transition when we filter the blog posts, as well as `currentCat`\
    \ and `currentTag` data properties to assign proper active classes to the selected\
    \ tag or category.\n\n#### Post.vue\n\nNow, let’s create the layout for the single\
    \ post:\n\n```\n<template>\n  <div class=\"content\">\n    <h1>{{ $page.frontmatter.title\
    \ }}</h1>\n    <Content/>\n  </div>\n</template>\n\n<style>\n.content {\n  margin-top:\
    \ 2em;\n  padding: 0 2em;\n}\n</style>\n```\n\nIn the single post layout we just\
    \ display the title and the content.\n\n### Adding Some Styles\n\nFor the Markdown\
    \ extensions to be properly displayed, we’ll need some styling. We’ll steal the\
    \ necessary styles from the default theme and we’ll put them at the end of our\
    \ `Layout.vue` component:\n\n```\n<style src=\"prismjs/themes/prism-tomorrow.css\"\
    ></style>\n<style lang=\"stylus\">\n/* colors */\n$accentColor = #3eaf7c;\n$textColor\
    \ = #2c3e50;\n$borderColor = #eaecef;\n$codeBgColor = #282c34;\n$arrowBgColor\
    \ = #ccc;\n\n/* code */\n$lineNumbersWrapperWidth = 3.5rem;\n$codeLang = js ts\
    \ html md vue css sass scss less stylus go java c sh yaml py;\n\n@import './styles/custom-blocks.styl';\n\
    @import './styles/code.styl';\n</style>\n```\n\nFirst, we add the necessary CSS\
    \ file for the syntax highlighting. Then, we add some Stylus variables and import\
    \ two Stylus files. The Stylus imports are very long, so I don’t want to list\
    \ their contents here. Rather, you can grab them from our repo: [custom-blocks.styl](https://github.com/sitepoint-editors/vuepress/blob/master/docs/.vuepress/theme/styles/custom-blocks.styl)\
    \ and [code.styl](https://github.com/sitepoint-editors/vuepress/blob/master/docs/.vuepress/theme/styles/code.styl).\n\
    \nAt this point, you should be able to click around your blog and see all of the\
    \ posts displayed under the different categories.\n\n### Using Vue Components\
    \ in Markdown\n\nAs I mentioned at the beginning, we can use templates and components\
    \ directly in our Markdown. To add the `<Message/>` component we created earlier\
    \ to the home page, we just add it in the home’s `README.md` like this (in `docs/README.md`):\n\
    \n```\n---\ntitle: Home\n---\n\n<Message/>\n```\n\nNow, when you visit [http://localhost:8080](http://localhost:8080),\
    \ you should see a nicely styled `Message` component.\n\n### Using Markdown Extensions\n\
    \nVuePress comes with some Markdown extensions optimized for technical documentation.\
    \ Here are some of them. You can add them to `docs/README.md` to see them in action\
    \ straight away, or view them on the [blog’s home page](https://sitepoint-editors.github.io/vuepress/):\n\
