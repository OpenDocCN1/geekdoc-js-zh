  trans: "\n\n```markdown\n---\ntitle: 学习 JavaScript 函数\ndate: 2018-12-12\ncategories:\
    \ [Intermediate]\ntags: [JavaScript, 函数, 回调函数]\n---\n\n<!-- 在此处输入你的 Markdown 内容\
    \ -->\n```\n\n## 获取内容\n\n如上所述，我们不会在这里填充所有的博客文章。如果你想从已完成的站点复制任何内容，[你可以在这里找到](https://github.com/sitepoint-editors/vuepress/tree/master/docs/blog)。\n\
    \n## 创建 `Layout.vue` 组件\n\n完成内容准备后，让我们开始创建自定义的主题。在 `.vuepress/theme/Layout.vue`\
    \ 中添加以下内容：\n\n```html\n<template>\n  <div class=\"container\">\n    <Navbar/>\n\
    \    <Component :is=\"currentLayout\"/>\n    <Footer/>\n  </div>>\n</template>\n\
    \n<script>\nimport Home from \"./layouts/Home.vue\";\nimport Blog from \"./layouts/Blog.vue\"\
    ;\nimport Post from \"./layouts/Post.vue\";\nexport default {\n  components: {\n\
    \    Home,\n    Blog,\n    Post\n  },\n  computed: {\n    currentLayout() {\n\
    \      const { path } = this.$page;\n      if (path === \"/\") {\n        return\
    \ \"Home\";\n      } else if (path.endsWith(\"/\")) {\n        return \"Blog\"\
    ;\n      } else if (path.endsWith(\".html\")) {\n        return \"Post\";\n  \
    \    }\n    }\n  }\n};\n</script>\n```\n\n`Layout.vue` 会为每个 Markdown 文件进行调用。它就像\
    \ Vue 应用中的根组件。此文件中的代码会检查当前页面的路径（通过 `currentLayout` 计算属性），并根据结果加载所需的布局。为此，我们使用\
    \ Vue 内置的 `<Component/>` 元素，它通过其 `is` 属性切换显示的组件。在模板中，我们还放入了 `<Navbar/>` 和 `<Footer/>`\
    \ 组件，它们将在后续章节中创建。\n\nVuePress 暴露了两个变量——`this.$page` 和 `this.$site`——它们分别让我们访问[关于页面和站点的数据](https://v0.vuepress.vuejs.org/guide/custom-themes.html#site-and-page-metadata)。在\
    \ `currentLayout` 中，`this.$page` 用于获取当前页面的路径。\n\n## 创建部分组件\n\n在本节中，我们将查看部分组件，并将它们导入到我们的布局中。这些部分组件位于\
    \ `.vuepress/components` 文件夹中。\n\n### Navbar.vue\n\n在这个组件中，我们使用 [Bulma 的 Navbar\
    \ 组件](https://bulma.io/documentation/components/navbar/) 为我们的博客创建一个导航栏：\n\n```html\n\
    <template>\n  <nav class=\"navbar is-dark\" role=\"navigation\" aria-label=\"\
    main navigation\">\n    <div class=\"navbar-brand is-marginless\">\n      <a class=\"\
    navbar-item\" :href=\"$withBase('/')\">\n        <span class=\"icon is-large has-text-warning\"\
    >\n          <i class=\"fas fa-2x fa-laptop-code\"></i>\n        </span>\n   \
    \   </a>\n      <a\n        role=\"button\"\n        class=\"navbar-burger\"\n\
    \        :class=\"{'is-active': isActive}\"\n        @click=\"isActive = !isActive\"\
    \n        aria-label=\"menu\"\n        aria-expanded=\"false\"\n        data-target=\"\
    navbarMenu\"\n      >\n        <span aria-hidden=\"true\"></span>\n        <span\
    \ aria-hidden=\"true\"></span>\n        <span aria-hidden=\"true\"></span>\n \
    \     </a>\n    </div>\n\n    <div id=\"navbarMenu\" class=\"navbar-menu\" :class=\"\
    {'is-active': isActive}\">\n      <div class=\"navbar-end\">\n        <a class=\"\
    navbar-item\" :href=\"$withBase('/')\">首页</a>\n        <a class=\"navbar-item\"\
    \ :href=\"$withBase('/blog/')\">博客</a>\n        <a\n          class=\"navbar-item\"\
    \n          :href=\"$withBase(collection.path)\"\n          v-for=\"collection\
    \ in collections\"\n        >{{collection.path | formatNavItems}}</a>\n      </div>\n\
    \    </div>\n  </nav>\n</template>\n\n<script>\nexport default {\n  data: function()\
    \ {\n    return {\n      isActive: false\n    };\n  },\n  computed: {\n    collections()\
    \ {\n      let pages = this.$site.pages.filter(page => {\n        return page.path.match(/(blog\\\
    /).+(\\/$)/);\n      });\n      return pages;\n    }\n  },\n  filters: {\n   \
    \ formatNavItems(value) {\n      if (!value) return \"\";\n      let pos = value.search(/\\\
    w+\\/$/);\n      let res = value.slice(pos, value.length - 1);\n      return res.toUpperCase();\n\
    \    }\n  }\n};\n</script>\n\n<style>\n.navbar {\n  padding-right: 1em;\n}\n</style>\n\
    ```\n\n在此文件中，我们创建了一个计算属性 `collections`，它会过滤所有页面并仅匹配博客目录及其子目录。我们在模板中使用该属性为导航栏填充每个集合的链接。我们还使用了\
    \ [withBase](https://v0.vuepress.vuejs.org/guide/custom-themes.html#site-and-page-metadata)\
    \ 辅助函数。\n\n### Hero.vue\n\n在这个组件中，我们使用 [Bulma hero 元素](https://bulma.io/documentation/layout/hero/):\n\
    \n```html\n<template>\n  <section class=\"hero is-success\">\n    <div class=\"\
    hero-body\">\n      <div class=\"container\">\n        <h1 class=\"title\">前端学校</h1>\n\
    \        <h2 class=\"subtitle\">学习 HTML、CSS 和 JavaScript</h2>\n      </div>\n\
    \    </div>\n  </section>\n</template>\n```\n\n### Message.vue\n\n在这个组件中，我们创建了一个消息框，将其显示在首页。我们使用\
    \ [Bulma 的组件](https://bulma.io/components/message/) 来此：\n\n```html\n<template>\n\
    \  <article class=\"message is-info\" :class=\"{hidden: dismiss}\">\n    <div\
    \ class=\"message-header\">\n      <p>欢迎来到我们的博客</p>\n      <button @click=\"hide\"\
    \ class=\"delete\"></button>\n    </div>\n    <div class=\"message-body\">Lorem\
    \ ipsum...</div>\n  </article>\n</template>\n\n<script>\nexport default {\n  data:\
    \ function() {\n    return {\n      dismiss: false\n    };\n  },\n  methods: {\n\
    \    hide() {\n      this.dismiss = true;\n    }\n  }\n};\n</script>\n\n<style>\n\
    .hidden {\n  display: none;\n}\n</style>\n```\n\n### Footer.vue\n\n这是一个使用 [Bulma\
    \ 页脚](https://bulma.io/documentation/layout/footer/) 创建的简单页脚：\n\n```html\n<template>\n\
    \  <footer class=\"footer has-background-darker\">\n    <div class=\"content has-text-centered\"\
    >\n      <p>©2018 版权所有</p>\n    </div>\n  </footer>\n</template>\n\n<style>\n\
    .footer {\n  margin-top: 2em;\n}\n</style>\n```\n\n## 创建布局组件\n\n现在是为我们的博客创建自定义布局。在本节中，我们将查看\
    \ `.vuepress/theme/layouts` 文件夹中的文件：`Home.vue`、`Blog.vue` 和 `Post.vue`。\n\n###\
    \ Home.vue\n\n这将是首页模板。它非常简单：\n\n```html\n<template>\n  <div>\n    <Hero/>\n  \
    \  <Content/>\n  </div>\n</template>\n```\n\n我们只需添加 `<Hero/>` 部分组件和 [VuePress\
    \ 全局组件 `<Content/>`](https://v0.vuepress.vuejs.org/guide/custom-themes.html#content-outlet)。\n\
    \n在此处花点时间检查你的进度。你应该看到站点渲染了一个漂亮的 hero 元素。如果你在浏览器中测试它，应该发现它也是响应式的。\n\n![](img/Front-end-Web-School.png)\n\
    \n### Blog.vue\n\n这是我们最复杂的组件，它将为每个集合渲染博客文章。它还会查找并过滤我们在 Markdown 文件 `Front Matter`\
    \ 部分中设置的分类法（分类和标签）。\n\n"
- fmt: "\n```html\n<template>\n  <div>\n    <div class=\"content\">\n      <h1>{{\
    \ $page.frontmatter.title }}</h1>\n      <Content/>\n    </div>\n    <div v-if=\"\
    posts.length\">\n      <div class=\"columns\">\n        <!-- Filter controls -->\n\
    \        <div class=\"column is-3\">\n          <nav class=\"panel\">\n      \
