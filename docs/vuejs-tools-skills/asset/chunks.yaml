    \ First Static Site with VuePress\n\n### by Ivaylo Gerchev\n\nIn this tutorial,\
    \ we’ll build a static site with [VuePress](https://vuepress.vuejs.org/) and we’ll\
    \ deploy it to [GitHub Pages](https://pages.github.com/). The site will be a simple,\
