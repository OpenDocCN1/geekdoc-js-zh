  raw: "[Animatelo](https://gibbok.github.io/animatelo/) by Gibbok is—\n\n> a bunch\
    \ of cool, fun, and cross-browser animations for you to use in your projects.\
    \ Great for emphasis, home pages, sliders, and general just-add-water-awesomeness.\
    \ — *[Animatelo](https://github.com/gibbok/animatelo)*\n\nIt’s also a porting\
    \ to the Web Animations API of the Animate.css project examined earlier.\n\nIt’s\
    \ a great option if you need to add a bit more dynamism to your CSS animations.\n\
    \nBelow is a snippet taken from the library’s docs to show you the basic usage:\n\
    \n```\n<!-- Include the polyfill -->\n<script src=\"//cdn.rawgit.com/web-animations/web-animations-js/2.2.2/web-animations.min.js\"\
    ></script>\n\n<!-- Include Animatelo -->\n<script src=\"//cdn.rawgit.com/gibbok/animatelo/1.0.3/dist/animatelo.min.js\"\
    ></script>\n\n<!-- Set up a target to animate -->\n<h1 id=\"hello\">Hello world!</h1>\n\
    \n<!-- Animate! -->\n<script>\n  window.animatelo.flip('#hello');\n</script>\n\
    ```\n\nHere are a couple of things to notice:\n\n*   Since Animatelo uses the\
    \ [Web Animations API](https://developer.mozilla.org/en-US/docs/Web/API/Web_Animations_API),\
    \ it needs a polyfill, at least until wider [browser support becomes available](https://caniuse.com/#search=web%20animations%20api)\n\
    \n*   To set an element in motion, the syntax above with your chosen pre-built\
    \ animation and a reference to your element is all you need. More generally, structure\
    \ your code like this: `window.animatelo.animation(selector, options)`.\n\nThe\
    \ options Animatelo makes available are:\n\n*   `id` (optional): a DOM string\
    \ you can use to reference your animation, which is specific to Animate.css.\n\
    \n*   `delay` (optional): the number of milliseconds you want to delay the start\
    \ of the animation. It defaults to 0.\n\n*   `direction` (optional): you can set\
    \ this value to `normal` (the animation runs forward), `reverse` (the animation\
    \ runs backwards), `alternate` (the animation switches direction after each iteration),\
    \ `alternate-reverse` (the animation runs backwards and switches direction after\
    \ each iteration).\n\n*   `duration` (optional): the number of milliseconds your\
    \ animation lasts. It defaults to 1000 milliseconds.\n\n*   `fill` (optional):\
    \ you can set this option to `backwards` (you can see the animation’s effect before\
    \ the animation even starts playing), `forwards` (the animation’s effects are\
    \ retained after the animation has finished playing), or `both`, which is the\
    \ default value.\n\n*   `iterations` (optional): the number of times you want\
    \ your animation to repeat. 1 is the default value, but you can pick any other\
    \ number, and if you want your animation to repeat indefinitely, just set it to\
    \ `infinite`.\n\nYou can also use the `onfinish` property to trigger an animation\
    \ as soon as another one completes:\n\n```\nconst anim1 = window.animatelo.shake('#headline1',\
    \ {\n  delay: 500,\n  duration: 1500\n})[0];\nanim1.onfinish = function() {\n\
    \  const anim2 = window.animatelo.wobble('#headline2', {\n    duration: 1500\n\
    \  })[0];\n};\n```\n\n#### Live Code\n\nSince Vue.js is so awesome for animation,\
    \ making Animatelo work with Vue is also quite straightforward. Check out this\
    \ cute entrance/exit effect and have fun deconstructing the code: See the Pen\
    \ [Animatelo + Vue Demo](https://codepen.io/SitePoint/pen/PXzwwZ/)\n\n## #3 Pose.js\n\
    \n[Pose.js](https://popmotion.io/pose/) is an intuitive animation library tailor\
    \ made for Vue, React and React Native. The documentation’s [opening lines](https://popmotion.io/pose/learn/vue-get-started)\
    \ describe it as follows:\n\n> Pose for Vue is a declarative motion system that\
    \ combines the simplicity of CSS transitions with the power and flexibility of\
    \ JavaScript.\n\nThe way this library works is by defining possible states, or\
    \ poses, for your component, a bit like CSS animations.\n\nPose has got tons of\
    \ features, so let’s start with a simple example of a red box that scales up and\
    \ then down on a click event:\n\n```\nnew Vue({\n  el: '#app',\n  data() {\n \
    \   return {\n      isVisible: false,\n      moving: true\n    }\n  },\n  components:\
    \ {\n    Box: posed.div({\n      pressable: true,\n      init: {scale: 1},\n \
    \     press: {scale: 2}\n    })\n  }\n});\n```\n\nInside your component’s JS section,\
    \ or in the case of this simple demo inside the Vue instance, you need to add\
    \ a `components` section. You then use `posed.` plus the name of the element you\
    \ want to animate. The magic of `posed` is that it allows you to create animated\
    \ versions of any HTML or SVG element. For example, `posed.div()` lets you build\
    \ an animated div. I called the component that represents this animated div `Box`,\
    \ but you can call it whatever you prefer.\n\nNext, you add some properties that\
    \ control your animation. The ones I used above are just a tiny fraction of what\
    \ Pose.js makes available, and you can already achieve a nice effect with very\
    \ little code. Let’s go through them one by one:\n\n*   `pressable` set to `true`\
    \ indicates that the element can react to mouse and touch down events\n\n*   `init`\
    \ allows you to set an initial CSS. property to a certain initial value, which\
    \ then gets modified through the animation.\n\n*   `press` lets you set your chosen\
    \ CSS property to the value you want the element to animate to when pressed (either\
    \ by a mouse or touch down event). Pose makes available other cool interactive\
    \ options like drag, hover, and focus.\n\nIn the template section, you add the\
    \ Box component like this:\n\n```\n<div id=\"app\">\n  <Box class=\"box\"></Box>\n\
    </div>\n```\n\n#### Live Code\n\nCheck out what the animation looks like in this\
    \ [live demo.](https://codepen.io/SitePoint/pen/YdWPPm/)\n\nYou can also configure\
    \ custom transitions and take full control of the animation:\n\n```\ntransition:\
    \ {\n  default: { ease: \"linear\" }\n}\n```\n\nInside each transition object\
    \ you can specify a few properties like `ease`, `duration`, `delay`, and so on.\
    \ The `ease` property affects the speed of the animation over the course of its\
    \ duration and it’s super important if you aim for professional-looking animations.\
    \ Pose offers a number of ease values:\n\n*   linear\n\n*   easeIn, easeOut, easeInOut\n\
    \n*   circIn, circOut, circInOut\n\n*   backIn, backOut, backInOut\n\n*   anticipate\n\
    \n*   an array of numbers to create a cubic bezier easing function\n\nThe default\
    \ transition is tween, but by setting the `type` property you’ll also find other\
    \ fun choices like:\n\n*   **Spring**, which maintains velocity between animations\
    \ to create engaging motions that you can further fine-tune by adjusting `stiffness`,\
    \ `mass`, and `damping` properties\n\n*   **Decay** reduces the velocity of an\
    \ animation over its duration and it works beautifully for the special `dragEnd`\
    \ pose that fires when users stop dragging an element on the page\n\n*   **Keyframes**\
    \ allow you to set up a series of tween values\n\n*   **Physics** lets you simulate\
    \ effects like velocity, friction, and acceleration.\n\nAnother feature of Pose\
    \ that I like a lot is the way you can coordinate animations between parent and\
    \ multiple children with ease. Whenever a posed component changes its `pose`,\
    \ the change propagates through its children—even those which aren’t direct children.\n\
    \n#### Live Code\n\n[Experiment with this demo](https://codepen.io/SitePoint/pen/bOeNVg/)\
    \ to get familiar with how Pose quickly animates all the list items inside a togglable\
    \ sidebar component.\n\n## #4 GreenSock (GSAP)\n\n[GreenSock](https://greensock.com/),\
    \ also known as GSAP (GreenSock Animation Platform) is a fantastic library for\
    \ the creation of “ultra high-performance, professional-grade animation for the\
    \ modern web.”\n\nWhen it comes to web animation, there’s almost nothing that\
    \ you can’t do with GSAP. Here are some of what I think are its strongest points:\n\
    \n*   You can learn it in no time. Its API is intuitive and straightforward.\n\
    \n*   The docs are excellent.\n\n*   It’s a mature library that’s been around\
    \ for years.\n\n*   It’s got great cross-browser support that goes back to IE6!\n\
    \n*   It works like a charm with HTML5, SVG, Canvas, jQuery, React, Vue, and more.\n\
    \n*   It’s fast.\n\n*   It’s continually being maintained and updated."
