    \ component for mobile applications—which not many UI libraries offer. You can\
    \ add multiple icons to the speed dial that each have their own action attached\
    \ to it.\n\n### Live Code\n\n![-](Images/uilibs5.png)\n\nSee the Pen [Vue Material\
    \ - speed dial](https://codepen.io/SitePoint/pen/xmgKOM/).\n\nThe second item\
