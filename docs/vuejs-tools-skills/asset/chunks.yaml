    \    ```\n    ```\n\n*   **Custom containers and emoji**:\n\n    ```\n    :::\
    \ warning\n    Be careful! VuePress is highly addictive! :wink:\n    :::\n   \
    \ ```\n\n*   To display the **line numbers**, we have to add the following to\
    \ the `.vuepress/config.js` file:\n\n    ```\n    markdown: {\n      lineNumbers:\
    \ true\n    }\n    ```"
