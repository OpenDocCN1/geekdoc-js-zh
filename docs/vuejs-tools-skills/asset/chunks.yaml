    \n              @click.prevent=\"filterTaxonomies('categories', cat);currentCat\
    \ = i;currentTag = null\"\n            >\n              <span class=\"panel-icon\"\
    >\n                <i class=\"fas fa-tasks\"></i>\n              </span>\n   \
