    \ and plain text content make a static site extremely accessible to search engines.\n\
    \n*   **Security**. A static site is far more secure than a dynamic one. According\
    \ to a [WP WhiteSecurity report](https://www.wpwhitesecurity.com/statistics-70-percent-wordpress-installations-vulnerable/),\
    \ about 70% of WordPress sites are at risk of getting hacked. Because a static\
    \ site doesn’t rely on a database, CMS and/or plugins, the chances of getting\
    \ hacked is minimal.\n\n*   **Salability**. A static site can be easily scaled\
    \ up by just increasing the bandwidth.\n\n*   **Version Control Support**. Adding\
    \ version control to a static site is super easy.\n\n## Why Use VuePress?\n\n\
    There’s an abundance of [static site generators](https://www.staticgen.com/) out\
    \ there. So why might we choose VuePress over the others options?\n\nWell, for\
    \ me, these are the two strongest selling points of VuePress:\n\n1.  VuePress\
    \ is built with Vue. This means that we can use all the superpowers of Vue while\
    \ we build our site.\n\n2.  We can add a VuePress site to any existing project,\
    \ at any time.\n\nThe above benefits are already strong enough, but let’s explore\
    \ the full feature palette that makes VuePress shine:\n\n*   There’s close integration\
    \ between Vue templates/components and Markdown files. We can use Vue templates/components\
    \ directly in Markdown, which give us great flexibility.\n\n*   VuePress uses\
    \ [markdown-it](https://github.com/markdown-it/markdown-it), one of the best Markdown\
    \ parsers out there, which has a rich [plugin ecosystem](https://www.npmjs.org/browse/keyword/markdown-it-plugin).\
    \ Some of its plugins, optimized for technical documentation, are already bundled\
    \ with VuePress. And we can [add more](https://v0.vuepress.vuejs.org/guide/markdown.html#advanced-configuration)\
    \ if we want."
