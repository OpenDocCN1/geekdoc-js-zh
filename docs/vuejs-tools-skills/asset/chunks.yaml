    \ return day === 6 || day === 0\n    }\n  })\n})\n```\n\nIt’s a good example of\
    \ controlling the input of your users with a smart UI.\n\n### Live Code\n\n![-](Images/uilibs6.png)\n\
    \nSee the Pen [Vue Material - date picker disabled days](https://codepen.io/SitePoint/pen/xmgKgB/).\n\
    \n## 4. iView\n\n**Pros:**\n\n* It offers clean animations.\n* It offers a wide\
    \ range of components with amazing data table components.\n* It has an easily\
