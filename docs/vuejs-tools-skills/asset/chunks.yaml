    However, saying this, whichever library you pick will depend on your project requirements.
    They all have their strengths and weaknesses, and there isn’t one that covers
    all the bases alone.


    # Chapter 5: Five Handy Tips when Starting Out with Vue


    ### by David Bush


    I originally came to the world of [Vue](https://vuejs.org/) from [ReactJS](https://reactjs.org/).
    Learning to divide my page up into small, reusable components and how to leverage
    the component lifecycle represented a shift in approach to problems, but I quickly
    got proficient.


    [React Native](https://facebook.github.io/react-native/) allowed me to write apps
    for both major smartphone platforms, which made it a slam dunk for me. But I kept
    hearing about how great Vue was. Crucially, I noticed no one I spoke to had anything
    bad to say about it, and experience tells me that the absence of multiple people
    having qualms with a language or framework means it should be investigated immediately,
    so I did.


    These are the things I wish I’d known when I was starting out.


    ## Incremental Adoption


    In my many years of programming, I’ve seldom found it a trivial undertaking to
    switch out an entire view layer. While I was keen to try Vue, I wasn’t prepared
    to initiate a whole rewrite to do so. I was exceedingly happy to learn that, with
    Vue, you don’t have to! You can incrementally add it to projects with a piecemeal
    rewrite simply by including the library file and adding components. This allows
    you to add new features and leverage its many strengths without having to throw
    out your current code, so there’s no excuse not to try it!


    ## Devtools


    One thing I found useful was the addition of [Vue Devtools](https://github.com/vuejs/vue-devtools)
    to my browser (available on both [Firefox](https://addons.mozilla.org/en-US/firefox/addon/vue-js-devtools/)
    and [Chrome](https://chrome.google.com/webstore/detail/vuejs-devtools/nhdogjmejiglipccpnnnanhbledajbpd?hl=en)).
    It renders superfluous those cumbersome `console.log()` debug calls by instead
    showing you the contents of each component in your devtools pane. It also affords
    you the ability to jump directly to a component in your editor (admittedly with
    a [little tweaking](https://github.com/vuejs/vue-devtools/blob/dev/docs/open-in-editor.md))
    which I’ve found to be an absolutely killer feature, particularly in larger projects.
    Here’s a screenshot of it in action:


    ![Vue Devtools screenshot](Images/vue-dev-tools.png)


    As you can see, everything passed down to the component is immediately visible;
    there’s no need for debugging code of any sort. But that’s not all! Much like
    you might be used to doing with rendered HTML or CSS, you can edit Vue components
    directly in the browser: add values to your props, modify them, or perhaps remove
    them entirely to see how your app responds. I do almost all of my development
    in a terminal window, but I’m finding myself taking advantage of this in-browser,
    instant feedback loop more and more frequently. To my mind, there’s no higher
    praise than willingly modifying your own workflow to leverage a tool.


    Additionally, component navigation is outstanding. Not only is there an `Inspect
    Vue component` option in the context menu, there’s also a fuzzy search to filter
    your components by name, which is a very nice touch. You can also see the history
    of your Vuex state and “time travel” back to any given point (which is an invaluable
    tool when debugging issues rooted in complex state changes). Another useful feature
    is a tab to track [Custom Events](https://vuejs.org/v2/guide/components-custom-events.html)
    from your own components (those of the `this.$emit(''YourEvent'')` variety), but
    lamentably not native events like `<button v-on:click="counter += 1">Add 1</button>`:


    ![Event history screenshot](Images/vue-event-history.png)


    ## Avoid Event Buses


    I find Vue’s native mechanism of passing state to be excellent, but inevitably,
    as your app scales, you’re going to need the same data in multiple different places
    and that’s going to be unwieldy. The typical example of this is the instance of
    data sharing between sibling components, or even two components that aren’t related
    in any way. One project I worked on recently needed to access a `category` field,
    both on a list item and in a “grouping” view elsewhere. Vuex is frequently an
    elegant solution to problems of this nature, because it adroitly sidesteps the
    constraints inherent in passing data via parent and child relationships.


    I must admit that there was a time in my life where I would reach straight for
    an event bus rather than delve into [Flux](https://facebook.github.io/flux/) architecture.
    I had read from a few people on [Hacker News](https://news.ycombinator.com/) that
    Flux, and, by extension, [Redux](https://redux.js.org/introduction/getting-started)
    and [Vuex](https://vuex.vuejs.org/), were complicated to pick up, and as a result,
    avoided them for as long as possible. Finally, I sat down to get my head around
    it and I wish someone had told me this: “It’s just the [Command Pattern](https://en.wikipedia.org/wiki/Command_pattern).”
    That’s pretty much much all there is to it. As you may know, you write commands
    (or “Actions” in Flux parlance) which are executed (by the “Dispatcher” in this
    case), and the result is passed to a Store. I’m pleased to report that once I
    need to manage any state more complex, I reach for Vuex. Try it: it’s really not
    as complicated as you may have


    ## Vue CLI


    [Vue CLI](https://cli.vuejs.org/) is a relatively new addition to Vue, but I can’t
    speak highly enough of it. I’ve lost many hours over the last couple of years
    fiddling with configurations and integrating libraries, so to be able to effortlessly
    scaffold an app and be up and running is a breath of fresh air. Simply run `vue
    create <app_name>` and you’ll be prompted to select various options which are
    installed and configured. Out of the box, it will set you up with `Babel` and
    `ES`:


    - impose a degree of type safety on your project with [Typescript](https://www.typescriptlang.org/)

    - leverage [Progressive Web Apps](https://en.wikipedia.org/wiki/Progressive_web_applications)
    for mobile support

    - seamlessly route your [single page app](https://en.wikipedia.org/wiki/Single-page_application)
    with [Vue Router](https://router.vuejs.org/)

    - manage more complex levels of state with [Vuex](https://vuex.vuejs.org/)

    - make writing CSS more pleasant with [CSS Preprocessors](https://vue-loader.vuejs.org/guide/pre-processors.html),
    including [Sass/SCSS](https://sass-lang.com/), [Less](http://lesscss.org/) and
    [Stylus](http://stylus-lang.com/) flavors

    - pick your linting options from Typescript, various degrees of ESLint strictness
    (ranging from “error prevention only” all the way to my personal favorite, the
    Airbnb config)

    - ensure code stability with `Mocha](https://mochajs.org/) and its BDD cousin
    `Chai](https://www.chaijs.com/), or Facebook’s `Jest](https://jestjs.io/)

    - there’s even end-to-end testing options in [Cyprus](https://www.cypress.io/)
    or [Nightwatch](http://nightwatchjs.org/)


    This setup even gives you the option to “Save this as a preset for future projects”,
    which is useful once you’ve developed a preferred stack. Check out “Getting Started
    with Vuex: a Beginner’s Guide” in this Vue series for more Vue CLI goodness.


    ### Computed Properties

