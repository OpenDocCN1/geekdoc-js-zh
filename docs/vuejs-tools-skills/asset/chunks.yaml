    \ through motion](https://www.sitepoint.com/animating-the-dom-with-anime-js#animationontheweb).\
    \ For instance, color animation on hover draws users’ attention to the link. Animating\
    \ an area or an element of a web page gives users cues about where they’re expected\
    \ to look or what they’re expected to do. A fun loader communicates to users that\
    \ some process is taking place on the website and keeps them engaged so the perceived\
    \ waiting time feels shorter.\n\nAlso, the way you design an animation contributes\
    \ to the creation and reinforcement of brand identity while also giving your website\
    \ a sophisticated touch of professionalism and polish.\n\nFrom the point of view\
    \ of front-end devs, there’s never been a better time for coding motion experiences\
    \ on the web. Browsers’ handling of animation keeps improving, devices are more\
    \ and more capable, and there are some amazing tools out there you can use to\
    \ create web animations.\n\nLet’s explore some possibilities in relation to Vue.js.\n\
    \n## Vue.js Transition and Animation Systems\n\nApplying CSS transitions and animations\
    \ is a snap with Vue’s `<transition>` and `<transition-group>` components. Before\
    \ I illustrate how these work, let’s briefly clarify the difference between CSS\
    \ transitions and CSS animations.\n\n### CSS Transitions\n\n[CSS transitions](https://www.w3.org/TR/css-transitions-1/)\
    \ involve animating the state of a property from an initial starting point to\
    \ an end state in response to an event—such as a mouse hover, or a hover event.\
    \ The browser will take care of interpolating all the in-between states of the\
    \ animation. Therefore, if your animation consists of just changing a property\
    \ from A to B, transitions will be the simplest and most efficient way of implementing\
    \ it.\n\n### CSS Animations\n\n[CSS animations](https://www.w3.org/TR/css-animations-1/)\
    \ are great if your animation consists of more than just an initial and final\
    \ state and therefore you need more control over each stage throughout the movement.\n\
    \nFor more details on CSS transitions and animations, their differences and use\
    \ cases, check out “[CSS Transitions 101: Let’s Animate a Toggle Button Icon](https://blog.logrocket.com/css-transitions-101-lets-animate-a-toggle-button-icon-333967f5b971)”.\n\
    \n### CSS Transitions in Vue\n\nVue already makes hiding and showing content on\
    \ the page a painless and quick operation, using the [`v-if` or `v-show` directives](https://vuejs.org/v2/guide/conditional.html):\n\
    \n```\n<div id=\"app\">\n  <button v-if=\"show\" @click=\"show = !show\">Show</button>\n\
    </div>\n\n<script>\nnew Vue({\n  el: '#app',\n  data() {\n    return {\n     \
    \ show: true\n    }\n  }\n})\n</script>\n```\n\nThe snippet above shows the button\
    \ on the page only if the `show` property in the Vue instance is `true`. Clicking\
    \ the button causes the `show` property to switch to `false`, which in turn leads\
    \ to the removal of the button element.\n\nHowever, this approach produces a sudden\
    \ showing/hiding of the element, which doesn’t give users a great experience.\
    \ Enter CSS transitions and Vue’s `<transition>` component: the latter is a convenient\
    \ wrapper that Vue makes available to let you add transitions to any element or\
    \ component.\n\nHere’s how you’d use it to animate the button in the above example:\n\
    \n```\n<div id=\"app\">\n  <transition name=\"fade\">\n    <button v-if=\"show\"\
    \ @click=\"show = !show\">Show</button>\n  </transition>\n</div>\n```\n\nThe button\
    \ code is wrapped inside a `<transition>` component named *fade*.\n\nIn the CSS\
    \ code, the *fade* CSS transition is built using Vue’s `<transition>` component’s\
    \ hooks as follows:\n\n```\n.fade-leave-active{\n  transition: opacity 2s;\n}\n\
    \n.fade-leave-to {\n  opacity: 0;\n}\n```\n\nThe `.fade-leave-active` hook is\
    \ available while the animation is running, and it’s here that you can specify\
    \ the transition properties.\n\n`.fade-leave-to` represents the last positions\
    \ in the animation. In this case, by setting `opacity` to 0, the button starts\
    \ the animation by being visible and ends the animation by disappearing.\n\n####\
    \ Live Code\n\n[Here’s a live demo](https://codepen.io/SitePoint/pen/ZVOEZa/)\
    \ with both entering and leaving transition hooks.\n\nYou can get the lowdown\
    \ on all the transition classes available to you on the [Vue.js docs](https://vuejs.org/v2/guide/transitions.html#Transition-Classes).\n\
    \nVue also offers a `<transition-group>` component for animating more than one\
    \ element in one go, which I’m going to illustrate later in this article.\n\n\
    ### CSS Animations in Vue\n\nYou can add CSS animations to your Vue app using\
    \ the same `<transition>` component and the same class hooks as CSS transitions,\
    \ but instead of simply defining a starting point and an end point leaving the\
    \ browser to figure out the in-between states, you take matters in your own hands\
    \ using `@keyframes` to define each stage in the animation. The cool thing is\
    \ that you can code your own animations or just as easily plug in a CSS animation\
    \ library like Animate.css and you’re off to the races!\n\nLet’s see how you can\
    \ do just that.\n\n## #1 Animate.css\n\n[Animate.css](https://github.com/daneden/animate.css)\
    \ is a handy cross-browser library of sleek and playful CSS animations created\
    \ by Daniel Eden.\n\nYou can quickly put it to use by adding the `animated` class\
    \ to the element you intend to animate together with the name of the animation\
    \ of your choice among all the great options this library has to offer. You can\
    \ also add other animation-specific properties like how many times you want the\
    \ animation to play, its `duration`, `delay`, and so on.\n\nFor instance, here’s\
    \ a `<div>` element set up to bounce up and down for an infinite number of times:\n\
    \n```\n<div class=\"animated infinite bounce delay-2s\"></div>\n```\n\nTo include\
    \ Animate.css in your Vue app, add the library’s classes to the hooks made available\
    \ inside the `<transition>` component. Here’s an example:\n\n```\n<div id=\"app\"\
    >\n  <transition name=\"rotateSlide\" appear\n   enter-active-class=\"animated\
    \ rotateInUpRight\"\n   leave-active-class=\"animated slideOutUp\">\n      <div\
    \ v-if=\"show\" class=\"message\" @click=\"move\">\n        {{ bubble }}\n   \
    \   </div>\n  </transition>\n</div>\n```\n\nLet’s go through what happens in the\
    \ snippet above:\n\n*   The Vue animation is called *rotateSlide*.\n\n*   The\
    \ `appear` attribute ensures that the opening animation is triggered as soon as\
    \ the page renders in the browser.\n\n*   The `animated`, `rotateInUpRight` and\
    \ `slideOutUp` classes are Animate.css classes.\n\n*   Adding `rotateInUpRight`\
    \ to Vue’s `enter-active-class` causes the element to appear as it rotates on\
    \ the right side towards the top of the screen.\n\n*   By the same token, adding\
    \ `slideOutUp` to Vue’s `leave-active-class` causes the element to slide to the\
    \ top of the page and disappear. This second animation is triggered by clicking\
    \ on the element.\n\n#### Live Code\n\n[Here’s the full demo](https://codepen.io/SitePoint/pen/ZVOEZa/).\n\
    \n### Animate.css with Vue’s `<transition-group>` Component\n\nThe `<transition-group>`\
    \ component is Vue’s way of facilitating the animation of a bunch of elements\
    \ like list items. Its use is similar to the `<transition>` component. Here’s\
    \ a snippet to show what it looks like with Animate.css:\n\n```\n<transition-group\n\
    \  name=\"listitems\"\n  tag=\"ul\"\n  appear\n  enter-active-class=\"animated\
    \ bounceInUp\"\n>\n  <li\n    is=\"app-book\"\n    v-for=\"(book, index) in books\"\
    \n    :key=\"index\"\n    :book=\"book\">\n  </li>\n</transition-group>\n```\n\
    \nAbove, the `<transition-group>` component named *listitems* encloses a list\
    \ item component. Notice the `tag` property inside the transition-group with a\
    \ value of *ul*. This automatically generates the `<ul></ul>` tags around the\
    \ list’s `<li></li>` tags of the list component. When the page first renders,\
    \ the items in the list will make a smooth bouncing animation thanks to the Animate.css\
    \ `bounceInUp` class.\n\n#### Live Code\n\nHere’s [the full demo on CodePen](https://codepen.io/SitePoint/pen/roLaBv).\
    \ Feel free to play around with it.\n\n## #2 Animatelo.js"
