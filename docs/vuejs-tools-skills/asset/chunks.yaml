    \ category.\n\n### Post.vue\n\nWe use the `created` hook to populate the sorted\
    \ posts in the `posts` data property. We use the `<transition-group](https://sitepoint-editors.github.io/vuepress/guide/transitions)\
    \ prismjs/themes/tomorrow.css`:\n\n```html\n<template>\n  <div>\n    <div class=\"\
    content\">\n      <h1>{{ $page.frontmatter.title }}</h1>\n      <Content/>\n \
    \   </div>\n  </div>\n</template>\n\n<style>\n.content {\n  margin-top: 2em;\n\
    }\n</style>\n```\n\n### Using Vue Components in Markdown\n\nAs I mentioned at\
    \ the beginning, we can use templates and components directly in our Markdown.\
    \ To add the `<Message/>` component we created earlier to the home page, we just\
    \ add it in the home’s `README.md`:\n\n```markdown\n---\ntitle: Home\n---\n\n\
    <Message/>\n```\n\n### Using Markdown Extensions\n\nVue-Press comes with some\
    \ Markdown extensions optimized for technical documentation. Here are some of\
    \ them. You can add them to `README.md` to see them in action straight away, or\
    \ view them on the blog’s home page:\n\n- **Table of contents** (you’ll actually\
    \ need some content to see this in action):\n  ```markdown\n  [[toc]]\n  ```\n\
    \n- **Code blocks**, with line highlighting and optional line numbers:\n  ```markdown\n\
    \  ```js{2}\n\n  function add(a, b) {\n\n    return a * b; // Line highlighting\
    \ is cool!\n\n  }\n\n  ```\n  ```\n\n- **Custom containers and emoji**:\n  ```markdown\n\
    \  ::: warning\n  Be careful! VuePress is highly addictive! :wink:\n  :::\n  ```\n\
    \n- To display the **line numbers**, we have to add the following to the `.vuepress/config.js`\
    \ file:\n  ```javascript\n  markdown: {\n    lineNumbers: true\n  }\n  ```\n"
