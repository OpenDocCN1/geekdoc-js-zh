  trans: "\n\n![](img/default_cover.jpeg)\n![](img/default_cover.jpeg)\n\n# Vue.js：工具与技能\n\
    \nCopyright © 2019 SitePoint Pty. Ltd.\n\n电子书 ISBN: 978-1-925836-28-8\n\n* **封面设计：**\
    \ Alex Walker\n* **项目编辑：** James Hibbard\n\n## 权利声明\n\n所有权利保留。未经出版者书面许可，不得以任何形式或通过任何手段复制、存储在检索系统中或传输本书的任何部分，但包含批判性文章或评论中的简短引文除外。\n\
    \n## 免责声明\n\n作者和出版者已尽一切努力确保书中信息的准确性。然而，书中包含的信息按现状销售，不提供任何明示或暗示的保证。作者、SitePoint\
    \ Pty. Ltd. 以及其经销商或分销商均不对因书中包含的说明或此处描述的软件或硬件产品而直接或间接造成的任何损害不承担责任。\n\n## 商标声明\n\
    \n本书并非对每个商标名称的出现都进行标注，仅以编辑的方式使用这些名称，并有利于商标所有者，无侵犯商标之意。\n\n![SitePoint logo](img/sitepoint-logo-2012.png)\n\
    \nSitePoint Pty. Ltd. 出版\n48 Cambridge Street Collingwood\nVIC Australia 3066\n\
    网址：www.sitepoint.com\n邮箱：books@sitepoint.com\n\n## 关于 SitePoint\n\nSitePoint 专门为\
    \ Web 专业人员出版趣味性、实用且易于理解的内容。访问 [`www.sitepoint.com/`](http://www.sitepoint.com/)\
    \ 访问我们的博客、书籍、时通讯、文章和社区论坛。你将发现大量关于 JavaScript、PHP、设计等方面的信息。\n\n# 前言\n\n自 2014 年发布以来，Vue.js\
    \ 经历了如飙升般的人气增长，现在被认为是主要的 own 框架之一，这并非毫无理由。它基于组件的架构设计得灵活且易于采用，使其既可以轻松地集成到项目中并与非\
    \ Vue 代码一起使用，也可以用来构建复杂的客户端应用程序。\n\n此本书涵盖了你在使用 Vue 时需要的一些核心工具和技能。包含：\n\n1. James\
    \ Hibbard 著，*设置 Vue 开发环境*\n2. Maria Antonietta Perna 著，*五大顶级 Vue 动画库*\n3. Ivaylo\
    \ Gerchev 著，*使用 VuePress 构建你的第一个静态网站*\n4. Michiel Mulders 著，*为你下一个项目提供的五个 Vue\
    \ UI 库*\n5. David Bush 著，*开始学习 Vue 的五个实用技巧*\n\n## 谁应该读这本书？\n\n本书适合具有 JavaScript\
    \ 经验的开发者。\n\n## 使用的规范\n\n### 代码示例\n\n书中的代码使用等宽字体显示，如下：\n\n```\n <h1>A Perfect\
    \ Summer's Day</h1>\n<p>这是一个适合在公园散步的好日子。\n 鸟儿在歌唱，孩子们都回学校了。</p> \n```\n\n当需要现有代码作为上下文，而不是重复全部内容时，将显示\
    \ `⋮`：\n\n```\n function animate() {\n    ⋮\nnew_variable = \"Hello\";\n}\n```\n\
    \n某些代码行应该在一行内输入，但由于页面限制，我们对其进行了换行。`➥` 表示仅出于格式目的而存在的换行，应该被忽略：\n\n```\n URL.open(\"\
    http://www.sitepoint.com/responsive-web-\n➥design-real-user-testing/?responsive1\"\
    );\n```\n\n你会注意到我们在整书中使用了某些布局样式来表示不同类型的信息。请关注以下项目。\n\n### 提示、注释和警告\n\n#### 嘿，你！\n\
    \n提示（Tips）提供了有用的小建议。\n\n#### 咳，打扰一下……\n\n注释（Notes）是对当前主题相关但并非关重要的补充说明。将它们视为额外的信息片段。\n\
    \n#### 确保你始终……\n\n…… 注意这些重要要点。\n\n#### 注意！\n\n警告（Warnings）突出了在过程中可能会让你绊脚的任何陷阱。\n\
    \n# 第一章：设置 Vue 开发环境\n\n### James Hibbard 著\n\n如果你打算使用 Vue 进行任何严肃的工作，从长远来看，投入一些时间设置你的编码环境是非常有利的。一个强大的编辑器和一些精选的工具将使你效率更高，并最终成为一个更快乐的开发者。\n\
    \n在本教程中，我将演示如何配置 `VS Code` 以配合 Vue。我将展示如何使用 `ESLint` 和 `Prettier` 对你的代码进行 lint\
    \ 处理和格式化，以及如何使用 `Vue` 的浏览器工具来查看 Vue 应用内部的运行情况。当你读完后，你将建立好一个运行的开发环境，并准备好像大师一样开始编写\
    \ Vue 应用程序。\n\n让我们开始吧！\n\n## 安装并设置你的编辑器\n\n我提到过将使用 [VS Code](https://code.visualstudio.com/)\
    \ 进行本教程，但我恐怕我撒谎了。我实际上将使用 [VSCodium](https://github.com/VSCodium/vscodium)，它是 `VS\
    \ Code` 的一个开源分支，去除了微软的品牌、遥测和许可。该项目正在活跃开发中，我鼓励你去看看。\n\n你使用哪种编辑器来跟随操作没有关系；它们支持 Linux、Mac\
    \ 和 Windows。\n\n在本文后续内容中，我将编辑器称为 `VS Code`。\n\n### 添加 Vetur 插件\n\n当你启动编辑器时，你会看到左侧有一组图标。点击这些图标中的正方形图标，会打开一个搜索栏让你搜索[扩展市场](https://marketplace.visualstudio.com/)。在搜索框中输入“vue”，你会看到许多插件，每个都声称不同的功能。\n\
    \n根据你的用例，可能会找到适合你的。例如，如果你正在处理涉及 TypeScript 项目，[TSLint for Vue](https://marketplace.visualstudio.com/proagra.tslint-vue)\
    \ 可能很有用。现在我们将关注一个名为 [Vetur](https://marketplace.visualstudio.com/octref.vetur)\
    \ 的插件。\n\n在搜索框中输入“Vetur”，选择由 Pine Wu 开发的包。然后点击“安装”。\n\n![在 VS Code 中安装 Vetur](img/1.jpg)\n\
    \n插件安装完成后，点击重新加载即可启用。\n\n## 探索 Vetur 功能\n\n如果你访问[项目的主页](https://vuejs.github.io/vetur/)，你会看到该插件提供了许多功能：\n\
    \n* 语法高亮\n* 代码片段\n* Emmet\n* 代码检查/错误检查\n* 格式化\n* 自动补全\n* 调试\n\n让我们现在来看看这些功能的操作。\n\
    \n#### 首先设置你的项目\n\n注意，许多功能只有在你设置了项目后才能起作用。这意味着你需要创建一个包含 Vue 文件的文件夹，使用 `VS Code`\
    \ 打开文件夹，并通过 `VS Code` 的资源管理器访问文件。\n\n#### 语法高亮\n\n随着应用程序的增长，你无疑会想要使用[单文件组件](https://vuejs.org/v2/guide/single-file-components.html)\
    \ (SFCs) 来组织代码。这些组件以 `.vue` 结尾，并包含模板部分、脚本部分和样式部分。没有 Vetur，SFC 在 `VS Code` 中看起来是：\n\
    \n![没有语法高亮的 SFC](img/2.png) \n\n然而，安装 Vetur 后它看起来像这样：\n\n![没有语法高亮的 SFC](img/3.png)\
    \ \n\n#### 代码片段\n\nVetur 提供了各种代码片段，即可以扩展为较大代码块的短代码。这可以帮助你更快地编写代码。例如，你可以输入 `v-template`\
    \ 并按 `Tab` 键生成一个基础的 SFC 结构：\n\n```html\n<template>\n  \n</template>\n\n<script>\n\
    export default {\n\n}\n</script>\n\n<style scoped>\n  \n</style>\n```\n\n"
- fmt: "\nAs you can read on the [VS Code website](https://code.visualstudio.com/docs/editor/userdefinedsnippets),\
    \ snippets are templates that make it easier to enter repeating code patterns,\
    \ such as loops or conditional-statements. Vetur makes it possible for you to\
    \ use these snippets in single-file components.\n\nIt also comes with some snippets\
    \ of its own. For example, try typing “scaffold” (without the quotes) into an\
    \ area outside a language region and it will generate all the code you need to\
    \ get going with an SFC:\n\n```\n<template>\n\n</template>\n\n<script>\nexport\
    \ default {\n\n}\n</script>\n\n<style>\n\n</style>\n```\n\n## Emmet\n\n[Emmet](https://www.emmet.io/)\
    \ takes the idea of snippets to a whole new level. If you’ve never heard of this\
    \ and spend any amount of time in a text editor, I’d recommend you head over to\
    \ the Emmet website and spend some time acquainting yourself with it. It has the\
    \ potential to boost your productivity greatly.\n\nIn a nutshell, Emmet allows\
    \ you to expand various abbreviations into chunks of HTML or CSS. Vetur ships\
    \ with this turned on by default.\n\nTry clicking into a `<template>` region and\
    \ entering the following:\n\n```\ndiv#header>h1.logo>a{site Name}\n```\n\nThen\
    \ press `Tab`. It should be expanded to this:\n\n```\n<div id=\"header\">\n  <h1\
    \ class=\"logo\"><a href=\"\">sitename</a></h1>\n</div\n```\n\n## Error Checking/Linting\n\
    \nOut of the box, Vetur offers some basic error checking. This can be handy for\
    \ spotting typos in your code.\n\n![Linting with Vetur](Images/vs-code-4.png)\
    \ \n\nIn the above example, Vetur has noticed that I’ve forgotten the colon following\
    \ the object property name and has consequently underlined it in red. Opening\
    \ up the error panel (click on the small cross in the bottom left-hand corner)\
    \ gives you a description of the error.\n\nVetur also uses [eslint-plugin-vue](https://github.com/vuejs/eslint-plugin-vue)\
    \ to lint templates. We’ll find out more about why linting your code is a good\
    \ idea in the next section, but for now, let’s just see it in action.\n\nLet’s\
    \ add an `items` key to our `data` property:\n\n```\nexport default {\n  data\
    \ () {\n    return {\n      message: \"Vetur is awesome!\",\n      items: [\n\
    \        { message: 'Foo' },\n        { message: 'Bar' }\n      ]\n    }\n  }\n\
    }\n```\n\nThen add some code to output it in our template:\n\n```\n<template>\n\
    \  <div>\n    <h1>Hello, World!</h1>\n    <p>{{ message }}</p>\n\n    <ul>\n \
    \     <li v-for=\"item in items\">\n        {{ item.message }}\n      </li>\n\
    \    </ul>\n  </div>\n</template>\n```\n\nStraight away we’ll see that `&lt;li\
    \ v-for=\"quot;item in items&quot;&gt;` is underlined in red. What gives?\n\n\
    Well, you can hover over the offending code, or open the error console to see\
    \ what’s bothering Vetur.\n\n![A coding error highlighted in VS Code](Images/vs-code-6.png)\
    \ \n\nThe error appears to be that we’ve [forgotten to declare a key](https://vuejs.org/v2/style-guide/#Keyed-v-for-essential).\
    \ Let’s remedy that:\n\n```\n<li v-for=\"(item, i) in items\" :key=\"i\">\n  {{\
    \ item.message }}\n</li>\n```\n\nAnd the error vanishes from our editor.\n\n##\
    \ IntelliSense\n\n[IntelliSense](https://code.visualstudio.com/docs/editor/intellisense)\
    \ is one of my favorite features in VS Code, but it’s limited to a few formats\
    \ that the editor can understand. Installing Vetur makes IntelliSense available\
    \ in your `.vue` file, which is mighty handy.\n\nYou can try this out by clicking\
    \ into the `<template>` region of a Vue component and typing “v-” on any tag (minus\
    \ the quotes). You should see this:\n\n![IntelliSense with Vetur](Images/vs-code-5.png)\
    \ \n\nThis allows you to select from any of the listed directives, and also provides\
    \ you with an explanation of what each does.\n\nThat’s not all that Vetur can\
    \ do, but we’ll leave the extension there and turn our attention to setting up\
    \ a project with Vue’s CLI.\n\n## An Example Project with Vue CLI\n\nWhen building\
    \ a new Vue app, the best way to get up and running quickly is using [Vue CLI](https://cli.vuejs.org/).\
    \ This is a command-line utility that allows you to choose from a range of build\
    \ tools which it will then install and configure for you. It will also scaffold\
    \ out your project, providing you with a pre-configured starting point that you\
    \ can build on, rather than starting everything from scratch.\n\n### Getting Up\
    \ to Speed with Vue CLI\n\nIf the CLI is new for you, you might like to check\
    \ out our tutorial “A Beginner’s Guide to Vue CLI” in this Vue series.\n\nTo get\
    \ started, you’ll need to have Node installed on your system. You can do this\
    \ by downloading the binaries for your system from the [official website](https://nodejs.org),\
    \ or using a [version manager](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/).\
    \ I recommend the second of the two methods.\n\nWith Node installed, execute the\
    \ following command:\n\n```\nnpm install -g @vue/cli\n```\n\nAnd create a new\
    \ Vue project with the command:\n\n```\nvue create my-project\n```\n\nThis will\
    \ open a wizard which asks you to choose a preset. Choose to manually select features,\
    \ then accept the defaults for everything, apart from when you’re asked to pick\
    \ a linter/formatter config. In this step, be sure to select `ESLint + Prettier`\
    \ and `Lint on save`, and to place config files in `package.json`.\n\n### Linting\
    \ Your Code with ESLint\n\nIf you open this newly created project and take a peek\
    \ inside the `package.json` file, you’ll notice that the CLI has set up [ESLint](https://eslint.org/)\
    \ for you. This is a tool that can automatically check your code for potential\
    \ problems. This provides many benefits, such as:\n\n*   keeping your code style\
    \ consistent\n*   spotting potential errors and bad patterns\n*   enforcing quality\
    \ when you follow a [style guide](https://www.sitepoint.com/why-use-javascript-style-guide/)\n\
    *   saving time for all of the above reasons\n\n#### Learning ESLint\n\nIf you’d\
    \ like to dive deeper into ESLint, check out our article “[Up and Running with\
    \ ESLint — the Pluggable Linter](https://www.sitepoint.com/up-and-running-with-eslint-the-pluggable-linter/)”.\n\
    \nIf you look at the `devDependencies` property in `package.json`, you’ll see\
    \ that the CLI is also using [eslint-plugin-vue](https://github.com/vuejs/eslint-plugin-vue).\
    \ This is the official ESLint plugin for Vue, which is able to detect code problems\
    \ in your `.vue` files.\n\nLet’s put that to the test.\n\nStart the Vue server\
    \ with `npm run serve` and navigate to [localhost:8080](http://localhost:8080).\n\
    \nIn, add, add to our/ instance:.vue\nexport default {\n  name: '\n',\n  props:\
    \ {\n    msg: String\n  },\n  \n: {\n    sayHi() {\n      console.log(\":\n\n\
    \    }\n  }\n}\n```\n\nNow, if you look at the terminal window in which the dev\
    \ server is running, you’ll see Vue complaining.\n\n![Linting error in the dev\
    \ server console](Images/vs-code-7.png) \n\nThis is because, under the hood, Vue\
    \ CLI has configured ESLint to use the `eslint:recommended` ruleset. This enables\
    \ any rules marked with a check mark on the [ESLint rules page](https://eslint.org/docs/rules/),\
    \ of which `no-console](https://eslint.org/docs/rules/no-console) is one.\n\n\
    While it’s nice that the CLI shows us ESLint errors in the terminal, wouldn’t\
    \ it’d nicer if we could see them in our editor, too? Well, luckily we can. Hop\
    \ back into VS code, click the extensions icon and type in “ESLint” (without the\
    \ quotes). The top result should be for a [package named ESLint by Dirk Baeumer](https://marketplace.visualstudio.com/items?itemName=dbaeumer.vscode-eslint).\
    \ Install that and restart VS Code.\n\nFinally, you’ll need to edit your VS Code\
    \ preferences. Go to *File* > *Preferences* > *Settings* and edit the *User Settings\
    \ file* and add the following configuration:\n\n```\n\"eslint.validate\": [\n\
    \  \"vue\"\n]\n```\n\nThis will tell the ESLint plugin we just installed to perform\
    \ validation for `.vue` files.\n"
