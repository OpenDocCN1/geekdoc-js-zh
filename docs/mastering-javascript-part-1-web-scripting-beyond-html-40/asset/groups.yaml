    # Event Handlers & More Complex Form Elements


    Like buttons, radio buttons, and check boxes, other form elements also have event
    handlers. In this section, you will learn about the event handlers supported by
    text fields, text areas, and selection lists.


    Forms themselves also have event handlers. You can place onSubmit and on event
    handlers in the <FORM> tag. They will trigger when the form is submitted (uploaded)
    to a server with a SUBMIT button or cleared with a RESET button.


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_132_0.png)


    # Attaching Event Handlers to Fields and Text Areas


    Text fields support three event handlers:


    +   - onChange: Trips when a user changes the text in a text field or text area.
    Under some operating systems (notably, all versions of Microsoft Windows) the
    user must take focus away from the text handler before change is recognized and
    the event handler trips.

    - onFocus: Trips when a user gives focus to the text field or text area.

    - onBlur: Trips when the text field or text area loses focus.'
