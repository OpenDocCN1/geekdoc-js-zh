    # Lesson Summary


    +   - JavaScript variables are named containers that hold numeric, string, or
    Boolean values.


    +   - Declaring a variable involves only giving it a name. Using the notation
    var helps identify the variables in your script.


    +   - To initialize a variable, simply assign a value to it, using the equal (=)
    sign.


    +   - JavaScript understands data in the form of numbers, strings and Boolean
    values. A JavaScript variable may be any of these types of data. This concept
    is known as dynamic typing (also called flexible typing).


    +   - String concatenation allows you to form one large string from multiple small
    strings, using the plus (+) sign.


    +   - The typeof() operator contains a variable name inside the parentheses. When
    invoked in a program, JavaScript can identify the type of data that variable is
    holding.'
