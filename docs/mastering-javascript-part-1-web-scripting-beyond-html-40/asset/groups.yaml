    相比之下，JavaScript 与 Java 而言相对较弱。JavaScript 的目的是为 HTML 文档添加交互性和自动化，而不是创建在客户端计算机上运行的健壮独立程序（例如
    Java）。例如，你可以使用 Java 编写图形编辑应用程序、文字处理器或电子表格程序。JavaScript 并不具备创建此类复杂软件应用的功能。


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_18_0.png)


    为什么 JavaScript 和 Java 的名字相似？简单的答案是“营销策略”。


    最初，今天被称为 JavaScript 的语言被称为 "LiveScript"。它由 Netscape Communications 公司开发，作为其 LiveWire
    服务器软件的脚本语言。随后，Sun Microsystems 的 Java 赢了极大的普及和媒体关注。为了跟上 Java 的成功，Netscape 将 LiveScript
    重命名为 JavaScript。


    这两种语言之间有一些细微的相似之处——某些命令是相同的——但本质上，两者之间的唯一联系是它们都用于增强 Web 页面，并且它们共享“Java”这一术语。


    ## JavaScript 的优势


    JavaScript 提供了一些 Java 不具备的工具和优势：


    - 虽然 Java 可以用于编写 Applet（嵌入在 Web 页面矩形空间内的程序），但它不能用于控制浏览器窗口本身的外观；JavaScript 可以。

    - Java 无法附加到 HTML 表单元素上；JavaScript 可以。

    - Java 是一门复杂的编程语言，需要花费更多的时间、精力和勤奋来掌握 JavaScript（JavaScript 并不是一种编程语言，而是一种精细的脚本语言）。


    总的来说，Java 和 JavaScript 都是强大的——但截然不同的——Web 发布工具。JavaScript 和 Java 的使用并不是一个“非此即彼”的问题。这两种语言都可以在（而且通常都会）在单个
    Web 网站或 Web 页面中实现。因此，Java 和 JavaScript 在许多方面互为补充。


    ## 在 HTML 中嵌入 JavaScript


    对于本课程而言，JavaScript 程序始终作为 HTML 文档的子集，嵌入在 HTML 文档的脚本中。正如使用 `<IMG>` 标签将图像嵌入 HTML
    文档一样，JavaScript 程序是通过 `<SCRIPT>` 标签嵌入的。


    ## <SCRIPT> 标签


    JavaScript 代码（称为程序、脚本或指令）出现在两个特定的 HTML 标签——`<SCRIPT>` 和 `</SCRIPT>` 之间。起始标签——`<SCRIPT>`
    需要一个强制性属性 `LANGUAGE`。`LANGUAGE` 属性标识后续程序的语言。对于本课程以及你对 JavaScript 的使用，该值始终为 `LANGUAGE=JavaScript`。


    > 所有支持 JavaScript 的网络浏览器内置的 JavaScript 解释器都是大小敏感的；因此，大小写非常重要。你必须将 `LANGUAGE` 设置为
    `JavaScript`，而不是 `JAVASCRIPT`、`javascript` 或 `JavaScript`。


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_19_0.png)


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_19_1.png)


    ## document.write()


    `document.write()` 语句将括号内的引号内容——一组字符字符串写入 HTML 文档。当 JavaScript 代码执行完毕时，浏览器会显示该字符串。有效来说，`document.write()`
    让内容在 HTML 页面中出现。


    图 1-2 显示了 `document.write()` 语句的示例。


    | 语句 | 字符串 |

    | :--- | :--- |

    | `document.write("JavaScript was here!")` | "JavaScript was here!" |


    图 1-2：JavaScript 语句的结构


    ## 练习 1-1：插入 JavaScript 标签


    - 1. 启动你的文本编辑器（推荐使用 记事本）。

    - 2. 在你的文本编辑器中输入以下脚本。


    ```

    <HTML>

    <HEAD>

    <TITLE>Practice JavaScript HTML Document</TITLE>

    </HEAD>

    <BODY>

    <H1>以下是 JavaScript 代码的结果：</H1>

    <SCRIPT LANGUAGE="JavaScript">

    document.write("Hello World!")

    </SCRIPT>

    </BODY>

    ```


    - 3. 将文件保存为 JAVASCRIPT.HTML（你可以将文件保存在计算机的任何地方；但请记住你保存在哪里，以便在下一步打开它）。

    - 4. 启动你的 浏览器并打开 JAVASCRIPT.HTML 文件。你的浏览器内容区域应该与图 1-3 相似。


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_20_0.png)


    图 1-3：JavaScript 程序的运行


    `<SCRIPT LANGUAGE=JavaScript>` 和 `</SCRIPT>` 标签围绕着单行的 JavaScript 程序，该程序将“Hello
    World!”文本写入 HTML 文档。


    此程序说明了一个重要的 JavaScript 概念。注意，实际写入浏览器屏幕的行显示如下：


    ```

    document.write("Hello World!")

    ```


    图 1-4 展示了上一个练习中使用的完整 JavaScript 程序的结构。


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_21_0.png)


    `document.write()` 语句在 JavaScript 程序中频繁出现。这些语句的作用是将括号内的任何内容写入 HTML 文档。你甚至可以使用
    `document.write()` 写入 HTML 标签，它们将由任何支持 JavaScript 的浏览器正确解释。


    ## 从旧版浏览器中隐藏脚本代码


    **并非所有浏览器都能解释 JavaScript。** 不包含 JavaScript 解释器的浏览器将无法识别 JavaScript 代码。这导致 JavaScript
    代码像纯文本一样被写入 HTML 文档，产生不符合逻辑且难看的文本显示，本质上破坏了 Web 页面。


    由于这种风险，你有一种技巧，可以向不支持 JavaScript 的浏览器（通常是旧版本的 Netscape Navigator 和 Internet Explorer）隐藏
    JavaScript 代码。你将在接下来的动手练习中使用这种技术。


    ## 练习 1-2：隐藏代码


    - 1. 在下方 JAVASCRIPT.HTML 中你在上一个练习输入的脚本下方输入以下脚本：


    ```

    <H1>Browsers that can''t understand JavaScript won''t display what''s next.</H1>

    <SCRIPT LANGUAGE="JavaScript">

    <!-- Start hiding from old browsers -->

    document.write("What''s next.")

    // Stop hiding from old browsers. -->

    </SCRIPT>

    <H1>But all browsers will display this.</H1>

    ```


    - 2. 保存文件。切换应用到你的 浏览器（`<ALT + TAB>`）并在 Navigator 中重新加载文件（`<CTRL + R>`），在 Internet
    Explorer 中按 `<F5>`。你的浏览器看起来应该与图 1-5 相似。


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_23_0.png)


    图 1-5：非 JavaScript 环境无法显示“What''s next”文本


    这里的技巧取决于 HTML 注释，这是你在 DDC Publishing 的 HTML 4.0 Fundamentals 课程中学过的。回想一下，浏览器将：


    - 忽略 `<!--` 和 `-->` 之间的任何文本或代码

    - 不解释或处理它不识别的标签。


    因此，如果你在 `<SCRIPT>` 标签后直接放置 `<!--`，你可以指令不识别 `<SCRIPT>` 标签的浏览器开始忽略文本。


    然后，为了结束 JavaScript 程序，你插入 `-->` 标签。这指令不支持 JavaScript 的浏览器重新解释你的 HTML 脚本。


    但如果 JavaScript 尝试解释 `-->` 呢？这种情况会导致错误，因为包含 `-->` 的行以 `//` 开头。这指示浏览器忽略行的其余部分。


    ## 使用注释


    良好的程序员会在程序中描述发生的情况，以便其他程序员——以及他们自己——能够更容易编辑或故障故障（调试）。JavaScript 允许你从 JavaScript
    解释器的眼中隐藏英文注释。


    注意，隐藏注释有两种方法：


    - 适合单行的注释

    - 跨多行的注释


    ### 练习 1-3：插入单行注释


    你在上一个练习中首先看到了 `//` 序列，当时它用于帮助向不支持 JavaScript 的浏览器隐藏 JavaScript 程序。在下面的练习中，你将看到单行注释如何用于其他用途。


    - 1. 在你的 HTML 文档在上一个练习输入的脚本下方输入以下脚本：


    ```

    ```

    <H1>There''s a one-line comment in the following program.</H1>

    <SCRIPT LANGUAGE="JavaScript">

    <!-- Start hiding from old browsers.

    //The following line writes text into the HTML document.

    document.write("Single-line comments are joy.")

    // Stop hiding from old browsers. -->

    </SCRIPT>

    ```

    ```

    '
