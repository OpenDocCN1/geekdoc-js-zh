    \ 语句\n\n想象你是一场棒球比赛的观众。天气很炎热，你口渴了。你环顾四周，发现你喜欢的饮料售卖就在附近。如果他在，你会向他示意你想购买。如果售卖员不在附近，你只能忍受口渴，直到有人经过你的座位。\n\
    \n这是一个 `if` 语句的例子。如果售卖员在附近，你会尝试引起他的注意。否则，你什么都不做。\n\n现在，假设你是一个棒球球员。你正准备上场。当你走向球场时，你评估了场上的情况。如果二垒有跑者（且出局数少于两个，且如果你对当前的投手击球有困难，且如果垒包教练示意你这样做……等等），你将进行短打以帮助跑者进到三垒。否则，你会挥棒并尝试击球获得安打。\n\
    \n这是一个 `if...else` 语句的例子。如果满足短打的条件，你会尝试短打。如果不满足短打的条件，你就会挥棒并尝试击球。\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_71_0.png)\n\
    \n第一个例子也是 `if...else` 语句吗？并不是，因为当售卖员不在附近时你采取的行动完全是“无作为”。只有当在“如果”条件不成立时，你也想采取某种积极行动时，`if`\
    \ 语句才会变成 `if...else` 语句。毕竟，如果满足短打条件，击球者不会只站在那里——他会挥棒。\n\nJavaScript 同时支持 `if`\
    \ 和 `if...else` 语句；在将来编写自己的 JavaScript 程序时，你会发现它们有用。\n\n# 语法\n\nJavaScript 的 `if`\
    \ 和 `if...else` 语句具有逻辑语法。\n\n# if 语句的示例\n\n```\nif (condition)\n{\n    仅在条件为真时执行的代码\n\
    }\n```\n\n在在上一个示例中，大括号之间的代码只有在括号中的条件为真时才会执行。如果条件为假，解释器将跳过大括号的内容，并从大括号后的第一行脚本开始执行。\n\
    \n`if...else` 语句的不同之处在于，它在条件为假时会为解释器指定一个任务。\n\n# if...else 语句的示例\n\n```\nif (condition)\n\
    {\n    仅在条件为真时执行的代码\n}\nelse\n{\n    仅在条件为假时执行的代码\n}\n```\n\n`if...else` 语句的第一部分与\
    \ `if` 语句完全相同——`if` 语句大括号中的代码仅在括号中指定的条件为真时执行。然而，在 `if...else` 语句中，紧随 `else` 行的大括号中的代码会在条件为假（且仅在为假）时执行。\n\
    \n# 练习 5-1：使用 if 语句\n\n1. 在 HTML 文档中，上一个练习输入的脚本下方输入以下脚本：\n\n```\n<H1>此程序显示了 <code>if</code>\
    \ 语句的工作原理。</H1>\n<SCRIPT LANGUAGE=\"JavaScript\">\n<!-- 开始对旧浏览器隐藏内容 -->\nvar Capricious\n\
    Capricious = 5\ndocument.write(\"<P>在我们开始时，变量 Capricious 等于 \" + Capricious +\
    \ \".\")\n\nif (Capricious==5)\n{\n  document.write(\"<P>因为 Capricious 等于 5，这一行被写入\
