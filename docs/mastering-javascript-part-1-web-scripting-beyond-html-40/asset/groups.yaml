    **算术运算符（Arithmetic operator）**

    以下任何符号：*, +, -, /（除法）。


    **数组（Array）**

    存储在单个变量中的项列表。


    **赋值（Assign）**

    给变量赋予值。


    **赋值运算符（Assignment operator）**

    用于赋值的符号，例如 =。


    **错误（Bug）**

    程序中的错误。


    **调用（Call）**

    执行一个函数。


    **不区分大小写（Case-insensitive）**

    不区分大写和小写的属性。


    **区分大小写（Case-sensitive）**

    区分大写和小写字母的属性。


    **子句（Clause）**

    语句或表达式的一部分。


    **命令（Command）**

    给计算机的指令。


    **注释掉（Comment-out）**

    程序中被编译器忽略的文本。


    **比较运算符（Comparison operator）**

    用于比较值的符号，例如 ==, >, <。


    **连接字符串（Concatenate）**

    将两个或多个字符串连接在一起。


    **条件语句（Conditional statement）**

    根据条件执行操作的语句。


    **常量（Constant）**

    在程序执行期间不能更改的值。


    **嵌入（Embed）**

    将代码或内容插入另一个文档或程序中。


    **空字符串/空字符串（Empty string）**

    不包含任何字符的字符串。


    **错误（Error）**

    程序中不正确的语句。


    **事件（Event）**

    系统中发生的可以被处理的操作。


    **调试（Debug）**

    发现并修复程序中的错误。


    **定义（Define）**

    说明某事的意义或目的。


    **定义（Definition）**

    单词或术语的含义。


    **文档对象（Document object）**

    表示文档内容的对象。


    **元素（Element）**

    文档或程序结构的一部分。


    **假（False）**

    表示“非真”的布尔值。


    **焦点（Focus）**

    元素处于准备好接受输入的状态。


    **函数（Function）**

    执行特定任务的代码块。


    **函数调用（Function call）**

    对已定义函数的执行。


    **递增（Increment）**

    增加变量的值，通常为增加 1。


    **初始化（Initialize）**

    为变量设置初始值。


    **迭代（Iteration）**

    重复任务的过程，通常在循环内。


