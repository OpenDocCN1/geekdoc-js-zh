    # Page Updates


    **JavaScript is often used to add date and time features to Web pages.** There
    are many properties programmed in JavaScript specifically for this purpose. This
    Lesson teaches you how to take advantage of some of the most common date and time
    functions offered by JavaScript.


    If you are responsible for maintaining a large Web site, you are probably concerned
    about the currentness of the information on your site. You can use JavaScript
    to tell you when a page was last updated.


