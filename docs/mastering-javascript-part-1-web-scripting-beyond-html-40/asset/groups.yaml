    \ as shown in Figure 8-4.\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_138_0.png)\n\
    \n> Figure 8-4: Selection lists also have event handlers\n\nEmbedded in the <SELECT>\
    \ tags each of these selection lists are three event handlers. When triggered,\
    \ each event handler calls a function that displays information regarding the\
    \ form element that has been given focus, what has been blurred, and what has\
    \ been changed.\n\n# Lesson Summary\n\n- Event handlers are bits of code that\
    \ are attached to graphical elements. The event handler is a \"middle man\"; it\
    \ waits for a certain event and then trips a JavaScript function to react to that\
    \ event.\n- Focus is the term used to describe the state of a form element that\
    \ has been selected (with the <TAB> key or a mouse click), but not necessarily\
    \ clicked.\n- There are three event handlers that can be assigned to buttons:\
    \ onClick, onFocus, and onBlur. onClick trips when the button is clicked; onFocus\
    \ trips when the button is selected; onBlur trips when the button loses focus.\n\
    - Similar to buttons, radio buttons and check boxes support onClick, onFocus,\
    \ and onBlur.\n- Text handlers in a form also support event handlers. OnChange\
    \ trips when the text in a field or area changes and focus is taken away.\n- Selection\
    \ lists and drop-down boxes, like text handlers, share the onFocus and on on handlers.\n\
    \n# # Lesson 9\nWindow Control\n\n# ## Lesson Topics\n\n- Alerts!\n- Opening and\
    \ Closing Windows\n- Frames\n- Lesson Summary\n\n# Alerts!\n\nJavaScript is often\
    \ used to control browser windows. It is a very common form of JavaScript because,\
    \ unlike plain HTML, JavaScript allows you to control aspects of the browser size\
    \ and characteristics you open. Many programmers use JavaScript-generated browser\
    \ windows to add emphasis and a dynamic element to their site. JavaScript allows\
    \ you to manipulate frames in ways HTML simply does not.\n\n# The alert() Tag\n\
    \nAn alert is a quick message sent by a Web browser to the user that informs the\
    \ user that 1) something is wrong or 2) provides information regarding the size\
    \ to the user. You can create your own alerts within a page by using the alert()\
    \ method. The alert() method prints (displays to the user) in the form of an alert\
    \ window whatever you type in the parentheses section of the alert.\n\nAn example\
    \ of such an alert window is shown in Figure 9-1 on the following page. This is\
    \ a relatively simple thing, but an excellent introduction to some of the more\
    \ complicated window controlling power of JavaScript.\n\n# Exercise 9-1: Creating\
    \ an Alert Window\n\n1. Type the following script into an HTML document:\n\n```html\n\
    <HEAD>\n<SCRIPT LANGUAGE=\"JavaScript\">\n<!--Start hiding from old browsers\n\
    function hello() {\n  alert (\"Welcome to my Page!\");\n}\n// Stop hiding from\
    \ old browsers -->\n</SCRIPT>\n<BODY onload=\"hello\">\n<h1>Glad to see you</h1>\n\
    </body>\n</html>\n```\n"
  mdcn: "\n\n# 事件处理程序与更复杂的表单元素\n\n类似于按钮、单选按钮和复选框，其他表单元素也具有事件处理器。在本节中，你将学习文本字段、文本区域和选择列表支持的事件处理器。\n\
    \n表单本身也具有事件处理器。你可以在 `<FORM>` 标签中放置 `onSubmit` 和 `on` 事件处理器。当表单通过 SUBMIT 按钮提交（上传）到服务器，或通过\
    \ RESET 按钮被清空时，这些处理器将会在触发。\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_132_0.png)\n\
    \n# 为字段和文本区域附加事件处理器\n\n文本字段支持三个事件处理器：\n\n- onChange: 当用户更改文本字段或文本区域中的文本时触发。在某些操作系统（特别是微软\
    \ Windows 的所有版本）中，用户必须移开文本处理器的焦点，才能识别更改并触发事件处理器。\n- onFocus: 当用户赋予文本字段或文本区域焦点时触发。\n\
    - onBlur: 当文本字段或文本区域失去焦点时触发。\n\n# 练习 8-3：文本中的事件处理器\n\n1. 在你的文本编辑器中打开新文档。\n\n2.\
    \ 在新的 HTML 文档中输入以下脚本：\n\n```html\n<HTML>\n<TITLE>Attaching Event Handlers to Text\
    \ Fields & Text Areas</TITLE>\n<SCRIPT LANGUAGE=\"JavaScript\">\n<!-- Start hiding\
