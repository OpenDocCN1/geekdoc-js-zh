- md: '

    JavaScript, on the other hand, is relatively weak compared to Java. The purpose
    of JavaScript is to add interactivity and automation to HTML documents, not to
    create robust, stand-alone programs that execute on a client computer (such as
    Java). You could, for example, use Java to write a graphics-editing application,
    word processor, or spreadsheet program. JavaScript does not possess the functionality
    to create such complex software applications.


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_18_0.png)


    Why JavaScript and Java have similar names? The simple answer is "marketing."


    Originally, what today is called JavaScript was "LiveScript." It was developed
    by Netscape Communications Corporation as a scripting language for its LiveWire
    server software. Then, Sun Microsystems Java gained tremendous popularity and
    media attention. To piggyback on the success of Java, Netscape renamed LiveScript
    to JavaScript.


    The languages share some minor similarities—certain commands are the same—but
    essentially, the only connection between the two is that they are both used to
    enhance Web pages and they share the term "Java."


    ## JavaScript Strengths


    JavaScript offers some tools and advantages that Java does not:


    - While Java can be used to write applets (programs that are embedded in rectangular
    spaces within Web pages), it cannot be used to control the appearance of a browser
    window itself; JavaScript can.

    - Java cannot be attached to HTML form elements; JavaScript can.

    - Java is a complex programming language that takes much more time, effort, and
    diligence to master JavaScript (which is not a programming language, but instead
    a sophisticated scripting language).


    Overall, both Java and JavaScript are powerful—but very different—Web publishing
    tools. The use of JavaScript and Java is not an either/or issue. Both languages
    can be (and often are) implemented in a single Web site or Web page. Thus, Java
    and JavaScript complement each other in many ways.


    ## Embedding JavaScript in HTML


    For the purposes of this course, a JavaScript program always exists as a subset
    of an HTML document, embedded within the script of the HTML document. Just as
    images are embedded in HTML documents with the <IMG> tag, JavaScript programs
    are embedded using the <SCRIPT> tag.


    ## <SCRIPT> Tag


    JavaScript code (also called a program, script, or instructions) appears between
    two specific HTML tags—<SCRIPT> and </SCRIPT>. The opening tag—<SCRIPT>requires
    a mandatory attribute, LANGUAGE. The LANGUAGE attribute identifies the language
    of the program that follows. For the purposes of this course and your use of JavaScript,
    the value is always LANGUAGE=JavaScript.


    > The JavaScript interpreters built into all JavaScript-aware Web browsers are
    case sensitive; thus, capitalization is significant. You must set LANGUAGE equal
    to JavaScript, not JAVASCRIPT, javascript, or JavaScript.


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_19_0.png)


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_19_1.png)


    ## document.write()


    The document.write() statement takes what is contained in quotation marks within
    the parentheses—a collection of characters called a string—and writes it into
    the HTML document. The browser displays the string when the JavaScript code finishes
    executing. Effectively, document.write() makes something appear within an HTML
    page.


    An example of a document.write() statement is shown in Figure 1-2.


    | Statement | String |

    | :--- | :--- |

    | document.write("JavaScript was here!") | "JavaScript was here!" |


    Figure 1-2: Anatomy of a JavaScript statement


    ## Exercise 1-1: Inserting JavaScript Tags


    - 1. Launch your text editor (Microsoft Notepad recommended).

    - 2. Type the following script into your text editor.


    ```

    <HTML>

    <HEAD>

    <TITLE>Practice JavaScript HTML Document</TITLE>

    </HEAD>

    <BODY>

    <H1>The following is the result of JavaScript code:</H1>

    <SCRIPT LANGUAGE="JavaScript">

    document.write("Hello World!")

    </SCRIPT>

    </BODY>

    ```


    - 3. Save the file as JAVASCRIPT.HTML (you may save the file anywhere on your
    computer; however, remember where you saved it so you can open it in the next
    step).

    - 4. Launch your Web browser and open the file JAVASCRIPT.HTML. Your browser content
    area should appear similar to Figure 1-3.


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_20_0.png)


    Figure 1-3: The result of a JavaScript program


    The <SCRIPT LANGUAGE=JavaScript> and </SCRIPT> tags surround a one-line JavaScript
    program that writes the text “Hello World!” into the HTML document.


    This program illustrates an important JavaScript concept. Note that the line that
    actually writes to the browser screen appears as follows:


    ```

    document.write("Hello World!")

    ```


    Figure 1-4 illustrates the anatomy of the complete JavaScript program used in
    the previous exercise.


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_21_0.png)


    document.write() statements appear frequently in JavaScript programs. These statements
    function to write whatever is contained in the parentheses into the HTML document.
    You can even write HTML tags with document.write() and they will be interpreted
    properly by any JavaScript-aware browser.


    ## HidingScriptCode from Older Browsers


    **Not all browsers can interpret JavaScript.** Browsers that do not contain a
    JavaScript interpreter will not recognize JavaScript code. This results in writing
    JavaScript code into an HTML document as if it was plain text, creating an illogical
    and unsightly display of text and essentially destroying a Web page.


    Because of this risk, a trick available to you to conceal JavaScript code from
    browsers that are not JavaScript-aware (typically older versions of Netscape Navigator
    and Internet Explorer). You will utilize this technique in the following hands-on
    exercise.


    ## Exercise 1-2: Hiding Code


    - 1. Type the following script into JAVASCRIPT.HTML below the script you entered
    in the previous exercise:


    ```

    <H1>Browsers that can''t understand JavaScript won''t display what''s next.</H1>

    <SCRIPT LANGUAGE="JavaScript">

    <!-- Start hiding from old browsers -->

    document.write("What''s next.")

    // Stop hiding from old browsers. -->

    </SCRIPT>

    <H1>But all browsers will display this.</H1>

    ```


    - 2. Save the file. Switch applications to your Web browser (<ALT + TAB>) and
    reload the file (<CTRL + R>) in Navigator and <F5> in Internet Explorer. Your
    browser should appear similar to Figure 1-5.


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_23_0.png)


    Figure 1-5: Non-JavaScript cannot display the "What''s next" text


    The trick here relies upon HTML comments, about which you learned in DDC Publishing''s
    HTML 4.0 Fundamentals course. Recall that a Web browser will


    - ignore any text or code between <!-- -- and -->

    - not interpret or act upon tags it does not recognize.


    Thus, if you position a <-- -- directly following the <SCRIPT> tag, you can instruct
    a browser that does not recognize the <SCRIPT> tag to begin ignoring text.


    Then, to terminate the JavaScript program, you insert a -- > tag. This instructs
    browsers that are not JavaScript-aware begin interpreting your HTML script again.


    But what if JavaScript tries to interpret -- >? This scenario would cause an error
    because the line containing -- > begins with // . This instructs the browser to
    ignore the rest of the line.


    ## Using Comments


    Good programmers describe what is happening in their programs so that other programmers—and
    they themselves—can more easily edit or troubleshoot (debug) a program. JavaScript
    allows you to hide plain-English comments from the critical eye of the JavaScript
    interpreter.


    Note that there are two methods of hiding comments:


    - comments that fit on one line

    - comments that span multiple lines


    ### Exercise 1-3: Inserting a Single-line Comment


    You first saw the // sequence in the previous exercise, when it was used to help
    hide JavaScript programs from browsers that lack JavaScript capabilities. In the
    following exercise, you will see how a single-line comment can be used for other
    purposes.


    - 1. Type the following script into your HTML document below the script you entered
    in the previous exercise:


    ```

    ```

    <H1>There''s a one-line comment in the following program.</H1>

    <SCRIPT LANGUAGE="JavaScript">

    <!-- Start hiding from old browsers.

    //The following line writes text into the HTML document.

    document.write("Single-line comments are joy.")

    // Stop hiding from old browsers. -->

    </SCRIPT>

    ```

    ```

