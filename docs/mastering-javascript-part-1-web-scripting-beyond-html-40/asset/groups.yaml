    \ 不等于 17，这一行没有被写入。\")\n}\n\n// 结束对旧浏览器隐藏内容 --\n</SCRIPT>\n```\n\n重新保存文件。切换到 Web\
    \ 浏览器并加载文件。你的浏览器屏幕应该类似于图 5-1。\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_74_0.png)\n\
    \n图 5-1：if 语句的结果\n\n变量 `Capricious` 控制着此程序的运行。因为 `Capricious` 等于 5，接下来的行被解释，第一个\
    \ `if` 语句的结果为真。因此，文本被写入 HTML 文档：\n\n```\ndocument.write(\"<P>因为 Capricious 等于\
    \ 5，这一行被写入 HTML 文档中。\")\n```\n\n然后是第二个 `if` 语句——它的代码仅在 `Capricious` 等于 17 时才会执行。由于\
    \ `Capricious` 不等于 17，下面的代码**没有被执行**：\n\n```\ndocument.write(\"<P>同样，因为 Capricious\
    \ 不等于 17，这一行没有被写入。\")\n```\n\n# 练习 5-2：使用 if...else 语句\n\n1. 在 HTML 文档中，上一个练习输入的脚本下方输入以下脚本：\n\
    \n```\n<h1>此程序显示了 <code>if...else</code> 语句的工作原理。</h1>\n<SCRIPT LANGUAGE=\"JavaScript\"\
    >\n<!-- 开始对旧浏览器隐藏内容 -->\nvar Capricious\nCapricious = 5\ndocument.write(\"<P>现在，让我们转向\
    \ <code>if...else</code> 控制结构。\")\n\nif (Capricious==2)\n{\ndocument.write(\"\
    <P>...这一行仅在 Capricious 等于 2 时才被写入。\")\n}\nelse\n{\ndocument.write(\"<P>这一行由于语句的\
    \ <code>else</code> 部分而被触发。\")\n}\n\n// 结束对旧浏览器隐藏内容。 -->\n</SCRIPT>\n```\n\n2.\
    \ 重新保存文件。切换到 Web 浏览器并加载文件。你的浏览器屏幕应该类似于图 5-2。\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_76_0.png)\n\
    \n图 5-2：程序中的文本是 if 和 if...else 语句的结果\n\n最后，有一个 `if...else` 语句。如果 `Capricious`\
    \ 等于 2，接下来的行将会运行：\n\n```\ndocument.write(\"<P>这一行仅在 Capricious 等于 2 时才被写入。\")\n\
    ```\n\n但 `Capricious` 不等于 2，它等于 5。因此，`if...else` 语句中 `else` 部分之后的代码被执行：\n\n```\n\
    document.write(\"<P>这一行由于语句的 <CODE>else</CODE> 部分而被触发。\")\n```\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_76_1.png)\n\
    \n# For 循环\n\n计算机擅长高效地执行重复操作。手动计算将 1000 个不同值代入函数的结果是低效的，但你可以编写一个 JavaScript 程序，在远短于手算计算的时间内完成这项工作。\n\
    \n如果这 1000 个值代表一种可定义的序列，编写这样的程序将特别简单，例如 1 到 1000 之间的数字，或者 5 到 5000 之间能被 2.5 整除的整数。\n\
    \nJavaScript 执行此类任务的机制是 `for` 循环。在本节中，你将学习如何创建 `for` 循环，并了解 `for` 循环如何在真实的 JavaScript\
    \ 程序中使用。\n\n# 语法\n\n在 `for` 循环中，你必须指定几个元素：\n\n- 索引变量；\n循环执行开始时的索引条件；\n- 循环执行结束时的索引条件；\n\
    - 迭代开始时索引变量的变化方式；\n- 迭代期间执行的代码。\n\nJavaScript 声明循环的语法如下：\n\n```\nfor(initial condition\
    \ ; test ; increment)\n{\n在每次迭代期间执行的代码\n}\n```\n\n"
