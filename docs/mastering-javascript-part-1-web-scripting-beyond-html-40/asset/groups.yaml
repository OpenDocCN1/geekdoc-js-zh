    # The Array Method


    There is another way to refer to forms in an HTML document and the elements that
    populate any form(s) within a document. It is called the array method. Although
    it is less intuitive the name method, it is helpful when you need to write a routine
    that refers to the elements in a form automatically.


    A Web browser''s JavaScript interpreter keeps track of the forms in a document
    within a list. The list is called an array. The first form in a document takes
    the first position in the array and is indexed as 0 (arrays start counting from
    0). The second form in a document is entered into the array as number 1, and so
    forth. The array in which the forms in a document is listed forms.


    The same numbering scheme applies to elements within a form. The first element
    is entered into the array (called elements) as number 0, the second as number
    1, and so forth.


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_112_0.png)


    The forms and form elements appear in their arrays in the order they appear in
    the HTML code: top to bottom and left to right, in that order.


