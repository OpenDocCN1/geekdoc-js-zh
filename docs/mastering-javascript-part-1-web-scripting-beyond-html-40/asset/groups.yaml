    # About the Authors


    Allan Liska is a Webmaster and a Certified Microsoft Engineer. He currently holds
    the position of Electronic Commerce and Web Hosting Engineer for UUNET Technologies,
    Inc.


    Mr. Liska graduated from the University of Maryland with a degree in sociology,
    after which he was a programmer and LAN administrator for the University of Maryland
    Survey Research Center. Following this, he worked at Genie Online Services, prior
    to leaving for UUNET. Mr. Liska has also written Mastering JavaScript: Part 2.


    David Wall is a computer and Internet writer. He graduated with honors from the
    University of Virginia and currently resides in Leesburg, Virginia.


    Mr. Wall wrote Using the World Wide Web, 2nd Edition and co-authored The 10 Secrets
    for Web Success with Dr. Bryan Pfäffenfelder. Mr. Wall has also written Netscape
    Plug-In Power, 101 Freeze-Dried Java Applets, JavaScript on Demand, and Building
    an Extranet.


