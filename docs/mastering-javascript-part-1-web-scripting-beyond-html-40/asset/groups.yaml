  - '[PAGE 122]


    # Lesson Summary


    +   - Elements in JavaScript form a hierarchy. You can refer to the elements in
    the hierarchy according to either 1) their names or 2) their array position.


    +   - To use the name method for referring to elements, each element is listed
    in descending order, separated by periods, as in document.formname.elementname.


    +   - The array method for referring to elements is convenient in routines that
    refer to them automatically. Forms and their elements are arranged in the array
    by the order in which they appear in the HTML code (left to right, top to bottom,
    in that order).


    +   - The choices in a group of radio buttons in an HTML form are referred according
    to their array position.


    +   - Selection lists and drop-down list boxes are mere SELECT objects to the
    JavaScript interpreter, and their contents are referred according to array position.'
- md: "\n## Lesson 8\nEvent Handlers\n\n- Event Handlers & Basic Form Elements\n-\
    \ Event Handlers & More Complex Form Elements\n- Lesson Summary\n\nMastering JavaScript:\
    \ Part 1\n\n## Event Handlers & Basic Form Elements\n\nComputer programs that\
    \ operate from a command line (such as DOS) need react only to the text users\
    \ type. Graphical programs are significantly more complex because the user has\
    \ so many action options using both a keyboard and a pointing device (mouse, trackball,\
    \ etc.).\n\nIn a single form, a user might click any of a dozen buttons, select\
    \ something from a selection list, or click any of several radio buttons or check\
    \ boxes. Anticipating and programming for such a multitude of possible events\
    \ is a daunting task.\n\n## Event Handlers\n\nJavaScript makes the task of creating\
    \ graphical programs easier with event handlers. Event handlers are pieces of\
    \ code that you attach to graphical elements—typically form elements. An event\
    \ handler watches for a certain event, such as a mouse click.\n\nWhen the event\
    \ occurs, the event handler “trips” and calls a JavaScript function that performs\
    \ a particular function. You had a glimpse of event handlers in the previous Lesson;\
    \ you will be exposed to them in depth in this Lesson.\n\n## Focus\n\nBefore working\
    \ with events, you need to understand the concept of focus as it applies to graphical\
    \ user interfaces (GUIs). Focus is the state of a form element that has been selected,\
    \ often by a user moving the cursor by pressing the <TAB> key or clicking the\
    \ mouse. Only one screen element may have focus at a given time.\n\n> Only one\
    \ screen element may have focus at a given time.\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_125_0.png)\n\
    \nWindows displays a dotted line (called a marquee) around the element that currently\
    \ has focus. Elements that do not have focus are said to be blurred.\n\nButtons—general\
    \ purpose as well as special purpose—can take three event handlers:\n\n- onClick:\
    \ trips when a user clicks a button.\n- onFocus: trips when a user gives a button\
    \ focus.\n- onBlur: trips when a button loses focus.\n\n112\nDDC Publishing •\
    \ www.ddcpub.com\n\n## Exercise 8-1: Attaching Event Handlers to Form Buttons\n\
    \n1. Open a new document in your text editor.\n\n2. Type the following script\
    \ into the new HTML document:\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Attaching Event\
    \ Handlers to Form Buttons</TITLE>\n<SCRIPT LANGUAGE=\"JavaScript\">\n<!-- Start\
    \ hiding from old browsers -->\nfunction ClickDisplay(ButtonNumber)\n{\n  document.DemoForm.ClickOutput.value=(\"\
    You clicked button number \" + ButtonNumber + \".\")\n}\nfunction FocusDisplay(ButtonNumber)\n\
    {\n  document.DemoForm.FocusOutput.value=(\"You gave focus to button number \"\
    \ + ButtonNumber + \".\")\n}\nfunction BlurDisplay(ButtonNumber)\n{\n  document.DemoForm.BlurOutput.value=(\"\
    You blurred button number \" + ButtonNumber + \".\")\n}\n// // Stop hiding from\
    \ old browsers. -->\n</SCRIPT>\n</HEAD>\n```\n\n## Mastering JavaScript Part 1\n\
    \n```html\n<BODY>\n<H1>This program demonstrates button event handlers.</H1>\n\
    <FORM NAME=\"DemoForm\"><P>\nClick information:<BR>\n<INPUT TYPE=\"TEXT\" NAME=\"\
    ClickOutput\" Value=\"\" SIZE=35><P>\nFocus information:<BR>\n<INPUT TYPE=\"TEXT\"\
    \ NAME=\"FocusOutput\" Value=\"\" SIZE=35><P>\nBlur information:<BR>\n<INPUT TYPE=\"\
    TEXT\" NAME=\"BlurOutput\" Value=\"\" SIZE=35><P>\n<HR>\n<INPUT TYPE=\"BUTTON\"\
    \ NAME=\"Button1\" Value=\"One\"\n=\"ClickDisplay(1)\" onFocus=\"FocusDisplay(1)\"\
    \ onBlur=\"BlurDisplay(1)\">\n<INPUT TYPE=\"BUTTON\" NAME=\"Button2\" Value=\"\
    Two\"\n=\"ClickDisplay(2)\" onFocus=\"FocusDisplay(2)\" onBlur=\"BlurDisplay(2)\"\
    >\n<INPUT TYPE=\"BUTTON\" NAME=\"Button3\" Value=\"Three\"\n=\"ClickDisplay(3)\"\
    \ onFocus=\"FocusDisplay(3)\" onBlur=\"BlurDisplay(3)\">\n</FORM>\n</BODY>\n</html>\n\
    ```\n\n3. Save the file as EVENTHANDLERS_BUTTONS.HTML. Switch applications to\
    \ your Web browser and open EVENTHANDLERS_BUTTONS.HTML.\n4. Click the **One**\
    \ button and note the change in the form fields.\n5. Click the **Two** button\
    \ and note the change in the form fields.\n6. Click the **Three** button and note\
    \ the change in the fields, as shown in Figure 8-1 on the following page.\n\n\
    ## Lesson 8: Event Handlers\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_128_0.png)\n\
    \nFigure 8-1: Buttons have three event handlers\n\nEvent handlers appear in the\
    \ HTML declarations of each of the buttons. The declaration for Button Two is\
    \ typical:\n\n```html\n<INPUT TYPE=\"BUTTON\" NAME=\"Button2\" Value=\"Two\"\n\
    OnClick=\"ClickDisplay(2)\"\nonFocus=\"FocusDisplay(2)\"\nonBlur=\"BlurDisplay(2)\"\
    >\n```\n\nThe above declaration states: when the onClick event handler is tripped,\
    \ the function ClickDisplay() is called with parameter 2. It also specifies functions\
    \ to call when the onFocus and onBlur event handlers are tripped. To see this\
    \ program function, click various buttons and watch the corresponding results\
    \ in each of the text fields.\n\nA button is given focus when a user clicks it.\n\
    \nLike buttons, radio buttons and check boxes each support three event handlers.\
    \ They are:\n\n- onClick: Trips when a user clicks the check box or radio button.\n\
    - onFocus: Trips when a user gives focus to the check box or radio button.\n-\
    \ onBlur: Trips when a check box or radio button loses focus.\n\n## Exercise 8-2:\
    \ Attaching Event Handlers to Radio Buttons & Check Boxes\n\n1. Open a new document\
    \ in your text editor.\n\n2. Type the following script into the new HTML document:\n\
    \n```html\n<HTML>\n<HEAD>\n<TITLE>Attaching Event Handlers to Radio Buttons &\
    \ Check Boxes</TITLE>\n<SCRIPT LANGUAGE=\"JavaScript\">\n<!-- Start hiding from\
    \ old browsers.\nfunction ClickDisplay(SentValue)\n{\n  document.DemoForm.ClickOutput.value=\"\
    You clicked \" + SentValue + \" \")\";\n}\nfunction FocusDisplay(SentValue)\n\
    {\n  document.DemoForm.FocusOutput.value=\"You gave focus to button \" + SentValue\
    \ + \" \")\";\n}\nfunction BlurDisplay(SentValue)\n{\n  document.DemoForm.BlurOutput.value=\"\
    You blurred button \" + SentValue + \" \")\";\n}\n// Stop hiding from old browsers.\
    \ -->\n</SCRIPT>\n</HEAD>\n```\n\n<BODY>\n<H1>This program demonstrates radio\
