  - "[PAGE 143]\n\n# Alerts!\n\nJavaScript is often used to control browser windows.\
    \ It is a very common form of JavaScript because, unlike plain HTML, JavaScript\
    \ allows you to control aspects of the browser size and characteristics that you\
    \ open. Many programmers use JavaScript-generated browser windows to add emphasis\
    \ and a dynamic element to their site. JavaScript allows you to manipulate frames\
    \ in ways HTML simply does not.\n\n# The alert() Tag\n\nAn alert is a quick message\
    \ sent by a Web browser to the user that informs the user that 1) something is\
    \ wrong or 2) provides information regarding the size to the user. You can create\
    \ your own alerts within a page by using the alert() method. The alert() method\
    \ prints (displays to the user) in the form of an alert window whatever you type\
    \ in the parentheses section of the alert.\n\nAn example of such an alert window\
    \ is shown in Figure 9-1 on the following page. This is a relatively simple thing,\
    \ but an excellent introduction to some of the more complicated window controlling\
    \ power of JavaScript.\n\n# Exercise 9-1: Creating an Alert Window\n\n+   1. Type\
    \ the following script into an HTML document:\n\n```\n<HEAD>\n<SCRIPT LANGUAGE=\"\
    JavaScript\">\n<!--Start hiding from old browsers\nfunction hello() {\n  alert\
    \ (\"Welcome to my Page!\");\n}\n// Stop hiding from old browsers -->\n</SCRIPT>\n\
    <BODY onload=\"hello\">\n<h1>Glad to see you</h1>\n</body>\n</html>\n```\n\n+\
    \   2. Save the file. Switch applications to your Web browser and reload the file.\
    \ Your browser screen should appear similar to Figure 9-1 on the following page."
- md: "\n# Lesson 9: Window Control\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_144_0.png)\n\
    \nFigure 9-1: Example of JavaScript alert\n\nThe event handler `onload` is used\
    \ in the `<body>` tag of this document to display the alert window after the document\
    \ finishes loading. You can also use the event handler `onunload` to execute a\
    \ function as the viewer exits a page.\n\nAs discussed in the first Lesson of\
    \ this class, JavaScript is case sensitive. This is especially important when\
    \ dealing with event handlers. `Onload` (as used in the previous script) and `onload`\
    \ have very different meanings. Both are used as event handlers: `Onload` is used\
    \ to define the handler, `onload` is used to reference the handler. For example,\
    \ examine the code in Figure 9-2.\n\n```javascript\n<SCRIPT LANGUAGE=\"JavaScript\"\
    >\nfunction fn() {\n  // some function\n}\n</SCRIPT>\n\n<BODY onload=\"fn()\"\
    >\n<SCRIPT>\ndocument.onload=fn\n</SCRIPT>\n```\n\nFigure 9-2: Distinguishing\
    \ between onload and onload\n\nThe handler `fn` is positioned within the function\
    \ statement and is defined by the `onload` statement in the `<body>` tag. In other\
    \ words, the function is turned into an action because the `<body>` tag instructs\
    \ the browser to execute it when the page finishes loading. Finally, it is referenced\
    \ within the HTML document using the `onload` command.\n\nAlert boxes are useful\
    \ for sending messages to users, but they are not the visually appealing way of\
    \ communicating with a user. Typically, alerts are used to warn a user of missed\
    \ or important information. An example of this is provided in the next exercise.\n\
    \n# Exercise 9-2: Writing an E-mail Checker\n\n1. Type the following script into\
    \ an HTML document:\n\n```html\n<HTML>\n<HEAD>\n\n<SCRIPT LANGUAGE=\"JavaScript\"\
    >\n<!-- Hiding from old browsers\nfunction emailCheck() {\n  mailcheck=document.eform.email.value;\n\
    \  if (mailcheck.indexOf(\"@\")<3){\n    alert(\"Please make sure you have typed\
    \ your e-mail address correctly. Please check the prefix and '@' sign.\");\n \
    \ }\n  if (mailcheck.indexOf(\".com\")<5 && (mailcheck.indexOf(\".org\")<5\n \
    \ && (mailcheck.indexOf(\".gov\")<5 && (mailcheck.indexOf(\".net\")<5\n  && (mailcheck.indexOf(\"\
    .mil\")<5 && (mailcheck.indexOf(\".edu\")<5\n  && (mailcheck.indexOf(\".us\")<5)){\n\
    \    alert(\"Please make sure you have typed your e-mail address correctly. Please\
    \ check the suffix for accuracy. (It should include a \"\".com, .edu, .net, .org,\
    \ .gov or mil or .us\");\n  }\n\n// Stopping from old browsers -->\n</SCRIPT>\n\
    </HEAD>\n<BODY TEXT=\"000000\">\n<CENTER>\n<P>\n<H3>Please Enter Your E-mail Address\
    \ Below:</H3>\n<BR>\n<FORM NAME=\"eform\"><INPUT TYPE=\"text\" NAME=\"email\"\
    \ SIZE=40 VALUE=\"\"><BR>\n<INPUT TYPE=\"button\" NAME=\"mail\" VALUE=\"Submit\"\
    \ OnClick=\"emailCheck()\"\n</FORM></CENTER>\n</BODY>\n</HTML>\n```\n\n2. Save\
    \ the file as EMAILCHECK.HTML. Double click the file to open it in your browser.\n\
    \n3. Enter in an invalid e-mail address, you should see an alert window pop up,\
    \ similar to Figure 9-3 on the following page.\n\n# Lesson 9: Window Control\n\
    \n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_146_0.png)\n\nFigure 9-3: JavaScript\
    \ e-mail checker\n\nThis script performs two checks on the e-mail address listed\
    \ in the form. The first if statement checks to make sure that the string presented\
    \ contains an \"@\" symbol and is not less than 3 characters up to that point\
    \ (many mail-servers will reject e-mail addresses that are only 1 character in\
    \ length, this script is assuring that standard).\n\nThe second if statement iterates\
    \ through the different TLD (top-level domain) suffixes (that are acceptable for\
    \ this script) and tries to match up with one of them. It also makes sure the\
    \ domain name contains at least five characters: the TLD plus \".\" and the domain\
    \ (which can be as short as 1 character (such as \"a.com\")). Together, the script\
    \ requires at least two prefix, the \"@\" symbol and at least a 5 character suffix.\n\
    \n> One problem with this code is that it is very United States centric. Other\
    \ countries obviously have their own domain name system, and—because the Internet\
    \ is worldwide—this would preclude someone with a domain name ending in .UK or\
    \ .AU, for example, from submitting the form.\n\nThere are two possible ways around\
    \ this:\n\n- create an array with every possible Top Level Domain listed in it\
    \ (this would create bulky code, however)\n- modify the code to search for a suffix\
    \ that is two or three characters in length (this would be less accurate, but\
    \ efficient enough for most applications)\n\n# Opening and Closing Windows\n\n\
    JavaScript includes event handlers for opening and closing windows. Similar to\
    \ the `<TARGET>` tag available in HTML, you can direct links to open in new windows.\
    \ You can also set the parameters of the windows that open (such as size, characteristics,\
    \ title) to give a more customized feel to your site.\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_147_0.png)\n\
    \nThere is a tendency among novice JavaScript programmers to go overboard with\
    \ some of the new tricks they have learned. Just as with all Web page design issues,\
    \ it is always best to ask yourself if you are using JavaScript to perform something\
    \ necessary or to show off your programming skills.\n\nPop-up windows are good,\
    \ but they can also be annoying; and they preclude people with older browsers\
    \ from viewing parts of your site.\n\n# Exercise 9-3: Opening a JavaScript Window\n\
    \n1. Type the following script into an HTML document:\n\n```javascript\n<SCRIPT\
    \ LANGUAGE=\"JavaScript\">\n<!-- Start hiding from old browsers -->\n\nfunction\
    \ PopWin()\n{\n  popup = window.open(\"\", \"popDialog\", \"height=160,width=300,scrollbars=no\"\
    )\n  popup.document.write('<html><BODY BGCOLOR=#FFFFFF TEXT=#000000>');\n  popup.document.write('<BR><BR>');\n\
    \  popup.document.write('<CENTER><H3>Thanks for visiting our page!</H3></CENTER>');\n\
    \  popup.document.write('</body></html>');\n  popup.document.close();\n}\n\n//\
    \ -- Stop hiding from old browsers --\n</SCRIPT>\n</HEAD>\n\n<BODY bgcolor=\"\
    ffffff\" onload=\"PopWin\">\n<CENTER>\n<H3>By the time you see this, the Pop-Up\
    \ Window will have loaded</H3>\n</CENTER>\n</BODY>\n```\n\n2. Save the file as\
    \ POPUP.HTML. Double click the file to open it in your browser. Your screen should\
    \ appear similar to Figure 9-4.\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_148_0.png)\n\
    \nFigure 9-4: Example of JavaScript pop up windows\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_148_1.png)\n\
    \nNote that the code for pop-up windows resides entirely within POPUP.HTML. This\
    \ is convenient if you want to call the pop-up function multiple times, using\
    \ the `onClick` event.\n\nClose is a window event handler. It can only be used\
    \ to open a window that was created by JavaScript. If you try to close a window\
    \ not opened by JavaScript, an alert window will appear asking the user if they\
    \ want to close the window. By default, close refers to the current window; however,\
    \ you can tell it to close other windows. For instance, if you created two pop-up\
    \ windows, WindowA and WindowB, you could close WindowA from WindowB without generating\
    \ a prompt.\n\n# Exercise 9-4: Closing a JavaScript Window\n\n1. Re-open the file\
    \ POPUP.HTML in Notepad. Add the following line:\n\n```javascript\npopup.document.write('<BR><BR><FORM><INPUT\
    \ TYPE=\"BUTTON\" VALUE=\"Close\" onclick=\"self.close()\"></FORM>');\n```\n\n\
    Between these lines:\n\n```javascript\npopup.document.write('<CENTER><H3>Thanks\
    \ for visiting our page!</H3></CENTER>');\npopup.document.write('</body></html\n\
    \n\n\n2. Resave the file. Double click the file to open it in your browser.\n\n\
    # Frames\n\nIn the previous lessons, you learned about frame construction and\
    \ layout. JavaScript allows you to further enhance your framed pages. You can\
    \ use JavaScript to establish properties for the windows within a frame, or to\
    \ call them through an array.\n\nAssume you have a four-windowed frameset. You\
    \ could script code similar to that displayed in Figure 9-6.\n\n```html\n<FRAMESET\
    \ COLS=\"25%,25%,25%,25%\">\n<FRAME SRC=\"frame1.html\" NAME=\"frameone\">\n<FRAME\
    \ SRC=\"frame2.html\" NAME=\"frametwo\">\n<FRAME SRC=\"frame3.html\" NAME=\"framethree\"\
    >\n<FRAME SRC=\"frame4.html\" NAME=\"framefour\">\n</FRAMESET>\n```\n\nFigure\
    \ 9-6: Four-way frameset\n\nWithin JavaScript, you can refer to the windows through\
    \ an array, such as that shown below:\n\n- frameone is top.frames[0]\n- frametwo\
    \ is top.frames[1]\n- framethree is top.frames[2]\n- framefour is top.frames[3]\n\
    \nYou can now refer to the various windows by invoking their name with a `<LOCATION>`\
    \ tag.\n"
  mdcn: "\n\n# 第 9 ：窗口控制\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_144_0.png)\n\n\
    图 9-1：JavaScript alert 示例\n\n事件处理器 `onload` 使用在此文档的 `<body>` 标签中，用于在文档加载完成后显示警报窗口。你也可以使用事件处理器\
    \ `onunload` 在用户离开页面时执行某个函数。\n\n正如在本课程的第一节中讨论的那样，JavaScript 是区分大小写的。这在处理事件处理器时显得尤为重要。`Onload`（如之前的脚本中使用的）和\
    \ `onload` 具有完全不同的含义。它们都被用作事件处理器：`Onload` 用于定义处理器，而 `onload` 用于引用处理器。例如，请查看图 9-2\
    \ 中的代码。\n\n```javascript\n<SCRIPT LANGUAGE=\"JavaScript\">\nfunction fn() {\n\
    \  // some function\n}\n</SCRIPT>\n\n<BODY onload=\"fn()\">\n<SCRIPT>\ndocument.onload=fn\n\
    </SCRIPT>\n```\n\n图 9-2：区分 onload 和 onload\n\n处理器 `fn` 位于函数语句内部，并通过 `<body>` 标签中的\
    \ `onload` 语句定义。换句话说，该函数变成了一个动作，因为 `<body>` 标签指示浏览器在页面加载完成后执行它。最后，它在 HTML 文档中使用\
    \ `onload` 命令进行引用。\n\n警报框（Alert boxes）对于向用户发送消息很有用，但它们并不是与用户通信的视觉观的方式。通常，警报用于提醒用户遗漏或重要的信息。下一个练习中提供了一个示例。\n\
    \n# 练习 9-2：编写一个电子邮件检查器\n\n1.  在 HTML 文档中输入以下脚本：\n\n```html\n<HTML>\n<HEAD>\n\n\
    <SCRIPT LANGUAGE=\"JavaScript\">\n<!-- 对旧版浏览器隐藏 -->\nfunction emailCheck() {\n\
    \  mailcheck=document.eform.email.value;\n  if (mailcheck.indexOf(\"@\")<3){\n\
    \    alert(\"请确保你已正确输入了 e-mail 地址。请检查前缀和 '@' 符号。\");\n  }\n  if (mailcheck.indexOf(\"\
    .com\")<5 && (mailcheck.indexOf(\".org\")<5\n  && (mailcheck.indexOf(\".gov\"\
    )<5 && (mailcheck.indexOf(\".net\")<5\n  && (mailcheck.indexOf(\".mil\")<5 &&\
    \ (mailcheck.indexOf(\".edu\")<5\n  && (mailcheck.indexOf(\".us\")<5)){\n    alert(\"\
    请确保你已正确输入了 e-mail 地址。请检查后缀的准确性。（它应该包含 \"\".com, .edu, .net, .org, .gov 或 mil 或\
    \ .us）\");\n  }\n\n// 从旧版浏览器停止 -->\n</SCRIPT>\n</HEAD>\n<BODY TEXT=\"000000\"\
    >\n<CENTER>\n<P>\n<H3>请在下方输入您的 E-mail 地址：</H3>\n<BR>\n<FORM NAME=\"eform\"><INPUT\
    \ TYPE=\"text\" NAME=\"email\" SIZE=40 VALUE=\"\"><BR>\n<INPUT TYPE=\"button\"\
    \ NAME=\"mail\" VALUE=\"Submit\" OnClick=\"emailCheck()\"\n</FORM></CENTER>\n\
    </BODY>\n</HTML>\n```\n\n2.  将文件保存为 EMAILCHECK.HTML。双击该文件并在浏览器中打开它。\n\n3.  输入一个无效的电子邮件地址，你应该会看到弹警报窗口，类似于下一页的图\
    \ 9-3。\n\n# 第 9 ：窗口控制\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_146_0.png)\n\
    \n图 9-3：JavaScript 电子邮件检查器\n\n此脚本对表单列出的电子邮件地址进行两次检查。第一个 `if` 语句检查显示的字符串是否包含 \"\
    @\" 符号，并且到该点长度不小于 3 个字符（许多邮件服务器会拒绝长度仅为 1 个字符的电子邮件地址，此脚本确保了这种标准）。\n\n第二个 `if` 语句遍历不同的\
    \ TLD（顶级域名）后缀（此脚本可接受的后缀），并尝试与其中之一匹配。它还确保域名至少包含五个字符：TLD 加上 \".\" 和域名（域名可以短到只有 1\
    \ 个字符，例如 \"a.com\"）。合起来，该脚本要求至少包含两个字符的前缀、一个 \"@\" 符号以及至少一个 5 个字符的后缀。\n\n> 这段代码的一个问题是它非常以美国为中心。其他国家显然有自己的域名系统，而且——因为互联网是全球性的——这会导致以\
    \ .UK 或 .AU 结尾的域名的用户无法提交表单。\n\n解决这个问题有两种可能的方法：\n\n-   创建一个列出所有可能的顶级域名的数组（但这会导致代码变得很臃肿）\n\
    -   修改代码以搜索长度为二或三字符的后缀（这准确性较低，但对于大多数应用程序来说已经足够高效）\n\n# 打开和关闭窗口\n\nJavaScript 包含了打开和关闭窗口的事件处理器。与\
    \ HTML 中可用的 `<TARGET>` 标签类似，你可以引导链接在新窗口中打开。你还可以设置打开的窗口的参数（如大小、特性、标题），为你的网站提供更具定制化的感觉。\n\
    \n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_147_0.png)\n\n初级 JavaScript 程序员倾向于在他们学到新技巧上用力过度。就像所有的\
    \ Web 页面设计问题一样，最好的总是问问自己，你是在使用 JavaScript 执行必要的操作，还是为了展示你的编程技巧。\n\n弹出窗口是好的，但它们可能也很烦人；而且它们会让使用旧版浏览器的人无法查看你网站的部分。\n\
    \n# 练习 9-3：打开 JavaScript 窗口\n\n1.  在 HTML 文档中输入以下脚本：\n\n```javascript\n<SCRIPT\
    \ LANGUAGE=\"JavaScript\">\n<!-- 开始从旧版浏览器隐藏 -->\n\nfunction PopWin()\n{\n  popup\
    \ = window.open(\"\", \"popDialog\", \"height=160,width=300,scrollbars=no\")\n\
    \  popup.document.write('<html><BODY BGCOLOR=#FFFFFF TEXT=#000000>');\n  popup.document.write('<BR><BR>');\n\
    \  popup.document.write('<CENTER><H3>感谢访问我们的页面!</H3></CENTER>');\n  popup.document.write('</body></html>');\n\
    \  popup.document.close();\n}\n\n// 从旧版浏览器停止 --\n</SCRIPT>\n</HEAD>\n\n<BODY bgcolor=\"\
    ffffff\" onload=\"PopWin\">\n<CENTER>\n<H3>看到这个时，弹出窗口将加载</H3>\n</CENTER>\n</BODY>\n\
    ```\n\n2.  将文件保存为 POPUP.HTML。双击该文件并在浏览器中打开。你的屏幕应该类似于图 9-4。\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_148_0.png)\n\
    \n图 9-4：JavaScript 弹出窗口\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_148_1.png)\n\
    \n注意弹出窗口的代码完全位于 POPUP.HTML 中。如果你想使用 `onClick` 事件多次调用弹出，这将很方便。\n\nClose 是一个窗口处理器。它可以用于关闭由\
    \ JavaScript 创建的窗口。默认情况下，close 指当前窗口；但是你可以告诉它关闭其他窗口。例如，如果你创建了两个弹出窗口 WindowA 和\
    \ WindowB，你可以从 WindowB 关闭 WindowA 而无需生成提示。\n\n# 练习 9-4：关闭 JavaScript 窗口\n\n1.\
    \  用记事本重新打开 POPUP.HTML 文件。添加以下行：\n\n```javascript\npopup.document.write('<BR><BR><FORM><INPUT\
    \ TYPE=\"BUTTON\" VALUE=\"Close\" onclick=\"self.close()\"></FORM>');\n```\n\n\
    在这些行之间：\n\n```javascript\npopup.document.write('<CENTER><H3>感谢访问我们的页面!</H3></CENTER>');\n\
    popup.document.write('</body></html>');\n```\n\n2.  重新保存文件。双击该文件并在浏览器中打开它。\n\n\
    # 框架\n\n在之前的课程中，你学习了框架的构建和布局。JavaScript 允许你进一步增强框架页面。你可以使用 JavaScript 为框架内的窗口建立属性，或者通过数组调用它们。\n\
    \n假设你有一个四窗口框架集。你可以编写类似于图 9-6 所示的代码。\n\n```html\n<FRAMESET COLS=\"25%,25%,25%,25%\"\
    >\n<FRAME SRC=\"frame1.html\" NAME=\"frameone\">\n<FRAME SRC=\"frame2.html\" NAME=\"\
    frametwo\">\n<FRAME SRC=\"frame3.html\" NAME=\"framethree\">\n<FRAME SRC=\"frame4.html\"\
    \ NAME=\"framefour\">\n</FRAMESET>\n```\n\n图 9-6：四向框架集\n\n在 JavaScript 内部，你可以通过数组引用这些窗口，如下所示：\n\
    \n-   frameone is top.frames[0]\n-   frametwo is top.frames[1]\n-   framethree\
    \ is top.frames[2]\n-   framefour is top.frames[3]\n\n你现在可以通过调用 `<LOCATION>` 标签的名称来引用各种窗口。\n\
    \n"
