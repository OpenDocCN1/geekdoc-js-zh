    # HidingScriptCode from Older Browsers


    **Not all browsers can interpret JavaScript.** Browsers that do not contain a
    JavaScript interpreter will not recognize JavaScript code. This results in writing
    JavaScript code into an HTML document as if it was plain text, creating an illogical
    and unsightly display of text and essentially destroying a Web page.


    Because of this risk, a trick available to you to conceal JavaScript code from
    browsers that are not JavaScript-aware (typically older versions of Netscape Navigator
    and Internet Explorer). You will utilize this technique in the following hands-on
    exercise.


    # Exercise 1-2: Hiding Code


    +   1. Type the following script into JAVASCRIPT.HTML below the script you entered
    in the previous exercise:


    ```

    <H1>Browsers that can''t understand JavaScript won''t display what''s next.</H1>

    <SCRIPT LANGUAGE="JavaScript">

    <!-- Start hiding from old browsers -->

    document.write("What''s next.")

    // Stop hiding from old browsers. -->

    </SCRIPT>

    <H1>But all browsers will display this.</H1>

    ```'
  - '[PAGE 23]


    2. Save the file. Switch applications to your Web browser (<ALT + TAB>) and reload
    the file (<CTRL + R>) in Navigator and <F5> in Internet Explorer. Your browser
    should appear similar to Figure 1-5.


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_23_0.png)


    Figure 1-5: Non-JavaScript cannot display the "What''s next" text


    The trick here relies upon HTML comments, about which you learned in DDC Publishing''s
    HTML 4.0 Fundamentals course. Recall that a Web browser will


    +   - ignore any text or code between <-- -- and -->

    - not interpret or act upon tags it does not recognize.


    Thus, if you position a <-- -- directly following the <SCRIPT> tag, you can instruct
    a browser that does not recognize the <SCRIPT> tag to begin ignoring text.


    Then, to terminate the JavaScript program, you insert a -- > tag. This instructs
    browsers that are not JavaScript-aware begin interpreting your HTML script again.


    But what if JavaScript tries to interpret -- >? This scenario would cause an error
    because the line containing -- > begins with // . This instructs the browser to
    ignore the rest of the line.'
  - '[PAGE 24]


    # Using Comments


    Good programmers describe what is happening in their programs so that other programmers—and
    they themselves—can more easily edit or troubleshoot (debug) a program. JavaScript
    allows you to hide plain-English comments from the critical eye of the JavaScript
    interpreter.


    Note that there are two methods of hiding comments:


    +   - comments that fit on one line


    +   - comments that span multiple lines


    # ### Exercise 1-3: Inserting a Single-line Comment


    You first saw the // sequence in the previous exercise, when it was used to help
    hide JavaScript programs from browsers that lack JavaScript capabilities. In the
    following exercise, you will see how a single-line comment can be used for other
    purposes.


    +   1. Type the following script into your HTML document below the script you
    entered in the previous exercise:


    ```

    ```

    <H1>There''s a one-line comment in the following program.</H1>

    <SCRIPT LANGUAGE="JavaScript">

    <!-- Start hiding from old browsers.

    //The following line writes text into the HTML document.

    document.write("Single-line comments are joy.")

    // Stop hiding from old browsers. -->

    </SCRIPT>

    ```

    ```'
