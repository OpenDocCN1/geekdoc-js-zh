    ChangeDisplay('Hand Tools')\"\nonFocus=\"FocusDisplay('Hand Tools')\" onBlur=\"\
    BlurDisplay('Hand Tools')\">\n<OPTION VALUE=\"Hammer\"> Hammer\n<OPTION VALUE=\"\
    Screwdriver\"> Screwdriver\n<OPTION VALUE=\"C-Clamp\"> C-Clamp\n<OPTION VALUE=\"\
    Tape Measure\"> Tape Measure\n</SELECT>\n</FORM>\n\n<body>\n</html>\n```\n\n3.\
