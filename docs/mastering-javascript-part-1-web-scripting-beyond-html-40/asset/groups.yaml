    In this program, the three event handlers attached to each of the elements in\
    \ the lower half of the document detect changes in focus and in the contents of\
    \ the text handlers, and call functions that report those changes in the text\
    \ fields that appear at the top of the document.\n\n122 DDC Publishing • www.ddcpub.com\n\
    \n# Selection Lists & Drop-Down Boxes\n\nSelection lists and drop-down list boxes\
    \ (they are the same in the eyes of the Web browser) have three event handlers:\n\
    \n- onChange: Trips when a user changes the selected element in a selection list\
    \ or drop-down list box.\n- onFocus: Trips when a user gives focus to the selection\
    \ list or drop-down list box.\n- onBlur: Trips when a selection list or drop-down\
    \ list box loses focus.\n\n# Exercise 8-4: Attaching an Event Handler to a Selection\
    \ Box\n\n1. Open a new document in your text editor.\n\n2. Type the following\
    \ script into the new HTML document:\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Attaching\
    \ an Event Handler to a Selection Box</TITLE>\n<SCRIPT LANGUAGE=\"JavaScript\"\
    >\n<!-- Start hiding from old browsers.\nfunction FocusDisplay(SentValue)\n{\n\
    \  document.DemoForm.FocusOutput.value=(\"You gave focus to \" + SentValue + \"\
