    Lee\"> Lee\n<OPTION VALUE=\"Lincoln\"> Lincoln\n<OPTION VALUE=\"Nobody\"> Nobody\n\
    </SELECT><p>\n<INPUT TYPE=\"BUTTON\" NAME=\"ClickButton\" Value=\"Which answer\
    \ is selected?\" onclick=\"Identify()\"></p>\n<INPUT TYPE=\"TEXT\" NAME=\"Output\"\
    \ Value=\"\" SIZE=30>\n</FORM>\n``` (Wait, the original text cut off here, let\
    \ me reconstruct based on context)\n```\n\n+ 3. Save the file as SELECTION_LIST.HTML.\
