    你可以使用 JavaScript 在文档内部与表单元素交互。你将使用的引用表单元素的语法与 JavaScript 的面向对象学习密切相关。学习如何引用 HTML
    表单中的数据将帮助你将来编写编写更复杂的 JavaScript 程序。


    大多数表单元素的内容并不难通过 JavaScript 程序访问。你只需要引用元素所在的 HTML 文档、该元素所在的特定表单以及元素本身。注意，这个顺序仅仅是一个层级结构。


    引用表单及其元素有两种方法（对于人类程序员来说很容易确定）：


    - 通过名称（对人类程序员很容易确定）

    - 通过数组位置（便于整合到自动化程序中）


