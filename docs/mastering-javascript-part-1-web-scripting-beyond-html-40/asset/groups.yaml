    # Mastering JavaScript - Part 1


    # JavaScript vs. Java


    Those new to Web programming often make the mistake of confusing JavaScript with
    Java. Despite the similarity in names, Java and JavaScript are very different
    (and really should not share the same root name). Java is a complex object-oriented
    programming language, similar to C++. Large, complex applets and applications
    can be created with Java.


    Figure 1-1 shows a Java applet (which, in turn, launches Java applications) at
    the TalkCity web site.


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_17_0.png)


