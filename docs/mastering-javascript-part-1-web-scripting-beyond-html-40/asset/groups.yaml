    # For Loops


    Computers excel at efficiently performing repetitious actions. It would be inefficient
    to manually calculate the results of plugging 1,000 different values into a function,
    but you can write a JavaScript program that does the job for you in a fraction
    of the time a pencil and hand calculation would require.


    Writing such a program is especially easy if the 1,000 values represent a type
    of definable series, as the numbers between 1 and 1,000 or the whole numbers between
    5 and 5,000 that are evenly divisible by 2.5.


    JavaScript''s mechanism for performing such repetitive tasks is the for loop.
    In this section, you will learn how to create for loops and get an idea of how
    for loops can be used in real-life JavaScript programs.


    # Syntax


    In a for loop, you must specify several elements:


    +   * an index variable;

    * the condition of the index variable at the start of the loop''s execution;

    * the condition of the index variable at the end of the loop''s execution;

    * the way the index variable is changed at the start of each iteration of the
    loop;

    * the code that executes during each iteration of the loop.


    The JavaScript syntax for declaring a loop appears as follows:


    ```

    for(initial condition ; test ; increment)

    {

    code that is executed during each iteration of the loop

    }

    ```'
- md: "\nThe initial condition is the value of the index variable (usually named i,\
    \ Index, index or n) at the start of the loop—the statement actually sets the\
    \ value of the variable. It is typically something like n=0 or i=1.\n\nThe test\
    \ is a logical statement that is evaluated at the beginning of each iteration\
    \ of the loop. If the test evaluates to true, the loop executes again. If the\
    \ test evaluates to false, the loop stops executing. Usually, the test involves\
    \ the index variable. The test is often something like (n<=100) or ((n>0) && (m<=100)).\n\
    \nThe increment statement defines how the index variable changes at the start\
    \ of each iteration of the loop. Typically, the increment adds to or subtracts\
    \ from the index variable. The statements i++ and (n=n+100) are common increment\
    \ statements.\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_78_0.png)\n\nThe script\
    \ contained in the braces is executed each time the loop iterates. executing the\
    \ script quickly and efficiently multiple times is the purpose of a loop.\n\n\
    ## Exercise 5-3: Using a for Statement\n\n1. Type the following script into your\
    \ HTML document below the script you entered in the previous exercise:\n\n```\n\
    <<h1>>This program shows how <CODE>for</CODE> loops work.</</h1>\n<SCRIPT LANGUAGE=\"\
