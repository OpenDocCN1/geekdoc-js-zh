    ## Referring to Form Elements


    You can use JavaScript to interact with form elements from within a document.
    The syntax you will use to refer to form elements is closely associated with JavaScript''s
    object-oriented learning. Learning how to refer to data in HTML forms will help
    you script more complex JavaScript programs in the future.


    The contents of most form elements are not difficult to access from a JavaScript
    program. You simply refer to the HTML document in which the element appears, the
    specific form in which it appears, and the element itself. Note that this sequence
    is simply a hierarchy.


    There are two ways to refer to forms and their elements: (which is easy for a
    human programmer to determine):


    - by name (which is easy for a human programmer to determine)

    - by array position (which is easy to incorporate into an automated routine)


    This following section explains both of these methods.


    ### The Name Method


    Recall that when creating HTML form elements, all elements have a NAME attribute.
    Every form element is in a form, and every form is in an HTML document. You can
    note this relationship as follows:


    - document.formname.elementname


    If you want to refer to a button whose NAME attribute is set to Button1 and which
    appears in a form whose NAME attribute is set to RegistrationForm, you would specify
    the elements as shown in Figure 7-1.


    | document.RegistrationForm.Button1 |

    | :--- | :--- | :--- |

    | HTML document | Form within the HTML document | Individual element within form
    in HTML document |


    Figure 7-1: Referring to elements in a form


