- md: "\n## Special Form-Referencing Procedures\n\nSome HTML form elements require\
    \ special procedures to identify the value that a user has selected. Selection\
    \ lists and groups of radio buttons require special attention.\n\n## References\
    \ to Radio Button Groups\n\nGroups of radio buttons exist—from the perspective\
    \ of a Web browser—as arrays. To determine which radio button in a group a user\
    \ has selected, you need to use a for loop that examines the contents of the array\
    \ (the individual radio buttons) one at a time.\n\n## Exercise 7-3: Referring\
    \ to Radio Button Groups\n\n+ 1. Open a new document in your text editor.\n2.\
    \ Type the following script into the new HTML document:\n\n```html\n<HTML>\n<HEAD>\n\
    <TITLE>Referring to Radio Button Groups</TITLE>\n<SCRIPT LANGUAGE=\"JavaScript\"\
    >\n<!-- Start hiding from old browsers.\nfunction Identify()\n{\nvar SelectedValue\n\
    var i\nvar GroupSize\nGroupSize = document.DemoForm.RadioGroup.length\nfor (i=0;\
    \ i<=GroupSize; i++)\n{\nif (document.DemoForm.RadioGroup[i].checked)\n{\nSelectedValue\
    \ = document.DemoForm.RadioGroup[i].value\nbreak\n}\n}\n}\ndocument.DemoForm.Output.value\
    \ = SelectedValue\n// Stop hiding from old browsers. //\n</SCRIPT>\n<HEAD>\n<BODY>\n\
    <h1>It's a little tricky to identify the selected option in a cluster of radio\
    \ buttons, but not too difficult.</h1>\n<FORM NAME=\"DemoForm\">\n<P>Which language\
    \ is best for creating Web animations?</P>\n<INPUT TYPE=\"RADIO\" NAME=\"RadioGroup\"\
    \ Value=\"Java\"> Java<BR>\n<INPUT TYPE=\"RADIO\" NAME=\"RadioGroup\" Value=\"\
    JavaScript\"> JavaScript<BR>\n<INPUT TYPE=\"RADIO\" NAME=\"RadioGroup\" Value=\"\
    Perl\"> Perl<BR>\n<INPUT TYPE=\"RADIO\" NAME=\"RadioGroup\" Value=\"COBOL\"> COBOL<BR>\n\
    <INPUT TYPE=\"RADIO\" NAME=\"RadioGroup\" Value=\"VBScript\"> VBScript<P>\n<INPUT\
    \ TYPE=\"BUTTON\" NAME=\"ClickButton\" Value=\"Which radio button is selected?\"\
    \ onclick=\"Identify()\"><P>\n<INPUT TYPE=\"TEXT\" NAME=\"Output\" Value=\"\"\
    \ SIZE=30>\n</FORM>\n</BODY>\n</HTML>\n```\n\n+ 3. Save the file as RADIOBUTTON_GROUPS.HTML.\
    \ Switch applications to your Web browser and open RADIOBUTTON_GROUPS.HTML.\n\n\
    + 4. Select one of the radio buttons and click the **Which radio button is selected?**\
    \ button. Your screen should appear similar to Figure 7-6 on the following page.\n\
    \n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_117_0.png)\n\n## It's a little tricky\
    \ to identify the selected option in a cluster of radio buttons, but not too difficult.\n\
    \nWhich language is best for creating Web animations?\n\n- Java\n- JavaScript\n\
    - Perl\n- COBOL\n- VBScript\n\nWhich radio button is selected?\n\nJavaScript\n\
    \nFigure 7-6: Referring to radio button groups in JavaScript\n\nThe key to identifying\
    \ the selected radio button in a group is this for loop:\n\n```javascript\nfor\
    \ (i=0; i<=GroupSize; i++)\n{\n  if (document.DemoForm.RadioGroup[i].checked)\n\
    \  {\n    SelectedValue = document.DemoForm.RadioGroup[i].value\n    break\n \
    \ }\n}\n```\n\nThe variable GroupSize, the value at which the loop stops iterating,\
    \ is set equal to document.DemoForm.RadioGroup.length. Length is a property of\
    \ the RadioGroup array that contains the index number of the last item in the\
    \ array (in this case, 4, because there are 5 radio button objects in the array\
    \ and the first is indexed as number 0).\n\nEach time the for loop iterates, an\
    \ if statement is processed:\n\n- if (document.DemoForm.RadioGroup[i].checked)\n\
    \n## Checked, SelectedValue, break, and if\n\nChecked is a property of radio button\
    \ objects that contains true if the radio button is checked and false if it is\
    \ not. This statement determines whether the checked property of the current radio\
    \ button (RadioGroup[i]) is true.\n\nIf the radio button is checked, more messages\
    \ are processed. The variable SelectedValue is set equal to the value of the current\
    \ radio button (which is defined in HTML with the VALUE attribute). The break\
    \ statement then instructs the browser to stop the loop (because the selected\
    \ radio button has been found) and move on to the line of code after the loop's\
    \ closing brace.\n\nThe if statement assigns the value of the selected radio button\
    \ to a variable SelectedValue.\n\n> The procedure for identifying the selected\
    \ option is the same for selection lists and drop-down list boxes. As far as JavaScript\
    \ is concerned, they are both SELECT objects.\n\n## References to Selection Lists\
    \ and Drop-Down Boxes\n\nUsing JavaScript in conjunction with selection lists\
    \ and drop-down list boxes is relatively trivial compared to what you scripted\
    \ in the previous exercise. You simply inspect a couple of properties and you\
