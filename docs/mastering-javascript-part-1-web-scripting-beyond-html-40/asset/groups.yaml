    # Clocks & Countdowns


    You can use JavaScript to create a real-time clock for your site. Real-time clocks
    are a good introduction to how JavaScript interacts with HTML forms.


    JavaScript clocks are actually three separate parts. Similar to the design of
    the last script, the time is actually grabbed in the <HEAD> of the document. The
    <BODY> region is where you instruct JavaScript to load the document (during page
    loading). Finally, the time is posted in a form within the body of the document.


    # Exercise 6-3: Setting Up a Real-Time Clock


    +   1. Type the following script into your HTML document over the script entered
    in the previous exercise:


    ```

    <HEAD>

    <SCRIPT LANGUAGE="JavaScript">

    <!-- Start hiding from old browsers

    var timerID = null;

    var timerRunning = false;

    function stopclock() {

    if(timerRunning) {

    clearTimeout(timerID);

    timerRunning = false;

    }


    function showtime() {

    var now = new Date();

    var hours = now.getHours();

    var minutes = now.getMinutes();

    var seconds = now.getSeconds();

    var timeValue = "" + (hours > 12) ? hours-12 : hours + ":" + minutes

    timeValue += (seconds < 10) ? "0" : "" + ":" + seconds

    timeValue += (hours >= 12) ? " PM" : " AM"

    document.clock.value = timeValue;

    timerID = setTimeout("showtime()",1000);

    timerRunning = true;

    }


    function startclock() {

    stopclock();

    showtime();

    }


    // Stop hiding from old browsers --

    </SCRIPT>

    </HEAD>

    ```


    ```

    <!-- Enter this into the Body Tag of your Document --

    <BODY onload="startclock()">

    ```'
