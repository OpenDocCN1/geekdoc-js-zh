    ## Exercise 9-5: Using JavaScript to Control Frames


    - 1. Open the FRAMES folder located within your JAVCRIPT-1 folder and double click
    the file FRAMES.HTML.


    - 2. Your browser should open with an image similar to Figure 9-7.


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_151_0.png)


    - 3. The code for this script is relatively simple. Open the file FRAME1.HTML
    in Notepad and examine the code, as shown in Figure 9-8.


    ```

    <INPUT TYPE="button" VALUE="Frame 2" onclick="top.frames[1].location=''frame1.html''>

    <INPUT TYPE="button" VALUE="Frame 3" onclick="top.frames[2].location=''frame1.html''>

    <INPUT TYPE="button" VALUE="Frame 4" onclick="top.frames[3].location=''frame1.html''>

    <INPUT TYPE="button" VALUE="Clear it" onclick="top.frames.location=''frames.html''>

    ```


    Figure 9-8: Code for FRAME1.HTML


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_152_0.png)


    Using the event handler `onClick` and four different buttons, this file controls
    the location of the new windows when opening. This code can also be used to simultaneously
    update multiple frames.


    You can also use this type of frame to control other aspects of the frame layout.
    For instance, you can change the first line to read: `onclick=top.frames[1].bgColor="teal"`.
    This will change the background color of the second frame to teal.


    You can learn more about JavaScript and its interaction with frames in DDC Publishing’s
    *Mastering JavaScript: Part 2* course.


    ## Lesson Summary


    - JavaScript can be used to control windows, and features of windows, more thoroughly
    than HTML.


    - An alert window is a small window that “pops up” to warn browser users of a
    problem. You can program JavaScript to launch alert windows.


    - Using event handlers, such as onClick and onLoad, you can program new windows
    to open in JavaScript.


    - Framesets can also be manipulated through JavaScript. From one window you can
    change the characteristics of multiple windows.


    ## Notes


    ## Appendices


    - Appendix A: JavaScript Client-side Objects

    - Appendix B: JavaScript Glossary


    ## Appendix A: JavaScript Client-side Objects


    There are many objects relevant to working with JavaScript in a client-side environment
    (in a Web browser).


    Many of these objects are related to one another as property values. Reference
    Figure A-1 displays the client-side object containment hierarchy for JavaScript
    1.2.


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_157_0.png)


    Reference Figure A-1: Containment relationships among client-side objects in JavaScript
    1.2


    ## Appendix B: JavaScript Glossary


    **Arithmetic operator**

    Any of the following symbols: *, +, -, / (divide).


    **Array**

    A list of items stored in a single variable.


    **Assign**

    To give a value to a variable.


    **Assignment operator**

    Symbols used to assign values, such as =.


    **Bug**

    An error in a program.


    **Call**

    To execute a function.


    **Case-insensitive**

    A property that does not distinguish between uppercase and lowercase.


    **Case-sensitive**

    A property that distinguishes between uppercase and lowercase letters.


    **Clause**

    A part of a statement or expression.


    **Command**

    An instruction given to the computer.


    **Comment-out**

    Text in a program that is ignored by the compiler.


    **Comparison operator**

    Symbols used to compare values, such as ==, >, <.


    **Concatenate**

    To join two or more strings together.


    **Conditional statement**

    A statement that performs actions based on a condition.


    **Constant**

    A value that cannot be changed during the execution of a program.


    **Embed**

    To insert code or content into another document or program.


    **Empty string**

    A string that contains no characters.


    **Error**

    An incorrect statement in a program.


    **Event**

    An action that occurs in the system which can be handled.


    **Debug**

    To find and fix errors in a program.


    **Define**

    To state the meaning or purpose of something.


    **Definition**

    The meaning of a word or term.


    **Document object**

    An object that represents the content of a document.


    **Element**

    A part of a document or program structure.


    **False**

    A boolean value indicating "not true".


    **Focus**

    The state of an element ready for input.


    **Function**

    A block of code that performs a specific task.


    **Function call**

    The execution of a defined function.


    **Increment**

    To increase the value of a variable, typically by 1.


    **Initialize**

    To set an initial value for a variable.


    **Iteration**

    The process of repeating a task, often within a loop.

