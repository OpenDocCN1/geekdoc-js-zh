    # # Predefined Functions


    To make tasks easier for JavaScript programmers, several predefined functions
    have been specified within the scripting language.


    These predefined, or "top-level," functions include eval, isNaN, Number, String,
    parseInt parseFloat, escape, unEscape, taint, and untaint. These functions can
    be executed within any script, without having to define their actions. They perform
    the same actions every time.


    Table 4-1 describes the purpose of each JavaScript''s predefined functions.


    | Top Level Function | Syntax | Purpose |

    |---|---||

    | eval | eval(string) | Used to evaluate a string of JavaScript code without referencing
    a particular object. If the string is JavaScript coding it executes it. |

    | isNaN | isNaN(value) | Used to determine if the value is not a number (NaN).
    If the value is a number, it returns a false. |

    | Number | Number(object) | Converts an object to a number. Especially useful
    if you want to perform quick calculations on a complex variable. |

    | String | String(object) | Similar to the Number Function, except it converts
    an object to a string. |

    | parseFloat and parseInt | parseFloat(string) parseInt(string, [base]) | Both
    attempt to return a numeric value from their accompanying strings. parseFloat
    parses the numbers, while parseInt parses them, converts them to whatever base
    is referenced. |

    | escape and unescape | escape(string) unescape(string) | Encodes and decodes
    whatever string information is provided. |

    | taint and untaint | taint untaint | Used for adding and removing data tainting.
    This prevents other scripts from passing secure information. |


