    # JavaScript 定义


    JavaScript 是熟练的 Web/网站开发者使用的许多工具之一。通过 JavaScript，你可以让 Web 页面更具吸引力和更具交互性。由于 JavaScript
    是一种脚本语言，它比编程语言（如 Java 或 C++）要简单得多。通过努力学习，即使你没有计算机经验，也可以掌握 JavaScript。


    JavaScript 在加载到 Web 浏览器的 HTML 文档中执行任务——与 Java applets 或 ActiveX 控制可以完成的操作相比，这些任务相对简单。


    JavaScript 擅长以下任务：


    - 在小型数据库中执行数据查找

    - 在将数据发送到服务器之前进行验证

    - 对用户操作做出智能反应

    - 操作多个浏览器窗口的内容

    - 操控多个 Web 页面框架的内容


    # 紧密的 HTML 集成


    JavaScript 与 HTML 紧密集成。将 JavaScript 想象成“加强版”HTML。事实上，你会发现 JavaScript 代码实际上嵌入在
    HTML 文档中。因为你已经对 HTML 非常熟悉，所以包含 JavaScript 的文档对你来说会很熟悉。


    # 最流行的脚本语言


    JavaScript 与 HTML 的紧密集成使其迅速成为 Web 上最流行的（HTML 之外的）脚本语言。据来源估计，有超过四百万个 Web 页面使用了
    JavaScript，这使其比 VB 甚至比老牌的互联网主力 Perl 还要常见。


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_15_0.png)


    JavaScript 的技术优势是它在客户端计算机上（即 Web 浏览器中）执行所有的编程指令，而不是在服务器上。在包含它们的 Web 页面下载后，JavaScript
    程序不再引用服务器，因此不会对服务器产生额外需求，也不会给用户带来带宽负担。


    # 服务器端 JavaScript


    JavaScript 传统上被用作客户端脚本语言。这有许多优势，例如不需要担心服务器负载或可用带宽的使用。这使得 JavaScript 对服务器的负担更小，并在客户端计算机内执行更快。


    遗憾的是，这些 JavaScript 特性限制了可以执行的脚本类型。任何严重依赖服务器执行的操作，例如电子邮件发送或数据库查询，无法通过客户端脚本执行。


    # 服务器端 JavaScript 的优势


    Netscape 为了克服 JavaScript 客户端脚本的局限性，发布了服务端 JavaScript（SSJS）。SSJS 包含了核心（客户端）JavaScript
    的所有元素，但增加了服务端脚本语言的优势。SSJS 为 JavaScript 代码引入了额外的对象，允许你：


    - 通过服务器发送电子邮件

    - 查询数据库

    - 提供其他涉及服务器交互的功能


    目前，SSJS 仅适用于 Netscape Enterprise Server。由于 Netscape Enterprise Server 仅占 Web 服务器市场的少数，本课程不涵盖
    SSJS。然而，随着 SSJS 被引入更多的服务器和应用程序，你将听到关于它的更多。


    有关 SSJS 的更多细节将根据情况整合到精通 JavaScript 系列的后续发行和更新中。


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_16_0.png)


    # 精通 JavaScript - 第一部分


    ## JavaScript 对比 Java


    Web 编程新手经常犯混淆 JavaScript 和 Java 的错误。尽管名称相似，Java 和 JavaScript 非常不同（而且真的不应该共享相同的根名称）。Java
    是一种复杂的面向对象的编程语言，类似于 C++。可以使用 Java 创建大型、复杂的 applet 和应用程序。


    图 1-1 显示了 TalkCity 网站上的 Java applet（它反过来启动 Java 应用程序）。


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_17_0.png)


    图 1-1：Java applet 比 JavaScript 程序更复杂


