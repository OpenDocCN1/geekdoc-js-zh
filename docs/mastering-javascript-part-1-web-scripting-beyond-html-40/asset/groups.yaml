    Mastering JavaScript Part 1


    ## Comparison Operators


    You may be familiar with or have worked with the operators you will learn about
    in this section. JavaScript''s comparison operators help you determine the relationship
    between two values.


    ## Six Comparison Operators Supported


    When you apply any of JavaScript''s six comparison operators to two values, either
    true or false is produced as a result. If the comparison statement (such as, "is
    greater than") is true, the comparison returns true. Otherwise, the comparison
    returns false. For example, 6 == 7 would return false, because six is not equal
    to seven.


    The six JavaScript comparison operators are outlined in Table 3-3.


    | Operation | JavaScript Operator |

    | --- | --- |

    | Is equal to | == |

    | Is not equal to | != |

    | Is greater than | > |

    | Is less than | < |

    | Is greater than or equal to | >= |

    | Is less than or equal to | <= |


    Table 3-3: JavaScript comparison operators


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_49_0.png)


    Comparison operators are very important to conditional statements and loops, as
    you will learn in Lesson 5: Conditional Statements & Loops.


    36


    DDC Publishing • www.ddcpub.com


    ## Exercise 3-3: Using Comparison Operators


    1. In your JAVCRIPT-1 folder, open the file called GUESSING.HTML in Notepad.


    2. This is a Guessing Game that makes use of comparison operators. Double click
    the file to open it in your browser. Your screen should appear similar to Figure
    3-3.


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_50_0.png)


    Figure 3-3: Comparison operators simply compare values


    Examine the code in GUESSING.HTML. Specifically, note the following lines:


    ```

    response = num

    if (num < myNumber) response = alert(response + " + was too low");

    if (num > myNumber) response = alert(response + " + was too high");

    if (num == myNumber)

    {

    response = response + alert("Correct!" + " Guess Again!");

    nG = 0

    myNumber = random(9)+1

    }

    ```


    This script takes the input from the form (the variable "guess") and compares
    it to the random number (the variable "randomNumber") chosen by the script. The
    script then does three comparisons: is the inputted number greater than, less
    than or equal to the random number chosen by the script. You can easily accomplish
    this with a series of if...else statements (you will learn more about these in
    Lesson 5). Because one number can only be greater than, less than or equal to
    another number, you only need to perform three comparison operations.


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_51_0.png)


    As you can see, if the if_else statement matches the correct comparison of the
    two variables, an alert box is called that informs you that your guess was 1)
    too high, 2) too low, or 3) you win and you should start over.


    # Logic Operators


    Logic operators become useful when you need to determine which of several conditions
    are true. By joining several conditions with AND or OR operators, you can determine
    what is happening with a given set of variables.


    There are three logic operators, shown in Table 3–4.


    | Operator | JavaScript Operator |

    | --- | --- |

    | AND | && |

    | OR | || |

    | NOT | ! |


    **Table 3-4:** JavaScript logical operators


    How do you type the | character? It is the SHIFT function of the key just above
    the <ENTER> key on most keyboards.


    ## How to Use Logical Operators


    Logical operators are used to join two statements that result in one of two Boolean
    values (true or false). The values returned by the logical operators depend upon
    how many values surrounding them are true.


    - A && statement will return true only if both the values surrounding it are true.

    - A || ! statement will return true if either of the values surrounding it is
    true.

    - The ! operator is a type of negation for Boolean values—it turns true values
    into false values and vice-versa.


    ## Exercise 3-4: Using Logical Operators


    1. Type the following script into your HTML document below the script you entered
    in the previous exercise:


    ```

    <h1>This program illustrates the use of JavaScript logical operators.</h1>

    <SCRIPT LANGUAGE="JavaScript">

    <!-- Start hiding from old browsers. -->

    var Number1

    Number1 = 100

    var Number2

    Number2 = 5

    document.write("Number1 equals " + Number1 + " and Number2 equals " + Number2
    + ".")

    document.write("<H2>The && Operator</H2>")

    document.write("Number1 is greater than 50 and Number2 is less than 10?<P>")

    document.write((Number1 > 50) && (Number2 < 10))

    document.write("<H2>The || Operator</H2>")

    document.write("Number1 is equal to 50 or Number2 is less than 5?<P>")

    document.write((Number1 == 50) || (Number2 < 5))

    document.write("<H2>The ! Operator</H2>")

    document.write("Number1 is not greater than or equal to Number2?<P>")

    document.write((Number1 >= Number2))

    // Stop hiding from old browsers. -->

    </SCRIPT>

    ```


    2. Resave the file. Switch applications to your Web browser and reload the file.
    Browser screen should appear similar to Figure 3-4.


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_54_0.png)


    Figure 3-4: Logical operators determine which of several conditions are true


    This exercise relies upon conditional operators as well as logical operators.
    In the line


    ```

    document.write(Number1 == 50) || (Number2 < 5)

    ```


    the statement (Number1 == 50) is evaluated first (it is false) and then the statement
    (Number2 < 5) is evaluated (it, too, is false). Because both values surrounding
    the || operator are false, it must return false as well.


    # Lesson Summary


    -   Mathematical operators are used in JavaScript much the same as they are in
    math: +, -, *, /. Modulo is an operator specific to computer programming. Represented
    by the percent symbol (%), modulo displays the remainder following a division
    calculation.

    -   The equal symbol (=) is the most common assignment operator used in JavaScript.
    The equal symbol, combined with mathematical operators, creates shortcut assignment
    operators. The mathematical operation is performed and the result of the operation
    is assigned to the variable on the left.

    -   Comparing values in JavaScript is done with the familiar comparison operators
    (>, <, >=, etc.). JavaScript evaluates the statement and returns a value of true
    or false.

    -   The logic operators AND, OR, and NOT join two statements and return true or
    false. Logic operators are also known as Boolean operators.

