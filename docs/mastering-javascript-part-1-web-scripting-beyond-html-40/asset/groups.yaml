    \ Area Two，并将文本替换为任何你喜欢的字符串。\n\n5. 注意上述文本字段上方 Focus、Blur 和 Change 字段的变化，如下一页的图\
    \ 8-3 所示。\n\n# 精通 JavaScript 第 1 部分\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_135_0.png)\n\
    \n程序程序，附加到文档下半部分每个元素的三个事件处理器会检测焦点和文本处理器内容的变化，并调用函数在出现在文档顶部的文本字段中报告这些更改。\n\n122\
    \ DDC Publishing • www.ddcpub.com\n\n# 选择列表与下拉框\n\n选择列表和下拉列表框（在浏览器眼中它们是同一种）具有三个事件处理器：\n\
    \n- onChange: 当用户更改选择列表或下拉列表框中的选中元素时触发。\n- onFocus: 当用户赋予选择列表或下拉列表框焦点时触发。\n- onBlur:\
    \ 当选择列表或下拉列表框失去焦点时触发。\n\n# 练习 8-4：为选择框附加事件处理器\n\n1. 在你的文本编辑器中打开新文档。\n\n2. 在新的\
    \ HTML 文档中输入以下脚本：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Attaching an Event Handler\
    \ to a Selection Box</TITLE>\n<SCRIPT LANGUAGE=\"JavaScript\">\n<!-- Start hiding\
    \ from old browsers.\nfunction FocusDisplay(SentValue)\n{\n  document.DemoForm.FocusOutput.value=(\"\
    You gave focus to \" + SentValue + \")\"\n\ndocument.DemoForm.ChangeOutput.value=\"\
    (You changed \" + SentValue\n+ \")\"\n// Stop hiding from old browsers. --\n</SCRIPT>\n\
    </HEAD>\n<body\n<H1>This program demonstrates selection box event handlers.</h1>\n\
    <FORM NAME=\"DemoForm\"><P>\nFocus information:<BR>\n<INPUT TYPE=\"TEXT\" NAME=\"\
    FocusOutput\" Value=\"\" SIZE=52><P>\nBlur information:<BR>\n<INPUT TYPE=\"TEXT\"\
    \ NAME=\"BlurOutput\" Value=\"\" SIZE=52><P>\nChange information:<BR>\n<INPUT\
    \ TYPE=\"TEXT\" NAME=\"ChangeOutput\" Value=\"\" SIZE=52><P>\n<HR><P>\n<SELECT\
    \ SIZE=4 NAME=\"Select\" onChange=\"ChangeDisplay('Power Tools')\" onFocus=\"\
    FocusDisplay('Power Tools')\"\nonBlur=\"BlurDisplay('Power Tools')\">\n<OPTION\
    \ VALUE=\"Drill Press\"> Drill Press\n<OPTION VALUE=\"Table Saw\"> Table Saw\n\
    <OPTION VALUE=\"Jointer\"> Jointer\n<OPTION VALUE=\"Mill\"> Mill\n</SELECT>\n\
    <SELECT SIZE=4 NAME=\"HandSelect\" onChange=\"ChangeDisplay('Hand Tools')\"\n\
    onFocus=\"FocusDisplay('Hand Tools')\" onBlur=\"BlurDisplay('Hand Tools')\">\n\
    <OPTION VALUE=\"Hammer\"> Hammer\n<OPTION VALUE=\"Screwdriver\"> Screwdriver\n\
    <OPTION VALUE=\"C-Clamp\"> C-Clamp\n<OPTION VALUE=\"Tape Measure\"> Tape Measure\n\
    </SELECT>\n</FORM>\n\n<body>\n</html>\n```\n\n3. 将文件保存为 EVENTHANDLERS.4.HTML。切换到你的网络浏览器并打开\
    \ EVENTHANDLERS_4.HTML。\n\n4. 点击左侧选择框中的任何列表项，并注意上方 Focus、Blur 和 Change 字段的变化。\n\
    \n5. 点击右侧选择框中的任何列表项，并注意上方 Focus、Blur 和 Change 字段的变化。\n\n6. 尝试选择框中不同的配置，注意 Focus、Blur\
    \ 和 Change 字段的变化，如图 8-4 所示。\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_138_0.png)\n\
    \n> 图 8-4：选择列表也具有事件处理器\n\n嵌入在每个选择列表 `<SELECT>` 标签中的是三个事件处理器。当触发时，每个事件处理器都会调用一个函数，显示关于获得焦点的表单元素、失去焦点的元素以及更改元素的信息。\n\
    \n# 课程总结\n\n- 事件处理器是附加在图形元素上的代码段。事件处理器是一个“中间人”；它等待特定事件，然后触发一个 JavaScript 函数来响应该事件。\n\
    - 焦点是用于描述表单元素被选中（通过 <TAB> 键或鼠标点击）但不一定被点击的状态。\n- 按钮可以分配三个事件处理器：onClick、onFocus\
    \ 和 onBlur。onClick 在按钮被点击时触发；onFocus 在按钮被选中时触发；onBlur 在按钮失去焦点时触发。\n- 与按钮类似，单选按钮和复选框支持\
    \ onClick、onFocus 和 onBlur。\n- 表单中的文本处理器也支持事件处理器。OnChange 在字段或区域中的文本更改且焦点移开时触发。\n\
    - 选择列表和下拉框与文本处理器一样，共享 onFocus 和 onChange 处理器。\n\n# 第 9 课\n窗口控制\n\n# ## 课程主题\n\n\
    - 警告！（Alerts！）\n- 打开和关闭窗口\n- 框架\n- 课程总结\n\n# 警告！\n\nJavaScript 常用于控制浏览器窗口。这是一种非常常见的\
    \ JavaScript 形式，因为与纯 HTML 不同，JavaScript 允许你控制打开的浏览器的大小和特性。许多程序员使用 JavaScript 生成的浏览器窗口为他们的网站添加强调和动态元素。JavaScript\
    \ 允许你以 HTML 无法做到的方式操作框架。\n\n# alert() 标签\n\n警告（alert）是网络浏览器向用户发送的快速消息，告知用户 1)\
    \ 发生了错误或 2) 提供有关大小的信息。你可以通过 `alert()` 方法在页面内创建自己的警告。`alert()` 方法以警告窗口的形式打印（显示给用户）你在括号部分中输入的任何内容。\n\
    \n此类警告窗口的示例见下一页的图 9-1。这是一个非常简单的东西，但它是对 JavaScript 某些复杂的窗口控制能力的极佳介绍。\n\n# 练习 9-1：创建警告窗口\n\
    \n1. 在 HTML 文档中输入以下脚本：\n\n```html\n<HEAD>\n<SCRIPT LANGUAGE=\"JavaScript\">\n\
