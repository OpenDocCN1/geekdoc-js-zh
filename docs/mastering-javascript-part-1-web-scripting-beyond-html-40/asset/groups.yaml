    \n<INPUT TYPE=\"TEXT\" NAME=\"ChangeOutput\" Value=\"\" SIZE=52><P>\n\n<HR><BR>\n\
    \nText Field One:<BR>\n\n<INPUT TYPE=\"TEXT\" NAME=\"TextFieldOne\" Value=\"Change\
