    \ and check boxes, other form elements also have event handlers. In this section,\
    \ you will learn about the event handlers supported by text fields, text areas,\
    \ and selection lists.\n\nForms themselves also have event handlers. You can place\
    \ onSubmit and on event handlers in the <FORM> tag. They will trigger when the\
    \ form is submitted (uploaded) to a server with a SUBMIT button or cleared with\
    \ a RESET button.\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_132_0.png)\n\n#\
    \ Attaching Event Handlers to Fields and Text Areas\n\nText fields support three\
    \ event handlers:\n\n- onChange: Trips when a user changes the text in a text\
    \ field or text area. Under some operating systems (notably, all versions of Microsoft\
    \ Windows) the user must take focus away from the text handler before change is\
    \ recognized and the event handler trips.\n- onFocus: Trips when a user gives\
    \ focus to the text field or text area.\n- onBlur: Trips when the text field or\
    \ text area loses focus.\n\n# Exercise 8-3: Event Handlers in text\n\n1. Open\
