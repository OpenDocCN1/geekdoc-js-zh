    # Course Description


    Welcome to DDC Publishing''s Mastering JavaScript: Part 1. This course introduces
    you to JavaScript, a powerful scripting language that you can use to add functionality
    and interactivity to Web pages. This course is intended for students who are experienced
    and proficient with HTML. Programming experience is not required for this course.
    This course is designed as a prerequisite for Mastering JavaScript: Part 2.


    # Prerequisites


    - DDC Publishing''s HTML 4.0 Fundamentals

    - DDC Publishing''s HTML 4.0 Intermediate


    # Course Objectives


    - How JavaScript compares to Java.

    - What objects are and how they work in JavaScript.

    - How JavaScript stores values in variables.

    - Proper use of JavaScript data types.

    - How to declare variables.

    - Using loose typing.

    - How to use the typeof() operator.


    # Software Required For This Course


    To get the most out of the interactive features of this book, you will need two
    software applications:


    - A text editor: you will write JavaScript code, like HTML code, in a text editor.
    All computers running Microsoft Windows have a text-editing application called
    Notepad. If you prefer another application for editing HTML, you can use it to
    edit JavaScript also.

    - A JavaScript-aware Web browser: to run your JavaScript code, you will need a
    Web browser that can interpret JavaScript 1.2, such as Netscape Navigator 4.0
    or later or Microsoft Internet Explorer 4.0 or later. All code presented in this
    course was tested using Netscape Navigator 4.0.


    # Course Conventions


    ## General Conventions


    | File and directory names | All caps: |

    | :--- | :--- |

    | Save the file and name it JAVCRIPT.HTML | |

    | Text to be typed by student | Courier New font: |

    | <SCRIPT LANGUAGE="JavaScript"> | |

    | JavaScript code and HTML tags in lecture text and non-exercise examples | Courier
    New font: |

    | while(index < 9) | |

    | Web page hyperlinks | Bold and underlined: |

    | Click [here](#) to link to a different Web page. | |

    | New terms, text to be emphasized, Web page titles | Italic: |

    | Assignment operators are those that give... | |

    | Icons, buttons, text fields, keyboard functions, dialog boxes, pulldown menus
    & menu items | Bold: |

    | On the toolbar, click the Back button. | |


    # Internet Addresses


    | Uniform Resource Locators | Courier font: |

    | :--- | :--- |

    | www.sun.com | |

    | E-mail addresses | Courier font: |

    | techsupp@ddcpub.com | |


    # Web Browser Configuration


    | Web browser and version | MSIE 4.0x or Netscape Navigator 4.0x |

    | :--- | :--- |

    | Options, Auto Load Images | ✓ Selected |

    | Options, Show Toolbar | ✓ Selected |

    | Options, Show Location | ✓ Selected |

    | Directory Buttons (Navigator) | Turned off |

    | Links Toolbar (IE) | Turned off |

    | Other browser settings | Browser defaults |


    # Legend


    - **Analysis**: An examination of JavaScript code in hands-on exercises, lecture
    text, and examples.


    - **Example**: An illustration of the subject matter being reviewed.


    - **NetQuote**: Quote by a famous or significant individual regarding the history
    or any other characteristic of the Internet. NetQuotes are sometimes enlightening
    or entertaining, but always provide perspective to the subject matter being reviewed.


    - **NetResult**: In exercises, the result of specific actions taken. Most exercises
    have multiple NetResults.


    - **Note**: Supplemental, but important, information regarding the subject matter
    being reviewed.


    - **Scenario**: Typically preceding an exercise. Scenarios are examples that "set
    the stage" or provide a real-world context in which to analyze the subject matter
    reviewed.


    - **TechTip**: Technical supplement to the core course. TechTips are intended
    to expand your knowledge beyond the primary goals of this course.


    - **TriviaTip**: Trivial information regarding the Internet. Similar to NetQuotes,
    TriviaTips lend substance, perspective, and background.


    - **Warning**: Important—sometimes critical—information: unlike TriviaTips or
    NetQuotes, Warnings are not supplemental, but pertain directly to the subject
    matter being reviewed.


    # Lesson 1

    ## What is JavaScript?


    ### Lesson Topics


    - JavaScript Defined

    - Server Side JavaScript

    - JavaScript vs. Java

    - Embedding JavaScript in HTML

    - Using Comments

    - Lesson Summary


    # JavaScript Defined


    JavaScript is one of many tools used by a skilled Web/site developer. With JavaScript,
    you can make Web pages more attractive and more interactive. JavaScript, because
    it is a scripting language, is much simpler than a programming language (such
    as Java or C++). With some diligent study, you can master JavaScript, even if
    you have no computer experience.


    JavaScript performs tasks—relatively simple ones, compared to what can be done
    with Java applets or ActiveX Controls—in HTML documents that are loaded into Web
    browsers.


    JavaScript excels at the following tasks:


    - performing data-lookup in small databases

    - validating data before it is sent to a server

    - reacting intelligently to a user''s actions

    - manipulating the contents of multiple browser windows

    - manipulating the contents of multiple Web page frames


    # Tight HTML Integration


    JavaScript is tightly integrated with HTML. Think of JavaScript as HTML on steroids.
    In fact, you will see that JavaScript code is actually embedded within HTML documents.
    Because you already have a solid familiarity with HTML, documents that contain
    JavaScript will appear familiar to you.


    # Most Popular Scripting Language


    JavaScript''s tight integration with HTML has caused it to quickly become the
    most popular scripting language (other than HTML) on the Web. One source estimates
    that there are in excess of four million Web pages that utilize JavaScript, making
    it more common than VB and even the venerable Internet workhorse, Perl.


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_15_0.png)


    A technical advantage of JavaScript is that it executes all programming instructions
    on the client computer—that is, in the Web browser—not on the server. JavaScript
    programs do not refer to a server after the Web page containing them is downloaded,
    and therefore do not put additional demands on the server or create a bandwidth
    burden for the user.


    # Server Side JavaScript


    JavaScript has traditionally been used as a client-side scripting language. This
    has many advantages, such as not having to be concerned about server load or the
    use of available server bandwidth. This makes JavaScript code less taxing on servers
    and quicker to execute within a client computer (for a user).


    Unfortunately, these JavaScript characteristics also limit the types of scripts
    that can be executed. Anything that relies heavily on the server to execute, such
    as e-mail delivery or database queries, cannot be executed via client-side scripting.


    # Advantages of Server-Side JavaScript


    Netscape, in an attempt to overcome the limitations of JavaScript''s client-side
    scripting, has released Server-Side JavaScript (SSJS). SSJS incorporates all of
    the elements of core (clientside) JavaScript, but adds the advantages of a server-side
    scripting language. SSJS introduces additional objects to the JavaScript code
    that allow you to:


    - send e-mail through a server

    - query a database

    - provide other functionality that involves server interaction


    Currently, SSJS is only available with Netscape Enterprise Server. Because Netscape
    Enterprise Server is installed in only the minority of the Web server market,
    this course does not cover SSJS. However, as SSJS is incorporated into more servers
    and applications, you will hear more about it.


    More details regarding SSJS will be integrated into future releases of and updates
    to the Mastering JavaScript series as appropriate.


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_16_0.png)


    # Mastering JavaScript - Part 1


    ## JavaScript vs. Java


    Those new to Web programming often make the mistake of confusing JavaScript with
    Java. Despite the similarity in names, Java and JavaScript are very different
    (and really should not share the same root name). Java is a complex object-oriented
    programming language, similar to C++. Large, complex applets and applications
    can be created with Java.


    Figure 1-1 shows a Java applet (which, in turn, launches Java applications) at
    the TalkCity web site.


    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_17_0.png)


    Figure 1-1: Java applets are more complex than JavaScript programs

