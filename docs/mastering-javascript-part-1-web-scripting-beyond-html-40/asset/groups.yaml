    # Mathematical Operators


    You learned about mathematical operators in elementary school when you were taught
    that 1 + 1 = 2. In a nutshell, operators are special characters, such as + or
    x, that apply a particular function to the values to which they are assigned.


    JavaScript has many mathematical operators, most of which are already familiar
    to you. The + operator in JavaScript, for example, combines two values, just as
    it does in other contexts.


    # Five Mathematical Operators Supported


    Mathematical operators are those that perform a mathematical operation on two
    numbers. JavaScript supports five mathematical operators, as shown in Table 3-1.


    | Operation | Traditional Operator | JavaScript Operator |

    | --- | --- | --- |

    | Addition | + | + |

    | Subtraction | - | - |

    | Multiplication | x | * |

    | Division | ÷ | / |

    | Modulo | None | % |


    Table 3-1: JavaScript mathematical operators


    > What is modulo? It is an arithmetic operation that is rarely used outside of
    computer programming.


    > Modulo is simple to understand: the result of a modulo operation (called a modulus)
    is the remainder left when you divide one number into another. For example, 5
    modulo 11 = 1, because 5 divides into 11 twice, leaving a remainder of 1.


    Similarly, 11 modulo 24 = 2 and 20 modulo 100 = 0.


    > You can dictate the sequence in which several operations are performed with
    parentheses. If you enter (4*5)+3, the 4*5 is calculated first and then 3 is added,
    resulting in 23. On the other hand, 4*(5+3) results in 32, because 5 is added
    to 3, the result of which is then multiplied by 4.'
