    \ Select one of the items from the selection list and click Which answer is selected?\
    \ button. Your screen should appear similar to Figure 7-7.\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_120_0.png)\n\
    \n## Mastering JavaScript: Part 1\n\nThe key to this program lies in the following\
    \ script:\n\n```javascript\nSelectedChoice = document.DemoForm.GrantList.selectedIndex\n\
    ```\n\n```javascript\ndocument.DemoForm.value = document.DemoForm.GrantList.options[SelectedChoice].value\n\
    ```\n\nIn the first line, the variable SelectedChoice is set to the selection\
    \ list's selectedIndex. The selectedIndex property is the index number of the\
    \ option (contained in the array) that, as shown in Figure 7-8.\n\n| Index # |\
    \ Option |\n| :--- | :--- |\n| 0 | <OPTION SELECTED VALUE=\"Grant\"> Grant |\n\
    | 1 | <OPTION VALUE=\"Grant and Mrs. Grant\"> Grant and Mrs. Grant |\n| 2 | <OPTION\
    \ VALUE=\"Lee\"> Lee |\n| 3 | <OPTION VALUE=\"Lincoln\"> Lincoln |\n| 4 | <OPTION\
    \ VALUE=\"Nobody\"> Nobody |\n\nFigure 7-8: An options array in an HTML Form\n\
    \nIn the second line, the Output text field is set to the value of options[SelectedChoice]—the\
    \ value of the selected entry in the selection list.\n\n> You might wonder why\
    \ you should not structure the assignment as follows:\n\n```javascript\ndocument.DemoForm.Output.value\
    \ = document.DemoForm.GrantList.options[document.DemoForm.GrantList.selectedIndex].value\n\
    ```\n\nTechnically, you are supposed to be able to do this, and doing so would\
    \ save confusion of an extra variable. However, some Web browsers trip over large,\
    \ nested object references. In addition, the script is long and costly to be confusing\
    \ to a human editor.\n\n## Summary\n\n- Elements in JavaScript form a hierarchy.\
    \ You can refer to the elements in the hierarchy according to either 1) their\
    \ names or 2) their array position.\n- To use the name method for referring to\
    \ elements, each element is listed in descending order, separated by periods,\
    \ as in document.formname.elementname.\n- The array method for referring to elements\
    \ is convenient in routines that refer to them automatically. Forms and their\
    \ elements are arranged in the array by the order in which they appear in the\
    \ HTML code (left to right, top to bottom, in that order).\n- The choices in a\
    \ group of radio buttons in an HTML form are referred according to their array\
    \ position.\n- Selection lists and drop-down list boxes are mere SELECT objects\
    \ to the JavaScript interpreter, and their contents are referred according to\
    \ array position.\n"
  mdcn: "\n\n## 特殊表单引用过程\n\n某些 HTML 表单元素需要特殊的程序来识别用户选择的值。选择列表和单选按钮组需要特别注意。\n\n## 对单选按钮组的引用\n\
    \n从 Web 浏览器的角度来看，单选按钮组是以形式存在的。要确定用户选择了组中的哪一个单选按钮，你需要使用 `for` 循环逐个检查数组的内容（单个单选按钮）。\n\
    \n## 练习 7-3：引用单选按钮组\n\n+ 1. 在你的文本编辑器中打开一个新文档。\n2. 在新的 HTML 文档中输入以下脚本：\n\n```html\n\
    <HTML>\n<HEAD>\n<TITLE>Referring to Radio Button Groups</TITLE>\n<SCRIPT LANGUAGE=\"\
    JavaScript\">\n<!-- Start hiding from old browsers.\nfunction Identify()\n{\n\
    var SelectedValue\nvar i\nvar GroupSize\nGroupSize = document.DemoForm.RadioGroup.length\n\
    for (i=0; i<=GroupSize; i++)\n{\nif (document.DemoForm.RadioGroup[i].checked)\n\
    {\nSelectedValue = document.DemoForm.RadioGroup[i].value\nbreak\n}\n}\n}\ndocument.DemoForm.Output.value\
    \ = SelectedValue\n// Stop hiding from old browsers. //\n</SCRIPT>\n<HEAD>\n<BODY>\n\
    <h1>It's a little tricky to identify the selected option in a cluster of radio\
    \ buttons, but not too difficult.</h1>\n<FORM NAME=\"DemoForm\">\n<P>Which language\
    \ is best for creating Web animations?</P>\n<INPUT TYPE=\"RADIO\" NAME=\"RadioGroup\"\
    \ Value=\"Java\"> Java<BR>\n<INPUT TYPE=\"RADIO\" NAME=\"RadioGroup\" Value=\"\
    JavaScript\"> JavaScript<BR>\n<INPUT TYPE=\"RADIO\" NAME=\"RadioGroup\" Value=\"\
    Perl\"> Perl<BR>\n<INPUT TYPE=\"RADIO\" NAME=\"RadioGroup\" Value=\"COBOL\"> COBOL<BR>\n\
    <INPUT TYPE=\"RADIO\" NAME=\"RadioGroup\" Value=\"VBScript\"> VBScript<P>\n<INPUT\
    \ TYPE=\"BUTTON\" NAME=\"ClickButton\" Value=\"Which radio button is selected?\"\
    \ onclick=\"Identify()\"><P>\n<INPUT TYPE=\"TEXT\" NAME=\"Output\" Value=\"\"\
    \ SIZE=30>\n</FORM>\n</BODY>\n</HTML>\n```\n\n+ 3. 将文件保存为 RADIOBUTTON_GROUPS.HTML。切换到你的\
    \ Web 浏览器并打开 RADIOBUTTON_GROUPS.HTML。\n\n+ 4. 选择一个单选按钮并点击 **Which radio button\
    \ is selected?** 按钮。你的屏幕应该与下一页的图 7-6 相似。\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_117_0.png)\n\
    \n## 在单选按钮组中识别选中选项有点复杂，但并不太困难。\n\n哪种语言创建 Web 动画最好？\n\n- Java\n- JavaScript\n-\
    \ Perl\n- COBOL\n- VBScript\n\n哪个单选按钮被选中？\n\nJavaScript\n\n图 7-6：在 JavaScript\
    \ 中引用单选按钮组\n\n识别组中被选中单选按钮的关键是这个 `for` 循环：\n\n```javascript\nfor (i=0; i<=GroupSize;\
    \ i++)\n{\n  if (document.DemoForm.RadioGroup[i].checked)\n  {\n    SelectedValue\
    \ = document.DemoForm.RadioGroup[i].value\n    break\n  }\n}\n```\n\n变量 `GroupSize`（循环迭代停止时的值）被设置为等于\
    \ `document.DemoForm.RadioGroup.length`。`Length` 是 `RadioGroup` 数组的一个属性，包含数组中最后一个项的索引号（在本例中为\
    \ 4，因为数组中有 5 个单选按钮对象，且第一个索引为 0）。\n\n每当 `for` 循环迭代一次，就会处理一个 `if` 语句：\n\n- `if (document.DemoForm.RadioGroup[i].checked)`\n\
    \n## Checked, SelectedValue, break 和 if\n\n`Checked` 是单选按钮对象的一个属性，如果单选按钮被选中则为\
    \ `true`，如果未选中则为 `false`。此语句用于判断当前单选按钮（`RadioGroup[i]`）的 `checked` 属性是否为 `true`。\n\
    \n如果单选按钮被选中，将处理更多的消息。变量 `SelectedValue` 被设置为当前单选按钮的值（在 HTML 中通过 `VALUE` 属性定义）。然后，`break`\
    \ 语句指示浏览器停止循环（因为已经找到了选中的单选按钮），并移动到循环结束括号之后的代码行。\n\n`if` 语句将被选中单选按钮的值赋值给变量 `SelectedValue`。\n\
    \n> 识别选中选项的程序对于选择列表和下拉列表是相同的。对于 JavaScript 而言，它们都是 `SELECT` 对象。\n\n## 对选择列表和下拉框的引用\n\
    \n与选择列表和下拉框结合使用 JavaScript，与你在上一个练习中编写的脚本相比要简单得多。你只需要检查几个属性，就能识别所选条目的的值。\n\n##\
    \ 练习 7-4：从选择列表中识别选中选项\n\n+ 1. 在你的文本编辑器中打开一个新文档。\n\n+ 2. 在新的 HTML 文档中输入以下脚本：\n\n\
    ```html\n<HTML>\n<HEAD>\n<TITLE>Referring to Selection Lists and Drop-Down List\
    \ Boxes</TITLE>\n<SCRIPT LANGUAGE=\"JavaScript\">\n<!-- Start hiding from old\
    \ browsers. -->\nfunction Identify()\n{\nvar SelectedChoice\nSelectedChoice =\
    \ document.DemoForm.GrantList.selectedIndex\ndocument.DemoForm.value = document.DemoForm.GrantList.options[SelectedChoice].value\n\
    }\n// Stop hiding from old browsers. //\n</SCRIPT>\n</HEAD>\n<body>\n<h1>Here's\
    \ how to identify the selected option in a selection list or a drop-down list\
    \ box.</h1>\n<FORM NAME=\"DemoForm\"><P>\nWho is buried in Grant's tomb?<P>\n\
    <SELECT NAME=\"GrantList\" SIZE=1>\n<OPTION SELECTED VALUE=\"Grant\"> Grant\n\
    <OPTION VALUE=\"Grant and Mrs. Grant\"> Grant and Mrs. Grant\n<OPTION VALUE=\"\
    Lee\"> Lee\n<OPTION VALUE=\"Lincoln\"> Lincoln\n<OPTION VALUE=\"Nobody\"> Nobody\n\
    </SELECT><p>\n<INPUT TYPE=\"BUTTON\" NAME=\"ClickButton\" Value=\"Which answer\
    \ is selected?\" onclick=\"Identify()\"></p>\n<INPUT TYPE=\"TEXT\" NAME=\"Output\"\
    \ Value=\"\" SIZE=30>\n</FORM>\n```\n\n+ 3. 将文件保存为 SELECTION_LIST.HTML。切换到你的 Web\
    \ 浏览器并打开 SELECTION_LIST.HTML。\n\n+ 4. 从选择列表中选择其中一个项并点击 Which answer is selected?\
    \ 按钮。你的屏幕应该与图 7-7 相似。\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_120_0.png)\n\
    \n## 精通 JavaScript：部分 1\n\n此程序的关键在于以下脚本：\n\n```javascript\nSelectedChoice = document.DemoForm.GrantList.selectedIndex\n\
    ```\n\n```javascript\ndocument.DemoForm.value = document.DemoForm.GrantList.options[SelectedChoice].value\n\
    ```\n\n在第一行中，变量 `SelectedChoice` 被设置为选择列表的 `selectedIndex`。`selectedIndex` 属性是选项（包含在数组中）的索引号，如图\
    \ 7-8 所示。\n\n| Index # | Option |\n| :--- | :--- |\n| 0 | <OPTION SELECTED VALUE=\"\
    Grant\"> Grant |\n| 1 | <OPTION VALUE=\"Grant and Mrs. Grant\"> Grant and Mrs.\
    \ Grant |\n| 2 | <OPTION VALUE=\"Lee\"> Lee |\n| 3 | <OPTION VALUE=\"Lincoln\"\
    > Lincoln |\n| 4 | <OPTION VALUE=\"Nobody\"> Nobody |\n\n图 7-8：HTML 表单中的 options\
    \ 数组\n\n在第二行中，`Output` 字段被设置为 `options[SelectedChoice]` 的值——即选择列表中的选中条目的值。\n\n\
    > 你可能疑惑为什么不按照以下结构构造赋值：\n\n```javascript\ndocument.DemoForm.Output.value = document.DemoForm.GrantList.options[document.DemoForm.GrantList.selectedIndex].value\n\
    ```\n\n从技术上讲，你应该能够这样做，这样做可以避免额外变量带来的困惑。然而，某些 Web 浏览器在处理大型嵌套对象引用时会出错。此外，脚本对于人类编辑器来说冗长且混乱。\n\
    \n## 总结\n\n- JavaScript 中的元素形成层次结构。你可以根据 1) 它们或 2) 数组位置来引用层次结构中的元素。\n- 使用名称方法引用元素时，每个元素按顺序列出并用点号分隔，例如\
    \ `document.formname.elementname`。\n- 数组方法对于自动引用元素的例程非常方便。表单及其元素按照它们在 HTML 代码中顺序排列在数组中（从左到右，从上到下）。\n\
    - HTML 表单中单选按钮组的选择根据数组位置引用。\n- 选择列表和下拉框对于 JavaScript 解释器来说仅仅是 `SELECT` 对象，其内容根据数组位置引用。\n\
    \n"
