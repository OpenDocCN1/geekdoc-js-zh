- md: "\n# Mastering JavaScript: Part 1\n\nThe switch structure in the function Switcher\
    \ prints one thing if 1 is sent to the function, another thing if 2 is sent to\
    \ the function, and a third thing if neither 1 nor 2 is sent to the function.\n\
    \n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_87_0.png)\n\nWhat about the lines that\
    \ just say break? They are tricks that make this program execute faster. When\
    \ the browser encounters a break statement, it knows to jump completely out of\
    \ the switch structure and continue execution there. This prevents it from comparing\
    \ the variable to be evaluated with many other case values.\n\nThe functionality\
    \ of the switch statement is duplicated by this complex series of nested if...else\
    \ statements:\n\n```\nif (InputNum==1)\n    Message=\"<BR>One is the loneliest\
    \ number.\"\nelse\n    if (InputNum==2)\n        Message=\"<BR>Two is much better\
    \ than one.\"\n    else\n        Message=\"<BR>Say what?\"\n```\n\n# Lesson Summary\n\
    \n- JavaScript is capable of logical functions, allowing a program to follow certain\
    \ instructions under particular conditions. A scripter, then, can insert control\
    \ structures to cause a JavaScript program to behave in any number of ways.\n\n\
    - If statements prompt a section of a JavaScript program to execute when certain\
    \ conditions are met. When those conditions are not met, the program will continue\
    \ its course, ignoring the if statement and corresponding code.\n\n- If...else\
    \ statements prompt a section of a JavaScript program to execute when certain\
    \ conditions are met (or true). When those conditions are not met (or false),\
    \ a different set of instructions are performed before continuing.\n\n- Repetitive\
    \ tasks can be performed easily in a JavaScript program using a for loop. The\
    \ for loop requires information as an index variable's condition, and the code\
    \ that will be executed during each iteration of the loop.\n\n- While loops work\
    \ similarly to for loops, but offer greater flexibility. A while loop allows for\
    \ variation in the way the variables in the condition are changed in each iteration\
    \ of the loop.\n\n- Multiple if statements can be accomplished more easily by\
    \ using the switch statement control structure. The switch structure can perform\
    \ one action in one condition, another action under a different condition, and\
    \ a third action if neither the first nor the second condition exists.\n\n(This\
    \ page intentionally left blank)\n\n# Lesson 6: Date and Time\n\n- Page Updates\n\
    - Inserting the Date and Time\n- Countdowns\n- Calendars\n- Lesson Summary\n\n\
    # Page Updates\n\n**JavaScript is often used to add date and time features to\
    \ Web pages.** There are many properties programmed in JavaScript specifically\
    \ for this purpose. This Lesson teaches you how to take advantage of some of the\
    \ most common date and time functions offered by JavaScript. If you are responsible\
    \ for maintaining a large site, you are probably concerned about the currentness\
    \ of the information on your site. You can use JavaScript to tell you when a page\
    \ was last updated.\n\n# Exercise 6-1: Page Updated\n\n1. Type the following script\
    \ into your HTML document below the script entered in the previous exercise:\n\
    \n```\n<HTML>\n<BODY>\n<TITLE>Last Updated</TITLE>\n<CENTER>\n<SCRIPT LANGUAGE=\"\
    JavaScript\">\n<!-- Start hiding from old browsers\nlastModDate = new Date(document.lastModified);\n\
    document.write(\"<B>Last Updated:</B>\" + lastModDate);\n// Stop hiding from old\
    \ browsers\n</SCRIPT>\n</CENTER>\n</BODY>\n</HTML>```\n\n2. After you have saved\
    \ the file, retype one of the lines (this will create the first \"update\"). Switch\
    \ applications to your Web browser and reload the file. Your browser screen should\
    \ appear similar to Figure 6-1 on the following page.\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_92_0.png)\n\
    \nThe property lastModified specifies the date and time of the most recent changes\
    \ to a document. Most, but not all, Web servers supply this information so this\
    \ will not work on every site. The script has been tested on the most common servers:\n\
    \n- Apache\n- Microsoft Internet Server\n- Netscape Enterprise Server\n\n# Inserting\
    \ the Date and Time\n\nMany Web developers desire to display the current time\
    \ and date on their Web site. Some sites go as far as include a live clock. Doing\
    \ this helps promote the impression that your site is fresh and current (although\
    \ this is often not the case). JavaScript uses the Date object to specify the\
    \ date and time within an HTML page. Date returns a string which includes the\
    \ local date and time. The Date object is similar format to the Java and C programming\
    \ language data type.\n\n### Date object has the following characteristics:\n\n\
    - Dates are stored as number of milliseconds since January 1, 1970: 00:00:00\n\
    - The range of dates supported by JavaScript is from 100,000,000 days before January\
    \ 1, 1970 to 100,000,000 after.\n- JavaScript formats the date as Month Date,\
    \ Year Hours:Minutes:Seconds. If hours, minutes or seconds are left blank JavaScript\
    \ assumes 0 and bypasses the server. So, the time always appears local to the\
    \ user.\n- The JavaScript date object retrieves its information from the local\
    \ computer, not from the server. So, the time always appears local to the user.\n\
    \nThe two most common methods used to call the Date object are get and set. get\
    \ is used to retrieve the date or time from a Date object, set is used to tell\
    \ a date object what the date or time is. You cannot use get or set to change\
    \ the time on a user's computer; you only use these methods to manipulate the\
    \ date or time within a script.\n\nTable 6-1 demonstrates the forms that the get\
    \ and set methods of the Date object can use.\n\n| Method | Values |\n| :--- |\
    \ :--- |\n| getSeconds | 0-59 |\n| setSeconds | |\n| getMinutes | 0-59 |\n| setMinutes\
    \ | |\n| getHours | 0-23 |\n| setHours | |\n| getDay | 0-6 (Sunday through Saturday)\
    \ There is no setDay, because this method is derived automatically from the date\
    \ method. |\n| getDate | 1-31 Day of the Month |\n| setDate | |\n| getMonths |\
    \ 0-11 (January through December) |\n| setMonths | |\n| getFullYear | Two digit\
    \ year before 2000, four digit year for 2000 after. |\n| setFullYear | |\n\nTable\
    \ 6-1: Methods and values of the Date object\n\n# Exercise 6-2: Listing the Current\
    \ Date and Time\n\n1. Type the following script into your HTML document below\
    \ the script you entered in the previous exercise:\n\n```\n<HTML>\n<body>\n<TITLE>Current\
    \ Date and Time</TITLE>\n<CENTER>\n<SCRIPT LANGUAGE=\"JavaScript\">\n<!-- Start\
    \ hiding from old browsers -->\ndocument.write(Date()+\".\"\")\n\n//-- hiding\
    \ from old browsers -->\n</SCRIPT>\n</CENTER>\n</body>\n</HTML>```\n\n2. Save\
    \ the file. Switch applications to your Web browser and reload the file. Your\
    \ browser screen should appear similar to Figure 6-2 on the following page.\n\n\
    ![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_95_0.png)\n\nThe Date() command displays\
    \ the local date and time. “Local” is defined as the date and time on the page\
    \ visitor's computer, not the date and time of the server on which the Web page\
    \ resides.\n\n# Lesson 6: Date and Time\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_96_0.png)\n\
    \n**Figure 6-2:** This Script demonstrates the Date Object\n\nThis is really a\
    \ one-line script. The line document.write(Date()+\".\"\") does all the work.\
    \ While this is very functional, it is not very pretty. For something that looks\
    \ more professional, try the following.\n\n3. Type the following script into your\
    \ HTML document below the script you entered in the previous exercise:\n\n```\n\
    <HTML>\n<body>\n<TITLE>Current Date and Time</TITLE>\n<CENTER>\n<HEAD>\n<SCRIPT\
    \ LANGUAGE=\"JavaScript\">\n<!-- Start hiding from old browsers\nvar day=\"\"\
    ;\nvar month=\"\";\nvar ampm=\"\";\nvar amphour=\"\";\nvar weekday=\"\";\nvar\
    \ year=\"\";\nmydate = new Date();\nmyday = mydate.getDate();\nmonth = mydate.getMonth();\n\
    weekday = mydate.getDay();\nyear = mydate.getFullYear();\nmyhours = mydate.getHours();\n\
    amphour = (myhours > 12) ? myhours - 12 : myhours;\nampm = (myhours > 12) ? '\
    \ PM' : ' AM';\ntymime = mydate.getMinutes();\ntyminutes = ((minutes < 10) ? ':0'\
    \ : ':') + minutes;\n```\n"
  mdcn: "\n\n# 掌握 JavaScript：第一部分\n\n在 `Switcher` 函数的 `switch` 结构中，如果向函数发送 1，则打印一个内容；如果发送\
    \ 2，则另一个；如果既不是 1 也不是 2，则打印第三个内容。\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_87_0.png)\n\
    \n那些只写 `break` 的行是怎么回事？它们是让程序运行更快的技巧。当浏览器遇到 `break` 语句时，它知道完全跳出 `switch` 结构并在那里继续执行。这防止了它将待评估的变量与其他许多\
    \ `case` 值进行比较。\n\n`switch` 语句的功能可以通过这一复杂的嵌套 `if...else` 语句重复实现：\n\n```\nif (InputNum==1)\n\
    \    Message=\"<BR>One is the loneliest number.\"\nelse\n    if (InputNum==2)\n\
    \        Message=\"<BR>Two is much better than one.\"\n    else\n        Message=\"\
    <BR>Say what?\"\n```\n\n# 课程总结\n\n-   JavaScript 具备逻辑功能，允许程序在特定条件下遵循某些指令。因此，脚本编写人员可以插入控制结构，使\
    \ JavaScript 程序以任意方式运行。\n\n-   `if` 语句在满足某些条件时触发 JavaScript 程序的某部分执行。当这些条件不满足时，程序将继续运行，忽略\
    \ `if` 语句和相应的代码。\n\n-   `if...else` 语句在满足某些条件（或为真）时触发 JavaScript 程序的某部分执行。当条件不满足（或为假）时，在继续之前会执行另一组指令。\n\
    \n-   在 JavaScript 程序中使用 `for` 循环可以轻松执行重复任务。`for` 循环需要作为索引变量条件的条件，以及在循环每次迭代期间将执行的代码。\n\
    \n-   `while` 循环的工作原理与 `for` 循环类似，但提供了更大的灵活性。`while` 循环允许在循环每次迭代中以不同的方式改变变量。\n\
    \n-   通过使用 `switch` 语句控制结构可以更容易地实现多个 `if` 语句。`switch` 结构可以在一个条件下执行一个操作，在另一个条件下执行另一个操作，并在第一个或第二个条件都不存在时执行第三个操作。\n\
    \n（本页故意留空）\n\n# 课程 6：日期和时间\n\n-   页面更新\n-   插入日期和时间\n-   倒计时\n-   日历\n-   课程总结\n\
    \n# 页面更新\n\n**JavaScript 经常用于为 Web 页面添加日期时间和功能。** JavaScript 中专门为此目的编写了许多属性。本课将教你如何利用\
    \ JavaScript 提供的最常用的日期时间函数。如果你负责一个大型网站，你可能担心网站上信息的实时性。你可以使用 JavaScript 告诉你页面最后更新的时间。\n\
    \n# 练习 6-1：页面更新\n\n1.  在你的 HTML 文档中，上一个练习输入的脚本下方输入以下脚本：\n\n```\n<HTML>\n<BODY>\n\
    <TITLE>Last Updated</TITLE>\n<CENTER>\n<SCRIPT LANGUAGE=\"JavaScript\">\n<!--\
    \ Start hiding from old browsers\nlastModDate = new Date(document.lastModified);\n\
    document.write(\"<B>Last Updated:</B>\" + lastModDate);\n// Stop hiding from old\
    \ browsers\n</SCRIPT>\n</CENTER>\n</BODY>\n</HTML>```\n\n2.  保存文件后，重新输入其中一行（这将创建第一次“更新”）。切换到你的\
    \ Web 浏览器并重新加载文件。你的浏览器屏幕应该与后续页的图 6-1 相似。\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_92_0.png)\n\
    \n`lastModified` 属性指定文档最近更改的日期和时间。大多数但并非所有 Web 服务器都提供此信息，因此这在每个网站上并不有效。该脚本已经在常用的服务器上经过了测试：\n\
    \n-   Apache\n-   Microsoft Internet Server\n-   Netscape Enterprise Server\n\n\
    # 插入日期和时间\n\n许多 Web 开发者希望在他们的网站上显示当前时间和日期。有些网站甚至包含实时时钟。这样做有助于增强对你的网站是新鲜且实时的印象（尽管通常并非如此）。JavaScript\
    \ 使用 `Date` 对象来指定 HTML 页面内的日期和时间。`Date` 返回一个包含本地日期时间的字符串。`Date` 对象的格式与 Java 和\
    \ C 编程语言的数据类型相似。\n\n### Date 对象具有以下特征：\n\n-   日期存储为自 1970 年 1 月 1 日 00:00:00 来的毫秒数。\n\
    -   JavaScript 支持的日期范围是从 1970 年 1 月 1 日之前的 100,000,000 天到之后的 100,000,000 天。\n\
    -   JavaScript 将日期格式化为“月 日, 年 时:分:秒”。如果小时、分或秒为空，JavaScript 将假设为 0 并跳过服务器。因此，时间始终对用户显示本地。\n\
    -   JavaScript 日期对象从本地计算机而不是从服务器获取信息。因此，时间始终对用户显示本地。\n\n调用 `Date` 对象最常用的两个方法是\
    \ `get` 和 `set`。`get` 用于从 `Date` 对象检索日期或时间，`set` 用于告诉 `Date` 对象日期或时间。你不能使用 `get`\
    \ 或 `set` 更改用户计算机的时间；你仅使用这些方法操作脚本内的日期或时间。\n\n表 6-1 展示了 `Date` 对象的 `get` 和 `set`\
    \ 方法可以使用的形式。\n\n| 方法 | 值 |\n| :--- | :--- |\n| getSeconds | 0-59 |\n| setSeconds\
    \ | |\n| getMinutes | 0-59 |\n| setMinutes | |\n| getHours | 0-23 |\n| setHours\
    \ | |\n| getDay | 0-6（星期日到星期六）没有 setDay，因为该方法是从日期方法自动派生的。 |\n| getDate | 1-31\
    \ 份中的几号 |\n| setDate | |\n| getMonths | 0-11（一月到十二月） |\n| setMonths | |\n| getFullYear\
    \ | 2000 年之前的两位年份，2000 年以后的四位年份。 |\n| setFullYear | |\n\n表 6-1：Date 对象的方法和值\n\n\
    # 练习 6-2：列出当前日期和时间\n\n1.  在你的 HTML 文档中，上一个练习输入的脚本下方输入以下脚本：\n\n```\n<HTML>\n<body>\n\
    <TITLE>Current Date and Time</TITLE>\n<CENTER>\n<SCRIPT LANGUAGE=\"JavaScript\"\
    >\n<!-- Start hiding from old browsers -->\ndocument.write(Date()+\".\"\")\n\n\
