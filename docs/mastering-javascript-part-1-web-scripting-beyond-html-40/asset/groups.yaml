- md: "\n## Lesson 4\nJavaScript Functions\n\n## Lesson Topics\n\n- Functions\n- Using\
    \ Functions\n- Predefined Functions\n- Lesson Summary\n\n## Functions\n\nAssume\
    \ you are writing a JavaScript program that must repeatedly perform action, such\
    \ as multiplying a variable by a ratio and then adding a constant to the result.\
    \ You can either repeatedly write lines of script that perform this task, or you\
    \ can write a function that does the job. Whenever you need to perform this particular\
    \ task, you can simply refer to the function you created.\n\nFunctions are not\
    \ a difficult concept to comprehend, but do not let fact fool you into underestimating\
    \ their value. Functions are an integral part of most JavaScript programs. In\
    \ addition to their obvious utility, functions make scripts easier to debug because\
    \ they reduce the number of points of failure.\n\n### What is a Function?\n\n\
    A function is a JavaScript command for which you define a purpose. After you create\
    \ a function, you can invoke it by name; then the actions you have associated\
    \ with that function will be performed. Thus, a function can be thought of as\
    \ a more powerful and complex macro (such as those used in word processing and\
    \ spreadsheet applications).\n\nFunctions serve two primary purposes:\n\n- save\
    \ time (similar to a macro in a word processing or spreadsheet application)\n\
    - make your programs easier to edit and read\n\nWhen should you use a function?\
    \ The best answer: anytime you plan to perform a multi-step action repeatedly\
    \ within a program. Functions allow you to define a multi-step action just once\
    \ and then invoke, or call, as many times as needed.\n\nFunctions are also useful\
    \ for Web sites that contain server-side HTML. You can place a function within\
    \ a header document and call it repeatedly throughout the site, without having\
    \ to replicate the code.\n\n> Server-side HTML, also known as server parsed HTML,\
    \ allows you to call another HTML document within your current HTML document.\
    \ These HTML documents generally display the file name extension (suffix) “.html”\
    \ and are often used by designers who want to use consistent headers and footers\
    \ throughout a Web site.\n\nEstablishing a separate header document that is called\
    \ into your other sites allows you to update a logo, or perhaps a toolbar, by\
    \ only updating one document (the rest of your site is instantly updated).\n\n\
    ## Creating Functions\n\nTo create a function:\n\n1. create a <SCRIPT>...</SCRIPT>\
    \ block in the <HEAD> section of an HTML document\n2. use the keyword function,\
    \ followed by the name of the function\n3. insert an opening brace\n4. define\
    \ the function instructions\n5. insert a closing brace\n\n### Exercise 4-1: Using\
    \ Functions\n\nType the following script into your HTML document below the script\
    \ you entered in the previous exercise:\n\n```\n<SCRIPT LANGUAGE=\"JavaScript\"\
    >\nfunction writeText()\n{\ndocument.write(\"<B>This text was written by a function.</B>\"\
    )\n}\n</SCRIPT>\n</HEAD>\n<BODY>\n<h1>This HTML document has a JavaScript function\
    \ in it...</h1>\n<h1>But it isn't called, so it doesn't do anything.</h1>\n```\n\
    \n## Mastering JavaScript - Part 1\n\n2. Resave the file. Switch applications\
    \ to your Web browser and reload the file. Your browser screen should appear similar\
    \ to Figure 4-1.\n\nFigure 4-1: A function is created in the background\n\nThe\
    \ complete declaration of the function writeText() is shown in Figure 4-2.\n\n\
    ```\n<SCRIPT LANGUAGE=\"JavaScript\">\nfunction writeText() {\n  document.write(\"\
    <B>This text was written by a function.</B>\");\n}\n</SCRIPT>\n```\n\nFigure 4-2:\
    \ Anatomy of a function\n\nThe above code creates a function called writeText()\
    \ that writes the line, This text was written by a function. into the HTML document.\
    \ Note however, that writeText() is never called; there is no line of code in\
    \ the document's <BODY> to invoke IT.\n\n## Using Functions\n\nYou now understand\
    \ why you would want to create a function and how to do it. How, then, do you\
    \ put your newly created function to work? Invoking a function you defined involves\
    \ simply calling the function name in a JavaScript program.\n\n### Exercise 4-2:\
    \ Calling Functions\n\n1. Type the following script into your HTML document below\
    \ the script you entered in the previous exercise:\n\n```\n<SCRIPT LANGUAGE=\"\
    JavaScript\">\nfunction writeText() {\n  document.write(\"<B>This text was written\
    \ by a function.</B>\");\n}\n</SCRIPT>\n<HEAD>\n<BODY>\n<h1>This HTML document\
    \ has a JavaScript function in it...</H1>\n<h1>And it will write the next line\
    \ of text.</H1>\n<SCRIPT LANGUAGE=\"JavaScript\">\n<!-- Start hiding from old\
    \ browsers. -->\nwriteText()\n// Stop hiding from old browsers. //\n</SCRIPT>\n\
    <h1>How about that!</h1>\n```\n\n## Mastering JavaScript Part 1\n\n2. Resave the\
    \ file. Switch applications to your Web browser and reload the file. browser screen\
    \ should appear similar to Figure 4-3.\n\nFigure 4-3: Certain text in this document\
    \ was written by a function\n\nThere are two pieces of JavaScript code in this\
    \ program. The first is the same as as in the previous exercise—`writeText()`.\
    \ The second passage of JavaScript code contains only one line (aside from the\
    \ `<SCRIPT></SCRIPT>` tags and the lines to hide the code from old browsers).\n\
    \nThat one line of code, `writeText()`, invokes the `writeText()` function. When\
    \ the program runs, the line of code contained in `writeText()` is displayed where\
    \ the function is called, not where it was created.\n\n## Passing Parameters to\
    \ Functions\n\nOften, you will want to send data to a function so the function\
    \ can perform actions with data. This is called passing parameters.\n\n### Exercise\
    \ 4-3: Passing Parameters\n\n1. Type the following script into your HTML document\
    \ below the script you entered in the previous exercise:\n\n```\n<SCRIPT LANGUAGE=\"\
    JavaScript\">\nfunction addNumbers(oneNumber,anotherNumber)\n{\nvar sum\n = (oneNumber\
    \ + anotherNumber)\ndocument.write(\"The sum of \" + oneNumber + \" and \" + anotherNumber\
    \ + \" is \" + sum + \".\")\n}\n</SCRIPT>\n</HEAD>\n<BODY>\n<H1>The function writes\
    \ text that's sent to it as a parameter:</H1>\n<SCRIPT LANGUAGE=\"JavaScript\"\
    >\n<!-- Start hiding from old browsers.\naddNumbers(5,3)\n// Stop hiding from\
    \ old browsers. -->\n</SCRIPT>\n<H1>How about that!</H1>\n```\n\n2. Save the file.\
    \ Switch applications to your Web browser and reload the file. Your browser screen\
    \ should appear similar to Figure 4–4.\n\nFigure 4-4: The function in this program\
    \ had a parameter passed to it\n\nIn this program, the function addNumbers() is\
    \ declared with the following line:\n\n```\nfunction addNumbers(oneNumber, anotherNumber)\
    \ \n```\n\nThis function declaration allows the function addNumbers() to accept\
    \ two pieces of data when it is called. The function definition goes on to declare\
    \ a new variable, Sum, add oneNumber and anotherNumber, and set Sum equal to the\
    \ result. It prints out a sentence that describes the operation performed and\
    \ the result.\n\nWhen addNumbers() is called, the parameters (5 and 3) are introduced:\n\
    \n```\naddNumbers(5,3)\n```\n\nThe parameters 5 and 3 are then sent to the function\
    \ addNumbers(). The parameters become oneNumber and anotherNumber, respectively.\n\
    \n## Predefined Functions\n\nTo make tasks easier for JavaScript programmers,\
    \ several predefined functions have been specified within the scripting language.\n\
    \nThese predefined, or \"top-level,\" functions include eval, isNaN, Number, String,\
    \ parseInt parseFloat, escape, unEscape, taint, and untaint. These functions can\
    \ be executed within any script, without having to define their actions. They\
    \ perform the same actions every time.\n\nTable 4-1 describes the purpose of each\
    \ JavaScript's predefined functions.\n\n| Top Level Function | Syntax | Purpose\
    \ |\n|---|---|---|\n| eval | eval(string) | Used to evaluate a string of JavaScript\
    \ code without referencing a particular object. If the string is JavaScript coding\
    \ it executes it. |\n| isNaN | isNaN(value) | Used to determine if the value is\
    \ not a number (NaN). If the value is a number, it returns a false. |\n| Number\
    \ | Number(object) | Converts an object to a number. Especially useful if you\
    \ want to perform quick calculations on a complex variable. |\n| String | String(object)\
    \ | Similar to the Number Function, except it converts an object to a string.\
    \ |\n| parseFloat and parseInt | parseFloat(string) parseInt(string, [base]) |\
    \ Both attempt to return a numeric value from their accompanying strings. parseFloat\
    \ parses the numbers, while parseInt parses them, converts them to whatever base\
    \ is referenced. |\n| escape and unescape | escape(string) unescape(string) |\
    \ Encodes and decodes whatever string information is provided. |\n| taint and\
    \ untaint | taint untaint | Used for adding and removing data tainting. This prevents\
    \ other scripts from passing secure information. |\n\nTable 4-1: JavaScript predefined\
    \ functions\n"
  mdcn: "\n\n## 第 4 Lesson\nJavaScript 函数\n\n## 课程主题\n\n- 函数\n- 使用函数\n- 预定义函数\n- 课程总结\n\
    \n## 函数\n\n假设你正在编写一个 JavaScript 程序，该程序必须重复执行某些操作，例如将一个变量乘以倍率，然后在结果上加上一个常数。你可以重复编写执行此任务的脚本行，你也可以编写一个函数来完成这项工作。每当你需要执行这一特定任务时，只需引用你创建的函数即可。\n\
    \n函数并不是一个难以理解的概念，但不要让事实误导你低估了它们的价值。函数是大多数 JavaScript 程序不可或缺的一部分。除了显而易见的用途外，函数还让脚本更容易调试，因为它们减少了故障点。\n\
    \n### 什么是函数？\n\n函数是一个你定义了用途的 JavaScript 命令。在你创建一个函数之后，你可以通过名称调用它；随后你与该函数关联的操作将被执行。因此，函数可以被视为一种更强大、更复杂的宏（例如文字处理和电子表格应用程序中使用的宏）。\n\
    \n函数有两个主要用途：\n\n- 节省时间（类似于文字处理或电子表格应用程序中的宏）\n- 使你的程序更容易编辑和阅读\n\n何时应该使用函数？最好的答案是：当你计划在程序内重复执行一个多步骤的操作时。函数允许你只定义一次多步骤操作，然后根据需要多次调用（或执行）它。\n\
    \n函数对于包含服务器端 HTML 的网站也很有用。你可以将函数放置在一个头部文档中，并在整个网站中反复调用它，而无需复制代码。\n\n> 服务器端 HTML（也称为服务器解析的\
    \ HTML）允许你在当前的 HTML 文档中调用另一个 HTML 文档。这些 HTML 文档通常显示文件扩展名（后缀）“.html”，通常由想要在整个网站中使用一致页眉和页脚的设计师使用。\n\
    \n建立一个被调用到你其他站点的独立头部文档，允许你通过只更新一个文档来更新 Logo，或者可能是工具栏（你网站的其他部分将立即更新）。\n\n## 创建函数\n\
    \n要创建一个一个函数：\n\n1. 在 HTML 文档的 `<HEAD>` 部分创建一个 `<SCRIPT>...</SCRIPT>` 块\n2. 使用关键字\
    \ `function`，后面跟函数的名称\n3. 插入一个左大括号 `{`\n4. 定义函数指令\n5. 插入一个右大括号 `}`\n\n### 练习 4-1：使用函数\n\
    \n在你的 HTML 文档中、上一个练习中输入的脚本下方输入以下脚本：\n\n```\n<SCRIPT LANGUAGE=\"JavaScript\">\n\
    function writeText()\n{\ndocument.write(\"<B>This text was written by a function.</B>\"\
    )\n}\n</SCRIPT>\n</HEAD>\n<BODY>\n<h1>This HTML document has a JavaScript function\
    \ in it...</h1>\n<h1>But it isn't called, so it doesn't do anything.</h1>\n```\n\
    \n## 精通 JavaScript - 第一部分\n\n2. 重新保存文件。切换到 Web 浏览器并加载文件。你的浏览器屏幕应该与图 4-1 相似。\n\n\
    图 4-1：在后台创建了一个函数\n\n`writeText()` 函数的完整声明如图 4-2 所示。\n\n```\n<SCRIPT LANGUAGE=\"\
    JavaScript\">\nfunction writeText() {\n  document.write(\"<B>This text was written\
    \ by a function.</B>\");\n}\n</SCRIPT>\n```\n\n图 4-2：函数的结构\n\n上面的代码创建了一个名为 `writeText()`\
    \ 的函数，它会在 HTML 文档中写入 `This text was written by a function.` 这一行。但注意，`writeText()`\
    \ 从未被调用过；文档的 `<BODY>` 中没有一行代码来调用它。\n\n## 使用函数\n\n你现在理解了为什么要创建一个函数以及如何做。那么，你如何让你新创建的函数开始工作呢？调用你定义的函数仅需在\
    \ JavaScript 程序中直接调用函数名。\n\n### 练习 4-2：调用函数\n\n1. 在你的 HTML 文档中、上一个练习中输入的脚本下方输入以下脚本：\n\
    \n```\n<SCRIPT LANGUAGE=\"JavaScript\">\nfunction writeText() {\n  document.write(\"\
    <B>This text was written by a function.</B>\");\n}\n</SCRIPT>\n<HEAD>\n<BODY>\n\
    <h1>This HTML document has a JavaScript function in it...</h1>\n<h1>And it will\
    \ write the next line of text.</h1>\n<SCRIPT LANGUAGE=\"JavaScript\">\n<!-- Start\
    \ hiding from old browsers. -->\nwriteText()\n// Stop hiding from old browsers.\
    \ //\n</SCRIPT>\n<h1>How about that!</h1>\n```\n\n## 精通 JavaScript 第一部分\n\n2.\
    \ 重新保存文件。切换到 Web 浏览器并加载文件。浏览器屏幕应该与图 4-3 相似。\n\n图 4-3：此文档中的某些文本是由函数编写的\n\n该程序中有两段\
    \ JavaScript 代码。第一个与上一个练习中的相同——`writeText()`。第二段 JavaScript 代码只包含一行（除了 `<SCRIPT></SCRIPT>`\
    \ 标签和向旧浏览器隐藏代码的行除外）。\n\n那的一行代码 `writeText()` 调用了 `writeText()` 函数。当程序运行时，`writeText()`\
    \ 中包含的代码行将显示在调用函数的地方，而不是它被创建的地方。\n\n## 向函数传递参数\n\n通常，你希望将数据发送到函数，以便函数对数据执行操作。这被称为传递参数。\n\
    \n### 练习 4-3：传递参数\n\n1. 在你的 HTML 文档中、上一个练习中输入的脚本下方输入以下脚本：\n\n```\n<SCRIPT LANGUAGE=\"\
    JavaScript\">\nfunction addNumbers(oneNumber,anotherNumber)\n{\nvar sum\n = (oneNumber\
    \ + anotherNumber)\ndocument.write(\"The sum of \" + oneNumber + \" and \" + anotherNumber\
    \ + \" is \" + sum + \".\")\n}\n</SCRIPT>\n</HEAD>\n<BODY>\n<H1>The function writes\
    \ text that's sent to it as a parameter:</H1>\n<SCRIPT LANGUAGE=\"JavaScript\"\
    >\n<!-- Start hiding from old browsers.\naddNumbers(5,3)\n// Stop hiding from\
    \ old browsers. -->\n</SCRIPT>\n<H1>How about that!</H1>\n```\n\n2. 保存文件。切换到 Web\
    \ 浏览器并加载文件。你的浏览器屏幕应该与图 4–4 相似。\n\n图 4-4：此程序中的函数被传递了一个参数\n\n在程序程序中，函数 `addNumbers()`\
    \ 使用以下行进行声明：\n\n```\nfunction addNumbers(oneNumber, anotherNumber) \n```\n\n此函数声明允许\
    \ `addNumbers()` 函数在被调用时接受两个数据。函数定义继续声明一个新变量 `Sum`，将 `oneNumber` 和 `anotherNumber`\
    \ 相加并将 `Sum` 设置为结果。它打印出一句描述所执行的操作和结果的句子。\n\n当调用 `addNumbers()` 时，引入了参数（5 和 3）：\n\
    \n```\naddNumbers(5,3)\n```\n\n参数 5 和 3 然后被发送到函数 `addNumbers()`。这些参数分别变成了 `oneNumber`\
    \ 和 `anotherNumber`。\n\n## 预定义函数\n\n为了方便 JavaScript 程序员完成任务，脚本语言内部指定了一些预定义函数。\n\
    \n这些预定义的（或“顶级”）函数包括 `eval`、`isNaN`、`Number`、`String`、`parseInt parseFloat`、`escape`、`unEscape`、`taint`\
    \ 和 `untaint`。这些函数可以在任何脚本中执行，无需定义它们的操作。它们每次执行执行相同的操作。\n\n表 4-1 描述了 JavaScript\
    \ 每个预定义函数的用途。\n\n| 顶级函数 | 语法 | 用途 |\n|---|---|---|\n| eval | eval(string) | 用于在不引用特定对象评估\
    \ JavaScript 代码字符串。如果字符串是 JavaScript 代码，则会执行它。 |\n| isNaN | isNaN(value) | 用于判断值是否不是数字\
    \ (NaN)。如果值是数字，则返回 false。 |\n| Number | Number(object) | 将对象转换为数字。当你想要对复杂变量进行快速计算时，这非常有用。\
    \ |\n| String | String(object) | 与 Number 函数类似，区别在于它将对象转换为字符串。 |\n| parseFloat\
    \ and parseInt | parseFloat(string) parseInt(string, [base]) | 两者都尝试从其随后的字符串中返回数值。parseFloat\
    \ 解析数字，而 parseInt 解析它们并将它们转换为所引用的任何基。 |\n| escape and unescape | escape(string)\
    \ unescape(string) | 编码和解码提供的任何字符串信息。 |\n| taint and untaint | taint untaint |\
    \ 用于添加和移除数据污染。这可以防止其他脚本传递安全信息。 |\n\n表 4-1：JavaScript 预定义函数\n\n"
