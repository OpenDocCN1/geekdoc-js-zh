    # # Assignment Operators


    Assignment operators are operators that give specified values to variables. You
    already know about the most common assignment operator, the equal sign (=). When
    you write Force = (Mass * Acceleration), you are assigning the product of Mass
    and Acceleration to the variable Force.


    JavaScript supports the equal sign—you have used it several times in this course
    already—as well as five "shortcut assignment operators", as shown in Table 3-2.


    | Operation | JavaScript Operator |

    |---|---|

    | Assign value | |= |

    | Plus-assignment | += |

    | Minus-assignment | -= |

    | Multiplication-assignment | *= |

    | Division-assignment | /= |

    | Modulo-assignment | %= |


    Table 3-2: The assignment operators


    The shortcut assignment operators work by performing the shortcut operation on
    the variable to the left of the operator and the variable or value to the right
    of the operator, assigning the result of that operation to the variable on the
    left.


