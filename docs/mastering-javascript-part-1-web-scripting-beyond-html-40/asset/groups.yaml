    \nFigure 5-3: A for loop makes the beers-on-the-wall song faster, if also less\
    \ fun\n\nThe heart of this program rests in a single loop, as follows:\n\n```\n\
    for(i = 99; i > 0 ; (i--))\n{\n...statements that write text...\n}\n```\n\nThe\
    \ index variable, i, starts with a value of 99. For each iteration of the loop,\
    \ i is decremented by 1 with i--. As long as i is greater than 0—that is, for\
    \ iterations 99 through 1—the loop continues to execute. The loop executes 99\
    \ times, writing a verse of the song into the HTML document each time.\n\n## While\
    \ Loops\n\nJavaScript supports another kind of loop—the while loop. A while loop\
    \ repeatedly executes a block of code as long as—”while”—a certain condition is\
    \ true.\n\nThe risk you take with while loops is that it is easier to throw the\
    \ interpreter into what is called an infinite loop—a that never ends and eventually\
    \ crashes the browser (and possibly the operating system). When programming while\
    \ loops, ensure that the condition that ends the while loop does occur under all\
    \ possible starting conditions.\n\n## Syntax\n\nYou learned about the requirements\
    \ of a loop—an index variable, an incrementing mechanism, and so on—when you studied\
    \ the for loop. Each of these key elements also appear in while loops, but in\
    \ a different manner.\n\nJavaScript while loops appear as follows:\n\n```\nwhile\
    \ (condition)\n{\n  ...code that’s executed with each iteration of the loop, including\n\
    \  code that eventually alters the variable(s) in the condition...\n}\n```\n\n\
    Why would you want to use a while loop instead of a for loop? While loops allow\
    \ you more flexibility. You are not limited to a loop that executes a fixed number\
    \ of times.\n\nUnlike for loops, while loops let you vary the manner in which\
    \ the variable(s) in the condition are changed in each iteration of the loop.\n\
    \n## Exercise 5-4: Using while Loops\n\nIn this exercise, you will use a while\
    \ loop.\n\n- 1. Type the following script into your HTML document below the script\
    \ you entered in the previous exercise:\n\n```\n<H1>A <code>while</CODE> loop\
    \ is similar to, but not identical to, a\n<CODE>for</CODE> loop.</H1>\n\n<SCRIPT\
    \ LANGUAGE=\"JavaScript\">\n\n<!-- Start hiding from old browsers. -->\ndocument.write(\"\
    Here's a demonstration of the <CODE>while</CODE> loop.\");\n\nvar index\nindex\
    \ = 1\nwhile (index < 9)\n{\n    document.write(\"<P>I'm Henry the \" + index\
    \ + \" I am, I am.\")\n    index ++\n}\n// Stop hiding from old browsers. -->\n\
    </SCRIPT>\n```\n\nResave the file. Switch applications to your Web browser and\
    \ reload the file. Your browser screen appears similar to Figure 5-4.\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_83_0.png)\n\
    \nFigure 5-4: With the help of a while loop, you create a rendition of an insipid\
    \ song\n\nThe following script shows the while loop that writes the words of the\
    \ song into the HTML document, in full:\n\n```\nwhile (index < 9)\n{\n  document.write(\"\
    <P>I'm Henry the \" + index + \" I am, I am.\")\\n  index++;\n}\n```\n\nNote that\
    \ the variable index, which is initialized to 1 in the line that precedes the\
    \ while loop. Inside the loop, index is incremented by 1 and evently, after the\
    \ eighth iteration, is no longer less than 9. At this point, the code contained\
    \ in the braces no longer executes, and the browser moves on to the code following\
    \ the loop.\n\n## Switch Statements\n\nJavaScript 1.2 (interpreted properly by\
    \ Netscape Navigator 4.0x and more recent and Microsoft Internet Explorer 4.0x\
    \ and more recent) adds more structure to JavaScript. The switch statement serves\
    \ the same purpose as if-else statements, only in more compact syntax.\n\nThe\
    \ switch statement is understood only by Netscape Navigator 4.0 and Microsoft\
    \ Internet Explorer 4.0 and more recent. Therefore, any Web user with an older\
    \ browser that uses switch will get an error.\n\n![](img/0a664f15c7c82f09f80eb4cf9a63fe6a_84_0.png)\n\
    \n## Syntax\n\nAt first glance, switch statements look very complex. With some\
    \ practice, they are not difficult to use. The syntax of the switch statement\
    \ is as follows:\n\n```\nswitch (variable to be evaluated)\n{\n    case x :\n\
    \        code to be executed if the variable to evaluated equals x\n    case y\
    \ :\n        code to be executed if the variable to evaluated equals y\n    default:\n\
    \        code to be executed if variable equals anything other than x or y\n}\n\
    ```\n\nYou can have as many case lines in a switch statement as you wish.\n\n\
    ## Exercise 5-5: Using switch Statements\n\nIn this exercise, you will create\
    \ a script that demonstrates the switch statement.\n\n- 1. Type the following\
    \ script into your HTML document between the closing </TITLE> tag and the closing\
    \ </HEAD> tag:\n\n```\n<SCRIPT LANGUAGE=\"JavaScript1.2\">\n<!-- Start hiding\
    \ from old browsers. -->\nfunction Switcher(InputNumber)\n{\n  var Message\n \
    \ Message = \"test\"\n  switch (InputNumber)\n  {\n    case 1 :\n      Message=\"\
    <BR>One is the loneliest number.\"\n      break\n    case 2 :\n      Message=\"\
    <BR>Two is much better than one.\"\n      break\n    default :\n      Message=\"\
    <BR>Say what?\"\n      break\n  }\n  return Message\n}\n// Stop hiding from old\
