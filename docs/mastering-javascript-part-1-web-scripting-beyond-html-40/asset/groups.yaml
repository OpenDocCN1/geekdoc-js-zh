    - The typeof() operator contains a variable name inside the parentheses. When\
    \ invoked in a program, JavaScript can identify the type of data that variable\
    \ is holding.\n\n## Lesson 3\n### JavaScript Operators\n\n## Lesson Topics\n\n\
    - Mathematical Operators\n- Assignment Operators\n- Comparison Operators\n- Logic\
    \ Operators\n- Lesson Summary\n\n## Mathematical Operators\n\nYou learned about\
    \ mathematical operators in elementary school when you were taught that 1 + 1\
    \ = 2. In a nutshell, operators are special characters, such as + or x, that apply\
    \ a particular function to the values to which they are assigned.\n\nJavaScript\
    \ has many mathematical operators, most of which are already familiar to you.\
    \ The + operator in JavaScript, for example, combines two values, just as it does\
    \ in other contexts.\n\n## Five Mathematical Operators Supported\n\nMathematical\
    \ operators are those that perform a mathematical operation on two numbers. JavaScript\
    \ supports five mathematical operators, as shown in Table 3-1.\n\n| Operation\
    \ | Traditional Operator | JavaScript Operator |\n| --- | --- | --- |\n| Addition\
    \ | + | + |\n| Subtraction | - | - |\n| Multiplication | x | * |\n| Division |\
    \ ÷ | / |\n| Modulo | None | % |\n\nTable 3-1: JavaScript mathematical operators\n\
    \n> What is modulo? It is an arithmetic operation that is rarely used outside\
    \ of computer programming.\n\n> Modulo is simple to understand: the result of\
