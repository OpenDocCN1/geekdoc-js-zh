    \ <CODE>for</CODE> loop!\")\ndocument.write(\"<HR>\")\nvar i\nfor(i = 99; i >\
    \ 0; i--) {\ndocument.write(\"<BR>\" + i + \" bottles of beer on the wall!\")\n\
    document.write(\"<BR>\" + i + \" bottles of beer!\")\ndocument.write(\"<BR>Take\
    \ one down, pass it around!\")\ndocument.write(\"<BR>\" + (i-1) + \" bottles of\
