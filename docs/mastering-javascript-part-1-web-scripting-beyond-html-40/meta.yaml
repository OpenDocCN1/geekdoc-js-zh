  md: '# Lesson 9: Window Control


    ![](bbox=[0.258, 0.087, 0.742, 0.388])


    # ### Figure 9-3: JavaScript e-mail checker


    This script performs two checks on the e-mail address listed in the form. The
    first if statement checks to make sure that the string presented contains an "@"
    symbol and is not less than 3 characters up to that point (many mail-servers will
    reject e-mail addresses that are only 1 character in length, this script is assuring
    that standard).


    The second if statement iterates through the different TLD (top-level domain)
    suffixes (that are acceptable for this script) and tries to match up with one
    of them. It also makes sure the domain name contains at least five characters:
    the TLD plus the "." and the domain (which can be as short as 1 character such
    as "a.com\). Together, the script requires at least two character prefix, the
    "@" symbol and at least a 5 character suffix.


    > > One problem with this code is that it is very United States centric. Other
    countries obviously have their own domain name system, and—because the Internet
    is worldwide—this would preclude someone with a domain name ending in .UK or .AU,
    for example, from submitting the form.


    There are two possible ways around this:


    +   1. create an array with every possible Top Level Domain listed in it (this
    would create bulky code, however)

    2. modify the code to search for a suffix that is two or three characters in length
    (this would be less accurate, but efficient enough for most applications)


    DDC Publishing • www.ddcpub.com


