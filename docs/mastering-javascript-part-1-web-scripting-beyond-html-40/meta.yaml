  md: "# For Loops\n\nComputers excel at efficiently performing repetitive actions.\
    \ It would be inefficient to manually calculate the results of plugging 1,000\
    \ different values into a function, but you can write a JavaScript program that\
    \ does the job for you in a fraction of the time a hand calculation would require.\n\
    \nWriting such a program is especially easy if the 1,000 values represent a type\
    \ of definable series, as the numbers between 1 and 1,000 or the whole numbers\
    \ between 5 and 5,000 that are evenly divisible by 2.5.\n\nJavaScript's mechanism\
    \ for performing such repetitive tasks is the for. In this section, you will learn\
    \ how to create for loops and get an idea of how for loops can be used in real-life\
    \ JavaScript programs.\n\n# Syntax\n\nIn a loop, you must specify several elements:\n\
    \n+   - an index variable;\n- the condition of the index variable at the start\
    \ of the loop's execution;\n- the condition of the index variable at the end of\
    \ the loop's execution;\n- the way the index variable is changed at the start\
    \ of each iteration of the loop;\n- the code that executes during each iteration\
    \ of the loop.\n\nThe JavaScript syntax for declaring a loop appears as follows:\n\
    \n```\nfor(initial condition ; test ; increment)\n{\n  code that is executed during\
    \ each iteration of the loop\n}\n```"
  merge: -1
  pgno: 77
- img_proc: false
  md: 'The initial condition is the value of the index variable (usually named i,
    Index, index or n) at the start of the loop—the statement actually sets the value
    of the variable. It is typically something like n=0 or i=1.


    The test is a logical statement that is evaluated at the beginning of each iteration
    of the loop. If the test evaluates to true, the loop executes again. If the test
    evaluates to false, the loop stops executing. Usually, the test involves the index
    variable. The test is often something like (n<=100) or ((n>0) && (m=100)).


    The increment statement defines how the index variable changes at the start of
    each iteration of the loop. Typically, the increment adds to or subtracts from
    the index variable. The statements i++ and (n=n+100) are common increment statements.


    ![](bbox=[0.153, 0.378, 0.215, 0.442])


    The script contained in the braces is executed each time the loop iterates. Executing
    the script quickly and efficiently multiple times is the purpose of a loop.'
  merge: -1
