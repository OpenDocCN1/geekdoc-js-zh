  md: "# Alerts!\n\n**JavaScript is often used to control browser windows.** It is\
    \ a very common form of JavaScript because, unlike plain HTML, JavaScript allows\
    \ you to control aspects of the browser size and characteristics that you open.\
    \ Many programmers use JavaScript-generated browser windows to add emphasis and\
    \ a dynamic element to their site. JavaScript allows you to manipulate frames\
    \ in ways HTML simply does not.\n\n# The alert() Tag\n\nAn alert is a quick message\
    \ sent by a Web browser to the user that informs the user that 1) something is\
    \ wrong or 2) provides information regarding the site to the user. You can create\
    \ your own alerts within a page using the `alert()` method. The `alert()` method\
    \ prints (displays to the user) in the form of an alert window whatever you type\
    \ in the parentheses section of the alert.\n\nAn example of such an alert window\
    \ is shown in Figure 9-1 on the following page. This is relatively simple, but\
    \ an excellent introduction to some of the more complicated window controlling\
    \ power of JavaScript.\n\n# Exercise 9-1: Creating an Alert Window\n\n+   1. Type\
    \ the following script into an HTML document:\n\n```\n<HEAD>\n<SCRIPT LANGUAGE=\"\
    JavaScript\">\n<!--Start hiding from old browsers\nfunction hello() {\n  alert\
    \ (\"Welcome to my Page!\");\n}\n// Stop hiding from old browsers -->\n</SCRIPT>\n\
    <BODY onload=\"hello\">\n<h1>Glad to see you</h1>\n</BODY>\n</HTML>\n```\n\n+\
    \   2. Resave the file. Switch applications to your Web browser and reload the\
    \ file. Your browser screen should appear similar to Figure 9-1 on the following\
    \ page."
  merge: -1
  pgno: 143
- img_proc: false
  md: "# Glad to see you\n\n![](bbox=[0.277, 0.075, 0.722, 0.305])\n\nThe event handler\
    \ `onload` is used in the `<body>` tag of this document to display the alert window\
    \ after the document finishes loading. You can also use the event handler `onunload`\
    \ to execute a function as the viewer exits a page.\n\nAs discussed in this first\
    \ Lesson of course, `JavaScript` is case sensitive. This is especially important\
    \ when dealing with event handlers. `Onload` (as used in the previous script)\
    \ and `onload` have very different meanings. Both are used as event handlers:\
    \ `Onload` is used to define the handler, `onload` is used to *reference* the\
    \ handler. For example, examine the code in Figure 9-2.\n\n```\n<script language=\"\
    JavaScript\">\nfunction fn() {\n  // some function\n}\n</script>\n\n<body onload=\"\
    fn()\">\n<script>\ndocument.onload=fn\n</script>\n```\n\nFigure 9-2: Distinguishing\
    \ between onload and onload\n\nThe handler `fn` is positioned within the function\
    \ statement and is defined by the `onload` statement in the `<body>` tag. In other\
    \ words, the function is turned into an action because the `<body>` tag instructs\
    \ the browser to execute it when the pages finishes loading. Finally, it is referenced\
    \ within the HTML document using the `onload` command.\n\nAlert boxes are useful\
    \ for sending messages to users, but they are not the most visually appealing\
    \ way of communicating with a user. Typically, alerts are used to warn a user\
    \ of missed or important information. An example of this is provided in the next\
    \ exercise."
  merge: -1
