  md: '# Inserting the Date and Time


    Many Web developers desire to display the current time and/or date on their Web
    site. Some sites go as far as to include a clock widget. Doing this helps promote
    the impression that your site is fresh and its content current (although this
    is often not the case).


    JavaScript uses the Date object to specify the date and time within an HTML page.
    Date returns a string, which includes the local date and time. The Date object
    is a similar format to the Date and the C programming language Date data type.


    The Date object has the following characteristics:


    +   - Dates are stored as the number of milliseconds since January 1, 1970: 00:00:00

    - The range of dates supported by JavaScript is from 100,000,000 days before January
    1, 1970 to 100,000,000 days after.

    - JavaScript formats the date as Month Date, Year Hours:Minutes:Seconds. If hours,
    minutes or seconds are left blank JavaScript assumes 0 and bypasses that the server.
    So, the time always appears local to the user.

    - The JavaScript date object retrieves its information from the local computer,
    not the server. So, the time always appears local to the user.


    The two most common methods used to call the Date object are get and set. get
    is used to retrieve the date or time from a Date object, set is used to tell a
    date object what the date or time is. You cannot get or set to change the time
    on a user''s computer; you can only use these methods to manipulate the date or
    time within a script.'
  merge: -1
