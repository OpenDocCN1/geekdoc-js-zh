  md: '# Event Handlers & Basic Form Elements


    Computer programs that operate from a command line (such as DOS) need react only
    to the text users. Graphical programs are significantly more complex because the
    user has so many options using both a keyboard and a pointing device (mouse, trackball,
    etc.).


    In a single form, a user might click any of a dozen buttons, selecting something
    from a selection list, or click one of several radio buttons or check boxes. Anticipating
    and programming for such a multitude of possible events is a daunting task.


    # Event Handlers


    JavaScript makes the task of creating graphical programs easier with event handlers.
    Event handlers are pieces of code that you attach to elements—typically form elements.
    An event handler watches for a certain event, such as a mouse click.


    > When the event occurs, the event handler "trips" and calls a JavaScript function
    that performs a particular function. You had a glimpse of event handlers in the
    previous Lesson; you will be exposed to them in depth in this Lesson.


    # Focus


    Before working with events, you need to understand the concept of focus as it
    applies to graphical user interfaces (GUIs). Focus is the state of a form element
    that has been selected, often by a user moving the cursor by pressing the <TAB>
    key or clicking the mouse. Only one screen element may have focus at a given time.


    ![](bbox=[0.173, 0.581, 0.253, 0.636])


    Only one screen element may have focus at a given time.


    Windows displays a dotted line (called a marquee) around the element that currently
    has focus. Elements that do not have focus are said to be blurred.


    Buttons—general purpose as well as special purpose—can take three event handlers:


    +   - onClick: trips when a user clicks a button.

    - onFocus: trips when a user gives a button focus.

    - onBlur: trips when a button loses focus.'
