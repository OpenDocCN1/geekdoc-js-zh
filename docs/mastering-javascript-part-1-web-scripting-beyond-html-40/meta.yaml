    >\n<!-- Start hiding from old browsers. -->\nfunction Switcher(InputNumber)\n\
    {\n var Message\nMessage = \"test\"\nswitch (InputNumber)\n{\n case 1 :\n Message=\"\
    <BR>One is the loneliest number.\"\n break\n case 2 :\n Message=\"<BR>Two is much\
