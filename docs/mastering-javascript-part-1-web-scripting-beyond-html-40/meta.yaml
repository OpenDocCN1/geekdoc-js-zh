  md: '# Lesson 8: Event Handlers


    ![](bbox=[0.175, 0.076, 0.824, 0.375])


    Figure 8-1: Buttons have three event handlers


    Event handlers appear in the HTML declarations of each of the buttons. The declaration
    for Button Two is typical:


    ```

    <INPUT TYPE="BUTTON" NAME="Button2" Value="Two"

    OnClick="ClickDisplay(2)"

    Focus="FocusDisplay(2)"

    Blur="BlurDisplay(2)">

    ```


    The above declaration example states: when the onClick handler is tripped, the
    function ClickDisplay() is called with parameter 2. It also specifies functions
    to call when the onFocus and onBlur handlers are tripped. To see this program
    function, click various buttons and watch the corresponding results in each of
    the text fields.


    ![](bbox=[0.151, 0.715, 0.203, 0.769])


    Like buttons, radio buttons and check boxes all support three event handlers.
    They are:


    +   - onClick: Trips when a user clicks the check box or radio button.

    - onFocus: Trips when a user gives focus to the check box or radio button.

    - onBlur: Trips when a check box or radio button loses focus.


    DDC Publishing • www.ddcpub.com 115'
