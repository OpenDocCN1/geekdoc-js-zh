  md: '# Logic Operators


    Logic operators become useful when you need to determine which of several conditions
    are true. By joining several conditions with AND or OR operators, you can determine
    what is happening with a given set of variables.


    There are three logic operators, shown in Table 3–4.


    | Operator | JavaScript Operator |

    | --- | --- |

    | AND | && |

    | OR | \|\| |

    | NOT | ! |


    Table 3-4: JavaScript logical operators


    How do you type the | character? It is the SHIFT function of the key just above
    the <ENTER> key on most keyboards.


    # How to Use Logical Operators


    Logical operators are used to join two statements that result in one of two Boolean
    values (true or false). The values returned by the logical operators depend upon
    how many values surrounding them are true.


    +   - A && statement will return true only if both the values surrounding it are
    true.

    - A || ! statement will return true if either of the values surrounding it is
    true.

    - The ! operator is a type of negation for Boolean values—it turns true values
    into false values and vice-versa.'
