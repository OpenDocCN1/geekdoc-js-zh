  md: '# Understanding Data Types


    There are several types of data you can assign to variables. The types of variable
    data JavaScript can interpret:


    +   - **number**: Numbers are values, such as 5, 12,908, or -12,345.

    - **string**: Strings are sequences of characters, such as "I consider myself
    the luckiest man on the face of earth." Strings must be enclosed in quotation
    marks to be properly recognized by JavaScript.

    - **Boolean**: Boolean values are true/false statements.


    # Data Types & Dynamic Typing


    Many programming languages force you to determine the type of data a variable
    will contain when you declare the variable, then restrict you to that data type.
    In inflexible languages, if you configure a variable to contain numbers and then
    to assign a string to it, you receive an error.


    Fortunately, JavaScript is much more accommodating. After you declare a variable,
    you can assign any type of data to it. This is called dynamic typing (also known
    as flexible typing).


    # String Concatenation


    String concatenation is the method used to assemble short strings into a longer
    string, using the + operator. Imagine we have two strings, one containing "Romeo"
    and another containing "Juliet". To join these two strings into a bigger string:


    ```

    "Romeo" + "and Juliet" = "Romeo and Juliet"

    ```


    Note that there is an extra space following Romeo—without the additional space,
    the strings run together, as follows:


    ```

    "Romeo" + "and Juliet" = "Romeoand Juliet"

    ```


    You can do the same thing with the contents of variables:


    ```

    var eightBall = "Romeo "

    tenBall = "and Juliet"

    cueBall = eightBall + tenBall

    ```


    At the end of that sequence, cueBall contains:


    +   - "Romeo and Juliet"'
