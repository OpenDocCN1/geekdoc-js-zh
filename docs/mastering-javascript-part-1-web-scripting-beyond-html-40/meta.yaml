  md: '# Appendix B: JavaScript Glossary


    Arithmetic operator

    Any of the following symbols: *, +, -, / (divide), % (modulus), ++ (increment),
    --

    (decrement), or - (negation). Arithmetic operators are used with variables or
    numeric values in an

    expression to yield a mathematical result.


    Array

    An object with a list of properties. In an array, the properties are named in
    numerical sequence, as in:

    arrayname[0], arrayname[1], and so on.


    Assignment

    Refers to a value to a variable name.


    Assignment

    The act of referring a value to a variable name; for example, purchases = 10.


    Assignment operator

    One of the following symbols: =, +=, -=, *=, /, %=. All will will the indicated
    arithmetic

    to operation to the current variable value and its assigned value.


    Assignment statement

    A complete syntactic construction of assignment: purchases+=(mugs*orders);


    Bug

    An error in a computer program. See debug.


    Call

    The act of instructing JavaScript to execute a particular function.


    Case-insensitive

    In a case-insensitive language or operating system, the computer makes no distinction
    between lower-

    and uppercase letters, considering them equivalent. Thus, "cat" is interpreted
    the same as "Cat" or

    "CAT".


    Case-sensitive

    In a case-sensitive language or operating system, the computer distinguishes between
    lower-

    and uppercase letters, considering them different characters. Thus, "input" is
    a different term from "Input"

    or "INPUT.".


    Clause

    A portion of a JavaScript statement. For example, within the if...else statement,
    either just the

    if or just the else portion is a clause.


    Command

    Any term or phrase that is part of an operating system, programming language,
    scripting language, or

    or standardized set of commands that instructs a computer to perform a specific
    task or operation.


    Comment-out

    To insert comment symbols into code or script. In the case of JavaScript, script
    that is commented-out

    is not executed by a Web browser.'
