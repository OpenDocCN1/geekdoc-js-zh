  md: '# Special Form-Referencing Procedures


    Some HTML form elements require special procedures to identify the value that
    a user has selected. Selection lists and groups of radio buttons require special
    attention.


    # References to Radio Button Groups


    Groups of radio buttons exist—from the perspective of a Web browser—as arrays.
    To determine which radio button in a group a user has selected, you need to use
    a for loop that examines the contents of the array (the individual radio buttons)
    one at a time.


    # Exercise 7-3: Referring to Radio Button Groups


    +   1. Open a new document in your text editor.

    2. Type the following script into the new HTML document.


    ```

    <HTML>

    <HEAD>

    <TITLE>Referring to Radio Button Groups</TITLE>

    <SCRIPT LANGUAGE="JavaScript">

    <!-- Start hiding from old browsers.

    function Identify()

    {

    var SelectedValue

    var i

    var GroupSize

    GroupSize = document.DemoForm.RadioGroup.length

    for (i=0; i<=GroupSize; i++)

    {

    if (document.DemoForm.RadioGroup[i].checked)

    {

    SelectedValue = document.DemoForm.RadioGroup[i].value

    break

    }

    }

    ```'
