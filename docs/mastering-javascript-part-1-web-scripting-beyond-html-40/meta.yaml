  md: "# While Loops\n\nJavaScript supports another kind of loop—the while loop. A\
    \ while loop repeatedly executes a block of code as long as—”while”—a certain\
    \ condition is true.\n\nThe risk you take with while loops is that it is easier\
    \ to throw the interpreter into what is called an infinite loop that never ends\
    \ and eventually crashes the browser (and possibly the operating system). When\
    \ programming while loops, ensure that the condition that ends the while loop\
    \ does occur under all possible starting conditions.\n\n# Syntax\n\nYou learned\
    \ about the requirements of a loop—an index variable, an incrementing mechanism,\
    \ and so on—when you studied the for loop. Each of these key elements also appear\
    \ in while loops, but in a different manner. \n\nJavaScript while loops appear\
    \ as follows:\n\n```\nwhile (condition)\n{\n  ...code that’s executed with each\
    \ iteration of the loop,\n  code that eventually alters the variable(s) in the\
    \ condition...\n}\n```\n\nWhy would you want to use a while loop instead of a\
    \ for loop? While loops allow you more flexibility. You are not limited to a loop\
    \ that executes a fixed number of times.\n\nUnlike for loops, while loops let\
