  md: '# If & If...Else Statements


    Imagine you are a spectator at a baseball game. It is hot and you are thirsty.
    You look around to see the vendor of your favorite beverage is nearby. If he is,
    you will signal to him that you wish to make a purchase. If a vendor is not nearby,
    you will resign yourself to thirst and wait until one passes your seat.


    This is an example of an if statement. If the vendor is nearby, you will try to
    get your attention. Otherwise, you will do nothing.


    Now, assume you are a baseball player. You are coming up to bat. As you walk up
    to the field, you evaluate the situation on the field. If there is a runner on
    second base (and if there are fewer than two outs, and if you have trouble hitting
    against the current pitcher, and if the base coach signals you to do so... and
    so forth), you will bunt to help the runner advance to third. Otherwise, you will
    swing and attempt to get a base hit.


    This is an example of an if...else statement. If the conditions are right for
    a bunt, you will attempt to bunt. If the conditions are not right for a bunt,
    you will swing and try to get a hit.


    ![](bbox=[0.168, 0.448, 0.243, 0.477])


    Is the first example an if...else statement, too? Not really, because the action
    you would take if the vendor was not nearby is nothing at all. An if statement
    becomes an if...else statement only if you want to take some kind of positive
    action in the event that the "if" conditions are not true. After all, the batter
    would not just stand there if the conditions were right for a bunt—he would swing.


    JavaScript supports both if and if...else statements; you will find them useful
    in the future when you write your own JavaScript programs.'
  merge: -1
  pgno: 71
- img_proc: false
  md: "# Syntax\n\nJavaScript if and if...else statements have a logical syntax.\n\
    \n# Example of an if Statement\n\n```\nif (condition)\n{\n    code to execute\
    \ only if condition is true\n}\n```\n\nIn the previous example, the code between\
    \ the braces executes only when the condition in the parentheses is true. In the\
    \ event that the condition is false, the interpreter skips the contents of the\
    \ braces and picks up with the first line of script after them.\n\nAn if...else\
    \ statement is different in that it specifies a task for the interpreter if the\
    \ condition is false.\n\n# Example of an if...else Statement\n\n```\nif (condition)\n\
    {\n    code to execute only if condition is true\n}\nelse\n{\n    code to execute\
    \ only if condition is false\n}\n```\n\nThe first part of an if...else statement\
    \ is identical to an if statement—the code in the braces after the if executes\
    \ only in the event that the condition specified in the parentheses is true. However,\
    \ in an if...else statement, the code contained in the braces that follow the\
    \ else line execute if (and only if) the condition is false."
  merge: -1
