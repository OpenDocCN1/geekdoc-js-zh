  md: '# Mastering JavaScript—Part 1


    # Functions


    Assume you are writing a JavaScript program that must repeatedly perform action,
    such as multiplying a variable by a ratio and then adding a constant to the result.
    You can either repeatedly write lines of script that perform this task, or you
    can write a function that does the job. Whenever you need to perform this particular
    task, you can simply refer to the function you created.


    Functions are not a difficult concept to comprehend, but do not let fact fool
    you into underestimating their value. Functions are an integral part of most JavaScript
    programs. In addition to their obvious utility, functions make scripts easier
    to debug because they reduce the number of points of failure.


    # What is a Function?


    A function is a JavaScript command for which you define a purpose. After you create
    a function, you can invoke it by name; then the actions you have associated with
    that function will be performed. Thus, a function can be thought of as a more
    powerful and complex macro (such as those used in word processing and spreadsheet
    applications).


    Functions serve two primary purposes:


    +   * save time (similar to a macro in a word processing or spreadsheet application)

    * make your programs easier to edit and read


    When should you use a function? The best answer: anytime you plan to perform a
    multi-step action repeatedly within a program. Functions allow you to define a
    multi-step action once and then invoke, or call, as many times as needed.


    Functions are also useful for Web sites that contain server-side HTML. You can
    place a function within a header document and call it repeatedly throughout the
    site, without having to replicate the code.


    ![](bbox=[0.173, 0.723, 0.285, 0.755])


    > Server-side HTML, also known as parsed HTML, allows you to call another HTML
    document within your current HTML document. These documents generally display
    the file name extension (suffix) “.html” and are most used by designers who want
    to use consistent headers and footers throughout a Web site.


    Establishing a separate header document that is called into your other sites allows
    you to update a logo, or perhaps a toolbar, by updating one document (the rest
    of your site is instantly updated).


    46 DDC Publishing • www.ddcpub.com'
