  md: 'Mastering JavaScript: Part 1


    # Course Description


    Welcome to DDC Publishing''s Mastering JavaScript: Part 1. This course introduces
    you to JavaScript, a powerful scripting language that you can use to add functionality
    and interactivity to Web pages. This course is intended for students who are experienced
    and proficient with HTML. Programming experience is not required for this course.
    This course is designed as a prerequisite for Mastering JavaScript: Part 2.


    # Prerequisites


    +   - DDC Publishing''s HTML 4.0 Fundamentals

    - DDC Publishing''s HTML 4.0 Intermediate


    # Course Objectives


    +   - How JavaScript compares to Java.

    - What objects are and how they work in JavaScript.

    - How JavaScript stores values in variables.

    - Proper use of JavaScript data types.

    - How to declare variables.

    - Using loose typing.

    - How to use the typeof() operator.


    # Software Required For This Course


    To get the most out of the interactive features of this book, you will need two
    software applications:


    +   - A text editor: you will write JavaScript code, like HTML code, in a text
    editor. All computers running Microsoft Windows have a text-editing application
    called Notepad. If you prefer another application for editing HTML, you can use
    it to edit JavaScript also.

    - A JavaScript-aware web browser: in order to run your JavaScript code, you will
    need a Web browser that can interpret JavaScript 1.2, such as Netscape Navigator
    4.0 or later or Microsoft Internet Explorer 4.0 or later. All code presented in
    this course was tested using Netscape Navigator 4.0.'
