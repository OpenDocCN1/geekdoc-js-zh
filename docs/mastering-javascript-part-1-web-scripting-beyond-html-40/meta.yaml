  md: '# JavaScript Defined


    JavaScript is one of many tools used by a skilled Web page/site developer. With
    JavaScript, you can make Web pages more attractive and more interactive. JavaScript,
    because it is a scripting language, is much simpler than a programming language
    (such as Java or C++). With some diligent user, you can master JavaScript, even
    if you have no computer experience.


    JavaScript performs tasks—relatively simple ones, compared to what can be done
    with Java applets or ActiveX Controls—in HTML documents that are loaded into Web
    browsers.


    JavaScript excels at the following tasks:


    +   - performing data-lookup in small databases

    - validating data before it is sent to a server

    - reacting intelligently to a user''s actions

    - manipulating the contents of multiple browser windows

    - manipulating the contents of multiple Web page frames


    # Tight HTML Integration


    JavaScript is tightly integrated with HTML. Think of JavaScript as HTML on steroids.
    In fact, you will see that JavaScript code is actually embedded within HTML documents.
    Because you already have a solid familiarity with HTML, documents that contain
    JavaScript will appear familiar to you.


    # Most Popular Scripting Language


    JavaScript''s tight integration with HTML has caused it to quickly become the
    most popular scripting language (other than HTML) on the Web. One source estimates
    that there are in excess of four million Web pages that utilize JavaScript, making
    it more common than VB and even the venerable Internet workhorse, Perl.


    ![](bbox=[0.173, 0.788, 0.265, 0.828])


    A technical advantage of JavaScript is that it executes all programming instructions
    on the client computer—that is, in the Web browser—not on the server. JavaScript
    programs do not refer to a server after the Web page containing them is downloaded,
    and therefore do not put additional demands on the server or create a bandwidth
    burden for the user.'
  merge: -1
  pgno: 15
- img_proc: false
  md: '# Server Side JavaScript


    JavaScript has traditionally been used as a client-side scripting language. This
    has many advantages, such as not having to be concerned about server load or the
    use of available server bandwidth. This makes JavaScript code less taxing on servers
    and quicker to execute within a client computer (for a user).


    Unfortunately, these JavaScript characteristics also limit the types of scripts
    that can be executed. Anything that relies heavily on the server to execute, such
    as e-mail delivery or database queries, cannot be executed via client-side scripting.


    # Advantages of Server-Side JavaScript


    Netscape, in an attempt to overcome the limitations of JavaScript''s client-side
    scripting, has released Server-Side JavaScript (SSJS). SSJS incorporates all of
    the elements of core (client-side) JavaScript, but adds the advantages of a server-side
    scripting language. SSJS introduces additional objects to the JavaScript code
    that allow you to:


    +   - send e-mail through a server

    - query a database

    - provide other functionality that involves server interaction


    Currently, SSJS is only available with Netscape Enterprise Server. Because Netscape
    Enterprise Server is installed in only the minority of the Web server market,
    this course does not cover SSJS. However, as SSJS is incorporated into more servers
    and applications, you will hear more about it.


    More details regarding SSJS will be integrated into future releases of and updates
    to the Mastering JavaScript series as appropriate.


    ![](bbox=[0.168, 0.663, 0.226, 0.715])'
  merge: -1
  pgno: 16
- img_proc: false
  md: '# JavaScript vs. Java


    Those new to Web programming often make the mistake of confusing JavaScript with
    Java. The similarity in names, Java and JavaScript are very different (and really
    should not share the same root name). Java is a complex object-oriented programming
    language, similar to C++. Large, complex applications can be created with Java.


    Figure 1-1 shows a Java applet (which, in turn, launches Java applications) at
    the TalkCity Web site.


    ![](bbox=[0.21, 0.265, 0.78, 0.64])


    Figure 1-1: Java applets are more complex than JavaScript programs'
  merge: -1
