  md: '# Mastering JavaScript Part 1


    # Comments


    Author-entered descriptions in program code or script intended for human programmers
    to read, JavaScript interpretation by a Web browser.


    # Comparison operator


    One of the following symbols: !=, <, >=, ==, or !=!; Returns a value of true if
    the comparison is valid; otherwise, it returns a value of false.


    # Concatenate


    The combination of multiple script or code strings into a single longer string.
    For example, "I" + "downloaded" + "the" + "file", when concatenated, yields "I
    downloaded the file".


    # Conditional statement


    A JavaScript statement that directs program flow based on the validity or invalidity
    of a comparison. Examples include if...else and while.


    # Constant


    A variable that is assigned a value that is never intended to change.


    # Debug


    The act of attempting to track down errors or design flaws in a program.


    # Define


    In JavaScript, to describe the name, parameters, and statements of a function.


    # Definition


    In JavaScript, the name, parameters, and statements that make up a function.


    # Document object


    The JavaScript object that contains properties and methods relevant to the HTML
    document. it includes colors, anchors, links, and form elements.


    # Element


    A screen element is any widget on the computer screen. A form element is one portion
    of an HTML form, such as a text box, a checkbox, a radio button, a submit button,
    or a selection box.


    # Embed


    To insert into a text file. JavaScript programs are embedded into HTML files.


    # Empty string


    A variable that contains no value. Empty strings can be created with the assignment
    stringname="


    # Error


    An illegal or incorrect statement in a JavaScript program that a Web browser cannot
    interpret.


    # Event


    When a user performs some action that JavaScript recognizes, such as a mouse click
    on a particular screen element.


    # Event handler


    A JavaScript structure that responds to (handles) a particular event or response
    by the user of the browser. Event handlers are identified by special HTML attributes.'
  merge: -1
  pgno: 159
- img_proc: false
  md: '# Appendix B: JavaScript Glossary


    # False


    The value returned by a Boolean comparison operation if the comparison is invalid.


    # Focus


    When a user clicks a form element and it becomes "active" for interaction.


    # Function


    A collection of JavaScript statements that perform a particular operation. Also
    called a *method*.


    # Function call


    When JavaScript is instructed to execute a named and defined function. Occurs
    in the form **functionname (parameters)**.


    # Increment


    To increase the value of a variable, typically by 1.


    # Initialize


    To assign a starting value to a variable, typically by 0.


    # Iteration


    One sweep through a program loop.


    # Java


    A programming language that extends the Web to handle the distribution of interactive
    content: video, audio, multimedia, and so on. Java programs are called *applets*
    and run within a Java-enabled browser.


    # JavaScript


    An English-like scripting language devised by Netscape Communications Corp. and
    Sun Microsystems, Inc. that supports much of Java''s capabilities but does not
    require extended knowledge.


    # Keyword


    Any one word that JavaScript recognizes as having meaning, such as **if**, **then**,
    **var**, **new**, **etc.**


    # LiveScript


    The scripting language developed by Netscape Communications Corp. that was the
    predecessor to JavaScript.


    # Logical operator


    Any of the following: **&&** & (AND), **||** (OR), **!** (NOT). Used in conditional
    expressions; returns a value of true or false. Also known as *Boolean operators*.


    # Loop


    A section of program code that is executed in repetition until some condition
    changes.


    # Method


    A function that is a property of a JavaScript object.


    # Modulo


    The %** operator.


    # Modulus


    The result of the modulo (%) operator, which returns the remainder of a division
    operation. Thus, **10%3 = modulo 1**.'
  merge: -1
  pgno: 160
- img_proc: false
  md: '# Mastering JavaScript: Part 1


    # Nested


    When a statement is used as part of another statement. For example, were the if
    clause of a statement another `if...else` statement, these would be nested. Also,
    when bookending symbols, such as brackets {} or parentheses (), are used within
    one another.


    # Operand


    A variable or value used in an operator expression. For example, in the expression
    orders*10, both orders and 10 are operands.


    # Parameter


    Additional information that is passed to a Java applet or a JavaScript function.
    Parameters supply applets and functions with information they need to complete
    their task.


    # Return


    A keyword that is used to return a value at the conclusion of a JavaScript function.
    This value is assigned to a variable if the function was called in an assignment;
    for example, `result=functionname();`


    # Script


    A series of program statements that instruct a computer how to accomplish a task.


    # Scripting language


    The set of rules and keywords that comprise a functional script. Same as a programming
    language, except scripting languages are traditionally less strict and simpler
    to learn.


    # Statement


    A JavaScript construction that typically affects program flow. Loops and conditionals,
    such as `for` and `if...else`, are statements.


    # String


    A value that consists of a series of alphanumeric characters, enclosed in quotation
    marks.


    # Syntax


    The grammatical and logical rules of a programming or scripting language.


    # True


    The value returned from a Boolean comparison operation if the comparison is valid.


    # Unary


    An operator that takes only a single operand; for example `++` (increment), `--`
    (decrement), and `-` (negate).


    # Value


    Some form of data. A numeric value is a number. A string value is a string. Either
    can be assigned to a variable. A literal value is a specific number of string
    explicitly stated, not assigned to a variable.'
  merge: -1
