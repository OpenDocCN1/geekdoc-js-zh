  md: '# Frames


    In DDC Publishing''s HTML 4.0 Intermediate, you learned about frame construction
    and layout. JavaScript allows you to further enhance your framed pages. You can
    use JavaScript to establish properties for the windows within a frame, or to call
    them through an array.


    Assume you have a four-windowed frameset. You could script code similar to that
    displayed in Figure 9-6.


    ```

    <FRAMESET COLS="25%,25%,25%,25%">

    <FRAME SRC="frame1.html" NAME="frameone">

    <FRAME SRC="frame2.html" NAME="frametwo">

    <FRAME SRC="frame3.html" NAME="frametree">

    <FRAME SRC="frame4.html" NAME="framefour">

    </FRAMESET>

    ```


    **Figure 9-6: Four-way frameset**


    Within JavaScript, you can refer to the windows through an array, such as that
    shown below:


    +   - Frameone is top.frames[0]

    - Frametwo is top.frames[1]

    - Frametree is top.frames[2]

    - Framefour is top.frames[3]


    You can now refer to the various windows by invoking their name with a <LOCATION>
    tag.'
  merge: -1
