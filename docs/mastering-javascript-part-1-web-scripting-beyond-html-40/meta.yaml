  md: "# The Array Method\n\nThere is another way to refer to forms in an HTML document\
    \ and the elements that populate any form(s) within a document. It is called the\
    \ array method. Although it is less intuitive the name method, it is helpful when\
    \ you need to write a routine that refers to the elements in a form automatically.\n\
    \nA Web browser's JavaScript interpreter keeps track of the forms in a document\
    \ within a list. The list is called an array. The first form in a document takes\
    \ the first position in the array and is indexed as 0 (arrays starting from 0).\
    \ The second form in a document is entered into the array as number 1, and so\
    \ forth. The array in which the forms in a document is listed forms.\n\nThe same\
    \ numbering scheme applies to elements within a form. The first element is entered\
    \ into the array (called elements) as number 0, the second as number 1, and so\
    \ forth.\n\n> The forms and form elements appear in their arrays in the order\
    \ they appear in the HTML code: top to bottom and left to right, in that order.\n\
    \n# Exercise 7-2: Referring to Form Elements by Array Position\n\n+   1. Open\
    \ a new document in your text editor.\n\n+   2. Type the following script into\
    \ the new HTML HTML document:\n\n```\n<HTML>\n<HEAD>\n<TITLE>Referring to Form\
    \ Elements by Array Position</TITLE>\n<SCRIPT LANGUAGE=\"JavaScript\">\n<!-- Start\
    \ hiding from old browsers.\nfunction Copy()\n{\n  document.forms[0].elements[2].value\
    \ =\n  document.forms[0].elements[0].value\n}\n// Stop hiding from old browsers.\
    \ --\n</SCRIPT>\n```"
