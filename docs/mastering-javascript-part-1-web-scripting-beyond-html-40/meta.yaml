  md: '# Variables


    Remember your first algebra class, when you learned about variables? You learned
    that a letter, as x, could represent any numerical value. You might have thought
    of variables as containers that held some unknown or variable value.


    JavaScript, like algebra, involves variables. Think of JavaScript variables as
    named containers that hold values. JavaScript variables are not limited to holding
    numeric values, however.


    JavaScript variables can hold:


    +   - passages of text (or strings)

    - true/false values (Boolean values)

    - numbers


    # Exercise 2-1: Declaring Variables


    +   1. Type the following script into your HTML document below the script you
    entered in the previous exercise:


    <H1>This program adds some numbers after declaring variables.</H1>

    <SCRIPT LANGUAGE="JavaScript">

    <!-- Start hiding from old browsers.

    // Declaring a variable with var.

    var milk

    milk = 5

    // Declaring a variable without var.

    cookies = 10

    //Declaring with var again.

    var snack = milk + cookies

    document.write(snack)

    // Stop hiding from old browsers. -->

    </SCRIPT>

    <H1>That''s variable declaration.</H1>'
