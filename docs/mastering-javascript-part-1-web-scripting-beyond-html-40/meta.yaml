  md: "# Opening and Closing Windows\n\nJavaScript includes event handlers for opening\
    \ and closing windows. Similar to the <TARGET> tag available in HTML, you can\
    \ direct links to open in new windows. You can also set the parameters of the\
    \ windows that open (such as size, characteristics, title) to give a more customized\
    \ feel to your site.\n\nThere is a tendency among novice JavaScript programmers\
    \ to go overboard with some of the new tricks they have learned. Just as with\
    \ All Web design issues, it is always best to ask yourself if you are using JavaScript\
    \ to perform something necessary or to show off your programming skills.\n\nPop-up\
    \ windows are good, but they can also be annoying, and they preclude people with\
    \ older browsers from viewing parts of your site.\n\n# Exercise 9-3: Opening a\
    \ JavaScript Window\n\n+   1. Type the following script into an HTML document:\n\
    \n<SCRIPT LANGUAGE=\"JavaScript\">\n<!-- Start hiding from old browsers\n\nfunction\
    \ PopWin\n{\n\npopup = \nwindow.open(\",\"popDialog\",\"height=160,width=300,scrollbars=no\"\
    )\npopup.document.write('<html><body> BODYCOLOR=#FFFFFF TEXT=#000000');\npopup.document.write('<BR><BR>');\n\
    popup.document.write('<CENTER><H3>Thanks for visiting our page!</H3></CENTER>');\n\
    popup.document.write('</body></html>');\npopup.document.close()\n}\n\n// Stop\
    \ hiding from old browsers --\n</SCRIPT>\n<HEAD>\n\n<BODY bgcolor=\"ffffff\" onload=\"\
    PopWin\">\n<CENTER>\n<H3>By the time you see this, the Pop-Up Window will have\
    \ loadedc/</H3>\n</CENTER>\n</BODY>\n\n![](bbox=[0.158, 0.213, 0.233, 0.258])"
