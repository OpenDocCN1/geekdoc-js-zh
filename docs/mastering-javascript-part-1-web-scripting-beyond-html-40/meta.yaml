  md: '# Calendars


    Calendars are especially useful scripts on Intranet sites. They can be used to
    track time off, important meetings, or company events. By setting up a calendar
    on an Intranet site, anyone within a company or department can update it.


    Setting up a complicated calendar—similar to the ones described above—is beyond
    the scope of this course. However, understanding how a simple calendar functions
    can give you a head start toward developing more complicated scripts using JavaScript.


