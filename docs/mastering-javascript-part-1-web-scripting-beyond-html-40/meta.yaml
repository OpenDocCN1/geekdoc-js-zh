  md: '# Embedding JavaScript in HTML


    For the purposes of this course, a JavaScript program always exists as a subset
    of an HTML document, embedded within the script of the HTML document. Just as
    images are embedded in HTML documents with the <IMG> tag, JavaScript programs
    are embedded using the <SCRIPT> tag.


    # <SCRIPT> Tag


    JavaScript code (also called a program, script, or instructions) appears between
    two specific HTML tags—<SCRIPT> and </SCRIPT>. The opening tag—<SCRIPT>requires
    a mandatory attribute, LANGUAGE. The LANGUAGE attribute identifies the language
    of the program that follows. For the purposes of this course and your use of JavaScript,
    the value is always LANGUAGE=JavaScript.


    > The JavaScript interpreters built into all JavaScript-aware Web browsers are
    case sensitive; thus, capitalization is significant. You must set LANGUAGE equal
    to JavaScript, not JASCRIPT, javascript, or JavaScript.


    ![](bbox=[0.078, 0.403, 0.133, 0.442])


    ![](bbox=[0.173, 0.396, 0.273, 0.452])


    # Document.write()


    The document.write() statement takes what is contained in quotation marks within
    the parentheses—a collection of characters called a string—and writes it into
    the HTML document. The browser displays the string when the JavaScript finishes
    executing. Effectively, document.write() makes something appear within an HTML
    page.


    An example of a document.write() statement is shown in Figure 1-2.


    ```

    document.write("JavaScript was here!")

    ```


    Figure 1-2: Anatomy of a JavaScript statement'
  merge: -1
  pgno: 19
