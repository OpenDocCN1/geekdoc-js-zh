  md: 'The variable GroupSize, the value at which the loop stops iterating, is set
    equal to document.DemoForm.RadioGroup.length. Length is a property of the RadioGroup
    array that contains the index number of the last item in the array (in this case,
    4, because there are 5 radio button objects in the array and the first is indexed
    as number 0).


    Each time the loop iterates, if statement is processed:


    +   - if (document.DemoForm.RadioGroup[i].checked)


    # Checked, SelectedValue, break, and if


    Checked is a property of radio buttons that contains true if the radio button
    is checked and false if it is not. This statement determines whether the checked
    property of the current radio button (RadioGroup[i]) is true.


    If the radio button is checked, more statements are processed. The variable SelectedValue
    is set equal to the value of the current radio button (which is defined in HTML
    with the VALUE attribute). The break statement then instructs the browser to stop
    the loop (because the selected radio button has been found) and move on to the
    line of code after the loop''s closing brace.


    The if statement assigns the value of the selected radio button to a variable
    SelectedValue.


    ![](bbox=[0.138, 0.582, 0.218, 0.613])'
