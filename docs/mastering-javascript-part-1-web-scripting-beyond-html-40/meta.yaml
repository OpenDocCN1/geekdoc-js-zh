  md: '# Exercise 1-1: Inserting JavaScript Tags


    +   1. Launch your text editor (Microsoft Notepad recommended).

    2. Type the following script into your text editor.


    ```

    <HTML>

    <HEAD>

    <TITLE>Practice JavaScript HTML Document</TITLE>

    </HEAD>

    <BODY>

    <H1>The following is the result of JavaScript code:</H1>

    <SCRIPT LANGUAGE="JavaScript">

    document.write("Hello World!")

    </SCRIPT>

    ```


    +   3. Save the file as JAVASCRIPT.HTML (you may save the file anywhere on your
    computer; however, remember where you saved it so you can open it in the next
    step).

    4. Launch your Web browser and open the file JAVASCRIPT.HTML. Your browser content
    area should appear similar to Figure 1-3.


    ![](bbox=[0.218, 0.597, 0.715, 0.856])'
  merge: -1
  pgno: 20
- img_proc: false
  md: 'The <SCRIPT LANGUAGE=JavaScript> and </SCRIPT> tags surround a one-line JavaScript
    program that writes the text “Hello World!” into the HTML document.


    This program illustrates an important JavaScript concept. Note that the line that
    actually writes to the browser screen appears as follows:


    ```

    document.write("Hello World!")

    ```


    Figure 1-4 illustrates the anatomy of the complete JavaScript program used in
    the previous exercise.


    ![](bbox=[0.156, 0.406, 0.883, 0.553])


    document.write() statements appear frequently in JavaScript programs. These statements
    function to write whatever is contained in the parentheses into the HTML document.
    You can even write HTML tags with document.write() and they will be interpreted
    properly by any JavaScript-aware browser.'
  merge: -1
  pgno: 21
- img_proc: false
  md: '# HidingScript Code from Older Browsers


    **Not all browsers can interpret JavaScript.** Browsers that do not contain a
    JavaScript interpreter will not recognize JavaScript code. This results in writing
    JavaScript code into an HTML document as if it was plain text, creating an illogical
    and unsightly display of text and essentially destroying a Web page.


    Because of this risk, a trick will allow you to conceal JavaScript code from browsers
    that are not JavaScript-aware (typically older versions of Netscape Navigator
    and Internet Explorer). You will utilize this technique in the following hands-on
    exercise.


    # Exercise 1-2: Hiding Code


    +   1. Type the following script into JAVASCRIPT.HTML below the script you entered
    in the previous exercise:


    ```

    <H1>Browsers that can''t understand JavaScript won''t display what''s next.</H1>

    <SCRIPT LANGUAGE="JavaScript">

    <!-- Start hiding from old browsers.

    document.write("What''s next.")

    // Stop hiding from old browsers. -->

    </SCRIPT>

    <H1>But all browsers will display this.</H1>

    ```'
  merge: -1
  pgno: 22
- img_proc: false
  md: '2. Resave the file. Switch applications to your Web browser (<ALT + TAB>) and
    reload the file (<CTRL + R>) in Navigator and <F5> in Internet Explorer. Your
    browser should appear similar to Figure 1-5.


    ![](bbox=[0.218, 0.181, 0.782, 0.396])


    Figure 1-5: Non-JavaScript cannot display the "What''s next" text


    The trick here relies upon HTML comments, about which you learned in DDC Publishing’s
    *HTML 4.0 Fundamentals* course. Recall that a Web browser will


    +   1. ignore any text or code between <!---- and -->

    2. not interpret or act upon tags it does not recognize.


    Thus, if you position a <!---- directly following the <SCRIPT> tag, you can instruct
    a browser that does not recognize the <SCRIPT> tag to begin ignoring text.


    Then, to terminate the JavaScript program, you insert a --> tag. This instructs
    browsers that are not JavaScript-aware to begin interpreting your HTML script
    again.


    But what if JavaScript tries to interpret -->-->? This scenario would cause an
    error because the line containing --> begins with //. This instructs the browser
    to ignore the rest of the line.'
