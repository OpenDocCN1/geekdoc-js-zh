  md: '# Lesson Summary


    +   JavaScript is capable of logical functions, allowing a program to follow certain
    instructions under particular conditions. A scripter, then, can insert control
    structures to cause a JavaScript program to behave in any number of ways.


    +   If statements prompt a section of a JavaScript program to execute when certain
    conditions are met. When those conditions are not met, the program will continue
    its course, ignoring the if statement and corresponding code.


    +   If...else statements prompt a section of a JavaScript program to execute a
    set of instructions when certain conditions are met (or true). When those conditions
    are not met (or false), a different set of instructions are performed before continuing.


    +   Repetitive tasks can be performed easily in a JavaScript program using a for
    loop. The for loop requires information as an index variable''s condition, and
    the code that will be executed during each iteration of the loop.


    +   While loops work similarly to for loops, but offer greater flexibility. A
    while loop allows for variation in the way the variables in the condition are
    changed in each iteration of the loop.


    +   Multiple if statements can be accomplished more easily by using the switch
    statement control structure. The switch structure can perform one action in one
    condition, another action under a different condition, and a third action if neither
    the first nor the second condition exists.'
  merge: -1
