  md: '# Lesson Summary


    +   - Event handlers are bits of code that are attached to graphical elements.
    The event handler is a "middle man"; it waits for a certain event then trips a
    JavaScript function to react to that event.


    +   - Focus is the term used to describe the state of a form element that has
    been selected (with the <TAB> key or a mouse click), but not necessarily clicked.


    +   - There are three event handlers that can be assigned to buttons: onClick,
    onFocus, and onBlur. onClick trips when the button is clicked; onFocus trips when
    the button is selected (not clicked); and onBlur trips when the button loses focus.


    +   - Similar to buttons, radio buttons and check boxes support onClick, onFocus,
    and onBlur.


    +   - Text handlers in a form also support event handlers. OnChange trips when
    the text in a text field or area changes and focus is taken away. Text handlers
    share onFocus and onBlur lists with other elements.


    +   - Selection lists and drop-down list boxes, like text handlers, support the
    onChange event handler, which trips when a user changes the selected element.
    It, too, supports the onFocus and onBlur event handlers.'
