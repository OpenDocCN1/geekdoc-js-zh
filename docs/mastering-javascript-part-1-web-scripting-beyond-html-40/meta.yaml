  md: "# Switch Statements\n\nJavaScript 1.2 (interpreted properly by Netscape Navigator\
    \ 4.0x and more recent and Microsoft Internet Explorer 4.0x and more recent) adds\
    \ more control structure to JavaScript. The switch statement is an example of\
    \ a control structure element new to JavaScript 1.2. Structures like the switch\
    \ statement serve the same purpose as if...else statements, only in a more compact\
    \ syntax.\n\nThe switch statement is understood only by Netscape Navigator 4.0\
    \ and Microsoft Internet Explorer 4.0 and more recent. Therefore, any Web user\
    \ with an older browser who downloads a JavaScript-enhanced page that uses switch\
    \ will get an error.\n\n![](bbox=[0.133, 0.252, 0.213, 0.298])\n\n# Syntax\n\n\
    At first glance, switch statements look very complex. With some practice, they\
    \ are not difficult to use. The syntax of the switch statement is as follows:\n\
    \n```\nswitch (variable to be evaluated)\n{\n  case x :\n    code to be executed\
    \ if the variable to be evaluated equals x\n  case y :\n    code to be executed\
    \ if the variable to be evaluated equals y\n  default:\n    code to be executed\
    \ if the variable evaluated equals anything other than x or y\n}\n```\n\nYou can\
    \ have as many case lines in a switch statement as you wish."
  merge: -1
  pgno: 84
- img_proc: false
  md: "# Exercise 5-5: Using switch Statements\n\nIn this exercise, you will create\
