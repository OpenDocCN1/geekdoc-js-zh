- img_proc: true
  md: 'This module covers everything you need to know about regular expressions. This
    term may be new to you if you are a beginner, so the first section of this module
    explains exactly what regular expressions are and covers the built-in comparator
    functions used with them. Once you''ve been introduced to them, we move on to
    the next section of the module, which shows you how to work with them in programs.
    We introduce you to the various ways to search for them, as well as other tasks
    that can be performed, as such search and replace. Let''s get started.


    # # What Are Regular Expressions?


    A regular expression is a specification for a group of characters you want to
    search for in a string. Let''s say you are reading in lines from a file and you
    want to search for the characters SRT in that specific order. The regular expression
    you would use to search for this sequence is exactly the same sequence of uppercase
    characters. We get to how to implement the search in a minute but, first, it''s
    important for you to understand the regular expression is what determines the
    sequence of characters for which you are looking. You have an abundant amount
    of options when you specify a regular expression. You don''t have to specify an
    exact pattern, like SRT, when you''re deciding on your regular expression should
    be. As you learn in this module, you can specify small fragments of a complete
    pattern to search as well.


    # # Understanding a Pattern


    A pattern is a certain sequence of characters you may be searching for in a string.
    The pattern is selected by the user in the form of a regular expression and this
    pattern is compared to all the contents of the string. The concept of a pattern
    is simple. It may be a recurring pattern or it may only occur once in ten thousand
    strings of data.


    Before you begin searching for a recurring pattern, think about the parts of the
    pattern that are redundant. This can often help you select one regular expression
    that can find most or all of the pattern occurrences for which you are searching.
    For example, if the pattern always begins and ends with the same sequence of characters,
    but always differs in between, then your regular expression should search for
    the beginning and the end'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# Module 7: Regular Expressions 223


    of the pattern, while ignoring everything in between. Taking a few moments to
    think about how to break down the pattern in the beginning may save you some programming
    time when you implement your search.


    # Built-in Operators


    Before we get too far in this module, we need to discuss two operators you will
    see often. The match operators are used when you are searching through a string
    for a matching regular expression.


    The first one discussed is represented by the equals sign, followed by the tilde
    ~=. This operator tests a string of information to see if the specified regular
    expression is present. If it is, the statement returns a true, or non-zero, value.
    If it doesn''t find a match for the regular expression, it returns a zero, or
    false, value.


    The other match operator is represented by the exclamation mark, followed by the
    tilde character !=. This operator tests a given character string for a match to
    the regular expression, and if it does find a match, it returns a zero, or false,
    value. If it doesn''t find a match, it returns a non-zero, or true, value. This
    operator is the exact opposite of the ''=~'' operator you just met.


    One thing you need to be familiar with before we move on is how to specify a regular
    expression. This is done simply by enclosing the pattern you want to search for
    with forward slash / characters. Let''s look at an example of a regular expression,
    just to make sure everything is so far.


    ```

    /SRT/ This is a regular expression and the pattern is ''SRT''

    ```


    The following is an example of one way you can use the match operator and a regular
    expression together:


    ```

    $result = $string ~ /SRT;

    ```


    The previous statement tests the string, $string, for an occurrence of the regular
    expression, "SRT," and stores the result in the scalar variable $result. Again,
    if the search finds an occurrence of the pattern in the string, $result will contain
    a true, non-zero value after the statement executes.'
