- img_proc: true
  md: 'Signal handling is one item you may find different on Windows'' systems from
    UNIX and Mac OS systems. The die () and exit () functions from signal handlers,
    for example, can cause an exception because most implementations of signal ()
    are limited. Because of this, signal may work only for setting flag variables
    in the handler and other simple tasks.


    One way to handle this correctly if you''re writing a script that''s supposed
    to work on many different systems is to check the ^O variable. This variable returns
    a name for the system that you can use in the appropriate if statement before
    performing any system-specific functions. Table 11-2 shows the various strings
    that can be returned using this variable in Windows and DOS-based systems.


    # Note


    The ^O variable wasn''t added until Perl 5.002. You may want to use the require()
    function to make sure any scripts you have using it are executed in an environment
    that supports it.


    | System | Value of ^O |

    | --- | --- |

    | Cygwin | cygwin |

    | MS-DOS | dos |

    | OS/2 | os2 |

    | PC-DOS | dos |

    | Windows 95 | MSWin32 |

    | Windows 98 | MSWin32 |

    | Windows Me | MSWin32 |

    | Windows NT | MSWin32 |

    | Windows 2000 | MSWin32 |


    Table 11-2 Possible Values of ^O on Windows and DOS-Based Systems'
