    # Date: 10.01.2000

    # Author: R. Allen Wyke

    # Description: Prints "Hello, World!" to the user''s screen.

    # Revision History:

    # 1.0: original version

    #-----------------------


    print "Hello, World!\n";<- Using the print function to send output to your screen

