  md: '# 196 Perl: A Beginner’s Guide


    Now that you know how to open a file, you can open them in three different modes:
    Read, Write, and Append. By default, all files are opened in the Read mode, which
    lets you read the contents of the file without changing it.


    The next mode you can open a file is in the Write mode, which is dangerous to
    you, the user. When you open a file in the Write mode, the current contents of
    the file are destroyed. The contents you delete are replaced by a write to that
    file. We show you how to write to a file later in this module. If you want to
    open a file in Write mode, you need to add one greater symbol (>) in front of
    the filename and path if applicable. Here’s an open statement that will open a
    file in Write mode:


    ```

    Open (EXAMPLE, "D:/Perl/book/test/example.txt");

    ```


    Once the file.txt, is opened in Write mode, its contents will be removed, unless
    you write anything to the file, it will contain zero bytes. The Write mode is
    useful when you want to overwrite the contents of the same file every time.


    Another mode you can open a file is in the Append mode, which lets you add to
    the contents of the file without destroying the current contents. When you use
    the Append mode, you cannot read the existing contents of the file. To open a
    file in this mode, you have to add two greater symbols (>>) in front of the filename
    and path. It would look like this in a program:


    ```

    Open (EXAMPLE, \>>D:\Perl\book\test\example.txt");

    ```


    The Append mode is useful when you need to add contents to a file without the
    need to read the current contents.


    If you want to open a file in Read/Write mode and you don’t want the contents
    of the file to be harmed, you can add a plus + and a less symbol < in front of
    the filename and path. This character sequence +- signifies the file has been
    opened in Read/Write mode.


    Now that you know how to open a file, you need to learn how to close one. Remember,
    the file handle is the reference for a file throughout'
