  md: '# Module 4: Lists, Arrays, and Hashes 113


    In addition to accepting integer and decimal numbers, the list range operator
    also accepts letters. If you want to create a list that contains the letters in
    the alphabet, use the following list:


    ```

    (a .. z)

    ```


    This list contains all the letters in the alphabet. You can also mix numbers and
