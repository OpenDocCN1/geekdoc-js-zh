  md: "# Essential Skills for First-Time Programmers\n\n# Perl\n\n![](img/2070407c4a70134aab89572f10d21e60_499_0.png)\n\
    \n# A Beginner’s Guide\n\nearn the basics of Perl programming from the tutorials\
    \ and examples in this easy-to-follow resource. **Perl: A Beginner’s Guide** covers\
    \ fundamentals, such as general syntax and semantics, control structures, subroutines,\
    \ and regular expressions. The book explains how to use Perl modules, access databases,\
    \ weave CGI programs, and debug code. The examples throughout the book you walk\
    \ through real-world programming tasks. To speed your progress, the source code\
    \ for projects is available free online. Start programming in Perl right away\
    \ with this self-paced, step-by-step learning solution.\n\nABOUT THE AUTHORS:\n\
    R. Allen Wyke, Director of Product Technology at Engage, has expert experience\
    \ in Perl, XML, and JavaScript. He is the co-author of several computer and Internet-related\
    \ books. The Perl 5 Programmer's Reference and Pure JavaScript Wyke has also penned\
    \ columns and articles for SunWorld and Itworld.com.\n\nDonald B. Thomas is a\
    \ design engineer at Engage Technologies.\nHe works extensively with Perl, WML,\
    \ XML, Java, and JavaScript.\n\n# This Beginner’s Guide is Designed for Easy Learning:\n\
    \n+   - Modules—Each programming concept is divided into logical modules (chapters),\
    \ ideal for individualized learning\n- Goals—each module outlines the specific\
    \ programming skills you'll have by the end of the module\n- Ask the Experts—Q&A\
    \ sections throughout are filled with extra information and interesting commentary\n\
    - 1-Minute Drills—Quick self-assessment sections to check your progress\n- Annotated\
    \ Syntax—example code with commentary that points to the particular technique\
    \ illustrated\n- Projects—Coding exercises contained in each module show how to\
    \ apply what you are learning\n- Mastery Checks—End-of-module reviews that test\
    \ your knowledge using short-answer, multiple-choice, fill-in-the-blank, and simple\
    \ coding questions\n\n| OSBORNE REQUIRED READING for the Information Age | Division\
    \ of The McGraw-Hill companies | PROGRAMMING/PERL | ISBN 0-07-212957-3 90000 9780072129571\
    \ 03/09/2018 11:34-3 22 |\n $29.99 USA | £21.99 UK |"
