  md: '# A Hello Script


    The first program you''ll complete is probably the first program 90 percent

    of the Perl programmers today also completed. This is the old faithful

    Hello, World! program. The idea is simple—to have the program output

    text that says Hello, World!


    In this program, you are introduced to a built-in Perl function called

    print, which sends output to a specific location. In this program, the

    location is standard output (STDOUT), or in simple terms, your screen.

    To get started, we are going to take our template and fill in our

    information, such as name, version, date, and description. Once

    you have that, save the file as Hello.pl. Because this is a simple program,

    only one Perl programming line is in it—print "Hello, World\n".


    # Hint


    Want to know more about the "print ()" function? Check out the

    perfunc manpage that comes with your Perl distribution.


    Don''t worry about the \n right now because the next module covers

    it and others like it. Just understand that \n represents a newline character

    and causes the cursor to put your command prompt on the next line when

    you run the program. If you want to see the difference for yourself, try it

    with and without it.


    ```

    #!/usr/bin/perl

    ################-------

    # Script Name: Hello.pl

