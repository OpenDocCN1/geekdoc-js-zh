    # <input type="text"> Text Box


    The text box is the next element we discuss. A text box gathers a

    line of text and it is one of the most common fields you used on a

    form. This type of element is implemented using an <input> tag and

    assigning its type attribute to text. In this tag, we also use the name

    attribute, so we can assign the value passed to a name, or like.

    The last section, we introduce the text box by saying "Other," which in

    our completed form, gives the user the ability to insert a new type of

    music—one that isn''t listed in our multiselect box.


    ```

    <h4>Other</h4>

    <input name="othermusic" type="text">

    ```


