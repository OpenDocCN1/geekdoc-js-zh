  md: '# Perl: A Beginner’s Guide


    # Return Codes


    The return value of the system() function is the exit status of the program, as
    returned by the wait() system call. If you have a -1 returned by the $?, then
    an error has occurred. You can obtain a description of the error by accessing
    the $ variable. The following quick example, which we name sys_test.pl, shows
    how this might work.


    Because of the wait() works on Windows''s systems, you must divide the returned
    value by -256 to get the actual exit status. So, in the following example, you
    need to replace $exit = $ $exit = -/256?


    # Note


    ```

    #!/usr/bin/perl -w


    # store command and arguments in array

    @args = ("abcdef", "blah", "blah", "blah");


    # call system() function

    $result ~ system(@args);


    # if $? contains anything, store values in appropriate variable

    $exit = $? & 127; # contains exit status

    $sig = $? & 128; # contains signal number

    $core = $? & 128; # contains 1 if program performed dump

    ```


    ```

    # if system() called non-zero then problem exit.

    # program and send error information to STDOUT

    $result == 0 or die "\n"args" = @args\nExit: $exit\nsignal\nNumber: $sigInCore=$core\nMessage:
    $!";

    ```


    In this example, we first stored a fictitious command, abcdef, and its arguments,
    blah blah blah, in an array. We then pass them to the system() function and store
    the results of doing so in the $result variable. By storing the result, as you
    see shortly, we can check to see if an error did occur. But, before we do, we
    store any values $? has in specific variables.


    As mentioned earlier, if $? contains -1, then a problem occurred. In addition,
    a bitwise AND comparison with 127 returns a signal number and the same type of
    comparison with 128 tells you a core dump occurred. These are generated if the
    program performs a bad operation,'
