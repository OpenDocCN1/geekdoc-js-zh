  md: '# Module 5: Program Flow and Subroutines 179


    **Question:** Earlier in the module, you said I should avoid naming the subroutines
    the same as other Perl reserved words. I understand why, but what happens if I
    do?


    **Answer:** You can override these built-in functions, but doing so often results
    in strange behavior. If you have a good reason, such as trying to emulate a UNIX
    command on a nonsupporting system, then there''s no problem. Things you must know


    +   - If you''ve overridden a particular function, you need to use the default
    function in a piece of your code instead, precede the call to the function with
    CORE ::. For instance, if you have overridden the chop() function, you can refer
    to the built-in version in your code using CORE:: chomp.


    +   - Overridden functions must be defined in a package and imported into your
    script. If you plan on overriding multiple functions, you can create a single
    package with all your code. For more information on packages, see Module 8.


    +   - You should avoid including an overridden function in the default @EXPORT
    list of your package. We discuss this list more in Module 8, but the idea is this:
    when a package is imported in a script, all the subroutines in the @EXPORT list
    are automatically imported and, therefore, override any functions of the same
    name. This can be a bad thing if else is using your package or if you forget included
    a particular function that is overridden. You can place them in the @EXPORT_OK
    list, which puts the power back in your user''s hands.


