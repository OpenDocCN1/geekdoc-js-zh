- img_proc: true
  md: 'See how easy that was? OK, OK—I know you''re wondering about

    the :DEFAULT parameter. As mentioned, Exporter is a module, so if you

    want more information about it, be sure to check the documentation. To

    ench your thirst for knowledge, though, here''s a quick summary about

    DEFAULT and the use of the :before it and header.


    # Note


    You cannot also use the names you specify in the %EXPORT_TAGS lists

    in @EXPORT or @EXPORT_OK. Additionally, the tags (not the names) in

    %EXPORT_TAGS MUST also appear in %EXPORT or @EXPORT_OK. So, for

    instance, if you have %EXPORT_TAGS = (header -> [qw(sub1 sub2

    sub3)]), then you cannot use header in @EXPORT or @EXPORT_OK, but

    sub1, sub2, and sub3 must also appear in %EXPORT or @EXPORT_OK.


    # A Quick Look at Syntax


    The syntax of Exporter uses some special functionality. It lets you

    control some of the items imported from the module, as well as shortcut

    ways to import more than one item. This control is through the use

    of :, ,, /, and !. Table 8-1 shows how it works. Note, is nothing more

    than an optional item that tells Perl NOT to import the item. Basically,

    it''s Exporter''s answer to the no () function.


    # import ()


    This function contains all the necessary exportable items for the library and

    a method by you may see instead of the Exporter module. Here''s the deal

    with import (). When the use () functions are called in your script,


    | Syntax | Description |

    | [!]sub | Import or not import this subroutine, referenced by sub, only |

    | [!]DEFAULT | Import or not import all subroutines in the @EXPORT array |

    | [!]tag | Import or not import all names in %EXPORT_TAGS (tag) anonymous

    list, which means the actual tag names aren''t passed to the script, but

    ttheir names |

    | [!]pattern/ | Import or not import all names in @EXPORT and @EXPORT_OK, which

    match the pattern specified |


    Table 8-1 Exporter Syntax for Loading Modules and Their Subroutines'
