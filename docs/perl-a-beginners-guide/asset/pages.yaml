    Before we go any further, we need to introduce you to two functions that can come
    in handy when you are working with files and directories: the die and warn functions.
    These functions can be used in conjunction with other statements by using the
    logical || operator or any other decision-making type of statement. If the operation
    on the left side of the logical or operator doesn''t return a true value, the
    die or warn functions are executed. Each of these functions provides you with
    the option of displaying some error message. The die function terminates the program
    and the warn function simply outputs the error message requested to be displayed.
    Let''s look at these two functions in use through another programming example:


    This line of code will attempt to open the file "example.txt." If the file cannot
    be opened, the die function gets executed and the program terminates.


    ```

    #!/usr/bin/perl

    print "This program will open an example file \n"

    print "This is an example of the die and warn functions being used with the ||
    operator \n"

    open (EXAMPLE, "example.txt") || die("Could not open example.txt \n!");

    open (EXAMPLE, "nofile.txt") || warn("Could not open nofile.txt \n!");

    ```


    This line of code will attempt to open the file "nofile.txt." This file doesn''t
    exist, the warn function gets executed, which simply prints the first warning
    message along with the actual error saved in the $ variable.


