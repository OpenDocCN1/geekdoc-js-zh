- img_proc: true
  md: '# 346 Perl: A Beginner’s Guide


    finished being sent back to the browser. And because identifying your users as
    they return to your site is often necessary, the concept of storing small amounts
    of data on a user''s browser was introduced.


    A cookie is data sent to the browser by the Web server. Because the cookie is
    sent back and forth in the header between the server and browser, it lets preserve
    the state of requests and responses. This enables you to monitor, in some form,
    the browser requesting data.


    The most common use for cookies is to store information about the user, so you
    can deliver new or customized information to them. For example, you may want to
    check if this person is visiting your site for the first time. If so, then you
    can display a advertisement or offering each time this person visits. You can
    also create a shopping cart to store one or more products the person considers
    purchasing at a later time.


    # Basics


    When a browser receives a cookie, the data is stored in a file on the user''s
    computer. The name, location, and format of this storage varies, depending on
    the browser. Netscape browsers, for instance, store in a single file called cookies.txt.
    Internet Explorer browser, on the other hand, store these in separate files under
    “cookies” folder.


    Some limits also exist to the number of cookies a browser can hold. If additional
    cookies are added that exceed these limits, the oldest cookie is deleted. Additionally,
    to ensure no site writes large amounts of data to your disk, a limitation on the
    size of the cookie data has been imposed, and it can be no larger than 4K.


    # Note


    New cookies are written to the hard disk when the user exits the browser, whereas
    a modified cookie is written immediately. This is so any information the cookie
    that has changed won’t be lost in a crash.


    Cookies can be created in three different ways:


    +   - You can send a Set-Cookie header directive in the HTTP response, which is
    the method we discuss in this module.


    +   - If the browser supports JavaScript, you can set a cookie using the document.cookie()
    method.'
  merge: -1
  pgno: 369
- img_proc: true
  md: 'Finally, it''s possible to use the <meta> tag within an HTML document to set
    a cookie.


    # Fields


    A cookie is sent to a browser using a Set-Cookie header directive. This is part
    of an HTTP response generated by the Web server or a CGI script. This header directive
    is sent in the following format:


    ```

    Set-Cookie: key=value; expires=date; path=path; domain=domain; secure

    ```


    Not all these are required or self-explanatory, so let''s look at each of them:


    +   **key=value** The key and value pair the name of the cookie and the value
    assigned to it. This is what you should look for in your CGI scripts—it contains
    the information you want to leave on the browser.


    +   **expires=date** Specifies how long the cookie persists. Once this date has
    passed, the browser removes the cookie. The date setting uses the following format:


    ```

    Weekday, DD-Mon-YYYY HH:MM:SS GMT

    ```


    These break down and mean the following:


    +   - **Weekday** represents the day of the week, like **Monday**.

    - **DD** represents the date, as as **23**.

    - **Mon** represents the three-character abbreviation for the month, as in **Oct**.

    - **YYYY** represents the year, as with **2001**.

    - **HH** represents the hour, like **08**.

    - **MM** represents the minutes, like **58**.

    - **SS** represents the seconds, like **43**.

    - **GMT** stands for Greenwich Mean Time.'
  merge: -1
  pgno: 370
- img_proc: true
  md: '# Perl: A Beginner’s Guide


    # Note


    Not all browsers require all fields to be specified when you set a cookie. In
    fact, if the date isn''t included, the cookie will be a session cookie and will
    last until the reader exits its browser.


    +   - path=dirpath: Specifies the path on the server for which the cookie applies.
    This is typically set to “/”, commonly referred to as the root, but it''s possible
    to specify another directory. This means only files and programs in this directory
    have the capability to read the cookie once it''s set.


    # Note


    +   - domain=domain: Specifies the domain for which the cookie is to be returned.
    This can contain a complete machine name, such as shop.osborne.com, or just the
    domain, such as oshbone.com. When you use the second method, all machines within
    that domain have access to reading, deleting, or modifying the cookie.


    +   - secure: Indicates the cookie should be transmitted only if you are running
    a secure server. This setting keeps the cookie from being transmitted on a nonsecure
    port.


    # Note


    If you''re not running a secure server and you use the secure setting, the cookies
    won''t be sent.


    # Setting


    Setting a cookie when using CGI.pm module is easy. It provides all the necessary
    methods of specifying the values for the Set-Cookie directive. To see how this
    might be done, look at the following. In this example, we set a cookie named ID,
    with a value of 12345. It expires one year from today, it is readable by all directories
    starting with the root directory, can be passed back to the server located at
    192.168.1.101, and isn''t secure. The last line is what actually prints the cookie
    in the HTTP header before it''s sent to the browser.'
  merge: -1
