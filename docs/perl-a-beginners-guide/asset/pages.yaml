  md: '# 368 Perl: A Beginner''s Guide


    So far, you''ve covered a lot of ground in the Perl programming world. You have
    learned the interpreting engine installed and running, you learned many of the
    semantics of the language, you''ve been exposed to working with directories and
    files, you''ve been taught the concepts of regular expressions and libraries,
    you''ve applied your knowledge in working with databases and CGI scripts. That''s
    a lot of information to cover!


    But, now it''s time to take another step. In previous modules, we touched on some
    of the issues around running Perl on different operating systems and discussed
    some of the differences in implementing scripts across systems. At this point,
    we want to touch on some language-specific details about running Perl on Windows,
    UNIX, and Mac OS. In Module 1, we mentioned items like path delimiters for each
    of these systems, but our focus in this module is deeper than that. In this module,
    we want look at the following.


    +   **The system() function** This lets you execute commands native to the system,
    including the passing of arguments.


    +   **Operating System Specific Issues** This section is a summary of some of
    the main issues you see when you write cross-platform code.


    As you can see, we have our plate full for this module. Much of this information
    isn''t easy to understand conceptually. Why does function() work on one system
    and not on the other? Why does y() work a little differently on different systems?
    These are the questions you might have during the next few hours while you go
    through this module.


    Don''t worry, though, we do our best to present to you the information you need
    to know and avoid any confusing topics. Because we include hints and tips on where
    to get additional information, you can follow up on topics you''re especially
    interested in after you finish this module.


    Let''s get started now by covering the system() function.


    # system()


    Now that you''re becoming more and more familiar with the Perl programming language,
    have you begun to think about some of the things'
  merge: -1
  pgno: 391
- img_proc: true
  md: '# Module 11: Cross-Platform Functions and Issues


    you could automate or do on your system? Things like launching several applications
    at once or deleting excess files in your temporary directories? These are all
    tasks that usually invoking one or more commands each, so you could easily run
    into 20 or 30 commands just to accomplish a dozen or so actions you may do on
    a daily basis.


    Well, this is where the system() function comes in handy. This function, which
    can take a single command and any arguments, or an array containing a command
    and arguments, executes the command that was passed with the arguments. Your script
    calls this function, which executes the command, and then waits until the command
    has finished returning to your script.


    > Hint If you want to check out another function that performs the same tasks
    as the system() function, but that never waits for the command to return, then
    check your Perl manpages for the exec()


    The function itself, as previously mentioned, can take a single command with any
    arguments or an array with all this information. For a single command on Windows
    or UNIX where you want to launch the Netscape HTML editor (Composer) with a specific
    file, you could


    ```

    system(''netscape'', "edit", "index.html");

    ```


    We assume the netscape application is in your PATH for this to work.


    If you want to do this thing using an array, you could do the following:


    ```

    @composer_index("netscape", "edit", "index.html")

    system(@composer_index);

    ```


    As you can see, the syntax for this function is fairly simple. You should know
    some things about using this function, however, in terms of error codes and what
    is returned.'
