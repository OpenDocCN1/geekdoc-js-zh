  md: '# 146 | Perl: A Beginner’s Guide


    This concludes our discussion of arrays. Now we move to the next section of this
    module and talk about a specialized form of an array.


    # Hashes


    A hash is another type of variable that you can use to store scalar data. The
    naming conventions for the hash are the same as for the array and scalar variables
    except the hash variable begins with the percent ''%'' sign. Hashes are similar
    to arrays in that they store lists of information, but they have one major difference.
    The elements of a hash aren''t indexed the same as elements stored in an array
    variable. For arrays, the first element has an index of 0, the second element
    has an index of 1, and so on. Each of the elements contained in a hash has what
    are called keys, which are used as the index. These keys are user definable and
    they can be almost anything you like. Here''s the syntax for the hash variable:


    ```

    %hash = (key, element, key, element);

    ```


    > Note


    A hash is signified by the ''%'' character. Because this character is different
    from that of an array or a scalar, you may have one of each of these types—all
    with the same name—and they won''t overlap.


    When you create a hash, you need to follow this syntax by pairing keys and elements
    together, and always with the keys first.


    > Note


    If you mix up the order in which the keys and values are entered when creating
    a hash, you won''t get any errors, but you will have a list that is keyed with
    the wrong strings and contains the wrong values.


