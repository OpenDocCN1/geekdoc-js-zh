    ```


    # Note


    Notice the indexes used in an array slice can be in any order.


    Scalar variables and the list range operator can also be used to specify the elements
    of the array slice here. The following lines of code are perfectly legal:


    ```

    @array[$index1, $index2] = (10,20);

    @array[$index1 .. $index2] = (10,20);

    ```


    Remember, if you specify more elements than values, the extra elements will be
    assigned to null. If you specify more values than elements, the extra values are
    ignored. Here''s a programming example that demonstrates the use of array slices
    to assign values:'
