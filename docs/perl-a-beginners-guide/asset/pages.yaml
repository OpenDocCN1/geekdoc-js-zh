- img_proc: true
  md: '# Design Considerations


    If you made it this far, then you''ve decided you do, indeed, to create a library,
    so let''s move forward. The next thing you need to decide is how you want to design
    your module. Several common packages exist, such as to use the Exporter module
    that you need to load. You must decide to or not to use the Exporter module for
    providing exportable subroutines.


    # Caution


    When naming your packages and modules, try to avoid the use of Perl reserved words.
    This can lead to confusion for programmers and create a debugging nightmare. I
    remember this problem back in college and it took me to realize I was calling
    the Perl function—I was calling my own! Oh, the good old days. I''m a bit wiser
    now.


    # Hint


    Do you have more questions about how to design Perl libraries correctly? Check
    out the end of the perlmodlib manage.


    # Documentation


    From the start of this book, we preached the concept of documenting your code.
    When creating Perl packages and modules this is especially true. Adding comments
    and instructions within your library so others can read and understand how to
    use it is extremely important. And, if you''re designing a library to be reused
    by many people, such as posting it to a Web site or a newsgroup, then you should
    consider writing a full document on how it works and how it should be used.


    # Hint


    You can use h2xs -XA -nModuleName to create a skeleton module, which also creates
    a skeletal pod document.


    In creating documentation for your library, consider adding the following:


    +   - A thorough description of the library that explains what the library should
    be used for, what it does, and a version number.

    - How to install the library, especially if you have any relative path names.'
