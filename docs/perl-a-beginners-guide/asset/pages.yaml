  md: '# Perl: A Beginner’s Guide


    So, for instance, if you want to include a package named mymypackage.pl, then
    you simply have the following line in your program:


    ```

    require "mypackage.pl";

    ```


    As you might imagine, now that you''ve begun to understand the Perl way of thinking,
    this isn''t the only way to include a package in your code. You might also be
    wondering what the word "require" means. Before we go any further, let''s talk
    about the ways to include packages in your scripts and what each method means.


    # What Is a Module?


    In short, a module isn''t much more than a package. The only real difference is
    a module is designed to be reusable. This is accomplished by allowing some or
    all of a module''s variables and subroutines to be exported into other packages,
    although it isn''t necessary to export anything for a library to be a module.
    This is an easy concept to understand, but it can be a challenging one to implement
    correctly in your code. Because of this, we now look at the "exporting" options
    you have and how they work.


    ![](img/2070407c4a70134aab89572f10d21e60_289_0.png)


