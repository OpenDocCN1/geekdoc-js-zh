    **Question:** We''ve talked a lot about problems around specific operating systems
    and Perl, but are there any advantages to one operating system over another or
    to the discussion of the differences?


    **Answer:** Most major ports of Perl include additional libraries that extend
    Perl to take advantage of features, which only that operating system has. There
    are two that might be of interest.


    +   1. **MacPerl** The MacPerl module, which is built into the MacPerl distribution,
    provides several Mac OS-specific features, such as the dialog boxes that can be
    launched and system information, both of which were touched on this module. For
    more information on the MacPerl, check out the MacPerl.Specifics file in your
    distribution.


    +   2. **Win32, Win32:OLE, and Win32API** These Windows modules, which are distributed
    with ActivePerl, provide features specific to the Windows environment, including
    such as accessing the registry, controlling ActiveX controls, and writing information
    to the Event Log. For more information, check under Module Docs in your ActivePerl
    documentation.'
