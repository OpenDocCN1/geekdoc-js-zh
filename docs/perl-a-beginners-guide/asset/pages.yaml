  md: '# Strings


    As you''ve already learned, a string is simply a sequence of characters. A string
    can be made up of any combination of characters from the entire 256 character
    set that''s available to you. This means a string can contain digits, symbols,
    and alphabetical letters. In Perl, strings can contain anywhere from zero characters
    all to however many characters it takes to fill your available memory. These characteristics
    make strings much more flexible than Perl in most other programming languages.


    Strings come in two different forms: single-quoted and double-quoted strings.
    Each of these two types has different characteristics. Let''s look at the two
    types of strings in more detail and discuss what makes them differ from each other.


    # Single-Quoted Strings


    A single-quoted string in Perl is a sequence of letters, digits, or symbols enclosed
    in single quotes. All the characters inside the single quotes make up the string.
    Within these strings, the single quote and the backslash have special meanings.
    There are rules to follow when the single-quote character to be part of the string
    itself. If you require the string to contain a single quote, you must put a backslash
    before it. If you don''t use the backslash, your single quote is interpreted as
    the end of the string and everything after it is lost. If you need to escape the
    backslash, you must add an additional backslash to it. Let''s look at some examples.


    | Example | Explanation |

    | --- | --- |

    | ''Hello World'' | This is a string of 11 characters. The space between Hello
    and World does count as a character in the string. |

    | ''Hello World'' | This is a string of 11 characters. The return (newline) character
    does not count as a character in the string. |

    | '''' | This is a string of 0 characters. This is referred to as the **null string**
    in Perl. |

    | ''Hello World\Planet'' | This is a string of 18 characters. The backslash is
    part of the string and it reads exactly as it appears between the single quotes.
    |

    | ''Hello\''World\'' | This is a string of 13 characters. This is an example of
    how to use the backslash character to add single quotes to a single-quoted string.
    |

    | ''Hello'' | This is a string of 0 characters (the null string) because we didn''t
    use the backslash to add the single quotes around Hello. |'
