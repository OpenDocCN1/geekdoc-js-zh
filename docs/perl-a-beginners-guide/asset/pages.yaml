    # Understanding Databases


    One of the first things we want to mention about databases are a few different
    methodologies exist for storing the data. Some data is stored in flat files, like
    *Comma Separated Value (CSV)* files, others are stored in some form of relational
    manager, while others are stored in proprietary formats like Microsoft Excel.


    > Note

    Is Excel really a database? The argument could go either way. Yes, Excel can store
    data in a specified format and order, so following those lines, it could certainly
    be considered one.


    Relational Database Management Systems (RDBMS) are often considered the most robust
    and scalable databases around. In these systems, data is organized in specific
    tables, which have columns defining the information contained in the multiple
    rows. These tables are linked together using keys. Here''s a quick example.


    > Hint

    Recently, some growth has occurred in a concept called *Object-Oriented Database
    Management Systems (OODMS)*. Under this approach, everything in the database is
    an object, in much the same way that languages like Java work.'
