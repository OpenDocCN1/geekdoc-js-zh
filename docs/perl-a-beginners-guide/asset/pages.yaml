    # Mac OS


    One of the bigger issues with using Perl on the Mac OS is no command line interface
    is in versions before Mac OS X. This means you cannot pass arguments to your scripts
    (unless they are CGI scripts with a browser passes the arguments). A MacPerl module
    does exist, however, that lets prompt the user with a dialog box for arguments
    to be passed in. To invoke this dialog box, you can do the following:


