  md: '# 8 Perl: A Beginner’s Guide


    During the Perl 5 era, the release of Perl Win32 was also seen—the Microsoft Windows
    port of Perl. This port, which was funded by Microsoft for inclusion in its Windows
    NT Resource Kit, was developed by Hip Communications. Dick Hardt, the person at
    Hip who is widely known as the driving force behind getting Perl for Win32 started,
    went on to start Active Internet Corporation and ActiveState Tool Corporation.
    Since then, Perl for Win32 has followed Hardy, where it is now maintained free-of-charge
    to the public, by ActiveState.


    # ## 5.6 Brings to the Table


