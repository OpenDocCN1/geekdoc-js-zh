- img_proc: true
  md: '# Module 10: Writing CGI Programs 343


    Another part of this process involves changing any special characters into their
    hexadecimal equivalent. These are also called ASCII escape sequences. These sequences
    appear as %num, where num is the two-digit hexadecimal number. For example, a
    plus sign is %2B, and an apostrophe is %27.


    # Environment Variables


    Once the data has been sent to the server, you can obtain that information before
    you process in a special way. Additionally, you may want to take other bits of
    information into consideration in your script. This information is stored in CGI
    environment variables.


    When the Web server receives a request for a CGI program, it passes a set of environment
    variables that contain information about the server and its environment. The Web
    server also adds to set of information about the browser and the current request.
    After the server executes the script, it takes the output and sends it back to
    the browser. Table 10-1 contains the CGI environment variables common in most
    servers.


    > Note


    Different servers can have different variables. They can also have different names
    for variables, although this generally isn''t the case.


    | Environment Variable | Description |

    |---|---|

    | AUTH_TYPE | Type of authentication used to validate the user. |

    | CONTENT_LENGTH | Size of the content file returned. |

    | CONTENT_TYPE | Content type of the POSTed data. |

    | GATEWAY_INTERFACE | CGI version the server supports. |

    | HTTP_ACCEPT | MIME type the browser accepts for this request. |

    | HTTP_USER_AGENT | Complete name/identifier of browser. |

    | PATH_INFO | Path information, such as /sports/basketball. |

    | PATH_TRANSLATED | The translated PATH_INFO, which is also called the physical
    path. |


    Table 10-1 Common CGI Environment Variables'
