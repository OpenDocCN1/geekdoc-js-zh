- img_proc: true
  md: '# Module 5: Program Flow and Subroutines 161


    of us admit we aren''t well organized? Reasons other than code reuse warrant organization.
    We want to arm you with the information necessary to make good decisions on when
    and not to organize, specifically with subroutines.


    The first and foremost reason to organize is be able to find, debug, add, or delete
    easily, not only from a Perl script, but also from your entire repository of programs.
    As a programmer, one of the hardest things to do is edit an unorganized or undocumented
    piece of code. You could spend days trying to find the right place in the code
    to make your changes, which results in lost time. By organizing your code in some
    fashion, whether it''s logical or functional, you can quickly find the areas on
    which you need to focus.


    # Okay, Define Logical and Functional!


    So far, we mentioned logical and functional program flow two or three times in
    this module. We wanted to give you some time to absorb the difference before we
    clarified it. But enough waiting, let''s settle.


    When we talk about logical program flow, we are referring to the flow the program
    goes when it solves a task. For instance, when you get up in the morning, you
    may take a shower, get dressed, eat breakfast, and then go to work. A program
    designed logically would follow that same process, regardless of any common ground
    between steps, like opening doors or walking. So, for instance, following this
    type of approach would declare variables—instead of at the top—and subroutines—instead
    of the bottom—needed.


    A functional flow is more of one where you group like-functions together. In instance,
    at the end of your program, you would put all of your subroutines, organized by
    similar functionality. Walking, opening, and driving subroutines might be next
    to each other, while talking and other forms of communicating follow.


    A true program should fall somewhere in the middle of these two approaches. You
    would generally declare global variables at the same place, and subroutines should
    appear one after the other. In the main body of the program, however, your code
    should flow in a more logical sense. This creates somewhat human-readable code,
    which can help you in the long run—especially when debugging.


    ![](img/2070407c4a70134aab89572f10d21e60_184_0.png)'
  merge: -1
