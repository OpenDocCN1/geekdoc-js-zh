    # Platform Support


    The number of supported platforms is one reason Perl caught on so well. Even though
    Perl was originally designed on and for UNIX systems, it wasn''t long before support
    for other popular platforms followed. Some of the ports were one-offs that took
    the source code and made it work on a particular operating system. Others took
    the functionality beyond the distribution and added features specific to a system.
    In all in, however, Perl has maintained a fairly consistent set of functionality
    across these systems and, even though differences exist, in many cases, a script
    on one system can run on another.


