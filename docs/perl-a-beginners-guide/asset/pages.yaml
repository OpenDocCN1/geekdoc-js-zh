- img_proc: true
  md: '# Module 12: Error Messages and Debugging 419


    Both of these commands, > and < can be used at the same time on one program to
    give you a before and after picture of what''s happening after each line of code
    is executed.


    Another command similar to > and < is the a command. It enables you to execute
    a specified statement before a selected line of code is executed. The following
    is an example of how to use the a option:


    ```

    DB(1) a 10 print "Value contains $value \n"

    ```


    This command prints the value of $value1 before line ten of the program is executed
    in the debugger. You can use the L or l commands to list your set action statements
    using the A command. With the l option, any line you select is signified by an
    a on the left-hand side of the screen beside the line.


    Any line you delete by using the A command can be deleted by using the A command.
    It deletes all your line actions at one time and prints the following message
    to the debugger screen.


    # Deleting all actions...


    While the last few commands we cover aren''t good for debugging a program, they
    are good for saving time when you use the debugger. The first of these commands
    is the H command. This command prints all your previous commands to the screen.
    If you''ve entered many commands, you''ll probably have to scroll up to the last
    commands you entered. The H command prints your commands, starting with the most
    recent and ending with the oldest used.


    Printing all the commands is useful because you can use the ! command, along with
    the command number to reissue it without typing it all over again. This command
    can also be used to alone the most recently used command.


    This covers everything you need to know about the Perl debugger. We didn''t cover
    a few commands and options and if you happen to need one of these, issue the debugger
    help option, which should give you what you need to know to use any of the supplied
    commands.


    12'
  merge: -1
