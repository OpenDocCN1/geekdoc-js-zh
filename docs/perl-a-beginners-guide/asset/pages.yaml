  md: '# 164 Perl: A Beginner’s Guide


    ![](img/2070407c4a70134aab89572f10d21e60_187_0.png)


    **Question:** Maintaining my programs and packages in directories sounds like
    a good idea, but I need to organize a LOT of files—more than I want to create
    directories for each. Is there a better way to organize these files?


    **Answer:** Yes. Several applications out enable you to create “trees” of code.
    So, for instance, you might create a Web site tree, and within that tree, you
    might have a “branch” for your forms, another branch for personalized pages, and
    so forth. These applications also enable you to control access to programs for
    editing and version control. The process is rather simple: if you need to make
    a change to a program, you can check out the script, which blocks others from
    using it, and then check in again. Microsoft has a product called SourceSafe (https://msdn.microsoft.com/ssafe)
    and an Open Source product called Concurrent Versions System (CVS) can also be
    used. You can get more information on CVS from http://www.cyclic.com. Other products
    are also available, but these are two of the most popular.


    That’s enough preaching on organization for now. Let’s move into how you can actually
    create code segments in your programs.


    # Creating Code Segments


    Creating code segments isn’t a complex task if you think about how your program
    is going to be structured. It does, however, involve some preliminary planning
    on your part and the ability to adapt your decisions if you find other changes
    are necessary once you start programming. Being a good programmer is not only
    knowing how to program in a particular language, but also how well your planning
    and programming style measures.


    Before you start, you should decide what the functional parts of your script are
    and how they should flow logically. This involves the grouping of functionality,
    potentially reusable, into process parts, followed by the consideration of the
    logical flow of your program. In other words, you can reuse stuff, put it in subroutines,
    put all common components in common'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Module 5: Program Flow and Subroutines 165


    locations (that is, subroutines at the bottom, global variable declarations at
    the top), and write the main body of your code so it flows in a way that makes
    sense. This is best explained with an example, so let''s step through one.


    Say we''re creating a script that can open a text file, count the number of lines,
    and then write the number to a separate file. Several steps are involved in accomplishing
    this task, but they can be summed into the:


    +   1. Opening the input file for reading


    +   2. Opening the output file for writing


    +   3. Count the number of lines of the input file


    +   4. Writing the result to the output file


    +   5. Close the input and output file


    The first thing we need to do is open both input—Step 1—and an output—Step 2—file.
    This is done using the Perl open () function. This function takes a filehandle,
    which is a string used by your code to refer to the opened file and the name of
    the file it is to. In addition, we want to see if the file successfully opened,
    so we include a little error checking. The code we use to accomplish these first
    two steps is


    ```

    # open our input and output files

    open(INFILE, "input.txt") or die "Error (input): $";

