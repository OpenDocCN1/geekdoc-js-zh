  md: '# 314 | Perl: A Beginner''s Guide


    In Module 6, you got your first taste of using Perl in the real world. Then, in
    Module 9, you used Perl to access databases. Now it''s time to look at another
    way to use Perl—creating Common Gateway Interface (CGI) scripts.


    CGI scripts, or programs, which are sometimes called, are often used to create
    HTML pages dynamically. These pages could be anything from a Web-based shopping
    cart at your favorite e-commerce store or simply a result page for a user who
    just submitted her contact information. CGI scripts can be a powerful tool for
    Web developers, and using Perl as the language of choice for your CGI scripts
    is by means no bad one.


    > Hint

    A CGI script is a program that runs on the same system as the Web server and conforms
    to the CGI standard. For more information on the CGI standard, check out http://hohoo.ncsa.uiuc.edu/cgi.


    In this module, we look at how to use CGI and Perl. During this module, we also
    show you how to handle information submitted via HTML forms, which may be your
    most useful case of combining CGI and Perl. But, before we discuss the more complex
    details of CGI programming, let''s look at some general concepts.


    # What Is CGI?


    CGI is a standard for interfacing external programs, such as Perl scripts, with
    an HTTP server. The words “common” and “gateway” refer to the common variables
    and conventions (hence, the term "interface") used to pass this information to
    and from the HTTP server. CGI lets you use these custom programs to format and
    process output to browsers.


    Each time a user requests a URL corresponding to a CGI script, the Web server
    invokes the program, passing the information sent from the browser to the script.
    This information includes various HTTP headers sent by the requesting browser
    and any information passed along with the URL, such as query string information
    (more on later). The CGI script is then able to read, process, and return an appropriate
    response based on this information.'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# Module 10: Writing CGI Programs


    In a nutshell, this is what CGI is and how it works. Because it can perform complex
    processing, such as accessing a database, while executing, we''ll look a little
    deeper into some of the details behind CGI and how it can be used on the Web.


    # Quick Introduction to CGI.pm


    Most HTML is independent of the operating system running on the server. CGI, however,
    can be heavily reliant on the operating system and the HTTP server you are running.
    This could be anything from path delimiters (remember how Windows uses \, UNIX
    uses /, and Mac OS uses :) to how programs execute. For this reason, we use a
    common Perl module, called CGI.pm, for our scripting. The author of this module
    has written it so it can be used with the following systems:


    +   * DOS

    * Mac OS

    * Microsoft Windows

    * OS/2

    * UNIX

    * VMS


    # Hint


    Do you want more information on the CGI.pm module? Check the docs with your Perl
    distribution and you should find more information with the library (check the
    lib directory of distribution).


    # CGI Programming Language Options


    CGI programs can be written in any number of programming languages as long as
    the program can be executed on the system running the Web server. Some common
    choices for writing CGI scripts and UNIX are the shell scripting languages, such
    as Bourne, C, or Korn shells, and/or various programming languages, such as C/C++,
    Perl, and Java. If you''re using'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# 316 | Perl: A Beginner''s Guide


    a Windows Web server, you can also use Windows-specific languages, such as Visual
    Basic or Delphi for these scripts.

    GI programs reside in a directory that the Web server uses to execute the program.
    For example, on most UNIX systems, these programs are typically stored in a directory
    named cgi-bin and end with a .cgi extension. Windows systems, on the other, store
    these programs in a scripts directory. On the Mac OS, no real default folder exists.
    We won''t worry about this right now because we step through checking your Web
    server and setting it up quite later.


    So, with all of these choices, what language should you use to create your CGI
    scripts? Even though this may be left up to you in the real world, the most commonly
    used language is Perl, which is, of course, the focus of this module and this
    book!


    # Using Perl for CGI Scripts


    Using CGI scripts on your system isn''t terribly complex. Because this book addresses
    the Windows, UNIX, and Mac OS platforms, we take a quick look at how you can get
    it up and running on your system. To ensure the system is running correctly, use
    the following CGI script, which we name test.pl to test your setup. Don''t worry
    about the code means—we cover that later.


    ```

    #!/usr/bin/perl -w


    use CGI;

    $Query = new CGI;

    print $Query->header;

    print $Query->h1("It Worked!");

    ```


    Now, look at setting it up on your system.


    > Hint

    Because CGI.pm has built-in support for debugging from the command line, it''s
    a good way to find any problems before you run through your Web server.'
  merge: -1
  pgno: 339
