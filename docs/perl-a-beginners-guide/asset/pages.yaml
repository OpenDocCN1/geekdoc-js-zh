- img_proc: true
  md: '# Module 1: Introduction to Perl 5


    So enough talk, let''s get started! In this first module, you learn a bit of background
    and the foundation for the experience you will gather while you read this book.
    You learn some history on the language and some good programming techniques. You
    even start and complete your first script! The objective is simple: to introduce
    you to the language in an easy to understand, and nonthreatening manner.


    # Note


    Perl programs are commonly called scripts, so the terms “programs” and “scripts”
    are used interchangeably in this book. Treat them as the same.


    # The History


    As mentioned in the opening paragraphs, Perl is one of the older programming languages
    when it comes discussed for Web users. Its origin dates back to 1987 and since
    then, Perl has seen four major versions, and one semijor release. Today, Perl
    boasts one of the largest groups of programmers and you find the loyalty within
    the tight group of users matches that of Linux, OS/2, and the Mac OS.


    Because of its rich history, you should know some Perl background. So, in this
    first section of the book, you learn about the early days of Perl, and then move
    into version 4, next learn about the advanced version 5 added, and then learn
    about the latest and greatest version of the language: Perl 5.6.


    # The Beginning


    Larry Wall, the author of the language, first released Perl to the usenet group
    comp.sources on October 18, 1987. This new language, which was distributed free
    of charge by Mr. Wall, was derived from the C programming language and was further
    influenced by languages such as BASIC, awk, sed, and the UNIX shell. Perl took
    the best of all these worlds and wrapped them into a single, functional language.


    People, with little or no programming experience, were able to pick it quickly
    and start programming with Perl. In addition to its ease of learning, Perl was
    simply a useful language. From the beginning, Perl had'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# 6 Perl: A Beginner’s Guide


    an unbelievable capability to manipulate text, files, and system processes.

    This free, easy, and useful approach allowed the Perl language to catch on quickly.


    Today, Perl is maintained by a core group of volunteers (the “Perl Porters") and
    programmers around the world. Like Linux, Mozilla, sendmail, or any other open
    source effort, Perl has tapped the world as its development team, and leverages
    the knowledge of many to provide us with the best possible language for our work.


    # Up to Perl 4


    After Perl 1.0 came Perl 2.0, which was released on June 5, 1988. By this time,
    the number of Perl programmers had grown, and did the use of the language. Many
    different types of programmers were using for everyday tasks and individuals within
    major corporations promoting the language.


    A year and a half passed before the world saw Perl 3.0, which was released October
    18, 1989, some two years after 1.0 hit the wire. With this release, Perl was first
    distributed under the GNU General Public License (GPL) version 1.0, which allows
    for the distribution of free software. By this time Perl had taken off.


    Thousands of programmers were using it and the Web, which was in its infant stage,
    really gave Perl a boost. Perl had been widely used by UNIX administrators, but
    was quickly becoming the standard for writing CGI scripts for processing data
    sent on the Internet. CGI is covered in Module 10, so it won’t be discussed in
    detail here, but do note, it is a significant module in the history of Perl.


    Then, in March of 1991, Perl 4.0 was released under the GPL as well as the new
    Perl Artistic License. This is the version of the language with many Perl programmers
    started. Perl was now a fairly mature language that had a robust set of functionality,
    although it did suffer from some performance problems.


    > Tip For more information on the GNU Licenses see their Web site at http://www.gnu.org.
    There you can read information on the GNU GPL.'
