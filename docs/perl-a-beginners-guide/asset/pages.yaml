  md: '# Module 7: Regular Expressions 239


    # Note


    From the previous programming example, the pattern "f" wasn''t found at the end
    of the string because we added a period after it. The "^" and "$" pattern anchors
    require the pattern to be at the very beginning and the very end of a string.


    In addition to using these pattern anchors by themselves, you can also use them
    together for one particular pattern. When you do this, you are effectively saying
    you the entire string to match the given pattern exactly. The following is an
    example regular expression that uses both of these pattern anchors:


    ```

    $string ~ /^Hello$/

    ```


    The only string that can satisfy this regular expression is "Hello". If any other
    characters are present, the regular expression cannot find a match.


