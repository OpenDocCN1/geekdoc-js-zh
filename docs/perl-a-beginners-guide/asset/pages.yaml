    You''re probably wondering why anyone would use octal or hexadecimal numbers in
    their programs because these numbering systems seem confusing. The reason is these
    types of numbers make it easy to access the memory locations of a computer. Memory
    is addressed in binary numbers. Binary numbers are of the base 2, which means
    they can only have two different values—0 or 1. In comparison, octal numbers are
    of the base 8, and hexadecimal numbers are of the base 16. Because the bases for
    these numbers are multiples of 2, it''s easier for you to represent a memory location
    using them.


