  md: '# 192 Perl: A Beginner''s Guide


    This module covers the topics of how to work with files and directories.

    In the first section, we discuss how to work with files and go over

    every you can do with files using Perl. Then we move to the next

    section of the module, which covers how to work with a directory system,

    how to move around in a directory structure, and how to create and remove

    directories. Both of the sections introduce you to commands that vary,

    dending on what operating system you''re using. Remember this as you

    read through this module.


    # Basic File Manipulation


    Working with files using Perl is both simple and straightforward. Some

    new ideas may be introduced in this module, but don''t worry about them.

    We explain them all in detail. The first thing to do when you work with a

    file is to open it. Once you open the file, you can make the necessary

    changes, and then you can close it. These are the basic steps in working

    with files and the next section covers both these tasks.


    # Opening and Closing Files


    When you are opening a file from a program, you are automatically

    working with the current directory. The current directory is determined

    by where you are when you execute the program. If the file you want

    is open in your current directory, you only have to give the name of that

    file. If the file is in another directory, you need to include the path to the

    file along with the filename. Also, when you open a file, you create a

    file variable named a file handle, which can be used to select that

    particular file for other operations you may want to perform on it. Here''s

    t syntax to open a file:


    ```

    open (file handle, filename);

    ```


    In this statement, file handle is the name of the variable you give the

    file itself. This variable is used whenever you need to call the file for

    any future operation, such as closing it. Filename is the name of the file

    you want to open. If the file is in your current directory, you

    only need to provide the name itself. If the open operation was a success,'
