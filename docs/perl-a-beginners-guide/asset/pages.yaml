    # Figure 12-10 Stepping through using the S command


    If you are using the S command to step through a program and you can enter a subroutine
    you don''t want to execute one line at a time, you can enter the r option, which
    executes the next line of the subroutine you are currently in and returns you
    to the next line of code to be executed after it. The r command is entered just
    like the S command.

    You run into situations when you don''t want to iterate through every subroutine
    in a program when debugging. The debugger has an option you can use to execute
    subroutines automatically in their entirety. This command is the n command, which
    is issued the same as the S command. When a call to a subroutine is encountered,
    the debugger jumps to the subroutine, executes it completely, and returns you
    to the next statement to be executed after.


    # 12


    Note A good time to use the n option when you are using library-type subroutines
    that should be error-free. This option enables you to attempt to debug only your
    own code and not waste time looking at error-free subroutines.'
