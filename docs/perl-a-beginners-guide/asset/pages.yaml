  md: '# Module 5: Program Flow and Subroutines 163


    format text output, then you should put these subroutines near each other. In
    addition, try to declare global variables or any global elements in a common location,
    so you can easily find and change them if needed.


    # Your Program Repository


    Organization from a repository standpoint is also important. If nothing else,
    you should keep similar programs in organized directories. This enables you and
    anyone else using your programs to find the program or package needed quickly.
    Yes, programs like grep do quickly search through directories and files for specific
    keywords, but this isn''t quick when you have tons of programs. And who wants
    to learn every possible option need to run the exact grep command your request
    demands? Here''s a quick example.


    Programs, for instance, that deal accepting submissions on the Web could be kept
    in a www directory. You might even go one step further, depending on the number
    of programs you have, by adding directory levels. If one set of forms is related
    to shopping on your site, then you might have it in a www/shopping directory.
    If another set collects user data, then you should store those in a www/userdata
    directory. Whatever level or breakdown you deem necessary is better than no organization
    at all. But, remember, good, descriptive directory names in local locations can
    ease your retrieval of programs.


    # Note


    In the directory examples just mentioned, we used a forward slash (\/") to represent
    a directory, which is the method used on UNIX systems. For Windows systems, you
    should use a backslash ("), although Perl commonly accepts forward slashes. For
    Mac OS systems, use the colon (\:) to signify a change in folders.


    As you can see, organization is important when programming. Without organization,
    chaos can ensue and managing your scripts will be difficult to impossible. With
    that comes many late nights and headaches. Perl provides several methods for organization
    and with good programming practices, you can use them for your advantage.'
