    # Temporary Data with local()


    The local() function enables you to declare variables that are local to a subroutine.
    This means, in general, these variables are inaccessible outside the subroutine
    and, if they contain the same name as a global variable, the global variable is
    unaffected by any manipulation that occurs within the subroutine. An exception
    does exist, however. If nested subroutines within the first one (the one with
    the local() declaration), then, it too, has access to the variable. You see this
    in an example little later.


    So, why would you want to use the local() function? When writing code you might
    want to create variables that are only seen within a certain scope—you only want
    part of your program to see and understand that variable. For instance, say you
    have to use a counter to count the number of times you call a given subroutine
    or go through a loop in subroutine. But, you have five different subroutines you
    want to maintain counts for and they are called at different times. This prevents
    you from declaring one variable and resetting it within each subroutine, because
    the previous count would be lost.


    One solution would be to define five different variables. This seems like a waste
    of time and coming up with five different names for the same thing doesn''t make
    sense either (this especially doesn''t make sense if you have 100 variables!).
    Using the local() function, you can define a variable of the same name, say, $counter,
    within each subroutine without having them overwrite each other. To give you a
    better understanding, here''s an example we named local-ex.pl.


    ```

    #!/usr/bin/perl -w

    # Script Name: local-ex.pl

    # Script Version: 1.0

    # Date: 10.16.2000

    # Author: R. Allen Wyke

    # Description: This script demonstrates how the local() function

    # works in Perl.

    ```'
