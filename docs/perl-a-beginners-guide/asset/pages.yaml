    # How It Works


    First and foremost, you should understand Perl is an interpreted language, not
    a compiled one like C or C++. What this means is Perl programs are not compiled
    into binary (1s and 0s) before you can run them. In fact, you, as the programmer,
    don''t compile Perl programs at all—you simply create a text file with your Perl
    code.


