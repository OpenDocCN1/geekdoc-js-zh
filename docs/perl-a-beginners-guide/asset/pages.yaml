  md: '# Module 1: Introduction to Perl 35


    | Option | Description |


    +   - -m[module] | Executes use module() before the program


    +   - -M[module] | Executes use module() before the program, but you can add extra
    code in quotes that the interpreter to assume a loop over your program, which
