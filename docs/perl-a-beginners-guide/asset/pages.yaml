    several "backslash" operators can be used within a string to change its format.
    A subset of these operators can be used outside of a double-quoted string to get
    the same result. Let''s look at the new functions and how they compare to those
    you''ve already learned about.


    | Function Operator Result |

    |---|---|---|

    | lc | \L | All letters in the string are converted to lowercase |

    | lcfirst | \L | Only the first letter in the string is converted to lowercase
    |

    | uc | \U | All letters in the string are converted to uppercase |

    | ucfirst | \u | Only the first letter in the string is converted to uppercase
    |


    Now let''s look at a coding example of these new functions in use.


    ```

    #!/usr/bin/perl

    $name = "Jack"; #store Jack into a variable

    $name2 = "Jill"; #store Jill into a variable

    $newname1 = lc $name1; #make all characters lowercase

    $newname2 = uc $name2; #make all characters uppercase

    print "name1 is $name1"; #display name1

    print "name2 is $name2"; #display name2

    print "newname1 is $newname1\n"; #display newname1

    print "newname2 is $newname2\n"; #display newname2

