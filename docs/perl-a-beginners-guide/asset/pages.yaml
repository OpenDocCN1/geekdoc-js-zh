  md: '# Array Slices


    The next topic we''re going to cover in this module is the concept of an array
    slice. An array slice refers to two or more elements of an array that are accessed
    at the same time. Earlier in this module, we showed you how to access the elements
    of an array, one at a time. Given an array name like @array, you access an element
    of that array by using the following line of code:


    ```

    $value = $array[0];

    ```


    In this case, the $ character is used in front of the array name because only
    one element is being accessed. Remember, we said if you are accessing singular
    data, you always use the $ character. Now that we''re talking about an array slice,
    you are accessing more than one element, so you no longer have to use the $ character
    in front of the array name. Here''s a programming example to demonstrate the use
    of array slice:


    ```

    #/usr/bin/perl The array assignment      The arrayslice1

    @array = (2 .. 11); ←      contains the first, third, and

    print "The main array contains @array \n";      fifth elements of the main array

    @arrayslice1 = @array[0,2,4];

    print "The array slice now contains @arrayslice1 \n"; ←

    @arrayslice2 = @array[1,3,5];

    print "The array slice now contains @arrayslice2 \n";

    print "The elements of an array slice are used to create another

    array slice : \n"

    @slicefromslice = @array[0,1];

    print "The slice created from arrayslice1 contains @slicefromslice \n";

    ```


    The arrayslice contains the first and second elements of the arrayslice @arrayslice1


    The arrayslice @arrayslice2 contains the second, fourth, and sixth elements of
    the main array


    The output of the previous programming example can be seen in the following illustration.'
