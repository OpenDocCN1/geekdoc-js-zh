  md: '# 270 Perl: A Beginner’s Guide


    Fortunately, this is simple. All you must do is use the package statement followed
    by the name of the package at the top of your library file.

    This defines the namespace to be assigned to the subroutines in the library, users
    of the subroutines can properly use them. If, for instance, you had a package
    named MyPackage, you would expect to use the following line at the top of your
    file. This, again, creates a namespace that is held constant for all the items
    in the file until the end is reached.


    ```

    package MyPackage;

    ```


    This takes care of your package and defines it to the Perl interpreter as a library.


    # Hint


    You can actually do other interesting stuff with this statement, so we recommend
    you check the Perl manpage entry in perfunc for more information.


    # The Exporter Module


    The Exporter module is a module shipped with Perl, which more or less organizes
    the process of exporting items from your module. It provides mechanisms for version
    control and other functionality. We only discuss some of the functionality of
    the Exporter module provides, but if you want more information on this module,
    check your Perl documentation (look under the use( \) entry in the Perl manpages
    for a link).


    The general syntax for using this module in a module is as follows, where Module
    is the name of the module. We discuss @EXPORT, @EXPORT_OK, and %EXPORT_TAGS in
    the following subsections, so don’t worry about those.


    ```

    package Module;

    require Exporter;

    @ISA = qw(Exporter);

    @EXPORT = qw(...);

    @EXPORT_OK = qw(...);

    %EXPORT_TAGS = (tag => [...]);

    ```'
