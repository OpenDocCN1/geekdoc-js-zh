  md: '# Module 10: Writing CGI Programs 317


    # Windows


    Several popular Web servers run on Windows, such as the Netscape/iPlanet line
    and Apache but, but for this exercise, we discuss Microsoft’s Internet Information
    Server (IIS) and Personal Web Server, which is nothing more than a stripped version
    of IIS. For the book’s screen shots and some of its commands, however, we demonstrate
    how to run Perl CGI scripts on Windows NT/2000.


    First, make sure the World Wide Web Publishing Service is installed and running.
    You can quickly check this by opening the Services Control Panel—it should be
    one of the last items listed. If you don’t see the service, then click the Add/Remove
    Programs icon in the Control Panel. From there, you can access a list of Windows
    components that can be installed on the machine.


    If you are running Windows 2000, you can install IIS 5. If you are running Windows
    NT 4, this installs IIS 2. For optimal performance on your system, download the
    Windows NT 4.0 Resource Kit from Microsoft (http://resourclink.mspress.com/reslink),
    which provides IIS 4. Also make sure you reapply the appropriate Service Pack
    for your system.


    # Hint


    Want more information on how you should install IIS? Check out http://www.microsoft.com/ntserver/nts/deployment/planguide/Install.asp.


    Once IIS is installed and running, you’re ready to install Perl for ISAPI, which
    comes we call the ActivePerl 5.6 distribution. This is nothing more than what
    we call a CGI-engine for running CGI programs, which is a bit more efficient than
    running against the perl.exe interpreter. Perl for ISAPI is a dll version that
    loads into memory once and requires resources.


    If you already had IIS installed and running when you completed the ActivePerl
    5.6 installation in Module 1, “Introduction to Perl,” and you’re ready to go.
    select to install the Perl for ISAPI component, and then you ready to go. If not,
