    \$text1 = <STDIN>;

    print EXAMPLE "$text";

    print EXAMPLE "$text1";

    close (EXAMPLE);

    open (EXAMPLE, ":<d:Perl|book/test/example.txt") || die("Could not open example.txt:
    \n");

    print "Now we have opened the file for read access only \n";

    read (EXAMPLE, $contents, 2000);

    print "The file contains the following \n\$contents \n";

    close (EXAMPLE);

    ```


