    ```

    chmod (mode, filename);

    ```


    The mode is where you enter the octal representation for the

    permissions you want to select for a file. The filename is where

    specify the name of file for which you want to set the new

    permissions. The following is an example of this function being used:


    ```

    chmod (0744, "output.txt");

    ```


    When this statement is executed, the file output.txt will have rwx

    permission for you, r permissions for UNIX group, and r permission

    for anyone who has access to your files. To make sure all is clear,

    let''s look at it mapped out for you.


    | Groups | user | group | world |

    | --- | --- | --- | --- |

    | Octal numbers | 7 | 4 | 4 |

    | Binary numbers | 1 1 | 100 | 100 |

    | Possible permissions | rwx | rwx | rwx |

    | Selected permissions | rwx | r | r |


