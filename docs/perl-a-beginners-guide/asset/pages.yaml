  md: 'specify the pattern that is to be matched—the regular expression—can only be
    evaluated once. What does this mean for you? It means if you''re using a scalar
    variable to contain the regular expression, and the expression is to be evaluated
    more than one time, the expression is locked in after the first time the expression
    is searched for. Even if the regular expression is set to change after each iteration,
    the o option won''t allow it to change. As we said, this option isn''t very useful,
    knowing it''s nice, in case you need it. We covered most of the regular expression
    options you need in writing Perl programs. Now, let''s discuss the available search
    and replace options.


    # Search and Replace


    The search and replace options Perl provides are used to look for certain patterns,
    just like a normal regular expression, and to replace those patterns by a different
    specified string.


    The first search and replace option we discuss is the s substitution option for
    any regular expression, you have to add an s before the first forward slash that
    surrounds the expression. In addition to adding the s, you must also add the string
    that will be used to replace the matching pattern. This replacement string must
    also be enclosed by forward slashes. The following is an example of a regular
    expression statement with the substitution option enabled:


    ```

    $string =~ s/dogs/cats/;

    ```


    In this statement, the regular expression being searched for is “dogs” and whenever
    this string is found, it will be replaced with the string “cats.” Let''s look
    at a programming example that demonstrates the substitution option in use.


    ```

    #/usr/bin/perl

    $string1 = "this-is-an-example-string-that-should-trigger-a-match";nprint "String
    1 contains, $string1 \n";n$string2 = "this-will-also-trigger-a-match";nprint "String
    2 contains, $string2 \n";

    ```'
