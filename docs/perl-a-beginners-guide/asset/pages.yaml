    +   - What does doing a bitwise AND on $? and 128 give you?


    # Using the Function


    The real issues when using the system() function arise from the fact that application
    syntax and commands vary from operating system to operating system. For this reason,
    we decided to break this section into brief Windows, UNIX, and Mac OS subsections
    to address some of the issues. This isn''t because the system() function responds
    differently on these systems but, instead, the systems can execute commands and
    call programs differently across the platforms.


    # Windows


    In our previous example, we already exposed one Windows-specific issue—that the
    system may also write information to STDOUT if an error occurs. Another issue,
    however, how Windows deals with folder and directory paths that include space.
    For instance, the Program Files directory contains a space between the word Program
    and the word Files. If you simply try to pass this as is, you''ll find an error
    is returned.


    For those of you who looked at how the hybrid 16- and 32-bit Windows systems—such
    as 95/98/Me—stores directory names, probably found them stored internally as an
    eight-character name and a three-character extension (a total of eleven characters).
    This, of course, isn''t how they are displayed in Windows Explorer or in open
    folders. Program Files, for instance, is actually program-1.


    If you want to see this, go to a DOS dialog box (or command prompt, as they''re
    often called), which uses the command environment (versus cmd. exe for Windows
    NT/2000), and type cd program~1 on the drive that contains your Program Files
    directory. This changes you into that directory. Now, try typing cd program files.
    Didn''t work, did


    +   - 256


    +   - Tells if a core dump has occurred'
