    Perl provides you with a set of character class abbreviations that can be used
    as a shorthand for different sets of characters. Earlier in this module, you were
    introduced to the dash “-" character and we showed how it can be used to save
    time when designating a range of letters or numbers. These class abbreviations
    are an even shorter-hand method of selecting the complete ranges of characters
    like zero through nine and a through z. The following table lists each character
    class abbreviation and what it represents.


    | Character Class Abbreviation | Represented Character Class | Description |

    |---|---|---|

    \d | [0-9] | Digits |

    \D | [^0-9] | No digits |

    \w | [-a-zA-Z0-9] | Words |

    \W | [^a-zA-Z0-9] | No words |

    \s | [ \t\n] | Spaces |

    \S | [^\t\n] | No spaces |


    As you can see from the preceding table, this character class abbreviations can
    be used as a shorthand to represent different groups of characters. They can be
    used anywhere a normal character is valid in creating a regular expression. The
    following is a short programming example that demonstrates the use of a few of
    these abbreviations.


