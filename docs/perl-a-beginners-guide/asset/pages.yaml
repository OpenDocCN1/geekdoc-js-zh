  md: '# Perl: A Beginner’s Guide


    Welcome to Perl: A Beginner’s Guide. Your purchase of this book shows your desire
    and dedication to learn one of the most widely used programming languages around
    today. Before Java or JavaScript invaded the Internet and surrounding scenes,
    and before the Web was born, Perl had a strong hold in its community. From automating
    UNIX administration tasks, to performing the routine parsing of files, Perl has
    been used as a true utility language.


    # Note


    For the purpose of Perl, when UNIX is referred to, the reference is generic, to
    all flavors, including UNIX-compatible operating systems as Linux. If the system
    has a noticeable difference that needs to be pointed out, then this is done.


    Today, Perl, which means Practical Extraction and Reporting Language, is used
    in many new and creative ways, in addition to the good old reasons. Common Gateway
    Interface (CGI), file processing, Microsoft Windows scripting, graphical user
    interfaces (GUI), database access, name it—Perl can do it. And, in addition to
    being a versatile and useful language, Perl is relatively easy to learn.


    # Note


    When we speak of the Windows platform here, we are referring to the Windows 95,
    Windows 98, Windows Millennium edition (Me), Windows NT, and Windows 2000 editions
    (this is abbreviated 95/98/Me/NT/2000). If you want to run Perl on the Windows
    3.x platform, you must run a version that is compatible with MS-DOS.


    True, some complex angles exist to Perl and some concepts may be difficult to
    understand, but you can ease into those. The purpose of this book is to start
    you on the path toward becoming an accomplished Perl programmer, not to scare
    you off with hard-to-understand terminology and “system talk.” Do not, though,
    that becoming a Perl programmer is more than just scripting code—it is a perspective
    on how to solve everyday problems, tackle cumbersome issues, and live the good
    life with an easy, powerful, programming language.'
  merge: -1
