  md: "# The while Conditional Statement\n\nThe while conditional statement is a useful\
    \ one because it enables you to repeat a statement block as many times as you\
    \ need. The while statement works just like an if-then-else conditional statement\
    \ in that you specify an expression for a true/false evaluation. The one main\
    \ difference, however, is it continues to execute the statement block as long\
    \ as the expression is true. Here's the syntax for a while conditional statement.\n\
    \n```\nWhile (expression)\n{\n  'while' statement block\n}\n```\n\nAfter looking\
    \ at the syntax for this conditional statement and trying to determine a good\
    \ use for it, you probably are wondering how and when the expression will ever\
    \ evaluate to a false value. This is where the autoincrement and autocommit operators\
    \ covered in the last module come handy. You can use these operators to increase\
    \ or decrease the value of a number each time the statement block for the while\
    \ conditional statement is executed. Look at a programming example to make this\
    \ more clear.\n\n```\n#/usr/bin/perl #scalar variable assignment\n$a = 15;\nwhile\
    \ ($a < 25){ #while conditional statement\n  print \"$a is still less than 25\\\
    n\";\n  # #autoincrement operator\n  $a++;\n}\n```\n\nThe autoincrement operator\
    \ increases the value of $a by one each time the statement block is executed\n\
    \nThe statement block executes as long as $a is less than 25"
  merge: -1
  pgno: 109
