  md: 'more in the previous example, the rest of the program would have been traced
    and executed. This is because this command looks for breakpoints, as well as the
    end of a program.


    Another option you have with the c command is to issue temporary breakpoints.
    To do this, all you must do is specify the line number you want the breakpoint
    to be located after the c. Once the breakpoint is reached and you continue to
    step through the program, the breakpoint is automatically deleted.


    Once you finish with the breakpoints you set using the b command, you can remove
    one at a time using the line number that contains the breakpoint. If you have
    multiple breakpoints set, and you want to delete them all at once, you can use
    the d command by itself.


    The next set of options we discuss enable you to view the contents of variables
    at any time during the process of stepping through a program. These are powerful
    tools because they enable you to watch variables as their contents are changing.
    This feature can come handy when you''re debugging a program that isn''t functioning
    properly.


    The first option that lets you do this is the X option. It displays the contents
    of any specified variables in the current package (which defaults to main). This
    option can be issued by itself, but we don''t recommend doing so because it then
    displays all the variables in program, along with the system defined and debugger
    variables Perl uses. The most efficient way to use this command is to specify
    the variable name you want to see. The following command displays the contents
    of a variable called


    ```

    DB(1) X values

    ```


    You needn''t include the dollar sign (or the @ sign if you''re looking at an array),
    in front of the variable name to view its contents. If the line of code that assigns
    the selected variable its contents hasn''t been stepped through, this command
    won''t output anything to the screen because the variable hasn''t yet been defined.
    Figure 12–15 shows an example using the X command to print all the contents of
    an array.'
