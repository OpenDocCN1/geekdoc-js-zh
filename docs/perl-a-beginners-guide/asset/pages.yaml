    print "d:"\nopen(EXAMPLE, "<Perl>book/test/example.txt") || die("Could not open
    example.txt: $!\n");

    seek(EXAMPLE, 20, 0);

    $location = tell(EXAMPLE);

    print "you have skipped $location bytes ahead in the file: $!\n";nread(EXAMPLE,
    $text, 10);

    print "$text\n";nread(EXAMPLE, $text, 10, 10);

    print "$text\n";n$location = tell(EXAMPLE);

    print "you are starting at $location \n";nread(EXAMPLE, $text, 20, 20);

    print "$text\n";

    ```


    This line stores the current file location in bytes from the beginning of the
    file in the scalar variable $location


    The rest of the program is the same as the previous example, except that the first
