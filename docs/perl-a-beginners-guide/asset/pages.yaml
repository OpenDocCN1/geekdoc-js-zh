  md: '# 264 | Perl: A Beginner’s Guide


    In Module 5, "Program Flow and Subroutines," we first introduced you to the concept
    of packages and modules. At that time, we were still deep in the beginning stages
    of Perl, so we decided to delay a in-depth discussion on that topic later in the
    book. Well, that time is now.


    In this module, we discuss Perl packages and Perl modules, which we refer to globally
    as libraries. As we discussed in previous modules, having a good programming style,
    which includes everything from well-documented code to organization, is extremely
    important if you want to succeed as a programmer. Libraries help you from the
    organization standpoint because they enable you to bundle groups of related functions
    into a library. This can help you in several ways.


    First, this enables you to organize your code properly into functional libraries.
    Perl, for instance, may have a group of functionally similar subroutines. What
    the authors of these libraries have done in it for use in other programs. This
    lets you import those subroutines as needed in only one program, but in as many
    programs you choose.


    Besides organization, libraries enable you to share code easily with other programmers.
    In fact, we use prebuilt Perl libraries in this book to create Common Gateway
    Interface (CGI) scripts and programs that access a database. What the authors
    of these libraries and modules have done to build and organize a group of subroutines
    together—this is in the same manner you would organize your own code.


    Although we touched on both the concepts and the definition of libraries in previous
    modules, we now take you through an in-depth discussion. To ensure that we cover
    everything necessary for a beginner, this module is grouped into four sections,
    which are as follows:


    +   1. What is a package?


    +   2. What is a module?


    +   3. How do they work?


    +   4. How can you build your own?


