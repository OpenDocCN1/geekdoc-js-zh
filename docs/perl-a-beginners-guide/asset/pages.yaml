  md: '# Module 12: Error Messages and Debugging


    # Note


    You can use the -w option to turn on additional warnings. This is a command line
    option we cover in the next section of this module.


    Another common practice we recommend is the use of defined warnings. In Module
    6, we discussed using the die and warn functions to print warnings that occur
    because of a problem during a program''s execution. Using these functions is a
    good idea wherever a potential problem could occur during execution. You should
    make your warning messages clear enough so the program user can quickly determine
    what he has done.


    The last common practice we recommend is to attempt executing your programs while
    you are writing them. Waiting until you have a thousand lines of code before you
    try to execute the program is never a good idea. The complete functionality of
    the program won''t be present to check what you have written for syntactical errors.
    Debugging a program as you write save you headaches when the final debugging must
    be performed.


    We discussed syntax errors and some of the common practices we recommend, so now
    let''s move on to the next section of this module and talk about debugging problems.


    # 1-Minute Drill


    +   - How many syntax errors should you attempt to correct at one time?

    - What functions can be used to create your own warning messages?


    # Debugging Your Problems


    The problems that can occur with Perl programs can be separated into two different
    categories: syntax errors and programming errors. Syntax errors are the ones that
    keep your program from running at all.


    +   - One

    - warn and die'
  merge: -1
