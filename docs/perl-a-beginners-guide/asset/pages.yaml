  md: 'steps you through creating your own simple example. We know you want

    to get started, so let''s go!


    # Definitions


    Understanding what something is supposed to be is the first step. Because

    packages and modules may not be self-explanatory, we first discuss the

    defefinition of a package and a module.


    # What Is a Package?


    A package is a set of Perl functions grouped into a single file. This file, also

    called a library and ending in a .pl (and sometimes a .pm) extension, is referred

    to by its filename within your code. A package declares an alternative

    namespace for the variables and/or subroutines within it. The idea of

    this is to avoid overwriting, or stomping on, each other.


    Think of a namespace as being a parallel channel in your code. Because

    a namespace does not overlap the currently running channel (remember,

    it''s parallel) variables can have the same name, but no chance of being

    interpretedted as the other. This is essentially what a package is.


    Now you may say you want to use a variable from one namespace in

    another namespace, don''t worry—you can do that. This is done by

    simple prefixing the variable with the package name and having a double

    colon to separate the two, as in the following:


    ```

    Package::variable

    ```


    # Note


    If you look through old Perl code, you may notice the use of a single colon

    to separate the package name and the variable. This was the syntax for

    older versions of Perl, but it has been deprecated, although it does still

    (currently) work.'
