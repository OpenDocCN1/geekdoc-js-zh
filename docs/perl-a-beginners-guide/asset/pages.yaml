    \ errors, it can be executed. Any program that can be executed can be run in conjunction\
    \ with the Perl debugger. The last section of this module focuses on using the\
    \ Perl debugger. We also discuss the -w command line option before we finish this\
    \ module.\n\n# Understanding Error Messages\n\nMost of the error messages you\
    \ see in Perl are syntactically related. Until you rid a program of all its syntax\
