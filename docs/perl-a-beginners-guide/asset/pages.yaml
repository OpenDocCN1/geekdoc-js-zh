  md: "# The next Control Statement\n\nThe next control statement can be used inside\
    \ a loop to skip the rest of the block during an iteration and continue until\
    \ a normal loop termination occurs. The syntax for the next statement is as follows.\n\
    \n```\nnext;\n```\n\nHere's a programming example that uses a while loop and the\
    \ next control statement.\n\n```\n#!/usr/bin/perl\n$a = 15;\nwhile ($a < 25) {\n\
    \    $a++;\n    next if ($a == 20);\n    print \"$a is still less than 25\\n\"\
    ;\n}\nprint \"exiting\";\n```\n\nThe following illustration shows the screen output\
    \ for the next control statement programming example.\n\n![](img/2070407c4a70134aab89572f10d21e60_123_0.png)\n\
    \nLooking at the illustration, you can see the print statement for the $a loop\
    \ iteration was skipped and the loop continued executing until its normal termination."
