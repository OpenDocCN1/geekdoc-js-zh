  md: '# Module 8: Packages and Modules | 267


    +   - How to access, load, libraries into your scripts


    +   - How the subroutines in the packages and modules are exported, so you can
    understand how to create your own


    # # Constructor and Destructor


    When a package is loaded, the first thing the Perl interpreter looks for is the
    BEGIN subroutine, or the constructor. As mentioned earlier in the book, everything
    in this routine is executed before the script continues. If you want to declare
    any special variables or pull in any other packages for your package, this is
    where you do it.


    On the flipside this is something we call the destructor—this is the last thing
    the Perl interpreter looks for exiting the scripts. If you need to perform any
    last tasks in your package before the scripts stop executing, such as writing
    to a log file, you include this functionality in the body of an END subroutine.
    This END subroutine is the destructor.


    Now that you know all packages, let''s move on to modules, which inherit everything
    we''ve said about packages up until this point.


    # # Loading Libraries


    Before you can use any subroutines or access any properties in a package, you
    must first tell the Perl interpreter you want to use a particular package. This
    can be done using the following methods.


    use()

    The use () function in Perl lets you import semantics into the current package
    from the named module at compile time. The syntax for this function is as follows,
    where Module is the name of the Module, LIST is a list of subroutines you want
    to import, and VERSION is the version of Perl you need to import and use the library
    successfully.


    ```

    use Module LIST

    use Module

    use VERSION LIST

    use VERSION

    ```


    ![](img/2070407c4a70134aab89572f10d21e60_290_0.png)'
  merge: -1
  pgno: 290
- img_proc: true
  md: 'To give you an idea of what this might look like in real code, here are four
    examples, one from each of the syntax definitions:


    ```

    use mymodule.pm qw(sub1 sub2 sub3);

    use mymodule.pm;

    use mymodule.pm 5.6.0 qw(sub1 sub2 sub3);

    use 5.6.0

    ```


    The first thing you''ll ask is what is the `qw()` function? This is simply a shorthand
    for specifying items you wanted quoted and separated (triggered by white space).
    In our example `qw(sub1 sub2 sub3)` is the same as `''sub1'', ''sub2'', ''sub3''`,
    which is the parameter list the `use()` function takes to determine which subroutines
    you want to import.


    # require()


    The `require()` function, which isn''t quite as powerful as `use()`, lets you
    demand the semantics specified by `EXPRESSION`, as shown in the syntax definition,
    to be included in the program for proper execution when called. Part of the reason
    this is preferred over `use()`, is because it isn''t loaded when the program is
    started. So, for instance, if the file doesn''t exist, then you don''t discover
    this until it reaches that point in your script versus when the script is started.


    The syntax for this function is as follows, where `VERSION` the version of Perl
    you need to run your script successfully, which also implies import and use the
    library.


    ```

    require VERSION

    require EXPRESSION

    ```


    The `EXPRESSION` is a module name, without the `.pm` extension, and the path to
    it, using : : as the path delimiters. To give you an idea of what this might look
    like in real code, here are two examples, one from each of the syntax definitions.
    The second assumes `MyModule.pm` is in a MyDir directory.


    ```

    require 5.6.0;

    require "MyDir::MyModule";

    ```'
