    Another array function is the sort function, which is used to sort the contents
    of an array. This function sorts elements in terms of their ASCII values. To refresh
    your memory, let''s review what that means for numbers and strings.


    When numbers are sorted by their ASCII value, they aren''t placed in numerical
    order. The sort function looks at the leftmost digit of a number to determine
    where that number should be in a sorted list. If two numbers have the same first
    digit, the next digit is used in the comparison. Remember, that sort always begins
    with the leftmost digit. As an example, if you run the sort on an array that contains
    two numbers—300 and 8—300 will be the first element in the new array because the
    ASCII value of 3 is less than the ASCII value of 8.


    Sort follows the same rules for strings. It looks at the leftmost letter and determines
    the ASCII value of that. If the leftmost letters are the same, it goes to the
    next letter until it finds two letters that are different. Remembering all this,
    here''s a programming example that uses the sort function on a few different arrays:


    ```

    #/usr/bin/perl

    @array = qw(one two three four five six seven eight nine ten);

    print "The original array contains \n";n@sortedarray = sort(@array);

    print "The sorted array contains @sortedarray \n";nprint "The original array still
    contains @array \n";n@array1 = (500, 9, 2000, -11000, 25, -27);print "The original
    array1 contains @array \n";n@sortedarray1 = sort(@array1);

    print "The sorted array1 contains @sortedarray1 \n";

    ```


    @array is sorted and the new array is stored in @sortedarray

    @array1 is sorted and the new array is stored in @sortedarray1'
