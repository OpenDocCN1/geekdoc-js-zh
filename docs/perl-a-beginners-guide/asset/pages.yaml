  md: '# Module 2: Scalar Data


    Double-quoted strings have another additional feature that single-quoted strings
    don''t support. Inside a double-quoted string, you can add a variable and the
    value of that variable will be displayed instead of the variable name. This process
    is called variable interpolation. Here''s a simple example of how variable interpolation
    functions in a program.


    ```

    #/usr/bin/perl <- Path to Perl binary Variable assignments

    $Name = "Foo"; #the variable $Name contains the string "Foo"

    $Message = "Hello $Name"; #the variable $Message contains the string "Hello $Name"

    print $Message;

    Output the contents of $Message to the screen

    #When this line is executed, the $Name variable

    is interpolated into its value. This

    #statement will print Hello Foo to the screen

