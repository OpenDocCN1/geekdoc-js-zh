  md: '# Module 8: Packages and Modules 269


    no ()

    The no () function is essentially the opposite of the use () function and is a
    way to specify you don''t want to import certain functions. You might ask why
    you would need this function, but think of this way. If you have a module that
    contains 100 subroutines that could be imported and you want to import all but
    5 of them, then it''s easier to use () the entire module and specify those subroutines
    you don''t want with a following no () function, rather than to list the 95 you
    do want with use (). The syntax for no () is as follows, where Module is the name
    of the Module and LIST is a list of subroutines you don''t want to import.


    no Module LIST


    do ()

    Although using the do () function in include subroutines from a library file is
    technically possible, it isn''t recommended for beginners. We won''t show you
    this method, but we wanted to let you know it could be done, just in case you
    see it in someone''s code.


    > Tip

    For more information on the do () function, check the perlfunc manual.


    # 1-Minute Drill


    +   - Why should you consider using use () rather than require ()


    The package Statement

    Now that you understand how to load libraries in your scripts, it''s time to see
    how this is possible. Before we talk about how subroutines are exported, it''s
    important to understand what makes a package package.


    +   - Besides the fact that use () provides a bit more functionality, it is also
    executed by the interpreter when the script is first loaded. So, no hidden traps
    in the middle of your script''s execution when a library cannot be found or accessed.'
