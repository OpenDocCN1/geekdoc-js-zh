  md: '# Module 12: Error Messages and Debugging


    Another useful option you have when stepping through a program is the capability
    to set breakpoints. A breakpoint is something you can set a specific line that
    tells the debugger to execute everything up to the specified line. A breakpoint
    can be set using the b command. When you set a breakpoint, you have several options.


    First, you can set a breakpoint at any line in a program.


    # Note


    If you want to set a breakpoint on a multiline statement, you should always select
    the first line to do so.


    Setting a breakpoint on a line is is simple. The following command sets a breakpoint
    on line five of your program:


    ```

    DB(1) b 5

    ```


    Breakpoints can also be set on a line along with a conditional expression that
    must be evaluated. For example, you can specify that a variable must be equal
    to a certain value before the breakpoint is valid. You can do this using the following
    command.


    ```

    DB(2) b 5 ($value = 5)

    ```


    Another way to set a breakpoint is to specify a subroutine name. You can do this
    using the following command.


    ```

    DB(3) b subroutine

    ```


    When you specify a subroutine as a breakpoint, the actual breakpoint is set at
    the first line of code in the subroutine, not the call to it. You can use the
    l command to list all the breakpoints you have set in the program. Let''s look
    at our example program with a breakpoint set on line five.


    You can see in Figure 12-12 we first set a breakpoint on line five of the program.
    Then we used the l command to list all of the breakpoints currently set. We also
    used the l command to list the first ten lines of the program.'
  merge: -1
