  md: '# 162 Perl: A Beginner’s Guide


    In Your Code

    From a coding standpoint, you can do several things for organization. These are
    simple requirements yet, if they’re followed, they can drastically increase the
    readability and editability of your programs. These requirements are grouped into
    the following areas:


    +   * Comments We can not stress this one enough—you MUST document your code with
    good and detailed comments. We touched on this concept in Module 1, so refer to
    that module if you want some pointers on how this is done technically and how
    it should be done from a programming perspective.


    Good comment:


    ```

    # Calculate a cost-of-living adjustment

    # raise the employee’s salary by that amount:

    $salary += $salary * $col_percentage;

    ```


    Bad comment:


    ```

    # Increment salary by salary times col_percentage:

    $salary += $salary * $col_percentage;

    ```


    +   * Subroutines If you have anything that must be performed multiple times in
    your or other programs, you should create subroutines. For instance, if you need
    to adjust the case of all users’ input, you might want to create a subroutine
    that automatically performs this task with a single call. Placing this sort of
    code in a subroutine enables you to reuse it in your script, as well as in other
    scripts that need the same functionality.


    +   * Modules and Packages Subroutines and properties with a common theme, which
    are designed to be exportable and reusable, are called *modules*. These modules
    are stored in *packages*, which are library files of the same name. This enables
    you to include these subroutines and properties contained in variables, in any
    and all programs they’re needed.


    +   * Segments If you organize your code in segments, whether they are functional
    or logical, then it makes for an easy time when you debug your scripts. For instance,
    if you have several subroutines that'
  merge: -1
