  md: '# Module 7: Regular Expressions


    From the previous example, you can see the regular expression satisfied as long
    as the string contained either "2000" or "2001".


    Another tool that Perl provides when working with regular expressions is the capability
    to save portions of a regular expression. Once the pieces have been saved, they
    can be reuse'' or the actual pattern that triggers a match can be saved into a
    scalar variable. The parenthesis symbols "(" and ")" are used to designate sections
    of a regular expression to be saved.


    Once you save a portion of a regular expression, you can do two things with it.
    You can reuse the pattern over again as part of the same regular expression, which
    saves you from having to type the pattern repeatedly, or you can actually save
    the string that triggers the match for the selected portion of the expression.
    Here''s how to reuse a pattern, or patterns first.


    Before we talk about patterns, look at the following example that demonstrates
    the use of the parenthesis symbols in a regular expression:


    ```

    $string ~ /([a-z]+)([-])[a-z]+[-][a-z]+/;

    ```


    For this example, we put the parentheses around the first and second parts of
    the regular expression, which finds as many letters from a to z as you can until
    you see a dash. Even though we put the parentheses around the first and second
    parts of the expression, we didn''t demonstrate their special functionality. Now,
    let''s look at a simplified expression that uses the power of parentheses. The
    following regular expression uses was matched in the parentheses over again as
    part of the expression to search.


    ```

    $string ~ /([a-z]+)([-])\1\2/;

    ```


    We noticed a backslash character and either a one or two as part of the regular
    expression this time. When you put parentheses around portions of a regular expression,
    you are effectively saving the matched text and each is automatically given a
    number that starts with one moving from left to right. This means the first match
    we saved is associated with one, and the dash match is associated with two you'
