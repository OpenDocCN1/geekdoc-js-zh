  md: '# Module 10: Writing CGI Programs


    # Understanding Forms


    Now that you have your Web server up and running Perl CGI scripts, you should
    step back and look at HTML forms. Forms, which supply your scripts with data to
    process, enable you to enter data to be sent to your CGI program. Your program
    takes this information and returns results to the browser in the form of a regular
    HTML page.


    In the next sections of this module, we introduce you to the basics of form construction.
    Although this isn''t a necessity for programming in Perl, it does lay the foundation
    for understanding how browsers send data to a server and how forms interact with
    CGI.


    # Form Construction


    Here, we step through creating all the HTML form elements that could make up a
    Customer Information form. Figure 10-3 shows what the completed form will look
    like. During this exercise, our objective is to show you the various components
    a form can pass. This way, we can show you how to process them in your scripts
    later in the module.


    ```

    <form>

    ```


    An HTML form starts and ends with the <form> tag and can contain a variety of
    fields and buttons. To begin, we insert a beginning and ending <form> tag. Because
    additional attributes are needed, we add these as well. As for the attributes
    themselves, they are the following:


    +   **action** Provides the browser with a path to a CGI program that will handle
    the processing of the form. Because we are passing to a program called userInfo.cgi,
    this will be /cgi-bin/userInfo.cgi. We could have entered a complete URL with
    the hostname, but if you leave off the starting part of the URL, your Web browser
    submits to the host that supplied the form. This means you can actually create
    a form that''s submitted to a host besides your own, although you get a warning
    in most browsers.


    # 10'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# 328 | Perl: A Beginner’s Guide


    ![](img/2070407c4a70134aab89572f10d21e60_351_0.png)


    Figure 10-3 The Customer Information form


    # # Note


    Windows users should use /scripts/userinfo.cgi.


    method Tells the browser what method to use when submitting the form. The values
    you have to choose from are GET and POST. More information on these two values
    later, but we use POST for this example because this is the recommended protocol.
    With POST method, the information from the user is put into the data stream, or
    body, of the HTTP request. This lets your back-end CGI script read the data via
    the “standard input” data stream, in much the same way command line Perl scripts
    can take parameters.'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Module 10: Writing CGI Programs


    The GET method, however, puts the information submitted by users at the end of
    the URL, after a question mark, submitted to your server. This is referred to
    as the query string. Because forms can be large, the GET method can create URLs
    that are huge. For this reason, this method is discouraged.


    +   - **encctype** Provides the browser with the content type of the form submission.
    This is always set to application/x-www-form-urlencoded for form submissions.


    Taking these attributes into consideration, we have the following <form> tag:


    ```

    <form action="/cgi-bin/userinfo.cgi" method="post" enctype="application/x-www-form-urlencoded">


    ```


    # <select> Drop-Down Menu


    A <select> drop-down list box presents choices to a user in a menu-like element.
    This element is a box with an arrow pointing down and to the right of the menu.
    When the user selects the arrow, a list of choices is displayed. To include a
    drop-down list box in a form, you simply need to provide it with a value for its
    name attribute and nest <option> tags within the beginning and ending <select>
    tag.


    Before we list the set of options in the menu, we want to introduce the menu by
    asking the user "Where Did You Hear About Us? So the menu doesn''t appear on the
    same line, these are specified in a heading Level 4 (<h4>). For our <option> elements,
    we give the user to select one of the following:


    +   1. **Friend**

    2. **Magazine**

    3. **TV**

    4. **Radio**

    5. **Other**'
