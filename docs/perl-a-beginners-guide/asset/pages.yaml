- img_proc: true
  md: "# Module 3: Control Structures 83\n\nThe unless conditional statement evaluates\
    \ the expression for a true/false value and, as long as that value is false, the\
    \ unless statement block is executed. When the expression evaluates to true, the\
    \ else statement block is executed. The else portion of this statement can be\
    \ dropped, just as we discussed earlier with the if-then-else example.\n\n# Note\n\
    \nThe unless conditional statement is most useful when you only care about the\
    \ cases when the expression evaluates to false. If you run into a case where you\
    \ need to use an unless conditional statement, you probably won't need to add\
    \ an else statement. Using an else with an unless is basically an if-then-else\
    \ statement in reverse order, which doesn't buy you.\n\nYet another option you\
    \ have when using the if-then-else conditional statement is the capability to\
    \ add elsif statements, if necessary. The syntax for an if-then-else conditional\
    \ statement containing elsif statements is as follows.\n\n```\nif (expression)\n\
    {\n  'then' statement block\n}\nelsif (expression)\n{\n  'elsif' statement block\n\
    }\\else\n{\n  'else' statement block\n}\n```\n\nElif statements are used when\
    \ you have more than one expression to select the correct statement block to execute.\
    \ As with the plain if-then-else statement, when any section of the control structure\
    \ is executed, the rest of it is ignored. You can have as many elsif statements\
    \ in an if-then-else control structure as you need."
  merge: -1
