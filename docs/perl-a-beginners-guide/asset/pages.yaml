    +   - What command can be used to list breakpoints and action statements?


    # More Common Practices


    Before we reach the end of this module, here are a few more common practices you
    should know.


    One of these common practices is to use print statements regularly when you''re
    debugging a program. This can help you keep track of how different values are
    changing while your program executes.


    Another common practice is trying to pinpoint the problem line or lines of code
    by commenting them out and restarting the program. This is useful because it should
    help you pinpoint problem areas in your code. Once you find a problem area, you
    can concentrate your efforts on fixing that section, instead of wasting your time
    looking through the entire program.


    That about does it for this module. We hope you feel comfortable using the Perl
    debugger. You should also have a head start on figuring out syntax errors in a
    timely manner. Try to use some of the common practices we mentioned when you debug
    your programs. These practices should save you both time and effort in getting
    everything up and running smoothly.


