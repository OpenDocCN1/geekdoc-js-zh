  md: '# Module 10: Writing CGI Programs 333


    <input type="radio"> Radio Buttons

    Radio buttons are much like check boxes, except they only allow one of the choices
    in a group to be selected. These radio buttons, in addition to having individual
    values, are grouped together by using the same name attribute for each instance.
    The value attribute, however, is sent to the server to distinguish it from the
    others.


    Here how to include the set of radio buttons in your form.


    +   1. Guess what''s first? Yep—an introduction! Our user gets the chance to select
    his or her gender, so use the following sentence:


    ```

    <h4>Gender</h4>

    ```


    +   2. Next, add the actual HTML that creates the radio buttons. To do this, use
    the input tag again. However, this time we set the type equal to radio. Because
    we want to have more than one option, we also group the radio buttons by specifying
    the name attribute. Finally, we give them each a value, so we can identify them
    on the server side.


    Male

    <input type="radio" name="gender" value="m">

    Female

    <input type="radio" name="gender" value="f">


    The complete HTML for this is as follows:


    ```

    <h4>Gender</h4>

    Male

    <input type="radio" name="gender" value="m">

    Female

    <input type="radio" name="gender" value="f">

    ```


    > Hint

    You can have more than one radio button grouping within a given form by using
    different names for the different groups. As mentioned before, groups of radio
    buttons are defined by every button in the group using the same name.


    ![](img/2070407c4a70134aab89572f10d21e60_356_0.png)'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# 334 Perl: A Beginner''s Guide


    ```

    <textarea> Text Areas

    ```


    A text area is like a text box, except it''s larger and has the capability to
    contain more than one row. To create a text area of the size you require, you
    need to specify values for its cols attribute, which is the number of characters,
    and the rows attribute, which is the number of rows. There is not much more to
    this form element, so rather than step through an example of how to implement
    it, we are just going to show you the code.


    ```

    <h4>Comments</h4>

    <textarea name="comments" rows="5" cols="40"></textarea>

    ```


    In this piece of HTML, we created a text area that contains five rows and 40 columns,
    or characters, wide.


    ```

    <input type="password"> Password Fields

    ```


    Sometimes, when you are creating forms, you want to include the capability for
    the user to submit personal information, such as an ID or password. At the same
    time, you don''t want someone who may be looking over her shoulder to see what
    she types. The answer for these kinds of situations is to create a text box where
    the characters entered aren''t seen but, instead, are masked. On the Web browser''s
    screen, you see asterisks appear instead of the text, which keeps wandering eyes
    from seeing this private information.


    Creating a password field is like creating a text box, except you specify the
    type attribute with a value of password. Even though we didn''t specify this in
    the text box example, we also included the use of the size and maxlength attributes
    that control the dimensions of the box, as well as the maximum number of characters
    that can be entered. For the box in our form, we use the following:


    ```

    <h4>Password</h4>

    <input type="password" name="passwd" size="15" maxlength="15">

    ```


    As you can see, we gave it the name of password and set the size and maxlength
    equal to 15.'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# Module 10: Writing CGI Programs 335


    <input type="hidden"> Hidden Fields

    The concept of a hidden field also exists within forms. These fields are useful
    when you want to send information to the server, but you''d rather not see or
    modify it. For example, you might send the version number of the form. This is
    something the user shouldn''t be able to and has no reason to modify.


    The HTML code used to create this field simply uses the <input> element with the
    type attribute set to hidden. Then, within the tag, you use the name and value
    attributes to specify the extra fields and your values you post.


    In our form, as mentioned in the example, we use this type of field to pass the
    version number of the form. This looks like the following:


    ```

    <input type="hidden" name="version" value="1.0">

    ```


    <input type="reset"> Reset Buttons

    Up to this point, we have discussed using the <input> element as a text box, check
    box, radio button, a password field, and as a hidden field. You can create one
    more type of item with this element and has two variations. The first variation
    is the Reset button.


    The Reset button, which isn''t required to be present in all forms, has a default
    of "Reset", although you can change it the value attribute. If a form contains
    this element, selecting it clears all the fields on the local form. The form is
    not submitted when this action is performed, by all user entries are cleared and
    the default settings/selections reapplied.


    To implement an instance of this button, do the following. The value attribute
    was included here, but we could have left it out. By using the value attribute
    here, you can see where it would go.


    ```

    <input type="reset" value="Reset">

    ```


    > Hint

    Even though you can have more than one Reset button in a form, you should consider
    only placing a single button at the end of the form to avoid confusion.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# 336 Perl: A Beginner''s Guide


    ```

    <input type="submit"> Submit Buttons

    ```


    The second variation is the Submit button. Each form you want to submit back to
    the server must have a Submit button of some form. True, you can get around this
    some degree by using a client-side scripting language JavaScript, but not in general.


    To specify that the button is supposed to be a Submit rather than a Reset button,
    you set the type attribute to submit. As with the Reset button, the Submit button
    can take a value attribute to set the text of the button. The default text for
    the button is "Submit Query."


    To create a Submit button, you do the following:


    ```

    <input type="submit" value="Submit">

    ```


    # Another Way to Do a Submit Button


    Because we''ve been talking about form elements, we want to include a section
    on another way to implement a Submit button. This element, which includes an image,
    can be used in place of the Submit button, when we just discussed.


    When you specify image as the type for an <input> field, you can use the URL in
    another attribute called src. This attribute, which is used in the same manner
    as the src attribute of <img> tag, displays an image to the user instead of a
    button. Like the Submit button, when the user clicks the image, the form is submitted.
    When this is done, the coordinates of the mouse pointer are sent in the form name.x
    and name.y where name is the value of the name attribute.


