- img_proc: true
  md: '# Module 8: Packages and Modules | 271


    @EXPORT

    @EXPORT is an array of symbols you want to export by default, so when users load
    a library by calling the use() function, they have access to these subroutines
    immediately. Be careful here you may be returning subroutine name that conflict
    with other names using your library you may be using. For this purpose, using
    @EXPORT_OK is usually the preferred method, unless you have a reason to do otherwise.


    @EXPORT_OK

    The @EXPORT_OK array is much like @EXPORT, except it is a list of symbols to export
    on request by the user of the module. This basically means the module author is
    making the list of symbols available for the module user to use, but they won''t
    be automatically available unless the user specifically asks for them.


    %EXPORT_TAGS

    The final array, %EXPORT_TAGS, defines the names for sets of symbols. In other
    words, you could group a set of subroutines you want to export together under
    a specific name, which enables a user who wants to import that set to specify
    a single item, rather than a complete list. This also lets you provide the user
    having an anonymous method of importing your subroutines without the user having
    to know their names.

    So, for instance, if you have a module called MyHTTP and you want to organize
    the exportable subroutines in this module into two categories (let''s say header
    and body), then you may have something like the following %EXPORT_TAGS entry:


    ```

    %EXPORT_TAGS = (header => [qw(sub1 sub2 sub3)], body => [qw(sub4 sub5 sub6)]);

    ```


    Now, if the user only wants to import sub1, sub2, and sub3, which we grouped under
    header, she could have the following line in her code, which simply puts a : in
    front of the header item:


    ```

    use Module qw(:DEFAULT:header);

    ```


    ![](img/2070407c4a70134aab89572f10d21e60_294_0.png)'
  merge: -1
