    # The foreach Conditional Statement


    The foreach conditional statement can be used to iterate through an array variable''s
    contents. This enables you to specify different ranges for a loop to iterate over,
    rather than only being able to specify a start and end point.


    > Note

    The array variable is a topic we haven''t covered yet. For, think of the array
    variable as containing a list of numbers or strings all associated together. These
    pieces of scalar data are referred to as elements of the array. This topic is
    covered in detail in the next module of this book.


    Let''s look at the syntax for the foreach conditional statement before discussing
    it in detail.


    ```

    foreach scalar variable (array variable)

    {

    ''foreach'' statement block

    }

    ```


    The scalar variable in the foreach statement will be set equal to the current
    element being used from the array. Note, once the foreach statement has completed
    execution, the scalar variable is reset to equal the value it was before the statement
    began execution. A variable that''s only valid in certain sections of a program
    is said to have a scope in those sections. Because the scalar variable has a scope
    inside the foreach loop only, the value it assigned inside of the loop isn''t
    valid outside of the loop. This sounds a little confusing so here''s a programming
    example to make this easier to grasp.'
  merge: -1
  pgno: 118
