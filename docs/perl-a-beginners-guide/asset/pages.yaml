    +   * http://www.ecma.ch This site is the home of ECMA, where the ECMAScript (ECMA-262)
    language specification is maintained. This language, which is based on early generations
    of JavaScript and JScript, represents the core standardized portions of the language
    from JavaScript and JScript now draw.


    In a nutshell, the best way to compare PerlScript on the client side is with JavaScript.
    A fair number of the objects, such as Window or Document, are the same, as any
    of the methods (or subroutines in Perl terms), as write() or alert(). The big
    syntactical difference is PerlScript uses -> as the separator between objects
    and subobjects, properties, or methods instead of a period (.). Here''s an example
    to clarify this.


    Let''s say you want to write the "Hello, World!" to the page loaded by Internet
    Explorer 5. In JavaScript (or JScript, remember, they are basically the same),
    you would use the following lines of code:


    ```

    <script language="JavaScript" type="text/javascript">

    document.write(''Hello, World!'');

    </script>

    ```


    Now, for PerlScript, you would use this:


    ```

    <script language="PerlScript" type="text/perlscript">

    Window->document->write(''Hello, World!'');

    </script>

    ```


    As you can see, they are quite. When programming in PerlScript, you must make
    sure the language and type attributes of the <script> tag are correct, and you
    have to change the periods to ->. PerlScript also requires the complete object
    hierarchy, which is why the $window portion is in our example. In JavaScript,
    you could include the top-level window object reference, but it isn''t required.'
