  md: '# 80 | Perl: A Beginner''s Guide


    So far, you have learned about the various data types in Perl, as well as how
    variable assignments and operators are used. Now it''s time to learn about control
    structures and how they are used in programs. These structures are used in most
    of the programs you write simply because they give you some control over how your
    programs execute. This module begins by looking at the most basic piece of any
    control structure, the block statement, and then moves on to cover the rest of
    the conditional statements. Once you complete this section, we introduce you to
    some control statements you can use inside loops and, finally, we cover the concept
    of nested loops and how they function.


    # Conditional Statements


    Conditional statements are used in programming languages when a decision needs
    to be made before a section of code is executed. You might need to make sure a
    counter has reached a certain number before executing code or you might want to
    check the contents of a variable to make sure the value is what you thought it
    should be. Before we cover the different conditional statements in detail, we
    need to discuss the basic building block of any conditional structure, the statement
    block.


    # Statement blocks


    A statement block is a sequence of executable statements that are grouped together
    with curly braces. Curly braces are the ‘{ and ’} characters. A statement block
    in a program looks like this:


    ```

    {

    $a = 12;

    $a += 5;

    print "a equals $a\n";n}

    ```


    Here is another example of a statement block with the curly braces located differently.'
  merge: -1
  pgno: 103
- img_proc: true
  md: "```\n$$ a = 12;\n$ a += 5;\nprint \"a equals $a\\n\";\n```\n\n# Note\n\nThe\
    \ previous statement blocks are identical in functionality even though the curly\
    \ braces are in different locations. You can put the curly braces anywhere you\
    \ want as long as they are before and after the lines of code you want to encompass\
    \ the statement block.\n\nThe lines of code in a statement block are always guaranteed\
    \ to be executed, so they can be referred to as unconditional statements. An empty\
    \ statement block is accepted in Perl, but it probably won't be helpful to you.\n\
    \nNow that you understand what statement blocks are and how they function, let's\
    \ get right into learning the different types of conditional statements.\n\n#\
    \ The if-then-else Conditional Statement\n\nThe if-then-else conditional statement\
    \ takes an expression and evaluates it for a true/false value. If the evaluation\
    \ of the expression yields a true value, the statement block for the then portion\
    \ of the statement is executed. If the evaluation of the expression returns false,\
    \ the else statement block is executed. Here's the syntax for the if-then-else\
    \ conditional statement.\n\n```\nif (expression) {\n  'then' statement block\n\
    }\nelse {\n  'else' statement block\n}\n```\n\nLeaving the else portion of this\
    \ statement off is perfectly legal if you don't need it. Here's the syntax for\
    \ an if-then statement without an else."
  merge: -1
