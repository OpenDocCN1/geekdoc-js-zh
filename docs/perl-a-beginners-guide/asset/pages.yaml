  md: '# Module 10: Writing CGI Programs 323


    # Mac OS


    Unlike Windows and UNIX systems, setting up your CGI directory on the Mac OS is
    a bit different. The first thing you have to do, which is the same on any system,
    is to make sure your server is running. Although several Mac Web servers are floating
    around there, we use the MacHTTP server that comes with the operating system.


    The first thing to do is open the Web Sharing Control Panel. This panel, which
    is shown in the following illustration, lets you to do the following.


    +   * See your Web address, which reflects the IP address you can use to access
    the documents served by this server.

    * Specify the folder you want to store your Web documents, which defaults to Web
    Pages, which is located on the drive with Mac OS.

    * Specify the default document to serve when the root of your server is requested.

    * Start and stop your Web Sharing services.

    * And, finally, specify the level of security you want to impose on the requests.


    ![](img/2070407c4a70134aab89572f10d21e60_346_0.png)


    Once you''ve launched this Control Panel, you should verify these settings and
    make sure they''re set to the values you want. Simply accepting the default values
    should be fine for anything we do not in this book. Once opened, select the Preferences
    item from the Edit menu of this Control Panel. This displays a dialog box that
    has three tabs.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# 324 | Perl: A Beginner''s Guide


    On the first tab, select the option that says Allow Aliases To Open Items Outside
    The Web Folder. Next, go to the Finder and open the MacPerl folder. Then, create
    an alias for the MacPerl CGI folder. Rename the folder to gi-bin and move it under
    your Web pages. By doing this, you can store all CGI scripts within the MacPerl
    CGI folder, but still access them through the common /cgi-bin URL.


    Go back to the Web Sharing Control Panel and click the Actions tab, which is the
    last tab. Under this tab is where you tell MacHTTP how to handle CGI scripts.
    Once you do this, do the following:


    +   Click the New... button on Actions dialog.


    +   Use the pull-down menu and select Launch At Suffix.


    +   Click the Select... button and browse the folders on your system until you
    find the MacPerl application. Select the MacPerl application and click OK.


    +   In the Suffix text area .cgi. Once completed, your entry should look like
    the following illustration.


    ![](img/2070407c4a70134aab89572f10d21e60_347_0.png)


    +   Because there are two methods of running Perl CGI scripts on a Mac—normal
    CGI and asynchronous CGI—we must tell the MacHTTP about a second file type to
    process as a Perl CGI. Simply repeat the preceding steps, but enter acgi as the
    suffix for the second type.


    Once you finish entering these two Actions, you should see the same dialog entries
    under the Actions tab of the Preferences, as shown in the following illustration.'
