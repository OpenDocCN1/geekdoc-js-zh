    # Installing Perl


    Perl is a free language, so having a version installed on your system is no more
    complicated than finding it and going through the installation process. Since
    many of you may have never installed Perl on a machine or may not have it, as
    the first project we wanted to step you through the installation process.


    # Project 1-1: Installing Perl


    In this project, the objective is simple: step through the installation process
    of the Perl interpreter. If you already have Perl on your system, this is a good
    chance to run through the steps again or to upgrade to 5.6 if you have an older
    version.


    > Hint: Want to know what version of Perl you have? We don’t want to give away
    too much at this point, but if you know how to call the Perl interpreter, you
    can pass it the -v option to check the version. Here are some quick instructions
    on how’s done:

    UNIX and Windows: Assuming the Perl interpreter is in your path, simply type perl
    -v at a command line.

    Macintosh: Though you could create a script with only the line "#/usr/bin/perl
    -v" and run it, the easiest way is to start MacPerl, and then select AboutPerl...
    from the Apple menu. This displays a dialog box that contains the version (MacPerl
    version) and patchlevel (source distribution level).


    # Step-by-Step


    Because installers do change, your instructions may vary slightly from what you
    read here. If the instructions vary in your case, be sure to read the INSTALL
    and/or README files for accurate instructions.'
