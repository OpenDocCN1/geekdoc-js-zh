    Wondering what happened to Perl 5.5? Well, 5.5 was the beta version of 5.6. So,
    you are correct—no 5.5 was released as a final version.


    +   * Unicode and UTF-8 support

    * 64-bit support

    * Files larger than 2GB now supported

    * And even more diagnostics


    For those of you who may have some programming experience already, you might also
    be interested in these higher-level enhancements:


    +   * Lexically scoped warning categories

    * The open() function has had an argument added

    * pack() function enhancements'
