    "go" at the beginning of a word?

    * What regular expression would you use to ensure the string "go" occurs at the
    very beginning of a string?


    Earlier in this section, we looked at the square brackets and how they can be
    used to specify different characters that can be valid for a pattern. And we just
    looked at the "^" pattern anchor and how it can be used to make sure a pattern
    is found at the absolute beginning of a string. Now we are going to combine these
    two familiar characters and show you how to select all the characters you don''t
    want to be part of a pattern. This is called exclusion and the following is an
    example of how exclusion works with regular expressions.


    ```

    $string ~ /200[^A-9]/;

    ```


