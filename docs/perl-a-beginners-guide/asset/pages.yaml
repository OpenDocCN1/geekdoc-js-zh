    # Extra Things You Can Do Manually


    Ahhhh, the beauty of a complete Perl library. CGI.pm makes it easy, doesn''t it?
    Well, what if you want to change some of the defaults yourself and not have them
    set? Things like header directives. What then? Well, you can do this, so don''t
    fret. Here''s a quick look at a few items you may want to do yourself.


    # Specifying the Content Type


    Web servers can return many data types back to a browser. For example, Web servers
    can send back an HTML document, images, plain text, audio, video, and many others.
    However, part of the response to a browser must include the type of information
    returned.


    The Content-type header lets specify any MIME data type, which can then be properly
    handled by the browser. The first part of the Content-type header is the top-level
    MIME type, followed by a forward slash, and then the MIME subtype. For example,
    the general Content-type returned for HTML documents is


    Content-type: text/html'
