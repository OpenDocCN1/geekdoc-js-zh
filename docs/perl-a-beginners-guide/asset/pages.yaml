    The first thing you see in the package is its name. The name we''re giving our
    class is Record. The name for a class is used in a program to incorporate the
    functionality of it into that program. We look at how this is done when we go
    over the example program that actually uses the class.


    The second line of the file contains line 1;. This is included so when the class
    is called on to be used in a program, the process will succeed, because the module
    containing the class returns a true value (in this case, 1). You''ll get a better
    idea of what we mean here when we get to the program itself.


    The next part of this class, beginning on line three, is a subroutine called new.
    This is what we call the constructor for the class. This method, or subroutine,
    creates a new object when it''s called. This new object has all the attributes
    assigned to it by the constructor. This method is a constructor, not because of
    the name it is given, but because of the functionality it includes. The function
    my has a special meaning in Perl and we discuss it more when we get to the encapsulation
    section. This constructor creates a reference to a hash which contains three keys:
    NAME, AGE, and POSITION. Another function you see here''s probably new to you
    is bless(). This function is covered after we look at the example program that
    uses this class. The last line of this method returns the newly created object.


    Each of the last three methods in this class are designed to perform a special
    function on the object that has been created. Because of this, we can refer to
    them as object methods.


    Looking at the first of the object methods—name—you can see its purpose is to
    set the name field of the hash for the object and return the new name for it.
    It also simply returns the object''s name if no name is specified to set.


    # Note


    Remember, %@ is the automatic variable assigned to a subroutine. Saying if (@_)
    effectively means if anything was passed to this method, then do something. Also
    the shift() function works on the current default array as well, if no new name
    to be set is passed in, the last name in the array is shifted out and returned
