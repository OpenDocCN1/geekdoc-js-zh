    to move on and talk about how to assign values to array slices. You can assign
    values to array slices, just as you can assign values to regular arrays. When
    you assign values to an array slice, you use the slice notation on the left side
    of the programming statement. Consider the following array:


    ```

    @array = (1 .. 10);

    ```


    You can use an array slice to reassign new values to this array. The following
    is an example line of code that would reassign new values to the fifth, eighth,
    and third elements of this array:


    ```

