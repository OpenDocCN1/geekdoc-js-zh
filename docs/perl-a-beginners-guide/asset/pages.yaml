    # Notes About the Platforms


    Now that you have Perl installed on your system, you''re ready to learn about
    your distribution. Because every operating system and environment is different,
    it''s impossible for Perl to behave and act exactly the same way across all the
    platforms. Because of this, you should take the time to be exposed to some of
    the limitations and/or advantages your platform has to offer.


    # UNIX


    The UNIX variations themselves are not that limiting. Nearly anything you can
    do within the UNIX environment, you can simulate, control, or report on in Perl.
    This means you have commands like kill or grep that can be used, and you can obtain
    UNIX-like information from within your scripts. One key to remember is directory
    paths contain / as the directory separator character.


    > Note

    For more information on the various UNIX flavors of Perl, go to the Language Page
    at http://www.perl.com.'
  merge: -1
