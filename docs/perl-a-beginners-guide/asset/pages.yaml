    # Using the DBI


    Now that PostgreSQL is running, the tables we need for our examples are created,
    and the DBI and DBD modules are installed, we can start doing some programming!
    In this section of the module, we introduce you to the DBI, talk about connections
    and queries, and discuss errors and a few other features. Some of these, as you
    might imagine, require a knowledge of databases, we''ll try to separate that as
    much as possible. If you have previous experience with databases, this can only
    help you.


    # Connections


    The connection between PostgreSQL and the Perl DBI is accomplished using the connect()
    subroutine. This subroutine accepts up to four parameters, which include the data
    source of the database server, the username to connect as, the password for the
    user, and an optional attribute list that can dictate how the connection is made
    and any options you want to specify. This attribute list, for instance, can be
    used to set the AutoCommit and PrintError values to off. We show an example of
    this in a second. The format for using the connect() subroutine is follows, where
    the {attribute_list} is optional.


    ```

    DBI->connect($ds, $user, $password, [$attribute_list]);

    ```


    Looking more at the data source parameter ($ds), this value can contain as little
    as the database name and driver name, but can also take the hostname and port
    of the database, or even more, depending on the driver. To illustrate this, here
    are some syntax examples. In these examples, you replace <driver> with the name
    of the driver being used, <db_name> with the name of the database, <host> with
    the machine''s hostname, and <port> with the port number to which the database
    client is listening.'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# Module 9: Interacting with Databases Using the Perl DBI 299


    # Note


    Be sure to check the documentation of your database driver to see the exact syntax
    of the data source. PostgreSQL, for instance, can also take an options and tty
    parameter.


    ```

    dbi:<driver>:<db_name>

    dbi:<driver>:<db_name>@host:<port>

    dbi:<driver>database=<db_name>;host=<host>;port=<port>

    ```


    # available_drivers() and data_sources()


    The Perl DBI includes two subroutines to verify if your driver need is installed
    on the system, and if the driver supports it, can help you determine the data
    sources (databases) to which the driver can connect. These subroutines are available_drivers()
    and data_sources() routines.


    The available_drivers() routine, when called, searches through the directories
    in your *INC environment. Basically, it looks for DBI::* modules, where * could
    be something like Pg, Oracle, Informix, and so forth. The syntax for this looks
    like the following.


    ```

    @driver_array = DBI->available_drivers;

    ```


    The second subroutine, data_sources(), can be used to return all the database
    names given driver can access. Not all drivers support this, so you need to check
    make sure the return value isn''t empty or undef. The syntax for this routine
    is the following.


    ```

    @ds_array = DBI->data_sources($driver);

    ```


    One of the greatest performance hits on your database by application is the initial
    connection. Because of this, we recommend you use persistent connections for your
    applications. This means you open a connection and hold it open as long as its
    needed, which could be for the entire program. This is because the establishment
    of a connection can take upwards of 90 percent of the total time to execute a
    single query. If you hold the connection open for other queries, however, subsequent
    queries won''t experience this delay.'
  merge: -1
  pgno: 322
- img_proc: true
  md: 'Also important to note is connections don''t refer to connecting to a database—it
    also refers to disconnecting. Good programming style dictates you should close
    all open connections as you edit your program. This exit could be as a result
    of completion or an error. In either case, you should explicitly close your connection
    when you finish. This is accomplished in the DBI by calling the disconnect ()
    subroutine. The syntax for this routine is as follows, where $dbh is the database
    handle to which you assigned your connection.


    ```

    $dbh->disconnect

    ```


    If we take all we learned here and apply it in a single example, then we can use
    the DBI to make certain our driver is installed, make sure it can connect to our
    database, open a connection, and then close it. This, obviously, doesn''t much,
    but it does provide somewhat of a template for the other tasks we are going to
    run against our database.


    ```

    #!/usr/bin/perl-w

    # load in the DBI module

    use DBI;


    # set the username, password, and database to access

    $user = "awyk";n$password = "mypass";n$base = "perl-begin";n

    # specify the driver and database to access

    $driver = "Pg"; $base; # generates ''dbi:Pg:perl-begin''


    # make the connection to the database

    $dbh = DBI->connect($driver, $user, $password) or die "\nError ($DBI::err):\n";n

    # close our connection

    $dbh->disconnect();

    ```


    # Transaction Management


    As your database-enabled applications become more complex, you may need to lock
    tables and manage the transactions. An example might be a counter. If you have
    ten people connected to the database and you want to increment a counter field
    based on this number of connections, you need to lock and unlock the table as
    you increment'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# Module 9: Interacting with Databases Using the Perl DBI | 301


    the counter. Otherwise, it''s possible two or more transactions may attempt to
    perform their increment at the same time, which could cause data corruption.


    In the Perl DBI, the LOCK TABLE <table> statement, which is interpreted by the
    backend server, can be used to apply an explicit lock on a table, but this only
    works inside a transaction (that is, AutoCommit set to 0). For more information
    on AutoCommit, check the DBI manages.


    In addition to locking and unlocking the tables, you should also verify that a
    set of transactions completed successfully. If all don''t complete successfully
    for any reason, then you should rollback all transactions. In other words, you
    don''t want a transaction complete for the purchase, for example, for just one
    item, but not the second. You want the whole purchase to fail. To perform this
    kind of task, you can use the rollback() subroutine of the DBI module.


    The discussion of the pros and cons of locks and rollbacks is beyond the scope
    of this book and is specific to database applications. Please consult the DBI
    manages, your database documentation, and/or the author of your database driver
    to see what can be done with the driver you are using.


    # Queries


    You perform four main types of queries routinely when you access your database.
    These are as follows:


    +   1. SELECT

    2. INSERT

    3. UPDATE

    4. DELETE


    The SELECT query returns any information in the database matching what you requested.
    The INSERT query is used to insert new rows in the database, while the UPDATE
    query updates existing information. As you might have guessed, the DELETE query
    is used to delete items from the database.'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# 302 Perl: A Beginner’s Guide


    The query process itself breaks into a four-stage process. We won’t discuss these
    in detail, but they are evident in the underlying examples that we have in this
    section of the module. You can see us call and use the subroutines mentioned in
    this list. This process is outlined here.


    +   **Prepare** This process takes your query and validates it. Assuming all your
    syntax is OK (that is, make sure the tables you''re querying exist), then a handle
    for the query is returned.


    +   **Execute** This is the process of calling the subroutine in the DBI that
    executes the query on the database.


    +   **Fetch** This process takes place once your query has completed; the data
    is returned to your Perl program in the form of data structures.


    +   **Deallocation** This process isn’t one that affects you; it’s when the DBI
    and corresponding driver perform cleanups, such as freeing memory.


    Obviously, there’s more to this than we mentioned, so we’ll show how each of these
    can be executed using the Perl DBI.


    ```

    SELECT

    ```


    SELECT statements are one of the most widely used statements in interacting with
    databases. These are the statements that say, “Show me these things in the database.”
    “These things,” of course, refer to the items that match the type of select you
    perform and the criteria you pass.


    Let’s take our users table, which we defined at the start of the module as an
    example. If you want to return the lastname of all people entered into our users
    table, you would do this by saying


    ```

    SELECT lastname FROM users;

    ```


    If you want to return all data from the table, you can use the wildcard, such
    as


    ```

    SELECT * FROM users;

    ```'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Module 9: Interacting with Databases Using the Perl DBI


    If you want to return the firstname, lastname, and zip of the person with the
    userid of 2, you would say


    ```

    SELECT firstname, lastname, zip FROM users WHERE userid = 2;

    ```


    As you can see, SELECT statements are quite simple. After the SELECT keyword you
    specify what you returned, and then you use the FROM keyword to specify the table
    name. You can use an optional WHERE keyword to specify some criteria that must
    match. So, what does this look like in Perl using the prepare() and execute()
    subroutines if we want to return all information in the table? In a nutshell,
    it looks like this. Note, we haven''t included all the code necessary to make
    this work, such as opening our connection, but because we didn''t want to confuse
    you we tried to show you only the SELECT parts.


    ```

    $statement = \$dbh->prepare("SELECT * FROM users");

    $statement->execute();

    ```


    # Ask the Expert


    **Question:** Using the WHERE keyword looks a lot like Boolean evaluations. Is
    specifying two or more sets of criteria possible?


    **Answer:** Absolutely! You can use other keywords, like AND and OR, as well as
