- img_proc: true
  md: 'The next directory functions we cover are the telldir and seekdir functions,
    which are used in conjunction with each other and enable you to skip around in
    a directory list.


    # Note


    When you use the readdir function, it keeps up with its current location in the
    directory list, so it will know which files and subdirectories it has not read.
    If you want to be able to skip around in a directory list instead of having to
    read the files and subdirectories in order, you can use the telldir and seekdir
    functions.


    The telldir function returns your current location in a directory listing. As
    you iterate through a directory, you can use this function to see where you are
    in the listing. The syntax for this function is as follows:


    ```

    telldir (directory handle)

    ```


    If you want to set your starting point in a directory list to somewhere other
    than the beginning, you must save what the telldir function returns. The following
    line of code does this for you:


    ```

    $current_location = telldir (directory handle)

    ```


    The seekdir function enables you to set the starting point in a directory listing
    to wherever you want. The only catch is the location you catch must be returned
    from the telldir function. Here''s the syntax for the seekdir:


    ```

    seekdir (directory handle, $current_location)

    ```


    Once you''ve used this function to change your position in a directory listing,
    you can continue using the readdir function to iterate through the rest of the
    contents of the directory.


    Another function that can be useful when you work with directories is rewinddir,
    which resets your current directory listing position to the beginning. The syntax
    for this statement is as follows:


    ```

    rewinddir (directory handle)

    ```'
