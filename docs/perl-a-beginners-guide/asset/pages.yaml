- img_proc: true
  md: '# 402 Perl: A Beginner''s Guide


    Programming errors are errors the programmer made in her logic that can cause
    the outcome of the program to be incorrect.


    Syntax errors are typically the easier of the two to fix. The Perl interpreter
    even helps out on the syntax errors, as you saw in the previous section of this
    module. Programming errors are usually the ones that are hard to debug because
    they aren''t syntax-related, which means the program executes without errors.
    Two examples of programming errors are making the wrong calculations or iterating
    a loop too many times.


    # Command Line Options


    If''re past all the syntax errors in a program, but you still aren''t getting
    the right results from its execution, we recommend you start your search for the
    problem by issuing the -w command. This command turns on all warnings and these
    warnings are generated when you execute a program from the command line. To turn
    on this, simply execute your program as follows:


    ```

    perl -w program.pl

    ```


    A good idea is always to use this option when executing programs. Some of the
    examples in this book generate warnings when this option is enabled because of
    the way we had to write them to explain different topics. When this option is
    enabled, it finds things such as identifiers mentioned only one time, scalar variables
    used before they are set to anything, references to undefined file handles, file
    handles opened in the wrong mode, using an array as a scalar, as well as numerous
    other warnings that can affect the behavior of your program.


    If, after using the -w option, you cannot find the error or errors in your program,
    hope still exists for you. You can use the Perl debugger to step through your
    program to try and determine what is causing the problem. Let''s talk about the
    debugger and its options.


    # The Perl Debugger


    The Perl debugger is a useful tool that can be used to step through a program
    a number of different ways.'
  merge: -1
  pgno: 425
