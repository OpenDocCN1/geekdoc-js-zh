  md: '# Note


    Although binary distributions of Perl are available for the various flavors of
    UNIX and Linux, they won’t be discussed here, but you will learn the basics of
    the building process for these systems. If you are a Linux user and you have a
    package manager, like RPM for Red Hat or DEB for Debian Linux, then you should
    use that application to install Perl. Perl is such an integral part of these and
