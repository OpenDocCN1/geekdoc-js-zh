    told you how to exit it. This can be done simply by using the q command, issuing
    the q command handler the debugger and returns you to the command line in the
    same directory where the -d command was issued. If you halt the debugger on a
    program and immediately reenter the debugger on the same program, everything will
    be reset to the initial state.


    A few more options need to be covered before we step through the program. These
