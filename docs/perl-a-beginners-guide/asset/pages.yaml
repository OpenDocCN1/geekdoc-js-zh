  md: '# Perl: A Beginner''s Guide


    The left and right shift operators manipulate the bits of an integer by shifting
    them a specified number of times to the right or to the left. Here''s an example
    of how this works.


    ```

    Sa = 7 >> 1 # this will shift the binary representation of

    #7 one bit to the right.

    ```


    From the previous example, 7 is 0111 in binary form. Switching the bits one space
    to the right leaves us with 0011. In our example, $ is equal to 3. The left shift
    operator functions the same, except it shifts the bits to the left.


    # Note


    The new bits that are shifted into a binary number are always 0, no matter what
    shift operator you use.


    # Operator Precedence


    Operator precedence is an important topic to cover before you begin writing programs
    that need to perform calculations. Operator precedence refers to the order in
    which operators are executed when performing a calculation. You probably remember
    from math class that multiplication and division come before addition and subtraction
    in the order of operations. You''ll be happy to know Perl follows these same rules
    of precedence.


    Another term to be familiar with when about operator precedence is associativity,
    which refers to the order in which two or more operators of the same precedence
    level are executed.


    The following table contains all the operators starting with the highest precedence
    level. The table also contains the associativity properties of each group of operators.


    | Operator | Description | Associativity |

    | --- | Dereference operator or method call | Left-to-right |

    | ++, | Autoincrement and autodecrement | Not applicable |

    | ** | Exponentiation operator | Right-to-left |'
