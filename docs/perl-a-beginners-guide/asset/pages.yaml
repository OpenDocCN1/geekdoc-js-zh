  md: '# 40 Perl: A Beginner’s Guide


    ```

    #!/usr/bin/perl

    #-----------------

    # Script Name: Hello.pl

    # Script Version: 2.0

    # Date: 10.01.2000

    # Author: R. Allen Wyke

    # Description: Prompts for name, strips of newline character

    # and prints "Hello <name>!" screen where name = the text entered.

    # Revision History:

    # 1.0: original version

    # 2.0: added prompt for user''s name and returned text based on

    #-----------------


    # ask user for name

    print "What is your name?"

    $input = <STDIN>


    # remove newline character

    chomp($input)


    # print results to page

    print "Hello $input\n";

    ```


