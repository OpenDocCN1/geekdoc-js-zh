- img_proc: true
  md: '# 158 Perl: A Beginner’s Guide


    Program flow and subroutines are a way to help you break your code into segments.
    By doing so, you often better organize your programs by functionality, rather
    than absolute flow. Additionally this gives you the capability to create sections
    or functionality to reuse, rather than to rewrite. From a programmer’s perspective,
    this is a good thing, which reduces extra code.


    Drawing an analogy from the real world is easy. For instance, reusable code is
    like having a bucket. Generally speaking, the bucket can be used for many different
    tasks, such as carrying water, dirt, or miscellaneous items. The bucket can also
    be used on different occasions, such as to wash the car on Monday or to carry
    rocks on Tuesday. The bucket becomes something you use for different things at
    different times, but an underlying commonality is between them—it’s a bucket and
    the tasks that revolve around demonstrate the capability the bucket has.


    Code segments and the desire for their use are different. You want to create segments
    that are disconnected enough for your program to reuse elsewhere and flexible
    enough to use for different types of tasks. A fine line exists between flexibility
    and reusability, so be careful. A too-flexible segment might contain too much
    code or too little functionality. As a programmer, you have to determine where
    that line falls. If you find it takes you more time to try to break up your code
    logically, then you probably are breaking it too small or with too much functionality.


    In this module, we step through program flow in Perl and how to use subroutines
    to create reusable code. We might even help you find that fine line through this
    education process and our examples. Ultimately, this module gives you the capability
    and knowledge to draw your own lines and successfully create reusable code segments
    in your programs.


    # Organization Basics


    Overall program organization is the capability to create logical and functional
    segments in your programs. This isn’t a new concept to the programming world,
    in fact, nearly all programming languages have capability in one form or another.
    Some are more advanced than others'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Module 5: Program Flow and Subroutines


    and some have other segment-enabling functionality that gives even more flexibility.
    No matter what language you use, though, you should have least some of the following
    tools at your disposal:


    +   - **Functions** These are reusable sections of code usually at the beginning
    or end of your program (depending on the language). These sections are often created
    because you want to perform a certain operation more than once. In Perl, these
    functions are called *subroutines* and they''re the focus of this module.


    +   - **Libraries** These are external files that contain multiple functions and/or
    properties related in topic or functionality. For instance, you may have a “math”
    library that has addition, subtraction, multiplication, and division functions
    contained within it. Storing these often-used functions in their own library enables
    you to organize your code better and to reuse it in other programs later. In Perl,
    these libraries are called *packages*, which are files by the same name. Packages
    can contain groups of related modules that are designed to be exportable and reusable.
    This topic, although introduced here, is discussed in more detail in Module 8,
    “Packages and Modules.”


    +   - **Objects** These are reusable items that take on certain characteristics
    and potentially perform tasks or other functionality. In programming terms, *objects*
    have properties (characteristics) and methods (functionality) that can operate
    on those properties. In your code, you create an instance of an object and that
    now has all the properties and methods of the class definition. Objects are a
    big topic in Perl, Module 13, “Advanced Features and Concepts” under the section
    “Object-Oriented Programming.”


    To give you more visual look at how this fits together, we included the following
    illustration. As the drawing shows, we have a program that contains two object
    instances, an object definition, and two functions. The two object instances are
    created from object definitions in an external library the program imports. One
    of the functions is also pulled from the external library.'
  merge: -1
