  md: "The last option we cover in this section is called the translation option,\
    \ which is closely related to the substitution option we just discussed, except\
    \ it replaces on a character basis. When the substitution option found a match,\
    \ it replaced the match with any specified string and the replacement string didn't\
    \ have to be the same size as the search string. With the translation option,\
    \ you must be a little more careful about what you select as your replacement\
    \ string. Also, unlike the translation option searches through an entire string\
    \ without having to activate an additional option. The translation option is enabled\
    \ by adding a \"tr\" before the first forward of a regular expression. Let's look\
    \ at an example, and explain how this option works.\n\n```\n#!/usr/bin/perl\n\
    $string1 = \"today is the best day of all\";\nprint \"String 1 contains, $string1\\\
    n\"\nif ($result = $string1 =~ tr/the/abc/) {\n    print \"I found the pattern\
    \ in string1\\n\";\n    print \"String1 now contains $string1\\n\";\n} else {\n\
    \    print \"I could not make a match in string1\\n\"\n}\n```\n\nThe output of\
