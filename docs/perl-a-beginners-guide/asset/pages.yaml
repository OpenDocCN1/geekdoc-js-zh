- img_proc: true
  md: '# Module 11: Cross-Platform Functions and Issues 373


    it? Now try this—cd “program files” and include the quotes. That should work.
    Windows NT/2000 users, in the cmd.exe environment, can simply type cd program
    files because the system actually stores the longer filenames.


    So, what does this mean for you? Well, if you try to launch an application where
    you need to specify a path that contains a space, even on Windows NT/2000, you
    need to put the path (not the drive letter) in quotes. Let''s say, for instance,
    you want to open the Program Files folder to see the contents. This can be done
    using the start command, which is internal to the environment (that is, you won''t
    find a start application). Without using Perl, you could do this by typing c:\“program
    files”. Without the quote, Windows thinks you''re passing two arguments, program
    and files, rather than one, so it doesn''t work. For your argument list, then,
    you need to do the following:


    ```

    @args = ("start", "c:\program files");

    ```


    Notice how we use single quotes to be able to put quotes in our argument list.
    Let''s try this in a script named sys_win.pl. We can use our previous program
    to get going—all it takes is a single change. The complete program would look
    like the following. See Figure 11-2 to see the result of running this program,
    which operates the Program Files directory in a window.


    ```

    #!/usr/bin/perl -w


    # store command and arguments in array

    @args = ("start", "c:"program files");


    # call system() function

    $result = system(@args);


    # if $? contains anything, store values in appropriate variable

    $exit = \$7 / 256; # contains exit status

    $sig = \$7 & 127; # contains signal number

    $core = \$7 & 128; # contains 1 if program performed core dump


    # if system() call returned non-zero then problem. exit

    # program and send error information to STDOUT

    $result == 0 or die "\n" "@args" " = @args\nexit:\nSignal\nNumber: \$sig\ncore:
    \$core\nMessage: \$!";

    ```


