  md: '# Module 12: Error Messages and Debugging 339


    is the same one we had before on line four of the program. The last error we added
    is a missing double quote on line six. Now let''s talk about the information in
    Figure 12-2.


    The first error it finds is on line three of the program near "". Because we know
    where the errors are ahead of time, we know an error isn''t on line three, but
    we know it''s probably close. Normally, after a few seconds of inspection, you
    would find the missing semicolon on the previous line.


    # Note


    We recommend you only try to fix one error at a time when you compile errors because
    the Perl interpreter gets confused easily and any additional errors listed may
    actually not be errors. Correcting one error at a time is the most efficient way
    to get your program running.


    The next error in Figure 12-2 appears to be on line eight, but again, we know
    no errors are on line eight. In fact, the interpreter didn''t even find one of
    the errors we made in the file. This is a good place to follow our recommendation
    by fixing the first error and executing the program again. After correcting the
    error on line two, the following is what we get from the interpreter.


    Now, in Figure 12-3, you can see we''re past the first error and back to our original
    error on line four, even though the interpreter says the error is on line five.
    Correcting this error should lead us to the last error. We take a look.


    Notice in Figure 12-4, the interpreter tells us the error is on line eight and
    it gives us a bit of insight as to what it thinks the problem may be. The interpreter
    says the error might be a runaway multiline string and its. The missing double
    quote causes a major problem because the interpreter cannot find the end of the
    string. Once this problem is corrected, the program can execute properly.


    # Common Practices


    As we mentioned earlier, a common practice is trying to fix only one error at
    a time because errors have a way of cascading when several are present. You can
    spend so much time trying to determine what the interpreter really means if you
    focus on more than one error at a time.'
