- img_proc: true
  md: "```\nif (expression)\n{\n  'then' statement block\n}\n```\n\n# Note\n\nNo syntactical\
    \ changes are between an if-then-else statement and an if-then statement, other\
    \ than the else portion that includes its statement block was removed.\n\nNow\
    \ that you know the syntax for the if-then-else statement, let's look at a short\
    \ program containing one.\n\n```\n#!/usr/bin/perl\n$a = 20;\nif ($a = 15) {\n\
    \  print \"a is equal to 15.\\n\"\n} else {\n  print \"a is not equal to 15.\\\
    n\"\n}\n```\n\nThis program prints \"a is equal to 15\" if the expression evaluates\
    \ to true; otherwise, it prints \"a is not equal to 15.\"\n\nHaving an else statement\
    \ block without first having an if statement block is illegal in Perl. If you're\
    \ only concerned about the cases when the expression evaluates to false, you can\
    \ use the unless conditional statement to avoid having an if-then-else statement.\
    \ The syntax for the unless conditional statement is as follows.\n\n```\nunless\
    \ (expression)\n{\n  'unless' statement block\n} else {\n  'else' statement block\n\
    }\n```"
