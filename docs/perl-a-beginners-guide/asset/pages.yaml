  md: '# 236 Perl: A Beginner''s Guide


    This regular expression can only be satisfied if the word "eat" is found by itself
    as part of a string.

    Another pattern anchor similar to the one just discussed is the "\B" anchor. This
    is basically the opposite of the "\b" pattern anchor because it signifies that
    the string you are searching for must be contained inside a word and not at a
    word boundary. Consider the following regular expression:


    ```

    $string =~ /Beat/;

    ```


    The following are a few of the strings that can trigger a match for this regular
    expression.


    ```

    $string = "meat";

    $string = "feature";

    ```


    From this example, you can draw the conclusion that the "\B" pattern anchor requires
    that one or more characters must come before the specified sequence. The following
    string wouldn''t satisfy the regular expression.


    ```

    $string = "eating";

    ```


    This string won''t satisfy the regular expression because no characters are before
    "eat" in the word.

    Just like the "\b" pattern anchor, this pattern anchor can be used at the beginning,
    or the ending and the end of a sequence of characters. Here are a few examples
    to demonstrate this for you:


    ```

    $string =~ /~Beat\B/;

    ```


    This regular expression requires the string "eat" be an interior portion of a
    larger word, like "feature." Let''s look at one more example:


    ```

    $string =~ /eat\B/;

    ```


    This regular expression requires the string "eat" be followed by at least one
    character, like in the word "eating," for example.'
