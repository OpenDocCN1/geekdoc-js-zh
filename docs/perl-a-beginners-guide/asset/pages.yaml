    In the next section, we quickly look at cookies because they''re important in
    creating HTML content and tracking users. If, for instance, you want to build
    a shopping cart on your site, then you probably want to use cookies to identify
    your users as they shop, so you can keep their cart with them and up-to-date.


    # Why Cookies?


    Because the CGI client/server connection is a stateless event, which means each
    request is unique and unrelated to any other, all information about a previous
    visit is lost when the connection is terminated (that is, the page is'
  merge: -1
