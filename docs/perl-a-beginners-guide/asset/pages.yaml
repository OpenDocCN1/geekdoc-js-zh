  md: '# Project 13-1: Hello, World! Dialog Box


    The Perl/Tk is an interesting and exciting module that can be used in your programs.
    Covering it in enough detail to do justice, however, is far beyond the scope of
    this book. Many of the terms, concepts, and programming techniques take while
    to learn, but we didn''t want to leave the last section of the final module without
    an example. And, you are correct, it''s another “Hello, World!” example.


    In this quick example, which we put in a file called hello-tk.pl, we create a
    dialog box, simply titled “Hello, World!”, which has an


    > perid Tk::UserGuide is an excellent starting point for more information on the
    Perl/Tk.


    OK button. When you click the button, the dialog box closes. The following steps
    perform this task.


    # Step-by-Step


    +   1. Create a new file hello-tk.pl that contains the necessary path to the Perl
    interpreter. You should know how to do this now, so we won''t list the necessary
    code.


    +   2. Next, load in the Tk module, which can be done using the following line:


    ```

    use Tk;

    ```


    +   3. In using the Tk module, first create an instance of the MainWindow object.
    This is done using the following:


    ```

    $my_dialog = MainWindow->new;

    ```'
  merge: -1
  pgno: 465
- img_proc: true
  md: '# Module 13: Advanced Features and Concepts


    4. Next, specify the title of the dialog box. To do this, set the title property
    of the MainWindow instance we created:


    ```

    $my_dialog->title("Hello, World!");

    ```


    5. Because we want to include an OK button that will close the dialog box, we
    must create an instance of the Button object, referenced through the MainWindow
    instance. This ensures the button is created on the right dialog box. In doing
    this, we pass arguments to assign the text of the button and the command that
    should occur if the button is pressed.


    On the command, we actually define the subroutine to be called within the body
    of the button creation. We perform the destruction of the dialog box by calling
    the Perl exit() function. This code looks like the following:


    ```

    $my_dialog->Button(-text => "Ok", -command => sub{exit})->pack;

    ```


    6. The final line of our script is a call to a subroutine in the Tk module. This
    subroutine starts the event handler in motion, so we can capture the button click
    when it occurs. Our completed code looks like the following:


    ```

    #!/usr/bin/perl -w


    # load the Tk module

    use Tk;


    # create a new window/dialog instance

    $my_dialog = MainWindow->new;


    # set the title of the dialog

    $my_dialog->title("Hello, World!");


    # put a button on the dialog that will close it when clicked

    $my_dialog->Button(-text => "Ok", -command => sub{exit})->pack;


    # start the event handlers "listening" for events

    MainLoop;

    ```


    ![](img/2070407c4a70134aab89572f10d21e60_466_0.png)'
  merge: -1
