    # No-Parse Header Scripts


    Typically, scripts produce output that''s parsed by the server and sent back to
    the browser. However, it''s possible for the script to handle this process rather
    than the server. This type of script is called NPH (No-Parse Header) script.


    The major advantage of an NPH script, whose name needs to begin with nph-, it
    can be more efficient because the processing load is taken off your Web server.
    If you don''t want the server to parse the header, however, you need to add the
    appropriate header yourself. This means your program must return a valid HTTP/1.0
    or HTTP/1.1 response to the browser.


    To get a better understanding of how this is used, here''s a quick example. The
    NPH program listed communicates with the browser directly and references the SERVER_PROTOCOL
    as HTTP/1.1.


    ```

    #!/usr/bin/perl -w


    print "HTTP/1.1 200\n\n"

    print "Content-type:text/html\r\n"

    print "<html>"

    print "<head>"

    print "<title>Test NPH Script</title>"

    print "</head>"

    print "<body>"

    print "<h1>h1-NPH Script</h1>"

    print "<p>My sample NPH script.</p>"

    print "</body>"

    print "</html>";

    ```'
  merge: -1
