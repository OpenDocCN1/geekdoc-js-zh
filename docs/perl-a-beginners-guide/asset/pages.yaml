  md: '# Module 12: Error Messages and Debugging 409


    The search option can be used to search through a program for a certain string.
    You don''t have to specify line numbers to use this option; you only need to supply
    the string you want to search for in the program. Searching for a string sounds
    familiar, doesn''t it? Searching for a string is similar to a regular expression
    search, in fact, you have implemented a program as your final project in Module
    7 that does something similar to a specified file. The string you want to search
    for must be enclosed with forward slashes // if you want your search to start
    from the beginning of the program. The following is an example of how to issue
    this command, and Figure 12-9 shows the screen output from the command:


    ```

    DB(6) /key/

    ```


    In Figure 12-9, we''re searching for the string "key." The program contains this
    more than one time so, to display additional occurrences, you can reenter the
    search command. If you enter the search command more times than the specific string
    occurs in the program, starts searching from the beginning once more and shows
    you all the same listings again. If you want to search for a specific string starting
    at the end of the program, all you have to do is enclose it with question mark
    characters “?” instead of forward slashes. This command also starts over at


    ![](img/2070407c4a70134aab89572f10d21e60_432_0.png)


    +   Figure 12-9 Using the search // command'
