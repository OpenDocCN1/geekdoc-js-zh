    +   - What is the difference between a package and a module?


    # How Do Packages and Libraries Work?


    Part of understanding Perl libraries, whether it''s packages or libraries, means
    understanding how they work. In this portion of the module, we look at how these
    libraries work, so you can be prepared to use and create them on your own. This
    covers the following:


    +   - Construction and destruction of the libraries

    - A package is a namespace, while a module is a package contained in a library
    file of the same name.'
