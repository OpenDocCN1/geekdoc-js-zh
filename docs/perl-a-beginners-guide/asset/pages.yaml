  md: '# Perl: A Beginner''s Guide


    # Project 2-1: Saving Data to Scalar Variables


    Write a program that can save your name and your age into separate scalar variables.


    # What Operators Do


    So far you know what types of scalar data are valid in Perl. We covered how to
    create valid names and assign scalar values to them. Now you need to know how
    to do something with the data you''ve stored. This leads into the topic of operators.


    An operator is simply defined as an operation that takes one or more values, performs
    some sort of calculation, and yields a new result. Now, going back to math class,
    the values on which the operator "operates" are called the operands. The result
    is referred to as the result (of course).


    The operators we cover in this module are specifically for numbers and strings.
    Perl expects to see numbers OR strings when using any of these operators.


    # Note


    If you are using an operator and you give it a number and a string, you still
    get a result. This result will probably be impacted by some sort of type conversion.
    Type conversions are covered in more detail in the last section of this module.


    # Common Operators


    The first set of common operators we cover is for numbers. Once we discuss them
    and give you some examples of how each of them functions, we move on to talk about
    operators for strings.'
