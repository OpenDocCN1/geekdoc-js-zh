  md: '# Module 11: Cross-Platform Functions and Issues 377


    # Note


    Unlike the Windows environment, you cannot launch or open a folder using the system()
    function on the Mac OS.


    # Note


    Web sites often change the location of their resources, so if this link doesn''t
    work, check the Tools section of Apple''s developer site. This should be located
    at http://developer.apple.com/Tools. From there, you can follow links to the Macintosh
    Programmer''s Workshop (MPW).


    As with the Windows 95/98/Me systems, the Mac OS has some limitations in how and
    what you name files. No internal mapping of filenames exists, but there is a hard
    limit of 31 characters for any folder or filename. Additionally, these names cannot
    have a null or :, but they can include any other character. Also, if the files
    or folders have spaces in them, then you must enclose them in single quotes.


    ![](img/2070407c4a70134aab89572f10d21e60_400_0.png)


    # Project 11-1: Using the system() Function on the Mac OS


    A good example of how this process works on the Mac OS is simply to launch a program
    that resides on the file system, but in a folder or along a path with spaces.
    Let''s step through each example to show this.


    # Step-by-Step


    +   1. Because you must have ToolServer running before you can use the system()
    function, let''s go ahead and start it. To do this, all you have to do is double-click
    the ToolServer icon, which is available after you extract the file you downloaded
    from http://developer.apple.com.


    +   Next, you need to create your script, which you can call sys_mac.pl. To do
    so, we recommend put it in the UNIX-style path to the Perl interpreter with the
    -w option, even though you are only running on Mac OS. This tells the interpreter
    to write out any warnings it may encounter.


    ```

    #!/usr/bin/perl -w

    ```


