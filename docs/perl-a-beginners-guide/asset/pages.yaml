  md: '# Module A: Answers to Mastery Checks 449


    # Module 3: Control Structures


    +   1. Which conditional statement executes a statement block as long as the specified
    expression is true?


    +   D. Both A and B


    +   2. How many expressions is a for a statement required to have?


    +   A. 1


    +   3. What makes do while and while statements unique?


    +   B. Do while statements always execute the statement block once


    +   4. How many levels of control statements can be nested in Perl?


    +   C. An unlimited amount


    +   5. Which of the following is a valid use of a control statement?


    +   D. All of the above


    +   6. Which of the following groups of conditional statements can be used with
    a single line conditional statement?


    +   A. If, while, until, and unless


