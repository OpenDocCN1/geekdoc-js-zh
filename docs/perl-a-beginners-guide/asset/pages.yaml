  md: '# Bit-Manipulation Operators


    Perl provides you with the capability to manipulate the bits of integers through
    the use of bit-manipulation operators. These bit-manipulation operators first
    convert floating-point numbers to integers. Then they convert the integer to its
    binary representation. Once they have the number in its binary form, any of the
    following operations can be performed.


    | Operator | Description |

    | --- | --- |

    | & | Bitwise and |

    | | | Bitwise or |

    | ^ | Bitwise exclusive or |

    | <<, >> | Left shift and right shift |


    To understand how these operators work, here''s a truth table of all the logical
    comparators.


    | X value | Y value | Z value | and | exclusive or | not |

    | --- | --- | --- | --- | --- | --- |

    | 1 | 1 | 1 | true | false | 000 |

    | 1 | 1 | 0 | false | true | 001 |

    | 1 | 0 | 1 | false | true | 010 |

    | 1 | 0 | 0 | false | true | 011 |


    Now, using this table, you can figure out how the bit-manipulation operators compute
    their results. Here''s a simple example to make this more clear.


    The integer number 3 is 011 in binary notation. The integer number 7 is 0111 in
    binary notation. When Perl is performing a bitwise "and", here is what it does:


    ```

    0011 #this is 3 in binary notation

    0111 #this is 7 in binary notation

    0011 #"and" is true when both values are true, so you wind up with 0011,

    which is 3.

    ```


    The previous example in a program would look like this:


    ```

    Sa = 3 & 7; #the result of this operation would be 3

    ```'
