  md: '# More Complex Operators and Functions


    Perl provides you with an additional set of operators that are meant to save you
    time over using the traditional operators we talked about in the previous section.
    These additional operators can also be separated into the categories of numbers
    and strings. First, let''s look at the additional operators for numbers.


    The binary assignment operator is a short-hand way of representing a calculation
    and an assignment. For example, from the previous section, if you wanted to add
    some number to a variable and set the result equal to that variable, your code
    would look something like:


    ```

    $x = $x + 10;

    ```


    Using the binary assignment operator, you can accomplish the same task with:


    ```

    $x += 10;

    ```


    Binary assignment operators exist for addition, subtraction, multiplication, and
    exponentiation. Here are some examples to show each of these operators in use
    and how they compare to their equivalent standard statements.


    | Binary Assignment | Same as Saying |

    | --- | --- |

    | $x += 2 | $x = $x + 2 |

    | $x -= 2 | $x = $x - 2 |

    | $x /= 5 | $x = $x / 5 |

    | $x *= 5 | $x = $x * 5 |

    | $x **= 4 | $x = $x ** 4 |


    Let''s go to a programming example to demonstrate that using the binary assignment
    operators and the basic operators yields the same results.


    ```

    #!/usr/bin/perl

    $x = 12;          #here we are assigning a value to a scalar variable

    $y = 3;           #same here

    $z = 2;           #same here

    ```'
