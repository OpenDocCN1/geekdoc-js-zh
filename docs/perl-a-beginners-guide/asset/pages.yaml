  md: '# 52 Perl: A Beginner’s Guide


    Variables are something we haven''t covered yet, so let''s discuss them next.


    # Variable Assignments


    So far in this module, we''ve talked about numbers and strings, which are both
    forms of scalar data. When you''re writing programs, you have to save some of
    your scalar data values for various programming uses. This is where the use of
    scalar variables comes into play.


    A scalar variable can be thought of as a storage bin. You can put one scalar value
    into the bin and take it out whenever you need it. You can change what you have
    in the storage bin at any time during a program''s execution. The only thing that''s
    constant throughout your program''s execution is the name you give your variable.


    # Naming Scalar Variables


    You need to follow certain rules when you create scalar variable names in Perl.


    You have to begin your scalar variable name with the ''$'' character. This character
    is only used for declaring scalar variables. In a future module, we introduce
    you to a different kind of variable. With this in mind, remember the dollar sign
    character is only used for scalars.


    The ''$'' character must be followed by at least one letter. Scalar variables
    cannot begin with a numeric character. Perl is a case-sensitive programming language.
    The $a is different from the $A. Once you have one letter, you can add up to 255
    digits, letters, and underscores to complete your scalar variable name.


    Now you know the rules to follow when naming scalar variables, so let''s look
    at some examples.


    ```

    # These are examples of legal scalar variable names:

    $sal

    #This is a perfectly legal variable name

    $a1

    #This is also legal but it is a different variable than the

    #first because Perl is case-sensitive

    ```'
