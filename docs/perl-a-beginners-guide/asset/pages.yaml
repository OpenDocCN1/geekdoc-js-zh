  md: '# Note


    When you look at this drawing, remember it''s meant to represent how external
    elements can be included in your programs. This doesn''t mean however, a library
    must include both objects and functions—it could easily include one type.


    ![](img/2070407c4a70134aab89572f10d21e60_183_0.png)


    Now that you have an idea of what makes up programs, let''s dive deeper into the
    why''s and how''s of program organization. From this point on, we use the Perl
    terminology for “functions,” which are subroutines, and “libraries,” which are
    packages. We wanted to introduce these topics under the more common (across other
    programming languages) terminology, but now we need to focus on the way they are
    used in Perl. Let''s get on to the good stuff.


    # Why You Should Organize


    Although reasons to organize seem fairly obvious to many people, it''s a topic
    worth discussing. Let''s face it—if it were obvious, why do we'
  merge: -1
