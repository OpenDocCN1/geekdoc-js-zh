  md: '# Array Functions


    Perl provides you with several different array functions to make manipulating
    data inside arrays easier. Some of these functions are powerful in that it would
    take several lines of code to perform the same task they do in just one statement.
    You''ve already been introduced to some of these functions, but not in the array
    context. Let''s begin with the functions you''re already familiar with. We give
    examples of how each of them works through short programs.


    The first array function we discuss is the chop function, which behaves just as
    it does for scalar values. The chop function removes one character from the end
    of a specified string each time it is called, regardless of the character. For
    arrays, the chop function removes one character from every element of the array
    each time it''s called. Here''s a programming example that demonstrates the chop
    function in use:


    The original array is created


    ```

    #!/usr/bin/perl

    @array = ("This\n", "array\n", "will\n", "never\n", "the\n", "same\n");

    print "The original array contains --> @array \n";

    chop(@array);

    print "After one chop the array contains --> @array \n";

    chop(@array);

    print "After two chops the array contains --> @array \n";nchop(@array);

    print "After your chops the array contains --> @array \n";

    ```


    Each time a chop is executed, one character is removed


    The output of the previous programming example can be seen in the following illustration.'
