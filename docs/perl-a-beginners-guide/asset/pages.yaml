  md: '# Module 11: Cross-Platform Functions and Issues 375


    # Hint


    Want to see what directories are in your PATH? Type set at a command prompt. Want
    to set or change your PATH? Type set PATH=PATH;<new_dir>, where <new_dir> is the
    new directory you want to add. If you have more than one, simply separate them
    with semicolons. PATH tells the system to keep the current PATH in the new path,
    as well (without it, your PATH is modified to include ONLY <new_dir>. Be aware
    this only modifies the PATH for the current session (that is, the current command
    prompt). If you want to make sure the entire system always has access to this
    change, Windows 95/98/Me users need to place the command in their autoexec.bat
    file. Windows NT/2000 users need to edit the PATH environment property by right-clicking
    My Computer, selecting Properties, and then clicking the Environment tab. Once
    you access this area, the PATH entry and modify the Value text field.


    # UNIX


    Like Windows, the UNIX PATH environment variable must contain a complete path
    to the actual executable. You can check your PATH setting by typing env at the
    command line to see a complete list of environment variables.


    The test, simply typing the command you execute to run from a command prompt,
    also works for UNIX. If it doesn''t work, then you either need to include the
    directory that contains the program you''re executing in your PATH or specify
    the path to the program. The method of setting this varies from shell to shell,
    but we include the most common methods in Table 11-1.


    > Hint

    Want to see only the $PATH entry? Try typing env | grep PATH or echo $PATH.


    Like the Windows environment, UNIX has its own syntax for passing argument to
    its applications: UNIX uses a hyphen, “-\, in front of them. For instance, if
    you want to launch Netscape Composer, mentioned previously, you would type netscape
    -edit at a command line. Here is a complete example put in a script sys_unix.pl,
    which performs this on a UNIX system. This does assume, as just mentioned, the
    netscape application is on the PATH.


    # 11'
