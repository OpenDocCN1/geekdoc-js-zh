  md: '# Introduction


    Welcome to Perl: A Beginner''s Guide! First, we want you to know how excited we
    are that you''ve given us the opportunity to show, teach, and expose you to the
    Perl programming language. Without beginners, there would be no intermediate or
    advanced programmers. You are the next generation that will carry the Perl language
    through the twenty-first century and, hopefully, teach future generations what
    you''ve learned.


    Perl has had quite a history, and those who program in the language are almost
    cult-like in their following. This is a close community that reaches out to spread
    the word about Perl—a community waiting with open arms to welcome you as a beginner
    and nurture you through your evolution. Enough about Perl for now, though. Let''s
    introduce the book.


    What we tried to do here is not only teach you the Perl language and programming
    techniques, but also help you learn how to operate within the Perl community.
    We want you to become an evangelist for Perl. We want you to tell your fellow
    students, coworkers, or friends who operate in the computer world about Perl and
    how wonderful it is. We want you to move from a beginner, through the intermediate
    stages, and on to become an advanced programmer. Perl is a great language and
    we want this book to be your first step in understanding how to program in it.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# # Who Should Read This Book?


    Well, for starters, if the title didn''t give it away, this book is for beginners.
    But there are different kinds of beginners, so we''ll clarify.


    Perl: A Beginner''s Guide is a book for those beginning to program in the Perl
    language and those who are beginning to program in any language. So many beginner
    books today lose sight of basic concepts and semantics that go along with programming,
    and our aim was not to do this. We want to build and strengthen your programming
    skills as you learn the language. Our approach is similar to that of learning
    grammar and spelling of the English (or whatever your language may have been)
    language in grade school. The grammar and spelling are underlying characteristics
    and requirements across all languages, but this book teaches you those in the
    Perl language.


    Your next question might be, "Well, I learned how to do some programming in a
    previous life and don''t want to learn those underlying skills again. Is this
    book still for me? In one word—absolutely. True, you might read through some sections
    faster than a first-time programmer, but most sections have Perl at the head of
    their topics. And, like any language, just because an idea is present doesn''t
    mean it''s implemented the same way in different languages. In this book, we try
    to show you the Perl way so, if you are aware of other methods, the book can help
    clarify for this.


    If you aren''t a beginning programmer or a beginning Perl programmer, to some
    degree. Is this book also for you? Again, the answer is absolutely. When we first
    learned Perl, we thought we knew it just because we could open files, look for
    occurrences of words or strings, and write the output to a browser or another
    file. Well, there''s much more to Perl than that, and we touch on all these topics.


    Finally, if you have been programming in Perl a bit or you are an advanced programmer?
    Is this book for you? If you fall into one of these categories, you may need to
    choose another book. If you want to pick up in-depth details on the language in
    a short period of time for a project, this isn''t the book for you. If you are
    still reading at this point, then we assume you bought the book and you want to
    read it. For you who have made this far, let''s take a few minutes to discuss
    what we plan to cover during our time together.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Organization of the Modules


    This book is in two primary sections with 13 chapters, “modules,” as we call them.
    The first section gets you up and running with the Perl language. It gives you
    a list history and some operating environment information, and it discusses many
    of the basic concepts that need to be covered so you understand both Perl and
    programming in general.


    The second section of the book builds on the first by applying what has been learned
    in Perl. This section guides you through manipulating files and directories, to
    building Web application programs and connecting to databases. We end the section
    with a module that touches on some advanced Perl topics.


    Now, let’s take a closer look at what makes up each section.


    # Part 1: Getting Started


    The first section of the book focuses on getting started with the Perl programming
    language. Within this section are five modules: Module 1, “Introduction to Perl,”
    introduces you to the Perl language, provides some history, gives you information
    on the environments in which it works, and leads you through installing it. Module
    2, “Scalar Data and Operators,” teaches you about the data types in Perl and how
    you can use the various operators to accomplish your decision-making tasks.


    Module 3, “Control Structures,” is the first chapter that applies some of what
    you have learned. It exposes you to conditional and control statements, and shows
    you how to handle nested loops. Module 4, “Arrays, Lists, and Hashes,” shows you
    different methods of storing data. Module 5, “Program Flow and Subroutines,” concludes
    the section by looking at how you should organize your programs and shows you
    how to use subroutines.


    # Part 2: Applying Your Knowledge


    The second section of the book puts you to work right. Module 6, “Working with
    Files and Directories,” teaches you about opening file and directory streams,
    and how to read and write from them. Module 7, “Regular Expressions,” covers the
    topic of pattern matching, which many argues is the single strongest point within
    Perl.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Perl: A Beginner''s Guide


    Module 8, “Packages and Modules,” not only shows you how to use Perl package libraries
    (if you don''t know what we''re talking about, don''t worry!), but also shows
    how to build them. Module 9, “Interacting with Databases Using the Perl DBI,”
    shows you how to connect to databases for all your data repository needs. Module
    10, “Writing CGI Programs,” ends the focus on doing specific things in Perl by
    showing you how to build CGI programs to use when you have Web sites.


    Module 11, “System Functions,” takes a slightly different objective addressing
    the topic of system functions in the Perl language. We discuss the different system
    functions and how they can be run from the Perl environment. Module 12, “Error
    Messages and Debugging,” takes you through the jungle of debugging code and problems.


    The final module, Module 13, “Advanced Features and Concepts,” is where you can
    have fun. You''ve basically finished the book at this point and this module discusses
    object-oriented programming, PerlScript, and the Perl/Tk for creating GUI applications.
    All interesting stuff.


    # Writing Conventions


