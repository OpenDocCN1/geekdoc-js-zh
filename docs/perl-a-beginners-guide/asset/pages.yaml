  md: '# Perl: A Beginner’s Guide


    Now that we''ve covered lists in detail, you''re probably wondering what to do
    with them. This is where our next topic in this module comes into play. Let''s
    go to the next section and learn about the array variable and all its uses.


    # Arrays


    An array variable is much like a scalar variable in it''s created to store data.
    The difference is the array variable is designed to store a list, whereas a scalar
    variable is used to store singular scalar data. The array variable is signified
    by beginning with the @ character. The naming rules for array variables are the
    same as for scalar variables. These rules were covered in Module 2 of this book.
    After the @ symbol, the name must begin with a letter, and then any combination
    of letters, numbers, or underscores may follow. If you''re writing a program and
    using array and scalar variables, these variables can be the same name, simply
    because the first character designations ($ vs @) are different. Having a scalar
    named $HT and @HT in the same program is legal. The first thing you should learn
    before you proceed is how to create an array containing scalar values.


    # Putting Items In


    The process of creating an array is simple. The following piece of code creates
    an array containing ten values:


    ```

    @numbers = (1 .. 10);

    ```


    This line of code creates the array, @numbers, which contains the numbers one
    through ten. The previous line of code is called an array assignment. Each of
    the numbers contained in the array is referred to as an element of that array.
    You can print the contents of an array to the screen using the same print command
    we''ve been using. The following piece of code:


    ```

    print @numbers;

    ```


