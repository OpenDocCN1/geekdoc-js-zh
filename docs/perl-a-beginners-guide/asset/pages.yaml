    # Tip


    Throughout this section, you''ll hear us refer to a caller regarding subroutines.
    By caller, we mean what we actually called the subroutine. Was it another subroutine
    or another function? Maybe it was just called in the main body of your program?
    in any case, the caller of the subroutine is what receives the return data and
    is responsible for passing on that information if any further processing is needed.


    In addition to this naming guideline, also note that naming a subroutine in all
    capital letters is a loosely held convention for internal subroutines, so don''t
    use all capital letters for subroutines you write. These subroutines tell the
    Perl interpreter to call the module indirectly (usually of some triggered event).
    See the section on “Predefined Subroutines” later in this module for more information.
    Now that you know about these two instances, let''s look at what you should be
    doing with subroutines.


    The basic syntax is as follows, where NAME references the name you want to call
    the subroutine and code is the code you want to execute when the subroutine is
    called.


    ```

    sub NAME{

    code;

    }

    ```


    Unlike many programming languages, subroutines don''t explicitly list, in the
    definition, any parameters that may be passed. Instead, as you see later in this
    module, arguments are stored in an array that''s accessible to the subroutine
    when called. In addition, you must use the local() and my() functions, also discussed
    later, to store and work with values local to the routine.


    Not all subroutines have arguments passed. Some only need to perform a specific
    task, such as provide an entry in a log file, at a specific instance—a task that
    is somewhat independent of the program calling it.'
