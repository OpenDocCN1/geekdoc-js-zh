  md: 'The next function we cover is the opendir function, which lets you open a directory
    and associate that directory to a directory handle. Once you use this function
    to open a directory, you can perform other operations on it, such as reading all
    its contents. The syntax for this function is as follows:


    ```

    opendir (directory handle, directory);

    ```


    The directory handle is the name you associate with the opened directory and the
    directory field is where you specify which directory to open.

    Once you open a directory and complete all your work with it, you must be able
    to close the directory. To do this, you need to use the dosedir function. The
    syntax for this function is as follows:


    ```

    closedir (directory handle);

    ```


    After you open a directory using the opendir function, you can do several things.
    One of these is to read the contents of the directory using the readdir function,
    which returns the first file or subdirectory in the opened directory. Let''s look
    at the syntax for this function:


    ```

    readdir (directory handle);

    ```


    As previously stated, this function only returns the first file or subid in the
    opened directory. If you want to read all the contents of a directory, you need
    to implement some sort of loop that executes the readdir statement while something
    is to read.


    # Project 6-3: Searching for Files


    Using the functions you have learned so far, write a program that will take a
    filename from user input and search for that file in a given directory. You should
    continue to search for the file until it is located or until there are no other
    files for which to search.'
