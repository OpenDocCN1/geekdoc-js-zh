  md: '# Project 7-1: Searching for a Regular Expression in a File


    Write a program that will read in all the contents of a file, one line at a time,
    and for each line that is read in, search for a given regular expression. If the
    regular expression is found, you would save the string it was found, so it can
    be printed out to the screen. You iterate through every line of the file until
    the end of the file is reached. As a final step to the program, you should print
    out the number of times the given regular expression was matched.


    So far, all the examples have been matching regular expressions anywhere in a
    string of data. For instance, if you were searching for the regular expression
    "eat" in a string, the word "feature" would satisfy your search, even though you
    might have really been searching for the word "eat". There''s a way around this
    problem when you''re working with regular expressions—it''s called anchoring patterns.


    Anchoring patterns is the idea that you can predetermine exactly where exist and
    we start by covering the "b" pattern anchor.


    The "b" pattern anchor tells the regular expression that the given sequence of
    characters must be on a word boundary. A word boundary is basically the beginning
    or the end of a word. The problem we previously discussed, searching for "eat"
    in a string, can be solved using the "b" pattern anchor. Here''s an example of
    how this anchor is used:


    ```

    $string =~ /

    ```


    This regular expression will only be satisfied, first, if the pattern is found
    and second, if it is found at the beginning of a word. The beginning of a word
    is a word boundary because it''s located at one of the outermost parts'
