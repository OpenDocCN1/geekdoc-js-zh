    A while statement can easily be designed to be an infinite loop. For instance,
    in the previous example, if we''d left the autoincrement statement out of the
    statement block, we would have had an infinite loop. The value of $a would have
    always been less than 25. Infinite loops are useful in programming in many ways.
    Probably the best example is if you set up a program to run inside an infinite
    while loop, which constantly checks for some sort of system error. This error
    would cause the loop to terminate, which would immediately let you know some sort
    of error must have occurred.


    The statement block of the while conditional statement can be executed an infinite
    number of times, as we just discussed, but it''s perfectly legal for the statement
    block to never be executed. If the expression evaluates to false on the first
    iteration, the whole statement is skipped.'
