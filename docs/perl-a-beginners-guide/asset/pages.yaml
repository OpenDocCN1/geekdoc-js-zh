    # Creating a Perl Program


    Creating a Perl program is a task you should approach correctly. Sure, you can
    simply open a text file, type in some lines of code, and run it, but this is always
    the best way? If you need something short, sweet, and quick, then this could be
    fine, if you are writing a long, in-depth script, which you want to use in the
    future or you''ll be passing off to another person or group, you should follow
    some basic guidelines.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Module 1: Introduction to Perl


    +   - Plan the flow of your script by what functions you want it

    nto perform.

    - Organize the script so you can reuse parts, if needed.

    - Document, document, document (as our former boss Kerry said).


    # Getting Started


    The first thing we do when writing a script is to take a template we created and
    save it under the script name of our current project. Because we use a template,
    all the scripts we write have a consistent look and feel to them—this is true
    no matter who''s looking at it. In a Perl script, you need to understand a few
    things before you start and before you create a template.


    # Comments


    The first thing you should understand is the syntax for a comment. A comment is
    nothing more than text in your code, which isn''t supposed to be interpreted as
    code. This text is often used to add information or other descriptive text about
    your code or sections of it.


    Unlike Java, JavaScript, C/C++, or other C-flavored programming languages, Perl
    uses the number sign, # (referred to as pound or sharp) to designate a comment.
    When one of these is used, it means the text starting after the # until the end
    of the line is a comment. Perl has noiline comment market, so you don''t need
    to be concerned about it running too far. Here''s an example of a comment to give
    you a better idea:


    ```

    # My comments go here

    ```


    # The First Line


    The next thing you should know about writing a Perl program is that many of the
    platforms, including flavors of UNIX, require the first line to start with a #
    and the path to the Perl interpreter. Implementations on the Mac and Windows platforms,
    as well as some others, don''t require this line; because run-time options can
    be passed to the Perl interpreter on this line, they can be used. In these instances,
    the interpreters usually ignore the path and only look at the options.'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'For instance, if you want to run your script in Warning mode and the Perl interpreter
    was in /usr/bin, then you would have the following first line:


    ```

    #!/usr/bin/perl -w

    ```


    See how easy this is? And this works on most other platforms, if your platform
    does not need the path. Because Perl interpreter can accept many different options,
    a list of them is included in Table 1-6. Don''t worry if some of the terminology,
    is a bit complex here—as a beginner, you won''t use many of them. If you''re interested
    in a more in-depth description, check the perlun manpage. Table 1-7 lists debugger
    options.


    # Creating a Template


    Because you want your script to include information, such as who wrote it, when
    it was written, what it does, and what version it is, the template you want to
    use should provide room to fill in this information. In addition, if you are creating
    subroutines in the script, you''ll also want to provide what is passed in, what
    is returned, and a description of the function


    | Option | Description |

    | --- | --- |

    | -0[digits] | Specifies the input record separator as an octal number |

    | -a | Turns on Autoplay when used with a -n option or a p option |

    | -C | Allows for the use of native wide character APIs |

    | -c | Tells the interpreter to check the syntax of the script without executing
    it |

    | -d | Runs the script in the Perl debugger |

    | -D:module | Runs the program under the control of another module |

    | -letters | Enables to specify debugging flags. See Table 1-7 for a list of the
    flags |

    | -Dnumbers | Enables to specify debugging flags. See Table 1-7 for a list of
    the flags |

    | -e commandline | Can be used to enter one line of a Perl program |

    | -Fpattern | Specifies a pattern to split on if an option is also used |

    | -h | Prints a summary of the options |

    | -i[extension] | Tells the interpreter that files processed by the <> construct
    should be edited in place |

    | -l[directory] | Places the directories passed in the search path of modules
    |

    | -o[octnum] | Enables automatic line-ending processing |


    # Table 1-6 Perl Interpreter Options'
