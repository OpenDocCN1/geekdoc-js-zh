  md: '# Perl: A Beginner’s Guide


    Now that you have a brief introduction in the history of Perl, let''s get right
    into learning how to program in it. All programs are written for a reason. Your
    program could be used to perform calculations, build a Web page, or search through
    a file for a certain word. Either way, you are attempting to solve a problem and,
    most likely, that problem revolves around data manipulation if you are using Perl.


    Scalar data is the most basic type of data Perl is used to manipulate. The term
    *scalar data* refers to a single data type that encompasses numbers and strings,
    but for this module, we make a separation between the two. In this module, you
    learn about the different data types and are introduced to the concept of assigning
    various types to variables. You learn about the operators present in Perl that
    can be used on this data and, finally, you learn how Perl handles type conversions
    between different data types. To get started, let''s look at the different data
    types.


    # Data Types


    Data types can be separated into two categories. First, are numbers like 62, 6.2e10,
    or 7F. Second, are character strings like "hello". To start this module, we discuss
    numbers and, once you have learned how they are handled, we move on to discuss
    strings.


    # Numbers


    Numbers, from a users'' standpoint, commonly come in two different forms. The
    first type of number is an *integer*, which refers to a whole number. A whole
    number is basically a number with no decimal point, like 62 or -1992. These numbers
    are represented as base 10 digits. If you want to include decimal points, these
    are the second kind of numbers, which are called *floating-point* numbers. Floating-point
    numbers look like 62.2 or -1.992e20. Two other special types of numbers discussed
    in this section are octal and hexadecimal numbers. *Octal* numbers are represented
    with base 8 digits and *hexadecimal* numbers with base 16 digits.


    Unlike most programming languages, integers and floating-point numbers are interchangeable
    in Perl simply because the language doesn''t'
