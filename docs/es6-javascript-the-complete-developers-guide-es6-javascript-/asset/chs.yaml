  } else {\n  console.log('未找到书籍。');\n}\n```\n\n#### 输出：\n\n```\n找到书籍：1984，作者：乔治·奥威尔\n\
  ```\n\n## 第 6 节：`every`和`some`辅助函数\n\n### 一点`every`和大量`some`\n\n在本章中，我们将探讨`every`和`some`辅助方法，它们是处理数组的强大工具。这些方法允许我们对数组元素执行测试，并确定是否满足某些条件。让我们深入了解并学习如何在\
  \ JavaScript 代码中有效使用`every`和`some`。\n\n### `every`和`some`辅助函数简介\n\n\n\n\n\n## every\
  \ 和 some 辅助方法\n\n`every`和`some`辅助方法是 ES5 中引入的数组方法，并在 ES6 中得到了增强。这些方法提供了一种简洁且富有表现力的方式来对数组元素执行测试，并返回一个布尔值指示测试是否通过。\n\
  \n### `every` 辅助方法\n\n`every`辅助方法测试数组中的每个元素是否都满足提供的测试函数。如果所有元素都通过测试，则返回`true`；如果至少有一个元素未通过测试，则返回`false`。\n\
  \n`every`辅助方法的语法如下：\n\n`array.every(callback(element[, index[, array]])[, thisArg])`\n\
  \n回调函数会为数组中的每个元素调用，并接受三个可选参数：`element`、`index`和`array`。`thisArg`参数是一个可选值，用于在执行回调函数时作为`this`的值。\n\
  \n### `some` 辅助方法\n\n`some`辅助方法测试数组中是否至少有一个元素满足提供的测试函数。如果至少有一个元素通过测试，则返回`true`；如果所有元素都未通过测试，则返回`false`。\n\
  \n`some`辅助方法的语法与`every`类似：\n\n`array.some(callback(element[, index[, array]])[,\
  \ thisArg])`\n\n与`every`类似，回调函数会为数组中的每个元素调用，并且也接受三个可选参数：`element`、`index`和`array`。可以提供`thisArg`参数来设置回调函数内部的`this`值。\n\
  \n### 使用 `every` 辅助方法\n\n让我们先探索`every`辅助方法。假设我们有一个数字数组，想要检查数组中的所有数字是否都是正数。我们可以使用`every`辅助方法来执行此测试。\n\
  \n以下是一个示例：\n\n```javascript\nconst numbers = [1, 2, 3, 4, 5];\nconst allPositive\
  \ = numbers.every(number => number > 0);\nconsole.log(allPositive); // Output: true\n\
  ```\n\n在上面的代码中，我们在`numbers`数组上调用`every`方法。我们提供了一个回调函数，检查数组中的每个数字是否大于 0。如果所有数字都通过测试，`every`辅助方法返回`true`，表示所有元素都是正数。\n\
  \n### 使用 `some` 辅助方法\n\n现在，让我们探索`some`辅助方法。假设我们有一个成绩数组，想要检查是否至少有一个及格成绩（大于或等于 60）。我们可以使用`some`辅助方法来完成此任务。\n\
  \n以下是一个示例：\n\n```javascript\nconst grades = [80, 90, 45, 70, 55];\nconst hasPassingGrade\
  \ = grades.some(grade => grade >= 60);\nconsole.log(hasPassingGrade); // Output:\
  \ true\n```\n\n在上面的代码中，我们在`grades`数组上调用`some`方法。回调函数检查数组中的每个成绩是否大于或等于 60。如果至少有一个成绩通过测试，`some`辅助方法返回`true`，表示数组中存在及格成绩。\n\
  \n### 组合 `every` 和 `some`\n\n一个有趣的方面是，`every`和`some`辅助方法可以组合使用，以创建更复杂的测试。例如，假设我们有一个考试分数数组，想要确定每个分数要么是满分（100），要么是不及格分数（小于\
  \ 40）。\n\n以下是一个示例：\n\n```javascript\nconst examScores = [100, 95, 30, 100, 80];\n\
  const isEitherPerfectOrFailing = examScores.every(score => score === 100) || examScores.every(score\
  \ => score < 40);\nconsole.log(isEitherPerfectOrFailing); // Output: false\n```\n\
  \n在上面的代码中，我们使用了两次`every`，一次检查每个分数是否为 100，另一次检查每个分数是否小于 40。我们使用逻辑或（`||`）运算符组合两个`every`调用的结果。如果任一条件为真，则组合结果为真。\n\
  \n在本章中，我们探索了`every`和`some`辅助方法，它们是测试数组元素的强大工具。`every`辅助方法检查所有元素是否通过测试，而`some`辅助方法检查是否至少有一个元素通过测试。这些方法提供了简洁且富有表现力的方式来执行数组元素测试并返回布尔结果。\n\
  \n请记住关于`every`和`some`辅助方法的关键点：\n\n- `every`辅助方法在所有元素通过测试时返回`true`，否则返回`false`。\n\
  - `some`辅助方法在至少一个元素通过测试时返回`true`，否则返回`false`。\n- 两个辅助方法都接受一个回调函数，该函数测试数组中的每个元素。\n\
  - 回调函数可以接受三个可选参数：`element`、`index`和`array`。\n- `thisArg`参数允许你在回调函数中指定`this`的值。\n\
