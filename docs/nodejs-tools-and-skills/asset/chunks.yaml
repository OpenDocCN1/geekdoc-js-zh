    \ -> /home/sitepoint/.node_modules_global/lib/node_modules/uglify-js/bin/uglifyjs\n\
    + uglify-js@3.7.7\nadded 3 packages from 38 contributors in 0.259s\n```\n\n正如你从输出所示，安装了额外的包。这些是\
    \ UglifyJS 的依赖。\n\n# 列出全局包\n\n我们可以使用 `npm list` 命令列出已安装的全局包：\n\n```\n$ npm list\
    \ --global\nhome/sitepoint/.node_modules_global/lib\n├─┬ npm@6.9.0\n│ ├── abbrev@1.1.1\n\
    │ ├── ansicolors@0.3.2\n│ ├── ansistyles@0.1.3\n│ ├── aproba@2.0.0\n│ ├── archy@1.0.0\n\
    ....................\n└─┬ uglify-js@3.5.3\n  ├── commander@2.19.0\n  └── source-map@0.6.1\n\
    ```\n\n然而，输出非常冗长。我们可以通过 `--depth=0` 选项来改变这一点：\n\n```\n$ npm list -g --depth=0\n\
    /home/sitepoint/.node_modules_global/lib\n├── npm@6.13.7\n└── uglify-js@3.7.7\n\
    ```\n\n这样好多了；现在我们只看到自己安装的包以及它们版本号。\n\n任何全局安装的包都可以在命令行中使用。例如，这里展示了如何使用 Uglify 包将\
    \ `example.js` 压缩为 `example.min.js`：\n\n```\n$ uglifyjs example.js -o example.min.js\n\
    ```\n\n# 在本地模式下安装包\n\n当你本地安装包时，通常会使用 `package.json` 文件。让我们先创建一个：\n\n```\n$ mkdir\
    \ project && cd project\n\n$ npm init\npackage name: (project)\nversion: (1.0.0)\n\
    description: Demo of package.json\nentry point: (index.js)\ntest command:\ngit\
    \ repository:\nkeywords:\nauthor:\nlicense: (ISC)\n```\n\n``` `Return` 接受默认值，然后再次按下确认你的选择。这将在项目根目录下创建一个\
    \ `package.json` 文件：\n\n```json\n{\n  \"name\": \"project\",\n  \"version\": \"\
    1.0.0\",\n  \"description\": \"\",\n  \"main\": \"index.js\",\n  \"scripts\":\
    \ {\n    \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\"\n  },\n\
    \  \"author\": \"\",\n  \"license\": \"ISC\"\n}\n```\n\n## 更快的方法\n\n如果你想用更快的方法生成\
    \ `package.json` 文件，请使用 `npm init --y`。\n\n这些字段应该是自言易懂的，除了 `main` 和 `scripts`\
    \ 之外。`main` 字段是程序的主入口，而 `scripts` 字段允许你指定在包生命周期各个阶段运行的脚本命令。我们暂时可以保持现状，但如果你想了解更多，请查看\
    \ npm 上的 `package.json` 文档以及这篇关于使用 npm 作为构建工具的文章。\n\n现在让我们尝试安装 `underscore`：\n\
    \n```\n$ npm install underscore\nnpm notice created a lockfile as package-lock.json.\
    \ You should commit this file.\nnpm WARN project@1.0.0 No repository field.\n\
    + underscore@1.9.2\nadded 1 package and audited 1 package.\nfound 0 vulnerabilities\n\
    ```\n\n### 锁文件 (Lockfile)\n\n注意创建了一个锁文件。我们稍后会回到这里。\n\n现在，如果我们查看 `package.json`，会发现添加了\
    \ `dependencies` 字段：\n\n```json\n{\n  \"dependencies\": {\n    \"underscore\"\
    : \"¹.9.2\"\n  }\n}\n```\n\n# 使用 package.json 管理依赖\n\n如你所见，安装了 underscore v1.9.2。版本号前的脱字符符号（`^`）表示在安装时，npm\
    \ 将拉取它可以找到的包的最高版本，只需主版本号匹配（除非存在 `package-lock.json` 文件）。在我们的情况下，这将是任何低于 v2.0.0\
    \ 的版本。这种依赖版本方法（主版本.次版本.补丁）被称为语义化版本（semantic versioning）。你可以阅读更多关于它的信息。\n\n此外注意\
    \ underscore 被保存为 `dependencies` 字段的一个属性。这已成为 npm 最新版本的默认设置，并用于应用程序所需的包（如 underscore）。你也可以通过指定\
    \ `--save-dev` 标志来将包保存为 `devDependencies`。`devDependencies` 是用于开发目的的包——例如用于运行测试或编译代码。\n\
    \n### 发布与警告\n\n你还可以在 `package.json` 中添加 `private: true` 以防止意外发布私有包，并在运行 `npm install`\
    \ 时抑制任何警告。\n\n使用 `package.json` 指定项目依赖的最重要原因是可移植性。例如，当你克隆别人的代码时，你只需要在项目根目录下运行\
    \ `npm i`，npm 就会为你解析并获取运行所需的所有包。我们稍后会详细介绍这一点。\n\n现在让我们尝试运行一个测试文件：\n\n```javascript\n\
    const _ = require(\"underscore\");\nconsole.log(_.range(5));\n```\n\n你应该看到 `[0,\
    \ 1, 2, 3, 4]`。\n\n# 卸载本地包\n\nnpm 是一个包管理器，所以它能够卸载包。假设当前的包 某些某些问题。让我们看到 `[0, 1,\
    \ 2, 3, 4]`\n```\n$ npm uninstall underscore\nremoved 1 package in 386s\n\n$ npm\
    \ list\nproject@1.0.0 /home/sitepoint\n└── (empty)\n```\n\n# 安装特定版本的包\n\n现在我们可以安装指定版本的\
    \ underscore 包。通过在版本号后使用 `@` 符号来实现：\n\n```\n$ npm install underscore@1.9.1\n+\
    \ underscore@1.9.1\nadded 1 package in 574s\n\n$ npm list\nproject@1.0.0 /home/sitepoint\n\
    └── underscore@1.9.1\n```\n\n# 更新包\n\n让我们检查 underscore 包是否有更新：\n\n```\n$ npm outdated\n\
    Package     Current  Wanted  Location\nunderscore    1.9.1   1.9.2  project\n\
    ```\n\n`Current` 列显示本地安装的版本。`Latest` 列告诉我们最新版本。`Wanted` 列告诉我们我们在不破坏现有代码的情况下可以升级的版本。\n\
    \n还记得之前的 `package-lock.json` 文件吗？在 npm v5 中引入，该文件的目的是确保在所有安装项目的机器上依赖项完全一致。对于任何修改\
    \ `node_modules` 文件夹或 `package.json` 文件的操作，它都会自动生成。\n\n如果你喜欢可以尝试一下。删除 `node_modules`\
    \ 文件夹，然后重新运行 `npm i`（这是 `npm install` 的缩写）。npm 将重新安装 underscore v1.9.1，尽管我们刚刚看到\
    \ v1.9.2 可用。这是因为我们在 `package-lock.json` 文件中指定了版本 1.9.1。\n\n```json\n{\n  \"name\"\
    : \"project\",\n  \"version\": \"1.0.0\",\n  \"lockfileVersion\": 1,\n  \"requires\"\
    : true,\n  \"dependencies\": {\n    \"underscore\": {\n      \"version\": \"1.9.1\"\
    ,\n      \"resolved\": \"https://registry.npmjs.org/underscore/-/underscore-1.9.1.tgz\"\
    ,\n      \"integrity\": \"sha512-5/4etnCkd9c8gowi5/om/mYO5ajCaOgdzj/oW+0eQV9WxKBDZw5+ycmKmeaTXjInS/W0BGLo2xR2aBwZdg==\"\
    \n    }\n  }\n}\n```\n\n现在，假设 underscore 的最新版本修复了我们早期的错误，我们想将包更新到该版本：\n\n```\n\
    $ npm update underscore\n+ underscore@1.9.2\nupdated 1 package in 0.236s\n\n$\
    \ npm list\nproject@1.0.0 /home/sitepoint\n└── underscore@1.9.2\n```\n\n"
- fmt: "\nFor this to work, Underscore has to be listed as a dependency in `package.json`.\
    \ We can also execute `npm update` if we have many outdated modules we want to\
    \ update.\n\n## Searching for Packages\n\nWe’ve used the `mkdir` command a couple\
    \ of times in this tutorial. Is there a Node package that has this functionality?\
    \ Let’s use `npm search`:\n\n```\n$ npm search mkdir\nNAME                   \
    \   | DESCRIPTION          | AUTHOR          | DATE\nmkdir                   \
    \  | Directory creation…  | =joehewitt      | 2012-04-17\nfs-extra           \
    \       | fs-extra contains…   | =jprichardson…  | 2019-06-28\nmkdirp        \
    \            | Recursively mkdir,…  | =isaacs…        | 2020-01-24\nmake-dir \
    \                 | Make a directory…    | =sindresorhus   | 2019-04-01\n...\n\
    ```\n\nThere’s ([mkdirp](https://www.npmjs.com/package/mkdirp)). Let’s install\
    \ it:\n\n```\n$ npm install mkdirp\n+ mkdirp@1.0.3\nadded 1 package and audited\
    \ 2 packages in 0.384s\n```\n\nNow create a `mkdir.js` fie and copy–paste this\
    \ code:\n\n```\nconst mkdirp = require('mkdirp');\n\nconst made = mkdirp.sync('/tmp/foo/bar/baz');\n\
    console.log(`made directories, starting with ${made}`);\n```\n\nNext, run it from\
    \ the terminal:\n\n```\n$ node mkdir.js\nmade directories, starting with /tmp/foo\n\
    ```\n\n## Re-installing Project Dependencies\n\nLet’s first install one more package:\n\
    \n```\n$ npm install request\n+ request@2.88.0\nadded 48 packages from 59 contributors\
    \ and audited 65 packages in 2.73s\nfound 0 vulnerabilities\n```\n\nCheck the\
    \ `package.json`:\n\n```json\n\"dependencies\": {\n  \"mkdirp\": \"^1.0.3\",\n\
    \  \"request\": \"^2.88.0\",\n  \"underscore\": \"^1.9.2\"\n},\n```\n\nNote the\
    \ dependencies list got updated automatically. If you wanted to install a package\
    \ without saving it in `package.json`, just use the `--no-save` argument.\n\n\
    Let’s assume you’ve cloned your project source code to a another machine and we\
    \ want to install the dependencies. Let’s delete the `node_modules` folder first,\
    \ then execute `npm install`:\n\n```\n$ rm -R node_modules\n$ npm list --depth=0\n\
    project@1.0.0 /home/sitepoint/project\n├── UNMET DEPENDENCY mkdirp@1.0.3\n├─┬\
    \ UNMET DEPENDENCY request@2.88.0\n  ...\n└── UNMET DEPENDENCY underscore@1.9.2\n\
    \nnpm ERR! missing: mkdirp@1.0.3, required by project@1.0.0\nnpm ERR! missing:\
    \ request@2.88.0, required by project@1.0.0\nnpm ERR! missing: underscore@1.9.2,\
    \ required by project@1.0.0\n...\n\n$ npm install\nadded 50 packages from 60 contributors\
    \ and audited 65 packages in 1.051s\nfound 0 vulnerabilities\n```\n\nIf you look\
    \ at your `node_modules` folder, you’ll see that it gets recreated again. This\
    \ way, you can easily share your code with others without bloating your project\
    \ and source repositories with dependencies.\n\n## Managing the Cache\n\nWhen\
    \ npm installs a package, it keeps a copy, so the next time you want to install\
    \ that package, it doesn’t need to hit the network. The copies are cached in the\
    \ `.npm` directory in your home path:\n\n```\n$ ls ~/.npm\nanonymous-cli-metrics.json\
    \  _cacache  index-v5  _locks  _logs  node-sass\n```\n\nThis directory will get\
    \ cluttered with old packages over time, so it’s useful to clean it up occasionally:\n\
    \n```\n$ npm cache clean --force\n```\n\nYou can also purge all `node_module`\
    \ folders from your workspace if you have multiple node projects on your system\
    \ you want to clean up:\n\n```bash\nfind . -name \"node_modules\" -type d -exec\
    \ rm -rf '{}' +\n```\n\n## Audit\n\nHave you noticed all of those `found 0 vulnerabilities`\
    \ scattered throughout the CLI output? The reason for this is that a new feature\
    \ was introduced in npm that allows developers to scan the dependencies for known\
    \ security vulnerabilities.\n\nLet’s try out this feature by installing an old\
    \ version of `express`:\n\n```\n$ npm install express@4.8.0\n\nexpress@4.8.0\n\
    added 36 packages from 24 contributors and audited 123 packages in 2.224s\nfound\
    \ 21 vulnerabilities (8 low, 9 moderate, 4 high)\n  run `npm audit fix` to fix\
    \ them, or `npm audit` for details\n```\n\nAs soon as we finish installing, we\
    \ get a quick report that multiple vulnerabilities have been found. You can run\
    \ the command `npm audit` to view more details:\n\n```\n$ npm audit\n\n === npm\
    \ audit security report ===\n\n# Run  npm install express@4.17.1  to resolve 21\
    \ vulnerabilities\n┌───────────────┬──────────────────────────────────────────────────────────────┐\n\
    │ High          │ Regular Expression Denial of Service                       \
    \  │\n├───────────────┼──────────────────────────────────────────────────────────────┤\n\
    │ Package       │ negotiator                                                 \
    \  │\n├───────────────┼──────────────────────────────────────────────────────────────┤\n\
    │ Package       │ negotiator                                                 \
    \  │\n├───────────────┼──────────────────────────────────────────────────────────────┤\n\
    │ Dependency of │ express                                                    \
    \  │\n├───────────────┼──────────────────────────────────────────────────────────────┤\n\
    │ Path          │ express > negotiator                               │\n├───────────────┼──────────────────────────────────────────────────────────────┤\n\
    │ More info     │ https://nodesecity.io/advisories/106                       │\n\
    └───────────────┴────────────────────────────────────────┘\n\n┌───────────────┬──────────────────────────────────────────────────────────────┐\n\
    │ Moderate      │ Timing Attack                                              \
    \  \n├───────────────┼──────────────────────────────────────────────────────────────┤\n\
    │ Package       │ cookie-signature                                           \
    \  │\n├───────────────┼──────────────────────────────────────────────────────────────┤\n\
    │ Dependency of │ express                                                    \
    \  │\n├───────────────┼──────────────────────────────────────────────────────────────┤\n\
    │ Path          │ express > cookie-signature                               │\n\
    ├───────────────┼──────────────────────────────────────────────────────────────┤\n\
    │ More info     │ https://nodesecity.io/advisories/134                       │\n\
    └───────────────┴────────────────────────────────────────┘\n```\n\nYou’ll get\
    \ a detailed list of packages that have vulnerabilities. If you look at the `Path`\
    \ field, it shows the dependency path. For example, the Path `express > accepts`\
    \ means Express depends on the `Accepts` package. The `Accepts` package depends\
    \ on the `negotiator` package, which contains the vulnerability.\n\nThere are\
    \ two ways of fixing all these problems. We can either execute the command `npm\
    \ install express@4.17.1` as suggested, or run `npm audit fix`. Let’s do the latter:\n\
    \n```\n$ npm audit fix\n\n+ express@4.17.1\nadded 20 packages from 14 contributors,\
    \ removed 7 packages and updated 29 packages in 1.382s\nfixed 21 of 21 vulnerabilities\
    \ in 122 scanned packages\n```\n\nThe command `npm audit fix` automatically installs\
    \ any compatible updates to vulnerable dependencies. While this might seem like\
    \ magic, do note that vulnerabilities can’t always be fixed. This could happen\
    \ if you’re using a package that’s undergone a major change which could break\
    \ your current project if updated. For situations such as this, you’ll have to\
    \ review your code and manually apply the fix.\n\nYou can also run `npm audit\
    \ fix --force` if you don’t mind upgrading packages with breaking changes. After\
    \ you’ve executed the command, run `npm audit` to ensure that all vulnerabilities\
    \ have been resolved.\n\n## Aliases\n\nAs you may have noticed, there are multiple\
    \ ways of running npm commands. Here’s a brief list of some of the commonly used\
    \ npm aliases:\n\n*   `npm i <package>`: install local package\n*   `npm i -g\
    \ <package>`: install global package\n*   `npm un <package>`: uninstall local\
    \ package\n*   `npm up`: npm update packages\n*   `npm t`: run tests\n*   `npm\
    \ ls`: list installed modules\n*   `npm ll` or `npm la`: print additional package\
    \ information while listing modules\n\nYou can also install multiple packages\
    \ at once like this:\n\n```bash\n$ npm i express momemt lodash mongoose body-parser\
    \ webpack\n```\n"
