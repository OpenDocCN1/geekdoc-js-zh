    \ using:\n\n```\nnvm install --lts\n```\n\nThis will currently pull in version\
    \ `12.14.1`.\n\nYou can also uninstall any instance you no longer think is useful,\
    \ by running:\n\n```\nnvm uninstall 13.6.0\n```\n\n### Switching Between Versions\n\
    \nSo far, we’ve seen how to install different Node versions. Now let’s go through\
    \ how to switch between them. Let me first note that when a new version is installed,\
    \ it’s automatically put to use. So if you install the latest Node.js version,\
    \ and run `node -v` right after, you’ll see the latest version output.\n\nTo switch\
    \ through installed versions, nvm provides the `nvm use` command. This works similarly\
