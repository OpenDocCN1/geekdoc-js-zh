    \ rather verbose. We can change that with the `--depth=0` option:\n\n```\n$ npm\
    \ list -g --depth=0\n/home/sitepoint/.node_modules_global/lib\n├── npm@6.13.7\n\
    └── uglify-js@3.7.7\n```\n\nThat’s better; now we see just the packages we’ve\
    \ installed along with their version numbers.\n\nAny packages installed globally\
    \ will become available from the command line. For example, here’s how you would\
    \ use the Uglify package to minify `example.js` into `example.min.js`:\n\n```\n\
    $ uglifyjs example.js -o example.min.js\n```\n\n# Installing Packages in Local\
    \ Mode\n\nWhen you install packages locally, you normally do so using a `package.json`\
    \ file. Let’s go ahead and create one:\n\n```\n$ mkdir project && cd project\n\
    \n$ npm init\npackage name: (project)\nversion: (1.0.0)\ndescription: Demo of\
    \ package.json\nentry point: (index.js)\ntest command:\ngit repository:\nkeywords:\n\
    author:\nlicense: (ISC)\n```\n\nPress `Return` to accept the defaults, then press\
    \ it again to confirm your choices. This will create a `package.json` file at\
    \ the root of the project:\n\n```json\n{\n  \"name\": \"project\",\n  \"version\"\
    : \"1.0.0\",\n  \"description\": \"\",\n  \"main\": \"index.js\",\n  \"scripts\"\
    : {\n    \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\"\n  },\n\
    \  \"author\": \"\",\n  \"license\": \"ISC\"\n}\n```\n\n## A Quicker Way\n\nIf\
    \ you want a quicker way to generate a `package.json` file, use `npm init --y`.\n\
    \nThe fields are hopefully pretty self-explanatory, with the exception of `main`\
    \ and `scripts`. The `main` field is the primary entry point to your program,\
    \ and the `scripts` field lets you specify script commands that are run at various\
    \ times in the life cycle of your package. We can leave these as they are for\
    \ now but if you’d like to find out more, see the `package.json` documentation\
    \ on npm and this article on using npm as a build tool.\n\nNow let’s try and install\
    \ `underscore`:\n\n```\n$ npm install underscore\nnpm notice created a lockfile\
    \ as package-lock.json. You should commit this file.\nnpm WARN project@1.0.0 No\
    \ repository field.\n+ underscore@1.9.2\nadded 1 package and audited 1 package.\n\
    found 0 vulnerabilities\n```\n\n### Lockfile\n\nNote that a lockfile is created.\
    \ We’ll be back to this later.\n\nNow if we have a look in `package.json`, we’ll\
    \ see that a `dependencies` field has been added:\n\n```json\n{\n  \"dependencies\"\
    : {\n    \"underscore\": \"^1.9.2\"\n  }\n}\n```\n\n# Managing Dependencies with\
    \ package.json\n\nAs you can see, underscore v1.9.2 was installed. The caret (`^`)\
    \ at the front of the version number indicates that when installing, npm will\
    \ pull in the highest version of the package it can find where only the major\
    \ version has to match (unless a `package-lock.json` file is present). In our\
    \ case, that would be anything below v2.0.0. This method of versioning dependencies\
    \ (major.minor.patch) is known as semantic versioning. You can read more about\
    \ it.\n\nAlso notice that underscore was saved as a property of the `dependencies`\
    \ field. This has become the default in the latest version of npm and is used\
    \ for packages (like underscore) required for the application. It would also be\
    \ possible to save a package as a `devDependencies` by specifying the `--save-dev`\
    \ flag. `devDependencies` are packages used for development purposes—for example,\
    \ for running tests or transpiling code.\n\n### Publication and Warnings\n\nYou\
    \ can also add `private: true` to `package.json` to prevent accidental publication\
    \ of private, as well as suppressing any warnings when running `npm install`.\n\
    \nFar and away the biggest reason for using `package.json` to specify a project’s\
    \ dependencies is portability. For example, when you clone someone else’s code,\
    \ all you have to do is run `npm i` in the project root and npm will resolve and\
    \ fetch all of the necessary packages for you to run. We’ll look at this in more\
    \ detail later.\n\nBefore finishing this section, let’s quickly check that underscore\
    \ is working. Create a file called `test.js` in the project root and add the following:\n\
