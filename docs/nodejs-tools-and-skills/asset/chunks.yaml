    \ to make server-rendered apps painless. To this end, it includes the [Edge template\
    \ engine](https://edge.adonisjs.com/).\n\n### Edge templates\n\nThe view templates\
    \ are files with an `.edge` extension, and can contain a mixture of HTML (including\
    \ JS and CSS) and Edge’s own template tags.\n\nThe syntax is very similar to that\
    \ used by Laravel’s Blade. Data is output via double curly braces (for example,\
    \ `{{ my_variable }}`). Tags, which are used for things like conditional rendering\
    \ and iteration, begin with an `@` symbol.\n\nA typical template might look something\
    \ like this:\n\n**resources/views/list.edge:**\n\n```\n@layout('main')\n\n@section('content')\n\
    <div>\n  <ul>\n  @each(item in list)\n  <li>\n      <a href=\"{{ item.url }}\"\
    >{{ item.text }}</a>\n    </li>\n  @endeach\n  </ul>\n</div>\n@endsection\n```\n\
    \nHere there are several Edge tags being used:\n\n*   `@layout`: specifies that\
    \ the current template will be rendered into the named layout (for example, “main”)\n\
    \n*   `@section` and `@endsection`: specifies that the contents of this block\
    \ will be inserted into the named section of the layout (for example, “content”)\n\
    \n*   `@each` and `@endeach`: specifies that the block should be repeated for\
    \ each item in a collection\n\nPartials are also supported, so you can extract\
    \ common pieces of markup to their own files and include them wherever they’re\
    \ needed using the `@include` tag.\n\nLike Blade, Edge also provides a “component”\
    \ syntax, which allows you to treat partials as if they were web components, with\
    \ their own isolated variable scope:\n\n```\n@component('edit-post-modal', { title:\
    \ 'Add a new post' })\n  <form>\n    ...\n  </form>\n@endcomponent\n```\n\nIn\
    \ the above example, the form markup would be rendered inside a modal template,\
    \ which has access to any data passed in (such as the title) but not variables\
    \ from the parent template.\n\n### Global functions\n\n[Globals](https://adonisjs.com/docs/4.1/views#_globals)\
    \ are helper functions you can access from within your Edge templates. You can\
    \ define your own, but Adonis ships with a bunch of predefined ones—both framework\
    \ specific (such as route url generator) and general helpers (such as a camel\
    \ case convertor).\n\nTo use them, you just call them from within curly braces.\n\
    \n**Generating a route URL:**\n\n```\n<a href=\"{{ route('post', { id: 1 }) }}\"\
    >\n  View post\n</a>\n```\n\n**Generating the path to a file in the `public` folder:**\n\
    \n```\n<img src=\"{{ assetsUrl('images/logo.png') }}\" />\n```\n\nBoth Blade and\
    \ Edge also allow you to define custom template tags to help make your views cleaner\
    \ and more readable.\n\n## Advanced\n\nThere are two more advanced topics I wanted\
    \ to touch on before wrapping up: the way Adonis handles dependency injection\
    \ (DI), and authentication.\n\n### IoC Container\n\nLaravel has a sophisticated\
    \ DI system, allowing you to inject dependencies into your controllers and other\
    \ classes by type-hinting them in the constructor.\n\nAdonis also has an [Inversion\
    \ of Control (IoC) container](https://adonisjs.com/docs/4.1/ioc-container) that\
    \ can be set up to resolve your project’s dependencies, while allowing them to\
    \ be easily swapped out for fakes/mocks during testing.\n\nGetting the dependencies\
    \ into your code is a little different that in Laravel. You have to fetch them\
    \ from the container with the globally available `use()` helper:\n\n```\nconst\
    \ redis = use('My/Redis')\n```\n\nIt’s worth mentioning that the next version\
    \ of Adonis (v5 at the time of writing) plans to replace this with ESM imports:\n\
    \n```\nimport Route from  '@ioc:Adonis/Core/Route'\n```\n\n### Authentication\n\
    \nWhen it comes to authentication, Laravel makes it very easy to implement. It\
    \ comes with a session-based auth system out of the box, and JWT and OAuth2 systems\
    \ are available via downloadable packages.\n\n[Adonis aims to cover all the bases\
    \ here](https://adonisjs.com/docs/4.1/authentication), shipping with authentication\
    \ schemes for session, basic auth, JWT, and personal API tokens.\n\nThe framework\
    \ also provides middleware for authenticating routes and helpers for retrieving\
    \ the currently logged-in user that will be familiar to Laravel developers. Unlike\
    \ Laravel, however, there’s no command to scaffold out the views and controllers\
    \ to quickly get a working auth system.\n\n## Adonis Pros\n\n*   closely follows\
    \ Laravel in terms of features and API design\n\n*   takes a more batteries-included\
    \ approach than frameworks like Express\n\n*   documentation has plenty of examples\n\
    \n## Adonis Cons\n\n*   some Laravel features are noticeable by their absence,\
    \ such as job queues\n\n*   the documentation is a little sparse in places, and\
    \ sometimes relies on videos in place of written guides\n\n## Verdict\n\nOverall,\
    \ the Adonis team has done a great job at creating a Node.js framework that’s\
    \ as easy to use and (almost) as fully featured as Laravel.\n\nThose getting started\
    \ with Node development will find everything they need to start building applications\
    \ out of the box, with enough documentation to get up and running quickly.\n\n\
    Laravel developers transitioning from PHP (or dipping their toes in Node) will\
    \ feel especially at home, and should find enough similarity between the two frameworks\
    \ to be productive fairly quickly.\n\nUnless you have some experience of Node.js\
    \ development and want to build up a specific back-end stack from your favorite\
    \ packages, it’s hard not to recommend Adonis.\n\n# Chapter 5: Top 5 Developer-friendly\
    \ Node.js API Frameworks\n\n### by Michael Wanyoike"
