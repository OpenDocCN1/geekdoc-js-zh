    \  console.log(rows);\n});\n```\n\n保存更改并运行文件。一旦执行，你应该能够查看从数据库返回的数据：\n\n```javascript\n\
    [ [ RowDataPacket { id: 1, name: 'Michaela Lehr', city: 'Berlin' },\n    RowDataPacket\
