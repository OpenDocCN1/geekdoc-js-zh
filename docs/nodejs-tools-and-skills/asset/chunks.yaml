    \ switch into the newly created folder and install the dependencies:\n\n```bash\n\
    cd signup-form\nnpm i\n```\n\nAt this point, you may notice several warnings about\
    \ package vulnerabilities. Let’s update the version of Handlebars.js to fix those:\n\
    \n```bash\nnpm install hbs@4.1.0\n```\n\nNow that the project dependencies are\
    \ installed and updated, let’s customize some of the boilerplate view templates.\n\
    \nThe generator creates a layout template which is used to render all the markup\
