    \ framework in the Node.js ecosystem, and you can use it to build a REST API with\
    \ the least effort of all frameworks listed. Strapi is based on [Koa](https://koajs.com/),\
    \ a web framework designed by the team behind Express. Koa is described as a more\
    \ modern, modular and light-weight version of the Express framework. Earlier benchmarks\
    \ I showed indicate that Koa has significantly better performance than Express.\n\
    \nWith Strapi, you’re presented with a well-designed web user interface that allows\
    \ you to:\n\n*   connect to any database\n*   set up as many collections (tables)\
    \ and complex relations as you like\n*   define field validation rules\n*   set\
    \ up different types of authentication methods (email, GitHub, Facebook etc.)\n\
    *   implement role-based access control\n\nAll this is done without hand coding\
    \ anything. Strapi is mostly known as an open-source, headless CMS, and is built\
    \ to favor non-technical users who are most likely going to be your project’s\
    \ end users.\n\nThe primary advantage of Strapi is that end users can alter their\
    \ API without involving developers. They also get an admin dashboard at an early\
    \ stage in the project to upload and modify back-end data. This saves developers\
    \ from creating the back-end user interface in the first place. If there’s a specific\
    \ function that Strapi can’t provide, it can normally be easily implemented via\
    \ plugins found in their [marketplace](https://strapi.io/marketplace). In addition,\
    \ you may find that other front-end frameworks have support for Strapi through\
    \ their own plugins. For example, you can use [gatsby-source-plugin](https://www.npmjs.com/package/gatsby-source-strapi)\
    \ to connect Gatsby to a Strapi back end.\n\nAt the time of writing, Strapi is\
    \ currently in beta. Depending on your internet speed and machine specs, the installation\
    \ process can take upwards of ten minutes. My recommendation is to install and\
    \ use [Yarn](https://yarnpkg.com/lang/en/), since it’s a bit faster. Hopefully,\
    \ future versions will take a shorter time to set up. To start using Strapi right\
    \ away, just execute the following commands:\n\n```bash\n# create a new strapi\
    \ project based on quickstart template\nyarn create strapi-project quickstart\n\
    \n# Start Strapi server\nyarn dev\n```\n"
  raw: "```\n# Make sure Mongo is running\nsudo service mongod start\n\n# Start your\
    \ Keystone project\ncd my-app\nnpm run dev\n\nℹ Command: keystone dev\n✔ Validated\
    \ project entry file ./index.js\n✔ Keystone server listening on port 3000\n✔ Initialised\
    \ Keystone instance\n✔ Connected to database\n✔ Keystone instance is ready at\
    \ http://localhost:3000 \U0001F680\n\U0001F517 Keystone Admin UI:  http://localhost:3000/admin\n\
    \U0001F517 GraphQL Playground: http://localhost:3000/admin/graphiql\n\U0001F517\
    \ GraphQL API:    http://localhost:3000/admin/api \n```\n\nNext, you can visit\
    \ `http://localhost:3000/admin`, where you can use the UI to create new `Todos`.\
    \ You can also go to the GraphQL API, `http://localhost:3000/admin/api`, and perform\
    \ some queries. For example, to list all `todos`, you can use this query:\n\n\
    ```\nquery {\n  allTodos {\n    id\n    name\n  }\n}\n```\n\nWhen you press the\
    \ play button, it should display the results:\n\n```\n{\n  \"data\": {\n    \"\
    allTodos\": [\n      {\n        \"id\": \"5e257020db53a03f48782463\",\n      \
    \  \"name\": \"Write Articles\"\n      },\n      {\n        \"id\": \"5e257033db53a03f48782464\"\
    ,\n        \"name\": \"Eat lunch\"\n      }\n    ]\n  }\n}\n```\n\nThe main advantage\
    \ of GraphQL over REST is that you can easily extract any data you need without\
    \ defining a new API route. In a REST API, if you wanted to access records that\
    \ were linked to other records via a relationship key, the back-end developer\
    \ would need to create a new API endpoint that can handle the join operation.\
    \ With GraphQL, such queries are defined on the front-end app. This frees up the\
    \ back-end developer from having to add more API endpoints, which may become harder\
    \ to maintain over time.\n\nIf you’re new to GraphQL, you should check out our\
    \ [tutorials](https://www.sitepoint.com/tag/graphql/). To quickly confirm that\
    \ your `todos` have been saved into your Mongo database, just execute the following:\n\
    \n```\n# Open mongo client shell\nmongo\n\n# List all databases\nshow databases\n\
    \n# Switch to database\nuse keystone-app\n\n# Display todos\ndb.todos.find()\n\
    \n{ \"_id\" : ObjectId(\"5e257020db53a03f48782463\"), \"name\" : \"Write Articles\"\
    , \"__v\" : 0 }\n{ \"_id\" : ObjectId(\"5e257033db53a03f48782464\"), \"name\"\
    \ : \"Eat lunch\", \"__v\" : 0 }\n```\n\n### Keystone Links\n\n*   [Home page](http://keystonejs.com/)\n\
    \n*   [Documentation](https://www.keystonejs.com/quick-start/)\n\n*   [GitHub](https://github.com/keystonejs/keystone)\n\
    \n*   [npm](https://www.npmjs.com/package/keystone)\n\n## 5\\. Strapi\n\n![strapi](Images/strapi.png)\n\
    \nStrapi is by far the most powerful framework in the Node.js ecosystem, and you\
    \ can use it to build a REST API with the least effort of all frameworks listed.\
    \ Strapi is based on [Koa](https://koajs.com/), a web framework designed by the\
    \ team behind Express. Koa is described as a more modern, modular and light-weight\
    \ version of the Express framework. Earlier benchmarks I showed indicate that\
    \ Koa has significantly better performance than Express.\n\nWith Strapi, you’re\
    \ presented with a well-designed web user interface that allows you to:\n\n* \
    \  connect to any database\n\n*   set up as many collections (tables) and complex\
    \ relations as you like\n\n*   define field validation rules\n\n*   set up different\
    \ types of authentication methods (email, GitHub, Facebook etc.)\n\n*   implement\
    \ role-based access control\n\nAll this is done without hand coding anything.\
    \ Strapi is mostly known as an open-source, headless CMS, and is built to favor\
    \ non-technical users who are most likely going to be your project’s end users.\n\
    \nThe primary advantage of Strapi is that end users can alter their API without\
    \ involving developers. They also get an admin dashboard at an early stage in\
    \ the project to upload and modify back-end data. This saves developers from creating\
    \ the back-end user interface in the first place. If there’s a specific function\
    \ that Strapi can’t provide, it can normally be easily implemented via plugins\
    \ found in their [marketplace](https://strapi.io/marketplace). In addition, you\
    \ may find that other front-end frameworks have support for Strapi through their\
    \ own plugins. For example, you can use [gatsby-source-plugin](https://www.npmjs.com/package/gatsby-source-strapi)\
    \ to connect Gatsby to a Strapi back end.\n\nAt the time of writing, Strapi is\
    \ currently in beta. Depending on your internet speed and machine specs, the installation\
    \ process can take upwards of ten minutes. My recommendation is to install and\
    \ use [Yarn](https://yarnpkg.com/lang/en/), since it’s a bit faster. Hopefully,\
    \ future versions will take a shorter time to set up. To start using Strapi right\
    \ away, just execute the following commands:\n\n```\n# create a new strapi project\
    \ based on quickstart template\nyarn create strapi-app strapi-project --quickstart\n\
    \n# Start strapi server\nyarn develop\n\nyarn run v1.21.1\n\nProject information\n\
    \n┌────────────────────┬──────────────────────────────────────────────────┐\n\
    │ Time               │ Mon Jan 20 2020 17:10:48 GMT+0300 (East Africa … │\n│ Launched\
    \ in        │ 7866 ms                                          │\n│ Environment\
    \        │ development                                      │\n│ Process PID \
    \       │ 25635                                            │\n│ Version      \
    \      │ 3.0.0-beta.18.4 (node v12.13.0)                  │\n└────────────────────┴──────────────────────────────────────────────────┘\n\
    \nActions available\n\nWelcome back!\nTo manage your project \U0001F680, go to\
    \ the administration panel at:\nhttp://localhost:1337/admin\n\nTo access the server\
    \ ⚡️, go to:\nhttp://localhost:1337\n```\n\nOnce the Strapi server has initialized,\
    \ you can visit `http://localhost:1337/admin` to access the admin dashboard. First,\
    \ you’ll need to create an admin account. Then you’ll be able to log in and start\
    \ creating models. Once you save all the changes, Strapi should restart automatically\
    \ in order to write code to its project folder. Next, click on your newly created\
    \ **Content Type** to start inputting data. Finally, click on **Roles & Permissions**\
    \ to set an appropriate access level for unauthenticated users. You can now use\
    \ Postman or Insomnia to interact with your API, or consume it from a front-end\
    \ app.\n\nStrapi has been making great progress of late. The maintainers managed\
    \ to [raise $4 million](https://strapi.io/blog/top-10-questions-to-strapi-ceo)\
    \ in seed funding that’s being used to scale the team, ready the product for stable\
    \ release and implement the most requested features proposed by its community.\
    \ This means that it is safe for companies to invest time using the product to\
    \ build their content management systems.\n\n### Strapi Links\n\n*   [Home page](https://strapi.io/)\n\
    \n*   [Documentation](https://strapi.io/documentation/3.0.0-beta.x/getting-started/introduction.html#strapi-documentation)\n\
    \n*   [GitHub](https://github.com/strapi/strapi)\n\n*   [npm](https://www.npmjs.com/package/strapi)\n\
    \n*   [Slack](http://slack.strapi.io/)\n\n## Summary\n\nAnd there you have it.\
    \ These are my top five developer-friendly Node.js frameworks that you can use\
    \ to build your API in 2020.\n\nSo which should you use? Well, if you’re a beginner,\
    \ it’s best to start with Express or Fastify. If you’re already comfortable with\
    \ Express, you should dive into Feathers, as it can help you avoid writing repetitive\
    \ code by scaffolding your API project using command-line tools. If GraphQL is\
    \ important to you, KeystoneJS will help you set up an API effortlessly (although\
    \ all frameworks I’ve mentioned here are capable of providing a GraphQL interface\
    \ via extensions). My favorite platform for building an API is Strapi, as it provides\
    \ a friendly user interface to define your API structure and manage data. I also\
    \ like the fact that user authentication and access control is built in, meaning\
    \ I don’t have to code anything.\n\nI hope this guide will help you make an informed\
    \ choice on which framework to use for your next project.\n\n# Chapter 6: Using\
    \ MySQL with Node.js and the mysql JavaScript Client\n\n### by James Hibbard and\
    \ Jay Raj"
