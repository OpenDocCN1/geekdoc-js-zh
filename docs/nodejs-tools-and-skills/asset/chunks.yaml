    \ 工具与技能，第 2 版\n\nCopyright © 2020 SitePoint Pty. Ltd.\n\n电子书 ISBN: 978-1-925836-39-4\n\
    \n* **产品经理：** Simon Mackie\n* **项目编辑：** James Hibbard\n* **英语编辑：** Ralph Mason\n\
    * **封面设计：** Alex Walker\n\n## 权利声明\n\n本书保留所有权利。未经出版者事先书面许可，不得以任何形式或通过任何手段复制、存储在检索系统中或传输本书的任何部分，但评论性文章或评论中的短幅引用除外。\n\
    \n## 免责声明\n\n作者和出版商已尽一切努力确保书中信息的准确性。然而，本书包含的信息按现状销售，不提供任何明示或暗示的保证。作者、SitePoint\
    \ Pty. Ltd. 及其经销商或分销商对于因使用书中的说明或书中此处描述的软件或硬件产品而直接或间接造成的任何损害均不承担责任。\n\n## 商标声明\n\
    \n本书并未将每个商标名称都标记出来，而是以编辑的方式使用这些名称，为了商标所有者的利益，无侵犯商标的意图。\n\n![SitePoint logo](img/sitepoint-logo-2012.png)\n\
    \nSitePoint Pty. Ltd. 出版\nLevel 1, 110 Johnston St, Fitzroy\nVIC Australia 3065\n\
    网址: www.sitepoint.com\n邮箱: books@sitepoint.com\n\n## 关于 SitePoint\n\nSitePoint\
    \ 专门为网络专业人士出版有趣、实用且易于理解的内容。访问 [`www.sitepoint.com/`](http://www.sitepoint.com/)\
    \ 获取我们的博客、书籍、时通讯、文章和社区论坛。你可以在那里找到关于 JavaScript、PHP、设计等大量信息。\n\n## 关于 Craig Buckler\n\
    \n[Craig](https://craigbuckler.com/) 是一位自由开发者、作者和演讲师，他对 Web 的话题永无止。\n\n他从 20 世纪\
    \ 80 年代开始编程，那时应用程序必须挤进几 KB 的内存中。他对 Web 的热情燃于 20 世纪 90 年代中期，那时 28K 调制解调器是常见配置，100KB\
    \ 的页面被认为是奢侈品。\n\n在过去的十年里，随着 Web 标准的演进，Craig 为 SitePoint 编写了 1200 篇教程。尽管在一个技术奇妙的未来生活中，但他从未忘记用有限的资源可以成就什么。\n\
    \n# 前言\n\n尽管已有许多尝试让 JavaScript 作为一种服务端语言运行，但 Node.js（通常简称为 Node）是第一个获得任何关注的环境。它现在被\
    \ Netflix、Uber 和 Paypal 等公司用于支持它们的 Web 应用程序。Node 允许极快的性能；得益于它的事件循环模型，网络连接和数据库\
    \ I/O 等常见任务执行得确实非常快。\n\n在书中，我们将查看一些相关的工具和技能，它们将让你成为一个更高效的 Node 开发者。\n\n## 谁应该读这本书？\n\
    \n本书适用于任何想要开始学习 Node.js 服务端开发的人。我们假设读者熟悉 JavaScript，但我们并不假设他们有任何先前的后端开发经验。\n\n\
    ## 使用的规范\n\n### 代码示例\n\n书中的代码使用等宽字体显示，如下：\n\n```\n <h1>一个完美的夏日</h1>\n<p>这是一个在公园散步的好日子。\n\
    \ 鸟儿在歌唱，孩子们都回学校上课了。</p> \n```\n\n当上下文中需要现有代码而不是重复所有代码时，将显示 `⋮`：\n\n```\n function\
    \ animate() {\n    ⋮\nnew_variable = \"Hello\";\n}\n```\n\n某些代码行应该在一行内输入，但由于页面限制，我们不得不对其进行了折行。`➥`\
    \ 表示仅出于格式目的而存在的换行，应该被忽略：\n\n```\n URL.open(\"http://www.sitepoint.com/responsive-web-\n\
    ➥design-real-user-testing/?responsive1\");\n```\n\n你会注意到，我们在整本书中使用某些布局样式来表示不同类型的信息。请关注以下项目。\n\
    \n#### 提示、备注与警告\n\n#### 嘿，你！\n\n提示（Tips）提供有用的小贴士。\n\n#### 额咳，打扰一下……\n\n备注（Notes）是与当前主题相关但并非至关重要的补充说明。将它们视为额外的额外小知识即可。\n\
    \n#### 确保你总是……\n\n……注意这些重要要点。\n\n#### 注意！\n\n警告（Warnings）突出了在过程中可能会让你绊脚的坑。\n\n\
    ## 补充材料\n\n* [`www.sitepoint.com/community/`](https://www.sitepoint.com/community/)\
    \ 是 SitePoint 的论坛，用于解决任何棘手问题提供帮助。\n* **books@sitepoint.com** 是我们的邮箱地址，如果你需要联系我们报告问题或其他出于其他原因，请使用。\n\
    \n# 第 1 章：使用 nvm 安装多个版本的 Node.js\n\n### 由 Michael Wanyoike 和 James Hibbard 编写\n\
    \n在使用 Node.js 时，你可能会遇到需要安装多个运行时版本的情况。\n\n例如，也许你的机器上已经安装了最新版本的 Node，但你准备开始的项目需要较旧的版本。\n\
    \n如果没有好工具，这意味着要花费大量手动卸载和重新安装 Node 版本。幸运的是，有一种更好的方法！\n\n## 介绍 nvm\n\n[nvm](https://github.com/creationix/nvm)\
    \ 代表 Node 版本管理器（Node Version Manager）。顾如名，它可以帮助你通过单一命令在不同的 Node 版本之间切换。\n\n##\
    \ 操作系统支持\n\nnvm 支持 Linux 和 macOS，但并不意味着 Windows 用户必须错失。有一个名为 [nvm-windows](https://github.com/coreybutler/nvm-windows)\
    \ 的项目，为 Windows 用户提供了轻松管理环境的选择。尽管名称相同，nvm-windows 不是 nvm 的克隆，与之无关。然而，下面列出的基本命令（用于安装、列出和切换版本）对\
    \ nvm 和 nvm-windows 都有效。\n\n## 安装\n\n让我们首先涵盖 Windows、macOS 和 Linux 的安装。\n\n###\
    \ Windows\n\n首先，我们需要做一些准备：\n\n* 卸载任何现有的 Node.js 版本\n* 删除任何现有的 Node.js 安装目录（例如\
    \ `C:\\Program Files\\nodejs`）\n* 删除现 npm 安装位置（例如 `C:\\Users\\<user>\\AppData\\\
    npm`）\n\n之后，下载并运行[最新稳定安装程序](https://github.com/coreybutler/nvm-windows/releases)，就可以了！\n\
    \n### macOS/Linux\n\n与 Windows 不同，在 macOS 和 Linux 中删除之前的 Node 和 npm 安装是可选的。如果你想这样做，网上有很多很好的资源。例如，这里介绍了如何在\
    \ [macOS](http://stackoverflow.com/q/11177954/113687) 上移除 Node 以及如何在 [Linux](http://stackoverflow.com/q/5650169/113687)\
    \ 上移除。这里介绍了如何移除你可能拥[之前的 npm 安装](https://docs.npmjs.com/misc/removing-npm)。\n\n\
    你可以使用 cURL 或 Wget 安装 nvm。在你的终端中运行以下命令：\n\n使用 [cURL](https://curl.haxx.se/)：\n\n\
    ```bash\ncurl -o- https://raw.github.com/creationix/nvm/v0.35.2/install.sh | bash\n\
