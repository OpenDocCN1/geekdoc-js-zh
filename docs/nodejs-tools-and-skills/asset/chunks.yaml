    \ records:\n\n```javascript// Return all records\nconst posts = Post.all();\n\n\
    // Find by ID\nconst post = Post.find(1);\n```\n\n## Using the query builder with\
    \ models:\n\n```\nconst adults = await User\n  .query()\n  .where('age', '>',\
    \ 18)\n  .fetch();\n```\n\n### Migrations\n\nAnother core part of Laravel’s database-related\
    \ functionality is the migrations system. If you’re not familiar with it, a `migration`\
    \ is a set of schema changes, defined in code. A migration can then be run against\
    \ your application’s database in different environments (such as development,\
    \ staging, and production) ensuring that all copies of the database are updated\
    \ when your code is deployed.\n\nAdonis’ way of doing things will be familiar\
    \ to a Laravel developer. [Migrations](https://adonisjs.com/docs/4.1/migrations)\
    \ are created via the CLI:\n\n```bash\nadonis make:migration posts\n# ✔ create\
    \  database/migrations/1502691651527_posts_schema.js\n```\n\nThey’re run from\
    \ there too:\n\n```bash\nadonis migration:run\n# migrate: 1502691651527_posts_schema.js\n\
    # Database migrated successfully in 117 ms\n```\n\nAs well as running migrations,\
    \ there are commands to roll back the last set, or completely roll back and reapply\
    \ all migrations from scratch, [among others](https://adonisjs.com/docs/4.1/migrations#_migration_commands).\n\
    \nLet’s take a look at how a migration is defined:\n\n```javascript\n// database/migrations/1502691651527_posts_schema.js\n\
    \n'use strict'\n\nconst Schema = use('Schema')\n\nclass PostsSchema extends Schema\
    \ {\n  up () {\n    this.create('users', (table) => {\n      table.increments()\n\
    \      table.string('title').notNullable().unique()\n      table.text('content').notNullable()\n\
    \      table.integer('comment_count').notNullable()\n      table.timestamps()\n\
    \    })\n  }\n\n  down () {\n    this.drop('posts')\n  }\n}\n\nmodule.exports\
    \ = PostsSchema\n```\n\nEach migration has both an `up()` and `down()` method,\
    \ run on migrate and rollback respectively. Within the `up()` method, changes\
    \ to the table schema are declared with chainable method calls to define/alter\
    \ the columns.\n\n## Views\n\nIn addition to creating REST APIs, Adonis also aims\
    \ to make server-rendered apps painless. To this end, it includes the [Edge template\
    \ engine](https://edge.adonisjs.com/).\n\n### Edge templates\n\nThe templates\
    \ are files with `.edge` extension, and can contain a mixture of HTML, CSS and\
