    \n## 5. Strapi\n\n![strapi](Images/strapi.png)\n\nStrapi is by far the most powerful\
    \ framework in the Node.js ecosystem, and you can use it to build a REST API with\
    \ the least effort of all frameworks listed. Strapi is based on [Koa](https://koajs.com/),\
    \ a web framework designed by the team behind Express. Koa is described as a more\
    \ modern, modular and light-weight version of the Express framework. Earlier benchmarks\
    \ I showed indicate that Koa has significantly better performance than Express.\n\
    \nWith Strapi, you’re presented with a well-designed web user interface that allows\
    \ you to:\n\n*   connect to any database\n*   set up as many collections (tables)\
    \ and complex relations as you like\n*   define field validation rules\n*   set\
    \ up different types of authentication methods (email, GitHub, Facebook etc.)\n\
    *   implement role-based access control\n\nAll this is done without hand coding\
    \ anything. Strapi is mostly known as an open-source, headless CMS, and is built\
    \ to favor non-technical users who are most likely going to be your project’s\
    \ end users.\n\nThe primary advantage of Strapi is that end users can alter their\
    \ API without involving developers. They also get an admin dashboard at an early\
    \ stage in the project to upload and modify back-end data. This saves developers\
    \ from creating the back-end user interface in the first place. If there’s a specific\
    \ function that Strapi can’t provide, it can normally be easily implemented via\
    \ plugins found in their [marketplace](https://strapi.io/marketplace). In addition,\
    \ you may find that other front-end frameworks have support for Strapi through\
    \ their own plugins. For example, you can use [gatsby-source-plugin](https://www.npmjs.com/package/gatsby-source-strapi)\
    \ to connect Gatsby to a Strapi back end.\n\nAt the time of writing, Strapi is\
    \ currently in beta. Depending on your internet speed and machine specs, the installation\
    \ process can take upwards of ten minutes. My recommendation is to install and\
    \ use [Yarn](https://yarnpkg.com/lang/en/), since it’s a bit faster. Hopefully,\
    \ future versions will take a shorter time to set up. To start using Strapi right\
    \ away, just execute the following commands:\n\n```bash\n# create a new strapi\
    \ project based on quickstart template\nyarn create strapi-project quickstart\n\
    \n# Start Strapi server\nyarn dev\n```\n[/content] (Wait, I will just provide\
