    Node.js 允许你在服务器上使用 JavaScript 编写应用程序。基于 [V8 JavaScript 运行时](https://v8.dev/) 并用
    C++ 编写——因此速度很快。最初，它被设计为应用程序的服务器环境，但开发者开始使用它来创建工具，协助本地任务自动化。从那时起，全新的基于 Node 的工具生态系统（例如
    [Grunt](http://gruntjs.com/)、[Gulp](http://gulpjs.com/) 和 [webpack](https://webpack.js.org)）演变出来，改变了前端开发的面貌。


    要在 Node.js 中利用这些工具（或包），我们需要能够以有效的方式安装和管理它们。这就是 `npm`（Node 包管理器）大显用场。它可以安装你想要使用的包，并提供了一个与这些包交互的实用接口。


    在本指南中，我们将介绍使用 `npm` 的基础知识。我们将向你展示如何在本地和全局模式下安装包，以及如何删除、更新和安装特定版本的包。我们还将展示如何通过
    `package.json` 来管理项目的依赖项。如果你更喜欢看视频，为什么不注册 SitePoint Premium 并观看我们的免费视频教程：[什么是
    npm 以及我如何使用它？](https://www.sitepoint.com/premium/screencasts/what-is-npm-and-how-can-i-use-it?utm_source=blog&utm_medium=articles)


    但在开始使用 `npm` 之前，我们必须先在系统中安装 Node.js。让我们现在就开始吧。


    ## 安装 Node.js


    前往 Node.js [下载页面](https://nodejs.org/en/download/) 获取你需要的版本。这里有 Windows 和 Mac
    的安装程序，以及预编译的 Linux 二进制文件和源码。对于 Linux，你也可以通过包管理器安装 Node，如[此处所示](https://nodejs.org/en/download/package-manager/)。


    对于本教程，我们将使用 `v12.15.0`。在撰写本文时，这是当前的 [Node 长期支持 (LTS) 版本](https://github.com/nodejs/Release#release-schedule)。


    ### 使用版本管理器


    你也可以考虑[使用版本管理器安装 Node](http://sitepoint.com/quick-tip-multiple-versions-node-nvm)。这可以避免下一节中提到的权限问题。


    让我们看看 node 的安装位置并检查版本：


    ```

    $ which node

    /usr/bin/node

    $ node --version

    v12.15.0

    ```


    为了验证安装是否成功，让我们尝试一下 Node 的 REPL：


    ```

    $ node

    > console.log(''Node is running'');

    Node is running

    > .help

    .break    有时候你卡住了，用这个命令可以跳出来

    .clear    .break 的别名

    .editor   进入编辑器模式

    .exit     退出 repl

    .help     打印此帮助信息

    .load     将文件中的 JS 加载到 REPL 会话中

    .save     将此 REPL 会话中所有已评估的命令保存到文件中


    按 ^C 取消当前表达式，按 ^D 退出 repl

    ```


    Node.js 安装成功了，现在我们可以将注意力放在包含在安装包中的 `npm` 上：


    ```

    $ which npm

    /usr/bin/npm

    $ npm --version

    6.13.7

    ```


    ## 更新 npm


    `npm` 原代表 Node Package Manager，它是 Node.js 的一个独立项目。它的更新频率通常更高。你可以在此[页面](https://www.npmjs.com/package/npm)
    查看最新的可用 npm 版本。如果你发现自己使用的是旧版本，可以按照如下方式更新。


    对于 Linux 和 Mac 用户，请使用以下命令：


    ```

    npm install -g npm@latest

    ```


    对于 Windows 用户，过程可能会稍微复杂。这是[项目主页](https://github.com/npm/cli/#windows-install-or-upgrade)上的说明：


    > npm 3 为 Windows 用户进行了许多改进——如果你运行较新版本的 npm，将获得更好的体验。要进行升级，可以使用[微软的升级工具](https://github.com/felixrieseberg/npm-windows-upgrade)、[下载新版本的
    Node](https://nodejs.org/en/download/)，或者遵循[安装/升级 npm](https://npm.community/t/installing-upgrading-npm/251/2)
    帖子中的 Windows 升级说明。


    对于大多数用户来说，升级工具是最佳选择。要使用它，你需要以管理员身份打开 PowerShell 并执行以下命令：


    ```

    Set-ExecutionPolicy Unrestricted -Scope CurrentUser -Force

    ```


    这将确保你可以在系统上执行脚本。接下来，你需要安装 `npm-windows-upgrade` 工具（https://www.npmjs.com/package/npm-windows-upgrade）。安装工具后，你需要运行它以便它为你更新
    `npm`。请在提升的 PowerShell 控制台中完成所有操作：


    ```

    npm install --global --production npm-windows-upgrade

    npm-windows-upgrade --npm-version latest

    ```


    ## Node 包


    `npm` 可以在本地或全局模式下安装包。在本地模式下，会将包安装在父工作目录的 `node_modules` 文件夹中。


    ### 更改全局包的位置


    目前我们只全局安装了一个包——`npm` 包本身。所以让我们改变一下，并安装 [UglifyJS](https://www.npmjs.com/package/uglify-js)（一个
    JavaScript 压缩工具）。我们使用 `--global` 标志，但可以缩写为 `-g`：


    '
