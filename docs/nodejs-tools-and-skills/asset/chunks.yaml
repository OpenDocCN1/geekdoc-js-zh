    \ HTTP 请求体。第一行处理通过 `POST` 请求发送 JSON 的情况，并将这些数据放入 `request.body` 中。\n- `express.urlencoded`。第二行解析\
    \ URL 中的查询字符串数据（例如 `/profile?id=5`）并将其放入 `request.query` 中。\n- `cookieParser`。它获取客户端发送的所有\
    \ Cookie 并将其放入 `request.cookies` 中。它还允许你在将它们发送回客户端之前通过更改 `response.cookies` 来进行修改。\n\
    - `express.static`。该中间件从你的 `public` 文件夹提供静态资源。如果你想重命名或移动 `public` 文件夹，可以在这里更改路径。\n\
    \n接下来是路由：\n\n```\napp.use('/', indexRouter);\napp.use('/users', usersRouter);\n\
    ```\n\n在这里，之前引入的示例路由文件被挂到了到了 `app` 上。如果你需要添加额外的路由，可以在这里进行。\n\n此后的所有代码都用于错误处理。除非你想更改\
    \ Express 处理错误的方式，否则通常不需要修改这些代码。默认情况下，它被设置为在开发模式下显示在路由中发生的错误。\n\n## 启动新项目\n\n\
    让我们应用目前为止学到的知识来启动一个基础的 Express.js 应用程序。\n\n假设你已经作为全局模块安装了 `express-generator`，运行以下命令创建一个新的骨架项目：\n\
    \n```\nexpress -v hbs signup-form\n```\n\n正如我之前提到的，选择默认（Jade）之外的模板库是一个好主意。在这里我选择了\
    \ [Handlebars.js](https://handlebarsjs.com/)，因为我发现这种类似 mustache 的语法易于阅读和操作。\n\n\
    一旦生成器运行，切换到新创建的文件夹并安装依赖：\n\n```bash\ncd signup-form\nnpm i\n```\n\n此时，你可能会注意到几条关于包漏洞的警告。让我们更新\
    \ Handlebars.js 的版本来修复这些问题：\n\n```bash\nnpm install hbs@4.1.0\n```\n\n现在项目依赖已经安装并更新，让我们对一些样板视图模板进行自定义。\n\
    \n生成器创建了一个布局模板，用于渲染在所有视图之间共享的 HTML 标记。打开 `views/layout.hbs` 并将内容替换为以下内容：\n\n```html\n\
    <!doctype html>\n<html lang=\"en\">\n\n<head>\n  <meta charset=\"utf-8\">\n  <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1, shrink-to-fit=no\"\
    >\n  <meta name=\"description\" content=\"\">\n  <meta name=\"author\" content=\"\
    \">\n\n  <title>{{title}}</title>\n\n  <!-- Bootstrap core CSS -->\n  <link rel=\"\
    stylesheet\" href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css\"\
    \n    integrity=\"sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO\"\
    \ crossorigin=\"anonymous\">\n\n  <!-- Custom styles for this template -->\n \
    \ <link href=\"/stylesheets/style.css\" rel=\"stylesheet\">\n</head>\n\n<body>\n\
    \  {{{body}}}\n</body>\n\n</html>\n```\n\n这里的标记改编自 [Bootstrap 网站](https://getbootstrap.com/)\
    \ 上展示的一个[示例](https://getbootstrap.com/docs/4.1/examples/sign-in/)。我们还需要添加一些自定义样式，因此打开\
    \ `public/stylesheets/style.css` 并粘贴以下内容：\n\n```css\nhtml,\nbody {\n  height:\
    \ 100%;\n}\n\nbody {\n  display: -ms-flexbox;\n  display: flex;\n  -ms-flex-align:\
    \ center;\n  align-items: center;\n  padding-top: 40px;\n  padding-bottom: 40px;\n\
    \  background-color: #f5f5f5;\n}\n\n.full-width {\n  width: 100%;\n}\n```\n"
- fmt: "\nHopefully you now have a clear idea of how the `express-generator` tool\
    \ can save you time writing repetitive boilerplate when starting new Express-based\
    \ projects.\n\nBy providing a sensible default file structure, and installing\
    \ and wiring up commonly needed middleware, the generator creates a solid foundation\
    \ for new applications with just a couple of commands.\n\n# Chapter 4: An Introduction\
    \ to AdonisJs, a Laravel-like Node.js Framework\n\n### by Nilson Jacques\n\nDevelopers\
    \ looking to start building Node.js web apps often run into `Express` early on.\
    \ While `Express` is undoubtedly one of the most popular HTTP application framework\
    \ for Node, it’s quite minimal, leaving it down to the developer to piece together\
    \ the functionality they want from third-party packages.\n\n[AdonisJs](https://adonisjs.com/)\
    \ is an MVC framework for Node that aims to provide all the main functionality\
    \ you need to build a modern web application. It’s heavily inspired by the [Laravel\
    \ PHP framework](https://laravel.com/), borrowing much of the syntax and layout.\n\
    \nThis guide aims to take a high-level overview of the features offered by Adonis,\
    \ to help you decide whether it’s for you. Throughout the guide, I’ll be comparing\
    \ the functionality to that offered by Laravel, so PHP devs will have a good reference\
    \ point.\n\n### Adonis Versions\n\nAt the time of writing, Adonis `v5` is in preview\
    \ but still incomplete, so this article will look at `v4`.\n\n## Basics\n\nLet’s\
    \ start by taking a look at the tools Adonis provides for creating and maintaining\
    \ projects.\n\n### CLI Tool\n\nThe AdonisJs CLI is a tool that is broadly equivalent\
    \ to Laravel’s `artisan` command. It’s installed as a global Node module:\n\n\
    ```\nnpm i -g @adonisjs/cli\n```\n\nThe CLI makes it easy to create new projects:\n\
    \n```\nadonis new my-new-project\n```\n\nIt also makes it easy to serve them:\n\
    \n```\nadonis serve\n# or, with file watching\nadonis serve --dev\n```\n\nLike\
    \ `artisan`, when run within an Adonis project directory it, can be used to create\
    \ and run database migrations, scaffold models and controllers, and run custom\
    \ command-line jobs.\n\n### REPL\n\nYou can also use the CLI tool to boot into\
    \ a command-line environment similar to [tinker](https://laravel.com/docs/6.x/artisan#tinker).\
    \ Inside this environment you have access to your application’s code plus all\
    \ the framework libraries and helpers.\n\n```\nadonis repl\n```\n\nThe [repl](https://adonisjs.com/docs/4.0/database-basics#_what_is_repl)\
    \ (read–eval–print loop) is really useful for debugging and maintenance tasks—for\
    \ example, to create new users or reset passwords while in development.\n\n###\
    \ File Structure\n\nThe [file structure of a new AdonisJs project](https://adonisjs.com/docs/4.1/folder-structure)\
    \ bears more than a passing similarity to that of a Laravel project:\n\n```\n\
    ├── ace\n├── app\n│   ├── Controllers\n│   │   └── Http\n│   ├── Middleware\n\
    │   └── Models\n│       └── Traits\n├── config\n├── database\n│   └── migrations\n\
    ├── public\n├── resources\n│   └── views\n├── server.js\n└── start\n    ├── app.js\n\
    \    ├── kernel.js\n    └── routes.js\n```\n\nYou’ll find an `app` folder, grouping\
    \ together the controllers (by type), models, and middleware; a `config` folder,\
    \ with files for general application configuration, authentication, sessions,\
    \ and database configuration (among others); a `database` folder, for migrations,\
    \ factories, and seeders; and a `resource` folder, for your view templates.\n\n\
    An important deviation from the familiar is the `start` folder, which in Adonis\
    \ holds the files responsible for configuring service providers, middleware, and\
    \ routing.\n\n## HTTP\n\n### Defining Routes\n\nA core component of any web application\
    \ framework is routing, and the Adonis developers have opted to closely mirror\
    \ Laravel’s syntax for specifying HTTP routes.\n\nAn [application’s routes](https://adonisjs.com/docs/4.1/routing)\
    \ are defined in `start/routes.js` and will be familiar to anyone coming from\
    \ a Laravel background:\n\n```\nRoute.get('posts', () => {...});\nRoute.post('posts',\
    \ () => {...});\nRoute.put('posts/:id', () => {...});\nRoute.delete('posts/:id',\
    \ () => {...});\n```\n\nAs you can see from the last two routes, it’s pretty easy\
    \ to define routes with parameters:\n\n```\nRoute.get('posts/:id', ({ params })\
    \ => {\n  return `Post ${params.id}`\n});\n```\n\nLike Laravel, AdonisJs also\
    \ provides a handy shortcut for defining a bunch of CRUD routes for a resource\
    \ (that is, RESTful routes):\n\n```\nRoute.resource('posts', 'PostController');\n\
    ```\n\n### Middleware\n\nAdonis’ way of dealing with middleware should also be\
    \ very familiar to Laravel devs. [Middleware](https://adonisjs.com/docs/4.1/middleware)\
    \ is registered within the `start/kernel.js` file, and is done in one of three\
    \ different ways.\n\n**Server middleware:**\n\n```\nconst serverMiddleware = [\n\
    \  'Adonis/Middleware/Static',\n  'Adonis/Middleware/Cors',\n]\n```\n\nServer\
    \ middleware is run for every incoming request, regardless of whether it matches\
    \ a route or not.\n\n**Global middleware:**\n\n```\nconst globalMiddleware = [\n\
    \  'Adonis/Middleware/BodyParser',\n]\n```\n\nGlobal middleware is run for every\
    \ request that matches a defined route in your application.\n\n**Named middleware:**\n\
    \n```\nconst namedMiddleware = {\n  auth: 'Adonis/Middleware/Auth',\n}\n```\n\n\
    Once registered, named middleware can be attached to a route:\n\n```\nRoute.get('admin',\
    \ 'AdminController.index').middleware(['auth'])\n```\n\n### Controllers\n\nCreating\
    \ controllers in Adonis is a breeze with the CLI. There’s an option for specifying\
    \ the type, to create either an HTTP or WebSocket controller:\n\n```\nadonis make:controller\
    \ Posts --type http\n```\n\nThere’s also an option to create resourceful controller,\
    \ which has stub methods for the CRUD actions.\n\n## Database\n\nAdonis has database\
    \ support for MySQL/MariaDB, MSSQL, Oracle, PostgreSQL, and SQLite3. The driver\
    \ and connection settings are pulled in environment variables, or the `.env` file\
    \ if working locally.\n\n### Query Builder\n\nThe framework comes with [query\
    \ builder](https://adonisjs.com/docs/4.1/query-builder) that works in a similar\
    \ way to the one that comes with Laravel. It provides you with a fairly intuitive\
    \ API for building up complex queries without having to write any SQL:\n\n```\n\
    const adults = await Database\n  .from('users')\n  .where('age', '>', 18)\n  .first();\n\
    ```\n\nAdonis (or rather [Knex.js](https://knexjs.org/), which Adonis uses under\
    \ the hood), translates this into the correct SQL dialect for your database engine.\n\
    \n### Lucid ORM\n\nEven with a query builder, writing all the code to fetch and\
    \ update data for your app would quickly become verbose and repetitive. Frankly,\
    \ AdonisJs provides the [Lucid ORM](https://adonisjs.com/docs/4.1/lucid) (object-relational\
    \ mapper) to make our jobs a little easier.\n\nLucid, like Laravel’s Eloquent,\
    \ is based on the active record pattern, and the Adonis team have clearly put\
    \ in a lot of effort to try to achieve feature parity between the two libraries.\n\
    \n- **Relationships**: you can define `hasOne`, `hasMany`, `belongsTo`, `belongsToMany`,\
    \ and `manyThrough` relationships easily with the built-in methods.\n- **Traits**:\
    \ you can define “traits” to share functionality between different models without\
    \ duplicating code.\n- **Hooks**: you can attach callbacks to model lifecycle\
    \ events such as `beforeCreate` and `beforeSave` in order to modify records.\n\
    - **Mutators**: you can define getters and setters for model attributes to mutate\
    \ their values.\n\nAs mentioned earlier, the CLI can be used to create new models:\n\
    \n```\nadonis make:model Post\n```\n\nThis will generate the following file:\n\
    \n**app/Models/Post.js:**\n\n```\n'use strict'\n\nconst Model = use('Model')\n\
    \nclass Post extends Model {\n}\n\nmodule.exports = Post\n```\n\nPassing the `--migration`\
    \ flag to the command will also generate a skeleton migration file to create the\
    \ model’s corresponding DB table.\n"
