  trans: "\n\n一旦进入了 Mongo shell，输入 `db.version()` 即可查看正在运行的 MongoDB 版本。在本文编写时，输出应为\
    \ `4.2.2`。\n\n请注意，你可以随时通过运行 `quit()` 退出 Mongo shell，通过按下 `Ctrl` + `C` 退出 Mongo\
    \ 守护进程。\n\n现在让我们熟悉一些 MongoDB 的基础知识。\n\n## 基础数据库操作\n\n如果你还没有进入 Mongo shell，请先进入（在终端中输入\
    \ `mongo`）：\n\n```\n[mj@localhost ~]$ mongo\nMongoDB shell version v4.2.2\nconnecting\
    \ to: mongodb://127.0.0.1:27017/?compressors=disabled&gssapiServiceName=mongodb\n\
    Implicit session: session { \"id\" : UUID(\"08a624a0-b330-4233-b56b-1d5b15a48fea\"\
    ) }\nMongoDB server version: 4.2.2\n```\n\n让我们从创建一个数据库来开始操作开始。要创建数据库，MongoDB 使用\
    \ `use DATABASE_NAME` 命令：\n\n```\n> use exampledb\nswitched to db exampledb\n\
    ```\n\n要显示所有现有数据库，尝试 `show dbs`：\n\n```\n> show dbs\nadmin          0.000GB\n\
    config         0.000GB\nlocal          0.000GB\n```\n\n`exampledb` 不在列表中，是因为我们需要向数据库中插入至少一个文档。要插入文档，你可以使用\
    \ `db.COLLECTION_NAME.insertOne({\"key\":\"value\"})`。这里是一个示例：\n\n```\n> db.users.insertOne({name:\
    \ \"Bob\"})\n{\n   \"acknowledged\" : true,\n   \"insertedId\" : ObjectId(\"5a52c53b223039ee9c2daaec\"\
    )\n}\n```\n\nMongoDB 会自动创建一个新的 `users` 集合并插入一个具有键值对 `'name':'Bob'` 的文档。返回的 `ObjectId`\
    \ 是插入文档的 ID。MongoDB 在创建每个文档时都会为其创建一个唯一的 `ObjectId`，它将成为 `_id` 字段的默认值。\n\n现在我们应该能看到我们的数据库了：\n\
    \n```\n>show dbs\nadmin          0.000GB\nconfig         0.000GB\nexampledb  \
    \    0.000GB\nlocal          0.000GB\n```\n\n同样，你可以使用 `show collections` 命令确认集合是否已创建：\n\
    \n```\n> show collections\nusers\n```\n\n我们已经创建了一个数据库，添加了一个名为 `users` 的集合并在其中插入了一个文档。现在让我们尝试删除它。要删除现有数据库，请使用\
    \ `dropDatabase()` 命令，如下所示：\n\n```\n>db.dropDatabase()\n{ \"dropped\" : \"exampledb\"\
    , \"ok\" : 1 }\n```\n\n`show dbs` 确认数据库确实已被删除：\n\n```\n> show dbs\nadmin     \
    \     0.000GB\nconfig         0.000GB\nlocal          0.000GB\n```\n\n有关更多数据库操作，请参考\
    \ MongoDB 的[数据库命令](https://docs.mongodb.com/manual/reference/command/) 参考页面。\n\
    \n## 用户管理\n\n此时，你可能已经注意到 MongoDB 不带任何访问控制。虽然在开发过程中不需要提供用户名和密码很方便，但在生产环境中，你应该使用\
    \ Mongo 更改这一点。以下是创建一个具有完全读写权限的数据库用户的步骤：\n\n*   确保你在没有开启任何访问控制的情况下启动了服务器（通常通过输入\
    \ `mongod`）。\n*   通过输入 `mongo` 打开 shell。\n*   从 shell 中，为 `exampledb` 数据库添加一个具有\
    \ `readWrite` 角色的用户。这将提示你输入密码。显然，将 “manjunath” 替换为所需的用户名：\n```javascript\nuse\
    \ exampledb\ndb.createUser(\n  user: \"manjunath\",\n  pwd: password(),\n  roles:\
    \ [ \"readWrite\" ]\n)\n```\n*   退出 Mongo shell。\n*   使用 `mongod --auth` 关闭并重启服务器。连接到此实例的客户端现在必须身份验证。\n\
    *   重新打开 shell：`mongo --authentication \"exampledb\" -u \"manjunath\" -p`。现在会提示你输入密码。\n\
    \n更多信息请参阅[访问控制文档](https://docs.mongodb.com/manual/authentication/)\n\n## MongoDB\
    \ 操作\n\n你可能已经知道 CRUD 代表 `create`（创建）、`read`（读取）、`update`（更新）和 `delete`（删除）。这些是在构建应用程序时所需的四种基础数据库操作。例如，任何现代应用程序都将具有在\
    \ MongoDB 创建新用户、读取用户数据并在需要时删除账户的能力。\n\n### 创建操作\n\n创建与向集合[插入文档](https://docs.mongodb.com/manual/tutorial/insert-documents/)\
    \ 是相同的。在上节中，我们使用 `db.collection.insertOne()` 语法插入了单个文档。另一个方法是 `db.collection.insertMany()`，它可以一次性插入多个文档。其语法如下：\n\
    \n```\n> db.collection.insertMany([ <document 1>, <document 2>, ... ])\n```\n\n\
    让我们创建一个 `users` 集合并填充一些实际的用户：\n\n```javascript\n> use exampledb\n> db.users.insertMany([\n\
    \   { name: \"Tom\", age:15, email: \"tom@example.com\" },\n   { name: \"Bob\"\
    , age:35, email:\"bob@example.com\" },\n   { name: \"Kate\", age:27, email:\"\
    kate@example.com\" },\n   { name: \"Katherine\", age:65, email:\"katherine@example.com\"\
    }\n])\n{\n   \"acknowledged\" : true,\n   \"insertedIds\" : [\n      ObjectId(\"\
    5e25bb58ba0cf1647aa56ff\"),\n      ObjectId(\"5e25bb58ba0cf1647aa700\"),\n   \
    \   ObjectId(\"5e25bb58ba0cf1647aa701\"),\n      ObjectId(\"5e25bb58ba0cf1647aa702\"\
    )\n   ]\n}\n```\n\n`insertMany` 方法接收对象数组，并返回 `ObjectId` 数组。\n\n### 读取操作\n\n读取操作用于从集合中[检索单个文档或多个文档](https://docs.mongodb.com/manual/tutorial/query-documents/)。读取操作的语法如下：\n\
    \n```\n> db.collection.find(query, projection)\n```\n\n要检索所有用户文档，你可以这样做：\n\n```javascript\n\
    > db.users.find().pretty()\n{\n  \"_id\" : ObjectId(\"5e25bb58ba0cf1647aa56ff\"\
    ),\n  \"name\" : \"Tom\",\n  \"age\" : 15,\n  \"email\" : \"tom@example.com\"\n\
    }\n{\n  \"_id\" : ObjectId(\"5e25bb58ba0cf1647aa700\"),\n  \"name\" : \"Bob\"\
    ,\n  \"age\" : 35,\n  \"email\" : \"bob@example.com\"\n}\n{\n  \"_id\" : ObjectId(\"\
    5e25bb58ba0cf1647aa701\"),\n  \"name\" : \"Kate\",\n  \"age\" : 27,\n  \"email\"\
    \ : \"kate@example.com\"\n}\n{\n  \"_id\" : ObjectId(\"5e25bb58ba0cf1647aa702\"\
    ),\n  \"name\" : \"Katherine\",\n  \"age\" : 65,\n  \"email\" : \"katherine@example.com\"\
    \n}\n```\n\n这对应于 SQL 数据库的 `SELECT * FROM USERS` 查询。\n\n`pretty` 方法是一个[游标方法](https://docs.mongodb.com/manual/reference/method/js-cursor/)，还有许多其他方法。你可以链用这些方法来修改你的查询以及查询返回的文档。\n\
    \n你可能需要过滤查询以返回集合的子集——例如找到所有低于 30 岁的用户。你可以这样修改查询：\n\n```javascript\n> db.users.find({\
    \ age: { $lt: 30 })\n{\n  \"_id\" : ObjectId(\"5e25bb58ba0cf1647aa56ff\"),\n \
    \ \"name\" : \"Tom\",\n  \"age\" : 15,\n  \"email\" : \"tom@example.com\"\n}\n\
    {\n  \"_id\" : ObjectId(\"5e25bb58ba0cf1647aa701\"),\n  \"name\" : \"Kate\",\n\
    \  \"age\" : 27,\n  \"email\" : \"kate@example.com\"\n}\n```\n\n在此例中，`$lt` 是一个查询过滤器运算符，用于选择\
    \ `age` 字段值小于 30 的文档。有许多可用的比较和逻辑查询过滤器。\n\n### 更新操作\n\n[更新操作](https://docs.mongodb.com/manual/tutorial/update-documents/)\
    \ 修改集合中的文档。与创建操作类似，MongoDB 提供了多种更新文档的方法。例如：\n\n1.  `db.collection.updateOne(<filter>,\
    \ <update>, <options>)`\n\n2.  `db.collection.updateMany(<filter>, <update>, <options>)`\n\
    \n"
- fmt: "\nIf you need to add an extra field—say, `registration`—to all the existing\
    \ documents in a collection, you can do something like this:\n\n```\n> db.users.updateMany({},\
    \ {$set: { registration: \"incomplete\"}})\n{ \"acknowledged\" : true, \"matchedCount\"\
    \ : 4, \"modifiedCount\" : 4 }\n```\n\nThe first argument is an empty object because\
    \ we want to update all documents in the collection. The `$set` is an update operator\
    \ that sets the value of a field with the specified value. You can verify that\
    \ the extra field was added using `db.users.find()`.\n\nTo update the value of\
    \ documents that match certain criteria, `updateMany()` accepts a filter object\
    \ as its first argument. For instance, you might want to overwrite the value of\
    \ `registration` to `complete` for all users who are aged 18+. Here’s what you\
    \ can do:\n\n```\n> db.users.updateMany(\n  {age:{ $gt: 18} },\n  {$set: { registration:\
    \ \"complete\"}\n})\n\n{ \"acknowledged\" : true, \"matchedCount\" : 3, \"modifiedCount\"\
    \ : 3 }\n```\n\nTo update the registration details of a single user, you can do\
    \ this:\n\n```\n> db.users.updateOne(\n {email: \"tom@example.com\" },\n {$set:\
    \ { registration: \"complete\"}\n})\n\n{ \"acknowledged\" : true, \"matchedCount\"\
    \ : 1, \"modifiedCount\" : 1 }\n```\n\n### Delete Operation\n\nA [delete operation](https://docs.mongodb.com/manual/tutorial/remove-documents/)\
    \ removes a document from the collection. To delete a document, you can use the\
    \ `db.collection.deleteOne(<filter>, <options>)` method, and to delete multiple\
    \ documents, you can use the `db.collection.deleteMany(<filter>, <options>)` method.\n\
    \nTo delete documents based on certain criteria, you can use the filter operators\
    \ that we used for the read and update operation:\n\n```\n> db.users.updateOne(\n\
    \ {email: \"tom@example.com\" },\n {$set: { status: \"dormant\"}\n})\n\n{ \"acknowledged\"\
    \ : true, \"matchedCount\" : 1, \"modifiedCount\" : 1 }\n\n> db.users.deleteMany(\
    \ { status: { $in: [ \"dormant\", \"inactive\" ] } } )\n\n{ \"acknowledged\" :\
    \ true, \"deletedCount\" : 1 }\n```\n\nThis deletes all documents with a status\
    \ of “dormant” or “inactive”.\n\n## Schema Validation\n\nEarlier in this tutorial,\
    \ when I said that Mongo is a schema-less database, I was over simplifying somewhat.\n\
    \nIt is schema-less in so far as we don’t need to specify the number or type of\
    \ columns before inserting our data. However, it’s also possible to define a JSON\
    \ schema and use it to enforce validation rules for our data.\n\nLet’s create\
    \ a `validatedUsers` collection, where we can use the `validator` construct to\
    \ specify that a `name` is mandatory and that an `email` field matches a certain\
    \ pattern:\n\n```\n> db.createCollection(\"validatedUsers\", {\n  validator: {\n\
    \    $jsonSchema: {\n      required: [ \"name\", \"email\" ],\n      properties:\
    \ {\n        name: {\n          bsonType: \"string\",\n          description:\
    \ \"must be a string and is required\"\n        },\n        email: {\n       \
    \   bsonType: \"string\",\n          pattern: \"^.+\\@.+$\",\n          description:\
    \ \"must be a valid email and is required\"\n        }\n      }\n    }\n  }\n\
    })\n\n{ \"ok\" : 1 }\n```\n\nNow if we try to insert incorrect data, we’ll receive\
    \ a validation error:\n\n```\n> db.validatedUsers.insertOne({ name: \"Jim\", email:\
    \ \"not-an-email\" })\n\n2020-01-22T09:56:56.918+0100 E  QUERY    &lsqb;js] uncaught\
    \ exception: WriteError({\n  \"index\" : 0,\n  \"code\" : 121,\n  \"errmsg\" :\
    \ \"Document failed validation\",\n  \"op\" : {\n    \"_id\" : ObjectId(\"5e280e5847eb18010666530c\"\
    ),\n    \"name\" : \"Jim\",\n    \"email\" : \"not-an-email\"\n  }\n}) :\nWriteError({\n\
    \  \"index\" : 0,\n  \"code\" : 121,\n  \"errmsg\" : \"Document failed validation\"\
    ,\n  \"op\" : {\n    \"_id\" : ObjectId(\"5e280e5847eb18010666530c\"),\n    \"\
    name\" : \"Jim\",\n    \"email\" : \"not-an-email\"\n  }\n})\nWriteError@src/mongo/shell/bulk_api.js:458:48\n\
    mergeBatchResults@src/mongo/shell/bulk_api.js:855:49\nexecuteBatch@src/mongo/shell/bulk_api.js:919:13\n\
    Bulk/this.execute@src/mongo/shell/bulk_api.js:1163:21\nDBCollection.prototype.insertOne@src/mongo/shell/crud_api.js:264:9\n\
    @(shell):1:1\n```\n\nYou can read [more about schema validation in the project’s\
    \ documentation](https://docs.mongodb.com/manual/schema-validation/).\n\n## Overview\
    \ of these drivers\n\nIf you look through the [MongoDB documentation](https://docs.mongodb.com/node/),\
    \ you’ll see that the API is pretty similar to what we’ve been using in the shell.\n\
    \n### Node.js Driver\n\nThe Node.js driver for MongoDB is `MongoClient`. To interact\
    \ with the database, you’ll need the driver. You can install it like so:\n\n```bash\n\
    npm install mongodb\n```\n\nThe example below demonstrates how to use it:\n\n\
    ```\nconst { MongoClient } = require('mongodb');\nconst url = 'mongodb://localhost:27017';\n\
    \n(async () => {\n  let client;\n\n  try {\n    client = await MongoClient.connect(url,\
    \ {\n      useNewUrlParser: true,\n      useUnifiedTopology: true\n    });\n\n\
    \    const db = client.db('exampledb');\n    const collection = db.collection('users');\n\
    \    const users = await collection.find().toArray();\n    console.log(users);\n\
    \  } catch (err) {\n    console.log(err.stack);\n  }\n\n  if (client) {\n    await\
    \ client.close();\n  }\n})();\n```\n\n### Mongoose Driver\n\nAnother popular Node.js\
    \ driver for MongoDB is [Mongoose](https://mongoosejs.com/index.html). Mongoose\
    \ is built on top of the official driver. Back when Mongoose was released, it\
    \ had tons of features that the native driver didn’t have. One prominent feature\
    \ was the ability to define a schema structure that would get mapped onto the\
    \ database. However, the latest versions of MongoDB have adopted some of these\
    \ features in the form of JSON schema and schema validation.\n\nYou can install\
    \ Mongoose like so:\n\n```bash\nnpm install mongoose\n```\n\nHere’s the Mongoose\
    \ equivalent of the previous example:\n\n```javascript\nconst mongoose = require('mongoose');\n\
    \nasync function run() {\n  await mongoose.connect('mongodb://localhost:27017/exampledb',\
    \ {\n    useNewUrlParser: true,\n    useUnifiedTopology: true\n  });\n\n  const\
    \ userSchema = new mongoose.Schema({ name: String, age: String, email: String\
    \ });\n  const User = mongoose.model('User', userSchema);\n\n  const users = await\
    \ User.find();\n  console.log(users);\n  mongoose.connection.close();\n}\n\nrun().catch(error\
    \ => console.log(error.stack));\n```\n\n## Conclusion\n\nIn Mongoose, everything\
    \ starts with a [Schema](https://mongoosejs.com/docs/guide.html). Each schema\
    \ maps to a MongoDB collection and defines the shape of the documents within that\
    \ collection.\n"
  raw: "If you need to add an extra field—say, `registration`—to all the existing\
    \ documents in a collection, you can do something like this:\n\n```\n> db.users.updateMany({},\
    \ {$set: { registration: \"incomplete\"}})\n{ \"acknowledged\" : true, \"matchedCount\"\
    \ : 4, \"modifiedCount\" : 4 }\n```\n\nThe first argument is an empty object because\
    \ we want to update all documents in the collection. The `$set` is an update operator\
    \ that sets the value of a field with the specified value. You can verify that\
    \ the extra field was added using `db.users.find()`.\n\nTo update the value of\
    \ documents that match certain criteria, `updateMany()` accepts a filter object\
    \ as its first argument. For instance, you might want to overwrite the value of\
    \ `registration` to `complete` for all users who are aged 18+. Here’s what you\
    \ can do:\n\n```\n> db.users.updateMany(\n  {age:{ $gt: 18} },\n  {$set: { registration:\
    \ \"complete\"}\n})\n\n{ \"acknowledged\" : true, \"matchedCount\" : 3, \"modifiedCount\"\
    \ : 3 }\n```\n\nTo update the registration details of a single user, you can do\
    \ this:\n\n```\n> db.users.updateOne(\n {email: \"tom@example.com\" },\n {$set:\
    \ { registration: \"complete\"}\n})\n\n{ \"acknowledged\" : true, \"matchedCount\"\
    \ : 1, \"modifiedCount\" : 1 }\n```\n\n### Delete Operation\n\nA [delete operation](https://docs.mongodb.com/manual/tutorial/remove-documents/)\
    \ removes a document from the collection. To delete a document, you can use the\
    \ `db.collection.deleteOne(<filter>, <options>)` method, and to delete multiple\
    \ documents, you can use the `db.collection.deleteMany(<filter>, <options>)` method.\n\
    \nTo delete documents based on certain criteria, you can use the filter operators\
    \ that we used for the read and update operation:\n\n```\n> db.users.updateOne(\n\
    \ {email: \"tom@example.com\" },\n {$set: { status: \"dormant\"}\n})\n\n{ \"acknowledged\"\
    \ : true, \"matchedCount\" : 1, \"modifiedCount\" : 1 }\n\n> db.users.deleteMany(\
    \ { status: { $in: [ \"dormant\", \"inactive\" ] } } )\n\n{ \"acknowledged\" :\
    \ true, \"deletedCount\" : 1 }\n```\n\nThis deletes all documents with a status\
    \ of “dormant” or “inactive”.\n\n## Schema Validation\n\nEarlier in this tutorial,\
    \ when I said that Mongo is a schema-less database, I was over simplifying somewhat.\n\
    \nIt *is* schema-less in so far as we don’t need to specify the number or type\
    \ of columns before inserting our data. However, it’s also possible to define\
    \ a JSON schema and use it to enforce validation rules for our data.\n\nLet’s\
    \ create a `validatedUsers` collection, where we can use the `validator` construct\
    \ to specify that a `name` is mandatory and that an `email` field matches a certain\
    \ pattern:\n\n```\n> db.createCollection(\"validatedUsers\", {\n  validator: {\n\
    \    $jsonSchema: {\n      required: [ \"name\", \"email\" ],\n      properties:\
    \ {\n        name: {\n          bsonType: \"string\",\n          description:\
    \ \"must be a string and is required\"\n        },\n        email: {\n       \
    \   bsonType: \"string\",\n          pattern: \"^.+\\@.+$\",\n          description:\
    \ \"must be a valid email and is required\"\n        }\n      }\n    }\n  }\n\
    })\n\n{ \"ok\" : 1 }\n```\n\nNow if we try to insert incorrect data, we’ll receive\
    \ a validation error:\n\n```\n> db.validatedUsers.insertOne({ name: \"Jim\", email:\
    \ \"not-an-email\" })\n\n2020-01-22T09:56:56.918+0100 E  QUERY    &lsqb;js] uncaught\
    \ exception: WriteError({\n  \"index\" : 0,\n  \"code\" : 121,\n  \"errmsg\" :\
    \ \"Document failed validation\",\n  \"op\" : {\n    \"_id\" : ObjectId(\"5e280e5847eb18010666530c\"\
    ),\n    \"name\" : \"Jim\",\n    \"email\" : \"not-an-email\"\n  }\n}) :\nWriteError({\n\
    \  \"index\" : 0,\n  \"code\" : 121,\n  \"errmsg\" : \"Document failed validation\"\
    ,\n  \"op\" : {\n    \"_id\" : ObjectId(\"5e280e5847eb18010666530c\"),\n    \"\
    name\" : \"Jim\",\n    \"email\" : \"not-an-email\"\n  }\n})\nWriteError@src/mongo/shell/bulk_api.js:458:48\n\
    mergeBatchResults@src/mongo/shell/bulk_api.js:855:49\nexecuteBatch@src/mongo/shell/bulk_api.js:919:13\n\
    Bulk/this.execute@src/mongo/shell/bulk_api.js:1163:21\nDBCollection.prototype.insertOne@src/mongo/shell/crud_api.js:264:9\n\
    @(shell):1:1\n```\n\nYou can read [more about schema validation in the project’s\
    \ documentation](https://docs.mongodb.com/manual/core/schema-validation/).\n\n\
    ## An Overview of MongoDB Drivers\n\nFor an application to communicate with the\
    \ MongoDB server, you have to use a client-side library called a **driver**. The\
    \ driver sits on top of the database server and lets you interact with the database\
    \ using the driver API. MongoDB has official and third-party drivers for all popular\
    \ languages and environments.\n\nThe most popular drivers for Node.js include\
    \ [the native MongoDB driver](https://docs.mongodb.com/ecosystem/drivers/node/)\
    \ and [Mongoose](https://mongoosejs.com/). I’ll briefly discuss both of these\
    \ here.\n\n### MongoDB Node.js Driver\n\nThis is the official [MongoDB driver\
    \ for Node.js](https://mongodb.github.io/node-mongodb-native/). The driver can\
    \ interact with the database using either callbacks, promises or `async … await`.\n\
    \nYou can install it like so:\n\n```\nnpm install mongod\n```\n\nThe example below\
    \ demonstrates how to connect the driver to the server, and list out all of the\
    \ documents in the `users` collection.\n\n#### Name and Password\n\nIf you connected\
    \ to the Mongo server using a name and password, you’ll need to specify these\
    \ details in your code.\n\n```\nconst MongoClient = require('mongodb').MongoClient;\n\
    const url = 'mongodb://localhost:27017/exampledb';\n\n// With authentication:\n\
    // const url = 'mongodb://<userName>:<passWord>@localhost:27017/exampledb';\n\
    // Further reading: https://docs.mongodb.com/manual/reference/connection-string/\n\
    \n(async () => {\n  let client;\n\n  try {\n    client = await MongoClient.connect(url,\
    \ {\n      useNewUrlParser: true,\n      useUnifiedTopology: true\n    });\n\n\
    \    const db = client.db('exampledb');\n    const collection = db.collection('users');\n\
    \    const users = await collection.find().toArray();\n    console.log(users);\n\
    \  } catch (err) {\n    console.log(err.stack);\n  }\n\n  if (client) {\n    client.close();\n\
    \  }\n})(); \n```\n\nThe `MongoClient.connect` returns a promise. Any error is\
    \ caught by the `catch` block and any database actions go inside the `try` block.\
    \ If you look through the [Mongo driver documentation](https://mongodb.github.io/node-mongodb-native/3.5/),\
    \ you’ll see that the API is pretty similar to what we’ve been using in the shell.\n\
    \n### Mongoose Driver\n\nAnother popular Node.js driver for MongoDB is [Mongoose](http://mongoosejs.com/docs/index.html).\
    \ Mongoose is built on top of the official MongoDB driver. Back when Mongoose\
    \ was released, it had tons of features that the native MongoDB driver didn’t\
    \ have. One prominent feature was the ability to define a schema structure that\
    \ would get mapped onto the database’s collection. However, the latest versions\
    \ of MongoDB have adopted some of these features in the form of JSON schema and\
    \ schema validation.\n\nApart from schema, other fancy features of Mongoose include\
    \ [models](https://mongoosejs.com/docs/models.html), [validators](https://mongoosejs.com/docs/validation.html)\
    \ and [middleware](https://mongoosejs.com/docs/middleware.html), the [populate\
    \ method](https://mongoosejs.com/docs/populate.html), [plugins](https://mongoosejs.com/docs/plugins.html)\
    \ and so on. You can read more about these in the Mongoose docs.\n\nYou can install\
    \ Mongoose like so:\n\n```\nnpm install mongoose\n```\n\nHere’s the Mongoose equivalent\
    \ of the previous example:\n\n```\nconst mongoose = require('mongoose');\n\nasync\
    \ function run() {\n  await mongoose.connect('mongodb://localhost:27017/exampledb',\
    \ {\n    useNewUrlParser: true,\n    useUnifiedTopology: true\n  });\n\n  const\
    \ userSchema = new mongoose.Schema({ name: String, age: String, email: String\
    \ });\n  const User = mongoose.model('User', userSchema);\n\n  const users = await\
    \ User.find();\n  console.log(users);\n  mongoose.connection.close();\n}\n\nrun().catch(error\
    \ => console.log(error.stack));\n```\n\nIn Mongoose, everything starts with a\
    \ a [Schema](https://mongoosejs.com/docs/guide.html). Each schema maps to a MongoDB\
    \ collection and defines the shape of the documents within that collection.\n\n\
    ## Conclusion"
