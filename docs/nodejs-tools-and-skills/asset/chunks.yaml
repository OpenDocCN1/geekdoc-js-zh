    \ of making, check out this Stack Overflow thread: [Why should you use an ORM?](https://stackoverflow.com/q/448684/1136887).\
    \ Also check out this post on SitePoint: [3 JavaScript ORMs You Might Not Know](https://www.sitepoint.com/3-javascript-orms-you-might-not-know/).\n\
    \n## Conclusion\n\nIn this tutorial, we’ve installed the [mysql client](https://github.com/mysqljs/mysql)\
    \ for Node.js and configured it to connect to a database. We’ve also seen how\
    \ to perform CRUD operations, work with prepared statements and escape user input\
    \ to mitigate SQL injection attacks. And yet, we’ve only scratched the surface\
    \ of what the mysql client offers. For more detailed information, we recommend\
    \ reading the [official documentation](https://github.com/mysqljs/mysql).\n\n\
    And please bear in mind that the mysql module is not the only show in town. There\
    \ are other options too, such as the popular [node-mysql2](https://github.com/sidorares/node-mysql2).\n\
    \n# Chapter 7: Introduction to MongoDB\n\n### by Manjunath M. and James Hibbard\n\
    \nMongoDB is a cross-platform, open-source, NoSQL database, used by many modern\
    \ Node-based web applications to persist data.\n\nIn this beginner-friendly tutorial,\
    \ I’ll demonstrate how to install Mongo, then start using it to store and query\
    \ data. I’ll also look at how to interact with a Mongo database from within a\
    \ Node program, and also highlight some of the differences between Mongo and a\
    \ traditional relational database (such as MySQL) along the way.\n\n## Terminology\
    \ and Basic Concepts\n\nMongoDB is a document-oriented database. This means that\
    \ it doesn’t use tables and rows to store its data, but instead *collections*\
    \ of JSON-like *documents*. These documents support embedded fields, so related\
    \ data can be stored within them.\n\nMongoDB is also a schema-less database, so\
    \ we don’t need to specify the number or type of columns before inserting our\
    \ data.\n\nHere’s an example of what a MongoDB document might look like:\n\n```\n\
    {\n  _id: ObjectId(3da252d3902a),\n  type: \"Tutorial\",\n  title: \"An Introduction\
    \ to MongoDB\",\n  author: \"Manjunath M\",\n  tags: [ \"mongodb\", \"compass\"\
    , \"crud\" ],\n  categories: [\n    {\n      name: \"javascript\",\n      description:\
    \ \"Tutorialss on client-side and server-side JavaScript programming\"\n    },\n\
    \    {\n      name: \"databases\",\n      description: \"Tutorialss on different\
    \ kinds of databases and their management\"\n    },\n  ],\n  content: \"MongoDB\
    \ is a cross-platform, open-source, NoSQL database...\"\n}\n```\n\nAs you can\
    \ see, the document has a number of *fields* (`type`, `title` etc.), which store\
    \ *values* (“Tutorial”, “An Introduction to MongoDB” etc.). These values can contain\
    \ strings, numbers, arrays, arrays of sub-documents (for example, the `categories`\
    \ field), geo-coordinates and more.\n\nThe `_id` field name is reserved for use\
    \ as a primary key. Its value must be unique in the collection, it’s immutable,\
    \ and it may be of any type other than an array.\n\n#### JSON-like?\n\nFor those\
    \ wondering what “JSON-like” means, internally Mongo uses something called [BSON](http://bsonspec.org/)\
    \ (short for Bin­ary JSON). In practice, you don’t really need to know much about\
    \ BSON when working with MongoDB.\n\nAs you might guess, a **document** in a NoSQL\
    \ database corresponds to a **row** in an SQL database. A group of documents together\
    \ is known as a **collection**, which is roughly synonymous with a **table** in\
    \ a relational database.\n\nHere’s a table summarizing the different terms:\n\n\
    | SQL Server | MongoDB |\n\n| --- | --- |\n\n| Database | Database |\n\n| Table\
    \ | Collection |\n\n| Row | Document |\n\n| Column | Field |\n\n| Index | Index\
    \ |\n\nIf you’re starting a new project and are unsure whether to choose Mongo\
    \ or a relational database such as MySQL, now might be a good time to read our\
    \ tutorial [SQL vs NoSQL: How to Choose](https://www.sitepoint.com/sql-vs-nosql-choose/).\n\
    \nWith that said, let’s go ahead and install MongoDB.\n\n## Installing MongoDB\n\
    \n#### Online Playgrounds\n\nIf you’d just like to follow along with this tutorial\
    \ without installing any software on your PC, there are a couple of online services\
    \ you can use. [Mongo playground](https://mongoplayground.net/), for example,\
    \ is a simple sandbox to test and share MongoDB queries online.\n\nMongoDB comes\
    \ in various editions. The one we’re interested in is the MongoDB Community Edition.\n\
    \nThe project’s home page has excellent documentation on installing Mongo, and\
    \ I won’t try to replicate that here. Rather, I’ll offer you links to instructions\
    \ for each of the main operating systems:\n\n*   [Install MongoDB Community Edition\
    \ on Windows](https://docs.mongodb.com/manual/tutorial/install-mongodb-on-windows/)\n\
    \n*   [Install MongoDB Community Edition on macOS](https://docs.mongodb.com/manual/tutorial/install-mongodb-on-os-x/)\n\
    \n*   [Install MongoDB Community Edition on Ubuntu](https://docs.mongodb.com/manual/tutorial/install-mongodb-on-ubuntu/)\n\
    \nIf you use a non-Ubuntu-based version of Linux, you can check out [this page](https://docs.mongodb.com/manual/installation/#mongodb-community-edition-installation-tutorials)\
    \ for installation instructions for other distros. MongoDB is also normally available\
    \ through the official Linux software channels, but sometimes this will pull in\
    \ an outdated version.\n\n### Post Installation Configuration\n\nOnce you have\
    \ MongoDB installed for your system, you might encounter this error:\n\n```\n\
    dbpath (/data/db) does not exist.\n Create this directory or give existing directory\
    \ in --dbpath.\n See http://dochub.mongodb.org/core/startingandstoppingmongo\n\
    ```\n\nThis means that Mongo can’t find (or access) the directory it uses to store\
    \ its databases. This is pretty easy to remedy:\n\n```\nsudo mkdir -p /data/db\n\
    sudo chown -R `id -un` /data/db\n```\n\nThe first command creates the `data/db`\
    \ directory. The second sets permissions so that Mongo can write to that directory.\n\
    \n### Install the Compass GUI\n\nWe’ll be using the command line in this tutorial,\
    \ but MongoDB also offers a tool called Compass to connect to and manage your\
    \ databases using a GUI.\n\nIf you’re on Windows, Compass can be installed as\
    \ part of the main Mongo installation (just select the appropriate option from\
    \ the wizard). Otherwise, you can [download Compass for your respective OS here](https://docs.mongodb.com/compass/master/install/).\n\
    \nThis is what it looks like:\n\n![Mongo DB Compass GUI](Images/MongoDB-Compass.png)\n\
    \n### The Mongo Shell\n\nWe can test our installation by opening the Mongo shell.\
    \ You can do this by opening a terminal window and typing `mongo`.\n\n#### Check\
    \ Your Path\n\nThis assumes that `<mongodb installation dir>/bin` is in your path.\
    \ If for any reason this isn’t the case, change into the `<mongodb installation\
    \ dir>/bin` directory and rerun the command.\n\nIf you get an `Error: couldn't\
    \ connect to server` error, you’ll need to start the Mongo server (in a second\
    \ terminal window) with the command `mongod`."
