    Node.js makes it possible to write applications in JavaScript on the server. It’s
    built on the [V8 JavaScript runtime](https://v8.dev/) and written in C++—so it’s
    fast. Originally, it was intended as a server environment for applications, but
    developers started using it to create tools to aid them in local task automation.
    Since then, a whole new ecosystem of Node-based tools (such as [Grunt](http://gruntjs.com/),
    [Gulp](http://gulpjs.com/) and [webpack](https://webpack.js.org)) has evolved
    to transform the face of front-end development.


    To make use of these tools (or packages) in Node.js, we need to be able to install
    and manage them in a useful way. This is where `npm`, the Node package manager,
    comes in. It installs the packages you want to use and provides a useful interface
    to work with them.


    In this guide, we''re going to look at the basics of working with `npm`. We''ll
    show you how to install packages in local and global mode, as well as delete,
    update and install a certain version of a package. We’ll also show you how to
    work with `package.json` to manage a project’s dependencies. If you’re more of
    a video person, why not sign up for SitePoint Premium and watch our free screencast:
    [What is npm and How Can I Use It?](https://www.sitepoint.com/premium/screencasts/what-is-npm-and-how-can-i-use-it?utm_source=blog&utm_medium=articles)


    But before we can start using `npm`, we first have to install Node.js on our system.
    Let’s do that now.


    ## Installing Node.js


    Head to the Node.js [download page](https://nodejs.org/en/download/) and grab
    the version you need. There are Windows and Mac installers available, as well
    as pre-compiled Linux binaries and source code. For Linux, you can also install
    Node via the package manager, [as outlined here](https://nodejs.org/en/download/package-manager/).


    For this tutorial, we’re going to use `v12.15.0`. At the time of writing, this
    is the current [Long Term Support (LTS) version of Node](https://github.com/nodejs/Release#release-schedule).


    ### Using a Version Manager


    You might also consider [installing Node using a version manager](http://sitepoint.com/quick-tip-multiple-versions-node-nvm).
    This negates the permissions issue raised in the next section.


    Let’s see where node was installed and check the version:


    ```

    $ which node

    /usr/bin/node

    $ node --version

    v12.15.0

    ```


    To verify that your installation was successful, let’s give Node’s REPL a try:


    ```

    $ node

    > console.log(''Node is running'');

    Node is running

    > .help

    .break    Sometimes you get stuck, this gets you out

    .clear    Alias for .break

    .editor   Enter editor mode

    .exit     Exit the repl

    .help     Print this help message

    .load     Load JS from a file into the REPL session

    .save     Save all evaluated commands in this REPL session to a file


    Press ^C to abort current expression, ^D to exit the repl

    ```


    The Node.js installation worked, so we can now focus our attention on `npm`, which
    was included in the install:


    ```

    $ which npm

    /usr/bin/npm

    $ npm --version

    6.13.7

    ```


    ## Updating npm


    `npm`, which originally stood for Node Package Manager, is a separate project
    from Node.js. It tends to be updated more frequently. You can check the latest
    available npm version on this [page](https://www.npmjs.com/package/npm). If you
    realize you have an older version, you can update as follows.


    For Linux and Mac users, use the following command:


    ```

    npm install -g npm@latest

    ```


    For Windows users, the process might be slightly more complicated. This is what
    it says on the [project''s home page](https://github.com/npm/cli/#windows-install-or-upgrade):


    > Many improvements for Windows users have been made in npm 3 - you will have
    a better experience if you run a recent version of npm. To upgrade, either use
    [Microsoft''s upgrade tool](https://github.com/felixrieseberg/npm-windows-upgrade),
    [download a new version of Node](https://nodejs.org/en/download/), or follow the
    Windows upgrade instructions in the [Installing/upgrading npm](https://npm.community/t/installing-upgrading-npm/251/2)
    post.


    For most users, the upgrade tool will be the best bet. To use it, you’ll need
    to open PowerShell as administrator and execute the following command:


    ```

    Set-ExecutionPolicy Unrestricted -Scope CurrentUser -Force

    ```


    This will ensure you can execute scripts on your system. Next, you’ll need to
    install the `npm-windows-upgrade` tool (https://www.npmjs.com/package/npm-windows-upgrade).
    After you’ve installed the tool, you need to run it so that it can update `npm`
    for you. Do all this within the elevated PowerShell console:


    ```

    npm install --global --production npm-windows-upgrade

    npm-windows-upgrade --npm-version latest

    ```


    ## Node Packaged Modules


    `npm` can install packages in local or global mode. In local mode, it installs
    the package in a `node_modules` folder in your parent working directory.


    ### Changing the Location of Global Packages


    At the moment, we only have one package installed globally—the `npm` package itself.
    So let’s change that and install [UglifyJS](https://www.npmjs.com/package/uglify-js)
    (a JavaScript minification tool). We use the `--global` flag, but this can be
    abbreviated to `-g`:

