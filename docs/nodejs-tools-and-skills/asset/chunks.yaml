    \n## 3. FeathersJS\n\n![feathers](Images/feathers.png)\n\nIf you detest writing\
    \ repetitive code when building API routes, then Feathers could be the framework\
    \ for you. Feathers is like Express on steroids. With simple commands, you can\
    \ perform the following operations without writing a single line of code:\n\n\
    * generate an API project\n* connect to any database\n* create CRUD API endpoints\n\
    * set up authentication\n* define tests\n\nBoth Express and Fastify are light-weight\
    \ frameworks that allow you to work on simple projects. Feathers is a heavy-weight\
    \ framework that allows you to easily build a database-driven API server using\
    \ its command-line tools. Its code is organized into various types of files:\n\
    \n* Config: database configuration for production, development and testing.\n\
    * Models: schema for a specific database table/collection.\n* Services: API function\
    \ routes can be overridden here, or new ones can be added.\n* Hooks: perform tasks\
    \ based on an event life cyle method—such as `beforeCreate`, `afterCreate`, `beforeUpdate`,\
    \ `afterUpdate`. Useful for transforming data or restricting access to fields\
    \ such as passwords.\n\nOut of the box, Feathers supports real-time communication\
    \ via [Socket.io](https://socket.io/). This means you can build an interface using\
    \ any front-end JavaScript framework that displays results in real time using\
    \ Feathers as a back-end. It would be ideally suited to applications such as chats\
    \ or trading platforms that require real-time capability.\n\nFeathers also features\
    \ a huge [ecosystem of plugins](https://github.com/feathersjs/awesome-feathersjs)\
    \ allowing you to implement many extra features in your project. One of my favorite\
    \ plugins is [feathers-seeder](https://www.npmjs.com/package/feathers-seeder),\
    \ which fills your database with relevant data. This is a very useful feature\
    \ when developing front-end code, ensuring that data is displayed correctly and\
    \ can be paginated.\n\nWhile it’s possible to install Feathers into a project\
    \ as a dependency, it’s easier to use the command-line tool to build an API project\
    \ for you. Here are a few instructions to get you started:\n\n```bash\n# Install\
    \ Feathers CLI\nnpm install -g @feathersjs/cli\n\n# Create a directory for your\
    \ project\nmkdir contacts-api && cd contacts-api\n\n# Generate Feathers Project\
    \ (you'll need to answer some basic questions)\nfeathers generate app\n\n# Create\
    \ Service (choose NeDB for local database, contacts for service, /contacts for\
    \ API route)\nfeathers generate service\n\n# Start the API server\nnpm start\n\
    ```\n\nIf you follow the above commands, you’ll have created a database-driven\
    \ API in just a few clicks. The server should be accessible on `localhost:3030`.\
    \ However, you’ll need to use Postman or Insomnia to interact with the REST API\
    \ like this:\n\n![insomnia-app](Images/create-contact.png)\n\nIf you’d like to\
    \ learn more, start with this [guide to Feathers](https://www.sitepoint.com/feathers-js-guide/),\
    \ which will teach you how to set up a secure, database-driven API. Next, check\
    \ out this [tutorial](https://www.sitepoint.com/crud-app-react-redux-feathersjs/)\
    \ to learn how to connect a React front end with a Feathers back end.\n\n### Feathers\
    \ Links\n\n* [Home page](https://feathersjs.com/)\n* [Documentation](http://docs.feathersjs.com/)\n\
    * [GitHub](https://github.com/feathersjs/feathers)\n* [npm](https://www.npmjs.com/package/@feathersjs/feathers)\n\
    \n## 4. KeystoneJS\n\n![keystone](Images/keystone.png)\n\nKeystoneJS takes the\
    \ ease of building APIs to another level. Straight out of the box, you get first-class\
    \ GraphQL support, an extensible architecture and admin user interface for populating\
    \ your database. Unfortunately, it only supports Mongo and PostgreSQL database,\
    \ so you’ll need to install either before you start a KeystoneJS project. Other\
    \ than that limitation, Keystone comes with a lot of built-in and very useful\
    \ features such as:\n\n* authentication\n* access Control\n* email support\n*\
    \ hooks\n* advanced Field Types\n* and more\n\nKeystoneJS is built on top of Express\
    \ and the Mongoose ODM. Creating a KeystoneJS project can be done using the following\
    \ commands:\n\n```bash\nnpm init keystone-app my-app\n\n✔ What is your project\
    \ name? … keystone-app\n✔ Select a starter project › Todo\n✔ Select an adapter\
    \ › Mongoose\n```\n\nIn the above example, we’ve created a simple database-driven\
    \ API with a `Todo` endpoint. We’ve configured the project to use Mongo and you\
    \ can start it up with the following commands:\n"
