    \ you can see from the output, additional packages are installed. These are UglifyJS’s\
    \ dependencies.\n\n# Listing Global Packages\n\nWe can list the global packages\
    \ we've installed with the `npm list` command:\n\n```\n$ npm list --global\nhome/sitepoint/.node_modules_global/lib\n\
