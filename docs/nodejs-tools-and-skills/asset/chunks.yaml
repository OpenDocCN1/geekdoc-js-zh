  trans: "\nNoSQL 数据库在 Node 开发者中非常流行，其中 MongoDB（MEAN 栈中的“M”）处于领先地位。然而，在启动一个新的 Node\
    \ 项目时，你不应该仅仅将 Mongo 视为默认选择。相反，你选择的数据库类型应该取决于你的项目需求。例如，如果你需要动态创建表或实时插入，那么 NoSQL\
    \ 解决方案是你的之选。另一方面，如果你的项目处理复杂的查询和事务，那么 SQL 数据库会合合理得多。\n\n在本教程中，我们将介绍如何开始使用 [mysql\
    \ 模块](https://github.com/felixge/node-mysql)——这是一个用 JavaScript 编写的 Node.js MySQL\
    \ 客户端。我们将解释如何使用该模块连接 MySQL 数据库并执行常见的 CRUD 操作，然后查看存储过程和用户输入转义。\n\n# 快速上手：如何在 Node\
    \ 中使用 MySQL\n\n如果你来到这里是为了寻找一种快速在 Node 中运行 MySQL 的方法，那么我们已经为你准备好了！\n\n以下是五个简单步骤在\
    \ Node 中使用 MySQL 方法：\n\n1. 创建新项目：`mkdir mysql-test && cd mysql-test`。\n2. 创建 `package.json`\
    \ 文件：`npm init -y`。\n3. 安装 `mysql` 模块：`npm install mysql`。\n4. 创建 `app.js` 文件并复制下面的代码段（根据需要修改占位符）。\n\
    5. 运行文件：`node app.js`。观察到“Connected!”消息。\n\n```\nconst mysql = require('mysql');\n\
    const connection = mysql.createConnection({\n  host: 'localhost',\n  user: 'user',\n\
    \  password: 'password',\n  database: 'database name'\n});\nconnection.connect((err)\
    \ => {\n  if (err) throw err;\n  console.log('Connected!');\n});\n```\n\n# 安装\
    \ mysql 模块\n\n现在，让我们仔细观察这些每一个步骤。\n\n```bash\nmkdir mysql-test\ncd mysql-test\n\
    npm init -y\nnpm install mysql\n```\n\n首先，我们使用命令行创建一个新目录并进入该目录。然后，我们使用命令 `npm\
    \ init -y` 创建一个 `package.json` 文件。`-y` 标志意味着 npm 将使用默认值，而不通过交互式过程。\n\n这一步还假设你的系统中已经安装了\
    \ `Node` 和 `npm`。如果不是如此，请查看这篇 SitePoint 文章以了解如何操作：[使用 nvm 安装多个版本的 Node.js](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)。\n\
    \n之后，我们从 npm 安装 [mysql 模块](https://www.npmjs.com/package/mysql) 并将其保存为项目依赖。项目依赖（与\
    \ `devDependencies` 相对）是运行应用程序所需的包。你可以在[此处阅读更多关于两者之间区别的内容](https://stackoverflow.com/q/22891211)。\n\
    \n如果你在使用 `npm` 时需要进一步帮助，请务必查看[此指南](http://www.sitepoint.com/beginners-guide-node-package-manager/)，或在[我们的论坛](http://community.sitepoint.com/c/javascript)中提问。\n\
    \n# 开始准备\n\n在连接数据库之前，确保你的机器上安装并配置了 MySQL 是重要的。如果不是这样，请参考[官方主页上的安装说明](https://dev.mysql.com/doc/refman/8.0/en/installing.html)。\n\
    \n我们接下来需要做的是创建一个数据库和一个数据库表来工作。你可以使用图形化界面（如 [Adminer](https://www.adminer.org/)）或使用命令行。对于本指南，我们将使用名为\
    \ `sitepoint` 的数据库和名为 `authors` 的表。这里是数据库的转储，以便如果你想跟随操作，可以快速启动：\n\n```sql\nCREATE\
    \ DATABASE sitepoint CHARACTER SET utf8 COLLATE utf8_general_ci;\nUSE sitepoint;\n\
    \nCREATE TABLE authors (\n  id int(11) NOT NULL AUTO_INCREMENT,\n  name varchar(50),\n\
    \  city varchar(50),\n  PRIMARY KEY (id)\n) ENGINE=InnoDB  DEFAULT CHARSET=utf8\
    \ AUTO_INCREMENT=5 ;\n\nINSERT INTO authors (id, name, city) VALUES\n(1, 'Michaela\
    \ Lehr', 'Berlin'),\n(2, 'Michael Wanyoike', 'Nairobi'),\n(3, 'James Hibbard',\
    \ 'Munich'),\n(4, 'Karolina Gawron', 'Wrocław');\n```\n\n![配合 Node.js 使用 MySQL\
    \ 和 mysql JavaScript 客户端](img/adminer.png)\n\n# 连接数据库\n\n现在，我们在 `mysql-test` 目录中创建一个名为\
    \ `app.js` 的文件，看看如何从 Node.js 连接到 MySQL：\n\n```javascript\nconst mysql = require('mysql');\n\
    \n// 首先你需要创建一个到数据库的连接\n// 请确保将 'user' 和 'password' 替换为正确的值\nconst con = mysql.createConnection({\n\
    \  host: 'localhost',\n  user: 'user',\n  password: 'password',\n});\n\ncon.connect((err)\
    \ => {\n  if(err){\n    console.log('Error connecting to Db');\n    return;\n\
    \  }\n  console.log('Connection established');\n});\n\ncon.end((err) => {\n  //\
    \ 连接终止\n});\n```\n\n当你运行 `app.js`（无论是使用 nodemon 直接在终端中输入 `node app.js`）时，你应该能够看到“Connection\
    \ established”消息。\n\n注意我们如何使用 `connect` 方法来建立连接以及使用 `end` 方法来关闭它。\n\n如果你遇到错误，`err`\
    \ 对象将包含细节，我们在回调函数中处理它。\n\n### 使用 nodemon 监听更改\n\n我们可以使用 [nodemon](https://www.npmjs.com/package/)\
    \ 在我们做出更改时自动重启应用程序。这比手动运行命令要方便得多。\n\n```bash\nnpm install --save-dev nodemon\n\
    npx nodemon app.js\n```\n\n# 执行查询\n\n### 读取\n\n现在你已经知道如何从 Node.js 连接到 MySQL，让我们看看如何执行查询。我们首先在\
    \ `createConnection` 中指定数据库名称 (`thepoint`)：\n\n```javascript\nconst con = mysql.createConnection({\n\
    \  host: 'localhost',\n  user: 'user',\n  password: 'password',\n  database: 'point'\n\
    });\n```\n\n连接建立后，我们将使用 `con` 变量对 `authors` 表执行查询：\n\n```javascript\ncon.query('SELECT\
    \ * FROM authors', (err,rows) => {\n  if(err) throw err;\n\n  console.log('Data\
    \ received from Db:');\n  console.log(rows);\n});\n```\n\n当你运行 `app.js` 时，你应该能从数据库返回的数据打印到终端：\n\
    \n```[ RowDataPacket { id: 1, name: 'Michaela Lehr', city: 'Berlin' },\n  RowDataPacket\
    \ { id: 2, name: 'Michael Wanyoike', city: 'Nairobi' },\n  RowDataPacket { id:\
    \ 3, name: 'James Hibbard', city: 'Munich' },\n  RowDataPacket { id: 4, name:\
    \ 'Karolina Gawron', city: 'Wrocław' } ]\n```\n\n从 MySQL 数据库返回的数据可以通过遍历 `rows`\
    \ 对象来解析：\n\n```javascript\nrows.forEach( (row) => {\n  console.log(`${row.name}\
    \ lives in ${row.city}`);\n});\n```\n\n这将给你：\n\n```\nMichaela Lehr lives in Berlin\n\
    Michael Wanyoike lives in Nairobi\nJames Hibbard lives in Munich\nKarolina Gawron\
    \ lives in Wrocław\n```\n\n### 创建\n\n你可以对数据库执行插入查询，如下：\n\n```javascript\nconst\
    \ author = { name: 'Craig Buckler', city: 'Exmouth' };\ncon.query('INSERT INTO\
    \ authors SET ?', author, (err, res) => {\n  if(err) throw err;\n\n  console.log('Last\
    \ insert ID:', res.insertId);\n});\n```\n\n注意我们如何通过回调参数获取获取插入记录的 ID。\n\n### 更新\n\
    \n"
- fmt: "\nSimilarly, when executing an update query, the number of rows affected can\
    \ be retrieved using `result.affectedRows`:\n\n```javascript\ncon.query(\n  'UPDATE\
    \ authors SET city = ? Where ID = ?',\n  ['Leipzig', 3],\n  (err, result) => {\n\
    \    if (err) throw err;\n\n    console.log(`Changed ${result.changedRows} row(s)`);\n\
    \  }\n);\n```\n\n### Destroying\n\nThe same thing goes for a delete query:\n\n\
    ```javascript\ncon.query(\n  'DELETE FROM authors WHERE id = ?', [5], (err, result)\
    \ => {\n    if (err) throw err;\n\n    console.log(`Deleted ${result.affectedRows}\
    \ row(s)`);\n  }\n);\n```\n\n## Advanced Use\n\nWe’ll finish off by looking at\
    \ how the `mysql` module handles stored procedures and the escaping of user input.\n\
    \n### Stored Procedures\n\nPut simply, a stored procedure is prepared SQL code\
    \ that you can save to a database, so that it can easily be reused. If you’re\
    \ in need of a refresher on stored procedures, then check out [this tutorial](https://code.tutsplus.com/articles/an-introduction-to-stored-procedures-in-mysql-5--net-17843).\n\
    \nLet’s create a stored procedure for our `sitepoint` database which fetches all\
    \ the author details. We’ll call it `sp_get_authors`. To do this, you’ll need\
    \ some kind of interface to the database. We’re using [Adminer](https://www.adminer.org/).\
    \ Run the following query against the `sitepoint` database, ensuring that your\
    \ user has admin rights on the MySQL server:\n\n```sql\nDELIMITER $$\n\nCREATE\
    \ PROCEDURE `sp_get_authors`()\nBEGIN\n  SELECT id, name, city FROM authors;\n\
    END $$\n```\n\nThis will create and store the procedure in the `information_schema`\
    \ database in the `ROUTINES` table.\n\n![Creating stored procedure in Adminer](Images/adminer2.png)\n\
    \n### Understanding Delimiter Syntax\n\nIf the delimiter syntax looks strange\
    \ to you, it’s explained [here](http://www.mysqltutorial.org/mysql-stored-procedure/mysql-delimiter/).\n\
    \nNext, establish a connection and use the connection object to call the stored\
    \ procedure as shown:\n\n```javascript\ncon.query('CALL sp_get_authors()',function(err,\
    \ rows){\n  if (err) throw err;\n\n  console.log('Data received from Db:');\n\
    \  console.log(rows);\n});\n```\n\nSave the changes and run the file. Once it’s\
    \ executed, you should be able to view the data returned from the database:\n\n\
    ```javascript\n[ [ RowDataPacket { id: 1, name: 'Michaela Lehr', city: 'Berlin'\
    \ },\n    RowDataPacket { id: 2, name: 'Michael Wanyoike', city: 'Nairobi' },\n\
    \    RowDataPacket { id: 3, name: 'James Hibbard', city: 'Leipzig' },\n    RowDataPacket\
    \ { id: 4, name: 'Karolina Gawron', city: 'Wrocław' },\n  OkPacket {\n    fieldCount:\
    \ 0,\n    affectedRows: 0,\n    insertId: 0,\n    serverStatus: 34,\n    warningCount:\
    \ 0,\n    message: '',\n    protocol41: true,\n    changedRows: 0 } ]\n```\n\n\
    Along with the data, it returns some additional information, such as the affected\
    \ number of rows, `insertId` and so on. You need to iterate over the 0th index\
    \ of the returned data to get employee details separated from the rest of the\
    \ information:\n\n```javascript\nrows[0].forEach( (row) => {\n  console.log(`${row.name}\
    \ lives in ${row.city}`);\n});\n```\n\nThis gives you the following:\n\n```\n\
    Michaela Lehr lives in Berlin\nMichael Wanyoike lives in Nairobi\nJames Hibbard\
    \ lives in Leipzig\nKarolina Gawron lives in Wrocław\n```\n\nNow let’s consider\
    \ a stored procedure which requires an input parameter:\n\n```sql\nDELIMITER $$\n\
    \nCREATE PROCEDURE `sp_get_author_details`(\n  in author_id int\n)\nBEGIN\n  SELECT\
    \ name, city FROM authors where id = author_id;\nEND $$\n```\n\nWe can pass the\
    \ input parameter while making a call to the stored procedure:\n\n```javascript\n\
    con.query('CALL sp_get_author_details(1)', (err, rows) => {\n  if(err) throw err;\n\
    \n  console.log('Data received from Db:\\n');\n  console.log(rows[0]);\n});\n\
    ```\n\nThis gives you the following:\n\n```javascript\n[ RowDataPacket { name:\
    \ 'Michaela Lehr', city: 'Berlin' } ]\n```\n\nMost of the time when we try to\
    \ insert a record into the database, we need the last inserted ID to be returned\
    \ as an out parameter. Consider the following insert stored procedure with an\
    \ out parameter:\n\n```sql\nDELIMITER $$\n\nCREATE PROCEDURE `sp_insert_author`(\n\
    \  out author_id int,\n  in author_name varchar(25),\n  in author_city varchar(25)\n\
    )\nBEGIN\n  insert into authors(name, city)\n  values(author_name, author_city);\n\
    \  set author_id = LAST_INSERT_ID();\nEND $$\n```\n\nTo make a procedure call\
    \ with an out parameter, we first need to enable multiple calls while creating\
    \ the connection. So, modify the connection by setting the multiple statement\
    \ execution to `true`:\n\n```javascript\nconst con = mysql.createConnection({\n\
    \  host: 'localhost',\n  user: 'root',\n  password: 'password',\n  database: 'sitepoint',\n\
    \  multipleStatements: true\n});\n```\n\nNext, when making the call, we set `@author_id`\
    \ and query it:\n\n```javascript\ncon.query('CALL sp_insert_author(@author_id,\
    \ \"Michaela Lehr\", \"Berlin\"); SELECT @author_id', (err, rows) => {\n  if(err)\
    \ throw err;\n\n  console.log('Data received from Db:\\n');\n  console.log(rows[0]);\n\
    });\n```\n\nThis gives you the following:\n\n```javascript\n[ RowDataPacket {\
    \ '@author_id': 1 } ]\n```\n\n## Why Not Just an ORM?\n\nBefore we get into the\
    \ pros and cons of this approach, let’s take a second to look at what ORMs are.\
    \ The following is taken from [an answer on Stack Overflow](https://stackoverflow.com/a/1279678/1136887):\n\
    \n> Object-Relational Mapping (ORM) is a technique that lets you query and manipulate\
    \ data from a database using an object-oriented paradigm. When talking about ORM,\
    \ most people are referring to a library that implements the Object-Relational\
    \ Mapping technique, hence the phrase “an ORM”.\n\nSo this means you write your\
    \ database logic in the domain-specific language of the ORM, as opposed to the\
    \ vanilla approach we’ve been taking so far.\n"
  raw: "Similarly, when executing an update query, the number of rows affected can\
    \ be retrieved using `result.affectedRows`:\n\n```\ncon.query(\n  'UPDATE authors\
    \ SET city = ? Where ID = ?',\n  ['Leipzig', 3],\n  (err, result) => {\n    if\
    \ (err) throw err;\n\n    console.log(`Changed ${result.changedRows} row(s)`);\n\
    \  }\n);\n```\n\n### Destroying\n\nThe same thing goes for a delete query:\n\n\
    ```\ncon.query(\n  'DELETE FROM authors WHERE id = ?', [5], (err, result) => {\n\
    \    if (err) throw err;\n\n    console.log(`Deleted ${result.affectedRows} row(s)`);\n\
    \  }\n);\n```\n\n## Advanced Use\n\nWe’ll finish off by looking at how the mysql\
    \ module handles stored procedures and the escaping of user input.\n\n### Stored\
    \ Procedures\n\nPut simply, a stored procedure is prepared SQL code that you can\
    \ save to a database, so that it can easily be reused. If you’re in need of a\
    \ refresher on stored procedures, then check out [this tutorial](https://code.tutsplus.com/articles/an-introduction-to-stored-procedures-in-mysql-5--net-17843).\n\
    \nLet’s create a stored procedure for our `sitepoint` database which fetches all\
    \ the author details. We’ll call it `sp_get_authors`. To do this, you’ll need\
    \ some kind of interface to the database. We’re using [Adminer](https://www.adminer.org/).\
    \ Run the following query against the `sitepoint` database, ensuring that your\
    \ user has admin rights on the MySQL server:\n\n```\nDELIMITER $$\n\nCREATE PROCEDURE\
    \ `sp_get_authors`()\nBEGIN\n  SELECT id, name, city FROM authors;\nEND $$\n```\n\
    \nThis will create and store the procedure in the `information_schema` database\
    \ in the `ROUTINES` table.\n\n![Creating stored procedure in Adminer](Images/adminer2.png)\n\
    \n#### Understanding Delimiter Syntax\n\nIf the delimiter syntax looks strange\
    \ to you, it’s explained [here](http://www.mysqltutorial.org/mysql-stored-procedure/mysql-delimiter/).\n\
    \nNext, establish a connection and use the connection object to call the stored\
    \ procedure as shown:\n\n```\ncon.query('CALL sp_get_authors()',function(err,\
    \ rows){\n  if (err) throw err;\n\n  console.log('Data received from Db:');\n\
    \  console.log(rows);\n});\n```\n\nSave the changes and run the file. Once it’s\
    \ executed, you should be able to view the data returned from the database:\n\n\
    ```\n[ [ RowDataPacket { id: 1, name: 'Michaela Lehr', city: 'Berlin' },\n   \
    \ RowDataPacket { id: 2, name: 'Michael Wanyoike', city: 'Nairobi' },\n    RowDataPacket\
    \ { id: 3, name: 'James Hibbard', city: 'Leipzig' },\n    RowDataPacket { id:\
    \ 4, name: 'Karolina Gawron', city: 'Wrocław' },\n  OkPacket {\n    fieldCount:\
    \ 0,\n    affectedRows: 0,\n    insertId: 0,\n    serverStatus: 34,\n    warningCount:\
    \ 0,\n    message: '',\n    protocol41: true,\n    changedRows: 0 } ]\n```\n\n\
    Along with the data, it returns some additional information, such as the affected\
    \ number of rows, `insertId` and so on. You need to iterate over the 0th index\
    \ of the returned data to get employee details separated from the rest of the\
    \ information:\n\n```\nrows[0].forEach( (row) => {\n  console.log(`${row.name}\
    \ lives in ${row.city}`);\n});\n```\n\nThis gives you the following:\n\n```\n\
    Michaela Lehr lives in Berlin\nMichael Wanyoike lives in Nairobi\nJames Hibbard\
    \ lives in Leipzig\nKarolina Gawron lives in Wrocław\n```\n\nNow let’s consider\
    \ a stored procedure which requires an input parameter:\n\n```\nDELIMITER $$\n\
    \nCREATE PROCEDURE `sp_get_author_details`(\n  in author_id int\n)\nBEGIN\n  SELECT\
    \ name, city FROM authors where id = author_id;\nEND $$\n```\n\nWe can pass the\
    \ input parameter while making a call to the stored procedure:\n\n```\ncon.query('CALL\
    \ sp_get_author_details(1)', (err, rows) => {\n  if(err) throw err;\n\n  console.log('Data\
    \ received from Db:\\n');\n  console.log(rows[0]);\n});\n```\n\nThis gives you\
    \ the following:\n\n```\n[ RowDataPacket { name: 'Michaela Lehr', city: 'Berlin'\
    \ } ]\n```\n\nMost of the time when we try to insert a record into the database,\
    \ we need the last inserted ID to be returned as an out parameter. Consider the\
    \ following insert stored procedure with an out parameter:\n\n```\nDELIMITER $$\n\
    \nCREATE PROCEDURE `sp_insert_author`(\n  out author_id int,\n  in author_name\
    \ varchar(25),\n  in author_city varchar(25)\n)\nBEGIN\n  insert into authors(name,\
    \ city)\n  values(author_name, author_city);\n  set author_id = LAST_INSERT_ID();\n\
    END $$\n```\n\nTo make a procedure call with an out parameter, we first need to\
    \ enable multiple calls while creating the connection. So, modify the connection\
    \ by setting the multiple statement execution to `true`:\n\n```\nconst con = mysql.createConnection({\n\
    \  host: 'localhost',\n  user: 'user',\n  password: 'password',\n  database: 'sitepoint',\n\
    \  multipleStatements: true\n});\n```\n\nNext, when making a call to the procedure,\
    \ set an out parameter and pass it in:\n\n```\ncon.query(\n  \"SET @author_id\
    \ = 0; CALL sp_insert_author(@author_id, 'Craig Buckler', 'Exmouth'); SELECT @author_id\"\
    ,\n  (err, rows) => {\n    if (err) throw err;\n\n    console.log('Data received\
    \ from Db:\\n');\n    console.log(rows);\n  }\n);\n```\n\nAs seen in the above\
    \ code, we have set an `@author_id` out parameter and passed it while making a\
    \ call to the stored procedure. Once the call has been made we need to select\
    \ the out parameter to access the returned ID.\n\nRun `app.js`. On successful\
    \ execution you should be able to see the selected out parameter along with various\
    \ other information. `rows[2]` should give you access to the selected out parameter:\n\
    \n```\n [ RowDataPacket { '@author_id': 6 } ] ]\n```\n\n#### Deleting a Stored\
    \ Procedure\n\nTo delete a stored procedure you need to run the command `DROP\
    \ PROCEDURE <procedure-name>;` against the database you created it for.\n\n###\
    \ Escaping User Input\n\nIn order to avoid SQL Injection attacks, you should *always*\
    \ escape any data you receive from users before using it inside an SQL query.\
    \ Let’s demonstrate why:\n\n```\nconst userSubmittedVariable = '1';\n\ncon.query(\n\
    \  `SELECT * FROM authors WHERE id = ${userSubmittedVariable}`,\n  (err, rows)\
    \ => {\n    if(err) throw err;\n    console.log(rows);\n  }\n);\n```\n\nThis seems\
    \ harmless enough and even returns the correct result:\n\n```\n { id: 1, name:\
    \ 'Michaela Lehr', city: 'Berlin' }\n```\n\nHowever, try changing the `userSubmittedVariable`\
    \ to this:\n\n```\nconst userSubmittedVariable = '1 OR 1=1';\n```\n\nWe suddenly\
    \ have access to the entire data set. Now change it to this:\n\n```\nconst userSubmittedVariable\
    \ = '1; DROP TABLE authors';\n```\n\nWe’re now in proper trouble!\n\nThe good\
    \ news is that help is at hand. You just have to use the [mysql.escape](https://www.npmjs.com/package/mysql#escaping-query-values)\
    \ method:\n\n```\ncon.query(\n  `SELECT * FROM authors WHERE id = ${mysql.escape(userSubmittedVariable)}`,\n\
    \  (err, rows) => {\n    if(err) throw err;\n    console.log(rows);\n  }\n);\n\
    ```\n\nYou can also use a question mark placeholder, as we did in the examples\
    \ at the beginning of this guide:\n\n```\ncon.query(\n  'SELECT * FROM authors\
    \ WHERE id = ?',\n  [userSubmittedVariable],\n  (err, rows) => {\n    if(err)\
    \ throw err;\n    console.log(rows);\n  }\n);\n```\n\n## Why Not Just USE an ORM?\n\
    \nBefore we get into the pros and cons of this approach, let’s take a second to\
    \ look at what ORMs are. The following is taken from [an answer on Stack Overflow](https://stackoverflow.com/a/1279678/1136887):\n\
    \n> Object-Relational Mapping (ORM) is a technique that lets you query and manipulate\
    \ data from a database using an object-oriented paradigm. When talking about ORM,\
    \ most people are referring to a library that implements the Object-Relational\
    \ Mapping technique, hence the phrase “an ORM”.\n\nSo this means you write your\
    \ database logic in the domain-specific language of the ORM, as opposed to the\
    \ vanilla approach we’ve been taking so far. To give you an idea of what this\
    \ might look like, here’s an example using [Sequelize](http://docs.sequelizejs.com/),\
    \ which queries the database for all authors and logs them to the console:"
