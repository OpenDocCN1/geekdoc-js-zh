    \ => user.id !== id);\n  res.json(data);\n});\n\napp.listen(3000, () => { console.log('Server\
    \ listening at port 3000'); });\n```\n\nSave this code, then start the server\
    \ using `node server.js`. It’s now running on `http://localhost:3000`.\n\n###\
    \ Interacting with the API Using Postman\n\nWe can test that our API does what\
    \ it should using [Postman](https://www.getpostman.com/), an API testing environment.\
    \ Download the correct version for your system, then follow the [instructions\
    \ to get it installed](https://learning.getpostman.com/docs/postman/launching-postman/installation-and-updates/).\n\
    \nWe can start by sending a GET request to `http://localhost:3000/users` to list\
    \ all of our users.\n\nYou should see the following response:\n\n```\n[\n  {\n\
    \    \"id\": 1,\n    \"firstName\": \"Michael\",\n    \"lastName\": \"Wanyoike\"\
    \n  },\n  {\n    \"id\": 2,\n    \"firstName\": \"James\",\n    \"lastName\":\
    \ \"Hibbard\"\n  }\n]\n```\n\n![Postman making a GET request to the \"users\"\
    \ endpoint](Images/postman.png)\n\nAfter that, feel free to experiment. For example,\
    \ if you want to create a user, send a POST request to `http://localhost:3000/users`,\
    \ along with a JSON payload containing the user’s details. You can do this by\
    \ clicking the **Body** tab, then selecting the **raw** radio button and **JSON**\
    \ from the dropdown.\n\nIf you’d like a more in-depth tutorial on using Postman\
    \ to interact with an API, I recommend [Making API Requests with Postman or cURL](https://www.taniarascia.com/making-api-requests-postman-curl/).\n\
    \n### Taking it Further\n\nWith Express, you can connect to any database by installing\
    \ an [adapter](https://expressjs.com/en/guide/database-integration.html) that\
