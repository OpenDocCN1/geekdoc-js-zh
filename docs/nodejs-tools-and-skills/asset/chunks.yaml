    the full list. You can also learn more in our article [10 Tips and Tricks That
    Will Make You an npm Ninja](https://www.sitepoint.com/10-npm-tips-and-tricks/).


    ## npx


    You might also hear talk of `npx` on your travels. Don''t confuse this with `npm`.
    As we’ve learned, `npm` is a tool for *managing* your packages, whereas `npx`
    is a tool for *executing* packages. It comes bundled with `npm` version 5.2+.


    A typical use of `npx` is for executing one-off commands. For example, imagine
    you wanted to spin up a simple HTTP server. You *could* install the [http-server
    package](https://www.npmjs.com/package/http-server) globally on your system, which
    is great if you’ll be using `http-server` on a regular basis. But if you just
    want to test the package, or would like to keep your globally installed modules
    to a minimum, you can change into the directory where you’d like to run it, then
    execute the following command:


    ```

    npx http-server

    ```


    And this will spin up the server without installing anything globally.


    You can [read more about npx here](https://blog.npmjs.org/post/162869356040/introducing-npx-an-npm-package-runner).


    ## Conclusion


    In this tutorial, we’ve covered the basics of working with `npm`. We’ve demonstrated
    how to install Node.js from the project’s download page, how to alter the location
    of global packages (so we can avoid using `sudo`), and how to install packages
    in local and global mode. We also covered deleting, updating and installing a
    certain version of a package, as well as managing a project’s dependencies.


    With every new release, `npm` is making huge strides into the world of front-end
    development. [According to its co-founder](http://frontendhappyhour.com/episodes/npm-install-beer-save-in-mouth/),
    its user base is changing and most of those using it are not using it to write
    Node at all. Rather, it’s becoming a tool that people use to put JavaScript together
    on the front end (seriously, you can use it to install just about anything) and
    one which is becoming an integral part of writing modern JavaScript.


    Are you using `npm` in your projects? If not, now might be a good time to start.


    # Chapter 3: Create New Express.js Apps in Minutes with Express Generator


    ### by Paul Suave and Nilson Jacques


    [Express.js](https://expressjs.com/) is a Node.js web framework that has gained
    immense popularity due to its simplicity. It has easy-to-use routing and simple
    support for view engines, putting it far ahead of the basic Node HTTP server.


    However, starting a new Express application requires a certain amount of boilerplate
    code: starting a new server instance, configuring a view engine, and setting up
    error handling.


    Although there are various starter projects and boilerplates available, Express
    has its own command-line tool that makes it easy to start new apps, called the
    [express-generator](https://expressjs.com/en/starter/generator.html).


    ## What is Express?


    Express has a lot of features built in, and a lot more features you can get from
    other packages that integrate seamlessly, but there are three main things it does
    for you out of the box:


    1. **Routing**. This is how `/home` `/blog` and `/about` all give you different
    pages. Express makes it easy for you to modularize this code by allowing you to
    put different routes in different files.

    2. **Middleware**. If you’re new to the term, basically middleware is “software
    glue”. It accesses requests before your routes get them, allowing them to handle
    hard-to-do stuff like cookie parsing, file uploads, errors, and more.

    3. **Views**. Views are how HTML pages are rendered with custom content. You pass
    in the data you want to be rendered and Express will render it with your given
    view engine.


    ## Getting Started


    The first thing you’ll need is to get Node and `npm` installed on your machine.
    To do this, either head to [the official Node download page](https://nodejs.org/en/download/)
    and grab the correct binaries for your system, or use a version manager such as
    `nvm`. We cover installing Node using a version manager in our quick tip, “[Install
    Multiple Versions of Node.js Using nvm](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)”.


    Starting a new project with the Express generator is as simple as running a few
    commands:


    ```

    npm install express-generator -g

    ```


    This installs the Express generator as a global package, allowing you to run the
    `express` command in your terminal:


    ```

    express myapp

    ```


    This creates a new Express project called `myapp`, which is then placed inside
    of the `myapp` directory:


    ```

    cd myapp

    ```


    If you’re unfamiliar with terminal commands, this one puts you inside of the `myapp`
    directory:


    ```

    npm install

    ```


    If you’re unfamiliar with `npm`, it’s the [default Node.js package manager](https://www.sitepoint.com/beginners-guide-node-package-manager/).
    Running `npm install` installs all dependencies for the project. By default, the
    `express-generator` includes several packages that are commonly used with an Express
    server.


    ### Options


    The generator CLI takes half a dozen [arguments](https://expressjs.com/en/starter/generator.html),
    but the two most useful ones are:


    - `ejs|hbs|jade|pug|twig`

    - `less|stylus|compass|sass`


    Now that we’ve got our project set up we can start the server by running:


    ```

    npm start

    ```


    Then browse to [http://localhost:3000](http://localhost:3000) in your browser.


    ## Application Structure


    The generated Express application starts off with four folders.


    ### `bin`


    The `bin` folder contains the executable file that starts your app. It starts
    the server (on port 3000, if no alternative is supplied) and sets up basic handling.
    You don’t really need to worry about this file, because `npm start` will run it
    for you.


    ### `public`


    The `public` folder is one of the important ones: *everything* in this folder
    is accessible to people. In this folder, you’ll put JavaScript, CSS, images and
    other assets that people need when they load your website.


    ### `routes`


    The `routes` folder is where you’ll put your router files. The generator creates
    two files, `index.js` and `users.js`, which serve as examples of how to separate
    out your application’s route configuration. Usually, you’ll have a different file
    here for each major route on your website. So you might have files called `blog.js`,
    `home.js` and/or `about.js` in this folder.


    ### `views`


    The `views` folder is where you have the files used by your templating engine.
    The generator will configure Express to look in here for a matching view when
    you call the `render` method.


    ## `app.js`


    Outside of these folders, there’s one file that you should know well. The `app.js`
    file is special, because it sets up your Express application and glues all of
    the different parts together. Let’s walk through what it does. Here’s how the
    file starts:


    ```

    var createError = require(''http-errors'');

    var express = require(''express'');

    var path = require(''path'');

    var cookieParser = require(''cookie-parser'');

    var logger = require(''morgan'');

    ```


    These first six lines of the file are required.


    ```

    var indexRouter = require(''./routes/index'');

    var usersRouter = require(''./routes/users'');

    ```

