    ```\n\nRun the file using `node test.js` and you should see `[0, 1, 2, 3, 4]`\
    \ output to the screen.\n\n# Uninstalling Local Packages\n\nnpm is a package manager,\
    \ so it must be able to remove a package. Let’s assume that the current underscore\
    \ package is causing us compatibility problems. We can remove the package and\
    \ install an older version, like so:\n\n```\n$ npm uninstall underscore\nremoved\
    \ 1 package in 0.386s\n\n$ npm list\nproject@1.0.0 /home/sitepoint/project\n└──\
    \ (empty)\n```\n\n# Installing a Specific Version of a Package\n\nWe can now install\
    \ the underscore package in the version we want. We do that by using the `@` sign\
    \ to append a version number:\n\n```\n$ npm install underscore@1.9.1\n+ underscore@1.9.1\n\
    added 1 package in 1.574s\n\n$ npm list\nproject@1.0.0 /home/sitepoint/project\n\
    └── underscore@1.9.1\n```\n\n# Updating a Package\n\nLet’s check if there’s an\
    \ update for the underscore package:\n\n```\n$ npm outdated\nPackage     Current\
    \  Wanted  Latest  Location\nunderscore    1.9.1   1.9.2   1.9.2  project\n```\n\
    \nThe `Current` column shows us the version that is installed locally. The `Latest`\
    \ column tells us the latest version of the package. And the `Wanted` column tells\
    \ us the latest version of the package we can upgrade to without breaking our\
    \ existing code.\n\nRemember the `package-lock.json` file from earlier? Introduced\
    \ in npm v5, the purpose of this file is to ensure that the dependencies remain\
    \ exactly the same on all machines the project is installed on. It’s automatically\
    \ generated for any operations where npm modifies either the `node_modules` folder\
    \ or the `package.json` file.\n\nYou can go ahead and try this out if you like.\
