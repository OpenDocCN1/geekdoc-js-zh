  trans: "\n\n如果你需要为集合中的所有现有文档添加一个额外的字段——例如 `registration`——你可以执行如下操作：\n\n```\n> db.users.updateMany({},\
    \ {$set: { registration: \"incomplete\"}})\n{ \"acknowledged\" : true, \"matchedCount\"\
    \ : 4, \"modifiedCount\" : 4 }\n```\n\n第一个参数是一个空对象，因为我们想要更新集合中的所有文档。`$set` 是一个更新操作符，用于将字段设置为指定的值。你可以使用\
    \ `db.users.find()` 来验证是否已添加了额外字段。\n\n要更新符合特定标准的文档值，`updateMany()` 接受一个过滤对象作为第一个参数。例如，你可能想将所有\
    \ 18 岁及以上用户的 `registration` 值重写为 `complete`。你可以这样操作：\n\n```\n> db.users.updateMany(\n\
    \  {age:{ $gt: 18} },\n  {$set: { registration: \"complete\"}\n})\n\n{ \"acknowledged\"\
    \ : true, \"matchedCount\" : 3, \"modifiedCount\" : 3 }\n```\n\n要更新单个用户的注册详情，你可以这样做：\n\
    \n```\n> db.users.updateOne(\n {email: \"tom@example.com\" },\n {$set: { registration:\
    \ \"complete\"}\n})\n\n{ \"acknowledged\" : true, \"matchedCount\" : 1, \"modifiedCount\"\
    \ : 1 }\n```\n\n### 删除操作\n\n[删除操作](https://docs.mongodb.com/manual/tutorial/remove-documents/)\
    \ 会从集合中移除一个文档。要删除文档，你可以使用 `db.collection.deleteOne(<filter>, <options>)` 方法；要删除多个文档，可以使用\
    \ `db.collection.deleteMany(<filter>, <options>)` 方法。\n\n要根据某些标准删除文档，可以使用我们在读取和更新操作中使用的过滤操作符：\n\
    \n```\n> db.users.updateOne(\n {email: \"tom@example.com\" },\n {$set: { status:\
    \ \"dormant\"}\n})\n\n{ \"acknowledged\" : true, \"matchedCount\" : 1, \"modifiedCount\"\
    \ : 1 }\n\n> db.users.deleteMany( { status: { $in: [ \"dormant\", \"inactive\"\
    \ ] } } )\n\n{ \"acknowledged\" : true, \"deletedCount\" : 1 }\n```\n\n这会删除所有状态为“dormant”（休眠）或“inactive”（不活跃）的文档。\n\
    \n## Schema 验证\n\n在教程早些时候，我说 Mongo 是一个无模式（schema-less）的数据库时，我的说法在某种程度上过于简化。\n\n\
    它是无模式的，体现在我们不需要插入数据之前指定列的数量或类型。然而，我们也可以定义一个 JSON schema 并使用它来对我们的数据执行验证规则。\n\n\
    让我们创建一个 `validatedUsers` 集合，其中我们可以使用 `validator` 构建来指定 `name` 是必填的，并且 `email`\
    \ 字段匹配特定模式：\n\n```\n> db.createCollection(\"validatedUsers\", {\n  validator:\
    \ {\n    $jsonSchema: {\n      required: [ \"name\", \"email\" ],\n      properties:\
    \ {\n        name: {\n          bsonType: \"string\",\n          description:\
    \ \"必须是字符串且为必填\"\n        },\n        email: {\n          bsonType: \"string\"\
    ,\n          pattern: \"^.+\\@.+$\",\n          description: \"必须是有效的邮箱且为必填\"\n\
    \        }\n      }\n    }\n  }\n})\n\n{ \"ok\" : 1 }\n```\n\n现在，如果我们尝试插入错误的数据，将会收到验证错误：\n\
    \n```\n> db.validatedUsers.insertOne({ name: \"Jim\", email: \"not-an-email\"\
    \ })\n\n2020-01-22T09:56:56.918+0100 E  QUERY    &lsqb;js] uncaught exception:\
    \ WriteError({\n  \"index\" : 0,\n  \"code\" : 121,\n  \"errmsg\" : \"Document\
    \ failed validation\",\n  \"op\" : {\n    \"_id\" : ObjectId(\"5e280e5847eb18010666530c\"\
    ),\n    \"name\" : \"Jim\",\n    \"email\" : \"not-an-email\"\n  }\n}) :\nWriteError({\n\
    \  \"index\" : 0,\n  \"code\" : 121,\n  \"errmsg\" : \"Document failed validation\"\
    ,\n  \"op\" : {\n    \"_id\" : ObjectId(\"5e280e5847eb18010666530c\"),\n    \"\
    name\" : \"Jim\",\n    \"email\" : \"not-an-email\"\n  }\n})\nWriteError@src/mongo/shell/bulk_api.js:458:48\n\
    mergeBatchResults@src/mongo/shell/bulk_api.js:855:49\nexecuteBatch@src/mongo/shell/bulk_api.js:919:13\n\
    Bulk/this.execute@src/mongo/shell/bulk_api.js:1163:21\nDBCollection.prototype.insertOne@src/mongo/shell/crud_api.js:264:9\n\
    @(shell):1:1\n```\n\n你可以从项目文档中阅读[更多关于 schema 验证的信息](https://docs.mongodb.com/manual/schema-validation/)。\n\
    \n## 驱动概览\n\n如果你查看 [MongoDB 文档](https://docs.mongodb.com/node/)，你会发现 API 与我们在\
    \ shell 中使用的相似。\n\n### Node.js 驱动\n\nMongoDB 的 Node.js 驱动是 `MongoClient`。要与数据库交互，你需要该驱动。你可以这样安装：\n\
    \n```bash\nnpm install mongodb\n```\n\n下面的示例演示了如何使用它：\n\n```\nconst { MongoClient\
    \ } = require('mongodb');\nconst url = 'mongodb://localhost:27017';\n\n(async\
    \ () => {\n  let client;\n\n  try {\n    client = await MongoClient.connect(url,\
    \ {\n      useNewUrlParser: true,\n      useUnifiedTopology: true\n    });\n\n\
    \    const db = client.db('exampledb');\n    const collection = db.collection('users');\n\
    \    const users = await collection.find().toArray();\n    console.log(users);\n\
    \  } catch (err) {\n    console.log(err.stack);\n  }\n\n  if (client) {\n    await\
    \ client.close();\n  }\n})();\n```\n\n### Mongoose 驱动\n\n另一个流行的 MongoDB Node.js\
    \ 驱动是 [Mongoose](https://mongoosejs.com/index.html)。Mongoose 构建在驱动之上。当 Mongoose\
    \ 发布时，它拥有许多原生驱动不具备的功能。一个显著的功能是可以定义映射到数据库的 schema 结构。然而，最新版本的 MongoDB 已经以 JSON\
    \ schema 和 验证的形式吸收了这些功能。\n\n你可以这样安装 Mongoose：\n\n```bash\nnpm install mongoose\n\
    ```\n\n这是之前示例的 Mongoose 等效实现：\n\n```javascript\nconst mongoose = require('mongoose');\n\
    \nasync function run() {\n  await mongoose.connect('mongodb://localhost:27017/exampledb',\
    \ {\n    useNewUrlParser: true,\n    useUnifiedTopology: true\n  });\n\n  const\
    \ userSchema = new mongoose.Schema({ name: String, age: String, email: String\
    \ });\n  const User = mongoose.model('User', userSchema);\n\n  const users = await\
    \ User.find();\n  console.log(users);\n  mongoose.connection.close();\n}\n\nrun().catch(error\
    \ => console.log(error.stack));\n```\n\n## 结论\n\n在 Mongoose 中，一切都始于 [Schema](https://mongoosejs.com/docs/guide.html)。每个\
    \ schema 映射到一个 MongoDB 集合，并定义该集合内文档的形状。\n\n"
