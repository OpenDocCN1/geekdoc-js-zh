    注意版本号（`v0.35.2`）会随着项目的开发而变化，因此最好检查[项目主页的相关部分](https://github.com/creationix/nvm#install-script)
    以找到最新版本。


    这会将 nvm 仓库克隆到 `~/.nvm`，并对你的 bash 配置文件进行必要的更改，以便你可以在终端的任何地方使用 `nvm`。


    就是这些！重新加载（或重启）你的终端，nvm 即可开始使用。


    ## 使用 nvm


    如果安装正确，`nvm` 命令可以在你终端的任何地方可用。让我们看看如何使用它来管理 Node.js 版本。


    ### 安装多个版本的 Node.js


    nvm 最重要的部分之一当然是安装不同版本的 Node.js。为此，nvm 提供了 `nvm install` 命令。你可以通过运行此命令并跟上你想要版本来安装特定版本。例如：


    ```

    nvm install 12.14.1

    ```


    在终端中运行上述命令，nvm 将安装 Node.js 版本 `12.14.1`。


    #### 运行 `nvm use`


    nvm-windows 用户在安装后必须运行 `nvm use 12.14.1`。


    nvm 遵循 [SemVer](http://semver.org/)，所以如果你想安装最新的 `12.14` 补丁，可以通过运行以下命令来实现：


    ```

    nvm install 12.14

    ```


    nvm 将会安装 Node.js 版本 `12.14.X`，其中 `X` 是可用的最高版本。在编写时，它是 1，因此你的系统上将安装了 `12.14.1`
    版本。


    你可以通过运行以下命令查看可用版本的完整列表：


    ```

    nvm ls-remote

    ```


    对于 nvm-windows，命令是：


    ```

    nvm ls available

    ```


    #### 减少输出


    列出所有可用的 Node 版本产生大量输出。Linux 用户可能喜欢将其传递给 `less` 或使用 `grep` 过滤他们需要的版本。例如，`nvm ls-remote
    | less` 或 `nvm ls-remote | grep v12`。


    ### npm


    在安装 Node.js 实例时，nvm 还会安装一个兼容的 [npm](http://www.sitepoint.com/beginners-guide-node-package-manager/)
    版本。每个 Node 版本可能会带来不同的 npm 版本，你可以运行 `npm -v` 来检查当前正在使用哪一个。全局安装的 npm 包不会在不同的 Node.js
    版本之间共享，因为这可能会导致不兼容。相反，它们与当前 Node 版本一起安装在 `~/.nvm/versions/node/<version>/lib/node_modules`
    中。这有一个额外的优点，用户安装全局包不需要 `sudo` 权限。


    幸运的是，在安装新的 Node.js 版本时，你可以从特定版本重新安装 npm 全局包。例如：


    ```

    nvm install v12.14.1 --reinstall-packages-from=10.18.1

    ```


    运行上述命令，nvm 将安装 Node.js 版本 `12.14.1`、相应的 npm 版本，并重新安装你之前为 `10.18.1` 版本安装的全局 npm
    包。


    如果你不确定最新版本，可以使用 `node` 别名：


    ```

    nvm install node

    ```


    这目前会拉取 `13.6.0` 版本。


    或者你可以安装最新的 [LTS 发布](https://en.wikipedia.org/wiki/Long-term_support)，使用：


    ```

    nvm install --lts

    ```


    这目前会拉取 `12.14.1` 版本。


    你也可以通过运行以下命令卸载任何你认为不再需要的实例：


    ```

    nvm uninstall 13.6.0

    ```


    ### 切换版本


    目前我们看到了如何安装不同的 Node 版本。现在让我们如何在它们之间切换。我首先说明一下，当安装新版本时，它会自动启用。所以如果你安装了最新的 Node.js
    版本并立即运行 `node -v`，你将看到最新版本的输出。


    要切换已安装的版本，nvm 提供了 `nvm use` 命令。它的工作原理与 install 命令类似。因此，你需要跟上版本号或别名。


    切换到 Node.js 版本 `13.6.0`：


    ```

    nvm use 13.6.0

    ```


    切换到 Node.js 版本 `12.14.1`：


    ```

    nvm use 12.14.1

    ```


    切换到最新的 Node.js 版本：


    ```

    nvm use node

    ```


    切换到最新的 LTS 版本：


    ```

    nvm use --lts

    ```


    当切换到不同版本时，nvm 会将你终端中的 `node` 实例链接到正确的 Node.js 实例。


    ### 自定义别名


    你还可以创建 nvm 自带别名之外的自定义别名。例如，通过运行：


    ```

    nvm alias awesome-version 13.6.0

    ```


    你正在为 Node.js 版本 `13.6.0` 设置一个名为“awesome-version”的别名。所以如果你现在运行：


    ```

    nvm use awesome-version

    ```

