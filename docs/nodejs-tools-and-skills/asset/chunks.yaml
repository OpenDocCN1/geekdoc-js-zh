- fmt: "\nThe next two lines of code `require` the different route files that the\
    \ Express generator sets up by default: `routes` and `users`.\n\n```\nvar app\
    \ = express();\n```\n\nAfter that, we create a new app by calling `express()`.\
    \ The `app` variable contains all of the settings and routes for your application.\
    \ This object glues together your application.\n\n```\napp.set('views', path.join(__dirname,\
    \ 'views'));\napp.set('view engine', 'jade');\n```\n\nOnce the `app` instance\
    \ is created, the templating engine is set up for rendering views. This is where\
    \ you’d change the path to your view files if necessary.\n\nAfter this, you’ll\
    \ see Express being configured to use middleware. The generator installs several\
    \ common pieces of middleware that you’re likely to use in a web application:\n\
    \n```\napp.use(logger('dev'));\napp.use(express.json());\napp.use(express.urlencoded({\
    \ extended: false }));\napp.use(cookieParser());\napp.use(express.static(path.join(__dirname,\
    \ 'public')));\n```\n\n- `logger`. When you run your app, you might notice that\
    \ all the routes that are requested are logged to the console. If you want to\
    \ disable this, you can just comment out this middleware.\n- `express.json`. You\
    \ might notice that there are two lines for parsing the body of incoming HTTP\
    \ requests. The first line handles when JSON is sent via a `POST` request and\
    \ it puts this data in `request.body`.\n- `express.urlencoded`. The second line\
    \ parses query string data in the URL (e.g., `/profile?id=5`) and puts this in\
    \ `request.query`.\n- `cookieParser`. This takes all the cookies the client sends\
    \ and puts them in `request.cookies`. It also allows you to modify them before\
    \ sending them back to the client, by changing `response.cookies`.\n- `express.static`.\
    \ This middleware serves static assets from your `public` folder. If you wanted\
    \ to rename or move the public folder, you can change the path here.\n\nNext up\
    \ is the routing:\n\n```\napp.use('/', indexRouter);\napp.use('/users', usersRouter);\n\
    ```\n\nHere, the example route files that were required are attached to our `app`.\
    \ If you need to add additional routes, you’d do it here.\n\nAll the code after\
    \ this is used for error handling. You usually won’t have to modify this code\
    \ unless you want to change the way Express handles errors. By default, it’s set\
    \ up to show the error that occurred in the route when you’re in development mode.\n\
    \n## Bootstrapping a New Project\n\nLet’s apply what we’ve learned so far to kick-start\
    \ a basic Express.js application.\n\nAssuming you’ve already installed `express-generator`\
    \ as a global module, run the following command to create a new skeleton project:\n\
