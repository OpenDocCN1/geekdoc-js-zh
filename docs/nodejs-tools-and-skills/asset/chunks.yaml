    \n## Trademark Notice\n\nRather than indicating every occurrence of a trademarked\
    \ name as such, this book uses the names only in an editorial fashion and to the\
    \ benefit of the trademark owner with no intention of infringement of the trademark.\n\
    \n![SitePoint logo](Images/sitepoint-logo-2012.png)\n\nPublished by SitePoint\
    \ Pty. Ltd.\nLevel 1, 110 Johnston St, Fitzroy\nVIC Australia 3065\nWeb: www.sitepoint.com\n\
    Email: books@sitepoint.com\n\n## About SitePoint\n\nSitePoint specializes in publishing\
    \ fun, practical, and easy-to-understand content for web professionals. Visit\
    \ [http://www.sitepoint.com/](http://www.sitepoint.com/) to access our blogs,\
    \ books, newsletters, articles, and community forums. You’ll find a stack of information\
    \ on JavaScript, PHP, design, and more.\n\n## About Craig Buckler\n\n[Craig](https://craigbuckler.com/)\
    \ is a freelance developer, author, and speaker who never shuts up about the web.\n\
    \nHe started coding in the 1980s when applications had to squeeze into a few kilobytes\
    \ of RAM. His passion for the Web was ignited in the mid 1990s when 28K modems\
    \ were typical and 100KB pages were considered extravagant.\n\nOver the past decade,\
    \ Craig has written 1,200 tutorials for SitePoint as web standards evolved. Despite\
    \ living in a technically wondrous future, he has never forgotten what could be\
    \ achieved with modest resources.\n\n# Preface\n\nWhile there have been quite\
    \ a few attempts to get JavaScript working as a server-side language, Node.js\
    \ (frequently just called Node) has been the first environment that's gained any\
    \ traction. It's now used by companies such as Netflix, Uber and Paypal to power\
    \ their web apps. Node allows for blazingly fast performance; thanks to its event\
    \ loop model, common tasks like network connection and database I/O can be executed\
    \ very quickly indeed.\n\nIn this book, we'll take a look at a selection of the\
    \ related tools and skills that will make you a much more productive Node developer.\n\
    \n## Who Should Read This Book?\n\nThis book is for anyone who wants to start\
    \ learning server-side development with Node.js. Familiarity with JavaScript is\
    \ assumed, but we don't assume any previous back-end development experience.\n\
    \n## Conventions Used\n\n### Code Samples\n\nCode in this book is displayed using\
    \ a fixed-width font, like so:\n\n```\n <h1>A Perfect Summer's Day</h1>\n<p>It\
    \ was a lovely day for a walk in the park.\nThe birds were singing and the kids\
    \ were all back at school.</p> \n```\n\nWhere existing code is required for context,\
    \ rather than repeat all of it, `⋮` will be displayed:\n\n```\n function animate()\
    \ {\n    ⋮\nnew_variable = \"Hello\";\n}\n```\n\nSome lines of code should be\
    \ entered on one line, but we’ve had to wrap them because of page constraints.\
    \ An `➥` indicates a line break that exists for formatting purposes only, and\
    \ should be ignored:\n\n```\n URL.open(\"http://www.sitepoint.com/responsive-web-\n\
    ➥design-real-user-testing/?responsive1\");\n```\n\nYou’ll notice that we’ve used\
    \ certain layout styles throughout this book to signify different types of information.\
    \ Look out for the following items.\n\n### Tips, Notes, and Warnings\n\n#### Hey,\
    \ You!\n\nTips provide helpful little pointers.\n\n#### Ahem, Excuse Me ...\n\n\
    Notes are useful asides that are related—but not critical—to the topic at hand.\
    \ Think of them as extra tidbits of information.\n\n#### Make Sure You Always\
    \ ...\n\n... pay attention to these important points.\n\n#### Watch Out!\n\nWarnings\
    \ highlight any gotchas that are likely to trip you up along the way.\n\n## Supplementary\
    \ Materials\n\n* [https://www.sitepoint.com/community/](https://www.sitepoint.com/community/)\
    \ are SitePoint’s forums, for help on any tricky problems.\n* **books@sitepoint.com**\
    \ is our email address, should you need to contact us to report a problem, or\
    \ for any other reason.\n\n# Chapter 1: Installing Multiple Versions of Node.js\
    \ Using nvm\n\n### by Michael Wanyoike and James Hibbard\n\nWhen working with\
    \ Node.js, you might encounter situations where you need to install multiple versions\
    \ of the runtime.\n\nFor example, maybe you have the latest version of Node set\
    \ up on your machine, yet the project you’re about to start working on requires\
    \ an older version.\n\nWithout a good tool, this would mean spending a lot of\
    \ effort manually uninstalling and reinstalling Node versions. Fortunately, there’s\
    \ a better way!\n\n## Introducing nvm\n\n[nvm](https://github.com/creationix/nvm)\
    \ stands for Node Version Manager. As the name suggests, it helps you manage and\
    \ switch between different Node versions with a single command.\n\n## OS Support\n\
    \nnvm supports both Linux and macOS, but that’s not to say that Windows users\
    \ have to miss out. There’s a second project named [nvm-windows](https://github.com/coreybutler/nvm-windows)\
    \ that offers Windows users the option of easily managing environments. Despite\
    \ the name, nvm-windows is not a clone of nvm, nor is it affiliated with it. However,\
    \ the basic commands listed below (for installing, listing and switching versions)\
    \ should work for both nvm and nvm-windows.\n\n## Installation\n\nLet’s first\
    \ cover installation for Windows, macOS and Linux.\n\n### Windows\n\nFirst, we\
    \ need to do a little preparation:\n\n* uninstall any existing versions of Node.js\n\
    * delete any existing Node.js installation directories (such as `C:\\Program Files\\\
    nodejs`)\n* delete the existing npm install location (such as `C:\\Users\\<user>\\\
    AppData\\Roaming\\npm`)\n\nAfter this, download and run the [latest stable installer](https://github.com/coreybutler/nvm-windows/releases)\
    \ and you should be good to go!\n\n### macOS/Linux\n\nUnlike Windows, removing\
    \ previous Node and npm installations in macOS and Linux is optional. If this\
    \ is something you want to do, there are plenty of good resources online. For\
    \ example, here’s how to remove Node on [macOS](http://stackoverflow.com/q/11177954/113687)\
    \ and on [Linux](http://stackoverflow.com/q/5650169/113687). And here’s how you\
    \ can [remove any previous npm installation](https://docs.npmjs.com/misc/removing-npm)\
    \ you might have.\n\nYou can install nvm using cURL or Wget. On your terminal,\
    \ run the following:\n\nWith [cURL](https://curl.haxx.se/):\n\n```\ncurl -o- https://raw.githubusercontent.com/creationix/nvm/v0.35.2/install.sh\
    \ | bash\n```\n\nOr with [Wget](https://www.gnu.org/software/wget/):\n\n```\n\
    wget -qO- https://raw.githubusercontent.com/creationix/nvm/v0.35.2/install.sh\
    \ | bash\n```\n"
