    \ row(s)`);\n  }\n);\n```\n\n### 删除操作\n\n删除查询也是如此：\n\n```javascript\ncon.query(\n\
    \  'DELETE FROM authors WHERE id = ?', [5], (err, result) => {\n    if (err) throw\
    \ err;\n\n    console.log(`Deleted ${result.affectedRows} row(s)`);\n  }\n);\n\
    ```\n\n## 高级用法\n\n我们最后将看看 `mysql` 模块如何处理存储过程以及用户输入的转义处理。\n\n### 存储过程\n\n简单来说，存储过程是你可以保存到数据库的预备\
    \ SQL 代码，以便可以方便地重用。如果你需要复习存储过程，可以查看[此教程](https://code.tutsplus.com/articles/an-introduction-to-stored-procedures-in-mysql-5--net-17843)。\n\
    \n让我们为我们的 `sitepoint` 数据库创建一个获取所有作者详情的存储过程。将其命名为 `sp_get_authors`。要实现这一点，你需要某种与数据库的接口。我们正在使用\
    \ [Adminer](https://www.adminer.org/)。在 `sitepoint` 数据库上运行以下查询，确保你的用户在 MySQL 服务器上拥有管理员权限：\n\
    \n```sql\nDELIMITER $$\n\nCREATE PROCEDURE `sp_get_authors`()\nBEGIN\n  SELECT\
    \ id, name, city FROM authors;\nEND $$\n```\n\n将在 `information_schema` 数据库的 `ROUTINES`\
    \ 表中创建并存储该过程。\n\n![在 Adminer 中创建存储过程](img/adminer2.png)\n\n### 理解分隔符语法\n\n如果你觉得分隔符语法看起来很奇怪，可以在[这里](http://www.mysqltutorial.org/mysql-stored-procedure/mysql-delimiter/)找到解释。\n\
    \n接下来，建立连接并使用连接对象如所示调用存储过程：\n\n```javascript\ncon.query('CALL sp_get_authors()',function(err,\
