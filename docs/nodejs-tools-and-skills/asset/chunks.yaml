    \ new features such as expressive coding style, hooks and decorators. Let’s break\
    \ down what these features mean.\n\n### Expressive style\n\nIn Fastify, you write\
    \ less code than you normally would in Express. For example, in Express you need\
    \ to import an additional package to handle JSON requests and responses. In Fastify,\
    \ you simply work with object literals and the JSON part is handled automatically\
    \ by the framework.\n\n### Hooks\n\nHooks are special functions that are triggered\
    \ by events. They allow you to interact with Fastify’s life cycle, which includes:\n\
    \n* `onRequest`\n* `preParsing`\n* `preValidation`\n* `preHandler`\n* `preSerialization`\n\
    * `onError`\n* `onSend`\n* `onResponse`\n\nHooks allow you to perform functions\
    \ such as transforming data, performing validation or handling errors. You can\
    \ [read more about hooks in the Fastify documentation](https://www.fastify.io/docs/latest/Hooks/).\n\
    \n### Decorators\n\nDecorators is a feature that allows you to add functionality\
    \ and new properties to a Fastify instance. You can [read more about decorators\
    \ in the Fastify documentation](https://www.fastify.io/docs/latest/Decorators/).\n\
    \nFastify also has an extensive [ecosystem of plugins](https://www.fastify.io/ecosystem/).\
    \ These plugins allow you to connect to a specific database system, perform authentication\
    \ and access third-party services such as Google Cloud Storage. About half are\
    \ official plugins while the rest have been created by the community.\n\n### Fastify\
    \ Links\n\n* [Home page](https://www.fastify.io/)\n* [Documentation](https://www.fastify.io/docs/latest/)\n\
