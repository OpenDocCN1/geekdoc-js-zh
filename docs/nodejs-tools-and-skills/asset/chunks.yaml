  trans: "\n```bash\n# 确保 Mongo 正在运行\nsudo service mongod start\n\n# 启动 Keystone 项目\n\
    cd my-app\nnpm run dev\n```\n\nℹ 命令: `keystone dev`\n✔ 已验证项目入口文件 `./index.js`\n\
    ✔ Keystone 服务器正在监听端口 3000\n✔ 已初始化 Keystone 实例\n✔ 已连接到数据库\n✔ Keystone 实例已就绪：`http://localhost:3000`\
    \ \U0001F680\n\U0001F517 Keystone 管理界面: `http://localhost:3000/admin`\n\U0001F517\
    \ GraphQL Playground: `http://localhost:3000/admin/graphiql`\n\U0001F517 GraphQL\
    \ API: `http://localhost:3000/admin/api` \n\n接下来，你可以访问 `http://localhost:3000/admin`，在那里你可以使用\
    \ UI 创建新的 `Todos`。你也可以访问 GraphQL API `http://localhost:3000/admin/api` 并执行一些查询。例如，要列出所有的\
    \ `todos`，你可以使用查询：\n\n```graphql\nquery {\n  allTodos {\n    id\n    name\n  }\n\
    }\n```\n\n当你按下播放按钮时，它应该显示结果：\n\n```json\n{\n  \"data\": {\n    \"allTodos\": [\n\
    \      {\n        \"id\": \"5e257020db53a03f48782463\",\n        \"name\": \"\
    Write Articles\"\n      },\n      {\n        \"id\": \"5e257033db53a03f48782464\"\
    ,\n        \"name\": \"Eat lunch\"\n      }\n    ]\n  }\n}\n```\n\nGraphQL 相比\
    \ REST 的主要优势在于你可以轻松提取任何需要的数据，而无需定义新的 API 路由。在 REST API 中，如果你想访问通过关系键链接到其他记录的记录，后端人员需要创建一个可以处理连接操作的新\
    \ API 端。而在 GraphQL 中，此类查询是在前端应用中定义的。这让后端开发人员无需添加更多的 API 端，这些端点随着时间的推移可能会变得难以维护。\n\
    \n如果你是 GraphQL 新手，应该查看我们的[教程](https://www.sitepoint.com/tag/graphql/)。要快速确认你的\
    \ `todos` 已保存到 Mongo 数据库，只需执行以下操作：\n\n```bash\n# 打开 mongo 客户端 shell\nmongo\n\n\
    # 列出所有数据库\nshow databases\n\n# 切换到数据库\nuse keystone-app\n\n# 显示 todos\ndb.todos.find()\n\
    \n{ \"_id\" : ObjectId(\"5e257020db53a03f48782463\"), \"name\" : \"Write Articles\"\
    , \"__v\" : 0 }\n{ \"_id\" : ObjectId(\"5e257033db53a03f48782464\"), \"name\"\
    \ : \"Eat lunch\", \"__v\" : 0 }\n```\n\n### Keystone 链接\n\n*   [首页](http://keystonejs.com/)\n\
    *   [文档](https://www.keystonejs.com/quick-start/)\n*   [GitHub](https://github.com/keystonejs/keystone)\n\
    *   [npm](https://www.npmjs.com/package/keystone)\n\n## 5. Strapi\n\n![strapi](img/strapi.png)\n\
    \nStrapi 是目前 Node.js 生态系统中极其强大的框架，你可以用它以所有列出的框架中最少的精力构建 REST API。Strapi 基于 [Koa](https://koajs.com/)，这是一个由\
    \ Express 团队设计的 框架。Koa 被描述为更现代、模块化且轻量级的 Express 框架版本。我之前展示的基准测试显示 Koa 的性能明显优于\
    \ Express。\n\n通过 Strapi，你一个设计良好的网页界面，允许你：\n\n*   连接到任何数据库\n*   根据需要设置尽可能多的集合（表）和复杂关系\n\
    *   定义字段验证规则\n*   设置不同类型的身份验证方法（邮箱、GitHub、Facebook 等）\n*   实现基于角色的访问控制\n\n所有这一切都无需手动编写代码完成。Strapi\
    \ 主要作为一个开源的无头 CMS（内容管理系统）而闻名，它的设计有利于最可能成为你项目终端用户的非技术人员。\n\nStrapi 的主要优势是终端用户可以在不涉及开发人员的情况下更改他们的\
    \ API。他们从项目早期就可以获得一个管理仪表板，用于上传和修改后端数据。这节省了开发人员从一开始创建后端用户界面的工作。如果有 Strapi 无法提供的特定功能，通常可以通过其[市场](https://pipi.io/marketplace)中的插件轻松实现。此外，你可能会发现其他前端框架通过它们自己的插件支持\
    \ Strapi。例如，你可以使用 [gatsby-source-plugin](https://www.npmjs.com/package/gatsby-source-strapi)\
    \ 将 Gatsby 连接到 Strapi 后端。\n\n在编写时，Strapi 目前处于测试阶段。根据你的网络速度和机器配置，安装过程可能需要十分十分。我的建议是安装并使用\
    \ [Yarn](https://yarnpkg.com/lang/en/)，因为它快一点。希望未来的版本将需要更短的时间。要立即开始使用 Strapi，只需执行以下命令：\n\
    \n```bash\n# 基于快速启动模板创建一个新的 strapi 项目\nyarn create strapi-project quickstart\n\
    \n# 启动 Strapi 服务器\nyarn dev\n```\n\n接下来，你可以访问 `http://localhost:3000/admin`，可以使用\
    \ UI 创建新的 `Todos`。你也可以访问 GraphQL API `http://localhost:3000/admin/api` 并执行一些查询。例如，要列出所有\
    \ `todos`，你可以使用此查询：\n\n```graphql\nquery {\n  allTodos {\n    id\n    name\n \
    \ }\n}\n```\n\n当你按下播放按钮时，它应该显示结果：\n\n```json\n{\n  \"data\": {\n    \"allTodos\"\
    : [\n      {\n        \"id\": \"5e257020db53a03f48782463\",\n        \"name\"\
    : \"Write Articles\"\n      },\n      {\n        \"id\": \"5e257033db53a03f48782464\"\
    ,\n        \"name\": \"Eat lunch\"\n      }\n    ]\n  }\n}\n```\n\nGraphQL 相比\
    \ REST 的主要优势在于你可以轻松提取任何需要的数据，而无需定义新的 API 路由。在 REST API 中，如果你想访问通过关系键链接到其他记录的记录，后端人员需要创建一个可以处理连接操作的新\
    \ API 端。而在 GraphQL 中，此类查询是在前端应用中定义的。这让后端开发人员无需添加更多的 API 端，这些端点随着时间的推移可能会变得难以维护。\n\
    \n如果你是 GraphQL 新手，应该查看我们的[教程](https://www.sitepoint.com/tag/graphql/)。要快速确认你的\
    \ `todos` 已保存到 Mongo 数据库，只需执行以下操作：\n\n```bash\n# 打开 mongo 客户端 shell\nmongo\n\n\
    # 列出所有数据库\nshow databases\n\n# 切换到数据库\nuse keystone-app\n\n# 显示 todos\ndb.todos.find()\n\
    \n{ \"_id\" : ObjectId(\"5e257020db53a03f48782463\"), \"name\" : \"Write Articles\"\
    , \"__v\" : 0 }\n{ \"_id\" : ObjectId(\"5e257033db53a03f48782464\"), \"name\"\
    \ : \"Eat lunch\", \"__v\" : 0 }\n```\n\n### Keystone 链接\n\n*   [首页](http://keystonejs.com/)\n\
    *   [文档](https://www.keystonejs.com/quick-start/)\n*   [GitHub](https://github.com/keystonejs/keystone)\n\
    *   [npm](https://www.npmjs.com/package/keystone)\n\n"
- fmt: "\nNoSQL databases are rather popular among Node developers, with MongoDB (the\
    \ “M” in the MEAN stack) leading the pack. When starting a new Node project, however,\
    \ you shouldn’t just accept Mongo as the default choice. Rather, the type of database\
    \ you choose should depend on your project’s requirements. If, for example, you\
    \ need dynamic table creation, or real-time inserts, then a NoSQL solution is\
    \ the way to go. If your project deals with complex queries and transactions,\
    \ on the other hand, an SQL database makes much more sense.\n\nIn this tutorial,\
    \ we’ll have a look at getting started with the [mysql module](https://github.com/felixge/node-mysql)—a\
    \ Node.js client for MySQL, written in JavaScript. We’ll explain how to use the\
    \ module to connect to a MySQL database and perform the usual CRUD operations,\
    \ before looking at stored procedures and escaping user input.\n\n# Quick Start:\
    \ How to Use MySQL in Node\n\nIf you’ve arrived here looking for a quick way to\
    \ get up and running with MySQL in Node, we’ve got you covered!\n\nHere’s how\
    \ to use MySQL in Node in five easy steps:\n\n1. Create a new project: `mkdir\
    \ mysql-test && cd mysql-test`.\n2. Create a `package.json` file: `npm init -y`.\n\
    3. Install the `mysql` module: `npm install mysql`.\n4. Create an `app.js` file\
    \ and copy in the snippet below (editing the placeholders as appropriate).\n5.\
    \ Run the file: `node app.js`. Observe a “Connected!” message.\n\n```\nconst mysql\
    \ = require('mysql');\nconst connection = mysql.createConnection({\n  host: 'localhost',\n\
    \  user: 'user',\n  password: 'password',\n  database: 'database name'\n});\n\
    connection.connect((err) => {\n  if (err) throw err;\n  console.log('Connected!');\n\
    });\n```\n\n# Installing the mysql Module\n\nNow let’s take a closer look at each\
    \ of those steps.\n\n```bash\nmkdir mysql-test\ncd mysql-test\nnpm init -y\nnpm\
    \ install mysql\n```\n\nFirst of all, we’re using the command line to create a\
    \ new directory and navigate to it. Then we’re creating a `package.json` file\
    \ using the command `npm init -y`. The `-y` flag means that npm will use defaults\
    \ without going through an interactive process.\n\nThis step also assumes that\
    \ you have `Node` and `npm` installed on your system. If this is not the case,\
    \ then check out this SitePoint article to find out how to do that: [Install Multiple\
    \ Versions of Node.js using nvm](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/).\n\
    \nAfter that, we’re installing the [mysql module](https://www.npmjs.com/package/mysql)\
    \ from npm and saving it as a project dependency. Project dependencies (as opposed\
    \ to `devDependencies`) are those packages required for the application to run.\
    \ You can read [more about the differences between the two here](https://stackoverflow.com/q/22891211).\n\
    \nIf you need further help using `npm`, then be sure to check out [this guide](http://www.sitepoint.com/beginners-guide-node-package-manager/),\
    \ or ask in [our forums](http://community.sitepoint.com/c/javascript).\n\n# Getting\
    \ Started\n\nBefore we get on to connecting to a database, it’s important that\
    \ you have MySQL installed and configured on your machine. If this is not the\
    \ case, please consult the [installation instructions on their home page](https://dev.mysql.com/doc/refman/8.0/en/installing.html).\n\
    \nThe next thing we need to do is to create a database and a database table to\
    \ work with. You can do this using a graphical interface, such as [Adminer](https://www.adminer.org/),\
    \ or using the command line. For this guide, we’ll be using a database called\
    \ `sitepoint` and a table called `authors`. Here’s a dump of the database, so\
    \ that you can get up and running quickly if you wish to follow along:\n\n```sql\n\
    CREATE DATABASE sitepoint CHARACTER SET utf8 COLLATE utf8_general_ci;\nUSE sitepoint;\n\
    \nCREATE TABLE authors (\n  id int(11) NOT NULL AUTO_INCREMENT,\n  name varchar(50),\n\
    \  city varchar(50),\n  PRIMARY KEY (id)\n) ENGINE=InnoDB  DEFAULT CHARSET=utf8\
    \ AUTO_INCREMENT=5 ;\n\nINSERT INTO authors (id, name, city) VALUES\n(1, 'Michaela\
    \ Lehr', 'Berlin'),\n(2, 'Michael Wanyoike', 'Nairobi'),\n(3, 'James Hibbard',\
    \ 'Munich'),\n(4, 'Karolina Gawron', 'Wrocław');\n```\n\n![Using MySQL with Node.js\
    \ & the mysql JavaScript Client](Images/adminer.png)\n\n# Connecting to the Database\n\
    \nNow, let’s create a file called `app.js` in our `mysql-test` directory and see\
    \ how to connect to MySQL from Node.js:\n\n```javascript\nconst mysql = require('mysql');\n\
    \n// First you need to create a connection to the database\n// Be sure to replace\
    \ 'user' and 'password' with the correct values\nconst con = mysql.createConnection({\n\
    \  host: 'localhost',\n  user: 'user',\n  password: 'password',\n});\n\ncon.connect((err)\
    \ => {\n  if(err){\n    console.log('Error connecting to Db');\n    return;\n\
    \  }\n  console.log('Connection established');\n});\n\ncon.end((err) => {\n  //\
    \ Connection is terminated\n});\n```\n\nWhen you run `app.js` (either using nodemon\
    \ or by typing `node app.js` into your terminal), you should be able to see the\
    \ “Connection established” message.\n\nNote how we use the `connect` method to\
    \ establish the connection and the `end` method to close it.\n\nIf you encounter\
    \ an error, the `err` object will contain details, which we handle in the callback.\n\
    \n### Using nodemon to Watch Changes\n\nWe can use [nodemon](https://www.npmjs.com/package/)\
    \ to automatically restart our app when we make changes. This is much more convenient\
    \ than running the command manually.\n\n```bash\nnpm install --save-dev nodemon\n\
    npx nodemon app.js\n```\n\n# Executing Queries\n\n### Reading\n\nNow that you\
    \ know how to establish a connection to MySQL from Node.js, let’s see how to execute\
    \ queries. We’ll start by specifying the database name (` thepoint`) in `createjavascript:\n\
    \n```javascript\nconstconst = mysql mysqlcreateConnection({\n  host: 'localhostlocalhost\n\
    \  user ' '',',\n  password ' 'password\n\n  database ' 'point'\n\n\n\n\n\n\n\n\
    \ the connection is established, we’ll the `con` variable to execute a query against\
    \ the database table `authors`:\n\n```javascript\ncon.query('SELECT * FROM authors',\
    \ (err,rows) => {\n  if(err) throw err;\n\n  console.log('Data received from Db:');\n\
    \  console.log(rows);\n});\n```\n\nWhen you run `app.js`, you should be able to\
    \ see the data returned from the database logged to the terminal:\n\n```[ RowDataPacket\
    \ { id: 1, name: 'Michaela Lehr', city: 'Berlin' },\n  RowDataPacket { id: 2,\
    \ name: 'Michael Wanyoike', city: 'Nairobi' },\n  RowDataPacket { id: 3, name:\
    \ 'James Hibbard', city: 'Munich' },\n  RowDataPacket { id: 4, name: 'Karolina\
    \ Gawron', city: 'Wrocław' } ]\n```\n\nData returned from the MySQL database can\
    \ be parsed by simply looping over the `rows` object:\n\n```javascript\nrows.forEach(\
    \ (row) => {\n  console.log(`${row.name} lives in ${row.city}`);\n});\n```\n\n\
    This gives you the following:\n\n```\nMichaela Lehr lives in Berlin\nMichael Wanyoike\
    \ lives in Nairobi\nJames Hibbard lives in Munich\nKarolina Gawron lives in Wrocław\n\
    ```\n\n### Creating\n\nYou can execute an insert query against a database, like\
    \ so:\n\n```javascript\nconst author = { name: 'Craig Buckler', city: 'Exmouth'\
    \ };\ncon.query('INSERT INTO authors SET ?', author, (err, res) => {\n  if(err)\
    \ throw err;\n\n  console.log('Last insert ID:', res.insertId);\n});\n```\n\n\
    Note how we can get the ID of the inserted record using the callback parameter.\n\
    \n### Updating\n"
  raw: "NoSQL databases are rather popular among Node developers, with MongoDB (the\
    \ “M” in the MEAN stack) leading the pack. When starting a new Node project, however,\
    \ you shouldn’t just accept Mongo as the default choice. Rather, the type of database\
    \ you choose should depend on your project’s requirements. If, for example, you\
    \ need dynamic table creation, or real-time inserts, then a NoSQL solution is\
    \ the way to go. If your project deals with complex queries and transactions,\
    \ on the other hand, an SQL database makes much more sense.\n\nIn this tutorial,\
    \ we’ll have a look at getting started with the [mysql module](https://github.com/felixge/node-mysql)—a\
    \ Node.js client for MySQL, written in JavaScript. We’ll explain how to use the\
    \ module to connect to a MySQL database and perform the usual CRUD operations,\
    \ before looking at stored procedures and escaping user input.\n\n## Quick Start:\
    \ How to Use MySQL in Node\n\nIf you’ve arrived here looking for a quick way to\
    \ get up and running with MySQL in Node, we’ve got you covered!\n\nHere’s how\
    \ to use MySQL in Node in five easy steps:\n\n1.  Create a new project: `mkdir\
    \ mysql-test && cd mysql-test`.\n\n2.  Create a `package.json` file: `npm init\
    \ -y`.\n\n3.  Install the mysql module: `npm install mysql`.\n\n4.  Create an\
    \ `app.js` file and copy in the snippet below (editing the placeholders as appropriate).\n\
    \n5.  Run the file: `node app.js`. Observe a “Connected!” message.\n\n```\nconst\
    \ mysql = require('mysql');\nconst connection = mysql.createConnection({\n  host:\
    \ 'localhost',\n  user: 'user',\n  password: 'password',\n  database: 'database\
    \ name'\n});\nconnection.connect((err) => {\n  if (err) throw err;\n  console.log('Connected!');\n\
    });\n```\n\n## Installing the mysql Module\n\nNow let’s take a closer look at\
    \ each of those steps.\n\n```\nmkdir mysql-test\ncd mysql-test\nnpm init -y\n\
    npm install mysql\n```\n\nFirst of all, we’re using the command line to create\
    \ a new directory and navigate to it. Then we’re creating a `package.json` file\
    \ using the command `npm init -y`. The `-y` flag means that npm will use defaults\
    \ without going through an interactive process.\n\nThis step also assumes that\
    \ you have Node and npm installed on your system. If this is not the case, then\
    \ check out this SitePoint article to find out how to do that: [Install Multiple\
    \ Versions of Node.js using nvm](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/).\n\
    \nAfter that, we’re installing the [mysql module](https://www.npmjs.com/package/mysql)\
    \ from npm and saving it as a project dependency. Project dependencies (as opposed\
    \ to devDependencies) are those packages required for the application to run.\
    \ You can read [more about the differences between the two here](https://stackoverflow.com/q/22891211).\n\
    \nIf you need further help using npm, then be sure to check out [this guide](http://www.sitepoint.com/beginners-guide-node-package-manager/),\
    \ or ask in [our forums](http://community.sitepoint.com/c/javascript).\n\n## Getting\
    \ Started\n\nBefore we get on to connecting to a database, it’s important that\
    \ you have MySQL installed and configured on your machine. If this is not the\
    \ case, please consult the [installation instructions on their home page](https://dev.mysql.com/doc/refman/8.0/en/installing.html).\n\
    \nThe next thing we need to do is to create a database and a database table to\
    \ work with. You can do this using a graphical interface, such as [Adminer](https://www.adminer.org/),\
    \ or using the command line. For this guide, we’ll be using a database called\
    \ `sitepoint` and a table called `authors`. Here’s a dump of the database, so\
    \ that you can get up and running quickly if you wish to follow along:\n\n```\n\
    CREATE DATABASE sitepoint CHARACTER SET utf8 COLLATE utf8_general_ci;\nUSE sitepoint;\n\
    \nCREATE TABLE authors (\n  id int(11) NOT NULL AUTO_INCREMENT,\n  name varchar(50),\n\
    \  city varchar(50),\n  PRIMARY KEY (id)\n) ENGINE=InnoDB  DEFAULT CHARSET=utf8\
    \ AUTO_INCREMENT=5 ;\n\nINSERT INTO authors (id, name, city) VALUES\n(1, 'Michaela\
    \ Lehr', 'Berlin'),\n(2, 'Michael Wanyoike', 'Nairobi'),\n(3, 'James Hibbard',\
    \ 'Munich'),\n(4, 'Karolina Gawron', 'Wrocław');\n```\n\n![Using MySQL with Node.js\
    \ & the mysql JavaScript Client](Images/adminer.png)\n\n## Connecting to the Database\n\
    \nNow, let’s create a file called `app.js` in our `mysql-test` directory and see\
    \ how to connect to MySQL from Node.js:\n\n```\nconst mysql = require('mysql');\n\
    \n// First you need to create a connection to the database\n// Be sure to replace\
    \ 'user' and 'password' with the correct values\nconst con = mysql.createConnection({\n\
    \  host: 'localhost',\n  user: 'user',\n  password: 'password',\n});\n\ncon.connect((err)\
    \ => {\n  if(err){\n    console.log('Error connecting to Db');\n    return;\n\
    \  }\n  console.log('Connection established');\n});\n\ncon.end((err) => {\n  //\
    \ The connection is terminated gracefully\n  // Ensures all remaining queries\
    \ are executed\n  // Then sends a quit packet to the MySQL server.\n});\n```\n\
    \nNow open up a terminal and enter `node app.js`. Once the connection is successfully\
    \ established you should be able to see the “Connection established” message in\
    \ the console. If something goes wrong (for example, you enter the wrong password),\
    \ a callback is fired, which is passed an instance of the JavaScript Error object\
    \ (`err`). Try logging this to the console to see what additional useful information\
    \ it contains.\n\n### Using nodemon to Watch the Files for Changes\n\nRunning\
    \ `node app.js` by hand every time we make a change to our code is going to get\
    \ a bit tedious, so let’s automate that. This part isn’t necessary to follow along\
    \ with the rest of the tutorial, but will certainly save you some keystrokes.\n\
    \nLet’s start off by installing a the [nodemon](https://nodemon.io/) package.\
    \ This is a tool that automatically restarts a Node application when file changes\
    \ in a directory are detected:\n\n```\nnpm install --save-dev nodemon\n```\n\n\
    Now run `./node_modules/.bin/nodemon app.js` and make a change to `app.js`. nodemon\
    \ should detect the change and restart the app.\n\n#### Running nodemon\n\nWe’re\
    \ running nodemon straight from the `node_modules` folder. You could also install\
    \ it globally, or create an npm script to kick it off.\n\n## Executing Queries\n\
    \n### Reading\n\nNow that you know how to establish a connection to a MySQL database\
    \ from Node.js, let’s see how to execute SQL queries. We’ll start by specifying\
    \ the database name (`sitepoint`) in the `createConnection` command:\n\n```\n\
    const con = mysql.createConnection({\n  host: 'localhost',\n  user: 'user',\n\
    \  password: 'password',\n  database: 'sitepoint'\n});\n```\n\nOnce the connection\
    \ is established, we’ll use the `con` variable to execute a query against the\
    \ database table `authors`:\n\n```\ncon.query('SELECT * FROM authors', (err,rows)\
    \ => {\n  if(err) throw err;\n\n  console.log('Data received from Db:');\n  console.log(rows);\n\
    });\n```\n\nWhen you run `app.js` (either using nodemon or by typing `node app.js`\
    \ into your terminal), you should be able to see the data returned from the database\
    \ logged to the terminal:\n\n```\n[ RowDataPacket { id: 1, name: 'Michaela Lehr',\
    \ city: 'Berlin' },\n  RowDataPacket { id: 2, name: 'Michael Wanyoike', city:\
    \ 'Nairobi' },\n  RowDataPacket { id: 3, name: 'James Hibbard', city: 'Munich'\
    \ },\n  RowDataPacket { id: 4, name: 'Karolina Gawron', city: 'Wrocław' } ]\n\
    ```\n\nData returned from the MySQL database can be parsed by simply looping over\
    \ the `rows` object:\n\n```\nrows.forEach( (row) => {\n  console.log(`${row.name}\
    \ lives in ${row.city}`);\n});\n```\n\nThis gives you the following:\n\n```\n\
    Michaela Lehr lives in Berlin\nMichael Wanyoike lives in Nairobi\nJames Hibbard\
    \ lives in Munich\nKarolina Gawron lives in Wrocław\n```\n\n### Creating\n\nYou\
    \ can execute an insert query against a database, like so:\n\n```\nconst author\
    \ = { name: 'Craig Buckler', city: 'Exmouth' };\ncon.query('INSERT INTO authors\
    \ SET ?', author, (err, res) => {\n  if(err) throw err;\n\n  console.log('Last\
    \ insert ID:', res.insertId);\n});\n```\n\nNote how we can get the ID of the inserted\
    \ record using the callback parameter.\n\n### Updating"
