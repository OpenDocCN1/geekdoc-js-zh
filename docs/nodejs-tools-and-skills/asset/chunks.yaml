- fmt: "\nNote that the version number (`v0.35.2`) will change as the project develops,\
    \ so it’s worth checking the [relevant section of project’s home page](https://github.com/creationix/nvm#install-script)\
    \ to find the most recent version.\n\nThis will clone the nvm repository to `~/.nvm`\
    \ and will make the required changes to your bash profile, so that `nvm` is available\
    \ from anywhere in your terminal.\n\nAnd that’s it! Reload (or restart) your terminal\
    \ and nvm is ready to be used.\n\n## Using nvm\n\nIf installed correctly, the\
    \ `nvm` command is available anywhere in you terminal. Let’s see how to use it\
    \ to manage Node.js versions.\n\n### Install Multiple Versions of Node.js\n\n\
    One of the most important parts of nvm is, of course, installing different versions\
    \ of Node.js. For this, nvm provides the `nvm install` command. You can install\
    \ specific versions by running this command followed by the version you want.\
    \ For example:\n\n```\nnvm install 12.14.1\n```\n\nBy running the above in a terminal,\
    \ nvm will install Node.js version `12.14.1`.\n\n#### Running `nvm use`\n\nnvm-windows\
    \ users will have to run `nvm use 12.14.1` after installing.\n\nnvm follows [SemVer](http://semver.org/),\
    \ so if you want to install, for example, the latest `12.14` patch, you can do\
    \ it by running:\n\n```\nnvm install 12.14\n```\n\nnvm will then install Node.js\
    \ version `12.14.X`, where `X` is the highest available version. At the time of\
    \ writing, this is 1, so you’ll have the `12.14.1` version installed on your system.\n\
    \nYou can see the full list of available versions by running:\n\n```\nnvm ls-remote\n\
    ```\n\nFor nvm-windows, this is:\n\n```\nnvm ls available\n```\n\n#### Reducing\
    \ Output\n\nListing all available Node versions produces a lot of output. Linux\
    \ users might like to qpipe that to `less` or `grep` the version they’re after.\
    \ For example, `nvm ls-remote | less`, or `nvm ls-remote | grep v12`.\n\n### npm\n\
    \nWhen installing a Node.js instance, nvm will also install a compatible [npm](http://www.sitepoint.com/beginners-guide-node-package-manager/)\
    \ version. Each Node version might bring a different npm version, and you can\
    \ run `npm -v` to check which one you’re currently using. Globally installed npm\
    \ packages aren’t shared among different Node.js versions, as this could cause\
    \ incompatibilities. Rather, they’re installed alongside the current Node version\
    \ in `~/.nvm/versions/node/<version>/lib/node_modules`. This has the added advantage\
    \ that users won’t require `sudo` privileges to install global packages.\n\nFortunately,\
    \ when installing a new Node.js version, you can reinstall the npm global packages\
    \ from a specific version. For example:\n\n```\nnvm install v12.14.1 --reinstall-packages-from=10.18.1\n\
    ```\n\nBy running the above, nvm will install Node.js version `12.14.1`, the corresponding\
    \ npm version, and reinstall the global npm packages you had installed for the\
    \ `10.18.1` version.\n\nIf you’re not sure what the latest version is, you can\
    \ use the `node` alias:\n\n```\nnvm install node\n```\n\nThis will currently pull\
    \ in version `13.6.0`.\n\nOr you can install the most recent [LTS release](https://en.wikipedia.org/wiki/Long-term_support),\
    \ using:\n\n```\nnvm install --lts\n```\n\nThis will currently pull in version\
    \ `12.14.1`.\n\nYou can also uninstall any instance you no longer think is useful,\
    \ by running:\n\n```\nnvm uninstall 13.6.0\n```\n\n### Switching Between Versions\n\
    \nSo far, we’ve seen how to install different Node versions. Now let’s go through\
    \ how to switch between them. Let me first note that when a new version is installed,\
    \ it’s automatically put to use. So if you install the latest Node.js version,\
    \ and run `node -v` right after, you’ll see the latest version output.\n\nTo switch\
    \ through installed versions, nvm provides the `nvm use` command. This works similarly\
    \ to the install command. So, you need to follow this by a version number or an\
    \ alias.\n\nSwitch to Node.js version `13.6.0`:\n\n```\nnvm use 13.6.0\n```\n\n\
    Switch to Node.js version `12.14.1`:\n\n```\nnvm use 12.14.1\n```\n\nSwitch to\
    \ the latest Node.js version:\n\n```\nnvm use node\n```\n\nSwitch to the latest\
    \ LTS version:\n\n```\nnvm use --lts\n```\n\nWhen switching to a different version,\
    \ nvm will make the `node` instance in your terminal symlink to the proper Node.js\
    \ instance.\n\n### Custom Aliases\n\nYou can also create custom aliases beyond\
    \ the ones that come with nvm. For example, by running:\n\n```\nnvm alias awesome-version\
    \ 13.6.0\n```\n\nYou’re setting an alias with the name “awesome-version” for Node.js\
