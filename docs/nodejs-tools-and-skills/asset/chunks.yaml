  trans: "\n\n```javascript\nconst sequelize = new Sequelize('sitepoint', 'user',\
    \ 'password', {\n  host: 'localhost',\n  dialect: 'mysql'\n});\n\nconst Author\
    \ = sequelize.define('author', {\n  name: {\n    type: Sequelize.STRING,\n  },\n\
    \  city: {\n    type: Sequelize.STRING\n  },\n}, {\n  timestamps: false\n});\n\
    \nAuthor.findAll().then(authors => {\n  console.log(\"All authors:\", JSON.stringify(authors,\
    \ null, 4));\n});\n```\n\n使用 ORM 对你来说是否有意义，很大程度上取决于你正在处理的内容以及与谁合作。一方面，ORM 往往能提高开发者的效率，部分原因在于它抽象了大部分\
    \ `SQL` 代码，使得团队中的并非每个人都需要知道如何编写极其高效的特定数据库的查询。此外，切换到不同的数据库软件也很容易，因为你是在针对一个抽象层进行开发。\n\
    \n然而，由于不了解 ORM 的工作原理，可能会写出一些非常混乱且低效的 `SQL`。性能也是一个问题，因为优化不需要经过 ORM 的查询要容易得多。\n\n\
    无论你选择哪条路径都取决于你个人，但如果你正在考虑做这一决定，请查看这个 Stack Overflow 贴子：[为什么你应该使用 ORM？](https://stackoverflow.com/q/448684/1136887)。同时请查看\
    \ SitePoint 这篇文章：[你可能不知道的 3 个 JavaScript ORM](https://www.sitepoint.com/3-javascript-orms-you-might-not-know/)。\n\
    \n## 结论\n\n在本教程中，我们为 Node.js 安装了 [mysql 客户端](https://github.com/mysqljs/mysql)\
    \ 并配置了它连接数据库。我们还学习了如何执行 CRUD 操作、使用预处理语句以及转义用户输入以缓解 `SQL` 注入攻击。尽管如此，我们仅仅接触了 `mysql`\
    \ 客户端提供的功能的冰角。如需更详细的信息，我们建议阅读[官方文档](https://github.com/mysqljs/mysql)。\n\n请记住，`mysql`\
    \ 模块并不是唯一的选择。还有其他选项，例如流行的 [node-mysql2](https://github.com/sidorares/node-mysql2)。\n\
    \n# 第 7 章：MongoDB 简介\n\n#### 作者 Manjunath M. 和 James Hibbard\n\nMongoDB 是一个跨平台、开源的\
    \ NoSQL 数据库，被许多现代 Node 基础应用程序用于持久化数据。\n\n在这个适合初学者的教程中，我将演示如何安装 Mongo，然后开始使用它来存储和查询数据。我还将查看如何在\
    \ Node 程序内部与 Mongo 数据库交互，并在此强调 Mongo 与传统关系型数据库（如 `MySQL`）之间区别。\n\n## 术语和基础概念\n\
    \nMongoDB 是一个面向文档的数据库。这意味着它不使用表和行来存储数据，而是使用类似 JSON 的 `documents` 集合`collections`）。这些\
    \ `documents` 支持嵌入字段，因此相关数据可以存储在其中。\n\nMongoDB 也是一个无模式（schema-less）数据库，因此我们在插入数据之前不需要指定列的数量或类型。\n\
    \n以下是一个 MongoDB 文档的示例：\n\n```\n{\n  _id: ObjectId(3da252d3902a),\n  type: \"Tutorial\"\
    ,\n  title: \"An Introduction to MongoDB\",\n  author: \"Manjunath M\",\n  tags:\
    \ [ \"mongodb\", \"compass\", \"crud\" ],\n  categories: [\n    {\n      name:\
    \ \"javascript\",\n      description: \"Tutorialss on client-side and server-side\
    \ JavaScript programming\"\n    },\n    {\n      name: \"databases\",\n      description:\
    \ \"Tutorialss on different kinds of databases and their management\"\n    },\n\
    \  ],\n  content: \"MongoDB is a cross-platform, open-source, NoSQL database...\"\
    \n}\n```\n\n你可以看到，文档有许多 `fields`（`type`、`title` 等），它们存储了 `values`（“Tutorial”、“An\
    \ Introduction to MongoDB”等）。这些 `values` 可以包含字符串、数字、数组、子文档数组（例如 `categories` 字段）、地理坐标等。\n\
    \n`_id` 字段名预留作主键使用。它的值在集合中必须是唯一的，它是不可变的，并且可以是数组以外的任何类型。\n\n### 类 JSON？\n\n对于那些好奇“类\
    \ JSON”意味着什么的人，Mongo 内部使用一种名为 [BSON](http://bsonspec.org/) 的东西（二进制 JSON 的缩写）。在实践中，当你使用\
    \ MongoDB 时，你并不需要了解太多 BSON 的知识。\n\n正如你可能猜到的，NoSQL 数据库中的 `document` 对应 SQL 数据库中的\
    \ `row`。一组文档合称为 `collection`（集合），大致等同于关系型数据库中的 `table`（表）。\n\n下面是总结不同术语的表格：\n\n\
    | SQL Server | MongoDB |\n| --- | --- |\n| Database | Database |\n| Table | Collection\
    \ |\n| Row | Document |\n| Column | Field |\n| Index | Index |\n\n如果你正在启动新项目，并且不确定选择\
    \ Mongo 还是像 `MySQL` 这样的关系型数据库，现在可能是阅读我们 [SQL vs NoSQL：如何选择](https://www.sitepoint.com/sql-vs-nosql-how-choose/)教程的好时机。\n\
    \n如此，让我们开始安装 MongoDB。\n\n## 安装 MongoDB\n\n### 在线沙箱\n\n如果你只想在不在 PC 上安装软件的情况下跟随教程，有一些在线服务可以使用。例如\
    \ [Mongo playground](https://mongoplayground.net/) 是一个测试和共享查询的简单沙盒。\n\nMongoDB\
    \ 有多个版本。我们感兴趣的是社区版。\n\n项目主页提供了关于安装 Mongo 的优秀文档，我在这里不再重复。相反，我为你提供各个操作系统的链接：\n\n\
    * [在 Windows 上安装 MongoDB](https://docs.mongodb.com/manual/tutorial/install-mongodb-windows/)\n\
    * [在 macOS 上安装 MongoDB](https://docs.mongodb.com/manual/tutorial/install-mongodb-os-x/)\n\
    * [在 Ubuntu 上安装 MongoDB](https://docs.mongodb.com/manual/tutorial/install-mongodb-ubuntu/)\n\
    \n如果你使用的是非 Ubuntu 版本的 Linux，可以查看[此页面](https://docs.mongodb.com/manual/installation-tutorials)安装说明。MongoDB\
    \ 通常通过官方渠道获取。\n\n### 安装后配置\n\n在系统中安装 MongoDB 后，你可能会遇到此错误：\n\n```\ndbpath (/data/db)\
    \ does not exist. Create this directory or give existing directory in --dbpath.\
    \ See http://dochub.mongodb.org/core/startingmongo\n```\n\n这意味着 Mongo 无法找到或访问存储数据库的目录。这很容易解决：\n\
    \n```\nsudo mkdir -p /data/db\nsudo chown -R `id -un` /data/db\n```\n\n第一个命令创建\
    \ `data/db` 目录。第二个命令为该目录设置权限以便 Mongo 写入。\n\n### 安装 Compass GUI\n\n我们在教程中将命令行，但\
    \ MongoDB 还提供了一个名为 Compass 的工具，通过图形界面连接并管理数据库。\n\n如果你在 Windows 上，Compass 可以作为\
    \ MongoDB 主程序的一部分安装（只需在向导中选择相应选项）。否则，你可以[在此下载适用于相应系统的 Compass](https://docs.mongodb.com/compass/install/)。\n\
    \n它是这样的：\n\n![Mongo DB Compass GUI](img/MongoDB-Compass.png)\n\n### Mongo Shell\n\
    \n我们可以通过打开 Mongo Shell 来测试安装。你可以通过打开终端窗口并输入 `mongo` 来实现。\n\n#### 检查路径\n\n这假设 `<mongodb\
    \ installation dir>/bin` 在你的路径中。如果由于某种原因并非如此，请进入 `<mongodb installation dir>/bin`\
    \ 目录并重新运行命令。\n\n如果你遇到 `Error: couldn't connect to server` 错误，你需要在另一个终端窗口中使用 `mongod`\
    \ 命令启动 Mongo 服务。\n\n"
- fmt: "\nOnce you’re in the Mongo shell, type in `db.version()` to see the version\
    \ of MongoDB you’re running. At the time of writing, this should output `4.2.2`.\n\
    \nPlease note that you can exit the Mongo shell by running `quit()` and the Mongo\
    \ daemon by pressing `Ctrl` + `C` at any time.\n\nNow let’s get acquainted with\
    \ some MongoDB basics.\n\n## Basic Database Operations\n\nEnter the Mongo shell\
    \ if you haven’t already (by typing `mongo` into a terminal):\n\n```\n[mj@localhost\
    \ ~]$ mongo\nMongoDB shell version v4.2.2\nconnecting to: mongodb://127.0.0.1:27017/?compressors=disabled&gssapiServiceName=mongodb\n\
    Implicit session: session { \"id\" : UUID(\"08a624a0-b330-4233-b56b-1d5b15a48fea\"\
    ) }\nMongoDB server version: 4.2.2\n```\n\nLet’s start off by creating a database\
    \ to work with. To create a database, MongoDB has a `use DATABASE_NAME` command:\n\
    \n```\n> use exampledb\nswitched to db exampledb\n```\n\nTo display all the existing\
    \ databases, try `show dbs`:\n\n```\n> show dbs\nadmin          0.000GB\nconfig\
    \         0.000GB\nlocal          0.000GB\n```\n\nThe `exampledb` isn’t in the\
    \ list because we need to insert at least one document into the database. To insert\
    \ a document, you can use `db.COLLECTION_NAME.insertOne({\"key\":\"value\"})`.\
    \ Here’s an example:\n\n```\n> db.users.insertOne({name: \"Bob\"})\n{\n   \"acknowledged\"\
    \ : true,\n   \"insertedId\" : ObjectId(\"5a52c53b223039ee9c2daaec\")\n}\n```\n\
    \nMongoDB automatically creates a new `users` collection and inserts a document\
    \ with the key–value pair `'name':'Bob'`. The `ObjectId` returned is the ID of\
    \ the document inserted. MongoDB creates a unique `ObjectId` for each document\
    \ on creation, and it becomes the default value of the `_id` field.\n\nNow we\
    \ should be able to see our database:\n\n```\n>show dbs\nadmin          0.000GB\n\
    config         0.000GB\nexampledb      0.000GB\nlocal          0.000GB\n```\n\n\
    Similarly, you can confirm that the collection was created using the `show collections`\
    \ command:\n\n```\n> show collections\nusers\n```\n\nWe’ve created a database,\
    \ added a collection named `users` and inserted a document into it. Now let’s\
    \ try dropping it. To drop an existing database, use the `dropDatabase()` command,\
    \ as exemplified below:\n\n```\n>db.dropDatabase()\n{ \"dropped\" : \"exampledb\"\
    , \"ok\" : 1 }\n```\n\n`show dbs` confirms that the database was indeed dropped:\n\
    \n```\n> show dbs\nadmin          0.000GB\nconfig         0.000GB\nlocal     \
    \     0.000GB\n```\n\nFor more database operations, please consult the MongoDB\
    \ reference page on [database commands](https://docs.mongodb.com/manual/reference/command/).\n\
    \n## User Management\n\nBy now you’ve probably noticed that MongoDB doesn’t come\
    \ with any access control. While not having to supply a username and password\
    \ is nice for development, this is something you should change using Mongo in\
    \ production. Here are the steps for creating a database user with full read/write\
    \ privileges:\n\n*   Ensure that you’ve started the server without any kind of\
    \ access control (typically by typing `mongod`).\n*   Open a shell by typing `mongo`.\n\
    *   From the shell, add a user with the `readWrite` role to the `exampledb` database.\
    \ This will prompt you to enter a password. Obviously, replace “manjunath” with\
    \ your desired user name:\n```javascript\nuse exampledb\ndb.createUser(\n  user:\
    \ \"manjunath\",\n  pwd: password(),\n  roles: [ role: \"readWrite\" ]\n)\n```\n\
    *   Exit the Mongo shell.\n*   Shut down the server, then restart it using `mongod\
    \ --auth`. Clients that connect to this instance must now authenticate themselves.\n\
    *   Reopen a shell like: `mongo --authentication \"exampledb\" -u \"manjunath\"\
    \ -p`. You’ll now be prompted for your password.\n\nFor further information, please\
    \ consult the [documentation on access control](https://docs.mongodb.com/manual/tutorial/enable-authentication/).\n\
    \n## MongoDB CRUD Operations\n\nAs you might already know, the CRUD acronym stands\
    \ for `create`, `read`, `update`, and `delete`. These are the four basic database\
    \ operations you need while building an application. For instance, any modern\
    \ application will have the ability to create a new user, read the user data,\
    \ update the user information and, if needed, delete the user account. Let’s accomplish\
    \ this at the database level using MongoDB.\n\n### Create Operation\n\nCreation\
    \ is the same as [inserting a document](https://docs.mongodb.com/manual/tutorial/insert-documents/)\
    \ into a collection. In the previous section, we inserted a single document using\
    \ the `db.collection.insertOne()` syntax. There’s another method called `db.collection.insertMany()`\
    \ that lets you insert multiple documents at once. Here’s the syntax:\n\n```\n\
    > db.collection.insertMany([ <document 1>, <document 2>, ... ])\n```\n\nLet’s\
    \ create a `users` collection and populate it with some actual users:\n\n```javascript\n\
    > use exampledb\n> db.users.insertMany([\n   { name: \"Tom\", age:15, email: \"\
    tom@example.com\" },\n   { name: \"Bob\", age:35, email:\"bob@example.com\" },\n\
    \   { name: \"Kate\", age:27, email: \"kate@example.com\" },\n   { name: \"Katherine\"\
    , age:65, email:\"katherine@example.com\"}\n])\n{\n   \"acknowledged\" : true,\n\
    \   \"insertedIds\" : [\n      ObjectId(\"5e25bb58ba0cf1647aa56ff\"),\n      ObjectId(\"\
    5e25bb58ba0cf1647aa5700\"),\n      ObjectId(\"5e25bb58ba0cf1647aa5701\"),\n  \
    \    ObjectId(\"5e25bb58ba0cf1647aa5702\")\n   ]\n}\n```\n\nThe `insertMany` method\
    \ accepts an array of objects and, in return, we get an array of `ObjectId`s.\n\
    \n### Read Operation\n\nA read operation is used to [retrieve a document, or multiple\
    \ documents](https://docs.mongodb.com/manual/tutorial/query-documents/) from a\
    \ collection. The syntax for the read operation is as follows:\n\n```\n> db.collection.find(query,\
    \ projection)\n```\n\nTo retrieve all user documents, you can do this:\n\n```javascript\n\
    > db.users.find().pretty()\n{\n  \"_id\" : ObjectId(\"5e25bb58ba0cf1647aa56ff\"\
    ),\n  \"name\" : \"Tom\",\n  \"age\" : 15,\n  \"email\" : \"tom@example.com\"\n\
    }\n{\n  \"_id\" : ObjectId(\"5e25bb58ba0cf1647aa5700\"),\n  \"name\" : \"Bob\"\
    ,\n  \"age\" : 35,\n  \"email\" : \"bob@example.com\"\n}\n{\n  \"_id\" : ObjectId(\"\
    5e25bb58ba0cf1647aa5701\"),\n  \"name\" : \"Kate\",\n  \"age\" : 27,\n  \"email\"\
    \ : \"kate@example.com\"\n}\n{\n  \"_id\" : ObjectId(\"5e25bb58ba0cf1647aa5702\"\
    ),\n  \"name\" : \"Katherine\",\n  \"age\" : 65,\n  \"email\" : \"katherine@example.com\"\
    \n}\n```\n\nThis corresponds to the `SELECT * FROM USERS` query for an SQL database.\n\
    \nThe `pretty` method is a [cursor method](https://docs.mongodb.com/manual/reference/method/js-cursor/),\
    \ and there are many others too. You can chain these methods to modify your query\
    \ and the documents that are returned by the query.\n\nPerhaps you need to filter\
    \ queries to return a subset of the collection—such as finding all users who are\
    \ below 30. You can modify the query like this:\n\n```javascript\n> db.users.find({\
    \ age: { $lt: 30 })\n{\n  \"_id\" : ObjectId(\"5e25bb58ba0cf1647aa56ff\"),\n \
    \ \"name\" : \"Tom\",\n  \"age\" : 15,\n  \"email\" : \"tom@example.com\"\n}\n\
    {\n  \"_id\" : ObjectId(\"5e25bb58ba0cf1647aa5701\"),\n  \"name\" : \"Kate\",\n\
    \  \"age\" : 27,\n  \"email\" : \"kate@example.com\"\n}\n```\n\nIn this example,\
    \ `$lt` is a query filter operator that selects documents whose `age` field value\
    \ is less than 30. There are many comparison and logical query filters available.\n\
    \n### Update Operation\n\nAn [update operation](https://docs.mongodb.com/manual/tutorial/update-documents/)\
    \ modifies documents in a collection. Similar to the create operation, MongoDB\
    \ offers various methods for updating a document. For example:\n\n1.  `db.collection.updateOne(<filter>,\
    \ <update>, <options>)`\n\n2.  `db.collection.updateMany(<filter>, <update>, <options>)`.\n"
  raw: "Once you’re in the Mongo shell, type in `db.version()` to see the version\
    \ of MongoDB you’re running. At the time of writing, this should output `4.2.2`.\n\
    \nPlease note that you can exit the Mongo shell by running `quit()` and the Mongo\
    \ daemon by pressing `Ctrl` + `C` at any time.\n\nNow let’s get acquainted with\
    \ some MongoDB basics.\n\n## Basic Database Operations\n\nEnter the Mongo shell\
    \ if you haven’t already (by typing `mongo` into a terminal):\n\n```\n[mj@localhost\
    \ ~]$ mongo\nMongoDB shell version v4.2.2\nconnecting to: mongodb://127.0.0.1:27017/?compressors=disabled&gssapiServiceName=mongodb\n\
    Implicit session: session { \"id\" : UUID(\"08a624a0-b330-4233-b56b-1d5b15a48fea\"\
    ) }\nMongoDB server version: 4.2.2\n```\n\nLet’s start off by creating a database\
    \ to work with. To create a database, MongoDB has a `use DATABASE_NAME` command:\n\
    \n```\n> use exampledb\nswitched to db exampledb\n```\n\nTo display all the existing\
    \ databases, try `show dbs`:\n\n```\n> show dbs\nadmin          0.000GB\nconfig\
    \         0.000GB\nlocal          0.000GB\n```\n\nThe `exampledb` isn’t in the\
    \ list because we need to insert at least one document into the database. To insert\
    \ a document, you can use `db.COLLECTION_NAME.insertOne({\"key\":\"value\"})`.\
    \ Here’s an example:\n\n```\n> db.users.insertOne({name: \"Bob\"})\n{\n   \"acknowledged\"\
    \ : true,\n   \"insertedId\" : ObjectId(\"5a52c53b223039ee9c2daaec\")\n}\n```\n\
    \nMongoDB automatically creates a new `users` collection and inserts a document\
    \ with the key–value pair `'name':'Bob'`. The ObjectId returned is the ID of the\
    \ document inserted. MongoDB creates a unique ObjectId for each document on creation,\
    \ and it becomes the default value of the `_id` field.\n\nNow we should be able\
    \ to see our database:\n\n```\n>show dbs\nadmin          0.000GB\nconfig     \
    \    0.000GB\nexampledb      0.000GB\nlocal          0.000GB\n```\n\nSimilarly,\
    \ you can confirm that the collection was created using the `show collections`\
    \ command:\n\n```\n> show collections\nusers\n```\n\nWe’ve created a database,\
    \ added a collection named `users` and inserted a document into it. Now let’s\
    \ try dropping it. To drop an existing database, use the `dropDatabase()` command,\
    \ as exemplified below:\n\n```\n>db.dropDatabase()\n{ \"dropped\" : \"exampledb\"\
    , \"ok\" : 1 }\n```\n\n`show dbs` confirms that the database was indeed dropped:\n\
    \n```\n> show dbs\nadmin          0.000GB\nconfig         0.000GB\nlocal     \
    \     0.000GB\n```\n\nFor more database operations, please consult the MongoDB\
    \ reference page on [database commands](https://docs.mongodb.com/manual/reference/command/).\n\
    \n## User Management\n\nBy now you’ve probably noticed that MongoDB doesn’t come\
    \ with any kind of access control enabled.\n\nWhile not having to supply a username\
    \ and password is nice for development, this is something you should change when\
    \ using Mongo in production.\n\nHere are the steps for creating a database user\
    \ with full read/write privileges:\n\n*   Ensure that you’ve started the Mongo\
    \ server without any kind of access control (typically by typing `mongod`).\n\n\
    *   Open a shell by typing `mongo`.\n\n*   From the shell, add a user with the\
    \ `readWrite` role to the `exampledb` database. This will prompt you to enter\
    \ a password. Obviously, replace “manjunath” with your desired user name:\n\n\
    \    ```\n     use exampledb\n      db.createUser(\n        {\n          user:\
    \ \"manjunath\",\n          pwd: passwordPrompt(),\n          roles: [ { role:\
    \ \"readWrite\" ]\n        }\n      )\n    ```\n\n*   Exit the Mongo shell.\n\n\
    *   Shut down the Mongo server, then restart it using `mongod --auth`. Clients\
    \ that connect to this instance must now authenticate themselves.\n\n*   Reopen\
    \ a shell like so: `mongo --authenticationDatabase \"exampledb\" -u \"manjunath\"\
    \ -p`. You’ll now be prompted for your password.\n\nFor further information, please\
    \ consult the [project’s documentation on enabling access control](https://docs.mongodb.com/manual/tutorial/enable-authentication/).\n\
    \n## MongoDB CRUD Operations\n\nAs you might already know, the CRUD acronym stands\
    \ for **c**reate, **r**ead, **u**pdate, and **d**elete. These are the four basic\
    \ database operations that you can’t avoid while building an application. For\
    \ instance, any modern application will have the ability to create a new user,\
    \ read the user data, update the user information and, if needed, delete the user\
    \ account. Let’s accomplish this at the database level using MongoDB.\n\n### Create\
    \ Operation\n\nCreation is the same as [inserting a document](https://docs.mongodb.com/manual/tutorial/insert-documents/)\
    \ into a collection. In the previous section, we inserted a single document using\
    \ the `db.collection.insertOne()` syntax. There’s another method called `db.collection.insertMany()`\
    \ that lets you insert multiple documents at once. Here’s the syntax:\n\n```\n\
    > db.collection.insertMany([ <document 1> , <document 2>, ... ])\n```\n\nLet’s\
    \ create a `users` collection and populate it with some actual users:\n\n```\n\
    > use exampledb\n> db.users.insertMany([\n   { name: \"Tom\",age:15, email: \"\
    tom@example.com\" },\n   { name: \"Bob\", age:35, email:\"bob@example.com\" },\n\
    \   { name: \"Kate\", age: 27, email: \"kate@example.com\" },\n   { name: \"Katherine\"\
    , age:65, email:\"katherine@example.com\"}\n])\n\n{\n   \"acknowledged\" : true,\n\
    \   \"insertedIds\" : [\n      ObjectId(\"5e25bb58ba0cf16476aa56ff\"),\n    ObjectId(\"\
    5e25bb58ba0cf16476aa5700\"),\n    ObjectId(\"5e25bb58ba0cf16476aa5701\"),\n  \
    \  ObjectId(\"5e25bb58ba0cf16476aa5702\")\n   ]\n}\n```\n\nThe `insertMany` method\
    \ accepts an array of objects and, in return, we get an array of `ObjectId`s.\n\
    \n### Read Operation\n\nA read operation is used to [retrieve a document, or multiple\
    \ documents](https://docs.mongodb.com/manual/tutorial/query-documents/) from a\
    \ collection. The syntax for the read operation is as follows:\n\n```\n> db.collection.find(query,\
    \ projection)\n```\n\nTo retrieve all user documents, you can do this:\n\n```\n\
    > db.users.find().pretty()\n{\n  \"_id\" : ObjectId(\"5e25bb58ba0cf16476aa56ff\"\
    ),\n  \"name\" : \"Tom\",\n  \"age\" : 15,\n  \"email\" : \"tom@example.com\"\n\
    }\n{\n  \"_id\" : ObjectId(\"5e25bb58ba0cf16476aa5700\"),\n  \"name\" : \"Bob\"\
    ,\n  \"age\" : 35,\n  \"email\" : \"bob@example.com\"\n}\n{\n  \"_id\" : ObjectId(\"\
    5e25bb58ba0cf16476aa5701\"),\n  \"name\" : \"Kate\",\n  \"age\" : 27,\n  \"email\"\
    \ : \"kate@example.com\"\n}\n{\n  \"_id\" : ObjectId(\"5e25bb58ba0cf16476aa5702\"\
    ),\n  \"name\" : \"Katherine\",\n  \"age\" : 65,\n  \"email\" : \"katherine@example.com\"\
    \n}\n```\n\nThis corresponds to the `SELECT * FROM USERS` query for an SQL database.\n\
    \nThe `pretty` method is a [cursor method](https://docs.mongodb.com/manual/reference/method/js-cursor/),\
    \ and there are many others too. You can chain these methods to modify your query\
    \ and the documents that are returned by the query.\n\nPerhaps you need to filter\
    \ queries to return a subset of the collection—such as finding all users who are\
    \ below 30\\. You can modify the query like this:\n\n```\n> db.users.find({ age:\
    \ { $lt: 30 } })\n{ \"_id\" : ObjectId(\"5e25bb58ba0cf16476aa56ff\"), \"name\"\
    \ : \"Tom\", \"age\" : 15, \"email\" : \"tom@example.com\" }\n{ \"_id\" : ObjectId(\"\
    5e25bb58ba0cf16476aa5701\"), \"name\" : \"Kate\", \"age\" : 27, \"email\" : \"\
    kate@example.com\" }\n```\n\nIn this example, `$lt` is a query filter operator\
    \ that selects documents whose `age` field value is less than 30. There are many\
    \ comparison and logical query filters available. You can see the entire list\
    \ in the [query selector documentation](https://docs.mongodb.com/manual/reference/operator/query/#query-selectors).\n\
    \n#### Replicating a Regex\n\nIn Mongo, You can replicate SQL’s `like` query using\
    \ a regex. For example, `SELECT` *`FROM users WHERE name LIKE 'Kat%'`* *translates\
    \ to `db.users.find({ name: /Kat.`*`/ })`.\n\n### Update Operation\n\nAn [update\
    \ operation](https://docs.mongodb.com/manual/tutorial/update-documents/) modifies\
    \ documents in a collection. Similar to the create operation, MongoDB offers various\
    \ methods for updating a document. For example:\n\n1.  `db.collection.updateOne(<filter>,\
    \ <update>, <options>)`\n\n2.  `db.collection.updateMany(<filter>, <update>, <options>)`."
