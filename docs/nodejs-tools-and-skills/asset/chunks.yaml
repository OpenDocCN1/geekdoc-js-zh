    \ in `~/.nvm/versions/node/<version>/lib/node_modules`. This has the added advantage\
    \ that users won’t require `sudo` privileges to install global packages.\n\nFortunately,\
    \ when installing a new Node.js version, you can reinstall the npm global packages\
    \ from a specific version. For example:\n\n```\nnvm install v12.14.1 --reinstall-packages-from=10.18.1\n\
    ```\n\nBy running the above, nvm will install Node.js version `12.14.1`, the corresponding\
    \ npm version, and reinstall the global npm packages you had installed for the\
    \ `10.18.1` version.\n\nIf you’re not sure what the latest version is, you can\
    \ use the `node` alias:\n\n```\nnvm install node\n```\n\nThis will currently pull\
    \ in version `13.6.0`.\n\nOr you can install the most recent [LTS release](https://en.wikipedia.org/wiki/Long-term_support),\
    \ using:\n\n```\nnvm install --lts\n```\n\nThis will currently pull in version\
    \ `12.14.1`.\n\nYou can also uninstall any instance you no longer think is useful,\
    \ by running:\n\n```\nnvm uninstall 13.6.0\n```\n\n### Switching Between Versions\n\
    \nSo far, we’ve seen how to install different Node versions. Now let’s go through\
    \ how to switch between them. Let me first note that when a new version is installed,\
    \ it’s automatically put to use. So if you install the latest Node.js version,\
    \ and run `node -v` right after, you’ll see the latest version output.\n\nTo switch\
    \ through installed versions, nvm provides the `nvm use` command. This works similarly\
    \ to the install command. So, you need to follow this by a version number or an\
    \ alias.\n\nSwitch to Node.js version `13.6.0`:\n\n```\nnvm use 13.6.0\n```\n\n\
    Switch to Node.js version `12.14.1`:\n\n```\nnvm use 12.14.1\n```\n\nSwitch to\
    \ the latest Node.js version:\n\n```\nnvm use node\n```\n\nSwitch to the latest\
    \ LTS version:\n\n```\nnvm use --lts\n```\n\nWhen switching to a different version,\
    \ nvm will make the `node` instance in your terminal symlink to the proper Node.js\
    \ instance.\n\n### Custom Aliases\n\nYou can also create custom aliases beyond\
    \ the ones that come with nvm. For example, by running:\n\n```\nnvm alias awesome-version\
    \ 13.6.0\n```\n\nYou’re setting an alias with the name “awesome-version” for Node.js\
    \ version `13.6.0`. So, if you now run:\n\n```\nnvm use awesome-version\n```\n\
    \nnvm will switch `node` to version `13.6.0`. You can delete an alias by running:\n\
    \n```\nnvm unalias awesome-version\n```\n\nYou can also set a default instance\
    \ to be used in any shell, by targeting a version to the “default” alias, like\
    \ so:\n\n```\nnvm alias default 12.14.1\n```\n\n### Listing Installed Instances\n\
    \nAt any time you can check which versions you have installed by running:\n\n\
    ```\nnvm ls\n```\n\nThis will display something resembling the following:\n\n\
    ![nvm versions list](Images/nvm_1.png)\n\nThe entry in green, with an arrow on\
    \ the left, is the current version in use. Below the installed versions, there’s\
    \ a list of available aliases. Try executing the following now:\n\n```\nnvm use\
    \ node\nnvm ls\n```\n\nIt will display like so:\n\n![nvm use and versions list](Images/nvm_2.png)\n\
    \nYou can also check what is the current version in use with the command:\n\n\
    ```\nnvm current\n```\n\n### Specify a Node Version on a Per-project Basis\n\n\
    Version managers such as [rbenv](https://github.com/rbenv/rbenv) allow you to\
    \ specify a Ruby version on a per-project basis (by writing that version to a\
    \ `.ruby-version` file in your current directory). This is kind of possible with\
    \ nvm in that, if you create a `.nvmrc` file inside a project and specify a version\
    \ number, you can cd into the project directory and type `nvm use`. nvm will then\
    \ read the contents of the `.nvmrc` file and use whatever version of Node you\
    \ specify.\n\nIf it’s important to you that this happens automatically, there\
    \ are a couple of snippets on the project’s home page for you to add to your `.bashrc`\
    \ or `.zshrc` files to make this happen.\n\nHere’s the ZSH snippet. Place this\
    \ below your nvm config:\n\n```\nautoload -U add-zsh-hook\nload-nvmrc() {\n  local\
    \ node_version=\"$(nvm version)\"\n  local nvmrc_path=\"$(nvm_find_nvmrc)\"\n\n\
    \  if [ -n \"$nvmrc_path\" ]; then\n    local nvmrc_node_version=$(nvm version\
    \ \"$(cat \"${nvmrc_path}\")\")\n\n    if [ \"$nvmrc_node_version\" = \"N/A\"\
    \ ]; then\n      nvm install\n    elif [ \"$nvmrc_node_version\" != \"$node_version\"\
    \ ]; then\n      nvm use\n    fi\n  elif [ \"$node_version\" != \"$(nvm version\
    \ default)\" ]; then\n    echo \"Reverting to nvm default version\"\n    nvm use\
    \ default\n  fi\n}\nadd-zsh-hook chpwd load-nvmrc\nload-nvmrc\n```\n\nNow, when\
    \ you change into a directory with a `.nvmrc` file, your shell will automatically\
    \ change Node version.\n\n![Automatically apply nvm use](Images/nvm_3.png)\n\n\
    ### Other nvm Commands\n\nnvm provides a couple of other commands that are more\
    \ advanced or less commonly used.\n\nYou can run a command directly for an installed\
    \ version without switching the `node` variable:\n\n```\nnvm run 13.6.0 --version\n\
    ```\n\nYou can run a command on a sub-shell, targeting a specific version:\n\n\
    ```\nnvm exec 13.6.0 node --version\n```\n\nYou can get the path to the Node.js\
    \ executable of a specific installed version:\n\n```\nnvm which 13.6.0\n```\n\n\
    This might be useful when configuring a text editor plugin that needs to know\
    \ where your current version of Node lives.\n\n## Conclusion\n\nnvm is a great\
    \ tool for any Node.js developer. It enables a concern-free installation and easy\
    \ switching between different versions, saving time for what really matters.\n\
    \nA thank you note to [Tim Caswell](https://github.com/creationix), the creator\
    \ of nvm, and also to [Corey Butler](https://github.com/coreybutler) for the nvm\
    \ for Windows support, and of course to those contributing to these great projects.\
    \ Your work is greatly appreciated by the Node.js community.\n\n# Chapter 2: A\
    \ Beginner’s Guide to npm\n\n### by Michael Wanyoike and Peter Dierx"
