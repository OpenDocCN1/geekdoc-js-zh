    \ in 1.382s\nfixed 21 of 21 vulnerabilities in 122 scanned packages\n```\n\nThe\
    \ command `npm audit fix` automatically installs any compatible updates to vulnerable\
    \ dependencies. While this might seem like magic, do note that vulnerabilities\
    \ can’t always be fixed automatically. This could happen if you’re using a package\
    \ that’s undergone a major change which could break your current project if updated.\
    \ For situations such as this, you’ll have to review your code and manually apply\
    \ the fix.\n\nYou can also run `npm audit fix --force` if you don’t mind upgrading\
    \ packages with breaking changes. After you’ve executed the command, run `npm\
    \ audit` to ensure that all vulnerabilities have been resolved.\n\n## Aliases\n\
