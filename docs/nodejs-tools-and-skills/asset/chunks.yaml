    ## Node Packaged Modules


    npm can install packages in local or global mode. In local mode, it installs the
    package in a `node_modules` folder in your parent working directory. This location
    is owned by the current user.


    If you’re not using a [version manager](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)
    (which you probably should be), global packages are installed in `{prefix}/lib/node_modules/`,
    which is owned by root (where `{prefix}` is usually `/usr/` or `/usr/local`).
    This means you would have to use `sudo` to install packages globally, which could
    cause permission errors when resolving third-party dependencies, as well as being
    a security concern.


    Let’s change that!


    ## Changing the Location of Global Packages


    Let’s see what output `npm config` gives us:


    ```

    $ npm config list

    ; cli configs

    metrics-registry = "https://registry.npmjs.org/"

    scope = ""

    user-agent = "npm/6.13.7 node/v12.15.0 linux x64"


    ; node bin location = /usr/bin/nodejs

    ; cwd = /home/sitepoint

    ; HOME = /home/sitepoint

    ; "npm config ls -l" to show all defaults.

    ```


    This gives us information about our install. For now, it’s important to get the
    current global location:


    ```

    $ npm config get prefix

    /usr

    ```


    This is the prefix we want to change, in order to install global packages in our
    home directory. To do that create a new directory in your home folder:


    ```

    $ cd ~ && mkdir .node_modules_global

    $ npm config set prefix=$HOME/.node_modules_global

    ```


    With this simple configuration change, we’ve altered the location to which global
    Node packages are installed. This also creates a `.npmrc` file in our home directory:


    ```

    $ npm config get prefix

    /home/sitepoint/.node_modules_global

    $ cat .npmrc

    prefix=/home/sitepoint/.node_modules_global

    ```


    We still have npm installed in a location owned by root. But because we changed
    our global package location, we can take advantage of that. We need to install
    npm again, but this time in the new, user-owned location. This will also install
    the latest version of npm:


    ```

    npm install npm@latest -g

    ```


    Finally, we need to add `.node_modules_global/bin` to our `$PATH` environment
    variable, so that we can run global packages from the command line. Do this by
    appending the following line to your `.profile`, `.bash_profile`or `.bashrc` and
    restarting your terminal:


    ```

    export PATH="$HOME/.node_modules_global/bin:$PATH"

    ```


    Now our `.node_modules_global/bin` will be found first and the correct version
    of npm will be used:


    ```

    $ which npm

    /home/sitepoint/.node_modules_global/bin/npm

    $ npm --version

    6.13.7

    ```


    #### Version Manager?


    As said earlier, you can avoid all of this if you use a Node version manager.
    Check out this tutorial to find out how: [Installing Multiple Versions of Node.js
    Using nvm](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/).


    ## Installing Packages in Global Mode


    At the moment, we only have one package installed globally—the npm package itself.
    So let’s change that and install [UglifyJS](https://www.npmjs.com/package/uglify-js)
    (a JavaScript minification tool). We use the `--global` flag, but this can be
