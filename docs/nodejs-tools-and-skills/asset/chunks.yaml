    \ be ignored:\n\n```\n URL.open(\"http://www.sitepoint.com/responsive-web-\n➥design-real-user-testing/?responsive1\"\
    );\n```\n\nYou’ll notice that we’ve used certain layout styles throughout this\
    \ book to signify different types of information. Look out for the following items.\n\
    \n### Tips, Notes, and Warnings\n\n#### Hey, You!\n\nTips provide helpful little\
    \ pointers.\n\n#### Ahem, Excuse Me ...\n\nNotes are useful asides that are related—but\
    \ not critical—to the topic at hand. Think of them as extra tidbits of information.\n\
    \n#### Make Sure You Always ...\n\n... pay attention to these important points.\n\
    \n#### Watch Out!\n\nWarnings highlight any gotchas that are likely to trip you\
    \ up along the way.\n\n## Supplementary Materials\n\n*   [https://www.sitepoint.com/community/](https://www.sitepoint.com/community/)\
    \ are SitePoint’s forums, for help on any tricky problems.\n\n*   **books@sitepoint.com**\
    \ is our email address, should you need to contact us to report a problem, or\
    \ for any other reason.\n\n# Chapter 1: Installing Multiple Versions of Node.js\
    \ Using nvm\n\n### by Michael Wanyoike and James Hibbard\n\nWhen working with\
    \ Node.js, you might encounter situations where you need to install multiple versions\
    \ of the runtime.\n\nFor example, maybe you have the latest version of Node set\
    \ up on your machine, yet the project you’re about to start working on requires\
    \ an older version. Or maybe you’re upgrading an old Node project to a more modern\
    \ version and it would be handy to be able to switch between the two while you\
    \ make the transition.\n\nWithout a good tool, this would mean spending a lot\
    \ of time and effort manually uninstalling and reinstalling Node versions and\
    \ their global packages. Fortunately, there’s a better way!\n\n## Introducing\
    \ nvm\n\n[nvm](https://github.com/creationix/nvm) stands for Node Version Manager.\
    \ As the name suggests, it helps you manage and switch between different Node\
    \ versions with ease. It provides a command-line interface where you can install\
    \ different versions with a single command, set a default, switch between them\
    \ and much more.\n\n## OS Support\n\nnvm supports both Linux and macOS, but that’s\
    \ not to say that Windows users have to miss out. There’s a second project named\
    \ [nvm-windows](https://github.com/coreybutler/nvm-windows) that offers Windows\
    \ users the option of easily managing Node environments. Despite the name, nvm-windows\
    \ is not a clone of nvm, nor is it affiliated with it. However, the basic commands\
    \ listed below (for installing, listing and switching between versions) should\
    \ work for both nvm and nvm-windows.\n\n## Installation\n\nLet’s first cover installation\
    \ for Windows, macOS and Linux.\n\n### Windows\n\nFirst, we need to do a little\
    \ preparation:\n\n*   uninstall any existing versions of Node.js\n\n*   delete\
    \ any existing Node.js installation directories (such as `C:\\Program Files\\\
    nodejs`)\n\n*   delete the existing npm install location (such as `C:\\Users\\\
    <user>\\AppData\\Roaming\\npm`)\n\nAfter this, download and run the [latest stable\
    \ installer](https://github.com/coreybutler/nvm-windows/releases) and you should\
    \ be good to go!\n\n### macOS/Linux\n\nUnlike Windows, removing previous Node\
    \ and npm installations in macOS and Linux is optional. If this is something you\
    \ want to do, there are plenty of good resources available online. For example,\
    \ here’s how to remove Node on [macOS](http://stackoverflow.com/q/11177954/1136887)\
    \ and on [Linux](http://stackoverflow.com/q/5650169/1136887). And here’s how you\
    \ can [remove any previous npm installation](https://docs.npmjs.com/misc/removing-npm)\
    \ you might have.\n\nYou can install nvm using cURL or Wget. On your terminal,\
    \ run the following:\n\nWith [cURL](https://curl.haxx.se/):\n\n```\ncurl -o- https://raw.githubusercontent.com/creationix/nvm/v0.35.2/install.sh\
    \ | bash\n```\n\nOr with [Wget](https://www.gnu.org/software/wget/):\n\n```\n\
    wget -qO- https://raw.githubusercontent.com/creationix/nvm/v0.35.2/install.sh\
    \ | bash\n```"
