  trans: "\n让我们通过一些代码示例来熟悉一下语法。\n\n## 创建新记录：\n\n```\nconst post = new Post();\n\n\
    post.name = 'My first blog post';\npost.content = 'Blah blah blah...';\n\nawait\
    \ post.save();\n```\n\n还有一种从数据对象创建并返回新模型的便捷方法：\n\n```javascript\nconst post =\
    \ await Post.create({\n  name: 'My first blog post',\n  content: 'Blah blah blah...'\n\
    });\n```\n\n还有其他常用的 Eloquent 便捷方法可用，例如 `findOrFail` 和 `findOrCreate`。\n\n## 获取记录：\n\
    \n```javascript\n// 返回所有记录\nconst posts = Post.all();\n\n// 通过 ID 查找\nconst post\
    \ = Post.find(1);\n```\n\n## 在模型中使用查询构造器：\n\n```\nconst adults = await User\n\
    \  .query()\n  .where('age', '>', 18)\n  .fetch();\n```\n\n### 迁移 (Migrations)\n\
    \nLaravel 数据库功能另一个核心部分是迁移系统。如果你不熟悉它，`migration`（迁移）是一组在代码中定义的架构更改。迁移可以在应用程序的不同环境（如开发、测试和生产环境）中运行，确保在代码部署时所有数据库副本都已更新。\n\
    \nAdonis 的处理方式对 Laravel 开发者来说会非常熟悉。[迁移](https://adonisjs.com/docs/4.1/migrations)\
    \ 通过 CLI 创建：\n\n```bash\nadonis make:migration posts\n# ✔ create  database/migrations/1502691651527_posts_schema.js\n\
    ```\n\n它们也可以从那里运行：\n\n```bash\nadonis migration:run\n# migrate: 1502691651527_posts_schema.js\n\
    # Database migrated successfully in 117 ms\n```\n\n除了运行迁移外，还有命令可以回滚最后一组，或者完全回滚并从头重新应用所有迁移，[等等](https://adonisjs.com/docs/4.1/migrations#_migration_commands)。\n\
    \n让我们来看看迁移是如何定义的：\n\n```javascript\n// database/migrations/1502691651527_posts_schema.js\n\
    \n'use strict'\n\nconst Schema = use('Schema')\n\nclass PostsSchema extends Schema\
    \ {\n  up () {\n    this.create('users', (table) => {\n      table.increments()\n\
    \      table.string('title').notNullable().unique()\n      table.text('content').notNullable()\n\
    \      table.integer('comment_count').notNullable()\n      table.timestamps()\n\
    \    })\n  }\n\n  down () {\n    this.drop('posts')\n  }\n}\n\nmodule.exports\
    \ = PostsSchema\n```\n\n每个迁移都有一个 `up()` 和 `down()` 方法，分别在 migrate 和 rollback 时运行。在\
    \ `up()` 方法中，通过链式方法调用来定义/修改列，从而声明表架构的更改。\n\n## 视图 (Views)\n\n除了创建 REST API 外，Adonis\
    \ 还旨在让服务器渲染的应用程序变得轻松。为此，它包含了 [Edge 模板引擎](https://edge.adonisjs.com/)。\n\n### Edge\
    \ 模板\n\n模板是扩展名为 `.edge`的文件，可以包含 HTML、CSS 和 JavaScript 的混合。语法与 Blade 非常相似，例如：\n\
    \n```html\n// resources/views/list.edge\n\n@layout('main')\n\n@section('content')\n\
    <div>\n  <<ul>\n    @each(item in list)\n      <li>\n        <a href=\"{{ item.url\
    \ }}\">{{ item.text }}</a>\n      </li>\n    @endach\n  </ul>\n</div>\n@endsection\n\
    ```\n\n模板也用于帮助视图。这里是一些常用标签：\n\n*   `@layout`：指定将渲染布局\n*   `@section`：指定将内容插入到布局中\n\
    *   `@each`：指定该块将重复\n*   `@include`：允许包含部分组件\n"
- fmt: "\nIn the past, we used to build monolithic applications that handled views,\
    \ business logic and data management in one single codebase. This architecture\
    \ created a number of problems that affected an application’s stability, performance\
    \ and maintainability.\n\nNowadays, many web applications favor a more modular\
    \ approach. This typically involves creating a public-facing API that exposes\
    \ endpoints for interacting with an application’s data. In this guide, we’ll take\
    \ a quick look what an API is, as well as five developer-friendly frameworks we\
    \ can use to build them in Node.js.\n\n## What is an API?\n\nIn simple English,\
    \ an API (short for Application Programming Interface) is a server application\
    \ that responds to requests from client applications such as browsers and mobile\
    \ apps. If you’ve had to fetch data from another source on the Internet (such\
    \ as Twitter or GitHub), chances are you’ve used one already.\n\nOne big advantage\
    \ of this approach is you build your back-end server API once, then you can connect\
    \ it to different types of client interfaces—such as desktop, web, mobile or console\
    \ apps. Having an API ensures data is consistent in all the front-facing apps\
    \ that have been built for an organization.\n\nAn API provides important back-end\
    \ functions such as:\n\n*   CRUD operations\n*   data validation and transformation\n\
    *   authentication\n*   access control\n*   business logic\n*   transactional\
    \ email\n*   task scheduling\n*   event handling\n\nBuilding an API server in\
    \ Node is quite simple. If you need to set one up quickly to test your front-end\
    \ code, you can install [JSON server](https://www.npmjs.com/package/json-server#getting-started)\
    \ to quickly prototype your back end. If you’ve started building your own API\
    \ and you don’t have a front end yet, you can use the following tools to test\
    \ your endpoints:\n\n*   [Postman](https://www.getpostman.com/)\n*   [Insomnia](https://insomnia.rest/)\n\
    \nThese tools allow you to perform both REST and GraphQL queries. We’ll get into\
    \ them some more later on.\n\nTo build your own API, you’ll need a framework that\
    \ will provide you with the necessary libraries and tools to create your back-end\
    \ server. I’ve ordered the following list based on how user-friendly the framework\
    \ is. The last one is the least technical to use.\n\n## 1. Express\n\n![express](Images/express.png)\n\
    \nIf you’re a Node.js beginner, this is the framework you should start with. You\
    \ can [install Express](https://expressjs.com/en/starter/installing.html) as a\
    \ package dependency with the command `npm install express`. Alternatively, you\
    \ can use the [express-generator](https://expressjs.com/en/starter/generator.html)\
    \ command-line tool to quickly spin up a starter Express project. We also have\
    \ a [tutorial on using this library](https://www.sitepoint.com/create-new-express-js-apps-with-express-generator/).\n\
    \nLet’s look at what a simple REST API for managing users might look like in Express.\n\
    \nFirst, create a new project then install Express:\n\n```\nmkdir express-api\n\
    cd express-api\nnpm init -y\nnpm i express\n```\n\nNext, create an `server.js`\
    \ file and add the following content:\n\n```javascript\nlet data = [\n  { id:\
    \ 1, firstName: 'Michael', lastName: 'Wanyoike' },\n  { id: 2, firstName: 'James',\
    \ lastName: 'Hibbard' },\n];\n\nconst express = require('express');\nconst bodyParser\
    \ = require('body-parser');\nconst app = express().use(bodyParser.json());\n\n\
    // GET all users\napp.get('/users', (req, res) => { res.json(data); });\n\n//\
    \ GET a user\napp.get('/users/:id', (req, res) => {\n  const id = Number(req.params.id);\n\
    \  const user = data.find(user => user.id === id);\n  res.json(user ? user : {\
    \ message: 'Not found' });\n});\n\n// ADD a user\napp.post('/users', (req, res)\
    \ => {\n  const user = req.body;\n  data.push(user);\n  res.json(data);\n});\n\
    \n// UPDATE a user\napp.put('/users/:id', (req, res) => {\n  const id = Number(req.params.id);\n\
    \  const updatedUser = req.body;\n  data = data.map(user => user.id === id ? updatedUser\
    \ : user);\n  res.json(data);\n});\n\n// DELETE a user\napp.delete('/users/:id',\
    \ (req, res) => {\n  const id = Number(req.params.id);\n  data = data.filter(user\
    \ => user.id !== id);\n  res.json(data);\n});\n\napp.listen(3000, () => { console.log('Server\
    \ listening at port 3000'); });\n```\n\nSave this code, then start the server\
    \ using `node server.js`. It’s now running on `http://localhost:3000`.\n\n###\
    \ Interacting with the API Using Postman\n\nWe can test that our API does what\
    \ it should using [Postman](https://www.getpostman.com/), an API testing environment.\
    \ Download the correct version for your system, then follow the [instructions\
    \ to get it installed](https://learning.getpostman.com/docs/postman/launching-postman/installation-and-updates/).\n\
    \nWe can start by sending a GET request to `http://localhost:3000/users` to list\
    \ all of our users. You should see the following:\n\n```json\n[\n  { \"id\": 1,\
    \ \"firstName\": \"Michael\", \"lastName\": \"Wanyoike\" },\n  { \"id\": 2, \"\
    firstName\": \"James\", \"lastName\": \"Hibbard\" }\n]\n```\n\n### Taking it Further\n\
    \nWith Express, you can connect to any database by installing an [adapter](https://expressjs.com/en/database-integration)\
    \ that will handle tasks such as routing, logging and error handling.\n\nUnfortunately,\
    \ it lacks built-in support for authentication and authorization. You’ll have\
    \ to implement that using third-party libraries such as `Passport`.\n\n### Express\
    \ Links\n\n*   [Home page](http://expressjs.com/)\n*   [Documentation](http://expressjs.com/en/starter/installing.html)\n\
    *   [GitHub](https://github.com/expressjs/express)\n*   [npm](https://www.npmjs.com/package/express)\n\
    \nBefore we move on, here are similar frameworks that are based on or influenced\
    \ by Express:\n\n*   [Koa](https://koajs.com/)\n*   [Hapi](https://hapi.dev/)\n\
    *   [Restify](http://restify.com/)\n*   [NestJS](https://nestjs.com/)\n\n## 2.\
    \ Fastify\n\n![fastify](Images/fastify.png)\n\nFastify is a Node.js framework\
    \ inspired by Hapi and Express. It’s designed to handle high numbers of requests\
    \ as fast as possible. According to their [synthetic benchmarks](https://www.fastify.io/benchmarks/),\
    \ Fastify is twice as fast as Express:\n\n| Framework | Version | Router? | Requests/sec\
    \ |\n| --- | --- | --- | --- |\n| hapi | 18.1.0 | ✓ | 29,998 |\n| Express | 4.16.4\
    \ | ✓ | 38,510 |\n| Restify | 8.0.0 | ✓ | 39,331 |\n| Koa | 2.7.0 | ✗ | 50,933\
    \ |\n| **Fastify** | **2.0.0** | **✓** | **76,835** |\n| - | | | |\n| `http.Server`\
    \ | 10.15.2 | ✗ | 71,768 |\n\nTo get started, you can install it as a package\
    \ dependency in your project. Simply execute the following commands:\n\n```\n\
    mkdir fastify-app\ncd fastify-app\nnpm init -y\nnpm install fastify\ntouch server.js\n\
    ```\n\nCopy the following code to `server.js`:\n\n```javascript\nconst fastify\
    \ = require('fastify')({ logger: true })\n\nfastify.get('/', async (request, reply)\
    \ => {\n  return { hello: 'world' }\n})\n\nconst start = async () => {\n  try\
    \ {\n    await fastify.listen({ port: 3000 })\n  } catch (err) {\n    fastify.log.error(err)\n\
    \    process.exit(1)\n  }\n}\nstart()\n```\n"
