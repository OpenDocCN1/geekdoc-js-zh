  md: '# CHAPTER Features and Functions 5


    One of the powers of Perl is not only its ability to help deliver Web pages with
    organized information, but the way in which it works behind the scenes to assist
    developers in getting their job done. Instead of being displayed or outputted
    to HTML pages, most of the scripts that fall into this category are run exclusively
    on the server side.


    In this chapter, we''re going to introduce you to several modules, scripts, and
    utilities that you can use to enhance and manage your Web site with finesse.


    Examples include scripts that help you manage other scripts on your site as well
    as utilities to rename files behind the scenes, browsers, check links, squash
    bugs, and validate code.


    # Adding Taint Checking


    Taint checking was introduced in Chapter 4, “Working with Forms,” where we used
    it to ensure that forms would be secure, and *tainted* data would be allowed to
    entering the script process.


    Because this level of security is important for most scripts, this module makes
    the basic taint check routine available to every script, so you don''t have to
    type it in scripts individually.


    # How to Use


    +   1. Copy the code into your text editor.

    2. Save the code as Taintcheck.pm.

    3. Place the Taintcheck.pm file into the site_perl directory in /usr/lib/perl,
    or wherever your site keeps Perl modules that are not part of the standard distribution.
    If you don''t have access to the site_perl directory, create a private Perl library
    folder somewhere outside of your hdocs tree, and place Taintcheck.pm there. Make
    sure that your Perl library folder is readable (but *not* writable) for all users.'
