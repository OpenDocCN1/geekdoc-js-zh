    # Hang That Man!


    Our dearest script in this chapter is the classic Hangman game (see

    Figure 7.4). This illustrates a very important technique in CGI

    programming: saving state. The saving state concept is very

    to learn and understand in general, and it''s easy to envision it

    through the demonstration of this game.'
