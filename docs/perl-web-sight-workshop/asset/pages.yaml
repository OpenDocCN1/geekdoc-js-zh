    \ sending a message, making sure that the mail server will accept the sender,\
    \ the addressee, and the message data.\n\nAll our dealings with the mail server\
    \ are enclosed in an eval{} block, so that we can easily end our attempt at any\
    \ time by dying with an error message. We want to be able to send a custom failure\
