    and intelligent columns from industry leaders, http://www.webreview.com


    +   * **Builder.Com** is CNET''s developer central, and has a lot of great articles
    on HTML, http://www.builder.com


    +   * **WebDeveloper.Com** has excellent, up-to-date articles and references for
    Web developers, http://www.webdeveloper.com


    +   * **The World Wide Consortium (W3C)** is the standards association and has
    extensive tutorials, FAQs, and resources on HTML in its current and historical
    versions, http://www.w3c.org/


    +   * **Ziff-Davis** offers a range of everything from developer tools to online
    education. Try http://www.devhead.com for articles and script archives, and http://www.zdu.com
