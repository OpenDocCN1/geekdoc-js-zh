    - Telnet FAQ. This helpful overview of Telnet offers links to software downloads
    and other resources, http://mist.cit.cornell.edu/telnet


    # Tools You''ll Need


    If you don''t have the right tools for a job, that job is certain to take longer
    and cause more frustration. Fortunately, the tools you need to make the most of
    this book are very straightforward. And, unlike the gifts you might be considering
    for your favorite handy-person, the tools we discuss and recommend are either
    quite affordable or downright free.


    # ASCII Text Editor


    An ASCII text editor is simply a plain word processor. You''re going to use it
    and modify the Perl scripts and HTML found in upcoming chapters.


    You can use any text editor you want, as long as it is ASCII compliant. This means
    that the editor must have an option to save the text as raw, unformatted text.


    Let''s take a look at some ASCII editors, by platform, that we have found to be
    particularly useful.


    # Windows


    For Windows users, we recommend Windows Notepad or Allaire''s HomeSite.


    > Even though word processors such as Microsoft Word or WordPerfect offer text-only
    options for saving, you shouldn''t use them. The potential of introducing extraneous
    or unreadable characters in your file is high. We recommend avoiding word processors
    and sticking with straightforward ASCII editors.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Perl Web Site Workshop


    Notepad comes with all versions of Windows and can be found on your hard drive.
    Users of Windows 95 or above simply click the Start button, choose Run, and then
    type notepad. It is a very straight-forward editor with few confusing commands
    or extras on the interface. You simply start to type, and save your text when
    you''re ready.


    Allaire''s HomeSite is a powerful editor used primarily for working with HTML
    documents. However, because the editor is ASCII compliant, it is easily used for
    working with Perl scripts as well as HTML. HomeSite will be especially useful
    for those of you who want some great power tools within your editing interface.


    # Macintosh


    Macintosh users should consider using SimpleText or BEdit.

    As with Windows Notepad, SimpleText is a plain text editor with the Macintosh
    operating system. It is easy to access, and easy to use.


    BEdit (short for Bare Bones Edit) is similar to Allaire''s HomeSite in that it''s
    primarily an HTML editor. It will appeal to those individuals wanting HTML tools
    integrated into the interface, while the ASCII-compliant format saves information
    without formatting codes.


    # Unix


    For Unix, we recommend vi or pico. Both of these editors are enabled from the
    Unix command prompt, by typing vi or pico.


    pico is a great place to start for relative newcomers to Unix. It looks very much
    like pine, a popular Unix e-mail program. Commands are available at the bottom
    of the interface window for easy access.


    vi is widely used, particularly by programmers. It has an interface that works
    using modes (command and insert), and relies on the individual to use the keyboard
    rather than use keystroke combinations or a mouse to maneuver the interface. It
    is usually the default visual editor on a Unix-based system. See Figure 2.1.'
  merge: -1
