    # The Classic Mailto Form


    Perhaps the most popular type of form in use, the Mailto form allows you to create
    a page with standard form input fields for the collection of information from
    your site visitors. This information might include their name and e-mail address,
    and in an area where you can write feedback.


    Upon submitting the form, the information is sent to the server, where it is processed
    by the script, organized, and output to a file that is then sent on the e-mail
    address of your choice. Because this script is a bit long, we''ll split it up
    into a few chunks.


    # How to Use


    +   1. Copy the script into your text editor.

    2. Save the script as mail_form.cgi.

    3. Place the script in your cgi-bin-directory.

    4. Change the permissions to make executable by all users:

    5. Install the Net tools package from CPAN. You can find the tools at http://www.perl.com/CPAN-local/modules/by-module/Net/


    This script uses Net::SMTP to send its mail. If you aren''t running sendlocally,
    or want to use another server, you''ll also have to edit the script, changing
    the $SMTP_SERVER variable to the name or IP address of the server you use.


    mail_form.cgi


    ```

    #!/usr/bin/perl -WT

    $ENV{''PATH''} = ''/bin:/bin:/usr/local/bin'';

    $ENV{''SHELL''} = ''/bin/sh'';

    ```'
