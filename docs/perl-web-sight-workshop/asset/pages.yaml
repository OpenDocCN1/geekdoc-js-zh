    and save the file to your computer.


    +   2. Untar the file by typing `cd name_of_directory tar -zxvf CPAN-1.57.tar.gz`


    +   3. Go to the new directory you created, `cd CPAN-1.57`


    +   4. Build the module by typing `perl Makefile.PL [Lib=/path/to/private/library]`
    at the command prompt.


    +   5. If you answer ''no'' to manual configuration, the module will try to autoconfigure
    its settings.


    +   6. Build the module by typing `make` at the command prompt.


    +   7. Test the module by typing `make test` at the command prompt.


    +   8. Install the module. Type `make install` at the prompt.


    Installing other modules is as simple as typing `perl -CPAN -e shell` to get into
    the CPAN shell, and from there `install [module]`. For example, to install the
    FastTemplate (which you''ll be using in Chapter 8, "Designing with Templates")
    module using this system, you''ll install `GI::FastTemplate`, at the cpan command
    prompt. The CPAN module will automatically download, build, and install the latest
    version of the named module.


    # Installing Modules by Hand


