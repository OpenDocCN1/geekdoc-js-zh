    # All About CPAN


    CPAN stands for Comprehensive Perl Archive Network. It''s a network of mirrored
    Web and FTP sites that contain the biggest collection of cool and useful Perl
    modules.


    CPAN is updated with new modules and versions of existing modules. Before you
    start to write a module of yours, it''s a good idea to check CPAN for similar
    modules. This can save you a lot of time, and because all modules include their
    full source code, you can learn in the process as well. Where is CPAN?


    The easiest way to find a CPAN server near you is to go http://www.perl.com/CPAN
    (see Figure 3.4). You''ll be redirected to an appropriate CPAN site, which you
    can then bookmark for future returns. Of course, you can go back to //www.perl.com
    each time. A searchable version of CPAN is maintained at http://search.cpan.org.


    ![](img/e87117f406caebe24ff9b8f5f2f5901e_41_0.png)'
