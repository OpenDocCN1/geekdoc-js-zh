    # Playing with Random Images


    Everything we''ve done so far in Perl has dealt with reading and writing text;
    but Perl isn''t limited to working with text. Here''s an example of how to work
    with images. We used JPEGs in this example, but you can use other Web graphics
    such as GIFs for your random process.


    You can use this script by setting the source (src) attribute of an image tag,
    like this:


    ```

    <img src="/path/to/random_img.cgi">

    ```


    This is a simple example; it picks a random image from a defined directory. But
    you could easily extend it to serve rotating banner ads, or, as we''ll see later
    on, to draw the images itself, instead of reading pre-built images from disk.


    ![](img/e87117f406caebe24ff9b8f5f2f5901e_118_0.png)


    ```

    #!/usr/bin/perl


    # print the http header for an image in this case

    print "Content-type: image/jpeg\n\n";


    $IMAGE_DIR = "images"; # the directory where our images are, often

    a subid of the root directory


    # open the image directory, or output an error, which will wind up

    # in apache''s error log. The $1 contains the system

    # error message.\opendir(\$IMAGE_DIR) || die "Could not open image directory:
    $!";


    # select only the .jpeg images in the directory,

    # and only the ones we were allowed to read

    @images = grep { /\.jpeg$/ && -r "\$IMAGE_DIR/\$_" } readdir(IMGD);

    closedir(IMGD);


    # pick a random image

    $img_num = int(scalar(@images));

    $img_file = "\$IMAGE_DIR/" . \$images[$img_num];


    # open the image file

    open (IMG, "mg_file") || die "Could not open image file: $!";

    ```'
