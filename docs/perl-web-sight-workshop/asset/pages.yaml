  md: '# Chapter 10 Web Site Publishing Wizard


    The Sitem script needs two SUID scripts. Remember, these gives the person running
    the script privilege levels based on the script–no matter who they are. One of
    these, publish_dbi.pl, is available in Chapter 9. You should have it up and running
    properly–if not, go back to Chapter 9 and set it up. The second script you''ll
    create now.


    You''ll be placing Publish_set.pl in your user directory, and set permissions
    by typing CHMOD +x publish_set.pl.


    # Publish_set.pl


    ```

    #!/usr/bin/perl -wT

    ${ENV{''PATH''} = ''/bin:/usr/bin:/usr/local/bin'';

    ${ENV{''SHELL''} = ''/bin/sh'';

    ${ENV{''IFS''} = '''';

    ${ENV{''ENV''} = '''';


    use lib ''/path/to/library/'';nuse Taintcheck;

    use Story::DBI;

    use Publisher;

    use Publisher::Index;


    use getopt::Long;

    use struct;

    var vars qw(%DSN $DBH $USER $DSN $USER $PASSWORD $TMPL_DIR $PAGE $ITEM);


    $DSN = ''dbi:mysql:hostname=localhost:database=stories'';

    $USER = ''author'';

    $PASSWORD = ''auth_pass'';


    # defaults for templates

    $TMPL_DIR = ''/path/to/templates/'';

    $PAGE = ''basic_index_page'';

    $ITEM = ''basic_index_item'';


    $DBH = DBI::connect($DSN, $USER, $PASSWORD);

    die ''Could not connect to database'' unless $DBH;


    # use the same database connection for stores

    $Story::DBH = $DBH;

    ```


    As we continue, let''s look at some of the technical concepts used in this script.
    The Getopt::Long module. This is part of the standard Perl distribution, and is
    used to read command-line options.'
