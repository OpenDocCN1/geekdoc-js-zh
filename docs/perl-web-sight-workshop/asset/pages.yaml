    # Automating Pages by Day


    You can modify the script to your server''s preferences. For example, if your
    server uses default.html instead of index.html, you can change the script variables
    to make this work properly on your server.


    This Perl script is a very handy tool for Web designers who want to design and
    upload pages in advance, and then have them roll over to the index page (or any
    other page) when the command is invoked.

    This is a clever way to keep entry pages fresh and timely without actually creating
    the entry HTML pages for each of your directories, upholding one at a time in
    day and out. Instead, you can create a batch of pages and they will update upon
    your command. You can also set up "cron" or "at" job on your system to make the
    script run at a particular time every day (see "Modifying the Script," later in
    this).


    # How to Use


    +   1. Copy the script into your text editor.

    2. Save the script as roll_pages.pl.

    3. Place the script in your executable path.'
