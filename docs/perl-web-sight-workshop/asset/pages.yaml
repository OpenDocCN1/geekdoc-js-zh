  md: '# Figure 1.3


    This form is processed using Perl.


    ![](img/e87117f406caebe24ff9b8f5f2f5901e_18_0.png)


    Perl is the only language that can be used with CGI? The answer is no. Other languages,
    as C, are also used at the end of the CGI pipe. However, Perl remains the most
    flexible, easy to use, and common language utilized for this purpose.


    Check out Chapter 4,

    "Working with Forms,"or how to use Perl to set up a variety of functional and
    attractive forms for your Web pages.


    # What''s in Store


    Forms might be the most familiar way Perl is used on the Web, but Perl can do
    a lot more than just manage forms. Let''s take a look at the various things you''ll
    learn from this book in terms of making Perl work for you.


    # Features and Functions


    To help you manage your scripts, and your Web site more effectively, we will provide
    you with very helpful management tools. You will find scripts that help you manage
    other scripts on your site, utilities to rename files behind the scenes, check
    links, squash bugs, and validate code.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Chapter 1 Perl on the Web


    # Customizing Sites


    Perl can help the Web designer add a range of customized features to the pages
    that site visitors see.


    Perl enables you to create time and date stamps. This is helpful in greeting visitors,
    and giving your pages the appearance of being lively and fresh.


    It''s very likely you''ve seen comments on Web pages as "page last updated on
    . . .” This, too, can be done with a Perl script, and also serves to keep audiences
    aware of a site''s timeliness.


    You can find scripts for Web site management tools in Chapter 5, "Features and
    Functions."


    Much of customization relies on browser detection and routing, which we teach
    you how to do with CGI and Perl in Chapter 6, "Customizing Pages."


    Would you like to offer a different graphic selected at random from a list each
    an individual visits your Web page? With time-based functions, this will give
    you the appearance of custom material. Moreover, this effect can be used with
    great creativity, offering playful or intriguing effects for your site visitors.
    Randomization can be achieved using server-side includes. We''ve added all of
    the techniques and related issues to Chapter 6.


    # Fun Stuff


    Certainly, the Web has been and will probably always be a tool. We use it for
    many reasons, but honestly, if the Web weren''t fun, would we really be here?
    The appeal of the Web is not just about shopping and information convenience.
    We have a good time there!


    If you''re looking to create a little rest and relaxation for your site visitors,
    we''ll show you how to add fun stuff such as polls and interactive stories to
    your pages. Just drop by Chapter 7, "Fun and Games," for the necessary scripts
    and modifications.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Using Perl to Publish Entire Web Sites


    Publishing entire Web sites is no small task, which is why it takes up two entire
    chapters! We begin by teaching you how to work with templates, and then show you
    how to use Perl to actually manage and publish a complete, customizable Web site.
    We begin in Chapter 8, "Designing with Templates," and carry the concept through
    Chapter 9, "Creating Your Own Portal."


    # Managing a Web Site


    In Chapter 10, "Web Site Publishing Wizard," we''ll put together a tool box which
    will allow you to manage your tools through your browser. This will give you the
    tools to publish content without worrying about the details of how it''s installed
    and organized.


    # Toward Learning Perl


    While the majority of the focus in this book is to get you using Perl quickly
    and easily, we do hope we''ll inspire some of you to go on to explore Perl as
    a language. To that end, we''ve included a chapter on Perl basics. Chapter 11,
    "Getting Ready to Learn Perl," gets those of you interested in being able to write
    your own custom scripts a bit up to just that.


    # What''s Up Next


    You should now have a clear idea as to what Perl is, how it relates to CGI, and
    how it works on the Web. In Chapter 2, "Getting Ready to Design with Perl," we
