- img_proc: true
  md: '# Figure 7.4

    Playing Hangman.


    ![](img/e87117f406caebe24ff9b8f5f2f5901e_138_0.png)


    Because HTTP is a stateless protocol, you don''t have a built-in way of knowing
    whether the person accessing this CGI is starting a new game or continuing an
    old one, or where he left off in that old game.


    To deal with that, some kind of session tracking is required. This helps the program
    remember who is playing what game, and how he''s doing. Tracking allows the game
    to send the user back the correct information when he makes his next move.


    There are several ways to accomplish a save state. Some are easy, but offer less
    security; others are very secure, but quite difficult.


    In this example we use the most straightforward means of achieving the tracking
    goal that also prevents the most obvious means of cheating. We use a client-side
    cookie, and a server-side session record keyed to the value of that cookie. This
    game session ID tells us the sequence of moves that a specific player is playing
    now. As a result, the client''s browser remembers what game is being played, and
    the server remembers what is happening—which moves are made (and have already
    made) in that specific game.'
