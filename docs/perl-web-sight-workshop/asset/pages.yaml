    \ haven't already set these up, you will likely find the\nsetup phase of this\
    \ process somewhat complex—because it is! Begin\nby checking to see that the following\
    \ modules are in place and\nworking properly:\n\n+   * Publisher\n* Publisher::Index\n\
    * Story::DBI\n* Publisher::Index::Multi (Only if you want to use the my.cgi front\
    \ end. See Chapter 9, \"Creating Your Own Portal\")\n\nAfter you've ascertained\
    \ that everything is functioning properly,\nyou'll need to add a few tables to\
    \ your SQL database.\ndo do that by following these steps:\n\n+   1. Create the\
    \ following file auth.sql and save it to your direct directory.\n2. Type mysql\
    \ -u[root user] -p[password] stories <\\auth.sql on the command line. This will\
    \ generate the tables\nfor your database.\n\nauth.sql\n\n```\ndrop table if exists\
