    \ '/path/to/root';\n$SCREEN_DIR = '/path/to/screens';\n$SCRIPT_DIR = '/path/to/scripts';\n\
    $TMPL_DIR = '/path/to/templates';\n\n# MAIN\neval { main(); ); }; $_START__ =\
    \ __LINE__;\n\n# ERRORS\nif ($@) {\n  chomp($@);\n```"
