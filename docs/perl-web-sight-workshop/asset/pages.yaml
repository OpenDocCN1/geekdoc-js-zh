  md: '# CHAPTER Fun and Games


    Everyone needs a break now and then, and this chapter will show you how to give
    your visitors some much-needed RtR. Of course, although you use all these scripts
    for fun, can be applied for serious reasons, too.


    We''ll look at a couple of scripts that allow you to display time and page hits
    using GD, a Perl interface that lets you draw pictures and use lines, shapes,
    and text.


    Then, we''ll move on to an interactive script for fun and function: a user poll.
    This script allows you to give a visitor a multiplechoice of options based on
    your own content. The script records the votes, and then displays the results
    in a nice bar graph. Whether a Cosmopolitan-style love vote or a serious political
    poll, this script is very good whenever you''d like to add interactivity to your
    site.


    Finally, we''ll show you how to create the much-loved game of Hangman. A bit more
    complex than the other scripts in this chapter, you''ll see Perl can be used only
    to create an interactive interface for a user, but store information intelligently,
    behind the scenes.


    # Displaying Time


    Unisys, the company that owns the patent for compression used in LZW GIFs and
    other file formats, used the author of GD. Now only .png or .jpg files can be
    generated by GD. Because many browsers cannot render .png files, we''re going
    to use .jpg files.


    If you''d like to add a digital clock to your page, you can do so using this CGI
    program. It taps into the power of GD, a Perl interface for graphics. GD already
    be in existence on your server, but if it''s not, a visit to CPAN will help you
    get the module.


    # How to Use


    +   1. Copy the clock.cgi code into your text editor.

    2. Set the path to the library where GD resides.

    3. Save the code as clock.cgi and upload it to your cgi-bin. Once there, set permissions:
    chmod a+x clock.cgi.'
