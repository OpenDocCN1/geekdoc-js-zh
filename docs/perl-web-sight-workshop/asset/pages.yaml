    \ and point the way to the modules and other files that the script will need.\n\
    \n# Siteman.cgi\n\n```\n#!/usr/bin/perl -wT\n\n$ENV{'PATH'} = '/bin:/bin:/usr/local/bin';\n\
    $ENV{'SHELL'} = '/bin/sh';\n$ENV{'IFS'} = '';\n$ENV{'ENV'} = '';\n\nuse lib '/path/to/library';\n\
    use Taintcheck;\nuse Story\\::Template;\nuse Story\\::DBI;\nuse\\::Publisher;\n\
    use Publisher\\::index;\n\nuse CGI;\nuse CGI::FastTemplate;\nuse strict;\n\nuse\
    \ vars qw(DBH $DSN $USER $PASS $CGI $__START);\n$WW_ROOT $SCREEN_DIR $SCRIPT_DIR\
    \ $TMPL_DIR;\n\n# GLOBALS\n$DSN = 'dbi:mysql:hostname=localhost:database=stories';\n\
