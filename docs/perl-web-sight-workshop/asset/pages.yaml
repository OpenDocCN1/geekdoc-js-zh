  md: "# Chapter 4 Working with Forms\n\n```\n<html>\nERR;\n\nexit(0);\n\n}\n```\n\
    \nNext, and last, come a revision of the untaint_params() and untaint() functions\
    \ used in better.cgi and guestbook.cgi. There are couple of important differences\
    \ between these functions and the ones in the previous script. First, untaint()\
    \ allows a broader range of punctuation to be submitted, in keeping with the more\
    \ generalized mail_form.cgi, which may be called from any number of different\
    \ forms.\n\nSecond, untaint_params() is revised to work with fields that submit\
    \ multiple values. To do this, we take advantage of a quirk in Perl's handling\
    \ of arrays: They can't be nested by inserting one array into another (although\
    \ you can embed one array in another by using references).\n\n```\n@array = ('one',\
    \ 'two', 'three', 'four', 'five');\n```\n\nis exactly equivalent, in function,\
    \ to this code:\n\n```\n@array = ('one', 'two', 'three', 'four', 'five');\n```\n\
    \nThey produce the array ('one', 'two', 'three', 'four', 'five'). We take advantage\
    \ of this by using a temporary array, and pushing each field value into that array;\
    \ this we can deal with every field the same way, as if it were an array. Most\
    \ of them will just be arrays with only one value.\n\n```\n# security routines\n\
    \n# untaint_params\n# in: CGI object\n# out: trusted params, or dies if suspicious\
    \ input seen\nsub untaint_params {\nmy $q = shift;\nmy (@, $k, $sp, $t, $safe);\n\
    \n@k = $q->(@k) {\n  foreach $k (@k) {\n    @tmp = ();\n    push @tmp, $q->param($k);\n\
    \  }\",\n```"
