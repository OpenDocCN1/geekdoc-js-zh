    # Using Perl with SSI


    Up this point, we''ve covered CGIs that produce whole HTML pages. But this isn''t
    the only thing CGI can do. Although the output of a CGI might comprise a complete
    HTTP conversation—so you can''t, the most part, stick a CGI in the middle of an
    otherwise static page—you can play some "stupid Web server tricks" to get dynamic
    content into another otherwise static page.


    A easy way to enable server-side includes (SSIs) in your Apache setup. Usually,
    this is set up by your system administrator. Check with your ISP to if you can
    use server-side includes. We''ve included some simple information to help you
    set up an Apache server to handle SSIs.


    Apache isn''t the only server that can handle SSIs. You''ll need to check with
    your server documentation or your systems administrator for more information if
    you''re working with a server than Apache and would like to use SSIs.


    SSI is often used to include pieces of static HTML within other static HTML pages—for
    example, to put a standard navigation bar on all the pages of a site, without
    having to code that bar on each individual page.


    You can also use SSI to run CGI scripts. This section will teach you how to set
    up Apache to enable SSI, and a selection of short examples of what SSI will let
    you do.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Perl Web Site Workshop


    # Setting Up Apache to Enable SSIs


    Here''s what you need in your Apache httpd.conf to enable SSI. First, in each
    <Directory> section in which you''d like SSI to be active, make sure the Options
    line includes +Includes. To use SSI across your site, you can edit your main root
    <Directory> section like this:


    ```

    <Directory "/path/to/site/root">

    Options Indexes FollowSymlinks ExecCGI +Includes

    ```


    Then you''ll have to tell the server which files to process through the SSI systems:


    ```

    AddType text/html .html

    AddHandler server-parsed .html

    ```


    # Including Time and Date


    Many sites want to include the current date and on a page. Using SSI, this is
    very easy. First, you''ll create the echo_date.cgi script, upload it, and set
    the appropriate permissions on the file, just as you would any other CGI file.


    echo_date.cgi


    ```

    #!/usr/bin/perl -w


    use lib ''/path/to/library'';

    use TimeFunc;

    print "Content-type: text/html\n\n",&date_string(time);

    ```


    The backward single quotes around /usr/games/fortune are called "backticks," they''re
    a shorthand way of running another program on the system and reading the output
    from that program. You can do this with just about anything, from games like fortune,
    to system utilities netstat and ps. Ain''t a Unix great?


    To include SSI in a page, you''d add this to your HTML:

    <!--include virtual="/path/to/echo_date.cgi" -->


    Now, rename the page with an .html extension. When a visitor pulls up this page,
    it will echo the time and date.


