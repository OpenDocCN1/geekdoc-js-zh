    ![](img/e87117f406caebe24ff9b8f5f2f5901e_71_0.png)\n\n# ## Greater Detail: Accuracy\
    \ Checking in the Mailto Script\n\nWe check the accuracy of the input with untaint_params(),\
    \ which calls untaint() on each of the form submitted to the script. The accuracy\
    \ of the input is assured by checking for the presence of required fields via\
    \ the %required variable. %required is a \"hash,\" also called an \"associative\
    \ array\". Hashes are very handy for storing a group of named values. Hash values\
    \ in Perl always starts with a %, except when using a single item in the hash.\
