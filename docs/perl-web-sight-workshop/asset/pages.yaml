  md: '# Perl Web Site Workshop


    # There''s More Than One Way To Do It


    Just because you see die "Nothing found" unless @hits in a book doesn''t mean
    you can''t write it as unless(@hits) { die "Nothing found"; }, or even if (!@hits)
    { die "Nothing found"; }, if you like like one of those better. The upside of
    Perl''s wacky syntax is that you have a lot of freedom to make your code readable
    for yourself. The downside is that everybody else has that freedom too, and a
    lot of them don''t agree with you, or each other, about what "readable" really
    means!


    For any programming problem you''ll come across, you''ll find a multitude of solutions
    in Perl; you''re free to choose the one that works for you, or just the one that
    you like best. You don''t have to accept anybody''s solutions if you don''t like
    them because there''s always another way. Which brings us to...


    # Know When to Reinvent a Wheel or Two


    And of course, when not to. It''s your call. I have to write (among other things)
    an SMTP relay server, a proprietary encryption-enabled beta authorization system,
    and a Perl client for a proprietary gaming service. Each in less than a few hours.


    This not not a testament to the power of Perl, or to my programming skills, as
    much as it is to the power of the community. In each of these examples, the solution
    was built by gluing blocks of code that others had written and donated to the
    community!


    So you don''t always have to reinvent the wheel, nor should you try. Check the
    upcoming section, "Resources Want, Stuff You Need."


    On the other hand, sometimes you really want your own wheel, and nobody else''s
    will do. That''s fine—Perl is a great-invention language because it makes experimentation
    easy. The important thing is to know when you need to go it alone, and when you
    don''t.


    # Use the Debugging Tools


    Perl has a number of built-in debugging helpers, all of which can make your life
    a whole lot easier. The most useful are the -w and -d command line arguments,
    and the modules strict, Carp, for use within scripts.'
