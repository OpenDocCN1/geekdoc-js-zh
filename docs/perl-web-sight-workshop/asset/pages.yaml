    variable to calculate the real line number where the error occurred, and substitutes
    that for the line number in the error message.


    The second line in the pair is a fallback, making sure that whatever is between
    at and line in the error message is the name that we want users to see. One pitfall
    to beware: the special == operator. If you write


    ```

    $holiday_card = s/Easter/Passover/g;

    ```


    then you''ll replace all the instances of Easter in $holiday_card with Passover.
    But if you write


    ```

    $holiday_card = s/Easter/Passover/g;

    ```


    $holiday_card will now contain the number of times Easter is replaced with Passover
    in the special variable $_


    We also use a regular expression in the following function:


    ```

    my $ok_chars = ''[\w]''; die "Illegal character(s) in input\n($Val)" unless $Val
    =~ /^($ok_chars+)$/;

    ```


    ```

    return $1;

    ```


    In this case, we use the // operator: we are matching, not substituting. Notice
    that you can use a variable to make a regular expression more readable: the value
    of the variable will be interpolated into the pattern, just like it would be into
    a string.


    The ^ and $ characters at the beginning and end of the pattern mean that the expression
    must match from the beginning to the end of the script.


    The + after $ok_chars means that we want to match at least one character, with
    no maximum number to match.


    Finally, but most importantly in this case, by putting our pattern in parentheses,
    we set the special variable $1 to whatever matched our pattern. We return that,
    instead of the original input to the function: that''s how it works in Perl.


    It''s assumed that if you''ve processed the variable through a regular expression,
    you know what you''re doing with it, and should be allowed to do what you want.


