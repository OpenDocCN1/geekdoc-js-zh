    # Publishing Pages via E-mail


    This Perl script gathers its from e-mail, instead reading the story off of the
    local disk. This allows you to add content from a remote location directly to
    the disk as from the local machine.


    To set this up requires a new module, called Story::Text::Mail.pm. This module
    extends Story::Text you worked with earlier by adding tools that authenticate
    the e-mail message against a list of authorized senders, acceptable publication
    directories, and a pass phrase. The e-mail headers will be stripped from the message
    before parsing it as a story.


    The first thing you''ll want to set up the module, as follows:


    +   1. Copy the module into your text editor.

    2. Save the module as Mail.pm

    3. Place the module in the Story/Text directory of your Perl library. If your
    Perl library is /home/htdocs/lib/perl, save the module as /home/htdocs/lib/perl/Story/Text/Mail.pm.


