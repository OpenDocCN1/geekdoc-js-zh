  md: '# CHAPTER 4nWorking with Forms


    Forms work by combining standard HTML and, most often, CGI with associated scripts.


    The HTML is used to create a form''s display elements, such as text fields and
    boxes, check boxes, radio buttons, and submit and reset buttons. The HTML also
    contains information that the inbuilt data to the server upon submit. At this
    point, CGI takes over, and introduces the input data to the script for processing.


    In this chapter, we''re going to take a look at the behind-the-scenes processing.
    We''ll start small, with a simple script, and then show you how to make the form
    and resulting script process more complex and functional.


    Before we move on to look at forms, we want to point out some basic programming
    conventions used in upcoming scripts. This will help you familiarize with the
    script''s contents and navigate them more efficiently.


    # Some Programming Basics


    This script makes use of the object-oriented interface to CGI. CGI.pm is a Perl
    module that provides Perl coders with CGI scripts by reading CGI input and writing
    out HTML pages. CGI.pm is included in the standard Perl distribution. You can
    easily find out if you have it: type perl CGI at the command line; if you get
    the document, you got it; if not, you can download it from CPAN (see Chapter 3,
    “Scripting Basics").


    > This is a comment. Use comments to clarify what you''re doing at any given point
    within the code. A-colon indicates the end of a line of code. Brackets indicate
    groups of code. These indicate variables. We discuss these in greater depth in
    Chapter 11, "Getting Ready to Learn Perl."


    # A Simple Gateway Script


    This script is a very simple gateway script that displays a form, or echoes the
    form''s input back in a simple page. The script is self-contained, meaning that
    you will not create an HTML form with input fields in order for it to work. However,
    you will create an HTML page to access it.'
