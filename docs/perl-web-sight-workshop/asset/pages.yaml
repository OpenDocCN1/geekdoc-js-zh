  md: '# Chapter 2 Getting Ready to Design with Perl


    Unix Help

    This is also a vast area, but we''ve selected a few choice gems:


    +   - Unix FAQ. Questions and answers gathered from Usenet, http://www.cis-ohio-state.edu/hypertext/usenet/unix-faq/top.html

    - UNIXhelp for Users. This is an excellent beginner''s resource, well organized
