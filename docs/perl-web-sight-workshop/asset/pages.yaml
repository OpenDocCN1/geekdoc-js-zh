  md: '# Chapter 11 Getting Ready to Learn Perl


    +   * Perl defines a lot of special global variables, too many to go into here.
    The important ones to remember are $, _, @ARGV, $! and $.


    +   * $_ is the default scalar variable. If you see an operation that doesn''t
    appear to be acting on anything (e.g., while(<>) { print; }), it''s really using
    $_


    +   * @ is the list of parameters passed to a function. When the first line of
    a function is something like $var = shift; @ is the array you''re taking the top
    value. We''ve used the shift syntax in all of our scripts, you can just well say
    my ($var1, $var2, $var3) = @;


    +   * @ARGV is the array of command-line arguments passed to a script called from
    the command line


    +   * $! is for system error strings; if open(FILE, "$file-name") fails, $! will
    tell you why


    +   * $$ is set for errors that occur inside eval{} blocks. We use this variable
    extensively in our CGI scripts, to catch errors and display them to the user


    # Getting the %&&$ Manual!


    This section can be referred to as "perdoc is my new best friend!


    Even if you don''t have any Perl books, and can''t find any other outside sources
    of reference and examples, you have plenty of documentation at hand. Perl has
    built-in documentation in POD ("Plain Old Documentation") format, which can be
    read with the perdoc command.


    You can get help with built-in Perl functions and operators with the perdoc perfunc
    and perdoc commands, and get documentation about any module with perdoc [module
    name], where [module name] is entered exactly as in a statement. (for example,
    for CGI::Carp, you can say perdoc CGI::Carp). The manual page perdoc contains
    a table of contents for the Perl manual pages and is a good starting place.


    Many people find perdoc difficult and not at all user-friendly. You may wish to
    choose a good resource book. We''ve listed several to choose from later in this
    chapter.


    For help with the perdoc system itself, you can type perdoc.'
