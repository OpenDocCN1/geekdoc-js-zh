    # Taintcheck\n\n```\npackage Taintcheck;\n\nuse Exporter;\n\n$ENV{'PATH'} = '/bin:/usr/bin:/usr/local/bin';\n\
    $ENV{'SHELL'} = '/bin/sh';\n$ENV{'IFS'} = '';\n\n@ISA = qw(Exporter);\n@EXPORT\
    \ = qw(untaint_params untaint);\n\nuse CGI;\nuse strict;\n\n# untaint_params\n\
    # in: CGI object\n# out: untrusted params, or dies suspicious input\n#\n# This\
    \ version of untaint_params supports multi-valued parameters.\n# It calls untaint()\
    \ on each of the values.\nsub untaint_params {\nmy $sq = shift;\nmy (@k, $sk,\
    \ @tmp, @safe);\n\n@k = $sq->keywords;\n\nforeach $k(@k) {\n    @tmp = ();\n \
    \   push @tmp, $sq->param($k);\n\nforeach $t(@tmp) {\n    push @safe, untaint($t);\n\
    }\n$sq->param($k, @safe);\n}\n}\n# untaint\n# in: untrusted scalar\n```"
