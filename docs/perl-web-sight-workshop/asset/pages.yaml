  md: '# # CHAPTER 10 Web Site Publishing Wizard


    In this chapter, we''ll use the skills you''ve built through this book to create
    a complete browser-based, Web site management system. Imagine sitting at your
    desk simply entering in text stories and images and having an easy-to-use Web
    interface that leads you and your coworkers through the daily management of your
    site.


    Sounds great, right? It is. But, it takes organization and structure to put this
    Wizard into place. To that end, this chapter will require a little more intense
    study of where and how each script and module work to achieve the goal.


    The centerpiece of this system is the Site Manager script, sitem.cgi--affectionately
    termed "Siteman." It builds on the modules, scripts, and concepts from earlier
    chapters. When you use and understand the script in this chapter, you''ll be able
    to create and update a complete, dynamic, customizable Web site directly from
    your browser (Figure 10.1).


    Figure 10.1 A publishing interface built with Siteman.


    ![](img/e87117f406caebe24ff9b8f5f2f5901e_230_0.png)'
