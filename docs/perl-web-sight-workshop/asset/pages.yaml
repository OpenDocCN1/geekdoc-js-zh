- img_proc: true
  md: "# Chapter 3 Scripting Basics\n\nNote that the .html extension is the one that\
    \ we use. The .htm extension came about as a result of Microsoft's early limitations\
    \ on file suffixes. Although you can use either depending upon your server configurations,\
    \ we recommend sticking to the .html convention unless your systems administrator\
    \ requires you to do otherwise.\n\n# Creating File Directories\n\nFile directories\
    \ are the locations where files are stored on a server. The “root” directory is\
    \ the first directory in the tree, and subdirectories are created beneath it.\n\
    \nAt a minimum, you'll need two directories to run the scripts in this book—one\
    \ in which to keep your CGI scripts, and another in which to keep command-line\
    \ scripts. If you do not have root access—which occurs when you're one of many\
    \ members on a large service provider's server—you will need to create a third\
    \ directory for modules and other library files.\n\n> Many ISPs give you access\
    \ to their cgi-bin directory, the directory where CGI scripts go. If you have\
    \ access to this, you won't need to create one of your own. You will need to record\
    \ the correct path and add that to your scripts wherever necessary.\n\n# About\
    \ the CGI Directory\n\nThe cgi-bin directory is where you'll place the majority\
    \ of your CGI scripts. This directory, the others, should not be placed in your\
    \ regular HTML documents. One common setup is to keep your regular HTML documents\
    \ under /home/htdocs/html, and your CGI scripts in /home/htdocs/cgi-bin.\n\nYou'll\
    \ have to follow the configuration directories for your Web server to set up the\
    \ cgi-bin directory to allow execution of scripts.\n\nIf you use Apache, make\
    \ the following appears in your main server configuration file. This file is named\
    \ httpd.conf and is generated by Apache upon installation to the conf directory\
    \ under the Apache installation prefix.\n\n```\nScriptAlias /home/htdocs/cgi-bin\
    \ /cgi-bin\n<Directory /home/htdocs/cgi-bin\n  options +ExecCGI\n</Directory>\n\
    ```"
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Perl Web Site Workshop


    If you want to keep some CGI scripts in directories other than cgi-bin, you''ll
    have to configure your Web server to recognize all files that end in .cgi scripts.


    If you''re using Apache, you can do this by making these lines appear in your
    httpd.conf.


    ```

    (1)AddHandler cgi-script .cgi

    ```


    # Setting Up a Perl Script Directory


    CGI scripts are only half the story of Perl on the Web. Perl is also tremendously
    useful on the back end, and in this book there are several utility scripts that
    you''ll run from the command line on server.


    Do not put command line Perl scripts in your cgi-bin directory. If you do, you
    open up your server to dangerous hacker activity. Think security!


    A good choice for a utility script directory is the bin directory in your home
    directory. If you have root access, you could choose instead to put scripts in
    `/usr/local/bin`. Because a lot of other software installs it there, wading through
    a bunch of other programs to find yours might be confusing. Therefore, we recommend
    using the subdirectory ~/ underneath your home, or root, directory.


    # Making a Perl Module Library


    If you have root access, put all your modules in the pre-existing /usr/lib/perl/site_perl.


    The Perl library is where you''ll keep the modules you create yourself following
    our examples, and any outside modules you install.


    If you don''t have root access, or you don''t want to put your modules in site_perl,
    you''ll need to create a Perl library directory.


    If your Web document root is `/home/htdocs/www`, a good choice for this would
    be `/home/htdocs/lib/perl`.


    # Setting File Permissions


    You need to learn a few commands and concepts that will help you keep your site
    secure, and make it possible for you to allow visitors to do exactly (and *only*
    exactly) what you want them to be when they access your site.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Chapter 3 Scripting Basics


    If you''re unfamiliar with Unix, the information in this section may seem confusing
    at first. But bear with us—we show you how to do this step-by-step as we take
    you through the scripts, you''ll get the hang of it. But we still feel that some
    background is of great importance here.


    For more help with Unix, see the resource list at the end of this chapter.


    Unix is a multi-user operating system, and as such, it has the concept of the
    “owner” of a file built into it. Generally, the owner is the creator of the file.


    Because Unix was designed to allow multiple users (who might not know or trust
    each other) to work together on the same computer, it also includes the concept
    of file “permissions,” which allow you to determine who can do with your files.


    # chmod


    Change mode, or chmod is the command you use to change the permissions (or mode)
    of a file. You can only use it on files that you own, unless you have root permissions.


    From the command line, you type **chmod mode filename**, where mode is either
    numeric or symbolic setting for the permissions you want to give the file, and
    the **filename** is the name of the file for which you are setting the permissions.


    The numeric modes are three- or four-digit octal (base 8) numbers, like 0640 or
    755. The first digit from the left (if present) sets special bits, making the
    file executable SGID or SUID (Set User ID and Group ID). The second sets permissions
    for the owner of the file, the third for the owning group, and the last for all
    other users. The numbers are a combination of three bits, with values of 4, 2,
    and 1. If a number has a 4 in it, you can read the file. If it has a 2, he can
    write to (and delete) the file. If it has a 1, she can execute it as a program.


    For example, `chmod 777 file.pi` gives all users permissions for the file. `chmod
    744 filename` means that the owner can read, write, and execute, but everybody
    else can only read. `chmod 755 filename` (the mode you''ll use for CGI scripts)
    means that the owner can do anything, and all other users can only read and execute
    the file.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Perl Web Site Workshop


    u+x means execute and is a symbolic way of saying that the user is allowed to
    execute the program. Similarly, a+x means execute and means, literally, anyone
    can execute the program.


    Setting modes symbolically is easier for most ግን than dealing with octal numbers.
    For example, the symbolic mode is [user][+][permission]. For example, a symbolic
    set would be typed chmod u+x filename (see Figure 3.2). This allows the owner
    to execute the file; chmod a+x filename allows anyone to write the file; chmod
    g-w filename takes permission away from the owning group.


    We''ll use the symbolic process in this book, but if you''d like to use the numeric
    approach, free to do so—just be certain you''re setting up public files with appropriate
    permissions!


    # 3.2

    Changing mode using the symbolic approach.


    ![](img/e87117f406caebe24ff9b8f5f2f5901e_40_0.png)


    The chmod man page (type chmod at the command line on your server) for a more
    detailed explanation.


    # chown


    This is "change ownership," or chown. You''ll use this command to change ownership
    of a file. For the most part, you will probably not have to have permissions to
    use this command—but it''s good to know.


    The basic command is chown owner filename.


    If you need to do complex operations, consult the manual (type man chown) for
    instructions (see Figure 3.3).


    # SUID Scripts


    Sometimes in the course of human events you may need to allow a user to execute
    a script with more permissions than he has. One example would be an individual
    to write a file to a directory that the public does not have access to.'
