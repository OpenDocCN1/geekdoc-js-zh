    $ENV{'SHELL'} = /bin/sh;           # set a standard shell\n$ENV{'ENV'} = ''; \
    \                  # clear ENV\n$ENV{'IFS'} = '';                   # and IFS,\
    \ just to be safe\n\nuse CGI;\n\n# strict forces you to use good programming practices\
