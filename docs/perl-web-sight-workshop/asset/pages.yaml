    CPAN is your one-stop shop for modules and other helpful Perl files.


    ![](img/e87117f406caebe24ff9b8f5f2f5901e_42_0.png)


    CPAN contains the selected wisdom of the entire Perl community; hundreds of Perl
    modules, several worth of documentation, and the entire Perl distribution. If
    it''s written in Perl, it''s helpful and if it''s in CPAN.


    The CPAN architecture is the creation of Jarvis Houston and Andreas König, and
    Tim Bun justly maintaining the Perl Modules List, which is in this document but
    has more about creating modules and less about what modules endure.


    This document is CPAN, a "front end" to CPAN: The part of this document is about
    what''s in the CPAN and how you can contribute to this world by submitting your
    modules for the rest of the world to use. But the other part of this document
    is about modules on the CPAN: if you add a module to the CPAN, or would like to
    change one of these descriptions, please notify Je. Owen. I want your module in
    the New Modules column if it is of general interest to the Perl community (If
    you just want to install Perl, you can get the Perl from the CPAN distribution).


    What''s a module?


    You''ll find a technical explanation in the libnet documentation, but here''s
    the module: a freely available Perl 5 utility that you can download and use from
    your Perl 5 programs. Many modules are single Perl files ending in .use, others
    are complex, and need to be considered on your machine, trivially because they
    make use of Document Drone.


    # Getting Modules from CPAN


    You can get modules from CPAN using your usual Web or FTP to search the module
    listings, and browse by name, author, and category.


    Once you find the module you want, you can use your browser or FTP to transfer
    the file to your server, or to your home/office machine and then to your server—depending
    upon what your setup is.


