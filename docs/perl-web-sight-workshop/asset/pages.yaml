  md: '# CHAPTER Getting Ready to Learn Perl

    11


    So, you enjoyed working with Perl so much you want to learn it. That''s great!
    We want to help you get off to a strong start. This chapter takes a look at some
    of the basic syntax—all of which you''ve encountered when actually working with
    the code in the book. We''ll provide definitions and give you you some frame of
    reference to understand what important syntax structures do.


    We then provide you with some invaluable tips to help you prepared to learn Perl—wisdom
    that will certainly help you to avoid pitfalls and frustrations along the way.
    Finally, we offer you a number of resources for furthering your education.


    # Arrays, Expressions, Scalars, Oh My!


    Throughout this book, a variety of programming terms have been put to use. We
    talk a lot about these in the tips section (as well as throughout the book), you''ll
    want to read this stuff to get the most out of the tips.


    Knowing the basic terminology also helps some of the mystique out of the programming
    language—neatly packaging individual concepts into logical blocks instead of having
    figured out long strings of seemingly undecipherable code.


    The following list gives a brief explanation of what common concepts are


    Array


    An array is an ordered list of values. To get to a value, arrays require an index—to
    show which of the elements you''re interested in. For example, @links is an array,
    and $links[3] is an element in the array.


    Expression


    An expression is a piece of code that has a value. Like 2+5 is an expression,
    and so is @foo=grep ! /\^.*.\{1,2}\$\/$, readdir DIR.'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'An expression that does an entire bit of work on its own is called a *statement*.
    Statements in Perl are followed by a semicolon.


    # Function


    A function is a block of code that optionally takes input and produces some kind
    of output. A Perl function is the same as a math function in math, technically
    mapping input to output.


    # Hash


    A hash is a special kind of array which is accessed in key-value pairs instead
    of numerical. `%fields` is a hash and `$fields{''From''}` is an individual element
    of a hash.


    # Variable


    A variable is a storage area for a value or a group of values. The label attached
    to the variable is the *variable name*.


    # Scalars


    A scalar is a single value, one number or one string, within your Perl script.
    Scalar values in Perl are preceded by a dollar sign. `$links[1], `$fields{''To''}`
    and `$name` are all scalar values, and `$name` is a scalar variable.


    # Seven Tips for Making Perl Fun


    Or should read that “Making Fun of Perl?” Either way, We offer the following guidelines
    to ensure that you get Perl off to a good start. The final objective, however,
    no matter your intermediate goals—is to have fun.


    # Start Small


    Programming can be difficult to learn, and frustration born of having to deal
    with too much information at once doesn''t make it any easier. Start with small
    scripts and programs, and work your way up.'
  merge: -1
