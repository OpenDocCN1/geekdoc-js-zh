    Okay, you''re there through that step. But there''s miles to go before you rest.
    We promise it will be worth it, and we''ll even serve up cookies along the way.
    Next in line, the CGI you''ll need.


    # CGI


    Naturally, you''re going to need to use CGI to help shuttle all of the information
    around. Here is a look at the script that pulls it all together.


    # my.cgi


    This CGI implements the basic personalization for a portal style “newsy” Web site.
    It uses a cookie to track user id and preferences in a SQL database using DBI.
    A user can pick sets of stories he or she wants to see regularly on the index
    page (Figure 9.1).


    Users are tracked silently, and don''t need to register or sign up to enable the
    page.


    Figure 9.1

    Pick the stories you want!


