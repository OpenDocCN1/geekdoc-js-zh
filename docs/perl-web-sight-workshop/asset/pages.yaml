    better.cgi, we''ve used regular expressions twice, in two different ways. The
    first pair of expressions


    ```

    $0 -= s//(eval) line (d+)/$(CGI) - " line . \

    ($ START -1);$0 -= s/ at .*(($ line )/$1$(CGI)/2;

    ```


    uses''s s/// operator to substitute between the second pair of slashes for whatever
    part of the subject string ($) matches the regular expression (usually called
    a pattern) in the first pair of slashes.


    In this case, we''re looking in an error message, which is likely to look something
    like this:


    Something wrong at (eval) line 60.


    Our first substitution removes the word (eval), replacing it with the name of
    the script, as set in the $CGI variable, uses $ START'
