  md: "# Chapter 7 Fun and Games\n\n```\n# SUBROUTINES\nub main {\nmy $q = new CGI;\n\
    \nuntain_params($q);\n\nmy $game;\n\n# No input? must be a new game\nunless ($q->param)\
    \ {\nnew_game($q);\nreturn;\n}\n\n# we also want to provide a way to start a new\
    \ game\n# explicit!\nif ($q->param('submit') = /new_game/i) {\n\n$q->delete_all($q);\
    \ # clear all params\n&new_game($q);\n}\nelsif ($q->param('session_id')) {\n\n\
    # try to restore the past game state\ndie \"Game out of date or incorrect \" *\
    \ \n($q->param('session_id'))\n\". Please start a new game.\".\nunless ($game\
    \ = restore_game($q->param('session_id')));\n\ncontinue_game($game,$q);\n} else\
    \ {\n\n# something has gone wrong - probably bad input\ndie \"No game submitted.\
    \ Please start a new game.\"\n}\n```\n\nRestoring a game is fairly straightforward.\
    \ The game state is stored as a record in a DBM file, which makes it easy to quickly\
    \ retrieve the full record. Of course, we must know the record key (which is in\
    \ this case we've set as the game session ID).\n\nThe formatting of the record\
    \ is left to another useful module called FreezeThaw. We need FreezeThaw because\
    \ we can't store the hash we use as a game record in a DBM database directly.\
    \ Only scalar values (strings or numbers) can be used as DBM keys and records.\
    \ FreezeThaw translates complex Perl data types into strings, and then back again,\
    \ so it makes it easy to use the data format we want, without worrying about the\
    \ minutiae of storing it in string format and reading back again."
