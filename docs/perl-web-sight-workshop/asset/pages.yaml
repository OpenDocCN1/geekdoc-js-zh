    Actually, new() is a class method that can also be used as an object method.

    We''ve used it as a class method in our scripts.


    db_connect() is a class, not an object, method. All the Story::DBI objects created
    in one session will share the same database connection. You''ve seen it before:
    new(), in each of the classes where we''ve used it, is a class method.


    ```

    sub db_connect {

