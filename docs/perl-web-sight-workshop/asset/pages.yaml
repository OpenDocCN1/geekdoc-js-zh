    - http://www.icthus.edu/CGI-City/books.shtml (books)

    - http://www.cgi-resources.com/Documentation/ (tutorials and helpful)

    - http://www.cgi-resources.com/Books/ (books)

    - http://www.cgi-resources.com/Magazine_Articles/ (helpful articles)


    CGI Resources.Com'
