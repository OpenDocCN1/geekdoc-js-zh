    directory, you create a\nsecurity problem.\nSUID scripts should be\nplaced in\
    \ a separate utility\ndirectory, clearly outside of\nthe cgi-bin directory.\n\n\
    Getopt::Long is a good choice for scripts that are called from other\nscripts\
    \ (known as cron jobs). The long option names are much easier\nto interpret six\
    \ months down when you're trying to figure\nout what script you once wrote is\
