- img_proc: true
  md: '# Getting Ready to Design with Perl


    With an understanding of what Perl is, and a general sense of how you can use
    it to enhance your Web sites, it''s time to make sure you have the knowledge and
    software necessary to work with the scripts in this book. In this chapter, we''ll
    let you know what skills you''ll need and what tools you''ll want to have. Then,
    we''ll provide you with questions to ask your Internet Service Provider (ISP)
    so you can make sure your server and account is set up to support CGI and Perl.


    Readers of this book will undoubtedly come from a variety of backgrounds. Some
    of you have programming experience, and are using this book primarily for the
    scripts and assorted tips it contains. Some of you are working designers who don''t
    have enough time in the day to dedicate learning programming, yet want to put
    the power of programming to work on your Web sites. Others are trying to find
    ways to enhance personal or business-related sites, but have no interest in learning
    how to program.


    Because most readers will likely be using Windows or Macintosh computers to create
    Web sites, we have presented the information in this chapter (and this book) from
    that perspective.


    Although we will be spending time in the Unix environment, skills are not required.
    For those of you who might be a little intimidated by the Unix environment, we
    promise to provide plenty of descriptions and easy help get you comfortable. And,
    for those you who want to work in a Unix environment, we''ve naturally included
    information that will be helpful to you.


    # Skills You''ll Want


    In this section, we''ll let you know exactly what skills you''ll need for this
    book, and at what level. This way, no matter your current skill level, you''ll
    know how to make the most of Perl Web Site Workshop.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# HTML


    We expect you to have a good understanding of HTML in order to use this book.
    You don''t need to be an HTML guru, but you do need to know how to get around
    an HTML document and how to code HTML properly.


    If your familiarity with HTML is based on What-You-See-is-What-Get (WYSIWYG) Web
    authoring tools like Microsoft FrontPage and Adobe GoLive, believe your design
    skills will be significantly enhanced if you do seek out basic HTML skills. Without
    strong HTML skills, your ability to work with Perl on the Web will be greatly
    restricted. Fortunately, there are a lot of good books and Web sites on learning
    the basics of HTML.


    # Unix


    If you''re unfamiliar with Unix, worry not! We''re going to walk you through what
    you need to know. We''ll have detailed instructions wherever necessary, and plenty
    of sidebars offering power commands and resources to help you out.


    Unix skills are a plus, of course. If you''re an old pro at Unix, stick with what
    you know. But, if you''re more familiar with the Windows or Macintosh environments,
    use the tools with which you are familiar, or select from those we recommend.
    We''ve made a point to include sidebars offering power commands and additional
    resources wherever applicable.


    # FTP


    Most of you probably have HTML experience, so you already know that FTP means
    File Transfer Protocol. FTP allows you to transfer files from one computer to
    another computer on the Internet. For our purposes, FTP will be used primarily
    to move your scripts from your desktop workstation to the Web server where they
    will reside.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Perl Web Site Workshop


    # Telnet


    We step you through the process of editing and managing files using a Telnet connection
    in Chapter 3, "Scripting Basics."


    Telnet allows you to log in to a Unix shell account, where you''ll have immediate
    access to your Web server. From there, you can edit files on the server, test
    your Perl scripts from the command line, or move, copy, and delete files.


    Telnet is simple to use, but because it''s the interface you''ll use to access
    what is most likely a Unix-based server, we''re going to tell all. Anything that
    happens at the shell (Unix command prompt) level will be described in detail,
    and, with FTP, we''re providing you with some FAQs and tutorials so you can feel
    more of your skills in this area.


