    # Creating the Template CGI


    The foundation of our automation example lies in the ability to create templates.
    This script encapsulates, in a simplified form, the way the modules in this chapter
    work.


    # How to Use


    +   - Install the CGI::FastTemplate module from CPAN.

    - Copy template.cgi into your text editor.

    - Save the script as template.cgi.

    - Place the file in the root directory on your server.

    - Change the permissions to make executable by all users:


    ```

    chmod +x template.cgi

    ```'
