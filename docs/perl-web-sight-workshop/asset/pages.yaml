  md: '# Creating Your Own Portal


    Personalized, user-driven content has become a mainstay of contemporary sites.
    Many of these large, customizable sites are referred to as portals, and are offered
    up by such well-known sites as Yahoo!, Netscape, MSN, and Excite. The appeal of
    these sites is largely due to the fact that people can add the items of interest
    to them—be it stories on entertainment, world news and views, weather information,
    or their daily horoscope.


    Creating user-driven content can be quite complex, and that''s no exception when
    using CGI and Perl. However, Chapter 8, "Designing with Templates," quickly lead
    you to this point, showing you how to set up a publishing method before the scenes.


    Now, we''ll step up the intensity of your work with the scripts. We''re going
    to show you a bit more details regarding object inheritance, dive into more complex
    combinations of templates, and demonstrate how you can use CGI and Perl to access
    data from SQL (Structured Query Language) databases.


    # Introduction to DBI


    The next step in the evolution of our template-based publishing system requires
    that we move our data from flat files to a more structured type of storage. Text
    files simply aren''t fast or flexible enough for what we want to do. We''ll use
    the DBI.pm module to facilitate storing our data in a SQL database.


    DBI.pm is one of the most complex and powerful Perl modules around. It provides
    easy and portable access to many SQL database servers, from open source database
    servers as PostgreSQL and MySQL, to enterprise products such as Oracle, or simple
    file-based databases.


    For our examples in this chapter, we have used MySQL, an open source, freely available
    SQL server that is very fast, stable, and full-featured.'
