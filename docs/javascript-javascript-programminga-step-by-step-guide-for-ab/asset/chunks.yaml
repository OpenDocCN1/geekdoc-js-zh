  trans: "\n\n# If 语句 (If Statement)\n\n该语句仅在需要根据特定条件采取操作时使用。只有当条件为真，内容才会被评估。该语句采用以下语法：\n\
    \n```javascript\nif ( expression){\n  //要评估的内容\n}\n```\n\n例如：\n```html\n<script>\n\
    \    if ( 10 < 5 )\n    {\n      alert ( \"10 is less than 5\" );\n    }\n   \
    \ if ( 10 > 5 )\n    {\n      alert ( \"10 is greater than 5\" );\n    }\n</script>\n\
    ```\n\n执行代码将返回以下结果：![](img/image965.jpg)\n第一个 if 条件评估的结果为假，因此其代码块被跳过。第二个 if 条件的结果为真，因此其代码块被执行，并产生上述输出。\n\
    \n# If…else 语句 (If…else Statement)\n\n该语句将评估条件是否为真。\n该语句具有以下语法：\n\n```javascript\n\
    if ( condition){\n    // 代码…\n}else {\n    // 代码…\n}\n```\n\n例如：\n```html\n<script>\n\
    \  var x= 100 ;\n  if ( x% 2 == 0 ){\n  document . write( \"x is an even number\"\
    \ );\n  }\n  else {\n  document . write( \"x is an odd number\" );\n  }\n</script>\n\
    ```\n\n在上面的代码中，我们正在检查变量 `x` 的值是否为偶数。代码返回以下内容：![](img/image1012.jpg)\n表达式 `x%2==0`\
    \ 检查 `x` 除以 `2` 后的余数。如果余数为 `0`，则 `x` 是偶数，否则它是奇数。\n\n# If…else if 语句 (If…else if\
    \ Statement)\n\n有时，你可能有多个选项需要做出决策。该语句帮助我们在 JavaScript 中实现这一目标。该语句的语法如下：\n\n```javascript\n\
    if ( expression_1){\n    Statement( s)}\n}else if ( expression_2){\n    Statement(\
    \ s)}\n}else if ( expression_3){\n    Statement( s)}\nelse {\n    Statement( s)}\n\
    }\n```\n\n我们有一系列与 `else` 语句结合的 `if` 语句。执行的语句是条件评估为真的语句。\n\n例如：\n```html\n<script>\n\
    \  var grade= \"B\" ;\n  if ( grade== \"A\" ){\n  document . write( \"Excellent!\"\
    \ );\n  }\n  else if ( grade== \"B\" ){\n  document . write( \"Good!\" );\n  }\n\
    \  else if ( grade== \"C\" ){\n  document . write( \"Fair\" );\n  }\n  else {\n\
    \  document . write( \"Poor!\" );\n  }\n</script>\n```\n\n`grade` 的值是 `B`。所有条件都将被匹配，`grade\
    \ ===\"B\"` 条件将评估为真。代码将返回“ Good!”。\n\n# Switch 语句 (Switch Statement)\n\n该语句帮助我们根据各种条件执行不同的操作。当你拥有许多取决于单个变量值的分支时，它是适用的。通过\
    \ `switch` 语句，表达式会根据其值评估多个多个待执行的语句。\n\nJavaScript 解释器必须检查每个 `case` 与表达式的值，直到找到匹配项。如果没有找到匹配项，则选择默认项。其语法如下：\n\
    \n```javascript\nswitch ( expression) {\n    case i:code\n        break ;\n  \
    \  case i:code\n        break ;\n    default :\n        code\n}\n```\n\n例如：\n\
    ```html\n<script>\n  var name = 'Nicholas' ;\n  var output;\n  switch ( name){\n\
    \  case 'Samuel' :\n  output = \"Your name is Samuel\" ;\n  break ;\n  case 'Michelle'\
    \ :\n  output= \"Your name is Michelle\" ;\n  break ;\n  case 'Nicholas' :\n \
    \ output = \"Your name is Nicholas\" ;\n  break ;\n  default :\n  output = \"\
    No Name\" ;\n  }\n  document . write( output);\n</script>\n```\n\n执行代码将返回以下结果：![](img/image1141.jpg)\n\
    \n# 第 6 章 - JavaScript 循环 (JavaScript Loops)\n\n当你需要重复执行代码（无论次数是已还是未知的）时，循环非常有用。通过循环，你可以自动化处理手动操作可能繁琐的任务。一个很好的例子是需要向表格填充值。你可以使用循环来遍历单元格，而不是手动填充。让我们讨论\
    \ JavaScript 支持的循环语句：\n\n## For 循环 (For Loop)\n\n此循环用于固定次数地遍历代码块。当人们知道要迭代某个代码块的次数时，它是适用的。循环采用以下语法：\n\
    \n```javascript\nfor ( initializer; condition; increment)\n{\n    // 代码\n}\n```\n\
    \n`initializer` 设置了我们应该开始的计数器变量。`condition` 指定了执行下一次迭代必须满足的标准。`increment` 既可以增加也可以减少计数器。\n\
    \n这里是 `for` 循环的示例：\n```html\n<script>\n  for ( x= 0 ; x< 5 ; x++)\n  {\n  document\
    \ . write( x + \"<br/> )\n  }\n</script>\n```\n循环中的变量 `x` 首先被初始化为值 `0`。条件规定 `x`\
    \ 的值应该小于 `5`。在递增部分，变量 `x` 的值应该增加 `1`。这意味着循环应该从 `0` 运行到 `4`，产生如下结果：![](img/183.jpg)\n\
    \n这是另一个例子：\n```html\n<head>\n<title> 长度转换器</title>\n</head>\n<body>\n<table border=4\
    \ >\n<tr>\n  <td>以米为单位的长度</td>\n  <td>以厘米为单位的长度</td>\n</tr>\n<script language=\"\
    javascript\">\nfor ( length= 0 ; length<= 20 ; length= length+2 ){\ndocument .\
    \ write( \"<tr><td>\" + length+\"</td><td>\"+( length * 100 )+\"</td></tr>\" );\n\
    }\n</script>\n</body></html>\n```\n我们使用 `for` 循环来遍历一组值，同时将其转换为米（此处逻辑为厘米）。这一次，我们在每次迭代后将值增加\
    \ `2`。代码返回一个如下所示的填充好的表格：![](img/223.jpg)\n\n## While 循环 (While Loop)\n\n此循环可用于无限次数地遍历代码。当人们不知道执行循环的确切次数时，它是适用的。只要指定的条件为真，循环就会执行。一旦条件变为假，循环的执行将停止。它采用以下语法：\n\
    \n```javascript\nwhile ( variable<= final_value){\n  // 代码\n}\n```\n\n例如：\n```html\n\
    <script>\n  var x= 0 ;\n  while ( x<= 5 )\n  {\n  document . write( x + \"<br/>\
    \ );\n  x++;\n  }\n</script>\n```\n`while` 循环只要变量 `x` 的值不大于 `5` 就会运行。代码返回：![](img/257.jpg)\n\
    \n这是另一个例子：\n```html\n<head>\n<title> 长度转换器 </title>\n</head>\n<body>\n<table border=3\
    \ >\n<tr>\n  <td>以米为单位的长度</td>\n  <td>以厘米为单位的长度</td>\n</tr>\n<script language=\"\
    javascript\">\nlength= 0 ;\nwhile ( length<= 20 ){\ndocument . write( \"<tr><td>\"\
    \ + length+\"</td><td>\" +( length * 100 )+\"</td></tr>\" );\nlength = length+2\
    \ ;\n}\n</script>\n</body></html>\n```\n只要 `length` 小于或等于 `20`，上述循环就会一直运行。一旦循环发现违反此条件，就会停止执行。代码返回：![](img/307.jpg)\n\
    \n## Do while 循环 (Do while Loop)\n\n这是一个用于无限次数遍历代码块的好循环。但是，无论条件真假，代码都必须执行一次。其语法如下：\n\
    \n```javascript\ndo {\n    statement ( s)\n} while ( condition);\n```\n\n`while`\
    \ 可能永远不运行，但 `do while` 循环至少运行一次。这里有一个示例：\n```html\n<script>\n  var x= 0 ;\n  do\
    \ {\n  document . write( x + \"<br/>\" );\n  x++;\n  } while ( x<= 5 );\n</script>\n\
    ```\n代码将打印结果：![](img/336.jpg)\n\n## 循环语句 (Loop Statements)\n\n我们可以通过 `break` 和\
    \ `continue` 语句来控制循环的执行。有时，你需要在到达结束之前退出循环。还需要跳过循环的一部分并执行后续部分。这两个语句可以帮助我们实现这一点。\n\
    \n### Break 语句 (Break Statement)\n\n通过此语句可以提前退出循环并离开大括号。执行到循环之后。示例：\n```html\n\
    <script type=\"text/javascript\">\n    var p = 1 ;\n    document . write( \"Starting\
    \ the loop<br />\" );\n    while ( p < 20 )\n    {\n      if ( p == 5 ){\n   \
    \   break ; // 退出循环\n      }\n      p = p + 1 ;\n      document . write( p + \"\
    <br />\" );\n    }\n    document . write( \"Leaving the loop<br />\" );\n</script>\n\
    ```\n这就是在 `while` 循环中使用 `break` 语句的方法。当 `p` 的值为 `5` 时，JavaScript 解释器指示停止循环。输出如下所示：![](img/373.jpg)\n\
    \n### Continue 语句 (Continue Statement)\n\n通过 `continue` 语句，我们可以中断当前循环并继续下一个值。假设你需要将\
    \ `-5` 到 `+5` 之间的某个数字除以 `0`。由于这是非法的，可以使用 `continue` 跳过它。其实现方式如下：\n```html\n<script\
    \ type=\"text/javascript\">\nfor ( p=- 5 ; p<= 5 ; p= p+1 ){\nif ( p== 0 ) { continue\
    \ };document . write(10 / p);\n</script>\n```\n这种实现方式使得整数 `10` 不会被除以 `0`。代码返回：![](img/400.jpg)\n\
    我们从 `1` 开始，跳过了除以 `0`。\n\n# 第 7 章 - JavaScript 函数 (JavaScript Functions)\n\n函数用于执行操作。函数是将代码组合在一起的好方法。此类代码在它们执行的任务方面应该是相关的。你只需要将代码分组并分配一个唯一的名称。从那时起，你可以多次调用代码，方便代码重用。通过函数，你可以享受只需编写代码或完全无需编写的好处。\n\
    \n## 函数定义 (Function Definition)\n\nJavaScript 的定义和调用采用以下语法：\n\n```javascript\n\
    // 函数定义\nfunction function_name(){\n    // 执行代码\n}\n// 调用函数\nfunction_name();\n\
    ```\n\n如上面的语法所示，函数被赋予名称，在调用函数执行其预期任务时使用。函数体放在大括号 {} 内。以下是一个示例：\n```html\n<body>\n\
    <script>\n    function HelloFunction() {\n    document . write( \"Hello World\"\
    \ );\n    }\n    HelloFunction();\n</script>\n</body>\n```\n我们定义了一个名为 `HelloWorld()`\
    \ 的函数。在函数体内部，我们规定函数应该打印文本 Hello World。在函数体之后，我们通过名称调用了它。代码返回以下内容：![](img/451.jpg)\n\
    注意我们用来调用上述函数的方法。函数会在网页加载时立即被调用。然而，很多时候我们需要通过点击按钮调用函数。在 JavaScript 中这是可能的，如下所示：\n\
    ```html\n<body>\n<script>\nfunction HelloFunction() {\nalert ( \"Hello World\"\
    );}</script>\n<input type=\"button\" onclick = \"HelloFunction()\" value=\"Hello\"\
    \ />\n</body>\n```\n我们使用了之前的函数。但是，我们创建了一个带有文本 Hello 的按钮。`onclick` 属性规定了点击按钮后会发生什么。它规定点击按钮后应该调用\
    \ `HelloFunction()` 函数。运行代码并点击 Hello 按钮。你将获得带有消息的警告框：![](img/483.jpg)\n\n## 函数参数\
    \ (Function Arguments)\n\n函数可以接受一个或多个参数，也称为参数。参数应该通过调用代码提供，并可以在函数内部使用。JavaScript\
    \ 以其动态语言而闻名，因此函数参数可以接受任何数据类型的参数。考虑以下示例：\n```html\n<script>\n    function MyFunction(\
    \ arg1, arg2) {\n      alert ( \"You passed \" + arg1 + \" and \" + arg2);\n \
    \   }\n    MyFunction( 10 , 12 );\n    MyFunction( \"Nicholas\" , \"Samuel\" );\n\
    \    MyFunction( 2\" );\n</script>\n```\n我们创建了一个名为 `MyFunction` 的函数，它接收两个参数 `arg1`\
    \ 和 `arg2`。我们通过调用代码提供了这两个参数的值，并在警告框中显示它们。我们随后多次调用了同一个函数，每次传递不同的参数。代码如下：![](img/507.jpg)\n\
    参数将按照指定的顺序传递给函数。这里是另一个例子：\n```html\n<<body>\n<script>\nfunction calculateCube(\
    \ x){\nalert ( x * x);\n}\n</script>\n<form>\n<input type=\"button\" value=\"\
    Calculate Cube\" onclick=\"calculateCube(3)\" />\n</form>\n</body>\n```\n我们创建了一个带有文本\
    \ Calculate 的按钮。点击时，该按钮应该调用 `calculateCube()` 函数。在 `onclick` 参数中，我们传递了参数 `3` 给它。这意味着它应该返回\
    \ `3` 的立方，即 `27`。注意，调用函数时可以传递更多或更少的参数。如果传递的少于函数预期的，剩余的是 `undefined`。如果传递的多将被忽略。\n\
    \n## Arguments 对象 (Arguments Object)\n\n任何 JavaScript 函数都可以使用 `arguments` 对象。该对象为每个参数都有一个值。可以通过类似于数组的方式访问值。然而，该对象不支持数组方法。考虑以下示例：\n\
    ```html\n<script>\n    function MyFunction( arg1, arg2) {\n      alert ( \"You\
    \ passed \" + arguments[0] + \" and \" + arguments[1]);\n    }\n    MyFunction(\
    \ 10 , 12 );\n</script>\n```\n代码将像常一样运行。调用函数时，`arguments[0]` 表示调用函数时的第一个参数，`arguments[1]`\
    \ 表示调用函数时的第二个参数。\n\n## 返回值 (Return Value)\n\n在 JavaScript 中，函数可以使用 `return` 关键字返回零或一个值。考虑给下面的示例：\n\
    ```html\n<script>\n  function MyFunction(){\n  return \"Hello sir/madam\" ;\n\
    \  }\n</script>\n<script>\n  document . write( MyFunction());\n</script>\n```\n\
    函数将返回 `return` 语句中指定的内容。这里是另一个例子：\n```html\n<body>\n<p id=\"pg1\"></p>\n<p id=\"\
    pg2\"></p>\n<script>\n    function Addition( x, y) {\n      return x + y;\n  \
    \  }\n    document . getById(\"pg1\").innerHTML = Addition(10 , 12 );\n    function\
    \ Product( x, y) {\n      console.log( x * y);\n    };\n    document. getById(\"\
    pg2\").innerHTML = Product(10 , 12 );\n</script>\n</body>\n```\n代码将打印以下内容：![](img/649.jpg)\n\
    我们创建了一个名为 `Addition()` 的函数，它返回变量 `x` 和 `y` 的和。调用代码能够获取返回值并赋值给变量。我们还定义了第二个名为 `Product()`\
    \ 的函数，它没有返回，因此其结果为 `undefined`。在 JavaScript 中，我们可以让一个函数返回另一个函数。这里是这样的示例：\n```html\n\
    <body>\n<p id=\"pg1\"></p>\n<p id=\"pg2\"></p>\n<script>\n    function myfunction(\
    \ a) {\n      function product( b)\n      {\n        return a * b;\n      }\n\
    \      return product;\n    }\n    var db = myfunction(2 );\n    document . getById(\"\
    pg1\").innerHTML = db(2 );\n    document . getById(\"pg2\").innerHTML = db(3 );\n\
    </script>\n</body>\n```\n名为 `myfunction()` 的函数正在返回函数 `product()`。\n\n## 函数表达式\
    \ (Function Expression)\n\n在 JavaScript 中，我们可以为函数分配一个变量，然后使用该变量作为函数。这被称为函数表达式。例如：\n\
    ```html\n<body>\n<p id=\"pg1\"></p>\n<p id=\"pg2\"></p>\n<script>\n    var sum\
    \ = function Addition( x, y) {\n      return x + y;\n    };\n    document . getById(\"\
    pg1\").innerHTML = sum(10 , 12 );\n    document . getById(\"pg2\").innerHTML =\
    \ Addition(10 , 12 ); // 无效\n</script>\n</body>\n```\n代码应该返回 `10` 和 `12` 的和，即\
    \ `22`。此输出将来自 `sum(10, 12)` 表达式，其中我们通过分配给它的变量来调用函数。表达式 `Addition(10, 12)` 是无效的。\n\
    \n"
