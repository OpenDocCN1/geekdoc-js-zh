- fmt: "\nYou can write your JavaScript code using even a basic text editor such as\
    \ Notepad. However, it is good for you to get an advanced text editor that will\
    \ provide you with features such as syntax error highlighting, auto-completion,\
    \ etc. Examples of such text editors include Visual Studio, Eclipse, Aptana, etc.\
    \ These can help you with speedy development.\n\nThere are also online JavaScript\
    \ editors that you can use for writing your scripts. A good example of this is\
    \ `jsfiddle.net`. For the case of the browser, you can install any type of browser\
    \ depending on your preference. Examples of such browsers include Chrome, Internet\
    \ Explorer, Safari, Firefox, Opera, etc. JavaScript can work on any browser running\
    \ on any OS.\n\n# JavaScript Example\n\nThere are three places where we can place\
    \ our JavaScript code. We can place the code within the body, within the head\
    \ tag or in an external JavaScript file. Here is our first JavaScript example:\n\
    \n```html\n<script type=\"text/javascript\">\n  document.write(\"JavaScript makes\
    \ web pages interactive!\");\n</script>\n```\n\nThe code should print the following:\n\
    ![](image287.jpg)\n\nThe `script` tag has specified that we are using JavaScript.\
    \ This will help the browser know the kind of data it has been provided with.\
    \ The code simply calls the JavaScript’s `document.write()` method which prints\
    \ the text we pass to it. This method is used for displaying dynamic content using\
    \ JavaScript.\n\nAs we have stated above, there are three places we can add our\
    \ JavaScript code. The following code demonstrates how to add the code between\
    \ the `<body>` and `</body>` tags:\n\n```html\n<html>\n<body>\n  <script type=\"\
    text/javascript\">\n    document.write(\"JavaScript makes web pages interactive!\"\
    );\n  </script>\n</body>\n</html>\n```\n\nHere is another example showing how\
    \ we can show an alert box:\n\n```html\n<html>\n<body>\n  <script type=\"text/javascript\"\
    >\n    alert(\"Hello World\");\n  </script>\n</body>\n</html>\n```\n\nWe have\
    \ called the `alert()` method which shows an alert box with the specified message.\
    \ In this case, the message will be `Hello World`.\n\nThe JavaScript code can\
    \ also be added within the `<head>` and `</head>` tags. Here is an example:\n\n\
    ```html\n<html>\n<head>\n  <script type=\"text/javascript\">\n    function hello(){\n\
    \      alert(\"Hello World\");\n    }\n  </script>\n</head>\n<body>\n  <p>JavaScript</p>\n\
    \  <form>\n    <input type=\"button\" value=\"Click Me\" onclick=\"hello()\" />\n\
    \  </form>\n</body>\n</html>\n```\n\nWe have created a method named `hello()`\
    \ within the `script` tag. This method should return an alert box with the message\
    \ `Hello World` when called. We have created a form with a button within the `<body>\
    \ </body>` tags. The `onclick` property specifies the method to call when the\
    \ button is clicked. After running the code, you should get the following:\n![](image358.jpg)\n\
    \nClick the “Click Me” button. You will see the alert box with the `Hello World`\
    \ message. That is how JavaScript code can be added within the `<head> </head>`\
    \ tags.\n\nWe can also create an external JavaScript file then embed it into a\
    \ number of web pages. Due to the ability to use such a page on many HTML pages,\
    \ we can achieve code reusability. Any external JavaScript file must be given\
    \ a name that ends with a `.js` extension to mark it as a JavaScript file. All\
    \ JavaScript code should be embedded into a single file to make the web page respond\
    \ faster.\n\nLet us create our external JavaScript file to return `Hello World`\
    \ message within an alert box. The file will be given the name `hello.js`.\n\n\
    **hello.js:**\n```javascript\nfunction hello(){\n  alert(\"Hello World\");\n}\n\
    ```\n\nWe can now create our HTML file and add the name of the JavaScript file\
    \ to it. Here is the code for the html file:\n**index.html:**\n```html\n<html>\n\
    <head>\n  <script type=\"text/javascript\" src=\"hello.js\"></script>\n</head>\n\
    <body>\n  <p>JavaScript</p>\n  <form>\n    <input type=\"button\" value=\"Click\
    \ Me\" onclick=\"hello()\" />\n  </form>\n</body>\n</html>\n```\n\nThe name of\
    \ the JavaScript file was specified within the `script` tag using the `src` parameter.\n\
    \n# JavaScript Comments\n\nComments provide us with a way of delivering messages.\
    \ Comments help in guiding users, adding information describing the code, suggestions\
    \ or warnings, making it easy for the reader to interpret code. The JavaScript\
    \ Engine ignores comments, meaning that it just skips them.\n\nJavaScript comments\
    \ can span a single or multiple lines. To write a single-line comment, precede\
    \ it with a double slash (`//`). For example:\n\n```html\n<script>\n  // A single\
    \ line comment in JavaScript\n  document.write(\"Hello World\");\n</script>\n\
    ```\n\nHere is another example:\n```javascript\nvar x = 5;\nvar y = 15;\nvar z\
    \ = x + y; //To add values of x and y\ndocument.write(z); //to print sum of x\
    \ and 15\n```\n\nMulti-line comments are enclosed between `/*` and `*/` (a slash\
    \ and an asterisk). This can also be used for single line comment. For example:\n\
    \n```html\n<script>\n/* A multi-line comment in JavaScript\nJavaScript engine\
    \ will skip it */\ndocument.write(\"Hello World\");\n</script>\n```\n\n# Case\
    \ Sensitivity\n\nJavaScript is a case sensitive scripting language. This means\
    \ that a variable named `x` will be different from `X`. A variable named `age`\
    \ will be different from `AGE`.\n\n# Chapter 2 - Popup Message\n\nJavaScript has\
    \ numerous built-in methods that can help in displaying popup messages for various\
    \ purposes. Let us discuss the popup boxes provided by JavaScript:\n\n### Alert\
    \ Box\n\nThis is used to show a message to a user, where emphasis is needed. It\
    \ comes with an OK button that closes the popup when clicked. It is created by\
    \ calling the JavaScript’s `alert()` function. For example:\n\n```html\n<html>\n\
    <body>\n  <h1>Popup</h1>\n  <script>\n    alert(\"Hello World!\"); // to display\
    \ string message\n    alert(1); // to display a number\n    alert(true); // to\
    \ display boolean\n  </script>\n</body>\n</html>\n```\n\nWhen you run the code,\
    \ it will display the first alert box with the string `Hello World!`. Click OK\
    \ button and it will display an alert with `1`. Again, click the OK button and\
    \ it will display an alert with `true`. This shows that the alert box can be used\
    \ to display a message of any type.\n\n### Confirm Box\n\nSometimes, a user is\
    \ expected to give a confirmation so as to proceed. For example, you may want\
    \ a user to confirm deletion or update of certain details before the process can\
    \ be completed. This can be done using the `confirm()` function provided by JavaScript.\
    \ This function will display a popup box to the user with two buttons namely OK\
    \ and Cancel. The next step is determined by the button the user clicks.\n\n```html\n\
    <html>\n<body>\n  <h1>confirm</h1>\n  <p id=\"del\"></p>\n  <script>\n    var\
    \ userChoice;\n    if (confirm(\"Do you really want to delete the data?\") ==\
    \ true) {\n      userChoice = \"Data deleted successfully!\";\n    } else {\n\
    \      userChoice = \"Delete canceled!\";\n    }\n    document.getElementById(\"\
    del\").innerHTML = userChoice;\n  </script>\n</body>\n</html>\n```\n\n### Prompt\
    \ Box\n\nIn some cases, you may need to receive an input from users and use it\
    \ to perform further actions on the web page. For example, you may need to calculate\
    \ the monthly amount for loan repayment based on the number of months within which\
    \ the user wants to settle the loan. In such a case, you can use the `prompt()`\
    \ function provided by JavaScript. The function should take two string parameters.\
    \ The first one is the message that will be displayed while the second one is\
    \ the default value to be in the input text once the message has been displayed:\
    \ `prompt([display_message], [default_Value])`. For example:\n\n```html\n<html>\n\
    <body>\n  <h1>prompt</h1>\n  <p id=\"pro\"></p>\n  <script>\n    var age = prompt(\"\
    What is your age?\", \"26\");\n    document.getElementById(\"pro\").innerHTML\
    \ = \"You are \" + age + \" years old\";\n  </script>\n</body>\n</html>\n```\n\
    \nThe code prompts you to enter your age. If you don’t and click the OK button,\
    \ `26` will be used as your default age.\n\n# Chapter 3 - JavaScript Variables\n\
    \nA variable is a name for a storage location. From its name, it can vary. Variables\
    \ hold values that can vary. In JavaScript, we use the `var` keyword to declare\
    \ variables. Each variable must be given a unique name. You are allowed to assign\
    \ a value to a variable during the time of its declaration. This can be done using\
    \ the equals to symbol (`=`).\n\nThe following is the syntax for declaring and\
    \ initializing variables in JavaScript:\n\n```javascript\nvar variable_name;\n\
    var variable_name = value;\n```\n\nHere are valid examples of this:\n```javascript\n\
    var x = 1; // variable storing a numeric value\nvar y = 'nicholas'; // variable\
    \ storing a string value\nvar z; // declare a variable and not assign a value\n\
    ```\n\nWe have used the `var` keyword to declare three variables. Two of the variables\
    \ have been assigned a value. Note that this has been done at the time of their\
    \ declaration.\n\nWe can also declare more than one variable in a single line\
    \ and separate them by a comma (`,`). This is demonstrated below:\n\n```javascript\n\
    var x = 1, y = 'nicholas', z;\n```\n\nNote that in JavaScript, one can declare\
    \ a variable without using the `var` keyword. However, if you do this, ensure\
    \ that you assign a value to the variable immediately. This is demonstrated below:\n\
    ```javascript\nx = 1;\ny = 'nicholas';\n```\n\nHowever, I don’t recommend that\
    \ you declare any variable without the `var` keyword. This is because you may\
    \ end up overriding a global variable without knowing. If a variable is declared\
    \ without the `var` keyword, it automatically becomes a global variable, regardless\
    \ of where it has been declared.\n\nHere are the rules that govern the declaration\
    \ of variable names in JavaScript:\n"
