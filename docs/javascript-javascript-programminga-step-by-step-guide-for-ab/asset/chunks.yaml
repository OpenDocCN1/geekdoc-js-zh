  trans: "\n\n1. `setTimeout(method, time)` - 该方法将在若干毫秒后调用指定方法。\n2. `setInterval(method,\
    \ time)` - 该方法将在 `time` 毫秒后调用指定方法。\n\n通过 JavaScript，可以设置 DOM 对象的某些属性，例如它在屏幕上的位置。可以使用\
    \ `top` 和 `left` 属性设置对象的位置。下文所示：\n\n```javascript\n// 设置距离屏幕左边缘的距离。\nobject.style.left\
    \ = distance; // 单位为磅或像素；\n// 设置距离屏幕顶部的距离。\nobject.style.top = distance; // 单位为磅或像素；\n\
    ```\n\n### 手动动画\n在接下来的示例中，我们将制作图像向右移动的动画：\n\n```html\n<html\n<head>\n    <script\
    \ type=\"text/javascript\">\n        var image = null;\n        function init()\
    \ {\n            image = document.getElementById('myImage');\n            image.style.position\
    \ = 'relative';\n            image.style.left = '0px';\n        }\n        function\
    \ moveImage() {\n            image.style.left = parseInt(image.style.left) + 10\
    \ + 'px';\n        }\n        window.onload = init;\n    </script>\n</head>\n\
    <body>\n    <form>\n        <img id=\"myImage\" src=\"house.jpg\" />\n       \
    \ <p>点击按钮移动图像</p>\n        <input type=\"button\" value=\"Move Image\" onclick=\"\
    moveImage();\"/>\n    </form>\n</body>\n</html>\n```\n\n你应该在以下行中使用图像的正确名称：`<img\
    \ id=\"myImage\" src=\"house.jpg\" />`。在我的情况下，我有一个名为 `house` 的 `.jpg` 图像。当我运行代码时，它返回如下结果：\n\
    \n![](img/image3669.jpg)\n\n点击“Move Image”按钮。每次点击图像应向右移动。显示所示：\n\n![](img/image674.jpg)\n\
    \n考虑脚本中的以下行：`image = document.getElementById('myImage');`。我们通过其 ID 获取图像，然后将其赋值给变量\
    \ `image`。`init()` 方法帮助我们在窗口上设置图像的初始位置。当窗口加载时将调用该方法。`moveImage()` 函数每次点击会将图像向右移动\
    \ 10 像素。要让图像向左移动，值应设置为负数。在这种情况下，动画是手动点击的。\n\n### 自动动画\n为了实现元素动画自动化，可以使用 JavaScript\
    \ 提供的 `setTimeout()` 函数。示例：\n\n```html\n<script type=\"text/javascript\">\n  \
    \  var image = null;\n    var animate;\n    function init() {\n        image =\
    \ document.getElementById('myImage');\n        image.style.position = 'relative';\n\
    \        image.style.left = '0px';\n    }\n    function animateImage() {\n   \
    \     image.style.left = parseInt(image.style.left) + 10 + 'px';\n        animate\
    \ = setTimeout(animateImage, 20);\n    }\n    function stopAnimation() {\n   \
    \     clearTimeout(animate);\n        image.style.left = '0px';\n    }\n    window.onload\
    \ = init;\n</script>\n</head>\n<body>\n    <form>\n        <img id=\"myImage\"\
    \ src=\"house.jpg\" />\n        <p>点击 Animate 按钮启动动画</p>\n        <input type=\"\
    button\" value=\"Animate\" onclick=\"animateImage();\"/>\n        <input type=\"\
    button\" value=\"Stop\" onclick=\"stopAnimation();\"/>\n    </form>\n\n执行返回如下：![](img/image738.jpg)\n\
    \n点击“Animate”按钮。动画应该开始。当你点击 Stop 按钮时，动画将停止。`animateImage()` 方法调用 `setTimeout`\
    \ 方法在 20 毫秒后设置图像的位置。这将导致图像的动画。`stopAnimation()` 方法有助于清除由 `setTimeout()` 方法的计时器。对象设置为初始位置。\n\
    \n### 悬停切换 (Rollover)\n我们可以使用 JavaScript 鼠标来实现图像切换。当鼠标悬停在图像上时，它将变为另一张图像。示例：\n\n\
    ```html\n<html>\n<head>\n    <script type=\"text/javascript\">\n        if (document.images)\
    \ {\n            var img1 = new Image();\n            img1.src = \"ps.jpg\";\n\
    \            var img2 = new Image();\n            img2.src = \"house.jpg\";\n\
    \        }\n    </script>\n</head>\n<body>\n    <p>鼠标悬停切换</p>\n    <a href=\"\
    #\" onmouseover=\"document.img.src=img2.src;\" onmouseout=\"document.img.src=img1.src;\"\
    >\n        <img name=\"img\" src=\"nicsam.jpg\" />\n    </a>\n</body>\n</html>\n\
    ```\n\n我们使用了 `if` 语句来检查图像是否存在。使用了 `Image()` 构造函数来预加载名为 `img1` 的新对象。同样也预加载了第二张图像\
    \ `img2`。`src` 给出了外部存储的图像名称。`#` 有助于禁用点击时打开 URL。当鼠标移动到图像上时将调用 `mouseover` 方法。当鼠标离开图像时将调用\
    \ `mouseout` 方法。\n\n### 第 12 章- 浏览器模型\nBOM（浏览器模型）用于与浏览器交互。默认浏览器对象是 `window`，这意味着你可以直接调用所有窗口函数或通过指定\
    \ `window`。我们已经讨论过这一点，因此不再重复。除了 `window` 对象外，还有其他 BOM 对象。让我们讨论它们：\n\n#### History\
    \ 对象 (History Object)\n该对象存储用户访问过的所有 URL 数组。你可以使用此对象加载网页、上一页、下一页和任何特定的网页。可以通过如下方式访问此对象：`window.history`。也可以以此方式访问：`history`。此对象只有一个属性，即\
    \ `length`，它返回历史 URL 的长度。history 对象有 3 个方法，包括：\n\n* `forward()` - 加载下一页\n* `back()`\
    \ - 加载上一页\n* `go()` - 加载指定的页码\n\nhistory 对象可以用以下多种方式使用：\n\n1. `history.back();`\
    \ // 用于上一页\n2. `history.forward();` // 用于下一页\n3. `history.go(2);` // 用于后两页\n4.\
    \ `history.go(-2);` // 用于上两页\n\n#### Navigator 对象 (Navigator Object)\n该对象用于检测浏览器。它可以帮助获取\
    \ `appName`、`userAgent`、`appCodeName` 等浏览器信息。navigator 对象是 `window` 的属性，我们可以按如下方式访问：`window.navigator`。也可以通过以下方式访问：`navigator`。该对象带有多种属性，包括：\n\
    \n* `appName` - 返回名称\n* `appCodeName` - 返回代码名称\n* `appVersion` - 返回版本\n* `cookieEnabled`\
    \ - 如果浏览器启用 cookie 则返回 true，否则返回 false\n* `language` - 返回语言。仅限 Firefox 和 Netscape。\n\
    * `userAgent` - 返回用户代理\n* `userLanguage` - 返回用户的语言。仅限 IE 支持。\n* `systemLanguage`\
    \ - 返回系统语言。仅限 IE 支持。\n* `Plugins` - 返回插件。仅限 Firefox 和 Netscape。\n* `mimeTypes[]`\
    \ - 返回 MIME 类型数组。仅限 Firefox 和 Netscape。\n* `online` - 如果浏览器在线则返回 true，否则返回 false。\n\
    * `platform` - 返回平台，如 Win32。\n\nnavigator 对象拥有以下方法：\n\n* `javaEnabled()` - 检查是否启用了\
    \ java。 `taintEnabled()` - 检查是否启用了 taint。自 JavaScript 1.2 起已弃用。\n\n"
