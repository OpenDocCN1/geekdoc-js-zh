    JavaScript EventsEvents are the actions which JavaScript can detect. A good example
    is an onmouseover event, which JavaScript detects once a mouse is moved over some
    object. The onload event is triggered once a web page is loaded. In JavaScript,
    events and functions are used together. A function is triggered once an event
    has occurred. Other examples of events include closing a window, pressing a key,
    resizing a window and others.onclick EventThis is a common event in JavaScript.
    It occurs once a user has clicked the left button of the mouse. One can add a
    warning, validation etc. against the event. Example:< html>   < head>      < script
    type= "text/javascript" >            function helloFunc() {               alert
    ( "Hello World!" )            }      </ script>   </ head>      < body>      <
    p> Click the button below</ p>    < form >< input type= "button" onclick = "helloFunc()"value=
    "Click Here" />      </ form >    </ body></ html>In the example, a simple form
    has been created. It should be as follows:![](image2613.jpg)Click the “Click Here”
    button and the function helloFunc will be invoked. Once clicked, you will see
    a pop up as shown below:![](image2618.jpg)onsubmit EventThis even is called when
    one has submitted a form. Form validation can be added to the event. This will
    help you validate data before it can be sent to a webserver.Example:< html>   <
    head>     < script type= "text/javascript" >            function formValidation()
    {               // validation code should be added here               return either
    true or false            }  </ script>      </ head>   < body>   < form method=
    "POST" onsubmit = "return formValidation()" >         < input type= "submit" value=
    "Submit" />      </ form >      </ body></ html>Once the Submit button is clicked,
    the formValidation method will be called.onmouseout and onmouseoverThese events
    help you add attractive features to both text and images. The onmouseover event
    is triggered once a mouse is moved over an object. The onmouseout event is triggered
    once the mouse is moved out of the element.Example:< html>   < head>         <
    script type= "text/javascript" >            function overObject() {               document
    . write ( "Your Mouse is Over" );            }                function outOfObject()
    {               document . write ( "Your Mouse is Out" );            }            </
    script>        </ head>   < body>      < p> Bring your mouse in the division and
    observe:</ p>      < div onmouseover = "overObject()" onmouseout= "outOfObject()"
    >      < h2> Division</ h2>      </ div>         </ body></ html>The code gives
    the following when executed:![](image2696.jpg)Just move your mouse as instructed
    and see what happens. It will change to the following:![](image2701.jpg)We have
    defined two functions, that is, overObject and outOfObject . These two functions
    have then been called in the following line:  < div onmouseover = "overObject()"
    onmouseout= "outOfObject()" >Once a mouse is moved over the division, the overObject
    method will be called. Once the mouse is moved out of the object, the outOfObject
    method will be called. The onmouseover="overObject()" instructs the JavaScript
    to call the overObject function once the mouse is moved over the division, while
    the onmouseout="outOfObject()"> instructs the JavaScript interpreter to call the
    outOfObject function once the mouse is moved out of the division.Here is another
    example that changes the color of the text after mouse hover:< html>< body>< h1
    onmouseover = "style.color=''yellow''"onmouseout= "style.color=''black''" >Move
    your cursor over here</ h1></ body></ html>When you move the mouse cursor of the
    text, the text will change its color to yellow. If you move away from the mouse
    cursor, the text will change color to black.onload and onunloadThese two events
    are invoked when a user has entered or left a page. We can use the onload event
    to check the type and version of the visitor’s browser. It is from there that
    we can load the right web page depending on the version. Both are good functions
    for dealing with cookies:< html>< body onload = "inspectCookies()" >< p id= "example"
    ></ p>< script>function inspectCookies() {  var txt = "" ;  if ( navigator . cookieEnabled
    == true ) {    txt = "Your browser has cookies enabled." ;  } else {    txt =
    "your browser has cookies disabled." ;  }  document . getElementById( "example"
    ). innerHTML = txt;}</ script></ body></ html>If you run the above code, the output
    that you get will depend on whether your browser has cookies enabled or not.onchange
    EventThis method is mostly used during the validation of form fields. The following
    example demonstrates how to use this method:< html>< head>< script>function testFunc()
    {  var a = document . getElementById( "name" );  a. value = a. value. toUpperCase();}</
    script></ head>< body>Name: < input type= "text" id= "name" onchange= "testFunc()"
    >< p> Leave the input field and see your name change to uppercase</ p></ body></
    html>After running the code, you will get the following simple form:![](image2791.jpg)Just
    type your name in lowercase and move the mouse cursor from the input field by
    clicking outside. You will notice that your name will be transformed into uppercase:![](image2796.jpg)The
    upperCase() method is invoked after the user has changed the content of the input
    field.onloadWhen used, it displays an alert box after a page has been loaded.
    For example:< html>< head>< script>function displayMessage() {  alert ( "A message
    by the onload event" );}</ script></ head>< body onload = "displayMessage()" ></
    body></ html>Once the page has been loaded, you will get the following alert box:![](image2826.jpg)onfocusThis
    method makes an input field change its color after it gets focus.Here is an example:<
    html>< head>< script>function myFunc( col) {  col. style. background = "green"
    ;}</ script></ head>< body>Name: < input type= "text" onfocus = "myFunc(this)"
    >< p> Click inside the input field and see it change color.</ p></ body></ html>The
    code will give you the following on execution:![](image2860.jpg)You can then click
    inside the input field as instructed and see what happens. It will change color
    as follows:![](image2865.jpg)The color of the input field will change into the
    green.Chapter 10- JavaScript ValidationWith JavaScript, one can validate a form
    before they can submit it. Initially, form validation was done on the side of
    the server. The user could fill a form then send it to a server. If the details
    were found to be wrong, the server had to send them back to the user for corrections.
    This process is too lengthy.However, JavaScript has changed and improved how this
    is done. Validation of forms can be done on the client side before the form details
    can be submitted to the server. In form validation, we should ensure all the required
    fields are filled. Fields taking specific data formats such as emails, mobile
    phone numbers and other should be checked to ensure the format is adhered to.
    The validation of the form is normally done on submit.Example:< html>< head></
    head>< script type= "text/javascript" >   function formValidation(){   var name=
    document . detailsForm. username. value;   var password = document . detailsForm.
    userpassword. value;   if ( name== null || name== "" ){    alert ( "You MUST enter
    your name!" );    return false ;   } else if ( password . length< 8 ){     alert
    ( "You MUSt enter a password with 8 characters and above1" );    return false
    ;     }   }   </ script>   < body>   < form name= "detailsForm" method= "post"
    action= "nm.jsp" onsubmit = "return formValidation()" >  Name: < input type= "text"
    name= "username" >< br/>  Password: < input type= "password" name= "userpassword"
    >< br/>  < input type= "submit" value= "Login" >  </ form >   </ body></ html>The
    code returns a simple form as shown below:![](image2929.jpg)Click the Login button
    without entering a value in any of the input fields; you will get the following
    alert box:![](image2934.jpg)This means that you must enter your name before proceeding.
    Now, enter your name but don’t enter a password. You will get the following alert
    box:![](image2939.jpg)This means that you must enter a password with 8 characters
    and above. You can now enter a short password and see whether the validation is
    working correctly. Enter a password with less than 8 characters then click the
    Login button. You will still get the above dialog.We have created a form named
    detailsForm . The form requires the user to enter his name and password. We have
    created the formValidation method to validate the values entered in the form.
    Username must be provided while the password should not have less than 8 characters.
    The property onsubmit=" return formValidation()" means that once the user clicks
    the “Login” button, the formValidation() method will be called so as to validate
    the details entered in the form. If they don’t conform to the requirements, it
    will return false, so the user will have to re-enter the details.Validating Retype
    PasswordWhen a user is creating a password, they are normally asked to retype
    it to ensure they have mastered it well. This logic can be implemented in JavaScript
    as follows:< script type= "text/javascript" >      function passwordMatch(){       var
    firstpassword= document . myform. userpassword1. value;       var secondpassword=
    document . myform. userpassword2. value;     if ( firstpassword== secondpassword){
          return true ;       }       else {       alert ( "The two passwords don''t
    much!" );       return false ;       }       }       </ script>         < form
    name= "myform" action= "register.jsp" onsubmit = "return passwordMatch()" >       Password:<
    input type= "password" name= "userpassword1" />< br/>       Re- enter Password:<
    input type= "password" name= "userpassword2" />< br/>       < input type= "submit"
    >       </ form >   This returns the following simple form:![](image2984.jpg)Try
    to enter different passwords in the two fields then see what will happens after
    clicking the “Submit Query” button. You will get the following message:![](image2989.jpg)Number
    ValidationWhen requiring a user to enter a number such as age in a particular
    text field, you should validate the input to ensure they only enter a number.This
    is demonstrated below:< script type = "text/javascript" >   function formValidation(){
      var number= document . form1. num. value;   if ( isNaN ( number)){     document
    . getElementById( "mynum" ). innerHTML= "Input must be a number!" ;    return
    false ;   } else {     return true ;     }   }   </ script>   < form name= "form1"
    onsubmit = "return formValidation()" >  Number : < input type= "text" name= "num"
    >< span id= "mynum" ></ span>< br/>  < input type= "submit" value= "submit" >
     </ form >   The isNaN() method is used in JavaScript to check whether a value
    is a number or not. We have used it in the above script. Run the code and you
    will get a form with an input field and a button as shown below:![](image3026.jpg)Enter
    a non-number value in the input field then click the Submit button. You will see
    the following message:![](image3031.jpg)The code returns the specified message
    if the input is not a number.Email validationJavaScript can be used for validation
    of email addresses. The following are the properties of a valid email address:'
