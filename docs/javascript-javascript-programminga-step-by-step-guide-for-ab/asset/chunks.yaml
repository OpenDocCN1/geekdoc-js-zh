- fmt: "\nThe following example shows how this object can be used:\n\n```html\n<script>\n\
    \  document.writeln(\"<br/>screen.height: \" + screen.height);\n  document.writeln(\"\
    <br/>screen.width: \" + screen.width);\n  document.writeln(\"<br/>screen.availHeight:\
    \ \" + screen.availHeight);\n  document.writeln(\"<br/>screen.availWidth: \" +\
    \ screen.availWidth);\n  document.writeln(\"<br/>screen.pixelDepth: \" + screen.pixelDepth);\n\
    \  document.writeln(\"<br/>screen.colorDepth: \" + screen.colorDepth);\n</script>\n\
    ```\nThe code returns the following after execution:![](image3899.jpg)\n\n## Page\
    \ Printing\n\nSometimes, you may need to send the contents of a particular web\
    \ page to a printer for printing. This can be done by adding a button which users\
    \ will have to click in order to print. This can be implemented using the `print`\
    \ method of `window` object. When the `window.print()` function is called, the\
    \ current page will be printed. The function can be called using `onClick()` event.\n\
    \nExample:\n```html\n<html>\n  <body>\n    <form>\n      <input type=\"button\"\
    \ value=\"Print Page\" onclick=\"window.print()\" />\n    </form>\n  </body>\n\
    </html>\n```\nExecute the script and you will see the following button:![](image3924.jpg)Click\
    \ the “Print Page” button. The page will be send to the printer for printing.\
    \ You will be asked to specify the various printing options.\n\n## Chapter 13-\
    \ JavaScript Cookies\n\nCookies refer to the data kept in text files on a computer.\
    \ During browsing, a web page is sent to the user’s browser, and the web server\
    \ forgets this. Cookies help in remembering information regarding users. Once\
    \ a user has visited a webpage, a cookie can help to store his name. The user\
    \ will be remembered the next time he visits the page. They are saved using name-value\
    \ pairs as shown below:\n\n`username = John Joel`\n\nOnce a user’s browser requests\
    \ for a page from the server, the page’s cookies are added to the request. The\
    \ server will then all the information it needs to remember users.\n\n### Creating\
    \ Cookies\n\nThe JavaScript `document.cookie` can be used for creation, deletion,\
    \ and reading of a cookie.\n\nExample:\n```javascript\ndocument.cookie = \"username=John\
    \ joel\";\n```\nAn expiry date for the cookie can also be added in UTC. After\
    \ closing a browser, the cookie becomes deleted.\n\nExample:\n```javascript\n\
    document.cookie = \"username=John Joel; expires=Fri, 22 Feb 2019 12:00:00 UTC\"\
    ;\n```\nThat is how you can specify the expiry date of a cookie. The path for\
    \ a cookie can also be specified.\n\nExample:\n```javascript\ndocument.cookie\
    \ = \"username=John Joel; expires=Fri, 22 Feb 2019 12:00:00 UTC; path=/\";\n```\n\
    The following script demonstrates this:\n\n```html\n<html>\n  <head>\n    <script\
    \ type=\"text/javascript\">\n      function CreateCookie() {\n        if (document.form1.field.value\
    \ == \"\") {\n          alert(\"Type a value\");\n          return;\n        }\n\
    \        value = escape(document.form1.field.value) + \";\";\n        document.cookie\
    \ = \"name=\" + value;\n        document.write(\"Creating Cookies: \" + \"name=\"\
    \ + value);\n      }\n    </script>\n  </head>\n  <body>\n    <form name=\"form1\"\
    \ action=\"\">\n      Name: <input type=\"text\" name=\"field\" />\n      <input\
    \ type=\"button\" value=\"Create Cookie\" onclick=\"CreateCookie();\" />\n   \
    \ </form>\n  </body>\n</html>\n```\nThe code will return the following form after\
    \ execution:![](image4003.jpg)Type a name in the field then click the “Create\
    \ Cookie” button. You should see the following:![](image4008.jpg)The cookie will\
    \ be created. You will then have a cookie with the name you typed in your computer.\
    \ If you need to create many cookies at once, separate them using commas.\n\n\
    ### Reading Cookies\n\nCookies can be rea using `document.cookie` object. The\
    \ cookie name is passed to the object. The string may be used anytime you are\
    \ need of accessing the cookie. The string `document.cookie` stores cookies in\
    \ the `name=value` pairs then separated using semicolons. The name represents\
    \ the name of the cookie, while the value denotes the string value. With the `split()`\
    \ function, one is able to break the string to get keys and values.\n\nExample:\n\
    ```javascript\n<script type=\"text/javascript\">\n  function ReadCookies() {\n\
    \    var cookies = document.cookie;\n    document.write(\"Cookies include: \"\
    \ + cookies);\n    myArray = cookies.split(';');\n    for (var x=0; x< myArray.length;\
    \ x++) {\n      name = myArray[x].split('=')[0];\n      value = myArray[x].split('=')[1];\n\
    \      document.write(\"The Key is : \" + name + \" and Value is : \" + value);\n\
    \    }\n  }\n</script>\n</head>\n<body>\n  <form name=\"form1\" action=\"\">\n\
    \    <p>Click the button to see result:</p>\n    <input type=\"button\" value=\"\
    Read Cookie\" onclick=\"ReadCookies()\" />\n  </form>\n</body>\n```\nExecute the\
    \ script and you will see the following interface:![](image4056.jpg)Click the\
    \ “Read Cookie” button. All cookies will be shown in the output.![](image4061.jpg)The\
    \ length in this case gives us the array length.\n\n### Deleting Cookies\n\nSometimes,\
    \ you may not need a cookie to be read. This calls for you to delete it. The deletion\
    \ of an array involves assigning to it an expiry date which is past the current\
    \ date.\n\nExample:\n```javascript\n<script type=\"text/javascript\">\n  function\
    \ CreateCookie() {\n    var time = new Date();\n    time.setMonth(time.getMonth()\
    \ - 1);\n    value = escape(document.form1.field.value) + \";\";\n    document.cookie\
    \ = \"name=\" + value;\n    document.cookie = \"expires=\" + time.toUTCString()\
    \ + \";\";\n    document.write(\"Set the Cookies : \" + \"name=\" + value);\n\
    \  }\n</script>\n</head>\n<body>\n  <form name=\"form1\" action=\"\">\n    Enter\
    \ name: <input type=\"text\" name=\"field\" />\n    <input type=\"button\" value=\"\
    Create Cookie\" onclick=\"CreateCookie()\" />\n  </form>\n</body>\n```\nIn the\
    \ example, we have deleted the cookie by setting its expiry date to last one month.\
    \ This logic has been achieved in the following line of the code:\n`time.setMonth(time.getMonth()\
    \ - 1);`\n\n## Chapter 14- Object Oriented Programming\n\nJavaScript supports\
    \ the concepts of object oriented programming. Let us discuss them:\n\n### Classes\n\
    \nJavaScript classes are a special type of JavaScript functions. Classes can be\
    \ defined in the same way as functions and function expressions. A JavaScript\
    \ class has many members, include methods or constructors. A JavaScript class\
    \ is executed in the strict mode. So any code with silent mistake or error will\
    \ throw an error. A class syntax is made up of two components:\n\n*   Class declarations\n\
    \n*   Class expressions\n"
