    \n`script` 标签指定了我们正在使用 JavaScript。这将帮助浏览器识别它被提供的数据类型。代码简单地调用了 JavaScript 的 `document.write()`\
    \ 方法，打印我们传递给它的文本。该方法用于使用 JavaScript 显示动态内容。\n\n正如我们上面提到的，有三个地方可以添加我们的 JavaScript\
    \ 代码。以下代码演示了如何在 `<body>` 和 `</body>` 标签之间添加代码：\n\n```html\n<html>\n<body>\n  <script\
    \ type=\"text/javascript\">\n    document.write(\"JavaScript makes web pages interactive!\"\
    );\n  </script>\n</body>\n</html>\n```\n\n这里是另一个示例，展示了我们如何显示一个警报框（alert box）：\n\
    \n```html\n<html>\n<body>\n  <script type=\"text/javascript\">\n    alert(\"Hello\
    \ World\");\n  </script>\n</body>\n</html>\n```\n\n我们调用了 `alert()` 方法，该方法会显示一个带有指定消息的警报框。在此时种情况下，消息将是\
    \ `Hello World`。\n\nJavaScript 代码也可以添加在 `<head>` 和 `</head>` 标签内。这里有一个示例：\n\n\
    ```html\n<html>\n<head>\n  <script type=\"text/javascript\">\n    function hello(){\n\
    \      alert(\"Hello World\");\n    }\n  </script>\n</head>\n<body>\n  <p>JavaScript</p>\n\
    \  <form>\n    <input type=\"button\" value=\"Click Me\" onclick=\"hello()\" />\n\
    \  </form>\n</body>\n</html>\n```\n\n我们在 `script` 标签内创建了一个名为 `hello()` 的方法。当该方法被调用时，应该返回一个带有\
    \ `Hello World` 消息的警报框。我们在 `<body> </body>` 标签内创建了一个带有按钮的表单。`onclick` 属性指定了点击按钮时要调用的方法。运行代码后，你应该得到以下结果：\n\
    ![](img/image358.jpg)\n\n点击“Click Me”按钮。你会看到带有 `Hello World` 消息的警报框。这就是将 JavaScript\
    \ 代码添加到 `<head> </head>` 标签内的方法。\n\n我们还可以创建一个外部 JavaScript 文件，然后将其嵌入到多个网页中。由于可以在许多\
    \ HTML 页面上使用此类页面，我们可以实现代码复用。任何外部 JavaScript 文件必须赋予以 `.js` 扩展结尾的名字，以将其标记为 JavaScript\
    \ 文件。所有的 JavaScript 代码都应该嵌入到单个文件中，以使网页响应更快。\n\n让我们创建一个外部 JavaScript 文件，在警报框中返回\
    \ `Hello World` 消息。该文件将被命名为 `hello.js`。\n\n**hello.js:**\n```javascript\nfunction\
    \ hello(){\n  alert(\"Hello World\");\n}\n```\n\n我们现在可以创建 HTML 文件并将 JavaScript\
    \ 文件的名称添加其中。这里是 html 文件的代码：\n**index.html:**\n```html\n<html>\n<head>\n  <script\
    \ type=\"text/javascript\" src=\"hello.js\"></script>\n</head>\n<body>\n  <p>JavaScript</p>\n\
    \  <form>\n    <input type=\"button\" value=\"Click Me\" onclick=\"hello()\" />\n\
    \  </form>\n</body>\n</html>\n```\n\nJavaScript 文件的文件名是在 `script` 标签中使用 `src`\
    \ 参数指定的。\n\n# JavaScript 注释\n\n注释为我们提供了一种传递消息的方式。注释有助于引导用户、添加描述代码的信息、建议或警告，让读者更容易解释代码。JavaScript\
    \ 引擎会忽略注释，这意味着它会直接跳过它们。\n\nJavaScript 注释可以跨单行或多行。要写单行注释，请在其前面加一个双斜杠（`//`）。例如：\n\
    \n```html\n<script>\n  // A single line comment in JavaScript\n  document.write(\"\
    Hello World\");\n</script>\n```\n\n这里是另一个示例：\n```javascript\nvar x = 5;\nvar y\
    \ = 15;\nvar z = x + y; //To add values of x and y\ndocument.write(z); //to print\
    \ sum of x and 15\n```\n\n多行注释被包含在 `/*` 和 `*/`（一个斜杠和一个星号）之间。这也可以用于单行注释。例如：\n\n\
    ```html\n<script>\n/* A multi-line comment in JavaScript\nJavaScript engine will\
