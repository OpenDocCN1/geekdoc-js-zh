  trans: "\n\n- 必须包含 `@` 和 `.`（点）符号。\n- `@` 之前和之后都应该有一个字符。\n- `.`（点）之后不能少于两个字符。\n\n\
    示例：\n```javascript\n<script type=\"text/javascript\">\n  function emailValidation()\
    \ {\n    var i= document.form1.emailAddress.value;\n    var atposition= i.indexOf(\"\
    @\");\n    var dotposition= i.lastIndexOf(\".\");\n    if (atposition< 1 || dotposition<\
    \ atposition+ 2 || dotposition+ 2 >= i.length){\n      alert (\"Please provide\
    \ valid e-mail address \\n atpostion:\" + atposition+ \"\\n dotposition:\" + dotposition);\n\
    \      return false ;\n    }\n  }\n</script>\n<body\n  <form name=\"form1\" method=\"\
    post\" action=\"#\" onsubmit=\"return emailValidation();\">\n    Email: <input\
    \ type=\"text\" name=\"emailAddress\"><br/>\n    <input type=\"submit\" value=\"\
    Submit Mail\">\n  </form>\n</body>\n```\n\n该代码执行后返回如下内容：![](img/image3081.jpg)\n\
    尝试输入一个无效的邮箱地址并点击 Submit Mail 按钮。观察发生了什么。你会得到以下警告框：![](img/image3085.jpg)\n\n###\
    \ 结合图片的验证\n你可能需要根据输入的正确否显示不同的图片。这可以通过 JavaScript 如下实现：\n\n```javascript\n<script\
    \ type=\"text/javascript\">\n  function formValidation(){\n    var name= document.form1.name.value;\n\
    \    var password = document.form1.password.value;\n    var status = false ;\n\
    \    if (name.length< 1 ){\n      document.getElementById(\"namespan\").innerHTML=\
    \ \" <img src='unchecked.gif'/> Please provide your name\";\n      status = false\
    \ ;\n    } else {\n      document.getElementById(\"namespan\").innerHTML= \" <img\
    \ src='checked.gif'/>\";\n      status = true ;\n    }\n    if (password.length<\
    \ 6){\n      document.getElementById(\"passwordspan\").innerHTML= \" <img src='unchecked.gif'/>\
    \ Password should be at least 8 char long\";\n      status = false ;\n    } else\
    \ {\n      document.getElementById(\"passwordspan\").innerHTML= \" <img src='checked.gif'/>\"\
    ;\n    }\n    return status ;\n  }\n</script>\n<form name=\"form1\" action=\"\
    #\" onsubmit=\"return formValidation()\">\n  <table>\n    <tr>\n      <td>Enter\
    \ Name:</td>\n      <td><input type=\"text\" name=\"name\" /><span id=\"namespan\"\
    ></span></td>\n    </tr>\n    <tr>\n      <td>Enter Password:</td>\n      <td><input\
    \ type=\"password\" name=\"password\" /><span id=\"passwordspan\"></span></td>\n\
    \    </tr>\n    <tr>\n      <td colspan=\"2\"><input type=\"submit\" value=\"\
    Login\" /></</td>\n    </tr>\n  </table>\n</form>\n```\n\n该脚本执行后会返回如下的简单表单：![](img/image3162.jpg)\n\
    在不输入用户名或密码的情况下点击 Login 按钮。你将在相关消息旁边看到图片。![](img/image3167.jpg)\n\n# 第 11 章 - 文档对象模型\
    \ (DOM)\n\n`document` 对象指的是你的整个 HTML 页面。当你将一个对象加载到网页浏览器后，它会立即成为一个文档对象，即代表 html\
    \ 文档的根元素。它包含了属性和方法。`document` 对象帮助我们向网页中添加内容。它是 `window` 的对象，这意味着拥有 `window.document`\
    \ 等同于拥有 `document`。\n\n## DOM 方法\n\nDOM 方法是你可以在 html 元素上执行的操作。DOM 属性是 HTML 元素的值，人们对其进行设置或更改。以下是文档对象的方法：\n\
    \n1. `write(\"string\")` - 向文档写入一个字符串。\n2. `writeln(\"string\")` - 向文档写入一个带有换行符的字符串。\n\
    3. `getElementById()` - 获取具有指定 `id` 的元素。\n4. `getElementsByName()` - 获取所有具有指定\
    \ `name` 的元素。\n5. `getElementsByTagName()` - 获取所有具有指定标签名的元素。\n6. `getElementsByClassName()`\
    \ - 获取所有具有指定类名的元素。\n\n## 获取字段值\nDOM 是获取输入字段值的一种好方法。很多时候你需要从用户那里获取输入。可以使用以下属性完成：`document.formname.name.value`\n\
    \n其中：\n- `document` - 代表我们根元素的 html 文档。\n- `form_name` - 带有字段的表单名称。\n- `field_name`\
    \ - 输入文本的名称。\n- `value` - 返回输入文本值的的属性。\n\n"
- fmt: "\nConsider the following example:\n```html\n<html>\n<body>\n  <script type=\"\
    text/javascript\">\n      function readValue(){\n        var name= document.memberform.memberName.value;\n\
    \        alert (\"Hi: \" + name);\n      }\n  </script>\n  <form name=\"memberform\"\
    >\n    Enter Name: <input type=\"text\" name=\"memberName\" />\n    <input type=\"\
    button\" onclick=\"readValue()\" value=\"Click Here\" />\n  </form>\n</body>\n\
    </html>\n```\n\nWhen you run the code, it will give you the following simple form:![](image3238.jpg)\n\
    \nJust enter your name in the input field and click the `Click Here` button. See\
    \ what happens.\n\nYou will get an alert box with your name and some text appended\
    \ to it:![](image3249.jpg)\n\nWe simply created a simple form with an input text\
    \ field. The method `readValue()` helps us get the value that we enter into the\
    \ field. Consider the following line: `var name= document.memberform.memberName.value;`\n\
    \nThe `memberName` is the name given to the text field in the form, and these\
    \ must match, otherwise, you will not get the right results.\n\n### `getElementById()`\n\
    \nOther than the name, we can also get the element by its id. This can be done\
    \ using the `document.getElementById()` method. However, the input text field\
    \ should be given an `id`.\n\nFor example:\n```html\n<html>\n<body>\n  <script\
    \ type=\"text/javascript\">\n      function computeSquare(){\n        var x= document.getElementById(\"\
    integer\").value;\n        alert ( x * x);\n      }\n  </script>\n  <form>\n \
    \   Enter an Integer: <input type=\"text\" id=\"integer\" name=\"myNumber /><br/>\n\
    \    <input type=\"button\" value=\"Compute Square\" onclick=\"computeSquare()\"\
    \ />\n  </form>\n</body>\n</html>\n```\n\nThe code should give you the following\
    \ simple form upon execution:![](image3289.jpg)\n\nEnter a number in the input\
    \ field and click the `Compute Square` button.\n\nThis should return the square\
    \ of the number in a popup box as shown below:![](image3300.jpg)\n\nIn the example,\
    \ we have defined the `computeSquare()` method which helps us get the square of\
    \ a number entered in the input text field. Consider the following line: `var\
    \ x= document.getElementById(\"integer\").value;`\n\nIn the line, we have used\
    \ the `getElementById()` method which takes the `id` of the input text field as\
    \ the argument. The method helps us get the value typed in the input text field\
    \ using its id.\n\n### `getElementsByName()`\n\nThe `document.getElementsByName()`\
    \ method can help us get an element by its name. The method has the syntax given\
    \ below: `document.getElementsByName(\"name\")`\n\nExample:\n```html\n<html>\n\
    <body>\n  <script type=\"text/javascript\">\n      function getNumber() {\n  \
    \      var options= document.getElementsByName(\"option\");\n        alert (\"\
    Total Options:\"+ options.length);\n      }\n  </script>\n  <form>\n    Yes: <input\
    \ type=\"radio\" name=\"option\" value=\"yes\">\n    No: <input type=\"radio\"\
    \ name=\"option\" value=\"no\">\n    <input type=\"button\" onclick=\"getNumber()\"\
    \ value=\"Available Options\" >\n  </form>\n</body>\n</html>\n```\n\nUpon execution,\
    \ the code returns the following:![](image3352.jpg)\n\nClick the `Available Options`\
    \ button and see what happens. A popup window will be shown as follows:![](image3357.jpg)\n\
    \nWe have created two radio buttons with options `Yes` and `No`. Note that these\
    \ two input types have been given the same name, that is, `option`.\n\nConsider\
    \ the following line: `var options= document.getElementsByName(\"option\");`\n\
    \nThe line helps us count the number of elements with the name `option`. This\
    \ should be 2 as shown in the output.\n\n### `getElementsByTagName()`\n\nThe `document.getElementsByTagName()`\
    \ property returns the elements with the tag name which is specified. It takes\
    \ the syntax given below: `document.getElementsByTagName(\"name\")`\n\nFor example:\n\
    ```html\n<html>\n<body>\n  <script type=\"text/javascript\">\n  function allparagraphs(){\n\
    \    var pgs= document.getElementsByTagName(\"p\");\n    alert (\"Total paragraphs\
    \ are: \" + pgs.length);\n  }\n  </script>\n  <p> This is a paragraph</p>\n  <p>\
    \ This is a paragraph</p>\n  <p> This is a paragraph</p>\n  <p> This is a paragraph</p>\n\
    \  <button onclick=\"allparagraphs()\" > Total Paragraphs</button>\n</body>\n\
    </html>\n```\n\nThe code returns the following upon execution:![](image3409.jpg)\n\
    \nClick the `Total Paragraphs` button and see what happens.\n\nYou will see the\
    \ following popup:![](image3416.jpg)\n\nThis means that the code was able to count\
    \ the number of paragraphs that we have. The main logic lies in the following\
    \ line: `var pgs= document.getElementsByTagName(\"p\");`\n\nWe have passed the\
    \ tag `p` as the argument to our method, and the output should be 4.\n\nHere is\
    \ another example:\n```html\n<html>\n<body>\n  <script type=\"text/javascript\"\
    >\n      function header2(){\n        var h2count= document.getElementsByTagName(\"\
    h2\");\n        alert (\"Total for h2: \"+ h2count.length);\n      }\n      function\
    \ header3(){\n        var h3count= document.getElementsByTagName(\"h3\");\n  \
    \      alert (\"Total for h3: \"+ h3count.length);\n      }\n  </script>\n  <h2>Heading\
    \ 1</h2>\n  <h2>Heading 2</h2>\n  <h2>Heading 3</h2>\n  <h2>Heading 4</h2>\n \
    \ <h3>Sub 1</h3>\n  <h3>Sub 2</h3>\n  <h3>Sub 3</h3>\n  <h3>Sub 4</h3>\n  <button\
    \ onclick=\"header2()\" >Count H2</button>\n  <button onclick=\"header3()\" >Count\
    \ H3</button>\n</body>\n</html>\n```\n*(Wait, let me re-align the provided text\
