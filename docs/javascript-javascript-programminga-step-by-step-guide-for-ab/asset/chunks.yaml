    JavaScript 是一种大小写敏感的脚本语言。\n\n### 消息 (Message)\n\n为我们提供了一种传递消息的方式。注释有助于引导用户、添加描述代码的信息、建议或警告，让读者更容易解释代码。JavaScript\
