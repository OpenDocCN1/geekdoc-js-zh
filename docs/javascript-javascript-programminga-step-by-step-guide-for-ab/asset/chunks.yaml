    the “Print Page” button. The page will be send to the printer for printing. You
    will be asked to specify the various printing options.Chapter 13- JavaScript CookiesCookies
    refer to the data kept in text files on a computer. During browsing, a web page
    is sent to the user’s browser, and the web server forgets this. Cookies help in
    remembering information regarding users. Once a user has visited a webpage, a
    cookie can help to store his name. The user will be remembered the next time he
    visits the page. They are saved using name-value pairs as shown below:username
    = John JoelOnce a user’s browser requests for a page from the server, the page’s
    cookies are added to the request. The server will then all the information it
    needs to remember users.Creating CookiesThe JavaScript document.cookie can be
    used for creation, deletion, and reading of a cookie.Example:document . cookie
    = "username=John joel" ;An expiry date for the cookie can also be added in UTC
    . After closing a browser, the cookie becomes deleted.Example:document . cookie
    = "username=John Joel; expires=Fri, 22 Feb 2019 12:00:00 UTC" ;That is how you
    can specify the expiry date of a cookie. The path for a cookie can also be specified.Example:document
    . cookie = "username=John Joel; expires=Fri, 22 Feb 2019 12:00:00 UTC; path=/"
    ;The following script demonstrates this:< html>< body>      < script type = "text/javascript"
    >            function CreateCookie()            {               if ( document
    . form1. field. value == "" ){                  alert ( "Type a value" );                  return
    ;               }value= escape ( document . form1. field. value) + ";" ;document
    . cookie= "name=" + value;document . write ( "Creating Cookies: " + "name=" +
    value );            }      </ script>   </ head>   < body>      < form name= "form1"
    action= "" >         Name: < input type= "text" name= "field" />         < input
    type= "button" value= "Create Cookie" onclick = "CreateCookie();" />      </ form
    ></ body></ html>The code will return the following form after execution:![](image4003.jpg)Type
    a name in the field then click the “Create Cookie” button. You should see the
    following:![](image4008.jpg)The cookie will be created. You will then have a cookie
    with the name you typed in your computer. If you need to create many cookies at
    once, separate them using commas.Reading CookiesCookies can be rea using document
    cookie object. The cookie name is passed to the object. The string may be used
    anytime you are in need of accessing the cookie. The string document. cookie stores
    cookies in the form name=value pairs then separated using semicolons. The name
    represents the name of the cookie, while the value denotes the string value.With
    the split() function, one is able to break the string to get keys and values.Example:      
    < script type= "text/javascript" >            function ReadCookies()            {               var
    cookies = document . cookie;               document . write ( "Cookies include:
    " + cookies );               myArray = cookies. split( '';'' );               for
    ( var x= 0 ; x< myArray. length; x++){                  name = myArray[ x]. split(
    ''='' )[ 0 ];                  value = myArray[ x]. split( ''='' )[ 1 ];                  document
    . write ( "The Key is : " + name + " and Value is : " + value);               }            }      </
    script>     </ head>   < body>      < form name= "form1" action= "" >         <
    p> Click the button to see result:</ p>         < input type= "button" value=
    "Read Cookie" onclick = "ReadCookies()" /></ form >Execute the script and you
    will see the following interface:![](image4056.jpg)Click the “Read Cookie” button.
    All cookies will be shown in the output.![](image4061.jpg)The length in this case
    gives us the array length.Deleting CookiesSometimes, you may not need a cookie
    to be read. This calls for you to delete it. The deletion of an array involves
    assigning to it an expiry date which is past the current date.Example:     < script
    type= "text/javascript" >            function CreateCookie()            {               var
    time = new Date ();               time. setMonth( time. getMonth() - 1 );               value
    = escape ( document . form1. field. value) + ";"               document . cookie=
    "name=" + value;               document . cookie = "expires=" + time. toUTCString()
    + ";"               document . write( "Set the Cookies : " + "name=" + value );            }      </
    script>   </ head>   < body>      < form name= "form1" action= "" >         Enter
    name: < input type= "text" name= "field" />         < input type= "button" value=
    "Create Cookie" onclick = "CreateCookie()" />      </ form >In the example, we
    have deleted the cookie by setting its expiry date to last one month. This logic
    has been achieved in the following line of the code:time. setMonth( time. getMonth()
    - 1 );Chapter 14- Object Oriented ProgrammingJavaScript supports the concepts
    of object oriented programming. Let us discuss them:ClassesJavaScript classes
    are a special type of JavaScript functions. Classes can be defined in the same
    way as functions and function expressions.A JavaScript class has many members,
    include methods or constructors. A JavaScript class is executed in the strict
    mode. So any code with silent mistake or error will throw an error.A class syntax
    is made up of two components:


    *   Class declarations


    *   Class expressions'
