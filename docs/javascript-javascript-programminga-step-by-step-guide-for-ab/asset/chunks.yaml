  trans: "\n\n# 类声明\n\n要声明一个类，我们使用类声明。这是通过使用 `class` 关键字后跟类名来实现的。JavaScript 的命名规范要求类名必须大写字母开头。以下是\
    \ JavaScript 类声明的一个示例：\n\n```javascript\n// Declare a class\nclass Student {\n\
    \  // Initialize an object\n  constructor (admission, name) {\n    this.admission\
    \ = admission;\n    this.name = name;\n  }\n  // Declare a method\n  detail()\
    \ {\n    document.writeln(this.admission + \" \" + this.name + \"<br>\")\n  }\n\
    }\n// pass an object to the variable\nvar student1 = new Student(3380, \"John\
    \ Joel\");\nvar student2 = new Student(102, \"Mercy George\");\nstudent1.detail();\
    \ //call a method\nstudent2.detail();\n```\n\n代码执行后返回如下：![](img/image4178.jpg)\n\
    \n我们创建了一个名为 `Student` 的类。然后我们初始化了一个带有两个参数 `admission` 和 `name` 的构造函数。接着，我们创建了一个名为\
    \ `detail()` 的方法，该方法应该返回学生的详情，包括录取号和姓名。\n\n考虑代码中提取的以下两行：\n```javascript\nvar student1\
    \ = new Student(3380, \"John Joel\");\nvar student2 = new Student(102, \"Mercy\
    \ George\");\n```\n\n我们正在做的被称为**实例化**。我们简单地创建了一个 `Student` 类型的实例/对象。这意味着 `student1`\
    \ 是 `Student` 的实例，因此它可以访问在 `Student` 类中定义的所有属性。这同样适用于 `student2`。每个学生的详情都作为参数传递了。最后，我们调用了\
    \ `detail()` 方法来返回每个学生的详情。\n\n与声明不同，类的声明不是 JavaScript 提升（hoisting）的一部分。这意味着你必须在调用类之前先对其进行声明。下面的示例演示了这一点：\n\
    \n```javascript\n// Here, we invoke the class before we declare it.\nvar student1\
    \ = new Student(3380, \"John Joel\");\nvar student2 = new Student(102, \"Mercy\
    \ George\");\nstudent1.detail(); //call a method\nstudent2.detail();\n// Declare\
    \ the class\nclass Student {\n  // Initialize an object\n  constructor (admission,\
    \ name) {\n    this.admission = admission;\n    this.name = name;\n  }\n  // Declare\
    \ a method\n  detail() {\n    document.writeln(this.admission + \" \" + this.name\
    \ + \"<br>\")\n  }\n}\n```\n\n上面的代码无法工作，因为我们尝试在声明类之前就访问它。一个类只能声明一次。如果你尝试声明多次，它将返回错误。以下是一个示例：\n\
    \n```html\n<html>\n<body>\n  <script>\n// Declare a class\nclass Student {\n \
    \ // Initialize an object\n  constructor (admission, name) {\n    this.admission\
    \ = admission;\n    this.name = name;\n  }\n  // Declare a method\n  detail()\
    \ {\n    document.writeln(this.admission + \" \" + this.name + \"<br>\")\n  }\n\
    }\n// pass an object to the variable\nvar student1 = new Student(3380, \"John\
    \ Joel\");\nvar student2 = new Student(102, \"Mercy George\");\nstudent1.detail();\
    \ //call a method\nstudent2.detail();\n// Re-declaring class\nclass Student {\n\
    }\n  </script>\n</body>\n</html>\n```\n\n上面的代码也不会运行，因为我们声明了两次 `Student` 类。\n\n\
    ## 类表达式\n\n类也可以使用类表达式来定义。在这种情况下，类名不是强制性的。这意味着你可以有一个命名的或未命名的类表达式。类表达式允许你获取类的名。然而，类声明不允许这样做。以下是匿名类表达式的示例：\n\
    \n```javascript\nvar stud = class {\n  constructor (admission, name) {\n    this.admission\
    \ = admission;\n    this.name = name;\n  }\n};\ndocument.writeln(stud.name);\n\
    ```\n\n执行后，代码将返回：![](img/image4331.jpg)\n\n类被赋值给了一个变量，而不是被命名。通过类表达式，我们可以重新声明一个类。\n\
    \n```javascript\n// Declare a class\nvar stud = class {\n  // Initialize an object\n\
    \  constructor (admission, name) {\n    this.admission = admission;\n    this.name\
    \ = name;\n  }\n  // Declare a method\n  detail() {\n    document.writeln(this.admission\
    \ + \" \" + this.name + \"<br>\")\n  }\n}\n// pass an object to the variable\n\
    var student1 = new stud(3380, \"John Joel\");\nvar student2 = new stud(102, \"\
    Mercy George\");\nstudent1.detail(); //call a method\nstudent2.detail(); //Re-declare\
    \ class\n```\n\n代码将成功返回如下：![](img/image4422.jpg)\n\n类表达式是可以命名的。在这种情况下，类名的作用域取决于类体。要获取类名，我们使用属性\
    \ `class.name`。考虑以下示例：\n\n```javascript\nvar stud = class Student {\n  constructor\
    \ (admission, name) {\n    this.admission = admission;\n    this.name = name;\n\
    \  }\n};\ndocument.writeln(stud.name);\n```\n\n代码成功运行并返回：![](img/image4447.jpg)\n\
    \n现在让我们尝试编写如下代码：\n\n```javascript\nvar stud = class Student {\n  constructor (admission,\
    \ name) {\n    this.admission = admission;\n    this.name = name;\n  }\n};\ndocument.writeln(Student.name);\n\
    ```\n\n代码将产生错误。\n\n## 对象\n\nJavaScript 中的对象是一个既有状态又有行为的实体，即属性和方法。对象的示例可以是椅子、鼠标、键盘、笔等。JavaScript\
    \ 是基于对象的运行。它将一切视为对象。它是基于模板的，而不是基于类的。JavaScript 为我们提供了三种创建对象的方法。这些包括：\n\n1.  使用对象字面量\n\
    \n2.  直接创建 `Object` 实例（通过 `new` 关键字）\n\n3.  使用对象构造函数（通过 `new` 关键字）\n\n"
- fmt: "\n# Using Object Literal\n\nTo create an object using an object literal, we\
    \ use the syntax given below:\n\n```javascript\nobject={ property1: value1, property2:\
    \ value2..... propertyN: valueN}\n```\n\nWe use a colon (`:`) to separate the\
    \ property from the value. The following example demonstrates how this method\
    \ can be used to create an object:\n\n```javascript\nstudent={ admission: 3380\
    \ , name: \"John Joel\" , age: 28 }\ndocument . write( student.admission+ \" \"\
    \ + student. name+ \" \" + student. age);\n```\n\nThe code returns the following\
    \ result: ![](image4499.jpg) The output clearly shows that the JavaScript interpreter\
    \ is able to know what the syntax means, in that the property comes first followed\
    \ by the value. That is why it was able to get the values of the properties we\
    \ need to access.\n\n# By creating an Object Instance\n\nThis is done using the\
    \ following syntax:\n```javascript\nvar object_name= new Object ();\n```\n\nNote\
    \ that we have used the `new` keyword to create the object. The following example\
    \ demonstrates how we can create an object directly:\n\n```javascript\nvar stud=\
    \ new Object ();\nstud. admission= 3380 ;\nstud. name= \"John Joel\" ;\nstud.\
    \ age= 28 ;\ndocument . write( stud.admission+ \" \" + stud. name+ \" \" + stud.\
    \ age);\n```\n\nThe code will print the following result:![](image4530.jpg)\n\n\
    # Using Object Constructor\n\nThis involves creating a function with arguments.\
    \ Every argument value can be assigned to the current object via this `this` keyword\
    \ which denotes the current object. Consider the following example:\n\n```javascript\n\
    function stud( admission, name, age){\n  this . admission= admission;\n  this\
    \ . name= name;\n  this . age= age;\n  }\ns= new stud( 3380 , \"John Joel\" ,\
    \ 28 );\ndocument . write( s.admission+ \" \" + s. name+ \" \" + s. age);\n```\n\
    \nThe code returns the following upon execution:![](image4556.jpg) JavaScript\
    \ allows us to define a method in an object. But before we can define the method,\
    \ we should first define a property with the same name as the method. The following\
    \ example shows how we can define a method in an object:\n\n```javascript\nfunction\
    \ stud( admission, name, age){\n  this . admission= admission;\n  this . name=\
    \ name;\n  this . age= age;\n  this . updateAge= updateAge;\n  function updateAge(\
    \ newAge){\n    this . age= newAge;\n  }\n  }\ns= new stud( 3380 , \"John Joel\"\
    \ , 28 );\ndocument . write( s.admission+ \" \" + s. name+ \" \" + s. age +\"\
    <br>\" );s. updateAge( 29 );\ndocument . write( s.admission+ \" \" + s. name+\
    \ \" \" + s. age);\n```\n\nThe code will return the following result after execution:![](image4592.jpg)\
    \ We have defined the `updateAge()` method that helps us change the age of the\
    \ student. In the example, the age of the student has been updated from 28 to\
    \ 29.\n\n# Prototype\n\nJavaScript language works based on prototypes, allowing\
    \ the objects to acquire features and properties from each other. Here, every\
    \ object has a prototype object. After the creation of a function in JavaScript,\
    \ the `prototype` property gets added to that function automatically. The property\
    \ is a prototype object holding the `constructor` property. Here is the syntax\
    \ for the creation of a prototype object in JavaScript:\n\n```javascript\nClassName.\
    \ prototype . methodName\n```\n\nAfter creating an object, the functions that\
    \ correspond to it are loaded into the memory. This means that a new copy of a\
    \ function for every object. Thus, all functions are loaded into the memory at\
    \ once.\n\n# Prototype Chaining\n\nEach JavaScript object has a prototype object\
    \ that acquires methods and properties from it. A prototype of an object may have\
    \ a prototype object that can acquire methods and properties, and this continues.\
    \ We can see this as prototype chaining. The following example demonstrates how\
    \ we can add a new method to a constructor function:\n\n```javascript\nfunction\
    \ Student( firstName, lastName){\n  this . firstName= firstName;\n  this . lastName=\
    \ lastName;}\nStudent. prototype . fullName= function ()\n  {\n    return this\
    \ . firstName+ \" \" + this . lastName;\n  }\nvar student1= new Student( \"John\"\
    \ , \"Joel\" );\nvar student2= new Student( \"Mercy\" , \"George\" );\ndocument\
    \ . writeln( student1.fullName()+ \"<br>\" );\ndocument . writeln( student2.fullName());\n\
    ```\n\nThe code returns the following result:![](image4638.jpg) The `fullName()`\
    \ function combines the `firstName` and the `lastName` to return the full name\
    \ of the student. Let us create another example that demonstrates how to add a\
    \ new property to a constructor function:\n\n```javascript\nfunction Student(\
    \ firstName, lastName){\n  this . firstName= firstName;\n  this . lastName= lastName;}\n\
    Student. prototype . school= \"ABC\"\nvar student1= new Student( \"John\" , \"\
    Joel\" );\nvar student2= new Student( \"Mercy\" , \"George\" );\ndocument . writeln(\
    \ student1.firstName+ \" \" + student1.lastName+ \" \" + student1.school+ \"<br>\"\
    \ );\ndocument . writeln( student2.firstName+ \" \" + student2.lastName+ \" \"\
    \ + student2.school+ \"<br>\" );\n```\n\nThe code should return the following\
    \ result![](image4668.jpg) We have created a prototype for `school` and all students\
    \ are inheriting it.\n\n# Constructor Method\n\nA constructor method is a special\
    \ method in JavaScript used for initialization and creation of objects. It is\
    \ called after the allocation of memory to an object. The constructor method is\
    \ declared using the `constructor` keyword. A class can only have one constructor\
    \ method. The parent class can be used via `super` keyword. The following example\
    \ shows how to declare a constructor method:\n\n```javascript\nclass Student {\n\
    \  constructor () {\n    this . admission= 3380 ;\n    this . name = \"John Joel\"\
    \ ;\n  }\n}\nvar stud = new Student();\ndocument . writeln( stud.admission+ \"\
    \ \" + stud.name);\n```\n\nThe code will follow![](image699.jpg) Note that the\
    \ constructor has a body denoted by `{}`. It is within the body of the constructor\
    \ that we have created and initialized the various properties.\n\n# Static Method\n\
    \nJavaScript provides us with static methods which only belong to the class not\
    \ to the class instances. This means that we’t need an instance to invoke a static\
    \ method. We call these methods directly on the class. A static method is declared\
    \ using the `static` keyword. The method can take any name. A class is allowed\
    \ to have more than one static method. In case more than one static method is\
    \ declared using one name, then the last method will be invoked after a call.\
    \ A static method can be called within another static method. A static method\
    \ can be used for the creation of utility functions. Here is an example of a static\
    \ method:\n\n```javascript\nclass StaticTest{\n  static show()\n  {\n    return\
    \ \"Static method has been invoked\"\n  }\n}\ndocument . writeln( StaticTest.show());\n\
    ```\n\nThe code will print the following after execution![](image4730.jpg) The\
    \ `show()` method has been declared using the `static` keyword, which makes it\
    \ a static method. Let us see how one can invoke more than one method:\n\n```javascript\n\
    class StaticTest{\n  static show1()\n  {\n    return \"Static method has been\
    \ invoked\"\n  }\n  static show2()\n  {\n    return \"Static method invoked again\"\
    \n  }\n}\ndocument . writeln( StaticTest.show1()+ \"<br>\" );\ndocument . writeln(\
    \ StaticTest.show2());\n```\n\nThe code will return the following once executed![](image4765.jpg)\
    \ We have created two static methods, `show1()` and `show2()`. We have then invoked\
    \ them to get the result above. We can create more than one static method with\
    \ the same name and invoke them. This is demonstrated below:\n\n```javascript\n\
    class StaticTest{\n  static show()\n  {\n    return \"Static method has been invoked\"\
    \n  }\n  static show()\n  {\n    return \"Static method invoked again\"\n  }\n\
    }\ndocument . writeln( StaticTest.show());\n```\n\nA static method can also be\
    \ invoked within a constructor. This is demonstrated below:\n\n```javascript\n\
    class StaticTest {\n  constructor () {\n    document . writeln( StaticTest.show()+\
    \ \"<br>\" );\n    document . writeln( this.constructor.show());\n  }\n  static\
    \ show() {\n    return \"Static method has been invoked\"\n  }\n}\nvar st= new\
    \ StaticTest();\n```\n\nThe code returns the following result![](image4823.jpg)\
    \ A static method can also be invoked from within a non-static method. For example:\n\
    \n```javascript\nclass StaticTest {\n  static show() {\n    return \"static method\
    \ has been invoked\"\n  }\n  show() {\n    document . writeln( StaticTest.show()+\
    \ \"<br>\" );\n  }\n}\nvar st= new StaticTest();\nst. show();\n```\n\nThe code\
    \ returns the following result![](image4854.jpg)\n\n# Encapsulation\n\nEncapsulation\
    \ refers to the process of binding data together with the functions that act on\
    \ that data. It is a good way of controlling data and validating it. To achieve\
    \ this in JavaScript, you should make the data members private using the `var`\
    \ keyword. Setter methods can be used for setting the data while getter methods\
    \ can be used for getting the data. Consider the following example:\n\n```javascript\n\
    class Student {\n  constructor () {\n    var name;\n    var score;\n  }\n  getStudentName()\
    \ {\n    return name;\n  }\n  setStudentName( name) {\n    this. name= name;\n\
    \  }\n  getScore() {\n    return score;\n  }\n  setScore( score) {\n    this.\
    \ score= score;\n  }\n}\nvar st= new Student();\nst. setStudentName( \"John\"\
    \ );\nst. setScore( 78 );\ndocument . writeln( st.getStudentName()+ \" \" + st.getScore());\n\
    ```\n\nThe code will return the following after execution![](image4921.jpg) Let\
    \ us see how we can validate the student’s score:\n\n```javascript\nclass Student\
    \ {\n  constructor () {\n    var name;\n    var score;\n  }\n  getStudentName()\
    \ {\n    return name;\n  }\n  setStudentName( name) {\n    this. name= name;\n\
    \  }\n  getScore() {\n    return score;\n  }\n  setScore( score) {\n    if ( score<\
    \ 0 || score> 100 ) {\n      alert ( \"Invalid Score\" );\n    }\n    else {\n\
    \      this. score= score;\n    }\n  }\n}\nvar st= new Student();\nst. setStudentName(\
    \ \"John\" );\nst. setScore( 105 ); //alert() invokes\ndocument . writeln( st.getStudentName()+\
    \ \" \" + st.getScore());\n```\n\nThe score has been validated in the `setScore()`\
    \ method. If it is not between 0 and 100, it will be an invalid score. We have\
    \ set the score to 105. Execution of the code returns the following result![](image5001.jpg)\
    \ Let us modify the score and set it to 78:\n\n```javascript\nclass Student {\n\
    \  constructor () {\n    var name;\n    var score;\n  }\n  getStudentName() {\n\
    \    return name;\n  }\n  setStudentName( name) {\n    this. name= name;\n  }\n\
    \  getScore() {\n    return score;\n  }\n  setScore( score) {\n    if ( score<\
    \ 0 || score> 100 ) {\n      alert ( \"Invalid Score\" );\n    }\n    else {\n\
    \      this. score= score;\n    }\n  }\n}\nvar st= new Student();\nst. setStudentName(\
    \ \"John\" );\nst. setScore( 78 ); //alert() invokes\ndocument . writeln( st.getStudentName()+\
    \ \" \" + st.getScore());\n```\n\nThe code returns the following result after\
    \ execution![](image5086.jpg) We can also implement encapsulation using a prototype-based\
    \ approach as shown below:\n\n```javascript\nfunction Student( name, score) {\n\
    \  var sname= name;\n  var s_score= score;\n  Object . defineProperty( this, \"\
    name\", {\n    get: function () {\n      return sname;\n    },\n    set: function\
    \ ( sname) {\n      this. sname= sname;\n    }\n  });\n  Object . defineProperty(\
    \ this, \"score\", {\n    get: function () {\n      return s_score;\n    },\n\
    \    set: function ( s_score) {\n      this. s_score= s_score;\n    }\n  });\n\
    }\nvar st= new Student( \"John\" , 78 );\ndocument . writeln( st.name+ \" \" +\
    \ st.score);\n```\n\nThe code will print the following output![](image5086.jpg)\n\
    \n# Inheritance\n\nWith this JavaScript feature, we can create new classes that\
    \ are based on the already existing classes. It provides a child class with a\
    \ way to use the methods and properties that belong to the parent class. In JavaScript,\
    \ inheritance is done using the `extends` keyword. With this keyword, we create\
    \ a child class that is based on the parent class. After that, the child class\
    \ will be able to acquire the behavior and properties of the parent class.\n\n\
    Inheritance maintains the IS-A relationship. Inheritance can also be achieved\
    \ using prototype-based approach. Consider the following example where `Current`\
    \ inherits `Date`:\n\n```javascript\nclass Current extends Date {\n  constructor\
    \ () {\n    super ();\n  }\n}\nvar c= new Current();\ndocument . writeln( \"Today\
    \ is:\" )\ndocument . writeln( c.getDate()+\" c.getMonth()+1+\" + c.getFullYear());\n\
    ```\n\nThe code will return the output below![](image175.jpg) The code returns\
    \ the date of today. Here is another example:\n\n```javascript\nclass Current\
    \ extends Date {\n  constructor ( year) {\n    super ( year);\n  }\n}\nvar c=\
    \ new Current( \"April 20, 1958 17:32\" );\ndocument . writeln( \"The year:\"\
    \ )\ndocument . writeln( c.getFullYear());\n```\n\nIn the above example, we have\
    \ created a date value and we used the `getFullYear()` method to get the year\
    \ only. The code returns the following after execution![](image205.jpg) This shows\
    \ that the method was able to successfully extract the year part of the provided\
    \ date. Here is another example in which we are creating sub-class to inherit\
    \ from the parent class:\n\n```javascript\nclass Car{\n  constructor () {\n  \
    \  this . manufacturer= \"Toyota\" ;\n  }\n}\nclass Model extends Car {\n  constructor\
    \ ( name, year) {\n    super ();\n    this . name= name;\n    this . year= year;\n\
    \  }}\nvar m = new Model( \"Harrier\" , \"2012\" );\ndocument . writeln( m.manufacturer+\
    \ \" \" + m.name+ \" \" + m.year);\n```\n\nThe code returns the following result![](image247.jpg)\
    \ Let us demonstrate how prototype-based inheritance can be done, where we don’t\
    \ have to use the `extends` and `class` keywords:\n\n```javascript\n//A Constructor\
    \ function\nfunction Car( manufacturer) {\n  this . manufacturer= manufacturer;\n\
    }\nCar. prototype . getManufacturer= function ()\n  {\n    return this . manufacturer;\n\
    \  }\n//Another constructor function//Second constructor function\nfunction Model(\
    \ name, year) {\n  this . name= name;\n  this . year= year;\n}\nvar car = new\
    \ Car( \"Toyota\" );\nmodel. prototype = car; //Now Bike treats as parent of Vehicle.\n\
    var model= new Model( \"Harrier\" , 2012 );\ndocument . writeln( model.getManufacturer()+\
    \ \" \" + model.name+ \" \" + model.year);\n```\n\n# Polymorphism\n\nPolymorphism\
    \ is a key feature of an object-oriented programming paradigm that makes it possible\
    \ for one to perform a single action in different ways. With polymorphism, we\
    \ can invoke one method on various JavaScript objects. JavaScript isn’t a type-safe\
    \ language; hence members of any data type can be passed with the methods. Consider\
    \ the example given below:\n\n```javascript\nclass Parent {\n  show() {\n    document\
    \ . writeln( \"Parent class invoked\" );\n  }\n}\nclass Child extends Parent {\n\
    }\nvar ch= new Child();\nch. show();\n```\n\nThe code will return the following![](image5325.jpg)\
    \ Here is another example:\n\n```javascript\nclass Parent {\n  show() {\n    document\
    \ . writeln( \"Parent class invoked<br>\" );\n  }\n}\nclass Child extends Parent\
    \ {\n  show() {\n    document . writeln( \"Child class invoked\" );\n  }\n}\n\
    var p=[ new Parent(), new Child()]\np. forEach( function ( message){message. show();});\n\
    ```\n\nThe `show()` method behaves differently based on the object for which it\
    \ is invoked. The code prints the following output:![](image5370.jpg) We can implement\
    \ the same example but this time via a prototype-based approach. This is demonstrated\
    \ below:\n\n```javascript\nfunction Parent(){}\nParent. prototype . show= function\
    \ (){\n  return \"Parent class invoked\" ;\n}\nfunction Child(){}\nChild. prototype\
    \ = Object . create( Parent. prototype );\nvar p=[ new Parent(), new Child()]\n\
    p. forEach( function ( message){\n  document . writeln( message. show()+ \"<br>\"\
    \ );\n});\n```\n\nChapter 15- Multimedia\n\nJavaScript has the plugin's object\
    \ which is a child of navigator object. It’s an array, and it comes with some\
    \ single entry for a browser plugin. Browsers such as firefox and Netscape support\
    \ the use of the `navigator.plugins` object. Consider the script below:\n\n```html\n\
    <table border=\"1\" >\n  <tr>\n    <th>Name of PLugin</th>\n    <th>Filename</th>\n\
    \    <th>Description</th>\n  </tr>\n  <script language=\"JavaScript\" type=\"\
    text/javascript\">\n    for ( x= 0 ; x< navigator .plugins. length; x++) {\n \
    \     document . write( \"<tr><td>\" );\n      document . write( navigator .plugins[\
    \ x].name);\n      document . write( \"</td><td>\" );\n      document . write(\
    \ navigator .plugins[ x].filename);\n      document . write( \"</td><td>\" );\n\
    \      document . write( navigator .plugins[ x].description);\n      document\
    \ . write( \"</td></tr>\" );\n    }\n  </script>\n</table>\n```\n\nOnce executed,\
    \ the script will show you a list of all plug-ins installed on your browser. Each\
    \ plugin-in is represented as an entry in the array. Each entry has the following\
    \ properties:\n"
