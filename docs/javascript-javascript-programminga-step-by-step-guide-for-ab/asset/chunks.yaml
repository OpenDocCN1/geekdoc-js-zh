    form >The code returns the following upon execution:![](image3738.jpg)Click the
    “Animate” button. The animation should start. When you click the Stop button,
    the animation will stop.The animateImage() method is calling the setTimeout method
    which sets the position of the image after every 20 milliseconds. This will result
    in the animation of the image. The stopAnimation() method helps in clearing the
    timer which is set by the setTimeout() method. The object, which is the image,
    is set back to its initial position.RolloverWe can use a mouse image to rollover
    an image in JavaScript. Once you move the mouse over the image, it will change
    to another image.Example:< html>< body>< script type= "text/javascript" >            if
    ( document . images ){               var img1 = new Image();               img1.
    src = "ps.jpg" ;               var img2 = new Image();               img2. src
    = "house.jpg" ;            }      </ script>    </ head>   < body>      < p> Move
    mouse over to rollover</ p>       < a href= "#" onMouseOver= "document.img.src=img2.src;"onMouseOut=
    "document.img.src=img1.src;" >      < img name= "img" src= "nicsam.jpg" />      </
    a></ body></ html>We have used the if statement to check whether the image exists
    or not. We have the used the Image() constructor so as to preload some new object
    named img1 . The same has also been done to preload the second image, img2 . The
    src is given the name of the image stored externally. The # helps to disable the
    link so that a URL is not opened once it is clicked. The method onMouseOver is
    called once the mouse cursor is moved over the image. The onMouseOut method will
    be called once the mouse cursor is moved out of the image.Chapter 12- Browser
    Object ModelThe BOM (Browser Object Model) is used for interaction with the browser.
    The default browser object is a window , meaning that you can call all window
    functions directly or by specifying the window. We had discussed this, so we will
    not revisit it. Other than the window object, there are various other BOM objects.
    Let us discuss them:History ObjectThis object keeps an array of all URLs that
    the user has visited. You can use this object to load web pages, previous, forward
    and any certain web page. This object can be accessed as shown below:window .
    history   It can also be accessed as follows:historyThis object has only one property,
    which is the length and it returns the length of history URLs. The history object
    has 3 methods which include the following:


    *   forward() - it will load the next page


    *   back() - it will​ load the previous page


    *   go() - it will load a given page number.


    The history object can be used in the following various ways:


    1.  history.back();// for previous page   


    2.  history.forward();// for next page   


    3.  history.go(2);// for next 2nd page   


    4.  history.go(-2);// for previous 2nd page   


    Navigator ObjectThis object is used for detecting browsers. It can help get information
    about the browser in terms of appName , userAgent , appCodeName etc.The navigator
    object is a property of the window, and we can access it as follows:window . navigator
       It can also be accessed as follows:navigator   The object comes with various
    properties including the following:


    *   appName - it returns the name


    *   appCodeName - it returns code name


    *   appVersion - it returns the version


    *   cookieEnabled - it returns true if browser cookies are enabled and false otherwise


    *   language - it returns the language. Supported in Firefox and Netscape only.


    *   userAgent - it returns user agent


    *   userLanguage - it returns the users’ language. It’s supported only in IE.


    *   systemLanguage - it returns system language. Supported only in IE.


    *   Plugins - it returns the plugins. Supported in Firefox and Netscape only.


    *   mimeTypes[] - it returns an array of mime type. Supported in Firefox and Netscape
    only.


    *   online - it returns true if the browser is online and false otherwise.


    *   platform - it returns the platform such as Win32.


    The navigator object has the following methods:


    *   javaEnabled() - it checks whether java has been enabled.


    *   taintEnabled() - it checks whether taint has been enabled. Deprecated from
    JavaScript 1.2.'
