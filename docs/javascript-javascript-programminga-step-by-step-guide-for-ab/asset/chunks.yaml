- fmt: "\n# Array Literal Creation\n\nArray LiteralCreation of an array by use of\
    \ array literal takes the following syntax: `var name_of_array=[ val1, val2.....\
    \ valN];`. The values are added with square brackets `[]` and separated using\
    \ commas.\n\nExample:\n```html\n<script type=\"text/javascript\">\n  var array1=[\
    \ \"Nicholas\" , \"Samuel\" , \"Vickie\" ];\n  for ( j= 0 ; j< array1. length;\
    \ j++){\n    document . write( array1[ j] + \"<br/\" );\n  }\n</script>\n```\n\
    We have created the array `array1` with three values, which are names of individuals.\
    \ A for loop has been used to iterate the values of the array, and then we have\
    \ printed them. The `.length` property normally returns the array length. Once\
    \ executed, the values in the array will be printed as shown below:\n![](image1821.jpg)\n\
    \n## Creating an Array Directly\n\nAn array can be created directly by following\
    \ the syntax given below: `var name_of_array= new Array ();`. With the `new` keyword,\
    \ an instance of an array is created.\n\nExample:\n```html\n<script type=\"text/javascript\"\
    >\n  var x;\n  var array2 = new Array ();\n  array2[ 0 ] = \"Nicholas\" ;\n  array2[\
    \ 1 ] = \"Samuel\" ;\n  array2[ 2 ] = \"Vickie\" ;\n  for ( x= 0 ; x< array2.\
    \ length; x++){\n    document . write( array2[ x ] + \"<br>\" );\n  }\n</script>\n\
    ```\nIn the example, we have used the `new` keyword to create the array named\
    \ `array2`. The next step is to populate elements in the array. Note that the\
    \ position of array elements is denoted using indices. The first element in the\
    \ array is at index `0`, the second element at index `1`, and the chain continues.\n\
    \nConsider the following line: `array2[ 1 ] = \"Samuel\" ;`. The line states that\
    \ we store the element “Samuel” at index `1` of the array named `array2`. We have\
    \ then used the variable `x` so as to iterate these elements of the array and\
    \ print them.\n\n## Array Constructor\n\nWe create an instance of the array by\
    \ simply passing arguments in the constructor instead of providing the value explicitly.\
    \ The script given below demonstrates this:\n```html\n<script type=\"text/javascript\"\
    >\n  var array3= new Array ( \"Nicholas\" , \"Samuel\" , \"Vickie\" );\n  for\
    \ ( x= 0 ; x< array3. length; x++){\n    document . write( array3[ x ] + \"<br>\"\
    \ );\n  }\n</script>\n```\nIn the above example, we have created an array named\
    \ `array3`. The creation of the array and addition of elements to it has been\
    \ done in the same line using a constructor. The for loop helps us iterate through\
    \ the array elements and print them to the screen.\n\n## Array Methods\n\nJavaScript\
    \ comes with many in-built array methods that we can use to manipulate the elements\
    \ of the array. Let us discuss these methods:\n\n### concat()\nThe `concat()`\
    \ method combines arrays to return a single string. The arrays can be two or more.\
    \ Note that the elements of the initial array will not be changed. The methods\
    \ take the following syntax: `array. concat( array1, array2,...., array_n)` the\
    \ parameters to the method are the arrays that you need to concatenate. The method\
    \ returns a new object which is a combination of all the arrays.\n\nConsider the\
    \ following example:\n```html\n<script>\nvar array1=[ \"Nicholas\" , \"James\"\
    \ , \"Jane\" ];\nvar array2=[ \"Alex\" , \"Fidel\" , \"Alice\" ];\nvar output=\
    \ array1. concat( array2);\ndocument . writeln( output);\n</script>\n```\nWe have\
    \ created two arrays, `array1` and `array2`. Each array has a list of name. We\
    \ have concatenated these two arrays into one object named `output`. The code\
    \ will print the following output:\n![](image1897.jpg)\n\nIn the above example,\
    \ we have concatenated two arrays. A concatenation of three arrays can be obtained\
    \ as follows:\n```html\n<script>\nvar array1=[ \"Nicholas\" , \"James\" , \"Jane\"\
    \ ];\nvar array2=[ \"Alex\" , \"Fidel\" , \"Alice\" ];\nvar array3=[ \"Joel\"\
    \ , \"Mercy\" , \"George\" ];\nvar output= array1. concat( array2, array3);\n\
    document . writeln( output);\n</script>\n```\nThe code will return the following\
    \ result:\n![](image1918.jpg)\n\nOther than creating different arrays and trying\
    \ to concatenate the objects, we can concatenate the objects directly. This is\
    \ demonstrated in the following example:\n```html\n<script>\nvar array1=[ \"Nicholas\"\
    \ , \"James\" , \"Jane\" ];\nvar output= array1. concat( \"Alex\" , \"Fidel\"\
    \ , \"Alice\" );\ndocument . writeln( output);\n</script>\n```\nThe code will\
    \ return the following example:\n![](image1934.jpg)\n\n### copyWithin()\nWhen\
    \ this method is used, it will copy a part of a given array with own elements\
    \ and return the modified array. Note that the length of the modified array will\
    \ not be changed. The method takes the syntax given below: `array. copyWithin(\
    \ target, start, end)`. The `target` is where the copied element will take place.\
    \ The `start` parameter is optional. It denotes the index from which copying of\
    \ the elements by the method will begin. Its default value is `0`, meaning that\
    \ copying begins at index `0`, which is the first element of the array. The `end`\
    \ parameter is also optional. It denotes the index at which the method will stop.\
    \ It has a default value of `array.length-1`, which is the last element in the\
    \ array.\n\nConsider the example below:\n```html\n<script>\nvar array1=[ \"Nicholas\"\
    \ , \"James\" , \"Jane\" , \"Alice\" ];\n// place at index 0, the element between\
    \ 1st and 3rd elements\nvar output= array1. copyWithin( 0 , 1 , 2 );\ndocument\
    \ . writeln( output);\n</script>\n```\nThe code returns the following:\n![](image964.jpg)\n\
    What happened is that the element between 1st and 3rd elements was copied to the\
    \ index `0`. That is why the element `Nicholas` was replaced by the element `James`.\
    \ The rest of the array elements have not been affected.\n\nLet us see how we\
    \ can provide only the target and start indexes:\n```html\n<script>\nvar array1=[\
    \ \"Nicholas\" , \"James\" , \"Jane\" , \"Alice\" ];\nvar output= array1. copyWithin(\
    \ 1 , 2 );\ndocument . writeln( output);\n</script>\n```\nThe code should return\
    \ the following:\n![](image981.jpg)\n\nIt is also possible for us to provide only\
    \ the target index:\n```html\n<script>\nvar array1=[ \"Nicholas\" , \"James\"\
    \ , \"Jane\" , \"Alice\" ];\nvar output= array1. copyWithin( 2 );\ndocument .\
    \ writeln( output);\n</script>\n```\nThe code will return the following:\n![](image2002.jpg)\n\
    \n### fill()\nThis method is used for filling the elements of an array with some\
    \ static values. When used, the original array is modified. If none of the elements\
    \ met the condition, this method will return undefined. It takes the following\
    \ syntax: `array. fill( value[, start[, end]])`. `value` parameter denotes the\
    \ static value to be filled. The `start` parameter is optional. It is the index\
    \ from which filling will begin. Its default value is `0`, which is the first\
    \ element in the array. The `end` parameter is also optional. It denotes the index\
    \ at which filling of the values will stop.\n\nConsider the following example:\n\
    ```html\n<script>\nvar array1=[ \"Nicholas\" , \"James\" , \"Jane\" , \"Alice\"\
    \ , \"George\" ];\nvar output= array1. fill( \"Joel\" );\ndocument . writeln(\
    \ array1);\n</script>\n```\nThe code will return the following:\n![](image2028.jpg)\n\
    All the array values have been replaced with `Joel`. Let us see how we can provide\
    \ or state the starting index:\n```html\n<script>\nvar array1=[ \"Nicholas\" ,\
    \ \"James\" , \"Jane\" , \"Alice\" , \"George\" ];\nvar output= array1. fill(\
    \ \"Joel\" , 2 );\ndocument . writeln( array1);\n</script>\n```\nIn the above\
    \ example, the filling will start at the element after index `2`. The code should\
    \ return the following result:\n![](image2044.jpg)\n\nThe following example demonstrates\
    \ how we can state both the start and stop/end indexes:\n```html\n<script>\nvar\
    \ array1=[ \"Nicholas\" , \"James\" , \"Jane\" , \"Alice\" , \"George\" ];\nvar\
    \ output= array1. fill( \"Joel\" , 1 , 3 );\ndocument . writeln( array1);\n</script>\n\
    ```\nThe code should return the following:\n![](image2059.jpg)\n\n### every()\n\
    The purpose of this method is to check whether all array elements satisfy the\
    \ given condition. If all array elements meet the condition, the method will return\
    \ a `true`, otherwise `false`. The method takes the syntax given below: `array.\
    \ every( callback( current-value, index, arr), thisArg)`. `callback` is the function\
    \ for testing the condition. `current-value` denotes the current element of the\
    \ array. `index` parameter is optional and it denotes the index of the current\
    \ element. The `arr` parameter denotes the array to we are to apply the `every()`\
    \ function. `thisArg` is an optional parameter. This is the value to be used as\
    \ `this` during the execution of the callback. The method returns a Boolean value.\n\
    \nConsider the following example:\n```html\n<script>\nvar marks=[ 20 , 25 , 15\
    \ , 37 , 27 ];\nfunction confirm ( x){\n  return x> 10 ;\n  //to return true as\
    \ all marks are above 10\n}\ndocument . writeln( marks. every( confirm ));\n</script>\n\
    ```\nThe code returns `true`. We have defined an array with a set of integer values,\
    \ which are `marks`. All marks are above 10. The purpose of the `confirm()` is\
    \ to check whether all marks are above 10. Since this is true, the `every()` function\
    \ returns a `true`. Let us change one of the values to be below 10 and see what\
    \ happens:\n```html\n<script>\nvar marks= [ 20 , 5 , 15 , 37 , 27 ];\nfunction\
    \ confirm ( x){\n  return x> 10 ;\n  //to return true as all marks are above 10\n\
    }\ndocument . writeln( marks. every( confirm ));\n</script>\n```\nThe code will\
    \ return a `false` as the marks at index `1` is less than 10, that is, `5`. In\
    \ the example given below, we are checking the number of elements present in the\
    \ array:\n```html\n<script>\nfunction confirm ( item, index, array) {\n  return\
    \ index < 3 ;\n}\ndocument . writeln([ 20 , 5 ]. every( confirm )); //true\ndocument\
    \ . writeln([ 20 , 5 , 1 , 35 , 46 ]. every( confirm )); //false\n</script>\n\
    ```\nThe outputs are shown as comments. In the first execution of the method,\
    \ we are passing an array with two elements, `20` and `5`. Our condition checks\
    \ whether we have a total of `3` or fewer elements. Since we only have elements,\
    \ this will give us `true`. In the second case, our array has `5` elements. Since\
    \ these are more than `3`, it will return `false`.\n\n### find()\nThis method\
    \ will return the first element in an array that meets the specified condition.\
    \ It takes the following syntax: `array. find( callback( value, index, arr), thisArg)`.\
    \ `callback` is the function that to execute element. `value` is the current element\
    \ of the array. `index` parameter is optional. It denotes the index of the current\
    \ element. The `arr` parameter is the array that was operated by the `find()`\
    \ method. `thisArg` is also optional. It denotes the value to be used as `this`\
    \ during the execution of the callback. The method returns `undefined`.\n\nThe\
    \ following example demonstrates how to use the `find()` method:\n```html\n<script>\n\
    var array1=[ 20 , 45 , 14 , 33 , 18 ];\nvar output= array1. find( x=> x>20 );\n\
    document . writeln( output)\n</script>\n```\nIn the above code, we are checking\
    \ for an element whose value is greater than `20`. The method will find `45`,\
    \ hence should be the output. The following example demonstrates how we can use\
    \ the same method to find a prime number:\n```html\n<script>\nfunction checkPrime(\
    \ item, index, arr) {\n  var start = 2 ;\n  while ( start <= Math . sqrt(item))\
    \ {\n    if ( item % start++ < 1 ) {\n      return false ;\n    }\n  }\n  return\
    \ item > 1 ;\n}\ndocument . writeln([ 4 , 6 , 11 , 26 ]. find(checkPrime));\n\
    </script>\n```\nThe function will find `11` as the prime number.\n\n### forEach()\n\
    This method helps us to invoke a function once for every array element. It takes\
    \ the syntax given below: `array. forEach( callback( current-value, index, arr),\
    \ thisArg)`. `callback` is the function for testing the condition. `current-value`\
    \ denotes the current element of the array. `index` parameter is optional and\
    \ it denotes the index of the current element. `arr` parameter denotes the array\
    \ to which we are to apply the `forEach()` function. `thisArg` is an optional\
    \ parameter. This is the value to be used as `this` during execution of the callback.\
    \ The method will return `undefined`.\n\nFor example:\n```html\n<script>\nvar\
    \ array1 = ['Java' , 'C#' , 'Python' ];\narray1. forEach( function ( values) {\n\
    \  document . writeln( values);\n});\n</script>\n```\nWe have used the `forEach()`\
    \ method to access and print the elements of the array. The code prints the following:\n\
    ![](image192.jpg)\nWe can also use the same function to create a Fibonacci series:\n\
    ```html\n<script>\nvar addition = 0 ;\nvar array1 = [ 2 , 8 , 14 , 24 ];\narray1.\
    \ forEach( function fib( item) {\n  addition = addition + item;\n  document .\
    \ writeln( addition);\n});\n</script>\n```\nThe code returns a Fibonacci sequence\
    \ of the array elements. Note that the Fibonacci is a sequential addition of elements.\
    \ Here is the output:![](image214.jpg)\n\n### pop()\nThis method will remove the\
    \ last element from an array and return the element. It has the effect of changing\
    \ the length of the array. It has a simple syntax shown below: `array. pop()`.\
    \ It returns the last element of the specified array.\n\nConsider the following\
    \ example:\n```html\n<script>\nvar array1=[ \"Java\" , \"C#\" , \"Python\" ];\n\
    document . writeln( \"Initial array: \" + array1+ \"<br>\" );\ndocument . writeln(\
    \ \"Popped out item: \" + array1.pop()+ \"<br>\" );\ndocument . writeln( \"Final\
    \ array: \" + array1);\n</script>\n```\nThe code will return the following:![](image241.jpg)\n\
    We can use a for loop to pop all the array elements:\n```html\n<script>\nvar array1=[\
    \ \"Java\" , \"C#\" , \"Python\" ];\nvar len= array1. length;\nfor ( var i= 1\
    \ ; i<= len; i++)\n{\n  document . writeln( \"Popped out element: \" + array1.pop()+\
    \ \"<br>\" );\n}\n</script>\n```\nThe code will print the following:![](image263.jpg)\n\
    \n### reverse()\nThis method has the impact of changing the way the array items\
    \ are ordered, and it returns the items in a reverse sequence. The first element\
    \ of the array will become the last while the last item will become the first\
    \ element. It takes a simple syntax shown below: `array. reverse()`. It returns\
    \ the original items of the array arranged in reverse order.\n\nFor example:\n\
    ```html\n<script>\nvar array1=[ \"Java\" , \"C#\" , \"Python\" ];\nvar rv= array1.\
    \ reverse();\ndocument . writeln( rv);\n</script>\n```\nThe code will return the\
    \ following output:![](image283.jpg)\nThe elements of the array have been returned\
    \ while arranged in reverse order.\n\n# String\n\nIn JavaScript, a string is a\
    \ sequence of characters. In JavaScript, we can create strings in two ways, using\
    \ a string literal and using a string object. A string literal is created by use\
    \ of double quotes. To create a string using a string literal, use the syntax\
    \ given below: `var string_name= \"string\"`.\n\nExample:\n```html\n<script>\n\
    var st = \"A string\" ;\ndocument . write( st);\n</script>\n```\nThe code prints\
    \ the following:![](303.jpg)\nTo create a string using a string object, use the\
    \ `new` keyword. The syntax should be as shown below: `var string_name= new (\
    \ \"a literal\" );`. We have used the `new` keyword to create an instance of a\
    \ string.\n\nConsider the example below:\n```html\n<script>\nvar st = new String\
    \ \"Hello, this is a string\" );\ndocument . write( st);\n</script>\n```\nThe\
    \ code will return the following:![](325.jpg)\n\n### charAt()\nThis method helps\
    \ in finding the character located at a certain index. The indexes begin from\
    \ `0` and go up to `n-1` where `n` is the total number of characters in the string.\
    \ The value of the index cannot be a negative value, equal to or greater than\
    \ the length of the string. The method takes the following syntax: `String . charAt(\
    \ index)`. index represents the position of the character. The method returns\
    \ a character.\n\nExample:\n```html\n<script>\nvar st= \"JavaScript\" ;\ndocument\
    \ . writeln( st. charAt( 5 ));\n</script>\n```\nThe code returns `c`. This is\
    \ because the character `a` was found at index `5`. We can also use the method\
    \ and not pass an index to it. This is demonstrated below:\n```html\n<script>\n\
    var st= \"JavaScript\" ;\ndocument . writeln( st. charAt());\n</script>\n```\n\
    The code simply prints the first character of the string, which is `J`. The following\
    \ code demonstrates how we can print the last character of the string:\n```html\n\
    <script>\nvar st= \"JavaScript\" ;\ndocument . writeln( st. charAt( st. length-1\
    \ ));\n</script>\n```\nThe code will return `t` as it’s the last character of\
    \ the string.\n\n### concat()\nThis method helps in joining two or more strings\
    \ together to form a single string. Note that the method doesn’ change the original\
    \ string in any way. The method takes the syntax given below: `string. concat(\
    \ string1, string2,..., string- n)`. parameters to the method are the strings\
    \ to be joined. Consider the example below:\n```html\n<script>\nvar a= \"Java\"\
    \ ;\nvar b= \"Script\" ;\ndocument . writeln( a. concat( b));\n</script>\n```\n\
    The code will return the following upon execution:![](387.jpg)\nWe created two\
    \ strings `a` and `b` and combined them using the `concat()` method. The following\
    \ example demonstrates how we can combine three strings together:\n```html\n<script>\n\
    var a= \"Java\" ;\nvar b= \"Script\" ;\nvar c= \" Language\" ;\ndocument . writeln(\
    \ a. concat( b, c));\n</script>\n```\nNote that we created some space when writing\
    \ the string `Language`. There is another way of doing it as below:\n```html\n\
    <script>\nvar a= \"Java\" ;\nvar b= \"Script\" ;\nvar c= \" Language\" ;\ndocument\
    \ . writeln( a. concat( b+ \" \" + c));\n</script>\n```\n\n### indexOf()\nThis\
    \ method can be used to search and return the position of a certain character\
    \ in a string. Always remember that string characters begin at index `0`. If the\
    \ character is not found, the method will return `-1`.\n\nExample:\n```html\n\
    <script>\nvar st= \"JavaScript is a scripting language\" ;\ndocument . write(\
    \ st. indexOf( 'a' ));\n</script>\n```\nThe code returns `1`. This is because\
    \ the first character “a” was found at index `1`. It is possible to provide the\
    \ index at which our search should start. This is demonstrated below:\n```html\n\
    <script>\nvar st= \"JavaScript is a scripting language\" ;\ndocument . write(\
    \ st. indexOf( 'a' , 8 ));\n</script>\n```\nThe code returns `14`. This is because\
    \ we have stated that the search should begin at index `8` rather than from index\
    \ `0`. Other than a single character, we can print the position of the first character\
    \ of a certain string:\n```html\n<script>\nvar st= \"JavaScript is a scripting\
    \ language\" ;\ndocument . write( st. indexOf( \"script\" ));\n</script>\n```\n\
    The code returns `16`. This is the position of character `s` in the `script`.\
    \ Note that the search is case sensitive; hence the `Script` in `JavaScript` will\
    \ be skipped. You can use `Script` rather than the `script` in the search and\
    \ you will get a different result. To avoid this confusion, we can provide the\
    \ JavaScript with the index from which the search should start:\n```html\n<script>\n\
    var st= \"JavaScript is a scripting language\" ;\ndocument . write( st. indexOf(\
    \ \"script\" , 6 ));\n</script>\n```\nThe search will now begin from index `6`\
    \ rather than from index `0`. We can try to search for an element that doesn’t\
    \ exist and see what happens:\n```html\n<script>\nvar st= \"JavaScript is a scripting\
    \ language\" ;\ndocument . write( st. indexOf( \"Language\" , 6 ));\n</script>\n\
    ```\nThe code will return `-1` because we don’t have `Language` string.\n\n###\
    \ search()\nThis method is used for the purpose of searching for regular expressions\
    \ in a string. If no match is found, the method will return `-1`. The method normally\
    \ goes with the syntax: `string. search( regexp)`. `regexp` denotes the expression\
    \ to be searched. The method normally returns the position of the character you\
    \ were searching for. Consider the example below:\n```html\n<script>\nvar st=\
    \ \"JavaScript is a language\" ;\ndocument . write( st. search( \"language\" ));\n\
    </script>\n```\nThe code returns `26`. The string `language` begins at index `26`.\
    \ Note that the search is case sensitive. The following example demonstrates this:\n\
    ```html\n<script>\nvar st= \"JavaScript is one of the scripting languages.\" ;\n\
    document . write( st. search( /Scripting/ ));\n</script>\n```\nThe code returns\
    \ `46`. This is because it is searching for uppercase `s`. To ignore the case\
    \ sensitive nature of the search, we can use the `i` flag as shown below:\n```html\n\
    <script>\nvar st= \"JavaScript is one of the scripting languages.\" ;\ndocument\
    \ . write( st. search( /Scripting/i ));\n</script>\n```\nThe code will now return\
    \ `25` rather than `46`. This is because the search is no longer case sensitive.\
    \ Let us now search for a regular expression that is not present in the string:\n\
    ```html\n<script>\nvar st= \"JavaScript is one of the scripting languages.\" ;\n\
    document . write( st. search( /programming/ ));\n</script>\n```\nThe code returns\
    \ `-1` because the regular expression was not found.\n\n### match()\nThis method\
    \ helps us match a string against a regular expression. A global search modifier\
    \ can be used with the `match()` method to get all matching elements, otherwise,\
    \ the method will only return the first element that is found. The `match()` method\
    \ takes the following syntax: `string. match( regexp)`. `regexp` is the regular\
    \ expression you need to search. Consider the following example:\n```html\n<script>\n\
    var st= \"JavaScript\" ;\ndocument . writeln( st. match( \"Java\" ));\n</script>\n\
    ```\nThe code will return `Java` as the output:![](242.jpg)\nWe can demonstrate\
    \ how to use the global search:\n```html\n<script>\nvar st= \"JavaScript\" ;\n\
    document . writeln( st. match( /Java/g ));\n</script>\n```\nThe code will return\
    \ the following upon execution:![](242.jpg)\nThe `match()` method is case sensitive.\
    \ However, we can turn this off by using the ignore flag. This is demonstrated\
    \ below:\n```html\n<script>\nvar st= \"JavaScript\" ;\ndocument . writeln( st.\
    \ match( /java/gi ));\n</script>\n```\nThe code will return the following upon\
    \ execution:![](242.jpg)\nThis shows that the search is no longer case sensitive\
    \ as it was before.\n\n# Chapter 9 - JavaScript Events\n\nEvents are the actions\
    \ which JavaScript can detect. A good example is an `onmouseover` event, which\
    \ JavaScript detects once a mouse is moved over some object. The `onload` event\
    \ is triggered once a web page is loaded. In JavaScript, events and functions\
    \ are used together. A function is triggered once an event has occurred. Other\
    \ examples of events include closing a window, pressing a key, resizing a window\
    \ and others.\n\n### onclick Event\nThis is a common event in JavaScript. It occurs\
    \ once a user has clicked the left button of the mouse. One can add a warning,\
    \ validation etc. against the event. Example:\n```html\n<html>\n<head>\n  <script\
    \ type=\"text/javascript\">\n    function helloFunc() {\n      alert ( \"Hello\
    \ World!\" )\n    }\n  </script>\n</head>\n<body>\n  <p> Click the button below</p>\n\
    \  <form><input type=\"button\" onclick = \"helloFunc()\"value=\"Click Here\"\
    \ />\n  </form>\n</body>\n</html>\n```\nIn the example, a simple form has been\
    \ created. It should be as follows:![](213.jpg)\nClick the “Click Here” button\
    \ and the function `helloFunc` will be invoked. Once clicked, you will see a pop\
    \ up as shown below:![](218.jpg)\n\n### onsubmit Event\nThis even is called when\
    \ one has submitted a form. Form validation can be added to the event. This will\
    \ help you validate data before it can be sent to a webserver. Example:\n```html\n\
    <html>\n<head>\n  <script type=\"text/javascript\">\n    function formValidation()\
    \ {\n      // validation code should be added here\n      return true or false\n\
    \    }\n  </script>\n</head>\n<body>\n  <form method=\"POST\" onsubmit = \"return\
    \ formValidation()\"\n    <input type=\"submit\" value=\"Submit\" />\n  </form>\n\
    </body>\n</html>\n```\nOnce the Submit button is clicked, the `formValidation`\
    \ method will be called.\n\n###mouseout and onmouseover\nThese events help you\
    \ add attractive features to both text and images. The `onmouseover` event is\
    \ triggered once a mouse is moved over an object. The `onmouseout` event is triggered\
    \ once the mouse is moved out of the element. Example:\n```html\n<html>\n<head>\n\
    \  <script type=\"text/javascript\">\n    function overObject() {\n      document\
    \ . write( \"Mouse is Over\" );\n    }\n    function outOfObject() {\n      document\
    \ . write( \"Mouse is Out\" );\n    }\n  </script>\n</head>\n<body>\n  <p> Bring\
    \ your mouse in the division and observe:</p>\n  <div onmouseover=\"overObject()\"\
    \ onmouseout=\"outOfObject()\">\n    <h2>Division</h2>\n  </div>\n</body>\n</html>\n\
    ```\nThe code gives the following when executed:![](296.jpg)\nJust move your mouse\
    \ as instructed and see what happens. It will change to the following:![](201.jpg)\n\
    We have defined two functions, that is, `overObject` and `outOfObject`. These\
    \ two functions have then been called in the following line: `<div onmouseover=\"\
    overObject()\" onmouseout=\"outOfObject()\">`.\nOnce a mouse is moved over the\
    \ division, the `overObject` method will be called. Once the mouse is moved out\
    \ of the object, the `outOfObject` method will be called. Here is another example\
    \ that changes the color of the text after mouse hover:\n```html\n<html>\n<body>\n\
    \  <h1 onmouseover=\"style.color='yellow'\"onmouseout=\"style.color='black'\"\
    >Move your cursor over here</h1>\n</body>\n</html>\n```\nWhen you move the mouse\
    \ cursor of the text, the text will change its color to yellow. If you move away\
    \ from the mouse cursor, the text will change color to black.\n\n### onload and\
    \ onunload\nThese two events are invoked when a user has entered or left a page.\
    \ We can use the `onload` event to check the type and version of the visitor’s\
    \ browser. It is from there that we can load the right web page depending on the\
    \ version. Both are good functions for dealing with cookies:\n```html\n<html>\n\
    <body onload=\"inspectCookies()\"><p id=\"example\"></p>\n<script>\nfunction inspectCookies()\
    \ {\n  var txt = \"\" ;\n  if ( navigator . cookieEnabled == true ) {\n    txt\
    \ = \"Your browser has cookies enabled.\" ;\n  } else {\n    txt = \"your browser\
    \ has cookies disabled.\" ;\n  }\n  document . getElementById( \"example\" ).\
    \ innerHTML = txt;\n}\n</script>\n</body>\n</html>\n```\nIf you run the above\
    \ code, the output that you get will depend on whether your browser has cookies\
    \ enabled or not.\n\n### onchange Event\nThis method is mostly used during the\
    \ validation of form fields. The following example demonstrates how to use this\
    \ method:\n```html\n<html>\n<head>\n<script>\nfunction testFunc() {\n  var a =\
    \ document . getElementById( \"name\" );\n  a. value = a. value. toUpperCase();\n\
    }\n</script>\n</head>\n<body>\nName: < input type=\"text\" id=\"name\" onchange=\"\
    testFunc()\"\n<p> Leave the input field and see your name to uppercase</p>\n</body>\n\
    </html>\n```\nAfter running the code, you will get the following simple form:![](791.jpg)\n\
    Just type your name in lowercase and move the mouse cursor from the input field\
    \ by clicking outside. You will notice your name will be transformed into uppercase:![](796.jpg)\n\
    The `toUpperCase()` method is invoked after the user has changed the content of\
    \ the input field.\n\n### onload\nWhen used, it displays an alert box after a\
    \ page is loaded. Example:\n```html\n<html>\n<head>\n<script>\nfunction displayMessage()\
    \ {\n  alert ( \"A message by onload\" );\n}\n</script>\n</head>\n<body onload=\"\
    displayMessage()\"></body>\n</html>\n```\nOnce the page is loaded, you will get\
    \ the following alert box:![](826.jpg)\n\n### onfocus\nThis method makes an input\
    \ field change its color after it gets focus. Example:\n```html\n<html>\n<head>\n\
    <script>\nfunction myFunc( col) {\n  col. style = \"green\" ;\n}\n</script>\n\
    </head>\n<body>\nName: < input type=\"text\" onfocus=\"myFunc(this)\"\n<p> Click\
    \ inside the input field and see it color.</p>\n</body>\n</html>\n```\nThe code\
    \ will give you the following:![](860.jpg)\nYou can then click inside the input\
    \ field as instructed and see what happens. It will change color as follows:![](865.jpg)\n\
    The color of the input field will change into the green.\n\n# Chapter 10 - JavaScript\
    \ Validation\n\nWith JavaScript, one can validate a form before they can submit.\
    \ Initially, form validation was done on the side of the server. The user could\
    \ fill a form then send it to a server. If the details were found to be wrong,\
    \ the server had to send them back to the user for corrections. This process is\
    \ too lengthy. However, JavaScript has changed and improved how this done. Validation\
    \ of forms can be done on the client side before the form can be submitted to\
    \ the server. In form validation, we should ensure the required fields are filled.\
    \ Fields taking specific data such as emails, mobile phone numbers and other should\
    \ be checked to ensure the format is adhered to. The validation of the form is\
    \ normally done on submit:\n```html\n<html>\n<head>\n<script type=\"text/javascript\"\
    >\nfunction formValidation(){\n  var name= document . detailsForm.username. value;\n\
    \  var password = document . detailsForm.userpassword. value;\n  if ( name== null\
    \ || name== \"\"){\n    alert ( \"You MUST enter your name!\" );\n    return false\
    \ ;\n  } else if ( password .length< 8 ){\n    alert ( \"You MUSt enter a password\
