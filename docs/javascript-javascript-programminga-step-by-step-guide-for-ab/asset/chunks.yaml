  trans: "\n考虑以下示例：\n```html\n<html>\n<body>\n  <script type=\"text/javascript\">\n\
    \      function readValue(){\n        var name= document.memberform.memberName.value;\n\
    \        alert (\"Hi: \" + name);\n      }\n  </script>\n  <form name=\"memberform\"\
    >\n    Enter Name: <input type=\"text\" name=\"memberName\" />\n    <input type=\"\
    button\" onclick=\"readValue()\" value=\"Click Here\" />\n  </form>\n</body>\n\
    </html>\n```\n\n当运行运行代码时，它将为你提供如下所示的简单表单：![](img/image3238.jpg)\n\n只需在输入框中输入你的名字并点击\
    \ `Click Here` 按钮。看看会发生什么。\n\n你将得到一个提示框，其中有你的名字并追加了一些文本：![](img/image3249.jpg)\n\
    \n我们只是创建了一个带有输入字段的简单表单。`readValue()` 方法帮助我们获取输入到字段中的值。考虑以下行：`var name= document.memberform.memberName.value;`\n\
    \n`memberName` 是赋予表单中文本字段的名称，这些名称必须匹配，否则你将无法获得正确的结果。\n\n### `getElementById()`\n\
    \n除了名称之外，我们还可以通过其 id 获取元素。这可以使用 `document.getElementById()` 方法来实现。然而，文本字段应该赋予一个\
    \ `id`。\n\n例如：\n```html\n<html>\n<body>\n  <script type=\"text/javascript\">\n\
    \      function computeSquare(){\n        var x= document.getElementById(\"integer\"\
    ).value;\n        alert ( x * x);\n      }\n  </script>\n  <form>\n    Enter an\
    \ Integer: <input type=\"text\" id=\"integer\" name=\"myNumber /><br/>\n    <input\
    \ type=\"button\" value=\"Compute Square\" onclick=\"computeSquare()\" />\n  </form>\n\
    </body>\n</html>\n```\n\n代码在执行后将为你提供如下所示的简单表单：![](img/image3289.jpg)\n\n在输入框中输入数字并点击\
    \ `Compute Square` 按钮。\n\n这应该会在弹出框中返回数字的平方，如下：![](img/image3300.jpg)\n\n在示例中，我们定义了\
    \ `computeSquare()` 方法，它帮助我们获取输入到文本字段中的数字的平方。考虑以下行：`var x= document.getElementById(\"\
    integer\").value;`\n\n在该行中，我们使用了 `getElementById()` 方法，它将输入字段的 `id` 作为参数。该方法帮助我们通过其\
    \ id 获取在文本字段中输入的值。\n\n### `getElementsByName()`\n\n`document.getElementsByName()`\
    \ 方法可以帮助我们通过名称获取元素。该方法的语法如下：`document.getElementsByName(\"name\")`\n\n示例：\n```html\n\
    <html>\n<body>\n  <script type=\"text/javascript\">\n      function getNumber()\
    \ {\n        var options= document.getElementsByName(\"option\");\n        alert\
    \ (\"Total Options:\"+ options.length);\n      }\n  </script>\n  <form>\n    Yes:\
    \ <input type=\"radio\" name=\"option\" value=\"yes\">\n    No: <input type=\"\
    radio\" name=\"option\" value=\"no\">\n    <input type=\"button\" onclick=\"getNumber()\"\
    \ value=\"Available Options\" >\n  </form>\n</body>\n</html>\n```\n\n执行后，代码返回如下：![](img/image3352.jpg)\n\
    \n点击 `Available Options` 按钮看看会发生什么。将显示如下所示的弹出窗口：![](img/image3357.jpg)\n\n我们创建了带有\
    \ `Yes` 和 `No` 两个单选按钮。注意，这两个输入类型被赋予了相同的名称，即 `option`。\n\n考虑以下行：`var options= document.getElementsByName(\"\
    option\");`\n\n该行帮助我们统计名称为 `option` 的元素数量。如输出所示，这应该是 2。\n\n### `getElementsByTagName()`\n\
    \n`document.getElementsByTagName()` 属性返回指定标签名称的元素。它采用如下语法：`document.getElementsByTagName(\"\
    name\")`\n\n例如：\n```html\n<html>\n<body>\n  <script type=\"text/javascript\">\n\
    \  function allparagraphs(){\n    var pgs= document.getElementsByTagName(\"p\"\
    );\n    alert (\"Total paragraphs are: \" + pgs.length);\n  }\n  </script>\n \
    \ <p> This is a paragraph</p>\n  <p> This is a paragraph</p>\n  <p> This is a\
    \ paragraph</p>\n  <p> This is a paragraph</p>\n  <button onclick=\"allparagraphs()\"\
    \ > Total Paragraphs</button>\n</body>\n</html>\n```\n\n代码在执行后返回如下：![](img/image3409.jpg)\n\
    \n点击 `Total Paragraphs` 按钮看看会发生什么。\n\n你将看到以下弹出框：![](img/image3416.jpg)\n\n这意味着代码能够统计我们拥有的段落数量。主要逻辑位于以下行：`var\
    \ pgs= document.getElementsByTagName(\"p\");`\n\n我们将标签 `p` 作为参数传递给我们的方法，输出应该是\
    \ 4。\n"
- fmt: "\n1. `setTimeout(method, time)` - this method will call the method after sometime\
    \ in milliseconds.\n2. `setInterval(method, time)` - the method will call the\
    \ method after time milliseconds.\n\nWith JavaScript, one can set some attributes\
    \ of the DOM object such its its position on the screen. The position of the object\
    \ can be set using `top` and `left` attributes. This is demonstrated below:\n\n\
    ```javascript\n// Set the distance from the left edge of the screen.\nobject.style.left\
    \ = distance; // measures in points or pixels;\n// Set the distance from the top\
    \ edge of screen.\nobject.style.top = distance; // measures in points or pixels;\n\
    ```\n\n### Manual Animation\nIn the following example, we will be animating the\
    \ image towards the right:\n\n```html\n<html>\n<head>\n    <script type=\"text/javascript\"\
    >\n        var image = null;\n        function init() {\n            image = document.getElementById('myImage');\n\
    \            image.style.position = 'relative';\n            image.style.left\
    \ = '0px';\n        }\n        function moveImage() {\n            image.style.left\
    \ = parseInt(image.style.left) + 10 + 'px';\n        }\n        window.onload\
    \ = init;\n    </script>\n</head>\n<body>\n    <form>\n        <img id=\"myImage\"\
    \ src=\"house.jpg\" />\n        <p>Click the button to move the image</p>\n  \
    \      <input type=\"button\" value=\"Move Image\" onclick=\"moveImage();\"/>\n\
    \    </form>\n</body>\n</html>\n```\n\nYou should use the correct name of your\
    \ image in the following line: `<img id=\"myImage\" src=\"house.jpg\" />`. In\
    \ my case, I have a `.jpg` image named `house`. When I run the code, it returns\
    \ the following:\n\n![](image3669.jpg)\n\nClick the “Move Image” button. The image\
    \ should move to the right with each click. This is shown below:\n\n![](image3674.jpg)\n\
    \nConsider the following line in the script: `image = document.getElementById('myImage');`.\
    \ We are getting the image using its ID, then it is assigned to the `image` variable.\
    \ The `init()` method helps us set the initial position of the image on the window.\
    \ The method will be called when the window is being loaded. The `moveImage()`\
    \ function will move the image towards the right by 10 pixels after every click.\
    \ To move the image towards the left, the value should be set as negative. The\
    \ animation, in this case, is manual as we have to click a button.\n\n### Automated\
    \ Animation\nTo automate the process of animating an element, we can use the `setTimeout()`\
    \ function provided by JavaScript. Example:\n\n```html\n<script type=\"text/javascript\"\
    >\n    var image = null;\n    var animate;\n    function init() {\n        image\
    \ = document.getElementById('myImage');\n        image.style.position = 'relative';\n\
    \        image.style.left = '0px';\n    }\n    function animateImage() {\n   \
    \     image.style.left = parseInt(image.style.left) + 10 + 'px';\n        animate\
    \ = setTimeout(animateImage, 20);\n    }\n    function stopAnimation() {\n   \
    \     clearTimeout(animate);\n        image.style.left = '0px';\n    }\n    window.onload\
    \ = init;\n</script>\n</head>\n<body>\n    <form>\n        <img id=\"myImage\"\
    \ src=\"house.jpg\" />\n        <p>Click the Animate button to launch animation</p>\n\
    \        <input type=\"button\" value=\"Animate\" onclick=\"animateImage();\"\
    />\n        <input type=\"button\" value=\"Stop\" onclick=\"stopAnimation();\"\
    />\n    </form>\n```\n\nThe code returns the following upon execution: ![](image3738.jpg)\n\
    \nClick the “Animate” button. The animation should start. When you click the Stop\
    \ button, the animation will stop. The `animateImage()` method is calling the\
    \ `setTimeout` method which sets the position of the image after 20 milliseconds.\
    \ This will result in the animation of the image. The `stopAnimation()` method\
    \ helps in clearing the timer which is set by the `setTimeout()` method. The object,\
    \ which is the image, is set back to its initial position.\n\n### Rollover\nWe\
    \ can use a mouse image to rollover an image in JavaScript. Once you move the\
    \ mouse over the image, it will change to another image. Example:\n\n```html\n\
    <html>\n<head>\n    <script type=\"text/javascript\">\n        if (document.images)\
    \ {\n            var img1 = new Image();\n            img1.src = \"ps.jpg\";\n\
    \            var img2 = new Image();\n            img2.src = \"house.jpg\";\n\
    \        }\n    </script>\n</head>\n<body>\n    <p>Move mouse over to rollover</p>\n\
    \    <a href=\"#\" onMouseOver=\"document.img.src=img2.src;\" onMouseOut=\"document.img.src=img1.src;\"\
    >\n        <img name=\"img\" src=\"nicsam.jpg\" />\n    </a>\n</body>\n</html>\n\
    ```\n\nWe have used the `if` statement to check whether the image exists or not.\
    \ We have used the `Image()` constructor so to preload some new object named `img1`.\
    \ The same has also been done to preload the second image, `img2`. The `src` is\
    \ given the name of the image stored externally. The `#` helps to disable the\
    \ link so that a URL is not opened once it is clicked. The method `onMouseOver`\
    \ is called once the mouse cursor is moved over the image. The `onMouseOut` method\
    \ will be called once the mouse cursor is moved out of the image.\n\n### Chapter\
    \ 12- Browser Object Model\nThe BOM (Browser Object Model) is used for interaction\
    \ with the browser. The default browser object is `window`, meaning that you can\
    \ call all window functions directly or by specifying the `window`. We had discussed\
    \ this, so we will not revisit it. Other than the `window` object, there are various\
    \ other BOM objects. Let us discuss them:\n\n#### History Object\nThis object\
    \ keeps an array of all URLs that the user has visited. You can use this object\
    \ to load web pages, previous, forward and any certain web page. This object can\
    \ be accessed as shown below: `window.history`. It can also be accessed as follows:\
    \ `history`. This object has only one property, which is the `length` and it returns\
    \ the length of history URLs. The history object has 3 methods which include the\
    \ following:\n\n* `forward()` - it will load the next page\n* `back()` - it will\
    \ load the previous page\n* `go()` - it will load a given page number.\n\nThe\
    \ history object can be used in the following various ways:\n\n1. `history.back();`\
    \ // for previous page\n2. `history.forward();` // for next page\n3. `history.go(2);`\
    \ // for next 2nd page\n4. `history.go(-2);` // for previous 2nd page\n\n####\
    \ Navigator Object\nThis object is used for detecting browsers. It can help get\
    \ information about the browser in terms of `appName`, `userAgent`, `appCodeName`\
    \ etc. The navigator object is a property of the `window`, and we can access it\
    \ as follows: `window.navigator`. It can also be accessed as follows: `navigator`.\
    \ The object comes with various properties including the following:\n\n* `appName`\
    \ - it returns the name\n* `appCodeName` - it returns code name\n* `appVersion`\
    \ - it returns the version\n* `cookieEnabled` - it returns true if browser cookies\
    \ are enabled and false otherwise\n* `language` - it returns the language. Supported\
    \ in Firefox and Netscape only.\n* `userAgent` - it returns user agent\n* `userLanguage`\
    \ - it returns the users’ language. It’s supported only in IE.\n* `systemLanguage`\
    \ - it returns system language. Supported only in IE.\n* `Plugins` - it returns\
    \ the plugins. Supported in Firefox and Netscape only. own* `mimeTypes[]` - it\
    \ returns an array of mime type. Supported in Firefox and Netscape only. own*\
    \ `online` - it returns true if the browser is online and false otherwise.\n*\
    \ `platform` - it returns the platform such as Win32.\n\nThe navigator object\
    \ has the following methods:\n\n* `javaEnabled()` - it checks whether java has\
    \ been enabled. own* `taintEnabled()` - it checks whether taint has been enabled.\
    \ Deprecated from JavaScript 1.2.\n"
