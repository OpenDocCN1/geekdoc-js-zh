    " + navigator.userAgent);document.writeln("<br/>navigator.onLine: " + navigator.onLine);document.writeln("<br/>navigator.platform:
    " + navigator.platform);

    ```


    The code returns the following details:

    ![](image3860.jpg)


    Note that the output will depend on the kind of operating system, the browser
    you are using and other details.


    ### Screen Object


    This JavaScript object keeps information about the screen of the browser. You
    can use it to display details of the screen such as the `height`, `width`, `pixelDepth`,
    `colorDepth` etc. It is a property of the `window` object, hence we access as
    follows: `window.screen`


    We can also access it as follows: `screen`


    The object has many properties including the following:


    - `width` - it returns the width of the browser screen

    - `height` - it returns the height of browser screen

    - `availWidth` - it prints the available width

    - `availHeight` - it prints available height

    - `colorDepth` - it returns color depth

    - `pixelDepth` - it returns pixel depth.

