  trans: "\n\n# 使用对象字面量\n\n要使用对象字面量创建对象，我们使用下面的语法：\n\n```javascript\nobject={ property1:\
    \ value1, property2: value2..... propertyN: valueN}\n```\n\n我们使用冒号（`:`）来分隔属性和值。下面的示例演示了如何使用这种方法创建对象：\n\
    \n```javascript\nstudent={ admission: 3380 , name: \"John Joel\" , age: 28 }\n\
    document . write( student.admission+ \" \" + student. name+ \" \" + student. age);\n\
    ```\n\n代码返回以下结果：![](img/image4499.jpg) 输出清晰地显示 JavaScript 解释器能够理解该语法的含义，即属性在先，值在其后。这就是为什么它能够获取我们需要访问的属性值。\n\
    \n# 通过创建对象实例\n\n这通过以下语法完成：\n```javascript\nvar object_name= new Object ();\n```\n\
    \n注意，我们使用了 `new` 关键字来创建对象。下面的示例演示了我们如何直接创建一个对象：\n\n```javascript\nvar stud= new\
    \ Object ();\nstud. admission= 3380 ;\nstud. name= \"John Joel\" ;\nstud. age=\
    \ 28 ;\ndocument . write( stud.admission+ \" \" + stud. name+ \" \" + stud. age);\n\
    ```\n\n代码将打印以下结果：![](img/image4530.jpg)\n\n# 使用对象构造函数\n\n这涉及创建一个带有参数的函数。每个参数值都可以通过\
    \ `this` 关键字赋值给当前对象，`this` 表示当前对象。考虑以下示例：\n\n```javascript\nfunction stud( admission,\
    \ name, age){\n  this . admission= admission;\n  this . name= name;\n  this .\
    \ age= age;\n  }\ns= new stud( 3380 , \"John Joel\" , 28 );\ndocument . write(\
    \ s.admission+ \" \" + s. name+ \" \" + s. age);\n```\n\n代码执行后返回以下内容：![](img/image4556.jpg)\
    \ JavaScript 允许我们在对象中定义方法。但在定义方法之前，我们应该先定义一个与方法同名的属性。下面的示例展示了我们如何在对象中定义一个方法：\n\
    \n```javascript\nfunction stud( admission, name, age){\n  this . admission= admission;\n\
    \  this . name= name;\n  this . age= age;\n  this . updateAge= updateAge;\n  function\
    \ updateAge( newAge){\n    this . age= newAge;\n  }\n  }\ns= new stud( 3380 ,\
    \ \"John Joel\" , 28 );\ndocument . write( s.admission+ \" \" + s. name+ \" \"\
    \ + s. age +\"<br>\" );s. updateAge( 29 );\ndocument . write( s.admission+ \"\
    \ \" + s. name+ \" \" + s. age);\n```\n\n代码执行后将返回以下结果：![](img/image4592.jpg) 我们定义了\
    \ `updateAge()` 方法，帮助我们更改学生的年龄。在示例中，学生的年龄已从 28 更新为 29。\n\n# 原型\n\nJavaScript 语言基于原型工作，允许对象从相互之间获取特征和属性。在这里，每个对象都有一个原型对象。在\
    \ JavaScript 中创建一个函数后，`prototype` 属性会自动添加到该函数中。该属性是一个持有 `constructor` 属性的原型对象。以下是\
    \ JavaScript 中创建原型对象的语法：\n\n```javascript\nClassName. prototype . methodName\n\
    ```\n\n在创建对象后，与之对应的函数会被加载到内存中。这意味着每个对象都有函数的新副本。因此，所有函数都会一次性加载到内存中。\n\n# 原型链\n\n\
    每个 JavaScript 对象都有一个原型对象，并从那里获取方法和属性。一个对象的原型可能拥有一个原型对象，该原型对象可以获取方法和属性，依此类推。我们可以此视为原型链。下面的示例演示了我们如何向构造函数添加一个新方法：\n\
    \n```javascript\nfunction Student( firstName, lastName){\n  this . firstName=\
    \ firstName;\n  this . lastName= lastName;}\nStudent. prototype . fullName= function\
    \ ()\n  {\n    return this . firstName+ \" \" + this . lastName;\n  }\nvar student1=\
    \ new Student( \"John\" , \"Joel\" );\nvar student2= new Student( \"Mercy\" ,\
    \ \"George\" );\ndocument . writeln( student1.fullName()+ \"<br>\" );\ndocument\
    \ . writeln( student2.fullName());\n```\n\n代码返回以下结果：![](img/image4638.jpg) `fullName()`\
    \ 函数结合了 `firstName` 和 `lastName` 以返回学生的全名。让我们再创建另一个示例，演示如何向构造函数添加一个新属性：\n\n```javascript\n\
    function Student( firstName, lastName){\n  this . firstName= firstName;\n  this\
    \ . lastName= lastName;}\nStudent. prototype . school= \"ABC\"\nvar student1=\
    \ new Student( \"John\" , \"Joel\" );\nvar student2= new Student( \"Mercy\" ,\
    \ \"George\" );\ndocument . writeln( student1.firstName+ \" \" + student1.lastName+\
    \ \" \" + student1.school+ \"<br>\" );\ndocument . writeln( student2.firstName+\
    \ \" \" + student2.lastName+ \" \" + student2.school+ \"<br>\" );\n```\n\n代码应返回以下结果![](img/image4668.jpg)\
    \ 我们为 `school` 创建了原型，所有学生都继承它。\n\n# 构造方法\n\n构造方法是 JavaScript 中用于初始化和创建对象的特殊方法。它在对象分配内存后调用。构造方法由\
    \ `{}` 表示。构造方法使用 `constructor` 关键字声明。下面的示例展示了如何声明构造方法：\n\n```javascript\nclass\
    \ Student {\n  constructor () {\n    this . admission= 3380 ;\n    this . name\
    \ = \"John\" ;\n  }\n}\nvar stud = new Student();\ndocument . writeln( stud.admission+\
    \ \" \" + stud.name);\n```\n\n代码将遵循![](img/image699.jpg) 注意构造方法内部创建了各种属性。\n\n\
    # 静态方法\n\nJavaScript 提供了属于类而非实例的静态方法。这意味着不需要实例来调用静态方法。我们直接在类上调用这些方法。静态方法使用 `static`\
    \ 关键字声明。类允许有多个静态方法。任何数据类型的成员都可以与方法传递。考虑下面的静态方法示例：\n\n```javascript\nclass StaticTest{\n\
    \  static show() {\n    return \"Static method has been invoked\"\n  }\n}\ndocument\
    \ . writeln( StaticTest.show());\n```\n\n代码执行后将打印以下内容![](img/image730.jpg) `show()`\
    \ 方法使用 `static` 关键字声明，使其成为静态方法。让我们看看如何调用多个方法：\n\n```javascript\nclass StaticTest{\n\
    \  static show1() {\n    return \"Static method has been invoked\"\n  }\n  static\
    \ show2() {\n    return \"Static method invoked\"\n  }\n}\ndocument . writeln(\
    \ StaticTest.show1()+ \"<br>\" );\ndocument . writeln( StaticTest.show2());\n\
    ```\n\n代码执行后将返回以下![](img/image765.jpg) 我们创建了两个静态方法，`show1()` 和 `show2()`。我们随后调用它们来获取结果。\n\
    \n```javascript\nclass StaticTest{\n  static show() {\n    return \"Static method\
    \ has been invoked\"\n  }\n  static show() {\n    return \"Static method invoked\
    \ again\"\n  }\n}\ndocument . writeln( StaticTest.show());\n```\n\n静态方法也可以从构造函数内部被调用。下面的示例展示了静态方法可以在构造函数内部调用：\n\
    \n```javascript\nclass StaticTest {\n  constructor () {\n    document . writeln(\
    \ StaticTest.show()+ \"<br>\" );\n    document . writeln( this.constructor.show());\n\
    \  }\n  static show() {\n    return \"Static method has been invoked\"\n  }\n\
    }\nvar st= new StaticTest();\n```\n\n代码返回以下结果![](img/image4823.jpg) 静态方法也可以从非静态方法内部被调用。例如：\n\
    \n```javascript\nclass StaticTest {\n  static show() {\n    return \"static method\
    \ has been invoked\"\n  }\n  show() {\n    document . writeln( StaticTest.show()+\
    \ \"<br>\" );\n  }\n}\nvar st= new StaticTest();\nst. show();\n```\n\n代码返回以下结果![](img/4854.jpg)\n\
    \n# 封装\n\n封装是将数据与作用于数据的功能结合的过程。它是控制和验证数据的一种良好方法。在 JavaScript 中，你应该使用 `var` 关键字将数据成员设为私有。Setter\
    \ 方法用于设置数据，而 getter 方法用于获取数据。考虑下面的示例：\n\n```javascript\nclass Student {\n  constructor\
    \ () {\n    var name;\n    var score;\n  }\n  getStudentName() {\n    return name;\n\
    \  }\n  setStudentName( name) {\n    this. name= name;\n  }\n  getScore() {\n\
    \    return score;\n  }\n  setScore( score) {\n    this. score= score;\n  }\n\
    }\nvar st= new Student();\nst. setStudentName( \"John\" );\nst. setScore( 78 );\n\
    document . writeln( st.getStudentName()+ \" \" + st.getScore());\n```\n\n代码执行后将返回以下![](img/image4921.jpg)\
    \ 让我们看看如何验证学生的成绩：\n\n```javascript\nclass Student {\n  constructor () {\n    var\
    \ name;\n    var score;\n  }\n  getStudentName() {\n    return name;\n  }\n  setStudentName(\
    \ name) {\n    this. name= name;\n  }\n  getScore() {\n    return score;\n  }\n\
    \  setScore( score) {\n    if ( score< 0 || score> 100 ) {\n      alert ( \"Invalid\
    \ Score\" );\n    }\n    else {\n      this. score= score;\n    }\n  }\n}\nvar\
    \ st= new Student();\nst. setStudentName( \"John\" );\nst. setScore( 105 ); //alert()\
    \ invokes\ndocument . writeln( st.getStudentName()+ \" \" + st.getScore());\n\
    ```\n\n在 `setScore()` 方法中，成绩已被验证。如果它不在 0 到 100 之间，则会弹出“无效成绩”。我们已经将成绩设置为 105。让我们修改成绩并将其设置为\
    \ 78：\n\n```javascript\nclass Student {\n  constructor () {\n    var name;\n \
    \   var score;\n  }\n  getStudentName() {\n    return name;\n  }\n  setStudentName(\
    \ name) {\n    this. name= name;\n  }\n  getScore() {\n    return score;\n  }\n\
    \  setScore( score) {\n    if ( score< 0 || score> 100 ) {\n      alert ( \"Invalid\
    \ Score\" );\n    }\n    else {\n      this. score= score;\n    }\n  }\n}\nvar\
    \ st= new Student();\nst. setStudentName( \"John\" );\nst. setScore( 78 );\ndocument\
    \ . writeln( st.getStudentName()+ \" \" + st.getScore());\n```\n\n代码返回以下结果![](img/image5001.jpg)\
    \ 我们也可以通过基于原型的方法来实现封装：\n\n```javascript\nclass Student {\n  constructor () {\n\
    \    var name;\n    var score;\n  }\n  getStudentName() {\n    return name;\n\
    \  }\n  setStudentName( name) {\n    this. name= name;\n  }\n  getScore() {\n\
    \    return score;\n  }\n  setScore( score) {\n    if ( score< 0 || score> 100\
    \ ) {\n      alert ( \"Invalid Score\" );\n    }\n    else {\n      this. score=\
    \ score;\n    }\n  }\n}\nfunction Student( name, score) {\n  var sname= name;\n\
    \  var s_score= score;\n  Object . defineProperty(this, \"name\", {\n    get:\
    \ function () {\n      return sname;\n    },\n    set: function (sname) {\n  \
    \    sname= sname;\n    }\n  });\n  Object . defineProperty(this, \"score\", {\n\
    \    get: function () {\n      return s_score;\n    },\n    set: function (s_score)\
    \ {\n      s_score= s_score;\n    }\n  });\n}\nvar st= new Student( \"John\",\
    \ 78 );\ndocument . writeln( st.name+ \" \" + st.score);\n```\n\n# 继承\n\n通过这一\
    \ JavaScript 特性，我们可以创建基于现有类的新类。它为子类提供了使用父类方法和属性的方法。在 JavaScript 中，继承是通过使用 `extends`\
    \ 关键字完成的。通过这个关键字，我们创建一个基于父类的子类。之后，子类将能够父类的行为和属性。继承维持了 IS-A 关系。继承也可以通过基于原型的方法实现。考虑下面的示例，`Current`\
    \ 继承自 `Date`：\n\n```javascript\nclass Current extends Date {\n  constructor ()\
    \ {\n    super ();\n  }\n}\nvar c= new Current();\ndocument . writeln( \"Today\
    \ is:\" )\ndocument . writeln( c.getDate()+\" c.getFullYear());\n```\n\n代码将返回以下输出![](img/image175.jpg)\
    \ 代码返回今天的日期。这是另一个示例：\n\n```javascript\nclass Current extends Date {\n  constructor\
    \ ( year) {\n    super ( year);\n  }\n}\nvar c= new Current( \"April 20, 1958\
    \ 17:32\" );\ndocument . writeln( \"The year:\" )\ndocument . writeln( c.getFullYear());\n\
    ```\n\n在上面的示例中，我们创建了一个日期值，并使用了 `getFullYear()` 方法获取年份。代码执行后返回以下![](img/image205.jpg)\
    \ 这表明该方法能够成功提取提供日期的年份部分。这是另一个示例，我们创建一个子类来继承父类：\n\n```javascript\nclass Car{\n\
    \  constructor () {\n    this . manufacturer= \"Toyota\" ;\n  }\n}\nclass Model\
    \ extends Car {\n  constructor ( name, year) {\n    super ();\n    this . name=\
    \ name;\n    this . year= year;\n  }}\nvar m = new Model( \"Harrier\" , \"2012\"\
    \ );\ndocument . writeln( m.manufacturer+ \" \" + m.name+ \" \" + m.year);\n```\n\
    \n代码返回以下结果![](img/image247.jpg) 让我们演示如何进行基于原型的继承，我们不需要使用 `extends` 和 `class` 关键字：\n\
    \n```javascript\n//A Constructor function\nfunction Car( manufacturer) {\n  this\
    \ . manufacturer= manufacturer;\n}\nCar. prototype . getManufacturer= function\
    \ ()\n  {\n    return this . manufacturer;\n  }\n//Another constructor function//Second\
    \ constructor function\nfunction Model( name, year) {\n  this . name= name;\n\
    \  this . year= year;\n}\nvar car = new Car( \"Toyota\" );\nmodel. prototype =\
    \ car; //Now Bike 被视为 Vehicle 的父类.\nvar model= new Model( \"Harrier\" , 2012 );\n\
    document . writeln( model.getManufacturer()+ \" \" + model.name+ \" \" + model.year);\n\
    ```\n\n# 多态\n\n多态是面向对象编程范式的一项关键特性，它允许人们以不同的方式执行单项操作。通过多态，我们可以在各种 JavaScript 对象上调用同一种方法。JavaScript\
    \ 不是一种类型安全的语言；因此，任何数据类型的成员都可以与方法传递。考虑下面的示例：\n\n```javascript\nclass Parent {\n\
    \  show() {\n    document . writeln( \"Parent class\" );\n  }\n}\nclass Child\
    \ extends Parent {\n  show() {\n    document . writeln( \"Child class\" );\n \
    \ }\n}\nvar p = new Parent();\np.show();\nvar c = new Child();\nc.show();\n```\n\
    \n代码将返回以下![](img/image325.jpg) 这里是另一个示例：\n\n```javascript\nclass Parent {\n  show()\
    \ {\n    document . writeln( \"Parent class\" );\n  }\n}\nclass Child extends\
    \ Parent {\n  show() {\n    document . writeln( \"Child class\" );\n  }\n}\nvar\
    \ p=[ new Parent(), new Child()]\np. forEach( function ( message){message. show();});\n\
    ```\n\n`show()` 方法根据用的对象不同表现不同。代码打印以下输出：![](img/image370.jpg) 我们可以通过原型方法实现相同的示例，但这次是如下面所示：\n\
    \n```javascript\nfunction Parent(){}\nParent. prototype . show= function (){\n\
    \  return \"Parent class\" ;\n}\nfunction Child(){}\nChild. prototype = Object\
    \ . create( Parent. prototype );\nvar p=[ new Parent(), new Child()]\np. forEach(\
    \ function ( message){\n  document . writeln( message. show()+ \"<br>\" );\n});\n\
    ```\n\n第 15 章 多媒体\n\nJavaScript 拥有 `plugins` 对象，它是 `navigator` 对象的子类。它是一个数组，包含了每个浏览器插件的单个条目。Firefox\
    \ 和 Netscape 等浏览器支持使用 `navigator.plugins` 对象。考虑下面的脚本：\n\n```html\n<table border=\"\
    1\" >\n  <tr>\n    <th>Name of PLugin</th>\n    <th>Filename</th>\n    <th>Description</th>\n\
    \  </tr>\n  <script language=\"JavaScript\" type=\"text/javascript\">\n    for\
    \ ( x= 0 ; x< navigator .plugins. length; x++) {\n      document . write( \"<tr><td>\"\
    \ );\n      document . write( navigator .plugins[ x].name);\n      document .\
    \ write( \"</td><td>\" );\n      document . write( navigator .plugins[ x].filename);\n\
    \      document . write( \"</td><td>\" );\n      document . write( navigator .plugins[\
    \ x].description);\n      document . write( \"</td></tr>\" );\n    }\n  </script>\n\
    </table>\n```\n\n一旦执行，该脚本将向你显示浏览器上安装的所有插件列表。每个插件由数组中的一个条目表示。每个条目具有以下属性：\n\n"
