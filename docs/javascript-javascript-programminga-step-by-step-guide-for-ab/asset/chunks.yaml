    Consider the navigator object example given below:


    ```javascript

    document.writeln("<br/>navigator.appName: " + navigator.appName);document.writeln("<br/>navigator.appCodeName:
    " + navigator.appCodeName);document.writeln("<br/>navigator.appVersion: " + navigator.appVersion);document.writeln("<br/>navigator.language:
