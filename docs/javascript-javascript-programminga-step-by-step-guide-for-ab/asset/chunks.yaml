  trans: "\n\n# 赋值运算符\n\n这里有一个示例：\n\n```html\n<html><body>\n  <h1>Assignment Operators</h1>\n\
    \  <p id=\"pg1\"></p>\n  <p id=\"pg2\"></p>\n  <p id=\"pg3\"></p>\n  <p id=\"\
    pg4\"></p>\n  <p id=\"pg5\"></p>\n  <p id=\"pg6\"></p>\n  <script>\n    var a\
    \ = 10 , b = 20 ;\n    a = b;\n    document.getElementById(\"pg1\").innerHTML\
    \ = a;\n    a += 1;\n    document.getElementById(\"pg2\").innerHTML = a;\n   \
    \ a -= 1;\n    document.getElementById(\"pg3\").innerHTML = a;\n    a *= 5;\n\
    \    document.getElementById(\"pg4\").innerHTML = a;\n    a /= 5;\n    document.getElementById(\"\
    pg5\").innerHTML = a;\n    a %= 2;\n    document.getElementById(\"pg6\").innerHTML\
    \ = a;\n  </script>\n</body>\n</html>\n```\n\n该代码将返回以下结果：![](img/image914.jpg)\n\
    \n表达式 `a = b` 将变量 `a` 的值从 `10` 改为 `20`。这就是为什么第一个语句打印了 `20`。然后我们从 `a` 的值为 `20`\
    \ 开始操作。表达式 `a += 1` 将 `a` 的值增加了 `1`，因此它变为 `21`。这成为了变量 `a` 的新值。表达式 `a -= 1` 从变量\
    \ `a` 的当前值（即 `21`）减去 `1`，返回 `20`。这成为了变量 `a` 的新值。表达式 `a *= 5` 将变量 `a` 的值（即 `20`）乘以\
    \ `5`，返回 `100`。这成为了变量 `a` 的新值。表达式 `a /= 5` 将变量 `a` 的值除以 `5`，返回 `20`。这成为了变量 `a`\
    \ 的新值。表达式 `a %= 2` 返回变量 `a` 的值除以 `2` 后的余数，返回 `0`。\n\n# 第 5 章 - JavaScript 决策\n\
    \nJavaScript 带有决策语句，有助于控制程序的执行流。通过这些语句，所执行的操作将取决于所满足的条件。JavaScript 支持以下三种决策语句：\n\
    \n- If 语句\n- if else 语句\n- if else if 语句\n\n"
- fmt: "\n# If Statement\n\nThis statement should only be used when you need to take\
    \ an action based on a certain condition. The content will only be evaluated if\
    \ the condition is true. The statement takes the following syntax:\n\n```javascript\n\
    if ( expression){\n  //the content to evaluate\n}\n```\n\nFor example:\n```html\n\
    <script>\n    if ( 10 < 5 )\n    {\n      alert ( \"10 is less than 5\" );\n \
    \   }\n    if ( 10 > 5 )\n    {\n      alert ( \"10 is greater than 5\" );\n \
    \   }\n</script>\n```\n\nThe code will return the following upon execution:![](image965.jpg)\n\
    The first if condition evaluated to a false , hence its block of code was skipped.\
    \ The second if condition evaluated to a true , hence its block of code was executed\
    \ to give us the above output.\n\n# If…else Statement\n\nThis statement will evaluate\
    \ the condition of whether the condition is true or false.\nThe statement has\
    \ the following syntax:\n\n```javascript\nif ( condition){\n    // code…\n}else\
    \ {\n    // code…\n}\n```\n\nFor example:\n```html\n<script>\n  var x= 100 ;\n\
    \  if ( x% 2 == 0 ){\n  document . write( \"x is an even number\" );\n  }\n  else\
    \ {\n  document . write( \"x is an odd number\" );\n  }\n</script>\n```\n\nIn\
    \ the above code, we are checking whether the value of variable `x` is an even\
    \ number or not. The code returns the following:![](image1012.jpg)\nThe expression\
    \ `x%2==0` checks the remainder after dividing `x` by `2`. If the remainder is\
    \ `0`, then `x` is an even number, otherwise, it is an odd number.\n\n# If…else\
    \ if Statement\n\nSometimes, you may have multiple options on which you should\
    \ make a decision. This statement helps us achieve this in JavaScript. The statement\
    \ has the syntax given below:\n\n```javascript\nif ( expression_1){\n    Statement(\
    \ s)}\n}else if ( expression_2){\n    Statement( s)}\n}else if ( expression_3){\n\
    \    Statement( s)}\nelse {\n    Statement( s)}\n}\n```\n\nWe only have a series\
    \ of if statements which have been combined with the else statement. The statements\
    \ to be executed are the one whose conditions evaluate to true.\n\nFor example:\n\
    ```html\n<script>\n  var grade= \"B\" ;\n  if ( grade== \"A\" ){\n  document .\
    \ write( \"Excellent!\" );\n  }\n  else if ( grade== \"B\" ){\n  document . write(\
    \ \"Good!\" );\n  }\n  else if ( grade== \"C\" ){\n  document . write( \"Fair\"\
    \ );\n  }\n  else {\n  document . write( \"Poor!\" );\n  }\n</script>\n```\n\n\
    The value of `grade` is `B`. all the conditions will be matched and the `grade\
    \ ===\"B\"` condition will evaluate to a true . The code will return “ Good!”\
    \ .\n\n# Switch Statement\n\nThis statement helps us perform varied actions which\
    \ depend on various conditions. It is suitable when you have many branches depending\
    \ on the value of a single variable. With a switch statement, an expression evaluates\
    \ various statements to be executed depending on the value of an expression.\n\
    \nThe JavaScript interpreter must check every case against expression’s value\
    \ until it finds a match. If no match is found, then the default is chosen. Its\
    \ syntax is as follows:\n\n```javascript\nswitch ( expression) {\n    case i:code\n\
    \        break ;\n    case i:code\n        break ;\n    default :\n        code\n\
    }\n```\n\nFor example:\n```html\n<script>\n  var name = 'Nicholas' ;\n  var output;\n\
    \  switch ( name){\n  case 'Samuel' :\n  output = \"Your name is Samuel\" ;\n\
    \  break ;\n  case 'Michelle' :\n  output= \"Your name is Michelle\" ;\n  break\
    \ ;\n  case 'Nicholas' :\n  output = \"Your name is Nicholas\" ;\n  break ;\n\
    \  default :\n  output = \"No Name\" ;\n  }\n  document . write( output);\n</script>\n\
    ```\n\nThe code will return the following upon execution:![](image1141.jpg)\n\n\
    # Chapter 6- JavaScript Loops\n\nLoops are good when you need to execute your\
    \ code repeatedly, for a known or an unknown number of times. With loops, you\
    \ can automate tasks that could have been tedious manually. A good example is\
    \ when you need to fill a table with values. You can use a loop to iterate through\
    \ the cells while filling them manually. Let us discuss the loop statements supported\
    \ in JavaScript:\n\n## For Loop\n\nThis loop is used to iterate over a block of\
    \ code for a fixed number of times. It is suitable when one is aware of the number\
    \ of times to iterate over a block. The loop takes the following syntax:\n\n```javascript\n\
    for ( initializer; condition; increment)\n{\n    // code\n}\n```\n\nThe `initializer`\
    \ sets counter variable that we should start with. The `condition` specifies criteria\
    \ that must be met for the next iteration to be executed. The `increment` can\
    \ either increment or decrement the counter.\n\nHere is an example of `for` loop:\n\
    ```html\n<script>\n  for ( x= 0 ; x< 5 ; x++)\n  {\n  document . write( x + \"\
    <br/> )\n  }\n</script>\n```\nThe variable `x` in the loop was first initialized\
    \ to a value of `0`. The condition states that the value of `x` should be less\
    \ than `5`. In the increment, the value of variable `x` should be incremented\
    \ by `1`. This means that the loop should run from `0` to `4` to give the following\
    \ result:![](183.jpg)\n\nHere is another example:\n```html\n<head>\n<title> Length\
    \ Converter</title>\n</head>\n<body>\n<table border=4 >\n<tr>\n  <td>Length in\
    \ Meters</td>\n  <td>Length in Centimeters</td>\n</tr>\n<script language=\"javascript\"\
    >\nfor ( length= 0 ; length<= 20 ; length= length+2 ){\ndocument . write( \"<tr><td>\"\
    \ + length+\"</td><td>\"+( length * 100 )+\"</td></tr>\" );\n}\n</script>\n</body></html>\n\
    ```\nWe have used a `for` loop to iterate through a set of values while converting\
    \ them into meters. This time, we are incrementing the values by `2` after every\
    \ iteration. The code returns a populated table as below:![](223.jpg)\n\n## While\
    \ Loop\n\nThis loop can be used to iterate over code for an infinite number of\
    \ times. It is suitable for use when one doesn’t know the exact number of times\
    \ to execute a loop. The loop will execute as long as the specified condition\
    \ is true. Immediately the conditions become a false , the execution of the loop\
    \ will halt. It takes the following syntax:\n\n```javascript\nwhile ( variable<=\
    \ final_value){\n  // Script code.\n}\n```\n\nFor example:\n```html\n<script>\n\
    \  var x= 0 ;\n  while ( x<= 5 )\n  {\n  document . write( x + \"<br/>\" );\n\
    \  x++;\n  }\n</script>\n```\nThe while loop will run as long as the value of\
    \ variable `x` is not more than `5`. The code returns the following:![](257.jpg)\n\
    \nHere is another example:\n```html\n<head>\n<title> Length Converter </title>\n\
    </head>\n<body>\n<table border=3 >\n<tr>\n  <td>Length in Meters</td>\n  <td>Length\
    \ in Centimeters</td>\n</tr>\n<script language=\"javascript\">\nlength= 0 ;\n\
    while ( length<= 20 ){\ndocument . write( \"<tr><td>\" + length+\"</td><td>\"\
    \ +( length * 100 )+\"</td></tr>\" );\nlength = length+ 2 ;\n}\n</script>\n</body></html>\n\
    ```\nThe above loop will always run as long as the value of `length` is less than\
    \ or equal to `20`. Immediately the loop finds itself violating this condition,\
    \ it will stop execution. The code returns the following:![](307.jpg)\n\n## Do\
    \ while Loop\n\nThis is a good loop for iterating a block of code for infinite\
    \ number of times. However, the code must be executed once, regardless of the\
    \ state of the condition, whether true or false. Its syntax is as follows:\n\n\
    ```javascript\ndo {\n    statement ( s)\n} while ( condition);\n```\n\nA `while`\
    \ may never run, but the `do while` loop must run for at least once. Here is an\
    \ example:\n```html\n<script>\n  var x= 0 ;\n  do {\n  document . write( x + \"\
    <br/>\" );\n  x++;\n  } while ( x<= 5 );\n</script>\n```\nThe code will print\
    \ the following result:![](336.jpg)\n\n## Loop Control Statements\n\nWe can control\
    \ how loops are executed by use of `break` and `continue` statements. Sometimes,\
    \ you may need to exit a loop before its end is reached. Also, you may also need\
    \ to skip some part of a loop and execute the section which comes next. These\
    \ two statements can help us achieve this.\n\n### Break Statement\n\nWith this\
    \ statement, one can exit the loop early and get out of curly braces. Execution\
    \ goes to the block after the loop. Example:\n```html\n<script type=\"text/javascript\"\
    >\n    var p = 1 ;\n    document . write( \"Starting the loop<br /> \" );\n  \
    \  while ( p < 20 )\n    {\n      if ( p == 5 ){\n      break ; // get out of\
    \ loop\n      }\n      p = p + 1 ;\n      document . write( p + \"<br />\" );\n\
    \    }\n    document . write( \"Leaving the loop<br /> \" );\n</script>\n```\n\
    That is how you can use `break` statement in a `while` loop. The maximum value\
    \ of `p` should be `20`. However, we have instructed the JavaScript interpreter\
    \ to break once the value of `p` is `5`. The execution of the loop will stop at\
    \ that point; the output should show `2` to `5` as shown:![](373.jpg)\n\n### Continue\
    \ Statement\n\nWith the `continue` statement, we can break our current loop, then\
    \ proceed with the next value. Suppose you need to divide a certain number by\
    \ numbers ranging between `-5` to `+5`. You need to skip division by `0` since\
    \ it is illegal. This can be skipped using `continue`. This can be implemented\
    \ as follows:\n```html\n<script type=\"text/javascript\">\nfor ( p=- 5 ; p<= 5\
    \ ; p= p+1 ){\nif ( p== 0 ) { continue };document . write(10 / p);\n</script>\n\
    ```\nWith such implementation, the integer `10` will not be divided by `0`. The\
    \ code returns the following:![](400.jpg)\nWe have skipped division by 0 as we\
    \ continued from 1.\n\n# Chapter 7- JavaScript Functions\n\nFunctions are used\
    \ for performing operations. Functions are a good way of grouping code together.\
    \ Such code should be related in terms of the tasks they should perform. You only\
    \ have to group the code together and assign it a unique name. From that point,\
    \ you can call the code any number of times, facilitating code reuse. With functions,\
    \ you can enjoy the benefit of only having to do code rewriting or no rewriting\
    \ at all.\n\n## Function Definition\n\nThe definition and call of a JavaScript\
    \ function takes the following syntax:\n\n```javascript\n// function definition\n\
    function function_name(){\n    // code to execute\n}\n//call the function\nfunction_name();\n\
    ```\n\nAs shown in the above syntax, the function is given a name which is used\
    \ when calling the function to perform its intended task. The function has a body\
    \ placed within curly braces ({}). The following is an example:\n```html\n<body>\n\
    <script>\n    function HelloFunction() {\n    document . write( \"Hello World\"\
    \ );\n    }\n    HelloFunction();\n</script>\n</body>\n```\nWe have defined a\
    \ function named `HelloWorld()` . Inside the body of the function, we have stated\
    \ that the function should print the text Hello World. Immediately after the body\
    \ of the function, we have called it by its name. The code returns the following:![](451.jpg)\n\
    Notice the method we have used to call the above function. The function will be\
    \ called immediately the web page is loaded. However, many are the times we need\
    \ to call functions by click of a button. This is possible with JavaScript as\
    \ demonstrated below:\n```html\n<body>\n<script>\nfunction HelloFunction() {\n\
    alert ( \"Hello World\");}</script>\n<input type=\"button\" onclick = \"HelloFunction()\"\
    \ value=\"Hello\" />\n</body>\n```\nWe have used our previous function. However,\
    \ we have created a button with the text Hello on it. The `onclick` property states\
    \ what should happen after clicking the button. It states that after the button\
    \ is clicked, the `HelloFunction()` function should be called. Run the code and\
    \ click the Hello button. You will get the alert box with the necessary message:![](483.jpg)\n\
    \n## Function Arguments\n\nA function can take either one or more than one arguments,\
    \ also known as parameters. The arguments should be supplied by calling code and\
    \ they can be used inside the function. JavaScript is well known for being a dynamic\
    \ scripting language, so the function argument can take an argument of any data\
    \ type.\n\nConsider the following example:\n```html\n<script>\n    function MyFunction(\
    \ arg1, arg2) {\n      alert ( \"You passed \" + arg1 + \" and \" + arg2);\n \
    \   }\n    MyFunction( 10 , 12 );\n    MyFunction( \"Nicholas\" , \"Samuel\" );\n\
    \    MyFunction( \"Nicholas\" , 2 );\n</script>\n```\nWe have created a function\
    \ named `MyFunction` taking two arguments `arg1` and `arg2`. The function is to\
    \ concatenate the values of these two arguments with a text and show them on an\
    \ alert box. We have then called the same function three times, passing different\
    \ parameters each time. After running the code, click the ok to move through the\
    \ sequence of alert boxes. The first dialog should be as follows:![](507.jpg)\n\
    Note that the arguments will be passed to the function in the order you specify.\
    \ Here is another example:\n```html\n<body>\n<script>\nfunction calculateCube(\
    \ x){\nalert ( x * x);\n}\n</script>\n<form>\n<input type=\"button\" value=\"\
    Calculate Cube\" onclick=\"calculateCube(3)\" />\n</form>\n</body>\n```\nWe have\
    \ created a button with the text Calculate on it. When clicked, this button should\
    \ call the `calculateCube()` function. In the `onclick` parameter, we have specified\
    \ the function and passed an argument of `3` to it. This means it should return\
    \ the cube of `3`, which is `27`. Just run the program and click the button. Note\
    \ that when calling a function, you can pass more or fewer parameters. If you\
    \ pass fewer than the function expects, the rest will remain `undefined`. If you\
    \ pass more arguments, the excess ones will be ignored. This is demonstrated in\
    \ the following example:\n```html\n<script>\n    function MyFunction( arg1, arg2)\
    \ {\n      alert ( \"You passed \" + arg1 + \" and \" + arg2);\n    }\n    MyFunction(\
    \ 10 , 12 , 17 );\n    MyFunction( \"Nicholas\" , \"Samuel\" );\n    MyFunction(\
    \ \"Nicholas\" );\n</script>\n```\n\n## Arguments Object\n\nAny JavaScript function\
    \ can use `arguments` object. This object has a value for every parameter. It\
    \ is similar to an array. Its values can be accessed using an index in the same\
    \ way as an array. However, this object cannot support array methods. Consider\
    \ the following example:\n```html\n<script>\n    function MyFunction( arg1, arg2)\
    \ {\n      alert ( \"You passed \" + arguments[0] + \" and \" + arguments[1 ]);\n\
    \    }\n    MyFunction( 10 , 12 , 17 );\n    MyFunction( \"Nicholas\" , \"Samuel\"\
    \ );\n    MyFunction( \"Nicholas\" );\n</script>\n```\nThe code will run as usual.\
    \ When calling a function, we can pass arguments to it. The JavaScript interpreter\
    \ treats the first arguments as being at index `0`. `arguments[0]` denotes the\
    \ first argument when calling the function while `arguments[1]` denotes the second\
    \ argument when calling the function. We can use a `for` loop to iterate over\
    \ the `arguments` object. For example:\n```html\n<script>\n    function MyFunction()\
    \ {\n      for ( var x = 0 ; x < arguments.length; x++){\n        alert ( arguments[\
    \ x]);\n      }\n    }\n    MyFunction( \"Nicholas\" , \"Samuel\" );\n</script>\n\
    ```\nTwo arguments have been passed to the function, and we have used the variable\
    \ `x` within a `for` loop to iterate through these.\n\n## Return Value\n\nIn JavaScript,\
    \ a function can use the `return` keyword to return either zero or one value.\
    \ Consider the example given below:\n```html\n<script>\n  function MyFunction(){\n\
    \  return \"Hello sir/madam\" ;\n  }\n</script>\n<script>\n  document . write(\
    \ MyFunction());\n</script>\n```\nThe function will return what has been specified\
    \ in the statement with the `return` keyword. Here is another example:\n```html\n\
    <body>\n<p id=\"pg1\"></p>\n<p id=\"pg2\"></p>\n<script>\n    function Addition(\
    \ x, y) {\n      return x + y;\n    }\n    document . getById(\"pg1\").innerHTML\
    \ = Addition(10 , 12 );\n    function Product( x, y) {\n      console.log( x *\
    \ y);\n    };\n    document. getById(\"pg2\").innerHTML = Product(10 , 12 );\n\
    </script>\n</body>\n```\nThe code will print the following:![](649.jpg)\nWe have\
    \ created a function named `Addition()` that returns the sum of two variables\
    \ `x` and `y`. The calling code is capable of getting the return value and assigns\
    \ it to a variable. We also defined a second function named `Product()` which\
    \ returns nothing, hence its result will be `undefined`. In JavaScript, we can\
    \ have a function returning another function. Here is an example of this:\n```html\n\
    <body>\n<p id=\"pg1\"></p>\n<p id=\"pg2\"></p>\n<script>\n    function myfunction(\
    \ a) {\n      function product( b)\n      {\n        return a * b;\n      }\n\
    \      return product;\n    }\n    var db = myfunction(2 );\n    document . getById(\"\
    pg1\").innerHTML = db(2 );\n    document . getById(\"pg2\").innerHTML = db(3 );\n\
    </script>\n</body>\n```\nThe function named `myfunction()` is returning the function\
    \ `product()`.\n\n## Function Expression\n\nWith JavaScript, we can assign a variable\
    \ to our function then use that variable as the function. This is given the name\
    \ a function expression. For example:\n```html\n<body>\n<p id=\"pg1\"></p>\n<p\
    \ id=\"pg2\"></p>\n<script>\n    var sum = function Addition( x, y) {\n      return\
    \ x + y;\n    };\n    document . getById(\"pg1\").innerHTML = sum(10 , 12 );\n\
    \    document . getById(\"pg2\").innerHTML = Addition(10 , 12 ); // invalid\n\
    </script>\n</body>\n```\nThe code should return the sum of `10` and `12`, which\
    \ is `22`. This output will be from the `sum(10, 12)` expression whereby we are\
    \ calling the function using the variable we assigned to it. The expression `Addition(10,\
    \ 12)` is not valid as we are calling the function by its name while it has already\
    \ been assigned a variable.\n\n## Anonymous Function\n\nIn JavaScript, we can\
    \ define a function without a name. Such a function is known as an anonymous function.\
    \ You must assign a variable to your anonymous function. For example:\n```html\n\
    <script>\n    var helloMessage = function (){\n    alert ( \"Hello World\" );\n\
    \    };\n    helloMessage();\n    var message = function ( name) {\n      alert\
    \ ( \"Hi \" + name);\n    };\n    helloMessage();\n    message( \"Nicholas\" );\n\
    </script>\n```\nWe have created two anonymous functions. The first one takes no\
    \ argument and it has been assigned the `helloMessage` variable. The message should\
    \ return the Hello World message in an alert box. This method has been called\
    \ twice in the program using the `helloMessage()` expression. We have created\
    \ the second anonymous function taking one argument that is, `name`. This function\
    \ has been assigned the variable `message`. We have called this method using this\
    \ variable and passed the argument `Nicholas` to it. The code will show the World\
    \ message twice and the Nicholas message once.![](754.jpg)\n\n## Nested Functions\n\
    \nJavaScript functions can have one or many inner functions. The nested functions\
    \ should be within the score of the outer function. The inner function is allowed\
    \ to access both the parameters and variables of the outer function. However,\
    \ an outer function is not able to access the variables defined within its inner\
    \ functions. Consider the following example:\n```html\n<script>\n    function\
    \ OuterFunc( name)\n    {\n      function InnerFunc() {\n        document . write(\
    \ \"Hi \" + name);\n      }\n      return InnerFunc();\n    }\n    OuterFunc(\
    \ \"Nicholas\" );\n</script>\n```\n"
