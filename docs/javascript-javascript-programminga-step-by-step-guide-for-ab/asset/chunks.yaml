- fmt: "\nIn my case, I ran the code on `Chrome` and it returned the following:![](image5466.jpg)\n\
    \nWith the above properties, one can determine the plugins which have been installed\
    \ then use JavaScript so as to play the necessary multimedia file.\n\nExample:\n\
    ```html\n<script language= \"JavaScript\" type= \"text/javascript\">\nvid = navigator\
    \ . mimeTypes [ \"video/quicktime\" ];\nif ( vid){\n    document . write( \"<embed\
    \ src='movie1.mov' height= 110 width= 110 > \");\n}\nelse\n{\n    document . write(\
    \ \"<img src='img1.gif' height= 110 width= 110 > \");\n}\n</script>\n```\n\nThe\
    \ `<embed>` tag has helped us to embed some multimedia file. With JavaScript,\
    \ we are able to control multimedia.\n\nExample:\n```html\n<script type= \"text/javascript\"\
    >\nfunction playMedia() {\n    if (! document . game. IsPlaying()){\n        document\
    \ . game. Play();\n    }\n}\nfunction stopMedia() {\n    if ( document . game.\
    \ IsPlaying()){\n        document . game. StopPlay();\n    }\n}\nfunction rewindMedia()\
    \ {\n    if ( document . game. IsPlaying()){\n        document . game. StopPlay();\n\
    \    }\n    document . game. Rewind();\n}\n</script>\n</head>\n<body>\n    <embed\
    \ id= \"game\" name= \"game\" src= \"your_game_url\" width= \"320\" height= \"\
    302\" play= \"false\" loop= \"false\" pluginspage= \" http://www.macromedia.com/go/getflashplayer\
    \ \" swliveconnect= \"true\" >\n    </embed>\n    <form name= \"form1\" id= \"\
    form1\" action= \"#\" method= \"get\" >\n        <input type= \"button\" value=\
    \ \"Play\" onclick = \"playMedia();\" />\n        <input type= \"button\" value=\
    \ \"Stop\" onclick = \"stopMedia();\" />\n        <input type= \"button\" value=\
    \ \"Rewind\" onclick = \"rewindMedia();\" />\n    </form>\n```\n\nEnsure that\
    \ you add the URL to the location of your game. Execute the script and you will\
    \ see the buttons for Play, Stop and Rewind.![](image574.jpg)The example is capable\
    \ of working on any browser.\n\n# Chapter 16- Error Handling\n\nJavaScript is\
    \ one of the loosely-typed languages that we have. It’t have a compile time. Errors\
    \ occur during programming. You can attempt to access an undefined variable or\
    \ function. The errors are classified as syntax errors, runtime errors and logical\
    \ errors.\n\n### Syntax Errors\n\nIn JavaScript, syntax errors occur during interpret\
    \ time. They are also known as parsing errors . Consider the sample script below:\n\
    ```javascript\n<script type= \"text/javascript\">\nwindow . print()\n```\nJavaScript\
    \ statement should end with a semicolon. The `print()` statement doesn’t end with\
    \ a semicolon, hence this will result in a syntax error. If a statement has a\
    \ syntax error, all statements in the same thread will be affected. The other\
    \ threads will be executed .\n\n### Runtime Errors\n\nThese are the exceptions\
    \ raised during runtime. Execution occurs after interpretation.\n\nExample:\n\
    ```javascript\n<script type= \"text/javascript\">\nwindow . printFile();\n```\n\
    During interpretation, no error will be raised since the script has the correct\
    \ syntax. However, an exception will be raised during runtime as the script will\
    \ call a method which is unknown, that `printFile()` method.\n\n### Logical Errors\n\
    \nThese types of errors occur when you fail to implement the right logic in your\
    \ script, meaning you will not get the expected results. They can be hard for\
    \ one to track. They don’t result from either runtime or syntax errors. One cannot\
    \ catch those types of errors since they depend on the business logic to be implemented.\n\
    \n### try...catch...finally\n\nWith JavaScript, you can handle errors and exceptions.\
    \ When this statement is combined with `throw`, one can handle errors and exceptions\
    \ more effectively. The statement has the syntax below:\n```javascript\n<script\
    \ type= \"text/javascript\">\ntry {\n    // your code\n}\ncatch ( ex ) {\n   \
    \ // code to execute in case of exception\n}\nfinally {\n    // Code to execute\
    \ whether the exception occurs or not.\n}\n```\n`try` block should be followed\
    \ by either `catch` or `finally` block. On the occurrence of the exception in\
    \ `try` block, an exception will be added to the `ex`, then `catch` block will\
    \ be executed. The `final` block is optional and it is unconditionally executed\
    \ after the `try/catch`. Example:\n```javascript\nfunction checkFunction() {\n\
    \    var check, val;\n    check = document . getById( \"check\" );\n    check.\
    \ innerHTML = \"\" ;\n    val = document . getById( \"field\" ). value;\n    try\
    \ {\n        if ( val == \"\" )\n        throw \"empty\" ;\n        if ( isNaN\
    \ ( val)) throw \"Enter a number\" ;\n        val = Number ( val);\n        if\
    \ ( val < 10 )\n        throw \"too low\" ;\n        if ( val > 20 )\n       \
    \ throw \"too high\" ;\n    }\n    catch ( ex) {\n        check . innerHTML =\
    \ \"Your input is \" + ex;\n    }\n}\n```\nIn our case, we are using the `try`\
    \ and `catch` to validate our input field. The input should be a number ranging\
    \ between 10 and 20. If this is not adhered to, an exception will be raised then\
    \ handled by the `try` and `catch`.\n\n### finally Statement\n\nThis statement\
    \ specifies the code to be executed after a `try` and `catch`, and it must be\
    \ executed regardless of the result. The following is its syntax:\n```javascript\n\
    try {\n    Code for try\n}\ncatch ( err) {\n    code for handling errors\n}\n\
    finally {\n    code for finally\n}\n```\nExample:\n```javascript\nfunction checkFunction()\
    \ {\n    var check, val;\n    check = document . getById( \"check\" );\n    check.\
    \ innerHTML = \"\" ;\n    val = document . getById( \"field\" ). value;\n    try\
    \ {\n        if ( val == \"\" )\n        throw \"It is empty\" ;\n        if (\
    \ isNaN ( val)) throw \"Enter a number\" ;\n        val = Number ( val);\n   \
    \     if ( val > 20 )\n        throw \"number high\" ;\n        if ( val < 10\
    \ )\n        throw \"number low\" ;\n    }\n    catch ( ex ) {\n        check\
    \ . innerHTML = \"Input \" + ex;\n    }\n    finally {\n        document . getById(\
    \ \"field\" ). value = \"\" ;\n}\n}\n```\nThe `field` value will be cleared, which\
    \ is implemented in the `finally` block.\n\n# Chapter 17- Regular Expressions\n\
    \nA regular expression refers to a pattern created by characters. JavaScript has\
    \ a class named `RegExp` which helps programmers work with regular expressions.\
    \ With this class, one can perform pattern matching, replace and search functions\
    \ on some text.\n\nTo define a regular expression, we use the `RegExp()` constructor.\
    \ This is demonstrated below:\n```javascript\nexpression = new RegExp( \"the_pattern\"\
    , \"flags\" );\n```\nThe parameter `the_pattern` is a string specifying the pattern\
    \ of regular expression or any other regular expression. The `flags` parameter\
    \ is an optional string with either `\"i\"`, `\"m\"` and `\"g\"` attributes specifying\
    \ case-insensitive, multi-line and global matches respectively.\n\nLet us discuss\
    \ the various methods for Regular Expressions in JavaScript.\n\n### exec()\n\n\
    This method will search a string for text matching the `regexp`. If a match is\
    \ found, the results will be returned in an array, otherwise, it will return `null`.\
    \ The method has the following syntax:\n```javascript\nRegExpObject. exec( search_string\
    \ );\n```\nThe parameter `search_string` denotes the string that is to be searched.\
    \ Consider the following example:\n```javascript\n<script type= \"text/javascript\"\
    >\nvar text = \"JavaScript has a class named RegExp which helps programmers work\
    \ with regular expressions\" ;\nvar reg = new RegExp( \"express\", \"g\" );\n\
    var output = reg. exec( text );\ndocument . write( \"First test, the returned\
    \ value is: \" + output);\nreg = new RegExp( \"language\", \"g\" );\nvar output\
    \ = reg. exec( text );\ndocument . write( \"<br />Second test, the returned value\
    \ is: \" + output);\n</script>\n```\nThe code returns the following output after\
    \ execution:(image5787.jpg)We first searched for the string `express` which was\
    \ found in the expressions. Secondly, we searched for the string `language` and\
    \ it was not found in our sentence.\n\n### test()\n\nThis method searches a string\
    \ for text matching the regexp. If a match is found, it will return a `true`,\
    \ otherwise, it will return a `false`. The method has the syntax given below:\n\
    ```javascript\nRegExpObject. test( search_string );\n```\nThe `search_string`\
    \ is the string that is to be searched. Consider the following example:\n```javascript\n\
    <script type= \"text/javascript\">\nvar text = \"JavaScript has a class named\
    \ RegExp which helps programmers work with regular expressions\" ;\nvar reg =\
    \ new RegExp( \"express\", \"g\" );\nvar output = reg. test( text );\ndocument\
    \ . write( \"First test returned: \" + output);\nreg = new RegExp( \"language\"\
    , \"g\" );\nvar output = reg. test( text );\ndocument . write( \"<br />Second\
    \ test returned: \" + output);\n</script>\n```\nThe code returns the following\
    \ result:(image5816.jpg)In the first test, a match was found, hence the output\
    \ is `true`. In the second test, no match was found, hence it returned a `false`.\n\
    \n### search()\n\nThis method searches for a string, similarly to `indexOf()`\
    \ function that it will take a regular expression rather than a string. An integer\
    \ is returned indicating the string position. Note that 0 indicates the beginning\
    \ of a string, 7 will match the `7th` character, etc. If no match is found, then\
    \ -1 will be returned:\n```javascript\n<script type= \"text/javascript\">\nvar\
    \ myString = \"best\";\nm= myString. search( /Best[0-9]+/ );\ndocument . writeln(\
    \ m)\n</script>\n```\nThe scripts returns upon execution.\n\n### toString()\n\n\
    When used, this method will return the string representation of the expression\
    \ in literal form. The method takes the syntax below:\n```javascript\nRegExpObject.\
    \ toString ();\n```\nThe method then returns a string representation of regular\
    \ expression. For example:\n```javascript\n<script type= \"text/javascript\">\n\
    var text = \"JavaScript has a class named RegExp which helps programmers work\
    \ with regular expressions\" ;\nvar reg = new RegExp( \"express\", \"g\" );\n\
    var output = reg. toString( text );\ndocument . write( \"First test returned:\
    \ \" + output);\nreg = new RegExp( \"/\", \"g\" );\nvar output = reg. toString(\
    \ text );\ndocument . write( \"<br />Second test returned: \" + output);\n</script>\n\
    ```\nThe code will return the following result:(image5859.jpg)\n\n# Chapter 18-\
    \ Image Map\n\nJavaScript can be used for the creation of client side image map.\
    \ To enable client-side image maps, we use `usemap` attribute of `<img>` tag.\
    \ We use `<area>` and `<map>` tags to define them. The image to form the map is\
    \ inserted using the `<img>` tag and a special attribute known as `usemap`. The\
    \ value for this attribute should match the value of `name` attribute used in\
    \ the `<map>` element, and it should be preceded by a hash or pound sign. The\
    \ `<map>` tag creates a map for your image it should come after the `<img>` element.\
    \ It will form the container for `<area>` elements defining the clickable hotspots.\
    \ The `<map>` element has only one attribute, name, which is a name identifying\
    \ the map. This helps the `<img>` element know the `<map>` element it is to use.\
    \ The coordinates and the shape of the clickable hotspots are defined using `<area>`\
    \ element. Consider the following example:\n```html\n<head>\n<script type= \"\
    text/javascript\">\n    <!--\n    function showLanguage( name) {\n        document\
    \ . form1. lang. value = name\n    }\n    -->\n</script>\n</head>\n<body>\n  \
    \  <form name= \"form1\" >\n        <input type= \"text\" name= \"lang\" size=\
    \ \"20\" />\n    </form>\n    <img src=\"/images/usemap.gif\" alt= \"Languages\"\
    \ border= \"0\" usemap = \"#languages\" />\n    <map name= \"languages\">\n  \
    \      <area shape=\"poly\" coords=\"74,0,113,29,98,72,52,72,38,27\" href=\"perl.htm\"\
    \ alt=\"Perl\" target=\"_self\" onMouseOver=\"showLanguage('Perl')\" onMouseOut=\"\
    showLanguage('')\" />\n        <area shape=\"rect\" coords=\"22,83,26,25\" href=\"\
    /html.org\" alt=\"Html\" target=\"_self\" onMouseOver=\"showLanguage('Html')\"\
    \ onMouseOut=\"showLanguage('')\" />\n        <area shape=\"circle\" coords=\"\
    73,168,2\" href=\"/php.org\" alt=\"Php\" target=\"_self\" onMouseOver=\"showLanguage('Php')\"\
    \ onMouseOut=\"showLanguage('')\" />\n    </map>\n</body>\n```\nThe code gives\
    \ me an interface after execution. The result I get on the input field depends\
    \ on the part I point as shown below:(image5946.jpg)\n\n# Chapter 19- Page Redirection\n\
    \nSometimes, you encounter situations in which you click on a URL to visit a certain\
    \ page X but you are internally directed to another page Y . This is how redirection\
    \ works. There are a number of reasons as why you may need to redirect your users\
    \ to another page. A good example is when you move to a new domain. You can use\
    \ page redirection to direct your visitors to the new website. In such a case,\
    \ you only have to maintain your old domain then add a single page with the redirection\
    \ feature so that anyone who visits your old domain is taken to your new website.\n\
    \nSometimes, you can create different web pages for different versions of browsers\
    \ or when the pages are for different countries. Instead of relying on side page\
    \ redirection, you can choose to use client side page redirection to ensure that\
    \ each lands on the right page.\n\nPage redirection is also important in cases\
    \ where your web pages have been indexed by the search engines. When you move\
    \ to a new domain, there is no need for you to lose your search engine visitors.\
    \ In this case, the client side page redirection will help you. However, don’t\
    \ do it as a way of fooling the browsers as doing so may see your web pages banned\
    \ on the browsers.\n\nClient side redirection can be implemented easily in JavaScript.\
    \ To do this, you are only required to add a line at the head section of your\
    \ code. This will do the redirection. Let us demonstrate this:\n```html\n<head>\n\
    <script type= \"text/javascript\">\n    <!--\n    function RedirectFunction()\
    \ {\n        window . location = \" https://www.javascript.com \" ;\n    }\n \
    \   -->\n</script>\n</head>\n<body>\n    <p> Click the button given below for\
    \ redirection </p>\n    <form >\n        <input type= \"button\" value= \"Redirect\"\
    \ onclick = \"RedirectFunction();\" />\n    </form>\n</body>\n```\nThe code will\
    \ return the following upon execution:(image5996.jpg)Click the Redirect button\
    \ and see what happens. You should be redirected to the URL that you have specified.\
    \ In the above case, I have specified JavaScript website as the URL. You can change\
    \ and see it redirect you to another website.\n\nIt is possible for you to display\
    \ a message to the visitors before you can redirect them to a new page. However,\
    \ a bit of delay will be needed for the new page to be loaded. Let us demonstrate\
    \ how this can be implemented:\n```html\n<head>\n    <script type= \"text/javascript\"\
    >\n        function RedirectFunction() {\n            window . location = \" https://www.javascript.com\
    \ \" ;\n            document . write( \"You will see the page in 10 seconds.\"\
    \ );\n            setTimeout (RedirectFunction(), 10000 );\n        }\n    </script>\n\
    </head>\n<body>\n```\nAfter running the code, you will see the following message:(image6029.jpg)After\
    \ the expiry of 10 seconds, you will be redirected to the website.As we had stated\
    \ earlier, page redirection can be done based on the browser of the user.\n"
  raw: 'In my case, I ran the code on Chrome and it returned the following:![](image5466.jpg)With
    the above properties, one can determine the plugins which have been installed
    then use JavaScript so as to play the necessary multimedia file.Example:< script
    language= "JavaScript" type= "text/javascript" >         vid = navigator . mimeTypes
    [ "video/quicktime" ];         if ( vid){            document . write( "<embed
    src=''movie1.mov''            height= 110 width= 110 > ");         }         else         {            document
    . write( "<img src=''img1.gif''            height= 110 width= 110 > ");         }      </
    script>The <embed> tag has helped us to embed some multimedia file.With JavaScript,
    we are able to control multimedia.Example:<      script type= "text/javascript"
    >            function playMedia()            {               if (! document .
    game. IsPlaying()){                  document . game. Play();               }            }            function
    stopMedia()            {               if ( document . game. IsPlaying()){                  document
    . game. StopPlay();               }            }            function rewindMedia()            {               if
    ( document . game. IsPlaying()){                  document . game. StopPlay();               }               document
    . game. Rewind();            }      </ script>          </ head>   < body>      <
    embed id= "game" name= "game"      src= "your_game_url"      width= "320" height=
    "302" play= "false" loop= "false"      pluginspage= " http://www.macromedia.com/go/getflashplayer
    "      swliveconnect= "true" >      </ embed >      < form name= "form1" id= "form1"
    action= "#" method= "get" >         < input type= "button" value= "Play" onclick
    = "playMedia();" />         < input type= "button" value= "Stop" onclick = "stopMedia();"
    />         < input type= "button" value= "Rewind" onclick = "rewindMedia();" />      </
    form >Ensure that you add the URL to the location of your game. Execute the script
    and you will see the buttons for Play, Stop and Rewind.![](image5574.jpg)The example
    is capable of working on any browser.Chapter 16- Error HandlingJavaScript is one
    of the loosely-typed languages that we have. It doesn’t have a compile time. Errors
    normally occur during programming. You can attempt to access an undefined variable
    or function. The errors are classified as syntax errors, runtime errors and logical
    errors. Let us discuss them.Syntax ErrorsIn JavaScript, syntax errors occur during
    interpret time. They are also known as parsing errors . Consider the sample script
    given below:< script type= "text/javascript" >      window . print()</ script>JavaScript
    statement should end with a semicolon.The “window.print()” statement doesn’t end
    with a semicolon, hence this will result in a syntax error. If a statement has
    a syntax error, all statements in the same thread as this will be affected. The
    other threads will be executed normally .Runtime ErrorsThese are the exceptions
    raised during runtime. Execution occurs after interpretation.Example:< script
    type= "text/javascript" >      window . printFile();</ script>During interpretation,
    no error will be raised since the script has the correct syntax. However, an exception
    will be raised during runtime as the script will call a method which is unknown,
    that is, the printFile() method.Logical ErrorsThese types of errors occur when
    you fail to implement the right logic in your script, meaning you will not get
    the expected results. They can be hard for one to track. They don’t result from
    either runtime or syntax errors. One cannot catch those types of errors since
    they depend on the business logic to be implemented.try...catch...finallyWith
    JavaScript, you can handle errors and exceptions. When this statement is combined
    with the throw , one can handle errors and exceptions more effectively. The statement
    has the syntax given below:< script type= "text/javascript" >      try {         //
    your code         [ break ;]      }      catch ( ex ) {         // code to execute
    in case of exception         [ break ;]      }      [ finally {         // Code
    to execute whether the exception occurs or not.      }] </ script>A try block
    should be followed by either catch or finally block. On the occurrence of the
    exception in try block, an exception will be added to the ex, then catch block
    will be executed. The final block is optional and it is unconditionally executed
    after the try/catch . Example:< script>function checkFunction() {    var check,
    val;    check = document . getElementById( "check" );    check. innerHTML = ""
    ;    val = document . getElementById( "field" ). value;    try {        if ( val
    == "" )   throw "empty" ;        if ( isNaN ( val)) throw "Enter a number" ;        val
    = Number ( val);        if ( val < 10 )     throw "too low" ;        if ( val
    > 20 )    throw "too high" ;    }    catch ( ex) {        check. innerHTML = "Your
    input is " + ex;    }}</ script>In our case, we are using the try and catch to
    validate our input field. The input should be a number ranging between 10 and
    20\. If this is not adhered to, an exception will be raised then handled by the
    try and catch.finally StatementThis statement specifies the code to be executed
    after a try and catch, and it must be executed regardless of the result. The following
    is its syntax:try {    Code for try}catch ( err) {    code for handling errors}finally
    {    code for finally}Example:< script>function checkFunction() {    var check,
    val;    check = document . getElementById( "check" );    check. innerHTML = ""
    ;    val = document . getElementById( "field" ). value;    try {        if ( val
    == "" )   throw "It is empty" ;        if ( isNaN ( val)) throw "Enter a number"
    ;        val = Number ( val);        if ( val > 20 )    throw "number too high"
    ;        if ( val < 10 )     throw "number too low" ;    }    catch ( ex) {        check.
    innerHTML = "Input " + ex;    }    finally {        document . getElementById(
    "field" ). value = "" ;    }}</ script>The field value will cleared, which is
    implemented in the finally block.Chapter 17- Regular ExpressionsA regular expression
    refers to a pattern created by characters. JavaScript has a class named RegExp
    which helps programmers work with regular expressions. With this class, one can
    perform pattern matching, replace and search functions on some text.To define
    a regular expression, we use the RegExp() constructor. This is demonstrated below:regexpression
    = new RegExp( "the_pattern" , "flags" );The parameter the_pattern is a string
    specifying the pattern of regular expression or any other regular expression.
    The flags parameter is an optional string with either the "i" , "m"  and "g" attributes
    specifying case-insensitive, multi-line and global matches respectively.Let us
    discuss the various methods for Regular Expressions in JavaScript.exec()This method
    will search a string for text matching the regexp. If a match is found, the results
    will be returned in an array, otherwise, it will return null.The method has the
    following syntax:RegExpObject. exec( search_string );The parameter search_string
    denotes the string that is to be searched for.Consider the following example: 
    < script type = "text/javascript" >         var text = "JavaScript has a class
    named RegExp which helps programmers work with regular expressions" ;         var
    reg = new RegExp( "express" , "g" );         var output = reg. exec( text );         document
    . write( "First test, the returned value is: " +   output);         reg = new
    RegExp( "language" , "g" );         var output = reg. exec( text );         document
    . write( "<br />Second test, the returned value is: " +   output);      </ script>The
    code returns the following output after execution:![](image5787.jpg)We first searched
    for the string express which was found in the expressions . Secondly, we searched
    for the string language and it was not found in our sentence.test()This method
    searches a string for text matching the regexp. If a match is found, it will return
    a true , otherwise, it will return a false . The method has the syntax given below:RegExpObject.
    test( search_string );The search_string is the string that is to be searched.Consider
    the following example:  < script type = "text/javascript" >         var text =
    "JavaScript has a class named RegExp which helps programmers work with regular
    expressions" ;         var reg = new RegExp( "express" , "g" );         var output
    = reg. test( text );         document . write( "First test returned: " +   output);         reg
    = new RegExp( "language" , "g" );         var output = reg. test( text );         document
    . write( "<br />Second test returned: " +   output);      </ script>The code returns
    the following result:![](image5816.jpg)In the first test, a match was found, hence
    the output is true . In the second test, no match was found, hence it returned
    a false .search()This method searches for a string, similarly to indexOf() function
    except that it will take a regular exception rather than a string. An integer
    is returned indicating the string position. Note that 0 indicates the beginning
    of a string, 7 will match the 8 th character, etc. If no match is found, then
    a -1 will be returned:< script type = "text/javascript" >    var myString = "best1
    Best2 BEST3" ;var m= myString. search( /Best[0-9]+/ );document . writeln( m)</
    script>The scripts returns a 6 upon execution.toString()When used, this method
    will return the string representation of the regular expression in question in
    regular expression literal form. The method takes the syntax given below:RegExpObject.
    toString ();The method then returns a string representation of your regular expression.For
    example:< script type = "text/javascript" >    var text = "JavaScript has a class
    named RegExp which helps programmers work with regular expressions" ;         var
    reg = new RegExp( "express" , "g" );                   var output = reg. toString
    ( text );         document . write( "First test returned: " +   output);             reg
    = new RegExp( "/" , "g"                    var output = reg. toString ( text );         document
    . write( "<br />Second test returned: " +   output);      </ script>The code will
    return the following result upon execution:![](image5859.jpg)Chapter 18- Image
    MapJavaScript can be used for the creation of a client side image map. To enable
    client-side image maps, we use the usemap attribute of <img /> tag. We use the
    <area> and <map> extension tags to define them. The image to form the map is inserted
    using the <img /> tag and a special attribute known as usemap . The value for
    this attribute should match the value of the name attribute used in the <map>
    element, and it should be preceded by a hash or pound sign.The <map> tag creates
    a map for your image and it should come after the <img /> element. It will form
    the container for <area /> elements defining the clickable hotspots. The <map>
    element has only one attribute, name attribute, which is a name identifying the
    map. This helps the <img /> element know the <map> element which it is to use.The
    coordinates and the shape of the clickable hotspots are defined using the <area>
    element. Consider the following example:< html>       < head>      < script type
    = "text/javascript" >         <!--            function showLanguage( name) {               document
    . form1. lang. value = name            }         //-->      </ script>   </ head>
          < body>      < form name = "form1" >         < input type = "text" name
    = "lang" size = "20" />      </ form >           < img src = "/images/usemap.gif"
    alt = "Languages" border = "0" usemap = "#languages" />             < map name
    = "languages" >         < area shape= "poly"            coords = "74,0,113,29,98,72,52,72,38,27"            href
    = "perl.htm" alt = "Perl"            target = "_self"            onMouseOver =
    "showLanguage(''Perl'')"            onMouseOut = "showLanguage('''')" />         <
    area shape = "rect"            coords = "22,83,126,125"            href = "/html.org"
    alt = "Html"            target = "_self"            onMouseOver = "showLanguage(''Html'')"            onMouseOut
    = "showLanguage('''')" />         < area shape = "circle"            coords =
    "73,168,32"            href = "/php.org" alt = "Php"            target = "_self"            onMouseOver
    = "showLanguage(''Php'')"            onMouseOut = "showLanguage('''')" />      </
    map>   </ body></ html>The code gives me an interface after execution. The result
    I get on the input field depends on the part I point at as shown below:![](image5946.jpg)Chapter
    19- Page RedirectionSometimes, you encounter situations in which you click on
    a URL to visit a certain page X but you are internally directed to another page
    Y . This is how page redirection works.There are a number of reasons as to why
    you may need to redirect your users to another page. A good example is when you
    move to a new domain. You can use page redirection to direct your visitors to
    the new website. In such a case, you only have to maintain your old domain then
    add a single page with the page redirection feature so that anyone who visits
    your old domain is taken to your new website.Sometimes, you can create different
    web pages for different versions of browsers or when the pages are for different
    countries. Instead of relying on server side page redirection, you can choose
    to use client side page redirection to ensure that each visits lands on the right
    page.Page redirection is also important in cases where your web pages have been
    indexed by the search engines. When you move to a new domain, there is no need
    for you to lose your search engine visitors. In this case, the client side page
    redirection will help you. However, don’t do it as a way of fooling the browsers
    as doing so may see your web pages banned on the browsers.Client side page redirection
    can be implemented easily in JavaScript. To do this, you are only required to
    add a line at the head section of your code. This will do the redirection. Let
    us demonstrate this:< html>   < head>             < script type= "text/javascript"
    >         <!--            function RedirectFunction() {               window .
    location = " https://www.javascript.com " ;            }         //-->      </
    script>   </ head>   < body>      < p> Click the button given below for redirection
    </ p>      < form >         < input type= "button" value= "Redirect" onclick =
    "RedirectFunction();" />      </ form >       </ body></ html>The code will return
    the following upon execution:![](image5996.jpg)Click the Redirect button and see
    what happens. You should be redirected to the URL that you have specified. In
    the above case, I have specified JavaScript website as the URL. You can change
    and see it redirect you to another website.It is possible for you to display a
    message to the visitors before you can redirect them to a new page. However, a
    bit of delay will be needed for the new page to be loaded. Let us demonstrate
    how this can be implemented:< html>   < head>      < script type= "text/javascript"
    >            function RedirectFunction() {               window . location = "
    https://www.javascript.com " ;            }                    document . write(
    "You will see the main page in 10 seconds." );            setTimeout ( ''RedirectFunction()''
    , 10000 );      </ script>   </ head>   < body>   </ body></ html>After running
    the code, you will see the following message:![](image6029.jpg)After the expiry
    of the 10 seconds, you will be redirected to the JavaScript website.As we had
    stated earlier, page redirection can be done based on the browser of the user.
    The following example demonstrates how this can be done:< html>   < head>            <
    script type = "text/javascript" >         <!--            var browsertype = navigator
    . appName;            if ( browsertype == "Netscape" ) {               window
    . location = " http://www.netscape.com " ;            } else if ( browsertype
    == "Microsoft Internet Explorer" ) {               window . location = " http://www.microsoft.com
    " ;            } else {               window . location = " http://www.javascript.com
    " ;            }         //-->      </ script>          </ head>   < body>   </
    body></ html>The user will then be redirected based on the type of browser they
    are using. Note that we have used decision making statement if to redirect the
    users to different pages.ConclusionThis marks the end of this guide. JavaScript
    is a very powerful scripting language. JavaScript is an interpreted scripting
    language. The language is normally executed on the client side. This makes it
    the best language for validations during web development. Web developers use JavaScript
    to validate their web forms for valid email addresses, phone numbers, and other
    details. JavaScript has changed the way things are done. Initially, after filling
    a form, one had to submit it to the server so that it could be checked for any
    anomalies. If anomalies were found, the server would return the form to the user
    in order to correct the details. The user would then re-submit the details filled
    in the form. With JavaScript, validation is done before the form can be submitted
    to the server. The user is able to know any errors done while filling the form
    and correct them accordingly. This has made things easy for users. JavaScript
    also allows you to create various effects that can be invoked by some of your
    actions. Examples of these actions can be a hover of the mouse cursor, a press
    of a keyboard key, loading of a web page, etc.'
