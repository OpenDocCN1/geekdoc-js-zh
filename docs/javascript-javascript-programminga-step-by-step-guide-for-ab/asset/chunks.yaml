    \ 11- The Document Object Model\n\nThe `document` object refers to your whole\
    \ HTML page. After you load an object into the web browser, it immediately becomes\
    \ a document object, which is the root element representing the html document.\
    \ It comes with both properties and methods. The `document` object helps us add\
    \ content to the web pages. It is an object of the `window`, which means that\
    \ having `window.document` is the same as having `document`.\n\n## DOM Methods\n\
    \nDOM methods are the actions that you can perform on the html elements. The DOM\
    \ properties are the values of the HTML elements which one can set or change.\
    \ The following are the document object methods:\n\n1. `write(\"string\")` - it\
    \ writes a string to a document.\n2. `writeln(\"string\")` - it writes a string\
    \ to a document with a new line character.\n3. `getElementById()` - gives the\
    \ element with the specified `id`.\n4. `getElementsByName()` -gives all the elements\
    \ with the specified `name`.\n5. `getElementsByTagName()` -gives all the elements\
    \ with the specified tag name.\n6. `getElementsByClassName()` -gives all the elements\
    \ with the specified class name.\n\n## Accessing Field Values\nThe DOM is a good\
    \ way of getting the values of an input field. Many are the times you will need\
    \ to get input from a user. This can be done using the following property: `document.formname.name.value`\n\
    \nWhere:\n- `document` - is the html document representing our root element.\n\
    - `form_name` - is the name of the form with the fields.\n- `field_name` - is\
    \ the name of the input text.\n- `value` - is a property which returns the value\
    \ of input text.\n"
