    comes first followed by the value. That is why it was able to get the values of
    the properties we need to access.By creating an Object InstanceThis is done using
    the following syntax:var object_name= new Object ();Note that we have used the
    new keyword to create the object.The following example demonstrates how we can
    create an object directly:< script>   var stud= new Object ();  stud. admission=
    3380 ;   stud. name= "John Joel" ;   stud. age= 28 ;   document . write( stud.
    admission+ " " + stud. name+ " " + stud. age);  </ script>The code will print
    the following result:![](image4530.jpg)Using Object ConstructorThis involves creating
    a function with arguments. Every argument value can be assigned to the current
    object via this keyword which denotes the current object.Consider the following
    example:< script>   function stud( admission, name, age){  this . admission= admission;
      this . name= name;   this . age= age;   }   s= new stud( 3380 , "John Joel"
    , 28 );  document . write( s. admission+ " " + s. name+ " " + s. age);  </ script>
      The code returns the following upon execution:![](image4556.jpg)JavaScript allows
    us to define a method in an object. But before we can define the method, we should
    first define a property with the same name as the method.The following example
    shows how we can define a method in an object:< script>   function stud( admission,
    name, age){  this . admission= admission;   this . name= name;   this . age= age;
       this . updateAge= updateAge;   function updateAge( newAge){   this . age= newAge;
      }   }   s= new stud( 3380 , "John Joel" , 28 );    document . write( s. admission+
    " " + s. name+ " " + s. age + "<br>" );s. updateAge( 29 );   document . write(
    s. admission+ " " + s. name+ " " + s. age);     </ script>The code will return
    the following result after execution:![](image4592.jpg)We have defined the updateAge()
    method that helps us change the age of the student. In the example, the age of
    the student has been updated from 28 to 29 .PrototypeJavaScript language works
    based on prototypes, allowing the objects to acquire features and properties from
    each other. Here, every object has a prototype object.After the creation of a
    function in JavaScript, the prototype property gets added to that function automatically.
    The property is a prototype object holding the constructor property.Here is the
    syntax for the creation of a prototype object in JavaScript:ClassName. prototype
    . methodName  After creating an object, the functions that correspond to it are
    loaded into the memory. This means that a new copy of a function for every object.
    Thus, all functions are loaded into the memory at once.Prototype ChainingEach
    JavaScript object has a prototype object that acquires methods and properties
    from it. A prototype of an object may have a prototype object that can acquire
    methods and properties, and this continues. We can see this as prototype chaining
    .The following example demonstrates how we can add a new method to a constructor
    function:< script>function Student( firstName, lastName){  this . firstName= firstName;  this
    . lastName= lastName;}Student. prototype . fullName= function ()  {    return
    this . firstName+ " " + this . lastName;  }var student1= new Student( "John" ,
    "Joel" );var student2= new Student( "Mercy" , "George" );document . writeln( student1.
    fullName()+ "<br>" );document . writeln( student2. fullName());</ script>The code
    returns the following result:![](image4638.jpg)The fullName() function combines
    the firstName and the lastName to return the full name of the student.Let us create
    another example that demonstrates how to add a new property to a constructor function:<
    script>function Student( firstName, lastName){  this . firstName= firstName;  this
    . lastName= lastName;}Student. prototype . school= "ABC"var student1= new Student(
    "John" , "Joel" );var student2= new Student( "Mercy" , "George" );document . writeln(
    student1. firstName+ " " + student1. lastName+ " " + student1. school+ "<br>"
    );document . writeln( student2. firstName+ " " + student2. lastName+ " " + student2.
    school+ "<br>" );</ script>The code should return the following result:![](image4668.jpg)We
    have created a prototype for school and all students are inheriting it. That is
    why they belong to ABC school .Constructor MethodA constructor method is a special
    method in JavaScript used for initialization and creation of objects. It is called
    after the allocation of memory to an object.The constructor method is declared
    using the constructor keyword. A class can only have one constructor method. The
    parent class constructor can be used via the super keyword.The following example
    shows how to declare a constructor method:< script>class Student {  constructor
    () {    this . admission= 3380 ;    this . name = "John Joel" ;  }}var stud =
    new Student();document . writeln( stud. admission+ " " + stud. name);</ script>The
    code will return the following result after execution:![](image4699.jpg)Note that
    the constructor has a body denoted by curly braces {} . It is within the body
    of the constructor that we have created and initialized the various properties.As
    stated above, we can use the super keyword to call the constructor of the parent
    class.Static MethodJavaScript provides us with static methods which only belong
    to the class but not to the class instances. This means that we don’t need an
    instance to invoke a static method. We call these methods directly on the class.A
    static method is declared using the static keyword. The method can take any name.
    A JavaScript class is allowed to have more than one static method. In case more
    than one static method is declared using one name, then the last method will be
    invoked after a call. A static method can be called within another static method
    using this keyword. A static method can be used for the creation of utility functions.Here
    is an example of a static method:< script>class StaticTest{  static show()  {   
    return "Static method has been invoked"  }}document . writeln( StaticTest. show());</
    script>The code will print the following after execution:![](image4730.jpg)The
    show() method has been declared using the static keyword, which makes it a static
    method. Let us see how one can invoke more than one static method:< script>class
    StaticTest{ static show1()  {    return "Static method has been invoked"  } static
    show2()  {    return "Static method invoked again"  }}document . writeln( StaticTest.
    show1()+ "<br>" );document . writeln( StaticTest. show2());</ script>The code
    will return the following once executed:![](image4765.jpg)We have created two
    static methods, show1() and show()2 . We have then invoked them to get the result
    shown above.We can create more than one static method with the same name and invoke
    them. This is demonstrated below:class StaticTest{  static show()  {    return
    "Static method has been invoked"  }  static show()  {    return "Static method
    invoked again"  }}document . writeln( StaticTest. show());</ script>A static method
    can also be invoked within a constructor. This is demonstrated below:< script>class
    StaticTest {  constructor () {  document . writeln( StaticTest. show()+ "<br>"
    );  document . writeln( this . constructor . show());  }  static show() {      return
    "Static method has been invoked"  }}var st= new StaticTest();</ script>The code
    returns the following result:![](image4823.jpg)A static method can also be invoked
    from within a non-static method.For example:< script>class StaticTest {  static
    show() {      return "static method has been invoked"  }   show() {  document
    . writeln( StaticTest. show()+ "<br>" );  }   }var st= new StaticTest();st. show();</
    script>The code returns the following result:![](image4854.jpg)EncapsulationEncapsulation
    refers to the process of binding data together with the functions that act on
    that data. It is a good way of controlling data and validating it.To achieve this
    in JavaScript, you should make the data members private using the var keyword.
    Setter methods can be used for setting the data while getter methods can be used
    for getting the data.Consider the following example:class Student    {       constructor
    ()       {          var name;          var score;       }           getStudentName()
              {             return this . name;           }         setStudentName(
    name)         {           this . name= name;         }           getScore()         {
              return this . score;         }       setScore( score)       {         this
    . score= score;       }       }       var st= new Student();        st. setStudentName(
    "John" );        st. setScore( 78 );        document . writeln( st. getStudentName()+
    " " + st. getScore());   </ script>   The code will return the following result
    after execution:![](image4921.jpg)Let us see how we can validate the student’s
    score:< script>   class Student    {       constructor ()       {          var
    name;          var score;       }          getStudentName()           {             return
    this . name;           }         setStudentName( name)         {           this
    . name= name;         }             getScore()         {           return this
    . score;         }       setScore( score)       {           if ( score< 0 || score>
    100 )           {             alert ( "Invalid Score" );           }         else
              {             this . score= score;           }       }       }       var
    st= new Student();        st. setStudentName( "John" );        st. setScore( 105
    ); //alert() invokes       document . writeln( st. getStudentName()+ " " + st.
    getScore());   </ script>   The score has been validated in the setScore() method.
    If it is not between 0 and 100, it will be an invalid score. We have set the score
    to 105 . Execution of the code returns the following result:![](image5001.jpg)Let
    us modify the score and set it to 78 :< script>   class Student    {       constructor
    ()       {          var name;          var score;       }          getStudentName()
              {             return this . name;           }         setStudentName(
    name)         {           this . name= name;         }      getScore()         {
              return this . score;         }       setScore( score)       {           if
    ( score< 0 || score> 100 )           {             alert ( "Invalid Score" );
              }         else           {             this . score= score;           }
          }       }       var st= new Student();        st. setStudentName( "John"
    );        st. setScore( 78 ); //alert() invokes       document . writeln( st.
    getStudentName()+ " " + st. getScore());   </ script>The code returns the following
    result after execution:![](image5086.jpg)We can also implement encapsulation using
    a prototype-based approach as shown below:< script>   function Student( name,
    score)   {     var sname= name;     var s_score= score;     Object . defineProperty(
    this , "name" ,{       get: function ()       {         return sname;       },
        set: function ( sname)     {       this . sname= sname;     }   });        Object
    . defineProperty( this , "score" ,{       get: function ()       {         return
    s_score;       },     set: function ( s_score)     {       this . s_score= s_score;
        }   });   }     var st= new Student( "John" , 78 );     document . writeln(
    st. name+ " " + st. score);   </ script>   The code will print the following output:![](image5086.jpg)InheritanceWith
    this JavaScript feature, we can create new classes that are based on the already
    existing classes. It provides a child class with a way to use the methods and
    properties that belong to the parent class.In JavaScript, inheritance is done
    using the extends keyword. With this keyword, we create a child class that is
    based on the parent class. After that, the child class will be able to acquire
    the behavior and properties of the parent class.Inheritance maintains the IS-A
    relationship. Inheritance can also be achieved using a prototype-based approach.
    Consider the following example where Current inherits Date :< script>class Current
    extends Date {  constructor () {    super ();  }}var c= new Current();document
    . writeln( "Today is on:" )document . writeln( c. getDate()+ "-" +( c. getMonth()+
    1 )+ "-" + c. getFullYear());</ script>The code will return the output shown below:![](image5175.jpg)The
    code returns the date of today.Here is another example:< script>   class Current
    extends Date {    constructor ( year) {       super ( year);     }}   var c= new
    Current( "April 20, 1958 19:17:32" );  document . writeln( "The year is:" )  document
    . writeln( c. getFullYear());   </ script>   In the above example, we have created
    a date value and we have used the getFullyear() method to get the year only.The
    code returns the following after execution:![](image5205.jpg)This shows that the
    method was able to successfully extract only the year part of the provided date.Here
    is another example in which we are creating a sub-class to inherit from the parent
    class:< script>class Car{  constructor ()  {    this . manufacturer= "Toyota"
    ;  }}class Model extends Car {  constructor ( name, year) {   super ();    this
    . name= name;    this . year= year;  }}var m = new Model( "Harrier" , "2012" );document
    . writeln( m. manufacturer+ " " + m. name+ " " + m. year);</ script>The code returns
    the following result:![](image5247.jpg)Let us demonstrate how prototype-based
    inheritance can be done, where we don’t have to use the extends and class keywords:<
    script>    //A Constructor function  function Car( manufacturer)   {       this
    . manufacturer= manufacturer;    }    Car. prototype . getManufacturer= function
    ()   {     return this . manufacturer;   }   //Another constructor function //Second
    constructor function function Model( name, year) {   this . name= name;    this
    . year= year;     }    var car = new Car( "Toyota" );  model. prototype = car;
    //Now Bike treats as a parent of Vehicle. var model= new Model( "Harrier" , 2012
    );  document . writeln( model. getManufacturer()+ " " + model. name+ " " + model.
    year);  </ script>   PolymorphismThis is a key feature of an object-oriented programming
    paradigm that makes it possible for one to perform a single action in different
    ways. With polymorphism, we can invoke one method on various JavaScript objects.
    JavaScript isn’t a type-safe language; hence members of any data type can be passed
    with the methods. Consider the example given below:< script>class Parent  {     show()    {      document
    . writeln( "Parent class invoked" );    }  }class Child extends Parent  {  }var
    ch= new Child();ch. show();</ script>The code will return the following:![](image5325.jpg)Here
    is another example:< script>class Parent  {     show()    {      document . writeln(
    "Parent class invoked<br>" );    }  }class Child extends Parent  {    show()    {      document
    . writeln( "Child class invoked" );    }  }var p=[ new Parent(), new Child()]p.
    forEach( function ( message){message. show();});The show() method behaves differently
    based on the object for which it is invoked. The code prints the following output:![](image5370.jpg)We
    can implement the same example but this time via a prototype-based approach. This
    is demonstrated below:< script>function Parent(){}Parent. prototype . show= function
    (){  return "Parent class invoked" ;}function Child(){}Child. prototype = Object
    . create( Parent. prototype );var p=[ new Parent(), new Child()]p. forEach( function
    ( message){  document . writeln( message. show()+ "<br>" );});< script>Chapter
    15- MultimediaJavaScript has the plugin''s object which is a child of navigator
    object. It’s an array, and it comes with some single entry for a browser plugin.
    Browsers such as firefox and Netscape support the use of the navigator.plugins
    object.Consider the script given below:      < table border= "1" >             <
    tr>            < th> Name of PLugin</ th>            < th> Filename</ th>            <
    th> Description</ th>     </ tr>     < script language= "JavaScript" type= "text/javascript"
    >        for ( x= 0 ; x< navigator . plugins. length; x++) {        document .
    write( "<tr><td>" );        document . write( navigator . plugins[ x]. name);        document
    . write( "</td><td>" );        document . write( navigator . plugins[ x]. filename);        document
    . write( "</td><td>" );        document . write( navigator . plugins[ x]. description);        document
    . write( "</td></tr>" );            }         </ script>        </ table>Once
    executed, the script will show you a list of all plug-ins installed on your browser.
    Each plugin-in is represented as an entry in the array. Each entry has the following
    properties:'
