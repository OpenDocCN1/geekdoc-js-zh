    # 第 1 章- JavaScript 基础

    ## 什么是 JavaScript?

    HTML 是为了内容的，CSS 用于演示，而 JavaScript 是为了交互而开发的。最初，JavaScript 是为了为小型网页添加交互性（如动画和鼠标悬停），但现在它可以用于几乎所有领域，包括大型应用程序、游戏和服务器。


    ## 环境搭建

