    field. Many are the times you will need to get input from a user. This can be
    done using the following property:document . formname. name. valueWhere:


    *   document - is the html document representing our root element.


    *   form_name - is the name of the form with the fields.


    *   field_name - is the name of the input text.


    *   value - is a property which returns the value of input text.'
