    请注意，输出将取决于所使用的操作系统、浏览器以及其他细节。


    ### Screen（屏幕）对象


    这个 JavaScript 对象存储有关浏览器屏幕的信息。你可以使用它来显示屏幕细节，例如 `height`、`width`、`pixelDepth`、`colorDepth`
    等。它是 `window` 对象的属性，因此我们通过如下方式访问：`window.screen`


    我们也可以通过如下方式访问：`screen`


    该对象具有许多属性，包括以下：


    - `width` - 返回浏览器屏幕的宽度

    - `height` - 返回浏览器屏幕的高度

    - `availWidth` - 打印可用宽度

    - `availHeight` - 打印可用高度

    - `colorDepth` - 返回颜色深度

    - `pixelDepth` - 返回像素深度


