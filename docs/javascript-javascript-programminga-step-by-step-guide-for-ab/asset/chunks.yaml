  trans: "\n以下示例展示了如何使用此对象：\n\n```html\n<script>\n  document.writeln(\"<br/>screen.height:\
    \ \" + screen.height);\n  document.writeln(\"<br/>screen.width: \" + screen.width);\n\
    \  document.writeln(\"<br/>screen.availHeight: \" + screen.availHeight);\n  document.writeln(\"\
    <br/>screen.availWidth: \" + screen.availWidth);\n  document.writeln(\"<br/>screen.pixelDepth:\
    \ \" + screen.pixelDepth);\n  document.writeln(\"<br/>screen.colorDepth: \" +\
    \ screen.colorDepth);\n</script>\n```\n代码执行后返回以下内容：![](img/image3899.jpg)\n\n\
    ## 页面打印\n\n有时，你可能需要将特定网页的内容发送到打印机进行打印。可以通过添加一个按钮来实现，用户必须点击该按钮才能打印。这可以使用 `window`\
    \ 对象的 `print` 方法。当调用 `window.print()` 函数时，当前页面将被打印。可以使用 `onClick()` 事件调用该函数。\n\
    \n示例：\n```html\n<html>\n  <body>\n    <form>\n      <input type=\"button\" value=\"\
    Print Page\" onclick=\"window.print()\" />\n    </form>\n  </body>\n</html>\n\
    ```\n执行脚本后，你将看到以下按钮：![](img/image3924.jpg)点击“Print Page”按钮。页面将发送到打印机打印。系统会要求你指定各种打印选项。\n\
    \n## 第 13 章- JavaScript Cookies\n\nCookies 指存储在计算机文本文件中的数据。在浏览过程中，网页会被发送到用户的浏览器，而\
    \ Web 服务器会遗忘此操作。Cookies 有助于于记住有关用户的信息。一旦用户访问了网页，cookie 就可以帮助存储其姓名。当用户下下次访问该页面时，系统将记住他。它们以如下所示的键值对形式保存：\n\
    \n`username = John Joel`\n\n一旦用户的浏览器向服务器请求页面，页面的 cookies 就会被添加到请求中。然后，服务器将获得记住用户所需的所有信息。\n\
    \n### 创建 Cookies\n\nJavaScript 的 `document.cookie` 可用于创建、删除和读取 cookie。\n\n示例：\n\
    ```javascript\ndocument.cookie = \"username=John joel\";\n```\n还可以以 UTC 格式为 cookie\
    \ 添加过期日期。关闭浏览器后，cookie 将被删除。\n\n示例：\n```javascript\ndocument.cookie = \"username=John\
    \ Joel; expires=Fri, 22 Feb 2019 12:00:00 UTC\";\n```\n这就是你如何指定 cookie 的过期日期。还可以指定\
    \ cookie 的路径。\n\n示例：\n```javascript\ndocument.cookie = \"username=John Joel; expires=Fri,\
    \ 22 Feb 2019 12:00:00 UTC; path=/\";\n```\n以下脚本演示了这一点：\n\n```html\n<<html>\n\
    \  <head>\n    <script type=\"text/javascript\">\n      function CreateCookie()\
    \ {\n        if (document.form1.field.value == \"\") {\n          alert(\"Type\
    \ a value\");\n          return;\n        }\n        value = escape(document.form1.field.value)\
    \ + \";\";\n        document.cookie = \"name=\" + value;\n        document.write(\"\
    Creating Cookies: \" + \"name=\" + value);\n      }\n    </script>\n  </head>\n\
    \  <body>\n    <form name=\"form1\" action=\"\">\n      Name: <input type=\"text\"\
    \ name=\"field\" />\n      <input type=\"button\" value=\"Create Cookie\" onclick=\"\
    CreateCookie();\" />\n    </form>\n  </body>\n</html>\n```\n代码执行后将返回以下表单：![](img/image4003.jpg)在字段中输入名称，然后点击“Create\
    \ Cookie”按钮。你应该看到以下内容：![](img/image4008.jpg)cookie 将被创建。随后你将在计算机上拥有一个你输入的名称的 cookie。如果你需要一次创建许多\
    \ cookie，请使用逗号将它们分隔。\n\n### 读取 Cookies\n\n可以使用 `document.cookie` 对象读取 cookies。cookie\
    \ 的名称会被传递给该对象。当你需要访问 cookie 时，可以随时使用该字符串。`document.cookie` 字符串以 `name=value` 键值对的形式存储\
    \ cookies，并用分号分隔。name 代表 cookie 的名称，而 value 表示字符串值。通过 `split()` 函数，人们可以拆分字符串以获取键和值。\n\
    \n示例：\n```javascript\n<script type=\"text/javascript\">\n  function ReadCookies()\
    \ {\n    var cookies = document.cookie;\n    document.write(\"Cookies include:\
    \ \" + cookies);\n    myArray = cookies.split(';');\n    for (var x=0; x< myArray.length;\
    \ x++) {\n      name = myArray[x].split('=')[0];\n      value = myArray[x].split('=')[1];\n\
    \      document.write(\"The Key is : \" + name + \" and Value is : \" + value);\n\
    \    }\n  }\n</script>\n</head>\n<body>\n  <form name=\"form1\" action=\"\">\n\
    \    <p>点击按钮查看结果：</p>\n    <input type=\"button\" value=\"Read Cookie\" onclick=\"\
    ReadCookies()\" />\n  </form>\n</body>\n```\n执行脚本后，你将看到以下界面：![](img/image4056.jpg)点击“Read\
    \ Cookie”按钮。所有的 cookies 将显示在输出中![](img/image4061.jpg)在这种情况下长度提供了数组长度。\n\n### 删除\
    \ Cookies\n\n有时，你可能不需要读取 cookie。这需要你删除它。删除数组涉及为其分配一个过去的当前日期的过期日期。\n\n示例：\n```javascript\n\
    <script type=\"text/javascript\">\n  function CreateCookie() {\n    var time =\
    \ new Date();\n    time.setMonth(time.getMonth() - 1);\n    value = escape(document.form1.field.value)\
    \ + \";\";\n    document.cookie = \"name=\" + value;\n    document.cookie = \"\
    expires=\" + time.toUTCString() + \";\";\n    document.write(\"Set the Cookies\
    \ : \" + \"name=\" + value);\n  }\n</script>\n</head>\n<body>\n  <form name=\"\
    form1\" action=\"\">\n    Enter name: <input type=\"text\" name=\"field\" />\n\
    \    <input type=\"button\" value=\"Create Cookie\" onclick=\"CreateCookie()\"\
    \ />\n  </form>\n</body>\n```\n在示例中，我们通过将过期日期设置为一个月之前来删除了 cookie。该逻辑通过代码中的以下行实现：\n\
    `time.setMonth(time.getMonth() - 1);`\n\n## 第 14 章 面 面对象编程\n\nJavaScript 支持面向对象的概念。让我们讨论一下它们：\n\
    \n### 类\n\nJavaScript 类是特殊的 JavaScript 函数。类可以像函数和函数表达式一样被定义。JavaScript 类有许多成员，包括方法或构造函数。JavaScript\
    \ 类在严格模式下执行。因此，任何带有静默错误或的代码都会抛出错误。类语法由两个部分组成：\n\n*   类声明\n\n*   类表达式\n"
- fmt: "\n# Class Declarations\n\nTo declare a class, we use a class declaration.\
    \ This is done using the `class` keyword followed by the class name. the JavaScript\
    \ naming conventions require that the name of a class should begin with an uppercase\
    \ letter. Here is an example of a class declaration in JavaScript:\n\n```javascript\n\
    // Declare a class\nclass Student {\n  // Initialize an object\n  constructor\
    \ (admission, name) {\n    this.admission = admission;\n    this.name = name;\n\
    \  }\n  // Declare a method\n  detail() {\n    document.writeln(this.admission\
    \ + \" \" + this.name + \"<br>\")\n  }\n}\n// pass an object to the variable\n\
    var student1 = new Student(3380, \"John Joel\");\nvar student2 = new Student(102,\
    \ \"Mercy George\");\nstudent1.detail(); //call a method\nstudent2.detail();\n\
    ```\n\nThe code returns the following upon execution: ![](image4178.jpg)\n\nWe\
    \ have created a class named `Student`. We have then initialized a constructor\
    \ with two arguments, `admission` and `name`. We have then created a method named\
    \ `detail()` which should return the details of the student, including the admission\
    \ and the name.\n\nConsider the following two lines extracted from the code:\n\
    ```javascript\nvar student1 = new Student(3380, \"John Joel\");\nvar student2\
    \ = new Student(102, \"Mercy George\");\n```\n\nWhat we are doing is known as\
    \ instantiation. We are simply creating an instance/object of type `Student`.\
    \ This means that `student1` is an instance of `Student`, hence he can access\
    \ all the properties defined within the `Student` class. This also applies to\
    \ `student2`. The details of each student have been passed as arguments. We have\
    \ lastly invoked the `detail()` method to return the details of each student.\n\
    \nUnlike the declaration of a function, the declaration of a class is not part\
    \ of the JavaScript hoisting. This means that you are expected to declare a class\
    \ before you can invoke it. This is demonstrated in the following example:\n\n\
    ```javascript\n// Here, we invoke the class before we declare it.\nvar student1\
    \ = new Student(3380, \"John Joel\");\nvar student2 = new Student(102, \"Mercy\
    \ George\");\nstudent1.detail(); //call a method\nstudent2.detail();\n// Declare\
    \ the class\nclass Student {\n  // Initialize an object\n  constructor (admission,\
    \ name) {\n    this.admission = admission;\n    this.name = name;\n  }\n  // Declare\
    \ a method\n  detail() {\n    document.writeln(this.admission + \" \" + this.name\
    \ + \"<br>\")\n  }\n}\n```\n\nThe above code cannot work as we have tried to access\
    \ a class before declaring it. A class can only be declared once. If you try to\
    \ declare it more than once, it will return an error. Here is an example:\n\n\
    ```html\n<html>\n<body>\n  <script>\n// Declare a class\nclass Student {\n  //\
    \ Initialize an object\n  constructor (admission, name) {\n    this.admission\
    \ = admission;\n    this.name = name;\n  }\n  // Declare a method\n  detail()\
    \ {\n    document.writeln(this.admission + \" \" + this.name + \"<br>\")\n  }\n\
    }\n// pass an object to the variable\nvar student1 = new Student(3380, \"John\
    \ Joel\");\nvar student2 = new Student(102, \"Mercy George\");\nstudent1.detail();\
    \ //call a method\nstudent2.detail();\n// Re-declaring class\nclass Student {\n\
    }\n  </script>\n</body>\n</html>\n```\n\nThe above code will also not run as we\
    \ have declared the class `Student` twice.\n\n## Class expressions\n\nA class\
    \ can also be defined using a class expression. In such a case, the class name\
    \ is not mandatory. This means that you can have a named or unnamed class expression.\
    \ The class expression will allow you to fetch the name of the class. However,\
    \ a class declaration doesn’t allow this. Here is an example of unnamed class\
    \ expression:\n\n```javascript\nvar stud = class {\n  constructor (admission,\
    \ name) {\n    this.admission = admission;\n    this.name = name;\n  }\n};\ndocument.writeln(stud.name);\n\
    ```\n\nUpon execution, the code will return the following: ![](image4331.jpg)\n\
    \nThe class has been assigned to a variable rather than being given a name. With\
    \ a class expression, it is possible for us to re-declare a class.\n\n```javascript\n\
    // Declare a class\nvar stud = class {\n  // Initialize an object\n  constructor\
    \ (admission, name) {\n    this.admission = admission;\n    this.name = name;\n\
    \  }\n  // Declare a method\n  detail() {\n    document.writeln(this.admission\
    \ + \" \" + this.name + \"<br>\")\n  }\n}\n// pass an object to the variable\n\
    var student1 = new stud(3380, \"John Joel\");\nvar student2 = new stud(102, \"\
    Mercy George\");\nstudent1.detail(); //call a method\nstudent2.detail(); //Re-declare\
    \ class\n```\n\nThe code will return successfully to return the following: ![](image4422.jpg)\n\
    \nA class expression can be named. In such a case, the scope of the class name\
    \ depends on the body of the class. To retrieve the class name, we use the property\
    \ `class.name`. Consider the following example:\n\n```javascript\nvar stud = class\
    \ Student {\n  constructor (admission, name) {\n    this.admission = admission;\n\
    \    this.name = name;\n  }\n};\ndocument.writeln(stud.name);\n```\n\nThe code\
    \ runs successfully to return the following: ![](image4447.jpg)\n\nLet us now\
    \ try to write the code as follows:\n\n```javascript\nvar stud = class Student\
    \ {\n  constructor (admission, name) {\n    this.admission = admission;\n    this.name\
    \ = name;\n  }\n};\ndocument.writeln(Student.name);\n```\n\nThe code will generate\
    \ an error.\n\n## Objects\n\nAn object in JavaScript is an entity with both state\
    \ and behavior, that is, properties and methods. An example of an object is a\
    \ chair, a mouse, a keyboard, pen, etc. JavaScript works based on objects. It\
    \ treats everything as an object. It is template based rather than being class\
    \ based. Classes are not created to get objects, but we can directly create objects.\
    \ JavaScript provides us with three ways through which we can create objects.\
    \ These include the following:\n\n1.  Using object literal\n\n2.  Creating an\
    \ instance of the `Object` directly (via the `new` keyword)\n\n3.  Using an object\
    \ constructor (via the `new` keyword)\n"
