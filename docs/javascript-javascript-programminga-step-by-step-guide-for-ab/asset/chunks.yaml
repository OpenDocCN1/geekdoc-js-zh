    1. The variable name should begin with an underscore `_`, a letter (either `A`
    to `Z` or `a` to `z`), or the dollar sign `$`.

    2. After the first letter, one can use digits in the variable name.

    3. JavaScript variable names are case sensitive, example, `p` is different from
    `P`.


    The following example demonstrates how to use variables in JavaScript:

    ```javascript

    <script>

    var a = 12 ; var b = 11 ; var c= a + b; document .write( c);

    </script>

    ```

    The code will return the sum of the two variable values, which is `23`.


    ### Local Variables

    These are variables that are defined within a block or a function. It can only
    be accessed from within the block or function within which it has been defined.


    Here is an example:

    ```javascript

    <script>

    function xyz(){

    var a= 12 ; // a local variable

    }

    </script>

    ```

    The variable `a` can only be accessed from within the function `xyz()`.


    Here is another example of local variable declaration:

    ```javascript

    <script>

    If( 5 < 10 ){

    var a = 12 ; //a JavaScript local variable

    }

    </script>

    ```

    The variable `a` in the above example can only be accessed from within the block
    of its declaration.


    ### Global Variables

    These are variables that can be accessed from any function. A global variable
    is usually declared outside a function or with the JavaScript’s `window` object.


    For example:

    ```javascript

    <script>

    var val= 12 ; //a global variable

    function x(){

    document .writeln( val);}

    }

    function y(){

    document .writeln( val);

    }

    x(); //calling a JavaScript function

    y(); //calling a JavaScript function

    </script>

    ```

    The code will return the following: ![](image656.jpg)

    The code demonstrates that the function can be referenced from different functions
    and its value will remain the same.


    If you need to declare a global variable within a function, you must use the `window`
    object. For example: `window . val= 12 ;`. Such a variable can be declared within
    any function and accessed from any function.


    For example:

    ```javascript

    <script>

    function xy(){

    window . val= 12 ; //declaring a global variable using window object

    }

    function xz(){

    alert ( window . val); //accessing a global variable from another function

    }

    xy();

    xz();

    </script>

    ```

    We have declared the variable `val` within the function `xy()` and assigned it
    a value of `12`. We have then accessed the same variable from the function `xz()`.
    This returns a value of `12`.


    After declaring a variable outside a function, it is internally added to the `window`
    object. The object can at the same time be accessed via the `window` object.


    Here is an example:

    ```javascript

    <script>

    var val = 12 ;

    function xy(){

    alert ( window . val); //accessing a global variable

    }

    </script>

    ```


    Each programming language supports a number of data types. They represent the
    types of values which can be represented then manipulated in the programming language.
    JavaScript supports 3 primitive data types including:


    1. Numbers such as `1`, `8`, `90`, `345` etc.

    2. Strings, which are texts, for example, “My name” etc.

    3. Boolean, which can be `true` or `false`?


    JavaScript is also capable of supporting 2 trivial data types, namely `null` and
    `undefined`. It also has a composite data type called `object`. Note that in JavaScript,
    there is no difference between integers and floats. In JavaScript, all numbers
    are represented in the form of floating-point values.


    ### Comparing variables

    In JavaScript, variables can be compared in different ways. We can compare whether
    two variables are equal or not by use of double equals sign.


    Example:

    ```javascript

    <script>

    x= 30 ;y= 30 ;

    if ( x== y) {alert ( "x equals y" )};

    </script>

    ```

    When executed, the script will show a pop up with the text “x equals y” as shown
    below:![](image736.jpg)

    This is the values of the two values are equal, that is, `10`. If not, nothing
    will happen once the script is executed.


    Other than numbers, we can also compare strings as shown below:

    ```javascript

    <script>

    firstname= "Nicholas" ;lastname= "Samuel" ;

    if ( lastname== "Samuel" ) { alert ( "Correct name!" )};

    </script>

    ```

    The comparison will evaluate to a `true`, so you will get a popup with the text
    “Correct name!” as shown below:![](image754.jpg)


    Note that when doing a comparison, we use double equals sign (`==`). If you instead
    use a single equal’ sign, the value on the right side of the sign will become
    the value of value (variable) on left side. An example is given below:

    ```javascript

    if ( lastname= "Samuel" ) { alert ( "Correct name!" )};

    ```


    # Chapter 4- JavaScript Operators

    JavaScript supports the use of operators. An operator performs an operation on
    one or many operands to produce a result. For example: `2 + 3`

    In the above example, `2` and `3` are the operands while `+` is the operator.
    `2` is the left operand while `3` is the right operand.


    ### Logical Operators

    These types of operators help us connecting one or more conditions. The following
    are supported in JavaScript:


    * `&&` - the AND operator. It checks whether the operands are non-zero. If yes,
    it returns `1`, otherwise `0`.

    * `||` - the OR operator. It checks whether any of the operands is non-zero. If
    yes, it returns `1`, otherwise `0`.

    * `!` - the NOT operator. For reversing the Boolean result.


    For example:

    ```html

    <html><body>

    <p id="pg1"></p>

    <p id="pg2"></p>

    <p id="pg3"></p>

    <p id="pg4"></p>

    <p id="pg5"></p>

    <script>

    var x = 12 ; y = 5 ;

    document . getById( "pg1" ).innerHTML = ( x != y) && ( x < y);

    document . getById( "pg2" ).innerHTML = ( x > y) || ( x == y);

    document . getById( "pg3" ).innerHTML = ( x < y) || ( x == y);

    document . getById( "pg4" ).innerHTML = !( x < y);

    document . getById( "pg5" ).innerHTML = !( x > y);

    </script>

    </body></html>

    ```

    The code prints the following result:![](image815.jpg)


    ### Arithmetic Operators

    In JavaScript, you can perform arithmetic operations on your variables. These
    operations include addition (`+`), subtraction (`-`), multiplication (`*`), modulus
    (`%`), increment (`++`), decrement (`--`) etc.


    Example:

    ```javascript

    <script type="text/javascript" >

    a= 1 ;a= 1 ; a++; //a=2

    a= 1 ; a--; //a=0

    a= 1 ; b= 2 ; c= a+ b; //c=3

    a= 1 ; d= a+ 4 ; //d=5

    First= "Edwin" ;Last= "Peter" ;Name= First+ " " + Last; //Name=Edwin Peter

    a= 3 * 7 ; //a=21

    b= 10 / 2 ; //b=5

    c=( 10 / 2 )* 2 ; //c=10

    d= 10 /(1 * 2 ); //d=5

    </script>

    ```

    The results from the various lines have been shown in the comment section, that
    is, after `//`.


    ### Assignment Operators

    These are operators that help us assign values to variables. They include the
    following:


    * `=` - to assign the right value to the left operand.

    * `+=` - to sum up the left and right operand values then assign the obtained
    result to left operand.

    * `-=` - to subtract the right operand value from the left operand value then
    assign the obtained result to left operand.

    * `*=` - to multiply the left and right operand values then assign the obtained
    result to left operand.

    * `/=` - to divide the left operand value by the right operand value then assign
    the obtained result to left operand.

    * `%=` - to get the modulus of the left operand divided by the right operand then
    assign the resulting modulus to left operand.

