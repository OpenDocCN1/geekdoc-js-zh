  trans: "\n\n# 数组字面量创建\n\n使用数组字面量（Array Literal）创建数组采用以下语法：`var name_of_array=[ val1,\
    \ val2..... valN];`。这些值被添加在方括号 `[]` 中，并用逗号分隔。\n\n示例：\n```html\n<script type=\"\
    text/javascript\">\n  var array1=[ \"Nicholas\" , \"Samuel\" , \"Vickie\" ];\n\
    \  for ( j= 0 ; j< array1. length; j++){\n    document . write( array1[ j] + \"\
    <br/\" );\n  }\n</script>\n```\n我们创建了一个包含三个值的数组 `array1`，这些值是个人的姓名。使用了一个 `for`\
    \ 循环来遍历数组的值，然后将它们打印出来。`.length` 属性通常返回数组的长度。执行后，数组中的值将按所示所示打印：\n![](img/image1821.jpg)\n\
    \n## 直接创建数组\n\n可以通过下面的语法直接创建数组：`var name_of_array= new Array ();`。通过 `new` 关键字，会创建一个数组的实例。\n\
    \n示例：\n```html\n<script type=\"text/javascript\">\n  var x;\n  var array2 = new\
    \ Array ();\n  array2[ 0 ] = \"Nicholas\" ;\n  array2[ 1 ] = \"Samuel\" ;\n  array2[\
    \ 2 ] = \"Vickie\" ;\n  for ( x= 0 ; x< array2. length; x++){\n    document .\
    \ write( array2[ x ] + \"<br>\" );\n  }\n</script>\n```\n在示例中，我们使用 `new` 关键字创建了名为\
    \ `array2` 的数组。下一步是向数组填充元素。注意，数组元素的位置是通过索引表示的。数组中的第一个元素位于索引 `0`，第二个元素位于索引 `1`，以此类推。\n\
    \n考虑以下行行：`array2[ 1 ] = \"Samuel\" ;`。该行表示我们现在名为 `array2` 的数组的索引 `1` 处存储元素“Samuel”。随后，我们使用了变量\
    \ `x` 来遍历数组的这些元素并打印它们。\n\n## 数组构造函数\n\n我们通过直接在构造函数中传递参数，而不是显式地提供值，来创建一个数组的实例。下面的脚本演示了这一点：\n\
    ```html\n<script type=\"text/javascript\">\n  var array3= new Array ( \"Nicholas\"\
    \ , \"Samuel\" , \"Vickie\" );\n  for ( x= 0 ; x< array3. length; x++){\n    document\
    \ . write( array3[ x ] + \"<br>\" );\n  }\n</script>\n```\n在上面的示例中，我们创建了一个名为 `array3`\
    \ 的数组。数组的创建和元素的添加是在同一行中通过构造函数完成的。`for` 循环帮助我们遍历数组元素并将它们打印到屏幕上。\n\n## 数组方法\n\n\
    JavaScript 内置了许多数组方法，我们可以用它们来操纵数组元素。让我们讨论这些方法：\n\n### concat()\n`concat()` 方法合并数组以返回单个字符串。数组可以是两个或多个。注意，初始数组的元素不会改变。该方法采用以下语法：`array.\
    \ concat( array1, array2,...., array_n)`，方法的参数是您需要合并的数组。该方法返回一个由所有数组组合的新对象。\n\n\
    考虑以下示例：\n```html\n<script>\nvar array1=[ \"Nicholas\" , \"James\" , \"Jane\" ];\n\
    var array2=[ \"Alex\" , \"Fidel\" , \"Alice\" ];\nvar output= array1. concat(\
    \ array2);\ndocument . writeln( output);\n</script>\n```\n我们创建了两个数组 `array1` 和\
    \ `array2`。每个数组都有一个姓名列表。我们将这两个数组合并成一个名为 `output` 的对象。代码将打印以下输出：\n![](img/image1897.jpg)\n\
    \n在上面的示例中，我们合并了两个数组。三个数组的合并可以如下所示：\n```html\n<script>\nvar array1=[ \"Nicholas\"\
    \ , \"James\" , \"Jane\" ];\nvar array2=[ \"Alex\" , \"Fidel\" , \"Alice\" ];\n\
    var array3=[ \"Joel\" , \"Mercy\" , \"George\" ];\nvar output= array1. concat(\
    \ array2, array3);\ndocument . writeln( output);\n</script>\n```\n代码将返回以下结果：\n\
    ![](img/image1918.jpg)\n\n除了创建不同的数组并尝试合并对象外，我们也可以直接合并对象。下面的示例演示了这一点：\n```html\n\
    <script>\nvar array1=[ \"Nicholas\" , \"James\" , \"Jane\" ];\nvar output= array1.\
    \ concat( \"Alex\" , \"Fidel\" , \"Alice\" );\ndocument . writeln( output);\n\
    </script>\n```\n代码将返回以下示例：\n![](img/image1934.jpg)\n\n### copyWithin()\n当使用此方法时，它会复制给定数组的一部分到自身的元素位置并返回修改后的数组。注意，修改后的数组长度不会改变。该方法采用下面的语法：`array.\
    \ copyWithin( target, start, end)`。`target` 是复制元素所在的位置。`start` 参数是可选的。它表示方法从哪个索引开始复制元素。它的默认值为\
    \ `0`，意味着从数组的第一个元素处开始复制。`end` 参数也是可选的。它表示方法停止复制的索引。它的默认值为 `array.length-1`，即数组的最后一个元素。\n\
    \n考虑下面的代码：\n```html\n<script>\nvar array1=[ \"Nicholas\" , \"James\" , \"Jane\"\
    \ ];\n// 在索引 0 处放置第 1 到第 3 个元素\nvar output= array1. copyWithin( 0 , 1 , 2 );\n\
    document . writeln( output);\n</script>\n```\n代码返回：\n![](img/image964.jpg)\n发生的情况是第\
    \ 1 到第 3 个元素复制到了索引 `0`。因此元素 `Nicholas` 被元素 `James` 替换。数组的其余元素不受影响。\n\n让我们看看如何只提供目标和起始索引：\n\
    ```html\n<script>\nvar array1=[ \"Nicholas\" , \"James\" , \"Jane\" ];\nvar output=\
    \ array1. copyWithin( 1 , 2 );\ndocument . writeln( output);\n</script>\n```\n\
    代码应该返回：\n![](img/image981.jpg)\n\n我们还可以只提供目标索引：\n```html\n<script>\nvar array1=[\
    \ \"Nicholas\" , \"James\" , \"Jane\" ];\nvar output= array1. copyWithin( 2 );\n\
    document . writeln( output);\n</script>\n```\n代码将返回：\n![](img/image2002.jpg)\n\
    \n### fill()\n此方法用于用静态值填充数组元素。使用时，原始数组会被修改。如果没有任何元素符合条件，此方法将返回 `undefined`。它采用以下语法：`array.\
    \ fill( value[, start[, end]])`。`value` 是要填充的值。`start` 参数是可选的。它是填充开始的索引。它的默认值为\
    \ `0`，即数组的第一个元素。`end` 参数也是可选的。它是填充停止的索引。\n\n考虑下面的示例：\n```html\n<script>\nvar array1=[\
    \ \"Nicholas\" , \"James\" , \"Jane\" , \"Alice\" ];\nvar output= array1. fill(\
    \ \"Joel\" );\ndocument . writeln( array1);\n</script>\n```\n代码将返回：\n![](img/image2028.jpg)\n\
    所有数组都被都被 `Joel`。让我们看看如何提供起始索引：\n```html\n<script>\nvar array1=[ \"Nicholas\" ,\
    \ \"James\" , \"Jane\" , \"Alice\" ];\nvar output= array1. fill( \"Joel\" , 2\
    \ );\ndocument . writeln( array1);\n</script>\n```\n在上面的示例中，填充将从索引 `2` 之后的元素开始。代码应该返回以下结果：\n\
    ![](img/image2044.jpg)\n\n下面的示例演示了如何指定起始和停止索引：\n```html\n<script>\nvar array1=[\
    \ \"Nicholas\" , \"James\" , \"Jane\" , \"Alice\" ];\nvar output= array1. fill(\
    \ \"Joel\" , 1 , 3 );\ndocument . writeln( array1);\n</script>\n```\n代码应该返回：\n\
    ![](img/image2059.jpg)\n\n### every()\n此方法的目的是检查是否所有数组元素满足给定条件。如果所有数组元素都符合条件，方法将返回\
    \ `true`，否则返回 `false`。该方法采用下面的语法：`array. every( callback( current-value, index,\
    \ arr), thisArg)`。`callback` 是测试条件的函数。`current-value` 表示数组的当前元素。`index` 参数是可选的，表示当前元素的索引。`arr`\
    \ 参数表示应用 `every()` 函数的数组。`thisArg` 是可选参数。它是执行回调期间作为 `this` 使用的值。该方法返回一个布尔值。\n\n\
    考虑下面的示例：\n```html\n<script>\nvar marks=[ 20 , 25 , 15 , 37 , 27 ];\nfunction confirm\
    \ ( x){\n  return x> 10 ;\n  // 因为所有 marks 都大于 10 所以返回 true\n}\ndocument . writeln(\
    \ marks. every( confirm ));\n</script>\n```\n代码返回 `true`。我们定义了一个包含一组整数值的数组，即 `marks`。所有的\
    \ marks 都大于 10。`confirm()` 的目的是检查是否所有 marks 都大于 10。由于这是真的，`every()` 函数返回了 `true`。让我们把其中一个值改为小于\
    \ 10 的值，看看会发生什么：\n```html\n<script>\nvar marks= [ 20 , 5 , 15 , 37 , 27 ];\nfunction\
    \ confirm ( x){\n  return x> 10 ;\n  // 因为所有 marks 都大于 10 所以返回 true\n}\ndocument\
    \ . writeln( marks. every( confirm ));\n</script>\n```\n代码将返回 `false`，因为索引 `1`\
    \ 处的 marks 小于 10，即 `5`。\n\n下面的示例演示了如何检查数组中元素的数量：\n```html\n<script>\nvar array1=[\
    \ \"Nicholas\" , \"James\" , \"Jane\" , \"Alice\" ];\nfunction confirm ( item,\
    \ index, array) {\n  return index < 3 ;\n}\ndocument . writeln( array1. every(\
    \ confirm ));\n</script>\n```\n代码返回：\n![](img/image964.jpg)\n发生的情况是第 1 到第 3 个元素复制到了索引\
    \ `0`。因此元素 `Nicholas` 被元素 `James` 替换。数组的其余元素不受影响。让我们看看如何只提供目标和起始索引：\n```html\n\
    <script>\nvar array1=[ \"Nicholas\" , \"James\" , \"Jane\" , \"Alice\" ];\nvar\
    \ output= array1. copyWithin( 1 , 2 );\ndocument . writeln( output);\n</script>\n\
    ```\n代码应该返回：\n![](img/image981.jpg)\n\n我们还可以只提供目标索引：\n```html\n<script>\nvar array1=[\
    \ \"Nicholas\" , \"James\" , \"Jane\" , \"Alice\" ];\nvar output= array1. copyWithin(\
    \ 2 );\ndocument . writeln( output);\n</script>\n```\n代码将返回：\n![](img/image2002.jpg)\n\
    \n### find()\n此方法将返回数组中符合指定条件的第一个元素。它采用下面的语法：`array. find( callback( value, index,\
    \ arr), thisArg)`。`callback` 是执行的函数。`value` 是数组的当前元素。`index` 参数是可选的，表示当前元素的索引。`arr`\
    \ 参数表示应用 `find()` 函数的数组。`thisArg` 是可选参数。它是执行回调期间作为 `this` 使用的值。该方法返回 `undefined`。\n\
    \n下面的示例演示了如何使用 `find()` 方法：\n```html\n<script>\nvar array1=[ 20 , 45 , 14 , 33\
    \ ];\nvar output= array1. find( x=> x>20 );\ndocument . writeln( output)\n</script>\n\
    ```\n在上面的代码中，我们正在检查大于 `20` 的元素。方法将找到 `45`，因此应该是输出。下面的示例演示了如何使用相同方法来查找质数：\n```html\n\
    <script>\nfunction checkPrime( item, index, arr) {\n  var start = 2 ;\n  while\
    \ ( start <= Math.sqrt(item)) {\n    if ( item % start++ < 1 ) {\n      return\
    \ false ;\n    }\n  }\n  return item > 1 ;\n}\ndocument . writeln([ 4 , 6 , 11\
    \ , 26 ].find(checkPrime));\n</script>\n```\n函数将找到 `11` 作为质数。\n\n### forEach()\n\
    此方法帮助我们为数组的每个元素调用一次函数。它采用下面的语法：`array. forEach( callback( current-value, index,\
    \ arr), thisArg)`。`callback` 是测试条件的函数。`current-value` 表示数组的当前元素。`index` 参数是可选的，表示当前元素的索引。`arr`\
    \ 参数表示应用 `forEach()` 函数的数组。`thisArg` 是可选参数。它是执行回调期间作为 `this` 使用的值。该方法返回 `undefined`。\n\
    \n例如：\n```html\n<script>\nvar array1 = ['Java' , 'C#' , 'Python' ];\narray1. forEach(\
    \ function ( values) {\n  document . writeln( values);\n});\n</script>\n```\n\
    我们使用了 `forEach()` 方法来访问并打印数组元素。代码打印如下：\n![](img/image192.jpg)\n我们也可以使用相同的函数创建一个斐波那契序列：\n\
    ```html\n<script>\nvar addition = 0 ;\nvar array1 = [ 2 , 8 , 14 , 24 ];\narray1.\
    \ forEach( function fib( item) {\n  addition = addition + item;\n  document .\
    \ writeln( addition);\n});\n</script>\n```\n代码返回元素的斐波那契序列。注意斐波那契是元素的顺序相加。这是输出：![](img/image214.jpg)\n\
    \n### pop()\n此方法从数组中删除最后一个元素并返回该元素。它具有改变长度的作用。它有下面的语法：`array. pop()`。它返回指定数组的最后一个元素。\n\
    \n考虑下面的示例：\n```html\n<script>\nvar array1=[ \"Java\" , \"C#\" , \"Python\" ];\n\
    document . writeln( \"Initial array: \" + array1+ \"<br>\" );\ndocument . writeln(\
    \ \"Popped out item: \" + array1.pop()+\"<br>\" );\ndocument . writeln( \"Final\
    \ array: \" + array1);\n</script>\n```\n代码将返回以下：![](img/image241.jpg)\n我们可以使用\
    \ `for` 循环弹出所有数组元素：\n```html\n<script>\nvar array1=[ \"Java\" , \"C#\" , \"Python\"\
    \ ];\nvar len= array1. length;\nfor ( var i= 1 ; i<= len; i++)\n{\n  document\
    \ . writeln( \"Popped out element: \" + array1.pop()+\"<br>\" );\n}\n</script>\n\
    ```\n代码将打印如下：![](img/image263.jpg)\n\n### reverse()\n此方法的影响改变数组元素排序的方式，并按反序返回元素。数组的第一个元素将变成最后一个，而最后一个元素将变成第一个元素。它采用下面的语法：`array.\
    \ reverse()`。它返回按反序排列的数组原始元素。\n\n例如：\n```html\n<script>\nvar array1=[ \"Java\"\
    \ , \"C#\" , \"Python\" ];\nvar rv= array1.reverse();\ndocument . writeln( rv);\n\
    </script>\n```\n代码将返回以下：![](img/image283.jpg)\n数组元素按反序返回。\n\n### String\n\n在 JavaScript\
    \ 中，字符串是字符的序列。在 JavaScript 中，可以通过两种方式创建字符串：使用字符串字面量和使用字符串对象。字符串字面量是通过双引号创建的。使用字符串字面量创建字符串，使用下面的语法：`var\
    \ string_name= \"string\"`。例如：\n```html\n<script>\nvar st = \"A string\" ;\ndocument\
    \ . write( st);\n</script>\n```\n代码打印如下：![](img/303.jpg)\n使用字符串对象创建字符串，使用 `new`\
    \ 关键字。语法应该如下：`var string_name= new ( \"a\" )`。例如：\n```html\n<script>\nvar st =\
    \ new String(\"Hello, this is a string\");\ndocument . write( st);\n</script>\n\
    ```\n代码应该返回如下。考虑下面的示例：\n```html\n<script>\nvar st = new String( \"Hello, this\
    \ is a string\" );\ndocument . write( st);\n</script>\n```\n代码返回：![](img/325.jpg)\n\
    \n### charAt()\n此方法帮助查找位于特定索引的字符。索引从 `0` 开始到 `n-1`，其中 `n` 是字符串中的字符总数。索引不能为负值或大于字符串长度。该方法采用下面的语法：`String\
    \ . charAt( index)`。索引表示字符的位置。方法返回该字符。示例：\n```html\n<script>\nvar st=\"JavaScript\"\
    ;\ndocument . write( st.charAt( 5 ));\n</script>\n```\n代码返回 `a`。这是因为在索引 `5` 处找到了字符\
    \ `a`。我们也可以向它传递一个索引。如下：\n```html\n<script>\nvar st=\"JavaScript\";\ndocument .\
    \ write( st.charAt() );\n</script>\n```\n代码返回 `J`。这是因为在索引 `0` 处找到了字符 `J`。如下：\n\
    ```html\n<script>\nvar st=\"JavaScript\";\ndocument . write( st.charAt( 0 ));\n\
    </script>\n```\n代码返回 `J`。如下：\n```html\n<script>\nvar st=\"JavaScript\";\ndocument\
    \ . write( st.charAt( 10 ));\n</script>\n```\n代码返回 `t`。\n\n### indexOf()\n此方法可以用于搜索并返回字符串中某个字符的位置。始终记住字符串字符从索引\
    \ `0` 开始。如果未找到字符，方法将返回 `-1`。\n\n示例：\n```html\n<script>\nvar st=\"JavaScript is\
    \ a scripting language\";\ndocument . write( st.indexOf( 'a' ));\n</script>\n\
    ```\n代码返回 `1`。这是因为第一个字符“a”在索引 `1` 处找到。我们可以提供搜索应该开始的索引。如下：\n```html\n<script>\n\
    var st=\"JavaScript is a scripting language\";\ndocument . write( st.indexOf(\
    \ 'a' , 8 ));\n</script>\n```\n代码返回 `14`。这是因为我们规定搜索应该从索引 `8` 开始而不是从索引 `0` 开始。除了单个字符，我们还可以打印某个字符串第一个字符的位置：\n\
    ```html\n<script>\nvar st=\"JavaScript is a scripting language\";\ndocument .\
    \ write( st.indexOf( \"script\" ));\n</script>\n```\n代码返回 `16`。这是 `script` 中字符\
    \ `s` 的位置。注意搜索是区分大小写的；因此 `JavaScript` 中的 `Script` 将被跳过。你可以使用 `Script` 而不是 `script`，将得到不同的结果。为了避免这种混淆，我们可以为\
    \ JavaScript 提供搜索应该开始的索引：\n```html\n<script>\nvar st=\"JavaScript is a scripting\
    \ language\";\ndocument . write( st.indexOf( \"script\" , 6 ));\n</script>\n```\n\
    代码返回 `6`。因为搜索现在将从索引 `6` 开始而不是从索引 `0`。我们可以尝试搜索一个不存在的元素看看会发生什么：\n```html\n<script>\n\
    var st=\"JavaScript is a scripting language\";\ndocument . write( st.indexOf(\
    \ \"programming\" ));\n</script>\n```\n代码返回 `-1`。因为没有 `programming`。\n\n### search()\n\
    此方法用于在字符串中搜索正则表达式。如下所示：\n```html\n<script>\nvar st=\"JavaScript is a scripting\
    \ language\";\ndocument . write( st.search( /script/ ));\n</script>\n```\n代码返回\
    \ `10`。这是因为 `script` 位于索引 `10`。我们也可以传递一个索引。如下：\n```html\n<script>\nvar st=\"JavaScript\
    \ is a scripting language\";\ndocument . write( st.search( /script/ , 20 ));\n\
    </script>\n```\n代码返回 `24`。这是因为我们规定搜索应该从索引 `20` 开始。\n\n### substring()\n此方法用于提取字符串的一部分。如下所示：\n\
    ```html\n<script>\nvar st=\"JavaScript is a scripting language\";\ndocument .\
    \ write( st.substring( 0, 10 ));\n</script>\n```\n代码返回 `JavaScript`。\n\n### slice()\n\
    此方法用于提取字符串的一部分。如下所示：\n```html\n<script>\nvar st=\"JavaScript is a scripting language\"\
    ;\ndocument . write( st.slice( 0, 10 ));\n</script>\n```\n代码返回 `JavaScript`。\n\
    \n### repeat()\n此方法用于将字符串重复指定次数。如下所示：\n```html\n<script>\nvar st=\"JavaScript\"\
    ;\ndocument . write( st.repeat( 3 ));\n</script>\n```\n代码返回 `JavaScriptJavaScriptJavaScript`。\n\
    \n### replace()\n此方法用于替换字符串中的匹配项。如下所示：\n```html\n<script>\nvar st=\"JavaScript\
    \ is a scripting language\";\ndocument . write( st.replace( \"Script\", \"Java\"\
    \ ));\n</script>\n```\n代码返回 `Java is a scripting language`。\n\n### replaceAll()\n\
    此方法用于替换字符串中的所有匹配项。如下所示：\n```html\n<script>\nvar st=\"JavaScript is a scripting\
    \ language\";\ndocument . write( st.replaceAll( \"a\", \"o\" ));\n</script>\n\
    ```\n代码返回 `JavaScript is o scriptingongo language`。\n\n### split()\n此方法将字符串拆分为数组。如下所示：\n\
    ```html\n<script>\nvar st=\"JavaScript is a scripting language\";\nconsole.log(\
    \ st.split(\" \") );\n</script>\n```\n代码返回一个数组。\n\n### reverse()\n此方法按反序返回字符串。如下所示：\n\
    ```html\n<script>\nvar st=\"JavaScript\";\ndocument . write( st.split(\"\").reverse().join(\"\
    \"));\n</script>\n```\n代码返回 `tpircavaJ`。\n\n### toString()\n此方法返回字符串表示。如下所示：\n\
    ```html\n<script>\nvar st=\"JavaScript\";\ndocument . write( st.toString() );\n\
    </script>\n```\n代码返回 `JavaScript`。\n\n### toUpperCase()\n此方法将字符串转换为大写。如下所示：\n\
    ```html\n<script>\nvar st=\"JavaScript\";\ndocument . write( st.toUpperCase()\
    \ );\n</script>\n```\n代码返回 `JAVASCRIPT`。\n\n### toLowerCase()\n此方法将字符串转换为小写。如下所示：\n\
    ```html\n<script>\nvar st=\"JavaScript\";\ndocument . write( st.toLowerCase()\
    \ );\n</script>\n```\n代码返回 `javascript`。\n\n# 第 9 章 - JavaScript 事件\n\n事件是 JavaScript\
    \ 可以检测的动作。一个很好的例子是 `onmouseover` 事件，JavaScript 在鼠标移动到某些对象上时检测到。`onload` 事件在网页加载后被触发。在\
    \ JavaScript 中，事件和函数一起使用。一旦发生事件，就会触发一个函数。其他事件示例包括关闭窗口、按下键、调整窗口大小等。\n\n### onclick\
    \ 事件\n这是 JavaScript 中的一种常见事件。它在用户点击鼠标左键时发生。可以对事件添加警告、验证等。示例：\n```html\n<html>\n\
    <head>\n  <script type=\"text/javascript\">\n    function helloFunc() {\n    \
    \  alert ( \"Hello World!\" )\n    }\n  </script>\n</head>\n<body>\n  <p> Click\
    \ the button below</p>\n  <form><input type=\"button\" onclick = \"helloFunc()\"\
    value=\"Click Here\" />\n  </form>\n</body>\n</html>\n```\n在示例中，创建简单的表单。它应该如下：![](img/213.jpg)\n\
    点击“Click Here”按钮将调用函数 `helloFunc`。点击后，你将看到如下所示的弹出窗口：![](img/218.jpg)\n\n### onsubmit\
    \ 事件\n当提交表单时调用此事件。可以向事件添加表单验证。这将帮助你在将数据发送到 Web 服务器之前进行验证。示例：\n```html\n<html>\n\
    <head>\n  <script type=\"text/javascript\">\n    function formValidation() {\n\
    \      // 验证代码应该添加在这里\n      return true or false\n    }\n  </script>\n</head>\n\
    <body>\n  <form method=\"POST\" onsubmit = \"return formValidation()\"\n    <input\
    \ type=\"submit\" value=\"Submit\" />\n  </form>\n</body>\n</html>\n```\n一旦点击\
    \ Submit 按钮，将调用 `formValidation` 方法。\n\n### mouseout 和 onmouseover\n这些事件帮助你为文本和图像添加吸引人的特征。`onmouseover`\
    \ 事件在鼠标移动到对象上时触发。`onmouseout` 事件在鼠标移出元素时触发。示例：\n```html\n<html>\n<head>\n  <script\
    \ type=\"text/javascript\">\n    function overObject() {\n      document . write(\
    \ \"Mouse is Over\" );\n    }\n    function outOfObject() {\n      document .\
    \ write( \"Mouse is Out\" );\n    }\n  </script>\n</head>\n<body>\n  <p> Bring\
    \ your mouse in the division and observe:</p>\n  <div onmouseover=\"overObject()\"\
    \ onmouseout=\"outOfObject()\">\n    <h2>Division</h2>\n  </div>\n</body>\n</html>\n\
    ```\n代码执行时给出：![](img/296.jpg)\n按照指示移动鼠标，看看会发生什么。它将变为：![](img/201.jpg)\n我们定义了两个函数：`overObject`\
    \ 和 `outOfObject`。这两个函数在以下行被调用：`<div onmouseover=\"overObject()\" onmouseout=\"\
    outOfObject()\">`。\n\n### onload 和 onun\n这两个事件在用户进入或离开页面时触发。我们可以使用 `onload` 事件来检查访问器的类型和版本。都是处理\
    \ cookie 的良好函数：\n```html\n<html>\n<body onload=\"inspectCookies()\"><p id=\"example\"\
    ></p>\n<script>\nfunction inspectCookies() {\n  var txt = \"\" ;\n  if ( navigator.cookieEnabled\
    \ == true ) {\n    txt = \"Your browser has cookies enabled.\" ;\n  } else {\n\
    \    txt = \"your browser has cookies disabled.\" ;\n  }\n  document . getElementById(\
    \ \"example\" ). innerHTML = txt;\n}\n</script>\n</body>\n</html>\n```\n取决于是否开启了\
    \ cookie。\n\n### onchange 事件\n此方法主要用于表单字段的验证。下面的示例演示了如何使用此方法：\n```html\n<html>\n\
    <head>\n<script>\nfunction testFunc() {\n  var a = document . getElementById(\
    \ \"name\" );\n  a. value = a.value.toUpperCase();\n}\n</script>\n</head>\n<body>\n\
    Name: < input type=\"text\" id=\"name\" onchange=\"testFunc()\"\n<p> Leave the\
    \ input field and see your name to uppercase</p>\n</body>\n</html>\n```\n运行代码后，你将得到下面的简单表单：![](img/791.jpg)\n\
    只需用小写输入你的姓名，并在输入字段外点击移动鼠标。你会注意到你的姓名将转换为大写：![](img/796.jpg)\n`toUpperCase()` 方法在用户更改输入字段的内容后被调用。\n\
    \n### onload\n使用时，会在页面加载后显示提示框。示例：\n```html\n<html>\n<head>\n  <script>\nfunction\
    \ displayMessage() {\n  alert ( \"A message by onload\" );\n}\n</script>\n</head>\n\
    <body onload=\"displayMessage()\"></</body>\n</html>\n```\n一旦页面加载，你将得到下面的提示框：![](img/826.jpg)\n\
    \n### onfocus\n此方法使输入字段在获得焦点后改变颜色。示例：\n```html\n<html>\n<head>\n  <script>\nfunction\
    \ myFunc( col) {\n  col. style = \"green\" ;\n}\n  </script>\n</head>\n<body>\n\
    Name: < input type=\"text\" onfocus=\"myFunc(this)\"\n<p> Click inside the input\
    \ field and see it color.</p>\n</body>\n</html>\n```\n代码将给出下面的：![](img/860.jpg)\n\
    然后你可以按照指示点击输入字段内部并看看会发生什么。它将按所示变：![](img/865.jpg)\n输入字段的颜色将变为绿色。\n\n# 第 10 章 -\
    \ JavaScript 验证\n\n通过 JavaScript，人们可以在提交之前验证表单。最初，表单验证是在服务器端完成的。用户可以填写表单然后将其发送到服务器。如果发现详情错误，服务器必须将它们返回给用户进行更正。这个过程太长了。然而，JavaScript\
    \ 改变并改进了这种方法。在表单提交到服务器之前，可以在客户端进行表单验证。在表单验证中，我们应该确保必填字段已填写。对于接收电子邮件、手机号码等特定数据的字段，应该进行检查以确保符合格式。表单的验证通常在\
    \ `submit` 上完成：\n```html\n<html>\n<head>\n<script type=\"text/javascript\">\n\
    function formValidation(){\n  var name= document . detailsForm.username;\n  var\
    \ password = document . detailsForm.password;\n  if ( name== null || name=\"\"\
    />\n    alert ( \"You MUST enter name!\" );\n  } else if password .length< 8 ){\n\
    \    alert ( \"YouSt enter a password with 8 characters and above\" );\n  }\n\
    }\n</script>\n<body>\n<form name=\"detailsForm\" method=\"post\" onsubmit=\"formValidation()\"\
    >\n  Name: < input type=\"text\" name=\"username\" /><br/>\n  Password: < input\
    \ type=\"password\" name=\"password\" /><br/>\n  <input type=\"submit\" value=\"\
    Login\" >\n</form>\n</body>\n</html>\n```\n执行后，你将如下所示：![](img/929.jpg)\n在输入字段中没有输入任何值，代码将返回如下：![](img/934.jpg)\n\
    这意味着你必须输入姓名。\n\n### match()\n此方法用于在字符串中搜索正则表达式。如果没有找到匹配项，方法将返回 `-1`。如下所示：\n```html\n\
    <html>\n<head>\n  <script>\nfunction displayMessage() {\n  var st = \"JavaScript\
    \ is a scripting language\";\n  console.log( st.match( /programming/ ) );\n  }\n\
    \  </script>\n</head>\n<body></body>\n</html>\n```\n代码返回 `-1`，因为没有 `programming`。\n\
    \n"
