    \  <h1>Assignment Operators</h1>\n  <p id=\"pg1\"></p>\n  <p id=\"pg2\"></p>\n\
    \  <p id=\"pg3\"></p>\n  <p id=\"pg4\"></p>\n  <p id=\"pg5\"></p>\n  <p id=\"\
    pg6\"></p>\n  <script>\n    var a = 10 , b = 20 ;\n    a = b;\n    document.getElementById(\"\
    pg1\").innerHTML = a;\n    a += 1;\n    document.getElementById(\"pg2\").innerHTML\
    \ = a;\n    a -= 1;\n    document.getElementById(\"pg3\").innerHTML = a;\n   \
    \ a *= 5;\n    document.getElementById(\"pg4\").innerHTML = a;\n    a /= 5;\n\
    \    document.getElementById(\"pg5\").innerHTML = a;\n    a %= 2;\n    document.getElementById(\"\
    pg6\").innerHTML = a;\n  </script>\n</body>\n</html>\n```\n\nThe code will return\
    \ the following result: ![](image914.jpg)\n\nThe expression `a = b` changed the\
    \ value of variable `a` from `10` to `20`. That is why the first statement prints\
    \ a `20`. We then begin to work with a value of `a` being `20`. The expression\
    \ `a += 1` increases the value of `a` by `1`, so it becomes `21`. This becomes\
    \ the new value of variable `a`. The expression `a -= 1` subtracts `1` from the\
    \ current value of variable `a`, which is `21`, returning a `20`. This becomes\
    \ the new value of variable `a`. The expression `a *= 5` multiplies the value\
    \ of variable `a`, which is `20` by `5`, returning `100`. This becomes the new\
    \ value of variable `a`. The expression `a /= 5` divides the value of variable\
    \ `a` by `5`, returning `20`. This becomes the new value of variable a. The expression\
    \ `a %= 2` returns the remainder after dividing the value of variable `a` by `2`,\
    \ returning a `0`.\n\n# Chapter 5- JavaScript Decision Making\n\nJavaScript comes\
    \ with decision making statements that help in controlling the flow of programs.\
    \ With these statements, the action taken is based on the condition met. JavaScript\
    \ supports the following three decision making statements:\n\n- If Statement\n\
    - If else statement\n- if else if statement\n"
