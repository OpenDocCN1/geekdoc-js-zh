    # What is inside the book?


    The book has been grouped into chapters, with each chapter exploring a different
    feature of the JavaScript scripting language. The author has provided JavaScript
    codes, each code performing a different task. Corresponding explanations have
    also been provided alongside each piece of code to help the reader understand
    the meaning of the various lines of the code. In addition to this, screenshots
    showing the output that each code should return have been given. The author has
    used a simple language to make it easy even for absolute beginners to understand.


    # About the Author

    Brian Jenkins has a Ph.D. in computer science. He conducted coding research for
    magnetic recording systems and long-haul fiber optic communication systems. With
    two decades of experience teaching programming to newcomers, and one of the most
    talented IT specialists of his generation, Dr. Brian works as a Research Software
    Specialist and occasional as a bioinformatician. Since 2015 Brian lives in Geneva,
    with his wife, and daughter. He is working on a series of books on computer programming
    and data science.


    “ JavaScript is a language with more than its share of bad parts.” — Douglas Crockford


    # Introduction

    JavaScript is a powerful scripting language that every web developer should be
    familiar with. JavaScript has brought in many changes to the web development field.
    It has provided web developers with a way of making web pages more interactive.
    This is something most web visitors look for. If you know of validations, like
    checking whether a user enters correct details when filling forms, JavaScript
    is the best language to use for the implementation of such. It is one of the technologies
    of the WWW (World Wide Web). The good think with JavaScript is that it is supported
    by all modern web browsers. This means that you are not expected to get any special
    plugins to be able to run its scripts.


    You can easily get started with writing and running JavaScript scripts because
    you only need basic elements like a text editor and a browser. Modern browsers
    come with the JavaScript Engine embedded; hence you don’t need any other plugin
    to be able to run your scripts. The language also comes with many features and
    paradigms which you can rely on when writing your scripts. This book is an excellent
    guide for you on JavaScript programming. The author has discussed everything about
    JavaScript in a detailed manner. Enjoy reading!


    To my wife and my daughter, you are the happiness of my days, and you are my truest
    love!


