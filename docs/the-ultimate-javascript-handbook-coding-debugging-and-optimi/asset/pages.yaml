    model is processed, filtered, or massaged before it is presented to the view


    layer. In JavaScript, views are responsible for rendering and manipulating


    DOM


    elements. Views observe models and get notified when there is a change in


    the model. When the user interacts with the view, certain attributes of the


    model are changed via the view layer (usually via controllers). In JavaScript


    frameworks such as Backbone, the views are created using template engines


    such as **Handlebar.js** or **mustache.js** These templates themselves are not


    views. They observe models and keep the view state updated based on these


    changes. Let''s see an example of a view defined in Handlebar:


    **<li class="employee\_photo">**


    **<h2>{{title}}</h2>**


    **<img class="emp\_headshot\_small" src="{{src}}"/>**


