    a


    hashtable. It is a data structure that allows us to store key and value pairs,


    but it often doesn’t implement a hashing function.


    Complicating this story a bit, some dictionary implementations can use a


    hashtable under the covers. An example of this is the dict object we have in


    Python. It is a dictionary, but it uses a hashtable under the covers for all of


