    the *u*, the *c*, and the *k* individually.


    *Looking deeply at insertion behavior*


    For longer inputs involving large numbers of characters, more work needs


    to be done. Smaller inputs require less work. The amount of work is


    proportional to the size of our input, though. That makes this situation a


    perfect linear one.


    Here is one more detail to keep in mind. Our trie implementation uses a


    hashtable, which we just learned about earlier, to keep track of character


    and node mappings. Checking whether a character exists as a child has an


    average time complexity of O(1). Putting it all together, in the worst case,


    the time complexity for seeing if a word (or phrase) exists in our trie will be


    O(N). This is especially true if any particular node in our trie has an


    abnormally large amount of children. Our hashing implementation uses


