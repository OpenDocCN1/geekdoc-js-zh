    Let’s dive into a bit more detail on why our table has the values that it has


    by looking at each major class of operation!


    **Access**


    Array access is highly efficient and has constant time complexity (O(1)).


    This means that accessing an element at a specific index in an array takes


    the same amount of time, regardless of the size of the array. Arrays achieve


    this performance by storing elements in contiguous memory locations,


    allowing direct access to them by using the index.


    **Insertion**


    Inserting an element at the beginning of an array is inefficient, for it


    requires shifting *all* the existing elements to make room for the new


    element. This operation has a time complexity of O( *n*), where *n* is the


    number of elements in the array.


    Inserting an element at the end of an array is more efficient, particularly


    **when** **the array has sufficient adjacent memory capacity**. It can be done


    in constant time (O(1)). Inserting an element at a specific index within an


    array also


    requires shifting all the subsequent elements to make room. Thus, it has a


    time complexity of O( *n*), where *n* is the number of elements in the array.


    As we saw earlier, there will be situations in which the array does not have


    sufficient adjacent memory capacity to add a new item. In such cases, the


    time will always go up to O( *n*) because our array will need to move all of


    its contents to a newer, larger region of memory.'
