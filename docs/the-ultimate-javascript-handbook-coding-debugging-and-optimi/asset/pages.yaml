    **Storing Tools in a Toolbox**


    Adding items to our box is slow. There are different compartments for


    different tools, so we need to ensure the right tool goes into the right


    location.


    Finding items is fast. We go to the appropriate compartment and pick the


    tool from there. Removing items is fast as well. Because the tools are


    organized in a good location, we can retrieve them without any fuss.


    What we can see is that both our cardboard box and toolbox are good for


    some situations and bad for other situations. There is no universally right


    answer. If all we care about is storing our tools and never really looking at


    them again, stashing them in a cardboard box is the right choice. If we will


    be frequently accessing our tools, storing them in the toolbox is more


    appropriate.


