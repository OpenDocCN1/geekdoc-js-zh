    **Big-O Notation and Complexity Analysis**


    When analyzing the things our code does, we are interested in two things:


    time complexity and space complexity. Time complexity refers to how


    much time our code takes to run, and space complexity refers to how much


    additional memory our code requires.


    Any code you will ever write will have a specific set of inputs that yields


    particular outputs. In an ideal world, we’d want your code to run as fast as


    possible and take up as little memory as possible in doing so.


    However, the real world has its quirks, and your code might decide to take a


    leisurely stroll instead, depending on the size and characteristics of its input.


    While you can always glance at your wall clock to clock its performance for


    a specific input set, what we truly need is way to speak about how it


    performs with any set of inputs. And that’s where the Big-O notation strides


    onto the stage.


    Onward!


    **It’s Example Time**


    To help us better understand the Big-O notation, let us look at an example.


    We have some code, and our code takes a number as input and tells us how


    many digits are present. If our input number is 3415, the count of the


    number of digits is going to be 4.


    ![](img/d90243d52c96b97e5b0d290d2d85d3ff_129_0.png)'
