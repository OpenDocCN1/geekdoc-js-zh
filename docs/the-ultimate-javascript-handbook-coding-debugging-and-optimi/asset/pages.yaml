- img_proc: true
  md: '**Deletion**


    Deleting an element from the beginning of an array involves shifting all the


    subsequent elements to fill the gap, resulting in a time complexity of O( *n*),


    where *n* is the number of elements in the array.


    Deleting an element from the end of an array is efficient and can be done in


    constant time (O(1)).


    Deleting an element from a specific index within an array requires shifting


    all the subsequent elements to fill the gap, resulting in a time complexity of


    O( *n*), where *n* is the number of elements in the array.


    **Searching**


    There are two classes of search approaches we can take: **Linear search:**


    Searching for an element in an unsorted array requires iterating through


    each element until a match is found or the end of the array is reached. In the


    worst case, this operation has a time complexity of O( *n*), where *n* is the


    number of elements in the array.


    **Binary search:** Searching for an element in a **sorted array** can be done


    using binary search, which repeatedly divides the search space in half. This


    operation has a time complexity of O(log *n*), where *n* is the number of


    elements in the array. However, binary search requires a sorted array, so if


    the array is unsorted, an additional sorting operation may be needed,


    resulting in a higher time complexity.


    We cover both linear and binary searches in greater detail later when


    covering algorithms, so keep this information under your hat until then.


