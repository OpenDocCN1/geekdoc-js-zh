  md: '![](img/d90243d52c96b97e5b0d290d2d85d3ff_130_0.png)


    *Count of digits in a number*


    If our input number is 241,539, the number of digits will be 6.


    *For larger numbers, the number of digits will be larger as well* If we had to


    simplify the behavior, the amount of work we do to calculate the number of


    digits scales **linearly** (aka **proportionally**) with the size of our input


    number.


    *The number of steps scales linearly*


    The larger the number we provide as the input, the more digits we have to


    count through to get the final answer. The important detail is that the


    number of steps in our calculation won’t grow abnormally large (or small)


    with each additional digit in our number. We can visualize this by plotting


    the *size of our input* versus the *number of steps* required to get the count.'
