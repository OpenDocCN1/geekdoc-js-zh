- img_proc: true
  md: '**O(1)—Constant Complexity:** This notation represents code that has a


    constant running time or space increase, regardless of the input size. It


    means that the execution complexity remains the same, regardless of how


    large the dataset becomes. Examples include accessing an element in an


    array by its index or performing a simple mathematical operation, such as


    calculating whether a value is even or odd.


    **O(log *****n*****)—Logarithmic Complexity:** Code with logarithmic time or space


    complexity has growth that scales slowly as the input size increases. These


    coding approaches typically divide the input into smaller parts repeatedly,


    such as in a binary search. As the input size doubles, the number of steps


    required increases by a small factor, not proportionally. **O( *****n*****)—Linear**


    **Complexity:** Linear time complexity means that the running time or space


    of our code grows linearly with the input size. As the input size increases,


    the time or space required also increases proportionally. Examples include


    iterating through an array or a linked list to perform an operation on each


    element.


    **O( *****n***** log *****n*****)—Linearithmic Complexity:** Algorithms with linearithmic


    complexity have running values that are a product of linear and logarithmic


    growth rates. These algorithms are commonly found in efficient sorting


    algorithms such as mergesort and quicksort.


    **O( *****n*****^2)—Quadratic Complexity:** Quadratic time complexity means that


    the running time or space growth of our code increases quadratically with


    the input size. These coding approaches often involve nested iterations,


    where the number of operations is proportional to the square of the input


    size. Examples include bubblesort and selection sort.


    **O(2^ *****n*****)—Exponential Complexity:** Exponential time complexity


    represents code whose running time (or space taken up) grows


    exponentially with the input size. These coding approaches are highly


    inefficient and become impractical for larger input sizes. We get


    exponential time complexity when we solve problems with brute-force or


    exhaustive search strategies.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '**O( *****n*****!)—Factorial Complexity:** Factorial time complexity is the
    most


    severe and inefficient badge to tag a piece of code with. It represents coding


    approaches that have running times proportional to the factorial of the input


    size. As the input size increases, the number of required operations grows at


    an astronomical rate. We will run into factorial time and space complexity


    when we try to solve a problem using a brute-force approach that explores


    all possible permutations or combinations of a problem.


    As we look at data structures and algorithms together, we will frequently


    use the Big-O notation to describe how efficient (or inefficient) certain


    operations are.


    That is why it is important for us to get a broad understanding of what the


    various values of Big-O represent and how to read this notation when we


    encounter it.


    **Big-O, Big-Theta, and Big-Omega**


    In some situations, we may run into other notations for describing the time


    or space complexity of how our code behaves. We saw here that Big-O


    represents the worst-case scenario. The Big-Theta (Θ) notation represents


    the average-case scenario, and the Big-Omega (Ω) notation represents the


    best-case scenario.


    When we see these non-Big-O notations make an appearance, we then


    know how to read them.


    **Conclusion**


    Okay! It is time to wrap things up. The Big-O notation is a mathematical


    notation used to describe the upper bound or worst-case scenario of a code’s


    time or space complexity. To get all mathy on us, it provides an asymptotic


    upper limit on our code’s growth rate. By using the Big-O notation, we can


    talk about code complexity in a universally understood and consistent way.


    It allows us to analyze and compare the efficiency of different coding


    approaches, helping us decide what tradeoffs are worth making given the


    context our code will be running in.'
  merge: -1
