  md: '*The Big-O notation for the linear relationship*


    The Big-O notation looks a bit like a function call, but we shouldn’t think


    of it as such. If we had to decompose each part of this notation, it would be


    as follows:


    The *O* in Big-O, as well as O(. . .), stands for “order of.” It represents the


