  \n### 摇树优化的复杂性（The complicated business of tree shaking）\n\n摇树优化（Tree shaking）是一种通过删除代码中未使用的部分来减小打包体积的技术。它依赖于静态分析来确定哪些代码是使用的使用的。\n\
