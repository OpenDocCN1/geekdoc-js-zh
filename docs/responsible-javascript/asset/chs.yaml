- "# 负责任的 JavaScript\n\n\n\n![](img/1.png)\n\n![1.png](img/1.png)\n\n## 来自 Book Apart\
  \ 的更多著作\n\n### **安全设计**\nEva PenzeyMoog\n\n### **语音内容与可用性**\nPreston So\n\n### **更好的引导体验**\n\
  Krystal Higgins\n\n### **可持续网页设计**\nTom Greenwood\n\n### **针对认知偏差的设计**\nDavid Dylan\
  \ Thomas\n\n### **跨文化设计**\nSenongo Akpem\n\n### **表现性设计系统**\nYesenia Perez-Cruz\n\
  \n### **韧性管理**\nLara Hogan\n\n### **日常信息架构**\nLisa Maria Marquis\n\n### **渐进式 Web\
  \ 应用**\nJason Grigsby\n\n访问 [abookapart.com](http://abookapart.com) 查看我们的完整书单。\n\
  \n\n献给 Zandy, Maya, Lucy, Groant 和 Mowzers。\n\n# 前言\n\n我们都希望用户能够获得他们预期的快速、流畅的网页体验，无论他们使用的是手机、平板电脑还是笔记本电脑。但相互冲突的利益往往会介入。开发者希望有有趣的开发体验。设计师想要美观且清晰的设计。项目经理想要详细的用户交互报告来测试哪些方案有效。广告商则想要追踪……嗯，一切。\n\
  \n在削减成本和加速开发流程的同时，平衡所有这些需求似乎是不可能的——而且遗憾的是，我们赖以寻求帮助的框架和库可能会对无障碍、安全性、Web 性能和用户体验产生负面影响。\n\
  \n如果我们真的想为用户提供卓越的体验，我们必须成为可用性和性能更优秀的管家——这正是 Jeremy 能教给我们的。Jeremy 在为大小大小的项目开发网站和应用程序方面拥有超过十五年的经验，对于如何在业务需求、用户需求和开发者利益之间取得平衡有着敏锐的理解。他采取了大局观，不仅解释了如何审慎地使用\
  \ `JavaScript`，还解释了为什么要这么做。通过从多样化的真实案例中学习，你将能够预见对你自己的项目是合理的，并为你的用户构建高性能、优质的体验。\n\
  \n你还将学到比你想知道的更多的关于黄蜂的知识。希望这些信息永远用不上。\n\n—**Estelle Weyl**\n\n# 第 1 章. JavaScript：小心处理\n\
  \n![](img/2.png)\n\n警告：本书包含大量关于黄蜂的隐喻，可能会引起不安。\n\n让我们从 `Sphex` 开始，它是我们将遇到的许多黄蜂中的第一种。\n\
  \n`Sphex` 是一种独居性黄蜂属，它们在地下筑巢并以蟋蟀为食（见图 1.1）。当其中一只黄蜂将蟋蟀带回巢穴时，它会做出一种不合常理的周全行为：它会对巢穴进行检查，将蟋蟀留在外面。当黄蜂完成检查后，它会重新出来取蟋蟀。\n\
  \n现在的重点来了：如果你——一个昆虫界的恶作剧之神——在巢穴检查期间移动了蟋蟀，黄蜂的行为程序就会重启。黄蜂只知道蟋蟀不在它原来的位置，因此它会重新定位蟋蟀，将其拖回巢穴入口，并*再次*检查巢穴。\n\
  \n虽然这种行为在掘地黄蜂中并不一致，但这个概念通过学者 Douglas Hofstadter 创造的词汇具有修辞上的用处：`sphexishness`（[`bkaprt.com/rjs39/01-03`](http://bkaprt.com/rjs39/01-03)）。当我们说某事是\
  \ sphexish 的时候，我们描述的是一种高度确定性的、预设的、具有周全*表象*的行为。我经常对自己抱怨我们行业的这种“黄蜂性”以及它对网页整体可用性产生的影响。\n\
  \n![一只停在花植物上的黑黄蜂，触角向前伸，嘴朝向花朵。](img/1.1.png)\n\n图 1.1：被识别为 `Sphex pensylvanicus`\
  \ 的黄蜂。照片拍摄自 Hardyplants ([`bkaprt.com/rjs39/01-01`](http://bkaprt.com/rjs39/01-01))，CC0\
  \ 1.0 ([`bkaprt.com/rjs39/01-02`](http://bkaprt.com/rjs39/01-02))，源自 Wikimedia Commons。\n\
  \n你花闲钱买这本书，并不是为了听别人说你是一个无法进行批判性思考的工蜂——事实显然并非如此。我们都在努力用所知的最好的方式完成工作。然而，作为 Web 开发者，我们确实做了许多微小的、近乎仪式性的重复工作，这些行为绝对是“黄蜂性的”。\n\
  \n考虑一下我们对最佳实践的固执遵循，即使这些实践导致了糟糕的用户体验。我们在不考虑潜在劣势或替代方法的情况下直接 `npm install` 包。我们追逐新工具，希望它们能提高我们的生产力——尽管这种持续的变动本身就引入了隐蔽的生产力成本。\n\
  \n我们只是做了很多*事情*，导致了使用我们制作产品的人产生糟糕的结果。这是一个大胆的断言，是的。\n\n![折线图显示 2012 年至 2021 年间提供给移动设备的\
  \ JavaScript 数量持续增长。](img/1.2.png)\n\n图 1.2：此 HTTP Archive 图表显示了从 2012 年到 2021 年交付给移动设备的\
  \ JavaScript 中位数、75 分位数和 90 分位数。10% 的网站从 200 千字节增加到近 1.25 兆字节。\n\n## JavaScript\
  \ 在性能中的作用\n\n负责任地使用 JavaScript 首先需要理解浏览器如何处理它。人们很容易将网站的性能简化为传输大小。\n\n是的，在相同条件下，发送字节较少的页面通常比发送较多的更快。然而，这并不是\
  \ Web 性能的唯一因素。事实上，它有两个：加载性能和运行性能。\n\n### 加载性能\n\n*加载性能*是指 HTML 文档及其资源（CSS、图像，是的，还有\
  \ JavaScript）在浏览器请求它们后通过网络到达的速度。在加载性能方面，我们唯一能控制的是发送什么、发送多少以及如何发送。影响加载性能的因素发生在我们的控制之外，在浏览器和\
  \ Web 服务器之间的间隙中。\n\n尽管如此，我们有一些技巧可以改进加载性能：\n\n*   代码混化（Minification）：从 HTML、CSS 和\
  \ JavaScript 文件等文本资源中删除不必要的空格和注释以减小其体积。代码混化是有效的，因为它利用了计算机运行我们编写的代码时不需要这些奢侈的事实。\n\
  \n*   压缩（Compression）：是指服务器在发送内容之前，通过压缩算法减小文本资源的大小。就像 ZIP 文件，只不过资源是在发送前被压缩，并在到达网络后被解压缩。\n\
  \n\n\n\n我们似乎总能很好地处理代码混淆和压缩，因为这些很容易通过构建过程或服务器实现自动化。正是那些我们*无法*自动化的内容，让负责任地使用 JavaScript\
  \ 变成了一项艰巨的任务——其中最大的任务涉及管理浏览器请求并接收 JavaScript 资源*之后*发生的事情。\n\n## 运行时性能\n\n*运行时性能*（Runtime\
  \ performance）描述了页面出现在浏览器后对输入的响应能力。当一个页面对交互持续响应缓慢时，我们就说该页面的运行时性能很差。\n\n还记得不久前关于压缩的话吗？任何被压缩的内容都必须解压缩。浏览器开发者工具通过报告资产的*传输大小*（推测为压缩后的）和*实际大小*（解压后的）来反映这一点（图\
  \ 1.3）。\n\n![网络标签页显示请求了 459 个资源，压缩为 5.2 兆字节进行传输，并解压为 13.6 兆字节。](img/1.3.png)\n\n\
  图 1.3：Google Chrome 开发者工具在网络标签页中汇总了资源。从左到右分别是请求的资源总数、它们的传输大小（包括压缩）以及实际（解压后的）大小。\n\
  \n如果这看起来似乎无关紧要，请考虑：如果一个 200 字节的压缩 JavaScript 资源解压为 800 字节，浏览器必须处理这 800 字节的脚本！正如你将看到的，处理\
  \ JavaScript 是完全另一个“大马窝”。\n\n## 处理 JavaScript 的成本\n\n浏览器处理 JavaScript 的繁琐工作并不主要在于下载，而在于处理。浏览器厂商不断改进\
  \ JavaScript 引擎，以一种我们 Web 开发者无法实现的方式提高其性能。尽管有了这些改进，处理 JavaScript 仍然是一项高昂的投入，且设备越慢，成本越高。\n\
  \n将 Web 性能简化为字节问题，是假设了每个字节的性能成本都是相同的。这对于加载性能是正确的，但对于运行时性能并非如此，在运行时性能中，处理一个字节的 JavaScript\
  \ 所需计算量比处理一个字节的 CSS 要多。\n\n让我们用数据来说来说这一点：在查询并分析了 2020 年 HTTP Archive 的 BigQuery\
  \ 存储中执行的 7200 万次 Lighthouse 审计（[`bkaprt.com/rjs39/01-06`](http://bkaprt.com/rjs39/01-06)）后，显而易见，在这些审计中，处理\
  \ JavaScript 所花费的 CPU 时间远超过用于样式/布局操作、HTML 以及渲染/绘制花费的 CPU 时间（图 1.4）。\n\n![按类别划分浏览器主任务的处理时间，其中脚本花费的时间比\
  \ HTML、布局和渲染要多得多。](img/1.4.png)\n\n图 1.4：JavaScript 的 CPU 处理时间在较高百分位数处恶化，此时 Lighthouse\
  \ 审计遇到了具有较大 JavaScript 负载的页面。在中位数情况下，处理器处理 JavaScript 所花费的时间比处理 HTML 的长十倍以上。\n\n\
  考虑到这些数据，我们可以看到 Web 的很大一部分对于那少数使用高端硬件的人来说速度是可以接受的，但对于中大多数人来说是缓慢且令人烦恼的，而对于那些使用低端硬件的人来说，完全无法使用。\n\
  \n如果你很想轻描淡写掉设备缓慢的问题，请看看本文写作时 Amazon 上最畅销的解锁移动手机：一部 60 美元的 BLU Studio Mini 手机。虽然这\
  \ 60 美元买到了很多东西，但不要自欺欺人：它是一个没有太多性能的 Android 设备（[`bkaprt.com/rjs39/01-07`](http://bkaprt.com/rjs39/01-07)）。\n\
  \n此外，这里的数据仅说明了*启动*期间的页面速度，此时关键页面资源被下载和处理以创建初始用户体验。我们仍然在整个页面生命周期中与过度 JavaScript 的影响作斗——不仅仅是在启动期间。\n\
  \n虽然我们似乎在纠结字节和毫秒这类听起来微不足道的事情，但每个网站都涉及到这些内容，每个网站都参与其中，JavaScript 的影响在整个页面生命周期中都存在——不仅仅是在启动期间。\n\
  \n## 主线程\n\n### 帧、任务与 JavaScript 阻塞\n\n\n\n\n如果你将主线程看作一条代表任务队列的直线，那么认为这这条线也代表了时间是完全正确的。调度在主线程上的每项任务都需要一定的时间来完成。\n\
  \n问题在于，主线程并不是一个可以接纳任何挑战的巨兽。它有局限性会根据设备的性能和环境条件而变化。如果一次性在主线程上调度过多的工作，它就会变得缓慢。当这种情况发生时，在工作完成之前，用户无法与页面进行交互（图\
  \ 1.6）。\n\n![随时间绘制的登录屏幕帧图，显示主线程上的任务在动画加载时发生延迟。](img/1.6.png)\n\n图 1.6: 在 Chrome\
  \ 性能分析器中显示的花旗银行登录表单性能分析会话。每次按键都会触发过多的主线程工作，导致长近两秒的延迟，使得在输入密码时登录表单无响应。\n\n主线程工作过载的后果各不相同。繁忙的主线程可能会导致短暂的延迟，阻塞用户交互。糟糕的情况会导致浏览器长时间冻结，使页面看起来像坏了一样。无论如何，糟糕的运行时性能都会损害信任，并可能让人们沮丧到直接放弃你的网站。\n\
  \n人们感知某个事件为瞬时发生的阈值是 100 毫秒（[`bkaprt.com/rjs39/01-10`](http://bkaprt.com/rjs39/01-10)）。如果浏览器要无缝地完成所有要求且没有感知明显的性能问题，每个任务都必须在一个`frame`\
  \ 内内完成。\n\n典型的显示器每秒刷新六十次，每一帧为秒分之一，即 16.66 毫秒。但由于浏览器在每一帧中都需要时间进行自身的处理开销，因此在帧内完成任务的目标是\
  \ 10 毫秒（[`bkaprt.com/rjs39/01-11`](http://bkaprt.com/rjs39/01-11)）。\n\n在实践中，你只需要确保动画或滚动的每一帧达到\
  \ 10 毫秒，就能获得感知上的流畅感。对于其他工作，你的目标应该是每个任务 50 毫秒或更少。如果注册输入的时间不超过 50 毫秒，且浏览器响应该输入的时间不超过另一个\
  \ 50 毫秒，那么这种交互在感知上就是瞬时的（图 1.7）。\n\n![显示一个任务的前 50 毫秒和后 50 毫秒在系列帧中展开的图。](img/1.7.png)\n\
  \n图 1.7: 任务的前 50 毫秒是注册初始用户输入（例如点击或触摸）的预算。任务必须在剩余的 50 毫秒内完成，以保持良好的响应感。\n\n在性能术语中，任何超过\
  \ 50 毫秒的任务都被称为 `long task`（长任务）（[`bkaprt.com/rjs39/01-12`](http://bkaprt.com/rjs39/01-12)）。任务变成长任务是因为在任何给定交互期间\
  \ JavaScript 活动量过多，包括任何间带活动（例如布局和绘制操作）。这些工作完成的快慢取决于运行它的设备。\n\n## 听天由命\n\n这就是事情变得“现实现实”的地方：访问\
  \ Web 的设备多样性是**不可思议**的。可能的网络状况范围同样很广，网络覆盖差区域或网络拥塞等现象会对页面性能造成各种破坏（[`bkaprt.com/rjs39/01-13`](http://bkaprt.com/rjs39/01-13)）。\n\
  \n虽然网络连接是 Web 性能的一个重要方面，但设备速度同样重要。当涉及到页面对用户来说是否`感觉`很快时，这一点尤为真实。\n\n### 热节流：设备性能的杀手\n\
  \n每个设备都有处理器，它在处理任务时会产生热量。桌面电脑和笔记本电脑等设备通过风扇（主动散热）和金属散热片（被动散热）相结合，将处理器保持在安全的工作温度（图\
  \ 1.8）。\n\n由于移动设备制造商为了便携性进行优化，他们放弃了风扇，仅采用被动散热。这使得设备更容易受到过热。为了防止这些小手机烧毁，处理器会采用`thermal\
  \ throttling`（热节流），降低时钟和功耗（反过来降低设备性能），直到过热量消散。\n\n这——以及设备固有的能力——构成了高低端设备之间性能差距的主要原因。如果我们不能将\
  \ JavaScript 负载减少到可控的范围内，我们就无法保证在各种设备上都能提供良好的用户体验。\n\n### 设备性能差距\n\n人们使用 Web 完成许多对访问至关重要的任务：在线银行、求职申请、租房申请、危机干预、申请失业补助等。当\
  \ JavaScript 成为我们解决每个问题的首选工具时，我们面临的风险是限制访问而非扩大访问。\n\n![笔记本电脑主板处理器上安装的散热片和风扇特写。](img/1.8.png)\n\
  \n图 1.8: 安装在消费级笔记本主板处理器上的散热片/风扇组合。散热片吸收并消散处理器的热量，以维持性能并延长设备寿命。Saud 拍摄（[`bkaprt.com/rjs39/01-14`](http://bkaprt.com/rjs39/01-14)），\n\
  \n作为一个例子，我分析了南卡罗来纳州的失业补助网站，并测量了其 1.7 兆字节 JavaScript 在五种设备上的启动影响（图 1.9）：\n\n| 设备\
  \ | 启动时间 |\n| --- | --- |\n| 2017 5K iMac | 253 毫秒 |\n| 第二代 iPhone SE | 301 毫秒 |\n\
  | ASUS X5C Windows 10 | 709 毫秒 |\n| Nokia 2 Android 版 | 6044 毫秒 |\n| 2015 MacBook\
  \ Pro | 621 毫秒 |\n\n作为一个敏锐的读者，你会注意到其中一个数字大得多。这五台设备中有四台可以顺利处理 JavaScript。但其中一台——廉价设备——在尝试时几乎死掉。这就是我所指的“设备差距”。\n\
  \n![南卡罗来纳州失业补助网站的登录页面，深蓝色背景上有州会大厦](img/1.9.png)\n\n图 1.9: 截至 2020 年，南卡罗来纳州的失业补助首页发送了约\
  \ 800 字节的 JavaScript，最终解压为 1.7 兆字节。\n\nNokia 2 是一个资源受限的设备。它配备了四核 Cortex A7 处理器（[`bkaprt.com/rjs39/01-16`](http://bkaprt.com/rjs39/01-16)）和\
  \ 1GB 内存。你可以以低于 100 美元的价格购买 Nokia 2 或类似的设备。这个价格使得这种设备以及类似设备成为许多人的务实选择。\n\n我们关注的不仅仅是看有趣的猫视频。在\
  \ 2015 年，41% 的美国求职者在求职过程中使用过手机（[`bkaprt.com/rjs39/01-17`](http://bkaprt.com/rjs39/01-17)）。当我们发送过量的\
  \ JavaScript 时，那些负担不起高端设备的人面临着访问障碍，他们不仅无法参与 Web 提供的各种娱乐活动，还可能无法参与经济本身。\n\n人类通常是自私的生物，Web\
  \ 开发者也不例外。很容易将其合理化，即认为那些使用低端硬件或慢速连接的人并不是你的“目标受众”。让我们承认这种情绪的本质：这是一种刻意的排除行为。\n\n\n\
  \n\n我们必须努力构建触及每个人的网站，同时通过更审慎地使用 JavaScript 来提供高质量的体验。以这种方式构建 Web 应用可以最大限地扩大你的覆盖范围——并扩展访问性。\n\
  \n## Web 的未来由我们负责\n\n网络访问并非奢侈品，而是互联世界中运行的基础要素。这意味着我们必须意识到，我们的局限性不是静态的。虽然我们希望在工作中使用更多\
  \ JavaScript——而且我们确实一直在这么做——但将其作为首选方案会产生后果。\n\n网络传输速度是有限的，主线程能够承受的工作也是有限的。你向管道发送的\
  \ JavaScript 越多，目标设备就会变得越慢，可用性的承诺就会消失得越快。这产生了一种挫败感，而只有我们才能解决它。\n\n当我们从这一章继续前进时，让我们放弃那种墨守成规（sphexishness），关注真实的人是如何体验\
  \ Web 的。我们的用户依赖于 Web 提供的关键设施。现在我们已经掌握了 JavaScript 如何影响性能，就可以讨论我们的架构选择如何帮助或损害用户体验了。正如我们将学到的，我们不需要依赖\
  \ JavaScript 作为交互的主要驱动力；相反，让我们将其潜力视为一种增强手段。\n\n# 第 2 章，从开始就快\n\n![](img/3.png)\n\
  \n在纸蜂雌王建造巢穴之前，它会先建造一个名为 `petiole`（柄部）的基础支撑结构，这是一个支撑整个巢穴的纤维茎（图 2.1）。柄部足够耐用，可以在各种不利条件下支撑巢穴，甚至在蚁群灭绝很久之后也是。这是一个简单、可持续且至关重要的结构，在蚁群的生存中起着作用。\n\
  \n就像纸蜂巢没有柄部就无法存在一样，任何网站——无论其架构如何或使用了多少 JavaScript——如果没有 Web 服务器都无法存在。当网站依赖后端首先提供标记和功能时，它们会表现出特别的韧性。\n\
  \n然后，就像黄蜂通过额外的柄将巢穴扩展成连接的层级一样，我们可以决定何时适合使用框架和库来扩展我们的工作。这种增量式的方法限制了 JavaScript 的作用，确保了更流畅、更具韧性的用户体验，并适用于更多环境。\n\
  \n![三只纸蜂倒挂着并抓着它们模块化巢穴的特写，巢穴悬挂在坚硬的柄（petiole）上。](img/2.1.png)\n\n图 2.1：纸蜂巢由被称为 `petiole`（柄部）的基础结构悬挂。由作者拍摄。\n\
  \n## 只取你所需\n\n在我们的行业中，我们习惯于使用现成的解决方案来简化 Web 开发。虽然依赖框架和库可能认为更容易，但这样做等同于认同了他人关于如何构建\
  \ Web 应用的愿景。他们的方法与你项目的独特需求之间潜在的不一致性，极可能会导致沉重的性能成本和糟糕的用户体验。\n\n框架和库的历史作用是我论点中心的核心：当\
  \ `Prototype` 和 `jQuery` 等工具兴起时，迫切需要桥接不同浏览器 API 实现之间的鸿沟。得益于 Web 标准的普及，在不依赖此类临时补救措施的情况下，实现一致性变得容易得多——前提是我们能打破这种习惯。\n\
  \n### 平台优于库\n\nJavaScript 臃肿渗透到项目的一种方式是通过不必要的工具库。`Lodash` 就是其中一个库，它在 JavaScript\
  \ 本身无法方便地完成 `Lodash` 工具函数所能的功能期间获得了关注。如今，原生 JavaScript 就可以取代 `Lodash`提供的部分功能。\n\n\
  `Lodash` 的一个用例是将函数映射到数组的每个成员以转换其内容。例如，你可以将用于页面资源的 URL 字符串数组转换为标记，然后将结果合并成一个字符串：\n\
  \n```javascript\nimport _ from \"lodash\";const scripts = [\"/js/scripts.js\", \"\
  /js/vendors.js\"];\n```\n\n```javascript\nconst markupArray = _.map(scripts, script\
  \ => {\n```\n\n```javascript\n return '<script src=\"${script}\"><\\/script>';\n\
  ```\n\n```javascript\n});\n```\n\n```javascript\nconst markup = _.join(markupArray,\
  \ \"\");\n```\n\n虽然 `Lodash` 完成得，但这段代码可以更新为使用浏览器提供的 JavaScript 功能：\n\n```javascript\n\
  const scripts = [\"/js/scripts.js\", \"/js/vendors.js\"];\n```\n\n```javascript\n\
  const markup = scripts.map(script => {\n```\n\n```javascript\n return '<script src=\"\
  ${script}\"><\\/script>';\n```\n\n```javascript\n}).join(\"\");\n```\n\n浏览器提供的 JavaScript\
  \ 特性已经足够让你在没有工具库的情况下几乎完成任何事情。例如，你可以：\n\n* 使用 `Array.prototype.filter` 过滤数组 ([`bkaprt.com/rjs39/02-01`](http://bkaprt.com/rjs39/02-01))；\n\
  * 使用 `Array.prototype.reduce` 将数组归约为单值 ([`bkaprt.com/rjs39/02-02`](http://bkaprt.com/rjs39/02-02))；\n\
  * 使用 `Array.prototype.concat` 合并两个数组 ([`bkaprt.com/rjs39/02-03`](http://bkaprt.com/rjs39/02-03))；以及\n\
  * 分别使用 `Object.keys`、`Object.values` 或 `Object.entries` 获取对象的键、值或两者作为数组 ([`bkaprt.com/rjs39/02-04`](http://bkaprt.com/rjs39/02-04))。\n\
  \n这只是冰山一角！你有大量的 JavaScript 方法可以使用，它们在几乎每个广泛使用的浏览器中都可用 ([`bkaprt.com/rjs39/02-05`](http://bkaprt.com/rjs39/02-05))。批判性地思考你试图实现的目标，并尝试先用原生\
  \ JavaScript 解决问题，然后再求工具库，这是值得的。\n\n### 警惕从众谬误\n\n当开发者社区投入一个框架时，它感觉就像是正确的选择——安全的选择。这就是从众谬误，在评估客户端框架时这是一种极具吸引力的力量。即使每个人都在使用它，从用户体验的角度来看，它仍然可能是不安全的。诀窍在于知道一个工具是否适用于该任务。\n\
  \n`React` 是一个流行的 JavaScript 框架，强调组件化和简化状态管理。它由 Facebook 开发，并受到活跃且忠诚的用户群的强力支持。State\
  \ of JS 2020 调查显示，在 23,765 名受访者中，70% 的人使用了 `React` ([`bkaprt.com/rjs39/02-06`](http://bkaprt.com/rjs39/02-06))。调查还显示：\n\
  \n* 70.8% 的受访者认同为白人；\n* 91.1% 为男性，5.8% 为女性，0.9% 为非二元性别 / 第三种性别；\n* 超过半数（52.6%）的人将自己的\
  \ JavaScript 精通程度评为专家级，近一半的人自评为中级（22.7%）或高级（22.3%）水平。相比之下，只有 2.3% 的人自评为初级水平。\n\n\
  这些结果清楚地说明，一个极度活跃的、自评 JavaScript 水平高于平均水平的白男性开发者群体在强力主张 `React`。他们还主张有利于 JavaScript\
  \ 密集型客户端架构的开发者体验，而这种架构在不利条件下容易出现性能下降——这一部分开发者自己远不太可能经历这种情况，从而在他们的工作中强化并反映了他们的偏见。\n\
  \n考虑一下这一点，正如性能工程师 Tim Kadlec 在 2020 年对 JavaScript 框架的分析中发现的那样，使用 `React` 的网站发送的\
  \ JavaScript 比所有网站的中位数多出 40% ([`bkaprt.com/rjs39/02-07`](http://bkaprt.com/rjs39/02-07))。\n\
  \n\n\n\n同样，Kadlec 也发现，在大多数百分比下，使用 React 的网站往往比使用其他框架的网站消耗更多的设备内存（[`bkaprt.com/rjs39/02-08`](http://bkaprt.com/rjs39/02-08)）。这些选择会对性能——并继之对用户体验——产生后果，我们不应该轻易忽视这些后果。\n\
  \n这是从众效应（bandwagon fallacy）意料的结果。在大型企业开发团队中，关键决策者往往采用 React 等技术，是因为它们符合他们对“良好的开发者体验”的预期，而不是以用户的需求为中心。\n\
  \n这并不是说 React 没有用或它没有用武之地，而是说适用于 Facebook 的良好方案并不适用于每一个应用程序。对于任何客户端 JavaScript 框架都是如此。无论如何盲目从众，无法消除这一事实的事实。我们必须考虑框架的开销——即它为了完成工作而付出的性能成本——以避免无意中限制了访问而非扩展访问。\n\
  \n框架并没有注定我们必须构建糟糕的网站，但使用它们意味着接受了一定程度无法通过优化来消除的开销。你必须谨慎行事，特别是此类架构所提供的可安装插件和现成组件生态系统可能会加剧其用户体验问题。\n\
  \n客户端 JavaScript 框架的流行或易用性并不会自动带来良好的用户体验。它们首先是开发者的便利工具。成熟的技术和直接使用 Web 平台 API 往往是一个更以用户为中心的起点。\n\
  \n例如，Notist 是一个为会议演讲者展示其演讲的网站（图 2.2）。它运行在 PHP 和 Apache HTTP Server 上。虽然对于习惯现代全栈\
  \ JavaScript 开发的开发者来说，它没有那么吸引力，但它运行在经过数十年验证的可靠性和速度的技术之上。\n\n![开发者和演讲者 Ire Aderinokun\
  \ 的 Notist 页面，包含照片、简介和近期演示的缩略图。](img/2.2.png)\n\n图 2.2：Notist 是一个面向会议演讲者的网站，它摒弃了沉重的客户端架构，转而通过极客户端\
  \ JavaScript 的 PHP 后端来实现服务器驱动的功能。\n\nNotist 的架构还鼓励服务器端与客户端代码的强力分离。虽然这可能像是生产力的阻碍，但它建立了护栏，引导开发者交付*更少*的客户端代码。这有助于\
  \ Notist 提供出色的用户体验，在 JavaScript 产生极少主线程工作的情况下实现快速启动（图 2.3）。\n\n![各种内容加载时间的瀑布图，显示在\
  \ 1.4 秒时达到可交互状态。](img/2.3.png)\n\n图 2.3：在巴西圣保罗由 WebPageTest 实例驱动的 Moto G4 设备上加载\
  \ Notist 用户个人页的 WebPageTest 瀑布图。页面最大的内容在 1.5 秒内完成绘制，并在首次绘制后立即具有交互性。\n\n用户*不在乎*你使用什么技术。他们只关心网站是否快速且易于访问。这就是负责任使用\
  \ JavaScript 的核心所在：将用户体验置于开发者体验之上。\n\n### 记录你的架构选择\n\n一旦你确定了优先考虑良好用户体验的架构，起草一份技术声明（technology\
  \ statement）应该是你接下来的步骤之一。*技术声明*是一份列出项目技术选择及其背后理由的文档。它像一份行为准则，但它不是为社区成员的行为设定预期，而是为潜在的贡献者制定技术要求。\n\
  \n无论项目是开源的还是私有的，你都需要一份建立贡献基本规则的技术声明。否则，当那些充满活力的新贡献者出现时，他们对自己偏好的工具和方法的热情可能会与对项目最佳做法产生冲突。\n\
  \nA11Y Project 是关于网络无障碍的全面资源，其技术声明的摘录对于技术偏好直言不讳：\n\n> 这是一个刻意的选择，旨在平衡：\n\n* 无障碍访问性与互操作性。\n\
  * 易于设置。\n* 对初学者的亲和力。\n* 跨操作系统和浏览器的支持。\n* 本地和终端用户的性能。\n\n> 在开发网站时，请务必优先使用这些技术选择，并尽可能坚持它们。尊重这些技术选择有助于保持网站易于维护([`bkaprt.com/rjs39/02-09`](http://bkaprt.com/rjs39/02-09))。\n\
  \n他们的声明不仅列出了使用的技术，还列出了要避免的技术，并解释了为什么这些技术与 A11Y Project 提供无障碍且快速的网络无障碍资源的任务不兼容。这为潜在的贡献者提供了一份路线图，使其贡献与项目使命保持一致。\n\
  \n不采用技术声明的组织将自担风险，但在不加思考的情况下就将其直接丢进 Git 仓库或公司 Wiki 中也没有什么大帮助。请在项目的顶层 README 中突出提到你的项目技术声明，并在项目仓库中包含贡献指南。\n\
  \n对于为雇主开发私有项目的开发者，请将技术声明作为入职流程的一部分，以确保每个参与者都理解项目架构的限制。不这样做会让你的项目用户体验面临风险——无论是私有的还是其他的。\n\
  \n## 你站在哪一边？\n\n任何网站的首次请求总是涉及来自服务器的 HTML 响应，但真正定义你所构建内容的韧性的，是次初始响应之后发生的事情——以及你提供的是服务器端还是客户端的功能。\n\
  \n### 网站与 Web 应用程序\n\n术语总是很难区分。在我们的行业中，*网站*和*Web 应用程序*这样的术语被随意抛出，而没有考虑到它们如何影响我们的开发选择。随着这个行业消耗我更多的生命精力，我逐渐理解——虽然我们构建的所有内容在技术上都是网站——但每个术语*通常*代表以下含义：\n\
  \n* *网站*是一系列从服务器提供标记和功能的页面集合。网站倾向于将 JavaScript 视为最小可行体验的增强。\n* *Web 应用程序*感觉和行为更像原生应用。Web\
  \ 应用程序将服务器视为数据提供者，完全依赖客户端 JavaScript 提供标记和功能以创建“类应用”的体验。\n\n这些区别很重要，因为它们会影响你的开发风格。当你选择\
  \ Web 应用程序路径时，你可能会使用包管理器（例如 npm）以一种极具吸引力添加客户端 JavaScript。这种便利可能会导致缓慢的用户体验，从而提高某些网络和设备访问的门槛，并为用户制造不必要的障碍（图\
  \ 2.4）。\n\n在光谱的另一端是像 Self-Defined 这样的网站——一个让人们定义身份方面的现代字典（[`bkaprt.com/rjs39/02-10`](http://bkaprt.com/rjs39/02-10))——它们依赖服务器提供*所有*标记和功能（图\
  \ 2.5）。\n\n![登录屏幕的帧随时间变化的图，显示登录功能本身被延迟了 8 秒。](img/2.5.png)\n\n\n\n\n## 图 2.4：在 `Chrome`\
  \ 性能分析器中展示的 Chase 银行信用卡应用登录界面的时间线，该界面是使用一台廉价 Android 设备访问的。虽然初始标记由服务器提供，但登录表单本身（右侧截图底部）在页面在慢速\
  \ 3G 连接上完全加载 8 秒多之后才出现。这是由于需要请求多个 JavaScript 资源（如顶部所示），这些资源是客户端渲染登录表单标记所必需的。\n\n\
  由于 Self-Defined 依赖服务器来提供关键的标记和功能，它避免了构建 Web 应用带来的不必要的复杂性。这使得 Self-Defined 的维护者能够专注于完善其\
  \ `content`，而不是与那些经常被吹捧的不断变化的框架、工具和最佳实践作斗。因此，它既快速又易用，从而更具`包容性`。\n\n![随时间绘制的 Self-Defined\
  \ 网站帧图，显示几乎所有内容都在 3 秒内加载完成。](img/2.5.png)\n\n## 图 2.5：在 `Chrome` 性能分析器中显示的 Self-Defined\
  \ 网站的时间线，该网站是使用一台廉价 Android 设备访问的。由于 Self-Defined 的标记完全从服务器提供，其核心内容几乎可以立即读取，即使在较慢的\
  \ 3G 连接上也是如此。\n\n这并不是说 Web 应用是肮脏、糟糕、没用的东西，让你在的一百万年内也永远不要去构建它们——但请注意，这种方法会带你走上一条更容易引发性能问题的道路。从本质上说，Web\
  \ 应用绝对需要客户端 JavaScript——而且通常需要更多。如果你打算采用 Web 应用模型，那么你面前会有大量工作要做，以确保良好的用户体验。\n\n\
  Gmail 的 Web 应用是一个非常重量的客户端 Web 应用的典型示例。如果你有一台快速机器和良好的网络连接，它运行得良好，因为它发送了数兆字节的压缩 JavaScript，解压缩后会产生大量的代码需要处理和执行。尽管有如此庞大的\
  \ JavaScript 负载，Gmail 仍然被广泛使用。不过，以防万一，它允许连接速度慢的用户选择基础 HTML 视图（图 2.6）。\n\n![Gmail\
  \ 的基础 HTML 视图，显示白色背景以及对链接和按钮的极简样式处理。](img/2.6.png)\n\n## 图 2.6：Gmail 的基础 HTML 视图从服务器发送标记，并用极少的\
  \ JavaScript 代替了其标准视图所青重的重 JavaScript 客户端渲染。\n\nGmail 的基础 HTML 视图运行总共使用约 50 千字节的数据，其中只有一小部分是\
  \ JavaScript。虽然它的外观确实过时，但这种精简的体验是一种服务器驱动的方案，它是一个非常有力的论据，证明网络邮箱以及其他关键应用——可以在不依赖大量客户端\
  \ JavaScript 的情况下实现功能化。\n\n尽管如此，你不必以这种方式将项目一分为二。几乎每一个潜在的 JavaScript 密集型 Web 应用都可以通过从服务器发送\
  \ HTML 标记以及处理核心功能的应用程序后端来实现功能化。在此之后，JavaScript 变成了最小可行性体验的锦上添花。\n\n### 服务器优先即用户优先\n\
  \n当某人使用网站时，他们是在与标记进行交互。但它是从服务器发送的标记，还是通过 JavaScript 在客户端渲染的呢？虽然这两种方法都能生成用户界面，但它们各自都涉及权衡。\n\
  \n让我们通过分析廉价设备上的浏览器如何处理从服务器发送的标记与通过 JavaScript 在客户端渲染的标记来研究这个问题。对于测试用例，让我们使用一台 Moto\
  \ E Android 10 设备访问莎士比亚的《哈姆莱特》，二十个场景中的每一个场景都以无样式的 HTML 呈现在单独的页面上。\n\n交付这些内容有两种不同的方法：一种方法将每个场景拆分成单独的\
  \ HTML 文件，依靠传统的 `<a>` 元素在它们之间进行导航（图 2.7）。另一种方法使用流行的 JavaScript 框架在客户端渲染每个场景的标记，并依靠客户端路由器（一种我们很快会讨论的工具）在页面之间进行导航（图\
  \ 2.8）。\n\n![在 18,428 毫秒内 HTML 文件浏览器活动情况情况的饼图，其中脚本执行花费了 94 毫秒。](img/2.7.png)\n\n\
  ## 图 2.7：使用传统的 `<a>` 元素遍历以单独 HTML 文件形式呈现的 20 个页面时，浏览器活动的总结。唯一的脚本活动是浏览器内部产生的，例如 `unload`\
  \ 和 `pagehide` 事件处理程序。\n\n![在 19,444 毫秒内客户端渲染标记的浏览器活动饼图，其中脚本执行花费了 787 毫秒。](img/2.8.png)\n\
  \n## 图 2.8：使用客户端路由遍历 20 个客户端渲染标记页面时，浏览器活动的总结。涉及的脚本活动花费的时间比相同内容作为单独 HTML 文件呈现时长出\
  \ 8 倍以上。\n\n是的，这是一个高度简化的测试用例，但它有效地证明了在客户端渲染标记所付出的性能代价。当我们从服务器发送 HTML 时，浏览器以易于管理的块对其进行流式传输和处理，这比将工作完全委托给\
  \ JavaScript 要高效得多。\n\n当我们使用 JavaScript 在客户端渲染标记时，我们是以某种方式将这些标记封装在 JavaScript 中，这在加载之外还需要进行处理。在完成所有这些操作后，浏览器必须执行该脚本来渲染标记。从本质上说，在客户端渲染标记的成本更高。\n\
  \n现在让我们谈谈客户端渲染标记对感知性能的真实世界影响：在客户端渲染标记的 Web 应用通常在启动时从服务器发送一个 `app shell`（应用外壳）。应用外壳是启动\
  \ Web 应用所必需的最少标记（图 2.9）。当外壳请求的脚本加载时，会向服务器发起 API 调用。\n\n![手机上加载 Twitter，显示一个带有旋转加载指示器的空白屏幕。](img/10.png)\n\
  \n## 图 2.9：Twitter 的应用外壳。外壳立即加载，但在 API 调用填充界面之前存在延迟。期间加载指示器一直在旋转。\n\nTwitter 是 Web\
  \ 应用开发风格的一个绝佳示例。虽然 Twitter 的 Web 应用是一种相当快速的渲染体验，但这种模型存在潜在问题。当我们完全依赖客户端渲染时，负责填充应用外壳的每个脚本都变成了一个潜在的故障点（图\
  \ 2.10）。\n\n![Twitter 移动应用程序的错误信息，内容为：“出了问题，但不要担心——让我们试一次。重试。”](img/2.9.png)\n\n\
  ## 图 2.10：关键 JavaScript 资源加载失败后的 Twitter 移动应用程序。唯一的补救措施是刷新页面并听天由命。\n\n即使一切顺利，客户端渲染标记也涉及感知性能代价。使用客户端渲染应用的用户不仅需要等待应用外壳标记，还需要等待\
  \ API 调用来填充有意义的内容（图 2.11）。\n\n![Twitter 个人资料加载的时间线；前四个屏幕大部分是空白，完整屏幕直到 12,425 毫秒后才出现。](img/2.11.png)\n\
  \n## 图 2.11：在慢速 3G 连接上使用廉价 Android 设备加载 Twitter 个人资料的时间线。由于应用是在客户端渲染的，页面首次绘制与页面填充有意义的内容之间存在显著延迟。\n\
  \n相反，如果我们先先从服务器发送包含内容的标记，然后为页面的交互部分附加功能，我们就可以尽早提供更有意义的体验，并避免排除那些连接不稳定或禁用 JavaScript\
  \ 的用户访问这些内容。\n\n\n\n\n\n现在来分享一些好消息！现代基于组件的框架（例如 `React`）不仅可以在客户端渲染组件标记，还可以在 JavaScript\
  \ 后端以字符串的形式进行渲染。这使得在客户端和服务器上使用相同的组件代码成为可能，这对用户体验和开发者体验都是一种提升。\n\n不过，不要掉以自喜——服务器渲染通常是一个同步且计算开销巨大的过程。在大型应用中，你可能需要探索组件缓存等技术，以避免服务器响应时间过长（[`bkaprt.com/rjs39/02-11`](http://bkaprt.com/rjs39/02-11)）。\n\
  \n无论你使用什么技术或应用后端，关键点在于：从服务器交付有内容的标记，可以在可能没有 JavaScript 的情况下提供某种程度的体验。而且——说实话——采用“服务器优先”策略是使用\
  \ JavaScript 渐进增强网站的极佳起点，而又不会给客户端带来过重的昂贵负担。\n\n### 客户端路由路由与可访问性\n\nWeb 应用常见的架构选择是`单页应用`（SPA）模型，它预先从服务器预加载所有\
  \ HTML，然后使用由 JavaScript 驱动的客户端路由处理后续导航，该路由在应用外壳（app shell）中切换页面内容。\n\nSPA 在感知性能上具有优势，因为它们在导航到其他页面时避免了完全刷新页面的低效率。除了我们讨论过的在客户端渲染\
  \ HTML 带来的性能损失外，这种方法可能会带来重大的可访问性（accessibility）风险——至少如果你处理得不是非常、非常仔细的话。\n\n导航和历史记录受一个复杂的规范约束，在它的演变过程中，许多开源客户端路由应生灭灭。并不是所有的客户端路由都会关注（或能够修复）至关重要的可访问性问题，例如元素焦点、滚动位置恢复、导航取消等。\n\
  \n我无论如何强调都不为过的是，当你使用客户端路由时，你实际上是在挑战浏览器厂商为了确保一致且健壮的导航体验而所做的几十年的发现和基础性工作（[`bkaprt.com/rjs39/02-12`](http://bkaprt.com/rjs39/02-12)）。\n\
  \n如果你已经读到了这里，并且仍然认为你的项目有必要客户端路由，请考虑以下几点：\n\n*   Service-worker 技术可以通过将缓存的头部和页脚部分内容与从网络流式传输的部分内容组合在一起，来增加导航的感知速度。Service-worker\
  \ 技术速度快、支持良好，而且最重要的是，它是对一种经过时间考验且成熟的导航机制的渐进式增强，而不是对其进行全面替代。我们将在第 4 章中详细介绍这种方法。\n\
  \n*   如果 service worker 不可行，而你执意于客户端路由，那么你的应用后端与尽可能多的客户端路由保持一一对应的关系是至关重要的。这确保了无论在何种上下文中（例如通过搜索引擎的引用），都能访问网站的任何部分。\n\
  \n*   将客户端路由视为一种增强。例如，如果你的网站既有已验证区域也有未验证区域，可以考虑将客户端路由仅限制在网站的已验证部分。\n\nWeb 开发者 Marcy\
  \ Sutton 详细讨论了客户端路由对可访问性的影响，如果你坚持要用，她有一系列非常有用的建议。其中最令我印象深刻的是这一点：\n\n> 考虑单页应用是否真的必要，以及你是否真的需要使用\
  \ JavaScript 框架。（[`bkaprt.com/rjs39/02-13`](http://bkaprt.com/rjs39/02-13)）\n\n\
  这个建议似乎违背了最佳实践。它确实与行业内盛行的 JavaScript 狂热背道而驰，但请记住：以牺牲用户体验为代价维护开发者体验的最佳实践并不是最佳实践，而是一种自私自利的策略（[`bkaprt.com/rjs39/02-14`](http://bkaprt.com/rjs39/02-14)）。\n\
  \n### 理性的缓存\n\n关于浏览器缓存的章节？在一部关于 JavaScript 的书里？相信我！提到它是有理由的。\n\n浏览器缓存是一种优化，服务器向浏览器通信资产的“新鲜期”周期。如果浏览器在再次访问页面时，根据服务器提供的策略判断其磁盘上的资源是“新鲜”的，则该资源将被重复使用，而不是再次从网络中获取（图\
  \ 2.12）。\n\n浏览器缓存对你网站的新访问者不起作用，但它是一种非常有效的优化，可以减少或消除后续页面访问中受影响资产的加载时间。对于 JavaScript\
  \ 来说，这意味着加载阶段被缩短了，浏览器可以更快地进入处理阶段。\n\n![Web vitals 比较：首次访问网站需要超过 10 秒并传输 1,281 KB，而重复访问需要\
  \ 6 秒并传输 90 KB。](img/2.12.png)\n\n图 2.12：WebPageTest 对网页在首次访问（顶行）和缓存生效的重复访问（底行）的汇总。重复访问不仅传输的数据量比首次访问减少了\
  \ 93 %，而且其最大内容绘制（Largest Contentful Paint）和累积布局偏移（Cumulative Layout Shift）指标也得到了改进。\n\
  \n当浏览器请求资源时，响应包含描述其特征的 HTTP 头部。浏览器缓存受几个响应头的影响，但最灵活且最常用的是 `Cache-Control`（[`bkaprt.com/rjs39/02-15`](http://bkaprt.com/rjs39/02-15)）。\n\
  \n`Cache-Control` 指定了一个由多个指令组成的缓存策略，描述如何缓存资源。一个常用的指令是 `max-age`，它指定资源有效的秒数。假设你请求一个\
  \ HTML 文档，响应中出现了此头部：\n\n```\nCache-Control: max-age=300\n```\n\n这告诉浏览器：“嘿，这个资源可以重复使用三百秒。”对我们来说就是五分钟。\n\
  \n`Cache-Control` 的一个问题是资源不仅会被浏览器缓存，还会被中间缓存缓存，例如内容分发网络（CDN）。CDN 是位于网站前端的代理，将资产分发到距离网站访问者更近的边缘服务器。减少物理距离可以降低延迟。\n\
  \n`Cache-Control` 隐式允许浏览器和代理缓存资产。这种优化的好处在于即使不在浏览器缓存中，也可以从 CDN 缓存中获取。对于动态内容——即 HTML\
  \ 文档——你希望通过在 `max-age` 之外指定 `private` 指令来防止这种情况：\n\n```\nCache-Control: max-age=300,\
  \ private\n```\n\n如何配置 `Cache-Control` 取决于你的应用后端或 Web 服务器配置。对于 Apache 服务器，可以通过 `.htaccess`\
  \ 文件为 HTML 文档设置上述策略：\n\n```apache\n<FilesMatch \"\\.html$\">\n```\n\n```apache\n\
  Header set Cache-Control \"max-age=300, private\"\n```\n\n```apache\n</FilesMatch>\n\
  ```\n\n你想要缓存资产的时间取决于资产类型。JavaScript 文件是静态资产，这意味着它们不会根据请求资源的人或请求方式而改变。考虑像样式表、脚本、图像和字体等——其内容不会根据\
  \ cookie 等因素变化的资源。为这些资产配置缓存需要一种双管齐下的方法：\n\n*   必须对资产进行版本控制，以确保未来的更新不会因为浏览器缓存中存在先旧版本而被跳过。\n\
  \n*   资产必须拥有 `Cache-Control` 策略，以确保能够尽可能长时间地重复使用。\n\n\n\n\n\n资源版本化是两种方法中最复杂的一种，因为浏览器缓存是通过\
  \ URL 来跟踪资源的。如果一个命名为 `scripts.js` 的 JavaScript 文件从 `compuglobalhypermega.net` 提供，那么该资源就没有经过版本化。如果有人在周一访问了\
  \ `compuglobalhypermega.net` 并下载了 `scripts.js`，且 `max-age` 指令指定的的新鲜期为一个月，那么当该用户在周五再次访问该网站时，浏览器将使用其缓存中的副本——即使周三已经发布了新版本的\
  \ `scripts.js`。这注定会导致问题。\n\n一种变通是在资源发生变化时向 URL 附加查询字符串：`compuglobalhypermega.net/js/scripts.js`\
  \ 变成类似 `compuglobalhypermega.net/js/scripts.js?v=1` 的内容。当文件更改时，查询字符串增加到 `?v=2`。\n\
  \n这种方法对于除了最简单的网站之外的所有网站都是不可持续的，因此最好是自动化版本化。一种方法是在应用程序后端计算文件内容的哈希值（hash），以便查询字符串能够自动更新。下面的\
  \ PHP 代码示例了如何生成资源内容的哈希值，并将其附加到 `<script>` 标签的 URL 中：\n\n```php\n<?php $fileHash\
  \ = md5(file_get_contents(\"./scripts.js\")); ?>\n```\n\n```html\n<script src=\"\
  /js/scripts.js?v=<?php echo($fileHash); ?>\"></script>\n```\n\n另一种版本化方法涉及使用打包器（bundler——我们将在第\
  \ 5 章中讨论这种工具）在构建时计算其内容的哈希并将其注入资源文件名中。结果是一个这样的文件名：\n\n```\nscripts.4d3b7eda068fd80bef9ed2f05d52c3df.js\n\
  ```\n\n这两种方法都可行，因为你的 HTML 节点没有被缓存（如果缓存了，它可能不应该被缓存）。当 HTML 更新时，将引用新资源而不是旧资源，并且它们会被分别缓存。\n\
  \n最佳缓存策略是这场盛宴的第二部分。这是一个针对版本化静态资源的强缓存策略示例：\n\n```\nCache-Control: max-age=31536000,\
  \ immutable\n```\n\n此指令指示浏览器将相关资源缓存长达一年。我们还添加了额外的 `immutable` 指令作为进一步优化，它告诉支持的浏览器：“嘿！这个文件永远不会改变。不用去询问服务器它是否发生了变化了！”\n\
  \n在关于 JavaScript 的书中讨论浏览器缓存可能看起来很奇怪，但它对许多类型资源的加载性能起着很大作用——其中 JavaScript 居首。这并不是负责任使用\
  \ JavaScript 的微小部分。\n\n## 渐进式增强 (Progressive Enhancement)\n\n好了，现在你已经有了服务器提供的标记并落实了一些良好的缓存实践。现在，你可以专注于使用\
  \ JavaScript 渐进式地增强你的网站了。\n\n渐进式增强——至少对于 JavaScript 而言——是这样一个观点：我们首先在不使用 JavaScript\
  \ 的实现网站的核心功能。一旦我们有了不需要 JavaScript 就能运行的基础体验，我们就可以选择性地应用 JavaScript，为那些能从中受益的用户提供更好的体验（[`bkaprt.com/rjs39/02-16`](http://bkaprt.com/rjs39/02-16)）。\n\
  \n渐进式增强很难推销，因为它要求达成共识，即一种体验应该以多一种理想方式运行。然而，它的主要优势是，冗余的功能层使得网站无论从何处访问都更具可访问性和包容性。\n\
  \n### 设置基础体验 (Set a baseline)\n\n你可以将渐进式增强应用到大多数关键交互点。表单驱动的交互就是首要例子。例如，让我们来看一个社交媒体类型的网站，人们可以订阅他人的新内容。这是一个极佳的例子，展示了如何使用渐进式增强来促进我们都熟悉的常见交互模式。这种功能——不出所料——是由一个\
  \ `<button>` 元素提供的。\n\n我们*可以*编写一些 JavaScript，在点击该按钮时向后端 API 发起 `fetch` 调用，如果请求成功，则在客户端更新其状态。这本身并不是一种反模式（antipattern），但它不应该是该功能的唯一实现。它应该是服务器提供的交互之上的增强。\n\
  \n为了建立这种基础体验，我们将“订阅”（Subscribe）按钮封装在 `<form>` 元素中，并带有 `action` 属性指向处理订阅请求的服务器路由：\n\
  \n```html\n<form method=\"POST\" action=\"/subscribe\">\n```\n\n```html\n<button\
  \ type=\"submit\" class=\"subscribe-button\">Subscribe</button>\n```\n\n```html\n\
  <input type=\"hidden\" name=\"subscribee-id\" value=\"1\">\n```\n\n```html\n</form>\n\
  ```\n\n服务器确保只有现有的用户 ID 是有效的，并且订阅请求只能代表当前已身份验证的用户发生。简而言之，安全指南在服务器端强制执行——尽管是的，隐藏的\
  \ `subscribee-id` 输入内容可能会被某些入侵者修改，但那是徒劳的。\n\n一旦服务器处理了订阅请求，浏览器将重定向回用户的个人资料页。因为该请求重新生成了\
  \ HTML，服务器提供的状态将显示该用户已订阅了该个人资料。\n\n如果这种交互与 JavaScript `fetch` 请求相比显得效率低下，你并没有错！但问题在于，此阶段的目标不是效率，而是建立一个在*没有*\
  \ JavaScript 的情况下扩展访问范围的基础体验。\n\n### 增强！(Enhance!)\n\n好了，我们已经有了服务器提供的功能。现在我们可以点缀一点\
  \ JavaScript 来增强它。\n\n订阅按钮的标记是在 JavaScript 中渲染的。如果我们愿意，我们*可以使用像 React 这样的框架在客户端提供功能，并在启动时通过\
  \ JavaScript 附加。\n\n然而，使用框架来这样做需要我们谨慎。为了更好的开发者体验，性能和可访问性的代价值得吗？也许吧！但是质疑“良好的开发者体验带来良好的用户体验”这一假设的时候。\n\
  \n客户端交互由事件监听器驱动。自己用 `addEventListener` 管理事件监听器还是依赖框架很重要，因为依赖框架可能会产生高效率成本（如图 2.13）。\n\
  \nReact 对事件监听器及其关联状态的处理是计算密集型的。取决于设备，React 执行其操作有时比你自己注册的监听器或竞争框架要慢得多（[`bkaprt.com/rjs39/02-16`](http://bkaprt.com/rjs39/02-16)）。\n\
  \n![显示由点击事件触发的几十个嵌套函数的火焰图](img/2.13.png)\n\n图 2.13：Chrome 性能分析器中由 React 处理打开移动导航菜单的点击事件调用栈。\n\
  \n记住，任何运行超过 50 毫秒的任务都是长任务；框架为了管理事件监听器引入的开销为你其他工作留出的空间更少。如果我们愿意自己注册事件监听器，可以看到同样的交互在处理成本上要轻量得多（如图\
  \ 2.14）。\n\n![显示无嵌套函数的相同点击事件火焰图](img/2.14.png)\n\n图 2.14：Chrome 性能分析器中不使用框架打开移动导航菜单的点击事件调用栈。\n\
  \n虽然客户端框架简化了组件化和状态管理，但你并不需要框架来管理这些事情。Web Components 可能是一个可行的替代方案，并且比你想象的要更好用。\n\n\
  \n\n\n\nWeb Components（Web 组件）并不是单一的单体 Web 平台功能，而是系列功能的集合，例如通过 Shadow DOM、自定义元素和\
  \ HTML 模板来实现更好的 DOM 和 CSS 封装。类似于基于组件的框架，Web Components 提供了组件化以及在中心位置跟踪状态的能力。\n\n\
  在我们讨论如何使用 Web Components 之前，让我们先回顾一下之前服务器驱动的“订阅”（Subscribe）按钮的标记代码：\n\n```html\n\
  <form method=\"POST\" action=\"/subscribe\">\n<button type=\"submit\" class=\"subscribe-button\"\
  >Subscribe</button>\n<input type=\"hidden\" name=\"subscribee-id\" value=\"1\">\n\
  </form>\n```\n\n提到 Web Components 时，可能会想到自定义元素（custom elements），你可以使用它们为特定场景构建完全全新的\
  \ HTML 元素，例如 `<subscribe-button>`。遗憾的是，不支持自定义元素的浏览器将无法回退到默认语义，这意味着它们将丢失重要的功能，例如\
  \ `<form>` 元素服务器提供的功能。\n\n这很令人遗憾。幸运的是，在这种情况下，如果我们在表单的 `is` 属性中引用自定义元素的名称，就可以保留这些语义：\n\
  \n```html\n<form is=\"subscribe-button\" method=\"POST\" data-subscribed=\"false\"\
  \ action=\"/subscribe\">\n```\n\n友情提示：截至本文写作时，Safari（无论是 macOS 还是 iOS）都不支持 `is`\
  \ 属性，尽管它是 HTML 规范中的生存标准（[`bkaprt.com/rjs39/02-18`](http://bkaprt.com/rjs39/02-18)）。对于\
  \ iOS 来说，这意味着该平台上所有浏览器都不支持，因为 Firefox 或 Chrome 底层本质都是 Safari。替代方案包括不使用 Web Components、回退到服务器提供的功能，或者非常仔细地评估你的框架选项，以找到一个优先性能的解决方案。\n\
  \n回到正题：你可能会奇怪为什么我们决定将名为 `subscribe-button` 的自定义元素附加到 `<form>` 元素上，而不是内部的 `<button>`。这是一个重要的语义选择！一个无障碍且支持渐进增强的订阅按钮不仅仅是\
  \ `<button>` 元素本身：它需要 `<form>` 元素及其内部的所有内容才能运行。\n\n这是让自定义元素运行所需的一部分。我们仍然需要编写组件 JavaScript，它看起来像你遇到的大多数\
  \ JavaScript 类一样：\n\n```javascript\nclass SubscribeButton extends HTMLFormElement\
  \ {\n  constructor () {\n    super();\n  }\n}\n```\n\n这看起来并不是一个了不起的开始，但这段启动代码背后有很多内容，使得自定义元素在渐进增强的背景下变得非常有用。主要由于\
  \ `SubscribeButton` 类扩展了 `HTMLFormElement` 类。因此，我们为自定义元素保留了 `<form>` 元素的所有内置功能和无障碍语义。这是因为我们决定扩展现有元素，而不是从头开始创建一个（你通常也不应该这样做）。\n\
  \n和任何 `class` 一样，我们需要一个 `constructor` 方法。目前，我们调用 `super` 方法，它会调用父类的 `constructor`\
  \ 方法。这确保了我们获得了 `HTMLFormElement` 类的所有功能和属性。\n\n从这里开始，我们使用组件的 `constructor` 方法为订阅按钮的工作建立必要的对象属性：\n\
  \n```javascript\nclass SubscribeButton extends HTMLFormElement {\n  constructor\
  \ () {\n    super();\n    this.subscribeButton = this.querySelector(\".subscribe-button\"\
  );\n    this.subscribed = this.dataset.subscribed === \"true\";\n    this.subscribeeId\
  \ = Number(this.querySelector(\"[name='subscribee-id']\").value);\n    this.buttonLabel\
  \ = this.subscribed ? \"Subscribed\" : \"Unsubscribe\";\n    this.coarsePointer\
  \ = window.matchMedia(\"(pointer: coarse)\").matches;\n\n    // 绑定方法\n    this.subscribeButton.addEventListener(\"\
  mouseenter\", this.hoverOn);\n    this.subscribeButton.addEventListener(\"mouseleave\"\
  , this.hoverOff);\n    this.addEventListener(\"submit\", this.subscribe);\n  }\n\
  }\n```\n*等等，原文将代码分成了多个块，我根据提供的逻辑将它们合并了以提高可读性。*\n\n*哇*，这里面内容不不少。让我们拆解每个部分：\n\n- `this`\
  \ 指向 Web 组件所附加的 DOM 节点。在这种情况下，`this` 是订阅按钮表单的 `<form>` 元素。\n- 因为 `this` 代表组件实例，我们可以从它推导出额外的作用域属性，从表单内部的\
  \ `<button>` 元素开始。\n- 我们还可以从 `this` 中推导出其他有用信息，例如存储在 `<form>` 元素 `data-subscribed`\
  \ 属性中的订阅状态，以及订阅者的用户 ID（组件子节点 `<button>` 的文本内容）。我们甚至可以将当前设备是否具有粗指针（触摸屏）或精细指针（鼠标）作为类属性存储起来。\n\
  \n有了这些属性，我们随后绑定了事件监听器，这些监听器调用类方法提供以下功能：\n\n- 对于具有精细指针的设备，组件 `<button>` 元素上的 `mouseleave`\
  \ 和 `mouseenter` 事件将调用组件的 `hoverOn` 和 `hoverOff` 方法。因为只有那些具有精细指针的设备（如鼠标）才能对它们进行“悬停”（hover）。\n\
  - `<form>` 元素上的 `submit` 事件监听器会调用组件的 `subscribe` 方法。\n\n（注：提供的文本在结尾处有一些重复/碎片化的描述；我在保持所描述的核心技术逻辑的同时，优化了流程。）\n\
  \n\n\n\n\n```\n alert(\"Couldn't subscribe to this person due to a glitch on our\
  \ end. Try again in a minute?\");\n```\n\n```\n this.enableButton();\n```\n\n```\n\
  \ });\n```\n\n```\n }\n```\n\n```\n }\n```\n\n```\n}\n```\n\n这种方法虽然繁琐，但以下是具体的执行步骤：\n\
  \n1. 调用 `event.preventDefault()` 防止表单提交到服务器，从而让 Web 组件处理订阅功能。\n2. 禁用“订阅”（Subscribe）按钮。\n\
  3. 通过 `fetch` 调用以 POST 请求的形式向服务器发送，并将订阅者 ID 包含在字符串化的 JSON 负载中。随后，服务器将处理该订阅请求。\n\
  4. 如果请求成功，按钮的文本内容将更新以反映该状态。否则，会弹出一个基础的 `alert` 提示出现问题。无论 `fetch` 调用成功与否，在调用完成后按钮都会重新启用。\n\
  \n大功告成！在付出了这么多努力尝试创建一个渐进增强的体验后，如果你怀疑这一切的意义也是完全可以的——但请放心，这些工作不仅仅是为了让一个微小的按钮以最极简的方式发挥作用。\n\
  \n### 渐进增强的收益\n\n在 Web 开发中，仅在客户端构建功能可能比从服务器提供相同功能然后用 JavaScript 进行渐进增强要容易。\n\n然而——对此我再强调不过了——它是值得的。当你这样做时，你正在付出巨大的努力来帮助他人：\n\
  \n* 冗余功能在 JavaScript 关闭或加载失败的情况下为人们提供了安全网。你无法控制人们如何访问你的网站，而渐进增强创建了一个良好的备用方案（fallback）。\n\
  * 渐进增强建立了防护护栏，通过增加服务器在提供功能方面的作用，迫使你更仔细地思考如何使用 JavaScript。最终结果是更具韧性的用户体验。\n\n尽管如此，你不需要\
  \ Web Components 也可以对你的网站进行渐进增强——这只是它们在追求这一目标时如何使用的一个示例。但你应该在每个项目开始时都保持这种极简主义精神，以便在早期获得最佳结果，如果需要，再层叠使用更华丽的策略。\n\
  \n只有从极简主义出发，我们才能构建出一个在关键时刻不那么依赖 JavaScript 的网络。如果我们从一开始就使用沉重且具有强制性的框架，我们就无法到达那里。不要“快速行动并破坏一切”，要深思熟虑并谨慎行事。\n\
  \n## 展望 对于对于构建可持续的 Web 来说，这是一项艰巨的任务。但如果我们优先考虑服务器发送标记语言的作用、采用有效的缓存、尽可能使用 Web 平台并拥抱渐进增强，我们就可以避免向客户端交付昂贵的框架，并避免它们在启动和运行期间可能产生的昂贵开销。\n\
  \n尽可能快速移动似乎是首选——事实上，如果目标是比任何人都先进入市场可能确实如此——但这些选择产生的影响将不仅限于当下。你早期的技术选择可能会固化在你的项目中，导致日后修复它们引起的问题变得极其困难。早期且频繁地发布代码是一回事，但处理这种哲学带来的对用户敌视的后果完全是另一回事。\n\
  \n可持续的架构应该是让 Web 对更多人更易用。当架构扩展访问而非限制访问时，我们创建的体验更具韧性和容错能力。随着我们共同不断进步，我们将进一步探索这项良好工作所包含的细节。\n\
  \n# 第 3 章 衡量与评估 JavaScript 性能\n\n![](img/4.png)\n\n如果你在户外待过足够的时间，你就知道牛蝇了。它们是双翅目中的恐怖，降落在温血动物身上（无论是马还是人），并用像剪刀一样的口器吸血。\n\
  \n马虻蜂会杀死牛蝇，对于饲养牲畜的农夫来说是福音。更好的是，牲畜完全不会被这些蜂骚扰；它们接受这些蜂，因为它们的存在是有益的（图 3.1）。\n\n![黑金相间的马虻蜂特写。](img/3.1.png)\n\
  \n图 3.1：马虻蜂猎杀骚扰牲畜的牛蝇。照片拍摄：Howard Ensign Evans，科罗拉多州立大学，Bugwood.org ([`bkaprt.com/rjs39/03-01`](http://bkaprt.com/rjs39/03-01))，CC\
  \ BY 3.0 US ([`bkaprt.com/rjs39/03-02`](http://bkaprt.com/rjs39/03-02))，来自 Wikimedia\
  \ Commons。\n\n负责任使用 JavaScript 需要像马虻蜂那样的警惕，不断扫描它的领地以寻找烦人的牛蝇。你必须时刻关注 JavaScript 并抑制它最有害的影响，因为过度依赖它会将你的网站用户体验拖入“慢速镇”（Slow\
  \ Town）。在这种情况下，警惕需要衡量和评估你网站的 JavaScript 状况。\n\n当我们*衡量* JavaScript 性能时，我们想知道三件事：\n\
  \n1. 页面在启动期间感知上是快速且可用的？\n2. 如果不是，问题在哪里？\n3. 启动后主线程是否足够安静，以保持页面的可用？\n\n就像你不预先测量就无法可靠地将木材切割成合适的长度一样，在能够衡量之前，我们也无法评估\
  \ JavaScript 在网站和应用程序中的影响。## 指标：衡量 JavaScript 性能的关键\n\n在生活中，我们都依赖指标。我们检查室外温度以确保穿得合适；我们在开车时（希望）观察速度表以避免鲁莽驾驶；我们根据血检结果指导生活方式的选择，例如在甘油三酯过高时改变饮食。\n\
  \n性能指标对于做出明智决策同样至重要。它们也是影响 Google 网页排名的许多因素之一([`bkaprt.com/rjs39/03-03`](http://bkaprt.com/rjs39/03-03))）。搜索引擎希望为特定的查询呈现最好的网页，而糟糕的用户体验会干扰这一目标。\n\
  \n性能指标可以分为两类：\n\n* **实验室指标（Lab metrics）：**这些指标通过合成测试工具（如 WebPageTest、Lighthouse\
  \ 或你的浏览器开发者工具）收集。你可以通过它们建立一致基准，这在尝试解决开发问题时非常有用。\n* **字段指标（Field metrics）：**这些指标通过浏览器\
  \ JavaScript API 从网站访问者处收集，然后传输到远程数据存储进行后期分析。字段指标是黄金，因为它们讲述了真实用户体验网站性能的故事。\n\n了解哪些指标是什么有助于你理解它们如何适用于你的工作。某些指标属于以上两类，而另一些只属于其中一种。让我们看看指标可以描述的页面及\
  \ JavaScript 的一些常见方面。\n\n## 绘制（Painting）\n\n页面加载期间关键的可感知里程碑是页面内容被绘制到屏幕上。这是我们获取正在发生什么的第一个线索。每当浏览器在屏幕上绘制像素时，我们称之为绘制*painting*——那里有很多绘制指标。\n\
  \nJavaScript 对绘制指标的影响通常取决于标记是如何渲染的。标记的客户端渲染（我们在第 2 章讨论过的昂贵过程）与服务器发送的初始标记相比，可能会触发更晚的绘制事件。这一切被渲染客户端标记的脚本大小、网络速度以及脚本交付的方式所放大。\n\
  \n#### 首次绘制（First Paint）和首次内容绘制（First Contentful Paint）\n\n\n\n\n\n你会遇到的两种常见绘制指标是`首次绘制`（First\
  \ Paint，FP）和`首次内容绘制`（First Contentful Paint，FCP）。`FP` 标识*任何*像素绘制到屏幕上的第一个时刻，而 `FCP`\
  \ 则标识内容出现在视口中的时刻——即文本、图像、非白色的 `<canvas>` 元素等（图 3.2）。\n\n![随时间绘制的网站帧图，显示了首次绘制和首次内容绘制发生的时间。](img/3.2.png)\n\
  \n图 3.2：Chrome 性能分析器中的性能跟踪轨迹，显示了页面的首次绘制 (FP) 和首次内容绘制 (FCP)。`FP` 在灰色背景出现时发生，而 `FCP`\
  \ 在菜单切换按钮出现时发生。\n\n`FP` 通常与样式表的加载时间相关联，但它并不是一个非常重要的指标。第一个被绘制的内容在感知上可能并没有意义。\n\n\
  相比之下，`FCP` *确实*更有意义，因为它它是面向内容的。页面的核心内容可能会被阻塞，直到某个庞大的 JavaScript 包下载、处理并最终运行，在此过程中可能会调用后端\
  \ API 或渲染客户端标记。在那种情况下，`FCP` 可能会被延迟。\n\n虽然 `FCP` 是评估感知性能的一种诚实尝试，但*内容性*可能仅描述一个背景图像或无关紧要的文本节点。幸运的是，存在一种更精确的指标来描述更显著内容的绘制时间。\n\
  \n## 最大内容绘制\n\n`最大内容绘制 (Largest Contentful Paint，LCP)` 衡量的是视口中最大的内容块出现的时刻——无论是图像、视频还是文本节点（图\
  \ 3.3）。`LCP` 是对其他绘制指标的改进，因为它强调了内容的显著性，因此量化了更具感知意义的里程碑。\n\n![随时间绘制的网站帧图，显示在加载过程开始\
  \ 3,850 毫秒后出现了一个 19.8 毫秒的 LCP 事件。](img/3.3.png)\n\n图 3.3：Chrome 性能分析器中显示的 Chase\
  \ 银行网站的最大内容绘制 (LCP) 事件。`LCP` 由于页面页眉标记的客户端渲染而导致延迟。\n\n与 `FCP` 一样，在依赖 JavaScript 在客户端渲染内容标记的架构中，JavaScript\
  \ 会干扰 `LCP`。你的网站架构不应要求访问者在显著内容出现在屏幕之前等待 JavaScript 的加载、处理和运行。\n\n性能监控工具（如 WebPageTest\
  \ 和 Lighthouse）会报告 `LCP`。在编写期间，Google 建议 `LCP` 在 2.5 秒或以下为优（[`bkaprt.com/rjs39/03-04`](http://bkaprt.com/rjs39/03-04)），但未来的指导可能会有所不同。最好的建议是追求最高分，因为\
  \ `LCP` 会影响你的页面在搜索结果中的排名。\n\n## 布局稳定性\n\n你是否曾经试图点击一个链接，它却突然移动了，导致你点击了完全不同的东西？你不仅是网站违约的受害者，也是*布局不稳定*的受害者（图\
  \ 3.4）。\n\n![绘制 2,204 毫秒的网站帧图，显示了横幅和按钮等布局元素在加载时是如何移动的。](img/3.4.png)\n\n图 3.4：当\
  \ Currys PC World 网站上的多个页面元素加载时，其余布局移动了多次，导致关键交互元素发生不可预测的移动。\n\n布局不稳定的原因有许多，JavaScript\
  \ 就是其中之一。你几乎肯定体验过的一个例子是：一个通知在页面生命周期的后期出现在页面顶部，将整个布局向下推。这通常是因为脚本需要时间来加载、处理和运行，导致在最糟糕的时刻发生偏移。\n\
  \n所有的布局偏移——无论是由 JavaScript 引起还是其他原因引起——都会导致潜在的昂贵的布局重新计算工作，这会消耗主线程的时间。当布局偏移在启动期间争夺主线程的注意力时，留给\
  \ JavaScript 处理和执行的空间就变小了。\n\n确定用户是否可以预判布局偏移是非常重要的。可预期的布局偏移是用户自愿交互的结果，例如展开手风琴控件。不希望的布局偏移是那些看似随机的、没有任何预先用户交互的偏移。\n\
  \n例如，Twitter 的移动版网站——至少在编写期间——会自动加载推文。我们可以使用名为`累积布局偏移 (Cumulative Layout Shift，CLS)`\
  \ 的指标来衡量布局稳定性。与基于时间的指标不同，`CLS` 使用十进制系统来量化元素在视口中移动的距离（[`bkaprt.com/rjs39/03-04`](http://bkaprt.com/rjs39/03-04)）。良好的\
  \ `CLS` 分数为 0.1 或更低，但随着用户体验指标的演变，这可能会改变。在实践中，该指标越接近 0 越好。\n\n## 主线程响应性\n\nJavaScript\
  \ 有巨大的潜力会延迟页面启动。我们可以通过三个指标评估它对用户体验的影响：可交互时间（Time to Interactive，TTI）、首次输入延迟（First\
  \ Input Delay，FID）和总阻塞时间（Total Blocking Time，TBT）。\n\n### 可交互时间\n\n还记得那个把某人的桌面设成纯色的恶作剧吗？当我们发送过多的\
  \ JavaScript 时，基本上就会发生这种情况。`TTI` 较高的网站行为上更像网站的截图，而不是真实的网站。\n\n*可交互时间 (TTI)* 是一种实验室指标，用于衡量页面何时变得可交互。它的计算方法是首先标记页面的\
  \ `FCP`。从那里开始，下一个五秒内既没有长任务也没有超过两个正在进行的网络请求的也会被标记。页面的 `TTI` 就在那个安静窗口的开始处。在中端设备上，良好的\
  \ `TTI` 小于五秒（[`bkaprt.com/rjs39/03-07`](http://bkaprt.com/rjs39/03-07)），但尽管有重复的风险，我再次要求你尽可能降低。\n\
  \n### 首次输入延迟\n\n虽然 `TTI` 很棒，但它描述的是页面是否可交互，而不是该页面是否会对首次输入做出快速响应。`首次输入延迟 (FID)` 是一种字段指标，通过测量用户与页面首次交互到浏览器响应该交互之间的延迟来填补这一信息空白。\n\
  \n\n\n\n\nFID 并不严格是一个 JavaScript 指标。不依赖 JavaScript 的交互（如链接、表单控件等）仍然会纳入该指标的计算。然而，如果你严重依赖\
  \ JavaScript 来驱动交互，那么 FID 可能很好地反映出这一点。\n\nFID 初看似乎很简单，但确定高 FID 分数背后的原因却困难。用户与页面的首次交互因人而异。使用快速设备的用户可能因为过量的\
  \ JavaScript 活动而显示出高 FID 分数，而在同一页面上使用慢速设备的用户可能因为他们在主线程空闲时与页面进行了交互而显示出低 FID 分数。\n\
  \n排错高 FID 值的一种方法是对其进行上下文化，以便你知道在输入延迟期间发生了什么。你可以记录在 FID 发生前后由 `Long Task API`（[`bkaprt.com/rjs39/03-08`](http://bkaprt.com/rjs39/03-08)）产生的长任务。这就是我在我构建的一个小型指标收集脚本中所做的做法（[`bkaprt.com/rjs39/03-09`](http://bkaprt.com/rjs39/03-09)）。\n\
  \n作为一项实地指标，FID 的值范围很广，因此关注这些值的第 95 百分位（[`bkaprt.com/rjs39/03-10)`](http://bkaprt.com/rjs39/03-10)）是明智的。这种策略优先考虑那些经历极端输入延迟的用户。\n\
  \n### 总阻塞时间 (Total Blocking Time)\n\n虽然 TTI 和 FID 都都很好，但它们并没有衡量主线程在启动期间忙于无法承担更多工作的*总*时间。这正是\
  \ `Total Blocking Time (TBT)` 的用用场——它是一种实验室指标，用于测量页面 FCP 和 TTI 之间的时间窗口。TTI 和 FID\
  \ 测量的是不同的时间点，而 TBT 查看的是该窗口内所有长任务的总阻塞时间。\n\n总结一下，`long task` 是任何超过 50 毫秒的 JavaScript\
  \ 活动。长任务的`blocking time` 通过从总时间减去 50 毫秒算出（图 3.6）。如果一个长任务运行了 127 毫秒，它的阻塞时间就是 77 毫秒。\n\
  \n![任务被可视化为一个灰色条，阻塞时间用红色条纹覆盖在条的最后二之三上。](img/3.6.png)\n\n图 3.6：长任务阻塞时间的示意图。阻塞时间是长任务的长度减去\
  \ 50 毫秒。\n\n这意味着 TBT 并不惩罚*所有* JavaScript 活动——只是惩罚*过量的*活动。如果你的网站在启动期间执行了许多少于等于 50\
  \ 毫秒的任务，那么你的 TBT 分数将为零。TBT 还为糟糕的 TTI 分数提供了关键的上下文。\n\n良好的 TBT 分数在平均移动硬件上应为 300 毫秒或以下（[`bkaprt.com/rjs39/03-11`](http://bkaprt.com/rjs39/03-11)）。再次，尽量获得最低分。始终在使用低中端设备或\
  \ CPU 节流的合成测试工具中测量 TBT，避免在快速设备上进行测试。WebPageTest 在不同位置的一系列物理设备之一上运行测试，并在其结果摘要中报告\
  \ TBT（图 3.7）。\n\n![Web Vitals 报告示例，包括最大内容绘制、累积布局偏移和总阻塞时间。](img/3.7.png)\n\n图 3.7：WebPageTest\
  \ 的 Web Vitals 摘要包含 TBT，以及 LCP 和 CLS。\n\n你可能在好奇具体可以做什么来改进你网站的性能指标。在我们走这条漫长道路之前，我们需要查看性能剖析器（performance\
  \ profilers），以便你学习如何寻找特定的改进机会。\n\n## 性能剖析器 (Performance Profilers)\n\n合成工具擅长整洁地总结你网站的\
  \ JavaScript 性能。它们从`performance profiler`提供的数据得出这些总结——这是一种监控并记录页面上发生的所有活动（JavaScript\
  \ 或其他）的开发者工具。\n\n性能分析器存在于所有现代开发者工具中。无论你使用哪个浏览器的性能分析器，目标都是相同的：你希望对网站的性能有深入的解，以便找到特定的改进机会。\n\
  \n现代浏览器在放置性能分析器的位置上很大是一致的。首先，打开浏览器的开发者工具，寻找顶部的一系列标签页（图 3.8）。通常，浏览器的性能分析器位于标记为“Performance（性能）”或“Timeline（时间线）”的标签页下。\n\
  \n![Chrome 开发者工具的详情，显示一系列标签页：Elements、Console、Sources、Network、Performance（当前激活）和\
  \ Memory。](img/3.8.png)\n\n图 3.8：Chrome 开发者工具顶部的标签数组。Performance 标签打开 Chrome 的性能分析器。\n\
  \n### 理解已填充的性能剖析器\n\n在初始状态下，剖析器的界面是空的。你通过记录两类活动之一来填充数据：\n\n1. **启动活动**。这是指在启动期间发生的所有活动，从页面开始加载到\
  \ `window` 的 `onload` 事件触发后不久的期间。\n2. **特定活动**。你可以记录任何特定时间段，以分析特定操作（例如切换菜单）的性能。\n\
  \n所有性能剖析器都提供了记录控件。无论你记录什么种类型的活动，停止记录后都会发生相同的情况：剖析器会被观测期间的数据。\n\n第一次看到填充的性能剖析器可能就像被递了一份波音\
  \ 737 的操作手册并被告诉“酷，现在起飞”。幸运的是，一旦掌握了其组织后的几个概念，理解剖析器并不那么困难。事实上，你从第一章了解到浏览器将活动调度为任务，而任务发生在帧内。帧和任务发生在主线程上，剖析器将其可视化为时间的线性进展。\n\
  \n不同的浏览器呈现这些信息的方式不同，但仍然反映了任务/帧的层次结构。Safari 在线上或列表中绘制任务。Safari 还提供了按帧查看任务（图 3.9）。\n\
  \n![Safari 性能分析器的详情，按时间绘制帧，以及每个帧的任务分解。](img/3.9.png)\n\n图 3.9：在 Safari 的性能分析器中，帧以条形图表示；帧越长条越高。所选部分的活动以表格列出。\n\
  \nChrome 的剖析器采用了混合方法。它描绘单个帧，但任务以倒置火焰图的形式显示（图 3.10）。`flame chart` 是 JavaScript 调用栈的表示，每个任务的调用栈被可视化得像火焰。“火焰”的底部是任务的启动者，每个嵌套的活动堆叠在调用它的活动下方。\n\
  \n因为对任何巨大数据块进行总结都是有用的，大多数剖析器都提供了主线程活动的概览（图 3.11）。性能分析器的活动概览是交互式的，这意味着你可以点击并拖拽来选择时间范围，火焰图或任务列表将扩展或收缩到所选的时间段。\n\
  \nChrome 的剖析器在火焰图下方添加了一个面板，带有标签页，提供过滤控件，可以按持续时间、类型和名称筛选任务（图 3.12），以及观测期间所有 CPU 时间花在何处的总结。\n\
  \n我个人的观点是 Chrome 的剖析器在易用性和信息深度之间提供了最好的结合，但请使用最适合你的剖析器。最重要的是，你选择的剖析器应该帮助找到改进机会——而这从了解如何使用剖析器评估加载和运行时性能开始。\n\
  \n\n\n\n\n![Chrome 性能分析器使用倒置火焰图的详情，将调用堆栈显示为嵌套在每个函数下方的彩色条形。](img/3.10.png)\n\n图 3.10：Chrome\
  \ 性能分析器中主线程活动的可视化，将所有页面活动显示为倒置火焰图。\n\n![主线程活动概览示例，范围从 0 到 10,000 毫秒，并随时间推绘制了微型页面帧。](img/3.11.png)\n\
  \n图 3.11：Chrome 性能分析器的活动概览。\n\n![摘要、自下而上、调用树和事件日志标签，已高亮显示。下方的表格列出了脚本的任务和持续时间（毫秒为单位）。](img/3.12.png)\n\
  \n图 3.12：Chrome 性能分析器的底部面板。此面板有多个标签，用于显示摘要数据以及页面活动的详细列表。\n\n### 评估加载性能\n\n当你评估加载性能时，你实际上是在告诉分析器重新加载当前页面，并记录直到网络和主线程变得相当安静为止发生的所有事件。大多数浏览器的性能分析器都提供此类功能，它可以让你洞察任何特定页面在启动阶段发生的情况（图\
  \ 3.13）。\n\n![Chrome 性能分析器对 Amazon.com 加载性能的总结，包括活动概览、网络计时和火焰图。](img/3.13.png)\n\
  \n图 3.13：针对 Amazon 产品详情页的 Chrome 性能分析器填充视图。顶部是填充的活动概览。底部是火焰图，它显示了页面的所有调用堆栈。\n\n\
  正如你每天遇到的许多“哇，等一下”之类的信号一样，红色在 Chrome 分析器中具有特殊意义，因为它标出了性能问题。寻找问题的简单快捷方法是扫描分析器的活动概览并寻找红色条。这些条代表了阻塞时间（blocking\
  \ time）期间段——正如我们所建立的那样，阻塞时间等同于主线程过载。\n\n通过在活动概览中点击并拖动红色条，可以钻取问题区域（图 3.14）。由于火焰图会根据选择进行展开或收缩，我们能够更清楚地看到在该时间点发生了什么。\n\
  \n![上一个图中活动概览的孤立视图，高亮了时间线的一部分。顶部点缀着间歇性的红框。](img/3.14.png)\n\n图 3.14：Chrome 性能分析器中的活动概览，选择了一部分活动。顶部的红色条说明了阻塞时间段。\n\
  \n所有任务都以灰色显示，但长任务会在右上角显示一个红色三角形。此外，任务的阻塞部分——即超过 50 毫秒的部分——带有红色斜纹（图 3.15）。\n\n![由标记为“任务”的父级执行的子任务级联时间线，由一个填充了一半红色斜纹的灰色矩形表示。右上角标记为红色。](img/3.15.png)\n\
  \n图 3.15：一个长任务——在此视图中处于层级顶端——其右上角有一个红色三角形。任务的阻塞部分用红色斜纹标记。\n\n\n\n\n\n从这里，你可以通过点击调用栈的各个部分深入分析记录的交互，就像你在分析启动性能时做的那样。你可以访问相关信息，这些信息会准确告诉你是什么触发了交互，以及花费了多少时间。但注意：如果你正在调试生产网站上交互的运行时性能，你需要确保在发布\
  \ JavaScript 文件的同时也发布源映射（source maps）以辅助调试（[`bkaprt.com/rjs39/03-14`](http://bkaprt.com/rjs39/03-14)）。否则，在本地开发构建中对交互进行分析更有意义，因为代码没有经过压缩，可读性更高。\n\
  \n![性能分析器时间线，显示了与父任务阻塞部分相关的子任务。](img/3.19.png)\n\n图 3.19：在目标网站上切换设置菜单触发了一个耗时 490\
  \ 毫秒的任务。该任务的阻塞时间占任务总时间的 90% 左右，对于这样一个高价值的交互来说，这个比例是巨大的。\n\n通过测试各种交互来查看它们是否足够快可能像是一项机械的练习，但如果你想要获得更高的精确度（并且愿意付出更多精力），你可能会依赖\
  \ `User Timing API` 来带有应用特定时间戳的慢速交互（[`bkaprt.com/rjs39/03-15`](http://bkaprt.com/rjs39/03-15)）。\n\
  \n要让网站在所有需要的地方都尽可能快是一项巨大的工作。然而，如果你想让这些工作真正发挥作用，请务必在低端设备上测量网站的 JavaScript 性能，以便更容易发现潜在的性能问题——这正是你即将要学的！\n\
  \n### 在设备上测试\n\n在第 1 章中，我们提到了性能不仅在不同网络之间，在不同设备之间也存在。我们可以在 `WebPageTest` 这样的合成测试工具中观察这一点，它允许你在特定设备上运行测试，从该设备的视角来评估性能。在其结果页面上，你可以访问主线程活动可视化图，它们代表了不同的设备性能特征（图\
  \ 3.20）。\n\n![来自 WebPageTest 的两个火焰图，显示了主线程活动和页面交互性。页面交互性有间歇性的红色标记。](img/3.20.png)\n\
  \n图 3.20：顶部是 Moto G6 Android 手机的主线程，底部是 Alcatel 1X Android 手机。由于处理能力较低，Alcatel 1X\
  \ 产生了更多的阻塞时间。\n\n虽然 `WebPageTest` 对于快速抽检很有用，但在开发期间使用它会遇到瓶颈。首先，`WebPageTest` 只能访问公开可的\
  \ URL。其次，它执行任务需要花费相当长的时间。当你需要快速测试和重新测试代码更改如何影响低端设备的性能时，这些限制会非常头疼。\n\n本地测试的更好替代方案是\
  \ Chrome 的远程设备调试工具，它可以为连接到笔记本电脑或台电脑的 Android 设备启动开发者工具实例。如果连接的设备启用了 USB 调试（[`bkaprt.com/rjs39/03-16`](http://bkaprt.com/rjs39/03-16)），你可以通过将\
  \ Chrome 指向 `chrome://inspect#devices`，在主机的开发者工具中访问设备在 Chrome 中打开的任何页面（图 3.21）。\n\
  \n你可以通过点击页面的 `Inspect` 链接从调试工具的主界面启动 Chrome 开发者工具实例。从那里，你可以像往常一样使用 Chrome 的性能分析器来记录页面活动（图\
  \ 3.22）。\n\n![Chrome 开发者工具中的“Devices”配置标签页。(image/3.21.png)图 3.21：Chrome 远程设备调试工具的入口。当\
  \ Android 设备启用了 USB 调试且在其 Chrome 实例中打开了页面时，将列出其活动标签页。正如人们所说的，这是一件大事，因为完全改变了你的性能分析上下文。很有可能，你的开发机比大多数人们浏览互联网时使用的设备要强得多。当你在资源受限的设备上使用\
  \ Chrome 性能分析器时，你会发现那些在配置完善的笔记本电脑上看起来无异常的问题。![Chrome 性能分析器旁边是在浏览器窗口内运行的模拟 Android\
  \ 设备。](img/3.22.png)\n\n图 3.22：你可以使用 Chrome 的性能分析器来记录连接的 Android 设备的活动；它甚至可以在性能分析器旁边显示设备的显示内容。\n\
  \nChrome 不允许你对连接的 iOS 设备这样做，但如果你在启用了开发者工具的 macOS 主机上，Safari 是可以的（[`bkaprt.com/rjs39/03-17`](http://bkaprt.com/rjs39/03-17)）。将\
  \ iOS 设备连接到 macOS 主机，你可以通过主机上的 `Develop` 菜单检查在 Safari 中打开的页面。连接的 iOS 设备名称将作为一个单独菜单选项出现，下方列出已打开的页面（图\
  \ 3.23）。点击页面 URL 将启动 Safari 开发者工具实例，包括性能分析器。\n\n![Safari 的“develop”菜单已打开，高亮了“Jeremy’s\
  \ iPhone”菜单项。“Safari”下有一个可选择的项。](img/3.23.png)\n\n图 3.23：Safari 的远程设备调试允许对连接到 macOS\
  \ 主机的 iOS 设备进行远程调试。虽然这很有用，但是时候说些真话了：在 2021 年 4 月，StatCounter Global Stats 发现，在全球调查的设备中，41.6%\
  \ 是 Android 设备，而 iOS 仅占 16.07%（[`bkaprt.com/rjs39/03-18`](http://bkaprt.com/rjs39/03-18)）。如果你不确定应该分析哪些设备，请使用旧的、性能较差的硬件进行测试。你会发现更多问题，是的，但修复这些问题会让所有人受益，而不仅仅少数买得起高端硬件的富人。你需要了解你网站的\
  \ JavaScript 是如何损害访问者的信任的。这正是负责任的 Web 开发从业者应该做的。\n\n[等待]\n\n所以，我们已经讨论了一些实验室指标（lab\
  \ metrics）、实地指标（field metrics）以及性能分析。事实是，我们讨论的大部分内容等同于合成性能测试，即从你的本地机器使用 `Lighthouse`、性能分析器或——如果你足够高端——使用像\
  \ `WebPageTest` 这样从一致基准运行性能测试的工具。当你使用这些工具时，你正在收集实验室指标。\n\n实验室数据对于从开发者视角衡量性能基准非常有帮助。你测试并发现了一个问题，例如一个巨大的\
  \ JavaScript 资源导致启动性能下降。你优化了一些内容，再次测试，并记录实验室指标中的变化。这些很有用。\n\n遗憾的是，实验室指标只能描述一个人的视角：即运行合成测试的人。如果你想真实了解你的网站对现实世界中的用户表现如何，你需要收集并分析实地指标。\n\
  \n### 收集实地指标\n\n在收集后期分析的实地指标方面，有很多工具，它们在成本、功能和质量上不相同。收集工具总是需要一些客户端 JavaScript 从浏览器\
  \ API 收集数据并发送到收集端点。有一些开源选项可以帮你收集这些数据——例如 `Boomerang`——或者你可以自己动手。\n\n\n\n\n\n如果你只需要收集少数核心指标，一个简单的小方案就能奏效。对于我自己的项目，我编写了一个名为\
  \ `grab-vitals` 的自定义解决方案（[`bkaprt.com/rjs39/03-20`](http://bkaprt.com/rjs39/03-20)），它使用了\
  \ Google 的 `web-vitals` npm 包来收集之前讨论的性能指标：\n\n```javascript\nwindow.addEventListener(\"\
  load\", () => {\n  import(\"grab-vitals\").then(({ grabVitals }) => {\n    grabVitals(\"\
  https://interslice.compuhyperglobalmega.net/collect\");\n  });\n});\n```\n\n`grabVitals`\
  \ 函数接受一个指向 `URL` 的 `string`，页面的性能指标将作为 `JSON` 字符串发送到该地址进行收集。为了避免在启动期间占用主线程，`grabVitals`\
  \ 方法在页面 `load` 事件触发后才会被被调用。\n\n如果你决定自己实现解决方案，请记住以下几点：\n\n*   Google 的 `web-vitals`\
  \ 包在没有填充性代码（polyfills）的情况下无法在所有浏览器中收集所有指标。这意味着在某些浏览器上加载它可能会导致产生未使用的代码。`grab-vitals`\
  \ 通过使用动态 `import` 绕过了这个问题——这是我们将在第 4 章介绍的代码拆分技术。\n*   使用 `requestIdleCallback` ([`bkaprt.com/rjs39/03-21`](http://bkaprt.com/rjs39/03-21))\
  \ 来避免与关键交互产生主线程竞争。任何关键交互都不应该为了收集指标而让路。该 API 将在第 6 章介绍。\n*   批量收集的指标以避免对收集端点进行过度调用，这涉及巨大的挑战。`grab-vitals`\
  \ 通过监听页面的 `visibilitychange` 事件以及 Safari 的 `pagehide` 事件（[`bkaprt.com/rjs39/03-22`](http://bkaprt.com/rjs39/03-22)）来补偿这一点。\n\
  *   你需要决定使用 `fetch` 还是 `navigator.sendBeacon` ([`bkaprt.com/rjs39/03-23`](http://bkaprt.com/rjs39/03-23))\
  \ 将字段指标发送到你的收集端点。`navigator.sendBeacon` 使用起来比 `fetch`get，且不会通过延迟文档卸载来延迟导航，但 `fetch`\
  \ 提供了更好的控制能力。\n\n这些内容很难！使用现成工具并不总是个坏主意，即使它是付费产品。只需知道，如果你决定与供应商合作收集字段数据，你应该通过提问来确保他们的收集方法解决了上述这些问题。\n\
  \n在指标的存储方面，这需要一个应用程序后端和一个数据库（[`bkaprt.com/rjs39/03-24`](http://bkaprt.com/rjs39/03-24)）。你如何存储指标并不重要，只要你能以一种舒适且熟悉的方式访问它们即可。\n\
  \n### 分析字段指标的技巧\n\n无论你是依赖供应商产品来收集指标，还是自己实现解决方案，在分析数据存储器中的字段指标时，有几点需要考虑：\n\n*   **避免使用平均值！**\
  \ 虽然平均值很容易计算，但它们解释性能的方式并不如你认为的那样（[`bkaprt.com/rjs39/03-25`](http://bkaprt.com/rjs39/03-25)）。由于大量的字段指标包含许多离群值，平均值往往会偏斜。\n\
  *   **关注分位数。** 第 75、90 和 95 分位数特别有价值，因为这些区间往往会强调较慢的体验而非快速的体验。\n*   **特别关注第 90 分位数及以上。**\
  \ 在这里你将看到较慢设备和糟糕的网络条件如何影响性能。解决这个范围内的痛点，无论用户的网络连接或设备有多快，都能让你的网站对所有人运行更快。\n*   **使数据上下文化。**\
  \ 单的指标只能传达简单的结论，例如“这是你的页面可交互的时候”。如果你正在评估供应商产品，请查看它是否收集了设备信息和来自 `Long Tasks API`\
  \ 的长任务数据。如果你是自己实现，请自己存储这些数据。这将让你更深入了解为什么某些用户遇到了问题而其他用户没有。\n\n如果你只遵循一条建议，请关注分位数！分位数在总结字段指标的结果范围方面非常有价值。假设我们有一个\
  \ JavaScript 较少的网站，有 312 条 `LCP` 记录：\n\n| 分位数 | 最大内容绘制 (Largest Contentful Paint)\
  \ |\n| --- | --- |\n| 第 25 | 237 毫秒 |\n| 第 50 | 619 毫秒 |\n| 第 75 | 1,503 毫秒 |\n\
  | 第 90 | 3,693 毫秒 |\n| 第 95 | 8,120 毫秒 |\n\n如果我们对所有记录取平均值，将得到大约 1,707 毫秒。虽然这并不算不上一个糟糕的\
  \ `LCP` 分，但它是无法反映实际会话的值堆砌。它接近第 75 分位数。\n\n\n\n\n\n```javascript\nimport PageContainer\
  \ from \"./PageContainer.js\";\n```\n\n```javascript\nimport { BlogPost } from \"\
  ./Components.js\";\n```\n\n上述的 `import` 语句是`静态导入`（static imports）。静态导入将外部模块整合到当前脚本的作用域中。上述代码的第一行和第二行分别了如何导入命名导出（named\
  \ exports）和默认导出（default exports）。\n\n这展示了相应导出类型的实际应用：\n\n```javascript\nconst PageContainer\
  \ = () => { /* Omitted code */ };\n```\n\n```javascript\nconst BlogPost = () =>\
  \ { /* Omitted code */ };\n```\n\n```javascript\n// Default export\n```\n\n```javascript\n\
  export default PageContainer;\n```\n\n```javascript\n// Named export\n```\n\n```javascript\n\
  export BlogPost;\n```\n\n无论你使用命名导出还是默认导出，对于理解静态导入的局限性并不重要：\n\n- 模块标识符（module specifier）——即\
  \ `from` 关键字之后用于指定模块位置的字符串——只能是一个普通字符串。\n- 静态导入只能出现在文件的顶部。\n\n这些限制使得静态导入只能能够立即加载代码，无论该代码是否在启动时执行。为了解决这一限制，人们开发了一种更灵活的\
  \ `import` 语法，即`动态导入`dynamic import）（[`bkaprt.com/rjs39/04-02`](http://bkaprt.com/rjs39/04-02)）。\n\
  \n`dynamic imports` 与静态导入相似，不同之处在于可以放在代码的任何地方，并且依赖于承诺（promises）：\n\n```javascript\n\
  import(\"/js/module.js\").then(module => {\n```\n\n```javascript\n // Access the\
  \ default export\n```\n\n```javascript\n module.default();\n```\n\n```javascript\n\
  \ // Access a named export\n```\n\n```javascript\n module.namedModule();\n```\n\n\
  ```javascript\n}).catch(error => {\n```\n\n```javascript\n // Something went wrong!\n\
  ```\n\n```javascript\n console.warn(error);\n```\n\n```javascript\n});\n```\n\n\
  虽然这种语法比静态导入冗长，但它更大的灵活性意味着我们可以在选择的时间启动后加载额外的 JavaScript。这让我们对启动时加载的代码量具有更大的控制权，从而可以带来重大的性能收益。\n\
  \n### 代码拆分 (Code splitting)\n\n动态导入使得`code splitting`成为可能（[`bkaprt.com/rjs39/04-03`](http://bkaprt.com/rjs39/04-03)）。代码拆分是一种性能优化手段，将任何启动时不需要的\
  \ JavaScript 从应用程序逻辑中分离出来，转而从单独脚本资源按需加载。\n\n“我为什么要关心代码拆分？”你可能会说。允许我详细说明一下：很有可能你正在发送一些未使用的\
  \ JavaScript。HTTP Archive 在其 2020 年年鉴中披露，中位数体验发送的 JavaScript 大约 37% 是未使用的（[`bkaprt.com/rjs39/04-04`](http://bkaprt.com/rjs39/04-04)）。这是大量的千字节在毫无理由地负担着设备并白费了计费流量。而这只是`中位数`体验——你的项目发送的未使用\
  \ JavaScript 可能比这更多！\n\n所以我们必须拆分，也也将拆分！然而，代码拆分的第一步是寻找机会。用户交互几乎总是潜在的代码拆分机会，这意味着我们将寻找由于明确交互而触发的事件监听器。\n\
  \n隐藏在 `click` 事件中的代码（例如 JavaScript 驱动的表单验证）就是代码拆分的一种机会。在 `click` 事件中运行的脚本是`延迟行为`(deferred\
  \ behavior）的典型示例，因为与其相关的 JavaScript 在启动期间不会运行。正如 HTTP Archive 所示，无论是否会被使用，我们经常加载这些行为的脚本，尽管它们可以按需加载。\n\
  \n另一个延迟交互的良好例子是 `<form>` 元素的 `submit` 事件。该事件是通过放置恰当的动态导入来延迟加载 JavaScript 的绝佳机会：\n\
  \n```javascript\nconst contactForm = document.getElementById(\"contact-form\");\n\
  ```\n\n```javascript\nconst inputs = contactForm.querySelectorAll(\"input, textarea\"\
  );\n```\n\n```javascript\ninputs.forEach(input => {\n```\n\n```javascript\n input.removeAttribute(\"\
  required\");\n```\n\n```javascript\n input.removeAttribute(\"pattern\");\n```\n\n\
  ```javascript\n});\n```\n\n```javascript\ncontactForm.addEventListener(\"submit\"\
  , event => {\n```\n\n```javascript\n event.preventDefault();\n```\n\n```javascript\n\
  \ import(\"/js/contact-form-validation.js\").then(module => {\n```\n\n```javascript\n\
  \ const [state, errors] = module.isFormValid(inputs);\n```\n\n```javascript\n if\
  \ (state) {\n```\n\n```javascript\n contactForm.submit();\n```\n\n```javascript\n\
  \ return;\n```\n\n```javascript\n }\n```\n\n```javascript\n // TODO: Error processing\
  \ code here\n```\n\n```javascript\n });\n```\n\n```javascript\n});\n```\n\n点击提交后，你将不得不等待动态导入获取验证脚本（这是我们稍后会详细讨论的一个可能的缺点）。尽管如此，它也是一个很好的动态导入示例，也是渐进增强（progressive\
  \ enhancement）应用的绝佳示例。\n\n由于服务器发送了带有 `required` 和 `pattern` 属性的 `<form>` 标记，我们需要在自定义验证逻辑工作之前移除它们。然而，如果验证脚本加载或执行失败，表单仍然具有\
  \ HTML 本身提供的`某些`验证能力。虽然不理想，但这种冗余功能仍然节省了我们往返服务器验证所有输入内容的次数（你本就应该这么做）。\n\n在表单的 `submit`\
  \ 事件回调中，我们调用 `event.preventDefault()` 来防止表单提交。之后，我们动态导入模块，该模块包含一个名为 `isFormValid`\
  \ 的单一导出。\n\n这只是动态导入很有用的的一种交互类型。如果你的网站上有许多功能，可能还有更多考虑的点，例如 `click`、`hover`、`focus`\
  \ 和 `blur`。\n\n### 选择性地功能填充 (Selectively polyfilling features)\n\n`polyfilling`\
  \ 是使用 JavaScript 在不支持它们的浏览器中提供特定网络平台 API 的做法。这通常是必要的做法，但如果你不小心只针对那些需要它的地方投放，它也会增加未使用\
  \ JavaScript 的数量。\n\n国际化 API（Internationalization API）的各个部分都是很好的例子。`Intl.relativeTimeFormat`\
  \ 非常有用，因为它能为英语区域自动生成如“3 天前”之类的相对时间字符串——或者大量其他语言：它在各种语言区域都提供了这种能力，这项常见（但复杂）的任务由浏览器内部处理，而不需要像\
  \ Moment.js 这样重量级的库，它的重量是 300 千字节（[`bkaprt.com/rjs39/04-05`](http://bkaprt.com/rjs39/04-05)）。\n\
  \n在编写时，并非所有浏览器都支持国际化 API。对于 `Intl.relativeTimeFormat` 及其在更广泛 API 中的依赖项，存在 polyfills。然而，取决于你需要填充的程度，你可能会发送二十或更多千字节在某些浏览器中未使用的\
  \ JavaScript，这可能会导致启动变慢。\n\n我们可以依靠动态导入来防止不必要的填充填充发生，国际化 API polyfills 的维护者已经在 Node.js\
  \ 开发环境中演示了如何做到：\n\n```javascript\nimport { shouldPolyfill } from \"@formatjs/intl-relativetimeformat/should-polyfill\"\
  \n```\n\n```javascript\nasync function polyfill (locale) {\n```\n\n```javascript\n\
  \ if (shouldPolyfill()) {\n```\n\n```javascript\n await import(\"@formatjs/intl-relativetimeformat/polyfill\"\
  )\n```\n\n```javascript\n }\n```\n```\n\n\n\n\n\n```javascript\nif (Intl.RelativeTimeFormat.polyfilled)\
  \ {\n  switch (locale) {\n    default:\n      await import(\"@formatjs/intl-relativetimeformat/locale-data/en\"\
  );\n      break;\n    case \"fr\":\n      await import(\"@formatjs/intl-relativetimeformat/locale-data/fr\"\
  );\n      break;\n  }\n}\n```\n\n这段代码段为一个同时使用英语和法语区域的网站处理 `Intl.relativeTimeFormat`\
  \ 的垫填充（polyfilling）。在这里，我们从 polyfill 中导入了一个命名为 `shouldPolyfill` 的工具方法。如果该方法确定垫填充\
  \ 确是必要的，它就会垫填充 `Intl.relativeTimeFormat`，然后根据 `locale` 的值动态导入区域数据。\n\n这远不是可以使用使用\
  \ `dynamic import`（动态导入）来选择性地垫填充 Web 平台功能的唯一情况。每当你考虑使用 polyfill 时，请花一点时间研究并检查 Can\
  \ I Use ([`bkaprt.com/rjs39/04-07`](http://bkaprt.com/rjs39/04-07))，看看你正在垫填充的特性支持程度如何。然后，就如何采取后续操作做出明智的决策。\n\
  \n无论你是使用动态导入来条件地垫填充浏览器 API，还是推迟应用程序脚本直到需要时再加载，结果都是相同的：你减少了启动期间加载的 JavaScript 数量，从而减少了该过程中的处理和阻塞时间。\n\
  \n## 抢占先机\n\n如果你的网站严重依赖 JavaScript，那么网络的顽固特性意味着请求脚本时产生的延迟将延长启动阶段。为了领先于这一混乱局面并缓解高延迟环境带来的痛苦，我们可以采用几种技术中的一种（或多种）。简而言之，我们越快能获取到这些脚本，浏览器处理它们的速度就越快。\n\
  \n### 自托管：一个虽然平淡但有效的技巧\n\n加载性能完全取决于连接，当浏览器打开通往 Web 服务器的连接时，会发生一种复杂的“舞蹈”（见图 4.2）：\n\
  \n1. 域名必须通过 `DNS lookup`（DNS 查询）解析到 Web 服务器的 IP 地址。\n2. 大多数 Web 服务器通过 `transmission\
  \ control protocol`（传输控制协议，即 `TCP`）进行通信。`TCP` 连接需要时间建立，且 `TCP handshake`（TCP 握手）和\
  \ `slow start`（慢启动）因素都会影响 Web 服务器响应的速度 ([`bkaprt.com/rjs39/04-08`](http://bkaprt.com/rjs39/04-08))。\n\
  3. 如果涉及 `HTTPS`，`transport layer security`（传输层安全，即 `TLS`）协商也需要时间。\n\n`HTTP/3` 减少了连接和\
  \ `TLS` 协商涉及延迟。尽管如此，无论使用 `HTTP/3` 还是其他，总会有某些延迟。这就是为什么自托管是一种平淡但有效的性能增强，不仅针对 JavaScript，而且适用于所有资源类型。\n\
  \n![Chrome 开发者工具中的表格，显示了连接阶段的延迟时间：挂起、DNS 查询、初始连接和安全套层。](img/4.2.png)\n\n图 4.2：Chrome\
  \ 开发者工具网络标签页中所示的连接 Web 服务器各个阶段涉及的延迟。\n\n自托管值得讨论，因为看到从 `cdnjs` 等公共 CDN 加载资源并不罕见 ([`bkaprt.com/rjs39/04-09`](http://bkaprt.com/rjs39/04-09))。虽然公共\
  \ CDN 可能有用，因为它们消除了托管流行库和框架的负担，但你必须权添加另一个跨源（即除你自己之外的任何 Web 服务器）的延迟成本与托管自己资源之间的关系（见图\
  \ 4.3）。\n\n![WebPageTest 的连接视图，列出了网站使用的所有源。每行代表一个独立的连接，显示 DNS 查询（青色）、连接（橙色）和 TLS\
  \ 协商时间（紫色）。](img/4.3.png)\n\n图 4.3：WebPageTest 的连接视图，列出了网站使用的所有源。每行代表一个独立的连接，显示\
  \ DNS 查询（青色）、连接（橙色）和 TLS 协商时间（紫色）。\n\n一个常见的误区是公共 CDN 由于 `shared caching`（共享缓存）提供了额外的性能收益。共享缓存的想法是，如果你访问一个请求（例如）托管在公共\
  \ CDN 上的 `React` 副本的网站，当另一个网站从同一位置请求该 `React` 副本时，应该从浏览器缓存中提取同一个 `React` 副本。\n\n\
  虽然这在理论上是一个受欢迎的优化，但在实践中并不存在，因为浏览器会对主源（即你的 Web 服务器）针对跨源请求进行键值，导致缓存未命中 ([`bkaprt.com/rjs39/04-10`](http://bkaprt.com/rjs39/04-10))。从性能角度来看，使用公共\
  \ CDN 没有任何优势。\n\n对于 JavaScript，自托管通过减少延迟缩短了加载阶段，这意味着浏览器可以更早进入处理阶段。\n\n### 使用资源提示“润滑”\n\
  \n在某些情况下，自托管并不总是在实践上可行的，这时 `resource hints`（资源提示）可以帮助减少跨源资源的延迟。`Resource hints`\
  \ 使用 `<link>` 元素引导浏览器更早地获取资源或打开跨源连接。它们的使用对于加速 JavaScript 加载至关重要，使网站能够更快地变得可交互。\n\
  \n### 减少连接延迟\n\n源顺序描述了 HTML 中元素的顺序，当涉及 JavaScript 时，其重要性可能会被忽视。浏览器流式传输 HTML，并将解析工作切分成可以处理的部分。由于由于，位于标记末部的脚本引用直到浏览器解析它们时才会被发现。当这些脚本位于跨源时，这会增加跨源资源的延迟（见图\
  \ 4.4）。\n\n然而，通过 `preconnect`，我们可以在服务器开始处理 HTML 时打开跨源连接，只需在文档 `<head>` 中放置资源提示：\n\
  \n```html\n<link rel=\"preconnect\" href=\"https://syndication.twitter.com/\">\n\
  <link rel=\"preconnect\" href=\"https://pbs.twimg.com/\">\n<link rel=\"preconnect\"\
  \ href=\"https://www.google-analytics.com/\">\n```\n\n通过更早地协商跨源连接来提高性能，而不是等待浏览器按发现它们（见图\
  \ 4.5）。\n\n![按域名分类的页面请求时间线，每个资源的类型彩色编码。](img/4.4.png)\n\n图 4.4：WebPageTest 的连接视图。第二行和第三行是跨源，连接在\
  \ HTML 解析器发现它们提供的资源之前尚未建立。\n\n当无法托管资源时，`preconnect` 是一种替代方案，可以减少加载跨源资源产生的延迟。这是一种有效且简单的性能优化，其影响比你想象的要大。\n\
  \n### 预加载关键 JavaScript\n\n*Critical path*（关键路径）是 Web 性能中的一个概念，描述了渲染页面内容所需的请求数量 ([`bkaprt.com/rjs39/04-11`](http://bkaprt.com/rjs39/04-11))。`HTML`\
  \ 和 `CSS` 文件是关键路径上典型的请求示例，因为没有它们就没有页面可言（见图 4.6）。\n\n\n\n\n\n![css-tricks.com 发起的请求时间轴。在“frames”面板中，缩略图显示了页面渲染进度，仅在初始请求完成后才开始。](img/4.6.png)\n\
  \n图 4.6：在 Chrome 性能分析器中，CSS-Tricks 的 HTML 和 CSS 关键请求（在顶部网络面板显示）分别用蓝色和紫色阴标记。这些资源在页面绘制（paints）之前是必须的——在底部的计时器面板中显示为\
  \ `FP` 和 `FCP`。\n\nCSS 和 HTML 并不是唯一可以出现在关键路径上的资源类型。在第 2 章中，我们讨论了客户端渲染的标记比服务器提供的标记更耗资源。除了解析和执行\
  \ JavaScript 以渲染标记的计算开销外，客户端渲染的标记也是一种性能瓶颈，因为它将 JavaScript 放入了关键路径。这是一个遗憾的非常常见的模式（图\
  \ 4.7）。\n\n![由一个 Twitter URL 发起的 JS 请求时间轴。“Frames”包含一个 Twitter 图标的缩略图，在发出请求时没有进度，直到请求完成后显示出渲染后的页面。](img/4.7.png)\n\
  \n图 4.7：关键 JavaScript 请求阻塞了移动端 Twitter Web 应用设置页的渲染。虽然加载屏出现很快，但浏览器必须等待脚本加载（在顶部面板用黄色显示）之后页面才能完全渲染。\n\
  \n幸运的是，`preload` 资源提示有助于在浏览器通常发现它们之前加载资源，从而缓解这一问题。\n\n假设你有一个页面，在闭合的 `</body>` 标签之前加载了两个脚本。第一个包含第三方脚本——可以想成框架和库。第二个包含你的应用程序逻辑：\n\
  \n```\n<script src=\"/js/vendors.ae6fd23c.js\"></script>\n```\n\n```\n<script src=\"\
  /js/scripts.1db3ef48.js\"></script>\n```\n\n`preload` 通过改变浏览器对页面资源的发现顺序，规避了对 HTML\
  \ 解析器的等待：\n\n```\n<link rel=\"preload\" as=\"script\" href=\"/js/vendors.ae6fd23c.js\"\
  >\n```\n\n```\n<link rel=\"preload\" as=\"script\" href=\"/js/scripts.1db3ef48.js\"\
  >\n```\n\n通过在 `<head>` 中这些提示，浏览器发现这些脚本的时间会比我们等到它在文档末尾发现它们要早。当浏览器遇到页面底部相应的 `<script>`\
  \ 元素时，它们至少加载了一部分。\n\n为什么，是的，`preload` 确实有一些权衡：\n\n*   读这一遍，再重读一遍：如果你的网站上显示关键内容需要\
  \ JavaScript，那么你已经处于麻烦之中。`preload` 可以作为解决你由 JavaScript 引起的加载性能问题的良药，但其他关键资源（如样式表、Web\
  \ 字体等）将失去带宽，因为你实际上重新将 JavaScript 的优先级置于它们之上。要从问题的根源解决——即 JavaScript——通过让服务器提供该内容标记而不是依赖客户端渲染，从而将其从关键路径中移除（[`bkaprt.com/rjs39/04-12`](http://bkaprt.com/rjs39/04-12)-12](http://bkaprt.com/rjs39/04-12)）。\n\
  *   `preload` 提示需要一个 `as` 属性来描述资源的性质（[`bkaprt.com/rjs39/04-13`](http://bkaprt.com/rjs39/04-13)）。对于脚本，此值应该是\
  \ `script`。如果你是个 `as`hole（混蛋）且没有指定 `as`，预加载的响应将被丢弃。\n*   因为 `preload` 被赋予更高的优先级，其他请求可能会失去带宽。请谨慎使用\
  \ `preload`。如果一切都是高优先级，那么就都没有高优先级了。\n*   如果你正在预加载一个 JavaScript 模块——即通过带有 `type`\
  \ 属性值为 `module` 的 `<script>` 元素加载的脚本——你不需要 `preload`。你需要的是 `modulepreload`，它遵循与\
  \ `preload` 相同的格式，但不需要那些 `as` 属性的麻烦。`modulepreload` 还带有解析方面的优势，这些是 `preload` 无法获得的，例如递归预加载整个模块树，以及推测性解析的优势（[`bkaprt.com/rjs39/04-14`](http://bkaprt.com/rjs39/04-14)）。\n\
  \n撇开权衡不谈，`preload` 是有效的，特别是对于 Web 应用架构中的关键 JavaScript，坦率说，它们需要尽可能的帮助来提高性能。请负责任地使用它，并像往常一样，衡量收益以查看它是否适用于你的项目。\n\
  \n### 按需预加载 JavaScript\n\n记得早些时候我们闲聊代码分割和动态导入吗？嗯，那整个场景的缺点之一是，如果你将脚本加载推迟到需要它的那一秒，那么那些在慢网络连接上的用户会发现自己必须等待你的动态导入完成，他们所执行的操作才会启动。\n\
  \n这并不意味着代码分割是一种反模式；它意味着我们需要稍微思考一下如何解决延迟的劣势。考虑之前提到的联系表单示例，它依赖动态导入在提交时获取表单验证脚本。在表单验证脚本下载和运行之前，有一段延迟（图\
  \ 4.8）。\n\n这种延迟是令人沮丧的：当有人提交表单时，他们期望从页面收到信号，表明他们的操作正在处理中。但在他们的某些脚本执行之前，*没有任何*事情正在发生。\n\
  \n![包含表单的缩略图，在发出请求时没有进度，直到请求完成后显示。](img/4.8.png)\n\n图 4.8：在这次分析会话中，下载表单验证脚本需要大约两秒，导致了延迟。\n\
  \n这种这种情况并不会消除良好的动态导入带来的性能优势，但我们确实需要调整策略。让我们从一个小型函数开始，它能按需向 `<head>` 注入 `preload`：\n\
  \n```\nfunction injectPreload (href, module, as) {\n  let preloadHint = document.createElement(\"\
  link\");\n  preloadHint.rel = module ? \"modulepreload\" : \"preload\";\n  preloadHint.href\
  \ = href;\n  if (!module && typeof as !== \"undefined\") {\n    preloadHint.as =\
  \ as;\n  }\n  document.head.appendChild(preloadHint);\n}\n```\n\n[/content-content]\n\
  \n该函数接收三个参数：\n1. 要预加载脚本的位置\n2. 一个是否为模块的布尔值；如果是，资源提示将是 `modulepreload` 而不是 `preload`\n\
  3. 用于填充提示 `as` 属性的值\n\n运行时，该函数会构建资源提示并将 `<link>` 元素注入到 `<head>`。这触发了获取脚本的请求。\n\n\
  剩下的就是找到触发 `preload` 的正确时机。由于这是一个表单，理想的时机是当任何表单字段获得焦点时；用户填写表单字段的操作为我们赢得了时间：\n\n```\n\
  const inputs = Array.from(document.querySelectorAll(\"#contact-form input, .contact-form\
  \ textarea\"));\nlet preloaded = false;\n\ninputs.forEach(input => {\n  input.addEventListener(\"\
  focus\", () => {\n    if (!preloaded) {\n      injectPreload(\"/js/contact-form-validation.js\"\
  , false, \"script\");\n      preloaded = true;\n    }\n  }, {\n    once: true\n\
  \  })\n});\n```\n\n这确保我们的表单验证脚本只有在用户关注表单中的任何输入框时才会被预加载，且只加载一次。这是对意图的练习：如果有人关注了表单字段，他们可能打算填写表单，预加载可能会在他们操作之前完成。\n\
  \n一旦表单提交并启动动态导入，验证脚本将已经在浏览器缓存中了。这意味着动态导入将命中浏览器缓存而不是网络，使交互几乎是瞬间完成的（图 4.9）。\n\n\n\n\
  \n\n这种机会性方法利用了代码分割的优势，同时尽可能地减少了推迟脚本加载时带来的延迟。这已经是我们接近*既要鱼又要兼得*的极限了。\n\n![包含一个渲染后的表单的缩略图、一个对页面没有产生影响的传输脚本，然后一个显示无效表单输入的缩略图。](img/4.9.png)\n\
  \n图 4.9：由于在表单提交之前预加载了该脚本，通过动态导入获取表单验证脚本的延迟实际上被消除了。\n\n资源提示（resource hints）的总体目标是：如果我们作为开发者能尽一切努力减轻\
  \ JavaScript 在启动期间的负面影响，我们就可以提高加载和运行性能。记住，`responsible`（负责任）这个词是 `Responsible JavaScript`\
  \ 中的核心支撑词汇。资源提示是工具箱中的另一个工具，可以帮助我们履行这一义务。\n\n## 帮助用户节省数据\n\n想象一下，如果我们只为单一硬件开发程序，我们的工作会变得容易得多。如果是如此，这本书就不需要存在了。我们现在应该已经学会如何负责任地使用\
  \ JavaScript。\n\n但是，*天哪*，我们要为数以千计的设备和网络环境开发。限制条件因用户而异，这使得构建高性能架构变得极具挑战性——但我们对用户有责任适应他们的需求。\n\
  \n如果你在美国的农村地区待过哪怕一分钟，你就知道寻找快速可靠的网络连接可能是一场噩梦（[`bkaprt.com/rjs39/04-15`](http://bkaprt.com/rjs39/04-15)）。在这些互联网真空区，人们可能会倾向于减少数据使用，以缓解在慢网络上浏览的痛苦。如果我们能考虑到他们，这将对于让处于劣势地位的用户访问网页非常有帮助。\n\
  \n### 减少数据使用的信号\n\n在安卓版的 Google Chrome 中，用户可以通过“数据节省模式”（Data Saver Mode）或“轻量模式”（Lite\
  \ Mode）指定减少数据使用的偏。启用后，该模式会做两件事：\n\n1. Chrome 将 `navigator.connection.saveData` 设置为\
  \ `true`。\n\n2. Chrome 为每个请求发送一个值为 `on` 的 `Save-Data` HTTP 请求头。\n\n从历史上看，该平台是唯一提供此类模式的平台，但最近\
  \ CSS 中的 `prefers-reduced-data` 媒体查询出现，将数据节省功能扩展到了所有浏览器。它的值可以是 `no-preference`（表示对数据使用没有偏好）或\
  \ `reduce`（表示减少数据使用）。\n\n在安卓版 Chrome 中，减少数据使用的偏好遵循标准的 `prefers-reduced-data` 媒体查询。虽然一个\
  \ CSS 特性似乎在 JavaScript 中没有太大用处，但我们可以通过 `matchMedia` 方法来评估这一偏好：\n\n```\n// 如果指定了减少数据使用的偏好，\n\
  ```\n\n```\n// 此表达式将求值为 true:\n```\n\n```\nconst saveData = window.matchMedia(\"\
  (prefers-reduced-data: reduce)\").matches;\n```\n\n不过，如果你到目前为止从书中中学到了什么，那就是 JavaScript\
  \ 的角色应该是被减少而不是扩展。鉴于此，在服务器端读取 `Save-Data` 请求头似乎更为合理。并不是说这个值在 JavaScript 本身中没有关联——事实上，它有关！只是你减少对\
  \ JavaScript 依赖的最佳途径是在服务器端。在后端语言（例如 PHP）中，可以这样检测 `Save-Data` 请求头：\n\n```php\ndefine(\"\
  SAVE_DATA\", isset($_SERVER[\"HTTP_SAVE_DATA\"]) && stristr($_SERVER[\"HTTP_SAVE_DATA\"\
  ], \"on\") !== false);\n```\n\n这段代码定义了一个 `SAVE_DATA` 常量。从那里，该信号可以在后端使用，专注于页面的关键内容并剥离非必要的资源——包括\
  \ JavaScript。\n\n我们可以在 Weekly Timber 网站（一家威斯康星州的伐木公司）上看到应用。问答页面包含轮播图（carousel）和折叠面板（accordions）（图\
  \ 4.10），它们都依赖于 `jQuery`，而且轮播图由大量的 JavaScript 驱动。还有轮播插件本身以及一小段初始化所有内容的 JavaScript。\n\
  \n![Weekly Timber 答页完整功能版本包含轮播图和 JavaScript 驱动的折叠面板。(image/4.10.png)图 4.10：Weekly\
  \ Timber 答页面完整功能版本包含轮播图和 JavaScript 驱动的折叠面板。这些增强功能总共少于 100 KB 的未压缩 JavaScript。对于网页来说，这部分\
  \ JavaScript 并不惊人，但在慢设备上，它确实会引发相当的主线程活动（图 4.11）。![Chrome 性能分析器中 Weekly Timber 网站答页面的主线程活动概述。该页面启动了不容忽视的\
  \ JavaScript 活动，以及 JavaScript 引发的布局和绘制工作。(image/4.11.png)图 4.11：Chrome 性能分析器中 Weekly\
  \ Timber 网站答页面的主线程活动概述。该页面启动了不容忽视的 JavaScript 活动，以及 JavaScript 引发的布局和绘制工作。但我们可以使用创建的\
  \ `SAVE_DATA` 常量，为 Weekly Timber 可能处于不理想农村网络环境的客户去掉花里胡哨。如果 `SAVE_DATA` 为 `true`，我们选择移除轮播图和折叠面板功能：```phpif\
  \ (!SAVE_DATA) {?><section id=\"carousel\">  <!-- 移除轮播图 --></section><?php}?>```###\
  \ 作为自定义功能节省数据数据节省功能并不非由浏览器提供；你可以将其作为可切换设置构建到自己的应用程序中，这样所有人都能受益，而不仅仅是提供该功能的浏览器用户。例如，Twitter\
  \ 提供了一个应用程序级的设置来帮助访问者节省数据（图 4.14）。![Twitter.com 账户信息设置菜单的截图。“数据节省”切换至开启。](img/4.14.png)\n\
  \n图 4.14：Twitter 的数据节省设置位于其移动导航菜单的底部。\n\n\n\n\n\n启用此设置后，Twitter 会下载图像和视频的低分辨率占位符，然后允许用户选择是否查看相关的媒体内容（图\
  \ 4.15）。\n\n![@OversightDems 的推文截图：“年前，我们失去了主席 Elijah E. Cummings。观看这段致敬视频以及他给美国传达的信息：投票。”附图中是一个模糊的视频缩略图，中心有一个“加载视频”按钮。](img/4.15.png)\n\
  \n图 4.15：Twitter 的数据节省器功能运行演示。在这里，访问者可以决定他们想要下载哪些媒体以节省流量消耗。\n\n你如何实现自定义的数据节省器功能取决于你的项目。你可以将其按机器为基础存储在\
  \ cookie 中，或使用 JavaScript 中的 `localStorage` 进行存储（[`bkaprt.com/rjs39/04-16`](http://bkaprt.com/rjs39/04-16)）。或者，如果你想尽可能地让更多用户使用此功能，可以将此偏好存储在应用程序的后端。\n\
  \n数据节省器概念上的简单性正是其强大之处所在：如果你给人们一个选择减少数据使用的机会，他们很有可能会采纳它。这是一个让人们对自己的体验拥有更多控制权的机会，*并且*减少了你代表他们运行的\
  \ JavaScript。\n\n## 韧性：你的名字是 Service Worker\n\n如果你安装过瓷砖，你就知道这是一个极其艰难的过程。首先，你必须确保你的底座是平整的。然后，在底座上铺设解耦膜。接着铺设砂浆层。然后给瓷砖背部涂抹砂浆并将其嵌入砂浆层。然后进行勾缝。最后密封勾缝。这是一项大量的工作，但这些工作为完成的安装增添了强度、韧性和吸引力。\n\
  \n我们在书中到为止所描述的构建具有韧性网站的过程同样是冗余且分层的。然而，我们应该考虑再添加最后的一层：service worker（[`bkaprt.com/rjs39/04-17`](http://bkaprt.com/rjs39/04-17)）。\n\
  \nService Worker 是一种充当浏览器和服务器之间代理的 API。Service workers 是功能强大的小齿轮，可以拦截请求和响应、重定向请求、缓存响应并提供离线能力，使网站不仅在更多地方可访问，而且速度更快。\n\
  \n### 优先考虑速度和访问\n\nWeekly Timber 位于威斯康星州的瓦沙拉县。在像这样的地方，良好的网络连接可能是很难得的（图 4.16）。\n\n\
  ![威斯康星州瓦沙拉县的宽带颜色叠加地图。该县大部分地区显示为浅褐色，表示宽带速度在 3 到 9.99 Mbps 之间。浅蓝色和深蓝色区域速度更快。](img/4.16.png)\n\
  \n图 4.16：威斯康星州瓦沙拉县的宽带颜色叠加地图。该县大部分地区显示为浅褐色，表示宽带速度在 3 到 9.99 Mbps 之间。浅蓝色和深蓝色区域更快。\n\
  \n威斯康州确实有农场，但也有大量的森林。如果你需要砍掉一些树，你会访问 Google 寻找伐木公司。伐木公司网站加载得有多快——或者加载不出来——可能会影响你是否会给那公司打电话。\n\
  \n这就是针对速度和韧性调过的 service worker 发挥用场的地方。我为 Weekly Timber 构建了一个 service worker，通过以下方式显著提升了感知性能：\n\
  \n*   在 service worker 安装期间预缓存页眉和页脚的标记；\n*   仅请求内容标记并将其与预缓存的页眉和页脚标记组装；\n*   流式传输完全组装的响应，以最快速度将标记发送到浏览器；以及\n\
  *   通过导航预加载（navigation preload）（[`bkaprt.com/rjs39/04-18`](http://bkaprt.com/rjs39/04-18)）避免\
  \ service worker 的启动延迟。\n\n这些架构决策对性能的影响是非常显著的。当这个 service worker 部署到 Weekly Timber\
  \ 时，导致首次内容绘制（First Contentful Paint）和最大内容绘制（Largest Contentful Paint）的中位数时间分别减少了\
  \ 42% 和 48%。更好的是，这些改进不是通过合成性能测试工具观察到的，而是实际上使用 Weekly Timber 网站的人（[`bkaprt.com/rjs39/04-19`](http://bkaprt.com/rjs39/04-19)）观察到的。\n\
  \n在我们开始介绍如何构建这个 service worker 之前，我们需要为它建立一个缓存——因为没有缓存，service worker 在性能方面对你起不了太大作用。\n\
  \n### 建立 service worker 缓存\n\nService workers 依赖于 `Cache` 接口（[`bkaprt.com/rjs39/04-20`](http://bkaprt.com/rjs39/04-20)），它提供了一个与我们在第\
  \ 3 章介绍过的浏览器缓存不同的缓存层。当 service worker 安装时，它的 `install` 事件会触发（[`bkaprt.com/rjs39/04-21`](http://bkaprt.com/rjs39/04-21)）。这里就是我们创建新的\
  \ service worker 缓存的地方：\n\n```javascript\nself.addEventListener(\"install\", event\
  \ => {\n const cacheName = \"fancy_cache_name_here\";\n const cachedAssets = [\n\
  \ \"/partial-header\",\n \"/partial-footer\"\n ];\n event.waitUntil(caches.open(cacheName).then(cache\
  \ => {\n return cache.addAll(cachedAssets);\n }));\n });\n```\n\n这里发生了两件事：\n\n1.\
  \  我们的 service worker 缓存需要一个标识符，我们在 `cacheName` 中指定它。我们使用这个标识符通过 `Cache` 接口的 `open`\
  \ 方法（[`bkaprt.com/rjs39/04-22`](http://bkaprt.com/rjs39/04-22)）打开缓存，以便跟踪存入的内容。\n\
  2.  在打开新缓存后，我们使用 `Cache` 接口的 `addAll` 方法在其中预缓存资源（[`bkaprt.com/rjs39/04-23`](http://bkaprt.com/rjs39/04-23)）。我们可以向其填充任何我们认为值得提前的内容。\n\
  \n### 激活 service worker\n\n在 service worker 的生命周期中，激活（activation）发生在安装（installation）之后。激活是一个进行清理工作的机会，它发生在\
  \ service worker 的 `activate` 事件中：\n\n```javascript\nself.addEventListener(\"activate\"\
  , event => {\n const cacheName = \"fancy_cache_name_here\";\n const preloadAvailable\
  \ = \"navigationPreload\" in self.registration;\n event.waitUntil(caches.keys().then(keys\
  \ => {\n return Promise.all([\n keys.filter(key => {\n return key !== cacheName;\n\
  \ }).map(key => {\n return caches.delete(key);\n }),\n preloadAvailable ? self.registration.navigationPreload.enable()\
  \ : true\n ]);\n }));\n});\n```\n\n\n\n\n\n## 2. Service worker 启动时间会延迟请求\n\n`navigationPreload`\
  \ 通过让 service worker 的启动和导航请求并发执行而非串行执行来解决这个问题。尽管如此，由于并非所有浏览器都支持它，我们将它的支持状态存储在 `preloadAvailable`\
  \ 中，并使用三元运算符在支持的浏览器显式启用 `navigationPreload`，在不支持的平台上传递一个布尔值。\n\n这涉及到大量的`内容`，但我们正要进入好有趣的部分：拦截并修改响应！\n\
  \n### 拦截请求\n\n拦截网络请求是 service worker 的核心戏码。与 `Cache` 接口结合时，拦截请求和自定义响应的能力是实现快速用户体验的沃土。\n\
  \n在开始处理特定的请求类型之前，我们需要从一个良好的默认开始：\n\n```javascript\nself.addEventListener(\"fetch\"\
  , async event => {\nconst { request } = event;\nif (request.method !== \"GET\")\
  \ {\n  return;\n}\n// 为了简洁省略了代码...\n});\n```\n\n`fetch` 是另一个 service worker 事件，每当浏览器分发网络请求时，它就会触发。在大多数情况下，良好的默认做法是检查\
  \ `event` 对象的 `request.method` 属性是否代表一个 `GET` 请求。`POST` 请求是由用户特定操作（如提交表单）驱动的。我们不想对这些请求进行操作，因此通过抛出\
  \ `return` 将它们直接透传给 `fetch` 事件处理器。\n\n从这里开始，我们需要根据请求的内容类型将逻辑进行分叉：静态资源或导航。\n\n###\
  \ 处理静态资源\n\n“缓存优先，网络后之”模式是处理静态资源请求的良好默认值——即对在任何情况下都不会改变的资源的请求，例如 CSS、图像、字体，以及，是的，JavaScript。\n\
  \n这意味着我们首先检查静态资源是否在 service worker 缓存中。不过，对它的第一次请求将会失败，因为此时缓存中还不在那里；我们必须访问网络来获取它。之后，我们将该资源放入缓存，以便未来对该资源的请求可以完全跳过网络。\n\
  \n这意味着从 `Cache` 接口检索静态资源的速度极快（图 4.17）。其逻辑也相当简单直接。你要么在缓存中拥有该资源，要么没有。如果没有，就获取它并将其放入缓存：\n\
  \n```javascript\nself.addEventListener(\"fetch\", async event => {\n// 省略了请求过滤代码...\n\
  const staticAssets = /\\.(woff2?|css|m?js|gif|avif|webp|png|svg|jpe?g| txt|ico)$/i;\n\
  if (staticAssets.test(request.url)) {\n  event.respondWith(caches.match(request.url).then(cachedResponse\
  \ => {\n    return cachedResponse || fetch(request).then(fetchedResponse => {\n\
  \      addResponseToCache(request, fetchedResponse.clone());\n      return fetchedResponse;\n\
  \    });\n  }));\n  return;\n}\n// 待后续...\n});\n```\n\n正如 `fetch` 可以在主线程上下文中检索资源一样，它也可以在\
  \ service worker 中使用。这正是我们在使用 `Cache` 接口的 `match` 方法查找缓存失败时，从网络抓取静态资源的方法（[`bkaprt.com/rjs39/04-27`](http://bkaprt.com/rjs39/04-27)）。如果失败了，我们使用一个名为\
  \ `addResponseToCache` 的小型自定义函数将资源添加到缓存中：\n\n```javascript\nfunction addResponseToCache\
  \ (request, response) {\n  caches.open(CACHE_NAME).then(cache => {\n    cache.put(request,\
  \ response);\n  });\n};\n```\n\n静态资源处理是所有请求拦截业务中最简单的部分。随着我们弄清楚如何处理导航请求，情况将变得棘手得多。\n\
  \n![从 service worker 获取的资源的请求时间线。启动: 0.16ms. respondWith: 1.21ms. 等待（首次字节时间） 1.55ms.\
  \ 内容下载: 2.21ms. 总计: 4.14ms.](img/4.17.png)\n\n图 4.17：存储在 service worker 缓存中的静态资源的请求计时耗时。由于\
  \ service worker 无需访问网络获取资源，因此它的提供速度非常快。\n\n### 处理导航请求\n\n导航请求是针对 HTML 文档的——即对完全不同页面的请求，而不是对图像或某些\
  \ JavaScript 的请求。对于 Weekly Timber 的 service worker，我们希望处理导航请求的方式与静态资源请求大不同。\n\n\
  你可能记得早些时候为 Weekly Timber 的 service worker 列出了一长串需求。其中首要的一点是我们希望减少标记负载。我们通过预缓存页眉和页脚标记来实现这一点——我们已经在\
  \ service worker 的 `install` 事件中做过这样做——然后将它们与从网络请求的仅包含内容的标记相结合（图 4.18）。\n\n与完全没有\
  \ service worker 相比，你将在首次内容绘制（First Contentful Paint）和最大内容绘制（Largest Contentful\
  \ Paint）方面获得感知上的感知益处。让我们来看看这在我们的 `fetch` 事件中是怎样的实现的：\n\n```javascript\nself.addEventListener(\"\
  fetch\", async event => {\n  // 省略了之前的代码...\n  if (request.mode === \"navigate\"\
  ) {\n    const networkContent = Promise.resolve(event.preloadResponse).then(response\
  \ => {\n      if (response) {\n        addResponseToCache(request, response.clone());\n\
  \        return response;\n      }\n      const headers = new Headers();\n     \
  \ headers.append(\"X-Content-Mode\", \"partial\");\n      return fetch(request.url,\
  \ {\n        headers\n      }).then(response => {\n        addResponseToCache(request,\
  \ response.clone());\n        return response;\n      }).catch(() => {\n       \
  \ return caches.match(request.url);\n      });\n    });\n  }\n  // 待后续...\n});\n\
  ```\n\n这里涉及大量内容。让我们逐一拆解：\n\n1.  为了区分导航请求与其他请求，我们可以检查 `request` 对象的 `mode` 属性。如果它的值为\
  \ `\"navigate\"`，说明我们在正确的轨道上。\n2.  如果支持 `navigationPreload`，我们可以在 `event.preloadResponse`\
  \ 中获取其预加载响应。如果是这样，太棒了！我们可以将该响应添加到缓存，以防以后处于离线状态。导航加载加载会自动发送 `Service-Worker-Navigation-Preload`\
  \ 请求，我们可以利用它获取部分内容。\n3.  问题是，并非所有浏览器都支持 `navigationPreload`。如果是如此，`event.preloadResponse`\
  \ 就是没用的，我们必须适应并自己请求部分内容。我们还必须创建一个自定义的 `X-Content-Mode` 请求头来指示后端发送部分内容，因为在没有导航预加载的情况下，不会发送\
  \ `Service-Worker-Navigation-Preload` 请求头。\n4.  如果请求因任何原因失败（即发生某些离线闹剧），我们将从 `Cache`\
  \ 接口提供页面。前提是它在缓存中。\n\n我们快要完成了，但还有最后一件事要做：将获取到的内容标记与我们之前预缓存的页眉和页脚标记组合在一起。然后我们就可以将其作为完整的响应提供。\n\
  \n\n\n\n\n![Weekly Timber 网站头部、内容区域和页脚区域的颜色表示图。网站的头部（蓝色）和页脚（红色）区域从 `Cache` 接口提供，并与从网络请求的内容（黄色）区域组合成一个单一的响应。](img/4.18.png)\n\
  图 4.18：Weekly Timber 网站头部、内容区域和页脚区域的颜色表示图。网站的头部（蓝色）和页脚（红色）区域从 `Cache` 接口提供，并与从网络请求的内容（黄色）区域组合成一个单一的响应。\n\
  \n```javascript\nself.addEventListener(\"fetch\", event => {\n```\n\n```javascript\n\
  \ // Prior code omitted...\n```\n\n```javascript\n if (request.mode === \"navigate\"\
  ) {\n```\n\n```javascript\n // Navigation preload/fetch() fallback code omitted...\n\
  ```\n\n```javascript\n const { done, response } = await mergeResponses([\n```\n\n\
  ```javascript\n caches.match(\"/partial-header\"),\n```\n\n```javascript\n networkContent,\n\
  ```\n\n```javascript\n caches.match(\"/partial-footer\")\n```\n\n```javascript\n\
  \ ]);\n```\n\n```javascript\n event.waitUntil(done);\n```\n\n```javascript\n event.respondWith(response);\n\
  ```\n\n```javascript\n }\n```\n\n```javascript\n});\n```\n\n这是我们 service worker\
  \ `fetch` 事件代码的最后一部分。虽然它很简洁，但影响丝毫不小：\n\n1. `mergeResponses` 是一个自定义函数，它接收一个响应数组并将其合并为一个。数组的第一项和第三项是通过通过\
  \ `Cache` 接口的 `match` 方法获取的预缓存头部和页脚标记。第二个项是来自网络的内容标记。\n\n2. `mergeResponses` 的内部实现太复杂了，不便在此介绍，但源代码可以在\
  \ GitHub 上找到（[`bkaprt.com/rjs39/04-28`](http://bkaprt.com/rjs39/04-28)）。简而言之，`mergeResponses`\
  \ 接收响应数组并使用 `ReadableStream` API 尽快开始向浏览器流式传输内容（[`bkaprt.com/rjs39/04-29`](http://bkaprt.com/rjs39/04-29)）。完成后，它返回一个包含两个属性的对象：一个在响应组合完成后解析的\
  \ promise（`done`），以及我们发送到浏览器的组合后的响应（`response`）。\n\n但在安装它之前，我们对这个 service worker\
  \ 的所有工作都无济于事，而安装正是整个流程的最后一部分。\n\n### 安装 service worker\n\n虽然安装 service worker 是这一系列活动中最容易的部分，但我们确实需要注意以下几点：\n\
  \n* Service worker 支持——虽然非常棒了（[`bkaprt.com/rjs39/04-30`](http://bkaprt.com/rjs39/04-30)），但并不是百分之百保证。做一些功能检测（feature-checking）以避免在旧版浏览器上出现错误。\n\
  \n* 因为 service worker 可能会为其他页面预缓存内容，所以我们想确保在页面加载之前不要注册它。\n\n这些问题并不是非常困难。假设我们的 service\
  \ worker 命名为 `sw.js` 且位于根目录下，我们可以在每个页面的底部添加这段小小的脚本：\n\n```html\n<script>\n```\n\n\
  ```javascript\n window.addEventListener(\"load\", () => {\n```\n\n```javascript\n\
  \ if (\"serviceWorker\" in navigator) {\n```\n\n```javascript\n navigator.serviceWorker.register(\"\
  /sw.js\");\n```\n\n```javascript\n }\n```\n\n```javascript\n });\n```\n\n```html\n\
  </script>\n```\n\n通过等待到 `window` 的 `load` 事件，我们减少了 service worker 及其预缓存任何内容与关键资源竞争带宽的可能性。通过检查\
  \ `navigator` 对象中的 `serviceWorker` 命名空间，我们确保不会运行任何可能在旧版浏览器上引起问题的代码。\n\n我们已经深陷 service\
  \ worker 这一事中了，但我们终于停下来了。是的，这有很多需要吸收和应用，而且这只是针对一个网站的一个 service worker 示例。尽管如此，那个\
  \ service worker 为 Weekly Timber 带来了不可置信的感知性能收益：\n\n| | 无 service worker | 流式 service\
  \ worker | 速度提升 |\n| --- | --- | --- | --- |\n| 中位数 FCP (ms) | 767 | 159 | 79.3%\
  \ |\n| 中位数 LCP (ms) | 853 | 466 | 54.6% |\n| p95 FCP (ms) | 3027 | 1497 | 45.4%\
  \ |\n| p95 LCP (ms) | 3357 | 1764 | 47.5% |\n\n更好的是，service workers 是渐进增强（progressive\
  \ enhancement）的完美示例。它们并没有取代浏览器内置的导航行为，而是以一种可定制且加性的方式对其进行改进。这正是负责任使用 JavaScript 的精髓所在。\n\
  \n## 快速、弹性且用户优先\n\n如今，通过节制地使用 JavaScript 来构建引人胜的用户体验需要巨大的努力，但这是可能的。其中一些努力涉及到“花招”，即我们依赖资源提示（resource\
  \ hints）等不明显的方法来掩盖页面资产的延迟和加载时间。\n\n其他努力涉及更直接的行动，例如通过代码分割（code splitting）缩短启动时间，或尊重用户偏好。在某些情况下，我们可能需要使用不仅能减少流量还能提供离线访问的\
  \ service worker。\n\n工具链（toolchains）——即用于转换和优化我们的 JavaScript 的工具集合——可能需要艰巨的努力，无论是有效使用它们还是理解其影响。虽然你不需要本章提到的任何工具就能构建快速且愉悦的用户体验，但你可能会在工作中遇到它们。如果我们为工具链投入精力，我们需要确保它是值得的。\n\
  \n# 5. 导航工具链\n\n![](img/6.png)\n\n杀蝉黄蜂对初学者来说会引起近乎失禁的恐惧。它们体型惊人（图 5.1）。正如它们的名字一样，必须如此。但它们仍然比蝉小，这意味着一旦它们捕获并麻痹了它们，物理上无法从地面起飞！如果它们足够幸运能在空中抓到蝉，就必须把猎物拖到树上。这是这些黄蜂稳定飞行的唯一方式。这需要巨大的努力，但回报丰厚。\n\
  \n## 任务运行器\n\n让我们从任务运行器（task runners）开始进入这个领域。任务运行器是线性的 JavaScript 构建工具，不分析代码。它们通常用于压缩、合并并通过其他方式优化脚本目录（或其他文件），以生成生产环境的资产（图\
  \ 5.2）。\n\n\n\n\n\n任务运行器（Task runners）之所以具有吸引力，是因为它们非常直接：你想要对某些文件执行某种操作，只需将任务运行器指向这些文件并完成操作即可。这种线性关系导致了较低的学习曲线和快速的上手率。例如，A11Y\
  \ Project 依赖于名为 `gulp.js` 的流行任务运行器（[`bkaprt.com/rjs39/05-03`](http://bkaprt.com/rjs39/05-03)），他们甚至在技术声明中推广了它，并了了“易于设置\
  \ [sic]”和“对初学者的易读性”（[`bkaprt.com/rjs39/05-04`](http://bkaprt.com/rjs39/05-04)）。\n\
  \n任务运行器可以用于任何地方，它们对于不深度依赖 JavaScript 的网站来说尤为合适。但它们并不适用于所有项目。由于它们在不分析 JavaScript\
  \ 文件内容的情况下对文件进行泛化的优化，因此它们无法像其他工具那样以更复杂的方式优化你的代码。这就是打包器（Bundlers）大显身场的地方\n\n## 打包器\n\
  \n对于依赖 JavaScript 运行的网站使用任务运行器可能会导致在不同页面之间提供大量重复或未使用的代码。如果你的项目严重依赖 JavaScript，那么打包器可能是更好的选择。\n\
  \n任务运行器和打包器之间主要的权衡是易用性。任务运行器更容易学习和设置，而打包器的配置可能会变得极其复杂（byzantine）。我个人曾观察过超过一百行的 `webpack`（[`bkaprt.com/rjs39/05-05`](http://bkaprt.com/rjs39/05-05)）配置——有时甚至多于更多。其他打包器，如\
  \ `Rollup`（[`bkaprt.com/rjs39/05-06`](http://bkaprt.com/rjs39/05-06)）或 `Parcel`（[`bkaprt.com/rjs39/05-07`](http://bkaprt.com/rjs39/05-07)）可能比\
  \ `webpack` 更直接，但由于需求不同，它们可能不再适合某些架构。\n\n然而，无论你选择哪种打包器，它们与任务运行器之间的关键区别在于你想要如何组织你的应用程序逻辑\n\
  \n### 打包器是如何工作的\n\n打包器不是对一堆文件应用泛化的优化，而是遍历项目代码库并分析其各种静态和动态的 `import`。这意味着打包器将你的应用视为模块的集合，而任务运行器则不会分析你的代码库。\n\
  \n打包器通过一个完整的过程来理解你代码库的结构（图 5.3）：\n\n![一个盒子的图标，标记为“bundler”，箭头指向标记为“Entry point”（入口点）的文件图标。箭头指向一个文件图标网络，其中任何标记为“Module”的都连接到单个的“scripts.min.js”输出文件，任何标记为“vendor\
  \ package”的都连接到“vendors.min.js”文件。](img/5.3.png)\n\n图 5.3：打包器接收一个或多个入口点并构建依赖图，它利用该图来决定如何最佳打包脚本。在这里，应用模块和供应商模块（即通过\
  \ `npm` 安装的脚本）是分开打包的。\n\n*   打包器在配置中接受一个或多个*entry points*。将入口点想象成树的树干。每个分支代表一个 `import`——这是我们在第\
  \ 4 章中接触过的概念——其中模块成为你应用程序的一部分。\n*   通过分析入口点以及它导入的各种模块和脚本，打包器构建了*dependency graph*。将依赖图看作是你入口点树的表示。\n\
  *   使用依赖图，打包器随后输出最优的生产就绪脚本资源。这可能包括自动拆分。\n\n*   打包器在配置中接受一个或多个*entry points*。将入口点想象成树的树干。每个分支代表一个\
  \ `import`——这是我们在第 4 章中接触过的概念——其中模块成为你应用程序的一部分。\n*   通过分析入口点以及它导入的各种模块和脚本，打包器构建了*dependency\
  \ graph*。将依赖图看作是你入口点树的表示。\n*   使用依赖图，打包器随后输出最优的生产就绪脚本资源。这可能包括自动拆分。\n\n*   打包器在配置中接受一个或多个*entry\
  \ points*。将入口点想象成树的树干。每个分支代表一个 `import`——这是我们在第 4 章中接触过的概念——其中模块成为你应用程序的一部分。\n*\
