  \n\n\n\n\n我们以风格、清晰且最重要的是简洁的方式，涵盖了网页设计与开发中新兴且至关重要的主题——因为兼任设计师的开发者无法浪费任何时间。\n\n##\
  \ 版后记\n\n正文采用 FF Yoga 及其配套字体 FF Yoga Sans 排版，这两个字体均由 Xavier Dupré 设计。标题和封面采用 David\
  \ Berlow 设计的 Titling Gothic。\n\n## 关于作者\n\n![](img/Jeremy_Wagner.png)\n\n`Jeremy\
  \ Wagner` 与其说是一个 Web 开发者，不如说是一个作家，但他两者兼顾了。在制作网站的时间之长超过了其预期之外，他还曾为 A List Apart、Google\
  \ 和 CSS-Tricks 写过文章，并是书籍 `Responsible JavaScript` 的作者。Jeremy 总有一天会搬去一个遥远的荒野，那里的沙子还没有学会思考。在此之前，他将继续与妻子和继女住在明尼苏达州的双城，并对条带购物中心的存在感到感叹。\n"
