  \n\n\n\n\n- 如果该包有使用 ESM 编写的合适替代方案，考虑切换到其中一个。\n- 如果该包是一个工具函数集合且许可证允许，你可能可以提取出该库的必要部分，将它们转换为\
  \ ESM（如果需要的话），并将这些代码直接放置在你的项目中。这样做可以减小构建体积和生产环境的依赖，还具有缩短安装和构建时间的开发者体验方面的益处。\n- 你能自己编写这些功能吗？某些库提供的方法现在可以用\
  \ JavaScript 内置方法取代。Chris Ferdinandi 整理了一系列文章，向你展示如何仅使用原生 JavaScript 完成许多常见任务（[`bkaprt.com/rjs39/05-10`](http://bkaprt.com/rjs39/05-10)）。\n\
  \n第三方包（Vendor packages）可能占你发送到浏览器的 JavaScript 代码大部分。每当你遇到无法通过树摇（tree shaking）优化的第三方包时，退后一步考虑你的选项是一个好主意。\n\
  \n## 何时外部化依赖项\n\n你可能会在项目中看到很多 `import`。每个 `import` 都标志着两种两种依赖类型之一：\n\n1. `本地依赖项`（Local\
  \ dependencies）是你或你的团队编写的特定于你项目的代码。这些通常不会发布为任何人都可以包管理器安装的公共依赖。\n2. `远程依赖项`（Remote\
  \ dependencies）是在项目之外且通常与项目分离的代码。它们通常是安装的第三方包，但你的项目架构可能会将应用特定的逻辑隔离到可安装的（可能是私有的）包中，这种架构风格有时被称为微前端。\n\
  \n在微前端架构中，当第三方包在依赖项之间重复时，页面速度会受到影响，这需要额外的精力来消除，因为编译器的范围被限制在每个单独依赖中。\n\n假设你的网站使用\
  \ React，但应用中的每个组件都是隔离在各自仓库中并具有各自工具链的远程依赖项。这导致每个组件都发送自己的 React 副本。那是大量的冗余代码。\n\n\
  为了避免代码重复，你应该外部化那些你确定是从其他来源提供的依赖项。所有的打包器都提供此功能。例如，`webpack` 可以通过其 `externals` 配置外部化依赖项（[`bkaprt.com/rjs39/05-11`](http://bkaprt.com/rjs39/05-11)）：\n\
  \n```\nmodule.exports = {\n```\n```\n // ...\n```\n```\n externals: {\n```\n```\n\
  \ react: \"React\",\n```\n```\n \"react-dom\": \"ReactDOM\"``` `externals` 对象中的每个键都是\
  \ npm 包的名称，其对应的值是该包在全局作用域中占用的命名空间。在此此之后，`webpack` 将不会打包 `react` 和 `react-dom`。它将会跳过它们，并假设你在运行时从另一个源提供了这些依赖项。\n\
  \n虽然第三方代码是外部化的典型目标，但针对你网站特定的远程依赖项同样适用。例如，考虑一个电子商务零售商，它在产品详情页的多个组件中使用了一个工具库：如果该工具库没有在使用它的每个依赖项中被外部化，那么它的代码将贯穿整个网站。\n\
  \n这些建议中的某些可能会让你产生打包器是性能负担的印象。虽然某些打包器的倾向于以可能影响性能的方式优先考虑兼容性和互操作性，但这并不是在可以使用它们时避免它们的借口。这仅仅意味着你需要保持警惕。\n\
  \n## 转译器 (Transpilers)\n\n我们已经在本章中提到转译器，但它们是你可能在大多数工具链中遇到的相关工具。回顾一下，转译器将现代 JavaScript\
  \ 特性和语法转换为一种通用的、可以在任何地方可靠运行的语法。\n\n转译器虽然确实有用，但如果我们粗心地地使用它们，可能会像打包器一样棘手。每当你转换一个语言特性以使其在更多地方具有兼容性时，转换后的代码几乎总是比未转换的对应代码占用更大的空间。\n\
  \n## 业务\n\n转译器在现代 Web 开发中起着特殊作用，因为 JavaScript 新功能的添加与浏览器对这些特性采纳程度的差异是冲突的。正如此，你的项目可能使用了某些浏览器可用但在其他浏览器中不可用的\
  \ JavaScript 特性。这些可能是全新的语言结构，如类或 `async`/await`，甚至是新的运算符，如扩展语法。\n\n箭头函数和模板字符串字量是可能会转译器转换的现代语言特性良好示例。箭头函数提供了紧凑的函数语法，对回调特别有用，而模板字符串字量可以方便地将\
  \ JavaScript 表达式嵌入字符串中，而无需使用连接运算符：\n\n```\nconst scriptTags = scriptUrls.map(url\
  \ => '<script src=\"${url}\"><\\/script>').join(\"\");\n```\n\n然而，如果转译器将上述代码转换为通用的语法，结果将是一段更冗长但在实际中中等价的代码：\n\
  \n```\nvar scriptTags = scriptUrls.map(function (url) {\n```\n```\n return \"<script\
  \ src=\\\"\".concat(url, \"\\\"></script>\");\n```\n```\n}).join(\"\");\n```\n\n\
  虽然转译器是确保跨浏览器兼容性的有用工具，但它们有两个缺点：\n\n- 如果转译器没有配置为目标你用户的浏览器，现代浏览器可能会产生显著更多的 JavaScript\
  \ 开销。\n- 在你的工具链中添加转译器——以及理解其潜在的性能影响——引入了严峻的学习曲线。\n\n在跨平台兼容性至上的情况下，转译器是不可或缺的，但它们不是强制性的——不过，构建工具也是如此。如果你能够为项目做出架构选择，务实的做法总是渐进式采用。\n\
  \n然而，行业——事实上，现实本身——是一个顽固的家伙。你最终会在某个点必须处理这些工具，如果你现在还没有的话。知道如何约束它们在 JavaScript 性能方面会产生差异。\n\
  \n### 转换不是免费的\n\n取决于配置，转译器在转换许多功能时可能会为包增加膨肿：ES6 类、异步函数、扩展语法、默认参数、生成器函数等等，只要 JavaScript\
  \ 本身继续演进。\n\n让我们测试这个概念并从默认参数开始。如果你在任何语言中编程了足够久，你可能观察到（取决于语言）函数的参数具有默认值，当被省略时将生效。与其他语言相比，这是一个较新的\
  \ JavaScript 特性：\n\n```\nfunction generateLinkTags (cssFiles = [\"/css/global.css\"\
  ]) {\n```\n```\n return cssFiles.map(cssFile => {\n```\n```\n return '<link rel=\"\
  stylesheet\" href=\"${cssFile}\">';\n```\n``` }).join(\"\");\n```\n```\n}\n```\n\
  \n该函数生成一组 `<link>` 元素的字符串。在第一行，你会看到 `cssFiles` 参数后面跟着等号和一个包含全局 CSS 文件引用的数组。这意味着函数可以在不传递任何参数的情况下运行并触发默认值。这在许多情况下是一个非常有用的特性。\n\
  \n然而，如果这个函数被 Babel 处理，它可能会某些浏览器目标返回此转换后的代码：\n\n```\nfunction generateLinkTags()\
  \ {\n```\n```\n var cssFiles = arguments.length > 0 && arguments[0] !== undefined\
  \ ? arguments[0] : [\"/css/global.css\"];\n```\n```\n return cssFiles.map(function\
  \ (cssFile) {\n```\n```\n return \"<link rel=\\\"stylesheet\\\" href=\\\"\".concat(cssFile,\
  \ \"\\\">\");\n```\n``` }).join(\"\");\n```\n```\n}\n```\n\n\n\n\n这是一种糟糕的转换，但大多数开发者都不会阅读转换后的代码——这正是重点所在！正恰*因为*我们不读转换后的代码，它的成本才会被我们忽视。转换默认参数是为了开发的体验而添加了额外的代码，而且每添加一个默认参数都会产生相应的成本。\n\
  \n如果需要，我们可以避开现代语法，转用旧语法：\n\n```javascript\nfunction generateLinkTags (cssFiles)\
  \ {\n  cssFiles = cssFiles || [\"/css/global.css\"];\n  return cssFiles.map(cssFile\
  \ => {\n    return '<link rel=\"stylesheet\" href=\"${cssFile}\">';\n  }).join(\"\
  \");\n}\n```\n\n使用 `||` 运算符，当 `cssFiles` 的值不为 `undefined` 时，我们可以将其值赋回给自己。这为 `cssFiles`\
  \ 提供了一个默认值，而无需经过转换。\n\n“噢，Jeremy，这简直是吹牛毛疵。” 是的，我理解。有时候你可能更倾向于为了维护性来寻求平衡，这是合理的——但其他类型的转换会更加棘手。看看这个原生的\
  \ `fetch` 包装器，它调用本地 API 从端点获取 JSON 数据：\n\n```javascript\nasync function fetchApiData\
  \ (endpoint, param) {\n  try {\n    const response = await fetch('/api/${endpoint}/${param}');\n\
  \    const data = await response.json();\n    return data;\n  } catch (error) {\n\
  \    return error;\n  }\n}\n```\n\n你可能会注意到这个包装器是一个 `async` 函数。`async` 函数是函数的一种，它们通过允许\
  \ `await` 一个 promise 而不是处理 `then`/`catch` 回调链，简化了其内部对 promise 的处理。它们对开发者体验是巨大的改进，但在某些环境中经过转换后，它们会变得*非常巨大*（图\
  \ 5.4）。\n\n如果你无法读懂图中的代码，这正是意所在。转换带来的膨肿代码太多，以至于在不占用大量空间的情况下无法打印出来。\n\n绕过这种转换的方法是直接处理\
  \ promise，而不是依赖 `async`/`await`：\n\n```javascript\nfunction fetchApiData (endpoint,\
  \ param) {\n  return new Promise ((resolve, reject) => {\n    fetch('/api/${endpoint}/${param}').then(response\
  \ => {\n      return response.json();\n    }).then(data => {\n      resolve(data);\n\
  \    }).catch(error => {\n      reject(error);\n    });\n  });\n}\n```\n\n在这里，通过使用\
  \ `async`/`await` 依赖的底层机制，我们可以确保 `async`/`await` 语法不会为生产代码添加大量的额外 JavaScript。\n\n\
  嘿，*看*：我不是说你永远*永远*不要使用这些功能，否则你就是个无可救的人。我只是请你考虑这样一个观点：`工具链` 的决策会影响那些最终使用我们在网页上发布的任何东西的人。这些决策取决于你必须支持哪些浏览器，以及你是否可以使用某些功能（例如\
  \ `async`/`await`）而无需为生产环境进行转换。\n\n值得提到的是，当你读到这段文字时，格局可能已经发生了巨大变化。然而，有一点在未来一段时间内是真的：JavaScript\
  \ 正在进化。只要如此，编译器就会一直存在。关注编译器文档是有价值的。例如：`Babel` 有一个名为“编译器假设”（compiler assumptions）的概念，它引导\
  \ `Babel` 以更符合你项目的方式来转换代码 ([`bkaprt.com/rjs39/05-12`](http://bkaprt.com/rjs39/05-12))。\n\
  \n这需要对人们访问你网站时使用的浏览器进行持续且批判性的评估。JavaScript 在不断进化，因此编译器——无论是 `Babel`、现有的替代方案，还是尚未实现的方案——短期内都不会消失。保持警惕，关注它们的动态。\n\
  \n![代码编辑器的缩屏截图，显示了大约 40 行极其冗长的代码。](img/5.4.png)\n\n图 5.4：Babel 使用 `async`/await`\
  \ 对 `fetch` 包装器的转换。转换后的代码远大于输入代码。\n\n### 避免在生产环境中转换早期阶段的功能\n\n说到新的 JavaScript 功能，每种功能都会由\
  \ `TC39` 委员会在系列阶段中进行评估 ([`bkaprt.com/rjs39/05-13`](http://bkaprt.com/rjs39/05-13))：\n\
  \n*   第 0 阶段 (Stage 0)：这些是“草人”提案，因为没有强制性的准入标准。这些提议在 `TC39` 内部尚不受支持。\n*   第 1 阶段\
  \ (Stage 1)：这些提案在 `TC39` 内部有一个专门负责推进的“倡导者”（champion）。这些提案会随着推进而改变。\n*   第 2 阶段 (Stage\
  \ 2)：这些是草案提案。在这一阶段，所提议的功能的行为已经定义明确，但可能仍发生变化。\n*   第 3 阶段 (Stage 3)：这些是候选建议。此阶段的提案很少进行修订（如果修补的话话）。\n\
  *   第 4 阶段 (Stage 4)：这些是成为标准的提案。\n\n这很重要，因为 `Babel` 用于原型设计，如果它们的名称中包含 `stage` 或\
  \ `proposal` ([`bkaprt.com/rjs39/05-14`](http://bkaprt.com/rjs39/05-14))。虽然熟悉新兴功能是可以理解的，但人们不能在生产环境中使用实验性功能。永远不要在生产环境中使用实验性功能。这不会带来任何面向用户的益处。对于\
  \ `Babel` 来说，避免这一点很容易。\n\n### 转换与浏览器支持\n\n虽然编译器平滑了兼容性差异，我们也可以配置它们根据环境选择性地应用转换。浏览器兼容性决定了你可以发布哪些未经转换的\
  \ JavaScript 功能——如果你的目标受众原生支持某个功能，为什么要转换它呢？\n\nES6 类是一个很好的例子。浏览器很大程度上支持 `class`\
  \ 构造 ([`bkaprt.com/rjs39/05-15`](http://bkaprt.com/rjs39/05-15))。尽管如此，开发者为旧版浏览器转换\
  \ ES6 类和其他较新的 JavaScript 特性并不罕见——即使他们并不一定需要支持它们！这代表了为了无理由而发布的额外代码。\n\n`Browslist`\
  \ ([`bkaprt.com/rjs39/05-16`](http://bkaprt.com/rjs39/05-16)) 将 Can I Use 的兼容性数据映射到浏览器版本。编译器使用这些数据来确定哪些功能应该被转换。\n\
  \n### Browserslist 如何工作\n\n`Browserslist` 使用查询语法来指定浏览器目标。该查询会被放置在工具链可以找到的几个位置之一：\n\
  \n*   在项目根目录的 `.browserslistrc` 文件中，每个查询占一行。\n*   在 `package.json` 文件中的 `browserslist`\
  \ 键中，对应值为包含查询的数组。\n*   在编译器配置中 ([`bkaprt.com/rjs39/05-17`](http://bkaprt.com/rjs39/05-17))。\n\
  \n查询本身可以简单如 `last 2 versions`，它选择每个浏览器的最后两个版本但不要这样做。`last 2 versions` 意味着你正在转换 JavaScript\
  \ 以兼容 Internet Explorer 10！除非这是你的意图，否则使用其他查询更好 ([`bkaprt.com/rjs39/05-18`](http://bkaprt.com/rjs39/05-18))。\n\
  \n\n\n\n如果你没有指定查询，系统将启用一个“安全”默认设置，它会将你的 JavaScript 转换为可以在任何地方安全运行的代码。考虑到目前使用的大多数浏览器都支持许多现代语言特性（[`bkaprt.com/rjs39/05-19`](http://bkaprt.com/rjs39/05-19)），对于今天追求性能的\
  \ Web 开发者来说，这并不是很好的做法。\n\n如果默认的 Browserslist 查询不起用，那么一个好的查询应该是什么样的？这取决于项目。你的访问者使用什么浏览器？一旦你确定了这一点，你就有机会以一种既对性能*更好*、又能兼容访问者所用用浏览器的方式来转换你的代码。\n\
  \n### 适合你的 Browserslist 查询\n\n如果你使用 Google Analytics，你可以将多达三十天的访问者数据输入 `Can I Use`，它将识别出你的访问者使用的浏览器。在该网站上，打开设置对话框并找到“Add\
  \ from Analytics”（从 Analytics 添加）部分（图 5.5）：\n\n导入数据后，你将获得关于网站访问者所用浏览器的层级概述。完成后，`Can\
  \ I Use` 还会在访问者层面对特性支持进行上下文处理（图 5.6）。\n\n了解这些可以帮助你确定正确的 Browserslist 查询。例如，Legendary\
  \ Tones 是我维护的一个网站，作者是一位关于吉他、吉他配件和自定义放大器修改写博客的作家。他在许多国家都有大量读者，因此他的读者使用的浏览器非常多样化。遗憾的是，这意味着有不小比例的访问者在使用\
  \ Internet Explorer 11。为了兼容旧浏览器，我使用了 `ie 11` 的 Browserslist 查询。\n\n![caniuse.com\
  \ “使用数据”配置对话框](img/5.5.png)\n\n图 5.5：在 Can I Use 网站的这个对话框中，有一个“Add from analytics”部分，你可以在那里导入特定网站的\
  \ Google Analytics 数据。\n\n![基于的浏览器使用数据的“ECMAScript 2015 (ES6)”详细支持数据](img/5.6.png)\n\
  \n图 5.6：当 `Can I Use` 为给定网站导入 Google Analytics 数据时，某个特性的支持百分比也将限制在这些数据范围内。\n\n请注意，任何群体的浏览器使用情况都会随时间而变化。如果定期重新评估\
  \ `Can I Use` 网站上的支持数据不合理，你可能倾向于使用命令行解决方案。`browserslist-ga` ([`bkaprt.com/rjs39/05-20`](http://bkaprt.com/rjs39/05-20))\
  \ 就是这样一个包，它可以将你的分析数据直接带入你的工具链中。\n\n遗憾的是，你可能会发现没有一个单一的 Browserslist 查询可以在性能和兼容性之间取得恰的平衡。你可能有足够的人在使用旧浏览器，让你不至于减少转换的特性，但你仍然想找到一种方法，避免向那些使用现代浏览器的人发送这些转换。\n\
  \n幸运的是，有一种方法可以做到这一点。\n\n## 智能打包与交付\n\n这是一个非常让人头疼的情况：你网站的大部分访问者使用原生支持现代 JavaScript\
  \ 特性的浏览器。然而，仍有一小部分但不可忽视的人群在使用不支持这些特性的浏览器。你有选择：\n\n1. 你*可以*仅仅为绝大多数使用现代浏览器的用户提供使用新语言特性的未转换的\
  \ JavaScript，并接受旧浏览器用户获得下降甚至崩溃的体验。\n2. 你可以反转策略，在编写 JavaScript 源码时采用未转换的旧语法。这样，它在你需要的任何地方都能兼容，而无需转译器（尽管这也意味着要避免所有新奇颖的东西）。事实上，这是\
  \ GOV.UK 直到 2021 年所采取的做法，因为在 2021 年上半年，他们大约 2% 的访问者仍在使用某些版本的 Internet Explorer ([`bkaprt.com/rjs39/05-21`](http://bkaprt.com/rjs39/05-21))。\n\
  3. 你可以使用所有的现代语言特性，并将源代码编译成两套包——一组针对旧浏览器，另一组针对现代浏览器，然后根据浏览器能力进行交付。这被称为*差异化交付*（differential\
  \ serving）。\n\n第一种方案可能会变得危险：什么到底构成了“现代”浏览器？你的定义与你在 JavaScript 中使用的特性一致吗？这些特性在那些浏览器中有广泛支持吗？对于那些浏览器并不如你想象中那么“现代”的访问者，会发生什么？你正在划出一条分界线，可能会排除比你预期的更多的人。\n\
  \n第二种方案更安全*且*比第一种更具包容性——但它要求你将使用新事物的强烈欲望放在后面，以提供更广泛的兼容体验。作为参考，A11Y 项目在他们的技术声明中规定，他们故意使用预-ES6\
  \ 语法 ([`bkaprt.com/rjs39/02-09`](http://bkaprt.com/rjs39/02-09)) 以完全避免转译器。这是一个值得仔细考虑的有效方法。它减少了对不断工具的依赖，并最大化了兼容性。\n\
  \n取决于你需要支持哪些浏览器，前两种方案中的任何一种可能足够了。在必须支持特性较少的浏览器，但又不想为那些特性较多的浏览器发送大量额外转换的情况下，第三种方案更有意义。它不像前两种那么简单，但在特定场景下它可能正是你需要的。\n\
  \n### 编译两套包\n\n差异化交付最困难的部分是设置你的工具链来生成两套包。具体实现取决于你使用什么打包器和转译器，但工具链架构通常是相同的（图 5.7）。\n\
  \n![一个标记为“bundler”的框图标，一个指向“Entry point”文件图标的箭头。一个标记为“modern config”的箭头指向“module\
  \ tree”文件图标，然后指向“modern bundle”文件图标。第二个标记为“legacy config”的箭头指向第二个“module tree”文件图标，然后指向“legacy\
  \ bundle”文件图标。](img/5.7.png)\n\n图 5.7：对于差异化交付，打包器通过两个配置从同一个入口点输出两套包。\n\n无论你选择什么打包器或转译器，你都需要确保你的工具链具有相应的结构：\n\
  \n1. 你的转译器将需要导出两个配置：一个针对旧浏览器的 Browserslist 查询，另一个针对现代浏览器。在后的情况下，Babel 的 `preset-env`\
  \ 在其 `targets` 配置中提供了 `esmodules` 选项 ([`bkaprt.com/rjs39/05-22`](http://bkaprt.com/rjs39/05-22))。\n\
  2. 你的打包器也需要两个独立的配置，每个配置引用相应的转译配置。多个配置可以以数组的形式传递给打包器——这种方法适用于 `webpack` 和 `Rollup`\
  \ 等打包器。\n\n这两项任务都需要一些工作才能完成，细节在本文空间内无法详述。具体来说，你可以参考我编写的关于如何为 `webpack` 实现此点的指南 ([`bkaprt.com/rjs39/05-23`](http://bkaprt.com/rjs39/05-23))，以及一个现场编码演示\
  \ ([`bkaprt.com/rjs39/05-24`](http://bkaprt.com/rjs39/05-24))。我还有一个示例仓库可以使用 ([`bkaprt.com/rjs39/05-25`](http://bkaprt.com/rjs39/05-25))。\n\
  \n通过这种打包策略获得的收益取决于项目。如果你正在使用需要为旧浏览器转换的较特性，你可能会获得 30% 到 50% 的收益，而现代浏览器用户下载的 JavaScript\
  \ 将显著更少（图 5.8）。你还有一个相邻的机会，可以在你的现代包中发送更少的 polyfill（补丁），因为目标浏览器原生支持它们。\n\n\n\n\n\n\
  如果你已经实现了这一步，那是一件了了。将生产环境的 JavaScript 资源进行分流以兼顾旧版和现代浏览器并非易事——但你只完成了一半。你仍然需要构建标记，以便将这些包提供给正确的浏览器。\n\
  \n![项目 webpack 包的两种可视化方案。顶部的包包含了旧版浏览器所需的转换和填充程序（polyfills），大小为 68.48 KiB。底部的包 几乎不需要这些内容，体积小了\
  \ 60%，仅为 26.75 KiB。](img/7.png)\n\n图 5.8：项目 webpack 包的两种可视化方案。顶部的包包含了旧版浏览器所需的转换和填充程序，大小为\
  \ 68.48 KiB。底部的包 几乎不需要这些内容，体积小了 60%，仅为 26.75 KiB。\n\n### `module`/`nomodule` 模式\n\
  \n我们并不怎么在意 `<script>` 元素。随手写上一个 `src`，可能调一下 `defer` 或 `async` 属性，就可以开始工作了。然而，当我们打包并提供两个版本的\
  \ JavaScript 时，有一种需要我们关注的新方法：`module`/`nomodule` 模式。\n\n这种模式提供了两种提供 JavaScript 的并行方式：\n\
  \n1.  通过将 `<script>` 元素的 `type` 属性值设置为 `module`，我们可以针对支持 ESM 的浏览器——并关联地支持许多其他现代\
  \ JavaScript 语言特性。\n\n2.  通过在 `<script>` 元素上应用 `nomodule` 属性，我们可以间接地针对不支持 ESM 和其他现代性的浏览器。\n\
  \n我们可以结合这两种模式：\n\n```html\n<!-- 提供现代包 -->\n```\n\n```html\n<script type=\"module\"\
  \ src=\"/js/app.mjs\"></script>\n```\n\n```html\n<!-- 提供旧版包 -->\n```\n\n```html\n\
  <script nomodule defer src=\"/js/app.js\"></script>\n```\n\n这通过依赖两种标准化行为实现了差异化服务的目标：\n\
  \n1.  浏览器不会下载其不识别的 `type` 属性值的脚本。在这种情况下，现代浏览器将下载 `type` 属性值为 `modern` 的脚本，但旧版浏览器则不会。\n\
  \n2.  相反，旧版浏览器不识别 `nomodule` 属性，因此它们会下载使用该属性的脚本。然而，现代浏览器*会*识别 `nomodule`，所以它们会跳过带有该属性的脚本。\n\
  \n尽管如此，某些浏览器并没有正确处理这种模式。某些浏览器存在两个包都被下载的问题。有些甚至会执行两个包([`bkaprt.com/rjs39/05-26`](http://bkaprt.com/rjs39/05-26))）。不过你有选择：\n\
  \n1.  由于不正确遵循此模式的浏览器最终会退出舞台，你可能会发现这些次优化是可以接受的。\n\n2.  如果即使对于网站极小部分访问者重复获取脚本也是不可接受的，你可以依赖脚本注入模式，通过检查浏览器对\
  \ `<script>` 元素 `nomodule` 属性的支持([`bkaprt.com/rjs39/05-27`](http://bkaprt.com/rjs39/05-27))）。\n\
  \n3.  如果这两个选项都不可接受，你可以选择服务端方法。一种方法依赖于通过 `browslist-useragent` 包进行用户代理嗅探（user agent\
  \ sniffing）([`bkaprt.com/rjs39/05-28`](http://bkaprt.com/rjs39/05-28))，它本身依赖于 Can\
  \ I Use 的兼容性数据([`bkaprt.com/rjs39/05-29`](http://bkaprt.com/rjs39/05-29))。\n\n\n\
  \n\n\n具体来说：我编写了一个 Codepen 示例，展示了如何创建一个基于 Grid Layout（网格布局）的演示界面，它能够自动填充空白区域的元素（[`bkaprt.com/rjs39/06-03`](http://bkaprt.com/rjs39/06-03)）。标记由一个包含许多\
  \ `<li>` 元素的 `<ul>` 组成，这些元素包含了黄马的图片（图 6.2）。`<ul>` 本身的样式如下：\n\n![一张黄马图片的“砖墙式”网格布局，带有毫米为单位的尺寸。标题：“我最喜欢的几种翅目虫。”](img/6.2.png)\n\
  \n图 6.2：一个完全响应式的网格布局示例，它会根据视口宽度自动填充元素。\n\n```css\nul {\n  display: grid;\n  grid-gap:\
  \ 1rem;\n  grid-auto-flow: dense;\n  max-width: 72rem;\n  margin: 0 auto;\n  grid-template-columns:\
  \ repeat(auto-fit, minmax(12rem, 1fr));\n  grid-auto-rows: 12rem;\n}\n```\n\n如果你不熟悉\
  \ Grid Layout，这些规则比你想象的要简洁得多。在所有设备上，它都会创建一个遵循以下规则的完全响应式网格布局：\n\n*   `<ul>` 的每一行将根据当前视口宽度包含尽可能容纳的列。\n\
  *   每一列的宽度至少为 192 像素（`12rem`），但可以扩展到等比例的一个分数单位的大小（[`bkaprt.com/rjs39/06-04`](http://bkaprt.com/rjs39/06-04)）。\n\
  *   行会根据需要自动添加，每行的高度为 192 像素（`12rem`）。此外，通过 `grid-auto-flow: dense;` 规则，新项目将密集地填充在任何可以容下的地方。\n\
  \n随后，我们将在屏幕尺寸大于 448 像素（`28rem`）时，对 `<ul>` 的 `<li>` 子元素使用 `:nth-child` 选择器，并包含两个额外的\
  \ Grid Layout 属性，来让布局增加一些活力：\n\n```css\n@media screen and (min-width: 28rem) {\n\
  \  li:nth-child(4n + 4) {\n    grid-column: span 2;\n    grid-row: span 2;\n  }\n\
  }\n```\n\n抛开这些不谈，这是纯粹的 CSS！没有理由去寻求那些加载了过多必要 CSS 的现成布局解决方案——面对事实吧，如果你加载了更多的 CSS，留给\
  \ JavaScript 的空间就越少。Grid Layout 也得到了良好的支持（[`bkaprt.com/rjs39/06-05`](http://bkaprt.com/rjs39/06-05)）。更好的是，它不会将你局限于简单的布局（图\
  \ 6.3）。\n\n![一个文本密集的网格布局；页面内容倾斜了 45 度。](img/6.3.png)\n\n图 6.3：在大屏幕上显示的 Jen Simmons\
  \ 布局实验室的由 CSS Grid Layout 驱动的落地页（[`bkaprt.com/rjs39/06-06`](http://bkaprt.com/rjs39/06-06)）。\n\
  \n如果你想构建真正引人注目、突破我们对 Web 视觉边界的布局，CSS 框架为你抽象了太多的 CSS 特性和复杂选择器，导致你无法充分利用它们。关于关于现代\
  \ CSS 布局模式的更多阅读，请查看资源部分。\n\n### 懒加载，现在由 HTML 呈现\n\n懒加载是一种跨越时代的性能模式。它不仅节省带宽，还能减少启动时对其他关键资源（包括\
  \ JavaScript！）的带宽竞争。\n\n在 Web 的长发展，懒加载很大程度上一直是 JavaScript 的任务。现在大多数情况下我们不需要 JavaScript\
  \ 来实现这一点，因为 HTML 本身提供了一种懒加载 `<img>` 和 `<iframe>` 元素引用资源的方法。这是好事，因为 JavaScript 驱动的懒加载其潜在缺点无处不在：\n\
  \n*   不可避免，所有基于 JavaScript 的懒加载器都需要主线程时间。\n*   如果用户禁用了 JavaScript，你需要 `<noscript>`\
  \ 回退标记。这会为你的标记增加许多额外的字节（[`bkaprt.com/rjs39/06-07`](http://bkaprt.com/rjs39/06-07)）。\n\
  *   除了某些可能禁用了 JavaScript 之外，某些网络或浏览器插件可能会阻止 JavaScript——或者你的懒加载器可能完全无法加载。\n*   图片——无论是否懒加载——在\
  \ `<img>` 元素都需要 `width` 和 `height` 属性以防止布局偏移。如果你忘记这样做，你网站的累计布局偏移（CLS，见第 3 章）得分可能会降低。\n\
  *   除非你考虑到检查搜索引擎，否则懒加载的媒体不会被搜索引擎索引（[`bkaprt.com/rjs39/06-08`](http://bkaprt.com/rjs39/06-08)）。\n\
  \n## 观察这个\n\n各种观察者 API（Observer APIs）遵循类似的模式来观察页面某些方面的变化：它们观察一个目标（例如 DOM 节点），每当检测到目标发生变化时，就会运行回调函数。\n\
  \n观察者值得学习，因为它们取代了过去的反模式，即我们浪费资源，比如不断轮询元素的可见性。观察者将昂贵的工作变为廉价的工作（图 6.4）。\n\n说到检查元素可见性，让我们从这里开始。有时你需要\
  \ JavaScript 来告诉某些内容是否在视口内。使用 Intersection Observer API 的常见例子是懒加载媒体。\n\n“但是，”你坚持道，“你刚刚说\
  \ HTML 已经处理了这一点！”确实如此！但仅针对 `<iframe>` 和 `<img>` 元素，而这些并不是你可以懒加载的唯一东西。`<video>` 元素的占位图该怎么办？\n\
  \n```html\n<video width=\"500\" height=\"257\" poster=\"cats-being-jerks.jpg\">\n\
  \  <source src=\"cats-being-jerks.webm\" type=\"video/webm\">\n  <source src=\"\
  cats-being-jerks.mp4\" type=\"video/mp4\">\n</video>\n```\n\n\n\n\n\n如果你不熟悉 `<video>`\
  \ 图像占位符，它们的工作原理如下：如果你有一个不会自动播放的视频，你可以将其 `poster` 属性指向一张图像，该图像将在视频播放前一直显示。\n\n假设你有一篇文章，其中有很多带有占位符图像的内联视频——这可是大量的数据。你可以通过将\
  \ `poster` 属性替换为等效的 `data-` 属性来懒加载视频海报图像，该属性包含了要加载的占位符图片的 URL：\n\n```html\n<video\
  \ width=\"500\" height=\"257\" data-poster=\"cats-being-jerks.jpg\">\n```\n\n剩余的工作涉及\
  \ `Intersection Observer API`，对于这种用例，它看起来如下：\n\n```javascript\nconst videoObserver\
  \ = new IntersectionObserver((entries, observer) => {\n  entries.forEach(entry =>\
  \ {\n    if (entry.isIntersecting || entry.intersectionRatio) {\n      const video\
  \ = entry.target;\n      video.setAttribute(\"poster\", video.dataset.poster);\n\
  \      video.removeAttribute(\"data-poster\");\n      observer.unobserve(video);\n\
  \    }\n  });\n});\n\nconst videos = document.querySelectorAll(\"video[data-poster]\"\
  );\nvideos.forEach(video => {\n  videoObserver.observe(video);\n});\n```\n\n以下是代码段中正在发生的情况：\n\
  \n1. 我们创建了一个 `IntersectionObserver` 实例并将其赋值给名为 `videoObserver` 的变量。\n2. `IntersectionObserver`\
  \ 实例接受一个回调函数作为参数。该回调有两个参数：首先是检测到的可见性变化集合——在本例中是我们的 `<video>` 元素——其次是 `IntersectionObserver`\
  \ 实例本身。\n3. 在回调内部，我们遍历 `entries`。如果发现任何 `<video>` 元素当前位于视口内，我们就从 `data-poster` 属性中读取最终图像\
  \ URL，并将其填充到元素的 `poster` 属性中。之后，我们告诉 `IntersectionObserver` 实例停止观察该元素。\n4. 然后我们选择所有带有\
  \ `data-poster` 属性的 `<video>` 元素，告诉新创建的 `IntersectionObserver` 实例观察它们的变化。\n\n通过这段代码，我们得到了一个懒加载解决方案，将繁重的工作交给了它该去的地方：浏览器内部，那里这些工作可以更高效地完成。\n\
  \n这是一个简单（但有效！）的 Intersection Observer 示例。Intersection Observer 可以通过多种方式监控变化，包括限制其观察范围、观察元素的部分可见性等（[`bkaprt.com/rjs39/06-11`](http://bkaprt.com/rjs39/06-11)）。它的潜在用途是巨大的；如果你能想到任何想要监控元素可见性、并在可见性变化时执行某些工作的情况，那么\
  \ Intersection Observer 就是完成该任务的正确工具，而且它的执行速度*非常快*。\n\nIntersection Observer 并不是这里唯一的观察者。我们还有\
  \ `Mutation Observer` 用于检测 DOM 是否发生了变化，`Resize Observer` 用于检测元素大小是否发生变化，以及 `Performance\
  \ Observer` 用于检测是否有新条目被添加到 `Navigation` 或 `Resource Timing` 等性能 API 中。要获取有关它们的更多信息，请参阅书末的“资源（Resources）”章节。\n\
  \n## 观察空闲时间\n\n想象一下制作披萨涉及的不同任务。你可能有一些需要活跃且持续关注直到完成的任务，比如揉面团并点上酱料和配料。然后还有像把披萨放入烤箱这样的任务，在烘烤完成之前不需要你的注意力。\n\
  \n我们在 JavaScript 中做的工作可以进行类似的分类。由用户分发的操作——例如打开导航菜单或验证表单——是需要立即关注的关键任务的良好示例。\n\n\
  但不是由用户驱动的任务（例如将分析数据发送到收集端点）并不需要立即关注。这些任务应该降低优先级，以便为那些*确实*关键的任务释放出更多主线程时间。这就是 `requestIdleCallback`\
  \ 派上用场的地方。\n\n### 等一等：空闲回调\n\n`requestIdleCallback` 类似于 `setTimeout`，你将一个回调函数作为第一个参数传递它：\n\
  \n```javascript\nrequestIdleCallback(() => {\n  // 当浏览器空闲时运行此回调。\n});\n```\n\n但与\
  \ `setTimeout` 不同，你还可以选择地传递一个带有毫秒级超时值的对象作为第二个参数：\n\n```javascript\nrequestIdleCallback(()\
  \ => {\n  // 当浏览器空闲时运行此回调，\n  // 但要在未来五秒内运行它。\n}, {\n  \"timeout\": 5000\n});\n\
  ```\n\n此外，与 `setTimeout` 不同，`requestIdleCallback` 并不会将回调的执行推到未来的某个指定时间。第一个参数是一个*空闲回调*，意味着它将在主线程空闲时执行。如果从未向\
  \ `requestIdleCallback` 传递超时时间，那么回调只有在——且仅当主线程空闲时才会运行。如果指定了时间，那么回调必须在该时间之前运行，否则它将在截止日期时运行。\n\
  \n有许多机会使用 `requestIdleCallback` 来推迟非关键的主线程工作，但让我们从简单的开始。每个页面都使用 `requestIdleCallback`\
  \ 将手风琴组件的打开/关闭状态写入 `localStorage`，以供回归访客使用（[`bkaprt.com/rjs39/06-11`](http://bkaprt.com/rjs39/06-11)）。\n\
  \n此函数在后续视图中获取打开/关闭状态：\n\n```javascript\nfunction setTOCState(detailsElement) {\n\
  \  const tocStateJSON = localStorage.getItem(\"toc-state\");\n  const tocState =\
  \ tocStateJSON === null ? [] : JSON.parse(tocStateJSON);\n  const currentPathIndex\
  \ = tocState.indexOf(document.location.pathname);\n\n  if (!detailsElement.open)\
  \ {\n    tocState.push(document.location.pathname);\n  } else if (detailsElement.hasAttribute(\"\
  open\") && currentPathIndex !== -1) {\n    tocState.splice(currentPathIndex, 1);\n\
  \  }\n  localStorage.setItem(\"toc-state\", JSON.stringify(tocState));\n}\n```\n\
  \n当目录的 `<details>` 元素被点击时，此函数被作为回调传递给 `requestIdleCallback`：\n\n```javascript\n\
  const detailsElement = document.querySelector(\"details.v-toc\");\ndetailsElement.addEventListener(\"\
  toggle\", () => {\n  if (\"requestIdleCallback\" in window) {\n    requestIdleCallback(()\
  \ => {\n      setTOCState(detailsElement);\n    });\n    return;\n  }\n});\n```\n\
  \n\n\n\n\n```\nsetTOCState(detailsElement);\n```\n\n```\n```\n\n`<details>` 元素的\
  \ `toggle` 事件处理程序并不负责目录的可见性切换，因为这种功能是 HTML 本身就免费提供的——但它*确实*会调用 `setTOCState`。在其中，我们检查\
  \ `requestIdleCallback` 是否可用。如果可用，我们将 `setTOCState` 作为不带截止日的空闲回调传递进去（图 6.6）。如果 `requestIdleCallback`\
  \ 不可用，则 `setTOCState` 将立即运行。\n\n![Chrome 性能分析器时间线。“Fire idle callback”在父任务“task”开始后立即开始，紧接着是“function\
  \ call”。](img/6.6.png)\n\n图 6.6：如 Chrome 性能分析器中所示，记录 A11Y Project 网站目录可见状态的空闲回调。\n\
  \n当空闲回调在没有截止日期的情况下进入队列时，它们的顺序是先入制。虽然这对于 A11Y Project 的用途完全没问题，但如果页面在空闲回调执行之前被卸载，这些工作可能永远无法完成。如果空闲回调*必须*运行，你将需要尝试不同的策略。\n\
  \n### 使用紧急策略管理空闲回调\n\n使用 `requestIdleCallback` 管理截止日期是困难的。一种方法是先注册一个不带截止日的空闲回调，如果情况紧急，则取消该空闲回调并立即执行最初延迟的函数。\n\
  \n假设你有一个网站，它会将字段数据发送到端点。由于这是低优先级工作，它不应该干扰任何关键的主线程任务。这可能并不容易，但是可行的。首先，我们只在窗口 `load`\
  \ 事件触发后的某个时间向端点发送数据。这将保持主线程在启动期间不被低优先级工作占用。\n\n然而，下一部分更为棘手。因为如果主线程从未空闲，不带截止日的空闲回调可能不会运行，我们希望它在页面卸载*之前*运行。为了适应这一点，我们可以使用这样的函数：\n\
  \n```\nfunction urgentIdleCallback (eventOwner, eventString, idleCallback) {\n \
  \ if (\"requestIdleCallback\" in window) {\n    let callbackRan = false;\n    const\
  \ idleCallbackHandle = requestIdleCallback(() => {\n      idleCallback();\n    \
  \  callbackRan = true;\n    });\n    eventOwner.addEventListener(eventString, ()\
  \ => {\n      if (!callbackRan) {\n        cancelIdleCallback(idleCallbackHandle);\n\
  \        idleCallback();\n      }\n    }, {\n      once: true\n    });\n    return;\n\
  \  }\n  idleCallback();\n}\n```\n\n`urgentIdleCallback` 接受三个参数：\n\n1.  `eventString`，也就是，一个事件字符串（例如，`\"\
  click\"`）。\n2.  `eventOwner`，是 `eventString` 中指定事件的所有者。可以是任何支持 `addEventListener`\
  \ 的对象。\n3.  `idleCallback`，是传递给 `requestIdleCallback` 的空闲回调。\n\n通过上述参数，`urgentIdleCallback`\
  \ 执行以下例程：\n\n1.  `urgentIdleCallback` 首先检查 `requestIdleCallback` 是否可用。如果不可用，`idleCallback`\
  \ 立即运行。\n2.  我们用名为 `callbackRan` 的变量（初始化为 `false`）来跟踪空闲回调是否已经运行。\n3.  使用 `requestIdleCallback`\
  \ 注册空闲回调，它返回一个回调句柄，如果我们需要取消空闲回调，则稍后使用它。在空闲回调内部，`idleCallback` 将运行，并将 `callbackRan`\
  \ 设置为 `true`。\n4.  因为空闲回调可能不会立即运行，所以我们注册了一个作为截止日的事件监听器。\n5.  在事件的回调中，我们检查空闲回调是否已运行。如果没有运行，我们使用\
  \ `cancelIdleCallback` 取消空闲回调，该函数接受早先在 `idleCallbackHandle` 中存储的句柄。然后回调立即运行。\n6.\
  \  由于我们希望截止日期事件监听器在这种情况下只触发一次，因此向 `addEventListener` 传递了一个包含 `once: true` 键值对的选项对象。\n\
  \n现在，我们注册我们的紧急空闲回调来运行 `sendAnalytics` 方法，该方法将字段数据传输到收集端点：\n\n```\nurgentIdleCallback(window,\
  \ \"pagehide\", sendAnalytics);\n```\n\n这种模式可以用于几种不同的情况。在这里只是随口一议一下，你可以为不太可能立即执行的操作初始化事件处理程序。或者，你可以为折叠以下的内容渲染客户端标记。\n\
  \n这并不是什么前沿技术。Phil Walton 将其推广为“空闲直到紧急”模式（[`bkaprt.com/rjs39/06-12`](http://bkaprt.com/rjs39/06-12)）。Phil\
  \ 的方法在语法上与我的不同，但实现了类似的结果。他还提供了一个名为 `idlize` 的小型 npm 包，它可以有助于这种模式，包括空闲回调队列（[`bkaprt.com/rjs39/06-13`](http://bkaprt.com/rjs39/06-13)）。\n\
  \n只需记住一点：永远不要用 `requestIdleCallback` 处理那些*必须*立即发生的事情。在容忍度较低的环境中，空闲回调的处理时间更长。`requestIdleCallback`\
  \ 备方案\n\n尽管有良好的浏览器支持，`requestIdleCallback` 并非无处不在（[`bkaprt.com/rjs39/06-14`](http://bkaprt.com/rjs39/06-14)）。尽管有\
  \ `requestIdleCallback` 的填充性方案，但它无法完美模拟。如果你倾向于这个方向，请谨慎操作：\n\n*   你可以在 `requestIdleCallback`\
  \ 不可用的情况下采用立即运行回调的方法。这可行，但并非每个人都能获得相同的体验。对于 `requestIdleCallback`，我不认为这那么糟糕——如果你必须使用带截止日的\
  \ `requestIdleCallback`，一种备方案可以是 `setTimeout`。`setTimeout` 与 `requestIdleCallback`\
  \ 不对等，但值得考虑（[`bkaprt.com/rjs39/06-15`](http://bkaprt.com/rjs39/06-15)）。\n*   最后——如果其他策略无效，这是最直接的方法——使用填充性方案，但要理解任何\
  \ `requestIdleCallback` 的填充都无法模拟原生实现（[`bkaprt.com/rjs39/06-16`](http://bkaprt.com/rjs39/06-16)）。\n\
  \n## 离开主线程\n\n把主线程想象成像快餐店的前台。当整个店人手不足时，不仅没有足够的员工来点订单，也没有足够的员工来做菜以完成订单。随着订单堆积，服务会恶化。如果没有足够的员工支持前台，服务就会受到影响。\n\
  \n如果前台员工代表主线程，你可以把支持他们的一切都想象成类似于工作线程的东西。就像柜台后方的厨师一样，当有大量工作时，*web workers* 可以保持主线程顺畅运行（图\
  \ 6.7）。\n\n虽然 web workers 的用途很多，但在没有真实案例的情况下，可能很难确定你可能用它们做什么，所以让我们一起探索一个吧。\n\n\n\
  \n\n![如 Chrome 性能分析器所示，在 Home Depot 网站上运行于独立线程的 web worker 调用堆栈。该线程上的任务为主线程留出了呼吸空间，以处理更紧急和面向用户的工作。](img/6.7.png)\n\
  \n图 6.7：如 Chrome 性能分析器所示，在 Home Depot 网站上运行于独立线程的 web worker 调用堆栈。该线程上的任务为主线程留出了呼吸空间，以处理更紧急和面向用户的工作。\n\
  \n### 将耗时任务移动到 web workers\n\n经常被引用的 web workers 示例包括在 worker 线程中获取并处理大量数据，然后将结果传递到主线程。虽然这是一个很棒用例，但并不是唯一的用例。\n\
  \n假设你正在构建一个摄影 Web 应用，人们需要访问 Exif 数据，这是数字相机捕集的图像元数据的宝库。你可能使用 `fetch` 发图像文件的数据请求，使用\
  \ `ArrayBuffer` 将原始数据转换为二进制数据流（[`bkaprt.com/rjs39/06-17`](http://bkaprt.com/rjs39/06-17)），然后从中提取\
  \ Exif 数据。\n\n不过，这并不是易事，因此你可以使用像 `ExifReader`这样的包（[`bkaprt.com/rjs39/06-18`](http://bkaprt.com/rjs39/06-18)）来为你处理图像\
  \ Exif 数据。然而，在主线程上执行这些会在几个方面产生相当的工作量：\n\n* 在主线程上加载 `ExifReader`\n* 启动对图像资产的 `fetch`\n\
  * 将图像响应转换为 blob，并最终转换为 `ArrayBuffer`，同时提取 Exif 数据\n* 构建用于显示 Exif 数据的标记语言\n\nJavaScript\
  \ 引擎会尽力将工作拆分为可管理的块，但长任务并不总是可以避免的。因此，这些工作最好留给单独线程处理。\n\n为了演示如何通过 web worker 从网络获取图像并从中提取\
  \ Exif 数据，我创建了一个名为 `JPEG Metadata Extractor` 的演示应用（[`bkaprt.com/rjs39/06-19`](http://bkaprt.com/rjs39/06-19)）来恰好完成这些工作。\n\
  \n该应用的仓库包含两个标签。第一个（[`bkaprt.com/rjs39/06-20`](http://bkaprt.com/rjs39/06-20)）在主线程上执行所有的\
  \ `fetch` 和元数据提取（图 6.8）。第二个（[`bkaprt.com/rjs39/06-21`](http://bkaprt.com/rjs39/06-21)）执行与第一个相同的工作，只是它在\
  \ worker 线程上执行了大部分工作（图 6.9）。\n\n![显示在主线程上发生的图像获取和 Exif 元数据提取。结果是在主线程上发生了两个长任务，总阻塞时间接近\
  \ 150 毫秒。](img/6.8.png)\n\n图 6.8：显示在主线程上发生的图像获取和 Exif 元数据提取。结果是主线程上发生了两个长任务，总阻塞时间接近\
  \ 150 毫秒。\n\n![主线程活动（顶部）和 web worker 活动（底部）。虽然表单提交和 Exif 标记插入必须在主线程上进行，但图像获取和 Exif\
  \ 提取工作在单独线程上进行，减少了主线程的阻塞时间。(image/6.9.png)\n\n图 6.9：主线程活动（顶部）和 web worker 活动（底部）。虽然表单提交和\
  \ Exif 标记插入必须在主线程上进行，但图像获取和 Exif 提取工作在单独线程上进行，减少了主线程的阻塞时间。\n\n演示应用的界面接受 JPEG URL，该\
  \ URL 通过 `fetch` 获取。即使我们使用 web worker，*某些*事情仍然必须主线程上完成：\n\n* 在表单上注册 `submit` 事件监听器\n\
  * 验证表单输入\n* 将图像 URL 传递给 web worker\n\n之后的几乎所有工作都可以在 web worker 中完成，它位于一个名为 `exif-worker.js`\
  \ 的单独脚本中。在主线程上这样注册 web worker：\n\n```\nconst exifWorker = new Worker(\"/js/exif-worker.js\"\
  );\n```\n\n然后，我们在 web worker 中使用 `importScripts` 函数导入 `ExifReader`（[`bkaprt.com/rjs39/06-22`](http://bkaprt.com/rjs39/06-22)）。`importScripts`\
  \ 接受一个 URL 字符串来导入用于 worker 作用域的外部脚本：\n\n```\nimportScripts(\"/js/exifreader.js\"\
  );\n```\n\n某些浏览器中，如果你以模块模式注册 web worker，可以使用静态 `import` 语法来导入脚本（[`bkaprt.com/rjs39/06-23`](http://bkaprt.com/rjs39/06-23)）。不过，根据浏览器的支持，你可能不得不坚持\
  \ `importScripts`。\n\n### 主线程与 worker 线程之间的通信\n\nWeb workers 只有在它们与主线程之间可以双向通信时才有用。为了演示如何通过\
  \ web worker 从网络获取图像并从中提取 Exif 数据，我创建了一个名为 `JPEG Metadata Extractor` 的演示应用（[`bkaprt.com/rjs39/06-19`](http://bkaprt.com/rjs39/06-19)）来恰好完成这些工作。\n\
  \n演示应用的界面接受 JPEG URL，该 URL 通过 `fetch` 获取。即使我们使用 web worker，*某些*事情仍然必须主线程上完成：\n\n\
  * 在表单上注册 `submit` 事件监听器\n* 验证表单输入\n* 将图像 URL 传递给 web worker\n\n之后的几乎所有工作都可以在 web\
  \ worker 中完成，它位于一个名为 `exif-worker.js` 的单独脚本中。在主线程上这样注册 web worker：\n\n```\nconst\
  \ exifWorker = new Worker(\"/js/exif-worker.js\");\n```\n\n然后，我们在 web worker 中使用\
  \ `importScripts` 函数导入 `ExifReader`（[`bkaprt.com/rjs39/06-22`](http://bkaprt.com/rjs39/06-22)）。`importScripts`\
  \ 接受一个 URL 字符串来导入用于 worker 作用域的外部脚本：\n\n```\nimportScripts(\"/js/exifreader.js\"\
  );\n```\n\n某些浏览器中，如果你以模块模式注册 web worker，可以使用静态 `import` 语法来导入脚本（[`bkaprt.com/rjs39/06-23`](http://bkaprt.com/rjs39/06-23)）。不过，根据浏览器的支持，你可能不得不坚持\
  \ `importScripts`。\n\n### 主线程与 worker 线程之间的通信\n\nWeb workers 只有在它们与主线程之间可以双向通信时才有用。为了演示如何通过\
  \ web worker 从网络获取图像并从中提取 Exif 数据，我创建了一个名为 `JPEG Metadata Extractor` 的演示应用（[`bkaprt.com/rjs39/06-19`](http://bkaprt.com/rjs39/06-19)）来恰好完成这些工作。\n\
  \n演示应用的仓库包含两个标签。第一个（[`bkaprt.com/rjs39/06-20`](http://bkaprt.com/rjs39/06-20)）在主线程上执行所有的\
  \ `fetch` 和元数据提取。第二个（[`bkaprt.com/rjs39/06-21`](http://bkaprt.com/rjs39/06-21)）执行与第一个相同的工作，只是它在\
  \ worker 线程上执行了大部分工作（图 6.9）。\n\n演示应用的界面接受 JPEG URL，该 URL 通过 `fetch` 获取。即使我们使用 web\
  \ worker，*某些*事情仍然必须主线程上完成：\n\n* 在表单上注册 `submit` 事件监听器\n* 验证表单输入\n* 将图像 URL 传递给 web\
  \ worker\n\n之后的几乎所有工作都可以在 web worker 中完成，它位于一个名为 `exif-worker.js` 的单独脚本中。在主线程上这样注册\
  \ web worker：\n\n```\nconst exifWorker = new Worker(\"/js/exif-worker.js\");\n```\n\
  \n然后，我们在 web worker 中使用 `importScripts` 函数导入 `ExifReader`（[`bkaprt.com/rjs39/06-22`](http://bkaprt.com/rjs39/06-22)）。`importScripts`\
  \ 接受一个 URL 字符串来导入用于 worker 作用域的外部脚本：\n\n```\nimportScripts(\"/js/exifreader.js\"\
  );\n```\n\n某些浏览器中，如果你以模块模式注册 web worker，可以使用静态 `import` 语法来导入脚本（[`bkaprt.com/rjs39/06-23`](http://bkaprt.com/rjs39/06-23)）。不过，根据浏览器的支持，你可能不得不坚持\
  \ `importScripts`。\n\n### 主线程与 worker 线程之间的通信\n\nWeb workers 只有在它们与主线程之间可以双向通信时才有用。为了演示如何通过\
  \ web worker 从网络获取图像并从中提取 Exif 数据，我创建了一个名为 `JPEG Metadata Extractor` 的演示应用（[`bkaprt.com/rjs39/06-19`](http://bkaprt.com/rjs39/06-19)）来恰好完成这些工作。\n\
  \n演示应用的仓库包含两个标签。第一个（[`bkaprt.com/rjs39/06-20`](http://bkaprt.com/rjs39/06-20)）在主线程上执行所有的\
  \ `fetch` 和元数据提取。第二个（[`bkaprt.com/rjs39/06-21`](http://bkaprt.com/rjs39/06-21)）执行与第一个相同的工作，只是它在\
  \ worker 线程上执行了大部分工作。\n\n### 主线程与 worker 线程之间的通信\n\nWeb workers 只有在它们与主线程之间可以双向通信时才有用。为了演示如何通过\
  \ web worker 从网络获取图像并从中提取 Exif 数据，我创建了一个名为 `JPEG Metadata Extractor` 的演示应用（[`bkaprt.com/rjs39/06-19`](http://bkaprt.com/rjs39/06-19)）来恰好完成这些工作。\n\
  \n演示应用的仓库包含两个标签。第一个（[`bkaprt.com/rjs39/06-20`](http://bkaprt.com/rjs39/06-20)）在主线程上执行所有的\
  \ `fetch` 和元数据提取。第二个（[`bkaprt.com/rjs39/06-21`](http://bkaprt.com/rjs39/06-21)）执行与第一个相同的工作，只是它在\
  \ worker 线程上执行了大部分工作。\n\n### 将耗时任务移动到 web workers\n\n经常被引用的 web workers 示例包括在 worker\
  \ 线程中获取并处理大量数据，然后将结果传递到主线程。虽然这是一个很棒用例，但并不是唯一的用例。\n\n假设你正在构建一个摄影 Web 应用，人们需要访问 Exif\
  \ 数据，这是数字相机捕集的图像元数据的宝库。你可能使用 `fetch` 发图像文件的数据请求，使用 `ArrayBuffer` 将原始数据转换为二进制数据流（[`bkaprt.com/rjs39/06-17`](http://bkaprt.com/rjs39/06-17)），然后从中提取\
  \ Exif 数据。\n\n不过，这并不是易事，因此你可以使用像 `ExifReader`这样的包（[`bkaprt.com/rjs39/06-18`](http://bkaprt.com/rjs39/06-18)）来为你处理图像\
  \ Exif 数据。然而，在主线程上执行这些会在几个方面产生相当的工作量：\n\n* 在主线程上加载 `ExifReader`\n* 启动对图像资产的 `fetch`\n\
  * 将图像响应转换为 blob，并最终转换为 `ArrayBuffer`，同时提取 Exif 数据\n* 构建用于显示 Exif 数据的标记语言\n\nJavaScript\
  \ 引擎会尽力将工作拆分为可管理的块，但长任务并不总是可以避免的。因此，这些工作最好留给单独线程处理。\n\n为了演示如何通过 web worker 从网络获取图像并从中提取\
  \ Exif 数据，我创建了一个名为 `JPEG Metadata Extractor` 的演示应用（[`bkaprt.com/rjs39/06-19`](http://bkaprt.com/rjs39/06-19)）来恰好完成这些工作。\n\
  \n演示应用的仓库包含两个标签。第一个（[`bkaprt.com/rjs39/06-20`](http://bkaprt.com/rjs39/06-20)）在主线程上执行所有的\
  \ `fetch` 和元数据提取（图 6.8）。第二个（[`bkaprt.com/rjs39/06-21`](http://bkaprt.com/rjs39/06-21)）执行与第一个相同的工作，只是它在\
  \ worker 线程上执行了大部分工作（图 6.9）。\n\n![显示在主线程上发生的图像获取和 Exif 元数据提取。结果是在主线程上发生了两个长任务，总阻塞时间接近\
  \ 150 毫秒。](img/6.8.png)\n\n图 6.8：显示在主线程上发生的图像获取和 Exif 元数据提取。结果是主线程上发生了两个长任务，总阻塞时间接近\
  \ 150 毫秒。\n\n![主线程活动（顶部）和 web worker 活动（底部）。虽然表单提交和 Exif 标记插入必须在主线程上进行，但图像获取和 Exif\
  \ 提取工作在单独线程上进行，减少了主线程的阻塞时间。(image/6.9.png)\n\n图 6.9：主线程活动（顶部）和 web worker 活动（底部）。虽然表单提交和\
  \ Exif 标记插入必须在主线程上进行，但图像获取和 Exif 提取工作在单独线程上进行，减少了主线程的阻塞时间。\n\n演示应用的界面接受 JPEG URL，该\
  \ URL 通过 `fetch` 获取。即使我们使用 web worker，*某些*事情仍然必须主线程上完成：\n\n* 在表单上注册 `submit` 事件监听器\n\
  * 验证表单输入\n* 将图像 URL 传递给 web worker\n\n之后的几乎所有工作都可以在 web worker 中完成，它位于一个名为 `exif-worker.js`\
  \ 的单独脚本中。在主线程上这样注册 web worker：\n\n```\nconst exifWorker = new Worker(\"/js/exif-worker.js\"\
  );\n```\n\n然后，我们在 web worker 中使用 `importScripts`函数导入 `ExifReader`（[`bkaprt.com/rjs39/06-22`](http://bkaprt.com/rjs39/06-22)）。`importScripts`\
  \ 接受一个 URL 字符串来导入用于 worker 作用域的外部脚本：\n\n```\nimportScripts(\"/js/exifreader.js\"\
  );\n```\n\n某些浏览器中，如果你以模块模式注册 web worker，可以使用静态 `import` 语法来导入脚本（[`bkaprt.com/rjs39/06-23`](http://bkaprt.com/rjs39/06-23)）。不过，根据浏览器的支持，你可能不得不坚持\
  \ `importScripts`。\n\n### 主线程与 worker 线程之间的通信\n\nWeb workers 只有在它们与主线程之间可以双向通信时才有用。\n\
  \n\n\n\n*   它们可以将大量数据的处理工作卸载到后台，以保持主线程空闲处理其他工作。Mapbox GL ([`bkaprt.com/rjs39/06-27`](http://bkaprt.com/rjs39/06-27))\
  \ 正通过加载和渲染地图数据来实现这一点，以确保用户交互尽可能流畅。\n\n*   它们可以在 WASM 编译的二进制文件之间进行图像数据的通信以进行优化。Squoosh\
  \ ([`bkaprt.com/rjs39/06-28`](http://bkaprt.com/rjs39/06-28)) 是一款基于浏览器的图像优化应用，它就是通过这种方式使用\
  \ web workers。\n\n*   它们可以在 web worker 上下文中执行 DOM 更新和变动。Google 的实验性 WorkerDOM 在\
  \ web worker 内部实现了一套 DOM API ([`bkaprt.com/rjs39/06-29`](http://bkaprt.com/rjs39/06-29))。\n\
  \n如果你的网站上需要的工作不需要直接访问 DOM 且计算开销很大，那么 web workers 可以通过减少主线程的工作来提升网站的运行时性能。\n\n##\
  \ 为更快速的 Web 规划航程\n\nWeb 性能不仅仅取决于网站加载有多快。在 JavaScript 方面，这种观点并没有看到全貌。在网站触发 `load`\
  \ 事件*之后*，JavaScript 在网站的可用性中也扮演着同样重要、甚至更重要的角色。\n\n糟糕的运行时性能会引发用户对你网站的不信任。虽然这对业务不利（如果你的业务确实是业务的话），但对用户来说也是坏的。如果你经营的是一个提供任何关键功能的网站，那么监控运行时性能必须是重中之重，特别是对于那些随着时间推移而成熟并增加功能的长期网站。\n\
  \n只要经过一点思考和留心，你就能发现机会，利用本章涵盖的技术来让更多的人在更多设备上获得更好的运行时性能。这项工作造福了每个地方每一个人。当我们进入最后冲刺并接触第三方\
  \ JavaScript 的陷阱时，你需要在主线程上获得尽可能的呼吸空间，以便为顺风航规划航程。\n\n# 第 7 章：管理第三方 JavaScript\n\n\
  ![](img/9.png)\n\n如果你正在寻找“所有黄蜂都是混蛋”这一真理的证据，别找了，看看这种纸黄蜂品种 *Polistes sulcifer*，也被称为杜头纸蜂。\n\
  \n杜头纸蜂看起来像普通的纸黄蜂（具体为 *Polistes dominula*），但有一个重要的区别：它们在很久以前就忘记了如何建造自己的巢穴。幼年雌蜂并没有单打独斗——你知道的，就像任何理性的独栖黄蜂会的那样——而是通过化学拟态和经过考验的“弑王”做法接管了一个普通纸黄蜂蜂群（图\
  \ 7.1）。一旦杜头纸蜂建立了自己新女王的地位，她就会强迫主巢穴的工蜂抚养她的后代。\n\n![一个 *Polistes dominula*纸黄蜂巢。*Polistes\
  \ sulcifer* 物种的雌蜂夺取了这些巢穴的王后，并迫使剩余的工蜂抚养它们的后代。照片拍摄：JAW (http://bkaprt.com/rjs39/07-01)，CC\
  \ BY-SA 3.0 (http://bkaprt.com/rjs39/07-02)，来自 Wikimedia Commons。](img/7.1.png)\n\
  \nFig 7.1：一个 *Polistes dominula*纸黄蜂巢。*Polistes sulcifer* 物种的雌蜂夺取了这些巢穴的王后，并迫使剩余的工蜂抚养它们的后代。照片拍摄：JAW\
  \ ([`bkaprt.com/rjs39/07-01`](http://bkaprt.com/rjs39/07-01)), CC BY-SA 3.0 ([`bkaprt.com/rjs39/07-02`](http://bkaprt.com/rjs39/07-02)),来自\
  \ Wikimedia Commons。\n\n将你的网站想象成快乐的小巢，里面的各种脚本等都在各司其职。在某某一点，你可能会依赖第三方脚本来为你完成一些你自己没有时间去构建解决方案的事情。\n\
  \n一个或两个第三方脚本可能不会对性能造成巨大破坏，但不要误会：它们会随着时间的推移悄悄地渗透。在最坏的情况下，它们会寄生你的网站，并向你的用户发送你甚至都不知道的脚本。由于你可能无法完全消除网站上第三方\
  \ JavaScript 的存在，因此你需要密切关注情况，以防止严重的性能问题出现。\n\n我直说吧：在如此有限的空间内，我们无法涵盖你在处理第三方 JavaScript\
  \ 时会遇到的每一个陷阱。这个主题需要专门写一本书来完全探索。相反，我们将把注意力集中在一些供你考虑的大问题上，以及你可以用来帮助重新控制局势的技术缓解措施。\n\
  \n## 定义术语\n\n即使是区分第一方和第三方 JavaScript 的任务也是一项苦差事，但我会尽力：*第一方 JavaScript*（first-party\
  \ JavaScript）是指我们编写的任何特定于我们网站的 JavaScript，包括它的依赖项。如果你自己写了一些 JavaScript，或者使用包管理器安装了依赖项并将它们打包成从你的域名提供的生产就绪脚本，你通常可以称之为第一方\
  \ JavaScript。\n\n定义第三方 JavaScript 更加困难。有些人可能会说，第三方脚本是从任何来源加载的脚本，但当你从 CDN 甚至子域名加载第一方代码时，这个定义就变得很奇怪。\n\
  \n为了方便起见，我们将*第三方 JavaScript*（third-party JavaScript）定义为任何为网站提供服务的（无论是否付费的）脚本。这可能包括但不限于客户端\
  \ A/B 测试套件、分析和标签管理器、热图工具、无障碍覆盖层等。\n\n这并不是第三方产品的穷尽，但它应该让你了解第三方 JavaScript 包含的内容——正如你将发现的那样，在性能方面存在着非常严重的威胁。\n\
  \n## 损害制造者\n\n第三方 JavaScript 之所以进入网站，是因为它们填补了网站所有者不想或负担不起自己解决的功能缺口。毕竟，开发者的时间是昂贵的，如果\
  \ UX 研究人员、营销人员或产品所有发现购买第三方解决方案的钱比开发自定义解决方案要少，他们很难被指责选择前者。\n\n采用第三方解决方案来解决缺失的功能可能是不可避免的。当这种感觉在整个组织中普遍存在时，你最好问一个尖锐的问题：这个产品有什么用途？然后是一个更尖锐的后续问题：这个产品是否损害了我们的目标？\n\
  \n看看南卡罗来州关于失业援助信息的落地页。它是一个简单的信息页面，但加载了近三兆字节的 JavaScript，解压后达到了十兆字节。这些 JavaScript\
  \ 的大部分都封装在第三方脚本中，它们对加载和运行时性能都有非常严重的损害（图 7.2）。\n\n![南卡罗来州失业援助信息页主线程活跃的 WebPageTest\
  \ 比较。顶部，没有第三方脚本请求被阻塞。底部，所有第三方脚本都被阻塞。如果没有第三方脚本，页面仍然可用且信息量丰富，但会减少一小部分阻塞时间。](img/7.2.png)\n\
  \nFig 7.2：南卡罗来州失业援助信息页主线程活跃的 WebPageTest 比较。顶部，没有第三方脚本请求被阻塞。底部，所有第三方脚本都被阻塞。如果没有第三方脚本，页面仍然可用且信息量丰富，但会减少一小部分阻塞时间。\n\
  \n\n\n\n\n公平地说对南卡罗来纳州而言，此信息页面加载的一些第三方 JavaScript 是有用的，例如 YouTube 嵌入的演示视频。尽管如此，他们也可以通过外部链接直接跳转到\
  \ YouTube 来提供这些信息，或者在用户交互后再内联方式加载，而不是漫无章地嵌入在页面上。\n\n另一方面，另一些第三方东西的用处存疑——特别是聊天插件，需要大量的额外且认为并必要的\
  \ JavaScript。一个很好的替代方案是实用的：给人们提供一个电话号码或电子邮件地址。至少，在有人表现出意图要`use`它之前，聊天插件的任何 JavaScript\
  \ 都不应该加载。\n\n无论如何，对于第三方产品，只有一点是永远真实的：你越不`use` 它们，页面速度就越快。这并不是说它们永远没用，而是要对每一个新脚本保持健康的怀疑。虽然某些第三方脚本对许多组织来说是不可或缺的，但有几个是你需要保持警惕来对待的。\n\
  \n## 客户端 A/B 测试框架\n\nA/B 测试是一种研究形式，用于评估设计、内容或功能的变体如何影响参与度。与其在上线网站上推出重大更改，不如向一半观众展示“新事物”的一个版本，并向另一部分观众展示现状——这至少是最简单的解释了（图\
  \ 7.3）。\n\n![两张 slack.com 的主页具有不同设计布局和文案的截图。](img/7.3.png)\n\n图 7.3：A/B 测试允许组织在提交更改之前评估多种设计和消息变体。\n\
  \nA/B 测试旨在为产品的演进提供决策依据，这从本质上是个好主意！然而，它通常是使用客户端 JavaScript 进行的，这会带来可预见的性能结果：\n\n\
  * 测试脚本会动态修改 `DOM`。这通常要求将必要的 JavaScript 加载到文档的 `<head>` 中，作为渲染阻塞资源，以避免对用户界面产生明显变化。\n\
  * JavaScript 越多，问题越多——即主线程上的处理工作越多，这会不成比例地影响那些使用低端设备和较慢网络的节点。\n* 如果 A/B 测试解决方案向\
  \ `DOM` 元素挂载大量事件监听器，可能会减慢运行时性能——如果你在低端设备上已经处于崩溃边缘，这种代价是你无法承受的。\n\n评估进行这项研究的收益是否超过了其影响，或者其潜在的负面性能影响是否会偏差测试结果。动态更改页面结构和呈现是一项风险业务，即使在性能良好的硬件上，运行测试的工作可能仍然相当客观的（图\
  \ 7.4）。\n\n![来自 Best Buy 网站的部分调用堆栈。这项长任务（约 225 毫秒）是由 Best Buy 网站上的客户端 A/B 测试脚本触发的。任务的阻塞部分约占\
  \ 175 毫秒。](img/7.4.png)\n\n图 7.4：来自 Best Buy 网站的部分调用堆栈。这项长任务（约 225 毫秒）是由 Best Buy\
  \ 网站上的客户端 A/B 测试脚本触发的。任务的阻塞部分约占 175 毫秒。\n\n如果你正在进行 A/B 测试，确保你的测试框架提供服务端选项，或者考虑切换到提供该选项的框架。如果你能确保这样做不会偏离测试结果，请考虑不在低端设备上进行\
  \ A/B 测试，特别是如果你的观众中有很大一部分不使用这些设备。客户端信号如 `navigator.deviceMemory` ([`bkaprt.com/rjs39/07-03`](http://bkaprt.com/rjs39/07-03))\
  \ 和 `navigator.hardwareConcurrency` ([`bkaprt.com/rjs39/07-04`](http://bkaprt.com/rjs39/07-04))\
  \ 是粗略但可能有益的信号，可能会有所帮助。\n\nA/B 测试是有用的，但它可能引发的大量客户端工作长期来看是持续的，特别是如果你不持续地清理已完成的实验以避免传输大量未使用的\
  \ JavaScript。与大多数 JavaScript 性能问题一样，卸载到服务器的越多，浏览器受益就越多。\n\n## 无障碍覆盖层\n\n无障碍覆盖层是声称通过客户端\
  \ JavaScript 自动修复网站无障碍问题的第三方产品。无障碍覆盖层之所以由于极具吸引力，是因为不可访问的网站会导致真实的法律后果 ([`bkaprt.com/rjs39/07-05`](http://bkaprt.com/rjs39/07-05))。无障碍工作是`tough`的。修复无障碍问题需要技术熟练的开发者以及大量的时间、精力和金钱。\n\
  \n无障碍是无法自动化的。通过使用无障碍覆盖层，你实际上是在默认承认你的网站存在你不想修复的问题。最糟糕的是，无障碍覆盖层根本不起作用。它们产生的问题比解决的还要多\
  \ ([`bkaprt.com/rjs39/07-06`](http://bkaprt.com/rjs39/07-06))：\n\n* 在 `<img>` 元素缺少适当\
  \ `alt` 文本的情况下，覆盖层会生成文本。这些文本可能冗长，实际上将信息的缺口变成使用辅助技术的人员的负担。\n* 覆盖层通常提供内容缩放功能。根据网站样式设置，覆盖层对如何缩放内容的假设可能会导致元素重叠或被遮挡。使用相对\
  \ CSS 单位正确设置你的网站样式可以确保你的网站可以被正常缩放。\n* 内容缩放还会导致静态 `line-height` 值的可读性问题，因为内容放大后会导致文本行重叠。\n\
  * 覆盖层本身可能存在过度且不直观的交互。accessiBe 的覆盖层产品包含 75 多个控件，会扰乱界面并让用户无所措。\n\n还有很多可能出错的地方，而且在这些痛苦之上，性能变得更糟糕了（图\
  \ 7.5）。\n\n![PageTest 显示南卡罗来纳州网站主线程加载 AudioEye 无障碍覆盖层（上方）和未加载（下方）。AudioEye 覆盖层产生的阻塞时间是未加载时的两倍。](img/7.5.png)\n\
  \n图 7.5：PageTest 显示南卡罗来纳州网站主线程加载 AudioEye 无障碍覆盖层（上方）和未加载（下方）。AudioEye 覆盖层产生的阻塞时间是未加载时的两倍。\n\
  \n无障碍覆盖层充其量是鬼药。它们并不能让你的网站变得更易访问，而且对性能简直是有毒的。当你使用它们时，你是在让情况变得更糟并浪费金钱。\n\n本书的理念是以性能为中心的，但无障碍是负责任使用\
  \ JavaScript 的另一个方面。如果你需要提升你的无障碍水平，请查看 Laura Kalbag 写的《Accessibility for Everyone》([`bkaprt.com/rjs39/07-07`](http://bkaprt.com/rjs39/07-07))。资源部分也有一些链接可以指引你正确的方向。\n\
  \n### 热力图\n\n热力图可视化了用户频繁交互页面的哪些部分，以确定界面元素或布局选择的价值。它们的名称源于热成像：高交互频率区域被可视化为热，低交互频率区域被可视化为冷（图\
  \ 7.6）。\n\n![热力图覆盖层从绿色（冷）到红色（热）的比例显示用户交互。](img/7.6.png)\n\n图 7.6：热力图覆盖层从绿色（冷）到红色（热）的比例显示用户交互。\n\
  \n\n\n\n\n一些热图工具还提供了“回放”特定访客会话的功能。为了重建回放（通常称为 `session replay` 会话回放），需要跟踪页面交互和光标位置，这消耗大量的\
  \ CPU。这种代价对任何人来说都是不值得付出的，更不用说那些在低端设备上的用户了（图 7.7）。\n\n![在 Nokia 2 Android 手机上分析的同一页面的两个主线程活动摘要。顶部摘要是一个没有任何第三方脚本的页面。底部的摘要是带有第三方热图工具的相同页面。每个会话中的交互是完全相同的，但热图工具引入了多三倍的\
  \ JavaScript 活动。](img/7.7.png)\n\n图 7.7：在 Nokia 2 Android 手机上分析的同一页面的两个主线程活动摘要。顶部的摘要是一个没有任何第三方脚本的页面。底部的摘要是带有第三方热图工具的相同页面。每个会话中的交互是完全相同的，但热图工具引入了多三倍的\
  \ JavaScript 活动。\n\n说实话？别费精力搞热图了。你可以自己收集更有价值的信号。例如，如果你运营一个博客或新闻网站，并想知道人们阅读了你内容的多少，可以使用交叉观察者（intersection\
  \ observer）来跟踪页面 `<article>` 元素内每个元素的可见性，然后将这些数据发送到端点以便后续分析。\n\n我理解。我说的这些听起来像是在指责别人，而且\
  \ UX 研究是关于完善用户体验的——但正如 Erika Hall 在*Just Enough Research*中所指出的，你可以通过听取用户的意见来获得更好的洞察（[`bkaprt.com/rjs39/07-08`](http://bkaprt.com/rjs39/07-08)）。你不仅会获得更好的可用性数据，还能避免与热图工具相关的糟糕性能问题。\n\
  \n## 技术缓解措施\n\n无论你是否认同，你负责的网站很可能会发布一个或多个第三方产品。这并不意味着你网站的用户体验就蛋了！这只是意味着你应该尝试减轻这些第三方脚本的影响。\n\
  \n### 重新审视自托管（Self-hosting）\n\n还记得我们在第 4 章中介绍过自托管吗？它又回来了！回顾一下，你可以通过消除连接延迟源来提高加载性能。同样，自托管第三方资源也会加快速度。\n\
  \n遗憾的是，自托管第三方脚本并不总是可能的。任何内容会经常或不可预测地变化的第三方脚本（例如 Google Analytics 脚本）都不适合自托管。\n\n\
  不要绝望！自托管*某些*第三方脚本是可能的，而且受益匪浅。值得注意的是，Casper Sleep 在 2018 年找到了自托管其 A/B 测试框架 JavaScript\
  \ 的方法，将其初始渲染时间减少了 1.7 秒（[`bkaprt.com/rjs39/07-09`](http://bkaprt.com/rjs39/07-09)）。A/B\
  \ 测试框架必须以阻塞方式加载在 `<head>` 中，以避免产生糟糕的用户体验结果，例如无样式内容的闪烁（[`bkaprt.com/rjs39/07-10`](http://bkaprt.com/rjs39/07-10)）。在这种情况下，自托管最终成为了一项关键的性能提升（图\
  \ 7.8）。\n\n![SpeedCurve 中 Casper Sleep 网站的初始渲染时间。自托管其 A/B 测试框架导致初始渲染时间减少了 1.7 秒。图表由\
  \ Kyle Rust 提供（http://bkaprt.com/rjs39/07-11）。](img/7.8.png)\n\n图 7.8：SpeedCurve\
  \ 中 Casper Sleep 网站的初始渲染时间。自托管其 A/B 测试框架导致初始渲染时间减少了 1.7 秒。图表由 Kyle Rust 提供 ([`bkaprt.com/rjs39/07-11`](http://bkaprt.com/rjs39/07-11))。\n\
  \n如果第三方供应商允许你自托管他们的 JavaScript，这说明你网站的性能对他们是优先级。如果你是付费客户，这一点更是如此。给你的第三方供应商施一点友好的压力，看看自托管是否是一个可行的方案。\n\
  \n### 建立早期连接\n\n如果无法自托管，通过 `rel=preconnect` 为第三方脚本建立早期连接可以很大程度上掩盖连接延迟。\n\n有时从第三方服务器加载的资源会触发这些糟糕的*请求链*（request\
  \ chains）（图 7.9）。请求链是指一个源从另一个源请求资源，以此此类推。请求链对性能是致命的，因为它们为请求链中发现的每一个新源引入了更多的延迟。\n\
  \n![Target 网站上第三方脚本请求链的部分可视化（通过 Simon Hearne 的 Request Map Generator）](img/7.9.png)\n\
  \n图 7.9：Target 网站上第三方脚本请求链的部分可视化（通过 Simon Hearne 的 Request Map Generator）。\n\nSimon\
  \ Hearne 的 Request Map Generator（[`bkaprt.com/rjs39/07-12`](http://bkaprt.com/rjs39/07-12)）可以找到特定网页涉及的所有唯一源。你也可以使用\
  \ Domains 标签页来实现此。有了这些信息，你可以使用第 4 章中提到的 `preconnect` 尽早建立连接。\n\n### 不要预加载第三方脚本\n\
  \n正如你在第 4 章中所记得，`preload` 会触发对资源的早期获取。这是一项强大的性能优化手段，但你应该谨慎使用它，因为它可能利弊参半。\n\n当你预加载资源时，你实际上在提高了它们的优先级；如果所有内容都是高优先级，那就没有高优先级了。对于\
  \ JavaScript 而言，你应该只对渲染至关重要的第三方脚本使用它——除非你找到了将此类 JavaScript 移出关键路径并直接从服务器提供内容的方法。\n\
  \n用户不在乎你的分析或热图工具加载有多快。他们追求的是你的内容或产品。你不应该为了收集数据而牺牲性能，所以将 `preload` 留给那些提供实质性用户体验收益的内容。\n\
  \n### 懒惰的果实\n\n在本章中提到的许多第三方产品并没有直接的用户体验收益。但有些*有*，例如社交媒体分享功能和嵌入视频内容。这些第三方脚本比我们目前讨论的其他脚本更有价值。\n\
  \n视频嵌入服务尤其有价值，因为将视频转码为不同格式并管理自适应流质量非常困难。使用这些服务完全合理。遗憾的是，除了必要的视频负载外，它们还会产生大量的开销。\n\
  \nYouTube 在其 `<iframe>` 嵌入了大量的 JavaScript（图 7.10）。如果你嵌入的是位于“折线以下”的 YouTube 视频，你应该懒加载这些\
  \ iframe 以减少带宽竞争和启动时的阻塞时间（图 7.11）。\n\n![带有 YouTube <iframe> 嵌入的博客的 WebPageTest 瀑布图。<iframe>\
  \ 及其资源在第 10 个请求时开始。](img/7.10.png)\n\n图 7.10：带有 YouTube `<iframe>` 嵌入的博客的 WebPageTest\
  \ 瀑布图。`<iframe>` 及其资源在第 10 个请求时开始。\n\n你可以通过在 `<iframe>` 上直接添加 `loading=\"lazy\"\
  ` 属性来实现这一点，或者寻找一个可以在所有浏览器中懒加载 iframe 的开源解决方案——或者如果需要广泛的兼容性，甚至采用两者的混合方案。\n\n\n\n\n\
  \n然而，并不是所有第三方嵌入内容都是通过 `iframe` 提供的。这意味着对于其他类型的嵌入，JavaScript 的懒加载可能会变得更加复杂。以 Facebook\
  \ 的“赞”按钮为例，它由两部分组成。第一部分是按钮的 HTML 占位符：\n\n```html\n<div class=\"fb-like\" data-href=\"\
  https://developers.facebook.com/docs/plugins/\" data-width=\"\" data-layout=\"standard\"\
  \ data-action=\"like\" data-size=\"small\" data-share=\"true\"></</div>\n```\n\n\
  ![同一博客页的 WebPageTest 瀑布图，其中 YouTube 嵌入的 <iframe> 元素使用了 loading=\"lazy\" 属性。内容在接近视口之前不会加载，从而在启动期间释放了宝贵的带宽和系统资源。](img/7.11.png)\n\
  \n图 7.11：同一博客页的 WebPageTest 瀑布图，其中 YouTube 嵌入的 `iframe` 元素使用了 `loading=\"lazy\"\
  ` 属性。内容在接近视口之前不会加载，从而在启动期间释放了宝贵的带宽和系统资源。\n\n第二部分是一个小的 HTML 代码段和一个 Facebook 提供的 `<script>`\
  \ 标签：\n\n```html\n<div id=\"fb-root\"></</div>\n```\n\n```html\n<script async defer\
  \ crossorigin=\"anonymous\" src=\"https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v9.0\"\
  ></script>\n```\n\nFacebook 的 JavaScript 嵌入确实*大得出*。上述代码段中引用的脚本未压缩前超过 700 千字节！如果可能，请完全避免它，但可能当你已经处于这种境地时，无法避免。如果是如此，最好的选择是减轻损害。除非“赞”按钮位于页面顶部，否则不值得在启动期间加载\
  \ Facebook 这一巨大的 JavaScript 块，因为在启动期间它会与其他资源竞争。交叉观察器（intersection observer）在这里可以帮大忙：\n\
  \n```javascript\nconst intersectionListener = new IntersectionObserver(([ entry\
  \ ], observer) => {\n  if (entry.isIntersecting || entry.intersectionRatio) {\n\
  \    const scriptEl = document.createElement(\"script\");\n    scriptEl.defer =\
  \ true;\n    scriptEl.crossOrigin = \"anonymous\";\n    scriptEl.src = \"https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v9.0\"\
  ;\n    document.body.append(scriptEl);\n    observer.disconnect();\n  }\n});\nintersectionListener.observe(document.querySelector(\"\
  .fb-like\"));\n```\n\n这段代码段执行了以下操作：\n\n1. 创建了一个新的 `IntersectionObserver` 实例。在回调函数中，我们只需要入口列表中的第一个项，因为我们只观察单个\
  \ `div.fb-like` 元素的可见性。\n2. 一旦元素进入视口，就会使用 `document.createElement` 方法创建一个新的 `<script>`\
  \ 元素（[`bkaprt.com/rjs39/07-13`](http://bkaprt.com/rjs39/07-13)）。\n3. 创建 `<script>`\
  \ 元素后，我们为其分配了三个属性：跨源请求类型（`anonymous`）、是否延迟执行以及它的 `src`。然后我们将其附加到 `<body>` 的底部。\n\
  4. 完成所有操作后，我们调用观察器的 `disconnect` 方法以确保回调只运行一次（[`bkaprt.com/rjs39/07-14`](http://bkaprt.com/rjs39/07-14)）。\n\
  \n这个示例可以稍微改进。比如——我不知道——你可能不想在 `div.fb-like` 元素*在*视图中时加载脚本，而是在它*接近*视口时加载。对于这一点，你可以向交叉观察器实例传递\
  \ `rootMargin` 选项（[`bkaprt.com/rjs39/07-15`](http://bkaprt.com/rjs39/07-15)）。你还可以使用\
  \ `min-height` 规则为 `div.fb-like` 元素设置样式，以限制其内容加载时的布局偏移。\n\n请记住，懒加载不仅适用于图片。对于像这类会在启动期间消耗设备资源的第三方脚本，只要可行，请始终使用懒加载它们。\n\
  \n## 内容安全策略 (Content Security Policies)\n\n有时，第三方脚本的影响不仅仅仅是性能负担，还会变成更糟的情况。2020 年，HTTP\
  \ Archive 发现几乎 84% 的移动端页面至少有一个脆弱的 JavaScript 依赖项（[`bkaprt.com/rjs39/07-16`](http://bkaprt.com/rjs39/07-16)）。在我们这样一个倾向于不加怀疑地安装\
  \ JavaScript 包的行业中，这应该让你警惕。\n\n幸运的是，有一种网络平台功能可以帮助我们免受受损害第三方供应商的影响：*内容安全策略*（Content\
  \ Security Policy，CSP）。CSP 有助于解决*跨站脚本*（XSS）问题，这是一种安全漏洞，恶意代码被注入页面以获取机密信息，例如 cookie\
  \ 内容、存储在网络存储中的数据或通过 JavaScript API 访问的任何信息。\n\nCSP 由 `Content-Security-Policy` HTTP\
  \ 头部规定。该头部由一个或多个策略指令组成。这些指令描述了当前页面允许从哪些源加载内容、允许加载哪些类型的资源，以及是否可以使用内联脚本——后者在 XSS 情况下非常重要。\n\
  \n良好的安全策略从良好的默认设置开始。为了安全，我们依靠锁定，然后补充额外的措施。\n\n### `default-src`\n\n`default-src`\
  \ 是一个兜底策略，在没有其他策略的情况下规定了可以加载内容的规则（[`bkaprt.com/rjs39/07-17`](http://bkaprt.com/rjs39/07-17)）。相反，我们将关注少数有效的策略。一个良好的\
  \ `default-src` 策略可能如下：\n\n```\nContent-Security-Policy: default-src 'self' https:\n\
  ```\n\n这表明所有请求都来自主源或任何提供 HTTPS 内容的源。`default-src` 还禁止内联的 `<script>` 和 `<style>`\
  \ 元素，前者可以被注入 DOM 以窃取信息。我们很快就会涉及到如何管理这些元素。提醒：`default-src` 不会被其他策略继承，仅对未被更特定策略覆盖的请求生效（[`bkaprt.com/rjs39/07-18`](http://bkaprt.com/rjs39/07-18)）。如果你需要为特定资源类型设置特定规则，你需要依靠指令。\n\
  \n### `script-src`\n\n在缓解潜在恶意的第三方 JavaScript 时，你需要的是 `script-src`。虽然 `default-src`\
  \ 规定了所有资源从哪里加载的要求，但 `script-src` 仅适用于加载脚本资源和内联脚本处理程序（例如 `onload`）的机制。与其他指令一样，`script-src`\
  \ 接受空格分隔的关键字或源列表，脚本可以从这些源加载。多个策略指令之间用分号分隔。基于我们当前的 `default-src` 进行调整，`script-src`\
  \ 策略如下：\n\n```\nContent-Security-Policy: default-src 'self' https:; script-src 'self'\
  \ https://nexus.ensighten.com\n```\n\n此 CSP 的 `script-src` 部分表示：\n\n* 允许来自主源的脚本。\n\
  * 允许来自 nexus.ensighten.com 的脚本。\n\n\n\n\n\n虽然 `script-src` 可以通过 `'unsafe-inline'`\
  \ 标记来允许内联脚本，但这并不是一个好主意。你可以将这些脚本移动到独立的文件中，或者在你的 CSP 头部文件中使用 `nonce` 的情况下，仍然可以使用内联脚本。在密码学中，`nonce`\
  \ 是一个仅使用一次的随机数（[`bkaprt.com/rjs39/07-19`](http://bkaprt.com/rjs39/07-19)）。\n\n关于\
  \ CSP，`nonce` 必须在每次请求时随机生成一个 base64 编码的字符串（[`bkaprt.com/rjs39/07-20`](http://bkaprt.com/rjs39/07-20)），并作为\
  \ `script-src` 指令的一部分发送：\n\n```\nContent-Security-Policy: script-src 'self' https://nexus.ensighten.com\
  \ 'nonce-aWJ1ZmFiaXVhc2RjYmk='\n```\n\n此时，内联的 `<script>` 元素的 `nonce` 属性必须设置为与 CSP\
  \ 头部中设置相同的 nonce：\n\n```\n<script nonce=\"aWJ1ZmFiaXVhc2RjYmk=\">\n```\n\n```\n\
  \ // 一个受信任的内联脚本\n```\n\n```\n</script>\n```\n\n实现这一点并非易事，但话虽如此，安全并非小事。生成 nonce 需要应用程序后端的支持。在\
  \ PHP 中，可以使用 `random_bytes`（[`bkaprt.com/rjs39/07-21`](http://bkaprt.com/rjs39/07-21)）和\
  \ `base64_encode`（[`bkaprt.com/rjs39/07-22`](http://bkaprt.com/rjs39/07-22)）等函数来实现。\n\
  \n## `connect-src`\n\n正如我们之前提到的，某些第三方脚本可能会从你未知的其他跨源请求资源。虽然通过 `script-src` 限制加载哪些跨源脚本是明智的，但限制*这些*脚本加载哪些资源也是值得的。这正是\
  \ `connect-src` 派上用场的地方。\n\n当涉及到第三方资源时，将 `connect-src` 的允许源限制为 `'self'` 可能并不切实际。一个不错的开始可能是限制脚本从任何安全源加载的资源。基于我们的\
  \ CSP，它看起来会是这样：\n\n```\nContent-Security-Policy: default-src 'self' https:; script-src\
  \ 'self' https://nexus.ensighten.com; connect-src: 'self' https:\n```\n\n这只是一个开始，随着你更深入地了解你的第三方脚本从哪些额外的跨源加载其他脚本，请考虑对额外的跨源施加更深层次的限制。这是编写一个良好的\
  \ CSP 最困难的部分；它需要投入时间和精力。\n\n幸运的是，有一种方法可以让你采用，它不会*强制*执行 CSP，而仅仅在发生违规时进行报告——当你想要捕获特定页面上潜在的\
  \ CSP 违规，但不想无意中影响页面功能时，这种方法非常完美！\n\n## 通过 CSP 报告进行渐进式采用\n\n假设你正处于尚无法执行 CSP 的情况，但你想知道何时发生了违规行为。有两个\
  \ CSP 特性可以帮助完成这一工作：\n\n1. `Content-Security-Policy-Report-Only` 头部\n2. `report-to`\
  \ 策略指令\n\n`Content-Security-Policy-Report-Only` 头部采用与 `Content-Security-Policy`\
  \ 相同的格式，只是它不强制 CSP。相反，它在发生违规时会发出警告。将此头部与 `report-to` 策略指令配合使用，可以让你违规及其关联数据传输到端点进行审查。\n\
  \n所以，假设你的 CSP 正在工作，但你想在不破坏功能的情况下完善你的 `connect-src` 策略指令。因此，你决定采用一个仅包含 `'self' https:`\
  \ 的 `connect-src` 策略指令的 CSP，但将其他指令加上精炼后的 `connect-src` 策略指令添加到 `Content-Security-Policy-Report-Only`\
  \ 头部中：\n\n```\nContent-Security-Policy-Report-Only: default-src 'self' https:; script-src\
  \ 'self ' https://nexus.ensighten.com; connect-src: 'self' https://nexus.ensighten.com\
  \ https://www.googletagmanager.com; report-to compuglobalhypermeganet\n```\n\n在这里，我们表示允许来自\
  \ nexus.ensighten.com 和 googletagmanager.com 的脚本，但考虑到第三方脚本可能会从各种跨源获取资源，我们希望当第三方脚本请求我们从未见过的跨源资源时，我们能收到通知。\n\
  \n为了在发生此类“仅报告”策略的违规行为时收到通知，我们添加了一个指定组名的额外 `report-to` 指令。组名可以可以是我们想要的任何内容，只要它与随附的\
  \ `Report-To` 头部中发送的 JSON 负载对应即可：\n\n```\nReport-To: {\"group\": \"compuglobalhypermeganet\"\
  , \"max_age\": 3600, \"endpoints\": [{\"url\": \"https://compuglobalhypermega.net/csp-report.php\"\
  }]}\n```\n\n此 JSON 负载指定了以下信息：\n\n* `group`，即 `report-to` 指令中的组名\n* `max_age`，浏览器发送报告的持续时间（秒）\n\
  * `endpoints`，发送报告的端点数组\n\n在这种情况下，CSP 不会被强制执行，但发生违规时，将从 `Content-Security-Policy-Report-Only`\
  \ 报告到 `Content-Security-Policy`。编写 CSP 是一个缓慢而持续的过程，但它的回报是更好的用户体验。比起其他任何品质，警惕才是负责任使用\
  \ JavaScript 的关键。\n\n## 结\n\n当你放下这本书回到日常工作时，我希望你理解，《负责任的 JavaScript》的目的并不是哀叹或指责行业对\
  \ JavaScript 的使用，而是为 Web 开发提供一条路径。我们每天可能需要向工程经理、产品利益相关者和同事汇报，但我们的首要责任是对我们的用户。\n\n\
  网页是一个不可或缺的工具，连接着人们，加速我们的日常工作，并在危机期间提供支持。我们如何选择 JavaScript 影响着人们的生活。\n\n# 致谢\n\n\
