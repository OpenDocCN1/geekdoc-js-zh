  raw: "![A call stack from a web worker running on its own thread on the Home Depot\
    \ website as shown in Chrome’s performance profiler. The tasks on this thread\
    \ give the main thread breathing room to do more urgent and user-facing work.](image/6.7.png)\n\
    \nFig 6.7: A call stack from a web worker running on its own thread on the Home\
    \ Depot website as shown in Chrome’s performance profiler. The tasks on this thread\
    \ give the main thread breathing room to do more urgent and user-facing work.\n\
    \n### Move taxing tasks into web workers\n\nOft-cited examples of web workers\
    \ involve fetching and processing a massive amount of data in a worker thread,\
    \ and then ferrying the result to the main thread. While this is a great use case,\
    \ it’s not the only one.\n\nSay you’re building a photography web app where people\
    \ need access to Exif data, the treasure trove of image metadata captured by digital\
    \ cameras. You might use `fetch` to make a request for an image file’s data, convert\
    \ that raw data into a binary data stream with `ArrayBuffer` ([http://bkaprt.com/rjs39/06-17](http://bkaprt.com/rjs39/06-17)),\
    \ and then extract the Exif data from it.\n\nThat’s not an easy thing to do, though,\
    \ so you could use a package like ExifReader ([http://bkaprt.com/rjs39/06-18](http://bkaprt.com/rjs39/06-18))\
    \ to process image Exif data for you. However, doing this on the main thread incurs\
    \ considerable work on a few fronts:\n\n*   Loading ExifReader on the main thread\n\
    \n*   Kicking off a `fetch` for an image asset\n\n*   Converting the image response\
    \ into a blob and ultimately into an `ArrayBuffer` as well as extracting the Exif\
    \ data\n\n*   Constructing markup to display the Exif data\n\nJavaScript engines\
    \ do their best to split work up into manageable chunks, but long tasks aren’t\
    \ always avoidable. Therefore, this work is best left to a separate thread.\n\n\
    To demonstrate how fetching an image from the network and extracting Exif data\
    \ from it can be done by a web worker, I created a demo app named JPEG Metadata\
    \ Extractor ([http://bkaprt.com/rjs39/06-19](http://bkaprt.com/rjs39/06-19)) to\
    \ do exactly that.\n\nThe app’s repository contains two tags. The first ([http://bkaprt.com/rjs39/06-20](http://bkaprt.com/rjs39/06-20))\
    \ does all the `fetch` and metadata extraction on the main thread (Fig 6.8). The\
    \ second ([http://bkaprt.com/rjs39/06-21](http://bkaprt.com/rjs39/06-21)) does\
    \ all the same work as the first, only it does most of that work on a worker thread\
    \ (Fig 6.9).\n\n![Image fetching and Exif metadata extraction as it occurs on\
    \ the main thread. As a result, two long tasks occur on the main thread with a\
    \ total blocking time of nearly 150 milliseconds.](image/6.8.png)\n\nFig 6.8:\
    \ Image fetching and Exif metadata extraction as it occurs on the main thread.\
    \ As a result, two long tasks occur on the main thread with a total blocking time\
    \ of nearly 150 milliseconds.\n\n![Main-thread activity (at top) and web worker\
    \ activity (at bottom). While form submission and Exif markup insertion must still\
    \ occur on the main thread, the image fetching and Exif extraction work occurs\
    \ on a separate thread, reducing main-thread blocking time.](image/6.9.png)\n\n\
    Fig 6.9: Main-thread activity (at top) and web worker activity (at bottom). While\
    \ form submission and Exif markup insertion must still occur on the main thread,\
    \ the image fetching and Exif extraction work occurs on a separate thread, reducing\
    \ main-thread blocking time.\n\nThe demo app’s interface accepts a JPEG URL, which\
    \ is retrieved via a `fetch`. Even if we use a web worker, *some* things will\
    \ still have to be done on the main thread:\n\n*   Register a `submit` event listener\
    \ on the form\n\n*   Validate the form’s inputs\n\n*   Pass the image URL to the\
    \ web worker\n\nAlmost everything after that can be done in the web worker, which\
    \ resides in a separate script named exif-worker.js. The web worker is registered\
    \ on the main thread like so:\n\n```\nconst exifWorker = new Worker(\"/js/exif-worker.js\"\
    );\n```\n\nThen, we import ExifReader using the `importScripts` function in the\
    \ web worker ([http://bkaprt.com/rjs39/06-22](http://bkaprt.com/rjs39/06-22)).\
    \ `importScripts` accepts a URL string to import an external script to be used\
    \ in the worker scope:\n\n```\nimportScripts(\"/js/exifreader.js\");\n```\n\n\
    In some browsers, the static `import` syntax can be used to import scripts if\
    \ you register a web worker in module mode ([http://bkaprt.com/rjs39/06-23](http://bkaprt.com/rjs39/06-23)).\
    \ Depending on browser support, though, you might have to stick with  `impo``rtScripts`.\n\
    \n#### Communicating between the main thread and a worker thread\n\nWeb workers\
    \ are only useful if bidirectional communication between them and the main thread\
    \ is possible. Well, whaddya know—you can do this by way of the worker’s `postMessage`\
    \ method ([http://bkaprt.com/rjs39/06-24](http://bkaprt.com/rjs39/06-24)).\n\n\
    In the case of our JPEG metadata extractor, we can use `postMessage` to pass the\
    \ JPEG image URL provided in the form to the worker:\n\n```\nexifWorker.postMessage(imageUrl);\n\
    ```\n\nFrom there, we intercept the message in the worker context through its\
    \ `message` event. A `data` property within the `message` event’s `event` object\
    \ contains the data sent via `postMessage` from the main thread. We then feed\
    \ that data into a function that fetches the image and returns the Exif data formatted\
    \ in markup:\n\n```\nself.addEventListener(\"message\", event => {\n```\n\n```\n\
    \ getExifDataFromImage(event.data).then(status => {\n```\n\n```\n self.postMessage(status);\n\
    ```\n\n```\n }).catch(status => {\n```\n\n```\n self.postMessage(status);\n```\n\
    \n```\n });\n```\n\n```\n});\n```\n\n`getExifDataFromImage` returns a promise\
    \ that states whether the operation was successful as well as a message. If all\
    \ goes well, the message will contain the Exif data in a markup string.\n\nThe\
    \ next step is to get the Exif metadata *out* of the web worker. We do that by\
    \ invoking the `postMessage` method again. Only this time we send data from within\
    \ the worker to the main thread.\n\nIntercepting that message on the main thread\
    \ is similar to how we intercept messages in a worker: we add a `message` event\
    \ listener on the worker instance:\n\n```\nexifWorker.addEventListener(\"message\"\
    , event => {\n```\n\n```\n // Access information passed from the worker\n```\n\
    \n```\n // here through the event.data object.\n```\n\n```\n});\n```\n\nWith this\
    \ bidirectional channel, we have a way to ferry data to and from web workers.\
    \ The `postMessage`/`message` event pattern isn’t exclusive to web workers, either—service\
    \ workers can use this communication pattern too.\n\nIf this method of transferring\
    \ data between workers and the main thread is cumbersome to you, there are abstractions\
    \ that simplify that work. Comlink ([http://bkaprt.com/rjs39/06-25](http://bkaprt.com/rjs39/06-25))\
    \ is an excellent and minimalist off-the-shelf abstraction by Surma ([http://bkaprt.com/rjs39/06-26](http://bkaprt.com/rjs39/06-26))\
    \ for web worker communication.\n\n#### Does it make a difference?\n\nYes. Any\
    \ chance to shift costly tasks onto separate threads makes a difference. This\
    \ was certainly the result when it came to the JPEG Metadata Extractor. Web workers\
    \ can’t handle *everything* the JPEG Metadata Extractor does, but they can take\
    \ the grueling work off the main thread and create more headroom for other work.\
    \ Now people—particularly those on low-end devices—can interact with the metadata\
    \ extraction tool with less lag.\n\nAs a bonus, if you load any scripts within\
    \ the web worker context, the web worker parses and compiles these off the main\
    \ thread as well. If a dependency in your application can be restricted solely\
    \ to the web worker scope, you can also confine its startup costs to the worker\
    \ thread. That’s a big deal.\n\n### What else are web workers good for?\n\nWhile\
    \ a web worker’s scope is much narrower than the main thread’s, web workers can\
    \ still accomplish all sorts of computationally expensive tasks:"
