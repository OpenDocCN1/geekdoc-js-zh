    , () => {\n```\n\n```\n if (\"serviceWorker\" in navigator) {\n```\n\n```\n navigator.serviceWorker.register(\"\
    /sw.js\");\n```\n\n```\n }\n```\n\n```\n });\n```\n\n```\n</script>\n```\n\nBy\
    \ waiting until the `window`’s `load` event, we’re reducing the chance that the\
