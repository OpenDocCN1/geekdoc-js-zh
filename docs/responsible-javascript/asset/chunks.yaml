  trans: "\n\n## 2. Service worker 启动时间会延迟请求\n\n`navigationPreload` 通过让 service worker\
    \ 的启动和导航请求并发执行而非串行执行来解决这个问题。尽管如此，由于并非所有浏览器都支持它，我们将它的支持状态存储在 `preloadAvailable`\
    \ 中，并使用三元运算符在支持的浏览器显式启用 `navigationPreload`，在不支持的平台上传递一个布尔值。\n\n这涉及到大量的`内容`，但我们正要进入好有趣的部分：拦截并修改响应！\n\
    \n### 拦截请求\n\n拦截网络请求是 service worker 的核心戏码。与 `Cache` 接口结合时，拦截请求和自定义响应的能力是实现快速用户体验的沃土。\n\
    \n在开始处理特定的请求类型之前，我们需要从一个良好的默认开始：\n\n```javascript\nself.addEventListener(\"fetch\"\
    , async event => {\nconst { request } = event;\nif (request.method !== \"GET\"\
    ) {\n  return;\n}\n// 为了简洁省略了代码...\n});\n```\n\n`fetch` 是另一个 service worker 事件，每当浏览器分发网络请求时，它就会触发。在大多数情况下，良好的默认做法是检查\
    \ `event` 对象的 `request.method` 属性是否代表一个 `GET` 请求。`POST` 请求是由用户特定操作（如提交表单）驱动的。我们不想对这些请求进行操作，因此通过抛出\
    \ `return` 将它们直接透传给 `fetch` 事件处理器。\n\n从这里开始，我们需要根据请求的内容类型将逻辑进行分叉：静态资源或导航。\n\n\
    #### 处理静态资源\n\n“缓存优先，网络后之”模式是处理静态资源请求的良好默认值——即对在任何情况下都不会改变的资源的请求，例如 CSS、图像、字体，以及，是的，JavaScript。\n\
    \n这意味着我们首先检查静态资源是否在 service worker 缓存中。不过，对它的第一次请求将会失败，因为此时缓存中还不在那里；我们必须访问网络来获取它。之后，我们将该资源放入缓存，以便未来对该资源的请求可以完全跳过网络。\n\
    \n这意味着从 `Cache` 接口检索静态资源的速度极快（图 4.17）。其逻辑也相当简单直接。你要么在缓存中拥有该资源，要么没有。如果没有，就获取它并将其放入缓存：\n\
    \n```javascript\nself.addEventListener(\"fetch\", async event => {\n// 省略了请求过滤代码...\n\
    const staticAssets = /\\.(woff2?|css|m?js|gif|avif|webp|png|svg|jpe?g| txt|ico)$/i;\n\
    if (staticAssets.test(request.url)) {\n  event.respondWith(caches.match(request.url).then(cachedResponse\
    \ => {\n    return cachedResponse || fetch(request).then(fetchedResponse => {\n\
    \      addResponseToCache(request, fetchedResponse.clone());\n      return fetchedResponse;\n\
    \    });\n  }));\n  return;\n}\n// 待后续...\n});\n```\n\n正如 `fetch` 可以在主线程上下文中检索资源一样，它也可以在\
    \ service worker 中使用。这正是我们在使用 `Cache` 接口的 `match` 方法查找缓存失败时，从网络抓取静态资源的方法（[`bkaprt.com/rjs39/04-27`](http://bkaprt.com/rjs39/04-27)）。如果失败了，我们使用一个名为\
    \ `addResponseToCache` 的小型自定义函数将资源添加到缓存中：\n\n```javascript\nfunction addResponseToCache\
    \ (request, response) {\n  caches.open(CACHE_NAME).then(cache => {\n    cache.put(request,\
    \ response);\n  });\n};\n```\n\n静态资源处理是所有请求拦截业务中最简单的部分。随着我们弄清楚如何处理导航请求，情况将变得棘手得多。\n\
    \n![从 service worker 获取的资源的请求时间线。启动: 0.16ms. respondWith: 1.21ms. 等待（首次字节时间） 1.55ms.\
    \ 内容下载: 2.21ms. 总计: 4.14ms.](img/4.17.png)\n\n图 4.17：存储在 service worker 缓存中的静态资源的请求计时耗时。由于\
    \ service worker 无需访问网络获取资源，因此它的提供速度非常快。\n\n#### 处理导航请求\n\n导航请求是针对 HTML 文档的——即对完全不同页面的请求，而不是对图像或某些\
    \ JavaScript 的请求。对于 Weekly Timber 的 service worker，我们希望处理导航请求的方式与静态资源请求大不同。\n\n\
    你可能记得早些时候为 Weekly Timber 的 service worker 列出了一长串需求。其中首要的一点是我们希望减少标记负载。我们通过预缓存页眉和页脚标记来实现这一点——我们已经在\
    \ service worker 的 `install` 事件中做过这样做——然后将它们与从网络请求的仅包含内容的标记相结合（图 4.18）。\n\n与完全没有\
    \ service worker 相比，你将在首次内容绘制（First Contentful Paint）和最大内容绘制（Largest Contentful\
    \ Paint）方面获得感知上的感知益处。让我们来看看这在我们的 `fetch` 事件中是怎样的实现的：\n\n```javascript\nself.addEventListener(\"\
    fetch\", async event => {\n  // 省略了之前的代码...\n  if (request.mode === \"navigate\"\
    ) {\n    const networkContent = Promise.resolve(event.preloadResponse).then(response\
    \ => {\n      if (response) {\n        addResponseToCache(request, response.clone());\n\
    \        return response;\n      }\n      const headers = new Headers();\n   \
    \   headers.append(\"X-Content-Mode\", \"partial\");\n      return fetch(request.url,\
    \ {\n        headers\n      }).then(response => {\n        addResponseToCache(request,\
    \ response.clone());\n        return response;\n      }).catch(() => {\n     \
    \   return caches.match(request.url);\n      });\n    });\n  }\n  // 待后续...\n\
    });\n```\n\n这里涉及大量内容。让我们逐一拆解：\n\n1.  为了区分导航请求与其他请求，我们可以检查 `request` 对象的 `mode`\
    \ 属性。如果它的值为 `\"navigate\"`，说明我们在正确的轨道上。\n2.  如果支持 `navigationPreload`，我们可以在 `event.preloadResponse`\
    \ 中获取其预加载响应。如果是这样，太棒了！我们可以将该响应添加到缓存，以防以后处于离线状态。导航加载加载会自动发送 `Service-Worker-Navigation-Preload`\
    \ 请求，我们可以利用它获取部分内容。\n3.  问题是，并非所有浏览器都支持 `navigationPreload`。如果是如此，`event.preloadResponse`\
    \ 就是没用的，我们必须适应并自己请求部分内容。我们还必须创建一个自定义的 `X-Content-Mode` 请求头来指示后端发送部分内容，因为在没有导航预加载的情况下，不会发送\
    \ `Service-Worker-Navigation-Preload` 请求头。\n4.  如果请求因任何原因失败（即发生某些离线闹剧），我们将从 `Cache`\
    \ 接口提供页面。前提是它在缓存中。\n\n我们快要完成了，但还有最后一件事要做：将获取到的内容标记与我们之前预缓存的页眉和页脚标记组合在一起。然后我们就可以将其作为完整的响应提供。\n\
    \n"
- fmt: "\n![A color-coded representation of the header, content, and footer areas\
    \ of the Weekly Timber website. The header (blue) and footer (red) areas of the\
    \ site are served from the `Cache` interface and assembled into a single response\
    \ with the content (yellow) area, which is requested from the network.](image/4.18.png)\n\
    Fig 4.18: A color-coded representation of the header, content, and footer areas\
    \ of the Weekly Timber website. The header (blue) and footer (red) areas of the\
    \ site are served from the `Cache` interface and assembled into a single response\
    \ with the content (yellow) area, which is requested from the network.\n\n```javascript\n\
    self.addEventListener(\"fetch\", event => {\n```\n\n```javascript\n // Prior code\
    \ omitted...\n```\n\n```javascript\n if (request.mode === \"navigate\") {\n```\n\
    \n```javascript\n // Navigation preload/fetch() fallback code omitted...\n```\n\
    \n```javascript\n const { done, response } = await mergeResponses([\n```\n\n```javascript\n\
    \ caches.match(\"/partial-header\"),\n```\n\n```javascript\n networkContent,\n\
    ```\n\n```javascript\n caches.match(\"/partial-footer\")\n```\n\n```javascript\n\
    \ ]);\n```\n\n```javascript\n event.waitUntil(done);\n```\n\n```javascript\n event.respondWith(response);\n\
    ```\n\n```javascript\n }\n```\n\n```javascript\n});\n```\n\nThis the last little\
    \ bit of our service worker `fetch` event code. While it’s succinct, it’s no less\
    \ impactful:\n\n1. `mergeResponses` is a custom function that takes an array of\
    \ responses and merges them into one. The first and third array items are precached\
    \ header and footer markup retrieved by the `Cache` interface’s `match` method.\
    \ The second item is the content markup from the network.\n\n2. The internals\
    \ of `mergeResponses` are too much of a monster to step through here, but the\
    \ source is on GitHub ([http://bkaprt.com/rjs39/04-28](http://bkaprt.com/rjs39/04-28)).\
    \ In short, `mergeResponses` takes an array of responses and uses the `ReadableStream`\
    \ API to begin streaming that content to the browser as soon as possible ([http://bkaprt.com/rjs39/04-29](http://bkaprt.com/rjs39/04-29)).\
    \ When finished, it returns an object with two properties: a promise that resolves\
    \ when the responses have been assembled (`done`), and the assembled response\
    \ that we send to the browser (`response`).\n\nBut all our work on this service\
    \ worker won’t do much good until we install it, which is the last part of this\
    \ whole show.\n\n### Installing the service worker\n\nWhile installing a service\
    \ worker is the easiest part of this whole hootenanny, we do need to be cognizant\
    \ of a couple things:\n\n* Service worker support—while fantastic ([http://bkaprt.com/rjs39/04-30](http://bkaprt.com/rjs39/04-30))—isn’t\
    \ guaranteed. Do a little feature-checking to avoid errors on legacy browsers.\n\
    \n* Because a service worker may precache stuff for other pages, we want to make\
    \ sure it isn’t registered until the page loads.\n\nThese aren’t horribly difficult\
    \ issues to get around. Assuming our service worker is named `sw.js` and resides\
    \ at the root, we can add this little bit of script at the bottom of every page:\n\
    \n```html\n<script>\n```\n\n```javascript\n window.addEventListener(\"load\",\
    \ () => {\n```\n\n```javascript\n if (\"serviceWorker\" in navigator) {\n```\n\
    \n```javascript\n navigator.serviceWorker.register(\"/sw.js\");\n```\n\n```javascript\n\
    \ }\n```\n\n```javascript\n });\n```\n\n```html\n</script>\n```\n\nBy waiting\
    \ until the `window`’s `load` event, we’re reducing the chance that the service\
    \ worker and whatever it precaches will contend for bandwidth with critical resources.\
    \ By checking for the `serviceWorker` namespace in the `navigator` object, we’re\
    \ ensuring that we don’t run any code that will cause problems on legacy browsers.\n\
    \nWe’re in deep with this whole service worker thing, but we’ve finally come to\
    \ rest. Yes, it’s a ton to take in and apply, and this is just one service worker\
    \ example for one website. Even so, that service worker gave Weekly Timber some\
    \ incredible perceptual performance benefits:\n\n| | No service worker | Streaming\
    \ service worker | Speed increase |\n| --- | --- | --- | --- |\n| Median FCP (ms)\
    \ | 767 | 159 | 79.3% |\n| Median LCP (ms) | 853 | 466 | 54.6% |\n| p95 FCP (ms)\
    \ | 3027 | 1497 | 45.4% |\n| p95 LCP (ms) | 3357 | 1764 | 47.5% |\n\nBetter yet,\
    \ service workers are a perfect example of progressive enhancement. They don’t\
    \ replace the browser’s built-in navigation behavior, but improve upon it in a\
    \ way that’s customizable and additive.That’s the very essence of what it means\
    \ to use JavaScript responsibly.\n\n## Fast, Resilient, and User first\n\nIt takes\
    \ a lot nowadays to build engaging user experiences with a restrained use of JavaScript,\
    \ but it’s possible. Some of that effort involves sleight of hand, where we rely\
    \ on less obvious approaches like resource hints to mask latency and loading time\
    \ of page assets.\n\nOther efforts involve more direct action, like reducing startup\
    \ time through code splitting, or respecting user preferences. In some cases,\
    \ we may need to go and beyond with a service worker that not only reduces data\
    \ usage, but offers offline access.\n\nToolchains—that is, collections of utilities\
    \ that transform and optimize our JavaScript for production—can involve similarly\
    \ herculean effort, both to use them effectively and to understand their potential\
    \ effects. While you don’t *need* any of the tools mentioned in this chapter to\
    \ build fast and delightful user experiences, you’re likely to encounter them\
    \ in your work. If we’re to invest in toolchains, we need to make it worth our\
    \ while.\n\n# 5. Navigating Toolchains\n\n![](image/6.png)\n\nCicada killer wasps\
    \ elicit almost pants-shitting level of fear for the uninitiated. They are monstrously\
    \ large (Fig 5.1). They have to be—as their name suggests. But they’re still smaller\
    \ than the cicadas, which means that once they’ve caught and paralyzed their victim,\
    \ they physically unable to take off from the ground! If they aren’t lucky enough\
    \ to grab a cicada in midair, they must drag their prey to the top of a tree.\
    \ This is the only way for these wasps to stabilize themselves for flying. It’s\
    \ a ton of effort, but for a big payoff.\n\n## Task Runners\n\nLet’s ease into\
    \ this thing by starting with *task runners*. Task runners are linear JavaScript\
    \ build tools that don’t analyze code. They’re typically used to minify, concatenate,\
    \ and otherwise optimize a directory of scripts (or other files) into production-ready\
    \ assets (Fig 5.2).\n\n![Gear icon, labeled “Task Runner.” An arrow leading to\
    \ an icon of a folder, labeled “Directory of JavaScript files.” An arrow leading\
    \ to an icon of a file, labeled “scripts.min.js”](image/5.2.png)\n\nFig 5.2: A\
    \ typical task runner workflow. Here, the task runner is pointed at a directory\
    \ of JavaScript files. The task runner minifies and concatenates all scripts in\
    \ the directory into one production-ready script.\n"
