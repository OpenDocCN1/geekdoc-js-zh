    If you don’t specify a query, a “safe” default kicks in that transforms your JavaScript
    to safely run everywhere. Given that most browsers currently in use understand
    many modern language features ([http://bkaprt.com/rjs39/05-19](http://bkaprt.com/rjs39/05-19)),
    that’s not a good way for today’s performance-minded web developer to roll.


    If the default Browserslist query is no good, then what does a good query look
    like? Depends on the project. What browsers do your visitors use? Once you can
    figure that out, you’ll have a shot at transforming your code in a way that’s
    both better for performance *and* compatible with the browsers your visitors use.


    ### A Browserslist query that works for you


    If you use Google Analytics, you can feed up to thirty days of visitor data into
    `Can I Use`, which will identify the browsers your visitors use. On that website,
    open the settings dialog and find the “Add from Analytics” section (Fig 5.5):


    After importing data, you’ll receive a high-level overview of what browsers your
    website visitors use. Once you’ve finished, `Can I Use` will also contextualize
    feature support at the visitor level (Fig 5.6).


    Knowing this can help you determine the right Browserslist query. For example,
    Legendary Tones is a website I maintain for a writer who blogs about guitars,
    guitar accessories, and custom amplifier modifications. He has a large readership
    across many countries, so the browsers his readers use are diverse. Unfortunately,
    this means a not-insignificant share of visitors use Internet Explorer 11. To
    accommodate legacy browsers, I use a Browserslist query of `ie 11`.


    ![“Usage data” configuration dialog on caniuse.com](image/5.5.png)


    Fig 5.5: Within this dialog on the Can I Use website, there’s an “Add from analytics”
    section where you can import Google Analytics data for a specific website.


    ![Detailed support data for “ECMAScript 2015 (ES6),” based on imported browser
    usage data ](image/5.6.png)


    Fig 5.6: When `Can I Use` imports Google Analytics data for a given website, the
    percentage of support for a feature will also be scoped to that data.


    Be aware that browser usage changes in any cohort over time. If it’s not reasonable
    to periodically reassess support data on the `Can I Use` website, you may prefer
    to use a command line solution instead. `browserslist-ga` ([http://bkaprt.com/rjs39/05-20](http://bkaprt.com/rjs39/05-20))
    is one such package that can bring your analytics data directly into your toolchain.


    Unfortunately, you may find that there’s no single Browserslist query that strikes
    the proper balance between performance and compatibility. You may have just enough
    people using legacy browsers to keep you from transforming fewer features, but
    still want to find a way to avoid sending those transforms to those on modern
    browsers.


    Lucky for you, there’s a way to do just that.


    ## Intelligent Bundling and Delivery


    Here’s a hair-puller of a situation: A good chunk of your website’s visitors use
    browsers that natively support modern JavaScript features. Yet, there’s this small
    but not insignificant portion of people on browsers that don’t. You’ve got options:


    1. You *could* just serve untransformed JavaScript using new language features
    to the vast majority of those on modern browsers, and accept that those on legacy
    browsers will have a degraded or even broken experience.

    2. You could flip the script and adopt an untransformed legacy syntax when writing
    your JavaScript source code. That way, it’ll be compatible everywhere you need
    it to be without a transpiler (though this also means avoiding all the new and
    shiny stuff). In fact, this is what GOV.UK did as late as 2021, as roughly 2 percent
    of their visitors in the first half of 2021 were still on some version of Internet
    Explorer ([http://bkaprt.com/rjs39/05-21](http://bkaprt.com/rjs39/05-21)).

    3. You could use all the modern language features and compile your source into
    two sets of bundles—one for legacy browsers and one for modern ones—and then serve
    them based on browser capabilities. This is called *differential serving*.


    The first option can get dicey: what exactly constitutes “modern” browsers? Does
    your definition align with the features you’re using in JavaScript? Do those features
    have broad support in those browsers? What happens to the visitors whose browsers
    aren’t as “modern” as you thought? You’re drawing a line in the sand that could
    exclude more people than you intended.


    The second option is safer *and* it’s more inclusive than the first—but it requires
    you to put your fervent desires to use the new and shiny stuff on the back burner
    to deliver a more broadly compatible experience. For reference, the A11Y Project
    mandates in their technology statement that they purposely use pre-ES6 syntax
    ([http://bkaprt.com/rjs39/02-09](http://bkaprt.com/rjs39/02-09)) to avoid transpilers
    altogether. This is a valid approach that deserves careful consideration. It reduces
    reliance on ever-changing tooling and maximizes compatibility.


    Depending on what browsers you need to support, either of the first two options
    may suffice. In situations where you must support browsers with fewer features,
    but don’t want to ship a lot of extra transforms for those that do, the third
    option makes more sense. It’s not as simple as the first two, but it may be just
    what you need in select scenarios.


    ### Compiling two sets of bundles


    The hardest part of differential serving is setting up your toolchain to generate
    two sets of bundles. How it’s done depends on what bundler and transpiler you
    use, but the toolchain architecture will generally be the same (Fig 5.7).


    ![Icon of a box, labeled “bundler,” arrow to a file icon “Entry point.” One arrow,
    labeled “modern config” leads to a file icon “module tree,” then to a file icon
    “modern bundle.” A second arrow, labeled “legacy config” leads to a second file
    icon “module tree,” then to a file icon “legacy bundle.”](image/5.7.png)


    Fig 5.7: For differential serving, the bundler outputs two sets of bundles from
    the same entry point using two configurations.


    No matter what your bundler or transpiler choices are, you’ll need to make sure
    your toolchain is structured accordingly:


    1. Your transpiler will need to export two configurations: one with a Browserslist
    query targeting legacy browsers, and another targeting modern browsers. In the
    latter case, Babel’s `preset-env` provides an `esmodules` option in its `targets`
    configuration ([http://bkaprt.com/rjs39/05-22](http://bkaprt.com/rjs39/05-22)).

    2. Your bundler will also require two separate configurations, each referencing
    their respective transpiler configuration. Multiple configurations can be passed
    in an array to the bundler—this approach works with bundlers such as `webpack`
    and `Rollup`.


    Both of these tasks take some effort to complete, and the particulars are too
    numerous to document in this space. For specifics, you can reference a guide I
    wrote on how to do this for `webpack` ([http://bkaprt.com/rjs39/05-23](http://bkaprt.com/rjs39/05-23)),
    as well as a live coding demonstration ([http://bkaprt.com/rjs39/05-24](http://bkaprt.com/rjs39/05-24)).
    I also have an example repository available ([http://bkaprt.com/rjs39/05-25](http://bkaprt.com/rjs39/05-25)).


    The gains you’ll get from this bundling strategy depend on the project. If you’re
    using newer features that require transforms for legacy browsers, you might see
    gains to the tune of 30 to 50 percent, with those on modern browsers downloading
    significantly less JavaScript (Fig 5.8). There’s also an adjacent opportunity
    to ship fewer polyfills in your modern bundles, since targeted browsers support
    them natively.

