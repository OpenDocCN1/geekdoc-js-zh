    \ resources. By checking for the `serviceWorker` namespace in the `navigator`\
    \ object, we’re ensuring that we don’t run any code that will cause problems on\
    \ legacy browsers.\n\nWe’re in deep with this whole service worker thing, but\
    \ we’ve finally come to rest. Yes, it’s a ton to take in and apply, and this is\
    \ just one service worker example for one website. Even so, that service worker\
    \ gave Weekly Timber some incredible perceptual performance benefits:\n\n|  |\
    \ **No service worker** | **Streaming service worker** | **Speed increase** |\n\
    \n| --- | --- | --- | --- |\n\n| **Median FCP (ms)** | 767 | 159 | 79.3% |\n\n\
    | **Median LCP (ms)** | 853 | 466 | 54.6% |\n\n| **p95 FCP (ms)** | 3027 | 1497\
    \ | 45.4% |\n\n| **p95 LCP (ms)** | 3357 | 1764 | 47.5% |\n\nBetter yet, service\
