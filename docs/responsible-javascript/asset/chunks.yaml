  trans: "\n\n启用此设置后，Twitter 会下载图像和视频的低分辨率占位符，然后允许用户选择是否查看相关的媒体内容（图 4.15）。\n\n![@OversightDems\
    \ 的推文截图：“年前，我们失去了主席 Elijah E. Cummings。观看这段致敬视频以及他给美国传达的信息：投票。”附图中是一个模糊的视频缩略图，中心有一个“加载视频”按钮。](img/4.15.png)\n\
    \n图 4.15：Twitter 的数据节省器功能运行演示。在这里，访问者可以决定他们想要下载哪些媒体以节省流量消耗。\n\n你如何实现自定义的数据节省器功能取决于你的项目。你可以将其按机器为基础存储在\
    \ cookie 中，或使用 JavaScript 中的 `localStorage` 进行存储（[`bkaprt.com/rjs39/04-16`](http://bkaprt.com/rjs39/04-16)）。或者，如果你想尽可能地让更多用户使用此功能，可以将此偏好存储在应用程序的后端。\n\
    \n数据节省器概念上的简单性正是其强大之处所在：如果你给人们一个选择减少数据使用的机会，他们很有可能会采纳它。这是一个让人们对自己的体验拥有更多控制权的机会，*并且*减少了你代表他们运行的\
    \ JavaScript。\n\n## 韧性：你的名字是 Service Worker\n\n如果你安装过瓷砖，你就知道这是一个极其艰难的过程。首先，你必须确保你的底座是平整的。然后，在底座上铺设解耦膜。接着铺设砂浆层。然后给瓷砖背部涂抹砂浆并将其嵌入砂浆层。然后进行勾缝。最后密封勾缝。这是一项大量的工作，但这些工作为完成的安装增添了强度、韧性和吸引力。\n\
    \n我们在书中到为止所描述的构建具有韧性网站的过程同样是冗余且分层的。然而，我们应该考虑再添加最后的一层：service worker（[`bkaprt.com/rjs39/04-17`](http://bkaprt.com/rjs39/04-17)）。\n\
    \nService Worker 是一种充当浏览器和服务器之间代理的 API。Service workers 是功能强大的小齿轮，可以拦截请求和响应、重定向请求、缓存响应并提供离线能力，使网站不仅在更多地方可访问，而且速度更快。\n\
    \n### 优先考虑速度和访问\n\nWeekly Timber 位于威斯康星州的瓦沙拉县。在像这样的地方，良好的网络连接可能是很难得的（图 4.16）。\n\
    \n![威斯康星州瓦沙拉县的宽带颜色叠加地图。该县大部分地区显示为浅褐色，表示宽带速度在 3 到 9.99 Mbps 之间。浅蓝色和深蓝色区域速度更快。](img/4.16.png)\n\
    \n图 4.16：威斯康星州瓦沙拉县的宽带颜色叠加地图。该县大部分地区显示为浅褐色，表示宽带速度在 3 到 9.99 Mbps 之间。浅蓝色和深蓝色区域更快。\n\
    \n威斯康州确实有农场，但也有大量的森林。如果你需要砍掉一些树，你会访问 Google 寻找伐木公司。伐木公司网站加载得有多快——或者加载不出来——可能会影响你是否会给那公司打电话。\n\
    \n这就是针对速度和韧性调过的 service worker 发挥用场的地方。我为 Weekly Timber 构建了一个 service worker，通过以下方式显著提升了感知性能：\n\
    \n*   在 service worker 安装期间预缓存页眉和页脚的标记；\n*   仅请求内容标记并将其与预缓存的页眉和页脚标记组装；\n*   流式传输完全组装的响应，以最快速度将标记发送到浏览器；以及\n\
    *   通过导航预加载（navigation preload）（[`bkaprt.com/rjs39/04-18`](http://bkaprt.com/rjs39/04-18)）避免\
    \ service worker 的启动延迟。\n\n这些架构决策对性能的影响是非常显著的。当这个 service worker 部署到 Weekly Timber\
    \ 时，导致首次内容绘制（First Contentful Paint）和最大内容绘制（Largest Contentful Paint）的中位数时间分别减少了\
    \ 42% 和 48%。更好的是，这些改进不是通过合成性能测试工具观察到的，而是实际上使用 Weekly Timber 网站的人（[`bkaprt.com/rjs39/04-19`](http://bkaprt.com/rjs39/04-19)）观察到的。\n\
    \n在我们开始介绍如何构建这个 service worker 之前，我们需要为它建立一个缓存——因为没有缓存，service worker 在性能方面对你起不了太大作用。\n\
    \n### 建立 service worker 缓存\n\nService workers 依赖于 `Cache` 接口（[`bkaprt.com/rjs39/04-20`](http://bkaprt.com/rjs39/04-20)），它提供了一个与我们在第\
    \ 3 章介绍过的浏览器缓存不同的缓存层。当 service worker 安装时，它的 `install` 事件会触发（[`bkaprt.com/rjs39/04-21`](http://bkaprt.com/rjs39/04-21)）。这里就是我们创建新的\
    \ service worker 缓存的地方：\n\n```javascript\nself.addEventListener(\"install\", event\
    \ => {\n const cacheName = \"fancy_cache_name_here\";\n const cachedAssets = [\n\
    \ \"/partial-header\",\n \"/partial-footer\"\n ];\n event.waitUntil(caches.open(cacheName).then(cache\
    \ => {\n return cache.addAll(cachedAssets);\n }));\n });\n```\n\n这里发生了两件事：\n\n\
    1.  我们的 service worker 缓存需要一个标识符，我们在 `cacheName` 中指定它。我们使用这个标识符通过 `Cache` 接口的\
    \ `open` 方法（[`bkaprt.com/rjs39/04-22`](http://bkaprt.com/rjs39/04-22)）打开缓存，以便跟踪存入的内容。\n\
    2.  在打开新缓存后，我们使用 `Cache` 接口的 `addAll` 方法在其中预缓存资源（[`bkaprt.com/rjs39/04-23`](http://bkaprt.com/rjs39/04-23)）。我们可以向其填充任何我们认为值得提前的内容。\n\
    \n### 激活 service worker\n\n在 service worker 的生命周期中，激活（activation）发生在安装（installation）之后。激活是一个进行清理工作的机会，它发生在\
    \ service worker 的 `activate` 事件中：\n\n```javascript\nself.addEventListener(\"\
    activate\", event => {\n const cacheName = \"fancy_cache_name_here\";\n const\
    \ preloadAvailable = \"navigationPreload\" in self.registration;\n event.waitUntil(caches.keys().then(keys\
    \ => {\n return Promise.all([\n keys.filter(key => {\n return key !== cacheName;\n\
    \ }).map(key => {\n return caches.delete(key);\n }),\n preloadAvailable ? self.registration.navigationPreload.enable()\
    \ : true\n ]);\n }));\n});\n```\n\n"
- fmt: "\n## 2. Service worker bootup time can delay requests\n\n`navigationPreload`\
    \ gets around this by making service worker bootup and navigation requests concurrent\
    \ rather than consecutive. Since it’s not supported in all browsers, though, we\
    \ store its support status in `preloadAvailable`, and use a ternary operator to\
    \ explicitly enable `navigationPreload` where it’s supported and pass a Boolean\
    \ value where it isn’t.\n\nThis is a whole lot of `stuff`, but we’re just getting\
    \ to the fun part: intercepting and modifying responses!\n\n### Intercepting requests\n\
    \nIntercepting network requests is the main event in a service worker. When combined\
    \ with the `Cache` interface, the ability to intercept requests and customize\
    \ responses is fertile ground for a fast user experience.\n\nBefore we get into\
    \ handling specific request types, we need to start with a good default:\n\n```javascript\n\
    self.addEventListener(\"fetch\", async event => {\nconst { request } = event;\n\
    if (request.method !== \"GET\") {\n  return;\n}\n// Code omitted for brevity...\n\
    });\n```\n\n`fetch` is another service worker event, and it fires whenever the\
    \ browser dispatches a network request. In most cases, a good default is to check\
    \ whether the `event` object’s `request.method` property represents a `GET` request.\
    \ `POST` requests are driven by user-specific actions, such as submitting forms.\
    \ We don’t want to operate on those requests, so we just pass them through the\
    \ `fetch` event handler by throwing a `return`.\n\nFrom here, we need to bifurcate\
    \ our logic according to the type of content we’re requesting: static assets or\
    \ navigation.\n\n#### Handling static assets\n\nA “cache first, network second”\
    \ pattern is a good default for handling static asset requests—that is, requests\
    \ for assets that don’t change in any context, like CSS, images, fonts, and, yeah,\
    \ JavaScript.\n\nThis means that we’ll first check to see if a static asset is\
    \ in the service worker cache. The first request for it will fail, though, since\
    \ the asset won’t be in there yet; we’ll have to hit the network to get it. After\
    \ we do, we’ll place the asset in the cache so future requests for it can bypass\
    \ the network entirely.\n\nThis means that static asset retrieval from `Cache`\
    \ interface is extremely fast (Fig 4.17). The logic for it is also reasonably\
    \ simple and direct. You either have the asset in the cache or you don’t. If you\
    \ don’t, you grab it and put it in the cache:\n\n```javascript\nself.addEventListener(\"\
    fetch\", async event => {\n// Request filtering code omitted...\nconst staticAssets\
    \ = /\\.(woff2?|css|m?js|gif|avif|webp|png|svg|jpe?g| txt|ico)$/i;\nif (staticAssets.test(request.url))\
    \ {\n  event.respondWith(caches.match(request.url).then(cachedResponse => {\n\
    \    return cachedResponse || fetch(request).then(fetchedResponse => {\n     \
    \ addResponseToCache(request, fetchedResponse.clone());\n      return fetchedResponse;\n\
    \    });\n  }));\n  return;\n}\n// More to come...\n});\n```\n\nJust as `fetch`\
    \ can be used in a main-thread context to retrieve assets, it can also be used\
    \ in a service worker. This is exactly what we use to grab a static asset from\
    \ the network if a cache seek fails with the `Cache` interface’s `match` method\
    \ ([http://bkaprt.com/rjs39/04-27](http://bkaprt.com/rjs39/04-27)). If that fails,\
    \ we use a small custom function called `addResponseToCache` to add the asset\
    \ to the cache:\n\n```javascript\nfunction addResponseToCache (request, response)\
    \ {\n  caches.open(CACHE_NAME).then(cache => {\n    cache.put(request, response);\n\
    \  });\n};\n```\n\nStatic asset handling is the simplest of all this request interception\
    \ business. It’s about to get a whole lot hairier as we figure out how we want\
    \ to handle navigation requests.\n\n![Timeline of requests for an asset fetched\
    \ from service worker. Startup: 0.16ms. respondWith: 1.21ms. Waiting (Time to\
    \ First Byte) 1.55ms. Content download: 2.21ms. Total: 4.14ms.](image/4.17.png)\n\
    \nFig 4.17: Request timings for a static asset stored in a service worker cache.\
    \ Because the service worker doesn’t have to go to the network to get the asset,\
    \ it’s served very quickly.\n\n#### Handling navigation requests\n\nA navigation\
    \ request is for an HTML document—that is, a request for an entirely different\
    \ page, as opposed to a request for, say, an image or for some JavaScript. For\
    \ Weekly Timber’s service worker, we want to handle navigation requests much differently\
    \ than static asset requests.\n\nYou’ll recall earlier that we had a whole laundry\
    \ list of requirements for Weekly Timber’s service worker. Chief among them was\
    \ that we wanted to reduce markup payloads. We do this by precaching header and\
    \ footer markup—something we already did in the service worker’s `install` event—and\
    \ then combining them with content-only markup we request from the network (Fig\
    \ 4.18).\n\nThe perceptual benefit you get in terms of First Contentful Paint\
    \ and Largest Contentful Paint, respectively, than no service worker at all. Let’s\
    \ get into how this looks in our `fetch` event:\n\n```javascript\nself.addEventListener(\"\
    fetch\", async event => {\n  // Prior code omitted...\n  if (request.mode ===\
    \ \"navigate\") {\n    const networkContent = Promise.resolve(event.preloadResponse).then(response\
    \ => {\n      if (response) {\n        addResponseToCache(request, response.clone());\n\
    \        return response;\n      }\n      const headers = new Headers();\n   \
    \   headers.append(\"X-Content-Mode\", \"partial\");\n      return fetch(request.url,\
    \ {\n        headers\n      }).then(response => {\n        addResponseToCache(request,\
    \ response.clone());\n        return response;\n      }).catch(() => {\n     \
    \   return caches.match(request.url);\n      });\n    });\n  }\n  // More to come...\n\
    });\n```\n\nThere’s a ton going on here. Let’s break it down bit by bit:\n\n1.\
    \  To differentiate a navigation request from other requests, we can check the\
    \ `request` object’s `mode` property. If its value is `\"navigate\"`, we’re on\
    \ the right track.\n2.  If `navigationPreload` is supported, we can get its preloaded\
    \ response in `event.preloadResponse`. If so, that’s great! We can just add that\
    \ response to the cache in case we’re in an offline situation later. Navigation\
    \ preload requests automatically send a `Service-Worker-Navigation-Preload` request\
    \ with responses that we can use to have the backend send partial content.\n3.\
    \  The thing is, not all browsers support `navigationPreload`. If that’s the case,\
    \ `event.preloadResponse` is useless, and we’ll have to adapt and make the request\
    \ for the partial content ourselves. We’ll also have to craft a custom `X-Content-Mode`\
    \ header to instruct the backend to send partial content, since the `Service-Worker-Navigation-Preload`\
    \ header won’t be sent in the absence of navigation preload.\n4.  If the request\
    \ should fail for any reason (i.e., some offline tomfoolery) we’ll serve up a\
    \ page from the `Cache` interface. If it’s there, that is.\n\nWe’re almost there,\
    \ but we’ve got one last thing to do: assemble that content markup with the header\
    \ and footer markup we precached earlier. Then we can serve that as the complete\
    \ response:\n"
