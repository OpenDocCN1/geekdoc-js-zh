  raw: 'I solicited a *lot* of help from many talented and knowledgeable people in
    peer reviewing this manuscript for accuracy and quality. I’d like to extend my
    sincerest appreciation to Eric Bailey, Zach Leatherman, Brandon Gregory, Yoav
    Weiss, Houssein Djirdeh, Shubhie Panicker, Olu Niyi-Awosusi, and Eric Portis for
    their great feedback, which made this book the best possible version of itself
    that it could be.


    I’d also like to thank Paul Calvano, who selflessly offered his time and expertise
    in querying the HTTP Archive’s massive dataset, Tim Kadlec for his work on the
    2020 edition of the HTTP Archive’s almanac, and Matt Hobbs, whose work on the
    GOV.UK website offered valuable insight into how browser usage and JavaScript
    features intersect in such a critical piece of government infrastructure.


    Additionally, I’d like to thank Tatiana Mac, Mattia Menchetti, and Kyle Rush for
    their permission to include references to—and use of—some of their materials in
    this book.


    This book’s foreword author, Estelle Weyl, has been a dear friend and colleague
    whose work and documentation have paved the way for me to write a book of this
    magnitude. Chances are if you’ve read something on MDN, she had a hand in it somewhere.
    I would like to thank her for throwing her kind words of support behind this book,
    as well as Eric Bailey, Olu Niyi-Awosusi, Katie Sylor-Miller, and Suz Hinton for
    their kind endorsements of this book.


    Finally, I’d like to thank Katel LeDû and Jeffrey Zeldman for the opportunity
    to write a book under the umbrella of A Book Apart, a publisher whose works have
    been so groundbreaking, and so influential to me personally. I can’t express enough
    gratitude for this opportunity.


    # Resources


    This book could never come close to covering everything you need to know about
    using JavaScript responsibly. You’d need a tome for that, and A Book Apart ain’t
    in the business of tomes. If you find yourself curious about something this book
    doesn’t cover in exacting detail, then this categorized list should come in handy.


    ### Accessibility


    *   *Accessibility for Everyone* by Laura Kalbag ([http://bkaprt.com/rjs39/07-07](http://bkaprt.com/rjs39/07-07))


    *   *The A11Y Project* ([http://bkaprt.com/rjs39/08-01](http://bkaprt.com/rjs39/08-01))


    *   *HTML: A Good Basis for Accessibility* by MDN ([http://bkaprt.com/rjs39/08-02](http://bkaprt.com/rjs39/08-02))


    *   *Getting Started with ARIA* by Monika Piotrowicz ([http://bkaprt.com/rjs39/08-03](http://bkaprt.com/rjs39/08-03))


    *   Web Content Accessibility Guidelines (WCAG) Overview by W3C Web Accessibility
    Initiative ([http://bkaprt.com/rjs39/08-04](http://bkaprt.com/rjs39/08-04))


    ### CSS


    *   *Layout Land* by Jen Simmons ([http://bkaprt.com/rjs39/08-05](http://bkaprt.com/rjs39/08-05))


    *   *Get Ready for CSS Grid Layout* by Rachel Andrew ([http://bkaprt.com/rjs39/08-06](http://bkaprt.com/rjs39/08-06))


    *   *The New CSS Layout* by Rachel Andrew ([http://bkaprt.com/rjs39/08-07](http://bkaprt.com/rjs39/08-07))


    *   *Modern CSS Solutions for Old CSS Problems* ([http://bkaprt.com/rjs39/08-08](http://bkaprt.com/rjs39/08-08))


    ### Observer APIs


    *   *Now You See Me: How to Defer, Lazy-Load and Act With IntersectionObserver*
    by Denys Mishunov ([http://bkaprt.com/rjs39/08-09](http://bkaprt.com/rjs39/08-09))


    *   *Getting to Know the MutationObserver API* by Louis Lazaris ([http://bkaprt.com/rjs39/08-10](http://bkaprt.com/rjs39/08-10))


    *   *ResizeObserver: It’s Like document.onresize for Elements* by Surma and Joe
    Medley ([http://bkaprt.com/rjs39/08-11](http://bkaprt.com/rjs39/08-11))


    *   *Performance Observer: Efficient Access to Performance Data* by Marc Cohen
    ([http://bkaprt.com/rjs39/08-12](http://bkaprt.com/rjs39/08-12))


    ### Third-party  JavaScript


    *   *Loading Third-Party JavaScript* by Addy Osmani and Arthur Evans ([http://bkaprt.com/rjs39/08-13](http://bkaprt.com/rjs39/08-13))


    *   *Things to Know (and Potential Dangers) with Third-Party Scripts* by Yaphi
    Berhanu ([http://bkaprt.com/rjs39/08-14](http://bkaprt.com/rjs39/08-14))


    *   *Third-Party JavaScript Performance* by Milica Mihajlija ([http://bkaprt.com/rjs39/08-15](http://bkaprt.com/rjs39/08-15))


    *   *Third-Party JavaScript* by Ben Vinegar and Anton Kovalyov ([http://bkaprt.com/rjs39/08-16](http://bkaprt.com/rjs39/08-16)).


    ### Runtime performance


    I could never cover every API or concept that might improve the runtime performance
    of your projects. This book can only fit so many words in it, so there’s a lot
    of ground out there for you to cover if you’re hungry to know more. If that describes
    you, here’s a few starting points:


    *   Your framework choices have an impact on the main thread beyond startup. I
    tested React versus Preact versus native event listener performance across an
    array of devices ([http://bkaprt.com/rjs39/08-17](http://bkaprt.com/rjs39/08-17)).
    It bears emphasizing that Preact was several times better than React for runtime
    performance using the same API. It may seem like a trivial benchmark, but the
    costs of stateful client-side components scale up very quickly and sometimes disastrously.
    *Always* weigh framework choices with care.


    *   If you have experience with C/C++ or Rust, Web Assembly (WASM) is a platform
    feature that allows you to interface with WASM-targeted binaries in JavaScript.
    The Squoosh app I mentioned in Chapter 6 uses tons of WASM binaries to optimize
    images in the browser ([http://bkaprt.com/rjs39/08-18](http://bkaprt.com/rjs39/08-18)).


    *   If you like to do generative artwork in the browser, you’re probably familiar
    with the `<canvas>` API. A relatively new technology called the CSS Paint API
    uses a specialized sort of web worker called a paint worklet, which uses the 2D
    canvas context and lets you draw artwork and embed it in a CSS `background-image`
    property. Paint worklets can also be customized with CSS ([http://bkaprt.com/rjs39/08-19](http://bkaprt.com/rjs39/08-19)).


