    ![Detail of Chrome’s performance profiler using an inverted flame chart, showing
    call stacks as colored bars nested beneath each function.](image/3.10.png)


    Fig 3.10: A visualization of main-thread activity in Chrome’s performance profiler,
    showing all page activity as an inverted flame chart.


    ![Example of a main-thread activity overview, from 0 to 10,000 milliseconds, with
    miniature page frames plotted over time.](image/3.11.png)


    Fig 3.11: The activity overview of Chrome’s performance profiler.


    ![Tabs reading summary, bottom-up, call tree, and event log, highlighted. The
    table below lists a script’s tasks and durations in milliseconds.](image/3.12.png)


    Fig 3.12: The bottom pane of Chrome’s performance profiler. This pane has several
    tabs to display summary data as well as detailed lists of page activity.


    ### Assessing loading performance


    When you assess loading performance, you’re telling the profiler to reload the
    current page and record everything that happens up until the network and main
    thread are reasonably quiet. Performance profilers in most browsers provide this
    type of functionality, which gives insight into what happens during the startup
    phase of any given page (Fig 3.13).


    ![Chrome’s performance profiler summarizing load performance for Amazon.com, including
    an activity overview, network timings, and a flame chart.](image/3.13.png)


    Fig 3.13: A populated view of Chrome’s performance profiler for an Amazon product
    detail page. At the top is the populated activity overview. At the bottom is the
    flame chart, which shows all the call stacks for the page.


    Like so many “whoa, hold up”-type signals you encounter daily, the color red has
    special significance in Chrome’s profiler in that it calls out performance issues.
    An easy shortcut for finding problems is to scan the profiler’s activity overview
    and look for red strips. These strips represent periods of blocking time—and as
    we’ve established, blocking time equals an overworked main thread.


    Drill down to problem areas by clicking and dragging across the red strips in
    the activity overview (Fig 3.14). Because the flame chart expands or contracts
    to the selection, we gain greater visibility into what’s happening at that point
    in time.


    ![Isolated view of the activity overview from previous figure, with an portion
    of the timeline highlighted. Intermittant red boxes dot the top. ](image/3.14.png)


    Fig 3.14: The activity overview in Chrome’s performance profiler, with a small
    portion of activity selected. The red strips across the top illustrate periods
    of blocking time.


    All tasks are displayed in gray, but long tasks display a red triangle in the
    upper-right corner. Additionally, the blocking portion of the task—that is, the
    portion exceeding fifty milliseconds—bears red diagonal stripes (Fig 3.15).


    ![A cascading timeline of subtasks executed by a parent labeled “task,” represented
    by a grey rectangle half-filled with diagonal red stripes. The top right corner
    is marked red.](image/3.15.png)


    Fig 3.15: A long task—which is at the top of the hierarchy in this view—has a
    red triangle in its upper-right corner. The blocking portion of the task is marked
    with red diagonal stripes.

