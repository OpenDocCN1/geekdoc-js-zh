    \n```\n});\n```\n\nThe `grabVitals` function accepts a string pointing to a URL\
    \ where a page’s performance metrics will be sent as a JSON string for collection.\
    \ To avoid contention on the main thread during startup, the `grabVitals` method\
    \ isn’t called until the page `load` event fires.\n\nIf you decide to roll your\
    \ own solution, keep the following in mind:\n\n*   Google’s `web-vitals` package\
    \ can’t gather all metrics in all browsers without polyfills. That means loading\
    \ it on some browsers may end up in unused code. `grab-vitals` gets around this\
    \ by using dynamic `import`—a code-splitting technique we’ll cover in Chapter\
    \ 4.\n\n*   Use `requestIdleCallback` ([http://bkaprt.com/rjs39/03-21](http://bkaprt.com/rjs39/03-21))\
    \ to avoid main-thread contention with critical interactions. No critical interaction\
    \ should ever take a back seat to collecting metrics. This API is covered in Chapter\
    \ 6.\n\n*   There are considerable challenges involved with batching collected\
    \ metrics to avoid excessive calls to the collection endpoint. `grab-vitals` compensates\
    \ for this by listening for the page’s `visibilitychange` event as well as the\
    \ `pagehide` event for Safari ([http://bkaprt.com/rjs39/03-22](http://bkaprt.com/rjs39/03-22)).\n\
    \n*   You’ll have to decide whether it’s best to send field metrics to your collection\
    \ endpoint with `fetch` or `navigator.sendBeacon` ([http://bkaprt.com/rjs39/03-23](http://bkaprt.com/rjs39/03-23)).\
    \ `navigator.sendBeacon` is less complex to use than `fetch` and doesn’t delay\
    \ navigations by delaying document unloading, but `fetch` offers better control.\n\
    \nThis stuff is hard! It’s not always a bad idea to reach for something off the\
    \ shelf, even if it’s a paid product. Just know that if you decide to work with\
    \ a vendor to collect field data, you should ask questions to ensure their collection\
    \ methods address the aforementioned issues.\n\nAs far as storing metrics goes,\
    \ that requires an application backend and a database ([http://bkaprt.com/rjs39/03-24](http://bkaprt.com/rjs39/03-24)).\
    \ How you store metrics doesn’t matter so long as they’re accessible to you in\
    \ a way that’s comfortable and familiar.\n\n### Tips for analyzing field metrics\n\
    \nWhether you’re leaning on a vendor product to gather metrics or rolling your\
    \ own solution, there are a few things to consider when you analyze the field\
    \ metrics in your data store:\n\n*   **Avoid averages!** While averages are easy\
    \ to calculate, they don’t explain performance the way you think they do ([http://bkaprt.com/rjs39/03-25](http://bkaprt.com/rjs39/03-25)).\
    \ Averages tend to be skewed since large collections of field metrics have many\
    \ outliers.\n\n*   **Focus on percentiles.** The 75th, 90th, and 95th percentiles\
    \ are especially valuable, as these intervals tend to emphasize slower experiences\
    \ over faster ones.\n\n*   **Pay special attention to the 90th percentile and\
    \ up.** This is where you’ll see how slower devices and poor network conditions\
    \ affect performance. Address pain points in this range, and you’ll make your\
    \ website faster for everyone regardless of how fast their network connection\
    \ or device is.\n\n*   **Contextualize the data.** Metrics alone only convey simplistic\
    \ conclusions like, “This is when your page is interactive.” If you’re evaluating\
    \ a vendor product, see if it collects device information and long-task data from\
    \ the Long Tasks API. If you’re rolling your own, store that data yourself. It\
    \ will give you more insight into why some users experience trouble where others\
    \ don’t.\n\nIf you follow only one piece of advice, focus on percentiles! Percentiles\
    \ are valuable in summarizing the range of outcomes in field metrics. Let’s say\
    \ we have a website with relatively little JavaScript with 312 LCP records:\n\n\
    | **Percentile** | **Largest Contentful Paint** |\n\n| --- | --- |\n\n| 25th |\
    \ 237 milliseconds |\n\n| 50th | 619 milliseconds |\n\n| 75th | 1,503 milliseconds\
    \ |\n\n| 90th | 3,693 milliseconds |\n\n| 95th | 8,120 milliseconds |\n\nIf we\
    \ average all the records, we get about 1,707 milliseconds. While this is hardly\
    \ a bad LCP score, it’s a conglomeration of values that don’t reflect an actual\
    \ session. It lands near the 75th percentile, as the values in higher percentiles\
    \ skew the average upward. Meanwhile, a whole 5 percent of outcomes from the 95th\
    \ percentile and up reflect speeds that are at least six times slower than the\
    \ 75th percentile!\n\nAnalyzing field metrics is tough, but it’s rewarding when\
    \ you see how different conditions describe your website’s performance in ways\
    \ synthetic tools can’t. You can’t use JavaScript responsibly without knowing\
    \ how your website affects those who use it!\n\n## Shifting the Focus\n\nAssessing\
    \ JavaScript performance is a vast subject that sprawls well beyond the scope\
    \ of this chapter—hell, even this book! Still, the information here should be\
    \ enough to get you up and running with more than the bare necessities. By now,\
    \ you have an idea of key performance metrics, what it takes to assess both loading\
    \ and runtime performance, and how JavaScript is involved in that whole soup of\
    \ quantifying what is—and isn’t—a good user experience.\n\nGoing forward, we’ll\
    \ focus on what it takes to relegate JavaScript to its appropriate role in your\
    \ website for the benefit of your users. After all, those who depend on what you\
    \ build don’t necessarily care how you built something, only that it’s fast and\
    \ usable. Performance metrics and profiling explain what your performance picture\
    \ looks like, but now we’ll learn how to make it better.\n\n# Chapter 4. Building\
    \ for Speed\n\n![](image/5.png)\n\nLike many other species of wasp, the paper\
    \ wasp builds its nest by chewing up wood pulp and spitting it back out to use\
    \ as a sort of unholy mortar. It’s a weird thing to parse out in your head—chewing\
    \ up whatever sources of wood you can find and then puking it back up to build\
    \ your house—but that’s evolution for you.\n\nWeirder still is that paper wasps\
    \ don’t have a strong preference for the *type* of pulp—they’ll use whatever’s\
    \ suitable. As Italian entomologist Mattia Menchetti found out, if the only pulp\
    \ source around is colored construction paper, wasps will make it work (Fig 4.1).\n\
    \nAs developers, we must also get creative with the tools and techniques available\
    \ to us to keep our websites fast in the face of an ever-sprawling adoption of\
    \ JavaScript. We have to deliver functionality only when necessary by importing\
    \ scripts at the time of need, adapt to people’s preferences for reduced data\
    \ usage, use resource hints to get a head start on loading JavaScript assets,\
    \ and layer on enhancements that can speed up our websites in the places where\
    \ it matters most.\n\nLet’s roll!\n\n## Responsible Feature Delivery\n\n![Four\
    \ paper wasps clutch a globular nest they are building out of bits of colored\
    \ construction paper.](image/4.1.png)\n\nFig 4.1: A group of paper wasps constructing\
    \ a multicolored nest out of construction paper. Photograph courtesy of Mattia\
    \ Menchetti ([http://bkaprt.com/rjs39/04-01](http://bkaprt.com/rjs39/04-01)).\n\
    \nSome scripts must be loaded at startup, while others can be loaded sometime\
    \ later. Knowing the difference is a challenging aspect of using JavaScript responsibly.\
    \ The web platform can’t do that work for us, but it does provide a tool to load\
    \ JavaScript on demand: dynamic imports.\n\n### Static versus dynamic imports\n\
    \nBefore we get into dynamic imports, we should probably talk about static imports.\
    \ Chances are good that you’ve seen `import` statements used in JavaScript like\
    \ so:"
