    /js/scripts.js\", \"/js/vendors.js\"];\n```\n\n```\nconst markupArray = _.map(scripts,\
    \ script => {\n```\n\n```\n return '<script src=\"${script}\"><\\/script>';\n\
    ```\n\n```\n});\n```\n\n```\nconst markup = _.join(markupArray, \"\");\n```\n\n\
    While Lodash does this well, this code can be updated to use JavaScript features\
    \ available in the browser:\n\n```\nconst scripts = [\"/js/scripts.js\", \"/js/vendors.js\"\
    ];\n```\n\n```\nconst markup = scripts.map(script => {\n```\n\n```\n return '<script\
    \ src=\"${script}\"><\\/script>';\n```\n\n```\n}).join(\"\");\n```\n\nBrowsers\
    \ ship enough JavaScript features to let you do damn near anything without utility\
    \ libraries. For example, you can:\n\n*   filter arrays with `Array.prototype.filter`\
    \ ([http://bkaprt.com/rjs39/02-01](http://bkaprt.com/rjs39/02-01));\n\n*   reduce\
    \ an array to a single value with `Array.prototype.reduce` ([http://bkaprt.com/rjs39/02-02](http://bkaprt.com/rjs39/02-02));\n\
    \n*   concatenate two arrays with `Array.prototype.concat` ([http://bkaprt.com/rjs39/02-03](http://bkaprt.com/rjs39/02-03));\
    \ and\n\n*   get an object’s keys, values, or both as an array with `Object.keys`,\
    \ `Object.values`, or `Object.entries`, respectively ([http://bkaprt.com/rjs39/02-04](http://bkaprt.com/rjs39/02-04)).\n\
    \nThat’s a mere sampler! There are tons of JavaScript methods at your disposal,\
    \ available in practically every browser in widespread use ([http://bkaprt.com/rjs39/02-05](http://bkaprt.com/rjs39/02-05)).\
    \ It pays to think critically about what you’re trying to achieve and attempt\
    \ to solve problems with bare JavaScript first, and then resort to utility libraries\
    \ if that goal becomes  untenable.\n\n### Beware the bandwagon fallacy\n\nWhen\
    \ the developer community is invested in a framework, it feels like the right\
    \ choice—the *safe* choice. This is the bandwagon fallacy, an alluring force when\
    \ it comes to assessing client-side frameworks. Even if everyone *is* using it,\
    \ it still may not be safe from a user-experience perspective. The trick is to\
    \ know if a given tool is appropriate for the task at hand.\n\nReact is a popular\
    \ JavaScript framework that emphasizes componentization and simplified state management.\
    \ It was developed by Facebook, and enjoys strong advocacy from a vocal and dedicated\
    \ userbase. The State of JS 2020 Survey found that 70 percent of their 23,765\
    \ respondents use React ([http://bkaprt.com/rjs39/02-06](http://bkaprt.com/rjs39/02-06)).\
    \ The survey also revealed that:\n\n*   70.8 percent of respondents identified\
    \ as white;\n\n*   91.1 percent identified as male, 5.8 percent identified as\
    \ female, and 0.9 percent identified as nonbinary / third gender;\n\n*   More\
    \ than half (52.6 percent) assessed their proficiency in JavaScript at an expert\
    \ level and just under half rated themselves at either an intermediate (22.7 percent)\
    \ or advanced (22.3 percent) level. In contrast, only 2.3 percent rated their\
    \ proficiency at a beginner level.\n\nThese results clearly illustrate that an\
    \ exceedingly vocal segment of white male developers who self-assess their JavaScript\
    \ skill at above-average levels advocate strongly for React. They also advocate\
    \ for a developer experience that favors JavaScript-heavy client-side architectures,\
    \ which are given to poor performance in adverse conditions—something this segment\
    \ of developers is far less likely to experience themselves, thus reaffirming\
    \ and reflecting their biases in their work.\n\nConsider that, as performance\
    \ engineer Tim Kadlec found in his 2020 analysis of JavaScript frameworks, the\
    \ median of websites using React shipped 40 percent more JavaScript than the median\
    \ of all websites ([http://bkaprt.com/rjs39/02-07](http://bkaprt.com/rjs39/02-07))."
