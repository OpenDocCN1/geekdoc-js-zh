  raw: 'Task runners are attractive because they’re straightforward: you have a thing
    you want to do to some files, so you point the task runner at the files to do
    the thing. This linearity results in a low learning curve and quick adoption.
    For example, the A11Y Project relies on a popular task runner called gulp.js ([http://bkaprt.com/rjs39/05-03](http://bkaprt.com/rjs39/05-03)),
    and they even promote it in their technology statement, citing “ease of set up
    [sic]” and “approachability for beginners” ([http://bkaprt.com/rjs39/05-04](http://bkaprt.com/rjs39/05-04)).


    Task runners can be used anywhere, and they’re an especially great fit for websites
    that don’t rely heavily on JavaScript. But they aren’t for every project. Since
    they apply broad optimizations to JavaScript files without analyzing their contents,
    they can’t optimize your code in the more sophisticated ways that other tools
    can. That’s where bundlers come in.


    ## Bundlers


    Using a task runner for a website that depends on JavaScript to function can lead
    to a lot of duplicated or unused code being served across different pages. If
    your project relies heavily on JavaScript, a bundler may be a better fit.


    The primary tradeoff between task runners and bundlers is ease of use. Where task
    runners are easier to learn and set up, bundlers can get downright byzantine.
    I have personally observed webpack ([http://bkaprt.com/rjs39/05-05](http://bkaprt.com/rjs39/05-05))
    configurations of more than one hundred lines—sometimes many more. Other bundlers,
    such as Rollup ([http://bkaprt.com/rjs39/05-06](http://bkaprt.com/rjs39/05-06))
    or Parcel ([http://bkaprt.com/rjs39/05-07](http://bkaprt.com/rjs39/05-07)), may
    be more straightforward than webpack but may not fit as well in certain architectures
    due to differing requirements.


    No matter what bundler you choose, though, a key difference between these and
    task runners lies in how you’ll want to structure your application logic.


    ### How bundlers work


    Instead of applying broad optimizations to a bunch of files, bundlers go through
    a project codebase and analyze its various static and dynamic `import`s. This
    means that a bundler sees your application as a collection of modules, unlike
    a task runner, which doesn’t analyze your codebase.


    Bundlers come to understand the structure of your codebase through a comprehensive
    process (Fig 5.3):


    ![Icon of a box, labeled “bundler,” arrow to a file icon “Entry point.” Arrow
    leading to a web of file icons, with any labeled “Module” connected to a single
    “scripts.min.js” output file, and any labeled “vendor package” connected to a
    “vendors.min.js” file.](image/5.3.png)


    Fig 5.3: A bundler takes one or more entry points and builds a dependency graph,
    which it uses to decide how best to bundle scripts. Here, application modules
    and vendor modules—that is, scripts installed by npm—are bundled separately.


    *   Bundlers accept one or more *entry points* in their configuration. Think of
    an entry point as the trunk of a tree. Each branch represents an `import`—a concept
    we touched on in Chapter 4—where modules become part of your application.


    *   By analyzing an entry point and the various modules and scripts it imports,
    the bundler builds a *dependency graph*. Think of a dependency graph as the representation
    of your entry point’s tree.


    *   Using the dependency graph, the bundler then emits optimal production-ready
    script assets. This may include automatically splitting your code into separate
    bundles or dropping unused code.


    ### The complicated business of tree shaking


    Muck around with bundlers long enough, and you’ll eventually hear about *tree
    shaking*. Tree shaking is an optimization where a bundler analyzes your application
    and drops unused modules. The result—at least, the *intended* result—is that you
    ship less JavaScript to browsers.


    Success isn’t guaranteed, but if you know that unused parts of a codebase are
    still being bundled in your production build, you’ve got some options.


    #### ESM all the way


    Tree shaking only occurs if the module type you’re using can be *statically analyzed*.
    Static analysis occurs when source code is analyzed by a compiler—the bundler,
    in this case—and a dependency tree can be built.


    The types of modules you use play a pivotal role in how bundlers optimize output.
    Two common module types you’ll encounter are *ES modules (ESM)* and *CommonJ**S*
    *modules*.


    ESM may contain named and `default` exports, which can then be brought into another
    scope with the `import`  statement:


    ```

    // /js/build-script-tags.js

    ```


    ```

    const buildScriptTags = scriptUrls => scriptUrls.map(url => ''<script src="${url}"></script>'');

    ```


    ```

    export default buildScriptTags;

    ```


    ```

    // /app.js

    ```


    ```

    import buildScriptTags from "./js/build-script-tags.js";

    ```


    CommonJS modules are similar, but rather than using the `export` statement, they
    use `module.exports`, and are imported using the `require`  statement:


    ```

    // /js/build-script-tags.js

    ```


    ```

    module.exports = scriptUrls => scriptUrls.map(url => ''<script src="${url}"></script>'');

    ```


    ```

    // /app.js

    ```


    ```

    const buildScriptTags = require("./js/build-script-tags.js");

    ```


    These differences may seem superficial. They’re not. For one, ESM is supported
    in browsers *and* in later versions of Node.js, while CommonJS is only supported
    in Node.js. Second—and this is the kicker—CommonJS modules can’t be statically
    analyzed. This is because both CommonJS’s `module.exports` and `require` constructs
    accept dynamic expressions. Therefore, bundlers can’t easily or reliably mark
    which CommonJS modules are unused ([http://bkaprt.com/rjs39/05-08](http://bkaprt.com/rjs39/05-08)).


    ESM resolves this via the static `import` statement, which can only accept a plain
    string. This makes tree shaking loads more predictable for bundlers.


    #### Sometimes ESM becomes CommonJS


    One reason tree shaking can fail is that a *transpiler*—that is, a tool that transforms
    modern JavaScript features and syntax into a legacy syntax that runs reliably
    in all browsers—may transform ESM modules to CommonJS for compatibility. How and
    when this happens depends on your configuration.


    Babel is a transpiler that uses plugins and presets to transform JavaScript syntax.
    In Babel’s ecosystem, a preset is a collection of plugins that achieve a certain
    output style. `preset-env` is a popular preset that transforms code according
    to the targeted environment ([http://bkaprt.com/rjs39/05-09](http://bkaprt.com/rjs39/05-09)).


    Depending on your configuration and aspects of your codebase, preset-env may inadvertently
    transform ESM to CommonJS. If this happens, your transpiled source ends up in
    a format that sidesteps static analysis, and tree shaking fails. As time goes
    on, this will be less likely, but just in case, we can instruct Babel to preserve
    module types with preset-env’s `module``s` setting:


    `// babel``.config.js`


    `module.e``xports = {`


    `presets: [`


    `[`


    `"@babel/pres``et-env", {`


    `// Preserves modu``le` `syntax:`


    `modu``les:` `false`


    `}`


    `]`


    `];`


    ```

    };

    ```


    The potential downside of this is that it may create incompatible code with browsers
    that don’t support ESM. For those browsers, you’ll just have to take the hit if
    you can’t justify dropping support for them, but, thankfully, those browsers are
    dropping in usage.


    It’s also worth assessing whether you need a transpiler in the first place. Depending
    on the project and its dependencies, you may be able to drop the transpiler from
    your toolchain altogether. As browsers mature and their support of new language
    features grows, this could be an increasingly viable option—*if* you can swing
    it.


    #### Sometimes it’s vendor code


    Some vendor packages—often older ones—are written in CommonJS instead of ESM.
    This could be the package owner’s stylistic preference, or a desire to maintain
    compatibility with more versions of Node.js. Whatever the reason, the outcome
    is that you’re shipping more unused code. Your options here vary:'
