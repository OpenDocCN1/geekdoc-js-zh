    Fig 3.12: The bottom pane of Chrome’s performance profiler. This pane has several
    tabs to display summary data as well as detailed lists of page activity.


    ### Assessing loading performance


    When you assess loading performance, you’re telling the profiler to reload the
    current page and record everything that happens up until the network and main
    thread are reasonably quiet. Performance profilers in most browsers provide this
    type of functionality, which gives insight into what happens during the startup
    phase of any given page (Fig 3.13).


    ![Chrome’s performance profiler summarizing load performance for Amazon.com, including
    an activity overview, network timings, and a flame chart.](image/3.13.png)


    Fig 3.13: A populated view of Chrome’s performance profiler for an Amazon product
    detail page. At the top is the populated activity overview. At the bottom is the
    flame chart, which shows all the call stacks for the page.


    Like so many “whoa, hold up”-type signals you encounter daily, the color red has
    special significance in Chrome’s profiler in that it calls out performance issues.
    An easy shortcut for finding problems is to scan the profiler’s activity overview
    and look for red strips. These strips represent periods of blocking time—and as
    we’ve established, blocking time equals an overworked main thread.


    Drill down to problem areas by clicking and dragging across the red strips in
    the activity overview (Fig 3.14). Because the flame chart expands or contracts
    to the selection, we gain greater visibility into what’s happening at that point
    in time.


    ![Isolated view of the activity overview from previous figure, with an portion
    of the timeline highlighted. Intermittant red boxes dot the top. ](image/3.14.png)


    Fig 3.14: The activity overview in Chrome’s performance profiler, with a small
    portion of activity selected. The red strips across the top illustrate periods
    of blocking time.


    All tasks are displayed in gray, but long tasks display a red triangle in the
    upper-right corner. Additionally, the blocking portion of the task—that is, the
    portion exceeding fifty milliseconds—bears red diagonal stripes (Fig 3.15).


    ![A cascading timeline of subtasks executed by a parent labeled “task,” represented
    by a grey rectangle half-filled with diagonal red stripes. The top right corner
    is marked red.](image/3.15.png)


    Fig 3.15: A long task—which is at the top of the hierarchy in this view—has a
    red triangle in its upper-right corner. The blocking portion of the task is marked
    with red diagonal stripes.


    Call stacks aren’t just static visualizations in Chrome’s profiler; they’re also
    interactive interface elements. If you’re feeling nosy, click on any of the rectangles
    in a call stack, and a summary of that activity will show up in a pane at the
    bottom of the profiler window (Fig 3.16).


    ![An “evaluate script” activity’s timings, including a pie chart for “aggregated
    time,” color-coded for total time spent by the activity and child activities.](image/3.16.png)


    Fig 3.16: The summary view shows the task’s duration, the task’s initiating script,
    and a breakdown of the task’s activity.


    The important bit in the summary view is the file name of the script associated
    with the selected task. When it comes to script evaluation, we want to figure
    out what script is raising hell, and when we find it, we want to know what we
    can do about it.


    Chrome’s coverage tool is useful in this endeavor, as it identifies unused parts
    of scripts based on the activity it monitors. It’s also not immediately visible
    from the main developer menu; you must press the escape key to open the bottom
    drawer in Chrome’s developer tools, where the coverage tool is squirreled away
    in a submenu along with other tools.


    Like Chrome’s performance profiler, the initial state of its coverage tool is
    empty and must be populated by recording. As it records, the coverage tool will
    reload the page, then populate a table with information as it’s received. The
    tool continues recording until you stop it.


    The first table columns contain the URL to the asset and its type (e.g., CSS,
    JS, etc.). Subsequent columns detail the used and unused portions of that asset’s
    code (Fig 3.17).


    ![“Coverage” table, listing URLs for assets, asset type, total bytes, unused bytes,
    and bar charts showing unused/used percentage as red/blue.](image/3.17.png)


    Fig 3.17: Red indicates the unused portion of each asset, and blue indicates the
    used portion.


    Unused JavaScript is attributable to one or two possibilities:


    *   The code wasn’t executed while the coverage tool was recording. The coverage
    tool only monitors JavaScript activity that occurs during recording. Interacting
    with the page during recording may invoke more portions of the script, reducing
    the reportedly unused portion.


    *   *Unreachable code*, or code that can never be executed and therefore has no
    significance ([http://bkaprt.com/rjs39/03-12](http://bkaprt.com/rjs39/03-12)).


    Either way, the coverage tool lets you see the unused parts of an asset by double-clicking
    the asset URL in the table. This opens the asset in an interface like a text editor’s.
    In this view, the unused lines of code are marked with a red marker in the left
    gutter (Fig 3.18).


    ![Lines 1–17 of a script in Chrome’s coverage tool, with lines 2–11 highlighted
    with red ticks and all others with blue.](image/3.18.png)


    Fig 3.18: When examining a JavaScript asset in Chrome’s coverage tool, the unused
    portions are marked with red in the left gutter. These unused portions of code
    can be deleted (if they’re unreachable) or split out into separate files to be
    loaded on demand to reduce startup time.


    Some JavaScript engines try to optimize their way around unused code. Chrome’s
    V8 JavaScript engine uses a technique called *lazy parsing* to speed up evaluation
    of JavaScript at startup, and then compile unused portions of code on demand ([http://bkaprt.com/rjs39/03-13](http://bkaprt.com/rjs39/03-13)).
    While these optimizations are helpful, they’re out of your control, and your users
    would be better served by splitting the unexecuted code into separate files to
    be loaded on demand later. We’ll talk about this technique in Chapter 4.


    ### Assessing runtime performance


    To recap from Chapter 1, runtime performance describes how responsive a page is
    to user interactions. Snappy is good, sluggish is bad, and profilers can help
    you figure out where specific interactions fall in that range of outcomes.


    Assessing runtime performance involves profiling a specific activity, which means
    you’ll interact with the page during the recording. Start with interactions that
    seem sluggish or that serve as a prominent gateway to other parts of the website,
    so you can prioritize your optimizations.


    To profile interactions, first allow the page to completely load. Click the record
    button in the profiler, perform your chosen interaction (such as toggling a menu),
    and end the recording. When the profiler populates, it will include the call stack(s)
    for the recorded interactions (Fig 3.19).'
