    \n2.  Treat native lazy loading as a progressive enhancement. This means you accept\
    \ the fact that nonsupporting browsers will load images regardless of their visibility\
    \ in the viewport, while supporting browsers will lazy-load them. It’s imperfect,\
    \ but it’s simpler, and will be an increasingly viable approach as support grows.\n\
    \nThe benefits of delegating lazy loading solely to HTML can’t be understated.\
    \ By relying on HTML to do something we’ve commonly relied on JavaScript for,\
    \ both loading and runtime performance improve. Not only is relying on HTML to\
    \ lazy-load simpler overall, it’s more sustainable. Less work means you can turn\
    \ your attention to harder problems. That’s a win.\n\n## Observe This\n\nVarious\
    \ observer APIs follow a similar pattern to observe changes in certain aspects\
    \ of a page: they observe a target—a DOM node, for example—and run a callback\
    \ function whenever they detect change(s) in that target.\n\nObserver APIs are\
    \ worth learning because they replace the antipatterns of yore where we did wasteful\
    \ stuff like, say, constantly polling for an element’s visibility every time the\
    \ user scrolls. Observers turn expensive work into cheap work (Fig 6.4).\n\n![The\
    \ top summary shows a page using scroll event handlers to lazy-load media. The\
    \ bottom shows a page doing the same task, but using Intersection Observer instead.\
    \ The latter case incurs less main-thread work, improving the framerate.](image/6.4.png)\n\
    \nFig 6.4: The top summary shows a page using scroll event handlers to lazy-load\
    \ media. The bottom shows a page doing the same task, but using Intersection Observer\
    \ instead. The latter case incurs less main-thread work, improving the framerate.\n\
    \nSpeaking of checking for element visibility, let’s start with that. Sometimes\
    \ you need JavaScript to tell you if something is in the viewport. One common\
    \ example of using the Intersection Observer API is lazy-loading media.\n\n“But,”\
    \ you insist, “you *just* said that HTML already handles this!” It sure does!\
    \ But only for `<iframe>` and `<img>` elements, which aren’t the only things you\
    \ *could* lazy-load. What about placeholder images for `<video>` elements?\n\n\
    ```\n<video width=\"500\" height=\"257\" poster=\"cats-being-jerks.jpg\">\n```\n\
    \n```\n <source src=\"cats-being-jerks.webm\" type=\"video/webm\">\n```\n\n```\n\
    \ <source src=\"cats-being-jerks.mp4\" type=\"video/mp4\">\n```\n\n```\n</video>\n\
    ```"
