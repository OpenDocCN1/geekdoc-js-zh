- fmt: '

    To be fair to the State of South Carolina, some of the third-party JavaScript
    loaded on this informational page is useful, such as YouTube embeds of informational
    videos. Even so, they could provide this information as outbound links that go
    directly to YouTube, or even load it inline as a result of a user interaction,
    rather than embedding it on the page willy-nilly.


    On the other hand, some other third-party stuff has dubious utility—chat widgets
    in particular require a lot of additional and arguably unnecessary JavaScript.
    A good alternative is the practical one: give people a phone number or an email
    address. At the very least, none of the chat widget’s JavaScript should ever load
    until someone shows intent to `use` it.


    Either way, only one thing will ever be true when it comes to third-party products:
    page speed will be better for each one you `don’t use`. This isn’t to say that
    they’re never useful, but treat every new script with healthy skepticism. While
    some third-party scripts can be indispensably useful for many organizations, there
    are several you need to approach with a side-eye at the ready.


    ## Client-side A/B testing frameworks


    A/B testing is a form of research that evaluates how variations on design, content,
    or functionality affect engagement. Rather than rolling out a significant change
    to the live site, you show one version of The New Thing to half of your audience
    and show the status quo to the remainder—that’s the simplest explanation, anyway
    (Fig 7.3).


    ![Two screenshots of the slack.com homepage with different design layouts and
    copy. ](image/7.3.png)


    Fig 7.3: A/B testing allows organizations to evaluate multiple design and messaging
    variations before committing to a change.


    A/B testing is supposed to inform decisions on evolving your product, which is
    an inherently good idea! However, it’s usually conducted with client-side JavaScript,
    which carries the predictable performance outcomes:


    * Testing scripts modify the `DOM` on the fly. This often requires the necessary
    JavaScript to be loaded in the document `<head>` as a render-blocking resource
    in order to avoid noticeable changes to the user interface.

    * More JavaScript equals more problems—namely, more processing on the main thread,
    which disproportionately affects those on low-end devices and slower networks.

    * If A/B testing solutions attach numerous event listeners to `DOM` elements,
    that can slow down runtime performance—something you just can’t afford if you’re
    already hanging off the cliff when it comes to those on low-end devices.


    Assess whether the benefit of doing this research outweighs the impact, or whether
    its potentially negative performance impacts could skew test results. Changing
    page structure and presentation on the fly is a risky business, and the work to
    run the test can still be considerable even on capable hardware (Fig 7.4).


    ![ A partial call stack from the Best Buy website. This long task (roughly 225
    milliseconds) was triggered by a client-side A/B testing script on the Best Buy
    website. The blocking portion of the task is roughly 175 milliseconds.](image/7.4.png)


    Fig 7.4: A partial call stack from the Best Buy website. This long task (roughly
    225 milliseconds) was triggered by a client-side A/B testing script on the Best
    Buy website. The blocking portion of the task is roughly 175 milliseconds.


    If you’re conducting A/B testing, ensure your testing framework offers a server-side
    option, or consider switching to one that does. If you can ensure you won’t skew
    your test results by doing so, consider not conducting A/B testing on low-end
    devices, particularly if a sizable part of your audience doesn’t use them. Client-side
    signals such as `navigator.deviceMemory` ([http://bkaprt.com/rjs39/07-03](http://bkaprt.com/rjs39/07-03))
    and `navigator.hardwareConcurrency` ([http://bkaprt.com/rjs39/07-04](http://bkaprt.com/rjs39/07-04))
    are coarse, but potentially beneficial, signals that may help.


    A/B testing is useful, but the significant client-side work it can kick off is
    not sustainable in the long term, especially if you don’t consistently cull finished
    experiments to avoid transferring large amounts of unused JavaScript. As is the
    case with most JavaScript performance problems, the more you can offload to servers,
    the more browsers benefit.


    ## Accessibility overlays


    Accessibility overlays are third-party products that claim to automatically fix
    website accessibility issues through client-side JavaScript. Accessibility overlays
    are enticing because inaccessible websites carry real legal consequences ([http://bkaprt.com/rjs39/07-05](http://bkaprt.com/rjs39/07-05)).
    Accessibility work is `tough`. It takes skilled developers and considerable time,
    effort, and money to fix accessibility problems.


    Accessibility cannot be automated away. By using an accessibility overlay, you
    are tacitly admitting that your website has problems that you don’t want to fix.
    Worst of all, accessibility overlays don’t even work. They cause more problems
    than they fix ([http://bkaprt.com/rjs39/07-06](http://bkaprt.com/rjs39/07-06)):


    * In cases where `<img>` elements lack proper `alt` text, overlays will generate
    text. This text may be excessively verbose, effectively turning a gap of information
    into a burden for those using assistive technologies.

    * Overlays often provide a content-scaling feature. Depending on how a website
    is styled, the overlay’s assumptions about how to scale content may cause elements
    to overlap or become obscured. Properly styling your website using relative CSS
    units ensures your website can be properly scaled by the browser’s native zoom
    controls.

    * Content scaling may also cause issues with readability in body copy with static
    `line-height` values, as scaling up content may cause lines of text to overlap
    and become unreadable.

    * Overlays themselves may have excessive, unintuitive interactions. accessiBe’s
    overlay product contains more than seventy-five controls, which clutter the interface
    and overwhelm users.


    There’s a lot more that can go wrong, and—and——on top of all that pain, performance
    gets worse (Fig 7.5).


    ![A WebPageTest comparison of the main thread of Samsung’s US website with AudioEye’s
    accessibility overlay loaded (top) and without it (bottom). AudioEye’s accessibility
    overlay incurred more than twice as much blocking time than without it.](image/7.5.png)


    Fig 7.5: A WebPageTest comparison of the main thread of Samsung’s US website with
    AudioEye’s accessibility overlay loaded (top) and without it (bottom). AudioEye’s
    accessibility overlay incurred more than twice as much blocking time than without
    it.


    Accessibility overlays are snake oil at best. They don’t make your website more
    accessible, and they’re downright poisonous for performance. When you use them,
    you’re making things worse and throwing good money after bad.


    The ethos of this book is performance-centric, but accessibility is another aspect
    of using JavaScript responsibly. If you need to level up your accessibility game,
    check out Accessibility for Everyone Everyone by Laura Kalbag ([http://bkaprt.com/rjs39/07-07](http://bkaprt.com/rjs39/07-07)).
    The Resources section also has a few links that can point you in the right direction.


    ### Heatmaps


    Heatmaps visualize which parts of a page people interact with most frequently
    to determine the value of interface elements or layout choices. They get their
    name from their resemblance to thermal imaging: areas of high interaction frequency
    are visualized as hot, and areas of low interaction frequency as cold (Fig 7.6).


    ![Heatmap overlays illustrate the frequency of user interactions on a scale from
    green (“cold”) to red (“hot”).](image/7.6.png)


    Fig 7.6: Heatmap overlays illustrate the frequency of user interactions on a scale
    from green (“cold”) to red (“hot”).

