    ![A call stack from a web worker running on its own thread on the Home Depot website
    as shown in Chrome’s performance profiler. The tasks on this thread give the main
    thread breathing room to do more urgent and user-facing work.](image/6.7.png)


    Fig 6.7: A call stack from a web worker running on its own thread on the Home
    Depot website as shown in Chrome’s performance profiler. The tasks on this thread
    give the main thread breathing room to do more urgent and user-facing work.


    ### Move taxing tasks into web workers


    Oft-cited examples of web workers involve fetching and processing a massive amount
    of data in a worker thread, and then ferrying the result to the main thread. While
    this is a great use case, it’s not the only one.


    Say you’re building a photography web app where people need access to Exif data,
    the treasure trove of image metadata captured by digital cameras. You might use
    `fetch` to make a request for an image file’s data, convert that raw data into
    a binary data stream with `ArrayBuffer` ([http://bkaprt.com/rjs39/06-17](http://bkaprt.com/rjs39/06-17)),
    and then extract the Exif data from it.


    That’s not an easy thing to do, though, so you could use a package like `ExifReader`
    ([http://bkaprt.com/rjs39/06-18](http://bkaprt.com/rjs39/06-18)) to process image
    Exif data for you. However, doing this on the main thread incurs considerable
    work on a few fronts:


    * Loading `ExifReader` on the main thread

    * Kicking off a `fetch` for an image asset

    * Converting the image response into a blob and ultimately into an `ArrayBuffer`
    as well as extracting the Exif data

    * Constructing markup to display the Exif data


    JavaScript engines do their best to split work up into manageable chunks, but
    long tasks aren’t always avoidable. Therefore, this work is best left to a separate
    thread.


    To demonstrate how fetching an image from the network and extracting Exif data
    from it can be done by a web worker, I created a demo app named `JPEG Metadata
    Extractor` ([http://bkaprt.com/rjs39/06-19](http://bkaprt.com/rjs39/06-19)) to
    do exactly that.


    The app’s repository contains two tags. The first ([http://bkaprt.com/rjs39/06-20](http://bkaprt.com/rjs39/06-20))
    does all the `fetch` and metadata extraction on the main thread (Fig 6.8). The
    second ([http://bkaprt.com/rjs39/06-21](http://bkaprt.com/rjs39/06-21)) does all
    the same work as the first, only it does most of that work on a worker thread
    (Fig 6.9).


    ![Image fetching and Exif metadata extraction as it occurs on the main thread.
    As a result, two long tasks occur on the main thread with a total blocking time
    of nearly 150 milliseconds.](image/6.8.png)


    Fig 6.8: Image fetching and Exif metadata extraction as it occurs on the main
    thread. As a result, two long tasks occur on the main thread with a total blocking
    time of nearly 150 milliseconds.


    ![Main-thread activity (at top) and web worker activity (at bottom). While form
    submission and Exif markup insertion must still occur on the main thread, the
    image fetching and Exif extraction work occurs on a separate thread, reducing
    main-thread blocking time.](image/6.9.png)


    Fig 6.9: Main-thread activity (at top) and web worker activity (at bottom). While
    form submission and Exif markup insertion must still occur on the main thread,
    the image fetching and Exif extraction work occurs on a separate thread, reducing
    main-thread blocking time.


    The demo app’s interface accepts a JPEG URL, which is retrieved via a `fetch`.
    Even if we use a web worker, *some* things will still have to be done on the main
    thread:


    * Register a `submit` event listener on the form

    * Validate the form’s inputs

    * Pass the image URL to the web worker


    Almost everything after that can be done in the web worker, which resides in a
    separate script named `exif-worker.js`. The web worker is registered on the main
    thread like so:


    ```

    const exifWorker = new Worker("/js/exif-worker.js");

    ```


    Then, we import `ExifReader` using the `importScripts` function in the web worker
    ([http://bkaprt.com/rjs39/06-22](http://bkaprt.com/rjs39/06-22)). `importScripts`
    accepts a URL string to import an external script to be used in the worker scope:


    ```

    importScripts("/js/exifreader.js");

    ```


    In some browsers, the static `import` syntax can be used to import scripts if
    you register a web worker in module mode ([http://bkaprt.com/rjs39/06-23](http://bkaprt.com/rjs39/06-23)).
    Depending on browser support, though, you might have to stick with `importScripts`.


