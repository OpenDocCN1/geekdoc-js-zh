  trans: "\n\n- 如果该包有使用 ESM 编写的合适替代方案，考虑切换到其中一个。\n- 如果该包是一个工具函数集合且许可证允许，你可能可以提取出该库的必要部分，将它们转换为\
    \ ESM（如果需要的话），并将这些代码直接放置在你的项目中。这样做可以减小构建体积和生产环境的依赖，还具有缩短安装和构建时间的开发者体验方面的益处。\n\
    - 你能自己编写这些功能吗？某些库提供的方法现在可以用 JavaScript 内置方法取代。Chris Ferdinandi 整理了一系列文章，向你展示如何仅使用原生\
    \ JavaScript 完成许多常见任务（[`bkaprt.com/rjs39/05-10`](http://bkaprt.com/rjs39/05-10)）。\n\
    \n第三方包（Vendor packages）可能占你发送到浏览器的 JavaScript 代码大部分。每当你遇到无法通过树摇（tree shaking）优化的第三方包时，退后一步考虑你的选项是一个好主意。\n\
    \n## 何时外部化依赖项\n\n你可能会在项目中看到很多 `import`。每个 `import` 都标志着两种两种依赖类型之一：\n\n1. `本地依赖项`（Local\
    \ dependencies）是你或你的团队编写的特定于你项目的代码。这些通常不会发布为任何人都可以包管理器安装的公共依赖。\n2. `远程依赖项`（Remote\
    \ dependencies）是在项目之外且通常与项目分离的代码。它们通常是安装的第三方包，但你的项目架构可能会将应用特定的逻辑隔离到可安装的（可能是私有的）包中，这种架构风格有时被称为微前端。\n\
    \n在微前端架构中，当第三方包在依赖项之间重复时，页面速度会受到影响，这需要额外的精力来消除，因为编译器的范围被限制在每个单独依赖中。\n\n假设你的网站使用\
    \ React，但应用中的每个组件都是隔离在各自仓库中并具有各自工具链的远程依赖项。这导致每个组件都发送自己的 React 副本。那是大量的冗余代码。\n\n\
    为了避免代码重复，你应该外部化那些你确定是从其他来源提供的依赖项。所有的打包器都提供此功能。例如，`webpack` 可以通过其 `externals` 配置外部化依赖项（[`bkaprt.com/rjs39/05-11`](http://bkaprt.com/rjs39/05-11)）：\n\
    \n```\nmodule.exports = {\n```\n```\n // ...\n```\n```\n externals: {\n```\n```\n\
    \ react: \"React\",\n```\n```\n \"react-dom\": \"ReactDOM\"``` `externals` 对象中的每个键都是\
    \ npm 包的名称，其对应的值是该包在全局作用域中占用的命名空间。在此此之后，`webpack` 将不会打包 `react` 和 `react-dom`。它将会跳过它们，并假设你在运行时从另一个源提供了这些依赖项。\n\
    \n虽然第三方代码是外部化的典型目标，但针对你网站特定的远程依赖项同样适用。例如，考虑一个电子商务零售商，它在产品详情页的多个组件中使用了一个工具库：如果该工具库没有在使用它的每个依赖项中被外部化，那么它的代码将贯穿整个网站。\n\
    \n这些建议中的某些可能会让你产生打包器是性能负担的印象。虽然某些打包器的倾向于以可能影响性能的方式优先考虑兼容性和互操作性，但这并不是在可以使用它们时避免它们的借口。这仅仅意味着你需要保持警惕。\n\
    \n## 转译器 (Transpilers)\n\n我们已经在本章中提到转译器，但它们是你可能在大多数工具链中遇到的相关工具。回顾一下，转译器将现代 JavaScript\
    \ 特性和语法转换为一种通用的、可以在任何地方可靠运行的语法。\n\n转译器虽然确实有用，但如果我们粗心地地使用它们，可能会像打包器一样棘手。每当你转换一个语言特性以使其在更多地方具有兼容性时，转换后的代码几乎总是比未转换的对应代码占用更大的空间。\n\
    \n## 业务\n\n转译器在现代 Web 开发中起着特殊作用，因为 JavaScript 新功能的添加与浏览器对这些特性采纳程度的差异是冲突的。正如此，你的项目可能使用了某些浏览器可用但在其他浏览器中不可用的\
    \ JavaScript 特性。这些可能是全新的语言结构，如类或 `async`/await`，甚至是新的运算符，如扩展语法。\n\n箭头函数和模板字符串字量是可能会转译器转换的现代语言特性良好示例。箭头函数提供了紧凑的函数语法，对回调特别有用，而模板字符串字量可以方便地将\
    \ JavaScript 表达式嵌入字符串中，而无需使用连接运算符：\n\n```\nconst scriptTags = scriptUrls.map(url\
    \ => '<script src=\"${url}\"><\\/script>').join(\"\");\n```\n\n然而，如果转译器将上述代码转换为通用的语法，结果将是一段更冗长但在实际中中等价的代码：\n\
    \n```\nvar scriptTags = scriptUrls.map(function (url) {\n```\n```\n return \"\
    <script src=\\\"\".concat(url, \"\\\"></script>\");\n```\n```\n}).join(\"\");\n\
    ```\n\n虽然转译器是确保跨浏览器兼容性的有用工具，但它们有两个缺点：\n\n- 如果转译器没有配置为目标你用户的浏览器，现代浏览器可能会产生显著更多的\
    \ JavaScript 开销。\n- 在你的工具链中添加转译器——以及理解其潜在的性能影响——引入了严峻的学习曲线。\n\n在跨平台兼容性至上的情况下，转译器是不可或缺的，但它们不是强制性的——不过，构建工具也是如此。如果你能够为项目做出架构选择，务实的做法总是渐进式采用。\n\
    \n然而，行业——事实上，现实本身——是一个顽固的家伙。你最终会在某个点必须处理这些工具，如果你现在还没有的话。知道如何约束它们在 JavaScript 性能方面会产生差异。\n\
    \n### 转换不是免费的\n\n取决于配置，转译器在转换许多功能时可能会为包增加膨肿：ES6 类、异步函数、扩展语法、默认参数、生成器函数等等，只要 JavaScript\
    \ 本身继续演进。\n\n让我们测试这个概念并从默认参数开始。如果你在任何语言中编程了足够久，你可能观察到（取决于语言）函数的参数具有默认值，当被省略时将生效。与其他语言相比，这是一个较新的\
    \ JavaScript 特性：\n\n```\nfunction generateLinkTags (cssFiles = [\"/css/global.css\"\
    ]) {\n```\n```\n return cssFiles.map(cssFile => {\n```\n```\n return '<link rel=\"\
    stylesheet\" href=\"${cssFile}\">';\n```\n``` }).join(\"\");\n```\n```\n}\n```\n\
    \n该函数生成一组 `<link>` 元素的字符串。在第一行，你会看到 `cssFiles` 参数后面跟着等号和一个包含全局 CSS 文件引用的数组。这意味着函数可以在不传递任何参数的情况下运行并触发默认值。这在许多情况下是一个非常有用的特性。\n\
    \n然而，如果这个函数被 Babel 处理，它可能会某些浏览器目标返回此转换后的代码：\n\n```\nfunction generateLinkTags()\
    \ {\n```\n```\n var cssFiles = arguments.length > 0 && arguments[0] !== undefined\
    \ ? arguments[0] : [\"/css/global.css\"];\n```\n```\n return cssFiles.map(function\
    \ (cssFile) {\n```\n```\n return \"<link rel=\\\"stylesheet\\\" href=\\\"\".concat(cssFile,\
    \ \"\\\">\");\n```\n``` }).join(\"\");\n```\n```\n}\n```\n\n"
- fmt: "\nIt’s an ugly transform, but most developers don’t read transformed code—and\
    \ therein is the point! It’s precisely *because* we don’t read transformed code\
    \ that its cost can escape our notice. Transforming default parameters adds extra\
    \ code for the sake of the developer’s experience, and the cost is incurred for\
    \ every default parameter added.\n\nIf needed, we could sidestep the modern syntax\
    \ in favor of a legacy one:\n\n```javascript\nfunction generateLinkTags (cssFiles)\
    \ {\n  cssFiles = cssFiles || [\"/css/global.css\"];\n  return cssFiles.map(cssFile\
    \ => {\n    return '<link rel=\"stylesheet\" href=\"${cssFile}\">';\n  }).join(\"\
    \");\n}\n```\n\nUsing the `||` operator, we can assign the value of `cssFiles`\
    \ back to itself if its value is not `undefined`. This gives `cssFiles` a default\
    \ value without requiring a transform.\n\n“Well, that’s nitpicky as hell, Jeremy.”\
    \ Yeah, I get it. Sometimes you want to balance maintainability more in your favor,\
    \ and that’s fair—but other kinds of transforms get even hairier. Take this native\
    \ `fetch` wrapper that calls a local API to get JSON data from an endpoint:\n\n\
    ```javascript\nasync function fetchApiData (endpoint, param) {\n  try {\n    const\
    \ response = await fetch('/api/${endpoint}/${param}');\n    const data = await\
    \ response.json();\n    return data;\n  } catch (error) {\n    return error;\n\
    \  }\n}\n```\n\nYou might notice that this wrapper is an `async` function. `async`\
    \ functions are a type of function that simplifies handling promises within them\
    \ by allowing one to `await` a promise rather than dealing with `then`/`catch`\
    \ callback chains. They’re a heck of an improvement to the developer experience,\
    \ but when transformed in certain environments, they get *big* (Fig 5.4).\n\n\
    If you can’t read the code in the figure, that’s the point. There’s too much transform\
    \ bloat to be able to print it without eating up a ton of page space.\n\nThe way\
    \ to get around this transform is to deal with promises directly rather than relying\
    \ on `async`/`await`:\n\n```javascript\nfunction fetchApiData (endpoint, param)\
    \ {\n  return new Promise ((resolve, reject) => {\n    fetch('/api/${endpoint}/${param}').then(response\
    \ => {\n      return response.json();\n    }).then(data => {\n      resolve(data);\n\
    \    }).catch(error => {\n      reject(error);\n    });\n  });\n}\n```\n\nHere,\
    \ we can ensure that `async`/`await` syntax doesn’t add gobs of extra JavaScript\
    \ to production code by using the underlying mechanism that `async`/`await` relies\
    \ on.\n\nAnd hey, *look*: I’m not saying never *ever* use these features otherwise\
    \ you’re a slop bucket of a human being. I’m just asking you to entertain the\
    \ notion that `tooling` decisions can affect people who end up on the business\
    \ end of whatever we slap up on the web. These decisions will come down to what\
    \ browsers you must support, and if you can use certain features (e.g., `async`/`await`)\
    \ without having to transform them for production.\n\nIt’s also worth mentioning\
    \ that the landscape may well have changed significantly by the time you read\
    \ this. Yet, one thing will be true for some time to come: JavaScript is evolving.\
    \ As long as that’s the case, transpilers will be relevant. It pays to stay up\
    \ to date on transpiler documentation. To wit: `Babel` has a concept called “compiler\
    \ assumptions,” which guides `Babel` to transform code in a way that’s more efficient\
    \ for your project ([http://bkaprt.com/rjs39/05-12](http://bkaprt.com/rjs39/05-12)).\n\
    \nIt takes consistent and critical evaluation of the browsers people are using\
    \ to access your website. JavaScript is continually evolving, so transpilers—whether\
    \ `Babel`, existing alternatives, or those yet to be realized—aren’t going away\
    \ soon. Stay vigilant, and keep an eye on what they do.\n\n![Zoomed-out screenshot\
    \ of a code editor, showing approximately 40 lines of excessively verbose code.](image/5.4.png)\n\
    \nFig 5.4: Babel’s transformation of a `fetch` wrapper using `async`/`await`.\
    \ The transformed code is far larger than the input.\n\n### Avoid transforming\
    \ early-stage features in production\n\nSpeaking of new JavaScript features, each\
    \ one gets evaluated by the `TC39` committee in a series of stages ([http://bkaprt.com/rjs39/05-13](http://bkaprt.com/rjs39/05-13)):\n\
    \n*   Stage 0: These are “strawperson” proposals, in that there’s no required\
    \ entrance criteria. These proposals have no support within `TC39`.\n*   Stage\
    \ 1: These proposals have an identified “champion” within `TC39` dedicated to\
    \ its advancement. These proposals can change as they advance.\n*   Stage 2: These\
    \ are draft proposals. At this point, the behavior of the proposed feature is\
    \ well-defined, but changes may still occur.\n*   Stage 3: These are candidate\
    \ recommendations. Proposals at this stage are lightly revised, if ever.\n*  \
    \ Stage 4: These are proposals that become standards.\n\nThis matters because\
    \ `Babel` is used for prototyping, if their names contain `stage` or `proposal`\
    \ ([http://bkaprt.com/rjs39/05-14](http://bkaprt.com/rjs39/05-14)). While familiarizing\
    \ oneself with emerging features is understandable, one can’t just use experimental\
    \ features in production. Never use experimental features in production. It carries\
    \ zero user-facing benefits. This is an easy thing to avoid `Babel` in particular.\n\
    \n### Transforms and browser support\n\nWhile transpilers smooth over compatibility\
    \ gaps, we can also configure them to selectively apply transforms according to\
    \ the environment. Browser compatibility determines which JavaScript features\
    \ you can ship untformed—if a feature is supported natively in your target audience,\
    \ why transform it?\n\nES6 classes are a good example. Browsers largely support\
    \ the `class` construct ([http://bkaprt.com/rjs39/05-15](http://bkaprt.com/rjs39/05-15)).\
    \ Still, it’s not unusual for developers to transform ES6 classes and other relatively\
    \ JavaScript features for legacy browsers—even if they don’t necessarily need\
    \ to support them! This represents extra code that gets shipped for no reason.\n\
    \n`Browslist` ([http://bkaprt.com/rjs39/05-16](http://bkaprt.com/rjs39/05-16))\
    \ maps Can I Use’s compatibility data to browser versions. Transpilers use this\
    \ data to figure out which features should be transformed for targeted browsers.\n\
    \n#### How Browserslist works\n\n`Browserslist` uses a query syntax to specify\
    \ browser targets. That query is then plopped into one of a few locations where\
    \ your toolchain will find it:\n\n*   In the root of your project as a `.browserslistrc`\
    \ file, with queries on separate lines.\n*   In your `package.json` file as a\
    \ `browserslist` key, with the corresponding value being an array containing queries.\n\
    *   In your transpiler configuration ([http://bkaprt.com/rjs39/05-17](http://bkaprt.com/rjs39/05-17)).\n\
    \nQueries themselves can be as simple as `last 2 versions`, which selects the\
    \ last two versions of every browser—but don’t do this. `last 2 versions` means\
    \ you’re transforming JavaScript to be compatible all the way to Internet Explorer\
    \ 10! Unless that’s your intent, you’re better off with a different query ([http://bkaprt.com/rjs39/05-18](http://bkaprt.com/rjs39/05-18)).\n"
