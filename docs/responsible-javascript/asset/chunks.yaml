    If you pulled off this much, that’s a big deal. It’s no small thing to bifurcate
    your production JavaScript assets to cater to both legacy and modern browsers—but
    you’re only halfway there. You’ll still need to construct markup in order to serve
    these bundles to the correct browsers.


    ![Two visualizations of a project’s webpack bundle. The top bundle includes transforms
    and polyfills required for legacy browsers and comes in at 68.48 KiB. The bottom
    bundle requires little to none of those things and is 60 percent smaller at 26.75
    KiB.](image/7.png)


    Fig 5.8: Two visualizations of a project’s webpack bundle. The top bundle includes
    transforms and polyfills required for legacy browsers and comes in at 68.48 KiB.
    The bottom bundle requires little to none of those things and is 60 percent smaller
    at 26.75 KiB.


    ### The `module`/`nomodule` pattern


    We don’t think much about the `<script>` element. We slap in an `src`, maybe tinker
    with `defer` or `async` attributes, and get rolling. When we bundle and serve
    two different versions of our JavaScript, though, there’s a new approach that
    demands our attention: the `module`/`nomodule` pattern.


    This pattern offers two parallel ways to serve JavaScript:


    1.  We can target browsers that support ESM—and by association, a host of other
    modern JavaScript language features—by setting the `<script>` element’s `type`
    attribute value to `module`.


    2.  We can indirectly target browsers that don’t support ESM and other modern
    features by applying an attribute of `nomodule` on `<script>` elements.


    We can then combine these two patterns:


    ```html

    <!-- Serve modern bundles -->

    ```


    ```html

    <script type="module" src="/js/app.mjs"></script>

    ```


    ```html

    <!-- Serve legacy bundles -->

    ```


    ```html

    <script nomodule defer src="/js/app.js"></script>

    ```


    This achieves the goal of differential serving by relying on two standardized
    behaviors:


    1.  Browsers won’t download scripts with `type` attribute values they don’t recognize.
    In this case, modern browsers will download scripts served with a `type` attribute
    value of `modern`, but legacy browsers won’t.


    2.  Inversely, legacy browsers don’t recognize the `nomodule` attribute, so they’ll
    download scripts that use it. However, modern browsers *do* recognize `nomodule`,
    so they’ll skip scripts with that attribute.


    Even so, some browsers don’t get this pattern right. Some browsers have issues
    where both bundles are downloaded. Some even execute both bundles ([http://bkaprt.com/rjs39/05-26](http://bkaprt.com/rjs39/05-26)).
    You have options, though:


    1.  Because browsers that don’t follow this pattern correctly will eventually
    fade out of use, you might find these suboptimizations acceptable.


    2.  If double-fetching of scripts for even a tiny sliver of your website’s visitors
    isn’t acceptable, you can rely on a script-injection pattern that checks for browser
    support of the `<script>` element’s `nomodule` attribute ([http://bkaprt.com/rjs39/05-27](http://bkaprt.com/rjs39/05-27)).


    3.  If neither option is acceptable, you could opt for a server-side approach.
    One method relies on user agent sniffing via the `browslist-useragent` package
    ([http://bkaprt.com/rjs39/05-28](http://bkaprt.com/rjs39/05-28)), which itself
    relies on Can I Use’s compatibility data ([http://bkaprt.com/rjs39/05-29](http://bkaprt.com/rjs39/05-29)).

