    ## 观察者 API (Observer APIs)


    - *你现在看见了：如何使用 IntersectionObserver 进行延迟、懒加载和操作》，作者 Denys Mishunov ([`bkaprt.com/rjs39/08-09`](http://bkaprt.com/rjs39/08-09))

