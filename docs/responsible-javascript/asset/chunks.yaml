    ## Getting a Head Start\n\nIf your website relies heavily on JavaScript, the obstinate\
    \ nature of networks means that the latency involved with requesting scripts will\
    \ prolong the startup phase. To get ahead of this whole mess and alleviate the\
    \ pain that comes with high-latency environments, we can employ one (or more)\
    \ of a few techniques. In short, the sooner we can fetch those scripts, the faster\
    \ the browser can process them.\n\n### Self-hosting: One boringly effective trick\n\
    \nLoading performance is all about connections, and there’s an elaborate dance\
    \ that happens when browsers open connections to web servers (Fig 4.2):\n\n1.\
    \ A domain must be resolved to the web server’s IP address through a `DNS lookup`.\n\
    2. Most web servers communicate over the `transmission control protocol` (`TCP`).\
    \ `TCP` connections take time to establish, and both the `TCP handshake` and the\
    \ `slow start` factor into how quickly a web server can respond ([http://bkaprt.com/rjs39/04-08](http://bkaprt.com/rjs39/04-08)).\n\
    3. If `HTTPS` is involved, `transport layer security` (`TLS`) negotiation will\
    \ also take time.\n\n`HTTP/3` reduces the latency involved in connection and `TLS`\
    \ negotiation. While that’s great, there will always be some latency, `HTTP/3`\
    \ or otherwise. That’s why self-hosting is a boringly effective performance enhancement\
    \ not just for JavaScript but for all asset types.\n\n![A table in Chrome’s developer\
    \ tools showing latency times for stages of connection: stalled, DNS lookup, initial\
    \ connection, and secure socket layer.](image/4.2.png)\n\nFig 4.2: The latency\
    \ involved in various stages of connecting to a web server as shown in the network\
    \ tab of Chrome’s developer tools.\n\nSelf-hosting is worth discussing since it’s\
    \ not uncommon to see assets loaded from public CDNs like `cdnjs` ([http://bkaprt.com/rjs39/04-09](http://bkaprt.com/rjs39/04-09)).\
    \ Although public CDNs can be useful because they remove the burden of hosting\
    \ popular libraries and frameworks, you must weigh the latency cost of adding\
    \ another cross-origin—that is, any web server other than your own—against hosting\
    \ your own assets (Fig 4.3).\n\n![WebPageTest’s connection view listing all origins\
    \ used in a website. Each row represents a separate connection, displaying DNS\
    \ lookup (teal), connection (orange), and TLS negotiation time (purple).](image/4.3.png)\n\
    \nFig 4.3: WebPageTest’s connection view listing all origins used in a website.\
    \ Each row represents a separate connection, displaying DNS lookup (teal), connection\
    \ (orange), and TLS negotiation time (purple).\n\nA common misconception is that\
    \ public CDNs provide an additional performance benefit due to `shared caching`.\
    \ Shared caching is the idea that if you visit a website that requests, say, a\
    \ copy of `React` hosted on a public CDN, that same copy of `React` should be\
    \ pulled from the browser cache if another website requests it from the same location.\n\
    \nWhile that would be a welcome optimization in theory, it doesn’t exist in practice\
    \ because browsers key the primary origin—that is, your web server—against requests\
    \ for cross-origin resources, resulting in a cache miss ([http://bkaprt.com/rjs39/04-10](http://bkaprt.com/rjs39/04-10)).\
    \ There’s no upside for using public CDNs from a performance respective.\n\nWhere\
    \ JavaScript is concerned, self-hosting shortens the loading phase by reducing\
    \ latency, meaning the browser can get on with the processing phase sooner.\n\n\
    ### Greasing the skids with resource hints\n\nThere are situations in which self-hosting\
    \ may not always be practically possible, and that’s where `resource hints` can\
    \ help reduce latency for cross-origin assets. `Resource hints` use the `<link>`\
    \ element to guide the browser to fetch resources or open connections to cross-origins\
    \ earlier. Their use is instrumental in speeding up JavaScript loading so that\
    \ websites can become interactive faster.\n\n#### Reduce connection latency\n\n\
    Source order describes the order of elements in your HTML, and its importance\
    \ can be overlooked when it comes to JavaScript. Browsers stream HTML and chunk\
    \ that parsing work into manageable pieces. Because of this, references to scripts\
    \ located at the end of the markup won’t be discovered until the browser parses\
    \ them. When those scripts live on cross-origins, this adds significant latency\
    \ to cross-origin asset (Fig 4.4).\n\nWith `preconnect`, however, we can open\
    \ cross-origin connections as soon as the server starts HTML by putting resource\
    \ hints in the document `<head>`:\n\n```html\n<link rel=\"preconnect\" href=\"\
    https://syndication.twitter.com/\">\n<link rel=\"preconnect\" href=\"https://pbs.twimg.com/\"\
    >\n<link rel=\"preconnect\" href=\"https://www.google-analytics.com/\">\n```\n\
    \nThis improves performance by negotiating connections to cross-origin assets\
    \ sooner, rather than waiting for the browser to discover them in due course (Fig\
    \ 4.5).\n\n![Table containing a timeline for the assets requested by a page broken\
    \ down by domain, with the type of assets requested by each domain color-coded.](image/4.4.png)\n\
    \nFig 4.4: WebPageTest’s connection view for a website. Rows two and three are\
    \ for cross-origins where connections aren’t established until the assets they\
    \ provide are discovered by the HTML parser.\n\nWhen self-hosting assets isn’t\
    \ possible, `preconnect` is an alternative that can take a bite out of the latency\
    \ incurred by loading cross-origin assets. It’s an effective and easy performance\
    \ optimization that has more impact than you might think.\n\n![Table containing\
    \ a timeline for the assets requested by a page broken down by domain, with the\
    \ type of assets requested by each domain color-coded.](image/4.5.png)\n\nFig\
    \ 4.5: WebPageTest’s connection view showing connection negotiation for cross-origin\
    \ requests occurring earlier due to `preconnect` resource hints, resulting in\
    \ roughly a three-second improvement in load time.\n\n#### Preload critical JavaScript\n\
    \nThe *critical path* is a concept in web performance that describes the number\
    \ of requests needed to start rendering the core content of a page ([http://bkaprt.com/rjs39/04-11](http://bkaprt.com/rjs39/04-11)).\
    \ `HTML` and `CSS` files are typical examples of requests that are on the critical\
    \ path, since you don’t have much of a page without them (Fig 4.6).\n"
