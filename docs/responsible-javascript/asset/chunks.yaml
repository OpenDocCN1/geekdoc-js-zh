    JavaScript 引擎会尽力将工作拆分为可管理的块，但长任务并不总是可以避免的。因此，这些工作最好留给单独线程处理。


    为了演示如何通过 web worker 从网络获取图像并从中提取 Exif 数据，我创建了一个名为 `JPEG Metadata Extractor` 的演示应用（[`bkaprt.com/rjs39/06-19`](http://bkaprt.com/rjs39/06-19)）来恰好完成这些工作。


    演示应用的仓库包含两个标签。第一个（[`bkaprt.com/rjs39/06-20`](http://bkaprt.com/rjs39/06-20)）在主线程上执行所有的
    `fetch` 和元数据提取（图 6.8）。第二个（[`bkaprt.com/rjs39/06-21`](http://bkaprt.com/rjs39/06-21)）执行与第一个相同的工作，只是它在
    worker 线程上执行了大部分工作（图 6.9）。


    ![显示在主线程上发生的图像获取和 Exif 元数据提取。结果是在主线程上发生了两个长任务，总阻塞时间接近 150 毫秒。](img/6.8.png)


    图 6.8：显示在主线程上发生的图像获取和 Exif 元数据提取。结果是主线程上发生了两个长任务，总阻塞时间接近 150 毫秒。


    ![主线程活动（顶部）和 web worker 活动（底部）。虽然表单提交和 Exif 标记插入必须在主线程上进行，但图像获取和 Exif 提取工作在单独线程上进行，减少了主线程的阻塞时间。(image/6.9.png)


    图 6.9：主线程活动（顶部）和 web worker 活动（底部）。虽然表单提交和 Exif 标记插入必须在主线程上进行，但图像获取和 Exif 提取工作在单独线程上进行，减少了主线程的阻塞时间。


    演示应用的界面接受 JPEG URL，该 URL 通过 `fetch` 获取。即使我们使用 web worker，*某些*事情仍然必须主线程上完成：


    * 在表单上注册 `submit` 事件监听器

    * 验证表单输入

    * 将图像 URL 传递给 web worker


    之后的几乎所有工作都可以在 web worker 中完成，它位于一个名为 `exif-worker.js` 的单独脚本中。在主线程上这样注册 web worker：


    ```

    const exifWorker = new Worker("/js/exif-worker.js");

    ```


    然后，我们在 web worker 中使用 `importScripts`函数导入 `ExifReader`（[`bkaprt.com/rjs39/06-22`](http://bkaprt.com/rjs39/06-22)）。`importScripts`
    接受一个 URL 字符串来导入用于 worker 作用域的外部脚本：


    ```

    importScripts("/js/exifreader.js");

    ```


    某些浏览器中，如果你以模块模式注册 web worker，可以使用静态 `import` 语法来导入脚本（[`bkaprt.com/rjs39/06-23`](http://bkaprt.com/rjs39/06-23)）。不过，根据浏览器的支持，你可能不得不坚持
    `importScripts`。


    #### 主线程与 worker 线程之间的通信


    Web workers 只有在它们与主线程之间可以双向通信时才有用。

