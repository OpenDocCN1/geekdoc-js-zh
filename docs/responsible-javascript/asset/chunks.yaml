  trans: "\n\n![Weekly Timber 网站头部、内容区域和页脚区域的颜色表示图。网站的头部（蓝色）和页脚（红色）区域从 `Cache` 接口提供，并与从网络请求的内容（黄色）区域组合成一个单一的响应。](img/4.18.png)\n\
    图 4.18：Weekly Timber 网站头部、内容区域和页脚区域的颜色表示图。网站的头部（蓝色）和页脚（红色）区域从 `Cache` 接口提供，并与从网络请求的内容（黄色）区域组合成一个单一的响应。\n\
    \n```javascript\nself.addEventListener(\"fetch\", event => {\n```\n\n```javascript\n\
    \ // Prior code omitted...\n```\n\n```javascript\n if (request.mode === \"navigate\"\
    ) {\n```\n\n```javascript\n // Navigation preload/fetch() fallback code omitted...\n\
    ```\n\n```javascript\n const { done, response } = await mergeResponses([\n```\n\
    \n```javascript\n caches.match(\"/partial-header\"),\n```\n\n```javascript\n networkContent,\n\
    ```\n\n```javascript\n caches.match(\"/partial-footer\")\n```\n\n```javascript\n\
    \ ]);\n```\n\n```javascript\n event.waitUntil(done);\n```\n\n```javascript\n event.respondWith(response);\n\
    ```\n\n```javascript\n }\n```\n\n```javascript\n});\n```\n\n这是我们 service worker\
    \ `fetch` 事件代码的最后一部分。虽然它很简洁，但影响丝毫不小：\n\n1. `mergeResponses` 是一个自定义函数，它接收一个响应数组并将其合并为一个。数组的第一项和第三项是通过通过\
    \ `Cache` 接口的 `match` 方法获取的预缓存头部和页脚标记。第二个项是来自网络的内容标记。\n\n2. `mergeResponses` 的内部实现太复杂了，不便在此介绍，但源代码可以在\
    \ GitHub 上找到（[`bkaprt.com/rjs39/04-28`](http://bkaprt.com/rjs39/04-28)）。简而言之，`mergeResponses`\
    \ 接收响应数组并使用 `ReadableStream` API 尽快开始向浏览器流式传输内容（[`bkaprt.com/rjs39/04-29`](http://bkaprt.com/rjs39/04-29)）。完成后，它返回一个包含两个属性的对象：一个在响应组合完成后解析的\
    \ promise（`done`），以及我们发送到浏览器的组合后的响应（`response`）。\n\n但在安装它之前，我们对这个 service worker\
    \ 的所有工作都无济于事，而安装正是整个流程的最后一部分。\n\n### 安装 service worker\n\n虽然安装 service worker\
    \ 是这一系列活动中最容易的部分，但我们确实需要注意以下几点：\n\n* Service worker 支持——虽然非常棒了（[`bkaprt.com/rjs39/04-30`](http://bkaprt.com/rjs39/04-30)），但并不是百分之百保证。做一些功能检测（feature-checking）以避免在旧版浏览器上出现错误。\n\
    \n* 因为 service worker 可能会为其他页面预缓存内容，所以我们想确保在页面加载之前不要注册它。\n\n这些问题并不是非常困难。假设我们的\
    \ service worker 命名为 `sw.js` 且位于根目录下，我们可以在每个页面的底部添加这段小小的脚本：\n\n```html\n<script>\n\
    ```\n\n```javascript\n window.addEventListener(\"load\", () => {\n```\n\n```javascript\n\
    \ if (\"serviceWorker\" in navigator) {\n```\n\n```javascript\n navigator.serviceWorker.register(\"\
    /sw.js\");\n```\n\n```javascript\n }\n```\n\n```javascript\n });\n```\n\n```html\n\
    </script>\n```\n\n通过等待到 `window` 的 `load` 事件，我们减少了 service worker 及其预缓存任何内容与关键资源竞争带宽的可能性。通过检查\
    \ `navigator` 对象中的 `serviceWorker` 命名空间，我们确保不会运行任何可能在旧版浏览器上引起问题的代码。\n\n我们已经深陷\
    \ service worker 这一事中了，但我们终于停下来了。是的，这有很多需要吸收和应用，而且这只是针对一个网站的一个 service worker\
    \ 示例。尽管如此，那个 service worker 为 Weekly Timber 带来了不可置信的感知性能收益：\n\n| | 无 service worker\
    \ | 流式 service worker | 速度提升 |\n| --- | --- | --- | --- |\n| 中位数 FCP (ms) | 767\
    \ | 159 | 79.3% |\n| 中位数 LCP (ms) | 853 | 466 | 54.6% |\n| p95 FCP (ms) | 3027\
    \ | 1497 | 45.4% |\n| p95 LCP (ms) | 3357 | 1764 | 47.5% |\n\n更好的是，service workers\
    \ 是渐进增强（progressive enhancement）的完美示例。它们并没有取代浏览器内置的导航行为，而是以一种可定制且加性的方式对其进行改进。这正是负责任使用\
    \ JavaScript 的精髓所在。\n\n## 快速、弹性且用户优先\n\n如今，通过节制地使用 JavaScript 来构建引人胜的用户体验需要巨大的努力，但这是可能的。其中一些努力涉及到“花招”，即我们依赖资源提示（resource\
    \ hints）等不明显的方法来掩盖页面资产的延迟和加载时间。\n\n其他努力涉及更直接的行动，例如通过代码分割（code splitting）缩短启动时间，或尊重用户偏好。在某些情况下，我们可能需要使用不仅能减少流量还能提供离线访问的\
    \ service worker。\n\n工具链（toolchains）——即用于转换和优化我们的 JavaScript 的工具集合——可能需要艰巨的努力，无论是有效使用它们还是理解其影响。虽然你不需要本章提到的任何工具就能构建快速且愉悦的用户体验，但你可能会在工作中遇到它们。如果我们为工具链投入精力，我们需要确保它是值得的。\n\
    \n# 5. 导航工具链\n\n![](img/6.png)\n\n杀蝉黄蜂对初学者来说会引起近乎失禁的恐惧。它们体型惊人（图 5.1）。正如它们的名字一样，必须如此。但它们仍然比蝉小，这意味着一旦它们捕获并麻痹了它们，物理上无法从地面起飞！如果它们足够幸运能在空中抓到蝉，就必须把猎物拖到树上。这是这些黄蜂稳定飞行的唯一方式。这需要巨大的努力，但回报丰厚。\n\
    \n## 任务运行器\n\n让我们从任务运行器（task runners）开始进入这个领域。任务运行器是线性的 JavaScript 构建工具，不分析代码。它们通常用于压缩、合并并通过其他方式优化脚本目录（或其他文件），以生成生产环境的资产（图\
    \ 5.2）。\n\n"
- fmt: "\nTask runners are attractive because they’re straightforward: you have a\
    \ thing you want to do to some files, so you point the task runner at the files\
    \ to do the thing. This linearity results in a low learning curve and quick adoption.\
    \ For example, the A11Y Project relies on a popular task runner called `gulp.js`\
    \ ([http://bkaprt.com/rjs39/05-03](http://bkaprt.com/rjs39/05-03)), and they even\
    \ promote it in their technology statement, citing “ease of set up [sic]” and\
    \ “approachability for beginners” ([http://bkaprt.com/rjs39/05-04](http://bkaprt.com/rjs39/05-04)).\n\
    \nTask runners can be used anywhere, and they’re an especially great fit for websites\
    \ that don’t rely heavily on JavaScript. But they aren’t for every project. Since\
    \ they apply broad optimizations to JavaScript files without analyzing their contents,\
    \ they can’t optimize your code in the more sophisticated ways that other tools\
    \ can. That’s where bundlers come in.\n\n## Bundlers\n\nUsing a task runner for\
    \ a website that depends on JavaScript to function can lead to a lot of duplicated\
    \ or unused code being served across different pages. If your project relies heavily\
    \ on JavaScript, a bundler may be a better fit.\n\nThe primary tradeoff between\
    \ task runners and bundlers is ease of use. Where task runners are easier to learn\
    \ and set up, bundlers can get downright byzantine. I have personally observed\
    \ `webpack` ([http://bkaprt.com/rjs39/05-05](http://bkaprt.com/rjs39/05-05)) configurations\
    \ of more than one hundred lines—sometimes many more. Other bundlers, such as\
    \ `Rollup` ([http://bkaprt.com/rjs39/05-06](http://bkaprt.com/rjs39/05-06)) or\
