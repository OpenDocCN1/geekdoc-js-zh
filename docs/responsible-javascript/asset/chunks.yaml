    \ Try again in a minute?\");\n```\n\n```\n this.enableButton();\n```\n\n```\n\
    \ });\n```\n\n```\n }\n```\n\n```\n }\n```\n\n```\n}\n```\n\nThis method is a\
    \ busy one, but here’s the play-by-play:\n\n1. `event.preventDefault()` is called\
    \ to keep the form from submitting to the server, which lets the web component\
    \ handle the subscription functionality.\n2. The Subscribe button is disabled.\n\
    3. A `fetch` call hits the server with the subscribee ID in a stringified JSON\
    \ payload as a POST request. From there, the server processes the subscription\
    \ request.\n4. If the request succeeds, the button’s text content is updated to\
    \ reflect that state. Otherwise, a basic `alert` announces that there was a problem.\
    \ The button is reenabled after the `fetch` call finishes regardless of its success.\n\
    \nThat’s a wrap! After all that work to try to create a progressively enhanced\
    \ experience, you couldn’t be blamed for wondering what it was all for—but rest\
    \ assured, the work has a purpose beyond getting a little ol’ button to do its\
    \ thing in the most minimalist way possible.\n\n### The rewards of progressive\
    \ enhancement\n\nWhen it comes to web development, it can be easier to build functionality\
    \ solely on the client side than it is to provide that same functionality from\
    \ the server and then progressively enhance it with JavaScript.\n\nYet—and I can’t\
    \ be more emphatic when I say this—it is worth it. When you go this way, you’re\
    \ doing a hell of a lot to help people out:\n\n* Redundant functionality gives\
    \ people a safety net in situations where JavaScript is either turned off or fails\
    \ to load. You cannot control how people visit your website, and progressive enhancement\
    \ creates a good fallback.\n* Progressive enhancement raises guardrails that force\
    \ you to think more carefully about how you use JavaScript by increasing the role\
    \ of the server in providing functionality. The end result is a more resilient\
    \ user experience.\n\nFor what it’s worth, you don’t need Web Components to progressively\
    \ enhance your website—this was a mere example of how they can be used in pursuit\
    \ of that goal. But you should begin every project with that same sense of minimalism\
    \ to set you up for the best outcomes early on, and then layer on flashier tactics\
    \ should the need arise.\n\nIt’s only from minimalism that we’re going to build\
    \ a web that relies less on JavaScript when it matters most. If we start with\
    \ heavy and prescriptive frameworks out the gate, we can’t get there. Don’t move\
    \ fast and break things; move thoughtfully and act with care.\n\n## Going Forward\n\
    \nIt’s a hard row to hoe when it comes to building sustainably for the web. But\
    \ if we prioritize the role of the server in sending markup, employ effective\
    \ caching, use the web platform when possible, and embrace progressive enhancement,\
    \ we can avoid shipping costly frameworks to the client, and avoid the potentially\
    \ expensive overhead they can incur during both startup and runtime.\n\nIt may\
    \ seem like the preferable thing to move as fast as possible—and indeed, it may\
    \ be, if the goal is to get to market before anyone else—but these choices have\
    \ consequences beyond the present moment. Your early technology choices may become\
    \ fossilized into your project, making it exceedingly difficult to remedy the\
    \ problems they cause down the line. It’s one thing to ship code early and often,\
    \ but it’s an entirely different endeavor to deal with the user-hostile consequences\
    \ of that philosophy.\n\nSustainable architectures should be about making the\
    \ web more usable for more people. When architectures expand access rather than\
    \ inhibit it, we create experiences that are more resilient and fault tolerant.\
    \ As we continue together, we’ll further explore the nooks and crannies of what\
    \ this good work entails.\n\n# Chapter 3. Measuring and Assessing JavaScript Performance\n\
    \n![](image/4.png)\n\nIf you’ve spent enough time outdoors, you know about horseflies.\
    \ They’re dipteran terrors that land on warm-blooded creatures—horse and human\
    \ alike—and use their scissorlike jaws to feed on blood.\n\nThe horse guard wasp\
    \ kills horseflies, and is a boon to farmers who keep livestock. Even better,\
    \ livestock aren’t at all bothered by the wasps; they accommodate them because\
    \ their presence is a benefit (Fig 3.1).\n\n![Close-up of a striped black and\
    \ gold horse guard wasp.](image/3.1.png)\n\nFig 3.1: The horse guard wasp hunts\
    \ and kills horseflies that pester livestock. Photograph by Howard Ensign Evans,\
    \ Colorado State University, Bugwood.org ([http://bkaprt.com/rjs39/03-01](http://bkaprt.com/rjs39/03-01)),\
    \ CC BY 3.0 US ([http://bkaprt.com/rjs39/03-02](http://bkaprt.com/rjs39/03-02)),\
    \ via Wikimedia Commons.\n\nUsing JavaScript responsibly requires a level of vigilance\
    \ like that of the horse guard wasp, ceaselessly scanning its domain for pesky\
    \ horseflies. You must keep an eye on JavaScript and restrain its most detrimental\
    \ effects, as overreliance on it will drag your website’s user experience into\
    \ Slow Town. In this case, vigilance requires measuring and assessing your website’s\
    \ JavaScript situation.\n\nWhen we *measure* JavaScript performance, we want to\
    \ know three things:\n\n1. Is the page perceptibly fast and usable during startup?\n\
    2. If not, then what’s the problem?\n3. Does the main thread quiet down enough\
    \ after startup so that the page stays usable?\n\nIn the same way you can’t reliably\
    \ cut a piece of lumber to the right length without measuring first, we can’t\
    \ assess the impact of JavaScript in our websites and applications until we can\
    \ measure. ## Metrics: Your Key to Measuring JavaScript Performance\n\nWe all\
    \ rely on metrics in life. We check the outside temperature to make sure we’re\
    \ properly dressed for the weather. We (hopefully) watch the car’s speedometer\
    \ as we drive to avoid driving recklessly. We use blood panel results to inform\
    \ our lifestyle choices, such as changing our diet if our triglycerides are too\
    \ high.\n\nWeb performance metrics are similarly essential for making informed\
    \ decisions. They’re also among the many factors that affect how Google ranks\
    \ pages ([http://bkaprt.com/rjs39/03-03](http://bkaprt.com/rjs39/03-03)). Search\
    \ engines want to surface the best websites for a given query, and a poor user\
    \ experience interferes with that goal.\n\nWeb performance metrics can be categorized\
    \ in one of two ways:\n\n* **Lab metrics:** These metrics are gathered by synthetic\
    \ testing tools such as WebPageTest, Lighthouse, or your browser’s developer tools.\
    \ You can establish consistent baselines with them, which can be useful when you’re\
    \ trying to solve performance problems during development.\n* **Field metrics:**\
    \ These are gathered via in-browser JavaScript APIs from your website’s visitors,\
    \ and then transmitted to a remote data store for later analysis. Field metrics\
    \ are gold, because they tell the story of how your site’s performance is experienced\
    \ by actual people.\n\nKnowing which metrics are which helps you understand how\
    \ they apply to your work. Some metrics fall under both categories, while others\
    \ belong to one or the other. Let’s look at some of the most common aspects of\
    \ page—and JavaScript—performance that metrics can describe.\n\n### Painting\n\
    \nKey perceivable milestones that occur during page load are when bits of the\
    \ page are drawn to the screen. It’s the first clue we get that something’s happening.\
    \ Any time a browser draws pixels to the screen, we call that painting*—and there\
    \ are a whole bunch of paint metrics out there.\n\nJavaScript’s effects on paint\
    \ metrics often come down to how markup is rendered. Client-side rendering of\
    \ markup—an expensive process we covered in Chapter 2—can trigger paint events\
    \ later compared to initial markup sent by the server. This all is magnified by\
    \ the size of the scripts that render client-side markup, the speed of the network,\
    \ and how the scripts are delivered.\n\n#### First Paint and First Contentful\
    \ Paint\n"
