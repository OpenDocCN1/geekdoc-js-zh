    \ receives JavaScript assets.\n\n### Runtime performance\n\n*Runtime performance*\
    \ describes how responsive a page is to input once it appears in the browser.\
    \ When a page is persistently slow to respond to interactions, we say that page’s\
    \ runtime performance is poor.\n\nRemember all that talk about compression a bit\
    \ ago? Whatever is compressed must be decompressed. Browser developer tools reflect\
    \ this by reporting both the *transfer size* (presumably compressed) and the *actual\
    \ size* (decompressed) of assets (Fig 1.3).\n\n![The Network tab showing that\
    \ 459 assets were requested, compressed to 5.2 megabytes for transfer, and decompressed\
    \ to 13.6 megabytes.](image/1.3.png)\n\nFig 1.3: Google Chrome’s developer tools\
    \ summarize assets in the Network tab. From left to right are the total number\
    \ of requested assets, their transfer size (including compression), and their\
    \ actual (decompressed) size.\n\nIf this seems inconsequential, consider that\
    \ if a 200-kilobyte compressed JavaScript asset decompresses to 800 kilobytes,\
    \ the browser must process those 800 kilobytes of script! Processing JavaScript,\
    \ as you’ll see, is a whole other hornets’ nest.\n\n### The cost of processing\
    \  JavaScript\n\nThe drudgework of how browsers handle JavaScript isn’t so much\
    \ in the downloading but in the processing of it. Browser vendors constantly hack\
    \ away on JavaScript engines to improve their performance in ways we web developers\
