    在审阅这份手稿的准确性和质量时，我向许多才华横溢且知识渊博寻求了大量的帮助。我衷心感谢 Eric Bailey、Zach Leatherman、Brandon
    Gregory、Yoav Weiss、Houssein Djirdeh、Shubhie Panicker、Olu Niyi-Awosusi 以及 Eric
    Portis，他们提供的宝贵反馈使这本书成为了它所能达的最佳版本。


    我还要感谢 Paul Calvano，他无私地投入了自己的时间和专业知识来协助查询 HTTP Archive 的海量数据集；感谢 Tim Kadlec 在
    2020 版 HTTP Archive 年鉴工作中所付出的努力；以及 Matt Hobbs，他在 GOV.UK 网站的工作为我们理解浏览器使用与 JavaScript
    特性在这一关键的政府基础设施中如何交织提供了宝贵的见解。


    此外，我还要感谢 Tatiana Mac、Mattia Menchetti 和 Kyle Rush，允许我在书中引用并使用了他们的部分材料。


    此本书的序言作者 Estelle Weyl 是我一位亲爱的朋友和同事，她的工作和文档为我撰写如此规模的书籍铺平了道路。很有可能如果你在 MDN 上读过某些内容，她在其中某个地方曾付过一份力。我想感谢她对这本书的由切支持鼓励，同时也感谢
    Eric Bailey、Olu Niyi-Awosusi、Katie Sylor-Miller 和 Suz Hinton 对本书的鼎力认可。


    最后，我要感谢 Katel LeDû 和 Jeffrey Zeldman，让我有机会在 A Book Apart 出版社的旗下编写这本书。这家出版社的作品是如此开创性，对我个人也产生了深远的影响。我无法表达对这次机会的感激之情。


    # 资源


    这本书永远无法涵盖你负责任地使用 JavaScript 所需要知道的所有知识。那需要一卷巨著才能做到，而 A Book Apart 并不是专门做巨著的出版社。如果你发现自己对书中未详尽描述的某些内容感兴趣，那么这个分类列表将派上用场。


    ## 无障碍辅助 (Accessibility)


