  trans: "\n\n我们必须努力构建触及每个人的网站，同时通过更审慎地使用 JavaScript 来提供高质量的体验。以这种方式构建 Web 应用可以最大限地扩大你的覆盖范围——并扩展访问性。\n\
    \n## Web 的未来由我们负责\n\n网络访问并非奢侈品，而是互联世界中运行的基础要素。这意味着我们必须意识到，我们的局限性不是静态的。虽然我们希望在工作中使用更多\
    \ JavaScript——而且我们确实一直在这么做——但将其作为首选方案会产生后果。\n\n网络传输速度是有限的，主线程能够承受的工作也是有限的。你向管道发送的\
    \ JavaScript 越多，目标设备就会变得越慢，可用性的承诺就会消失得越快。这产生了一种挫败感，而只有我们才能解决它。\n\n当我们从这一章继续前进时，让我们放弃那种墨守成规（sphexishness），关注真实的人是如何体验\
    \ Web 的。我们的用户依赖于 Web 提供的关键设施。现在我们已经掌握了 JavaScript 如何影响性能，就可以讨论我们的架构选择如何帮助或损害用户体验了。正如我们将学到的，我们不需要依赖\
    \ JavaScript 作为交互的主要驱动力；相反，让我们将其潜力视为一种增强手段。\n\n# 第 2 章，从开始就快\n\n![](img/3.png)\n\
    \n在纸蜂雌王建造巢穴之前，它会先建造一个名为 `petiole`（柄部）的基础支撑结构，这是一个支撑整个巢穴的纤维茎（图 2.1）。柄部足够耐用，可以在各种不利条件下支撑巢穴，甚至在蚁群灭绝很久之后也是。这是一个简单、可持续且至关重要的结构，在蚁群的生存中起着作用。\n\
    \n就像纸蜂巢没有柄部就无法存在一样，任何网站——无论其架构如何或使用了多少 JavaScript——如果没有 Web 服务器都无法存在。当网站依赖后端首先提供标记和功能时，它们会表现出特别的韧性。\n\
    \n然后，就像黄蜂通过额外的柄将巢穴扩展成连接的层级一样，我们可以决定何时适合使用框架和库来扩展我们的工作。这种增量式的方法限制了 JavaScript 的作用，确保了更流畅、更具韧性的用户体验，并适用于更多环境。\n\
    \n![三只纸蜂倒挂着并抓着它们模块化巢穴的特写，巢穴悬挂在坚硬的柄（petiole）上。](img/2.1.png)\n\n图 2.1：纸蜂巢由被称为 `petiole`（柄部）的基础结构悬挂。由作者拍摄。\n\
    \n## 只取你所需\n\n在我们的行业中，我们习惯于使用现成的解决方案来简化 Web 开发。虽然依赖框架和库可能认为更容易，但这样做等同于认同了他人关于如何构建\
    \ Web 应用的愿景。他们的方法与你项目的独特需求之间潜在的不一致性，极可能会导致沉重的性能成本和糟糕的用户体验。\n\n框架和库的历史作用是我论点中心的核心：当\
    \ `Prototype` 和 `jQuery` 等工具兴起时，迫切需要桥接不同浏览器 API 实现之间的鸿沟。得益于 Web 标准的普及，在不依赖此类临时补救措施的情况下，实现一致性变得容易得多——前提是我们能打破这种习惯。\n\
    \n### 平台优于库\n\nJavaScript 臃肿渗透到项目的一种方式是通过不必要的工具库。`Lodash` 就是其中一个库，它在 JavaScript\
    \ 本身无法方便地完成 `Lodash` 工具函数所能的功能期间获得了关注。如今，原生 JavaScript 就可以取代 `Lodash`提供的部分功能。\n\
    \n`Lodash` 的一个用例是将函数映射到数组的每个成员以转换其内容。例如，你可以将用于页面资源的 URL 字符串数组转换为标记，然后将结果合并成一个字符串：\n\
    \n```javascript\nimport _ from \"lodash\";const scripts = [\"/js/scripts.js\"\
    , \"/js/vendors.js\"];\n```\n\n```javascript\nconst markupArray = _.map(scripts,\
    \ script => {\n```\n\n```javascript\n return '<script src=\"${script}\"><\\/script>';\n\
    ```\n\n```javascript\n});\n```\n\n```javascript\nconst markup = _.join(markupArray,\
    \ \"\");\n```\n\n虽然 `Lodash` 完成得，但这段代码可以更新为使用浏览器提供的 JavaScript 功能：\n\n```javascript\n\
    const scripts = [\"/js/scripts.js\", \"/js/vendors.js\"];\n```\n\n```javascript\n\
    const markup = scripts.map(script => {\n```\n\n```javascript\n return '<script\
    \ src=\"${script}\"><\\/script>';\n```\n\n```javascript\n}).join(\"\");\n```\n\
    \n浏览器提供的 JavaScript 特性已经足够让你在没有工具库的情况下几乎完成任何事情。例如，你可以：\n\n* 使用 `Array.prototype.filter`\
    \ 过滤数组 ([`bkaprt.com/rjs39/02-01`](http://bkaprt.com/rjs39/02-01))；\n* 使用 `Array.prototype.reduce`\
    \ 将数组归约为单值 ([`bkaprt.com/rjs39/02-02`](http://bkaprt.com/rjs39/02-02))；\n* 使用\
    \ `Array.prototype.concat` 合并两个数组 ([`bkaprt.com/rjs39/02-03`](http://bkaprt.com/rjs39/02-03))；以及\n\
    * 分别使用 `Object.keys`、`Object.values` 或 `Object.entries` 获取对象的键、值或两者作为数组 ([`bkaprt.com/rjs39/02-04`](http://bkaprt.com/rjs39/02-04))。\n\
    \n这只是冰山一角！你有大量的 JavaScript 方法可以使用，它们在几乎每个广泛使用的浏览器中都可用 ([`bkaprt.com/rjs39/02-05`](http://bkaprt.com/rjs39/02-05))。批判性地思考你试图实现的目标，并尝试先用原生\
    \ JavaScript 解决问题，然后再求工具库，这是值得的。\n\n### 警惕从众谬误\n\n当开发者社区投入一个框架时，它感觉就像是正确的选择——安全的选择。这就是从众谬误，在评估客户端框架时这是一种极具吸引力的力量。即使每个人都在使用它，从用户体验的角度来看，它仍然可能是不安全的。诀窍在于知道一个工具是否适用于该任务。\n\
    \n`React` 是一个流行的 JavaScript 框架，强调组件化和简化状态管理。它由 Facebook 开发，并受到活跃且忠诚的用户群的强力支持。State\
    \ of JS 2020 调查显示，在 23,765 名受访者中，70% 的人使用了 `React` ([`bkaprt.com/rjs39/02-06`](http://bkaprt.com/rjs39/02-06))。调查还显示：\n\
    \n* 70.8% 的受访者认同为白人；\n* 91.1% 为男性，5.8% 为女性，0.9% 为非二元性别 / 第三种性别；\n* 超过半数（52.6%）的人将自己的\
    \ JavaScript 精通程度评为专家级，近一半的人自评为中级（22.7%）或高级（22.3%）水平。相比之下，只有 2.3% 的人自评为初级水平。\n\
    \n这些结果清楚地说明，一个极度活跃的、自评 JavaScript 水平高于平均水平的白男性开发者群体在强力主张 `React`。他们还主张有利于 JavaScript\
    \ 密集型客户端架构的开发者体验，而这种架构在不利条件下容易出现性能下降——这一部分开发者自己远不太可能经历这种情况，从而在他们的工作中强化并反映了他们的偏见。\n\
    \n考虑一下这一点，正如性能工程师 Tim Kadlec 在 2020 年对 JavaScript 框架的分析中发现的那样，使用 `React` 的网站发送的\
    \ JavaScript 比所有网站的中位数多出 40% ([`bkaprt.com/rjs39/02-07`](http://bkaprt.com/rjs39/02-07))。\n\
    \n"
- fmt: '

    Similarly, Kadlec also found that websites using React tended to use more device
    memory than those using other frameworks at most percentiles ([http://bkaprt.com/rjs39/02-08](http://bkaprt.com/rjs39/02-08)).
    These choices carry consequences to the performance—and, therefore, to the user
    experience—that we shouldn’t be quick to dismiss.


    This is a predictable outcome of the bandwagon fallacy. In large corporate development
    teams, key decision-makers often adopt technologies such as React because it conforms
    to their expectations of what makes a good developer experience rather than centering
    the needs of their users.


    This is not to say React isn’t useful or doesn’t have its place, but rather that
    what works well for Facebook won’t work well for every app. This is true of any
    client-side JavaScript framework. No amount of bandwagoning nullifies that bare
    fact. We must consider the framework’s overhead—that is, the performance cost
    it incurs to do its job—to avoid inadvertently restricting access rather than
    expanding it.


    Frameworks don’t doom us to build shitty websites, but to use them is to accept
    a certain amount of overhead you can never optimize away. You must step lightly,
    particularly since the ecosystem of installable plugins and off-the-shelf components
    available to such architectures can further compound their user-experience problems.


    A client-side JavaScript framework’s popularity or ease of use doesn’t automatically
    beget a good user experience. They’re conveniences for developers first. Well-worn
    technologies and direct use of web-platform APIs are often a more usercentric
    starting point.


    For example, Notist is a website for conference speakers to showcase their talks
    (Fig 2.2). It runs on PHP and the Apache HTTP Server. While not as attractive
    for developers accustomed to modern full-stack JavaScript development, it runs
    on time-tested technologies that have delivered on reliability and speed for decades.


    ![Notist page for developer and speaker Ire Aderinokun, with a photograph, bio,
    and thumbnails for recent presentations.](image/2.2.png)


    Fig 2.2: Notist is a website for conference speakers that eschews heavy client-side
    architectures in favor of server-driven functionality by way of a PHP backend
    with minimal client-side JavaScript.


    Notist’s architecture also encourages a strong separation of server-side and client-side
    code. While this can feel like an impediment to productivity, it raises guardrails
    that guide developers to shipping *less* client-side code. This helps Notist deliver
    a great user experience that boots quickly with minimal main-thread work incurred
    by JavaScript (Fig 2.3).


    ![Waterfall chart of load times for various pieces of content, showing interactivity
    at 1.4 seconds.](image/2.3.png)


    Fig 2.3: A WebPageTest waterfall of a Notist user profile loading on a Moto G4
    device powered by a WebPageTest instance in São Paulo, Brazil. The page’s largest
    piece of content paints within 1.5 seconds and is interactive immediately after
    its first paint.


    Users *do not care* what technologies you use. They only care that a website is
    fast and accessible. That’s the core of what responsible usage of JavaScript is
    all about: prioritizing user experience over developer experience.


    ### Document your architecture choices


    Once you’ve settled on an architecture that prioritizes a good user experience,
    drafting a technology statement should be one of your next steps. A *technology
    statement* is a document that lays out the technology choices for a project and
    the rationale behind them. It’s like a code of conduct, but rather than setting
    expectations for the behavior of community members, it sets forth the technical
    requirements for prospective contributors.


    Whether a project is open source or proprietary, you need a technology statement
    that establishes the ground rules for contributions. Otherwise, when those excitable
    new contributors come along, their enthusiasm for their own preferred tools and
    methods can conflict with what’s best for the project.


    The A11Y Project is a comprehensive resource on web accessibility, and this excerpt
    of their technology statement doesn’t mince words about their technology preferences:


    > This is a deliberate choice intended to balance:


    * Accessibility and interoperability.

    * Ease of setup.

    * Approachability for beginners.

    * Cross-Operating System and browser support.

    * Local and end-user performance.


    > When working on the website, please be sure to utilize these technology choices
    first, and stay with them if at all possible. Honoring these technology choices
    helps to keep the site easier to maintain. ([http://bkaprt.com/rjs39/02-09](http://bkaprt.com/rjs39/02-09))


    Their statement lists not only the technologies used but also ones to be avoided,
    and explains why those technologies are incompatible with the A11Y Project’s mission
    to provide an accessible and fast resource on web accessibility. This gives prospective
    contributors a roadmap to making contributions that align with the project’s mission.


    Organizations that don’t employ a technology statement fail to do so at their
    own peril, but slapping one into a Git repo or company wiki without much thought
    isn’t much help either. Prominently mention your project’s technology statement
    in a top-level README, with contributing guidelines in a project’s repository.


    For developers working on proprietary projects for employers, make a technology
    statement a part of the onboarding process to ensure every participant understands
    the constraints of the project’s architecture. Failing to do so places your project’s
    user experience at risk—proprietary or otherwise.


    ## Which Side Are You On?


    The first request for any website always involves an HTML response rom the server,
    but it’s really what happens after that initial response that defines the resiliency
    of what you build—and whether you’re providing functionality from the server side
    or the client side.


    ### Websites vs. web apps


    Nomenclature is always tough to navigate. In our industry, terms like *website*
    and *web app* are flung around without much thought about how they inform our
    development choices. As this industry grinds away more of my vital life essence,
    I’ve come to understand that—while everything we build is *technically* a website—each
    term is *usually* shorthand for the following:


    * A *website* is a collection of pages that provide markup and functionality from
    the server. Websites tend to treat JavaScript as an enhancement on top of a minimally
    viable experience.

    * A *web app* feels and behaves more like a native app. Web apps treat the server
    as a data provider that fully relies on client-side JavaScript to provide markup
    and functionality to create “app-like” experiences.


    These distinctions matter because they affect your development style. When you
    go down the web-app path, you’re likely using a package manager (e.g., npm) to
    add client-side JavaScript in an alluringly frictionless fashion. That kind of
    convenience can give rise to slow user experiences that raise the bar for access
    from certain networks and devices, and create unnecessary barriers for users (Fig
    2.4).


    On the opposite side of the spectrum are websites like Self-Defined—a modern dictionary
    that provides space for people to define aspects of their identity ([http://bkaprt.com/rjs39/02-10](http://bkaprt.com/rjs39/02-10))—which
    rely on the server to provide *all* markup and functionality (Fig 2.5).


    ![Frames of a login screen plotted over time, showing that the login functionality
    itself is delayed over 8 seconds.](image/2.4.png)

