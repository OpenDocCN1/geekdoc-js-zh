  raw: 'If you pulled off this much, that’s a big deal. It’s no small thing to bifurcate
    your production JavaScript assets to cater to both legacy and modern browsers—but
    you’re only halfway there. You’ll still need to construct markup in order to serve
    these bundles to the correct browsers.


    ![Two visualizations of a project’s webpack bundle. The top bundle includes transforms
    and polyfills required for legacy browsers and comes in at 68.48 KiB. The bottom
    bundle requires little to none of those things and is 60 percent smaller at 26.75
    KiB.](image/7.png)


    Fig 5.8: Two visualizations of a project’s webpack bundle. The top bundle includes
    transforms and polyfills required for legacy browsers and comes in at 68.48 KiB.
    The bottom bundle requires little to none of those things and is 60 percent smaller
    at 26.75 KiB.


    ### The `module`/`nomodu``le` pattern


    We don’t think much about the `<script>` element. We slap in an `src`, maybe tinker
    with `defer` or `async` attributes, and get rolling. When we bundle and serve
    two different versions of our JavaScript, though, there’s a new approach that
    demands our attention: the `module`/`nomodul``e` pattern.


    This pattern offers two parallel ways to serve JavaScript:


    1.  We can target browsers that support ESM—and by association, a host of other
    modern JavaScript language features—by setting the `<script>` element’s `type`
    attribute value to  `module`.


    2.  We can indirectly target browsers that don’t support ESM and other modern
    features by applying an attribute of `nomodule` on `<script>` elements.


    We can then combine these two patterns:


    ```

    <!-- Serve modern bundles -->

    ```


    ```

    <script type="module" src="/js/app.mjs"></script>

    ```


    ```

    <!-- Serve legacy bundles -->

    ```


    ```

    <script nomodule defer src="/js/app.js"></script>

    ```


    This achieves the goal of differential serving by relying on two standardized  behaviors:


    1.  Browsers won’t download scripts with `type` attribute values they don’t recognize.
    In this case, modern browsers will download scripts served with a `type` attribute
    value of `modern`, but legacy browsers won’t.


    2.  Inversely, legacy browsers don’t recognize the `nomodule` attribute, so they’ll
    download scripts that use it. However, modern browsers *do* recognize `nomodule`,
    so they’ll skip scripts with that  attribute.


    Even so, some browsers don’t get this pattern right. Some browsers have issues
    where both bundles are downloaded. Some even execute both bundles ([http://bkaprt.com/rjs39/05-26](http://bkaprt.com/rjs39/05-26)).
    You have options, though:


    1.  Because browsers that don’t follow this pattern correctly will eventually
    fade out of use, you might find these suboptimizations acceptable.


    2.  If double-fetching of scripts for even a tiny sliver of your website’s visitors
    isn’t acceptable, you can rely on a script-injection pattern that checks for browser
    support of the `<script>` element’s `nomodule` attribute ([http://bkaprt.com/rjs39/05-27](http://bkaprt.com/rjs39/05-27)).


    3.  If neither option is acceptable, you could opt for a server-side approach.
    One method relies on user agent sniffing via the browserslist-useragent package
    ([http://bkaprt.com/rjs39/05-28](http://bkaprt.com/rjs39/05-28)), which itself
    relies on Can I Use’s compatibility data ([http://bkaprt.com/rjs39/05-29](http://bkaprt.com/rjs39/05-29)).


    Each has a drawback. The first approach means that a shrinking minority of people
    will incur a performance penalty—though that disadvantage is continually diminishing
    over time.


    The second approach sidesteps the browser’s preload scanner, which is a browser
    performance optimization that looks ahead to discover and fetch resources in the
    document ([http://bkaprt.com/rjs39/05-30](http://bkaprt.com/rjs39/05-30)).


    The third approach is best if you can’t accept the risks inherent in the others.
    However, you may not always have an application backend, or even one that can
    leverage Can I Use’s compatibility data. Still, if you can make it work, this
    approach eliminates some of these edge cases.


    However you settle on differential serving, the outcome is that less JavaScript
    gets sent to a big chunk of your website’s visitors. That translates into reduced
    startup time, and, in turn, makes for a better user experience. There’s nothing
    sweeter than that.


    ## Proceed with Caution


    Knowing how to use toolchains is equally as important as knowing *when* to use
    them. Failing to make this distinction may steepen a project’s learning curve,
    which can be cumbersome when developers are excited to jump in and contribute
    to a project (rather than bikeshedding over the nuts and bolts of its toolchain).
    Approach modern tooling with healthy skepticism, but note that skepticism also
    has practical limits: when simpler workflows become cumbersome, it’s time to pivot.


    By understanding how tooling affects your website’s performance, you can minimize
    potential damage to your user experience. This will prove especially useful as
    you begin to address runtime performance issues caused by JavaScript in your projects,
    since reducing main-thread noise will make opportunities for improvement even
    more apparent.


    # Chapter 6. Smoother Runtime Performance


    ![](image/8.png)


    Wasps have acute senses derived from several sensory organs. Of special interest
    are three eyes on the top of their head called *ocelli*, set between their compound
    eyes (Fig 6.1).


    ![The head of a European hornet showing compound eyes with ocelli (simple eyes)
    between them. Photograph by Holger Casselmann (http://bkaprt.com/rjs39/06-01),
    CC BY-SA 3.0 (http://bkaprt.com/rjs39/06-02), via Wikimedia Commons.](image/6.1.png)


    Fig 6.1: The head of a European hornet showing compound eyes with ocelli (simple
    eyes) between them. Photograph by Holger Casselmann ([http://bkaprt.com/rjs39/06-01](http://bkaprt.com/rjs39/06-01)),
    CC BY-SA 3.0 ([http://bkaprt.com/rjs39/06-02](http://bkaprt.com/rjs39/06-02)),
    via Wikimedia Commons.


    Ocelli aren’t compound eyes, but simple eyes that only perceive light. Entomologists
    hypothesize that ocelli allow wasps to sense the horizon so they can maintain
    a level flying path.


    We’ve talked a lot about loading versus runtime performance. If my wasp analogy
    holds, you might think of loading performance as being what it takes to get off
    the ground—that is, starting up a web page—whereas runtime performance is what
    it takes to keep stable during flight—or keeping things smooth after startup.


    Good runtime performance is a tall order, especially in complex architectures—but
    it’s possible! It challenges you to think about which behaviors are best delegated
    to HTML and CSS, rather than using JavaScript as the sole hammer for every nail-type
    problem. Think about main-thread functionality in terms of which tasks are critical,
    which tasks can take a back seat, and which tasks you can offload to other threads
    altogether.


    ## Leaning More on CSS and HTML


    Allow me to sit on this chair backward and rap with you for a second, fellow kids:
    if you want your website to be faster, using HTML and CSS in lieu of JavaScript
    where you can isn’t a bad start. It helps to think of the web as a triumvirate
    of these technologies, rather than “JavaScript” and “that other stuff.”


    Our collective fervency for JavaScript is at a fever pitch, to the point that
    our appetite for CSS and HTML is dwindling by comparison. When we fail to weigh
    the suitability of each of the web’s core technologies, we can’t accurately assess
    which technologies are best for specific problems.


    ### Rekindling CSS


    CSS is more mature and capable than it has ever been. With the advent of modern
    CSS layout modes such as Grid Layout and Flexbox, bespoke layouts require less
    code and are easier to write than ever.'
