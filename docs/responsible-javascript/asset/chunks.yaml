- fmt: "\n- If the package has suitable alternatives written in ESM, consider switching\
    \ to one of those.\n- If the package is a collection of utility functions and\
    \ the license allows for it, you might be able to strip out the necessary parts\
    \ of that library, convert them to ESM (if need be), and place that code directly\
    \ into your project. Doing this reduces build size and production dependencies,\
    \ and also has the developer experience benefit of decreased install and build\
    \ times.\n- Can you write the functionality yourself? Some libraries offer methods\
    \ that are now replaceable by built-in JavaScript methods. Chris Ferdinandi curates\
    \ a collection of articles that show you how to accomplish many common tasks with\
    \ nothing but bare JavaScript ([http://bkaprt.com/rjs39/05-10](http://bkaprt.com/rjs39/05-10)).\n\
    \nVendor packages may represent a significant portion of the JavaScript you ship\
    \ to browsers. Whenever you encounter a vendor package that can’t be optimized\
    \ through tree shaking, it’s a good idea to take a step back and consider your\
    \ options.\n\n## When to externalize dependencies\n\nYou might see a lot of `import`s\
    \ in a project. Each one signals the inclusion of one of two dependency types:\n\
    \n1. `Local dependencies` are code authored by you or your team and specific to\
    \ your project. These are often not published as public dependencies anyone can\
    \ install with a package manager.\n2. `Remote dependencies` are code written outside\
    \ of and often apart from your project. These are usually installed vendor packages,\
    \ but your project architecture may isolate app-specific logic to installable—and\
    \ possibly private—packages, an architectural style sometimes referred to as micro\
    \ frontends.\n\nPage speed suffers in micro-frontend architectures when vendor\
    \ packages are duplicated across dependencies, which require extra effort to be\
    \ eliminated, as the bundler’s scope is restricted to each individual dependency.\n\
    \nSay your website uses React, but each component in your app is a remote dependency\
    \ isolated in its own repository with its own toolchain. This causes each component\
    \ to ship its own copy of React. That’s a lot of redundant code.\n\nTo avoid duplicating\
    \ code, you should externalize dependencies you know are provided from another\
    \ source. All bundlers provide this functionality. For instance, `webpack` can\
    \ externalize dependencies ([http://bkaprt.com/rjs39/05-11](http://bkaprt.com/rjs39/05-11))\
    \ via its `externals` configuration:\n\n```\nmodule.exports = {\n```\n```\n //\
    \ ...\n```\n```\n externals: {\n```\n```\n react: \"React\",\n```\n```\n \"react-dom\"\
    : \"ReactDOM\"Each key in the `externals` object is the name of an npm package,\
    \ whose corresponding value is the namespace the package occupies in the global\
    \ scope. With this in place, `webpack` won’t bundle `react` and `react-dom`. It\
    \ will instead skip them and assume you’re providing those dependencies from another\
    \ source at runtime.\n\nWhile vendor code is a typical target for externalization,\
    \ remote dependencies specific to your website are just as suitable. For example,\
    \ consider an ecommerce retailer that uses a utility library in multiple components\
    \ on its product detail page: if that utility library is not externalized in each\
    \ dependency where it’s used, its code will be duplicated throughout the site.\n\
    \nSome of this advice may give you the impression that bundlers are performance\
    \ liabilities. While it’s true that some bundlers tend to prioritize compatibility\
    \ and interoperability in ways that can affect performance, that’s no excuse to\
    \ avoid them when it makes sense to use them. It just means you need to stay vigilant.\n\
    \n## Transpilers\n\nWe’ve already mentioned transpilers in this chapter, but they’re\
    \ a relevant tool you’re likely to encounter in most toolchains. To recap, a transpiler\
    \ transforms modern JavaScript features and syntax into a universally compatible\
    \ syntax that runs reliably everywhere.\n\nTranspilers, while understandably useful,\
    \ can be just as thorny as bundlers if we use them carelessly. Whenever you transform\
    \ a language feature to make it more compatible in more places, the transformed\
    \ code will almost always have a larger footprint than its untransformed equivalent.\n\
    \n## The business of transforms\n\nTranspilers serve a special purpose in modern\
    \ web development, as the addition of new features to JavaScript is at odds with\
    \ the varying adoption of those features in browsers. Because of this, your project\
    \ may use JavaScript features available in some browsers, but not others. These\
    \ could be entirely new language constructs like classes or `async`/await`, or\
    \ even new operators like spread syntax.\n\nArrow functions and template literals\
    \ are good examples of modern language features that may be transformed by a transpiler.\
    \ Arrow functions provide a compact function syntax that’s especially useful for\
    \ callbacks, and template literals can conveniently incorporate JavaScript expressions\
    \ into strings without concatenating operators:\n\n```\nconst scriptTags = scriptUrls.map(url\
    \ => '<script src=\"${url}\"><\\/script>').join(\"\");\n```\n\nHowever, if a transpiler\
    \ transforms the above code into a universally compatible syntax, the result is\
    \ a more verbose, but practically equivalent, piece of code:\n\n```\nvar scriptTags\
    \ = scriptUrls.map(function (url) {\n```\n```\n return \"<script src=\\\"\".concat(url,\
    \ \"\\\"></script>\");\n```\n```\n}).join(\"\");\n```\n\nWhile transpilers are\
    \ helpful tools for ensuring cross-browser compatibility, they have a couple:\n\
    \n- If a transpiler isn’t configured to target your users’ browsers, modern browsers\
    \ may incur significantly more JavaScript overhead.\n- Adding a transpiler to\
    \ your toolchain—as well as understanding its potential performance impact—introduces\
    \ a significant learning curve.\n\nTranspilers are indispensable in cases where\
    \ cross-platform compatibility is paramount, but they’re not mandatory—though\
    \ neither are build tools, for that matter. If you’re able to make architectural\
    \ choices for a project, the pragmatic bet is always for incremental adoption.\n\
    \nYet, the industry—and indeed, reality itself—is an unyielding bastard. You’ll\
    \ eventually have to deal with these tools at some point, if you haven’t by now.\
    \ Knowing how to rein them in can make a difference when it comes to JavaScript\
    \ performance.\n\n### Transforms aren’t free\n\nDepending on its configuration,\
    \ a transpiler can add bloat to your bundles when transforming any number of features:\
    \ ES6 classes, async functions, spread syntax, default parameters, generator functions,\
    \ and so forth, so long as JavaScript itself continues to evolve.\n\nLet’s kick\
    \ the tires on this concept and start with default parameters. If you’ve been\
    \ programming in any language long enough, you’ve probably observed—depending\
    \ on the language—a function’s parameters can have defaults that’ll kick in if\
    \ they’re omitted. Compared to other languages, this is a relatively new JavaScript\
    \ feature:\n\n```\nfunction generateLinkTags (cssFiles = [\"/css/global.css\"\
    ]) {\n```\n```\n return cssFiles.map(cssFile => {\n```\n```\n return '<link rel=\"\
    stylesheet\" href=\"${cssFile}\">';\n```\n```\n }).join(\"\");\n```\n```\n}\n\
    ```\n\nThis function generates a string of `<link>` elements to include CSS files.\
    \ On the first line, you’ll see that the `cssFiles` parameter is followed by an\
    \ equal sign and an array containing a reference to a global CSS file. This means\
    \ that the function can be run without any arguments and a default will kick in.\
    \ This is a useful feature in many situations.\n\nWhen this function is processed\
    \ by Babel, though, it may return this transformed code for some browser targets:\n\
    \n```\nfunction generateLinkTags() {\n```\n```\n var cssFiles = arguments.length\
    \ > 0 && arguments[0] !== undefined ? arguments[0] : [\"/css/global.css\"];\n\
    ```\n```\n return cssFiles.map(function (cssFile) {\n```\n```\n return \"<link\
    \ rel=\\\"stylesheet\\\" href=\\\"\".concat(cssFile, \"\\\">\");\n```\n```\n }).join(\"\
    \");\n```\n```\n}\n```\n"
