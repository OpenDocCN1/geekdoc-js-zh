- fmt: "\nHowever, not all third-party embedded content is provided by iframes. This\
    \ means that lazy-loading JavaScript can get more complicated for other types\
    \ of embeds. Take Facebook’s Like button embed, which consists of two parts. The\
    \ first part is an HTML placeholder for the button:\n\n```html\n<div class=\"\
    fb-like\" data-href=\"https://developers.facebook.com/docs/plugins/\" data-width=\"\
    \" data-layout=\"standard\" data-action=\"like\" data-size=\"small\" data-share=\"\
    true\"></div>\n```\n\n![A WebPageTest waterfall view of the same blog page with\
    \ the YouTube embed’s <iframe> element using the loading=\"lazy\" attribute. The\
    \ content won’t load until it approaches the viewport, freeing up valuable bandwidth\
    \ and system resources during startup.](image/7.11.png)\n\nFig 7.11: A WebPageTest\
    \ waterfall view of the same blog page with the YouTube embed’s `iframe` element\
    \ using the `loading=\"lazy\"` attribute. The content won’t load until it approaches\
    \ the viewport, freeing up valuable bandwidth and system resources during startup.\n\
    \nThe second part is a small HTML snippet and a Facebook-provided `<script>` tag:\n\
    \n```html\n<div id=\"fb-root\"></</div>\n```\n\n```html\n<script async defer crossorigin=\"\
    anonymous\" src=\"https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v9.0\"\
    ></script>\n```\n\nFacebook’s JavaScript embed is honkin’* big. The script referenced\
    \ in the snippet above is over 700 kilobytes uncompressed! Avoid it altogether\
    \ if you can, but chances are that if you’re already in this situation, you can’t.\
    \ If that’s the case, your best option is to mitigate the damage. Unless the Like\
    \ button is at the top of the page, it’s not worth the extra processing to load\
    \ Facebook’s giant chunk of JavaScript during startup, where it will compete with\
    \ other resources. An intersection observer helps us out here:\n\n```javascript\n\
    const intersectionListener = new IntersectionObserver(([ entry ], observer) =>\
    \ {\n  if (entry.isIntersecting || entry.intersectionRatio) {\n    const scriptEl\
    \ = document.createElement(\"script\");\n    scriptEl.defer = true;\n    scriptEl.crossOrigin\
    \ = \"anonymous\";\n    scriptEl.src = \"https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v9.0\"\
    ;\n    document.body.append(scriptEl);\n    observer.disconnect();\n  }\n});\n\
    intersectionListener.observe(document.querySelector(\".fb-like\"));\n```\n\nThis\
    \ code snippet does the following:\n\n1. A new `IntersectionObserver` instance\
    \ is created. In its callback, we only need the first entry in the entry list\
    \ since we’re only observing the visibility of a single `div.fb-like` element.\n\
    2. Once the element is in viewport, a new `<script>` element is created with the\
    \ `document.createElement` method ([http://bkaprt.com/rjs39/07-13](http://bkaprt.com/rjs39/07-13)).\n\
    3. With the `<script>` element created, we assign three attributes to it: its\
    \ cross-origin request type (`anonymous`), whether to defer its execution, and\
    \ its `src`. We then append it to the bottom of the `<body>`.\n4. Once all that’s\
    \ done with, we call the observer’s `disconnect` method to ensure the callback\
    \ runs only once ([http://bkaprt.com/rjs39/07-14](http://bkaprt.com/rjs39/07-14)).\n\
    \nThis example could be improved a bit. Like—I don’t know—you might not want to\
    \ load the script when the `div.fb-like` element is *in* view, but rather as it\
    \ *approaches* the viewport. For this, you can pass the `rootMargin` option to\
    \ the intersection observer instance ([http://bkaprt.com/rjs39/07-15](http://bkaprt.com/rjs39/07-15)).\
    \ You could also style the `div.fb-like` element with a `min-height` rule to limit\
    \ layout shifts as its contents load.\n\nLet it be known that lazy-loading isn’t\
    \ just for images. When it comes to third-party scripts like these that can tax\
    \ devices during startup, load them lazily whenever practical.\n\n## Content Security\
    \ Policies\n\nSometimes third-party scripts go beyond being mere performance liabilities\
    \ to something worse. In 2020, the HTTP Archive found that almost 84 percent of\
    \ mobile pages had at least one vulnerable JavaScript dependency ([http://bkaprt.com/rjs39/07-16](http://bkaprt.com/rjs39/07-16)).\
    \ In an industry where we tend to install JavaScript packages without much skepticism,\
    \ that should give you pause.\n\nThankfully, there’s a web platform feature to\
    \ help protect us from compromised third-party vendors: *Content Security Policy*\
    \ (CSP). CSP helps with a problem called *cross-site scripting* (XSS), a security\
    \ vulnerability in which malicious code is injected on a page to gain access to\
    \ confidential information such as cookie contents, data kept in web storage,\
    \ or any information accessible through JavaScript APIs.\n\nCSPs are dictated\
    \ by the `Content-Security-Policy` HTTP header. This header is composed of one\
    \ or more policy directives. These directives describe which origins the current\
    \ page are allowed to load from which types of assets are allowed, as well as\
    \ whether inline scripts can be used—the latter of which is pretty important in\
    \ the case of XSS.\n\nGood security policies start with good defaults. For security,\
    \ we rely on locks first, then supplement them with additional measures.\n\n###\
    \ `default-src`\n\n`default-src` is a catch-all that dictates the rules for what\
    \ can be loaded from in the absence of other policies ([http://bkaprt.com/rjs39/07-17](http://bkaprt.com/rjs39/07-17)).\
    \ Instead, we’ll focus on a handful of the more effective ones. A good `default-src`\
    \ policy may look something like this:\n\n```\nContent-Security-Policy: default-src\
    \ 'self' https:\n```\n\nThis states that all requests come from the primary origin\
    \ or any origin serving content over HTTPS. `default-src` also disallows inline\
    \ `<script>` and `<style>` elements, the former of which can be injected into\
    \ the DOM to steal information. We’ll touch on how you can manage those elements\
    \ shortly.\n\nReminder: `default-src` isn’t inherited by other policies, and kicks\
    \ in only for requests that aren’t governed by more specific policies ([http://bkaprt.com/rjs39/07-18](http://bkaprt.com/rjs39/07-18)).\
    \ If you need specific rules for specific asset types, you’ll need to lean on\
    \ other directives.\n\n### `script-src`\n\n`script-src` is what you’re after when\
    \ it comes to mitigating potentially malicious third-party JavaScript. While `default-src`\
    \ establishes requirements as to where all assets can be loaded from, `script-src`\
    \ applies only to mechanisms that load script assets and inline script event handlers\
    \ (e.g., `onload`). Like other directives, `script-src` takes a space-separated\
    \ list of keywords or origins that scripts may be loaded from. Multiple policy\
    \ directives are separated by semicolons. Riffing on our current `default-src`,\
    \ a `script-src` policy looks like this:\n\n```\nContent-Security-Policy: default-src\
    \ 'self' https:; script-src 'self' https://nexus.ensighten.com\n```\n\nThe `script-src`\
    \ portion of this CSP says:\n\n* Scripts from the primary origin are allowed.\n\
    * Scripts from nexus.ensighten.com are allowed.\n"
  raw: "However, not all third-party embedded content is provided by iframes. This\
    \ means that lazy-loading JavaScript can get more complicated for other types\
    \ of embeds. Take Facebook’s Like button embed, which consists of two parts. The\
    \ first part is an HTML placeholder for the button:\n\n```\n<div class=\"fb-like\"\
    \ data-href=\"https://developers.facebook.com/docs/plugins/\" data-width=\"\"\
    \ data-layout=\"standard\" data-action=\"like\" data-size=\"small\" data-share=\"\
    true\"></div>\n```\n\n![A WebPageTest waterfall view of the same blog page with\
    \ the YouTube embed’s <iframe> element using the loading=\"lazy\" attribute. The\
    \ content won’t load until it approaches the viewport, freeing up valuable bandwidth\
    \ and system resources during startup.](image/7.11.png)\n\nFig 7.11: A WebPageTest\
    \ waterfall view of the same blog page with the YouTube embed’s `<iframe>` element\
    \ using the `loading=\"lazy\"` attribute. The content won’t load until it approaches\
    \ the viewport, freeing up valuable bandwidth and system resources during startup.\n\
    \nThe second part is a small HTML snippet and a Facebook-provided `<sc``ript>`\
    \ tag:\n\n```\n<div id=\"fb-root\"></div>\n```\n\n```\n<script async defer crossorigin=\"\
    anonymous\" src=\"https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v9.0\"\
    ></script>\n```\n\nFacebook’s JavaScript embed is *honkin’* big. The script referenced\
    \ in the snippet above is over 700 kilobytes uncompressed! Avoid it altogether\
    \ if you can, but chances are that if you’re already in this situation, you can’t.\
    \ If that’s the case, your best option is to mitigate the damage. Unless the Like\
    \ button is at the top of the page, it’s not worth the extra processing to load\
    \ Facebook’s giant chunk of JavaScript during startup, where it will compete with\
    \ other resources. An intersection observer helps us out here:\n\n```\nconst intersectionListener\
    \ = new IntersectionObserver(([ entry ], observer) => {\n```\n\n```\n if (entry.isIntersecting\
    \ || entry.intersectionRatio) {\n```\n\n```\n const scriptEl = document.createElement(\"\
    script\");\n```\n\n```\n scriptEl.defer = true;\n```\n\n```\n scriptEl.crossOrigin\
    \ = \"anonymous\";\n```\n\n```\n scriptEl.src = \"https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v9.0\"\
    ;\n```\n\n```\n document.body.append(scriptEl);\n```\n\n```\n observer.disconnect();\n\
    ```\n\n```\n }\n```\n\n```\n});\n```\n\n```\nintersectionListener.observe(document.querySelector(\"\
    .fb-like\"));\n```\n\nThis code snippet does the  following:\n\n1.  A new `IntersectionObserver`\
    \ instance is created. In its callback, we only need the first entry in the entry\
    \ list since we’re only observing the visibility of a single `div.fb-lik``e` element.\n\
    \n2.  Once the element is in viewport, a new `<script>` element is created with\
    \ the `document.createElement` method ([http://bkaprt.com/rjs39/07-13](http://bkaprt.com/rjs39/07-13)).\n\
    \n3.  With the `<script>` element created, we assign three attributes to it: its\
    \ cross-origin request type (`anonymous`), whether to defer its execution, and\
    \ its `src`. We then append it to the bottom of the `<body>`.\n\n4.  Once all\
    \ that’s done with, we call the observer’s `disconnect` method to ensure the callback\
    \ runs only once ([http://bkaprt.com/rjs39/07-14](http://bkaprt.com/rjs39/07-14)).\n\
    \nThis example could be improved a bit. Like—I don’t know—you might not want to\
    \ load the script when the `div.fb-like` element is *in* view, but rather as it\
    \ *approaches* the viewport. For this, you can pass the `rootMargin` option to\
    \ the intersection observer instance ([http://bkaprt.com/rjs39/07-15](http://bkaprt.com/rjs39/07-15)).\
    \ You could also style the `div.fb-like` element with a `min-height` rule to limit\
    \ layout shifts as its contents load.\n\nLet it be known that lazy-loading isn’t\
    \ just for images. When it comes to third-party scripts like these that can tax\
    \ devices during startup, load them lazily whenever  practical.\n\n## Content\
    \ Security Policies\n\nSometimes third-party scripts go beyond being mere performance\
    \ liabilities to something worse. In 2020, the HTTP Archive found that almost\
    \ 84 percent of mobile pages had at least one vulnerable JavaScript dependency\
    \ ([http://bkaprt.com/rjs39/07-16](http://bkaprt.com/rjs39/07-16)). In an industry\
    \ where we tend to install JavaScript packages without much skepticism, that should\
    \ give you pause.\n\nThankfully, there’s a web platform feature to help protect\
    \ us from compromised third-party vendors: *Content Security Policy* (CSP). CSP\
    \ helps with a problem called *cross-site scripting* (XSS), a security vulnerability\
    \ in which malicious code is injected on a page to gain access to confidential\
    \ information such as cookie contents, data kept in web storage, or any information\
    \ accessible through JavaScript APIs.\n\nCSPs are dictated by the `Content-Security-Policy`\
    \ HTTP header. This header is composed of one or more *policy directives*. These\
    \ directives describe which origins the current page are allowed to load assets\
    \ from and which types of assets are allowed, as well as additional rules such\
    \ as whether inline scripts and styles can be used—the latter of which is pretty\
    \ damn important in the case of XSS attacks, as those are often done via injected\
    \ inline `<script>` elements.\n\nWhile many policy directives could be useful\
    \ for securing your site against compromised third-party assets, there are too\
    \ many to list here ([http://bkaprt.com/rjs39/07-17](http://bkaprt.com/rjs39/07-17)).\
    \ Instead, we’ll focus on a handful of the more effective ones.\n\n### `d``efault-src`\n\
    \nGood security policies start with good defaults. For home security, we rely\
    \ on locks first, then supplement them with additional measures. CSP is no different,\
    \ and the bedrock of your CSP should be the `default-src` policy  directive.\n\
    \n`default-src` is a catch-all that dictates the rules for what can be loaded\
    \ from where in the absence of other policy directives (which we’ll cover soon\
    \ enough). `default-src` is reasonably strict, with the understanding that this\
    \ strictness will be supplemented by higher-level policy directives.\n\nA good\
    \ `default-src` policy may look something like this:\n\n```\nContent-Security-Policy:\
    \ default-src 'self' https:\n```\n\nThis states that *all* requests should come\
    \ from the primary origin or any origin serving content over HTTPS. `default-src`\
    \ also disallows inline `<script>` and `<style>` elements, the former of which\
    \ can be injected into the DOM to steal sensitive information by an attacker.\
    \ We’ll touch on how you can manage those inline `<script>` elements shortly.\n\
    \nReminder: `default-src` isn’t inherited by other policies, and kicks in only\
    \ for requests that aren’t governed by more specific policies ([http://bkaprt.com/rjs39/07-18](http://bkaprt.com/rjs39/07-18)).\
    \ If you need specific rules for specific asset types, you’ll need to lean on\
    \ other directives—such as `s``cript-src`.\n\n### `script-src`\n\n`script-src`\
    \ is what you’re after when it comes to mitigating potentially malicious third-party\
    \ JavaScript. While `default-src` establishes requirements as to where all assets\
    \ can be loaded from, `script-src` applies only to mechanisms that load script\
    \ assets and inline script event handlers (e.g., `onload`).\n\nLike other directives,\
    \ `script-src` takes a space-separated list of keywords or origins that scripts\
    \ may be loaded from. Multiple policy directives are separated by semicolons.\
    \ Riffing on our current `default-src`, a `script-src` policy looks like this:\n\
    \n```\nContent-Security-Policy: default-src 'self' https:; script-src 'self' https://nexus.ensighten.com\n\
    ```\n\nThe `script-src` portion of this CSP says:\n\n*   Scripts from the primary\
    \ origin are allowed.\n\n*   Scripts from nexus.ensighten.com are allowed.\n\n\
    Enabling CSP also has the intentional (though not obvious) effect of disallowing\
    \ inline scripts. If a third-party is compromised—or just unscrupulous—their JavaScript\
    \ could inject a `<script>` element on the page and collect sensitive information\
    \ from JavaScript APIs for future exploitation."
