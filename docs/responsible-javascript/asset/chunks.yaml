  trans: "\n\n如果你只需要收集少数核心指标，一个简单的小方案就能奏效。对于我自己的项目，我编写了一个名为 `grab-vitals` 的自定义解决方案（[`bkaprt.com/rjs39/03-20`](http://bkaprt.com/rjs39/03-20)），它使用了\
    \ Google 的 `web-vitals` npm 包来收集之前讨论的性能指标：\n\n```javascript\nwindow.addEventListener(\"\
    load\", () => {\n  import(\"grab-vitals\").then(({ grabVitals }) => {\n    grabVitals(\"\
    https://interslice.compuhyperglobalmega.net/collect\");\n  });\n});\n```\n\n`grabVitals`\
    \ 函数接受一个指向 `URL` 的 `string`，页面的性能指标将作为 `JSON` 字符串发送到该地址进行收集。为了避免在启动期间占用主线程，`grabVitals`\
    \ 方法在页面 `load` 事件触发后才会被被调用。\n\n如果你决定自己实现解决方案，请记住以下几点：\n\n*   Google 的 `web-vitals`\
    \ 包在没有填充性代码（polyfills）的情况下无法在所有浏览器中收集所有指标。这意味着在某些浏览器上加载它可能会导致产生未使用的代码。`grab-vitals`\
    \ 通过使用动态 `import` 绕过了这个问题——这是我们将在第 4 章介绍的代码拆分技术。\n*   使用 `requestIdleCallback`\
    \ ([`bkaprt.com/rjs39/03-21`](http://bkaprt.com/rjs39/03-21)) 来避免与关键交互产生主线程竞争。任何关键交互都不应该为了收集指标而让路。该\
    \ API 将在第 6 章介绍。\n*   批量收集的指标以避免对收集端点进行过度调用，这涉及巨大的挑战。`grab-vitals` 通过监听页面的 `visibilitychange`\
    \ 事件以及 Safari 的 `pagehide` 事件（[`bkaprt.com/rjs39/03-22`](http://bkaprt.com/rjs39/03-22)）来补偿这一点。\n\
    *   你需要决定使用 `fetch` 还是 `navigator.sendBeacon` ([`bkaprt.com/rjs39/03-23`](http://bkaprt.com/rjs39/03-23))\
    \ 将字段指标发送到你的收集端点。`navigator.sendBeacon` 使用起来比 `fetch`get，且不会通过延迟文档卸载来延迟导航，但 `fetch`\
    \ 提供了更好的控制能力。\n\n这些内容很难！使用现成工具并不总是个坏主意，即使它是付费产品。只需知道，如果你决定与供应商合作收集字段数据，你应该通过提问来确保他们的收集方法解决了上述这些问题。\n\
    \n在指标的存储方面，这需要一个应用程序后端和一个数据库（[`bkaprt.com/rjs39/03-24`](http://bkaprt.com/rjs39/03-24)）。你如何存储指标并不重要，只要你能以一种舒适且熟悉的方式访问它们即可。\n\
    \n### 分析字段指标的技巧\n\n无论你是依赖供应商产品来收集指标，还是自己实现解决方案，在分析数据存储器中的字段指标时，有几点需要考虑：\n\n* \
    \  **避免使用平均值！** 虽然平均值很容易计算，但它们解释性能的方式并不如你认为的那样（[`bkaprt.com/rjs39/03-25`](http://bkaprt.com/rjs39/03-25)）。由于大量的字段指标包含许多离群值，平均值往往会偏斜。\n\
    *   **关注分位数。** 第 75、90 和 95 分位数特别有价值，因为这些区间往往会强调较慢的体验而非快速的体验。\n*   **特别关注第 90\
    \ 分位数及以上。** 在这里你将看到较慢设备和糟糕的网络条件如何影响性能。解决这个范围内的痛点，无论用户的网络连接或设备有多快，都能让你的网站对所有人运行更快。\n\
    *   **使数据上下文化。** 单的指标只能传达简单的结论，例如“这是你的页面可交互的时候”。如果你正在评估供应商产品，请查看它是否收集了设备信息和来自\
    \ `Long Tasks API` 的长任务数据。如果你是自己实现，请自己存储这些数据。这将让你更深入了解为什么某些用户遇到了问题而其他用户没有。\n\n\
    如果你只遵循一条建议，请关注分位数！分位数在总结字段指标的结果范围方面非常有价值。假设我们有一个 JavaScript 较少的网站，有 312 条 `LCP`\
    \ 记录：\n\n| 分位数 | 最大内容绘制 (Largest Contentful Paint) |\n| --- | --- |\n| 第 25 |\
    \ 237 毫秒 |\n| 第 50 | 619 毫秒 |\n| 第 75 | 1,503 毫秒 |\n| 第 90 | 3,693 毫秒 |\n| 第 95\
    \ | 8,120 毫秒 |\n\n如果我们对所有记录取平均值，将得到大约 1,707 毫秒。虽然这并不算不上一个糟糕的 `LCP` 分，但它是无法反映实际会话的值堆砌。它接近第\
    \ 75 分位数。\n\n"
- fmt: "\n```javascript\nimport PageContainer from \"./PageContainer.js\";\n```\n\n\
    ```javascript\nimport { BlogPost } from \"./Components.js\";\n```\n\nThe `import`\
    \ statements shown above are `static imports`. Static imports incorporate external\
    \ modules into the scope of the current script. The first and second lines in\
    \ the preceding code demonstrate how named and default exports are imported, respectively.\n\
    \nThis shows the corresponding types of exports in action:\n\n```javascript\n\
    const PageContainer = () => { /* Omitted code */ };\n```\n\n```javascript\nconst\
    \ BlogPost = () => { /* Omitted code */ };\n```\n\n```javascript\n// Default export\n\
    ```\n\n```javascript\nexport default PageContainer;\n```\n\n```javascript\n//\
    \ Named export\n```\n\n```javascript\nexport BlogPost;\n```\n\nWhether you use\
    \ named or default exports is immaterial to understanding the limitations of static\
    \ imports:\n\n- The module specifier—that is, the string that comes after the\
    \ `from` keyword that specifies the module’s location—can only be a plain string.\n\
    - Static imports can only ever be present at the top of a file.\n\nThese limitations\
    \ restrict static imports to loading code immediately regardless of whether that\
    \ code is executed at startup. A more flexible version of the `import` syntax,\
    \ `dynamic import`, was developed to address this limitation ([http://bkaprt.com/rjs39/04-02](http://bkaprt.com/rjs39/04-02)).\n\
    \n`dynamic imports` are similar to static imports, except they can be placed anywhere\
    \ in your code, and they rely on promises:\n\n```javascript\nimport(\"/js/module.js\"\
    ).then(module => {\n```\n\n```javascript\n // Access the default export\n```\n\
    \n```javascript\n module.default();\n```\n\n```javascript\n // Access a named\
    \ export\n```\n\n```javascript\n module.namedModule();\n```\n\n```javascript\n\
    }).catch(error => {\n```\n\n```javascript\n // Something went wrong!\n```\n\n\
    ```javascript\n console.warn(error);\n```\n\n```javascript\n});\n```\n\nWhile\
    \ this syntax is more verbose than a static import, its greater flexibility means\
    \ we can load additional JavaScript after startup at a time of our choosing. This\
    \ gives us greater control over how much code we load at startup, which can have\
    \ significant performance benefits.\n\n### Code splitting\n\nDynamic imports make\
    \ `code splitting` possible ([http://bkaprt.com/rjs39/04-03](http://bkaprt.com/rjs39/04-03)).\
    \ Code splitting is a performance optimization where we split any JavaScript that\
    \ isn’t necessary at startup from the application logic and instead load it on\
    \ demand from separate script assets.\n\n“Why should I give a damn about code\
    \ splitting?” you might say. Allow me to elaborate: chances are good that you’re\
    \ shipping some unused JavaScript. The HTTP Archive disclosed in their 2020 almanac\
    \ that roughly 37 percent of JavaScript shipped by the median experience goes\
    \ unused ([http://bkaprt.com/rjs39/04-04](http://bkaprt.com/rjs39/04-04)). That’s\
    \ a lot of kilobytes taxing devices and frittering away metered data plans for\
    \ no good reason. And that’s the `median` experience—your projects may be shipping\
    \ more unused JavaScript than that!\n\nSo split we must, and split we will! However,\
    \ the first step of code splitting is finding opportunities. User interactions\
    \ are almost always potential code-splitting opportunities, which means we’ll\
    \ be looking for event listeners that fire due to an explicit interaction.\n\n\
    Code tucked away in `click` events, such as JavaScript-driven form validation,\
    \ is one such opportunity for code splitting. Scripts that run in `click` events\
    \ are a prime example of `deferred behavior`, as the JavaScript associated with\
    \ them doesn’t run during startup. As the HTTP Archive shows, we often load scripts\
    \ for these behaviors regardless of whether they’ll be used, even though they\
    \ can be loaded on demand instead.\n\nAnother good example of a deferred interaction\
    \ is the `<form>` element’s `submit` event. This event is a perfect opportunity\
    \ to defer loading JavaScript with a well-placed dynamic import:\n\n```javascript\n\
    const contactForm = document.getElementById(\"contact-form\");\n```\n\n```javascript\n\
    const inputs = contactForm.querySelectorAll(\"input, textarea\");\n```\n\n```javascript\n\
    inputs.forEach(input => {\n```\n\n```javascript\n input.removeAttribute(\"required\"\
    );\n```\n\n```javascript\n input.removeAttribute(\"pattern\");\n```\n\n```javascript\n\
    });\n```\n\n```javascript\ncontactForm.addEventListener(\"submit\", event => {\n\
    ```\n\n```javascript\n event.preventDefault();\n```\n\n```javascript\n import(\"\
    /js/contact-form-validation.js\").then(module => {\n```\n\n```javascript\n const\
    \ [state, errors] = module.isFormValid(inputs);\n```\n\n```javascript\n if (state)\
    \ {\n```\n\n```javascript\n contactForm.submit();\n```\n\n```javascript\n return;\n\
    ```\n\n```javascript\n }\n```\n\n```javascript\n // TODO: Error processing code\
    \ here\n```\n\n```javascript\n });\n```\n\n```javascript\n});\n```\n\nAfter clicking\
    \ submit, you’ll have to wait for the dynamic import to grab the validation script\
    \ (a possible drawback we’ll address in more detail later). All the same, it’s\
    \ a good dynamic import example as well as a great example of progressive enhancement\
    \ in action.\n\nBecause the server sends `<form>` markup with the `required` and\
    \ `pattern` attributes, we need to strip them out before our custom validation\
    \ logic can work. However, if the validation script fails to load or execute,\
    \ the form will still have `some` validation capabilities provided by HTML itself.\
    \ Not ideal, but that redundant functionality still saves us a trip to the server\
    \ to validate all the inputs (something you should be doing anyway).\n\nIn the\
    \ form’s `submit` event callback, we call `event.preventDefault()` to prevent\
    \ the form from submitting. After that, we dynamically import our module, which\
    \ contains a single export called `isFormValid`.\n\nThis is but one type of interaction\
    \ where dynamic import is useful. If you have a lot of features on your website,\
    \ there are likely more points to consider, such as `click`, `hover`, `focus`,\
    \ and `blur`.\n\n### Selectively polyfilling features\n\n`polyfilling` is the\
    \ practice of using JavaScript to provide specific web-platform APIs in browsers\
    \ that don’t support them. It’s often a necessary practice, but it also increases\
    \ the amount of unused JavaScript if you’re not careful to target delivery to\
    \ only those that require them.\n\nVarious parts of the Internationalization API\
    \ are good examples of this. `Intl.relativeTimeFormat` is useful because it automatically\
    \ generates relative time strings like “3 days ago” for English locales—or a whole\
    \ slew of others: it provides this capability across a variety of locales, a common\
    \ (yet complicated) task is handled by the browser’s internals without the need\
    \ for heavy libraries such as Moment.js, which weighs in at 300 kilobytes ([http://bkaprt.com/rjs39/04-05](http://bkaprt.com/rjs39/04-05)).\n\
    \nAt the time of writing, not all browsers support Internationalization APIs.\
    \ Polyfills exist for features like `Intl.relativeTimeFormat` and its dependencies\
    \ within the broader API. However, depending on how much you need to polyfill,\
    \ you might be sending twenty or more kilobytes of JavaScript that go unused in\
    \ some browsers, which can make startup slower.\n\nWe can lean on dynamic import\
    \ to keep unnecessary polyfilling from happening, which the maintainers of the\
    \ Internationalization API polyfills already demonstrate how to do in Node.js\
    \ development environments:\n\n```javascript\nimport { shouldPolyfill } from \"\
    @formatjs/intl-relativetimeformat/should-polyfill\"\n```\n\n```javascript\nasync\
    \ function polyfill (locale) {\n```\n\n```javascript\n if (shouldPolyfill()) {\n\
    ```\n\n```javascript\n await import(\"@formatjs/intl-relativetimeformat/polyfill\"\
    )\n```\n\n```javascript\n }\n```\n```\n"
