  trans: "\n\n然而，并不是所有第三方嵌入内容都是通过 `iframe` 提供的。这意味着对于其他类型的嵌入，JavaScript 的懒加载可能会变得更加复杂。以\
    \ Facebook 的“赞”按钮为例，它由两部分组成。第一部分是按钮的 HTML 占位符：\n\n```html\n<div class=\"fb-like\"\
    \ data-href=\"https://developers.facebook.com/docs/plugins/\" data-width=\"\"\
    \ data-layout=\"standard\" data-action=\"like\" data-size=\"small\" data-share=\"\
    true\"></</div>\n```\n\n![同一博客页的 WebPageTest 瀑布图，其中 YouTube 嵌入的 <iframe> 元素使用了\
    \ loading=\"lazy\" 属性。内容在接近视口之前不会加载，从而在启动期间释放了宝贵的带宽和系统资源。](img/7.11.png)\n\n图\
    \ 7.11：同一博客页的 WebPageTest 瀑布图，其中 YouTube 嵌入的 `iframe` 元素使用了 `loading=\"lazy\"\
    ` 属性。内容在接近视口之前不会加载，从而在启动期间释放了宝贵的带宽和系统资源。\n\n第二部分是一个小的 HTML 代码段和一个 Facebook 提供的\
    \ `<script>` 标签：\n\n```html\n<div id=\"fb-root\"></</div>\n```\n\n```html\n<script\
    \ async defer crossorigin=\"anonymous\" src=\"https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v9.0\"\
    ></script>\n```\n\nFacebook 的 JavaScript 嵌入确实*大得出*。上述代码段中引用的脚本未压缩前超过 700 千字节！如果可能，请完全避免它，但可能当你已经处于这种境地时，无法避免。如果是如此，最好的选择是减轻损害。除非“赞”按钮位于页面顶部，否则不值得在启动期间加载\
    \ Facebook 这一巨大的 JavaScript 块，因为在启动期间它会与其他资源竞争。交叉观察器（intersection observer）在这里可以帮大忙：\n\
    \n```javascript\nconst intersectionListener = new IntersectionObserver(([ entry\
    \ ], observer) => {\n  if (entry.isIntersecting || entry.intersectionRatio) {\n\
    \    const scriptEl = document.createElement(\"script\");\n    scriptEl.defer\
    \ = true;\n    scriptEl.crossOrigin = \"anonymous\";\n    scriptEl.src = \"https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v9.0\"\
    ;\n    document.body.append(scriptEl);\n    observer.disconnect();\n  }\n});\n\
    intersectionListener.observe(document.querySelector(\".fb-like\"));\n```\n\n这段代码段执行了以下操作：\n\
    \n1. 创建了一个新的 `IntersectionObserver` 实例。在回调函数中，我们只需要入口列表中的第一个项，因为我们只观察单个 `div.fb-like`\
    \ 元素的可见性。\n2. 一旦元素进入视口，就会使用 `document.createElement` 方法创建一个新的 `<script>` 元素（[`bkaprt.com/rjs39/07-13`](http://bkaprt.com/rjs39/07-13)）。\n\
    3. 创建 `<script>` 元素后，我们为其分配了三个属性：跨源请求类型（`anonymous`）、是否延迟执行以及它的 `src`。然后我们将其附加到\
    \ `<body>` 的底部。\n4. 完成所有操作后，我们调用观察器的 `disconnect` 方法以确保回调只运行一次（[`bkaprt.com/rjs39/07-14`](http://bkaprt.com/rjs39/07-14)）。\n\
    \n这个示例可以稍微改进。比如——我不知道——你可能不想在 `div.fb-like` 元素*在*视图中时加载脚本，而是在它*接近*视口时加载。对于这一点，你可以向交叉观察器实例传递\
    \ `rootMargin` 选项（[`bkaprt.com/rjs39/07-15`](http://bkaprt.com/rjs39/07-15)）。你还可以使用\
    \ `min-height` 规则为 `div.fb-like` 元素设置样式，以限制其内容加载时的布局偏移。\n\n请记住，懒加载不仅适用于图片。对于像这类会在启动期间消耗设备资源的第三方脚本，只要可行，请始终使用懒加载它们。\n\
    \n## 内容安全策略 (Content Security Policies)\n\n有时，第三方脚本的影响不仅仅仅是性能负担，还会变成更糟的情况。2020\
    \ 年，HTTP Archive 发现几乎 84% 的移动端页面至少有一个脆弱的 JavaScript 依赖项（[`bkaprt.com/rjs39/07-16`](http://bkaprt.com/rjs39/07-16)）。在我们这样一个倾向于不加怀疑地安装\
    \ JavaScript 包的行业中，这应该让你警惕。\n\n幸运的是，有一种网络平台功能可以帮助我们免受受损害第三方供应商的影响：*内容安全策略*（Content\
    \ Security Policy，CSP）。CSP 有助于解决*跨站脚本*（XSS）问题，这是一种安全漏洞，恶意代码被注入页面以获取机密信息，例如 cookie\
    \ 内容、存储在网络存储中的数据或通过 JavaScript API 访问的任何信息。\n\nCSP 由 `Content-Security-Policy`\
    \ HTTP 头部规定。该头部由一个或多个策略指令组成。这些指令描述了当前页面允许从哪些源加载内容、允许加载哪些类型的资源，以及是否可以使用内联脚本——后者在\
    \ XSS 情况下非常重要。\n\n良好的安全策略从良好的默认设置开始。为了安全，我们依靠锁定，然后补充额外的措施。\n\n### `default-src`\n\
    \n`default-src` 是一个兜底策略，在没有其他策略的情况下规定了可以加载内容的规则（[`bkaprt.com/rjs39/07-17`](http://bkaprt.com/rjs39/07-17)）。相反，我们将关注少数有效的策略。一个良好的\
    \ `default-src` 策略可能如下：\n\n```\nContent-Security-Policy: default-src 'self' https:\n\
    ```\n\n这表明所有请求都来自主源或任何提供 HTTPS 内容的源。`default-src` 还禁止内联的 `<script>` 和 `<style>`\
    \ 元素，前者可以被注入 DOM 以窃取信息。我们很快就会涉及到如何管理这些元素。提醒：`default-src` 不会被其他策略继承，仅对未被更特定策略覆盖的请求生效（[`bkaprt.com/rjs39/07-18`](http://bkaprt.com/rjs39/07-18)）。如果你需要为特定资源类型设置特定规则，你需要依靠指令。\n\
    \n### `script-src`\n\n在缓解潜在恶意的第三方 JavaScript 时，你需要的是 `script-src`。虽然 `default-src`\
    \ 规定了所有资源从哪里加载的要求，但 `script-src` 仅适用于加载脚本资源和内联脚本处理程序（例如 `onload`）的机制。与其他指令一样，`script-src`\
    \ 接受空格分隔的关键字或源列表，脚本可以从这些源加载。多个策略指令之间用分号分隔。基于我们当前的 `default-src` 进行调整，`script-src`\
    \ 策略如下：\n\n```\nContent-Security-Policy: default-src 'self' https:; script-src\
    \ 'self' https://nexus.ensighten.com\n```\n\n此 CSP 的 `script-src` 部分表示：\n\n* 允许来自主源的脚本。\n\
    * 允许来自 nexus.ensighten.com 的脚本。\n\n"
- fmt: "\nWhile `script-src` can be configured to allow inline scripts via the `'unsafe-inline'`\
    \ flag, that’s a bad idea. You can move these scripts into separate files, or\
    \ you can still use inline scripts if you use a `nonce` in your CSP header. In\
    \ cryptography, a `nonce` is a random number to be used only once ([http://bkaprt.com/rjs39/07-19](http://bkaprt.com/rjs39/07-19)).\n\
    \nRegarding CSP, a `nonce` must be randomly generated on every request as a base64-encoded\
    \ string ([http://bkaprt.com/rjs39/07-20](http://bkaprt.com/rjs39/07-20)) and\
    \ sent as part of the `script-src` directive:\n\n```\nContent-Security-Policy:\
    \ script-src 'self' https://nexus.ensighten.com 'nonce-aWJ1ZmFiaXVhc2RjYmk='\n\
    ```\n\nFrom there, inline `<script>` elements must have their `nonce` attribute\
    \ set to the same nonce set in the CSP header:\n\n```\n<script nonce=\"aWJ1ZmFiaXVhc2RjYmk=\"\
    >\n```\n\n```\n // A trusted inline script\n```\n\n```\n</script>\n```\n\nIt’s\
    \ not trivial to implement, but then again, security is no trivial matter. Generating\
    \ nonces requires an application backend. In PHP, this can be done with functions\
    \ like `random_bytes` ([http://bkaprt.com/rjs39/07-21](http://bkaprt.com/rjs39/07-21))\
    \ and `base64_encode` ([http://bkaprt.com/rjs39/07-22](http://bkaprt.com/rjs39/07-22)).\n\
    \n## `connect-src` \n\nAs we covered earlier, some third-party scripts may request\
    \ assets from other cross-origins you don’t know about. While it’s wise to restrict\
    \ which cross-origin scripts are loaded via `script-src`, it’s also worth restricting\
    \ which assets *those* scripts load. That’s where `connect-src` comes into play.\n\
    \nWhen it comes to third-party assets, it might not be practical to restrict the\
    \ `connect-src`’s allowable origins to `'self'`. A decent start may be to restrict\
    \ resources loaded from scripts from any secure origin. Building on our CSP, here’s\
    \ what that would look like:\n\n```\nContent-Security-Policy: default-src 'self'\
    \ https:; script-src 'self' https://nexus.ensighten.com; connect-src: 'self' https:\n\
    ```\n\nThis is a start, but consider placing further restrictions on additional\
    \ cross-origins as you gain better insight into which ones your third-party scripts\
    \ load other scripts from. This is the most difficult part of crafting a good\
    \ CSP; it takes time and effort.\n\nThankfully, there’s an approach you can take\
    \ that doesn’t *enforce* a CSP, but merely reports when violations do occur—which\
    \ is perfect when you want to catch potential CSP violations on a given page,\
    \ but don’t want to inadvertently impact page functionality!\n\n## Incremental\
    \ adoption with CSP reporting\n\nLet’s say you’re in a situation where you can’t\
    \ enforce a CSP yet, but you’d like to know when violations of it occur. There\
    \ are two CSP features that can assist you in that effort:\n\n1. The `Content-Security-Policy-Report-Only`\
    \ header\n2. The `report-to` policy directive\n\nThe `Content-Security-Policy-Report-Only`\
    \ header takes the same format as `Content-Security-Policy`, only it doesn’t enforce\
    \ a CSP. Rather, it raises warnings when violations occur. Using this header in\
    \ conjunction with the `report-to` policy directive lets you transmit violations\
    \ and their associated data to an endpoint for review.\n\nSo, let’s say your CSP\
    \ is working, but you want to refine your `connect-src` policy directive without\
    \ breaking stuff. Therefore, you’ve decided to adopt a CSP with a sole `connect-src`\
    \ policy directive of `'self' https:`, but add the other directives plus a refined\
    \ `connect-src` policy directive to the `Content-Security-Policy-Report-Only`\
    \ header:\n\n```\nContent-Security-Policy-Report-Only: default-src 'self' https:;\
    \ script-src 'self ' https://nexus.ensighten.com; connect-src: 'self' https://nexus.ensighten.com\
    \ https://www.googletagmanager.com; report-to compuglobalhypermeganet\n```\n\n\
    Here, we’re saying that scripts are allowed from nexus.ensighten.com and googletagmanager.com,\
    \ but, knowing how third-party scripts might grab assets from all sorts of cross-origins,\
    \ we want to be notified if a third-party script requests assets from cross-origins\
    \ we haven’t seen before.\n\nTo be notified when violations of this report-only\
    \ policy do occur, we add an additional `report-to` directive that specifies a\
    \ group name. A group name can be anything we want so long as it correlates with\
    \ a JSON payload we send in the accompanying `Report-To` header:\n\n```\nReport-To:\
    \ {\"group\": \"compuglobalhypermeganet\", \"max_age\": 3600, \"endpoints\": [{\"\
    url\": \"https://compuglobalhypermega.net/csp-report.php\"}]}\n```\n\nThis JSON\
    \ payload specifies the following information:\n\n* `group`, which is the group\
    \ name in the `report-to` directive\n* `max_age`, which is how long (in seconds)\
    \ the browser should send reports\n* `endpoints`, which is an array of endpoints\
    \ to send data\n\nIn this case, the CSP won’t be enforced when violations occur,\
    \ but details of those violations will be reported from `Content-Security-Policy-Report-Only`\
    \ to `Content-Security-Policy`. Crafting a CSP is a slow and steady process, but\
    \ the work pays off in the form of a safer user experience. More than any other\
    \ quality, vigilance is truly what it takes to use JavaScript responsibly.\n\n\
    ## Forewarned Is Forearmed\n\nIt’s already a slog to make sure our first-party\
    \ JavaScript isn’t goofing up for users. It can be exhausting to feel like you\
    \ have to be vigilant not only about threats from within, but also from without.\
    \ Yet this is the work we must do. So we need to move with care when it comes\
    \ to third-party JavaScript we can’t control. We must identify JavaScript-borne\
    \ performance problems, and do our best to remedy them, just as we would.\n\n\
    # Conclusion\n\nWhen you put this book down and head back to your daily work,\
    \ I hope you understand that the aim of *Responsible JavaScript* isn’t to lament\
    \ or condemn our industry’s collective use of JavaScript but to provide a path\
    \ for developing sustainably for the web. We may answer daily to engineering managers,\
    \ product stakeholders, and our colleagues, but the primary responsibility of\
    \ our work is to the people we build for.\n\nThe web is an indispensable tool\
    \ that connects people, expedites our daily work, and provides portals to support\
    \ us during times of crisis. How we choose to use JavaScript affects how people\
    \ navigate through life.\n\nOurs is a difficult job, one that calls on us to embody\
    \ the spirit of incremental progress. If your website has issues with JavaScript\
    \ performance, it’s going to take time and effort to get things running smoothly.\
    \ Do what you can today to make tomorrow a little better for folks, knowing that,\
    \ over time, you’ll make incredible progress.\n\nI wish you—I wish us—luck.\n\n\
    # Acknowledgments\n\nI’ve written books before, and this book was more work than\
    \ any of the others. A Book Apart cares about the quality of their materials,\
    \ and their editorial process reflects that. It’s a great honor to be part of\
    \ such a great publisher’s lineup of books and work with the people who make them\
    \ great.\n\nTo kick off this gratitude tour, I’d like to thank Lisa Maria Marquis\
    \ and Mat Marquis, the power couple behind the editing arm of A Book Apart. Lisa\
    \ was the best sort of cheerleader. She poked holes in all the places where holes\
    \ needed to be poked, but also heard out my worst insecurities and fears that\
    \ come with this kind of project. Mat was a delight to work with. When he wasn’t\
    \ messing with drip pans, keeping bees, dipping into weird botany, or wrangling\
    \ foodstuffs, he gave this manuscript the proper drubbing it needed.\n"
  raw: "While `script-src` can be configured to allow inline scripts via the `'unsafe-inline'`\
    \ flag, that’s a bad idea. You can move these scripts into separate files, or\
    \ you can still use inline scripts if you use a nonce in your CSP header. In cryptography,\
    \ a *nonce* is a random number to be used only once ([http://bkaprt.com/rjs39/07-19](http://bkaprt.com/rjs39/07-19)).\n\
    \nRegarding CSP, a nonce must be randomly generated on every request as a base64-encoded\
    \ string ([http://bkaprt.com/rjs39/07-20](http://bkaprt.com/rjs39/07-20)) and\
    \ sent as part of the `script-src`  directive:\n\n```\nContent-Security-Policy:\
    \ script-src 'self' https://nexus.ensighten.com 'nonce-aWJ1ZmFiaXVhc2RjYmk='\n\
    ```\n\nFrom there, inline `<script>` elements must have their `nonce` attribute\
    \ set to the same nonce set in the CSP header:\n\n```\n<script nonce=\"aWJ1ZmFiaXVhc2RjYmk=\"\
    >\n```\n\n```\n // A trusted inline script\n```\n\n```\n</script>\n```\n\nIt’s\
    \ not trivial to implement, but then again, security is no trivial matter. Generating\
    \ nonces requires an application backend. In PHP, this can be done with functions\
    \ like `random_bytes` ([http://bkaprt.com/rjs39/07-21](http://bkaprt.com/rjs39/07-21))\
    \ and `base64_encode` ([http://bkaprt.com/rjs39/07-22](http://bkaprt.com/rjs39/07-22)).\n\
    \n### `c``onnect-src`\n\nAs we covered earlier, some third-party scripts may request\
    \ assets from other cross-origins you don’t know about. While it’s wise to restrict\
    \ which cross-origin scripts are loaded via `script-src`, it’s also worth restricting\
    \ which assets *those* scripts load. That’s where `connect-src` comes into play.\n\
    \nWhen it comes to third-party assets, it might not be practical to restrict the\
    \ `connect-src`’s allowable origins to `'self'`. A decent start may be to restrict\
    \ resources loaded from scripts from any secure origin. Building on our CSP, here’s\
    \ what that would look like:\n\n```\nContent-Security-Policy: default-src 'self'\
    \ https:; script-src 'self' https://nexus.ensighten.com; connect-src: 'self' https:\n\
    ```\n\nThis is a start, but consider placing further restrictions on additional\
    \ cross-origins as you gain better insight into which ones your third-party scripts\
    \ load other scripts from. This is the most difficult part of crafting a good\
    \ CSP; it takes time and effort.\n\nThankfully, there’s an approach you can take\
    \ that doesn’t *enforce* a CSP, but merely reports when violations do occur—which\
    \ is perfect when you want to catch potential CSP violations on a given page,\
    \ but don’t want to inadvertently impact page functionality!\n\n### Incremental\
    \ adoption with CSP reporting\n\nLet’s say you’re in a situation where you can’t\
    \ enforce a CSP yet, but you’d like to know when violations of it occur. There\
    \ are two CSP features that can assist you in that effort:\n\n1.  The `Content-Security-Policy-Report-O``nly`\
    \ header\n\n2.  The `report-to` policy directive\n\nThe `Content-Security-Policy-Report-Only`\
    \ header takes the same format as `Content-Security-Policy`, only it doesn’t enforce\
    \ a CSP. Rather, it raises warnings when violations occur. Using this header in\
    \ conjunction with the `report-to` policy directive lets you transmit violations\
    \ and their associated data to an endpoint for review.\n\nSo, let’s say your CSP\
    \ is working, but you want to refine your `connect-src` policy directive without\
    \ breaking stuff. Therefore, you’ve decided to adopt a CSP with a sole `connect-src`\
    \ policy directive of `'self' https:`, but add the other directives plus a refined\
    \ `connect-src` policy directive to the `Content-Security-Policy-Report-On``ly`\
    \ header:\n\n```\nContent-Security-Policy-Report-Only: default-src 'self' https:;\
    \ script-src 'self ' https://nexus.ensighten.com; connect-src: 'self' https://nexus.ensighten.com\
    \ https://www.googletagmanager.com; report-to compuglobalhypermeganet\n```\n\n\
    Here, we’re saying that scripts are allowed from nexus.ensighten.com and googletagmanager.com,\
    \ but, knowing how third-party scripts might grab assets from all sorts of cross-origins,\
    \ we want to be notified if a third-party script requests assets from cross-origins\
    \ we haven’t seen before.\n\nTo be notified when violations of this report-only\
    \ policy do occur, we add an additional `report-to` directive that specifies a\
    \ group name. A group name can be anything we want so long as it correlates with\
    \ a JSON payload we send in the accompanying `Report-``To` header:\n\n```\nReport-To:\
    \ {\"group\": \"compuglobalhypermeganet\", \"max_age\": 3600, \"endpoints\": [{\"\
    url\": \"https://compuglobalhypermega.net/csp-report.php\"}]}\n```\n\nThis JSON\
    \ payload specifies the following information:\n\n*   `group`, which is the group\
    \ name in the `report-to` directive\n\n*   `max_age`, which is how long (in seconds)\
    \ the browser should send reports to the associated collection endpoint\n\n* \
    \  `endpoints`, which is an array of endpoints to send collection data to\n\n\
    In this case, the CSP won’t be enforced when violations occur, but details of\
    \ those violations will be reported. From here, we can make an informed decision\
    \ about how and when the policy can be migrated from `Content-Security-Policy-Report-Only`\
    \ to `Content-Securi``ty-Policy`.\n\nCrafting a CSP is a slow and steady process,\
    \ but the work pays off in the form of a safer user experience. As performance-focused\
    \ as this book is, security is also a component of a good user experience, and\
    \ just one more part of using JavaScript responsibly.\n\n## Forewarned Is Forearmed\n\
    \nIt’s already a slog to make sure our first-party JavaScript isn’t goofing things\
    \ up for users. It can be exhausting to feel like you have to be vigilant not\
    \ only about threats from within, but also from without.\n\nYet this is the work\
    \ we must do. So we need to move with care when it comes to third-party JavaScript\
    \ we can’t control. We must identify JavaScript-borne performance problems, and\
    \ do our best to remedy them, just as we would for any other hitch in the websites\
    \ in our charge. More than any other quality, vigilance is truly what it takes\
    \ to use JavaScript responsibly.\n\n# Conclusion\n\nWhen you put this book down\
    \ and head back to your daily work, I hope you understand that the aim of *Responsible\
    \ JavaScript* isn’t to lament or condemn our industry’s collective use of JavaScript\
    \ but to provide a path for developing more sustainably for the web. We may answer\
    \ daily to engineering managers, product stakeholders, and our colleagues, but\
    \ the primary responsibility of our work is to the people we build for.\n\nThe\
    \ web is an indispensable tool that connects people, expedites our daily work,\
    \ and provides portals to support us during times of crisis. How we choose to\
    \ use JavaScript affects how people navigate through life.\n\nOurs is a difficult\
    \ job, one that calls on us to embody the spirit of incremental progress. If your\
    \ website has issues with JavaScript performance, it’s going to take time and\
    \ effort to get things running smoothly. Do what you can today to make tomorrow\
    \ a little better for folks, knowing that, over time, you’ll make incredible progress.\n\
    \nI wish you—I wish us—luck.\n\n# Acknowledgments\n\nI’ve written books before,\
    \ and this book was more work than any of the others. A Book Apart cares about\
    \ the quality of their materials, and their editorial process reflects that. It’s\
    \ a great honor to be part of such a great publisher’s lineup of books and work\
    \ with the people who make them great.\n\nTo kick off this gratitude tour, I’d\
    \ like to thank Lisa Maria Marquis and Mat Marquis, the power couple behind the\
    \ editing arm of A Book Apart. Lisa was the best sort of cheerleader. She poked\
    \ holes in all the places where holes needed to be poked, but also heard out my\
    \ worst insecurities and fears that come with this kind of project. Mat was a\
    \ delight to work with. When he wasn’t messing with drip pans, keeping bees, dipping\
    \ into weird botany, or wrangling foodstuffs, he gave this manuscript the proper\
    \ drubbing it needed."
