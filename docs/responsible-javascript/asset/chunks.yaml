  raw: 'FID isn’t strictly a JavaScript metric. Interactions that don’t rely on JavaScript
    (links, form controls, and so forth) still factor into the metric’s calculation.
    If you rely significantly on JavaScript to drive interactivity, however, FID may
    well reflect that.


    FID seems simplistic at first glance, but identifying the cause behind a high
    FID score gets tough. The first interaction with a page will vary from person
    to person. Someone on a fast device may present with a high FID score because
    of excessive JavaScript activity, while someone on the same page with a slow device
    may show a low FID score because they interacted with the page while the main
    thread was quiet.


    One way to troubleshoot high FID values is to contextualize them so that you know
    what’s happening at the time of the input delay. You can record long tasks from
    the Long Task API ([http://bkaprt.com/rjs39/03-08](http://bkaprt.com/rjs39/03-08))
    occurring around the time of the FID itself. This is what I’ve done in a small
    metrics collection script I built ([http://bkaprt.com/rjs39/03-09](http://bkaprt.com/rjs39/03-09)).


    Being a field metric, FID yields a wide range of values, so it’s sensible to focus
    on the 95th percentile of those values ([http://bkaprt.com/rjs39/03-10)](http://bkaprt.com/rjs39/03-10)).
    This strategy prioritizes those experiencing extreme input latency.


    #### Total Blocking Time


    While TTI and FID are all fine and good, they don’t measure the *total* amount
    of time the main thread is too busy to take on more work during startup. This
    is where *Total Blocking Time (TBT)* comes in—a lab metric that measures the window
    of time between a page’s FCP and TTI. Where TTI and FID measure distinct points
    in time, TBT looks at the total blocking time of all the long tasks in that window.


    To recap, a *long task* is any JavaScript activity exceeding 50 milliseconds.
    The *blocking time* of a long task is calculated by subtracting 50 milliseconds
    from the total time (Fig 3.6). If a long task runs for 127 milliseconds, its blocking
    time is 77 milliseconds.


    ![A task visualized as a gray bar, with blocking time represented with a red stripe
    overlay on the last two-thirds of the bar.](image/3.6.png)


    Fig 3.6: The blocking time of a long task, illustrated. Blocking time is the long
    task’s length minus 50 milliseconds.


    This means that TBT doesn’t penalize *all* JavaScript activity—just *excessive*
    activity. If your site performs many tasks less than or equal to 50 milliseconds
    during startup, your TBT score would be zero. TBT also gives vital context for
    poor TTI scores.


    A good TBT score is 300 milliseconds or less on average mobile hardware ([http://bkaprt.com/rjs39/03-11](http://bkaprt.com/rjs39/03-11)).
    Again, shoot for the lowest score possible. Always measure TBT in synthetic testing
    tools that use low- to mid-tier devices or CPU throttling, and avoid testing on
    fast devices. WebPageTest runs its tests on one of a broad range of physical devices
    in different locations, and reports TBT in its results summary (Fig 3.7).


    ![Example of a web vitals report that includes largest contentful paint, cumulative
    layout shift, and total blocking time.](image/3.7.png)


    Fig 3.7: WebPageTest’s Web Vitals summary includes TBT, as well as LCP and CLS.


    You’re probably left wondering what you can do specifically to improve your website’s
    performance metrics. Before we can go down that long road, we’ll need to look
    at performance profilers so you can learn how to find specific opportunities for
    improvement.


