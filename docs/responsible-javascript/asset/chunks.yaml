  trans: "\n\n具体来说：我编写了一个 Codepen 示例，展示了如何创建一个基于 Grid Layout（网格布局）的演示界面，它能够自动填充空白区域的元素（[`bkaprt.com/rjs39/06-03`](http://bkaprt.com/rjs39/06-03)）。标记由一个包含许多\
    \ `<li>` 元素的 `<ul>` 组成，这些元素包含了黄马的图片（图 6.2）。`<ul>` 本身的样式如下：\n\n![一张黄马图片的“砖墙式”网格布局，带有毫米为单位的尺寸。标题：“我最喜欢的几种翅目虫。”](img/6.2.png)\n\
    \n图 6.2：一个完全响应式的网格布局示例，它会根据视口宽度自动填充元素。\n\n```css\nul {\n  display: grid;\n  grid-gap:\
    \ 1rem;\n  grid-auto-flow: dense;\n  max-width: 72rem;\n  margin: 0 auto;\n  grid-template-columns:\
    \ repeat(auto-fit, minmax(12rem, 1fr));\n  grid-auto-rows: 12rem;\n}\n```\n\n\
    如果你不熟悉 Grid Layout，这些规则比你想象的要简洁得多。在所有设备上，它都会创建一个遵循以下规则的完全响应式网格布局：\n\n*   `<ul>`\
    \ 的每一行将根据当前视口宽度包含尽可能容纳的列。\n*   每一列的宽度至少为 192 像素（`12rem`），但可以扩展到等比例的一个分数单位的大小（[`bkaprt.com/rjs39/06-04`](http://bkaprt.com/rjs39/06-04)）。\n\
    *   行会根据需要自动添加，每行的高度为 192 像素（`12rem`）。此外，通过 `grid-auto-flow: dense;` 规则，新项目将密集地填充在任何可以容下的地方。\n\
    \n随后，我们将在屏幕尺寸大于 448 像素（`28rem`）时，对 `<ul>` 的 `<li>` 子元素使用 `:nth-child` 选择器，并包含两个额外的\
    \ Grid Layout 属性，来让布局增加一些活力：\n\n```css\n@media screen and (min-width: 28rem) {\n\
    \  li:nth-child(4n + 4) {\n    grid-column: span 2;\n    grid-row: span 2;\n \
    \ }\n}\n```\n\n抛开这些不谈，这是纯粹的 CSS！没有理由去寻求那些加载了过多必要 CSS 的现成布局解决方案——面对事实吧，如果你加载了更多的\
    \ CSS，留给 JavaScript 的空间就越少。Grid Layout 也得到了良好的支持（[`bkaprt.com/rjs39/06-05`](http://bkaprt.com/rjs39/06-05)）。更好的是，它不会将你局限于简单的布局（图\
    \ 6.3）。\n\n![一个文本密集的网格布局；页面内容倾斜了 45 度。](img/6.3.png)\n\n图 6.3：在大屏幕上显示的 Jen Simmons\
    \ 布局实验室的由 CSS Grid Layout 驱动的落地页（[`bkaprt.com/rjs39/06-06`](http://bkaprt.com/rjs39/06-06)）。\n\
    \n如果你想构建真正引人注目、突破我们对 Web 视觉边界的布局，CSS 框架为你抽象了太多的 CSS 特性和复杂选择器，导致你无法充分利用它们。关于关于现代\
    \ CSS 布局模式的更多阅读，请查看资源部分。\n\n### 懒加载，现在由 HTML 呈现\n\n懒加载是一种跨越时代的性能模式。它不仅节省带宽，还能减少启动时对其他关键资源（包括\
    \ JavaScript！）的带宽竞争。\n\n在 Web 的长发展，懒加载很大程度上一直是 JavaScript 的任务。现在大多数情况下我们不需要 JavaScript\
    \ 来实现这一点，因为 HTML 本身提供了一种懒加载 `<img>` 和 `<iframe>` 元素引用资源的方法。这是好事，因为 JavaScript\
    \ 驱动的懒加载其潜在缺点无处不在：\n\n*   不可避免，所有基于 JavaScript 的懒加载器都需要主线程时间。\n*   如果用户禁用了 JavaScript，你需要\
    \ `<noscript>` 回退标记。这会为你的标记增加许多额外的字节（[`bkaprt.com/rjs39/06-07`](http://bkaprt.com/rjs39/06-07)）。\n\
    *   除了某些可能禁用了 JavaScript 之外，某些网络或浏览器插件可能会阻止 JavaScript——或者你的懒加载器可能完全无法加载。\n* \
    \  图片——无论是否懒加载——在 `<img>` 元素都需要 `width` 和 `height` 属性以防止布局偏移。如果你忘记这样做，你网站的累计布局偏移（CLS，见第\
    \ 3 章）得分可能会降低。\n*   除非你考虑到检查搜索引擎，否则懒加载的媒体不会被搜索引擎索引（[`bkaprt.com/rjs39/06-08`](http://bkaprt.com/rjs39/06-08)）。\n\
    \n## 观察这个\n\n各种观察者 API（Observer APIs）遵循类似的模式来观察页面某些方面的变化：它们观察一个目标（例如 DOM 节点），每当检测到目标发生变化时，就会运行回调函数。\n\
    \n观察者值得学习，因为它们取代了过去的反模式，即我们浪费资源，比如不断轮询元素的可见性。观察者将昂贵的工作变为廉价的工作（图 6.4）。\n\n说到检查元素可见性，让我们从这里开始。有时你需要\
    \ JavaScript 来告诉某些内容是否在视口内。使用 Intersection Observer API 的常见例子是懒加载媒体。\n\n“但是，”你坚持道，“你刚刚说\
    \ HTML 已经处理了这一点！”确实如此！但仅针对 `<iframe>` 和 `<img>` 元素，而这些并不是你可以懒加载的唯一东西。`<video>`\
    \ 元素的占位图该怎么办？\n\n```html\n<video width=\"500\" height=\"257\" poster=\"cats-being-jerks.jpg\"\
    >\n  <source src=\"cats-being-jerks.webm\" type=\"video/webm\">\n  <source src=\"\
    cats-being-jerks.mp4\" type=\"video/mp4\">\n</video>\n```\n\n"
- fmt: "\nIf you’re unfamiliar with `<video>` image placeholders, this is how they\
    \ work: if you have a video that doesn’t play automatically, you point its `poster`\
    \ attribute to an image that will display until the video is played.\n\nSay you\
    \ have an article with a bunch of inline videos with placeholder images—that’s\
    \ a fair bit of data right there. You can lazy-load video `poster` images by swapping\
    \ the `poster` attribute for an equivalent `data-` attribute, which contains the\
    \ URL of the placeholder image to be loaded:\n\n```html\n<video width=\"500\"\
    \ height=\"257\" data-poster=\"cats-being-jerks.jpg\">\n```\n\nThe rest of the\
    \ work involves the `Intersection Observer API`, which, for this use case, looks\
    \ something like this:\n\n```javascript\nconst videoObserver = new IntersectionObserver((entries,\
    \ observer) => {\n  entries.forEach(entry => {\n    if (entry.isIntersecting ||\
    \ entry.intersectionRatio) {\n      const video = entry.target;\n      video.setAttribute(\"\
    poster\", video.dataset.poster);\n      video.removeAttribute(\"data-poster\"\
    );\n      observer.unobserve(video);\n    }\n  });\n});\n\nconst videos = document.querySelectorAll(\"\
    video[data-poster]\");\nvideos.forEach(video => {\n  videoObserver.observe(video);\n\
    });\n```\n\nHere’s what’s going on in the snippet:\n\n1. We create an `IntersectionObserver`\
    \ instance and assign it to a variable named `videoObserver`.\n2. The `IntersectionObserver`\
    \ instance takes a callback as an argument. The callback has two arguments: first,\
    \ the collection of visibility changes detected—our `<video>` elements, in this\
    \ case—and second, the `IntersectionObserver` instance itself.\n3. Within the\
    \ callback, we loop over the `entries`. If it’s found that any of the `<video>`\
    \ elements are currently in the viewport, we read the final image URL from the\
    \ `data-poster` attribute and populate the element’s `poster` attribute with it.\
    \ Afterward, we tell the `IntersectionObserver` instance to stop observing the\
    \ element.\n4. We then select all `<video>` elements with a `data-poster` attribute,\
    \ and then tell the newly created `IntersectionObserver` instance to observe them\
    \ for changes.\n\nWith this code, we’re left with a lazy-loading solution that\
    \ puts grueling work where it belongs: in the browser’s internals, where that\
    \ work can be done more efficiently.\n\nThis is a simplistic (but effective!)\
    \ Intersection Observer example. Intersection Observer can monitor changes in\
    \ a variety of ways, including having its scope of observation restricted, observing\
    \ partial visibility of elements, and more ([http://bkaprt.com/rjs39/06-11](http://bkaprt.com/rjs39/06-11)).\
    \ Its potential utility is huge; if you can think of any situation where you’d\
    \ want to monitor an element’s visibility, and then perform some work when its\
    \ visibility changes, Intersection Observer is the right tool for the job, and\
    \ it does that job *fast*.\n\nIntersection Observer isn’t the only observer in\
    \ town. We also have `Mutation Observer` to detect if changes have occurred in\
    \ the DOM, `Resize Observer` to detect if the size of an element has changed,\
    \ and `Performance Observer` to detect if new entries have been added to performance\
    \ APIs such as `Navigation` or `Resource Timing`. To get information on them,\
    \ thumb to the Resources section at the end of the book.\n\n## Observing Idle\
    \ Time\n\nThink of the different tasks involved in making a pizza. You might have\
    \ tasks that require active and continuous focus until you’re finished, like making\
    \ the dough and adorning it with sauce and toppings. Then there are tasks like\
    \ putting the pizza in the oven, which doesn’t require your attention until it’s\
    \ finished baking.\n\nThe work we do in JavaScript can be similarly categorized.\
    \ Actions dispatched by the user—such as opening a navigation menu or validating\
    \ a form—are good examples of critical tasks that demand immediate attention.\n\
    \nBut tasks that aren’t user-driven, like sending analytics data to a collection\
    \ endpoint, don’t demand immediate attention. These tasks should be deprioritized\
    \ to free up more main-thread time for those that *are* critical. That’s where\
    \ `requestIdleCallback` comes in handy.\n\n### Wait for it: Idle callbacks\n\n\
    `requestIdleCallback` is like `setTimeout` in that you pass a callback function\
    \ as the first parameter:\n\n```javascript\nrequestIdleCallback(() => {\n  //\
    \ Run this callback when the browser is idle.\n});\n```\n\nUnlike `setTimeout`,\
    \ though, you can optionally pass an object with a timeout value in milliseconds\
    \ for the second parameter:\n\n```javascript\nrequestIdleCallback(() => {\n  //\
    \ Run this callback when the browser is idle,\n  // but run it within the next\
    \ five seconds.\n}, {\n  \"timeout\": 5000\n});\n```\n\nAlso unlike `setTimeout`,\
    \ `requestIdleCallback` doesn’t defer a callback’s execution to a specified time\
    \ in the future. The first parameter is an *idle callback,* meaning it will be\
    \ executed when the main thread is idle. If a timeout is never passed to `requestIdleCallback`,\
    \ then the callback runs if—and only if—the main thread is idle. If a time is\
    \ specified, then the callback must run by then, or it will be run at the deadline.\n\
    \nThere are many opportunities to use `requestIdleCallback` to defer noncritical\
    \ main-thread work, but let’s start simple. Each page uses `requestIdleCallback`\
    \ to write the accordion’s open/closed state to `localStorage` for return visitors\
    \ ([http://bkaprt.com/rjs39/06-11](http://bkaprt.com/rjs39/06-11)).\n\nThis function\
    \ retrieves the open/closed state on subsequent views:\n\n```javascript\nfunction\
    \ setTOCState(detailsElement) {\n  const tocStateJSON = localStorage.getItem(\"\
    toc-state\");\n  const tocState = tocStateJSON === null ? [] : JSON.parse(tocStateJSON);\n\
    \  const currentPathIndex = tocState.indexOf(document.location.pathname);\n\n\
    \  if (!detailsElement.open) {\n    tocState.push(document.location.pathname);\n\
    \  } else if (detailsElement.hasAttribute(\"open\") && currentPathIndex !== -1)\
    \ {\n    tocState.splice(currentPathIndex, 1);\n  }\n  localStorage.setItem(\"\
    toc-state\", JSON.stringify(tocState));\n}\n```\n\nThis function is passed as\
    \ a callback to `requestIdleCallback` when the table of contents’ `<details>`\
    \ element is clicked:\n\n```javascript\nconst detailsElement = document.querySelector(\"\
    details.v-toc\");\ndetailsElement.addEventListener(\"toggle\", () => {\n  if (\"\
    requestIdleCallback\" in window) {\n    requestIdleCallback(() => {\n      setTOCState(detailsElement);\n\
    \    });\n    return;\n  }\n});\n```\n"
