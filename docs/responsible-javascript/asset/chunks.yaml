    We cover the emerging and essential topics in web design and development with
    style, clarity, and above all, brevity—because working designer-developers can’t
    afford to waste time.


    ## Colophon


    The text is set in FF Yoga and its companion, FF Yoga Sans, both by Xavier Dupré.
    Headlines and cover are set in Titling Gothic by David Berlow.


    ## About the Author


    ![](image/Jeremy_Wagner.png)


    `Jeremy Wagner` is more of a writer than a web developer, but he does both anyway.
    On top of making websites for longer than he thought probable, he has written
    for A List Apart, Google, and CSS-Tricks, and is the author of `Responsible JavaScript`.
    Jeremy will someday relocate to the remote wilderness where sand has not yet been
    taught to think. Until then, he continues to reside in Minnesota’s Twin Cities
    with his wife and stepdaughters, bemoaning the existence of strip malls.

