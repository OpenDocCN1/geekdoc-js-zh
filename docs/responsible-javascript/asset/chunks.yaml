  trans: "\n\n如果你不熟悉 `<video>` 图像占位符，它们的工作原理如下：如果你有一个不会自动播放的视频，你可以将其 `poster` 属性指向一张图像，该图像将在视频播放前一直显示。\n\
    \n假设你有一篇文章，其中有很多带有占位符图像的内联视频——这可是大量的数据。你可以通过将 `poster` 属性替换为等效的 `data-` 属性来懒加载视频海报图像，该属性包含了要加载的占位符图片的\
    \ URL：\n\n```html\n<video width=\"500\" height=\"257\" data-poster=\"cats-being-jerks.jpg\"\
    >\n```\n\n剩余的工作涉及 `Intersection Observer API`，对于这种用例，它看起来如下：\n\n```javascript\n\
    const videoObserver = new IntersectionObserver((entries, observer) => {\n  entries.forEach(entry\
    \ => {\n    if (entry.isIntersecting || entry.intersectionRatio) {\n      const\
    \ video = entry.target;\n      video.setAttribute(\"poster\", video.dataset.poster);\n\
    \      video.removeAttribute(\"data-poster\");\n      observer.unobserve(video);\n\
    \    }\n  });\n});\n\nconst videos = document.querySelectorAll(\"video[data-poster]\"\
    );\nvideos.forEach(video => {\n  videoObserver.observe(video);\n});\n```\n\n以下是代码段中正在发生的情况：\n\
    \n1. 我们创建了一个 `IntersectionObserver` 实例并将其赋值给名为 `videoObserver` 的变量。\n2. `IntersectionObserver`\
    \ 实例接受一个回调函数作为参数。该回调有两个参数：首先是检测到的可见性变化集合——在本例中是我们的 `<video>` 元素——其次是 `IntersectionObserver`\
    \ 实例本身。\n3. 在回调内部，我们遍历 `entries`。如果发现任何 `<video>` 元素当前位于视口内，我们就从 `data-poster`\
    \ 属性中读取最终图像 URL，并将其填充到元素的 `poster` 属性中。之后，我们告诉 `IntersectionObserver` 实例停止观察该元素。\n\
    4. 然后我们选择所有带有 `data-poster` 属性的 `<video>` 元素，告诉新创建的 `IntersectionObserver` 实例观察它们的变化。\n\
    \n通过这段代码，我们得到了一个懒加载解决方案，将繁重的工作交给了它该去的地方：浏览器内部，那里这些工作可以更高效地完成。\n\n这是一个简单（但有效！）的\
    \ Intersection Observer 示例。Intersection Observer 可以通过多种方式监控变化，包括限制其观察范围、观察元素的部分可见性等（[`bkaprt.com/rjs39/06-11`](http://bkaprt.com/rjs39/06-11)）。它的潜在用途是巨大的；如果你能想到任何想要监控元素可见性、并在可见性变化时执行某些工作的情况，那么\
    \ Intersection Observer 就是完成该任务的正确工具，而且它的执行速度*非常快*。\n\nIntersection Observer 并不是这里唯一的观察者。我们还有\
    \ `Mutation Observer` 用于检测 DOM 是否发生了变化，`Resize Observer` 用于检测元素大小是否发生变化，以及 `Performance\
    \ Observer` 用于检测是否有新条目被添加到 `Navigation` 或 `Resource Timing` 等性能 API 中。要获取有关它们的更多信息，请参阅书末的“资源（Resources）”章节。\n\
    \n## 观察空闲时间\n\n想象一下制作披萨涉及的不同任务。你可能有一些需要活跃且持续关注直到完成的任务，比如揉面团并点上酱料和配料。然后还有像把披萨放入烤箱这样的任务，在烘烤完成之前不需要你的注意力。\n\
    \n我们在 JavaScript 中做的工作可以进行类似的分类。由用户分发的操作——例如打开导航菜单或验证表单——是需要立即关注的关键任务的良好示例。\n\n\
    但不是由用户驱动的任务（例如将分析数据发送到收集端点）并不需要立即关注。这些任务应该降低优先级，以便为那些*确实*关键的任务释放出更多主线程时间。这就是 `requestIdleCallback`\
    \ 派上用场的地方。\n\n### 等一等：空闲回调\n\n`requestIdleCallback` 类似于 `setTimeout`，你将一个回调函数作为第一个参数传递它：\n\
    \n```javascript\nrequestIdleCallback(() => {\n  // 当浏览器空闲时运行此回调。\n});\n```\n\n\
    但与 `setTimeout` 不同，你还可以选择地传递一个带有毫秒级超时值的对象作为第二个参数：\n\n```javascript\nrequestIdleCallback(()\
    \ => {\n  // 当浏览器空闲时运行此回调，\n  // 但要在未来五秒内运行它。\n}, {\n  \"timeout\": 5000\n});\n\
    ```\n\n此外，与 `setTimeout` 不同，`requestIdleCallback` 并不会将回调的执行推到未来的某个指定时间。第一个参数是一个*空闲回调*，意味着它将在主线程空闲时执行。如果从未向\
    \ `requestIdleCallback` 传递超时时间，那么回调只有在——且仅当主线程空闲时才会运行。如果指定了时间，那么回调必须在该时间之前运行，否则它将在截止日期时运行。\n\
    \n有许多机会使用 `requestIdleCallback` 来推迟非关键的主线程工作，但让我们从简单的开始。每个页面都使用 `requestIdleCallback`\
    \ 将手风琴组件的打开/关闭状态写入 `localStorage`，以供回归访客使用（[`bkaprt.com/rjs39/06-11`](http://bkaprt.com/rjs39/06-11)）。\n\
    \n此函数在后续视图中获取打开/关闭状态：\n\n```javascript\nfunction setTOCState(detailsElement) {\n\
    \  const tocStateJSON = localStorage.getItem(\"toc-state\");\n  const tocState\
    \ = tocStateJSON === null ? [] : JSON.parse(tocStateJSON);\n  const currentPathIndex\
    \ = tocState.indexOf(document.location.pathname);\n\n  if (!detailsElement.open)\
    \ {\n    tocState.push(document.location.pathname);\n  } else if (detailsElement.hasAttribute(\"\
    open\") && currentPathIndex !== -1) {\n    tocState.splice(currentPathIndex, 1);\n\
    \  }\n  localStorage.setItem(\"toc-state\", JSON.stringify(tocState));\n}\n```\n\
    \n当目录的 `<details>` 元素被点击时，此函数被作为回调传递给 `requestIdleCallback`：\n\n```javascript\n\
    const detailsElement = document.querySelector(\"details.v-toc\");\ndetailsElement.addEventListener(\"\
    toggle\", () => {\n  if (\"requestIdleCallback\" in window) {\n    requestIdleCallback(()\
    \ => {\n      setTOCState(detailsElement);\n    });\n    return;\n  }\n});\n```\n\
    \n"
- fmt: "\n```\nsetTOCState(detailsElement);\n```\n\n```\n```\n\nThe `<details>` element’s\
    \ `toggle` event handler doesn’t drive the visibility toggling for the table of\
    \ contents, since we get that for free from HTML itself—but it *does* invoke `setTOCState`.\
    \ Within that, we check if `requestIdleCallback` is available. If so, we pass\
    \ `setTOCState` as an idle callback without a deadline (Fig 6.6). If `requestIdleCallback`\
    \ isn’t available, `setTOCState` will be run immediately.\n\n![Chrome performance\
    \ profiler timeline. “Fire idle callback” begins immedately after the parent “task”\
    \ begins, with “function call” immediately following.](image/6.6.png)\n\nFig 6.6:\
    \ The idle callback recording the visibility state of the table of contents on\
    \ the A11Y Project website as shown in Chrome’s performance profiler.\n\nWhen\
    \ idle callbacks are queued without a deadline, their order is first in/first\
    \ out. While this works just fine for the A11Y Project’s purposes, if the page\
    \ is unloaded before the idle callback runs, that work may never get done. If\
    \ idle callbacks *must* run, you’ll need to try a different tack.\n\n### Managing\
    \ idle callbacks with urgency\n\nManaging deadlines with `requestIdleCallback`\
    \ is hard. One way to do it is to register an idle callback without a deadline,\
    \ then cancel that idle callback and execute the initially deferred function immediately,\
    \ if the situation is urgent.\n\nSay you have a website that sends field data\
    \ to an endpoint. Since this is low-priority work, it should never interfere with\
    \ critical main-thread tasks. It may not be easy, but it’s doable. To start, we’ll\
    \ only send data to an endpoint sometime after the window’s `load` event fires.\
    \ This will keep the main thread free of lower-priority work during startup.\n\
    \nThe next part is trickier, though. Because idle callbacks without a deadline\
    \ may not run if the main thread is never free, we want it to run *before* the\
    \ page is unloaded. To accommodate this, we can use a function like so:\n\n```\n\
    function urgentIdleCallback (eventOwner, eventString, idleCallback) {\n  if (\"\
    requestIdleCallback\" in window) {\n    let callbackRan = false;\n    const idleCallbackHandle\
    \ = requestIdleCallback(() => {\n      idleCallback();\n      callbackRan = true;\n\
    \    });\n    eventOwner.addEventListener(eventString, () => {\n      if (!callbackRan)\
    \ {\n        cancelIdleCallback(idleCallbackHandle);\n        idleCallback();\n\
    \      }\n    }, {\n      once: true\n    });\n    return;\n  }\n  idleCallback();\n\
    }\n```\n\n`urgentIdleCallback` takes three parameters:\n\n1.  `eventString`, which\
    \ is, well, an event string (e.g., `\"click\"`).\n2.  `eventOwner`, which is the\
    \ owner of the event specified in `eventString`. This is any object on which `addEventListener`\
    \ is available.\n3.  `idleCallback`, which is the idle callback passed to `requestIdleCallback`.\n\
    \nWith the above parameters, `urgentIdleCallback` goes through the following routine:\n\
    \n1.  `urgentIdleCallback` first checks if `requestIdleCallback` is available.\
    \ If not, `idleCallback` runs immediately.\n2.  We track whether the idle callback\
    \ has already run in a variable named `callbackRan` which is initialized as `false`.\n\
    3.  The idle callback is registered with `requestIdleCallback`, which returns\
    \ a callback handle we use later if we need to cancel the idle callback. Within\
    \ the idle callback, `idleCallback` will run and we’ll set `callbackRan` to `true`.\n\
    4.  Because the idle callback may not run right away, we register an event listener\
    \ that serves as a deadline.\n5.  In the event’s callback, we check if the idle\
    \ callback has run. If not, we cancel the idle callback with `cancelIdleCallback`,\
    \ which accepts the handle stored earlier in `idleCallbackHandle`. The callback\
    \ then runs immediately.\n6.  Because we want the deadline event listener to fire\
    \ just once in this case, an options object is passed to `addEventListener` with\
    \ a key/value pair of `once: true`.\n\nNow we register our urgent idle callback\
    \ to run the `sendAnalytics` method, which transmits field data to a collection\
    \ endpoint:\n\n```\nurgentIdleCallback(window, \"pagehide\", sendAnalytics);\n\
    ```\n\nThis pattern could be used in several different situations. Just to spitball\
    \ a little here, you could initialize event handlers for actions that aren’t likely\
    \ to be taken right away. Or you could render client-side markup for below-the-fold\
    \ content.\n\nThis isn’t bleeding-edge stuff. Phil Walton popularized this as\
    \ the idle-until-urgent pattern ([http://bkaprt.com/rjs39/06-12](http://bkaprt.com/rjs39/06-12)).\
    \ Phil’s approach is syntactically different from mine, but it achieves similar\
    \ outcomes. He also offers a small npm package named `idlize`, which facilitates\
    \ this pattern, including idle callback queues ([http://bkaprt.com/rjs39/06-13](http://bkaprt.com/rjs39/06-13)).\n\
    \nJust remember one thing: Never use `requestIdleCallback` for stuff that *must*\
    \ happen immediately. Idle callbacks take longer to process in environments that\
    \ have less tolerance. `requestIdleCallback fallbacks\n\nDespite decent browser\
    \ support, `requestIdleCallback` isn’t everywhere ([http://bkaprt.com/rjs39/06-14](http://bkaprt.com/rjs39/06-14)).\
    \ While polyfills exist for `requestIdleCallback`, it can’t be faithfully replicated.\
    \ If you’re leaning in this direction, proceed carefully:\n\n*   You could go\
    \ the progressive enhancement route and run callbacks immediately in the absence\
    \ of `requestIdleCallback`. This works, but not everyone gets the same experience.\
    \ Regarding `requestIdleCallback`, I don’t think that’s such a bad thing—if you\
    \ must use `requestIdleCallback` with a deadline, one fallback could be `setTimeout`.\
    \ `setTimeout` isn’t apples to apples with `requestIdleCallback`, but might be\
    \ worth considering ([http://bkaprt.com/rjs39/06-15](http://bkaprt.com/rjs39/06-15)).\n\
    *   Finally—and this is the most direct method if other strategies won’t suffice—use\
    \ a polyfill, but with the understanding that any polyfill of `requestIdleCallback`\
    \ can’t faithfully emulate a native implementation ([http://bkaprt.com/rjs39/06-16](http://bkaprt.com/rjs39/06-16)).\n\
    \n## Going off the Main Thread\n\nThink of the main thread as being like the front\
    \ counter at a fast-food joint. When the whole joint’s understaffed, there are\
    \ not only too few employees to take orders, but also to cook the food to fulfill\
    \ them. The service worsens as orders accumulate and the employees can’t keep\
    \ up with them. Without adequate staff to support the front counter, service suffers.\n\
    \nIf the front-counter staff represents the main thread, you can think of everything\
    \ that supports them as something similar to a worker thread. Like the cooks well\
    \ behind the counter, worker threads are where *web workers* can keep the main\
    \ thread running smoothly when there’s much work to be done (Fig 6.7).\n\nWhile\
    \ uses for web workers abound, it can be a little difficult to know exactly what\
    \ you might use them for without a real-world example, so let’s explore one together.\n"
