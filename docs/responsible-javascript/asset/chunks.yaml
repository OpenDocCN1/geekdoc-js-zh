    \ via Wikimedia Commons.](image/5.1.png)\n\nFig 5.1: A cicada killer wasp with\
    \ a paralyzed cicada. Photograph by Judy Gallagher ([http://bkaprt.com/rjs39/05-01](http://bkaprt.com/rjs39/05-01)),\
