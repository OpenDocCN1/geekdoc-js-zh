    We sometimes celebrate when lines on graphs go up; this isn’t one of those times.
    Increasing the amount of JavaScript we ship results in poor user experiences and
    violates the Priority of Constituencies ([http://bkaprt.com/rjs39/01-05](http://bkaprt.com/rjs39/01-05)):


    > In case of conflict, consider users over authors over implementors over specifiers
    over theoretical purity.


    This quote hits bluntly: users always come first. Our preferences and comfort
    as developers are secondary. That’s a mission to take to heart while we figure
    out how we can use JavaScript more responsibly in an industry that relies on it
    more than ever.


    ## JavaScript’s Role in Performance


    Using JavaScript responsibly first requires an understanding of how browsers process
    it. It’s tempting to reduce a website’s performance to its transfer size.


    Yes, the page that sends fewer bytes will typically be faster than the one that
