    *   They can offload processing of large amounts of data to keep the main thread
    clear for other work. Mapbox GL ([http://bkaprt.com/rjs39/06-27](http://bkaprt.com/rjs39/06-27))
    does this with loading and rendering map data to ensure that user interactions
    are as smooth as they can be.


