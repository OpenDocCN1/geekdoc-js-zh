    Now for some good news! Modern component-based frameworks (e.g., `React`) can
    render component markup not only on the client but also on a JavaScript backend
    as a string. This makes it possible to use the same component code on both the
    client and the server, which is an improvement for both the user and developer
    experiences.


    Don’t get complacent, though—server rendering is typically a synchronous and computationally
    expensive process. You’ll need to explore things like component caching in large
    apps to avoid inflating server response times ([http://bkaprt.com/rjs39/02-11](http://bkaprt.com/rjs39/02-11)).


    Whatever technology or application backend you use, the point is that delivering
    contentful markup from the server provides some semblance of an experience in
    the potential absence of JavaScript. And—real talk incoming—going server-first
    is one hell of a starting point for progressively enhancing your website with
    JavaScript without saddling the client with tons of expensive work.


    ### Client-side routing and accessibility


    A common architectural choice for web apps is the `Single-Page Application` (SPA)
    model, which loads all the HTML from the server up front and then handles subsequent
    navigations with a JavaScript-powered client-side router that swaps out page contents
    in an app shell.


    SPAs enjoy a perceptual performance benefit in that they avoid the inefficiency
    of complete page refreshes when navigating to other pages. Aside from the performance
    penalties of rendering HTML on the client as we’ve discussed, this approach can
    pose significant accessibility risks—at least if not done very, very careully.


    Management of navigation and history is governed by a complex specification, and
    numerous open-source client-side routers have come and gone during its evolution.
    Not all client-side routers necessarily pay attention to—or may be able to remedy—crucial
    accessibility issues such as element focus, scroll position restoration, navigation
    canceling, and so on.


    I can’t stress enough that when you use a client-side router, you’re challenging
    decades of discovery and foundational work that browser vendors have done to ensure
    a consistent and resilient navigation experience ([http://bkaprt.com/rjs39/02-12](http://bkaprt.com/rjs39/02-12)).


    If you’ve read this far and still think a client-side router is necessary for
    your project, consider the following:


    *   Service-worker technology can increase the perceived speed of navigations
    by stitching together cached header and footer partials with streamed content
    partials from the network. Service-worker technology is fast, well supported,
    and, most important, it’s a progressive enhancement of a time-tested and well-established
    navigation mechanism, not a wholesale replacement of it. We’ll cover this approach
    in detail in Chapter 4.


    *   If service worker is a no-go and you’re dead set on client-side routing, it’s
    crucial that your application backend has a one-to-one relationship with as many
    client-side routes as possible. This provides access to any part of your website
    regardless of context—such as through search engine referrals.


    *   Treat client-side routing as an enhancement. For example, if your website
    has both authenticated and unauthenticated areas, consider confining client-side
    routing to only the authenticated portion of your website.


    Web developer Marcy Sutton talks about the accessibility impacts of client-side
    routing at length and has a whole slew of useful recommendations if you insist
    on it. The one that stands out most to me is this:


    > Consider whether a single-page app is really necessary, and if you even need
    to use a JavaScript framework at all. ([http://bkaprt.com/rjs39/02-13](http://bkaprt.com/rjs39/02-13))


    This advice may seem to fly in the face of best practices. It certainly runs counter
    to the industry’s prevailing JavaScript euphoria, but remember this: a best practice
    that preserves the developer experience at the expense of the user experience
    is not a best practice, but rather a self-serving one ([http://bkaprt.com/rjs39/02-14](http://bkaprt.com/rjs39/02-14)).


    ### Sensible Caching


    A section about the browser cache? In a book about JavaScript? Believe it! There’s
    a good reason to bring it up.


    The browser cache is an optimization where the server communicates the “freshness”
    period of assets to the browser. If the browser determines on a return visit to
    a page that an asset it has on disk is “fresh” according to the server-provided
    policy, that asset is reused rather than retrieved again from the network (Fig
    2.12).


    The browser cache doesn’t do anything for new visitors to your website, but it’s
    a very effective optimization that reduces or eliminates loading time for affected
    assets on subsequent pageviews. In the case of JavaScript, this means the loading
    phase is reduced, and the browser can get on with the processing phase more quickly.


    ![Web vitals comparison: first view of a site takes over 10 seconds and transfers
    1,281 KB, while repeat view takes 6 seconds and transfers 90 KB.](image/2.12.png)


    Fig 2.12: A summary from WebPageTest for a web page on an initial visit (top row)
    and a repeat visit (bottom row) where caching kicks in. Not only does the return
    visit transfer 93 percent less data than the initial visit, but its Largest Contentful
    Paint and Cumulative Layout Shift metrics are improved.


    When a browser requests an asset, the response contains HTTP headers that describe
    its characteristics. Browser caching is affected by a handful of response headers,
    but the most flexible and commonly used one is `Cache-Control` ([http://bkaprt.com/rjs39/02-15](http://bkaprt.com/rjs39/02-15)).


    `Cache-Control` specifies a caching policy composed of one or more directives
    that describe how an asset should be cached. A common directive is `max-age`,
    which specifies the number of seconds an asset is valid. Say you request an HTML
    document and this header appears in the response:


    ```

    Cache-Control: max-age=300

    ```


    This says to the browser, “Hey, this asset can be reused for up to three hundred
    seconds.” That’s five minutes to us.


    There’s a catch to `Cache-Control` that has to do with whether an asset is cached
    not just by the browser but also by an intermediate cache such as a `content delivery
    network` (CDN). A CDN is a proxy in front of your website that distributes assets
    to edge servers that are physically closer to your website’s visitors. Minimizing
    physical distance reduces latency.


    `Cache-Control` implicitly lets both browsers and proxies know they may cache
    assets. This optimization is a benefit in that the asset is served from the CDN’s
    cache even if it isn’t in someone’s browser cache. In the case of dynamic content—that
    is, HTML documents—you’ll want to prevent this by specifying the `private` directive
    in addition to `max-age`:


    ```

    Cache-Control: max-age=300, private

    ```


    How you configure `Cache-Control` depends on your application backend or web server
    configuration. For Apache web servers, the preceding policy can be set for HTML
    documents in an `.htaccess` file:


    ```

    <FilesMatch "\.html$">

    ```


    ```

    Header set Cache-Control "max-age=300, private"

    ```


    ```

    </FilesMatch>

    ```


    The amount of time you’ll want to cache an asset depends on the asset type. JavaScript
    files are static assets, which means they don’t change based on who requests the
    asset or how. Think of stuff like stylesheets, scripts, images, and fonts—things
    with contents that don’t change based on things like cookies. Configuring caching
    for these assets requires a two-pronged approach:


    *   The asset must be versioned so future updates to it won’t be passed over due
    to a previous version of it persisting in browser caches.


    *   The asset must have a `Cache-Control` policy to ensure it will be reused for
    as long as possible.

