    that has the *appearance* of thoughtfulness. I often grumble to myself about our
    industry’s sphexishness and the effect it has had on the collective usability
    of the web.


    ![A black wasp on a flowering plant, its antennae thrust forward and its mouth
    bent toward a bloom.](image/1.1.png)


    Fig 1.1: A wasp identified as *Sphex pensylvanicus*. Photograph by Hardyplants
    ([http://bkaprt.com/rjs39/01-01](http://bkaprt.com/rjs39/01-01)), CC0 1.0 ([http://bkaprt.com/rjs39/01-02](http://bkaprt.com/rjs39/01-02)),
