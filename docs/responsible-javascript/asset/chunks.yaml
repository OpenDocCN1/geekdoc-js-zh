  trans: "\n\n![css-tricks.com 发起的请求时间轴。在“frames”面板中，缩略图显示了页面渲染进度，仅在初始请求完成后才开始。](img/4.6.png)\n\
    \n图 4.6：在 Chrome 性能分析器中，CSS-Tricks 的 HTML 和 CSS 关键请求（在顶部网络面板显示）分别用蓝色和紫色阴标记。这些资源在页面绘制（paints）之前是必须的——在底部的计时器面板中显示为\
    \ `FP` 和 `FCP`。\n\nCSS 和 HTML 并不是唯一可以出现在关键路径上的资源类型。在第 2 章中，我们讨论了客户端渲染的标记比服务器提供的标记更耗资源。除了解析和执行\
    \ JavaScript 以渲染标记的计算开销外，客户端渲染的标记也是一种性能瓶颈，因为它将 JavaScript 放入了关键路径。这是一个遗憾的非常常见的模式（图\
    \ 4.7）。\n\n![由一个 Twitter URL 发起的 JS 请求时间轴。“Frames”包含一个 Twitter 图标的缩略图，在发出请求时没有进度，直到请求完成后显示出渲染后的页面。](img/4.7.png)\n\
    \n图 4.7：关键 JavaScript 请求阻塞了移动端 Twitter Web 应用设置页的渲染。虽然加载屏出现很快，但浏览器必须等待脚本加载（在顶部面板用黄色显示）之后页面才能完全渲染。\n\
    \n幸运的是，`preload` 资源提示有助于在浏览器通常发现它们之前加载资源，从而缓解这一问题。\n\n假设你有一个页面，在闭合的 `</body>`\
    \ 标签之前加载了两个脚本。第一个包含第三方脚本——可以想成框架和库。第二个包含你的应用程序逻辑：\n\n```\n<script src=\"/js/vendors.ae6fd23c.js\"\
    ></script>\n```\n\n```\n<script src=\"/js/scripts.1db3ef48.js\"></script>\n```\n\
    \n`preload` 通过改变浏览器对页面资源的发现顺序，规避了对 HTML 解析器的等待：\n\n```\n<link rel=\"preload\"\
    \ as=\"script\" href=\"/js/vendors.ae6fd23c.js\">\n```\n\n```\n<link rel=\"preload\"\
    \ as=\"script\" href=\"/js/scripts.1db3ef48.js\">\n```\n\n通过在 `<head>` 中这些提示，浏览器发现这些脚本的时间会比我们等到它在文档末尾发现它们要早。当浏览器遇到页面底部相应的\
    \ `<script>` 元素时，它们至少加载了一部分。\n\n为什么，是的，`preload` 确实有一些权衡：\n\n*   读这一遍，再重读一遍：如果你的网站上显示关键内容需要\
    \ JavaScript，那么你已经处于麻烦之中。`preload` 可以作为解决你由 JavaScript 引起的加载性能问题的良药，但其他关键资源（如样式表、Web\
    \ 字体等）将失去带宽，因为你实际上重新将 JavaScript 的优先级置于它们之上。要从问题的根源解决——即 JavaScript——通过让服务器提供该内容标记而不是依赖客户端渲染，从而将其从关键路径中移除（[`bkaprt.com/rjs39/04-12`](http://bkaprt.com/rjs39/04-12)-12](http://bkaprt.com/rjs39/04-12)）。\n\
    *   `preload` 提示需要一个 `as` 属性来描述资源的性质（[`bkaprt.com/rjs39/04-13`](http://bkaprt.com/rjs39/04-13)）。对于脚本，此值应该是\
    \ `script`。如果你是个 `as`hole（混蛋）且没有指定 `as`，预加载的响应将被丢弃。\n*   因为 `preload` 被赋予更高的优先级，其他请求可能会失去带宽。请谨慎使用\
    \ `preload`。如果一切都是高优先级，那么就都没有高优先级了。\n*   如果你正在预加载一个 JavaScript 模块——即通过带有 `type`\
    \ 属性值为 `module` 的 `<script>` 元素加载的脚本——你不需要 `preload`。你需要的是 `modulepreload`，它遵循与\
    \ `preload` 相同的格式，但不需要那些 `as` 属性的麻烦。`modulepreload` 还带有解析方面的优势，这些是 `preload` 无法获得的，例如递归预加载整个模块树，以及推测性解析的优势（[`bkaprt.com/rjs39/04-14`](http://bkaprt.com/rjs39/04-14)）。\n\
    \n撇开权衡不谈，`preload` 是有效的，特别是对于 Web 应用架构中的关键 JavaScript，坦率说，它们需要尽可能的帮助来提高性能。请负责任地使用它，并像往常一样，衡量收益以查看它是否适用于你的项目。\n\
    \n### 按需预加载 JavaScript\n\n记得早些时候我们闲聊代码分割和动态导入吗？嗯，那整个场景的缺点之一是，如果你将脚本加载推迟到需要它的那一秒，那么那些在慢网络连接上的用户会发现自己必须等待你的动态导入完成，他们所执行的操作才会启动。\n\
    \n这并不意味着代码分割是一种反模式；它意味着我们需要稍微思考一下如何解决延迟的劣势。考虑之前提到的联系表单示例，它依赖动态导入在提交时获取表单验证脚本。在表单验证脚本下载和运行之前，有一段延迟（图\
    \ 4.8）。\n\n这种延迟是令人沮丧的：当有人提交表单时，他们期望从页面收到信号，表明他们的操作正在处理中。但在他们的某些脚本执行之前，*没有任何*事情正在发生。\n\
    \n![包含表单的缩略图，在发出请求时没有进度，直到请求完成后显示。](img/4.8.png)\n\n图 4.8：在这次分析会话中，下载表单验证脚本需要大约两秒，导致了延迟。\n\
    \n这种这种情况并不会消除良好的动态导入带来的性能优势，但我们确实需要调整策略。让我们从一个小型函数开始，它能按需向 `<head>` 注入 `preload`：\n\
    \n```\nfunction injectPreload (href, module, as) {\n  let preloadHint = document.createElement(\"\
    link\");\n  preloadHint.rel = module ? \"modulepreload\" : \"preload\";\n  preloadHint.href\
    \ = href;\n  if (!module && typeof as !== \"undefined\") {\n    preloadHint.as\
    \ = as;\n  }\n  document.head.appendChild(preloadHint);\n}\n```\n\n[/content-content]\n\
    \n该函数接收三个参数：\n1. 要预加载脚本的位置\n2. 一个是否为模块的布尔值；如果是，资源提示将是 `modulepreload` 而不是 `preload`\n\
    3. 用于填充提示 `as` 属性的值\n\n运行时，该函数会构建资源提示并将 `<link>` 元素注入到 `<head>`。这触发了获取脚本的请求。\n\
    \n剩下的就是找到触发 `preload` 的正确时机。由于这是一个表单，理想的时机是当任何表单字段获得焦点时；用户填写表单字段的操作为我们赢得了时间：\n\
    \n```\nconst inputs = Array.from(document.querySelectorAll(\"#contact-form input,\
    \ .contact-form textarea\"));\nlet preloaded = false;\n\ninputs.forEach(input\
    \ => {\n  input.addEventListener(\"focus\", () => {\n    if (!preloaded) {\n \
    \     injectPreload(\"/js/contact-form-validation.js\", false, \"script\");\n\
    \      preloaded = true;\n    }\n  }, {\n    once: true\n  })\n});\n```\n\n这确保我们的表单验证脚本只有在用户关注表单中的任何输入框时才会被预加载，且只加载一次。这是对意图的练习：如果有人关注了表单字段，他们可能打算填写表单，预加载可能会在他们操作之前完成。\n\
    \n一旦表单提交并启动动态导入，验证脚本将已经在浏览器缓存中了。这意味着动态导入将命中浏览器缓存而不是网络，使交互几乎是瞬间完成的（图 4.9）。\n\n"
- fmt: "\nThis opportunistic approach takes advantage of code splitting while also\
    \ minimizing the delays involved when we defer the loading of scripts. This is\
    \ as close as we’ll get to having our cake *and* eating it.\n\n![Timeline containing\
    \ a thumbnail of a rendered form, a script transferred with no impact on the page,\
    \ then a thumbnail showing invalid form inputs.](image/4.9.png)\n\nFig 4.9: The\
    \ latency involved in retrieving the form validation script with a dynamic import\
    \ is practically eliminated due to preloading that script prior to the form’s\
    \ submission.\n\nThe goal with resource hints in general is this: if we do all\
    \ that we can as developers to ease JavaScript’s ill effects during startup, we\
    \ can improve both loading and runtime performance. Remember, the word `responsible`\
    \ is the load-bearing word in `Responsible JavaScript`. Resource hints are yet\
    \ another tool in the box to help us live up to that obligation.\n\n## Help People\
    \ Save Data\n\nImagine how much easier our work would be if we developed for a\
    \ single piece of hardware. Were that the case, this book wouldn’t need to exist.\
    \ We would have figured out how to use JavaScript responsibly by now.\n\nBut,\
    \ aw *hell*, we develop for tons of devices and network conditions. Constraints\
    \ vary from user to user, which makes building performant architectures incredibly\
    \ challenging—but we owe it to our users to adapt to their needs.\n\nIf you’ve\
    \ spent even a minute in the rural United States, you know that finding a fast\
    \ and reliable network connection can be a nightmare ([http://bkaprt.com/rjs39/04-15](http://bkaprt.com/rjs39/04-15)).\
    \ In these internet voids, people may state a preference for reduced data usage\
    \ to alleviate the pain of browsing on slow networks. This goes a long way toward\
    \ making the web faster for those who have the deck stacked against them—if we\
    \ can accommodate them.\n\n### Signals for reduced data usage\n\nOn the Android\
    \ version of Google Chrome, users can specify a preference for reduced data usage\
    \ via “Data Saver Mode” or “Lite Mode.” When enabled, this mode does two things:\n\
    \n1. Chrome sets `navigator.connection.saveData` to `true`.\n\n2. Chrome sends\
    \ a `Save-Data` HTTP header with a value of `on` for every request.\n\nHistorically,\
    \ that platform was the only one to offer such a mode, but more recently the `prefers-reduced-data`\
    \ media query in CSS has emerged to expand data-saving functionality to all browsers.\
    \ It can have a value of either `no-preference`, which communicates no preference\
    \ for data usage, or `reduce`, which reduces data usage.\n\nIn Chrome for Android,\
    \ the reduced-data-usage preference adheres to the standardized `prefers-reduced-data`\
    \ media query. While it may seem like a CSS feature doesn’t have much use in JavaScript,\
    \ we can evaluate this preference through the `matchMedia` method:\n\n```\n//\
    \ If a preference for reduced data usage is specified,\n```\n\n```\n// this expression\
    \ will evaluate to true:\n```\n\n```\nconst saveData = window.matchMedia(\"(prefers-reduced-data:\
    \ reduce)\").matches;\n```\n\nIf you’ve gleaned anything from this book so far,\
    \ though, it’s that the role of JavaScript is one to be reduced, not expanded.\
    \ Given that, it seems more reasonable to read the `Save-Data` request header\
    \ on the server. It’s not that this value has no relevance in JavaScript itself—indeed,\
    \ it does! It’s just that your best bet to reduce your reliance on JavaScript\
    \ is on the server. In a backend language—such as PHP——the `Save-Data` header\
    \ can be detected like so:\n\n```\ndefine(\"SAVE_DATA\", isset($_SERVER[\"HTTP_SAVE_DATA\"\
    ]) && stristr($_SERVER[\"HTTP_SAVE_DATA\"], \"on\") !== false);\n```\n\nThis snippet\
    \ defines a `SAVE_DATA` constant. From there, this signal can be used on the backend\
    \ to focus on the page’s critical content and strip out nonessential assets—including\
    \ JavaScript.\n\nWe can see this in action on the website for Weekly Timber, a\
    \ Wisconsin logging company. The Q&A page features a carousel and accordions (Fig\
    \ 4.10), which both depend on `jQuery`, and the carousel has a big chunk of JavaScript\
    \ driving it. There’s also the carousel plugin itself as well as a small bit of\
    \ JavaScript to initialize it all.\n\n![The full-featured version of Weekly Timber’s\
    \ Q&A page has a carousel and JavaScript-powered accordions.](image/4.10.png)\n\
    \nFig 4.10: The full-featured version of Weekly Timber’s Q&A page has a carousel\
    \ and JavaScript-powered accordions.\n\nThese enhancements total up to slightly\
    \ fewer than 100 kilobytes of uncompressed JavaScript. It’s not an egregious amount\
    \ of JavaScript as far as web pages go, but it does spur quite a bit of main-thread\
    \ activity on slow devices (Fig 4.11).\n\n![The main-thread activity overview\
    \ in Chrome’s performance profiler for the Weekly Timber website’s Q&A page. The\
    \ page kicks off a not-inconsequential amount of JavaScript activity as well as\
    \ JavaScript-induced layout and paint work.](image/4.11.png)\n\nFig 4.11: The\
    \ main-thread activity overview in Chrome’s performance profiler for the Weekly\
    \ Timber website’s Q&A page. The page kicks off a not-inconsequential amount of\
    \ JavaScript activity as well as JavaScript-induced layout and paint work.\n\n\
    But we can use the `SAVE_DATA` constant we created to strip the bells and whistles\
    \ for Weekly Timber’s customers, who may be in less-than-ideal rural network conditions.\
    \ We opted to remove the carousel and the accordion functionality if `SAVE_DATA`\
    \ is `true`:\n\n```php\nif (!SAVE_DATA) {\n?>\n<section id=\"carousel\">\n  <!--\
    \ Carousel omitted -->\n</section>\n<?php\n}\n?>\n```\n\n### Saving data as a\
    \ custom feature\n\nData-saving functionality doesn’t have to be provided only\
    \ by the browser; you can build it into your own application as a toggleable setting\
    \ so that everyone can benefit from it, not just those on browsers that offer\
    \ it. For example, Twitter offers an application-level setting to help visitors\
    \ save data (Fig 4.14).\n\n![Screenshot of Twitter.com’s account info settings\
    \ menu. “Data saver” is toggled to on.](image/4.14.png)\n\nFig 4.14: Twitter’s\
    \ Data saver setting is located near the bottom of its mobile navigation menu.\n"
