    \ use them effectively and to understand their potential effects on performance.\
    \ While you don’t *need* any of the tools mentioned in this chapter to build fast\
    \ and delightful user experiences, you’re likely to encounter them in your work.\
    \ If we’re to invest in using toolchains, we need to make it worth our while.\n\
    \n## Task Runners\n\n![A cicada killer wasp with a paralyzed cicada. Photograph\
