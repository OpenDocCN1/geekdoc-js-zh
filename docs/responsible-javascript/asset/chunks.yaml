    experimental WorkerDOM contains an implementation of the DOM API inside of a web
    worker ([http://bkaprt.com/rjs39/06-29](http://bkaprt.com/rjs39/06-29)).


    If the work that needs to be done on your website doesn’t require direct access
    to the DOM and is computationally expensive, web workers can improve your website’s
    runtime performance by reducing main-thread work.


    ## Charting a Course for a Snappier Web


    Web performance is more than just how fast a website loads. Where JavaScript is
    concerned, that sentiment fails to see the whole picture. JavaScript has an equally
    important, if not more important, role in a website’s usability *after* its `load`
    event fires.


    Poor runtime performance sows distrust in your website. While that’s bad for business
    (if business is your business), it’s also bad for users. If you work on a website
    that serves any remotely critical function, keeping an eye on runtime performance
    must be a priority, especially for long-lived websites that mature and add features
    over time.


    With a little thought and care, you can find opportunities to use the techniques
    covered in this chapter to make runtime performance better for more people on
    more devices. That work benefits everyone, everywhere. As we roll into the final
    stretch and touch on the pitfalls of third-party JavaScript, you’re going to need
    all the breathing room you can get on the main thread in order to chart a course
    for smooth sailing.


    # Chapter 7. Managing Third-Party JavaScript


    ![](image/9.png)


    If you’re looking for proof of the truism that all wasps are jerks, look no further
    than the paper wasp species *Polistes sulcifer*, also known as the cuckoo paper
    wasp.


    Cuckoo paper wasps look like common paper wasps (*Polistes dominula*, specifically)
    but with one important difference: they forgot how to build their own nests a
    long time ago. Rather than strike out on their own—you know, like any reasonable
    solitary wasp would—a fledgling female instead takes over a colony of common paper
    wasps through a combination of chemical mimicry and the time-tested practice of
    regicide (Fig 7.1). Once the cuckoo wasp establishes herself as the new queen,
    she forces the workers of the host nest to raise her offspring.


    ![A nest of Polistes dominula paper wasps. Females of the species Polistes sulcifer
    usurp the queens of these nests and force the remaining workers to raise their
    offspring. Photograph by JAW (http://bkaprt.com/rjs39/07-01), CC BY-SA 3.0 (http://bkaprt.com/rjs39/07-02),
    via Wikimedia Commons.](image/7.1.png)


    Fig 7.1: A nest of *Polistes dominula* paper wasps. Females of the species *Polistes
    sulcifer* usurp the queens of these nests and force the remaining workers to raise
    their offspring. Photograph by JAW ([http://bkaprt.com/rjs39/07-01](http://bkaprt.com/rjs39/07-01)),
    CC BY-SA 3.0 ([http://bkaprt.com/rjs39/07-02](http://bkaprt.com/rjs39/07-02)),
    via Wikimedia Commons.


    Think of your website as a happy little nest, with its various scripts and such
    doing their own thing. At some point, you’ll probably rely on a third-party script
    to do something for you that you yourself don’t have time to build a solution
    for.


    One third-party script or two won’t likely do tons of damage performance-wise,
    but make no mistake: they can insidiously creep in over time. At the very worst,
    they can parasitize your website and ship scripts to your users that you didn’t
    even know about. Since you may not be able to eliminate the presence of third-party
    JavaScript on your website entirely, you’ll need to keep a close eye on things
    to prevent serious performance issues from manifesting.


    I’ll be up-front: there’s no way we can cover every pitfall you’ll face with third-party
    JavaScript in such limited space. This subject would require its own book to completely
    explore. Rather, we’re going to train our focus on some of the big stuff for you
    to consider as well as technical mitigations you can use to help rein things in.


    ## Defining Terms


    Even the task of distinguishing first- and third-party JavaScript is a trudge,
    but I’ll try my best: *first-party JavaScript* is any JavaScript we write that’s
    specific to our website, including its dependencies. If you yourself wrote some
    JavaScript, or you installed dependencies with a package manager and bundled them
    as production-ready scripts that are served from your domain, you can usually
    call that first-party JavaScript.


    Defining third-party JavaScript is more difficult. Some might say that third-party
    scripts are those loaded from any-origin, but that definition gets weird in cases
    where you load your first-party code from CDNs or even a subdomain.


    For the sake of expediency, we’ll define *third-party JavaScript* to mean any
    script from a service provider—paid or otherwise—that provides some service for
    a website. This may include (but certainly isn’t limited to) client-side A/B testing
    suites, analytics and tag managers, heatmapping tools, accessibility overlays,
    and so on.


    This isn’t an exhaustive accounting of third-party products, but it should give
    you an idea of what third-party JavaScript encompasses—and as you’ll find out,
    there are seriously formidable threats in your nest where performance is concerned.


    ## The Dealers of Damage


    Third-party JavaScript tends to make its way into a website because it tends to
    bridge some gap in a website’s functionality that its owners don’t want—or can’t
    afford—to solve on their own. After all, developer time is spendy, and if a UX
    researcher, marketer, or product owner finds they can spend less money on a third-party
    solution than what it would take to develop a custom solution, they can hardly
    be blamed for choosing the former.


    Adopting a third-party solution for a missing piece of functionality may feel
    inevitable. When that feeling is palpable across an organization, you’ll do well
    to ask a pointed question: What purpose does this product serve? Then, an even
    pointed follow-up question: Does this product hurt our goals?


    Take South Carolina’s landing page for their unemployment assistance information
    page. It’s a simple informational page, yet it ships nearly three megabytes of
    JavaScript, which becomes ten megabytes after decompression. The lion’s share
    of that JavaScript is wrapped up in third-party scripts, and its effects are seriously
    detrimental to both loading and runtime performance (Fig 7.2).


    ![A WebPageTest comparison of main-thread activity for the Government of South
    Carolina’s unemployment assistance information page. At the top, no requests for
    third-party scripts are blocked. At the bottom, all third-party scripts are blocked.
    Without third-party scripts, the page is still usable and informative, but incurs
    a fraction of the blocking time.](image/7.2.png)


    Fig 7.2: A WebPageTest comparison of main-thread activity for the Government of
    South Carolina’s unemployment assistance information page. At the top, no requests
    for third-party scripts are blocked. At the bottom, all third-party scripts are
    blocked. Without third-party scripts, the page is still usable and informative,
    but incurs a fraction of the blocking time.

