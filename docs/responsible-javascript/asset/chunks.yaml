- fmt: '

    If you understand the main thread as a straight line representing a task queue,
    you’d be right to also think of that line as representing time. Every task scheduled
    on the main thread requires some amount of time to complete.


    The problem is that the main thread isn’t some juggernaut that can take all comers.
    It has limitations that flex with a device’s capabilities and ambient conditions.
    Schedule too much work on the main thread at once, and it’ll get bogged down.
    When this happens, interactions with a page can’t take place until that work is
    finished (Fig 1.6).


    ![Frames of a login screen plotted over time, showing tasks on the main thread
    delayed while an animation loads.](image/1.6.png)


    Fig 1.6: A performance profiling session of the login form for Citibank as shown
    in Chrome’s performance profiler. Every keypress triggers excessive main-thread
    work, resulting in a nearly two-second delay that causes the login form to be
    unresponsive while entering a password.


    Consequences of an overworked main thread vary. A busy main thread can block user
    interactions with a briefly annoying lag. Worse scenarios can cause the browser
    to freeze for yawning stretches of time, making the page seem broken. Either way,
    poor runtime performance endangers trust and may frustrate people to the extent
    that they’ll abandon your website.


    The threshold at which someone perceives an event as instantaneous is 100 milliseconds
    ([http://bkaprt.com/rjs39/01-10](http://bkaprt.com/rjs39/01-10)). If a browser
    is to do everything asked of it seamlessly, with no perceptible performance problems,
    each task must fit within a `frame`.


    A typical display refreshes sixty times per second, making a frame one-sixtieth
    of a second, or 16.66 milliseconds. But because the browser requires time in each
    frame for its own processing overhead, the target to complete a task in a frame
    is 10 milliseconds ([http://bkaprt.com/rjs39/01-11](http://bkaprt.com/rjs39/01-11)).


    In practice, you only need to hit the 10-millisecond mark for every frame of an
    animation or scrolling to be perceptibly smooth. For other work, 50 milliseconds
    or fewer per task is what you’re after. If it takes no more than 50 milliseconds
    for an input to be registered, and no more than another 50 milliseconds for the
    browser to respond to that input, that interaction will be perceptibly instantaneous
    (Fig 1.7).


    ![Diagram showing the first 50 milliseconds of a task and the second 50 milliseconds
    of a task unfolding over a series of frames.](image/1.7.png)


    Fig 1.7: The first 50 milliseconds of a task is the budget for the initial user
    input (e.g., click or tap) to be registered. The task must finish within the remaining
    50 milliseconds in order to feel responsive.


    In performance lingo, any task exceeding 50 milliseconds is called a `long task`
    ([http://bkaprt.com/rjs39/01-12](http://bkaprt.com/rjs39/01-12)). Tasks become
    long tasks due to the amount of JavaScript activity during any given interaction,
    including any tangential activity (e.g., layout and paint operations). How fast
    this work is done is governed by the device it takes place on.


    ## Left to Our Devices


    This is where it gets “in the real world” real: the diversity of devices that
    access the web is `mind-bending`. The spectrum of possible network conditions
    is similarly wide, and phenomena such as poor coverage areas or congested networks
    can wreak all sorts of havoc on page performance ([http://bkaprt.com/rjs39/01-13](http://bkaprt.com/rjs39/01-13)).


    While one’s network connection is an important aspect of web performance, device
    speed is also important. This is especially true when it comes to whether a page
    `feels` fast to the person using it.


    ### Thermal throttling: The device performance killer


    Every device has a processor, which emits heat as it crunches through tasks. Devices
    such as desktops and laptops keep processors at a safe operating temperature with
    a combination of active and passive cooling in the form of a fan and a conductive
    metal heat sink to absorb and dissipate heat (Fig 1.8).


    Since mobile-device manufacturers optimize for portability, they ditch fans in
    favor of passive cooling alone. This leaves devices more susceptible to overheating.
    To keep those little phones from burning up, processors employ `thermal throttling`,
    reducing clock speed and power consumption (which in turn reduces device performance)
    until the excess heat dissipates.


    This—as well as a given device’s inherent capabilities—contributes significantly
    to the performance gap between high- and low-end devices. If we can’t relegate
    JavaScript workloads to a manageable amount, we can’t guarantee good user experiences
    across a wider variety of devices.


    ### The device performance gap


    People use the web for a slew of tasks where access is of critical importance:
    online banking, job applications, rental applications, crisis intervention, applying
    for unemployment assistance, and more. When JavaScript is the first tool we reach
    for to solve every problem, we risk restricting access rather than expanding it.


    ![Close-up of a heatsink and fan installed on a processor on a laptop motherboard.](image/1.8.png)


    Fig 1.8: A heat sink / fan combination installed on a processor on a consumer
    laptop board. Heat sinks absorb and dissipate heat from processors to maintain
    performance and extend device life. Photograph by Saud ([http://bkaprt.com/rjs39/01-14](http://bkaprt.com/rjs39/01-14)),


    As an example, I profiled the government of South Carolina’s unemployment benefits
    website, and measured the impact of its 1.7 megabytes decompressed JavaScript
    on startup across five different devices (Fig 1.9):


    | Device | Average startup time |

    | --- | --- |

    | 2017 5K iMac | 253 milliseconds |

    | Second generation iPhone SE | 301 milliseconds |

    | ASUS X50C Windows 10 | 709 milliseconds |

    | Nokia 2 Android Edition | 6044 milliseconds |

    | 2015 MacBook Pro | 621 milliseconds |


    You, being the observant reader you are, will notice that one of those numbers
    is much bigger than the others. Four out of five these devices process the JavaScript
    satisfactorily. Yet one of those devices—the budget device—practically dies trying
    to do the same. This disparity represents what I mean by “the device gap” as it
    pertains to JavaScript.


    ![Login page for the government of South Carolina’s website for unemployment assistance
    showing the state capitol on a dark-blue background.](image/1.9.png)


    Fig 1.9: As of mid-2020, the government of South Carolina’s homepage for unemployment
    assistance shipped approximately 800 kilobytes of JavaScript, which ultimately
    decompressed to 1.7 megabytes.


    The Nokia 2 is a resource-constrained device. It ships with a quad-core Cortex
    A7 processor ([http://bkaprt.com/rjs39/01-16](http://bkaprt.com/rjs39/01-16))
    and 1 gigabyte of RAM. You can buy a Nokia 2—or a similar device—for less than
    $100 USD. This price point makes this—and similar devices—a pragmatic choice for
    many people.


    We are not just concerned with watching funny cat videos here. In 2015, 41 percent
    of job-seeking Americans used a mobile phone in some part of their job search
    ([http://bkaprt.com/rjs39/01-17](http://bkaprt.com/rjs39/01-17)). When we ship
    excessive JavaScript, those who can’t spare money for high-end devices face barriers
    to participating not only in the fun and frivolous things the web has to offer,
    but in the economy itself.


    Human beings are often self-serving creatures, and web developers are no different.
    It’s tempting to rationalize that those on low-end hardware or slow network connections
    aren’t part of your “target audience.” Let’s recognize that sentiment for what
    it is: an intentional choice to exclude people.

