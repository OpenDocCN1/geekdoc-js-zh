    献给 Zandy, Maya, Lucy, Groant 和 Mowzers。


    # 前言


    我们都希望用户能够获得他们预期的快速、流畅的网页体验，无论他们使用的是手机、平板电脑还是笔记本电脑。但相互冲突的利益往往会介入。开发者希望有有趣的开发体验。设计师想要美观且清晰的设计。项目经理想要详细的用户交互报告来测试哪些方案有效。广告商则想要追踪……嗯，一切。


    在削减成本和加速开发流程的同时，平衡所有这些需求似乎是不可能的——而且遗憾的是，我们赖以寻求帮助的框架和库可能会对无障碍、安全性、Web 性能和用户体验产生负面影响。


    如果我们真的想为用户提供卓越的体验，我们必须成为可用性和性能更优秀的管家——这正是 Jeremy 能教给我们的。Jeremy 在为大小大小的项目开发网站和应用程序方面拥有超过十五年的经验，对于如何在业务需求、用户需求和开发者利益之间取得平衡有着敏锐的理解。他采取了大局观，不仅解释了如何审慎地使用
    `JavaScript`，还解释了为什么要这么做。通过从多样化的真实案例中学习，你将能够预见对你自己的项目是合理的，并为你的用户构建高性能、优质的体验。


    你还将学到比你想知道的更多的关于黄蜂的知识。希望这些信息永远用不上。


    —**Estelle Weyl**


    # 第 1 章. JavaScript：小心处理


    ![](img/2.png)


    警告：本书包含大量关于黄蜂的隐喻，可能会引起不安。


    让我们从 `Sphex` 开始，它是我们将遇到的许多黄蜂中的第一种。


    `Sphex` 是一种独居性黄蜂属，它们在地下筑巢并以蟋蟀为食（见图 1.1）。当其中一只黄蜂将蟋蟀带回巢穴时，它会做出一种不合常理的周全行为：它会对巢穴进行检查，将蟋蟀留在外面。当黄蜂完成检查后，它会重新出来取蟋蟀。


    现在的重点来了：如果你——一个昆虫界的恶作剧之神——在巢穴检查期间移动了蟋蟀，黄蜂的行为程序就会重启。黄蜂只知道蟋蟀不在它原来的位置，因此它会重新定位蟋蟀，将其拖回巢穴入口，并*再次*检查巢穴。


    虽然这种行为在掘地黄蜂中并不一致，但这个概念通过学者 Douglas Hofstadter 创造的词汇具有修辞上的用处：`sphexishness`（[`bkaprt.com/rjs39/01-03`](http://bkaprt.com/rjs39/01-03)）。当我们说某事是
    sphexish 的时候，我们描述的是一种高度确定性的、预设的、具有周全*表象*的行为。我经常对自己抱怨我们行业的这种“黄蜂性”以及它对网页整体可用性产生的影响。


    ![一只停在花植物上的黑黄蜂，触角向前伸，嘴朝向花朵。](img/1.1.png)


    图 1.1：被识别为 `Sphex pensylvanicus` 的黄蜂。照片拍摄自 Hardyplants ([`bkaprt.com/rjs39/01-01`](http://bkaprt.com/rjs39/01-01))，CC0
    1.0 ([`bkaprt.com/rjs39/01-02`](http://bkaprt.com/rjs39/01-02))，源自 Wikimedia Commons。


    你花闲钱买这本书，并不是为了听别人说你是一个无法进行批判性思考的工蜂——事实显然并非如此。我们都在努力用所知的最好的方式完成工作。然而，作为 Web 开发者，我们确实做了许多微小的、近乎仪式性的重复工作，这些行为绝对是“黄蜂性的”。


    考虑一下我们对最佳实践的固执遵循，即使这些实践导致了糟糕的用户体验。我们在不考虑潜在劣势或替代方法的情况下直接 `npm install` 包。我们追逐新工具，希望它们能提高我们的生产力——尽管这种持续的变动本身就引入了隐蔽的生产力成本。


    我们只是做了很多*事情*，导致了使用我们制作产品的人产生糟糕的结果。这是一个大胆的断言，是的。


    ![折线图显示 2012 年至 2021 年间提供给移动设备的 JavaScript 数量持续增长。](img/1.2.png)


    图 1.2：此 HTTP Archive 图表显示了从 2012 年到 2021 年交付给移动设备的 JavaScript 中位数、75 分位数和 90 分位数。10%
    的网站从 200 千字节增加到近 1.25 兆字节。


    ## JavaScript 在性能中的作用


    负责任地使用 JavaScript 首先需要理解浏览器如何处理它。人们很容易将网站的性能简化为传输大小。


    是的，在相同条件下，发送字节较少的页面通常比发送较多的更快。然而，这并不是 Web 性能的唯一因素。事实上，它有两个：加载性能和运行性能。


    ### 加载性能


    *加载性能*是指 HTML 文档及其资源（CSS、图像，是的，还有 JavaScript）在浏览器请求它们后通过网络到达的速度。在加载性能方面，我们唯一能控制的是发送什么、发送多少以及如何发送。影响加载性能的因素发生在我们的控制之外，在浏览器和
    Web 服务器之间的间隙中。


    尽管如此，我们有一些技巧可以改进加载性能：


    *   代码混化（Minification）：从 HTML、CSS 和 JavaScript 文件等文本资源中删除不必要的空格和注释以减小其体积。代码混化是有效的，因为它利用了计算机运行我们编写的代码时不需要这些奢侈的事实。


    *   压缩（Compression）：是指服务器在发送内容之前，通过压缩算法减小文本资源的大小。就像 ZIP 文件，只不过资源是在发送前被压缩，并在到达网络后被解压缩。


    '
- fmt: "\nWe seem to consistently get minification and compression right because they’re\
    \ easily automated either by build processes or by servers. It’s that stuff we\
    \ *can’t* automate that makes using JavaScript responsibly a tall order—the biggest\
    \ task of which involves managing what happens *after* the browser requests and\
    \ receives JavaScript assets.\n\n## Runtime performance\n\n*Runtime performance*\
    \ describes how responsive a page is to input once it appears in the browser.\
    \ When a page is persistently slow to respond to interactions, we say that page’s\
    \ runtime performance is poor.\n\nRemember all that talk about compression a bit\
    \ ago? Whatever is compressed must be decompressed. Browser developer tools reflect\
    \ this by reporting both the *transfer size* (presumably compressed) and the *actual\
    \ size* (decompressed) of assets (Fig 1.3).\n\n![The Network tab showing that\
    \ 459 assets were requested, compressed to 5.2 megabytes for transfer, and decompressed\
    \ to 13.6 megabytes.](image/1.3.png)\n\nFig 1.3: Google Chrome’s developer tools\
    \ summarize assets in the Network tab. From left to right are the total number\
    \ of requested assets, their transfer size (including compression), and their\
    \ actual (decompressed) size.\n\nIf this seems inconsequential, consider that\
    \ if a 200-kilobyte compressed JavaScript asset decompresses to 800 kilobytes,\
    \ the browser must process those 800 kilobytes of script! Processing JavaScript,\
    \ as you’ll see, is a whole other hornets’ nest.\n\n## The cost of processing\
    \ JavaScript\n\nThe drudgework of how browsers handle JavaScript isn’t so much\
    \ in the downloading but in the processing of it. Browser vendors constantly hack\
    \ away on JavaScript engines to improve their performance in ways we web developers\
    \ can’t. Despite such improvements, processing JavaScript is a spendy endeavor\
    \ that gets more expensive the slower the device.\n\nReducing web performance\
    \ to a question of bytes assumes that every byte has the same performance cost.\
    \ This is true of loading performance, but not runtime performance, where processing\
    \ a byte of JavaScript requires more computational effort than a byte of, say,\
    \ CSS.\n\nLet’s illustrate this point with data: after querying and analyzing\
    \ seventy-two million Lighthouse audits performed in 2020 in HTTP Archive’s BigQuery\
    \ store ([http://bkaprt.com/rjs39/01-06](http://bkaprt.com/rjs39/01-06)), it became\
    \ evident that, across these audits, CPU time spent processing JavaScript far\
    \ exceeded CPU time spent on style/layout operations, HTML, and rendering/painting\
    \ (Fig 1.4).\n\n![Processing time of main thread browser tasks by category, with\
    \ scripts taking much more time than HTML, layout, and rendering.](image/1.4.png)\n\
    \nFig 1.4: CPU processing time for JavaScript worsens at higher percentiles where\
    \ Lighthouse audits encountered pages with larger JavaScript payloads. In the\
    \ median case, processors spent over ten times as long processing JavaScript as\
    \ they did HTML.\n\nConsidering this data, we can see how a good chunk of the\
    \ web is acceptably fast for those relative few on high-end hardware, sluggishly\
    \ irritating for the middling many, and downright unusable for those on low-end\
    \ hardware.\n\nIf it’s tempting to handwave away the problem of slow devices,\
    \ check out the best-selling unlocked mobile phone on Amazon at the time of this\
    \ writing: a $60 BLU Studio Mini phone. While you get a lot for that $60, don’t\
    \ kid yourself: it’s an Android device without much in the way of guts ([http://bkaprt.com/rjs39/01-07](http://bkaprt.com/rjs39/01-07)).\n\
    \nMoreover, the data presented here illustrates only page speed during *startup*,\
    \ when critical page assets are downloaded and processed to create the initial\
    \ user experience. We still grapple with the effects of excessive JavaScript throughout\
    \ the entire page life cycle—not just during startup.\n\nWhile it seems like we’re\
    \ quibbling over piddly-sounding things like bytes and milliseconds, every website\
    \ engages the browser in tons of tasks, including parsing HTML, decoding images,\
    \ applying styles to said HTML, and—yes—processing and running JavaScript. It\
    \ quickly adds up.\n\nThe result of all that work is a user interface that lets\
    \ people do stuff, from paying bills to catching up on emails to applying for\
    \ jobs or government assistance. Your use of JavaScript can either facilitate\
    \ or impede people in their goals, but you can’t know which is the case until\
    \ you know how the browser schedules and organizes that work on the main thread.\n\
    \n## Understanding the Main Thread\n\nComputer processors do their work on *threads*,\
    \ which are sequences of instructions processed by a scheduler ([http://bkaprt.com/rjs39/01-08](http://bkaprt.com/rjs39/01-08)).\n\
    \nJavaScript is a *single-threaded* language. Consequently, all its work happens\
    \ sequentially on the *main thread.* This makes the logic linear and easier to\
    \ follow than that of multithreaded languages, but it also means JavaScript competes\
    \ for the browser’s attention with other types of work.\n\nLet’s peek at how a\
    \ browser might schedule toggling a navigation menu on the main thread. Say that\
    \ menu has an `id` of `mobile-nav` that gets toggled into an open or closed state\
    \ by clicking on a button with an `id` of `mobile-nav-btn`. That code might look\
    \ something like this:\n\n```javascript\ndocument.addEventListener(\"DOMContentLoaded\"\
    , function () {\n const mobileNav = document.getElementById(\"mobile-nav\");\n\
    \ const mobileNavBtn = document.getElementById(\"mobile-nav-btn\");\n mobileNavBtn.addEventListener(\"\
    click\", function () {\n let nextExpandedState = mobileNavBtn.getAttribute(\"\
    aria-expanded\") === \"false\";\n mobileNav.classList.toggle(\"mobile-nav-open\"\
    );\n mobileNavBtn.setAttribute(\"aria-expanded\", nextExpandedState);\n });\n\
    ```\n\nAssume when this script is loaded, someone plops their finger onto the\
    \ navigation toggle once to open it and then again to close it. That translates\
    \ into work that’s scheduled on the main thread like so:\n\n1. A callback runs\
    \ when the `document`’s `DOMContentLoaded` event fires as the page loads. That\
    \ callback sets up the navigation toggling behavior.\n2. The navigation toggle\
    \ button is, er, toggled, which triggers the callback to add the `mobile-nav-open`\
    \ class on the navigation.\n3. The navigation toggle button is toggled again,\
    \ removing the `mobile-nav-class` on the navigation.\n\nA simplified visual representation\
    \ of this work shows that it occurs sequentially on the main thread, with each\
    \ event’s callback invoked as the corresponding events fire (Fig 1.5). (This kind\
    \ of visualization is similar to what would be depicted in a performance profiler,\
    \ a type of performance assessment tool we’ll learn about in Chapter 3.)\n\n![Sequential\
    \ diagram showing (1) a DOMContentLoaded event; (2) a click event toggling navigation\
    \ on; and (3) a click event toggling navigation off.](image/1.5.png)\n\nFig 1.5:\
    \ A simplified visual representation of work scheduled on the main thread.\n\n\
    By the way, I sort of lied about JavaScript being single-threaded. It’s possible\
    \ to schedule JavaScript activity on other threads using web workers ([http://bkaprt.com/rjs39/01-09](http://bkaprt.com/rjs39/01-09)),\
    \ which helps keep the main thread from getting too congested in some situations.\
    \ But don’t get too comfortable with the notion of offloading all kinds of work\
    \ to separate threads just yet! Web workers, while useful in their time and place,\
    \ only have direct access to a subset of APIs available to the main thread. We’ll\
    \ touch more on web workers and what they can (and can’t) do in Chapter 6.\n\n\
    ### Frames, tasks, and JavaScript hang-ups\n"
