- fmt: "\nWeb Components aren’t a single monolithic web-platform feature but rather\
    \ a collection of features such as better DOM and CSS encapsulation through shadow\
    \ DOM, custom elements, and HTML templates. Like component-based frameworks, Web\
    \ Components offer componentization and the ability to track state in a centralized\
    \ location.\n\nBefore we get into how we might use Web Components, let’s revisit\
    \ the markup for our server-driven Subscribe button from earlier:\n\n```html\n\
    <form method=\"POST\" action=\"/subscribe\">\n<button type=\"submit\" class=\"\
    subscribe-button\">Subscribe</button>\n<input type=\"hidden\" name=\"subscribee-id\"\
    \ value=\"1\">\n</form>\n```\n\nCustom elements may come to mind when you think\
    \ of Web Components, which you can use to build an entirely new HTML element,\
    \ like `<subscribe-button>`, for specific situations. Unfortunately, browsers\
    \ that don’t support custom elements won’t be able to fall back on default semantics,\
    \ which means they’ll lose important things like the `<form>` element’s server-provided\
    \ functionality.\n\nThat’s a bummer. Fortunately, we can preserve those semantics\
    \ in such cases if we reference our custom element’s name in the form’s `is` attribute:\n\
    \n```html\n<form is=\"subscribe-button\" method=\"POST\" data-subscribed=\"false\"\
    \ action=\"/subscribe\">\n```\n\nFair warning: as of this writing, the `is` attribute\
    \ has no support in Safari, either on macOS or iOS, despite it being a living\
    \ standard in the HTML specification ([http://bkaprt.com/rjs39/02-18](http://bkaprt.com/rjs39/02-18)).\
    \ For iOS, that means all browsers available on the platform, since Firefox or\
    \ Chrome are essentially Safari under the hood. The alternatives involve not using\
    \ Web Components, falling back to the server-provided functionality, or very carefully\
    \ evaluating your framework options to find a solution that prioritizes performance.\n\
    \nGetting back on track: you might wonder why we’ve decided to attach a custom\
    \ element named `subscribe-button` to the `<form>` element rather than the `<button>`\
    \ inside of it. This is an important semantic choice! An accessible and progressively\
    \ enhanceable Subscribe button is more than the `<button>` element itself: it\
    \ requires the `<form>` element, and everything within it, to function.\n\nThis\
    \ is one part of what it takes to get a custom element off the ground. We still\
    \ need to write the component JavaScript, which looks like most JavaScript classes\
    \ you’d encounter:\n\n```javascript\nclass SubscribeButton extends HTMLFormElement\
    \ {\n  constructor () {\n    super();\n  }\n}\n```\n\nThis doesn’t seem like an\
    \ impressive beginning, but there’s a lot behind this starter code that makes\
    \ custom elements so useful in a progressive-enhancement context. Primarily, the\
    \ `SubscribeButton` class extends the `HTMLFormElement` class. As a result, we\
    \ retain all the baked-in functionality and accessibility semantics of the `<form>`\
    \ element for our custom element. All because we decided to extend an existing\
    \ element rather than create one from scratch (which you often shouldn’t have\
    \ to do).\n\nAs with any `class`, we need a `constructor` method. For now, we\
    \ call the `super` method, which invokes the parent class’s `constructor` method.\
    \ This ensures we gain all the functionality and properties of the `HTMLFormElement`\
    \ class.\n\nFrom here, we use the component’s `constructor` method to establish\
    \ the necessary object properties for the Subscribe button to work:\n\n```javascript\n\
    class SubscribeButton extends HTMLFormElement {\n  constructor () {\n    super();\n\
    \    this.subscribeButton = this.querySelector(\".subscribe-button\");\n    this.subscribed\
    \ = this.dataset.subscribed === \"true\";\n    this.subscribeeId = Number(this.querySelector(\"\
    [name='subscribee-id']\").value);\n    this.buttonLabel = this.subscribed ? \"\
    Subscribed\" : \"Unsubscribe\";\n    this.coarsePointer = window.matchMedia(\"\
    (pointer: coarse)\").matches;\n\n    // Wire up methods\n    this.subscribeButton.addEventListener(\"\
    mouseenter\", this.hoverOn);\n    this.subscribeButton.addEventListener(\"mouseleave\"\
    , this.hoverOff);\n    this.addEventListener(\"submit\", this.subscribe);\n  }\n\
    }\n```\n*Wait, the original text had the code fragmented into blocks, I have merged\
    \ them for better readability based on the logic provided.*\n\n*Woof*, there’s\
    \ a bit going on there. Let’s break down each part:\n\n- `this` refers to the\
    \ DOM node the web component is attached to. In this case, `this` is the Subscribe\
    \ button form’s `<form>` element.\n- Because `this` represents the component instance,\
    \ we can derive additional scoped properties from it, starting with the `<button>`\
    \ element within the form itself.\n- We can also derive other useful information\
    \ from `this`, such as the subscription state stored in the `<form>` element’s\
    \ `data-subscribed` attribute, and the subscribee’s user ID, the text content\
    \ of the component’s `<button>` child node. We can even store whether the current\
    \ device has a coarse (touchscreen) or fine (mouse) pointer as a class property.\n\
    \nWith these properties, we then wire up event listeners that call class methods\
    \ providing the following functionality:\n\n- `mouseleave` and `mouseenter` events\
    \ on the component’s `<button>` element for devices with a fine pointer will call\
    \ the component’s `hoverOn` and `hoverOff` methods. Because only those with fine\
    \ pointing devices (such as a mouse) can “hover” over them.\n- A `submit` event\
    \ listener on the `<form>` element calls the component’s `subscribe` method.\n\
    \n(Note: The provided text had some repetitive/fragmented descriptions at the\
    \ end; I have cleaned the flow while maintaining the core technical logic described.)\n"
