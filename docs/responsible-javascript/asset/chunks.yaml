- fmt: "\nWith this setting enabled, Twitter downloads ultra-low-resolution placeholders\
    \ for images and videos, then allows users to choose whether they want to view\
    \ the associated media (Fig 4.15).\n\n![Screenshot of a tweet by @OversightDems:\
    \ “One year ago we lost chairman Elijah E. Cummings. Watch this tribute and his\
    \ message to America: VOTE.” Attached is a blurred video thumbnail with a “load\
    \ video” button centered over it.](image/4.15.png)\n\nFig 4.15: Twitter’s data\
    \ saver feature in action. Here, visitors can decide what media they wish to download\
    \ to conserve data usage.\n\nHow you implement a custom-built data saver feature\
    \ depends on your project. You can store it on a per-machine basis in a cookie\
    \ or in JavaScript using `localStorage` ([http://bkaprt.com/rjs39/04-16](http://bkaprt.com/rjs39/04-16)).\
    \ Or, if you want to broaden access to this feature as much as possible, you can\
    \ store this preference in an application’s backend.\n\nThe conceptual simplicity\
    \ of a data saver is what gives it power: if you offer people a chance to opt\
    \ into reduced data usage, there’s a good chance they’ll take you up on it. It’s\
    \ an opportunity to give people more control over their experience *and* reduce\
    \ your use of JavaScript on their behalf.\n\n## Resiliency: Thy Name Is Service\
    \ Worker\n\nIf you’ve ever installed ceramic tile, you know that it’s a hell of\
    \ a process. First, you ensure your subfloor is level. Then you lay down a decoupling\
    \ membrane on the subfloor. Then you put down a mortar bed. Then you back-butter\
    \ tiles and set them in the mortar bed. Then you grout. Then you seal the grout.\
    \ It’s a lot of work, but that work adds strength, resiliency, and appeal to the\
    \ finished installation.\n\nThe process of building resilient websites as we’ve\
    \ described it so far in this book is similarly redundant and layered. Yet, there’s\
    \ one more layer we should consider adding: a service worker ([http://bkaprt.com/rjs39/04-17](http://bkaprt.com/rjs39/04-17)).\n\
    \nService Worker is an API that acts as a proxy between the browser and the server.\
    \ Service workers are powerful little cogs that can intercept requests and responses,\
    \ reroute requests, cache responses, and provide offline capability to make a\
    \ website not only more accessible in more places but also faster.\n\n### Prioritizing\
    \ speed and access\n\nWeekly Timber is situated in Waushara County, Wisconsin.\
    \ Good network connections can be hard to come by out in a place like this (Fig\
    \ 4.16).\n\n![A broadband color overlay map of Waushara County, Wisconsin. Most\
    \ of the county is shown in tan, which indicates broadband speeds between 3 and\
    \ 9.99 Mbps. Areas in light blue and dark blue are faster.](image/4.16.png)\n\n\
    Fig 4.16: A broadband color overlay map of Waushara County, Wisconsin. Most of\
    \ the county is shown in tan, which indicates broadband speeds between 3 and 9.99\
    \ Mbps. Areas in light blue and dark blue are faster.\n\nThere’s farmland in Wisconsin,\
    \ yes, but there’s also tons of forest. If you need some trees cut down, you’ll\
    \ hit up Google and look for a logging company. How fast a logging company’s website\
    \ loads—or doesn’t—may factor into whether you give that company a call.\n\nThis\
    \ is where a service worker tuned for speed and resiliency helps. I built a service\
    \ worker for Weekly Timber that significantly improved perceptual performance\
    \ by:\n\n*   precaching header and footer markup during the service worker’s installation;\n\
    *   requesting only content markup and assembling it with the precached header\
    \ and footer markup;\n*   streaming the fully assembled response to get markup\
    \ to the browser as fast as possible; and\n*   avoiding service worker startup\
    \ delays by using navigation preload ([http://bkaprt.com/rjs39/04-18](http://bkaprt.com/rjs39/04-18)).\n\
    \nThe performance impact of these architectural decisions was pronounced. When\
    \ this service worker was deployed for Weekly Timber, it resulted in 42 percent\
    \ and 48 percent decreases in the median time to First Contentful Paint and Largest\
    \ Contentful Paint, respectively. Better yet, these improvements were observed\
    \ not by a synthetic performance testing tool but by people who actually use Weekly\
    \ Timber’s website ([http://bkaprt.com/rjs39/04-19](http://bkaprt.com/rjs39/04-19)).\n\
    \nBefore we can get into how we built this service worker, though, we’ll need\
    \ to establish a cache for it—because without a cache, a service worker won’t\
    \ do you a whole lot of good from a performance standpoint.\n\n### Establishing\
    \ a service worker cache\n\nService workers rely on the `Cache` interface ([http://bkaprt.com/rjs39/04-20](http://bkaprt.com/rjs39/04-20)),\
    \ which provides a caching layer distinct from the browser cache we covered in\
    \ Chapter 3. When a service worker installs, its `install` event fires ([http://bkaprt.com/rjs39/04-21](http://bkaprt.com/rjs39/04-21)).\
    \ This is where we create a new service worker cache:\n\n```javascript\nself.addEventListener(\"\
    install\", event => {\n const cacheName = \"fancy_cache_name_here\";\n const cachedAssets\
    \ = [\n \"/partial-header\",\n \"/partial-footer\"\n ];\n event.waitUntil(caches.open(cacheName).then(cache\
    \ => {\n return cache.addAll(cachedAssets);\n }));\n});\n```\n\nThere are two\
    \ things going on here:\n\n1.  Our service worker cache needs a unique identifier,\
    \ which we specify in `cacheName`. We use this identifier to open a cache with\
    \ the `Cache` interface’s `open` method ([http://bkaprt.com/rjs39/04-22](http://bkaprt.com/rjs39/04-22))\
    \ so we can track what we put in it.\n2.  After we open a new cache, we can precache\
    \ assets in it using the `Cache` interface’s `addAll` method ([http://bkaprt.com/rjs39/04-23](http://bkaprt.com/rjs39/04-23)).\
    \ We can populate it with anything we think is worth loading ahead of time.\n\n\
    ### Activating the service worker\n\nIn the service worker life cycle, activation\
    \ comes after installation. Activation is an opportunity to do some housekeeping,\
    \ which happens in a service worker’s `activate` event:\n\n```javascript\nself.addEventListener(\"\
    activate\", event => {\n const cacheName = \"fancy_cache_name_here\";\n const\
    \ preloadAvailable = \"navigationPreload\" in self.registration;\n event.waitUntil(caches.keys().then(keys\
    \ => {\n return Promise.all([\n keys.filter(key => {\n return key !== cacheName;\n\
    \ }).map(key => {\n return caches.delete(key);\n }),\n preloadAvailable ? self.registration.navigationPreload.enable()\
    \ : true\n ]);\n }));\n});\n```\n"
