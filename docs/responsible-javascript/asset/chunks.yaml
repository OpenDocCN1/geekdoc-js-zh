    # Foreword


    We all want users to have the fast, smooth web experience they expect, whether
    they’re using a phone, tablet, or laptop. But competing interests often intervene.
    Developers want an interesting development experience. Designers want a beautiful
    and crisp design. Program managers want detailed user interaction reports to test
    what works. Advertisers want to track, well, everything.


    It can feel impossible to balance all these needs while also cutting costs and
    speeding up the development process—and, sadly, the frameworks and libraries we
    turn to for help can have a negative impact on accessibility, security, web performance,
    and the user experience.


    If we truly want to deliver a great experience to our users, we must be better
    stewards of usability and performance—which is exactly what Jeremy can teach us.
    With over fifteen years of experience developing websites and applications for
    projects large and small, Jeremy has a sharp understanding of how to strike a
    balance between business requirements, user needs, and developer interests. He
    takes a big-picture approach, explaining not just the how of using `JavaScript`
    thoughtfully, but also the why. By learning from diverse, real-world examples,
    you’ll be able to envision what makes sense for your own projects, and build a
    high-performing, optimal experience for your users.


    You’ll also learn more than you ever wanted to know about wasps. Hopefully that
    information is never needed.


    —**Estelle Weyl**


    # Chapter 1. JavaScript: Handle with Care


    ![](image/2.png)


    Warning: this book contains excessive metaphors about wasps, which may be unsettling.


    Let’s kick this off with `Sphex`, the first of many wasps we’ll meet.


    `Sphex` is a genus of solitary wasps that nest underground and prey on crickets
    (Fig 1.1). When one of these wasps brings a cricket back to its nest, it does
    something uncharacteristically thoughtful: the wasp conducts a nest inspection,
    leaving the cricket outside. Once the wasp finishes, it reemerges to retrieve
    the cricket.


    Now for the kicker: if you—a prankster god of insectkind—move the cricket during
    the nest inspection, the wasp’s behavioral program reboots. The wasp knows only
    that the cricket wasn’t where it once was, so the wasp relocates it, drags it
    back to the nest entrance, and inspects the nest *again*.


    While this behavior isn’t consistent across digger wasps, the concept offers rhetorical
    usefulness by way of a word coined by scholar Douglas Hofstadter: `sphexishness`
    ([http://bkaprt.com/rjs39/01-03](http://bkaprt.com/rjs39/01-03)). When we say
    something is sphexish, we’re describing highly deterministic, preprogrammed behavior
    that has the *appearance* of thoughtfulness. I often grumble to myself about our
    industry’s sphexishness and the effect it has had on the collective usability
    of the web.


    ![A black wasp on a flowering plant, its antennae thrust forward and its mouth
    bent toward a bloom.](image/1.1.png)


    Fig 1.1: A wasp identified as `Sphex pensylvanicus`. Photograph by Hardyplants
    ([http://bkaprt.com/rjs39/01-01](http://bkaprt.com/rjs39/01-01)), CC0 1.0 ([http://bkaprt.com/rjs39/01-02](http://bkaprt.com/rjs39/01-02)),
    via Wikimedia Commons.


    You didn’t fork out fun money for this book to be told that you’re a drone incapable
    of critical thought—and that’s certainly not the case. We all strive to do our
    work the best way we know how. Yet we do many small, almost ceremoniously repetitive
    things as web developers that are definitely sphexish.


    Consider our relentless adherence to best practices, even when they result in
    poor user experiences. We `npm install` packages without considering potential
    downsides or alternative methods. We chase new tools in the hope that they’ll
    increase our productivity—even though that constant churn invites its own insidious
    productivity cost.


    We just do a lot of *stuff* that results in bad outcomes for the people who use
    what we make. It’s a bold assertion, yes.


    ![Line graph showing a steady increase in the amount of JavaScript served to mobile
    devices between 2012 to 2021.](image/1.2.png)


    Fig 1.2: This HTTP Archive graph shows the median, 75th, and 90th percentiles
    of JavaScript delivered to mobile devices. From 2012 to 2021, 10 percent of websites
    have gone from shipping 200 kilobytes to nearly 1.25 megabytes.


    ## JavaScript’s Role in Performance


    Using JavaScript responsibly first requires an understanding of how browsers process
    it. It’s tempting to reduce a website’s performance to its transfer size.


    Yes, the page that sends fewer bytes will typically be faster than the one that
    sends more—given identical conditions, anyway. Yet this isn’t the only factor
    for web performance. In reality, there are two: loading performance and runtime
    performance.


    ### Loading performance


    *Loading performance* is how quickly an HTML document and its assets—CSS, images,
    and yes, JavaScript—arrive over the network after the browser requests them. All
    we can control when it comes to loading performance is what we send, how much
    of it we send, and how we send it. Much of what affects loading performance occurs
    beyond our control, in that chasm between the browser and the web server.


    Despite this, we have a few tricks at our disposal to improve loading performance:


    *   *Minification*, which culls unnecessary spaces and comments from text assets
    such as HTML, CSS, and JavaScript files to reduce their size. Minification is
    effective since it takes advantage of the fact that computers don’t require such
    luxuries to run the code we write.


    *   *Compression*, which is when the server reduces text asset size via a compression
    algorithm prior to sending it to the browser. Think ZIP files, except assets are
    compressed before being sent and are decompressed after they arrive over the network.

