    performance profiler you use, the goal is the same: you want deep insight into
    your website’s performance so you can find specific opportunities for improvement.


    Modern browsers are largely consistent in where they place their performance profilers.
    To start, open your browser’s developer tools and look for the array of tabs across
    the top (Fig 3.8). Generally, a browser’s performance profiler will reside under
    a tab labeled “Performance” or “Timeline.”


