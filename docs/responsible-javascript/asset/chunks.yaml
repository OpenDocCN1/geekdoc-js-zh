- fmt: "\nTo wit: I whipped up a Codepen example that demonstrates how to create a\
    \ Grid Layout-powered presentation that automatically flows elements in empty\
    \ spaces ([http://bkaprt.com/rjs39/06-03](http://bkaprt.com/rjs39/06-03)). The\
    \ markup consists of a `<ul>` element packed with `<li>` elements containing images\
    \ of wasps (Fig 6.2). The `<ul>` itself is styled thus:\n\n![A “masonry”-style\
    \ grid layout of images of wasps with their measurements in millimeters. Heading:\
    \ “A few of my favorite hymenopterans.”](image/6.2.png)\n\nFig 6.2: An example\
    \ of a fully responsive Grid Layout that automatically flows elements based on\
    \ viewport width.\n\n```css\nul {\n  display: grid;\n  grid-gap: 1rem;\n  grid-auto-flow:\
    \ dense;\n  max-width: 72rem;\n  margin: 0 auto;\n  grid-template-columns: repeat(auto-fit,\
    \ minmax(12rem, 1fr));\n  grid-auto-rows: 12rem;\n}\n```\n\nIf you’re not familiar\
    \ with Grid Layout, these rules are slicker than you realize. On all devices,\
    \ it creates a fully responsive Grid Layout that follows these rules:\n\n*   Each\
    \ row of the `<ul>` will contain as many columns as it can accommodate at the\
    \ current viewport width.\n*   Each column will be, at a minimum, 192 pixels (`12rem`)\
    \ in width, but expand up to a proportional size of one fractional unit ([http://bkaprt.com/rjs39/06-04](http://bkaprt.com/rjs39/06-04)).\n\
    *   Rows will be automatically added as needed, with each row being 192 pixels\
    \ (`12rem`) in height. Additionally, new items will be densely packed in wherever\
    \ they can fit by way of the `grid-auto-flow: dense;` rule.\n\nWe’ll then spice\
    \ up the layout with an `:nth-child` selector on the `<ul>` element’s `<li>` children\
    \ at screen sizes wider than 448 pixels (`28rem`) containing two more Grid Layout\
    \ properties to give things a bit more zazz:\n\n```css\n@media screen and (min-width:\
    \ 28rem) {\n  li:nth-child(4n + 4) {\n    grid-column: span 2;\n    grid-row:\
    \ span 2;\n  }\n}\n```\n\nZazz aside, this is pure CSS! There’s no reason to reach\
    \ for canned layout solutions that ship more CSS than necessary—which, let’s face\
    \ it, if you’re shipping more CSS, you’ve got less headroom for more JavaScript.\
    \ Grid Layout is also well supported ([http://bkaprt.com/rjs39/06-05](http://bkaprt.com/rjs39/06-05)).\
    \ Better yet, it won’t limit you to simple layouts (Fig 6.3).\n\n![A text-heavy\
    \ grid based layout; the contents of the page are skewed to a 45 degree angle.](image/6.3.png)\n\
    \nFig 6.3: The CSS Grid Layout-powered landing page of Jen Simmons’s layout lab\
    \ ([http://bkaprt.com/rjs39/06-06](http://bkaprt.com/rjs39/06-06)) as shown on\
    \ a large screen.\n\nIf you want to build truly eye-catching layouts that push\
    \ the boundaries of what we’re used to seeing on the web, CSS frameworks abstract\
    \ too many of CSS’s features and complex selectors away from you to take full\
    \ advantage of them. For further reading on modern CSS layout modes, check the\
    \ Resources section.\n\n### Lazy loading, now brought to you by HTML\n\nLazy loading\
    \ is the performance pattern for the ages. It not only conserves bandwidth, but\
    \ it also reduces bandwidth contention for other critical assets at startup—including\
    \ JavaScript!\n\nIn the long history of the web, lazy loading has largely been\
    \ a task for JavaScript. We do not need JavaScript to do this in most cases nowadays,\
    \ since HTML itself provides a way to lazy-load assets referenced by `<img>` and\
    \ `<iframe>` elements. Which is good, because the potential downsides of JavaScript-driven\
    \ lazy loading are legion:\n\n*   Inevitably, all JavaScript-based lazy loaders\
    \ require main-thread time.\n*   You need `<noscript>` fallback markup if users\
    \ have JavaScript turned off. This adds a lot of extra bytes to your markup ([http://bkaprt.com/rjs39/06-07](http://bkaprt.com/rjs39/06-07)).\n\
    *   Beyond the fact that some people might have JavaScript turned off, some networks\
    \ or browser plugins might block JavaScript—or your lazy loader may just fail\
    \ to load altogether.\n*   Images—lazy-loaded or not—require `width` and `height`\
    \ attributes on `<img>` elements to prevent layout shifting. If you forget to\
    \ do this, your site’s Cumulative Layout Shift score (CLS, from Chapter 3) may\
    \ suffer.\n*   Lazy-loaded media won’t be indexed by search engines unless you\
    \ think to check for search engines ([http://bkaprt.com/rjs39/06-08](http://bkaprt.com/rjs39/06-08)).\n\
    \n## Observe This\n\nVarious observer APIs follow a similar pattern to observe\
    \ changes in certain aspects of a page: they observe a target—a DOM node, for\
    \ example—and run a callback function whenever they detect change(s) in that target.\n\
    \nObservers are worth learning because they replace the antipatterns of yore where\
    \ we did wasteful stuff like, say, constantly polling for an element’s visibility.\
    \ Observers turn expensive work into cheap work (Fig 6.4).\n\nSpeaking of checking\
    \ for element visibility, let’s start with that. Sometimes you need JavaScript\
    \ to tell you if something is in the viewport. One common example of using the\
    \ Intersection Observer API is lazy-loading media.\n\n“But,” you insist, “you\
    \ just said that HTML already handles this!” It sure does! But only for `<iframe>`\
    \ and `<img>` elements, which aren’t the only things you could lazy-load. What\
    \ about placeholder images for `<video>` elements?\n\n```html\n<video width=\"\
    500\" height=\"257\" poster=\"cats-being-jerks.jpg\">\n  <source src=\"cats-being-jerks.webm\"\
    \ type=\"video/webm\">\n  <source src=\"cats-being-jerks.mp4\" type=\"video/mp4\"\
    >\n</video>\n```\n"
