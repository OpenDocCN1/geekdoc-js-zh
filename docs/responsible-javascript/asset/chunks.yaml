    \ that use your project’s JavaScript to output production-ready assets. It behooves\
    \ you to know how to navigate these toolchains, as they can affect your website’s\
    \ performance—for better or for worse. We’ll touch on these shortly.\n\n# Chapter\
    \ 5. Navigating Toolchains\n\n![](image/6.png)\n\nCicada killer wasps elicit an\
