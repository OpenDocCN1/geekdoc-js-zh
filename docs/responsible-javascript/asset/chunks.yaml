- fmt: '

    ## Fig 2.4: A timeline in `Chrome`’s performance profiler of Chase Bank’s credit
    card app login screen, accessed using a budget Android device. While the initial
    markup is provided by the server, the login form itself (at bottom in the right-hand
    screenshots) doesn’t appear until more than eight seconds later after the page
    is fully loaded on a slow 3G connection. This is due to requests for multiple
    JavaScript assets (depicted at top) that are required to render the login form
    markup on the client.


    Because Self-Defined relies on the server for its crucial markup and functionality,
    it avoids the unnecessary complexity that comes with building web apps. This allows
    Self-Defined’s maintainers to focus on sharpening its `content` rather than grappling
    with the ever-changing landscape of frameworks, tools, and best practices often
    touted alongside them. As a result, it’s fast, accessible, and therefore more
    `inclusive`.


    ![Frames of the Self-Defined website plotted over time, showing that almost all
    of it loads in less than 3 seconds.](image/2.5.png)


    ## Fig 2.5: A timeline in `Chrome`’s performance profiler of the Self-Defined
    website, accessed using a budget Android device. Because Self-Defined’s markup
    is served entirely from the server, its core content is available to read almost
    instantly, even on a slower 3G connection.


    That’s not to say that web apps are dirty, awful, no-good things that you should
    never, ever build in a million years—but be aware that such an approach pulls
    you down a road that can more easily cause performance issues. Web apps absolutely
    require client-side JavaScript—and often more of it—by their very nature. If you’re
    going to roll with the web-app model, you have work ahead of you to ensure a good
    user experience.


    Gmail’s web app is a prime example of a very heavy client-side web app. It works
    fine if you have a fast machine and a snappy network connection, since it ships
    megabytes of compressed JavaScript that decompresses into a hell of a lot more
    to process and execute. Despite such enormous JavaScript payloads, Gmail sees
    widespread use. Just in case, though, it allows those on slow connections to opt
    into a basic HTML view (Fig 2.6).


    ![Gmail''s basic HTML view, showing a white background and minimal styling on
    links and buttons.](image/2.6.png)


    ## Fig 2.6: Gmail’s basic HTML view sends markup from the server and minimal JavaScript
    in lieu of the JavaScript-heavy client rendering favored by its standard view.


    Gmail’s basic HTML view uses roughly 50 kilobytes of total data to function, and
    only a sliver of that is JavaScript. While its appearance is admittedly dated,
    this stripped-down experience is a server-driven fixture that stands as one hell
    of an argument that webmail—and other crucial applications—can be functional without
    being dependent on tons of client-side JavaScript.


    That said, you don’t have to bifurcate your projects in this way. Nearly every
    would-be, JavaScript-heavy web app can be made functional with HTML sent from
    the server and an application backend to handle core functionality. After that,
    JavaScript becomes the cherry on top of a minimally viable experience.


    ### Server-first is user-first


    When someone uses a website, they’re interacting with markup. But is it markup
    sent from the server, or is it rendered on the client by JavaScript? While either
    approach results in a user interface, they each involve trade-offs.


    Let’s examine this problem by analyzing how a browser on a budget device deals
    with markup sent by the server versus markup rendered on the client with JavaScript.
    For the test case, let’s use a Moto E Android 10 device to access Shakespeare’s
    `Hamlet`, with each of its twenty scenes presented on a separate page in unstyled
    HTML.


    There are two different ways to deliver this content: one approach chunks up each
    scene into its own HTML file, relying on conventional `<a>` elements to navigate
    between them (Fig 2.7). The other approach uses a popular JavaScript framework
    to render each scene’s markup on the client, relying on a client-side router (a
    tool we’ll talk about soon) to navigate between pages (Fig 2.8).


    ![Pie chart of browser activity of HTML files over 18,428 milliseconds, with 94
    milliseconds spent on scripting.](image/2.7.png)


    ## Fig 2.7: A summary of browser activity when traversing twenty pages presented
    as separate HTML files using conventional `<a>` elements. The only scripting activity
    is that incurred by the browser’s internals, such as `unload` and `pagehide` event
    handlers.


    ![Pie chart of browser activity of client-rendered markup over 19,444 milliseconds,
    with 787 milliseconds spent on scripting.](image/2.8.png)


    ## Fig 2.8: A summary of browser activity when traversing twenty pages of client-rendered
    markup using client-side routing. The scripting activity involved takes more than
    eight times longer than for the same content presented as separate HTML files.


    This is a highly simplified test case, yes, but it effectively demonstrates the
    performance penalties incurred by rendering markup on the client. When we send
    HTML from the server, the browser streams and processes it in manageable chunks,
    making the work much more efficient than if we delegated it entirely to JavaScript.


    When we render markup on the client with JavaScript, we’re encapsulating that
    markup in some fashion within JavaScript, which requires processing on top of
    loading. After all that business, the browser must execute that script to render
    the markup. Rendering markup on the client is more expensive by its very nature.


    Now let’s talk about the real-world effects of client-rendered markup on perceptual
    performance: web apps that render markup on the client often send an `app shell`
    from the server on startup. An app shell is the minimum amount of markup necessary
    to bootstrap a web app (Fig 2.9). When the scripts requested by the app shell
    load, an API call is made to a server-side API with `fetch`.


    ![Twitter loading on a smartphone, showing an empty screen with a spinning loading
    indicator.](image/2.10.png)


    ## Fig 2.9: The app shell for Twitter. The app shell loads immediately, but there’s
    a delay while an API call populates the interface. A loading indicator spins in
    the meantime.


    Twitter is a great example of the web-app style of development at work. While
    Twitter’s web app is a reasonably fast client-rendered experience, this model
    is potentially problematic. When we rely solely on client-side rendering, each
    script responsible for populating the app shell becomes a potential point of failure
    (Fig 2.10).


    ![An error message from the Twitter mobile app reading: "Something went wrong,
    but don''t fret—let''s give it another shot. Try again."](image/2.9.png)


    ## Fig 2.10: The Twitter mobile app after a critical JavaScript resource fails
    to load. The only recourse is to reload the page and hope for the best.


    Even when all goes well, client-rendered markup can involve a perceptual performance
    penalty. Those using a client-rendered app must wait not only for the app shell
    markup but also for API call(s) to populate it with meaningful content (Fig 2.11).


    ![Frames of a Twitter profile loading; the first four screens are mostly blank,
    while the full screen does not appear until 12,425 milliseconds.](image/2.11.png)


    ## Fig 2.11: A timeline of a Twitter profile loading on a budget Android mobile
    device on a slow 3G connection. Because the app is rendered on the client, there’s
    a significant delay between the page’s first paint and when the page populates
    with meaningful content.


    If, instead, we send contentful markup from the server first and then attach functionality
    to the interactive parts of the page, we can deliver a more meaningful experience
    sooner and avoid excluding those with spotty connections or with JavaScript disabled
    from accessing that content.

