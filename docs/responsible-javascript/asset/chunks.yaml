    \ happen immediately. Idle callbacks take longer to process on slower devices.\
    \ The last thing you want to do is delay critical work in environments that have\
    \ less tolerance for poor performance.\n\n### `requestIdleCallback` fallbacks\n\
    \nDespite decent browser support, `requestIdleCallback` isn’t supported everywhere\
    \ ([http://bkaprt.com/rjs39/06-14](http://bkaprt.com/rjs39/06-14)). While polyfills\
