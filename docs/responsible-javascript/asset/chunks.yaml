- fmt: '

    Versioning assets is the most involved of the two, as URLs are how browser caches
    keep track of assets. If a JavaScript file named `scripts.js` is served from `compuglobalhypermega.net`,
    this asset is not versioned. If someone visits `compuglobalhypermega.net` on Monday
    and downloads `scripts.js`, and a `max-age` directive specifies a freshness period
    of one month, the browser will use the copy in its cache when that user visits
    the site again on Friday—even if a new version of `scripts.js` was published on
    Wednesday. That’s bound to break stuff.


    One workaround is to append a query string to the URL when an asset changes: `compuglobalhypermega.net/js/scripts.js`
    becomes something like `compuglobalhypermega.net/js/scripts.js?v=1`. When the
    file changes, the query string is incremented to `?v=2`.


    This approach isn’t sustainable for anything but the simplest of websites, so
    it’s best to automate versioning. One way would be to compute a hash of the file’s
    contents in your application backend so that the query string updates itself.
    The following PHP code example shows how to generate a hash of an asset’s contents
    that is then appended to the URL in a `<script>` tag:


    ```php

    <?php $fileHash = md5(file_get_contents("./scripts.js")); ?>

    ```


    ```html

    <script src="/js/scripts.js?v=<?php echo($fileHash); ?>"></script>

    ```


    Another versioning method involves using a bundler—a tool we’ll talk about in
    Chapter 5—to compute the hash of its contents at build time and inject it into
    the asset’s file name. The result is a file name that looks like this:


    ```

    scripts.4d3b7eda068fd80bef9ed2f05d52c3df.js

    ```


    Either way works, because it’s very likely that your HTML isn’t cached (and if
    it is, it probably shouldn’t be). When the HTML is updated, new assets are referenced
    instead of old ones and are cached separately.


    An optimal caching policy is the second part of this soiree. This is an example
    of a strong caching policy for a versioned static asset:


    ```

    Cache-Control: max-age=31536000, immutable

    ```


    This instructs the browser to cache the associated asset up to one year. We’ve
    also added an additional `immutable` directive as a further optimization, which
    tells supporting browsers, “Hey! This file will never change. Don’t bother checking
    with the server to see if it has!”


    It may seem weird to cover browser caching in a book about JavaScript, but it
    plays a big role in the loading performance of many asset types—JavaScript chief
    among them. That’s no small part of using JavaScript responsibly.


    ## Progressive Enhancement


    Okay, so you’ve got server-provided markup and some solid caching practices in
    place. Now you get to focus on progressively enhancing your website with JavaScript.


    Progressive enhancement—as it applies to JavaScript, anyway—is this idea that
    we first implement a website’s essential functionality without JavaScript. Once
    we have a baseline experience that works without JavaScript, we then apply JavaScript
    selectively to provide a better experience for those who can benefit from it ([http://bkaprt.com/rjs39/02-16](http://bkaprt.com/rjs39/02-16)).


    Progressive enhancement is a hard sell because it requires consensus that an experience
    should function in more than one ideal way. Yet its chief benefit is that redundant
    layers of functionality make a website more accessible and inclusive no matter
    where it’s accessed from.


    ### Set a baseline


    You can apply progressive enhancement to most critical interaction points. Form-driven
    interactions are prime examples. For instance, let’s take a social media-type
    website where people can subscribe to new content from other people. This is an
    excellent example of where we can use progressive enhancement to facilitate a
    common interaction pattern that we’re all familiar with. This functionality is
    provided by—unsurprisingly—a `<button>` element.


    We *could* write some JavaScript to make a `fetch` call to a backend API when
    that button is clicked, then update its state on the client if the request succeeded.
    This isn’t an antipattern per se, but it shouldn’t be the sole way for this functionality
    to work. It should be an enhancement on top of a server-provided interaction.


    To establish that baseline, we’d wrap the Subscribe button in a `<form>` element
    with an `action` attribute that points to a server route to handle subscription
    requests:


    ```html

    <form method="POST" action="/subscribe">

    ```


    ```html

    <button type="submit" class="subscribe-button">Subscribe</button>

    ```


    ```html

    <input type="hidden" name="subscribee-id" value="1">

    ```


    ```html

    </form>

    ```


    The server ensures that only existing user IDs are valid and that subscription
    requests can occur only on behalf of the current authenticated user. In short,
    security guidelines are enforced on the server—even though, yes, the content of
    the hidden `subscribee-id` input could be modified by some interloper, but to
    no avail.


    Once the server handles the subscription request, the browser is redirected back
    to the user’s profile page. Because the HTML is regenerated for that request,
    the state provided by the server will then show that the user has subscribed to
    that profile.


    If this interaction seems inefficient compared to a JavaScript `fetch` request,
    you’re not wrong! Thing is, though, the goal at this stage isn’t to be efficient
    but to set a baseline that expands access in the *absence* of JavaScript.


    ### Enhance!


    Okay, we’ve got some server-provided functionality. Now we can sprinkle on a bit
    of JavaScript to enhance it.


    The Subscribe button’s markup is rendered on JavaScript. If we wanted, we *could*
    use a framework like React on the client to provide the functionality, and then
    attach it via JavaScript during startup.


    However, using a framework to do this requires us to move with care. Might the
    performance and accessibility costs be worth it for a better developer experience?
    Maybe! But this is the time to question the assumption that a good developer experience
    begets a good user experience.


    Client-side interactions are driven by event listeners. It matters whether you
    manage event listeners yourself with `addEventListener` or rely on a framework
    to handle them, as relying on a framework may incur a high efficiency cost (Fig
    2.13).


    React’s handling of event listeners and their associated state is computationally
    expensive. Depending on the device, it can sometimes take quite a bit longer for
    React to do its thing than event listeners you’d register yourself—or a competing
    framework ([http://bkaprt.com/rjs39/02-17](http://bkaprt.com/rjs39/02-17)).


    ![Flame chart showing dozens of nested functions prompted by a single click event.](image/2.13.png)


    Fig 2.13: A call stack in Chrome’s performance profiler of a `click` event handled
    by React to open a mobile navigation menu.


    Remember that any task running longer than fifty milliseconds is a long task;
    the overhead a framework introduces to manage event listeners gives you a lot
    less headroom for other work. If we’re willing to register event listeners ourselves,
    we can see that the same interaction is a lot less bulky in terms of processing
    costs (Fig 2.14).


    ![Flame chart for the same click event showing no nested functions.](image/2.14.png)


    Fig 2.14: A call stack in Chrome’s performance profiler of a click event opening
    a mobile navigation menu without a framework.


    While client-side frameworks simplify componentization and state management, you
    don’t necessarily need a framework to manage those things. Web Components may
    be a viable alternative and more serviceable than you might think.

