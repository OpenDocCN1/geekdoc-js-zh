    从这里，你可以通过点击调用栈的各个部分深入分析记录的交互，就像你在分析启动性能时做的那样。你可以访问相关信息，这些信息会准确告诉你是什么触发了交互，以及花费了多少时间。但注意：如果你正在调试生产网站上交互的运行时性能，你需要确保在发布
    JavaScript 文件的同时也发布源映射（source maps）以辅助调试（[`bkaprt.com/rjs39/03-14`](http://bkaprt.com/rjs39/03-14)）。否则，在本地开发构建中对交互进行分析更有意义，因为代码没有经过压缩，可读性更高。


    ![性能分析器时间线，显示了与父任务阻塞部分相关的子任务。](img/3.19.png)


    图 3.19：在目标网站上切换设置菜单触发了一个耗时 490 毫秒的任务。该任务的阻塞时间占任务总时间的 90% 左右，对于这样一个高价值的交互来说，这个比例是巨大的。


    通过测试各种交互来查看它们是否足够快可能像是一项机械的练习，但如果你想要获得更高的精确度（并且愿意付出更多精力），你可能会依赖 `User Timing API`
    来带有应用特定时间戳的慢速交互（[`bkaprt.com/rjs39/03-15`](http://bkaprt.com/rjs39/03-15)）。


    要让网站在所有需要的地方都尽可能快是一项巨大的工作。然而，如果你想让这些工作真正发挥作用，请务必在低端设备上测量网站的 JavaScript 性能，以便更容易发现潜在的性能问题——这正是你即将要学的！


    ### 在设备上测试


    在第 1 章中，我们提到了性能不仅在不同网络之间，在不同设备之间也存在。我们可以在 `WebPageTest` 这样的合成测试工具中观察这一点，它允许你在特定设备上运行测试，从该设备的视角来评估性能。在其结果页面上，你可以访问主线程活动可视化图，它们代表了不同的设备性能特征（图
    3.20）。


    ![来自 WebPageTest 的两个火焰图，显示了主线程活动和页面交互性。页面交互性有间歇性的红色标记。](img/3.20.png)


    图 3.20：顶部是 Moto G6 Android 手机的主线程，底部是 Alcatel 1X Android 手机。由于处理能力较低，Alcatel 1X
    产生了更多的阻塞时间。


    虽然 `WebPageTest` 对于快速抽检很有用，但在开发期间使用它会遇到瓶颈。首先，`WebPageTest` 只能访问公开可的 URL。其次，它执行任务需要花费相当长的时间。当你需要快速测试和重新测试代码更改如何影响低端设备的性能时，这些限制会非常头疼。


    本地测试的更好替代方案是 Chrome 的远程设备调试工具，它可以为连接到笔记本电脑或台电脑的 Android 设备启动开发者工具实例。如果连接的设备启用了
    USB 调试（[`bkaprt.com/rjs39/03-16`](http://bkaprt.com/rjs39/03-16)），你可以通过将 Chrome
    指向 `chrome://inspect#devices`，在主机的开发者工具中访问设备在 Chrome 中打开的任何页面（图 3.21）。


    你可以通过点击页面的 `Inspect` 链接从调试工具的主界面启动 Chrome 开发者工具实例。从那里，你可以像往常一样使用 Chrome 的性能分析器来记录页面活动（图
    3.22）。


    ![Chrome 开发者工具中的“Devices”配置标签页。(image/3.21.png)图 3.21：Chrome 远程设备调试工具的入口。当 Android
    设备启用了 USB 调试且在其 Chrome 实例中打开了页面时，将列出其活动标签页。正如人们所说的，这是一件大事，因为完全改变了你的性能分析上下文。很有可能，你的开发机比大多数人们浏览互联网时使用的设备要强得多。当你在资源受限的设备上使用
    Chrome 性能分析器时，你会发现那些在配置完善的笔记本电脑上看起来无异常的问题。![Chrome 性能分析器旁边是在浏览器窗口内运行的模拟 Android
    设备。](img/3.22.png)


    图 3.22：你可以使用 Chrome 的性能分析器来记录连接的 Android 设备的活动；它甚至可以在性能分析器旁边显示设备的显示内容。


    Chrome 不允许你对连接的 iOS 设备这样做，但如果你在启用了开发者工具的 macOS 主机上，Safari 是可以的（[`bkaprt.com/rjs39/03-17`](http://bkaprt.com/rjs39/03-17)）。将
    iOS 设备连接到 macOS 主机，你可以通过主机上的 `Develop` 菜单检查在 Safari 中打开的页面。连接的 iOS 设备名称将作为一个单独菜单选项出现，下方列出已打开的页面（图
    3.23）。点击页面 URL 将启动 Safari 开发者工具实例，包括性能分析器。


    ![Safari 的“develop”菜单已打开，高亮了“Jeremy’s iPhone”菜单项。“Safari”下有一个可选择的项。](img/3.23.png)


    图 3.23：Safari 的远程设备调试允许对连接到 macOS 主机的 iOS 设备进行远程调试。虽然这很有用，但是时候说些真话了：在 2021 年 4
    月，StatCounter Global Stats 发现，在全球调查的设备中，41.6% 是 Android 设备，而 iOS 仅占 16.07%（[`bkaprt.com/rjs39/03-18`](http://bkaprt.com/rjs39/03-18)）。如果你不确定应该分析哪些设备，请使用旧的、性能较差的硬件进行测试。你会发现更多问题，是的，但修复这些问题会让所有人受益，而不仅仅少数买得起高端硬件的富人。你需要了解你网站的
    JavaScript 是如何损害访问者的信任的。这正是负责任的 Web 开发从业者应该做的。


    [等待]


    所以，我们已经讨论了一些实验室指标（lab metrics）、实地指标（field metrics）以及性能分析。事实是，我们讨论的大部分内容等同于合成性能测试，即从你的本地机器使用
    `Lighthouse`、性能分析器或——如果你足够高端——使用像 `WebPageTest` 这样从一致基准运行性能测试的工具。当你使用这些工具时，你正在收集实验室指标。


    实验室数据对于从开发者视角衡量性能基准非常有帮助。你测试并发现了一个问题，例如一个巨大的 JavaScript 资源导致启动性能下降。你优化了一些内容，再次测试，并记录实验室指标中的变化。这些很有用。


    遗憾的是，实验室指标只能描述一个人的视角：即运行合成测试的人。如果你想真实了解你的网站对现实世界中的用户表现如何，你需要收集并分析实地指标。


    ### 收集实地指标


    在收集后期分析的实地指标方面，有很多工具，它们在成本、功能和质量上不相同。收集工具总是需要一些客户端 JavaScript 从浏览器 API 收集数据并发送到收集端点。有一些开源选项可以帮你收集这些数据——例如
    `Boomerang`——或者你可以自己动手。


