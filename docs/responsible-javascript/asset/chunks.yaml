  trans: "\n\n虽然 `script-src` 可以通过 `'unsafe-inline'` 标记来允许内联脚本，但这并不是一个好主意。你可以将这些脚本移动到独立的文件中，或者在你的\
    \ CSP 头部文件中使用 `nonce` 的情况下，仍然可以使用内联脚本。在密码学中，`nonce` 是一个仅使用一次的随机数（[`bkaprt.com/rjs39/07-19`](http://bkaprt.com/rjs39/07-19)）。\n\
    \n关于 CSP，`nonce` 必须在每次请求时随机生成一个 base64 编码的字符串（[`bkaprt.com/rjs39/07-20`](http://bkaprt.com/rjs39/07-20)），并作为\
    \ `script-src` 指令的一部分发送：\n\n```\nContent-Security-Policy: script-src 'self' https://nexus.ensighten.com\
    \ 'nonce-aWJ1ZmFiaXVhc2RjYmk='\n```\n\n此时，内联的 `<script>` 元素的 `nonce` 属性必须设置为与\
    \ CSP 头部中设置相同的 nonce：\n\n```\n<script nonce=\"aWJ1ZmFiaXVhc2RjYmk=\">\n```\n\n\
    ```\n // 一个受信任的内联脚本\n```\n\n```\n</script>\n```\n\n实现这一点并非易事，但话虽如此，安全并非小事。生成 nonce\
    \ 需要应用程序后端的支持。在 PHP 中，可以使用 `random_bytes`（[`bkaprt.com/rjs39/07-21`](http://bkaprt.com/rjs39/07-21)）和\
    \ `base64_encode`（[`bkaprt.com/rjs39/07-22`](http://bkaprt.com/rjs39/07-22)）等函数来实现。\n\
    \n## `connect-src`\n\n正如我们之前提到的，某些第三方脚本可能会从你未知的其他跨源请求资源。虽然通过 `script-src` 限制加载哪些跨源脚本是明智的，但限制*这些*脚本加载哪些资源也是值得的。这正是\
    \ `connect-src` 派上用场的地方。\n\n当涉及到第三方资源时，将 `connect-src` 的允许源限制为 `'self'` 可能并不切实际。一个不错的开始可能是限制脚本从任何安全源加载的资源。基于我们的\
    \ CSP，它看起来会是这样：\n\n```\nContent-Security-Policy: default-src 'self' https:; script-src\
    \ 'self' https://nexus.ensighten.com; connect-src: 'self' https:\n```\n\n这只是一个开始，随着你更深入地了解你的第三方脚本从哪些额外的跨源加载其他脚本，请考虑对额外的跨源施加更深层次的限制。这是编写一个良好的\
    \ CSP 最困难的部分；它需要投入时间和精力。\n\n幸运的是，有一种方法可以让你采用，它不会*强制*执行 CSP，而仅仅在发生违规时进行报告——当你想要捕获特定页面上潜在的\
    \ CSP 违规，但不想无意中影响页面功能时，这种方法非常完美！\n\n## 通过 CSP 报告进行渐进式采用\n\n假设你正处于尚无法执行 CSP 的情况，但你想知道何时发生了违规行为。有两个\
    \ CSP 特性可以帮助完成这一工作：\n\n1. `Content-Security-Policy-Report-Only` 头部\n2. `report-to`\
    \ 策略指令\n\n`Content-Security-Policy-Report-Only` 头部采用与 `Content-Security-Policy`\
    \ 相同的格式，只是它不强制 CSP。相反，它在发生违规时会发出警告。将此头部与 `report-to` 策略指令配合使用，可以让你违规及其关联数据传输到端点进行审查。\n\
    \n所以，假设你的 CSP 正在工作，但你想在不破坏功能的情况下完善你的 `connect-src` 策略指令。因此，你决定采用一个仅包含 `'self'\
    \ https:` 的 `connect-src` 策略指令的 CSP，但将其他指令加上精炼后的 `connect-src` 策略指令添加到 `Content-Security-Policy-Report-Only`\
    \ 头部中：\n\n```\nContent-Security-Policy-Report-Only: default-src 'self' https:;\
    \ script-src 'self ' https://nexus.ensighten.com; connect-src: 'self' https://nexus.ensighten.com\
    \ https://www.googletagmanager.com; report-to compuglobalhypermeganet\n```\n\n\
    在这里，我们表示允许来自 nexus.ensighten.com 和 googletagmanager.com 的脚本，但考虑到第三方脚本可能会从各种跨源获取资源，我们希望当第三方脚本请求我们从未见过的跨源资源时，我们能收到通知。\n\
    \n为了在发生此类“仅报告”策略的违规行为时收到通知，我们添加了一个指定组名的额外 `report-to` 指令。组名可以可以是我们想要的任何内容，只要它与随附的\
    \ `Report-To` 头部中发送的 JSON 负载对应即可：\n\n```\nReport-To: {\"group\": \"compuglobalhypermeganet\"\
    , \"max_age\": 3600, \"endpoints\": [{\"url\": \"https://compuglobalhypermega.net/csp-report.php\"\
    }]}\n```\n\n此 JSON 负载指定了以下信息：\n\n* `group`，即 `report-to` 指令中的组名\n* `max_age`，浏览器发送报告的持续时间（秒）\n\
    * `endpoints`，发送报告的端点数组\n\n在这种情况下，CSP 不会被强制执行，但发生违规时，将从 `Content-Security-Policy-Report-Only`\
    \ 报告到 `Content-Security-Policy`。编写 CSP 是一个缓慢而持续的过程，但它的回报是更好的用户体验。比起其他任何品质，警惕才是负责任使用\
    \ JavaScript 的关键。\n\n## 结\n\n当你放下这本书回到日常工作时，我希望你理解，《负责任的 JavaScript》的目的并不是哀叹或指责行业对\
    \ JavaScript 的使用，而是为 Web 开发提供一条路径。我们每天可能需要向工程经理、产品利益相关者和同事汇报，但我们的首要责任是对我们的用户。\n\
    \n网页是一个不可或缺的工具，连接着人们，加速我们的日常工作，并在危机期间提供支持。我们如何选择 JavaScript 影响着人们的生活。\n\n# 致谢\n\
    \n我以前写过书，但这本书比以前任何一本都要辛苦。A Book Apart 关注材料的质量，他们的编辑流程也反映了这一点。很荣幸成为如此优秀的出版商书单的一员。\n\
    \n"
