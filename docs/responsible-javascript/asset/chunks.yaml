    \ of the `HTMLFormElem``ent` class.\n\nFrom here, we use the component’s `constructor`\
    \ method to establish the necessary object properties for the Subscribe button\
    \ to work:\n\n```\nclass SubscribeButton extends HTMLFormElement {\n```\n\n```\n\
    \ constructor () {\n```\n\n```\n super();\n```\n\n```\n this.subscribeButton =\
    \ this.querySelector(\".subscribe-button\");\n```\n\n```\n this.subscribed = this.dataset.subscribed\
    \ === \"true\";\n```\n\n```\n this.subscribeeId = Number(this.querySelector(\"\
