    \n## 抢占先机\n\n如果你的网站严重依赖 JavaScript，那么网络的顽固特性意味着请求脚本时产生的延迟将延长启动阶段。为了领先于这一混乱局面并缓解高延迟环境带来的痛苦，我们可以采用几种技术中的一种（或多种）。简而言之，我们越快能获取到这些脚本，浏览器处理它们的速度就越快。\n\
    \n### 自托管：一个虽然平淡但有效的技巧\n\n加载性能完全取决于连接，当浏览器打开通往 Web 服务器的连接时，会发生一种复杂的“舞蹈”（见图 4.2）：\n\
    \n1. 域名必须通过 `DNS lookup`（DNS 查询）解析到 Web 服务器的 IP 地址。\n2. 大多数 Web 服务器通过 `transmission\
    \ control protocol`（传输控制协议，即 `TCP`）进行通信。`TCP` 连接需要时间建立，且 `TCP handshake`（TCP 握手）和\
    \ `slow start`（慢启动）因素都会影响 Web 服务器响应的速度 ([`bkaprt.com/rjs39/04-08`](http://bkaprt.com/rjs39/04-08))。\n\
    3. 如果涉及 `HTTPS`，`transport layer security`（传输层安全，即 `TLS`）协商也需要时间。\n\n`HTTP/3`\
    \ 减少了连接和 `TLS` 协商涉及延迟。尽管如此，无论使用 `HTTP/3` 还是其他，总会有某些延迟。这就是为什么自托管是一种平淡但有效的性能增强，不仅针对\
    \ JavaScript，而且适用于所有资源类型。\n\n![Chrome 开发者工具中的表格，显示了连接阶段的延迟时间：挂起、DNS 查询、初始连接和安全套层。](img/4.2.png)\n\
    \n图 4.2：Chrome 开发者工具网络标签页中所示的连接 Web 服务器各个阶段涉及的延迟。\n\n自托管值得讨论，因为看到从 `cdnjs` 等公共\
    \ CDN 加载资源并不罕见 ([`bkaprt.com/rjs39/04-09`](http://bkaprt.com/rjs39/04-09))。虽然公共\
    \ CDN 可能有用，因为它们消除了托管流行库和框架的负担，但你必须权添加另一个跨源（即除你自己之外的任何 Web 服务器）的延迟成本与托管自己资源之间的关系（见图\
    \ 4.3）。\n\n![WebPageTest 的连接视图，列出了网站使用的所有源。每行代表一个独立的连接，显示 DNS 查询（青色）、连接（橙色）和 TLS\
    \ 协商时间（紫色）。](img/4.3.png)\n\n图 4.3：WebPageTest 的连接视图，列出了网站使用的所有源。每行代表一个独立的连接，显示\
    \ DNS 查询（青色）、连接（橙色）和 TLS 协商时间（紫色）。\n\n一个常见的误区是公共 CDN 由于 `shared caching`（共享缓存）提供了额外的性能收益。共享缓存的想法是，如果你访问一个请求（例如）托管在公共\
    \ CDN 上的 `React` 副本的网站，当另一个网站从同一位置请求该 `React` 副本时，应该从浏览器缓存中提取同一个 `React` 副本。\n\
    \n虽然这在理论上是一个受欢迎的优化，但在实践中并不存在，因为浏览器会对主源（即你的 Web 服务器）针对跨源请求进行键值，导致缓存未命中 ([`bkaprt.com/rjs39/04-10`](http://bkaprt.com/rjs39/04-10))。从性能角度来看，使用公共\
    \ CDN 没有任何优势。\n\n对于 JavaScript，自托管通过减少延迟缩短了加载阶段，这意味着浏览器可以更早进入处理阶段。\n\n### 使用资源提示“润滑”\n\
    \n在某些情况下，自托管并不总是在实践上可行的，这时 `resource hints`（资源提示）可以帮助减少跨源资源的延迟。`Resource hints`\
    \ 使用 `<link>` 元素引导浏览器更早地获取资源或打开跨源连接。它们的使用对于加速 JavaScript 加载至关重要，使网站能够更快地变得可交互。\n\
    \n#### 减少连接延迟\n\n源顺序描述了 HTML 中元素的顺序，当涉及 JavaScript 时，其重要性可能会被忽视。浏览器流式传输 HTML，并将解析工作切分成可以处理的部分。由于由于，位于标记末部的脚本引用直到浏览器解析它们时才会被发现。当这些脚本位于跨源时，这会增加跨源资源的延迟（见图\
    \ 4.4）。\n\n然而，通过 `preconnect`，我们可以在服务器开始处理 HTML 时打开跨源连接，只需在文档 `<head>` 中放置资源提示：\n\
    \n```html\n<link rel=\"preconnect\" href=\"https://syndication.twitter.com/\"\
    >\n<link rel=\"preconnect\" href=\"https://pbs.twimg.com/\">\n<link rel=\"preconnect\"\
    \ href=\"https://www.google-analytics.com/\">\n```\n\n通过更早地协商跨源连接来提高性能，而不是等待浏览器按发现它们（见图\
    \ 4.5）。\n\n![按域名分类的页面请求时间线，每个资源的类型彩色编码。](img/4.4.png)\n\n图 4.4：WebPageTest 的连接视图。第二行和第三行是跨源，连接在\
    \ HTML 解析器发现它们提供的资源之前尚未建立。\n\n当无法托管资源时，`preconnect` 是一种替代方案，可以减少加载跨源资源产生的延迟。这是一种有效且简单的性能优化，其影响比你想象的要大。\n\
    \n#### 预加载关键 JavaScript\n\n*Critical path*（关键路径）是 Web 性能中的一个概念，描述了渲染页面内容所需的请求数量\
    \ ([`bkaprt.com/rjs39/04-11`](http://bkaprt.com/rjs39/04-11))。`HTML` 和 `CSS` 文件是关键路径上典型的请求示例，因为没有它们就没有页面可言（见图\
    \ 4.6）。\n\n"
- fmt: "\n![Timeline of requests made by css-tricks.com. In a “frames” panel, thumbnails\
    \ show page rendering progress, beginning only as initial requests conclude.](image/4.6.png)\n\
    \nFig 4.6: Critical requests for HTML and CSS (shown in the network pane at the\
    \ top) shaded in blue and purple, respectively) for CSS-Tricks in Chrome’s performance\
    \ profiler. These assets are necessary before the page paints—shown in the timings\
    \ pane at the bottom as `FP` and `FCP`.\n\nCSS and HTML aren’t the only asset\
    \ types that can be on the critical path. In Chapter 2, we talked about how client-rendered\
    \ markup is more expensive than markup provided by the server. Beyond the computational\
    \ expense of parsing and executing JavaScript to render it, client-rendered markup\
    \ is also a performance liability in that it puts JavaScript in the critical path.\
    \ It’s a regrettably common pattern (Fig 4.7).\n\n![Timeline of JS requests made\
    \ by a Twitter URL. “Frames” contains a thumbnail of only the Twitter logo, no\
    \ progress as requests are made, then a rendered page as they conclude.](image/4.7.png)\n\
    \nFig 4.7: Critical JavaScript requests holding up the rendering of the mobile\
    \ Twitter web app’s settings page. While the loading screen appears quickly, the\
    \ browser must wait for scripts to load—shown in the top pane in yellow—before\
    \ the page fully renders.\n\nFortunately, the `preload` resource hint helps to\
    \ mitigate this issue by loading resources before the browser would normally discover\
    \ them.\n\nSay you have a page where you load two scripts before the closing `</body`\
    \ tag. The first contains vendor scripts—think frameworks and libraries. The second\
    \ contains your application logic:\n\n```\n<script src=\"/js/vendors.ae6fd23c.js\"\
    ></script>\n```\n\n```\n<script src=\"/js/scripts.1db3ef48.js\"></script>\n```\n\
    \n`preload` gets around waiting for the HTML parser by changing the browser’s\
    \ discovery order of page assets:\n\n```\n<link rel=\"preload\" as=\"script\"\
    \ href=\"/js/vendors.ae6fd23c.js\">\n```\n\n```\n<link rel=\"preload\" as=\"script\"\
    \ href=\"/js/scripts.1db3ef48.js\">\n```\n\nWith these hints in the `<head>`,\
    \ the browser will find these scripts sooner than if we otherwise waited for it\
    \ to discover them near the end of the document. By the time the browser encounters\
    \ the corresponding `<script>` elements at the bottom of the page, they’ll be\
    \ at least partially loaded.\n\nWhy, yes, there are caveats with `preload`:\n\n\
    *   Read this, then re-read it: if JavaScript is required to display critical\
    \ content on your website, you’re already in trouble. `preload` can be a salve\
    \ for your JavaScript-induced loading performance woes, but other critical resources\
    \ (i.e., stylesheets, webfonts, etc.) will be deprived of bandwidth because you\
    \ have effectively reprioritized JavaScript over them. Get to the source of the\
    \ problem—JavaScript, that is—and remove it from the critical path by having the\
    \ server provide that contentful markup instead of relying on client rendering\
    \ ([http://bkaprt.com/rjs39/04-12](http://bkaprt.com/rjs39/04-12)).\n*   `preload`\
    \ hints require an `as` attribute to describe the nature of the asset ([http://bkaprt.com/rjs39/04-13](http://bkaprt.com/rjs39/04-13)).\
    \ For scripts, this value should be `script`. If you’re an `as`hole and don’t\
    \ specify `as`, the preloaded response will be discarded.\n*   Because `preload`s\
    \ are given higher priority, other requests could be deprived of bandwidth. Use\
    \ `preload` sparingly. If everything is high priority, nothing is.\n*   If you’re\
    \ preloading a JavaScript module—that is, a script loaded by a `<script>` element\
    \ with a `type` attribute value of `module`—you don’t want `preload`. Instead,\
    \ you want `modulepreload`, which follows the same format as `preload`, but without\
    \ any of that `as` attribute business. There are also parsing benefits that come\
    \ with `modulepreload` that you don’t get with `preload`, such as recursively\
    \ preloading an entire module tree, as well as speculative parsing benefits ([http://bkaprt.com/rjs39/04-14](http://bkaprt.com/rjs39/04-14)).\n\
    \nCaveats aside, `preload` is effective, especially for critical JavaScript in\
    \ web-app architectures, which—quite frankly—need all the help they can get to\
    \ be performant. Use it responsibly, and as always, measure the benefits to see\
    \ if it’s right for your project.\n\n### Preload on-demand JavaScript\n\nRemember\
    \ earlier when we were yakkin’ about code splitting and dynamic import? Well,\
    \ one of the drawbacks of that whole scenario is that if you defer loading a script\
    \ right up until the second it’s needed, those on slow network connections will\
    \ find themselves waiting for your dynamic import to complete before the action\
    \ they’ve taken kicks off.\n\nThis doesn’t mean code splitting is an antipattern;\
    \ it just means we need to do a little thinking about how to solve the latency\
    \ drawback. Consider the example of the contact form from earlier that relied\
    \ on a dynamic import to retrieve the form validation script on submit. There’s\
    \ a bit of a delay before the form validation script downloads and runs (Fig 4.8).\n\
    \nThis delay is frustrating: when someone submits the form, they expect a signal\
    \ from the page that their interaction is being processed. Except there’s no indication\
    \ *anything* is happening until some script they.\n\n![Timeline containing a thumbnail\
    \ of a form, no progress as requests are made, then thumbnails showing invalid.](image/4.8.png)\n\
    \nFig 4.8: In this profiling session, it takes roughly two seconds to download\
    \ the form validation script, delaying.\n\nThis hypothetical situation doesn’t\
    \ invalidate the performance benefit of well-placed dynamic import, but we do\
    \ need to adjust our strategy. Let’s start with a small function that injects\
    \ `preload` into the `<head>` on demand:\n\n```\nfunction injectPreload (href,\
    \ module, as) {\n  let preloadHint = document.createElement(\"link\");\n  preloadHint.rel\
    \ = module ? \"modulepreload\" : \"preload\";\n  preloadHint.href = href;\n  if\
    \ (!module && typeof as !== \"undefined\") {\n    preloadHint.as = as;\n  }\n\
    \  document.head.appendChild(preloadHint);\n}\n```\n\nThis function takes three\
    \ arguments:\n1. The location of the script to preload\n2. A Boolean for whether\
    \ the script is a module; If so, the resource hint will be `modulepreload` rather\
    \ than a `preload`\n3. The value to populate the hint’s `as` attribute\n\nWhen\
    \ run, this function constructs the resource hint and injects the `<link>` element\
    \ into the `<head>`. This kicks off a request to get the script.\n\nAll that’s\
    \ left is to find the right moment to kick off the `preload`. Since this is a\
    \ form, the opportune moment is whenever a form field is focused; the user action\
    \ of filling out the form fields buys us some time:\n\n```\nconst inputs = Array.from(document.querySelectorAll(\"\
    #contact-form input, .contact-form textarea\"));\nlet preloaded = false;\n\ninputs.forEach(input\
    \ => {\n  input.addEventListener(\"focus\", () => {\n    if (!preloaded) {\n \
    \     injectPreload(\"/js/contact-form-validation.js\", false, \"script\");\n\
    \      preloaded = true;\n    }\n  }, {\n    once: true\n  })\n});\n```\n\nThis\
    \ ensures our form-validation script will only be preloaded when someone focuses\
    \ any of the inputs in the form, but only once. This is an exercise in gauging\
    \ intent: if someone has focused a form field, they probably intend to fill out\
    \ the form, and the preload will likely finish before they do.\n\nOnce the form\
    \ is submitted and the dynamic import kicks off, the validation script will already\
    \ be in the browser cache. This means the dynamic import will hit the browser\
    \ cache instead of the network, rendering the interaction practically instantaneous\
    \ (Fig 4.9).\n"
