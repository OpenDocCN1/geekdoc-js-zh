  trans: '


    你会遇到的两种常见绘制指标是`首次绘制`（First Paint，FP）和`首次内容绘制`（First Contentful Paint，FCP）。`FP`
    标识*任何*像素绘制到屏幕上的第一个时刻，而 `FCP` 则标识内容出现在视口中的时刻——即文本、图像、非白色的 `<canvas>` 元素等（图 3.2）。


    ![随时间绘制的网站帧图，显示了首次绘制和首次内容绘制发生的时间。](img/3.2.png)


    图 3.2：Chrome 性能分析器中的性能跟踪轨迹，显示了页面的首次绘制 (FP) 和首次内容绘制 (FCP)。`FP` 在灰色背景出现时发生，而 `FCP`
    在菜单切换按钮出现时发生。


    `FP` 通常与样式表的加载时间相关联，但它并不是一个非常重要的指标。第一个被绘制的内容在感知上可能并没有意义。


    相比之下，`FCP` *确实*更有意义，因为它它是面向内容的。页面的核心内容可能会被阻塞，直到某个庞大的 JavaScript 包下载、处理并最终运行，在此过程中可能会调用后端
    API 或渲染客户端标记。在那种情况下，`FCP` 可能会被延迟。


    虽然 `FCP` 是评估感知性能的一种诚实尝试，但*内容性*可能仅描述一个背景图像或无关紧要的文本节点。幸运的是，存在一种更精确的指标来描述更显著内容的绘制时间。


    ## 最大内容绘制


    `最大内容绘制 (Largest Contentful Paint，LCP)` 衡量的是视口中最大的内容块出现的时刻——无论是图像、视频还是文本节点（图 3.3）。`LCP`
    是对其他绘制指标的改进，因为它强调了内容的显著性，因此量化了更具感知意义的里程碑。


    ![随时间绘制的网站帧图，显示在加载过程开始 3,850 毫秒后出现了一个 19.8 毫秒的 LCP 事件。](img/3.3.png)


    图 3.3：Chrome 性能分析器中显示的 Chase 银行网站的最大内容绘制 (LCP) 事件。`LCP` 由于页面页眉标记的客户端渲染而导致延迟。


    与 `FCP` 一样，在依赖 JavaScript 在客户端渲染内容标记的架构中，JavaScript 会干扰 `LCP`。你的网站架构不应要求访问者在显著内容出现在屏幕之前等待
    JavaScript 的加载、处理和运行。


    性能监控工具（如 WebPageTest 和 Lighthouse）会报告 `LCP`。在编写期间，Google 建议 `LCP` 在 2.5 秒或以下为优（[`bkaprt.com/rjs39/03-04`](http://bkaprt.com/rjs39/03-04)），但未来的指导可能会有所不同。最好的建议是追求最高分，因为
    `LCP` 会影响你的页面在搜索结果中的排名。


    ## 布局稳定性


    你是否曾经试图点击一个链接，它却突然移动了，导致你点击了完全不同的东西？你不仅是网站违约的受害者，也是*布局不稳定*的受害者（图 3.4）。


    ![绘制 2,204 毫秒的网站帧图，显示了横幅和按钮等布局元素在加载时是如何移动的。](img/3.4.png)


    图 3.4：当 Currys PC World 网站上的多个页面元素加载时，其余布局移动了多次，导致关键交互元素发生不可预测的移动。


    布局不稳定的原因有许多，JavaScript 就是其中之一。你几乎肯定体验过的一个例子是：一个通知在页面生命周期的后期出现在页面顶部，将整个布局向下推。这通常是因为脚本需要时间来加载、处理和运行，导致在最糟糕的时刻发生偏移。


    所有的布局偏移——无论是由 JavaScript 引起还是其他原因引起——都会导致潜在的昂贵的布局重新计算工作，这会消耗主线程的时间。当布局偏移在启动期间争夺主线程的注意力时，留给
    JavaScript 处理和执行的空间就变小了。


    确定用户是否可以预判布局偏移是非常重要的。可预期的布局偏移是用户自愿交互的结果，例如展开手风琴控件。不希望的布局偏移是那些看似随机的、没有任何预先用户交互的偏移。


    例如，Twitter 的移动版网站——至少在编写期间——会自动加载推文。我们可以使用名为`累积布局偏移 (Cumulative Layout Shift，CLS)`
    的指标来衡量布局稳定性。与基于时间的指标不同，`CLS` 使用十进制系统来量化元素在视口中移动的距离（[`bkaprt.com/rjs39/03-04`](http://bkaprt.com/rjs39/03-04)）。良好的
    `CLS` 分数为 0.1 或更低，但随着用户体验指标的演变，这可能会改变。在实践中，该指标越接近 0 越好。


    ## 主线程响应性


    JavaScript 有巨大的潜力会延迟页面启动。我们可以通过三个指标评估它对用户体验的影响：可交互时间（Time to Interactive，TTI）、首次输入延迟（First
    Input Delay，FID）和总阻塞时间（Total Blocking Time，TBT）。


    ### 可交互时间


    还记得那个把某人的桌面设成纯色的恶作剧吗？当我们发送过多的 JavaScript 时，基本上就会发生这种情况。`TTI` 较高的网站行为上更像网站的截图，而不是真实的网站。


    *可交互时间 (TTI)* 是一种实验室指标，用于衡量页面何时变得可交互。它的计算方法是首先标记页面的 `FCP`。从那里开始，下一个五秒内既没有长任务也没有超过两个正在进行的网络请求的也会被标记。页面的
    `TTI` 就在那个安静窗口的开始处。在中端设备上，良好的 `TTI` 小于五秒（[`bkaprt.com/rjs39/03-07`](http://bkaprt.com/rjs39/03-07)），但尽管有重复的风险，我再次要求你尽可能降低。


    ### 首次输入延迟


    虽然 `TTI` 很棒，但它描述的是页面是否可交互，而不是该页面是否会对首次输入做出快速响应。`首次输入延迟 (FID)` 是一种字段指标，通过测量用户与页面首次交互到浏览器响应该交互之间的延迟来填补这一信息空白。


    '
- fmt: '

    FID isn’t strictly a JavaScript metric. Interactions that don’t rely on JavaScript
    (links, form controls, and so forth) still factor into the metric’s calculation.
    If you rely significantly on JavaScript to drive interactivity, however, FID may
    well reflect that.


    FID seems simplistic at first glance, but identifying the cause behind a high
    FID score gets tough. The first interaction with a page will vary from person
    to person. Someone on a fast device may present with a high FID score because
    of excessive JavaScript activity, while someone on the same page with a slow device
    may show a low FID score because they interacted with the page while the main
    thread was quiet.


    One way to troubleshoot high FID values is to contextualize them so that you know
    what’s happening at the time of the input delay. You can record long tasks from
    the `Long Task API` ([http://bkaprt.com/rjs39/03-08](http://bkaprt.com/rjs39/03-08))
    occurring around the time of the FID itself. This is what I’ve done in a small
    metrics collection script I built ([http://bkaprt.com/rjs39/03-09](http://bkaprt.com/rjs39/03-09)).


    Being a field metric, FID yields a wide range of values, so it’s sensible to focus
    on the 95th percentile of those values ([http://bkaprt.com/rjs39/03-10)](http://bkaprt.com/rjs39/03-10)).
    This strategy prioritizes those experiencing extreme input latency.


    ### Total Blocking Time


    While TTI and FID are all fine and good, they don’t measure the *total* amount
    of time the main thread is too busy to take on more work during startup. This
    is where `Total Blocking Time (TBT)` comes in—a lab metric that measures the window
    of time between a page’s FCP and TTI. Where TTI and FID measure distinct points
    in time, TBT looks at the total blocking time of all the long tasks in that window.


    To recap, a `long task` is any JavaScript activity exceeding 50 milliseconds.
    The `blocking time` of a long task is calculated by subtracting 50 milliseconds
    from the total time (Fig 3.6). If a long task runs for 127 milliseconds, its blocking
    time is 77 milliseconds.


    ![A task visualized as a gray bar, with blocking time represented with a red stripe
    overlay on the last two-thirds of the bar.](image/3.6.png)


    Fig 3.6: The blocking time of a long task, illustrated. Blocking time is the long
    task’s length minus 50 milliseconds.


    This means that TBT doesn’t penalize *all* JavaScript activity—just *excessive*
    activity. If your site performs many tasks less than or equal to 50 milliseconds
    during startup, your TBT score would be zero. TBT also gives vital context for
    poor TTI scores.


    A good TBT score is 300 milliseconds or less on average mobile hardware ([http://bkaprt.com/rjs39/03-11](http://bkaprt.com/rjs39/03-11)).
    Again, shoot for the lowest score possible. Always measure TBT in synthetic testing
    tools that use low- to mid-tier devices or CPU throttling, and avoid testing on
    fast devices. WebPageTest runs its tests on one of a broad range of physical devices
    in different locations, and reports TBT in its results summary (Fig 3.7).


    ![Example of a web vitals report that includes largest contentful paint, cumulative
    layout shift, and total blocking time.](image/3.7.png)


    Fig 3.7: WebPageTest’s Web Vitals summary includes TBT, as well as LCP and CLS.


    You’re probably left wondering what you can do specifically to improve your website’s
    performance metrics. Before we can go down that long road, we’ll need to look
    at performance profilers so you can learn how to find specific opportunities for
    improvement.


    ## Performance Profilers


    Synthetic tools excel at tidily summarizing your site’s JavaScript performance.
    They derive those summaries from data provided by a `performance profiler`—a developer
    tool that monitors and records all activity (JavaScript or otherwise) that occurs
    on a page.


    Performance profilers exist in all modern developer tools. No matter which browser’s
    performance profiler you use, the goal is the same: you want deep insight into
    your website’s performance so you can find specific opportunities for improvement.


    Modern browsers are largely consistent in where they place their performance profilers.
    To start, open your browser’s developer tools and look for the array of tabs across
    the top (Fig 3.8). Generally, a browser’s performance profiler will reside under
    a tab labeled “Performance” or “Timeline.”


    ![Detail of Chrome’s developer tools showing a series of tabs: Elements, Console,
    Sources, Network, Performance (currently active), and Memory.](image/3.8.png)


    Fig 3.8: An array of tabs at the top of Chrome’s developer tools. The Performance
    tab opens Chrome’s performance profiler.


    ### Making sense of a populated performance profiler


    In its initial state, the profiler’s interface will be unpopulated. You’ll populate
    it with data by recording one of two kinds of activity:


    1. **Startup activity**. This is all activity that occurs during startup, from
    the time a page begins loading until somewhat after the `window`’s `onload` event
    fires.

    2. **Specific activity**. You can record any specific time period in order to
    profile the performance of a given action, such as toggling a menu.


    All performance profilers provide controls for recording. No matter what type
    of activity you record, the same thing happens once recording stops: the profiler
    populates with the data from the observation period.


    The first time you see a populated performance profiler can feel like being handed
    the operations manual for a Boeing 737 and being told, “Cool, now take off.” Luckily
    for you, understanding a profiler isn’t as daunting once you grasp a few concepts
    behind its organization. In fact, you recall from Chapter 1 that browsers schedule
    their activity as tasks, and tasks occur within frames. Frames and tasks occur
    on the main thread, which profilers visualize as a linear progression of time.


    Different browsers present this information differently, yet still reflect the
    task/frame hierarchy. Safari plots tasks sequentially on a line or in a list.
    Safari also offers the ability to view a frame-by-frame accounting of tasks (Fig
    3.9).


    ![Detail of Safari’s performance profiler charting frames over time, with a breakdown
    of tasks in each frame.](image/3.9.png)


    Fig 3.9: In Safari’s performance profiler, frames are represented in a bar chart;
    longer frames are taller bars. The activity in the selected portion is listed
    in a table.


    Chrome’s profiler takes a hybrid approach. It depicts individual frames, but tasks
    are displayed as an inverted flame chart (Fig 3.10). A `flame chart` is a representation
    of JavaScript call stacks where each task’s call stack is visualized to resemble
    a flame. The base of the “flame” is the task’s initiator, with each nested piece
    of activity stacked below the activity that invoked it.


    Because a summary of any giant blob of data is helpful, most profilers provide
    an overview of all main-thread activity (Fig 3.11). A performance profiler’s activity
    overview is interactive, which means you can click and drag to select a range
    of time, and the flame chart or task list will expand or contract to the selected
    time period.


    Chrome’s profiler adds a bottom pane to the flame chart, with tabs that offer
    filtering controls to surface tasks by duration, type, and name (Fig 3.12) as
    well as a summary of where all CPU time was spent during the observation period.


    My own opinion is that Chrome’s profiler offers the best combination of usability
    and depth of information, but use whatever profiler suits you best. The most important
    thing is that your choice of profiler should help you find opportunities for improvement—and
    that starts with knowing how to use the profiler to assess loading and runtime
    performance.

