    This is far from the only case where `dynamic import` can be used to selectively\
    \ polyfill web-platform features. Any time you reach for a polyfill, do a little\
    \ research and check Can I Use ([http://bkaprt.com/rjs39/04-07](http://bkaprt.com/rjs39/04-07))\
    \ to see how well supported the feature you’re polyfilling is. Then, make an informed\
    \ decision about how best to proceed.\n\nWhether you use dynamic imports to conditionally\
