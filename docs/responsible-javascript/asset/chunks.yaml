- fmt: "\nWe must strive to build websites that reach everyone while still delivering\
    \ high-quality experiences through more considered use of JavaScript. Building\
    \ for the web in this way maximizes your reach—and expands access.\n\n## The Web\
    \ Is in Our Care\n\nInternet access not a luxury, but essential to functioning\
    \ in an interconnected world. This means that we must recognize that our constraints\
    \ are not static. While we want to use more JavaScript in our work—and we certainly\
    \ have been—our preference for it as a first resort has consequences.\n\nNetworks\
    \ can only go so fast, and the main thread can only take on so much work. The\
    \ more JavaScript you send down the pipe, the slower the target device becomes\
    \ and the faster the promise of usability fades. This breeds frustration that\
    \ only we can fix.\n\nAs we move forward from this chapter, let’s abandon our\
    \ sphexishness and focus on how the web is experienced by real people. Our users\
    \ are dependent on the critical fixtures the web provides. Now that we have a\
    \ grip on how JavaScript impacts performance, we can discuss how our architectural\
    \ choices can help or harm the user experience. As we’ll learn, we don’t need\
    \ to rely on JavaScript as the principal driver of interactivity; instead, let’s\
    \ look at its potential as an enhancement.\n\n# Chapter 2. Fast From the Start\n\
    \n![](image/3.png)\n\nBefore a paper wasp foundress builds her nest, she first\
    \ builds a foundational support structure called a `petiole`, a fibrous stalk\
    \ that supports the entire nest (Fig 2.1). A petiole is durable enough to support\
    \ a nest in all sorts of adverse conditions, even well after a colony has died\
    \ out. It’s a simple, sustainable, and crucial structure that plays a role in\
    \ the colony’s survival.\n\nJust as a paper wasp’s nest can’t exist without a\
    \ petiole, no website—regardless of its architectural makeup or how much JavaScript\
    \ it uses—can exist without a web server. And websites are especially resilient\
    \ when they rely on the backend to provide markup and functionality first.\n\n\
    Then, like wasps that expand their nests into tiers connected by additional petioles,\
    \ we can decide when it’s appropriate to expand upon our work with frameworks\
    \ and libraries. This incremental approach restrains the role of JavaScript, ensuring\
    \ smoother, more resilient user experiences that work in more places.\n\n![Close-up\
    \ of three paper wasps hanging upside down and gripping their modular nest, which\
    \ is suspended from a rigid stalk, or petiole.](image/2.1.png)\n\nFig 2.1: Paper\
    \ wasp nests are suspended by a foundational structure called a `petiole`. Photograph\
    \ by the author.\n\n## Bring Only What You Need\n\nIn our line of work, we’re\
    \ habituated to roll with off-the-shelf solutions that simplify web development.\
    \ While it’s arguably easier to lean on frameworks and libraries, to do so is\
    \ to subscribe to someone else’s vision of how to build for the web. The potential\
    \ incongruity between their approach and your project’s unique requirements may\
    \ very well invite heavy performance costs and poor user experiences.\n\nThe historical\
    \ role of frameworks and libraries is central to my argument: when tools like\
    \ `Prototype` and `jQuery` rose to prominence, there was a dire need to bridge\
    \ the gaps between differing implementations of various browser APIs. Thanks to\
    \ the proliferation of web standards, consistency is much easier to achieve without\
    \ having to rely on such stopgaps—if only we can break the habit.\n\n### Platforms\
    \ over libraries\n\nOne way JavaScript bloat creeps into projects is through the\
    \ unnecessary inclusion of utility libraries. `Lodash` is one such library that\
    \ gained traction during a time when JavaScript itself couldn’t conveniently accomplish\
    \ what `Lodash`’s utility functions could. These days, bare JavaScript can replace\
    \ some of what `Lodash` provides.\n\nOne use case for `Lodash` is mapping a function\
    \ to each member of an array to transform its contents. For example, you could\
    \ transform an array of URL strings for page assets into markup, then join the\
    \ results into one string:\n\n```javascript\nimport _ from \"lodash\";const scripts\
    \ = [\"/js/scripts.js\", \"/js/vendors.js\"];\n```\n\n```javascript\nconst markupArray\
    \ = _.map(scripts, script => {\n```\n\n```javascript\n return '<script src=\"\
    ${script}\"><\\/script>';\n```\n\n```javascript\n});\n```\n\n```javascript\nconst\
    \ markup = _.join(markupArray, \"\");\n```\n\nWhile `Lodash` does this well, this\
    \ code can be updated to use JavaScript features available in the browser:\n\n\
    ```javascript\nconst scripts = [\"/js/scripts.js\", \"/js/vendors.js\"];\n```\n\
    \n```javascript\nconst markup = scripts.map(script => {\n```\n\n```javascript\n\
    \ return '<script src=\"${script}\"><\\/script>';\n```\n\n```javascript\n}).join(\"\
    \");\n```\n\nBrowsers ship enough JavaScript features to let you do damn near\
    \ anything without utility libraries. For example, you can:\n\n* filter arrays\
    \ with `Array.prototype.filter` ([http://bkaprt.com/rjs39/02-01](http://bkaprt.com/rjs39/02-01));\n\
    * reduce an array to a single value with `Array.prototype.reduce` ([http://bkaprt.com/rjs39/02-02](http://bkaprt.com/rjs39/02-02));\n\
    * concatenate two arrays with `Array.prototype.concat` ([http://bkaprt.com/rjs39/02-03](http://bkaprt.com/rjs39/02-03));\
    \ and\n* get an object’s keys, values, or both as an array with `Object.keys`,\
    \ `Object.values`, or `Object.entries`, respectively ([http://bkaprt.com/rjs39/02-04](http://bkaprt.com/rjs39/02-04)).\n\
    \nThat’s a mere sampler! There are tons of JavaScript methods at your disposal,\
    \ available in practically every browser in widespread use ([http://bkaprt.com/rjs39/02-05](http://bkaprt.com/rjs39/02-05)).\
    \ It pays to think critically about what you’re trying to achieve and attempt\
    \ to solve problems with bare JavaScript first, and then resort to utility libraries.\n\
    \n### Beware the bandwagon fallacy\n\nWhen the developer community is invested\
    \ in a framework, it feels like the right choice—the safe choice. This is the\
    \ bandwagon fallacy, an alluring force when it comes to assessing client-side\
    \ frameworks. Even if everyone is using it, it still may not be safe from a user-experience\
    \ perspective. The trick is to know if a tool is appropriate for the task.\n\n\
    `React` is a popular JavaScript framework that emphasizes componentization and\
    \ simplified state management. It was developed by Facebook, and enjoys strong\
    \ advocacy from a vocal and dedicated userbase. The State of JS 2020 Survey found\
    \ that 70 percent of their 23,765 respondents use `React` ([http://bkaprt.com/rjs39/02-06](http://bkaprt.com/rjs39/02-06)).\
    \ The survey also revealed that:\n\n* 70.8 percent of respondents identified as\
    \ white;\n* 91.1 percent identified as male, 5.8 percent identified as female,\
    \ and 0.9 percent identified as nonbinary / third gender;\n* More than half (52.6\
    \ percent) assessed their proficiency in JavaScript at an expert level and just\
    \ under half rated themselves at an intermediate (22.7 percent) or advanced (22.3\
    \ percent) level. In contrast, only 2.3 percent rated their proficiency at a beginner\
    \ level.\n\nThese results clearly illustrate that an exceedingly vocal segment\
    \ of white male developers who self-assess their JavaScript skill at above-average\
    \ levels advocate strongly for `React`. They also advocate for a developer experience\
    \ that favors JavaScript-heavy client-side architectures, which are given to poor\
    \ performance in adverse conditions—something this segment of developers is far\
    \ less likely to experience themselves, thus affirming and reflecting their biases\
    \ in their work.\n\nConsider that, as performance engineer Tim Kadlec found in\
    \ his 2020 analysis of JavaScript frameworks, the median of websites using `React`\
    \ shipped 40 percent more JavaScript than the median of all websites ([http://bkaprt.com/rjs39/02-07](http://bkaprt.com/rjs39/02-07)).\n"
