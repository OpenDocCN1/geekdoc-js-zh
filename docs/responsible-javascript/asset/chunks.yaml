  trans: '


    公平地说对南卡罗来纳州而言，此信息页面加载的一些第三方 JavaScript 是有用的，例如 YouTube 嵌入的演示视频。尽管如此，他们也可以通过外部链接直接跳转到
    YouTube 来提供这些信息，或者在用户交互后再内联方式加载，而不是漫无章地嵌入在页面上。


    另一方面，另一些第三方东西的用处存疑——特别是聊天插件，需要大量的额外且认为并必要的 JavaScript。一个很好的替代方案是实用的：给人们提供一个电话号码或电子邮件地址。至少，在有人表现出意图要`use`它之前，聊天插件的任何
    JavaScript 都不应该加载。


    无论如何，对于第三方产品，只有一点是永远真实的：你越不`use` 它们，页面速度就越快。这并不是说它们永远没用，而是要对每一个新脚本保持健康的怀疑。虽然某些第三方脚本对许多组织来说是不可或缺的，但有几个是你需要保持警惕来对待的。


    ## 客户端 A/B 测试框架


    A/B 测试是一种研究形式，用于评估设计、内容或功能的变体如何影响参与度。与其在上线网站上推出重大更改，不如向一半观众展示“新事物”的一个版本，并向另一部分观众展示现状——这至少是最简单的解释了（图
    7.3）。


    ![两张 slack.com 的主页具有不同设计布局和文案的截图。](img/7.3.png)


    图 7.3：A/B 测试允许组织在提交更改之前评估多种设计和消息变体。


    A/B 测试旨在为产品的演进提供决策依据，这从本质上是个好主意！然而，它通常是使用客户端 JavaScript 进行的，这会带来可预见的性能结果：


    * 测试脚本会动态修改 `DOM`。这通常要求将必要的 JavaScript 加载到文档的 `<head>` 中，作为渲染阻塞资源，以避免对用户界面产生明显变化。

    * JavaScript 越多，问题越多——即主线程上的处理工作越多，这会不成比例地影响那些使用低端设备和较慢网络的节点。

    * 如果 A/B 测试解决方案向 `DOM` 元素挂载大量事件监听器，可能会减慢运行时性能——如果你在低端设备上已经处于崩溃边缘，这种代价是你无法承受的。


    评估进行这项研究的收益是否超过了其影响，或者其潜在的负面性能影响是否会偏差测试结果。动态更改页面结构和呈现是一项风险业务，即使在性能良好的硬件上，运行测试的工作可能仍然相当客观的（图
    7.4）。


    ![来自 Best Buy 网站的部分调用堆栈。这项长任务（约 225 毫秒）是由 Best Buy 网站上的客户端 A/B 测试脚本触发的。任务的阻塞部分约占
    175 毫秒。](img/7.4.png)


    图 7.4：来自 Best Buy 网站的部分调用堆栈。这项长任务（约 225 毫秒）是由 Best Buy 网站上的客户端 A/B 测试脚本触发的。任务的阻塞部分约占
    175 毫秒。


    如果你正在进行 A/B 测试，确保你的测试框架提供服务端选项，或者考虑切换到提供该选项的框架。如果你能确保这样做不会偏离测试结果，请考虑不在低端设备上进行
    A/B 测试，特别是如果你的观众中有很大一部分不使用这些设备。客户端信号如 `navigator.deviceMemory` ([`bkaprt.com/rjs39/07-03`](http://bkaprt.com/rjs39/07-03))
    和 `navigator.hardwareConcurrency` ([`bkaprt.com/rjs39/07-04`](http://bkaprt.com/rjs39/07-04))
    是粗略但可能有益的信号，可能会有所帮助。


    A/B 测试是有用的，但它可能引发的大量客户端工作长期来看是持续的，特别是如果你不持续地清理已完成的实验以避免传输大量未使用的 JavaScript。与大多数
    JavaScript 性能问题一样，卸载到服务器的越多，浏览器受益就越多。


    ## 无障碍覆盖层


    无障碍覆盖层是声称通过客户端 JavaScript 自动修复网站无障碍问题的第三方产品。无障碍覆盖层之所以由于极具吸引力，是因为不可访问的网站会导致真实的法律后果
    ([`bkaprt.com/rjs39/07-05`](http://bkaprt.com/rjs39/07-05))。无障碍工作是`tough`的。修复无障碍问题需要技术熟练的开发者以及大量的时间、精力和金钱。


    无障碍是无法自动化的。通过使用无障碍覆盖层，你实际上是在默认承认你的网站存在你不想修复的问题。最糟糕的是，无障碍覆盖层根本不起作用。它们产生的问题比解决的还要多
    ([`bkaprt.com/rjs39/07-06`](http://bkaprt.com/rjs39/07-06))：


    * 在 `<img>` 元素缺少适当 `alt` 文本的情况下，覆盖层会生成文本。这些文本可能冗长，实际上将信息的缺口变成使用辅助技术的人员的负担。

    * 覆盖层通常提供内容缩放功能。根据网站样式设置，覆盖层对如何缩放内容的假设可能会导致元素重叠或被遮挡。使用相对 CSS 单位正确设置你的网站样式可以确保你的网站可以被正常缩放。

    * 内容缩放还会导致静态 `line-height` 值的可读性问题，因为内容放大后会导致文本行重叠。

    * 覆盖层本身可能存在过度且不直观的交互。accessiBe 的覆盖层产品包含 75 多个控件，会扰乱界面并让用户无所措。


    还有很多可能出错的地方，而且在这些痛苦之上，性能变得更糟糕了（图 7.5）。


    ![PageTest 显示南卡罗来纳州网站主线程加载 AudioEye 无障碍覆盖层（上方）和未加载（下方）。AudioEye 覆盖层产生的阻塞时间是未加载时的两倍。](img/7.5.png)


    图 7.5：PageTest 显示南卡罗来纳州网站主线程加载 AudioEye 无障碍覆盖层（上方）和未加载（下方）。AudioEye 覆盖层产生的阻塞时间是未加载时的两倍。


    无障碍覆盖层充其量是鬼药。它们并不能让你的网站变得更易访问，而且对性能简直是有毒的。当你使用它们时，你是在让情况变得更糟并浪费金钱。


    本书的理念是以性能为中心的，但无障碍是负责任使用 JavaScript 的另一个方面。如果你需要提升你的无障碍水平，请查看 Laura Kalbag 写的《Accessibility
    for Everyone》([`bkaprt.com/rjs39/07-07`](http://bkaprt.com/rjs39/07-07))。资源部分也有一些链接可以指引你正确的方向。


    ### 热力图


    热力图可视化了用户频繁交互页面的哪些部分，以确定界面元素或布局选择的价值。它们的名称源于热成像：高交互频率区域被可视化为热，低交互频率区域被可视化为冷（图
    7.6）。


    ![热力图覆盖层从绿色（冷）到红色（热）的比例显示用户交互。](img/7.6.png)


    图 7.6：热力图覆盖层从绿色（冷）到红色（热）的比例显示用户交互。


    '
- fmt: '

    Some heatmapping tools also provide the ability to “play back” a specific visitor’s
    session. Tracking page interactions and cursor position in order to reconstruct
    the playback—usually called `session replay`—chews up tons of CPU. That’s a tax
    that’s never worth levying on anyone, let alone those on low-end devices (Fig
    7.7).


    ![Two main-thread activity summaries of the same page profiled on a Nokia 2 Android
    phone. The top summary is of a page without any third-party scripts. The bottom
    summary is of the same page with a third-party heatmapping tool. The interactions
    in each session are identical, but the heatmapping tool introduces three times
    more JavaScript activity.](image/7.7.png)


    Fig 7.7: Two main-thread activity summaries of the same page profiled on a Nokia
    2 Android phone. The top summary is of a page without any third-party scripts.
    The bottom summary is of the same page with a third-party heatmapping tool. The
    interactions in each session are identical, but the heatmapping tool introduces
    three times more JavaScript activity.


    Honestly? Don’t bother with heatmapping. You can gather more valuable signals
    on your own. For example, if you run a blog or news website and you want to know
    how much of your content people are reading, you can use an intersection observer
    to track the visibility of each element within a page’s `<article>` element, and
    then send that data to an endpoint for later analysis.


    I get it. Everything I’m saying feels all finger-pointy, and UX research is about
    refining the user experience—but, as Erika Hall notes in *Just Enough Research*,
    you can get better insights by listening to users ([http://bkaprt.com/rjs39/07-08](http://bkaprt.com/rjs39/07-08)).
    Not only will you get better usability data, but you’ll also avoid the mucky performance
    issues associated with heatmapping tools.


    ## Technical Mitigations


    Whether you dig it or not, it’s likely a website you work on will ship one or
    more third-party products. This doesn’t mean your website’s user experience is
    doomed! It just means you should try to mitigate the impact of those third-party
    scripts.


    ### Self-hosting revisited


    Remember when we covered self-hosting in Chapter 4? It’s back! To recap, you can
    improve loading performance by eliminating sources of connection latency. In the
    same fashion, self-hosting third-party assets will speed things up.


    Unfortunately, self-hosting third-party scripts isn’t always possible. Any third-party
    script with contents that regularly or unpredictably change—such as Google Analytics
    scripts—are a no-go for self-hosting.


    Don’t despair! It’s possible to self-host *some* third-party scripts, and to great
    benefit. Notably, Casper Sleep found a way in 2018 to self-host their A/B testing
    framework JavaScript, reducing their start render time by 1.7 seconds ([http://bkaprt.com/rjs39/07-09](http://bkaprt.com/rjs39/07-09)).
    A/B testing frameworks must be loaded in the `<head>` in blocking fashion to avoid
    bad user-experience outcomes, such as flashes of unstyled content ([http://bkaprt.com/rjs39/07-10](http://bkaprt.com/rjs39/07-10)).
    Self-hosting ended up being a crucial performance improvement in this case (Fig
    7.8).


    ![Start render time for the Casper Sleep website in SpeedCurve. Self-hosting their
    A/B testing framework led to a 1.7 second decrease in start render time. Chart
    courtesy of Kyle Rush (http://bkaprt.com/rjs39/07-11).](image/7.8.png)


    Fig 7.8: Start render time for the Casper Sleep website in SpeedCurve. Self-hosting
    their A/B testing framework led to a 1.7 second decrease in start render time.
    Chart courtesy of Kyle Rush ([http://bkaprt.com/rjs39/07-11](http://bkaprt.com/rjs39/07-11)).


    If a third-party vendor enables you to self-host their JavaScript, that’s a sign
    that your website’s performance is a priority to them. That goes double if you’re
    a paying customer. Put a little friendly pressure on your third-party vendors
    to see whether self-hosting is a feasible accommodation.


    ### Establish early connections


    If self-hosting is off the table, establishing early connections for third-party
    scripts with `rel=preconnect` can mask connection latency in a big way.


    Sometimes assets loaded from third-party servers kick off these nasty *request
    chains* (Fig 7.9). A request chain is when an origin requests an asset from another
    origin, and so on. Request chains are terrible for performance because they introduce
    more latency for every new origin discovered in the request chain.


    ![A partial visualization (via Simon Hearne’s Request Map Generator) of a third-party
    script request chain on Target’s website. ](image/7.9.png)


    Fig 7.9: A partial visualization (via Simon Hearne’s Request Map Generator) of
    a third-party script request chain on Target’s website.


    Simon Hearne’s Request Map Generator ([http://bkaprt.com/rjs39/07-12](http://bkaprt.com/rjs39/07-12))
    finds all the unique origins involved for a given web page. You can also use the
    Domains tab to do this. With this information, you can establish connections as
    early as possible using the `preconnect` resource hint, which we covered in Chapter
    4.


    ### Don’t preload third-party scripts


    As you’ll recall from Chapter 4, `preload` triggers an early fetch for resources.
    It’s a powerful performance optimization, and you should use it sparingly, as
    it can help or harm in equal measure.


    When you preload assets, you’re effectively boosting their priority; if everything
    is prioritized, then nothing is. Where `preload` and JavaScript is concerned,
    you should only use it for first-party scripts that are critical to rendering—and
    that’s *only* if you can’t find a way to take such JavaScript out of the critical
    path and serve contentful markup directly from the server. In any case, squandering
    `preload`s on third-party scripts siphons away available bandwidth from scripts
    that power critical user-experience fixtures.


    Users don’t care if your analytics or heatmapping tools load faster. They’re after
    your content or product. You should never prioritize gathering data over performance,
    so save `preload` for the stuff that provides a material user-experience benefit.


    ### The fruits of laziness


    Few the the-party products I’ve referenced throughout this chapter have a direct
    user-experience benefit. But some *do*, such as social media sharing functionality
    and embedded video content. These third-party scripts are arguably more valuable
    than others we’ve discussed thus far.


    Video embedding services are especially valuable, because transcoding video to
    different formats and managing adaptive streaming quality is extremely hard to
    do. It makes perfect sense to want to use these services. Unfortunately, they
    incur a lot of overhead beyond the necessary video payloads they deliver.


    YouTube uses a lot of JavaScript in its `<iframe>` embeds (Fig 7.10). If you’re
    embedding YouTube video that’s “below the fold,” as it were, you should lazy-load
    those iframes to reduce bandwidth contention and blocking time at startup (Fig
    7.11).


    ![A WebPageTest waterfall view of a blog page with a YouTube <iframe> embed. The
    <iframe> and its assets begin on the tenth request. The embed incurs considerable
    main-thread blocking time when loaded. ](image/7.10.png)


    Fig 7.10: A WebPageTest waterfall view of a blog page with a YouTube `<iframe>`
    embed. The `<iframe>` and its assets begin on the tenth request. The embed incurs
    considerable main-thread blocking time when loaded.


    You could achieve this by slapping a `loading="lazy"` attribute on the `<iframe>`
    or reach for an open-source solution that lazy-loads iframes in all browsers—or
    even some hybridized combination of the two if broad compatibility is needed.

