- fmt: "\nIf you need to collect only a handful of core metrics, something small and\
    \ simple will do the trick. For my own projects, I wrote a custom solution named\
    \ `grab-vitals` ([http://bkaprt.com/rjs39/03-20](http://bkaprt.com/rjs39/03-20)),\
    \ which uses Google’s `web-vitals` npm package to gather the performance metrics\
    \ we discussed earlier:\n\n```javascript\nwindow.addEventListener(\"load\", ()\
    \ => {\n  import(\"grab-vitals\").then(({ grabVitals }) => {\n    grabVitals(\"\
    https://interslice.compuhyperglobalmega.net/collect\");\n  });\n});\n```\n\nThe\
    \ `grabVitals` function accepts a `string` pointing to a `URL` where a page’s\
    \ performance metrics will be sent as a `JSON` string for collection. To avoid\
    \ contention on the main thread during startup, the `grabVitals` method isn’t\
    \ called until the page `load` event fires.\n\nIf you decide to roll your own\
    \ solution, keep the following in mind:\n\n*   Google’s `web-vitals` package can’t\
    \ gather all metrics in all browsers without polyfills. That means loading it\
    \ on some browsers may end up in unused code. `grab-vitals` gets around this by\
    \ using dynamic `import`—a code-splitting technique we’ll cover in Chapter 4.\n\
    *   Use `requestIdleCallback` ([http://bkaprt.com/rjs39/03-21](http://bkaprt.com/rjs39/03-21))\
    \ to avoid main-thread contention with critical interactions. No critical interaction\
    \ should ever take a back seat to collecting metrics. This API is covered in Chapter\
    \ 6.\n*   There are considerable challenges involved with batching collected metrics\
    \ to avoid excessive calls to the collection endpoint. `grab-vitals` compensates\
    \ for this by listening for the page’s `visibilitychange` event as well as the\
    \ `pagehide` event for Safari ([http://bkaprt.com/rjs39/03-22](http://bkaprt.com/rjs39/03-22)).\n\
    *   You’ll have to decide whether it’s best to send field metrics to your collection\
    \ endpoint with `fetch` or `navigator.sendBeacon` ([http://bkaprt.com/rjs39/03-23](http://bkaprt.com/rjs39/03-23)).\
    \ `navigator.sendBeacon` is less complex to use than `fetch` and doesn’t delay\
    \ navigations by delaying document unloading, but `fetch` offers better control.\n\
    \nThis stuff is hard! It’s not always a bad idea to reach for something off the\
    \ shelf, even if it’s a paid product. Just know that if you decide to work with\
    \ a vendor to collect field data, you should ask questions to ensure their collection\
    \ methods address the aforementioned issues.\n\nAs far as storing metrics goes,\
    \ that requires an application backend and a database ([http://bkaprt.com/rjs39/03-24](http://bkaprt.com/rjs39/03-24)).\
    \ How you store metrics doesn’t matter so long as they’re accessible to you in\
    \ a way that’s comfortable and familiar.\n\n### Tips for analyzing field metrics\n\
    \nWhether you’re leaning on a vendor product to gather metrics or rolling your\
    \ own solution, there are a few things to consider when you analyze the field\
    \ metrics in your data store:\n\n*   **Avoid averages!** While averages are easy\
    \ to calculate, they don’t explain performance the way you think they do ([http://bkaprt.com/rjs39/03-25](http://bkaprt.com/rjs39/03-25)).\
    \ Averages tend to be skewed since large collections of field metrics have many\
    \ outliers.\n*   **Focus on percentiles.** The 75th, 90th, and 95th percentiles\
    \ are especially valuable, as these intervals tend to emphasize slower experiences\
    \ over faster ones.\n*   **Pay special attention to the 90th percentile and up.**\
    \ This is where you’ll see how slower devices and poor network conditions affect\
    \ performance. Address pain points in this range, and you’ll make your website\
    \ faster for everyone regardless of how fast their network connection or device\
    \ is.\n*   **Contextualize the data.** Metrics alone only convey simplistic conclusions\
    \ like, “This is when your page is interactive.” If you’re evaluating a vendor\
    \ product, see if it collects device information and long-task data from the `Long\
    \ Tasks API`. If you’re rolling your own, store that data yourself. It will give\
    \ you more insight into why some users experience trouble where others don’t.\n\
    \nIf you follow only one piece of advice, focus on percentiles! Percentiles are\
    \ valuable in summarizing the range of outcomes in field metrics. Let’s say we\
    \ have a website with relatively little JavaScript with 312 `LCP` records:\n\n\
    | Percentile | Largest Contentful Paint |\n| --- | --- |\n| 25th | 237 milliseconds\
    \ |\n| 50th | 619 milliseconds |\n| 75th | 1,503 milliseconds |\n| 90th | 3,693\
    \ milliseconds |\n| 95th | 8,120 milliseconds |\n\nIf we average all the records,\
    \ we get about 1,707 milliseconds. While this is hardly a bad `LCP` score, it’s\
    \ a conglomeration of values that don’t reflect an actual session. It lands near\
    \ the 75th percentile.\n"
