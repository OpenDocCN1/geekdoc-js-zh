  trans: "\n\n```\n alert(\"Couldn't subscribe to this person due to a glitch on our\
    \ end. Try again in a minute?\");\n```\n\n```\n this.enableButton();\n```\n\n\
    ```\n });\n```\n\n```\n }\n```\n\n```\n }\n```\n\n```\n}\n```\n\n这种方法虽然繁琐，但以下是具体的执行步骤：\n\
    \n1. 调用 `event.preventDefault()` 防止表单提交到服务器，从而让 Web 组件处理订阅功能。\n2. 禁用“订阅”（Subscribe）按钮。\n\
    3. 通过 `fetch` 调用以 POST 请求的形式向服务器发送，并将订阅者 ID 包含在字符串化的 JSON 负载中。随后，服务器将处理该订阅请求。\n\
    4. 如果请求成功，按钮的文本内容将更新以反映该状态。否则，会弹出一个基础的 `alert` 提示出现问题。无论 `fetch` 调用成功与否，在调用完成后按钮都会重新启用。\n\
    \n大功告成！在付出了这么多努力尝试创建一个渐进增强的体验后，如果你怀疑这一切的意义也是完全可以的——但请放心，这些工作不仅仅是为了让一个微小的按钮以最极简的方式发挥作用。\n\
    \n### 渐进增强的收益\n\n在 Web 开发中，仅在客户端构建功能可能比从服务器提供相同功能然后用 JavaScript 进行渐进增强要容易。\n\n\
    然而——对此我再强调不过了——它是值得的。当你这样做时，你正在付出巨大的努力来帮助他人：\n\n* 冗余功能在 JavaScript 关闭或加载失败的情况下为人们提供了安全网。你无法控制人们如何访问你的网站，而渐进增强创建了一个良好的备用方案（fallback）。\n\
    * 渐进增强建立了防护护栏，通过增加服务器在提供功能方面的作用，迫使你更仔细地思考如何使用 JavaScript。最终结果是更具韧性的用户体验。\n\n尽管如此，你不需要\
    \ Web Components 也可以对你的网站进行渐进增强——这只是它们在追求这一目标时如何使用的一个示例。但你应该在每个项目开始时都保持这种极简主义精神，以便在早期获得最佳结果，如果需要，再层叠使用更华丽的策略。\n\
    \n只有从极简主义出发，我们才能构建出一个在关键时刻不那么依赖 JavaScript 的网络。如果我们从一开始就使用沉重且具有强制性的框架，我们就无法到达那里。不要“快速行动并破坏一切”，要深思熟虑并谨慎行事。\n\
    \n## 展望 对于对于构建可持续的 Web 来说，这是一项艰巨的任务。但如果我们优先考虑服务器发送标记语言的作用、采用有效的缓存、尽可能使用 Web 平台并拥抱渐进增强，我们就可以避免向客户端交付昂贵的框架，并避免它们在启动和运行期间可能产生的昂贵开销。\n\
    \n尽可能快速移动似乎是首选——事实上，如果目标是比任何人都先进入市场可能确实如此——但这些选择产生的影响将不仅限于当下。你早期的技术选择可能会固化在你的项目中，导致日后修复它们引起的问题变得极其困难。早期且频繁地发布代码是一回事，但处理这种哲学带来的对用户敌视的后果完全是另一回事。\n\
    \n可持续的架构应该是让 Web 对更多人更易用。当架构扩展访问而非限制访问时，我们创建的体验更具韧性和容错能力。随着我们共同不断进步，我们将进一步探索这项良好工作所包含的细节。\n\
    \n# 第 3 章 衡量与评估 JavaScript 性能\n\n![](img/4.png)\n\n如果你在户外待过足够的时间，你就知道牛蝇了。它们是双翅目中的恐怖，降落在温血动物身上（无论是马还是人），并用像剪刀一样的口器吸血。\n\
    \n马虻蜂会杀死牛蝇，对于饲养牲畜的农夫来说是福音。更好的是，牲畜完全不会被这些蜂骚扰；它们接受这些蜂，因为它们的存在是有益的（图 3.1）。\n\n![黑金相间的马虻蜂特写。](img/3.1.png)\n\
    \n图 3.1：马虻蜂猎杀骚扰牲畜的牛蝇。照片拍摄：Howard Ensign Evans，科罗拉多州立大学，Bugwood.org ([`bkaprt.com/rjs39/03-01`](http://bkaprt.com/rjs39/03-01))，CC\
    \ BY 3.0 US ([`bkaprt.com/rjs39/03-02`](http://bkaprt.com/rjs39/03-02))，来自 Wikimedia\
    \ Commons。\n\n负责任使用 JavaScript 需要像马虻蜂那样的警惕，不断扫描它的领地以寻找烦人的牛蝇。你必须时刻关注 JavaScript\
    \ 并抑制它最有害的影响，因为过度依赖它会将你的网站用户体验拖入“慢速镇”（Slow Town）。在这种情况下，警惕需要衡量和评估你网站的 JavaScript\
    \ 状况。\n\n当我们*衡量* JavaScript 性能时，我们想知道三件事：\n\n1. 页面在启动期间感知上是快速且可用的？\n2. 如果不是，问题在哪里？\n\
    3. 启动后主线程是否足够安静，以保持页面的可用？\n\n就像你不预先测量就无法可靠地将木材切割成合适的长度一样，在能够衡量之前，我们也无法评估 JavaScript\
    \ 在网站和应用程序中的影响。## 指标：衡量 JavaScript 性能的关键\n\n在生活中，我们都依赖指标。我们检查室外温度以确保穿得合适；我们在开车时（希望）观察速度表以避免鲁莽驾驶；我们根据血检结果指导生活方式的选择，例如在甘油三酯过高时改变饮食。\n\
    \n性能指标对于做出明智决策同样至重要。它们也是影响 Google 网页排名的许多因素之一([`bkaprt.com/rjs39/03-03`](http://bkaprt.com/rjs39/03-03))）。搜索引擎希望为特定的查询呈现最好的网页，而糟糕的用户体验会干扰这一目标。\n\
    \n性能指标可以分为两类：\n\n* **实验室指标（Lab metrics）：**这些指标通过合成测试工具（如 WebPageTest、Lighthouse\
    \ 或你的浏览器开发者工具）收集。你可以通过它们建立一致基准，这在尝试解决开发问题时非常有用。\n* **字段指标（Field metrics）：**这些指标通过浏览器\
    \ JavaScript API 从网站访问者处收集，然后传输到远程数据存储进行后期分析。字段指标是黄金，因为它们讲述了真实用户体验网站性能的故事。\n\n\
    了解哪些指标是什么有助于你理解它们如何适用于你的工作。某些指标属于以上两类，而另一些只属于其中一种。让我们看看指标可以描述的页面及 JavaScript 的一些常见方面。\n\
    \n### 绘制（Painting）\n\n页面加载期间关键的可感知里程碑是页面内容被绘制到屏幕上。这是我们获取正在发生什么的第一个线索。每当浏览器在屏幕上绘制像素时，我们称之为绘制*painting*——那里有很多绘制指标。\n\
    \nJavaScript 对绘制指标的影响通常取决于标记是如何渲染的。标记的客户端渲染（我们在第 2 章讨论过的昂贵过程）与服务器发送的初始标记相比，可能会触发更晚的绘制事件。这一切被渲染客户端标记的脚本大小、网络速度以及脚本交付的方式所放大。\n\
    \n#### 首次绘制（First Paint）和首次内容绘制（First Contentful Paint）\n\n"
- fmt: "\nTwo common paint metrics you’ll encounter are `First Paint` (FP) and `First\
    \ Contentful Paint` (FCP). `FP` identifies the first moment *any* pixels are painted\
    \ to the screen, whereas `FCP` identifies when content has appeared in the viewport—that\
    \ is, text, images, a non-white `<canvas>` element, and so on (Fig 3.2).\n\n![Frames\
    \ of a site plotted over time, showing when first paint and first contentful paint\
    \ occur.](image/3.2.png)\n\nFig 3.2: A performance trace in Chrome’s performance\
    \ profiler showing a page’s First Paint (FP) and First Contentful Paint (FCP).\
    \ The `FP` occurs when the gray background appears, and the `FCP` occurs when\
    \ the menu toggle appears.\n\n`FP` is often tied to when a stylesheet loads, but\
    \ it isn’t a terribly important metric. The first thing that paints may not be\
    \ perceptually meaningful.\n\n`FCP`, on the other hand, *is* more meaningful in\
    \ that it’s content oriented. The core content of the page might be held up until\
    \ some beefy JavaScript bundle downloads, is processed, and finally runs, perhaps\
    \ making a call to a backend API or rendering client-side markup in the process.\
    \ `FCP` could well be delayed in that case.\n\nWhile `FCP` is an earnest attempt\
    \ to assess perceptual performance, *contentful* may only describe a background\
    \ image or an insignificant text node. Thankfully, a more refined metric exists\
    \ to describe when more prominent content paints.\n\n## Largest Contentful Paint\n\
    \n`Largest Contentful Paint (LCP)` measures the moment when the largest piece\
    \ of content in the viewport appears—be it an image, video, or text node (Fig\
    \ 3.3). `LCP` is an improvement over other paint metrics since it emphasizes content\
    \ prominence, therefore quantifying more perceptually significant milestones.\n\
    \n![Frames of a site plotted over time, showing an LCP event of 19.8 milliseconds\
    \ arriving 3,850 milliseconds into the loading process.](image/3.3.png)\n\nFig\
    \ 3.3: A Largest Contentful Paint (LCP) event as shown in Chrome’s performance\
    \ profiler for the Chase Bank website. The `LCP` is delayed due to client-side\
    \ rendering of markup for the page masthead.\n\nAs with `FCP`, JavaScript can\
    \ interfere with `LCP` in architectures that rely on JavaScript to render contentful\
    \ markup on the client. Your website architecture shouldn’t require visitors to\
    \ wait for JavaScript to load, process, and run before prominent content appears\
    \ on their screens.\n\nPerformance-monitoring tools like WebPageTest and Lighthouse\
    \ report `LCP`. At the time of writing, Google has advised that an `LCP` of 2.5\
    \ seconds or less is optimal ([http://bkaprt.com/rjs39/03-04](http://bkaprt.com/rjs39/03-04)),\
    \ but future guidance may vary. The best advice is to shoot for the best possible\
    \ score, since `LCP` can affect how your page ranks in search results.\n\n## Layout\
    \ stability\n\nHave you ever gone to click on a link only to have it suddenly\
    \ move, causing you to click on something else altogether? You’re the victim not\
    \ just of a website’s broken promises, but also of *layout instability* (Fig 3.4).\n\
    \n![Frames of a site plotted over 2,204 milliseconds, showing how layout elements\
    \ like banners and buttons shift as it loads.](image/3.4.png)\n\nFig 3.4: As multiple\
    \ page elements on the Currys PC World website load, the rest of the layout shifts\
    \ several times, causing key interactive elements to move unpredictably.\n\nThere\
    \ are many causes of layout instability, and JavaScript is one of them. One example\
    \ you’ve almost certainly experienced is when a notice appears at the top of the\
    \ page late in the page life cycle, pushing the entire layout down. This usually\
    \ occurs because a script takes time to load, process, and run, causing a shift\
    \ at the worst possible moment.\n\nAll layout shifts—whether they’re caused by\
    \ JavaScript or otherwise—cause potentially expensive layout recalculation work\
    \ that eats up main-thread time. When layout shifts contend for the main thread’s\
    \ attention during startup, we’re left with less headroom for JavaScript processing\
    \ and execution.\n\nIt’s important to determine whether users can anticipate the\
    \ layout shifts. Anticipated layout shifts are the result of a voluntary user\
    \ interaction, such as expanding an accordion. Undesirable layout shifts are those\
    \ that are seemingly random, without any prior user interaction.\n\nFor example,\
    \ Twitter’s mobile website—at least at the time of writing—loads tweets automatically.\
    \ We can measure layout stability with a metric called `Cumulative Layout Shift\
    \ (CLS)`. Unlike time-based metrics, `CLS` uses a decimal system that quantifies\
    \ how far elements have shifted in the viewport ([http://bkaprt.com/rjs39/03-04](http://bkaprt.com/rjs39/03-04)).\
    \ A good `CLS` score is 0.1 or less, but this could always change as user-experience\
    \ metrics may evolve. In practice, the closer you can get this metric to 0, the\
    \ better.\n\n## Main-thread responsiveness\n\nJavaScript has considerable potential\
    \ to delay page startup. We can assess its impact on user experience with three\
    \ metrics: Time to Interactive (TTI), First Input Delay (FID), and Total Blocking\
    \ Time (TBT).\n\n### Time to Interactive\n\nRemember that prank where you’d set\
    \ someone’s desktop to a flat? This is essentially what happens when we ship too\
    \ much JavaScript. Sites with a high `TTI` will behave more like screenshots of\
    \ a website than an actual website. \n\n*Time to Interactive (TTI)* is a lab metric\
    \ that measures when a page is interactive. It’s calculated by first marking the\
    \ page’s `FCP`. From there, the next five-second period in which there is neither\
    \ a long task nor more than two in-flight network requests is also marked. The\
    \ page’s `TTI` is at the start of that quiet window. A good `TTI` is less than\
    \ five seconds on a middle-tier device ([http://bkaprt.com/rjs39/03-07](http://bkaprt.com/rjs39/03-07)),\
    \ but at the risk of repeating myself, I am once again asking you to aim as low\
    \ as possible.\n\n### First Input Delay\n\nWhile `TTI` is great, it describes\
    \ whether a page is interactive, not whether that page will respond to the first\
    \ input quickly. `First Input Delay (FID)` is a field metric that fills in this\
    \ information gap by measuring the delay between the first interaction with a\
    \ page and when the browser responds to that interaction.\n"
  raw: 'Two common paint metrics you’ll encounter are *First Paint* (FP) and *First
    Contentful Paint* (FCP). FP identifies the first moment *any* pixels are painted
    to the screen, whereas FCP identifies when content has appeared in the viewport—that
    is, text, images, a non-white `<canvas>` element, and so on (Fig 3.2).


    ![Frames of a site plotted over time, showing when first paint and first contentful
    paint occur.](image/3.2.png)


    Fig 3.2: A performance trace in Chrome’s performance profiler showing a page’s
    First Paint (FP) and First Contentful Paint (FCP). The FP occurs when the gray
    background appears, and the FCP occurs when the menu toggle appears.


    FP is often tied to when a stylesheet loads, but it isn’t a terribly important
    metric. The first thing that paints may not be perceptually meaningful.


    FCP, on the other hand, *is* more meaningful in that it’s content oriented. The
    core content of the page might be held up until some beefy JavaScript bundle downloads,
    is processed, and finally runs, perhaps making a call to a backend API or rendering
    client-side markup in the process. FCP could well be delayed in that case.


    While FCP is an earnest attempt to assess perceptual performance, *contentful*
    may only describe a background image or an insignificant text node. Thankfully,
    a more refined metric exists to describe when more prominent content paints.


    #### Largest Contentful Paint


    *Largest Contentful Paint (LCP)* measures the moment when the largest piece of
    content in the viewport appears—be it an image, video, or text node (Fig 3.3).
    LCP is an improvement over other paint metrics since it emphasizes content prominence,
    therefore quantifying more perceptually significant milestones.


    ![Frames of a site plotted over time, showing an LCP event of 19.8 milliseconds
    arriving 3,850 milliseconds into the loading process.](image/3.3.png)


    Fig 3.3: A Largest Contentful Paint (LCP) event as shown in Chrome’s performance
    profiler for the Chase Bank website. The LCP is delayed due to client-side rendering
    of markup for the page masthead.


    As with FCP, JavaScript can interfere with LCP in architectures that rely on JavaScript
    to render contentful markup on the client. Your website architecture shouldn’t
    require visitors to wait for JavaScript to load, process, and run before prominent
    content appears on their screens.


    Performance-monitoring tools like WebPageTest and Lighthouse report LCP. At the
    time of writing, Google has advised that an LCP of 2.5 seconds or less is optimal
    ([http://bkaprt.com/rjs39/03-04](http://bkaprt.com/rjs39/03-04)), but future guidance
    may vary. The best advice is to shoot for the best possible score, since LCP can
    affect how your page ranks in search results.


    ### Layout stability


    Have you ever gone to click on a link only to have it suddenly move, causing you
    to click on something else altogether? You’re the victim not just of a website’s
    broken promises, but also of *layout instability* (Fig 3.4).


    ![Frames of a site plotted over 2,204 milliseconds, showing how layout elements
    like banners and buttons shift as it loads.](image/3.4.png)


    Fig 3.4: As multiple page elements on the Currys PC World website load, the rest
    of the layout shifts several times, causing key interactive elements to move unpredictably.


    There are many causes of layout instability, and JavaScript is one of them. One
    example you’ve almost certainly experienced is when a notice appears at the top
    of the page late in the page life cycle, pushing the entire layout down. This
    usually occurs because a script takes time to load, process, and run, causing
    a shift at the worst possible moment.


    All layout shifts—whether they’re caused by JavaScript or otherwise—cause potentially
    expensive layout recalculation work that eats up main-thread time. When layout
    shifts contend for the main thread’s attention during startup, we’re left with
    less headroom for JavaScript processing and  execution.


    It’s important to determine whether users can anticipate the layout shifts. Anticipated
    layout shifts are the result of a voluntary user interaction, such as expanding
    an accordion. Undesirable layout shifts are those that are seemingly random, without
    any prior user interaction.


    For example, Twitter’s mobile website—at least at the time of writing—loads tweets
    automatically, pushing older tweets down. This causes the infamous “I was about
    to like a tweet, but now I can’t because it’s gone” effect. One remedy would be
    to let the user choose to load new tweets, rather than loading them without any
    action from the user.


    We can measure layout stability with a metric called *Cumulative Layout Shift
    (CLS)*. Unlike time-based metrics, CLS uses a decimal scoring system that quantifies
    how far elements have shifted in the viewport from their previous position ([http://bkaprt.com/rjs39/03-05](http://bkaprt.com/rjs39/03-05)).
    A good CLS score is 0.1 or less, but this could always change as some user-experience
    metrics may evolve over time. In practice, the closer you can get this metric
    to 0, the better off you’ll be.


    ### Main-thread responsiveness metrics


    JavaScript has considerable potential to delay page startup and interactions.
    We can assess its impact on the user experience with three metrics: Time to Interactive
    (TTI), First Input Delay (FID), and Total Blocking Time (TBT)—all of which have
    significant interplay with one another and with FCP (Fig 3.5).


    #### Time to Interactive


    Remember that prank where you’d set someone’s desktop background to a screenshot
    of their desktop? Then you’d laugh because your confused victim didn’t know they
    were clicking on a flat image? This is essentially what happens when we delay
    page startup by shipping too much JavaScript, only we’re pranking our users—and
    in the service of our employers or clients, no less.


    Websites that rely heavily on JavaScript tend to have a gap after FCP and before
    a page and its interface elements are interactive (Fig 3.5). This gap has been
    informally described as “the uncanny valley” of frontend performance—it’s not
    a website yet, but it looks an awful lot like one ([http://bkaprt.com/rjs39/03-06](http://bkaprt.com/rjs39/03-06)).


    ![Visualization showing how FCP, user interaction, FID, TTI, and TBT interact
    on the main thread, and the 5-second quiet window that follows.](image/3.5.png)


    Fig 3.5: Metrics such as FCP, TBT, FID, and TTI are plotted on the main thread,
    complete with tasks. Refer to this diagram as needed to visualize the page life
    cycle as we explore each metric.


    This effect is prolonged by in-flight network requests for scripts that provide
    interactivity as well as evaluation of scripts and the long tasks they may incur.
    The more a website relies on JavaScript, the more likely the uncanny valley will
    become a canyon.


    *Time to Interactive (TTI)* is a lab metric that measures when a page is interactive.
    It’s calculated by first marking the page’s FCP. From there, the next five-second
    period in which there is neither a long task nor more than two in-flight network
    requests is also marked. The page’s TTI is at the start of that quiet window.


    Sites with a high TTI will behave more like screenshots of a website than an actual
    website, making users think your website is busted. A good TTI is less than five
    seconds on a middle-tier device ([http://bkaprt.com/rjs39/03-07](http://bkaprt.com/rjs39/03-07)),
    but at the risk of repeating myself, I am once again asking you to aim as low
    as possible.


    #### First Input Delay


    While TTI is great, it describes whether a page is interactive, not whether that
    page will respond to the first input quickly. *First Input Delay (FID)* is a field
    metric that fills in this information gap by measuring the delay between the first
    interaction with a page and when the browser responds to that interaction.'
