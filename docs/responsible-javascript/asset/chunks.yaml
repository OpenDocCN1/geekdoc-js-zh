    From here, you can dive into the recorded interaction by clicking on parts of
    the call stack, just as you would when you profile startup performance. You’ll
    have access to information that tells you exactly what kicked off the interaction,
    and how much time it took. But beware: if you’re debugging the runtime performance
    of interactions on a production website, you’ll need to make sure that you’re
    shipping source maps alongside your JavaScript files to aid in debugging ([http://bkaprt.com/rjs39/03-14](http://bkaprt.com/rjs39/03-14)).
    Otherwise, it may make more sense to profile interactions in a local development
    build where code is not minified and therefore more readable.


    ![A profiler timeline showing subtasks associated with the blocked portion of
    a parent task.](image/3.19.png)


    Fig 3.19: Toggling the settings menu on the Target website kicks off a 490-millisecond-long
    task. The task’s blocking time consists of about 90 percent of the total task
    time, which is considerable for such a high-value interaction.


    It may seem like a rote exercise to poke and prod at various interactions to see
    whether they’re fast enough, but if you want a bit more precision (and can expend
    a bit more effort) you might rely on the `User Timing API` to surface slow interactions
    with application-specific timestamps ([http://bkaprt.com/rjs39/03-15](http://bkaprt.com/rjs39/03-15)).


    Making a website as fast as it can possibly be in all the places it needs to be
    is a lot of work. If you want to make this work really count, though, take care
    to measure your website’s JavaScript performance on low-end devices to surface
    potential performance issues more easily—which is just what you’re about to learn!


    ### Testing on devices


    In Chapter 1, we touched on how performance varies not only across networks, but
    also across devices. We can observe this in a synthetic testing tool such as `WebPageTest`,
    which allows you to run tests on a specific device to assess performance from
    that device’s perspective. This provides access on its results page to main-thread
    activity visualizations representing different device performance characteristics
    (Fig 3.20).


    ![Two flame charts from WebPageTest showing main thread activity and page interactivity.
    Page interactivity has intermittent red marks.](image/3.20.png)


    Fig 3.20: At the top is the main thread for a Moto G6 Android phone, and at the
    bottom is an Alcatel 1X Android phone. The Alcatel 1X incurs more blocking time
    due to its inferior processing power.


    While `WebPageTest` is great for spot checks, it hits a wall when used during
    development. First, `WebPageTest` can only reach publicly accessible URLs. Second,
    it takes a nontrivial amount of time for it to do its thing. These limitations
    are a real pain when you need to quickly test and retest how code changes affect
    performance for low-end devices.


    A better alternative for local testing is Chrome’s remote-device debugging tool,
    which spins up a developer-tools instance for an Android device connected to a
    laptop or desktop. If the connected device has USB debugging enabled ([http://bkaprt.com/rjs39/03-16](http://bkaprt.com/rjs39/03-16)),
    you can access any pages the device has open in Chrome on the host machine’s developer
    tools by pointing Chrome to `chrome://inspect#devices` (Fig 3.21).


    You can launch an instance of Chrome’s developer tools from the debugging tool’s
    home screen by clicking on the `Inspect` link for a page. From there, you can
    use Chrome’s performance profiler to record page activity as you normally would
    (Fig 3.22).


    ![“Devices” configuration tab in Chrome’s devtools.](image/3.21.png)


    Fig 3.21: The gateway to Chrome’s remote-device debugging tool. When an Android
    device with USB debugging is enabled and pages are open in its Chrome instance,
    its active tabs will be listed.


    This is, as one might say, a big deal, because it completely changes your profiling
    context. Chances are that your development machine is beefier than most devices
    people browse the internet with. When you use Chrome’s profiler on resource-constrained
    devices, you surface issues that would otherwise look a-okay on a decked-out laptop.


    ![Chrome’s performance profiler alongside a simulated Android device running inside
    the browser window.](image/3.22.png)


    Fig 3.22: You can use Chrome’s performance profiler to record the activity of
    the connected Android device; it even shows the device’s display contents alongside
    the profiler.


    Chrome won’t let you do this with a connected iOS device, but Safari will if you’re
    on a macOS host with developer tools enabled ([http://bkaprt.com/rjs39/03-17](http://bkaprt.com/rjs39/03-17)).
    Hook up an iOS device to a macOS host, and you can inspect pages open in Safari
    via the `Develop` menu on the host machine. The name of the connected iOS device
    will appear as its own menu option, with a list of open pages beneath it (Fig
    3.23). Clicking on the page URL will launch a Safari developer-tools instance,
    including the performance profiler.


    ![Safari’s “develop” menu open, with the “Jeremy’s iPhone” menu item highlighted.
    “homedepot.com” is a selectable item under “Safari.” ](image/3.23.png)


    Fig 3.23: Safari’s remote-device debugging allows remote debugging of iOS devices
    connected to a macOS host. While this is useful, it’s time for some real talk:
    in April 2021, StatCounter Global Stats found that 41.6 percent of devices it
    surveyed worldwide were Android devices, whereas just 16.07 percent were iOS ([http://bkaprt.com/rjs39/03-18](http://bkaprt.com/rjs39/03-18)).
    If you’re uncertain what devices to profile, test with older, less capable hardware.
    You’ll find more issues, yes, but fixing those issues confers a benefit to all,
    not the affluent few who can afford high-end hardware. You want to get some visibility
    into how your website’s JavaScript is damaging the trust of your visitors. That’s
    what responsible practitioners of web development do.


    [Wait]


    So, we’ve had a bit of talk about lab metrics, field metrics, and profiling performance.
    The truth is, most of what we’ve been jawing about amounts to synthetic performance
    testing, which runs some performance assessment from your local machine using
    `Lighthouse`, a performance profiler, or—if you’re fancy—tools like `WebPageTest`
    that run performance tests from a consistent baseline. When you use these tools,
    you’re gathering lab metrics.


    Lab data is great for benchmarking performance improvements from the developer’s
    perspective. You test and uncover a problem with, say, a huge JavaScript asset’s
    tanking startup performance. You optimize some things, test again, and note changes
    in your lab metrics. Useful stuff.


    Unfortunately, lab metrics only describe one person’s perspective: whoever’s running
    the synthetic test. If you want to get a real sense of how your website is performing
    for actual people out in the world, you need to collect and analyze field metrics.


    ### Gathering field metrics


    When it comes to gathering field metrics for later analysis, there are plenty
    of tools that vary in cost, features, and quality. Collection tools will always
    require some client-side JavaScript to gather the data from browser APIs and send
    it to a collection endpoint. There are open-source options that can help you gather
    this data—such as `Boomerang` ([http://bkaprt.com/rjs39/03-19](http://bkaprt.com/rjs39/03-19))—or
    you can do it yourself.

