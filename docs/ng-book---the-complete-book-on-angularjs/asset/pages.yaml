  md: "# Services\n\n# 159\n\nNow, anywhere we need to access the GitHub API we no\
    \ longer need to call it through $http\nwe can call the githubService instead\
    \ and let it handle the complexities of dealing with the remote service.\n\nThe\
    \ GitHub API exposes the activity stream for the user on GitHub (this stream is\
    \ simply a list of\nrecent events when a user has logged on GitHub). In our service,\
    \ we can create a method that accesses\nthis API and exposes the resulting set\
    \ to our API.\n\nTo expose a method on our service, we can place it as an attribute\
    \ on the service object.\n\n```\nangular.module('myapp.services', [])\n.factory('githubService',\
    \ function($http) {\n  var githubUrl = 'https://api.github.com';\n  var runUserRequest\
    \ = function(username, path) {\n    // Return the promise from the $http service\n\
    \    // that calls the GitHub API using JSONP\n    return $http({\n      method:\
    \ 'JSONP',\n      url: githubUrl + + '/users/' +\n        username + '/' +\n \
    \       path + '?callback=JSON_CALLBACK'\n    });\n  }\n  // Return the service\
    \ object with a single function\n  // events\n  return {\n    events: function(username)\
    \ {\n      return runUserRequest(username, 'events');\n    }\n  };\n});\n```\n\
    \nThe githubService contains a single method that the components in our application\
    \ can call.\n\n# Using Services\n\nTo use a service, we need to identify it as\
    \ a dependency for the component where we're using it: a\ncontroller, a directive,\
    \ a filter, or another service. At runtime, Angular will take care of instantiating\n\
    and resolving dependencies like normal.\n\nTo inject the service in the controller,\
    \ we pass the name as an argument to the controller function.\nWith the dependency\
    \ listed in the controller, we can execute any of the methods we define on the\n\
    service object."
  merge: -1
  pgno: 170
