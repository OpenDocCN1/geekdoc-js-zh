  md: "# Built-In Directives\n\nng-app and ng-controller are special directives, in\
    \ that they modify the scope of directives nested inside of them.\n\nng-app creates\
    \ the $rootScope of an Angular application, while ng-controller creates a child\
    \ scope that typically inherits from either $rootScope or another ng-controller's\
    \ $scope.\n\n# ng-app\n\nPlacing ng-app on any DOM element marks that element\
    \ as the beginning of the $scope.\n$rootScope is the beginning of the scope chain,\
    \ and all directives nested under the ng-app in your HTML inherit from it.\n\n\
    In your JavaScript code you can access the $rootScope via the run method:\n\n\
    ```\n<html ng-app=\"myapp\">\n<body>\n  {{someProperty}}\n  <button ng-click=\"\
    someAction()\"></button>\n</body>\n</html>\n```\n\n```\nangular.module('myapp',\
    \ [])\n.run(function($scope) {\n  $scope.someProperty = 'hello computer';\n  $scope.someAction\
    \ = function() {\n    $scope.someProperty = 'hello human';\n  }\n});\n```\n\n\
    # Live Example38\n\nWhile for the purpose of demonstration, using $rootScope on\
    \ a regular basis is like using global scope - do not it.\n\nWe can use only ng-app\
    \ once per document. If we want to place multiple apps in a page, we'll need to\
    \ manually bootstrap our applications. We will talk more about manually bootstrapping\
    \ apps in the hood chapter.\n\n# ng-controller\n\nInstead of defining actions\
    \ and models on $rootScope, use ng-controller, which is a built-in directive purpose\
    \ is to provide child scopes for the directives that are nested inside. We'll\
    \ use this directive to place a controller on a DOM element.\n\nng-controller\
    \ takes a single argument:\n\n> 38http://jsbin.com/ICOzeFI2/edit"
