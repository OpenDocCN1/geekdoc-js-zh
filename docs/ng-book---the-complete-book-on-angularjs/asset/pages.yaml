    \ operation\n$scope.apply();\n```\n\nSimply said, using $scope.apply() is a way\
    \ to gain access to the Angular context from outside of it.\n\nIf we call $apply()\
    \ when an event is fired, we run it through the Angular event loop. If we don't\
    \ call $apply(), we don't execute the function in the event loop, and it runs\
    \ outside of the Angular context.\n\n# When to Use $apply()\n\nWe can generally\
