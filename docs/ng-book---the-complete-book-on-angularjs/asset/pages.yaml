    \  return service;\n});\n```\n\nInside this service, we'll call the debugger;\
    \ method that effectively freezes our application.\nAs as the Chrome development\
    \ tools are open in our browser, we can use console.log() and other JavaScript\
    \ commands at the point where this application code executes.\nWhen we're done\
    \ debugging the application code, we need to make sure we remove this line, because\
    \ it will freeze the browser, even in production.\n\n# Angular Batarang\n\nAngular\
    \ Batarang is a Chrome extension developed by the Angular team at Google that\
    \ integrates very nicely as a debugging tool for Angular apps."
