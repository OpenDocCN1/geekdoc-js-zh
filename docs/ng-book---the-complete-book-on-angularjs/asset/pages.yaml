  md: "# Built-In Directives\n\nng-if differs from ng-show and ng-hide in that it\
    \ actually removes and recreates DOM nodes, rather than just showing and hiding\
    \ them via CSS.\n\nWhen an element is removed from the DOM using ng-if, its associated\
    \ scope is destroyed. Furthermore, when it comes back into being, a new scope\
    \ is created and inherits from its parent scope using prototypical inheritance.\n\
    \nIt's also important to be aware that ngIf recreates elements using their compiled\
    \ code. If code inside ng-if is loaded, is manipulated using jQuery(for example,\
    \ using .addClass), is then removed because the expression inside the ng-if becomes\
    \ false, then when the expression later becomes true again, the DOM element and\
    \ its children are reinserted into the DOM in their original state, not the state\
    \ they had when they left the DOM. Means that whatever class was added using jQuery's\
    \ .addClass will no longer be present.\n\n```\n<div ng-if=\"2 + 2 === 5\">\n \
    \ Won't see this DOM node, not even in the source code\n</div>\n```\n\n```\n<div\
    \ ng-if=\"2 + 2 === 4\">\n  Hi, I do exist\n</div>\n```\n\nLive Example⁴\n\n#\
    \ ng-repeat\n\nng-repeat to iterate over a collection and instantiate a new template\
    \ for each item in the collection. Each item in the collection is given its own\
    \ template and therefore its own scope. Furthermore, there are number of special\
    \ properties exposed on the local scope of each template instance:\n\n+   * $index:\
    \ iterator offset of the repeated element (0..length-1)\n* $first: true if the\
    \ repeated element is first in the iterator\n* $middle: true if the repeated element\
    \ is between the first and last in the iterator\n* $last: true if the repeated\
    \ element is last in the iterator\n* $even: true if the iterator position $index\
    \ is even (otherwise false)\n* $odd: true if the iterator position $index is odd\
    \ (otherwise false)\n\nWe use $even and $odd in the following example to make\
    \ a repeating list where even items are red and odd item are blue. Remember that\
    \ in JavaScript arrays are indexed starting at 0; thus, we use !$even and !$odd\
    \ to flip the boolean value given by $even and $odd.\n\n> ⁴http://jsbin.com/ezEcamo/1/"
