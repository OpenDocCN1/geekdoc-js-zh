  md: "```\n.config(function($stateProvider, $urlRouterProvider) {\n  $stateProvider\n\
    \    .state('start', {\n      url: '/start',\n      templateUrl: 'partials/start.html'\n\
    \    });\n});\n```\n\nThis assigns a state named to the state configuration object.\
    \ The state configuration object, or the stateConfig, has similar options to the\
    \ route configuration object, which gives us the ability to configure the states\
    \ of our application.\n\n# template, templateUrl, templateProvider\n\nThese are\
    \ the three ways to set up templates on each of the views:\n\n+   * template -\
    \ a string of HTML content or a function that returns HTML\n* templateUrl - a\
    \ string URL path to a template or a function that returns a URL path string\n\
    * templateProvider - a function that returns an HTML string\n\nFor instance:\n\
    \n```\n$stateProvider.state('home', {\n  template: '<h1>Hello {{ name }}</h1>'\n\
    });\n```\n\n# controller\n\nJust like in ngRoute, we can either associate an already-registered\
    \ controller with a URL (via a string) or we can create a function that operates\
    \ as the controller for the state.\nIf there is no template defined (in one of\
    \ the previous options), the controller will not be created.\n\n# resolve\n\n\
    We can resolve a list of dependencies that we will inject into our controller\
    \ using the resolve functionality. In ngRoute, the resolve option allows us to\
    \ resolve promises before the route is actually rendered. Inside angular-route,\
    \ we have a bit more freedom as to how we can use this option.\nThe resolve option\
    \ takes an object where the keys are the names of the dependencies to inject into\
    \ the controller and the values are the factories that are to be resolved.\nIf\
    \ a string is passed, then angular-route tries to match any existing registered\
    \ service. If a function is passed, the function is injected, and the return value\
    \ of the function is the dependency. If the function returns a promise, it is\
    \ resolved before the controller is instantiated and the value (just like ngRoute)\
    \ is injected into the controller."
