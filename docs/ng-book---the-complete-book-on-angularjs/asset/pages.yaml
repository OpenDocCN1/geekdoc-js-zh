  md: "# Built-In Directives\n\nUse the onload attribute within the same element to\
    \ run an expression when the template is loaded.\n\nKeep in mind that when using\
    \ ng-include, Angular automatically creates a new child scope. If you want to\
    \ use a particular scope, for instance the scope of ControllerA, you must invoke\
    \ the ng-controller=\"ControllerA\" directive on the DOM element itself; it will\
    \ not be inherited from the surrounding scope like usual because a new scope is\
    \ created when the template loads.\n\nLet’s look at an example:\n\n```\n<div ng-include=\"\
    /myTemplateName.html\"\n  ng-controller=\"MyController\"\n  ng-init=\"name = 'World'>\n\
    Hello {{ name }}\n</div>\n```\n\n# ng-switch\n\nUse this directive in conjunction\
    \ with ng-switch-when and on=\"propertyName\" to switch directives in our router\
    \ when given the propertyName changes. In the example, when person.name is 'Ari'\
    \ the div below the text will be shown and the person will have:\n\n```\n<input\
    \ type=\"text\" ng-model=\"person.name\" />\n<div ng-switch on=\"person.name\"\
    ></div>\n<p ng-switch-default>And the winner is</p>\n<h1> ng-switch-when=\"Ari\"\
    >{{ person.name }} </h1>\n```\n\nNote that we used ng-switch-default to output\
    \ the name of the person until the switch occured.\n\nLive Example\\*\n\n# ng-view\n\
    \nThe ng-view directive sets the location in the HTML where the router will manage\
    \ and place the elements for different routes. We will cover this in depth in\
    \ the routing chapter.\n\nSee the routing chapter for more information.\n\n# ng-if\n\
    \nUse ng-if to completely remove or recreate an element in the DOM based on an\
    \ expression. If the expression assigned to ng-if evaluates to a false value,\
    \ then the element is removed from the DOM, otherwise a clone of the element is\
    \ reinserted into the DOM.\n\n> *http://jsbin.com/AVibUd/2/"
