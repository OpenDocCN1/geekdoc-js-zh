  md: "# Unit Testing Events\n\nWhen we are unit testing events that are fired, we're\
    \ interested to know that they are actually called and that the right events are\
    \ actually called. Second, we're mostly interested to know that the handlers have\
    \ the data they need.\n\nSetting up unit testing is incredibly easy using the\
    \ spyOn() Jasmine helper.\n\nImagine that we're testing a controller that is firing\
    \ a $emit function. With this function, we can set up an expectation that our\
    \ event is fired and that it's called with any arguments in which we are interested.\n\
    \nFirst, as we need to up our tests that we'll have access to the controller's\
    \ scope:\n\n```\ndescribe('MyApp', function() {\n  var scope;\n  beforeEach(angular.mock.module('MyApp'));\n\
    \  beforeEach(angular.mock.inject(function($scope) {\n    scope = $scope.$new();\n\
    \  }));\n});\n```\n\nWith setup, we can simply set a spyOn() call on the scope\
    \ for the $emit or $broadcast event.\n\n```\n...\n});\nit('should have emit called',\
    \ function() {\n  spyOn(scope, \"$emit\");\n  scope.closePanel(); // for example\n\
    \                      // or any event that\n                      // causes the\
    \ emit to\n                      // be called\n\n  expect(scope.$emit)\n    .toHaveBeenCalledWith(\"\
    panel:closed\",\n      panel.id);\n});\n```\n\nWe can also test the events that\
    \ we set an $on() listener that gets the called after an event is fired. To execute\
    \ the $broadcast method, we can simply call $broadcast on the scope and set an\
    \ expectation for the changes in the scope that the event will cause."
