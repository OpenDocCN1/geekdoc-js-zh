    \ that means the directive gets its own scope object, which we can only use inside\
    \ other methods of the directive or inside the directive's template string:\n\n\
    ```\ntemplate: '<div\\\nwe have access to {{ someProperty }}\\n</div>',\ncontroller:\
    \ function($scope) {\n  // a directive can have its own controller,\n  // in which\
    \ case we can do\n  //=> ERROR!!!\n  $scope.someProperty === \"needs to be set\"\
    \n}\n```\n\nERROR?\n\nUp until now we've omitted one minor detail. Inside the\
