  md: "# Built-In Directives\n\nTo prevent double execution of the handler, use only\
    \ the ng-submit or ng-click directives.\n\nIn the following examples, we want\
    \ to dynamically generate a form based on a JSON response from the server. We'll\
    \ use ng-repeat to loop over the fields we get back from the server. we cannot\
    \ dynamically generate the name attribute, and because we need the name attribute\
    \ to perform validation, we'll loop over the fields and create a new form for\
    \ each one.\n\nBecause Angular forms that use ng-form instead of form can be nested,\
    \ and because the parent form is not valid until its child forms are valid, we\
    \ can both dynamically generate a form with child forms and validation. We can\
    \ have our cake and eat it\n\nLet's first view the JSON we're hard coding, as\
    \ that would come from the server:\n\n```\nangular.module('myapp', [])\n.controller('FormController',\
    \ function($scope) {\n$scope.fields = [\n  {placeholder: 'Username', isRequired:\
    \ true},\n  {placeholder: 'Password', isRequired: true},\n  {placeholder: 'Email\
    \ (optional)', isRequired: false}\n];\n\n$scope.submitForm = function() {\n  alert('it\
    \ works!');\n};\n});\n```\n\nNow, let's take a look at using data to generate\
    \ a dynamic form with validation:\n\n```\n<form name=\"signup_form\"\n  ng-controller=\"\
    FormController\"\n  ng-submit=\"submitForm()\" novalidate>\n  <div ng-repeat=\"\
    field in fields\">\n    <ng-form=\"signup_form_input\">\n      <input type=\"\
    text\"\n        name=\"dynamic_input\"\n        ng-required=\"field.isRequired\"\
    \n        ng-model=\"{{field.name}}\"\n        placeholder=\"{{field.placeholder}}\"\
    \ />\n      <div>\n        <span ng-show=\"signup_form_input.dynamic_input.$invalid\
    \ && signup_form_input.dynamic_input.$error.required\">\n          <span class=\"\
    error\">\n            The field is required.\n          </span>\n        </span>\n\
    \      </div>\n    </ng-form>\n  </div>\n</form>\n```"
