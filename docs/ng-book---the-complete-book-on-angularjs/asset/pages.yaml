  md: '# Control Variables in Forms


    AngularJS makes properties available on the containing $scope object available
    to us as a result of setting a form inside the DOM. These properties enable us
    to react to the form in real time (just like everything else in AngularJS). The
    properties that are available to us are:


    (Note that these properties are made available to us in the format):


    ```

    formName.inputFieldName.property

    ```


    # Unmodified Form


    This property is a boolean that tells us the user has modified the form. It is
    true if the user hasn''t touched the form, and false if they have:


    ```

    formName.inputFieldName.$pristine;

    ```


    # Modified Form


    This property is a boolean that tells us if and only if the user has actually
    modified the form. It is true regardless of validations on the form:


    ```

    formName.inputFieldName.$dirty

    ```


    # Valid Form


    This property is a boolean that tells us whether or not the form is valid. If
    the form is currently valid, then the following will be true:


    ```

    formName.inputFieldName.$valid

    ```


    # Invalid Form


    This property is a boolean that tells us whether or not the form is invalid. If
    the form is currently invalid, then the following will be true:


    ```

    formName.inputFieldName.$invalid

    ```


    The last two properties are particularly useful for showing or hiding DOM elements.
    They are very useful when setting a class on a particular form.


    # Errors


    This property is another useful one that AngularJS makes available to us: the
    $error object. This object contains all of the validations on a particular form
    and a record of whether they are valid or invalid. To get access to this property,
    use the following syntax:'
