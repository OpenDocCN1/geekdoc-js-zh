  md: "# Testing Templates\n\nWhen we test templates, we're looking to ensure that\
    \ the proper content template is loaded and that the correct data inside the template\
    \ shows up in the view.\n\n# Unit Testing Templates\n\nSince our templates are\
    \ tied directly to the view, unit testing components inside the view doesn't make\
    \ a lot of sense: We're making assertions upon the completion of multiple components\
    \ to build the view.\n\nWe can make an assertion that the template is properly\
    \ loaded. To make that, we need to set up our test to expect a request to the\
    \ home template and execute a view change to test that it is, in fact, loaded.\n\
    \n```\ndescribe('Unit: Templates', function() {\n  var $httpBackend,\n    location,\n\
    \    route,\n    rootScope;\n\n  beforeEach(module('MyApp'));\n  beforeEach(inject(\n\
    \    function($rootScope_, $route_, $httpBackend_, $location_){\n      location\
    \ = $location_;\n      rootScope = $rootScope_;\n      route = $route_;\n    \
    \  $httpBackend = $httpBackend_;\n    }));\n\n  afterEach(function() {\n    $httpBackend.verifyNoOutstandingExpectation();\n\
    \    $httpBackend.verifyNoOutstandingRequest();\n  });\n\n  // Our tests will\
    \ go here\n\\});\n```\n\nNow, we can set up our tests to reflect the expectation\
    \ that our templates do load when we navigate to different parts of the app."
  merge: -1
