    \ a response is required when using when, whereas expect a response is not required.\n\
    \nThe when() method is great for setting up back-end definitions that are common\
    \ for all tests (e.g., testing a controller that is using the resolve property\
    \ that depends upon foreign data being loaded).\n\nThe when() function takes two\
    \ required arguments and two additional optional requirements:\n\n+   * method\n\
