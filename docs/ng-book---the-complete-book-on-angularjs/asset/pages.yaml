  md: "# Dependency Injection\n\n```\nvar aControllerFactory = =\n  function aController($scope,\
    \ greeter) {\n    console.log(\"LOADED controller\", greeter);\n    // ... Controller\n\
    \  };\nAControllerFactory.inject = ['$scope', 'greeter'];\n// Greeter service\n\
    var greetersService = function() {\n  console.log(\"greeter service\");\n}\n//\
    \ Our app controller\nangular.module('myApp', [])\n  .controller('MyController',\
    \ aControllerFactory)\n  .factory('greeter', greeterService)\n// Grab the injector\
    \ and create a new scope\nvar injector = angular.injector(['$ng', 'myApp']),\\\
    ncontroller = injector.get('$Controller'),\\nrootScope = injector.get('$rootScope'),\\\
    nnewScope = rootScope.$new();\\n// Invoke the controller\ncontroller('MyController',\
    \ {$scope: newScope});\n```\n\nWith this annotation style, order is important,\
    \ as the $inject array must match the ordering of the arguments to inject. This\
    \ method of injection does work with minification, because the annotation information\
    \ will be packed with the function.\n\n# Inline Annotation\n\nThe last method\
    \ of annotation that Angular provides out of the box is the inline annotation.\
    \ This syntactic sugar works the same as the $inject method of annotation from\
    \ above, but allows us to make the arguments inline in the function definition.\
    \ Additionally it affords the ability to not use a temporary variable in the definition.\n\
    \nInline annotation allows us to pass an array of arguments instead of a function\
    \ when defining an Angular object. The elements inside this array are the list\
    \ of injectable dependencies as strings, the last argument being the function\
    \ of the object.\n\nFor instance:"
  merge: -1
