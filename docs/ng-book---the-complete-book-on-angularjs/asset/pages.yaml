  md: "# Filters\n\nIn AngularJS, a filter provides a way to format the data we display\
    \ to the user. Angular gives us several built-in filters as well as an easy way\
    \ to create our own.\n\nWe invoke filters in our HTML with the | (pipe) character\
    \ inside the template binding characters {{ }}. For instance, let's say we want\
    \ to capitalize our string. We can either change all the characters in a string\
    \ to capitalized, or we can use a filter.\n\n```\n{{ name uppercase }}\n```\n\n\
    We can also use filters in JavaScript using the $filter service. For instance,\
    \ to use the lowercase JavaScript filter:\n\n```\napp.controller('DemoController',\
    \ ['$scope', '$filter',\nfunction($scope, $filter) {\n  $scope.name = $filter('lowercase')('Ari);\n\
    });\n```\n\nTo pass an argument to a filter in the HTML form, we pass it with\
    \ a colon after the filter name (for multiple arguments, the number filter allows\
    \ us to limit the number of decimal places a number can show. To pass the argument\
    \ 2, we'll append :2 to the number filter:\n\n```\n<!-- Displays: 123.46 --\n\
    {{ 123.45689 | number:2 }}\n```\n\nWe can use multiple filters at the same time\
    \ using two or more pipes. We'll see such an example in a minute when we build\
    \ a custom filter. Before we get to that, however, let's look at the built-in\
    \ filters that we come out of the box with AngularJS.\n\n# currency\n\nThe currency\
    \ filter formats a number as currency. In other words, 123 as currency looks like:\
    \ {{ 123 \\| currency }}.\n\nCurrency gives us the option of displaying a currency\
    \ symbol or identifier. The default currency option is that of the current locale;\
    \ however, we can pass in a currency to display."
