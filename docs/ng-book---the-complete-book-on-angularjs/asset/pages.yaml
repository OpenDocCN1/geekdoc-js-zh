    \ directives. That power allows us to create dynamic objects as controllers that\
    \ are isolated and easy to test.\n\nFor instance, we can create an anonymous controller\
    \ in a directive, like so:\n\n```\nangular.module('myApp')\n.directive('myDirective',\
    \ function() {\n  restrict: 'A',\n  template: '<h4>{{controller.msg}}</h4>',\n\
    \  controllerAs: 'controller',\n  controller: function() {\n    this.msg = \"\
    Hello World\";\n  }\n});\n```\n\n# require(string|array)\n\nThe require option\
    \ can be set to a string or an array of strings. The string(s) contain the name\
    \ of another directive. require is used to inject the controller of the required\
    \ directive as the fourth parameter of the current directive's linking function.\n\
    \nThe scope or strings (if it is an array) are provided the names of directives\
    \ that reside in the current scope of the current directive.\n\nThe setting will\
    \ affect what the surrounding scope refers to, be it an isolate scope, an independent\
    \ scope, or no scope at all. In all cases, the Angular compiler will consult the\
    \ template of the current directive when looking for child controllers.\n\nWithout\
    \ the prefix, the directive only looks for the controller on its own element.\n\
    \n```\n// ...\nrestrict: 'EA',\nrequire: 'ngModel'\n//...\n```\n\nThis directive\
    \ definition will only look for the ng-model=\"\" definition in the local scope\
    \ of the directive."
