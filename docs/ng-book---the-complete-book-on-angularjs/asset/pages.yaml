  md: "# Angular Animation\n\nStagger animations can also be triggered inside custom\
    \ directives. Simply make a call using the Animate service a few times in a row\
    \ and a stagger animation will be up for grabs. Ensure that the parent element\
    \ is the same for each animation as well as the className value for each element\
    \ being animated.\n\n# Using JavaScript Animations\n\nJavaScript animation is\
    \ different from the previous two Angular animation methods in that we set properties\
    \ on the DOM element directly using JavaScript.\n\nAll major browsers enable JavaScript\
    \ support JavaScript animation, so it's a good choice if we want to offer animations\
    \ on browsers that don't support CSS transitions and animations.\n\nHere, instead\
    \ of manipulating our CSS to animate elements, we update our JavaScript to handle\
    \ runningAnimate for us.\n\nThe ngAnimate module adds the .animation method to\
    \ the module API; this method presents an interface on which we can build animations.\n\
    \nThe animation() method takes two parameters:\n\n+   - className (string)\n\n\
    This className will match the class of the element to animate. For our examples\
    \ thus far, the animation should be named: .fade-in.\n\n+   - animateFun (function)\n\
    \nThe animate function is expected to return an object that includes functions\
