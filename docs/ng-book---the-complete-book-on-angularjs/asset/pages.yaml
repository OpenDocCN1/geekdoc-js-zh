  md: 'All input fields can validate against some basic validations, like minimum
    length, maximum length, etc. These are all available on the new HTML5 attributes
    of a form.


    It is usually a great idea to use the novalidate flag on the form element, as
    it prevents the browser from natively validating the form.


    Let''s look at all the validation options we have that we can place on an input
    field:


    # Required


    To validate that a form input has been filled out, we simply add the HTML5 tag,
    required, to the input field:


    ```

    <input type="text" required />

    ```


    # Minimum Length


    To validate that a form input is at least a certain [number] of characters, we
    add the Angular directive ng-minlength="{number}" to the input field:


    ```

    <input type="text" ng-minlength=5 />

    ```


    # Maximum Length


    To validate that a form input is equal or less than a number of characters, we
    can add the Angular directive ng-maxlength="{number}":


    ```

    <input type="text" ng-maxlength=20 />

    ```


    # Matches a Pattern


    To ensure that an input matches a regex, we can use ng-pattern="PATTERN/":


    ```

    <input type="text" ng-pattern="/a-zA-Z/" />

    ```


    # Email


    To validate an email address in an input field, we simply set the input type to
    email, like so:'
