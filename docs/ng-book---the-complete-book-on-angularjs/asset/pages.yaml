  md: '# Next Steps


    Now that we''re familiar with Angular, let''s take a deep-dive into the professional
    tools available to allows us to develop in a production environment.


    # jqLite and jQuery


    Although Angular encourages breaking away from reliance on the jQuery^160 library,
    we can use it if we need to within our app by ensuring that we load before the
    ContentLoaded event has fired or we manually bootstrap our app.


    Angular itself includes a compatible library called jlite.


    The element() method that we use throughout this book returns a jqLite object,
    which is a subset of the jQuery library that allows Angular to manipulate the
    DOM in a cross-browser compatible way.


    The jqLite library does not attempt to cover all of methods in the entire jQuery
    library, as it is meant to be light and cover only those methods that Angular
    needs.


    The library itself covers the following jQuery methods:


    +   - addClass Adds the specified class(es) to the element


    +   - after() Inserts content after the element


    +   - append() Inserts content to the end of the element


    +   - attr() Gets or sets the value of the attribute for the element


    +   - bind() / on() Attaches an event handler function for one or more events
    of the selected element


    +   - children() Gets the children of the element


    +   - clone() Creates a deep copy of element


    > ^160http://jquery.com/'
