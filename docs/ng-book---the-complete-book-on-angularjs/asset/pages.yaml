  md: "# Next Steps\n\n```\n// ...\n}\nngtemplateApp: {\n  cwd: '<%= yeoman.app %>',\n\
    \  src: 'views/**.html',\n  dest: '<%= yeoman.app %/scripts/templates.js'\n}\n\
    // Put files not handled in other tasks\ncopy:\n// ...\n```\n\nThis modification\
