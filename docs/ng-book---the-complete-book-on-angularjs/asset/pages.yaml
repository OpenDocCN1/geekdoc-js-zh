  md: '# Scopes


    Scopes are a **core** fundamental of any Angular app. They are used all over the
    framework, so it''s important to know them and how they work.


    The scopes of the application refer to the application model. Scopes are the execution
    context of expressions. The $scope object is where we define the business functionality
    of the application, the methods in our controllers, and properties in the views.


    Scopes serve as the **glue** between the controller and the view. Just before
    our app renders the view to the user, the view template links to the scope, and
    the app sets up the DOM to notify Angular property changes. This feature makes
    it easy to account for promises, such as XHR call, to be fulfilled. See the [promises]()
    chapter for more details.


    Scopes are the **source of truth** for the application state. Because of this
    *live binding*, we can rely on the $scope to update immediately when the view
    modifies it, and we can rely on the view to update when $scope changes.


    $scope in AngularJS are arranged in a hierarchical structure that mimics the DOM
    and thus are nestable: We can reference properties on parent scope


    > If you are familiar with JavaScript, this hierarchical context shouldn''t be
    foreign. When we create a new execution context in JavaScript, we create a new
    function that effectively creates a new "local" context. The Angular concept of
    $scopes is similar in that we create a new scope for child DOM elements, we are
    creating a new *execution context* for the DOM to live.


    Scopes provide the ability to watch for model changes. They give the developer
    the ability to propagate model changes throughout the application using the `apply`
    mechanism available on the scope. We define and execute expressions in the context
    of a scope; it is also from here that we can propagate events to other controllers
    and parts of the application.


    It is ideal to contain the application logic in a controller and the working data
    on the scope of the controller.


    # $scope View of the World


    When Angular starts to run and generate the view, it will create a binding for
    the root `ng-app` element to the $rootScope. This $rootScope is the eventual parent
    of all $scope objects.'
  merge: -1
