  md: "# Essential AngularJS Extensions\n\n```\n.config(function($urlProvider) {\n\
    \  $urlProvider.when('', '/inbox');\n});\n```\n\nIf we pass a function, it will\
    \ be invoked when the path has matched. The handler can return one\nthree values:\n\
    \n+   - falsy - This value tells the $urlRouter that the rule didn't match, and\
    \ it should try finding a\nstate that matches. It can be useful if we want to\
    \ ensure a user has valid access to\na URL.\n- string - The $urlRouter will treat\
    \ a string value as a redirect URL.\n- true or undefined - This value lets the\
    \ $urlRouter know that we've handled the URL.\n\notherwise() Just like the otherwise()\
    \ method in ngRoute, the otherwise() method here redirects\na user if no routes\
    \ are matched. This is a good way to create a default URL, for instance.\nTheother()\
    \ method takes a single parameter: either a string or a function.\n\nIf we pass\
