  md: "Filters\n\n49\n\nformName.inputFieldName.$error\n\nIf a validation fails, then\
    \ this property will be true; if it is false, then the value passed the input\
    \ field.\n\n# A Little Style Never Hurts\n\nWhen AngularJS is handling a form,\
    \ it adds specific classes to the form based upon the current state of the form\
    \ (i.e. if it's currently valid, unchanged, etc.). These classes are named similarly\
    \ to the properties we can check, as well:\n\nThese classes are:\n\n+   .ng-pristine\
    \ {}\n.ng-dirty {}\n.ng-valid {}\n.ng-invalid {}\",\n\nThey correspond to their\
    \ counterpart on the particular input field.\n\nWhen a field is, the .ng-invalid\
    \ class will be applied to the field. This particular site sets the CSS class\
    \ as:\n\n```\ninput.ng-invalid {\n  border: 1px solid red;\n}\ninput.ng-valid\
    \ {\n  border: 1px solid green;\n}\n```\n\n# $parsers\n\nWhen our user interacts\
    \ with the controller and the $setView() method has been called on the ngModelController,\
    \ the array of $parsers functions are called as a pipeline. The first $parser\
    \ is called and passes its value to the next, and so on and forth.\n\nThese functions\
    \ have the opportunity to convert the value and change the validity state of the\
