  md: '# scope()


    We fetch the $scope from the element (or its parent) by using the $scope() method
    on the element:


    ```

    var scope = ele.scope();

    ```


    Using the element''s scope, we can inspect any scope properties, such as custom
    variables that we set on the scope in our controllers. We can peek into the elements
    looking into its $id, its $parent object, the $$watchers are set on it and even
    manually walk up the scope chain.


    # controller()


    We fetch the current element''s controller (or its parent) by using the controller()
    method:


    ```

    var ctrl = ele.controller();

    // or

    var ctrl = ele.controller(''ngModel'');

    ```


    # injector()


    We fetch the injector of the current element (or the containing element) by using
    the injector() method on the selected element.


    ```

    var injector = ele.injector();

    ```


    With this injector, we can then instantiate any Angular object inside of our app,
    such as services, other controllers, or any other object.


    # inheritedData()


    We fetch the data associated with an element''s $scope simply by using the inheritedData()
    method on the element:


    ```

    ele.inheritedData();

    ```


    This inheritedData() method is how Angular finds data up the scope chain as it
    walks up the DOM until it''s found a particular value or the top-most parent has
    been reached.


    > If you''re using Chrome, we can use a shortcut with the developer tools. Find
    the element you''re interested in, right click it in the browser, and select inspect
    element. The element itself is stored as the $0 variable, and we can fetch the
    Angularized element by calling: angular.element($0).'
