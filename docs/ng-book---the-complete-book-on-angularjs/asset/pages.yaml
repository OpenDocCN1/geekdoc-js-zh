  md: "# Essential AngularJS Extensions\n\nThe basic route can be specified like so:\n\
    \n```\n$stateProvider('inbox', {\n  url: '/inbox',\n  template: '<h1>Welcome to\
    \ your inbox</h1>'\n});\n```\n\nWhen the user navigates to /inbox, the app transitions\
    \ to the inbox state, and we fill the ui-view directive with the contents of the\
    \ template (<h1>Welcome to your inbox</h1>).\n\nThe URL can take several different\
    \ options and we can set the base parameters in the url like ngRoute:\n\n```\n\
    $stateProvider('inbox', {\n  url: '/inbox/:inboxId',\n  template: '<h1>Welcome\
    \ to your inbox</h1>',\n  controller: function($scope, $stateParams) {\n    scope.inboxId\
    \ = $stateParams.inboxId;\n  }\n});\n```\n\nThe app captures inboxId as the second\
    \ component in the URL. For instance, if the user transitions to /inbox/1,$stateParams.inboxId\
    \ becomes 1 (as $stateParams will be {inboxId: 1}).\n\nWe can also use a different\
    \ syntax if you prefer:\n\n```\nurl: '/inbox/{inboxId}'\n```\n\nThe path must\
    \ match the URL exactly. Unlike ngRoute, if the user navigates to /inbox/, the\
    \ above path will work; however, when navigating to /inbox the state will not\
    \ be activated in the example above.\n\nThe path also enables us to use regex\
    \ inside of parameters so we can set a rule to match against our route. For instance:"
