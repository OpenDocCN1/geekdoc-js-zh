    # Bower


    Bower is a package manager for front-end files on the web. Similar to how npm
    is a package manager for Node modules, allowing developers to write shareable
    modules for the server, bower offers similar functionality for web components.


    It offers a solution to the dependency problem through a generic, unopinionated
    and easy-to-use interface. It runs over Git and is package agnostic. It also supports
    any type of transport, requireJS, AMD, and others.


    # Installation


    Installation is simple: we just use the npm package manager to install bower:


    ```

    $ npm install -g bower

    ```


    > bower depends upon Git, Node, and npm.


    From here, we can verify that it''s working by typing the help command:


    ```

    $ bower help

    ```


    If output is displayed to the screen, then we are good to go.'
