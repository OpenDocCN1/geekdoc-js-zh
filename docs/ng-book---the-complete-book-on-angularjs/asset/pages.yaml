  md: "# Testing\n\n```\nit('loads the home template at /', function() {\n  $backend.expectGET('templates/home.html')\n\
    \  .respond(200);\n  location.path('/');\n  rootScope.$digest(); // call the digest\n\
    \  $backend.flush();\n});\n```\n\n```\nit('loads the dashboard template at /dashboard,\
    \ function() {\n  $backend.expectGET('templates/dashboard.html')\n  .respond(200);\n\
    \  location.path('/dashboard');\n  rootScope.$digest(); // call the digest\n \
    \ $backend.flush();\n});\n```\n\nNotice that we're not returning a template in\
    \ our tests (.respond(200) instead of respond(200, \"<div><div></div></div>\"\
    )). Since we're only verifying that the template is being loaded on our requests,\
    \ we don't need to worry about what shows up, just that it does.\n\nEnd-to-end\
    \ testing we will verify that the view looks how it's supposed to look in end-to-end\
    \ tests.\n\n# End-to-End Testing Templates\n\nWhen testing the view in end-to-testing,\
    \ we want to focus our attention on the actual data being loaded in the view,\
    \ rather than on the template simply loads up. These tests will give us a better\
    \ picture of what our users will actually see when the view loads.\n\nWe'll test\
    \ the content of the view when it's in our user's view.\n\nTo test our templates,\
    \ we'll test that the view contains our expected HTML and that it does not other\
