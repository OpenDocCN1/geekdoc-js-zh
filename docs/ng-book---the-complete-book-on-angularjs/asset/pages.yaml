  md: "# value()\n\nIf the return value of the $get method in our service is a constant,\
    \ we don't need to define a full-blown service with a more complex method. We\
    \ can simply use the value() function to register the service.\n\nThe value()\
    \ method accepts two arguments:\n\n+   - name (string)\n\nOnce again, this argument\
    \ gives the name with which we want to register the value.\n\n+   - value (value)\n\
    \nWe'll return this value as the injectable instance.\n\nvalue() method returns\
    \ a registered service instance for the name given.\n\n```\nangular.module('myApp')\n\
    .value('apiKey', '1232123');\n```\n\n# When to Use Value or Constant\n\nThe major\
    \ difference between the value() method and the constant() method is that you\
    \ can inject a constant into a config function, whereas you cannot inject a value.\n\
    \nConversely, with constants, we are unable to register service objects or functions\
    \ as the value.\n\nTypically, a good rule of thumb is that we should use value()\
    \ to register a service object or function, while we should use constant() for\
    \ configuration data.\n\n```\nangular.module('myApp', [])\n.constant('apiKey',\
    \ '1232123')\n.config(function(apiKey) {\n  // The apiKey here will resolve to\
    \ 1232123\n  // as we set above\n})\n.value('FBid', '2321231')\n.config(function(FBid)\
