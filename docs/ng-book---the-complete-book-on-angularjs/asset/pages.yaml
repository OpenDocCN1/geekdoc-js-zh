  md: '# Data Binding and Your First AngularJS Web Application


    The model object that we are referring to is the $scope object. The $scope object
    is a JavaScript object whose properties are all available to the view and with
    which the controller can interact. Don''t worry if this concept doesn''t make
    sense yet: It''ll make sense with a few examples.


    Bi-directional in this context means that if the value changes, the model observes
    the change through dirty checking, and if the model changes the value, the view
    update with the change.


    To set up this binding, we used the ng-model function on the input, like so:


    ```

    <input ng-model="person.name" type="text" placeholder="Your name">

    <h1>Hello {{ name }} </h1>

    ```


    Now that we have a binding set up (yes, it''s easy), we can see how the view changes
    model. When the value in the input field changes, the person.name will be updated
    and the view will reflect the change.


    Now we see that we''re setting up a bi-directional binding purely in the view.
    To illustrate the bi-directional binding from the other way (back end to front
    end), we''ll have to dive into Controllers, which we''ll cover shortly.


    Just as ng-app declares that all elements inside of the DOM element upon which
    it is declared belongs to the Angular app, declaring the ng-controller attribute
    on a DOM element says that all of the elements it belongs to the controller.


    To declare our example inside of a controller, we''ll change the HTML to look
    like:


    ```

    <div ng-controller=''MyController">

    <input ng-model="name" type="text" placeholder="Your name">

    <h1>Hello {{ name }} </h1>

    </div>

    ```


    In this example, we''ll create a clock that will tick every second (as clocks
    usually do) and change the data on the clock variable:'
