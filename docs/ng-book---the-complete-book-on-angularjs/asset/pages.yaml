  md: '# Testing


    watched If Karma is set to use autowatch, this boolean specifies whether the file
    identified will be watched. If it is listed as true, then Karma will run the tests
    when this file is changed. If it is set to false, these tests will not run.


    If watched is not listed as a property in the configuration object, the files
    listed in this object will be watched by default (true).


    included This boolean tells Karma to load the file using the <script> tag in the
    browser. If this option is set to true, the browser will load the files. If set
    to false, we are responsible for loading manually. We generally use this in conjunction
    with RequireJS.


    By default, files are set to be included with the <script> tag (true).


    served This boolean tells Karma to serve the file through the Karma web server.
    If it is set to true, the file will be accessible over the web server. If it''s
    set to false, it won''t.


    By default, this option is set to true and thus, the files will be accessible
    over the webserver.


    # Ordering


    The order in which files are listed, so we will list our libraries before we list
    our application files as they need to be required. If a pattern is listed, the
    files are sorted in alphabetical order and included.


    Every file that is included is only included once, so if a file is matched more
    than once in a pattern match, it is only included once.


    A full example of the files property:


    ```

    files: [

    // simple strings

    // we can target a single file

    // ''js/app/vendor/angular.js'',

    // or we can target a glob of files in a pattern

    // ''js/app/**/*.js'',

    // objects

    // when the index.html file changes, we won''t

    // run the tests

    {pattern: ''public/index.html'', watched: false},

    // And we can set the file to not be included

    // but still be watched

    {pattern: ''public/index.html'', included: false}

    ]

    ```'
