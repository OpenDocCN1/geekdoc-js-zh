  md: '# Interceptors


    Anytime that we want to provide global functionality on all of our requests, such
    as authentication, error handling, etc., it''s useful to provide the ability to
    intercept all requests before they pass to the server and back from the server.


    For instance, if the server returns a response code with 401, we likely would
    want to kick the user out to a login page.


    Angular provides a way for us to handle responses at the global level using interceptors.


    Interceptors, although the term sounds scary, are basically *middleware* for the
    $http service that allows us to inject logic into the existing flow of app.


    At their core, interceptors are service factories (see services for more information
    about services) that we register through the $httpProvider by adding them to the
    $httpProvider.interceptors array.


    There are four types of interceptors – two success interceptors and two rejection
    interceptors:


    +   - request


    Angular calls the request interceptor with the $http config object. It can modify
    the config object or create a new one, and it is responsible for returning the
    updated config object or a promise that resolves a new config object.


    +   - response


    Angular calls the response interceptor with the $http response object. The function
    can modify the response or create a new one. It’s responsible for returning the
    response or a promise that resolves a new response object.


    +   - requestError


    Angular calls this interceptor when the previous request interceptor throws an
    error or is resolved with a rejection.


    +   - responseError


    We receive this error when the previous response interceptor throws an error or
    is resolved with a rejection.


