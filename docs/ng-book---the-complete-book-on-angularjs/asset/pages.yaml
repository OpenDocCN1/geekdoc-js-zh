  md: "# Registering a Service\n\nThere are several ways to create and register a\
    \ service with the $injector; we'll explore them later in this chapter.\n\nThe\
    \ most common and flexible way to create a service uses the angular.module API\
    \ factory:\n\n```\nangular.module('MyApp.services', [])\n  .factory('githubService',\
    \ function() {\n    var serviceInstance = {};\n    // Our first service\n    return\
    \ serviceInstance;\n  });\n```\n\nAlthough this githubService doesn't do anything\
    \ very interesting, it is now registered with the AngularJS app hold on the name\
    \ githubService as its name.\n\nThis service function is responsible for generating\
    \ a single object or function that becomes this service, which will exist for\
    \ the lifetime of the app. When our Angular loads the service, the service will\
    \ execute this function and hold on the returned value as the singleton service\
    \ object.\n\nThe service factory function can be either a function or an array,\
    \ just like the way we create controllers:\n\n```\n// Creating the factory through\
    \ the\n// bracket notation\nangular.module('MyApp.services', [])\n  .factory('githubService',\
    \ [function($http) {\n}]);\n```\n\nFor instance, this githubService requires access\
    \ to the $http service, so we'll list the $http service as a dependency for Angular\
    \ to inject into the function.\n\n```\nangular.module('MyApp.services', [])\n\
    \  .factory('githubService', function($http) {\n    // Our serviceInstance now\
    \ has access to\n    // the $http service in it's function definition\n    var\
    \ serviceInstance = {};\n    return serviceInstance;\n  });\n```"
  merge: -1
  pgno: 169
