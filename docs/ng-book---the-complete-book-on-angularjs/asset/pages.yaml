    # Architecting Presently


    When we''re building Presently, we''ll need to take into account the application
    architecture. Doing so will give us insight into how we will build the app when
    we get to code.


    Like Currently, Presently will be a “newtab” app, meaning that it will launch
    every time we open a new tab.


    Presently has two main screens:


    +   * The home screen


    This screen features the current time and the current weather. It also features
    several icons beside the weather.


    +   * The settings screen


    This screen allows our users to change their location within the app.


    In order to support the home screen, we need to be able to show a properly formatted
    date and time as well as fetch weather from a remote API service.


    To support the settings screen, we must integrate with a remote API service to
    auto-suggest potential locations for an input box.


    Finally, we''ll use the basic local storage (session storage) to persist our settings
    across the app.


