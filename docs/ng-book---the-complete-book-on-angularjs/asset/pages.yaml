  md: "# EssentialJS Extensions\n\n448\n\n# data\n\nWe can attach arbitrary data to\
    \ our state configObject. This option is similar to the resolve property, except\
    \ that this data will not be injected into the controller, nor will promises be\
    \ resolved. This option can be particularly useful when passing data to child\
    \ states from a parent state.\n\n# Events!\n\nLike the ngRoute service, the angular-route\
    \ service fires events at different times during the lifecycle.\n\nWe can attach\
    \ functions to these events inside of our application by listening on the $scope.\
    \ All of the following events are fired on the $rootScope, so we can listen to\
    \ these events on any of our $scope objects.\n\n# State Change Events\n\nWe can\
    \ listen to the events as follows:\n\n```\n$scope.on('$stateChangeStart',\nfunction(evt,\
    \ toState, toParams, fromState, fromParams), {\n// We can prevent this state from\
    \ completing\n  evt.preventDefault();\n});\n```\n\nThe events that may be fired\
    \ as follows:\n\n$stateChangeStart This event is fired when the transition from\
    \ one state to another begins.\n\n$stateChangeSuccess This event is fired when\
    \ the transition from one state to the next is completed.\n\n$stateChangeError\
    \ This event is fired when an error occurs during the transition. It is usually\
    \ caused by either a template that cannot be resolved or a promise failing to\
    \ resolve.\n\n# View Load Events\n\nThe ui-router provides events at the view\
    \ loading stage.\n\n$viewContentLoading This event is fired when the view begins\
    \ loading and before the DOM is rendered.\n\nWe can listen to this event like\
    \ so:"
  merge: -1
