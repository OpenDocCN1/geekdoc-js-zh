    ```\n// scope.user will be empty\n$scope.user = User.get({id: '123'});\n```\n\n\
    We can wait for the data to come back as expected using the callback method that\
    \ the methods provide:\n\n```\nUser.get({id: '123'}, function(user) {\n  $scope.user\
    \ = user;\n});\n```\n\n# Additional Properties\n\nThe $resource collections and\
    \ instances have five special properties that enable us to interact with the underlying\
    \ resource definitions.\n\n+   * $promise (promise)\n\nThe $promise property is\
    \ the original promise that is created for the $resource. This property is particularly\
    \ useful when using it in conjunction with the $routeProvider.when() resolve property.\
    \ If the request is successful, the promise is resolved with the resource instance\
    \ or collection object. If the request is unsuccessful, then the promise is resolved\
    \ with the HTTP response object, without the resource property.\n\n+   * $resolved\
    \ (boolean)\n\nThe $resolved property is a boolean that turns true upon the first\
    \ server interaction (regardless of whether or not it's successful).\n\n# Custom\
    \ $resource Methods\n\nAlthough the $resource service provides five methods, it\
    \ is extensible enough for us to add our own custom methods to the resource object.\n\
    \nTo create a custom method on our $resource class object, we can pass a third\
    \ argument to the resource class that contains an object of a modified $http configuration\
    \ object as methods.\n\nIn the object, the key is the name of the method and the\
    \ value is the $http configuration object."
