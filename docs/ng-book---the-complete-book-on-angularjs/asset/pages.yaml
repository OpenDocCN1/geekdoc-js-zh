  pgno: 520
- img_proc: true
  md: "The type of `$sce` context where the value is safe for us. See `sce types`\
    \ for available types.\n\n+   - value\n\nThe value that we can use to stand in\
    \ for the provided value.\n\nThe `trustAs()` method returns a value that can be\
    \ used where Angular expects a `$sce.trustAs()` return value.\n\nThe `$sce` library\
    \ has few helper methods for the `trustAs()` method.\n\nThe following method calls\
    \ are functionally equivalent:\n\n```\ntrustAsHtml(value)             trustAs($sce.HTML,\
    \ value)\ntrustAsJs(value)                trustAs($sce.JS, value)\ntrustAsResourceUrl(value)\
    \      trustAs($sce.RESOURCE_URL, value)\ntrustAsUrl(value)               trustAs($sce.URL,\
    \ value)\n```\n\n# # isEnabled()\n\nThe `isEnabled()` method takes no parameters\
    \ and returns a boolean that tells us if the `$sce` environment is enabled. If\
    \ it is, it returns true; otherwise, it returns false.\n\n# # Configuring $sce\n\
    \nIf we want to completely disable the `$sce` subsystem from running our app (although\
    \ we discourage this move, as it provides security by default), we can disable\
    \ it in the `config()` function of our app like:\n\n```\nangular.module('myApp',\
    \ [])\n  .config([$sceProvider', \n    function($sceProvider) {\n      // Turn\
    \ off SCE\n      $sceProvider.enabled(false);\n    });\n```\n\n# # Trusted Context\
    \ Types\n\nThe `$sce` library has five built-in context types that are supported\
    \ by default. These context types are what Angular uses to parse and determine\
    \ what is `safe` in one context vs. another."
