    # ng-bind-template


    Similar to the ng-bind directive, we can use the ng-bind-template directive if
    we want to bind multiple expressions to the view.


    ```

    <div>

    g-bind-template="{{ message }} {{ name }}"

    </div>

    ```


    # ng-model


    The ng-model directive binds an input, select, textarea, or custom form control
    to a property on the surrounding scope. It handles and provides validation, sets
    related classes on the element (ng-valid, ng-invalid, etc.), and registers the
    controller with its parent scope.


    It binds to the property given by evaluating the expression on the current scope.
    If the property doesn''t already exist on its scope, it will be implicitly created
    and added to the scope.


    We should always use ngModel with a property $scope, not as a raw property on
    the scope itself. Setting ng-model as a property of the scope will help us avoid
    overloading properties on the same scope or the inherited scope.


    For example:


    ```

    <input type="text"

    g-model="modelName.someProperty" />

    ```


    The code above is the correct way to think about and practically use ngModel properly.


    The bottom line is to always have a . in your ng-models. For in-depth discussion
    and an example on this topic, see the ng-controller section earlier in this chapter.


    > *http://jsbin.com/AJeLoO1/edit'
