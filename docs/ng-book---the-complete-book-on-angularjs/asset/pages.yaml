  md: '# Routes


    We use one of two methods to declare all application routes in AngularJS: the
    when method and the\otherwise method.


    To create a route on a specific module or app, we use the config function.


    ```

    angular.module(''myApp'', []).

    config([''$routeProvider'', function($routeProvider) {

    }]);

    ```


    We''re using special dependency injection syntax. For more information on this

    syntax, check out the dependency injection chapter.


    Now, to add a specific route, we can use the when method. This method takes two
    parameters

    (when(path, route)).


    This block shows how to create a single route:


    ```

    angular.module(''myApp'', []).

    config([''$routeProvider'', function($routeProvider) {

    $routeProvider

    .when(''/'', {

    templateUrl: ''views/home.html'',

    controller: ''HomeController''

    });

    }]);

    ```


    The first parameter is the route path, which is matched against the $location.path,
    the path of

    current URL. Turning or double slashes will still work. We can store parameters
    in the URL

    by starting off the name with a colon (for instance, :name). We''ll talk about
    how to retrieve these

    parameters using $routeParams.


    The second parameter is the configuration object, which determines exactly what
    to do if the route

    in the first parameter is matched. The configuration object properties that we
    can set are controller,

    template, templateURL, resolve, redirectTo, reloadOnSearch.


    A more complex routing scenario requires multiple routes and a catch-all that
    redirects to a route.'
