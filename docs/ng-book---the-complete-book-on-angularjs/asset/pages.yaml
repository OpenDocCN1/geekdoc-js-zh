  md: 'Mobile Apps


    466


    Cordova exposes native device access through JavaScript APIs that allow us to
    run device-specific operations, such as getting the native location or using the
    camera. Cordova is designed natively with plugin architecture, so we can take
    advantage of Cordova community-built plugins, such as native audio access or barcode
    scanning plugins.


    One of the benefits of Cordova is that we can reuse our Angular app code to support
    the mobile environment. Of course, there are a few issues that we''ll deal with,
    such as performance and native component access.


    # Installation


    Cordova itself is distributed as an npm package, so we sure we use npm to install
    it.


    +   If you don''t have npm installed, first make sure you install node. For information
    on installing NodeJS, read the Next Steps chapter.


    ```

    $ npm install -g cordova

    ```


    ![](img/c29f4deabfb2aac07907f28672b2ed83_477_0.png)


    Installing Cordova


    The Cordova package includes a generator that will create our app and make it
    Cordova-ready.


    # Getting Started with Cordova


    Getting started with Cordova is simple. We use the generator to create the starting
    point of our Cordova app. Let''s call the app GapApp.


    The generator takes up to three parameters:


    +   - project-directory (required)'
  merge: -1
