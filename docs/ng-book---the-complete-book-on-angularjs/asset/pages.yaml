  md: '# all(promises)


    If we have multiple promises that we want to combine into a single promise, we
    can use the $.all(promises) method to combine them all into a single promise.
    This single method takes a single argument:


    +   - promises (array or object of promises)


    Promises as an array or hash of promises

    Theall() method returns a single promise that will resolve with an array or a
    hash of values. Each value will correspond to the promises at the same index or
    key in the promises hash. If any of the promises are resolved with a rejection,
    then the resulting promise will be rejected well.


    # defer()


    The defer() creates a deferred object. It takes no parameters, and it returns
    a new instance of a single deferred object.


    # reject(reason)


    This method creates a promise that is resolved with a rejection for a specific
    reason. It is specifically designed to give us to forwarding rejection in a chain
    of promises, which is akin to throw in JavaScript. In the same sense that we can
    catch an exception in JavaScript and we can forward the rejection, we need to
    rethrow the error. We can do so with $q.reject(reason).

    This method takes a single parameter:


    +   - reason (constant, string, exception, object)


    The reasons for the rejection

    The reject() method returns a promise that has already been resolved with a rejection
    and the reason for the rejection.


    # when(value)


    The when() wraps an object that might be a then-able promise into a $q promise.
    Doing that allows us to deal with an object that may or may not be a promise.

    The when() function takes a single parameter:


    +   - value


    The value or a promise

    The when() function returns a promise that we can then use like any other promise.'
