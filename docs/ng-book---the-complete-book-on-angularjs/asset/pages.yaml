    # requestHandler


    Our expect() methods all return a requestHandler object that has a single function:
    respond. The respond method gives us the ability to set up a response for the
    mocked HTTP request.

    TheRequestHandler function is a function that can take one of two forms:

    The first form allows us to set a response code, response data, headers, or all
    three.


    ```

    // ...

    $httpBackend.expectGET("/v1/api/current_user"

    // Respond with a 200 status code

    // and the body "success"

    .respond(200, ''Success'');

    // Or only return data

    .respond("Fail");

    // Or only headers

    .respond(''X-RESPONSE'', ''Failure'');

    ```


    The second form enables us to set a request handler function that is executed
    upon the successful execution of the request. Instead of returning data, we''ll
    return a function handler that can return an array containing the response status
    code, response data, and response headers.'
