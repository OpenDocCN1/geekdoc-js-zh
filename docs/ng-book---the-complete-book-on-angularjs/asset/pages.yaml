  md: "promise['finally'](function (){});\n\nAngular's q deferred objects are chainable\
    \ in that even then returns a promise. As soon as the promise is resolved, the\
    \ promise that returns is resolved or rejected.\n\nThese promise chains are how\
    \ Angular can support $http’s interceptors.\n\nThe $q service is similar to the\
    \ original Kris Kowal’s Q library:\n\n+   1. q is integrated with the Angular\
    \ $rootScope model, solutions and rejections happen quickly inside of Angular.\n\
    2. q promises are integrated with Angular’s templating engine, which means that\
    \ any promises found in the views are resolved or rejected in the view.\n3. q\
    \ is tiny and doesn't contain the fullness of the Q library.\n\n# Chaining Requests\n\
    \nThe then method returns a new derived promise after the initial promise is resolved.\
    \ This gives us the unique ability to attach yet another on the result of the\
    \ initial then method.\n\n```\n// A service that responds with a promise\nGithubService.then(function(data)\
    \ {\nvar events = [];\nfor (var i = 0; i < data.length; i++) {\n  events.push(data[i].events);\n\
    }\n  return events;\n}).then(function(events) {\n  $scope.events = events;\n});\n\
    ```\n\nIn this example, we can create a chain of execution that allows us to interrupt\
    \ the flow of the application based upon more functionality, which we can attach\
    \ to different results.\n\nThis interruption allows us to pause or defer resolutions\
    \ of promises at any point during the chain of execution.\n\nThis interruption\
    \ is also how the $http service implements request and response interceptors.\n\
    \nThe $q library comes with several different useful methods:"
