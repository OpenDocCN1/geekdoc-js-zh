    ;\n\n// Does a PUT to /authors/1988-author-1\n// That's the url in firstAuthor.link.href\n\
    firstAuthor.put()\n\n// GET to /books/for-author/1988-author-1\nvar books = Restangular.allUri('books',\
    \ firstAuthor.books.href).getList().$object;\n```\n\n# Custom Restangular Services\n\
    \nFinally, we highly recommend using Restangular from inside a custom service\
    \ object. Doing so is particularly useful, as we configure Restangular on a per-service\
    \ level with a custom service. Writing a service will help disconnect the logic\
    \ to talk to our back-end from within our angular objects and enable our services\
    \ to handle the load of talking to them.\n\nThis disconnection from inside Angular\
    \ objects also helps in making testing a breeze as we can stub and mock back-end\
    \ calls without worrying about actually making calls to our back-end during tests.\n\
    \nTo create a service that wraps Restangular, we simply need to inject the Restangular\
    \ service into our factory and call the methods like normal. Inside this factory,\
    \ we can create custom configurations using the withConfig() function.\n\nFor\
    \ instance:"
