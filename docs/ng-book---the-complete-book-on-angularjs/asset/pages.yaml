  md: "# Built-In Directives\n\n```\nangular.module('MyApp', [])\n.controller('CounterController',\
    \ function($scope) {\n  $scope.decrement = function() {\n    $scope.count = $scope.count\
    \ - 1;\n  }\n});\n```\n\nLive Example⁵²\n\n# ng-select\n\nUse the ng-select directive\
    \ to bind data to an HTML <select> element. This directive can be used in conjunction\
    \ with ng-model and ng-options to provide sophisticated and highly performant\
    \ dynamic forms.\n\nng-options takes a comprehension expression for its attribute\
    \ value, which is just a fancy way of saying it can take an array or an object\
    \ loop over its contents to provide the options available when using the select\
    \ tag. It comes in one of the following:\n\n+   - for array data sources:\n  -\
    \ label for value in array\n  - select as label for value in array\n  - label\
    \ group by group for value in array\n  - select as group by group for value in\
    \ array trackxpr\n- for object data sources:\n  - label for (key, value) in object\n\
    \  - select as label for (key, value) in object\n  - label group by group for\
    \ (key, value) in object\n  - select as label group by group for (key, value)\
    \ in object\n\nLet's look at an example of using ng-select:\n\n```\n<div ng-controller=\"\
    CityController\">\n  <select ng-model=\"city\">\n    <ng-options=\"city.name for\
    \ city in cities\">\n      <option value=\"\">Choose City</option>\n  </select>\n\
    \  Best City: {{ city.name }}\n</div>\",\n```\n\n> ⁵²http://jsbin.com/uGipBUU/edit"
