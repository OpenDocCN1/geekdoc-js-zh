  md: '# Testing Page Content


    When we''re testing, we want to ensure the page content is rendered correctly
    by our browser. We will need to assert that certain content gets delivered in
    the browser and eventually to our users.


    Unit testing in the browser won''t give us much insight into the state of the
    application, we don''t have direct access to browser content in unit testing.


    We can confirm that the controllers are executing the expected functions and set
    assertions confirm the content will load, which we will cover in depth.


    # End-to-end Testing Page Content


    End-to-end testing, on the other hand, is ideal for setting up expectations for
    loaded HTML. With end-to-end testing, every part of the application responsible
    for executing a successful browser request fire.


    To set up end-to-end content testing, we set up our test like normal:


    ```

