  md: "# # Directives Explained\n\nThe goal of this chapter is to explicitly lay out\
    \ all of the options and capabilities that directives have to offer when building\
    \ mature client-side applications.\n\n# ## Directive Definition\n\nThe simplest\
    \ way to think about a directive is that it is simply a function that we run on\
    \ a particular DOM element. The function is expected to provide extra functionality\
    \ on the element.\n\nFor instance, the ng-click directive gives an ability to\
    \ listen for the click event and run an Angular expression when it receives the\
    \ event. Directives are what makes the Angular framework so powerful, and as we've\
    \ seen, we can also create them.\n\nA directive is defined using the .directive()\
    \ method, one of the many methods available on our application's Angular module.\n\
    \n```\nangular.module('MyApp')\ndirective('myDirective',\nfunction($timeout, UserDefinedService)\
    \ {\n  // directive definition goes here\n})\n```\n\nThe directive() method takes\
    \ two arguments:\n\n# ### name (string)\n\nThe name of the directive as a string\
    \ that we'll refer to inside of our views.\n\n# ### factory_function (function)\n\
    \nThe factory_function returns an object that defines how the directive behaves.\
    \ It is expected to return an object providing options that tell the $compile\
    \ service how the directive should behave when it is invoked in the DOM."
  merge: -1
  pgno: 114
- img_proc: true
  md: "# Directives Explained\n\n```\nangular.application('myApp', []);\n.directive('myDirective',\
    \ function() {\n  // A directive definition object\n  return {\n    // directive\
    \ definition is defined via options\n    // which we'll override here\n  };\n\
    });\n```\n\nWe can also return a function instead of an object to handle this\
    \ directive definition, but it is best practice to return an object as we've done\
    \ above. When a function is returned, it is often referred to as the postLink\
    \ function, which allows us to define the link function for the directive. Returning\
    \ a function instead of an object limits us to a narrow ability to customize our\
    \ directive and, thus, is good for simple directives.\n\nWhen Angular bootstraps\
    \ our app, it will register the registered object by the name provided as a string\
    \ via the first argument. The Angular parses the DOM of our main HTML document\
    \ looking for elements, attributes, comments, or class names when looking for\
    \ these directives. When it finds that it knows about, it uses the directive definition\
    \ to place the directive on the page.\n\n```\n<div my-directive></div>\n```\n\n\
    > To avoid collision with future HTML standards prefix a custom namespace. Angular\
    \ itself has chosen the ng- prefix, so use something other than that. In the examples\
    \ that follow, we will use the my- prefix (e.g., my-directive).\n\nThe factory\
    \ we defines for a directive is only invoked once, when the compiler matches the\
    \ directive first time. Just the .controller function, we invoke a directive's\
    \ function using $injector.invoke.\n\nWhen Angular names the directive in the\
    \ DOM, it will invoke the directive definition we've registered, using the name\
    \ to look up the object we've registered. At this point, the directive lifecycle,\
    \ starting with the $compile method and ending with the $link method. We'll drive\
    \ into the specifics of this process later in this chapter.\n\nLet's look at all\
    \ the available options we can provide to a directive definition.\n\n> A JavaScript\
    \ object is made up of keys and values. When the value for a given key is set\
    \ to a string, boolean, array, or object, we can call the key a property. When\
    \ we set the key to a function, we call it a method.\n\nThe possible options are\
    \ shown below. The value of each key provides the signature of either the method\
    \ or the type we can set the property to:"
  merge: -1
