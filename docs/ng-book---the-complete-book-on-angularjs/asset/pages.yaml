  md: "Directives Explained\n\n# The compile function deals with transforming the\
    \ template DOM.\n\nThe link function deals with linking scope to the DOM. Before\
    \ scope is linked to the DOM, we may manually manipulate the DOM. In practice,\
    \ this manipulation is rather rare when writing custom directives, but there are\
    \ a few built-in directives that take advantage of this functionality. Understanding\
    \ the process will help us understand how Angular actually works.\n\n# Link\n\n\
    We use the link option to create a directive that manipulates the DOM.\n\nThe\
    \ link function is optional. If the compile function is defined, it returns the\
    \ link function; therefore, the compile function will overwrite the link function\
    \ when both are defined. If our directive is simple and doesn't require setting\
    \ any options, we may return a function from the factory function (callback function)\
    \ instead of an object. When doing so, this function will be the link function.\n\
    \nThese two definitions of the directive are functionally equal:\n\n```\nangular.module('MyApp'\
    \ [])\ndirective('myDirective', function() {\n  return {\n    pre: function(element,\
    \ aAttrs, transclude) {\n      // executed before child elements are linked\n\
    \      // NOT safe to do DOM transformations here b/c the `link` function\n  \
    \    // called afterward will fail to locate the elements for linking\n    },\n\
    \    post: function(scope, element, iAttrs, controller) {\n      // executed after\
    \ the child elements are linked\n      // IS safe to do DOM transformations here\n\
    \      // same as the link function, if the compile option here we're\n      //\
    \ omitted\n    }\n  }\n});\n```"
