    \ to the HTTP method we want to use to make the request. It should be one of the\
    \ following: 'GET', 'DELETE', 'JSONP', 'POST', 'PUT'.\n\n# ### url (string)\n\n\
    A url that overrides the configured url for the route specific to this method.\n\
    \n# ### params (map of string/array)\n\nThis key contains the optional set of\
    \ pre-bound parameters for this action. If any of the values are functions, they\
