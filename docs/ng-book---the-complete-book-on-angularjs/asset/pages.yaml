  md: '# # Caching


    In large, internet-scale web apps, the ability to limit API calls from the client
    side enables us to create scalable web apps.


    Not only does it make the front end appear quicker and more responsive, but it
    also protects our back end by reducing the amount of work that our back end needs
    to perform. That way, our back end can serve more client consumers on the end.


    # ## What Is a Cache?


    A Cache is a component that transparently stores data so that future requests
    can be served more quickly. It is safe to cache data that doesn''t need to be
    recomputed often, whereas fetching new data would result in duplicated data.


    The more requests we serve from cache, the more our overall system performance
    increases.


    Traditionally, caching servers, such as Memcache, can be served on the same system
    that''s serving the content to clients or on remote systems. Choosing between
    options comes down to server size and traffic.


    Depending upon the volatility of the content, we can focus our efforts on storing
    cached content in long-term storage (e.g., storing it on disk or for the short
    term and only keeping it in memory).


    Caching works like a big key-value store. There''s a key that points to a cached
    piece of content. When the content is requested, if the key is in the cache and
    is available (i.e., we get a cache hit), the related content will be served.


    If the key is not (i.e., we get a cache miss), then the caching server will need
    to know how to fetch the data, and return it to the original requester of the
    data.


    In this section, we''ll discuss caching strategies within Angular, from how to
    set up memcache (lightly) for server-side content using Angular''s built-in caching
    mechanisms. There are good libraries that will handle it for us.


    # ## Angular Caching


    Angular offers caching as a feature out of the box for built-in services and gives
    us the ability to use the same mechanisms to cache our custom content.'
  merge: -1
  pgno: 509
