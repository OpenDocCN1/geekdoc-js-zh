  md: '# Introduction to Directives


    The above JavaScript is called a *directive definition*. We''ll see all the options
    for defining a directive in directive definition.


    ![](img/c29f4deabfb2aac07907f28672b2ed83_74_0.png)


    With the `.directive()` method, provided by the Angular module API, we can register
    new directives by providing a name as a string and function. The name of the directive
    should always be PascalCased, and the function we should return an object.


    Camel casing is the practice of writing compound words or phrases without spaces
    such that each, usually with the exception of the first word, begins with a capital
    letter, and the phrase becomes a single word. For instance: *bumpy roads* in camel
    case notation would be `bumpyRoads`.


    In our case, we declare the directive in HTML using `my-directive`, the directive
    definition `must` be `myDirective`.


    The object that we return from the `.directive()` method comprises methods and
    properties we use to define and configure our directive.


    In an attempt to master the simplest directive possible, we''ve only defined our
    directive with two options: restrict and template.


    In *directives explained*, we''ll cover all of the available methods and properties
    we can use when defining our own, but for the moment, let''s check out the input
    HTML as compared to the output HTML by using Google Chrome and its developer tools.


    First, open up your HTML document using Chrome. See a blue link that says "Click
    here". Take a look at the source code by going to View > Developer > View Source.
    You should see the following picture:'
