  md: "Testing 314\n\nWe set up expectations using the expect() function. The expect()\
    \ function takes a single value argument. This argument is called the actual value.\n\
    \nTo set up an expectation, we need a matcher function that takes a single value\
    \ argument. This argument is the expected value.\n\nThese matchers implement a\
    \ boolean comparison between the actual value and the expected value. We can create\
    \ a negative of the test by calling not before calling the matcher.\n\n```\ndescribe('A\
    \ spec suite', function() {\n  it('contains a passing spec', function() {\n  \
    \  expect(true).toBe(true);\n  });\n  it('contains another passing spec', function()\
    \ {\n    expect(false).not.toBe(true);\n  });\n});\n```\n\nJasmine comes with\
    \ a large set of built-in matchers that we'll use throughout testing our app.\
    \ It is also incredibly easy to write a custom matcher.\n\n# Included Matchers\n\
    \n# toBe\n\nThe toBe() matcher compares values with the JavaScript operator: =====.\n\
    \n```\ndescribe('A spec suite', function() {\n  it('contains passing specs', function()\
    \ {\n    var value = 10,\n    another_value = value;\n    expect(value).toBe(another_value);\n\
    \    expect(value).not.toBe(null);\n  });\n});\n```\n\n# toEqual\n\nThe toEqual()\
    \ matcher compares values and works for simple literals and variables:"
