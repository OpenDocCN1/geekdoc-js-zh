  md: '# Multiple Views and Routing


    http://yoursite.com/inbox/all


    Inside AngularJS, the $location service uses HTML5''s history API, allowing for
    our app to use the regular URL path. The $location service automatically falls
    back to hashbang URLs if the browser doesn''t support the HTML5 history API.


    One interesting feature of the $location service is that if a modern browser does
    support the HTML5 history API loads a hashbang URL, it will rewrite the URL for
    our users.


    In HTML5 mode, Angular takes care of rewriting links specified in the <a href=""><a>
    tags. To is to say as Angular compiles your app, it rewrites the href="" portion,
    depending upon the browser''s capabilities.


    For example, with the: <a href="/person/42?all=true">Person</a>, a legacy browser
    URL will be rewritten to /index.html!/person/42?all=true. In a modern browser,
    it will see the URL as it was intended.


    The back-end server will have to support URL rewriting on the server side. To
    support HTML5 mode, the server will have to make sure to deliver the index.html
    page for all pages. That ensures that your Angular app will handle the route.


    When writing links inside of our Angular app in html5mode, we''ll never have to
    use relative links. If you are using your route, it won''t be a problem; however,
    if you are serving in any base route, our Angular app won''t be able to handle
    it.


    Alternatively, you can set the base URL of your app using the <base> tag in the
    HEAD section of the HTML document:


    ```

    <base href="/base/url" />

    ```


    # Routing Events


    The $route service fires events at different stages of the routing flow. It''s
    possible to set up listeners for these different routing events and react.


    This functionality is useful when you want to manipulate events based on routes
    and is particularly useful for detecting when users are logged in and authenticated.


    We need to set up an event listener to listen for routing events. To set it up,
    we use the $rootScope to listen for the event.


    # $routeStart


    Angular broadcasts $routeStart before the route changes. This step is where the
    route services begin to resolve all of the dependencies necessary for the route
    change to happen and where templates and the resolve keys are resolved.'
