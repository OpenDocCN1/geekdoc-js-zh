  md: '# Mobile Apps


    Mobile apps are **not the next frontier** for software developers – they''re already
    here. There are already 1.2 billion mobile web app users, and that number is growing
    rapidly (Wikipedia¹¹¹). Soon, the number of mobile devices will exceed the number
    of people on the planet. At the rate that the number of mobile devices is growing,
    it''s estimated that 5.1 billion people will be using mobile phones by 2017.


    For us as app developers, it''s important that we develop for mobile technology
    if we want to stay relevant. With AngularJS, we have some great support for mobile,
    written by both the Angular team and the community.


    In this section, we''re going to work through these two different ways to give
    our users a mobile experience for our app:


    +   * Responsive web apps

    * Native with Cordova


    # Responsive Web Apps


    The easiest way to support mobile with Angular is by using the tools we already
    know and love – HTML and CSS– to create a mobile-ready Angular app. Angular apps
    are already based on HTML, making our designs and interaction responsive is only
    a matter of building the architecture that will support different devices.


    # Interaction


    For the desktop, the ability to create interactions is already available to us
    through the ng-click and family directives.


    Beginning with Angular version 1.2.2, we now have the ability to use touch events
    using the new ngTouch. Since ngTouch is not built into the core Angular library,
    we need to install it.


    > ¹¹¹http://en.wikipedia.org/wiki/List_of_countries_by_number_of_mobile_phones_in_use'
  merge: -1
  pgno: 469
- img_proc: true
  md: 'Mobile Apps


    # Installation


    We can install ngTouch in any of several ways. The simplest way to install the
    ngTouch module by downloading the source from angularjs.org¹¹⁴.


    Find the extras in the download section, then we can download and store the ng-touch.js
    file into an accessible location in our app.


    Alternatively, we can use Bower to install angular-touch:


    ```

    $ bower install angular-touch --save

    ```


    Either way, we need to reference the library in our index.html as a script:


    ```

    <script src="bower_components/angular-touch/angular-touch.js"></script>

    ```


    Finally, we need to include ngTouch as a dependency in our app:


    ```

    angular.module(''App'', [''ngTouch'']);

    ```


    Now we''re ready to take advantage of the ngTouch library.


    # ngTouch


    Mobile browsers work slightly differently than desktop browsers when dealing with
    click events. Mobile browsers detect a tap event then wait about 300 ms to detect
    any other taps (i.e., they wait to find out if we''re double-tapping the device).
    After this delay, the browser fires a click event.


    This delay can make our apps feel incredibly unresponsive. Instead of dealing
    with the click event, we can detect touch events.


    The ngTouch library seamlessly handles this functionality for us through the ng-click
    directive and takes care of calling the correct event for us. This so-called fast
    click event will be called.


    > After the fast click has been called, the browser''s delayed click is called
    secondarily, causing a ''double'' action. ngTouch takes care of removing this
    delay on ng-click events.


    Using the ngClick directive on mobile devices works the exact same way on mobile
    browsers as it does on desktop browsers:


    ¹¹⁴http://angularjs.org/'
