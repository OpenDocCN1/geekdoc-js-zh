  md: "# $routeChangeSuccess\n\nThe $routeChangeSuccess event is broadcasted from\
    \ the $rootScope after all of the route dependencies are resolved following $routeChangeStart.\n\
    \nThe ngView directive uses the $routeChange event to know when to instantiate\
    \ the controller and render the view.\n\n# $routeChangeError\n\nThe $routeChangeError\
    \ event is fired if any of the resolve properties on the route object are rejected\
    \ (i.e., if they fail). This event is broadcasted from the $rootScope.\n\n# $routeUpdate\n\
    \nThe $routeUpdate is broadcasted from the $rootScope if the reloadOnSearch property\
    \ on the $routeProvider has been set to false and the same instance of a controller\
    \ is being used.\n\n# $destroy\n\nThe $destroy event is broadcasted before the\
    \ scope is destroyed. This sequence gives the children scopes a chance to clean\
    \ themselves up before the parent scope is actually removed.\n\nFor instance,\
    \ if we have a $timeout running in our controller, we don't want this event to\
    \ continuously fire even if the containing controller no longer exists.\n\n```\n\
    angular.module('myApp')\ncontroller('MainController', function($scope, $timeout)\
    \ {\n  var timer;\n  var updateTime = function() {\n    $scope.date = new Date();\n\
    \    timer = $timeout(updateTime, 1000);\n  }\n  // Start updating time\n  timer\
    \ = $timeout(updateTime, 1000);\n\n  // Clean up the timer before we kill this\n\
    \  $scope.on('destroy', function() {\n    if (timer) { $timeout.cancel(timer);\
    \ }\n  });\n});\n```"
