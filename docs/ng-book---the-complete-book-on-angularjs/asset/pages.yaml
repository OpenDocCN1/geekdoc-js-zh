  md: "# Optimizing Angular Apps\n\n```\n// throttle function\nvar throttle = function(fn,\
    \ atMost, ctx) {\n  var ctx = ctx || this;\n  var atMost = atMost || 250; // milliseconds\n\
    \  var last, defer, result;\n  return function() {\n    var now = new Date(),\n\
    \    args = arguments;\n    if (last && now < last + atMost) {\n      // Execute\
    \ this later\n      clearTimeout(defer);\n      defer = setTimeout(function()\
    \ {\n        last = now;\n        fn.apply(ctx, args);\n      });\n    } else\
    \ {\n      result = fn.apply(ctx, args);\n    }\n    return result;\n  }\n}\n\
    ```\n\nThis relatively ugly throttle() function only triggers the function, once,\
    \ at most, per atMost cycle.\n\n> The Underscore.js library has a much better\
    \ production-ready, battle-tested version of this code.\n\nTo set our $digest\
    \ loop to throttle using our throttle function, we can simply invoke it in the\
    \ event loop:\n\n```\n// ...\nfor (var i = 0; i < events.length; i++) {\n  var\
    \ event = events.handlers[i];\n  if (service.handlers[event]) {\n    for (handler\
    \ in service.handlers[event]) {\n      throttle(function() {\n        $scope.apply(function()\
    \ {\n          handler.apply(event);\n        });\n      }, 500);\n    }\n  }\n\
    }\n```\n\n157http://underscorejs.org/"
