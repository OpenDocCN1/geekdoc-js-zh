  md: "# Dependency Injection\n\nAngular uses the $injector for managing lookups and\
    \ instantiation of dependencies for this reason. In fact, the $injector is responsible\
    \ for handling all instantiations of our Angular components, including our app\
    \ modules, directives, controllers, etc.\n\nWhen any of our modules boot up at\
    \ runtime, the injector is responsible for actually instantiating the instance\
    \ of the object and passing in any of its required dependencies.\n\nFor this instance,\
    \ this simple app declares a single module and a single controller, like so:\n\
    \n```\nangular.module('MyApp', [])\n.factory('greeter', function() {\n  return\n\
    \    greet: function(msg) { alert(msg); }\n});\n.controller('MyController',\n\
    function($scope, greeter) {\n  $scope.sayHello = function() {\n    greeter.greet(\"\
    Hello!\");\n  }\n});\n```\n\nAt runtime, when Angular instantiates the instance\
    \ of our module, it looks up the greeter and simply passes it in naturally:\n\n\
    ```\n<div ng-app=\"MyApp\">\n  <div ng-controller=\"MyController\">\n    <button\
    \ ng-click=\"sayHello()\">Hello</button>\n  </div>\n</div>\n```\n\nBehind the\
    \ scenes, the Angular process looks like:\n\n```\n// Load the app with the injector['ng',\
    \ 'MyApp']\nvar injector = angular.injector(['ng', 'MyApp']);\n// Load the $controller\
    \ service with the injector\nvar controller = injector.get('$controller');\nvar\
    \ scope = injector.get('$rootScope').newScope();\n// Load the controller, passing\
    \ in a scope\n// which is how angular does it at runtime\nvar MyController = $controller('MyController',\
    \ {$scope: scope});\n```"
  merge: -1
  pgno: 161
