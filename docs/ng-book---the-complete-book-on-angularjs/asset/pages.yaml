    \ {\n  // anti-pattern, bare value\n  $scope.someBareValue = 'hello computer';\n\
    \  // set actions on $scope itself, this is okay\n  $scope.someAction = function()\
    \ {\n    // sets {{ someBareValue }} inside SomeController and ChildController\n\
    \    $scope.someBareValue = 'hello human, from parent';\n  };\n}\n.controller('ChildController',\
    \ function($scope) {\n  $scope.childAction = function() {\n    // sets {{ someBareValue\
    \ }} inside ChildController\n    $scope.someBareValue = 'hello human, from child';\n\
    \  };\n});\n```\n\n# Live Example¹\n\nBecause of the way prototypical inheritance\
    \ works with value objects in JavaScript, changing someBareValue via an action\
    \ in the parent does change it in the child, but not versa.\nTo see this problem\
    \ in action, clicking on the button first and then the parent button. Doing so\
    \ makes it clear that the child controller has copy, not a reference to someBareValue.\n\
    \n> JavaScript objects are either copy by value or copy by reference. String,\
    \ Number, and Boolean are copy by property. Array, Object, and Function are copy\
    \ by reference.\n\nWe had set our string as a property on a model object, it would\
    \ have been shared via reference, which means changing the property on the child\
    \ will it on the parent. The following example shows the correct way:\n\n```\n\
    <div ng-controller=\"SomeController\">\n{{someModel.value}}\n<button ng-click=\"\
    someAction()\">Communicate with child</button>\n<div ng-controller=\"ChildController\"\
    >\n{{someModel.value}}\n<button ng-click=\"childAction()\">Communicate to parent</button>\n\
    </div>\n</div>\n```"
