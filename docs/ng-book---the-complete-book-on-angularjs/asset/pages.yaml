  md: "Services\n\n161\n\n```\n.controller('ServiceController';\nfunction($scope,\
    \ githubService) {\n  // Watch for a change on the username property\n  // If\
    \ there is a change, run the function\n  $scope.$watch('username', function(newUsername)\
    \ {\n    // uses the $http service to call the\n    // GitHub API and returns\
    \ the resulting promise\n    githubService.events.inject(newUsername)\n      .success(function(data,\
    \ status, headers) {\n        // the success function wraps\n        // the response\
    \ in data\n        // so we need to call data.data to\n        // fetch the raw\
    \ data\n        $scope.events = data.data;\n      });\n  });\n}\n);\n```\n\nSince\
    \ we are returning the $http promise, we can call the .success method on the return\
    \ as though we are calling $http directly.\n\nUsing $watch in the controller as\
    \ above is not recommended. We're using this example only for simplicity's sake.\
    \ In production, we would wrap this functionality into a directive and set the\
    \ $watch function instead.\n\nIn this example, you'll notice that there is a delay\
    \ before the input field changes. If we don't include this delay, we'll end up\
    \ calling the GitHub API for every keystroke that is inserted into the input,\
    \ which is obviously not what we want.\n\nTo introduce this delay, we're using\
    \ the built-in $timeout service. To use the $timeout service, we inject it into\
    \ the controller just like we injected the githubService into the controller:\n\
    \n```\napp.controller('ServiceController',\nfunction($scope, $timeout, githubService)\
    \ {\n});\n```\n\nIt's conventional to inject Angular services before our own custom\
    \ services.\n\nNow we can use the $timeout service in the controller. The $timeout\
    \ service, in this case, cancels any network requests that would otherwise be\
    \ running and gives us a 350 millisecond delay between changes in the input field.\
    \ In other words, if there is a delay of 350 milliseconds between keyboard strokes,\
    \ we'll assume the user is typing and we can start the GitHub request:"
