  md: "# Using Node/Express Middleware\n\nNote: Although we are using NodeJS in this\
    \ example, this implementation is simply one way to serve static HTML snapshots\
    \ to our back end. This technique works regardless of the back end you're using\
    \ to deliver your HTML.\n\nTo deliver static HTML using NodeJS and Express (the\
    \ web application framework for NodeJS), we must add some middleware that looks\
    \ for the _escaped_fragment_ in our query parameters:\n\n```\n// ideas shared\
    \ by\n// In our app.js configuration\napp.use(function(req, res, next) {\n  var\
    \ fragment = req.query._escaped_fragment_;\n\n  if (!fragment) return next();\n\
    \n  // If the fragment is empty, serve the\n  // index page\n  if (fragment ===\
    \ \"\" || fragment === \"\")n    fragment = \"/index.html\";\n\n// If the fragment\
    \ does not start with '/'\n  // prepend it to our fragment\n  if (fragment.charAt(0)\
    \ !== \"/\")\n    fragment = '/' + fragment;\n\n  // If the fragment does not\
    \ end with '.html'\n  // append it to the fragment\n  if (fragment.indexOf('.html')\
    \ == -1)\n    fragment += \".html\";\n\n  // Serve the static html snapshot\n\
    try {\n    var file = __dirname + \"/snapshots\" + fragment;\n    res.sendFile(file);\n\
    \  } catch (err) {\n    res.send(404);\n  }\n});\n```\n\nThis middleware expects\
