    # Protected Resources by Route Definition


    If we want to always protect all of our paths and/or if we are not making API
    calls that will protect the route, then we need to monitor our routes and ensure
    that we have a logged-in user for the routes we are interested in.


    In order to monitor our routes, we must set up a listener on the $RouteChangeStart
    event. This event fires when the route starts to resolve, but before we''ve actually
    changed the route.


    Combined with the interceptors, this approach is more secure. If we don''t check
    for status code, our users may still be able to make unprotected requests.


    Let''s set our listener to focus on this event and check to see if the route itself
    is defined to be exposed to the current user.


    First, we must define some access roles for our application. We can do so by setting
    a constant in our app such that we can check against these roles on each route.


    ```

    angular.module(''myapp'', [''ngRoute''])

    constant(''ACCESS_LEVELS'', {

    pub: 1,

    user: 2

    });

    ```


    By setting the ACCESS_LEVELS as a constant, we can inject it into both .config()
    and .run() blocks and can use it throughout our application.


    Now, let''s use these constants to define access levels for each of our defined
    routes:'
