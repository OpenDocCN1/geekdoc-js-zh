- img_proc: true
  md: "# Directives Explained\n\n+   - When developing locally, we should run a server\
    \ in the background to serve up the local HTML templates from our file system.\
    \ Failing to do so will raise a Cross Origin Request Script (CORS) error.\n\n\
    +   - Template loading is asynchronous, which means that compilation and linking\
    \ are suspended until the template is loaded.\n\nHaving to wait for a large number\
    \ of templates to asynchronously load via Ajax can really slow down a client-side\
    \ application. To prevent such a delay, it is possible to cache one or more HTML\
    \ templates prior to deploying an application. Caching is a better option in most\
    \ cases Angular will not make an Ajax request, providing better performance by\
    \ minimizing the number of requests run. For more information about caching, check\
    \ the in-depth discussion on caching here.\n\nAfter a template has been fetched,\
    \ Angular caches in the default $templateCache services. In production, we can\
    \ pre-cache these templates into a JavaScript file that defines our templates\
    \ we don't have to fetch the templates over XHR. For more information about how\
    \ this adjustment works, see the next steps chapter.\n\n# replace (boolean)\n\n\
    replace is optional. If provided, it must be set to true. It is set to false by\
    \ default. That means the directive's template will be appended as a child node\
    \ within the element where the directive was invoked:\n\n```\n<div>some-directive></div>\n\
    ```\n\n```\ndirective('someDirective' function() {\n  return {\n    template:\
    \ '<div>some stuff here</div>'\n  }\n});\n```\n\nThe result when the directive\
    \ is invoked will be (remember that this behavior is the default, when replace\
    \ is false):\n\n```\n<div some-directive>\n<div>some stuff here</div>\n</div>\n\
    ```\n\nIf we set replace as true:"
  merge: -1
  pgno: 120
