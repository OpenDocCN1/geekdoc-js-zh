- img_proc: true
  md: "```\n.get(\"https://api.github.com\")\n.success(function(data) {\n  // Data\n\
    });\n```\n\n# Non-Simple Requests\n\nNon-simple requests are those that violate\
    \ the requirements for the simple requests. If we want\nsupport PUT or DELETE\
    \ methods, or if we want to set the specific type of content type in our\nrequests,\
    \ then we're going to call a non-simple request.\n\nAlthough, as client-side developers,\
    \ this request doesn't look any different to us, the browser handles\nthe request\
    \ differently.\n\nThe browser actually sends two requests: the preflight and the\
    \ request. First, the browser issues\na preflight request where the server requests\
    \ permission to make the request. If the permissions\nhave been granted, then\
    \ the browser can make the actual request.\n\nThe browser takes care of handling\
    \ the CORS request transparently.\n\nSimilar to the simple request, the browser\
    \ will add the Origin header to both of the requests\n(preflight and the actual\
    \ request).\n\n# Preflight Request\n\nThe browser makes the preflight request\
    \ as an OPTIONS request. It contains a few headers in the\nrequest:\n\n+   - Access-Control-Request-Method\n\
    \nThis header is the HTTP method of the actual request. It is always included\
    \ in the request.\n\n+   - Access-Control-Request-Headers (optional)\n\nThis header\
    \ is a comma-delimited list of non-simple headers that are included in the request.\n\
    The server should accept the request, then we must check if the HTTP method and\
    \ the headers are\nvalid. If they are, the server should respond with the following\
    \ headers:\n\n+   - Access-Control-Allow-Origin\n\nThe value of this header Must\
    \ either echo the origin request header or be a * to allow any and all\nrequests\
    \ from any origin."
  merge: -1
  pgno: 226
- img_proc: true
  md: "+   - Access-Control-Allow-Methods\n\nThis list of allowed HTTP methods is\
    \ helpful, as we cache the request in the client, and we don't have to constantly\
    \ ask for preflights in future requests.\n\n+   - Access-Control-Allow-Headers\n\
    \nIf the Access-Control-Request-Headers header is set, then the server should\
    \ respond with this header.\n\nWe expect the server to respond with a 200 response\
    \ status code if the request is acceptable. If it is, then the second request\
    \ will be.\n\n> CORS is not a security mechanism; it is simply a standard that\
    \ modern browsers implement. It's still our responsibility to set up security\
    \ in our app.\n\nNon-simple requests look exactly like regular requests inside\
    \ Angular:\n\n```\n$delete(\"https://api.github.com/api/users/1\")\n.success(function(data)\
    \ {\n  // Data\n});\n```\n\n# # Server-Side Proxies\n\nThe simplest method for\
    \ making requests to any server, however, is to use a back-end server on the same\
    \ domain (or a remote server with CORS setup) as a proxy for remote resources.\n\
    \nRather than making requests to foreign resources through our client-side-app,\
    \ we can simply use our own local server to make and respond to requests for our\
    \ client-side-app.\n\nIn this way, we enable browsers to make requests (only modern\
    \ browsers implement CORS), without requiring a second request for non-simple\
    \ CORS requests, and can use standard browser-level security as it was intended\
    \ to be.\n\nIn order to use a server-side proxy, we need to set up a local server\
    \ to handle our requests, which takes care of sending the actual requests.\n\n\
    For more information about setting up a server-side component, read the Server\
    \ communication chapter."
