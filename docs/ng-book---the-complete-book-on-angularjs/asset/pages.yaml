  md: "Next Steps\n\n594\n\n# # Packaging Our Templates\n\nOne method that we can\
    \ use to make our apps appear incredibly fast and not depend upon servers\nto\
    \ deliver our templates is to turn our template files into a JavaScript file.\n\
    \nUsing the Angular templateCache, we'll include the templates in a JavaScript\
    \ file. For instance,\ninstead of telling Angular to fetch the HTML using XHR\
    \ as HTML:\n\n```\n<div class=\"hero-unit\">\n  <h1>!Allo, !Allo!</h1>\n  <p>You\
    \ now have</p>\n  <ul>\n    <li ng-repeat=\"thing in awesomeThings\">{{thing}}</li>\n\
    \  </ul>\n  <p>installed.</p>\n  <h3>Enjoy coding! - Yeoman</h3>\n</div>\n```\n\
    \nWe can package them up into a JavaScript file and let the JavaScript stand alone,\
    \ like so:\n\n```\nangular.module('MyApp')\n.run([$templateCache], function($templateCache)\
    \ {\n  $templateCache.put('views/main.html',\n\" +\n    \"<div class=\"hero-unit\"\
    >\\n\" +\n    \"  <h1>!Allo, !Allo!</h1>\\n\" +\n    \"  <p>You now have</p>\\\
    n\" +\n    \"  <ul>\\n\" +\n    \"    <li ng-repeat=\\\"thing in awesomeThings\\\
    \">{{thing}}</li>\\n\" +\n    \"  </ul>\\n\" +\n    \"  <p>installed.</p>\\n\"\
    \ +\n    \"  <h3>Enjoy coding! - Yeoman</h3>\\n\" +\n    \"</div>\\n\" +\n  });\n\
    }]);\n```\n\nTo set this up, we need to modify our Gruntfile.js to include a new\
    \ task definition using a\nnpm package grunt-angular-templates.\n\nFirst, we install\
    \ the package:\n\n```\n$ npm install --save-dev grunt-angular-templates\n```\n\
    \nNext, we will modify our Gruntfile.js to include the ngtemplates task."
  merge: -1
