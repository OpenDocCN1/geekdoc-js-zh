    {{ today | date:''hh:mm:ss.sss'' }} <-- 12:09:02.995 --

    ```


    # filter


    The filter method selects a subset of items from an array of items and returns
    a new array. The filter is generally used as a way to filter out items for display.
    For instance, using client-side searching, we can filter out items from an array
    immediately.

    The filter method takes a string, object, or function that it will run to select
    or reject array elements.

    If the first parameter passed in is a:


    # string


    It will accept all elements that match against the string. If we want all the
    elements that do not match the string, we can prepend a ! to the string.'
