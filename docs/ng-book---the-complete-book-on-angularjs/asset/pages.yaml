  md: '# Demystifying Angular


    At their core, AngularJS web apps load in the browser the same way that non-AngularJS
    apps do; however, they do run slightly differently. The browser loads the AngularJS
    library as it is building the DOM (as it ordinarily loads any JavaScript libraries).


    When the ng-app fires the DOMContentLoaded event, Angular goes to work. It starts
    by looking for the ng-app directive (for more information on the ng-app directive,
    see the Directives chapter).


    > AngularJS also starts initializing the angular.js script is loaded if the document.readyState
    is set to complete. This fact is useful if we want to dynamically link the AngularJS
    script.


    If the browser finds the ng-app directive in the DOM, the app is automatically
    bootstrapped for you. If it doesn''t find the directive, Angular expects to bootstrap
    the app.


    To manually bootstrap an AngularJS app, we can use the Angular bootstrap(). It
    makes sense to manually bootstrap an application in some relatively rare cases.
    For instance, let''s say we want to run an AngularJS app after some other library
    code runs or we are dynamically creating an element on the fly.


    To manually bootstrap an app, we can bootstrap it, like so:


    ```

    var newElement = document.createElement("div");\angularangularbootstrap(newElement,
    [''MyApp'']);

    ```


    > If there is no ng-app directive found in the DOM and we have manually bootstrapped
    our app, AngularJS does not run. Forgetting ng-app can definitely cause some serious
    issues.


    If no application is specified in the ng-app attribute, Angular loads the app
    without a specific module. If one is specified, Angular loads the module associated
    with the directive.


    Using ng-app without specifying a module:


    ```

    <html ng-app>

    </html>

    ```


    Using ng-app with a specified module:'
