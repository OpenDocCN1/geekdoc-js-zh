    .config(function($urlProvider) {\n  $urlProvider.otherwise('/');\n  // or\n$urlProvider.otherwise(\n\
    \  function($injector, $location) {\n    $location.path('/');\n  });\n});\n```\n\
    \nrule() If we want to bypass any of the URL matching or want to do some route\
