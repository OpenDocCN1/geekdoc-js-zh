  md: "# Testing\n\nNotice that we're excluding our main.js file, the application\
    \ file that starts the application.\n\nSince Karma serves files under the app/js\
    \ directory, we're configuring Karma's file server with a starting context for\
    \ modules that load with a relative path. Since we want the baseUrl for our tests\
    \ to be in the same folder as our source files, we will configure the basePath\
    \ to the local directory (.).\n\n# test/test-main.js\n\nOur test-main.js file\
    \ will operate as a substitute for our main application file, providing us with\
    \ the ability to refer our tests without actually kicking off our app.\n\nKarma\
    \ will include all the files in the array window. __karma__.files, so we will\
    \ find our test files from here. After we've found tests, we configure RequireJS\
    \ like normal:\n\n```\nvar tests = [];\nfor (var file in window.__karma__.files)\
    \ {\n  if (window.__karma__.files.hasOwnProperty(file)) {\n    if (/Spec\\.$js$/.test(file))\
    \ {\n      tests.push(file);\n    }\n  }\n}\n\nrequirejs.config({\n  baseUrl:\
    \ 'app',\n  paths: {\n    'jquery': 'lib/jquery',\n    'angular': 'lib/angular',\n\
    \    'angularRoute': 'lib/angular-route',\n    'angularMocks': 'lib/angular-mocks',\n\
    \  },\n  shim: {\n    'underscore': {\n      exports: '_'\n    }\n  }\n});\n\n\
    // ask Require.js to load these files (all our tests)\ndeps: tests,\n// start\
    \ test run, once Require.js is defined\ncallback: window.__karma__.start);\n```\n\
    \nOur tests will look a bit different from those that do not use AngularJS by\
    \ default. We can simply use AngularJS like normal and wrap our tests in define().\
    \ For example:"
