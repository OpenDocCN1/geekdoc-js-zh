  md: "# Optimizing Angular Apps\n\n```\napp.factory('poller', function($rootScope,\
    \ $http) {\n  var pollEvent = function(timeout) {\n    $http.get('/events'\n \
    \     .success(function(data) {\n        var events = data.events;\n        for\
    \ (var i = 0; i < events.length; i++) {\n          var event = events[i];\n  \
    \        if (service.handlers[event]) {\n          for (handler in service.handlers[event])\
    \ {\n            $rootScope.$apply(function() {\n              handler.apply(event);\n\
    \            });\n          }}\n        }\n      });\n    // Set the next timeout\n\
    \    setTimeout(pollEvent, timeout);\n  });\n});\n// poll every half-second\n\
    setTimeout(function() { pollEvents(500); });\nvar service = {\n  handlers: {\n\
    \    on: function(evt, callback) {\n      if (!service.handlers[evt])\n      \
    \  service.handlers[evt] = [];\n\n      service.handlers[evt].push(callback);\n\
    \    }}\n  }\nreturn service;\n}\n```\n\nThe main issue with this code is that\
    \ we'll end running the $rootScope.$apply() method for every single event that\
    \ fires, which can add up to many $digest loops per second.\n\nLimiting the number\
    \ of $digest loops per second is a great way to start upgrading the performance\
    \ of our app. We can throttle the events to happen only at a maximum of times\
    \ we want per second."
