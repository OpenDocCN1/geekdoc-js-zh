  md: "```\n<div ng-controller=\"FirstController\">\n<h4>The simplest adding machine</h4>\n\
    <button ng-click=\"add(1)\" class=\"button\">Add</button>\n<a ng-click=\"subtract(1)\"\
    \ class=\"button alert\">Subtract</a>\n<h4>Current count: {{ counter }}</h4>\n\
    </div>\n```\n\nBoth the button and the link are bound to an action on the containing\
