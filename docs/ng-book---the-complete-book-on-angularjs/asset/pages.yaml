  md: 'Introduction to Directives


    ```

    <a href="http://google.com">

    Click me to go to Google</a>

    ```


    The &lt;a&gt; tag defines a link between another page on our site or off our site,
    depending on the contents of the href attribute, which defines the link''s destination.


    It is noticeably different from the following HTML element, the button:


    ```

    <button href="http://google.com">

    type="submit">Click me</button>

    ```


    The link tag is, by default, underlined and blue, while the button, by default,
    looks like a clickable button in our browser.


    The link knows that, when provided an href attribute that points to http://google.com,
    it should change the URL in the address bar and load Google''s home page when
    a user clicks on the link.


    The button, on the other hand, is completely oblivious when provided an href attribute
    and does not perform the same behavior (the attribute is ignored).


    Thus, changing the URL in the address bar and bringing you to a new page is part
    of a link''s pre-programmed behavior, but not part of a button''s pre-programmed
    behavior.


    Finally, both tags perform the same behavior when a title is provided: They provide
    a tooltip to the user over hover.


    ```

    <a href="http://google.com">

    title="click me">

    Click me to go to Google

    </a>

    <button type="submit">

    title="click me">Click me</button>

    ```


    In summary, the web browsers render our HTML elements'' style and behavior; this
    capability is one of the fundamental strengths of the web.


    Each vendor, whether it be Google or Microsoft, tries to adhere to the same HTML
    spec, therefore making programming for the web consistent across devices and operating
    systems.


    > Versions of Internet Explorer have not complied with the common HTML spec, so
    we need to perform some tricks to get older versions of IE to work. See the Internet
    Explorer chapter for more details.


    Recently, new HTML tags have begun to emerge. These are a part of the HTML5 spec.
    For example, the video tag, which specifies a video, movie clip, or streaming
    video:'
