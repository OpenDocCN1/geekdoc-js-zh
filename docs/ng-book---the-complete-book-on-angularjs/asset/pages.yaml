  md: "# manifest.json\n\nWith every Chrome app we write, we need to set up a manifest.json.\
    \ This manifest tells Chrome how the application should run, what files it should\
    \ use, what permissions it has, etc.\nOur manifest.json needs describe our app\
    \ as a newtab app and describe the content_security_-policy (the policies that\
    \ describe what our application can and cannot do) and the background script Chrome\
    \ needs.\n\n```\n{\n  \"manifest_version\": 2,\n  \"name\": \"Presently\",\n \
    \ \"description\": \"A currently clone\",\n  \"version\": \"0.1\",\n  \"permissions\"\
    : [],\n  \"background\": {\n    \"scripts\": [\"js/vendor/angular.min.js\"]\n\
    \  },\n  \"content_security_policy\": \"script-src 'self'; object-src 'self',\\\
    n  \"chrome_url_overrides\": {\n    \"newtab\": \"tab.html\"\n  }\n}\n```\n\n\
    The keys in the manifest.json are relatively straightforward and allows us to\
    \ set the name, the manifest_version, the version, etc. In order to tell Chrome\
    \ to launch our app as a newtab app, we set the app to override the newtab page.\n\
    \n# tab.html\n\nThe main HTML file for our application is the tab.html file. This\
    \ file loads when we open a new tab in Chrome.\n\nWe'll set up the basic Angular\
    \ app inside of the tab.html:"
