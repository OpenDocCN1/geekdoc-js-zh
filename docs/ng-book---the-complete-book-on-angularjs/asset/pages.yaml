  md: "# Introduction to Directives\n\n![](img/c29f4deabfb2aac07907f28672b2ed83_76_0.png)\n\
    \nBy default, Angular nests the HTML provided by our template string inside of\
    \ our custom HTML `<my-directive>` tag, in the generated source code.\n\nLet's\
    \ add one more option to our directive definition: We can remove our custom element\
    \ (`<my-directive>`) from the generated DOM completely and output only the link\
    \ we are providing to the template option. To do so, we set the replace option\
    \ to true:\n\n```\nangular.module('myApp', [])\n.directive('myDirective', function()\
    \ {\n  return {\n    restrict: 'E',\n    replace: true,\n    template: '<a href=\"\
    http://google.com\">Click me to go to Google</a>'\n  }\n}\n)\n```\n\nLook at the\
    \ generated source again. We can see that we no longer have the original call\
    \ to the directive, but only the source that we set as the template. This *replace*\
    \ method replaces the custom element instead of wrapping it in our directive call."
