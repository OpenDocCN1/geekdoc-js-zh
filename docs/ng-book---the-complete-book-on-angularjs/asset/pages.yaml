    # Setting Expectations


    To actually verify that our application does the work we expect it to act, we''ll
    need to set up expectations that assert a certain state. We can do this with a
    combination of the E2E and scenario APIs.


    Using expect(), we assert that the value of a given future object matches the
    matcher. Anything given back by the scenario API is a future object that the scenario
    runner will resolve, and we''re validating the eventual result will in what is
    expected.


    ```

    expect(browser().location().path())

    .toBe(''/'')

    // Or negate the expectation with not()

    expect(browser().location().path())

    .not().toBe(''/home'')

    ```


