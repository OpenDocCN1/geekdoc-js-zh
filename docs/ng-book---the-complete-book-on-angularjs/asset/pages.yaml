- img_proc: true
  md: "# Staggering CSS animations\n\nCSS animations are also supported and follow\
    \ the exact naming CSS convention as mentioned above for CSS transitions. The\
    \ only difference is that instead of using transition-delay, animation-delay is\
    \ used instead (for obvious reasons). Here's what the . fade-in class would look\
    \ like if CSS animations were used for the stagger effect.\n\n```\n.fade-in.ng-enter-stagger\
    \ {\n  -webkit-animation-delay:200ms;\n  animation-delay:200ms;\n\n  /* css stagger\
    \ animations also needs to be here */\n  -webkit-animation-duration:0;\n  animation-duration:0;\n\
    }\n```\n\nSince the CSS keyframe animation does not take place until a reflow\
    \ occurs (when the browser repaints the screen) there may be a slight flicker\
    \ or the element itself may not be animated briefly until the stagger kicks in.\
    \ This is because the from 0% animation hasn't started yet since the keyframe\
    \ animation hasn't triggered. To work around this, additional CSS styling being\
    \ placed in the CSS class where the keyframe animation is assigned.\n\n```\n.fade-in.ng-enter\
    \ {\n  /* pre-reflow styling */\n  opacity:0;\n\n  -webkit-animation: 2s firstAnimation;\n\
    \  animation: 2s firstAnimation;\n}\n```\n\n```\n.fade-in.ng-enter-stagger { ...\
    \ }\n\n@keyframes firstAnimation { ... }\n@-webkit-keyframes firstAnimation {\
    \ ... }\n```\n\n# What directives support staggering animations?\n\nSimple. All\
    \ of them do, they're only available when two or more of the same animation event,\
    \ within the same parent container, are triggered at the same time. When 10 items\
    \ are inserted into a ngRepeat list then a stagger effect occurs. This means if\
    \ ngClass is placed on a ngRepeat element and the ngClass value changes for each\
    \ item within the list then a stagger effect occurs is rendered for the class-changing\
    \ animation."
