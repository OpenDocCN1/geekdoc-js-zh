  md: "# Scope Option (boolean | object)\n\nscope is optional. It can be set to true\
    \ or to an object, {}. By default, it is set to false.\n\nWhen scope is set to\
    \ true, a new scope is created that prototypically inherits from its parent scope.\n\
    \nIf multiple directives on an element provide an isolate scope, only one new\
    \ scope is applied. Root elements within the template of a directive always gets\
    \ a new scope; thus, for those objects, scope is set to true by default.\n\nThe\
    \ built-in ng-controller directive exists for the sole purpose of creating a child\
    \ scope that prototypically inherits from the surrounding scope. It creates a\
    \ new scope that inherits from the surrounding scope.\n\nLet's amend our example,\
    \ with this knowledge in hand:\n\n```\n<div ng-app=\"App\">\nng-init=\"someProperty\
    \ = 'some data'\"></div>\n<div ng-init=\"siblingProperty = 'more data'>\nInside\
    \ Div Two: {{aThirdProperty}}\n<div ng-init=\"aThirdProperty = 'data for 3rd property'\\\
    nng-controller=\"SomeController\">\nInside Div Three: {{aThirdProperty}}\n<div\
    \ ng-init=\"aFourthProperty\">\nInside Div Four: {{aThirdProperty}}\n</div>\n\
    </div>\n</div>\n</div>\n```\n\nIf we run the previous code by itself, it fails.\
    \ This failure occurs because we haven't defined an associated controller in your\
    \ JavaScript, so let's do that:\n\n```\nangular.module('MyApp', []);\n.controller('SomeController',\
    \ function($scope) {\n  // we can leave it empty, it just needs to be defined\n\
    })\n```\n\nIf we reload the page, we can see that inside the second div, {{aThirdProperty}}\
    \ is undefined and therefore outputs nothing. The third div, however, the value\
    \ we set inside our inherited scope data for a 3rd property is shown."
  merge: -1
  pgno: 122
