  md: '# Testing


    The AngularJS framework encourages writing clean, solid, testable code. This feature
    is one of the most useful that you get out of the box with Angular.


    The Angular team''s emphasis on testing is so strong that they built a test runner
    to make the process easier. In their words:


    +   JavaScript is a dynamically typed language which comes with great power of
    expression, but it also comes with almost no help from the compiler. For this
    reason we feel very strongly that JavaScript needs to come with a strong set of
    tests. We have built many features into Angular which makes testing your Angular
    applications easy. There is no excuse for not testing.


    # Why Test?


    When building any non-trivial application for any business purpose beyond prototyping
    (and even then), it''s important to be confident about our code. When we have
    tests backing up our codebase, we can discretely know whether or not our code
    is working as intended.


    Bugs in code are inevitable, and without tests it''s difficult to know where they
    are; tests make it easy to isolate and eliminate them. They make it easy to onboard
    other developers and provide working documentation about the code.


    Testing is essential if we are to understand what is happening in our app.


    # Testing Strategies


    When building a testing suite to develop Angular apps, it''s always good to have
    a strategy for how we are going to test in our app. If we end up testing anything
    of substance and write meaningless tests, we''ll have gained nothing to give us
    confidence our apps are functioning properly. Conversely, if we test everything
    we can think of, we''ll end spending more time writing tests and fixing minor
    bugs in our code than we will on our app.


    It''s important to be realistic about the value we get out of the tests we do
    and about what we should be testing.


    At the end of the day, our tests are both a tool for us to gauge the health of
    our app and a measuring stick to tell us if we''ve broken our code when introducing
    new functionality.'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Getting Started Testing


    One of the major hurdles in getting started with testing is setting up a test
    runner that runs tests on our code. JavaScript testing is also a bit more difficult,
    because it requires us to build automation to browsers.


    Building a development testing suite is difficult enough, but what about supporting
    continuous integration so that new deployments can be automated and we can be
    confident about the quality of the code before making a new one?


    In software engineering, continuous integration is the practice of merging development
    copies of a shared mainline several times a day and running the test suite upon
    update.


    Karma* is a testing tool that was built from the ground to remove the burden of
    setting up testing and allow us to focus on building our core application logic.


    Karma spawns a browser instance (or multiple browser instances) and runs the tests
    against the different browser instances to see if the tests pass under different
    browser environments. Karma communicates with the browsers through socket.io,
    which enables Karma to keep in contact. Thomas, Karma provides real-time feedback
    about what tests are running and gives us a human-readable output that tells us
    which tests pass and which ones fail or time out.


    Karma is capable of communicating with different browsers natively and removes
    the need for us to manually test our code in different browsers. For example,
    it can run the tests in Chrome, IE, and Firefox and spit out the results to your
    console. We can even hook up to our own native devices (like, an iPhone or iPad)
    to test our code.


    # Types of AngularJS Tests


    There are several ways to test our Angular apps, depending upon what level of
    granularity we want to focus on and what features we want to target.


    # Unit Testing


    We can focus on building our tests to isolate specific, isolated components of
    our code. This approach is called "unit testing", where we test specific units
    of code for all sorts of different input at different stages and under different
    conditions.


    Unit testing is specifically for small, individual units of code, single functions,
    or small and contained function interactions. It is not about testing large feature
    sets.


    The tricky part about unit testing is setting up the isolation of one piece of
    logic so that we can test it. We''ll discuss strategies of accomplishing this
    isolation later in this chapter.


    > http://karma-runner.github.io/0.10/index.html'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# When Is Unit Testing the Right Choice?


    When we''re writing our functional code, we''re going to create little components
    of functionality. For instance, in building an application that handles live filtering
    elements in a list, we''re going to build the filtering functionality.


    The feature of this filter is a ''unit'' of functionality that is an ideal case
    where we''ll want to test with a unit test. To be confident that this filter functionality
    has been implemented and is working as expected, we''ll need to isolate the component
    and test it for different inputs.


    > Imagine we''re building a rocket ship. We''ll want to test each individual part
    of the ship (e.g., the thrusters, the joystick controls, the oxygen system) to
    verify the ship is generally working how we expect it to work.


    # E2E Testing


    On the other hand, we can black-box test (i.e., perform an end-to-end test) on
    our application. In an end-to-end (or E2E) test, we test the application from
    the point of view where we are an end user and know nothing about the underlying
    components of the system. This method is great for testing large features of the
    application.


    E2E testing works well for testing user interaction with the page without forcing
    us to refresh the page manually and test with the browser.


    This kind of testing is nothing new, and there are great tools that enable us
    to use automated browser testing. We can use tools like PhantomJS or CasperJS
    for headless browser testing (i.e., without opening a browser) or tools like Karma
    that will open a real browser and perform all the tests in an iframe.


    # When Is End-to-End Testing the Right Choice?


    When we''re writing tests of use-case functionality, it''s always a good idea
    to write a test to walk the path of our user. End-to-end testing is great because
    it maps out the real experiences of our users when we use our application.


    For instance, when building a user login flow, we test that the user is logged
    in and redirected to it or her homepage. We don''t worry about how the user is
    logged in, just that they are logged in and directed to the proper place.


    > Imagine you''re building a rocket ship. End-to-end testing doesn''t care about
    the engines or the landing gear, it cares that the rocket takes off and flies
    your astronauts to space.


    Both unit testing and E2E testing are supported out of the box with the Karma
    test runner.'
  merge: -1
  pgno: 308
- img_proc: true
  md: 'Note that writing unit tests instead of E2E tests will allow our tests to run
    extremely quickly.

    Setting our tests to run synchronously and using mocking libraries will greatly
    speed up our testing, as well.


    # Getting Started


    In order to run our tests, we''ll need to install the Karma test runner. At this
    point in the book, we likely already have Node.js* and npm available to you; if
    you don''t, make sure you install them.

    Once you do, we''ll use the npm command to install the Karma tool:


    ```

    $ npm install -g karma

    ```


    To install npm, we''ll save our dependencies in the package.json file that lists
    our dependencies. To set up package.json with npm installed, simply run npm init
    and walk through the wizard.


    To start testing our application, we''ll need to set up a reasonable structure
    for both our application

    code and our test code.


    We recommend storing application files in the following format:


    +   app/

    index.html

    js/

    app.js

    controllers.js

