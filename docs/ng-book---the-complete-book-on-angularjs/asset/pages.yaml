  md: "# Optimizing Angular Apps\n\n```\n.directive('myDirective', function($q) {\n\
    return {\n  // ...\n  scope: {\n    name: '='\n  },\n  link: function(scope, ele,\
    \ attrs, ctrl) {\n    var unWatch =\n    scope.$watch(attrs.name, function(n,\
    \ o) {\n      if (n != o) {\n        // Do something with the resolution of\n\
    \        unWatch();\n        // name and remove the watch\n      }\n    });\n\
    \  }\n}\n});\n```\n\nWe can gain in performance by removing any and all of the\
    \ unnecessary watches in our application. This process can be particularly useful\
    \ when trying to remove every watch from our application, especially when we're\
    \ trying to remove the default watches that Angular sets up.\n\nWe can write our\
    \ own directives to manage watches instead of working with the built-in directives\
    \ that Angular provides. Frankly, we don't have to write these directives for\
    \ ourselves as they've already been written for us in a library called bindonce.\n\
    \n# Bindonce\n\nBindonce is a drop-in module we can use in our apps that contain\
    \ directives to hang on a watch once and only once; it gives us the ability to\
    \ pass in asynchronous data.\n\nThe library works by creating new directives that\
    \ we attach to DOM elements where we don't require updating. These directives\
    \ watch for the value to be filled and validated. Once the data is available,\
    \ it renders its contents, as well as its children's contents, and promptly removes\
    \ the watcher.\n\nUsing the bindonce directive creates a single temporary watcher\
    \ that is removed after the data becomes available. If the data is already available\
    \ on the scope, then the watcher is not created and the children are rendered.\n\
    \nRecall our previous example. We'll create the same example with zero permanent\
    \ watchers, using bindonce:"
  merge: -1
