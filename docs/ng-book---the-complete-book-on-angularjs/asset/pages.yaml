- img_proc: true
  md: '# Automatically Added Classes


    The directives that the enter event receive a class of .ng-enter when the DOM
    is updated. Angular adds the ng-enter-active class, which triggers the animation.
    ngAnimate automatically detects the CSS code to determine when the animation is
    complete.


    When the event leave, Angular removes both classes from the DOM element, enabling
    us to define animatable properties to the DOM elements.


    If the browser does not support CSS transitions or animations, then the animation
    will start and end immediately, and the DOM will end up in its final state with
    no CSS transitions or animation classes applied.


    The same convention applies for all of the supported structural animation events:
    enter, leave and move. The class-based animation events have a slightly different
    form (as mentioned above).


    # Using CSS3 Transitions


    Using CSS3 transitions is by the easiest way to include animations in our app,
    and it works for all browsers except IE9 and earlier versions.


    Browsers that do not support CSS3 transitions gracefully fall back to the non-animated
    version of the app.


    To do any CSS animation, we need to make sure we include the classes we''ll be
    working with to the DOM element we''re interested in animating.


    For instance, in the following demo, we''ll look at animating this element:


    ```

    <div class="fade-in"></div>

    ```


    CSS3 transitions are fully-based, which means that as long as we have classes
    that define the animation in our HTML, the animation will be animated in the browser.


    In order for us to achieve animations with classes, we need to following the Angular
    CSS naming conventions to define our CSS transitions.


    CSS transitions are effects that let an element gradually change from one style
    to another style. To define an animation, we must specify the property we want
    to add an animation as well as specify the duration of effect.


    For instance, this code adds a transition effect on the all of the properties
    on DOM elements with the .fade-in class for a two-second duration.'
