  md: "# Directives Explained\n\nThe main use case for directives is reusable widgets\
    \ that can be shared and used in unexpected contexts without polluting the scope\
    \ around them or having their internal scope corrupted inadvertently.\n\nTo create\
    \ a directive with isolate scope we need to set the scope property of the directive\
    \ to an empty object, {}. Once we do that, no outer scope is available in the\
    \ template of the directive:\n\n```\n<div ng-controller='MainController\">\nOutside\
    \ myDirective: {{ myProperty }}\n<div my-directive ng-init=\"wow, this is cool\"\
    >\nInside myDirective: {{ myProperty }}\n</div>\n</div>\n```\n\n```\nangular.module('myApp',\
    \ [])\n.controller('MainController', function($scope) {\n.directive('myDirective',\
    \ function() {\n  return {\n  restrict: 'A',\n  scope: {}\n  template: '<div>Inside\
    \ myDirective {{ myProperty }}</div>'\n}}\\}});\n```\n\n# Live JS Bin²\n\nA look\
    \ at the JS Bin reveals that it seems almost identical to setting scope to true.\
    \ We can see a difference by making another directive with inherited scope and\
    \ comparing the two:\n\n```\n<div ng-init=\"myProperty = 'wow, this is cool\"\
    ></div>\nSurrounding scope: {{ myProperty }}\n<div my-inherit-scope-directive=\"\
    SomeController\">\nInside an directive with inherited scope: {{ myProperty }}\n\
    </div>\n<div my-directive>\nInside myDirective, isolate scope: {{ myProperty }}\n\
    </div>\n```\n\nThe JavaScript code:\n\n> ²http://jsbin.com/eguDEPa/1/edit"
  merge: -1
