  md: '# Template (string| function)


    template is optional. If provided, it must be set to either:


    +   - a string of HTML

    - a function that takes two arguments - tElement and tAttrs and returns a string
    value representing the template. The t in element and tAttrs stands for template,
    as opposed to instance. We''ll discuss the difference between a template element/attribute
    and an instance element/attribute when we cover the link compile options.


    Angular treats the template string no differently than any other HTML. It has
    a scope that is accessed using double curly markup, {{ expression }}.


    When a template string contains more than one DOM element or only a single text
    node, it must be wrapped in a parent element. In other words, a root DOM element
    must exist:


    template: \


    ```

    <div>-- single root element --

    <a href="http://google.com">Click me</a>\

    <h1>When using two elements, wrap them in a parent element</h1>\

    </div>

    ```


    Furthermore, note the use of backslashes, at the end of each line. We include
    these so that Angular can parse multi-line strings. In production code, it would
    be a better choice to use the templateUrl option because multi-lines strings are
    a nightmare to look at and maintain.


    One of the most important features to understand a template string or templateURL
    is how it gets its scope. In the beginning_directives chapter, we touched upon
    how scope is passed into a directive.


    # templateUrl (string| function)


    templateUrl is optional. If provided, it must be set to either:


    +   - the path to an HTML file, as a string

    - a function that takes two arguments: tElement and tAttrs. The function must
    return the path to an HTML file as a string.


    In either case, the template URL is passed through the built-in security layer
    that Angular provides; specifically getTrustedResourceUrl, which protects our
    templates from being fetched from untrusted resources.


    By default, the HTML file will be requested on demand via Ajax when the directive
    is invoked. We should bear two important factors in mind:'
  merge: -1
