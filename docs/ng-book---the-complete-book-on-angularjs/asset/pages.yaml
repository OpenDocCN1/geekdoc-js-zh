  md: 'The Basics of AngularJS team


    # What Is AngularJS


    The official AngularJS introduction describes AngularJS as a:


    +   client-side technology, written entirely in JavaScript. It works with the
    long-established technologies of the web (HTML, CSS, and JavaScript) to make the
    development of web apps easier and faster than before.


    It is a framework that is primarily used to build single-page web applications.
    AngularJS makes it easy to develop, modern web applications by increasing the
    level of abstraction between the developer and common web development tasks.


    The AngularJS team describes it as a “structural framework for dynamic web apps."


    AngularJS makes it incredibly easy to build web applications; it also makes easy
    to build complex applications. AngularJS takes care of advanced features that
    users have become accustomed to modern web applications, such as:


    +   * Separation of application logic, data models, and views

    * Ajax services

    * Dependency injection

    * Browser history (makes bookmarking and back/forward buttons work like normal
    web apps)

    * Testing

    * And more


    # How Is It different?


    In other JavaScript frameworks, we are forced to extend from custom JavaScript
    objects and manipulate the DOM from the outside in. For instance, using jQuery¹,
    to add a button to the DOM, we''ll have to know where we''re putting the element
    and insert it in the appropriate place:


    ```

    var btn = $<$button>Hi!</button>;

    btn.on(''click'', function(evt) { console.log("Clicked button"); });

    $("#checkoutHolder").append(btn);

    ```


