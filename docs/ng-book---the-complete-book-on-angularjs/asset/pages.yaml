  md: 'Dependency Injection


    $ npm install -g ngmin


    > If we''re using Grunt, we can install the grunt-ngmin Grunt task. If we are
    using Rails, we can use the Ruby gem ngmin-rails.


    # # Using ngMin


    We can use ngMin in standalone mode at the CLI by passing two arguments: the input.js
    and the output.js files or via stdin/stdout, like so:


    ```

    $ ngmin input.js output.js

    # or

    $ ngmin < input.js > output.js

    ```


    where input.js is our source file and output.js is the annotated output file.


    # # How It Works


    At its core, ngMin uses an Abstract Syntax Tree (AST) as it walks through the
    JavaScript source. With the help of astral, an AST tooling framework, it rebuilds
    the source with the necessary annotations and then dumps the updated source using
    escodegen.


    ngmin expects Angular source code to consist of logical declarations. If our code
    uses syntax similar to the code used in this book, ngMin will be able to parse
    the source and pre-minify it.'
