    \ ele, attrs) {\n    // The link function\n  }\n}//\n```\n\nThe template instance\
    \ and link instance may be different objects if the template has been cloned.\
    \ Thus, we can only DOM transformations that are safe to do to all cloned DOM\
    \ nodes within the compile function. Don't do DOM listener registration: That\
    \ should be done in the linking function."
