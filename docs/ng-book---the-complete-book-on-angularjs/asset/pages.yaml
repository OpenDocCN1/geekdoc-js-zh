    # Auto-optimization of $watch Functions


    The latest version of Angular automatically removes $watch functions that it finds
    to be of a constant value (e.g., if the expression resolves to a boolean or a
    static integer).


    ```

    // watchers will be automatically removed

    // $watch as Angular detects these as

    // constant values

    $scope.$watch(''true'', function() {});

    $scope.$watch(''2 + 2'', function() {}));

    ```


    # Optimizing Filters


    Every filter that is placed in the view will be called a minimum of two times
    due to the nature of filters. The more we can keep these filters lightweight and
    optimized, the faster our applications will be.


    # Unchanging Data


    For this reason, it''s often a good idea to analyze where and why we are using
    a filter in the view view. Generally, a good rule of thumb is that any filter
    needs to be transformed for the view once can be moved out of the view.


    To say that, rather than using the currency filter in the view, we can transform
    the model when we retrieve the data. That way, we don''t display it in the view
    where it will run twice.

    That is to say instead of using the filter in the view, like so:


    ```

    <!-- Using a filter -->

    <div>{{ receipt.total_cost | currency }}</div>

    ```


    We can transform the receipt.total_cost in our controller (or service) instead
    by using the $filter service:'
