  md: "# Directives Explained\n\n```\nangular.module('myApp', [])\n.directive('myDirective',\
    \ function() {\n  return {\n    restrict: String,\n    priority: Number,\n   \
    \ terminal: Boolean,\n    template: String or Template Function:\n    function(tElement,\
    \ tAttrs) { ... },\n    templateUrl: String,\n    replace: Boolean or String,\n\
    \    scope: Boolean or Object,\n    transclude: Boolean,\n    controller: String\
    \ or\n    function(scope, element, attrs, transclude, otherInjectables) { ...\
    \ },\n    controllerAs: String,\n    require: String,\n    link: function(scope,\
    \ iElement, iAttrs) { ... },\n    compile: return function(tElement, tAttrs, transclude)\
    \ {\n      return {\n        pre: function(scope, iElement, iAttrs, controller)\
    \ { ... },\n        post: function(scope, iElement, iAttrs, controller) { ...\
    \ }\n      }\n      // or\n      return function postLink(...) { }\n    }\n  };\n\
    });\n```\n\n# Restrict (string)\n\nrestrict is an optional argument. It is responsible\
    \ for telling Angular in which format our directive will be declared in the DOM.\
    \ Default, Angular expects that we will declare a custom directive by an attribute,\
    \ making the restrict option set to A.\n\nThe available options are as follows:\n\
    \n+   * E (an element) [lang=\"html\"]\n* A (an attribute, default) [lang=\"html\"\
    ] <div my-directive=\"expression\"></div>\n* C (a class) [lang=\"html\"] <div\
    \ class=\"my-directive: expression;\"></div>\n* M (a comment) [lang=\"html\"]\
    \ <- directive: my-directive expression ->\n\nThese options can be used alone\
    \ or in combination:"
  merge: -1
  pgno: 116
- img_proc: true
  md: "# Directive Explained\n\n```\nangular.module('myDirective', function() {\n\
    \  return {\n    restrict: 'EA' // either an element or an attribute\n  };\n});\n\
    ```\n\nIn this case, we can declare the directive as an attribute or as element:\n\
    \n```\n-- as an attribute --\n<div my-directive></div>\n-- or an element --\n\
    <my-directive></my-directive>\n```\n\nAttributes are the default and most common\
    \ form of directive because they will work across all browsers, including older\
    \ versions of Internet Explorer, without having to register a new tag in the head\
    \ of the document. See the chapter on Internet Explorer for more information on\
    \ this topic.\n\n> Avoid using comments to declare a directive. This format was\
    \ originally introduced as a way to create multiple elements. This approach was\
    \ especially useful, for example, when ng-repeat inside a <table> element; however,\
    \ as Angular 1.2, ng-repeat provides ng-repeat-start and ng-repeat-end a better\
    \ solution to this problem, minimizing the need for the comment form of a directive\
    \ even more so. If you are curious, however, take a look at the Chrome developer\
    \ tools elements when using ng-repeat to see comments being used under the hood.\n\
    \n# Element or Attribute?\n\nUse an element when creating something on the page\
    \ that will encapsulate a self-contained piece of functionality. For example,\
    \ if we're creating a clock (and couldn't care about supporting old versions of\
    \ Internet Explorer) we'd make a clock directive and declare it in the DOM like\
    \ so:\n\n```\n<my-clock></my-clock>\n```\n\nDoing so tells users of our that we're\
    \ specifying a whole piece of our application. Our clock is not decorating or\
    \ augmenting a pre-existing clock; instead, it's declaring a whole unit. While\
    \ we could have used an attribute in this scenario (Angular doesn't care), we've\
    \ chosen to use an element because it clarifies our intent.\n\nUse an attribute\
    \ when decorating an existing element with data or behavior. Using our clock example,\
    \ let's pretend we're interested in an analog version of the clock:"
  merge: -1
  pgno: 117
- img_proc: true
  md: "```\n <my-clock clock-display=\"analog\"></my-clock>\n```\n\nThe choice usually\
    \ comes down to whether the directive being defined provides the core behavior\
    \ of a component on the page or will decorate or augment a core directive with\
    \ optional behavior, state, or anything else one might find while programming\
    \ in the wild (like analog output for a clock).\n\nThe guiding principle is that\
    \ the format of a directive tells a story about our applications and reveals the\
    \ intent of each piece, exemplary example that is easy to understand and share\
    \ with others.\n\nThe other distinction is important to make for a given directive\
    \ is whether it creates, inherits, or isolates itself from the scope of its containing\
    \ environment. This child-parent relationship plays another key role in the composition\
    \ and reusability of our directives, a topic we will spend more time discussing\
    \ about the scope of a directive.\n\n# Priority (number)\n\nThe option can be\
    \ set to a number. Most directives omit this option, in which case it defaults\
    \ to 0; however, there are cases where setting a high priority is important and/or\
    \ necessary. example, ngRepeat sets this option at 1000 that it always gets invoked\
    \ before other directives on the same element.\n\nIf an element is decorated with\
    \ two directives that have the same priority, the first directive declared on\
    \ the element will be invoked. If one of the directives has a higher priority\
    \ than the other, then it doesn't matter which is declared first: The one with\
    \ the higher priority will always run.\n\n> ngRepeat has the highest priority\
    \ of any built-in directive. It is always invoked before other directives on the\
    \ same element. Performance is a key factor here. We will learn more about performance\
    \ when we discuss the compile option.\n\n# Terminal (boolean)\n\nterminal is a\
    \ boolean option; it can be set to true or false.\n\nWe use the terminal option\
    \ to tell Angular to stopping any further directives on an element that have a\
    \ higher priority. All directives with the same priority will be executed, however.\n\
    \nAs a result, don't further decorate an element if it's already been decorated\
    \ with a directive that is terminal and has equal or higher priority – it won't\
    \ be invoked."
