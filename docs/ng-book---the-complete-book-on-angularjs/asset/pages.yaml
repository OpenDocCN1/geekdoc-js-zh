  md: "# Introduction to Directives\n\n```\n<html> ng-app=\"myApp\">\n<!-- $rootScope\
    \ of our application --\n</html>\n```\n\nInside of our <html> element, we can\
    \ now use any of the built-in or custom directives we want. Furthermore, all of\
    \ the directives we use within this root element will have access to $rootScope\
    \ as a result of the prototypical inheritance in a JavaScript code if the method\
    \ of the directive has access to scope. Access to scope, in this case, means that\
    \ scope has been linked to the DOM, which is done late in the directive lifecycle.\n\
    \nBecause the life cycle of a directive is sufficiently complex, it warrants its\
    \ own section. In that section, we'll also discuss which methods within a directive\
    \ have access to scope and how scope is shared between one directive and the next.\
    \ See the directives explained chapter for more information.\n\n# Our First Directive\n\
    \nThe quickest way to get your feet wet is to just dive in. Let's go ahead and\
    \ create a very basic custom directive. Consider the following HTML element, which\
    \ we'll define in a moment:\n\n```\n<my-directive></my-directive>\n```\n\nProvided\
    \ we've created an HTML document and included Angular as well as the ng-app directive\
    \ in the DOM to mark the root of our app, when Angular compiles HTML, it will\
    \ invoke directive.\n\n> We'll learn more about the compile stage of the directive\
    \ lifecycle in understanding compile.\n\nInvoking a directive means to run the\
    \ associated JavaScript that sits behind our directive, which we define using\
    \ a directive definition.\n\nThe myDirective definition looks like:\n\n```\nangular.module('myApp',\
    \ [])\n.directive('myDirective', function() {\n  return {\n    restrict: 'E',\n\
    \    template: '<a href=\"http://google.com\">\nClick me to go to Google</a>'\\\
    n  }\n});\n```"
