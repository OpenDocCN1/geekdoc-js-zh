    \ to inject $sce\n\n```\nangular.module('MyApp', [])\n  .directive('myDirective',\
    \ ['$sce',\n    function($sce) {\n    // We access to the $sce service\n  })\n\
    \  .controller('MyController', [\n    '$scope', '$sce',\n    function($scope,\
    \ $sce) {\n    // We access to the $sce service\n  }]);\n```\n\nInside our directive\
    \ and our controller, we want to give Angular the ability to allow trusted content\
    \ back into the view and take trusted interpolation.\n\nThe $sce service has a\
    \ simple API that gives us the ability to both set and get content of explicitly\
    \ specific types.\n\nFor instance, let's bind a body of text to an email preview.\
    \ This client will allow users to write HTML in their email; we want to give them\
