- img_proc: true
  md: '# Demystifying Angular


    ```

    <span my-directive></span>

    <span class="my-directive"></span>

    <my-directive></my-directive>

    <!-- directive: my-directive -->

    ```


    For in-depth directive coverage, check out the directives chapter.


    The $compile service walks the DOM tree for DOM elements with directives declared
    on them. When it encounters one or more directives, it orders the directives (based
    upon their priority), then uses the $injector service to find and collect the
    directive''s $compile function and execute it.


    The compile function is in the appropriate time to do any DOM transformations
    or inline templating, it creates a clone of the template.


    ```

    // Returns a linking function

    var linkFunction = $compile(appElement);

    // Calls the linking function, attaching

    // the $rootScope to the domElement

    linkFunction($rootScope);

    ```


    After the compile method runs, the $compile service calls the linking functions.
    The linking functions set up watches on the directives that are bound to the enclosing
    scopes. This action creates the live-view.


    Finally, after the $compile service is complete, the AngularJS run time is ready
    to go.


    # Run time


    In a normal browser, the event loop waits for events (like the mouse moving, clicking,
    a keypress, etc). As these events occur, they are placed on the browser''s event
    queue. If any function handlers are set to react to the event, they are called
    with the event as a parameter.


    ```

    ele.addEventListener(''click'', function(event) {});

    ```


    The event loop is augmented a bit with Angular, as Angular provides its own event
    loop. Direct themselves register event listeners when events are fired, the directive
    function is run in AngularJS $digest loop.


    > The Angular event loop is called the $digest loop. The $digest loop is composed
    of two small loops: the evalAsync loop and the $watch list.'
  merge: -1
  pgno: 449
- img_proc: true
  md: 'When the event is fired, it is called within the context of the directive,
    which is in the AngularJS context. Functionally, AngularJS calls the directive
    within an $apply() method on the containing scope. Angular kicks off this entire
    process when it starts its $digest cycle on the $rootScope, propagating to all
    of the child scopes.


    When Angular falls into the $digest loop, it waits for the $evalAsync queue to
    empty before it handles the callback execution context back to the browser. The
    $evalAsync is used to schedule any work that needs to be run outside of the current
    frame, but before the browser renders.


    Additionally, the $digest loop waits for the $watch expression list, an array
    of potential expressions that may change during the previous iteration. If a change
    is detected, the $watch function is called, and the $watch list is run over again
    to ensure that nothing has changed.


    > Note that for any changes detected in the $watch list, AngularJS runs through
    the list again to ensure nothing has changed.


    Once the $digest loop settles down and no potential changes are detected, the
    execution leaves the Angular context and passes normally back to the browser,
    where the DOM will be rendered.


    This entire flow happens between every browser event, which is why Angular can
    be so powerful. It is also possible to inject events from the browser into the
    AngularJS flow.'
  merge: -1
