    \ each browser's built-in styles and make a decision about whether to wrap or\
    \ replace our directive's template.\n\n# A Note on Internet Explorer\n\nIf you've\
    \ got a copy of Internet Explorer handler, try opening this live example on jsbin.\
    \ You'll notice that declaring your directive twice, only one link is showing\
    \ up.\n\nTechnically, we can fix that by declaring new tags in the head of our\
