    The app starts out in app.js. There are two important components to notice in
    the app.js file: the static path from which static files are served and the routes
    that are resolved (and how).


    ```

    // ...

    app.use(express.methodOverride());

    app.use(app.router);

    // Line 1

    app.use(express.static(path.join(__dirname, ''public'')));

    // ...

    app.get(''/'', routes.index);

    app.get(''/users'', user.list);

    // ...

    ```


    The first line, with the express.static() call, tells Node to look in the public/
    directory for any files it may find that matches the requested route. For instance,
    if the requested route is ''/users'', it would look for a file ''users''.


    The second set of lines (app.get()) matches routes where static files are not
    found in the public/ directory.


    To work with our Angular app, we need to make two modifications to the generated
    app.js:


    First, we swap the lines of the express.static() and the app.router line, like
    so:


    ```

    // ...

    app.use(express.methodOverride());

    // Moved this line above the next line

    app.use(express.static(path.join(__dirname, ''public'')));

    app.use(app.router);

    // ...

    ```


    Although this swap is not strictly necessary, it will help support HTML5Mode later
    and will tell Express to prefer the files in the public/ directory above those
    defined in our app.


