  md: '# $routeUpdate


    Angular broadcasts the $routeUpdate event if the reloadOnSearch property has been
    set to false and we''re reusing the same instance of a controller.


    # Note About Indexing


    Web crawlers traditionally have a hard time with fat client-side JavaScript apps.
    To support crawlers that run through the app, we need to add a meta tag in the
    head. This meta tag causes the crawler to respect links with an empty fragment
    parameter so that the back end will serve back snippets of HTML.


    ```

    <meta name="fragment" content="!" />

    ```


    # Other Advanced Routing Topics


    # Page Reloading


    The $location service does not reload the entire page; it simply changes the URL.
    If we need to cause a full page reload, we have to set the location using the
    $window service:


    ```

    $window.location.href = "/reload/page";

    ```


    # Async Location Changes


    If we need to use the $location service outside of the scope life cycle, we have
    to use the $apply function to propagate the changes throughout the app. That''s
    because the $location service the $digest phase as the impetus to start the browser
    route change, which is how routing events work.'
