  md: '# Creation


    When we create a controller or directive, Angular creates a new scope with the
    $injector and passes this scope for the controller or directive at runtime.


    # Linking


    When the $scope is linked to the view, all directives create $scopes will register
    their watches on the parent scope. These watches watch for and propagate model
    changes from the view to the directive.


    # Updating


    During the $digest cycle, which executes on the $rootScope, all of the children
    scopes will perform dirty checking. All of the watching expressions are checked
    for any changes, and the scope calls the listener callback when they are changed.


    # Destruction


    When a $scope is no longer needed, the child scope creator will need to call scope.$destroy()
    to clean up the child scope.


    Note that when a scope is destroyed, the $destroy event will be broadcasted.


    # Directives and Scopes


    Directives, which are used throughout our Angular apps, generally do not create
    their own $scopes, but there are cases when they do. For instance, the ng-controller
    and ng-repeat directives create their own child scopes and attach them to the
    DOM element.


    But before we get too far, let''s take a look at what controllers are and how
    we can use them in our applications.'
  merge: -1
