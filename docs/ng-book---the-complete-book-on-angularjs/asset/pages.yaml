    \ via the compile function.\n\nFinally, the template function is passed to the\
    \ link function, where scope, determined by the directive rules of each directive\
    \ in the compiled DOM tree, is applied all at once. This compile link process\
    \ provides our applications with high performance gains.\n\n# Compile (object|function)\n\
    \nThe compile option can return an object or a function.\n\nUnderstanding the\
    \ compile vs link option is one of the more advanced topics we'll run across in\
    \ Angular, and it provides us with considerable context about how Angular really\
    \ works.\n\nThe compile option by itself is not explicitly used very often; however,\
    \ the link function is used very often. Under the hood, when we set the link option,\
    \ we're actually creating a function that will define the postChild() link function\
    \ so the compile() function can define the link function.\n\nOtimes, when we set\
    \ the compile function, we're interested in manipulating the DOM before we place\
    \ the directive on with live data. Here, it is to manipulate HTML, add and remove\
    \ elements,\n\n> The compile and the link option are mutually exclusive. If both\
    \ are set, the compile option will be expected to return the link function, while\
    \ the link option will simply be ignored.\n\n```\n// ...\ncompile: function(tEle,\
