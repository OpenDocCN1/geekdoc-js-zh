  md: '# Architecture


    When learning Angular, one of the most confusing adjustments we need to make is
    learning how to think about structuring the application. Although we cannot prescribe
    a structure, as it is the developer’s prerogative to choose one, we can share
    what has worked for us.


    # Directory Structure


    AngularJS is so packed with options that it can be difficult to determine how
    to structure our web apps as they grow over time. Where is the most logical place
    to put our controllers? Should we contain all of the logic of our services in
    a single file or should we break them up?


    When building an Angular app of any size, we usually best make our structuring
    choices by considering the tools we''re going to use when building the app and
    the current size of the project. We should always build with the expectation that
    our project will grow.


    We suggest creating the following directory structure for our applications, where
    we keep our application files in the src/ directory, each separated out by its
    function type with a main app.js file.


    ![](img/c29f4deabfb2aac07907f28672b2ed83_390_0.png)


    We also suggest using a tool like Grunt to concatenate our files together in a
    single file for production.'
  merge: -1
  pgno: 390
- img_proc: true
  md: 'Architecture 380


    Every Angular object should have its own file, named appropriately for its function.
    For instance, the logical place for a ViewController object would be in the scripts/controllers/main.js
    file. AFilter object belongs in the scripts/filters/myFilter.js.


    Employing this structure is beneficial because each file is small and focused
    enough on its functionality because it enables multiple developers to efficiently
    work together on the app.


    Additionally, we suggest merging the scripts directory in a test/ folder at the
    root directory when we write tests for our application, like so:


    ![](img/c29f4deabfb2aac07907f28672b2ed83_391_0.png)


    We suggest this structure when building a single-module application. When building
    an app composed of multiple modules, we''ll include a modules/ directory with
    a similar structure as the top level structure.


    # Modules


    A module is the kernel of functionality for Angular apps. Modules contain all
    of the code that we write for our specific app and, thus, to grow huge in a monolithic
    way. Although this tendency isn''t bad (modules are a great way to reduce global
    scope noise), we can divide our modules.


    There are several differing opinions about when to create a module and where to
    nest functionality in a global module. Both of the following methods are valid
    ways to break up our functionality by modules:


    # Modularize on Functionality


    The most obvious method for breaking up our app by modules is to divide the modules
    by type.'
  merge: -1
  pgno: 391
