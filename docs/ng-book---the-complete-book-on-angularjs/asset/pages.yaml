    # What Is a Browser?


    If we jump straight into our coverage of Angular, it''s important to know what
    your browser is doing when it renders a web page.


    There are many different web browsers; the most common browsers today include
    Chrome, Safari, Mozilla Firefox, and Internet Explorer. At their core, all basically
    do the same thing: fetch web pages and display them to the user.


    Your browser gets the HTML text of the page, parses it into a structure that is
    internally meaningful to the browser, lays out the content of the page, and styles
    the content before displaying it to you. All of this happens behind the scenes.


    Our goal as web developers is to build the structure and content of our web page
    so that the browser will make it look great for our users.


    With Angular, we''re not only building the structure, but we''re constructing
    the interaction between the user and our app as a web application.


    > *http://google.com

    ¹http://google.com/images'
