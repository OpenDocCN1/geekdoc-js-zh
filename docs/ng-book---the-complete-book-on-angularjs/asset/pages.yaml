  md: "# Building Angular Chrome Apps\n\n```\n<!doctype html>\n<html data-ng-app=\"\
    myApp\" data-ng-csp=\"\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Presently</title>\n\
    \  <link rel=\"stylesheet\" href=\"css/bootstrap.min.css\">\n  <link rel=\"stylesheet\"\
    \ href=\"css/main.css\">\n</head>\n<body>\n  <div class=\"container\">\n  </div>\n\
    \  <script src=\"./js/angular.min.js\"></script>\n  <script src=\"./js/angular-route.min.js\"\
    ></script>\n  <script src=\"./js/app.js\"></script>\n</body>\n</html>\n```\n\n\
    This basic structure of an Angular application looks almost identical to any Angular\
    \ app, with one exception: data-ng-csp=\"\".\n\nThe ngCsp directive enables Content\
    \ Security Policy (or CSP) support for our Angular app. Since Chrome prevents\
    \ the browser from using eval or function(string) generated functions, and Angular\
    \ uses the function(string) generated function for speed, ngCsp causes Angular\
    \ to evaluate all expressions.\n\nThis compatibility mode comes as a cost of performance,\
    \ however, as it executes operations more slowly, but it won't throw any security\
    \ violations in the process.\n\nCSP also forbids JavaScript from inlining stylesheet\
    \ rules, so we need to include angular-csp.css.\n\nWe can find the angular-csp.css\
    \ file at http://code.angular.org/snapshot/angular-csp¹¹¹.\n\nLastly, we must\
    \ place ngCsp alongside the root of our Angular apps:\n\n```\n<html ng-app-csp\"\
    >\n```\n\n> Without the ng-csp directive, our Chrome app will not run; it will\
    \ throw a security exception. If you see a security exception thrown, make sure\
    \ you check the root element for the directive.\n\n¹¹¹http://code.angular.org/snapshot/angular-csp"
