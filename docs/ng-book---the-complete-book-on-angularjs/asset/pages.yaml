  md: '# # Building Angular Chrome Apps


    The Chrome<sup>139</sup> web browser is Google''s custom browser. Not only is
    it incredibly speedy and on the bleeding edge of web development, it is at the
    forefront of delivering web experiences both on and off the web.


    Chrome Apps are embedded apps that run within the web browser, but are intended
    to deliver a native app feel. Since they run within Chrome itself, they are written
    in HTML5, JavaScript, and CSS3, and they have access to native-like capabilities
    that true web applications do not.


    Chrome apps have access to the Chrome API and services and can provide an integrated
    desktop-like experience to the user.


    One more interesting difference between Chrome apps and web apps is that they
    always load locally, so they show up immediately, rather than waiting for the
    network to fully download the components. This feature greatly improves the apps''
    performance and our user''s experience with running our apps.


    # ## Understanding Chrome Apps


    Let''s dive into looking at how Chrome apps actually work and how we can start
    building our own. Every Chrome application has three core files:


    # ### manifest.json


    This manifest_json file describes metadata about the application, such as the
    name, description, version, and how to launch our application.


    # ### A Background Script


    This background script sets up our application responds to system-level events,
    such as a user installing our app or launching it, etc.


    # ### A View


    Most Chrome applications have a view. This component is optional, but is most
    generally used for our applications.


    > 139https://www.google.com/intl/en/chrome/browser/'
  merge: -1
  pgno: 536
