    \n# # Animating ngShow/ngHide\n\nThe ngShow and ngHide directives use the .ng-hide\
    \ class when showing or hiding elements. It's possible to add animations to the\
    \ time between showing and hiding DOM elements.\n\nWhen we are animating on these\
    \ classes, the animation is fired first, and the final .ng-hide is added to the\
    \ DOM element only when the animation is complete.\n\nBecause the ng-hide directive\
    \ is still applied to the DOM element when we're removing the ng-hide class, we\
    \ never get our animation until it's complete. Thus, we need to tell the CSS to\
    \ display our class and not cascade.\n\nThe ngShow and ngHide directives fire\
    \ the events:\n\n| Action | Event name |\n|---|---|\n| After ngClass evaluates\
