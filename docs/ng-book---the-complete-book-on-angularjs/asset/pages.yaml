    # Utilizing the $templateCache


    When we deploy our app in production, we''ll want our app to load as quickly as
    possible and be as responsive as possible. Requiring templates to load over XHR
    can lead to slow or sluggish-feeling web apps. Instead of requiring our templates
    to be fetched via XHR, we fake the template cache loading by wrapping it into
    a JavaScript file and simply shipping our JavaScript file with the rest of the
    application.


    For more information on how to efficiently wrap our templates, see the $templateCache
    tool-angular-templates.'
