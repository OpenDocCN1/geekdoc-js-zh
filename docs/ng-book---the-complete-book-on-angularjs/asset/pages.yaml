  md: '# Properties


    ngModelController has a few properties available that we can examine and even
    modify to change our view.


    # $viewValue


    The $viewValue property holds onto the actual string value that''s updated in
    the view.


    # $modelValue


    The $modelValue is the value held by the model. The $modelValue and the $viewValue
    can be different, depending upon the $parser pipeline.


    # $parsers


    The $parsers value is an array of functions that get executed in a pipeline. When
    the ngModel control reads the value from the DOM, this value will be passed into
    the first $parser function. When it''s complete, the return value will be passed
    to the next $parser, and so on and so forth.


    These are used to sanitize and modify the value. We have described how the validation
    pipeline works, at a basic level. For more information about creating a $parser
    for validation, head over to the validations chapter.


    # $formatters


    The $formatters value is an array of functions that get executed as a pipeline
    when the model value changes. It is called on the out of the $parser pipeline
    and is used to format and convert values to display within the bound control.


    # $viewChangeListeners


    The $viewChangeListeners value is an array of functions to execute when the view
    value has changed. Using $viewChangeListeners is a way to remove a $watch on a
    value yet retain similar behavior. These functions do not need to return a value,
    as they are ignored.


    # $Error


    The $error value holds onto the object of errors where the key is the failed validation
    name and value is the actual error message.


    # $pristine


    The $pristine value is a boolean that tells us whether or not the user has made
    any changes to the control yet.'
