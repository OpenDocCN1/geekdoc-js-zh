  md: "# Communicating with the Outside World: XHR and Server-Side Communication\n\
    \nAngularJS web apps are entirely client-side applications. As we've seen, we\
    \ can write AngularJS applications without integrating with a back end all and\
    \ still have a dynamic, responsive web app.\n\nWithout a back end, we are limited\
    \ to only showing information that we have at load. Angular provides us several\
    \ methods if we want to integrate our AngularJS app with information from a remote\
    \ server.\n\n# Using $http\n\nWe can directly call out using the built-in $http\
    \ service. The $http service is simply a wrapper around the browser's raw XMLHttpRequest\
    \ object.\n\nThe $http service is a function that takes a single argument: a configuration\
    \ object that is used to generate an HTTP request. The function returns a promise\
    \ that has two helper methods: success and error.\n\n+   See the $http config\
    \ object section in this chapter for details on the available options.\n\nThe\
    \ most basic usage of the method looks like:\n\n```\n$http({\n  method: 'GET',\n\
    \  url: '/api/users.json'\n}).success(function(data, status, headers, config)\
    \ {\n  // This is called when the response is\n  // ready\n}).error(function(data,\
    \ status, headers, config) {\n  // This is called when the response\n  // comes\
    \ back with an error status\n});\n```"
  merge: -1
  pgno: 184
- img_proc: true
  md: "# Communicating with the Outside World: XHR and Server-Side Communication\n\
    \nNotice that the $http object looks like we are passing in a callback method\
    \ to call when the response comes back. This observation is not accurate. The\
    \ method actually returns a promise.\n\nWhen this promise is returned, we can\
    \ return the $http method as a variable and chain other promises atop to resolve\
    \ when the HTTP has resolved.\n\nWe'll use this technique often when we build\
    \ services so that they can return a promise instead of requiring a callback.\n\
    \n```\nvar promise = $http({\nmethod: 'GET',\nurl: '/api/users.json'\n});\n```\n\
    \nSince the $http method returns a promise, we can use the then method to handle\
    \ the callback when the response is ready. If we use the then method, we'll get\
    \ a special argument that represents the response object for both success and\
    \ error. Then receives optionally 2 functions as a parameter. Otherwise, we can\
    \ use the success and error callbacks instead.\n\n```\npromise.then(function(resp)\
    \ {\n  // resp is a response object\n}, function(resp) {\n  // resp with error\n\
    \  }\n});\n// OR we can use the success/error methods\npromise.success(function(data,\
    \ status, headers, config) {\n  // Handle successful responses\n});\n.error(function(data,\
    \ status, headers, config) {\n  // Handle non-successful responses\n});\n```\n\
    \nIf the response status code is between 200 and 299, the response is considered\
    \ successful, and the success callback will be called. Otherwise, the error callback\
    \ will be invoked.\n\n> Note that if the response is in a redirect, the XMLHttpRequest\
    \ will follow it, and the error callback will not be called.\n\nNote that we have\
    \ the ability to use the then() method or the success() and error() methods on\
    \ the HttpPromise. The difference between using the then() method and the convenience\
    \ helpers is that the success() and error() functions contain a destructured representation\
    \ of the response object, which the then() method receives in."
  merge: -1
  pgno: 185
