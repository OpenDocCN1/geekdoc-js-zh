    # Installing Packages


    Installing packages is equally easy. If we have an existing bower.json file, we
    can simply run the install command. It pulls down and installs the front-end dependencies
    in the Bower directory.


    ```

    $ bower install

    ```


    We can install a package locally by explicitly calling install on the file. It''s
    possible to install a specific version of the package and even set an alias for
    the package install.


    +   # Install a local or

    # default remote version of a package

    $ bower install <package>

    # Install a specific version of a package

    $ bower install <package>="<version>

    # Alias install a package

    $ bower install name=<package>="<version>

    # For instance

    $ bower install bootstrap-bootstrap-sass


    The bower.json file stores several types of dependencies: either dependencies
    needed by the runtime (like Angular or jQuery) or dependencies needed in the development
    process (like Karma or Bootstrap-sass).


    +   # Install a run-time dependency

    $ bower install angular-route --save

    # Install a dev dependency

    $ bower install bootstrap-sass --dev


