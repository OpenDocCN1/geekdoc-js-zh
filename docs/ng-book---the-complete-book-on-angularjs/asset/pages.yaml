    \ we'd set our prefix to like:\n\n```\nngtemplates:\n  app: {\n    options:\n\
    \      prefix: '/public'\n  }\n\n```\n\n# source\n\nWe can set the source option\
    \ to a function to be called before the rest of the templates are compiled and\
    \ after the source has been minified so that we can customize the template source\
