    # responseType (string)


    The responseType sets the XMLHttpRequestResponseType property on the request.
    We can set it to one of these different types of available HTTP response types:


    +   * "" (string - default)

    * "arraybuffer" (ArrayBuffer)

    * "blob" (blob object)

    * "document" (HTTP document)

    * "json" (JSON object parsed from a JSON string)

    * "text" (string)

    * "moz-blob" (Firefox to receive progress events)

    * "moz-chunked-text" (streaming text)

    * "moz-chunked-arraybuffer" (streaming ArrayBuffer)


    # interceptor (object)


    The interceptor has two optional methods: either a response or a responseError.
    These interceptors are called with the $http response object, just like normal
    $http interceptors.


