  md: '# Server Communication


    One of the most powerful components of Angular is its ability to communicate with
    a server-side back end. Regardless of the back end that we''re using, Angular
    likely talk to it through an an API.

    In this chapter, we''re going to focus on two types of back ends: custom server-side
    back ends that we''ll develop and server-less back ends using back ends as a service.


    # Custom Server-Side


    In this section, we''re going to focus on the process of building a custom server-side
    application in Node.JS. Although we''re going to focus on building this app in
    Node, we can build our back end in any server-side language that supports HTTP
    API routes.


    ![](img/c29f4deabfb2aac07907f28672b2ed83_249_0.png)


    > If you''re a Ruby on Rails developer, we''ve written a book specifically on
    demonstrating how to use Rails. Check out Riding Rails with AngularJS¹.


    To start our Node-backed app, we need to have NodeJS installed.


    # Install NodeJS


    NodeJS is a server-side platform built on the Chrome JavaScript run time. It is
    an event-driven, non-blocking, lightweight JavaScript runtime that enables us
    to write JavaScript on the server.


    To install NodeJS, we can head to nodejs.org² and click on the Install button.
    It will detect and download the appropriate installer for our platform.


    i> If for some reason it downloads the wrong package, no problem – we can click
    on the Downloads button and manually select the appropriate package.


    We can run the installer and let it run once. Once it''s complete, we''ll have
    the two packages available on the command line:


    +   - node

    - npm


    node is the Node binary that we''ll call to run our Node app, while npm is the
    Node Package Manager, which we''ll use to install Node libraries.


    ¹http://www.fullstack.com/edu/angular/rails/

    ²http://nodejs.org/'
