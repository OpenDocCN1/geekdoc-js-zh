    \ creep can be one of the most confusing aspects of the Angular framework where\
    \ we have a lot of functionality defined on our $scope in our controllers. As\
    \ we are writing web apps, we'll sometimes find that the size of our controllers\
    \ is wildly out of control.\n\nWe can reduce the size of our controllers by shifting\
    \ the responsibility of handling the DOM and methods away from them. Moving functionality\
    \ into custom directives greatly reduces the need to create functions that determine\
    \ whether we need to expose a particular view or format a value.\n\nSince we are\
    \ binding values on the $scope inside of the view, the controller doesn't need\
    \ to be responsible for holding onto the value states we need for a particular\
    \ DOM object.\n\nFor instance, we can remove the method in the controller that\
    \ deals with showing values.\n\nLet's say we have a single login page that shows\
