- img_proc: true
  md: "Optimizing Angular Apps\n\nWhen we use it, we set the memoize function to be\
    \ a function call on our scope object so we can call it from the view.\n\n```\n\
    angular.module('MyApp', [])\n.controller('MainController', function($scope, $filter)\
    \ {\n  $scope.getNames = memoize(function() {\n    return $filter('orderBy')(\n\
    \      $scope.names,\n      $scope.orderBy, $scope.reverseList\n    );\n  });\n\
    \n  function() {\n    // Resolver function returns a string that\n    // represents\
    \ the cache key\n    return $scope.orderBy + '-' + $scope.reverseList;\n  }\n\
    });\n```\n\nWhen we call getNames() in the view, the orderBy $filter runs for\
    \ the first time. The second time the filter is called, it will not run over the\
    \ cache will contain the sort key.\n\nSometimes, we may want to manually clear\
    \ the cache (e.g: adding or removing an update). Since the cache is held on the\
    \ function object, we can clear the cache simply by setting its value to a new\
    \ {} object.\n\n$scope.getNames.cache = {};\n\n# Tips for Optimizing Page Load\n\
    \nWe can also optimize the amount of time it takes the client-browser to render\
    \ our page. Of course, there is no silver bullet for determining the best mechanisms\
    \ to load our pages for clients, as a large portion of it depends on server-side\
    \ components, location, and hosting issues.\n\n# Minification\n\nMinifying our\
    \ code is the easiest method for optimizing perceived page load time.\n\nMinification\
    \ is the process of removing all unnecessary characters from the source code,\
    \ reducing the size of variables to as small as we can get, stripping away comments\
    \ and block delimiters, and more.\n\nThis reduces the time it takes for our files\
    \ to be transferred over the network, because it reduces the size of the complete\
    \ file."
