    # Install Selenium


    If you are having trouble running Selenium installation, try updating the ChromeDriver
    by downloading the latest version here99.


    Now we use Protractor to connect to our Selenium server running in the background.


    # Configuration


    Protractor, like Karma, requires a configuration script to run that tells the
    Protractor runner how to connect to Selenium, which browser(s) to use, and where
    the test files are located.


    The easiest way to create a configuration file is by copying the reference configuration
    file from the Protractor install:


    ```

    $ cp ./node_modules/protractor/referenceConf.js protractor_conf.js

    ```


    This reference file includes all of the options available for running Protractor.


    # Configuration Options


    Protractor includes several options that allow us to configure how we are running
    Protractor with our specific files.


    # seleniumServerJar (string)


    By setting the seleniumServerJar as the path to the standalone Selenium server,
    we can tell Protractor to launch the Selenium server when we run the test.


    This is useful when we''re running continuous integration (CI) tests, but the
    startup time of Selenium is slow, so this is quite inefficient for development
    time.


    > 99http://chromedriver.storage.googleapis.com/index.html'
