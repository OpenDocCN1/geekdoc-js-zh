  md: "AngularJS and Internet Explorer\n\n```\nangular.module('MyApp', []);\n.configure(['$location',\
    \ function($location) {\n  $location.hashPrefix('!');\n}]);\n```\n\n# # HTML5\
    \ Routing Mode\n\nThe new HTML5 pushState doesn't work the same way: It modifies\
    \ the browser's URL and history. To get Angular apps to \"fool\" the search bot,\
    \ we can add a simple content to the header:\n\n```\n<meta name=\"fragment\" content=\"\
    !\">\n```\n\nThis element tells the Google spider to use the new crawling spec\
    \ to crawl our site. When it encounters this tag, instead of crawling our site\
    \ normal, it will revisit the site using the ?_escaped_fragment= tag.\n\nAssuming\
    \ we use HTML5 mode with the $location service, we can set our page to use html5Mode\
    \ like so:\n\n```\nangular.module('MyApp', []);\n.configure(['$routeProvider'],\
    \ function($routeProvider) {\n  $routeProvider.html5Mode(true);\n}]);\n```\n\n\
    With the _escaped_fragment_ in our query string, we can use our back-end server\
    \ to serve static HTML instead of our client-side app.\n\nNow, our back end can\
    \ detect if the request has the _escaped_fragment_ in the request, and if so,\
    \ we can serve static HTML back instead of our pure Angular app.\n\n> We can achieve\
    \ this result using a proxy, like Apache or Nginx, or our back service. Setting\
    \ up this is out of scope of this book; however, we'll discuss how to set them\
    \ up with a Node.js app.\n\n# # Options for Handling SEO from the Server Side\n\
    \nWe have a number of options available to us to make our site SEO-friendly. We'll\
    \ walk through different ways to deliver our apps from the server side:\n\n+ \
    \  - Using Node/Express middleware\n- Using Apache to rewrite URLs\n- Using Nginx\
    \ to proxy URLs"
