  md: "# save(params, payload, successFn, errorFn)\n\nThe save method sends a POST\
    \ request to the URL and uses the payload to generate the request body. The save()\
    \ method is used to create a new resource on the server.\n\n```\n// Issues a request\
    \ to:\n// POST /api/users\n// with the body {name: 'Ari'}\nUser.save({\n  name:\
    \ 'Ari'\n}, function(response) {\n  // Handle a successful response\n}), function(response)\
    \ {\n  // Handle a non-successful response\n});\n```\n\n# delete(params, payload,\
    \ successFn, errorFn)\n\nThe delete method sends a DELETE request to the URL and\
    \ can use the payload to generate the request body. It is used to remove an instance\
    \ from the server.\n\n```\n// Issues a request to:\n// DELETE /api/users\nUser.delete({\n\
    \  id: '123'\n}, function(response) {\n  // Handle a successful delete response\n\
    }), function(response) {\n  // Handle a non-successful delete response\n});\n\
    ```\n\n# remove(params, payload, successFn, errorFn)\n\nThe remove method is synonymous\
    \ with the delete() method and primarily exists because delete is a reserved word\
    \ in JavaScript that can cause problems when we use in Internet Explorer."
  merge: -1
  pgno: 200
- img_proc: true
  md: "Communicating with the Outside World: XHR and Server-Side Communication\n\n\
    ```\n// Issues a request to:\n// DELETE /api/users\nUser.remove({\n  id: '123'\n\
    }, function(response) {\n  // Handle a successful remove response\n}, function(response)\
    \ {\n  // Handle a non-successful remove response\n});\n```\n\n# # Resource instances\n\
    \nWhen the methods above return data, they wrap the response in a prototype class\
    \ that adds convenience methods on the instances.\n\nThe three instance methods\
    \ that are available on the instance objects:\n\n+   * $save()\n* $remove()\n\
    * $delete()\n\nThese methods are the same as the resource counterpart except that\
    \ they are called on a single resource instead of a collection.\n\nThese three\
    \ methods can be called on the instances themselves. For instance:\n\n```\n//\
    \ Using the $save() instance methods\nUser.get({id: '123'}, function(user) {\n\
    \  user.name = 'Ari';\n  user.$save(); // Save the user\n});\n// This is equivalent\
    \ to the collection-level\n// resource call\nUser.save({id: '123'},name: 'Ari'});\n\
    ```\n\n# # Resource Instances Are Asynchronous\n\nWith all these methods, it's\
    \ important to note that when they are invoked, the $resource object immediately\
    \ returns an empty reference to the data. This data is an empty reference, not\
    \ the actual data, as all these methods are executed asynchronously.\n\nTherefore,\
    \ a call to get an instance might look synchronous, but is actually not. In fact,\
    \ it's simply a reference to data that Angular will fill in automatically when\
    \ it arrives back from the server."
  merge: -1
  pgno: 201
