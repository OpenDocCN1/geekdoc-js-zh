    \ with our filter:\n\n```\n<!-- Ginger loves dog treats -->\n{{ 'ginger loves\
    \ dog treats' | lowercase | capitalize }}\n```\n\n# Form Validation\n\nWhen taking\
    \ input from our users, it's important to provide visual feedback on their input.\
    \ In the context of human relationships, form validation is just as much as giving\
