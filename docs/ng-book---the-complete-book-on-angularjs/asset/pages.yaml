  md: "Multiple Views and Routing\n\n```\nangular.module('myApp', ['ngRoute']);\n\
    ```\n\n# # Layout Template\n\nTo make a layout template, we need to change the\
    \ HTML in order to tell AngularJS where to render the template. Using the ng-view\
    \ directive in combination with the router, we can specify exactly where in the\
    \ DOM we want to place the rendered template of the current route.\n\nFor instance,\
    \ a layout template might look something like:\n\n```\n<header>\n  <h1>Header</h1>\n\
    </header>\n<div class=\"content\">\n  <div ng-view></div>\n</div>\n<footer>\n\
    \  <h5>Footer</h5>\n</footer>\n```\n\nIn this case, we are placing all of the\
    \ rendered content in the <div class=\"content\">, whereas we are leaving the\
    \ <header> and <footer> elements intact on route changes.\n\nThe ng-view directive\
    \ is a special directive that's included with the ngRoute module. Its specific\
    \ responsibility is to stay as placeholder for $route view content.\n\nIt creates\
    \ its own scope and nests the template inside of it.\n\n> The ng-view directive\
    \ is a terminal directive at a 1000 priority. Angular will not run any directives\
    \ on the element at a lower priority, which is most directives (i.e., all other\
    \ directives on the <div>ng-view></div> are meaningless).\n\nThe ng-view directive\
    \ defines these specific steps:\n\n+   * Any time the $onRouteChangeSuccess event\
    \ is fired, the view will update\n* If there is a template associated with the\
    \ current route:\n  - Create a new scope\n  - Remove the last view, which cleans\
    \ up the last scope\n  - Link the new scope and the new template\n  - Link the\
    \ controller to the scope, if specified in the routes\n  - Emits the $viewContentLoaded\
    \ event\n  - Run the onload attribute function, if provided"
  merge: -1
