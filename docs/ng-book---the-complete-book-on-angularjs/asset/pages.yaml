  md: "# Communicating with the Outside World: XHR and Server-Side Communication\n\
    \n```\nvar message = messages.get(123);\nmessage.remove(); // Send a DELETE to\
    \ /messages\n```\n\nUpdating and saving objects is something we'll quite often.\
    \ Traditionally, this operation is done with the HTTP method PUT. Restangular\
    \ supports this functionality out of the box with the method put().\n\nTo update\
    \ an object, we need to query the object, set our new attributes on the instance,\
    \ and call put() on the object to save the updated attributes in the back end.\n\
    \n> Before modifying an object, it's good practice to copy it and modify the object\
    \ before we save. Restangular has its own version of copy that won't rebound this\
    \ in the bundled functions. It's good practice to use Restangular.copy() when\
    \ updating an object.\n\nNow that we have experience working on instances of collection,\
    \ let's dig into nested components. Nested components are those that lie underneath\
    \ other components. For instance, for all of the books written by a certain author.\n\
    \nRestangular supports nested resources by default. In fact, we can query a particular\
    \ instance from our collection for these resources.\n\n```\nvar author = Restangular.one('authors',\
    \ 'abc123');\n// Builds a GET to /authors/abc123/books\nvar books = author.getList('books');\n\
    ```\n\nAnother cool feature of Restangular is that we're able to call all of these\
    \ methods (post, put, get, getList, etc.) not only from Restangular created objects\
    \ with one and all, but also from objects returned from the server. For instance,\
    \ we can first fetch an author to display in one part of our code, and then get\
    \ the list of books from:\n\n```\nRestangular.one('authors', 'abc123').then(function(author)\
    \ {\n  $scope.author = author;\n});\n```\n\n```\n// Later in the code\n// Builds\
    \ a GET to /authors/abc123/authors\n// using $scope.author which is real object\
    \ returned from the server\n$scope.author.getList('books');\n```\n\n# But What\
    \ About My HTTP Methods?\n\nRestangular supports, out of the box, all HTTP methods.\
    \ It can support calling GET, PUT, POST, DELETE, HEAD, TRACE, OPTIONS, and PATCH."
  merge: -1
  pgno: 213
- img_proc: true
  md: "# Communicating with the Outside World: XHR and Server-Side Communication\n\
    \n```\nauthor.get(); // GET /authors/abc123\nauthor.getList('books'); // GET /authors/abc123/books\n\
    author.put(); // PUT /authors/abc123\nauthor.post(); // POST /authors/abc123\n\
    author.remove(); // DELETE /authors/abc123\nauthor.head(); // HEAD /authors/abc123\n\
    author.trace(); // TRACE /authors/abc123\nauthor.options(); // OPTIONS /authors/abc123\n\
    author.patch(); // PATCH /authors/abc123\n```\n\nRestangular is also possible\
    \ to create custom HTTP methods for when our back-end server maps resources differently\
    \ than we expect.\n\nIf we want to use METHOD() (not a REST resource), we can\
    \ set the URL through the customMethod() function (where your METHOD is replaced\
    \ by any of the following: GET, LIST, DELETE, POST, HEAD, OPTIONS, TRACE).\n\n\
    ```\n// Maps to GET /users/abc123/biography\nauthor.customGET('biography');\n\
    // Or customPOST with a new bio object\n// as (body: \"Ari's bio\")\n// The two\
    \ empty fields in between are the\n// params field and any custom headers\nauthor.customPOST({body:\
    \ \"Ari's Bio\", // post body\n  \"biography\", // route\n  {}, // custom params\n\
    \  {{}}); // custom headers\n```\n\n# Custom Query Parameters and Headers\n\n\
    We can send custom query parameters or custom headers with each of these methods.\n\
    to add custom query parameters, we need to add a JavaScript object as the second\
    \ parameter to our method call. We can also add a second JavaScript object as\
    \ a third parameter. Most of the individual methods that we can call on an element\
    \ take these two parameters as optional parameters.\nWith custom query parameters,\
    \ a post method might look something like:\n\n```\nvar queryParamObj = { role:\
    \ 'admin' },\nheaderObj = { 'x-user': 'admin' };\n```\n\n```\nmessages.getList('accounts',\
    \ queryParamObj, headerObj);\n```\n\nRestangular is incredibly simple to use and\
    \ gets out of the way so that we can focus on building our app, rather than wrestling\
    \ with the API."
