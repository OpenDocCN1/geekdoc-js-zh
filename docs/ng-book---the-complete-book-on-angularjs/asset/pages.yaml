  md: "# Directive Explained\n\n```\ndirective('someDirective' function() {\n  return\
    \ {\n    replace: true // MODIFIED\n    template: '<div>some stuff here</div>'\n\
    \  }\n});\n```\n\nthen the result when the directive is invoked will be:\n\n```\n\
    <div>some stuff here</div>\n```\n\n# Directive Scope\n\nIn order to fully understand\
    \ the rest of the options available inside a directive definition object, we'll\
    \ need to have an understanding of how scope works.\n\nA special object, known\
    \ as the $rootScope, is initially created when we declare the ng-app directive\
    \ in the DOM:\n\n```\n<div ng-app=\"MyApp\">\nng-init=\"someProperty = 'some data'></div>\n\
    ng-init=\"siblingProperty = 'more data'>\nInside Div Two\n<div ng-init=\"ThirdProperty\"\
    ></div>\n</div>\n```\n\nIn the code above, we set three properties on the root\
    \ scope of our app: someProperty, siblingProperty, and anotherSiblingProperty.\
    \ every directive invoked within our DOM will:\n\n+   - use the same object,\n\
    - create a new object that inherits from the object, or\n- create an object that\
    \ is isolated from the object\n\nThe example shows the first case. The second\
    \ div is a sibling element that has get and set access to the $rootScope. Furthermore,\
    \ inside this second div is another div that has get and set access to the same\
    \ root scope.\n\nJust because a directive is nested within another directive does\
    \ not necessarily mean its scope has been changed. By default, child directives\
    \ are given access to the exact same scope as their parent DOM nodes. The reason\
    \ for that can be understood by learning about the scope directive option, which\
    \ is set to false by default."
  merge: -1
  pgno: 121
