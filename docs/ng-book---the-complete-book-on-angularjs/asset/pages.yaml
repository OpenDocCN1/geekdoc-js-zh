    # Introduction


    The AWS ecosystem is huge and used in production all over the world. The gross
    number of useful services that Amazon makes it a fantastic platform on top of
    which to power our applications.


    Historically, the APIs have not always been the easiest to use and understand,
    so we hope to address some of that confusion here:


    Traditionally, we''d use a signed request with our applications utilizing the
    client_id or secret access key model. Since we''re operating in the browser, it''s
    not a good idea to embed our client_id and our client_secret in the browser, where
    anyone can see it. (It''s not much of a secret anyway if it''s embedded in clear
    text, right?)


    Luckily, the AWS team has provided us with an alternative method of identifying
    and authenticating our site to give access to the AWS resources.'
