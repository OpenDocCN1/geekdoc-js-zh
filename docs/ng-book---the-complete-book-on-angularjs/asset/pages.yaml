  md: '# Installing Batarang


    To install Batarang, we simply need to download the application from the web store
    or from the GitHub repo: https://github.com/angular/angularjs-batarang¹¹⁵⁹.


    Once our installation is set, we can start up the extension by navigating to our
    developer tools and clicking *enable* to enable Batarang to start collecting debugging
    information about our page.


    Batarang allows us to look at scopes, performance, dependencies, and other key
    metrics in Angular apps.


    # Inspecting the Models


    After we''ve started up Batarang, the page will reload, and we''ll notice that
    we have a panel that enables us to select different scopes in our page.


    We can select a scope by clicking on the + button, finding the element we''re
    interested in and clicking on it.


    Once we select a scope using the inspector, we can look at all the different properties
    on our scope element and their current values.


    ¹¹⁵https://github.com/angular/angularjs-batarang


    ![](img/c29f4deabfb2aac07907f28672b2ed83_577_0.png)'
  merge: -1
  pgno: 577
- img_proc: true
  md: '# Inspecting Performance


    We can also peek into the performance of our application by using the performance
    section of Batarang.


    In this panel, we get a peek into the watch list of the application at the different
    scopes as well as the amount of time that each expression takes, both in absolute
    time and percentage of the overall application time.


    ![](img/c29f4deabfb2aac07907f28672b2ed83_578_0.png)


    # Inspecting the Dependency Graph


    One very nice feature of the Batarang tool is its ability to visualize the dependency
    graph inline. We can look at the dependencies of our application and view the
    different libraries of our application to see what they depend upon and track
    libraries that aren''t dependencies of the application at all.'
