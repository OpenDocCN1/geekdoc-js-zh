    function() {\n    return {\n      template: '<button>Click me</button>'\n    }\n\
    \  });\n});\n```\n\nIn particular, it's also important to note that Angular runs\
    \ these functions in the order in which they are written and registered. That\
    \ is to say that we cannot inject a provider that has not yet been defined.\n\n\
