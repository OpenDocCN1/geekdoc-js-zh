  md: "```\nvar User = $resource('/api/users/:userId.json',\n{\n  userId: '@id',\n\
    \n  sendEmail: {\n    method: 'POST'\n  },\n  allInboxes: {\n    method: 'JSONP',\n\
    \    isArray: true\n  }\n});\",\n```\n\nWith this User resource, the methods sendEmail()\
    \ and update() are now available on the collection (User resource object), as\
    \ are the individual instances (as user.$sendEmail() and user.$update()).\n\n\
    # # resourceConfiguration Object\n\nThe $resource configuration object is very\
    \ similar to the $http configuration object (with a few changes).\n\nThe value\
    \ of the object, the action, is the name of the method on the resource object\
