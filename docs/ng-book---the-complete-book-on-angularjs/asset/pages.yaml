- img_proc: true
  md: "Essential AngularJS Extensions\n\n```\n$scope.on('$viewContentLoading',\nfunction(event,\
    \ viewConfig) {\n  // Access to all the view config properties.\n  // and one\
    \ special property 'targetView'\n  viewConfig.targetView\n});\n```\n\n**$viewContentLoaded**\
    \ This event is fired after the view has been loaded and after the DOM rendered.\n\
    \n# ## StateParams\n\nAbove, we used the $stateParams to pick out the different\
    \ params from the URL parameters. The service is how we handle from different\
    \ components of our URL. For instance, if we have a URL in our inbox state that\
