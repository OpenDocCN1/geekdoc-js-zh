  md: '# Angular Animation


    The $angular service calls these functions for the element specified. Inside of
    functions, we are free to do what we will with the element. The only requirement
    is that we call the callback function done() when we are done with the animation.


    Inside of these functions, we can return an end function that will be called when
    the animation is complete OR when the animation has canceled.


    When the animation is triggered, $animate looks for the matching animation function
    for the event. If it finds a function that matches the event, it executes it,
    otherwise it will skip the animation entirely.


    # Fine-tuning animations


    Depending on how complex the application, ngAnimate and the underlying animation
    code need to be tweaked around.


    # Filtering out CSS classes


    By default, ngAnimate will automatically attempt to animate every element that
    passes through the $animate service. But don''t worry, only the elements that
    contain the CSS classes that are registered with CSS or JavaScript animations
    will actually animate.


    Despite this system working, having to check every possible CSS class may slow
    down on low-powered devices. Therefore, with the release angular.js version 1.2.6,
    ngAnimate provides a configuration setting for the $animate provider to filter
    out any possible animation operations on elements that do not contain any matching
    CSS classes against the given regular expression.


    ```

    myModule.config(function($animateProvider) {

    // a regular expression is the only valid parameter

    $animateProvider.classNameFilter(/animate/);

    });

    ```


    Now with the provided regular expression, /animate/, only CSS classes starting
    with animate will be processed for animation. As a result, .fade-in animation
    won''t work anymore and it will need to be renamed to .animate-fade-in to actually
    animate.


