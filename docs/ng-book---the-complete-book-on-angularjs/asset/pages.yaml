  md: "# Caching\n\n```\nangular.module('myApp')\n.config(function($httpProvider)\
    \ {\n  $httpProvider.defaults.cache =\n    $cacheFactory('myCache', {capacity:\
    \ 20});\n});\n```\n\nThe $http service will longer use the default cache it creates\
    \ for us; it will use our own cache, which is effectively now a Least Recently\
    \ Used (LRU) cache.\n\n+   An LRU cache keeps only the latest number of caches\
    \ based upon the capacity of the cache. That is, in our cache that has a capacity\
    \ of 20, the first 20 requests will be cached, but when the 21st comes in, the\
    \ least recently requested item will be deleted from the cache. The cache itself\
    \ takes care of maintaining the details about what to maintain and to remove."
