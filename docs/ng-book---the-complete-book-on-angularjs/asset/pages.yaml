  md: 'AngularJS and Internet Explorer


    It is good for reason that search engines do not include JS interpreters in their
    crawlers:

    They don''t need to, and doing so slows them down and makes them more inefficient

    for crawling the web.


    # Getting Angular Apps Indexed


    There are several different ways that we can tell Google to handle indexing our
    app. The first, more

    common approach is to use a back end to serve our Angular app. This method has
    the advantage of

    being simple to implement without much duplication of code.


    The second approach is to render all of the content delivered by our Angular app
    inside a <script>

    tag in our JavaScript. We''ll cover this topic lightly, implementing the <script>
    approach

    dep heavily upon how we deliver our apps. For instance, we can use a <script>
    tag when

    we''re rendering our pages on the server-side.


    # Server Side


    Google and other advanced search engines support the hashbang URL format, which
    we use to

    identify the current page that is being accessed at a given URL. These search
    engines transform this

    URL into a custom URL format that makes them accessible to the server.


    The search engine visits the URL and expects to get the HTML (with the fully rendered
    HTML

    content) that our browsers will receive. For instance, Google will turn the hashbang
    URL from:


    ```

    http://www.ng-newsletter.com/#!/signup/page

    ```


    into the URL:


    ```

    http://www.ng-newsletter.com/?_escaped_fragment_=/signup/page

    ```


    Within our Angular app, we need to tell Google to handle our site slightly differently
    depending\upon which style we handle.


    # Hashbang Syntax


    Google''s Ajax crawling specification was written and originally intended for
    delivering URLs

    the the hashbang syntax, which was an original method of creating permalinks for
    JS applications.


    We need to configure our app to use the hashPrefix (default) in our routing:'
