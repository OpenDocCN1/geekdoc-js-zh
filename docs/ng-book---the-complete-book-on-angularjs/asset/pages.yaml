  md: "# Next Steps\n\n```\nangular.module('myBestApp')\n.run(['$templateCache',\n\
    \  function($templateCache) {\n  // ...\n})\n```\n\n# prefix\n\nWe can set a prefix\
    \ for all of our template URLs. For instance, if we want to use absolute URLs\
