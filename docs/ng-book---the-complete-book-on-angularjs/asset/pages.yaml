  md: 'Describing how to implement server-side authentication is out of scope of this
    section; instead, we''ll focus on describing what our server-side back end needs
    to do to feature our front-end view.


    Then we''ll right into discussing how to provide client-side authentication protection
    and discuss potential edge cases for the process.


    # Server-Side Requirements


    First and foremost, we must take the time to secure our server-side API. As we
    are dealing with uncompiled code being sent by a potentially untrusted source,
    we cannot count on all of our users to be genuine.


    There are generally two ways we can handle securing our client-side app:


    # Server-Side Rendered Views


    If we''re serving our site through a back-end server that controls all of the
    HTML, we can use traditional authentication methods and only send the HTML that
    our client side needs and the server authenticates.


    # Pure Client-Side Authentication


    We want to build our client side and server side separately and allow the deployment
    of these components to be naturally separated in production. We therefore need
    to secure our client-side authentication using the server-side API, but not rely
    on its authentication.


    We''re going to implement client-side authentication through token authentication.
    Our server needs to be able to provide our client app with an auth token.


    The token itself should be a random string of numbers and letters that the server
    side can associate to a particular user session.


    > uuid libraries are generally good candidates for generating tokens.


    That is, when a user logs into our site, instead of sending a ID or using any
    identifiable information, our server side generates a random token and creates
    an association between the session and this token.


    We expect to send the token with every single client-side request so that we can
    look up the user by this random string of characters on each one.


    Our server then needs to send the proper status codes for the particular events
    that we get back, whether or not they are valid, so that our client side can react.


    For instance, for all unauthenticated requests, we want our server side to send
    back a 401 status code.


    The following table is a short list of response status codes we''ll deal with
    in this section:'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# Code


    # Meaning


    | Code | Meaning |

    | 200 | Everything is good |

    | 401 | Unauthenticated request |

    | 403 | Forbidden request |

    | 404 | Page not found |

    | 500 | Server error |


    When we encounter these status codes, our app reacts accordingly.

    The data flow looks like:


    +   1. Unauthenticated user visits our site.

    2. The user tries to access a protected resource and is redirected to the login
    page. 2a. The user visits the login page manually.

    3. The user enters his or her login ID (username or email) and password, and our
    Angular app makes a POST request to our server with the user''s data.

    4. Our server looks at the login ID and password and determines whether they are
    a match.

    5. If the login ID matches the password, the server generates a unique token and
    sends it back alongside the request and a 200 response code. If the login ID does
    not match the password, the server responds to the request with a status code
    of 401.


    For an authenticated user (someone who passes along the 5a path above):


    +   1. The user requests a protected resource path (such as his or her own account
    page).

    2. If the user has not logged in, our app redirects the user to the login page.
    2a. If the user is logged in, our app makes a request using the unique token for
    the session.

    3. The server validates this token and returns the appropriate data based on request.


    # Client-Side Authentication


    In the section above, we''ve outlined a few behaviors that our authentication
    scheme needs to handle:


    +   * Redirect on unauthorized page requests

    * Capture non-200 responses and act accordingly on any XHR request

    * Keep track of the user throughout the page session


    To handle redirection on unauthorized page requests, such as when an unauthorized
    user tries to access a protected resource, we need to determine how to define
    a protected resource as. public vs. non-public.


    There are several ways to handle defining routes as public vs. non-public.'
