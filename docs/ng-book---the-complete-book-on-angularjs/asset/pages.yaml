  md: '# Introduction to Directives


    ```

    <video href="goofy-video.mp4"></video>

    ```


    These new HTML5 tags work on newer browsers and are generally not supported by
    Internet Explorer version 8 and lower.


    # Directives: Custom HTML Elements and Attributes


    Given what we know about HTML elements, directives are Angular’s method of creating
    new HTML, elements that have their own custom functionality. For instance, we
    can create our own custom element that implements the video tag and works across
    all browsers:


    ```

    <my-better-video my-href="goofy-video.mp4">

    Can even take text</my-better-video>

    ```


    Notice our custom element has opening and closing tags, my-better-video, and a
    custom attribute, my-ref.


    To make our tag more usable, we could just override the browser-provided video
    tag, which means we could instead use:


    ```

    <video my-href="goofy-video.mp4">

    Can still take children nodes

    </video>

    ```


    As we can see, directives can be combined with other directives and attributes;
    this combination is called composition.


    To effectively understand how to compose a system from smaller parts, we must
    first understand the primitive pieces. Facilitating understanding will be the
    underlying goal of the next few chapters. Let’s get started.


    # Bootstrapped HTML


    When the browser loads our HTML page along with Angular, we only need one snippet
    of code to boot our Angular application (we learned it in the introductory chapter).


    In our HTML we need to mark up the root of our app using the built in directive
    ng-app. This directive is meant to be used as an attribute; thus, we could stick
    it anywhere, let’s choose the opening `<html>` tag, which is normative:


    > A built-in directive is one that ships out of the box with Angular. All built-in
    directives are prefixed with the ng namespace. In order to avoid namespace collisions,
    do not prefix the name of your own directives with ng.'
