  md: "# Introduction to Directives\n\n```\nscope {\n  someProperty: '@'\n}\n```\n\
    \nNote that, by default, someProperty maps to the DOM attribute some-property.\
    \ If we wanted to explicitly specify the name of the attribute we wanted to bind\
    \ to, we could do so:\n\n```\nscope {\n  someProperty: '@someAttr'\n}\n```\n\n\
    In this case, the HTML attribute would be named some-attr instead of some-property:\n\
