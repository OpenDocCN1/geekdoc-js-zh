  md: "# Services\n\nUp until now, we've only concerned ourselves with how the view\
    \ is tied to $scope and how the controller manages the data. For memory and performance\
    \ purposes, controllers are instantiated only when they are needed and discarded\
    \ when they are not. That means every time we switch a route or reload the view,\
    \ the current controller cleaned up by Angular.\n\nServices provides a method\
    \ for us to keep data around for the lifetime of the app and communicate across\
    \ controllers in a consistent manner.\n\nServices are singleton objects that are\
    \ instantiated once per app (by the $injector) and lazy-loaded (when necessary).\
    \ They provide an interface to keep together those methods that relate to a specific\
    \ function.\n\n$http, for instance, is an example of an AngularJS service. It\
    \ provides low-level access to the browser's XMLHttpRequest object. Rather than\
    \ needing to dirty the application with low-level calls to the XMLHttpRequest\
    \ object, we can simply inject it with the $http API.\n\n```\n// Example service\
    \ that holds on to the\n// current_user for the lifetime of the app\nangular.module('myApp',\
    \ [])\n.factory('UserS', function($http) {\n  var current_user;\n\n  return {\n\
    \    getCurrentUser: function() {\n      return current_user;\n    },\n    setCurrentUser:\
    \ function(user) {\n      current_user = user;\n    }\n  }\n});\n```\n\nAngular\
    \ comes with several built-in services with which we'll interact consistently.\
    \ It will also be useful to make our own services for any decently complex application.\n\
    \nAngularJS makes it very easy to create our own services: All we need to do is\
    \ register the service. Once a service is registered, the Angular compiler can\
    \ reference it and load it as a dependency for runtime time. The name registry\
    \ makes it easy to isolate application dependencies for mocks and stubbing in\
    \ our tests."
  merge: -1
  pgno: 168
