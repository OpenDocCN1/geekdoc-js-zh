  md: "# Introduction to Directives\n\nObserving the href within the Chrome developer\
    \ tools suggests that we're not binding our internal $scope property myUrl to\
    \ the external attribute some-attr in the opposite direction. The value was copied\
    \ onto our isolate scope via an attribute value, shouldn't it also set that attribute's\
    \ value?\n\n![](img/c29f4deabfb2aac07907f28672b2ed83_87_0.png)\n\nThis behavior\
    \ occurs because the built-directive, ng-model, is set up with a two-way binding\
    \ between its own isolate scope and the scope of the DOM (provided by a controller).\n\
    \nLet's imitate the setup in attempt to make our work example. Our goal is to\
    \ understand two-way bindings and the behavior of ng-model in the process.\n\n\
    Two-way bindings are perhaps the most important feature in Angular that we can't\
    \ get with, say, jQuery out of the box. To understand the magic, however, we need\
    \ to implement it. Luckily, we're only a few keystrokes away. Let's finish our\
    \ example by creating a two-way data binding between our isolate $scope and the\
    \ isolate $scope inside ng-model. We do that by binding our internal $scope.myUrl\
    \ property with a property named theirUrl on the $scope of the current controller\
    \ (or $rootScope) using scope lookup in the DOM.\n\nIn the process, let's also\
    \ add an additional text field so that each side of the binding has its own text\
    \ field. Having two fields will make it easy to see how scope is linked via prototypal\
    \ inheritance in the DOM.\n\n```\n<label>Their URL</label>\n<input type=\"text\"\
    \ ng-model=\"theirUrl\">\n<div my-directive\n  some-attr=\"theirUrl\"\n  my-link-text=\"\
    Click me to go to Google\"></div>\n```"
