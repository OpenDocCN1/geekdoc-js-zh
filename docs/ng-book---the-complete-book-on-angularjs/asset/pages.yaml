    \    function($sceDelegateProvider) {\n      // Set a new whitelist\n      $sceDelegateProvider.resourceUrlWhitelist(['..*']);\n\
    \  });\n```\n\nBy default, the whitelist is set to ['self'].\n\n# Blacklisting\
    \ URLs\n\nIt's also possible to blacklist URLs instead of whitelisting. Whitelisting,\
    \ but we can use them in combination. It's useful to whitelist a trusted domain\
    \ and blacklist open redirects by our domains.\n\nTo set a new blacklist, we use\
    \ the resourceUrlBlacklist() method. This method takes one optional parameter."
