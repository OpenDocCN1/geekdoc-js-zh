  md: '# has()


    The has() method returns true if the injector knows that a service exists in its
    registry and false if it does not. It takes a single argument:


    +   - name (string)


    The string is the name of the service we want to look up in the injector''s registry.


    # instantiate()


    The instantiate() method creates a new instance of the JavaScript type. It takes
    a constructor invokes the new operator with all of the arguments specified. It
    takes two arguments:


    +   - Type (function)


    This function is the annotation constructor function to invoke.


    +   - locals (object – optional)


    This optional argument provides another way to pass argument names into the function
    when it is invoked.


    The instantiate() method returns a new instance of Type.


    # invoke()


    The invoke() method invokes the method and adds the method arguments from the
    $injector. The invoke() method takes three arguments:


    +   - fn (function)


    This function is the one to invoke. The arguments for the function are set with
    the function annotation.


    +   - self (object – optional)


    The self argument allows for us to set this argument for the invoke method.


    +   - locals (object – optional)


    This optional argument provides another way to pass argument names into the function
    when it is invoked.


    The invoke() method returns the value that the fn function returns.'
