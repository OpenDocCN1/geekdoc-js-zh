  md: '# # Essential AngularJS Extensions


    One of the most popular and highly supported AngularJS plugins is the the AngularUI
    framework.


    # ## AngularUI


    AngularJS itself is packed full out-of-the-box features that we can use to build
    an expressive AngularJS app without relying on separate libraries; however, the
    very active AngularJS community has built some great libraries that we can take
    advantage of to maximize the power of our apps.


    In this section, we''re covering several different and most commonly used components
    of the AngularJSUI109 library.


    The AngularUI library has been broken out into several modules so that, rather
    than including the entire suite, we can pick and choose the components that we''re
    interested in using.


    As we walk through the different components, we''ll need to ensure that we install
    each of the different components with which we are going to work.


    # ## Installation


    For each component, we can either download the individual JavaScript library and
    place it in our application path or we can use Bower110 to complete our installation.
    We at ng-newsletter.com111 recommend using Bower. For the purposes of this chapter,
    we''ll cover installing each module only with Bower.


    # ## ui-router


    One of the most useful libraries that the AngularJS library gives us is the ui-router.
    It''s a framework that allows us to organize our interface by a state machine,
    rather than a simple URL route.


    > 109http://angular-ui.github.io/

    110http://bower.io/

    111http://ng-newsletter.com'
  merge: -1
  pgno: 451
- img_proc: true
  md: '# Installation


    To install the ui-router library, we can either download the release<sup>112</sup>
    or use Bower to install the library.


    Make sure you have Bower installed globally:


    ```

    $ npm install bower -g

    ```


    Use Bower to install the angular-ui library:


    ```

    $ bower install angular-ui-router --save

    ```


    We''ll need to make sure we link the library to our view:


    ```

    <script type="text/javascript" src="app/bower_components/angular-ui-router/release/angular-ui-router.js"></script>

    ```


    And we''ll need to inject the ui-router as a dependency in our app:


    ```

    angular.module(''myApp'', [''ui.router''])

    ```


    Now, unlike the built-in ngRoute, the ui-router can nest views as it works off
    states, rather than using a url.


    Instead of using the ng-view directive as with the ngRoute service, we''ll use
    the ui-view directive with ngRoute.


    When dealing with routes and states inside of ui-router, we''re mainly concerned
    with in which state application and at which route the web app currently stands.


    ```

    <div ng-controller="DemoController">

    <div ui-view></div>

    </div>

    ```


    Just like ngRoute, the templates we define at any state are placed inside the
    <div ui-view> element. Each of these templates can include its own ui-view, as
    well. This fact allows us to use nested views inside our routes.


    To define a route, we use the .config method, just like normal, but instead of
    setting routes on $routeProvider, we set our states on the $stateProvider.


    > <sup>11</sup>http://angular-ui.github.io/ui-router/release/angular-ui-router.js'
