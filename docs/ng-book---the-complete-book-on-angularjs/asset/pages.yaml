  md: '# Server Communication


    The first step to creating an AWS-based Angular app is to set up this relatively
    complex authentication and authorization that we''ll use throughout the process.


    Currently (at the time of this writing), the AWS JS library integrates cleanly
    with three authentication providers:


    +   - Facebook

    - Google Plus

    - Amazon Login


    In this section, we''ll be focusing on integrating with the Google+ API to host
    our login, but the process is very similar for the other two authentication providers.


