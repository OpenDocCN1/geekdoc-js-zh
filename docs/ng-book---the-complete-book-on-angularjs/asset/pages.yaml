    $location.search();


    We can pass in new search parameters, thus modifying the search portion of the
    URL:


    ```

    // Setting search with an object

    $location.search({name: ''Ari'', username: ''ouser''});

    // Setting search with a string

    $location.search(''name=Ari&username=ouser'');

