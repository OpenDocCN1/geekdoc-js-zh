  md: "# HTTP GET Methods\n\nThe two HTTP GET methods it expect the following three\
    \ parameters:\n\n+   - params (object)\n\nThese are the parameters that are sent\
    \ with the request. They can be named parameters in the URL, or they can be query\
    \ parameters.\n\n+   - successFn (function)\n\nThis function is the callback function\
    \ that will be called upon a successful HTTP response.\n\n+   - errorFn (function)\n\
    \nThis callback function is called upon a non-successful HTTP response.\n\n# get(params,\
    \ successFn, errorFn)\n\nThe get method sends a GET request to the URL and expects\
    \ a JSON response.\nWithout specifying a named parameter, such as above, the get()\
    \ request is generally used to get a single resource.\n\n```\n// Issues a request\
    \ to:\n// GET /api/users\nUser.get(function(resp) {\n    // Handle successful\
    \ response here\n}, function(err) {\n    // Handle error here\n});\n```\n\nIf\
    \ the named parameter is passed into the parameters (in our example, this parameter\
    \ is id), then the get() method will send a request to the URL with the id in\
    \ the URL:"
  merge: -1
