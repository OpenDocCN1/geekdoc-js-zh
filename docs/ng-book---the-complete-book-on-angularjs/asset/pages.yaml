  md: "# Expressions\n\n```\nangular.module('emailParser', [])\n.config(['$interpolateProvider',\n\
    \  function($interpolateProvider) {\n  $interpolateProvider.startSymbol('__');\n\
    \  $interpolateProvider.endSymbol('__');\n})])\n.factory('EmailParser', ['$interpolate',\n\
    \  function($interpolate) {\n  // a service to handle parsing\n  return {\n  \
    \  parse: function(text, context) {\n      var template = $interpolate(text);\n\
    \      return template(context);\n    }\n  };\n}}]);\n```\n\nNow that we have\
    \ created this module, we can inject it into our app and run the email parser\
    \ on the text in our email body:\n\n```\nangular.module('MyApp', ['emailParser'])\n\
    .controller('MyController',\n['$scope', 'EmailParser',\n  function($scope, EmailParser)\
    \ {\n  // Set up a watch\n  $scope.watch('emailBody', function(body) {\n    if\
    \ (body) {\n      $scope.previewText =\n        EmailParser.parse(body, {\n  \
    \      to: $scope.to\n      });\n    }\n  });\n}]);\n```\n\nNow, of requiring\
    \ the text to use the default syntax with the {{ }} symbols, we can define our\
