  md: '# AngularJS and Internet Explorer


    AngularJS works seamlessly with most modern browsers. Safari, Google Chrome, Google
    Canary, and Firefox work great. The notorious Internet Explorer version 8 and
    earlier can cause you problems.


    For more information, read the AngularJS docs guide on IE12²¹


    If we are planning release our applications for Internet Explorer v8.0 or earlier,
    we need to pay some extra attention to help support it.


    Internet Explorer does not like elements that start with a prefix ng: because
    it considers the prefix to be unknown IE will ignore these elements unless the
    elements have a corresponding namespace declaration:


    ```

    <html xmlns:ng="ignored">

    ```


    This xmlns:ng="http://angularjs.org" makes IE feel more comfortable.


    If we use non-standard HTML tags, we need to create the tags in the head of the
    document if we want to recognize them. We can do so simply in the head element.


    ```

    <doctype html>

    <html xmlns:ng="http://angularjs.org">

    <head>

    <!--[if it IE 8]

    <script>

    document.createElement(''ng-view'');

    // Other custom elements

    </script>

    <![endif]-->

    </head>

    <body>

    <!-- ... -->

    ```


    It is recommended that we use the attribute directive form, as we don''t need
    to create custom elements to support IE:


    ²¹http://docs.angularjs.org/guide/ie'
