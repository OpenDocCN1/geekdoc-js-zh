  md: '# Data Binding and Your First AngularJS Web Application


    MVC is a software architecture pattern that separates representation from user
    interaction. Generally, the model consists of application data and functions that
    interact with it, the view presents this data to the user; the controller mediates
    between the two.


    This separation presentation¹ makes a clear division between objects in our web
    app so that the view doesn''t need to know how to save an object - it needs to
    know how to display it. Meanwhile, the model doesn''t need to interact with the
    view - it just needs to contain the data and methods to manipulate the view. The
    controller is where we''ll place the logic to bind to the two.


    When getting into the source (available at AngularJS.org⁴), Angular simply remembers
    the value that the model contains at any given time (in our example from hello
    world, the value of name).


    When Angular thinks that the value could change, it will call $digest() on the
    value to check whether the value is "dirty". Hence, when the Angular is running,
    it will look for potential changes on the value.


    This process is dirty checking. Dirty checking is a relatively efficient approach
    to checking for changes on a model. Every time there could be a potential change,
    Angular will do a dirty check inside its event loop (discussed in the under head)
    to ensure everything is consistent.


    When using frameworks like AngularJS, which attaches a function (as a change listener)
    to the change event, the process is significantly more complex and relatively
    more inefficient. Dealing with change coalescence, dependency tracking, and the
    multitude of event firing is complex and often causes problems in performance.


    Although there are more efficient ways to do it, dirty checking always works in
    every browser and is predictable. A lot of software that needs speed and efficiency
    uses the dirty checking approach.


    AngularJS removes the need to build complex and novel features in JavaScript in
    order to build fake automatic synchronization in views.


    # Simple Data Binding


    To review the code we just wrote, what we did bind the "name" attribute to the
    input field using the ng-model directive in the containing model object ($scope).


    All that means is that whatever value is placed in the input field will be reflected
    in the model object.


    > ¹http://martinfowler.com/eaaDev/uAiArchs.html

    ⁴http://angular.org'
