  md: '# Controllers


    Controllers in AngularJS exist to augment the view of an AngularJS application.
    As we saw in our Hello world example application, we did not use a controller,
    but only an implicit controller.


    The controller in AngularJS is a function that adds additional functionality to
    the scope of the view. We use it to set up an initial state and add custom behavior
    to the scope object.


    When we create a new controller on a page, AngularJS passes it a new $scope. This
    $scope is where we can set the initial state of the scope of our controller. Since
    AngularJS takes care of handling the controller for us, we only need to write
    the constructor function.


    Setting up an initial controller looks like this:


    ```

    function FirstController($scope) {

    $scope.message = "hello";

    }

    ```


    > It is considered a best-practice to name our controllers as [Name]Controller,
    rather than [Name]Ctrl.


    As we can see, Angular will call the controller method when it creates the scope.


    The observer will notice we created this function in the global scope. Doing so
    is usually poor form, as we don''t want to dirty the global namespace. To create
    more properly, we create a module and then let the controller atop our module,
    like:


    ```

    var app = angular.module(''app'', []);

    app.controller(''FirstController'', function($scope) {

    $scope.message = "hello";

    });

    ```


    To create custom actions we can call in our views, we can simply create functions
    on the scope of the controller. Luckily for us, AngularJS allows our views to
    call functions on the $scope, just as if we were calling data.


    To bind buttons or links (or any DOM element), we''ll use another built-in directive,ng-click.
    The ng-click directive binds the mouseup click event to the method handler, which
    calls the method specified on the DOM element (i.e., when the browser fires a
    click event on the DOM element, the method is called). Similar to our previous
    example, the binding looks like:'
  merge: -1
  pgno: 36
