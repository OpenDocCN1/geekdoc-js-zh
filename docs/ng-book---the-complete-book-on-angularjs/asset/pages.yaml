    \n```\napp.controller('FirstController', function($scope) {\n  $scope.counter\
    \ = 0;\n  $scope.add = function(amount) { $scope.counter += amount; }\n  $scope.subtract\
    \ = function(amount) { $scope.counter -= amount; }\n});\n```\n\nSetting our FirstController\
    \ in this manner allows us to call or subtract functions (as we've seen) that\
    \ are defined on the FirstController scope or a containing parent $scope.\n\n\
    Using controllers allows us to contain the logic of a single view in a single\
    \ container. It's good practice to keep slim controllers. One way that we as AngularJS\
    \ developers can do so is by using the dependency injection feature of AngularJS\
    \ to access services.\n\nOne major distinction between AngularJS and other JavaScript\
    \ frameworks is that the controller is not the appropriate place to do any DOM\
    \ manipulation or formatting, data manipulation, or state maintenance holding\
    \ the model data. It is simply the glue between the view and the $scope model.\n\
    \nAngularJS also makes it possible to set any types on the $scope, including objects\
    \ and show the properties in the view.\n\nFor example, we will simply create a\
    \ person object on the controller MyController that has a single attribute of\
    \ name:\n\n```\napp.controller('MyController', function($scope) {\n  $scope.person\
