  md: '# Event Object


    The event object has the following attributes:


    # targetScope (scope object)


    This attribute is the scope emitting or broadcasting the event.


    # currentScope (scope object)


    This object contains the current scope that is handling the event.


    # name (string)


    This string is the name of the event that was fired and we are handling.


    # stopPropagation (function)


    The stopPropagation() function cancels any further event propagation for events
    that are fired through `$emit`.


    # preventDefault (function)


    The preventDefault sets the flag of defaultPrevented to true. Although we cannot
    stop event propagation, we can tell child scopes that we don''t need to handle
    the event (i.e., that we can safely ignore them).


    # defaultPrevented (boolean)


    Calling preventDefault() sets defaultPrevented to true.

    The $on() function returns a de-registration function that we can call to cancel
    the listener.


    # Core Services Riding on Events


    The Angular core framework sends events that we listen for and upon which we can
    act. We''ll use these events to provide our custom Angular objects the ability
    to interact with our app at different levels of global state.


    There are several events that we call with `$emit()`, sending their events upward,
    and several more that we call as `$broadcast()` events.


    # Core System Emitted Events


    The following events are emitted from directives upward to scopes containing the
    directive invocation. We can use `$on()` to listen to these methods in any scope
    above the chain:'
