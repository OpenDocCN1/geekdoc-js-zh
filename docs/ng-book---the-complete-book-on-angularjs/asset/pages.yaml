  md: '# Introducing the $cacheFactory


    The $cacheFactory is the service that generates cache objects for all Angular
    services. Internally, the $cacheFactory creates a default cache object, even if
    we don''t create one explicitly.

    To create a cache object, we use the $cacheFactory and create a cache object by
    ID:


    ```

    var cache = $cacheFactory;

    create(''myCache'');

    ```


    Here, we''ve defined a cache with the ID myCache. The $cacheFactory function can
    take up to two arguments:


    cacheld(string) The cacheid is the name of ID of the cache that we''re creating.
    It can be referenced by the get() method by the name of the cache.


    options (object) The options specify how the cache will behave. Currently, the
    options object can take a key:


    +   - capacity (number)


    The capacity describes the maximum number of cache key-value pairs the cache will
    store and keep at any given time.

    The $cacheFactory() method returns a cache object.


    # Cache Object


    The cache object itself has the following methods that we can use to interact
    with the cache.


    info() The info() method returns the ID, size, and options of the cache.


    put() The put() method allows to put a key (string) of any JavaScript object value
    into the cache.


    ```

    cache.put("hello", "world");

    ```


    put() method returns the value of the cache that we put in.


    get() The get() method gives us access to the cache value for a key. If the key
    is found, it returns the value, whereas if it is not found, it returns undefined.'
  merge: -1
  pgno: 510
- img_proc: true
  md: 'Caching


    ```

    cache.get("hello");

    ```


    remove() The remove() function removes a key-value pair from the cache, if it''s
    found. If it''s not found, then it just returns undefined.


    ```

    cache.remove("hello");

    ```


    removeAll() The removeAll() function resets the cache and removes all cached values.


    destroy() The destroy() method removes all references of this cache from the $cacheFactory
    cache registry.


    # Caching through $http


    Angular''s $http service creates a cache with the ID $http (surprise, right?).
    Enabling the $http request to use this default cache object is simple: The $http
    method(s) allow us to pass a cache parameter.


    # Default $http Cache


    The default $http cache can be particularly useful when our data doesn''t change
    very often. We can set it like so:


    ```

    $http{

    method: ''GET'',

    url: ''/api/users.json'',

    cache: true

    }

    // Or, using the .get helper

    $http.get(''/api/users.json'', {

    cache: true

    }

    ```


    Every request that is made through $http to the URL /api/users.json will be stored
    in the default $http cache. The key for this request in the $http cache is the
    full-path.


    By passing the true parameter in the $http options, we''re telling the $http service
    to use the default cache. It''s useful to use the default cache if we don''t want
    to manage the cache that all often.


    We can, however, manipulate the default $http cache if we need to (e.g., if another
    request we make without caching notifies us of a delta change, we can clear the
    request in the default $http request).


    To reference the $http default request, we simply fetch the cache through the
    $cacheFactory ID:'
