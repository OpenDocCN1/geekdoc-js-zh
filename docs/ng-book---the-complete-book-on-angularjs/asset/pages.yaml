  md: '# Localization


    As worldwide access to the web increases, as we developers are constantly pressed
    to make our apps internationally and locally accessible. When a user visits our
    apps, he or she should be able to switch languages on the fly at runtime.


    Given that we are building AngularJS client-side apps, we don''t particularly
    want the user to refresh the page or visit an entirely different URL. Of course,
    AngularJS could easily accommodate your international audience natively, perhaps
    by generating different templates for different languages and serving those within
    the app.


    This process can become cumbersome, however, and what happens when you want to
    change the layout of the app? Every single template needs to be rebuilt and redeployed.
    This process should just be easy.


    # angular-translate


    Instead of creating new templates, we can use angular-translate, an AngularJS
    (internationalization) module that brings i18n to your Angular app. angularjs-translate
    requires us to create a JSON file that represents translation data per language.
    It lazy loads the language-specific translation from the server only when necessary.


    The angular-translate library comes with built-in directives and filters that
    make it simple to internationalize our apps. Let''s get started.


    # Installation


    To use angular-translate, we need to load the library. We can install it in several
    different ways, but we prefer using Bower.


    Bower is a front-end package manager. It handles not only JavaScript libraries,
    but also HTML, CSS, and image packages. A package is simply encapsulated, third-party
    code that is typically publicly accessible in a repository.


    +   - Using Bower


    We install angular-translate using the normal Bower process:'
  merge: -1
  pgno: 493
- img_proc: true
  md: "$ bower install angular-translate\n\nAlternatively, we can download the minified\
    \ version of angular-translate from GitHub.\n\nOnce we've installed the latest\
    \ stable version of angular-translate, we can simply embed it in our HTML document.\
    \ Just make sure it's embedded after angular itself, as it depends on the core\
    \ angular library.\n\n```\n<script src=\"path/to/angular.js\"></script>\n<script\
    \ src=\"path/to/angular-translate.js\"></script>\n```\n\nLast but not least, our\
    \ app for angular-translate as a load dependency:\n\n```\nvar app = angular.module('MyApp',\
    \ ['pascalprecht.translate']);\n```\n\nGreat! Now we're ready to use angular-translate's\
    \ components to translate our app.\n\n# Teaching Your App a New Language\n\nOur\
    \ app depends on angular-translate as installed, and our app declares it as a\
    \ dependency, we can use it to translate our app's contents.\n\nFirst, we need\
    \ to provide translation material so our app can actually speak a new language.\
    \ This step entails configuring the $translate service through our fresh $translateProvider\
    \ service.\n\nTraining our app to use a new language is simple. Using the config\
    \ function on our app, we provide the different languages for translation (i.e.,\
    \ English, German, Hebrew, etc.). First, we inject our $translateProvider in the\
    \ config function, like so:\n\n```\nangular.module('angularApp', ['pascalprecht.translate'])\n\
    .config(['$translateProvider', function($translateProvider) {\n  // Our translations\
    \ will go in here\n});\n```\n\nTo add a language, we have to make $translateProvider\
    \ aware of a translation table, which is a JSON object containing messages (keys)\
    \ that we will translate into values. Using a translation table enables us to\
    \ write our translations as simple JSON for loading remotely or setting at compile\
    \ time, as as:"
  merge: -1
  pgno: 494
- img_proc: true
  md: "```\n{\n  'MESSAGE': 'Hello world',\n}\n```\n\nIn a translation table, the\
    \ key represents a translation ID, whereas the value represents the concrete translation\
    \ for a certain language. Now we add a translation table to your app. $translateProvider\
    \ provides a method called translations() to take care of.\n\n```\napp.configfunction\
    \ [$translateProvider], ($translateProvider) {\n  $translateProvider.translations({\n\
