  md: "# Working with JSON\n\nJSON, or JavaScript Object Notation, is a data-interchange\
    \ format that looks a lot like a JavaScript object. In fact, it resolves one when\
    \ JavaScript loads it, and Angular will resolve any requests that respond with\
    \ a JavaScript object in JSON format to a corresponding object for our Angular.\n\
    For instance, if our server returns the following JSON:\n\n```\n[\n  {\"msg\"\
    : \"This is the first msg\", state: 1},\n  \"msg\": \"This is the second msg\"\
    , state: 2},\n  \"msg\": \"This is the third msg\", state: 1},\n  \"msg\": \"\
    This is the fourth msg\", state: 3}\n]\n```\n\nWhen our Angular app receives this\
    \ data from $http, we can simply reference the data as a JavaScript object:\n\n\
    ```\n$http.get('/v1/messages.json')\n.success(function(data, status) {\n  $scope.first_msg\
    \ = data[0].msg;\n  $scope.first_state = data[0].state;\n});\n```\n\n# Working\
    \ with XML\n\nAlthough Angular transparently handles JSON objects handed back\
    \ from the server, we can handle other data types as well.\n\nFor instance, if\
    \ our server us back XML instead of JSON, we need to massage the data into a JavaScript\
    \ object.\n\nLuckily, there are some great open-source libraries available, as\
    \ well as some built-in browser parsers that parse XML into JavaScript objects\
    \ for us.\nFor the moment, we'll use the X2JS library, a fantastic open-source\
    \ library available here⁷.\nFirst, we need to make sure we install the X2JS library.\
    \ Let's use Bower to install the library for us:\n\n```\n$ bower install x2js\n\
    ```\n\nand then reference the library from the googlecode.com or from our Bower\
    \ components:\n\n> ⁷https://code.google.com/p/x2js/"
  merge: -1
  pgno: 228
- img_proc: true
  md: "# XHR in Practice\n\n```\n<script type=\"javascript\"\nsrc=\"https://x2js.googlecode.com/hg/xml2json.js\"\
    ></script>\n<!-- OR --\n<script type=\"javascript\"\nsrc=\"bower-components/xml2jsonjson.js\"\
    ></script>\n```\n\nStarting with our lightweight XML parser, we create a factory\
    \ that simply parses the XML in the DOM for us.\n\n```\nangular.factory('xmlParser',\
    \ function() {\n  var x2Js = new X2JS();\n  return {\n    xml2json: x2js.xml2json,\n\
    \    json2xml: x2js.json2xml_str\n  };\n});\n```\n\nWith this lightweight factory,\
    \ we can create a transformResponse to parse our XML within our $http requests,\
    \ as such:\n\n```\nangular.factory('Data', [$http, 'xmlParser',\nfunction(\\$http,\
    \ xmlParser) {\n  $http.get('/api/msgs.xml', {\n    transformResponse:\n     \
    \ function(data) {\n        return xmlParser.xml2json(data);\n      }\n  });\n\
    });\n```\n\nNow, our response will come back as a JSON object, and we can use\
    \ the response just as though the server returned JSON.\n\n# Authentication with\
    \ AngularJS\n\nIn most non-trivial web applications, there are usually protected\
    \ resources that we want to keep secret from the general public and to which we\
    \ want to give access to authenticated users whom we know and trust. These resources\
    \ can be anything from paid material to administration ability.\n\nRegardless\
    \ of what we are protecting, the methods that we can use to protect our resources\
    \ will be similar."
