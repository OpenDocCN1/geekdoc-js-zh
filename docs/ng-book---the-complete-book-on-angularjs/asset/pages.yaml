  md: "# Routing Modes\n\nThe routing mode refers specifically to the format of the\
    \ URL in the browser address bar. The default behavior of the $location service\
    \ is to route using the hashbang mode.\n\nThe routing mode determines what the\
    \ URL of your site will look like.\n\n# Hashbang Mode\n\nHashbang mode is a trick\
    \ that Angular uses to provide deep-linking capabilities to your Angular apps.\
    \ In hashbang mode (the fallback for html5 mode), URL paths take a prepended #\
    \ character. They do not rewrite <a href=\"/</a> tags and do not require any server-side\
    \ support. Hashbang mode is the default mode that Angular uses if it's not told\
    \ otherwise.\n\nA hashbang URL looks like:\n\n```\nhttp://yite.com/#/inbox/all\n\
    ```\n\nTo enable and configure hashbang mode, it needs to be configured in the\
    \ config function on an app module.\n\n```\nangular.module('myApp', ['ngRoute'])\n\
    \  .config([$locationProvider], function($locationProvider) {\n    $locationProvider.html5Mode(false);\n\
    \  });\n```\n\nWe can also configure the hashPrefix, which, in hashbang mode,\
    \ is the ! prefix. This prefix is part of the fallback mechanism that Angular\
    \ uses for older browsers. We can also configure this character.\n\n```\nangular.module('myApp',\
    \ ['ngRoute'])\n  .config([$locationProvider], function($locationProvider) {\n\
    \    $locationProvider.html5Mode(false);\n    $locationProvider.hashPrefix('!');\n\
    \  });\n```\n\n# HTML5 Mode\n\nThe other routing mode that Angular supports is\
    \ html5Mode. This makes your URLs look like regular URLs (except that in older\
    \ browsers they will look like the hashbang URL). For instance, the same route\
    \ above in HTML5 mode would look like:"
