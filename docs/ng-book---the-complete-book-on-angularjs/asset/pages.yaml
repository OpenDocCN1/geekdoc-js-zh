  md: "Next Steps\n\n# grunt-angular-templates\n\nBy default, Angular fetches templates\
    \ over XHR when it cannot find them locally in its$templateCache. When the XHR\
    \ request is slow or our template is large, it can seriously negatively impact\
    \ our users' experience of our.\n\nOne way we can avoid this delay is by \"faking\"\
    \ the $templateCache into thinking that it has already filled up, so Angular doesn't\
    \ have to load the templates from afar. We can do this manually in JavaScript\
    \ like:\n\n```\nangular.module('MyApp', [])\n.run(function($templateCache) {\n\
    \  $templateCache.put('home.html',\n  'This is the home template');\n});\n```\n\
    \nNow, Angular will fetch the template named 'home.html', it will find it in the\
    \ $templateCache and not need to fetch it from the server.\n\nThis step is quite\
    \ cumbersome to do manually if we want to package our app for our servers. Luckily,\
    \ the grunt-angular-templates grunt task does for us.\n\n# Installation\n\nFirst,\
    \ we need to install the grunt task. We can install it with npm as follows:\n\n\
    +   * npm install --save-dev grunt-angular-templates\n\n> We use the --save-dev\
    \ task to store the grunt task in our package.json file, and it's good practice\
    \ to do so. Saving the dependencies and their versions for easily creating development\
    \ environments for our application. If we're not using a package.json file, then\
    \ we can ignore this flag, but it won't do any harm to keep it in. npm will simply\
    \ output a message warning that we're not using package.json.\n\nNext, we need\
    \ to reference this task in our Gruntfile.js file, like so:\n\n```\ngrunt.loadTasks('grunt-angular-templates');\n\
    ```\n\nNow, we can safely use this task in our Grunt tasks.\n\n# Usage\n\nThe\
    \ task itself compiles a JavaScript file that we need to load inside of our index.html.\
    \ For instance, if we tell the task to generate the templates.js file, we need\
    \ to load it inside of our index.html:"
