  md: '# Testing


    helpers.js

    unit/

    e2e/


    The app/ layout is standard, wherein we divide our application code. The test/
    directory nests our tests in the appropriate directories that reflect the type
    of test: unit/ or e2e.


    There are two Karma configuration files in the test/ directory. Each of these
    files contains the specific type of test that it will run. As we walk through
    each type of test, we will discuss how Karma configuration should look and how
    to customize it for our use.


    Running a Karma test is simple: karma start path/to/karma/config.js. When the
    test runner starts up, it will show the browsers listed in the Karma config file.


    ![](img/c29f4deabfb2aac07907f28672b2ed83_310_0.png)


    Running Karma with Chrome and Safari


    By default, if not otherwise specified, Karma will watch all the files listed
    in the Karma configuration. Any time a file changes, Karma will run the appropriate
    tests.


    # Initializing Karma Config File


    Karma gives us a generator to help build configuration files. This generator will
    ask a few questions about how we want to set up our configuration. Each question
    suggests a default value so it is possible to simply accept the default values,
    which we''ll do in a moment.'
  merge: -1
