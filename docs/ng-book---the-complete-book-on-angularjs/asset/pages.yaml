  md: "# exclude\n\nKarma can exclude any of files that we don't want included when\
    \ loading our tests. The exclude option allows us to set a list of files we don't\
    \ want included by default. This array is useful if you are using RequireJS, for\
    \ example.\n\n```\nexclude: [\n  'public/index.html'\n]\n```\n\n# basePath\n\n\
    We can set the root path where we want relative paths defined in the files and\
    \ exclude properties by using the basePath option. If the basePath is a relative\
    \ path, then it will be resolved relative to the Karma configuration file is (_dirname).\n\
    \n```\nbasePath: '..'\n```\n\n# autoWatch\n\nSetting autoWatch to true will trigger\
    \ karma to execute the configured tests whenever the files in files are changed.\
    \ It is useful to set this to false when using a continuous integration server\
    \ where watching file changes are unnecessary.\n\n```\nautoWatch: true,\n```\n\
    \n# captureTimeout\n\nIf the browser loads in more time than the captureTimeout\
    \ (defaults to 60 seconds or 60000 ms), Karma will kill the process and try again.\
    \ If it fails after three attempts, Karma will give up trying to launch the browser.\n\
    \n```\ncaptureTimeout: 60000\n```\n\n# colors\n\nKarma's default output will include\
    \ color. If you do not want to include color output in your terminal, you can\
