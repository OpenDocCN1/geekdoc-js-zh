    \ being called fairly easily: We'll simply test that the functionality event cases\
    \ is firing as we expect.\n\n# Continuous Integration for Angular\n\nAngular's\
    \ Karma works wonderfully with continuous integration services. Continuous integration\
    \ services, or CI for short, allows us a gateway for deployment and allows us\
    \ to be confident that every check-in of our code is working as expected.\n\n\
    Continuous integration servers are used by developers and small companies all\
    \ over the world, and it's a good idea to learn how to set them up. Both JenkinsCI\
    \ and TravisCI integrate with Karma, and we strongly encourage our readers to\
    \ use them.\n\n# Protractor\n\nThe new end-to-end testing framework, called Protractor,\
    \ will eventually replace the current framework as the default framework.\n\n\
    Unlike the Angular scenario runner, Protractor is built on WebDriver, which is\
    \ an API for controlling browsers, written in extensions.\n\nWebDriver has controller\
    \ extensions for IE, Chrome, Safari, Firefox, and more to give us options and\
    \ a variety of browsers to test against. This has many benefits, including being\
    \ more stable and quicker.\n\nProtractor, like the Angular scenario runner, implements\
    \ Jasmine as its test scaffolding so we don't need to learn a completely new testing\
    \ framework to use it.\n\nProtractor itself can be installed as a standalone runner\
    \ or it can be embedded into your tests as a library.\n\n# Installation\n\nWe\
    \ can install Protractor with npm:\n\n+   8⁸http://jenkins-ci.org/\n9⁹https://travis-ci.org/\n\
    9⁹https://code.google.com/p/selenium/wiki/WebDriverJs"
