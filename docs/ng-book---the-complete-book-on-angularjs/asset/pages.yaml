    \ a few types of objects that we can inject into the .config() function: providers\
    \ and constants. If we inject any service into a .config() function, then we might\
    \ accidentally instantiate one before we actually configure it.\n\nThe by-product\
    \ of this strict requirement for configurable services is that we can only inject\
    \ services that are built with the provider() syntax and cannot inject other services.\n\
    \nFor more information on how to build with the provider syntax, head over to\
