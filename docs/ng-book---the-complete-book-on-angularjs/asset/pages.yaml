  md: "# Introduction to Directives\n\nBe aware that there are other built-in directives,\
    \ like ng-include and ng-view, that create a new child scope, meaning they behave\
    \ similar to ng-controller when invoked. We can even create a new child scope\
    \ when building a custom directive of our own.\n\n# Passing Data into a Directive\n\
    \nLet's recall our directive definition:\n\n```\nangular.module('MyApp', [])\n\
    .directive('myDirective', function() {\n  return {\n    restrict: 'A',\n    replace:\
    \ true,\n    template: '<a href=\"http://google.com\">Click me to go to Google</a>'\n\
    \  };\n});\n```\n\nNotice that in our template we are hardcoding the URL and the\
    \ text of our link:\n\n```\ntemplate: '<a href=\"http://google.com\">\\nClick\
    \ me to go to Google\n</a> '\n```\n\nWith Angular, we aren't limited to hard coding\
    \ strings in the template of our directive.\nWe can provide a nicer experience\
    \ for others using our directive if we specify the URL and link text without missing.\
    \ Our goal is to pay attention to the public interface of our directive, just\
    \ as we would in any programming language. In essence, we'd to turn the above\
    \ template string into one that takes two variables: one for the URL and one for\
    \ the link's text:\n\n```\ntemplate: '<a href=\"{{myUrl}}\">{{myLinkText}}</a>'\n\
    ```\n\nLooking at our main HTML document, we declare our directive with attributes\
    \ that will become the properties myUrl and myLinkText, set on the inner scope\
    \ of our directive:"
  merge: -1
