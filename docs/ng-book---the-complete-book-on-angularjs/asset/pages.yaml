  md: '# Communicating with the Outside World: XHR and Server-Side Communication


    The first time that we send this $http request, the $http service will send a
    GET request to /api/users.json. The next time that we send this GET request, instead
    of making the HTTP request, it will pull the request out of the cache.


    By passing true, for this particular request, Angular will use the default cache
    using the $cacheFactory, which Angular creates for us at bootstrap time.


    +   For more information on working directly with Angular caching, check out the
    caching chapter.


    For most custom control of the cache that Angular uses, we can pass a custom cache
    instead of true in the request.


    For instance, a Least Recently Used (LRU) cache, we pass the cache like so:


    ```

    var lru = $cacheFactory(''lru'', {

    capacity: 20

    });

    // $http request

    $http.get(''/api/users.json'', { cache: lru })

    .success(function(data) {})

    .error(function(data) {});

    ```


    The latest 20 unique requests will be cached. The 21st most recent unique request
    will cause the Least Recently Used request to be removed from the cache.


    It gets customande to pass a custom cache every single time (even in a service).
    We can set a default cache for all $http requests across our application in the
    .config() function of your app:


    ```

    angular.module(''MyApp'')

    .config(function($httpProvider, $cacheFactory) {

    $httpProvider.defaults.cache =

    $cacheFactory(''lru'', {

    capacity: 20

    })

    });

    ```


    Every single request will now use our custom LRU cache.'
