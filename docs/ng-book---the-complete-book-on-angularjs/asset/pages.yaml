  md: '# parse


    Similar to the $parse service, the parse method converts an Angular expression
    into a function. If the expression is a literal constant, it calls the $parse
    service; otherwise, it calls the $sce.getTrusted() service.


    The parse() method takes two arguments:


    +   - type (string)


    The type of $sce context where we''re going to use the value. See $sce types for
    available types.


    +   - expression (string)


    The Angular expression to compile


    The parse() method returns a function of the form: function(context, locals) where:


    +   - context (object)


    The object where the expression should be evaluated against. Typically, this will
    be a $scope.


    +   - locals (object)


    These are local variables, mostly useful for overriding values in the context.


    The $sce library has a few helper methods for the parse() method.


    The following methods are functionally equivalent:


    | parseAsCss(expr) | parseAs($sce.CSS, expr) |

    | parseHtml(expr) | parseAs($sce.HTML, expr) |

    | parseAsJs(expr) | parseAs($sce.JS, expr) |

    | parseAsResourceUrl(expr) | parseAs($sce.RESOURCE_URL, expr) |

    | parseAsUrl(expr) | parseAs($sce.URL, expr) |


    # trustAs


    The trustAs() method returns an object that Angular trusts for use in a specific
    contextual escaping context. Bindings, such as ng-bind-html and ng-include, use
    the provided value.


    The trustAs() method takes two arguments:


    +   - type (string)'
