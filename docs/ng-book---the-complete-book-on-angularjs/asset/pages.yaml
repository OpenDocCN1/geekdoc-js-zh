  md: '# EssentialAngularJS Extensions


    # Installation


    ```

    $ bower install --save angular-ui-utils

    ```


    We need to ensure that we include the library in our HTML template. Each component
    of the ui-utils library is built as an individual module, so we need to include
    each one independently.


    # mask


    When we want to validate a credit card or a phone number (or any other input that
    requires a specific format), we can present a clean UI that tells us they''re
    giving us clean input.

    We need to include the mask.js library in our HTML:


    ```

    <script type="text/javascript" src="app/bower_components/angular-ui-utils/modules/mask/mask.js"></script>

    ```


    and set the ui-mask as a dependency for our app:


    ```

    angular.module(''MyApp'', [''ui.mask''])

    ```


    Now, we can specify input masks using the ui-mask directive. The ui-mask directive
    takes a single string that follows these formatting rules:


    +   - A any letter

    - 9 any number

    - * * any alphanumeric character.


    For instance, to format a credit card number in an input, we might set the ui-mask
    directive to like:


    ```

    <input name="ccnum" ui-mask="9999 9999 9999 9999" ng-model="user.cc" placeholder="Credit
    card number" />

    ```


    > The ui-mask is similar to how Angular does not consider input valid until its
    validations are all satisfied.

    Note that this input only supports credit cards for which the input mask matches
    9999-9999-9999-9999. With a bit more work, we can support other card types.


    In the same sense, we can format an input field with characters or any alphanumeric
    character.


    # ui-event


    Just like the other modules, we need to include the event .js library in our HTML:'
