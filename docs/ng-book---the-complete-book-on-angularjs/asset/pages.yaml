    And our user finds their way to the route:\n\n```\n/inbox/123/messages/ascending?from=10&to=20\n\
    ```\n\nThen our $stateParams object results in:\n\n```\n{inboxId: '123', sorted:\
    \ 'ascending', from: 10, to: 20}\n```\n\n# ## $urlRouterProvider\n\nJust like\
    \ ngRoute, we have access to a route provider with which we can build rules around\
    \ what happens when a particular URL is activated. The states that we create are\
