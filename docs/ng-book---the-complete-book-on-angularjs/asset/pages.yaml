    cache.remove(''http://example.com/api/users.json'');

    // Start over and remove the entire cache

    cache.removeAll();

    ```


    Although we can reference the default cache, it is sometimes more useful to have
    more control over the cache and create rules about how the cache behaves. We''ll
    need to create a new cache to use with our requests.


    # Custom Cache


    Telling our http requests to make requests through our own custom cache is simple.
    Instead of passing a boolean true to the request, we can pass the instance of
    the


    ```

    var myCache = $cacheFactory.get(''myCache'');

    $http{

    method: ''GET'',

    url: ''/api/users.json'',

    cache: myCache

    });

    // Or, using the .get helper

    $http.get(''/api/users.json'', {

    cache: myCache

    });

    ```


    Now, instead of using the default cache, http will use our custom cache.


    # Setting Default Cache for $http


    Although it is easy, it''s not convenient to pass an instance of a cache every
    time we want to make an http request, especially if we''re using the same cache
    for every request.


    We can set the cache object that $http uses by default through the httpProvider
    in a .config() method on our module.'
