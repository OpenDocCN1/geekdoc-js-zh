  md: '# Optimizing Angular Apps


    Angular is clearly great for optimizing development time, but how does it stack
    up in terms of performance, and what can we do to get it to be as fast as possible?


    For most web applications, the native speed of Angular is fast enough, and don''t
    need to pay any special attention to optimizing its performance. When our applications
    get slow or show poor performance, we can then attack optimizing our Angular apps.


    # What to Optimize


    In order to know where to focus on the optimizing our app, we need to understand
    what''s happening under the Angular hood. As with any applications, start by focusing
    on the cause of our issues.


    # Optimizing the $digest Loop


    The obvious place to start looking for performance issues is in the $digest loop.
    In short, Angular runs through a list that is responsible for keeping track of
    the live data bindings. Every single piece of live data that can possibly change
    on the page has a watch applied to it.


    > The Under Hood chapter discusses the $watch list and the $digest loop in detail.


    Each of these watches causes the $digest loop to take more time to finish rendering,
    as Angular needs to keep track of the value and check if it''s changed on each
    loop.


    Focusing on limiting the number of unnecessary gathers will gain us the biggest
    performance boosts. Additionally, keeping the bi-directional data comparisons
    simple will give us even more performance boosts, as the browser can check these
    quickly.


    In our apps, we should be mindful that the number of bi-directional data bindings
    should not exceed more than 2000 data bindings on the page for each $digest loop.


    Sometimes we don''t even want the $digest loop to run on our app. For instance,
    imagine we have a polling loop that checks our server several times. If we receive
    a websocket event that fires a full digest loop with every message, we''ll have
    a pretty slow application.


    We recommend using websockets, as they are more production-friendly and less prone
    to errors.'
