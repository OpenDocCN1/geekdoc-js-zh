    # Grunt


    Grunt¹⁶² is a pure JavaScript task runner. It will save you tons of time in developing
    JavaScript applications, both server and client side. It makes repetitive tasks
    disappear and handles running for you automatically.


    The AngularJS community has jumped all over the Grunt tool and created hundreds
    of plugins. If a plugin you need or want has not been developed, the Grunt tool
    makes it very easy to create your own.


    # Installation


    First, to make sure you have Node¹⁶² installed. NodeJS is a platform built on
    Chrome''s JavaScript runtime; it allows you to use JavaScript as a server-side
    language.


    To install Grunt, we can use the built-in npm tool that comes with NodeJS:


    ```

    $ npm install -g grunt-cli

    ```


    Passing the -g flag makes the grunt command available in any directory on your
    computer.


    > ¹⁶²http://gruntjs.com/


    > ¹⁶²http://nodejs.org/'
