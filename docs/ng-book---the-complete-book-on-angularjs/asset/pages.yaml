  md: "Services\n\n+   - constant()\n- value()\n- provider()\n\n# factory()\n\nAs\
    \ we've seen, the factory() method is a quick way to create and configure a service.\n\
    The factory() function takes two arguments:\n\n+   - name (string)\n- getFn (function)\n\
    \nThis argument takes the name of the service we want to register.\nThis function\
