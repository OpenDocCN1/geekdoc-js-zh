  md: '# # Expressions


    Expressions are used all over AngularJS apps, so it''s important to get a solid
    understanding of what expressions are and how AngularJS uses and evaluates them.


    We''ve seen examples of Angular expressions already. The {{ }} notation for showing
    a variable attached to a $scope is actually an expression: {{ expression }}. When
    setting up a $watch, we use an expression (or a function) that Angular will evaluate.


    Expressions are roughly similar to the result of an eval(javascript). Angular
    processes them; therefore, they have these important properties:


    +   * All expressions are executed in the context of the scope and have access
    to local $scope variables.

    * An expression doesn''t throw errors if it results in a TypeError or a ReferenceError.

    * They do not allow any control flow functions (conditionals; e.g., if/else).

    * They can accept a filter and/or filter chains.


    Expressions all operate on the containing scope within which they are called.
    This fact enables us to call variables bound the containing scope inside of an
    expression, which, in turn, enables us to loop over variables (we''ll see this
    looping with ng-repeat), call a function, or use variables from the scope.


    # # Parsing an Angular Expression


    Although your Angular app will parse for you automatically when running the $digest
    loop, sometimes it''s useful to parse an Angular expression manually.


    Angular evaluates expressions by an internal service (called the $parse service)
    that has knowledge of the current scope. This setup gives us access to the raw
    JavaScript data and functions that are defined on our $scope.


    To manually parse an expression, we can inject the $parse service into a controller
    and call the service to do the parsing for us. For instance, if we have an input
    box in our page that''s bound to the expr variable, like so:'
  merge: -1
  pgno: 42
