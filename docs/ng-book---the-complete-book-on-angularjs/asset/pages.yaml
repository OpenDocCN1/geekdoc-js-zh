  md: "# ngMin\n\nWith the three methods of defining annotations from above, it's\
    \ important to note that these options all exist when defining a function. In\
    \ production, however, it is often less convenient to explicitly concern ourselves\
    \ with order of arguments and code bloat.\n\nThe ngMin tool allows us to alleviate\
    \ the responsibility to define our dependencies explicitly. ngMin is a pre-minifier\
    \ for Angular apps. It walks through Angular apps and sets up dependency injection\
    \ for us.\n\nFor instance, we will turn this code:\n\n```\nangular.module('myApp',\
    \ [])\n  .directive('myDirective',\n    function($http) {\n    })\n  .controller('IndexController',\n\
    \    function($scope, $q) {\n    });\n```\n\ninto the following:\n\n```\nangular.module('myApp',\
    \ [])\n  .directive('myDirective', [\n    '$http',\n    function ($http) {\n \
    \   }\n  ]).controller('IndexController', [\n    '$scope',\n    '$q',\n    function\
    \ ($scope, $q) {\n    }\n  ]);\n```\n\nngMin saves us a lot of typing and cleans\
    \ our source files significantly.\n\n# Installation\n\nTo install ngMin, we'll\
    \ use the npm package manager:"
