  md: '# Including Angular


    With the bare Cordova app, we only have a bare JavaScript app that hides and displays
    the JavaScript view in js/index.js.


    We can introduce Angular into the workflow very simply. As we are building a native
    app, including Angular from a CDN is not ideal; instead, we''ll include the necessary
    components directly into the app.


    We can use some complex setups, for the time we being, we''ll keep it simple.


    To get our Angular building, we need to download Angular from angular.org¹¹¹ and
    store it in a directory accessible by our index.html. We recommend /js/vendor/angular.js.


    Once that''s set, we can start building the contents of the Angular app. We need
    to include the JavaScript file in our index.html.


    ```

    <script type="text/javascript" src="js/vendor/angular.js"></script>

    ```


    Now we can replace all of the contents of the js/index.js file with our Angular
    app and develop our app like normal.


    # Development Workflow


    When building our app, we''ll use the following workflow:


    +   - Start our local server (Cordova serve [platform])

    - Edit our app

    - Rebuild our app (Cordova build [platform])


    This flow, although somewhat cumbersome, is how we edit out our app.

    If our app doesn''t rely on the Cordova platform, we can edit outside of the simulator
    and in our web browser. In this case, we can work specifically with building our
    app, instead of needing to rebuild and redeploy the app.


    # Building with Yeoman


    We can use Yeoman¹¹¹ to produce a production-ready version of our app. Yeoman
    is a collection of build scripts that is the officially supported build process
    for Angular apps. For more information check out the Yeoman section in the Next
    Steps chapter.


    To install Yeoman, the Angular generator, and the Cordova generator:


    > ¹¹¹http://angular.org/

    ¹¹¹http://yeoman.io'
  merge: -1
  pgno: 485
