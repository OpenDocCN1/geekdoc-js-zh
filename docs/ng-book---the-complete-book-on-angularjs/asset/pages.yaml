  md: "# Dependency Injection\n\nNowhere in the above example did we describe how\
    \ to find the greeter; it simply works, the injector takes care of finding and\
    \ loading it for us.\n\nAngularJS uses an annotate function to pull properties\
    \ off of the passed-in array during instantiation. You can view this function\
    \ by tuning the following in the Chrome developer tools:\n\n```\n> injector.annotate(function($q,\
    \ greeter) {\n  \"$q\", \"greeter\")\n```\n\nIn every Angular app, the $injector\
    \ has worked at work, whether we know it or not. A controller without the [] bracket\
    \ notation or through explicitly setting them, the $injector will infer the dependencies\
    \ based on the name of the arguments.\n\n# Annotation by Inference\n\nAngular\
    \ assumes the function parameter names are the names of the dependencies, if not\
    \ otherwise specified. Thus, it will call toString() on the function, and parse\
    \ the function arguments, and then use the $injector to inject these arguments\
    \ into the instantiation of the object.\n\nThe injection process looks like:\n\
    \n```\ninjector.invoke(function($http, greeter) {});\n```\n\nNote that this process\
    \ will only work with non-minified, non-obfuscated code, as Angular needs to parse\
    \ the arguments intact.\n\nWith this JavaScript inference, order is not important:\
    \ Angular will figure it out for us and inject the right properties in the \"\
    right order\".\n\n> JavaScript minifiers generally change functions to the minimum\
    \ number of characters (along with changing white spaces, removing new lines and\
    \ comments, etc) as to reduce the ultimate file size of the JavaScript files.\
    \ If we do not explicitly describe the arguments, Angular will not be able to\
    \ inject the arguments and thus the required injectable.\n\n# Explicit Annotation\n\
    \nAngular provides a method for us to explicitly define the dependencies that\
    \ a function needs upon invocation. This method allows for minifiers to rename\
    \ the function parameters and still be able to inject the properties into the\
    \ function.\n\nThe injection process uses the $inject property to annotation the\
    \ function. The $inject property of a function is an array of service names to\
    \ inject as dependencies.\n\nTo use the $inject property method, we set it on\
    \ the function or name."
  merge: -1
  pgno: 162
