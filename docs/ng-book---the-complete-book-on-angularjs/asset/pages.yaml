    ```\nscope: {\n  // this won't work\n  someProperty: \"needs to be set\"\n}\n\
    ```\n\nInstead, the value is set in the DOM, via an attribute, which we mentioned\
    \ acts similarly to passing an argument to a function works:\n\n```\n<div my-directive\
    \ someome-property=\"someProperty with binding\">\n</div>\n```\n\nNow, inside\
    \ of our fresh scope object, we set the value of someProperty to the binding strategy,\
