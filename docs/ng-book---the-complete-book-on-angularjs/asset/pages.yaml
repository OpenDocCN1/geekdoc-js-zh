  md: "# Communicating with the Outside World: XHR and Server-Side Communication\n\
    \n```\nangular.module('myApp')\n.config(function(RestangularProvider) {\n  RestangularProvider.setErrorInterceptor(\n\
    \    function(resp) {\n      displayError();\n      return false; // stop the\
    \ promise chain\n    }\n  });\n});\n```\n\n# Setting Parentless\n\nIf we're fetching\
    \ a resource that is not nested underneath other nested resources, we can use\
    \ the setParentless configuration property to tell Restangular not to build the\
    \ nested URL structure.\n\n```\nangular.module('myApp')\n.config(function(RestangularProvider)\
    \ {\n  RestangularProvider.setParentless([\n    'cars'\n  ]);\n});\n```\n\nThe\
    \ setParentless() configuration function can take two different types of parameters:\n\
    \n# boolean\n\nIf this parameter is set to true, all resources are considered\
    \ 'parentless', and no URL is nested.\n\n# array\n\nOnly the resources identified\
    \ by the string in this array will be considered parentless.\n\n# Working with\
    \ Hypermedia\n\nIt's a really good practice to only have one point of access to\
    \ the Backend server (the main URL) and then have each of your models point to\
    \ its related resources via links.\n\nRestangular supports this really useful\
    \ practice with selfLink, oneUrl and allUrl.\n\nThe first thing we need to do\
    \ is to configure the selfLink field. Similarly to how we configure the ID, the\
    \ idea of the selfLink is to set the path to the property in a model that has\
    \ a link to itself. This will allow us to know which URL we need to do the PUT\
    \ or GET if needed."
