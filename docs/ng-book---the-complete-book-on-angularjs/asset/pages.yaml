  md: '# Server Communication


    Most of the applications that we will build, however, need to be powered by a
    back-end server with custom data. There are a growing number of options that enable
    developers to focus on building only our front-end code and leave the back end
    alone.


    Amazon recently released a new option that allows us to build serverless web applications
    from inside the browser: [Amazon AWS JavaScript SDK](http://aws.amazon.com/).


    Amazon''s browser-based (server-side with NodeJS) SDK now allows us to confidently
    host our applications and interact with production-grade back-end services.


    It''s possible to host our application stack entirely on Amazon infrastructure,
    using S3 to host our application and files, DynamoDB as a NoSQL store, and other
    web-scale services. We can even securely accept payments from the client side
    and get all the benefits of the Amazon CDN.


    With this release, the JavaScript SDK now allows us to interact with five of the
    dozens of Amazon AWS services. These five services are:


    # DynamoDB


    This fast, fully managed NoSQL database service allows us to scale to infinite
    size with automatic triplicate replication with secure access controls.


    # Simple Notification Service (SNS)


    This service is a fast, flexible, fully managed push notification service that
    allows us to push messages to mobile devices as well as other services, such as
    email or even to Amazon''s own Simple Queue Service (SQS).


    # Simple Queue Queue Service (SQS)


    This fast, reliable, fully managed queue service allows us to create large queues
    in a well-managed way. We can create large request objects so we can fully decouple
    our application''s components from each other using a common queue.


    # Simple Storage Service (S3)


    This well-known, web-scale, and fully managed data store allows us to store large
    objects (up to five terabytes) with an unlimited number of objects. We can use
    S3 to securely store encrypted and protected data all over the world. We''ll even
    use S3 to host our own Angular apps.


    > 7http://aws.amazon.com/'
  merge: -1
