  md: "# The Digest Loop and $apply\n\nLet's take a peek at how Angular works underneath\
    \ the hood. How do we get this magical data binding to work in only a few lines\
    \ of code? It's important that we understand how the $digest loop works and how\
    \ to use the $apply() method.\n\nIn the normal browser flow, a browser executes\
    \ callbacks that are registered with an event when that occurs (e.g., clicking\
    \ on a link).\n\nEvents are fired when the page loads, when an $http request comes\
    \ back, when the mouse moves or a button is clicked, etc.\n\nWhen an event is\
    \ fired/JavaScript creates an event object and executes any functions listening\
    \ for the specific events with this event object. This callback method then runs\
    \ inside the JavaScript function, which returns to the browser, potentially updating\
    \ the DOM.\n\n> No events run on the same time. The browser waits until one event\
    \ finishes the next handler is called.\n\nIn Non-Angular JavaScript, we can attach\
    \ a function callback to the click event on a div. Any time a click event is fired\
    \ on an element, the function callback returns:\n\n```\nvar div = document.getElementById(\"\
    clickDiv\");\ndiv.addEventListener(\"click\",nfunction(evt) {\n  console.log(\"\
    evt\", evt);\n});\n```\n\n> Open the Chrome developer tools, copy and paste the\
    \ previous code inside of any web page and click around the page.\n\nAny time\
    \ the browser detects a click, the browser calls the function registered with\
    \ the addEventListener on the document.\n\nWhen we mix Angular into the flow,\
    \ it extends this normal browser flow to create an Angular context. The Angular\
    \ context refers specifically to code that runs inside the Angular event loop,\
    \ referred to as the $digest loop. To understand the Angular context, we need\
    \ to look at exactly what goes on of it. There are two major components of the\
    \ $digest loop:\n\n+   - The $watch list\n- $evalAsync list"
  merge: -1
