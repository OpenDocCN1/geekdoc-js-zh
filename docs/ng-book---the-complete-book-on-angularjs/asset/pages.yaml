  md: "# Talking to MongoDB\n\nIf we don't have a custom back end, it's also possible\
    \ to talk directly to a database that exposes RESTful interface.\n\nInstead of\
    \ having to build a back end, we can talk directly to Mongo.\n\n+   - In this\
    \ example, we're using MongoDBLab*, a SAAS service that offers managed MongoDB\
    \ instances.\n\nIn order to talk to MongoDB, we need to set up a custom configurations\
    \ for our Restangular objects.\n\n+   - Note that the following configuration\
    \ will change the global Restangular objects. If we want to nest this configuration\
    \ for a single database, we'll need to create a factory to nest our custom Restangular\
    \ object.\n\nFirst, let's set our API key. This key won't change across the entire\
    \ app, we'll creating it as a constant.\n\n```\nangular.module('MyApp', ['restangular'])\n\
    .constant('apiKey', 'YOUR_API_KEY');\n```\n\nWe can now inject this API key into\
    \ other parts of our application. We'll set up our configuration in the config()\
    \ block on our module.\n\nUsing MongoLab, we'll set our baseUri to the API endpoint:\n\
    \n```\n// ...\nconfig(function(RestangularProvider, apiKey) {\n  RestangularProvider\n\
    \    .setBaseUrl('https://api.mongolab.com/api/1/databases/YOURDB/collections');\n\
    });\n```\n\nNext, every single request we make to our back-end database will require\
    \ our API key. Restangular makes it easy to add it using the setDefaultParams()\
    \ method:"
