  md: "# Directives Explained\n\n```\nangular.module('myApp', [])\n.directive('myDirective',\
    \ function() {\n  return {\n    restrict: 'A',\n    scope: {}\n  };\n})\n.directive('myInheritScopeDirective',\
    \ function() {\n  return {\n    restrict: 'A',\n    scope: true\n  };\n})\n```\n\
    \n# Live JS Bin^{ss}\n\nWith the most important scope-related concepts out of\
    \ the way, we can bind properties on our isolated scope with the outside world,\
