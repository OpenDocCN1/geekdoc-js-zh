  md: "# $Watch List\n\nEvery time we track an event in the view, we are registering\
    \ a callback function that we expect to be called when an event happens in the\
    \ page. Recall our first example:\n\n```\n<DOCTYPE html>\n<html ng-app>\n<head>\n\
    \  <title>Simple app</title>\n  <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.2.6/angular.js\"\
    ></script>\n</head>\n<body>\n  <input ng-model=\"name\" type=\"text\" placeholder=\"\
    Your name\">\n  <h1>Hello {{ name }}</h1>\n</body>\n</html>\n```\n\nAny time a\
    \ user updates the input field, {{ name }} changes in the UI. This change happens\
    \ because we bind the input field in the UI to the $scope.name property. In order\
    \ to update the view, Angular needs to track the change. It does so by adding\
    \ a watch function to the $watch list.\n\nProperties that are on the $scope object\
    \ are only bound if they are used in the view. In the case above, we've added\
    \ a single function to the $watch list.\n\nRemember: For all elements that are\
    \ bound to a $scope object, a $watch is added to the $watch list.\n\nThese $watch\
    \ lists are resolved in the $digest loop through a process called dirty checking.\n\
    \n# Dirty Checking\n\nDirty checking is a simple process that boils down to a\
    \ very basic concept: It checks whether a value has changed that hasn't yet been\
    \ synchronized across the app.\n\n> The dirty checking strategy is commonly used\
    \ in plenty of different applications, beyond Angular. Game engines, database\
    \ engines, and Object Relational Mappers (ORMs) are some examples of such systems.\n\
    \nOur Angular app keeps track of the values of the current watches (in the watch\
    \ object, for those who are curious). Angular walks down the $watch list, and,\
    \ if the updated value has not changed from"
  merge: -1
  pgno: 438
- img_proc: true
  md: 'the old value, it continues down the list. If the value has changed, the app
    records the new value and continues down the $watch list.


    ![](img/c29f4deabfb2aac07907f28672b2ed83_439_0.png)


    # ### Digest loop


    Once Angular has run the entire $watch list, if any value changed, the app will
    fall back into the $watch loop until it detects that nothing has changed.


    Why run the loop all over again? If we update a value in the $watch list that
    updates another value, Angular won''t detect the update unless we rerun the loop.


    If the loop runs ten times or more, our Angular throws an exception, and the app
    dies. If Angular doesn''t catch this exception, the app could launch into an infinite
    loop, with bad results.


    **Note:** In future versions of Angular, the framework will use the native browser
    specification Object.observe(), which will speed up the dirty checking process
    considerably.


    # # watch


    The $watch method on the $scope object sets a dirty check on every call to $digest
    inside the Angular event loop. The Angular $digest loop always returns if it detects
    changes on the expression.


    The $watch function itself takes two required arguments and a third optional one:


    +   * watchExpression


    watchExpression can either be a property of a scope object or a function. It runs
    on **every** call to $digest in the $digest loop.


    If the watchExpression is a string, Angular evaluates it in the context of the
    $scope. If it is a function, Angular expects it to return the value that should
    be watched.


    +   * listener/callback'
