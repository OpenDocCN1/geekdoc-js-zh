  md: "# The Digest Loop and $apply\n\n```\n$scope.evalAsync('attribute',\nfunction(scope)\
    \ {\n  scope.foo = \"Executed\"\n});\n```\n\nSome particulars to consider when\
    \ using $evalAsync:\n\n+   - If a directive calls $evalAsync() directly, it will\
    \ run after Angular has manipulated the DOM, but before the browser renders.\n\
    - If a controller calls $evalAsync(), it will run before Angular has manipulated\
    \ the DOM and before the browser renders (we'll never really want to apply this\
    \ order of events).\n\nWe will want to use the $evalAsync() function any time\
    \ that we want an action to execute in Angular.\n\nWe might use it instead of\
    \ a setTimeout() function, where it might cause a flicker after the browser re-renders.\n\
    \n# $apply\n\nThe $apply() function executes an expression inside of the Angular\
    \ context from outside of the Angular framework. If we implement a setTimeout()\
    \ or are using a third-party library and we want the event to run inside the Angular\
    \ context, we must use $apply().\n\nThe $apply() function takes one optional argument:\n\
    \n+   - expression (string/function)\n\nThe expression argument optionally takes\
    \ a string or a function and executes it inside the current scope.\n\nIf a string\
    \ is passed, then $apply() will first call $eval() on the string, forcing Angular\
    \ to $eval() the string on the local scope context.\n\nIf a function is passed,\
    \ the function will be executed on the scope passed into the function.\n\nThe\
    \ $exceptionHandler service will catch and handle any exception that the $eval()\
    \ method throws. Lastly, the $apply() method directly calls the $digest loop."
