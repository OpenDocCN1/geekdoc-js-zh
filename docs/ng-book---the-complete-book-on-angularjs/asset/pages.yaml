    # $evalAsync List


    $evalAsync() method is a way to schedule expressions on the current scope at some
    time in the future. The second operation that the $digest loop runs is executing
    $$asyncQueue. We can get access to this work queue with the $evalAsync() method.


    Throughout the $digest loop, the queue empties between each loop through the dirty
    checking lifecycle which means two things for any function called with $evalAsync:


    +   - The function will execute sometime after the function that called it.

    - At least one $digest cycle will be performed after the expression is executed.


    $evalAsync() method takes a single argument:


    +   - expression (string/function)


    This expression is what we want to execute on the current scope. If a string is
    passed, it will $eval the expression on the scope.


    If a function is passed, it will execute the function with the $scope that is
    passed in as it''s executed.'
