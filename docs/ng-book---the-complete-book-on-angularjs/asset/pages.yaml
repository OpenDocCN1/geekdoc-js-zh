  md: "# Configuring Restangular\n\nRestangular is highly configurable and expects\
    \ us to configure it for our apps. It comes with defaults for every single property,\
    \ so we don't have to configure it if we don't need to do so.\n\nThere are a few\
    \ different places where we can configure a Restangular service. We can configure\
    \ it globally or using a custom service.\n\nTo configure all Restangular usages,\
    \ regardless of the location it's used in, we can inject the RestangularProvider\
    \ in a `config()` function or inject Restangular in a `run()` function.\n\n> A\
    \ rule of thumb to determine where we should configure our Restangular instances:\
    \ If we need to use any other service in configuring Restangular, then we should\
    \ configure it in the `config()` method, otherwise we'll keep it in the `config()`\
    \ method.\n\n# Setting the baseUrl\n\nTo set the baseUrl for all calls to our\
    \ backendAPI, we can use the `setBaseUrl()` method. For instance, if our API is\
    \ located at `/api/v1`, rather than at the root of our server.\n\n```\nangular_module(`MyApp`)\n\
    \  .config(function(RestangularProvider) {\n    RestangularProvider.setBaseUrl('/api/v1');\n\
    \  });\n```\n\n# Adding Element Transformations\n\nWe can add any element transformations\
    \ after Restangular has loaded an element.\n\nUsing these `elementTransformers`,\
    \ we can add `custom` methods to our Restangular objects after they are fetched.\n\
    \nThis method will be called as a callback that will enable us to update or modify\
    \ the element we fetched after it's been loaded, before we use it in our Angular\
    \ objects."
  merge: -1
  pgno: 215
- img_proc: true
  md: "# Communicating with the Outside World: XHR and Server-Side Communication\n\
    \n```\nangular.module('MyApp')\n.config(function(RestangularProvider) {\n  //\
    \ Three parameters:\n  // the route\n  // if it's a collection - boolean (true/false)\
    \ or\n  // not sending it if you need it for both\n  // and the transformer\n\
    RestangularProvider.addElementTransformer('authors',\n  false, function(element)\
    \ {\n    element.fetchedAt = new Date();\n    return element;\n  });\n});\n```\n\
    \nThere're shortcut methods for extending a model or a collection. For instance,\
    \ if we wanted to update only elements that are authors, we can do the following:\n\
    \n```\nangular.module('MyApp')\n.config(function(RestangularProvider) {\n  //\
    \ Three parameters:\n  // the route\n  // if it's a collection - boolean (true/false)\
    \ or\n  // not sending it if you need it for both\n  // and the transformer\n\
    RestangularProvider.extendModel('authors', function(element) {\n  element.fullName\
    \ = function() {\n    return element.name + ' ' + element.lastName;\n  }\n});\n\
    });\n```\n\n# Setting responseInterceptors\n\nRestangular can set responseInterceptors.\
    \ responseInterceptors are useful for when we want to translate the response we\
    \ get back from the server. For instance, if our server comes back with the data\
    \ tucked away in a nested object, we can use a responseInterceptor to dig it.\n\
    \n**Note:** It's important that the getList method always returns an array, if\
    \ your response is an object with some metadata and a nested array, we should\
    \ use the responseInterceptor to get it out.\n\nThis responseInterceptor is called\
    \ after every response we get back from the back end. It is called with the following\
    \ parameters:"
  merge: -1
  pgno: 216
- img_proc: true
  md: "# Communicating with the Outside World: XHR and Server-Side Communication\n\
    \n+   - data - data retrieved from the server\n- operation - the HTTP method used\n\
    - what - the model that's requested\n- url - the relative URL that's being requested\n\
    - response - the full server response, including headers\n- deferred - the promise\
    \ for the request\n\nFor instance, the following configuration would return an\
    \ array for getList with the metadata, in case array it is the value of the property\
    \ with the same name as the route. For example a GET /customers would return an\
    \ array like {customers: []}\n\n```\nangular.module('myApp')\n.config(RestangularProvider)\
    \ {\n  RestangularProvider.setResponseInterceptor(\n  function(data, operation,\
    \ what) {\n    if (operation == 'getList') {\n      var list = data[what];\n \
    \     list.metadata = data.metadata;\n      return list;\n    }\n    return data;\n\
    \  });\n});\n});\n```\n\n# Using requestInterceptors\n\nRestangular supports the\
    \ other side of the operation, as well: We can work with the data we are going\
    \ to the server before we actually send any data back to the server in the first\
    \ place.\n\nrequestInterceptors are useful for times when we need to run manipulations\
    \ on the object before sending it to the server. For instance, we can call directly\
    \ to MongoDB with an _id field, so we have to remove it before it is sent to the\
    \ back end if we're in a PUT operation.\n\n> **Tip**: We can use requestInterceptors\
    \ and responseInterceptors together to make a wide loading. Start loading on every\
    \ request and stop it each time a response is received.\n\nTo set a requestInterceptor,\
    \ we can use the method requestInterceptor(). This method (setRequestInterceptor())\
    \ is called with the following parameters:\n\n+   - element - the element sent\
    \ to the server\n- operation - the HTTP method used\n- what - the model that's\
    \ being requested\n- url - the relative URL that's being requested"
  merge: -1
  pgno: 217
