  md: '# Optimizing Angular Apps


    +   <ul>

    <li bindonce="email" ng-repeat="email in emails">

    <a bo-href="#/from/{{ email.sender }}"bo-text="email.sender"></a>

    <a bo-href="#/email/{{ email.id }}"bo-text="email.subject"></a>

    </li>

    </ul>


    To use bindonce, we first need to get the source. We can either get it directly
    from GitHub on the project page (https://github.com/pasvaz/bindonce153) or through
    Bower by installing it like so:


    bower install angular-bindonce


    Once we have the source, we need to reference it in our main view:


    ```

    <script src="scripts/vendor/bindonce.js"></script>

    ```


    Lastly, we need to set it as a dependency for our application module:


    ```

    angular.module(''myApp'', [''pasvaz.bindonce'']);

    ```


    Now, when we are dealing with static data, we can be sure, with the help of the
    bo-* tags, we''re not using unnecessary watchers.


    The bindonce library gives us many directives. As we can see above, we''re using
    custom directives.


    > Every time we use any bo-* tag, we need to ensure a part of it contains the
    bindonce directive. All of the children bo-* directives will watch for the data
    in this directive to resolve.


    # bo-if="condition"


    This directive is the same as calling ng-if, but without using extra watchers.


    # bo-show="condition" / bo-hide="condition"


    This directive is the same as calling ng-show or ng-hide, but without using any
    extra watchers.


    153https://github.com/pasvaz/bindonce'
