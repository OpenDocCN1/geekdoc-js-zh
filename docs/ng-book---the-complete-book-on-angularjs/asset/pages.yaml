    With this object, we can get a list of all the messages with the getList() method.
    This getList() method returns a collection containing methods we can call to with
    the specific collection.


    ```

    // allMessages is a promise that will resolve

    // into the list of all messages

    var allMessages = messages.getList();

    ```


    We can also use the Rectangular object to create messages. To create an object,
    we''ll use the post() method.


    The post method requires a single object as and sends (a you guessed) POST request
    to the URL we''ve specified. We can also add queryParameters and headers to this
    request.


    ```

    // POST to /messages

    var newMessage = {

    body: "Hello world"

    };

    messages.post(newMessage);

    // OR we can call this on an element

    // to create a nested resource

    var message = Rectangular.one(''messages'', ''abc123'');

    message.post(''replies'', newMessage);

    ```


    Because Rectangular returns promises, we can call them on the returned data on
    promises so that we can run a function after the promise has completed.


    Rectangular returns enhanced promises, being beside able to call then on them,
    we can call other special methods like $object. $object returns an empty array
    (or object) right away, after the server returns information, that array is filled
    with new information. This is useful for instance if we update a collection, we
    want to fetch the collection on our scope:


    ```

    // Calling then in the promise

    messages.post(newMessage).then(function(newMsg) {

    // Setting messages to an empty array

    // and then fill it once getList is completed

    $scope.messages = messages.getList().$object;

    }, function error(reason) {

    // An error has occurred

    });

    ```


    We can also remove an object from the collection. Using the remove() method, we
    can send a DELETE HTTP request to our back end. To delete a request, we can call
    the remove() method on an object inside the collection (an element).'
