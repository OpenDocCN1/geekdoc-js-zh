  md: "Thus, the point of using promises is to regain the ability to do functional\
    \ composition and error bubbling while maintaining the ability of the code to\
    \ run asynchronously.\n\nPromises are first-class objects and carry them with\
    \ a few guarantees:\n\n+   - Only one resolve or reject will ever be called\n\
    \  - resolve is called with a single fulfillment value\n  - reject can be called\
    \ with a single rejection reason\n- If the promise has been resolved or rejected,\
    \ handlers depending upon them will still be called\n- Handlers will always be\
    \ called asynchronously\n\nAdditionally, we can chain promises and allow the code\
    \ to process as it would normally run. Exceptions from one promise bubble up through\
    \ the entire chain.\n\nPromises are always executed asynchronously; we can use\
    \ them without worry that they will block the rest of the app.\n\n# Promises in\
    \ Angular\n\nAngular’s event loop gives Angular the unique ability to resolve\
    \ promises in its$scope.$evalAsync stage (under the hood for more detail on the\
    \ run loop). The promises will sit inert until the $digest loop finishes.\n\n\
    This fact allows for Angular to turn the results of a promise into the view without\
    \ any extra work. It enables us to assign the result of the XHR directly to a\
    \ property on a $scope object and think nothing of it.\n\nLet's build an example\
    \ that will return a list of pull requests for AngularJS from GitHub. Play with\
    \ it⁹\n\n```\n<h1>Open Requests for Angular JS</h1>\n\n<ul ng-controller=\"DashboardController\"\
    >\n  <li ng-repeat=\"pr in pullRequests\">\n    {{ pr.title }}\n  </li>\n</ul>\n\
    ```\n\nIf we have a service that returns a promise in depth (covered in the services\
    \ chapter), we can simply place the promise in the view and expect that Angular\
    \ will resolve it for us:\n\n> ⁹http://jsbin.com/UfotanA/3/edit"
