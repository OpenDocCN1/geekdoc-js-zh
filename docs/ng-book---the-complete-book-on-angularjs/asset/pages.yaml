  md: "# Directives Explained\n\n```\nangular.module('myApp', [])\n.directive('myDirective',\
    \ function() {\n  return {\n    restrict: 'A',\n    scope: true\n  }\n})\n```\n\
    \nNow let's use our directive to alter the scope of the DOM:\n\n```\n<div ng-app=\"\
    myApp\">\nng-init=\"someProperty\"></div>\n<div ng-init=\"siblingProperty = 'more\
    \ data'>\nInside Div Two: {{ aThirdProperty }}\n<div ng-init=\"aThirdProperty\
    \ = 'data for 3rd property'\nng-controller=\"SomeController\">\n  Inside Div Three:\
    \ {{ aThirdProperty }}\n  <div ng-controller=\"SecondController\">\n    Inside\
    \ Div Four: {{ aThirdProperty }}\n    <br>\n    Outside myDirective: {{ myProperty\
    \ }}\n    <div my-directive ng-init=\"myProperty = 'wow, this is cool'>\n    \
    \  InsideDirective: {{ myProperty }}\n    </div>\n  </div>\n</div>\n</div>\n</div>\n\
    ```\n\nLive JS Bin\n\nNow that we understand how surrounding and inherited scope\
    \ work, there remains only one piece of the scope puzzle: isolate scope.\n\n#\
    \ Isolate Scope\n\nIsolate scope is likely the most confusing of the three options\
    \ available when setting the scope property, but also the most powerful. Isolate\
    \ scope is based on the ideology present in Object Oriented Programming. Languages\
    \ like Small Talk and design principles like SOLID have found their way into Angular\
    \ via directives that use isolate scope.\n\n> 54http://jsbin.com/tEBAF/1/edit"
