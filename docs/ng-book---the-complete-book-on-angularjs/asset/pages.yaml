  md: "# ng-show/ng-hide\n\nng-show and ng-hide show or hide the given HTML element\
    \ based on the expression provided to the attribute. When the expression provided\
    \ to the ng-show attribute is false the element is hidden. Similarly, when the\
    \ expression given to ng-hide is true, the element is hidden.\n\nThe element is\
    \ shown or hidden by removing the ng-hide CSS class, or adding it to, the element.\
    \ .ng-hide CSS class is predefined in AngularJS and sets the display style to\
    \ none (using an !important flag).\n\n```\n<div ng-show=\"2 + 2 == 5\">\n  2 +\
    \ 2 isn't 5, don't show\n</div>\n<div ng-show=\"2 + 2 == 4\">\n  2 + 2 is 4, do\
    \ show\n</div>\n<div ng-hide=\"2 + 2 == 5\">\n  2 + 2 isn't 5, don't hide\n</div>\n\
    <div ng-hide=\"2 + 2 == 4\">\n  2 + 2 isn't 5, do hide\n</div>\n```\n\n# Live\
    \ Example⁶\n\nThis directive evaluates the given expression when the input changes.\
    \ As we're dealing with input, we must use this directive in conjunction with\
    \ ngModel.\n\n```\n<div ng-controller=\"EquationController\">\n  <input type=\"\
    text\"\n    ng-model=\"equation.x\"\n    ng-change=\"change()\" />\n  <code>{{\
    \ equation.output }}</code>\n</div>\n```"
