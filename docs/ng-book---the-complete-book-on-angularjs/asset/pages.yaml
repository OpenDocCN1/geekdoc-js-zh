  md: "# Directives Explained\n\n![](img/c29f4deabfb2aac07907f28672b2ed83_123_0.png)\n\
    \n# Directives\n\nTo further prove the point that this scope flows downwards during\
    \ inheritance, and not upwards, let's make another JavaScript scope and check\
    \ to see that {{ aThirdProperty }} inherits its value from its parent.\n\n```\n\
    <div ng-app=\"MyApp\">\n  ng-init=\"someProperty = 'some data'\"></div>\n  <div\
