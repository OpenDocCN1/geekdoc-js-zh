  md: "# Communicating with the Outside World: XHR and Server-Side Communication\n\
    \n```\nvar allUsers = User.getList(); // GET /users\n```\n\nIt's also possible\
    \ to fetch nested requests for a single object. Instead of passing only a route,\
    \ we can pass a unique ID to pull from:\n\n```\nvar oneUser = Restangular.one('users',\
    \ 'abc123');\n```\n\nThis code will generate the request /users/abc123 when calling\
    \ get() on it.\n\n```\noneUser.get().then(function(user) {\n  // GET /users/abc123/inboxes\n\
    \  user.getList('inboxes');\n});\n```\n\nAs you can see, Restangular is smart\
    \ enough to figure out how to construct URLs based upon the methods that we are\
    \ calling on the Restangular object. Sometimes, however, it is convenient to set\
    \ the URL that we're fetching, especially if our back end doesn't support pure\
    \ REST APIs.\n\nTo set the URL for a specific request, we can pass a segment argument\
    \ using the allUrl method:\n\n```\n// All URLs on searches will use\n// 'http://google.com/'\
    \ as the baseUrl\nvar searches =\nRestangular.allUrl('one', 'http://google.com/');\n\
    // Will send a request to GET http://google.com/\nsearches.getList();\n```\n\n\
    Additionally, we can set the URL for one particular request, rather than manipulating\
    \ the entire request using oneUrl:\n\n```\nvar singleSearch =\nRestangular.oneUrl('betaSearch',\
    \ 'http://beta.google.com/i/');\n// Trigger a request to GET http://google.com/1\n\
    singleSearch.get();\n```\n\n# Using Restangular\n\nNow that we have a good handle\
    \ on the Restangular object, we can get down to using it to make requests.\n\n\
    Once Restangular returns an initial object, we can use several different methods\
    \ to interact with our back-end API.\n\nLet's say we've created a Restangular\
    \ object that represents public discussions:"
