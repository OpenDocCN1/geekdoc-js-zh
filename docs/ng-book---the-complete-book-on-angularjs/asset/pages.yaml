  md: '# Introduction


    # Foreword


    I have become somewhat numb to all of the JavaScript libraries and frameworks
    being released on a seemingly daily basis. The ability to choose from a variety
    of libraries and frameworks is a good thing, including too many scripts in an
    application can be a bad thing for maintenance – at least in my opinion. I''ve
    always been concerned about the dependencies that were confirmed, and I was hooked.
    Angular is created as more and more scripts are added to an application and longed
    for a single script (or two) that could provide the core functionality I wanted.


    When I first heard about Angular it caught my attention immediately because it
    appeared to offer a single framework that could be used to build a variety of
    dynamic, client-centric applications. After researching it more, my initial impressions
    were confirmed, and AngularJS includes a robust set of features and offers a way
    to break up code into modules, which is good for reuse, maintenance, and testability.
    It provides key features, such as for DOM manipulation, animations, templating-two-way
    data binding, routing, history, testing, and much more.


    Having a core framework to build on is great, it can also be intimidating and
    challenging to learn. As I dove into AngularJS I became overwhelmed with different
    topics and quickly became a little frustrated and wondered if it was the framework
    for me. What was a service, and how was different from a factory? How did code
    fit into the overall picture? What was a directive, and why would I use one? Putting
    the pieces together and seeing the picture was the initial hurdle that I had to
    get over. It definitely would have been nice to have a concise resource to flattened
    the learning curve.


    Fortunately, you have an excellent resource at your disposal in ng-book: The Complete
    Book on AngularJS that will help you practise right away. Ari Lerner has taken
    the knowledge and expertise that he''s gained and laid out in a way that is easy
    to follow and understand. If you''re looking to learn more about data binding,
    how “live” templates work, the process for testing AngularJS applications, the
    roles of services and frameworks, how code and controllers fit together, and much
    more, then you''re in the right place. AngularJS is an extremely powerful and
    fun framework to work with, and the examples shown throughout this book will help
    you get up to speed quickly on the framework.


    Dan Wahlin Consulting http://weblogs.asp.net/dwahllin http://twitter.com/DanWahlin


    > *http://weblogs.asp.net/dwahllin


