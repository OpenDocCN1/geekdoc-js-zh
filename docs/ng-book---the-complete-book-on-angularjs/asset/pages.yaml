  md: "Testing\n\n# Unit Testing Services\n\nUnit testing services is pretty easy,\
    \ as we only need to inject our services into our tests.\nStarting with the simple\
    \ example, suppose we have the service that provides a version:\n\n```\nangular.module('myApp.services',\
    \ [])\n  .value('version', '0.0.1');\n```\n\nIn this case, our service provides\
    \ a single string value. We can inject the version service into the\nCurrent test.\n\
    Our boilerplate for this unit test looks like:\n\n```\ndescribe('Unit: services',\
    \ function() {\n  beforeEach(module('myApp'));\n});\n```\n\n+   Up until now,\
    \ we've been implicitly calling the $injector service. This example shows\nhow\
    \ to use it explicitly.\n\nTo isolate the test, we nest this test inside a describe()\
    \ block and inject our version service in a\nbeforeEach() block.\n\n```\ndescribe('version',\
    \ function() {\n  var version;\n  beforeEach(inject(function($injector) {\n  \
    \  // use the $injector to get the version service\n    version = $injector.get('version');\n\
    \  }));\n\n  it('should have the version as a service', function() {\n    // set\
    \ our expectation on the version service\n    expect(version).toEqual('0.0.1');\n\
    \  });\n});\n```\n\nAs we can see, testing services is really simple; however,\
    \ services are not always this simple.\nour sample app, we're interacting with\
    \ the googleApi; this service is a bit more complex.\nHere is the full source\
    \ for the googleServices.googleApi service:"
