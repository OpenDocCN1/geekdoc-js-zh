  md: '# Introduction to Directives


    ```

    <h1 ng-init="greeting = ''Hello World''>

    nThe greeting is: {{ greeting }}

    n</h1>

    ```


    # Live Example²⁷


    Notice that we''ve passed the expression greeting = ''Hello World'' to the built-in
    directive ng-init.

    Inside the expression, we set a property named greeting to the value Hello World.
    Then we''re evaluating the expression greeting inside brackets: {{ greeting }}.


    In both cases, we''re evaluating a normal JavaScript expression on the current
    scope. Depending upon where the expression is placed, it can be the $rootScope,
    instantiated when Angular invokes ng-app during application or a child object
    as a controller.


    # Declaring Our Directive with an Expression


    Given that we now know we can declare a directive with or without an expression,
    let''s revisit the valid ways of declaring an expression:


    ```

    <my-directive="someExpression">

    </my-directive>

    <div my-directive="someExpression">

    </div>

    <div class="my-directive:someExpression">

    </div>

    <!-- directive: my-directive someExpression -->

    ```


    A reasonable question at this point is within which environment the expression
    given to a directive runs. We''ll find our answer by familiarizing ourselves a
    bit with the elusive, but extremely important, concept of current scope, provided
    by the controller hierarchy of the surrounding DOM.


    # Current Scope Introduction


    Let''s quickly familiarize ourselves with scope as provided by the DOM via the
    built-in directive ng-controller. This directive exists for the purpose of creating
    a new child scope in the DOM:


    > ²⁷http://jsbin.com/idYexO/2/edit'
