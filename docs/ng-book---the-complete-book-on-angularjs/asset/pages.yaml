    \  var d = $q.defer();\n\n  // After the script loads in the browser, we're going\n\
    \  // to call this function, in which will resolve\n  // our global defer which\
    \ enables the\n  $window.googleApi = function(keys) {\n    // We need to use our\
    \ API key\n    window.gapi.client.setApiKey(keys.apiKey);\n    $rootScope.apply(function()\
    \ {\n      d.resolve(keys);\n    });\n  };\n\n  // Load client in the browser\n\
    \  var scriptTag = $document[0].createElement('script');\n  scriptTag.type = 'text/javascript';\n\
    \  scriptTag.async = true;\n  scriptTag.src = 'https://api.google.com/js/client:plusone.js?onload=Callback';\n\
    \  var s = $document[0].getElementsByTagName('body')[0];\n  s.appendChild(scriptTag);\n\
    \n  // Return a singleton object that returns the\n  // promise\n  return {\n\
