  md: '# Testing Controllers


    Our controllers contain the business logic of our application. The controller
    is where the $scope marries the controller to the view. Since we are going to
    do most of the work of updating the views of our application in our controllers,
    we want to set up tests to ensure that their behavior executes as expected.


    # Unit Testing Controllers


    When we''re unit testing controllers, we need to set up our tests to mimic the
    behavior of Angular. In setting up our unit tests, we need to make sure we:


    +   - Set up our tests to mock the module

    - Store an instance of the controller with an instance of a known scope

    - Test your expectations against the scope


    To instantiate a new controller instance, we need to create a new instance of
    a scope from the $rootScope with the $new() method. This new instance will set
    up the scope inheritance that Angular uses at run time.


    With this scope, we can instantiate a new controller and pass the scope in as
    the $scope of the controller.'
