    # $save(key)


    The $save method synchronizes all changes to the local elements with the Firebase
    data store and pushes them to all listening clients. It takes a single argument:


    **key** (optional string) If we provide the key argument (string), the $save()
    method saves changes made to the child element referenced by the key to Firebase.
    If no key is provided to the $save() method, then all changes made to the object
    persist to Firebase.


    The $save() method is most commonly used to save any local changes made to the
    model.


    ```

    $scope.items.foo = "baz";n$scope.items.save("foo"); // new Firebase(URL + "/foo")
    now contains "baz";

    ```


    # $child(key)


    The $child() method creates a new $firebase object for a child referenced by the
    provided key. The method takes a single argument:


    **key** (string) The key is used to refer to the newly created child.


    ```

    var child = $scope.items.child("foo");nchild.$remove(); // Equivalent to calling
    $scope.items.remove("foo");

    ```


    # $set(value)


    The $set() method overwrites the remote value for this object to be the newValue.
    The $set() method also updates local version of the object to the value.


    It takes a single argument:


    **value** (string) The value argument is the new value of the local object. The
    value overwrites the old value, and is subsequently updated to this new value.


    ```

    $scope.items.set({bar: "baz"}); // new Firebase(URL + "/foo") is now null.;

    ```


    # Ordering in AngularFire


    If we want to sort our remote objects, rather than simply sorting locally with
    Angular’s orderBy filter, we can set the $priority field on a record before calling
    $save().'
