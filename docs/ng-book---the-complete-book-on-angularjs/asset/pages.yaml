  md: "# # Dependency Injection\n\nIn general, there are only three ways an object\
    \ can get a hold of its dependencies:\n\n+   1. We can create it internally to\
    \ the dependent.\n2. We can look it up or refer to it as a global variable.\n\
    3. We can pass it in where it's needed.\n\nWith dependency injection, we're tackling\
    \ the third way (the two present other difficult challenges, such as dirtying\
    \ the global scope and making nearly isolation impossible). Dependency injection\
    \ is a design pattern that allows for the removal of hard-coded dependencies,\
    \ making it possible to remove or change them at run time.\n\nThis ability to\
    \ modify dependencies at run time allows us to create isolated environments that\
    \ are ideal for testing. We can replace *real* objects in production with mocked\
    \ ones for testing environments.\n\nFunctionally, the pattern *injects* dependent-upon\
    \ resources into the destination when needed by automatically looking up the dependency\
    \ in advance and providing the destination for the dependency.\n\nAs we write\
    \ component dependent upon other objects or libraries, we will describe its dependencies.\
    \ At run time, an *injector* will create instances of the dependencies and pass\
    \ them along to the *dependent consumer*.\n\n```\n// Great example from the Angular\
    \ docs\nfunction SomeClass(greeter) {\n  this.greeter = greeter;\n}\nSomeClass.prototype.greetName\
    \ = function(name) {\n  this.greeter.greeter(name)\n}\n```\n\n> NOTE: It is never\
    \ a good idea to create a controller on the global scope like we've done in the\
    \ sample code above. We're doing it only as an example for simplicity's sake.\n\
    \nAt runtime, the SomeClass doesn't care how it gets the greeter dependency, so\
    \ long as as it gets it. In order to get that greeter instance into SomeClass,\
    \ the creator of SomeClass is responsible for passing it in the SomeClass dependencies\
    \ when it's created."
  merge: -1
  pgno: 160
