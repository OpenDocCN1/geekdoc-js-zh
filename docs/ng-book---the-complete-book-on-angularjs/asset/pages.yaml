  md: '# Angular Animation


    The Angular team created the ngAnimate module to give our Angular apps hooks into
    providing CSS and JavaScript.


    There are several ways to make animations in an Angular app:


    +   * Using CSS3 Animations

    * Using JavaScript animations

    * Using CSS3 Transitions


    In this chapter, we aim to discuss these three methods of animating and provide
    a solid understanding of how we can power our own custom animations.


    # Installation


    As of 1.2.0.rc1, animations are no longer part of the core of Angular; they exist
    in their own module. In order to include animations in our Angular app, we need
    to install and reference this module in our app.


    We can download it from code.angularjs.org and save it in a place that we can
    reference it from our HTML, like js/vendor/angular-animate.js.


    We can also install it using Bower, which will place it in our usual Bower directory.
    For more information about Bower, see the Bower chapter.


    ```

    $ bower install --save angular-animate

    ```


    We''ll need to reference this library in our HTML after we reference Angular itself.


    ```

    <script src="js/vendor/angular.js"></script>

    <script src="js/vendor/angular-animate.js"></script>

    ```


    Lastly, we''ll need to reference the ngAnimate module as a dependency in our app
    module.'
  merge: -1
  pgno: 397
- img_proc: true
  md: '```

    angular.module(''myApp'', [''ngAnimate'']);

    ```


    We are ready to take on animations with AngularJS.


    # How It Works


    The $animate service itself, by default, applies two CSS classes to the animated
    element for each animation event (see below).


    The $animate service supports several built-in Angular directives that automatically
    support animation without the need for any extra configuration. It is also flexible
    enough to enable us to build our own animations for our directives.


    All of the pre-existing directives that support animation do through monitoring
    events provided on those directives. For instance, when a new ngView enters brings
    new content to the browser, When ngHide is ready to show an element, the remove
    event is fired.


    The following is a list of directives and the events that fires at different states.
    We will use these events to define how our animations will work in each state.


    | Directive | Events |

    | --- | --- |

    | ngRepeat | enter, move |

    | ngView | enter, leave |

    | ngInclude | enter, leave |

    | ngSwitch | enter, leave |

    | ngGlf | enter, leave |

    | ngClass or class="... | add, remove |

    | ngShow | add, remove (.ng-class) |

    | ngHide | enter, remove |


    The $animate service attaches specific classes based upon the events that the
    directive emits. For structural animations (like enter, move) and the CSS classes
    that are applied in the form of ng-[EVENT] and ng-[EVENT]-active.


    For class-based animations (like ngClass) the animation classes are in the form
    [CLASS]-add, [CLASS]-add-active, [CLASS]-remove, [CLASS]-remove-active.


    Finally for ngShow and ngHide only the .ng-hide class is added or removed and
    its form is the same as ngClass: .ng-hide-add, .ng-hide-add-active, .ng-hide-remove,
    .ng-hide-remove-active.'
  merge: -1
