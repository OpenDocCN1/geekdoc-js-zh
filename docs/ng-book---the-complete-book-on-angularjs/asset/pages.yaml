    # # The What and the Why


    Restangular is an Angular service specifically designed simply to fetch data from
    the rest of the world.


    Why not use $http or $resource? Although $http and $resource are built into the
    framework, they carry limitations with them. Restangular takes a completely different
    approach to XHR and makes it a pleasant experience.


    The complete list of benefits to using Restangular is available on the Restangular
    README⁶², but we''ll cover a few benefits here:


    # ## Promises


    Using promises makes Restangular feel Angular-esque, as it uses and resolves on
    promises. That enables us to chain together responses just as though we''re using
    the raw $http method.


    # ## Promise Unwrapping


    You can use Restangular as $resource works, working with Promises and Objects
    at the same time in a very easy way.


    # ## Explicit


    The Restangular library includes little to no magic. We don''t have to guess how
    it works or dig documentation on how to use it.


    # ## All HTTP Methods


    All HTTP methods are supported.


    # ## Forget URLs


    While $resource requires us to specify the URLs we want to fetch, Restangular
    doesn''t require to know the URLs in advance, nor do we have to specify them all
    upfront (other than the base URL).


    # ## Nested resources


    If we want to nested resources, there''s no need to create another instance of
    the Restangular instance; Restangular will handle it for us.


    > ⁶https://github.com/mgonto/restangular'
