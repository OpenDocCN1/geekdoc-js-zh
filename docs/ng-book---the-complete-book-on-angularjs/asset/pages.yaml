  md: '# Server Communication


    # 283


    > Imagine that we have two instances of our application running at the same time.
    What if both are trying to edit the same data? Without handling this case, we
    can get into trouble, especially if we''re building the front end for a complex
    web application, like a bank.


    With Firebase, we can easily add a back end to our Angular app. Featured on the
    Angular(s) home page, Firebase is quickly becoming the standard for Angular persistence.


    Firebase is a real-time back end for building collaborative, modern applications.
    Instead of requiring us to focus on building custom request-response models with
    a server-side component where we manually worry about data synchronization, Firebase
    lets us get up and running in minutes. We can build a data-backed web app entirely
    in Angular that can scale out of the box and update all clients in real time.


    Data that is stored in Firebase is standard schema-less JSON, which makes it incredibly
    easy to save data models of any type into Firebase. If a device loses network
    connection, Firebase continues to allow access to locally cached data and seamlessly
    synchronizes changes with the cloud when the device comes back online.


    > The Firebase client libraries and REST API provide easy access to data from
    any platform. Although we''re focusing specifically on Angular, this fact means
    that native apps or other server-side apps can reach the data that Angularul has
    saved.


    # Three-Way Data Binding With Firebase and Angular


    With Angular, rendering content to the browser easy. Firebase is an excellent
    partner to Angular, as it elegantly handles storing and retrieving data, which
    is the other major component to production-level web apps.


    Angular is great with its two-way data binding between models in JavaScript and
    the DOM. By syncing our Angular model with Firebase, we synchronize our app''s
    data in the model in real time across all clients. That means when data changes
    in one client, these updates immediately persist to Firebase and render across
    all connected devices.'
