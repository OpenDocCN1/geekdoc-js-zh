  md: '# Install Express


    We''re going to use a web application framework called expressjs will give us
    some syntactic sugar around dealing with HTTP. It allows us to only work with
    the functionality of our web app, as opposed to needing to deal with the gritty
    details of Node''s HTTP server.


    Its features are exclusive and providing a clean routing syntax, dynamic middleware,
    and tons of open-source packages built specifically for Express. Additionally,
    many well-known companies use it in production.


    To install Express, we''ll use the npm binary:


    ```

    $ npm install -g express

    ```


    i> We use the -g flag to install the package globally. We can omit it if we don''t
    want to install it globally, thereupon it will be installed in the directory node_modules/
    within the current directory. We recommend installing it globally, however.


    Now, we can use the Express generator to generate our Express app.


    ```

    $ express MyApp

    ```


    This line generates a very basic Express app with a set of requirements and a
    loosely opinioned directory structure.


    ![](img/c29f4deabfb2aac07907f28672b2ed83_250_0.png)


    Running the Express generator


    To run our app, we need to install our dependencies locally using npm again. This
    time, we''ll use it to install the dependencies set in the package.json locally.'
