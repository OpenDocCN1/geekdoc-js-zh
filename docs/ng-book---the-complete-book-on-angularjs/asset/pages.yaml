  md: "# Protected Resources from API\n\nIf we're protecting routes that need to operate\
    \ on protected API calls (i.e., making a protected resource API call to which\
    \ the server can respond with a 401 response code) we're protecting routes that\
    \ need to operate on protected API calls (i.e., making a protected resource API\
    \ call to which the server can respond with a 401 response code) in order to load\
    \ the page, then we can simply rely on $http interceptors to handle the work for\
    \ us.\n\nTo create an $http interceptor that is responsible for responding to\
    \ unauthenticated API requests, we need to create one that handles requests.\n\
    \nLet's set up our $http response interceptor inside of .config() block inside\
    \ our app where we inject the $httpProvider:\n\n```\nangular.module('myApp', [])\n\
    .config(function($httpProvider) {\n  // Build our interceptor\n});\n```\n\nThis\
    \ interceptor handles both responses and responseErrors and will be called on\
    \ all requests.\n\n```\nangular.module('myApp', [])\n.config(function($httpProvider)\
    \ {\n  // Build our interceptor\n  var interceptor = {\n    function($q, $rootScope,\
    \ Auth) {\n      return {\n        'response': function(res) {\n          if (res.config.url\
    \ == '/api/login') {\n            // Assuming our API server response\n      \
    \      // with the following data:\n            // { token: \"AUTH_TOKEN\" }\n\
    \            Auth.setToken(res.data.token);\n          }\n        },\n       \
    \ 'responseError': function(rejection) {\n          // Handle errors\n       \
