  md: 'Optimizing Angular Apps


    # bo-text="text"


    This directive evaluates the text and places it inside of the element. It''s similar
    to ng-bind.


    # bo-href="url" / bo-href-i="url"


    Using bo-href does not allow "url" to require interpolation, while bo-href-i enables
    URL to contain interpolation. These two calls are functionally equivalent:


    ```

    // bo-href does not allow for any interpolation

    <a bo-href="/users/" + User.id"></a>

    // bo-href-i does allow interpolation

    <a bo-href-i="/users/{{ User.id }}"></a>

    ```


    # bo-src="url" / bo-src-i="url"


    The bo-src doesn''t allow for interpolation inside the URL, while bo-src-i does.

    These two are functionally equivalent:


    ```

    // bo-src does not allow for expression with the syntax as ng-style

    <img bo-src="/users/"+User.gravatar" />

    // bo-src-i does allow interpolation

    <img bo-src-i="/users/{{ User.gravatar }}">

    ```


    # bo-alt="text"


    Similar to the bo-text, this directive renders text inside DOM element and sets
    the text as the alt attribute on the element.


    # bo-title="title"


    The bo-title directive renders inside a DOM element and sets the text as the title
    attribute on the element.


    # bo-id="id"


    This directive renders the "id" and sets it as the id attribute on the element.


    # bo-style="style"


    This directive renders the style as an expression with the same syntax as ng-style
    using a watcher.'
