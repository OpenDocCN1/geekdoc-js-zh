  md: '# ng-selected


    Use ng-selected to bind the presence of (or not) of the selected attribute to
    the option tag:


    ```

    <label>Select Two Fish: </label>

    <input type="checkbox" ng-model="isTwoFish"><br>

    <select>

    <option>One Fish</option>

    <option ng-selected="isTwoFish">Two Fish</option>

    </select>

    ```


    Live Example¹³⁵


    # Boolean-like Attributes


    While not technically HTML, boolean attributes like the ng-href and ng-src act
    in a similar manner and are therefore defined alongside the boolean attributes
    within the Angular source code and presented here.


    Both ng-href and ng-src are so likely to help improve refactoring and prevent
    errors when changing code later in a project that it is recommended to use them
    in place of href and src, respectively.


    ng-href


    When dynamically creating a URL from a property on the current scope, always use
    ng-href instead of href.


    The issue is that the user is able to click a link built with href before interpolation
    takes place, which would bring them to the wrong page (often a 404).


    On the other hand, by using ng-href, Angular waits for the interpolation to take
    place (in our example, after two seconds), and then activates the link''s behavior:


    ```

    -- Always use ng-href when href includes an {{ expression }} --

    <a ng-href="{{myRef}}">I''m feeling lucky, when I load</a>


    <!-- href may not load before user clicks --

    <a href="{{myRef}}">I''m feeling 404</a>

    ```


    Delay the interpolation of the string value for two seconds to see this behavior
    in action:'
  merge: -1
