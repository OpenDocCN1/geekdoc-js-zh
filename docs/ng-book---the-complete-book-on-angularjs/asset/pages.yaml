  md: '# Security


    With any client-side app, it''s always a good idea to think about security at
    build time. Additionally, it''s relatively tough to deliver 100% protection in
    any situation, and even more difficult to do it when the client can see the entire
    code.


    In this chapter, we''re going to take a look at some techniques for keeping our
    application secure. We''ll look at how to master the $sce service to secure our
    text input by wrapping authorized requests with tokens (when talking to a protected
    back end).


    # Strict Contextual Escaping: the $sce Service


    The strict contextual escaping mode (available by default in Angular version 1.2
    and higher) tells our app that it requires binding in contexts to return a value
    that is marked as safe for use inside the context.


    For instance, when we want to bind raw HTML to an element using ng-bind-html,
    we want Angular to render the element with HTML, rather than escaped text.


    ```

    <textarea ng-model="htmlBody"></textarea>

    <div ng-bind-html="{htmlBody}"></div>

    ```


    $sce is a fantastic service that allows us to write whitelisted, secure code by
    default and goes a long way helping us prevent XSS and other vulnerabilities.
    Given this power, it''s important to understand what it is that we''re doing so
    we can use it wisely.


    In the above example, the <textarea> is bound to the htmlBody model. In this textarea,
    the user can input whatever arbitrary code they would like to see rendered in
    the div. For instance, it might be a live preview for writing a blog post or comments,
    etc.


    If the user can inject any arbitrary text into the text field, we have essentially
    opened ourselves up to a giant security hole.


    In order protect ourselves against malicious users, it''s a good idea to run our
    unsafe text through a sanitizer.


    The $sce service does for us, by default, all interpolated expressions. No constant
    literals ever untrusted. For instance, this value is always a trusted one, as
    the value is a string.'
  merge: -1
  pgno: 514
- img_proc: true
  md: "<div ng-html-bind-unsafe=\"<<h1>Trusted</h1>\" > </div>\n\nBasically, at the\
    \ root of embedded directives starting in version 1.2 and on, $sce.sce values\
    \ are not bound directly to the value of the binding, but to the result of the\
    \ $sce.getTrusted() method.\n\nDirectives use the new $sce.parseAs() method instead\
    \ of the $parse service to watch attribute bindings. The $sce.parseAs() method\
    \ calls $sce.getTrusted() on all non-content literals.\n\nIn effect, the ng-bind-html\
    \ directive calls $sce.parseAsHtml() between the scenes and binds the value to\
    \ the DOM element. The ng-include directive runs this same behavior and any templateUrl\
    \ defined on a directive.\n\nWhen enabled, all built-in directives call out to\
    \ $sce automatically. We can use this same behavior in our own directives and\
