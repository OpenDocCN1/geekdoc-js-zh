  md: '# The Basics of AngularJS


    The goal of this chapter is to get you comfortable with the terminology and the
    technology and to give you an understanding of how AngularJS works. We''ll start
    putting the pieces together to enable you to build an AngularJS application, even
    if you''ve never written one before.


    # How Web Pages Get to Your Browser


    Let''s think of the Internet as a post office. When you want to send a letter
    to your friend, you first write your message on a piece of paper. Then you write
    your friend''s address on an envelope and place the letter inside of it.


    When you drop the letter off at the post office, the mail sorter sorts it by the
    postal code and address and tries to find where your friend lives. If she lives
    in a giant apartment complex, the postal service deliver the mail to your friend''s
    front desk and let the building''s employees sort it out by apartments.


    The Internet works in a similar way. Instead of a bunch of houses and apartments
    connected by streets, it is a bunch of computers connected by routers and wires.
    Every computer has a unique address that tells the network how to reach it.


    Similar to the apartment building analogy, where we have many apartments that
    share the same address, several computers can exist on the same network or router
    (as when you connect to WiFi at Starbucks). In this case, your computer shares
    the same IP address as the other computers. Your computer can be reached individually,
    however, by its "internal IP address" (like the apartment number in our analogy),
    about which the router is aware (as the building employees in our analogy are
    aware of your friend''s apartment number).


    IP stands for Internet Protocol. An IP address is a numerical identifier assigned
    to each device participating in a network. Computers, printers, and even cell
    phones have IP addresses.


    There are two types of IP addresses: ipv4 and ipv6. The most common addresses
    today are ipv4 addresses. These look like 192.168.0.199. IPv6 addresses look like
    2001:0db8:8000:0000:0000:ff00:0042:8329.


    When you open your browser and type in http://google.com, your web browser "asks"
    the internet (more precisely, it "asks" a DNS server) where google.com''s address
    is. If the DNS server knows the IP address you''re looking for, it responds, with
    that address. If not, it passes the request to other DNS servers until the IP
    address is found and served to your computer. You can see the DNS server response
    by typing this code into a terminal:'
