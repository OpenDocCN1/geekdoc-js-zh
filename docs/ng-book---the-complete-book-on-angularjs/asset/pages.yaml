  md: "```\n.fade-in.ng-enter {\n  -webkit-animation: 2s firstAnimation;\n  animation:\
    \ 2s firstAnimation;\n}\n```\n\n# Staggering CSS Transitions / Animations\n\n\
    The ngimate comes bundled up with an additional feature to space-out simultaneous\
    \ animations by a specified delay. This means that if 10 items are entered into\
    \ a ngRepeat list then each item is inserted X milliseconds after the last one.\
    \ The effect produced from this is known as a stagger effect and ngimate handles\
    \ this out of the box for CSS transitions and animations.\n\n# Staggering CSS\
    \ transitions\n\nFollowing the format of structuring CSS transition code for ng-enter\
    \ and ng-active additional CSS class can also be placed in to provide the stagger\
    \ delay. With the CSS code below we can add a stagger effect to our .fade-in class\
    \ using CSS transitions.\n\n```\n.fade-in.ng-enter-stagger {\n  -webkit-transition-delay:200ms;\n\
    \  transition-delay:200ms;\n\n/* safeguard to prevent accidental CSS inheritance\
    \ */\n  -webkit-transition-duration:0;\n  transition-duration:0;\n```\n\nThe code\
    \ below will perform a 200 millisecond pause between each successive item being\
    \ animated in Notice, however, there is another CSS property which specifies the\
    \ duration and sets it to zero. Why? This is here as a safeguard to prevent accidental\
    \ CSS inheritance from the base CSS class. Otherwise, without this safeguard in\
    \ the staggering effect could be silently ignored.\n\nBut what does this mean\
    \ for our .fade-repeat class? Let's imagine we're using a ngRepeat element that\
    \ does exact that .fade-in class.\n\n```\n<div ng-repeat=\"item in items\" class=\"\
    fade-in\">\n  Item: #1 -- {{ item }}\n</div>\n```\n\nEach time a series of items\
    \ is inserted into the list when the stagger delay will kick in. Item #1 will\
    \ be inserted right away, #2 will go in 200ms after, #3 400ms after and so on."
  merge: -1
