  md: "The link function provides isolation between directives, while the controller\
    \ defines shareable behavior.\n\nBecause a directive can require the controller\
    \ of another directive, however, controllers are a great place to place actions\
    \ we may want to use in more than one directive.\n\nThe controller option attaches\
    \ a controller to the template of the directive, acting just like ngController\
    \ if it were the parent scope of the template.\n\nUsing the controller option\
    \ is good when we want to expose an API to other directives; we can rely on link\
    \ to provide local functionality for the directive element. It is better to use\
    \ when we use scope. $watch() or when we are doing any interaction with the live\
    \ scope of the DOM.\n\nTechnically, the $scope passed into a controller is passed\
    \ before the DOM is actually rendered to the screen. In certain situations, for\
    \ example when working with includes, the scope inside a controller may reflect\
    \ a different scope than we might expect, and the $scope object in such cases\
    \ is not always guaranteed to update.\n\n+   Use the scope argument passed into\
    \ the link function when expecting to interact with the instance of the scope\
    \ on screen.\n\n# controllerAs (string)\n\nThe controllerAs option enables us\
    \ to set a controller alias, allowing us to publish our controller under this\
    \ name and giving the scope access to the controllerAs name. This step allows\
    \ us to reference the controller from inside the view and even allows us to not\
    \ need to inject $scope. For instance, we can create a MainController that never\
    \ injects $scope, like so:\n\n```\nangular.module('MyApp')\n.controller('MainController',\
    \ function() {\nthis.name = \"Ari\";\n});\n```\n\nIn our HTML, we can simply use\
    \ this MainController without needing to reference the scope at all.\n\n```\n\
    <div ng-app ng-controller=\"MainController as main\">\n  <input type=\"text\"\
    \ ng-model=\"main.name />\n  <span>{{ main.name }}</span>\n</div>\n```"
