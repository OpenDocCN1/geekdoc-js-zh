  md: "# Dependency Injection\n\n```\nangular.module('MyApp')\n  .controller('MyController',\n\
    \    ['scope', 'greeter',\nn    function($scope, greeter) {\n\n});\n```\n\nThe\
    \ inline annotation method works with minifiers, as we are passing a list of strings.\
    \ We often refer this method as the bracket or array notation [].\n\n# $inject\
    \ API\n\nAlthough it's relatively rare that we'll need to work directly with the\
    \ $injector, knowing about the API will give us some good insight into how exactly\
    \ it works.\n\n# annotate()\n\nThe annotate() function returns an array of service\
    \ names that are to be injected into function when instantiated. The annotate()\
    \ function is used by the injector to determine which services will be injected\
    \ into the function at invocation time.\nThe annotate() function takes a single\
    \ argument:\n\n+   - fn (function or array)\n\nThe fn argument is either a function\
    \ or an array in the bracket notation of a function definition.\nThe annotate()\
    \ method returns a single array of the names of services that will be injected\
    \ into the function at the time of invocation.\n\n```\nvar injector = angular.injector(['ng',\
    \ 'MyApp']);\ninjector.annotate(function($q, greeter) {\n// ['q', 'greeter']\n\
    ```\n\nTry it in your Chrome Debugger.\n\n# get()\n\nThe get() method returns\
    \ an instance of the service and takes a single argument.\n\n+   - name (string)\n\
    \nThe name argument is the name of the instance we want to get.\nget() returns\
    \ an instance of the service by name."
