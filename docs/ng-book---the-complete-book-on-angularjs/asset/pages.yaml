  md: '# XHR in Practice


    # Cross-Origin and Same-Origin Policy


    Web browsers nearly universally prevent web pages from fetching and executing
    scripts on foreign domains.


    The same-origin policy specifically permits scripts to run on pages that originate
    from the same site. Our browser identifies a page with the same origin by comparing
    the scheme, hostname, and port number of both pages. On any other interactions
    with scripts originating from off-site.


    The Cross Origin Resource Sharing (CORS, for short) is often a source of headaches
    for fetching data over XHR and dealing with foreign sources.


    Fortunately, there are seral ways for us to get data that is exposed by external
    data sources into our app. We''ll look at two of these methods and mention a third(that
    requires a bit more backend support):


    +   * JSONP

    * CORS

    * Server proxies


    # JSONP


    JSONP is a way to get past the browser security issues that are present when we''re
    trying to request data from a foreign domain. In order to work with JSONP, the
    server must be able to support the method.


    JSONP works by issuing a GET request using a <script> tag, instead of XHR requests.
    The JSONP technique creates a <script> tag and places it in the DOM. When it shows
    up in the DOM, the browser takes over and requests the script referenced in the
    src tag.


    When the server returns the request, it surrounds the response with a JavaScript
    function invocation that corresponds to a request about which our JavaScript knows.


    Angular provides a helper for JSONP requests using the $http service. The jsonp
    method of request through the $http service looks like:'
  merge: -1
  pgno: 222
- img_proc: true
  md: "XHR in Practice\n\n212\n\n```\n$http\n.jsonp(\"://api.github.com?callback=JSON_CALLBACK\"\
    )\nsuccess(function(data) {\n  // Data\n});\n```\n\nWhen we call this, Angular\
    \ places a <script> tag on the DOM that might look something like:\n\n```\n<script\
    \ src=\"https://api.github.com?callback=angular.callbacks._0\" type=\"text/javascript\"\
    ></script>\n```\n\nNotice that Angular replaces the JSON_CALLBACK with a custom\
    \ function that Angular creates specifically for this request.\n\nWhen the data\
    \ comes back from the JSONP-enabled server, it is wrapped in the anonymous function\
    \ automatically generated by Angular.callbacks._0.\n\nIn this case, the GitHub\
    \ server will return some JSON wrapped in the callback, and its response might\
    \ look like:\n\n```\n// shortened for brevity\nangular.callbacks._0({\n  \"meta\"\
    : {\n    \"X-Rate-Limit\": \"60\",\n    \"status\": 200,\n  },\n  \"data\": {\n\
    \    \"current_user_url\": \"https://api.github.com/user\"\n  }\n});\n```\n\n\
    When Angular calls the special function, it resolves the $http promise.\n\nWhen\
    \ we write our own back-end servers to support JSONP, we need to ensure that,\
    \ when we respond, we wrap the data inside the function by the request with callback.\n\
    \nWhen using JSONP, we need to be aware of the potential security risks. First,\
    \ we're opening up our server to allow a back-end server to call any JavaScript\
    \ in our app.\n\nA foreign site that we do not control can change its script at\
    \ any time (or a malicious cracker could), exposing our site for vulnerabilities.\
    \ The server or a middleman could potentially send extra JavaScript logic back\
    \ into our page that could expose private user data."
  merge: -1
  pgno: 223
- img_proc: true
  md: "# XHR in Practice\n\nWe can only use JSONP to send GET requests, since we're\
    \ setting a GET request in the <script> tag. Additionally, it's tough to manage\
    \ errors on a script tag. We should use JSONP sparsely only with servers we trust\
    \ and control.\n\n# Using CORS\n\nIn recent years, the W3C has created the CORS\
    \ specification, or Cross Origin Resource Sharing policy, to replace the JSONP\
    \ hack in a standard way.\n\nThe CORS specification is simply an extension to\
    \ the XMLHttpRequest object that allows JavaScript to make cross-domain XHR calls.\
    \ It does so by prefetching a request to the server to effectively ask for permission\
    \ to send the request.\n\nThis preflight gives the receiving server the ability\
    \ to accept or reject any request from all servers, a select server, or set of\
    \ servers. That means that both the client app and the server need to coordinate\
    \ to provide data to the client/server.\n\nThe W3C wrote the CORS specification\
    \ with the intention of abstracting away many of the details from the client-side\
    \ developer so that it appears as though the request is made in the same way as\
    \ a same-origin request.\n\n# Configuration\n\nTo use CORS within Angular, we\
    \ need to tell Angular that we're using CORS. We use the .config() method on our\
    \ Angular app module to set two options.\n\nFirst, we need to tell Angular to\
    \ use the XDomain, and we must remove the X-Requested-With header from all of\
    \ our requests.\n\n> The X-Requested-With header has been removed from the common\
    \ header defaults, it's a good idea to ensure it's removed away.\n\n```\nangular.module('MyApp')\n\
    .config(function($httpProvider) {\n  $httpProvider.defaults.useDomain = true;\n\
    \  delete $httpProvider.defaults.headers['X-Requested-With'];\n});\n```\n\nNow\
    \ we're ready to make CORS requests."
  merge: -1
  pgno: 224
- img_proc: true
  md: "# Server CORS Requirements\n\nAlthough we will not dive into server-side setup\
    \ in this chapter (we do in the server communication chapter), it's important\
    \ that the server we're working with support CORS.\nA server supporting CORS must\
    \ respond to requests with server access control headers:\n\n+   * Access-Control-Allow-Origin\n\
    \nThe value of this header must either echo the origin header or be a * to allow\
    \ any and all requests from any origin.\n\n+   * Access-Control-Credentials (optional)\n\
    \nBy default, CORS requests are not made with cookies. If the server includes\
    \ this header, then we can send cookies along our request by setting the withCredentials\
    \ option to true.\nIf we set the withCredentials option in our http request, but\
    \ the server does not respond with this header, the request will fail and vice\
    \ versa.\nThe back-end server must be able to handle OPTIONS request methods.\n\
    There are two types of CORS requests: simple and non-simple.\n\n# Simple Requests\n\
    \nRequests are simple if they match one of these HTTP methods:\n\n+   * HEAD\n\
    * GET\n* POST\n\nand if they are made with one or many of the following HTTP headers,\
    \ and no others:\n\n+   * Accept\n* Accept-Language\n* Content-Language\n* Last-Event-ID\n\
    * Content-Type\n  * application/x-www-form-urlencoded\n  * multipart/form-data\n\
    \  * text/plain\n\nWe categorize these as simple requests because the browser\
    \ can make these types of requests without the use of CORS. Simple requests do\
    \ NOT require any special type of communication between the server and the client.\n\
    A simple CORS request using the http service looks like any other request:"
