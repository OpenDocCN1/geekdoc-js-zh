  md: '# AngularJS and Internet Explorer


    For instance, it will serve a request to / as index.html, while it will serve
    a request to /about about.html in the snapshots directory.


    # Use Apache to Rewrite Rules


    If we''re using the Apache server128 to deliver our Angular app, we can add a
    few lines to our configuration that we use snapshots instead of our JavaScript
    app.


    We can use the mod_rewrite method to detect if the requested includes the _escaped_fragment_-
    query parameter or not. If it does it, then we will rewrite the point to the static
    version in the /snapshots directory.


    In order to set the rewrite, we need to enable the appropriate modules:


    ```

    $ a2enmod proxy

    $ a2enmod proxy_http

    ```


    Then we need to reload the Apache config:


    ```

    $ sudo /etc/init.d/apache2 reload

    ```


    We can set the rewrite rules either in the virtual host configuration for the
    site or the .htaccess that sits at the root of the server directory.


    ```

    RewriteEngine On

    Options +FollowSymLinks

    RewriteCond %{REQUEST_URI} ^/

    RewriteCond %{QUERY_STRING} ^_escaped_fragment_=?(.*)$$

    RewriteRule ^(.*)$ /snapshots/?$1 [NC,L]

    ```


    # Use Nginx to Proxy URLs


    If we''re using Nginx128 to serve our Angular app, we can add some configuration
    to serve snapshots of our app if there is an _escaped_fragment_ parameter in the
    query string.


    Unlike Apache, Nginx does not require us to enable a module, so we can simply
    update our configuration to replace the path with the query instead.


    In our Nginx configuration (e.g., /etc/nginx/nginx.conf), we need to ensure our
    configuration looks like:


    ```

    http://http.apache.org/

    http://wiki.nginx.org/Main

    ```'
