  md: "# Testing\n\n```\ndefine([\n  'app', 'jquery', 'angular',\n  'angular', 'angularRoute',\
    \ 'angularMocks'\n]),\nfunction() {\n  describe('UnitTest: App, function() {\n\
    \    // just like normal\n    it('is defined', function() {\n      expect(...size([1,2,3])).toEqual(3);\n\
    \    });\n  });\n});\n```\n\n# Jasmine\n\nWe're going to cover the Jasmine testing\
    \ framework. Although Karma does support testing frameworks, the default option\
    \ for Karma is Jasmine.\n\nJasmine is a behavior-driven development framework\
    \ for testing JavaScript code. Since we'll be working closely with the Jasmine\
    \ syntax, let's run through an overview of how to write Jasmine-based test suites.\n\
    \n# Spec Suite\n\nAt the heart of a Jasmine suite is the describe function. This\
    \ function is a global function defined in the Jasmine suite, so we can call it\
    \ directly from the test.\n\nThe describe() function takes two parameters, a string\
    \ and a function. The string is a name or description of the spec suite we're\
    \ setting up. The function encapsulates the test suite.\n\n```\ndescribe('Unit\
    \ test: MainController', function() {\n});\n```\n\nWe can nest these describe()\
    \ functions such that we can create a test tree that executes the different conditions\
    \ that we'll set throughout the tests:"
