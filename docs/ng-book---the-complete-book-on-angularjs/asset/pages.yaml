  md: '# expression (required expression)


    The expression is an Angular expression

    A child $scope is a JavaScript object that protypically inherits methods and properties
    from its parent $scope(s), including the application''s $rootScope.


    Directives that are nested within an ng-controller have access to this new child
    $scope, but be mindful that the scoping rules for each directive apply.


    Recall that the $scope object within a controller should be responsible for the
    actions and models shared by directives of the DOM.


    > An action refers to a traditional JavaScript method on the $scope object.


    > A model refers to a traditional JavaScript object {} where transient state should
    be stored. Persistent state should be bound to a service, which is then responsible
    for dealing with persisting that model.


    > It''s important not to set a value object (string, boolean, or number) directly
    on the $scope of a controller for a number of technological and architectural
    reasons. Data in the DOM should always use a . (dot). Following this rule will
    keep you out of unexpected trouble.


    > Controllers should be as simple as possible. Although we use the controller
    to prototype our functionality, it''s a good idea to refactor the logic using
    services and directives. application architecture for more information.


    Using a controller, we can modify our previous example by placing our data and
    action on a child scope:


    ```

    <div ng-controller="SomeController">

    {{ someModel.someProperty }}

    <button ng-click="someAction()">Communicate</button>

    </div>

    ```'
