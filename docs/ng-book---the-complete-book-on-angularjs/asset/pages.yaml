  md: "# abstract\n\nAn abstract template can never be directly activated, but can\
    \ set up descendants that are activated.\n\nWe can use an abstract template to\
    \ provide a template wrapper around multiple named views, or to pass $scope objects\
    \ to descendant children. We can use them to pass around resolved dependencies\
    \ or custom data or simply to nest several routes under the same 'url' (e.g.,\
    \ have all routes under the /admin view).\n\nSetting up an abstract template is\
    \ just like setting up a regular state, except that we set the abstract:\n\n```\n\
    $stateProvider\n.state('admin', {\n  abstract: true,\n  url: '/admin',\n  template:\
    \ '<div>ui-view</div>'\n})\nn.state('admin.index', {\n  url: '/index',\n  template:\
    \ '<h3>Admin index</h3>'\n})\nn.state('admin.users', {\n  url: '/users',\n  template:\
    \ '<ul>...</ul>'\n});\",\n```\n\n# onEnter, onExit\n\nAngular calls these callbacks\
    \ when we are transitioning into or out of views (respectively). For both options,\
    \ we can set a function we want to call. These functions have access to the resolved\
    \ data.\n\nThese callbacks give us the ability to trigger an action on a new view\
    \ or before we head out to another state. Using them is a good way to launch an\
    \ “Are you sure?” modal view or request that a user log in before he or she heads\
    \ into this state."
