  md: '# angular-gettext


    Similar to angular-translate, angular-gettext also provides translation in a completely
    different method. Rather than relying on us to embed the strings we want to translate
    into the app, we abstract out the specific strings and let our library handle
    them.


    Gettext is an internationalization and localization system that is sponsored by
    the GNU Project and was released in 1995. It''s a popular system for wrapping
    new language support because it wraps strings that can be translated to support
    new languages.


    The angular-gettext library works in the same way, by providing string wrapping
    for strings we want to translate.


    # Installation


    To use angular-gettext, we need to load the angular-gettext library. We can install
    it in several ways, but we prefer Bower.


    +   - Using Bower


    We can install angular-gettext with Bower like so:


    ```

    $ bower install --save angular-gettext

    ```


    Alternatively, we can download the minified version of angular-gettext from GitHub.
    Once we''ve installed the latest stable version of angular-gettext, we can simply
    embed it in our HTML document. We just need to make sure it''s embedded after
    Angular itself, as it depends on the core angular library as well as jquery (as
    it''s a dependency of angular-gettext).


    ```

    <script src="path/to/jquery.js"></script>

    <script src="path/to/angular.js"></script>

    <script src="path/to/angular-gettext.js"></script>

    ```


    Last not least, our app must declare angular-gettext as a dependency:

    var app = angular.module(''MyApp'', [''gettext'']);


    Now we''re ready to use angular-gettext''s components to translate our app!


    # Usage


    The angular-gettext library includes the translate directive, which is simply
    a directive that we place on any of the DOM elements where we want strings to
    be replaced by their translated counterparts.'
  merge: -1
  pgno: 500
- img_proc: true
  md: '# <h1> translate>Hello!</h1>


    Our <h1> contents will be automatically translated using the translated strings
    we''ll define in a few minutes.


    The strings to be translated don''t need to be handled differently than regular
    strings, giving us the power to have full interpolation support from within our
    app.


    # <h1> translate>{{ name }}</h1>


    We can support translating plural notation as well. For instance, let''s say we
    want to translate apple into it''s plural form of apples.


    # <h1> translateOne apple</h1>


    We can add two directives to our <h1> element that signify the current count and
    the eventual string to translate.


    ```

    <h1> translate

    translate-n="count"

    translate-plural="{{ count }} apples"

    One apple

    </h1>

    ```


    If the string translate-n expression results in more than 1, then translate uses
    the translate-plural string; otherwise, it uses the value of the <h1> DOM element.


    The translate-n directive accepts any Angular expression, including functions.
    For more information on expressions, check out the expressions chapter.


    The translate-plural directive is a simple string that replaces the inner value
    of the DOM element upon which it is called.


    Lastly, we can also use the translate filter inside of our app. Sometimes we can''t
    use a directive, for instance:


    ```

    <input type="text" placeholder="Username" />

    ```


    We can use the translate filter to substitute the Username value in the placeholder:'
  merge: -1
