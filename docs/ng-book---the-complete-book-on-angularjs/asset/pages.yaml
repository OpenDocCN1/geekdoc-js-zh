    Backbone.js$^{172}$, and even Python flask$^{173}$ projects.


    Grunt is set up as the build tool; Bower is set up for handling dependency management.


    # Installation


    Installation for Yeoman is simple. First, we need to make sure we have Node.js$^{174}$
    and Git$^{173}$ installed. Some generators require Ruby$^{176}$ and Compass$^{177}$
    to be installed, as well.


    Once we have the dependencies, we can install Yeoman itself using npm:


    ```

    $ npm install -g yo

    ```


    Installing Yeoman installs Grunt and Bower automatically.

    Next, in order to use it, we need to install a generator (Yeoman is useless without
    a generator).


    Let''s install the Angular generator:


    ```

    $ npm install -g generator-angular

    ```


    > To search of all the community generators, we can check out the web interface
    at http://yeoman.io/community-generators.html$^{178}$.


    # Usage


    Using the Yeoman workflow is also easy. First and foremost, we''ll want to create
    a directory in which we can work. Yeoman does not create a working directory for;
    thus, it assumes the directory we''re working in is the directory that will have
    our house.


