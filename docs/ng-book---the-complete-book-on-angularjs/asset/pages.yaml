- img_proc: true
  md: "```\ndescribe('Unit test: MainController', function() {\n  describe('index\
    \ method', function() {\n    // Specs go in here\n  });\n});\n```\n\nIt's a good\
    \ idea to group related specs together using the describe() function. When describe()\
    \ block runs, the strings will be concatenated together along with the spec's\
    \ name. Thus, the above example's title would become \"Unit test: Main index method.\"\
    \n\nThese describe() block titles are then appended to the spec title. This step\
    \ is specifically designed to allow us to read our specs as full sentences, so\
    \ it's important that we name our tests in readable English.\n\n# Defining a Spec\n\
    \nWe define a spec by calling the it() function. This function is also a global\
    \ function defined in the Jasmine test suite, so we can call it from our tests.\n\
    \nThe it() function takes two arguments: a string title or description of the\
    \ spec and a function that contains one or more expectations we'll set to test\
    \ the functionality of our code.\n\nThese expectations are functions, when executed,\
    \ evaluate to true or false. A test with all true expectations is considered a\
    \ passing spec, whereas a spec with one or more expectations that evaluate to\
    \ false is considered a failing test.\n\nA simple test might look like:\n\n```\n\
    describe('A spec suite', function() {\n  it('contains a passing spec', function()\
    \ {\n    expect(true).toBe(true);\n  });\n});\n```\n\nThis single spec's title,\
    \ as appended to the describe() title, becomes \"A spec suite contains a passing\
    \ spec.\"\n\n# Expectations\n\nWhen testing our app, we'll want to assert that\
    \ conditions are how we expect them to be at stages of the app. The tests will\
    \ likely read like so: \"If we click on this button, then we expect this result.\"\
    \ For instance, \"If we navigate to the home page, then we expect the welcome\
    \ message to be rendered.\""
