  md: "# Introduction to Directives\n\n```\n<div my-directive\n  my-url=\"http://google.com\"\
    \n  my-link-text=\"Click me to go to Google\"\n</div>\n```\n\nReload the page\
    \ and notice that the directive we declared a directive has been replaced by its\
    \ template, the link's href is empty, and there's no text inside the brackets.\n\
    \n![](img/c29f4deabfb2aac07907f28672b2ed83_82_0.png)\n\nTo set properties on the\
    \ inner scope of our directive, we have a few options. The simplest option is\
    \ to use the existing scope provided by the controller (ng-controller) inside\
    \ of which we're nested.\n\nWhile simple, however, sharing state leaves us vulnerable.\
    \ If the controller is removed or if a property with the name myUrl is later defined\
    \ on its scope, we'll be forced to change our code, which is costly and frustrating.\n\
    \nTo overcome this common issue, Angular provides the ability to create a new\
    \ scope or create an isolate scope.\n\nIn contrast to inherited scope (child scope),\
    \ discussed earlier in (current scope introduction), an isolate scope is completely\
    \ separate from the current scope of the DOM. In order to set properties on this\
    \ fresh object, we'll need explicitly pass data via attributes, similar to the\
    \ way we pass arguments into a method in JavaScript or Ruby.\n\nWhen we set the\
    \ scope of a directive to a clean object with its own properties,"
