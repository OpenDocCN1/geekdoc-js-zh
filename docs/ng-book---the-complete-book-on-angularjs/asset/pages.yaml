  md: '# Built-In Directives


    ```

    <div>{{ name }}</div>

    ```


    The {{ }} syntax is a templating syntax that''s built into Angular. It creates
    a binding from the containing $scope to view. Any time that the $scope changes,
    we will update automatically on account of this binding.


    Although it doesn''t look like a normal directive, it is, in fact, a shortcut
    for using ng-bind without needing to create an element; it is most commonly used
    with inline text.


    Be aware that {{ }} within the visible viewport of the screen while the page loads
    may cause a flash of unrendered content. To prevent this, use ng-bind instead.


    ```

    <body ng-init=''Hello World''>n{{ greeting }}

    </body>

    ```


    Live Example⁴


    # ng-bind


    Although we can use the {{ }} template syntax within our views (Angular interpolates
    these), we can mimic this behavior with the ng-bind directive.


    ```

    <body> ng-init=''Hello World''>

    <p ng-bind=''greeting''></p>

    </body>

    ```


    Live Example⁵


    When we use the {{ }} syntax, our HTML document loads the element and do not render
    immediately, causing a "flash of unrendered content" (FOUC, for short). We can
    prevent this from being exposed using ng-bind and binding our content to the element.
    The content will then render as the child text node of the element on which ng-bind
    is declared.


    # ng-cloak


    An alternative to using ng-bind to prevent a flash of unrendered content is to
    use ng-cloak on the element containing {{ }}:


    > ⁴http://jsbin.com/ODUseho/1/edit

    ⁵http://jsbin.com/esuhUJ/1/edit'
