  md: '# ng-readonly


    Similar to the other attributes, the HTML spec only looks at the presence of the
    attribute

    only, not its value.


    To allow Angular to an expression that returns a true or false value and, in turn,
    output

    (or not) the readonly attribute, use ng-readonly:


    Type here to make sibling readonly:


    ```

    <input type="text" ng-model="someProperty"><br/>

    <input type="text"

    g-readonly="someProperty"

    value="Some text here"/>

    ```


    # Live Example³⁴


    # ng-checked


    The standard checked HTML attribute is a boolean attribute, and as such, is not
    required to take a

    value. In for Angular to bind the presence of the checked attribute to the value
    of an expression,

    use-checked.


    In the following example, we set the value of someProperty to true using the ng-init
    directive.

    Binding the value of someProperty to ng-checked then tells Angular to output the
    standard HTML

    attribute, which will check the box by default.


    ```

    <label>someProperty {{someProperty}}</label>

    <input type="checkbox"

    g-checked="someProperty"

    g-init="someProperty = true"

    g-model="someProperty">

    ```


    In this example, we do the opposite:


    ```

    <label>anotherProperty {{anotherProperty}}</label>

    <input type="checkbox"

    g-checked="anotherProperty"

    g-init="anotherProperty = false"

    g-model="anotherProperty">

    ```


    Note that we use ng-readonly to bind the value of someProperty and anotherProperty
    inside

    the respective label tags, for the sake of demonstration.


    # Live Example³⁵


    ³⁴http://jsbin.com/etlvik/1/edit

    ³⁵http://jsbin.com/IXOLIRA/1/edit'
