    \ run into a race condition where the Google API may not be loaded when the application\
    \ starts.\n\nThe non-deterministic nature of our application will make the experience\
    \ unusable, instead, we will manually bootstrap our app in the `onloadCallback`\
    \ function.\n\nTo manually bootstrap Angular, we add the `onloadCallback` function\
    \ to the window service. Before we can bootstrap Angular, we need to be sure that\
    \ the Google login client is loaded.\nThe Google API client, or gapi.client, is\
    \ included at runtime and is set by default to load-lazy services. By calling\
