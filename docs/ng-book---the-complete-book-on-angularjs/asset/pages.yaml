    # Bower Overview


    Although we''ll only cover a brief overview, we encourage more exploration at
    the Bower homepage: bower.io¹⁶⁸.


    With our web app, we''re likely going to share the source with other developers
    or deploy to other development machines. Similar to the package.json file for
    npm, we can use a bower.json file to store end-dependencies.


    To get started with a bower.json, we can use the init command that Bower provides.
