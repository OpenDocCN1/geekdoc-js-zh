  md: "# Server Communication\n\n```\nangular.module('myApp')\n.controller(\"MyAuthController\"\
    , function($scope, $firebaseAuth) {\n  // Define our controller here\n});\n```\n\
    \nThe $firebaseAuth service takes two arguments: a Firebase reference and an optional\
    \ object with options. The object can contain the following properties to customize\
    \ how the authentication works with Firebase:\n\n\n - simple - $firebaseAuth requires\
    \ inclusion of the firebase-simple-login.js file by default. This simple value\
    \ is set to false, this requirement is waived, but only custom functionality will\
    \ be enabled, and we can use simple auth.\n- callback - Firebase calls this when\
    \ there is a change in authentication state. We can use this callback as an alternative\
    \ to event on $rootScope, which is the recommended way to handle changes in auth.\n\
    - path - this property is the path to which the user will be redirected if the\
    \ authRequired property is set to the $routeProvider and the user is not logged\
    \ in.\n\n```\nangular.module('myApp')\n.controller(\"MyAuthController\", function($scope,\
    \ $firebaseAuth) {\nvar ref = new Firebase(URL);\n$scope.auth = $firebaseAuth(ref);\n\
    // $scope.user is null until the user logs in.\n});\n```\n\nThe object that $firebaseAuth()\
    \ returns contains a single properly called user.user is set to null if the user\
    \ is logged out and changes to an object containing the user's details once or\
    \ she is logged in. We cover detecting logins.\n\n> The contents of the user's\
    \ detail will vary depending upon the authentication mechanism used, but by the\
    \ very least, it will contain a user id and provider name.\n\n# Authentication\
    \ Events\n\nWith AngularFire, we have access to several methods for changing a\
    \ user's authentication state; these methods are $login(), logout(), and $createUser().\n\
    \nAuthentication state in AngularFire is considered global, and all scopes inherit\
    \ from $rootScope. Since nearly all will broadcast on $rootScope, we can call\
    \ $scope.on(...) from any controller.\n\nGlobal authentication means that we cannot\
    \ have multiple users logged into the same instance of the application at the\
    \ same time. For example, global authentication prevents two users from being\
    \ logged into Gmail at the same time in the same browser instance."
