  md: "# decorator()\n\nThe $service gives us a way to intercept the service instance\
    \ creation. Decorating our services enables us to extend services or replace them\
    \ with something else entirely.\n\nDecorators, themselves, are very powerful in\
    \ that we can not only provide decorations for our services, but we can intercept,\
    \ interrupt, and even replace functionality in the core Angular services. In fact,\
    \ a lot of the core testing functionality is built using $provide.decorator().\n\
    \nUse-cases for decorating services might include decorating a service to cache\
    \ external data requests to localStorage or wrapping a service in a debugging\
    \ or tracing wrappers for development purposes.\n\nFor instance, let's say that\
    \ we want to provide logging calls to our previously defined github. Rather than\
    \ modifying the original service, we can decorate it using a decorator() function.\n\
    \nThe decorator() function takes two arguments:\n\n+   - name (string)\n\nHere\
    \ we pass the name of the service to decorate.\n\n+   - decoratorFn (function)\n\
    \nWe give the function that we'll invoke at time of service instantiation. The\
    \ function is called with injector.invoke, which allows us to inject services\
    \ into it.\n\nIn order to decorate a service, we need to inject the $delegate,\
    \ which is the original service instance that we can decorate.\n\nFor instance,\
    \ to add a decorator function to our custom githubService to add a timestamp to\
    \ every call, we can add a decorator function to the following:\n\n```\nvar githubDecorator\
    \ = function($delegate, $log) {\n  var events = function(path) {\n    var startedAt\
    \ = new Date();\n    var events = $delegate.events(path);\n    var result = $delegate.locate();\n\
    \    // Events is a promise\n    events.always(function() {\n      $log.info(\"\
    Fetching events \" +\n        \"took \" + +\n        (new Date() - startedAt)\
    \ + \"ms\");\n    });\n  };\n  return result;\n}\n```"
