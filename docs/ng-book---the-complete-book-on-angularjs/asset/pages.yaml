  md: '# Introduction to Directives


    As web developers, we''re all familiar with HTML. Let''s take a moment to review
    and synchronize our terminology around this most fundamental of web technologies.


    # HTML Document


    An HTML document is a plain text document that contains structure and may be styled
    through CSS or manipulated with JavaScript.


    # HTML Node


    An HTML node is an element or chunk of text nested inside another element. All
    elements are also nodes; however, a text node is not an element.


    # HTML Element


    An element comprises an opening tag and a closing tag.


    # HTML Tag


    An HTML tag is responsible for marking the beginning and end of an element. A
    tag itself is declared using angle brackets.


    An opening tag contains a name that becomes the name of the element. It can also
    contain attributes, which decorate the element.


    # Attributes


    To provide additional information about an element, HTML elements can contain
    attributes. These attributes are always set in the opening tag. We can set them
    in a key-value pair, like key="value", or as only a key.


    Let''s take a look at the <a> hyperlink tag, which is used to create a link from
    one pair to another: Some tags, like the hyperlink tag, have special attributes
    that act much like arguments to the tag. For example, the href attribute of a
    link tag enables the behavior of the link tag and also turns the text node in
    between the opening and closing tags blue by default on all browsers.'
  merge: -1
