  md: '# Writing Tests


    Protractor uses Jasmine by default and, thus, the tests that we''ll write are
    very similar to those that we can write with karma a few key differences.


    Protractor exposes a few global variables that we can use in our tests:


    # browser


    This variable is a wrapper around the instance of the webdriver. We''ll use it
    for navigation and page information.


    # element


    The element function helps us find and interact with elements on the page that
    we''re testing. Remember: The return value of element is not a DOM element; it''s
    an instance of ElementFinder, which is an object that acts over webdriver. We
    can use this object to interact with our objects on the page using methods such
    as sendKeys and click.


    The full API is extensive; more documentation can be found on the documentation
    page that can be found on Github.


    https://github.com/angular/protractor/blob/master/docs/api.md¹²


    # by


    This option is the collection of element locator strategies. We can use it to
    find elements by CSS selectors, IDs, or even attributes that are bound via ng-model.


    by.binding This option allows us to search for elements that are bound either
    by ng-bind or by the template notation {{ }}


    by.model We can use by.model to search for input elements that are bound by ng-


    by.repeater We can search for elements that contain the directive ng-repeat.


    by.id This allows us to search for elements by their CSS ID.


    by.css We can search for elements by their CSS selector by.css. Since we''ll use
    by selectors often, Protractor binds the global variable of $ to the function
    element.by.css as a convenience.


    > ¹²https://github.com/angular/protractor/blob/master/docs/api.md'
  merge: -1
