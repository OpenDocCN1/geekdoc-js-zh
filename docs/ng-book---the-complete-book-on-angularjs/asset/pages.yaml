    # Animating ngClass


    It''s possible to animate based upon behavior that happens when classes are changed
    in the view. When a CSS class changes (such as in the ngShow and ngHide directives),
    $animate notices and triggers animations for both when the classes are added and
    when the others are removed.


    Instead of using the naming convention for entering, we can use a new CSS convention
    for ngClass whereby we postfix the new class as: [CLASSNAME] - add and [CLASSNAME]-remove''.'
