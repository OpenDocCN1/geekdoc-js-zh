  md: '# Introduction to Directives


    ![](img/c29f4deabfb2aac07907f28672b2ed83_77_0.png)


    Replacing existing element


    From now on, we''ll refer to these custom elements we created (using the `directive()`
    method) as directives, in fact, we do not need to make a new custom element to
    declare directive.


    > Declaring a directive is the act of placing a function within HTML as an element,
    attribute, class, or comment.


    The following are valid formats for declaring the directive we built above:


    ```

    <my-directive></my-directive>

    <div>my-directive="my-directive"></div>

    <div class="my-directive"></div>

    n<!-- directive: my-directive -->

    ```


    In order to allow for Angular to invoke our directive, we''ll need to change the
    restriction option inside our directive definition. This option tells Angular
    which declaration format(s) to look for when compiling our HTML. We can specify
    one or more formats.


    For example, the directive we''re building, we can specify that we want our directive
    to be invoked if it is an element (E), an attribute (A), or a comment (M):'
  merge: -1
  pgno: 77
