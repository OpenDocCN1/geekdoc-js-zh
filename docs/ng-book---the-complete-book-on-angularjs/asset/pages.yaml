    # Building the Angular Service


    We won''t put our logic into the Controller to fetch the weather, as it is both
    inefficient (the controller will be blown away when we navigate to another page,
    and we''ll need to re-call the API every time the controller is loaded) and poor
    design to mix in business logic with implementation details.


    Instead, we''ll use a service. A service persists across controllers for the duration
    of the application''s lifetime and is the appropriate place for us to hide business
    logic away from the controller.


    We need to configure our app when it boots up, so we need to create our service
    using the .provider() method. This is the only service creation method that we
    can inject into .config() functions.


    To build the service, we''ll use the .provider() API method that takes both a
    name of the service as well as a function that defines the actual provider.


    ```

    angular.module(''myApp'', [])

    .provider(''Weather'', function() {

    })

    ```


    Inside of this method, we need to define a $get() function that returns the methods
    available to the service. To configure this service, we need to allow a method
    for the API key to be set on configuration. These methods live outside of the
    scope of the $get() function.'
