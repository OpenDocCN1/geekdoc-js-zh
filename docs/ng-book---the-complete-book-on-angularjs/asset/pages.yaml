  md: "# Promises\n\nAngular’s event system (which we discuss in depth in the under\
    \ hood chapter) provides a lot of power to our Angular apps. One of the most powerful\
    \ features it gives us is the automatic resolution of promises.\n\n# What’s a\
    \ Promise?\n\nA promise is a method of resolving a value (or not) in an asynchronous\
    \ manner. Promises are objects that represent the return value or thrown exception\
    \ that a function may eventually provide. Promises are incredibly useful in dealing\
    \ with remote objects, and we can think of them as a proxy for remote objects.\n\
    \nTraditionally, JavaScript uses closures, or callbacks, to respond with meaningful\
    \ data that is not available synchronously, with XHR requests after a page has\
    \ loaded. Rather than depending on a callback to fire, we can interact with the\
    \ data as though has already returned.\n\nCallbacks have worked for a long time,\
    \ but the developer suffers when using them. Callbacks provide no consistency\
    \ and no guaranteed call, they steal code flow when depending upon other callbacks,\
    \ and they generally make debugging incredibly difficult. At every step of the\
    \ way, we have to deal with *explicitly* handling errors.\n\nInstead of firing\
    \ a function and hoping to get a callback run when executing asynchronous methods,\
    \ promises offer a different abstraction: Return a promise object.\n\nFor example,\
    \ in traditional callback code, we might have a method that sends a message from\
    \ one user to the user’s friends.\n\n```\n// Sample callback code\nUser.get(fromId,\
    \ {\n  success: function(err, user) {\n    if (err) return {error: err};\n   \
    \ user.friends.find(todo, function(err, friend) {\n      if (err) return {error:\
    \ err};\n      user.sendMessage(friend, message, callback);\n    });\n  },\n \
    \ failure: function(err) {\n    return {error: err};\n  }\n});\n```"
  merge: -1
  pgno: 240
- img_proc: true
  md: "# Promises\n\nThis callback pyramid is already getting out of hand, and we\
    \ haven't included any robust error-handling code, either. Additionally, we need\
    \ to know the order in which the arguments are called from within our callback.\n\
    \nThe promised-based version of the previous code might look somewhat closer to:\n\
    \n```\nUser.get(fromId)\n.then(function(user) {\n  return user.friends.find(told);\n\
    }, function(err) {\n  // We couldn't find the user\n})\n.then(function(friend)\
    \ {\n  return user.sendMessage(friend, message);\n}, function(err) {\n  // The\
    \ user's friend resulted in an error\n})\n.then(function(success) {\n  // user\
    \ was sent the message\n}, function(err) {\n  // An error occurred\n});\n```\n\
    \nNot only is this code more readable; it is also much easier to grok. We can\
    \ guarantee that the callback will resolve to a single value, rather than having\
    \ to deal with the callback interface.\n\nNotice that in the first example, we\
    \ handle errors differently from how we handle non-errors. We need to make sure\
    \ when using callbacks to handle errors, we check if an error is defined in the\
    \ tradition API response signature (usually with (err, data) being the usual method\
    \ signature). All of our API methods must implement this same structure.\n\nIn\
    \ the second example, we handle the success and error in the same way. Our resultant\
    \ object will receive the error in the usual manner. The promise API is specific\
    \ about resolving or rejecting promises, so we also don't have to worry about\
    \ our methods implementing a different method signature.\n\n# Why Promises?\n\n\
    Escaping from callback hell is just one by-product of using promises. The real\
    \ point of promises is to make asynchronous functions look more like synchronous\
    \ ones. With synchronous functions, we can capture both return values and exceptions\
    \ as expected.\n\nWe can capture errors at any point of the process and bypass\
    \ future code that relies upon the error of that process. We achieve all of these\
    \ things without thinking about the benefits of this synchronous code - it's simply\
