  md: '# angular-gestures and Multi-Touch Gestures


    angular-gestures is an Angular module that gives us the ability to handle multi-touch
    actions in our Angular apps. It is based on the very popular and well-tested Hammer.js¹¹³
    library.

    The Hammer.js library gives us a bunch of events common to touchscreen events:


    +   * Tap

    * DoubleTap

    * Swipe

    * Drag

    * Pinch

    * Rotate


    The angular-gestures library enables us to use these events using Angular directives.
    For instance, all of the following directives are available to us:


    +   * hmDoubleTap : ''doubletap''

    * hmDragStart : ''dragstart''

    * hmDrag : ''drag''

    * hmDragUp : ''dragup''

    * hmDragDown : ''dragdown''

    * hmDragLeft : ''dragleft''

    * hmDragRight : ''dragright''

    * hmDragEnd : ''dragend''

    * hmHold : ''hold''

    * hmPinch : ''pinch''

    * hmPinchIn : ''pinchin''

    * hmPinchOut : ''pinchout''

    * hmRelease : ''release''

    * hmRotate : ''rotate''

    * hmSwipe : ''swipe''

    * hmSwipeUp : ''swipeup''

    * hmSwipeDown : ''swipedown''

    * hmSwipeLeft : ''swipeleft''

    * hmSwipeRight : ''swiperight''

    * hmTap : ''tap''

    * hmTouch : ''touch''

    * hmTransformStart : ''transformstart''

    * hmTransform : ''transform''

    * hmTransformEnd : ''transformend''


    > ¹¹³http://eightmedia.github.io/hammer.js/'
