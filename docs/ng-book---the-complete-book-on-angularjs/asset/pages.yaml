  md: 'Mobile Apps


    The directory where we''ll create the app


    +   - package-id


    The ID of the project (the package name in reverse-domain style)


    +   - name


    The package name (name of the application)


    ```

    $ cordova create gapapp io.fullstack.gapapp "GapApp"

    ```


    This line sets up a directory called gapapp (identified by the first parameter)
    with a package id io.fullstack.gapapp and the project name GapApp.


    ![](img/c29f4deabfb2aac07907f28672b2ed83_478_0.png)


    The Cordova team has broken Cordova into plugins so that we don''t need to include
    any platforms we won''t be building for; this breakdown makes it easier to develop
    support for other platforms. That means we need to add to our project platforms
    for which we''re interested in developing. For this project, we can assume the
    rest of these commands are run from inside the project directory.


    ```

    $ cd gapapp/

    ```


    We''ll be building for iOS (although the process is the same for other platforms).
    To add iOS as a platform, simply add it to the project using the following Cordova
    command:


    ```

    $ cordova platform ios

    ```


    For this command to work, we need to ensure that we have the iOS SDK installed
    with Xcode. Download the iOS SDK and XCode at developer.apple.com$^{11}$


    Once you have that, build the basic app:


    > $11}$https://developer.apple.com/'
