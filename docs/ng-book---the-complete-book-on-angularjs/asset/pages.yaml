  md: '# Compile Phase


    The first is called the compile phase. During the compile phase, Angular slur
    up our initial HTML page and begins processing the directives we declared according
    to the directive definitions we defined within our application''s JavaScript.


    Each directive can have a template that may contain their own templates. When
    Angular invokes a directive in the root HTML document, it will traverse the template
    for that directive, itself may contain directives, each with its own template.


    This tree of templates can be arbitrarily drawn and but, there is one caveat:
    it''s true that an element can be backed or decorated (via attributes) with more
    than one directive and that any directive can contain a template that may contain
    directives with templates, only the template belonging to the highest-priority
    directive will be parsed and added to the tree of templates. The practical advice
    here is to separate directives that contain templates from that add behavior.
    Never further decorate an element with another directive if already has a directive
    that brings its own template. Only the template of the directive with the highest
    priority will be compiled.


    ![](img/c29f4deabfb2aac07907f28672b2ed83_134_0.png)


    When a directive and its children templates have walked or compiled, a function
    is returned for the compiled template known as the template function. Before the
    template function for a directive is returned, however we have the opportunity
    to manipulate the DOM tree.


    At this point the DOM is not bound, we''ve got just HTML we can manipulate with
    little to no performance costs. During this phase, built-directives, such as ng-repeat
    and ng-transclude, take advantage of this fact and manipulate the DOM before it
    has bound to any scope data.


    ng-repeat, for example, loops over the array or object it has been given, building
    out the full representation of the DOM before the first pass for data binding.


    If we''re building an unordered list using ng-repeat, where each <li> is decorated
    with the ng-click directive, this process provides us with performance that is
    of magnitude faster than we had built the list manually, especially as our list
    approaches 100 elements.


    The difference is instead of cloning an <li>, linking with it, and repeating that
    for each item in the loop, we''re simply building the unordered list first, then
    passing the new version of the DOM (the compiled DOM) to the linking phase, the
    next phase in the directive cycle.


    Once we have compiled a complete representation of a single directive, we momentarily
    have access to it via the compile function, whose method signature includes access
    to the element the directive was declared (tAttrs) and other attributes. This
    compile function returns the template function (mentioned above), which includes
    the entire parsed tree.


    The main takeaway is that each directive may have its own template and its own
    compile function, each directive returns its own template function. The top-level
    directive that'
