  md: '# Browser Captures


    The Karma generator will ask which browsers you want to start automatically to
    capture their results. Upon termination of the test runner, Karma will shut down
    these browsers, as well. We can also test any browser by opening the URL that
    Karma''s web server is listening to (defaults to http://localhost:9876), which
    is worth keeping in mind if you want to test Internet Explorer from another machine
    (VM) over your local network.


    Each browser requires additional plugins to install and run the browsers using
    Karma. We can install these plugins using npm. For instance, to enable Karma to
    control Chrome, we''ll need to install the Chrome launcher plugin:


    ```

    $ npm install --save-dev karma-chrome-launcher

    ```


    If we want to use Safari, we''ll need to install the Safari launcher; for Firefox,
    the firefox launcher, and so on.


    browsers: [''Chrome'', ''Safari''],


    # Source and Test Files


    The Karma generator will ask where your source and test files are located. This
    array can contain simple strings and/or objects.


    Strings can be patterns (e.g., app/js/**/*.js), or file locations (e.g.,app/js/main.js).
    These files and patterns are relative to the basePath.


    We can also specify files using an object (instead of a string), which is useful
    if we want to configure certain aspects of a file path or pattern. In the following
    example, this object tells Karma to watch the file public/js/watch-me.js for changes,
    but to not include the file on the page or serve it to a URL:


    ```

    (pattern: ''public/js/watch-me.js'', watched: true, included: false, served: false)

    ```


    Note that the reason for using an object is to provide fine-grained control over
    a file or file pattern; thus, the pattern property is required. The other properties,
    such as included, have defaults and therefore only need to be set when our pattern
    deviates from the norm.


    Let''s discuss each option and its defaults in detail:


    pattern The pattern is a regex that match test files, this option can be either
    a path to a single file or a pattern of files in the same manner that strings
    are listed above.'
