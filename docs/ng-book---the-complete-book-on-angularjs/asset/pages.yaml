  md: "# addClass()\n\nThe `addClass()` method triggers a custom animation event based\
    \ on the 'className' variable and attaches the 'className' value to the element\
    \ as a CSS class. When adding a class to a DOM element, the $animate service adds\
    \ a suffix to the className with -add to allow for us to set up animation.\n\n\
    **Note:** If there are no CSS transitions or keyframe animations defined on the\
    \ CSS selector ([className]-add), ngAnimate will not trigger the animation, it\
    \ will only add the class.\n\nThe addClass() method takes three parameters:\n\n\
    +   - element (jQuery/jqLite element)\n\nThe element we're animating\n\n+   -\
    \ className (string)\n\nThe CSS class that we're animating and attaching to the\
    \ element\n\n+   - done (function)\n\nThe callback function called when the animation\
    \ is complete\n\n```\nangular.module('App', ['ngAnimate'])\ndirective('myDirective',\
    \ function($animate) {\nreturn {\n  template: <div class=\"myDirective\"></div>\n\
    \  link: function(scope, ele, attrs) {\n    ele.bind('click', function() {\n \
    \     $animate.addClass(ele, 'greenlight');\n    });\n  }\n}\n});\n```\n\nCalling\
    \ the addClass() method runs through the following steps:\n\n+   1. Runs any JavaScript-defined\
    \ animations on the element\n2. The [className]-add class is added to the element\n\
    3. $animate scans the CSS styles for transition/animation duration and delay properties\n\
    4. The [className]-add-active class is added to the element's class (triggering\
    \ the CSS animation)"
  merge: -1
  pgno: 429
- img_proc: true
  md: "5. $animate waits for the defined duration to complete\n\n6. The animation\
    \ ends, and $animate removes the two added classes [className]-add and [className]-add-active\n\
    \n7. The className() class is added to the element\n\n8. The done() callback function\
    \ is fired (if defined)\n\n# removeClass()\n\nremoveClass() method triggers a\
    \ custom animation event based on the className and removes the CSS class provided\
    \ by the className value. When removing a class on a DOM element, $animate service\
    \ adds a suffix to the className with -remove to allow us to set up animation.\n\
    \nNote: If there are no CSS transitions or keyframe animations defined on the\
    \ CSS selector: [className]-remove, ngAnimate won't trigger the animation, it\
    \ will only add the class.\n\nThe removeClass() method takes three parameters:\n\
    \n+   - element (jQuery/jqLite element)\n\nThe element we're animatin\n\n+   -\
    \ className (string)\n\nThe CSS class we're animating and removing from the element\n\
