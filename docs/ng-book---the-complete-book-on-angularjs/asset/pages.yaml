  md: "Communicating with the Outside World: XHR and Server-Side Communication\n\n\
    When we call the $http method, it won't actually execute until the next $digest\
    \ loop runs. Although most of the time we'll be calling $http inside of an $apply\
    \ block, we can also execute the method outside of the Angular digest loop.\n\n\
    To execute an $http function outside of the $digest loop, we need to wrap it in\
    \ an $apply block. That will force the digest loop to run, and our promises will\
    \ resolve as we expect them to.\n\n```\n$scope.apply(function() {\n$http({\n \
    \ method: 'GET',\n  url: '/api/users.json'\n});\n});\n```\n\n# Shortcut Methods\n\
    \nThe $http service provides handy methods that allow us to shorten method calls\
    \ that don't require more customization than a URL and a method name (or with\
    \ data POST or PUT requests). These shortcuts allow us to modify the above $http\
    \ GET call to:\n\n```\n// Shortened GET request\n$http.get('/api/users.json');\n\
    ```\n\n# get()\n\nThis method is the shortcut for sending a GET request.\n\nThe\
    \ get() function accepts two parameters:\n\n+   * url (string)\n\nA relative or\
    \ absolute URL specifying the destination of the request.\n\n+   * config (optional\
    \ object)\n\nThis object is an optional configuration object.\n\nThe get() method\
    \ returns a HttpPromise object."
