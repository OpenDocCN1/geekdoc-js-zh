  md: "# Security\n\nInside our controller, we can set up a $watch to monitor changes\
    \ in the email.rawHtml and run a trusted parser on the HTML content any time it\
    \ changes.\n\n```\n.controller('MyController', [\n  '$scope', '$sce',\n  function($scope,\
    \ $sce) {\n    // set up a watch on the email.rawHtml\n    $scope.watch('email.rawHtml',\
