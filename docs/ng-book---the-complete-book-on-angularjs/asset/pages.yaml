    $scope.on(''$includeContentLoaded'',

    function(evt) {

    });",

    ```


    # IncludeContentLoaded


    The includeContentLoaded event fires from the ngInclude directive when the ngInclude
    content is reloaded.


    # IncludeContentRequested


    The includeContentRequested event is emitted on the scope from which the ngInclude
    is called. This is emitted every single that the ngInclude content is requested.


    # viewContentLoaded


    The viewContentLoaded event is emitted on the current ngView every single time
    that ngView content is reloaded.


    # Core System $broadcasted Events


    # $locationChangeStart


    The locationChangeStart event is fired when Angular starts to update the browser''s
    location based upon a mutation by the $location service (through $location.path(),$location.search(),
    etc.).


    # $locationChangeSuccess


    The locationChangeSuccess event is broadcasted from the $rootScope and only if
    we have not prevented the $locationChangeStart event when the location of the
    browser changes successfully.


    # $routeChangeStart


    The routeChangeStart event kicks off from the $rootScope before a route change
    occurs. It is at this point that the route services start to resolve all of the
    dependencies needed for the route to occur.


    This process usually involves fetching view templates and any resolve dependencies
    on the route property.'
