  md: "# Installation\n\nThe ngResource module is an Angular module that adds support\
    \ for interacting with RESTful back-end data sources. Since the ngResource module\
    \ is not built into Angular by default, we need to install it and reference it\
    \ inside of our app.\n\nWe can download it from code.angular.org and save it in\
    \ a place that we can reference it from our HTML, let as `js/angular-resource.js`.\n\
    \nWe can also install it using Bower, which places it in our usual Bower directory.\
    \ For more information about Bower, see the bower chapter.\n\n```\n$ bower install\
    \ --save angular-resource\n```\n\nWe need to reference this module in our HTML\
    \ after we reference Angular itself.\n\n```\n<script src=\"js/vendor/angular.js\"\
    ></script>\n<script src=\"js/vendor/angular-resource.js\"></script>\n```\n\nLastly,\
    \ we need to reference the ngResource module as a dependency in our app module:\n\
    \n```\nangular.module('MyApp', ['ngResource']);\n```\n\nNow we're ready to use\
    \ the $resource service.\n\n# Using $resource\n\nThe $resource service itself\
    \ is a factory that creates a resource object. The returned $resource object has\
    \ methods that provide a high-level API to interact with back-end servers.\n\n\
    ```\nvar User = $resource('/api/users/:userId.json',\n{\n  userId: '@id'\n});\n\
    ```\n\n$resource returns a class object with a few methods for default actions.\
    \ We can think of the User object as an interface to our RESTful back-end services.\n\
    \nThis resource class itself contains methods that allow us to interact indirectly\
    \ with our back-end services.\n\nBy default, this object generates five methods\
    \ that allow us to interact with a collection of resources or to generate an instance\
    \ of a resource object. It creates two methods that are HTTP GET-based methods\
    \ and three that are non-GET methods.\n\n> http://code.angular.org/"
  merge: -1
