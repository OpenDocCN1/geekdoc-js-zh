  md: "Optimizing Angular Apps\n\n# Optimizing ng-repeat\n\nOne of the biggest sources\
    \ of delay in Angular is the ng-repeat directive. For every single element ng-repeat\
    \ places, there will be at least one data binding per entry in the list, and this\
    \ fact does not even count any of the bindings we create inside of the list elements.\n\
    \nLet's take a look at the performance of the following list generated by ng-repeat:\n\
    \n```\n<ul>\n  <li> ng-repeat=\"email in emails\">\n    <a ng-href=\"/from/{{\
    \ email.sender }}\">\n      {{ email.sender }}\n    </a>\n    <a ng-href=\"/email/{{\
    \ email.id }}\">\n      {{ email.subject }}\n    </a>\n  </li>\n</ul>\n```\n\n\
    For every single email in our list, we are going to have, at minimum, one watch\
    \ generated by the ngRepeat directive (this watch monitors the list for changes).\
    \ Since Angular creates a $watch for every single ng directive, the above list\
    \ has 4 + 1 watches per email. For a list of 100 emails, the usages already creates\
    \ 500 watches, and the example list is not even a complex for the entire page.\n\
    \nWith relatively short list, it's obvious to see how the performance of the app\
    \ can be greatly reduced with any significantly sized app. There are some relatively\
    \ simple ways that we can speed up our application.\n\n# Optimizing the $digest\
    \ Cash\n\nWe can often determine when and to which scope(s) running the $digest\
    \ loop will affect when we change a variable. When this is the case, we don't\
    \ need to invoke the entire $digest loop on the $rootScope using $scope.apply()\
    \ (which causes every child $scope to run in the $digest loop). Instead, we can\
    \ directly call $scope.digest().\n\nCalling $scope.digest() only runs the digest\
    \ loop on the specific scope that called $digest() and all of its children.\n\n\
    # Optimizing $watch Functions\n\nSince the $watch list expressions are executed\
    \ every $digest loop, it's important that we keep the functionality tiny. The\
    \ smaller and more focused the $watch expression, the more performant our application\
    \ will be."
  merge: -1
  pgno: 565
- img_proc: true
  md: "# Optimizing Angular Apps\n\nAvoiding deep comparisons, complex logic, and\
    \ any loops in our $watch() functions will help speed\nup your applications.\n\
    \nFor instance, we could set up a watch that watches an object. Imagine we have\
    \ an Account object:\n\n```\n$scope.account = {\n  active: true,\n  userId: 123,\n\
    \  balance: 1000 // in cents\n}\n```\n\nPresumably, we'd want to watch for time\
    \ the balance changes and set the account to not active\nif the balance reaches\
    \ zero. We can set up a $watch function that watches the account object and\n\
    updates the account whenever the balance changes:\n\n```\n$scope.watch('user',\
    \ function(newAccount) {\n  if (newAccount.balance <= 0) {\n    $scope.account.active\
    \ = false\n  }\n}, true);\n```\n\nThe third argument in the $watch() function\
    \ tells Angular to watch the object using deep\ncomparison, checking every property\
    \ with the angular.equals() function.\n\nThis will cause terrible performance.\
    \ Not only is Angular making a copy of the object, but\nit stores and saves it\
    \ while it needs to walk through every property to check if any of them have\n\
    \ changed.\n\nA tip for building our $watch functions: Use them to keep track\
    \ of variables that clearly affect the\nview. Anything that does not affect the\
    \ view does not need a $watch function.\n\nSometimes it makes sense for us to\
    \ remove watchers, specifically when a $watch function becomes\nirrelevant because\
    \ the data is static and we just want to expose it in our view the first time.\n\
    \nWe can easily remove custom watchers from our view: The $watch function itself\
    \ returns a function\natables us to remove the $watch function.\n\nFor instance,\
    \ say we have a custom directive that is waiting for the resolution of a variable\
    \ name:\n\n```\n<div data-my-directive name=\"customerName\"></div>\n```\n\nSince\
    \ the customerName isn't likely to change once it's set, we can see we can optimize\
    \ the use of this\ndirective by removing the $watch function we've set up:"
  merge: -1
  pgno: 566
