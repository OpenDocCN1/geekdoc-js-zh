  md: "# Next Steps\n\n```\n<script src=\"template.js\"></script>\n```\n\nFirst off,\
    \ like any Grunt task, we need to configure it. The configuration template key\
    \ is ngtemplates. Inside of this ngtemplates configuration block, we set a subtask\
    \ that will become the name of the Angular module we're loading.\n\nFor example:\n\
    \n```\nngtemplates: {\n  myApp: {}\n}\n```\n\nThis code generates the output of\
    \ our template.js file as:\n\n```\nangular.module('MyApp')\n.run([$templateCache,\
    \ function($templateCache) {\n  $templateCache.put('home.html', ...);\n}])\n```\n\
    \nThe name of the subtask MyApp is the same as the Angular module which is where\
    \ the $templateCache will place it's templates.\n\nWe'll set our options inside\
    \ of this subtask.\n\n# Available Options\n\n# bootstrap\n\nBy default, angular-grunt-templates\
    \ wraps the function($templateCache) {} inside of the angular.module('MyApp').run([$templateCache,\
    \ __]); We can change this configuration if we're using CommonJS or RequireJS\
    \ with the bootstrap option:\n\n```\n// ...\n```\n\n```\nbootstrap: function(module,\
    \ script) {\n  return 'module.exports[module] = ' + script + ';';\n}\n```\n\n\
