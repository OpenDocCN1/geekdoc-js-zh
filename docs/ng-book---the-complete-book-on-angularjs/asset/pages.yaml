  md: '# Security Token Service (STS)


    This web service allows us to request temporary and limited privileged credentials
    for IAM users. We won''t cover STS in depth, but it does a nice interface for
    creating limited secure operations on our data.


    # AWSJS + Angular


    In this section, we intend to demonstrate how to get our applications up and running
    on the AWSJS stack in minutes.


    To do so, we''re going to create a miniature, bare-bones version of Gumroad^7
    to which we will allow our users to upload screenshots. We''ll let them sell their
    screenshots by integrating with the fantastic Stripe^8 API.


    > We recommend these two services enough; this mini-demo is not intended to replace
    their services, only to demonstrate the power of Angular and the AWS API.


    To create our product, we need to:


    +   - Allow users to log into our service and store their unique emails

    - Allow users to upload files that are associated with them

