  md: "Communicating with the Outside World: XHR and Server-Side Communication\n\n\
    ```\nangular.module('myApp')\n.config(function(RestangularProvider) {\n  RestangularProvider.setRequestInterceptor(\n\
    \  function(elem, operation, what) {\n    if (operation === 'put') {\n      elem._id\
    \ = undefined;\n      return elem;\n    }\n    return elem;\n  });\n});\n```\n\
    \n# Custom Fields\n\nRestangular also supports setting custom Restangular fields,\
    \ which is important for times when we are connecting to a back-end server, but\
    \ to a back-end database, such as MongoDB, where the id field doesn't module map\
    \ to an id. When connecting to MongoDB, the id field actually maps to _id.$oid.\n\
    \n```\nangular.module('myApp')\n.config(function(RestangularProvider) {\n  RestangularProvider.setRestangularFields({\n\
    \    id: '_id.$oid'\n  });\n});\n```\n\n# Catching Errors with errorInterceptors\n\
    \nIt's also possible to set errorInterceptors for those times when we want to\
    \ catch an error from within Restangular. Using the errorInterceptor gives us\
    \ the ability to halt the flow of the error down to our app.\n\nIf we return false\
    \ from the errorInterceptor, the flow of the promise ends, and our app will never\
    \ need to deal with handling errors.\n\nIt would be a good time to handle dealing\
    \ with authentication failures at this point, instance. If any request comes back\
    \ with a 401, we can use the errorInterceptor to catch it and handle redirecting\
    \ the user to the login page."
  merge: -1
