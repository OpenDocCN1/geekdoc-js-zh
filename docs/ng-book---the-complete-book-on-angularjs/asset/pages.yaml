  md: "# transformRequest (function/array of functions)\n\nThis function or array\
    \ of functions is a transform function that takes the HTTP request body and headers\
    \ returns their transformed versions. It is usually used for serialization.\n\n\
    ```\nvar User = $resource('/api/users/:id', {\n  id: '@',\n},\nsend: {\n  method:\
    \ 'PUT',\n  transformRequest: function(data, headerFn) {\n    // Return modified\
    \ data for the request\n    return JSON.stringify(data);\n  }\n}\n});\n```\n\n\
    # transformResponse (function/array of functions)\n\nThis function or array of\
    \ functions is a transform function that takes the HTTP request body and headers\
    \ returns their transformed versions. It is usually used for deserialization.\n\
    \n```\nvar User = $resource('/api/users/:id', {\n  id: '@',\n},\nsend: {\n  method:\
    \ 'PUT',\n  transformResponse: function(data, headerFn) {\n    // Return modified\
    \ data for the response\n    return JSON.parse(data);\n  }\n}\n});\n```\n\n# cache\
    \ (boolean/cache)\n\nIf the cache property is set to true, then Angular will use\
    \ the default $http cache to cache GET requests. If the cache property is set\
    \ to an instance of $cacheFactory object, then the cache object will be used to\
    \ cache GET requests.\n\nIf this property is set to false, no caching will be\
    \ applied to the $resource requests."
