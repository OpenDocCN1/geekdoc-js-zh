  md: "# Implicit Synchronization\n\nTo add automatic, implicit synchronization with\
    \ a $scope variable, we can call the $bind() method on the object returned by\
    \ the $firebase service.\n\nThe $bind() method automatically establishes a three-way\
    \ binding so we don't need to explicitly save data to Firebase using the $add()\
    \ or $save() methods.\n\n```\n$scope.items.bind($scope, \"remoteItems\");\n$scope.remoteItems.bar\
    \ = \"foo\"; // new Firebase(URL + \"bar\") is now \"foo\"\n```\n\nThe $bind()\
    \ method returns a promise that will resolve when the initial data from the server\
    \ has been received. The promise will be resolved with an unbind function, which\
    \ will disassociate the three-way binding when called.\n\n```\n$scope.items.bind($scope,\
    \ \"remote\");\n.then(function(unbind) {\n  unbind();\n  $scope.remoteItems.bar\
    \ = \"foo\"; // No changes have been made to the remote data.\n});\n```\n\nThe\
    \ $bind() method returns a promise, which resolves when the initial data from\
    \ the server has been received by AngularJS. The promise will resolve with an\
    \ unbind function, which dissociates the three-way binding when called. This disassociation\
    \ is useful for optimizing our site and removing unnecessary watches.\n\n# Authentication\
    \ with AngularFire\n\nFirebase provides a simple, client-side authentication strategy\
    \ out of the box.\n\nUsing Firebase's Simple Login or Custom Login methods, we\
    \ can easily add user authentication to our application with AngularFire.\n\n\
    Custom Login is most appropriate if we have our own server where we want to control\
    \ our own authentication or if we want to integrate existing authentication with\
    \ Firebase.\n\nIf we want to use Firebase to manage all of our authentication,\
    \ we can use Simple Login, which supports Facebook, Twitter, GitHub, Persona,\
    \ and Email/Password authentication.\n\nBy defining Firebase as a dependency in\
    \ our app's module, we have access to the $firebaseAuth service in our controllers\
    \ and services."
