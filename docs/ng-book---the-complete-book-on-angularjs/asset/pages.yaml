  md: '# Configuring the Angular Generator


    With any of the previous generators (including the main generator), we can pass
    options to configure our scripts in a custom manner.


    # CoffeeScript


    If we want to generate CoffeeScript files instead of JavaScript files, we can
    easily do so by passing the --coffee option:


    ```

    $ yo angular:controller user --coffee

    ```


    # Minification Safe


    Although it is not strictly necessary (our Yeoman generator includes ngMin), we
    can tell the generator to add dependency injection annotations in our generated
    file using the --minsafe flag:


    ```

    $ yo angular:controller user --minsafe

    ```


    # Skipping Index


    By default, all of the previous generators add the appropriate files to be loaded
    in the index.html. We can tell the generator not to include the scripts in the
    index.html.


    > We want to skip adding a file to the index page, as we may be building a third-party
    plugin.


    ```

    $ yo angular:factory session --skip-add

    ```


    # Testing Our App


    One of the nicest features of the Yeoman Angular generator is its ability to allow
    us to seamlessly test our application as we are developing it.


    The generator comes packaged with a test command that runs whenever we save a
    file in our app. This packaging makes the process of testing easily translatable
    into our workflow.


    To run our tests without watching our files (i.e., to run it once), we can use
    the command:'
