- img_proc: true
  md: "# Next Steps\n\n$ grunt test\n\nThis command runs once and quits. We recommend\
    \ making two changes to the workflow to introduce automated testing in the app.\n\
    \nFirst, we open the Gruntfile.js at the root of the application and we find the\
    \ Karma task. Then, we want to change the option from singleRun: true to false:\n\
    \n```\n// ...\nkarma: {\nunit:\n  configFile: 'karma.conf.js',\n  singleRun: false\
    \ // CHANGE THIS TO FALSE\n}\ncdnify:\n//\n```\n\nSecond, we open the karma.conf.js\
    \ file and change the autoWatch option from false to true.\n\nNow, when we run\
    \ grunt test, rather than running once and quitting, the task will stay open and\
    \ watch our files. Once we change a file and save it, then the tests will be re-run.\n\
    \n# Packaging Our App\n\nAfter we are building our application, we'll want to\
    \ set up a distribution for our app. Creating a distribution of our app includes\
    \ minifying all of the JavaScripts and HTML, packaging the views, preprocessing\
    \ the CSS, etc.\n\nTo run the build task, we can simply run the Grunt build command:\n\
    \n$ grunt build\n\nIt will take a few minutes to run the entire generator. When\
    \ it has completed, we'll have a dist/ folder in the root of our app. The folder\
    \ will contain all of the files suitable for production deployment.\n\nWe can\
    \ upload this folder to our server as is or include it in deployment with our\
    \ server and let our application run to the masses."
