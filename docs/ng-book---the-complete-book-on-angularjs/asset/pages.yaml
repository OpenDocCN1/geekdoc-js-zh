  md: '# Debugging AngularJS


    When we''re building large Angular apps, it''s not uncommon to run into head-scratching
    issues that are seemingly difficult to uncover and resolve.


    # Debugging from the DOM


    Although not always necessary nor a first step, we can get access to the Angular
    properties that are attached to any DOM element. We can use these properties to
    peek into how the data is flowing in our application.


    +   We should never rely on fetching element properties from a DOM element during
    the lifecycle of an application. The techniques are presented as debugging purposes.


    To fetch these properties from the DOM, we need to find the DOM element in which
    we''re interested. If we have the full jQuery library available, we can use the
    jQuery syntax:\$(selector\). We don''t need to rely on jQuery, however, to target
    and fetch elements from the DOM. Instead, we can use the document.querySelector().


    +   Note that the document.querySelector() is not available on all browsers and
    is generally for non-complex element selections, whereas Sizzle^156 (the library
    jQuery uses) or jQuery^157 support more complex selections.


    We can retrieve the $scope from the DOM by selecting the element where the ngApp
    directive is placed and wrapping it in an Angular element (using the angular.element()
    method).


    With an Angular element, we can call various methods to inspect our Angular app
    from inside the DOM. To do so, we need to select the element from the DOM. Using
    only JavaScript and Angular, we can do so this way:


    ```

    var rootEle = document.querySelector("html");

    var ele = angular.element(rootEle);

    ```


    With this element, we can fetch various parts of our application.


    ^156http://sizzlejs.com/

    157http://jquery.com/'
