  md: "# Security\n\n```\nangular.module('myApp', [])\n  .config([$sceDelegateProvider],\n\
    \    function($sceDelegateProvider) {\n      // Set a new whitelist\n      $sceDelegateProvider.resourceUrlWhitelist(['self']);\n\
    \  });\n```\n\nTo set a new whitelist, we use the resourceUrlWhitelist() method.\
    \ The function takes optional parameter.\n\n+   * whitelist (array)\n\nIf a parameter\
    \ is not passed, then this function serves as a getter and returns the currently\
    \ whitelist array.\n\nIf the whitelist parameter is passed in, the array of replaces\
    \ the resourceUrlWhitelist with the new array.\n\nEach element of the array must\
    \ be either a regex or the string 'self'. When set to 'self', Angular ensures\
    \ that all URLs match URLs of the same domain as the app. When a regex is used,\
    \ Angular matches against the absolute URL of the resource we're testing.\n\n\
    If the array is empty, $sce blocks ALL URLs.\n\n> Using 'self' enabling sourcing\
