  md: "Communicating with the Outside World: XHR and Server-Side Communication\n\n\
    ```\n// Issues a request to:\n// GET /api/users/123\nUser.get({\n  id: '123'\n\
    }, function(resp) {\n  // Handle successful response\n}, function(err) {\n  //\
    \ Handle error here\n});\nquery(params, successFn, errorFn)\n```\n\nThe query\
    \ method sends a GET request to the URL and expects a collection of resource objects\
    \ as a JSON array.\n\n```\n// Issues a request to:\n// GET /api/users\nUser.query(function(users)\
    \ {\n  // The first user in the collection\n  var user = users[0];\n});\n```\n\
    \nThe only major difference between the query() method and the get() method is\
    \ that Angular expects the query() method to return an array.\n\n# HTTP Non-GET\
    \ Methods\n\nThe three HTTP non-GET methods it creates expect the following four\
    \ parameters:\n\n+   - params (object)\n\nThese are the parameters that are sent\
    \ with the request. They can be named parameters in the URL, or they can be query\
    \ parameters.\n\n+   - postData (object)\n\nThis object is the payload sent with\
    \ the request.\n\n+   - successFn (function)\n\nThis callback function is called\
    \ upon a successful HTTP response.\n\n+   - errorFn (function)\n\nThis callback\
    \ function is called upon a non-successful HTTP response."
