  md: '# Events


    Cases where the components of our web application are loosely connected, such
    as when we require user authentication and handle authorization, it''s not always
    feasible to handle the immediate communication without coupling our components
    together.


    For example, if our back responds to a request with a status code of 401 (indicative
    of an unauthorized request), we expect that our app won''t allow our user to stay
    connected to the current view. In this case, we''d want our app to redirect the
    user to a login or signup page.


    Given this logic, we cannot tell our controllers to set a new location from the
    outside. We also want this specific functionality to space across multiple scopes
    so we can protect multiple scopes using the behavior.


    We need another way to communicate between them.


    Angular''s scopes are hierarchical in nature: They can naturally communicate back
    and forth through parent-child relationships. Oftimes, however, our scopes don''t
    share variables, and they often perform completely different functions from each
    other, regardless of their place in the parent tree.


    For these cases, we have the ability to communicate between scopes by propagating
    events and down the chain.


    # What are Events


    Just as the browser responds to browser-level events, such as a mouse click or
    a page scroll, our Angular app can respond to Angular events. This fact gives
    us the advantage of being able to communicate across our application inside nested
    components that are not built with other components in mind.


    > Note that the Angular event system does not share the browser event system,
    meaning that, by design, we can only listen for Angular events, not DOM events
    on scopes.


    We can think of events as snippets of information propagated across an application
    that generally (optionally) contain information about what''s happening inside
    of that application.


    # Event Propagation


    Since scopes are hierarchical, we can pass events up or down the scope chain.'
  merge: -1
  pgno: 384
- img_proc: true
  md: 'A generally good rule of thumb for choosing the event passing method that we''ll
    use is to look at the scope from which we''re firing. If we want to notify the
    entire event system (thus allowing any scope to handle the event), we''ll want
    to broadcast downwards.


    On the other hand, if we want to alert a global module (so to speak), we''ll end
    up needing to alert our higher-level scopes ($rootScope, for instance), and we''ll
    need to pass an event upwards.


    It''s a good idea to limit the number of notifications sent to the global level,
    particularly because events, although very powerful, introduce complexity into
    our apps.


    For example, when we''re routing, the ''global'' app state needs to know at which
    page the app is currently set, while on the other hand, if we''re communicating
    between a tab directive to its child pane directives, we''ll need to send the
    event downwards.


    # Bubbling an Event with $emit


    To dispatch an event to travel up the scope chain (from child scopes to parent
    scopes), we''ll use the $emit() function.


    ```

    // Send an event that our user logged in

    // with the current user

    scope.$emit(''user:logged_in'', scope.user);

    ```


    With an $emit() function call, the event bubbles up from the child scope to the
    parent scope. All of the scopes that fires the event will receive notification
    about the event.


    We use $emit() when we want to communicate changes of state from within our app
    to the rest of the application. If we want to communicate with our $rootScope
    then we need to use $emit() the event.


    The $emit() method takes two arguments:


    # name (string)


    The name of the event to emit


    # args (set)


    A set of arguments passed into the event listeners as objects


    The $emit() method returns an event object (see event object for details on the
    event object). Any exception that is emitted from any of the listeners passes
    into the $ExceptionHandlerHandler.


    # Sending an Event Down with $broadcast


    To pass an event downwards (from parent scopes to child scopes), we use the $broadcast()
    function.'
  merge: -1
  pgno: 385
- img_proc: true
  md: "Events\n\n```\n// hold on, cart is checking out\n// so all directives below\
    \ should disable\n// themselves while the cart is checking out\nscope.$broadcast('cart:checking_out',\
    \ scope.cart);\n```\n\nOn the $broadcast() method, every single child that registers\
    \ a listener will receive this message. The event propagates to all directives\
    \ and indirect scopes of the current scope and calls every single listener all\
    \ the way down.\n\nWe cannot cancel events using the $broadcast() method.\n\n\
    The $broadcast() method itself takes two parameters:\n\n# name (string)\n\nThe\
    \ name of the event to emit\n\n# args (set)\n\nA set of arguments passed into\
    \ the event listeners as objects\n\nThe $broadcast() method returns an event object\
    \ (see event object for details on the event object). Any exception that is emitted\
    \ from any of the listeners passes into the $exceptionHandler service.\n\n# Events\n\
    \n# Listening\n\nTo listen for an event, we can use the $on() method. This method\
    \ registers a listener for the event bearing a particular name. The event name\
    \ is simply the event type fired in Angular. For instance, we can listen for the\
    \ events that fires a route change process is triggered:\n\n```\nscope.$on('$routeChangeStart',\n\
    function(evt, next, current) {\n  // A new route has been triggered\n});\n```\n\
    \nWhenever the event $routeChangeStart (which is broadcasted when the route is\
    \ going to be changed) fires, the listener (the function) is called.\n\nAngular\
    \ passes the evt object as the first parameter to any event that we are listening\
    \ for, be it our own custom events or built-in Angular services."
