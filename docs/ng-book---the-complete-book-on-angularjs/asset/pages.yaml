  md: '# Demystifying Angular


    ```

    <html> ng-app="moduleName">

    </html>

    ```


    Angular uses the value of the ng-app directive to configure the $injector service
    (we cover this service in depth with the dependency injection chapter).


    Once the application is loaded, the $injector creates the $compile service alongside
    the app’s rootScope.


    Following the $rootScope''s creation, the $compile service takes over. It links
    the $rootScope to the existing DOM and starts to compile the DOM beginning where
    the ng-app directive is set as the root.


    # How the View Works


    The browser gets its HTML in the normal web flow, it receives the HTML and parses
    it into a DOM tree. Each element in the DOM tree, called a DOM element, builds
    a bunch of nodes. The browser is responsible for laying the DOM tree structure.


    When the browser fetches scripts from the <script> tag), it pauses the parsing
    and waits until the script is retrieved (it''s possible to modify this behavior,
    but this behavior is the default).


    When angular.js script is retrieved, it is executed and sets up an event listener
    to listen for the DOMContentLoaded event.


    > The DOMContentLoaded event is fired when the HTML document has been loaded and
    parsed.


    When the event detects, Angular looks for the ng-app directive and creates the
    several necessary components it needs to run (i.e., the $injector, the $compile
    service, and the $rootScope), then it starts parsing the DOM tree.


    # Compilation Phase


    The $compile service traverses the DOM and collects all of the directives that
    it finds. It combines all of its linking functions into a single linking function.


    This linking function is then used to link the compiled template to the $rootScope
    (the scope attached to the ng-app DOM element).


    It finds the directives in the DOM by looking through the attributes, comments,
    classes, and the DOM element name.'
  merge: -1
