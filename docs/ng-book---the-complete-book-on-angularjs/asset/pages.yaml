  md: "# Built-In Directives\n\n```\nangular.module('myApp', [])\n.controller('EquationController',\
    \ function($scope) {\n  $scope.equation = {};\n  $scope.change = function() {\n\
    \    $scope.equation.output = Number($scope.equation.x) + 2;\n  };\n});\n```\n\
    \n# Live Example³⁰\n\nIn the above example, we run the change() function whenever\
    \ equation.x is changed by entering text into the text field.\n\n# ng-form\n\n\
    We use ng-form when we need to nest a form within another form. The normal HTML\
    \ <form> tag doesn't allow us to nest our forms, but ng-form will.\n\nThat means\
    \ the outer form is valid when all of the child forms are valid, as well. This\
    \ fact is especially useful when dynamically generating forms using ng-repeat.\n\
    \nBecause we cannot dynamically generate the name attribute of input elements\
    \ using interpolation, we need to wrap each of repeated inputs in an ng-form directive\
    \ and nest these in an outer form element.\n\nThe following CSS classes are set\
    \ automatically, depending on the validity of the form:\n\n+   * ng-valid when\
    \ form is valid\n* ng-invalid when form is invalid\n* ng-pristine when form is\
    \ pristine\n* ng-dirty when form is dirty\n\nAngular will not submit the form\
    \ to the server unless the form has an action attribute specified.\n\nTo specify\
    \ which JavaScript method should be called when a form is submitted, use one of\
    \ the two directives:\n\n+   * ng-submit on the form element\n* ng-click on the\
    \ first button or input field of type submit (input[type=submit])"
