  md: '# Data Binding and Your AngularJS Web Application


    Although this demo isn''t incredibly interesting or exciting, it does show one
    of the most basic and impressive features of AngularJS: data binding.


    > Note that in this chapter, we''re not using best practices for writing controllers
    yet, as we''re introducing the first core concept. This is the only place in this
    book where we suggest to use the code snippets as a learning tool, not as a suggestion
    for production usage.


    # Introducing Data Binding in AngularJS


    In classic web frameworks, such as Rails, the controller combines data from models
    and mashes them with templates to deliver a view to the user. This combination
    produces a single-way view. Without building any JavaScript components, the view
    will only reflect the data model exposes at the time of view rendering. At the
    time of this writing, there are several JavaScript frameworks that promise automatic
    data binding of the view and the model.


    AngularJS takes a different approach. Instead of merging data into a template
    and replacing a DOM element, AngularJS creates templates as you. Individual components
    of the views are dynamically interpolated live. This feature is arguably the most
    important in AngularJS and allows us to write the hello world we just wrote in
    10 lines of code without a single line of JavaScript.


    This works simply by including angular.js in our HTML and explicitly setting the
    ng-app attribute on an element in the DOM. The ng-app attribute declares that
    everything inside it belongs to this Angular app; that''s how we can nest an Angular
    app inside of a web app. The only components that will be affected by Angular
    are the DOM elements that we declare inside of the one with the ng-app attribute.


    > Views are interpolated when the view is evaluated with one or more variable
    substitutions; the result is that the variables in our string are replaced with
    values.


    > For instance, if there is a variable name and it is equal to "Ari", string interpolation
    on a view of "Hello {{ name }}" will return "Hello Ari".


    Automatic data binding gives us the ability to consider the view to be a projection
    of the model state. Any time the model is changed in the client-side model, the
    view reflects these changes without writing any custom code. It just works.


    In the Model View Controller (or MVC) view of the world, the controller doesn''t
    have to worry about being in the mix of rendering the view. This fact virtually
    eliminates the concern of separating view and controller logic, and it has the
    corollary effect of making testing simple and enjoyable.'
