  md: 'We need to inject modules as dependencies for our main app, which makes it
    incredibly easy

    set up tests for each module type and also isolates and subdivides the functionality
    that we''ll need

    account for when writing specs.


    For instance, we can create a module for each Angular object type:


    ```

    angular.module(''MyApp.directives'', []);

    angular.module(''MyApp.services'', []);\angular.module(''MyApp.filters'', []);

    // Often time we''ll want to use our services

    // inside of our controllers, so we''ll inject

    // those into our ''MyApp.controllers'' [

    ''MyApp.services'',

    ]);

    angular.module(''MyApp'', [

    ''MyApp.directives'',

    ''MyApp.controllers'',

    ''MyApp.filters'',

    ''MyApp.services'']

    ```


    One issue with this method is that it sometimes leaves us with a bunch of incredibly
    small modules.

    This outcome won''t hurt performance, but it can be cumbersome to develop.


    # Modular on Routes


    Another method we can use to break up our app is to divide our modules by route.
    This breakdown

    allows us to write isolated tests that focus on the functionality per route. Modularizing
    by route

    make more sense, depending upon the project; it allows us to divide our functionality
    efficiently

    when we''re dealing with a lot of independent routes.


    For instance:


    ```

    angular.module(''MyApp.home'', []);

    angular.module(''MyApp.login'', []);\angular.module(''MyApp.account'', []);

    angular.module(''MyApp'', [

    ''MyApp.home'',

    ''MyApp.login'',

    ''MyApp.account'']

    ```


    This modularization makes specifically when we''re dealing with large numbers
    of routes

    and/or when we don''t have too much cross-over routes.'
