  md: '# Development Workflow with Cordova


    Cordova powers the PhoneGap project, which has been accepted into the Apache Foundation.
    The project itself includes a command-line tool that we''ll use to interact with
    our native app, from creation to deployment.


    # Platforms


    At this point, we''ve created our app and added a platform (in this case, iOS).


    Available platforms for the Cordova app vary depending on which development environment
    we''re using. On a Mac, the available platforms are:


    +   - iOS

    - Android

    - Blackberry10

    - Firefox OS


    For a Windows machine, we can develop for the following platforms:


    +   - Android

    - Windows Phone 7

    - Windows Phone 8

    - Windows8

    - Blackberry10

    - Firefox OS


    If we forget which platforms are available, we can run the `platforms` command
    to check which are available and installed:'
  merge: -1
  pgno: 480
- img_proc: true
  md: '$ cordova platforms ls


    To add a platform, we can use the platform add command (as we''ve done above):


    ```

    $ cordova platform add android

    ```


    To remove one, we can use the rm or remove command:


    ```

    $ cordova platform rm blackberry10

    ```


    # Plugins


    Cordova is built to be incredibly modular, with the expectation that we will install
    all of the core components with the plugin system. To add a plugin to our project,
    we''ll use the plugin add command:


    ```

    $ cordova plugin add

    https://git-wip-us.apache.org/repos/asf/cordova-plugin-geolocation.git

    ```


    We can list the current plugins we have installed using the plugins ls command:


    ```

    $ cordova plugins ls

    [ ''org.apache.cordova.geolocation'' ]

    ```


    Finally, we can remove a plugin using the plugin rm command:


    ```

    $ cordova plugins rm org.apache.cordova.geolocation

    ```


    # Building


    By default, Cordova creates a skeleton project that houses the web-view files
    in the www/ directory in the project directory. When Cordova builds the project,
    it copies these files and places them in their platform-specific directories.


    To build the app, we use another Cordova command, the build command:


    ```

    $ cordova build

    ```


    Without specifying any platform to build for, this command will build for all
    of the platforms we''ve listed in our project.


    We can limit the scope by building only for specific platforms, such as:'
  merge: -1
  pgno: 481
- img_proc: true
  md: 'Mobile Apps


    ```

    $ cordova build ios

    $ cordova build android

    ```


    The build command ensures that the necessary platform-specific code is set up
    our app

    can be compiled. In effect, we''re doing the same thing as calling cordova prepare
    &&

    cordova compile.


    # Emulating and Running


    Cordova also makes it possible to run an emulator to simulate running the app
    on a device. Doing

    is so, of course, only possible if an emulator is installed and set up on our
    local development

    environment.


    Assuming our emulator is set up in our development environment, we can tell Cordova
    to launch

    and install the app in our emulator:


    ```

    $ cordova emulate ios

    ```


    For iOS, we may have to build the project (as we did above) using Xcode if the
    emulator

    environment is not set up on our machine.


    It''s also possible to run the application on a particular device by using the
    run command instead.

    The run command launches the application on a device or on the emulator if no
    device is found and

    available.


    ```

    $ cordova run ios

    ```


    # In Development


    It can be cumbersome to make a change to one part of our app and then recompile
    the app to see the

    changes reflected therein. To expedite the process of developing the web app side
    of the app,

    we can use the serve command to serve a local version of the www/ folder to a
    web browser.


    ```

    $ cordova serve ios

    Static file running at

    => http://0.0.0.0:8000/

    CTRL + C to shutdown

    ```


    Now, we can use our web browser and navigate to the URL:

    http://localhost:8000/ios/www/index.html.


    Our app''s www/ folder is being served through HTTP, so we can build it and watch
    it change as we

    make changes to the app.


    When we make changes, we need to make sure we rebuild the app:'
