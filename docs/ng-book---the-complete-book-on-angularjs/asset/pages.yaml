    \ $_myService) {\n  $httpBackend = $_httpBackend;\n  $rootScope = $_rootScope;\n\
    \  // myService is a service that makes HTTP\n  // calls for us\n  myService =\
    \ $_myService;\n}));\n```\n\n```\nit('should make a request to the backend', function()\
