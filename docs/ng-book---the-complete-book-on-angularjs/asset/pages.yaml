  md: '# Security


    +   - blacklist (array)


    If a parameter is not passed in, the function returns the currently set blacklist
    array.


    If the blacklist parameter is passed in, the new array replaces the blacklist.


    Each element of the array must be either a regex or the string ''self'', although
    in the case of the blacklist, it is not useful. When a regex is used, it is matched
    against the absolute URL of the resource being tested.


    The blacklist always has the final say in what is acceptable and what is not acceptable
    for trusted content.


    By default, the blacklist is set to an empty array, [].


    # $sce API


    The $sce library holds two main functions that we''ll use, as well as several
    helper functions.


    # getTrusted


    To get the trusted version of a value of a specific type, we can call the getTrusted()
    method. The getTrusted() method takes two arguments:


    +   - type (string)


    This string is the type of context where the value will be used. See sce types
    for available types.


    +   - maybeTrusted


    This value is the return value from $sce.trustAs. If it is invalid, then it will
    throw an exception. The $sce library has a few helper methods for the getTrusted()
    method. The following method are functionally equivalent:


    ```

    getTrustedCss(value) | getTrusted($sce.CSS, value)

    getTrustedHtml(value) | getTrusted($sce.HTML, value)

    getTrustedJs(value) | getTrusted($sce.JS, value)

    getTrustedResourceUrl(value) | getTrusted($sce.RESOURCE_URL, value)

    getTrustedUrl(value) | getTrusted($sce.URL, value)

    ```'
