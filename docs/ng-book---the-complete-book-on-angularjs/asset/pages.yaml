  md: "# Optimizing Angular Apps\n\n```\n.controller('ReceiptController', function($scope,\
    \ $filter) {\n  $scope.receipt.total_sum = 12345;\n  $scope.receipt.total_cost\
    \ =\n  $filter('currency')($scope.receipt.total_sum);\n});\n```\n\n# Filtered\
    \ Data\n\nWe have other filters, as live-search filters, that limit the data in\
    \ collections that are repeated using ng-repeat and through sorted orderBy filters.\
    \ In these cases, the data doesn't change, but how they are presented on screen\
    \ does.\n\nRather than calling these filters every $digest loop, we can cache\
    \ the sorted/filtered results so we only calculate the sort and order when necessary.\
    \ This variable caching is called memoizing.\n\n![](img/c29f4deabfb2aac07907f28672b2ed83_571_0.png)\n\
    \n> Memoization is an optimization technique used to apply for functions that\
    \ have been previously called and whose results are not expected to change for\
    \ a given input.\n\nIn order to use memoization of a filter, we need to implement\
    \ our own memoize() function or use one from a library, such as Underscore.js*\
    \ or Lo-Dash**, that has its own. Since the function itself is tiny, we've included\
    \ the basic function definition from inside the Lo-Dash library.\n\n```\nfunction\
    \ memoize(fn, resolver) {\n  var memoized = {\n    var cache = memoized.cache,\n\
    \    key = resolver.apply(this, arguments) =\n      new Date() + '' + arguments[0];\n\
    \    return hasOwnProperty.call(cache, key) ?\n    cache[key] :\n    (cache[key]\
    \ = fn.apply(this, arguments));\n  }\nmemoized.cache = {};\n  return memoized;\n\
    }\n```\n\nEssentially, the function itself takes two arguments: a function to\
    \ cache, and optionally, resolver function that is called to determine the cache\
    \ key for storing the result. The function returns a memoized version of the function.\n\
    \n*http://underscore.org/\n**http://lodash.com/"
