  md: "# Localization\n\n```\n<script src=\"js/angular-translate-loader.min.js\"></script>\n\
    ```\n\nTo configure our service to use the static-files loader, we need to tell\
    \ our $translateProvider to use the loader with a configuration object. The configuration\
    \ object takes two parameters:\n\n+   - prefix - specifies the file prefix (including\
    \ file paths)\n- suffix - specifies the file suffix (usually the extension)\n\n\
    The file loader fetches to files at the following URL path: [prefix]/[lang][suffix].\
    \ For instance, we set our config object as:\n\n```\n$translateProvider.useStaticFilesLoader({\n\
    \  prefix: '/languages/',\n  suffix: '.json'\n});\n```\n\nangular-translate attempts\
    \ to load the en_US language from /languages/en_US.json. Using the StaticLoader\
    \ like so gives us additional benefit of lazy loading. $translate will only pull\
    \ the language files it needs at run.\n\nOf course, using asynchronous loading\
    \ will cause a flash of untranslated content as the app loads. We can circumvent\
    \ this side effect by setting a default language that is packaged with the app.\n\
    One cool feature: We can use local storage to store our language files. angular-translate\
    \ provides us to use local storage as we can enable this capability with one function:\n\
    \n```\n$translateProvider.useLocalStorage();\n```\n\nWe've covered how to use\
    \ angular-translate to bring i18n support to your Angular app using $translateProvider.translations()\
