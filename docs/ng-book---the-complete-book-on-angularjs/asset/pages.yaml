  md: '# Multiple Views and Routing


    In a single-page app, navigating from one page view to another is crucial. When
    apps grow more and more complex, we need a way to manage the screens that a user
    will see as they navigate their way through the app.


    We can already support such management by including template code in line with
    the HTML, but not only will this in-line code large and unmanageable, it will
    also make it difficult to allow other developers to join in development.


    Rather than including multiple templates in the view (which we could do with the
    ng-include directive), we can break out the view and template views and only show
    the view based on the URL the user is currently accessing.


    We''ll break these partial templates into views to be composed inside of a layout.
    AngularJS allows us to do that by declaring routes on the $routeProvider, a provider
    of the $route service.


    Using the $routeProvider, we can take advantage of the browser''s history navigation
    and enable users to bookmark and share specific pages, as it uses the current
    URL location in the browser.


    # Installation


    As version 1.2.2, ngRoutes has been pulled out of the core of Angular into its
    own module. For order to use routes in our Angular app, we need to install and
    reference it in our app.


    We can download it from code.angular.org and save it in a place that we can reference
    it from our HTML, like js/vendor/angular-route.js.


    We can also install it Bower which will place it in our usual Bower directory.
    For more information about Bower, see the Bower chapter.


    ```

    $ bower install --save angular-route

    ```


    We need to reference angular-route in our HTML after we reference Angular ourselves.


    ```

    <script src="js/vendor/angular.js"></script>

    <script src="js/vendor/angular-route.js"></script>

    ```


    Lastly, we need to reference the ngRoute module as a dependency in our app module:'
  merge: -1
