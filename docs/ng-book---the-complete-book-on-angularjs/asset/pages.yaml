  md: "# Multi-language Support\n\nWe've already added a translation table to the\
    \ app via the translations() method.\n\nThe $translateProvider knows one language,\
    \ as we set it with the translations() method. Now, we can add an additional language\
    \ in the same way by providing a second translation table.\n\nWhen we set our\
    \ first translation table, we can provide a key (a language key) that specifies\
    \ the language we're translating. We can simply add another translation table\
    \ with another language key.\n\nLet's update our app to include a second language:\n\
    \n```\napp.config(function ['$translateProvider'], ($translateProvider) {\n  $translateProvider.translations('en_US',\
    \ {\n    HEADLINE: 'Hello there, This is my awesome app!',\n    INTRO_TEXT: 'And\
    \ it has i18n support!'\n  });\n});\n```\n\nTo add a second translation table\
    \ for another language, let's say German, we want to just do the same with a different\
    \ language key:\n\n```\napp.config(function ['$translateProvider'], ($translateProvider)\
    \ {\n  $translateProvider.translations('en', {\n    HEADLINE: 'Hello there, This\
    \ is my awesome app!',\n    INTRO_TEXT: 'And it has i18n support!'\n  },\n  translations('de',\
    \ {\n    HEADLINE: 'Hey, das ist meine großartige App!',\n    INTRO_TEXT: 'Und\
    \ sie unter übersetzt mehrere Sprachen!'\n  });\n});\n```\n\nNow our app knows\
    \ about two different languages. We can add as many languages as needed - there\
    \ is no limit; however, since there are now two languages available, how does\
    \ our app know which language to use? angular-translate doesn't prefer any language\
    \ until you tell it to do.\n\nTo set a preferred language, we can use the method\
    \ $translateProvider.preferredLanguage(). This method tells angular-translate\
    \ which of the registered languages is the one that our app use by default. It\
    \ expects an argument with the value of the language key, which points to a certain\
    \ translation table.\n\nNow, let's tell our app that it should use English as\
    \ its default language:"
