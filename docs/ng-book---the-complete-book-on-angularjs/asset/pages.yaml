  md: "# Mocking and Test Helpers\n\nBefore we start writing tests, we need to understand\
    \ a core feature of testing: mocking. Mocking in testing is an old concept that\
    \ allows us to define simulated objects that mimic the behavior of real objects\
    \ under controlled circumstances.\n\nAngular provides its own mocking library\
    \ called angular-mocks: it is available as the angular-mocks.js file. Mocking\
    \ objects are specifically designed to be used in unit testing.\n\nTo set up a\
    \ mock object in a unit test, we need to make sure we're including the angular-mocks.js\
    \ file in our karma configuration.\n\nWe must ensure that our test/karma.conf.js\
    \ file contains the angular-mocks.js in the files array. Once the dependency is\
    \ included, we can create a mock reference to the Angular module.\n\nFor example,\
    \ in this common unit test, we'll create a describe execution context wherein\
    \ we call angular.mock.module before every run in our describe context:\n\n```\n\
    describe('MyApp', function() {\n  // Mock our 'MyApp' angular module\n  beforeEach(angular.mock.module('MyApp'));\n\
    \n  it('...')\nn});\n```\n\n> Note that we can also call module because the function\
    \ angular.mock.module is published on the window interface for global access.\n\
    \nAfter we have set up our mock Angular module, we can inject any of the services\
    \ connected to that module into our test code.\n\nWith the tests, we need to inject\
    \ the dependencies just as Angular will run at time. In our unit tests, this step\
    \ is necessary because it's important that we isolate the functionality we want\
    \ to test.\n\nTo inject a dependency, we use the angular.mock.inject method in\
    \ a beforeEach call, similarly to how we did above."
  merge: -1
  pgno: 342
- img_proc: true
  md: "```\ndescribe('myApp', function() {\n  var scope;\n\n  // Mock our 'myApp'\
    \ angular module\n  beforeEach(angular.mock.module('myApp'));\n  beforeEach(angular.mock.inject(function($scope)\
    \ {\n    scope = $scope.new();\n  }));\n\n  it('...')\n});\n```\n\nSimilarly to\
    \ the module function, the inject function is also available on the window object\
    \ for global access, so we just call inject.\n\nIn this test, as in almost all\
    \ of our unit tests, we'll need to save a reference to an instance of the object\
    \ with which we're working (in the example, we are saving scope). That way, we\
    \ can work with the reference of the object in all of it() clauses.\n\nOftentimes\
    \ we'll want to store the reference as the same name as we're injecting into our\
    \ test. For example, if we are testing a service, we can inject the service and\
    \ store a reference to it using a slightly different naming scheme. We will enclose\
    \ the injected service in _unders to cause the injector to know the name when\
    \ it's injected.\n\n```\ndescribe('myApp', function() {\n  var myService;\n\n\
    \  // Mock out 'myApp' angular module\n  beforeEach(module('myApp'));\n  beforeEach(inject(function(_myService_)\
    \ {\n    myService = _myService_;\n  }));\n\n  it('...')\n});\n```\n\n# Mocking\
    \ the $httpBackend\n\nAngular also comes with a built-in $httpBackend mocking\
    \ library so that we can mock any external XHR requests in our app and avoid making\
    \ expensive $http requests in our tests.\n\nThe $httpBackend service is a Fake\
    \ HTTP back-end implementation that allows us to isolate and specify conditions\
    \ external servers might be in that we can determine exactly how our app behaves\
    \ under different circumstances."
  merge: -1
  pgno: 343
- img_proc: true
  md: "# Testing\n\nUsing the $httpBackend, we can verify that a request is made,\
    \ stub responses, stub calls, and set assertions that verify how we expect our\
    \ app to behave based on the response of the remote server. We'll use the $httpBackend\
    \ solely in unit tests.\n\n> It is possible to use the $httpBackend service in\
    \ end-to-end testing, but doing so generally not test the app fully, because we\
    \ are no longer using our real server.\n\nTesting with the $httpBackend works\
    \ simply by hijacking the dependency injection chain: We inject the mock $httpBackend\
    \ instead of the real $httpBackend service that makes the actual HTTP requests\
    \ by the $http service. In this way, we don't need to change our app at all to\
    \ support testing.\n\n# Flushing HTTP Requests\n\nIn production, the $httpBackend\
    \ responds to requests asynchronously; which is fundamentally difficult to set\
    \ up in testing environments. Thus, we need to manually flush any pending requests\
    \ at the end of our tests so we can clean the execution environment, yet keep\
    \ the asynchronous behavior of the $httpBackend.\n\nThe $httpBackend contains\
    \ two methods for setting up a mock back-end system to handle HTTP responses;\
    \ these two methods are expect and when, and they have different use cases.\n\n\
    Typically, in a unit test we'll want to ensure that all of the requests we set\
    \ up with expectations at the end of each test and throw an exception if they\
    \ don't. Additionally, we'll want to ensure that there are no outstanding requests\
    \ pending at the end of each test.\n\nWe can take care of these two cases with\
    \ two methods in an afterEach block:\n\n```\n// ...\nafterEach(function() {\n\
    \  $httpBackend.verifyNoOutstandingExpectation();\n  $httpBackend.verifyNoOutstandingRequest();\n\
    });\n```\n\nThere are cases when we want to reset all of the request expectations\
    \ we've set. These cases occur when we want to reuse the same instance of $httpBackend\
    \ inside of a multiple-phase test.\n\nWe can reset them with the resetExpectations()\
    \ method:"
  merge: -1
  pgno: 344
- img_proc: true
  md: "Testing\n\n```\n// ...\nit('should be a multiple-phase test', function() {\n\
    \  // ...\n  $httpBackend.resetExpectations();\n  // ...\n});\n```\n\n# expect\n\
    \nThe expect method sets up a request expectation and is used to make assertions\
    \ about the requests the application makes and define responses for them. The\
    \ test will fail if the requests are not made or they are incorrectly made. These\
    \ request expectations are used to set up an assertion that a request has been\
    \ made.\n\nThe expect method takes two required arguments and two additional optional\
    \ arguments:\n\n+   * method\n\nThe string HTTP method, like 'GET' or 'POST'\n\
    \n+   * url\n\nThe HTTP URL where we're expecting the call\n\n+   * data (optional)\n\
    \nThe HTTP request body or function that receives a data string and returns true\
    \ if the data is expected (or a JavaScript object to send the body in JSON format)\n\
    \n+   * headers (optional)\n\nThe HTTP headers or function that will receive the\
    \ header object and return true if the headers match the expectation\n\nThe expect\
    \ method returns an object with a respond method that controls how the matched\
    \ request is handled inside the tests."
  merge: -1
  pgno: 345
