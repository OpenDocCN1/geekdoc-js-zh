  md: '# Built-In Directives


    Angular provides a suite of built-in directives. Some directives override built-in
    HTML elements, such as the `<form>` and `<a>` tags. When we use tags in our HTML,
    it may not be immediately obvious that we are, in fact, using a directive.


    For example, the `<form>` tag is augmented with a great deal of functionality
    under the hood, as validation behavior that we normally do not get with a standard
    HTML form.


    Other built-in directives are clearly visible via their ng- namespace prefix.
    For example, ng-href, which we''ll cover below, prevents a link from becoming
    active until the expression provided to ng-href="someExpression" has been evaluated
    and returns a value.


    Lastly, some built-in directives do not have an HTML counterpart, such as the
    ng-controller directive, which can be used as an attribute on any tag, but is
    most often found on an element that has many children that share the same scope.


    Note that all directives prefixed with the ng namespace are part of the built-in
    library of directives that ship with Angular. For this reason, never prefix directives
    you make with this namespace.


    # Basic ng Attribute Directives


    Our first set of directives has similarly named standard HTML tags and is easy
    to remember because we simply add the ng prefix to each:


    +   - ng-href

    - ng-src

    - ng-disabled

    - ng-checked

    - ng-readonly

    - ng-selected

    - ng-class

    - ng-style


    # Boolean Attributes


    The following Angular directives help make working with HTML boolean attributes
    easier.'
  merge: -1
  pgno: 90
- img_proc: true
  md: "# Built-In Directives\n\nAs defined by the HTML specification*, a boolean attribute\
    \ is an attribute that represents a true/false value. When the attribute is present,\
    \ the attribute's value is assumed to be true (regardless of its actual value).\
    \ If absent, the attribute is assumed to be false.\nWhen working with dynamic\
    \ data via data bindings in Angular, we cannot simply set the value of the attribute\
    \ to true or false, because by definition of the field Angular provides an ng-prefixed\
    \ version of these attributes that will evaluate the expression provided to insert\
    \ or remove the corresponding boolean attribute on the decorated element.\n\n\
    # ng-disabled\n\nUse ng-disabled to bind the disabled attribute to form input\
    \ fields:\n\n+   - <input> (text, checkbox, radio, number, url, email, submit)\n\
    - <textarea>\n- <select>\n- <button>\n\nWhen writing normal HTML input fields,\
    \ the presence of the disabled attribute on an input field makes the field disabled.\
    \ To bind the (or not) of this attribute, use ng-disabled.\nFor example, let's\
    \ disable the button until the user enters the text into the text field:\n\n```\n\
    <input type=\"text\" ng-model=\"someProperty\" placeholder=\"Type to Enable\"\
    >\n<button ng-model=\"button\" ng-disabled=\"!someProperty\">A Button</button>\n\
    ```\n\nIn the next example, we'll disable the text field for five seconds until\
    \ the isDisabled property becomes true using $timeout:\n\n```\n<textarea ng-disabled=\"\
    isDisabled\">Wait 5 seconds</textarea>\n```\n\n```\nangular.module('myApp', [])\n\
    .run(function($rootScope, $timeout) {\n  $rootScope.isDisabled = true;\n  $timeout(function()\
    \ {\n    $rootScope.isDisabled = false;\n  }, 5000);\n});\n```\n\n# Both Live\
    \ Examples*²\n\n¹http://www.w3.org/wg/drafts/html/master/infrastructure.html#boolean-attribute\n\
    ²http://jsbin.com/HiYTu/1/edit"
  merge: -1
  pgno: 91
