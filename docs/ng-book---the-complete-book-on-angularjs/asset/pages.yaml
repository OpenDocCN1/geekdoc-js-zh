  md: "# Essential AngularJS Extensions\n\n```\n.config(function($urlProvider) {\n\
    \  $routeProvider.rule(\n    function($injector, $location) {\n      return '/index';\n\
    \    });\n});\n```\n\n# Create a Wizard\n\nWhy does it matter if we use a new,\
    \ more powerful router than the built-in ngRoute provider?\n\nOne useful case\
    \ in which we might want to use ui-router is when we want to create a signup wizard\
    \ for our users.\n\nUsing ui-router, we can create a quick signup service with\
