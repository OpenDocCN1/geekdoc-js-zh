  }\n```\n\nHTML 文档包含一个类名为 `output` 的 div 元素和另一个类名为 `btns` 的 div 元素，后者包含三个按钮。\n\n\
  1. 动态创建一个类名为 `box` 的 div 元素，进行样式设置并添加到 body 中。\n2. 使用 `.on()` 方法为 `box` 元素绑定了事件处理。定义了三个事件（`click`、`mouseenter`\
  \ 和 `mouseleave`）。当你点击一个 `box` 时，它会切换 `active` 类，改变背景颜色和文字颜色。鼠标进入和离开事件会改变背景颜色。\n\
  3. 使用事件委托来处理 `btns` div 内的按钮点击。当按钮被点击时，其索引和消息将显示在 `output` div 中。\n4. 将一个自定义数据对象\
  \ `obj` 与 `output` div 关联，以用于点击事件。当你点击 `output` div 时，数据将记录到控制台。\n5. 为 `btns` div\
  \ 中动态创建的按钮提供了额外的事件处理。当你点击这些按钮时，将显示索引和背景颜色的变化。\n\n\n\n\n\n```css\nheight: 50px;\n\
  width: 100px;\n}\ninput{\n  display:block;\n}\n.active{\n  background-color:red;\n\
  \  color:green;\n}\n```\n\n### HTML 代码:\n```html\n<div class=\"output\"></div>\n\
  <div class=\"btns\">\n  <button id=\"btn1\">1</button>\n  <button id=\"btn2\">2</button>\n\
  \  <button id=\"btn3\">3</button>\n</div\n```\n\n### JavaScript 代码:\n```javascript\n\
  let counter = 1;\n$('button').click(()=>{\n  counter++;\n  const r = Math.floor(Math.random()*200)+100;\n\
  \  const c = '#'+Math.random().toString(16).substring(2,8);\n  const id = 'id'+counter;\n\
  \  $('<div>').text('New Div').css('height',r+'px').attr('id',id).css('background-color',c).appendTo('body');\n\
  \  //output\n  $('<a>').attr('href','#'+id).text(id+' ').appendTo('.output');\n\
  })\n$(window).scroll((e)=>{\n  console.log(e);\n})\n$(window).resize((e)=>{\n  console.log($(window).height());\n\
  \  console.log($(document).height());\n})\n```\n\n1. 在 HTML 中，页面在一个类名为 `btns` 的\
  \ `div` 元素内有三个按钮，还有一个类名为 `output` 的空 `div`。\n2. 在 JavaScript 部分，变量 `counter` 被初始化为\
  \ `1`。它用于跟踪按钮被点击的次数。\n3. 设置了一个事件处理程序来响应按钮点击。当按钮被点击时，会发生以下操作：\n    - `counter` 递增。\n\
  \    - 生成一个随机高度（100 到 300 像素之间）和一种随机背景颜色。\n    - 使用递增的计数器为新的 `<div>` 元素创建一个 `ID`。\n\
  \    - 创建一个新的 `<div>` 元素，其文本为 `New Div`，指定的高度、唯一的 `ID` 以及生成的背景颜色。\n    - 将新的 `<div>`\
