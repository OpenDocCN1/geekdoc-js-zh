  \n\n\n\n欢迎来到 jQuery 的介绍章节，jQuery 是一个重新定义 Web 开发的 JavaScript 库。在本章中，我们将开启进入 jQuery\
  \ 世界之旅，理解它的重要性以及为什么它是现代 Web 开发中至关重要的工具。我们将引导您完成下载并将 jQuery 无缝集成到项目中的过程，确保您配备了必要的资源。此外，我们将探索通过内容分发网络\
  \ (CDN) 使用 jQuery 的概念，以实现更快的加载和增强的可靠性。在本章结束时，您将拥有利用 jQuery 力量的坚实基础，以创建吸引用户并简化您的开发工作流的动态交互\
  \ Web 应用程序。让我们开始进入 jQuery 世界之旅吧。\n# 结构 (#toc.xhtml_s2a)\n\n\n*   开始使用 jQuery 及其原理\n\
  *   通过 CDN 使用 jQuery\n\n\n在 Web 开发的动态格局中，创建交互且引人注目的用户体验已至关重要。随着网站和 Web 应用程序演进以满足用户日益增长的需求，开发者寻找能够简化为项目添加交互性和响应能力过程的工具。这就是\
  \ jQuery 登场的地方——这是一个多功能且强大的 JavaScript 库，它彻底改变了开发者处理客户端脚本的方式。\n\n为了充分理解 jQuery 的影响，理解它出现的背景至关重要。在\
  \ Web 开发的早期，JavaScript 主要用于表单验证和基础交互等简单任务。然而，随着 Web 应用程序变得越来越复杂，用户预期也不断提高，开发者面临着跨浏览器兼容性和复杂的\
  \ DOM 操作的挑战。这些障碍导致了 jQuery 的诞生。\n\n\n传统的 DOM 操作需要冗长的代码，并需要仔细考虑跨浏览器的差异。jQuery 通过提供一致的\
  \ API 抽象了浏览器的特殊性，解决了这一挑战。开发者现在可以轻松地定位并修改元素，极大地缩短了此类任务所需的时间精精力。\nWeb 开发中重大的痛点之一是确保网站在各种浏览器中都能无缝运行。jQuery\
  \ 在标准化行为方面发挥了关键作用，使开发者能够编写出在不同浏览器中表现一致的代码。\n\n\n使用原生 JavaScript 创建动画和添加视觉效果是一项复杂的工程。jQuery\
  \ 的动画能力抽象了这些复杂性，允许开发者以最少的精力创建出引人注目的动画和过渡。\n\n处理用户交互和事件是 Web 开发的基石。jQuery 引入了一个直观的事件处理系统，简化了绑定事件监听器和响应用户操作，增强了\
  \ Web 应用程序的交互性。\n\n\njQuery 让构建交互动态的 Web 内容变得简单。有了 HTML 和 CSS 的基础知识，你就可以开始创建吸引人的内容。jQuery\
  \ 只是一个 JavaScript 库，JavaScript 知识对于理解和调试代码很有帮助。\njQuery 为 Web 开发者提供了一个易用的解决方案，用于添加平滑动画、处理网页交互和事件、导航页面元素进行选择、更新和修改元素属性及内容，并为数据发送\
  \ AJAX 请求。\n\n\n\n\n\n\njQuery 的核心是一个快速、小型且功能丰富的 JavaScript 库。它的主要目标是简化 DOM 操作和事件处理过程，让开发者能够轻松创建出惊的用户体验。通过清晰简洁的语法，jQuery\
  \ 抽象了原生 JavaScript 的复杂性，允许开发者用更少的代码实现卓越的效果。\n\njQuery 允许 Web 开发变得精简化。当我们考虑到 jQuery\
  \ 出现之前开发者面临的挑战时，它的重要性就显而易见了。当时的 Web 开发领域一直受到浏览器不兼容、复杂的 DOM 操作以及创建吸引人的动画和特效的艰巨任务的困扰。jQuery\
  \ 解决了这些痛点以及更多问题。\n\n考虑在网页上选择和操作 HTML 元素的常见任务。在原生 JavaScript 中，这是一个繁琐的过程，涉及针对不同器的不同方法。jQuery\
  \ 简化了这一过程，提供了一个统一的 API 来选择、遍历和修改 DOM 元素。\n```javascript\n// Raw JavaScript\nconst\
  \ element = document.getElementById(“myElement”);\nelement.style.color = “red”;\n\
  \n// jQuery equivalent\n```\n\n\n处理用户交互和事件是现代 Web 应用的基础。jQuery 提供了一种了一贯且直观的方法来绑定事件监听器并响应用户操作。\n\
  \n```javascript\n// Raw JavaScript\nbutton.addEventListener(“click”, function()\
  \ {\n  console.log(“Button clicked!”);\n});\n\n$(“#myButton”).click(function() {\n\
  \  console.log(“Button clicked!”);\n});\n```\n\n\n创建动画和特效曾是一项复杂的工程。jQuery 的动画方法简化了这个过程，让开发者能够轻松创建具有视觉吸引力的过渡效果。\n\
  \n```javascript\nconst element = document.getElementById(“animatedElement”);\nelement.style.transition\
  \ = “width 2s”;\nelement.style.width = “300px”;\n\n$(“#animatedElement”).animate({\
  \ width: “300px” }, 2000);\n```\n\n\n以下是选择 jQuery 的一些引人理由：\n\nWeb 开发中最令人沮丧的挑战之一是确保你的代码在不同浏览器中都能一致运行。jQuery\
  \ 抽象了浏览器差异，为用户提供了一致的体验。\n\njQuery 的插件架构导致了大量插件库的创建，为各种功能提供了现成的解决方案，从表单验证到复杂的 UI\
  \ 组件。\n\n通过简化复杂任务并减少所需的代码量，jQuery 显著提高了开发者的生产力，让他们能够专注于 Web 开发的创意方面。\n\n- 学习曲线\n\
  jQuery 直观的语法和文档良好的 API 即使对于刚接触 JavaScript 的开发者来说也易上手，加速了他们的学习曲线，并使他们更快地创建印象深刻的 Web\
  \ 应用。\n\n随着你深入学习这本书，你将发现 jQuery 方法的细节，探索真实的用例，并掌握构建迷人 Web 应用的艺术。jQuery 不仅仅是一个库；它是释放交互式\
  \ Web 开发潜力的门户。所以，让我们共同开启这段旅程，充分利用 jQuery 的力量在网页上打造卓越的用户体验。\n\n\n现在我们已经了解了 jQuery\
  \ 的力量，是时候配备我们所需的工具来发挥它的潜力了。我们将引导你完成获取 jQuery 库并将其无缝集成到 HTML 文件中的过程。jQuery 有多个版本，推荐使用最新的\
  \ `3.*` 版本。jQuery 设计用于简化 HTML DOM 树的遍历和页面元素的操作。它提供了创建 CSS 动画以及处理事件和 AJAX 请求的优秀方法。\n\
  \n\n在开始使用 jQuery 之前，我们需要获取库本身。坦率，可以从官方网站轻松获取 jQuery，方法如下所示：\n\n- 直接下载：访问 jQuery\
  \ 官方网站 [`jquery.com/download/`](https://jquery.com/download/) 并选择你想要使用的 jQuery 版本。你可以下载库的压缩版本或未压缩版本。\n\
  建议使用压缩版本，因为可以节省带宽，且删除空格后文件大小更小。未压缩版本仅用于调试。\n- 内容分发网络 (CDN)：或者，你可以直接从 CDN 引入 jQuery。这样做的好处是，如果用户已经访问过其他使用相同\
  \ CDN 的网站，可能会缩短他们的加载时间。\nCDN 资源地址：[`developers.google.com/speed/libraries#jquery`](https://developers.google.com/speed/libraries#jquery)\n\
  \n\n一旦你下载了 jQuery 库，就需要将其集成到你的 HTML 文件中。这里是分步指南：\n\n1. **创建一个新文件夹**：组织你的项目文件，并在项目目录内创建一个名为\
  \ `js` 的新文件夹。这就是我们存储 jQuery 文件的地方。\n2. **放置 jQuery 文件**：将下载的 jQuery 文件（例如 `jquery-3.6.0.min.js`）移动到你创建的\
  \ `js` 文件夹中。\n`<script src=\"js/jquery-3.6.0.min.js\"></script>`\n这段代码告诉浏览器从指定位置加载\
  \ jQuery 库。如果你的项目结构不同，请务必调整路径。\n\n# 验证 jQuery 集成\n\n\n```html\n<script>\n// jQuery\
  \ test\n$(document).ready(function() {\n  alert(“jQuery is working!”);\n</script>\n\
  ```\n这段代码创建了一个简单的 jQuery 脚本，在文档准备绪绪触发警报。当你在浏览器中加载 HTML 文件时，你应该能看到一个显示 `jQuery is\
  \ working!` 消息的警告框。\n\n你也可以使用浏览器编辑器检查 jQuery 是否已加载。在浏览器控制台中使用 `$` 或 `jQuery` 来检查\
  \ jQuery 是否就绪：\n![](img/fig-1.1.jpg)\n\n**图 1.1:** 使用 $ 或 jQuery 检查 jQuery 是否就绪\n\
  \n恭喜！你已经成功下载并将 jQuery 集成到你的 Web 项目中。现在 jQuery 已无缝集成到你的开发工作流中，你正处于创建动态、交互且具有视觉吸引力的\
  \ Web 应用的道路上。在接下来的章节中，我们将深入探讨 jQuery 的功能，并学习如何运用其能力来打造令人深刻的用户体验。\n\n\n\n\n当我们深入探索\
  \ jQuery 世界时，探索访问和使用这一强大库的替代方法至关重要。除了本地下载 jQuery 文件外，我们还可以利用 CDN（内容分发网络）的能力简化集成过程并优化\
  \ Web 应用程序的性能。在本节中，我们将深入探讨 CDN 的概念，以及在将 jQuery 整合到网页中时如何利用它的优势。\n\n\n通过 CDN 引入 jQuery\
  \ 有许多优势，可以增强您的 Web 应用程序的性能和可靠性：\n\n*   CDN 将内容分发到多个服务器，允许浏览器从最近的服务器获取资源。这最小程度地减少了数据传输的距离，从而实现了更快的加载速度和更好的用户体验。\n\
  *   CDN 针对缓存进行了优化，当用户访问使用 CDN 托管 jQuery 版本的网站时，他们的浏览器可能已经从之前访问其他网站时缓存了 jQuery 文件。这减少了冗余下载并提高了浏览器的整体效率。\n\
  \n要使用 CDN 将 jQuery 包含在您的项目中，您不需要下载任何文件。相反，您可以直接从 CDN 服务器引用该库。以下是操作方法：\n\n```html\n\
