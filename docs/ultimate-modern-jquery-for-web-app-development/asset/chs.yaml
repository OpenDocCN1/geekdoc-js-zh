  \ 的交互列表\n\n## 练习：使用 jQuery 创建交互列表\n在练习中，我们将使用 jQuery 构建一个交互列表。用户将能够列表添加新项目、通过点击项目来划掉项目，并通过点击与每个项目关联的按钮来删除项目。以下是步骤：\n\
  \n### 步骤 1：列表元素的样式化\n\n我们首先为列表元素定义 CSS 样式。这包括列表项的样式、划掉项目的文本装饰以及删除按钮的外观：\n```css\n\
