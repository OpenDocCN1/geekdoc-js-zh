  \ CSS 样式。\n\n### 指令：\n\n1. 选择一个类为 `main` 的元素，并在点击第一个按钮时将它的子元素输出到控制台。\n3. 点击第三个按钮时，使用通配符\
  \ `*` 和 `find` 方法选择类为 `main` 的元素的所有后代。应用 CSS 样式（例如，将它们的背景颜色设置为紫色）。\n\n## CSS:\n\n\
  ```css\n  width: 200px;\n  border: 5px solid #ddd;\n  padding: 20px;\n  margin:\
  \ 10px;\n}\n\n## HTML:\n\n```html\n<div class=”main”>\n  <div class=”div2”><span>Hello\
  \ World 2</span></div>\n  <div class=”div3” id=”div3”>Hello World 3</div>\n  <div\
