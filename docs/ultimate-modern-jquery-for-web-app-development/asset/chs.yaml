  \ `highlighted` 类对其进行高亮。\n\n\n### `.next()` 和 `.prev()` 的优势：\n\n*   **精确选择：** 这些方法允许你精确地定位到特定元素相邻的元素，简化复杂的\
  \ DOM 交互。\n*   **顺序操作：** 你可以轻松地在同一个父容器内的元素上执行顺序操作。\n*   **高效遍历：** jQuery 优化了遍历过程，使得兄弟元素之间的导航变得高效。\n\
  \n总而言之，`.next()` 和 `.prev()` 方法对于选择和交互 DOM 中的兄弟元素非常有价值，能够让你轻松地创建动态且响应式的网页。\n\n##\
