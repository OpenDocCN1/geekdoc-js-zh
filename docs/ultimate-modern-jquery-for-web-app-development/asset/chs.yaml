  \n## 结论\n\n\n\n\n`data()` 方法允许开发者向 HTML 元素挂载自定义数据，并在需要时检索这些数据。\n\n使用 jQuery 的 `.data()`\
  \ 方法将值保存到元素对象是 Web 开发中的一个基础概念。该方法允许你向 HTML 元素挂载自定义数据，这对于广泛的应用程序都特别有用。让我们探索如何使用 `.data()`\
  \ 方法将值保存到元素对象中，并理解为什么它是一个非常有价值的工具。\n## 使用 `.data()` 保存值\n\njQuery 中的 `.data()` 方法向\
  \ DOM 元素附加额外信息，而不会改变 DOM 结构或源代码中元素的呈现方式。你可以在元素中存储任何类型的数据，例如字符串、数字、对象或数组。以下是将值保存到元素数据中的方法：\n\
  \n```javascript\n```\n\n在这个示例中，我们将字符串值与 `#myElement` 元素中的键关联起来。\n\n你可以使用 `.data()`\
  \ 方法在元素中存储数据。要做到这一点，你通常会选择想要与数据关联的元素，并调用 `.data(‘key’, ‘value’`，其中‘key’ 是数据的唯一标识符，而‘value’是你想要存储的数据。\n\
  ```javascript\n$(‘#myElement’).data(‘userInfo’, { name: ‘Laurence’, age: 40, email:\
  \ ‘laurence@example.com’ });\n```\n\n在这个示例中，我们将一个对象与 ID 为 `myElement` 的 HTML 元素的键\
  \ `userInfo` 关联起来。\n\n\n要检索已存储的数据，你可以再次使用 .data() 方法，但这次你不需要提供值。你只需要提供‘key’即可检索与该键关联的数据。\n\
  \n```javascript\nconst userData = $(‘#myElement’).data(‘userInfo’);\n\n现在，`userData`\
  \ 变量将包含我们之前存储的对象，允许你访问 name、age 和 email 等属性。\n\n## 数据\n\n\n```javascript\n$(‘#myElement’).removeData(‘userInfo’);\n\
  ```\n\n\n使用 `.data()` 的优点是：\n\n*   它保持数据易于读取并与 HTML 分离。\n*   它随元素管理数据并在需要时检索。\n\
  *   你可以存储各种类型的数据。\n*   可以在事件和特定事件信息中更好地处理数据。\n\n## 练习 `data()`示例\n\n\n1.  为所有 div\
  \ 添加点击事件：在这一步中，`.main` 容器内的所有 div 元素都挂载了点击事件。每当点击这些 div 元素中的一个时，就会执行一个函数。\n2.  当\
  \ div 被点击时，获取当前的 `text()` 值并存储在 `data()` 中：在点击事件函数内部，使用 `$(this).text()` 获取点击的 div\
  \ 元素的当前文本值。然后使用 `data()` 方法将其存储。数据的键设置为 `past`，值为文本内容。\n3.  更新元素的 `text()`：在将文本内容存储到数据之后，更新被点击的\
  \ div 元素的文本。在此练习中，文本被更新为包含一个计数器，用于跟踪该 div 被点击的次数。文本被修改为显示文本内容加上计数器。\n4.  为按钮添加事件以使用元素的数据值并将\
  \ `data()` 值作为元素的新 `text()` 输出：HTML 中提供了几个按钮（`btn1`、`btn2`、`btn3`、`btn4`）。每个按钮对应一个特定的\
  \ div 元素。点击按钮时，它使用 `.data(‘past’)` 检索之前在关联 div 被点击时存储的数据。然后将检索到的值设为对应 div 的新文本内容。\n\
  \n\n```html\n<nav>\n  <div class=”main”>\n    <div class=”div1”>Hello World 1</div>\n\
  \    <div class=”div4”>Laurence Svekis</div>\n    <input>\n    <button id=”btn1”>1</button>\n\
  \    <button id=”btn2”>2</button>\n    <button id=”btn3”>3</button>\n  </div>\n\
  </nav>\n<button id=”btn4”>4</button>\n<button id=”btn5”>5</button>\n```\n**JavaScript\
  \ 代码**\n\n```javascript\nlet counter = 0;\nlet temp = ‘’;\n\n\n$(‘.main div’).click(function()\
  \ {\n  $(this).data(‘past’, $(this).text());\n});\n\n  let val = $(.div1).data(‘past’);\n\
  \  counter++;\n  $(.div1).text(val + \" \" + counter);\n});\n\n  let val = $(.div2).data(‘past’);\n\
  \  counter++;\n  $(.div2).text(val + \" \" + counter);\n});\n\n  let val = $(.div3).data(‘past’);\n\
  \  counter++;\n  $(.div3).text(val + \" \" + counter);\n});\n\n  let val = $(.div4).data(‘past’);\n\
  \  $(.div4).text(val);\n});\n```\n\n\n\n\n要查找特定元素的位置，可以在该元素上调用 `.index()`。该方法将返回一个从\
  \ 0 开始的索引，表示其在组中的位置。\n\n在使用 jQuery 时，根据元素与其他元素的相对位置来选择元素是一项常见任务。了解如何根据与相邻元素的关系来识别和选择元素是非常用的。\n\
  jQuery 中的 `index()` 方法允许你获取元素相对于其同级元素的索引位置。当你需要识别某个元素在一组相似元素中的特定位置时，这个方法非常有用。\n\n\
  `index()` 方法最基本的用法是在 jQuery 对象上调用它。例如，如果你有一组兄弟元素，你可以在其中一个元素上调用 `index()` 来获取它在兄弟元素中的位置。\n\
  \n```javascript\nconst position = $(('.item').index();\nconsole.log(`Position: ${position}`);\n\
  ```\n\n这将在控制台中输出选中元素在其兄弟元素中的位置（从 0 开始的索引）。\n你也可以将 `index()` 方法与选择器结合使用，以便在匹配选择器的兄弟元素集中找到某个特定元素的索引。\n\
  \n```javascript\n// 假设你想找到类名为 active 的特定元素的索引\nconst position = $(('.item.active').index('.item'));\n\
  console.log(`Position: ${position}`);\n\n在这种情况下，你正在寻找类名为 item 的兄弟元素中类名为 active 的元素的索引。\n\
  \n一个常见的用例是确定在一组元素中哪一个元素被点击了。你可以使用 `index()` 方法找到被点击元素的索引，然后根据该索引执行操作。\n\n// 假设你有一组类名为\
  \ clickable 的可点击元素\n$('.clickable').click(function () {\n  const position = $(this).index();\n\
  \  console.log(`Clicked on item at position: ${position}`);\n});\n\n当用户点击类名为 `clickable`\
  \ 的元素时，这段代码将记录该元素在其兄弟元素中的位置。\n\n`:eq()` 和 `:lt()` 选择器是 jQuery 中强大的工具，允许你根据索引在选择结果中精确定元素。当你想要从一组匹配的元素中选择特定的元素时，它们极其实有用。\n\
  \n### 使用 `:eq()` 选择器：\n`:eq()` 选择器允许你通过提供索引来选择集合中的某个特定元素。索引从 0 开始。\n\n例如，要选择一组元素中的第二个元素，你会使用\
  \ `:eq(1)`，因为它位于索引 1（记住，索引是从 0 开始的）。\n\n```javascript\n```\n\n在这种情况下，`<ul>` 元素内第三个\
  \ `<li>` 元素（索引为 2）的文本颜色被改为红色。\n\n### 使用 `:lt()` 选择器：\n\n\n```javascript\n$('ul li:lt(3)').addClass('highlight');\n\
  ```\n\n\n这些选择器在你想针对集合中的特定元素而无需手动计算 DOM 结构中的元素时非常有帮助。它们提供了一种根据元素在选择中的位置来处理元素的简洁且高效的方法，使你的代码更加动态和灵活。\n\
  \n## 练习：使用 `get()` 方法返回 DOM 元素对象\n\n\n### 第 1 步：选择元素集\n在这一步中，你将使用 jQuery 选择元素。\n\
  \n### 第 2 步：创建点击事件\n在这一步中，你将在按钮上添加点击事件。\n### 第 3 步：遍历项目\n在这一步中，你将使用循环并使用 `.get()`\
  \ 方法获取 DOM 对象。\n\n```html\n<nav>\n    <div class=\"div1\">Hello World 1</div>\n\
  \    <div class=\"div2\">Hello World 2</div>\n    <div class=\"div3\">Hello World\
  \ 3</div>\n    <div class=\"div4\">Laurence Svek</div>\n    <button id=\"btn1\"\
  >1</button>\n    <button id=\"btn3\">3</button>\n    <span class=\"span1\">Hello</span>span>\n\
  \  </div>\n</nav>\n<button id=\"btn4\">4</button>\n<button id=\"btn5\">5</button>\n\
  \n```javascript\n$('#btn1').click(() => {\n  const temp = $('.main div').get(1);\n\
  \  console.log(temp.innerHTML);\n});\n\n$('#btn2').click(() => {\n  const len =\
  \ $('.main div').length;\n  console.log(len);\n  let html = '';\n  for(let i=0;\
  \ i<len; i++) {\n    const temp = $('.main div').get(i);\n    console.log(temp.textContent);\n\
  \    html += `${i}. ${temp.textContent} `;\n  }\n  $('.main .span1').text(html);\n\
  });\n```\n\n\n\n\n\n3. 在点击事件中，你通过 `$(this).index()` 获取被点击 `div` 元素的索引值。\n\n4. 你还通过\
  \ `$(this).text()` 获取了该 `div` 现有的文本内容。\n\n5. 然后，你更新了 `div` 的文本内容，使其包含索引和原始文本内容（例如，“1\
  \ Hello World 1”）。\n\n6. 这在被点击的 `div` 上现有文本旁边显示索引值。\n\n### 步骤 3：创建 UL 并添加带有点击事件的\
  \ LI 项目\n\n1. 你正在创建一个无序列表 `<ul>`，并使用 `$(‘<ul>>’).prependTo(‘nav’)` 将其插入到 nav 元素之前。\n\
  \n2. 在一个运行十次的循环 `(for(let i=0;i<10;i++))` 中，你向无序列表添加列表项 `<li>`。\n\n3. 每个列表项包含类似\
  \ `“0 List Item,”`、`“1 List Item,”` 等文本。\n\n4. 对于每个列表项，你绑定了一个点击事件。\n\n5. 在列表项的点击事件中，你使用\
  \ `$(this).index()` 来获取被点击列表项的索引。\n\n6. 接着你将此索引打印到控制台。\n\n7. 这允许你确定并显示被点击列表项的索引。\n\
  \n这个练习展示了如何在各种语境下使用 `index()` 方法来获取元素的索引值。无论是按钮、`div` 还是列表项，你都在为这些元素添加点击事件以与它们交互并显示它们的索引值。\n\
  \n# HTML\n\n```html\n<nav>\n<div class=”main”>\n<div class=”div1”>Hello World 1</div>\n\
  <div class=”div2”><<span>Hello World 2</span></div> <div class=”div3” id=”div3”>Hello\
  \ World 3</div>\n<div class=”div4”>Laurence Svekis</div>\n<input>\n<button id=”btn1”>1</button>\n\
  <button id=”btn2”>2</button>\n<button id=”btn3”>3</button>\n<span class=”span1”>Hello</span>\n\
  </div>\n</nav>\n<button id=”btn4”>4</button>\n<button id=”btn5”>5</button>\n```\n\
  \n#### JavaScript\n\n```javascript\n$(‘#btn1’).click(function(){\n  console.log($(this).index());\n\
  })\n$(‘.main div’).click(function(){\n  const val = $(this).index();\n  const temp\
  \ = $(this).text();\n  $(this).text(`${val} ${temp}`);\n})\nconst $ul = $(‘<ul>>’).prependTo(‘nav’);\n\
  for(let i=0;i<10;i++){\n  $(‘<li>’).text(`${i} ListItem`).appendTo($ul).click(function(){\n\
  \    console.log($(this).index());\n  })\n}\n```\n\n#### jQuery 数据方法 `(.data())`\n\
  \n- `data()` 方法允许开发者向 HTML 元素附加自定义数据，并在以后获取这些数据。\n- 它常用于存储与元素相关的状态信息或元数据。\n- 你可以在元素中存储不同类型的数据，例如字符串、数字、对象或数组。\n\
  - 要将数据保存到元素中，你通常会选择该元素并使用 `.data(‘key’, ‘value’)`，其中 `‘key’` 是数据的唯一标识符，`‘value’`\
  \ 是你想要存储的数据。\n- 你可以使用 `.data(‘key’)` 获取所存储的数据。\n- `removeData(‘key’)` 方法用于移除与元素关联的数据。\n\
  \n#### 页面元素索引方法 `(.index())`:\n\n- `index()` 方法允许开发者获取元素相对于其同级兄弟元素的索引位置。\n- 它对于在元素列表或元素组中的特定元素执行操作非常有价值。\n\
  - 你可以在特定元素上调用 `.index()` 来获取它在某组元素中的位置。\n- 索引是一个从 0 开始的值，表示在所选组中的内部位置。\n- 你可以使用\
  \ `:eq()` 和 `:lt()` 选择器根据元素在组中的位置来选择元素。`:eq()` 通过提供索引来选择特定元素，而 `:lt()` 则选择到指定索引之前的所有元素。\n\
  \n## 结论\n\n本章涵盖了如何使用这些方法，并提供了实际示例和练习来演示它们的用法。读者将牢固掌握如何使用 `data()` 和 `index()` 方法在\
  \ jQuery 中高效地处理页面元素。\n\n下一章将重点介绍使用 jQuery 进行事件处理，这是开发交互式 Web 的基础的基础。它将深入探讨 JavaScript\
  \ 中的事件模型，并展示如何使用 jQuery 绑定和触发事件。读者将探索 jQuery 中的各种事件方法，如 `.click()`、`.hover()`、`.submit()`\
  \ 和 `.click()`。\n\n## 多选题\n\n1. `data()` 方法的主要目的是什么？\n   a. 为 HTML 元素设置样式\n   b.\
  \ 向 HTML 元素附加自定义数据\n   c. 创建新的 HTML 元素\n   d. 解析 JSON\n\n2. 下列哪些数据类型可以通过 `data()`\
  \ 存储在元素中？\n   a. 仅字符串和数字\n   b. 仅对象和数组\n   c. 字符串、数字、对象或数组\n   d. HTML 元素\n\n3.\
  \ 如何使用 `data()` 从元素中检索存储的数据？\n   a. 使用 `.getData(‘key’)`\n   b. 使用 `.data(‘key’)`\n\
  \   c. 使用 `.retrieveData(‘key’)`\n   d. 使用 `fetch(‘key’)`\n\n4. jQuery 中的 `.index()`\
  \ 方法允许你确定什么？\n   a. 元素的 HTML 标签名\n   b. 元素相对于其同级元素的索引位置\n   c. DOM 中元素的总数\n   d.\
  \ 元素的 CSS 类\n\n# 答案\n\n1. b\n2. c\n3. b\n4. b\n\n\n\n\n\n事件在创建交互式和动态 Web 应用中起着至关重要的作用。在本章中，我们将探索使用\
  \ jQuery 进行事件处理，这是 Web 开发中的一个重要方面。我们将首先对 JavaScript 事件模型进行简要概述，为理解事件在 Web 开发中如何工作奠坚实的基础。\n\
  \n# 结构 (#toc.xhtml_s132a)\n\n在本章中，我们将涵盖以下主题：\n\n*   JavaScript 事件处理概述\n*   Web 开发中事件概念介绍\n\
  *   jQuery 如何简化事件处理的说明\n*   jQuery 中各种事件方法的说明，包括 `.click()`、`.hover()`、`.submit()`\
  \ 和 `.keypress()`\n*   演示如何使用这些方法处理用户交互\n*   事件委托：处理动态创建的元素上的事件\n*   使用 `.on()`\
  \ 方法同时绑定多个事件\n*   DOM 中事件冒泡和传播的说明\n*   介绍控制事件行为的事件方法，如 `.stopPropagation()` 和 `.preventDefault()`\n\
  *   演示如何使用 jQuery 监听鼠标移动事件并处理悬停事件\n*   监听键盘事件\n*   从 jQuery 的事件对象中提取值\n*   探索如何使用\
  \ jQuery 处理与 HTML 表单相关的事件\n\n# 理解事件处理 (#toc.xhtml_s133a)\n\nJavaScript 中的事件模型允许开发者响应\
  \ Web 页面上的各种交互和活动。这包括鼠标点击、键盘输入、表单提交等操作。然而，使用原生 JavaScript 处理事件可能会非常繁琐且复杂。这就是 jQuery\
  \ 作为一个强大工具大显身场的地方它可以简化事件处理并使其更加高效。\n\n# jQuery 事件方法 (#toc.xhtml_s134a)\n\njQuery\
  \ 提供了广泛的事件方法，简化了绑定和触发事件的流程。这些方法旨在简化事件处理，让开发者更容易有效地响应用户交互。一些常用的事件方法包括：\n\n## .click()\
  \ (#toc.xhtml_s135a)\n\n`.click()` 方法允许你响应特定元素上的鼠标点击事件。这通常用于创建按钮和链接等交互式功能。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<title>Click Example</title>\n<script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"\
  ></script>\n</head>\n<body>\n<button id=\"myButton\">Click me</button>\n<div id=\"\
  output\">Click the button to see the result.</div>\n<script>\n// Wait for the document\
  \ to be ready\n$(document).ready(function() {\n  // 为 id 为 \"myButton\" 的按钮附加点击事件处理器\n\
  \  $('#myButton').click(function() {\n    // 当按钮被点击时，将执行此函数\n    $('#output').text('Button\
  \ clicked!');\n  });\n});\n</script>\n</body>\n</html>\n```\n\n1.  我们在 HTML 文档的\
  \ `<head>` 部分中包含了 jQuery 库。\n2.  我们在 HTML `<body>` 中有了一个 id 为 `myButton` 的按钮和一个\
  \ id 为 `output` 的 `<div>`。\n3.  在`<script>` 区域内部，我们使用 `$(document).ready()` 确保代码在文档完全加载后执行。\n\
  4.  我们使用 `$('#myButton')` 选择按钮，并使用 `.click()` 方法为其挂载一个点击事件处理器。\n5.  当点击按钮时，会执行提供的函数，并将\
  \ id 为 `output` 的 `<div>` 文本更改为“Button clicked!”。\n\n此示例演示了使用 jQuery 的 `.click()`\
  \ 方法响应按钮点击事件的简单用例。\n\n## .hover() (#toc.xhtml_s136a)\n\n`.hover()` 方法允许你响应鼠标悬停事件，该事件在光标进入和离开元素时发生。这对于创建交互式工具提示和下拉菜单非常有用。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Hover Example</title>\n<script\
  \ src=\"https://code.jquery.com/jquery-3.6.0.min.js\"></script>\n<style>\n#myDiv\
  \ {\n  width: 200px;\n  height: 100px;\n  background-color: lightblue;\n}\n</style>\n\
  </head>\n<body>\n<div id=\"myDiv\">Hover over me</div>\n<div id=\"output\">Mouse\
  \ is not over the element.</div>\n<script>\n// Wait for the document to be ready\n\
  $(document).ready(function() {\n  // 选择 id 为 \"myDiv\" 的元素并使用 .hover() 附加悬停事件处理器\n\
  \  $('#myDiv').hover(\n    function() {\n      // 当鼠标进入元素时，执行此函数\n      $('#output').text('Mouse\
  \ entered the element.');\n    },\n    function() {\n      // 当鼠标离开元素时，执行此函数\n \
  \     $('#output').text('Mouse left the element.');\n    }\n  );\n});\n</script>\n\
  </body>\n</html>\n```\n\n1.  我们在 `<head>` 部分包含了 jQuery 库。\n2.  我们有一个 id 为 `myDiv`\
  \ 的 `<div>` 和另一个 id 为 `output` 的 `<div>`。\n3.  在`<script>` 区域内部，我们使用 `$(document).ready()`\
  \ 确保代码执行。\n4.  我们选择 id 为 `myDiv` 的元素并使用 `.hover()` 附加悬停事件处理器。\n5.  当鼠标进入或离开元素时，文本会随之改变。\n\
  \n此示例演示了如何使用 `.hover()` 方法响应鼠标事件。\n\n## .submit() (#toc.xhtml_s137a)\n\n`.submit()`\
  \ 方法用于处理表单提交。它允许你验证数据并阻止默认提交。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Submit\
  \ Example</title>\n<script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"></script>\n\
  </head>\n<body>\n<form id=\"myForm\">\n<label for=\"name\">Name:</label>\n<input\
  \ type=\"text\" id=\"name\" name=\"name\" required>\n<br>\n<label for=\"email\"\
  >Email:</label>\n<input type=\"email\" id=\"email\" name=\"email\" required>\n<br>\n\
  <input type=\"submit\" value=\"Submit\">\n</form>\n<div id=\"output\"></div>\n<script>\n\
  // Wait for the document to be ready\n$(document).ready(function() {\n  // 选择 id\
  \ 为 \"myForm\" 的表单并使用 .submit() 捕获提交事件\n  $('#myForm').submit(function(event) {\n\
  \    // 阻止默认表单提交\n    event.preventDefault();\n    // 获取表单输入的值\n    const name =\
  \ $('#name').val();\n    const email = $('#email').val();\n    // 将表单数据显示在 \"output\"\
  \ div 中\n    $('#output').html(`Name: ${name}<br>Email: ${email}`);\n  });\n});\n\
  </script>\n</body>\n</html>\n```\n\n1.  我们在 HTML 文档的 `<head>` 部分中包含了 jQuery 库。\n\
  2.  我们有一个 id 为 `myForm` 的 `<form>` 元素，包含姓名和邮箱的两个输入字段。\n3.  在`<script>` 区域内部，我们使用\
  \ `$(document).ready()` 确保代码执行。\n4.  我们选择 id 为 `myForm` 的表单，并使用 `.submit()` 方法捕获提交事件。\n\
  5.  在事件处理器中，我们使用 `event.preventDefault()` 阻止默认的表单提交。\n6.  我们使用 `.val()` 获取在姓名和邮箱字段中输入的值。\n\
  \n\n\n\n\n7. 最后，我们在“`output`”div 中显示表单数据。\n\n当用户提交表单时，表单字段输入的数据会被捕获，并在不刷新页的情况下显示在“`output`”div\
  \ 中。这演示了如何使用 jQuery 的 `.submit()` 方法捕获表单提交事件并根据需要进行处理。\n\n## .keypress()\n\n`.keypress()`\
  \ 方法用于捕捉键盘输入事件。你可以使用它创建如搜索栏或键盘快捷键的功能。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  <title>Keypress Example</title>\n<script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"\
  ></script>\n</head>\n<body>\n<input type=\"text\" id=\"myInput\">\n<p id=\"output\"\
  >Key pressed: </p>\n<script>\n// 等待文档就绪\n$(document).ready(function() {\n  // 选择\
  \ id 为“myInput”的输入字段并使用 .keypress() 捕获按键事件\n  $('#myInput').keypress(function(event)\
  \ {\n    // 获取按下按键的键码\n    const keyCode = event.which;\n    // 在“output”段落中显示键码\n\
  \    $('#output').text('Key pressed: ' + keyCode);\n  });\n});\n</script>\n</body>\n\
  </html>\n```\n\n1. 在 HTML 文档的 `<head>` 部分引入 jQuery 库。\n2. 有一个 id 为 `myInput` 的 `<input>`\
  \ 元素，用户可以在其中输入文本。\n3. 有一个 id 为 `output` 的 `<p>` 元素，用于显示关于按下键的信息。\n4. 在 `<script>`\
  \ 部分，我们使用 `$(document).ready()` 确保代码在文档完全加载后执行。\n5. 选择 id 为 `myInput` 的输入字段，并使用\
  \ `.keypress()` 方法捕获按键事件。提供的函数接收事件对象作为参数。\n6. 在事件处理器内部，我们使用 `event.which` 获取按下按键的键码。\n\
  7. 然后在“output”段落中显示该键码。\n\n当你在输入字段中打字时，按下按键的键码会被捕获，其值将显示在“output”段落中。\n\n## 鼠标事件\n\
  \n在 jQuery 中，鼠标事件允许开发者通过点击、悬停、移动和拖动鼠标指针等操作响应用户与网页的交互，从而创建出交互性且吸引人的用户界面。\n\njQuery\
  \ 鼠标事件响应用户的鼠标交互，如点击、悬停、拖动和释放。可以轻松地为 HTML 元素绑定监听器，响应各种鼠标动作执行自定义代码。\n\n## .hover()\n\
  \n**功能**：此方法用于分配在鼠标指针进入和离开元素时执行的函数。\n\n**解释**：在代码中，.main 容器内所有类为 `box` 的 `<div>`\
  \ 元素都应用了 `.hover()` 方法。当鼠标进入这些 div 中的任意一个，背景颜色会变为红色；当鼠标离开时，背景颜色将重置为白色。\n\n## .mouseup()\n\
  \njQuery 中的 `.mouseup()` 方法用于分配一个函数，当指针位于 HTML 元素上并释放鼠标按钮（点击后释放）时执行该函数。它允许你执行响应鼠标按钮释放的操作。例如，你可以在用户释放鼠标按钮后更改元素的外观或行为。它通常用于按钮或响应点击的元素的交互功能。此事件可以与\
  \ `.mousedown()` 结合使用，创建类似点击的功能，即同时对鼠标按钮的按下和释放做出响应。\n\n**功能**：此方法分配一个在元素上释放鼠标按钮时执行的函数。\n\
  \n**解释**：在代码中，当鼠标按钮在任何类为 `box` 的 `<div>` 元素上释放时，它会将它们的文本内容改为“MOUSE UP”并将背景颜色变为蓝色。\n\
  \n## .mousedown()\n\njQuery 中的 `.mousedown()` 方法用于分配一个函数，当指针位于 HTML 元素上并按下鼠标按钮（点击）时执行该函数。它允许你执行响应鼠标按钮按下的操作。例如，当用户点击元素时，你可以更改元素的外观或行为。它通常用于创建交互功能，如按钮点击或拖放功能。此事件经常与\
  \ `.mouseup()` 事件结合使用，以创建同时对鼠标按钮按下和释放做出响应的功能。\n\n**功能**：此方法分配一个在元素上按下鼠标按钮时执行的函数。\n\
  \n**解释**：在代码中，当鼠标按钮在任何类为 `box` 的 `<div>` 元素上按下时，它会将它们的文本内容改为“MOUSE DOWN”并将背景颜色变为绿色。\n\
  \n## .mouseout()\n\njQuery 中的 `.mouseout()` 方法用于分配一个在鼠标指针移出 HTML 元素时执行的函数。它在鼠标离开所选元素边界时触发。此事件对于你希望在用户鼠标离开特定区域时采取操作的场景非常有用，例如当鼠标不再悬停在触发提示框的元素上时隐藏提示框。它是\
  \ `.mouseover()` 事件的反相反，后者在鼠标进入元素边界时触发。\n\n**功能**：此方法分配一个在鼠标按钮离开元素时执行的函数。\n\n**解释**：当鼠标指针离开\
  \ .main 容器时，类为 `div2` 的 `<div>` 文本内容将变为“Mouse OUT on MAIN!”.\n\n## .mouseover()\n\
  \njQuery 中的 `.mouseover()` 方法用于分配一个在鼠标指针移动到 HTML 元素上时执行的函数。它在鼠标进入所选元素边界时触发。此事件通常用于在用户悬停在元素上时创建交互效果，例如显示提示框或更改元素的外观。它是\
  \ `.mouseout()` 事件的反相反，后者在鼠标离开元素边界时触发。\n\n**功能**：此方法分配一个在鼠标进入元素时执行的函数。\n\n**解释**：当鼠标进入\
  \ .main 容器时，类为 `div2` 的 `<div>` 文本内容将变为“Mouse OVER on MAIN!”.\n\n## .mouseleave()\n\
  \njQuery 中的 `.mouseleave()` 方法用于分配一个在鼠标指针离开 HTML 元素边界时执行的函数。它在鼠标离开所选区域时触发。此事件通常用于在用户鼠标移出元素时创建交互效果，例如隐藏提示框或恢复元素的原始外观。它是\
  \ `.mouseenter()` 事件的反相反，后者在鼠标进入元素边界时触发。\n\n**功能**：此方法分配一个在鼠标离开元素时执行的函数。\n\n**解释**：当鼠标指针离开\
  \ .main 容器时，类为 `div3` 的 `<div>` 文本内容将变为“Mouse LEFT on MAIN!”.\n\n## .mouseenter()\n\
  \n\n\n\n\njQuery 中的 `.mouseenter()` 方法用于分配一个函数，该函数会在鼠标指针进入 HTML 元素的边界时执行。它在鼠标悬停在选定元素上时触发。此事件通常用于创建交互效果，例如显示工具提示或更改元素的外观。它通常与\
  \ `.mouseleave()` 事件配合使用，以处理元素的鼠标进入和离开事件。\n\n功能：此方法分配一个函数，当鼠标指针进入元素时执行该函数。\n解释：当鼠标指针进入\
  \ `.main` 容器时，类为 `div3` 的 div 文本内容将变为“Mouse ENTER on MAIN!”。\n\n## 鼠标\n\njQuery\
  \ 中的 `.mousemove()` 方法用于绑定一个函数，每当鼠标指针在选定的 HTML 元素上移动时都会执行该函数。当光标在元素边界内移动时，此事件会持续触发。它通常用于跟踪鼠标位置并创建交互式功能，如更新坐标或跟随鼠标。事件处理器接收有关鼠标当前位置的信息，这些信息可以用于\
  \ Web 应用程序各种用途。\n\n功能：此方法分配一个函数，当鼠标指针在文档上移动时执行该函数。\n解释：当鼠标指针在文档上任何位置移动时，类为 `div1`\
  \ 的 div 文本内容将显示鼠标指针当前的 X 和 Y 坐标。\n\n## 鼠标事件和悬悬\n\n练习：在元素上绑定各种鼠标移动事件。\n1. 为 `main`\
  \ 类内部的 divs 添加 `hover()` 事件。在进入时，将背景颜色更新为红色，离开时设为白色。\n2. 在 divs 上添加 `mouseup()`\
  \ 和 `mousedown()`，在不同的鼠标状态下更新文本和背景颜色。\n3. 在主元素上添加 `mouseout()` 和 `mouseleave()`，并检查它们的区别。\n\
  4. 在主元素上添加 `mouseenter()` 和 `mouseover()`，检查它们的区别。\n5. 在按钮上添加 `mouseenter()` 和 `mouseleave()`，像\
  \ `hover()` 事件一样更新背景颜色。\n6. 在主元素上从事件对象跟踪 `mousemove()`，获取 `pageX` 和 `pageY` 属性的值，并将它们输出到页面元素中。\n\
  \nCSS 代码：\n```css\n.box{\n  border: 1px solid #ddd;\n  height: 50px;\n  width: 100px;\n\
  }\n```\n\nHTML 代码：\n```html\n<nav>\n  <div class=\"main\">\n    <div class=\"div1\"\
  >Hello World 1</div>\n    <div class=\"div2\"><span>Hello World 2</span></div>\n\
  \    <div class=\"div3\" id=\"div3\">Hello World 3</div>\n    <div class=\"div4\"\
  >Laurence Svekis</div>\n    <button id=\"btn1\">1</button>\n    <button id=\"btn2\"\
  >2</button>\n    <button id=\"btn3\">3</button>\n    <span class=\"span1\">Hello</span>\n\
  \  </div>\n</nav>\n<button id=\"btn4\">4</button>\n<button id=\"btn5\">5</button>\n\
  ```\n\nJavaScript 代码：\n```javascript\n$('.main div').addClass('box').hover(\n  function()\
  \ { \n    $(this).css('background-color', 'red') \n  },\n  function() { \n    $(this).css('background-color',\
  \ 'white') \n  }\n).mouseenter(function(e) {\n  //$(this).text(`X:${e.pageX} Y:${e.pageY}`);\n\
  });\n\n$('.main div').mouseup(function() {\n  $(this).text('MOUSE UP');\n  $(this).css('background-color',\
  \ 'blue');\n}).mousedown(function() {\n  $(this).text('MOUSE DOWN');\n  $(this).css('background-color',\
  \ 'green');\n});\n\n$('.main').mouseout(() => {\n  $('.div2').text('Mouse OUT on\
  \ MAIN!'); \n});\n\n$('.main').mouseover(() => {\n  $('.div2').text('Mouse OVER\
  \ on MAIN!'); \n});\n\n$('.main').mouseleave(() => {\n  $('.div3').text('Mouse LEFT\
  \ on MAIN!'); \n});\n\n$('.main').mouseenter(() => {\n  $('.div3').text('Mouse ENTER\
  \ on MAIN!'); \n});\n\n$('button').css('width', '100px');\n$('button').mouseenter(function(e)\
  \ {\n  $(this).css('background-color', 'red');\n})\n\n$('button').mouseleave(function()\
