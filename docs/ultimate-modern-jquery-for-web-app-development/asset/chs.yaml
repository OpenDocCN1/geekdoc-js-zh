  [www.orangeava.com](http://www.orangeava.com)\n\n# 献给\nAlexis 和 Sebastian Svekis\n\
  感谢你们的支持\n\n# 关于作者\n`Laurence Svekis` 是一位备受尊敬的 Web 开发者、在线教育者和企业家，因他在技术和数字学习领域的动态贡献而闻名。在开发\
  \ Web 应用方面拥有超过二十年的职业生涯，他已成为在线教育领域的基石，教授编程课程并与全球观众分享他丰富的知识。\n\nLaurence 在 Web 开发领域的历程以他早期采用并精通各种编程语言为标志，包括对\
  \ `JavaScript` 的卓越熟练。他的专业知识扩展到 `Google Workspace` 的复杂功能中。\n\n作为一名在线讲师，Laurence 编写了大量课程，涵盖了\
  \ Web 开发的广泛主题。这些课程不仅全面，而且设计为让处于编码之旅不同阶段的学习者（从初学者到高级从业者）都能理解。他对教育的投入体现在他全球范围内超过一百万学生的成就上，这证明了他的教学方法的影响力和范围。\n\
  \n除了在线课程外，Laurence 还作为畅销书作者留下了自己的足迹。他的出版物与其教学理念产生共鸣，为读者提供了实用的见解，并引导他们清晰、轻松地应对 Web\
  \ 开发和编程的复杂性。\n\nLaurence 对技术和创新的热情不仅止于教学和写作。他内心也是一个企业家，不断探索 Web 技术的新领域，并开发解决现实世界挑战的解决方案。他对于分享知识和赋予他人利用技术力量的热情，凸显了他作为数字世界领导者和远见者的角色。\n\
  \n总而言之，`Laurence Svekis` 顶顶尖 Web 开发者、有影响力的在线教育者、畅销书作者和富有启发性的企业家。他的贡献不仅丰富了 Web 开发领域，还为无数学习者在数字蓝图中释放他们的潜力铺平了道路。\n\
  \n# 关于技术评审员\n`Siddharth Shrivastava` 是 `HCLTech` 的资深前端技术主管，专门负责创建可访问和包容性的产品，以及为\
  \ Web 定制的数字体验。他在技术领域的历程始于 2014 年，在过去的 9 多年变革岁月里，他为美国的金融科技、电信和银行客户构建了软件。\n\nSiddharth\
  \ 的演变使他从制作网站变为精通动态前端技术。目前，在 `HCL`，他协调将原型转换为充满活力的界面，将技术实力与软件生命周期相结合。他的工作不仅展示了技术专长，还为优秀客户的产品带来了巨大的价值。\n\
  \n在搬到美国之前，Siddharth 在印度的一家金融科技客户工作，在金融科技领域积累了宝贵的经验，并理解了合性和数据驱动的开发。在此之前，他曾在一家电信客户工作，将网站从\
  \ `Angular` 迁移到 `React`。Siddharth 的职业始于 `Cognizant`，担任使用 `C#`、`JavaScript` 和 `Angular`\
  \ 的全栈工程师。\n\n`Siddharth Shrivastava` 的故事是一个不断学习、创新和对技艺奉献的故事。他的工作反映了他的信念：问题是尽力而的机会，以及他通过技术专长交付巨大价值的承诺。\n\
  \n# 致谢\n我深感谢许多人士，他们的专业知识、见解和鼓励对于本书的创作不可或缺的。首先，向 `jQuery` 社区和所有参与者表示由衷的感谢。\n\n我还要感谢\
  \ Web 开发领域的同行教育者和学生，他们的问题和挑战很大地启发了我。他们好奇心和对学习的渴望推动着使每一章（从 `jQuery` 基础到高级 `AJAX`\
  \ 方法）变得既有启发性又易于理解。\n\n最后，我的孩子理应巨大的感激，感谢他们在写作和修订的无数小时中给予的坚定不移的支持和耐心。这本书不仅是我知识的反映，也是我们共同珍爱的\
  \ Web 开发热情的见证。\n\n我们共同创作了本指南，我希望它能够赋能并激励开发者在动态的 jQuery 世界中前进。\n\n# 序言\n本书是对 `jQuery`\
  \ 的简洁而深入的探索，从基础语法和如何将其嵌入 HTML 文件开始，扩展到动态内容更新 `AJAX` 等高级主题。每一章都循序渐进地建立在前章的基础上，涵盖了元素选择、动画、DOM\
  \ 操作等，并以在现实背景下应用所学的实践项目作为结束。\n\n\n\n\n\n\n本章重点在于掌握页面元素的选择与操作，以及文档对象模型（DOM）的导航。它从\
  \ jQuery 基础选择器的基本知识开始，通过标签、类或 ID 目标元素。随后，继续介绍属性选择器和伪选择器的复杂用法，以实现更精确的元素定位。此外，还深入探讨了\
  \ jQuery 的遍历技术，用于动态元素操作。本章最后对元素过滤（Filtering）进行了深入研究，这对于创建复杂且响应式的 Web 界面至关重要。\n\n\
  本章解释了如何使用 jQuery 的内置方法在网页上隐藏和显示元素，以及如何创建动画效果。在 Web 开发领域，控制可见性并为页面元素添加动画效果可以将静态网站转变为交互且引人入胜的体验。jQuery\
  \ 提供了一系列强大的方法来实现这一点，为创建动态网页内容开启了无限可能。在本章中，我们将探索这些方法，从简单的隐藏和显示技术到更高级的淡入和滑动效果，使你掌握赋予网页生命的技能。\n\
  \n本章涵盖了如何使用 jQuery 纵网页元素的内容，以及如何向网页中添加新元素。深入探索利用 jQuery 力量操作网页元素内容和插入新元素的精彩世界。无论你是资深\
  \ Web 开发者还是初学者，掌握这些技术都将显著提升你创建动态交互式网页的能力。\n\n本章涵盖了如何使用 jQuery 的 DOM 操作方法来处理和选择网页上的元素。深入探究使用\
  \ jQuery 进行文档对象模型（DOM）操作和选择的世界。在之前介绍的基础概念基础上，我们将探索动态修改网页结构的高级技术。到本章结束时，你将彻底理解如何利用\
  \ jQuery 的力量来有效地操作 DOM。\n\n本章提供了一个实战项目，教导读者如何使用 jQuery 创建带有交互元素的动态列表。开启一个使用 jQuery\
  \ 的实际项目，我们将在其中创建一个带有交互元素的动态列表。该项目将允许读者应用 jQuery 知识来构建一个可在 Web 应用程序中使用的真实交互功能。让我们开始吧！\n\
  \n本章解释了如何使用 jQuery 获取和设置 CSS 属性以及元素属性。我们将探索如何使用 jQuery 处理 CSS 属性和元素属性。这些知识对于动态修改网页元素的外观和行为非常重要。\n\
  \n本章涵盖了如何使用 jQuery 的遍历方法来遍历和选择页面元素。我们将探索使用 jQuery 遍历和选择页面元素的高级技术。这些方法允许读者高效地导航 DOM\
  \ 树，并根据关系、属性和状态选择特定元素。\n\n本章重点介绍两个重要的 jQuery 方法：`data()` 和 `index()`。这些方法在增强页面元素操作效率方面起着重要作用。本章探讨了\
  \ `data()` 方法，它能够向元素附加并从中检索自定义数据——这一功能对于存储状态信息或元数据特别有用。本章详尽解释了 `data()` 在存储和访问关联数据方面的用法。相反，`index()`\
  \ 方法被介绍为获取元素相对于其兄弟元素索引位置的工具，有助于在列表或元素组中的特定操作。\n\n本章提供了使用 jQuery 处理事件的全面指南，这是开发动态\
  \ Web 应用程序的关键元素。它首先概述了 JavaScript 事件模型，然后深入探讨了 jQuery 绑定和触发事件的能力。读者将学习如何利用各种 jQuery\
  \ 事件方法，如 `.click()`、`.hover()`、`.submit()` 和 `.keypress()`，来实现有效的用户交互管理。书中还涵盖了高级技术，包括针对动态创建元素的事件委托（event\
  \ delegation）以及使用 `.on()` 方法绑定多个事件。\n\n本章深入探讨 jQuery 中的高级事件处理技术，强调了高效使用 `.on()`\
  \ 方法进行动态事件管理。通过交互式练习，本章引导读者掌握事件绑定的复杂性，增强他们创建强大的 Web 交互的能力。书中深入探讨了事件冒泡和传播等核心概念，为理解它们在事件行为中的重要作用提供了清晰的见解。\n\
  \n本章深入探讨了 jQuery 中的 AJAX 方法和回调选项——这是开发交互和响应式 Web 应用程序的关键方面。AJAX（异步 JavaScript 和\
  \ XML）允许在不刷新整个页面的情况下更新 Web 内容，通过快速响应提升用户体验。jQuery AJAX 功能的石是 `$.ajax()` 方法，它促进了\
  \ HTTP 请求的发送和服务器响应的处理。\n\n# 下载代码\n代码包和彩色图片\n\n请点击链接或扫描二维码下载本书的代码包和图片：\n\n# [`github.com/ava-orange-education/Ultimate-Modern-jQuery-for-Web-App-Development`](https://github.com/ava-orange-education/Ultimate-Modern-jQuery-for-Web-App-Development)\n\
