  \ 方法获取端点数据作为 JSON。将响应对象数据的输出部分，通过对象的属性值将其选择到浏览器控制台。\n\n```javascript\nconst url\
  \ = ‘https://script.google.com/macros/s/AKfycbzuGPGSdXCOOD9jQq4S0sx-OQxlOdL70sC_Z4AmWsRC6jnaxnwg8HGWfMBvalb-aD4U/exec’;\n\
  $(‘<input>’).attr({\ntype:’text’,\nvalue:’Laurence’,\nname:’first’\n}).appendTo(‘.ins’).before(‘First:’).after(‘<br>’);\n\
