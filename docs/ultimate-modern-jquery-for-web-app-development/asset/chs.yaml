- "# Web 应用开发现代 jQuery 终极指南\n\n\n\n![](img/cover.jpg)\n![image](img/cover.jpg)\n\n\
  \n![](img/line.jpg)\n\n通过 jQuery 和 JavaScript 的无缝 DOM 纵、动画和 AJAX 集成\n\n![](img/line.jpg)\n\
