  \n# 第 2 章\n## jQuery 页面元素选择与 DOM 元素选择\n\n## 引言\n\n欢迎来到至关重要的章节，我们将深入探讨 jQuery 的核心：选择页面元素和遍历文档对象模型（DOM）的艺术。在本章中，我们将探索\
  \ jQuery 核心的基础工具，从通过标签、类或 ID 定位元素的基础选择器（Basic Selectors）开始。我们将进展到属性选择器（Attribute\
  \ Selectors）和伪选择器（Pseudo Selectors），揭示根据属性或状态精确定位元素的更复杂方法。此外，我们将通过 jQuery 的遍历技术遍历\
  \ DOM，增强我们动态查找和操作元素的能力。最后，我们以元素过滤（Filtering Elements）结束课程，为针对更复杂、更响应式的 Web 界面精炼选择提供更深入的理解。\n\
  ## 结构\n\n在本章中，我们将讨论以下主题：\n\n* 基础选择器\n* 伪选择器\n* 使用 jQuery 遍历 DOM 元素\n* 使用 jQuery\
  \ 过滤元素\n\n## 使用 jQuery 选择页面元素与 DOM 元素选择\n在 Web 开发领域，选择和操作 DOM 元素的能力是至关重要的。jQuery\
  \ 为开发者提供了强大的工具，可以轻松导航和操作文档对象模型（DOM），从而实现动态且丰富的 Web 体验。在本章中，我们将深入研究使用 jQuery 选择 DOM\
  \ 元素的艺术。\n\n### 基础选择器\n\n在网页上选择元素是 jQuery 能力的核心。基础选择器允许你通过 HTML 标签、类和 ID 定位元素。以下是实现方法的概览：\n\
  ```javascript\n// 按标签选择\n$(\"p\") // 选择所有 <p> 元素\n\n// 按类选择\n\n// 按 ID 选择\n$(\"\
  #header\") // 选择 ID 为“header”的元素\n```\n\n\n1. 创建一个 HTML 文件进行交互，其中包含带有 ID 和类的元素。\n\
  2. 使用标签、类和 ID 选择元素。将 jQuery 元素对象输出到控制台。\n3. 创建变量并分配 jQuery 元素对象，将其输出到页面。\n\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head><title>jQuery 课程</title></head>\n<div>Hello World\
  \ 1</div>\n<div class=\"div2\">Hello World 2</div>\n<div id=\"div3\">Hello World\
  \ 3</div>\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js\"\
  ></script>\n<script src=\"app2.js\"></script>\n</html>\n```\n\n**APP2.JS**\n\nconsole.log($(\"\
  div\"));\n$(\"div\").html(\"Hello\");\nconsole.log($(\".div2\"));\nconsole.log($(\"\
  #div3\"));\nconsole.log($(\"#div3, .div2\"));\nconst $ele1 = $(\"div\");\n$ele1.html(\"\
  Hello 2\");\nconst $ele2 = $(\".div2\");\nconsole.log($ele2);\nconst $ele3 = $(\"\
  #div3\");\nconsole.log($ele3);\nconsole.log($ele4);\n```\n\n### 属性选择器\n\n属性选择器允许你根据属性及其值定位元素。这在处理输入验证和自定义时特别有用：\n\
  \n```javascript\n// 按属性选择\n$(\"input[type='text']\") // 选择所有文本输入\n\n// 选择特定属性\n\
  $(\"[data-toggle]\") // 选择带有“data-toggle”属性的元素\n```\n**练习**：使用属性选择：\n\n**HTML：**\n\
  \n```html\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1.0\">\n<title>属性选择器示例</title>\n</head>\n\
  <body>\n<h1>属性选择器示例</h1>\n<button data-toggle=\"modal\">打开模态框</button>\n<button\
  \ data-toggle=\"sidebar\">打开侧边栏</button>\n</body>\n</html>\n```\n\n**JavaScript\
  \ (script.js):**\n```javascript\n$(document).ready(function() {\n  // 为带有 data-toggle\
  \ 属性的元素绑定点击事件\n  $(\"[data-toggle]\").click(function() {\n    const target = $(this).data(\"\
  toggle\");\n  });\n});\n```\n\n\n\n\n要运行此练习，请在同一目录下创建 HTML 和 JavaScript 文件，并在网页浏览器中打开\
  \ HTML 文件。当你点击 `Open Modal` 或 `Open Sidebar` 按钮时，你将看到一个弹窗消息，指示哪个元素被切换了。此练习演示了如何使用属性选择器根据数据属性来定位元素。\n\
  \n## 伪选择器 (Pseudo Selectors)\n伪选择器根据元素状态提供动态选择，例如 `:hover`、`:first-child` 和 `:nth-child`：\n\
  \n```javascript\n// 选择 <ul> 内部第一个 <li> 元素\n$(\"ul li:first-child\")\n\n```javascript\n\
  // 选择表格中奇数的 <tr> 元素\n$(\"table tr:nth-child(odd)\")\n```\n**练习**：使用 jQuery 选择第一个列表项并将其背景颜色更改为蓝色：\n\
  \n**HTML:**\n\n```html\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta\
  \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Change\
  \ CSS with jQuery</title>\n</head>\n<<body>\n<h1>Change CSS with jQuery</h1>\n<ul>\n\
  <li>Item 1</li>\n<li>Item 3</li>\n</ul>\n<script src=\"script.js\"></script>\n</body>\n\
  </html>\n\n**JavaScript (script.js):**\n\n```javascript\n$(document).ready(function()\
  \ {\n  $(\"ul li:first-child\").css(\"color\", \"blue\");\n});\n```\n\n在此示例中，我们有一个包含三个列表项的无序列表。`script.js`\
  \ 文件中的 jQuery 代码使用选择器 `$(\"ul li:first-child\")` 来定位第一个列表项。然后使用 `.css()` 方法将第一个列表项的文本颜色更改为蓝色。\n\
  \n要运行示例，请在同一目录下创建 HTML 和 JavaScript 文件，并在网页浏览器中打开 HTML 文件。你将看到一个带有三个项目的列表，且第一个项目的文本颜色将变为蓝色。此示例演示了如何使用\
  \ jQuery 更改列表中特定元素的 CSS 属性。\n\n## DOM 遍历 (DOM Traversal)\n\njQuery 简化了在 DOM 层级中导航的过程，允许你轻松遍历父元素、子元素和兄弟元素：\n\
  \n```javascript\n// 选择元素的父元素\n$(\"#childElement\").parent()\n\n```javascript\n//\
  \ 选择元素的所有直接子元素\n$(\"ul\").children()\n```\n```javascript\n// 选择元素的下一个兄弟元素\n$(\"\
  .current\").next()\n```\n\n\n**练习**：向父 HTML 元素向上移动，遍历到选中元素的祖先节点。\n\n1. 选择按钮元素，并在点击时输出\
  \ `parent()` 和 `parents()` 的长度。\n2. 使用 `parentsUntil()` 选择该元素的祖先，并选择一个元素作为停止点。\n\
  \n**HTML:**\n\n```html\n<!DOCTYPE html>\n<head><title>jQuery Course</title>\n<style>\n\
  .box{\nwidth:200px;\nborder:5px solid #ddd;\nmargin:10px;\n}\n</style>\n</head>\n\
  <body><nav class=\"main\">\n<div class=\"div1\">Hello World 1</div>\n<div class=\"\
  div2\"><span>Hello World 2</span></div> <div class=\"div3\" id=\"div3\">Hello World\
  \ 3</div> <div class=\"div4\">Laurence Svekis</div>\n<input >\n<div class=\"main\"\
  >\n<button id=\"btn1\">1</button>\n</div>\n<button id=\"btn1\">3</button>\n</div></nav>\n\
  <button id=\"btn1\">4</button>\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js\"\
  ></script>\n</body>\n</html>\n```\n\n**app14.js**\n\n$('#btn1').click(function(){\n\
  \  console.log($(this).parent().length);\n  console.log($(this).parents().length);\n\
