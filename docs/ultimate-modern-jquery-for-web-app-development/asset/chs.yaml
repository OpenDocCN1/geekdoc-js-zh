  \ : $(‘input’).last().val()\n    },\n    dataType:’json’\n  })\n  .done((data)=>{\n\
  \    console.log(data);\n    const html = `AJAX with Data ${data.para.first} ${data.para.last}`;\n\
  \    $(‘<div>’).html(html).appendTo(‘.output’);\n  })\n  .fail((err)=>{\n    console.log(err);\n\
  \  })\n  .always((data)=>{\n    console.log(data);\n  })\n})\n\n$(‘#btn3’).text(‘AJAX\
  \ POST’).click(()=>{\n  $.ajax({\n    url:url,\n    type:’POST’,\n    data:{\n \
  \     first : $(‘input’).first().val(),\n      last : $(‘input’).last().val()\n\
  \    },\n    dataType:’json’\n  })\n  .done((data)=>{\n    console.log(data);\n\
  \    const html = `AJAX POST data ${data.para.first} ${data.para.last}`;\n    $(‘<div>’).html(html).appendTo(‘.output’);\n\
  \  })\n  .fail((err)=>{\n    console.log(err);\n  })\n  .always((data)=>{\n    console.log(data);\n\
  \  })\n})\n```\n\n## 使用简写方法简化 AJAX\n\njQuery 的简写方法包括 `$.get()`、`$.post()`、`$.getJSON()`\
  \ 和 `$.getScript()`。这些简洁且易用的方法简化了发送 AJAX 请求的过程，增强了代码的可读性和维护性。\n\n`$.get( url [,\
  \ data ] [, success ] [, dataType ] ):`\n\n**解释：** `$.get()` 方法用于发送一个 AJAX GET 请求，以从服务器获取数据。\n\
  \n```javascript\n$.get(\"https://jsonplaceholder.typicode.com/posts/1\", function(data)\
  \ {\n  console.log(data); // 显示获取到的数据\n});\n```\n\n`$.post( url [, data ] [, success\
  \ ] [, dataType ] ):`\n\n**解释：** `$.post()` 方法用于发送一个 AJAX POST 请求以向服务器发送数据。\n\n\
  ```javascript\n$.post(\"https://jsonplaceholder.typicode.com/posts\", { title: “New\
  \ Post\", body: “This is the post body” }, function(data) {\n  console.log(data);\
  \ // 显示来自服务器的响应\n});\n```\n\n`$.getJSON( url [, data ] [, success ] ):`\n\n**解释：**\
  \ `$.getJSON()` 方法专门用于发送获取 JSON 数据的 AJAX GET 请求。它会自动解析 JSON 响应。\n\n```javascript\n\
  $.getJSON(\"https://jsonplaceholder.typicode.com/posts/1\", function(data) {\n \
  \ console.log(data); // 显示解析后的 JSON 数据\n});\n```\n\n`$.getScript( url [, success\
  \ ] )`\n\n解释：`$.getScript()` 方法用于从服务器动态加载并执行 JavaScript 脚本。\n\n```javascript\n$.getScript(\"\
  https://example.com/script.js\", function() {\n  // 外部脚本已加载并执行\n  // 你现在可以使用加载脚本中定义的函数或变量\n\
  });\n```\n\n这些简写方法简化了在 jQuery 中执行常见类型 AJAX 请求的过程。它们提供了一种方便的方法执行 GET 和 POST 请求、获取\
  \ JSON 数据以及加载外部脚本，减少了为了这些常用操作需要编写的代码量。\n\n## 处理 AJAX 响应的回调选项\n\nAJAX 的核心方面之一是管理来自服务器的响应。这些强大的工具允许开发者定义在\
  \ AJAX 请求完成后执行的函数。读者将发现各种回调函数，例如 success、error 和 complete，它们在处理 AJAX 响应和错误方面起着至关重要的作用。\n\
  \njQuery 中的回调选项是可以定义的函数，这些函数会在 AJAX 请求完成后执行，提供了一种处理服务器响应各个方面的方法。回调是有效管理 AJAX 响应和错误的必组成部分。以下是处理\
  \ AJAX 响应的常用回调选项的解释。\n\n*   `success`：\n\n解释：当 AJAX 请求成功时，执行成功回调。它通常用于处理从服务器接收的数据。\n\
  \n```javascript\n$.ajax({\n  url: \"example.com/data\",\n  success: function(data)\
  \ {\n    // 处理成功响应\n  }\n});\n```\n\n*   `error`：\n\n解释：当请求失败时，执行错误回调。它用于处理如错误状态码等问题。\n\
  \n```javascript\n$.ajax({\n  url: \"example.com/data\",\n  error: function(xhr,\
  \ status, error) {\n    // 处理错误响应\n  }\n});\n```\n\n*   `complete`：\n\n解释：无论请求成功还是失败，都会执行\
  \ complete 回调。它通常用于清理任务，如隐藏加载指示器。\n\n```javascript\n$.ajax({\n  url: \"example.com/data\"\
  ,\n  complete: function() {\n    // 执行清理代码\n  }\n});\n```\n\n这些回调选项允许你处理 AJAX 请求的各种结果，确保对应用程序流程的稳健控制。\n\
  \n\n\n\n\n```json\n{“firstName”:”Laurence”,”lastName”:”Svekis”,”isAlive”:true,”age”:25,”address”:{“streetAddress”:”33\
