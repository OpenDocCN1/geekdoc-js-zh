  通过 CDN 引入 jQuery，您利用了一个专门用于优化网络内容交付的全球服务器网络。这种方法增强了您的 Web 应用程序的加载速度和整体性能，同时也减轻了自身托管资源的负担。\n\
  \n以下是关于如何向 HTML 中添加 jQuery 并使用 jQuery 创建简单的元素选择、事件和元素内容操作的逐步指南：\n\n\n1.  创建一个 HTML\
