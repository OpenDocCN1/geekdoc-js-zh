  trans: "\n`.slideUp()` 方法通过向上滑动元素来隐藏它们。你可以控制动画持续时间：\n\n```javascript\n$(“slideUpElement”).slideUp(1000);\n\
    ```\n\n### `.slideDown()`：滑动显示\n\n相反，`.slideDown()` 通过向下滑动元素来显示它们。动画持续时间是可以自定义的：\n\
    \n```javascript\n$(“slideDownElement”).slideDown(1000);\n```\n\n### `.slideToggle()`：切换滑动\n\
    \n`.slideToggle()` 方法在元素向上滑动和向下滑动之间切换。它非常适合创建可折叠区域：\n\n```javascript\n$(“slideToggleElement”).slideToggle(1000);\n\
    ```\n\n### 练习：使用 jQuery 实现滑动效果\n\n1. 隐藏 `show` 按钮。\n2. 在隐藏按钮上添加点击事件，使用 `slideUp()`\
    \ 隐藏页面上所有的 `div`，并调用一个切换两个按钮的函数。\n3. 此时第二个 `show` 按钮应该是可见的，为该按钮添加点击事件，使用 `slideDown()`\
    \ 函数显示所有 `div`。\n4. 为每个 `div` 添加点击事件，执行 `slideToggle()`，点击时应隐藏该 `div`。\n\n####\
    \ HTML 代码\n\n```html\n<div>>Hello World 1</div>\n<div class=”div2”>Hello World\
    \ 2</div>\n<div id=”div3”>Hello World 3</div>\n<button id=”btn1”>Hide</button>\n\
    <button id=”btn2”>Show</button>\n```\n\n#### JavaScript 代码\n\n```javascript\n\
    $(‘#btn2’).hide();\n$(‘#btn1’).click(() => {\n  $(‘div’).slideUp(‘slow’, doneFun);\n\
    });\n$(‘#btn2’).click(() => {\n  $(‘div’).slideDown(‘fast’, doneFun);\n});\n$(‘div’).click(function()\
    \ {\n  $(this).slideToggle();\n});\nfunction doneFun() {\n  console.log(‘slide\
