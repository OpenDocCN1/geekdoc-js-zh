    # [Filtering Elements](#toc.xhtml_s22a)


    Refine your selections by filtering elements that meet specific conditions. This
    enhances precision in manipulating specific parts of your webpage:


    `// Filter by even-numbered elements`


    `$(“li”).filter(“:even”)`


    `// Filter by elements containing specific text`


