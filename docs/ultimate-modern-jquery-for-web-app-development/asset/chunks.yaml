    `Exercise`: jQuery offers several GET methods to either send GET data, import
    a JS file to use in the current file and return response data as JSON.


    1. Create input elements for the page using jQuery.

    2. On the first button click, make a get method request to the endpoint and retrieve
    the JSON data. Output the JSON data object contents to the web page. `get()` method.

    3. On the second button click import a JavaScript JS script file. Include a function
    in the new JS file that can then be invoked. `getScript()` method.

    4. Add a new button to the page that will invoke the new JS function when clicked,
    outputting the contents of the input field into the browser console.

    5. On the third button click, get the endpoint data as JSON using the `getJSON()`
    method. The output part of the response object data, selecting it by the property
    value of the object into the console of the browser.


    ```javascript

    const url = ‘https://script.google.com/macros/s/AKfycbzuGPGSdXCOOD9jQq4S0sx-OQxlOdL70sC_Z4AmWsRC6jnaxnwg8HGWfMBvalb-aD4U/exec’;

    $(‘<input>’).attr({

