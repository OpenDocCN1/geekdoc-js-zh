  trans: "\n\n# 引言\n\n在本章中，我们将开启一个使用 jQuery 的实战项目，创建一个带有交互元素的动态列表。此项目将允许读者应用他们对 jQuery\
    \ 的知识，构建一个可以在 Web 应用程序中使用的真实交互功能。让我们开始吧！\n\n# 章节结构\n\n在本章中，我们将讨论以下主题：\n\n* 使用\
    \ jQuery 创建动态列表\n* 使用 jQuery 实现交互元素\n\n# 使用 jQuery 创建动态列表\n\n在本节中，我们将使用 jQuery\
    \ 创建一个动态列表：\n\n1. **项目概述**：我们将从理解项目的范围开始。我们的目标是创建一个用户可以与之交互的动态列表，允许他们根据需要添加和删除项目。该列表将根据用户的操作动态更新其内容。\n\
    2. **HTML 结构**：我们将为列表定义 HTML 结构，包括一个用于添加新项目的输入框、一个用于提交新项目的按钮以及一个显示列表的区域。\n3. **CSS\
    \ 样式**：我们将使用 CSS 对列表进行样式处理，使其视觉上更漂亮。这包括对列表项、按钮和整体布局进行建模。\n4. **jQuery 实现交互**：我们将利用\
    \ jQuery 为列表添加交互性。读者将学习如何使用 jQuery 方法来：\n    * **添加项目**：我们将使用 `.append()` 或 `.prepend()`\
    \ 在用户提交时向列表添加新项目。\n    * **删除项目**：我们将实现一种机制，当用户点击与每个项目关联的按钮时，从列表中删除该项目。\n\n  事件委托\n\
    \njQuery 中的事件委托是一种用于高效处理事件的技术，特别是在处理多个触发相同事件的元素时。当元素动态添加到 DOM 中（即在页面加载时不存在）或当你希望减少附加到元素上的事件处理器数量时，这种技术特别有用。在传统的事件处理中，你直接为每个元素附加一个事件处理器。然而，如果元素很多，这种方法会导致性能问题。此外，如果动态添加了新元素，它们将不会继承这些事件处理器。\n\
    \n# 使用 jQuery 实现交互元素\n\n以下是使用 jQuery 的交互元素：\n\n* **事件监听器**：读者将获得为项目中的交互元素添加事件监听器的经验，例如添加项目的提交按钮和删除项目的删除按钮。我们将利用事件委托来高效处理这些事件。\n\
    * **动态更新**：将使用 jQuery 在添加或删除项目时动态更新列表。这确保了用户界面始终与底层数据同步。\n* **用户反馈**：我们将实现反馈机制来告知用户添加和删除操作成功。这可以包括视觉提示或信息性消息。\n\
    * **验证**：我们将添加基本的输入验证，以确保用户不会提交空或无效项目。jQuery 在执行这些检查方面起到关键作用。\n\n# 学习成果\n\n读者将使用\
    \ jQuery 创建一个功能完全的带有交互元素的动态列表。他们将在以下方面获得实践经验：\n\n* 使用 jQuery 创建交互式 Web 功能。\n*\
    \ 动态添加和删除元素。\n* 使用事件监听器处理用户交互。\n* 使用 CSS 进行样式设计和布局。\n* 实现基础输入验证。\n\n该项目是一个宝贵的实操体验，允许读者将之前章节中学习的概念应用于真实场景。这是强化\
    \ jQuery 技能并建立开发交互式 Web 应用信心的绝佳机会。\n\n![](img/fig-6.1.jpg)\n\n**图 6.1:** 使用 jQuery\
    \ 的交互列表\n\n# 练习：使用 jQuery 创建交互列表\n\n在练习中，我们将使用 jQuery 构建一个交互列表。用户将能够列表添加新项目、通过点击项目来划掉项目，并通过点击与每个项目关联的按钮来删除项目。以下是步骤：\n\
    \n### 步骤 1：列表元素的样式化\n\n我们首先为列表元素定义 CSS 样式。这包括列表项的样式、划掉项目的文本装饰以及删除按钮的外观：\n\n```css\n\
    li span {\n  padding: 5px;\n}\n.red span {\n  color: red;\n  text-decoration:\
    \ line-through;\n}\nli button {\n  font-size: 0.5em;\n  background-color: red;\n\
    \  color: white;\n}\n```\n\n### 步骤 2：HTML 结构\n\n接下来，我们为交互列表创建 HTML 结构。这包括一个无序列表\
    \ `<ul>`、一个用于添加新项目的输入框以及一个触发添加项目的按钮：\n\n```html\n<ul class=\"output\"></ul>\n\
    <input type=\"text\" value=\"test\" id=\"myIn\">\n<button id=\"btn1\">Add to List</button>\n\
    ```\n\n### 步骤 3：jQuery 事件处理\n\n我们为“Add to List”按钮（`#btn1`）添加点击事件，该事件将触发新列表项的创建：\n\
    \n```javascript\n$('#btn1').click(adder);\n```\n\n我们还初始化了一个计数器来跟踪已添加项目的数量：\n\n\
    ```javascript\nlet counter = 0;\n```\n\n### 步骤 4：添加列表项\n\n在 `adder` 函数中，我们从输入框获取值并创建一个新的列表项。`$('<li>')`\
    \ 是一个 jQuery 函数调用，创建一个新的 jQuery 对象。参数 `'<li>'` 是代表列表项元素 `<li>` 的 HTML 字符串：\n\n\
    ```javascript\nconst val = $('input').val();\nconst $li = $('<li>');\n```\n\n\
    然后，我们创建一个 `<span>` 元素来存放列表项的文本，并将文本内容设置为输入值：\n\n```javascript\nconst $el = $('<span>').text(val);\n\
    ```\n\n此外，我们创建一个文本为 `'X'` 的删除按钮 `<button>`：\n\n```javascript\nconst $btn = $('<button>').text('X');\n\
    ```\n\n### 步骤 5：点击切换类\n\n我们为 `<span>` 元素添加点击事件。当用户点击它时，切换父元素 `<li>` 的 `red` 类。该类会为文本添加红色和删除线装饰，模拟被划掉的效果：\n\
    \n```javascript\n$el.click(function(){\n  $li.toggleClass('red');\n});\n```\n\n\
    ### 步骤 6：点击按钮删除\n\n我们还为删除按钮添加点击事件。点击时，它将从列表中移除父元素 `<li>`：\n\n```javascript\n$btn.click(function(){\n\
    \  $li.remove();\n});\n```\n\n### 步骤 7：追加元素\n\n最后，我们将 `<span>` 和删除按钮添加到 `<li>`\
    \ 元素中，然后将 `<li>` 元素添加到类为 `output` 的 `<ul>` 中。这有效地向列表添加了项目：\n\n```javascript\n\
    $li.append($el).append($btn);\n$('.output').append($li);\n```\n\n我们增加计数器并更新输入框的新默认值：\n\
    \n```javascript\ncounter++;\nconst temp = `Laurence ${counter}`;\n$('input').val(temp);\n\
    ```\n\n### 步骤 8：输入验证\n\n`.trim()` 用于移除输入值前后的空格。\n\n添加了一个检查来判断修剪后的值是否为空字符串（`val\
    \ === ''`）。如果是，函数将显示警告并提前返回，防止添加空列表项：\n\n```javascript\nconst val = $('input').val().trim();\
    \ // 使用 trim() 移除任何前后的空格\nif (val === '') {\n  alert('请输入一些文本.'); // 针对空输入的简单警告\n\
    \  return; // 如果输入为空则退出函数\n}\n```\n\n现在练习已完成。用户可以使用交互元素在列表中添加、划掉和删除项目。\n\n"
- fmt: "\nBy working through this exercise, readers will gain practical experience\
    \ in creating interactive web features with jQuery, manipulating the DOM based\
    \ on user interactions, and styling elements using CSS classes. This project provides\
    \ valuable hands-on experience for web development with jQuery.\n\n## Summary\n\
    \nIn this exercise, you’ve learned how to create an interactive list using jQuery.\
    \ Users can add new items to the list, cross out items by clicking on them, and\
    \ remove items by clicking a delete button associated with each item. The exercise\
    \ is broken down into several steps, including styling the list elements with\
    \ CSS, setting up the HTML structure, and implementing jQuery event handling to\
    \ create, modify, and delete list items.\n\n## Conclusion\n\nThis chapter has\
    \ provided readers with a hands-on experience that reinforces their understanding\
    \ of jQuery concepts. By guiding readers through the creation of a dynamic list\
    \ with interactive elements, this chapter has demonstrated how to apply various\
    \ jQuery methods to modify both the content and structure of the list. Readers\
    \ have learned how to make their projects fully functional by adding event listeners\
    \ to the interactive elements. Furthermore, we’ve explored the crucial role of\
    \ CSS in styling the list and its elements, ensuring not only functionality but\
    \ also a visually appealing design.\n\nIn the next chapter, we’ll delve into CSS\
    \ properties and element attributes using jQuery. You’ll learn how to dynamically\
    \ change the appearance of page elements with the `.css()` method, manipulate\
    \ attributes with `.attr()`, and enhance interactivity by adding or removing classes\
    \ using `.addClass()`, `.removeClass()`, and `.toggleClass()`. Within the next\
    \ chapter, you’ll be introduced to modifying element styles and attributes, making\
    \ your web projects more dynamic and visually appealing.\n\n## Points to Remember\n\
    \n*   **Styling with CSS:**\n    To define CSS styles for list elements, use CSS\
    \ selectors and properties.\n    For example, you can use selectors such as `li`,\
    \ `.red`, and `li` button to target specific elements.\n    Define properties\
    \ like color, text decoration, font size, background color, and padding to style\
    \ the elements as desired.\n\n*   **HTML Structure:**\n    Create the HTML structure\
    \ using standard HTML tags.\n    Include an unordered list (`<ul>`), an input\
    \ field for adding items (`<input>`), and a button for triggering item addition\
    \ (`<button>`).\n    Assign appropriate IDs and classes to elements for easy selection\
    \ and manipulation.\n\n*   **jQuery Event Handling:**\n    Use jQuery to add event\
    \ handlers to elements.\n    For instance, to add a click event to the `Add to\
    \ List` button (`#btn1`), use `$(#btn1').click(handlerFunction);`.\n    Initialize\
    \ a counter variable to keep track of added items. You can declare it like `let\
    \ counter = 0;`.\n\n*   **Adding List Items:**\n    Retrieve input field value\
    \ using `$('input').val()`.\n    Create a new list item (`<li>`) using `$('<li>')`.\n\
    \    Create a `<span>` element to hold text using `$('<span>').text(textContent)`.\n\
    \    Create a delete button (`<button>`) using `$('button>').text('X')`.\n\n*\
    \   **Toggle Class on Click:**\n    Add a click event handler to a `<span>` element,\
    \ for example, `$span.click(clickHandler)`.\n    Use `.toggleClass('red')` to\
    \ toggle the `red` class on the parent `<li>` element.\n\n*   **Remove Item on\
    \ Button Click:**\n    Add a click event handler to the delete button, for example,\
    \ `$btn.click(clickHandler)`.\n    Inside the event handler, use `$li.remove()`\
    \ to remove the parent `<li>` element from the list.\n\n*   **Appending Elements:**\n\
    \    Append elements to each other using `.append()`, for example, `$li.append($span).append($btn)`.\n\
    \    Append the resulting `<li>` element to the `<ul>` with the class `output`\
    \ using `$('.output').append($li)`.\n\n## Multiple Choice Questions\n\n1. What\
    \ is the purpose of the `red` class in the provided CSS styles?\n```css\n.red\
    \ span {\ncolor: red;\n}\n```\nA. To set the width\nB. To change the color\nC.\
    \ To underline the text\nD. To add a margin\n\n2. What does `$(val())` do?\nA.\
    \ It adds a new item\nB. It removes the input field\nC. It retrieves the value\n\
    D. It toggles the text\n\n3. What triggers the code?\nA. Clicking on the button\n\
    B. Typing in the input field\nC. Refreshing the list\nD. Hovering over the list\n\
    \n## Answers\n\n1. B\n2. C\n3. A\n"
