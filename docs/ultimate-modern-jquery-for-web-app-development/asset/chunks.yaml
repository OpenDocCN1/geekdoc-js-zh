    \ field value using **`$(‘input’).val()`**.\n\n    Create a new list item (**`<li>`**)\
    \ using **`$(‘<li>’)`**.\n\n    Create a **`<span>`** element to hold text using\
    \ **`$(‘<span>’).text(textContent)`**.\n\n    Create a delete button (**`<button>`**)\
    \ using **`$(‘<button>’).text(‘X’)`**.\n\n*   **Toggle Class on Click:**\n\n \
    \   Add a click event handler to a **`<span>`** element, for example, **`$span.click(clickHandler)`**.\n\
    \n    Use **`.toggleClass(‘red’)`** to toggle the **`‘red’`** class on the parent\
    \ **`<li>`** element.\n\n*   **Remove Item on Button Click:**\n\n    Add a click\
    \ event handler to the delete button, for example, **`$btn.click(clickHandler)`**.\n\
    \n    Inside the event handler, use **`$li.remove()`** to remove the parent **`<li>`**\
    \ element from the list.\n\n*   **Appending Elements:**\n\n    Append elements\
    \ to each other using **`.append()`**, for example, **`$li.append($span).append($btn)`**.\n\
    \n    Append the resulting **`<li>`** element to the **`<ul>`** with the class\
    \ **`‘output’`** using **`$(‘.output’).append($li)`**.\n\n# [Multiple Choice Questions](#toc.xhtml_s88a)\n\
    \n1.  What is the purpose of the **`‘red’`** class in the provided CSS styles?\n\
    \n    `.red span {`\n\n    `color: red;`\n\n    `text-decoration: line-through;`\n\
    \n    `}`\n\n    1.  To set the background color of the list items\n\n    2. \
    \ To add a line-through decoration to crossed-out items\n\n    3.  To change the\
    \ font size of list items\n\n    4.  To underline the text of list items\n\n2.\
    \  What does the click event on the delete button (**`<button>`**) do?\n\n   \
    \ 1.  It adds a new list item\n\n    2.  It removes the input field\n\n    3.\
    \  It removes the parent **`<li>`** element from the list\n\n    4.  It toggles\
    \ the **`‘red’`** class on list items\n\n3.  What triggers the creation of a new\
    \ list item in the provided code?\n\n    1.  Clicking on the “`Add to List`” button\n\
    \n    2.  Hovering over the list item\n\n    3.  Typing in the input field\n\n\
    \    4.  Refreshing the webpage\n\n# [Answers](#toc.xhtml_s89a)\n\n1.  B) To add\
    \ a line-through decoration to crossed-out items\n\n2.  C) It removes the parent\
    \ **`<li>`** element from the list\n\n3.  A) Clicking on the “`Add to List`” button\n\
    \n# [CHAPTER 7](#toc.xhtml_c07)\n\n# [CSS Properties and Element Attributes](#toc.xhtml_c07)\n\
    \n# [Introduction](#toc.xhtml_s90a)\n\nIn this chapter, we’ll explore how to work\
    \ with CSS properties and element attributes using jQuery. This knowledge is essential\
    \ for dynamically modifying the appearance and behavior of web page elements.\n\
    \n# [Structure](#toc.xhtml_s91a)\n\nIn this chapter, we will discuss the following\
    \ topics:\n\n*   Getting and setting CSS properties with jQuery\n\n*   Getting\
    \ and setting element attributes with jQuery\n\n*   Retrieving and modifying element\
    \ dimensions with jQuery\n\n# [Getting and Setting CSS Properties with jQuery](#toc.xhtml_s92a)\n\
    \nBefore we dive into manipulation, we’ll briefly review how CSS properties determine\
    \ the visual style of web page elements.\n\n1.  **Changing CSS Properties:** jQuery\
    \ provides the **`.css()`** method, which allows us to change CSS properties of\
    \ selected elements. For instance, we can change the background color, font size,\
    \ or margins of elements. Here’s a basic example:\n\n    `$(‘.element’).css(‘background-color’,\
    \ ‘blue’);`\n\n2.  **Advanced CSS Manipulation:** Readers will learn how to perform\
    \ advanced CSS manipulations, such as animating properties or applying CSS changes\
    \ conditionally based on user interactions.\n\n# [Example: Changing Background\
    \ Color on Button Click](#toc.xhtml_s93a)\n\n**CSS:**\n\n`<style>`\n\n`.box {`\n\
    \n`width: 100px;`\n\n`height: 100px;`\n\n`background-color: lightblue;`\n\n`transition:\
    \ background-color 0.5s;`\n\n`}`\n\n`</style>`\n\n**HTML:**\n\n`<div class=”box”></div>`\n\
    \n`<button id=”changeColor”>Change Color</button>`\n\n**JS:**\n\n`$(‘#changeColor’).click(function\
    \ () {`\n\n`$(‘.box’).css(‘background-color’, ‘lightcoral’);`\n\n`});`\n\n**Explanation:**\n\
    \nIn this example, we have a div element with the class **`.box`**. Initially,\
    \ it has a light blue background color. When the Change Color button is clicked,\
    \ the jQuery **`.css()`** method is used to change the background color of the\
    \ .box element to light coral. The transition property in CSS provides a smooth\
    \ color transition effect.\n\n# [Getting and Setting Element Attributes with jQuery](#toc.xhtml_s94a)\n\
    \n**Understanding Element Attributes**: We’ll explore the concept of element attributes,\
    \ which are values that provide additional information about HTML elements, like\
    \ href for links or **`src`** for images.\n\n*   **Using** **`.attr()`**: jQuery’s\
    \ **`.attr()`** method allows us to get or set attributes of selected elements.\
    \ For example, we can change the src attribute of an image dynamically:\n\n  \
    \  `$(‘img’).attr(‘src’, ‘new-image.jpg’);`\n\n*   **Manipulating Attributes**:\
    \ We’ll demonstrate how to manipulate various attributes, including **`href`**,\
    \ **`data-*`**, and custom attributes. Readers will learn how to create interactive\
    \ elements by changing attributes based on user actions.\n\n**Example**: Toggle\
    \ Image Source\n\n**HTML**"
