    \n`});`\n\n`$(‘#btn1’).click(() => {`\n\n`if (arr.length > 0) {`\n\n`$ele = arr.shift();`\n\
    \n`$(‘.div4’).append($ele);`\n\n`}`\n\n`$(‘input’).attr({`\n\n`type: ‘number’,`\n\
