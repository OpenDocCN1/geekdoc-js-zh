    # [**`Hide`** and **`Show`** Methods](#toc.xhtml_s27a)


    jQuery provides the **`.hide()`** and .**`show()`** methods, which are used to
    control the visibility of HTML elements on a web page. These methods are commonly
    employed in web development to create interactive and dynamic user interfaces.


    **`.hide()`**: Concealing Elements


    The **`.hide()`** method does precisely what its name suggests – it conceals elements
    from view by setting their CSS display property to none. Here is how you can use
    it:


    `$(“#elementToHide”).hide();`


    The **`.hide()`** method is used to hide one or more selected elements by modifying
    their CSS properties, particularly the display property. When you hide an element
    using **`.hide()`**, it becomes invisible and no longer takes up space in the
    layout. Here is how it works:


    `$(selector).hide(speed, callback);`


    **`selector`**: This is a jQuery selector that specifies the element(s) you want
    to hide. It can be an element type, class, ID, or any other valid selector.


    **`speed`** (optional): This parameter specifies the speed of the hiding animation.
    It can be one of the following values:


    **`slow`**: Slow animation (600 milliseconds)


    **`fast`**: Fast animation (200 milliseconds)


    A numeric value: The duration of the animation in milliseconds


    **`callback`** (optional): This is a function that gets executed after the **`.hide()`**
    operation is complete.


    **Example:**


    `// Hide a specific element with ID “myElement” slowly`


    `$(“#myElement”).hide(“slow”);`


    `// Hide all <div> elements with class “hidden” quickly`


    `$(“div.hidden”).hide(“fast”);`


    **`.show()`**: Revealing Hidden Elements


    Conversely, the **`.show()`** method reveals hidden elements by changing their
    display property back to its default value, which is usually block or inline.
    Its usage is straightforward:


    `$(“#elementToShow”).show();`


    The **`.show()`** method is used to display one or more selected elements that
    have previously been hidden using **`.hide()`** or were initially hidden by default.
    It reverses the effect of the **`.hide()`** method, making the element(s) visible
    again. Here is how it works:


    `$(selector).show(speed, callback);`


    **`selector`**: This is a jQuery selector that specifies the element(s) you want
    to display.


    **`speed`** (optional): This parameter specifies the speed of the showing animation,
    just like in **`.hide()`**.


    **`callback`** (optional): This is a function that gets executed after the **`.show()`**
    operation is complete.


    **Example:**


    `// Show a specific element with ID “myElement” slowly`


    `$(“#myElement”).show(“slow”);`


    `// Show all <div> elements with class “visible” quickly`


    `$(“div.visible”).show(“fast”);`


    *   Toggle Visibility: **`.hide()`** and **`.show()`** are often used together
    to toggle the visibility of elements. For example, you can hide a form when a
    **`Hide`** button is clicked and then show it again when a **`Show`** button is
    clicked.


    *   Creating Animations: These methods can be used to create simple animations,
    such as fading elements in and out or sliding them up and down.


    *   Building Accordion Menus: In combination with event handlers, these methods
    are used to create accordion menus where clicking one section hides others and
    reveals the clicked section.


    *   Showing and Hiding Tooltips and Popovers: Tooltips and popovers in web applications
    are often implemented using these methods to control their display.


    In summary, the **`.hide()`** and **`.show()`** methods in jQuery are fundamental
    for controlling the visibility of elements on a web page. They are versatile tools
    that can be used in various scenarios to create interactive and dynamic user interfaces.


    # [Exercise: Element hide and Show Methods and Animation effects](#toc.xhtml_s28a)


    Click elements, hide the clicked elements. Add a button that will show the elements.


    1.  Select all the **`div’s`** from the page


    2.  Select the first one using **`first()`** and the last one using **`last()`**'
