  trans: "\n\n1. `.replaceAll(‘.div3’)` 方法将所有类名为 `.div3` 的元素替换为包含 `Hello` 的新 `<h3>`\
    \ 元素。\n\n2. `.replaceWith(‘<h3>Hello 3</h3>’)` 方法将整个 `.div2` 元素替换为包含 `Hello 3`\
    \ 的新 `<h3>` 元素。\n\n## 第 2 ：克隆并添加元素\n\n当点击第二个按钮（#btn2`）时，我们将克隆 id 为 `myIn` 的输入元素，并使用\
    \ `.clone()` 和 `.prependTo()` 方法将克隆元素添加到现有元素中。\n\n```javascript\n$(‘#btn2’).click(()\
    \ => {\n  // 克隆 id 为 ‘myIn’ 的输入元素\n  const $ele = $(‘#myIn').clone();\n  // 将克隆元素打印到控制台\n\
    \  console.log($ele);\n  // 克隆最后一个输入元素并将其插入第一个 div 元素之前\n  $(‘input’).last().clone().prependTo(‘div’);\n\
    });\n```\n\n在这一步中，当点击 `#btn2` 时：\n\n1. 我们使用 `const $ele = $(‘#myIn’).clone();`\
    \ 克隆 id 为 `myIn` 的输入元素并将其存储在变量 `$ele` 中。\n2. 我们使用 `console.log($ele);` 将克隆元素打印到控制台。\n\
    3. 我们克隆最后一个输入元素（`$(‘input’).last()`），并使用 `.clone().prependTo(‘div’)` 将其插入页面内第一个\
    \ <div> 元素。\n\n这些操作演示了如何用新内容替换所选元素并克隆元素将其添加到现有元素中，从而增强网页的动态性。\n\n# 结论\n\n我们引入了\
    \ `.html()` 和 `.text()` 方法，这些方法对于操作元素的内部 HTML 和文本内容至关重要。这些方法不仅允许获取当前内容，还能用新数据更新这些内容。\n\
    \n我们讨论了如 `.append()`、`.prepend()`、`.after()` 和 `.before()` 等方法，每个方法在插入新内容相对于所选元素的位置方面都具有独特用途。本节对于想要创建动态、内容丰富的网页的开发者来说特别具有洞察力。它强调了\
    \ jQuery 在简化 DOM 操作过程中的作用，与传统的 JavaScript 编码相比，它使其更易于使用且更不容易出错。\n\n接下来，“DOM 操作与选择”是寻求精通\
    \ jQuery 的 Web 开发者的关键章节。jQuery 是一个以简化客户端脚本编写而闻名的强大 JavaScript 库。本章深入探讨了 jQuery\
    \ 在选择和操作网页文档对象模型 (DOM) 方面的功能。它首先介绍了基础但强大的 jQuery 选择器，这些选择器允许开发者使用简单的语法轻松地定位和目标定\
    \ HTML 文档中的元素。随后，本章深入研究了各种 DOM 操作方法，演示了如何使用 jQuery 动态且交互式地更改元素属性、样式和内容。本章对于理解\
    \ jQuery 如何简化与网页元素交互的流程至关重要，是创建响应式和交互式 Web 应用程序的无具价值的资源。\n\n# 单选题\n\n1. 使用哪种 jQuery\
    \ 方法获取或设置元素的 HTML 内容？\n   1. `.html()`\n   2. `.content()`\n   3. `.innerHTML()`\n\
    \   4. `.getText()`\n\n2. jQuery 中使用哪个方法获取或设置元素的文本内容？\n   1. `.text()`\n   2.\
    \ `.textContent()`\n   3. `.innerText()`\n   4. `.getString()`\n\n3. 在 jQuery\
    \ 中如何将内容插入到匹配元素集中的每个元素的末尾？\n   1. `.appendTo()`\n   2. `.prependTo()`\n   3. `.after()`\n\
    \   4. `.append()`\n\n4. 使用哪种 jQuery 方法将内容插入到匹配元素集中的每个元素的开头？\n   1. `.prepend()`\n\
    \   2. `.before()`\n   3. `.insertBefore()`\n   4. `.startWith()`\n\n5. 使用哪种 jQuery\
    \ 方法从 DOM 中移除匹配元素集的所有节点？\n   1. `.delete()`\n   2. `.remove()`\n   3. `.empty()`\n\
    \   4. `.clear()`\n\n# 答案\n\n1. a) `.html()`\n2. a) `.text()`\n3. d) `.append()`\n\
    4. a) `.prepend()`\n5. c) `.empty()`\n\n# 第 5 章\n\n# DOM 操作与选择\n\n# 引言\n\n在本章中，我们将深入探讨使用\
    \ jQuery 进行文档对象模型 (DOM) 操作和选择的世界。在之前涵盖的基础概念的基础上，我们将探索动态修改网页结构的高级技术。在本章结束时，你将彻底理解如何利用\
    \ jQuery 的力量来有效地操作 DOM。\n\n# 结构\n\n在本章中，我们将涵盖以下主题：\n\n* 使用 jQuery 添加和移除类\n* 动态创建和修改元素\n\
    * 选择和操作多个元素\n\n# 使用 jQuery 添加和移除类\n\n在本节中，我们将探索在 HTML 中处理类（classes）的基本概念，以及 jQuery\
    \ 如何赋予我们动态从元素中添加和移除类的能力。\n\n# 理解 HTML 中的类\n\nHTML 使用 class 属性来应用 CSS 样式并将具有相似特征的元素分组。类充当钩子，允许你轻松定位并设置样式。以下是需要理解的关键点：\n\
    \n**class 属性：** 在 HTML 中，元素可以使用 class 属性被分配一个或多个类。多个类之间用空格隔开。例如：\n\n`<div class=”box\
    \ red”>这是一个红色的框。</div>`\n\n**使用 CSS 样式化：** CSS 规则通过类名定位元素，从而在多个元素之间实现一致的样式。例如，以下\
    \ CSS 规则针对类为 box 的元素：\n\n```css\n.box {\n  border: 2px solid black;\n  padding:\
    \ 10px;\n}\n```\n\n# 添加类\n\njQuery 通过 `.addClass()` 方法简化了向元素添加一个或类的过程。该方法对于动态应用\
    \ CSS 样式或识别 JavaScript 交互元素非常有价值。\n\n**语法：**\n\n`$(element).addClass(class1 [,\
    \ class2, class3, …]);`\n\n**示例：**\n\n```javascript\n// 点击时给按钮添加 ‘highlight’ 类\n\
    $(‘button’).click(function () {\n  $(this).addClass(‘highlight’);\n});\n```\n\n\
    # 移除类\n\n要从元素移除特定类，jQuery 提供了 `.removeClass()` 方法。当不再需要类或想要元素的外观和行为时，此方法非常有用。\n\
    \n**语法：**\n\n`$(element).removeClass(class1 [, class2, class3, …]);`\n\n**示例：**\n\
    \n```javascript\n// 当导航项不再激活时移除 ‘active’ 类\n$(‘.nav-item’).removeClass(‘active’);\n\
    ```\n\n通过精通 jQuery 的 `.addClass()` 和 `.removeClass()` 方法，你获得了动态设置元素样式、创建交互式用户界面并有效响应用户交互的能力。这些技术是构建动态和响应式\
    \ Web 应用的基础。\n\n# 动态创建和修改元素\n\n在本节中，我们将深入探讨 jQuery 在动态创建和修改网页文档对象模型 (DOM) 元素方面的强大。这些技术允许你增强用户界面、即时添加内容并创建真正的动态\
    \ 体验。\n\n# 创建新元素\n\n动态创建 HTML 元素是 jQuery 的核心功能。你可以生成全新的元素，指定它们的属性和内容，然后将其插入到所需的\
    \ DOM 位置中。以下是其工作原理：\n\n"
- fmt: "\n*   Creating a new element: You can create a new HTML element by specifying\
    \ its tag name within the jQuery function. For example:\n\n    `const newDiv =\
    \ $(‘<div></div>’);`\n\n*   Setting attributes: To set attributes for the new\
    \ element, you can chain the `.attr()` method. For instance:\n\n    `const newLink\
    \ = $(‘<a></a>’).attr(‘href’, ‘https://example.com’);`\n\n*   Adding content:\
    \ You can also add content to the new element by using the `.html()` or `.text()`\
    \ methods:\n\n    `const newParagraph = $(‘<p></p>’).text(‘This is a new paragraph.’);`\n\
    \n*   Inserting into the DOM: To place the newly created element into the DOM,\
    \ you can use methods like `.append()`, `.prepend()`, `.before()`, or `.after()`\
    \ on existing elements. For example:\n\n    `newDiv.appendTo(‘.container’); //\
    \ Appends newDiv to an element with class ‘container’`\n\n# [Modifying elements](#toc.xhtml_s65a)\n\
    \nOnce you have elements in the DOM, jQuery provides methods to modify them, such\
    \ as adding content or moving elements around within the page structure. Key methods\
    \ include:\n\n*   `.append()`: This method adds content or elements to the end\
    \ of the selected element. It’s commonly used for inserting elements like paragraphs,\
    \ images, or lists.\n\n    `$(‘.container’).append(‘<p>New content at the end.</p>’);`\n\
    \n*   `.prepend()`: Similar to `.append()`, `.prepend()` adds content or elements\
    \ to the beginning of the selected element.\n\n    `$(‘.container’).prepend(‘<p>New\
    \ content at the beginning.</p>’);`\n\n*   `.before()` and `.after()`: These methods\
    \ insert content or elements before or after the selected element.\n\n    `$(‘.element’).before(‘<div>Before</div>’);`\n\
    \n    `$(‘.element’).after(‘<div>After</div>’);`\n\n# [Removing elements](#toc.xhtml_s66a)\n\
    \njQuery provides methods to remove elements and their contents from the DOM.\
    \ Understanding when and how to use these methods is essential:\n\n*   `.remove()`:\
    \ This method removes the selected element and all of its descendants from the\
    \ DOM.\n\n    `$(‘.element-to-remove’).remove();`\n\n*   `.empty()`: The .empty()\
    \ method removes all child elements and content from the selected element, leaving\
    \ the element itself intact.\n\n    `$(‘.element-to-empty’).empty();`\n\nMastering\
    \ these techniques for creating, modifying, and removing elements allows you to\
    \ create dynamic and interactive web pages, respond to user actions, and dynamically\
    \ update content as needed. These skills are central to building responsive and\
    \ engaging web applications.\n\n# [Selecting and manipulating multiple elements](#toc.xhtml_s67a)\n\
    \nIn this section, we’ll delve into the world of selecting and manipulating multiple\
