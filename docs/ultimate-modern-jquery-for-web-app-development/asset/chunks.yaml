  trans: "\n\njQuery 中的 `.replaceWith()` 方法允许你用一个元素替换另一个元素，从而动态更改 DOM 结构。当你想要更新内容或用不同的元素替换元素而不影响其周围的元素时，这个方法非常有用。它的工作原理如下：\n\
    \n1. **替换元素**：要替换一个元素，可以在代表要替换元素的 jQuery 对象上调用 `.replaceWith()` 方法。例如：\n\n```javascript\n\
    const $existingElement = $(‘existing-element’);\nconst $newElement = $(‘<div>New\
    \ Content</div>’);\n$existingElement.replaceWith($newElement);\n```\n\n该代码选择类名为\
    \ `existing-element` 的现有元素，创建一个文本为 `\"New Content\"` 的新 `div` 元素，然后用这个新 `div`\
    \ 元素替换 DOM 中的现有元素。由于此操作，原始的元素将从 DOM 中移除。\n\n2. **插入新元素**：原始元素将从 DOM 中移除，并被你指定的元素元素取代。此操作在允许你动态更新内容的同时，维持了文档完整性。\n\
    \n3. **更新内容**：你可以用新内容替换元素，无论是 HTML、文本或其他元素。这通常用于动态内容加载以及在不需要刷新整个网页的情况下更新页面的部分。\n\
    \n# 移除包装元素\n\njQuery 中的 `.unwrap()` 方法允许你从所选元素周围移除不必要的包装元素，优化你的文档结构。当你想要简化 DOM\
    \ 或消除多余的容器元素时，这个方法非常有用。它的工作原理如下：\n\n1. **移除包装元素**：要移除包装元素，可以在代表要解包元素的 jQuery 对象上调用\
    \ `.unwrap()` 方法。例如：\n\n```javascript\n$(‘unwanted-wrapper’).unwrap();\n```\n\n\
    2. **优化结构**：该方法通过移除不必要的容器元素来简化 DOM 结构。它通常用于此类场景：元素最初为了样式或布局目的而被封装，但为了便于操作而需要将其解包。\n\
    \n3. **保留内容**：被解包元素的内容保持完好，仅移除包装器。这确保了你页面的内容和布局不受影响。\n\n这些高级技术让你能够轻松地执行复杂的 DOM\
    \ 操作。无论是在创建动态表单和画廊，还是优化文档结构，理解如何克隆元素、替换元素以及移除不必要的包装元素，对于构建丰富且响应式的 Web 应用程序都具有不可价值的价值。\n\
    \n# 练习：添加、移除和切换元素类\n\n在本次练习中，你将使用 jQuery 为 HTML 元素添加、移除和切换类。这些操作将帮助你理解如何响应用户交互动态操作元素类。\n\
    \n##  1 ：点击事件和 hasClass()\n\n我们首先为页面上所有的 `<div>` 元素添加一个点击事件。\n\n### HTML\n\n```html\n\
    <div class=”blue”>Click me (I’m blue)</div>\n<div>Click me (No color)</div>\n\
    <div class=”red”>Click me (I’m red)</div>\n<div>Click me (No color)</div>\n<div\
    \ class=”blue”>Click me (I’m blue)</div>\n```\n\n### CSS\n\n```css\n.blue {\n\
    \  color: blue;\n}\n.red {\n  color: red;\n}\n```\n\n### jQuery\n\n```javascript\n\
    $(div).click(function() {\n  if ($(this).hasClass(‘blue’)) {\n    $(this).removeClass(‘blue’).addClass(‘red’);\n\
    \  } else {\n    $(this).removeClass(‘red’).addClass(‘blue’);\n  }\n});\n```\n"
- fmt: "\n# Introduction\n\nIn this chapter, we’ll embark on a practical project using\
    \ jQuery, where we’ll create a dynamic list with interactive elements. This project\
    \ will allow readers to apply their knowledge of jQuery to build a real-world,\
    \ interactive feature that can be used in web applications. Let’s dive in!\n\n\
    # Structure\n\nIn this chapter, we will discuss the following topics:\n\n* Creating\
    \ a Dynamic List with jQuery\n* Interactive Elements with jQuery\n\n# Creating\
    \ a Dynamic List with jQuery\n\nIn this section, we will create a dynamic list\
    \ with jQuery:\n\n1. **Project Overview**: We’ll begin by understanding the project’s\
    \ scope. We aim to create a dynamic list that users can interact with, allowing\
    \ them to add and remove items as needed. This list will dynamically update its\
    \ content based on user actions.\n2. **HTML Structure**: We’ll define the HTML\
    \ structure for our list, including an input field for adding new items, a button\
    \ to submit new items, and an area to display the list.\n3. **CSS Styling**: We’ll\
    \ use CSS to style our list and make it visually appealing. This will include\
    \ styling the list items, buttons, and the overall layout.\n4. **jQuery for Interactivity**:\
    \ We’ll leverage jQuery to add interactivity to our list. Readers will learn how\
    \ to use jQuery methods to:\n    * **Add Items**: We’ll use `.append()` or `.prepend()`\
    \ to add new items to the list when the user submits them.\n    * **Remove Items**:\
    \ We’ll implement a mechanism to remove items from the list when the user clicks\
    \ a button associated with each item.\n\n Event Delegation\n\nEvent delegation\
    \ in jQuery is a technique used to handle events efficiently, especially when\
    \ dealing with multiple elements that trigger the same event. It’s particularly\
    \ useful in scenarios where elements are dynamically added to the DOM (that is,\
    \ not present when the page loads) or when you want to minimize the number of\
    \ event handlers you attach to elements. In traditional event handling, you attach\
    \ an event handler directly to each element. However, this approach can lead to\
    \ performance issues if there are many elements. Also, if new elements are added\
    \ dynamically, they won’t inherit these event handlers.\n\n# Interactive Elements\
    \ with jQuery\n\nHere are the interactive elements with jQuery:\n\n* **Event Listeners**:\
    \ Readers will gain experience in adding event listeners to interactive elements\
    \ within our project, such as the submit button for adding items and the delete\
    \ buttons for removing items. We’ll utilize event delegation to handle these events\
    \ efficiently.\n* **Dynamic Updates**: jQuery will be used to dynamically update\
    \ the list when items are added or removed. This ensures the user interface is\
    \ always in sync with the underlying data.\n* **User Feedback**: We’ll implement\
    \ feedback mechanisms to inform users of successful additions and removals. This\
    \ can include visual cues or informative messages.\n* **Validation**: We’ll add\
    \ basic input validation to ensure that users don’t submit empty or invalid items.\
    \ jQuery will be instrumental in performing these checks.\n\n# Learning Outcomes\n\
    \nListeners will have created a fully functional dynamic list with interactive\
    \ elements using jQuery. They will have gained practical experience in:\n\n* Creating\
    \ interactive web features with jQuery.\n* Adding and removing elements dynamically.\n\
    * Handling user interactions with event listeners.\n* Using CSS for styling and\
    \ layout.\n* Implementing basic input validation.\n\nThis project serves as a\
    \ valuable hands-on experience, allowing readers to apply the concepts learned\
    \ in previous chapters to a real-world scenario. It’s an excellent opportunity\
    \ to reinforce jQuery skills and build confidence in developing interactive web\
    \ applications.\n\n![](images/fig-6.1.jpg)\n\n**Figure 6.1:** Interactive list\
    \ using jQuery\n\n# Exercise: Create an Interactive List with jQuery\n\nIn this\
    \ exercise, we’ll build an interactive list using jQuery. Users will be able to\
    \ add new items to the list, cross out items by clicking on them, and remove items\
    \ by clicking a button associated with each item. Here are the steps:\n\n### Step\
    \ 1: Styling the List Elements\n\nWe start by defining the CSS styles for our\
    \ list elements. This includes styling for list items, the text decoration for\
    \ crossed-out items, and the appearance of the delete buttons:\n\n```css\nli span\
    \ {\n  padding: 5px;\n}\n.red span {\n  color: red;\n  text-decoration: line-through;\n\
    }\nli button {\n  font-size: 0.5em;\n  background-color: red;\n  color: white;\n\
    }\n```\n\n### Step 2: HTML Structure\n\nNext, we create the HTML structure for\
    \ our interactive list. This includes an unordered list `<ul>`, an input field\
    \ for adding new items, and a button for triggering the addition of items:\n\n\
    ```html\n<ul class=\"output\"></ul>\n<input type=\"text\" value=\"test\" id=\"\
    myIn\">\n<button id=\"btn1\">Add to List</button>\n```\n\n### Step 3: jQuery Event\
    \ Handling\n\nWe add a click event to the `Add to List` button (`#btn1`) that\
    \ will trigger the creation of a new list item:\n\n```javascript\n$('#btn1').click(adder);\n\
    ```\n\nWe also initialize a counter to keep track of the number of added items:\n\
    \n```javascript\nlet counter = 0;\n```\n\n### Step 4: Adding List Items\n\nIn\
    \ the `adder` function, we retrieve the value from the input field and create\
    \ a new list item. `$('<li>')` is a jQuery function call that creates a new jQuery\
    \ object. The argument `'<li>'` is an HTML string representing a list item element\
    \ `<li>`:\n\n```javascript\nconst val = $('input').val();\nconst $li = $('<li>');\n\
    ```\n\nThen, we create a `<span>` element to hold the text of the list item and\
    \ set its text content to the input value:\n\n```javascript\nconst $el = $('<span>').text(val);\n\
    ```\n\nAdditionally, we create a delete button `<button>` with the text `'X'`:\n\
    \n```javascript\nconst $btn = $('<button>').text('X');\n```\n\n### Step 5: Toggle\
    \ Class on Click\n\nWe add a click event to the `<span>` element. When the user\
    \ clicks on it, the class `red` is toggled on the parent `<li>`. This class adds\
    \ a red color and a line-through decoration to the text, simulating a crossed-out\
    \ item:\n\n```javascript\n$el.click(function(){\n  $li.toggleClass('red');\n});\n\
    ```\n\n### Step 6: Remove Item on Button Click\n\nWe also add a click event to\
    \ the delete button. When clicked, it removes the parent `<li>` element from the\
    \ list:\n\n```javascript\n$btn.click(function(){\n  $li.remove();\n});\n```\n\n\
    ### Step 7: Appending Elements\n\nFinally, we append the `<span>` and the delete\
    \ button to the `<li>` element, and then we append the `<li>` element to the `<ul>`\
    \ with the class `output`. This effectively adds the new item to the list:\n\n\
    ```javascript\n$li.append($el).append($btn);\n$('.output').append($li);\n```\n\
    \nWe increment the counter and update the input field with a new default value:\n\
    \n```javascript\ncounter++;\nconst temp = `Laurence ${counter}`;\n$('input').val(temp);\n\
    ```\n\n### Step 8: Validation of input\n\n`.trim()` is used to remove any leading\
    \ or trailing whitespace from the input value.\n\nA check is added to see if the\
    \ trimmed value is an empty string (`val === ''`). If it is, the function shows\
    \ an alert and returns early, preventing an empty list item from being added:\n\
    \n```javascript\nconst val = $('input').val().trim(); // Use trim() to remove\
    \ any leading/trailing whitespace\nif (val === '') {\n  alert('Please enter some\
    \ text.'); // Simple alert for empty input\n  return; // Exit the function if\
    \ input is empty\n}\n```\n\nThe exercise is now complete. Users can add, cross\
    \ out, and remove items from the list using the interactive elements.\n"
