    \ Web 应用程序各种用途。\n\n功能：此方法分配一个函数，当鼠标指针在文档上移动时执行该函数。\n解释：当鼠标指针在文档上任何位置移动时，类为 `div1`\
    \ 的 div 文本内容将显示鼠标指针当前的 X 和 Y 坐标。\n\n## 鼠标事件和悬悬\n\n练习：在元素上绑定各种鼠标移动事件。\n1. 为 `main`\
    \ 类内部的 divs 添加 `hover()` 事件。在进入时，将背景颜色更新为红色，离开时设为白色。\n2. 在 divs 上添加 `mouseup()`\
    \ 和 `mousedown()`，在不同的鼠标状态下更新文本和背景颜色。\n3. 在主元素上添加 `mouseout()` 和 `mouseleave()`，并检查它们的区别。\n\
