    \ AJAX 请求完成后执行，提供了一种处理服务器响应各个方面的方法。回调是有效管理 AJAX 响应和错误的必组成部分。以下是处理 AJAX 响应的常用回调选项的解释。\n\
    \n*   `success`：\n\n解释：当 AJAX 请求成功时，执行成功回调。它通常用于处理从服务器接收的数据。\n\n```javascript\n\
