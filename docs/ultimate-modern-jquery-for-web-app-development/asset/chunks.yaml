    \  }\n});\n\n$(‘#btn3’).click(() => {\n  $(‘main div’).find-‘*’).css-‘background-color’,\
    \ ‘purple’);\n});\n```\n\n在这次练习中，你将练习使用 jQuery 遍历 DOM 选择页面内特定元素的子元素和后代，帮助你更熟练地根据元素在\
