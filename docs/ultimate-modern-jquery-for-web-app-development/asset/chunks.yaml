  trans: "\n\n<img id=\"myImage\" src=\"image1.jpg\" alt=\"Image 1\">\n\n<button id=\"\
    toggleImage\">切换图片</button>\n\n### JS:\n\n```javascript\n$('#toggleImage').click(function\
    \ () {\n  const image = ($('#myImage');\n  const currentSrc = image.attr('src');\n\
    \  if (currentSrc === 'image1.jpg') {\n    image.attr('src', 'image2.jpg');\n\
    \    image.attr('alt', 'Image 2');\n  } else {\n    image.attr('src', 'image1.jpg');\n\
    \    image.attr('alt', 'Image 1');\n  }\n});\n```\n\n### 解析:\n\n在这个示例中，我们有一个 id\
    \ 为 `myImage` 的图像元素 `<img>`。初始情况下，它显示 `Image 1`，源属性 (src)设置为 `image1.jpg`。\n\n\
    当点击“切换图片”按钮时，将使用 jQuery 的 `.attr()` 方法执行以下操作：\n\n- 使用 `image.attr('src')` 获取 `src`\
    \ 属性的当前值，并将其存储在变量 `currentSrc` 中。\n- 检查当前源 (`currentSrc`)。\n- 如果当前源是 `image1.jpg`，则将\
    \ `src` 属性更改为 `image2.jpg` 并更新 alt 属性为 `Image 2`。否则，它将恢复为 `image1.jpg` 和 `Image\
    \ 1`。\n\n此示例演示了如何使用 `.attr()` 方法根据用户交互动态更改 HTML 元素的属性，例如在不同图片之间切换。\n\n# 使用 jQuery\
    \ 获取和修改元素尺寸\n\n**理解元素尺寸**：我们将讨论元素尺寸的概念，包括宽度、高度和定位。\n\n- **使用 `.width()`、`.height()`\
    \ 和 `.position()`**：jQuery 提供了 `.width()` 和 `.height()` 等方法来获取和修改尺寸，并使用 `.position()`\
    \ 获取元素在其父容器中的位置。示例将说明如何调整元素的大小和位置。\n- **动态布局调整**：读者将学习如何根据浏览器窗口大小或用户交互动态调整元素尺寸，从而创建响应式设计。\n\
    \n### 使用 jQuery 添加和移除 CSS 类：\n\n**添加和移除 CSS 类**：我们将深入研究 jQuery 中的 `.addClass()`\
    \ 和 `.removeClass()` 方法，这些方法允许我们从选定的元素中添加或移除 CSS 类。这些类可以定义各种样式，使得通过单个方法调用即可轻松更改元素的显示。\n\
    \n# 示例：点击按钮时切换 CSS 类\n\n### CSS:\n\n```css\n.red {\n  color: red;\n}\n.blue {\n\
    \  color: blue;\n}\n```\n\n### HTML:\n\n```html\n<p id=\"myText\">这段文字可以改变颜色。</p>\n\
    <button id=\"toggleRed\">切换红色</button>\n<button id=\"toggleBlue\">切换蓝色</button>\n\
    ```\n\n### JS:\n\n```javascript\n$('#toggleRed').click(function () {\n  $('#myText').addClass('red');\
    \ // 添加红色类\n  $('#myText').removeClass('blue'); // 移除蓝色类\n});\n$('#toggleBlue').click(function\
    \ () {\n  $('#myText').addClass('blue'); // 添加蓝色类\n  $('#myText').removeClass('red');\
    \ // 移除红色类\n});\n```\n\n### 解析:\n\n在这个示例中，我们有一个 id 为 `myText` 的段落元素 `<p>`。初始情况下，它没有应用任何类，因此文本颜色为默认值。我们还有两个按钮，“切换红色”和“切换蓝色”。\n\
    \n当点击“切换红色”按钮时，使用 jQuery 的 `.addClass('red')` 方法为 `#myText` 添加红色类，将其文本颜色更改为红色。然后，使用\
    \ `.removeClass('blue')` 在存在蓝色类时将其移除，确保只应用了红色类。\n\n反地地，当点击“切换蓝色”按钮时，使用 jQuery\
    \ 的 `.addClass('blue')` 方法为 `#myText` 添加蓝色类，将其文本颜色更改为蓝色。使用 `.removeClass('red')`\
    \ 在存在红色类时将其移除，确保只应用了蓝色类。\n\n这些示例演示了如何使用 `.addClass()` 和 `.removeClass()` 方法通过根据交互切换\
    \ CSS 类来动态更改 HTML 元素的样式。\n\n**使用 `.toggleClass()`**：`.toggleClass()` 方法为选定元素切换类的开启和关闭。这对于创建随交互改变样式的交互式元素非常有用。\n\
    \n# 练习：获取元素的样式属性\n\n### HTML:\n\n```html\n<button id=\"btn1\">按钮 1</button>\n\
    <button id=\"btn2\">按钮 2</button>\n<div>\n<div>\n```\n**图 7.1**：元素的样式属性\n\n在本次练习中，我们将探索如何使用\
    \ jQuery 与 HTML 元素的样式属性进行交互。我们将为按钮和元素添加事件以更新样式属性、生成随机颜色、获取样式属性并增加元素的宽度。\n\n###\
    \ 第 1 步：切换类并更新样式属性\n\n我们首先为两个按钮 `#btn1` 和 `#btn2` 添加点击事件。当点击时，这些按钮将分别切换所有 div\
    \ 元素的 `red` 和 `blue` 类。此外，它们还将更新宽度样式属性。\n\n```javascript\n$('#btn1').click(()\
    \ => {\n  $(div').toggleClass('red');\n  $(div').css('width', '100px');\n});\n\
    $('#btn2').click(() => {\n  $(div').toggleClass('blue');\n  $(div').css('width',\
    \ '+50');\n});\n```\n\n### 第 2 步：生成随机颜色并更新样式属性\n\n我们为页面上所有的 div 元素添加点击事件。当点击时，该事件使用\
    \ JavaScript 为 `color` 和 `background-color` 样式属性生成随机颜色。\n\n```javascript\n$(div').click(function\
    \ () {\n  const rc = '#' + Math.random().toString(16).substring(2, 8);\n  const\
    \ rc2 = '#' + Math.random().toString(16).substring(2, 8);\n  $(this).css('background-color',\
    \ rc);\n  $(this).css('color', rc2);\n  // 获取多个样式属性并将其存储在 'temp' 中。\n  const temp\
    \ = $(this).css(['color', 'background-color', 'height', 'font-size', 'width']);\n\
    \  // 创建一个 HTML 字符串来显示样式属性。\n  let elText = $(this).text();\n  let html = `<h1>${elText}</h1><ul>`;\n\
    \  for (const prop in temp) {\n    html += `<li>${prop}:${temp[prop]}</li>`;\n\
    \  }\n  html += '</ul>';\n  // 在其中一个页面元素中显示样式属性。\n  output(html);\n});\n```\n\n\
    ### 第 3 步：输出函数\n\n创建一个输出函数，在页面元素之一 `(.div4)` 中显示内容。\n\n```javascript\nfunction\
    \ output(val) {\n  $('.div4').html(val);\n}\n```\n\n### 第 4 步：测试\n\n练习已完成，用户可以交互按钮切换类并更新样式属性，点击\
    \ div 元素更改颜色并获取样式属性，以及点击 `.div4` 显示内容。\n\n通过这个练习，读者将获得使用 jQuery 更新和获取 HTML 元素样式属性的实践经验。他们还将学习如何生成随机颜色、切换类以及动态调整元素尺寸。这些技能对于创建动态且视觉良好的\
    \ Web 应用程序非常有价值。\n\n# 练习：使用 jQuery 获取和设置元素属性\n\n在本次练习中，我们将处理输入复选框和各种属性，以理解如何获取和设置元素属性。我们还将探索分离元素以后使用。\n\
    \n**说明：**\n\n使用 for 循环创建带有属性的复选框。为每个复选框添加点击事件，该事件将输出从 `checked` 属性、`checked` 属性以及使用\
    \ `is()` 方法获取的元素值。然后，将结果输出到页面。\n\n使用另一个循环创建一些输入复选框元素，然后使用 `prop()` 方法设置选中布尔值。添加点击事件以跟踪并输出结果。\n\
    \n为元素添加点击事件。通过计算该元素的点击次数来更新值。\n\n"
- fmt: "\nUsing the `detach()` method, remove an element and save it into a global\
    \ variable. Then, on a separate event, append the stored detached element to the\
    \ page again. Note that the events and properties will still be contained within\
    \ that element.\n\n### CSS:\n\n```css\n.red {\n  color: red;\n  font-size: 0.9em;\n\
    }\n.blue {\n  background-color: blue;\n}\n.box {\n  width: 200px;\n  height: 35px;\n\
    \  border: 1px solid #ddd;\n}\n```\n\n### HTML:\n\n```html\n<div class=\"div1\"\
    >Hello World 1</div>\n<div class=\"div2\">Hello World 2</div>\n<div class=\"div3\"\
    \ id=\"div3\">Hello World 3</div>\n<div class=\"div4\">Laurence Svekis</div>\n\
    <input>\n<button id=\"btn1\">1</button>\n<button id=\"btn2\">2</button>\n```\n\
    \n### JavaScript Code:\n\n```javascript\nlet counter = 0;\nconst arr = [];\nfor\
    \ (let i = 0; i < 5; i++) {\n  $('input>').attr({\n    type: 'checkbox',\n   \
    \ value: i,\n    checked: 'checked'\n  }).appendTo('.div3').click(function ()\
    \ {\n    checkerInput($(this));\n  });\n}\nfor (let i = 0; i < 5; i++) {\n  $ele\
    \ = $('<input>');\n  $ele.attr({\n    type: 'checkbox',\n    value: i\n  }).appendTo('.div4');\n\
    \  $ele.prop('checked', true);\n  $ele.click(function () {\n    checkerInput($(this));\n\
    \  });\n}\nfunction checkerInput($el) {\n  let temp = '';\n  temp += `<div>Attr\
    \ : ${$el.attr('checked')}</div>`;\n  temp += `<div>Prop : ${$el.prop('checked')}</div>`;\n\
    \  temp += `<div>Is : ${$el.is(':checked')}</div>`;\n  $('.div1').html(temp);\n\
    }\n$('.div2').click(function () {\n  counter++;\n  $('.div1').html(`<div>Counter\
    \ ${counter}</div>`);\n});\n$('.div2').click(function () {\n  console.log($(this).attr('id'));\n\
    \  const ran = Math.floor(Math.random() * 100);\n  $(this).attr('id', `id${ran}`);\n\
    });\n$('#btn1').click(() => {\n  if (arr.length > 0) {\n    $ele = arr.shift();\n\
    \    $('.div4').append($ele);\n  }\n  $('input').attr({\n    type: 'number',\n\
    \    min: '0',\n    max: '10',\n    value: '5'\n  });\n});\n$('#btn2').click(()\
    \ => {\n  $ele = $('.div1').detach();\n  arr.push($ele);\n});\n```\n\nIn this\
    \ exercise, you’ll work with checkboxes, attributes, and element manipulation\
    \ to better understand how to use jQuery for these tasks.\n\nPlease note that\
    \ the second set of HTML checkboxes will return undefined for the checked option\
    \ as the attribute checked: `'checked'` is not in the object.\n\n# Exercise: Get\
    \ the Dimensions of Page Elements with jQuery Methods\n\nIn this exercise, we\
    \ will explore how to get the dimensions and properties of page elements using\
    \ jQuery. You will add a class to page elements and use event handlers to display\
    \ various dimensions and properties when elements are clicked. Additionally, you\
    \ will use buttons to display window and document height and width values in the\
    \ console.\n\n### Instructions:\n\n1. Add a class to the page elements to apply\
    \ some common styling.\n2. Add a click event to the div elements on the page.\
    \ When an element is clicked, display within that element the following dimensions\
    \ and properties:\n    * Width\n    * Height\n    * Inner Width\n    * Inner Height\n\
    \    * Outer Width\n    * Outer Height\n    * Outer Width (including margins)\n\
    \    * Outer Height (including margins)\n3. Add a click event to the button with\
    \ the id `btn1` to display in the console the following window and document dimensions:\n\
    \    * Document Width\n    * Window Width\n    * Document Height\n    * Window\
    \ Height\n\n### CSS\n\n```css\n.box {\n  width: 200px;\n  border: 5px solid #ddd;\n\
    \  padding: 20px;\n  margin: 10px;\n}\n```\n\n### HTML\n\n```html\n<div class=\"\
    div1\">Hello World 1</div>\n<div class=\"div2\">Hello World 2</div>\n<div class=\"\
    div3\" id=\"div3\">Hello World 3</div>\n<div class=\"div4\">Laurence Svekis</div>\n\
    ```\n"
