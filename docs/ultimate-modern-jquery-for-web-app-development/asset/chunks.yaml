    ### .toggle(): Switching Between Hide and Show


    The `.toggle()` method allows you to toggle the visibility of an element with
    each click, providing a simple way to create interactive elements like expandable
    sections:


    ```javascript

    $(“#toggleElement”).toggle();

    ```


    # fadeIn and fadeOut Methods


    The `.fadeIn()`, `.fadeOut()`, and `.fadeToggle()` methods are used to create
    smooth, gradual transitions between visible and hidden states.


    ### .fadeIn(): Gradual Appearance


    The `.fadeIn()` method smoothly transitions an element from invisible to fully
    visible. You can specify the animation duration:


    ```javascript

    $(“#fadeInElement”).fadeIn(1000); // 1000 milliseconds (1 second)

    ```


    ### .fadeOut(): Gradual Disappearance


    Conversely, the `.fadeOut()` method gradually fades an element out of view. Like
    `.fadeIn()`, you can set the animation duration:


    ```javascript

    $(“#fadeOutElement”).fadeOut(1000);

    ```


    ### .fadeToggle(): Toggling Fade In/Out


    The `.fadeToggle()` method toggles between fading in and fading out. It’s ideal
    for creating toggleable elements:


    ```javascript

    $(“#fadeToggleElement”).fadeToggle(1000);

    ```

