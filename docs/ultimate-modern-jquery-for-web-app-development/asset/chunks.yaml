  trans: "\n\n```javascript\n$(“#clearMe”).empty();\n```\n\n理解这些使用 jQuery 操作元素内容的方法对于创建动态且响应式的网页至关重要。无论你是更新文本、修改\
    \ HTML 还是管理元素内的内容，jQuery 的工具都能让这些任务变得高效且易用，增强 Web 应用程序的交互性。\n\n# 练习：向页面添加新内容和元素\n\
    \n在本练习中，我们将探索使用 jQuery 向网页中添加新内容和元素的各种方法。我们还将与用户输入进行交互，并执行添加、前置和删除元素等操作。\n\n##\
    \ 第 1 ：创建新的页面元素\n\n创建一个循环来生成可点击的按钮，每个按钮显示不同的文本内容。这些按钮之后将用于与页面交互。\n\n```javascript\n\
    let counter = 0;\nfor (let i = 0; i < 10; i++) {\n  counter++;\n  const $span\
    \ = $(`<span>Hello :${counter}</span>`);\n  $span.text(‘New’);\n  $(‘.div2’).append($span);\n\
    }\n```\n\n在这一步中，我们创建了 10 个可点击的按钮，并将它们追加到类为 `.div2` 的元素中。\n\n## 第 2 步：处理按钮点击\n\n\
    为第 1 步生成的按钮绑定点击事件处理器。当按钮被点击时，它的文本内容将被打印到控制台。\n\n```javascript\nfor (let i = 0;\
    \ i < 3; i++) {\n  const $btn = $(`<button>After ${i + 1}</button>`);\n  $(‘.div4’).after($btn);\n\
    \  $btn.click(function () {\n    console.log($(this).text());\n  });\n  $(`<button>Before\
    \ ${i + 1}</button>`).insertBefore(‘.div4’).click(function () {\n    console.log($(this).text());\n\
    \  });\n}\n```\n\n在这里，我们在类为 `.div4` 的元素的前后按钮上绑定了事件处理器。当按钮被点击时，它会将文本内容记录到控制台。这演示了\
    \ `.after()`、`.insertBefore()` 和事件处理的使用。\n\n## 第 3 步：更多元素操作\n\n当点击 ID 为 `btn1`\
    \ 的第一个按钮时，获取输入元素的文本值并执行若干操作：\n\n1. 将 `.div1` 的文本内容设置为输入值。\n2. 将输入值追加到 `.div2`。\n\
    3. 将输入值前置到 `.div3`。\n4. 删除类为 `.div4` 的元素。\n\n```javascript\n$(‘#btn1’).click(()\
    \ => {\n  const val = $(‘input’).val();\n  $(‘.div1’).text(val);\n  $(‘.div2’).append(val);\n\
    \  $(‘.div3’).prepend(val);\n  $(‘.div4’).remove();\n});\n```\n\n## 第 4 步：动态元素创建\n\
    \n当点击 ID 为 `btn2` 的第二个按钮时，创建一个带有增量计数器的新 div 元素，并执行以下操作：\n\n1. 将新的 div 元素追加到 `.div3`。\n\
    2. 使用 `.appendTo()` 再次将新的 div 元素追加到 `.div3`。\n3. 将创建的 div 元素记录到控制台。\n\n```javascript\n\
    $(‘#btn2’).click(() => {\n  counter++;\n  const $div = $(`<div>Hello :${counter}</div>`);\n\
    \  $(‘.div3’).append($(`<div>Hello :${counter}</div>`));\n  $(`<div>Hello :${counter}</div>`).appendTo(‘.div3’);\n\
    \  console.log($div);\n});\n```\n\n在这一步中，我们创建了新的 div 元素，将它们追加到 `.div3`，并将其中一个元素记录到控制台，展示了\
    \ `.append()` 和 `.appendTo()`的使用。\n\n这些练习演示了在所选元素内外向网页添加新内容和元素的各种技术。它还说明了如何使用\
    \ jQuery 与用户输入进行交互并动态操作页面。\n\n# 使用 jQuery 插入元素\n\n在本节中，我们将探索使用 jQuery 向网页中插入元素的强大技术。这些方法允许你对新元素添加的位置和方式进行精细控制，使你的网页更具动态感可交互性。\n\
    \n# .after() 和 .before() 的威力\n\njQuery 中的 `.after()` 和 `.before()` 方法是在现有元素之前或之后插入新元素的重要工具。这些方法为动态内容插入开启了无限可能。以下是它们的工作原理：\n\
    \n* `.after()`：此方法允许你紧接在所选元素之后插入内容或元素。它非常适合在现有元素之后添加按钮、消息或额外内容。\n  ```javascript\n\
    \  $(‘.existing-element’).after(‘<div>New Content After</div>’);\n  ```\n\n* `.before()`：与\
    \ `.after()` 类似，`.before()` 在所选元素之前紧接插入内容或元素。它适用于在元素之前添加内容，例如前置消息或图标。\n  ```javascript\n\
    \  $(‘.existing-element’).before(‘<div>New Content Before</div>’);\n  ```\n\n\
    # 包装元素\n\n掌握使用 jQuery `.wrap()` 和 `.unwrap()` 方法包装元素的艺术对于创建布局至关重要。\n\n* `.wrap()`：此方法在所选元素周围添加一个包装元素。它对于封装元素很有用。\n\
    \  ```javascript\n  $(‘.selected-elements’).wrap(‘<div class=”wrapper”</div>’);\n\
    \  ```\n\n* `.unwrap()`：相反，`.unwrap()` 会移除父元素。\n  ```javascript\n  $($('..selected-elements’).unwrap();\n\
    \  ```\n\n# 在所选元素外部插入元素\n\n有时你需要在所选元素外部插入元素。jQuery 提供了 `.insertBefore()` 和 `.insertAfter()`\
    \ 方法来实现：\n\n* `.insertBefore()`：使用此方法在所选元素之前插入元素或内容。它对于移动或复制内容非常有价值。\n  ```javascript\n\
    \  $(‘<div>New Content</div>’).insertBefore(‘.existing-element’);\n  ```\n\n*\
    \ `.insertAfter()`：与 `.insertBefore()` 类似，`.insertAfter()` 在所选元素之后插入内容或元素，允许你重新定位内容。\n\
    \  ```javascript\n  $(‘<div>New Content</div>’).insertAfter(‘.existing-element’);\n\
    \  ```\n\n 高级技术\n\n除了之前讨论的基础技术，还有一些高级场景：\n\n* **克隆元素**：jQuery 的 `.clone()` 方法允许你创建现有元素的副本，然后将其插入页面的其他部分。\n\
    \  ```javascript\n  const $copy = $(‘original-element’).clone();\n  $copy.insertAfter(‘.target-element’);\n\
    \  ```\n\n* **根据用户交互插入元素**：你可以结合事件处理器和用户交互来动态添加元素，增强网页的交互性。\n\n这些高级技术为你提供了使用 jQuery\
    \ 创建动态、响应式和交互式网页所需的工具。\n\n# 练习：通过替换页面元素进行更新\n\n在本练习中，我们将探索使用 jQuery 操作页面元素的两种不同操作：用新内容替换选取元素，以及克隆元素并添加到现有元素中。\n\
    \n## 第 1 步：用新内容替换页面元素\n\n当点击第一个按钮（#btn1）时，我们将同时使用 `.replaceAll()` 和 `.replaceWith()`\
    \ 方法用新内容替换选取元素。\n\n```javascript\n$(‘#btn1’).click(() => {\n  // 使用 .replaceAll()\
    \ 用新内容替换所选元素\n  $(‘<h3>Hello</h3>’).replaceAll(‘.div3’);\n  // 使用 .replaceWith()\
    \ 将整个 .div2 替换为新内容\n  $(‘.div2’).replaceWith(‘<h3>Hello 3</h3>’);\n});\n```\n\n"
- fmt: "\n1. The `.replaceAll(‘.div3’)` method replaces all elements with the class\
    \ `.div3` with a new `<h3>` element containing `Hello`.\n\n2. The `.replaceWith(‘<h3>Hello\
    \ 3</h3>’)` method replaces the entire `.div2` element with a new `<h3>` element\
    \ containing `Hello 3`.\n\n## Step 2: Cloning and adding elements\n\nWhen the\
    \ second button (`#btn2`) is clicked, we will clone the input element with the\
    \ id `myIn` and add the cloned element to an existing element using the `.clone()`\
    \ and `.prependTo()` methods.\n\n```javascript\n$(‘#btn2’).click(() => {\n  //\
    \ Clone the input element with id ‘myIn’\n  const $ele = $(‘#myIn').clone();\n\
    \  // Log the cloned element to the console\n  console.log($ele);\n  // Clone\
    \ and prepend the last input element to the first div element\n  $(‘input’).last().clone().prependTo(‘div’);\n\
    });\n```\n\nIn this step, when `#btn2` is clicked:\n\n1. We use `const $ele =\
    \ $(‘#myIn’).clone();` to clone the input element with the id `myIn` and store\
    \ it in the variable `$ele`.\n2. We log the cloned element to the console using\
    \ `console.log($ele);`.\n3. We clone the last input element (`$(‘input’).last()`)\
    \ and prepend it to the first <div> element within the page using `.clone().prependTo(‘div’)`.\n\
    \nThese actions demonstrate how you can replace selected elements with new content\
    \ and clone elements to add them to existing elements, enhancing the dynamic nature\
    \ of your web page.\n\n# Conclusion\n\nWe introduced the `.html()` and `.text()`\
    \ methods, which are crucial for manipulating the inner HTML and text content\
    \ of elements. These methods not only allow for the retrieval of current content\
    \ but also enable the updating of this content with new data.\n\nWe discussed\
    \ methods like `.append()`, `.prepend()`, `.after()`, and `.before()`, each serving\
    \ a unique purpose in terms of where new content is inserted relative to selected\
    \ elements. This section is particularly insightful for developers looking to\
    \ create dynamic, content-rich web pages. It underscores jQuery’s role in simplifying\
    \ the process of DOM manipulation, making it more accessible and less error-prone\
    \ compared to traditional JavaScript coding.\n\nComing up next, “DOM Manipulation\
    \ and Selection” is a pivotal chapter for web developers seeking to master jQuery,\
    \ a powerful JavaScript library known for simplifying client-side scripting. This\
    \ chapter provides an in-depth exploration of jQuery’s capabilities in selecting\
    \ and manipulating the Document Object Model (DOM) of a web page. It starts by\
    \ introducing the basic yet powerful jQuery selectors, which allow developers\
    \ to easily locate and target elements within the HTML document using simple syntax.\
    \ Following this, the chapter dives into various methods of DOM manipulation,\
    \ demonstrating how jQuery can be used to alter element properties, styles, and\
    \ content dynamically and interactively. This chapter is crucial for understanding\
    \ how jQuery streamlines the process of interacting with web page elements, making\
    \ it an invaluable resource for creating responsive and interactive web applications.\n\
    \n# Multiple Choice Questions\n\n1. What jQuery method is used to get or set the\
    \ HTML content of an element?\n   1. `.html()`\n   2. `.content()`\n   3. `.innerHTML()`\n\
    \   4. `.getText()`\n\n2. Which method is used to get or set the text content\
    \ of an element in jQuery?\n   1. `.text()`\n   2. `.textContent()`\n   3. `.innerText()`\n\
    \   4. `.getString()`\n\n3. How do you insert content to the end of each element\
    \ in the set of matched elements in jQuery?\n   1. `.appendTo()`\n   2. `.prependTo()`\n\
    \   3. `.after()`\n   4. `.append()`\n\n4. Which jQuery method is used to insert\
    \ content at the beginning of each element in the set of matched elements?\n \
    \  1. `.prepend()`\n   2. `.before()`\n   3. `.insertBefore()`\n   4. `.startWith()`\n\
    \n5. What jQuery method would you use to remove all child nodes of the set of\
    \ matched elements from the DOM?\n   1. `.delete()`\n   2. `.remove()`\n   3.\
    \ `.empty()`\n   4. `.clear()`\n\n# Answers\n\n1. a) `.html()`\n2. a) `.text()`\n\
    3. d) `.append()`\n4. a) `.prepend()`\n5. c) `.empty()`\n\n# CHAPTER 5\n\n# DOM\
    \ Manipulation and Selection\n\n# Introduction\n\nIn this chapter, we’ll take\
    \ a deeper dive into the world of Document Object Model (DOM) manipulation and\
    \ selection using jQuery. Building upon the foundational concepts covered earlier,\
    \ we’ll explore advanced techniques to modify the structure of a web page dynamically.\
    \ By the end of this chapter, you’ll have a thorough understanding of how to wield\
    \ jQuery’s power to manipulate the DOM effectively.\n\n# Structure\n\nIn this\
    \ chapter, we will cover the following topics:\n\n* Adding and removing classes\
    \ with jQuery\n* Dynamically creating and modifying elements\n* Selecting and\
    \ manipulating multiple elements\n\n# Adding and removing classes with jQuery\n\
    \nIn this section, we’ll explore the fundamental concepts of working with classes\
    \ in HTML and how jQuery empowers us to dynamically add and remove classes from\
    \ elements.\n\n# Understanding classes in HTML\n\nHTML uses the class attribute\
    \ to apply CSS styles and group elements with similar characteristics. Classes\
    \ act as hooks, allowing you to target and style elements easily. Here are key\
    \ points to understand:\n\n**Class attribute:** In HTML, elements can have one\
    \ or more classes assigned to them using the class attribute. Multiple classes\
    \ are separated by spaces. For example:\n\n`<div class=”box red”>This is a red\
    \ box.</div>`\n\n**Styling with CSS:** CSS rules target elements by their class\
    \ names, enabling consistent styling across multiple elements. For instance, the\
    \ following CSS rule styles all elements with the class box:\n\n```css\n.box {\n\
    \  border: 2px solid black;\n  padding: 10px;\n}\n```\n\n# Adding classes\n\n\
    jQuery simplifies the process of adding one or more classes to elements using\
    \ the `.addClass()` method. This method is invaluable for applying CSS styles\
    \ dynamically or identifying elements for JavaScript interactions.\n\n**Syntax:**\n\
    \n`$(element).addClass(class1 [, class2, class3, …]);`\n\n**Example:**\n\n```javascript\n\
    // Add the class ‘highlight’ to a button when clicked\n$(‘button’).click(function\
    \ () {\n  $(this).addClass(‘highlight’);\n});\n```\n\n# Removing classes\n\nTo\
    \ remove specific classes from elements, jQuery provides the `.removeClass()`\
    \ method. This is useful when classes are no longer needed or when you want to\
    \ alter the appearance or behavior of elements.\n\n**Syntax:**\n\n`$(element).removeClass(class1\
    \ [, class2, class3, …]);`\n\n**Example:**\n\n```javascript\n// Remove the class\
    \ ‘active’ from a navigation item when it’s no longer active\n$(‘.nav-item’).removeClass(‘active’);\n\
    ```By understanding the role of classes in HTML and mastering jQuery’s `.addClass()`\
    \ and `.removeClass()` methods, you gain the ability to dynamically style elements,\
    \ create interactive user interfaces, and respond to user interactions effectively.\
    \ These techniques are fundamental to building dynamic and responsive web applications.\n\
    \n# Dynamically creating and modifying elements\n\nIn this section, we’ll delve\
    \ into the power of jQuery when it comes to dynamically creating and modifying\
    \ elements within the Document Object Model (DOM) of a web page. These techniques\
    \ allow you to enhance user interfaces, add content on the fly, and create truly\
    \ dynamic web experiences.\n\n# Creating new elements\n\nDynamically creating\
    \ HTML elements is a core capability of jQuery. You can generate entirely new\
    \ elements, specify their attributes and content, and then insert them into the\
    \ DOM at the desired location. Here’s how it works:\n"
