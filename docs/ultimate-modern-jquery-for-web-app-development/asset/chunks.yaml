    `});`


    **Explanation:**


    In this example, we have an image element (**`<img>`**) with the id of **`myImage`**.
    Initially, it displays “**`Image 1`**” with the source attribute (src) set to
    “**`image1.jpg`**.”


    When the “**`Toggle Image`**” button is clicked, the jQuery **`.attr()`** method
    is used to:


    Get the current value of the **`src`** attribute using **`image.attr(‘src’)`**
    and store it in the **`currentSrc`** variable.


    Check the current source (**`currentSrc`**).


    If the current source is “**`image1.jpg`**,” it changes the **`src`** attribute
    to “**`image2.jpg`**” and updates the alt attribute to “**`Image 2`**.” Otherwise,
    it reverts to “**`image1.jpg`**” and “**`Image 1`**.”


    This example demonstrates how to use the **`.attr()`** method to dynamically change
    attributes of HTML elements based on user interactions, such as toggling between
    different images.


    # [Retrieving and Modifying Element Dimensions with jQuery](#toc.xhtml_s95a)


    **Understanding Element Dimensions**: We’ll discuss the concept of element dimensions,
    including width, height, and positioning.


    *   **Using** **`.width()`**, **`.height()`**, **and** **`.position()`**: jQuery
    provides methods like **`.width()`** and **`.height()`** to retrieve and modify
    dimensions, as well as .position() to get the position of an element within its
    parent container. Examples will illustrate how to adjust the size and placement
    of elements.


    *   **Dynamic Layout Adjustments**: Readers will learn how to create responsive
    designs by dynamically adjusting element dimensions based on browser window size
    or user interactions.


    **Adding and Removing CSS Classes with jQuery:**


    Adding and Removing CSS Classes: We’ll delve into the **`.addClass()`** and **`.removeClass()`**
    methods in jQuery, which allow us to add or remove CSS classes from selected elements.
    These classes can define various styles, making it easy to change an element’s
    appearance with a single method call.


    # [Example: Toggle CSS Classes on Button Click](#toc.xhtml_s96a)


    **CSS:**


    `.red {`


    `color: red;`


    `}`


    `.blue {`


    `color: blue;`


    `}`


    **HTML:**


    `<p id=”myText”>This text can change color.</p>`


    `<button id=”toggleRed”>Toggle Red</button>`


    `<button id=”toggleBlue”>Toggle Blue</button>`


    **JS:**


    `$(‘#toggleRed’).click(function () {`


    `$(‘#myText’).addClass(‘red’); // Add the ‘red’ class`


    `$(‘#myText’).removeClass(‘blue’); // Remove the ‘blue’ class`


    `});`


    `$(‘#toggleBlue’).click(function () {`


    `$(‘#myText’).addClass(‘blue’); // Add the ‘blue’ class`


    `$(‘#myText’).removeClass(‘red’); // Remove the ‘red’ class`


    `});`


    **Explanation:**


    In this example, we have a paragraph element (**`<p>`**) with the id of **`myText`**.
    Initially, it has no CSS classes applied, so its text color is the default.


    We also have two buttons, “**`Toggle Red`**” and “**`Toggle Blue`**.”


    When the “**`Toggle Red`**” button is clicked, jQuery’s **`.addClass(‘red’)`**
    method is used to add the red class to **`#myText`**, changing its text color
    to red. Then, **`.removeClass(‘blue’)`** is used to remove the blue class if it’s
    present, ensuring that only the red class is applied.


    Conversely, when the “**`Toggle Blue`**” button is clicked, jQuery’s **`.addClass(‘blue’)`**
    method is used to add the blue class to **`#myText`**, changing its text color
    to blue. **`.removeClass(‘red’)`** is used to remove the red class if it’s present,
    ensuring that only the blue class is applied.


    These examples demonstrate how to use the **`.addClass()`** and **`.removeClass()`**
    methods to dynamically change the styling of HTML elements by toggling CSS classes
    based on user interactions.


    **Using** **`.toggleClass()`:** The **`.toggleClass()`** method toggles a class
    on and off for selected elements. This is useful for creating interactive elements
    that change style with user interactions.


    # [Exercise: Get the Style Properties of an Element](#toc.xhtml_s97a)


    **HTML:**


    `<button id=”btn1”>Button 1</button>`


    `<button id=”btn2”>Button 2</button>`


    `<div></div>`


    `<div></div>`


    ![](images/fig-7.1.jpg)


    **Figure 7.1:** Style properties of an element


    In this exercise, we’ll explore how to interact with the style properties of HTML
    elements using jQuery. We’ll add events to buttons and elements to update style
    properties, generate random colors, retrieve style properties, and increment the
    width of elements.


    **Step 1: Toggling Classes and Updating Style Properties**


    We start by adding click events to two buttons, **`#btn1`** and **`#btn2`**. When
    clicked, these buttons will toggle the **`‘red’`** and **`‘blue’`** classes on
    all div elements, respectively. Additionally, they will update the width style
    property.


    `$(‘#btn1’).click(() => {`


    `$(‘div’).toggleClass(‘red’);`


    `$(‘div’).css(‘width’, ‘100px’);`


    `});`


    `$(‘#btn2’).click(() => {`


    `$(‘div’).toggleClass(‘blue’);`


    `$(‘div’).css(‘width’, ‘+=50’);`


    `});`


    **Step 2: Generating Random Colors and Updating Style Properties**


    We add a click event to all div elements on the page. When clicked, this event
    generates random colors for the color and background-color style properties using
    JavaScript code.


    `$(‘div’).click(function () {`


    `const rc = ‘#’ + Math.random().toString(16).substring(2, 8);`


    `const rc2 = ‘#’ + Math.random().toString(16).substring(2, 8);`


    `$(this).css(‘background-color’, rc);`


    `$(this).css(‘color’, rc2);`


    `// Retrieve multiple style properties and store them in ‘temp’.`


    `const temp = $(this).css([‘color’, ‘background-color’, ‘height’, ‘font-size’,
    ‘width’]);`


    `// Create an HTML string to display the style properties.`


    `let elText = $(this).text();`


    ``let html = `<h1>${elText}</h1><ul>`;``


    `for (const prop in temp) {`


    ``html += `<li>${prop}:${temp[prop]}</li>`;``


    `}`


    `html += ‘</ul>’;`


    `// Display the style properties in one of the page elements.`


    `output(html);`


    `});`


    **Step 3: Output Function**


    We create an output function to display content within one of the page elements
    **`(.div4)`**.


    `function output(val) {`


    `$(‘.div4’).html(val);`


    `}`


    **Step 4: Testing**


    The exercise is complete, and users can interact with the buttons to toggle classes
    and update style properties, click on div elements to change their colors and
    retrieve style properties, and click **.`div4`** to display content.


    By working through this exercise, readers will gain practical experience in using
    jQuery to update and retrieve style properties of HTML elements. They will also
    learn how to generate random colors, toggle classes, and dynamically adjust element
    dimensions. These skills are valuable for creating dynamic and visually appealing
    web applications.


    # [Exercise: Getting and Setting Element Attributes with jQuery](#toc.xhtml_s98a)


    In this exercise, we will work with input checkboxes and various attributes to
    understand how to get and set element properties. We’ll also explore event handling
    and detaching elements for later use.


    **Instructions:**


    Using a for loop, create checkboxes with attributes. Add a click event to each
    checkbox that will output the value of the element from the attribute of “**`checked`**,”
    the property of “**`checked`**,” and using the **`is`** method for the **`checked`**
    state. Then, the output results to the page.


    Using another loop, create some input checkbox elements, and then using the **`prop()`**
    method, set the checked Boolean value. Add a click event to track and output the
    checked results.


    Add a click event to an element. Update the value by counting the clicks on that
    element.'
