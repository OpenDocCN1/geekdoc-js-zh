  raw: 'The **`.slideUp()`** method hides elements by sliding them up. You can control
    the animation duration:


    `$(“#slideUpElement”).slideUp(1000);`


    **`.slideDown()`**: Reveal with Slide


    On the flip side, **`.slideDown()`** reveals elements by sliding them down. Animation
    duration is customizable:


    `$(“#slideDownElement”).slideDown(1000);`


    .**`slideToggle()`**: Toggle Sliding


    The .**`slideToggle()`** method toggles between sliding an element up and down.
    It’s perfect for creating collapsible sections:


    `$(“#slideToggleElement”).slideToggle(1000);`


