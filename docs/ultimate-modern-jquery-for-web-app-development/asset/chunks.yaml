  trans: "\n7. **应用面板 (Application Panel)**：此部分用于检查所有加载的资源，包括 IndexedDB 或 WebSQL 数据库、本地和会话存储、cookies\
    \ 以及缓存。\n\n8. **审计面板 (Audits Panel)**：现在被称为 Lighthouse，该工具会对页面进行分析，并生成关于性能、可用性、渐进式\
    \ Web 应用（PWA）、SEO 等报告。\n\n9. **设备模式 (Device Mode)**：模拟你的网页在不同设备和屏幕尺寸下的显示和行为。\n\
    \n10. **个性化与设置 (Customization and Settings)**：自定义 DevTools 以适应你的工作流。你可以将面板固定在屏幕的不同部分、更改主题，甚至添加扩展以获得额外功能。\n\
    \n![](img/fig-1.2.jpg)\n\n**图 1.2：** DevTools\n\n这些工具对于 Web 开发、调试以及学习更多 Web 技术非常有帮助。请记住，这只是一个概述；每个面板都提供了深层功能供探索。\n\
    \n# 结论\n\n当我们结束这个介绍性章节时，你已经迈出了进入 jQuery 世界的第一步，这个工具将彻底改变你的 Web 开发方式。你已经掌握了 jQuery\
    \ 的精髓以及它在现代 Web 开发中不可或缺的原因，并获得了将其无缝集成到你项目中的实用技能。无论你选择下载 jQuery 还是利用内容传输网络（CDN）的效率，你现在都拥有利用\
    \ jQuery 力量的关键资源。旅程刚刚开始，接下来的章节将深入探讨 jQuery 的功能，让你能够构建迷人的、交互式的 Web 应用，同时简化你的开发工作流。所以，系好安全带，jQuery\
    \ 的冒险才刚刚开始，还有许多可以探索和创造的内容。\n\n接下来的章节将深入探索使用 jQuery 进行网页操作，从理解文档对象模型（DOM）开始，DOM\
    \ 是一种表示网页元素的树形结构。该章节对于 Web 内容操作至关重要，它解释了 jQuery 多能的选择器，这些选择器通过属性、ID、类或关系来定位 HTML\
    \ 元素，并附有完整的语法和示例。随后它将深入研究操作这些选中的元素，详细介绍了如何修改内容、样式和属性，并讨论了从 DOM 中添加或删除元素。此外，它涵盖了\
    \ jQuery 的 DOM 遍历方法，用于根据关系上下文遍历 DOM 树定位元素，这对于动态内容操作至关重要。该章节还引入了 jQuery 的事件处理，说明了如何与点击和键盘输入等用户操作交互，从而增强网页的交互性。此外，它强调了链式调用多个\
    \ jQuery 方法的力量，以实现简洁且易读的代码。最后，它对在 DOM 操作中使用 jQuery 的最佳实践进行了总结，强调了性能和可维护代码的重要性，为希望通过\
    \ jQuery 增强其 Web 开发技能的开发者提供了全面的指南。\n\n# 第 2 章\n\n## jQuery 页面元素选择与 DOM 元素选择\n\n\
    ### 引言\n\n欢迎来到至关重要的章节，我们将深入探讨 jQuery 的核心：选择页面元素和遍历文档对象模型（DOM）的艺术。在本章中，我们将探索 jQuery\
    \ 核心的基础工具，从通过标签、类或 ID 定位元素的基础选择器（Basic Selectors）开始。我们将进展到属性选择器（Attribute Selectors）和伪选择器（Pseudo\
    \ Selectors），揭示根据属性或状态精确定位元素的更复杂方法。此外，我们将通过 jQuery 的遍历技术遍历 DOM，增强我们动态查找和操作元素的能力。最后，我们以元素过滤（Filtering\
    \ Elements）结束课程，为针对更复杂、更响应式的 Web 界面精炼选择提供更深入的理解。\n\n### 结构\n\n在本章中，我们将讨论以下主题：\n\
    \n* 基础选择器\n* 属性选择器\n* 伪选择器\n* 使用 jQuery 遍历 DOM 元素\n* 使用 jQuery 过滤元素\n\n## 使用 jQuery\
    \ 选择页面元素与 DOM 元素选择\n\n在 Web 开发领域，选择和操作 DOM 元素的能力是至关重要的。jQuery 为开发者提供了强大的工具，可以轻松导航和操作文档对象模型（DOM），从而实现动态且丰富的\
    \ Web 体验。在本章中，我们将深入研究使用 jQuery 选择 DOM 元素的艺术。\n\n### 基础选择器\n\n在网页上选择元素是 jQuery\
    \ 能力的核心。基础选择器允许你通过 HTML 标签、类和 ID 定位元素。以下是实现方法的概览：\n\n```javascript\n// 按标签选择\n\
    $(\"p\") // 选择所有 <p> 元素\n\n// 按类选择\n$(\".highlight\") // 选择类为“highlight”的元素\n\n\
    // 按 ID 选择\n$(\"#header\") // 选择 ID 为“header”的元素\n```\n\n**练习**：进行页面元素选择：\n\n\
    1. 创建一个 HTML 文件进行交互，其中包含带有 ID 和类的元素。\n2. 使用标签、类和 ID 选择元素。将 jQuery 元素对象输出到控制台。\n\
    3. 创建变量并分配 jQuery 元素对象，将其输出到页面。\n\n**HTML：**\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head><title>jQuery 课程</title></head>\n<body>\n<div>Hello World 1</div>\n<div\
    \ class=\"div2\">Hello World 2</div>\n<div id=\"div3\">Hello World 3</div>\n<script\
    \ src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js\"></script>\n\
    <script src=\"app2.js\"></script>\n</body>\n</html>\n```\n\n**APP2.JS**\n\n```javascript\n\
    console.log($(\"div\"));\n$(\"div\").html(\"Hello\");\nconsole.log($(\".div2\"\
    ));\nconsole.log($(\"#div3\"));\nconsole.log($(\"#div3, .div2\"));\nconst $ele1\
    \ = $(\"div\");\nconsole.log($ele1);\n$ele1.html(\"Hello 2\");\nconst $ele2 =\
    \ $(\".div2\");\nconsole.log($ele2);\nconst $ele3 = $(\"#div3\");\nconsole.log($ele3);\n\
    const $ele4 = $(\"#div3, .div2\");\nconsole.log($ele4);\n```\n\n### 属性选择器\n\n\
    属性选择器允许你根据属性及其值定位元素。这在处理输入验证和自定义时特别有用：\n\n```javascript\n// 按属性选择\n$(\"input[type='text']\"\
    ) // 选择所有文本输入\n\n// 选择特定属性\n$(\"[data-toggle]\") // 选择带有“data-toggle”属性的元素\n```\n\
    \n**练习**：使用属性选择：\n\n**HTML：**\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
    <head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n<title>属性选择器示例</title>\n<script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"\
    ></script>\n</head>\n<body>\n<h1>属性选择器示例</h1>\n<button data-toggle=\"modal\">打开模态框</button>\n\
    <button data-toggle=\"sidebar\">打开侧边栏</button>\n<script src=\"script.js\"></script>\n\
    </body>\n</html>\n```\n\n**JavaScript (script.js):**\n\n```javascript\n$(document).ready(function()\
    \ {\n  // 为带有 data-toggle 属性的元素绑定点击事件\n  $(\"[data-toggle]\").click(function()\
    \ {\n    const target = $(this).data(\"toggle\");\n    alert(`切换 ${target}`);\n\
    \  });\n});\n```\n\n"
- fmt: "\nTo run the exercise, create the HTML and JavaScript files in the same directory,\
    \ and open the HTML file in a web browser. When you click the `Open Modal` or\
    \ `Open Sidebar` button, you’ll see an alert message indicating which element\
    \ was toggled. This exercise demonstrates how to use the attribute selector to\
    \ target elements based on their data attributes.\n\n# Pseudo Selectors\n\nPseudo\
    \ selectors offer dynamic selection based on element states, such as `:hover`,\
    \ `:first-child`, and `:nth-child`:\n\n```javascript\n// Select the first <li>\
    \ element inside <ul>\n$(\"ul li:first-child\")\n```\n\n```javascript\n// Select\
    \ odd-numbered <tr> elements in a table\n$(\"table tr:nth-child(odd)\")\n```\n\
    \n**Exercise**: Using jQuery, select the first list item and change its background\
    \ color to blue:\n\n**HTML:**\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
    <head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n<title>Change CSS with jQuery</title>\n<script src=\"\
    https://code.jquery.com/jquery-3.6.0.min.js\"></script>\n</head>\n<body>\n<h1>Change\
    \ CSS with jQuery</h1>\n<ul>\n<li>Item 1</li>\n<li>Item 2</li>\n<li>Item 3</li>\n\
    </ul>\n<script src=\"script.js\"></script>\n</body>\n</html>\n```\n\n**JavaScript\
    \ (script.js):**\n\n```javascript\n$(document).ready(function() {\n  // Change\
    \ CSS for the first list item\n  $(\"ul li:first-child\").css(\"color\", \"blue\"\
    );\n});\n```\n\nIn this example, we have an unordered list with three list items.\
    \ The jQuery code in the `script.js` file uses the selector `$(\"ul li:first-child\"\
    )` to target the first list item. It then uses the `.css()` method to change the\
    \ text color of the first list item to blue.\n\nTo run the example, create the\
    \ HTML and JavaScript files in the same directory, and open the HTML file in a\
    \ web browser. You’ll see a list with three items, and the text color of the first\
    \ item will be changed to blue. This example demonstrates how to use jQuery to\
    \ change the CSS properties of specific elements in a list.\n\n# DOM Traversal\n\
    \njQuery simplifies the process of navigating the DOM hierarchy, allowing you\
    \ to traverse through parent, children, and sibling elements with ease:\n\n```javascript\n\
    // Select the parent of an element\n$(\"#childElement\").parent()\n```\n\n```javascript\n\
    // Select all direct children of an element\n$(\"ul\").children()\n```\n\n```javascript\n\
    // Select the next sibling of an element\n$(\".current\").next()\n```\n\nHere\
    \ are the steps for Traversing Ancestors of Page Elements using parent methods\
    \ with jQuery:\n\n**Exercise**: Traverse to the ancestors of the selected element\
    \ moving up towards the parent HTML element.\n\n1. Select the button element,\
    \ and when clicked, output the length of the `parent()` and `parents()`.\n2. Select\
    \ the elements that are ancestors of the element using `parentsUntil()` and select\
    \ an element to stop at.\n3. Use the `each()` to loop through the array of elements.\
    \ Add a class to all the elements that are ancestors of the second button and\
    \ have a class of main.\n\n**HTML:**\n\n```html\n<!DOCTYPE html>\n<html>\n<head><title>jQuery\
    \ Course</title>\n<style>\n.box{\nwidth:200px;\nborder:5px solid #ddd;\npadding:20px;\n\
    margin:10px;\n}\n</style>\n</head>\n<body><nav class=\"main\">\n<div class=\"\
    main\">\n<div xclass=\"div1\">Hello World 1</div>\n<div class=\"div2\"><span>Hello\
    \ World 2</span></div> <div class=\"div3\" id=\"div3\">Hello World 3</div> <div\
    \ class=\"div4\">Laurence Svekis</div>\n<input >\n<div class=\"main\">\n<button\
    \ id=\"btn1\">1</button>\n<button id=\"btn2\">2</button>\n</div>\n<button id=\"\
    btn1\">3</button>\n</div></nav>\n<button id=\"btn1\">4</button>\n<script src=\"\
    https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js\"></script>\n\
    <script src=\"app14.js\"></script>\n</body>\n</html>\n```\n\n**app14.js**\n\n\
    ```javascript\n$('#btn1').click(function(){\n  console.log($(this).parent().length);\n\
    \  console.log($(this).parents().length);\n  console.log($(this).parents());\n\
    \  console.log($(this).parents('.main'));\n  console.log($(this).parentsUntil('nav'));\n\
    })\n$('#btn2').click(function(){\n  $(this).parents('.main').each(function(){\n\
    \    $(this).addClass('parent');\n  })\n})\n```\n\n# Filtering Elements\n\nRefine\
    \ your selections by filtering elements that meet specific conditions. This enhances\
    \ precision in manipulating parts of your webpage:\n\n- Filter by even-numbered\
    \ elements: `$(\"filter(\":even\")`\n- Filter by elements containing text: `$(\"\
    filter(\":contains('jQuery'))`\n\n**Exercise**: Using filtering to make selection\
    \ of specific elements and traverse:\n\n1. Add click events to five buttons.\n\
    2. On clicking the first button, select an element collection then traverse to\
    \ `first()`, `last()`, and `eq()` for selecting a specific element using position\
    \ in the collection, and apply styling to the elements.\n3. On clicking the second\
    \ button, use `filter()` to select matching results and apply styling to the elements.\n\
    4. On clicking the third button, select the elements from the collection that\
    \ do not match and apply styling to the elements.\n5. For the fourth and fifth\
    \ buttons, try out variations of `filter()` and `not()` to make element selections\
    \ and apply styling to the results.\n\n**HTML:**\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>jQuery Course</title>\n<style>\n.box {\nborder:1px solid\
    \ #ddd;\npadding:5px;\ncolor: red;\n}\n.box1 {\nborder:1px solid #ddd;\npadding:5px;\n\
    color: blue;\n}\n.box2 {\nborder:1px solid #ddd;\npadding:5px;\ncolor: green;\n\
    }\n</style>\n</head>\n<body><nav>\n<div class=\"main\">\n<div class=\"div1\">Hello\
    \ World 1</div>\n<div class=\"div2\"><span>Hello World 2</span></div> <div class=\"\
    div3\" id=\"div3\">Hello World 3</div> <div class=\"div4\">Laurence Svekis</div>\n\
    <input>\n<button id=\"btn1\">1</button>\n<button id=\"btn2\">2</button>\n<button\
    \ id=\"btn3\">3</button>\n<span>Hello</span>\n</div></nav>\n<button id=\"btn4\"\
    >4</button>\n<button id=\"btn5\">5</button>\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js\"\
    ></script>\n<script src=\"app16.js\"></script>\n</body>\n</html>\n```\n\n**app16.js**\n\
    \n```javascript\n$('#btn1').click(function(){\n  console.log($(\".main\").children());\n\
    \  $main = $(\".main\").children();\n  $main.first().css('color', 'red');\n  $main.last().css('color',\
    \ 'blue');\n  $main.eq(7).css('color', 'green');\n  $main.eq(6).css('background-color',\
    \ 'green');\n})\n$('#btn2').click(function(){\n  $main = $(\".main\").children();\n\
    \  $btns = $main.filter('button');\n  $main.filter('button').css('background-color',\
    \ 'black'); $btns.css('color', 'white');\n})\n$('#btn3').click(function(){\n \
    \ $main = $(\".main\").children();\n  $btns = $main.not('button');\n  $main.not('button').css('background-color',\
    \ 'purple'); $btns.css('color', 'white');\n})\n$('#btn4').click(function(){\n\
    \  $(\".main div\").not('.div1').css('color', 'red'); })\n$('#btn5').click(function(){\n\
    \  $(\".main div\").filter('div').css('color', 'green'); })\n```\n\n# Chaining\
    \ Methods\n\nOne of jQuery’s strengths lies in its method chaining, enabling you\
    \ to combine multiple methods into a single, concise line of code:\n\n```javascript\n\
    // Chain methods to select and manipulate an element\n$$(\"#myElement\").addClass(\"\
    highlight\").slideUp(1000);\n```\n\n**Exercise**: How to chain multiple methods\
    \ together:\n\n**HTML:**\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    <meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n<title>Chaining Methods with jQuery</title>\n<script src=\"\
    https://code.jquery.com/jquery-3.6.0.min.js\"></script>\n</head>\n<body>\n<h1>Chaining\
    \ Methods with jQuery</h1>\n<div id=\"box\"></div>\n<button id=\"animateButton\"\
    >Animate</button>\n<script src=\"script.js\"></script>\n</body>\n</html>\n```\n"
