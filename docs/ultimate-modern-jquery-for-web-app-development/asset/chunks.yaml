    - response


    3. Which shorthand method is commonly used to retrieve?

    - `send()`

    - `fetch()`

    - `getJSON()`

    - `request()`


    4. Using `post()`, what type of request is being made?

    - GET request

    - POST request

    - PUT

    -- DELETE


    5. What is the purpose of “success” callback in AJAX?

    - To handle errors

    - To perform actions after the request is complete

    - To send data to the server

    - To handle


    6. What is the main advantage of using shorthand methods `get()` and `post()`
    in jQuery?

    - They can handle any request

    - They are more secure

    - They simplify the code and make it readable

    - They provide better performance


    ## Answers


    1. b) Asynchronous JavaScript and XML

    2. c) The response

    3. c) `getJSON()`

    4. b) POST request

    5. d) To handle

    6. c) They simplify the code and make it readable

