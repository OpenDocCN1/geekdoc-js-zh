  trans: "\n\n在此练习中，你将学习如何使用 jQuery 创建动态页面元素。你将从一个字符串值数组开始，使用 jQuery 遍历这些项目并在页面上生成动态内容。\n\
    \n## 指南：\n\n1.  创建一个包含名称的字符串值数组。\n\n2.  使用 `$.each()` 方法遍历数组项。在回调函数中，将每个值作为 `<div>`\
    \ 元素添加到页面中，并为其分配类名 `box`。\n\n3.  选择所有类名为 `box` 的元素，并再次使用 `each()` 方法对它们进行迭代。\n\
    \n4.  对于每个 `box` 元素，使用 `text()` 方法选择其文本内容并将其存储在变量中。\n\n5.  使用 `empty()` 方法清空 `box`\
    \ 元素的内容。\n\n6.  创建一个包含第 4 步中存储的文本内容的 `<span>` 元素，并将其追加到 `box` 元素中。\n\n7.  为每个\
    \ `box` 元素添加两个按钮，一个文本为 `Up`，另一个文本为 `Down`。\n\n8.  为 `Up` 按钮添加点击事件。在事件处理程序内部，选择父元素的上一个兄弟元素并将其赋值给变量\
    \ `$sel`。\n\n9.  检查所选元素的长度是否大于零。如果是，则给当前 `box` 元素添加 `active` 类并让其缓慢向上滑动。当滑向上动画完成后，移除\
    \ `active` 类，使用 `insertBefore()` 将 `box` 元素插入到所选元素之前，并将其快速向下滑动。\n\n10. 为 `Down`\
    \ 按钮添加点击事件。在事件处理程序内部，选择父元素的下一个兄弟元素并将其赋值给变量 `$sel`。\n\n11. 检查所选元素的长度是否大于零。如果是，则给当前\
    \ `box` 元素添加 `active` 类并让其缓慢向上滑动。当滑向上动画完成后，移除 `active` 类，使用 `insertAfter()` 将\
    \ `box` 元素插入到所选元素之后，并将其快速向下滑动。\n\n12. 对 `box` 元素应用一些动画和样式，以获得更好的视觉效果。\n\n## CSS:\n\
    \n```css\n.btn {\n  background-color: black;\n  color: white;\n  font-size: 0.6em;\n\
    }\n.output span {\n  margin: 5px;\n}\n.active {\n  color: red;\n}\n```\n\n## HTML:\n\
    \n```html\n<div class=\"output\"></div>\n```\n\n## JavaScript 代码:\n\n```javascript\n\
    const arr = ['Laurence', 'Larry', 'Mike', 'Dave', 'Jane', 'Joe', 'Lisa', 'Jack'];\n\
    $.each(arr, (ind, val) => {\n  let html = `${ind + 1} ${val}`;\n  $('<div>').html(html).addClass('box').appendTo('.output');\n\
    });\n$('.box').each(function () {\n  $ele = $(this);\n  $par = $ele.parent();\n\
    \  const temp = $ele.text();\n  $ele.empty();\n  $('<span>').text(temp).appendTo($ele);\n\
    \  $btn1 = $('<button>').text('Up').addClass('btn').appendTo($ele);\n  $btn2 =\
    \ $('<button>').text('Down').addClass('btn').appendTo($ele);\n  $btn1.click(function\
    \ () {\n    $sel = $(this).parent().prev();\n    if ($sel.length > 0) {\n    \
    \  $(this).parent().addClass('active');\n      $(this).parent().slideUp('slow',\
    \ function () {\n        $(this).removeClass('active');\n        $(this).insertBefore($sel);\n\
    \        $(this).slideDown('fast');\n      });\n    }\n  });\n  $btn2.click(function\
    \ () {\n    $sel = $(this).parent().next();\n    if ($sel.length > 0) {\n    \
    \  $(this).parent().addClass('active');\n      $(this).parent().slideUp('slow',\
    \ function () {\n        $(this).removeClass('active');\n        $(this).insertAfter($sel);\n\
    \        $(this).slideDown('fast');\n      });\n    }\n  });\n});\n```\n\n此练习演示了如何使用\
    \ jQuery 动态创建页面元素、操作其内容并为其添加交互性。这是在网页上创建和管理动态内容的实际示例。\n\n## 结论\n\n"
- fmt: "\nThe `data()` method empowers developers to attach custom data to HTML elements\
    \ and retrieve that data when needed.\n\nSaving values into the element object\
    \ with jQuery’s `.data()` method is a fundamental concept in web development.\
    \ This method allows you to attach custom data to HTML elements, which can be\
    \ particularly useful for a wide range of applications. Let’s explore how you\
    \ can use the `.data()` method to save values into the element object and understand\
    \ why it’s a valuable tool.\n\n## Saving Values with `.data()`\n\nThe `.data()`\
    \ method in jQuery attaches additional information to DOM elements without altering\
    \ the DOM structure or the element’s presentation in the source code. You can\
    \ store any kind of data, such as strings, numbers, objects, or arrays, within\
    \ an element. Here’s how you save values into an element’s data:\n\n```javascript\n\
    $(‘#myElement’).data(‘key’, ‘value’);\n```\n\nIn this example, we associate the\
    \ string value with the key in the `#myElement` element.\n\nYou can store data\
    \ in an element using the `.data()` method. To do this, you typically select the\
    \ element you want to associate data with and call `.data(‘key’, ‘value’)`, where\
    \ ‘key’ is a unique identifier for your data, and ‘value’ is the data you want\
    \ to store.\n\n```javascript\n$(‘#myElement’).data(‘userInfo’, { name: ‘Laurence’,\
    \ age: 40, email: ‘laurence@example.com’ });\n```\n\nIn this example, we’ve associated\
    \ an object with the key `userInfo` to the HTML element with the ID `myElement`.\n\
    \n## Retrieving Data\n\nTo retrieve the stored data, you can use the .data() method\
    \ again, but this time, you don’t provide a value. You simply provide the ‘key’`\
    \ to retrieve the data associated with that key.\n\n```javascript\nconst userData\
    \ = $(‘#myElement’).data(‘userInfo’);\n```\n\nNow, the `userData` variable will\
    \ contain the object we stored earlier, allowing you to access properties like\
    \ name, age, and email.\n\n## Removing Data\n\nYou can also remove data associated\
    \ with an element by calling `.removeData(‘key’)`.\n\n```javascript\n$(‘#myElement’).removeData(‘userInfo’);\n\
    ```\n\nThis will remove the `userInfo` data associated with the element.\n\nBenefits\
    \ of using `.data()` are:\n\n* It keeps data easily readable and separate from\
    \ HTML.\n* It manages data with element and retrieves it when needed.\n* It shares\
    \ data making it easier to manage.\n* You can store various types of data.\n*\
    \ Data can be handled better within events and event-specific information.\n\n\
    ## Exercise `data()` example\n\nThe following code example is a jQuery exercise\
    \ that demonstrates how to store and retrieve the value of the text content from\
    \ clicked elements using the jQuery `data()` method. The exercise has the following\
    \ steps:\n\n1. Add a click event to all the divs: In this step, a click event\
    \ is attached to all div elements within the `.main` container. Whenever one of\
    \ these div elements is clicked, a function is executed.\n2. When the div is clicked,\
    \ get the current `text()` value and store it in the `data()`: Inside the click\
    \ event function, the current text value of the clicked div element is obtained\
    \ using `$(this).text()`. This value is then stored using the `data()` method.\
    \ The key for the data is set to `past`, and the value is the text content.\n\
    3. Update the `text()` of the element: After storing the text content in the data,\
    \ the text of the clicked div element is updated. In this exercise, the text is\
    \ updated to include a counter that keeps track of how many times the div has\
    \ been clicked. The text is modified to display the text content plus the counter.\n\
    4. Add events to the buttons to use the data value of the element and output the\
    \ `data()` value as the new `text()` of the element: There are several buttons\
    \ (`btn1`, `btn2`, `btn3`, `btn4`) provided in the HTML. Each button corresponds\
    \ to a specific div element. When a button is clicked, it retrieves the stored\
    \ data using `.data(‘past’)` which was previously stored when the associated div\
    \ was clicked. The retrieved value is then set as the new text content of the\
    \ corresponding div.\n\n**HTML Code**\n\n```html\n<nav>\n  <div class=”main”>\n\
    \    <div class=”div1”>Hello World 1</div>\n    <div class=”div2”><span>Hello\
    \ World 2</span></div> <div class=”div3” id=”div3”>Hello World 3</div>\n    <div\
    \ class=”div4”>Laurence Svekis</div>\n    <input>\n    <button id=”btn1”>1</button>\n\
    \    <button id=”btn2”>2</button>\n    <button id=”btn3”>3</button>\n    <span>Hello</span>\n\
    \  </div>\n</nav>\n<button id=”btn4”>4</button>\n<button id=”btn5”>5</button>\n\
    ```\n\n**JavaScript Code**\n\n```javascript\nlet counter = 0;\nlet temp = ‘’;\n\
    \n$(‘input’).val(‘Laurence Svekis’);\n\n$(‘.main div’).click(function() {\n  $(this).data(‘past’,\
    \ $(this).text());\n});\n\n$(‘btn1’).click(function() {\n  let val = $(.div1).data(‘past’);\n\
    \  counter++;\n  $(.div1).text(val + \" \" + counter);\n});\n\n$(‘btn2’).click(function()\
    \ {\n  let val = $(.div2).data(‘past’);\n  counter++;\n  $(.div2).text(val + \"\
    \ \" + counter);\n});\n\n$(‘btn3’).click(function() {\n  let val = $(.div3).data(‘past’);\n\
    \  counter++;\n  $(.div3).text(val + \" \" + counter);\n});\n\n$(‘btn4’).click(function()\
    \ {\n  let val = $(.div4).data(‘past’);\n  $(.div4).text(val);\n});\n```\n"
  raw: 'The `data()` method empowers developers to attach custom data to HTML elements
    and retrieve that data when needed.


    Saving values into the element object with jQuery’s **`.data()`** method is a
    fundamental concept in web development. This method allows you to attach custom
    data to HTML elements, which can be particularly useful for a wide range of applications.
    Let’s explore how you can use the **`.data()`** method to save values into the
    element object and understand why it’s a valuable tool.


    # [Saving Values with **`.data()`**](#toc.xhtml_s119a)


    The `.data()` method in jQuery attaches additional information to DOM elements
    without altering the DOM structure or the element’s presentation in the source
    code. You can store any kind of data, such as strings, numbers, objects, or arrays,
    within an element. Here’s how you save values into an element’s data:


    `$(‘#myElement’).data(‘key’, ‘value’);`


    In this example, we associate the string value with the key in the `#myElement`
    element.


    You can store data in an element using the **`.data()`** method. To do this, you
    typically select the element you want to associate data with and call **`.data(‘key’,
    ‘value’)`**, where ‘key’ is a unique identifier for your data, and ‘value’ is
    the data you want to store.


    `$(‘#myElement’).data(‘userInfo’, { name: ‘Laurence’, age: 40, email: ‘laurence@example.com’
    });`


    In this example, we’ve associated an object with the key `userInfo` to the HTML
    element with the ID `myElement`.


    # [Retrieving Data](#toc.xhtml_s120a)


    To retrieve the stored data, you can use the **`.data()`** method again, but this
    time, you don’t provide a value. You simply provide the **`‘key’`** to retrieve
    the data associated with that key.


    `const userData = $(‘#myElement’).data(‘userInfo’);`


    Now, the userData variable will contain the object we stored earlier, allowing
    you to access properties like name, age, and email.


    # [Removing Data](#toc.xhtml_s121a)


    You can also remove data associated with an element by calling **`.removeData(‘key’)`**`.`


    `$(‘#myElement’).removeData(‘userInfo’);`


    This will remove the `userInfo` data associated with the element.


    Benefits of using **`.data()`** are:


    *   It keeps data easily readable and separate from HTML.


    *   It manages data with element and retrieves it when needed.


    *   It shares data making it easier to manage.


    *   You can store various types of data.


    *   Data can be handled better within events and event-specific information.


    # [Exercise **`data()`** example](#toc.xhtml_s122a)


    The following code example is a jQuery exercise that demonstrates how to store
    and retrieve the value of the text content from clicked elements using the jQuery
    **`data()`** method. The exercise has the following steps:


    1.  Add a click event to all the divs: In this step, a click event is attached
    to all div elements within the `.main` container. Whenever one of these div elements
    is clicked, a function is executed.


    2.  When the div is clicked, get the current **`text()`** value and store it in
    the **`data():`** Inside the click event function, the current text value of the
    clicked div element is obtained using **`$(this).text()`**. This value is then
    stored using the **`data()`** method. The key for the data is set to `past`, and
    the value is the text content.


    3.  Update the **`text()`** of the element: After storing the text content in
    the data, the text of the clicked div element is updated. In this exercise, the
    text is updated to include a counter that keeps track of how many times the div
    has been clicked. The text is modified to display the text content plus the counter.


    4.  Add events to the buttons to use the data value of the element and output
    the **`data()`** value as the new **`text()`** of the element: There are several
    buttons (**`btn1`**`,` **`btn2`**, **`btn3`**`,` **`btn4`**`)` provided in the
    HTML. Each button corresponds to a specific div element. When a button is clicked,
    it retrieves the stored data using **`.data(‘past’)`**`,` which was previously
    stored when the associated div was clicked. The retrieved value is then set as
    the new text content of the corresponding div.


    **HTML Code**


    `<nav>`


    `<div class=”main”>`


    `<div class=”div1”>Hello World 1</div>`


    `<div class=”div2”><span>Hello World 2</span></div> <div class=”div3” id=”div3”>Hello
    World 3</div>`


    `<div class=”div4”>Laurence Svekis</div>`


    `<input>`


    `<button id=”btn1”>1</button>`


    `<button id=”btn2”>2</button>`


    `<button id=”btn3”>3</button>`


    `<span>Hello</span>`


    `</div>`


    `</nav>`


    `<button id=”btn4”>4</button>`


    `<button id=”btn5”>5</button>`


    **JavaScript Code**


    `let counter = 0;`


    `let temp = ‘’;`


    `$(‘input’).val(‘Laurence Svekis’);`


    `$(‘.main div’).click(function(){`


    `$(this).data(‘past’,$(this).text()); counter++;`


    `const temp = $(‘input’).val();`


    ``const html = `${temp} Counter : ${counter}`; $(this).html(html);``


    `})`


    `$(‘#btn1’).click(()=>{`


    `const val = $(‘.div1’).data(‘past’); $(‘.div1’).text(val);`


    `console.log(val);`


    `})`


    `$(‘#btn2’).click(()=>{`


    `const val = $(‘.div2’).data(‘past’); $(‘.div2’).text(val);`


    `console.log(val);`


    `})`


    `$(‘#btn3’).click(()=>{`


    `const val = $(‘.div3’).data(‘past’); $(‘.div3’).text(val);`


    `console.log(val);`


    `})`


    `$(‘#btn4’).click(()=>{`


    `const val = $(‘.div4’).data(‘past’);`


    `$(‘.div4’).text(val);`


    `console.log(val);`


    `})`


    The counter variable is initialized to keep track of how many times a div is clicked,
    and temp is also initialized but not used in this context.


    The value of the input field is set to `Laurence Svekis`.


    The click event is attached to all div elements within the .main container. When
    clicked, the text content of the div is stored in its data as “**`past`**,” and
    the text content is updated to include the counter.


    For each button `(`**`btn1`**`,` **`btn2`**`,` **`btn3`**`,` **`btn4`**`)`, a
    click event is attached. When a button is clicked, the stored data value for the
    corresponding div is retrieved and set as the new text content of that div. Additionally,
    the retrieved value is logged to the console.


    In summary, this code provides a practical exercise to learn how to store and
    retrieve data from elements and apply it to create interactive elements that keep
    track of user interactions. It showcases the use of the **`data()`** method to
    save and retrieve data and how this data can be utilized to update the text content
    of elements dynamically.


    # [Index of Page Element Index Method **`.index()`**](#toc.xhtml_s123a)


    The **`index()`** method is your toolkit for determining an element’s position
    in relation to its siblings. To use the **`index()`** method to get an element’s
    position. The **`.index()`** method in jQuery is a powerful tool that allows you
    to get an element’s position in relation to its siblings within a selected group
    of elements. This method is especially useful for identifying the position of
    an element within a list, a group of items, or any ordered collection. Let’s explore
    how you can use the **`.index()`** method to get an element’s position and leverage
    its functionalities.


    # [Using **`.index()`**](#toc.xhtml_s124a)


    The **`.index()`** method can be called on a specific element to retrieve its
    position among a set of elements. Here’s how you can use it:


    `const position = $(‘#myElement’).index();`


    In this example, position will contain the index of **`#myElement`** within the
    group of elements sharing the same parent.


    Using **`index()`** in code:


    `<ol id=”myList”>`


    `<li>Item 1</li>`


    `<li>Item 2</li>`


    `<li>Item 3</li>`


    `</ol>`


    `$(‘#myList li’).click(function() {`


    `const position = $(this).index();`


    ``alert(`You clicked item ${position + 1}`);``


    `});`


    In this example, when a list item is clicked, the code retrieves its position
    using **`.index()`** and shows an alert indicating the item’s position.


    # [Element Position](#toc.xhtml_s125a)'
