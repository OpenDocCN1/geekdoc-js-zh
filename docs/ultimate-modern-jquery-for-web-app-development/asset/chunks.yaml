    \ 点击事件：\n\n当点击 `btn1` 时，发生发生动画：\n\n*   `$(‘.div1’).text(I’m moving);`: 此行将所有类名为\
    \ `div1` 的元素的文本内容更改为 `I’m moving`。\n*   `$(‘.div1’).animate({ … }, 1000, () =>\
    \ { … });`: 这对所有类名为 `div1` 的元素进行动画处理，具有以下属性：\n    *   `left: “+=20”`: 元素向右移动 20\
    \ 像素。\n    *   `opacity: 0.5`: 元素的透明度变为 0.5（半透明）。\n    *   动画持续 1000 毫秒（1 秒）。\n\
    \    *   动画完成后，将执行回调函数，将 `div1` 元素的文本内容更改为 `STOPPED`。\n*   `$(‘.div2’).animate({\
    \ … }, 3000, () => { … });`: 这对所有类名为 `div2` 的元素进行动画处理，具有以下属性：\n    *   `left:\
    \ “+=50”`: 元素向右移动 50 像素。\n    *   `fontSize: “20px”`: 元素的字体大小变为 20 像素。\n    *\
    \   动画持续 3000 毫秒（3 秒）。\n    *   动画完成后，将执行回调函数，将 `div2` 元素的文本内容更改为 `Laurence Svekis`。\n\
    *   `$(‘.div3’).animate({ … }, 1000, () => { … });`: 这对所有类名为 `div3` 的元素进行动画处理，具有以下属性：\n\
    \    *   `top: “+=50”`: 元素向下移动 50 像素。\n    *   `width: “150px”`: 元素的宽度变为 150 像素。\n\
    \    *   `height: “150px”`: 元素的高度变为 150 像素。\n    *   动画持续 1000 毫秒（1 秒）。\n    *\
    \   动画完成后，将执行回调函数，将 `div2` 元素的文本内容更改为 `Laurence Svekis`。\n\n## 按钮 2 (`#btn2`)\
    \ 点击事件：\n\n当点击 `btn2` 时，发生以下动画：\n\n*   `$(‘.div1’).text(I’m moving).animate({\
    \ … }, 1000, () => { … });`: 此行首先将所有类名为 `div1` 的元素的文本内容更改为 `I’m moving`，然后按照以下属性对其进行动画处理：\n\
    \    *   `left: “-=50”`: 元素向左移动 50 像素。\n    *   `opacity: 1`: 元素的透明度变为 1（完全可见）。\n\
    \    *   动画持续 1000 毫秒（1 秒）。\n    *   动画完成后，将执行 `callback` 函数，将 `div1` 元素的文本内容更改为\
    \ `STOPPED`。\n*   `$(‘.div3’).animate({ … }, 1000, () => { … });`: 这对所有类名为 `div3`\
    \ 的元素进行动画处理，具有以下属性：\n    *   `top: “-=50”`: 元素向上移动 50 像素。\n    *   `width: “50px”`:\
    \ 元素的宽度变为 50 像素。\n    *   `height: “35px”`: 元素的高度变为 35 像素。\n    *   动画持续 1000\
    \ 毫秒（1 秒）。\n    *   动画完成后，将执行回调函数，将 `div2` 元素的文本内容更改为 `DONE`。\n\n总结，此代码使用 jQuery\
    \ 根据按钮点击为不同类的元素创建动画。它更改了文本内容、移动元素、更改了元素的透明度、字体大小、宽度和高度，并在动画完成后使用回调函数向用户提供反馈。\n\
    \n## 结论\n\n我们已经涵盖了 jQuery 控制元素可见性以及为网页添加动画效果的武器库。掌握了这些技术，你将能够通过引人入胜的用户界面、响应式动画和交互式内容来吸引观众。在下一章中，我们将学习如何使用\
    \ jQuery 的力量操作网页元素的内容并插入新元素。\n\n## 多选题\n\n1.  用于隐藏元素的 jQuery 方法是？\n    1.  `.hideElement()`\n\
    \    2.  `.visibility(‘hidden’)`\n    3.  `.hide()`\n2.  使用哪个方法进行显示？\n    1. \
    \ `.reveal()`\n    2.  `.show()`\n    3.  `.display()`\n3.  在 jQuery 中，如何更改内容？\n\
    \    1.  `.html()`\n    2.  `.content()`\n    3.  `.change()`\n4.  你应该使用哪个方法来淡出（fade\
    \ out）？\n    1.  `.fade()`\n    2.  `.fadeOut()`\n    3.  `.fade()`\n5.  使用哪个方法清空元素？\n\
    \    1.  `.empty()`\n    2.  `.clear()`\n    3.  `.remove()`\n\n"
- fmt: "\n```javascript\n$(“#clearMe”).empty();\n```\n\nUnderstanding these methods\
    \ for manipulating element contents in jQuery is essential for creating dynamic\
    \ and responsive web pages. Whether you’re updating text, modifying HTML, or managing\
    \ content within elements, jQuery’s tools make these tasks efficient and accessible,\
    \ enhancing the interactivity of your web applications.\n\n# [Exercise: Adding\
    \ new content and elements to the page\n\nIn this exercise, we will explore various\
    \ ways to add new content and elements to a web page using jQuery. We’ll also\
    \ interact with user input and perform operations like appending, prepending,\
    \ and removing elements.\n\n## Step 1: Creating new page elements\n\nCreate a\
    \ loop to generate clickable buttons, each displaying a different text content.\
    \ These buttons will later be used to interact with the page.\n\n```javascript\n\
    let counter = 0;\nfor (let i = 0; i < 10; i++) {\n  counter++;\n  const $span\
    \ = $(`<span>Hello :${counter}</span>`);\n  $span.text(‘New’);\n  $(‘.div2’).append($span);\n\
    }\n```\n\nIn this step, we create 10 clickable buttons and append them to the\
    \ element with the class `.div2`.\n\n## Step 2: Handling button clicks\n\nAttach\
    \ click event handlers to the buttons generated in step 1. When a button is clicked,\
    \ its text content will be logged to the console.\n\n```javascript\nfor (let i\
    \ = 0; i < 3; i++) {\n  const $btn = $(`<button>After ${i + 1}</button>`);\n \
    \ $(‘.div4’).after($btn);\n  $btn.click(function () {\n    console.log($(this).text());\n\
    \  });\n  $(`<button>Before ${i + 1}</button>`).insertBefore(‘.div4’).click(function\
    \ () {\n    console.log($(this).text());\n  });\n}\n```\n\nHere, we attach event\
    \ handlers to buttons, both after and before the element with the class `.div4`.\
    \ When a button is clicked, it logs its text content to the console. This demonstrates\
    \ the use of `.after()`, `.insertBefore()`, and event handling.\n\n## Step 3:\
    \ More element manipulation\n\nOn click of the first button with the id `btn1`,\
    \ get the text value of the input element and perform several operations:\n\n\
    1. Set the text content of `.div1` to the input value.\n2. Append the input value\
    \ to `.div2`.\n3. Prepend the input value to `.div3`.\n4. Remove the element with\
    \ the class `.div4`.\n\n```javascript\n$(‘#btn1’).click(() => {\n  const val =\
    \ $(‘input’).val();\n  $(‘.div1’).text(val);\n  $(‘.div2’).append(val);\n  $(‘.div3’).prepend(val);\n\
    \  $(‘.div4’).remove();\n});\n```\n\n## Step 4: Dynamic element creation\n\nOn\
    \ click of the second button with the id `btn2`, create a new div element with\
    \ an incremental counter and perform the following:\n\n1. Append the new div element\
    \ to `.div3`.\n2. Append the new div element to `.div3` again using `.appendTo()`.\n\
    3. Log the created div element to the console.\n\n```javascript\n$(‘#btn2’).click(()\
    \ => {\n  counter++;\n  const $div = $(`<div>Hello :${counter}</div>`);\n  $(‘.div3’).append($(`<div>Hello\
    \ :${counter}</div>`));\n  $(`<div>Hello :${counter}</div>`).appendTo(‘.div3’);\n\
    \  console.log($div);\n});\n```\n\nIn this step, we create new div elements, append\
